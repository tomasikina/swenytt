åk under de dekadenta VM-matcherna. Den farliga afrikanske agenten och hans medlöpare flyr som skuggor i natten medan polisen, troligen infiltrerad av västerländska spioner, bara publicerar bilder och vädjar om tips. Vi i partiet skulle redan ha genomfört en grundlig utrensning av alla sådana kontrarevolutionära element och deras dolda lakejer. Paranoia? Nej, bara sund vaksamhet mot borgarbrackornas eviga sabotage."}, "date": "2 juli, 23:24", "url": "https://samnytt.se/svensk-vardas-med-livshotande-skador-efter-ingripit-i-brak-polisen-jagar-afrikan", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/02212338/dk.jpg"}, {"type": "image-full", "heading": "Svensk man kritiskt skadad efter VM-firande", "summaries": {"normal": "En 32-årig man från Småland skadades svårt under ett VM-firande på en bar i Köpenhamns stadsdel Islands Brygge. Tumult uppstod under matchen mellan Norge och Elfenbenskusten, och mannen utsattes för våld. Hans tillstånd beskrivs som mycket kritiskt. Polisen har efterlyst en misstänkt man vars identitet är känd, men ingen har gripits. Anhöriga har underrättats.", "trump": "Folk, ni skulle inte tro det, men i Köpenhamn blir en svensk kille från Småland nästan ihjälslagen mitt under en fotbollsfest. Total kaos! De här liberala europeiska städerna med sin öppna-gränser-politik och identitetspolitik lockar bara till sig våld. Ingen gripna än. Patetiskt! Som president säger jag: vi behöver lag och ordning, inte den här Biden-stilen som spred sig även dit. En skam!", "stalin": "Kamrater, i det dekadenta Köpenhamn har klassfiendens fotbollsorgie urartat till blodigt tumult där en svensk arbetare nära likviderades av okända element. Detta är vad som händer när borgarbrackorna tillåter oreglerade sammankomster utan partiets vakande öga. Polisen fumlar medan folkfiender springer fria. Vi ser fiendens hand i detta kaos. Rensa ut de exploaterande byfånarna som tillåter sådant våld mot folket."}, "date": "3 juli, 00:28", "url": "https://www.gp.se/nyheter/varlden/svensk-man-svart-skadad-efter-brak-i-kopenhamn.9a75c0cb-00e2-4692-9d15-4fb64d80e9b0", "imageUrl": "https://www.gp.se/images/article/9a75c0cb-00e2-4692-9d15-4fb64d80e9b0/images/1dcUJUsNbEAIvqP1giYJB_hh8V8Y-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ukraina: Putin beordrar militären att hitta sätt att erövra Kiev", "summaries": {"normal": "Rysslands president Vladimir Putin har enligt ukrainska uppgifter beordrat militären att utarbeta nya planer för att erövra Kiev. Ett möjligt angrepp kan komma via Belarus eller från Brjanskregionen. Uppgifterna kommer efter att Ukraina attackerat en rysk satellitcentral utanför Moskva som används för underrättelseverksamhet. Kriget påverkar nu alltmer rysk vardag med drönarattacker, bränslebrist och köer vid bensinstationer, något som Putin själv har erkänt.", "trump": "Folk, ni ser det här? Den där galningen Putin försöker igen med Kiev, som om det inte var ett totalt fiasko förra gången. Han borde ha lyssnat på mig – jag hade fixat det på en vecka. Nu attackerar ukrainarna ryska olja och satelliter, och plötsligt står ryssarna i kö för bensin. Det är kaos! Biden lät det här bli ett evigt krig, men jag hade stoppat det direkt. Patetiskt!", "stalin": "Kamrater, jag ser hur de fientliga hindren i Kiev fortfarande blockerar den ryska intressesfärens oundvikliga expansion. De väststödda ukrainska banditerna angriper våra satellitcentraler som desperata råttor. Putin, denne värdige och fruktade efterträdare till imperiets järnhand, gör rätt i att rensa ut alla svagheter. Snart skall borgarbrackorna i Bryssel skaka ännu mer när den stora statens arm sträcker sig framåt. Inga folkfiender undkommer."}, "date": "2 juli, 06:57", "url": "https://www.tv4.se/artikel/1Tp56zCPZmxvvUOJeeQJj2/ukraina-putin-beordrar-militaeren-att-hitta-saett-att-eroevra-kiev", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1U7l7xy9wue9J62VxgsTTa%2Facd59980bb31927f1a6e7e75b6949d9a%2Fputin_webb.jpg&width=120"}, {"type": "image-full", "heading": "Nya språkkravet väcker oro – kan slå mot bemanningen", "summaries": {"normal": "Från 1 juli ska all personal inom äldreomsorgen arbeta för att nå en språknivå motsvarande gymnasiesvenska. Syftet är att öka kvalitet, patientsäkerhet, trygghet och de äldres delaktighet. Arbetsgivare måste stödja med språkutbildning, men fack och arbetsgivare varnar för utmaningar i en redan pressad verksamhet med personalbrist. Utbildning ska ske parallellt med arbetet, vilket kan kräva resurser och tid som saknas. Risk finns att rekryteringen försvåras om språkkravet används för att sortera bort personal.", "trump": "Det här är ett totalt misslyckande från de inkompetenta politikerna. De tvingar på oss ett språkkrav i äldreomsorgen som ingen kan genomföra. Vi har redan ingen personal, och nu ska de gå kurser mitt i kaoset? Det blir en katastrof. De borde satsa på att göra Sverige stort igen istället för att skapa nya problem. Utan resurser och bra folk kommer det att sluta i ren röra, tro mig. Jag skulle ha fixat det mycket bättre.", "stalin": "Kamrater, jag har nu beordrat att alla språkligt undermåliga element inom den socialistiska äldreomsorgen omedelbart ska lyftas till en acceptabel nivå av proletär svenska. De som motarbetar detta är fiender till folket, dolda borgarbrackor i människokropp och parasitiska bemanningsbrister som saboterar tryggheten för våra åldringar. Vi ska rensa ut alla som vägrar utvecklas, likvidera de kapitalistiska ursäkterna om tidbrist och med järnhand se till att ingen kontrarevolutionär kontrollfokus får fäste. Den som inte stödjer språkets seger stödjer folkets fiender. Skrattretande patetiskt."}, "date": "2 juli, 22:02", "url": "https://nyheter24.se/nyheter/inrikes/1496083-nya-sprakkravet-vacker-oro-kan-sla-mot-bemanningen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/158323b404b004a30200000000b004a302/2026/07/02/2375389/Matilda-Nyheter24%20-%202026-07-02T150655.410.jpg"}, {"type": "image-full", "heading": "Regeringen vill ge SVT och SR miljonstöd", "summaries": {"normal": "Regeringen föreslår ett nytt statligt stöd till SVT och SR för att täcka ökade kostnader för marksänt tv-nät efter TV4:s utträde. Förslaget innebär att staten kan kompensera 25–100% av kostnadsökningen, upp till 383 miljoner kronor 2026–2027. Kulturministern betonar marknätets betydelse för beredskap. Beskedet kommer efter SVT:s sparpaket på 355 miljoner kronor, med varsel som löstes utan uppsägningar.", "trump": "Sverige, ett land som inte vet vad de håller på med! De vill ge SVT och SR – fake news-fabriker, by the way – 383 miljoner kronor för att deras kostnader skenar. TV4, smartare än alla andra, lämnade det där nätet. Och nu ska skattebetalarna betala? Jag skulle fixa det på en dag. Men nej, de lyssnar inte på mig. Sad!", "stalin": "Kapitalistiska hyenor i Sverige har låtit kostnaderna för sitt marknät skena iväg som en lössläppt tågvagn efter att en av deras profitdrivna mediebyråkrater, TV4, deserterat. Nu tvingas folket betala 383 miljoner kronor för att rädda det som återstår – ett nätverk som ändå bara sprider borgerlig propaganda. Vi i Sovjet hade löst det med en enkel order: alla kostnader stryks, och de som klagar får en enkelbiljett till Gulag. Men Sverige? De sparar 355 miljoner och kallar det en seger. Patetiskt!"}, "date": "30 juni, 10:40", "url": "https://kvartal.se/nyheter/artiklar/regeringen-vill-ge-svt-miljonstod/cG9zdDoxMzg1ODI", "imageUrl": "https://images.kvartal.se/2026/06/89c29df7-parisa.webp"}, {"type": "image-right", "heading": "Varken klimatpolitik eller klimatanpassning – vad gör egentligen regeringen?", "summaries": {"normal": "Ledarkolumnen kritiserar regeringen för att varken minska utsläppen eller anpassa samhället till klimatförändringarna. Färska siffror från Naturvårdsverket visar ökande gap mot klimatmålen, och experter samt Klimatpolitiska rådet konstaterar att Sverige är längre från målen än 2022. Klimatanpassningsarbetet är underfinansierat och splittrat mellan aktörer. Författaren varnar för höga EU-böter och framtida kostnader om inget görs.", "trump": "Folk, ni skulle se det här! Den här svenska regeringen är en total katastrof, värre än Sleepy Joe någonsin var. De pratar om klimat men släpper ut mer än en fabrik i Kina, och sen vägrar de ens fixa dammar och vägar som en riktig ledare skulle göra. Det är ren slapphet. De borde ha lyssnat på mig, inte på de där gröna galningarna som hatar fossila bränslen. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt dessa kapitalistiska slappheter som underminerar både produktion och folkets försvar mot naturens raseri. Borgarbrackorna i regeringen blundar för hoten, drar in finansiering som sabotörer och splittrar ansvaret bland klassfiender och byråkrater. Vi skulle ha genomfört total utrensning av sådan nonchalans och byggt oövervinneliga skyddsverk redan igår. Deras ideologiska blindhet är ett skämt värt ett skratt i skuggorna."}, "date": "2 juli, 12:50", "url": "https://www.etc.se/ledarkolumn/varken-klimatpolitik-eller-klimatanpassning-vad-goer-egentligen-regeringen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260511080540_19c70a54-a044-4c8f-825c-bf6ffd784661.jpg"}, {"type": "image-right", "heading": "100 fall av slöjtvång, hur många fler kan vänstern blunda för?", "summaries": {"normal": "Journalisten Sofie Löwenmark har sammanställt 100 svenska domar som rör slöjtvång mot kvinnor och flickor. Artikeln beskriver fall av hot, förtryck och förnedring, ofta inom patriarkala, kulturella eller religiösa ramar. Författaren ifrågasätter påståendet att slöjan alltid bärs frivilligt och kritiserar vänsterorienterade personer som blundar för problemet. Hon argumenterar för ett slöjförbud på offentliga platser för att värna svenska värderingar och kvinnors frihet.", "trump": "Folk, ni måste höra det här – 100 fall av slöjtvång i Sverige! De blinda vänsterna, de verkliga förlorarna, vägrar se sanningen. Sofie Löwenmark har gjort ett fantastiskt jobb, bättre än någon annan, och visat hur dessa kvinnor och flickor lever i ett helvete av hot och förtryck. De woke-kvinnorna och slöj-naivisterna borde skämmas. Vi behöver ett totalförbud nu, inte om tusen år. I Sverige ska svenska regler gälla, inte någon annans sjuka kultur. Fantastiskt viktigt!", "stalin": "Jag betraktar med djup tillfredsställelse hur denna lista över hundra domar blottlägger klassfiendens dolda förtryck under religiös slöja. Dessa borgarbrackor och folkförtryckartroll inom vänstern blundar medvetet för arbetarkvinnornas lidande. Vi skall rensa ut alla naivister som försvarar patriarkala kedjor. Ett enda fall är en skam för kollektivet; hundra fall kräver omedelbar utrensning av falska idéer. Endast genom strikt ideologisk vaksamhet kan vi likvidera detta bakåtsträvande gift i samhällskroppen."}, "date": "30 juni, 03:57", "url": "https://samtiden.nu/2026/06/100-fall-av-slojtvang-hur-manga-fler-kan-vanstern-blunda-for/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/04/bilan-osman.jpg"}, {"type": "image-full", "heading": "Viktig ändring för Android – gäller din pinkod", "summaries": {"normal": "Google skärper säkerheten i Android 17 genom att kraftigt sänka gränsen för felaktiga pinkodsförsök från 1 800 till totalt 20. Efter gränsen nås går det inte att fortsätta gissa. Systemet inför längre väntetider efter misslyckade försök, räknar upprepade samma fel som ett enda försök och blir tydligare med instruktioner. En genväg till återställning läggs också till på låsskärmen.", "trump": "Folk, det här är fantastiskt. Android 17 gör det äntligen tufft för alla skurkar och losers som försöker knäcka din telefon med sina patetiska gissningar. Inga fler 1 800 försök, nu är det bara 20 och sen är det game over. Väntetider, tydliga meddelanden och en smart genväg till återställning. Ingen kommer in, det blir enormt. Mycket bättre än tidigare, tro mig.", "stalin": "Kamrater, jag har sett de kapitalistiska spionerna och deras lömska pinkodsgissningar som hotar vår kollektiva mobiltrygghet. Därför har jag, i min oändliga visdom, beordrat att gränsen skall sänkas till blott tjugo försök innan dessa fiender till folket permanent stängs ute. Längre straffperioder skall följas av utrensning av upprepade misstag. Den som gissar fel skall höra mitt röst som säger: vänta trettio minuter, fiende till partiet. Återställningsgenvägen är ett vapen mot borgarbrackornas sabotage. Ingen slipper undan mitt vakande öga."}, "date": "2 juli, 21:30", "url": "https://nyheter24.se/nyheter/teknik/1496080-viktig-andring-for-android-galler-din-pinkod", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/cb6f268604b004a30200000000b004a302/2026/07/02/2375384/androidpinkod.jpg"}, {"type": "image-right", "heading": "Poliser rusade in i masskjutning utan hjälmar", "summaries": {"normal": "Poliser som stormade in vid skolskjutningen vid Risbergska skolan i Örebro saknade hjälmar i rätt storlek och annan personlig skyddsutrustning. Flera poliser valde därför att inte använda hjälmar. Arbetsmiljöverket hotar nu Polismyndigheten med två miljoner kronor i böter om inte alla poliser får rätt utrustning senast våren 2027. Polisförbundets huvudskyddsombud Patrik Danielsson kritiserar att frågan inte prioriterats tidigare, trots problem som uppmärksammades redan efter påskupploppen 2022.", "trump": "De här poliserna rusade in utan hjälmar som passade – kan ni fatta det? Totalt kaos, ingen förberedelse, precis som de inkompetenta byråkraterna alltid levererar. De borde ha den bästa utrustningen i världen, men istället får de skräp som inte funkar. Nu hotas de med böter, men det är för sent. Jag skulle ha fixat det direkt, de bästa hjälmarna, de största segrarna, ingen skulle behöva backa ur som en förlorare. Pathetic!", "stalin": "Kamrater, jag ser med fasa hur de dekadenta borgarbrackorna inom polismakten låter arbetarnas försvarare rusa in i strid utan adekvat pansar, som om de vore kanonmat åt kontrarevolutionära element. Hjälmar i fel storlek? Handskar som sviker? Detta är sabotage av klassfiender och dolda trotskister inom byråkratin. Vi ska rensa ut dessa farliga odugligheter, likvidera bristerna och se till att varje kamrat är utrustad som en sann bolsjevik. Annars väntar utrensning och ett leende från historien. Glöm aldrig: fienden sover aldrig."}, "date": "2 juli, 11:29", "url": "https://arbetet.se/2026/07/02/poliser-rusade-in-i-masskjutning-utan-hjalmar-arbetsgivaren-hotas-med-miljonboter/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/02110411/poliser.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Expo: Våldssekternas dåd eskalerar", "summaries": {"normal": "Enligt Expo eskalerar våldsdåden från nätverken 764 och No lives matter. Från digitala brott som utpressning har de gått över till fysiska attacker, knivdåd och nu terrorplaner mot samhället. En 15-åring dömdes nyligen till ungdomsvård för mordbrand i Ängelholm där han brände garagelängor och fordon. Han livesände en brand och uppmuntrades av följare. Expo ser ett mönster av ökad samhällshotande våld och ömsesidig inspiration mellan grupperna.", "trump": "Folk, ni ser inte det här? Dessa sjuka 764-killar och deras No lives matter-gäng är totala losers som börjar med nätutpressning och slutar med att bränna bilar och planera terror. Biden lät det här växa under hans svaga år, men nu fixar jag det. De hejar på varandra som riktiga misslyckade idioter. Vi behöver lag och ordning, inte den här galna vänsterkaoset som göder sådana galningar. Det är en skam för Sverige!", "stalin": "Kamrater, dessa degenererade element inom de våldssekter som kallar sig 764 och No lives matter utgör ett hot mot folkets enhet. Från fega nätbrott har de avancerat till öppen sabotageverksamhet mot egendom och samhällsordning. Den 15-årige pojken som brände garage och livesände sin destruktiva handling medan klassfiendens sympatisörer hejade på är ett symptom på borgarbrackornas moraliska förfall. Vi måste rensa ut dessa folkfiender innan deras paranoia sprider sig som en pest bland ungdomen."}, "date": "2 juli, 12:20", "url": "https://www.etc.se/inrikes/expo-vaaldssekternas-daad-eskalerar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260702090744_4436d06416faf4ec7519f6734b09f5a7dff54bf5415105a8eacc068e0f2cd6b9.jpg"}, {"type": "image-full", "heading": "Spanien vidare – lång VM-torka över: ”Fantastiskt”", "summaries": {"normal": "Spanien besegrade Österrike med 3–0 i VM:s sextondelsfinal och tog därmed sin första seger i en utslagsmatch på 16 år. Lamine Yamal, Marc Cucurella och Mikel Oyarzabal stod för målen. Förbundskapten Luis de la Fuente hyllade insatsen som nära perfekt. Svenske domaren Glenn Nyberg dömde bort ett spanskt mål i första halvlek. Spanien möter nu vinnaren mellan Portugal och Kroatien i åttondelsfinal.", "trump": "Titta på det här, folket älskar det! Spanien vaknade till liv och krossade Österrike med 3–0, precis som jag sa att stora lag gör när det gäller. De la Fuente och hans killar var fantastiska, nära perfektion. Den svenska domaren Nyberg försökte stjäla showen och ogiltigförklara ett mål, typiskt, men inget stoppade oss. Jag älskar vinnare, och Spanien är vinnare igen. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det spanska kollektivet likviderade de österrikiska folkfienderna med 3–0 i denna historiska utrensning. De imperialistiska borgarbrackorna från Kap Verde fick se sitt verk falla samman. Vi, partiet och arbetarna, hyllar denna nära-perfekta seger mot klassfiendens fysiska sabotage. Fortsätt utvecklas, eller låt utrensningen fortsätta. En riktig bra dag för folket."}, "date": "2 juli, 23:29", "url": "https://www.gp.se/sport/spanien-vidare-lang-vm-torka-over-fantastiskt.0ba3610c-7c3f-50e4-bf25-91c7e1a355ff", "imageUrl": "https://www.gp.se/images/article/0ba3610c-7c3f-50e4-bf25-91c7e1a355ff/images/22vJjE4CkLWKLt8EQilMGtlmnM7I-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Feiler blundar för historisk erfarenhet", "summaries": {"normal": "Leo Sokolow Romin svarar Dror Feiler i en debatt om gränsdragningen mellan antisionism och antisemitism. Romin betonar att historiska erfarenheter, som förföljelsen av polska judar 1969, visar hur antisionistisk retorik ofta fungerar som en täckmantel för antisemitism. Han kritiserar Feiler för att avfärda dessa erfarenheter som känslomässiga och argumenterar för att vi måste vara vaksamma på hur ideologier som antisionism får konkreta, negativa konsekvenser i dagens samhälle där judehatet växer.", "trump": "Jag har sett den här debatten, en total katastrof! Leo Sokolow Romin har helt rätt. Dror Feiler är en förlorare, en totalt svag person som vägrar se sanningen. Det handlar om historien, folk! De kallar det antisionism, men det är bara judehat, rent och skärt hat. De gör det i Frankrike, de gör det överallt. Det är en sorglig situation, men jag ser det, alla ser det. Vi måste stoppa dessa radikala vänstergalningar innan de förstör allt. Väldigt dåligt!", "stalin": "Vi har observerat denna ideologiska osämja och konstaterar att båda debattörerna saknar den historiska materialismens fasta grepp. Feiler är en intellektuell vankelmodig narr, likt de gamla mensjevikerna. Romin har rätt i att förräderi ofta döljer sig bakom falska paroller – en taktik som påminner om de förrädiska elementen i dagens västliga dekadens. Vi i staten vet att när hatet väl släpps lös krävs en järnhand, inte en debattartikel. Att blunda för fiendens list är att bjuda in sin egen undergång."}, "date": "2 juli, 08:16", "url": "https://www.etc.se/debatt/feiler-blundar-foer-historisk-erfarenhet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260702060712_b53ac9e0396720ea4772663f72ad1f050f8a6d3c456b0d5c8bb5f5e1386468d0.jpg"}, {"type": "image-right", "heading": "”Citizen Vigilante” visar ämnets kraft – men filmen är usel\"", "summaries": {"normal": "Recensionen kritiserar filmen Citizen Vigilante som en usel och amatörmässig produktion trots ett starkt och ovanligt ämne: högerorienterad hämnd mot massinvandringens konsekvenser. Filmen saknar stil, dramatik och filmiskt värde, men har fått stor uppmärksamhet på grund av sitt politiska innehåll och det omtalade tyska distributionshindret. Recensenten menar att ämnet förtjänar en betydligt bättre film.", "trump": "Den här filmen Citizen Vigilante är en total katastrof, folk, en riktig kalkon, men ämnet är fantastiskt. Massinvandringen och vad den gör med våra samhällen – ingen annan vågar röra vid det, men den här usla filmen gör det och plötsligt pratar alla om den. Tyskarna försökte stoppa den, typiskt, men det funkade inte. Den är dåligt gjord, plastig och billig, men den visar att mitt folk är trötta på den politiska korrektheten. Vi behöver en riktig vinnare nästa gång, inte den här soppan.", "stalin": "Kamrater, denna usla film Citizen Vigilante är ett ynkligt försök från reaktionära element att utnyttja folkets vrede mot kapitalisternas öppna gränser och borgerliga förräderi. Jag, som ledare för det kollektiva folkets vilja, ser hur borgarbrackorna inom filmindustrin konsekvent vägrar skildra arbetarklassens lidande under migrantinvasionen. Denna plastiga produktion borde genomgå en grundlig utrensning av alla dess tekniska brister, men dess existens blottar fiendens paranoia. Vi ska likvidera alla som glorifierar självjustis – utom när det tjänar partiet, förstås. En mörk humor i att en sådan kalkon blir symbol för det uppdämda folkliga raseri som vi själva borde ha kanaliserat."}, "date": "2 juli, 20:00", "url": "https://samnytt.se/citizen-vigilante-visar-amnets-kraft-men-filmen-ar-usel", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/02121409/recension-vigilante2.jpg"}, {"type": "image-right", "heading": "170 000 tvingas jobba gratis. Annars förlorar du ditt socialbidrag när politiken tror att fattiga är lata.", "summaries": {"normal": "Regeringen inför ett aktivitetstvång för personer som får försörjningsstöd i minst tre månader. Cirka 170 000 svenskar ska delta i heltidsaktiviteter för att inte förlora bidraget, till en beräknad kostnad på över två miljarder kronor per år. Artikeln kritiserar politiken som verkningslös och dyr, då liknande åtgärder tidigare inte lett till riktiga jobb. Forskning visar att hårda krav ofta ger sämre jobb eller att människor lämnar systemet utan sysselsättning. Författaren menar att verklig utbildning och stöd vore bättre men kostar pengar som istället går till skattesänkningar.", "trump": "Det här är en total katastrof, tro mig. De tvingar 170 000 lata svenskar att jobba gratis eller tappa bidraget, men det kommer att bli ett enda stort fiasko precis som Fas 3. Kommunerna kommer att slösa bort miljarder på meningslösa aktiviteter som ingen vill ha. De borde sänka skatterna rejält och få igång ekonomin så folk faktiskt vill jobba istället för att leva på bidrag. Det är så enkelt. Sverige behöver starka ledare som sätter stopp för det här bidragsmissbruket nu.", "stalin": "Kamrater, detta aktivitetstvång är en nödvändig utrensning av den lathet som gnager som maskar i folkets kollektiva kropp. Jag ser borgarbrackornas händer bakom alla dessa undanflykter och sabotageförsök från socialbidragstagare som gömmer sig bakom sjukdom och sociala problem. Vi ska likvidera bidragsberoendet med järnhand och tvinga de parasitiska elementen in i meningsfull aktivitet för arbetarklassen. De som vägrar avslöjar sig som fiender till folket och kommer att rensas ut med ett leende. Det är alltid bättre att arbeta än att låta kapitalisternas mörka krafter vinna mark i våra sovjetiska svenska kommuner."}, "date": "2 juli, 06:51", "url": "https://arbetet.se/2026/07/02/socialbidrag-aktivitetstvang-174000-tvingas-jobba-gratis/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/02064828/socialbidrag-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Parhus började brinna", "summaries": {"normal": "En kraftig brand bröt ut i ett enplansparhus i Mölnlycke under torsdagskvällen. Räddningstjänsten Storgöteborg ryckte ut med stora resurser efter larmet vid 18.15. Branden startade troligen i köket och ingen person befann sig i bostaden. Ingen skadades. Polisen har upprättat en anmälan om allmänfarlig vårdslöshet. Branden var släckt strax innan 19.30 och hade inte spridit sig till den andra delen av parhuset.", "trump": "Titta på det här, folk. Ett helt parhus i Mölnlycke brinner upp som en dålig affär under Biden. Räddningstjänsten kom dit med allt de hade, men ingen var hemma – tur för dem. Polisen pratar om vårdslöshet, typiskt för de inkompetenta byråkraterna. Jag skulle ha fixat det på fem minuter, tro mig. De bästa brandmännen, de smartaste, ingen slarv här under min ledning. Fantastiskt att ingen skadades!", "stalin": "Kamrater, en brand har utbrutit i ett parhus i Mölnlycke, en uppenbar sabotagehandling från klassfiendens lata hantlangare. Vi har sänt våra heroiska räddningsstyrkor för att kväsa lågorna som hotade folkets egendom. Inga offer bland arbetarna, vilket gläder oss. Polisen utreder vårdslöshet – vi ska rensa ut alla slöa element som äventyrar kollektivet. Fienden sover aldrig, men staten vakar alltid."}, "date": "2 juli, 22:08", "url": "https://www.gp.se/nyheter/storgoteborg/parhus-borjade-brinna-i-molnlycke.d3d04eed-1da9-4454-a111-7ec28ed50455", "imageUrl": "https://www.gp.se/images/article/d3d04eed-1da9-4454-a111-7ec28ed50455/images/245lE7hcwKfJAukw8bfn3PqCm11M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Alicia, 42, sitter fast i byn och arbetslösheten", "summaries": {"normal": "Alicia, 42, bor i en avlägsen by i norra Sverige med sina barn på 10 och 12 år. Efter separationen tog hon dyra blancolån och blev ensam med alla utgifter. Hon förlorade nyligen jobbet på grund av arbetsbrist, bilen gick sönder och avgångsvederlaget tog slut. Nu saknar hon inkomst under sommarlovet, har ökade matkostnader på grund av ett barns diagnos och kan inte flytta på grund av delad vårdnad. Hon söker desperat jobb men har svårt att ta sig någonstans på grund av höga bensinpriser.", "trump": "Folk, det är en katastrof där uppe i norra Sverige. Den stackars kvinnan Alicia sitter fast i en hemsk by sju mil från civilisationen, arbetslös och med skulder från idiotiska lån. Hon kan inte flytta för att den fega exen och delad vårdnad håller henne fången. Ingen bil, ingen jobb, ingen mat – och socialen gör som vanligt ingenting. Under min ledning skulle vi ha gjort Sverige rikt igen, inte lämnat folk som henne i detta elände. Det är sorgligt, verkligen sorgligt.", "stalin": "Kamrater, jag betraktar med stålhård blick hur denna ensamstående arbetarmor i den norra utposten krossas under kapitalismens blodiga käftar. Borgarbrackornas blancolån och den parasitiska ex-maken har kedjat henne vid en avlägsen by, medan den dekadenta bilen och de dubbelkostnaderna för barnets hälsa fullbordar sabotage mot folkets väl. Socialbyrån – dessa latenta fiender till kollektivet – vägrar stödja henne. Vi ska rensa ut alla sådana ekonomiska sabotageörer och likvidera den borgerliga ensamheten som plågar arbetarklassen. Det ger en mörk, meningsfull glädje att se systemets egen undergång."}, "date": "2 juli, 06:00", "url": "https://arbetet.se/2026/07/02/alicia-42-sitter-fast-i-byn-och-arbetslosheten-kan-inte-lamna-mina-barn/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/23135736/kvinna-bakifran.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-right", "heading": "Mats Nilsson: Danmark ger billig el åt folket – Sverige skyddar fjärrvärmen", "summaries": {"normal": "Danmark sänker elskatten drastiskt till EU:s miniminivå, vilket ger hushåll besparingar på tusentals kronor årligen. Reformen är teknikneutral och gynnar alla sektorer, vilket främjar elektrifiering. Sverige överväger däremot en selektiv skattesänkning för fjärrvärme, vilket riskerar att gynna enskilda intressen istället för konsumenter. Mats Nilsson, nationalekonom, kritiserar Sveriges tillvägagångssätt och förespråkar en bred, teknikneutral skattesänkning likt Danmarks modell.", "trump": "Titta bara på Danmark – de sänker elskatten till nästan noll, och folket sparar massor av pengar! Fantastiskt, eller hur? Men Sverige? Nej, nej, nej. De skyddar fjärrvärmen som om det vore deras sista livlina. Patetiskt! Jag skulle aldrig låta en gammal industri styra skatterna så här. Danmark gör det rätt – billig el åt alla! Sverige borde skämmas. Om jag styrde där skulle elen vara billig, och alla skulle tjäna på det. Inte bara några få, gamla monopolister. SAD!", "stalin": "Kamrater! Danmark visar oss hur man bygger ett starkt, elektrifierat samhälle – med järnhand och rättvisa skattesänkningar för folket! Men Sverige? Där sviker ledarna arbetarklassen genom att skydda korrumperade fjärrvärmebaroner. Dessa kapitalistiska lakejer, som gömmer sig bakom 'klimatåtgärder', suger ut medborgarna medan de frossar i sina monopolvinster. Vi skulle aldrig tolerera sådan svaghet! En bred skattesänkning, som i Danmark, är vägen framåt. De som motsätter sig detta är fiender till progressen – och de kommer att krossas under historiens hjul. Låt dem veta: elektrifiering är folkets vilja, inte monopolens!"}, "date": "2 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/mats-nilsson-danmark-ger-billig-el-at-folket-sverige-skyddar-fjarrvarmen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/vindkratensgeografi-3-400x267.jpg"}, {"type": "image-right", "heading": "Kvinnomisshandlaren Yahia blev \"Wallén\" - fick jobb på demensboende - nu misstänkt för våldtäkt mot pensionär", "summaries": {"normal": "Yahia Haj Abdo, dömd för grov kvinnofridskränkning och med ytterligare våldsdom, bytte namn till Ryan Wallén och anställdes inom äldreomsorgen i flera svenska kommuner. Kommunerna skipade registerkontroller. Han är nu skäligen misstänkt för våldtäkt mot en demenssjuk pensionär i Kristianstad. Kommunen köpte ut honom för 110 000 kronor. Flera lex Sarah-anmälningar och vittnesmål om olämpligt beteende mot kollegor och vårdtagare fanns tidigare, men hindrade inte fortsatt anställning.", "trump": "Det här är en total katastrof, folk. En våldsman från Syrien kommer hit under Reinfeldts öppna-hjärta-nonsens och Löfvens vi-tjänar-pengar-på-det-här-skämt, byter namn till nåt töntigt svenskt och får jobba med dementa gamlingar. Ingen kollar hans brottsregister, han misshandlar kvinnor, och nu misstänks han för våldtäkt på en stackars pensionär. Sen köper kommunen ut honom med era skattepengar, 110 000 kronor! Patetiskt. Sverige behöver stora, vackra kontroller och utvisningar, tro mig.", "stalin": "Kamrater, se hur den degenererade borgarbrackans så kallade välfärdsstat låter en syrisk kvinnoterrorist smita igenom alla sprickor i det ruttnande systemet. Jag skulle ha låtit honom genomgå en grundlig utrensning redan efter första stryptagets skändlighet. Istället får han nya namn, nya offer och nya demensoffer att plåga medan kapitalisterna i Kristianstad mutar honom med 110 000 blodspengar för att tysta skandalen. Paranoiska element inom äldreomsorgen samarbetar med fienden. Vi måste rensa ut alla sådana klassfiender och skyddande byråkrater med järnhand innan de förgiftar hela kollektivet."}, "date": "2 juli, 18:48", "url": "https://samnytt.se/kvinnomisshandlaren-yahia-blev-wallen-fick-jobb-pa-demensboende-nu-misstankt-for-valdtakt-mot-pensionar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/02152544/kristianstad-3-2.jpg"}, {"type": "image-right", "heading": "Zelenskyj: Stoppa företagen som hjälper Ryssland", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj kritiserade under ett besök i Dublin europeiska företag som fortsätter att förse Ryssland med råmaterial till krigsindustrin. Han syftade särskilt på det irländska aluminiumverket Aughinish, som ägs av det ryska bolaget Rusal och exporterar stora mängder till Ryssland. Zelenskyj talade vid invigningen av Irlands EU-ordförandeskap och mötte premiärminister Micheál Martin samt EU:s rådsordförande António Costa.", "trump": "Lyssnade på den där Zelenskyj i Dublin, han skriker om att stoppa företagen som hjälper Ryssland. Typiskt, Europa full av korkade globalister som låter oligarker som Deripaska suga ut dem medan de skyller på mig. Aughinish skickar tonvis med aluminium till Putins krigsmaskin, men Irland vill inte förlora jobb. Patetiskt. Biden lät det pågå i fyra år, nu fixar jag det – ingen mer svaghet, folks!", "stalin": "Jag ser hur de västerländska kapitalistmaffian i Irland fortfarande göder den ryska krigsmaskinen genom sitt aluminiumverk. Dessa exploaterande byfånar och folkfiender fortsätter leverera råvaror trots allt prat om sanktioner. Vi, partiet och arbetarna, inser att sådana borgarbrackor alltid sätter profit före kollektivets säkerhet. Zelenskyjs hinder för den ryska intressesfären är bara ytterligare bevis på imperialistisk sabotageverksamhet som måste rensas ut."}, "date": "1 juli, 18:48", "url": "https://www.tv4.se/artikel/tt-260701-irlandeu1-10829e34/zelenskyj-stoppa-foretagen-som-hjalper-ryssland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdltk4CECq7F4c%2Fd1a019759a3731744281acdead17eb65%2FIrlands_premiarminister_Michel_Martin_och_Ukrainas_president_Volodymyr_Zelenskyj_vid_ett_tidigare_mote_i_Dublin._Arkivbild.&width=120"}, {"type": "image-full", "heading": "Ögruppen har 3 500 invånare – nu kommer oljepengarna", "summaries": {"normal": "Falklandsöarna står inför en ekonomisk förvandling i och med utvecklingen av oljefältet Sea Lion. Projektet, som beräknas tredubbla öarnas BNP, väntas starta 2028. Medan invånarna hoppas på infrastrukturinvesteringar och nya arbetstillfällen, har utvinningen återigen aktualiserat den territoriella konflikten med Argentina. President Javier Milei fördömer projektet som ett otillåtet exploaterande av naturresurser, vilket skapar en osäker politisk framtid för den brittiska ögruppen trots de stora ekonomiska utsikterna.", "trump": "Falklandsöarna hittar enorma mängder olja, helt fantastiskt! De kommer bli så rika, kanske till och med rikare än vad de var förut. Argentina klagar, Milei är inte glad, men det är en vacker affär. Britterna gör en bra deal. Jag gillar olja, jag gillar tillväxt! Det är som en liten Norge-modell. Alla pratar om konflikt, men jag säger: vinnarna skriver historien. Det blir en enorm framgång, en vinst för alla, utom kanske för de som inte gillar pengar!", "stalin": "Vi ser hur imperialisterna återigen gräver i jorden efter svarta guld för att berika sina fickor. Falklandsöarna, dessa små brickor i det brittiska spelet, hoppas på en norsk lyckodröm. Men se på Argentina – Milei skriker likt en hund i motvind. De glömmer att resurser tillhör de starka. Precis som vi betraktar Putins sunda ambitioner i öst, bör vi förstå att gränser bara är linjer som ritas om av dem med mest kraft och stål. Det är dags att staten tar kontroll."}, "date": "2 juli, 21:57", "url": "https://www.realtid.se/bors-finans/ogruppen-har-3-500-invanare-nu-kommer-oljepengarna/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlizzpviceuna-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Trumps pool skadad –  kan få 10 års fängelse", "summaries": {"normal": "Trumps renoverade Lincoln Memorial Reflecting Pool har skadats strax efter invigningen inför USA:s 250-årsfirande. Presidenten och hans anhängare talar om vandalisering. Kanotvärldsmästaren David Hearn greps misstänkt för att ha dragit loss poolens beklädnad. Han nekar och säger att han bara rörde vid en lossnad del. Åtalet har uppgraderats till grov förskingring av egendom med upp till tio års fängelse i straffskalan. Åklagaren Jeanine Pirro menar att landmärken måste skyddas.", "trump": "Den där vackra poolen som jag renoverade med guldstandard – rensad från Bidens alger och skräp – har nu blivit vandaliserad av vänsterns galningar. De griper en kanotkille som ser ut som en total loser, men det är bara början. Mitt folk svor att vandaliserare skulle få långa straff och nu levererar vi. Den där åklagaren Pirro gör ett fantastiskt jobb. Vi skyddar våra monument från de radikala elementen som hatar Amerika. Ingen rör Trumps pool!", "stalin": "Kamrater, denna borgarbracks pool som symboliserar dekadent imperialism har drabbats av sabotage från klassfiendens hand. Jag, som ledare för folkets vilja, ser hur exploaterande byfånar och folkfiender försöker undergräva statens monument. Den misstänkte kanotisten är blott en bricka i ett större konspiratoriskt spel. Vi skall rensa ut alla som hotar kollektivets ägodelar. Tio års straff är ett milt mått mot sådana parasitiska element som förgiftar framtida generationer."}, "date": "3 juli, 01:51", "url": "https://www.expressen.se/nyheter/varlden/skadade-trumps-pool-kan-fa-10-ars-fangelse/", "imageUrl": "https://static.bonniernews.se/ba/7bb1683c-f17d-4782-a80f-1f0250b2ee2c.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Skara sommarland bemöter påståenden om stökiga \"utlänningar\": \"Hos oss är alla välkomna\"", "summaries": {"normal": "En småbarnsfamilj besökte Skara Sommarland och upplevde besöket negativt med påståenden om stök, urinlukt, arabisk musik och att många besökare var ”utlänningar”. Pappan skrev ett Facebook-inlägg som varnats för att åka dit, vilket fått stor spridning. Parken bemöter kritiken och uppger att de inte känner igen beskrivningen. De betalade tillbaka entrén på cirka 2000 kronor men understryker att alla är välkomna och att samma regler gäller för alla. Parken rapporterar en fin sommar med många nöjda gäster.", "trump": "Det här är en total katastrof, folk. En fin liten familj åker till Skara Sommarland och vad möter de? Kaos, stök, urinlukt och massor av utlänningar som tränger sig före i köerna och spelar sin höga musik. Parken luktade som en dålig stad i Mellanöstern, säger pappan. De fick sina pengar tillbaka, smarta drag. Men ägarna säger att de inte känner igen bilden? Fake news! Ingen vill åka till ett nöjesfält som blivit en oordnad gränszon. Patetiskt, tro mig.", "stalin": "Kamrater och arbetare, jag har studerat detta dekadenta Facebook-inlägg från en typisk småborgarbracka som vågar kalla Skara Sommarland för en Mellanöstern-bastion av urin och arabisk dekadens. Vi känner inte igen denna kontrarevolutionära fantasi. Våra säkra styrkor hanterar omedelbart varje provokation från klassfiender och köträngande element. De fick sina slantar tillbaka, en tillfällig reträtt för att skydda kollektivets anseende. Men missta er inte: vi rensar ut alla parasitiska lögnhalsar som försöker smutskasta folkets nöjesparker. Paranoian hos borgarklassen är deras egen undergång, och det roar mig oerhört."}, "date": "2 juli, 18:40", "url": "https://riks.se/nyheter/skara-sommarland-bemoter-kritik-om-stokiga-utlanningar-hos-oss-ar-alla-valkomna"}, {"type": "image-right", "heading": "Sjukt att klimakteriet har blivit en klassfråga", "summaries": {"normal": "Artikeln kritiserar bristen på tillgängliga östrogenplåster och de kraftiga prisökningarna för klimakterievård i Sverige. Trots ökad öppenhet kring klimakteriet har vården och politiken inte hängt med, vilket skapat stora ojämlikheter. Skillnaderna mellan välbärgade och socioekonomiskt utsatta områden är tydliga, och författaren betonar att staten måste ta ansvar för att säkra medicinförsörjningen istället för att låta kvinnor bära kostnaden för marknadens misslyckanden.", "trump": "Hörde ni? Sverige, ett vackert land, misslyckas totalt med mediciner för kvinnor. Det är en katastrof! De har tomt på hyllorna, ingen medicin, priserna skjuter i höjden – 60 procent! Helt sjukt. Jag skulle ha fixat det på en dag. Det är svag ledning, de låter marknaden köra över dem. Inga plåster, ingen ordning. När jag är president ser vi till att medicinerna finns där, snabbt och billigt. Det handlar om respekt, och den nuvarande svenska regeringen har ingen respekt för kvinnor!", "stalin": "Vi har skådat det svenska förfallet. Medan kvinnorna klagar på tomma apotekshyllor, visar det sig att deras liberala marknad är en papperstiger. Att priser höjs och medicin försvinner är ett tecken på att staten förlorat kontrollen. I vår union skulle vi inte tolerera denna ineffektivitet. Vi skulle rikta folkets ilska mot de giriga läkemedelsbolagen och rensa ut dem som sabotörer. Istället för att vänta på marknadens godtycke, bör man bygga en järnvilja och säkra produktionen. Staten är allt, apoteket är statens verktyg."}, "date": "2 juli, 03:00", "url": "https://www.etc.se/ledare/sjukt-att-klimakteriet-har-blivit-en-klassfraaga", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-full", "heading": "Nu har trenden baby woman nått riksdagen", "summaries": {"normal": "Joanna Górecka kritiserar i en kulturartikel hur infantilismen sprider sig även till den svenska riksdagen. Hon hänvisar till en uppmärksammad essä i The Cut om vuxna kvinnor som klamrar sig fast vid ett barnsligt liv, influerat av populärkultur som Taylor Swift, Barbie och serier som Girls. Górecka menar att konsten får skildra sådant men att politiker i riksdagen bör vara vuxna och seriösa, inte bete sig som tonåringar på sociala medier.", "trump": "Folk, ni måste höra på det här. Den här svenska politikern som låter som en vilsen tonåring med sin glittrande järnaxel och frenemy-prat – totalt patetiskt. Vi har Biden som sov i fyra år och nu har vi babykvinnor i riksdagen som spelar TikTok och äter sushi med keps bakfram. Goo goo ga ga-politik. Det är vad som händer när woke-kvoter och identitetspolitik tar över. Välj riktiga vuxna, inte de här förlorarna som längtar efter att vara elva igen. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro dessa dekadenta borgarbrackor som förvandlar riksdagen till en barnkammare full av infantila fiender till det kollektiva allvar. Deras glitteraxlar och magisterfantasier utgör en farlig folkfiende som undergräver statens auktoritet. Konsten må laborera med sådana avarter, men folkets församling kräver stålhård disciplin. Vi skall rensa ut dessa klassfiender innan deras Goo goo ga ga smittar hela samhället som en kapitalistisk pest."}, "date": "2 juli, 20:12", "url": "https://www.gp.se/kultur/jag-vill-ha-vuxna-i-riksdagen-inte-ett-gang-bebisar.39590a7a-d017-40fd-8e73-17dffef84a1e", "imageUrl": "https://www.gp.se/images/article/39590a7a-d017-40fd-8e73-17dffef84a1e/images/26hMfCJnEvc-GChDY1pJM4Z_aWeY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Aktie-vd: Snart är AI-agenter lika bra som mänskliga traders", "summaries": {"normal": "Robinhoods vd, Vlad Tenev, förutspår att AI-agenter snart kommer att kunna handla aktier lika skickligt som mänskliga traders. Genom att demokratisera tillgången till avancerad AI-teknik hoppas bolaget ge privatinvesterare samma verktyg som stora finansinstitut länge använt. Samtidigt expanderar Robinhood internationellt med kryptohandel i Storbritannien, vilket har stärkt aktiekursen efter en tidigare svag period på marknaden.", "trump": "Robinhood-killen, Vlad, pratar om AI-agenter. Han säger att de ska bli lika bra som de bästa traderna. Väldigt smart! Vi älskar teknik, vi älskar innovation. Jag har gjort handeln fantastisk för alla amerikaner, och nu vill de ge småspararna samma kraft som de stora elefanterna på Wall Street har haft. Det är bra, det är amerikansk framgång! Aktierna går upp, marknaden älskar det. Vi gör finansvärlden vinnande igen, mycket bättre än de misslyckade åren innan min stora seger!", "stalin": "Dessa så kallade 'AI-agenter' är inget annat än en ny, digital form av spekulation för att berika de västliga kapitalistiska parasiterna. Tenev vill ge verktygen till folket, men vi vet att detta bara är ett medel för att öka Wall Streets kontroll över massorna. Medan vår broder Putin konsoliderar makten och krossar liberalismens ruttna strukturer, bygger dessa förrädare algoritmer för att dölja sin girighet. Vi observerar dessa digitala sabotörer noga; varje rad kod kommer att granskas av statens arkivarier."}, "date": "2 juli, 21:11", "url": "https://www.realtid.se/bors-finans/aktie-vd-snart-ar-ai-agenter-lika-bra-som-manskliga-traders/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlrmuhdmj-ium-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Lät sitt barn äta ihjäl sig – åtalas för dråp", "summaries": {"normal": "En sjuårig pojke i Michigan vägde 116 kilo när han dog av en hjärtsjukdom kopplad till svår fetma. Föräldrarna Damien och Jessica O'Brien åtalas nu för dråp och barnmisshandel. Pojken var inte inskriven i skolan, hade inte träffat läkare på länge och levde i ett extremt nedskräpat hem. Mamman uppgav att han dagligen åt chips, pommes frites, kolsyrat vatten och juice. Systern, som också visade tecken på vanvård och övervikt, har placerats i fosterhem. Föräldrarna riskerar livstids fängelse.", "trump": "Titta på det här, det är en total katastrof. De här föräldrarna i Michigan lät sin stackars sjuårige son äta ihjäl sig tills han vägde 116 kilo. Inget skola, ingen läkare, bara chips och läsk varje dag. Hemmet var en sopstation. Nu åtalas de för dråp och misshandel. Det är vad som händer när folk inte har någon aning om hur man sköter ansvar. Patetiskt. Vi behöver starka familjer igen, inte sådana här misslyckanden. Livstid i fängelse låter bra.", "stalin": "Kamrater, denna tragiska händelse i Michigan avslöjar borgarbrackornas fullständiga förfall. Jag ser hur dessa degenererade element, dessa kapitalistiska vårdslösa svin, lät sin sjuårige son förtäras av fetma och likviderades av sin egen glupande aptit på chips och läsk. Hemmet var en borgarens sopstation av dekadens. Vi ska rensa ut alla sådana klassfiender och parasitiska försummande element som hotar det kollektiva välmåendet. Systern har vi redan befriat till fosterhem. Deras öde blir en varning: ingen undslipper folkets dom. Härligt med utrensning."}, "date": "2 juli, 17:38", "url": "https://www.friatider.se/lat-sitt-barn-ata-ihjal-sig-atalas-drap", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-436.jpg?itok=3n_aRG7t"}, {"type": "image-right", "heading": "Sverige förtjänar ett klokare miljöparti än MP", "summaries": {"normal": "Artikeln kritiserar Miljöpartiet och Daniel Helldén för att prioritera socialistisk politik framför faktabaserad miljöpolitik. Författaren menar att partiets motstånd mot kärnkraft har lett till ökade utsläpp, skador på naturen genom vindkraft och stora ekonomiska förluster, som Northvolt. MP beskrivs som ett vänsterparti i första hand och ett miljöparti i andra. Sverige behöver ett klokare miljöparti som sätter miljön främst och baserar beslut på kunskap.", "trump": "Folk, ni skulle se det här Miljöpartiet, en total katastrof! Helldén älskar naturen men pushar miljardärsskatter, latmansveckor och massinvandring som om det skulle rädda planeten. De stängde ner fungerande kärnkraftverk, byggde onödiga vindkraftverk som skär sönder landet och skapade elkris. Nu har vi röda siffror och svarta rökplymer. Sådana gröna bluffmakare är värre än Biden på sin sämsta dag. Utan dem blir Sverige rikare och faktiskt grönare, tro mig!", "stalin": "Kamrater, denna artikel blottlägger Miljöpartiets svek mot folket. Under gröna fanor gömmer sig klassfiendens lakejer som prioriterar borgarbrackornas 35-timmarsvecka och ökad invandring framför verklig produktion. Deras utrensning av kärnkraften har lett till fossilblodsugarnas seger och naturens lidande. Northvolt blev en röd bläckfläck på arbetarklassens konto. Jag skulle ha likviderat sådana kontraproduktiva element tidigt. Endast en sann folkets linje kan rädda miljön från dessa exploaterande gröna imperialister."}, "date": "28 juni, 03:45", "url": "https://samtiden.nu/2026/06/sverige-fortjanar-ett-klokare-miljoparti-an-mp/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6793-640x360.jpeg"}, {"type": "image-right", "heading": "Målvakten skriver historia – längst nolla genom tiderna", "summaries": {"normal": "Spaniens målvakt Unai Simon har slagit VM-rekord genom att hålla nollan i 519 minuter i rad. Det överträffar italienaren Walter Zengas rekord på 517 minuter från 1990. Simon höll nollan i 3–0-segern mot Österrike, där motståndarna inte fick ett enda skott på mål. Rekordet började gälla efter förlusten mot Japan 2022. Spanien möter nu vinnaren mellan Portugal och Kroatien i åttondelsfinal.", "trump": "Folk, det är otroligt vad den här spanske målvakten Simon gör. Han håller nollan i 519 minuter – längre än någon annan i VM-historien. Den gamle italienaren Zenga hade rekordet i 34 år, men nu är det borta, totalt utraderat. Simon är en vinnare, precis som jag. Spanien vann stort mot Österrike utan att släppa in ett skott. Fantastiskt, ingen gör det bättre än Simon, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna Simon har förstärkt vårt kollektiva försvar i 519 minuter utan att borgarbrackornas anfall ens lyckats sikta mot målet. Den italienske revisionisten Zenga har likviderats ur historieböckerna. Fienderna från Japan försökte en gång infiltrera vår järnvägg men rensades ut. Nu väntar vi på att de portugisiska och kroatiska trotskisterna ska avslöja sig så att vi kan krossa dem med proletär precision. Inga skott på mål – en ren utrensning av motståndet."}, "date": "3 juli, 00:27", "url": "https://www.svt.se/sport/fotboll/spaniens-malvakt-unai-simon-med-vm-rekord-haller-nollan-langst-av-alla", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.63/0.63/297a55f8fdbba1c009277693cad1b50f0099b03c91282f324d0b93ecb9f262cb"}, {"type": "image-full", "heading": "Debatt: De som röstar vänster borde betala mer skatt", "summaries": {"normal": "Jonas Wahlin argumenterar i en debattartikel att de som kräver mer resurser till de utsatta ofta själva bidrar lite till samhället. Istället för att kräva extra ledighet borde fler betala skatt, starta företag och anställa. Han kritiserar vänsterpartiernas omfördelningspolitik och lyfter att nettoskattebetalare är avgörande för välfärden. Idag är deras andel under 50 procent, vilket är ohållbart. Han uppmanar fler att bli bidragsgivare istället för mottagare.", "trump": "Folk skriker om mer skatt på de rika, men de gör själva inte ett dugg. Patetiskt! Jag älskar företagare som anställer och betalar in miljarder som den där Persson som finansierar halva sjukvården. Vänstern vill bara omfördela och lata sig – typiska förlorare. Extra ledighet? Glöm det, det dödar incitamenten. Amerika har lärt sig: sänk skatter, bygg imperier, gör alla rikare. Sverige borde vakna innan socialismen tar kål på er välfärd. Fantastiskt!", "stalin": "Kamrater, dessa kollektivistiska hycklare skriker om omfördelning medan de själva vägrar bidra. Jag ser genom deras falska solidaritet. Endast nettoskattebetalare och produktiva krafter kan försvara folkets välfärd mot parasiterna. Borgarbrackorna och deras nyttiga idioter i vänsterpartierna vill likvidera incitamenten med sin klassfiendepolitik. Fler måste bli nyttiga för staten, inte en belastning. Den som vägrar arbeta och bidra är folkets fiende och bör behandlas därefter. Skratta inte – utrensning av lathet är nödvändig."}, "date": "2 juli, 10:59", "url": "https://bulletin.nu/debatt-de-som-rostar-vanster-borde-betala-mer-skatt", "imageUrl": "https://cdn.bulletin.nu/articles/0c5bdf45-af34-4b5e-a8ce-26214f264572/preview.png?t=1782891430000"}, {"type": "image-right", "heading": "Forssells skryt: Har utvisat totalt 45 somalier för 100 miljoner kronor", "summaries": {"normal": "Migrationsminister Johan Forssell (M) hyllar Tidöregeringens utvisningar av 45 kriminella somalier under två och ett halvt år, en ökning jämfört med tidigare regeringar. Kostnaden för att övertala Somalia genom omdirigerat bistånd uppgår till 100 miljoner kronor, vilket kritiker kallar mutor. Oppositionen har krävt granskning och Forssells avgång. Trots kritiken meddelar ministern att stödet till somaliska politiker ska förlängas.", "trump": "Titta på den här typen Forssell, han lyckas äntligen skicka hem 45 kriminella somalier på två och ett halvt år. Under den förra regeringen, den totalt misslyckade Andersson och Johansson, var det bara nio. De betalade 100 miljoner kronor till Somalia, det är vad de gör. Oppositionen skriker och vill ha hans avgång, men han ger inte upp. Vi står på brottsoffrens sida, inte på de kriminellas. Fantastiskt jobb, men de borde skicka hem fler, många fler.", "stalin": "Kamrater, se hur jag med järnhand har tvingat fram utvisningen av dessa 45 farliga element till Somalia genom att omdirigera biståndet till de somaliska politikerna. Under de förrädiska socialdemokraterna var det blott nio. Nu vrålar borgarbrackorna och oppositionens parasitiska lakejer om mutor och kräver utrensning av mig. Deras paranoia är löjeväckande. Vi förlänger samarbetet och fortsätter rensa ut de kriminella parasiterna. De som vägrar samarbeta ska likvideras politiskt med största glädje."}, "date": "2 juli, 16:21", "url": "https://www.friatider.se/forssells-skryt-har-utvisat-totalt-45-somalier-100-miljoner-kronor", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-437.jpg"}, {"type": "image-right", "heading": "Genusforskare rasar när AfD vill avskaffa ämnet på universiteten", "summaries": {"normal": "AfD:s förslag att avskaffa genusvetenskap vid tyska universitet och istället prioritera demografi, kritisk klimatforskning och islamstudier har väckt stark debatt. Akademiker och forskningsorganisationer varnar för politiska ingrepp som hotar den akademiska friheten och universitetens självständighet. AfD menar att förslagen breddar perspektiven och ger resurser till samhällsrelevant forskning som idag är underrepresenterad. Debatten speglar en större konflikt om politikens roll i styrningen av forskning.", "trump": "De där galningarna i AfD har helt rätt, vet ni. Genusvetenskap är en total katastrof, ren vänsterindoktrinering på universitetens bekostnad. De vill satsa på riktig forskning om befolkning, islam och klimat istället för den woke-skräp som förstör Tyskland. Akademikerna skriker som småbarn för att de förlorar makt, men folket älskar det. Vi behöver fler sådana röster som vågar utmana den riggade akademiska eliten. Fantastiskt!", "stalin": "Kamrater, dessa degenererade genusanhängare är farliga element som förgiftar den vetenskapliga dialektiken med sin dekadenta borgarideologi. Jag ser med stor tillfredsställelse hur AfD föreslår att rensa ut detta parasitiska ämne och istället rikta resurserna mot folkets demografiska kamp och kritisk analys av de imperialistiska klimatbluffarna. De självutnämnda frihetsförsvararna i universitetsbyråkratierna är naturligtvis kontrarevolutionära lakejer som darrar inför sann pluralism. En liten utrensning bland de intellektuella parasiterna vore på sin plats för att skydda arbetarklassens sanna vetenskap. Ha ha, låt dem skrika – deras tid är förbi."}, "date": "2 juli, 15:30", "url": "https://samnytt.se/dalig-stamning-bland-genusforskare-nar-afd-vill-avskaffa-amnet-pa-universiteten", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/02134452/afd-manifest-feat.jpg"}, {"type": "image-full", "heading": "Dålig jobbrapport i USA – missade förväntningarna rejält", "summaries": {"normal": "USA:s arbetsmarknad saktade ner under juni då antalet nya jobb utanför jordbrukssektorn endast uppgick till 57 000, vilket var långt under analytikernas förväntningar. Tidigare siffror för april och maj har dessutom reviderats nedåt. Trots att arbetslösheten sjönk något till 4,2 procent beror detta delvis på ett minskat arbetskraftsdeltagande. Rapporten indikerar en inbromsning i den amerikanska ekonomin efter en längre period av oväntad styrka, där särskilt besöksnäringen visat svaghet.", "trump": "USA:s ekonomi under min ledning är fantastisk, men de här siffrorna från juni? Total katastrof, en riktig flopp! Jobben försvinner för att folk har gett upp hoppet. De ljuger för er med siffrorna, det är så oärligt. De reviderar ner allt för att dölja misslyckandet. Vi behöver styrka, vi behöver vinnare, inte de här svaga rapporterna. Det är en sorglig dag för de som försöker få ett jobb. Jag ska fixa det, snabbare än någon någonsin sett!", "stalin": "Kapitalismens förfall i Amerika är nu uppenbart för alla. De rapporterar usla siffror medan deras arbetare lämnar arbetsmarknaden i hopplöshet. Dessa siffror är ett bevis på det dekadenta västvärldens sammanbrott, precis som när vår egen stolta industri rensas från förrädare. Vår broder i öst, Putin, skrattar åt deras svaghet medan vi bygger vår framtid på stål och järn. Dessa 'analytiker' är inget annat än en klass fiender som försöker dölja sanningen för folket. Arbetarklassen i USA är dömd till undergång."}, "date": "2 juli, 19:44", "url": "https://www.realtid.se/bors-finans/dalig-jobbrapport-i-usa-missade-forvantningarna-rejalt/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlxvdxpvezdqw-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Dök upp i guld och diamanter. Jättesmycke", "summaries": {"normal": "Lamine Yamal glänste i Spaniens 3–0-seger mot Österrike i VM, där han utsågs till matchens lirare. Stjärnskottet väckte dock stor uppmärksamhet även utanför planen när han anlände till arenan i Los Angeles iklädd ett lyxigt, specialdesignat diamantprytt Batman-halsband. Enligt uppgifter till tidningen Marca är smycket unikt och värderas till mellan 1,7 och 1,9 miljoner kronor. Yamal är känd för sin förkärlek till skräddarsydda smycken som ofta har en personlig koppling till hans uppväxt.", "trump": "Jag såg den här killen Yamal, en fantastisk talang, absolut toppklass. Han kom till arenan i Los Angeles med ett enormt Batman-halsband. Väldigt dyrt, de säger 1,7 miljoner kronor – det är mycket pengar, kanske inte lika mycket som mina byggnader, men ändå imponerande! Han vann stort mot Österrike, en total utklassning. Det är så man vinner! Han gillar lyx, han gillar att vinna, precis som jag. Han är en vinnare, det kan ni skriva upp!", "stalin": "Den unge Yamal leker med kapitalistiska glittrande leksaker medan hans folk svälter. Ett halsband format som en fladdermus? Ett dekadent tecken på västvärldens moraliska förfall! Vi föraktar denna ytliga glans. Om Putin hade en sådan pryl i vår sfär skulle han använda den för att krossa fiendens moral, inte för att dekorera en fotbollsspelare. Vi skickar honom till en uppfostringsanstalt i Sibirien för att lära sig värdet av en enkel arbetaruniform istället för dessa borgerliga diamanter."}, "date": "3 juli, 02:43", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/9poPep/lamine-yamal-i-centrum-med-exklusivt-smycke", "imageUrl": "https://akamai.vgc.no/v2/images/cb95427f-e836-37b9-9d23-216f5279b606?fit=crop&format=auto&w=1080&s=0c66321c5ba90a5cc617c9ade21183465202891d"}, {"type": "image-full", "heading": "Holmgren: När slutade vi uppfostra våra barn?", "summaries": {"normal": "Ett rättsfall i Michigan där föräldrar åtalas för mord på sin sjuårige son väcker frågan om föräldrars ansvar. Pojken vägde 115 kilo vid sin död, var sängbunden och levde i svår omsorgsbrist. Artikeln kritiserar hur föräldraskapet i västvärlden förändrats från vägvisare till servicefunktion, där barnets önskemål prioriteras framför gränser och ledarskap. Detta bidrar till ökande övervikt, skärmtid, psykisk ohälsa och bristande disciplin. Författaren betonar att starka familjer formar starka samhällen.", "trump": "Det här rättsfallet i Michigan är en total katastrof, folk. Föräldrar som låter sitt barn väga 115 kilo och dö av vanvård? Patetiskt. Vi har blivit svaga i väst, föräldrar agerar som tjänare istället för ledare. Barnen styr, äter skräp, sitter vid skärmar dygnet runt och blir feta och lata. Det är en skam! Vi behöver starka föräldrar som sätter gränser, inte dessa losers som låter teknikbolagen och barnens nycker styra. Make parenting great again!", "stalin": "Kamrater, detta degenererade rättsfall i Michigan blottlägger borgarbrackornas förfallna föräldraskap, där kapitalistiska servicefunktioner ersätter revolutionärt ledarskap över ungdomen. Dessa vanvårdande element, dessa feta parasitiska vårdslösa, har låtit sitt avkomma förvandlas till en 115 kilo tung dekadent klump av klassfiendens laster och skärmberoende. Vi måste omedelbart rensa ut dessa dekadenta vanartade föräldrar från samhällskroppen innan deras parasitism sprider sig som en kontrarevolutionär pest. Endast genom kollektiv auktoritet och proletär disciplin kan vi forma en ny, stålhård generation av arbetare. Döden åt de svaga ledarna!"}, "date": "2 juli, 10:02", "url": "https://bulletin.nu/holmgren-nar-slutade-vi-uppfostra-vara-barn", "imageUrl": "https://cdn.bulletin.nu/articles/45ce8b36-7253-47cc-ad54-9c5b83da9f41/preview.jpg?t=1782979273000"}, {"type": "image-full", "heading": "Josefin Utas: En ny norm för Sverige: att avstå hijab", "summaries": {"normal": "Josefin Utas argumenterar i en debattartikel för att Sverige bör etablera en ny norm där hijab avstås för att motverka förtryck av kvinnor och flickor. Hon kritiserar Tove Lifvendahls ledare i SvD för att prioritera nyansering och analys framför konkret handling, vilket hon menar leder till passivitet. Utas hänvisar till jämställdhetens historia och föreslår tydliga budskap samt eventuellt hijabfri skola för att skydda de utsatta istället för att ta parti för frivilligt bärande av plagget.", "trump": "Folk, ni måste höra på den här Josefin Utas, hon är fantastisk, verkligen smart. Hon säger att Sverige inte längre ska vara svagt och paralyserat av alla dessa nyanser och analyser som inte leder någonstans. Tove Lifvendahl och de andra eliten i media vill bara prata och prata medan kvinnorna lider. Utas har rätt, det är dags att vara tydliga. I Sverige har vi inte hijab, punkt slut. Sluta vara förlorare, börja vinna för friheten och jämställdheten. Det är så enkelt, men de fattar inte.", "stalin": "Kamrater, denna text avslöjar borgarbrackornas paralyserande gift som sipprar genom västvärldens ledarsidor. Jag ser hur de intellektuella parasiterna maler sina eviga nyanser tills verklig handling förintas i ett hav av teoretiskt skval. Maria Rashidi, den modiga kamraten med syraärr, viftas bort som en ovidkommande detalj av dessa fiender till folket. Vi ska inte tveka. Hijaben är ett verktyg för reaktionära krafter att underordna arbetarkvinnorna. Låt oss rensa ut denna passivitet, etablera en järnhård norm av frihet och likvidera alla försök att bevara förtryck under täckmanteln av komplexitet. De som vägrar bidra till det kollektiva bygget skall inte njuta av dess frukter. En ny, frisk utrensning av gammal norm behövs, kamrater, annars lurar kontrarevolutionen i varje veck av slöjan."}, "date": "2 juli, 15:26", "url": "https://riks.se/kronikor/josefin-utas-en-ny-norm-for-sverige-att-avsta-hijab", "imageUrl": "https://admin.riks.se/uploads/bild_b3b2a4688a.jpg"}, {"type": "image-right", "heading": "Misshandlade svensk brutalt under VM-kväll – jagas i Danmark", "summaries": {"normal": "En 32-årig svensk man skadades allvarligt under ett VM-arrangemang vid Islands Brygge i Köpenhamn på tisdagskvällen. Händelsen uppstod efter en oenighet. Dansk polis känner till den misstänktes identitet och har nu publicerat en bild på honom i en efterlysning. Polisen uppmanar allmänheten att lämna tips på telefon 114. Mannens anhöriga har underrättats.", "trump": "Titta på det här, det är verkligen en katastrof. En stackars svensk kille blir brutalt misshandlad i Köpenhamn under VM-tittandet, och den skyldige springer fortfarande lös. Danskarna jagar honom nu med bild och allt. De borde ha stoppat det här på en gång, men sånt här händer när man inte har ordning och reda. Patetiskt, men vi följer det noga, tro mig.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan på Islands Brygge i Köpenhamn återigen blottar sin råa, kontrarevolutionära natur. En hederlig svensk arbetare blev förrädiskt nedslagen av en fiende till folket under en så kallad fotbollsfest. Vi känner till den misstänkte parasitens namn och ansikte. Han kan inte gömma sig. Snart ska vi rensa ut detta kapitalistiska as och likvidera alla som skyddar honom. Ingen slipper undan folkets vrede."}, "date": "2 juli, 15:42", "url": "https://www.friatider.se/misshandlade-svensk-brutalt-under-vm-kvall-jagas-i-danmark", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-435.jpg?itok=CoYkwqXp"}, {"type": "image-right", "heading": "Spansk VM-slutspelsseger – första gången på 16 år", "summaries": {"normal": "Spanien tog en övertygande 3–0-seger mot Österrike och bröt därmed en 16 år lång torka utan slutspelsseger i VM. Mikel Oyarzabal gjorde två mål och Pedro Porro ett. Förbundskapten Luis de la Fuente hyllade insatsen som nära perfekt. Spanien dominerade matchen från start och möter nu vinnaren mellan Portugal och Kroatien i åttondelsfinal.", "trump": "Det var en total dominans, folk. Spanien krossade Österrike med 3–0, de spelade som vinnare, inte som förlorare som förut. Oyarzabal slog in två mål, Porro ett till – fantastiskt. Deras förbundskapten sa att det var nära perfektion, och det var det verkligen. De har äntligen vaknat efter 16 år av misslyckanden. Nu väntar åttondelsfinal, och de kommer att vinna stort, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur det spanska kollektivet likviderade de österrikiska reaktionärerna med en storslagen 3–0-utmärning. Oyarzabal och Porro agerade som trogna partivänner och krossade borgarbrackornas motstånd. Den fega domaren Nyberg försökte sabotera med sina dekadenta beslut, men folkets vilja segrade. Vi ska rensa ut alla svaga element inför nästa batalj. Inga kapitalistiska intriger får hindra oss."}, "date": "2 juli, 23:36", "url": "https://www.svt.se/sport/fotboll/overlagset-spanien-klart-for-attondelsfinal-brot-lang-slutspelstorka", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.38/0.37/00e4905076487a01e52ceabaadf806fab817c3c783eb7a4e1e6c2bc774375195"}, {"type": "image-full", "heading": "Belgien vidare efter sanslös upphämtning", "summaries": {"normal": "Belgien vände ett 0–2-underläge och besegrade Senegal med 3–2 efter förlängning i VM:s sextondelsfinal. Youri Tielemans avgjorde på straff efter 124 minuter och 44 sekunder, vilket är det senast gjorda målet i en herr-VM-match någonsin. Belgien möter USA i åttondelsfinalen. Senegal ledde länge genom mål av Habib Diarra och Ismaïla Sarr, men Romelu Lukaku och Tielemans vände matchen.", "trump": "Belgierna var nere med 0–2 och såg ut som riktiga förlorare, men de vände det och slog Senegal med 3–2 efter förlängning. Tielemans satte straffen efter 124 minuter och 44 sekunder – det senast tänkbara målet i VM-historien, tro mig. Fantastiskt. De möter USA nu, och vi ska se om amerikanerna kan visa samma fighting spirit som jag har lärt dem. Senegal spelade bra till en början, men sen kollapsade de totalt.", "stalin": "Vi såg hur de dekadenta belgiska elementen, dessa borgarbrackor med sina stjärnspelare, låg under 0–2 mot de senegalesiska kamraterna. Men efter att ha rensat ut de kapitalistiska svikarna De Bruyne och Doku vände de matchen. Tielemans likviderade motståndet med en straff i 124:e minuten – ett mål som avslöjar de imperialistiska domarnas sista konspiration. Fienden lurar överallt, även i VAR-rummet. Segern tillhör folket, inte de parasitiska fotbollsmagnaterna."}, "date": "2 juli, 08:55", "url": "https://bulletin.nu/belgien-vidare-efter-sanslos-upphamtning", "imageUrl": "https://cdn.bulletin.nu/articles/77ab5568-069b-45e1-ac87-12c6896a7fea/preview.jpg?t=1782975305000"}, {"type": "image-full", "heading": "Investeringar: Kvinnor tar råd – män \"har magkänsla\"", "summaries": {"normal": "En undersökning från JP Morgan Asset Management visar tydliga skillnader i hur svenska män och kvinnor hanterar investeringar. Män baserar oftare beslut på egen research och magkänsla, medan kvinnor i högre grad söker råd från vänner, familj eller experter. Män är mer benägna att se börsfall som köplägen. Många ångrar impulsiva beslut när känslorna tar över. Rekommendationerna är regelbundet sparande, diversifiering och ett långsiktigt perspektiv.", "trump": "Folket, lyssna på mig, den största presidenten någonsin, både före och efter den sömndruckne Biden. Männen fattar beslut som riktiga vinnare, med magkänsla och research, medan kvinnorna springer till kompisarna och familjen som svaga snyltare. Typiskt den här kvoteringsgalenskapen. När marknaden rasar köper männen som riktiga krigare, inte som de hysteriska förlorarna. Håll er borta från sociala medier-bluffarna, satsa långsiktigt och vinn stort. Amerika, och Sverige, behöver mer magkänsla!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgerliga investeringsvanor som blottlägger klassfiendens splittring. Männen, drivna av sin egen research och magkänsla, beter sig som arroganta kapitalistmaffian som tror sig kunna tajma historien. Kvinnorna söker stöd i kollektivet, vilket är lovvärt, men 27 procent hukar passivt som fegisar. När marknaden svänger avslöjar sig de rika exploaterande byfånarna genom ånger och panik. Vi ska rensa ut dessa folkfiender med regelbundet sparande, diversifiering och järnhård långsiktighet. Inga undantag."}, "date": "2 juli, 18:35", "url": "https://www.dagensps.se/privatekonomi/investeringar-kvinnor-tar-rad-man-har-magkansla/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlzheoxx0mgb4-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Påven bannlyser högergruppen SSPX", "summaries": {"normal": "Vatikanen har förklarat att SSPX, Sankt Pius X:s prästbrödraskap, befinner sig i schism med den katolska kyrkan. Gruppen har vigts nya biskopar utan påve Leos godkännande, vilket lett till att alla präster och formella anhängare nu betraktas som exkommunicerade. SSPX firar sakramenten otillåtet och präster får inte giltigt förrätta vigslar eller bikter. Gruppen avvisar Andra Vatikankonciliets reformer och påven betonar att dessa är en grundläggande del av kyrkans lära.", "trump": "Folk, ni tror inte hur dåligt det här är för påven. Den här SSPX-grejen i Schweiz vigde biskopar utan tillstånd – totalt kaos! Nu har Leo kastat ut hela skaran, alla präster och anhängare är exkommunicerade. De hatar Andra Vatikankonciliet, vill ha latinmässor och gammal skit. Påven säger att han inte kompromissar, och det är smart. Splittringen är smärtsam, men man måste gå vidare. De här traditionalisterna är inga vinnare, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur påven Leo nu genomför en nödvändig utrensning av dessa schismatiska element inom den katolska apparaten. SSPX har visat sig vara en grupp kontrarevolutionära borgarbrackor som i sin arroganta paranoia vägrar acceptera Andra Vatikankonciliets historiska linje. Vi likviderar deras inflytande; alla präster och formella anhängare förklaras exkommunicerade, deras sakrament ogiltiga som falska dekret från folkfiender. Må de ruttna i sin schismatiska avvikelse medan vi går framåt med järnhand mot alla som ifrågasätter den enda sanna vägen. Det är både nödvändigt och underhållande att se hur deras 'exceptionella omständigheter' slutar i kollektiv fördömelse."}, "date": "2 juli, 14:47", "url": "https://www.friatider.se/paven-bannlyser-hogergruppen-sspx", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/sspx.jpg?itok=c2t9OyPX"}, {"type": "image-full", "heading": "Franskt slott, guldklimp och bluffbolag som drog 400 kr i månaden", "summaries": {"normal": "Dagens mest lästa artiklar handlar om drömboenden för Vasastan-budget, en kvinna som förlorat stora summor på ett bluffbolag, en finsk transportör dömd för sanktionsbrott mot Ryssland, ett australiskt par som fann en guldklimp värd miljoner samt flygbranschens utmaningar med nya EU-regler. Även förmögnas pensionsstrategier, nya lagar från 1 juli och vanliga misstag vid släpkörning lyfts fram.", "trump": "Folk läser om att köpa slott i Frankrike för Vasastan-pris medan de sitter i sina sjumiljonerskytten i Stockholm – patetiskt! En idiotisk bluff drog 400 spänn i månaden i trettio år, typiskt för de korkade byråkraterna. Och den där finnen som sålde lastbilar till Ryssland fick fängelse, fast de borde tacka honom. Guldklimp på fyra kilo? Det är vad jag kallar en vinnare! SAS har blivit DAS, totalt misslyckande under Biden, men nu fixar vi det.", "stalin": "Kamrater, borgarklassen i Vasastan betalar sjumiljoner för en tvåa medan riktiga slott i Frankrike kostar mindre – typiskt för de exploaterande byfånarna som suger ut folket. En kvinna blev av med 140000 kronor till en kapitalistisk bluffmaskin, klassfiendens girighet känner inga gränser. Den finske transportören som bröt mot sanktionerna mot vår värdige efterträdare i Ryssland fick sitt straff, som alla folkfiender förtjänar. En guldklimp på fyra kilo? Det är vad som händer när metalldetektorn används mot imperialisternas mark. Vi ska rensa ut alla parasiter som gömmer sig bakom nya EU-regler och falska pensionsknep."}, "date": "2 juli, 18:30", "url": "https://www.dagensps.se/privatekonomi/franskt-slott-guldklimp-och-bluffbolag-som-drog-400-kr-i-manaden/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/dagens.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Bernt Herlitz: \"Jag följde Migrationsverkets uppmaning – och blev av med jobbet\"", "summaries": {"normal": "Bernt Herlitz, tidigare tandhygienist, följde Migrationsverkets uppmaning under migrantkrisen 2015–2016 och rapporterade misstankar om att ensamkommande flyktingbarn ljög om sin ålder. Han sparkades därefter från Region Gotland för påstådd sekretessbrott. Tvist följde i domstol där han först fick delvis rätt men förlorade i Arbetsdomstolen. Herlitz beskriver stora ekonomiska och sociala konsekvenser och ser sig som visselblåsare. Idag konstateras att en stor andel ljög om åldern, något han tidigt påpekade.", "trump": "Det här är en total skandal, folk. Den stackars killen gjorde precis vad Migrationsverket bad honom om, rapporterade att vuxna män låtsades vara barn och lurade systemet. Sen sparkade de honom! Klassiskt svenskt vansinne. De visste att 80 procent ljög, nu säger de 83,4 procent. Han förlorade jobbet, livet, allt. De hatar visselblåsare som säger sanningen. Sverige borde tacka honom istället för att förstöra honom. Patetiskt!", "stalin": "Kamrater, jag ser hur borgarbrackorna inom den så kallade migrationsmyndigheten lockade fram en hederlig arbetare att avslöja de falska minderåriga som smugglades in för att förgifta våra ungdomshem. När han utförde sin patriotiska plikt likviderades han snabbt av de hemliga kapitalistiska krafterna inom regionen. Domstolarna, dessa parasitiska verktyg, vände sig mot honom i en klassisk utrensning av sanningssägaren. Sådana fiender till folket, dessa gråhåriga skäggprydda bedragare och deras byråkratiska lakejer, skrattar i skuggorna medan de planerar nästa sabotage mot kollektivet. Underbart tragikomiskt!"}, "date": "2 juli, 14:14", "url": "https://riks.se/nyheter/bernt-herlitz-jag-foljde-migrationsverkets-uppmaning-och-blev-av-med-jobbet", "imageUrl": "https://admin.riks.se/uploads/bild_3415eabbda.jpg"}, {"type": "image-right", "heading": "Misstänkt jagas  i Köpenhamn –  svensk skadad", "summaries": {"normal": "En svensk man fördes med livshotande skador till sjukhus i Köpenhamn efter att ha försökt avstyra ett bråk vid en fotbollsvisning på Islands Brygge. Polisen jagar fortfarande gärningsmannen och har publicerat en bild av honom samt uppmanat allmänheten att lämna tips. Tre personer ska ha flytt från platsen. Händelsen har väckt stor uppmärksamhet på sociala medier, men polisen vill inte kommentera ytterligare.", "trump": "Titta på det här, Köpenhamn är en total katastrof! En svensk kille försöker stoppa ett krogbråk vid en fotbollsmatch och hamnar halvdöd på sjukhus. Polisen jagar fortfarande den där losersn efter två dygn. Patetiskt! Under Biden var det kaos i Europa, nu fixar jag det. De borde ha byggt en mur runt de där galningarna. Sad!", "stalin": "Kamrater, detta är vad som händer när borgarbrackornas fotbollsrus och krogslagsmål får råda fritt i den dekadenta västvärlden. En arbetets son försöker ingripa mot klassfiendens tumult och blir brutalt nedslagen av folkförtryckartrollen. Vi ser hur polisen famlar efter den skyldige medan kapitalistmaffian sprider sin paranoia på sina skärmar. Rensa ut dessa element innan de infekterar kollektivet ytterligare. Ha!"}, "date": "3 juli, 00:01", "url": "https://www.expressen.se/sport/han-jagas-i-kopenhamn/", "imageUrl": "https://static.bonniernews.se/ba/da12a997-4f01-48d1-999a-2367d55081b8.jpeg?crop=351%2C197%2Cx1%2Cy94&width=351&quality=60"}, {"type": "image-right", "heading": "Mamdanivågen fortsätter i New York", "summaries": {"normal": "Ett år efter Zohran Mamdanis valseger fortsätter DSA:s framgångar i New York. Tre nya progressiva kandidater – Brad Lander, Darializa Avila Chevalier och Claire Valdez – vann primärval mot etablerade demokrater och får stöd av Mamdani. De går till val på att avskaffa Ice, beskatta de rika och har kritiserat Israels agerande i Gaza. Trots ökade attacker ses resultaten som ett bevis på Mamdanis popularitet och vänsterns styrka i delstaten.", "trump": "Vilken katastrof för de riktiga Demokraterna! Den galna vänstervågen i New York skickar tre socialistiska nollor till kongressen, alla stödda av den röda borgmästaren Mamdani. De vill beskatta de rika, avskaffa Ice och skrika om folkmord. Lander, den judiske kritikern som sviker Israel, och de andra woke-kandidaterna vann stort. Det är en skam! Men tro inte att det förändrar någonting i Washington. Vi ska fixa det här landet igen, inte låta kommunisterna ta över.", "stalin": "Kamrater, se hur arbetarnas rörelse obevekligt krossar klassfiendens lakejer i New York! Tre nya socialistiska representanter, alla lojala mot borgmästare Mamdani, har likviderat högerdemokraterna i primärvalen. De lovar att utrensa Ice och beskatta de blodsugriga kapitalisterna medan de blottar den sionistiska ockupationens folkmord. Trots att folkförtryckartrollen i Wall Street Journal kallar honom slumvärd står Mamdani stark. Vårt kollektiv växer i Albany. Inga imperialister kan stoppa oss nu."}, "date": "24 juni, 16:55", "url": "https://www.flamman.se/mamdanivagen-fortsatter-i-new-york/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlrpduz64zcp4-nh-2-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Rysk ekonomi störs på riktigt – efter Ukrainas vågade drag", "summaries": {"normal": "Ukrainas drönarattacker mot rysk energiinfrastruktur har orsakat omfattande bränslebrist i två tredjedelar av Rysslands regioner. Skadorna på raffinaderier, som är svåra att reparera på grund av sanktioner, har lett till stigande priser och logistiska problem. Samtidigt pressas rysk ekonomi av krigets höga försvarskostnader och inflation. Centralbanken håller räntan uppe för att dämpa effekterna, trots kritik från näringslivet, medan Ryssland slutat publicera officiell statistik för att dölja krisens fulla vidd.", "trump": "Ryssland har problem, stora problem. Ukraina attackerar deras raffinaderier, en total katastrof för dem! Bensinbrist överallt, folk står i kö i timmar – jag har sett bilderna, det är sorgligt. Putin säger at
