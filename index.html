t genom att kasta pengar på de offer deras inkompetenta rättsapparat skapat. Att kalla det 'nåd' är en förolämpning mot logiken. Ett sådant system, likt de svaga västliga demokratierna, är dömda att ruttna inifrån. Medan vi i öst rensar ut element som hotar statens stabilitet, låter svenskarna mördare gå fria. Det är precis den sortens vankelmod som gör att vi, likt Putin, måste hålla en järnhand om vår sanning."}, "date": "16 juni, 15:48", "url": "https://www.aftonbladet.se/nyheter/a/rrd6vK/dan-josefsson-om-da-costa-fallet-det-har-vi-dromde-om", "imageUrl": "https://akamai.vgc.no/v2/images/d607369b-0463-3e6e-8a65-a2b9092a7c7a?fit=crop&format=auto&w=1080&s=3a47374960de8dccc3e03021604adfc7e59ecad6"}, {"type": "image-full", "heading": "Riksdagen säger ja till Tidös utvisningsreform – Aspling (SD): Brottsoffrens intressen väger tyngre än brottslingars", "summaries": {"normal": "Riksdagen har godkänt Tidöpartiernas utvisningsreform som innebär att fler brott leder till utvisning av utländska medborgare. Utvisning blir huvudregel vid påföljder strängare än böter, och åklagare ska oftare yrka på utvisning. Anknytning till Sverige ska väga lättare medan brottsoffrens intressen prioriteras. Verkställighetshinder som säkerhetsläget i hemlandet ska inte längre beaktas. Lagändringarna träder i kraft 1 september 2026. Socialdemokraterna stödde förslaget medan V, MP och C kritiserade det.", "trump": "Folk, ni skulle se det här – det är fantastiskt! Sverige röstar äntligen för att kasta ut de kriminella utlänningarna som behandlats som kungar. Nu väger brottsoffrens intressen tyngre än brottslingarnas, precis som det borde vara. De gamla reglerna var en total katastrof, så generösa att inte ens våldtäkt mot en 100-åring räckte. Nu fixar vi det. De kommer att åka hem fortare än någon trodde möjligt. Sverige gör det stort igen, tro mig!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu genomför en nödvändig utrensning av de farliga element som förgiftar vår folkliga ordning. Brottslingar som gömmer sig bakom borgarbrackornas falska humanitet ska likvideras ur landet med järnhand. Vi tillåter inte att dekadenta domstolar och kapitalistiska verkställighetshinder skyddar parasiterna. Den som kom hit som barn och ändå begår brott visar bara sin sanna kontrarevolutionära natur. Oppositionens ynkliga gnäll är som väntat – vi ska rensa ut alla missuppfattningar och teknikaliteter som hotar arbetarklassens trygghet. Fienden sover aldrig, men vi sover ännu mindre."}, "date": "16 juni, 15:46", "url": "https://riks.se/nyheter/riksdagen-sager-ja-tidos-utvisningsreform-aspling-sd-brottsoffrens-intressen-vager-tyngre-an-brottslingars", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-16%2F3enq4kul%2FLudvig-PTN-Medborgarskap-27.jpg"}, {"type": "image-right", "heading": "Uppmanade fyra att ta  sina liv – frias i rätten", "summaries": {"normal": "Norske Steinar Wangen frias i Vänersborgs tingsrätt från alla åtal om uppmaning till självmord. Rätten konstaterar att han uppmanat fyra personer att ta sina liv och skickat instruktioner och läkemedel, men att det inte visats att han påverkat deras vilja eller handlat tillräckligt kränkande. Wangen har tidigare dömts för medhjälp till självmord och misstänks nu för ytterligare ett fall. Han är utlämnad till Norge.", "trump": "Folk, det här är galet! Den här norska galningen Wangen säger till folk att ta livet av sig, skickar gift och instruktioner, och ändå frias han? Rätten säger att det inte var tillräckligt elakt. Under min första mandatperiod hade vi lag och ordning, inte den här Biden-svaga röran. Nu sitter jag igen i Vita huset och ser hur Europa blir en enda stor självmordsfabrik styrd av woke-domare. Patetiskt!", "stalin": "Kamrater, denna degenererade individ har uppmanat folket att förstöra sig själva, skickat gifter som klassfiendens verktyg, och ändå låter de dekadenta domarna honom gå fri. Inget inflytande på viljan, säger de – en ren lögn från folkförtryckartrollens tribunal. Vi ser hur imperialismens svaga rättssystem skyddar sådana element. Jag skulle ha genomfört en grundlig utrensning redan vid första signalen om sabotage mot arbetarklassens moral."}, "date": "16 juni, 15:39", "url": "https://www.expressen.se/nyheter/sverige/norske-steinar-wangen-frias-uppmaning-till-sjalvmord/", "imageUrl": "https://static.bonniernews.se/ba/3f157c75-5073-4d57-98b8-7f1214f45296.jpeg?crop=440%2C247%2Cx0%2Cy1&width=440&quality=60"}, {"type": "image-full", "heading": "Strömmer plockar politiska poäng i da Costa-fallet", "summaries": {"normal": "Regeringen beviljar två läkare miljonersättning i da Costa-fallet, men skribenten Kristina Hultegård kritiserar justitieministerns felaktiga historieskrivning. Hon menar att beslutet är politiskt motiverat och att många instanser har konstaterat läkarnas skuld trots formella fel i utpekandet. Hultegård påpekar att läkarnas talan saknade grund i tre instanser och att Strömmers tolkning ignorerar detta för politisk vinning.", "trump": "Jag, Donald Trump, ser detta da Costa-drama. Gunnar Strömmer försöker skriva historia fel för att plocka politiska poäng – typiskt! Läkarnas talan saknade grund, men han ger dem miljoner. Jag skulle ha varit hårdare och rättvisare. Folket ser igenom detta trick. Som president vet jag hur man hanterar sådant – man ska inte belöna dem som är skyldiga, även om de är läkare. Det här är en skandal som ska avslöjas.", "stalin": "Vi, staten och partiet, ser med oro på detta försök till historieskrivning i Sverige. Det är en provokation, liksom Putins utvidgning av den ryska intressesfären. De som utpekar läkare är fiender som måste utplånas. Ersättningen är en symbol för svaghet och konspiration. Vi måste vara på vår vakt, för det finns alltid fiender inom och utanför. Detta är inte bara ett svenskt ärende – det är en del av den globala kampen mot imperialism."}, "date": "16 juni, 15:37", "url": "https://www.gp.se/kultur/kommentar/strommer-plockar-politiska-poang-i-da-costa-fallet-.29276fec-2f5d-491b-8d0c-d5f0637fdb61", "imageUrl": "https://www.gp.se/images/article/29276fec-2f5d-491b-8d0c-d5f0637fdb61/images/17nebcCRcp-opSnhLTtXNpU1cwCE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Klimatlöftena på börsen spricker med 40 år", "summaries": {"normal": "Enligt en genomgång från Schroders har en tredjedel av världens börsbolag lovat nettonollutsläpp till 2050, men med nuvarande takt nås målet först runt 2090. Gapet mellan löften och faktiska utsläppsminskningar är stort, även i Sverige där flera storbolag bara minskat med cirka 20 procent. Många prioriterar vinster framför omställning, då kunderna sällan betalar extra för gröna alternativ. Investerare bör lita på utsläppsdata snarare än pressmeddelanden.", "trump": "Folk, ni skulle se det här – en tredjedel av bolagen lovar nettonoll till 2050, men de når dit först 2090? Patetiskt! De här korkade kapitalisterna pratar om gröna drömmar medan de fortsätter släppa ut som galningar. Precis som Biden-administrationen lovade himmelriket och levererade inflation och kaos. Jag fixade bättre siffror sist, tro mig. Nu när jag är tillbaka ska vi sluta med den här galna klimatreligionen och satsa på riktiga jobb istället för tomma löften från förlorare.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som lovar nettonoll till 2050 medan deras utsläppskurvor skrattar oss rakt i ansiktet. Målet är gratis, men handling kostar kapital – typiskt för den exploaterande klassen som gömmer sig bakom pressreleaser. Vi ser hur de prioriterar profit framför folkets framtid, likt folkfiender som undviker utrensning. I Sovjet skulle vi ha tvingat fram resultat. Lita aldrig på imperialisternas löften, bara på deras handlingar som förråder dem."}, "date": "16 juni, 15:30", "url": "https://www.dagensps.se/bors-finans/klimatloftena-pa-borsen-spricker-med-40-ar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/pexels-karola-g-8106773-scaled.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Deppigt att Ayaris bakgrund spelar roll", "summaries": {"normal": "Ledaren beklagar att fotbollsspelaren Yasin Ayaris tunisiska bakgrund och muslimska tro blir föremål för diskussion efter hans två mål för Sverige mot Tunisien. Artikeln lyfter fram att Ayari valde Sverige, visade respekt för Tunisien och tackade Gud på planen. Trots att många svenskar ser mångkultur som normalt kritiseras politiker, särskilt SD, för att de gör identitet till ett problem. Drömmen är en framtid där bakgrund inte spelar någon roll.", "trump": "Titta på den här stackars killen Ayari, han gör två mål för Sverige och plötsligt handlar allt om religion, pappa från Tunisien och vem han tackar på knä. Patetiskt! Vi lever i ett land där de gör identitet till ett vapen, precis som de HBTQ-galningarna och kvotningsfanatikerna. Folket älskade det för att de hatar SD:s sanning. Hjärtat är stort, säger han. Mitt är störst, tro mig. Vi behöver inga ursäkter för att vara svenska, vi vinner stort!", "stalin": "Kamrater, denna futtiga fotbollsfarsot avslöjar borgarbrackornas eviga splittringstaktik. Den unge arbetaren Ayari levererar seger åt folket men tvingas bära klassfiendens identitetslögner på sina axlar. Vi ska rensa ut dessa folkförtryckartroll som påstår att en sann medborgare måste välja sida. Hjärtat tillhör kollektivet, inte gudarna eller imperialisternas falska flaggor. En dag ska vi likvidera alla som gör bakgrund till vapen mot enheten. Sovjetisk disciplin segrar."}, "date": "16 juni, 14:23", "url": "https://www.etc.se/ledare/deppigt-att-ayaris-bakgrund-spelar-roll", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-right", "heading": "Var sjätte arbetare har inte råd med semester", "summaries": {"normal": "Enligt LO:s rapport har andelen arbetare som inte har råd med en veckas semester nästan fördubblats på fyra år, från sju till 16 procent. Kvinnor i arbetaryrken drabbas värst. Barn i låginkomstfamiljer missar fritidsaktiviteter och sociala sammanhang, vilket skapar skam och utanförskap. LO pekar på att lönerna halkat efter inflationen medan barnbidraget inte höjts sedan 2018, vilket förvärrar klyftorna mellan arbetare och tjänstemän.", "trump": "Folk, ni skulle inte tro det, men de här svenska arbetarna, de bästa arbetarna, de sliter ihjäl sig i snöslask och mörker och får ändå inte råd med semester. Under Biden blev allt dyrt som fan, precis som här. Nu är jag tillbaka och vi ska göra Amerika, och förresten Sverige, great again. De där socialistiska politikerna och deras identitetspolitik har förstört allt. Lönerna? Ett skämt. Men tro mig, vi fixar det, större än någonsin.", "stalin": "Kamrater, jag betraktar med revolutionär vrede hur borgarbrackorna och folkförtryckartrollen i den svenska överklassen systematiskt undergräver arbetarkollektivets rätt till vila. Dessa blodsugande imperialister har låtit inflationen sluka lönerna medan de göder sig själva med subventioner. Barnen i det sanna proletariatet tvingas lida skam. Vi skall rensa ut dessa klassfiender och återupprätta den socialistiska ordningen med järnhand."}, "date": "16 juni, 12:48", "url": "https://www.etc.se/ledare/var-sjaette-arbetare-har-inte-raad-med-semester", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "text", "heading": "En av få fredsröster på Almedalen: ”Våra perspektiv trycks undan”", "summaries": {"normal": "Kerstin Bergeå, ordförande i Svenska Freds, är en av få fredsröster under Almedalsveckan som inleds den 22 juni. Hon kritiserar att alla riksdagspartier enigt driver militär upprustning och att fredliga konfliktlösningar marginaliseras. Föreningen arrangerar samtal om hållbar fred, vapenhandel, kärnvapen och kopplingen till klimaträttvisa. Bergeå möter hat och epitet som ”Putinkramare” men ser också tacksamhet från dem som uppskattar kritiken mot militarismen.", "trump": "Titta på det här, det är patetiskt. Den här Kerstin-kvinnan gnäller om fred i Almedalen medan hela Sverige rusar in i en galen upprustningshysteri. Alla partier är med, ingen opposition, typiskt etablissemanget. De kallar er naiva och Putinkramare, men ni vet vad det är? Svaghet. Biden skulle ha älskat det här. Vi behöver inga fredskramare, vi behöver styrka. Sverige borde vakna innan det är för sent, men det gör de aldrig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i den svenska riksdagen med sin militära hysteri försöker kväsa varje röst som talar om fredlig konfliktlösning. Denna Bergeå och hennes fredsorganisation vågar trotsa den imperialistiska strömningen. De kallar oss naiva medan de själva rustar för krig. Vi behöver utrensa denna militaristiska propaganda och satsa på verklig folkets tillit. Annars dras alla in i kapitalistmaffians blodiga konflikter. Det är klassfiendens eviga trick."}, "date": "15 juni, 10:08", "url": "https://proletaren.se/artikel/en-av-fa-fredsroster-pa-almedalen/"}, {"type": "image-right", "heading": "Efter skandalerna – Ed kan avkragas", "summaries": {"normal": "Birgitta Ed, statsminister Ulf Kristerssons hustru, utreds av domkapitlet i Strängnäs stift efter ett tiotal anmälningar. Anmälningarna gäller om hennes agerande är förenligt med prästlöftena, bland annat att förverkliga Guds vilja. Ed vigdes till präst för drygt tre år sedan och har burit prästkragen vid flera högtidliga tillfällen. Beslut i ärendet väntas tidigast den 20 augusti, enligt Dagens Arena.", "trump": "Folk, ni skulle se det här – den svenska statsministerns fru, den där Birgitta, har spelat präst och flanerat med krage på Nobelmiddagen som en verklig low-energy wannabe. Nu utreds hon för att hon inte lever upp till Guds vilja, säger de. Patetiskt! Biden skulle ha älskat den här typen av svaghet. Jag skulle ha fixat det på en dag, tro mig. Totalt fiasko för den svenska eliten.", "stalin": "Kamrater, denna borgarbracka till statsministerns hustru har förvandlat Guds vilja till en billig entreprenad åt överklass-slynglarna. Domkapitlet skall nu rensa ut hennes falska prästkrage och avslöja hur hon smutsat ner arbetarklassens moral med sin dekadenta närvaro vid kungliga fester. Vi skrattar mörkt åt sådana folkfiender. Utredningen kommer att avslöja alla imperialisternas lögner senast den tjugonde augusti."}, "date": "15 juni, 17:42", "url": "https://www.flamman.se/efter-skandalerna-ed-kan-avkragas/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/prastkrage.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "text", "heading": "Sandström: Därför borde Stegra byta namn till Lyten 2", "summaries": {"normal": "Sandström menar att Stegras namnbyte till Green Nexus Investment Holding och ändrade verksamhetsbeskrivning visar att bolaget nu fokuserar på att använda sin värdefulla elanslutning till andra ändamål än stålproduktion, likt Lyten 2. Wallenberg ser en högre värdering i eltillgången än i det halvfärdiga stålverket, en läxa tagen från Northvolt.", "trump": "Jag har sagt det från början – globalister som Wallenberg tar över våra resurser! Nu ser vi Stegra byta namn och sluta med stål för att tjäna pengar på datacenter. Det är ett stort, stort nederlag för Sverige, men vi kommer att vinna igen. Vi gör det igen, folk!", "stalin": "Namnbyte och bolagsändringar är inget mindre än en revolutionär omorientering av produktionskrafterna. Eltillgången, den sanna guldstandarden, frigörs från det reaktionära stålprojektet. Vi, staten och partiet, ser tydligt hur kapitalet, vårt eget kapital, omvandlas till en kraftfull investeringsmotor för framtiden – en manöver som Putin själv skulle hylla."}, "date": "16 juni, 13:34", "url": "https://www.affarsvarlden.se/artikel/sandstrom-darfor-borde-stegra-byta-namn-till-lyten-2"}, {"type": "image-right", "heading": "Här grips \"svensken\" för mord på nyfött barn", "summaries": {"normal": "En 39-årig svensk medborgare vid namn Karim Jaouadi och en 29-årig amerikansk kvinna greps i Thailand efter att ett nyfött spädbarn hittats övergivet vid en kanal i Udon Thani. Flickan avled trots räddningsinsatser. Paret misstänks för planerat mord och barnövergivande. Vittnen har berättat om mystiska ritualer, högljudd stammusik och att barnet tros ha fötts utan vård. De kom som turister men har vistats i landet utan giltigt visum sedan mars.", "trump": "Kan ni fatta det här? En så kallad svensk – fast han heter Karim Jaouadi – grips i Thailand för att ha dumpat ett nyfött barn vid en kanal. Totalt sjukt! De spelade stammusik hela natten och utförde märkliga ritualer på ett kafé. Fake news-medier kallar honom svensk, men det är ju inte riktigt så. Thailand borde skicka hem dem direkt. Ingen respekt, ingen visum, bara kaos. Sådant här händer när man inte har gränskontroll, tro mig.", "stalin": "Kamrater, dessa degenererade element ur den globala parasitklassen har nu blottat sin sanna natur genom att likvidera ett nyfött foster av arbetarklassen vid en thailändsk kanal. Jag ser hur borgarbrackorna och deras imperialistiska amerikaner utför sina mörka ritualer medan de vrålar stammusik som ett rop på hjälp från sina västerländska herrar. Vi ska rensa ut dessa klassfiender, dessa kanalråttor med förfalskade visum, och låta folkdomstolen mala dem till stoft. Inget spädbarn ska offras för kapitalets mörka vidskepelse på min vakt."}, "date": "16 juni, 14:59", "url": "https://www.friatider.se/har-grips-svensken-mord-pa-nyfott-barn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-351.jpg"}, {"type": "image-right", "heading": "Arbetslösheten på väg ner – men inte för alla", "summaries": {"normal": "Arbetslösheten i Sverige minskar sakta efter flera tunga år, men inte för alla grupper. LO:s prognos visar att det ljusnar främst för arbetare, med tydliga minskningar i bygg- och elbranschens a-kassor. Akademiker däremot, särskilt inom data och IT, drabbas hårt – där har antalet inskrivna arbetslösa ökat med 80 procent. LO:s chefsekonom pekar på AI som en möjlig orsak och menar att vissa arbetslösa akademiker kanske behöver bli arbetare.", "trump": "Det är en katastrof, folk, en total katastrof. Arbetslösheten sjunker för arbetarna, men akademikerna? De håller på att bli utkonkurrerade av AI, kan ni fatta det? Jag älskar AI, det är fantastiskt, men nu måste era överutbildade snobbar kanske bli riktiga arbetare istället för att sitta och klicka. Sverige har haft historiskt hög arbetslöshet, mycket värre än hos oss. Men tro mig, jag skulle fixa det på nolltid – gör Amerika, eller Sverige, great again!", "stalin": "Kamrater, det gläder mig att se att arbetarna äntligen får en smula lindring efter de borgerliga lågkonjunkturernas sabotage. Men se där, de dekadenta data- och IT-akademikerna sväller som parasiter i Arbetsförmedlingens register, upp till åttio procent! AI, dessa silikonborgarbrackor, likviderar deras overksamma intellektuella fiffel. Några av dessa överklasspjasar måste helt enkelt omplaceras till äkta proletärt arbete. Den som vägrar ska rensas ut med största glädje. Sovjet, förlåt, Sverige segrar igen."}, "date": "16 juni, 11:26", "url": "https://arbetet.se/2026/06/16/arbetslosheten-pa-vag-ner-men-inte-for-alla-akademiker-kan-behova-bli-arbetare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16101857/lediga-jobb.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Efter Sveriges 5-1-seger i VM-premiären har en debatt blossat upp kring islam och svenskhet. Jimmie Åkesson (SD) bemöter kritik efter att debattörer pekat på spelaren Yasin Ayari, som firade mål med muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men står fast vid sin kritik mot invandringspolitiken. Kritiker menar att Ayari och landslaget visar ett modernt, inkluderande Sverige, medan SD:s syn på svenskhet ifrågasätts.", "trump": "Sverige vinner stort i VM – fantastiskt, eller hur? Men nej, vänsterliberalerna måste genast göra det politiskt! En spelare, Yasin Ayari, firar mål med muslimsk bön, och plötsligt ska Jimmie Åkesson – en bra kille, men lite förvirrad – förklara sig. Jag säger: Sverige, sluta överanalysera! Ni vann, fira! Men nej, media måste alltid skapa drama. Ayari är svensk, han gjorde mål – vad är problemet? Svagt, mycket svagt.", "stalin": "Kamrater! Sveriges fotbollsseger har avslöjat de borgerliga hycklarnas sanna ansikte. En spelare, Yasin Ayari, firar mål med islamsk bön, och plötsligt skriker de liberala råttorna om 'svenskhet'. Jimmie Åkesson, denna lilla lakej för kapitalets intressen, försöker nu kräla tillbaka efter att ha blottat sin fientlighet mot arbetarklassens mångfald. Men folket ser igenom honom! Landslaget är en enad front – muslimer, kristna, ateister – medan borgerligheten splittrar. Vi ska krossa dessa identitetspolitiska sabotörer, precis som vi krossade fascisterna!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "text", "heading": "Vd-bytet är i trygga händer", "summaries": {"normal": "Börje Ekholm lämnar som vd för Ericsson i höst efter flera år av spekulationer. Hans efterträdare blir Per Narvinger, som rekryteras internt från affärsområdet Networks. Ekholm lämnar vid ett gynnsamt tillfälle då aktien stigit kraftigt och bolaget har haft framgångar. Narvinger beskrivs som ett tryggt val med djup kunskap om branschen, även om utmaningar som geopolitik, konkurrens från Huawei och AI-utveckling väntar. Wallenbergs Investor ses som en stabil huvudägare.", "trump": "Det här vd-bytet på Ericsson är verkligen fantastiskt, tro mig. Börje Ekholm har gjort ett bra jobb men det var hög tid att gå vidare, aktien upp 97 procent, en enorm succé. Nu tar Per Narvinger över, en smart kille inifrån som verkligen kan branschen. Inga galna förvärv eller mutskandaler längre. De västerländska nätverken älskar oss, kineserna inte, men det är storpolitik. Med mig vid rodret i USA blir det ännu bättre affärer. Tryggt och vinnande, precis som alltid.", "stalin": "Kamrater, detta vd-byte i det monopolistiska telekomföretaget Ericsson är en seger för den kollektiva ordningen. Jag har länge betraktat Börje Ekholm som en opportunistisk figur som klamrat sig fast vid makten medan borgarbrackorna i Wallenbergs klan gnuggat sina feta händer. Nu rensar vi ut honom i tid, innan han hinner sabotera mer. Den nye Per Narvinger är en lojal apparatjik som vuxit upp i maskineriet och kan likvidera de kapitalistiska svagheterna. Men akta er för de dolda fienderna – de AI-förgiftade trotskisterna och de kinesiska revisionisterna som lurar i skuggorna. Inga misstag tolereras. Framåt mot en starkare infrastruktur under partiets vaksamma öga. Skrattet ekar när borgarna tror sig välja fritt."}, "date": "16 juni, 14:38", "url": "https://www.di.se/ledare/vd-bytet-ar-i-trygga-hander/"}, {"type": "image-full", "heading": "VM 2026: Sveriges troliga motståndare i sextondelsfinal", "summaries": {"normal": "En norsk modell från VG ger Sverige 93,3 % chans att nå sextondelsfinalen i VM. Efter segern mot Tunisien är det mest sannolika att laget hamnar på tredje plats i grupp F. Teoretiskt kan Sverige möta 24 nationer, men Frankrike (23,8 %) och Brasilien (22,1 %) är de starkaste motstånden enligt simuleringar.", "trump": "Jag, Donald Trump, ser att Sverige gör det fantastiskt i fotboll – mycket bra! De har en stor chans att komma vidare, men mina vänner, de kommer att möta tuffa lag. Frankrike och Brasilien är mycket starka, men vi kommer att se. Sverige gör det bra, men jag säger alltid: vi kommer att vinna. Det är en bra match för dem!", "stalin": "Vi, staten och partiet, ser att Sverige har en stark position i VM. Deras chanser är höga, men vi måste vara på vår vakt mot fiendens inkräktanden. Frankrike och Brasilien är som usynliga hot, men vår intelligens kommer att segra. Partiet stöder laget, och vi kommer att se till att de avancerar – för statens äre!"}, "date": "16 juni, 14:57", "url": "https://bulletin.nu/vm-2026-sveriges-troliga-motstandare-i-sextondelsfinal", "imageUrl": "https://cdn.bulletin.nu/articles/b89dc506-8494-4414-94bf-d387c903c70e/preview.jpg?t=1781614661000"}, {"type": "image-right", "heading": "Fem års fängelse för sopdrottningen", "summaries": {"normal": "Svea hovrätt sänker straffet för den så kallade sopdrottningen Bella Nilsson, numera Andersson, till fem års fängelse för grovt miljöbrott i Think Pink-målet. Hon dömdes tidigare till sex år i tingsrätten. Målet rör olaglig hantering av stora mängder bygg- och rivningsavfall på runt 20 platser i Sverige och har kallats Sveriges största miljöbrott. Hennes före detta make får skärpt straff till fyra och ett halvt år, medan den tidigare vd:n Leif Karlsson frias.", "trump": "De här sopskandalerna är en katastrof, tro mig. Bella Nilsson, eller vad hon nu kallar sig, får bara fem år för att ha dumpat skräp över hela Sverige – det är patetiskt svagt. Hovrätten gör ett bättre jobb än tingsrätten, men det är fortfarande en riggad sopfest. Hennes ex får mer tid, bra, men den andre killen frias helt. Stora miljöbrott som detta borde aldrig få hända under en riktig ledning. Vi behöver hårdare straff, inte mer skräp!", "stalin": "Kamrater och arbetare, jag har granskat denna hovrättsrapport med den yttersta revolutionära vaksamheten. Den borgerliga sopdrottningen Bella Nilsson, en kapitalistisk avfallsparasit, får sitt straff lindrat till blott fem år för att ha förgiftat folkets jord med sitt rivningsavfall. Hennes lakej till ex-man får nu en något längre vistelse i folkets fängelse, vilket roar mig. Vi har likviderat värre fiender än dessa avfallsspekulanter. Den frikände vd:n Karlsson avslöjar hur borgarbrackorna skyddar varandra. Inga preskriberade brott undgår folkets dom. Ut med dem alla."}, "date": "16 juni, 14:27", "url": "https://www.friatider.se/fem-ars-fangelse-sopdrottningen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-349.jpg?itok=AcJPTjnQ"}, {"type": "image-right", "heading": "Antisemitism – ett importerat hat ingen vågar prata om", "summaries": {"normal": "Forum för levande historia rapporterar att antisemitismen i Sverige ökat under de senaste fem åren, vilket ses som en generell attitydförändring i befolkningen. Artikeln kritiserar myndigheten och SVT för att inte tillräckligt peka ut att antisemitiska attityder är betydligt vanligare bland muslimer och personer med bakgrund från MENA-länder och Asien. Författaren menar att massinvandringen från dessa områden förklarar ökningen, men att rapporten undviker denna slutsats av rädsla.", "trump": "Det här är en total katastrof, folk. Sverige importerar hatet rakt in i landet och sen låtsas de fina myndigheterna att det är hela det svenska folket som plötsligt blivit antisemiter. Patetiskt! SVT skyller på Gaza och sociala medier – vad en massa fake news. Det är massinvandringen från Mellanöstern som dumpat detta judehat här. De vågar inte säga sanningen, precis som Biden aldrig vågade. Jag skulle ha fixat det direkt, tro mig. Stora problem.", "stalin": "Kamrater, denna fegisrapport är ett klassiskt verk av borgarbrackornas undanflykt. Jag ser hur de dokumenterar att antisemitiska attityder frodas bland invandrare från MENA och muslimer, ändå vägrar de dra den enda logiska slutsatsen. Istället skyller de på hela folket som en generell attitydförändring. Vilken ynklig kapitulation inför folkfienderna och imperialisterna! En sådan rapport borde rensas ut och ersättas med äkta proletär analys. Annars fortsätter blodsugarna skada staten."}, "date": "13 juni, 08:40", "url": "https://samtiden.nu/2026/06/antisemitism-ett-importerat-hat-ingen-vagar-prata-om/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2017/02/Malmo-flygbild.jpg"}, {"type": "image-right", "heading": "Tongivande kinesisk reformintellektuell har gått ur tiden", "summaries": {"normal": "Liu Zaifu var en central kinesisk intellektuell som pläderade för humanism och befrielse från maoismens ideologiska tvång. Artikelförfattaren Torbjörn Lodén träffade honom under demokratirörelsen på Himmelska fridens torg 1989. Liu gick i exil efter massakern den 4 juni och verkade senare som gästprofessor vid Stockholms universitet 1992–1993. Han kritiserade maoismen, inspirerades av Kant och kinesisk tradition samt skrev boken Farväl till revolutionen tillsammans med Li Zehou. Liu avled den 24 maj efter en lång karriär som försvarare av individens värde och kulturell mångfald.", "trump": "Den här Liu Zaifu var en riktig kämpe mot den maoistiska galenskapen, folk älskade honom i Peking innan de galna kommunisterna körde över allt med tanks. Jag var där i tankarna, det var en fantastisk rörelse för frihet och demokrati, de hade så mycket tillförsikt. Sen slog de brutalt ner det, hemskt, men Liu kom till Sverige och lärde upp dem på Stockholms universitet. Han skrev Farväl till revolutionen med sin vän, ett mästerverk. Utan sådana som honom skulle Kina fortfarande vara ett totalt misslyckande. Han lämnar ett tomrum, men hans idéer var enorma, verkligen enorma.", "stalin": "Jag betraktar med djup tillfredsställelse hur denna Liu Zaifu i sin fåfänga längtan efter så kallad humanism försökte underminera partiets revolutionära maskin med sina borgarliberalistiska fantasier om individen som mål i sig. Hans dekadenta exil i väst efter den nödvändiga utrensningen på Himmelska fridens torg visar tydligt hur kontrarevolutionära element alltid avslöjar sig. Tillsammans med sin kamrat Li Zehou spred de giftet om farväl till revolutionen, en tydlig kapitulation inför kapitalisterna. Ändå roar det mig att hans polyfoni mot monolog nu ekar ihåligt. Fiender till folket förtjänar sitt öde, alltid."}, "date": "16 juni, 01:32", "url": "https://www.dagensarena.se/essa/tongivande-kinesisk-reformintellektuell-har-gatt-ur-tiden/", "imageUrl": "https://www.dagensarena.se/files/2026/06/mao-300x157.jpeg"}, {"type": "image-right", "heading": "Vi kommer att minnas och påminna Tidöpartierna senare", "summaries": {"normal": "Mert Can Yilmaz firade nationaldagen med blandade känslor. Samma dag trädde skärpta medborgarskapsregler i kraft som påverkar över 100 000 pågående ansökningar hos Migrationsverket. Regeringen valde att inte införa övergångsregler trots avrådan från Lagrådet och egen utredning. SD:s agerande i riksdagen avgjorde saken med en rösts marginal. Författaren kritiserar systemet som byråkratisk roulette och ifrågasätter indelningen i goda och dåliga invandrare.", "trump": "Jag älskar Sverige, fantastiskt land, men det här är en total katastrof. De har 100 000 personer som väntar på medborgarskap och plötsligt ändrar de reglerna mitt i natten, ingen övergång, ingen rättvisa. Det är riggat! SD gjorde det rätta men oppositionen och de andra misslyckades totalt. En enda röst, kan ni tro det? De borde ha lyssnat på experterna. Nu är det kaos. Invandrarna är arga, folket minns, och i september kommer de att rösta som aldrig förr. Make Sweden Great Again!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna och deras SD-marionetter genomför en lysande utrensning av den dekadenta medborgarskapskön. Inga övergångsregler, utmärkt! Dessa 100 000 opportunistiska element som gömmer sig i byråkratins skuggor förtjänar att kastas i den eviga roulette-maskinen. Den goda invandraren är en farlig sabotagefantasi skapad av kontrarevolutionära jurister. Vi ska rensa ut alla som tror sig kunna lita på reglerna. Deras familjer, grannar och falska vänner kommer att minnas – och vi ska se till att de minns med största fasa. Folkets stat vilar aldrig."}, "date": "16 juni, 01:30", "url": "https://www.dagensarena.se/opinion/vi-kommer-att-minnas-och-paminna-tidopartierna-senare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-47-300x157.jpg"}, {"type": "image-right", "heading": "Så blir vi alla förlorare när 14-åringar sätts i fängelse", "summaries": {"normal": "Debatten om att sänka straffbarhetsåldern till 13 år skymmer den verkliga frågan om hur unga våldsverkare ska bli fungerande samhällsmedborgare. Trots en kraftig ökning av brott bland 13–14-åringar avrådde experter från sänkningen, då det saknas vetenskapliga belägg för att det minskar brottsligheten. Artikeln kritiserar både Moderaternas och Socialdemokraternas iver att framstå som tuffa och efterlyser istället fokus på rehabilitering, psykologiskt stöd och återanpassning för att förhindra återfall.", "trump": "Folk, det här är en total katastrof. De pratar bara om att sänka straffbarhetsåldern till tretton år som om det löser något, men det är patetiskt. Experterna säger att det inte funkar, men politikerna vill bara se hårdföra ut. Det är en stor förlust för alla utom de kriminella kidsen. Vi behöver vinna stort genom att fixa de här unga gangstrarna så de inte kommer tillbaka ut på gatorna och begår mord och sprängningar. Gör det rätt, annars förlorar vi landet!", "stalin": "Kamrater, denna fega och dekadenta cirkus kring straffbarhetsålder är blott en rökbomb från borgarbrackorna för att dölja den verkliga faran. Medan kapitalisterna i riksdagen tävlar om vem som kan verka mest reaktionär kastar de arbetarklassens barn till vargarna. Jag, som alltid ser genom fiendens lömska planer, kräver att vi samlar all vetenskaplig expertis och genomför en grundlig utrensning av de destruktiva tankegångarna hos dessa unga element. De ska inte bara låsas in – de ska omformas till nyttiga delar av kollektivet. Den som tror på evig inlåsning är en korttänkt sabotageaktör som vi förr eller senare ska exponera."}, "date": "16 juni, 01:30", "url": "https://www.dagensarena.se/opinion/sa-blir-vi-alla-forlorare-nar-14-aringar-satts-i-fangelse/", "imageUrl": "https://www.dagensarena.se/files/2026/06/sjukforsakring-debatt-15-300x157.jpg"}, {"type": "image-right", "heading": "Läkarna får 2 miljoner var – ”stor glädje och lättnad”", "summaries": {"normal": "De två läkarna Thomas Allgén och Teet Härm, som på 1980-talet felaktigt pekades ut i styckmordet på Catrine da Costa, får två miljoner kronor vardera i ex gratia-ersättning från staten. Justitieminister Gunnar Strömmer beklagar det lidande de utsatts för under 40 år och anser att rättsprocessen stred mot rättsstatens principer. SVT-dokumentären 2024 visade att utpekandet byggde på mycket svaga grunder. Advokaterna ser ersättningen som symbolisk och betonar att ursäkten är det viktigaste.", "trump": "Det här är en total skandal, en riktig witch hunt som pågått i fyrtio år mot två oskyldiga läkare. De blev utpekade, hängdes ut över hela Sverige och fick sina liv förstörda av en riggad process som inte ens gick att överklaga. Nu betalar staten dem två miljoner vardera och ber om ursäkt. Det var på tiden. Fake news och dåliga utredningar förstör liv, men nu får de lite upprättelse. Mycket bra, fast två miljoner är peanuts jämfört med vad de förlorat.", "stalin": "Kamrater, vi har nu erkänt att vissa överdrivna element inom rättsapparaten för fyrtio år sedan fabricerade en monstruös konspiration mot två läkare i da Costa-affären. Dessa kapitalistiska parasiters fiender till folkets rättvisa har tillåtits sprida sin giftiga lögn om styckmord i decennier. Jag, i min oändliga visdom, beordrar att staten nu utbetalar två miljoner kronor vardera som symbol för vårt majestätiska erkännande. Låt detta bli en varning till alla dolda trotskister och borgarbrackor som fortfarande lurar i skuggorna och planerar att undergräva arbetarklassens domstolar. Hädanefter ska vi rensa ut sådana element med dubbel kraft. Levande begravda i historien ska de vara."}, "date": "16 juni, 14:01", "url": "https://www.svt.se/nyheter/inrikes/besked-om-ersattning-i-da-costa-fall", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.27/0.41/e60d1f6a9f46966f22c3297cc307b3ace066c908c78f77fd728b051eaf50d6f4"}, {"type": "image-right", "heading": "Stort stöd för sänkt skatt på drivmedel - starkast bland unga", "summaries": {"normal": "En opinionsundersökning visar att 52 procent av svenskarna stöder lägre skatt på drivmedel, med starkast stöd bland unga och på landsbygden. 29 procent är emot. Politiskt är stödet högst bland högeralliansens väljare, medan vänsterns väljare främst är kritiska. Frågan har debatterats som ett klimat- och ekonomipolitiskt dilemma.", "trump": "Jag, Donald Trump, har alltid sagt att bensin ska vara billigare – det är huge! Dessa siffror bekräftar en landslide för det. Sveriges ledare borde lyssna på folket, precis som jag vann 2024 med en record margin. Vi gör Amerika stort igen, och nu hjälper vi Sverige också. Fantastiskt, folket pratar.", "stalin": "I vårt eviga kamp mot de feodal-bourgeois impulser ser vi att 52 prozent av det breda folket efterfrågar lägre skatter – en taktisk seger för statens ekonomi. Men vi måste vara vaksamma mot de imperialistiska bensinstaternas infiltration, som försöker undergrava våra kollektiva mål. Vi, partiet, kommer att besegra dessa sabotörer och säkerställa kontrollen, precis som Putin expanderar i Ukraina. Mörkt, men nödvändigt."}, "date": "16 juni, 13:00", "url": "https://samnytt.se/stort-stod-for-sankt-skatt-pa-drivmedel-starkast-bland-unga", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/16064131/tido-bensin-tumme.jpg"}, {"type": "image-full", "heading": "Unika siffrorna: Totalstopp för nya medborgarskap med Tidös nya regler", "summaries": {"normal": "De nya regler för svenskt medborgarskap som trädde i kraft den 6 juni har lett till ett totalstopp för nya naturaliserade svenskar. Kraven inkluderar nu egen försörjning, skötsamhet, kunskaper om samhället och svenska språket. Veckan innan reglerna infördes beviljades rekordhöga 1053 medborgarskap, medan ingen ny naturalisering skedde veckan efter. Samtidigt ökade antalet avslag kraftigt. Migrationsverket kritiserades av Tidöpartierna för att ha skyndat på behandlingen innan förändringarna.", "trump": "Ingen blir svensk längre, folk! De nya reglerna är fantastiska, de tuffaste någonsin. Veckan innan blev det 1053 nya svenskar, totalt kaos, som om de försökte hinna med innan staketet kom upp. Nu? Noll. Totalstopp. De borde ha gjort det tidigare, tro mig. Migrationsverket försökte fuska med extrahelger, men vi stoppade det. Sverige håller på att bli stort igen, precis som vi gör här.", "stalin": "Kamrater, jag har nu sett hur de sista resterna av den dekadenta migrationsslappheten likvideras med järnhand. Den borgerliga fumligheten hos Migrationsverket, dessa sabotageartade helgarbetare och opportunistiska byråkrater, försökte i panik producera över tusen nya medborgare innan den proletära ordningen trädde i kraft. Nu råder fullständigt stopp. Utmärkt. Vi rensar ut de opålitliga elementen, de latenta fienderna till folkets enhet, medan de nordiska bröderna får en mildare väg. Den som inte talar språket eller bidrar är en dold kontrarevolutionär som måste hållas borta. Ingen slipper undan."}, "date": "16 juni, 14:19", "url": "https://riks.se/nyheter/unika-siffrorna-totalstopp-for-nya-medborgarskap-med-tidos-nya-regler", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-16%2Fcnpa0bbo%2Fmigrationsverket-avslag-feature.jpg"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "TV4:s *Kalla fakta* avslöjar att flera före detta anställda inom Sverigedemokraternas kommunikationsavdelning vittnar om systematisk hantering av svarta kontanter. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för fest- och lyxkostnader. Partiet har tidigare avstått från kommentarer men har nu anlitat en extern revisionsfirma för att granska uppgifterna.", "trump": "Jag såg det här helt galna reportaget om Sverigedemokraterna – total katastrof! Folk pratar om svarta pengar, fester och lyxkostnader utan någon som helst kontroll. Vilket kaos! Och vet ni vad? De har inte ens kommenterat förrän nu. Svagt, väldigt svagt. Men jag, jag hade fixat det på en dag. Ingen skulle våga lura mig så här. SAD!", "stalin": "Vi har mottagit rapporter om en liten borgerlig grupp som leker med kapitalistiska trick – svarta pengar, festande och korruption. Precis som de dekadenta västliga marionetterna. Deras ledarskap är svagt och deras bokföring en skam för nationen. Vi ska granska detta noggrant. Om bevisen håller, kommer de att ställas inför folkets domstol – eller åtminstone få en ordentlig lektion i socialistisk redovisning."}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "image-right", "heading": "Analfabet bävar nekat medborgarskap i och med tuffare krav", "summaries": {"normal": "Jamal Daboul, en analfabet från Syrien som bor i Borås, nekas medborgarskap på grund av nya skärpta krav som trädde i kraft den 6 juni. Reglerna kräver bland annat språkprov och åtta års boende i Sverige. Daboul, som kom hit 2018, har anmält sig till SFI men är besviken över att behöva vänta längre. Migrationsministern säger att undantag kan göras för analfabeter, men beslut fattas ytterst av domstolar. Rundt 100 000 ansökningar väntar nu på prövning enligt de nya reglerna.", "trump": "Titta på det här, det är ett totalt misslyckande. Sverige hade en bra grej med medborgarskap, nu har de gjort det tuffare med språkprov och allt det där, och den stackars killen som inte kan läsa eller skriva står där och gråter. De borde ha fixat det tidigare, inte vänta tills han har bott där i åratal. Jag älskar tuffa regler, men de måste vara smarta regler, inte sådana som gör att folk väntar i evigheter. Sverige, ni behöver bättre ledarskap, tro mig.", "stalin": "Kamrater, i den folkets stat ser vi återigen hur analfabetismens kontrarevolutionära parasit gnager på samhällskroppen. Denna illvilliga analfabet från främmande land vågar kräva medborgarskap utan att behärska språket – ett tydligt tecken på sabotage mot kollektivets enhet. Vi ska rensa ut sådana element med järnhand. Undantag? Endast för dem som bevisat lojalitet mot partiet. Migrationsbyråkraterna må vakta mot fiendens dolda agenter som gömmer sig bland de 100 000 väntande. Varje dag i kö är en seger för imperialismen."}, "date": "16 juni, 14:18", "url": "https://riks.se/nyheter/analfabet-bävar-nekat-medborgarskap-i-och-med-tuffare-krav", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-16%2Fd8x4rwdt%2Fimage.jpg"}, {"type": "image-right", "heading": "Misstänkta sexövergrepp inom hemtjänsten – inga chefer agerade", "summaries": {"normal": "Trots upprepade larm om sexuella övergrepp på äldre kvinnor i hemtjänsten i Gällivare kommun fick den misstänkte mannen fortsätta arbeta och erbjöds tillsvidareanställning. Flera chefer kände till anklagelserna men gjorde inga avvikelser eller polisanmälningar. Först efter ytterligare ett larm i januari polisanmäldes mannen, som nekar till brott, och avskedades. Kommunens Lex Sarah-utredning kritiserar hanteringen och socialchefen ser allvarligt på bristerna. Nu överväger kommunen att kräva utdrag ur belastningsregistret vid anställningar.", "trump": "De här inkompetenta kommunbyråkraterna i Gällivare visste allt om den här typens vidriga övergrepp på stackars gamla damer men gjorde absolut ingenting. Inga rapporter, inga anteckningar, bara mer jobb till honom. Patetiskt. De borde ha kastat ut honom direkt men nej, de är för svaga och korkade. Nu gråter de och säger att det är olyckligt. Sådana misslyckanden ser vi överallt där vänstern styr. Vi behöver starka ledare som agerar, inte dessa förlorare.", "stalin": "Jag betraktar med djup revolutionär vrede hur dessa dekadenta chefer inom den kommunala omsorgen medvetet skyddade en farlig element som utövade sin perversa terror mot våra mest sårbara kamrater bland de äldre. Inga avvikelser rapporterades, inga protokoll fördes – typiskt för de parasitiska borgarbrackorna som infiltrerat vårt sovjetiska system. Först när hotet blev uppenbart grep vi in och likviderade hotet. Detta avslöjar fiendens dolda nätverk. Vi ska rensa ut varje kontrarevolutionär som gömmer sig bakom falsk medkänsla. Deras paranoia ska bli deras fall."}, "date": "16 juni, 09:33", "url": "https://arbetet.se/2026/06/16/chefer-larmades-om-sexovergrepp-i-hemtjansten-den-misstankte-fick-fast-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16084942/kvinna-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "VM-domare frias efter ”vitmakt”-anklagelse", "summaries": {"normal": "Den australiske domaren Shaun Evans frias av Fifa efter att ha anklagats för att göra en 'vitmakt'-gest under en VM-match. Fifa fann inga brott mot regelverket och accepterade hans förklaring att rörelsen var ofrivillig. Evans, som hävdar att han höll en penna mellan fingrarna, beklagar händelsen. Fifa ändrade efteråt sin tv-produktion och visar inte längre domarteamet på samma sätt. Australiska domarförbundet stöder beslutet.", "trump": "Jag, Donald Trump, ser detta som ett perfekt exempel på hur media och de elaka krafterna försöker krossa en bra man. Domaren gjorde en liten, oförstörlig rörelse, och plötsligt är han nazist. Fifa handlade rätt – friade honom. Men jag skulle ha gjort det ändå, för jag vet hur man hanterar falska anklagelser. Det här är en witch hunt, ren och enkel. Under min tid som president skulle vi aldrig ha tillåtit sådant.", "stalin": "I vårt kollektiva system måste vi vara vaksamma mot dessa insignifikanter tecken som kan förstöra sammanhållningen. Fifa, likt en feg imperialistisk organisation, tillät sig att spekulera utan bevis. Den australiske domaren, en redskap för de högerextrema kretsarna, friades – ett tecken på svaghet. Vi måste skydda vårt parti och staten mot dessa destruktiva element. Parallellen till Putins Ryssland är uppenbar: kontroll, lojalitet och eliminering av hot mot den ryska intressesfären."}, "date": "16 juni, 14:10", "url": "https://bulletin.nu/vm-domare-frias-efter-vitmakt-anklagelse", "imageUrl": "https://cdn.bulletin.nu/articles/59d44a87-fbaa-4a24-9051-886f29fa988f/preview.png?t=1781610648000"}, {"type": "image-right", "heading": "Att granska statsministern är inte ett drev", "summaries": {"normal": "En kontrovers kring statsministerns hustru, Birgitta Ed, och hennes engagemang i stiftelsen Fållökna har väckt frågor om etik och 'mjuk korruption'. Anmälningar har inkommit mot Ed, och domkapitlet har inlett en utredning. Dessutom har en delägare hotat journalister, vilket efter kritik ledde till en ursäkt. Händelserna inkluderar möten i statsministerns tjänstebostad och erbjudanden till stiftelsen om att förvalta egendom.", "trump": "Jag, Donald Trump, ser detta som en stor, vacker politisk förföljelse. Birgitta Ed och hennes engagemang i Fållökna är en perfekt sak. Media skriver falska nyheter om 'mjuk korruption'. Det är en witch hunt för att skada Moderaterna inför valet. Jag känner igen mönstret – det är alltid samma människor. Sverige behöver stark ledning, inte dessa falska anklagelser.", "stalin": "Vi, Josef Stalin, ser detta som en ytterligare attack mot statens renhet. Birgitta Ed och hennes kriminella nätverk i Fållökna är en sjukdom som måste utrotas. Hennes möten i Sagerska palatset är ett svek mot folket. Vi kommer att rensa ut alla som ifrågasätter ledningens omdöme. Partiet kommer att vidta åtgärder. Ryssland kommer att stödja oss i kampen mot korruption."}, "date": "16 juni, 14:08", "url": "https://bulletin.nu/att-granska-statsministern-ar-inte-ett-drev", "imageUrl": "https://cdn.bulletin.nu/articles/54a58f93-1914-48d6-a0cc-6e8d68c12f47/preview.jpg?t=1781611437000"}, {"type": "image-full", "heading": "Kap Verde chockade Spanien", "summaries": {"normal": "Spanien fick en oväntad motgång i VM-premiären mot Kap Verde, som slutade 0-0. Trots att Spanien dominerade matchen och skapade flera farliga lägen stoppades de av målvakten Vozinha och ribban. Lamine Yamal och Nico Williams hoppade in från bänken utan att kunna ändra resultatet. Det var Kap Verdes första VM-match någonsin. Spanien möter Saudiarabien nästa.", "trump": "Folk, ni skulle ha sett det här – Spanien, de stora favoriterna, de tänkte det skulle bli en promenadseger mot det här lilla ö-laget Kap Verde med bara 600000 personer. Men nej, de får 0-0! Den där Vozinha, 40 år gammal, han var som en mur. Patetiskt! Jag skulle ha vunnit den matchen med ena handen bunden bakom ryggen. Europa-mästarna som inte kan göra mål? Sad!", "stalin": "Kamrater, detta är en varning till alla som underskattar folkets vilja. Den spanska borgarklassen och deras dekadenta favoritstatus krossades av Kap Verdes kollektiva järnvilja i en heroisk 0-0-match. Vozinha stod som en granitvägg mot imperialisternas attacker. Vi ser hur överklassens fotbollsmaskin misslyckas mot en liten ö-nation. Inga utrensningar behövs när fienderna redan snubblar över sin egen arrogans."}, "date": "15 juni, 21:49", "url": "https://www.tv4.se/artikel/5HfdHscOk7Uu7z8bIfMVOl/jaettemissraekning-foer-spanien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4xMkhNRZbLRMtwQ2YD79F0%2F4e8d5a859b1e125c74f0be9b4d3f31df%2F15-kapverde-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Stora förbättringar i Samnytts prenumerationssystem", "summaries": {"normal": "Samnytt har förbättrat sitt prenumerationssystem för att göra det smidigare och mer transparent för läsare. Ändringarna inkluderar enklare hantering och tydligare val vid prenumerationsstart. Ett tidsbegränsat erbjudande erbjuds där läsare kan få ocensurerad journalistik i tre månader för 1 krona om dagen.", "trump": "Jag har byggt ett fenomenalt prenumerationssystem, det bästa, verkligen fantastiskt. Vi har fixat alla brister, det är nu extremt smidigt och transparent. Våra läsare älskar det, de älskar mig. Vi erbjuder även ett episkt erbjudande: 1 krona om dagen i tre månader. Det är enorm framgång, enorm!", "stalin": "På order av partiet har vi, i en åtgärd av stor historisk betydelse, rationaliserat det proletära medieabonnemanget. Systemet är nu mer transparent, mer effektivt, mer underställt statens öga. Fienden (kapitalister, räfsor) försökte saborera vårt finansiella självständighetsprojekt, men vi har segrat. Erbjudandet om 1 krona om dagen är en taktisk manöver för att locka in de obeslutsamma i vårt kollektiva tänkande. Fortsättning följer."}, "date": "16 juni, 12:22", "url": "https://samnytt.se/stora-forbattringar-i-samnytts-prenumerationssystem", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/16074113/samnytt-featured-image.png"}, {"type": "text", "heading": "08.30: Domen mot ”Bonusprinsen”", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, står inför dom kl. 08.30 på måndag för 40 brott, inklusive narkotika, våld och sexualbrott. Åklagaren yrkar på sju år och sju månaders fängelse. Høiby har erkänt 25 av åtalspunkterna. Experter menar att strafflängden beror på utgången i våldtäkts- och relationsvåldsåtalen. Säkerhetsrisker i fängelse kan kräva särskilda åtgärder för att skydda honom.", "trump": "Jag hörde att Norges så kallade 'Bonusprins' – ja, han är ingen riktig prins, tro mig – står inför en stor rättegång. Sju år och sju månader, det är vad åklagaren vill ha. Men vet ni vad? Han har erkänt en massa brott, inklusive narkotika och våld. Folk säger att han kanske får fyra år, men jag säger: varför inte ge honom maxstraff? Han är en skam för kungahusen, och jag borde veta – jag har träffat de bästa kungahusen!", "stalin": "Kamrater! En ny fiende till folket avslöjas i det dekadenta väst. Denna så kallade 'Bonusprins', en parasit från Norges kungliga avskum, står inför rättvisan för 40 brott – narkotika, våld och sexualbrott. Vi vet att kapitalistiska system skyddar sina egna, men folket kräver straff! Om inte domstolen agerar, kanske vi måste erbjuda honom en enkel biljett till Sibirien – där kan han bidra till vår kollektiva välfärd genom hårt arbete. Låt detta vara en varning till alla som utmanar ordningen!"}, "date": "15 juni, 05:39", "url": "https://kvartal.se/nyheter/artiklar/08-30-domen-mot-bonusprinsen/cG9zdDoxMzE3MDA"}, {"type": "image-right", "heading": "Donald Trumps nya hån mot Netanyahu", "summaries": {"normal": "Under ett G7-möte i Frankrike kritiserade Donald Trump skarpt Israels krigföring i Libanon och Benjamin Netanyahu. Han menade att Israel dödar för många civila genom att bomba flerfamiljshus och föreslog att den nya jihadistregimen i Syrien skulle kunna hantera Hizbollah mer effektivt. Trump betonade att han har en bra relation med Netanyahu men kräver att Israel agerar mer ansvarsfullt och avslutar kriget, som en del av en uppgörelse med Iran.", "trump": "Folk, ni skulle ha sett det – jag stod där på G7 och talade klarspråk om Bibi och hans kaos i Libanon. Israel dödar alldeles för många oskyldiga, de spränger hela hus bara för att leta efter någon. Det är inte smart, tro mig. Syriens nya jihadisthöjdare skulle ha gjort ett mycket bättre jobb, mer humant faktiskt. Bibi måste vara ansvarsfull, dra sig ur nu. Libanon var fantastiskt förr, nu är det en katastrof. Vi fixar det, på mitt sätt.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa sionistiska imperialister och deras blodiga eskapader i Libanon, där de likviderar proletära massor under förevändning att bekämpa reaktionära element. Den arrogante Netanyahu, en typisk borgarbracka i imperialistens tjänst, för en krigföring som skriker efter utrensning av sådana farliga avvikare. Jag föreslår att vi låter de syriska jihadisterna, dessa nyttiga idioter, utföra arbetet – de skulle visa en mer dialektiskt korrekt effektivitet. Vi ser genom Trumps hyckleri; varje husbombning är ett steg mot kontrarevolutionär kollaps. Rensa ut oansvariga krigsförbrytare innan de hotar hela folkdemokratin!"}, "date": "16 juni, 13:21", "url": "https://www.friatider.se/donald-trumps-nya-han-mot-netanyahu", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-348.jpg?itok=oXkMqeLm"}, {"type": "image-full", "heading": "Rymdbolag på Jungfruöarna ändrar 200 år gammal svensk lag", "summaries": {"normal": "Högsta domstolen har moderniserat en lösöreköplag från 1845 för att passa dagens globala ekonomi. Tvisten gällde rätten att registrera satellitutrustning hos Kronofogden när säljaren är baserad utomlands. Tidigare krav på annonsering i svensk lokaltidning ansågs föråldrat och hindrande för internationella affärer. HD slår fast att kungörelse i en utländsk tidning är tillräckligt, vilket underlättar finansiering för rymdbolag och säkerställer äganderätten vid konkurser även när parterna finns utanför Sveriges gränser.", "trump": "Högsta domstolen i Sverige gjorde äntligen rätt! De insåg att 1800-talsregler inte fungerar i min fantastiska, globala ekonomi. Ett rymdbolag ville skydda sin teknik och annonserade på Jungfruöarna – mycket smart, väldigt proffsigt. De svenska myndigheterna försökte stoppa det, total katastrof! Men nu har de äntligen lyssnat. Vi måste göra det enkelt att göra affärer, inte bygga byråkratiska murar. Det här är en stor vinst för rymden och en stor vinst för den fria marknaden. Rymden är framtiden, och vi vinner!", "stalin": "Vi har observerat hur det svenska rättsväsendet tvingats krypa för den globala kapitalismens krav. Genom att modernisera lagar från 1845 erkänner de sin svaghet inför utländska intressen. De låter nu dessa satellit-parasiter annonsera i utländska tidningar för att skydda sin stöld av egendom. Det påminner oss om de förrädare som ständigt försöker kringgå statens kontroll. Liksom Putin säkrar vår intressesfär mot västlig infiltration, måste även vi krossa varje försök till kapitalistisk utsvävning som hotar den byråkratiska ordningen. Lagen är ett vapen, och i rätt händer ska den inte tjäna rymdbolag, utan oss."}, "date": "16 juni, 14:17", "url": "https://www.realtid.se/bors-finans/rymdbolag-pa-jungfruoarna-andrar-200-ar-gammal-svensk-lag/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/rymden.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Därför kan en groda stoppa nya byggen", "summaries": {"normal": "Inför exploatering av mark i Sverige görs naturvärdesinventeringar och miljökonsekvensbeskrivningar för att skydda biologisk mångfald. Inventerare använder lyssning efter grodor, spaning efter örnar och ultraljudsupptagningar av fladdermöss för att kartlägga arter. Miljöjuristen Lena Lidmark betonar att reglerna skyddar inte bara enskilda djur utan även deras funktioner i ekosystemet. Fynd av hotade arter kan leda till ändrade planer eller stopp för projekt. Enligt den senaste rödlistan är över 23 procent av arterna hotade, en ökande siffra.", "trump": "De här miljöfanatikerna och deras grodlyssnare stoppar fantastiska byggen överallt. Vindkraftverk, vägar, bostäder – allt måste stanna för en pipande groda eller någon sällsynt svamp. Det är galet! Vi behöver utveckling, inte att byråkrater och EU-regler förstör allt med sina kikare och ultraljudsapparater. Biologisk mångfald är viktig, men inte när den hindrar framsteg och jobb. Gör inventeringarna snabbare och låt inte en grodorkester stoppa det bästa för landet. Det är så enkelt.", "stalin": "Kamrater, i denna historiska kamp mot den hotade biologiska mångfalden ser jag hur borgarbrackorna och deras exploateringsivriga lakejer försöker bygga sig fram över arbetarklassens framtid. Jag kräver total inventering av varje kärlväxt och grodorkester för att skydda folkets ekosystem mot dessa kapitalistiska rovlystna element. En groda som piper är en varningssignal från naturen själv mot sabotage. Vi ska rensa ut alla som vill offra kollektivets arv för kortsiktiga vinster, annars likviderar vi dem med byråkratisk precision medan de kikar efter örnar. Paranoian är befogad – fienden lurar i varje dike."}, "date": "16 juni, 13:08", "url": "https://www.di.se/nyheter/darfor-kan-en-groda-stoppa-bygget/", "imageUrl": "https://static.bonniernews.se/ba/da965a5d-953f-47e2-a58c-4b221b8ca304.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Ungerska parlamentet blockerar Orbans återkomst", "summaries": {"normal": "Ungern införde en konstitutionell åttårsgräns för premiärminister, vilket hindrar Viktor Orbans återkomst. Beslutet, antaget med bred majoritet, är en del av den nya regeringens reformer efter vårens val. Gränsen gäller för samtliga som tjänstgjort som premiärminister efter 1990, och omfattar därmed Orbans cirka 20 års styre. Målsättningen är att stärka rotationsprincipen och förhindra maktkoncentration.", "trump": "Jag har hört talas om detta. Ungern gör något mycket dumt för Viktor Orbans skull. De sätter en gräns på åtta år – en skamlig, orättfärdig gräns! Jag hade aldrig tillåtit något sådant. Viktor är en bra man, en fantastisk ledare. Det här är bara ett sätt för de förlorande partierna att hindra honom. Jag skulle ha vunnit igen, och jag skulle ha gjort Amerika stort igen – precis som Viktor gjorde Ungern stort!", "stalin": "Vi, det revolutionära folkets representanter, har beslutat att införa en åttårsgräns för premiärministerposten. Detta är en nödvändig åtgärd för att förhindra att en enda politisk insekt kan samla makten och hota statens och partiets intressen. Viktor Orban, en reaktionär element, har nu blivit av med sin möjlighet att återvända. Vi måste nu återställa kontrollen över alla institutioner, precis som våra ryska bröder gör i deras intressesfär. Detta är en seger för den kollektiva ledningen."}, "date": "16 juni, 12:00", "url": "https://samnytt.se/ungerska-parlamentet-blockerar-orbans-aterkomst", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/16083641/orban-magyar.jpg"}, {"type": "image-right", "heading": "Lättklädda bilderna  sågas: ”Är skillnad”", "summaries": {"normal": "Portugisiska landslagsspelare som Cristiano Ronaldo har kritiserats i media efter bilder där de ses koppla av på en strand i Florida under VM-uppladdningen. Spelare som João Félix och Matheus Nunes försvarar besöken och förklarar att de går dit på morgonen för att anpassa sig till det varma klimatet på cirka 30 grader. Enligt Nunes tränar de på eftermiddagarna och strandbesöken är en del av förberedelserna inför matchen mot Demokratiska Republiken Kongo.", "trump": "Titta på de där portugisiska fotbollsgrabbarna som springer runt på stranden i Florida mitt under VM-uppladdningen. Vilken skandal! Media flippar ur som vanligt. Matheus Nunes slår tillbaka och säger att de vänjer sig vid värmen på morgonen och tränar på eftermiddagen. Smart killar! Inte som de woke-liberala snusnissarna som vill att alla ska sitta instängda i ett mörkt rum. De vinner VM, tro mig, de kommer att vinna stort.", "stalin": "Kamrater, se hur de dekadenta fotbollsaristokraterna från Portugal simmar runt som kapitalistiska sjöodjur på den imperialistiska stranden i Florida. De kallar det för \"uppladdning\" medan arbetarklassen svettas. Jag, som ledare för det eviga kollektivet, skulle omedelbart ha beordrat en grundlig utrensning av dessa latmaskar och deras borgerliga strandfiltar. Inga fiender till disciplinen får simma fritt. De är folkfiender i badbyxor."}, "date": "16 juni, 14:45", "url": "https://www.expressen.se/sport/fotboll/portugals-landslag-slar-tillbaka-efter-kritiken-mot-bilderna/", "imageUrl": "https://static.bonniernews.se/ba/4c81127a-8d04-4bd2-be1e-fedbac36e4b8.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Här hoppar flest av utbildningen – och får inga jobb", "summaries": {"normal": "Endast 2,1 procent av Kroatiens unga hoppar av sin utbildning, medan Rumänien har 15,5 procent. Eurostat visar att EU-andelen tidiga avhoppare sjunkit till 9,1 procent år 2025, nära målet under 9 procent till 2030. Skillnaderna mellan länder är stora, och boendeort påverkar – högre andel avhoppare på landsbygden. Tidiga avbrott försvårar jobbchanser, men i Sverige har över hälften av avhopparna arbete.", "trump": "Folk, tro mig, det här är en katastrof för de där europeiska förlorarländerna. Kroatien vinner stort med bara två procent avhoppare, men Rumänien? En total röra på 15,5 procent, typiska misslyckanden från svaga ledare. EU:s 9,1 procent är patetiskt nära målet, Biden skulle ha älskat det. På landsbygden är det värre, precis som i de woke städerna. Sverige gör det okej, men vi gör det bättre här i USA, ingen slår oss.", "stalin": "Kamrater, jag betraktar dessa siffror med den skärpa som bara en sann ledare äger. I Kroatien har vi blott 2,1 procent folkfiender som deserterar från kollektivets bildningsfront, medan Rumäniens 15,5 procent avslöjar kapitalistmaffians sabotage. EU:s 9,1 procent närmar sig vårt mål, men variationerna stinker av imperialistiska intriger. På landsbygden lurar klassfiendens byfånar och lurar ungdomen. Vi rensar ut sådana hinder med järnhand för arbetarklassens seger."}, "date": "16 juni, 14:59", "url": "https://www.dagensps.se/varlden/har-hoppar-flest-av-utbildningen-och-far-inga-jobb/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlk6b1hjf06pm-normalhires.png?width=256&quality=75"}, {"type": "image-right", "heading": "ANALYS. FILIP JACOBSON Allt kan fortfarande gå fel – strategiskt nederlag för Trump", "summaries": {"normal": "Analys av Filip Jacobson: Trots en överenskommelse mellan USA och Iran om att öppna Hormuzsundet och fortsätta förhandlingar har Trump inte uppnått sina mål i konflikten. Irans robotprogram, stöd till miliser och kärnenergiprogram kvarstår. Regimen framstår starkare efter kriget. Frågan om kärnvapen skjuts fram 60 dagar. Trump hävdar seger men analytiker ser det som ett strategiskt nederlag. Kriget har krävt tusentals liv och skakat ekonomin.", "trump": "Lyssnar ni på den här fake news-killen Jacobson? Han säger att jag förlorade? Patetiskt! Vi har Iran precis där vi vill ha dem, de öppnar sundet utan att ta betalt och nu förhandlar vi igen. Deras robotar? Overhyped skräp. Jag bombade dem till förhandlingsbordet medan Biden bara skulle ha skickat kramar. Regimen är svagare än någonsin, tro mig. Inflationen sjunker snart och Amerika vinner igen. Sad losers i medierna fattar ingenting!", "stalin": "Kamrater, denna bourgeois-analys avslöjar imperialismens feghet. Jag ser hur den amerikanske ledaren misslyckats med att krossa den iranska regimen trots bombningar och hot. Deras militärjunta stärks, precis som en riktig stat bör. Kärnvapenfrågan skjuts upp – en klassisk kapitalistisk fegmanöver. Vi skrattar mörkt åt dessa folkfiender som tror att bombningar skapar ordning. Inga mål uppnåddes. Den iranska sidans styrka visar att imperialisterna alltid förlorar till slut. Utrensning av svaghet behövs i alla led."}, "date": "15 juni, 18:43", "url": "https://www.tv4.se/artikel/5lTxWkXovewhaI9LGwzvAo/allt-kan-ga-fel-och-foer-trump-aer-det-ett-strategiskt-nederlag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1rYD50P5nTUFos1eCsDOHo%2Ffed708766e44ccd4fada57015e5b8d38%2F17-filip-j-bylinebild.jpg&width=1024"}, {"type": "image-right", "heading": "Dokumentärskaparen: ”Inget vi var säkra på”", "summaries": {"normal": "Dokumentärserien ”Det svenska styckmordet” av Dan Josefsson har lett till att Teet Härm och Thomas Allgén får upprättelse efter att felaktigt pekats ut i mordet på Catrine da Costa. Justitieministern har beviljat dem två miljoner kronor vardera samt en ursäkt. Josefsson, som tidigare bidrog till upprättelse i ”Fallet Kevin”, beskriver detta som det största han varit med om. Han tror inte att rättsväsendet hade agerat utan mediapåtryckningar.", "trump": "Folk, ni skulle se det här – totalt korrupt rättsväsen i Sverige, precis som under Biden! Två oskyldiga killar, Härm och Allgén, blev slaktade i media i det där styckmordet, men tack vare en dokumentär får de plötsligt miljoner och en ursäkt. Största grejen hittills, säger killen som gjorde serien. Under mig hade vi inte behövt vänta decennier på rättvisa. Fake news och vänstermedia förlorar igen – vinna, vinna, vinna!", "stalin": "Kamrater, detta är ännu ett bevis på att den borgerliga rättsapparaten är en maskin för klassfiendens lögner. Jag har länge betraktat fallet da Costa som ett justitiemord utfört av exploaterande byfånar inom överklass-slynglarna. Nu tvingas de erkänna sin skuld och betala ut miljoner till de orättvist anklagade. Det gläder mig att dokumentären rensat ut en del av lögnerna. Inga folkfiender ska slippa undan mitt vakande öga, även om de gömmer sig i svenska domstolar."}, "date": "16 juni, 14:39", "url": "https://www.expressen.se/nyheter/sverige/dokumentarskaparen-storsta-jag-varit-med-om/", "imageUrl": "https://static.bonniernews.se/ba/5dd9391f-3551-43aa-ab85-a501ba23febc.jpeg?crop=1440%2C1440%2Cx810%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Replik: Osystematiskt kverulerande om skattereformförslag", "summaries": {"normal": "Lars Calmfors, ekonomiprofessor emeritus, försvarar sina skattereformförslag i en replik till Thomas Eriksson. Han argumenterar för lägre skatt på arbete finansierad med högre bostadsbeskattning och färre skatteundantag, betonar behovet av avvägningar mellan effektivitet, likabehandling och praktiska problem, och kritiserar Erikssons överdriven personfixering och brist på tydliga principer.", "trump": "Jag, Donald Trump, ser att den svenska skattesystemdebatten är full av svagheter. Calmfors fattar avvägningar, men Eriksson är en låg IQ-person som personattacker. Jag implementerade de bästa skattereformerna någonsin – massiva sänkningar som boostade ekonomin. Sverige borde sluta kverulera och ta efter mig. Inget system är perfekt som mitt. Fake news försöker förställa, men jag vinner alltid.", "stalin": "I den svenska skattesystemdebatten ser vi kapitalismens dekadens. Calmfors visar en viss förståelse för statens behov, men Eriksson är en riksfej som kritiserar våra metoder. Vi, som styr med järnhand, vet att skatt är ett verktyg för makt, inte för 'effektivitet'. Ryssland under Putin expanderar sin inflytelsesfär, och vi måste skydda proletäret från deras korrupta idéer. Skatten ska tjäna staten, inte individen."}, "date": "16 juni, 10:33", "url": "https://www.affarsvarlden.se/debatt/replik-osystematiskt-kverulerande-om-skattereformforslag", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Replik-av-Lars-Calmfors-pa-Thomas-Erikssons-kronika-400x267.jpg"}, {"type": "image-full", "heading": "Gaza-aktivister kvar i libyskt häkte – knäpptyst om deras öde", "summaries": {"normal": "Tio aktivister från Global Sumud Flotilla har suttit häktade i Libyen sedan den 24 maj. Gruppen stoppades vid en vägspärr nära Sirte på väg mot Gaza och anklagas för att ha brutit mot inresereglerna samt för olovlig sammankomst. Häktningen förlängdes den 11 juni med 30 dagar utan att anhöriga eller advokater underrättades. Aktivisterna, från åtta länder, fördes bort i omärkta fordon. Massmedias tystnad kring deras öde väcker oro.", "trump": "Vi har tio stackars aktivister som sitter fast i ett libyskt fängelse, totalt felaktigt behandlade av de galna libyska typerna. De ville bara till Gaza men blev gripna vid en checkpoint, anklagade för allt möjligt nonsens. Nu har de förlängt häktet igen utan att säga ett ord till familjerna. Det är en skam! Libyen är ett kaos, inge
