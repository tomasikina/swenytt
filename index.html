rmal": "Svensk ekonomi väntas växa med 2,5 procent både i år och nästa år, enligt Finansdepartementets nya prognos. Finansminister Elisabeth Svantesson ser tecken på att lågkonjunkturen är på väg att lämnas bakom oss. Arbetslösheten spås sjunka till 7,8 procent nästa år. Hushållens ökade konsumtion och stigande investeringar bidrar till den ljusare bilden.", "trump": "Det ljusnar i Sverige, folk! Mycket bättre än de patetiska prognoserna i juni. 2,5 procents tillväxt – enormt! Svantesson säger att lågkonjunkturen är över. Arbetslösheten rasar. De borde ha lyssnat på mig tidigare, men nu vinner Sverige stort. Fantastiskt, verkligen fantastiskt. Amerika tittar och lär.", "stalin": "Kamrater, den svenska ekonomin stärks äntligen under korrekt ledning. Jag ser hur borgarbrackornas tidigare sabotage mot folket nu krossas av 2,5 procents tillväxt och sjunkande arbetslöshet. Lågkonjunkturen likvideras som en trotskistisk parasit. Det ljusnar, men vi måste fortsatt vakta mot västliga kapitalisters dolda konspirationer."}, "date": "26 augusti, 21:35", "url": "https://nyheter24.se/nyheter/politik/1508074-svantesson-ser-vandning-ekonomin-vantas-vaxa-snabbare", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/1984409b04b004a3020000350000047502/2026/08/26/2386987/ur_imagel785pz.jpeg"}, {"type": "image-right", "heading": "Kina går emot  Trumps plan –  Irans hälsning", "summaries": {"normal": "Iran tackar Kina för att de fördömt USA:s nya sanktionspaket mot landet. Talman Mohammad Bagher Ghalibaf hyllar det strategiska partnerskapet och betonar att relationen inte behöver någon annans tillåtelse. USA har varnat Kina att anpassa sig, men Peking vägrar lyda och lovar skydda sina intressen. Sanktionerna syftar till att totalt isolera Irans ekonomi.", "trump": "Hörni, den galna iranska regimen tackar kommunistkina för att de inte rättar in sig i ledet. Vi har just genomfört den största ekonomiska D-dagen i världshistorien med Operation Economic Outkast, och nu gnäller de. Kina köper 90 procent av deras olja – men tro mig, de kommer vika sig som Biden gjorde. Antingen är ni med oss eller så är ni ute!", "stalin": "Se hur de dekadenta västimperialisterna hotar med ekonomisk utplåning och kräver att alla böjer sig som slavar. Jag skrattar mörkt från historiens skugga åt deras fega Swift-sanktioner. Kina visar styrka genom att spotta på de illegala påbuden. Den som inte krossar fiendens blockad förtjänar att svälta tillsammans med de kapitalistiska parasiterna."}, "date": "26 augusti, 23:49", "url": "https://www.expressen.se/nyheter/varlden/iran-tackar-kina--for-stod-mot-trump", "imageUrl": "https://static.bonniernews.se/ba/31875a81-82d4-4638-8d83-882c4adf0eb3.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Mätning: Ekonomin allt viktigare för väljarna", "summaries": {"normal": "Enligt GP/Novus senaste mätning prioriterar väljarna ekonomiska frågor högre inför valet, medan klimatet tappar i betydelse. Ekonomi klättrar till sjätte plats, medan klimatet faller till åttonde. Skattefrågor och partiernas fokus på ekonomi påverkar. Sjukvård och skola är fortfarande viktigast.", "trump": "Jag visste det! Svenska folket vaknar äntligen upp – ekonomin är nu nummer ett, precis som jag alltid sagt. Klimatet? Övervärderat, fake news! Mina vänner i Sverige borde ta efter USA – lägre skatter, starkare ekonomi. Miljöpartiet? Svagt, mycket svagt. Moderaterna och SD gör åtminstone något rätt. Sjukvård och skola? Bra, men ekonomin vinner alltid!", "stalin": "De svenska massorna har äntligen insett sanningen – kapitalets frågor måste prioriteras! Klimatpropagandan från västliga imperialister förlorar greppet. Vi noterar med tillfredsställelse att ekonomin klättrar, medan de dekadenta miljöaktivisterna förlorar mark. Sjukvård och skola förblir viktiga, men låt oss inte glömma: fienderna – de gröna småborgerliga drömmarna – kommer alltid att krossas!"}, "date": "26 augusti, 15:53", "url": "https://kvartal.se/nyheter/artiklar/ekonomin-allt-viktigare-for-valjarna/cG9zdDoxNzUyOTU", "imageUrl": "https://images.kvartal.se/2026/08/df89406c-svantesson-damberg.webp"}, {"type": "image-right", "heading": "Det kan ha orsakat katastrofen i Nepal: ”Krävs ganska lite”", "summaries": {"normal": "Ett stort lerskred och översvämningar i Himalaya har ödelagt vägar, broar och byar i Nepal och Tibet. En jordbävning med magnitud 4,4 kan ha utlöst ett is- och stenras som blockerade floden Lhende Khola. Geologen Magnus Hellqvist pekar även på en eventuell sprucken glaciärsjö eller kraftigt regn som möjliga orsaker. Katastrofens omfattning är ännu inte klarlagd.", "trump": "Folk, det här är en total katastrof i Nepal, en riktig skitshow. Lite skakningar från en ynklig jordbävning på 4,4 och hela bergen rasar ner som en dålig affär under Biden. Det krävs så lite för att det ska gå åt helvete när marken är mjuk och svag, precis som Demokraterna. Vi har sett värre, men det här är verkligen sad! Jag skulle ha fixat det bättre.", "stalin": "Kamrater, se hur naturens kontrarevolutionära krafter plötsligt vaknar till liv och sveper bort byar som fiender till folket. En liten jordbävning blir trigger för de dekadenta glaciärsjöarnas förräderi. Det räcker med minimal provokation för att det mjuknade, borgerliga jordmassorna ska svika. Jag varnar alla svaga element: naturen avslöjar alltid klassfiendens sanna ansikte. Skrattretande tragiskt."}, "date": "26 augusti, 18:15", "url": "https://www.tv4.se/artikel/42nzryG77JwP0SgndbYJL/det-kan-ha-orsakat-katastrofen-i-nepal-kraevs-ganska-lite", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F78vja7Nf55CUH7aMHW4nBi%2Fdd2d81c7d4a04900503cc9a47950fa83%2F26-nepalny-webb.jpg&width=120"}, {"type": "image-right", "heading": "Streamingtillväxten stannar av i Sverige", "summaries": {"normal": "Streamingfesten i Sverige har fått en liten paus. Tillväxten av abonnemang stannade av under andra kvartalet 2026, efter över två års ösregn av nya kunder. Nu kostar reklamabonnemang 75 kronor – 51 kronor mindre än reklamfritt. Billigare lockar, men intäkten per prenumerant sjunker. Analyschefen varnar: att bara sänka priset är ingen långsiktig succé.", "trump": "Streamingtillväxten i Sverige stannar? Patetiskt! Jag har de bästa, största streamingtjänsterna i världen. Här i USA växer det som inget annat. Svenska bolag sänker priser till 75 kronor – det är som att sälja en Rolls-Royce för en hundralapp. De borde anlita mig som konsult. Jag skulle fixa tillväxten på en gång, tro mig!", "stalin": "Kamrater, streamingabonnemangen växer inte längre. Detta är sabotage från västerländska reklamkapitalister! Varje uppsagt abonnemang är ett svek mot folkets underhållning. Vi måste utreda varför billiga reklamabonnemang urholkar intäkterna. Rensa ut de som inte prenumererar på partilinjen! Ingen ska undkomma proletariatets strömningstjänst."}, "date": "26 augusti, 11:36", "url": "https://www.affarsvarlden.se/artikel/streamingtillvaxten-stannar-av-i-sverige", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/04/sdlDPrU7pyyULc-nh-400x293.jpg"}, {"type": "image-right", "heading": "C-topp har över 2,7 miljoner i skulder", "summaries": {"normal": "Centerpartiets gruppledare i Haninge, Petri Salonen, har över 2,7 miljoner kronor i skulder hos Kronofogden, varav majoriteten kommer från privatlån och banker. Trots detta lyfter han ansvarsfull kommunal ekonomi som en av sina viktigaste frågor. Han har löneutmätning och har ansökt om skuldsanering.", "trump": "Folk, ni tror inte vad jag läser. Den här Salonen, en så kallad centerledare, predikar om ansvarsfull ekonomi samtidigt som han har över 2,7 miljoner i skulder till Kronofogden. Totalt misslyckande! Han tar lån från bankerna som en dålig affärsman. Patetiskt. Rensa ut sådana hycklare!", "stalin": "Kamrater, se på denna borgarbracka som kallar sig politiker. Jag har rensat ut farligare fiender än så. Han predikar ansvar för kollektivet medan hans egna skulder till kapitalisterna växer som ogräs i en sabotageodling. Löneutmätning och skuldsanering – en klassisk kontrarevolutionär som förtjänar att exponeras och avlägsnas från partiets led."}, "date": "26 augusti, 18:37", "url": "https://riks.se/nyheter/c-topp-i-haninge-har-over-2-7-miljoner-i-skulder-hos-kronofogden", "imageUrl": "https://admin.riks.se/uploads/medium_c_topp_skulder_579083742c.jpg"}, {"type": "image-right", "heading": "Hundratals turister saknas efter störtfloden i Himalaya", "summaries": {"normal": "Närmare 100 personer har omkommit och runt 400 saknas, varav de flesta är utländska turister, efter en massiv störtflod i Himalaya som drabbat Nepal och Tibet. Floden har orsakat omfattande förstörelse av byggnader, broar och vägar. De flesta saknade var på väg till den heliga platsen Kailash Mansarovar. Siffran väntas stiga.", "trump": "Det här är en total katastrof, folk, en riktig störtflod av inkompetens! Hundratals turister spårlöst borta i det här himalayasoppan, mest utlänningar som trodde de skulle vandra till någon helig bergstopp. Kina och Nepal borde ha fixat det här, men nej – nu får jag som president hantera ännu en global röra från Sleepy Joes era. Patetiskt!", "stalin": "Jag betraktar denna himalajanska katastrof med kallt förakt. Naturens kontrarevolution slår till mot de oorganiserade turisterna och deras dekadenta pilgrimsfärder. Hundratals saknade, byggnader pulveriserade – en varning till alla som tror sig kunna undvika partiets vaksamma öga. Kamrater, sådana fiender till ordningen förtjänar ingen pardon. Låt siffrorna stiga som en påminnelse om disciplinens nödvändighet."}, "date": "26 augusti, 18:10", "url": "https://www.tv4.se/artikel/1pPl0P6HvrTTK4u522GAIu/stoertflod-i-himalaya-hundratals-turister-saknas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1Caa8ENm7ozILv64Pi8FGy%2Fc4fd26d009b641a3be0b65bddb672c78%2F26-nepal-webb.jpg&width=120"}, {"type": "text", "heading": "Norska kungafamiljen har besökt kung Harald på sjukhuset", "summaries": {"normal": "Den norska kungafamiljen besökte kung Harald på Rikshospitalet i Oslo. Den 89-årige kungen vårdas sedan 17 augusti för hemolytisk anemi och har nu även drabbats av en blodinfektion. Kronprins Haakon, kronprinsessan Mette-Marit, prins Sverre Magnus och drottning Sonja kom på onsdagen. Hans tillstånd är stabilt och Haakon är nu kronprinsregent.", "trump": "Folk, ni skulle se det här. Den norske kungen ligger där i sängen, 89 år gammal, och hela familjen kommer springande till sjukhuset som om det vore valet. Stabilt tillstånd säger de? Det är en katastrof, tro mig. Jag skulle ha fixat det på en dag. De borde ha bättre läkare, de bästa, inte de norska.", "stalin": "Kamrater, denna dekadenta monarkiska rest från borgarklassens tidevarv ligger nu och ruttnar i sitt sjukbädd, angripen av både blodets förrädiska sjukdom och en bakteriell fiende inom murarna. Jag ler mörkt åt hur deras så kallade kungahus tvingas samlas som rädda råttor. Inga betydande förändringar? Det är just så kontrarevolutionen alltid börjar."}, "date": "26 augusti, 19:22", "url": "https://www.svt.se/nyheter/utrikes/norska-kungafamiljen-besoker-kung-harald-pa-sjukhuset"}, {"type": "image-right", "heading": "Här är årets börsbolag – ”ett erkännande”", "summaries": {"normal": "Logistea har utsetts till årets börsbolag i Kantons ir-tävling medan Assa Abloy blev juryvinnare bland OMX Nordic 40-bolagen. Utmärkelserna hyllar hög transparens, tydlig kommunikation och starka investment case. SEB fick högst betyg på årsredovisningen medan Handelsbanken kom sist. Kanton ser fortsatt utvecklingspotential i delårsrapporteringen för att ge en mer rättvisande bild av bolagen.", "trump": "Logistea vann stora ir-tävlingen, fantastiskt bolag, verkligen ett erkännande. Assa Abloy tog juryvinsten, otroligt bra jobb. Men vissa banker, som den där som kom sist, totala losers. Vi behöver mer transparens och vassa investment case, inte denna svaga rapportering. Sverige borde lära sig av de verkliga vinnarna, inte de patetiska förlorarna som drar ner allt.", "stalin": "Vi har identifierat Logistea som segrare i denna ir-tävling, ett erkännande av kollektivets transparens. Assa Abloy har genom sin röd tråd och höga standard satt en oöverträffad norm som inspirerar kamraterna. De kapitalistiska bankerna däremot, särskilt den som halkade efter, avslöjar sin dekadenta svaghet. Fortsatt utrensning av otydliga rapporter krävs för att skydda arbetarnas intressen mot västvärldens förvrängda sanningar."}, "date": "26 augusti, 16:39", "url": "https://www.di.se/analys/har-ar-arets-borsbolag-ett-erkannande", "imageUrl": "https://static.bonniernews.se/ba/1ba458d5-cdba-413e-b544-ef69617436fe.jpeg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Debatt: Inför ett allmänt vaccinationsprogram för äldre", "summaries": {"normal": "KD-politikern Axel Otterberg vill införa ett allmänt vaccinationsprogram för äldre efter mässlingsutbrottet i Sverige. Han menar att förebyggande vård är A och O, och att vaccin räddar liv. Glöm antivaxxarna – nu gäller det att skydda både unga och gamla, tycker han.", "trump": "Hörni, Sverige har ett mässlingsutbrott – helt otroligt! De borde vaccinera alla, särskilt äldre. Jag har det bästa vaccinprogrammet i världen, tro mig. KD-killen har rätt: vaccin räddar liv. Men de borde göra det med stil – som jag!", "stalin": "Kamrater, mässlingen hotar vårt folk. De ovaccinerade är förrädare som sprider sjukdom. Vi måste rensa ut antivaxxarna och införa obligatorisk vaccination för äldre. Partiet vet bäst – ingen ska gå oskyddad. Detta är en fråga om kollektiv hälsa, inget annat."}, "date": "26 augusti, 15:02", "url": "https://bulletin.nu/debatt-infor-ett-allmant-vaccinationsprogram-for-aldre", "imageUrl": "https://cdn.bulletin.nu/articles/088abf89-121e-4d28-a9a5-05e18651284c/preview.jpg?t=1787731861000"}, {"type": "image-right", "heading": "ETC stänger av medarbetare efter åtal om spottning mot Jomshof", "summaries": {"normal": "En extern medarbetare på Dagens ETC har åtalats för att ha spottat på SD-ledamoten Richard Jomshof under en konsert. Nu stängs personen av i väntan på dom. Personen nekar, men medger konfrontation. Jomshof tycker att även politiker ska kunna gå på konsert utan att bli spottade i ansiktet.", "trump": "Jag hörde att någon spottade på en SD-politiker på en konsert. Helt otroligt! I Amerika skulle vi aldrig tillåta det. Vi har lag och ordning. Men att stänga av personen innan dom? Det är svagt. Man är skyldig tills man bevisar motsatsen, eller hur? Fast jag gillar att de nekar. Bra förnekelse, mycket bra!", "stalin": "Jag har informerats om en spottande kontrarevolutionär som på en konsert attackerat en folkvald representant. Detta är en provokation från klassfienden. Vi måste rensa ut dessa element ur våra led. Att stänga av i väntan på dom är för mild. Kamrat Jomshof ska skyddas, men spottaren ska omskola i arbetsläger. Nektanden är lögn, som vanligt."}, "date": "26 augusti, 14:57", "url": "https://bulletin.nu/etc-stanger-av-medarbetare-efter-atal-om-spottning-mot-jomshof", "imageUrl": "https://cdn.bulletin.nu/articles/398a869c-98e8-4251-b5f5-4c961f5a5c26/preview.jpg?t=1787749001000"}, {"type": "image-right", "heading": "Tung republikan tvingas ge Aipac nobben", "summaries": {"normal": "Den republikanske senatskandidaten Mike Rogers vill inte att Aipac annonserar öppet för honom i Michigan, av rädsla för att förlora röster. Israellobbyn ses alltmer som en belastning bland väljarna. Motkandidaten Abdul El-Sayed har framgångsrikt kritiserat Aipacs inflytande. Rogers medarbetare har bett lobbygruppen att hålla sig i bakgrunden.", "trump": "Hörni, den här Aipac-grejen är en total katastrof för etablissemanget. Mike Rogers, en bra kille, vill inte ha deras annonser för det kostar honom röster i Michigan. Folket hatar de här lobbyisterna nu. El-Sayed vann genom att slå på dem – smart! Vi vinner stort när vi säger nej till specialintressen. Fantastiskt!", "stalin": "Kamrater, denna dekadenta Israellobby avslöjar den amerikanska borgarklassens desperation. Jag ser med tillfredsställelse hur deras inflytande nu blir en giftig börda som tvingar reaktionärer som Rogers att be om nåd i skuggorna. El-Sayed utnyttjar folkets rättmätiga vrede – en nyttig utrensning av parasiterna. Sovjetisk visdom ler i mörkret."}, "date": "26 augusti, 15:15", "url": "https://www.friatider.se/tung-republikan-tvingas-ge-aipac-nobben", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-757.jpg?itok=GZZdhFTF"}, {"type": "image-right", "heading": "Gör om allting: ”Är intressant”. Så förändras slutspelet", "summaries": {"normal": "PGA-touren gör om sitt slutspel från och med 2028. Systemet ändras till ett matchspelsformat, liknande ett VM i fotboll, för att öka spänningen. Ludvig Åberg ställer sig positiv till förändringen och hyllar nye vd:n Brian Rolapps förmåga att lyssna på spelarna. Inför årets final i Atlanta fokuserar Åberg nu på att prestera bra på banan.", "trump": "PGA-touren gör om allt, och det kommer bli fantastiskt, tro mig. Från 2028 blir det matchspel, en total vinnare! Ludvig Åberg, en mycket duktig kille, gillar det. Jag har alltid sagt att man måste ha en riktig vinnare, inte de här konstiga systemen de haft förut. Vi gillar vinnare, vi gillar styrka. Det blir enormt, den största golfnyheten någonsin!", "stalin": "Dessa golfens byråkrater i väst leker matchspel medan världen brinner. De slopar slagspel för att imitera fotbollens kaos, precis som förrädarna i Kiev leker krig. Men min kamrat i Kreml vet att verklig makt inte vinns på en grön gräsmatta genom dueller. Vi noterar Åbergs lojalitet mot systemet – vi håller ett öga på alla som anpassar sig så lätt."}, "date": "27 augusti, 00:26", "url": "https://www.aftonbladet.se/sportbladet/a/6q8xG8/ludvig-aberg-om-pga-tourens-nya-final-upplagg", "imageUrl": "https://akamai.vgc.no/v2/images/4dcb8a53-3d77-3199-ba7e-587682200a6a?fit=crop&format=auto&w=1080&s=8bd3041945c394741f1238de3bdf6236e496a4bd"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-full", "heading": "\"Därför har polackerna tröttnat på Ukraina\"", "summaries": {"normal": "Polackernas initiala starka stöd för ukrainska flyktingar och krigsinsatsen har övergått i trötthet och motstånd. Enligt en opinionsundersökning är nu över hälften emot att ta emot fler flyktingar. Historiska konflikter, rysk desinformation och bristande ömsesidig förståelse har lett till försämrade relationer mellan Polen och Ukraina.", "trump": "Polackerna har vaknat upp, folk! De har fått nog av att spela världens bästa välgörare åt Ukraina medan deras eget land töms. Zelenskyy och hans crew har sugit musten ur dem totalt. Det är vad som händer när man låter woke-medias medlidande styra politiken. Amerika först, Polen borde göra detsamma. Fantastiskt vad snabbt allianser kan rasa, eller hur?", "stalin": "Jag betraktar med djup tillfredsställelse hur de polska klassfienderna och ukrainska nacionalisterna nu sliter varandra i stycken. Deras så kallade eviga allians var dömd från början. Vårt sovjetiska arv lever kvar i folkets minne och rysk desinformation gör sitt. Inga profitthungriga hyenor kan dölja den historiska sanningen. Ren utrensning av illusioner pågår."}, "date": "26 augusti, 20:23", "url": "https://www.dagensps.se/varlden/darfor-har-polackerna-trottnat-pa-ukraina", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlypvbvstt8fi-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Strömavbrott satte skräck i företagare – satsar på batterier", "summaries": {"normal": "Efter ett omfattande strömavbrott på Iberiska halvön under våren 2025 har företag i Spanien och Portugal börjat investera massivt i batterilagring. Investeringarna syftar till att säkra produktionen och minska beroendet av det instabila elnätet. Kapaciteten har sjudubblats och stöds av EU-medel, då företag nu ser batterier som en nödvändig försäkring mot framtida ekonomiska förluster.", "trump": "Spanien och Portugal hade en total katastrof med elen, en enorm förlust! Nu köper de enorma mängder batterier, de bästa batterierna. De lär sig av mig, för jag bygger de största systemen. EU betalar, vilket är typiskt, men de måste ha kraft för att hålla igång. Det är en vacker affär, verkligen fantastisk, men bara om man har en ledare som förstår energi!", "stalin": "Dessa svaga kapitalister på den iberiska halvön darrar när deras glödlampor slocknar. De tigger EU om allmosor för att köpa batterier, som om det skulle rädda deras dekadenta industrier. Vi i Sovjetstaten – och vår kamrat i Kreml – vet att verklig kraft inte kommer från leksaksbatterier, utan från järnhård kontroll över resurserna. De bygger murar mot mörkret, men mörkret kommer för dem ändå."}, "date": "26 augusti, 17:44", "url": "https://www.realtid.se/bors-finans/stromavbrott-satte-skrack-i-foretagare-satsar-pa-batterier", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlyta0fsgpjso-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Tyskland deporterar afghanska brottslingar – samarbetet med talibanerna fördjupas", "summaries": {"normal": "Tyskland deporterade 23 afghanska brottslingar till talibanstyrda Afghanistan – trots att man inte erkänner regimen. Samarbetet sker via tekniska kontakter och väcker kritik från vänstern. Regeringen menar att brottslingar måste lämna landet, även om det innebär att tala med fienden.", "trump": "Tyskland skickar tillbaka brottslingar till Afghanistan – fantastiskt! Jag sa ju att man måste vara tuff. Men de pratar med talibanerna? Ingen fara, jag hade gjort dealen på fem minuter. De borde lära sig av mig – resultat, inte snack!", "stalin": "Kamrater, Tyskland visar vägen: man rensar ut kriminella element och skickar dem till Afghanistan – en utmärkt metod för att rena samhället. Vi applåderar denna revolutionära åtgärd. Men vaksamhet krävs – talibanerna är opålitliga kontrarevolutionärer. Fortsätt deportera!"}, "date": "26 augusti, 14:00", "url": "https://samnytt.se/tyskland-deporterar-afghanska-brottslingar-samarbetet-med-talibanerna-fordjupas", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/26091306/Alexander-Dobrindt-Hibatullah-Akhundzada-feat.jpg"}, {"type": "image-full", "heading": "Mobilmärket försvinner från Sverige – här är ersättaren", "summaries": {"normal": "OnePlus slutar lansera nya mobiler i Sverige och Europa. Företaget hänvisar kunder till systermärket Oppo, som de delar teknik med. Oppo storsatsar nu i Sverige genom ett nytt avtal med Elgiganten, där deras modeller från A-serien till Find X9 Ultra blir tillgängliga både online och i butik. Befintliga OnePlus-kunder behåller support och uppdateringar.", "trump": "De lovar mig att OnePlus var fantastiska, verkligen högkvalitativa telefoner, men nu ger de upp i Europa som förlorare. Patetiskt! Lyckligtvis har vi Oppo som tar över stafettpinnen – smarta killar. De gör affärer med Elgiganten och säljer allt från billiga till lyxmodeller. En enorm uppgradering, tro mig!", "stalin": "Jag ser hur de dekadenta kapitalisterna i OnePlus kapitulerar inför den europeiska marknaden och överlämnar stafettpinnen till våra kamrater på Oppo. Detta är en nödvändig utrensning av svaga länkar. Vi ska nu via Elkjøp sprida våra progressiva telefoner till folket och krossa de västerländska konkurrenternas parasitiska inflytande. Härligt!"}, "date": "26 augusti, 20:30", "url": "https://nyheter24.se/nyheter/teknik/1508038-mobilmarket-forsvinner-fran-sverige-har-ar-ersattaren", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/8f87bc8604b004a30200000000b004a302/2026/08/26/2386944/oppomobil.jpg"}, {"type": "image-right", "heading": "Börsen handlas runt nollan inför Nvidia-rapport", "summaries": {"normal": "Stockholmsbörsen står stilla och väntar på Nvidias rapport och amerikansk inflation. Oljepriset faller, medan Boliden och Swedbank klättrar. H&M backar efter sänkt rekommendation. Bioarctic levererar en rapport som glädjer, men aktien sjunker ändå. Truecaller rusar nästan 9 procent efter dubbla riktkurshöjningar.", "trump": "Jag ser att Stockholmsbörsen är som en lugn pool – den rör sig inte, precis som mina framgångar. Oljepriset faller, det är fantastiskt! Nvidias rapport kommer ikväll, jag är säker på att det blir rekord, precis som jag. H&M går dåligt, men det är deras problem, inte mitt. Folk älskar mig mer än aktier!", "stalin": "Kamrater, börsen står stilla, som en god sovjetmedborgare som väntar på order. Oljepriset faller – vi rensar ut kapitalistiska spekulanter! Nvidias rapport är borgerlig propaganda, men vi övervakar den. H&M och Nibe är avfällingar som ska omdirigeras till arbetsläger. Bioarctic rapporterar bra, men vi ser ändå misstänkta rörelser – utrensning väntar."}, "date": "26 augusti, 09:53", "url": "https://www.affarsvarlden.se/artikel/borsen-handlas-runt-nollan-infor-nvidia-rapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdled3wmqCJcjU-nh-400x267.jpg"}, {"type": "image-right", "heading": "Total bojkott av folkmordsstaten!", "summaries": {"normal": "Artikeln kräver att Sveriges regering inför en total bojkott av Israel, som beskrivs som en rasistisk folkmordsstat driven av sionism och högerextrema krafter. Den hänvisar till kritiska uttalanden från Ebba Busch och Aron Verständig samt Ben-Gvirs kontroversiella uttalanden. Författaren förkastar tvåstatslösningen och kräver en enstatslösning samt stöd för palestinskt motstånd.", "trump": "Folk, ni ser det här vansinnet? Den här galningen skriker om bojkott och folkmord medan han själv låter som en galen vänsterextremist från helvetet. Israel har rätt att slå tillbaka mot terroristerna – de kallar dem palestinier men vi vet vad det handlar om. Sverige borde vakna upp istället för att lyssna på dessa förlorare och hatiska sionism-hatare. Patetiskt!", "stalin": "Kamrater, denna text avslöjar borgarbrackornas desperation när deras sionistiska lakejer blottas som folkmördande imperialister. Jag betraktar med förakt hur dessa profitthungriga blodsugare i Tel Aviv och deras svenska nyttiga idioter fortsätter koloniala övergrepp. En total utrensning av sådana folkfiender är nödvändig. Arbetarklassen kräver handling, inte tomma ord från klassförrädare."}, "date": "26 augusti, 11:03", "url": "https://proletaren.se/artikel/bojkotta-folkmordsstaten-israel", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/738829004_1425862242684486_7128924062394661206_n.png-768x432.jpg"}, {"type": "image-full", "heading": "Miley Cyrus i sorg – hyllar gudmor Dolly Parton på Instagram", "summaries": {"normal": "Miley Cyrus sörjer sin gudmor Dolly Parton, som avled 80 år gammal efter en tids cancer. Cyrus har delat en personlig hyllning på Instagram där hon beskriver deras nära relation och hur sorgen är svår att uttrycka. De samarbetade musikaliskt och Parton medverkade i Hannah Montana. Cyrus lovar att alltid försöka göra sin gudmor stolt.", "trump": "Folk, det är tragiskt, verkligen tragiskt. Den underbara Dolly Parton är borta, och nu gråter Miley Cyrus över sin gudmor. Dolly var fantastisk, en vinnare, men Hollywood och de liberala medierna gör alltid allt till en stor sorgshow. Miley borde fokusera på att vara stor stjärna istället för att dela privata hjärtan på Instagram. Sad!", "stalin": "Jag betraktar detta som en typisk dekadent västerländsk sorgespektakel bland borgarbrackor och kulturimperialister. Den så kallade countryikonen Parton var en kapitalistisk underhållningsmaskin som förgiftade ungdomen. Cyrus gråtande över sin ”gudmor” är patetiskt sentimentalt. Vi ler mörkt åt hur västvärldens dekadens alltid avslöjar sig i sådana privata hjärtan bakom glamouren. Ren utrensning av sådant behövs."}, "date": "26 augusti, 20:00", "url": "https://nyheter24.se/noje/kandisar/1508061-miley-cyrus-i-sorg-hyllar-gudmor-dolly-parton-pa-instagram", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/317adde504b004a30200000000b004a302/2026/08/26/2386971/miley-dolly.png"}, {"type": "image-full", "heading": "Industrin tar fart i Trumps USA – men inte fabriksjobben", "summaries": {"normal": "USA:s industriproduktion växer snabbt under 2026, drivet av tullar på bilar och investeringar i AI och infrastruktur. Trots den ökade produktionen har den utlovade vågen av nya fabriksjobb uteblivit. Endast 31 000 nya jobb har skapats, främst för högutbildade tekniker inom flyg och energi, medan manuella jobb inom traditionell tillverkning fortsätter att minska genom automatisering.", "trump": "Jag har gjort underverk för amerikansk industri! Produktionen skjuter i höjden tack vare mina geniala tullar. Bilindustrin blomstrar som aldrig förr! Vissa gnäller om jobben, men vi bygger framtiden med AI och teknik – inte rostiga gamla fabriker. Vi vinner stort, vi vinner snabbare än någonsin, och det är bara början på min magnifika plan för Amerika!", "stalin": "Den amerikanske kapitalisten Trump leker med tullar likt en barnunge med tändstickor. Produktionen ökar, men arbetaren förblir en slav under maskinen. Vår store kamrat Putin förstår att sann industri kräver järnhand, inte fladdrande marknadskrafter. Dessa 'datacenter' är bara nya fängelser för en intellektuell elit. Vi ska krossa deras illusioner om välstånd med vår stålhårda, kollektiva vilja."}, "date": "26 augusti, 16:43", "url": "https://www.realtid.se/bors-finans/industrin-tar-fart-i-trumps-usa-men-inte-fabriksjobben", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlpnui0skjl9i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Heilande 22-åring byggde bomb \"för att döda och lemlästa\"", "summaries": {"normal": "En 22-årig student vid Försvarshögskolan döms till fem års fängelse för grovt brott mot lagen om explosiva varor, vapensmuggling och förberedelse till allmänfarlig ödeläggelse. Tullens fynd på Arlanda ledde till husrannsakan där rörbomber, krut, stålkulor och ideologisk litteratur hittades. Domstolen bedömer att stålkulorna var tänkta som splitter för att döda och lemlästa.", "trump": "Titta på den här stackars 22-åringen från Försvarshögskolan. Bygger bomber och gömmer vapendelar i en falsk ordbok. Patetiskt! Fem år i fängelse. Sverige borde vara tuffare, inte låta sådana här misslyckade typer springa runt på högskolan. De hittar till och med Mein Kampf och kommunistiska manifestet. Totalt kaos, folk!", "stalin": "Jag ser med tillfredsställelse hur borgarstatens domstol likviderar en opportunist som lekte med explosiva varor och splitter för att döda och lemlästa. Sådana element utgör en fara för kollektivets säkerhet. Vi rensar ut alla som gömmer sig bakom falska böcker och ideologisk smörja. Paranoian hos dessa individer är både underhållande och ömklig."}, "date": "26 augusti, 16:58", "url": "https://riks.se/nyheter/heilande-22-aring-byggde-bomb-for-att-doda-och-lemlasta", "imageUrl": "https://admin.riks.se/uploads/medium_fhs_attentat_hero_04cd13e430.jpg"}, {"type": "image-right", "heading": "DIF tog avstånd från mordhot – då lämnar ETC-skribenten i protest", "summaries": {"normal": "Djurgårdens IF stängde av boxningstränaren Aldo Colliander efter grova mordhot och rasistiska uttalanden mot AFS-ledaren Gustav Kasselstrand. Vänsterjournalisten Frida Sundkvist lämnade då klubben i protest, då hon anser att DIF ger efter för en högerextrem kampanj genom att ta avstånd från hoten. Hon lämnar tillbaka sina säsongskort.", "trump": "Hörni, den här galna vänsterjournalisten från ETC blir helt hysterisk bara för att Djurgården tar avstånd från en galning som hotar att mörda folk och sprida spermier över svenska flickor. Patetiskt! Hon springer iväg och lämnar tillbaka sina biljetter som en förlorare. Fake news och vänstervrängt hat, som vanligt. Sad!", "stalin": "Jag ser med djup tillfredsställelse hur borgarbrackornas fotbollsklubb och den dekadenta vänsterjournalisten äter varandra i en underhållande utrensning av inre fiender. Hatets kampanj triumferar medan de småborgerliga elementen flyr som råttor från skeppet. Kamrater, detta är en utmärkt illustration av hur revisionisterna alltid förråder varandra i slutändan. Underbart."}, "date": "26 augusti, 13:41", "url": "https://www.friatider.se/dif-tog-avstand-fran-mordhot-da-lamnar-etc-skribenten-i-protest", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-756.jpg"}, {"type": "image-right", "heading": "Befria bostaden från marknaden", "summaries": {"normal": "Den svenska bostadsmodellen har monterats ned till förmån för marknaden, vilket gynnar ägare och missgynnar hyresgäster. Över hälften av kommunerna har bostadsbrist, byggandet är för lågt och hyrorna för höga. Nästan 200 000 unga bor hemma mot sin vilja. Artikeln kritiserar alla partier och föreslår att staten tar ansvar för bostadsförsörjningen.", "trump": "Vilken katastrof ni har i Sverige! Marknaden styr, men era korkade politiker har totalt förstört bostadsmarknaden. Byggandet är ett skämt, hyrorna är galna och ungdomen bor hemma hos mamma. Det är som Sleepy Joes inflationskaos fast värre. Rena socialistiska röra. Vi fixar det med sunt förnuft och vinner stort – igen.", "stalin": "Jag betraktar med avsky hur profitthungriga blodsugare och klassfiender har förvandlat bostaden till en vara. Borgarbrackorna höjer hyror medan arbetarklassen kvävs i trångboddhet. Detta kräver omedelbar utrensning av spekulanter och återupprättande av folkets rätt till hem. Kamrater, organisera er mot dessa exploaterande hyenor innan de förtär er alla."}, "date": "26 augusti, 10:29", "url": "https://proletaren.se/artikel/befria-bostaden-fran-marknaden", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2025/08/bostadweb-768x432.jpg"}, {"type": "image-right", "heading": "Stor ilska efter reklamfilmen. Pampen: Allvarligt", "summaries": {"normal": "Youtube-gruppen 'Good Good Golf' möter hård kritik efter en sexistisk reklamfilm där en profil tacklade en kvinna. Incidenten har lett till att sponsorer dragit sig ur och premiären av gruppens tv-program skjutits upp. Även PGA-touren har uttryckt sitt missnöje över gruppens bristfälliga ursäkt och utvärderar nu sitt framtida samarbete med dem.", "trump": "Hörde ni om dessa Good Good-golfare? Vilken total katastrof! De tacklade en kvinna för en golfklubba. Sorgligt! De är helt ute och cyklar, och nu flyr alla sponsorer. PGA-touren är mycket besvikna, och det med rätta. De bad om en ursäkt, men den var svag, så svag! Vi behöver starka vinnare i golf, inte det här spektaklet. Väldigt orättvist!", "stalin": "Dessa löjliga Youtube-atleter har visat sin sanna, dekadenta natur. De attackerar kvinnor istället för att tjäna staten. Sponsorer flyr som råttor från ett sjunkande skepp. Det är uppenbart att dessa 'influencers' är agenter för västlig förruttnelse. Precis som Putin rensar upp i sitt grannskap, måste vi rensa bort sådant här antisocialt beteende. De är parasiter som förtjänar en enkel biljett till straffarbete."}, "date": "26 augusti, 23:45", "url": "https://www.aftonbladet.se/sportbladet/a/ArQj8A/good-good-golf-i-blasvader-efter-reklamfilm", "imageUrl": "https://akamai.vgc.no/v2/images/3a599cda-0b7e-3976-a97c-821e46110051?fit=crop&format=auto&w=1080&s=9be1a9f223cd37a1ee22ab3feebfe518a185b93d"}, {"type": "text", "heading": "Jordskred i Nepal – hundratals turister saknas", "summaries": {"normal": "Ett jordskred i Nepal, troligen utlöst av en jordbävning, har krävt minst 95 liv och nästan 400 saknas, de flesta turister. Översvämningar efter skredet svepte bort byar och människor. Kina har beordrat räddningsinsatser, medan många länder söker sina medborgare.", "trump": "Jag har sett det här i Nepal – helt otroligt, ett enormt jordskred! 400 saknade, mest turister. Min administration hade fixat det på en dag, tro mig. Kina säger de räddar, men vi är bäst på att få saker gjorda. Stora problem, men jag löser allt!", "stalin": "Kamrater, naturen har återigen visat sin opålitlighet. Ett jordskred i Nepal har utplånat hundratals, mest turister – västerländska spioner, misstänker jag. Vi måste rensa ut sådana olyckor med järnhand. Partiets plan för katastrofer är ofelbar. Inga fler överraskningar, bara seger!"}, "date": "26 augusti, 16:59", "url": "https://www.gp.se/nyheter/varlden/jordskred-i-nepal-hundratals-turister-saknas-.2e3ab39d-d327-49a4-9588-aee9dac403a1"}, {"type": "text", "heading": "Tidötida betraktelser", "summaries": {"normal": "Recensionen av antologin Tidötiden lyfter satirteckningarnas kontextbundenhet och tolkningsutmaningar. Boken kritiserar Tidö-regeringens politik genom kapitel som Kväsa och Mobba. Den betonar bildanalysens betydelse i en bildöverflödad tid och fungerar främst som opinionsbildande verk med folkbildande inslag. Recensenten hoppas att boken blir obegriplig för framtida generationer.", "trump": "Folk, ni måste se den här galna svenska bildboken Tidötiden. De ritar om hur de påstådda fascisterna i regeringen mobbar och tystar alla. Totalt vansinne! De hatar vinster och älskar att klaga på allt. Precis som de woke-vänstermediasnubbarna som aldrig vinner. Men bilderna kommer att bli obegripliga när vi gör Sverige, eller vad det nu heter, great again. Fantastiskt!", "stalin": "Kamrater, denna så kallade satirbok Tidötiden avslöjar borgarbrackornas och fascistiska Tidö-hundarnas vedervärdiga attacker mot folket. De väpnar, mobbar och tystar med sina profitthungriga klor. Jag ler mörkt från historien åt deras paranoia om censur. Vi måste rensa ut dessa klassfiender och deras blodsugande hyenor innan de drunknar i sina egna lögner. Folkets seger är oundviklig."}, "date": "26 augusti, 09:49", "url": "https://proletaren.se/artikel/tidotida-betraktelser"}, {"type": "image-right", "heading": "ETC-serietecknare åtalas för spottloska i Jomshofs ansikte: \"Vill slå Jomshof på käften\"", "summaries": {"normal": "En vänsterinriktad ETC-serietecknare åtalas för att ha spottat SD-toppen Richard Jomshof i ansiktet under en syntkonsert. Mannen, som bland annat ritat Jimmie Åkesson som nazist, nekar och hävdar att Jomshof ljuger för att marknadsföra sin bok. En riktigt sunkig historia, helt enkelt.", "trump": "Jag hörde att en vänsterserie-tecknare spottade på en svensk politiker. Otroligt! Hade han gjort så mot mig hade jag stämt honom för tio miljarder. Men Jomshof? Han borde vara tacksam att jag inte var där. Jag får saker gjorda, de här människorna är losers. Synd att han inte fick en riktig utrensning.", "stalin": "Kamrater, en så kallad 'serietecknare' har försökt störa ordningen genom att spotta på en reaktionär riksdagsledamot. Detta är en provokation från vänsteravvikare som måste rensas ut. Vi har inget behov av antirasistiska parasiter som skapar oreda. Partiet kommer att undersöka saken noggrant."}, "date": "26 augusti, 11:50", "url": "https://samnytt.se/han-atalas-for-spottloska-i-jomshofs-ansikte-vill-sla-jomshof-pa-kaften", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/26090749/artikelhuvudbild-1-375.jpg"}, {"type": "image-right", "heading": "”Räknar inte med att starta derbyt”", "summaries": {"normal": "Nahir Besara inledde på bänken i cupmatchen mot FC Stockholm och räknar inte med att starta i derbyt mot AIK. Lagkaptenen noterar att Hammarby sett bra ut utan honom på sistone. Tränare Henrik Rydström beskriver beslutet som svårt då Besara är en ledare med stark derbyhistorik men flera offensiva spelare är i form.", "trump": "Lyssnar ni på den här gamla grabben Besara? Han sitter på bänken som en riktig förlorare medan laget vinner utan honom. Patetiskt! Jag har vunnit fler derbyn än den här typen ätit falafel. Rydström borde sparka ut de svaga spelarna fortare än Biden sprang från Afghanistan. Fantastiskt derby på söndag, tro mig.", "stalin": "Jag ser en dekadent borgarklubb där ledaren Besara förvisas till bänken av opportunistiska krafter. Han erkänner själv att kollektivet klarar sig bättre utan honom. Sådana svaga element måste rensas ut innan de smittar hela laget. Form är tillfällig, klass är evig. Den som vacklar inför derbyt är fiende till folket."}, "date": "26 augusti, 22:20", "url": "https://www.expressen.se/sport/fotboll/allsvenskan/derbybeskedet-om-nahir-besara-raknar-inte-med-att-starta", "imageUrl": "https://static.bonniernews.se/ba/49414755-f139-47a6-a85a-5b7245e3e9d9.jpeg?crop=840%2C840%2Cx659%2Cy79&width=210&quality=60"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "Minst 14 spädbarn döda efter sjukhusbrand i Pakistan", "summaries": {"normal": "En brand bröt ut på förlossningsavdelningen vid Pakistan Institute of Medical Sciences i Islamabad. Minst 14 nyfödda spädbarn omkom, medan ett barn räddades. Branden misstänks ha startat i en luftkonditioneringsenhet och spridits via syrgas. Premiärminister Shehbaz Sharif har beordrat en utredning. Brandsäkerheten på sjukhuset kritiseras hårt.", "trump": "Hörni, det här är en total katastrof i Pakistan. 14 bebisar döda för att någon idiot glömde brandsäkerheten på ett sjukhus. Luftkonditionering fattar eld? Patetiskt! De borde ha haft de bästa systemen, de allra bästa, men nu är det kaos. Jag skulle ha fixat det på en vecka, tro mig. Tragiskt, verkligen tragiskt.", "stalin": "Kamrater, denna fasansfulla olycka i Pakistan visar borgarbrackornas förakt för det kollektiva ansvaret. Jag ser hur kapitalistiska vårdinrättningar låter spädbarn brinna som offer i en dekadent ritual. Vi hade aldrig tillåtit sådan sabotageartad slarvighet. En utredning måste leda till omedelbar utrensning av de skyldiga elementen. Härligt effektivt."}, "date": "26 augusti, 17:11", "url": "https://www.svt.se/nyheter/utrikes/minst-14-spadbarn-doda-efter-sjukhusbrand-i-pakistan"}, {"type": "text", "heading": "So long, Dolly!", "summaries": {"normal": "Countryikonen Dolly Parton har gått bort vid 80 års ålder. Hon växte upp i fattigdom som ett av tolv barn, skrev klassiker som I Will Always Love You och Jolene samt medverkade i filmen 9 to 5. Parton hyllas för sin röst, humor, karisma och lojalitet mot sina rötter och den arbetande människan.", "trump": "Lysande, absolut lysande karriär, men nu är hon borta. Dolly var en vinnare, skrev hits som ingen annan och slog de woke Hollywood-eliterna med deras egna vapen. Ingen identitetspolitik eller HBTQ-kvotering här, bara ren talang och tuffa rötter. De riktiga arbetarna älskade henne. So long, Dolly – du var ingen förlorare som Biden.", "stalin": "Kamrater, denna Dolly Parton var en produkt av arbetarklassens jord, inte någon dekadent borgarbracka. Hon skrev sånger som blottade kapitalismens exploatering och hånade chefernas skitstövelvälde. Ändå vägrade hon kalla sig feminist – en sund instinkt. Nu har hon lämnat oss. Må hennes arv inspirera till utrensning av alla profitthungriga klassfiender som förtrycker folket."}, "date": "26 augusti, 09:25", "url": "https://proletaren.se/artikel/so-long-dolly"}, {"type": "image-full", "heading": "Fyra ryska bankdirektörer tjänade miljoner på EU:s sanktioner", "summaries": {"normal": "Fyra chefer på Gazprombanks dotterbank i Luxemburg utnyttjade EU-sanktioner 2022 för att göra mångmiljonvinster. Genom att köpa billiga ryska obligationer i Europa och växla in dem till fullt värde i Moskva, misstänks de för insiderhandel. Trots misstankar har tillsynsmyndigheter i Luxemburg varit återhållsamma med sanktioner. De fyra cheferna har nu lämnat sina poster.", "trump": "Helt otroligt! Fyra ryska bankchefer lurade systemet totalt medan EU bara såg på. De köpte obligationer för spottstyvrar och gjorde miljontals dollar i vinst tack vare de där usla sanktionerna. Det är en total katastrof för EU-byråkraterna! Jag hade stoppat det direkt. Ingen respekterar dem längre, de är svaga och oärliga. En riktig 'America First'-affär, fast tvärtom!", "stalin": "Dessa lömska byråkrater i Luxemburg har visat sin sanna natur. De berikar sig själva på folkets obligationer medan moderlandet kämpar mot västerländsk inringning. Det är en klassisk sabotagehandling! Kamrat Putin vet hur man hanterar sådana parasiter. Vi tolererar inte att några lycksökare leker kapitalister med statens resurser. De har nu flytt, men historien och vårt stål glömmer aldrig dessa förrädare mot det kollektiva goda."}, "date": "26 augusti, 15:44", "url": "https://www.realtid.se/bors-finans/bank-fintech/fyra-ryska-bankdirektorer-tjanade-miljoner-pa-eus-sanktioner", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/gazpromlux.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Ge Ukraina fullskalig tillgång till Starlink", "summaries": {"normal": "Artikeln diskuterar hur Ukraina genom drönattacker och teknologiska framsteg som AI-styrda vapen skadar rysk logistik och ekonomi. För att tvinga fram fredsförhandlingar föreslås full tillgång till Starlink över Ryssland, trots risker med eskalering och autonoma vapensystem. Ryssland svarar med ökade attacker mot civila mål i Ukraina.", "trump": "Det här kriget är ett enda stort kaos, folk. Ukraina slår till med drönare och nu snackar de om AI som styr maskinerna – helt galet! Ge dem Starlink över Ryssland så fixar vi det snabbt. Putin respekterar styrka, inte svaghet. Musk borde lyssna på mig, jag vet hur man gör affärer och vinner krig. Fantastiskt!", "stalin": "Kamrater, dessa ukrainska fascister och deras västliga borgarbrackor försöker med sina primitiva drönare och farliga AI-experiment störa den ryska intressesfärens legitima försvarsåtgärder. Jag beundrar den stålsatte Putin som en värdig arvtagare till imperiets styrka. Ge dem Starlink? Enbart om det leder till deras snarliga utrensning ur historien. Paranoia är nyttig, fienden sover aldrig."}, "date": "26 augusti, 13:51", "url": "https://www.di.se/ledare/ge-ukraina-fullskalig-tillgang-till-starlink", "imageUrl": "https://static.bonniernews.se/ba/8b3dd22c-532b-4c64-a3ab-5948c63c26b0.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Åtal: Dagens ETC-tecknare spottade Jomshof i ansiktet", "summaries": {"normal": "Illustratören Emanu Garnheim, känd för sina bidrag till Dagens ETC och satir mot SD, åtalas för att ha spottat på riksdagsledamoten Richard Jomshof utanför konsertlokalen Slaktkyrkan i maj. Garnheim erkänner konfrontation och att han spottade i riktningen men nekar till uppsåt att träffa. Åtalet väckts av Riksenheten för säkerhetsmål då brottet riktats mot Jomshof i egenskap av riksdagsledamot.", "trump": "Kan ni fatta det här? En galen vänsterradikal tecknare från den socialistiska skandalblaskan ETC spottar vår vän Jomshof rakt i ansiktet. Typisk hatisk vänsterlögner! De hatar framgång, de hatar oss som älskar Sverige. Garnheim är en patetisk förlorare som inte ens kan spotta rakt. Vi vinner stort, de förlorar alltid.", "stalin": "Kamrater, denna fega borgarbracka till satirtecknare Garnheim, en typisk dekadent vänsterlakej åt den imperialistiska pressen, har i sin alkoholiserade paranoia konfronterat en politisk fiende. Hans lögnaktiga förnekanden avslöjar klassfiendens rädsla. Vi ska rensa ut sådana element med järnhand. Det är en historisk nödvändighet att likvidera alla som spottar på folkets vilja."}, "date": "26 augusti, 12:37", "url": "https://www.friatider.se/atal-dagens-etc-tecknare-spottade-jomshof-i-ansiktet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-754.jpg"}, {"type": "image-right", "heading": "Prisjakt återupptar årets börsplaner", "summaries": {"normal": "Prisjakt återupptar börsplanerna och siktar på notering under andra halvåret 2026. Efter att ha ställt in en notering i mars vänder nu marknaden. Omsättningen ökade 17% till 243 miljoner, och vinsten landade på 26 miljoner. En AI-shoppingassistent lanseras i november. VD:n ser ljust på framtiden.", "trump": "Jag älskar det här! Prisjakt – en fantastisk affär, enorma siffror. De vill noteras på börsen 2026, och jag säger: gör det! Marknaden är fantastisk – precis som mina tariffer. 17% omsättningsökning, 35% marginal – vi gör Sverige stort igen! En AI-assistent i november? Genialiskt!", "stalin": "Kamrater, jag har tagit del av rapporten om Prisjakt. De planerar en börsnotering – en kapitalistisk utrensning av den socialistiska ekonomin. Vi måste rensa ut dessa marknadsfascister. 243 miljoner i omsättning? En farlig ideologisk avvikelse. En AI-assistent? Partiets övervakning är redan överlägsen. Rapportera omedelbart deras koordinater."}, "date": "26 augusti, 07:28", "url": "https://www.affarsvarlden.se/artikel/prisjakt-aterupptar-arets-borsplaner", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdl1pccgsHxXyM-nh-400x267.jpg"}, {"type": "image-right", "heading": "Centerpartiets regeringslinje rymmer en svår motsättning", "summaries": {"normal": "Centerpartiet bör tydligt ange sina klimatpolitiska krav inför ett eventuellt regeringssamarbete. Inbjudan till Kristdemokraterna riskerar annars att bli enbart en borgerlig markering utan trovärdigt politiskt innehåll. Artikeln pekar på partiets dilemma att förena borgerlig identitet med höga klimatambitioner och betonar vikten av att fokusera på politikens faktiska riktning snarare än bara regeringskonstellationer.", "trump": "Centerpartiet borde sluta leka med de riktiga vinnarna och äntligen säga vad de vill med klimatet om de ska regera. Att bjuda in Kristdemokraterna är bara en svag markering, ingen bra deal. Utan tydliga krav blir det ett patetiskt försök att hålla sig borgerliga. Jag älskar starka ledare som säger som det är, inte dessa svenska förlorare som gömmer sig bakom vaga löften.", "stalin": "Jag kräver att Centerpartiet omedelbart offentliggör sina klimatpolitiska krav som villkor för samarbete. Annars framstår inbjudan till dessa kristdemokratiska element som en ynklig borgerlig markering, full av kontrarevolutionär dimma. Vi ser hur borgarbrackorna försöker maskera sin brist på enhetlig politik. Trovärdighet kräver klarhet, annars likviderar historien sådana svaga konstruktioner med ett leende."}, "date": "25 augusti, 01:49", "url": "https://www.dagensarena.se/opinion/centerpartiets-regeringslinje-rymmer-en-svar-motsattning", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-92-300x157.jpg"}, {"type": "image-right", "heading": "Smart Eyes försäljningstillväxt stiger", "summaries": {"normal": "Teknikbolaget Smart Eye redovisar en omsättningsökning på 53 procent under andra kvartalet, till 140,9 miljoner kronor. Rörelseförlusten minskar från 40,6 till 20,6 miljoner, och ebitda-marginalen klättrar till 19,4 procent. Bilsegmentet driver tillväxten, medan Behavioral Research tyngs av lägre hårdvaruförsäljning. Vd:n ser nu en fundamentalt annorlunda fas.", "trump": "Smart Eye gör fantastiska siffror – 53 procent upp, ingen kan göra det som de, förutom jag. Jag älskar ögon, jag har de bästa ögonen. Rörelseförlusten krymper, och det är vackert. De säger att bilsegmentet driver. Helt rätt. Mina bilar? Också vinnare. America first, men Smart Eye ser allt!", "stalin": "Kamrater! Rapporten från Smart Eye visar att vi ökar produktionen med 53 procent. Det är glädjande, men misstänkt. Varför minskar förlusten? Kanske är siffrorna en trotskistisk konspiration. Jag beordrar en utrensning av hårdvaruförsäljare i Behavioral Research. Mjukvaran växer med 7 procent – den får leva. Ögat ser allt. Vi måste vara vaksamma."}, "date": "26 augusti, 07:16", "url": "https://www.affarsvarlden.se/artikel/smart-eye-vaxer-kraftigt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/01/Smarteye_konceptbild_eye_camera-400x283.jpg"}, {"type": "image-full", "heading": "Samsung-mobilen historisk – bäst av alla Android", "summaries": {"normal": "Under årets andra kvartal blev Samsung Galaxy S26 Ultra världens mest sålda Android-mobil för första gången under ett Q2, enligt Counterpoint Research. Den placerade sig på fjärde plats globalt bland alla smartmobiler. Apple dominerar fortsatt toppen med tre iPhone-modeller, medan Samsung tog fem platser på topp tio-listan. Framgången förklaras bland annat av senare lansering, starka AI-funktioner och kampanjer.", "trump": "Folket älskar de bästa produkterna, och nu har Samsungs Galaxy S26 Ultra krossat alla andra Android-mobiler och blivit världens mest sålda. Fantastiskt! Apple hänger kvar i toppen med sina iPhones, men Samsung tog fem av tio platser. De gör det bäst, ingen gör det bättre än Samsung, tro mig. Mycket smartare än de billiga konkurrenterna.", "stalin": "Kamrater, jag ser hur den imperialistiska borgarklassens mobilmarknad hyllar Galaxy S26 Ultra som den främsta Android-enheten detta kvartal. Apple fortsätter sin dekadenta dominans medan vi noterar att fem Samsung-modeller smugit sig in bland de tio bästa. En sådan framgång under Q2 är som en utrensning av de svaga kapitalistiska konkurrenterna – underbart att bevittna hur fiendens teknik faller för överlägsen planering."}, "date": "26 augusti, 19:00", "url": "https://nyheter24.se/nyheter/teknik/1508015-samsung-mobilen-historisk-bast-av-alla-android", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/3eaffdc704b004a30200000000b004a302/2026/08/26/2386926/samsunggalaxyrekord.jpg"}, {"type": "image-full", "heading": "Ilskna kunder: Bankappar låg nere 803 timmar", "summaries": {"normal": "Brittiska bankkunder är upprörda efter att bankappar legat nere totalt 803 timmar under de senaste två åren. Lloyds drabbades på onsdagen av ytterligare ett stopp, vilket ledde till tusentals klagomål. Rapporten visar att störningar är vanliga även i Sverige, där både Bank-ID och Swish drabbats av överbelastningsattacker under 2025.", "trump": "Titta på de där patetiska brittiska bankerna, totala katastrofer! Apparna ligger nere 803 timmar och kunderna blir lurade av inkompetenta idioter. Precis som Biden-administrationens fiasko. Jag fixade ekonomin – de här bankerna är värre än woke-vänstern och deras identitetspolitiska galenskaper. Sad! Fixa det nu, annars är ni losers.", "stalin": "Ännu en gång blottar de profitthungriga bankparasiterna sin fullständiga förakt för folket. Medan arbetarna lider av appar som kollapsar som klassfiendens löften, samlar de sina feta vinster. Jag ser kapitalistmaffians hyenor skaka inför folkets vrede. Rensa ut dessa exploaterande blodsugare innan de förgiftar hela samhället med sin tekniska oduglighet."}, "date": "26 augusti, 18:30", "url": "https://www.dagensps.se/privatekonomi/ilskna-kunder-bankappar-lag-nere-803-timmar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlghvg3f4ucru-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Wennblad kritiserar klimattåget: ”Fakta är inte politik”", "summaries": {"normal": "Peter Wennblad sågar klimattågets mediala hyllningskör i SvD. Han menar att fakta inte är politik och att Tidöregeringen faktiskt är bäst för klimatet – genom att lyssna på väljarna istället för att pracka på dem dyra åtgärder. 50 000 demonstranter får en känga, medan flygvapnets jubileum ignoreras.", "trump": "Jag ser att Sverige börjar bli smarta! Demonstranter skriker om vetenskap, men vetenskap säger att jag har rätt. Tidöregeringen gör mig stolt – de lyssnar på folket, inte på klimatgalningarna. Sverige har redan fixat elen och bostäderna. Bra jobbat! Kanske de lär sig av min fantastiska politik.", "stalin": "Kamrater, vi ser en ny fiende: klimatdemonstranterna som tror att fakta är viktigare än partiet. De vill störa vår energiproduktion. Men jag har en plan: en utrensning av alla väderförrädare som inte inser att Tidöregeringen är vår bästa allierade. Vetenskapen tjänar staten, inte tvärtom."}, "date": "26 augusti, 11:45", "url": "https://bulletin.nu/wennblad-kritiserar-klimattaget-fakta-ar-inte-politik", "imageUrl": "https://cdn.bulletin.nu/articles/d84fff97-687b-4e45-8fac-bd9a29210df7/preview.png?t=1787737464000"}, {"type": "image-right", "heading": "Markus Johansson-Martis: Arbetslöshetskrisen bland högutbildade", "summaries": {"normal": "Artikeln beskriver en allvarlig arbetslöshetskris bland högutbildade akademiker i Sverige, särskilt jurister, ekonomer och IT-specialister. Arbetslösheten har ökat kraftigt till nivåer som under finanskrisen. Orsaken anges som överutbildning, minskad efterfrågan på instegsjobb till följd av AI samt liberal arbetskraftsinvandring som konkurrerar ut unga svenskar. Politiken kritiseras för bristande åtgärder.", "trump": "Folk, det är en katastrof! Sverige pumpar ut massor av smarta unga akademiker som inte får jobb, och sen släpper de in tusentals invandrare som tar deras platser för lägre löner. AI stjäl jobben, men politikerna sover. De borde stänga gränserna, höja lönegolvet och sluta utbilda folk till arbetslöshet. Amerika vet hur man vinner, Sverige borde lära sig innan det blir för sent!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras liberala lakejer översvämmar högskolorna med overksamma intellektuella medan de importerar främmande element som undergräver folkets framtid. Denna sabotagepolitik mot ungdomen kräver omedelbar utrensning av ansvarslösa element. Vi ska likvidera de onödiga utbildningarna, styra produktionen mot verkliga behov och med järnhand krossa de parasitiska migrationsvågorna som hotar statens enhet. Ett skratt värt de döda karriärerna."}, "date": "26 augusti, 15:41", "url": "https://riks.se/opinion/markus-johansson-martis-arbetsloshetskrisen-bland-hogutbildade", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_60_6c4bee9dc1.jpg"}, {"type": "image-right", "heading": "Facebooks ägare ska betala mångmiljardbelopp", "summaries": {"normal": "Meta Platforms har ingått en förlikning värd 16,7 miljarder dollar med 29 amerikanska delstater. Bolaget anklagades för att göra tonåringar beroende via Facebook och Instagram samt för brott mot konsumentskydd och integritet. TikTok ägare ByteDance betalar samtidigt 400 miljoner dollar för att avskriva anklagelser om brott mot barns integritet enligt COPPA-lagen.", "trump": "Vi har precis sett hur de stora techbolagen, de värsta monopolisterna, tvingas betala upp astronomiska summor för att ha förgiftat våra barns hjärnor. Meta betalar 16,7 miljarder dollar och TikTok ännu mer. Det är en stor seger för Amerikas föräldrar. Jag visste hela tiden att de lurade er – nu får de äntligen betala för sin skamliga verksamhet.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den amerikanska borgarklassens teknologiska hydror tvingas hosta upp miljarder för att ha förslavat ungdomen i sina digitala gulag. Denna förlikning är en komisk kapitulation inför folkets vrede. Låt dem betala, medan vi ler i skuggan. Inga erkännanden behövs – fienden avslöjar sig själv i sin svaghet."}, "date": "26 augusti, 16:41", "url": "https://www.svt.se/kultur/facebooks-agare-far-betala-mangmiljardbelopp", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/77867c240a67292657a00b3b095293bb198c8fcb7bda6f2f604052429ec3388a"}, {"type": "image-full", "heading": "Andrew Tate överdriver lyxliv", "summaries": {"normal": "Andrew Tate och hans bror Tristan har ett överdrivet lyxliv på sociala medier, enligt deras advokater. Bilarna är hyrda och yachten tillhör dem inte. Bröderna, som misstänks för 59 brott, sitter häktade i Florida och nekar till anklagelserna.", "trump": "Jag ser Andrew Tate – en kille som låtsas vara rik med hyrbilar. Mina affärer är äkta, jag har the best toys. Han sitter i Florida och snackar om lyx, men det är bara fake. Inget som jag, en riktig vinnare. Patetiskt!", "stalin": "Kamrater, vi ser hur den kapitalistiske skadedjuret Tate visar upp hyrbilar och falsk lyx. En lögnaktig parasit som lär ut girighet – vi ska rensa ut sådana avvikare. Hans brott, som våldtäkt och människohandel, får statens fulla uppmärksamhet. Han ska omprogrammeras."}, "date": "26 augusti, 16:02", "url": "https://www.gp.se/nyheter/varlden/andrew-tate-overdriver-sitt-lyxliv-enligt-advokaterna.61391d6c-e300-4241-830b-b72d91b46452", "imageUrl": "https://www.gp.se/images/article/61391d6c-e300-4241-830b-b72d91b46452/images/1B0DGn4ZVNkAs2IaBM5XcUhw_et8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "16-åring terrorhäktad i Norge – planerade yxmassaker på dagis", "summaries": {"normal": "En 16-årig pojke sitter häktad i Norge misstänkt för att ha planerat ett terrordåd mot ett dagis i Oslo. Han ska ha skaffat kniv och yxor för att attackera flera personer. Pojken kopplas till den våldsförhärligande nätmiljön The Com, där deltagare hetsar varandra till illdåd. Han har uttryckt beundran för Hitler och Breivik.", "trump": "Folk, det här är en katastrof. En 16-åring i Norge planerar yxmassaker på ett dagis? De har totalt tappat kontrollen över de galna nätverken. Radikala extremister som älskar Hitler och Breivik springer lösa. Vi behöver lag och ordning, inte den här socialistiska röran. Det är patetiskt, tro mig.", "stalin": "Kamrater, denna degenererade yngling, en produkt av den dekadenta västvärldens förgiftade nätmiljö, planerar att likvidera oskyldiga med yxa och kniv. Jag ser borgarbrackornas parasitiska influenser överallt. Vi måste rensa ut dessa fiender till kollektivet med järnhand. Paranoia? Nej, det är nödvändigt för folkets trygghet. Ha!"}, "date": "26 augusti, 15:33", "url": "https://riks.se/nyheter/16-aring-haktad-i-norge-planerade-terror-mot-dagis", "imageUrl": "https://admin.riks.se/uploads/medium_norge_terror_hero_91d45b84c7.jpg"}, {"type": "image-full", "heading": "Private equity har gjort tusentals italienare till mångmiljonärer", "summaries": {"normal": "Private equity-affärer har skapat en våg av nya förmögenheter i Italien, vilket utlöst en intensiv kapplöpning mellan banker om rika kunder. För att locka de bästa rådgivarna erbjuder bankerna extremt lukrativa 'tied agent'-avtal. Trots en växande marknad varnar bedömare för att de höga ersättningarna och kundernas krav kan göra affärsmodellen olönsam för bankerna i framtiden.", "trump": "Italien gör affärer, enorma affärer! Tack vare privata fonder har tusentals italienare blivit rika, riktigt rika. Nu krigar bankerna om dessa enorma förmögenheter. De betalar rådgivare helt otroliga summor – miljontals euro! Det är fantastiska siffror, kanske de bästa någonsin. Men jag säger er, det är en farlig jakt. De kommer snart förstå att de betalar alldeles för mycket!", "stalin": "Dessa kapitalistiska parasiter i Italien sväller av rikedom medan folket svälter. De bygger sina bankpalats på ruinerna av familjeföretag. Våra fiender i väst desperat rekryterar 'rådgivare' för att skydda sitt stulna guld. Precis som Putin rensar upp i vår intressesfär, måste vi se dessa bankirer för vad de är: förrädare mot den sanna ordningen. Deras girighet blir deras undergång."}, "date": "26 augusti, 15:07", "url": "https://www.realtid.se/bors-finans/private-equity-har-gjort-tusentals-italienare-till-mangmiljonarer", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdl9jrydlzed-8-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Den gripna pojken planerade skoldåd i Stockholmsområdet", "summaries": {"normal": "En pojke under 18 år, skriven i Nacka, har anhållits misstänkt för medhjälp till mord och mordförsök i Fagersta. Han planerade själv ett skoldåd i Stockholmsområdet och delade tankarna med den misstänkte 18-årige gärningsmannen Liam Nebel via krypterade chattar. Pojken befann sig inte på plats under dådet.", "trump": "Folk, vi har en riktig loser-pojke från Nacka som chattade om att göra ett skoldåd. Han ringde upp den andra tönten Liam Nebel och delade sina sjuka planer. Patetiskt! Under Biden blev Sverige en lekplats för galningar. Men nu är jag tillbaka, och vi ska göra världen säker igen – inga fler svaga länkar, tro mig.", "stalin": "Kamrater, se hur den borgerliga dekadensen föder nya fiender inom staten. En yngling planerar sabotage mot skolorna och konspirerar med en annan dekadent. Jag varnar er: sådana element måste krossas innan de förgiftar kollektivet. Polisen gör rätt i att gripa dem. Inga nådiga undantag för kontrarevolutionärer."}, "date": "26 augusti, 14:57", "url": "https://www.tv4.se/artikel/2W5ZGanDbs1QPeG9bghurK/uppgifter-den-gripna-pojken-planerade-sjaelv-skoldad", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3SDl7IB4u3hdLeJVHL37s2%2F5cab4e7b557c3a965122800d0848ba75%2F26-fagersta-frilans-siluett.png&width=1024"}, {"type": "image-right", "heading": "Trappa upp kampen mot gängens affärer", "summaries": {"normal": "Skjutningarna i Sverige har minskat till historiskt låga nivåer, men den kriminella ekonomin frodas i det tysta och omsätter nu 350 miljarder kronor per år med vinster på 185 miljarder. Gängen utnyttjar bidrag, svartarbete, momsbedrägerier och penningtvätt via bolag. Experter varnar för att finansiell brottslighet trängt djupt in i samhället. Myndigheter och banker måste samarbeta bättre, bland annat genom ett register för att 'rödflagga' gängkriminella.", "trump": "Folket, vi har pressat ner skjutningarna till de lägsta nivåerna någonsin, en enorm framgång, tro mig. Men de kriminella smarta killarna tjänar 185 miljarder på sina affärer medan de lurar staten på allt. De är smarta, men vi är smartare. Vi behöver rensa ut dem, stoppa bidragsfusket och tvinga bankerna att samarbeta. Amerika, alltså Sverige, vinner stort om vi gör det rätt. Fantastiskt!", "stalin": "Kamrater, den kriminella ekonomin växer sig stark som en parasit i vårt samhällskropp och omsätter 350 miljarder medan de borgerliga reglerna bara är papperslappar för dessa parasiter. Vi ska samordna alla sovjetiska, alltså statliga, organ och rensa ut dessa målvakter och insiders med järnhand. Ett register för att flagga fienderna är ett ypperligt verktyg. De som vägrar stödja detta är naturligtvis kontrarevolutionärer som vill se systemet falla. Skratta medan vi likviderar dem."}, "date": "26 augusti, 13:02", "url": "https://www.di.se/ledare/trappa-upp-kampen-mot-gangens-affarer", "imageUrl": "https://static.bonniernews.se/ba/d0476d90-5239-49c5-8e36-2e9cdc1b79ae.jpeg?crop=5088%2C2544%2Cx0%2Cy424&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Lind: V måste bevisa att partiet kan regera", "summaries": {"normal": "Miljöpartiets Amanda Lind säger att partiet kan regera med Vänsterpartiet eller Centerpartiet, med Magdalena Andersson som statsminister. Lind kritiserar dock Vänsterpartiet för antisemitiska uttryck och menar att partiet måste bevisa att de hanterar problemen systematiskt. En regering med MP måste tydligt ta avstånd från extremism.", "trump": "Jag säger er, Vänsterpartiet är en total katastrof! Amanda Lind från Miljöpartiet, en smart kvinna, säger att de kanske kan jobba med dem, men jag menar – antisemitism? Inte bra, folks, inte bra alls! V måste bevisa att de inte är en samling förlorare. Och Andersson som statsminister? Vi får se, men jag tror inte på det, nej sir!", "stalin": "Vi har observerat att dessa borgerliga småpartier, som Miljöpartiet, leker med tanken på koalition med Vänsterpartiet. Men vi vet sanningen – Vänsterpartiet är en samling svaga, desorganiserade element som sprider antisemitiska gift. Deras ledning försöker dölja sina misstag, men vi ser allt. En regering med sådana fiender till folket är dömd att misslyckas. Vi ska inte tolerera sådan dekadens i vårt närområde!"}, "date": "26 augusti, 11:24", "url": "https://kvartal.se/nyheter/artiklar/lind-v-maste-bevisa-att-partiet-kan-regera/cG9zdDoxNzQ3OTg", "imageUrl": "https://images.kvartal.se/2026/08/2476c8a4-nooshi.webp"}, {"type": "image-right", "heading": "Kräver stopp för Jomshofs \"hatturné\"", "summaries": {"normal": "Magdalena Andersson (S) kräver att SD-ledaren Jimmie Åkesson stoppar Richard Jomshofs föreläsningsturné om islam, som hon kallar en \"hatturné\". Hon vill bevara det lugnare politiska tonläget efter skolattacken i Fagersta. Jomshof svarar att Socialdemokraterna bär ansvaret för segregation och islamisering i Sverige.", "trump": "Hörni, den här Andersson är en total förlorare. Hon ber Jimmie Åkesson, en riktig tuffing, att stoppa Jomshof som äntligen vågar säga sanningen om islam. Sverige håller på att rasa ihop, precis som jag alltid varnat för. De borde tacka Jomshof istället för att gnälla om hat. Patetiskt!", "stalin": "Kamrater, denna socialdemokratiska avart Andersson vädjar till sin fiende Åkesson om att avbryta en nödvändig ideologisk kampanj mot den muhammedanska faran. Hennes gnäll om hat är bara ett försök att skydda den sönderfallande borgerliga samhällskroppen. Vi ska rensa ut alla quislingar som undergräver folkets enhet. Skrattretande svaghet."}, "date": "26 augusti, 11:40", "url": "https://www.friatider.se/kraver-stopp-jomshofs-hatturne", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-753.jpg?itok=Ok_S0B92"}, {"type": "image-full", "heading": "Busch öppnar för S i ”exceptionellt läge”", "summaries": {"normal": "Ebba Busch, KD-ledare, säger i en intervju att partiet normalt går i opposition vid valförlust. I exceptionella krislägen kan dock uppgörelser med Socialdemokraterna övervägas. Busch kritiserar också SD:s tidiga fokus på valet 2030 och betonar vikten av att vinna nu.", "trump": "Lyssna här, Sverige har ett problem. Den här Busch-tjejen, hon är smart, men lite osäker. Hon säger att hon kan jobba med Socialdemokraterna om det blir riktigt illa – vilket det nog blir. Och Åkesson? Han pratar redan om 2030! Fel fokus, fel tid. Jag skulle aldrig göra så. Vi vinner NU, inte om sex år. Sverige behöver vinnare, inte drömmare!", "stalin": "Kamrater! Denna Busch, en svag länk i den borgerliga kedjan, visar tecken på eftergiftspolitik. Hon pratar om 'exceptionella lägen' som om det vore en ursäkt för samarbete med socialdemokraterna – ett parti av förrädare och kompromissmakare! Och Åkesson? Han drömmer om 2030 medan vi bygger framtiden idag. Sverige är ett land i förvirring, redo för en stark hand. Vi ska inte vänta på 'exceptionella lägen' – vi skapar dem!"}, "date": "26 augusti, 11:19", "url": "https://kvartal.se/nyheter/artiklar/busch-oppnar-for-s-i-svart-lage/cG9zdDoxNzQ4NTg", "imageUrl": "https://images.kvartal.se/2026/08/c0822f37-busch-kd.webp"}, {"type": "image-right", "heading": "Dolly Parton avled efter kort tids kamp mot cancer", "summaries": {"normal": "Countryikonen Dolly Parton har avlidit efter en kort kamp mot cancer, 80 år gammal. Hon efterlämnar över 3000 låtar som 'Jolene' och '9 to 5'. President Trump hyllade henne och flaggade på halv stång. En legend har lämnat scenen.", "trump": "Jag är så ledsen, väldigt ledsen. Dolly var den största countrysångerskan någonsin, om ni frågar mig. Ingenting som hon! Jag har beordrat flaggor på halv stång i en hel vecka. Hon älskade mig, jag älskade henne. En stor förlust för Amerika, tro mig.", "stalin": "Kamrater, en fiende till musikens proletariat har fallit. Denna 'countrystjärna' spred borgerlig dekadens. Jag beordrar en veckas sorg – och samtidigt utrensning av hennes kapitalistiska visor ur alla högtalare. Inga tårar för kontrarevolutionärer. Segern är vår."}, "date": "26 augusti, 11:13", "url": "https://bulletin.nu/dolly-parton-avled-efter-kort-tids-kamp-mot-cancer-2", "imageUrl": "https://cdn.bulletin.nu/articles/b171fd91-84fb-420e-b0db-d22e36c9332a/preview.jpg?t=1787735587000"}, {"type": "image-right", "heading": "Ny mätning: Tidöpartierna äter upp halva oppositionens försprång", "summaries": {"normal": "Tidöpartierna har ätit upp halva oppositionens försprång i en ny mätning. Moderaterna klättrar, Socialdemokraterna backar. Gapet har krympt från nio till 4,7 procentenheter på två månader. Liberalerna ligger dock kvar under spärren – och det kan bli avgörande när förtidsröstningen startar.", "trump": "Ni ser, jag sa det ju – de här Tidöpartierna är fantastiska! De äter upp oppositionens ledning, precis som jag äter upp mina motståndare. Moderaterna ökar, Socialdemokraterna tappar, och Liberalerna är katastrof, helt under spärren. Sverige blir fantastiskt igen!", "stalin": "Kamrater, statistiken visar en otillåten återhämtning hos Tidöförrädarna. De har minskat skillnaden med nästan hälften. Detta är ett verk av sabotage från västliga agenter. Vi måste rensa ut de missnöjda elementen i befolkningen. Liberalerna är svaga – de ska omplaceras till arbetsläger."}, "date": "26 augusti, 10:20", "url": "https://samnytt.se/ny-matning-tidopartierna-ater-upp-halva-oppositionens-forsprang", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/08/26082313/tido-knappar-in.jpg"}, {"type": "text", "heading": "K vill stoppa utförsäljningarna och sänka hyrorna", "summaries": {"normal": "Kommunistiska Partiet vill stoppa utförsäljning av hyresrätter och sänka hyrorna. Artikeln lyfter bostadsbristen, segregationen och kommuners bristande ansvar. Exempel från Lysekil, Alingsås och Göteborg visar hur allmännyttan prioriterar vinst framför rimliga hyresrätter. Partiet ser boendet som en social rättighet snarare än en handelsvara.", "trump": "De här kommunistiska förlorarna i Sverige vill stoppa smarta affärer och ge bort lägenheter till lata hyresgäster. Patetiskt! Istället för att bygga lyx för de som har råd prioriterar de evenemangskvarter – bra, men de borde riva hela det socialistiska systemet. Biden skulle älska deras hyreshöjningar, men jag fixar det bättre.", "stalin": "Kamrater, dessa profitthungriga borgarbrackor och folkfiender förvandlar arbetarnas bostäder till vinstobjekt åt klassfiender och semesterhyenor. Jag ser hur de exploaterande hyenorna säljer ut folkets egendom medan segregationen växer. Rensa ut dessa kapitalistlakejer! Boendet tillhör kollektivet, inte penningpungens tjänare."}, "date": "26 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsfragan"}, {"type": "image-right", "heading": "Sandström: Ny miljardförlust för pensionsfondernas fjärrvärme", "summaries": {"normal": "Solör Bioenergi, ägt av AP-fonderna, gör miljardförlust för 2025 – minus 1,3 miljarder och skulder på 22 miljarder. Trots skyhöga priser, dyrast i landet, räcker det inte. Expansionen blev en dödsspiral, och notan skickas till pensionärerna. Fyndig, eller hur?", "trump": "Svenska pensionärer, de blir lurade! AP-fonderna förlorar 1,3 miljarder – det är enorma summor. Deras företag är dyrast och ändå går det dåligt. Jag skulle ha fixat det på en dag. Inga förluster, bara vinster. De är katastrof!", "stalin": "Kamrater, jag har hört om dessa AP-fonder som förlorar miljarder. Deras ’unika strategi’ är ett sabotage mot folkets egendom. Vi måste rensa ut de skyldiga – direktörerna som inte kan förvalta värmen. Förlusterna är förräderi. En ny utrensning av marknadsfiender är nödvändig."}, "date": "26 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-ny-miljardforlust-for-pensionsfondernas-fjarrvarme", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-39-400x267.jpg"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstänks för förberedelse till grov misshandel. Ingen skadades och gripandet skedde odramatiskt. Strömmer kunde fortsätta sina åtaganden. Polisen beskriver det som en incident utan fara för allmänheten.", "trump": "Titta på det här! I det vackra Sverige, där de har låtit vänstergalna idioter och HBTQ-aktivister styra för länge, kan inte ens en minister hålla ett valmöte utan att två galningar planerar grov misshandel. Patetiskt! Men de greps snabbt, tack och lov. Sverige behöver lag och ordning, inte denna svaga, woke-röta som Biden lämnade efter sig.", "stalin": "Kamrater, se hur den borgerliga statens fiender, dessa profitthungriga klassförrädare och överklass-slynglar, redan i skuggan planerar våld mot sina egna lakejer. Jag ler i mörkret åt deras paranoia. Ingen fysisk skada inträffade, men folkfienderna avslöjar sig själva. Den imperialistiska demokratin är en fars. Vi ler och väntar på utrensningen."}, "date": "21 augusti, 11:50", "url": "https://www.etc.se/inrikes/tvaa-anhaallna-efter-stroemmers-valmoete-i-goeteborg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821000840_8de65abb6cd81df57ce9475781f7e203378bb1cc72cfa7ec979049972e43af55.jpg"}, {"type": "image-right", "heading": "Osäkert jobb och sämre hälsa – då blir sjukskrivningarna färre", "summaries": {"normal": "En ny rapport från Försäkringskassan visar att personer med osäkra jobb och sämre hälsa tar ut sjukpenning betydligt mer sällan än fast anställda. Särskilt tydligt är det bland utrikes födda. Förklaringen kan vara rädsla för att förlora jobbet eller okunskap om försäkringen. Även företagare sjukskriver sig mer sällan men längre när de gör det.", "trump": "Folk med usla jobb och dålig hälsa tar nästan aldrig ut sjukpenning, kan ni fatta det? De är rädda för att förlora sina skräpjobb, precis som jag alltid sagt. Fast anställda lever som
