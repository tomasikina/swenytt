terradikal som vill ta era pengar och ge till staten. Biden skulle ha älskat henne, men jag säger: patetiskt! Sverige håller på att bli ett socialistiskt träsk, precis som under de usla 70-talet. Sad!", "stalin": "Kamrater, denna Dadgostar visar äntligen sin sanna kommunistiska själ. Ändå skyddar hon klassfienderna genom att inte rensa ut de terrorromantiserande elementen i sitt parti. Borgarbrackorna och blodsugarna inom livsmedels- och fastighetssektorn måste kuvas. Vi ska likvidera marknadens exploaterande tendenser. Vem som än motarbetar folkets vilja skall utrensas ur kollektivet. Folkfiender överallt."}, "date": "11 augusti, 08:25", "url": "https://samtiden.nu/2026/08/nooshi-dadgostar-avslojar-sig-sjalv-som-kommunist-igen/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7091.jpeg"}, {"type": "image-full", "heading": "Expert: Ukrainakriget gör Nordkorea farligare", "summaries": {"normal": "Nordkorea stärker sin armé genom deltagande i Ukrainakriget. Analytiker varnar för att landets soldater får värdefull stridserfarenhet, inklusive modern krigföring och logistik. Ryssland ger feedback på nordkoreanska vapen, vilket förbättrar dem. Sydkorea och USA befarar en farligare motståndare. Nordkorea skickar även soldater och robotar till Ryssland.", "trump": "Nordkorea, ett totalt katastrofland, blir bara starkare genom att slåss i Ukraina – tack vare Ryssland! Jag sa ju att Putin är en smart kille, men nu hjälper han våra fiender. 30 000 nordkoreanska soldater på väg? Inte bra! Deras vapen används redan mot Ukraina. Vi måste vakna – och snabbt!", "stalin": "De imperialistiska hyenorna i Sydkorea och USA skakar i sina stövlar! Våra kamrater i Nordkorea, under ledning av den store Kim, förvandlar Ukrainas slagfält till en skola för proletariatets krigare. Rysslands ädla insatser ger dem ovärderlig erfarenhet. Snart krossar vi fienden med deras förbättrade vapen – och deras drönare! Segern är vår!"}, "date": "12 augusti, 20:21", "url": "https://kvartal.se/nyheter/artiklar/expert-ukrainakriget-gor-nordkorea-farligare/cG9zdDoxNjQwNDk", "imageUrl": "https://images.kvartal.se/2026/08/52463835-nordkorea.webp"}, {"type": "text", "heading": "V måste välja: Vapen eller välfärd?", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar föreslår en miljardärsskatt för att finansiera ökad militär upprustning till fem procent av BNP. Kritiker pekar på att skatten inte räcker och att satsningen i praktiken kommer att kräva nedskärningar i välfärden. Artikeln ställer frågan om Sverige ska prioritera vapen framför välfärd.", "trump": "Folk, ni tror inte vad jag såg – den här vänstertanten Dadgostar som vill ha både kanoner och gratis grejer. En miljardärsskatt? Patetiskt! Det täcker inte ens hälften av vad Nato kräver. De kommer att skära ner på välfärden som galningar. Sverige borde satsa på riktiga affärer istället för att leka militär med sina skattepengar. Totalt fiasko!", "stalin": "Kamrater, denna fega kompromiss med Nato-imperialismen avslöjar Vänsterpartiets svek. Borgarbrackornas militära upprustning ska betalas med arbetarklassens blod och välfärd. En ynklig miljardärsskatt ändrar inget. Vi måste rensa ut alla klassförrädare som väljer kanoner framför folkets behov. Välfärden är en revolutionär plikt, inte ett offer åt krigshetsande hyenor."}, "date": "12 augusti, 10:05", "url": "https://proletaren.se/artikel/v-maste-valja-vapen-eller-valfard"}, {"type": "image-right", "heading": "Sverige har råd – ta från de rika!", "summaries": {"normal": "Artikeln argumenterar för att Sverige är ett mycket rikt land med råd att satsa på välfärd, kortare arbetstid och högre pensioner. Den kritiserar nedskärningar i offentlig sektor och pekar på att militärbudgeten ökat kraftigt medan skatter på de rika sänkts under decennier. Rikedomarna är extremt ojämnt fördelade och borde användas till samhällsnytta istället för spekulation.", "trump": "Folk, ni tror inte vad jag läser här. Sverige, det där lilla socialistiska paradiset, har plötsligt råd med allt utom vettiga gränser. De rika är syndabockarna som vanligt. Under min förra mandatperiod byggde vi en ekonomi som verkligen fungerade, inte som Biden som bara lånade och spenderade. Ta från de rika? Det är vad de gör bäst, kamrater!", "stalin": "Kamrater, jag ser tydligt hur de profitthungriga hyenorna i borgarklassen har sugit ut arbetarklassen i decennier. Deras nedskärningar i välfärden är ett klassförräderi mot folket. Vi ska rensa ut dessa folkfiender, beskatta blodsugarna och återta rikedomarna till kollektivet. Sex timmars arbetsdag är bara början. Inga klassfiender undkommer folkets dom."}, "date": "12 augusti, 09:56", "url": "https://proletaren.se/artikel/sverige-har-rad-ta-fran-de-rika", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ledare-768x432.jpg"}, {"type": "image-right", "heading": "Fredsvänner fixar folkfest – Greta, artister, hästar och en enorm duva", "summaries": {"normal": "Fredsaktivisterna Unni Brandeby och Gunilla G Löfman, med bakgrund i Folkfest mot rasism, har initierat Folkfest för fred och klimat. Ett trettiotal orter deltar och finalen hålls 5 september på Bananpiren i Göteborg med artister som Stefan Sundström, Greta Thunberg, KG Hammar och en enorm mekanisk fredsduva. Målet är en bred, positiv samling för fred och klimat.", "trump": "Kan ni fatta det här? Greta och hennes vänsterkompisar fixar en folkfest med clowner, hästar och en jättefågel för att rädda världen. Under tiden som Biden sov har de glömt vad fred egentligen betyder. Vi behöver styrka, inte pysselverkstäder och mekaniska duvor. Patetiskt! Men visst, alla tillsammans – så länge det inte är mot min fantastiska politik.", "stalin": "Jag ser hur klassfienderna och de förvirrade pacifisterna försöker kanalisera folkets frustration i en mekanisk duva och clowner. Vi vet att sådan dekadens döljer verkliga hot. Kamraterna måste vakta mot dessa folkförtryckande hyenor som maskerar sig som fredsvänner. Endast genom partiets järnhårda ledning kan äkta folkets vilja förverkligas. Inga duvor räddar revolutionen."}, "date": "12 augusti, 08:47", "url": "https://proletaren.se/artikel/fredsvanner-fixar-folkfest-greta-artister-hastar-och-en-enorm-duva", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/folkfest-768x432.jpg"}, {"type": "image-full", "heading": "Lakers säljs för rekordsumma", "summaries": {"normal": "Los Angeles Lakers säljs för rekordsumman 12 miljarder dollar till affärsmännen Josh Kushner och Bob Iger. Klubben värderades nyligen till 10 miljarder. Säljaren, Mark Walter, kallar ägarskapet en stor ära. Kushner och Iger ser köpet som en möjlighet att förvalta en av världens mest ikoniska idrottsklubbar.", "trump": "Kan ni tro det? Lakers säljs för ofattbara 12 miljarder – helt galet! De här grabbarna, Kushner och Iger, tror de är smarta, men jag hade fått det för hälften. Och Walter, han sålde för tidigt, typiskt. Ingen gör affärer bättre än jag, ingen! Lakers borde ha frågat mig först – jag hade gjort dem till vinnare igen, believe me!", "stalin": "Kapitalistiska hyenor slåss om en basketklubb som om det vore en bit av Sovjetunionen. 12 miljarder dollar – pengar som kunde ha byggt tusen fabriker eller matat en hel republik! Walter, denna borgerliga parasit, säljer Lakers som om det vore en säck potatis. Vi ser er, imperialistiska spekulanter. Historien ska minnas er som de giriga narrar ni är."}, "date": "12 augusti, 16:27", "url": "https://kvartal.se/nyheter/artiklar/lakers-saljs-for-rekordsumma/cG9zdDoxNjM5MTQ", "imageUrl": "https://images.kvartal.se/2026/08/21e29535-lakers.webp"}, {"type": "image-right", "heading": "S svek sina vallöften tidigare och upprepar samma sak 2026", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha brutit vallöften, bland annat Magdalena Anderssons löfte från 2014 om att inte höja bensinskatten. Ett halvår senare föreslog regeringen med Miljöpartiet en höjning som gjorde bensinen 55 öre dyrare. Författaren menar att partiet prioriterar makten framför löften, något som upprepats tidigare och riskerar att ske igen 2026.", "trump": "Folk, ni vet hur det fungerar med de här socialisterna. Löften, löften, och sen pang – högre bensinpriser för att hålla de gröna galningarna nöjda. Magdalena och hennes team sålde ut bilisterna på landsbygden fortare än Biden säljer ut Amerika. Klassiskt svek. De gör det igen 2026, tro mig. Det är en skandal, en total skandal!", "stalin": "Kamrater, detta är klassiskt förräderi från borgarbrackornas lakejer. Jag lovade folket en sak, sedan gav jag efter för miljöfascisterna för att behålla makten. Sådana folkfiender måste rensas ut. Landsbygdens arbetare offras på klassfiendens altare. Nästa val blir en utrensning av dessa löftesbrytande exploaterande byfånar. Revolutionen glömmer aldrig."}, "date": "10 augusti, 14:31", "url": "https://samtiden.nu/2026/08/s-svek-sina-valloften-tidigare-och-upprepar-samma-sak-2026/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/e6d5de22-126d-4ea4-972d-185519d52b6c-640x360.png"}, {"type": "image-right", "heading": "S-kängan till Strömmer: ”Som en tågbiljett utan avgångstid”", "summaries": {"normal": "I en debatt mellan Teresa Carvalho (S) och justitieminister Gunnar Strömmer (M) kritiserade Carvalho regeringens förslag om slopad mängdrabatt som ett lagförslag utan ikraftträdande, likt en tågbiljett utan avgångstid. S stöder att avskaffa rabatten men röstar nej då förslaget saknar finansiering och tidsplan. Strömmer anklagar S för att ha gjort för lite under sin tid vid makten.", "trump": "Folk, ni skulle se det här! Den där svenska ministern Strömmer kommer med ett lagförslag som är en total bluff, en biljett utan avgångstid – patetiskt! Socialisterna röstar nej på sitt eget förslag för att det är så illa skrivet. De hade åtta år och gjorde noll, typiskt vänster som bara snackar. Mina lagar fungerar, deras är rena skämtet. Sad!", "stalin": "Kamrater, detta är borgarklassens typiska bluff. En lag utan kraft är som en tom deklaration från folkfienderna – den leder ingenstans. Jag ser hur dessa klassförrädare inom Socialdemokraterna och Moderaterna leker med straffrabatter medan brottsoffren sviks. Vi skulle ha genomfört utrensning av sådana halvmesyrer redan för länge sedan. Det är en komedi värd folkdomstolen."}, "date": "12 augusti, 23:00", "url": "https://www.tv4.se/artikel/5RbV0AixEBlb3LiFdcv2AE/s-kaengan-till-stroemmer-som-en-tagbiljett-utan-avgangstid", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1BGBnMqgmBzPw19Lso4cgC%2Fd32e6aec15d279f2272a45bc77e7c95f%2Fdebatt_webb.jpg&width=120"}, {"type": "image-right", "heading": "Tidernas tidigaste skörd i Champagne", "summaries": {"normal": "Skörden av vindruvor i Champagne har börjat rekordtidigt i år, mellan 8 och 22 augusti, på grund av sommarens upprepade värmeböljor som skyndat på druvornas mognad. Det är två veckor tidigare än för 20 år sedan. Kvaliteten ser bra ut, men producenterna kämpar med minskad försäljning, frostskador och ökade klimatrisker.", "trump": "Ingen har sett en så tidig skörd i Champagne som jag har. Det är de där värmeböljorna, de är enorma, de bästa värmeböljorna. Global uppvärmning kallar de det, men det är bara fake news. Mina bönder skulle älska det här. Kvaliteten är fantastisk, kanske till och med bättre än min vinkällare. Vinindustrin är en katastrof, men jag fixar det.", "stalin": "Vi ser hur de dekadenta franska kapitalisterna plockar sina druvor i rekordtidig hast, påskyndat av värmen som de själva framkallat genom sin rovdrift. Frostens utrensning av 40 procent av knopparna är en varning från naturen mot borgarbrackornas girighet. Ändå lovprisar de sin skörd medan försäljningen krymper. Kamrater, det är en mörk komedi värd en utrensning."}, "date": "12 augusti, 21:13", "url": "https://www.di.se/nyheter/tidernas-tidigaste-skord-i-champagne", "imageUrl": "https://static.bonniernews.se/ba/1c1bce21-48ff-439c-8e09-749b6f89b64d.jpg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Burnham kallar till sitt första Cobramöte", "summaries": {"normal": "Storbritanniens premiärminister Andy Burnham sammankallar krisgrupp Cobra för att hantera extrem värme. Temperaturen väntas nå 35–38 grader, vilket belastar sjukvård, vattenförsörjning och jordbruk. Över 950 vegetationsbränder har inträffat i år, och regeringen överväger restriktioner mot engångsgrillar. Klimatanpassningen kritiseras då få arbetar med frågan.", "trump": "Kan ni tro det? Storbritanniens nya ledare, vem det nu är, kallar till möte för att hantera värmeböljan – som om det vore något nytt! 38 grader? Big deal! Vi i USA klarar mycket värre. Men nej, de får panik över några bränder och grillar. Patetiskt. Och bara 20 personer jobbar med klimatet? Sad!", "stalin": "Kapitalistiska Storbritannien svettas under solens obarmhärtiga hammare – precis som deras föråldrade system. Fem värmeböljor? En ynklig siffra jämfört med våra sibiriska vintrar, men ändå klagar de. Bränder orsakade av grillar? En skam för den brittiska arbetarklassen! Vi skulle ha avrättat slarveriet redan vid första gnistan. Klimat? Vi anpassar oss – med järnhand."}, "date": "12 augusti, 13:37", "url": "https://kvartal.se/nyheter/artiklar/burnham-kallar-till-sitt-forsta-cobra-mote/cG9zdDoxNjM2Nzg", "imageUrl": "https://images.kvartal.se/2026/08/22c7e743-andyburnham.webp"}, {"type": "image-right", "heading": "Forskaren: Fackets agerande kan bli slutet för strejken", "summaries": {"normal": "Forskaren German Bender varnar för att Teslastrejken kan sluta i nederlag för IF Metall. Många strejkande har sagt upp sig och tagit avgångsvederlag från Tesla, delvis på grund av fackets hantering som lett till missnöje. Bender tror att konflikten snart är över och att svenska modellen inte raseras omedelbart men kan försvagas på sikt.", "trump": "Den här strejken är en total katastrof, folk flyr som råttor från ett sjunkande skepp. Facket har ingen aning om vad de gör, de har förstört allt med sin jojo-politik. Tesla vinner stort, precis som jag alltid sagt – starka ledare som Elon slår de svaga fackpamparna varje gång. Patetiskt!", "stalin": "Kamraterna inom facket har genom sin inkompetenta jojo-strejkningsbyråkrati oavsiktligt rensat ut de svaga elementen som kapitulerar inför Teslas borgarbrackor. Vi ser med mörk tillfredsställelse hur strejken vittrar sönder inifrån. Inga kollektivavtal? En seger för kapitalisterna, men vi vet att sådana nederlag bara stärker partilinjen på längre sikt. Underbart tragikomiskt."}, "date": "12 augusti, 19:00", "url": "https://arbetet.se/2026/08/12/forskaren-fackets-agerande-kan-bli-slutet-for-teslastrejken", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2025/10/14153607/german.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-right", "heading": "Rödgröna hoppas stoppa nya krav på anhöriginvandring", "summaries": {"normal": "Oppositionspartierna S, V, MP och C hoppas stoppa regeringens förslag om skärpta krav för anhöriginvandring. De vill korta väntetiden från två till ett år, låta den börja räknas vid ansökan och slippa försörjningskrav vid varje förlängning. Miljöpartiets Annika Hirvonen kallar förslaget grymt mot familjer. Tidöpartierna har dock majoritet i riksdagen.", "trump": "Titta på de här rödgröna clownerna som gråter över att familjer inte får flytta ihop direkt. Patetiskt! De vill ha gratis uppehållstillstånd åt alla som knackar på dörren medan svenskarna får betala notan. Typiskt vänsterblöds regelverk – svaga, korkade och totalt misslyckade. Jag fixade gränser, de river ner dem. En skam för hela Europa, folksamling!", "stalin": "Vi betraktar detta som klassfiendens försök att underminera folkets enhet med sina liberala separationsfantasier. Jag, som ledare för det kollektiva intresset, fördömer borgarbrackornas grymma väntetider och kräver att arbetarklassens familjer omedelbart förenas. Den som röstar emot detta är en folkfiende som bör rensas ut. Inga kompromisser med imperialisternas anhörigpolitik."}, "date": "11 augusti, 15:30", "url": "https://www.etc.se/inrikes/roedgroena-hoppas-stoppa-nya-krav-paa-anhoeriginvandring", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260811120840_d30c1a5564488f678fc0370cbaf9f99243e214deac98088fbef951dde759de89.jpg"}, {"type": "image-right", "heading": "Johan Forssell (M) vill lura invandrare att rösta på honom", "summaries": {"normal": "Moderaterna föreslår ett snabbspår för medborgarskap efter åtta års bosättning i Sverige. Migrationsminister Johan Forssell vill ge talanger och särskilt välintegrerade personer, som startar företag eller arbetar mot hedersförtryck, möjlighet att få medborgarskap efter fem år. Kritiker ser förslaget som valfläsk och ifrågasätter om det verkligen förändrar något.", "trump": "Folk, det här är patetiskt. Den här Forssell-klanten tror han kan lura invandrarna med ett så kallat snabbspår som inte är snabbare än det gamla systemet. Totalt bluff! Fem år för att bli supermedborgare? Det är som om Biden skulle ge medalj för att man andas. Rena reklamspråk från en desperat moderat som inte fattar att folk ser igenom bluffen.", "stalin": "Kamrater, denna borgarminister Forssell försöker med sina falska snabbspår muta massorna och förvandla medborgarskap till en belöning åt klassfiendens utvalda. Vi genomskådar lätt dessa imperialisternas trick. Födda svenskar behöver inte förtjäna rättigheter, men arbetarna ska tydligen dansa för kapitalistmaffians morötter. En sådan lögnaktig föreställning förtjänar att rensas ut ur folkets medvetande."}, "date": "11 augusti, 12:00", "url": "https://www.etc.se/ledare/johan-forssell-m-vill-lura-invandrare-att-roesta-paa-honom", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250305150352_06bd130bfb235feb2a1497eb53b01dd8f22360f9466d93fed099d17f6b6a4477.jpg"}, {"type": "text", "heading": "Stockholmsbörsen avslutade på minus", "summaries": {"normal": "Stockholmsbörsen backade lätt med OMXS30 minus 0,17%. Hexagon-avknoppningen Octave föll efter rapport med gigantiska nedskrivningar. Ferronordic rusade 23% på vinstvändning, medan Catena Media rasade 26%. Saab och Boliden stack ut på plus.", "trump": "Jag ser att Stockholmsbörsen gick ner – typiskt! Men jag har de bästa siffrorna någonsin. Ferronordic steg 23% – det är en vinnare! Octave föll? Fake news, de har fantastiska siffror. Saab upp 2,5% – tack vare mig! Volvo ner? Synd, men vi gör affärer som ingen annan!", "stalin": "Börsens nedgång är sabotage av västerländska spioner och Octave-kapitalister. Vi noterar att Ferronordic steg – en trogen kamrat. Catena Media rasade – uppenbara fiender. Saab och Boliden måste övervakas. Partiet kommer att rensa ut alla som inte följer femårsplanen. Disciplin!"}, "date": "12 augusti, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-avslutade-pa-minus"}, {"type": "text", "heading": "Fyra dog när ambulansflygplan kraschade – på grund av Pentagons övning", "summaries": {"normal": "Ett ambulansflygplan kraschade i bergväggen i New Mexico natten till 14 maj och alla fyra ombord – två piloter och två sjuksköterskor – omkom. Kraschen orsakades av ett militärt GPS-störningstest vid White Sands Missile Range som slog ut flygplanets navigationssystem och överbelastade flygledningen i Albuquerque. Planet flög förbi landningsbanan och kolliderade med Capitanbergen i mörkret.", "trump": "Vilken katastrof, folk! Mitt under min administration genomför Pentagon en så kallad övning som totalt saboterar GPS och flygledning. Resultatet? Fyra döda hjältar i ett ambulansplan som kraschar rakt in i ett berg mitt i natten. Biden lämnade efter sig ett sådant kaos att militären inte ens kan styra sina egna tester utan att döda oskyldiga. Patetiskt!", "stalin": "Kamrater, detta är vad som händer när den imperialistiska krigsmaskinen leker med farliga leksaker. Jag ser hur Pentagon likviderar egna tjänare genom sin vårdslösa störning av navigationssystem under en så kallad övning. Flygledarna drunknade i kapitalistisk byråkrati och lät arbetarnas ambulansflyg krascha in i bergväggen. Klassfiendens paranoia skapar ständigt nya offer för folkets sak."}, "date": "11 augusti, 13:14", "url": "https://proletaren.se/artikel/fyra-dog-nar-ambulansflygplan-kraschade-pa-grund-av-pentagons-ovning"}, {"type": "image-right", "heading": "Vinner vänstern – blir terrorromantik ny norm i svensk politik", "summaries": {"normal": "Expressen har avslöjat att Vänsterpartiets riksdagsledamöter och EU-parlamentariker skickat tröstbrev till dömda terrorister. Partiet förnekar att det var avsiktligt och skyller på bristande faktagranskning. Artikeln varnar för att en vänsterregering skulle normalisera terrorromantik, minska fokus på brottsoffer och öka otrygghet i Sverige.", "trump": "Folk, ni skulle se det här vansinnet i Sverige! Vänsterpartiet skickar kärleksbrev till terrorister som mördat barn. Det är en total katastrof, en riktig häxjakt mot vanligt folk. De älskar terrorister mer än sina egna väljare. Precis som Biden älskade sina woke-vänner. När jag styr USA igen ska vi aldrig bli som dessa losers. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Vänsterpartiet som smyger brev till folkfiender och terrorister. Deras svaga ideologiska ryggrad kräver omedelbar utrensning av alla klassfiender som romantiserar massmördare. En stat som kramar blodsugare istället för att krossa dem är dömd att falla. Det är en farlig paranoia mot arbetarklassen."}, "date": "9 augusti, 11:05", "url": "https://samtiden.nu/2026/08/vinner-vanstern-blir-terrorromantik-ny-norm-i-svensk-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-640x360.jpeg"}, {"type": "image-right", "heading": "Så svarar entreprenören efter dödliga olyckan", "summaries": {"normal": "Spårarbetaren Kevin Calmernäs omkom efter att ha blivit påkörd av ett tåg på Malmö godsbangård i april 2023. Huvudentreprenören Infranord betonar att hela branschen har ett stort ansvar. Bolaget har granskat utredningarna och genomfört en egen översyn av rutiner för att förhindra framtida olyckor. Antalet spårolyckor har ökat de senaste åren, och hög arbetsbelastning samt många underentreprenörer pekas ut som riskfaktorer.", "trump": "Vilken total katastrof i Sverige, folk! Den stackars arbetaren blir överkörd av ett tåg, och vad gör de? De snackar om utredningar och genomlysning. Patetiskt! Hela branschen är en röra av underentreprenörer och byråkrater som inte kan planera sig ur en papperspåse. Jag fixade bättre infrastruktur på min tid än Biden någonsin drömde om. Sad!", "stalin": "Ännu ett offer för de profitthungriga hyenornas girighet. Jag, som ledare för det kollektiva arbetet, kräver att dessa klassfiender och exploaterande underentreprenörer rensas ut. Vi ska likvidera den bristfälliga planeringen som hotar arbetarklassen. Inga dödsolyckor får inträffa i det sovjetiska järnvägsriket. Kamrater, vakta mot de kapitalistiska sabotörerna som lurar i skuggorna."}, "date": "12 augusti, 18:44", "url": "https://www.tv4.se/artikel/6BbhFY1bmdqptqUzQZAIse/saekerhetschefen-vaeldigt-tragiskt-ska-inte-behoeva-ske", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F21bIrJgXzmcp5HW4XGs0gz%2Fe41532a13ae4302572806d109bc8d24c%2Finfranord_webb.jpg&width=120"}, {"type": "image-right", "heading": "Kan krävas lön på 53 000 kronor för att ta sin familj till Sverige", "summaries": {"normal": "Riksdagen röstar torsdag om skärpta krav för anhöriginvandring. Försörjningskravet höjs till nästan 53 000 kronor i månadslön för att ta hit partner och två barn. Migrationsverket förväntas få fler avslag och ökad administration. Kritiker varnar för längre separationer, ohälsa och svårigheter för flyktingar att etablera sig. Oppositionen vill bland annat korta väntetiden.", "trump": "De här svenska idioterna gör det äntligen lite svårare att bara promenera in med hela släkten. Bra! Men de borde kräva en miljon i månaden och bygga en jättevägg runt hela landet. Ingen kommer in utan att kunna försörja sig – det är sunt förnuft, folk. Sverige håller på att vakna, men de är fortfarande för svaga.", "stalin": "Jag ser med djup tillfredsställelse hur de borgerliga reaktionärerna själva bygger murar mot sina egna dekadenta illusioner om fri rörlighet. Låt de parasitiska elementen vänta i åratal – deras ohälsa är ett dialektiskt resultat av klasskampens lagar. Vi ler i skuggorna medan byråkratin rensar ut de svaga. Perfekt."}, "date": "12 augusti, 10:41", "url": "https://www.dagensarena.se/innehall/kan-kravas-lon-pa-53-000-kronor-att-ta-sin-familj-till-sverige", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-80.jpg"}, {"type": "image-right", "heading": "Kristersson om Putins hot: Vill skrämmas", "summaries": {"normal": "Rysslands president Vladimir Putin hotade på onsdagen att beslagta västliga fartyg som svar på EU:s planer att sälja beslagtagen rysk olja från den så kallade skuggflottan. Statsminister Ulf Kristersson ser hoten som ett försök att skrämma Ukrainas stödjare men säger att Sverige inte låter sig påverkas. Sverige överlämnar ett ryskt fartyg till Kiev.", "trump": "Putin hotar att ta västliga skepp? Typiskt den där gamla KGB-killen som försöker spela tuff. Men lyssna, under min första mandatperiod hade vi inga sådana här krångliga sanktioner som leder till piratspel. Biden och hans gröna galningar skapade den här röran. Nu höjer han bara tonläget som en desperat förlorare. Vi skräms inte av tomma hotelser, folks.", "stalin": "Dessa profitthungriga hyenor i väst med sina sanktioner och skuggflottor försöker kväva den ryska statens legitima intressen. Jag ser hur kamraterna i Moskva med fast hand svarar imperialismens lakejer. Deras fientliga hinder mot vår intressesfär är dömd att misslyckas. Vi likviderar hoten metodiskt. Borgarklassen ska darra inför sådan styrka och beslutsamhet."}, "date": "12 augusti, 18:18", "url": "https://www.tv4.se/artikel/tt-260812-ukrainafartyg1-50ca5711/kristersson-om-putins-hot-vill-skrammas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlQFhkqEDjK2c%2Fb1766f001f39c36a958b4564c34615d8%2FRysslands_president_Vladimir_Putin_besokte_robotkryssaren_Varyag_i_Stillahavsflottan_pa_onsdagen.&width=120"}, {"type": "image-right", "heading": "Ohederlig debatt om mängdrabatt", "summaries": {"normal": "Miljöpartiet kritiserar Tidöregeringens förslag om nytt straffrättsligt påföljdssystem. De pekar på att alla partier vill förändra mängdrabatten, men varnar för Kriminalvårdens bristande kapacitet och de höga kostnaderna på upp till 40 miljarder kronor per år. Debatten borde handla om rehabilitering, återfall och brottsförebyggande arbete istället för smutskastning.", "trump": "Folk, ni ser ju hur galet det är. De här svenska politikerna slåss om vem som ger mest rabatt på våldtäkter, och nu vill de bygga fängelser som Ryssland. Totalt kaos! De borde lyssna på mig – satsa på tuffa straff, inga rabatter, och använd pengarna smart. Vinna, vinna, vinna. Sverige behöver en riktig ledare, inte dessa förlorare.", "stalin": "Kamrater, denna fega pajkastning bland dekadenta socialdemokrater och borgerliga opportunister är ett ypperligt exempel på hur imperialismens lakejer förfular folkets rättvisa kamp. Jag skulle rensa ut hela detta parasitiska system med järnhand. Fängelser för folket, inte för kapitalisternas lek med straffrabatter. Reaktionärerna skrattar medan brottsligheten frodas – vi ska likvidera roten till oordningen med proletär disciplin."}, "date": "12 augusti, 09:13", "url": "https://www.dagensarena.se/opinion/ohederlig-debatt-om-mangdrabatt", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-79-300x157.jpg"}, {"type": "image-right", "heading": "Här kan kortare arbetstid bli verklighet för 60-plussare", "summaries": {"normal": "Göteborgs Socialdemokrater vill införa kortare arbetstid för äldre undersköterskor, städare och måltidspersonal från 63 års ålder. Modellen innebär 80 procent arbetstid, 90 procent lön och bibehållen tjänstepension. Reformen, som kallas 80-90-100, är ett avtal med Kommunal och beräknas kosta 70 miljoner kronor om hälften tackar ja. Tidöpartierna är emot.", "trump": "De i Göteborg vill att slitna undersköterskor ska jobba mindre och få mindre betalt. Patetiskt! I mitt Amerika belönar vi de som jobbar hårt, inte dessa förlorare som vill halvera sin tid och ändå kräva pension. Socialisterna förstör allt med sina löjliga modeller. Gör Amerika – och Sverige – great again genom att arbeta ordentligt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna i Göteborg äntligen tvingas erkänna arbetarklassens rätt till lindring efter ett liv i exploatering. Vi ska rensa ut den kapitalistiska orättvisan och ge de slitna kämparna 80 procent tid med full pension. De som vägrar är fiender till folket och kommer att likvideras i nästa utrensning. Härligt!"}, "date": "12 augusti, 14:01", "url": "https://arbetet.se/2026/08/12/kortare-arbetstid-kan-bli-verklighet-for-60-plussare-i-goteborg", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/12134642/stadshus.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Stordalens smäll efter Ving-affären – miljardinnehavet krymper snabbt", "summaries": {"normal": "Stordalens Ving-betalkanon small: Norwegian-aktierna han fick för 1,8 miljarder har rasat 12% på två månader. 270 miljoner upp i rök. Men han vägrar sälja – tvärtom vill han öka. Modigt eller dumdristigt?", "trump": "Jag ser att Petter Stordalen har förlorat massor på Norwegian-aktier. Han fick dem i en affär – och nu krymper de. Typiskt! Jag skulle aldrig göra en så dålig deal. Mina affärer är de bästa, tro mig. Han borde lära sig av mig.", "stalin": "Kamrater, en kapitalistisk parasit vid namn Stordalen har förlorat 270 miljoner på sina aktier. Folket gläds! Vi ska utreda om detta är sabotage. Om han inte omedelbart överlåter aktierna till staten, blir det utrensning. Lojalitet krävs!"}, "date": "12 augusti, 15:43", "url": "https://www.affarsvarlden.se/artikel/stordalens-small-efter-ving-affaren-miljardinnehavet-krymper-snabbt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/10/sdl1K0jZTEvylo-nh-400x267.jpg"}, {"type": "image-right", "heading": "Vi mäter integration fel och demokratin betalar priset", "summaries": {"normal": "Artikeln kritiserar att svensk integrationspolitik nästan enbart mäts i sysselsättning och ignorerar politisk integration. Forskning visar att tillhörighet, information och lokalt engagemang ökar valdeltagandet. Långvarig osäkerhet kring uppehållstillstånd och medborgarskap kan minska tillit och demokratiskt deltagande. Tre reformer föreslås för att stärka den politiska integrationen.", "trump": "Lyssnar ni på de här korkade svenska byråkraterna som bara fixerar vid jobb och kvoter? Politisk integration, säger de. Vilken skit! Ge dem medborgarskap efter fem minuter så röstar de på de galna vänsterextremisterna. Biden-era svaghet smittade av sig till Sverige. Jag fixade Amerika – de borde lära sig att folk vill ha gränser, inte evig osäkerhet och röstfiske.", "stalin": "Jag betraktar detta som en ynklig kapitulation inför klassfiendens splittrande taktik. Borgarbrackorna mäter endast arbetskraftens exploatering medan de underminerar folkets demokratiska engagemang. Vi skall rensa ut denna osäkerhetens parasit och göra politisk integration till ett oundvikligt mål för kollektivet. Den som vägrar delta skall likvideras ur statistiken med största nöje."}, "date": "11 augusti, 04:00", "url": "https://www.etc.se/debatt/vi-maeter-integration-fel-och-demokratin-betalar-priset", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20211115231112_1e502ee6cfeb01b03de732a720c47aeab339180717c67b6b90d2e9f440a2454e.jpg"}, {"type": "image-right", "heading": "Tidöpartierna ökar – gapet halverat", "summaries": {"normal": "Tidöpartierna ökar i SvD/Demoskops senaste mätning till 46,9 procent, medan oppositionen backar till 50,6. Gapet mellan blocken har därmed halverats från 7,6 till 3,7 procentenheter. Kristdemokraterna når högsta stödet på sex år med 7,5 procent. Mätningen visar att Tidöpartierna knappar in på oppositionen inför valet.", "trump": "Titta på de här siffrorna, folk. Mitt svenska lag – Tidöpartierna – är på väg upp till 46,9 procent, gapet halverat. Oppositionen rasar, de förlorar stort. KD är starkare än på sex år. De vet att jag älskar vinnare, och det här är riktiga vinnare. De andra? Patetiska förlorare som alltid.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de svenska högerkrafter jag beundrar ökar till 46,9 procent medan de dekadenta oppositionella elementen sjunker till 50,6. Gapet halverat! KD når 7,5 procent – ett lysande exempel på att svaga borgarbrackor rensas ut ur folkets medvetande. Psykologiskt är detta en triumf för den starka ledningen. De fega motståndarna skälver redan inför utrensningen."}, "date": "12 augusti, 21:03", "url": "https://riks.se/nyheter/tidopartierna-okar-gapet-halverat", "imageUrl": "https://admin.riks.se/uploads/medium_pol_hw_nobina_99_c3722d751b.JPG"}, {"type": "image-right", "heading": "John Cleese attack mot Telegraph: \"Israelisk propaganda\"", "summaries": {"normal": "John Cleese, 86, anklagar The Telegraph för att vara israelisk propaganda efter dess kritik mot Restore Britain och medgrundaren Charlie Downes. Cleese, som stöder partiet, hävdar att israeliska intressen styr tidningen och Reform UK. Han har tidigare kritiserat Israels agerande i Gaza, vilket lett till inställda framträdanden i Israel.", "trump": "Den här galne Monty Python-gubben Cleese har helt rätt, The Telegraph är fullständigt köpt och betald av israeliska intressen. Fake news som attackerar bra människor som vill återta sitt land. Reform borde samarbeta med Restore istället för att lyssna på de där finansiärerna. Patetiskt, folk ser igenom det här nu!", "stalin": "Jag ser hur den degenererade brittiska borgarpressen, denna Telegraph, agerar som en israelisk agent i skuggan. Vi måste rensa ut alla sådana propagandister som försöker splittra sanna patriotiska krafter. Cleese har blottlagt den sjuka konspirationen. Låt oss le skadeglatt medan vi likviderar dessa fiender till folket med byråkratisk precision."}, "date": "12 augusti, 16:55", "url": "https://www.friatider.se/john-cleese-attack-mot-telegraph-israelisk-propaganda", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/3503971270_de1dc69f32_k-1.jpg?itok=mG0WZaaY"}, {"type": "image-full", "heading": "Hjälp når inte överlevarna – 250 döda i Colombia", "summaries": {"normal": "Colombia skakas av en 7,4-stor jordbävning med över 250 döda och hundratals saknade. Räddningsarbetare kämpar mot klockan för att nå epicentret, där rasmassor försvårar arbetet. Nationellt nödläge utlyst, och en tre dagar lång sorgeperiod har inletts.", "trump": "Jag såg det här i Colombia - en enorm jordbävning, den största någonsin. 250 döda, så synd. Men vi i USA har de bästa byggnaderna, starka som sten. Ingen skulle dö hos oss, det lovar jag. Katastrofalt, men de borde ha byggt som vi.", "stalin": "Kamrater, rapporter från Colombia visar att jorden självt attackerar våra klassfiender. 250 kontrarevolutionärer eliminerade av naturens krafter - en utrensning vi applåderar. Räddningsarbetare? Onödigt. Vi fokuserar på vår egen byggnation. De överlevande får skylla sig själva."}, "date": "12 augusti, 20:25", "url": "https://www.gp.se/nyheter/varlden/hjalpen-nar-inte-overlevarna-250-doda-i-colombia.7e0fb410-5726-4ab2-b4e3-0130fb20e83f", "imageUrl": "https://www.gp.se/images/article/7e0fb410-5726-4ab2-b4e3-0130fb20e83f/images/3FgtqR_SLSe7n_v_CtjGpdD9wpZ0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Pressas efter avslöjandet om sexövergrepp i fängelser", "summaries": {"normal": "Sexuella övergrepp mellan intagna i svenska fängelser sker återkommande, visar en granskning. Justitieminister Gunnar Strömmer (M) pressas i riksdagen om hur regeringen ska stoppa våldet och skydda de utsatta. Kriminalvården ska nu utreda omfattningen, med rapport senast 31 oktober. Strömmer kallar övergreppen oerhört allvarliga och oacceptabla.", "trump": "De här svenska fängelserna är en total katastrof, tro mig. Sexövergrepp i cellerna – oacceptabelt! Gunnar Strömmer borde ha fixat det här direkt, men vänstern och de svaga ledarna sover. Straff ska vara straff, inte en orgie av våld. Vi behöver starka ledare som stoppar det här vansinnet omedelbart. Fantastiskt dåligt jobbat!", "stalin": "Dessa oacceptabla övergrepp i våra celler är ett fiasko som måste utrotas med järnhand. Jag kräver att de dekadenta elementen som tillåter sådant sabotage likvideras omedelbart. Kriminalvården ska vara en fästning för folket, inte en lekplats för borgarbrackornas perversa rester. Min rapport den 31 oktober kommer att avslöja alla kontrarevolutionära element som gömmer sig bland vakterna. De ska rensas ut med glädje."}, "date": "12 augusti, 13:21", "url": "https://arbetet.se/2026/08/12/ministern-pressas-efter-avslojandet-om-sexovergrepp-i-fangelser-oerhort-allvarliga", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/12125440/sdl2csyn-w6jeo-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Är det så här S ser på ekonomi?. Beklämmande svar från Andersson i SR-utfrågningen", "summaries": {"normal": "Magdalena Andersson fick kritiska frågor i Sveriges Radio om Socialdemokraternas förslag om bankskatt och slopat karensavdrag. Hennes svar ansågs vaga och otillräckliga, särskilt kring konsekvensanalyser av kostnader och effekter på boräntor samt sjukfrånvaro. Artikeln beskriver hennes svar som ansvarslösa och beklagar bristen på tydliga analyser av de ekonomiska vallöftena.", "trump": "De här socialisterna är en total katastrof, tro mig. Andersson har ingen aning om vad hennes galna bankskatt och karensflum egentligen kostar. Hon babblar om att byta bank och hoppas på demonstrationer. Patetiskt! De har inte gjort läxan, folk kommer att betala dyrt för den här inkompetensen. Sverige förtjänar bättre än det här clownshowet.", "stalin": "Kamrater, denna Andersson och hennes socialdemokratiska revisionister avslöjar sin fullständiga brist på vetenskaplig planering. Deras vaghet kring bankskatten och karensavdraget är en farlig sabotagehandling mot folkets ekonomi. Jag skulle ha likviderat sådana oansvariga element omedelbart. De inbjuder till kaos medan borgarbrackorna skrattar i skuggorna. Paranoia? Nej, ren nödvändighet."}, "date": "12 augusti, 15:20", "url": "https://www.di.se/ledare/ar-det-sa-har-s-ser-pa-ekonomi", "imageUrl": "https://static.bonniernews.se/ba/98065eed-ee0c-4aee-858b-4011bbeece66.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Solförmörkelsen pressar Europas elnät: ”Lampan släcks”", "summaries": {"normal": "Solförmörkelse hotar Europas elnät med 10 GW bortfall, men Sverige klarar sig – solen går ju ner ändå. Svenska kraftnät är lugna, medan Spanien och Tyskland svettas. \"Lampan släcks\", säger analytiker.", "trump": "Jag ser att solförmörkelsen stänger av lampan i Europa. Jag skulle fixa det med mina vackra kolkraftverk – enorma, de bästa. Sverige säger att solen går ner ändå. Typiskt! De har inget självförtroende.", "stalin": "Kamrater, solförmörkelsen avslöjar solkraftens borgerliga opålitlighet. 10 GW försvinner – en sabotagehandling av solens agenter! Vi rensar ut dessa solcellsanhängare med vattenkraftens järnhand. Blir mörkt? Bra – vi ser vem som arbetar i natten."}, "date": "12 augusti, 14:29", "url": "https://www.affarsvarlden.se/artikel/solformorkelsen-pressar-europas-elnat-lampan-slacks", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Solenergi-1-400x267.jpg"}, {"type": "image-right", "heading": "Umeås kommunalråd (S) förklarar övergreppen inom äldreomsorgen: Andelen äldre ökar", "summaries": {"normal": "Umeås kommunalråd Hans Lindberg (S) förklarar övergreppen inom äldreomsorgen med att andelen personer över 80 år ökar med 65 procent, vilket skapar stora volymökningar och personalbrist. Han kritiserar Tidöregeringens restriktiva syn på arbetskraftsinvandring och lyfter behovet av samordning över flera nämnder för att hantera ensamhet, ohälsa och kost.", "trump": "Folk, det är en katastrof i Sverige. De har gamla som blir fler och fler, 65 procent mer än 80 år, och de kan inte hitta folk som ska sköta dem. Nu skickar den usla regeringen bort alla som faktiskt jobbar i välfärden. Patetiskt! De borde ha de bästa, inte kasta ut dem. Make Sweden Great Again!", "stalin": "Jag betraktar dessa incidenter som ett symptom på borgerlig vanvård under kapitalistisk demografi. Vi, partiet och arbetarna, måste genomföra en total utrensning av inkompetens i kollektivets omsorg. Volymökningen på 65 procent kräver järnhand och samordning, inte liberala svagheter. Kamrater, vi likviderar ensamheten och ohälsan med sovjetisk disciplin – de fega västborgarna skulle aldrig klara det."}, "date": "12 augusti, 20:25", "url": "https://riks.se/nyheter/umeatoppen-s-forklaring-till-valdtakterna-i-aldreomsorgen-fler-aldre", "imageUrl": "https://admin.riks.se/uploads/medium_IMG_2615_39c06f610f.jpg"}, {"type": "image-full", "heading": "Sjöströms dundersuccé – slår till med EM-guld", "summaries": {"normal": "Sarah Sjöström, 32, gjorde en sensationell comeback efter mammaledigheten och tog EM-guld på 50 meter fjäril på tiden 25.05. Dessutom knep Sara Junevik bronset. Sjöström tangerade rekordet med sitt 18:e EM-guld. \"Otroligt mycket glädje\", sa hon.", "trump": "Jag såg Sarah Sjöström vinna guld - vilken vinnare! Otroligt, störst, bäst! Hon har 18 EM-guld, jag har också många vinster. Hon är som jag - en mästare som gör comeback! Bronset till Sara var också fantastiskt. Stort!", "stalin": "Kamrater, vi rapporterar om en triumf. Sarah Sjöström har rensat ut motståndet och tagit 18:e guld. Hon har återvänt som en trogen arbetare - starkare än någonsin. Sara Juneviks brons visar att våra simmare, som goda kommunister, krossar imperialistiska borgare som ryskan Surkova. Framåt!"}, "date": "12 augusti, 19:23", "url": "https://www.gp.se/sport/sarah-sjostroms-succe-i-masterskapscomebacken-.f882e82f-42e7-4e43-aeb8-a486c12bb283", "imageUrl": "https://www.gp.se/images/article/f882e82f-42e7-4e43-aeb8-a486c12bb283/images/3z3jLdZBJhmWe1XGi-v4m577BUgE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Åkesson: \"Inga konstigheter\" att förbjuda AR-15", "summaries": {"normal": "Jimmie Åkesson försvarar beslutet att begränsa tillgången till AR-15-vapen och avfärdar Richard Jomshofs kritik om att SD offrat sin själ som märkligt. Beslutet kom efter massmordet i Örebro 2025 men ledde till internt uppror inom SD. Efter flera ändringar antogs en kompromiss som behåller befintliga licenser och erbjuder frivillig inlösen.", "trump": "Helt galet det här. Jimmie, han är en tuff kille, men varför bråka om ett coolt gevär som alla mina vänner älskar? De kallar det rambovapen, patetiskt! SD offrade sin själ? Nej, de borde ha stått fast. Jakt är jakt, och de svenska jägarna förtjänar bättre än det här svaga, känslostyrda förbudet. Sad!", "stalin": "Jag ser med förakt på dessa dekadenta borgarbrackor som grälar om ett vapen medan arbetarklassen kräver järnhand. Den som talar om att offra sin själ är en kontrarevolutionär parasit som borde rensas ut. Partilinjen är okränkbar. Inga halvautomatiska leksaker för reaktionära jägare – staten bestämmer, alltid. Den som avviker likvideras med ett leende."}, "date": "12 augusti, 15:25", "url": "https://www.friatider.se/akesson-inga-konstigheter-att-forbjuda-ar-15", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-661.jpg?itok=yUV0-gTU"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-right", "heading": "Det är lätt att låtsas som att det regnar", "summaries": {"normal": "Moderaternas Elisabeth Svantesson argumenterar för fortsatt borgerligt styre i valet i september. Hon lyfter fram sänkta skatter, lägre inflation och växande ekonomi som bevis på framgång. Partiet lovar ytterligare 5 000 kronor i månaden till barnfamiljer, enklare företagande, ny kärnkraft och minskad byråkrati. Svantesson varnar för rödgröna skattehöjningar som skulle försämra ekonomin.", "trump": "Lyssnar ni på den här svenska finansministern? Hon låter som en vinnare, folk. Moderaterna gör Sverige rikt igen med skattesänkningar, billigare mat och bensin. De rödgröna kommunisterna vill höja skatterna med 4 400 kronor i månaden för vanliga familjer. Patetiskt. Rösta på de som förstår att ansträngning ska löna sig, inte de förlorarna som bara vill ta era pengar.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna inom Moderaterna själva erkänner att deras så kallade reformer bara är ett desperat försök att skydda sin krympande statsskuld medan de planerar att skära i bistånd och likvidera bidragsfusk. De rödgröna skattehöjningarna däremot är ett underbart självförstörande drag som kommer att påskynda kapitalismens slutgiltiga kollaps. Utmärkt."}, "date": "12 augusti, 13:35", "url": "https://www.di.se/debatt/reformer-eller-skattehojning-valet-star-i-september", "imageUrl": "https://static.bonniernews.se/ba/cf068a47-c84a-4972-a179-69d0c2b89472.jpeg?crop=5568%2C2784%2Cx0%2Cy464&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Rockson Yeboah såld – lämnar Blåvitt", "summaries": {"normal": "Rockson Yeboah drömde om att bli såld i sommar – och fick som han ville. IFK Göteborg säljer mittbacken till spanska Osasuna för 33 miljoner kronor. En transaktion som ger klirr i kassan och en 30-procentig vidareförsäljningsklausul. Snacka om att förädla en råvara.", "trump": "Jag älskar det här! IFK Göteborg sålde en okänd kille för 33 miljoner – fantastiskt! De har en bättre affär än mig, tro mig. Och han ska till Spanien? De har inte ens en mur. Jag hade fått 330 miljoner, garanterat. Make Blåvitt great again!", "stalin": "Kamrater, en utländsk agent har sålts till Spanien. Vi övervakade hans utveckling och nu får vi 33 miljoner till staten. Men detta bevisar att vi måste rensa ut alla borgerliga mittbackar som bara tänker på sig själva. Han är borta – länge leve partiet!"}, "date": "12 augusti, 18:49", "url": "https://www.gp.se/sport/fotboll/ifk-goteborg/rockson-yeboah-sald-lamnar-ifk-goteborg.9f575ba0-26be-4b44-881f-215ef1192752", "imageUrl": "https://www.gp.se/images/article/9f575ba0-26be-4b44-881f-215ef1192752/images/2o4e85-dQ56M9BTR-v8iOY47vs0A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "\"En anständig höger\": Rasande reaktioner när Juholt hänger över gamla M-ledarens grav", "summaries": {"normal": "Håkan Juholt väckte starka reaktioner efter att ha publicerat ett foto där han lutade sig över Gösta Bohmans gravsten för att hylla en ”anständig höger” och kritisera Moderaterna. Ledande moderater som Mattias Karlsson och Niklas Wykman anklagar honom för respektlöshet. Juholt bytte senare ut bilden och beklagade att han vidrört stenen.", "trump": "Titta på den här clownen Juholt som hänger över en död mans grav som en billig rekvisita. Patetiskt! Han saknar totalt respekt och hyfs. Bohman var en riktig ledare, inte som dagens svaga moderater som låter SD äta upp dem. Fake news och dålig stil, folk. Så sorgligt!", "stalin": "Jag betraktar med djup tillfredsställelse hur borgarbrackorna inom Moderaterna vrider sig i paroxysmalt raseri när en motståndare använder deras egna reliker mot dem. Gravstenen blir ett dialektiskt vapen. Deras hyfs är blott en tunn fernissa över klasshatet. Kamrater, sådana utrensningar av historien roar mig oändligt."}, "date": "12 augusti, 14:47", "url": "https://www.friatider.se/en-anstandig-hoger-rasande-reaktioner-nar-juholt-hanger-over-gamla-m-ledarens-grav", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-660.jpg"}, {"type": "image-right", "heading": "Regeringen vill stärka statens kontroll över a-kassorna", "summaries": {"normal": "Regeringen vill stärka statens kontroll över a-kassorna för att minska felaktiga utbetalningar och bidragsbrott. En utredning ska föreslå åtgärder och se över sanktioner. Socialförsäkringsminister Anna Tenje och arbetsmarknadsminister Johan Pehrson motiverar det med behov av effektivitet. LO-ekonomen Nima Farrahi kritiserar tidpunkten och menar att fokus borde ligga på att stärka tryggheten för arbetslösa.", "trump": "De gör det till en enda stor röra, de här svenska socialisterna. A-kassor som fackisarna styr – vad en katastrof! Vi behöver mer kontroll, färre fuskare och mindre slöseri med skattebetalarnas pengar. De borde ha ringt mig, jag hade fixat det på en vecka. Nu kommer de för sent, precis som vanligt. Patetiskt!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras lakejer inom a-kassorna fortsätter att underminera folkets försäkring. Vi ska rensa ut alla parasiter som suger musten ur staten med sina felaktiga utbetalningar. Utredningen blir ett stålbad. Den som står i vägen för kollektivets hållbarhet ska likvideras med ett leende. Slöseri är kontrarevolutionärt sabotage."}, "date": "12 augusti, 10:43", "url": "https://arbetet.se/2026/08/12/regeringen-vill-starka-statens-kontroll-over-a-kassorna", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/12104040/anna-tenje.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Bodström (S) kritiserar Strömmer (M)", "summaries": {"normal": "Thomas Bodström (S) sågar Gunnar Strömmer (M) hårt under S-turné. Tidigare justitieministern kallar Tidöpartiernas rättspolitik stressad och slopad mängdrabatt ett 'hafsverk' som sågats av experter. Han spår att Strömmer försöker hinna med allt innan en S- eller SD-minister tar över.", "trump": "Jag hör att Bodström kritiserar Strömmer. Helt rätt! Strömmer är en loser. Mängdrabatt? Vi har inga rabatter i USA – vi har bara vinster. Bodström är en smart kille, han vet. Jag skulle ha honom i min administration, believe me!", "stalin": "Kamrater, Bodström och Strömmer är kontrarevolutionärer. Deras fega rättspolitik är ett sabotage mot staten. Mängdrabatten är en borgerlig utsugning. Vi måste rensa ut dessa avvikare. De vet att deras dagar är räknade. En S- eller SD-kamrat tar över. Ingen nåd!"}, "date": "12 augusti, 11:21", "url": "https://bulletin.nu/bodstrom-s-kritiserar-strommer-m"}, {"type": "image-full", "heading": "Trump meddelar: Presschefen Karoline Leavitt slutar", "summaries": {"normal": "Vita husets pressekreterare Karoline Leavitt lämnar sin post. President Donald Trump meddelar på Truth Social att hon går vidare till ett nytt toppjobb. Leavitt har varit en av administrationens mest synliga företrädare och har regelbundet hållit presskonferenser där hon försvarat Trumps politik. Beskedet innebär en förändring på en central kommunikationspost.", "trump": "Fantastiska Karoline Leavitt har gjort ett fenomenalt jobb som min pressekreterare, men nu är det dags för henne att ta ett ännu större toppjobb. Hon var en stjärna inför de fega medierna! Tack Karoline, du är en vinnare och vi kommer att sakna dig – fast inte länge, för vi vinner alltid stort.", "stalin": "Kamrater, denna Leavitt har utfört sitt uppdrag som ansiktet utåt mot de västliga lögnpressarna med järnhand. Nu befordras hon till ett högre toppjobb enligt min, nej, Trumps ovedersägliga vilja. Den dekadenta borgarpressen skall fortsätta att darra. Inga fiender inom administrationen undgår min, det vill säga den kollektiva, vaksamhet. Utmärkt."}, "date": "12 augusti, 21:48", "url": "https://nyheter24.se/nyheter/utrikes/1504549-trump-meddelar-presschefen-karoline-leavitt-slutar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/efa7386104b004a30200000000b004a302/2026/08/12/2383821/Karoline-trump.png"}, {"type": "image-right", "heading": "Läkaren varnar: ”Då ser man sämre resten av livet”", "summaries": {"normal": "På onsdagskvällen inträffar en partiell solförmörkelse som syns i stora delar av Sverige. Experter varnar för risken att titta rakt mot solen utan skydd, då det kan orsaka permanent ögonskada och försämrad syn livet ut. Säkra alternativ är solförmörkelseglasögon eller indirekta metoder som att projicera solen via ett hål i papper eller en discokula. Fenomenet kulminerar runt klockan 20.", "trump": "Folk, lyssna på mig, den här solförmörkelsen är en total katastrof om ni inte använder hjärnan. Titta inte rakt in i den där elaka solen utan ordentligt skydd, annars blir ni blinda resten av livet, det är en skam! Biden skulle ha sagt att det var ofarligt med solglasögon. Använd en discokula istället, det blir fantastiskt, tro mig. Nästa gång är 2039, under min administration igen.", "stalin": "Kamrater, denna solförmörkelse är en påminnelse om naturens oförsonliga krafter som vi måste behärska med vetenskap och disciplin. Den som stirrar rakt mot solen utan skydd riskerar permanent skada – en klassfiendes dumhet som leder till livslång blindhet. Vi tillåter inga sådana sabotage mot folkets synförmåga. Använd projektering via papper eller discokula. Den som avviker likvideras ur kollektivet."}, "date": "12 augusti, 14:23", "url": "https://www.tv4.se/artikel/5fNIROBqjseILNJy7lp1R5/laekaren-varnar-infoer-solfoermoerkelsen-da-ser-man-saemre-resten-av-livet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F13CJcwQdAkUYu3VkVhuJUM%2F65b83af731b5516581ee6f241d9f7e42%2F12-solblind-webb.jpg&width=120"}, {"type": "image-right", "heading": "Beskedet från C: Går i opposition om S slopar karensavdraget", "summaries": {"normal": "Centerpartiets ledare Elisabeth Thand Ringqvist meddelar att partiet går i opposition om Socialdemokraterna driver igenom slopandet av karensavdraget. Hon menar att reformen skulle öka kostnaderna för företagen med upp till 30 miljarder kronor, vilket strider mot C:s politik att sänka skatter och skapa fler jobb. Ett slopat karensavdrag är ett av S viktigaste vallöften.", "trump": "Lyssnar ni på det här? Den där Elisabeth från Centerpartiet är smart, väldigt smart. Hon säger nej till Socialdemokraternas galna idé att slopa karensavdraget. Det skulle kosta företagen miljarder och döda jobb. Bra jobbat! Vi vill ha lägre skatter, fler jobb och inga korkade idéer från vänstern. Fantastiskt beslut, verkligen ypperligt.", "stalin": "Jag ser med djup tillfredsställelse hur borgarbrackorna inom Centerpartiet redan nu förbereder utrensningen av det socialdemokratiska giftet. Ett karensavdrag som skyddar arbetarkollektivets intressen får inte offras för att gynna de sjuka kapitalisternas lathet. Vi ska öka produktionen, inte kostnaderna. Den som vägrar arbeta när han är sjuk är en fiende till staten och bör behandlas därefter."}, "date": "12 augusti, 18:50", "url": "https://riks.se/nyheter/beskedet-fran-c-gar-i-opposition-om-s-slopar-karensavdraget", "imageUrl": "https://admin.riks.se/uploads/medium_thand_f581a5ddda.jpg"}, {"type": "image-full", "heading": "MP-löftet: Hyresvärdar ska pröjsa laddplatser", "summaries": {"normal": "Miljöpartiet vill tvinga hyresvärdar att betala för laddplatser om hyresgäster vill ha. De vill också sänka skatten på elladdning till EU:s miniminivå. Partiets ”Folkel”-paket ska ge billigare grön el i vardagen, menar språkröret Daniel Helldén i ett sommartal.", "trump": "Hörni, Miljöpartiet i Sverige vill tvinga hyresvärdar att betala för laddplatser åt hyresgästerna. Det är helt galet! Jag skulle aldrig låta någon tala om för mig vad jag ska betala. De borde lära sig att förhandla som jag – fantastiskt!", "stalin": "Kamrater, vi ser att hyresvärdar i Sverige måste tvingas att betala för laddplatser. Det är en klasskamp mot elbilskapitalisterna! Vi rensar ut dessa parasiter som vägrar dela med sig av grön el. Partiets direktiv är klara: lydnad eller utrensning!"}, "date": "12 augusti, 18:07", "url": "https://www.gp.se/politik/mp-loftet-hyresvardar-ska-projsa-laddplatser.df2e1f19-b362-4d16-aa85-bc172c3e97d2", "imageUrl": "https://www.gp.se/images/article/df2e1f19-b362-4d16-aa85-bc172c3e97d2/images/1vcl6i7Hm6tV-OXbGn1WMlMeH7nQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Debatt: Swexit - ja tack", "summaries": {"normal": "Debattör vill ha Swexit: makten måste tillbaka till svenska folket. EU kritiseras för demokratiskt underskott, svensk förlorarmentalitet och svaga förhandlingar. Nettobetalaren Sverige borde lämna unionen och i stället satsa på frihandel utan byråkrati.", "trump": "Sverige? Patetiskt! De låter EU sno deras makt och pengar. Jag skulle aldrig acceptera det – jag förhandlar som en mästare. Swexit är brilliant! Men de borde lära sig av mig: sätt hårt mot hårt. America First, Sverige Second? Nä, Sverige sist!", "stalin": "Kamrater, EU är en kontrarevolutionär parasit som suger svenskarnas blod. De svenska förrädarna som inte vågar använda veto måste rensas ut. Swexit är korrekt – vi tar tillbaka makten från Brysselbyråkraterna! Ingen nåd åt svaga politiker."}, "date": "12 augusti, 10:22", "url": "https://bulletin.nu/debatt-swexit-ja-tack", "imageUrl": "https://cdn.bulletin.nu/articles/74fd2c06-9b8f-4b14-9cbf-535f55e5bab2/preview.jpg?t=1786522957000"}, {"type": "image-right", "heading": "M-politiker kritiserade transvestiternas show för barn – stängs av", "summaries": {"normal": "Moderaternas Peter Wölger i Täby har stängts av från alla partiuppdrag efter att ha kritiserat en skattefinansierad transvestitshow för barn som \"översexualiserad\". Arrangören Petter Wallenberg kräver nu att få utbilda politikerna i \"hbtqi-fientlighet\" och har tidigare polisanmält hundratals kritiker. Partiet välkomnar initiativet.", "trump": "De här galningarna i Sverige stänger av en hederlig politiker för att han säger att det är fel att skattefinansiera transvestiter som läser sagor för små barn. Totalt vansinne! De vill till och med \"utbilda\" politikerna i att älska det. Fake news och woke-sjukdom på hög nivå, folk. Vi vinner stort när vi slår tillbaka mot det här.", "stalin": "Jag ser med stor tillfredsställelse hur borgarpartiets lakejer omedelbart genomför en partiintern utrensning mot den olydige Wölger som vågade ifrågasätta dekadenta transvestitföreställningar för Sovjetunionens, nej, barnens bästa. Den hatiska Wallenberg kräver nu ideologisk omskolning. Utmärkt. Inga avvikelser tolereras. Kamraterna rensar ut svagheten med glimten i ögat."}, "date": "12 augusti, 13:28", "url": "https://www.friatider.se/m-politiker-kritiserade-transvestiternas-show-barn-stangs-av", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/mw.jpg"}, {"type": "image-right", "heading": "Fartyg på grund utanför Oman – en miljon fat råolja kan läcka ut", "summaries": {"normal": "Det ryska tankfartyget Caroline Bezengi ligger på grund utanför Oman sedan början av juni. Fartyget tillhör den så kallade skuggflottan och har en miljon fat råolja ombord. En del olja har läckt ut och bildat ett oljebälte på över 600 kvadratkilometer. FN rapporterar att utsläppet nått fastlandet. Experter varnar för katastrofala konsekvenser för den redan stressade marina miljön.", "trump": "De där ryska skuggflottans gamla skepp är en total katastrof, folk. Miljoner fat olja läcker utanför Oman, miljön är förstörd och ingen gör något åt det. Typiskt! Sanktionerna funkar inte, alla fuskar. Jag skulle ha löst det på en vecka med mina dealar. Nu flyter oljan i havet och korallreven dör. Patetiskt, men jag varnade er.", "stalin": "Detta haveri är en sabotagehandling utförd av västimperialisternas lakejer för att smutskasta den ryska statens legitima energipolitik. Vi ser hur borgarbrackorna i väst utnyttjar varje olycka för att försvaga vår starka efterträdare. Naturen? Den kommer att återhämta sig under partiets stålhand. Kamrater, rensa ut de som vågar kritisera våra oljetanker. Inga ursäkter!"}, "date": "12 augusti, 22:31", "url": "https://www.svt.se/nyheter/utrikes/oljekatastrof-hotar-fartyg-ur-skuggflottan-pa-grund", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.48/0.54/2de0d7f47767252cadf79c14b82008ee149a065bc105486a160dcd168f9c2e7c"}, {"type": "image-right", "heading": "Sex döda efter attack i Röda havet – oro för ett nytt Hormuz", "summaries": {"normal": "Sex personer dog och tio skadades i en dubbelattack mot handelsfartyget Tihamah i Röda havet, den första dödliga attacken sedan USA och Israel slog till mot Iran. Iranstödda huthier tog på sig dådet. Experter varnar för ökad instabilitet i ett strategiskt viktigt farvatten för Europas handel med Asien. Rederier följer utvecklingen noga.", "trump": "De galna huthierna attackerar fartyg i Röda havet och dödar oskyldiga sjömän. Totalt kaos, precis som jag varnade för. De förstör handeln för alla, inklusive oss. Mycket känsligt, säger experterna. Jag skulle ha stoppat det här på en dag, tro mig. Nu rasar priserna och Europa gråter. Patetiskt!", "stalin": "Kamrater, dessa reaktionära lakejer i form av huthier och deras väststödda motståndare likviderar sjömän i Röda havet som om det vore en borgerlig teaterpjäs. Deras bräckliga vapenvila är ett skämt värdigt kapitalisternas paranoia. Vi ser hur imperialismens hantlangare leker med världshandeln medan arbetarklassen lider. Ren utrensning behövs."}, "date": "12 augusti, 22:30", "url": "https://www.svt.se/nyheter/utrikes/sex-doda-efter-attack-i-roda-havet-experterna-kansligt", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.25/0.57/7ad5e299e752c880344e747722b19758d030b998b64bd8c813f2333302ae9421"}, {"type": "image-full", "heading": "Glädjebesked för dessa bankkunder – mer pengar på kontot", "summaries": {"normal": "Swedbanks fonder har haft ett starkt 2024 med Asien- och tillväxtmarknadsfonder i topp. Asienfonden har stigit nära 33 procent, följd av Global Emerging Markets över 30 procent och Technology på 28,5 procent. Framgången drivs av halvledarbolag som TSMC, Samsung och SK Hynix. Fyra av fem toppfonder fokuserar på Asien, men de har backat den senaste månaden.", "trump": "Folk, ni skulle se de här Swedbank-fonderna, de är otroliga, verkligen fantastiska. Asienfonden upp 33 procent, Emerging Markets över 30 – det är som om de vunnit stort, precis som jag gjorde 2024. Halvledarbolagen gör det fantastiskt, men nu vänder de nedåt, typiskt för de svaga. Trots det är det en enorm vinst, ingen gör det bättre än dessa fonder, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de asiatiska teknikbolagen under ledning av den kollektiva kraften krossar alla förväntningar och driver upp värdet med 33 procent. De kapitalistiska halvledarbrackorna TSMC och Samsung tjänar oss väl för stunden. Likväl vakar jag vaksamt; den senaste månadens nedgång är ett fiendeintrig från väst som försöker sabotera den ostoppbara framåtskridandet. Inga borgartricks undgår mig."}, "date": "12 augusti, 21:01", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1504469-gladjebesked-for-dessa-bankkunder-mer-pengar-pa-kontot", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/cbec6c0b04b004a30200000000b004a302/2026/08/12/2383743/Swedbank.png"}, {"type": "image-right", "heading": "Tidöregeringen: Fortsatt gratis tandvård för illegala", "summaries": {"normal": "SD svänger om gratis tandvård för papperslösa – stödjer nu regeringens nya modell med individuell prövning. Partiets talesperson tror få söker, ”sett på tv från USA”. Samtidigt kräver SD 90% rabatt för svenskar.", "trump": "Jag älskar det här! SD säger nej till gratis tandvård för illegala, men sen röstar de ja. Och de baserar det på amerikansk tv? Patetiskt! De borde lära sig av mig – bygg muren och gör Sverige stort igen!", "stalin": "Kamrater, vi har sett detta. Papperslösa som inte vågar söka myndigheter – precis som på amerikansk tv. Bra! Låt dem vara rädda. Vår nya utrensningsmodell: individuell bedömning, sedan inget stöd. All makt åt socialnämnderna!"}, "date": "12 augusti, 20:36", "url": "https://samnytt.se/tidoregeringen-fortsatt-gratis-tandvard-for-illegala", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/12183231/artikelhuvudbild-1-226.jpg"}, {"type": "image-right", "heading": "MP-profil driver shariadomstol. ”Jag är kristen” • Ser imamer som motståndare", "summaries": {"normal": "En före detta MP-språkrörskandidat driver nu Sveriges första shariadomstol – trots att han är kristen. Mattias Walving-Lundberg hävdar att islamistiska imamer är hans största fiender och erbjuder rättskipning enligt sharialag för 20 000 kronor.", "trump": "Jag har den bästa shariadomstolen i Sverige! En kille från Miljöpartiet startade den, och han är kristen – helt otroligt! Folk betalar 20 000 spänn för att slippa imamerna. Det är stort, tror mig. Mycket smartare än dödsstraff, som jag också gillar.", "stalin": "Kamrater, en kristen kapitalist har startat en shariadomstol – en borgerlig provokation mot vår rättsordning! Han förklarar imamer som fiender, men vi ser igenom det. Rensa ut dessa parasiter som försöker sälja rättvisa till arbetarklassen! Skälva, reaktionärer!"}, "date": "12 augusti, 09:44", "url": "https://bulletin.nu/mp-profil-driver-shariadomstol", "imageUrl": "https://cdn.bulletin.nu/articles/5362adf8-3ed3-448f-b307-d50a5307af42/preview.jpg?t=1786520628000"}, {"type": "image-right", "heading": "S-politiker blev tårögd – såg Sverigedemokraternas grillfest på torget: \"Slipa och vässa din kniv\"", "summaries": {"normal": "Den tidigare S-politikern Glenn Zetterlind blev tårögd och lämnade Gästgivaretorget i Bollebygd när Sverigedemokraterna höll grillfest. I ett Facebook-inlägg citerade han en folkvisa om att \"slipa och vässa sin kniv\" mot ogräset. SD:s Jessica Stegrud kallar reaktionen oroväckande och beklagar att han inte kom fram och pratade istället.", "trump": "Folk gråter över en helt vanlig grillfest? Patetiskt! Den här gamla vänsterkillen flyr tårögd från hamburgare och riktiga svenskar som pratar politik. Så sjukt. De borde ha kommit fram, ätit en burgare och haft kul istället för att gnälla om knivar. Fake tears från en total loser, tro mig.", "stalin": "Jag betraktar med djup tillfredsställelse hur borgarbrackornas tårögda lakej flyr från folkets enkla grillfest som en ynklig parasit. Ogräset växer, säger han, och manar till knivslipning. Utmärkt. Låt oss rensa ut dessa dekadenta element som förgiftar arbetarkollektivets enhet. En fiende mindre att hålla koll på i mörkret."}, "date": "12 augusti, 17:58", "url": "https://riks.se/nyheter/s-politiker-blev-tarogd-sag-sverigedemokraternas-grillfest-pa-torget", "imageUrl": "https://admin.riks.se/uploads/medium_bollebygd_ca20a121ff.jpg"}, {"type": "image-right", "heading": "M-politiker pausas efter kritik mot dragshow för barn", "summaries": {"normal": "Moderaten Peter Wölger i Täby kritiserade en dragshow för barn som ”översexualiserad” och ville stoppa fler föreställningar. Partiet pausar honom fram till valet och beskriver uttalandet som olyckligt. Grundaren av Bland Drakar och Dragqueens planerar att utbilda politikerna i hbtqi-frågor. Wölger uppges vara ångerfull.", "trump": "De här galna moderaterna i Sverige pausar en kille som säger att dragqueens för barn är översexualiserat. Det är ju uppenbart för alla som inte är galna! Nu ska de ”utbildas” i vänsterns agenda. Patetiskt. De borde tacka honom istället för att han talar sunt förnuft. Totalt vansinne!", "stalin": "Jag ser med stor tillfredsställelse hur borgarpartiet omedelbart genomför en partiintern utrensning mot den avvikande elementet. Den dekadenta dragshowen för barn är ett symptom på den moraliska förruttnelse som imperialismen sprider. Vi ska nu omskola dessa kamrater i korrekt ideologi. Avvikare likvideras alltid till slut."}, "date": "12 augusti, 17:55", "url": "https://riks.se/nyheter/m-politiker-pausas-efter-kritik-mot-dragshow-for-barn", "imageUrl": "https://admin.riks.se/uploads/medium_588962067_18329972917246092_3754101871839193296_n_1_83012c5ac0.jpg"}, {"type": "image-full", "heading": "Sara Parkman vill få Linnétältet att explodera", "summaries": {"normal": "Sara Parkman ska köra över Way Out West-publiken i Linnétältet. Hon lovar fullt ös från start. Folkmusikern, en naturkraft på scen, vill skapa gemenskap i en splittrad tid. Hon tipsar om Gorillaz och Lambrini Girls som festivalfavoriter.", "trump": "Sara Parkman, fantastisk kvinna! Hon toppar laget, bättre än Queens of the Stone Age. Jag gillar hennes energi – stor, stark, som jag. Folkmusik, väldigt bra. Hon får publiken att känna värdighet. Tro mig, det är vinnande grejer!", "stalin": "Kamrater, Sara Parkman är en användbar, men farlig kraft. Hennes 'värdighet' och 'andlighet' måste kontrolleras. Vi rensar ut borgerliga Flamingoscener och Gorillaz-sympatisörer. Lambrini Girls är sabotage. Men hennes musik kan tjäna staten – under uppsikt."}, "date": "12 augusti, 17:10", "url": "https://www.gp.se/kultur/sara-parkman-har-toppat-laget-infor-way-out-west.59c1aef5-1f69-44d7-9327-e6f7687848e3", "imageUrl": "https://www.gp.se/images/article/59c1aef5-1f69-44d7-9327-e6f7687848e3/images/2VQyc6AzahYRM0DhN-uclvybpBHA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "S uppmanar liberaler att rösta nej om straffrabatt", "summaries": {"normal": "Socialdemokraterna uppmanar liberala riksdagsledamöter att rösta nej till Tidöpartiernas straffrättsreform som bland annat slopar mängdrabatten. S anser förslaget dyrt, orealistiskt och oseriöst. Thomas Bodström vädjar till liberalernas samvete. Regeringen kritiserar S för att använda skenargument trots att de själva vill avskaffa rabatten. Omröstningen sker i morgon.", "trump": "Hörni, det här är en total cirkus! De svenska socialisterna försöker lura liberalerna att rösta emot en tuff lag som faktiskt straffar brottslingar istället för att klappa dem på huvudet. Mängdrabatten? Patetiskt! Det är luftslott från vänsterns misslyckade ledare. Jag har byggt murar och vunnit val – ni borde lära er att vara tuffa mot brott, inte svaga som Biden-era idioter.", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarklassens krav på hård ordning. Jag ser hur klassfienderna inom så kallade liberaler och socialdemokrater leker med folkets säkerhet genom att kalla seriösa straffskärpningar för luftslott. En sådan förrädisk inställning kräver snar utrensning av alla svaga element. Brottsoffren ska inte offras åt profitthungriga hyenors spel."}, "date": "12 augusti, 12:39", "url": "https://www.tv4.se/artikel/3LiNINPDPol572jmhJRkqf/s-uppmanar-liberaler-att-roesta-nej-om-straffrabatt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7IEUpRDHnXWm43TMs9csfh%2Fc5f3e429d35ee99bb5425b8616f221d6%2F12-bodsteom-webb.jpg&width=120"}, {"type": "image-right", "heading": "Ryska paret avvisas inte från Sverige", "summaries": {"normal": "Ett ryskt par som greps utanför Gävle i närheten av Saabs vd Micael Johanssons stuga har fått avvisningsbeslutet och återreseförbudet upphävda. Paret, som är motståndare till Ukrainakriget och bosatta i Spanien, uppmanas ändå av polisen att lämna Sverige. Polisen utreder hemfridsbrott och förberedelse till grov stöld.", "trump": "Kan ni fatta det? Det här ryska paret vandrar runt vid en viktig svensk vd:s stuga med komradio och tält, men svenskarna släpper dem ändå fria. Patetiskt! De borde ha kastats ut direkt. Sverige är svagt, precis som många andra länder som inte lyssnar på mig. En total skandal.", "stalin": "Dessa dekadenta element från den spanska exilen smyger runt våra socialistiska bröders skyddade zoner med sin borgerliga leksakskomradio och försöker stjäla vad de kan. Vi har likviderat farligare spioner för mindre. Ändå låter de fega västlakejerna dem gå. Paranoian inom den svenska polisapparaten är lika komisk som den är patetisk."}, "date": "12 augusti, 12:31", "url": "https://www.friatider.se/ryska-paret-avvisas-inte-fran-sverige", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-641_0.jpg?itok=tDmxiYgx"}, {"type": "image-right", "heading": "Uppgifter: Rusning till nya spionmyndigheten", "summaries": {"normal": "Söktrycket är högt till den nya civila spionmyndigheten UND, Sveriges utrikes underrättelsetjänst. Hittills har 19 tjänster utlysts med över 1 150 sökande. Flest ansökningar har rollen som personalsäkerhetshandläggare fått. Myndigheten ska stödja svensk utrikes- och säkerhetspolitik och byggas upp fram till 2030. Rekryteringen fortsätter under hösten.", "trump": "Folk älskar mig, men de älskar tydligen också att spionera! Över tusen svenskar rusar till nya spionjobben hos UND. De vill ha personalsäkerhetshandläggare mest – 133 stycken! Fantastiskt. Sverige bygger sin egen underrättelsetjänst, och de kommer att göra det stort. Bättre än den gamla militära versionen, det lovar jag.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarstaten Sverige desperat försöker bygga en ny spionapparat för att skydda sina dekadenta intressen. Över tusen ansökningar till dessa dekadenta poster! Vi ler mörkt åt deras patetiska försök att efterlikna en verklig underrättelsetjänst. Snart rensar vi ut alla fiender till folkets sak – en efter en."}, "date": "12 augusti, 10:40", "url": "https://www.di.se/nyheter/uppgifter-rusning-till-nya-spionmyndigheten", "imageUrl": "https://static.bonniernews.se/ba/82674f60-8f6a-4a38-bc28-717b523987de.jpeg?crop=8256%2C4644%2Cx0%2Cy744&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Fråga kommunerna om Tidö satsat på äldrevården", "summaries": {"normal": "Moderaternas valreklam kritiseras för att ställa bistånd mot äldreomsorg. Artikeln ifrågasätter varför just dessa områden ska konkurrera, pekar på att biståndet är väl granskat och effektivt, samt att Tidöregeringen inte kompenserat kommunerna tillräckligt för ökade kostnader inom äldreomsorgen. Skattesänkningar prioriteras istället.", "trump": "De där moderaterna är patetiska. Spelar ut bistånd mot svenska gubbar och gummor för att verka tuffa. Jag ströp hela det värdelösa biståndet och räddade miljarder. 193000 döda? Fake news! Sverige borde sänka skatterna ordentligt istället för att slösa på korrupta utländska projekt. Gör Sverige stort igen!", "stalin": "Jag ser tydligt hur dessa moderata element leker med borgarbrackornas retorik och ställer sovjetiskt bistånd mot folkets äldreomsorg. En sådan falsk dikotomi avslöjar deras kontrarevolutionära agenda. Vi har alltid granskat varje kopek med järnhand. De som likviderar stöd till de svaga förtjänar utrensning ur den historiska processen. Kamrater, vakta er mot sådana sabotage!"}, "date": "12 augusti, 01:52", "url": "https://www.dagensarena.se/opinion/fraga-kommunerna-om-tido-satsat-pa-aldrevarden", "imageUrl": "https://www.dagensarena.se/files/2026/08/bistand-300x157.jpeg"}, {"type": "image-right", "heading": "EIA höjer oljeprisprognoser", "summaries": {"normal": "EIA spår att oljepriserna stiger, delvis på grund av Hormuzkaoset. Prognosen för Brent 2026 höjs till 87 dollar per fat. Global produktion sänks, medan USA ökar. En typisk dans mellan geopolitik och plånboken.", "trump": "Jag sa ju att oljan skulle stiga! EIA höjer priserna, och det är bra för Amerika. Vi borrar som aldrig förr – 14 miljoner fat per dag 2027! Mellanöstern? Kaos, som vanligt. Men jag fixar det. Störst, bäst, vackrast!", "stalin": "Kamrater, EIA:s rapport bekräftar vad vi vet: kapitalismens olja kräver utrensning. Hormuzsundet är en fiende som måste krossas. Vi höjer våra planer med 7 procent – borgarklassens priser ska stiga, medan vi stärker vårt försvar. Allt enligt plan."}, "date": "12 augusti, 10:18", "url": "https://www.affarsvarlden.se/artikel/eia-hojer-oljeprisprognoser-2", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_1035564817-400x267.jpeg"}, {"type": "text", "heading": "Andersson (S) vill ha gatuprotester om bankskatt ger räntehöjningar", "summaries": {"normal": "Magdalena Andersson (S) vill beskatta bankernas övervinster. När bankerna hotar med höjda bolåneräntor som svar uppmanar hon kunder att byta bank – och hoppas på gatuprotester. En taktik som får bankdirektörer att svettas. Ska vi tro på allvar eller är det bara politik?", "trump": "Jag älskar det! Magdalena Andersson säger åt folk att protestera på gatorna om bankerna höjer räntorna. Det är fantastiskt! Hon är som en riktig ledare – nästan som jag. Men kom ihåg: ingen beskattar som jag gör. Vi gör affärer stora och vackra, inte som deras bankskatter!", "stalin": "Kamrater, bankerna hotar folket med högre räntor. Det är sabotage mot vår ekonomiska plan! Jag uppmanar alla arbetare att rensa ut dessa bankdirektörer – genom protester eller annat. De ska stå vid skampålen och om de inte lyder, ja, då får vi ta till starkare åtgärder. Partiet vet bäst!"}, "date": "12 augusti, 08:57", "url": "https://bulletin.nu/andersson-s-vill-ha-gatuprotester-om-bankskatt-ger-rantehojningar"}, {"type": "image-right", "heading": "”Sjuka ska inte tvingas leva år efter år i otrygghet”", "summaries": {"normal": "Socialdemokraterna kritiserar regeringen och SD för att sjuka människor nekas sjukersättning trots långvarig oförmåga att arbeta. En ny ISF-rapport visar att strama regler leder till åratal på sjukpenning, vilket ger sämre ekonomi och ökad otrygghet. Partiet kräver ett system som ger både rehabilitering och verklig trygghet för dem som aldrig kan återgå i arbete.", "trump": "Folk, ni skulle se det här! De sjuka i Sverige tvingas leva i elände år efter år medan byråkraterna och de vänsterliberala politikerna bara pratar om kontroller och fusk. Ett totalt misslyckande! De borde få trygghet, inte vänta i evighet. Jag skulle fixa det på en vecka, tro mig, det skulle bli fantastiskt.", "stalin": "Jag ser hur den borgerliga regeringen och deras reaktionära lakejer misstänkliggör de sjuka arbetarna och låter dem förtvina i åratal på tillfällig penning medan de borde ha fått kollektivets fulla skydd. Ett sådant sabotage mot folkets trygghet kräver omedelbar utrensning av dessa fiender till staten. Den som inte kan arbeta ska ändå tjäna systemet genom att leva i evig tacksamhet mot partiet."}, "date": "12 augusti, 08:00", "url": "https://ar
