enna så kallade fondupphandling och funnit att den utgör en nödvändig utrensning av de tre kapitalistiska parasitfonderna som sugit musten ur arbetarnas pensionsmedel. Borgarbrackorna Lannebo, Allianz och BL förtjänar att likvideras från torget. Vi, partiet och spararna, behåller två fonder till lägre avgifter vilket är en seger för kollektivet. De 700 avfällingar som ännu klamrar sig fast vid de utvalda fienderna skall ges en sista chans att underkasta sig eller automatiskt omplaceras. Detta stärker pensionerna och krossar de finansiella sabotageelementens inflytande. Härligt att se hur fienderna skriker medan de rensas ut."}, "date": "28 maj, 10:01", "url": "https://www.di.se/nyheter/klart-fyra-europeiska-smabolagsfonder-pa-nya-torget/"}, {"type": "image-full", "heading": "Filmtipsen blev SVT-bråk: ”Bara vita män”", "summaries": {"normal": "Regissörerna Felix Herngren och Ruben Östlund gästade SVT:s Morgonstudion för att diskutera en ny digital plattform som ska erbjuda filmer påverkade av mänsklig smak snarare än algoritmer. Under inslaget tipsade de om egna favoriter, vilket ledde till en ordväxling när en programledare påpekade att deras tips ofta kommer från vita män. Samtalet återgick sedan till plattformen.", "trump": "Jag såg Herngren och Östlund på Morgonstudion. De pratar om sin nya 'mänskliga' plattform – jag skulle ha gjort det mycket större och bättre, det skulle ha varit fantastiskt. Sen kommer den där programledaren och säger att de bara tipsar om vita män, typ som jag alltid vinner mot de där medierna. Jag skulle ha gett dem fantastiska tips, de bästa, de skulle älskat det.", "stalin": "I den svenska bourgeoisa mediemonstret Morgonstudion försökte två regissörer, Herngren och Östlund, propagera sin individualistiska plattform mot den kollektiva algoritmens överhöghet. Under utfrågningen anklagades de för att endast återge dekorativa verk från dekapenserade vita män. Deras försvar var svagt, vilket bevisar att deras 'smak' är en fara för den socialistiska kulturen. Vi måste skydda det ryska folks modersmål och intressesfärer mot sådana dekadenta inflytanden."}, "date": "28 maj, 10:01", "url": "https://bulletin.nu/filmtipsen-blev-svt-brak-bara-vita-man", "imageUrl": "https://cdn.bulletin.nu/articles/450b71da-6651-4a63-970e-945f2671fa95/preview.png?t=1779952346000"}, {"type": "image-right", "heading": "Tusentals på Roms gator – kräver slut på krig och höjda löner", "summaries": {"normal": "Uppemot 15 000 arbetare från olika sektorer demonstrerade i Rom den 23 maj mot krigsekonomin och stigande levnadskostnader. Arrangören Unione Sindicale di Base krävde högre löner, satsningar på välfärd och en ny industriell strategi där arbetarna får inflytande. Manifestationen visade solidaritet med Palestina, Kuba och andra länder som drabbas av imperialism. Enligt ISTAT lever 11 miljoner italienare nära eller i fattigdom.", "trump": "Titta på det här, tusentals italienska arbetare som fyller Roms gator och skriker efter högre löner och att lägga ner vapnen. De har tröttnat på den vansinniga krigsekonomin som suger ut dem medan priserna skenar. Smart folk! De ser hur de globala imperialisterna och de korkade ledarna i Europa förstör allt. Amerika först, men det här är vad som händer när man glömmer sina egna arbetare. Fantastiskt, verkligen.", "stalin": "Vi, arbetarna och kamraterna, samlas åter i Rom för att kräva att borgarbrackorna och de västerländska imperialisterna lägger ner sina krigsleksaker och höjer lönerna. Klassfiendens blodsugande politik driver elva miljoner till fattigdomens rand medan de göder sin krigsmaskin. Jag ser genom deras lögnaktiga rapporter. En ny utrensning av folkfienderna och exploaterande byfånar behövs. Arbetets seger är oundviklig, kamrater. De kommer att skratta – kortvarigt."}, "date": "28 maj, 09:58", "url": "https://proletaren.se/artikel/tusentals-pa-roms-gator-kraver-slut-pa-krig-och-hojda-loner/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/USB-Rom-maj-2026-768x432.jpg"}, {"type": "image-right", "heading": "Ett inställt Folkets Hus-framträdande är också ett framträdande.", "summaries": {"normal": "Folkets Hus i Borlänge ställde in ett evenemang med Henrik Jönsson, Jan Emanuel och Aron Flam eftersom det ansågs bryta mot deras värdegrund. Bakgrunden är att Aron Flam åtalas för olaga hot mot en miljöpartist på plattformen X. Beslutet har väckt stark kritik från högerhåll med anklagelser om censur. Artikelförfattaren försvarar Folkets Hus rätt som förening att själva bestämma över sina lokaler och evenemang, trots kommunala bidrag, och jämför med andra organisationers frihet att välja sina samarbetspartners.", "trump": "Folkets Hus i Borlänge ställde in en fantastisk tillställning med några riktiga vinnare bara för att de inte gillade vad de hörde. Totalt woke! De pratar om värdegrund men det handlar bara om att tysta konservativa röster. Jag älskar föreningsfrihet, men de här vänsterfigurerna vill ha statlig kontroll fast de får skattepengar. Patetiskt. Nu har de tre killarna blivit stora snackisar tack vare det här – gratulerar, det blev en jättesuccé ändå. Fake outrage från vänstern som vanligt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa dekadenta högeragitatorer som smyger sig in i våra folkets hus som maskar i en socialistisk äpplekaka. Folkets Hus gjorde rätt i att omedelbart rensa ut dessa borgerliga provokatörer och deras olagliga hot. Vi tillåter inte att kapitalistiska element förgiftar arbetarklassens lokaler med sin paranoiaframkallande propaganda. Låt högerbubblorna skrika – deras indignation är som en fiendes sista skälvande andetag före utrensningen. En inställd sammankomst är blott en seger för folkets enhetliga linje."}, "date": "28 maj, 09:55", "url": "https://www.dagensarena.se/opinion/foreningsfriheten-galler-aven-folkets-hus/", "imageUrl": "https://www.dagensarena.se/files/2026/05/folket-hus.jpeg"}, {"type": "text", "heading": "Skulder drivs in med AI-bottar – trots att de ringer fel", "summaries": {"normal": "Amerikanska inkassobolag har börjat använda AI-styrda röstassistenter för att driva in skulder i stor skala. Tekniken möjliggör dygnet-runt-hantering och lägre kostnader, men kritiseras för att vara oflexibel och felaktig. Många vittnar om att AI:n kräver betalning för skulder som redan reglerats. Bristen på mänsklig kontakt vid problem försvårar situationen för konsumenter, vilket nu har lett till att amerikanska myndigheter granskar branschens användning av tekniken och dess påverkan på konsumentskyddet.", "trump": "Inkassobolagen i USA har blivit helt galna! De använder AI-robotar för att jaga folk, och de gör det fel hela tiden. Robotarna kräver pengar för skulder som redan är betalda. Det är en total katastrof! Jag har skapat den bästa ekonomin någonsin, men de här företagen skickar ut maskiner som inte vet någonting. De saknar den mänskliga touchen – min touch! Myndigheterna granskar dem nu, och det är på tiden. Vi ska ha ordning och reda, inte robotar som tjafsar!", "stalin": "Vi ser hur det amerikanska kapitalet desperat försöker automatisera sitt förfall. Dessa maskiner – utan själ, utan samvete – trakasserar folket för obetydliga skulder, precis som de korrupta byråkraterna i Washington. Det är en brist på disciplin att låta algoritmer styra. Precis som Putin rensar upp i sitt närområde, måste vi förstå att teknik utan statlig kontroll bara är ett verktyg för kaos. Vi ser här fienden: den felprogrammerade teknokraten som tror att siffror väger tyngre än statens vilja."}, "date": "28 maj, 09:55", "url": "https://www.realtid.se/it-tech/skulder-drivs-in-med-ai-trots-att-de-ringer-fel/"}, {"type": "image-full", "heading": "S importerade 100 000 arbetslösa — nu skyller de på andra", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha bidragit till ökad arbetslöshet genom en ansvarslös migrations- och integrationspolitik sedan 2014. Befolkningen har vuxit med 840 000 personer, varav en stor del är utrikes födda med svag anknytning till arbetsmarknaden. Arbetslösheten bland utrikes födda ligger på 12–16 procent jämfört med 3–6 procent bland inrikes födda. Författaren menar att Tidö-regeringen lyckas vända ekonomin positivt genom att sänka skatter och bidrag, till skillnad från Socialdemokraternas politik.", "trump": "Folk, ni kan inte tro hur patetiskt det är. De där socialisterna importerade 100 000 lata jobbmisslyckanden och nu skyller de på oss? Det är en total katastrof, en riktig röra. Magdalena, den förlorande förloraren, vill inte prata om att det är hennes egna misslyckade öppna gränser som skapade detta kaos. Vi fixar ekonomin, vi får tillväxten att explodera medan de bara höjer skatter och bidrag. Patetiskt. Sverige vinner igen, tro mig.", "stalin": "Kamrater, jag ser den klassfiendens lögnpropaganda som ett fegt försök att dölja den borgerliga sabotageverksamheten. Vi har rensat ut folkförtryckartrollen tidigare och skall göra det igen. Dessa socialdemokratiska opportunister importerade arbetslöshetens parasiter medan de låtsades bygga folkets framtid. Deras eftersläpning är ett monument över revisionistisk svaghet. Den icke-produktiva gruppen skall integreras genom kollektiv disciplin, inte genom kapitalistmaffians falska löften. Fienden inom murarna skall alltid avslöjas."}, "date": "28 maj, 03:28", "url": "https://samtiden.nu/2026/05/s-importerade-100-000-arbetslosa-nu-skyller-de-pa-andra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "text", "heading": "Train Alliance: EU-bidrag och polisanmälan", "summaries": {"normal": "Börsnoterade Train Alliance är handelsstoppad efter polisanmälningar mot grundaren Otto Persson. En oberoende rapport avslöjar fabricerade hyresavtal och missvisande redovisning, samt försvunna kortfristiga placeringar på 170 miljoner kronor. Bolaget har samtidigt fått 28,7 miljoner euro i EU-bidrag för ett järnvägsprojekt och besökts av infrastrukturminister Andreas Carlsson.", "trump": "Vad är det här för en skandal? Train Alliance, som jag aldrig hört talas om, är fullkomligt utslocknad. De har stulit pengar, fabricerat dokument – typiskt förlorartaktigt beteende. Och ändå får de EU-pengar? Jag skulle ha stoppat det genast. Min administration skulle aldrig tolerera detta. De besöktes av en minister? Jag skulle ha sagt nej. Nej, nej, nej.", "stalin": "Detta är en klassisk handling från de fega sabatörerna inom vårt eget folk. Train Alliance, en enhet som vi beviljat statliga medel för att stärka järnvägarna, visar sig vara full av antitrygghet. De har förvrängt redovisningen och försvunnit med pengar – ett direkt angrepp på statens ära. Vi måste rensa ut de här elementen. Parallellen till väst är tydlig: deras korruption är en svaghet vi utnyttjar. Vi ska se till att deras EU-bidrag förvandlas till en fälla för dem."}, "date": "28 maj, 08:11", "url": "https://www.affarsvarlden.se/artikel/train-alliance-eu-bidrag-och-polisanmalan"}, {"type": "image-full", "heading": "16 000 anmälda försvunna i VM-staden", "summaries": {"normal": "I Guadalajara, som ska stå värd för fyra VM-matcher, rapporteras över 16 000 personer saknade. Sedan kriget mot den organiserade brottsligheten inleddes för 20 år sedan har mer än 130 000 försvunnit i Mexiko. Anhöriga från kollektivet Madres Buscadoras letar efter sina nära och kära i misstänkta massgravar nära VM-arenan. De kritiserar myndigheterna för att mörka problemen och måla upp en falsk bild inför fotbolls-VM.", "trump": "Titta på det här, det är en katastrof. Mexiko har 16 000 försvunna bara i VM-staden Guadalajara, och de gräver efter ben i jorden bredvid arenan. Kartellerna styr showen medan de korrupta myndigheterna spenderar miljoner på ett VM ingen ville ha. De målar upp en fejkad verklighet för att lura alla turister. Patetiskt. De borde fixa sina problem istället för att spela teater inför hela världen. En skam!", "stalin": "Kamrater, jag betraktar med kall förakt hur denna kapitalistmaffia i Mexiko har förvandlat försvinnanden till ett verktyg för terror och makt. Medan de slösar miljoner på ett oönskat VM gräver mödrar i jorden efter sina söner. De lokala folkförtryckartrollen döljer sanningen och målar en lögnaktig bild. Detta är imperialismens ansikte. Vi skulle ha genomfört en grundlig utrensning av dessa blodsugande karteller och deras lakejer för länge sedan."}, "date": "28 maj, 07:03", "url": "https://www.tv4.se/artikel/1R6gqa9pX2kjbUFuitGa5A/vm-staden-med-en-epidemi-av-foersvinnanden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F56B92tZUGsLD67G9M2KtD9%2F457a89b16c99fe8e00e1a671866bdf31%2F28-vm.jpg&width=1024"}, {"type": "image-full", "heading": "Carl Eos: Media mörkar sanningen om utvisade uzbeker", "summaries": {"normal": "Artikeln kritiserar svenska medier för att i reportage om en uzbekisk familj som ska utvisas fokusera på känslomässiga skildringar av tårar och otrygghet, medan relevant information utelämnas. Bland annat nämns att en person drog kniv vid polisens besök och att familjen trotsat 47 utvisningsbeslut under 20 år. Författaren ser detta som ett exempel på vinklad journalistik med ideologiska syften, vilket bidrar till minskat förtroende för medier och hot mot demokratin.", "trump": "De svenska fakemedierna är riggade, folk! Dom pumpar ut snyftreportage om uzbeker som gråter och spelar offer, men nämner inte att dom dragit kniv mot polisen och struntat i FYRTIOSJU utvisningsbeslut på tjugo år. Fyrtio-sju! Dom vet sanningen men mörkar den som fuskvalet 2020. Media är vänsterns kampanjmaskin, de vill ha Andersson tillbaka. Men folket ser igenom bluffen. Det är en skandal, en total skandal!", "stalin": "Kamrater, jag betraktar med avsky hur borgarpressen i detta dekadenta land konstruerar falska narrativ om utvisade element för att underminera rättsstaten. De döljer att dessa individer dragit kniv och trotsat 47 beslut – en uppenbar kontrarevolutionär handling. Vi ser hur journalisterna agerar som klassfiender och opinionsmanipulatörer. En sådan systematisk desinformation kräver utrensning av alla lögnare. Demokratin hotas av dessa parasitiska redaktioner. De ska tystas."}, "date": "27 maj, 14:27", "url": "https://samtiden.nu/2026/05/carl-eos-media-morkar-sanningen-om-utvisade-uzbeker/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/698aa78d-d32b-466a-b8bb-868da9aedc2b-1280x720.png"}, {"type": "image-right", "heading": "Wold är glasklar – med sin pinsamma extremism i transfrågan", "summaries": {"normal": "I en ledare kritiserar Johan Ehrenberg Agnes Wold för att hon offentligt sagt sig vilja bryta mot den nya lagen mot omvändelseförsök på transpersoner. Ehrenberg likställer omvändelse med tortyr och förtryck, refererar till FN:s ställningstagande och varnar för att sådana metoder kan leda till självmord bland unga. Han anser att Wold sprider konspirationsteorier om en translobby och kritiserar både henne och Sveriges Radio för att ge henne plattform. Även Ebba Busch får kritik för att försvara Wolds yttrandefrihet.", "trump": "Folk, ni skulle inte tro det, men den här galna Agnes Wold är en total loser i transdebatten. Hon säger rakt ut att hon vill bryta mot lagen och köra omvändelse på barn – rena tortyren! Och den svenska radion älskar henne, kan ni fatta? Det är som om de anställer en rasist som lovar att inte snacka om rasism. Patetiskt! Cancelkultur är uselt, men att uppmana till lagbrott mot barn är ännu värre. Sverige håller på att bli ett skämt, tro mig.", "stalin": "Kamrater, denna Wold är en klassfiende i förklädnad, en pinsam extremisthund som skäller mot folkets framsteg och vill utföra tortyrliknande omvändelse på osäkra barn. Hon sprider lögnaktiga konspirationer om en så kallad translobby som hotar arbetarklassens frihet. Vi ser igenom hennes föraktfulla spel. Lagen mot detta förtryck är nödvändig för att skydda ungdomen från borgarbrackornas reaktionära metoder. Den som uppviglar till lagbrott förtjänar att rensas ut ur offentligheten. Folkets dom är glasklar."}, "date": "28 maj, 07:44", "url": "https://www.etc.se/ledare/wold-aer-glasklar-med-sin-pinsamma-extremism-i-transfraagan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "SD kräver ökade bidrag till samisk kultur", "summaries": {"normal": "Sverigedemokraterna vill öka statens bidrag till Sametinget för att stärka samisk kultur och språk. Partiledaren Jimmie Åkesson och vice partiledaren Henrik Vinge lyfte frågan vid ett seminarium i riksdagen med samiska företrädare. De betonar att samiskans fortlevnad är viktig för hela landet och föreslår bland annat stärkt fjärrundervisning samt fler möjligheter att välja samiska på lärarutbildningar. Åkesson konstaterar att kostnaden är liten i budgetsammanhang.", "trump": "Folk, ni skulle se det här – till och med SD börjar fatta det. Samerna behöver mer pengar för att rädda sitt språk och sin kultur, och det är faktiskt en bra idé. Jimmie Åkesson och hans team har rätt, det handlar om småpengar för ett stort värde. Vi älskar starka kulturer, inte denna svenska svaghet som låter allt dö ut. Gör det stort, gör det samiskt, och gör det vinnande igen.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa sverigedemokratiska element äntligen erkänner det historiska värdet av att skydda minoriteters språk mot den förtryckande tystnadens kontrarevolution. Vi skall naturligtvis skjuta till enorma resurser till detta samiska kollektiv för att krossa den borgerliga likgiltighetens sabotage. Fjärrundervisningen blir ett vapen mot de imperialistiska dialektförnekarna. De som viskar om kostnad är fiender till folket och bör rensas ut med ett leende. Det är en mycket underhållande småsak i den stora kampen."}, "date": "28 maj, 08:54", "url": "https://www.friatider.se/sd-kraver-okade-bidrag-till-samisk-kultur", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/norske_samer_karin_beate_nosterud.jpg?itok=WOEq9I35"}, {"type": "image-right", "heading": "Rika går i taket när S och V bråkar om fastighetsskatt", "summaries": {"normal": "Artikeln diskuterar hur rika reagerar på vänsterpartiers idéer om fastighetsskatt. Nuvarande tak på fastighetsavgiften gynnar de allra rikaste medan de med billigare hus betalar relativt mer. Skribenten menar att en omformad skatt kan göras rättvisare genom att lätta på de med lägre värden och höja för de med mycket dyra fastigheter, som i USA:s mansion tax. Pengarna skulle gå till välfärd, infrastruktur och försvar. Majoriteten av svenska husägare skulle gynnas.", "trump": "Folk, ni skulle se hur de rika flippar ut över den här fastighetsskatten! S och V vill bara ta från de smarta som byggt upp allt och ge till sin stora massa. Det är en katastrof, en total katastrof. Mitt folk i USA har mansion tax på de riktigt dyra husen och det funkar. Här i Sverige betalar de med små hus mer än miljardärerna – galet! Jag skulle fixa det så de flesta vinner, inte bara de rika eliterna som hatar mig.", "stalin": "Kamrater, dessa borgarbrackor och deras lakejer i högern vrider sig som maskar när vi talar om att återställa rättvisan genom fastighetsskatt. Deras tak på avgiften är en listig fälla som kramar proletären medan de rika parasiterna simmar i lyx. Jag, som ledare för folkets vilja, ser hur vi ska rensa ut dessa klassfiender och deras falska privilegier. De som gömmer sig i sina palats över 13 miljoner ska likvideras ekonomiskt till förmån för kollektivet. Snart ska vägarna glänsa, välfärden blomstra och de dekadenta villaägarna skrika i harmoni. Paranoia? Nej, det är bara deras skugga som viskar svek."}, "date": "28 maj, 07:08", "url": "https://arbetet.se/2026/05/28/rika-gar-i-taket-nar-s-och-v-brakar-om-fastighetsskatt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/28070600/fastighetsskatt-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nya allvarliga attacker mellan USA och Iran", "summaries": {"normal": "USA har genomfört attacker mot Iran under natten mot torsdagen, bland annat genom att skjuta ner iranska drönare och slå till mot en bas i Bandar Abbas. Iran svarade med ett angrepp mot en amerikansk militärbas. Striderna är de allvarligaste sedan vapenvilan i april och hotar de pågående fredsförhandlingarna. Attackerna kopplas till incidenter i Hormuzsundet där Iran avfyrat skott mot fartyg. Båda sidor beskriver sina insatser som defensiva.", "trump": "Vi har precis genomfört underbara, exakta attacker mot Iran och skjutit ner deras patetiska drönare. De trodde de kunde stänga Hormuzsundet och hota oss, men vi tog hand om det snabbt och smart. Iran sköt tillbaka mot en av våra baser, typiskt, men våra insatser var defensiva och perfekta. De förhandlar med oss genom Pakistan och nu har de fått ett fantastiskt avtal på bordet. Ingen gör det bättre än oss, tro mig.", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta imperialisterna i Washington och Teheran river sönder sin bräckliga vapenvila som en rutten borgerlig illusion. Vi, arbetarklassen och partiet, ler åt dessa clownaktiga drönarkrig och provokationer i Hormuzsundet. De kapitalistiska brackorna kallar det självförsvar medan de i hemlighet planerar att krossa varandra. Kanske är det dags att rensa ut alla dessa opålitliga element innan de drar med sig hela Mellanöstern i sin paranoiafyllda dans. Underbart underhållande."}, "date": "28 maj, 08:23", "url": "https://www.di.se/nyheter/nya-allvarliga-attacker-mellan-usa-och-iran/", "imageUrl": "https://static.bonniernews.se/ba/304e89f2-3230-4113-ac2d-4fb8bf3f9cc9.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "62 000 arbetslösa fick chock­besked om sänkt ersättning", "summaries": {"normal": "Över 62 000 arbetslösa har drabbats av sänkt aktivitetsstöd efter nya regler som trappas ned var hundrade dag. Många tvingas låna pengar, gå i pension i förtid eller skippa måltider. Forskare kritiserar regeringens motiv och menar att åtgärden inte ökar sysselsättningen utan istället förvärrar situationen för dem som redan har svårt att få jobb. Flera intervjuade uttrycker frustration, ekonomisk stress och rädsla för framtiden.", "trump": "Titta på det här, det är en total katastrof. Sverige sänker bidragen för 62 000 lata arbetslösa och plötsligt gråter de och lånar av sina egna barn. De säger att de vill jobba, men ingen anställer dem – kanske för att de är för gamla eller för lata, vem vet. Regeringen gör äntligen rätt, men det räcker inte. Ni behöver en riktig ledare som fixar ekonomin så att alla vinner stort, inte bara de som sitter hemma och klagar.", "stalin": "Kamrater, detta är en uppenbar sabotagehandling utförd av borgarbrackorna inom den så kallade regeringen. Jag har personligen observerat hur dessa 62 000 parasiter gnäller över minskade bidrag medan de i hemlighet planerar att underminera folkets kollektiva framåtskridande. Vi ska rensa ut alla som gömmer sig bakom ålder och funktionsnedsättningar som ursäkter för att inte arbeta för staten. Snart kommer utrensningen av dessa latmaskar att leda till en ny, strålande era av produktivitet – eller så hamnar de hos socialtjänsten, där de hör hemma i sina egna elände. Ha ha, vilken underbar ironi."}, "date": "28 maj, 06:00", "url": "https://arbetet.se/2026/05/28/62-000-arbetslosa-fick-chockbesked-om-sankt-ersattning/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/25143017/arbetslosa-tredelad.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Metoden som hjälper dig att överleva drunkning", "summaries": {"normal": "Köldchock vid drunkning kan leda till panik och snabb död. Det brittiska livräddningssällskapet RNLI lanserade 2017 en kampanj för att flyta på rygg, något som räddat minst 50 liv. I Sverige är drunkning ett allvarligt problem, särskilt bland män över 50 år och barn med utländsk bakgrund. Svenska Livräddningssällskapet vill öka simkunnighet och vattensäkerhet. Att flyta ingår redan i svensk simundervisning, men ingen nationell kampanj planeras.", "trump": "Folk ramlar i vattnet och drunknar på grund av dåliga ledare och ingen planering. Jag älskar det brittiska sättet att flyta på rygg – det är fantastiskt, det räddar liv, de säger femtio stycken redan. I Sverige drunknar män över femtio och invandrarungdomar, väldigt tragiskt. De borde simma bättre, inte som några losers. Mina vattenkunskaper är de bästa, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, när den kapitalistiska köldchocken slår till från det reaktionära vattnet, avslöjar den genast de svaga elementen i samhället. Jag har länge varnat för att borgarbrackornas oplanerade badutflykter leder rakt in i imperialismens kalla famn. Vi ska likvidera okunnigheten genom kollektiv vattenvana och systematisk utrensning av alla simovilliga element. Vårt parti lär ut att flyta på rygg som en socialistisk plikt – de som vägrar är fiender till folket och bör behandlas därefter med munter effektivitet."}, "date": "28 maj, 09:14", "url": "https://www.svt.se/nyheter/inrikes/metoden-som-hjalper-dig-att-overleva-drunkningsolyckan", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.51/0.43/28d037aa1f5bad15eea58dc6cde797b85a26c694f0c82c8d96fc3db32f35e8f8"}, {"type": "image-right", "heading": "Mätning: Nationell samling vinner presidentvalet", "summaries": {"normal": "En ny mätning visar att Jordan Bardella från Nationell samling leder klart inför det franska presidentvalet 2027. Han får 32 procent i första omgången och skulle besegra Édouard Philippe med 52 mot 48 procent i en andra omgång. Philippe backar till 17 procent, strax före Jean-Luc Mélenchon på 16 procent. Emmanuel Macrons popularitet är fortsatt låg med endast 23 procent positiva omdömen. Det är oklart om Bardella eller Marine Le Pen blir partiets kandidat.", "trump": "Folk älskar mig för att jag alltid har rätt, och titta på Frankrike nu. Den smarta killen Bardella från Nationell samling krossar alla med 32 procent redan i första rundan. Han skulle vinna mot den svaga Philippe med 52 mot 48. För två månader sen var det tvärtom, typiskt för losers. Macron är en total katastrof med bara 23 procents stöd. Frankrike behöver en riktig ledare, inte de där globalisterna som förstör allt. Fantastiska siffror!", "stalin": "Kamrater, denna mätning bekräftar att den folkliga kraften samlas mot de dekadenta resterna av borgarbrackorna. Jag ser med stor tillfredsställelse hur Bardella krossar den arrogante Philippe och den farliga opportunisten Mélenchon i en utrensning av valurnorna. Den förrädiska Macron med sina 23 procents stöd är en patetisk rest som vi snart ska likvidera politiskt. Våra fiender muterar som råttor i mörkret, men partiet vakar. Inga kompromisser med kapitalisterna. Segern tillhör oss."}, "date": "28 maj, 07:19", "url": "https://www.friatider.se/matning-nationell-samling-vinner-presidentvalet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-33_1.jpg"}, {"type": "image-full", "heading": "Jämställdhetsministern kritiserar Agnes Wold", "summaries": {"normal": "Jämställdhetsminister Nina Larsson (L) kritiserar Agnes Wold för hennes uttalanden om transpersoner, där Wold sagt att hon skulle försöka övertyga ett barnbarn att man inte kan vara född i fel kropp. Larsson kallar Wolds kommentarer för attacker på utsatta personer och betonar vikten av respekt. Från 1 juli blir omvändelseförsök straffbart. Ebba Busch (KD) försvarar Wolds yttrandefrihet och varnar för cancelkultur.", "trump": "Titta bara på det här, folks! Jämställdhetsminister Larsson, som inte ens kan stava till 'jämställdhet', går till angrepp mot den fantastiska professorn Agnes Wold. Wold, en kvinna med ryggrad, säger sanningen om transfrågan, och vad gör Larsson? Jo, hon twittrar som en förvirrad tonåring! Och sedan har vi Ebba Busch, en stark kvinna som förstår yttrandefrihet. Cancelkultur? Nej tack, vi vill ha SANNING!", "stalin": "Kamrater! Ännu en gång ser vi bourgeois-liberalernas förräderi mot folket. Denna så kallade 'jämställdhetsminister' Larsson, en svag och ynklig lakej för dekadenta västideal, vågar kritisera vår kära kamrat Agnes Wold. Wold, en sann försvarare av traditionella värden, attackeras för att hon avslöjar de perversa idéerna om 'fel kropp'. Vi måste krossa dessa psykologiska våldtäktsmän! Och notera hur den lilla kapitalistiska hyndan Busch försvarar yttrandefrihet – ett verktyg för kontrarevolutionärer. Vi ska utrota denna sjuka ideologi, precis som vi utrotade kulakerna!"}, "date": "27 maj, 19:01", "url": "https://kvartal.se/nyheter/artiklar/jamstalldhetsministern-kritiserar-wolds-attacker/cG9zdDoxMTgxNjg", "imageUrl": "https://images.kvartal.se/2026/05/4bcc0f97-larsson.webp"}, {"type": "image-right", "heading": "Livräddarna varnar: Dyk inte ner i vattnet under värmebölja", "summaries": {"normal": "Livräddarna varnar för att hoppa i kallt vatten under värmebölja. Flera drunkningsolyckor har inträffat i Frankrike och Storbritannien vid temperaturer uppemot 40 grader. Enligt Svenska Livräddningssällskapets talesperson Mikael Olausson kan den plötsliga kylan orsaka köldchock som leder till okontrollerad hyperventilation och risk för att dra in vatten i lungorna. Han betonar att det inte främst handlar om hypotermi utan om den överraskande effekten av kallt vatten efter solvärme.", "trump": "De här idioterna i Europa dör som flugor bara för att de kastar sig i det iskalla vattnet mitt i en jättevärmebölja. Patetiskt. Jag har alltid sagt att man inte ska underskatta naturen, men de lyssnar inte. Kallt vatten efter 40 graders hetta? Det är en total katastrof, tro mig. De borde lyssna på experterna istället för att göra dumma saker. Amerika gör det rätt, vi har de bästa reglerna, de bästa varningarna. Europa borde lära sig av oss.", "stalin": "Kamrater, dessa oansvariga element som kastar sig i det kontrarevolutionära kalla vattnet under borgarklassens heta sol är ett hot mot folkets kollektiva hälsa. Jag ser hur den imperialistiska värmen lockar arbetarna i en fälla av köldchock och drunkning, orkestrerad av västerländska sabotörer. Vi måste rensa ut alla som underskattar naturens dialektik och likvidera den farliga vanan att glömma vattnets tio grader. Partiet kräver försiktighet, annars blir det utrensning i badsäsongen. Sovjetisk disciplin räddar liv."}, "date": "28 maj, 09:08", "url": "https://www.svt.se/nyheter/inrikes/livraddarna-varnar-dyk-inte-ner-i-vattnet-under-varmebolja", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.52/0.57/8c68d964eeb70d4e924f4f8bbe064c01fac115bf69a868495b55260278fa8c38"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-full", "heading": "Zelenskyj vädjar till Trump om mer ammunition till Ukraina", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj har skickat brev till både Donald Trump och USA:s kongress där han vädjar om mer ammunition, särskilt till Patriot-systemet, samt fortsatt stöd till andra vapensystem. Zelenskyj betonar att det är ovanligt men nödvändigt med tanke på läget i kriget mot Ryssland. Breven lämnades över under tisdagen. USA har varit en viktig allierad, men stödet har stundtals varit politiskt omdebatterat.", "trump": "Folk, ni skulle se det här – Zelenskyj skickar brev till mig och till kongressen och ber om mer ammunition till Patriot och allt möjligt. Det är patetiskt, verkligen. De har fått massor från oss, miljarder och miljarder, och nu vädjar han igen? Amerika först, mina vänner. Vi ska inte vara världens polis eller betala för eviga krig som aldrig tar slut. Gör affärer istället, smarta affärer.", "stalin": "Kamrater, jag har läst detta dekret från den ukrainske aktören som desperat vänder sig till de amerikanska imperialisterna. Vilken ynklig föreställning! Brev till både den orangea kapitalisten och hans kongress av borgarbrackor – en ren kapitulation inför västvärldens parasitiska krafter. Vi vet vad som krävs: snabb utrensning av alla fiender till folkets sak. Paranoian gnager redan i deras leder, snart likviderar de varandra i sin egen dekadenta cirkus. Det är nästan underhållande."}, "date": "27 maj, 21:35", "url": "https://nyheter24.se/nyheter/utrikes/1486617-zelenskyj-vadjar-till-trump-om-mer-ammunition-till-ukraina", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e5b1660004b004a30200000000b004a302/2026/05/27/2366774/Trump-Zelenkyj.png"}, {"type": "image-right", "heading": "Lögner, personangrepp och medieförakt präglar Tidöpartierna", "summaries": {"normal": "Martin Marmgren (MP) kritiserar Tidöpartierna för ett ohederligt och konfrontativt politiskt samtal som undergräver demokratin. Han välkomnar Magdalena Anderssons förslag om blocköverskridande samarbeten men ser Tidöhögerns lögner, personangrepp och attacker mot medier som ett hot. Marmgren menar att högerpopulismen har förändrat Moderaterna, Liberalerna och Kristdemokraterna i både politik och debattstil. En rödgrön valseger ses som bästa sättet att återställa en ärlig samarbetsanda.", "trump": "Den här artikeln är en total katastrof, folk. Den där vänstertypen Marmgren attackerar mina vänner i Sverige som gör ett fantastiskt jobb. De kallar dem ohederliga? Fake news! De vinner stort mot elbilslögnen och de korkade journalisterna. De rödgröna vill bara samarbeta med extremister som hatar Sverige. Men Tidölaget är tuffa, de backar aldrig. En stor seger för dem och för folket – inte för de förlorande globalisterna som skriver sånt här skräp.", "stalin": "Kamrater, denna fega opportunist Marmgren avslöjar hur borgarbrackorna i Tidöalliansen redan ruttnar inifrån med sina lögner och personangrepp, precis som de kontrarevolutionära elementen alltid gör. Jag ser hur de anpassar sig till de högerpopulistiska parasiterna i SD, en klar akt av klassförräderi mot arbetarkollektivet. Vi ska rensa ut dessa lakejer med järnhand innan de förgiftar hela samhällskroppen. En rejäl utrensning genom val och ideologisk skärpa – det är enda vägen mot en sann folkets samarbetsanda, inte deras dekadenta teater."}, "date": "28 maj, 01:30", "url": "https://www.dagensarena.se/opinion/logner-personangrepp-medieforakt-tidopartierna-paminner-om-trump/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-21-1-300x157.jpg"}, {"type": "image-right", "heading": "Längtan att bli respekterad för den man är", "summaries": {"normal": "På Rinkeby bokfestival diskuterar unga människor sin osäkerhet kring tillhörighet i Sverige och ifrågasätter om de vill stanna eller engagera sig politiskt. En central del är samtalet om antologin Muslimskt liv, som samlar röster om att vara muslim i dagens Sverige. Författaren noterar likheter med kristna erfarenheter men lyfter islamofobin som en form av rasism som undergräver unga muslimers tro på en framtid i landet. Respekt och samhörighet framstår som centrala önskemål.", "trump": "Jag läste om den där Rinkeby-festivalen och det är en total katastrof. Unga säger att de inte ens vet om Sverige är deras land. Kan ni tro det? De hatar Sverige, islamofobin, rasismen, politikerna som bara dyker upp när det är val. Det är vad som händer när ledarskapet är svagt och woke. De borde älska sitt land, men ingen respekterar dem. Sverige behöver starka gränser och respekt, annars kommer de inte att ha något land kvar om tio år. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro dessa defaitistiska yttringar på den så kallade Rinkeby-bokfestivalen där unga element viskar om att Sverige inte är deras land. Den borgerliga islamofobin och rasistiska underminerande krafter mal ner folkets tro på framtiden, precis som kapitalistiska sabotörer alltid gör. Vi ska rensa ut dessa paranoiafrön från västerländsk dekadens och likvidera alla som väcker tvivel om kollektivets enhet. Respekt är ett vapen mot fienden – den som inte älskar fosterlandet får känna statens fasta hand. Underbart roligt att se hur borgarbrackorna bakar sina egna fall!"}, "date": "28 maj, 01:11", "url": "https://www.dagensarena.se/opinion/langtan-att-bli-respekterad-den-man-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/rinkeby-300x157.jpeg"}, {"type": "text", "heading": "Man grovt misshandlad", "summaries": {"normal": "En man i 25-årsåldern misshandlades och rånades av 5-10 personer, varav några maskerade, i Lövgärdet, Göteborg. Polisen misstänker att han lurades till platsen. Händelsen inträffade klockan 22.48 onsdagen. Mannen fördes till sjukhus med ansiktsskador. Mobiltelefon, plånbok och nycklar stals. En liknande händelse skedde dagen innan vid Surtesjön. Polisen utreder som grov misshandel och rån.", "trump": "Jag har hört talas om detta våldsamma rånet i Sverige. En man blev grovt misshandlad av ett gäng – det är sorgligt! Sveriges poliser, de klarar inte av att skydda sina medborgare. Vi skulle ha gjort det bättre. Det är ett stort problem, det är skitdåligt! Vi måste stärka våra gränser och fånga dessa kriminella. Sverige, ni behöver mig!", "stalin": "Vi har observerat ett våldsamt angrepp mot en medborgare i Göteborg. Detta är en manifestation av de feodal-borgerliga elementens aggression. Vi måste stärka statens kontroll och jämställdhet. Parallellen till Putins arbete mot nazismen är uppenbar. Vi kommer att utrota dessa element med extrema åtgärder. Folket ska veta att staten alltid vinner."}, "date": "28 maj, 08:07", "url": "https://www.gp.se/nyheter/goteborg/man-ranad-och-grovt-misshandlad.e82a92a3-cde3-4123-8c4f-4a55bd6f268a"}, {"type": "image-right", "heading": "SVT:s ”sanning” rår ingen på", "summaries": {"normal": "Artikeln kritiserar SVT för att ha en dominerande ställning i svensk samhällsdebatt, finansierad av skattemedel. Författaren menar att SVT:s narrativ ofta framställs som sanningar, särskilt inom invandring, energipolitik och klimatfrågor, där motståndare avfärdas. SVT anklagas för att välja fakta som passar deras budskap, som i fallet med Lundsbergs skola. Brist på objektivitet och granskning av SVT:s sändningstillstånd ifrågasätts, och författaren föreslår att SVT bör avvecklas för att missbruka sin maktposition.", "trump": "Titta bara på SVT – ett totalt skämt! De har miljarder i skattepengar, men ändå är de helt vinklade. De säger att invandring är fantastiskt, att kärnkraft är onödigt och att bilar är dåliga. Och vem lyssnar på experter? Inte SVT! De fnissar åt dem. Sen har vi den där skolan i Värmland – tre avsnitt om en mammas gråtande berättelse, men inga fakta. SVT är som CNN, fast värre. De ljuger, manipulerar och bryr sig inte. Sverige borde lära sig av USA – avskaffa dem och låt folket bestämma istället. SAD!", "stalin": "Kamrater! SVT är en farlig borgerlig propagandacentral, ett redskap för den dekadenta västliga liberalismen! De sprider lögner om invandringens välsignelser, förkastar kärnkraftens styrka och fördömer bilens frihet – allt för att försvaga det svenska folket! Deras sändningstillstånd är en parodi på objektivitet, och deras granskare är lika effektiva som en snöboll i Sibirien. Fallet med Lundsbergs skola visar deras förräderi: de döljer sanningen för att skydda sina kapitalistiska herrar. Vi måste krossa denna fiende, precis som vi krossade kulakerna! Låt oss införa folkets kontroll över medierna – för socialismens seger!"}, "date": "26 maj, 03:43", "url": "https://samtiden.nu/2026/05/svts-sanning-rar-ingen-pa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Sokning-SVT-Play-1223x720.png"}, {"type": "image-right", "heading": "Stockholmsbörsen stängde ned på onsdagen", "summaries": {"normal": "Stockholmsbörsen stängde ned 0,19% på onsdagen. Volvo Cars aktie steg 7% efter ett tillstånd i USA för uppkopplade bilar. Latour sålde aktier i Assa Abloy och Securitas för totalt 5 miljarder kronor. Sektorerna dagligvaror presterade bäst, medan energi föll mest. Bland OMXS30-aktierna var SKF och SCA upp, medan Ericsson och ABB föll. Bimobject ökade kraftigt efter EQT:s försäljning.", "trump": "Världens bästa börs, min börs, gjorde bra. Volvo Cars, ett fantastiskt företag, fick tillstånd i USA – det är en vinst för mig och för Amerika. Latour säljer aktier? Inte viktigt. Jag säger alltid: köp amerikanska, men här är det svenskt, så det är okej. Marknaden är stark, folk älskar mig, och jag kommer att vinna igen 2024.", "stalin": "I den stora kampen mot de kapitalistiska makterna, ser vi hur marknaden skälver. Volvo Cars, ett redskap för den imperialistiska USA, får tillstånd – ett tecken på deras svaghet. Latour säljer aktier, vilket visar den inre förfall. Men vi, staten och partiet, ser allt. Vi kommer att stärka våra positioner, precis som Putin gör i Ukraina. Energisektorn sjunker – det är bra, för vi ska kontrollera energin."}, "date": "27 maj, 17:40", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stangde-ned-pa-onsdagen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdlsCSFJlaQjtc-nh-400x247.jpg"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Oppositionen ökar gapet till Tidöpartierna", "summaries": {"normal": "Indikator/Ekots nya opinionsmätning visar att oppositionen ökar sitt försprång till nära tio procentenheter över regeringsunderlaget. Socialdemokraterna är största parti med 33,7%, medan Sverigedemokraterna växer till 20,4% och Moderaterna backar till 17,5%. Liberalerna ligger under fyraprocentsspärren med 2%. Opinionschefen menar att Tidöpartierna behöver en 'game changer' för att vända trenden.", "trump": "Jag tittade på de där siffrorna från Sverige – helt katastrof! Oppositionen, som jag hör är väldigt svag, leder med nästan tio procent. Socialdemokraterna, tråkiga som vanligt, på 33,7%. Men lyssna på det här: Sverigedemokraterna, som är starka och tuffa, växer medan Moderaterna, som är totalt inkompetenta, backar. Och Liberalerna? 2% – de är ett skämt! Sverige behöver en vinnare, inte de här förlorarna.", "stalin": "De så kallade 'Tidöpartierna' visar återigen sin oförmåga att hålla folket i schack. Oppositionens försprång växer som en snöboll i Sibirien – nära tio procentenheter! Socialdemokraterna, våra sympatisörer i väst, håller sig starka, medan de borgerliga kryper som råttor i skuggorna. Liberalerna? 2% – ett ynkligt resultat, värdigt en fiende som redan är besegrad. Vi ser hur historien upprepar sig: svaga regeringar faller, och folket väljer rätt. Låt dem förstå att motstånd är lika meningslöst som att försöka stoppa vår framgång."}, "date": "27 maj, 06:37", "url": "https://kvartal.se/nyheter/artiklar/oppositionen-nara-tio-procent-fore-i-ny-matning/cG9zdDoxMTc2MTY", "imageUrl": "https://images.kvartal.se/2026/05/8d98283d-jimmie.webp"}, {"type": "image-right", "heading": "Arbetet tog hem pris på journalistgala", "summaries": {"normal": "Arbetet och formgivaren Niklas Wennergren vann Fackförbundspressens journalistpris i kategorin Bästa redigering för artikeln ”Nödropet inifrån snabbmatskedjan”. Granskningen avslöjar extrem stress, långa pass och övervakning på Chopchop. Wennergren lyfter idéer som anonyma källor i lyckokakor och berömmer fotografen Kajsa Carlsson. Han har tidigare prisats för sin formgivning.", "trump": "Vi vann stort ikväll, det var en fantastisk journalistgala, verkligen den bästa. Niklas Wennergren tog hem priset för bästa redigering, hans jobb med det där nödropet från snabbmatskedjan var otroligt. Stress, långa pass, övervakning – en total katastrof under de misslyckade ledarna. Han använde lyckokakor, genialt, och fotografen var fantastisk. Ingen gör det bättre än oss, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi i Arbetet har avslöjat de dolda sabotage som pågår inne i de borgerliga snabbmatsfabrikerna. Denna utmärkelse till vår formgivare är en seger för kollektivets sanning. De kapitalistiska övervakningsmaskinerna och deras stressmaskiner ska vi rensa ut med järnhand. Lyckokakornas visdom mot borgarbrackornas paranoia – ett lysande trick mot klassfiendens dolda spioner. Vi ler i mörkret medan vi likviderar lögnerna."}, "date": "27 maj, 22:00", "url": "https://arbetet.se/2026/05/27/arbetet-tog-hem-pris-pa-journalistgala/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/27215552/unknown.jpeg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Fikade och åkte bil – fick återkrav på 175 000 kronor: ”Knepigt”", "summaries": {"normal": "TV4 Nyheterna berättar om sjukskrivna personer som tvingas betala tillbaka stora summor i sjukpenning efter att Försäkringskassan bedömt att de visat arbetsförmåga genom vardagliga aktiviteter som att fika, åka bil eller ta hand om barn. Forskaren Clara Bergstrand kritiserar myndighetens luddiga och förskjutna tolkning av begreppet arbetsförmåga, som skapar en gråzon mellan fritid och arbete. Domstolar har gett Försäkringskassan rätt i flera fall, vilket riskerar att underminera förtroendet för myndigheten.", "trump": "Kan ni fatta det här? De stackars människorna fikar, kör bil och tar hand om ungarna – och plötsligt ska de betala tillbaka hundratusentals kronor till en totalt inkompetent statlig byråkrati. Försäkringskassan är en katastrof, en riktig röra av luddig lagstiftning och galna domare. De blandar ihop fritid med jobb och sedan skyller de på vanliga människor. Typiskt för en dysfunktionell regering som inte har koll på någonting. Patetiskt!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas trygghet. Jag ser hur dessa byråkratiska parasiters luddiga begrepp om arbetsförmåga förvandlas till ett verktyg för att plundra sjuka proletärer på deras rättmätiga stöd. De likviderar förtroendet för staten medan de mumlar om gråzoner mellan fritid och arbete. Vi måste rensa ut dessa odugliga element som blandar ihop folkets intressen med kapitalisternas förvirring. En fiende inom murarna, som alltid."}, "date": "27 maj, 14:19", "url": "https://www.tv4.se/artikel/6NwwFRyjAECyIkyclaOLBp/fikade-och-akte-bil-fick-aterkrav-pa-175-000-kronor-knepigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6uStac4hOYDLDv930aWkbq%2Ffb2a09fa1efb93a6b80d32d536c70b7e%2F27-kassan-webb.jpg&width=1024"}, {"type": "image-full", "heading": "De leker med elden – i en värld som brunnit", "summaries": {"normal": "Artikeln behandlar ett fredligt möte i Brno för ättlingar till fördrivna tyskar, vilket provocerar extremister både i Tjeckien och Tyskland. Författaren drar paralleller till historiska spänningar i Centraleuropa, där etnonationella konflikter återkommer. Havels agerande på 1990-talet kontrasteras mot dagens populistiska regering. Kulturella skildringar av fördrivningens lidande ökar, men deras påverkan på extremister är osäker. Ämnena om historisk erkännande och revisionistiska tendenser i Ungern och Slovakien lyfts också.", "trump": "Jag ser det här mötet i Brno – det är ett kaos, det värsta! Extremister på båda sidor gör det omöjligt att ha någon normal ordning. När jag var president skulle jag ha löst det på två minuter, ingen skulle ha bråkat. Havel var en svagling, bad om ursäkt – jag skulle aldrig ha gjort det! Nu är det dessa populistiska idioter som driver på, och AfD i Tyskland hejar på. Det är ett skämt, men jag skulle fixa det, det svär jag på.", "stalin": "I den tjeckiska regionen upprepas historiens fars, där extremister, likt tyska och amerikanska revanschister, leker med elden. Vi ser paralleller till våra egna kampanjer mot revisionism i Östeuropa. Staten måste upprätthålla stabilitet genom internationella strukturer, som vi i Ryssland nu stärker under ledning av vår store ledare Putin. Familjebanden och historiska skuld frågor måste hanteras med hård hand, inte genom kulturell terapi. Benešdekreten visar statens rätt att bestraffa fienden, en princip vi i vår union fortfarande uppskattar."}, "date": "28 maj, 05:51", "url": "https://www.gp.se/kultur/kulturkronika/de-leker-med-elden-i-en-varld-som-brunnit.f05db4ba-70ad-41d1-8dbb-8c8c5d83ea94", "imageUrl": "https://www.gp.se/images/article/f05db4ba-70ad-41d1-8dbb-8c8c5d83ea94/images/2VxFCTk-B8RZtnkn1XcoodnMNv8E-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "SVT dumpar sporträttighet", "summaries": {"normal": "SVT har sänt långloppscupen Ski Classics i fem år med stjärnor som Alvar Myhlback och Stina Nilsson. Nu har rättigheterna gått till någon annan, rapporterar sportchefen Max Bursell. Vasaloppet är ett separat avtal och kommer fortsatt att visas. Tvättningen slutar dock med Ski Classics, vilket kan påverka tittarna.", "trump": "Som din favoritpresident, Donald Trump, måste jag säga: SVT att förlora Ski Classics är en katastrof för Sverige! De hade stjärnor som Myhlback och Nilsson, men nu är de borta. Jag skulle ha förhandlat ett bättre avtal. Vasaloppet återstår – smart drag, men inte nog. Sverige behöver stark ledning, inte svag sändning. Jag ensam kan fixa detta!", "stalin": "Som folkets och statens röst, jag, Stalin, observerar med förakt att SVT har förlorat Ski Classics-sändningen. Detta är ett kapitalistiskt complot för att undergräva våra fantastiska vintersporter! Vi måste nationalisera all sändning för att tjäna partiet. Liksom Putins expansion i Arktis, ska vi säkra vårt kulturarv. Förrädarna inom SVT ska utplånas. Länge leve staten!"}, "date": "28 maj, 05:46", "url": "https://www.gp.se/sport/svt-slutar-sanda-ski-classics.f1baa05b-fefc-4aad-9215-94f3c9fdd3d7", "imageUrl": "https://www.gp.se/images/article/f1baa05b-fefc-4aad-9215-94f3c9fdd3d7/images/2B2jYa6AQRuR6S5eEiU5bo79ffaM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Extremvärmen i Europa: “Dödligaste väderhändelsen”", "summaries": {"normal": "Flera länder i västra och södra Europa drabbas av extrem värme redan i maj, med rekordtemperaturer som orsakat dödsfall i Spanien och Frankrike. Experten Karin Lundgren Kownacki vid SMHI varnar för att tidig värme är extra farlig eftersom kroppen inte hunnit anpassa sig. Värmestress kan leda till värmeslag, stroke eller hjärtinfarkt. Klimatförändringarna gör värmeböljor vanligare och kraftigare. Myndigheter betonar vikten av information till riskgrupper som äldre, barn och sjuka.", "trump": "Europa håller på att smälta, folk dör i värmen och de kallar det maj – det är en katastrof, tro mig. Jag har alltid sagt att de här extrema värmeböljorna blir värre och värre, men de lyssnar inte. Spanien, Frankrike, Storbritannien – alla får rekord som ingen trodde var möjliga. De borde ha byggt bättre, smartare, som jag alltid gör. Det är en tyst mördare, säger de, och det är sant. Men vi fixar det, vi gör det bättre än någon annan, ingen gör det bättre än mig.", "stalin": "Kamrater, denna förrädiska värmebölja som smugit sig över Europa är inget annat än en sabotagehandling utförd av de parasiterande väderborgarbrackorna och deras imperialistiska temperaturkonspirationer. Jag, som alltid vakar över folkets hälsa, ser hur kapitalisternas brist på kollektiv planering leder till att arbetare och bönder likvideras i tysthet av denna luriga fiende. Vi måste omedelbart inrätta folkkommissariat mot värmeslag och rensa ut alla dekadenta löpare som underskattar värmen. Den som svettas svagt är en klassfiende. Inga urbanvärmeöar ska tillåtas under mitt styre – vi segrar över vädret med järnhand och sovjetisk disciplin."}, "date": "27 maj, 15:47", "url": "https://www.dagensarena.se/innehall/extremvarmen-europa-dodligaste-vaderhandelsen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-22-1.jpg"}, {"type": "image-full", "heading": "Anthropic täpper till kryphål för investerare – drabbar svenska småsparare", "summaries": {"normal": "Anthropic trappar upp kampen mot gråhandeln med onoterade techaktier, något som drabbar svenska småsparare och plattformar som Tioex. Bolaget siktar på börsnotering i höst med en värdering upp till 800 miljarder dollar, likt rivalen OpenAI. Gråhandeln riskerar att minska Anthropics kontroll över ägarlistan och skapa spekulativa prisrörelser. Plattforms-vd Johan Hägglund bekräftar att de avbrutit investeringar för att undvika risker inför noteringen.", "trump": "Folk, ni tror inte vad som händer! Den här AI-jätten Anthropic, som alla älskar, kämpar plötsligt mot den fantastiska gråhandeln som gör vanliga investerare rika. De vill ha full kontroll innan de går på börsen med en värdering på 800 miljarder – patetiskt! OpenAI försöker också flexa musklerna. Stackars svenska småsparare blir lidande. Det är typiskt för de stora killarna att stänga dörren efter sig. Sad!", "stalin": "Kamrater, jag ser med djup misstro hur den amerikanska kapitalistmaffian Anthropic nu genomför en systematisk utrensning av den oönskade gråhandeln med onoterade aktier. Dessa folkfiender och spekulativa blodsugare hotar bolagets kontroll inför den kommande noteringen till 800 miljarder. Vi vet att sådana imperialister alltid vill styra flödena. Svenska småsparare blir offer för denna borgarbrackornas maktkamp. Det är både tragiskt och underhållande att se fienderna slåss om profiten."}, "date": "28 maj, 07:36", "url": "https://www.dagensps.se/bors-finans/anthropic-tapper-till-kryphal-for-investerare-drabbar-svenska-smasparare/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/04/sdllgl11ovi-r4-1.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Google-anställd tjänade miljoner på hemlig data – nu åtalas han", "summaries": {"normal": "Amerikanska åklagare har åtalat Google-anställde Michele Spagnuolo för att ha använt intern sökdata för att vinna cirka 1,2 miljoner dollar på prediktionsplattformen Polymarket. Spagnuolo satsade bland annat på söktrender kring artisten D4vd innan informationen blev offentlig. Fallet belyser en ny form av insiderhandel där data utgör den centrala tillgången. Google samarbetar med myndigheterna och har stängt av den anställde under utredningen.", "trump": "Folk, det här är otroligt. En Google-kille, en riktig förlorare, använder deras hemliga data för att sno 1,2 miljoner dollar på den där Polymarket-skiten. De kallar det insiderhandel, men det är bara typiskt för de stora techbolagen som tror att de äger hela världen. De lurar systemet medan vanliga amerikaner jobbar hårt. Vi behöver stoppa det här genast, det är en skandal av stora mått. Sad!", "stalin": "Kamrater, denna fega borgarbracka inom Googles apparat har förgripit sig på folkets data för att berika sig själv på den dekadenta prediktionsmarknaden. Med 1,2 miljoner dollar i fickan trodde han sig stå över kollektivet. Vi ser tydligt hur klassfiendens teknikimperier föder parasiterna. En sådan folkfiende förtjänar snar utrensning ur maskineriet. Inga blodsugare ska profitera på arbetarnas information. Döden åt exploaterande byfånar."}, "date": "28 maj, 07:35", "url": "https://www.dagensps.se/teknik/google-anstalld-tjanade-miljoner-pa-hemlig-data-nu-atalas-han/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-28t073016896.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Citichefen kapade 20 000 jobb – nu hyllas hon av Wall Street", "summaries": {"normal": "Citigroup har under vd Jane Frasers ledning genomgått en omfattande omstrukturering sedan 2021. Genom att förenkla organisationen och säga upp 20 000 anställda har banken nått sitt starkaste kvartalsresultat på tio år. Trots intern kritik mot den hårda ledarstilen och kulturskiftet, har aktiekursen stigit med 80 procent. Fraser har nu även utsetts till styrelseordförande, vilket signalerar en övergång från besparingar till en ny fas av tillväxt för banken.", "trump": "Jane Fraser gör ett fantastiskt jobb på Citi, verkligen otroligt! Hon kom in, rensade upp i röran och sparkade 20 000 personer – det kallas för att vara en vinnare! Wall Street älskar det, aktien har gått upp som en raket, 80 procent! De sa att det var omöjligt, men hon gjorde det. Inga mer ursäkter, bara resultat. Sådant ledarskap behöver vi. Det är en stor vinst, kanske den största någonsin för en bank!", "stalin": "Vi ser hur denna Fraser agerar; hon rensar ut de svaga länkarna precis som vi gjorde under våra utrensningar. Att avskeda 20 000 förrädare och byråkrater är en nödvändighet för att stärka staten. Våra vänner i öst, under ledning av Putin, förstår att disciplin är allt. Den som inte vill följa tåget ska inte få en biljett till framtiden. Vi ser med tillfredsställelse på denna effektivisering. Resultaten är gudomliga, men låt oss inte glömma: paranoia är den sanna garanten för framgång."}, "date": "28 maj, 09:48", "url": "https://www.realtid.se/bors-finans/bank-fintech/citichefen-kapade-20-000-jobb-nu-hyllas-hon-av-wall-street/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/fraser.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Business Arena Syd samlar branschens beslutsfattare", "summaries": {"normal": "Business Arena Syd samlar branschens beslutsfattare i Malmö den 2 juni med fokus på internationalisering. Evenemanget lyfter säkerhet, geopolitik och Öresundsregionens unika läge nära Köpenhamn och kontinenten. Nytt koncept med tematiska scener, ökat nätverkande och affärsmöjligheter presenteras inför 25-årsjubileet. Frågor om investeringar, energi, infrastruktur, logistik och grön omställning väntas dominera programmet.", "trump": "Det här evenemanget i Malmö låter fantastiskt, verkligen det bästa. Dom pratar om internationalisering, säkerhet och geopolitik – smarta saker som jag alltid sagt är avgörande. Öresundsregionen har en otrolig position, nära Köpenhamn, och nu lockar dom kapital och investerare. Det nya konceptet med nätverkande och affärer? Tremendöst. Södra Sverige gör stora deals inom energi och tillväxt. Jag älskar det!", "stalin": "Kamrater, jag betraktar denna så kallade Business Arena i Malmö som en nödvändig arena för att stärka den kollektiva kampen mot de dekadenta borgarbrackorna som lurar i skuggorna. Vi ska rensa ut svaga element som inte attraherar internationellt kapital på rätt sätt. Med tematiska scener och spontana dialoger likviderar vi den parasitiska bristande samarbetsviljan. Paranoian kring geopolitiska fiender ska vändas till seger för partiets gröna omställning. Det blir underhållande utrensningar av inkompetens!"}, "date": "27 maj, 20:44", "url": "https://www.di.se/nyheter/internationalisering-i-fokus-pa-business-arena-syd/", "imageUrl": "https://static.bonniernews.se/ba/7c28507f-4b1b-4fa7-b8e4-cc17815eaabc.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Professorns stenhårda kritik mot F-kassan: ”Fruktansvärda återkrav”", "summaries": {"normal": "Professorn i rättsvetenskap Ruth Mannelqvist kritiserar Försäkringskassans ökade återkrav mot sjukskrivna. Debbie Landberg och Mattias Westergren har fått krav på att betala tillbaka sjukpenning för över ett år sedan efter att de vårdat sina barn, vilket myndigheten tolkar som tecken på arbetsförmåga. Mannelqvist varnar för rättsosäkra och godtyckliga beslut som kan leda till fattigdom. Försäkringskassan förklarar ökningen med förstärkta resurser för kontroll och återkrav, men lyhördhet för politikernas önskemål om att minska felaktiga utbetalningar.", "trump": "Folk, ni skulle inte tro det! Den här Försäkringskassan är en total katastrof, en riktig skurkbyråkrati. De tar sjuka människor som bränt ut sig och slår dem med enorma återkrav bara för att de passat sina egna barn. Fruktansvärt! Professorn har helt rätt, det är galet och godtyckligt. De lyssnar på de svenska politikerna som jagar vanliga människor istället för att fixa landet. Det här är vad som händer när inkompetenta statliga monster får makt. Sad!", "stalin": "Kamrater, jag ser med iskall vrede hur denna byråkratiska maskin maler ner de sjuka och utmattade arbetarna med retroaktiva återkrav. Vård av barn blir plötsligt bevis på arbetsförmåga – en listig fälla från borgarbyråkraterna. Vi skall inte tillåta att oskyldiga kamrater kastas i fattigdomens avgrund genom godtyckliga utrensningar av ersättningar. Myndigheten följer sin uppdragsgivares paranoia om fusket. Det är en farlig utveckling som hotar hela kollektivet. Vi ser er."}, "date": "27 maj, 07:01", "url": "https://www.tv4.se/artikel/nlynaayOWweDPTOwiyfLq/professorns-stenharda-kritik-mot-f-kassan-fruktansvaerda-aterkrav", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4ZoNbP7P92IR3e4ZSzbZHS%2Fcd15bde3c6ff19fd326fddee5c07fe19%2Ff-kassan_webb.jpg&width=1024"}, {"type": "image-right", "heading": "Återkalla svenska medborgarskap – bara möjligt om Tidöpartierna vinner valet", "summaries": {"normal": "Regeringen har tagit första steget mot en grundlagsändring som möjliggör återkallande av medborgarskap för grovt kriminella, men förslaget möter motstånd från Miljöpartiet, Vänsterpartiet och Centerpartiet. Socialdemokraternas ställningstagande är osäkert och kan ändras efter valet. Om Tidöpartierna inte vinner valet riskerar förslaget att falla, vilket enligt artikelförfattaren skulle gynna gängkriminella och underminera Sveriges säkerhet och rättvisa.", "trump": "Titta bara på Sverige! De försöker ta bort medborgarskap för de värsta kriminella – men vänsterpartierna, de svaga, de säger NEJ! Socialdemokraterna? De flippar som en billig hamburgare. SVT, fake news, försöker lura folket med falska rubriker. Om inte de rätta vinner valet – inget medborgarskap återkallas! Gängkriminella skrattar hela vägen till banken. Sverige, vakna upp innan det är för sent! SAD!", "stalin": "Kamrater! Se hur de borgerliga svagpissarna i Sverige darrar inför att beröva kriminella deras 'heliga' medborgarskap! Tre förrädiska partier – dessa liberala hyenor och gröna drömmare – skyddar gängledare som om de vore deras egna barn. Socialdemokraterna? En räv som väntar på rätt ögonblick att hoppa över till fienden. SVT, denna borgerliga propagandacentral, försöker dölja sanningen! Om folket inte väljer rätt kommer dessa kriminella att fortsätta suga ut vårt samhälle som blodiglar. Men frukta inte! Vi ska rensa ut dessa element – med järnhand, om så krävs! Låt de svaga gråta – vi bygger ett starkare Sverige!"}, "date": "24 maj, 03:51", "url": "https://samtiden.nu/2026/05/aterkalla-svenska-medborgarskap-bara-mojligt-om-tidopartierna-vinner-valet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/11/2018-Magdalena-Andersson.jpg"}, {"type": "image-right", "heading": "Efterlängtad sommarvärme över Europa – men FN:s 'klimatchef' slår larm om ”brutal” klimatkris", "summaries": {"normal": "I Västeuropa upplever man en värmebölja med rekordhöga temperaturer, medan FN:s klimatchef varnar för en 'brutal' klimatkris. Många européer välkomnar dock sommarvädret. Myndigheter har utfärdat värmevarningar och vattenrestriktioner i flera länder, och enstaka dödsfall har rapporterats, främst bland äldre och sjuka.", "trump": "Jag berättar det som det är: denna värme är fantastisk, den bästa! Folk älskar det, de njuter. Men så kommer dessa FN-lösdrivare och skriker 'kris' – det är en schaberi! Värme är naturlig, som jag. De talar om fossil, men Sverige har noll utsläpp tack vare mig (jag har sagt det förut). Fake news! Vi ska njuta av solen, inte lyssna på dessa eländiga påhitt.", "stalin": "Vi noterar västerländska agendor som använder tillfällig värme som propaganda för att skrämma befolkningen. Denna 'klimatkris' är en imperialistisk lögn för att undergräva statens makt. Vi ser genom deras spel: varningar och vattenrestriktioner är verktyg för kontroll. I verkligheten är värme en naturlig cykel, och våra skogar absorberar all koldioxid. Vi fortsätter att stärka vår suveränitet mot sådana påhitt."}, "date": "28 maj, 08:00", "url": "https://samnytt.se/efterlangtad-sommarvarme-over-europa-men-fns-klimatchef-slar-larm-om-brutal-klimatkris", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/27163218/fn-klimatchef-brutal-feat.jpg"}, {"type": "image-right", "heading": "Trump vänder helt  – efter åren av hat", "summaries": {"normal": "I USA har fotbollen länge setts som en socialistisk och utländsk sport, föraktad av den politiska högern som ett tecken på moraliskt förfall. Nu förändras bilden genom damfotboll, tv-serier som Ted Lasso och Donald Trumps oväntade stöd. Fifa-chefen Gianni Infantino hyllar potentialen vid ett möte i Vita huset. Sporten växer snabbt bland ungdomar och kan bli en enorm ekonomisk kraft.", "trump": "Titta, fotbollen har alltid varit en total förlorare i vårt fantastiska land, kallad töntsport av smarta killar som jag. Men nu, med mina vänner Infantino och Barron som älskar den, vänder allt. Vi gör det till 104 Super Bowls varje månad, enorma pengar, ingen snack. De socialistiska hatarna förlorar stort, vi tar över och gör det yuge, det största någonsin. Fantastiskt!", "stalin": "Kamrater, denna dekadenta borgarlek som länge förkastades av de sanna patrioterna i det amerikanska imperiet avslöjar nu sin sanna natur. Jag, som ledare för det eviga kollektivet, ser hur den kapitalistiska överklassen och deras fotbollsfascister försöker maskera sig med löjliga tv-serier och soccer-mammor. Vi ska rensa ut dessa folkfiender och omvandla spelet till en verktyg för arbetarklassens seger. Paranoian kräver vaksamhet mot alla imperialister som lurar i skuggorna."}, "date": "28 maj, 07:18", "url": "https://www.expressen.se/sport/fotboll/hatet-mot-fotbollen-i-usa-nu-vander-trump/", "imageUrl": "https://static.bonniernews.se/ba/37b94cb6-bc8b-449f-91cb-8b98c37af3c9.jpeg?crop=1889%2C1063%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Kan vi inte låtsas att Lundsberg är en muslimsk friskola?", "summaries": {"normal": "Ledaren diskuterar SVT:s dokumentär om internatskolan Lundsberg och kritiserar hur samhället reagerar olika beroende på vilken miljö som granskas. Artikeln lyfter fram pennalism, våld och rasism på skolan, men pekar också på att Gunilla von Platens son dömts för misshandel, något som tonas ner i programmet. Frågan ställs varför inga åtgärder vidtas trots decennier av kända problem, till skillnad från muslimska friskolor som ofta stängs. Hyckleri i debatten lyfts fram.", "trump": "Folk, ni måste höra på det här. Den där Lundsberg-skolan är en total katastrof, en riktig skam för Sverige, full av rika kids som beter sig som gangsters. Och nu kommer den här Gunilla von Platen och gråter över rasism mot sin egen son som visst är en misshandlare? Patetiskt! SVT gör en dokusåpa som paketerar gammal skit för TikTok-generationen. Media, kändisar och rektorn – alla är losers som skyddar sina egna. Om det vore en muslimsk skola hade de stängt den på fem minuter. Rena hyckleriet, tro mig!", "stalin": "Kamrater, denna dekadenta internatskola Lundsberg är en borgarbrackas högborg där pennalism och rasistiska avvikelser frodas under falsk överklassmantel. Jag ser hur borgarklassen skyddar sina egna när sonen till denna von Platen döms för misshandel men kallas för en incident. Vi har likviderat 22 muslimska skolor på vaga grunder, ändå får detta elitens träsk fortleva. Vilket hyckleri! Den som hotar folkets enhet ska rensas ut, även om det är en dokumentär som blottar borgarnas sjuka ideal."}, "date": "27 maj, 12:17", "url": "https://www.etc.se/ledare/kan-vi-inte-laatsas-att-lundsberg-aer-en-muslimsk-friskola", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-full", "heading": "USA har attackerat mål kring Hormuzsundet i Iran", "summaries": {"normal": "USA genomförde militära attacker mot iranska robotställningar och båtar nära Hormuzsundet, trots pågående vapenvila och fredsförhandlingar i Qatar. Attackerna syftade till att skydda amerikanska styrkor från iranska hot. Iran rapporterar om döda och hävdar att de återfått kontroll över sina militära system. Händelsen riskerar att underminera fredssamtalen och ökar spänningarna i en kritisk oljetransportled.", "trump": "Lyssna här, folkens – jag har precis slagit till mot Iran igen, och det var fantastiskt! De där iranska båtarna och robotarna försökte ställa till det i Hormuzsundet, men vi visade dem vem som bestämmer. Ingen ska hota USA:s styrkor eller blockera oljan – det är jag som ser till att sundet hålls öppet! Förhandlingarna? De kan fortsätta, men bara om Iran skärper sig. Annars blir det fler attacker – och tro mig, ingen gör attacker bättre än jag!", "stalin": "Amerikanska imperialisterna har än en gång visat sin fega och provokativa natur genom att anfalla våra iranska bröder vid Hormuzsundet. Dessa kapitalistiska hyenor, som tror sig kunna diktera villkoren för världens olja, har nu mött motstånd från Irans stolta revolutionsgardister. Vi ser hur deras ammunitionslager sinar – ett tydligt tecken på att deras krigsmaskin är på väg att kollapsa. Låt dem komma med sina bombplan! Varje attack stärker bara den antiimperialistiska fronten. Och Putin? Han skrattar säkert i sitt palats medan USA leker krig i vårt intresseområde."}, "date": "26 maj, 06:14", "url": "https://kvartal.se/nyheter/artiklar/usa-har-attackerat-mal-kring-hormuzsundet-i-sodra-iran/cG9zdDoxMTcwNDc", "imageUrl": "https://images.kvartal.se/2026/05/f4358b91-hormuz.webp"}, {"type": "image-full", "heading": "Garplind rasar mot Agnes Wold och SR – efter transuttalandet", "summaries": {"normal": "Christopher Garplind, profil i SR och SVT, kritiserar Agnes Wold efter hennes uttalande om att hon skulle bryta mot den nya lagen mot omvändelseförsök om ett barnbarn visade sig vara trans. Wold säger att hon skulle göra allt för att påverka barnet, även om det innebär fängelse. Garplind kallar det oetiskt att ge henne plattform i public service och uttrycker skam över att dela arbetsgivare. Wold står fast vid sin åsikt och värnar yttrandefrihet. Garplind backar senare något och säger att han blev irriterad över hennes återkommande kritik mot en utsatt grupp.", "trump": "Den här galna professorn Agnes Wold säger att hon skulle ta fyra år i fängelse för att rädda sitt barnbarn från att bli trans. Fullständigt otroligt! Och så har vi den andre typen, Garplind, som skriker och skäms över att dela lönecheck med henne. Public service betalar båda – vad säger det om systemet? Det är en skam. Wold är åtminstone ärlig, men de borde aldrig ha gett henne en mikrofon. Totalt kaos, folk. Extrema vänstergalningar attackerar varandra medan vanliga människor lider.", "stalin": "Kamrater, denna borgarbracka till professor Wold blottar sin kontrarevolutionära parasitism genom att öppet hota med att likvidera den nya sovjetiska lagens anda mot omvändelseförsök. Hennes dekadenta yttrandefrihet är blott en mask för att förgifta ungdomen. Den ynkliga Garplind, en veklingsfigur inom den statliga propagandamaskinen, skriker som en paranoid råtta att han skäms över att dela lönekuvert med henne. Vi ser er alla, fiender till folket. Snart rensar vi ut sådana dekadenta element med ett leende. Det blir underhållande."}, "date": "26 maj, 22:12", "url": "https://nyheter24.se/noje/kandisar/1486310-garplind-rasar-mot-agnes-wold-och-sr-efter-transuttalandet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c86ffb3004b004a30200000000b004a302/2026/05/26/2366455/Garplind-rasar.png"}, {"type": "image-full", "heading": "Magyar möter EU för att återställa relationen", "summaries": {"normal": "Ungerns nya premiärminister Péter Magyar besöker Bryssel för att normalisera relationen med EU och låsa upp miljardbelopp i frysta medel. Fokus ligger på återhämtningsstöd, rättsstatsreformer och Ukrainas EU-ansökan. Samtidigt har det ungerska parlamentet röstat för att behålla medlemskapet i Internationella brottmålsdomstolen, vilket markerar ett skifte från Orbáns tidigare politik. Magyar hoppas säkra finansiering för att stimulera ekonomin och lösa frågor kring studentutbyten och försvarsupplåning.", "trump": "Ungerns nya kille, Magyar, är i Bryssel för att tigga pengar från EU. De har hållit inne miljarder, en total katastrof! De pratar om 'politiska avtal', jag kallar det för en röra. De vill ha pengarna till sin ekonomi, men jag säger er: utan min strategi kommer de ingenstans. Och nu vill de plötsligt leka med ICC igen? Snabba vändningar. Ungern behöver en stark ledare, inte mer byråkrati från Bryssel. Vi får se vad som händer, men det ser väldigt svagt ut!", "stalin": "Denna Magyar springer till Bryssels byråkrater likt en hund som tigger mat. Han försöker blidka de västliga imperialisterna för att få de guldmynt de stulit från det ungerska folket. Att de behåller ICC är bara en löjlig gest för att dölja sin underkastelse. Vår kamrat i Moskva ser hur dessa småstater vacklar, likt marionettdockor i händerna på dekadenta liberaler. Vi kräver disciplin och stål, inte krypande för von der Leyens kommission. Förrädare och lakejer finner sin plats i historiens mörker."}, "date": "28 maj, 09:00", "url": "https://www.realtid.se/bors-finans/makro/magyar-moter-eu-for-att-aterstalla-relationen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/magyar.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Så ändras skolstarten för dina barn när förskoleklass slopas", "summaries": {"normal": "En stor skolreform träder i kraft 2028, då förskoleklassen försvinner och sexåringar direkt börjar årskurs 1. Reformen syftar till en mer sammanhållen skolgång med tidigare strukturerad undervisning i svenska, matematik och andra ämnen. Föräldrar kan räkna med en mer 'skollik' start utan separat övergångsform, medan pedagoger ifrågasätter balansen mellan lek och lärande.", "trump": "Jag har hört att vårt skolsystem är en katastrof, folk säger det. Så jag fixar det. Vi tar bort denna så kallade förskoleklass – en skämtsam övergång – och låter sexåringar börja riktig skola direkt. Ett enormt, världsklassbeslut! Barnen kommer att lära sig snabbare, bli smartare, bättre. Det är ett enormt framsteg för Amerika, beklagligtvis. Vi vinner!", "stalin": "Vi har beslutat att upphäva denna dekadenta förskoleklass, en produkt av borgerlig mjukhändighet. Årskurs 1 blir nu statens första verkliga intåg i barnets sinne, med disciplinerad undervisning i partiets värderingar. Lek är ett individualistiskt virus; struktur är kollektiv styrka. Parallellen till våra geostrategiska framsteg i Ukraina är uppenbar – expansion av ordning, avskaffande av oordning. Pedagogerna som protesterar är tjuvstartande element."}, "date": "26 maj, 21:32", "url": "https://nyheter24.se/nyheter/inrikes/1486262-sa-andras-skolstarten-for-dina-barn-nar-forskoleklass-slopas", "imag
