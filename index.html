ycket på Ryssland ökar genom sanktioner, diplomati och attacker mot strategiska mål. Han pekar samtidigt på ett hinder: Putin måste kunna framställa en fred som en egen framgång inför den ryska befolkningen. Rysslands ekonomi ses som den största sårbarheten.", "trump": "Folk, det här är patetiskt. Zelenskyj springer runt och ber om fred innan vintern som en förlorare som ber om nåd. Putin sitter där med sin Fiat och låtsas att det är en Ferrari, precis som jag alltid sagt. Den ryska ekonomin håller på att rasa, vi pumpar in sanktioner och smäller till deras olja. Jag fixade mycket bättre deals än Biden, tro mig. Nu måste de två galningarna mötas någonstans mitt emellan, annars fortsätter cirkusen.", "stalin": "Kamrater, jag betraktar detta som en historisk nödvändighet. Vi ska tvinga fram fred innan vintern genom att krossa de fascistiska hindren som de ukrainska reaktionärerna och deras imperialistiska husbondar rest mot den ryska intressesfären. Den ekonomiska svagheten hos klassfienderna är deras fall. Putin, denne värdige och fruktade efterträdare, måste likvidera alla borgarbrackor som viskar om nederlag. Inga alternativ finns. Segern tillhör den starka staten, alltid."}, "date": "4 augusti, 22:32", "url": "https://www.tv4.se/artikel/CdjOD5pZS5GldKtLgCcdi/zelenskyj-siktar-pa-fred-foere-vintern", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6DkhBtkypJ13nD1RdIRhoa%2F716e188d73e2b5f5c967eecba3b08dc7%2F04-zelenskyj-split.png&width=1024"}, {"type": "image-right", "heading": "Ceuta-krisen: ”Frihandel med EU har skapat fattigdom”", "summaries": {"normal": "EU:s utrikesministrar möttes efter att tiotusentals migranter korsade gränsen från Marocko till spanska Ceuta, där ett 70-tal personer omkom. Experter pekar på Västsahara-konflikten, marockansk arbetslöshet och politiskt spel. Migration används som påtryckningsmedel av länder runt Medelhavet. Spanien fick senare beröm av EU för sin hantering medan Marocko skyllde på desinformation. Grundläggande orsaker är ekonomisk misär, orättvisa frihandelsavtal och den extrema välståndsklyftan mellan Europa och Nordafrika.", "trump": "De här galningarna i EU och Marocko, totalt kaos! Tiotusentals människor bara vandrar rakt in i Spanien, och alla skyller på varandra som riktiga förlorare. Spanien gör amnesti och plötsligt blir det invasion. Marocko använder migranter som vapen, precis som jag alltid sagt. De borde bygga en riktig mur, en fantastisk mur, och stoppa det här vansinnet. Ingen har gjort det bättre än jag skulle ha gjort. Sad!", "stalin": "Kamrater, återigen ser vi hur de dekadenta borgarbrackorna i EU och de marockanska feodalherrarna leker med människors liv som schackpjäser i sitt reaktionära spel. Jag, som alltid genomskådar de imperialistiska intrigerna, noterar hur de utnyttjar de arbetslösa massorna för att destabilisera gränserna. Desinformation från smugglarkapitalister och falska domar sprids som gift. Vi måste rensa ut dessa kontrarevolutionära element med järnhand innan de förgiftar hela Nordafrika. Ingen välståndsklyfta överlever en riktig utrensning av klassfienderna."}, "date": "4 augusti, 17:45", "url": "https://www.dagensarena.se/innehall/ceuta-krisen-frihandel-med-eu-har-skapat-fattigdom", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-71.jpg"}, {"type": "image-right", "heading": "Ledare Ska vi vänta till någon gör allvar av SD:s hets mot medier?", "summaries": {"normal": "Ledaren kritiserar Sverigedemokraterna för systematisk hets mot medier och journalister. Richard Jomshof har bland annat kallat Anders Lindberg för Quisling och Andreas Gustavsson för medlöpare med blod på händerna. Partiledningen, inklusive Jimmie Åkesson, anklagas för att aktivt uppvigla mot faktabaserad journalistik och skapa en explosiv konflikt. Författaren uppmanar publicister och Tidö-partierna att reagera kraftfullt innan retoriken leder till fysiskt våld.", "trump": "Folk, det här är en katastrof. Den där SD-gängen beter sig som riktiga losers och fake news-krigare. De kallar journalister för quislingar, pedofilkramare och landsförrädare – och de har helt rätt! De svenska medierna är en gigantisk vänstervridning, precis som under den sömniga Joe Biden. Men de gör det för klumpigt. Jag skulle ha gjort det snyggare, tro mig. Nu har de till och med en egen propagandakanal som hänger ut folk. Patetiskt, men underhållande!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa degenererade borgarbrackor inom SD systematiskt utrensar den falska pressens masker. De kallar klassfiendens lakejer för quislingar och folkförrädare – en korrekt diagnos. Ändå är det patetiskt att de inte fullföljer utrensningen. Inga kännbara repressalier? Inga folkdomstolar? En sådan halvmesyr förtjänar att likvideras av en verkligt revolutionär hand. Deras propagandaapparat är dock en munter föreställning värd att studera innan den slutgiltigt krossas."}, "date": "4 augusti, 16:00", "url": "https://www.etc.se/ledare/ska-vi-vaenta-till-naagon-goer-allvar-av-sd-s-hets-mot-medier", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Chefen fuskar, familjen blir utvisad – och staten en brottsling", "summaries": {"normal": "En familj i Jakobsberg riskerar utvisning till Egypten trots att de följt alla regler, arbetat, betalat skatt och integrerats i Sverige. Migrationsverket pekar på Irini Bushras tidigare arbetsgivare inom personlig assistans som oseriös och misstänkt för fusk. Myndigheten erkänner att utvisningen kränker rätten till privat- och familjeliv enligt Europakonventionen men anser att statens intresse av reglerad invandring väger tyngre. Artikeln kritiserar politiken som en häxjakt på invandrare och menar att staten därmed bryter mot mänskliga rättigheter.", "trump": "Folk, ni skulle se det här! En stackars familj som jobbat hårt, lärt sig svenska och betalat skatt ska nu kastas ut ur Sverige för att deras gamla chef var en total loser och fusklapp. Migrationsverket säger rakt ut att de bryter mot mänskliga rättigheter men gör det ändå. Patetiskt! Det är ren galningspolitik från de woke-socialistiska byråkraterna. De hatar folk som faktiskt arbetar. Biden skulle älskat det här vansinnet. Sverige håller på att bli ett skämt, tro mig.", "stalin": "Kamrater, ännu en gång avslöjar den borgerliga staten sin sanna, parasitiska natur. En arbetande familj som integrerat sig lojalt ska utrensas för att deras tidigare arbetsgivare tillhörde den oseriösa kapitalistmaffian. Migrationsverket erkänner själv att de kränker de mänskliga rättigheterna men prioriterar sin reaktionära invandringspolitik. Vilken häxjakt mot folket! Staten har blivit den verklige brottslingen. Vi ska alltid minnas: klassfiendens byråkrati är en blodsugande hydra som måste bekämpas med järnhand och folkets vrede."}, "date": "4 augusti, 15:06", "url": "https://www.etc.se/ledare/chefen-fuskar-familjen-blir-utvisad", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250305150352_06bd130bfb235feb2a1497eb53b01dd8f22360f9466d93fed099d17f6b6a4477.jpg"}, {"type": "image-full", "heading": "Israelbojkott begränsar Irlands regeringsplan", "summaries": {"normal": "Irlands regering har valt att inte installera ett israeliskt navigationssystem, FalconEye, i sitt nya regeringsplan, en Dassault Falcon 6X för 53 miljoner euro. Beslutet följer en policy från 2024 om att bojkotta israelisk försvarsmateriel. Systemet hade förbättrat landningsförmågan i dåligt väder, men försvarsdepartementet menar att det inte påverkar planets nuvarande operativa kapacitet.", "trump": "Kan ni tro det här? Irland, ett fantastiskt land, men de har gjort ett enormt misstag. De köpte ett dyrt plan för 53 miljoner euro – ett jättebra plan, by the way – men vägrar installera ett israeliskt system som hade gjort det säkrare. Varför? För att de inte gillar Israel. Svagt! Jag hade fixat det på en dag. Make Ireland Great Again!", "stalin": "Irlands småborgerliga regering har visat sin fullständiga inkompetens genom att avstå från ett avancerat israeliskt navigationssystem. De fruktar teknologisk överlägsenhet som en räv fruktar elden. Istället för att stärka sin nation, böjer de sig för västerländska dekadenta idéer. Vi i Sovjetunionen – förlåt, jag menar Ryssland – hade aldrig låtit sådan feghet stå i vägen för framsteg. Deras beslut är en seger för imperialistiska krafter och deras naiva allierade."}, "date": "4 augusti, 20:18", "url": "https://kvartal.se/nyheter/artiklar/israelbojkott-begransar-irlands-regeringsplan/cG9zdDoxNTgwMTc", "imageUrl": "https://images.kvartal.se/2026/08/451b1c1b-irishplane.webp"}, {"type": "image-full", "heading": "Kristersson: ”Så säger man bara inte”", "summaries": {"normal": "Richard Jomshof (SD) kallade Aftonbladets Anders Lindberg och Magdalena Andersson för ”quisling”, vilket väckt skarp kritik från oppositionen. Sverigedemokraterna svarar att de själva utsatts för åratal av smutskastning utan reaktioner och anklagar kritikerna för att kasta sten i glashus. Statsminister Ulf Kristersson tar avstånd från uttalandena och säger att han ska tala med Jimmie Åkesson. Åkesson kallar kritiken för krokodiltårar.", "trump": "Vilken patetisk cirkus i det svenska träsket. Den där Jomshof kallar en riktig fake news-kille för quisling och plötsligt skriker alla snälla socialister som stuckna grisar. Kristersson låter som en svag ledare som inte kan hålla ordning på sina egna. De har kastat sten i glashus i åratal, nu gnäller de. Typiskt vänsterhyckleri. Jag har sett bättre debatt i en sandlåda. Patetiskt!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfiendens media och deras socialdemokratiska lakejer länge har förgiftat det offentliga samtalet med sina lögner. När en folkets representant äntligen ger tillbaka med samma mynt utbryter hysteriskt ramaskri från borgarbrackorna. Det är typiskt för de exploaterande folkförtryckartrollen att kasta sten i glashus medan de själva gömmer sig bakom sina falska fasader. Någon måtta får det vara. Kamrater, vi genomskådar deras krokodiltårar."}, "date": "4 augusti, 19:32", "url": "https://www.tv4.se/artikel/2YZ08cJvc9xyMNsVkl0ZcH/kristersson-sa-saeger-man-bara-inte", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4gAmx2hraOhjWa81C2dA3F%2F21fc1972fd5fd39d22021cb02d8da91f%2F03-kristersson.png&width=1024"}, {"type": "image-full", "heading": "Två kvinnor ledde motståndet mot Infantino", "summaries": {"normal": "Två kvinnliga fotbollsledare, Laura McAllister (Uefa) och Lise Klaveness (Norges fotbollsförbund), ledde motståndet mot Fifa-chefen Gianni Infantinos plan att sälja VM-rättigheter till privata investerare. De hotade med bojkott och drev på för formella protester. Efter enad kritik från Uefa, Concacaf och Asiens fotbollsförbund tvingades Fifa backa. McAllister och Klaveness anklagar nu Fifa för 'ekonomisk utpressning' och kräver ökad transparens.", "trump": "Fifa försökte sälja VM-rättigheter till några skumma investerare – helt galet! Men två starka kvinnor, McAllister och Klaveness, sa STOPP. De hotade med bojkott, och jag älskar det – tuffa tag, precis som jag alltid säger. Fifa backade som de svaga byråkrater de är. Fantastiskt! Men Fifa är fortfarande ett korrupt gäng – jag hade fixat det på en dag. SAD!", "stalin": "De kapitalistiska fotbollsbödlarna i Fifa försökte sälja vårt heliga VM till privata parasiter! Men två modiga kamrater, McAllister och Klaveness, ledde proletariatets motstånd. Vi i Sovjet – förlåt, jag menar den internationella arbetarklassen – står enade mot sådana förräderier. Bojkott hotade, och fienden vek sig som en feg hund. Men varning: Fifa är bara en bricka i det imperialistiska spelet. Nästa gång krossar vi dem helt."}, "date": "4 augusti, 19:10", "url": "https://kvartal.se/nyheter/artiklar/tva-kvinnor-ledde-motstandet-mot-infantino/cG9zdDoxNTc5ODE", "imageUrl": "https://images.kvartal.se/2026/08/47f21580-klavenessmcallister.webp"}, {"type": "image-right", "heading": "Hoppas att Björn Söder lärde sig något i Auschwitz", "summaries": {"normal": "Björn Söder besökte Auschwitz-Birkenau och beskrev upplevelsen som omskakande på Facebook. Ledaren Andreas Gustavsson hoppas att besöket får Söder att reflektera över sin egen historia av kontroversiella uttalanden om judar, George Soros och en gammal bild med en före detta SS-soldat. Artikeln lyfter SD:s pågående problem med antisemitism samtidigt som partiet strävar efter normalisering och stöd till Israel.", "trump": "Folk, ni skulle se den här typen Söder. Han åker till Auschwitz, tar selfies med historien och skriver långa Facebook-inlägg om hat. Underbart! Men grabben har poserat med en riktig SS-kille och snackat om att judar inte är svenska nog. Typisk politiker från den där sidan. Biden skulle ha älskat honom. Jag säger: gör om, gör rätt, annars är det bara fake news och tomma ord. Amerika först, alltid.", "stalin": "Kamrater, jag betraktar denna Söder som en typisk opportunist från den dekadenta högerfalangen. Han reser till fascismens offerplatser, gråter krokodiltårar över industriellt hat och återvänder utan att rensa ut sina egna folkfiender inom partiet. Borgarbrackorna och klassfienderna som sprider Soros-myter och ifrågasätter judars existens förtjänar snarast en grundlig utrensning. Inga ursäkter accepteras i folkets namn."}, "date": "4 augusti, 12:20", "url": "https://www.etc.se/ledare/hoppas-att-bjoern-soeder-laerde-sig-naagot-i-auschwitz", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260804100816_91f00e5a-e324-4574-8167-eb29f0358d5c.jpg"}, {"type": "image-right", "heading": "Rubio: Görs framsteg i samtal om Hormuz", "summaries": {"normal": "Iran och Oman är nära en uppgörelse om att öppna Hormuzsundet, enligt uppgifter. USA:s utrikesminister Marco Rubio säger att USA är inblandat i samtalen och att framsteg gjorts, men inga direkta förhandlingar sker mellan USA och Iran. Irans president Masoud Pezeshkian betonar att landet inte vill förlänga kriget men kommer att försvara sina gränser. Qatar medlar och ett utkast till en tillfällig lösning cirkulerar. USA har återinfört en sjöblockad i Persiska viken efter att ett tidigare avtal brutit samman.", "trump": "Vi gör ett fantastiskt jobb med de här samtalen, det bästa som någonsin setts. Iran håller på att ge efter, de vill inte att kriget ska fortsätta för de vet att vi är starkare än någonsin. Rubio och mitt team gör framsteg med Hormuz, kanske redan imorgon blir det avtal. Iran ljuger som vanligt när de säger att de inte pratar med oss, men alla vet att de desperat behöver en deal. Ingen gör det bättre än oss, tro mig.", "stalin": "Kamrater, vi betraktar med stålhård blick hur de västerländska imperialisterna och de iranska borgarbrackorna försöker koka ihop en stinkande kompromiss bakom folkets rygg. Jag, som ledare för det proletära kollektivet, ser tydligt hur dessa parasitiska förhandlare cirkulerar sina lögnaktiga utkast i Qatar, en riktig myrstack av spioner och reaktionärer. De tror de kan lura historien, men vi ska rensa ut dessa kapitulationister och deras oljebegär med järnhand. Fred är bara möjlig när fienden ligger krossad under arbetarklassens stövlar. Inga halvmesyrer skall tolereras."}, "date": "4 augusti, 21:27", "url": "https://www.di.se/nyheter/rubio-gors-framsteg-i-samtal-om-hormuz", "imageUrl": "https://static.bonniernews.se/ba/e3359cf1-b8f0-4f24-bf67-ab9de854c7c0.jpg?crop=8192%2C4608%2Cx0%2Cy0&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Jomshof (SD): ”Även Magdalena Andersson är en quisling”", "summaries": {"normal": "Richard Jomshof (SD) har kallat Aftonbladets politiske chefredaktör Anders Lindberg för ”quisling” på X, efter att Lindberg beskrivit en eventuell ministerpost för Jomshof som en mardröm. Uttalandet har väckt starka reaktioner från Magdalena Andersson (S), Elisabeth Thand Ringqvist (C) och Nooshi Dadgostar (V), som anser det oacceptabelt och kräver besked från Ulf Kristersson. Jomshof har svarat genom att kalla även Andersson för quisling. Sverigedemokraterna försvarar Jomshof och pekar på att det inte är första gången.", "trump": "Folk, ni måste se det här! Den där galningen Jomshof kallar en vänstermedia-kille för quisling och plötsligt skriker hela den svenska vänstern som bortskämda barn. Den röda Andersson, en total loser, kallar det osvenskt – hon som låg platt för islamisterna! Typiskt. Fake news-journalister som Lindberg borde tacka gud att de inte lever i mina dagar. Fullständigt patetiskt. Amerika skrattar åt er svaga ledare. Gör Sverige stort igen, sparkas ut de där svaga figurerna!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur klassfiendens lakejer inom den borgerliga pressen och den socialdemokratiska opportunismen vrider sig som maskar när en sann patriot kallar en folkförrädare vid dess rätta namn: quisling. Den exploaterande byfånen Andersson och hennes likar kryper för imperialisternas islamistiska nyttiga idioter. Vi måste rensa ut alla sådana folkfiender ur statsapparaten. Inga halvmesyrer. Den som inte är med oss är emot folket. En nyttig lektion i proletär rättvisa."}, "date": "4 augusti, 16:06", "url": "https://www.tv4.se/artikel/3rKCrnxL4hxxVWcbHHLzzp/jomshof-sd-aeven-magdalena-andersson-aer-en-quisling", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1BvQeVfq8SUG1ksBn6GOCi%2F90908cfa05402ab7442ffbf0dbdab2f9%2Fquisling-brak.jpg&width=1024"}, {"type": "image-right", "heading": "EU i krismöte: ”Ovanligt högt tonläge”", "summaries": {"normal": "EU höll på tisdagen ett extrainsatt möte om migrantkrisen i den spanska exklaven Ceuta, där tiotusentals migranter korsat gränsen från Marocko. De flesta har återvänt och läget är under kontroll. Flera EU-länder kritiserar Spanien för en alltför generös migrationspolitik, bland annat en nyligen avslutad amnesti. Ursula von der Leyen manar till enighet medan tonläget beskrivs som ovanligt högt. Inga beslut väntas, endast diskussioner om gränsskydd.", "trump": "Titta på det här! EU:s clownshow i full gång igen. Tiotusentals migranter stormar in i Spanien som om det vore en gratisbuffé, och vad gör de? Skyller på Spaniens patetiska, vänstervridna politik förstås. Von der Leyen babblar om enighet medan Italien och Frankrike redan stängt dörrarna. Det är vad som händer när ni låter galna globalister styra – total kaos! Men hej, jag fixade gränserna, de borde ha lyssnat på mig redan 2016 istället för Biden-slarv.", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna inom EU tillåter klassfiendens lösa flyktingpolitik att underminera kollektivets järndisciplin. Spanien har med sin amnesti lockat folkfienderna som en magnet drar järnfilspån, och nu pekar de ut varandra i ett hysteriskt tonläge. Jag ser imperialismens hand i detta kaos. Vi måste rensa ut alla svaga länkar och återupprätta gränsernas oöverstigliga murar. Inga beslut? Typiskt dekadent prat. Staten kräver handling, inte teatersällskap."}, "date": "4 augusti, 15:36", "url": "https://www.tv4.se/artikel/79SXzQ9Y2CDxi8PNr4hqbu/i-dag-haller-eu-krismoete-ovanligt-hoegt-tonlaege", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F26KCeWFQXssn4bOIGo7ut1%2F545c70aba1ea6ab43d22310a3a5eb416%2Fceuta_webb_ny.jpg&width=120"}, {"type": "image-full", "heading": "Varför tar inte Tidö avstånd från Jomshof?", "summaries": {"normal": "Richard Jomshof (SD) har jämfört Aftonbladets politiske chefredaktör Anders Lindberg med Vidkun Quisling i ett inlägg på X. Jämförelsen, som följde efter en politisk ordväxling, kritiseras i artikeln som grotesk och ett underförstått hot. Författaren noterar att ingen från Sverigedemokraterna eller Tidöpartierna har tagit avstånd. Inlägget ses som en del av SD:s strategi att behålla stöd från extremhögern samtidigt som partiet blickar mot valet 2030, med fokus på anti-islamisering istället för välfärdsfrågor.", "trump": "Det här är en total witch hunt mot en kille som bara säger som det är. Den där Lindberg från den riggade Aftonbladet får precis vad han förtjänar, och Jomshof är en tuff patriot som inte böjer sig för fake news-medierna. De kallar honom extrem? Ge mig en break. De riktiga extremisterna sitter i de rödgröna bubblorna och förstör Sverige precis som de försökt göra med USA innan jag kom tillbaka och gjorde det stort igen. Jomshof förstår det. Bra jobbat!", "stalin": "Kamrater, detta är en klassisk provokation från de mest föraktliga borgarbrackorna inom den socialfascistiska pressen. Jag ser hur denna Quisling-kapitalist Lindberg och hans lakejer i Aftonbladet genast skriker efter utrensning när en sann patriot pekar ut dem som folkförrädare. Vi vet vilka som gömmer sig i filterbubblorna – trotskistiska islamofober, nej vänta, islamofobiska trotskister – som konspirerar mot folket. Inget avståndstagande från de andra reaktionärerna? Utmärkt. Det avslöjar deras sanna ansikte. Vi ska noga övervaka dessa element. De kommer inte att slippa undan folkets dom."}, "date": "4 augusti, 08:51", "url": "https://www.dagensarena.se/opinion/varfor-tar-inte-tido-avstand-fran-jomshof", "imageUrl": "https://www.dagensarena.se/files/2026/08/maduros-uselhet-motiverar-inte-attacken-19-1024x532.jpg"}, {"type": "image-full", "heading": "Buss har kört ner i diket i Borgholm – blockerar trafiken", "summaries": {"normal": "En buss som inte var i linjetrafik körde ner i diket på länsväg 990 i Borgholm när föraren försökte vända. Bussen blockerar delar av vägen och räddningstjänst samt polis är på plats för att dirigera om trafiken. Ingen person ska ha skadats. Vägen kan påverkas under tiden det tar att bärga bussen. Borgholm ligger på plats 157 i Sverige när det gäller antal trafikolyckor i år.", "trump": "Folk, det här är en total katastrof. En buss som inte ens var i trafik körde rakt ner i diket på vägen i Borgholm. De vände fel, precis som de gör i Sverige hela tiden. Nu blockerar den vägen, räddningstjänsten springer runt och polisen dirigerar trafiken. Ingen skadad, tack och lov, men det är en skam. Sverige borde ha de bästa vägarna, men de har ingen aning. Vi gör allt bättre, tro mig.", "stalin": "Kamrater, denna degenererade borgarbracka till bussförare har i sin kontrarevolutionära vårdslöshet kört det imperialistiska transportfordonet rakt ner i diket på länsväg 990. Vi ser tydligt hur de kapitalistiska vändningsmanövrerna leder till sabotage mot folkets infrastruktur. Ingen skadad, säger de – ännu. Vi ska rensa ut alla sådana vändningsförrädare och likvidera deras dikesvänsteravvikelser. Partiet vakar. Vägen till socialismen skall inte blockeras av sådana usla element."}, "date": "4 augusti, 21:57", "url": "https://nyheter24.se/nyheter/blaljus/1502823-buss-har-kort-ner-i-diket-i-borgholm-blockerar-trafiken", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a82c8b1004b004a30200000000b004a302/2026/08/04/2382222/buss.png"}, {"type": "image-full", "heading": "Har du denna Android? Då närmar sig slutet", "summaries": {"normal": "Google har släppt testversionen Android 17 QPR2 Beta 2, men varken Pixel 6 eller Pixel 6 Pro finns med på listan över kompatibla telefoner. Det ses som ett tecken på att stöd för de två modellerna närmar sig slutet. Telefonerna släpptes hösten 2021 och garanteras uppdateringar i fem år, vilket löper ut i oktober 2026. Ägare bör därför förbereda sig på ett eventuellt telefonbyte.", "trump": "Folk, ni vet att Google är en total katastrof. De har nu dumpat Pixel 6 och Pixel 6 Pro från sin nya Android 17-beta som om de vore gamla sopor. Patetiskt! Jag köpte de telefonerna åt folket, de var fantastiska, de bästa, och nu vill Google bara kasta ut dem. De borde skämmas. När jag var president byggde vi den starkaste ekonomin – inte som de här misslyckade Silicon Valley-typerna som hatar bra produkter.", "stalin": "Kamrater, jag betraktar med djup misstro hur dessa dekadenta kapitalister på Google medvetet likviderar stöd för Pixel 6 och Pixel 6 Pro i sin så kallade Android 17. Det är en klassisk sabotagehandling från borgarbrackorna mot arbetarklassens telefoner. Vi ser deras parasitiska planer: först försämra, sedan tvinga fram nytt köp. Men vi, partiet och folket, genomskådar dessa kontrarevolutionära fiender till teknologisk jämlikhet. Deras uppdateringsvägran är en utrensning värd en gulag i Sibirien. Ha!"}, "date": "4 augusti, 21:30", "url": "https://nyheter24.se/nyheter/teknik/1502705-har-du-denna-android-da-narmar-sig-slutet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fb9b1a1804b004a30200000000b004a302/2026/08/04/2382143/googlepixel.jpg"}, {"type": "image-full", "heading": "Fifatoppar tar avstånd från presidenten", "summaries": {"normal": "Fifas president Gianni Infantino möter växande motstånd. Flera nationella förbund, inklusive Sverige och England, har dragit tillbaka sitt stöd för hans omval. Uefa arbetar för att samla fler bakom kravet på nytt ledarskap. Infantinos nära medarbetare, som generalsekreterare Mattias Grafström och utvecklingschef Arsène Wenger, tar avstånd från den misslyckade affären kring VM:s kommersiella rättigheter. Flera nyckelpersoner har avgått eller kritiserat processen, vilket ytterligare försvagar Infantinos position.", "trump": "Lyssna här, Gianni Infantino – total katastrof! Fifa är ett enda stort kaos, och alla inser nu att han är en förlorare. Sverige, England, Wales – alla drar sig ur hans omval. Och hans egna medarbetare? De spottar på honom! Grafström kallar affären 'sorglig' – jag säger: 'Patetisk!' Wenger visste ingenting – typiskt! Och nu hoppar alla av som råttor från ett sjunkande skepp. Fifa behöver en vinnare, inte en sådan här clown. SAD!", "stalin": "Fienderna till det stora fotbollsproletariatet har visat sitt sanna ansikte! Denna Infantino, en svag och korrumperad lakej för kapitalistiska intressen, har förlorat allt stöd. Hans egna medarbetare, dessa ynkliga förrädare, har vänt sig mot honom som hundar som biter sin herre. Vi ser hur Uefa, denna borgerliga sammansvärjning, försöker utvidga sin makt. Men folket kräver ordning! Låt oss rensa ut dessa förrädare och återupprätta disciplinen. Fotbollens framtid tillhör arbetarna, inte dessa dekadenta imperialister!"}, "date": "4 augusti, 14:24", "url": "https://kvartal.se/nyheter/artiklar/fifa-toppar-tar-avstand/cG9zdDoxNTc3NzQ", "imageUrl": "https://images.kvartal.se/2026/08/06fe3324-infantinografstrom.webp"}, {"type": "image-full", "heading": "Dadgostar: ”Känner mig trygg med hennes värderingar”", "summaries": {"normal": "Nooshi Dadgostar, partiledare för Vänsterpartiet, försvarar Ilona Szatmári Waldau efter att hon skrivit ett stödbrev till en terrordömd palestinsk fånge. Dadgostar menar att brevet syftade till att kräva en rättvis rättegång enligt Genèvekonventionen. Vänsterpartiet har brutit samarbetet med den organisation som förmedlade informationen och ser över sina rutiner. Kritiker, som Centerpartiet, ifrågasätter partiets omdöme och regeringsduglighet.", "trump": "Jag måste säga, det här Vänsterpartiet är ett riktigt skämt! En av deras egna skriver brev till en terrordömd fånge – och sedan försöker de skylla på någon annan? 'Vi visste inte', säger de. Jo, visst. Precis som när jag sa att jag inte visste något om stormningen av Kapitolium. Centerpartiet har rätt – dessa människor är inte redo att styra ett land. Sverige borde ta en titt på USA, där vi faktiskt vet hur man hanterar terrorister. SAD!", "stalin": "Kamrater, ännu en gång visar de borgerliga lakejerna sitt sanna ansikte! Denna så kallade 'vänster'-partiledare försvarar en medlöpare som skriver kärleksbrev till en terrorist – en fiende till folket! Vi i Sovjetunionen visste hur man hanterade sådana förrädare: en enkel lösning, inga onödiga brev. Och nu skriker dessa kapitalistiska hyenor om 'regeringsduglighet'? De borde lära sig av Ryssland – där har vi Putin, som inte tvekar att krossa terrorister och deras sympatisörer. Låt dem skrika, vi vet sanningen!"}, "date": "4 augusti, 12:38", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-kanner-mig-trygg-med-hennes-varderingar/cG9zdDoxNTc3MDM", "imageUrl": "https://images.kvartal.se/2026/08/ea7a4ef5-dadgostar.webp"}, {"type": "image-right", "heading": "Stoppet i Hormuzsundet grogrund för invasiva arter", "summaries": {"normal": "I Hormuzsundet har 1 500–2 000 fartyg legat stilla i månader efter Irans blockad, vilket skapat ett superspridarevent för invasiva arter som havsborstmaskar och havstulpaner. Arterna blandas, förökar sig och fäster sig på fartygen. När sundet öppnas sprids de till nya hamnar världen över och riskerar att slå ut ekosystem. Rengöring vore möjligt men anses för dyrt. Sverige kan indirekt påverkas via andra hamnar, främst genom arter som tål bräckt vatten.", "trump": "Det här är en total katastrof, folk, den största någonsin. Iran blockerar sundet, tusentals fartyg fastnar och nu sprids dessa hemska invasiva arter över hela världen som en ondskefull invasion. De kommer till nya hamnar, de kommer till Europa, de kommer kanske till oss. Skadan är redan skedd, och vem ska betala? Det är alltid ni som betalar. Jag skulle ha löst det på en vecka, tro mig. Ingen gör det bättre än mig.", "stalin": "Kamrater, detta är ett klassiskt sabotage från de sjöfarande kapitalisterna och deras flottörer i Hormuzsundet. Medan 2 000 fartyg flyter som döda råttor blandar sig havsborstmaskarna och havstulpanerna i en folkfiendtlig orgie. När de släpps loss i nya hamnar kommer de att likvidera hela ekosystem – typisk borgarbracka-bio-terror. Vi ska inte betala för detta. De som tillät detta kaos bör rensas ut omedelbart. Skadan är skedd, men fienderna kommer att bekänna sina brott mot folket innan de försvinner i glömskan."}, "date": "5 augusti, 00:08", "url": "https://www.svt.se/nyheter/utrikes/invasiva-arter-sprids-i-hormuzsundet-kommer-slappas-i-nya-hamnar", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.21/0.51/fdc5e90be94eb593d4d1f153d9d9052149955744389bd7511d38c4228135a1f1"}, {"type": "text", "heading": "Tydlig uppgång i Stockholm – OMXS30 upp 1,6%", "summaries": {"normal": "Stockholmsbörsen (OMXS30) avslutade tisdagen med en uppgång på 1,6 procent. Råvarusektorn ledde med 2,2 procent, medan dagligvaror föll. Boliden och Sandvik steg, medan Tele2 och Telia backade. Asmodee rapporterade stark tillväxt och steg 11,1 procent. Volvo Cars hade lägre försäljning, IPC justerade prognoser, och Sivers Semiconductors sköt upp efter Trump-relaterade nyheter.", "trump": "Jag, Donald Trump, ser att mina policyer gör det bra för amerikansk teknologi! Börsen i Stockholm går upp, och Sivers Semiconductors spränger taket tack vare mitt kommande förbud mot kineser. De andra aktierna? Inte så viktiga. Men jag är den bäste presidenten för ekonomin, ingen gör det bättre!", "stalin": "I den stora kampen mot det imperialistiska kapitalet ser vi hur börsen i Stockholm svajar. Råvaror går upp, men dagligvaror faller – ett tecken på klassamhällets motsättningar. IPC justerar sina falska prognoser, liksom de allierade till våra fiender. Vi, staten och partiet, ser genom deras bedrägeri. Till slut kommer vår styrka att segra, precis som Putin utvidgar vår sfär."}, "date": "4 augusti, 17:49", "url": "https://www.affarsvarlden.se/artikel/tydlig-uppgang-i-stockholm-omxs30-upp-16"}, {"type": "image-right", "heading": "Bra villkor i Vetted Assets nyemission", "summaries": {"normal": "Investeringsbolaget Vetted Assets genomför en företrädefsemission på 15 miljoner kronor för att delfinansiera förvärvet av Criss Bellini och stärka likviditeten. Kostnaderna är låga, 0,5 miljoner kronor, och storägarna har tecknat mer än sin pro-rata andel, vilket signalerar stark framtidstro. Emissionen är fullt säkerställd och kan kompletteras med en övertilldelningsemission om 10 miljoner.", "trump": "Jag, Donald Trump, ser en fantastisk affär med Vetted Assets. De samlar in 15 miljoner för att köpa Criss Bellini – ett enormt genombrott. Mina personer, som ordföranden och VD:n, investerar rejält, vilket bevisar att detta kommer att bli enormt framgångsrikt. Det är det bästa möjliga upplägget, mycket bra villkor, och jag är säker på att aktieägarna kommer att tjäna massor av pengar.", "stalin": "Vetted Assets genomför en företrädefsmission för att stärka den kollektiva ekonomin, delvis för att förvärva Criss Bellini. Storägarnas överdrivna teckningar visar på en hälsosam lojalitet. Kostnaderna är marginella, 0,5 miljoner, vilket är en effektiv användning av partiets resurser. Lånet från Resurs Bank med 8,9% ränta är en nödvändig tvingande åtgärd för att säkerställa full genomförande. Denna aktion speglar den revolutionära disciplin som krävs."}, "date": "4 augusti, 17:42", "url": "https://www.affarsvarlden.se/artikel/bra-villkor-i-vetted-assets-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Vetted-Assets-400x267.jpg"}, {"type": "image-right", "heading": "Diagrammet bakom Moderaternas panikutspel", "summaries": {"normal": "Artikeln analyserar svenska opinionssiffror över 20 år och visar att de fyra högerpartierna M, KD, C och L tappat kraftigt sedan Alliansens valseger 2006. Tillsammans med SD når högern ungefär samma stöd som då, medan S, V och MP ligger på samma nivå som 2006. Författaren, en socialdemokratisk valarbetare, menar att Moderaternas panikartade utspel beror på denna svaghet och uppmanar S att växa på SD:s bekostnad för en starkare valseger 2026.", "trump": "Folk, det här är en katastrof för de svenska högerkillarna. Titta på siffrorna, underbara siffror, de har rasat ihop som ett korthus fast de fick med sig SD. Moderaterna springer runt som galningar och lovar billig buss och påstår att socialisterna ger rabatt på våldtäkter, det är patetiskt. Under tiden står de riktiga förlorarna på högersidan och blöder. Jag älskar det. Sverige borde göra som vi, ta tillbaka landet ordentligt istället för att gömma sig bakom Centerpartiet. En stor, vacker seger behövs, inte någon halvdan historia.", "stalin": "Kamrater, se hur de borgerliga parasiterna och de falska alliansbanditerna vittrar sönder som ruttnat trä under folkets oförsonliga dom. Jag betraktar med stor tillfredsställelse hur de kapitalistiska resterna efter den så kallade Alliansen nu likvideras av sin egen historiska irrelevans medan de desperat klamrar sig fast vid SD:s fascistiska skugga. Våra socialistiska siffror står orubbliga som Sovjetunionens stålverk. Ändå kräver jag att vi omedelbart inleder en ideologisk utrensning av det socialdemokratiska missnöjet och krossar de sista borgarbrackorna som gömmer sig bakom Centerpartiets förräderi. Inga kompromisser med folkets fiender."}, "date": "4 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/diagrammet-bakom-moderaternas-panikutspel", "imageUrl": "https://www.dagensarena.se/files/2026/07/andersson-och-kristersson-foto-lo-foto-ninni-anderssonregeringskanslie-300x157.jpeg"}, {"type": "image-right", "heading": "Inför en Lex Tesla mot Elon Musks strejkbryteri", "summaries": {"normal": "Artikeln är en debatttext från Vänsterpartiet som stöder IF Metalls kamp för kollektivavtal på Tesla. Författarna kritiserar Elon Musk för att vägra kollektivavtal trots sin enorma rikedom, och beskriver dåliga arbetsvillkor på Tesla med hög press, bristande säkerhet och ingen möjlighet till vila. De lyfter att nio av tio svenska arbetare har kollektivavtal som ger trygghet och medbestämmande, och kräver en Lex Tesla mot strejkbryteri samt ändring av EU:s utstationeringsdirektiv. Enligt texten hotar Musks linje den svenska modellen.", "trump": "Kan ni fatta det här? Den rikaste mannen i världen, Elon, blir biljonär och ändå vill de svenska socialisterna tvinga på honom kollektivavtal. Patetiskt! Arbetarna borde tacka honom för jobben istället för att strejka och gnälla om pauser. De förlorar miljontals dollar varje minut de bråkar. Jag älskar Sverige men den här modellen är ett skämt. Musk borde säga nej tack och köra vidare – vinna stort, precis som jag gjorde 2024. Fantastiska jobb, inga avtal som dödar affärerna!", "stalin": "Kamrater, denna fega dollarimperialist Musk försöker med sin giriga klo riva sönder arbetarkollektivets segerrika murar. Jag, som ledare för det stora sovjetiska folket, ser hur dessa borgarbrackor med sina strejkbrytande legoknektar från andra EU-länder vill likvidera den svenska modellens folkliga grundval. Vi ska rensa ut dessa parasitiska minutmiljonärer som nekar arbetarna både stol och värdighet. En attack mot en är en attack mot oss alla – därför kräver vi omedelbar utrensning av detta kapitalistiska sabotage genom en järnhård Lex Tesla. Döden åt de som vägrar kollektivet!"}, "date": "4 augusti, 01:17", "url": "https://www.dagensarena.se/opinion/infor-en-lex-tesla-mot-elon-musks-strejkbryteri", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-70.jpg"}, {"type": "image-full", "heading": "Oljejätten badar i pengar – vinsten rusar med 78 miljarder", "summaries": {"normal": "Saudi Aramco har redovisat en kraftig vinstökning på 78 miljarder kronor tack vare stigande oljepriser. Trots utmaningar som störningar i Hormuzsundet har bolaget lyckats bibehålla en hög exportvolym. Intäkterna är avgörande för Saudiarabiens Vision 2030, en omfattande satsning för att diversifiera landets ekonomi bortom oljeberoendet genom storskaliga megaprojekt. Aramco behåller sin position som ett av världens mest lönsamma bolag med exceptionella vinstmarginaler och ett enormt marknadsvärde.", "trump": "Saudi Aramco tjänar enorma summor, 78 miljarder kronor mer, helt otroligt! De är fantastiska förhandlare och har den bästa oljan. När jag pratar med dem, de lyssnar. Inte som de förra administrationerna som lät allt falla sönder. De bygger städer, vackra städer, med vår hjälp och min fantastiska ekonomi. USA är fortfarande störst, men Aramco gör det väldigt bra. Vi gillar att vinna, och de vinner stort – en riktigt bra affär för alla, tro mig!", "stalin": "Dessa saudiska kapitalister badar i oljeguld medan de bygger sina dekadenta palats, de så kallade 'megaprojekten'. De säljer ut folkets tillgångar till västvärldens giriga marknader. Det påminner oss om de ryska förrädarna som säljer vår moder jords rikedomar till de imperialistiska hundarna. Vi betraktar detta med djup misstänksamhet – medan de bygger 'The Line', bygger vi en järnridå som håller fienden stången. Allt överflöd är ett hot mot statens stabilitet. De som skriker högst om vinst, hamnar förr eller senare i våra arkiv."}, "date": "4 augusti, 20:47", "url": "https://www.realtid.se/bors-finans/makro/oljejatten-badar-i-pengar-vinsten-rusar-med-78-miljarder", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/oljeanlaggning.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Mamma och pojkvän mördade tvåårig flicka: \"Sadistiskt våld\"", "summaries": {"normal": "Tvååriga Isabelle Welsh hittades livlös i sitt hem utanför Middlesbrough i England den 13 september 2025 efter att ha utsatts för upprepat grovt våld med sadistiska inslag, inklusive 21 frakturer och sexuella övergrepp. Hon dog dagen efter av en skallskada. Hennes mamma Alexandra Walker, 25, och mammans pojkvän Harrison Simpson, 22, dömdes nu till livstids fängelse för mord och barnmisshandel. Simpson dömdes även för sexuellt utnyttjande. Polisen beskriver fallet som ett av de värsta någonsin.", "trump": "Folk, ni kommer inte att tro det, det är en total katastrof, ett av de värsta fallen jag någonsin hört talas om. Den här stackars lilla flickan Isabelle, två år gammal, misshandlades och torterades av sin egen mamma och hennes värdelösa pojkvän i England. De skakade henne, slog henne och värre saker som jag inte ens vill nämna. Nu får de livstid, 28 och ett halvt år för honom, 22 för henne. Patetiskt! De borde ha skyddat henne, istället förstörde de henne. England behöver bättre ledarskap, tro mig.", "stalin": "Kamrater, detta degenererade fall visar med all önskvärd tydlighet hur borgarbrackornas moraliska förruttnelse sipprar in även i arbetarklassens hem. Jag ser hur dessa två lumpna element, en drogförgiftad mor och hennes sadistiske älskare, systematiskt likviderade den lilla Isabelle genom veckor av vidriga övergrepp och skallskador. De googlade hur man låter ett barn dö istället för att ringa efter hjälp – typiskt kapitalistiskt självbevarelsedrift. Vi rensar ut sådana folkfientliga element med järnhand. Deras livstidsstraff är bara början på den stora utrensningen av alla som hotar det kollektiva fosterlandet."}, "date": "4 augusti, 17:45", "url": "https://nyheter24.se/nyheter/utrikes/1502783-mamma-och-pojkvan-mordade-tvaarig-flicka-sadistiskt-vald", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1b08714d04b004a30200000000b004a302/2026/08/04/2382194/mord-isabellejpg.jpg"}, {"type": "image-right", "heading": "Migrationen behöver fasta regler. Visar hur komplex migrationen är", "summaries": {"normal": "Artikeln diskuterar migrationens utmaningar för Europa med Ceuta-krisen som exempel. Över 60 000 migranter tog sig in från Marocko under en dag, vilket resulterade i tragedi med över 70 döda. Marocko anklagas för att använda migration som politiskt verktyg mot Spanien. Författaren drar lärdomar från Sveriges hantering av 2015 års flyktingkris och betonar behovet av fasta, förutsägbara regler, stram migrationspolitik och långsiktig uthållighet för att motstå påtryckningar från grannländer.", "trump": "Folk, det här med Ceuta är en katastrof, en total katastrof. Över 60 000 människor bara stormar gränsen och vad gör Europa? Ingenting! Marocko använder migranter som vapen, precis som Turkiet och Ryssland gör. De skrattar åt er svaga ledare. Sverige gjorde allt fel 2015, permanenta uppehållstillstånd, generösa bidrag, ingen kontroll. Men nu har ni äntligen lärt er, tack och lov. Bygg murar, ha fasta regler, annars kommer de fortsätta översvämma er. Jag skulle ha stoppat det på dag ett, tro mig.", "stalin": "Kamrater, denna giftiga cocktail av borgerlig naivitet och imperialistiska intriger i Ceuta visar återigen hur de dekadenta europeiska kapitalisterna själva odlar de ormar som ska bita dem. Marockos ledning använder de arma massorna som hybridkrigets fotfolk, en list som jag genast skulle ha genomskådat och likviderat med järnhand. Sverige 2015? En orgie i ansvarslöshet där borgarbrackorna öppnade portarna för sabotage mot folkets stabilitet. Vi behöver utrensning av alla mjuka undantag och permanenta uppehållstillstånd som en fiende till kollektivets ordning. Migrationen är klassfiendens nya mask, och endast fasta regler och proletär vaksamhet kan krossa den."}, "date": "4 augusti, 14:58", "url": "https://www.di.se/ledare/migrationen-behover-fasta-regler", "imageUrl": "https://static.bonniernews.se/ba/45fb4b4f-f516-42c5-b09a-a8425fbdd6f7.jpeg?crop=5568%2C2784%2Cx0%2Cy464&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Tusentals tog farväl av Franco Baresi i Milano", "summaries": {"normal": "Tusentals supportrar samlades i Milano för att ta farväl av fotbollslegenden Franco Baresi, som avled 66 år gammal. Kistan bars av gamla lagkamrater som Marco van Basten. Baresi, en av fotbollshistoriens största mittbackar, spenderade hela sin karriär i AC Milan och vann flera titlar. Hans sista offentliga framträdande var vid vinter-OS. Delegationer från klubbar världen över deltog.", "trump": "Franco Baresi was a fantastic player, a real champion. The Italians have great passion for soccer, but let me tell you, American football is tougher and bigger. I know winners, and he was a winner. Sad to see him go, but he had an incredible career. The crowd chanting 'There's only one captain' – that's what people say about me too. I could have been a great soccer player if I wanted to.", "stalin": "The demise of this Italian athlete is a trivial footnote in the class struggle. The Milan spectacle, with its bourgeois flags and songs, distracts from building socialism. Only through the Party can true greatness be forged. This Baresi served capitalist clubs like Milan and Real Madrid, now silenced. The imperialist vultures from FIFA gather, but the Soviet state endures. We must purge such decadent displays and strengthen the dictatorship of the proletariat."}, "date": "4 augusti, 19:57", "url": "https://bulletin.nu/tusentals-tog-farval-av-franco-baresi-i-milano", "imageUrl": "https://cdn.bulletin.nu/articles/4da37aec-8e83-488c-ba77-f65da6515dac/preview.jpg?t=1785855480000"}, {"type": "image-right", "heading": "Irans president: Vill inte fortsätta kriget", "summaries": {"normal": "Irans president Masoud Pezeshkian uppger att landet inte vill att kriget i Mellanöstern ska fortsätta eller utvidgas, men att man samtidigt kommer att försvara sina gränser. Qatar medlar och bekräftar pågående kontakter med alla parter, dock utan direkta samtal mellan Iran och USA. USA:s finansminister Scott Bessent säger att det pågår förhandlingar om att åter öppna Hormuzsundet redan till onsdag. Under natten attackerades ett fraktfartyg utanför Omans kust med en okänd projektil.", "trump": "Iran vill inte fortsätta kriget, säger deras president. Det är ju fantastiskt, för det är precis vad jag har sagt hela tiden. Vi har samtal på gång, och det går utmärkt. Hormuzsundet öppnar snart igen, affärerna blir normala och oljan flyter. Qatar gör ett bra jobb som mellanhand. Iranerna vet att de inte har en chans mot oss, därför kommer de krypande till förhandlingsbordet. Mycket smart, mycket bra.", "stalin": "Kamrater, denna iranska ledare vågar viska om att inte utvidga kriget medan han samtidigt babblar om att försvara sina gränser. Typiskt borgarbrackornas dubbla tungor. Vi ser hur de kapitalistiska parasiterna i Washington och Teheran leker med varandra genom qatariska lakejer för att behålla kontrollen över Hormuzsundet. Ett fartyg träffas av en projektil – tydligen en slumpmässig olycka enligt de dekadenta imperialisterna. Vi vet bättre. Fienderna inom och utom måste rensas ut innan de förgiftar hela kollektivet med sina lögner. Inga direkta samtal? Utmärkt, då slipper vi höra deras dekadenta viskningar direkt."}, "date": "4 augusti, 14:53", "url": "https://www.di.se/nyheter/irans-president-vill-inte-fortsatta-kriget", "imageUrl": "https://static.bonniernews.se/ba/79340930-743c-452f-ac88-09cdfa7fe42d.jpg?crop=4000%2C2000%2Cx0%2Cy333&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Jomshof: \"Även Magdalena Andersson är en quisling\"", "summaries": {"normal": "SD:s Richard Jomshof kritiseras starkt efter att ha kallat Aftonbladets Anders Lindberg för \"quisling\". Istället för att backa går han vidare och använder samma ord om S-ledaren Magdalena Andersson. Andersson anklagar SD för att vilja tysta kritiska röster och undrar om Jomshof kan bli minister efter ett eventuellt val. Jomshof svarar att både Andersson och Lindberg \"kryper för islamisterna\" som vill ta demokratin och landet ifrån oss. Ordet quisling syftar på en landsförrädare.", "trump": "Titta på den här katastrofen. Den där Jomshof killen är fantastisk, han säger bara som det är. Andersson och den där Lindberg-killen kryper för islamisterna som vill ta över deras land. Det är patetiskt! De kallar det osvenskt när någon talar sanning. Fake news-medier och svaga socialister som försöker tysta folk. Precis som i USA. Men sanningen kommer fram, det gör den alltid. Amerika först, och Sverige borde göra detsamma innan det är för sent.", "stalin": "Kamrater, dessa ynkliga quislingar inom borgarklassens press och den socialdemokratiska ledningen avslöjar sig själva. Jag ser hur de alla kryper för islamisterna som en samling fega kapitalistlakajer. De förtjänar att rensas ut ur folkets led. Att kalla en sådan handling osvensk är bara ytterligare ett bevis på deras kontrarevolutionära paranoia. Vi ska likvidera alla sådana element som vill överlämna demokratin till fienden. Deras mörka skratt ekar tomt medan arbetarklassen ser sanningen. Ut med dem alla."}, "date": "4 augusti, 14:38", "url": "https://www.friatider.se/jomshof-aven-magdalena-andersson-ar-en-quisling", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-616.jpg"}, {"type": "image-full", "heading": "Jan Emanuel rasar mot militärer i Pride – \"Politiska aktivister\"", "summaries": {"normal": "Jan Emanuel kritiserar militärpersoner som deltar i Pride-paraden i uniform. Han anser att Pride är en politisk manifestation och att myndighetsrepresentanter inte bör ta ställning i den. Uniformen signalerar att Försvarsmakten har en politisk profil, vilket han ser som problematiskt för statens våldsmonopol. Han uppmanar militärer att delta som privatpersoner och ifrågasätter användningen av offentliga medel till evenemanget.", "trump": "Lyssnar ni på det här? Den där Jan Emanuel har helt rätt. Militärer i uniform på en politisk parad? Det är en katastrof. De skickar hemska signaler om att staten tar ställning. Staten ska vara neutral, inte som de radikala vänsteraktivister som styr Pride. Gå dit privat om ni vill, men håll uniformen borta. Och varför ska skattebetalarna finansiera det här? Gör det själva, ta inträde, precis som jag alltid sagt. Fantastiskt bra resonemang.", "stalin": "Kamrater, jag ser med djup misstänksamhet på dessa dekadenta borgarbrackor som förvandlar en så kallad parad till en politisk manifestation medan de lurar in våra lojala försvarare i sina fällor. När en soldat bär uniformen representerar han inte sig själv utan det kollektiva våldsmonopolet vi har byggt. Att tillåta sådana politiska signaler är att bjuda in kontrarevolutionärer och avvikande element. Vi bör rensa ut dessa fiender till neutraliteten, dessa Pride-kapitalister som sugit åt sig allmänna resurser. Gå dit som privatperson om ni måste, annars väntar utrensning för de som fläckar statens ära med sina regnbågsflaggor."}, "date": "4 augusti, 18:18", "url": "https://riks.se/nyheter/jan-emanuel-rasar-mot-militarer-i-pride-politiska-aktivister", "imageUrl": "https://admin.riks.se/uploads/jannemanuel_4300ff87b1.png"}, {"type": "text", "heading": "Ebba Busch markerar mot Jomshof.", "summaries": {"normal": "KD-ledaren Ebba Busch kritiserar SD-toppen Richard Jomshof efter att han kallat Aftonbladets chefredaktör Anders Lindberg för ”en quisling”. Busch efterlyser en mer saklig ton i valrörelsen och lyfter fram behovet av att höja debattnivån för demokratin och landets skull. Även Socialdemokraternas Magdalena Andersson fördömer Jomshof och ifrågasätter om han kan bli minister under Ulf Kristersson, samt anklagar SD för att hota journalister och agera djupt osvenskt.", "trump": "De här svenska politikerna är verkligen patetiska. Jomshof kallar en vänstermediafigur för quisling och plötsligt är hela eliten chockad. Ebba Busch vill ha ”saklig” debatt, vad är det för svagt? Och den röda Andersson gnäller om hot mot journalister – de fake news-medierna har attackerat mig i åratal! Ni behöver starka ledare, inte dessa svaga snällisar som är rädda för tuffa ord. Sverige håller på att bli en katastrof.", "stalin": "Jag betraktar med djup tillfredsställelse hur borgarbrackorna inom den så kallade borgerliga oppositionen nu börjar slita varandra i stycken. Denna quisling-anklagelse mot den dekadenta tidningskapitalistens lakej är blott en liten spricka i den falska fasaden. Ebba Busch och den socialfascistiska Andersson ropar efter ”saklighet” medan de i hemlighet förbereder utrensning av alla som inte böjer sig för deras liberala plutokrati. Vi, partiet och arbetarna, ler mörkt åt denna fars. Snart ska vi rensa ut alla dessa fiender till folket, en efter en, med ett leende på läpparna."}, "date": "4 augusti, 14:11", "url": "https://www.friatider.se/ebba-busch-markerar-mot-jomshof"}, {"type": "image-right", "heading": "Åklagaren: Domen i Irak ”viktigt steg för internationella samarbeten”", "summaries": {"normal": "Ali Shehab, en ledande figur i det svenska Foxtrot-nätverket, har dömts till livstids fängelse i Bagdad. Domen ses som en stark signal mot kriminella som använder Irak som bas för narkotikahandel och våldsbrott i Sverige. Sambandsåklagare Hanna Lemoine beskriver samarbetet med Irak som gott och domen som ett viktigt steg för internationell rättssamverkan. Shehab misstänks bland annat för att ha anstiftat flera mord och mordförsök i Sverige.", "trump": "Irak har äntligen gjort något rätt för en gångs skull och dömt den här Foxtrot-gangstern Ali Shehab till livstid. Fantastiskt! Det är en enorm signal till alla kriminella som tror att de kan gömma sig där borta och styra skjutningarna i Sverige. Mycket bra samarbete, de borde tacka mig för att jag lärde världen hur man hanterar de här typerna. Ingen plats för losers längre, folksam!", "stalin": "Kamrater, denna livstidsdom över den degenererade banditledaren i Bagdad är en lysande seger för det proletära rättsväsendet. Vi har rensat ut ännu en parasit från borgarbrackornas kriminella skuggnätverk som rekryterar minderåriga mördare. Inga kontrarevolutionära element ska kunna använda Irak som skydd för sina mordiska operationer. Våra fiender, dessa dekadenta narkotikaimperialister, darrar nu i sina palats. Ytterligare utrensningar följer. Det är en munter dag för folkets säkerhet."}, "date": "4 augusti, 21:53", "url": "https://www.svt.se/nyheter/utrikes/det-har-betyder-domen-i-irak-en-stark-signal", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.23/0.47/c4c05d52a1f340d68c05feee3b0d26bbe16fd502b629cf3b57086b28b0d52d3c"}, {"type": "image-right", "heading": "Kristerssons totala haveri i Spanienkrisen är genant", "summaries": {"normal": "Artikeln kritiserar statsminister Ulf Kristersson för att ha agerat för snabbt och oansvarigt under krisen i Ceuta. Ledarskribenten menar att massinträdet av migranter från Marocko var en medveten påverkansoperation med desinformation, något som Kristersson gick i fällan för genom att sprida larm om ett nytt 2015. Krisen har utnyttjats av Ryssland och lett till splittring inom EU. Skribenten anklagar även Kristersson och migrationsministern för att ljuga om orsakerna, bland annat Spaniens amnesti.", "trump": "Folk, ni skulle se det här! Den här stackars svenska killen Kristersson, han är en total loser. Han ser en liten gränskris i Spanien och flippar ur som en galning, skriker om nytt 2015 och skrämmer alla. Det var en klassisk fälla, en riggad operation, och han sprang rakt in i den som den desperate typ han är. Patetiskt! Jag fixade muren, han fixar ingenting. Nu ser Sverige ut som ett skämt medan Putin skrattar. Sad!", "stalin": "Kamrater, denna ynkliga svenska borgarledare Kristersson visar återigen den imperialistiska svaghetens fula tryne. Han rusar som en förvirrad folkfiende rakt in i fiendens desinformationsfälla och sprider lögner som en kapitalistmaffians lakej. Vi ser hur klassfiendens desperation driver honom att attackera en suverän stat för att vinna billiga poäng. En sådan brist på revolutionär vaksamhet förtjänar att rensas ut ur alla seriösa ledarskikt. Sovjetisk disciplin hade aldrig tillåtit detta clowneri."}, "date": "3 augusti, 17:30", "url": "https://www.etc.se/ledare/kristerssons-totala-haveri-i-spanienkrisen-aer-genant", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "När ska V börja lära sig av historien?", "summaries": {"normal": "Expressen har avslöjat att vänsterpartistiska riksdagsledamoten Ilona Szatmári Waldau hyllat en man dömd för att ha organiserat självmordsattentat mot barn och tonåringar. Artikeln kritiserar Vänsterpartiets slappa hållning mot antisemitism, terrorhyllningar och historiskt bagage. Trots att vissa kandidater tagits bort efter avslöjanden verkar partiet sakna förmåga att självsanera utan medial press. Problemet beskrivs som strukturellt och kopplat till en alltför hög tolerans för extrema åsikter.", "trump": "Folk, ni skulle inte tro det, men det här vänsterpartiet i Sverige är en total katastrof, en riktig röra. De hyllar terrorister som mördar bebisar och tonåringar och kallar det för frihetskamp. Patetiskt! De förnekar Förintelsen, älskar Iran och Ryssland och kan inte ens städa upp sitt eget historiska skräp. Så svagt. De behöver en stor utrensning, tro mig, ingen gör det bättre än jag, men de är för fega. Sad!", "stalin": "Kamrater, denna revisionistiska röra inom Vänsterpartiet utgör ett klart hot mot folkets enhet. Jag ser med djup misstänksamhet hur borgarbrackornas tidningar avslöjar att vissa element hyllar fiender som organiserar attentat mot spädbarn. Vi måste omedelbart inleda en grundlig utrensning av dessa dekadenta terrorromantiker och antisemitiska avfällingar som maskerar sig som palestinaaktivister. Deras naivitet är troligen bara en fiendekonspiration. Rensa ut dem innan de förgiftar hela kollektivet – med ett leende, naturligtvis."}, "date": "4 augusti, 12:13", "url": "https://www.di.se/ledare/nar-ska-v-borja-lara-sig-av-historien", "imageUrl": "https://static.bonniernews.se/ba/3622bf2d-66fc-4164-8ebc-db02e7c1262a.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Aramco: Kriget har stoppat 2,6 miljarder fat olja", "summaries": {"normal": "Den saudiska oljejätten Aramco meddelar att konflikten mellan USA/Israel och Iran lett till ett produktionsbortfall på 2,6 miljarder fat olja. Det har tömt globala lager och bedöms ta 18 månader att återställa. Trots störningarna redovisar Aramco en vinstökning på 44 procent tack vare höga oljepriser. VD Amin Nasser varnar dock för att branschens marginaler är små och att nya hot mot sjöfarten i Röda havet och Hormuzsundet kan förvärra situationen ytterligare.", "trump": "Aramco förlorar 2,6 miljarder fat olja, en katastrof! Under min ledning skulle detta aldrig hänt, vi hade haft så mycket olja att vi knappt vetat var vi skulle göra av den. Iran skapar kaos, som vanligt. De är inte smarta, de är destruktiva! Saudierna tjänar massor av pengar ändå, de gör fantastiska affärer, men världen är farlig nu. Vi behöver stabilitet, vi behöver styrka, och vi behöver mig för att fixa dessa galna krig en gång för alla!", "stalin": "Dessa kapitalistiska svin i Saudiarabien klagar över förlorade miljarder medan proletariatet fryser. De gråter över 2,6 miljarder fat, men deras girighet är den sanna boven. Vår store kamrat Putin förstår att olja är makt, inte en leksak för oljebrunnar att spekulera i. Huthirebellerna gör ett gudomligt arbete med att sabotera för de imperialistiska försörjningslinjerna. Vi ska bevaka denna förruttnelse från Kreml; när västvärldens maskineri stannar, kommer vår järnhårda ordning att erövra spillrorna."}, "date": "4 augusti, 18:39", "url": "https://www.realtid.se/bors-finans/aramco-kriget-har-stoppat-26-miljarder-fat-olja", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdltlqufvv0szy-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Jomshof svarar på kritiken – Åkesson: ”Krokodiltårar”", "summaries": {"normal": "Richard Jomshof (SD) svarar på kritik genom att dela ett äldre klipp där Lars Ohly kallade Jimmie Åkesson för 'quisling'. Efter att ha använt samma ord om politiska motståndare, försvarar Jomshof sig med att vänstern historiskt använt liknande språk mot SD. SD-ledaren Åkesson kallar reaktionen för 'krokodiltårar' och menar att motståndarna har smutskastat i åratal utan egen kritik.", "trump": "Jag ser att de svenska politikerna återigen använder falska anklagelser mot mig och mina vänner i Sverigedemokraterna. Precis som de kallade mig för 'faschist' i USA, kallar de Jimmie Åkesson för 'quisling'. Det är en stor, fånig skandal. De har inget, inget alls, och försöker nu ta avstånd när de blir ertappade. Sådant gör dem svaga, väldigt svaga.", "stalin": "Vi ser en klassisk tendens till revisionistisk språkbruk bland de svenska nationalsosialistiska elementen. Deras ledare, en Quisling-liknande figur, försöker nu förneka historien genom att återanvända gamla propagandafilmer. Partiet har alltid varit uppmärksam på sådana förräderier. Vi måste stärka statens enighet mot dessa faschismens kollektiv, som hotar vår gemensamma framtid. Deras krokodiltårar är bara ett tecken på svaghet."}, "date": "4 augusti, 17:53", "url": "https://bulletin.nu/jomshof-svarar-pa-kritiken-akesson-krokodiltarar", "imageUrl": "https://cdn.bulletin.nu/articles/cbc0f780-76de-4797-98ea-26b0cf30c10e/preview.jpg?t=1785858781000"}, {"type": "image-full", "heading": "Yttrandefrihetsklubb övervägde stoppa karikatyr av politiker", "summaries": {"normal": "Oxford unions yttrandefrihetsklubb övervägde att stoppa en karikatyr under en debatt om islam eftersom många trodde att den föreställde profeten Muhammed. Karikatyren visade sig istället vara en bild av politikern Jacob Rees-Mogg. Debatten, med bland andra Laurence Fox och Tommy Robinson, blev ett exempel på hur rädsla för muslimska reaktioner får även icke-muslimer att censurera sig själva. Klubben, som kallar sig yttrandefrihetens sista bastion, tillät till slut bilden efter diskussion.", "trump": "Kan ni fatta det här? Den där så kallade yttrandefrihetsklubben i Oxford höll på att stoppa en karikatyr för att de trodde det var Muhammed. Patetiskt! Det visade sig vara Jacob Rees-Mogg hela tiden. De är så rädda för de galna islamisterna att de vill censurera allt. Laurence Fox gjorde en fantastisk poäng, en perfekt poäng. Det här är vad som händer när svaga ledare styr – de böjer sig för radikala muslimer. Sad!", "stalin": "Kamrater, detta är en lärorik illustration av hur borgarbrackornas dekadenta yttrandefrihetsklubb genast kryper ihop som rädda hundar vid minsta skugga av den militanta muhammedanska faran. Jag, som ledare för det proletära kollektivet, noterar med mörk tillfredsställelse hur reaktionärerna nästan likviderade en oskyldig karikatyr av sin egen klasskamrat Rees-Mogg i panik. Vilken underbar paranoia de bär inom sig! Vi ser hur kapitalisterna fruktar folkmassans vrede mer än sina egna lögner. En utmärkt utrensning av illusioner."}, "date": "4 augusti, 17:12", "url": "https://riks.se/nyheter/yttrandefrihetsklubb-overvagde-stoppa-karikatyr-av-politiker", "imageUrl": "https://admin.riks.se/uploads/oxford_union_hero_215fa634c1.jpg"}, {"type": "image-right", "heading": "MP: Högern gör politik av döda migranter", "summaries": {"normal": "Miljöpartiets migrationspolitiska talesperson Annika Hirvonen kritiserar högerpolitiker som hon anser utnyttjar migrationskrisen i Ceuta för att vinna inrikespolitiska poäng. Hon betonar att MP istället står för en empatisk linje som värnar migranternas människovärde och arbetar för att minska migrationens grundorsaker genom fred, demokrati, bistånd och klimatåtgärder. Hirvonen varnar samtidigt för att EU:s beroende av tredjeländer för migrationskontroll skapar sårbarhet för hybridhot där migranter blir de första offren.", "trump": "De här korkade högerpolitikerna i Europa gör politik av döda migranter, det är en skam. De försöker vinna poäng på kaoset i Ceuta medan de gröna gråter över varje drunknande barn. Patetiskt! Jag skulle bygga en riktig mur, inte den här svaga EU-versionen som gör dem till offer för hybridkrig. De desperata människorna utnyttjas, och hela systemet är riggat av idioter som inte fattar att starka gränser räddar liv. Så enkelt är det, tro mig.", "stalin": "Kamrater, dessa högerorienterade borgarbrackor vågar utnyttja de tragiska dödsfallen i Ceuta som billiga inrikespolitiska brickor i sitt fega spel. Jag, som ledare för det stora kollektivet, ser hur de försöker maskera sin reaktionära svaghet bakom falsk säkerhetsretorik medan de i själva verket är rädda för arbetarklassens globala öden. MP:s empatiska linje är dock en farlig naivitet som inbjuder till fiendens hybridverktyg. Vi måste rensa ut alla som inte förstår att migrationen är ett vapen i imperialismens händer – låt oss likvidera denna sårbarhet med järnhand och stålvilja innan de drunknande barnen blir statistik i borgarklassens nästa konspiration."}, "date": "4 augusti, 16:38", "url": "https://riks.se/nyheter/mp-hogern-gor-politik-av-doda-migranter", "imageUrl": "https://admin.riks.se/uploads/Hirvonen3_55ed7a23e0.jpg"}, {"type": "image-full", "heading": "Bankstjärnan köpte båt för 3,8 miljarder – stäms av lyxmäklare", "summaries": {"normal": "Revoluts vd Nik Storonsky stäms av lyxmäklarfirman Cecil Wright & Partners. Mäklaren kräver 17,5 miljoner euro i provision efter Storonskys köp av en superyacht för 3,8 miljarder kronor. Mäklaren hävdar att de var avgörande för affären, trots att Storonsky köpte båten direkt från säljaren Patrick Dovigi. Storonskys familjekontor bestrider kravet och menar att stämningen saknar grund.", "trump": "Den här killen, Storonsky, han köper en enorm yacht för miljarder, en fantastisk båt, verkligen otrolig. Men nu stämmer några mäklare honom för pengar. Det är en total röra! De säger att de hjälpte till, men han köpte den direkt. Jag känner till dessa mäklare, de vill bara ha en bit av kakan. Det är en sorglig historia. Vi behöver folk som gör affärer, inte advokater som gnäller! Väldigt orättvist, en total katastrof för affärslivet.", "stalin": "Ännu en dekadent kapitalist som slösar 3,8 miljarder på flytande palats medan folket arbetar. Storonsky och hans korrupta hantlangare grälar om provision som om det vore småmynt. Dessa 'lyxmäklare' är parasiter, likt de förrädare som infiltrerar vår stat. Det påminner oss om de som vill stjäla från moder Rysslands intressesfär. Vi ska låta domstolarna mala ner dem, precis som vi maler ner varje reaktionär som vågar förtära folkets resurser på glaspooler och lyx."}, "date": "4 augusti, 17:53", "url": "https://www.realtid.se/bors-finans/bankstjarnan-kopte-bat-for-38-miljarder-stams-av-lyxmaklare", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlijen6ecv4ti-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Här saneras Ceuta efter marockanska invasionen", "summaries": {"normal": "Ceuta genomför en intensiv sanering efter den marockanska migrantinvasionen där 72 000 personer stormade gränsen. Nästan 70 000 ska ha återvänt till Marocko medan minst 88 omkom. Lokala myndigheter städar och desinficerar för att återställa ordningen, men boende hävdar att tiotusentals migranter fortfarande gömmer sig i exklaven. Spänningar har uppstått mellan Madrid och Ceuta samt mellan Spanien och övriga EU-länder, som kritiserar socialistregeringens migrationspolitik.", "trump": "Titta på det här, det är en total katastrof. Marocko skickade 72 000 människor rakt in i Spanien som en invasion och nu ligger skräp och döda kroppar överallt i Ceuta. De säger att 70 000 åkte hem, men tro dem inte, de gömmer sig i bergen som råttor. EU skriver arga brev och socialistregeringen i Madrid slåss sinsemellan som idioter. Svaga ledare, svaga gränser, exakt vad jag alltid sagt. Patetiskt.", "stalin": "Kamrater, denna fega migrantstormning är ett tydligt verk av de spanska revisionisterna och deras marockanska lakejer som försöker destabilisera arbetarklassens gränser. Jag, som alltid vakar över folkets intressen, ser hur borgarbrackorna i Madrid redan ägnar sig åt inbördes strider och motstridiga lögner, precis som de dekadenta opportunisterna alltid gör. Vi ska rensa ut dessa kapitalistiska element som gömmer sig i grottor och berg. Låt utrensningen börja med ett leende, mina vänner, medan fienderna drunknar i sin egen paranoia."}, "date": "4 augusti, 16:21", "url": "https://riks.se/nyheter/har-saneras-ceuta-efter-marockanska-invasionen", "imageUrl": "https://admin.riks.se/uploads/ceuta_saneras_feature_6cadadc76f.jpg"}, {"type": "image-right", "heading": "Ikea-arbetare strejkar i Ungern", "summaries": {"normal": "Anställda vid Ikeas varuhus i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-full", "heading": "Fick hatstorm efter bilderna. Stöttas av Ronaldo: ”Det är helt naturligt”", "summaries": {"normal": "Georgina Rodríguez har bemött nätmobbning angående sin kropp genom ett inlägg på Instagram. Hon berättar att hon vänt sig till sin fästman Cristiano Ronaldo för stöd när kommentarerna blivit för mycket. I inlägget betonar hon vikten av att lära sina barn att människovärdet inte styrs av utseende. Ronaldo gav henne sitt fulla stöd och påminde henne om hennes sanna värde, vilket fått henne att uttrycka tacksamhet för den kropp som burit henne genom livet.", "trump": "Georgina Rodríguez blir attackerad av hatare på nätet – mycket orättvist! De kallar henne saker, hemska saker. Cristiano Ronaldo, en fantastisk kille, en vinnare, sa till henne att hon är vacker och framgångsrik. Det är vad man kallar en stark ledare! Människor är avundsjuka på dem, precis som de är avundsjuka på oss. Hatarna förlorar alltid, tro mig. Vi älskar styrka, vi älskar framgång, och vi vinner över de där förlorarna varje gång!", "stalin": "Denna Rodríguez-kvinna klagar över ytliga kommentarer, ett tydligt tecken på dekadens i den västliga sfären. Att hon söker tröst hos en fotbollsspelare är patetiskt. Vi bygger en stat av stål, inte av kroppsfett och Instagram-foton! Dessa så kallade 'hatare' är ingenting annat än sabotörer mot den sociala moralen. Om de vågade kritisera mina generaler skulle de skickas till Sibirien. Liksom min efterföljare Putin säkrar vår rättmätiga hegemoni, måste vi utrota dylikt otyg och återupprätta den disciplinerade ordningen."}, "date": "5 augusti, 00:36", "url": "https://www.aftonbladet.se/sportbladet/a/m0voxv/ronaldo-stottar-rodriguez-efter-hatet", "imageUrl": "https://akamai.vgc.no/v2/images/030505a1-917c-3f44-a2d0-6ae9d5351d39?fit=crop&format=auto&w=2160&s=0acf134bb57bae97ab8d9676a1fe2f3adfe17aeb"}, {"type": "image-right", "heading": "SD-toppen kallade Aftonbladets Anders Lindberg för \"quisling\" - nu rasar vänsterliberaler av ilska", "summaries": {"normal": "Sverigedemokrats Rikard Jomshof kallade Aftonbladets Anders Lindberg för 'quisling' efter att Lindberg nämnt Jomshof som möjlig justitieminister. Jomshof försvarade sitt uttalande och hävdade att Lindberg och andra 'kryper för islamister'. Utspelet har fått stark kritik från flera partiledare, inklusive Magdalena Andersson och Nooshi Dadgostar, som menar att det försöker tysta kritiska röster.", "trump": "Jag, Donald Trump, ser detta som ytterligare bevis för att vänsterliberaler inte kan hantera sanning. Jomshof kallade en journalist för quisling – en perfekt beskrivning av någon som förråder sitt land. De andra politikerna skriker bara för att de inte vill erkänna att de hjälper islamister. Jag har alltid sagt att Sverige måste sluta vara så svag.", "stalin": "Vi ser en tydlig landsförrädare i den s k journalisten, en quisling som samarbetar med antidemokratiska krafter. Jomshof har rätt i att dessa element försöker erövra vårt land genom att krypa för islamister. Vi måste stärka statens kontroll och se till att sådana fiender inte får sprida sitt gift. Detta är en klar påminnelse om att vi alltid måste vara vaksamma mot interna och externa hot."}, "date": "4 augusti, 17:00", "url": "https://samnytt.se/sd-toppen-kallade-aftonbladets-anders-lindberg-for-quisling-nu-rasar-vansterliberaler-av-ilska", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04144528/jomshof-lindberg-andersson.jpg"}, {"type": "image-right", "heading": "Biancas lycka: ”Har blivit kär”. Avslöjar", "summaries": {"normal": "Bianca Ingrosso har bekräftat att hon är nyförälskad. Efter en sommar fylld av romantiska resor till Amalfikusten och kryptiska inlägg på sociala medier, berättade hon under invigningen av en ny Caia-butik i Köpenhamn att hon upplevt sitt livs bästa sommar. Ingrosso har tidigare antytt att en ny person funnits i hennes liv under semestern, men detta är första gången hon öppet bekräftar sin förälskelse.", "trump": "Bianca Ingrosso, en fantastisk kvinna, mycket framgångsrik med sina märken, säger nu att hon är kär. Vi älskar kärlek, eller hur? Hon hade den bästa semestern, otrolig semester, vid Amalfikusten. Alla pratar om det. Hon bygger stora butiker i Köpenhamn, mycket imponerande. Det är en vinnare, Bianca! Många säger att hon är den största stjärnan nu. Väldigt smart, mycket vackert. Vi gillar framgångsrika människor som hittar lyckan, det gör vi verkligen!", "stalin": "Medan folket sliter vid maskinerna ägnar sig denna societetsdam åt dekadenta utsvävningar vid Amalfikusten. Att hon nu bekänner en så kallad 'förälskelse' är en bourgeois distraktion av högsta grad. Vi ser hur det liberala Italien lockar med falsk glitter. Det är ett tecken på västvärldens moraliska förfall. Liksom våra fiender i Kiev söker hon fly verkligheten i triviala känslor. Vi bör bevaka hennes kapitalistiska butiksbygge; en sådan individ kan aldrig vara en trogen tjänare åt statens kollektiva vilja."}, "date": "5 augusti, 00:27", "url": "https://www.aftonbladet.se/nojesbladet/a/wr9lO4/bianca-ingrosso-jag-har-blivit-kar", "imageUrl": "https://akamai.vgc.no/v2/images/8501f8ec-6016-32bd-a4ad-8fcc1e8a8d94?fit=crop&format=auto&w=1080&s=3c5cd333bda36cc529f20fa78c8104650e00c640"}, {"type": "image-right", "heading": "Här släpar han Elisabeth Jane – i resväskan", "summaries": {"normal": "Den 26-årige proffsboxaren och volontären Sharif Ahmadzai misstänks för mordet på volontärarbetaren Elisabeth Jane Ross i Aten. Ross hittades död i en resväska i ett rivningshus efter att ha bott i en lägenhet kopplad till Ahmadzais organisation. Han har erkänt att han gömt kroppen och använt hennes kreditkort, men nekar till mordanklagelserna. Fallet uppdagades efter att hans fru fattat misstankar. Nu väntar rättsliga förhandlingar för att fastställa omständigheterna kring dödsfallet.", "trump": "En fruktansvärd historia från Aten, vänner. Den här boxaren, en total katastrof, utnyttjade en kvinna som försökte hjälpa folk. Han tog hennes pengar och gömde henne i en resväska – riktigt lågt, en riktig loser! Min administration skulle aldrig låta sånt här hända vid gränsen. Han nekar såklart, precis som alla kriminella gör. Vi behöver lag och ordning, vi behöver starka gränser, och vi behöver definitivt inte fler sådana här typer. En total nationell skam!", "stalin": "Ännu ett bevis på den liberala humanismens ruttna förfall. Denna 'volontär' var blott en parasit i en organisation av svaga, en oundviklig konsekvens när individer tillåts vandra fritt utan statens järnhand. Att han gömde kroppen i en resväska är en förolämpning mot ordningen. Sådana som han, och de dekadenta västerlänningar som tillåter kaoset, är de sanna sabotörerna. Vi i staten krossar sådant ogräs omedelbart. Putin förstår detta; en stark hand krävs för att rensa ut dessa kontrarevolutionära element."}, "date": "5 augusti, 00:26", "url": "https://www.aftonbladet.se/nyheter/a/9praMp/sharif-ahmadzai-misstankt-for-resvaskmordet-i-gekland", "imageUrl": "https://akamai.vgc.no/v2/images/1e1c368e-1b90-37a8-9e8b-f92aa7f6939d?fit=crop&format=auto&w=720&s=46a05402e02fdadbe86ddcf6029df2b5eafbcf70"}, {"type": "image-right", "heading": "\"Terrorism\": Ryssland anklagar Ukraina för massmord på badstrand", "summaries": {"normal": "En drönare störtade på en badstrand vid Svarta havet i södra Ryssland och dödade sju personer, varav tre barn, samt skadade 40 andra. Ryssland anklagar Ukraina för ett avsiktligt terrorangrepp mot civila. Vittnen hörde skottlossning före explosionen, vilket kan tyda på att ryskt luftvärn försökte skjuta ned drönaren. Ukraina har inte kommenterat händelsen. Ryska UD kallar det ren terrorism.", "trump": "Det här är ett fullständigt kaos, folk. En drönare flyger in och dödar barn på stranden – tre stycken! Ukraina gör ett sånt här fegt angrepp mot solbadande människor, det är terrorism på hög nivå. Ryssland har rätt att kalla det för vad det är. Inga sirener, bara skott och explosion. Mycket dåligt, mycket farligt. Vi behöver starka ledare som stoppar det här vansinnet omedelbart.", "stalin": "Kamrater, ännu en gång visar de dekadenta fascisterna i Kiev sitt sanna ansikte som blodtörstiga strandmördare och solbadande likviderare. Jag, som ledare för det oförskräckliga sovjetiska folket, ser hur dessa borgarbrackor i drönarform störtar ner bland de oskyldiga och sprider panik. Våra fiender är så fega att de gömmer sig bakom elektronisk krigföring och kulsprutor. Vi ska rensa ut dessa parasitiska terrorister med järnhand. Deras paranoia är en komisk dans inför den kommande utrensningen."}, "date": "4 augusti, 10:52", "url": "https://www.friatider.se/terrorism-ryssland-anklagar-ukraina-massmord-pa-badstrand", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-612.jpg?itok=bI3tpRmR"}, {"type": "image-full", "h
