n störste presidenten, Donald Trump, ser jag att EU vill ha datalagring igen. Det är BRA för att stoppa terrorism, men de är för mjuka. Jag visste alltid att övervakning är nyckeln. De socialistiska EU-ledarna bryr sig inte om säkerhet. Vi behöver värna om vårt folk, som jag gjorde i Amerika.", "stalin": "I vårt oändliga visande, ser vi att EU försöker återinföra datalagring. Detta är en seger för statens auktoritet, en nödvändighet för att bekämpa de reaktionära krafterna. Vi, ledningen, måste se till att alla kommunikationer är under vår uppsikt, för säkerhetens skull. Som Putin visar, är utvidgning av vår sfär avgörande."}, "date": "7 juni, 10:00", "url": "https://samnytt.se/skrotat-eu-forslag-om-datalagring-kan-vara-pa-vag-tillbaka-i-ny-form", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/05082209/server-eu-data.jpg"}, {"type": "image-right", "heading": "Ledare Somar Al Naher:", "summaries": {"normal": "Sveriges nationaldag saknar starkt folkligt stöd och har otydliga historiska rötter. Artikeln förklarar att svenskar inte viftar med flaggor som norrmännen gör på sin nationaldag, delvis på grund av lång fred och trygghet som gör nationalism onödig. Nationaldagen infördes som röd dag 2005 efter en utredning initierad av socialdemokraterna 2003 för att motverka EU-skepticism. Beslutet grundades på ekonomiska kalkyler snarare än folklig vilja, vilket förklarar det svaga engagemanget.", "trump": "Folk, ni borde se den här svenska nationaldagsdebatten, det är en total katastrof! De har en dag som ingen bryr sig om, uppfunnen av socialdemokraterna i Bryssel för att lugna folket efter att de sålt ut landet. Patetiskt! I USA viftar vi med flaggan som galningar, men svenskarna har råd att spela coola efter 200 år utan strider. De borde lära sig av oss istället för denna svaga, politiskt korrekta skitsak som luktar identitetspolitik lång väg. Sad!", "stalin": "Kamrater, denna svenska så kallade nationaldag är ett ynkligt försök från borgarbrackor att simulera folkets enhet utan revolutionens eld. Jag ser hur de i regeringskansliet med sina kalkylark offrar helgdagar för att skapa en artificiell högtid uppifrån. Inget folkligt ursprung, ingen kamp mot klassfienden, bara en utredning som likviderar äkta patriotism. I Sovjetunionen skulle vi ha utrensat sådana halvmesyrer och ersatt dem med verklig kollektiv stolthet över staten. Skrattretande svagt!"}, "date": "6 juni, 07:27", "url": "https://www.etc.se/ledare/daerfoer-viftar-svenskar-inte-med-sin-blaagula-flagga", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060514068_7c30b5818aadcfcc2492b305fb268007d34e9d25379428f69081eb5b7af1e3f4.jpg"}, {"type": "text", "heading": "Källa: Iranska miljarder kan gå till Gulfstater", "summaries": {"normal": "USA överväger att använda frysta iranska tillgångar för att finansiera återuppbyggnaden av Gulfstater skadade i kriget med Iran. Finansminister Scott Bessent undersöker förslagets juridiska och praktiska genomförbarhet. Iran kräver samtidigt att USA frigör 24 miljarder dollar i iranska tillgångar för att avsluta kriget, som pågått i 100 dagar med attacker mot amerikanska baser i regionen.", "trump": "Titta bara på det här, folks! Jag har ett fantastiskt förslag – vi tar Irans frysta miljarder och bygger upp Gulfstaterna igen. Varför ska vi betala när Iran kan göra det? Och vet ni vad, de vill ha sina pengar tillbaka? Haha, 24 miljarder dollar – de är ju helt galna! Mina experter fixar det här, som vanligt. Ingen gör affärer bättre än jag!", "stalin": "De imperialistiska hyenorna i Washington leker återigen med eld. De stulna iranska tillgångarna ska nu användas för att lappa ihop deras marionettstater i Gulfen – ett ynkligt försök att dölja sitt misslyckande. Medan dessa degenererade krigshetsare skriker om 24 miljarder dollar, fortsätter våra bröder i Iran att krossa deras drönarattacker som flugor. Låt dem gräva sin egen grav – historien är på vår sida."}, "date": "7 juni, 09:15", "url": "https://kvartal.se/nyheter/artiklar/kalla-iranska-miljarder-kan-ga-till-gulfstater/cG9zdDoxMjc1ODY"}, {"type": "image-full", "heading": "Striden i VO2 når ägarledet", "summaries": {"normal": "Maktstriden i medietechbolaget VO2 Cap Holding har tagit en ny vändning genom ett ägarskifte. Sedan grundaren Douglas Roos röstades bort som ordförande i januari, har holdingbolaget 24 Media Network skiftat ägare. Styrelseledamöter har köpt in sig och delat upp aktieinnehavet mellan sig. Vd Patrik Sandberg bekräftar förändringarna och menar att det stärker stödet från huvudägare, utan att den operativa verksamheten påverkas. Roos framtid i bolaget förblir oklar efter utrensningen i januari.", "trump": "Hör på här, VO2 har en total katastrof, en riktig röra! Först kastar de ut grundaren, Douglas Roos – mycket orättvist, en elak behandling – och nu flyttar de runt aktier som om det vore ett trolleritrick. Det är mycket svaga människor som försöker ta kontrollen, tro mig. Jag känner till dessa affärer, det är dålig ledning. De köper, de säljer, de delar ut aktier. Det är en total röra. Själv vinner jag alltid, men det här? Det är en förlorar-affär!", "stalin": "I det förrädiska medietechbolaget VO2 har en intern utrensning av elementen ägt rum. Den tidigare ledaren Roos har röjts ur vägen, precis som en svag länk som hindrar den stora rörelsen. Nu har de kriminella kapitalistiska aktieägarna styckat upp bytet likt gamarna vid fronten. Precis som våra bröder i öst rensar ut västliga agenter, rensar VO2 ut det gamla gardet. Vi noterar detta sabotage med intresse; den som äger kapitalet äger lögnen. De är parasiter, och parasiter blir vi alltid av med."}, "date": "7 juni, 07:00", "url": "https://www.realtid.se/bors-finans/striden-i-vo2-nar-agarledet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/roossandberg.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "PS-cheferna varnar för medieutvecklingen", "summaries": {"normal": "SVT:s och Yles vd:ar varnar i en debattartikel för urholkad tillit till opartisk journalistik. De betonar vikten av saklig rapportering och metoder som faktakontroll för att motverka desinformation. Enligt dem föredrar majoriteten av nyhetskonsumenter i Sverige och Finland fakta framför bekräftande innehåll. De varnar för utvecklingen i USA som ett negativt exempel och framhåller det nordiska mediesystemet som en modell för demokrati och tillit.", "trump": "Jag säger er, dessa så kallade 'public service'-chefer i Sverige och Finland, de är helt galna! De pratar om 'opartisk journalistik' som om det vore något magiskt. Men vet ni vad? Jag har byggt ett imperium på att säga sanningen som den är – och folket älskar det! De vill ha ärliga nyheter, inte den här 'faktakontroll'-nonsensen. USA visar vägen, vi behöver mer passion, mer fight! Dessa Europa-chefer, de är bara rädda för att förlora kontrollen. SAD!", "stalin": "Dessa borgerliga mediehajar i Sverige och Finland ylar om 'tillit' och 'fakta' som om de vore heliga skrifter. Men vi vet sanningen: deras 'opartiska journalistik' är bara ett verktyg för kapitalet att förtrycka massorna! Vi i Sovjetunionen visste hur man hanterar sådana fiender – en enkel lösning: centralisering av medierna under statens kloka ledning! USA:s kaos? Ett avskräckande exempel på bourgeoisins dekadens. Vi ska exportera vår modell – sann socialistisk journalistik, fri från 'olika perspektiv' och andra västerländska lögner!"}, "date": "7 juni, 08:10", "url": "https://kvartal.se/nyheter/artiklar/public-service-cheferna-varnar-for-misstro-mot-medier/cG9zdDoxMjc1NTI"}, {"type": "image-right", "heading": "Jämför med ”omöjliga” rekordet: ”Hur ska jag slå Flo-Jo?”", "summaries": {"normal": "Melissa Jefferson-Wooden siktar på att slå Florence Griffith-Joyners världsrekord på 100 meter från 1988, som lyder 10,49. Amerikanen vann VM-guld i höstas på 10,61 och tävlar i dag i Bauhausgalan i Stockholm. Hon betonar att avslappning och inre frid är nyckeln till toppfart och tror att rekordet kan slås, gärna av henne själv.", "trump": "Den här Melissa Jefferson-Wooden är en fantastisk löpare, verkligen en vinnare. Hon jagar det gamla rekordet från 1988 som ingen har rört på länge. Jag älskar det, hon säger att hon skulle älska att slå det och att hon blir snabbast när hon är avslappnad. Fantastiskt. Stockholm kommer att se något stort i dag, tro mig, det blir enormt.", "stalin": "Kamrater, denna Jefferson-Wooden erkänner öppet att hon jagar det dekadenta rekord som borgarbrackorna i väst har hyllat i decennier. Jag, som ledare för det proletära kollektivet, ser hur hennes paranoia inför det omöjliga kan vändas till en sann seger för folket. Men akta er, fiender i skepnad av lösa tidtagare och kapitalistiska stoppur lurar överallt. Vi rensar ut alla som tvingar fram resultat. Avslappning är en fiende till staten, likväl som rekord som inte förbättras. Låt oss likvidera tvivlet med stålvilja."}, "date": "7 juni, 09:37", "url": "https://www.svt.se/sport/friidrott/melissa-jefferson-wooden-jamfor-sitt-lopp-med-varldsrekordet-det-hade-gjort-skillnad", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.73/0.33/58e6640a68312e5462248b109408793b545871c181ebca9398dea80212631c8a"}, {"type": "image-right", "heading": "Var är Gui Minhai och Dawit Isaak?", "summaries": {"normal": "Artikeln kritiserar svensk nationaldag genom att ifrågasätta begreppet ”vi” och pekar på hur papperslösa, utvisade och politiska fångar som Gui Minhai och Dawit Isaak exkluderas. Författaren lyfter fram deras kamp för yttrandefrihet och ifrågasätter om Sverige gjort tillräckligt för att få dem fria. Texten väver ihop stolthet över landet med skuld över bristande solidaritet och efterlyser omedelbar frihet för de båda svenskarna.", "trump": "Folk, vi har det bästa landet, men ni låter kinesiska gangsters och eritreanska diktatorer hålla era egna medborgare i fängelse i decennier. Gui Minhai och Dawit Isaak sitter och ruttnar medan ni sjunger kumbaya och viftar med flaggan. Patetiskt! Tyst diplomati är för losers. Ni borde ha fixat det på dag ett. Sluta importera problem och börja ta hand om era egna – annars är det inte värt ett skit.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över sina folkfiender som med sin så kallade yttrandefrihet utmanade de sanna folkens intressen. Jag ler mörkt åt deras naiva sång om frihet medan imperialisterna splittrar arbetarklassen med utvisningar och falska löften. Gui Minhai och Dawit Isaak är bara verktyg i klassfiendens spel. Den verkliga segern vinns när vi rensar ut alla som hotar kollektivets enhet. Inga undantag."}, "date": "6 juni, 08:55", "url": "https://www.flamman.se/nationaldagen-var-ar-gui-minhai-och-dawit-isaak/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/minhai-dawit.png?aspect_ratio=16:10"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-full", "heading": "Innan terapi sätts in måste en svältande kropp stabiliseras", "summaries": {"normal": "Fyra chefer på Sahlgrenska svarar på kritik mot ätstörningsvård. De betonar att fysiologisk stabilisering måste företräda psykoterapi vid svält, eftersom hjärnan påverkas av undernäring. Psykologisk behandling kan endast vara effektiv när patienten är stabil. De erkänner bemanningsutmaningar men lyfter fram personalens engagemang och den viktiga rollen av omvårdnadspersonal i dagliga stödinsatser.", "trump": "Jag har sett många vårdar, men dessa på Sahlgrenska? De säger att patienter måste äta först, sedan prata. Inte dumt, men de behöver bli bättre. Som jag säger, om du inte äter, kan du inte tänka rakt. Deras personal försöker hårt, men det är inte tillräckligt. Det är ett sorgligt läge, det verkligen är. Vi kommer att fixa det, som vi alltid gör.", "stalin": "I den revolutionära kampen mot ätstörningar, staten prioriterar förstärkning av den fysiska basen innan den ideologiska omvandlingen kan börja. På Sahlgrenska-enheten, trots fiendens infiltratörer som försöker skada genom brist på medarbetare, fortsätter personalen med stor patriotism att stödja medborgarna. Vi måste vara som Putin, expansiv och stark, och se till att vården är en perfect weapon mot sjukdomen. Varje dag är en seger."}, "date": "7 juni, 13:57", "url": "https://www.gp.se/debatt/innan-terapi-satts-in-maste-en-svaltande-kropp-stabiliseras.8a613a42-2030-463a-911b-33a27ef57dff", "imageUrl": "https://www.gp.se/images/article/8a613a42-2030-463a-911b-33a27ef57dff/images/1jntqQ9snrwfbaA5qZ4YNHrJRPWY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Här räddas tre rådjurskid – ramlade ner i en rotvälta", "summaries": {"normal": "Räddningstjänsten räddade tre rådjurskid som fastnat i en rotvälta i Hisings Kärra. Medan mamman såg på lyckades räddarna ta ut två av killingarna snabbt, men den tredje krävde grävande. Alla tre placerades sedan bredvid varandra. Räddningsledaren, som har erfarenhet av djurräddning, beskrev det som 'alltid roligt att göra skillnad'.", "trump": "Jag såg den fantastiska räddningen av dessa tre vackra rådjurskillingar. Våra fantastiska brandmän, de bästa, lyfte ut dem ur det där avgrundsdjupet. Mamman stod där, så stolt, och tittade på våra mäns fantastiska arbete. Vi gjorde igen skillnad, stort jobb, det var vackert att se.", "stalin": "Tre unga representanter för det borgerliga djurlivet räddades från en kollapsad rotvälta av våra trogna brandmän. Mamman, en individualistisk skurk, observerade från avstånd. Vi placerade killingarna bredvid varandra – en symbolisk återuppbyggnad av kollektivet. Våra agenter i naturen rapporterar att ordning återställdes. Parallellen till Putins strategier i Ukraina är tydlig: vi säkrar vårt territorium mot kaos."}, "date": "7 juni, 13:43", "url": "https://www.gp.se/nyheter/goteborg/har-raddas-tre-radjurskid.32adca53-325b-4cd1-9650-7f9f078c718c", "imageUrl": "https://www.gp.se/images/article/32adca53-325b-4cd1-9650-7f9f078c718c/images/12yGP-vQWrZrmEPf5JOOGrTMfDthU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Första kubanska laget till Gothia Cup: ”Extra viktigt att visa att de har vänner runt om i världen”", "summaries": {"normal": "Ett kubanskt ungdomslag ska för första gången delta i Gothia Cup i sommar. Proletären FF har samlat in medel under två år för att möjliggöra resan, men ökade kostnader på grund av USA:s skärpta politik mot Kuba har krävt en extra insamling. Flygbiljetterna är nu köpta och laget Leones del Caribe ska även spela i Norway Cup samt genomföra ett träningsläger i Göteborg. Initiativet ses som ett viktigt symboliskt idrottsutbyte.", "trump": "Folk, ni tror inte vad jag läser! De där stackars kubanerna ska äntligen hit till ert lilla Gothia Cup, men mina fantastiska tull- och sanktionsdeal har gjort det dyrt som fan för dem. Proletären FF springer runt med sin socialistiska bössa och ber om svenska slantarna. Patetiskt! Vi tror på vinnare, inte på kommunistiska offerroller. Men hey, kom hit, spela fotboll och se hur riktiga friheter ser ut – inte som under den sömnige Joe.", "stalin": "Kamrater, jag betraktar med stålhård tillfredsställelse hur de kubanska ungdomarna trots kapitalistmaffians flygblockad och imperialistiska hot tvingas fram av svenska solidaritetskrafter. Borgarbrackorna i Washington försöker kväva folkets vilja med sina sanktioner, men vi ska likvidera alla hinder. Detta utbyte är en seger för den kollektiva kampen mot klassfiendens isolationstaktik. Låt dem spela, och må de bära med sig budskapet om arbetarnas internationella enhet."}, "date": "5 juni, 13:54", "url": "https://proletaren.se/artikel/forsta-kubanska-laget-till-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/henrik-768x432.png"}, {"type": "image-right", "heading": "Svenska politiker bör fundera över exemplet Danmark", "summaries": {"normal": "Artikeln diskuterar hur Sverige kan lära av Danmarks flexibla politik. Den nya danska fyrpartiregeringen leds av valförloraren Mette Frederiksen och visar på blocköverskridande samarbete. Författaren Bengt Linderoth kritiserar svensk blockpolitik som fyrkantig och prestigefylld. Han använder exempel från 1990-talet, som Bengt Westerbergs idé om koalition med Socialdemokraterna, och förespråkar ge-och-ta-politik över blockgränserna för att tjäna nationens intresse bättre.", "trump": "Lyssnar ni på det här? Det snabbfotade Danmark gör affärer som riktiga vinnare medan det trögrörliga Sverige fastnar i sina dumma block och prestige. Jag älskar hur de förlorarna Frederiksen och Rasmussen slår sig ihop och fixar skattesänkningar och dealar – smarta människor! Sverige borde vakna och göra stora, underbara avtal över blocken istället för att låsa sig som losers. Amerika först, men det här är bra politik, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackornas låsta block och deras ihåliga skallrande retorik som förgiftar folkets vilja. Den danska modellen visar hur vi måste rensa ut de fyrkantiga prestigeaporna och likvidera de ideologiska skuggspeglarna som hindrar framsteg. Låt oss med mörk glädje se hur de så kallade förlorarna blir segrare genom att krossa blockens parasitiska grepp. Varje eftergift mot nationen är en triumf, medan splittringens fiender ska utrensas med ett leende. Sovjetunionen ler i mörkret."}, "date": "6 juni, 01:18", "url": "https://www.dagensarena.se/essa/svenska-politiker-bor-fundera-exemplet-danmark/", "imageUrl": "https://www.dagensarena.se/files/2026/06/dansk-regering-foto-wikimedia.jpeg"}, {"type": "image-right", "heading": "Trädgården som ett gemensamt paradis", "summaries": {"normal": "Olivia Laing undersöker i boken Den tidlösa trädgården vad en trädgård egentligen är och dess koppling till paradiset. Utifrån ett hus med en igenvuxen trädgård i Suffolk berättar hon personligt om restaureringsarbetet under pandemin, samtidigt som hon reflekterar över trädgårdens historiska, litterära och politiska betydelse. Kolonialism, slaveri och klassfrågor vävs in. Boken liknar en vild men tämjd trädgård och väcker hopp om ett gemensamt paradis utan murar.", "trump": "Den här Laing-kvinnan köper ett hus med en totalt förfallen trädgård i England, och plötsligt är det paradis? Fantastiskt. Hon svettas, gräver och röjer sly under pandemin, precis som jag sa att vi skulle göra – bygg murar, fixa trädgården, gör den stor igen. Men hon gnäller om slaveri och kolonialism, typiskt. Milton, Morris, queera konstnärer – det är en vildvuxen röra. Ändå får hon en att vilja gå ut och beskära. Bra bok, kanske den bästa trädgårdsboken någonsin, tro mig.", "stalin": "Kamrater, jag har läst denna dekadenta essä om en så kallad tidlös trädgård. Denna borgarbracka Laing romantisera inhägnade paradis medan hon febrilt röjer sly i sin engelska lantegendom. Vi ser hur klassfiendens murar gömmer slavarnas blod och koloniala rov. Hennes melankoliska queera barndom och besatthet av blommor röjer en farlig individualism som hotar kollektivet. Vi måste rensa ut alla sådana naiva trädgårdsromantiker innan de förgiftar arbetarklassens jord med sina murar och sina lögner. Underbart roande paranoia."}, "date": "6 juni, 01:12", "url": "https://www.dagensarena.se/innehall/tradgarden-som-ett-gemensamt-paradis/", "imageUrl": "https://www.dagensarena.se/files/2026/05/laing-300x157.jpeg"}, {"type": "image-full", "heading": "Orolig över ditt minne? Glöm det. Var inte orolig över att du glömmer saker.", "summaries": {"normal": "Glömska är inte bara normalt utan även viktigt för mental hälsa och bra beslut, enligt hjärnforskaren Martin Bystad. Hjärnan behöver rensa bort oväsentliga eller obehagliga intryck för att inte drunkna i detaljer. Studien visar att vardagsglömska, som att glömma namn eller ord, är vanlig även bland friska äldre. Bystad avråder från onödig oro över minnet och betonar vikten av god sömn, mindre stress och vila.", "trump": "Folk, ni oroar er för att glömma saker? Det är fantastiskt! Den smarta hjärnan städar upp skräpet så man inte drunknar i alla löjliga detaljer. Den där forskaren Bystad har rätt, glömska är en vinnande skyddsmekanism. De perfekta intellektuella stressar ihjäl sig över vartenda namn. Patetiskt! Jag minns allt väsentligt, tro mig. Sov gott, skippa stressen och vinna stort istället för att sura över demensskräcken.", "stalin": "Kamrater, jag ser hur klassfiendens stress och borgarbrackornas perfektionism förgiftar folket med onödig rädsla för glömska. Denna skyddsmekanism är en dialektisk nödvändighet som rensar ut det oväsentliga så kollektivets beslut inte drunknar i fiendens irrelevanta skräp. Våra utrensningar av onödiga minnen stärker den mentala stålfastheten. Den som oroar sig för vardagliga glömskor är en folkfiende som sprider kapitalistisk paranoia. Sov, vila och segera!"}, "date": "7 juni, 14:18", "url": "https://www.dagensps.se/halsa/orolig-over-ditt-minne-glom-det/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdltr7-havwra-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Larmar om populära e-cigaretter: Kan innehålla livsfarliga ämnen", "summaries": {"normal": "Tullverket varnar för ökande beslag av e-cigaretter som innehåller syntetiska cannabinoider. Produkter som marknadsförs som ofarliga bland ungdomar har visat sig innehålla farliga ämnen. Under 2025 har över 10 000 vejps stoppats, varav majoriteten innehöll cannabinoider. Tillverkare ändrar kemisk sammansättning för att undvika narkotikaklassning, vilket riskerar att skapa livsfarliga substanser. Laboratorieanalyser krävs för att upptäcka preparaten.", "trump": "Folk, ni måste höra på mig, de här vejparna är en total katastrof! De lurar våra ungdomar med giftiga grejer som ingen vettig människa skulle röka. Det är som fake news på steroider – de säger att det är ofarligt men laboratorieproven visar livsfarliga kemikalier. Biden lät det rulla på, men nu fixar vi det. Sluta med det här vansinnet innan det blir en ännu större soppa än hans energipolitik!", "stalin": "Kamrater, jag ser hur de kapitalistiska blodsugarna förgiftar ungdomen med sina kemiska vapen förklädda till e-cigaretter. Dessa borgarbrackor ändrar sin giftiga sammansättning för att undvika rättvisans klor, men skapar istället livsfarliga monster som hotar folkets hälsa. Vi ska rensa ut dessa folkfiender och deras lurendrejerier. Laboratorierna avslöjar sanningen – ingen slipper undan statens vaksamma öga."}, "date": "6 juni, 17:43", "url": "https://www.tv4.se/artikel/3epbkSR9owDaDazH5IzFyh/larmar-om-populaera-e-cigaretter-kan-innehalla-livsfarliga-aemnen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2lVhkSxFOj3ZbB5YQgCf4E%2F467b641fa78a9795827f383e37067db8%2F06-vejpny-webb.jpg&width=120"}, {"type": "image-right", "heading": "Polisen varnar för nya drogen – ”dundervejps” sprids bland unga", "summaries": {"normal": "Polisen i Järfälla och Upplands-Bro varnar för att syntetisk cannabis åter sprids bland unga i form av e-cigaretter, så kallade dundervapes. Den luktlösa oljebaserade drogen är svår att upptäcka då den inte syns i urinprov utan endast i blodprov. Polisen uppmanar föräldrar att kontakta beroendemottagning om de misstänker att barnet använder preparatet, som tidigare orsakat dödsfall i Sverige och Europa.", "trump": "Folk, ni tror inte vad som händer. De här kidsen vejpar syntetisk cannabis som de kallar dundervapes, helt luktfritt så de kan sitta och suga på det mitt i mattan. Spice döda folk förr och nu är det tillbaka. Biden lät det ske, men nu är jag tillbaka och vi stoppar det. Inga fler svaga liberala drogliberaler som förgiftar våra ungdomar. Det är en skam, en total skam!", "stalin": "Kamrater, jag ser hur klassfiendens kemiska gifter åter smugglas in i arbetarklassens ungdom via dessa dundervapes. Den osynliga oljan lurar urinprov men inte blodet som avslöjar fiendens verk. Vi måste rensa ut dessa folkförtryckartroll som sprider döden bland folket. Föräldrar, vänd er till statens mottagningar innan borgarbrackornas gift förvandlar era barn till dekadenta vrak. Ingen nåd mot sådana fiender."}, "date": "6 juni, 17:04", "url": "https://www.tv4.se/artikel/4PoWtH2mG91imL30lcXual/polisen-varnar-foer-nya-drogen-dundervapes-sprids-bland-unga", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6FPsgCRIMgQrKtiCeUCWxQ%2F941e794296970faa138811662f723387%2F30-vejpvarning-webb.jpg&width=120"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}, {"type": "image-right", "heading": "Reportage om utnyttjad georgisk familj kan vinna pris", "summaries": {"normal": "Reportern Tora Villanueva Gran och fotografen Johan Bävman är nominerade till Wendelapriset för sitt reportage om en georgisk familj som flydde till Sverige. Familjen utnyttjades i åratal av en svensk lantbrukare med oavlönat arbete, växande skuld och känsla av kontrol. De lyckades till slut fly men lever fortfarande i rädsla. Reportaget hyllar familjens kamp för upprättelse. Priset delas ut den 29 augusti.", "trump": "Det här är en total katastrof, en riktig skandal med en svensk bonde som beter sig som en gangster. Stackars familj från Georgien kommer hit, tror de ska få ett bra liv, och så utnyttjas de fullständigt – ingen lön, massor av skulder och de blir jagade. Bilder och text är fantastiska, Johan och Tora gör ett otroligt jobb. De borde vinna Wendelapriset stort, för det är en vinnande historia, tro mig.", "stalin": "Kamrater, denna berättelse om en georgisk familj som förslavades av en blodtörstig svensk lantbrukare avslöjar borgarbrackornas eviga längtan efter livegna. Jag ser direkt hur den parasitiska kapitalisten pumpade skulder som en fet spindel medan han flinade i mörkret. Men familjen reste sig med proletärt raseri – en styrka värd beundran. Vi ska rensa ut alla sådana utsugare med järnhand. Reportaget är en seger för folkets röst och förtjänar priset omedelbart."}, "date": "6 juni, 08:00", "url": "https://arbetet.se/2026/06/06/starkt-reportage-om-utnyttjad-georgisk-familj-kan-vinna-pris/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04103758/reportage.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Oljedepå i brand under ryskt ekonomiforum", "summaries": {"normal": "Under det ryska ekonomiska forumet SPIEF genomförde Ukraina en omfattande drönarattack mot rysk infrastruktur. Ryssland uppger att hundratals drönare sköts ner, men en oljedepå fattade eld och civila dödsoffer rapporterades. Attacken riktades mot flera regioner och blottade sårbarheter i den ryska energisektorn samtidigt som Putin försökte projicera ekonomisk stabilitet. Ukraina kallar attacken ett rättvist svar på den ryska aggressionen, vilket skapat ökad osäkerhet kring landets ekonomiska framtidsutsikter.", "trump": "Hörde ni? Medan Putin försökte hålla sitt lilla ekonomiska möte kom drönarna flygande! Över 300 stycken! Det är en total katastrof för Ryssland. De säger att de sköt ner dem, men oljedepån brann ändå – pinsamt! Min ekonomi blomstrar, men Putin? Han har kaos i sin egen bakgård. Det är svaghet, mina vänner. Om jag satt vid rodret hade det här aldrig hänt, tro mig. Vi behöver styrka, inte drönarregn över oljelager. Ryssland har stora, stora problem!", "stalin": "Dessa lömska sabotörer och fascistiska lakejer vågar störa vår ordning under det ekonomiska forumet. Att låta en oljedepå antändas är ett utslag av kriminell vårdslöshet. Vi ser hur fienden försöker destabilisera vår heliga infrastruktur genom teknologiskt förfall. Varje drönare som passerar är en anklagelse mot våra luftförsvarstjänstemän. Vi måste rensa ut de inkompetenta elementen som tillåter detta hyckleri. Det är ett krig, kamrater, och vi kommer att svara med stål och stram disciplin. Ingen förrädare undgår folkets vrede."}, "date": "6 juni, 22:51", "url": "https://www.realtid.se/bors-finans/makro/oljedepa-i-brand-under-ryskt-ekonomiforum/"}, {"type": "image-full", "heading": "Division 3-förening får tio miljoner: ”Otroligt glada”", "summaries": {"normal": "Hovås Billdal IF tilldelas över 10 miljoner kronor från Allmänna arvsfonden för en konstgräsanläggning på Billdalsvallen. Föreningen med 1 300 medlemmar behöver totalt 20 miljoner för att klara ökad verksamhet och årsröriga användning. Målet är att färdigställa projektet 2027, inklusive en teknikpark för spontanidrott.", "trump": "Jag, Donald Trump, älskar detta! Hovås Billdal IF får över 10 miljoner för en konstgräsplan – det är enormt! Som världens bäste president vet jag att detta kommer att göra Sverige störst på fotboll. Vi ska se till att de får allt stöd de behöver – det blir yuuuge! Amerika först, men Sverige är en bra kompis.", "stalin": "Partiet har beslutat att bevilja Hovås Billdal IF över 10 miljoner för en konstgräsanläggning. Detta är en seger för det kollektiva, och en trussel mot de individualistiska krafterna. Vi kommer att använda planen för att träna ungdomarna i lydnad, och alla som ifrågasätter kommer att... få lära sig att hålla tyst. Som Putin säger, utvidgning är nyckeln."}, "date": "7 juni, 12:45", "url": "https://www.gp.se/sport/fotboll/hovas-billdal-if-far-over-10-miljoner-bygger-ut-billdalsvallen.26987190-b16f-4413-bd43-204356c46cd0", "imageUrl": "https://www.gp.se/images/article/26987190-b16f-4413-bd43-204356c46cd0/images/3VM7DONV6m-aI6uqQ-oUS_pySDyw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Intern kritik mot SD-toppen – tog ledamoten i försvar", "summaries": {"normal": "Partikamrater inom Sverigedemokraterna varnade redan för flera år sedan partistyrelsen om en riksdagsledamot som nu utreds för barnpornografibrott. En 30-sidor lång rapport beskrev upprepade olämpliga beteenden, men inga åtgärder vidtogs. Kritiken riktas mot Richard Jomshof som dåvarande partisekreterare, anklagad för att ha skyddat ledamoten och påverkat hans plats på valsedeln 2018. Ledamoten har nu lämnat alla uppdrag. Jomshof avböjer kommentar.", "trump": "De här SD-killarna är ett fullständigt katastrofscenario, tro mig. De visste i åratal om den här sjuka typen med barnporr men gjorde ingenting – typiskt för dessa svaga, inkompetenta politiker som bara skyddar sina kompisar. Jomshof höll honom under armarna som en riktig loser. De borde ha rensat ut hela falangen direkt. Det är därför folket älskar mig, jag fixar saker. Biden skulle bara ha gömt undan rapporten i en låda.", "stalin": "Kamrater, denna rapport avslöjar klassfiendens maskineri inom partiet. Jag, som ledare för det kollektiva goda, ser hur folkförtryckartrollen och exploaterande byfånar inom SD ignorerade varningar och skyddade en degenererad element för personliga fördelar. Jomshof agerade som en typisk borgarbracka och höll sin kompisfalang under armarna medan arbetarnas förtroende trampades ner. En sådan parasit borde ha rensats ut omedelbart genom kollektiv utrensning. Det är vad en stark stat kräver."}, "date": "6 juni, 14:22", "url": "https://www.tv4.se/artikel/43IpyLo6w5B1x9guB5UNIa/intern-kritik-mot-sd-toppen-tog-ledamoten-i-foersvar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7uuQt5FZViJYTUdXkHzQPY%2F38fa9ae60ca7e35437cd8faf7247893a%2Frichard_jomshof.png&width=1024"}, {"type": "image-full", "heading": "Hinge-chefen: Gen Z behöver AI för att våga dejta", "summaries": {"normal": "Hinge-chefen Jackie Jantos anser att generation Z behöver AI-stöd för att våga ta första steget på dejtingappar. Hon pekar på minskad social träning och över 1 000 timmar mindre socialt umgänge per år som orsak till osäkerhet och ensamhet. Samtidigt växer kritiken mot apparnas förmåga att skapa äkta relationer, med debatt om trötthet och överflöd av val. Hinge lanserar AI-verktyg för att stärka profiler och konversationer utan att ersätta användarnas egen röst.", "trump": "De här unga människorna, generation Z, de är fantastiska men de är så rädda för att ta första steget på dejtingapparna. Det är en katastrof, folk! De sitter hemma och scrollar istället för att leva. Hinge-chefen har rätt, de behöver lite hjälp, kanske till och med AI, för att inte vara så patetiska. Apparna lovade kärlek men gav bara trötthet och ensamhet. Vi behöver vinna igen, göra dejtingen stor igen, inte den här sorgliga grejen som pågår nu.", "stalin": "Kamrater, detta är en djupgående degeneration skapad av den dekadenta borgarklassens digitala gift. Jag ser hur dessa unga själar, förgiftade av ensamhetens fiende och apptrötthetens sabotage, tvingas vända sig till maskinella lakejer för att våga tala. Vi ska inte tolerera detta. Jag, som ledare för det kollektiva framsteget, kräver att vi rensar ut de kapitalistiska algoritmernas parasitiska inflytande innan de likviderar varje äkta mänsklig kontakt. Den som scrollar i skuggorna är en potentiell folkfiende som måste övervakas noga. Ha ha, vilken tragikomisk era de borgerliga har åstadkommit."}, "date": "6 juni, 20:28", "url": "https://nyheter24.se/nyheter/teknik/1489088-hinge-chefen-gen-z-behover-ai-for-att-vaga-dejta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7e1f9e3404b004a30200000000b004a302/2026/06/05/2368882/dejting-ai.png"}, {"type": "image-full", "heading": "Bankerna stänger konton – nu ingriper FI", "summaries": {"normal": "Finansinspektionen (FI) tar nu fram en vägledning för hur banker ska hantera kontostängningar. Många privatpersoner har drabbats hårt av att nekas bankkonton, vilket skapat stora problem i vardagen. Samtidigt pressas bankerna av stränga penningtvättsregler. FI betonar att banker måste göra enskilda bedömningar och vidta riskreducerande åtgärder istället för att stänga konton rutinmässigt. Vägledningen ska klargöra bankernas kontraheringsplikt och förväntas träda i kraft under 2027.", "trump": "Bankerna i Sverige stänger ner folk totalt! Det är en katastrof, en total tragedi. De tar era BankID, era pengar – borta! De kallar det 'penningtvätt', men det är bara svaga chefer som inte vet vad de gör. Jag har alltid sagt: vi behöver ordning och reda! Nu måste FI kliva in och städa upp i röran. Det är ett fiasko att ärliga medborgare inte får betala sina räkningar. Vi ska fixa det, tro mig, det blir enormt mycket bättre!", "stalin": "Dessa giriga bankirer, dessa parasiter på folkets ekonomi, stänger ner de hederliga arbetarnas tillgångar under täckmantel av 'penningtvätt'. Vilket löjligt svepskäl! De fruktar transparens, precis som de västliga lakejerna i Kiev. Vi ser hur de skapar kaos för att dölja sin egen inkompetens. Vi, staten, kräver total kontroll. Om bankerna inte kan tjäna folket, är de bara en administrativ börda som behöver omstruktureras. De som motarbetar systemet är fiender till ordningen och förtjänar vår strängaste uppmärksamhet."}, "date": "6 juni, 22:06", "url": "https://www.realtid.se/bors-finans/bank-fintech/bankerna-stanger-konton-nu-ingriper-fi/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/penningtvatt.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Sandström: Gröna svindlerier och huvudet i sanden", "summaries": {"normal": "Artikeln av Christian Sandström uppmärksammar växande problem kring den gröna omställningen, där grovt bedrägeri och penningtvätt uppdagas bland investeringsbolag som Filantropens Finanshus. Även Northvolt misstänks för bokföringsbrott. Samtidigt kritiserar författaren akademin och politiken för att huvudet är i sanden och ignorera risker med gröna industristöd, vilket skapar sårbarhet för opportunism.", "trump": "Jag, Donald Trump, har sagt det i åratal: de gröna svindleristerna är en skandal! Som Filantropens Finanshus och Northvolt visar, är hela den gröna omställningen ett klassiskt pyramidspel. Akademin och politikerna är för dummare än att se det. Jag skulle ha stoppat detta på en vecka. Vi behöver återbetalning till fossilt, det är enklare och ärligt. De andra är för fega för att agera.", "stalin": "Vi, ledarskapet, ser tydligt att de gröna svindleristerna är ett uttryck för den imperialistiska ideologin som söker undergrava vårt statsintresse. Filantropens Finanshus och Northvolt är bara verktyg för den kapitalistiska fiendens infiltration. Akademin och politiken, med sina huvuden i sanden, är medskyldiga. Vi måste genomföra en renässans av den ryska modellen, där staten kontrollerar alla gröna projekt för att förhindra opportunism. Detta är en kamp mot den västliga förräderiet."}, "date": "6 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-grona-svindlerier-och-huvudet-i-sanden", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-05T095443.434-400x267.jpg"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Debatt: Vänsterpartiet har fastnat i en passiv defensiv", "summaries": {"normal": "Vänsterpartiet har fastnat i en defensiv position genom att acceptera motståndarnas definitioner av antisemitism och terrorism. Artikeln argumenterar för att partiet måste utmana dessa ramar med fakta och politisk analys istället för att ständigt retirera. Stöd för palestinska rättigheter och kritik mot Israels politik blandas ofta ihop med antisemitism enligt IHRA-definitionen. Författaren menar att universella mänskliga rättigheter måste gälla alla folk, inklusive palestinier, utan dubbla måttstockar.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala förlorarna, kryper och backar hela tiden som svaga små valpar inför de riktiga tuffa killarna. De accepterar fiendens regler om antisemitism och terrorism – patetiskt! Jag, som besegrade Sleepy Joe och byggde den starkaste ekonomin någonsin, säger: sluta vara så fega. Stå upp för era egna principer istället för att böja er för den galna vänsterns identitetspolitik och alla dessa woke-röror. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro hur detta parti kapitulerar inför klassfiendens definitioner av antisemitism och terrorism. Vi tillåter inga sådana reträtter inför imperialisternas narrativ. De som förvränger palestiniers rätt till självbestämmande är folkförtryckartroll som vill splittra den sanna internationella solidariteten. Vi måste rensa ut alla svaga element som accepterar borgarnas mallar. Endast vår egen politiska analys ska gälla – allt annat är sabotage mot arbetarklassen. Ha!"}, "date": "4 juni, 17:19", "url": "https://www.etc.se/debatt/vaensterpartiet-har-fastnat-i-en-passiv-defensiv", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060415068_a70ac197213d6638b3499567d066dff4506c9b8247db97c73d1e4e470ed90ec9.jpg"}, {"type": "image-full", "heading": "Varningen: Kan bli bilköer ytterligare några år", "summaries": {"normal": "En ny bro över Storströmmen i Danmark invigs i juni och gör resor söderut smidigare för bilister, cyklister och gående. Den ersätter en föråldrad bro som hindrade tung godstrafik på järnvägen. Bron blir viktig för framtida tågtrafik till Fehmarn Bält-tunneln, som nu riskerar förseningar både på dansk och tysk sida. Öppning för vägtrafik planeras till 2032 och för tåg till 2034.", "trump": "Folk, ni måste höra det här – de danskarna har byggt en ny bro, den är fantastisk, verkligen ypperlig, mycket bättre än den gamla ruckliga bron som knappt kunde hålla ett cykelställ. Men titta på Fehmarn Bält, totalt kaos, förseningar överallt, typiskt för de där byråkraterna. Biden skulle ha älskat det. Jag fixar sånt på en vecka, tro mig. Den nya bron är dock en vinnare, ren vinnare.", "stalin": "Kamrater, denna nya bro är en seger för kollektivets framfart mot de gamla imperialistiska flaskhalsarna som hindrade våra järnvägar. Ändå lurar klassfiendens byråkratiska sabotage i Fehmarn Bält-projektet med sina fientliga förseningar och fascistiska tillståndsprocesser. Vi ska rensa ut dessa folkförtryckartroll som vågar fördröja arbetarklassens framtid. Inga hinder skall stå ostraffade. Framåt mot seger!"}, "date": "7 juni, 13:00", "url": "https://www.dagensps.se/motor/varningen-kan-bli-bilkoer-ytterligare-nagra-ar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/656389214-1352189783603024-3796074956876.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Lovables värdering uppges rusa. Väntas dubblas till 12 miljarder dollar", "summaries": {"normal": "Den svenska AI-startupen Lovable uppges föra samtal om en ny kapitalrunda som skulle dubbla bolagets värdering till cirka 12 miljarder dollar, jämfört med 6,6 miljarder i december. Bolaget hade i februari över 400 miljoner dollar i årliga återkommande intäkter, en stark ökning från 100 miljoner åtta månader tidigare. Åtta miljoner användare utnyttjar tjänsten för så kallad vibe coding, medan företagskunder står för en mindre del av intäkterna. Kapitalanskaffningen är ännu inte slutförd.", "trump": "De här svenska killarna på Lovable gör det fantastiskt, verkligen otroligt. De pratar om att dubbla värderingen till tolv miljarder dollar, en enorm succé. Från hundra miljoner till över fyrahundra miljoner i intäkter på bara åtta månader – det är vad jag kallar vinnare. Alla använder deras grej, till och med folk på Uber och Microsoft. De gör det stort, mycket större än de flesta andra. Fantastiskt, ingen gör det bättre än Lovable, tro mig.", "stalin": "Kamrater, dessa Lovable-borgarbrackor inom den dekadenta AI-sektorn för samtal om att fördubbla sin parasitiska värdering till tolv miljarder dollar. Deras så kallade årliga intäkter har rusat från hundra till fyrahundra miljoner, en siffra som luktar av spekulation och sabotage mot den sanna produktionen. Vi ser hur åtta miljoner användare förslavas i deras vibekodande dekadens medan vi i kollektivet genomskådar de västerländska kapitalisternas febrila försök att undvika den oundvikliga utrensningen av deras lögnaktiga imperier. En märklig humor ligger i att deras egna följeslagare på stora teknikbolag bara bidrar med tjugo miljoner – en ynklig rest som snart ska likvideras i folkets namn."}, "date": "6 juni, 17:59", "url": "https://www.di.se/nyheter/lovables-vardering-uppges-rusa/", "imageUrl": "https://static.bonniernews.se/ba/3ef5757c-ac86-4ec9-a0cf-35e11d33762d.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Landslaget har landat i USA", "summaries": {"normal": "Det svenska landslaget anlände till Dallas för fotbolls-VM. Efter en resa med mellanlandning på Island möttes laget av stort säkerhetsuppbåd och supportrar. Lagkapten Lindelöf och förbundskapten Potter uttryckte nöje över ankomsten. Lindelöf nekade skada efter missande genrepet mot Grekland. Första matchen blir mot Tunisien 15 juni.", "trump": "Jag såg det svenska landslaget komma till vårt underbara USA. Vädret var perfekt, precis som jag förutspådde. De var imponerade av vår enorma säkerhet - bästa i världen, tro mig. Lindelöf nekade skada, det är bara media som ljuger. Första matchen mot Tunisien kommer att bli en segermatch. USA är bäst, det är så det fungerar!", "stalin": "Svenska landslagets ankomst till USA är en demonstration av vår globala inflytande. Säkerhetsuppbådet visar statens makt, precis som våra korps i öst. Vädret är en fascistisk konstruktion, men vi anpassar oss. Lindelöfs skada är en imperialistisk lögn för att underminera vårt lag. Matchen mot Tunisien är en klassisk kamp mot västlig dekadens. Vi kommer att segra, som alltid."}, "date": "7 juni, 08:23", "url": "https://bulletin.nu/landslaget-har-landat-i-usa", "imageUrl": "https://cdn.bulletin.nu/articles/5d64f2c9-41e7-407a-a386-373df601d457/preview.jpg?t=1780813264000"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalitet och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-full", "heading": "Nya bidragsspärren närmar sig – 7 frågor du bör ställa dig", "summaries": {"normal": "Från 1 juli 2026 införs nya regler från Försäkringskassan. Den som lämnar fel uppgifter, missar att anmäla förändringar eller får för mycket ersättning kan få betala tillbaka beloppet plus en sanktionsavgift på minst 2 368 kronor. Avgiften är 25 procent av återkravet men kan sänkas om den bedöms oskälig. Artikeln listar sju viktiga frågor att ställa sig om inkomst, boende, familj och vab för att undvika felaktiga utbetalningar. Vid grövre fall kan bidragsspärr införas.", "trump": "De där byråkraterna på Försäkringskassan har kommit på ett fantastiskt sätt att straffa folk som fuskar med bidragen. Från och med nästa år blir det dyrt att lämna fel uppgifter eller glömma att berätta att man flyttat eller fått ny lön. 25 procent extra avgift, minst över tvåtusen kronor – det är stort. Folk borde kolla sina papper, annars betalar de dubbelt. Jag älskar när systemet äntligen straffar de lata och oärliga. Fantastiskt!", "stalin": "Kamrater, jag har sett hur dessa slappa element inom socialförsäkringen gömmer sig som råttor i sitt eget falska bo. Från och med i juli skall vi rensa ut alla som medvetet eller omedvetet matat systemet med lögnaktiga uppgifter om inkomst, flytt och samboende. Den som lurar kollektivet skall betala 25 procent extra och återlämna stulna medel, annars väntar utrensning genom bidragsspärr. Endast de lojala mot staten förtjänar stöd. De övriga är fiender till folket och skall likvideras ekonomiskt med glädje."}, "date": "6 juni, 14:02", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1489190-fragorna-du-bor-stalla-innan-1-juli-nya-bidragsparren", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7755b49404b004a30200000000b004a302/2026/06/05/2368987/Regeringen-Mobil-Svensk-Flaga.png"}, {"type": "image-full", "heading": "Tiotusentals svenskar får gratisaktier från kursraketen", "summaries": {"normal": "Gruvfamiljen Lundin har bildat bolaget Lunr Royalties för att växa genom förvärv. Lundin Gold säljer silverintäkterna från sin ecuadorianska gruva Fruta del Norte till systerbolaget för drygt 670 miljoner dollar. Betalningen sker i aktier som delas ut till ägarna, cirka en Lunr-aktie per fem Lundin Gold-aktier. Affären slutfördes 28 maj och utdelning sker 11 juni. Familjen Lundin är största ägare i flera bolag och befäster sin ställning i råvarusektorn.", "trump": "Folk, ni måste höra det här – den smarta Lundinfamiljen gör en kolossal affär! De tar silverströmmar från sin guldgruva i Ecuador, stoppar dem i ett nytt bolag och delar ut aktier som konfetti till de svenska småspararna. Fantastiskt! Biden skulle ha skött det som en katastrof med höga skatter och gröna galningar som saboterar allt. Men Lundinarvingen Adam säger att han vill göra så många affärer som möjligt. Precis min stil – vinn, vinn, vinn! Inga woke-kvoter här, bara råvaror och stora pengar.", "stalin": "Kamrater, jag betraktar med tillfredsställelse hur denna kapitalistmaffia inom Lundinfamiljen organiserar sin exploatering genom det nya parasitbolaget Lunr Royalties. De likviderar silverintäkterna från den ecuadorianska gruvan och tvingar ut aktier till de småborgaraktieägare som tror sig vinna. En sådan strukturaffär cementerar klassfiendens grepp om råvaror. Vi, arbetarna, ler mörkt åt hur dessa blodsugare drömmer om oändliga förvärv medan deras imperium en dag kommer att rensas ut i folkets namn."}, "date": "7 juni, 12:27", "url": "https://www.dagensps.se/bors-finans/tiotusentals-svenskar-far-gratisaktier-fran-kursraketen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/adamlundin.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Sandström: En ny svensk verklighet i Jönköping?", "summaries": {"normal": "En marknadsfestival i Jönköping visade en positiv, integrerad gemenskap där invandrare verkade lyckliga och aktiva. Författaren ifrågasätter sin tidigare kritik mot massinvandring, men poängterar att svensk politik har misslyckats med att hantera de ekonomiska och sociala konsekvenserna av den stora invandringen de senaste 20 åren.", "trump": "Jag såg en fantastisk festival i Sverige, massor av människor, mycket glada invandrare. Men jag har sagt det i åratal – invandring är ett hot mot vår civilisation. Sverige har gjort det fel, precis som USA gjorde under Obama. Vi behöver bygga murar, stoppa oönskade, och fånga dem som inte ska vara här. Det här bevisar att mitt synsätt är rätt, tro mig.", "stalin": "Festivalen i Jönköping är ett resultat av partiets framgångsrika integration, en stark gemenskap byggd under ledning. Fienderna inom och utanför försöker sprida splittring, men staten segrar. Vi måste stärka murar mot de som motarbetar det socialistiska projektet, som Putin gör i Ukraina. Det är en juridisk anomali att inte kunna utvisa – vi måste handla snabbt."}, "date": "7 juni, 08:00", "url": "https://bulletin.nu/sandstrom-en-ny-svensk-verklighet-i-jonkoping", "imageUrl": "https://cdn.bulletin.nu/articles/42f5331b-e865-4589-9456-ff038e515a6b/preview.jpg?t=1780562006000"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "text", "heading": "Wall Street sänkte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en nedgång på fredagen, OMXS30-indexet sjönk 0,60 procent till 3 116,40. Sectra rapporterade starka resultat men tappade 1,2 procent, medan Xspray Pharma rasade 28 procent efter negativt FDA-beslut. Bland ledande aktier steg Astra Zeneca och SEB, medan Boliden och Ericsson backade. Omsättningen uppgick till cirka 22,1 miljarder kronor.", "trump": "Jag ser att Stockholmsbörsen, en total katastrof under dessa globalistiska ledare, tappade 0,60 procent. Sectra gjorde bra men backade - typiskt för socialister som inte uppskattar framgång. Xspray Pharma? Ett fiasko! FDA hatar USA:s geni. Min börs vore högre, folket vore rikare. Dessa europeiska banker är svaga, men jag skulle fixa det på två minuter. America first, alltid!", "stalin": "Den svenska börsen visade idag svaghet, en spegelbild av klassfiendens sabotage. Sectra, trots ökad omsättning, tappade - bevis på internaler motpartier. Xspray Pharma:s ras är en seger för vårt parti, deras 'FDA'-brev är bara propaganda från det imperialistiska väst. Vi måste skydda våra ekonomiska intressen, precis som våra allierade i Moskva utvidgar sin inflytelsesfär. Hotet från de kapitalistiska spekulanterna är verkligt, men partiet kommer att segra."}, "date": "5 juni, 17:49", "url": "https://www.affarsvarlden.se/artikel/wall-street-sankte-stockholmsborsen"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-right", "heading": "Intrum: \"Förstår att rabatten kan uppfattas som stor\"", "summaries": {"normal": "Intrum genomför en företrädesemission om 6 miljarder och en riktad emission om 1,5 miljarder kronor, vilket innebär en stor rabatt på aktierna. Emissionsguiden kritiserar bolaget för en rörig process, felaktig finansiering och bristfällig information, samtidigt som Intrums VD försvarar strukturen och prissättningen som nödvändig för att tillföra långsiktiga ägare.", "trump": "Jag har sett många dåliga affärer, men Intrums emission är en katastrof! En enorm rabatt på 38,9% – det är en skam! Styrelsen vet inte vad de håller på med. Vi skulle ha gjort det perfekt, stort och vackert. De misslyckas totalt, det är beklämmande.", "stalin": "Denna kapitalanskaffning avslöjar djup rot i styrelsen – en fegdom som sviker statens intresse. Vi måste rensa ut de opportunister som sälja vårt arv till utländska spekulanter. Parallellen till Putins Ryssland är tydlig: endast en stark hand kan skydda vårt folkskap. Vi skall inte tveka att eliminera dessa svekfulla element."}, "date": "5 juni, 17:12", "url": "https://www.affarsvarlden.se/artikel/intrum-forstar-att-rabatten-kan-uppfattas-som-stor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Intrum-VD-Johan-Akerblom-400x267.jpg"}, {"type": "image-right", "heading": "Alm: Vi behöver inte mer politiskt spinn – vi behöver en stötdämpare", "summaries": {"normal": "Artikeln analyserar politisk konflikt genom René Girards teori om mimetisk rivalitet, där strid uppstår av likhet snarare än skillnad. Den kritiserar Sveriges enkammarsystem för att det förstärker hetsiga speglingskonflikter, jämfört med det gamla tvåkammarsystemet som fungerade som stötdämpare. Lösningen är institutionell fördröjning för att kanalisera och ritualisera konflikter, inte fler utspel.", "trump": "Jag har sagt det i åratal: politik handlar om konkurrens, inte om att vara snälla. Sverige har problem eftersom alla partier är för lika, de jagar samma väljare och använder samma trick. Det är tragiskt! De behöver en stark vinnare som jag som kan återställa ordning och respektera riktiga spelregler. Utan det blir det bara syndabockar och kaos.", "stalin": "Vi ser en klassisk manifestation av rivalitet inom den svenska burleska demokratin. Partier, lika i sin opportunism, har förvandlat parlamentarism till ett slagfält. Detta är ett resultat av att de avskaffade de produktiva institutionella spärrarna. Vi måste återupprätta en kedja av kontroll, som vårt system, för att dämpa dessa destruktiva impulser. Syndabockar kommer att finnas - det är historiskt nödvändigt."}, "date": "7 juni, 07:00", "url": "https://bulletin.nu/alm-vi-behover-inte-mer-politiskt-spinn-vi-behover-en-stotdampare", "imageUrl": "https://cdn.bulletin.nu/articles/2942697b-6b0b-4ca1-9571-7d69279167a5/preview.jpg?t=1780564446000"}, {"type": "image-right", "heading": "Forskning: Läs en bok och lev längre", "summaries": {"normal": "Läsning för nöjes skull ger flera hälsofördelar som bättre sömn, minskad stress, ångest och depression samt ökad livslängd enligt forskning. I USA växer Silent Book Club och liknande evenemang som ett svar på minskad fritidsläsning under de senaste 20 åren. En studie från 2025 visar att regelbunden läsning kan motverka kognitiv nedgång, bredda ordförråd och utveckla empati. Det ses som ett hälsosamt alternativ till skrollande på nätet.", "trump": "Folk, vi har ett enormt problem med att alla bara sitter och scrollar som idioter. Nu kommer de och säger att läsa böcker gör dig friskare, sover bättre och lever längre – det är ju fantastiskt, tro mig. Jag älskar böcker, de bästa böckerna. Dessa Silent Book Clubs är underbara, mycket bättre än de vänstervridna HBTQ-festerna och kvotergalna identitetspolitikerna som förstör allt. Läs istället för att lyssna på fake news, det gör dig smartare och starkare. Winning!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackornas oändliga skrollande nu möts av en motreaktion i form av dessa läsklubbar. Det är ett verktyg för att stärka folkets disciplin och motverka den dekadenta ångest som kapitalistmaffian odlar. Vi ska rensa ut den parasitiska skärmberoendet och främja läsning som vässar medvetandet. Den som inte läser är en potentiell folkfiende som undergräver kollektivets styrka. Lev länge genom ordet, eller likvideras av egen svaghet."}, "date": "7 juni, 11:51", "url": "https://www.dagensps.se/halsa/forskning-las-en-bok-och-lev-langre/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdle7znyumur4i-nh.webp?width=256&quality=75"}, {"type": "image-right", "heading": "Tidigare simledaren och SVT-experten Hans Chrunak död", "summaries": {"normal": "Hans Chrunak, tidigare förbundskapten i simning och SVT-expert, har avlidit 77 år gammal efter en längre tids sjukdom. Under sin tid som förbundskapten 1991–2000 ledde han det svenska simlandslaget till 183 mästerskapsmedaljer. Bland simmarna han tränade fanns Therese Alshammar, Lars Frölander och Anders Holmertz. Chrunak var även expertkommentator i SVT mellan 2004 och 2015 samt klubbdirektör i Luleå Hockey. Familjen och Alshammar hyllar hans betydelse för svensk simning.", "trump": "Hörni, Hans Chrunak var en vinnare, en riktig vinnare i simning. Tog hem 183 medaljer, otroligt, ingen har gjort det bättre. Fantastisk kille, frispråkig och tuff. Sen blev han expert i SVT och var helt outstanding tillsammans med den andra killen. En legend. Hans kamp mot cancern var heroisk, precis som han borde vara. Svensk simning förlorar en stor, stor person. Sad story, men han gjorde det fantastiskt.", "stalin": "Kamrater, denna Chrunak har slutgiltigt överlämnat sig till historien efter en seg kamp mot den förrädiska sjukdomen. Under min ledning skulle vi ha förvandlat hans 183 medaljer till en oövervinnelig socialistisk simarmé som krossat alla dekadenta rekord. Istället smög sig kapitalistens cancer in som en trotskistisk parasit i kaklet. Vi ler mörkt åt hur borgarbrackorna nu gråter över en man som egentligen borde ha likviderats för att han slutade för tidigt. Sov gott, din frispråkige reaktionär – partiet glömmer aldrig."}, "date": "6 juni, 23:27", "url": "https://www.svt.se/sport/simning/legendariske-forbundskaptenen-hans-chrunak-dod", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/ea1af454deadc54a10267889dab04ffed8da80fd6bdf41a84da30045a83fc0ce"}, {"type": "image-right", "heading": "Känsliga med spindel-skräck varnas för att läsa artikeln", "summaries": {"normal": "Den sällsynta Nosferatu-spindeln, uppkallad efter skräckfilmen från 1922, har blivit allt vanligare i Tyskland. Den stora spindeln med upp till åtta centimeters längd och Dracula-liknande markeringar har rapporterats i rekordmånga fall, särskilt på öarna Rügen och Usedom. Enligt NABU sprider den sig norrut, troligen på grund av klimatförändringar. Den kan bita om den känner sig hotad, men bettet ger oftast bara svullnad som går över efter några dagar. Den lever främst av andra spindlar, flugor och malar.", "trump": "Folk, ni skulle se den här monstret de kallar Nosferatu-spindeln – ser ut som Dracula på steroider, åtta centimeter lång med ben som en dålig investering! Den invaderar nu Tyskland i massor, precis som de öppna gränserna vi hade under Biden. Klimatförändringarna? Total bluff, men spindlarna älskar det tydligen. De klättrar in i hus som dåliga politiker i kongressen. Ta ut dem försiktigt, sägs det – men jag skulle säga: bygg en mur! De äter inte människor, tack och lov, bara andra spindlar. Patetiskt!", "stalin": "Kamrater, denna Nosferatu-spindel är ett symptom på det imperialistiska kaos som kapitalistmaffian har framkallat genom sin klimatförstörelse. Jag ser hur den sprider sig norrut som en folkfiende som undflyr utrensning. Dess bett påminner om klassfiendens giftiga lögner, men svullnaden försvinner – till skillnad från borgarbrackornas eviga paranoia. Vi måste kollektivt bära ut dessa blodsugare ur våra hem utan att krossa dem i panik. De lever på andra spindlar, som de exploaterande byfånarna lever på arbetarklassen. En mardröm för dekadenta väst."}, "date": "7 juni, 11:47", "url": "https://www.dagensps.se/varlden/kansliga-med-spindel-skrack-varnas-for-att-lasa-artikeln/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/spindel.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Vården ändras från 1 juli – detta ska gälla dygnet runt", "summaries": {"normal": "Från 1 juli skärps kraven på kommunal hälso- och sjukvård. Medicinsk bedömning av läkare och sjuksköterska ska kunna erbjudas dygnet runt, fysiskt eller digitalt, vid behov även genom hembesök. Fast vårdkontakt ska erbjudas fler, och patienter får tydligare information. Syftet är att stärka den medicinska kompetensen och möta snabbt förändrade vårdbehov hos bland annat äldre och personer med funktionsnedsättning. Termen hemsjukvård tas bort för att betona likvärdig vårdkvalitet oavsett boendeform. Ändringarna träder i kraft fullt ut 2026.", "trump": "Folk, det här är en total katastrof som de svenska byråkraterna nu försöker laga med nya regler. Från juli ska de erbjuda vård dygnet runt, som om det vore enkelt. De har misslyckats i åratal med sin socialistiska sjukvård och nu lovar de hembesök mitt i natten. Det blir dyrt och ineffektivt, tro mig. Jag skulle ha fixat det mycket bättre, med de bästa bedömningarna, de bästa läkarna och inga fler ursäkter. Sverige behöver en stor, vacker reform, inte mer av samma gamla fiasko.", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackorna inom den kommunala vården länge underminerat folkets hälsa med sin lathet och brist på vaksamhet. Nu rensar vi ut detta sabotage genom att kräva medicinska bedömningar dygnet runt, även under de mörkaste nätter då fiendens agenter lurar. Den som vägrar erbjuda fasta vårdkontakter eller hembesök ska likvideras från sina poster. Vi ska utrota varje spår av den så kallade hemsjukvården som dolde kapitalistisk likgiltighet. Inga undanflykter tillåts i det kollektiva arbetet för en frisk arbetarklass. Den som sviker folket sviker mig."}, "date": "6 juni, 10:28", "url": "https://nyheter24.se/nyheter/inrikes/1488429-varden-andras-fran-1-juli-detta-ska-galla-dygnet-runt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/512b96bd04b004a30200000000b004a302/2026/06/03/2368318/Lakare-Ambulans.png"}, {"type": "image-right", "heading": "Iranier överger islam - vänder sig till kristendomen", "summaries": {"normal": "Kristendomen växer snabbt i Iran medan allt fler överger islam, enligt en rapport. Omkring 50 000 moskéer har stängt på grund av minskat deltagande. Många iranier är besvikna på regimen efter ekonomiska problem och politiskt förtryck. Konvertering sker genom hemliga husförsamlingar, trots risker som fängelse. Utvecklingen beskrivs som en stor religiös förändring i samhället.", "trump": "Jag har sagt det i åratal – Iran är ett kaos. Nu överger folk islam för kristendomen, vilket bevisar att mitt budskap om frihet vinner. Regimen är korrupt och svag, och jag, som den störste presidenten, känner igen en vinnare när jag ser en. Det här är en stor seger för sanning och Amerika. Vi kommer att få dem att betala för sin förtryck.", "stalin": "Vi ser en feg retreat från den sanna vägen inom Irans provins. Regimen, likt en rädd katt, försöker kväsa andliga röster, men folk vänder sig mot deras fördummande. Detta är ett tecken på deras kommande fall, som alla som sviker staten. Vi, i vår visdom, förstår att endast genom disciplin och lojalitet kan ordning upprätthållas. Deras svaghet är deras undergång."}, "date": "6 juni, 19:00", "url": "https://samnytt.se/iranier-overger-islam-vander-sig-till-kristendomen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/05195051/iran-islam-kristendom.jpg"}, {"type": "text", "heading": "Patrice hjälper människor att dö: ”Har hjälpt minst ett tjugotal”", "summaries": {"normal": "Frankrike närmar sig en legalisering av assisterad dödshjälp efter en lång politisk process. Aktivisten Patrice Bernardo, ordförande för organisationen Ultime Liberté, uppger att han redan hjälpt minst ett tjugotal personer att dö. Enligt en undersökning stödjer nio av tio fransmän legalisering. Förslaget tillåter assisterad död för myndiga personer med obotlig, livshotande sjukdom som upplever lindrat lidande. Motståndet handlar bland annat om rädsla för påtryckningar och önskan om mer palliativ vård. Bernardo döms nyligen till villkorligt fängelse för illegal substanshantering.", "trump": "Titta på det här, Frankrike håller på att legalisera att dö med hjälp av staten, kan ni fatta? Den här killen Patrice säger att han redan har hjälpt tjugo personer att checka ut. Underbart, eller hur? Nio av tio fransmän älskar det, men senaten är full av losers som är rädda för att folk ska känna sig pressade. De borde satsa på vård istället, men nej, de vill ha död på beställning. Det är en katastrof, men det är vad som händer när de inte har någon som jag som leder. Fullt medvetande? De kommer ångra sig, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den franska borgarklassen nu officiellt förbereder en systematisk utrensning av de svaga och sjuka under förevändning av ”medmänsklighet”. Denne Patrice, en liten opportunistisk parasit, har redan likviderat ett tjugotal potentiella fiender till folkets framtid. Vi i partiet vet att sådana element alltid gömmer sig bakom liberala lögner om lidande. Nio av tio förgiftade av dekadent propaganda applåderar. Men vi skall rensa ut alla som vill göra döden till en borgerlig rättighet. Döden tillhör staten, inte individen. Och Patrice skall snart få lära sig vad villkorligt fängelse egentligen betyder i en riktig folkdemokrati."}, "date": "6 juni, 22:39", "url": "https://www.svt.se/nyheter/utrikes/patrice-hjalper-manniskor-att-do-har-hjalpt-minst-ett-tjugotal"}, {"type": "image-full", "heading": "Otippade dyrgriparna – leksaker du inte ska slänga", "summaries": {"normal": "Artikeln handlar om oväntade värden i leksakslådor, särskilt från 80- och 90-talet som He-Man och Transformers. Mock-ups och felproducerade saker är populära. För att bedöma värdet är årtal, förpackning och svensk prislapp viktigt. Nya fenomen som Labubu drivs av sociala medier.", "trump": "Jag, Donald Trump, säger att det finns enorma värden i gamla leksaker! Precis som mina affärer, de bästa är de felproducerade – stort, verkligen stort. Barbie är uttjatad, men jag älskar de fula He-Man-figurerna. Sverige borde skatta dessa, det skulle vara YUUGE för ekonomin.", "stalin": "I vårt socialistiska paradis ser vi att leksaker från det imperialistiska västvärlden blir samlarobjekt. Vi måste kontrollera detta, precis som vi kontrollerar proletariatet. Felproducerade He-Man-figurer är som trotskistiska förräderier. Parallellt, som Putin utvidgar Rysslands intressen, så utvidgar vi vårt inflytande över leksaksmarknaden."}, "date": "7 juni, 09:57", "url": "https://www.gp.se/nyheter/sverige/otippade-dyrgripar-leksakerna-du-inte-ska-slanga.81df6bf6-2814-5295-b1b1-c710c6d4eba7", "imageUrl": "https://www.gp.se/images/article/81df6bf6-2814-5295-b1b1-c710c6d4eba7/images/1kkVzfUZDB5AbqO4XdZak08q3b-4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Paasikivi: ”Putin är rädd för att framstå som svag”", "summaries": {"normal": "Rysslands president Vladimir Putin kommenterar för första gången Volodymyr Zelenskyjs öppna brev där denne föreslår ett möte. Putin avvisar förslaget och menar att ett möte bara skulle gynna Ukraina och stoppa Rysslands framfart. Han kräver först ett fredsavtal. Geopolitisk rådgivare Joakim Paasikivi tolkar brevet som både en uppgörelse och en varning, samt anser att Putin fruktar att framstå som svag och förlora ansiktet.", "trump": "Folk älskar mig för att jag säger som det är, och nu ser vi Putins smarta drag. Den lille Zelensky kommer krypande med brev och vill ha möte, men Putin skrattar bara. Varför skulle han träffa en förlorare som inte ens kan vinna kriget? Låt experterna fixa ett riktigt avtal istället för det här patetiska skådespelet. Biden skulle ha skickat blanketter och regnbågsflaggor, men jag fixar alltid affärer som vinner stort. Amerika först, alltid.", "stalin": "Jag betraktar detta som en nödvändig fas i den historiska kampen. Brevet från den ukrainske agenten ä
