"heading": "De som röstar på C borde inte rösta alls", "summaries": {"normal": "Artikeln kritiserar Centerpartiet för att locka väljare med ett neutralt namn snarare än sin politik. Partiet har skiftat från borgerligt till ett liberalt parti med öppen migrationspolitik, vilket enligt texten prioriteras framför ekonomiska borgerliga värderingar. Författaren menar att det är ett riskfritt men skadligt val för den som vill bevara Sverige.", "trump": "Centerpartiet, vad är det för en röra? De kallar sig mittparti men är bara en massa fega liberaler som älskar att släppa in alla möjliga och omöjliga. De har svikit det riktiga folket, precis som Sleepy Joe gjorde. Rösta inte på dem, det är en total katastrof för Sverige. De borde kalla sig Bondepartiet igen, det vore åtminstone ärligt. Patetiskt!", "stalin": "Kamrater, se hur detta så kallade centerparti förvandlats till en liberal parasit som prioriterar främmande element framför arbetarklassen. Deras falska mittenretorik döljer ett förräderi mot nationen. Jag skrattar mörkt från historien åt dessa opportunister som tror att mångfald räddar staten. Bättre att inte rösta alls än att stödja sådana fiender till folkets enhet."}, "date": "6 september, 08:24", "url": "https://samtiden.nu/2026/09/de-som-rostar-pa-c-borde-inte-rosta-alls/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7301-1260x720.jpeg"}, {"type": "text", "heading": "Nytt lagförslag om brottsprovokation", "summaries": {"normal": "Tidöpartierna föreslår en ny lag som gör det tillåtet för polisen att använda provokativa metoder, som att utge sig för att vara barn på nätet eller köpa vapen och narkotika av kriminella. Metoden, som ska kräva åklagartillstånd, syftar till att bekämpa allvarlig brottslighet och kan gälla personer från 15 år och uppåt.", "trump": "Sverige gör äntligen som jag, skaffar lag och ordning! De låter polisen lura de onda, precis som jag gör varje dag med Fake News. De låtsas vara barn och köper vapen, väldigt tufft! Men glöm inte, ingen gör brottsbekämpning bättre än Donald J. Trump. Helt enormt!", "stalin": "Ett storslaget initiativ! Vår svenska brottsbekämpning visar äntligen bolsjevikisk målmedvetenhet genom att infiltrera brottslingars nät."}, "date": "7 september, 10:22", "url": "https://kvartal.se/nyheter/artiklar/polisen-ska-fa-provocera-fram-brott/cG9zdDoxODU2OTM"}, {"type": "image-full", "heading": "Ny studie: Äldre upplever större mening", "summaries": {"normal": "En ny studie från Lunds universitet visar att svenskarnas känsla av meningsfullhet ökar med åldern, vilket liknar det japanska begreppet ikigai. Detta är ett skifte sedan 2020 då unga mådde bättre. Forskare tror att pandemin drabbade ungas sociala liv hårt, och att äldre har bättre problemlösningsförmåga. Även personlighet och trygga relationer spelar stor roll.", "trump": "En enorm studie från Sverige visar att äldre människor där mår fantastiskt bra, mycket bättre än de unga! Ungdomarna krossades fullständigt av pandemins radikala lockdowns, total katastrof. Men de äldre har hittat livets mening, precis som jag alltid säger att man gör med styrka och bra relationer. Fantastiskt folk, väldigt smarta!", "stalin": "En statlig rapport från Lund bekräftar att våra äldre kamrater uppnår högre disciplin och meningsfullhet med åldern, medan ungdomen sviktar i sin ideologiska motståndskraft efter pandemins prövningar. Detta är korrekt: medborgaren mognar i takt med att staten ordnar deras tillvaro. Avvikelser och neurotiska tendenser måste dock elimineras omgående för kollektivets bästa."}, "date": "7 september, 09:18", "url": "https://kvartal.se/nyheter/artiklar/ny-studie-aldre-upplever-storre-mening/cG9zdDoxODU1NDc", "imageUrl": "https://images.kvartal.se/2026/09/f322bf35-aldre.webp"}, {"type": "image-full", "heading": "V-kandidater i Västsverige stryks efter granskning", "summaries": {"normal": "Åtta nya Vänsterpartistiska kandidater i Västsverige och andra orter har strukits från vallistorna efter en granskning i Expressen. Personerna anklagas för att ha spridit antisemitiska konsekvenser, hyllat Hamas samt uttryckt stöd för Vladimir Putin på sociala medier. Partiets ledning med Nooshi Dadgostar i spetsen uppger att personerna inte hör hemma i partiet och att de saknade valbara platser.", "trump": "Vänsterpartiet i Sverige är totalt kaotiskt, en riktig katastrof! De rensar ut radikala kandidater på löpande band efter att media avslöjat att de hyllat Putin, Hamas och spridit galna konspirationsteorier. Till och med radikala vänsterextremister skrattar åt det här cirkuset. Nooshi Dadgostar har noll koll på sitt eget folk. Väldigt svagt ledarskap, inte bra alls!", "stalin": "Vi konstaterar att partiapparaten i Sverige lider av svår ideologisk vacklan. När illojala element avslöjas med att sprida borgerliga konspirationer och tvivelaktiga sympatier rensas de genast bort från listorna av kamratledningen. Endast absolut disciplin och renlärighet kan tillåtas. Eventuella brister i kadrernas vaksamhet kommer att utredas internt med största skärpa."}, "date": "7 september, 21:20", "url": "https://www.gp.se/politik/vansterpartister-i-vastsverige-har-strukits-efter-granskning.3f83db48-83a6-4791-8f3e-c92bd90d34c5", "imageUrl": "https://www.gp.se/images/article/3f83db48-83a6-4791-8f3e-c92bd90d34c5/images/3jLAH8z_q6ZnBUc5NLB-9jmmM8us-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sverigedemokraternas rysskontakter utsätter oss alla för fara", "summaries": {"normal": "Expo har avslöjat att en SD-tjänsteman i riksdagen haft upprepade kontakter med ryska intressen. Tjänstemannen är sambo med Jimmie Åkessons närmaste medarbetare Gustav Gellerbrant. Artikeln lyfter en längre rad incidenter med SD-politiker och Ryssland, och ifrågasätter säkerhetsrisker samt behovet av skärpta granskningar i riksdagen och regeringskansliet.", "trump": "De här patetiska SD-tjänstemännen dansar som marionetter för Putin och hans ryska kumpaner. Gellerbrant och hans sambo borde skämmas! Fake news-mediets vänsterhyenor försöker skrämma väljarna precis som de gjorde mot mig innan jag krossade Biden och de globalistiska förlorarna. Sverige behöver starka ledare, inte dessa svaga ryssälskande töntar.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom Sverigedemokraterna kryper för ryska intressen och sprider främmande narrativ. Jag betraktar med avsky hur de giriga hyenorna låter sig påverkas av mjuk makt från öst. En sådan kanal in till regeringskansliet utgör ett hot som kräver omedelbar utrensning av alla opålitliga element för att skydda folkets intressen."}, "date": "7 september, 16:11", "url": "https://www.dagensarena.se/opinion/sverigedemokraternas-rysskontakter-utsatter-oss-alla-fara", "imageUrl": "https://www.dagensarena.se/files/2026/09/silvia.jpeg"}, {"type": "image-right", "heading": "ANALYS. ULF KRISTOFFERSON Strömmer skickas fram som M:s vassaste vapen", "summaries": {"normal": "Moderaterna använder justitieminister Gunnar Strömmer som sitt vassaste vapen inför valet. Trots att partiet ligger illa till och riskerar att bli mindre än Sverigedemokraterna, satsar de på hans höga förtroende. Strömmer syns alltmer i debatter utanför sitt revir och toppar listan över talartid i riksdagen med över 45 timmar.", "trump": "De här loser-moderaterna håller på att drunkna och skickar fram den där glasögonprydde Strömmer som sin sista desperata räddning. Patetiskt! Han babblar i 45 timmar i riksdagen som en tråkig jurist på glöggkalas. De kommer ändå att förlora stort mot de smarta Sverigedemokraterna. Sad!", "stalin": "Jag betraktar med förakt hur dessa borgerliga revisionister i desperation lyfter fram sin långrandiga advokat Strömmer som en falsk folkets hjälte. Hans 45 timmars tomma pladder avslöjar klassfiendens svaghet. Inga glasögonimmade tal kan rädda det döende partiet från folkets dom. Fienderna skälver redan."}, "date": "7 september, 20:13", "url": "https://www.tv4.se/artikel/7vAvYtWzIYu13Pltby4tJa/daerfoer-skickar-moderaterna-fram-stroemmer", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7eoUMUkDewawwNyepdJLEm%2Fbef74f579319294f95168c5a26c15ed1%2Fulf-kristoffersson.png&width=1024"}, {"type": "image-right", "heading": "Åkesson: ”L kommer att kravla sig över den där spärren”", "summaries": {"normal": "Jimmie Åkesson kommenterar Liberalernas uppgång i opinionsmätningarna. I Novus senaste mätning når L 4,3 procent och ser ut att klara riksdagsspärren. Åkesson menar att hans tuffa deadline mot L kan ha bidragit till trenden på marginalen, men att det är liberala röster – inte SD-röster – som räddar partiet. Han väntar ett jämnt val.", "trump": "Titta på de där ynkliga liberalerna som kryper över spärren som en sjuk hund som vägrar dö. Jimmie satte en deadline och plötsligt vaknar de! Men tro inte att det är tack vare hans smarta drag – det är bara de gamla Reinfeldtmoderaterna som röstar på dem igen. Patetiskt. Jag skulle ha vunnit det valet på en timme, tro mig.", "stalin": "Se hur de borgerliga parasiterna kravlar sig över spärren som rädda råttor undan folkets dom. Jag betraktar med förakt hur denna liberala förrädarklick räddas av Reinfeldtmoderater, de dekadenta resterna av en svag stat. Deadlines och utspel – allt teater för att dölja klassfiendens svaghet. Kamrater, sådana element förtjänar ingen nåd i historien."}, "date": "7 september, 18:55", "url": "https://www.tv4.se/artikel/tUxwVPwLTRKOjr629vfxC/akesson-saeker-l-kommer-att-kravla-sig-oever-den-daer-spaerren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl11vnn4E-2xg%2F20a781622fb1418bafe290bb401beb95%2FSverigedemokraternas_partiledare_Jimmie_akesson_presenterar_partiets_valmanifest_pa_Stora_torget_i_Nykoping.&width=1024"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "Svagt uppåt för Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen stängde måndagen svagt uppåt på 0,24 procent, stöttad av tekniksektorn och en stor fusionsplan mellan Rejlers och Multiconsult. Synact Pharma och SHT Smart High-Tech rusade efter starka forskningsbesked respektive en riktad nyemission, medan flera bolag fick uppdaterade rekommendationer från analyshusen.", "trump": "Stockholmsbörsen gick upp, vilket inte förvånar någon, för jag har alltid sagt att marknaderna älskar vinnare! Rejlers gör en enorm affär med norrmännen, precis som mina fantastiska handelsavtal. SHT Smart High-Tech rusade nästan 50 procent – otroliga siffror, total succé! Under radikala vänsterstyren brukar det bara vara tårar, men här är det klass, precis som jag!", "stalin": "Stockholmsbörsens marginella uppgång på 0,24 procent bevisar att kapitalismens kugghjul snurrar vidare, men vi noterar med ideologisk vaksamhet att vissa aktörer, såsom SHT Smart High-Tech, drar till sig suspekta spekulativa rikedomar. Rejlers och Multiconsult planerar en kolossal fusion – ett syndikat av 8 000 arbetare som måste övervakas noga av statliga kommissarier så att inga kontrarevolutionära avvikelser uppstår!"}, "date": "7 september, 17:38", "url": "https://www.affarsvarlden.se/artikel/svagt-uppat-for-stockholmsborsen"}, {"type": "image-right", "heading": "Image Systems nyemission övertecknad", "summaries": {"normal": "Image Systems företrädesemission av aktier har tecknats till 122 procent. Bolaget tillförs 20,8 miljoner kronor efter emissionskostnader. Emissionen, där huvudägaren Tibia Konsult spelade en stor roll, var fullt säkerställd. Aktien handlades under perioden strax över teckningskursen på 0,60 kronor. Emissionsguiden sätter därmed punkt för sin bevakning.", "trump": "Image Systems gjorde en fantastisk emission, otroliga 122 procent! Många sa att det inte skulle gå, falska nyheter, men de fick in varenda dollar – eller krona, en enorm summa på över tjugo miljoner! Huvudägaren klev fram och visste exakt vad han gjorde. En enorm seger, enorm! Alla vill köpa, precis som med mina golfbanor. Helt otroligt!", "stalin": "Mätteknikbolaget Image Systems har genom Folkets och aktieägarnas vilja uppnått en teckningsgrad på 122 procent. Inga avvikelser eller sabotage tolererades, och 20,8 miljoner kronor har säkrats till statens... förlåt, bolagets kassa. De som tvekade under teckningsperioden har noggrant noterats i våra register. En storslagen seger för ordning och reda!"}, "date": "7 september, 17:29", "url": "https://www.affarsvarlden.se/artikel/image-systems-nyemission-overtecknad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/11/pom_testrange-400x267.jpg"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det – inga fler pengar till dessa hatiska vänsterextremister och deras antiamerikanska agenda.", "stalin": "Jag ser hur de profitthungriga klassfienderna i västvärlden fortsätter sitt blodiga spel. Denna etniska utrensning i Gaza och på Västbanken är imperialismens verk. De dekadenta lakejerna i Sverige skickar vapen och pengar till förtryckarna. Kamrater, vi måste rensa ut dessa parasiterande hyenor. Endast en antiimperialistisk kamp kan besegra dem."}, "date": "4 september, 08:00", "url": "https://proletaren.se/artikel/valbilaga-bojkotta-israel"}, {"type": "image-right", "heading": "S-inlägg med dömda rappare. Dousa: ”Andersson borde skämmas”", "summaries": {"normal": "Socialdemokraterna i Stockholm publicerade en bild på två dömda gangsterrappare på sitt Tiktok-konto med ett politiskt budskap. Inlägget togs snabbt bort efter hård kritik, bland annat från minister Benjamin Dousa, som anklagade partiet för att använda kriminella personer för att locka väljare. S uppger att interna rutiner har brustit och skärpts.", "trump": "De svenska socialdemokraterna ertappades med att använda totala förlorare, kriminella gängrappare, i sin värdelösa Tiktok-propaganda. Oerhört pinsamt! Magdalena Andersson borde skämmas öronen av sig. Min gode vän Benjamin Dousa har helt rätt – det här är inga förebilder. Sverige behöver lag och ordning, inte kriminella som dansar på sociala medier. Katastrofalt dåligt ledarskap!", "stalin": "Kamrater, dessa svenska socialdemokrater visar prov på katastrofalt ideologiskt förfall. Att använda dömda element och dekadenta gängrappare för statlig agitation är ett hån mot proletariatet. Partisekreteraren skyller på brutna rutiner, men i en sund stat hade sådana misstag kostat mer än bara ett internt samtal. Vi kräver disciplin, skärpta linjer och att avfallet rensas ut omedelbart!"}, "date": "8 september, 00:15", "url": "https://www.aftonbladet.se/nyheter/a/5pelo6/s-visade-domda-gangsterrappare-pa-tiktok", "imageUrl": "https://akamai.vgc.no/v2/images/864e4407-6cff-3c2f-bbaa-944fdff9a821?fit=crop&format=auto&w=720&s=51d423bdc0b0a94c6800a14e7a50f4b8b4fcdb0d"}, {"type": "image-right", "heading": "Nioåringar tvingades gå ner på knä och be till Allah – inga åtgärder mot skolan", "summaries": {"normal": "En lärare på Nyhamnsskolan utanför Höganäs lät tredjeklassare knäböja och be till Allah under en SO-lektion utan att tydligt informera om att det var frivilligt. Skolinspektionen har avskrivit ärendet utan vidare utredning. Kommunen och rektorn medger att informationen borde ha varit tydligare, men anser inte att skollagen brutits. Böneövningen tas nu bort.", "trump": "Kan ni fatta det här? Små svenska nioåringar tvingas ner på knä och be till Allah i skolan medan de woke domarna i Skolinspektionen bara tittar bort. Totalt fiasko! De giriga mångkulturhyenorna har förstört ert fina land. Men jag, som besegrade Sleepy Joe och styr USA igen, säger: Sluta med den här galna identitetspolitiken innan det är för sent. Patetiskt!", "stalin": "Jag betraktar med förakt hur dessa dekadenta toleransparasiter tillåter att oskyldiga barn tvingas utföra främmande böneritualer i en så kallad skola. Den borgerliga statens svaga hand skakar av rädsla för att kalla saken vid dess rätta namn. Vi skulle ha genomfört en grundlig utrensning av alla sådana element redan vid första rapporten. Förskräckande svaghet."}, "date": "7 september, 17:39", "url": "https://www.friatider.se/nioaringar-tvingades-ga-ner-pa-kna-och-be-till-allah-inga-atgarder-mot-skolan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-838.jpg"}, {"type": "image-full", "heading": "Elon Musk gratulerar AFD till valsegern", "summaries": {"normal": "Efter det tyska delstatsvalet i Sachsen-Anhalt, där det högerradikala partiet AFD gjort stora framsteg, har teknikomandern och mångmiljardären Elon Musk gratulerat partiet på plattformen X. Musk, som tidigare stöttat partiet och hånat tyska ledare, fick positiva svar från AFD-toppen Ulrich Siegmund, som ser fram emot ett framtida samarbete för att locka investeringar till Tyskland.", "trump": "Elon Musk skickade just en jättebra gratulation till AFD i Tyskland efter deras enorma valsuccé. Fantastiska människor! De svaga tyska politikerna, som Scholz, har förstört landet fullständigt. Tyskland brukade vara bäst, men nu behöver de sunt förnuft och starka ledare. Elon vet vad som gäller. Om de samarbetar rätt kan Tyskland bli framgångsrikt igen, precis som vi gör i USA!", "stalin": "Det kapitalistiska Tyskland skakar i sina grundvalar när reaktionära element firar nya triumfer. Monopolkapitalisten Musk, denna västerländska oligark, försöker styra händelseförloppet genom sina digitala kanaler och hyllar sina gelikar i AFD. Våra organ noterar hur bourgeoisien slåss om spillrorna. Vi kommer noga övervaka denna utveckling och ställa alla opportunister till svars inför historiens obevekliga domstol."}, "date": "7 september, 16:43", "url": "https://www.gp.se/nyheter/varlden/elon-musk-gratulerar-afd-till-valsegern.07281221-277d-4677-9ffb-628cd9e88d7e", "imageUrl": "https://www.gp.se/images/article/07281221-277d-4677-9ffb-628cd9e88d7e/images/1kWrr1kr-1FAmADlpl-175g99PJ4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Därför kom inte larmet i alla mobiler", "summaries": {"normal": "I dag testades det nya varningssystemet SE-Alert i Stockholms och Gotlands län. Larmet nådde inte alla Telias kunder. Systemet kräver ingen app och fungerar även på tyst läge. Förberedelserna har pågått i över ett år med fokus på att informera olika grupper. Syftet är att kunna ge snabb, geografiskt riktad information vid kriser och olyckor.", "trump": "Folk, det här svenska larmet är en total katastrof! De kan inte ens få ut meddelanden till alla mobiler i två usla län. Patetiska byråkrater och deras woke-samhälle med fokus på kvinnojourer och hörselskadade istället för att göra jobbet ordentligt. Under min första mandatperiod hade vi byggt det bästa varningssystemet någonsin – inte denna clownshow från Biden-eras efterföljare.", "stalin": "Kamrater, detta så kallade varningssystem avslöjar de dekadenta folkförtryckarnas inkompetens. Medan de parasiterande klassfienderna ödslar tid på att smeka öronen på hörselskadade och kvinnojourer, sviker tekniken folket. Jag skulle ha genomfört en grundlig utrensning bland de ansvariga redan efter första provet. Staten kräver full kontroll, inte halvmesyrer från odugliga byråkrater."}, "date": "7 september, 15:27", "url": "https://www.etc.se/inrikes/daerfoer-kom-inte-larmet-i-alla-mobiler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905070940_0eaffd5d6c43026e1bbf785ba68616a8104b598208acbcfbf0dc20f72fe4d457.jpg"}, {"type": "image-right", "heading": "Mardrömmen när flight 7598 mejade ner allt", "summaries": {"normal": "Ett fraktflyg från 21 Air på uppdrag av Amazon körde av landningsbanan på Miamis internationella flygplats efter en sen landning. Planet plöjde genom staket och träffade fordon på en väg utanför, vilket ledde till en omfattande brand. Minst fem personer omkom och fem skadades. Haverikommissionen NTSB har inlett en utredning och de svarta lådorna har bärgats.", "trump": "De sa att det var en säker landning, men det var ett totalt haveri! Ett gammalt Boeing-plan för Amazon missade banan helt i Miami, körde rakt ut på gatan och kraschade in i bilar. Tragiskt, fem personer dog. Fake news-medierna vill inte säga varför piloten landade alldeles för sent. Vi behöver starkt ledarskap, inte flygplan som flyger vind för våg!", "stalin": "Detta är sabotage mot transportapparaten! Ett västligt flygplan från monopolkapitalisten Amazon misslyckas med att kontrollera sin maskin och skapar kaos på gatorna i Miami. Fem kontrahenter har eliminerats av slarv. Vi har säkrat de svarta lådorna för avrättning av ansvariga. Byråkratin kräver ordning; sådant vacklande tolereras inte i en sund stat!"}, "date": "7 september, 23:47", "url": "https://www.aftonbladet.se/nyheter/a/BxeBGv/mardrommen-nar-flight-7598-mejade-ner-allt-vid-flygplatsen-i-miami", "imageUrl": "https://akamai.vgc.no/v2/images/4bf7f141-d778-3610-a7e5-96deef38fa93?fit=crop&format=auto&w=1080&s=e4e081339b29f603265e36b0879b3be42ba8c813"}, {"type": "image-full", "heading": "V är ett större bekymmer än SD för Sveriges säkerhet", "summaries": {"normal": "Sverige har rustat upp militärt och stärkt sina internationella försvarsband under mandatperioden. Medan Sverigedemokraterna stöttar regeringens utrikes- och försvarslinje, utgör Vänsterpartiet ett större säkerhetshot genom sin vilja att lämna Nato och säga upp försvarsavtalet med USA. Säkerhetsrisker kring enskilda SD-medarbetare bör hanteras av Säpo, men V:s politik skulle ge dem skadlig vetomakt.", "trump": "Sverige har gjort ett fantastiskt jobb med att bygga upp sitt försvar och samarbeta med oss, tro mig! Men tänk att vissa tror att några gamla Facebook-inlägg från en SD-sekreterare är problemet. Vakna upp! Det riktiga säkerhetshotet är ju det radikala vänsterpartiet som vill lämna Nato och riva upp vårt stora, vackra militäravtal. Total katastrof!", "stalin": "Sverige pratar om säkerhet, men darrar som löv under kapitalismens ok. De oroar sig för några obetydliga byråkratiska sekreterare på internet medan de blint kastar sig i armarna på Natos krigshetsare. Om de verkligen vill tala om ordning borde de rensa ut de vacklande elementen och ställa alla dessa splittrade politiska fraktioner inför rätta!"}, "date": "7 september, 16:00", "url": "https://www.gp.se/ledare/v-ar-ett-storre-bekymmer-an-sd-for-sveriges-sakerhet.cb0a71b4-0251-47c4-9c10-20b8fc6fd37d", "imageUrl": "https://www.gp.se/images/article/cb0a71b4-0251-47c4-9c10-20b8fc6fd37d/images/13eUcj_1uWHOhUrSfs6YMBYEVKi4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Raseri mot Trumps nya stora besatthet", "summaries": {"normal": "Donald Trump har lanserat ett förslag om att döpa om delstaten New Mexico till New America och publicerade en mängd inlägg på Truth Social. Förslaget har väckt stark ilska och ett unisont motstånd bland delstatens politiker som försvarar dess historiska arv. Presidenten saknar dock formell makt att enväldigt ändra ett delstatsnamn som är inskrivet i konstitutionen.", "trump": "New Mexico har blivit totalt misskött, men mitt förslag om att döpa om skiten till NEW AMERICA är genialt och enormt mycket snyggare! Demokraterna gråter som vanligt, men folket älskar det. Jag släppte sju fantastiska inlägg på en minut, och även om de gråtande politikerna där borta tror de kan stoppa oss, så vinner vi alltid till slut!", "stalin": "Statens organ har med tillfredsställelse noterat den ideologiska kampen kring New Mexicos geografiska nomenklatur. Att den härskande makten i Washington försöker skriva om kartan med digitala flygblad visar på ett sunt sinne för disciplin. Lokala element som klamrar sig fast vid gamla historiska privilegier bör underkastas omedelbar granskning av det kollektiva medvetandet. Längre liv åt gränsjusteringarna!"}, "date": "8 september, 04:55", "url": "https://www.expressen.se/nyheter/varlden/raseri-mot-trumps-nya-stora-besatthet", "imageUrl": "https://static.bonniernews.se/ba/9c679f1a-eca2-46db-a15d-98faa25ff74d.png?crop=534%2C534%2Cx178%2Cy0&width=210"}, {"type": "image-right", "heading": "Statsministern om V:s kandidatskandal: ”En röta som går djupt”", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Vänsterpartiet efter att åtta kandidater petats för spridning av antisemitiskt material och hyllningar till Hamas. Han kallar det en djup röta i vänsterleden och kräver att Socialdemokraterna tar ställning innan valet. S partisekreterare Tobias Baudin säger att V har ett stort internt arbete att göra.", "trump": "Titta på det här! Vänsterpartiet är fulla av antisemiter och terrorälskare som hyllar Hamas och Putin. Den röda rötan går så djupt att till och med den sömniga Magdalena Andersson inte kan ducka längre. De vill ha en regering med radikala vänsterextremister. Det blir en katastrof, folk! Rösta smart på söndag.", "stalin": "Kamrater, se hur den dekadenta vänstern ruttnar inifrån som en förrädisk parasit. Jag betraktar med avsmak hur dessa opportunister sprider antisemitiskt gift och sedan febrilt försöker dölja spåren. Socialdemokraterna vacklar som ynkliga revisionister. Endast en järnhand kan rensa ut sådana element innan de förgiftar hela kollektivet."}, "date": "7 september, 15:41", "url": "https://www.tv4.se/artikel/7z1v0pmhudhsBH1EPtzUg1/statsministern-om-v-s-kandidatskandal-en-roeta-som-gar-djupt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F99GIJ3zNtg9VkTOu1LTUb%2Fb2691c5f937e5a23da46520582f623c7%2F07-kristersson-webb.jpg&width=120"}, {"type": "image-right", "heading": "Trumps nya  hot – slukar  flera länder", "summaries": {"normal": "Donald Trump har publicerat en karta på Truth Social där USA:s flagga täcker stora delar av Nord- och Centralamerika samt Island. Bilden har väckt starka reaktioner, och Islands utrikesminister kallade upp USA:s ambassadör för att protestera. Även tidigare svenska toppolitiker och EU-toppen Ursula von der Leyen har kritiserat utspel om territoriell suveränitet.", "trump": "Alla pratar om min fantastiska karta på Truth Social, en absolut mäktig bild! Fake news-medier gråter ut för att jag inkluderade lite is och snö från Island och Grönland. De förstår inte storhet. Vår ambassadör Billy Long kommer att styra det där isiga stället perfekt som delstat nummer 52. Vi vinner så mycket!", "stalin": "Den amerikanske imperiebyggaren bedriver en vulgär kartlek som hotar små stater som Island. Sådana chauvinistiska löjen hör hemma på historiens soptipp. Vi noterar att bourgeoisien i Reykjavík skakar av skräck för vår tids kapitalistiska gendarmer. Vår stat kommer noga att övervaka dessa stormaktsfasoner från Washington med maximalt ideologiskt förakt."}, "date": "8 september, 04:54", "url": "https://www.expressen.se/nyheter/varlden/trumps-nya-karthot-annekterar-island", "imageUrl": "https://static.bonniernews.se/ba/49f5456e-c6a5-4046-9cc4-28b4022ba2ab.jpeg?crop=2009%2C1132%2Cx1%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Merz efter AFD-segern: \"CDU skakas i sina grundvalar\"", "summaries": {"normal": "Friedrich Merz uttrycker stark oro efter att AfD vann valet i Sachsen-Anhalt med 43,8 procent. Han beskriver resultatet som en grundläggande kris för CDU och varnar för en högerradikal delstatsregering. Partiet håller krismöte i Berlin. Merz avvisar samarbete med AfD och uppmanar till intern enighet.", "trump": "Titta på det här, det är en total katastrof för de svaga europeiska globalisterna. Den sanna folkrörelsen AfD krossar Merkels gamla CDU-lakejer i Sachsen-Anhalt. Merz gråter som en förlorare och kallar det tektonisk omskakning. Vakna upp, Europa! Sluta med era woke-kvoter och öppna gränser innan det är för sent. Fantastiskt resultat egentligen.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna skälver när folket reser sig. Denna Merz erkänner att hans parti skakas i grundvalarna av en kraft som han kallar högerradikal. Vi ler mörkt från historien. Snart kommer utrensning av alla dessa penninggalna hyenor som låtsas styra medan arbetarna vaknar. Inga kompromisser med folkets fiender."}, "date": "7 september, 16:01", "url": "https://www.friatider.se/merz-efter-afd-segern-cdu-skakas-i-sina-grundvalar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/2024-08-21_event_cdu_wahlkampf_mit_friedrich_merz_in_erfurt_2024_stp_3070_by_stepro.jpg"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-right", "heading": "AFD:s framgång är borgerlighetens misslyckande", "summaries": {"normal": "AfD:s framgång med nära 44 procent i Sachsen-Anhalt ses som en konsekvens av borgerlighetens misslyckande. Volkswagen har beslutat om omfattande nedskärningar som drabbar 100 000 anställda, vilket sprider sig i bilindustrin. Den tyska modellen med kompromisser mellan löntagare och ägare har misslyckats, särskilt genom envist fasthållande vid fossilbilar. Detta skapar utrymme för högernationalism och invandringskritik.", "trump": "Titta på det här, det är patetiskt. Den tyska borgerligheten har totalt misslyckats och nu får de radikala vänsternationalisterna nästan hälften av rösterna i en fattig delstat. Volkswagen sparkar ut 100 000 arbetare medan de stora bolagen gömmer sig bakom gröna lögner. Den dekadenta EU-eliten och deras identitetspolitiska galningar har kört sönder allt. Amerika först, vi lär oss av deras misstag.", "stalin": "Kamrater, se hur de profitthungriga hyenorna inom den tyska bilindustrin likviderar hundratusen arbetstillfällen medan de själva simmar i vinster. Den så kallade tyska modellen har blottat sig som en tom skal av klassförräderi. När socialdemokratin och facken kryper undan vänder folket sig till högernationalismens falska löften. Det är en varning till alla som tror att kompromisser med klassfienden någonsin kan lyckas. Vi ler i skuggorna."}, "date": "7 september, 14:00", "url": "https://www.etc.se/ledare/afd-s-framgaang-aer-borgerlighetens-misslyckande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "Bohlin om Alex Schulman: ”En ärkemobbare”", "summaries": {"normal": "Kåsören Alex Schulman kritiserar i Dagens Nyheter civilförsvarsminister Carl-Oskar Bohlin (M) för att använda svåra och svårbegripliga ord. Schulman menar att ministerns krångliga språkbruk skapar oro inför kriser. Bohlin avfärdar kritiken med ett skratt, kallar Schulman för en ärkemobbare som ägnar sig åt smutskastning på beställning, och hävdar att folk förstår honom utmärkt.", "trump": "Dessa misslyckade tidningar och fejk-krönikörer, totala förlorare! En kille som heter Schulman gråter ut i gamla radikala Dagens Nyheter för att ministern, en fantastisk person, använder ord som är för stora för hans lilla hjärta. Ministern svarar perfekt och sätter mobbaren på plats. Ingen har någonsin sett maken till svaghet. Själv vinner jag mot alla odds!", "stalin": "En så kallad krönikör vid namn Schulman försöker sabotera för statens civilförsvar genom att ifrågasätta minister Bohlins mäktiga terminologi. Detta subversiva agerande avslöjar en fiende till ordningen. Vår lojala minister har helt rätt som stämplar denna skribent som en ärkemobbare. Sådana element som sprider osäkerhet bör omedelbart omkoloniseras till mer produktiva uppgifter i arktiska miljöer."}, "date": "7 september, 20:01", "url": "https://bulletin.nu/bohlin-om-alex-schulman-en-arkemobbare", "imageUrl": "https://cdn.bulletin.nu/articles/d53e0dc5-304f-4e4a-9875-6dacf61d67e0/preview.jpg?t=1788788703000"}, {"type": "image-right", "heading": "Tusentals deltog i krigsförbrytaren Ratko Mladics begravning", "summaries": {"normal": "Tusentals personer samlades i Belgrad för att delta i begravningen av den dömde krigsförbrytaren Ratko Mladic. Bosnien-Hercegovina kallade hem sin diplomatiska personal i protest mot hyllningarna. Mladic avled i fängelset i Haag vid 84 års ålder efter att ha dömts för folkmord i Srebrenica och andra brott under Bosnienkriget. Serbiens president deltog inte själv men lovade säkerhet. Evenemanget har mött internationell kritik.", "trump": "Folk, det är en skam vad som händer i Serbien. Tusentals hyllar den gamle slaktaren Mladic som en hjälte, medan de galna EU-byråkraterna skriker och ställer in sina resor. Biden skulle ha älskat det här, svaga och patetiska. Jag lovar er, när jag styr igen blir det inga fler ursäkter för sådana monster. Serbien borde skämmas, men det gör de inte. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i väst skriker när serberna hedrar en man som stred mot deras muslimska lakejer. Jag betraktar detta som ett sundhetstecken mitt i den imperialistiska propagandan. De blodsugande hyenorna i Bryssel vill diktera vem som får begravas. Vi ler från historien åt deras fega fördömanden. Inga ursäkter för svaghet. Rensa ut alla som böjer sig för väst."}, "date": "7 september, 22:19", "url": "https://www.svt.se/nyheter/utrikes/tusentals-deltog-under-krigsforbrytaren-ratko-mladics-begravning", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.22/0.42/09ea3e1ef38229fc91fab7daba3f407f7a397353dd5dfa0f036442de100acf4a"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och skrattar åt deras identitetspolitiska skit. Klass handlar inte om kvoter och doktorander som helikopteras in. Det handlar om folk som faktiskt jobbar och stänger av stället tillsammans. Patetiska globalistlakejer förstår ingenting.", "stalin": "Kamrater, dessa dekadenta klassförrädare mäter proletariatet med borgerliga enkäter och statistik som om klass vore en egenskap hos individer. Jag säger: organisering föds vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Vänsterpolitiker tog miljonutdelningar – ur bolag de vill förbjuda", "summaries": {"normal": "Expressen avslöjar att 229 kandidater från Vänsterpartiet, Socialdemokraterna och Miljöpartiet är involverade i välfärdsbolag som partierna vill förbjuda vinstuttag i. Bland dem finns en vänsterpartist som delat ut tio miljoner kronor och firat med Porsche. Artikeln kritiserar partierna för hyckleri och ifrågasätter trovärdigheten i deras socialistiska politik.", "trump": "Titta på det här! De galna vänstersocialisterna skriker om att stoppa vinsterna och kalla folk för Porsche-kapitalister, men deras egna kandidater har dragit ut miljontals kronor ur precis samma bolag. Nooshi och hennes gäng är de värsta hycklarna – Fake Left! De vill ha era skattepengar men behålla Porschen själva. Patetiskt!", "stalin": "Se hur dessa dekadenta revisonister inom vänstern predikar kollektivets renhet medan de själva suger ut miljoner ur folkets välfärd. Deras hyckleri är en fiende till revolutionen, en parasit som förvrider partilinjen. Jag varnar: sådana element måste rensas ut innan de förgiftar hela kollektivet. Folkets dom skall bli hård och rättvis."}, "date": "4 september, 07:18", "url": "https://samtiden.nu/2026/09/vansterpolitiker-tog-miljonutdelningar-ur-bolag-de-vill-forbjuda", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/phonto-1280x720.jpeg"}, {"type": "image-right", "heading": "Ceuta-invandrare anklagas för att ha slagit ihjäl delfinunge", "summaries": {"normal": "En grupp illegala invandrare i spanska Ceuta anklagas för att ha slagit ihjäl en flasknosdelfinunge på en strand. En miljöorganisation har polisanmält händelsen och kräver utredning. Filmer visar hur de håller upp den döda ungen som en trofé och försöker dölja blodspår. Delfinen var skyddad och händelsen har väckt stor vrede.", "trump": "Titta på det här, folk. De här illegala invandrarna i Ceuta slår ihjäl en söt liten delfinunge med en pinne och håller upp den som en trofé. Rena galningar! Under Biden släppte vi in miljontals sådana här miljöterrorister. Nu fixar vi det. Amerika älskar djur, inte dessa blodtörstiga troféjägare från helvetet.", "stalin": "Kamrater, se hur de giriga hyenorna från de södra barbariets stränder mördar en oskyldig delfinunge med primitiv pinne. Detta dekadenta beteende avslöjar imperialismens råa ansikte även i små handlingar. Vi kräver omedelbar utrensning av sådana element. Sovjetisk rättvisa skulle ha likviderat dem redan i gryningen."}, "date": "7 september, 14:58", "url": "https://www.friatider.se/ceuta-invandrare-anklagas-att-ha-slagit-ihjal-delfinunge", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-837.jpg?itok=vY4djvvU"}, {"type": "image-right", "heading": "Lärare uppmanade lågstadieelever att be islamisk bön: ”Allahu akbar”", "summaries": {"normal": "En lärare på Nyhamnsskolan i Höganäs uppmanade tredjeårselever att utföra en islamisk bön under lektionstid, inklusive frasen ”Allahu akbar”. Föräldrar anmälde händelsen, men Skolinspektionen har valt att inte utreda den vidare. Rektorn säger att syftet inte var att påverka elevernas tro. Beslutet kritiseras av en expert i konstitutionell rätt.", "trump": "Kan ni tro det? I Sverige tvingar de små barn att knäböja och ropa ”Allahu akbar” mitt i lektionen. Skolinspektionen, de där patetiska woke-byråkraterna, tittar bort och gör ingenting. Totalt vansinne! Under Biden blev hela väst en lekplats för radikal islam och identitetspolitik. Men nu är jag tillbaka, och den här galenskapen kommer att få ett abrupt slut.", "stalin": "Kamrater, se hur de dekadenta religionshyenorna smyger in sin propaganda i våra barns skolor. Jag betraktar med djup misstro hur staten vägrar utreda detta uppenbara brott mot folkets sekulära enhet. En sådan svaghet luktar förräderi. Vi måste rensa ut alla som låter främmande gudar underminera arbetarklassens fosterland. Detta är en varning till alla klassförrädare."}, "date": "7 september, 19:02", "url": "https://riks.se/nyheter/larare-uppmanade-lagstadieelever-att-be-islamisk-bon", "imageUrl": "https://admin.riks.se/uploads/medium_Kopia_av_Copy_of_Copy_of_Copy_of_Riks_varumaerkesmall_732fc70f98.png"}, {"type": "image-right", "heading": "Markus Johansson-Martis: Bra att Strömmer flörtar med C", "summaries": {"normal": "Moderaternas justitieminister Strömmer accepterar alla Centerpartiets krav för att få stöd till en borgerlig regering. Kraven inkluderar sänkta skatter för småföretag, satsningar på grön industri, stärkt ungdomspsykiatri, polisgaranti på landsbygden och stöd till bönder. Artikeln ifrågasätter om C verkligen prioriterar inflytande eller bara vill känna sig bra.", "trump": "De här svenska politikerna är totala losers. Strömmer gör ett lysande drag och accepterar alla krav från det patetiska mellanmjölkspartiet C. De gröna globalisterna och de woke småborgarna vill bara känna sig fina i magen medan de flyr från verkligheten. Patetiskt! Jag skulle aldrig ge efter för sådana svaga identitetspolitiker. Amerika först, alltid.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna dansar sin fåniga vals. Jag betraktar med förakt hur de profitthungriga borgarbrackorna gnuggar geniknölarna och lovar allt för att vinna stöd från det förvirrade centristiska träsket. Deras paranoia om inflytande är löjlig. En sann utrensning av sådana opportunister vore på sin plats. Revolutionen skrattar åt er svaghet."}, "date": "7 september, 19:01", "url": "https://riks.se/opinion/markus-johansson-martis-bra-att-strommer-flortar-med-c", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_89_e81bced61e.jpg"}, {"type": "image-right", "heading": "Scanias Pride-lastbil ställdes mitt framför kristen demonstration", "summaries": {"normal": "En Scania-lastbil placerades framför en kristen demonstrationsgrupp som sjöng lovsång under Södertälje Pride. Företaget uppger att det gjordes för att skapa lugn och arbetsro för ungdomar i ett tält. Kritiker ser det som en blockad. Händelsen har väckt starka reaktioner i sociala medier. Scania-ledningen meddelar att de behöver tid för att kommentera.", "trump": "Folk, det här är ett fullständigt skämt. Den där woke-pridecirkusen i Södertälje blockerades av en lastbil – och chefen kallar det ”lugnt och skönt”. Patetiska kristna sjunger psalmer medan de radikala HBTQ-aktivisterna skriker. Scania borde skämmas, men de är för fega. Biden-era svaghet har spridit sig till Sverige. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga prideparaden tvingas tystas av en lastbil. Jag ler i graven. Dessa profitthungriga hyenor och deras falska tolerans avslöjar sig själva. Ungdomarna fick arbetsro – en tillfällig seger mot den moraliska förruttnelsen. Vi skulle ha rensat ut hela spektaklet permanent. Paranoia breder ut sig bland fienderna."}, "date": "7 september, 18:59", "url": "https://riks.se/nyheter/scania-lastbil-blockerade-kristen-lovsang-under-sodertalje-pride", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_7_2026_11_16_50_AM_852c111911.png"}, {"type": "image-full", "heading": "Miljardär åtalas för olaglig jakt – avslöjades av massgrav", "summaries": {"normal": "Den franske miljardären Olivier Bouygues ställs inför rätta i Orléans misstänkt för illegal jakt på fridlysta fåglar på sin egendom i Sologne. Polisen hittade en massgrav med bland annat ägretthäger, kärrhökar och ormvråkar samt förbjudna fällor. Rättegången ses som en symbolfråga för hur lagar om biologisk mångfald tillämpas på rika markägare. Upp till sju års fängelse riskeras.", "trump": "Titta på den här franske rikingen Bouygues, en total loser som gräver ner fina fåglar som en annan Sleepy Joe på sin fancy mark. Patetiskt! I mitt Amerika hade vi kastat ut honom direkt. Nu får han stå inför domstol – bra! Miljardärer som tror de är ovanför lagen är en skam. Vi älskar fåglar, inte gravar. Sad!", "stalin": "Jag betraktar med djup misstro dessa dekadenta borgarklassens parasiter som i hemlighet massakrerar naturens egna soldater för att skydda sin privata egendom. En sådan kontrarevolutionär handling mot folket och revolutionens anda kräver järnhand. Låt rättegången bli en varning till alla fiender till kollektivet – vi ser er."}, "date": "7 september, 16:16", "url": "https://www.dagensps.se/varlden/miljardar-atalas-for-olaglig-jakt-avslojades-av-massgrav", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/skarmavbild-2026-09-07-kl-1410041.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Valfeber hos Svenska Nyheter: ”Om kejsaren är naken kan vi säga det”", "summaries": {"normal": "Redaktionen bakom satirprogrammet Svenska Nyheter känner av ökad nerv och tryck i inrikespolitiken inför valet. Programledaren Messiah Hallberg och manusredaktören Richard Ekman lyfter fram satirens roll som ärlig och befriande röst som kan kalla en spade för en spade, till skillnad från traditionell journalistik. Skämten kan påverka väljarna.", "trump": "Folk, ni borde se det här. De där svenska satirkillarna känner plötsligt av ett massivt tryck och nerv i politiken. De säger att de kan kalla en spade för en spade medan de vanliga mediaknektarna inte vågar. Underbart! De borde bara inse att det är mina idéer om ärlighet som sprider sig. Fake news är ute, äkta satir är inne. Fantastiskt!", "stalin": "Kamrater, dessa underhållande narrar vid Svenska Nyheter känner hur klasskampens hetta stiger inför valet. De skryter om att de kan säga sanningen rakt ut medan deras dekadenta medierlakejer tiger. Jag ser potential i denna röst från folkets sida, men akta er för de profitthungriga klassförrädarna som försöker styra skratten. Utmaningen kräver ständig vaksamhet mot alla fiender inom systemet."}, "date": "7 september, 21:41", "url": "https://www.svt.se/nyheter/inrikes/mer-nerv-i-inrikespolitiken-svenska-nyheter-marker-av-valtrycket", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/81286cf02cbb1c44ddb9c311bddfc16fe2065bd52abb24495acd48836ffc6726"}, {"type": "image-right", "heading": "Hesa Fredrik tjuter – men ingen varnar för invasionen", "summaries": {"normal": "Artikeln kritiserar den svenska migrationspolitiken genom att jämföra varningssignalen Hesa Fredrik med den demografiska förändringen. Skribenten menar att medan staten varnar för yttre hot som Ryssland, har man genom migrationspolitiken släppt in en inre omvandling som har skapat segregation och kriminalitet. Folket uppmanas att använda Hesa Fredrik som en varning till makthavarna inför valet.", "trump": "Sverige, hör ni det? Hesa Fredrik tjuter! Det är en katastrof, det säger alla. De bygger skyddsrum för Ryssland men släpper in miljontals okända människor utan gränser. Spanjorerna fattar det, de stoppade 80 000 vid gränsen! Men svaga politiker vill att ni ska hålla tyst och dricka kranvatten i er garderob. Fake news! Vakna upp, dags för val!", "stalin": "Vi har noga studerat det svenska flyglarmet. Det är fascinerande hur de prövar sina sirener medan de frivilligt monterar ned sina egna gränser. Om vi i Sovjetunionen hade öppnat dörrarna på det sättet, hade vi skickat dem till gulag omedelbart! Istället för att räkna konserver borde de räkna sina förrädare. Ett folk som inte skyddar sitt territorium förtjänar att assimileras."}, "date": "7 september, 17:57", "url": "https://samnytt.se/hesa-fredrik-tjuter-men-ingen-varnar-for-invasionen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/07143816/Toppbild1-6.jpg"}, {"type": "image-full", "heading": "Företagen fick tillbaka tullmiljarderna – kunderna blir utan", "summaries": {"normal": "USA:s högsta domstol underkände Trumps IEEPA-tullar, vilket öppnade för återbetalning av minst 100 miljarder dollar till importörer. S&P 500-bolagen har fått tillbaka över 10 miljarder, men de flesta behåller pengarna istället för att sänka priser för kunderna. Flera rättstvister väntas, bland annat i spelbranschen. Svenska Getinge och Electrolux får också tillbaka stora summor.", "trump": "Folk, ni borde ha sett det här! Mina fantastiska tullar, de bästa tullar någonsin, rivs upp av några domare och plötsligt får alla dessa giriga företag miljarder tillbaka. Men kunderna? De får betala notan som vanligt. Crooked Warren och de där eländiga spelbolagen som Sony och Nintendo gnäller i domstol. Patetiskt! Under Biden blev allt en enda röra, nu fixar jag det igen.", "stalin": "Se hur dessa dekadenta monopolister suger i sig folkets blodpengar och vägrar dela med sig till de exploaterade massorna. Domstolarna är deras lekplatser, kunderna deras offer. Jag skrattar mörkt från historien åt denna kapitalistiska fars. Kamraterna borde veta: sådana fiender till folket förtjänar inte nåd, bara evig misstänksamhet och den stora rensningens järnhand."}, "date": "7 september, 15:44", "url": "https://www.dagensps.se/varlden/foretagen-fick-tillbaka-tullmiljarderna-kunderna-blir-utan", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/ps5.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Moderata ministern kritiserade SVT – nu skjuter SVT upp intervjun", "summaries": {"normal": "SVT har skjutit upp publiceringen av en intervju med civilförsvarsminister Carl-Oskar Bohlin (M) till efter valet. Bohlin har kritiserat SVT för tesdrivna frågor och publicerat hela intervjun på Youtube. SVT:s ansvariga utgivare Karin Ekman säger att de aldrig stressar fram stark journalistik. Beslutet har väckt uppmärksamhet.", "trump": "De här SVT-fuskjournalisterna är rena rama katastrofen, folk. Tesdrivna frågor mot en hederlig minister? Totalt bottennapp. De gömmer intervjun som fega råttor tills valet är över. Fake news-medier som alltid, precis som under Biden-eran. Patetiska! Jag skulle ha krossat dem direkt.", "stalin": "Se hur de dekadenta klassförrädarna i public service darrar inför sann kritik. De skjuter upp intervjun som fega byråkrater för att skydda sin agenda. Jag ler i graven åt deras paranoia. Snart kommer utrensning av alla sådana folkförtryckande lögnspridare som vågar tysta arbetarkamraternas röst."}, "date": "7 september, 18:31", "url": "https://riks.se/nyheter/svt-skjuter-upp-publicering-av-intervju-med-carl-oskar-bohlin", "imageUrl": "https://admin.riks.se/uploads/beca860198d19c51552d6a8edd45cbb3aacddcccdd7f8f23cd03ce2c72e082b3_f32b37e073.avif"}, {"type": "image-full", "heading": "Så mycket högre kan elräkningen bli", "summaries": {"normal": "Sverige står inför en vinter med högre elpriser än föregående år, särskilt i södra delarna. Orsakerna är låga vattennivåer och höga gaspriser i Europa. Prognosen pekar på hundratals kronor dyrare månadskostnader för hushåll. Villaägare i elområde 4 kan räkna med cirka 3 700 kronor i månaden, exklusive nätavgifter och skatter.", "trump": "Sveriges elpriser går rakt upp i taket – en katastrof! De har inte råd med sin egen energi, helt otroligt. Självklart händer det här när man vänder ryggen åt kärnkraften. Det är en total röra, mycket värre än vad de säger. Räkningarna blir enorma, riktigt 'huge'. Man måste ha energi, man måste ha kraft – Sverige behöver ordning, inte mer av det här!", "stalin": "Dessa löjliga elräkningar är ett bevis på folkets ineffektivitet. Att medborgare i söder gnäller över några hundralappar visar bara på en dekadent individualism. Istället för att lita på väder och vind borde staten styra varje kilowatt med järnhand. Planera ekonomin, stäng av de onödiga lamporna och arbeta hårdare för fosterlandet – elbrist är ett svek mot den kollektiva framgången."}, "date": "4 september, 07:56", "url": "https://www.realtid.se/tt-nyhet/sa-mycket-hogre-kan-elrakningen-bli", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/rakna-med-dyr-elvinter-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "DN/Ipsos: Liberalerna klättrar mot spärren", "summaries": {"normal": "En ny DN/Ipsos-mätning visar att Liberalerna klättrar till 3,5 procent och närmar sig riksdagsspärren, medan Socialdemokraterna tappar för nionde mätningen i rad till 27,1 procent – sin sämsta notering sedan hösten 2021. Trots att oppositionen har ett tydligt försprång och att optimismen i samhället ökar, gynnar den nya stämningen till viss del Tidöpartierna.", "trump": "Sveriges radikala vänster är i total panik, det är helt oacceptabelt! Socialdemokraterna rasar och gör sitt sämsta valresultat någonsin, total katastrof för dem! Men tittar man på Liberalerna, fantastiska människor som kommer krypande tillbaka från Moderaterna, de klättrar mot spärren på tre komma fem procent! Oanad optimism i landet, folk älskar det!", "stalin": "Det svenska proletariatets självutnämnda företrädare, Socialdemokraterna, sjunker likt ett blysänke i en förorenad flod för nionde mätningen i rad. En historisk kollaps! Samtidigt försöker små borgerliga lakejer som Liberalerna febrilt klättra över fyraprocentsspärren likt desertörer som klättrar över ett fängelsestängsel. Statsapparaten noterar allt med största misstänksamhet."}, "date": "7 september, 18:47", "url": "https://bulletin.nu/dn-ipsos-liberalerna-klattrar-mot-sparren"}, {"type": "image-full", "heading": "Förstatligad sjukvård borde strida mot KD:s ideologi", "summaries": {"normal": "Ebba Busch kräver förstatligad sjukvård för att stötta en regim, vilket krönikören Joel Stade menar strider mot KD:s egen subsidiaritetsprincip om lokalt självstyre. Att flytta makten från 21 regioner till staten riskerar att underlätta nedläggningar av landsbygdssjukhus. Statlig styrning garanterar inte kvalitet, och KD bör i stället värna nära beslutsfattande enligt den katolska socialläran.", "trump": "Ebba Busch vill förstatliga hela den svenska sjukvården! Vilket totalt misslyckande till idé. Alla tittar på Storbritanniens katastrofala NHS – köer överallt, fullständig kaos! Vill ni ha det så? Jag har sagt det för absurda summor pengar, statliga jättar som Arbetsförmedlingen fungerar ju uselt. Håll er till lokala sjukhus och gör vård-Sverige great igen istället för centraliserat trams!", "stalin": "Vi noterar att de svenska kristdemokraterna vacklar i sin centraliseringsiver. Att överföra kontrollen över trehundrafemtio tusen vårdarbetare till en enda statlig koloss är ett steg i rätt riktning, men partiets interna gnäll om lokal makt undergräver effektiviteten. En sann byråkratisk maskin kräver absolut lydnad från huvudstaden, inte sentimentalitet kring landsbygdens lasarett. Avdelningscheferna kommer att hållas ansvariga."}, "date": "7 september, 12:58", "url": "https://www.gp.se/ledare/gastkronika/forstatligad-sjukvard-borde-strida-mot-kds-ideologi.9f92c057-d7b6-480c-bffe-850ce286d19f", "imageUrl": "https://www.gp.se/images/article/9f92c057-d7b6-480c-bffe-850ce286d19f/images/1MdKdbziYZOFQOQSfyFtMcqGLy0w-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Debattör polisanmäler Kristersson för förtal", "summaries": {"normal": "Valley Ghanem har polisanmält statsminister Ulf Kristersson för förtal efter att han kallat hennes uttalanden om Liberalernas Simona Mohamsson för flagrant antisemitism. Mohamsson har i sin tur polisanmält Ghanem för uttalanden som ”må hon brännas”, och Säkerhetspolisen utreder nu fallet som misstänkt olaga hot.", "trump": "Sorgligt! Den här radikala personen skickar vidriga hot och gråter sedan ut och stämmer Sveriges premiärminister för förtal när hon åker fast. Helt otroligt svagt! Om jag ledde Sverige skulle sådant här nonsens stoppas omedelbart. Totalt falska nyheter och enormt slöseri med tid. Skärp er, Sverige!", "stalin": "Ett ytterst beklagligt haveri inom den svenska ordningen. Medborgaren Ghanem kastar ur sig mordhot och gråter sedan ut om förtal till den kapitalistiska staten, medan Säkerhetspolisen drar ut i krig mot tangenterna. I Sovjetunionen hade vi rensat upp i detta enfaldiga spektakel på fem röda sekunder!"}, "date": "6 september, 13:14", "url": "https://kvartal.se/nyheter/artiklar/ghanem-polisanmaler-kristersson-for-fortal/cG9zdDoxODUwODY", "imageUrl": "https://images.kvartal.se/2026/09/06fe0aa7-kristerssonmohamsson.webp"}, {"type": "image-right", "heading": "Här kräver vänsterkvinnorna att invandraren ska åka hem", "summaries": {"normal": "Ett klipp från Sergels torg i Stockholm sprids på sociala medier. En ung man med skylten ”Återvandring nu” omringas av vänsterkvinnor som försöker skymma budskapet och uppmanar honom att själv lämna Sverige. Mannen står fast och frågar vem som egentligen är svensk. Reaktionerna på nätet är starka.", "trump": "Titta på de galna vänsterhäxorna på Sergels torg! En kille håller upp en skylt om återvandring och plötsligt flockas hela flocken av hysteriska tokkärringar och skriker att han ska dra. De vill inte höra sanningen. Fake tolerance på högvarv. Vi behöver fler som vågar säga vad alla tänker. Fantastiskt underhållande!", "stalin": "Jag betraktar med förakt hur dessa dekadenta identitetshyaror på Sergels torg försöker tysta en man som vågar ropa på återvandring. Deras skrikande rädsla avslöjar klassförrädarnas svaghet. Kamrater, sådana element måste rensas ut ur folkets medvetande innan de förgiftar hela samhället. Paranoia är deras enda vapen."}, "date": "7 september, 13:18", "url": "https://www.friatider.se/har-kraver-vansterkvinnorna-att-invandraren-ska-aka-hem", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-836.jpg?itok=crO-d4dV"}, {"type": "image-full", "heading": "Vänsterpartiets löften för din plånbok – då är du en vinnare", "summaries": {"normal": "Vänsterpartiet föreslår flera reformer för att stärka ekonomin för barnfamiljer, låg- och medelinkomsttagare, arbetslösa, sjukskrivna och pensionärer. Bland annat vill partiet höja barnbidrag, slopa karensavdraget, stärka a-kassan, införa en rikstäckande Sverigebiljett och höja skatten för höginkomsttagare. Förslagen skiljer sig tydligt från regeringens fokus på sänkta skatter och arbetslinje.", "trump": "Lyssnar ni på de här galningarna i Vänsterpartiet? De vill ge bort era pengar till lata bidragstagare, höja skatterna på vinnarna och kalla det rättvisa. Patetiska förlorare som hatar framgång. Under min administration byggde vi den starkaste ekonomin i världshistorien utan deras socialistiska vansinne. Amerika först, inte bidrags-Sverige!", "stalin": "Kamrater, dessa reformförslag avslöjar de profitthungriga klassförrädarnas svaghet. Jag ser hur de försöker köpa arbetarklassens lojalitet med smulor från folkets bord. Men vi vet att äkta styrka ligger i kollektivets järnhand. Låt oss rensa ut de dekadenta element som vägrar acceptera att de svaga måste skyddas mot de giriga hyenorna."}, "date": "7 september, 22:00", "url": "https://nyheter24.se/nyheter/politik/1511107-vansterpartiets-loften-for-din-planbok-da-ar-du-en-vinnare", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/ad6eda0204b004a30200000000b004a302/2026/09/07/2389744/vansterpartiet-ekonomin.jpg"}, {"type": "image-right", "heading": "Ledare Teodorescu Måwe solkar ner demokratin", "summaries": {"normal": "Europeiska ombudsmannen granskar Europaparlamentets vägran att lämna ut handlingar om Alice Teodorescu Måwes hemliga finansiär. Ledarskribenten Andreas Gustavsson kritiserar att varken parlamentet eller Kristdemokraterna verkar veta vem som betalar och anser att det underminerar demokratin. Väljarna har rätt att få klarhet om eventuella intressekonflikter.", "trump": "De här europeiska clownerna och deras hemliga pengagivare solkar ner hela skådespelet. Alice och hennes KD-kompisar vägrar säga vem som betalar notan för hennes livvakter, typiskt för de riggade eliterna. Jag har suttit i Vita huset både före och efter Sleepy Joe, och tro mig, så här gör man inte i en riktig demokrati. Patetiskt.", "stalin": "Se hur dessa dekadenta klassförrädare gömmer sina hemliga finansiärer bakom byråkratiska dimmor. Jag betraktar med förakt hur de solkar ner den så kallade demokratin med sin ovilja att avslöja källan till pengarna. En sådan komprometterad figur bör likvideras från folkets förtroende. Arbetarna förtjänar sanning, inte borgerliga hemligheter."}, "date": "7 september, 11:28", "url": "https://www.etc.se/ledare/teodorescu-maawe-solkar-ner-demokratin", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "En av tio osäkra – det avgör i spurten", "summaries": {"normal": "Inför det annalkande valet står en dryg månad före slutdatumet cirka tio procent av väljarna fortfarande utan faststämt partival, enligt valforskaren Henrik Ekengren Oscarsson. Dessa sena väljare kan bli helt avgörande. Slutspurten påverkas starkt av vilka sakfrågor som dominerar debatten och hur blocken spelar ut varandra, där bland annat sjukvårdsdebatten gynnar vissa partier.", "trump": "Sverige har ett enormt problem, verkligen fruktansvärt! Tio procent vet inte ens vad de röstar på, totalt kaos. Experten Henrik säger att de kommer sent till festen. Sjukvården diskuteras överallt, men det gynnar ju de falska socialdemokraterna. Jag vann med enorma marginaler, utan några som helst tveksamheter, och svenskarna borde lära sig av mig hur man vinner val på riktigt!", "stalin": "Dessa vacklande tio procent visar prov på ideologisk svaghet och bristande disciplin inför statens valhandling. Partierna måste genast skärpa agitationen och rikta strålkastarljuset mot de mest brännande samhällsfrågorna. Avvikelser från den kollektiva linjen tolereras ej. De som dröjer till sista stund kommer att granskas av partiets organ tills de finner sin rättmätiga plats vid valurnan."}, "date": "7 september, 21:49", "url": "https://www.aftonbladet.se/nyheter/a/k0xGRk/tio-procent-av-valjarna-kvar-att-slass-om-i-valveckan", "imageUrl": "https://akamai.vgc.no/v2/images/99e05360-5e84-3d73-b356-a7d6f7cfead5?fit=crop&format=auto&w=1080&s=af2cd85ae9786ca0397b49d37942d1eb03ce91c1"}, {"type": "image-right", "heading": "Tyska myndigheter: 21 bomber hittade nära elnätet", "summaries": {"normal": "Tyska myndigheter har hittat 21 hemmagjorda bomber nära elnätet i Sachsen under en utredning om sabotage. En 48-årig man som tagit på sig ansvaret i brev till media och myndigheter misstänks vara gärningsmannen. Han kopplas till klimatextremism. Mannen är efterlyst internationellt men fortfarande på fri fot. Händelserna har väckt oro för infrastrukturell sårbarhet.", "trump": "Titta på det här, folk. Tyskarna hittar bomber överallt vid sina elledningar och jagar en galen 48-åring som skriver brev som en miljöextremistisk clown. Biden lämnade världen i kaos, nu spränger gröna galningar kraftverk. De där woke-aktivisterna är farligare än de ser ut, tro mig. Vi behöver starka ledare, inte dessa vansinniga miljöterrorister.", "stalin": "Kamrater, se hur de dekadenta miljöfanatikerna saboterar elektriciteten som folket behöver. Jag betraktar från historien och ler mörkt åt dessa giriga hyenor som gömmer bomber och skriver bekännelser. Deras paranoia är en svaghet vi kan utnyttja. Rensa ut alla sådana fiender till ordningen innan de förvandlar samhället till ruiner. Statens säkerhet kräver det."}, "date": "7 september, 20:54", "url": "https://www.svt.se/nyheter/utrikes/tyska-myndigheter-21-bomber-hittade-nara-elnatet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.69/0.46/4346c94ce3b0c07a512d6e49622df8499480491eb63c74cd9e3e6796dd1ded62"}, {"type": "image-right", "heading": "Gants vinst halverad. Omsättningen höll emot klart bättre", "summaries": {"normal": "Modebolaget Gants svenska verksamhet backade under 2025. Omsättningen sjönk från 767 till 754 miljoner kronor och resultatet efter finansiella poster halverades från drygt 17 till 9 miljoner kronor. Bolaget pekar på en volatil marknad och redovisningstekniska förändringar. Trots detta planerar Gant fortsatta investeringar i butiker, kundupplevelse och ett lojalitetsprogram.", "trump": "Titta på det här, folk. Gant, ett av de där vakna modehusen, får sin vinst halverad i Sverige. 47 procent ner! Det är vad som händer när du dansar efter de globalistiska trenderna och lyssnar på de gröna galningarna istället för att sälja bra produkter. Patetiskt. Men jag älskar starka varumärken – bygg vidare, annars blir det konkurs, tro mig.", "stalin": "Ännu en gång visar de profitthungriga klasshyenorna hur svaga de är inför marknadens nycker. Resultatet halverat, omsättningen sjunken. Jag ler i graven åt deras dekadenta dans. Snart ska vi se en sann utrensning av dessa parasiterande modebaroner som tror att de kan parera historien med nya butiker på flygplatser. Arbetarna skrattar."}, "date": "7 september, 18:47", "url": "https://www.di.se/nyheter/gants-vinst-halverad", "imageUrl": "https://static.bonniernews.se/ba/b8788f76-d029-49c1-8344-28b2d2eff96d.png?crop=4000%2C2250%2Cx0%2Cy208&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Busch och Dadgostar drabbar samman i partiledardebatt", "summaries": {"normal": "Under en partiledardebatt i Expressen drabbade Ebba Busch (KD) och Nooshi Dadgostar (V) samman kring ett eventuellt förbud mot burka och niqab. Busch argumenterade för ett förbud med koppling till islamism och hedersförtryck, medan Dadgostar anklagade henne för bristande empati i utvisningsfrågor. Debatten intensifierades med ömsesidiga anklagelser om främlingsfientlighet, islamism och antisemitism.", "trump": "Sverige har stora problem, verkligen sorgligt! Deras politiker skriker på debatter om slöjor och utvisningar. Vänsterkvinnan grät ut, medan Ebba, en tuff person, sätter hårt mot hårt mot radikala krafter. De bråkar om Hamas och extremism. Mycket falska nyheter där borta. Om jag hade styrt debatten hade allt lösts på fem minuter, tro mig!", "stalin": "Dessa så kallade partiledare leker revolution i sina tidningsstudior medan partiapparaten vacklar. De grälar om tygstycken och utvisningar likt bortskämda bourgeoisiegosedjur. Vänstern döljer sina avvikelement, kristdemokraterna vädrar reaktionär paranoia. Om Folkets kommissariat hade hand om debatten skulle de omedelbart skickas till produktiva anstalter för obligatorisk ideologisk skolning. Inget slarv tillåts i staten!"}, "date": "7 september, 18:01", "url": "https://bulletin.nu/busch-och-dadgostar-drabbar-samman-i-partiledardebatt", "imageUrl": "https://cdn.bulletin.nu/articles/fe376107-0325-403c-8266-8ecfe1389886/preview.jpg?t=1788785633000"}, {"type": "image-right", "heading": "Åkesson: \"Var är Magdalena Andersson?\"", "summaries": {"normal": "Jimmie Åkesson kritiserar Magdalena Andersson för hennes frånvaro under hans Sverigeturné. Han undrar om Socialdemokraternas ledare är feg eller har gett upp, och pekar på att hon mest syns i kontrollerade medier istället för att möta väljare. Frågorna kommer särskilt från tidigare S-väljare som undrar var partiet är.", "trump": "Folk frågar mig hela tiden: Var är den där tråkiga Andersson? Hon gömmer sig som en fegis i sina fina studior medan riktiga arbetare längtar efter ledarskap. Sossarna har totalt kollapsat, precis som Biden gjorde. Hon är en mekanisk, falsk nolla som inte vågar möta folket. Patetiskt! Jag skulle vinna stort här.", "stalin": "Jag ser hur den dekadenta studioregissören Andersson döljer sig som en parasit i sin kontrollerade miljö. Arbetarna undrar med rätta om hon redan kapitulerat inför folkets vrede. Är hon en sådan ynklig klassförrädare att hon inte vågar möta massorna? Vi skulle ha genomfört en grundlig utrensning av sådana svaga element för länge sedan. Skrattretande."}, "date": "7 september, 17:32", "url": "https://riks.se/nyheter/akesson-fragar-var-ar-magdalena-andersson", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_88_96b9e7d44c.jpg"}, {"type": "image-full", "heading": "Bohlin om C:s utspel: ”Extremt grovt”", "summaries": {"normal": "Centerpartisten Niels Paarup-Petersen anklagar civilförsvarsminister Carl-Oskar Bohlin för att vara tyst om en SD-tjänstemans påstådda Rysslandskopplingar. Bohlin svarar att anklagelsen är extremt grov och att regeringen avvaktar en ordentlig granskning. Enligt tidningen Expo har tjänstemannen spridit proryska budskap.", "trump": "Centerpartisten försöker smutskasta regeringen med FAKE NEWS om Ryssland! Vår fantastiske minister Bohlin håller huvudet kallt och gör ett fantastiskt jobb, den absolut bästa. Men SD måste såklart rensa upp i leden omedelbart om det är sant. Det handlar om total illojalitet, sorgligt!", "stalin": "Dessa svenska bourgeois-politiker gråter ut på sociala medier likt bortskämda barn. Om denna SD-tjänsteman har misslyckats med att tjäna statens intressen och sprider felaktig propaganda utan vår sanktion, väntar naturligtvis en mycket kort och effektiv process i lämpligt arbetsläger."}, "date": "6 september, 11:21", "url": "https://kvartal.se/nyheter/artiklar/c-politikern-sd-tar-ryssen-in-i-regeringen/cG9zdDoxODQ5Nzk", "imageUrl": "https://images.kvartal.se/2026/09/0eda0169-c-m-fb.webp"}, {"type": "image-right", "heading": "Valmyndigheten: Upp till 500 förtidsröster kan ha gått förlorade", "summaries": {"normal": "Valmyndigheten tonar ner felet med förtidsröster; maximalt 500 väljare bedöms drabbade i stället för 4 000. Eftersom exakta personer inte kan identifieras uppmanas berörda att rösta på nytt på valdagen i rätt lokal. Valhemligheten är intakt och tekniska felet är åtgärdat, men SD anser att händelsen är mycket allvarlig för förtroendet för valsystemet.", "trump": "Sorgligt! Sverige har ett totalt riggat och inkompetent valsystem, folk skrattar åt det! De tappar bort rösterna, helt otroligt. Först säger de tusentals, sen femhundra – fake news-siffror! Ingen aning om vem som röstade. Under min ledning skulle detta aldrig hända, vi skulle ha pappersröster och rösträkning på fem minuter. Totalt fiasko, fixxa ert land!", "stalin": "Ett bedrövligt slarv med röstsedlarna i de svenska röstningslokalerna. När vi administrerar val finns det inga 'bortappade' femhundra väljare; en väljare som försvinner är ett administrativt misslyckande som omedelbart åtgärdas genom lämplig omplacering till Sibirien. Det svenska systemet saknar järnhård disciplin. Vi kommer att övervaka deras nästa val med stor misstänksamhet."}, "date": "7 september, 16:51", "url": "https://samnytt.se/valmyndigheten-upp-till-500-fortidsroster-kan-ha-gatt-forlorade", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/07135952/valmyndigheten-rosta-sedlar.jpg"}, {"type": "image-full", "heading": "Halva Sveriges kärnkraft ur drift – turbinfel i Forsmark", "summaries": {"normal": "Ett fel i en turbin vid Forsmarks kärnkraftverk tog under natten drygt 700 megawatt ur produktion. Tre reaktorer var redan avställda för revision och en av de återstående var nedreglerad. Kärnkraftsproduktionen låg vid lunchtid på drygt 3 000 av 7 050 megawatt. Elförsörjningen bedöms ändå som stabil.", "trump": "Folk, ni skulle inte tro det! De här inkompetenta energiförstörarna i Sverige har kraschat en turbin och slagit ut 700 megawatt kärnkraft precis när kylan kommer. Biden skulle ha älskat detta. Det är en total katastrof, den värsta jag sett, men jag fixar alltid elen – tro mig!", "stalin": "Ännu ett bevis på att de kapitalistiska revisionisterna och deras saboterande element inte kan garantera folkets energibehov. Jag ser hur de västerländska parasiterna fumlar med sina reaktorer medan folket fryser. Sådana fiender till kollektivet förtjänar att rensas ut med järnhand. Partiet ler i mörkret."}, "date": "7 september, 14:20", "url": "https://www.dagensps.se/teknik/energi/halva-sveriges-karnkraft-ur-drift-turbinfel-i-forsmark", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/dagens-ps-1-6.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "S sågar V efter kandidatskandal: ”Långt borta från regering”", "summaries": {"normal": "Vänsterpartiet har strukit ytterligare åtta kandidater efter att de spritt antisemitiskt material och Hamas-hyllningar. Socialdemokraterna och Centerpartiet ser det som ett strukturellt problem och anser att V nu är mycket långt från varje regeringsalternativ. Partiet lovar att rösta nej till alla regeringar de inte ingår i.", "trump": "Folk, ni skulle se det här. Vänsterpartiet är en total katastrof, en riktig skamfest fylld av antisemitiska galningar och Hamas-fans. Socialdemokraterna skrattar åt dem och säger att de är ljusår från regeringen. Patetiskt! De har ingen kontroll, precis som Sleepy Joe hade under sina år. En clownshow!", "stalin": "Jag betraktar detta med kall förakt. Dessa så kallade vänsterförrädare kryper av antisemitism och konspirationer som råttor i mörkret. Kamraterna i Socialdemokraterna har rätt – de är politiska lik som aldrig ska närma sig makten. Partiet är en fiende till folket, en parasit som måste rensas ut med järnhand."}, "date": "7 september, 12:00", "url": "https://www.tv4.se/artikel/1L0soy7mOh9HmFEEHGjPg6/s-sagar-v-efter-kandidatskandal-langt-borta-fran-regering", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlazHXQbCG-Ag%2F78c7c05a3909cd03c9600601eaafbe1f%2FVansterpartiets_partiledare_Nooshi_Dadgostar.&width=120"}, {"type": "image-right", "heading": "Facket: Utländska strejkbrytare bakom förlorad Teslastrejk", "summaries": {"normal": "Facket kritiserar utländska strejkbrytare som gjorde att Teslas verksamhet kunde fortsätta under den långa strejken. IF Metall och Vänsterpartiet vill ändra EU:s utstationeringsregler som möjliggjorde detta. Flera fackliga och politiska röster kräver nu översyn, men betonar vikten av försiktighet och dialog med parterna innan regeländringar.", "trump": "De här vansinniga EU-reglerna låter utländska strejkbrytare rädda Teslas svenska verksamhet som om det vore en skönhetstävling för woke-aktivister. Totalt missbruk! De giriga globalisterna i Bryssel hatar riktiga arbetare och älskar att krossa strejker. Vi behöver inte mer av den här galna identitetspolitiken på arbetsmarknaden, det är en skam!", "stalin": "Jag betraktar med förakt hur dessa profitthungriga klassförrädare utnyttjar dekadenta EU-regler för att krossa arbetarnas kamp. Det är ett förräderi mot kollektivet. Vi måste rensa ut sådana imperialistiska kryphål som underlättar strejkbryteri. Kamrater, låt inte de parasiterande hyenorna vinna – analysera, agera och likvidera hoten mot arbetarklassen med järnhand."}, "date": "7 september, 14:00", "url": "https://arbetet.se/2026/09/07/facket-utlandska-strejkbrytare-bakom-forlorad-teslastrejk", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/07131536/simon-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "\"Stoppa båtarna\": Hundratals svartklädda män blockerade hamnen i Dover", "summaries": {"normal": "Hundratals maskerade män blockerade hamnen
