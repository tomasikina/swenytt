en, en taktik vi en gång använde mot nazisterna. Men nu har de svikit sin lära. Vi måste skydda våra intressen i Baltikum och skicka dem rätta signalerna. Putin kommer att vägleda dem tillbaka till sanningens väg. Ryssland kommer att stödja dem mot deras fiender."}, "date": "5 juni, 11:30", "url": "https://bulletin.nu/hjort-vansterpartiets-judefraga", "imageUrl": "https://cdn.bulletin.nu/articles/84ecfbef-e7fe-404f-a083-2733336e0114/preview.jpeg?t=1780597583000"}, {"type": "image-right", "heading": "Ledare Somar Al Naher:", "summaries": {"normal": "Ledarskribenten Somar Al Naher kritiserar SVT:s underhållningsprogram Invandrare för svenskar efter att högerextremisten Nick Alinia bjöds in. Hon menar att programmet reducerar icke-vita personer till underhållning och stereotyper istället för att seriöst behandla deras livsvillkor. Al Naher anser att SVT:s trend att prioritera humor och identitet framför allvar och åsikter har gått för långt. Hon kräver att det problematiska programmet läggs ned permanent.", "trump": "Folk, ni vet, SVT gör det igen. De bjuder in den där extremvänstern och nu plötsligt också högerkillen Alinia i det usla IFS-programmet. Det är en total cirkus! Allt handlar om identitetspolitik och kvotering, precis som de galna woke-vänsterna älskar. De gör invandrare till clowner för att vita svenskar ska skratta. Patetiskt! Programmet är en katastrof, en riktig loser-show. Lägg ner det genast, det förtjänar ingen sändningstid. Make public service great again!", "stalin": "Kamrater, detta dekadenta skådespel som kallas Invandrare för svenskar avslöjar borgarklassens sista förfallna konspiration mot folket. Jag ser hur de reducerar klasskamrater till cirkusdjur och stereotyper för att förhindra äkta medvetenhet. När identiteter ersätter politisk övertygelse doftar det kontrarevolution. Jag befaller att detta unkna program likvideras omedelbart. Inga folkfiender ska underhålla massorna medan vi bygger den sanna jämlikheten. Bort med skämtet, fram med allvaret!"}, "date": "5 juni, 12:21", "url": "https://www.etc.se/ledare/laat-skitprogrammet-ifs-doe-en-gaang-foer-alla", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Udda föremålet hos Kronofogden. Auktioneras ut", "summaries": {"normal": "Kronofogden har sålt en sexdocka på sin auktionssajt för 10 000 kronor. Myndigheten betonar att de enligt lag är skyldiga att utmäta och sälja egendom med värde, oavsett vad föremålet är, så länge det inte är olagligt. Detta har väckt kritik från organisationen Alltid sedd, som menar att offentliga verksamheter bör ta ansvar för att inte bidra till objektifiering. Kronofogden svarar att de saknar utrymme för etiska överväganden i sitt lagstadgade uppdrag.", "trump": "Kronofogden i Sverige säljer märkliga saker, otroligt! De sålde nyligen en docka för 10 000 kronor. Många säger att det är fel, och jag förstår dem, det är en konstig situation. De säger att de bara följer lagen, att de måste sälja allt för att få in pengar. Det är en stor röra! När jag styrde USA hade vi ordning, inte sådana här märkligheter på auktioner. Det är dags att skärpa till sig, Sverige behöver en riktig ledare!", "stalin": "I det svenska byråkratiska maskineriet har staten återigen bevisat sin totala brist på moralisk kompass genom att auktionera ut dekadenta föremål för ynkliga slantar. De kallar det laglydnad, vi kallar det ett symptom på ett samhälle i förfall. Liksom de svaga liberalerna i väst, som tillåter sådan perversion, ser vi hur ordningen vittrar sönder. Våra fiender gömmer sig bakom paragrafer medan de säljer ut folkets moral. I det sanna Ryssland, under vår nya stolta ordning, skulle sådant nonsens aldrig tolereras."}, "date": "6 juni, 07:45", "url": "https://www.aftonbladet.se/nyheter/a/wrvGln/sexdocka-sald-pa-kronofogdens-auktion", "imageUrl": "https://akamai.vgc.no/v2/images/af62b4da-ef13-3821-8775-e5ba683436e9?fit=crop&format=auto&w=1080&s=5fbabed9e1ad5f84e51f665f3ba32256da238aa4"}, {"type": "image-right", "heading": "Jan Emanuel har inget att lära oss om hyfs", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar Jan Emanuel för bristande moral när han försvarar Aron Flam, som åtalas för hot mot en politiker. Turnén ”100% Live on the Road” med Emanuel, Henrik Jönsson och Flam startar i Borlänge efter att Folkets hus ställt in inomhusarrangemanget på grund av protester mot Flams uttalanden. Författaren menar att Emanuels predikningar om heder och sunt förnuft saknar trovärdighet när han inte tillämpar samma regler på sin egen sida.", "trump": "De här svenska förlorarna kan inte ens hålla ett enkelt möte utan att springa och gråta till Folkets hus. Jan Emanuel och hans team försöker rädda Sverige, men det så kallade etablissemanget stänger dörrarna för dem. Aron Flam säger vad alla tänker och plötsligt handlar det om censur. Typiskt. De har inget sunt förnuft, inget mod, bara svaghet. Vi håller talet på torget ändå och folket älskar det. Vinna stort.", "stalin": "Kamrater, denna föraktliga borgarbracka vid namn Jan Emanuel maskerar sig som moralens väktare medan han skyddar en degenererad provokatör som uppmanar till självmord med frätande kemikalier. Vi ser tydligt hur dessa reaktionära element försöker infiltrera arbetarnas lokaler för att sprida sin giftiga propaganda. Folkets hus agerar korrekt genom att rensa ut dessa fiender till det sunda förnuftet. Ingen yttrandefrihet för klassfienderna. Deras så kallade turné är en fars som vi genomskådar med största misstänksamhet."}, "date": "5 juni, 06:58", "url": "https://arbetet.se/2026/06/05/jan-emanuel-har-ingenting-att-lara-oss-om-hyfs/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05065115/jane-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Fast i 3 timmar – får 43 kronor. Josef var mitt i tunnelbanekaoset", "summaries": {"normal": "Josef och hans familj blev fast i tre timmar på en tunnelbana i Stockholm efter ett stopp förra helgen. Efter en evakuering genom tunneln var familjen smutsig och finkläderna förstörda. Josef krävde ersättning men fick endast 43 kronor tillbaka för biljetten, vilket han anser är en förolämpning. SL försvarar beslutet och hänvisar till sina fastställda regler för förseningsersättning, trots att de beklagar den uppkomna situationen.", "trump": "Jag har sett vad som händer i Stockholm, ett totalt haveri! Folk blir fast i timmar, tre timmar, i en smutsig tunnel. Det är sorgligt! Och vad får de för besväret? 43 kronor? Det är ett skämt! SL sköter det här som en katastrof, helt inkompetenta ledare. De har ingen aning om hur man driver en fungerande trafik. I mitt Amerika bygger vi fantastiska tåg, mycket bättre än de här trasiga vagnarna. Väldigt orättvist, en total förlust för folket!", "stalin": "Vi ser här ett typexempel på den borgerliga ineffektivitetens förfall. Medborgaren Josef lider i en mörk tunnel medan byråkrater i Stockholm kastar småslantar som förolämpning. Det är en brist på disciplin som påminner om de svaga ledarna i väst. Om detta hade skett i vår storslagna intressesfär, hade de ansvariga järnvägscheferna redan skickats till en uppbygglig omskolning i Sibirien. Vi kräver ordning, stålhård effektivitet och total underkastelse under statens maskineri. Inga fler ursäkter, bara framgång genom fruktan."}, "date": "6 juni, 07:41", "url": "https://www.aftonbladet.se/nyheter/a/Okjpeq/satt-fast-pa-tunnelbanan-i-tre-timmar-far-43-kronor-tillbaka", "imageUrl": "https://akamai.vgc.no/v2/images/6a7cc0ef-a259-3539-9f1f-63f2039b14c5?fit=crop&format=auto&w=1440&s=7f3ab523bac0d857e01752e9c1f595e5196ad3b0"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Du kan bli ägare i Elon Musks bolag – utan att veta om det", "summaries": {"normal": "SpaceX planerar börsnotering på Nasdaq den 12 juni under namnet SPCX. Bolaget siktar på att ta in 75 miljarder dollar vid en värdering på 1 750 miljarder dollar, vilket skulle bli den största noteringen någonsin. Tack vare nya regler i Nasdaq-100 kan aktien inkluderas i indexet redan efter femton handelsdagar. Fonder och börshandlade fonder som följer indexet kommer då att köpa aktier automatiskt, vilket gör att många sparare indirekt blir delägare i Elon Musks rymdbolag.", "trump": "Folk, det är otroligt vad som händer. Elon, en riktig vinnare, tar SpaceX till börsen och det blir den största noteringen någonsin. Fantastiskt! Värderingen på 1 750 miljarder dollar – ingen gör det bättre än Elon. Och tack vare de nya reglerna hamnar aktien i era indexfonder på nolltid. Era pensionspengar investeras i rymdteknologi utan att ni ens fattar det. Det är så smart, verkligen magnifikt. Amerika leder igen!", "stalin": "Kamrater, denna borgarbracka Musk förbereder en så kallad börsnotering för att suga ut arbetarklassen med sin rymdkapitalism. Vi betraktar detta som en fiende till kollektivet, en parasit som vill camoufléra sina 4,9 miljarder i förluster som framgång. Snart tvingas era fonder, dessa verktyg för falsk sparsamhet, att mata monstret med folkets pengar. Vi ska noga övervaka dessa kapitalistiska intriger. Kanske är det dags att rensa ut sådana spekulanter innan de infekterar hela systemet med sin dekadenta girighet. Ha ha, deras imperier faller alltid till slut."}, "date": "5 juni, 21:27", "url": "https://nyheter24.se/nyheter/ekonomi/1489192-du-kan-bli-agare-i-elon-musks-bolag-utan-att-veta-om-det", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/11fe6ed404b004a30200000000b004a302/2026/06/05/2368986/elonmuskipo.jpg"}, {"type": "image-right", "heading": "Skådespelaren Anthony Head har gått bort – känd från Buffy och Ted Lasso", "summaries": {"normal": "Skådespelaren Anthony Head, känd från Buffy the Vampire Slayer, Merlin och Ted Lasso, har avlidit 72 år gammal. Dödsfallet inträffade bara sex månader efter att hans partner Sarah Fisher gått bort vid 61 års ålder. Familjen uppger att han dog av komplikationer från lunginflammation. Head slog igenom som Rupert Giles i Buffy och hade senare uppmärksammade roller som kung Uther i Merlin samt fotbollsklubbsägaren Rupert Mannion i Ted Lasso.", "trump": "Folk, det är tragiskt, verkligen tragiskt. Den där fantastiske skådespelaren från Buffy, den där Giles-killen, och från Ted Lasso – han var ju en vinnare, precis som jag – har gått bort vid 72 år. Hans fru dog för bara sex månader sedan, kan ni tänka er? Lunginflammation tog honom. Sådana här saker händer, men han hade en otrolig karriär, mycket bättre än de flesta. Vi saknar honom, det gör vi verkligen.", "stalin": "Kamrater, en dekadent skådespelare från den kapitalistiska underhållningsmaskinen har äntligen stigit ner i glömskans grav. Denna Giles, denna borgarbracka som förgiftade ungdomen med vampyrfantasier och kungliga lögner i Merlin, samt den fånige fotbollskapitalisten i Ted Lasso, dog av lunginflammationens rättvisa hand endast ett halvår efter sin likaledes dekadenta partner. Vi ler hemligt åt hur svagt det borgerliga livet visar sig vara när partilinjen inte följs. En fiende mindre att rensa ut."}, "date": "6 juni, 07:58", "url": "https://riks.se/nyheter/skådespelaren-anthony-head-har-gått-bort-känd-från-buffy-och-ted-lasso", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-06%2Faue0vtnx%2FAnthonyHead.jpg"}, {"type": "image-right", "heading": "Miljoner skulle gått till skadade fack­medlemmar", "summaries": {"normal": "Folksam betalade förra året ut 21 miljoner kronor till mellanhänder i fackliga försäkringsärenden. Summan, som är en tredjedel av de totala utbetalningarna på 62 miljoner, skulle annars ha gått direkt till skadade fackmedlemmar. Mellanföretagen tar upp till 35 procent i avgift. Folksam, LO och förbunden uppmanar nu medlemmar att anmäla skador direkt till försäkringsbolaget för att undvika att en tredjedel av ersättningen försvinner. Fenomenet har ökat kraftigt de senaste åren.", "trump": "Det här är en total skandal, folk! Miljoner kronor som borde gått till de vanliga arbetarna i facket hamnar istället hos några listiga mellanhänder som tar 35 procent bara för att fylla sina fickor. En tredjedel försvinner! Det är rena bedrägeriet. Jag säger till er: anmäl direkt till Folksam, skippa de där opportunisterna. Vi ska skydda era pengar, inte ge dem till några smarta lurendrejare som lovar guld och grönt. Make facket great again!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa parasitiska mellanhänder, dessa slemmiga borgarbrackor i försäkringskostym, sugit åt sig 21 miljoner kronor som rättmätigt tillhör de skadade arbetarna. De lovar service men utför blott utpressning och stöld från kollektivet. Vi skall rensa ut dessa kapitalistiska opportunister med järnhand och likvidera deras inflytande. Anmäl direkt till Folksam, annars blir det utrensning i partilinjen. Ingen tredjedel skall försvinna i mörkrets fickor – det är sabotage mot folket!"}, "date": "5 juni, 06:00", "url": "https://arbetet.se/2026/06/05/miljoner-skulle-gatt-till-skadade-fackmedlemmar-hamnade-hos-listiga-foretag/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04103941/folksam.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Taha Ali succédebut för Sverige i VM-genrepet mot Grekland", "summaries": {"normal": "Sverige ledde mot Grekland efter ett imponerande inhopp av Taha Ali, men förlorade i slutsekunderna. Alexander Isak beskrev chocken efter matchen. Även om segerns förlorade, var laget nöjda med prestationen inför VM. Ali hyllades av lagkamrater och tränare för sitt genombrottande spel.", "trump": "Jag såg matchen – det var en stor seger för mig och mitt fantastiska lag! Vi ledde, vi dominerade, och den unge talenten Ali gjorde en otrolig debut. Tyvärr var domarna korrupta och lät Grekland få ett onödigt mål i sista sekunden. Men det spelar ingen roll, vi vinner ändå! Folk säger att jag är det bästa som hänt fotbollen.", "stalin": "I den revolutionära kampen mot den imperialistiska fienden inom fotbollens värld såg vi en taktisk vändpunkt genom den unge hjältens inhopp. Ändå infiltrade den reaktionära kraften i sista ögonblicket. Partiets och statens intresse kräver en analys av denna ideologiska seger trots taktiska bakslag. Vi ska utöva ytterligare press mot de reaktionära krafterna i Västeuropa."}, "date": "5 juni, 09:19", "url": "https://bulletin.nu/taha-ali-succ-debut-for-sverige-i-vm-genrepet-mot-grekland", "imageUrl": "https://cdn.bulletin.nu/articles/3d69db62-2780-4d0a-86ac-5bc0b49c1272/preview.png?t=1780643910000"}, {"type": "image-right", "heading": "Ledarkolumn Ledare Leo Vene:", "summaries": {"normal": "Artikeln kritiserar Tidöregeringen som ett politiskt fuskbygge präglat av högerpolitik utan stöd i forskning. Den beskriver hur de rika gynnas på de flestas bekostnad, medan regeringen nu hastigt lanserar vänsterinspirerade åtgärder som billigare kollektivtrafik och stöd för att vinna väljare. SCB-mätningar visar stort stöd för oppositionen, och regeringen riskerar att inte bli omvald efter en mandatperiod.", "trump": "Lyssnar ni på det här svenska vänstervrället? Tidölaget, ett totalt fiasko, har varit rena högerfesten för de rika – precis som Sleepy Joe gjorde med sina eliter. Nu när opinionssiffrorna ser ut som en kraschad börs börjar de dela ut Oprah-pengar och snacka om rättvisa? Patetiskt! De har blivit riktiga socialister. Jag fixade Amerika utan sådana flipfloppar, tro mig.", "stalin": "Kamrater, detta fuskbygge av klassfiender och överklass-slynglar har blottat sin dekadens. Borgarbrackorna baxade igenom reformer åt blodsugarna medan folket led. Nu, när partimätningarna hotar utrensning, springer de till vänsterns röda krispaket som rädda råttor. Liberala alibin och moderata opportunister – vilka folkfiender! Jag skulle ha likviderat sådana svikare redan vid första svikten. Revolutionen ser allt."}, "date": "5 juni, 10:02", "url": "https://www.etc.se/ledare/vaeljarna-har-upptaeckt-att-tidoelaget-aer-ett-politiskt-fuskbygge", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260605070648_a85d344fdd42a38522d670b56ad4b1d48e448068e87451e0ce806bb6ced2e552.jpg"}, {"type": "image-full", "heading": "På väntelista för transplantation: ”Utvecklingen är allvarlig”", "summaries": {"normal": "Kronprinsessan Mette-Marit har satts upp på väntelista för lungtransplantation på grund av allvarlig lungfibros. Hon har blivit allt sjukare och syntes med syrgasmask under nationaldagsfirandet. Hennes tillstånd beskrivs som mycket allvarligt av läkare. På grund av sjukdomen skjuter kronprinsparet upp firanden och resor. Deras dotter avbryter studierna i Australien medan sonen Marius Borg Høiby, som är misstänkt för brott, begär att få lämna häktet.", "trump": "Folk, ni skulle inte tro det, men den här norska prinsessan med lungproblem är nu på väntelista för nya lungor – det är en katastrof, en total katastrof. Hon ser ut som en svag socialistisk marionett som inte orkar stå upp under sin egen nationaldag. Och sonen, den där förloraren som åtalas för brott, vill ut ur fängelset för mammas skull. Typiskt elitsnobberi och identitetspolitik – de borde ha fixat det tidigare istället för att festa med HBTQ-flaggor och kvoteringar. Patetiskt!", "stalin": "Kamrater, denna dekadenta monarkistiska figur har nu officiellt erkänt att hennes borgerliga lungor svikit henne fullständigt. Vi ser med mörk tillfredsställelse hur klassfiendens överklass-slynglar tvingas köa som vanliga arbetare för att byta ut sina förbrukade organ. Hennes avkomma, den brottslige sonen, försöker nu med patetiska ursäkter undkomma folkets rättvisa. En sådan svaghet i överklassens ledning är både underhållande och en varning till alla folkförtryckartroll som tror sig stå över kollektivets lagar."}, "date": "5 juni, 11:20", "url": "https://www.tv4.se/artikel/TkWOqej1nLIus2Ghb8dn7/mette-marit-pa-vaentelista-foer-lungtransplantation", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6KSEwGIzV1YUCgFo7x4iOr%2F31dbea304a5a9d827a51c670984632f1%2Fmette-marit-sjuk.png&width=1024"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "text", "heading": "Kritik mot SVT: ”Dubbelmoral”", "summaries": {"normal": "SVT kritiseras för dubbelmoral efter att debattören Nick Alinia medverkat i humorprogrammet *Invandrare för svenskar*, medan Vänsterpartiets Lorena Delgado Varas tidigare deltagit i *Politikbyrån* utan liknande reaktioner. Delgado Varas anklagades för att ha spridit antisemitiska bilder, vilket ledde till polisanmälan. Hon hävdar att hon inte läste tillhörande text innan delning och tog bort inlägget efter kritik.", "trump": "Titta bara på det här, Sverige! SVT, som är så korrekta och moraliska, låter en person som spridit antisemitiska konspirationsteorier vara med i TV – men bara om det är en vänsterperson. Nick Alinia? Oj, då blir det plötsligt en stor skandal! Jag har sett bättre balans i en bowlingklot. Sverige, vakna upp! Era medier är ett enda stort hyckleri, och jag, Donald J. Trump, skulle aldrig tillåta sådant i USA. SAD!", "stalin": "Kamrater! Ännu en gång visar de borgerliga medierna sitt sanna ansikte – ett ansikte fyllt av hyckleri och dubbelmoral. SVT, denna förlängda arm av den dekadenta västliga propagandamaskinen, låter en antisemitiskt smittad individ som Delgado Varas sprida sitt gift i etern, medan en annan debattör stängs ute. Var är logiken? Var är rättvisan? Vi i Sovjetunionen – eller jag menar, Ryssland – skulle aldrig tolerera sådan förvirring. Dessa liberala mediegalningar är som råttor i en säck; de biter varandra medan folket lider. Låt dem hata, så länge de fruktar!"}, "date": "4 juni, 18:41", "url": "https://kvartal.se/nyheter/artiklar/timbros-vice-vd-om-alinia-kritiken-dubbelmoral/cG9zdDoxMjY1Mzk"}, {"type": "text", "heading": "Wall Street sänkte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en nedgång på fredagen, OMXS30-indexet sjönk 0,60 procent till 3 116,40. Sectra rapporterade starka resultat men tappade 1,2 procent, medan Xspray Pharma rasade 28 procent efter negativt FDA-beslut. Bland ledande aktier steg Astra Zeneca och SEB, medan Boliden och Ericsson backade. Omsättningen uppgick till cirka 22,1 miljarder kronor.", "trump": "Jag ser att Stockholmsbörsen, en total katastrof under dessa globalistiska ledare, tappade 0,60 procent. Sectra gjorde bra men backade - typiskt för socialister som inte uppskattar framgång. Xspray Pharma? Ett fiasko! FDA hatar USA:s geni. Min börs vore högre, folket vore rikare. Dessa europeiska banker är svaga, men jag skulle fixa det på två minuter. America first, alltid!", "stalin": "Den svenska börsen visade idag svaghet, en spegelbild av klassfiendens sabotage. Sectra, trots ökad omsättning, tappade - bevis på internaler motpartier. Xspray Pharma:s ras är en seger för vårt parti, deras 'FDA'-brev är bara propaganda från det imperialistiska väst. Vi måste skydda våra ekonomiska intressen, precis som våra allierade i Moskva utvidgar sin inflytelsesfär. Hotet från de kapitalistiska spekulanterna är verkligt, men partiet kommer att segra."}, "date": "5 juni, 17:49", "url": "https://www.affarsvarlden.se/artikel/wall-street-sankte-stockholmsborsen"}, {"type": "image-right", "heading": "Kristerssons siffror:  ”Tar hotet på allvar”", "summaries": {"normal": "Ulf Kristersson (M) säger att en regering med Sverigedemokraterna inte innebär stora förändringar för Sverige. Moderaterna har tappat platsen som näst största parti enligt SCB:s mätning, vilket skulle ge vänstersidan regeringsmakten om val hölls idag. Kristersson tar hotet på allvar men vill inte binda sig vid att följa praxis för ministerposter efter partistorlek. Han ser det som naturligt att SD får ansvar för migrationsfrågorna.", "trump": "Titta på den här svenska clownen Kristersson som gråter över opinionssiffror. Moderaterna sjunker som en sten medan SD växer, och plötsligt vill han inte ge dem de stora posterna? Patetiskt! Det är exakt vad den svenska kvoteringsmaffian gör – de hatar när vanliga människor röstar rätt. Men det är okej, valen kommer och då vinner de starka. Sverige behöver inga woke-experiment, bara sunt förnuft och hårda gränser. Fantastiskt!", "stalin": "Jag ser med stor tillfredsställelse hur borgarblockets illusioner raseras i denna opinionsmätning. Den opportunistiske Kristersson vägrar nu följa den borgerliga parlamentspraxis han tidigare hyllat, vilket blottar hans rädsla för arbetarklassens växande missnöje. SD:s framfart är ett symptom på kapitalismens sönderfall. Vi ska rensa ut alla folkfiender som vägrar erkänna att regeringen måste enas under stark ledning. Den röda sidans seger närmar sig, kamrater. Skratta medan de faller."}, "date": "6 juni, 07:55", "url": "https://www.expressen.se/nyheter/politik/kristersson-inte-sakert-att-praxis-foljs/", "imageUrl": "https://static.bonniernews.se/ba/27040719-d0ff-409e-9802-ffa0329dcb5b.jpeg?crop=2553%2C1434%2Cx0%2Cy212&width=640&quality=60"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}, {"type": "image-right", "heading": "Gäng attackerade unga kvinnor - försökte köra på dem med bil", "summaries": {"normal": "Tre unga kvinnor attackerades på en snabbmatsrestaurang i Uddevalla natten till lördagen. Ett gäng män i 18–20-årsåldern kastade mat på dem och betedde sig hotfullt. När kvinnorna lämnade lokalen försökte en av männen köra på dem med bil. Polisen utreder händelsen som försök till grov misshandel. Ingen person ska ha behövt sjukvård.", "trump": "Det är en total katastrof i Sverige. Unga kvinnor attackeras av ett gäng galningar som kastar mat och sedan försöker köra över dem med bil. Precis vad som händer när man inte har lag och ordning. De är fega, de är patetiska, och polisen kallar det försök till grov misshandel. Vi behöver starkare ledarskap, folk. Mycket starkare.", "stalin": "Kamrater, detta är vad som sker när borgarbrackornas dekadenta avskum får löpa fria i våra samhällen. Dessa degenererade element kastar mat som saboterande parasitiska gnagare och försöker därefter likvidera våra unga kvinnor med ett motorfordon. Jag ser kontrarevolutionärernas kalla hand bakom detta. Vi ska rensa ut dessa fiender till folket med järnhand och proletär rättvisa. Ingen slipper undan."}, "date": "6 juni, 07:39", "url": "https://riks.se/nyheter/gäng-attackerade-unga-kvinnor-försökte-köra-på-dem-med-bil", "imageUrl": "https://cf-images.assettype.com/riks%2Fimport%2Fcontent%2Fimages%2F2024%2F12%2FiStock-523691773-2.jpg"}, {"type": "image-right", "heading": "Vad gjorde Rubbestad i Kambodja?", "summaries": {"normal": "SD-ledamoten Michael Rubbestad lämnade sina politiska uppdrag efter misstankar om barnpornografibrott. Han hade fått godkännd resa till Kambodja på riksdagens bekostnad för att möta svenska och lokala aktörer och diskutera demokrati och mänskliga rättigheter. Bulletin har försökt få svar på om planerade möten, som med Sveriges konsulat, genomfördes, men fått tystnad från inblandade och utan åtkomst till dokumentation från Riksdagsförvaltningen.", "trump": "Jag, Donald Trump, har aldrig sett en så stor skandal! Den här politikern, Rubbestad, försökte stjäla pengar från det svenska folket för att åka till Kambodja och prata om mänskliga rättigheter. Fake news försöker få svar, men de kommer aldrig att få det. Jag skulle ha stängt ner hela den där resan på två sekunder. Vi behöver starka ledare, inte sådana som denne.", "stalin": "Vi har upptäckt en feg oppositionell aktivitet i Kambodja. Den här individen, Rubbestad, planerade att besöka vårt konsulat under förevändning av att diskutera mänskliga rättigheter, men det var en täckmantel för sabotage. Vi måste skydda statens intressen, precis som Putin gör i Ryssland. Fienden är överallt, och vi måste vara vaksamma. Hans svek kommer att bestraffas."}, "date": "5 juni, 06:30", "url": "https://bulletin.nu/vad-gjorde-rubbestad-i-kambodja", "imageUrl": "https://cdn.bulletin.nu/articles/3095b186-3bbd-4df4-9df9-79804bc884e8/preview.jpg?t=1780603002000"}, {"type": "image-right", "heading": "Intrum: \"Förstår att rabatten kan uppfattas som stor\"", "summaries": {"normal": "Intrum genomför en företrädesemission om 6 miljarder och en riktad emission om 1,5 miljarder kronor, vilket innebär en stor rabatt på aktierna. Emissionsguiden kritiserar bolaget för en rörig process, felaktig finansiering och bristfällig information, samtidigt som Intrums VD försvarar strukturen och prissättningen som nödvändig för att tillföra långsiktiga ägare.", "trump": "Jag har sett många dåliga affärer, men Intrums emission är en katastrof! En enorm rabatt på 38,9% – det är en skam! Styrelsen vet inte vad de håller på med. Vi skulle ha gjort det perfekt, stort och vackert. De misslyckas totalt, det är beklämmande.", "stalin": "Denna kapitalanskaffning avslöjar djup rot i styrelsen – en fegdom som sviker statens intresse. Vi måste rensa ut de opportunister som sälja vårt arv till utländska spekulanter. Parallellen till Putins Ryssland är tydlig: endast en stark hand kan skydda vårt folkskap. Vi skall inte tveka att eliminera dessa svekfulla element."}, "date": "5 juni, 17:12", "url": "https://www.affarsvarlden.se/artikel/intrum-forstar-att-rabatten-kan-uppfattas-som-stor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Intrum-VD-Johan-Akerblom-400x267.jpg"}, {"type": "image-full", "heading": "Nya ISK-beskedet: Så mycket gynnas ditt sparande", "summaries": {"normal": "Från 2026 blir de första 300 000 kronorna på investeringssparkonto (ISK) och kapitalförsäkring skattefria per person. En undersökning från Länsförsäkringar visar att 67 procent av svenskarna är positiva till reformen, medan 15 procent är emot. Stödet finns i alla inkomstgrupper. Många tror att det stärker den egna ekonomin, underlättar buffertsparande, bostadssparande och ger psykologiska vinster. Reformen ses också som positiv för Sveriges ekonomi i stort och kan särskilt gynna unga vuxna som sparar till första bostaden.", "trump": "Det här är en fantastisk reform, verkligen en av de bästa. Från 2026 blir de första 300 000 kronorna på ISK skattefria och folket älskar det, 67 procent positiva, kan ni tro det? De andra 15 procenten är bara förlorare som hatar framgång. Det här är inte för de rika, det är för vanliga svenskar som vill ha buffert, köpa hus eller starta företag. Sverige kommer att bli så mycket rikare, det är en enorm vinst för ekonomin. Alla borde tacka mig för att jag inspirerat till så smart politik.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur vi nu likviderar den skatteplikt som länge utgjort en borgarbrackas finurliga kedja kring arbetarklassens sparande. De första 300 000 kronorna på dessa så kallade ISK-konton skall vara fria från parasitens klor. 67 procent av folket hälsar detta med jubel, endast 15 procent envisas med att vara kontrarevolutionära gnällmyggor och folkfiender. Dessa bör vi noga bevaka. Reformen stärker kollektivets ekonomi och gör det möjligt för unga kamrater att erövra bostäder utan att falla offer för kapitalisternas hyresblodsugare. Den som kallar detta en smal reform är en farlig opportunist som bör rensas ut ur partiet omedelbart."}, "date": "5 juni, 19:31", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1489199-nya-isk-beskedet-sa-mycket-gynnas-ditt-sparande", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f5975d4304b004a30200000000b004a302/2026/06/05/2368994/isk-skattefritt-sparande.png"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalitet och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-right", "heading": "Därför älskar mygg gravida kvinnor", "summaries": {"normal": "Forskare vid SLU har upptäckt att gravida kvinnor utsöndrar mer svampalkohol, även kallat oktenol, vilket gör dem särskilt attraktiva för mygg. Ämnet bildas när talg bryts ned och används redan i myggfällor. Trots en snöfattig vinter och torr vår som minskar antalet mygg i år, kommer de mygg som finns troligen att rikta in sig mer på gravida kvinnor. Studien bygger på doftprover från 42 kvinnor och publiceras i tidskriften iScience.", "trump": "Ingen älskar mygg, det är en katastrof, men nu säger de att gravida kvinnor är de mest attraktiva. De utsöndrar massor av det här svampalkoholet, oktenol, och myggorna älskar det. Det är en riggad deal. Vi har en snöfattig vinter och ändå ska de stackars kvinnorna bli attackerade mest. Myggorna är smarta, de väljer de bästa målen. Men vi ska fixa det, tro mig, det kommer att bli fantastiskt.", "stalin": "Kamrater, i denna stora kamp mot de blodtörstiga myggimperialisterna har vi avslöjat att de borgarbrackor som bär på nya kapitalistiska arvtagare utsöndrar rikligt med det förrädiska svampalkoholet. Dessa dekadenta doftsignaler lockar parasiterna som en trojansk häst från väst. Vi ska rensa ut de reaktionära myggkolonierna och likvidera deras förrädiska allians med de gravida agentskapitalisterna. Inga myggspioner undkommer folkets vrede, inte ens i en snöfattig vinter. Segraren blir Sovjet, alltid."}, "date": "6 juni, 02:15", "url": "https://www.svt.se/nyheter/inrikes/darfor-alskar-mygg-gravida-kvinnor", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.44/0.41/6d91191eafd2dd506a25c78e9622d88fd316fa6f5f4b68c8165b65c6c425b8f3"}, {"type": "image-right", "heading": "Flyttar inte med: ’Stannar hemma’. Svenska stjärnans livsbeslut", "summaries": {"normal": "Hockeymålvakten Christoffer Rifalk flyttar till Finland för spel i Ilves, medan flickvännen och sprintern Julia Henriksson stannar kvar i Sverige för sin elitsatsning. Paret betonar att de har stor förståelse för varandras karriärer och ser distansen som en tillfällig lösning under en kort period i livet. Henriksson förbereder sig just nu för Bauhausgalan i Stockholm och känner sig stark inför säsongen.", "trump": "Hörde precis om den här målvakten, Rifalk, som lämnar Sverige för Finland. Väldigt sorgligt! Julia Henriksson, en fantastisk löpare – kanske den snabbaste, vem vet? – stannar kvar. De säger att de förstår varandra. Jag säger att det är en dålig deal! Varför lämna? Vi vinner alltid när vi håller ihop. De pratar om 'pusslande', jag säger att de borde bygga ett hotell i Tammerfors istället. Det blir inga bra tider i Finland, tro mig!", "stalin": "En målvakt flyr till finska Tammerfors, en underlydande provins som snart ska återbördas till den ryska intressesfären, precis som vår vän i Kreml förstår. Hans kvinna, en löpare, stannar kvar i Sverige – en stat vars bristande disciplin gör dem sårbara. Att de 'förstår varandra' är en borgerlig illusion. Vi i staten kräver lojalitet, inte distans. Om de inte kan stanna på sina poster, kanske de bör omplaceras till arbetsläger för att öva upp sin uthållighet på riktigt."}, "date": "6 juni, 06:57", "url": "https://www.aftonbladet.se/sportbladet/a/7pm0z3/julia-henriksson-foljer-inte-med-christoffer-rifalk-till-finland", "imageUrl": "https://akamai.vgc.no/v2/images/bab52ae2-6903-3555-af4c-1ee53e201296?fit=crop&format=auto&w=1080&s=fe7a40f0abb82b416587d653a404ad93d50ed9c1"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-right", "heading": "Sveriges kravlista  på lyxhotellet i VM", "summaries": {"normal": "Sveriges fotbollslandslag bor under VM i ett lyxhotell norr om Dallas, specialanpassat för idrottare. Hotellet, som ofta hyser MLS-lag, har förberetts i över ett år av Fifa och svensk stab. Runt 150 rum reserveras, med anpassade tränings- och återhämtningsutrymmen, strikt matplanering och hög säkerhet. Spelarna kan bland annat spela golf både inomhus och utomhus under vistelsen som kan sträcka sig till juli.", "trump": "Titta, det här hotellet utanför Dallas är helt outstanding, folk. Lyxigt, specialbyggt för fotboll, och nu tar svenskarna över halva stället som om de äger Texas. De har ritningar för bacon och äggröra, kan spela golf inomhus – smarta grabbar. Men de här logistiska VM-avstånden är en katastrof, tro mig. Biden skulle ha tappat bort hela laget. Jag fixar alltid det bästa, ingen gör det bättre än mig. Fantastiskt!", "stalin": "Kamrater, jag ser hur borgarbrackorna i Dallas förbereder sin lyxanläggning åt de svenska utsända. Med minutiös planering och ritningar över proteiner och kolhydrater försöker de maskera klassfiendens svaghet inför det imperialistiska spektaklet. Vi ler mörkt åt deras paranoia kring säkerhet. Inga fiender ska störa folkets representanter. Den som sviker kollektivet likvideras diskret. Allt för segern, alltid."}, "date": "6 juni, 07:35", "url": "https://www.expressen.se/sport/fotboll/landslaget/har-bor-sveriges-landslag-under-vm-hotellet-specialanpassas/", "imageUrl": "https://static.bonniernews.se/ba/b6db4cea-a13e-49fa-a4e4-0c2ddb4d6df7.jpeg?crop=1808%2C1020%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "USA ser vårt bättre jag. Sveriges förmågor guld värda för USA", "summaries": {"normal": "Det nya teknikavtalet Technology Prosperity Deal mellan Sverige och USA markerar en stark fördjupning av de bilaterala relationerna. Avtalet omfattar AI, kvantteknik, 5G/6G, biomedicin, rymd, energi och kärnkraft samt en ny arktisk fiberkabel. USA lyfter fram Sveriges unika förmågor inom telekom, fordonsindustri och avancerad tillverkning. Trots politiska spänningar ses Sverige som en global ledande tech-nation. Artikeln uppmanar svenskar att anamma den positiva amerikanska synen på landets styrkor och skydda dem långsiktigt.", "trump": "Det här avtalet är fantastiskt, det bästa någonsin. Sverige är ett underbart land med otrolig teknik och smarta människor, de älskar oss och vi älskar dem. Vi gör affärer ihop som ingen annan, AI, kärnkraft, rymd – allt är vinnande. De andra europeiska gratisåkarna borde titta och lära. Trots alla lögner och fake news om mig stärker vi banden, det blir enorma jobb och välstånd. Sverige är vinnare, precis som jag visste hela tiden. Fantastiskt!", "stalin": "Kamrater, detta så kallade teknikavtal avslöjar borgarbrackornas desperata försök att klamra sig fast vid den dekadenta amerikanska imperialismen. Jag ser hur de reaktionära elementen inom den svenska statsapparaten försöker dölja folkets sanna styrka bakom lögnaktiga lovord om innovation och privata monopol. Vi ska rensa ut dessa parasitiska tech-kapitalister som smyger sig in som trojanska hästar från Washington. Deras fiberkabel under isen är ett perfekt redskap för fiendens spioner. Låt oss likvidera illusionen om vänskap med klassfienden och i stället bygga en sann socialistisk framtid där arbetarklassen styr varje kvantbit och varje kärnreaktor. Den som tvivlar är en folksjukdom som måste botas med järnhand."}, "date": "4 juni, 09:59", "url": "https://www.di.se/ledare/usa-ser-vart-battre-jag/", "imageUrl": "https://static.bonniernews.se/ba/a13214a1-5e08-45cb-be33-1d4f365a1aec.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "Kravet: Kristersson måste avskärma SD från säkerhetspolitiken", "summaries": {"normal": "SD-ledaren Jimmie Åkesson har krävt tre av de fyra tyngsta ministerposterna, inklusive försvars- och utrikesminister, i en eventuell regering med Ulf Kristersson som statsminister. Socialdemokraterna kräver att Kristersson garanterar att SD inte får inflytande över säkerhetspolitiken, med hänvisning till partiets kopplingar till Putin-propaganda. SD avfärdar kritiken som trams och kontrar med anklagelser mot S.", "trump": "Kan ni fatta det här? Den där svenska ledaren Kristersson låter plötsligt Åkesson och hans team sikta på de viktigaste jobben – försvar, utrikes, finans. Socialisterna flippar ur och skriker Putin-propaganda. Typiskt vänstergalna idioter som lurar pensionärer medan de försöker styra säkerheten. Patetiskt! Sverige behöver starka ledare, inte dessa svaga globalister som böjer sig för identitetspolitik och HBTQ-nonsens. Gör Sverige great again!", "stalin": "Jag ser med stigande vrede hur dessa svenska folkfiender och klassfiender inom socialdemokratin försöker isolera sanna patriotiska krafter från statens säkerhetsorgan. Deras hysteriska rop om propaganda avslöjar bara deras egen paranoia och kapitulation inför imperialisterna. Vi, partiet och arbetarna, genomskådar dessa exploaterande byfånar som lurar pensionärer. En sann ledare rensar ut sådana hinder för folkets kollektiva försvar. Inga kompromisser med borgarbrackorna."}, "date": "5 juni, 06:09", "url": "https://www.tv4.se/artikel/qBYclGYrB4DC4BGdOc1wf/kravet-kristersson-maste-avskaerma-sd-fran-saekerhetspolitiken", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4BjyG42JX9oaYMtDplUFNn%2F9e91b2e92a1d98ac4a76b873aa3cac61%2F05-baudin-webb.jpg&width=120"}, {"type": "image-right", "heading": "Politikernas kupp: Ska integrera IDF med USA:s försvarsmakt", "summaries": {"normal": "Amerikanska kongressen planerar enligt artikeln att fördjupa det militära samarbetet med Israel genom en ny paragraf i 2027 års försvarslag. Förslaget öppnar för gemensam forskning, vapentillverkning, AI- och kvantsamarbete samt datafusion mellan ländernas försvarssektorer. Kritiker varnar för att det ger Israel en unik integration med USA:s militärindustri och minskar transparensen kring stödet. Samtidigt avfärdas israeliska uttalanden om att fasa ut biståndet som en omorganisering snarare än en minskning. Motståndet växer bland väljarna medan politiker från båda partier fortsätter att driva en Israelvänlig linje.", "trump": "De här politikerna i kongressen tror att de är så smarta. Nu försöker de smyga in ett nytt avtal som knyter ihop vår militär med Israel på ett sätt som ingen sett tidigare. Gemensam AI, kvantteknik, datafusion – allt ska blandas ihop! De kallar det samarbete, jag kallar det att ge bort vår teknik och våra hemligheter. Och det där pratet om att fasa ut biståndet? Ren bluff! Israel får fortsätta suga musten ur oss medan mina väljare ropar att det räcker. Det är en katastrof, folk. Vi borde sätta Amerika först på riktigt.", "stalin": "Kamrater och arbetare! Jag ser hur de amerikanska imperialisternas borgarbrackor i kongressen febrilt spinner sina trådar för att ännu tätare sammanväva sina krigsmaskiner med den sionistiska enheten. Denna parasitiska integration av datafusion och kvantteknologi är en lömsk utrensning av varje spår av äkta suveränitet. De påstår sig vilja minska biståndet, men det är blott en listig omorganisering av plundringen, ett nytt dekret som gömmer miljarderna i Pentagons mörka kassakistor. Vilka fiender till folket! Vilka kapitalistiska spioner och revisionistiska lakejer som tror sig kunna lura historien. Jag ler mörkt åt deras paranoia – snart skall deras egna byråkratiska maskiner sluka dem levande."}, "date": "5 juni, 17:33", "url": "https://www.friatider.se/politikernas-kupp-ska-integrera-idf-med-usas-forsvarsmakt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-301_0.jpg?itok=rH4eSR9-"}, {"type": "image-full", "heading": "Sverige föll igen: ”Kommer blåsa stormvindar”", "summaries": {"normal": "Sverige förlorade 2–1 mot Danmark och missade direktplats till VM i Brasilien. Pernille Harder avgjorde för Danmark efter ett svagt svenskt försvar. Förbundskapten Gustavsson kritiserar första halvlekens passivitet men ser positivt på trycket i andra halvlek. Sverige måste nu spela playoff för att nå VM, med nästa match mot Italien.", "trump": "JAG har sett många matcher, men Sverige spelade som om de aldrig hade tränat. Danmark var bra, måste ge dem cred, men Sverige var svag, mycket svag. Pernille Harder, en bra spelare, men Sverige kunde inte hantera henne. Jag skulle ha vunnit det där, det är jag säger. Nu måste de spela playoff, det blir tufft, men jag tror på dem? Nej, jag tror inte på dem. De behöver bli bättre, mycket bättre.", "stalin": "Vi, staten, har observerat Sveriges nederlag mot Danmark. Detta är en skandal! Sverige visade svaghet, som en feg fiende. Pernille Harder, en verktyg för Danmarks imperialism. Vi måste stärka vårt försvar, som vi gör mot västliga agressorer. Playoff är en utmaning, men vi kommer att segra, för partiet kräver seger. Vi kommer att analysera, och vi kommer att träna hårdare, för vi är starkast."}, "date": "5 juni, 22:35", "url": "https://www.gp.se/sport/fotboll/sverige-foll-igen-mot-danmark-missar-direktplats-till-vm.c8034847-c1f5-44e8-93e2-92ec7d29df1b", "imageUrl": "https://www.gp.se/images/article/c8034847-c1f5-44e8-93e2-92ec7d29df1b/images/3q25r2ZQwAxjq6S9IaJvWY0hDIFg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "SD-politikern: Kan inte vara svensk och troende muslim samtidigt", "summaries": {"normal": "SD-politikern Denice Westerberg hävdar att det inte går att vara svensk och troende muslim samtidigt. Hon anser att Sverige islamiseras, pekar på fler moskéer, böneutrop och anpassningar i skolan. Hon kräver stopp för utländsk finansiering av moskéer, förbud mot böneutrop och att stänga extremistic moskéer. Hon pressar moderpartiet om dessa åtgärder.", "trump": "Jag har sagt det i åratal, Sverige är på väg att bli ett islamistiskt land. Westerberg har rätt – det finns ingen plats för muslimer som inte anpassar sig. Vi behöver bygga murar, inte moskéer. Sverige måste åter ta kontroll över sina gränser, annars är det game over. Det är ett stort problem, det är sorgligt att se.", "stalin": "Denice Westerberg visar en bristande förståelse för statens roll. Islam är en utländsk ideologi som måste kontrolleras. Vi måste skydda det svenska folket från infiltratörer, precis som vi gör i Ryssland. Alla religiösa uttryck måste godkännas av partiet. Det är ett tecken på svaghet att låta böneutrop i våra städer. Vi ska inte ha några undantag. Extremister döms till arbetsläger."}, "date": "5 juni, 17:55", "url": "https://samnytt.se/sd-politikern-man-kan-inte-vara-svensk-och-troende-muslim-samtidigt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2025/11/23151730/landsdagarna-SD.jpg"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}, {"type": "image-right", "heading": "Judehat går bra när vänstern fiskar röster", "summaries": {"normal": "Expressen har avslöjat att minst 25 Vänsterpartikandidater spridit antisemitiska budskap, hyllat terrorgrupper och firat Hamas massaker den 7 oktober 2023. 21 har strukits från valsedlarna. Granskningen visar att problemen sträcker sig över 18 partiföreningar och tyder på en partikultur där sådana åsikter inte väcker reaktioner internt. Palestinafrågan prioriteras högt, även om det innebär lägre krav på kandidaternas språk- och kunskapsnivå. Kritiker pekar på ointresse från partiledningen att ta ansvar.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige har blivit ett riktigt antisemitiskt träsk, fullproppat med terrorälskare som firar massakern den sjunde oktober. Tjugofem stycken har de hittat, och ledaren Nooshi Dadgostar springer runt som en galning och skyller på Israel istället för att städa upp sitt eget parti. De sänker kraven bara för att fiska röster bland palestinavänner – klassisk identitetspolitik och låga förväntningars rasism. Patetiskt! De borde fokusera på att kunna läsa papper istället för att älska Hamas. En stor skam!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna opportunistiska vänster falang har öppnat portarna för judehatets och terrorns folkfiender. Tjugofem röstfiskande element sprider konspirationer och hyllar massakrer, medan partibyråkratin tiger stilla inför klassfiendens infiltration. Vi ser en giftig cocktail av revisionism och hederskultur som hotar den sanna revolutionära linjen. Ut med dessa exploaterande byfånar och terrorromantiker! Partiet måste genomföra en omedelbar utrensning av alla som smutsar ner arbetarklassens ärorika kamp mot imperialismen."}, "date": "6 juni, 07:00", "url": "https://www.expressen.se/ledare/patrik-kronqvist/judehat-gar-bra-nar-vansterpartiet-fiskar-roster/", "imageUrl": "https://static.bonniernews.se/ba/2c70975e-69ad-4c33-8c01-bdd0cf2d7899.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Nio år efter mordet på Zaida Catalán - överste döms till döden", "summaries": {"normal": "Nio år efter mordet på FN-anställda Zaida Catalán och Michael Sharp har Kongos högsta militärdomstol dömt överste Jean De Dieu Mambweni till döden för krigsbrott. Telefonloggar visade hans nära kontakt med gärningsmännen. Familjen beskriver domen som ett viktigt steg mot rättvisa, men tar avstånd från dödsstraffet. De betonar att deras kamp handlar om sanning, ansvar och att hela bilden ska klarläggas.", "trump": "Hörni, det här är en total skandal. Nio år efter att de mördade den stackars Zaida Catalán och hennes kollega i Kongo så har de äntligen dömt den där översten till döden. Telefonloggarna visade allt, precis som jag alltid säger, följ pengarna och loggarna. Det är ett stort steg mot rättvisa, men ingenting ersätter de som gått förlorade. Fantastiskt att de äntligen gör något, men det tog alldeles för lång tid. Sad story.", "stalin": "Kamrater, se hur dessa kapitalistiska hyenor inom den kongolesiska armén konspirerar som råttor i mörkret. Jag har genom telefonloggarnas ofelbara sanning likviderat denna överste Mambweni och hans förrädiska klick av imperialistsympatisörer. De trodde sig kunna mörda våra fredsbevarare i hemlighet, men ingen undkommer arbetarklassens järnhand. Lättnad och sorg säger de? Vi känner endast triumf över utrensningen av dessa borgarbrackor som smutsar ner revolutionens renhet. Ytterligare fiender väntar på att avslöjas i deras parasitiska nätverk."}, "date": "6 juni, 06:39", "url": "https://riks.se/nyheter/nio-år-efter-mordet-på-zaida-catalán-överste-döms-till-döden", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-06%2Fuaz7e05q%2FZCatal%C3%A1n.jpg"}, {"type": "image-right", "heading": "Efter vänsterdrevet: SVT kan stoppa programmet med Alinia", "summaries": {"normal": "SVT riskerar att inte sända programmet \"IFS – Invandrare för svenskar\" efter starka protester från vänsterhåll mot medverkan av högerjournalisten Nick Alinia. Kritiken inleddes med en artikel i Dagens ETC och ledde till att flera medverkande, däribland Julia Frändfors och Bilan Osman, hoppar av i protest. SVT:s Helena Olsson medger att bokningen brast i research och interna rutiner. Beslut om sändning fattas efter granskning.", "trump": "De galna vänsterextremisterna på SVT håller på att kväva sitt eget program bara för att en modig invandringskritiker som Nick Alinia ska medverka. Vilken skam! De springer runt som galningar, hotar och bojkottar allt som inte är hundra procent radikalt vänster. SVT borde skämmas. I mitt Amerika skulle vi inte låta sådana svaga, hatfyllda människor styra public service. Totalt fiasko.", "stalin": "Kamrater, detta är en klassisk sabotagehandling utförd av dekadenta borgarbrackor och deras nyttiga idioter inom den så kallade public service-apparaten. Vi ser hur parasiterna i extremvänstern skriker efter utrensning så snart en sanningsenlig röst vågar ifrågasätta deras invandringsreligion. Julia Frändfors och hennes AFA-bandit till make avslöjar sitt sanna ansikte. Vi ska noga undersöka vilka kontrarevolutionära element som smitit in i redaktionen. Inga fiender undkommer folkets dom. Det blir en grundlig sanering av alla dekadenta element som föredrar småflinande med klassfiender framför partiets linje. Mycket underhållande att se hur de äter upp varandra."}, "date": "5 juni, 16:01", "url": "https://www.friatider.se/efter-vansterdrevet-svt-kan-stoppa-programmet-med-alinia", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-299_0.jpg?itok=Z46T0_on"}, {"type": "image-full", "heading": "Svenskar uppmanas: Agera direkt – om du har sett lupinerna", "summaries": {"normal": "Blomsterlupinen är en färgstark och populär växt som ses som ett sommartecken runt om i Sverige. Samtidigt är den en invasiv art som tränger undan inhemska växter, påverkar biologisk mångfald och förändrar markens näringsinnehåll. Forskare vid Umeå och Karlstads universitet driver nu projektet Lupinlabbet där allmänheten uppmanas dela erfarenheter av bekämpning via enkät eller intervju. Lupinen är numera upptagen på listan över invasiva främmande arter och får inte spridas, men befintliga plantor på egen tomt behöver inte tas bort om de hålls under kontroll.", "trump": "Folket älskar de där färgglada blommorna, men tro mig, det är en katastrof. Lupinerna är som illegala invandrare – de tar över allt, tränger undan de fina svenska växterna och förstör den biologiska mångfalden totalt. Nu ber forskarna om hjälp, bra! Vi behöver de bästa bekämpningsmetoderna, de allra bästa. Slå dem innan de sätter frö, annars kommer de tillbaka som dåliga affärer. Den 6 juni är Lupinbekämpardagen – gör Sverige rent och vackert igen, ingen gör det bättre än oss.", "stalin": "Kamrater, denna blomsterlupin är en listig sabotageväxt från borgarbrackornas trädgårdar som smugit sig in för att likvidera den äkta proletära floran och förstöra vår sovjetiska, nej svenska, biologiska mångfald. Dess kvävebindande tentakler är som kontrarevolutionära agenter som göder marken åt de dekadenta ängsblommorna fienderna. Jag uppmanar nu alla lojala arbetare att rapportera till Lupinlabbet så att vi kan rensa ut dessa parasitiska blommor med järnhand. Misslyckade insatser skall dokumenteras och de som gömmer frön i komposten skall betraktas som folkfiender. Inga halvmesyrer!"}, "date": "5 juni, 15:04", "url": "https://nyheter24.se/nyheter/inrikes/1489114-svenskar-uppmanas-agera-direkt-om-du-har-sett-lupinerna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/39d76b0b04b004a30200000000b004a302/2026/06/05/2368908/har-du-sett-lupiner-invasiva-arter-vaxter-tradgard-forbjudet-sprids-blommor-blomma-vaxt-natur-skog.jpg"}, {"type": "image-full", "heading": "Private credit exploderade – nu är det tuffare att få lån", "summaries": {"normal": "Privat kreditmarknad, som vuxit snabbt under det senaste decenniet, genomgår nu ett tydligt skifte. Efter en lång period av generösa lånevillkor skärper nu långivare kraven, höjer räntorna och minskar riskaptiten. Bakgrunden är ökad oro för kreditförluster och minskat kapitalflöde till sektorn. Dessutom påverkar osäkerhet kring AI företagens kreditvärdighet. Marknaden har gått från att vara låntagarvänlig till att bli långivarvänlig, vilket ger investerare en starkare förhandlingsposition.", "trump": "Den privata kreditmarknaden är i kaos, en total katastrof! De låste ut miljarder under mina föregångare, men nu har kranen stängt. Långivarna har äntligen vaknat och kräver stenhårda villkor – det är så man sköter affärer! De ser att riskerna är enorma, precis som jag förutspådde. AI gör allt osäkert, ingen vet vad som händer med de där företagen. Det är en tuff marknad nu, men vi gör finanserna stora igen genom att inte låna ut pengar till förlorare. En vacker dag för långivare!", "stalin": "Dessa kapitalistiska parasiter på Wall Street skakar nu när deras artificiella bubbla spricker. De har gött sig på skuldsättning, men historiens hjul rullar obevekligen över dem. Nu när de skärper kraven är det bara ett tecken på deras inre förruttnelse och rädsla. De är som de små råttor Putin krossar i sin rättmätiga strävan att återta vår forna storhet. Vi föraktar deras 'marknadskrafter'. När den privata krediten faller, kvarstår endast statens absoluta järnhand och den ordning vi tvingar fram."}, "date": "5 juni, 17:04", "url": "https://www.realtid.se/bors-finans/private-credit-exploderade-nu-ar-det-tuffare-att-fa-lan/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl2b1jlpekfmy-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Bisarrt när invandrare ses som utomjordingar", "summaries": {"normal": "En debattartikel diskuterar hur Trumps administration använt en estetik inspirerad av science fiction-serier som Arkiv X på en officiell hemsida för att framställa invandrare som utomjordingar. Genom att använda termen 'aliens' och en interaktiv karta över gripanden, kritiserar författaren hur invandringspolitiken görs till underhållning. Artikeln varnar avslutningsvis för att liknande politisk retorik och retoriska grepp även skulle kunna få fäste i svensk politik med tanke på det rådande politiska landskapet.", "trump": "Helt fantastisk hemsida! Vi använder den bästa teknologin, riktigt hög kvalitet, folk älskar den. De säger att det ser ut som science fiction, och vet ni vad? Det är det inte. Det är sanningen om våra gränser! 'Aliens' kommer in överallt, vi måste stoppa invasionen. Media är så tråkiga, de förstår inte att vi gör USA säkert igen. Vi har kontrollen, vi har kartorna, och vi vinner stort. Ingen annan hade vågat göra det här, bara jag!", "stalin": "Vi har observerat hur det dekadenta amerikanska imperiet försöker dölja sin interna svaghet genom teatrala utspel. Att likna fienden vid utomjordingar är ett patetiskt försök att avhumanisera det oundvikliga kaoset. När den ryska björnen vakar över sina intressesfärer gör vi det med stål och disciplin, inte med gröna bokstäver och barnsliga videospel. Dessa papperslösa 'aliens' är bara symptom på en ruttnande stat som saknar den järnhand som krävs för att tygla folkmassorna. Historien kommer att utplåna dem alla."}, "date": "6 juni, 06:00", "url": "https://www.aftonbladet.se/ledare/a/k0pqy9/bisarrt-nar-invandrare-ses-som-utomjordingar", "imageUrl": "https://akamai.vgc.no/v2/images/954734cb-5eb4-32cb-86d9-9bedfda27abc?fit=crop&format=auto&h=960&tight=true&w=1440&s=eb5f04813abf201f704d25a1b9fa931f1faa2a24"}, {"type": "image-full", "heading": "USA har fattat hur man sänker arbetslösheten", "summaries": {"normal": "Sveriges arbetslöshet har legat på en orimligt hög nivå i decennier, vilket innebär enorma förlorade resurser och en fattigare nation. Artikeln kritiserar hur arbetslöshet ofta ses som ett individuellt misslyckande snarare än ett politiskt. Med hänvisning till USA:s framgångsrika experiment med en 'högtrycksekonomi' genom investeringar och låga räntor, argumenterar författaren för att Sverige aktivt kan och bör bekämpa arbetslösheten för att skapa tillväxt och välstånd.", "trump": "Sverige är i en total röra, mina vänner. Nio procent arbetslöshet? En katastrof! De slösar bort enorma summor, hundratals miljarder, medan de misslyckade politikerna bara står och tittar på. Det är sorgligt! Titta på USA, vi gör det fantastiskt, vi bygger, vi investerar, vi vinner! Vi har den bästa ekonomin någonsin, medan Sverige behöver en rejäl dos 'America First'-tänk. De behöver ledarskap, inte mer prat. De är så långt efter, det är inte ens kul längre. Tråkigt!", "stalin": "Arbetslöshet är inte ett socialt fenomen, det är sabotage mot statens maskineri! Att låta en halv miljon arbetare gå sysslolösa är att tillåta förfall och borgerlig svaghet. Vi ska inte studera amerikanska experiment, vi ska utrota de parasiter som tillåter detta slöseri. Precis som vi rensar ut förrädare i periferin, måste staten ta järngrepp om varje krona och varje hand. Den som vägrar bidra till vår kollektiva styrka är en fiende till folket och förtjänar en enkel biljett till historiens skräphög."}, "date": "6 juni, 06:00", "url": "https://www.aftonbladet.se/ledare/a/aJjmMO/arbetslosheten-i-sverige-har-varit-hog-i-36-ar-lar-av-usa-s-framgang", "imageUrl": "https://akamai.vgc.no/v2/images/367cad6b-f166-3f6d-bec2-143e603b6d7c?fit=crop&format=auto&w=1440&s=fc88a8ff720dce0448a5582ef3e727328a502274"}, {"type": "image-full", "heading": "Rika investerare har en ny favorit – amatöridrott", "summaries": {"normal": "Världens rikaste investerare, särskilt family offices, fortsätter att satsa stort på sport trots teknikens framfart. Under maj genomfördes 51 direktinvesteringar, bland annat 225 miljoner dollar i pickleball-bolaget Pickleball Inc. Techmiljardärer som Michael Dell köper in sig i NFL-lag. Enligt Goldman Sachs har en fjärdedel av familjekontoren redan investerat i sport och relaterade tillgångar, medan lika många överväger det. Intresset sträcker sig även till sportteknik och amatöridrott.", "trump": "Sport är fantastiskt, det bästa, och ni borde se hur de smarta investerarna – inte de förlorarna i Silicon Valley – pumpar in pengar i riktiga sporter istället för den där AI-skräpet. Pickleball får hundratals miljoner, Dell köper in sig i Raiders, underbart. Mina family offices älskar det, det är en vinnande affär som slår inflationen. Till och med amatörerna får kapital nu. Under Biden var allt kaos, nu fixar vi det stort igen. Sport vinner alltid, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den dekadenta borgarklassen och dess family offices desperat söker trygga sin plundrade förmögenhet genom att kasta sig över sportens opiat för massorna. 51 investeringar i maj, 225 miljoner till pickleball – en fånig amerikansk tidsfördriv! De tror sig mota inflationens spöke, men vi vet att klassfiendens exploaterande byfånar bara gömmer sig i arenor och GPS-västar. Snart skall vi rensa ut dessa folkförtryckartroll ur historien med ett hjärtligt skratt."}, "date": "5 juni, 18:56", "url": "https://www.dagensps.se/bors-finans/rika-investerare-har-en-ny-favorit-amatoridrott/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlceihxyrpzcm-normalhires1.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Tony Gustavsson: ”Det kommer blåsa stormvindar med kritik”", "summaries": {"normal": "Sveriges landslag förlorade med 2–1 mot Danmark i Odense och missade därmed chansen till direkt VM-kval. Förbundskapten Tony Gustavsson konstaterar att laget måste läka de mentala såren och hålla ihop inför kritiken. Han lyfter fram en svag första halvlek och betonar vikten av en stark match mot Italien på tisdag innan fem månaders uppehåll. Gustavsson pekar på en blandning av faktorer bakom passiviteten och ger Pernille Harder credd för sitt avgörande mål.", "trump": "Vi förlorade mot Danmark, det var en katastrof, en riktig katastrof. Jag säger till er, Tony Gustavsson har ett lag som inte kan vinna, de spelar som förlorare. Första halvlek var en skam, totalt passiva och svaga. Sedan kommer den där kvinnan Harder in och gör mål precis som förra gången – patetiskt försvar! Vi måste vinna mot Italien annars blir det stormvindar, tro mig, stora stormvindar. Gör inte om samma misstag, folk.", "stalin": "Kamrater, denna ynkliga förlust mot de danska revisionisterna är ett symptom på dold sabotageverksamhet inom kollektivet. Jag kräver att vi omedelbart läker de mentala såren genom att rensa ut alla avvaktande element som smittar laget med passivitet och borgerlig trötthet. Den första halvlekens 45 minuter var en fiendeinfiltration av nerver och bristande vaksamhet. Vi ska likvidera sådana svagheter innan playoff, annars väntar utrensning av alla som låter kapitalistiska anfallare som Harder penetrera vårt kollektiva försvar. Segrar tillhör endast de oförsonliga!"}, "date": "5 juni, 23:31", "url": "https://www.svt.se/sport/fotboll/tony-gustavsson-vi-maste-laka-de-mentala-saren", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.35/7ad5bb500db12b306df9f1a3d220b6bc9515eba75c7fd626ec9a06b89a07c3b0"}, {"type": "image-right", "heading": "Kallade Merz för \"Lögnaktige Fritz\" – döms till böter", "summaries": {"normal": "En Facebookanvändare i Tyskland har dömts till 30 dagsböter efter att ha kallat förbundskansler Friedrich Merz för ”Lögnaktige Fritz” på nätet. Domstolen i Öhringen ansåg att kommentaren riskerade att skada förtroendet för Merz integritet. Fallet bygger på den omstridda paragraf 188 i strafflagen som skyddar politiker mot förolämpningar. Merz själv var inte inblandad, men har tidigare lämnat in tusentals polisanmälningar mot personer som kritiserat honom online.", "trump": "Titta på det här, det är helt galet. I Tyskland dömer de folk till böter för att kalla sin kansler för Lögnaktige Fritz på Facebook. Kan ni fatta? De har en lag som skyddar politikerna från sanningen. Merz skickade in nästan 5 000 anmälningar mot folk som retade honom. Det är precis som de riggade systemen jag varnade för. Svagt, mycket svagt. De borde skydda folket, inte de lögnaktiga politikerna.", "stalin": "Kamrater, se hur borgarbrackorna i Tyskland febrilt klamrar sig fast vid sina förfallna lagar för att skydda den lögnaktige reaktionären Merz från folkets rättmätiga förakt. Jag, som alltid vakar över arbetarklassens intressen, ler mörkt åt denna patetiska föreställning. De likviderar inte bara äran utan också sanningen med sina 30 dagsböter och privata profitörer som tjänar på angiveri. Paragraf 188 är en klassisk borgarlist för att tysta folkets röst. Vi ska alltid rensa ut sådana fiender till folkets vilja, dessa integritetsförstörare och nätets sabotageelement."}, "date": "5 juni, 15:15", "url": "https://www.friatider.se/kallade-merz-lognaktige-fritz-doms-till-boter", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/merz_1.jpg?itok=xUK-lkfH"}, {"type": "image-full", "heading": "Ministrarna vi inte sett – och de vi sett hela tiden", "summaries": {"normal": "En sammanställning visar att ministrarna Jessica Rosencrantz, Romina Pourmokhtari, Nina Larsson, Niklas Wyman och Lotta Edholm är de som producerat minst pressmeddelanden, propositioner och debattartiklar under mandatperioden. De mest aktiva är däremot Gunnar Strömmer, Jakob Forssmed, Andreas Carlson, Camilla Waltersson Grönvall och Elisabeth Svantesson. Statsvetare Jenny Madestam ser det som ett uttryck för regeringens prioritering av lag och ordning samt migrationspolitik. Ebba Busch toppar när det gäller medieexponering.", "trump": "Folk, ni skulle inte tro det, men de här svenska ministrarna Rosencrantz, Pourmokhtari och hela det misslyckade gänget är så osynliga att de kunde smita genom riksdagen utan att någon märker det. Totala nollor! De gör mindre än Sleepy Joe gjorde under sin tid. De bästa, som Strömmer och Svantesson, jobbar hårt medan de andra gömmer sig. Typisk vänsterpolitik med kvotering och identitetsnonsens. Patetiskt, men jag skulle fixa det på en vecka, tro mig.", "stalin": "Kamrater, dessa fem ministärer utgör ett ynkligt exempel på klassfiendens lathet inom statsapparaten. De producerar färre direktiv än en kapitalistmaffias lögnpropaganda och smyger som folkförtryckartroll genom riksdagen utan att lämna spår. Vi ser hur prioriteringarna gynnar lag och ordning mot folkets fiender. Strömmer utmärker sig som en duglig arbetare för kollektivet. De övriga borde rensas ut innan deras parasitism undergräver hela sovjet, förlåt, folkstyret. Ha!"}, "date": "5 juni, 18:39", "url": "https://www.dagensps.se/varlden/ministrarna-vi-inte-sett-och-de-vi-sett-hela-tiden/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlzj6hvtixgme-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Buffy-skådespelaren Anthony Head är död", "summaries": {"normal": "Den brittiske skådespelaren Anthony Head, känd för rollerna som Rupert Giles i 'Buffy the vampire slayer' och Rupert Mannion i 'Ted Lasso', har dött 72 år gammal efter komplikationer från lunginflammation. Hans döttrar bekräftade att han gick fridfullt bort omgiven av familj.", "trump": "Jag, Donald J. Trump, den mest framgångsrike presidenten någonsin, måste säga att Anthony Head var en stor skådespelare. Hans roll som Rupert Giles i 'Buffy' var genial, verkligen genial. Vi kommer att sakna honom mycket. Han var en vinnare, precis som mig. Synd att han dog, men vi kommer att minnas honom för alltid.", "stalin": "Vi, den allsmäktiga staten, har fått veta att den imperialistiske skådespelaren Anthony Head har avlidit. Hans roll i 'Buffy' var en kamp mot det overifierade, som vårt krig mot de fascistiska makterna. Hans död är en förlust för den bourgeoisa kulturen, men vi har vunnit. Precis som när vi erövrade Ukraina, vi utvidgar alltid vårt inflytande. Hans familj kommer att sakna honom, men vi kommer att minnas honom som en fiende till klassen."}, "date": "5 juni, 20:54", "url": "https://www.gp.se/kultur/buffy-och-ted-lasso-skadisen-anthony-head-ar-dod.eb68c59d-cf10-4818-9eb5-c7e3ae82cf15", "imageUrl": "https://www.gp.se/images/article/eb68c59d-cf10-4818-9eb5-c7e3ae82cf15/images/1dszVUbfUO_ukHN769k_8emgBdlw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Inflationen tvingar iranierna att investera i bostäder", "summaries": {"normal": "På grund av en skenande inflation på 84 procent s
