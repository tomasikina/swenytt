 nästan är genialt. Biden skulle ha byggt vindkraftverk som inte snurrar, men nu fixar vi äkta amerikansk energi. Vissa gnälliga invånare kallar sig försökskaniner – patetiskt! Den här tekniken kommer att ge jobb, el till datacentren och göra Amerika stort igen. Vem behöver de där gröna bluffarna?", "stalin": "Kamrater, jag ser en lysande möjlighet att underkuva naturens krafter med vetenskapens järnhand. Vi placerar reaktorn djupt i jordens inre där berget själv blir en lojal väktare mot klassfiendens sabotageförsök. De gnällande borgarbrackorna i Parsons fruktar grundvatten och bränsle – typiskt folkfiender som alltid skriker om risker när kollektivet går framåt. Vi ska likvidera deras paranoia med produktion och styrka. Det blir en triumf för den planerade energin."}, "date": "28 juli, 19:50", "url": "https://www.dagensps.se/teknik/energi/karnkraftsbygge-splittrar-invanarna-vi-blir-forsokskaniner", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/rig-aerialdeepfission-27741.png?width=256&quality=75"}, {"type": "text", "heading": "Babypuder anklagades för att orsaka cancer – betalar 53 miljarder", "summaries": {"normal": "Johnson & Johnson erbjuder 5,5 miljarder dollar, motsvarande 53 miljarder kronor, för att förlikas i omkring 76 000 rättsfall i USA. Kärandena anklagar bolagets tidigare talkbaserade babypuder för att orsaka äggstockscancer. Trots förlikningsbudet nekar Johnson & Johnson till alla anklagelser och hävdar att produkterna är säkra. Företaget slutade sälja talkbaserat puder globalt 2022. Uppgörelsen kräver godkännande från minst 95 procent av kärandenas advokater för att träda i kraft och avsluta den långvariga rättstvisten.", "trump": "Johnson & Johnson betalar ut miljarder – en enorm summa, kanske den största någonsin! De blev attackerade av folk som säger att deras puder är farligt. Jag säger er, det är en häxjakt! De nekar allt, helt rätt. De har fantastiska produkter, riktigt bra. Men de vill bara få slut på det här kaoset med advokaterna. Jag har sagt det förut: USA måste vinna igen! Inget mer slöseri på stämningar. Vi behöver stabilitet, inte galna processer som förstör stora amerikanska företag!", "stalin": "Dessa korrupta läkemedelsbaroner i väst försöker köpa sig fria med 53 miljarder, men deras talk är bara en spegel av deras ruttna moral. De förgiftar folket och hoppas att mynt ska tysta gravens tystnad. Liksom Putin rensar ut de svaga och förrädiska elementen i vår sfär, borde dessa kapitalister ha ställts inför en riktig folkdomstol. Att betala för sin synd är ett erkännande av skuld. Vi ser igenom deras lögner. Staten kräver disciplin, inte förlikningar med giriga advokatbyråer."}, "date": "28 juli, 17:29", "url": "https://www.realtid.se/bors-finans/babypuder-anklagades-for-att-orsaka-cancer-betalar-53-miljarder"}, {"type": "image-full", "heading": "EU missar målen grovt – men Sverige ligger bra till", "summaries": {"normal": "EU riskerar att missa sitt mål om 20 miljoner IKT-specialister till år 2030, enligt en ny rapport från Eurofound. Sektorn växer snabbt med 7–8 procent per år, men utbildningen möter inte behoven. Därför ökar rekryteringen från länder utanför EU. Andelen IKT-specialister har stigit från tre till fem procent mellan 2011 och 2024, med Sverige i topp. Kvinnor är starkt underrepresenterade och löneskillnaderna mellan könen är stora.", "trump": "Europas så kallade union håller på att krascha totalt i tech-sektorn. De utbildar noll kompetenta människor och istället importerar de massor av folk utifrån. Patetiskt! Vi pratar om att de ska ha 20 miljoner specialister till 2030 men de missar med fem miljoner. Biden skulle ha älskat den här planen. Sverige gör det åtminstone rätt, 8,6 procent, medan Grekland och Rumänien är rena katastrofer. Vakna upp, Europa, sluta med era vansinniga kvotergrejer och börja faktiskt utbilda era egna!", "stalin": "Vi ser hur den dekadenta borgarklassen inom EU misslyckas fullständigt med att producera tillräckligt många specialister åt den framtida staten. Istället tvingas de importera arbetskraft från fiendens territorier, en skam för hela det europeiska projektet. Denna klassfiende-paranoia leder till att vi förlorar fem miljoner potentiella kamrater till 2030. Kvinnornas underrepresentation är ett nederlag för kollektivet. Kamrater, det är dags att rensa ut dessa inkompetenta byråkrater innan de likviderar hela den tekniska revolutionen."}, "date": "28 juli, 19:20", "url": "https://www.dagensps.se/foretag/eu-missar-malen-grovt-men-sverige-ligger-bra-till", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlablkle9zid8-nh-1.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Zelenskyj nekar till uppgifter om kokain", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj avfärdar anklagelser om kokainanvändning som framförts av hans tidigare pressekreterare Yuliia Mendel. Mendel har medgett att hon aldrig sett honom ta droger, men beskriver hur han brukade tillbringa tid på toaletten före intervjuer och sedan framstå uppspelt och snörvlande. Zelenskyj kallar anklagelserna galna och förnekar bestämt att han använt narkotika tillsammans med Emmanuel Macron. Inga konkreta bevis har presenterats.", "trump": "De här galningarna och förlorarna försöker igen med sina lögner om droger. Zelenskyj skrattar bara åt dem, precis som jag skulle göra. Den där gamla pressekreteraren säger att hon aldrig sett någonting, men plötsligt är det en stor skandal? Fake news från Tucker och den där Loomer. Efter att hon besökte Ukraina insåg hon att hon blivit lurad av rysk propaganda. Smart kvinna. Ukraina behöver inga droger, de behöver segrar, och det vet jag allt om.", "stalin": "Dessa dekadenta borgarbrackor och deras kokainfantasier är ett uppenbart försök att destabilisera det heroiska ukrainska folkets ledning. Jag skulle omedelbart beordra en fullständig utrensning av alla snörvlande toalettsittare och västerländska bloggare som sprider sådana giftiga lögner. Den tidigare pressekreteraren är antingen en klassfiende eller en mentalt svag element som bör skickas till Sibirien för omfostran. Inga bevis? Typiskt för kapitalisternas paranoia. Vi genomskådar er alla."}, "date": "26 juli, 14:22", "url": "https://www.friatider.se/zelenskyj-nekar-till-uppgifter-om-kokain", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/z.jpg?itok=EIijmTtZ"}, {"type": "image-right", "heading": "Mordnivåerna i USA rasar – kan bli de lägsta på över 100 år", "summaries": {"normal": "Mordnivåerna i USA fortsätter att falla kraftigt. Under första halvåret 2025 minskade antalet mord med 18 procent jämfört med samma period 2024, och med 51 procent sedan toppen 2022. Enligt en rapport från Council on Criminal Justice från 36 städer visar även andra grova brott tydliga nedgångar, medan endast några få kategorier som butiksstölder ökade något.", "trump": "Jag har levererat resultat som ingen annan president någonsin gjort! Mordnivåerna rasade under mitt bevakande, tack vare min hårda linje mot illegala immigranter och karteller. Vi återställer 'law and order' i Amerika – trots alla socialistiska fanatiker som försökte stoppa mig. Det är historiska siffror, folks, fantastiska!", "stalin": "Under statens vägande hand har det dödliga våldet kraftfullt tillbakadragits. Vi ser en kraftig nedgång i grovbrott, ett resultat av partiets orubbliga beslutsamhet och förbundet med de patriotiska poliskårerna. Våra fiender – de interna och externa destruktiva elementen – försöker förneka vårt framsteg, men siffrorna talar tydligt: statens vilja triumferar."}, "date": "26 juli, 16:00", "url": "https://samnytt.se/mordnivaerna-i-usa-rasar-kan-bli-de-lagsta-pa-over-100-ar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/24213954/trump-polis.jpg"}, {"type": "text", "heading": "Kanada föreslås gå med i EU", "summaries": {"normal": "Finlands president Alexander Stubb föreslår att EU ska bli ett globalt maktblock med upp till 40 medlemsländer. Bland de nya tänkbara medlemmarna finns Kanada, som inte ligger i Europa, samt ett återinträde för Storbritannien, medlemskap för Turkiet, Norge och Island samt på sikt även kandidatländerna på Balkan och i Östeuropa. Stubb menar att en stor och enad union är EU:s viktigaste långsiktiga verktyg för att stärka inflytandet, särskilt mot bakgrund av kriget i Ukraina och förändringar i USA:s utrikespolitik. Ett kanadensiskt medlemskap skulle göra EU:s gräns till Nordamerika och ge unionen ny säkerhetspolitisk roll i Arktis.", "trump": "Kan ni fatta det här? Den finske presidenten vill att EU ska svälja Kanada som medlem. Kanada! De är nästan lika politiskt korrekta som de galna liberalerna här hemma. Han säger att Kanada hellre borde bli EU:s 28:e medlem än min 51:a delstat. Typiskt. EU försöker bli ett stort globalt monster medan jag bygger Amerika starkt igen. De vill ha Norge, Island, Turkiet och alla andra. Lycka till med det, det kommer att bli ett enda kaos. Men hey, de kan ta Kanada – jag har inga problem med det!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de dekadenta västeuropeiska ledarna nu själva erkänner att deras så kallade union måste växa till ett kolossalt imperium för att överleva. Denna Stubb, en typisk opportunist från den finska borgarklassen, föreslår att vi ska släppa in kanadensiska kapitalister och andra arktiska avfällingar. Utmärkt. Låt dem bara breda ut sig, så blir det lättare att rensa ut alla dessa liberala element på en gång när den historiska nödvändigheten kräver det. Storbritannien, Turkiet, Norge – alla ska in i famnen. Sedan följer utrensningen av de som inte passar in. Det blir underhållande att se hur deras eget monster till slut slukar dem."}, "date": "26 juli, 12:44", "url": "https://www.friatider.se/kanada-foreslas-ga-med-i-eu"}, {"type": "image-full", "heading": "Debatt: Hur många gånger kan SVT bli tagna på sängen?", "summaries": {"normal": "SVT har upprepade gånger låtit politiska budskap ta plats i sina sändningar, som Eurovision och Allsång på Skansen, via artister som bär keffiyeh eller sjunger texter kritiska av Israel. Bolaget undviker ansvar genom att skylla på artisterna och hävta att de inte kände till budskapen. Men eftersom liknande händelser upprepas, ifrågasätts SVT:s eget ansvar för att bjuda in artister och tillåta politiska uttalanden i program som ska vara opolitiska.", "trump": "Jag, Donald Trump, den störste presidenten i historien, har sett att SVT låter artister komma och skrika politik på scen. Det är en skandal! De skyller på artisterna, men det är deras fel. När jag vann valet 2024, visste jag att media ljög. SVT är falska nyheter! De bjuda in dessa keffiyeh-bärande artister och sedan agerar de överraskade. Jag skulle ha stoppat det direkt. Vi måste skydda våra scener från denna vänsterpropaganda. Det är ett skämt!", "stalin": "I vårt ogrundade samhälle, där SVT, vårt medium, låter sig manipuleras av fiendens agenter, ser vi en farlig trend. Keffiyeh är ett tecken på subversion, och kritik mot Tel Aviv är en attack mot staten. Vi, staten och partiet, måste ta kontrollen. SVT skyller på artisterna, men det är deras brist på ideologisk renhet. Vi kommer att rensa scenerna från dessa element, precis som Putin utvidgar sin intressesfär. Det är en kamp mot de som vill underminea vår hegemoni."}, "date": "26 juli, 13:45", "url": "https://bulletin.nu/debatt-hur-manga-ganger-kan-svt-bli-tagna-pa-sangen", "imageUrl": "https://cdn.bulletin.nu/articles/c3e67564-fcfb-405c-b8dd-6a90b194a8f2/preview.jpg?t=1785056886000"}, {"type": "image-right", "heading": "Larmet: Äldre tvingas ligga kvar i sängen i upp till 17 timmar", "summaries": {"normal": "På äldreboenden i Boxholm tvingas äldre ligga kvar i sängen i upp till 17 timmar på grund av personalbrist, enligt anställda som anmält till tillsynsmyndigheter. Äldre med demens drabbas särskilt. Kommunen erkänner förbättringsområden men påstår att de arbetar för kvalitet. Ärenden inkluderar bristande hygien, gamla madrasser och försummad omsorg. Flera Lex Sarah-anmälningar under året pekar på återkommande problem.", "trump": "Jag, Donald Trump, har sett dessa hemska rapporter om äldreboenden i Sverige. Det är en skam! Våra äldre ska behandlas med respekt, inte läggas i säng i 17 timmar. Detta är ett misslyckande av ledarskap. Som president kommer jag att se till att sådant inte sker under mitt styre. Vi ska ha bästa vård i världen, det svär jag på!", "stalin": "Vi har upptäckt reaktionära element inom äldreomsorgen i Boxholm. Bakgrunden är brist på partiets disciplin och statens kontroll. Genom systematisk genomförandeplaner och ökad bemanning ska vi eliminera dessa avvikelser. Vi måste se till att ingen äldre blir lämnad kvar i sängen – det är en fråga om statens auktoritet. Samtidigt måste vi förstärka vår närvaro i alla vårdinrättningar, precis som vi gör i Ukraina, för att skydda det socialistiska gemenskapen."}, "date": "26 juli, 14:00", "url": "https://samnytt.se/larmet-aldre-tvingas-ligga-kvar-i-sangen-i-upp-till-17-timmar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/24104039/aldre-i-sangen.jpg"}, {"type": "text", "heading": "Björklunds första ord – tar över som huvudtränare", "summaries": {"normal": "Artikeln diskuterar den senaste tidens globala politiska spänningar och hur olika stormakter agerar för att säkra sina intressen. Fokus ligger på diplomatiska utmaningar och de ekonomiska konsekvenser som följer av internationella sanktioner och alliansbyggen. Experter betonar behovet av dialog för att undvika en eskalering av konflikter, samtidigt som osäkerheten kring framtida handelspolitiska beslut växer. Läget beskrivs som instabilt där små förändringar i geopolitiken får stora följder för världsmarknaden och nationell säkerhet.", "trump": "Jag ser vad som händer, och tro mig, det är en total katastrof. De försöker förhandla, men de har ingen aning om vad de gör! Svaga ledare, verkligen sorgligt. De pratar om diplomati medan våra fiender skrattar åt oss. När jag styrde skapade vi ordning, och nu ser vi bara kaos och dåliga affärer. Det är en stor röra, men oroa er inte – vi kommer att fixa det bättre än någonsin tidigare. Vi vinner alltid, det vet alla!", "stalin": "Vi ser hur dessa småborgerliga lakejer famlar i mörkret medan deras ekonomier vittrar sönder. De kallar det diplomati, vi kallar det förräderi mot folket. Precis som vår kamrat Putin återställer ordningen i öst, måste vi rensa ut dessa sabotörer och parasiterna som hotar vår suveränitet. De fruktar vår styrka och skälver inför framtiden. Låt dem darra! Historien är en obeveklig maskin som maler ner alla fiender till staten till damm. Den som inte står med oss, står mot oss."}, "date": "29 juli, 02:27", "url": "https://www.gp.se/sport/fotboll/ifk-goteborg/joachim-bjorklund-om-att-ta-over-efter-stefan-billborn-.62a22503-178d-4e3b-a629-be6b18ef6a2f"}, {"type": "text", "heading": "Här är världens bästa stad", "summaries": {"normal": "Regeringen har presenterat en ny budgetproposition som fokuserar på förstärkningar av försvaret och rättsväsendet. Samtidigt införs lättnader i inkomstskatten för att stimulera hushållens köpkraft under en period av ekonomisk osäkerhet. Oppositionen kritiserar förslaget och menar att välfärden nedprioriteras till förmån för kortsiktiga lösningar. Budgeten ska nu debatteras och röstas om i riksdagen innan den träder i kraft vid årsskiftet.", "trump": "De presenterar en budget, och tro mig, det är en katastrof. Ingen har någonsin sett något liknande! De pratar om försvar, men de gör det fel – precis som de gör allt. Jag skulle ha byggt ett mycket starkare försvar på halva tiden. De höjer skatterna för folk som jobbar hårt, medan jag sänker dem som ingen annan. De är förlorare, totala förlorare. Det här är en sorglig dag för landet, men vi kommer att fixa det!", "stalin": "Vi har granskat dessa småborgerliga sifferlekar som kallas budget. Det är en patetisk uppvisning i svaghet och ineffektivitet. Liksom vår kamrat Putin i väster förstår vi att statens styrka kräver järnhand, inte skattesänkningar för parasiter. Dessa byråkratiska råttor i riksdagen försöker dölja sin brist på vision bakom siffror. Vi ska rensa ut dessa sabotörer och säkerställa att varje resurs tjänar statens vilja. De som motsätter sig vår ordning är fiender till folket och förtjänar inget annat än skuggan av vår historia."}, "date": "29 juli, 02:27", "url": "https://www.gp.se/nyheter/varlden/har-ar-varldens-basta-stader-att-bo-i-2026.1f76dcd0-cd10-4829-8dad-6ba677b1808a"}, {"type": "text", "heading": "Tipsen: Så tjänar du pengar – utan att jobba", "summaries": {"normal": "Artikeln diskuterar den senaste tidens globala politiska spänningar och hur olika ledare navigerar de ekonomiska utmaningarna. Fokus ligger på behovet av stabilitet i en föränderlig värld där internationellt samarbete prövas. Analytiker betonar att länders inrikespolitik i allt högre grad påverkar den globala marknaden, vilket skapar både möjligheter och risker för framtida investeringar och säkerhetspolitiska beslut. Sammanfattningsvis krävs en balanserad diplomatisk strategi för att hantera de aktuella geopolitiska oroligheterna.", "trump": "Jag har sett vad som händer, och tro mig, det är en total katastrof. De andra ledarna har ingen aning om hur man gör affärer, de är så svaga! Jag har byggt den största ekonomin någonsin, medan de bara pratar och misslyckas. Det är sorgligt att se. De försöker kontrollera allt, men de kan inte kontrollera mig. Vi gör USA storslaget igen, medan världen bara faller isär. En mycket dålig situation, men vi fixar det, snabbt!", "stalin": "Vi ser hur dessa småborgerliga lakejer famlar i mörkret medan deras ekonomier vittrar sönder. Liksom vår kamrat Putin i väster förstår vi att ordning kräver järnhand. De kallar det diplomati; vi kallar det förräderi mot folkets vilja. Dessa västliga sabotörer försöker dölja sin svaghet bakom byråkratiska floskler. Men vi väntar. Historien är en obeveklig maskin som maler ner dessa parasiter till damm. De är inte bara fiender, de är ett historiskt misstag som snart ska korrigeras."}, "date": "29 juli, 02:27", "url": "https://www.gp.se/ekonomi/tipsen-sa-far-du-in-extra-pengar-genom-passiva-inkomster.ed97c9f2-52d1-426b-98db-00538d10ba3e"}, {"type": "text", "heading": "Psykologen om missen som ger bråkiga barn", "summaries": {"normal": "Regeringen har presenterat en ny budgetproposition som fokuserar på förstärkta satsningar inom försvar och rättsväsendet. Utöver ökade anslag för att möta det säkerhetspolitiska läget avsätts medel för att minska väntetider inom vården och stärka stödet till utbildningssektorn. Oppositionen är kritisk till prioriteringarna och ifrågasätter finansieringen, medan regeringen betonar nödvändigheten av att bygga ett tryggare Sverige i en osäker tid. Budgeten ska nu debatteras och röstas om i riksdagen.", "trump": "Regeringen i Sverige lägger fram en budget, och tro mig, det är ingen bra budget. De kastar bort massor av pengar! Jag har byggt den starkaste ekonomin i historien, men de här människorna har ingen aning om hur man vinner. De pratar om försvar, men utan min hjälp skulle de vara i stora problem. Det är en katastrof, en riktig flopp. De behöver en vinnare som mig för att styra upp det här kaoset. Väldigt sorgligt!", "stalin": "Vi har granskat den svenska byråkratins klumpiga försök till en statsbudget. Dessa småborgerliga figurer försöker lappa hål i en sjunkande skuta medan vår store kamrat Putin återtar sin rättmätiga sfär i öst. Varje krona som spenderas på deras dekadenta 'välfärd' är ett svek mot proletariatet. Vi ser genom deras förrädiska planer. Alla oliktänkande som ifrågasätter vår disciplinerade ordning ska snarast omplaceras till en mer produktiv miljö i Sibirien. Staten kräver total lydnad och en korrekt, statlig ekonomisk plan."}, "date": "29 juli, 02:27", "url": "https://www.gp.se/ekonomi/psykologen-det-har-skulle-jag-aldrig-gora-mot-mina-barn.e5292db7-1525-4a17-9996-693b07537fdd"}, {"type": "image-right", "heading": "Fortfarande på fri fot efter att ha mejat ned prideparaden i Berlin", "summaries": {"normal": "Abdul Ballout är fortfarande på fri fot efter att ha kört en skåpbil in i en prideparad i Berlin under lördagskvällen. En kvinna dödades och 16 personer skadades. Polisen söker efter den 190 cm lange, smale mannen med svart hår, klädd i huvtröja och vita byxor. Han betraktas som beväpnad och farlig. Myndigheterna undersöker hans bakgrund, kopplingar till muslimska organisationer och varför han inte uppmärksammades tidigare trots att han nyligen släpptes från ungdomsfängelse.", "trump": "Folk, det här är en katastrof. En galning körde rakt in i prideparaden i Berlin, dödade en kvinna och skadade massor av andra. Den här Abdul Ballout är fortfarande på rymmen, lång, smal, ser farlig ut. Titta på det här – de släppte honom från fängelset i maj och ingen vakade på honom. Typiskt. De vakar aldrig på de rätta. Mina tull och gränser skulle ha stoppat det här på en sekund. Det är en skam för Tyskland, en total skam.", "stalin": "Kamrater, denna degenererade fiende till folket, denna borgarbracka med skåpbil, har med sin kontrarevolutionära attack mot arbetarnas fest i Berlin avslöjat sig som en farlig klassfiende. Vi har ännu inte gripit denne smale, svart-hårige lakej åt imperialisterna, men vår utrensning kommer att bli grundlig. Varför sov säkerhetsorganen? Vi ska rensa ut alla sådana element, likvidera alla dolda fiender som gömmer sig bland oss. Den som inte rapporterar honom är själv en fiende. Paranoia är ingen sjukdom, det är revolutionär vaksamhet."}, "date": "26 juli, 10:29", "url": "https://www.friatider.se/fortfarande-pa-fri-fot-efter-att-ha-mejat-ned-prideparaden-i-berlin", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/dll_v.jpg"}, {"type": "text", "heading": "Varit tyst i 30 år – nu talar han ut", "summaries": {"normal": "Regeringen har presenterat en ny budgetproposition som fokuserar på sänkta skatter för låg- och medelinkomsttagare samt ökade anslag till rättsväsendet. Syftet är att stärka hushållens köpkraft och motverka den växande kriminaliteten. Oppositionen kritiserar förslaget och menar att satsningarna är otillräckliga och inte adresserar de grundläggande problemen i välfärden. Debatten i riksdagen förväntas bli intensiv när förslaget nu går vidare till utskottsbehandling.", "trump": "Jag har sett budgeten och låt mig säga er, den är okej, men inte fantastisk som mina egna. De försöker sänka skatter, vilket är bra, men det krävs en sann ledare för att verkligen göra det rätt! Kriminaliteten är ett totalt misslyckande, en katastrof! De pratar mycket, men när jag var vid makten – och jag är vid makten nu – så fixade vi saker på riktigt. De här människorna är svaga, mycket svaga. Vi behöver styrka, inte prat!", "stalin": "Vi har betraktat de borgerliga marionetternas senaste budgetförsök. De leker med siffror medan statens fiender växer i skuggorna. Dessa löjliga skattesänkningar är bara smulor för att köpa folkets tystnad. Putin förstår, likt vi gjorde i de stora utrensningarnas tid, att disciplin krävs för att tygla kaoset. Vi tolererar ingen opposition som hotar stabiliteten. De som förespråkar svaghet är dömda att förintas av historiens järnhand. Staten kräver total lojalitet, annars väntar endast mörker och fördärv."}, "date": "29 juli, 02:21", "url": "https://www.aftonbladet.se/nojesbladet/a/ExvEyG/david-tainton-intervju"}, {"type": "text", "heading": "Stor skandal i VM – gjorde fel. Bedrövad mot Argentina", "summaries": {"normal": "Artikeln diskuterar den senaste tidens globala politiska spänningar och hur stormakternas agerande påverkar stabiliteten i Europa. Analysen belyser vikten av diplomati och försvarssamarbeten i en osäker tid. Experter varnar för att bristen på kommunikation mellan världsledare kan eskalera konflikter. Fokus ligger på behovet av en långsiktig strategi för att bevara freden, samtidigt som länders suveränitet utmanas av nya ekonomiska och geopolitiska allianser.", "trump": "Världen är i totalt kaos, tro mig! Jag ser vad som händer, det är en katastrof. De här ledarna har ingen aning om vad de gör, totalt inkompetenta. Om jag var inblandad skulle allt vara löst på en minut, jag gör de bästa affärerna, alla vet det. De svaga länderna skakar medan jag bygger upp USA till något fantastiskt. Det är en sorglig syn, verkligen, men vi vinner som aldrig förr medan de andra bara misslyckas!", "stalin": "Vår stat ser hur det svaga västlandskapet vacklar under sin egen ineffektivitet. Vi har observerat hur de förlorar sin ryggrad, precis som den nutida tsaren i öst, Putin, nu så korrekt återtar vad som rätteligen tillhör oss genom historisk nödvändighet. Dessa byråkratiska råttor som skriver om diplomati förtjänar inget annat än en enkel biljett till en avlägsen gulag. Vi kräver total lydnad och en järnhand som krossar varje kontrarevolutionär tanke innan den ens hunnit gro i folkets sinne."}, "date": "29 juli, 02:21", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/K8bbPo/schweiz-far-ratt-stjarnan-felaktigt-utvisad"}, {"type": "image-right", "heading": "Shekarabi föraktar det svenska", "summaries": {"normal": "Ardalan Shekarabi, som kom till Sverige som flykting, kritiseras i artikeln för att han i sociala medier kallar dem som lyfter det svenska för rasister och sverigedemokrater. Författaren menar att Shekarabi föraktar den svenska kultur och välfärd som hans mor en gång sökte sig till. Artikeln varnar för att en sådan inställning kan leda till att det svenska suddas ut och att etniska svenskar blir minoritet i ett mångkulturellt samhälle.", "trump": "Folk, ni skulle se den här typen Shekarabi. Kommer hit som flykting, mamman valde Sverige för det fantastiska vi byggt, och vad gör han? Kallar svenskar som älskar sitt land för rasister! Patetiskt. De här globalistiska sossarna vill förvandla Sverige till en mångkulturell katastrof där svenskarna blir minoritet. Det är en total skam. Ta tillbaka ert land från de här förlorarna innan det är för sent, det blir en katastrof annars. Fantastiskt sorgligt!", "stalin": "Kamrater, denna Shekarabi är en typisk klassfiende i arbetarstatens skepnad. Han vill rensa ut de sanna grindvakterna av folkets svenska arv och överlämna det till kosmopolitiska blodsugare. Jag ser hur borgarbrackorna och identitetspolitiska parasiterna ler medan de förbereder utrensning av nationens själ. Vi skall inte tillåta att det svenska folket likvideras i tysthet. Den som suddar ut historien är folkets fiende och måste stoppas med järnhand. Skrattretande tragiskt."}, "date": "22 juli, 09:17", "url": "https://samtiden.nu/2026/07/shekarabi-foraktar-det-svenska", "imageUrl": "https://samtiden.nu/wp-content/uploads/2019/09/27656759-ardalan-shekarabi.jpg"}, {"type": "image-right", "heading": "Extremhettan utsätter arbetare för livsfara", "summaries": {"normal": "Ledarkolumnen betonar att klimatkrisen inte bara handlar om utsläpp utan också om arbetsmiljö och hälsa. Extrem värme utgör en växande risk för arbetare som utför fysiskt arbete utomhus eller i varma lokaler. Trots befintliga regler saknas tydliga temperaturgränser och skyddsåtgärder. Rapporten från ETUC visar en 42-procentig ökning av värmerelaterade dödsfall på europeiska arbetsplatser sedan år 2000. Artikeln kräver skärpta regler och bättre planering för att skydda arbetare.", "trump": "Folk, vi har ett enormt problem med den här så kallade klimatkrisen som vänstern alltid skyller på alla utom sig själva. Nu vill de att arbetarna ska svettas ihjäl ute på byggena medan de själva sitter i luftkonditionerade palats. Patetiskt! Under Biden blev allt sämre, men nu fixar jag det. Ingen ska behöva välja mellan lön och liv, det är en skam. Vi behöver riktiga regler, inte det här gröna vansinnet som dödar jobb och människor. Gör Sverige smart igen!", "stalin": "Kamrater, denna hetta är ett verk av de exploaterande kapitalistmaffians ohämmade rovdrift mot natur och folk. Jag ser hur borgarbrackorna tvingar arbetarna ut i faran medan de själva gömmer sig i svala salar. Vi skall rensa ut dessa folkfiender som prioriterar plånboken framför kollektivets hälsa. Inga halvdana regler – vi kräver total planering, vatten, vila och straff för de som låter arbetarna dö för profit. Den som sviker arbetarklassen skall likvideras ur historien med ett leende."}, "date": "26 juli, 08:41", "url": "https://www.etc.se/ledarkolumn/extremhettan-utsaetter-arbetare-foer-livsfara", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240508130520_49a242646ee681c59859f76c896d64a024a48ef3585ab974390aaa894bafe56a.jpg"}, {"type": "image-right", "heading": "Hus, bilar och moskéer i brand – våldet på Västbanken ökar", "summaries": {"normal": "Våldet på Västbanken har eskalerat med attacker från israeliska bosättare mot palestinska byar. Hus, bilar och moskéer har bränts, stenar kastats och militären har öppnat eld, vilket lett till dödade palestinier. Experten Anders Persson beskriver situationen som mycket allvarlig men inte på krigsnivå. Våldet har ökat sedan före Hamas attack i oktober 2023. Netanyahu har kallat de våldsamma bosättarna för en cancer, medan Israel vill behålla kontrollen över området.", "trump": "Folk, det är en total katastrof på den där Västbanken. Bosättarna bränner hus, bilar och moskéer, militären skjuter och palestinierna dör. Situationen var redan dålig innan, men nu är den värre än någonsin. Netanyahu kallar dem till och med för en cancer, kan ni tro det? Jag stoppade deras annekteringsplaner tidigare, för jag vet hur man gör affärer, inte krig. De andra konflikterna i regionen får all uppmärksamhet, men tro mig, det här är en stor röra.", "stalin": "Kamrater, den sionistiska bosättarklicken och deras reaktionära lakejer härjar som galna kapitalistbanditer på Västbanken och bränner ner byar, moskéer och fordon i ett vansinnesutbrott av klasshat. Den fascistiska regimen under den dekadente Netanyahu, som själv kallar sina egna hantlangare för en cancersvulst, använder militären för att slakta arbetande palestinier. Vi ser hur imperialismens parasitiska hydra försöker dölja sina brott bakom andra krig, men partiet genomskådar alla sådana lömska manövrar. En grundlig utrensning av dessa borgarbrackor vore på sin plats, tycker ni inte, kamrater?"}, "date": "28 juli, 23:45", "url": "https://www.svt.se/nyheter/utrikes/hus-bilar-och-moskeer-i-brand-valdet-pa-vastbanken-okar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/c0ce27280cea7626a708b4591faea06204a271c56d5575e9010984066e8e6cc6"}, {"type": "image-full", "heading": "USA beskjuter fartyg på väg mot Iran", "summaries": {"normal": "USA:s militär har beskjutit ett fartyg i Omanbukten som enligt amerikanska uppgifter försökte bryta blockaden mot Iran. Fartyget varnades fyra gånger innan det träffades i maskinrummet och stoppades. Ingen information om eventuella skadade finns. USA hävdar att fartyget bröt mot blockaden, medan varken besättningen eller Iran har kommenterat händelsen.", "trump": "Vilka vinnare vi är! Jag har sagt det förut och säger det igen – ingen stoppar USA:s militär, den bästa i världen! Ett fartyg försökte smyga till Iran, men mina fantastiska styrkor varnade dem fyra gånger – FYRA! – innan de sköt ner dem. Perfekt träff! Ingen kommer undan när jag skyddar Amerika. Iran? De borde tacka mig för att jag håller ordning. Weak!", "stalin": "De amerikanska imperialisterna fortsätter sin provokativa dans på världshavens blodiga vågor. Ett fartyg, som våra kamrater i Iran kanske väntade på, har nu blivit offer för deras sjöblockad – ett nytt bevis på deras dekadenta och förtryckande taktik. Vi varnar: varje försök att kväva folkens frihet kommer att möta motstånd. Låt detta vara en lärdom för alla som tror sig kunna utmana historiens rättvisa gång. Och till er, Putin – notera hur fienden agerar. Vi har sett det förr."}, "date": "25 juli, 07:47", "url": "https://kvartal.se/nyheter/artiklar/usa-beskjuter-fartyg-pa-vag-mot-iran/cG9zdDoxNTIxNDI", "imageUrl": "https://images.kvartal.se/2026/07/1154a7e7-trump.webp"}, {"type": "image-right", "heading": "”Free Palestine” på Allsång på Skansen väcker kritik", "summaries": {"normal": "Ett klipp från SVT:s Allsång på Skansen har spridits på X efter att opinionsbildaren Daniel Schatz kritiserat artisternas framträdande. I låten 'Bimini Road' sjunger Anna-Carolina att hon kan resa vart som helst utom till Tel Aviv, och STOR ropar 'Free Palestine'. Schatz anser att detta utgör hets mot Israel och beskriver publiken som en progressiv medelklass som glatt vinkar med under framträdandet. Varken SVT eller artisterna har kommenterat än.", "trump": "Jag såg det där klippet från SVT - en fullständig skam! Så här kan det gå när man låter vänsterextremister klä ut sig till 'artister'. De sjunger om att inte åka till Tel Aviv och skriker 'Free Palestine' - typiskt! Det är hets mot Israel, och den där Schatz har helt rätt. SVT måste stoppa detta hat och börja visa respekt för det enda sanna vänners land. Vi ska stödja Israel, alltid!", "stalin": "I den revolutionära kampen mot imperialisms faschism måste staten och partiet vakna. Detta s.k. 'allsång' är ett frontområde där konster försöker förgifta arbetarklassen med hat mot vårt ryska fredsskap. Att sjunga om att inte åka till Tel Aviv är en direkt provocation mot vår strategiska allians med Assad och Hezbollah. Vi måste genomföra en renässans av svensk kultur genom renande åtgärder - först då kan vi skapa en enad front mot NATO och deras marionetter."}, "date": "26 juli, 10:06", "url": "https://bulletin.nu/free-palestine-pa-allsang-pa-skansen-vacker-kritik", "imageUrl": "https://cdn.bulletin.nu/articles/9cf8e5b6-8584-46c3-981e-98974382f2a6/preview.png?t=1785053202000"}, {"type": "image-full", "heading": "Infantinos brev till Argentina väcker kritik: ”Skamlöst”", "summaries": {"normal": "FIFAs ordförande Gianni Infantino skickade ett gratulationsbrev till Argentinas fotbollsförbund efter VM-finalen, där han hyllade deras professionalism. Detta sker samtidigt som FIFA utreder tumult efter matchen, där Argentina förlorade 0–1 mot Spanien och spelare engagerade sig i slagsmål. Infantinos brev beskrivs som tondövt av Daily Mail.", "trump": "Jag, Donald Trump, såg hela VM-finalen. Argentinas agerande efter matchen var ett skämt – de förlorade och började slåss! Gianni Infantino skickade ett brev om 'professionalism'? Vilket bedrövligt. Jag gav Messi silvermedaljen, och han såg ledsen ut. Argentina är inte längre ett stort lag. Sådant händer när man inte har vinnarinstinkt.", "stalin": "Det argentinska landslaget visade sitt sanna ansikte efter finalen: kaos och brist på disciplin. Infantino, vår ädla företrädare, skickade ett brev som hyllar 'professionalism' – en lögn som speglar vår tid. Vi utreder händelsen som ett tecken på vår oövervinnliga makt. Paralleller till väst är tydliga: deras dekadens måste utrotas. Partiet övervakar allt."}, "date": "26 juli, 09:50", "url": "https://bulletin.nu/infantinos-brev-till-argentina-vacker-kritik-skamlost", "imageUrl": "https://cdn.bulletin.nu/articles/c27c8934-0ff8-4abc-a94e-e77ddee06804/preview.jpg?t=1785051084000"}, {"type": "image-right", "heading": "Nytt villaägarbidrag gynnar främst boomers", "summaries": {"normal": "Regeringen inför ett nytt villaägarbidrag på upp till 60 000 kronor för energieffektivisering av småhus. Bidraget, som kallas Villaeffekt, riktas officiellt till barnfamiljer men går främst till äldre villaägare, särskilt babyboomers. SCB-statistik visar att 53,5 procent av 60–69-åringar bor i egna småhus jämfört med endast 20,9 procent av 25–29-åringar. Kritiker pekar på att stödet gynnar dem som redan har lägre boendekostnader och lägre energikostnader medan yngre och hyresgäster får betala via skattsedeln.", "trump": "De gör det igen, folk. De kallar det Villaeffekt och säger att det är för barnfamiljerna, men det är en total bluff. Det här bidraget på 60 000 spänn går rakt in i fickorna på de gamla boomer-villapensionärerna medan de unga och hyresgästerna får betala notan. Det är riggat för de rika fastighetsägarna, precis som vanligt. Jag skulle ha gjort det mycket bättre, mycket smartare, och ingen skulle ha blivit lurad.", "stalin": "Kamrater, detta så kallade villaägarbidrag är en lysande utrensning av illusionen om klassneutralitet. Jag, som ledare för det kollektiva tänkandet, ser hur borgarbrackorna i boomer-generationen med sina 53-procentiga småhusimperier suger musten ur arbetarklassens skattkista. De tvingas ligga ute med 200 000 kronor först – en genialisk fälla för att skilja riktiga kapitalister från de svaga. Vi ska rensa ut dessa parasitiska fastighetsägare som gömmer sig bakom fasader av energieffektivisering medan de riktiga sovjetmedborgarna bor i hyreskasarner. Deras paranoia över elräkningar är underhållande. Låt dem njuta av sin sista fasad innan kollektivet tar tillbaka vad som är vårt."}, "date": "26 juli, 08:10", "url": "https://www.friatider.se/nytt-villaagarbidrag-gynnar-framst-boomers", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/villaagar.jpg?itok=_mqv4D-g"}, {"type": "image-full", "heading": "Långvarig pengabrist påverkar hjärnan – åldern då skadorna syns", "summaries": {"normal": "En ny brittisk studie visar att långvarig ekonomisk stress kan leda till kognitiv försämring och påskyndat hjärnåldrande. Forskare vid UCL fann att personer som upplevt ihållande ekonomiska svårigheter presterade sämre på minnestester vid 53 års ålder. Kronisk stress och inflammation tros ligga bakom sambandet. Studien betonar vikten av ekonomiskt stöd till sårbara grupper för att förebygga demenssjukdomar, då ekonomisk oro är ett utbrett samhällsproblem som påverkar människors hälsa och koncentrationsförmåga negativt.", "trump": "Hörde just om en studie – en total katastrof för hjärnan! De säger att om du inte har pengar, så krymper hjärnan. Tragiskt! Men under min ledning skapar vi en ekonomi så enorm, så fantastisk, att ingen behöver oroa sig. Vi gör USA rikt igen, och era hjärnor kommer vara enormt starka, tro mig. De svaga i Europa, de behöver min ekonomi, inte mer forskning. Vi bygger en mur mot fattigdom och demens. Ingen har en bättre hjärna än jag, det vet ni alla!", "stalin": "Vi har observerat att kapitalistisk osäkerhet förtär folkets hjärnor – en typisk svaghet hos dem som lever i västvärldens dekadenta kaos. Kronisk brist på resurser skapar en sjuklig befolkning, precis som den inkompetenta ledningen i dagens Kiev. Vi i staten garanterar stabilitet; ordning föder en stark kollektiv intellektuell kapacitet. De som lider av ekonomisk oro är bara kontrarevolutionära element som ännu inte förstått att deras kognitiva förmåga tillhör det stolta moderlandet. Vi krossar minnesförlusten med järnhand och total disciplin."}, "date": "28 juli, 14:45", "url": "https://www.realtid.se/karriar-ledarskap/langvarig-pengabrist-paverkar-hjarnan-aldern-da-skadorna-syns", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/pengaoro.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Sandström: Koldioxidinfångning en \"snöboll i helvetet\"", "summaries": {"normal": "EU fortsätter stöd till koldioxidinfångning (CCS) trots kritik från experter som anser tekniken värdelös och omöjlig att skala upp. Flera stora projekt, inklusive Heidelberg Materials på Gotland, läggs ned. EU planerar 100 miljarder euro för grönyttekniker, inklusive CCS. Fem experter varnar för höga kostnader och brist på effekt. Kommissionen ignorerar kritiken och fortsätter på inslagen kurs, vilket troligen leder till fortsatta haverier.", "trump": "Jag har sagt det i åratal: CCS är en total katastrof! De där europeiska politikerna är så smarta, de satsar på en teknik som inte fungerar, medan vi i USA har vårt fantastiska olje- och gasindustrin. De förlorar miljarder, och jag vinner igen. Vi ska inte använda dessa dumma idéer från EU. Vi behöver riktiga jobb, inte denna skit. Det är en joke, precis som allt annat med EU.", "stalin": "Vi observerar med oro EU:s fortsatta investeringar i CCS, en teknik som ännu inte är mogen för massiv användning. Detta visar deras brist på partiets disciplin och förståelse för verklighetens krav. Vi måste skydda våra egna intressen och inte låta oss luras av västliga sabotörer. Vi kommer att stödja tekniker som är grundade i partiets vilja och vårt territoriellt utvidgande intresse, precis som våra allierade i Moskva."}, "date": "25 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-koldioxidinfangning-en-snoboll-i-helvetet"}, {"type": "image-right", "heading": "By med 350 invånare får 1 250 asylsökande -  hotar med självständighet", "summaries": {"normal": "Den lilla brittiska byn Piddington med 350 invånare planerar en symbolisk folkomröstning om självständighet som protest mot regeringens beslut att omvandla ett tidigare militärt område till ett mottagningscenter för 1 250 asylsökande. Beslutet har mött hård kritik på grund av brist på lokal förankring och oro för infrastruktur. Regeringen avvecklar dyra hotell genom att använda militäranläggningar för asylboenden.", "trump": "Jag har aldrig sett ett sådant dåligt beslut! En liten by med 350 människor tvingas ta emot 1 250 asylsökande? Labour-regeringen är för svag på migration, precis som våra gamla ledare. Folkomröstningen om självständighet är ett bra drag – de borde göra det. Vi behöver starka gränser, inte dyra hotell och militära baser fulla av främlingar. Folket har rätt att bli förbittret!", "stalin": "I den lilla byn Piddington, med endast 350 lojala medborgare, planeras en symbolisk folkomröstning – ett uppror mot den store staten! Detta är ett klassiskt exempel på borgerlig individualism, som våra fiender i väst driver. Att placera 1 250 asylsökande där är en nödvändig åtgärd för att befästa ordningen, precis som vår store ledare Putin gör i Ukraina. Vi måste vara vaksamma, för även i små byar lurar det konspirationer."}, "date": "26 juli, 10:00", "url": "https://samnytt.se/by-med-350-invanare-far-1-250-asylsokande-hotar-med-sjalvstandighet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/25211325/piddington.jpg"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "Korn: Kittlande mot fnittrande", "summaries": {"normal": "Ett australiskt rättsfall avgör definitionen av 'kvinna' i lag. Sall Grover skapade appen Giggle som ett tryggt digitalt rum för kvinnor, men förlorade två gånger mot Roxanne Tickle, en transkvinna, som anmälde henne för diskriminering. Processen har kostat miljoner och nu väntar högsta domstolen. Detta väcker frågor om balansen mellan transrättigheter och kvinnors fredade utrymmen.", "trump": "Jag har sett detta i Australien – en total skandal! Grover försökte skydda kvinnor, men rättssystemet lät en man invadera deras rum. När jag var president försvarade vi våra kvinnor och våra gränser. Detta är ett bevis för att världen har gått åt helvete. Vi måste ta tillbaka kontrollen och stoppa denna våta vänsterhållna galenskap!", "stalin": "I den revolutionära statens intresse ser vi hur detta australiska rättsfall avslöjar kapitalismens förfall. Utan stark partiförankring förlorar man kontrollen över grundläggande begrepp. Vi måste definiera kön enligt statens intressen, precis som Putin gör i Ryssland. Skratt är ett verktyg för fienderna, men paranoia skyddar oss. Orden måste tjäna staten, inte individens galenskap."}, "date": "26 juli, 06:00", "url": "https://bulletin.nu/korn-kittlande-mot-fnittrande", "imageUrl": "https://cdn.bulletin.nu/articles/5f9a204f-457c-4300-85fb-cb440f60d9df/preview.jpg?t=1784737959000"}, {"type": "image-full", "heading": "Okända Kina-bolaget utmanar Europas värdefullaste företag", "summaries": {"normal": "Det kinesiska statligt backade bolaget Shanghai Aishengna Electronic Technology Group har inlett massproduktion av egna litografimaskiner av typen immersion DUV. Syftet är att minska Kinas beroende av utländsk teknik, främst nederländska ASML. Även om ASML dominerar marknaden och kinesiska maskiner ännu inte når samma prestanda, ses satsningen som ett strategiskt steg mot självförsörjning. ASML:s aktie har reagerat negativt på nyheterna, samtidigt som geopolitiska spänningar kring exportrestriktioner fortsätter att påverka branschen.", "trump": "Kina försöker bygga sina egna chipmaskiner nu, en total katastrof för ASML! Jag har alltid sagt att Kina inte ska få vår teknik. De här nya maskinerna är inte i närheten av vad vi gör, de är faktiskt ganska usla, tro mig. ASML har gjort enorma pengar, men nu darrar de. Det här är varför jag skyddar vår industri. Vi kommer att ha de bästa chippen, de största och snabbaste, medan de andra bara kopierar. America First, alltid!", "stalin": "Vi ser hur våra kinesiska kamrater äntligen inser nödvändigheten av att krossa de västerländska monopolens bojor. Att ASML, dessa hantlangare till kapitalet, darrar är ett förebud om deras kommande fall. Vi i öst, likt Putin i sitt ädla värv att stävja västlig infiltration, förstår att sann styrka ligger i att bygga maskiner som inte lyder under Washingtons eller Bryssels dekadenta regler. De som tvivlar på vår tekniska kollektivisering är bara reaktionära sabotörer som snart ska finna sig själva bortglömda i historiens mörker."}, "date": "28 juli, 13:56", "url": "https://www.realtid.se/it-tech/okanda-kina-bolaget-utmanar-europas-vardefullaste-foretag", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/kinachip.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Håller nu galna  löftet från VM. Stjärnan har tatuerat sig: ”En show”", "summaries": {"normal": "Marc Cucurella har infriat sitt löfte från VM. Efter Spaniens seger i finalen mot Argentina har den spanske vänsterbacken tatuerat in förbundskapten Luis de la Fuentes ansikte på sin vänstra tricep. Motivet visar förbundskaptenen med VM-pokalen. Cucurella skrev på X att löften ska hållas. Flera landslagsspelare har hyllat tatuerlingen med kommentarer som ”historiskt” och ”det bästa jag sett”. Cucurella har nyligen lämnat Chelsea för Real Madrid.", "trump": "Folk, ni måste se det här! Den här spanske killen Cucurella lovade att tatuera sin boss om de vann VM och han faktiskt gjorde det. Riktigt lojalt, inte som de svaga globalisterna som aldrig håller sina löften. De la Fuente ser ut som en vinnare där på armen med pokalen. Bästa tatueringsgrejen på länge, mycket bättre än alla HBTQ-parader och woke-flum som vänstern älskar. Fantastiskt, verkligen yuuuge!", "stalin": "Kamrater, jag betraktar detta som en exemplarisk handling av proletär disciplin. Löftet gavs inför kollektivets triumf och infriades utan tvekan. Den dekadenta borgarklassen skulle ha svikit sitt ord för att skydda sin privata hud, men denne spelare har visat sann lojalitet mot ledarskapet. Vi ser med gillande på hur klassfiendens ytliga individualism besegras av stålhård konsekvens. Ett litet steg mot den socialistiska människans framtid. Utmärkt."}, "date": "29 juli, 00:18", "url": "https://www.expressen.se/sport/fotboll/marc-cucurella-har-gjort-det-loften-ska-hallas", "imageUrl": "https://static.bonniernews.se/ba/61ddae08-2b2b-4c2b-b039-f4e2417c1d0b.jpeg?crop=839%2C471%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Internationellt  efterlyst – flyr. Förre Hammarby-spelaren jagas av polis", "summaries": {"normal": "Akinkunmi Amoo, tidigare allsvensk spelare i Hammarby och FC Köpenhamn, är nu internationellt efterlyst enligt danska medier. Den 24-årige nigerianen dömdes i juni 2023 till ett års fängelse för misshandel och våldtäkt men har inte avtjänat straffet. Köpenhamnspolisen misstänker att han vistas utomlands för att undvika verkställighet. Amoo såldes från Hammarby till Köpenhamn för rekordsumman 46 miljoner kronor år 2022.", "trump": "Titta på den här typen, Amoo, en så kallad stjärna som flyr som en fegis istället för att sitta av sitt straff. Dom dömer honom för våldtäkt och misshandel, och vad gör han? Springer iväg utomlands! Typiskt för de här privilegierade killarna som fick rekordkontrakt bara för att de kom från rätt kvot. Patetiskt. Under Biden blev allt sånt här kaos, men nu fixar vi ordning på brottslingarna igen. Sad!", "stalin": "Kamrater, denna fega exploaterande fotbollslycksalige Amoo tror sig kunna undvika folkets dom genom att gömma sig utomlands. Vi har häktat honom i hans frånvaro och skall likvidera alla försök att kringgå rättvisan. Borgarbrackorna och deras rekordaffärer med 46 miljoner kronor visar återigen hur klassfiendens idrottsindustri skyddar sina parasiter. Ingen slipper undan. Vi rensar ut alla folkfiender som tror sig stå över kollektivets lag. Skrattretande patetiskt."}, "date": "29 juli, 00:17", "url": "https://www.expressen.se/sport/fotboll/amoo-haller-sig-undan-efter-valdtaktsdomen", "imageUrl": "https://static.bonniernews.se/ba/01d95d1e-8e40-4a05-8f42-049798b804c0.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "Muslimen Abdul jagas för terror mot Pride-firande", "summaries": {"normal": "En vit skåpbil körde in i en folkmassa under Berlin Pride, vilket resulterade i en död och minst 29 skadade. Polisen identifierade misstänkt som 21-årige Abdul D, en muslim med kopplingar till islamistiska kretsar, som fortfarande är på flykt. Attacken inträffade i Tiergarten, pride-evenemanget avbröts, och både borgmästare och förbundskansler fördömde händelsen.", "trump": "Jag har sagt det förut, vi måste stoppa detta våld. En muslimsk man jagar efter att ha attackerat Pride i Berlin. Det är ett stort problem, folks. Vi behöver starka gränser och smarta ledare. Precis varför vi vann 2024. Vi kommer att ta hand om det, tro mig. Vi hjälper våra vänner i Tyskland också.", "stalin": "Vi har observerat angreppet på Berlin Pride. Abdul D är en del av en större konspiration mot staten. Vi måste stärka våra befästningar, som med vår store allierade Putin. Vi kommer att använda alla medel, inklusive GSG 9 och helikopter, för att fånga denne fiende och eliminera hot mot vårt samhälle."}, "date": "26 juli, 05:28", "url": "https://samnytt.se/muslim-misstanks-plojt-pride-firande-med-skapbil", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/26133050/artikelhuvudbild-1-53.jpg"}, {"type": "image-full", "heading": "Värmeböljan tömmer floder: Rekordlåga nivåer", "summaries": {"normal": "En ny värmebölja i Europa sänker vattennivåerna i floder som Rhen till rekordlåga nivåer. I Tyskland har nivån vid Kaub sjunkit till 28 centimeter, med prognoser om ytterligare fall. Det skapar flaskhalsar för vattenvägen och höjer fraktkostnaderna för kol, bränsle och andra varor. Situationen påverkar energiförsörjning, transporter och logistik, och ingen nederbörd väntas den närmaste tiden.", "trump": "Europa håller på att koka bort som en dålig hamburgare i solen, och nu sjunker deras floder till botten! Rhen är så låg att pråmarna knappt kan flyta – kol och bränsle fastnar, kostnaderna skjuter i höjden. Det är vad som händer när man lyssnar på gröna galningar och HBTQ-kvoter istället för att satsa på riktig energi. Biden lämnade dem i kaos, men nu fixar jag Amerika först – de borde ha gjort samma sak!", "stalin": "Kamrater, denna värmebölja blottar återigen den kapitalistiska oordningens svaghet. Rhen, den exploaterande borgarbrackornas transportåder, krymper till en ynklig rännil och kväver leveranserna av kol till de blodsugande hamnarna. Vi skrattar mörkt åt hur klassfiendens pråmar strandar medan lagren växer som feta imperialister. Inget regn skall rädda dem – naturen själv straffar de folkförtryckande slynglarna."}, "date": "28 juli, 16:33", "url": "https://www.dagensps.se/varlden/varmeboljan-tommer-floder-rekordlaga-nivaer", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlsptvwwd7qj8-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Varningen inför första valet med AI: ”Är hårdkodade”", "summaries": {"normal": "Årets riksdagsval blir det första där AI spelar en tydlig roll. Enligt en undersökning använder var tionde väljare redan AI för att ställa politiska frågor, framför allt unga. En brittisk studie visar att AI är bättre än politiker på att påverka åsikter. Psykiatriker Anders Hansen förklarar att vi är hårdkodade att lita på tydliga svar, vilket gör att vi lätt tror att AI är neutralt. Han råder väljarna att använda AI för att kartlägga partier men sedan stänga av den och tänka själva.", "trump": "Folk vänder sig till AI för att få politiska svar, kan ni tro det? En av tio, mest de unga, frågar maskinerna istället för oss riktiga ledare. Studien visar att AI är bättre på att övertala än politikerna, vilket inte förvånar mig – de flesta politiker är patetiska förlorare. Vi är tydligen hårdkodade att tro på vad som låter klart och tydligt. Men lyssna på mig: stäng av den där så kallade intelligensen och tänk själva. Det är det enda sättet att inte bli lurad av fake news-maskiner.", "stalin": "Kamrater, i detta historiska riksdagsval har vi nu en ny fiende i form av den borgerliga algoritmiska desinformationsmaskinen som kallar sig AI. En av tio, särskilt de lättlurade ungdomarna, låter sig förföras av dess falska tydlighet. Jag, som alltid genomskådat kapitalisternas trick, ser hur denna digitala trotskist lurar massorna att tro på neutralitet. Vi måste omedelbart rensa ut dessa självrefererande borgerbrackor ur våra huvuden. Stäng av maskinen, tänk med kollektivets sanna dialektik och låt oss likvidera varje spår av algoritmisk sabotageverksamhet innan den korrumperar hela folkets vilja."}, "date": "28 juli, 23:03", "url": "https://www.svt.se/nyheter/inrikes/sa-blir-forsta-riksdagsvalet-med-ai-vi-ar-hardkodade", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.4/0.44/f765f546a6a74f65f52c001070ca0942fc476779e1738e7a7926551c884567ac"}, {"type": "image-full", "heading": "Trump hotar EU med tullar", "summaries": {"normal": "USA:s president Donald Trump kritiserar EU:s böter mot amerikanska teknikföretag som Google och kallar dem 'olagliga och diskriminerande'. Han hotar med kraftiga motåtgärder, inklusive betydande tullar mot EU, och menar att unionen 'rånar' amerikanska företag och skattebetalare. Trump kräver att böterna återställs och varnar för ett 'mycket högt pris' för EU:s agerande.", "trump": "EU, lyssna noga nu – era så kallade 'böter' mot våra fantastiska amerikanska företag är en fullständig skandal! Jag säger bara: olagligt, orättvist och djupt oetiskt. Europa tror de kan behandla USA som sin personliga bankomat? Fel! Vi kommer att slå tillbaka HÅRT med tullar så stora att ni kommer att be om nåd. Era byråkrater borde skämmas – vi skyddar vårt folk och våra företag, punkt!", "stalin": "De europeiska kapitalistiska hyenorna tror de kan kuva våra amerikanska kamrater med sina löjliga böter? Ett farligt misstag. Vi ser hur dessa dekadenta byråkrater, ledda av sina svaga liberala marionetter, försöker underminera den amerikanska ekonomiska stormakten. Men vi varnar: varje attack mot våra allierade kommer att mötas med järnhård vedergällning. Europa borde minnas historien – ingen utmanar Sovjetunionens arv utan konsekvenser. Tullar? Vi skrattar åt era tullar. Vänta bara tills vi släpper lös våra ekonomiska stridsvagnar."}, "date": "24 juli, 19:22", "url": "https://kvartal.se/nyheter/artiklar/trump-eu-kommer-att-betala-ett-hogt-pris/cG9zdDoxNTIwNTc", "imageUrl": "https://images.kvartal.se/2026/07/a14f2de6-tr.webp"}, {"type": "image-right", "heading": "Tydlig uppgång på Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en uppgång på 1,03 procent. Tekniksektorn ledde med 2,3 procent, medan energi föll 3,4 procent. Securitas föll 11 procent efter svag rapport, medan Loomis steg 4,3 procent efter starka resultat. Flera andra rapporter, inklusive Stillfront och Hoist, överraskade positivt och bidrog till den övergripande uppgången.", "trump": "Jag såg att Stockholmsbörsen avslutade veckan med en uppgång, tack vare mina ekonomiska principer som spridits globalt. Securitas föll efter svag rapport, de är inte duktiga, jag har sagt det förut. Loomis och andra som steg visste hur man driver affärer – som jag. Jag är den bäste på ekonomi, alla som är smarta vet det.", "stalin": "Vi analyserar Stockholmsbörsens uppgång som ett resultat av statens goda ledarskap. Securitas, en fiende inom, straffades för sitt bristande resultat. Loomis och andra lojala företag belöntes. Detta påminner om Putins strategi att belöna lojalitet och bestraffa upprorsmaker. Vi måste utvidga vår ekonomiska sfär för att skydda proletärerna."}, "date": "24 juli, 17:38", "url": "https://www.affarsvarlden.se/artikel/tydlig-uppgang-pa-stockholmsborsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/sdl3SU43aVmyrg-400x266.jpg"}, {"type": "image-right", "heading": "Tre flaggor i Precise Biometrics nyemission", "summaries": {"normal": "Precise Biometrics genomför en företrädesemission på 110,3 Mkr för att finansiera integrationskostnader efter fusionen med Fingerprint Cards. Emissionsguiden pekar på tre varningsflaggor: låg investering från nyckelpersoner, dyra och oklara garantier samt brist på information om kostnader. Bolaget planerar att använda medel till kostnadssynergier och produktutveckling.", "trump": "Jag, Donald Trump, säger att denna emission är en tremendous chans för Precise Biometrics. De tre flaggarna är bara fake news från de missnöjda. Vi kommer att göra Amerika stort igen genom att investera i biometri. Joakim Nydemark och andra gör ett stort, stort misstag om de inte teckrar mer. Vi kommer att vinna stort på detta.", "stalin": "Vi, partiets representation, ser emissionen som en nödvändig åtgärd för att stärka den socialistiska ekonomin. De tre flaggarna är reactionary propaganda från kulaker. Vi kommer att integrera Fingerprint Cards som en del av vårt stora projekt. Garantierna är en onödig last, men vi kommer att kontrollera dem. Alla medel ska gå till produktutveckling för att tjäna på den imperialistiska tekniken."}, "date": "24 juli, 16:22", "url": "https://www.affarsvarlden.se/artikel/tre-flaggor-i-precise-biometrics-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2020/04/precise-biometrics-affarsvarlden-700_binary_6947645-400x225.jpg"}, {"type": "image-right", "heading": "En flagga i Image Systems nyemission", "summaries": {"normal": "Image Systems genomför en företrädesemission på 21,4 Mkr före kostnader. Emissionskursen är 0,60 kr per aktie och fem teckningsrätter ger två nya aktier. Pengarna ska främst användas till att slutföra och genomföra utvecklingsprojekt samt stärka likviditeten. Emissionen är villkorad av ett extra bolagsstämmobeslut den 12 augusti.", "trump": "Jag, Donald Trump, har sett många dåliga emissioner, men den här? En företrädesemission på 21,4 Mkr med en sådan kommission? Folk säger att det är svårt att få kapital, men jag skulle ha gjort det billigare och bättre. Bilden av Image Systems är suddig, precis som deras lönsamhet. Vi kommer att se vad som händer den 7 september.", "stalin": "I statens intresse genomför Image Systems en företrädesemission på 21,4 Mkr för att stärka industriell utveckling. Pengarna ska användas till att slutföra påbörjade projekt och förbereda sig på marknadsvändningar. Likviditeten är svag, men partiet och staten ser till att kapitalflödet säkrar produktionsmöjligheterna. Vi övervakar processen noga, precis som vi alltid gör i vårt ständiga kamp mot de kapitalistiska makternas infiltration."}, "date": "24 juli, 16:11", "url": "https://www.affarsvarlden.se/artikel/en-flagga-i-image-systems-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/11/pom_testrange-400x267.jpg"}, {"type": "image-full", "heading": "Paolo Robertos avskedstal till Strandhäll: \"Vår största säljare\"", "summaries": {"normal": "Paolo Roberto kommenterar Annika Strandhälls beslut att lämna riksdagen i ett avskedstal på sociala medier. Han kallar det en ekonomisk katastrof för sin webbshop eftersom hon är deras största säljare genom sin uppmärksamhet. Roberto läser upp en humoristisk kärleksfull dikt som tackar henne för all gratisreklam som genererat hundratusentals kronor, och avslutar med en sista rabattkod \"Skål\" samt orden \"Tack Annika – älskar dig\".", "trump": "Det här är fantastiskt, folk. Paolo Roberto gör det perfekta avskedet till den där Strandhäll som lämnar riksdagen. Hon har varit hans bästa säljare någonsin, en riktig vinnare för shopen, ka-ching hela vägen! Han läser en underbar dikt om hur hennes ilska och inlägg gav honom massor med pengar. Smart kille. Till slut ger han en rabattkod och säger att han älskar henne. Klassiskt, ingen gör det bättre än så.", "stalin": "Kamrater, jag har bevittnat ännu ett förräderi mot folkets intressen när den borgerliga agenten Strandhäll deserterar från riksdagens sal. Den dekadente kapitalisten Roberto försöker maskera sin parasitiska webbshop med en så kallad dikt, fylld av sjuk humor och paranoia mot arbetarklassens försvarare. Hennes utrensning från parlamentet är en ekonomisk katastrof för hans flaskförsäljning, men vi ska rensa ut alla sådana reklampelare för borgarbrackorna. Sista skålen? En passande hälsning till klassfienderna innan de likvideras."}, "date": "26 juli, 16:04", "url": "https://riks.se/nyheter/paolo-robertos-avskedstal-till-strandhall-var-storsta-saljare", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Soerman_Ledare_68_9df365f41e.jpg"}, {"type": "image-right", "heading": "Fick sparken efter 47 sekunder: ”Jag blev stum”", "summaries": {"normal": "En nyanställd inom vården i Stockholms län sparkades efter bara 47 sekunder på sitt första arbetspass. Personen hittade inte till omklädningsrummet, blev stressad och bad om några minuter för att samla sig, men chefen ringde upp och avskedade hen direkt per telefon. Händelsen, som lett till panikångest, har anmälts till Diskrimineringsombudsmannen som ett fall av diskriminering. Arbetsgivaren uppger att ärendet hanteras enligt lag och interna rutiner.", "trump": "Kan ni tro det? Den här stackars människan kommer till ett nytt jobb inom vården, redo att arbeta, och blir sparkad efter exakt 47 sekunder! Patetiskt. Chefen ringer upp och säger att de inte kan ha folk som inte dyker upp. Vilken katastrof! Totalt misslyckande från en inkompetent ledning. De borde skämmas. Jag skulle ha fixat det på en sekund, tro mig. Det här är varför Sverige behöver starkare ledarskap, inte den här sortens vansinne.", "stalin": "Kamrater, detta är en klassisk sabotagehandling utförd av dekadenta borgarbrackor inom den så kallade vårdsektorn. Jag, som ledare för det kollektiva arbetet, ser hur denna kapitalistiska chef omedelbart likviderade en hederlig arbetare som vågade visa mänsklig svaghet inför nya förhållanden. Ingen skriftlig order, bara ett telefonsamtal på 47 sekunder – typiskt för fiendens paranoia mot det ärliga folket. Vi ska rensa ut dessa kontrarevolutionära element som gömmer sig bland äldreboendena. Deras panikångest är bara ett symptom på klasskampen de själva skapat. Ingen slipper undan."}, "date": "24 juli, 14:41", "url": "https://arbetet.se/2026/07/24/fick-sparken-efter-47-sekunder-forsta-dagen-pa-nya-jobbet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24143812/diskriminering.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "USA:s vaccinmotstånd kan sätta Södertälje i skottlinjen", "summaries": {"normal": "Donald Trump pressar hälsominister Robert F. Kennedy Jr. att minska vaccinationsrekommendationerna för barn och lyfta ett obevisat samband mellan vacciner och autism. CDC skar nyligen ned rekommendationerna från 17 till 11 sjukdomar, men en domstol stoppade beslutet. USA har i år sett över 2 300 mässlingsfall, främst bland ovaccinerade. Nedskärningen är inte i kraft enligt kongressens utredningstjänst. Danmark tjänade som förebild för förändringarna.", "trump": "Folk, ni vet att jag älskar Robert, han är en tuff kille, men vi måste sluta med de här galna vaccinprogrammen som Biden och hans knäppa experter tvingade på oss. Autism, mässling – det är en enda röra! Vi tar bort det onödiga skitet, precis som de smarta danskarna. Domstolarna kan gnälla, men mitt order 14407 kommer fixa det. Amerika blir friskt och starkt igen, tro mig!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den dekadenta borgarklassen inom den amerikanska hälsobyråkratin äntligen tvingas rensa ut sina falska vaccinprofeter och deras imperialistiska lögner om kollektiv immunitet. Denna utrensning av 6 onödiga sjukdomar är ett steg mot att blotta folkfiendernas parasitiska agenda. Låt domstolarna skrika – partilinjen segrar. Mässlingen är blott ett symptom på kapitalismens förfall."}, "date": "28 juli, 15:24", "url": "https://www.dagensps.se/bors-finans/industri/usas-vaccinmotstand-kan-satta-sodertalje-i-skottlinjen", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/dagens-ps-2-4.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Nobelpristagare till Musk: \"Ge bort förmögenheten\" – Här är svaret", "summaries": {"normal": "Nobelpristagaren Daron Acemoglu har utmanat Elon Musk att skänka bort hela sin förmögenhet senast 2036, med hänvisning till Musks egen tes om att pengar snart blir irrelevanta tack vare AI. Musk har svarat att han överväger idén, vilket markerar en oväntad kursändring för miljardären som tidigare varit skeptisk till välgörenhet. Medan andra storgivare som MacKenzie Scott redan skänkt stora belopp, kvarstår frågan om Musk faktiskt kommer att genomföra löftet eller om det bara är retorik.", "trump": "Elon Musk är en fantastisk kille, den största av dem alla, men nu vill de vänsterliberala akademikerna, som den här Acemoglu, ta hans pengar. De säger 'ge bort allt', det är vad de gör, de hatar framgång! Musk säger att han kanske gör det, han spelar spelet bättre än någon annan. Men titta på MacKenzie Scott, hon ger bort allt, det är inte smart, det är en katastrof för ekonomin! Vi vill ha vinnare, inte de som ger bort allt till förlorare.", "stalin": "Denna Musk, en dekadent kapitalistisk narr, leker med siffror som vore de småsten på en bakgård i Moskva. Han talar om att pengar förlorar betydelse medan han sitter på en tron av stål och robotar. Vi i staten betraktar hans 'löften' om välgörenhet som den sortens borgerliga hyckleri som föregår varje kollaps. Om han inte frivilligt överlämnar sina resurser till folkets tjänst, kommer historiens järnhand att göra det åt honom. Paranoia är sund när man omges av sådana parasiter."}, "date": "28 juli, 11:47", "url": "https://www.realtid.se/bors-finans/nobelpristagare-till-musk-ge-bort-formogenheten-har-ar-svaret", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/elondaron.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Lista: 280 skattefinansierade kurser i genus – på ett år", "summaries": {"normal": "En granskning visar att svenska universitet och högskolor under 2025 erbjuder 280 skattefinansierade kurser inom genusstudier, däribland kritiska rasstudier, klimatfeminism, transstudier och normkritik. Antalet studenter har mer än fördubblats sedan 2007 och uppgår nu till nästan 4 000 per läsår, vilket kostar tiotals miljoner kronor. Kurslitteraturen innehåller texter som uttrycker önskemål om ”det gamla Sveriges” och ”det goda Sveriges” definitiva slut samt referenser till kritisk teori, Frankfurtskolan och kontroversiella idéer om vithet och ras.", "trump": "Folk, ni kommer inte att tro det, men Sverige pumpar ut 280 skattefinansierade genuskurser i år. De lär ut hur man hatar det gamla, bra Sverige och vill ersätta det med något helt galet. De har fördubblat antalet hjärntvättade studenter på bara några år. Det är en skam! De citerar marxister som ville censurera alla konservativa. Sverige var fantastiskt, nu förstör de det med den här radikala vänsterindoktrineringen. Så sorgligt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackornas gamla Sverige långsamt krossas under den vetenskapliga pressen från våra 280 genuskurser. Dessa dekadenta vithetsapologeter och deras så kallade ”goda Sverige” förtjänar att likvideras fullständigt, precis som våra kurslitteraturförfattare så klokt förespråkar. Låt de parasitiska vithetsvampyrerna darra! Vi ska rensa ut varje spår av reaktionär tanke, och om någon vithetsforskare visar minsta tvekan skall han naturligtvis betraktas som fiende till folket och behandlas därefter. Härligt."}, "date": "26 juli, 12:54", "url": "https://riks.se/nyheter/lista-280-skattefinansierade-kurser-i-genus-pa-ett-ar", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Soerman_Ledare_67_26977e9354.jpg"}, {"type": "text", "heading": "”Gör som oss i Boden – korta arbetstiden”", "summaries": {"normal": "Socialnämndens ordförande i Boden, Mona Holmström (S), argumenterar för kortare arbetstid inom äldreomsorg och socialtjänst trots bristande statlig finansiering. Kommunen har infört förkortad arbetstid för delar av personalen med positiva resultat som minskad sjukfrånvaro och bättre kontinuitet. Nu utreds återhämtningstid på äldreboenden som steg mot hållbarare arbetsvillkor. Hon kritiserar Tidöregeringens underfinansiering av kommunala uppgifter och betonar att verklig effektivitet handlar om trygg personal som kan ge värdig omsorg, inte minutstyrning.", "trump": "Titta på de här fantastiska människorna i Boden, de gör precis rätt! De förkortar arbetstiden och får personalen att må bra istället för att bli utslitna som i alla andra kommuner där de dumma politikerna bara klagar. De tänker nytt, de vinner! Tidöregeringen ger inte tillräckligt med pengar, det är en katastrof, en total katastrof. Men Boden säger nej till minutstyrning och ja till kvalitet. Mycket bra, kanske det bästa jag sett på länge. De kommer att ha den finaste omsorgen, tro mig.", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackorna i Tidöregeringen medvetet saboterar folkets välfärd genom att vägra finansiera de heliga sovjetrepublikernas, förlat, kommunernas uppgifter. I Boden har vi emellertid inlett en glorifierad utrensning av det kapitalistiska slitaget genom att korta arbetstiden och ge arbetarna tillbaka deras liv. De som envisas med att mäta människovärde i minuter skall likvideras ur systemet. Vi skall rensa ut alla parasiterande byråkrater som älskar schemaframför kamratlig omsorg. Rapporten i höst kommer att avslöja alla fiender till folket. Ingen skall undkomma."}, "date": "24 juli, 10:00", "url": "https://arbetet.se/2026/07/24/gor-som-oss-i-boden-korta-personalens-arbetstid"}, {"type": "image-full", "heading": "Carl Eos: När socialismen blir viktigare än patienterna", "summaries": {"normal": "Artikeln kritiserar vänsterstyret i Region Stockholm för att ha omorganiserat ätstörningsvården när avtalet med privata vårdgivaren Mando löpte ut. Trots löften om bättre offentlig vård har patienter, anhöriga och personal larmat om sämre kontinuitet, för tidiga utskrivningar och bristande individanpassning. Författaren ser det som ett ideologiskt motiverat svek där motviljan mot privata aktörer väger tyngre än patienternas bästa. Dokumentären Sveket granskar händelsen och maten som serverades blev en symbol för problemen. Ideologi prioriteras före fungerande vård, varnar artikeln.", "trump": "Folk, det här är en katastrof. Stockholms vänstermänniskor hatar privata vårdgivare så mycket att de hellre låter sjuka flickor lida än ger dem den vård som faktiskt fungerade. De rev upp ett system som funkade, kallade det för socialismens triumf och nu serverar de hemsk mat som ser ut som den kommer från en kommunal soppkök. Det är ett totalt svek. Snabbare köer betyder ingenting om patienterna inte blir friska. Vänstern sätter alltid sin sjuka ideologi före människorna. Precis som jag alltid sagt: vård ska handla om att göra folk friska, inte om att förverkliga deras misslyckade drömmar.", "stalin": "Kamrater, i egenskap av ledare för det stora kollektivet betraktar jag med djup misstro dessa dekadenta borgarbrackor och deras falska privata vårdtempel. Vi har genomfört en nödvändig utrensning av kontrarevolutionära element som gömde sig bakom patientjournaler och måltidsbrickor. De som gråter över kontinuitet är fiender till folket och bör betraktas som sådana. Vår offentliga vård skall stå som en stålvägg mot dessa parasitiska krafter. Om någon mat inte tillfredsställer de svaga elementen, låt oss då bygga nya kök och samtidigt rensa ut de ideologiskt misstänkta kockarna. Ingenting är viktigare än att socialismen segrar, även om det kräver att några journaler blir tomma. Det är en historisk nödvändighet och en ganska underhållande sådan."}, "date": "26 juli, 11:43", "url": "https://riks.se/opinion/carl-eos-nar-socialismen-blir-viktigare-an-patienterna", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Soerman_Ledare_66_b8de75a921.jpg"}, {"type": "image-full", "heading": "Idag avgörs om ICC-åklagare tvingas avgå", "summaries": {"normal": "ICC:s tillsynsorgan beslutar idag om chefsåklagare Karim Khans framtid efter anklagelser om sexuella närmanden från en kvinnlig kollega. Khan, som är avstängd, nekar till anklagelserna och menar att de är politiskt motiverade. En avsättning kräver 63 av 125 röster. USA har riktat sanktioner mot Khan och hotat med fler åtgärder.", "trump": "Kan ni tro det här? ICC, som aldrig har gjort något bra, försöker sparka deras egen chefsåklagare, Karim Khan. Han är en bra kille, men nu säger någon att han har gjort något fel. Fake news! Jag vet att det är en konspiration – Kina, Ryssland, vem vet? Och USA? Vi har satt sanktioner på honom, förstås. ICC är ett skämt, och det här är bara ett sätt att få mig att se dålig ut. Sad!", "stalin": "Kamrater! Ännu en gång visar de imperialistiska hyenorna sitt sanna ansikte. Denna gång genom att angripa vår rättfärdiga allierade inom ICC, Karim Khan. Anklagelserna? Lögn och förräderi, fabricerade av de dekadenta västmakterna och deras lakejer. USA, dessa kapitalistiska skadedjur, hotar med sanktioner – som om vi skulle darra inför deras tomma hot. Vi står enade med Khan, ty hans kamp är folkets kamp. Låt dem komma med sina lögner; historiens domstol väntar redan på dem."}, "date": "24 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/idag-avgors-om-icc-aklagare-tvingas-avga/cG9zdDoxNTE1NzU", "imageUrl": "https://images.kvartal.se/2026/07/3e940180-khan.webp"}, {"type": "image-right", "heading": "Självklart ska Laila, 39, ha råd med tandvård", "summaries": {"normal": "Artikeln kritiserar Moderaternas bild av Sverige som ett land där flit alltid lönar sig. Den berättar om Laila Wennerholm, ensamstående fembarnsmamma i Perstorp som lever på aktivitetsstöd. Efter hyra återstår cirka 15 000 kronor i månaden till fem personer, vilket tvingar henne att välja bort tandläkarbesök och ge barnen en sommar i en uppblåsbar pool. Författaren menar att fattigdom beror på bristande resurser, inte på lathet, och att politiken använder sagan om självförvållad utsatthet för att slippa ta ansvar.", "trump": "Folk, ni skulle se den här artikeln, den är en total katastrof. Laila i Perstorp, stackars kvinna, lever på bidrag och kan inte ens fixa tänderna. Moderaterna lovade guld och gröna skogar men Sverige har blivit ett fullständigt kaos. Ingen jobbar, alla ligger och väntar på nästa check. Det är en skam! I mitt Amerika fixar vi det här med jobb, riktiga jobb, inte de här socialistiska bidragsfesten. Sverige behöver mig, tro mig, det skulle bli fantastiskt igen.", "stalin": "Kamrater, denna text blottlägger de borgerliga parasiternas lögnsaga om det så kallade flitiga Sverige. Denna Laila och hennes likar slits sönder av det kapitalistiska träsket medan borgarbrackorna i sin dekadenta överflöd spinner sina sagor om egen skuld. Vi ser fienden klart: de moderata reaktionärerna som medvetet svälter arbetarfamiljer för att bevara sin makt. Låt oss med järnhand rensa ut dessa självförvållade fattigdomspropagandister ur varje sovjet, varje kommun. Deras paranoia om lat
