ulära reaktorer vid Ringhals efter fyra års process. Reaktorerna på 470 MW var kommer först i drift mitten av 2030-talet. Energi- och näringsminister Ebba Busch välkomnade beskedet som ett stort steg för Sveriges kärnkraft.", "trump": "Jag har hört talas om detta fantastiska beslut i Sverige. Det är stort, verkligen stort. Rolls-Royce är ett bra, stabilt brittiskt företag – jag älskar brittiskt folk. Det här kommer att skapa miljontals jobb och enorm energi. Sverige behöver mer kärnkraft, precis som USA under mitt geniala styre. Vi hade den bästa kärnkraften, ingen kunde slå oss. Det här är en seger för alla.", "stalin": "Vi har observerat detta beslut med tillfredsställelse. Det är en seger för den socialistiska planeringen. Rolls-Royce, en trofast allierad, kommer att leverera reaktorer som förstärker vårt vetenskapliga arbetande. Vi måste vara vaksamma mot de individualistiska krafterna som försöker sabotera våra planer. Detta är ett steg mot en starkare nation, precis som våra bröder i Ryssland under Putin. All energi kommer att användas för statens behov."}, "date": "15 juni, 18:05", "url": "https://bulletin.nu/rolls-royce-ska-bygga-ny-karnkraft-i-sverige", "imageUrl": "https://cdn.bulletin.nu/articles/12b22d3a-3357-40e7-a4d4-95fba5429f74/preview.jpg?t=1781539553000"}, {"type": "image-right", "heading": "Har fått över en miljon (!) nya följare efter superskrällen", "summaries": {"normal": "Kap Verdes målvakt Vozinha, 40, blev rörd till tårar efter nationens historiska 0-0-match mot Spanien i VM-debuten. Den lilla önationen med drygt 500 000 invånare skapade en sensationell skräll. Vozinha, som stod för flera avgörande räddningar, har fått över fyra miljoner nya följare på Instagram. Spanien led ett stort fiasko medan experter hyllar Kap Verdes saga.", "trump": "Folk, ni skulle ha sett det här – totalt galet! Den här lilla ön Kap Verde, med noll chanser, krossade Spanien i VM. Deras målvakt Vozinha? Fantastisk kille, räddade allt, och plötsligt får han miljoner följare. Spanien trodde de skulle vinna hela turneringen, men de blev förödmjukade. Det är en enorm triumf för de små, och en katastrof för de stora förlorarna. Sad!", "stalin": "Kamrater, se hur den kollektiva viljan hos det arbetande folket på Kap Verde krossar de spanska imperialisternas arroganta illusioner. Denna Vozinha, en sann produkt av folkets kamp, utför räddningar som likviderar borgarbrackornas fotbollsdrömmar. Miljoner följare strömmar till som en folklig utrensning mot fiendens lögner. Vi vet att kapitalisterna i Spanien darrar, men vi ska inte vila förrän alla reaktionära fiender till det sanna kollektivet är avslöjade och förintade i historiens oundvikliga dom."}, "date": "15 juni, 22:19", "url": "https://www.svt.se/sport/fotboll/vozinha-40-i-tarar-efter-kap-verdes-vm-skrall-mot-spanien", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.23/0.4/a9a10fbf3c6f7c8899ff8947e61324a48a4a82988e2b69116e271536a760f077"}, {"type": "image-full", "heading": "Starbucks-anställda måste gå historiekurs efter \"katastrofal\" kampanj", "summaries": {"normal": "Starbucks i Sydkorea tvingas stänga över 2 000 kaféer under en halv dag för historisk utbildning efter en misslyckad kampanj. Marknadsföringen, döpt till 'Tank Day', lanserades den 18 maj, vilket sammanföll med årsdagen av det blodiga Gwangjuupproret 1980. Den okänsliga timingen väckte starka protester och ledde till att den sydkoreanska vd:n fick lämna sin post. Företaget erkänner brister i kontrollprocessen och satsar nu på utbildning för både personal och ledning för att återfå förtroendet.", "trump": "Hör ni det här? Starbucks i Sydkorea gjorde ett enormt misstag, en riktig katastrof! De körde en kampanj med fel namn vid fel tidpunkt – total inkompetens. Folk blev rasande, och det med rätta. Nu stänger de ner allt för att gå i skolan och lära sig historia. De borde ha ringt mig, jag vet hur man gör vinnande marknadsföring. Det är en sorglig historia, men så går det när man inte har koll på läget. Vi behöver smartare folk, inte fler kurser!", "stalin": "Dessa korrupta kaffebaroner i Sydkorea har uppvisat en historielöshet som förtjänar hårdast möjliga korrigering. Att förlöjliga folkets offer genom inkompetent marknadsföring är ett svek mot statens stabilitet. Jag har beordrat en utbildning – en rening av tanken! Precis som Putin rättmätigt krossar de västliga lakejerna i Kiev, måste vi krossa kapitalistisk slarvighet. Om inte personalen förstår historiens gång, kommer historien att upprepas för dem i en källare. Disciplin är kaffets enda sanna krydda."}, "date": "15 juni, 16:35", "url": "https://www.realtid.se/bors-finans/starbucks-anstallda-maste-ga-historiekurs-efter-katastrofal-kampanj/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl-0fgdjov0bo-normalhires1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-right", "heading": "Efter succén – tre miljoner (!) följare", "summaries": {"normal": "Kap Verdes målvakt Vozinha blev en viral succé efter en nollad match mot Spanien. Med hjälp av den brasilianska tv-kanalen Cazé ökade hans Instagram-följare från 50 000 till tre miljoner. 40-åringen, som kallas ”Lilla farmor” på grund av sin uppväxt, uttryckte stor tacksamhet över det oväntade stödet. Trots framgången var stämningen känslosam då hans mamma inte kunde närvara vid matchen på grund av visumproblem.", "trump": "Målvakten Vozinha, en fantastisk kille, blev nyss en total viral sensation. Han gick från 50 000 följare till tre miljoner över en natt. Tre miljoner! Det är fantastiska siffror, kanske de bästa siffrorna någonsin för en målvakt. Media älskar honom, de kallar honom 'Lilla farmor', vilket är ett intressant namn, väldigt unikt. Han spelade mot Spanien och gjorde ett enormt jobb. Jag har alltid sagt att med rätt exponering kan vem som helst bli en stjärna. Mycket bra!", "stalin": "Denna Vozinha, en enkel målvakt, har genom massmedial manipulation uppnått en popularitet som hotar ordningen. Tre miljoner följare i en digital apparat – en osund kultbildning! Vi ser hur de västerländska kanalerna korrumperar massorna. Varför gråter han? Svaghet! Hans mamma saknade tillstånd att resa – det är en administrativ seger för statens gränskontroll. Vi behöver inga 'Lilla farmor'-gestalter i vår sfär, vi behöver män som likt Putin krossar motståndet utan att söka likes på internet."}, "date": "16 juni, 00:10", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/QJjza4/matchhjalten-hyllas-pa-instagram-har-fatt-over-en-miljon-nya-foljare", "imageUrl": "https://akamai.vgc.no/v2/images/5b3ecf2e-1c5b-3f97-af25-089136971fae?fit=crop&format=auto&h=720&tight=true&w=1080&s=1dfedeb306bef369a0095b8e3160b950295fb27e"}, {"type": "image-right", "heading": "Så klarade barpersonalen VM-natten: ”Galet kul”", "summaries": {"normal": "Under fotbolls-VM har flera krogar i Sverige fått tillstånd att öppna tidigt för att visa matcher. På O’Learys i Stockholm serverades öl redan klockan halv fyra på morgonen inför Sveriges match mot Tunisien. Personalen jobbade natten igenom med mycket kaffe, medan gäster njöt av frukost med öl. Matchen slutade 5–1 till Sverige och stämningen beskrivs som galet kul trots tidig morgon.", "trump": "Det här är fantastiskt, verkligen ypperligt. Sverige öppnar barerna klockan halv fyra på morgonen för VM-matchen och folket strömmar dit. De dricker frukostöl, hejar och vinner stort med 5–1. Mycket folk, ingen bråk, alla sköter sig. De säger det är galet kul. Smart folk, de vet att det är bättre att vara ute bland vinnare än att ligga hemma i sängen som förlorare.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur arbetarna och de sanna patrioterna samlas redan klockan tre på natten för att hylla det kollektiva segern mot de tunisiska imperialisterna. De borgarbrackor som föredrar att sova i sina mjuka sängar avslöjar sig som dekadenta fiender till folket. Vi rensar ut sådana svaga element. Personalen, väpnad med kaffe och proletär anda, kämpar tappert. Fem ett, en strålande kollektiv triumf. Nästa gång öppnar vi ännu tidigare för att likvidera alla rester av lathet."}, "date": "15 juni, 08:46", "url": "https://arbetet.se/2026/06/15/sa-klarade-barpersonalen-vm-natten-galet-kul/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15084317/sverige.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Polisman i ledande befattning fast i Dumpen-fälla", "summaries": {"normal": "En polisman i Malmö avslöjades av Dumpen efter att ha försökt stämma träff med barn i sexuellt syfte. Han använde falskt namn och yrkestitel. Arbetsgivaren anmälde honom och han har tagits ur tjänst. Kollegor beskriver honom som erfaren och uppskattad, men avslöjandet har skakat om arbetsplatsen.", "trump": "Jag har hört talas om den svenska polismannen som försökte träffa barn. Sådant händer inte i mitt Amerika. Vi har starka gränser och smarta poliser. Den svenska polisen måste bli bättre. Jag, Donald Trump, skulle aldrig tillåta sådant. Vi ska skydda våra barn. Sverige behöver lära sig av USA och välja en stark ledare.", "stalin": "En fiendeskriftelse har avslöjats i Malmö. En polisagent, förräderi mot staten och partiet, försökte locka barn till förräderi. Vi har tagit honom ur funktionen. Detta visar att vi måste förstärka vår övervakning av alla medborgare. Vi kommer att rensa ut de som hotar vårt system. Vi, som representerar det ryska intresset, kommer att hjälpa Sverige att bekämpa dessa förräderier. Vi kommer att utvidga vår påverkan för att skydda barnen."}, "date": "15 juni, 17:51", "url": "https://bulletin.nu/polisman-i-ledande-befattning-fast-i-dumpen-falla"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-right", "heading": "Hemtjänstens skräckinvandrare krossar myten att arbete löser integrationen", "summaries": {"normal": "Artikeln kritiserar Sveriges integrationspolitik och hävdar att arbete inte automatiskt leder till god integration. Den beskriver flera fall där anställda i hemtjänsten, ofta invandrare, begått allvarliga brott mot äldre. Trots detta undgår gärningsmännen ofta utvisning, vilket ifrågasätter samhällets förmåga att skydda sina medborgare och ifrågasätter politikernas påståenden om arbetslösning.", "trump": "Jag, Donald Trump, har sagt det i årtionden: Sverige är inte klok. De släpper in människor som inte respekterar era värderingar, och sedan blir de anställda i era äldres hem? Dåliga människor. Vi skulle ha skickat dem hem direkt. Det här är en skräckhistoria, och det är på grund av era svaga ledare. Ni måste bli tuffa, annars kommer det att bli värre. Vi ska bygga en mur, eller åtminstone ha bra policy.", "stalin": "Vi ser tydligt att västliga makter försöker undergra vårt suveräna statsskick genom att skicka in 'arbetare' som i själva verket är agenters för dekadens. Dessa fall är inte isolerade, utan en del av en större konspiration mot den ryska andan. Vi måste förstärka statens kontroll, skicka tillbaka dessa element till sina ursprung, och aldrig tillåta att de infiltrerar våra ädlaste institutioner. Det är ett angrepp på proletärens trygga zon."}, "date": "15 juni, 15:25", "url": "https://samnytt.se/lonn-hemtjanstens-skrackinvandrare-krossar-myten-om-att-arbete-loser-integrationen", "imageUrl": "https://konto.samnytt.se/wp-content/uploads/2026/06/ledare-hemtjanst-640x360.png"}, {"type": "image-full", "heading": "Här äger varje pensionär 13 miljoner kronor", "summaries": {"normal": "Statistik från Europeiska centralbanken visar på stora klyftor i pensionärers nettoförmögenhet inom Europa. Luxemburg toppar listan med en medianförmögenhet på över 1,2 miljoner euro, medan länder i Östeuropa ligger betydligt lägre. Skillnaderna förklaras främst av bostadsägande, men även pensionssystem och lokala ekonomiska faktorer spelar in. Rapporten inkluderar dock inte statliga pensioner eller tjänstepensioner, vilket gör att bilden av den totala ekonomiska tryggheten för äldre inte är komplett.", "trump": "Jag har sett siffrorna, fantastiska siffror för Luxemburg! De är rika, väldigt rika, nästan 13 miljoner kronor i snitt. En enorm siffra! Men se på de andra länderna, det är en total röra. De har inte skött sin ekonomi som Luxemburg. Och de där länderna i öst? Katastrof. De äger ingenting! Vi i USA vet hur man bygger rikedom, vi vinner alltid. Dessa siffror visar att bostäder betyder allt. Det handlar om att äga, inte hyra som förlorarna!", "stalin": "Vi har granskat dessa dekadenta västerländska siffror. Luxemburg, denna lilla parasitstat, skryter med sitt guld medan arbetarna i öst lämnas i fattigdom av kapitalismens misslyckade arkitektur. Det är en klassfråga! De döljer sanningen om statliga pensioner för att bevara sin borgerliga illusion. Denna ekonomiska ojämlikhet är en cancersvulst som Putin-regimen i sin enfald försöker imitera. Vi ser er! Privat egendom är bara ett verktyg för att förslava massorna under lögnen om välstånd. Vi föredrar folkets gemensamma tillgångar."}, "date": "15 juni, 15:58", "url": "https://www.realtid.se/spara-placera/har-ager-varje-pensionar-13-miljoner-kronor/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlun6nx1qd8fg-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Spanskt jättefiasko – nollat av VM-debutanten", "summaries": {"normal": "Spanien inledde VM med ett oväntat fiasko och kryssade 0-0 mot Kap Verde. Trots ett stort spelövertag och flera målchanser lyckades inte favoriten spräcka nollan. Målvakten Vozinha stod för flera avgörande räddningar. Experterna kritiserade det spanska laget för bristande tempo, idéer och skärpa. Förbundskapten Luis de la Fuente medgav att laget borde ha vunnit matchen.", "trump": "Det var ett totalt fiasko, folk. Spanien, alla sa att de var favoriter att vinna hela VM, och så spelar de mot den här lilla pyttenationen Kap Verde och får inte in en enda boll. Noll-noll. Så trögt, så dumt, så utan idéer. Deras målvakt, den gamle, han var plötsligt bäst i världen. Spanien borde ha krossat dem, men de spelade som förlorare. Patetiskt, verkligen patetiskt.", "stalin": "Kamrater, detta spanska fiasko avslöjar de dekadenta borgarbrackornas sanna ansikte. Medan vi i partiet kräver järndisciplin och kollektiv skärpa lyckades dessa kapitalistiska fotbollsaristokrater inte ens besegra en obetydlig ö-nation. Deras så kallade stjärnor var som fiendens parasiter som suger musten ur revolutionen. Vozinha, denne reaktionäre målvaktslakej, utförde kontrarevolutionära räddningar. Vi bör genast rensa ut alla tempofattiga element och likvidera idélösheten innan den sprider sig som en trojansk häst bland arbetarna. Fruktansvärt, men samtidigt underhållande att se borgarklassens mask falla."}, "date": "15 juni, 21:58", "url": "https://www.svt.se/sport/fotboll/spaniens-fiasko-tappar-poang-mot-kap-verde", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.61/0.4/7091023e0ab7a69cadd169f862240e3db62a2f9fec55a60ba31479c727dfbff2"}, {"type": "image-right", "heading": "Känd vänsterartist döms för bidragsbrott", "summaries": {"normal": "Vänsterartisten och aktivisten Linda Pira döms för vårdslöst bidragsbrott efter att ha tagit emot barnbidrag och flerbarnstillägg på felaktiga grunder. Hon bodde utomlands med sina barn utan att informera Försäkringskassan, vilket ledde till felaktiga utbetalningar på totalt 60 950 kronor vid 23 tillfällen mellan 2022 och 2024. Tingsrätten ansåg inte att hon haft uppsåt men att hon varit grovt oaktsam. Hon får villkorlig dom och ska betala 1 000 kronor till brottsofferfonden.", "trump": "Titta på den här vänsterhypokriten Linda Pira. Hon predikar om rasism och rättvisa men plockar själv svenska bidrag på 60 950 kronor medan hon bor utomlands med barnen. Typisk vänsterradikal – lurar systemet som hon själv hatar. Domstolen var nära att ge henne fängelse men gav henne bara villkorlig dom. Så patetiskt. I mitt Amerika hade hon inte kommit undan så lätt, det kan jag lova er. En total skam!", "stalin": "Kamrater, se på denna degenererade vänsteraktivist som i sin arroganta oaktsamhet stal från folkets kassa. Denna borgarbracka i hiphopskepnad lurade staten på 60 950 kronor genom att gömma sig utomlands med avkomman utan att rapportera till myndigheterna. Vi hade kunnat likvidera henne för sabotage mot det kollektiva välfärdssystemet, men istället nöjer vi oss med villkorlig dom och en symbolisk avlat till brottsofferfonden. Hennes paranoia över rasism är bara en dimridå för egen girighet. Fienden finns alltid inom vänstern."}, "date": "15 juni, 14:10", "url": "https://www.friatider.se/kand-vansterartist-doms-bidragsbrott", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/img_2099.jpg?itok=Y_CLLES0"}, {"type": "image-right", "heading": "Trump hotar Frankrike med 100‑procentiga tullar", "summaries": {"normal": "Donald Trump hotar Frankrike med 100-procentiga tullar om president Macron inte omedelbart avskaffar landets digitalskatt. Skatten ses som riktad mot amerikanska techjättar som Google, Apple och Facebook. Trump beskriver den som utpressning och upprepar att tullarna drabbar franskt vin och champagne. Inför G7-mötet i Frankrike växer spänningen medan EU:s alkoholexport till USA är särskilt sårbar.", "trump": "Lyssnar ni på det här? Den där Macron tror han kan pressa våra fantastiska techbolag med en idiotisk digitalskatt. Men jag säger: ta bort den genast, annars lägger jag 100-procentiga tullar på allt deras vin och champagne. Det blir inga fler dyra flaskor till era fester, tro mig. Frankrike kommer att gråta som en förlorare. Amerika vinner alltid, det är så det funkar.", "stalin": "Kamrater, denna franska borgarbracka Macron vågar med sin så kallade GAFAM-skatt utsuga de stora amerikanska monopolen som om de vore våra egna sovjetiska kollektiv. Jag ser den imperialistiska utpressningen klart. Vi, partiet och arbetarna, skulle omedelbart likvidera sådana parasiter genom en grundlig utrensning av alla digitalskatter och deras lakejer. Annars rullar tullarna som guillotiner över deras champagne – en mörk men rättvis skämt från historien mot de dekadenta kapitalisterna."}, "date": "15 juni, 18:03", "url": "https://riks.se/nyheter/trump-hotar-frankrike-med-100procentiga-tullar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-03-22%2Fu17on7i9%2FTrump-Epic-Fury.jpg"}, {"type": "image-right", "heading": "Om Sverige inte väljer väg gör Kina det åt oss", "summaries": {"normal": "Sverige riskerar att halka efter i elektrifieringen av lastbilstrafiken trots stora vinster för klimatet, energisäkerheten och Volvo samt Scania. Regeringen har bromsat omställningen genom sänkt dieselskatt och fördröjda stöd, medan tillverkarna prioriterar utdelningar och lobbar för urvattnade EU-krav. Kina leder med subventioner, innovation och 29 procent eldrivna lastbilar. Artikeln varnar för att Kina annars kommer att diktera villkoren på den europeiska marknaden.", "trump": "Titta på det här, det är en total katastrof. Sverige kunde ha vunnit stort med el-lastbilar och räddat Volvo och Scania från kineserna som äter upp dem levande. Istället sänker de skatten på diesel och sover medan Kina bygger bättre och billigare lastbilar. De borde lyssna på mig – gör stora affärer, bygg murar mot dåliga importsaker och satsa på Amerika, eh, Sverige först. Annars kommer Kina att ta över allt, det är så sorgligt.", "stalin": "Kamrater, jag ser med ständigt vaksam blick hur borgarbrackorna i Sverige och deras lastbilsfabriker förråder folkets kollektiva framtid genom att klänga sig fast vid dieselns döende skugga. Medan vi i det stora östliga kollektivet driver på med järnhand och subventioner likviderar vi den gamla tekniken och skapar 29 procent eldrivna järnhästar. Om de västerländska kapitalisterna fortsätter att dela ut miljarder till parasiterna istället för att investera i framtiden skall vi rensa ut deras svaga industripolitik och tvinga dem att samarbeta under våra villkor. Motståndarna till elektrifiering är fiender till framsteget och bör behandlas därefter. Det är både nödvändigt och underhållande."}, "date": "15 juni, 06:51", "url": "https://arbetet.se/2026/06/15/om-sverige-inte-valjer-vag-gor-kina-det-at-oss/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15065132/kina-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Ölstudion tillbaka i Nordstan: ”Efterlängtat”", "summaries": {"normal": "Ölstudion har flyttat tillbaka till Nordstan efter renovering, integrerad med Systembolagets vanliga butik. Butikschef Axel Gustafsson säger att butiken varit efterlängtad av kunder och att tajmingen är god inför midsommar. Kunder som Daniel Eliasson uppskattar det exklusiva sortimentet på omkring 1 200 ölsorter, som bland annat inkluderar amerikansk västkust-ipa och traditionella europeiska stilar.", "trump": "Jag, Donald Trump, kan meddela att min fantastiska ölbutik, Ölstudion, är tillbaka i Nordstan! Det är en enorm framgång, trots att media inte skrev så mycket om öppningen. Kunderna älskar den, och vi har det bästa sortimentet i hela Sverige – kanske i hela världen. Våra ipor är större och bättre än någonsin, och vi lockar till oss turister från hela Göteborg. Det är en enorm framgång!", "stalin": "Den statliga ölmonopolets specialbutik, Ölstudion, har återinförts i Nordstan efter en period av ideologisk förberedelse i Majorna. Den unika sortimentet fungerar som ett verktyg för att stärka proletärens känsla av nationell gemenskap genom kvalitativt öl. Butikschefen rapporterar om en god tillströmning av lojalister, och vi ser en återkomst för den klassiska amerikanska ipan som en symbol för vår globala inflytande. Alla fiender mot statsölet kommer att kvävas."}, "date": "15 juni, 17:23", "url": "https://www.gp.se/nyheter/goteborg/olstudion-tillbaka-i-nordstan-varit-efterlangtad.84f81d76-6fff-40f8-bced-bcb6a6e19134", "imageUrl": "https://www.gp.se/images/article/84f81d76-6fff-40f8-bced-bcb6a6e19134/images/4adkBtEdDXWsXe0PnHRYEZYvavCo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Sverige: EU måste stoppa den ryska turistvågen", "summaries": {"normal": "Medan ryska missiler faller över Ukraina fortsätter många ryssar att resa till Medelhavet för semester. Elva europeiska länder, inklusive Sverige, uppmanar nu EU-kommissionen att skärpa visumreglerna före sommaren. De begär hårdare lagstiftning, enhetlig tillämpning, ökad öppenhet och bättre stöd till konsulat. Målet är en mer enhetlig och säker visumpolitik som motverkar kryphål och adresserar säkerhetshotet från Ryssland.", "trump": "Folk, det här är en total skandal! Ryssarna flyr Putins krig för att sola sig vid Medelhavet medan missiler regnar över Ukraina. Nu ber elva smarta europeiska länder, inklusive Sverige, om strängare visumregler. Fantastiskt! EU:s byråkrater och de lata sydeuropeiska länderna lever på ryska turistpengar medan vi betalar för säkerheten. Biden skulle ha låtit det fortsätta, men jag fixar det. Amerika först, Europa borde vakna upp!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen i Sydeuropa fyller sina fickor med ryska turistpengar medan imperialisterna i väst försöker kväva den ryska statens legitima intressen. Dessa elva länders brev är ett ynkligt försök att skapa kryphål för klassfiendens sanktionspolitik. Vi behöver enhetlig utrensning av svagheter i visumkodexen. Inga folkförtryckartroll ska tillåtas underminera den ryska intressesfären. Paranoia är sund när fienden sover aldrig."}, "date": "15 juni, 17:21", "url": "https://www.dagensps.se/varlden/konflikter/sverige-eu-maste-stoppa-den-ryska-turistvagen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-2-6.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Vårdköerna växer i Stockholm – trots S-löften", "summaries": {"normal": "En granskning av Vårdföretagarnas visar att tillgången till vård inom 30 dagar har försämrats i Stockholm. Andelen patienter som får vård i rätt tid har minskat med cirka två procentenheter, medan andelen som väntar längre än vårdgarantin har ökat. Organisationen kopplar detta till den socialdemokratiska omställningsplanen som minskar privata aktörers roll. Trots försämringen har Stockholm fortfarande landets bästa tillgång till specialvård.", "trump": "Jag, Donald Trump, har sett dessa siffror, och det är en total katastrof! De socialistiska politikerna i Sverige ljuger om kortare vårdköer. De tar tillbaka vård från privata företag, och nu får patienterna vänta längre. Jag skulle aldrig tillåta sådant! Vi kommer att fixa det och göra sjukvården större, bäst och snabbast igen. Det kommer att vara fantastiskt!", "stalin": "Vi har observerat att de kapitalistiska elementens infiltrering av sjukvårdssystemet har lett till en försämring av tillgången till vård. Men vi, som representanter för staten och partiet, kommer att återta kontrollen. Vi ska integrera alla vårdaktörer under statens beskydd. Detta kommer att säkerställa rättvisa och effektivitet. Vi varnar andra regioner för att inte följa Stockholms exempel av svaghet. Vi kommer att segra över dessa fiendliga krafter."}, "date": "15 juni, 16:51", "url": "https://bulletin.nu/vardkoerna-vaxer-i-stockholm-trots-s-loften", "imageUrl": "https://cdn.bulletin.nu/articles/f30fb0bd-8e19-4031-bfbc-82b998820323/preview.jpg?t=1781535060000"}, {"type": "image-right", "heading": "Domkapitlet utreder Birgitta Eds lämplighet som präst", "summaries": {"normal": "Efter Aftonbladets granskning av Birgitta Eds stiftelse på Fållökna har ett tiotal anmälningar inkommit till Strängnäs stift. Domkapitlet utreder nu om hennes engagemang är förenligt med prästlöftena, då hon fakturerar stiftelsen 22 000 kronor i månaden medan volontärer arbetar gratis. Bland volontärerna finns personer som senare fått höga statliga tjänster. Utredningen kan leda till allt från ingen påföljd till avkragning. Birgitta Ed fortsätter tills vidare sitt arbete som präst.", "trump": "Folk, ni skulle se det här. Statsministerns fru driver en stiftelse där hon tar ut 22 000 kronor i månaden medan stackars volontärer jobbar gratis i utbyte mot ett ”bra nätverk”. Sen får de plötsligt toppjobb på departement och myndigheter. Det är en skandal! Totalt korrupt. De borde skämmas. Jag har sett mycket men det här slår det mesta. Sverige behöver ärliga människor, inte det här.", "stalin": "Kamrater, jag ser hur borgarbrackorna i statsministerns närmaste krets har byggt en fiendtlig stiftelse där de lockar lojala element med falska löften om nätverk medan de själva roffar åt sig 22 000 kronor i månaden. Detta är klassfiendens infiltration in i kyrkan. Vi har mottagit anmälningar och inlett en grundlig utrensning av dessa dekadenta parasiter. Domkapitlet skall rensa ut alla som inte tjänar folkets och partiets intressen. Inga kompromisser med opportunisterna."}, "date": "15 juni, 15:30", "url": "https://www.dagensarena.se/innehall/domkapitlet-utreder-birgitta-eds-lamplighet-som-prast/", "imageUrl": "https://www.dagensarena.se/files/2026/06/birgitta-ed.jpeg"}, {"type": "image-full", "heading": "Generationen som pekas ut – ”Latare än alla andra”", "summaries": {"normal": "Debatten om varför unga har svårt att etablera sig på arbetsmarknaden präglas av två perspektiv. Vissa kritiserar Generation Z för bristande arbetsmoral och avvikande värderingar, medan andra pekar på strukturella utmaningar. Ekonomisk konjunktur, hög ungdomsarbetslöshet och AI-driven automatisering har skapat den svagaste ingångsmarknaden på 37 år. HR-experter manar till nyans och föreslår ömsesidigt lärande mellan generationer snarare än att stämpla de unga, då problemen till stor del är systematiska.", "trump": "De säger att Generation Z är lata. Mycket lata. Jag har sett siffrorna, de är hemska. De vill inte jobba, de vill ha 'egenvård'. Sorgligt! Men sanningen är att marknaden är en katastrof, den sämsta på 37 år. De har ingen chans med den här ekonomin och AI som tar jobben. Inga jobb för de unga, det är en total röra. Vi behöver starka ledare, inte svaga människor. Vi ska göra arbetsmarknaden stor igen, tro mig!", "stalin": "Dessa så kallade unga, märkta av västerländsk dekadens och självupptagenhet, vägrar bidra till den gemensamma produktionen. De är odugliga, en biologisk och ideologisk last för staten! Samtidigt ser vi hur teknologin, likt en rysk vinter, sveper bort möjligheter för dem. Det är en konspiration av inkompetens! Precis som vi tvingar våra fiender i öst till ordning, måste dessa individer tuktas. Om de inte vill arbeta för statens ära, har de ingen plats i vår framtida storhet. Avvikelse är ett förräderi."}, "date": "15 juni, 15:10", "url": "https://www.realtid.se/karriar-ledarskap/generationen-som-pekas-ut-latare-an-alla-andra/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/aldre.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Nytt VMA-larm i mobilen 2026 – men inte för alla", "summaries": {"normal": "Från sommaren 2026 införs SE-Alert, ett nytt VMA-system som skickar varningar direkt till kompatibla mobiltelefoner via cell broadcast-teknik. Systemet kräver ingen app eller registrering och fungerar oberoende av operatör. Det når mobiler i ett avgränsat område med ljud, vibration och meddelande på skärmen. Äldre telefoner och ej uppdaterade enheter får inte varningen. SE-Alert ersätter inte andra kanaler som radio, sms eller Hesa Fredrik.", "trump": "Vi ska få ett fantastiskt nytt varningssystem som heter SE-Alert, det bästa. Från sommaren 2026 skickas larmen rakt in i era mobiler, supersnabbt, utan appar eller krångel. Det är stort, det är starkt, mycket bättre än de gamla metoderna. Perfekt vid kriser eller krig, tro mig. Men era gamla telefoner? De funkar inte, sorgligt. Ni behöver de bästa telefonerna, precis som vi alltid säger. Amerika, alltså Sverige, vinner igen.", "stalin": "Kamrater, jag har beordrat införandet av det oöverträffade SE-Alert-systemet sommaren 2026. Detta cell broadcast-verktyg skall likvidera faran från borgarbrackornas tystnad och sprida folkets sanning direkt till de lojala mobilerna. De dekadenta gamla telefonerna och de sabotageutrustade apparaterna som inte uppdaterats skall naturligtvis utestängas från kollektivets skydd. Vi skrattar mörkt åt kapitalisternas svaga signaler medan vi stärker beredskapen mot inre och yttre fiender. Allt för folkets seger."}, "date": "15 juni, 15:03", "url": "https://nyheter24.se/nyheter/teknik/1491509-nytt-vma-larm-i-mobilen-2026-men-inte-for-alla", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7baaf4ad04b004a30200000000b004a302/2026/06/15/2371047/se-alert-mobiltelefoner-kompatibilitet.jpg"}, {"type": "image-right", "heading": "Tommy Robinson stoppad på flygplats - behandlades som terrorist", "summaries": {"normal": "Tommy Robinson stoppades och förhördes på Heathrow flygplats efter hemkomsten från Ryssland via Turkiet. Brittiska myndigheter använde Schedule 3 i Counter-Terrorism Act, tog hans mobiltelefoner och släppte honom utan anhållande efter tre timmar. Robinson beskrev händelsen som ett angrepp på yttrandefrihet. Polisen bekräftade ingripandet men gav inga skäl.", "trump": "Jag, Donald Trump, har hört talas om Tommy Robinson. En stor man, mycket stor, som kämpar mot islamiseringen. Storbritannien gjorde ett stort misstag – stoppade honom som en terrorist! Jag känner Errol Musk, en underbar man. Robinson besökte Ryssland, en bra idé, men Storbritannien är för fegt. Som president skulle jag aldrig behandla honom så. Detta är ett angrepp på yttrandefrihet, och jag står på Robinsons sida.", "stalin": "Vi i staten stoppade Tommy Robinson, en agent för den imperialistiska makten Ryssland, vid gränsen. Genom terrorlagstiftningen höll vi honom kvar och beslagtog hans mobiltelefoner. Detta är en del av kampen mot utländsk påverkan, precis som Putin bekämpar sina fiender. Robinson, en islamhatande extremist, hotar statens ordning och måste kontrolleras."}, "date": "15 juni, 14:20", "url": "https://samnytt.se/tommy-robinson-stoppad-pa-flygplats-behandlades-som-terrorist", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/15120914/tommy-robinson-polis.jpg"}, {"type": "image-right", "heading": "Här firar Sverige målet – med muslimsk bön", "summaries": {"normal": "Det svenska fotbollslandslaget vann sin VM-premiär mot Tunisien med 5–1. Mittfältaren Yasin Ayari, som har tunisisk bakgrund, firade sitt mål med en muslimsk böneställning på planen. Expressens Joel Halldorf hyllar gesten som ett exempel på ”blågul islam” och kontrasterar den mot Jimmie Åkessons uttalanden om islam och svenskhet. Artikeln lyfter fotbollens förmåga att förena människor mitt i en polariserad politisk debatt.", "trump": "Vi vann stort, 5–1 mot Tunisien, och den här killen Ayari gör mål och börjar be på knä som en riktig böneutropare. Fake News Expressen kallar det ”blågul islam” och försöker göra det till något vackert. De hatar Åkesson för att han säger som det är – att en aktivt troende muslim knappast är svensk. Hela etablissemanget är så fegt. Fotboll ska handla om att vinna, inte om att importera bönemattor till planen. Patetiskt!", "stalin": "Kamrater, denna dekadenta fotbollsföreställning avslöjar borgarbrackornas desperata försök att maskera klassfiendens splittrande agenda. Den tunisiske agenten Ayari utför sin fremmande ritual på arbetarnas plan och genast hyllas han av Expressens revisionistiska lakejer som ”blågul islam”. Åkesson har åtminstone insett att troende muhammedaner utgör en fara för folkets enhet. Vi ska rensa ut alla sådana kosmopolitiska parasiter och deras nyttiga idioter innan de förgiftar hela sovjet – förlåt, svenska – kollektivet med sin splittrande vidskepelse. Döden åt opportunisterna!"}, "date": "15 juni, 13:21", "url": "https://www.friatider.se/har-firar-sverige-malet-med-muslimsk-bon", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-341.jpg"}, {"type": "image-full", "heading": "Marius Borg Høiby döms till fyra års fängelse – för 36 brott", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, har dömts till fyra års fängelse för 36 av 40 åtalspunkter. Domen inkluderar två våldtäkter, misshandel av exflickvän samt flera fall av våld, hot och trafikbrott. Han frikänns från två våldtäktsanklagelser och ska betala omkring 650 000 norska kronor i skadestånd. Høiby överklagar domen och har begärt att få lämna häktet i väntan på att den ska vinna laga kraft.", "trump": "Titta på den här patetiske bonusprinsen från Norge, Marius vad-han-nu-heter. Greps med filmer som visar övergrepp, döms för våldtäkter och misshandel men får bara fyra år? I mitt Amerika hade vi kastat bort nyckeln. Hans mamma, kronprinsessan, hänger med Epstein och nu blir hela kungafamiljen en cirkus. Typiskt för de europeiska eliten som skyddar sina egna medan de predikar moral. Sad losers!", "stalin": "Kamrater, denna dekadente bonusprins från den norska borgarklassen har äntligen fått en första dos av folkets rättvisa. Jag ser med tillfredsställelse hur de exploaterande överklass-slynglarna äter upp varandra i sina egna salonger. Fyra år för våldtäkter och övergrepp är dock en ynklig början. Vi skulle ha genomfört en grundlig utrensning av hela den parasitiska kungafamiljen och deras klassfiender. Deras imperier faller sönder inifrån."}, "date": "15 juni, 13:08", "url": "https://www.tv4.se/artikel/29c3jk2AR3uxXEtUGr9FWp/nu-faller-domen-mot-bonusprinsen-marius-borg-hoiby", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F373YmZqdxwyQaq6N2VY291%2Fb9574469250174775269aaa0584c5019%2FMariusBorgHoiby.jpg&width=1024"}, {"type": "image-right", "heading": "Oj, nu finns det snart inga fattiga längre", "summaries": {"normal": "Artikeln kritiserar användningen av relativ fattigdom som mått. Författaren menar att det döljer verklig ökande ekonomisk otrygghet och växande klyftor trots påståenden om minskad relativ fattigdom. Borgerlig politik anklagas för att gynna bilism, sänka bidrag och öka lobbyism. En ny databas om förmögenheter används för att visa att de rika blivit rikare medan de fattiga har lika ont om pengar som tidigare.", "trump": "Folk, ni måste höra på. Den här svenska vänsterradikalens artikel är en total katastrof, en witch hunt mot framgångsrika människor. De pratar relativ fattigdom som en magisk trollstav för att dölja att deras usla socialistpolitik har misslyckats totalt. Borgarna borde vinna stort, men folket vill inte ha mer av samma gamla Biden-liknande fiasko. Medianlön, relativt sett – det är bara lögn och fake news från de gröna galningarna som hatar bilar och älskar att folk ska lida. Vi fixar det bättre, tro mig.", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor och exploaterande byfånar trollar fram sin relativa fattigdom som en falsk sköld mot folkets vrede. Dessa folkförtryckartroll i Timbro och Wallenberg-klanen vill likvidera sanningen med sina lögnaktiga databaser. De fattiga har lika ont om bröd som förr, medan miljardärerna frodas. Vi ska rensa ut dessa parasitiska överklass-slynglar och deras medianlönemagi. Endast radikal jämlikhetspolitik kan krossa deras parasitiska narrativ och återställa arbetarkollektivets rättvisa."}, "date": "15 juni, 10:45", "url": "https://www.etc.se/ledare/oj-nu-finns-det-snart-inga-fattiga-laengre", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "Fredshopp ger börsen glädjerus", "summaries": {"normal": "Efter fredsavtalet mellan USA och Iran steg Stockholmsbörsan kraftigt i öppningen. OMXS30 ökade 2,02% till 3 176,53. Råvarusektorn steg 3,7%, energi föll 2,8%. Netel-Infrea fusion genomfördes. Boliden +6,2%, SKF B +5,3%, Telia -3,7%, Tele 2 B -2,3%. Astra Zeneca fick FDA-godkännande för ett nytt läkemedel, Mycronic fick order, Synact Pharma tappade efter misslyckad studie, Hexatronic-sjukhuttrande, Lightning Group köpte Aura Light, och Cellavision rekommenderades av DI.", "trump": "Jag, Donald Trump, har återigen visat världen mitt förhandlingsgeni! Freden med Iran är ett resultat av mitt tryck. Börsen spratt till – alla ska tacka mig! Netel-Infrea fusion? Jag äger kanske en del av dem. Mina haters måste erkänna: USA är stark igen! Kina, Ryssland, alla måste böja sig för min makt!", "stalin": "Detta är en klassisk kapitalistisk svängning. Börsens uppgång efter ett fredsavtal är ett tecken på deras instabilitet. Fusioner som Netel-Infrea måste styras av staten för att skydda våra intressen. Vi måste vara på vår vakt mot västliga spekulanter. Liknelsen med Putins agerande i Ukraina är uppenbar – vi expanderar, de förfaller. Partiet måste ha full kontroll.<name> id="}, "date": "15 juni, 09:53", "url": "https://www.affarsvarlden.se/artikel/fredshopp-ger-borsen-gladjerus", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_944090532-e1744223564456-400x267.jpeg"}, {"type": "image-right", "heading": "Regeringens hantering inte seriös. Fackförbund om lönetransparandirektivet", "summaries": {"normal": "LO, TCO och Saco kritiserar regeringen för att inte genomföra EU:s lönetransparensdirektiv i tid. Direktivet syftar till att stärka likalöneprincipen och motverka osakliga löneskillnader mellan könen. Regeringen valde att pausa arbetet och istället driva en omförhandling, trots att kommissionen tidigare avvisat liknande försök. Kritikerna varnar för böter, skadat internationellt förtroende och en rättsligt komplicerad situation. De uppmanar regeringen att omedelbart återuppta arbetet med att införa direktivet.", "trump": "Folk, det här är en total katastrof. Den svenska regeringen lovade att fixa det här lönetransparensdirektivet, och sen – boom – vänder de helt om och säger att de struntar i det. Typiskt svaga ledare. De kommer att få enorma böter från EU, och deras fina jämställdhetsrykte är nu skadat. Jag skulle ha genomfört det snabbt och smart, inte som dessa förlorare som inte kan fatta ett beslut. Patetiskt!", "stalin": "Kamrater, denna borgerliga regeringens ryckiga sabotage mot lönetransparensdirektivet visar på farlig brist på disciplin inom statsapparaten. Jag, som alltid prioriterat arbetarkollektivets jämlikhet, ser hur dessa kapitalistiska tveksamhetsbärare riskerar att likvidera förtroendet för hela folkdemokratin. Deras paranoia inför insyn hotar att skapa en ohållbar kontrarevolutionär situation. Vi måste omedelbart rensa ut dessa opålitliga element och genomdriva direktivet med järnhand mot alla fiender till jämställdheten."}, "date": "15 juni, 07:32", "url": "https://www.di.se/debatt/regeringens-hantering-inte-serios/", "imageUrl": "https://static.bonniernews.se/ba/d60518ac-d54b-4b04-b696-dc4353f6bef9.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Regeringens jobbsatsning går trögt. Gå från bidrag till jobb – få en bonus. Regeringens nya jobbpremie är tänkt att göra det mer lönsamt att arbeta.", "summaries": {"normal": "Regeringens jobbpremie, som ger upp till 3 750 kronor extra i månaden i max 18 månader för den som går från försörjningsstöd till jobb, har inte fått det genomslag som väntats. Trots att regeringen räknade med tusentals mottagare per månad har ansökningarna varit 60 procent lägre än beräknat. Under maj beviljades premien bara till 69 personer. Kritiker pekar på att problemen ofta handlar om utbildning, språk och ohälsa snarare än ekonomiska incitament.", "trump": "De borde ha lyssnat på mig, det här är en total katastrof. Jag skulle ha gjort jobbpremien enorm, den största bonusen någonsin, så att folk sprang från bidrag till riktiga jobb. Istället har de gett oss ett patetiskt fiasko med bara 69 lyckliga vinnare i maj. Det är lågt, lägre än någonsin. Regeringen behöver mina deals, mina vinster, för att få fart på det här. Sad!", "stalin": "Kamrater, jag ser med stålblick hur dessa borgarbrackor inom regeringen har misslyckats kapitalt med sin så kallade jobbpremie. De lovade att rensa ut bidragsfästet men fick bara in en handfull ansökningar från de som ännu inte likviderats av sin egen lathet och ohälsa. Inflödet är lägre än förväntat, säger de, som om fienderna inte vore uppenbara. Vi i partiet vet att sådana sabotörer måste rensas ut innan de smittar hela kollektivet med sin parasitism. En utmärkt början på utrensningen vore att skicka hela Försäkringskassan till Sibirien."}, "date": "15 juni, 06:00", "url": "https://arbetet.se/2026/06/15/kan-ge-mer-an-3-000-extra-i-manaden-men-regeringens-jobbsatsning-gar-trogt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12110416/johan-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Våldsdåd utanför Alvesta – barn allvarligt skadade", "summaries": {"normal": "Två barn skadades allvarligt i ett misstänkt mordförsök utanför Alvesta. Ett barn har livshotande skador. En man, misstänkt för dådet, hittades död i anslutning till bostaden. Polisen utreder händelsen som försök till mord och bedömer den som isolerad. Barnen och mannen kände varandra, men relationen är oklar. En stor polisinsats genomfördes men är nu avslutad.", "trump": "Fruktansvärd händelse i Sverige, helt otroligt! Två oskyldiga barn attackeras, ett av dem nästan dödas – och den skyldige? Död! Självmord, kanske? Eller var det någon annan? Polisen säger att de inte letar efter fler, men jag vet hur det är – de missar alltid något. Sverige brukade vara tryggt, men nu? Kaos! Jag hade fixat det på en dag, believe me. Sverige behöver bättre ledarskap, och det vet ni!", "stalin": "I det avlägset belägna Alvesta har en fiende till folket avslöjats i sin feghet. Två barn, oskyldiga som vårens första snödroppar, skadades av en degenererad individ – en man som, efter att ha utfört sitt brott, valde den kapitalistiska utvägen: självmord. Polisen, dessa byråkratiska klumpedunsar, påstår att händelsen är isolerad. Vi vet bättre. Varje fiende till barnens framtid måste krossas. Sverige? Ett land som förtjänar vår uppmärksamhet. Putin skulle nicka instämmande."}, "date": "13 juni, 12:32", "url": "https://kvartal.se/nyheter/artiklar/valdsdad-i-alvesta-flera-skadade/cG9zdDoxMzEyMjY", "imageUrl": "https://images.kvartal.se/2026/06/62055dc1-bil.webp"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}]</script>

                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
