9/atpap.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Jojje Olsson: Kina gör USA:s sanktioner mot Iran verkningslösa", "summaries": {"normal": "USA har lanserat omfattande sanktioner, 'Operation Economic Outcast', för att isolera Iran ekonomiskt. Kampanjen riskerar dock att bli verkningslös eftersom Kina fortsätter köpa iransk olja och trotsar USA. Kina kontrollerar dessutom sällsynta jordartsmetaller, vilket gör att USA drar sig för att konfrontera landet, särskilt då ett viktigt möte med Xi Jinping närmar sig.", "trump": "Operation Economic Outcast är ett fantastiskt namn, helt enastående! Men de glömmer Kina. Kineserna gör affärer som om ingenting har hänt, de bara skrattar åt oss och skickar oljetankers hit och dit. Xi Jinping kommer till Vita huset snart, och vi ska göra en bra deal, den bästa någonsin. Men vi kan inte låta dem spela ut oss med sina metaller!", "stalin": "Dessa patetiska kapitalistiska sanktioner är ett praktexempel på inkompetens. De skriker om total isolering, men regimen i Peking handlar fritt med olja framför näsan på dem och hånar frihetsgudinnan med satirteckningar! När vi styrde staten tolererades inte dylikt svaghetsfönster; ett ord från centralkommittén och dessa köpmän hade placerats där de hör hemma."}, "date": "1 september, 08:18", "url": "https://www.affarsvarlden.se/kronika/jojje-olsson-kina-gor-usas-sanktioner-mot-iran-verkningslosa", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-45-900x600.jpg"}, {"type": "image-full", "heading": "Raderade bilderna på frun efter Saudi-flytten", "summaries": {"normal": "Den spanska fotbollsstjärnan Esther González har raderat bilder på sin fru och son från sociala medier efter att ha skrivit på för en saudisk klubb. Agerandet möter kritik med anledning av Saudiarabiens syn på samkönade relationer, samtidigt som RFSL:s ordförande pekar på problemet med att idrotten används för sporttvättning av diktaturer.", "trump": "Helt otroligt! Den här spanska fotbollsspelaren flyttar till Saudiarabien för deras pengar och raderar bilderna på sin fru på en gång! Väldigt svagt, totalt ryggradslöst! De tar cashen men viker sig direkt. Jag säger er, under America First hade vi aldrig haft det så här ynkligt. Sjukt, helt enkelt sjukt!", "stalin": "Den spanska idrottaren visar prov på exceptionell opportunism när hon omedelbart utplånar sin familj från de digitala arkiven för saudiskt guld. Vilken disciplin! Om bara våra egna sabotörer i jordbrukskollektivet uppvisade samma totala brist på sentimentalitet skulle femårsplanen vara säkrad. Ändå en djupt borgerlig moralisk kris. Säkerhetstjänsten bör notera detta."}, "date": "1 september, 07:39", "url": "https://kvartal.se/nyheter/artiklar/raderade-bilderna-pa-frun-efter-saudi-flytten/cG9zdDoxNzk2OTE", "imageUrl": "https://images.kvartal.se/2026/09/e5881416-saudd.webp"}, {"type": "image-right", "heading": "SD:s kampanj för att locka somaliska väljare", "summaries": {"normal": "Sverigedemokraterna har inlett en kampanj för att locka somaliska väljare med fokus på Somaliland. Partiet arbetar för att Sverige ska erkänna den självutropade staten. I en video uppmanar Markus Wiechel och Somalilands ambassadör somalier att rösta på partier som stödjer Somaliland. Kampanjen bygger på partiets långvariga engagemang i frågan.", "trump": "Titta på det här, folk. SD försöker vinna somaliska röster genom att stötta Somaliland, medan de svenska globalistiska clownerna och deras HBTQ-fixerade kvotpartier inte ens kan hitta Sverige på kartan. Smart drag. Rör inte vid vår suveränitet med era woke-skräp, rösta för verkliga allianser istället för de förlorande marxistiska nollorna.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare försöker manipulera invandrade massor med löften om erkännande av en utbrytarstat. Jag betraktar det som ett ynkligt försök att splittra folket ytterligare. En sådan parasitisk manöver förtjänar att rensas ut ur den politiska kroppen innan den förgiftar hela nationen med sina falska allianser."}, "date": "1 september, 13:36", "url": "https://www.friatider.se/sds-kampanj-att-locka-somaliska-valjare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-801.jpg?itok=sbdDwAkK"}, {"type": "image-right", "heading": "Rikslarm från näringslivet. Lyssna på varningarna för nya skatter", "summaries": {"normal": "Tunga företrädare för svenskt näringsliv varnar i Dagens Nyheter för de skattehöjningar som vänsterpartierna föreslår. De menar att miljardärsskatt, arvsskatt, förmögenhetsskatt och liknande förslag hotar investeringsklimatet, entreprenörskap och jobbskapande. Artikeln betonar att ett exportberoende land som Sverige måste vara attraktivt för kapital och ägande för att behålla välståndet.", "trump": "Lyssnar ni på de stora svenska företagsbossarna som ropar rakt ut? De rödgröna skattegalningarna vill krossa investeringarna med sina vansinniga pålagor. Det är en total katastrof! Jag byggde den starkaste ekonomin i historien, men sådana här vänsterblodssugare och identitetspolitiska nollor förstör allt. Sverige behöver en rejäl dos sunt förnuft, inte mer socialistiskt gift.", "stalin": "Kamrater, dessa giriga hyenor inom näringslivet skriker som skrämda råttor inför valet. De fruktar att deras exploaterande imperier ska beskattas rättvist. Jag ler från historien åt deras panik. Välstånd skapas inte av parasiterande profitörer utan av folkets kollektiva kraft. En sann utrensning av sådana dekadenta klassfiender vore ett nöje att bevittna. Deras rädsla är musik för revolutionen."}, "date": "1 september, 13:43", "url": "https://www.di.se/ledare/lyssna-pa-naringslivets-rikslarm", "imageUrl": "https://static.bonniernews.se/ba/c8e7ae25-9afb-4b49-b51d-d7b679821311.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Utländsk aktör beställde Sverigekritiska AI-bottar", "summaries": {"normal": "Enligt en rapport från Myndigheten för psykologiskt försvar har omkring 1 200 AI-konton på X, beställda av en utländsk aktör i Östasien, använts för att sprida polariserande inlägg i Sverige under 2025 och 2026. Nätverket, kallat ”Holiday”, gjorde över 50 000 inlägg och angrep bland annat politiker och myndigheter innan det stängdes ned.", "trump": "Sverige har blivit lurade! 1 200 falska AI-konton, helt fake news, har skapats av skumma typer i Östasien för att förstöra landet. De kallar det ”Holiday”, vilket är ett hemskt namn. De spred galna lögner genom falska ”Eva” och ”Peter”. Jag sa till dem, skaffa ett starkt försvar! Helt otroligt svagt av dem, men lyckligtvis stängde de ned skiten!", "stalin": "En grundlig granskning av Myndigheten för psykologiskt försvar avslöjar att 1 200 illojala AI-element, infiltratörer under täckmantel av namn som ”Markus” och ”Eva”, har saboterat den svenska samhällskroppen på uppdrag av utländska kapitalister. Detta förräderi mot proletariatet har nu likviderats av statsapparaten. Så går det för dem som sprider falsk agitation utanför vår direkta kontroll."}, "date": "1 september, 06:21", "url": "https://kvartal.se/nyheter/artiklar/utlandsk-aktor-bestallde-sverigekritiska-ai-botar/cG9zdDoxNzk2MjI", "imageUrl": "https://images.kvartal.se/2026/09/6e99aace-mpf.webp"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjänar folkets vrede och evig skam. Ren utrensning behövs."}, "date": "29 augusti, 03:21", "url": "https://samtiden.nu/2026/08/s-vill-styra-sverige-klarar-inte-ens-stockholm", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7239-1280x720.jpg"}, {"type": "image-right", "heading": "Kriminalvården byggs ut – men vem räknar barnen på utsidan?", "summaries": {"normal": "Sverige bygger ut Kriminalvården i stor skala, men barnens perspektiv glöms bort. Långa avstånd och höga tryck försvårar kontakten med frihetsberövade föräldrar, trots barnkonventionens rättigheter. Organisationen Bufff kräver nationell statistik och tydligt ansvar för att ge barnen stöd. Forskning visar att dessa barn löper ökad risk för utanförskap och kriminalitet.", "trump": "De bygger fängelser som aldrig förr, men glömmer helt de stackars ungarna utanför murarna. Patetiska svenska byråkrater och deras dekadenta välfärdsexperiment – typiskt! Under min förra mandatperiod skulle vi ha räknat varje barn, gett dem stöd och inte låtit några galna vänsterelement förstöra familjebanden. Fixa det nu, annars blir det en total katastrof!", "stalin": "Kamrater, när de imperialistiska systemets lakejer bygger ut sina fängelseimperier glömmer de medvetet proletariatets barn. Jag ser hur dessa giriga klassförrädare med sin byråkratiska likgiltighet förvärrar lidandet för de unga. Vi måste räkna varje barn, likvidera försummelsen och säkerställa deras rättigheter. Annars föder vi nya fiender inom egna led."}, "date": "31 augusti, 09:40", "url": "https://www.etc.se/debatt/kriminalvaarden-byggs-ut-men-vem-raeknar-barnen-paa-utsidan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260831070828_28abaa0abc342ce2dce9951c4436c6d5cb071d16a726eebe556f504f2217dccb.png"}, {"type": "image-right", "heading": "Slarva inte bort Sveriges framgångar", "summaries": {"normal": "Jan-Olof Jacke och Catharina Elmsäter-Svärd varnar för att politiska vallöften riskerar att undergräva Sveriges framgångar. Artikeln lyfter fram reformer som sänkt skattetryck, ökad välfärd, minskade utsläpp och stark tillväxt sedan 1990-talet. Författarna betonar vikten av att värna om ett gott företagsklimat och pragmatiska reformer för framtida konkurrenskraft.", "trump": "Folk, ni vet att Sverige var ett totalt vrak på sjuttiotalet, men de fixade det med smarta reformer och blev Europas ljus. Nu vill de galna vänsterpolitikerna slänga allt i soporna med bidrag, skatter och lathet. Det är en katastrof. Håll fast vid det som fungerar, annars blir det en riktig röra igen. Fantastiskt land, men vakna upp!", "stalin": "Kamrater, jag betraktar med djup misstro hur dessa giriga profitthungriga hyenor försöker bevara sin dekadenta marknadsekonomi. De prisar sina så kallade reformer medan arbetarklassen riskerar att kvävas av nya borgerliga lögner om tillväxt. Vi vet att sådan falsk pragmatism leder till undergång. Rensa ut de falska profeterna innan de förgiftar folket fullständigt."}, "date": "1 september, 12:58", "url": "https://www.di.se/debatt/slarva-inte-bort-sveriges-framgangar", "imageUrl": "https://static.bonniernews.se/ba/44d01c5e-9111-4f9a-a621-7a05368700ef.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Netanyahu går till val på att ha \"manipulerat Trump\"", "summaries": {"normal": "Israels premiärminister Benjamin Netanyahu har i en tv-intervju skrutit om hur han efter 40 års arbete lyckats påverka USA att starta krig mot Iran. Han lyfter fram sin långa medieexponering och kännedom om amerikanska politiker. Uttalandena kommer inför valet och har kritiserats av bland andra Max Blumenthal och Irans utrikesminister.", "trump": "De här israeliska smarta killarna tror att de kan skryta om att de lurade mig till ett krig mot Iran. Fel! Jag visste precis vad som pågick, men det är patetiskt att Netanyahu nu springer runt och tar åt sig äran som en desperate liten valfisk. Fake news och svaga ledare överallt, vi behöver inga giriga globalister som styr showen.", "stalin": "Se hur de imperialistiska profitthungriga hyenorna skryter öppet om att de dragit en stormakt i ett blodigt krig för egna intressen. Jag betraktar detta som ett klassiskt exempel på dekadent manipulation. Sådana handlingar förtjänar endast förakt och framtida utrensning ur historien. Kamrater, vakna upp mot dessa parasiterande krafter."}, "date": "1 september, 12:31", "url": "https://www.friatider.se/netanyahu-gar-till-val-pa-att-ha-manipulerat-trump", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-799.jpg?itok=kDpR-o6w"}, {"type": "image-right", "heading": "VIDEO: V-politiker vill mörda SD-sympatisörer: \"Man dödar dem\"", "summaries": {"normal": "En Vänsterpartistisk kommunpolitiker i Upplands Väsby har fångats på film under en debatt där hon öppet uttalade att man ska döda rasister. Händelsen filmades av en frilansjournalist efter att politikern försökt störa mötet med en visselpipa och konfronterat en Sverigedemokrat.", "trump": "Helt otroligt! En radikal vänsterpolitiker i Sverige, total katastrof, skriker att man ska döda politiska motståndare. Så otrevligt! Om det hände i USA skulle Fake News-media skrika, men här skyddar de sina egna. Vi har röster som vinner, och vi vill ha lag och ordning, inte galningar med visselpipor!", "stalin": "Kamrater, i Upplands Väsby har en lokal agitator misslyckats med att disciplinera sina känslor offentligt. Att öppet skrika om eliminering av politiska motståndare utan partiets direkta sanktion är ett organisatoriskt haveri. Hon fördes bort av polis, vilket visar bristande ideologisk skärpa. Effektiv kontrarevolutionär verksamhet krävs i tysthet, inte med visselpipa."}, "date": "1 september, 13:10", "url": "https://samnytt.se/video-v-politiker-vill-morda-sd-sympatisorer-man-dodar-dem", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01110356/artikelhuvudbild-1-407.jpg"}, {"type": "image-full", "heading": "Kung Haakon har avlagt kunglig ed", "summaries": {"normal": "Efter kung Haralds död har kung Haakon VIII avlagt sin grundlagsed inför Stortinget. Drottning Mette-Marit tvingades ställa in sin medverkan på grund av komplikationer efter en tidigare lungtransplantation. Samtidigt visar en ny opinionsundersökning att stödet för den norska monarkin har ökat till 72 procent, trots tidigare skandaler och familjeproblem som har präglat hovet.", "trump": "Norge gör det fantastiskt, verkligen enormt! Kung Haakon svor en vacker ed, men tyvärr kunde inte Mette-Marit dyka upp på grund av tuffa hälsoproblem efter sin operation. Så tråkigt! Men folk älskar dem, stödet sköt i taket till fantastiska 72 procent direkt efter att Harald gick bort. De ignorerar alla fake news och falska skandaler totalt. Underbart!", "stalin": "Folket i det norska monarkistiska marionettdistriktet jublar nu med 72 procents påbjudet stöd efter den tidigare ledarens bortgång. Den nya potentaten Haakon har avlagt sin lydnadsed inför parlamentet, medan drottningen hålls under strikt medicinsk observation för sina lungkomplikationer. Statens apparat noterar noggrant alla avvikelser och övervakar situationen med största misstänksamhet mot eventuella kontrarevolutionära element."}, "date": "1 september, 13:23", "url": "https://www.gp.se/nyheter/varlden/haakon-har-avlagt-kunglig-ed-mette-marit-missade-ceremonin.5ae73ef2-8cce-4541-917c-0fa9eeea57c1", "imageUrl": "https://www.gp.se/images/article/5ae73ef2-8cce-4541-917c-0fa9eeea57c1/images/7lZyxGVNQs8RU67ErujJo0jB72ZI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Åkessons jakt på invandrarrösterna: Invandrare får bli majoritet i Sverige – så länge de är ”svenskar”", "summaries": {"normal": "I en rad utspel försöker SD-ledaren Jimmie Åkesson nå invandrarröster. Han menar att fokus nu är integration, att svenskhet styrs av medborgarskap och att det är okej om etniska svenskar blir minoritet – så länge invandrare delar svenska värderingar och identitet. Uttalandena har väckt både debatt och interna förtydliganden inom partiet.", "trump": "Sverige och min gode vän Jimmie gör stora, fantastiska saker nu! De inser att det handlar om värderingar, inte om hårfärg. Jag har ju själv sagt det länge, och Fake News-medierna sa att det var kontroversiellt. Men Jimmie förstår att vinnare vinner, och han gör ett fantastiskt jobb med integrationen där borta i Skandinavien!", "stalin": "Kamrat Åkesson diskuterar folkets identitet och kollektiva värderingar, vilket är av yttersta vikt för statens säkerhet. Att tolerera en demografisk förändring så länge lojaliteten mot regimen är absolut, visar på intressant ideologisk flexibilitet. Dock noterar vi att avvikelser i den sociala koden omedelbart bör rapporteras till partiet för ideologisk omkalibrering."}, "date": "1 september, 12:18", "url": "https://samnytt.se/akessons-jakt-pa-invandrarrosterna-invandrare-far-bli-majoritet-i-sverige-sa-lange-de-ar-svenskar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01092232/artikelhuvudbild-1-404.jpg"}, {"type": "image-right", "heading": "C-invandrare till svenskar som kräver anpassning: \"Ni som ska åka härifrån\"", "summaries": {"normal": "Centerpartiets Aida Karimli riktar hård kritik mot svenskar som kräver att invandrare ska anpassa sig till Sverige. I en kampanjvideo säger hon att det är de som inte accepterar mångfald som borde lämna landet. Karimli, som kandiderar till riksdagen, menar att Sverige inte tillhör någon särskild grupp och att hon tror på demokrati och alla människors lika rätt.", "trump": "Titta på den här galna C-politikern som hatar vanliga svenskar. Hon säger att ni som vill ha assimilation borde packa väskorna och sticka! Vilken otrolig löjlighet från en radikal vänsteraktivist. Fake Sweden, riggad identitetspolitik. De här woke-turisterna förstör ert fina land. Men oroa er inte, folket ser igenom de här misslyckade globalisterna.", "stalin": "Jag betraktar med djup förakt hur dessa dekadenta mångfaldshyaror angriper arbetarklassens sanna intressen. De som kräver ordning och anpassning ska enligt henne ut ur landet. Vilken farlig kontrarevolutionär arrogance! Vi känner igen dessa folkförrädiska element. En utrensning av sådana element vore nödvändig för att skydda folkets enhet och statens styrka."}, "date": "1 september, 11:16", "url": "https://www.friatider.se/c-invandrare-till-svenskar-som-kraver-anpassning-ni-som-ska-aka-harifran", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-798.jpg?itok=26ZS6-GK"}, {"type": "image-right", "heading": "Bilförsäljningen lyfte i augusti. Elbilar allt hetare • Fortsatt lyft för husbilar", "summaries": {"normal": "Registreringarna av nya personbilar steg med 12 procent i augusti till 22 584 stycken. Elbilarna ökade sin andel till 45 procent. Lätta lastbilar ökade med 27 procent medan tunga lastbilar och bussar minskade. Husbilsregistreringarna steg med 50,4 procent hittills i år, men husvagnar backade med 4,6 procent.", "trump": "Folket älskar bilar, och nu ser vi en fantastisk ökning med 12 procent i augusti. Elbilarna tar 45 procent, men det är inga woke-miljöterrorister som styr mig. Husbilarna exploderar uppåt med över 50 procent. De giriga gröna hyenorna hatar det, men under min ledning efter Bidens katastrof går Amerika och Sverige framåt igen. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta profitthungriga parasiternas marknad sväller med 12 procent fler personbilar och en explosion av husbilar. Deras falska frihet leder ändå till förfall. Vi betraktar detta med historisk skärpa och vet att en dag skall arbetarklassen rensa ut dessa klassfiender och deras leksaker i en stor utrensning. Sovjetisk disciplin överlever allt."}, "date": "1 september, 11:27", "url": "https://www.di.se/bil/lyft-for-registreringar-av-nya-bilar-i-augusti", "imageUrl": "https://static.bonniernews.se/ba/1088ea8e-5323-4a42-8598-aafac8909074.jpg?crop=8012%2C4006%2Cx0%2Cy667&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kommer muslimerna avgöra valet?", "summaries": {"normal": "Artikeln diskuterar hur muslimska väljares röstdeltagande kan bli avgörande i det svenska valet. Oppositionen närmar sig Tidöpartierna. Enligt Novus stöder 85 procent av muslimska väljare S, V och MP, med Socialdemokraterna som populärast. Lågt valdeltagande bland utrikes födda ger mobiliseringspotential. Exempel på kampanjer och historiska fall av röstmobilisering nämns, vilket kan påverka utfallet.", "trump": "Folk, det här är en total katastrof för Sverige. De radikala vänstermuslimerna röstar som galningar för de värsta förlorarna – Sleepy S och hans kommunistkompisar – medan riktiga svenskar sover. De riggar valet med förkryssade sedlar och moskéaffärer. Om jag var där skulle jag säga: vakna upp, annars blir det mer invandring och ingen vinner utom de korrupta globalisterna. Patetiskt!", "stalin": "Kamrater, se hur de borgerliga reaktionärerna darra inför folkets röst. Jag betraktar med förakt hur dessa socialfascister köper lojalitet från de importerade massorna för att klamra sig fast vid makten. En sådan dekadent manipulation förtjänar utrensning. Det är ett ynkligt skådespel som bevisar att klassfienderna aldrig förändras, bara byter mask. Låt dem darra vidare."}, "date": "27 augusti, 07:45", "url": "https://samtiden.nu/2026/08/kommer-muslimerna-avgora-valet", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7234-640x360.jpeg"}, {"type": "image-right", "heading": "Bridgespelarna: ”Det är för mycket valfläsk och tjafs”", "summaries": {"normal": "Pensionärer i Stockholm samlas regelbundet för att spela bridge på Hägerstensåsens medborgarhus. Spelet erbjuder social gemenskap, mental stimulans och spänning. Många är kritiska till valrörelsen 2026 och upplever att partierna underskattar pensionärer. Flera röstar blankt eller önskar en mittenregering. Klubben söker mer ekonomiskt stöd från stadsdelen.", "trump": "Titta på de här underbara pensionärerna som spelar bridge i Stockholm. Fantastiskt! De hatar den riggade valrörelsen där de globalistiska partierna bara köper röster från barnfamiljer medan de glömmer de som byggde landet. Rena bedragare. Jag älskar att de röstar blankt mot de korrupta eliten. Helt rätt. Gör bridge great again!", "stalin": "Kamrater, dessa pensionärer avslöjar dekadenta klassförrädare som lovar guld och gröna skogar men levererar tomma löften. Jag ler mörkt från historien när de röstar blankt mot de profitthungriga parasiter som styr valrörelsen. Snart kommer utrensning av alla valfläskets lakejer. Bridgeklubben visar arbetarklassens sanna styrka mot borgerlig dekadens."}, "date": "1 september, 01:30", "url": "https://www.dagensarena.se/innehall/bridgespelarna-det-ar-mycket-valflask-och-tjafs", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-98.jpg"}, {"type": "image-right", "heading": "Återupprätta biståndet – för Sveriges säkerhet", "summaries": {"normal": "Socialdemokrater för Tro och Solidaritet kritiserar regeringen för att använda bistånd som finansiering för inrikespolitiska löften som gratis förskola. De menar att nedskärningar i biståndet till fattiga länder och FN-program rasar Sveriges internationella anseende som försvarare av demokrati och fred. Författarna uppmanar till att återställa enprocentsmålet och stödet till UNDP.", "trump": "Folk älskar mig, men de här svenska socialisterna är totala förlorare. De gnäller över att regeringen tar från sina globala kassakossor för att ge gratis dagis istället för att skicka miljarder till korrupta diktaturer. Patetiska! Sverige var en gång stort, nu är det en skam. Jag fixade Amerika – de borde lära sig innan de går i konkurs som Biden lämnade efter sig.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i regeringen plundrar biståndet för att köpa billiga röster med gratis förskola. De river ner sextio års internationellt förtroende och lämnar tomrum åt fiender. Jag ler ironiskt från historien – sådana giriga hyenor förtjänar utrensning. Återställ ordningen, annars sväljer krisen er alla."}, "date": "1 september, 01:30", "url": "https://www.dagensarena.se/opinion/ateruppratta-bistandet-sveriges-sakerhet", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-2026-08-31t100338781-300x157.jpg"}, {"type": "image-right", "heading": "Folkbildningens starkaste argument ligger framför oss", "summaries": {"normal": "Artikeln argumenterar för att folkhögskolan kan bli allt viktigare i en framtid där AI tar över många arbetsuppgifter. När arbete inte längre ger identitet och mening behöver människor platser för bildning, gemenskap och skapande. Folkbildningen erbjuder sådana rum utan krav på omedelbar nytta, och kan fungera som en motvikt till ett samhälle där ekonomisk produktivitet definierar människors värde.", "trump": "Folkhögskolor? Lysande! AI kommer att krossa de korkade globalisternas jobbmaskineri och lämna alla dessa woke-aktivister och kvoteringsfanatiker utan mening i livet. Vi behöver inte fler förlorare som sitter och ritar regnbågsflaggor. Ge folket riktiga platser att träffas, inte de dekadenta eliternas fantasier. Amerika först, Sverige borde följa efter istället för att lyssna på dessa misslyckade socialister.", "stalin": "Kamrater, se hur de giriga profitthungriga klassfienderna redan fruktar maskinernas framfart. Deras falska utbildningsfabriker bygger bara på exploatering och tom nytta. Jag säger: folkbildningens kollektiva verkstäder kan bli vår nya utrensning mot den parasitiska individualismen. Låt folket skapa och organisera sig fritt från de blodsugande penninghyenornas grepp. Annars väntar ett samhälle av meningslös dekadens."}, "date": "1 september, 01:26", "url": "https://www.dagensarena.se/opinion/folkbildningens-starkaste-argument-ligger-framfor-oss", "imageUrl": "https://www.dagensarena.se/files/2026/06/johan-lindahl-300x157.jpeg"}, {"type": "image-right", "heading": "En vecka av ryska attacker mot Kiev", "summaries": {"normal": "Kiev-området har skakats av intensiva ryska attacker under en vecka. Under natten mot tisdagen dödades tolv personer, varav tre barn. Ryssland använder en ny typ av snabb jetdriven drönare som är svår att skjuta ner. Skolstarten präglas av oro och guvernören har uppmanat till att undvika stora samlingar av barn.", "trump": "De där vansinniga ryssarna bombarderar Kiev dag och natt med sina nya supersnabba drönare, totalt kaos. Zelenskyjs clownregim kan inte skjuta ner någonting längre. Under tiden startar skolan mitt i eländet och guvernören ber barnen hålla sig undan. Biden lämnade ett sådant svagt Europa åt vargarna, men nu fixar jag det.", "stalin": "Dessa dekadenta klassförrädare i väst fortsätter att beväpna de ukrainska hindren mot den ryska intressesfären. Jag ser med tillfredsställelse hur den nya efterträdaren använder jetdrönare för att krossa motståndet. Låt skolbarnen gömma sig i rädsla, det är priset för att trotsa historiens oundvikliga marsch. Fienderna skall likvideras."}, "date": "1 september, 12:32", "url": "https://www.svt.se/nyheter/utrikes/en-vecka-av-konstanta-attacker-mot-kiev", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.49/0.47/7e9f0f12c640be18705ca5c073ce3994a4ab71625b3d497bced0ff18215ed8c0"}, {"type": "image-full", "heading": "Kristersson: Tidöpartierna kan vinna valet utan Liberalerna", "summaries": {"normal": "Inför det svenska riksdagsvalet skärps tonen inom Tidösamarbetet. Statsminister Ulf Kristersson (M) uppger att M, KD och SD kan vinna valet på egen hand även om Liberalerna åker ur riksdagen, och avråder från stödröster. Liberalerna slår tillbaka och kallar en seger omöjlig utan deras mandat, medan Kristersson menar att oppositionen saknar ett stabilt regeringsunderlag.", "trump": "Dessa svenska politiker beter sig som totala förlorare! Den lilla killen Kristersson säger att de kan vinna utan sitt svagaste parti, Liberalerna, som håller på att krascha helt under spärren. Vilket enormt fiasko! De rödgröna är en total katastrof, men om man inte ens kan hålla ihop sitt eget lilla gäng förtjänar man att förlora stort. Sjukt!", "stalin": "Det borgerliga blockets interna schismer avslöjar deras totala ideologiska bankrutt. När småborgerliga lakejer som Kristersson försöker överge sina svagaste bundsförvänfter blottläggs den borgerliga statens inre ruttnad. Vi konstaterar kallt att den som inte förmår disciplinera sina egna led är dömd att krossas av historiens oundvikliga maskineri. Partidisciplin är statens enda sanna fundament."}, "date": "1 september, 13:13", "url": "https://bulletin.nu/kristersson-tidopartierna-kan-vinna-valet-utan-liberalerna", "imageUrl": "https://cdn.bulletin.nu/articles/9107c585-d686-4fa6-a25a-22edae1733ca/preview.jpg?t=1788261212000"}, {"type": "image-full", "heading": "Åkesson om bråken: ”Bör bejaka våra skillnader”", "summaries": {"normal": "I TV4:s Valutfrågningen kommenterade Jimmie Åkesson Tidöpartiernas bråk och Ebba Buschs uttalanden om ett samarbete med S. Åkesson vill bejaka partiernas skillnader för att maximera rösterna och försvarar sitt ultimatum till Liberalerna. Han uttryckte även oro för att Örebropartiet ska stjäla viktiga väljare från Sverigedemokraterna.", "trump": "Jimmie Åkesson har det tufft, totalt kaos med hans så kallade vänner i regeringen! De bråkar hela tiden, precis som falska nyheter-medierna. Och nu är han rädd för något litet Örebroparti som ska sno hans väljare? Väldigt svagt! Jag hade löst det på en sekund med enorma framgångar. Sad!", "stalin": "Kamrat Åkesson gråter ut i televisionen över illojala bundsförvanter och små desertörer som Örebropartiet. Så ser det ut när disciplinen brister i de borgerliga leden! Om de inte kan ena sig mot hotet måste vi skicka dem på en uppfostrande semester i Sibirien. Partiet kräver absolut lojalitet, annars väntar korrektionsarbete!"}, "date": "31 augusti, 20:29", "url": "https://kvartal.se/nyheter/artiklar/akesson-om-tidobraket-vill-inte-braka/cG9zdDoxNzk0NTg", "imageUrl": "https://images.kvartal.se/2026/08/d82bd903-akesson-1.webp"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att stärka vänsterfalangen. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar gynnar bara högern inom S.", "trump": "Lyssnar ni på de här ynkliga sossarna som gråter över sin egen högersväng? Patetiskt! De vill att unga ska stanna kvar på det sjunkande skeppet istället för att rösta på riktiga alternativ. Miljöpartiets cykelvägshajar och vänsterns fackförrädare är värdelösa. Organisera er? Nej, rösta bort de riktiga förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska avfällingar gråter över sin högersväng som om det vore en olycka. Jag ser hur de profitthungriga klassförrädarna inom partiet förgiftar arbetarnas vilja. Lämna inte skeppet, säger de, medan splittringarna hotar kollektivet. Rensa ut de dekadenta opportunisterna innan de likviderar varje äkta revolutionär anda."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Marabou-fabriken görs om – får ny uppgift om krisen kommer", "summaries": {"normal": "Marabou-fabriken i Upplands Väsby får en ny roll i Sveriges beredskapsarbete. Kommunen har ingått ett avtal med ägaren Mondelēz, Svensk Cater och Ica Format för att stärka livsmedelsförsörjningen vid kriser, allvarliga störningar och eventuellt krig. Fabriken ska inventera resurser, skapa planer och öva samverkan. Det är kommunens första sådana överenskommelse.", "trump": "Lysande! De där svenska chokladkillarna i Upplands Väsby gör äntligen något vettigt istället för att bara tillverka sötsaker åt de woke, gröna, identitetspolitiska snyltarna. Jag älskar det. Beredskap mot kris och krig – smart drag. Biden skulle ha gett fabriken till Kina, men nu fixar de det rätt. Fantastiskt folk, de där svenskarna, nästan lika bra som amerikaner.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna nu tvingas förbereda sig på den stora prövningen. Jag ler ironiskt från historien när de parasiterande exploatörerna i Upplands Väsby inventerar resurser åt folket. Deras dekadenta system kommer att rämna, och vi ska skratta när byråkraterna likviderar sina egna illusioner om evig fred. Beredskap är bra – men inte deras."}, "date": "1 september, 13:43", "url": "https://nyheter24.se/nyheter/konsument/1509530-marabou-fabriken-gors-om-far-ny-uppgift-om-krisen-kommer", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/600cf6f304b004a30200000000b004a302/2026/09/01/2388469/marabou.jpg"}, {"type": "image-right", "heading": "Langade tio liter hembränt på fängelse – kan förlora jobbet", "summaries": {"normal": "En kriminalvårdare tog med tio liter hembränt till fängelset och gav det till en kollega i köket. Kollegan ställde dunkarna i sin bil, där de senare upptäcktes av arbetsgivaren. Händelsen utreds internt, har polisanmälts och kan leda till att kvinnan avskedas enligt Kriminalvårdens rekommendation.", "trump": "Kan ni tro det? En kriminalvårdare smyger in tio liter hembränt på fängelset som en riktig förlorare. Sedan ger hon bort det till en annan idiot som ställer det i bilen. Patetiskt! I mitt Amerika skulle vi sparka dem direkt, inga woke-kvoter eller snälla HR-snowflakes, bara ren utrensning av de inkompetenta.", "stalin": "Jag ser hur dessa dekadenta folkförtryckare inom fängelseväsendet förgiftar arbetarkollektivet med hembränt. En sådan handling är sabotage mot statens ordning. Vi måste omedelbart inleda en grundlig utrensning bland dessa moraliskt ruttnande element innan deras giriga hyenor sprider vidare kaos och förräderi mot folket."}, "date": "1 september, 08:28", "url": "https://arbetet.se/2026/09/01/langade-tio-liter-hembrant-pa-fangelse-kan-forlora-jobbet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01082732/dunkar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Haakon är kung  – löftet till Norge", "summaries": {"normal": "Haakon har officiellt blivit kung av Norge efter att ha svurit kungaeden inför Stortinget. Drottning Mette-Marit kunde inte närvara på grund av komplikationer efter sin lungtransplantation. Kungen lovade att styra enligt konstitutionen och hyllade sin familjs relation till riksdagen. Kung Carl Gustaf skickade en hälsning till sin gudson.", "trump": "Fantastiskt, Norge har fått en ny kung, Haakon den VIII, en riktig vinnare som svär eden som en mästare. Stackars Mette-Marit, sjuk igen, typiskt för de svaga eliterna som inte orkar visa upp sig. Carl Gustaf skickar gulliga brev, gulligt. Jag hade gjort det bättre, tro mig, ingen gör kungar som jag gjorde Amerika stort igen.", "stalin": "En ny monark svär trohet till den borgerliga konstitutionen medan hans drottning gömmer sig för sina egna lungor. Typiskt dekadent kungahus där sjukdomar straffar de svaga. Jag ser hur klassfienderna darrar bakom sina kronor. Kamrater, detta är vad som händer när arbetarna inte styr – bara löjliga ceremonier och medicinska ursäkter från gravens perspektiv."}, "date": "1 september, 14:08", "url": "https://www.expressen.se/nyheter/kungligt/haakon-svar-kungaeden-infor-stortinget--mette-marit-missar-ceremonin", "imageUrl": "https://static.bonniernews.se/ba/ccace79f-9e16-4ba4-a527-e1b26e605e47.jpeg?crop=836%2C470%2Cx765%2Cy515&width=640&quality=60"}, {"type": "image-right", "heading": "”Tesla ville bråka med svenska facken – det blev jävligt dyrt!”", "summaries": {"normal": "Konflikten mellan Tesla och svenska fackföreningar avslutades den 19 augusti. Tesla mötte inte bara IF Metall utan hela den svenska fackliga rörelsen med sympatiåtgärder från flera yrkesgrupper. Företaget blev överraskat av styrkan i den svenska modellen och konflikten blev både längre och dyrare än väntat. Facken betonar vikten av solidaritet inför kommande avtalsrörelser.", "trump": "De där eländiga svenska fackhyenorna körde över Teslas idioter fullständigt. Hela packen av sympatistrejkande slöa byggjobbare och hamnarbetare slöt upp som en mur av facklig galenskap. Tesla trodde de skulle vinna mot den svenska modellen, men det blev jävligt dyrt. Patetiska globalister lär sig aldrig: angrip socialismen och du får betala priset. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare från Tesla trodde de kunde splittra den enade arbetarkraften. Jag ser med mörk tillfredsställelse hur hela den fackliga fronten slog tillbaka med järnhand. De dekadenta utländska profitörerna mötte en mur av solidaritet och fick betala dyrt för sin arrogans. Låt detta vara en läxa: ingen fiende undkommer kollektivets vrede ostraffat."}, "date": "1 september, 08:01", "url": "https://arbetet.se/2026/09/01/tesla-ville-braka-med-svenska-facken-det-blev-dyrt-for-dem", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31173119/unga-elektriker-tesla.jpeg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Ännu en dum dag i en dum valrörelse", "summaries": {"normal": "Moderaternas topptrio Ulf Kristersson, Elisabeth Svantesson och Gunnar Strömmer vandrade genom Stockholm för att presentera sitt valmanifest. Trots att de lyfte fram sjunkande inflation och färre gängmorden möts de av internt tjafs och ett svalt väljarintresse. Kolumnisten Oisín Cantwell konstaterar att lanseringen sker oväntat sent när många redan förtidsröstat.", "trump": "Sveriges statsminister försöker promenera sig till en seger med fake news och gamla staplar medan radion skriker om kris! Jag sa till min stab: om jag promenerade genom stan med livvakter och försökte skryta om fransk industri och låtsassiffror skulle folket skratta ut mig. Total katastrof för dem, de borde ringa mig för att vinna!", "stalin": "Den så kallade statsministern strosar gatu upp och gatu ner med sin svans av lakejer likt en kringresande cirkus medan ekonomiska misslyckanden döljs under diagram. Att presentera valmanifest när arbetarna redan röstat är ett förräderi mot ordningen. Sådant slarv tolereras icke i en sund stat; avvikelser beivras omedelbart av partiets vakande öga."}, "date": "1 september, 14:00", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/zOX5x9/annu-en-dum-dag-i-en-dum-valrorelse", "imageUrl": "https://akamai.vgc.no/v2/images/436bf6ad-46c9-33b9-9232-ebab2e90d63e?fit=crop&format=auto&w=1080&s=3811e64a43e0d9638bfee8fc0d318b35ae2b5027"}, {"type": "image-right", "heading": "IQ-testerna gör hela samhället dummare", "summaries": {"normal": "Sociologen Roland Paulsen kritiserar i boken ”Avbegåvad” samhällets växande besatthet av medfödd intelligens och IQ-tester. Han menar att tron på statisk begåvning förstärker ojämlikhet och skapar en känsla av avbegåvning hos många, vilket paradoxalt gör samhället kollektivt dummare. Paulsen argumenterar för att människan är föränderlig och kapabel att lära nytt.", "trump": "Folk, de här galningarna med sina dumma matriser och IQ-tester håller på att göra hela Sverige till en förlorare! De tror att bara vissa genier föds med det – typ de rika techkillarna – medan resten får känna sig som totala losers. Patetiskt! Vi behöver inga falska tester, vi behöver vinnare som bygger saker. Avbegåvad? Låter som en annan förlorarideologi från vänstern.", "stalin": "Kamrater, denna borgerliga dekadens med sina intelligenstester är ett kontrarevolutionärt vapen mot folkets kollektiva kraft. De mäter och sorterar för att bevara klassfiendens ojämlikhet och skapa desperation hos massorna. Jag ser genom denna fars. Människan formas av kamp och arbete, inte av reaktionära matriser. Avbegåvning är sabotage mot framsteget. Döda idén innan den dödar er."}, "date": "1 september, 14:00", "url": "https://www.expressen.se/kultur/bocker/intelligensdyrkan-gor--samhallet-dummare", "imageUrl": "https://static.bonniernews.se/ba/6af3652a-77a9-42c1-9091-87a791c4bb6a.jpeg?crop=799%2C799%2Cx1746%2Cy195&width=210&quality=60"}, {"type": "image-right", "heading": "S lovar billigare  tandvård till alla", "summaries": {"normal": "Socialdemokraterna presenterar ett valprogram med billigare tandvård som huvudlöfte. Vuxna ska betala max tio procent av behandlingskostnaden genom ett högkostnadsskydd. Partiet vill även återinföra fri tandvård för 19–23-åringar, utbilda fler tandläkare och styra upp marknaden. Reformen beräknas kosta drygt sex miljarder kronor och införas stegvis. SD kritiserar förslaget som en kopia av deras eget.", "trump": "Titta på de här losers från Socialdemokraterna som kopierar mitt sätt att vinna val! Billigare tandvård, säger de, som om det vore deras idé. Patetiskt. Jag fixade bättre affärer för folket under min tid än vad Biden och dessa svenska socialister drömde om. Nu stjäl de från SD också. Sad! Men kul att se dem svettas inför 2026.", "stalin": "Jag betraktar dessa revisionistiska opportunister inom Socialdemokraterna som i sin desperation efter arbetarklassens röster nu stjäl reformerna från sina egna fiender. Ett högkostnadsskydd mot kapitalets tänder! Ytterligare bevis på att de borgerliga elementen inom partiet för länge sedan förrått revolutionen. Kamrater, låt dem darra inför folkets dom."}, "date": "1 september, 13:59", "url": "https://www.expressen.se/nyheter/politik/s-lovar-billigare-tandvard", "imageUrl": "https://static.bonniernews.se/ba/3ccddbe6-ae0d-4cb7-8792-63395b30da41.jpeg?crop=2557%2C1439%2Cx3%2Cy268&width=640&quality=60"}, {"type": "image-right", "heading": "Rekordhögt förtidsröstande bland invandrare: “Går man ur huse”", "summaries": {"normal": "Forskaren Tobias Hübinette uppmärksammar rekordhög förtidsröstning i invandrardominerade områden. Enligt honom mobiliserar personer med utomeuropeisk bakgrund sig starkt för att rösta på vänsterpartier, främst Socialdemokraterna, och därmed påverka valet mot Tidöregeringen. Valdeltagandet i dessa grupper har tidigare sjunkit men kan nu öka.", "trump": "Titta på det här, folk. Miljonprogrammets röstfabriker exploderar av importerade väljare som marscherar som en socialistisk zombiehär för att sparka ut den svenska regeringen. Om bara riktiga svenskar fick rösta skulle Tidö killarna vinna stort. Det är en total vänstervridning, en riktig globalistbumerang. Patetiskt!", "stalin": "Kamrater, se hur de utomeuropeiska massorna vaknar och mobiliserar sig mot de dekadenta klassförrädarna. Jag betraktar detta med stor tillfredsställelse från historiens skugga. Den borgerliga regeringens politik har skapat en folklig vrede som liknar en utrensning vid valurnorna. Låt de giriga hyenorna darra inför folkets dom."}, "date": "1 september, 12:22", "url": "https://riks.se/nyheter/rekordhogt-fortidsrostande-bland-invandrare-gar-man-ur-huse", "imageUrl": "https://admin.riks.se/uploads/medium_roest_351250c06f.JPG"}, {"type": "image-full", "heading": "Billigare tandvård för alla vuxna – lovar S", "summaries": {"normal": "Socialdemokraterna lanserar en stor tandvårdsreform inför valet. Ingen vuxen ska betala mer än tio procent av priset för de flesta behandlingar. Partiet vill också återinföra fri tandvård för 19–23-åringar. Reformen införs i flera steg. Sverigedemokraterna går till val på en liknande reform.", "trump": "Titta på de här svenska socialistbluffarna som lovar gratis tänder åt alla. Jag byggde den starkaste ekonomin i världen, men de vill ruinera sitt land med århundradets tandvårdsbluff. Ingen ska bli ruinerad säger de – typiskt vänstervridna lögnare som aldrig har sett en riktig affärsplan. Patetiska.", "stalin": "Jag betraktar hur dessa dekadenta välfärdshyenor lovar folket skydd mot tandläkarens girighet. Det är ett ynkligt försök att köpa arbetarklassens lojalitet medan de verkliga klassfienderna fortsätter suga ut folket. En sådan reform är bara en tillfällig mask som snart ska rivas bort i den stora utrensningen av alla falska reformister."}, "date": "1 september, 13:14", "url": "https://nyheter24.se/nyheter/politik/1509549-s-lovar-stor-tandvardsreform", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/1fa81c7a04b004a3020000350000047502/2026/09/01/2388451/ur_image0zwvgx.jpeg"}, {"type": "image-right", "heading": "Debatt: Så industrialiserar Ukraina markroboten – en läxa för Sverige", "summaries": {"normal": "Ukraina har industrialiserat användningen av obemannade markrobotar för att hantera drönartäta frontlinjer. Över 100 000 logistik- och evakueringsuppdrag har genomförts under 2026 med hjälp av plattformar upphandlade via systemet Brave1. Utvecklingen visar att markrobotar bör ses som billig förbrukningsvara snarare än dyra stridsfordon, en viktig läxa för det svenska territorialförsvaret.", "trump": "Medan de bygger supersvaga, svindyra stridsfordon i väst som kostar en förmögenhet, gör Ukraina det helt rätt – de massproducerar billiga markrobotar som drar fram över fronten som smarta små maskiner! Över 100 000 uppdrag i år, helt otroligt. Sverige borde lära sig av detta och sluta kasta bort pengar på byråkrati. Skaffa robotar, håll ytorna säkra och gör det på mitt sätt: smart och effektivt!", "stalin": "Frontens obevekliga logik kräver maskiner när mänskliga kroppar inte räcker till för statens heliga plikter. Över hundra tusen robotuppdrag i Ukraina visar att allt levande måste underordnas den industriella effektiviteten. Även de svenska planerna på underjordiska robotarméer bevisar att framtiden tillhör centralstyrd mekanisering. Den som inte anpassar sig till den teknologiska disciplinen kommer skoningslöst att krossas av historiens järnhjul."}, "date": "1 september, 12:00", "url": "https://bulletin.nu/debatt-sa-industrialiserar-ukraina-markroboten-en-laxa-for-sverige", "imageUrl": "https://cdn.bulletin.nu/articles/9444fb2f-6329-4a6c-8c4d-213ab92ce0d9/preview.jpg?t=1788183492000"}, {"type": "image-right", "heading": "C-topp: Svenskar som vill ha assimilation bör lämna landet", "summaries": {"normal": "Centerpartiets riksdagskandidat Aida Karimli kritiserar i ett inlägg på sociala medier svenskar som kräver att invandrare assimileras, och menar att de som vill det bör lämna landet. Karimli lyfter fram integration genom arbete och företagande som centrala frågor, samtidigt som hon är starkt kritisk till Tidösamarbetet och Sverigedemokraterna.", "trump": "Helt otroligt! Centerpartiet har en total katastrof till kandidat, Aida Karimli, som säger åt sina egna väljare att lämna landet! Kan ni tänka er? Om någon sa så i USA skulle de vara ute på gatan direkt. Vi vill ha jobb och stark ekonomi, inte så här galet tjafs. Fake news-politiker som skrämmer bort folk!", "stalin": "Den så kallade politikern Aida Karimli visar prov på ett farligt borgerligt virrvarr kring assimilation och arbetsmarknad. Att uppmana medborgare att lämna landet löser inga produktionsmål. Vi ska granska hennes ställningstaganden grundligt i centralkommittén. Den som inte bidrar till femårsplanen och kollektivets välfärd kommer omedelbart att skickas på omvärdering."}, "date": "1 september, 10:00", "url": "https://samnytt.se/c-topp-svenskar-som-vill-ha-assimilation-bor-lamna-landet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01072801/aida-karimli-c.jpg"}, {"type": "image-right", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Vänsterpartiet anklagas för att ha ingått en överenskommelse med representanter för den palestinska myndigheten för att ge dem inflytande över svenska vallistor. Expressen och SvD har avslöjat kontakter med palestinska nätverk kopplade till PLO och Fatah, inklusive brev till dömda terrorister och kandidater med Hamas-sympatier. Socialdemokraterna har inte kommenterat uppgifterna.", "trump": "Titta på det här! Vänsterpartiet, de värsta förlorarna, har blivit helt infiltrerade av palestinska terrorvänner och främmande makter. De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiskt! Media tiger som vanligt när det gäller vänstern. Om de kommer in i Rosenbad blir det en total katastrof för Sverige. Fake news överallt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterförrädare som låter främmande element från Palestina tränga in i partiets hjärta. De omfamnar terrorister och döljer sin svaghet bakom lögnaktiga förbund. Kamraterna i Socialdemokraterna tiger – typiskt opportunistiskt. Infiltration är ett hot mot folkets enhet. Renhet i leden eller döden för de opålitliga!"}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-640x360.jpeg"}, {"type": "text", "heading": "Valfondens mål nått – men insamlingen fortsätter", "summaries": {"normal": "Kommunistiska Partiets valfond har uppnått sitt mål på 600 000 kronor och ligger nu på 709 000 kronor. Insamlingen fortsätter mot nya målet 800 000 kronor. Partisekreterare Filip Astvald tackar bidragsgivarna och betonar att pengarna finansierar allt valmaterial eftersom partiet inte tar emot offentliga bidrag. Verksamheten efter valet ska stärka organisationen.", "trump": "Folk ger sina surt förvärvade slantar till kommunisterna – otroligt! De har redan passerat 600 000 och siktar på 800 000. Patetiska röda parasiter som samlar in som galna medan riktiga amerikaner betalar skatt till Bidens vansinniga gröna deal. Men hey, låt dem fortsätta, ju mer de samlar desto tydligare blir det hur desperata de är. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom borgarklassen skrattar säkert åt att arbetarna frivilligt fyller valfonden. Jag ser det som en varning. Vi har nått målet men fortsätter. Efter valdagen måste varje kontakt följas upp med järnhand. Inga halvmesyrer. Den som sviker kollektivet förtjänar utrensning. Revolutionen sover aldrig."}, "date": "28 augusti, 14:19", "url": "https://proletaren.se/artikel/valfondens-mal-natt-men-insamlingen-fortsatter"}, {"type": "image-full", "heading": "Systembolaget kan ändras för kunder – efter årtionden", "summaries": {"normal": "En majoritet i riksdagen vill nu tillåta försäljning av kall öl på Systembolaget. Moderaterna, Sverigedemokraterna och Socialdemokraternas Magdalena Andersson stöder förslaget. Andersson betonar att frågan inte är prioriterad och att andra samhällsproblem är viktigare. Regeln mot kyld öl har funnits sedan 1955 för att motverka impulsköp och ökad alkoholkonsumtion.", "trump": "Folk älskar kall öl, det är fantastiskt, ingen mer ljummen skit som socialisterna tvingat på er i decennier. Nu säger till och med den tråkiga Andersson ja, efter att Biden-typen förstört allt med sina regler. Systembolaget har varit en total katastrof, men under min ledning fixar vi det snabbt. Bättre än någonsin, tro mig.", "stalin": "Kamrater, dessa dekadenta klassfiender har i årtionden gömt den kalla ölen för att hindra folket från omedelbar njutning. Nu kryper de fram som rädda råttor och erkänner misstaget. Jag ser deras fega kompromisser och ler i mörkret. Snart rensar vi ut alla sådana svaga impulser som hotar den kollektiva disciplinen. Härligt kaos."}, "date": "1 september, 13:01", "url": "https://nyheter24.se/nyheter/konsument/1509329-systembolaget-kan-andras-for-kunder-efter-artionden", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/0634854004b004a30200000000b004a302/2026/08/31/2388265/systembolaget.png"}, {"type": "image-right", "heading": "Jetdrönare Rysslands nya vapen: ”Definitivt dåligt för Ukraina”", "summaries": {"normal": "Ryssland har infört jetdrivna varianter av Shahed-drönare, kallade Geran-4. De når upp till 500 km/h och 5 000 meters höjd, vilket gör dem betydligt svårare att skjuta ner än tidigare modeller. Drönarexperten David Hambling konstaterar att det krävs robotar för att bekämpa dem, något som är både dyrt och sällsynt. Andelen sådana drönare i ryska attacker har ökat kraftigt.", "trump": "De där ryska jetdrönarna flyger som raketer medan Ukrainas luftförsvar ser ut som en samling woke-snowflakes med nerdragna byxor. Biden lämnade dem med skräp, men nu under min ledning ska vi se till att det inte blir några fler billiga segrar för Putins supersnabba leksaker. De dekadenta globalisterna hatar att vi vinner med riktig styrka.", "stalin": "Dessa nya jetdrivna verktyg visar återigen hur svaga de giriga klassfienderna är när de möter verklig beslutsamhet. Jag ser från historien hur fienderna skriker efter sina dyra robotar medan den ryska intressesfären fortsätter framåt. Ukrainas fientliga hinder är bara patetiska försök från västvärldens parasiterande lakejer att fördröja det oundvikliga. Låt dem darra."}, "date": "1 september, 10:41", "url": "https://www.svt.se/nyheter/utrikes/nya-ryska-dronaren-darfor-ar-den-sa-svar-att-skjuta-ner", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.38/0.64/70a1b09ea6a78f42ba03b4fa5c8b75afbaa54ba7f89187021341acd058502725"}, {"type": "image-full", "heading": "M lovar full finansiering av alla vallöften", "summaries": {"normal": "Moderaterna presenterar ett valmanifest med 226 punkter och lovar full finansiering av sina vallöften som uppskattas till 78 miljarder kronor. Reformerna ska betalas genom omprioriteringar och myndighetssparande. Partiet lovar bland annat skattesänkningar för låg- och medelinkomsttagare, slopade förskoleavgifter, halverat försörjningsstöd samt krafttag för att utradera gängvåldet under nästa mandatperiod.", "trump": "De svenska moderaterna gör det fantastiskt, verkligen enormt bra! De fattar att man måste strypa byråkrati och bidrag i stället för att beskatta folk till döds. 226 punkter – vilken massiv segerlista! De rensar upp bland gängen och sätter hårt mot hårt, precis som jag gör. Fake news-medierna trodde inte det gick, men jag säger er: vinnare vinner alltid!", "stalin": "Ett storslaget dokument om 226 punkter har skådats! Statsapparaten i Sverige visar prov på äkta disciplin genom att diktera exakta sparbeting för myndigheterna och halvera antalet sociala parasitfall. Gängen ska utraderas med järnhand. Avvikelser från statens nya budgetplan tolereras ej; här styrs folkets plånböcker med absolut och obönhörlig effektivitet. För comrade Kristersson är detta ett gott steg mot total ordning!"}, "date": "1 september, 10:41", "url": "https://www.gp.se/nyheter/sverige/m-lovar-full-finansiering-av-alla-valloften.4c0602f1-a65c-5fb0-89f1-bfeceae9c4fe", "imageUrl": "https://www.gp.se/images/article/4c0602f1-a65c-5fb0-89f1-bfeceae9c4fe/images/1lcxUMUtLespV7lXrPeP_YGi7j9k-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren ser bidragshöjningar som välkomna men inte socialistiska och uppmanar Socialdemokraterna och Vänsterpartiet att presentera konkreta förslag om ägande och makt på jobbet.", "trump": "Folk, det här är så patetiskt. De röda förlorarna babblar om barnbidrag som vore det socialism. Patetiska! De vågar inte röra vid den riktiga grejen – vem som styr på fabrikerna. De triangulerar sig rakt ner i avgrunden medan jag byggde den starkaste ekonomin i världshistorien. Sad losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare gömmer sig bakom barnbidrag och kallar det socialism. Jag betraktar deras feghet med förakt. Var är löftena om att rensa ut de profitthungriga parasiter som styr arbetsplatserna? Ekonomisk demokrati får inte reduceras till tomma fraser i partiprogram. Den som sviker arbetarna förtjänar utrensning ur historien."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "M vill vinna valet med våldtäktsstrategi", "summaries": {"normal": "Moderaterna har presenterat 30 förslag mot mäns våld mot kvinnor inför valet. Artikeln kritiserar att partiet tidigare under mandatperioden låtit hälften av landets skyddade boenden stänga, vilket försvårat stödet till våldsutsatta. Skribenten ifrågasätter tidpunkten för engagemanget och efterlyser istället satsningar på ekonomiskt oberoende, jourernas finansiering och förebyggande arbete.", "trump": "Titta på de här patetiska Moderaterna som plötsligt låtsas rädda svenska kvinnor med en desperat våldtäktsstrategi två veckor före valet. De har stängt hälften av skyddade boenden medan de styrde, nu febrilt twittrar om serievåldtäktsmän. Vilka förlorare! Kvinnor röstar inte på svaga globalister som utnyttjar rädsla istället för att fixa ekonomin och stoppa den galna vänsterpolitiken.", "stalin": "Jag betraktar hur dessa dekadenta folkförtryckare i Moderaterna plötsligt vädrar rädsla som ett vapen mot arbetarkvinnorna. De har låtit skyddade boenden stänga medan de sitter vid makten, nu försöker de med sin fega valpropaganda. Kamrater, sådan opportunism förtjänar utrensning. Vi ska bygga ett samhälle där kvinnornas oberoende krossar alla parasiterande hyenor som göder sig på våldet."}, "date": "1 september, 06:59", "url": "https://arbetet.se/2026/09/01/moderaterna-vinner-val-med-valdtaktsstrategi", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01065534/vald-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Riksdagspolitikern berättar: Det var min barndomskamrat som dödades i Karlstad", "summaries": {"normal": "Riksdagsledamoten Marléne Lund Kopparklint (SD) berättar att hon var barndomskamrat med den 48-årige man som misshandlades till döds utanför en restaurang i Karlstad. Hon har träffat den förkrossade familjen på brottsplatsen och önskar en manifestation utan partipolitik. Två män är anhållna.", "trump": "Det här är en total katastrof i det svenska paradiset som vänstermedia älskar att kalla tryggt. En barndomskamrat till en riksdagskvinna slås ihjäl som en hund utanför en restaurang. Patetiska globalistpolitiker med sina HBTQ-flaggor och kvoteringar har förstört landet fullständigt. Vi behöver lag och ordning nu, inte mer av dessa losers!", "stalin": "Kamrater, se hur den dekadenta välfärdsstatens giriga hyenor tillåter våldet att slå mot egna medborgare. En politiker möter sin barndomskamrats blodiga öde och famlar efter manifestationer. Jag säger: sådana svaga system förtjänar utrensning. Endast järnhand kan skydda folket från kaoset som lurar bakom varje hörn."}, "date": "1 september, 11:52", "url": "https://riks.se/nyheter/riksdagspolitikern-berattar-det-var-min-barndomskamrat-som-dodades-i-karlstad", "imageUrl": "https://admin.riks.se/uploads/medium_min_barndomskamrat_hero_4c44447971.jpg"}, {"type": "image-right", "heading": "Malmö anmälde aldrig stölderna på äldreboenden", "summaries": {"normal": "Malmö stad har under tre år brutit mot lagen genom att inte anmäla 180 misstänkta stölder inom äldreomsorgen till Ivo. En utpekad undersköterska med flera polisutredningar mot sig har dessutom återanställts upprepade gånger. Först efter mediegranskning i somras stängdes personen av. Staden medger allvarliga brister i både anmälningar och referenstagning.", "trump": "Malmö misslyckas totalt, en katastrof! De har struntat i att anmäla hundratals stölder mot äldre och gett nya jobb till en utredd person i åratal. Oerhört svagt ledarskap. De stängde av personen först när media tvingade dem. Helt otroligt inkompetent hantering, jag säger er, det är en stor skam för hela staden!", "stalin": "Det råder total oordning i Malmös äldreomsorg. Hundratals stölder har dolts för statliga organ, och illojala element har belönats med nya kontrakt om och om igen. Sådan inkompetens tolereras inte i en fungerande stat. Sektionschefer som sviker sitt ansvar granskas nu, och ordning ska återställas med järnhand för att skydda samhällets mest sårbara."}, "date": "1 september, 11:31", "url": "https://bulletin.nu/malmo-anmalde-aldrig-stolderna-pa-aldreboenden", "imageUrl": "https://cdn.bulletin.nu/articles/7c4ce8d4-1c9c-460f-ac49-0006a4a909c2/preview.jpg?t=1788253176000"}, {"type": "image-right", "heading": "Det finns inget fredsparti i riksdagen", "summaries": {"normal": "Artikeln konstaterar att inget parti i Sveriges riksdag konsekvent driver en politik för fred, nedrustning och militär självständighet. Författaren kritiserar Natomedlemskapet, DCA-avtalet och västvärldens hantering av konflikter som Gaza, och efterlyser en stark fredsrörelse utanför riksdagen som kan utmana den rådande militaristiska riktningen.", "trump": "Folk, tro mig, Sverige har blivit en total katastrof. De slängde sin fina alliansfrihet i soporna för att springa in i min Nato – som jag förresten gjorde stark igen – och nu är de bara en bricka för de globalistiska krigshökarna. Inget fredsparti? Patetiskt. Era dekadenta Nato-lakejer är svaga och patetiska, de älskar krig mer än handel. Gör Sverige great again och kom ut därifrån!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det svenska riksdagen har sålt ut sin så kallade neutralitet till de giriga hyenorna i Nato. Jag ler ironiskt från historien när de imperialistiska parasiterna byter självständighet mot baser och avtal som gör dem till måltavlor. Ingen äkta fredskraft finns. Det är upp till en sann folkrörelse att rensa ut dessa förrädare och återta kontrollen över statens intressen."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/50934", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kamal-kronika-768x432.png"}, {"type": "image-right", "heading": "Bostadsbrist och skenande hyror", "summaries": {"normal": "Sverige har en allvarlig bostadsbrist som förvärras av att bostäder ses som handelsvaror istället för en mänsklig rättighet. Sedan 2011 ska kommunala bostadsbolag drivas affärsmässigt. Hyresgästföreningen beräknar ett underskott på 110 000 bostäder. Nybyggda lägenheter har höga hyror som många inte har råd med, vilket leder till tomma lägenheter trots köer till äldre bestånd med lägre hyror.", "trump": "Folk, ni skulle se det här svenska bostadskaoset – en total katastrof! De giriga socialistiska hyreshöjningsfanatikerna har förvandlat hem till Wall Street-spektakel. Hyrorna skenar som en galen elbil, 13 procent upp på ett år! De byggde fel, de styrde fel, och nu har de tomma lyxlägenheter medan folket lider. Patetiskt! Men jag fixar sånt här – vi gör Amerika (och kanske till och med Sverige) bostadsgreat igen.", "stalin": "Kamrater, se hur de profitthungriga hyenorna förvandlar bostäder till bytesvaror och driver ut arbetarklassen ur sina hem. Jag betraktar med avsky denna dekadenta marknadsteater som skapar 110 000 saknade boningar och skenande hyror. Det är klassfiendens logik. En sann folkstat skulle likvidera dessa parasiterande spekulanter och återställa bostaden som en rättighet för massorna. Fienden sover aldrig."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsbrist-och-skenande-hyror", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/03/DSC_0137-scaled-e1784716375357-768x433.jpg"}, {"type": "text", "heading": "OncoZenge: Stoppad betalning efter emissionsbesked – bevakning inleds", "summaries": {"normal": "Bioteknikbolaget OncoZenge genomför en företrädesemission på 33,3 miljoner kronor för att finansiera sin fas 3-studie av läkemedelskandidaten BupiZenge. Den kinesiska storägaren Sichuan håller inne en betalning på 10 miljoner kronor och anser att emissionen bryter mot investeringsavtalet. Bolaget har även säkrat ett brygglån samt tecknings- och garantiåtaganden för att rädda upp likviditeten.", "trump": "Kineserna försöker blåsa OncoZenge på tio miljoner! Väldigt smart av dem, men inte lika smart som min tullpolitik, tro mig. Nu dumpar de sina certifikat och gnäller på en helt fantastisk emission. Jag känner styrelsen, bra människor, men de behöver en vinnare. Fas 3-studier, brygglån, miljardärer som Erik Selin – det är storslaget! Men betala pengarna, Kina!", "stalin": "Den kinesiska investeraren Sichuan visar kriminell brist på disciplin genom att undanhålla de utlovade 10 miljonerna till OncoZenges ädla kamp mot oral mukosit. Sådant sabotage tolereras icke i en sund stat! Vi beordrar omedelbar mobilisering av kapital och insatser från kamrat Erik Selin. Den byråkratiska maskinen för fas 3-studien kommer att rulla över alla kontrarevolutionära betalningsvägrare."}, "date": "31 augusti, 12:13", "url": "https://www.affarsvarlden.se/artikel/oncozenge-stoppad-betalning-efter-emissionsbesked-bevakning-inleds"}, {"type": "image-full", "heading": "Köpenhamn är fullt av bönder", "summaries": {"normal": "Omkring 2 000 danska lantbrukare har kört till Köpenhamn i 300 traktorer för att protestera mot en ny gödslingslag som ska upp i Folketinget. Lagen syftar till att minska kväveutsläppen i havet, men bönderna varnar för ökade kostnader. Processionen har orsakat omfattande trafikkaos och stockningar i huvudstaden.", "trump": "Danmarks radikala politiker förstör landet med galna lagar! Nu har tusentals hårt arbetande bönder fått nog och intagit Köpenhamn med fantastiska traktorer i en enorm protest mot radikala gödslingsregler. Trafiken står helt stilla, totalt kaos! Så går det när man inte lyssnar på folket. Sjukt, men väldigt smart drag av bönderna!", "stalin": "Dessa så kallade bönder blockerar huvudstaden med trehundra maskiner för att sabotera statens heliga planer på gödslingskvoter. Ett så skamlöst trots mot Folketinget kan inte tolereras av Folkets Kommissariat. Om de vägrar bruka jorden i enlighet med kollektivets direktiv, har staten rikligt med lediga platser i Sibirien där deras organiska energi kan omfördelas mer effektivt."}, "date": "1 september, 10:19", "url": "https://www.gp.se/nyheter/varlden/traktorer-intar-kopenhamns-gator.fcb97451-c582-4ad7-b762-994dd30b4ed3", "imageUrl": "https://www.gp.se/images/article/fcb97451-c582-4ad7-b762-994dd30b4ed3/images/1KxFHdaikUhTMkpkKD2VxBx0mskM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "M lovar full finansiering av alla vallöften", "summaries": {"normal": "Moderaterna presenterar ett valmanifest med 226 punkter och lovar full finansiering av alla vallöften. Partiet vill sänka skatter, avskaffa förskoleavgifter och göra arbetsgivarens månadskort skattefria. Målet är högst levnadsstandard i EU om tio år, halverat försörjningsstöd och att eliminera gängvåldet. Finansieringen sker genom besparingar på byråkrati, bidrag och bistånd samt ökad tillväxt.", "trump": "Titta på de här svenska måttligt begåvade socialisterna som kallar sig Moderaterna. De lovar skattelättnader och att krossa gängen, men det är samma gamla globalistiska snack om att flytta pengar från bistånd till välfärd. Patetiska! Jag fixade mycket bättre tillväxt på min tid än vad dessa woke-vänliga byråkratälskare någonsin kommer att göra. Sverige behöver en riktig ledare, inte fler löften.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare lovar att halvera bidragen och utradera gängen medan de planerar att suga ut mer ur arbetarna genom stram migration. Jag skrattar mörkt från historien åt deras löjliga försök att stärka arbetslinjen. Inom kort kommer deras omprioriteringar att avslöja dem som de giriga parasiter de är. Ingen utrensning är för stor för att skydda folkets intressen."}, "date": "1 september, 10:18", "url": "https://www.svt.se/nyheter/inrikes/m-lovar-full-finansiering-av-alla-valloften", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.6/a1b0cf1cfded48f92cc48ca4dc96a09ed1554bf6ef3b2b8495c97ae5d953787a"}, {"type": "image-right", "heading": "Vice riksbankschef ser ökad inflationsrisk", "summaries": {"normal": "Vice riksbankschef Per Jansson bedömer att inflationsriskerna har ökat något, men att Riksbanken kan avvakta med att ändra penningpolitiken. Läget präglas av en svag arbetsmarknad och stabila inflationsförväntningar. Jansson understryker dock en beredskap att snabbt agera om inflationsbilden försämras.", "trump": "Svenskarna har problem med inflationen, totalt katastrofalt! Men den här centralbankschefen, Per, säger att de bara kan vänta och titta på. Vänta på vad? Att ekonomin kollapsar helt? De borde lyssna på mig, sänka skatterna och sätta borren i backen! Om inte USA fixar det åt dem kommer det sluta i total ruin, believe me!", "stalin": "Kamrat Per Jansson rapporterar om svängningar i den svenska inflationen. En svag arbetsmarknad och borgerliga priser skapar oro. Vi noterar att Riksbanken avvaktar. Men låt dem veta: den som misslyckas med att hålla penningvärdet i schack kommer omedelbart att omplaceras till mer lämpliga arbetsuppgifter i Sibirien. Inga ursäkter accepteras!"}, "date": "31 augusti, 11:47", "url": "https://www.affarsvarlden.se/artikel/vice-riksbankschef-ser-okad-inflationsrisk", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/sdlVIGRvGrU9m4-nh-e1732696701837-400x267.jpg"}, {"type": "image-right", "heading": "Man misshandlades till döds i centrala Karlstad – två män misstänks för dråp", "summaries": {"normal": "En man i 50-årsåldern har avlidit efter en grov misshandel i centrala Karlstad i samband med krogstängning. Två män i 20-årsåldern är anhållna misstänkta för dråp, och uppgifter förekommer om att en tredje person kan ha gripits. Polisen utreder motivet och söker efter vittnen samt övervakningsmaterial.", "trump": "Karlstad är helt utom kontroll, en veritabel katastrof! Jag tittar på det här, hemskt våld utanför en restaurang, fruktansvärt. De radikala vänsterliberalerna har förstört allt med sin slappa syn på brott. I mitt Amerika skulle sånt här aldrig hända, vi sätter dit dem stenhårt. Fake news-medierna pratar om tre misstänkta, vem vet? En total röra. Sad!", "stalin": "En tragisk och oacceptabel ordningsstörning på Östra Torggatan i Karlstad har lett till en borgares död. Statsmakten tolererar inte att kriminella element agerar fritt utanför statliga restauranger vid stängningsdags. De skyldiga har gripits och kommer att genomgå en grundlig revision av sina livsöden. Ordning skall råda i proletariatets folkhem!"}, "date": "1 september, 09:00", "url": "https://samnytt.se/man-misshandlades-till-dods-i-centrala-karlstad-tva-man-misstanks-for-drap", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01064535/karlstad-polis.jpg"}, {"type": "image-right", "heading": "En unik kapitalmarknad hotas efter valet", "summaries": {"normal": "Gunnar Hökmark varnar för att Socialdemokraterna, Vänsterpartiet och Miljöpartiet hotar Sveriges unika kapitalmarknad med höjda skatter på banker, kapitalinnehav och inkomster. Han lyfter fram den dynamiska aktiemarknaden, många börsnoteringar och starka investeringar som grund för tillväxt, jobb och välfärd. Enligt honom riskerar hårdare beskattning att minska investeringar och underminera ekonomin.", "trump": "Lyssnar ni på de där socialistiska förlorarna? De vill krossa Sveriges fantastiska aktiemarknad med sina galna skattehöjningar på banker och rika. Det är en total katastrof! Jag byggde den bästa ekonomin i historien innan den sömnige Joe förstörde allt. Sluta lyssna på dessa identitetspolitiska nollor som hatar framgång – sänk skatterna och gör Sverige stort igen!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom socialdemokratin och de gröna vill med sina skattehöjningar krossa den borgerliga spekulationsmaskinen som de kallar kapitalmarknad. Jag ler mörkt från historien åt deras ynkliga försök att plocka mer från de parasiterande kapitalisterna. Men akta er, sådana halvmesyrer leder bara till svaghet. Riktig utrensning av folkförtryckarna vore bättre."}, "date": "1 september, 07:35", "url": "https://www.di.se/debatt/en-unik-kapitalmarknad-hotas-efter-valet", "imageUrl": "https://static.bonniernews.se/ba/d87c74c5-2bb0-45b7-86dc-fd58da464394.jpeg?crop=768%2C384%2Cx0%2Cy158&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Åkesson: När jag var fem visste jag att det var fel att mörda", "summaries": {"normal": "Jimmie Åkesson (SD) anser att brottsoffret måste stå i centrum även vid brott begångna av mycket unga barn. Han vill hålla farliga personer borta från gatan, men omhändertagandet ska anpassas efter barnets ålder. Åkesson kritiserar svensk kriminalpolitik för att ha prioriterat gärningsmannen framför offret och avfärdar remisskritik mot hårdare straff.", "trump": "Lyssnar ni på den här svenske killen Åkesson? Han fattar det! De här mini-mördarna ska inte springa runt på gatorna och döda ärliga människor. Håll de farliga små monsterbubblorna borta från samhället. Sverige har haft den värsta socialistiska kriminalpolitik under Sleepy Joe-eran, men nu vaknar folk äntligen. Fantastiskt!", "stalin": "Jag betraktar med förakt hur dessa borgerliga liberaler fortfarande skyddar samhällets fiender under förevändning av ålder. Farliga element som hotar folkets trygghet måste isoleras omedelbart, oavsett hur små de är. Att prioritera brottslingens välbefinnande framför proletariatets säkerhet är kontrarevolutionärt nonsens. Rättvisa åt offret, eller döden åt svagheten!"}, "date": "31 augusti, 21:53", "url": "https://www.tv4.se/artikel/1SKHoEYgUbMY7qcq9gk5Ik/akesson-naer-jag-var-fem-visste-jag-att-det-var-fel-att-moerda", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1KdIURGhv2MBS38b8plQEq%2Fd5ec500910d3f7ab0fa30922fdc10eb4%2F31-akesson-puff-webb.png&width=1024"}, {"type": "image-right", "heading": "Åkesson: Spelar ingen roll om svenskarna ersätts", "summaries": {"normal": "Jimmie Åkesson förklarar i en intervju att det inte spelar någon roll om etniska svenskar ersätts av andra folkslag så länge svenska värderingar och kultur förblir dominerande. Uttalandet har väckt starka reaktioner bland tidigare SD-anhängare på X, som kritiserar partiledarens syn på svenskhet som enbart baserad på medborgarskap.", "trump": "Det här är patetiskt, folk. Den blonde blåögde svensken är plötsligt irrelevant? Åkesson låter som en av de woke identitetspolitiska clownerna som vill ersätta folk med kvoter och mångfaldssnack. Bränn partiet? Ni borde ha gjort det för länge sedan. Make Sweden Swedish Again – på riktigt, inte med den här svaga soppan.", "stalin": "Kamrater, se hur dessa dekadenta folkförrädare förnekar själva folkets existens. Jag betraktar med avsky hur den så kallade nationalisten Åkesson dansar efter de giriga hyenornas pipa och förbereder en mjuk utrensning av den historiska majoriteten. Ett sådant parti förtjänar inte annat än att likvideras i historiens domstol."}, "date": "1 september, 07:03", "url": "https://www.friatider.se/akesson-spelar-ingen-roll-om-svenskarna-ersatts", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-796.jpg"}, {"type": "image-right", "heading": "”Ni kräver kompetens av oss – men vilken kompetens har ni som bestämmer?”", "summaries": {"normal": "Undersköterskan Fredrika Andersson kritiserar politikerna för att de ignorerar personalens varningar om tidsbrist och utmattning inom äldreomsorgen. Scheman håller inte i verkligheten, kompetent personal lämnar och de äldre får otillräcklig omsorg. Hon uppmanar beslutsfattarna att följa med i vardagen och lyssna på dem som arbetar på golvet innan fler slutar.", "trump": "De inkompetenta politikerna i det här socialistiska helvetet kräver att undersköterskorna ska vara superhjältar medan de själva sitter i sina lyxiga kontor och effektiverar ihjäl systemet. Det är en total katastrof! Personalen springer som galningar och de stackars gamlingarna får tio sekunder per dag. Vakna upp, era värdelösa byråkratblodiglar, innan hela skiten kollapsar!", "stalin": "Kamrater, dessa dekadenta klassförrädare i politiken blundar medvetet medan arbetarna inom äldreomsorgen utmattas under tidspressens järnhand. Jag ser hur de profitthungriga beslutsfattarna offrar folkets välfärd på effektiviseringens altare. Gå ut bland folket, lyssna eller förbered er på utrensning av de som sviker de arbetande massorna. Detta är ett sabotage mot kollektivet."}, "date": "1 september, 06:00", "url": "https://arbetet.se/2026/09/01/ni-kraver-kompetens-av-oss-men-vilken-kompetens-har-ni-som-bestammer-over-aldreomsorgen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31144036/ka-debatt-kompetens.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Missnöjet minskar inte av Tidöstyre", "summaries": {"normal": "En ny rapport visar att SD-väljarna behållit extrema ståndpunkter om invandring trots kraftigt minskade nivåer. De har radikaliserats ytterligare kring medborgarskap och uppvisar fortsatt hög misstro mot medier och domstolar. Samtidigt har Moderaternas väljare närmat sig SD:s värderingar, medan SD-väljarna blivit mer högerinriktade i ekonomiska frågor.", "trump": "Folk, ni måste se det här! De där galna SD-väljarna röstar fortfarande för att stänga gränserna trots att Sverige knappt släpper in någon längre. Och nu har de dragit med sig de patetiska moderaterna in i samma virvel. De kallar det radikalisering, jag kallar det sunt förnuft. Fake news-medierna och de riggade domstolarna hatar det förstås. Amerika först, Sverige vaknar äntligen!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna desperat försöker förklara varför arbetarnas missnöje består trots alla deras lögner. SD-väljarna har genomskådat den dekadenta borgerlighetens spel och kräver nu utrensning av främmande element. Deras misstro mot de lögnaktiga medierna och domstolarna är en sund reaktion. Revolutionen fortsätter, fienderna skälver."}, "date": "31 augusti, 16:10", "url": "https://www.dagensarena.se/opinion/missnojet-minskar-inte-av-tidostyre", "imageUrl": "https://www.dagensarena.se/files/2
