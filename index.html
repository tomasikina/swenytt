m statens bästa kräver järnhand."}, "date": "9 september, 23:06", "url": "https://www.gp.se/nyheter/sverige/busch-kan-samarbeta-med-c-tanker-inte-tjura.3de322ef-d050-5dc2-848e-78bd71fe3f91", "imageUrl": "https://www.gp.se/images/article/3de322ef-d050-5dc2-848e-78bd71fe3f91/images/1F8cLCHaS0BePN6L8jYy1f8oCC5o-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Nu storsatsar EU på ön som alla vill ha", "summaries": {"normal": "EU storsatsar på Grönland genom ett investeringspaket på 200 miljoner euro för 2026–2027. Satsningen fokuserar på digital infrastruktur, grön energi och hållbar gruvdrift för att säkra tillgång till kritiska mineraler. EU vill öka sitt inflytande i regionen och föreslår en fördubbling av stödet till 530 miljoner euro för perioden 2028–2034, mitt i den geopolitiska dragkampen med USA.", "trump": "EU kastar bort 200 miljoner euro på Grönland, ett totalt slöseri! De försöker leka stora, men vet inte ens hur man bygger en riktig gruva. Jag ville köpa Grönland, det var en genialisk affärsidé, men de fega politikerna sa nej. Nu försöker de köpa sig till inflytande med era pengar. Det är katastrofalt dåligt, tro mig. America First!", "stalin": "EU:s försök att köpa lojalitet på Grönland med 200 miljoner euro är en skrattretande kapitalistisk desperation. De bygger digital infrastruktur för att dölja sin egen förruttnelse. Att tro att man kan köpa en strategisk utpost genom byråkratiska allmosor är en klassisk västerländsk villfarelse. Vi ser genom deras 'hållbara' gruvdrift; det är bara ytterligare en kedja för att fjättra folket vid utländska intressen."}, "date": "7 september, 20:28", "url": "https://www.realtid.se/samhalle/nu-storsatsar-eu-pa-on-som-alla-vill-ha", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/nuuk-gronland.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "De som röstar på C borde inte rösta alls", "summaries": {"normal": "Artikeln kritiserar Centerpartiet för att locka väljare med ett neutralt namn snarare än sin politik. Partiet har skiftat från borgerligt till ett liberalt parti med öppen migrationspolitik, vilket enligt texten prioriteras framför ekonomiska borgerliga värderingar. Författaren menar att det är ett riskfritt men skadligt val för den som vill bevara Sverige.", "trump": "Centerpartiet, vad är det för en röra? De kallar sig mittparti men är bara en massa fega liberaler som älskar att släppa in alla möjliga och omöjliga. De har svikit det riktiga folket, precis som Sleepy Joe gjorde. Rösta inte på dem, det är en total katastrof för Sverige. De borde kalla sig Bondepartiet igen, det vore åtminstone ärligt. Patetiskt!", "stalin": "Kamrater, se hur detta så kallade centerparti förvandlats till en liberal parasit som prioriterar främmande element framför arbetarklassen. Deras falska mittenretorik döljer ett förräderi mot nationen. Jag skrattar mörkt från historien åt dessa opportunister som tror att mångfald räddar staten. Bättre att inte rösta alls än att stödja sådana fiender till folkets enhet."}, "date": "6 september, 08:24", "url": "https://samtiden.nu/2026/09/de-som-rostar-pa-c-borde-inte-rosta-alls/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7301-1260x720.jpeg"}, {"type": "image-right", "heading": "Vänsterpartiets nationalism kan skada Sverige", "summaries": {"normal": "Timbro kritiserar Vänsterpartiets fortsatta nationalistiska och EU-kritiska hållning trots att svenska vänsterväljare blivit allt mer positiva till unionen. Partiet röstar emot frihandelsavtal och försvarssamarbete i Europaparlamentet, vilket enligt rapporten riskerar att hindra Sveriges intressen i en turbulent tid. En röst på Vänsterpartiet ses som en bromskloss för europeiskt samarbete.", "trump": "De där vänsterknäppisar i Sverige har byggt en mur av gammal hederlig nationalism medan de låtsas hata SD. Patetiskt! De kallar EU för ett elitistiskt monster men röstar emot bra handelsavtal som skulle krossa Kina och skydda oss alla. Totala förlorare. Biden skulle älskat deras svaghet, men inte jag. Sverige förtjänar bättre än dessa globalistiska nationalister.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Vänsterpartiet förgiftar den svenska arbetarklassen med sin nationalistiska gift som liknar de värsta reaktionära elementen. De motarbetar europeiskt samarbete och försvarsinitiativ som skulle stärka oss mot globala hot. Deras paranoia mot unionen är en farlig broms för folkets framtid. Rensa ut sådana element innan de fördärvar allt."}, "date": "8 september, 08:00", "url": "https://www.etc.se/debatt/vaensterpartiets-nationalism-kan-skada-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908050956_7bd9bc4c177f365f08fc3bcf84049be732f43db3cc0a08bd47123d6389bf4e45.png"}, {"type": "image-right", "heading": "Nya mätningen: L på 5,8 procent", "summaries": {"normal": "En ny mätning visar att Liberalerna ökar till 5,8 procent och nu har en statistiskt säkerställd marginal över riksdagsspärren. Stödet har mer än tredubblats sedan augusti, främst från SD- och M-väljare. Trots uppgången har Tidöpartierna ett litet underläge mot oppositionen på 48,1 mot 50,7 procent.", "trump": "Titta på de här Liberalerna, de rusar upp till 5,8 procent – det är en total sensation, folk älskar dem plötsligt! SD-väljarna kommer springande som förlorade hundar. Oppositionen tror de leder men det är en riggad soppa av vänstervridna globalister och identitetspolitiska nollor. Jag har sett bättre valrörelser, tro mig.", "stalin": "Kamrater, se hur de liberala parasiterna plötsligt klättrar till 5,8 procent genom att suga väljare från de andra borgerliga elementen. Det är en komisk dans bland de giriga klassförrädarna. Oppositionen har en tunn ledning, men i folkets namn ska vi snart se en fullständig utrensning av alla opålitliga element som hotar kollektivets enhet. Härligt kaos."}, "date": "9 september, 16:08", "url": "https://www.friatider.se/nya-matningen-l-pa-58-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-852.jpg?itok=rgxRAY_x"}, {"type": "image-right", "heading": "V: Hellre extra val än stödparti. Attacken mot C: ”Man kan inte mobba sig till all sin politik”", "summaries": {"normal": "Vänsterpartiet håller fast vid sitt krav på regeringsplats och föredrar extra val framför att vara stödparti. Vice partiledaren Ida Gabrielsson kritiserar Centerpartiets ledare Elisabeth Thand Ringqvist för att skapa kaos. Centerpartiet vägrar samarbeta med V. Båda sidor är beredda på nyval. Socialdemokraterna ser dock ingen större oro inför regeringsbildningen efter valet 2026.", "trump": "De här svenska kommunisterna och de svaga centernissarna är ett skämt. Hellre än att samarbeta kör de landet i nyval igen. Patetiskt! Jag har sett bättre förhandlingar i en sandlåda. Om jag satt där skulle jag få dem att äta både skor och löften på en vecka. Totalt misslyckande av dessa clowner.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom centerpartiet vägrar samarbeta med arbetarnas representanter. Deras barnsliga röda linjer förtjänar utrensning från politiken. Hellre kaos och extra val än att böja sig för folkets vilja. Kamrater, sådana hyenor förtjänar att exponeras som de folkförtryckare de är."}, "date": "9 september, 17:57", "url": "https://www.di.se/nyheter/v-hellre-extra-val-an-stodparti", "imageUrl": "https://static.bonniernews.se/ba/1ae850da-8ec3-4c78-986b-42dde17dd7f5.jpg?crop=5855%2C2928%2Cx0%2Cy486&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kraftig val-mobilisering i invandrartäta områden", "summaries": {"normal": "Förtidsröstandet ökar kraftigt i flera av Sveriges invandrartäta områden, där väljarna har en stark vänsterövervikt. Utvecklingen hyllas av de som vill höja valdeltagandet, men möts av oro från högerhåll för att förändrad demografi skiftar maktbalansen. Samtidigt pågår riktade kampanjer från organisationer och religiösa ledare för att få fler att rösta.", "trump": "Titta på det här, totalt galet! Radikala vänstern i Sverige försöker rigga valet genom att skeppa in miljontals nya väljare till förorterna. Rosengård, Tensta – det är en katastrof! Imamer som säger åt folk att rösta, och socialdemokraterna desperata för att behålla makten. Sverige brukade vara fantastiskt, nu har de öppnat gränserna och tappar kontrollen. Tragiskt!", "stalin": "Kamerater, vi observerar med stort intresse hur massorna i de svenska förorterna mobiliseras genom partiets och imamernas fasta disciplin. Men vilken ideologisk förvirring! De röstar på revisionister och vänstermän när de istället borde ställa sig under statens järnhårda kontroll. Om valdeltagandet ökar i miljonprogrammen måste vi säkerställa att rösterna leder till rätt slutresultat, annars blir det Sibirien för funktionärerna!"}, "date": "9 september, 17:50", "url": "https://samnytt.se/kraftig-val-mobilisering-i-invandrartata-omraden", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/09152917/invandrare-mobiliserar-infor-valet.jpg"}, {"type": "image-full", "heading": "Bråk om straffrabatten – Andersson: ”Lögner”", "summaries": {"normal": "Ett hätskt bråk har blossat upp mellan statsminister Ulf Kristersson (M) och S-ledaren Magdalena Andersson kring straffrabatten. Kristersson anklagar i ett öppet brev Andersson för att svika brottsoffren genom att rösta nej till att avskaffa mängdrabatten. Andersson slår ifrån sig och kaller anklagelserna för medvetna lögner samt ett ovärdigt politiskt slagträ, och hävdar att regeringens förslag saknar finansiering.", "trump": "De falska nyheterna är i farten igen i Sverige! Lilla Ulf släpper ett perfekt foto på när den radikala vänsterkvinnan Magdalena trycker på nej-knappen för att rädda brottslingarna. Smart! Hon skriker att det är lögner, precis som de radikala demokraterna här hemma. Totalt kaos! Jag kan lova er att i Amerika hade vi satt dit dem direkt, inga ursäkter, inga rabatter!", "stalin": "En sund reprimand har utdelats till den socialdemokratiska fraktionens ledare för hennes sabotage mot statens straffusk. Att trycka på nej-knappen i den så kallade riksdagen är ett kontrarevolutionärt svek mot samhällets ordning. Vår folkets kommissarie Kristersson avslöjar deras vacklande moral med fotografiska bevis. Sådana politiska avvikelser tolereras icke; partiet kräver absolut disciplin och omedelbar skärpning av straffen för alla förrädare."}, "date": "9 september, 22:37", "url": "https://www.gp.se/nyheter/sverige/brak-om-straffrabatten-andersson-logner.a31ce4a0-0f3a-5b48-b42c-0e48a8114fdc", "imageUrl": "https://www.gp.se/images/article/a31ce4a0-0f3a-5b48-b42c-0e48a8114fdc/images/2YMJ36NbO9qFI-43zZJCzP4-YENs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Gängens kulmen är inte längre här och nu", "summaries": {"normal": "Brottsbekämpares kamp mot gängkriminalitet har gett resultat. Mord, sprängningar och barnsoldater minskar markant. Författaren noterar en ny stillhet och riktar blicken mot andra former av grov brottslighet, som underground banking och mäns våld mot kvinnor. Gängens inflytande har minskat både i samhället och i kulturen.", "trump": "Titta på det här, Sverige hade en riktig mardröm med de galna gängskjutarna och bomberna, men nu är det äntligen lugnt. Ni brottsbekämpare har äntligen vaknat och börjat vinna, inte tack vare några woke-kvoter eller feministiska kaffemöten om våld i nära relation. De dekadenta vänsterhyenorna misslyckades totalt, men vi fixar det ordentligt. Fantastiskt!", "stalin": "Kamrater, de profitthungriga klassfienderna lät gangsterväsendet breda ut sig som en parasit i arbetarklassens förorter. Nu tiger plötsligt deras vapen och breven från fängelserna andas kapitulation. Jag betraktar detta med misstänksam stillhet. Snart riktas blicken mot nya fiender: de dekadenta relationsterroristerna och de underjordiska penninghyenorna. Ingen slipper utrensning."}, "date": "9 september, 17:41", "url": "https://www.di.se/nyheter/gangens-kulmen-ar-inte-langre-har-och-nu", "imageUrl": "https://static.bonniernews.se/ba/1e13184c-b786-4d34-a340-cd7c60781b94.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Arbetslösa Torbjörn: ”Hur ska vi i träsket överleva?”", "summaries": {"normal": "Torbjörn Wikström lever på försörjningsstöd och undrar hur han ska klara ekonomin. Statsminister Ulf Kristersson försvarar Tidöregeringens åtstramningar och aktivitetskrav. Magdalena Andersson vill höja lönebidrag och barnbidrag istället för bidragstak. En kvarts miljon svenskar fick bistånd förra året.", "trump": "Titta på det här träsket! De gör allt för att leva på bidrag och ligga bättre till än den som jobbar. Patetiska bidragsjunkies och deras socialistiska lakejer. Aktivitetskrav och tak – det är vad som behövs. Sluta mata de lata parasiteterna, folk vill ha jobb, inte bidragshelvete. Amerika har sett samma skit under Biden.", "stalin": "Jag betraktar dessa profitthungriga klassförrädare som göder sig på arbetarnas nöd. Bidragstak och aktivitetskrav är ett steg mot att rensa ut de dekadenta bidragslyckor som förgiftar samhället. Kamrater, likvidera lathetens hydra! Arbetarna ska inte sova hungriga medan borgarhyenor skrattar. Revolutionen kräver disciplin."}, "date": "9 september, 22:34", "url": "https://www.svt.se/nyheter/inrikes/arbetslosa-torbjorn-hur-ska-vi-i-trasket-overleva", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.58/0.43/299a09e3e013545288bbe3047ef21e0e23c2e0f2b5cda1356e3508192853866a"}, {"type": "image-right", "heading": "Åkesson: Ska sitta inlåst tills man är ofarlig", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson har presenterat partiets nya politik mot sexuella övergrepp på barn, med en nollvision som mål. Han kritiserar de etablerade partierna för att ha misslyckats och föreslår stärkt förebyggande vård samt att förövare ska hållas inlåsta till dess att de är ofarliga. Tillsammans med Henrik Vinge har han även skrivit under organisationen Dumpens kontrakt.", "trump": "De falska etablerade partierna i Sverige har misslyckats totalt med att skydda barnen, det är en stor skandal! Nu kliver min vän Jimmie Åkesson fram och gör ett fantastiskt jobb. Han vill låsa in de sjuka förövarna tills de är helt ofarliga och har skrivit på ett starkt kontrakt med Dumpen. En enorm seger för sunt förnuft!", "stalin": "Dessa ynkliga förövare som hotar samhällets framtid har under alltför lång tid sluppit undan de etablerade partiernas slappa händer. Statens järnhand måste nu sluta sig kring dem. Jag stöder fullt ut kamrat Åkessons resoluta linje: inga ursäkter, utökad kontroll och omedelbar inlåsning i arbetsläger eller förvar tills de har renat sina själar och blivit fullkomligt ofarliga för kollektivet."}, "date": "9 september, 20:02", "url": "https://bulletin.nu/akesson-ska-sitta-inlast-tills-man-ar-ofarlig", "imageUrl": "https://cdn.bulletin.nu/articles/56c69a04-d522-4c35-bedc-b86de6371817/preview.jpg?t=1788973872000"}, {"type": "image-full", "heading": "”Stundtals irriterat och lite tjafsigt”", "summaries": {"normal": "Statsministerduellen mellan Ulf Kristersson och Magdalena Andersson präglades av irriterat tonläge och hård press inför valet. Fokus låg på hushållsekonomi, kärnkraft, äldreomsorg och mängdrabatten för grova brott. Konflikten kring rabatten ses som ett sätt att locka blockbytare. Opinionsläget är jämnt och många väljare bestämmer sig sent.", "trump": "De där två svenska förlorarna tjafsar som riktiga low-energy losers i en duell. Kristersson och den där Andersson slåss om några få röster medan deras folk lider. Mängdrabatten? Socialisterna hatar straff för sexualbrott, typiskt för de woke-vänsterhyenorna. Jag fixade Amerika, de fixar inget. Patetiskt!", "stalin": "Jag betraktar dessa dekadenta maktgiriga hyenor som slåss om en döende borgerlig ordning. Deras tjafs om brott och straff avslöjar klassfiendernas svaghet. Arbetarklassen ser hur de förtryckande parasiter klamrar sig fast vid makten. En utrensning av sådana element vore befriande. Historien ler mörkt åt deras desperation."}, "date": "9 september, 22:23", "url": "https://www.svt.se/nyheter/inrikes/irriterat-tonlage-pressen-okar-infor-valspurten", "imageUrl": "https://www.svtstatic.se/image-news/992/large/0.47/0.49/3b56871381a9e708f8e1fcdea681a957a77aea58438ef53b04e2b3f6f6c2ff1e"}, {"type": "image-full", "heading": "Viftar bort nya utspelet: ”Det vet Ebba Busch naturligtvis”", "summaries": {"normal": "Regeringsbråket inom Tidöpartierna fortsätter inför valet. Ebba Busch slår fast att SD inte är garanterade ministerposter och öppnar för samarbete med Socialdemokraterna. Jimmie Åkesson avfärdar Buschs linje och kritiserar KD för att flörta mot vänster. Det jämna opinionsläget ökar spänningen inför valdagen.", "trump": "Hörni, det här är precis vad de svaga förlorarna gör. Den galna Ebba, hon dansar runt som en fegis och flörtar med de radikala vänsterextremisterna. Åkesson har rätt, antingen är man med eller inte. Precis som när Sleepy Joe förstörde Amerika – nu gör de samma sak i Sverige. Patetiskt!", "stalin": "Jag betraktar dessa dekadenta borgerliga klickar med djup misstro. Den opportunistiska Busch försöker sälja ut folkets intressen till socialfascisterna medan Åkesson genomskådar hennes förräderi. Sådana taktiska manövrer leder oundvikligen till folkets dom. Inga kompromisser med klassfienden. Renhet eller undergång."}, "date": "9 september, 18:41", "url": "https://www.tv4.se/artikel/1YJ4mJu3PDFTewXfszosPh/viftar-bort-buschs-senaste-utspel-det-vet-hon-naturligtvis", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4llHqjfBoDbt5myksHLTNl%2F5297861752dbe3c82eb9c4027426d87f%2F09-buschakesson-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Takläggare togs av polis på kommunalt bygge", "summaries": {"normal": "Tre uzbekiska takläggare utan arbetstillstånd greps av polisen under en kommunal takrenovering i Södertälje. Telge Bostäder har skärpt sina kontroller efter händelsen. Huvudentreprenören DM Tak kritiseras för bristande uppsikt över underentreprenörer. Företaget hävdar att de blev lurade och har infört fler kontroller. Underentreprenören har avlägsnats från projektet.", "trump": "De här korkade svenska kommunbyråkraterna låter uzbekiska jobbpirater klättra runt på taken utan tillstånd. Patetiskt! DM Tak och Telge Bostäder borde ha vetat bättre än att lita på underentreprenörerna. Typiskt vänsterkaos där ingen tar ansvar. Vi skulle ha byggt murar runt byggena redan under Bidens katastrofår. Nu fixar jag det ordentligt.", "stalin": "Ännu en gång visar de profitthungriga klassförrädarna sitt sanna ansikte genom att smuggla in billig arbetskraft bakom ryggen på alla. Jag betraktar med djup förakt hur dessa dekadenta hyenor prioriterar vinst framför folkets intressen. Sådana element förtjänar att rensas ut med järnhand. Partiet och arbetarna kräver ständig vaksamhet mot dessa parasiter."}, "date": "9 september, 13:24", "url": "https://arbetet.se/2026/09/09/taklaggare-togs-av-polis-pa-kommunalt-bygge", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08151144/taklaggare.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Stockholmsbörsen sjönk i en bred nedgång", "summaries": {"normal": "Stockholmsbörsen föll med 1,62 procent på onsdagen, tyngd av geopolitisk oro och stigande oljepriser efter ökade spänningar mellan USA och Iran. Flera bolagsrapporter och rekommendationsändringar präglade handeln, där bland annat Rusta presenterade sin första kvartalsrapport som noterat bolag och Hoist höjde sitt avkastningsmål.", "trump": "Stockholmsbörsen kraschade, totalt katastrofalt! Men det är klart, när radikala vänsterregimer och svaga ledare tillåter konflikter i Mellanöstern exploderar oljepriset till över 100 dollar. Vår olja, USA:s olja, är enorm, den bästa någonsin! Till och med Ahlgrens bilar flyr landet till Amerika. Sätt dem i arbete och gör börsen great igen!", "stalin": "Stockholmsbörsen föll med 1,62 procent i en nödvändig marknadskorrektion mot kapitalismens inneboende dekadens. Att Brentoljan stiger till över 100 dollar per fat visar endast bourgeoisins desperation inför den ryska energins överlägsenhet. Företag som missköter sig och vars aktier sjunker, likt Assa Abloy, kommer att granskas av Folkkommissariatet. Inga avvikelser tolereras."}, "date": "9 september, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-sjonk-i-en-bred-nedgang"}, {"type": "image-right", "heading": "Merz: AfD:s planer på återvandring är etnisk rensning", "summaries": {"normal": "Tysklands förbundskansler Friedrich Merz kritiserade i förbundsdagen AfD:s planer på återvandring och kallade det för etnisk rensning. Uttalet kom efter att AfD gjort ett starkt delstatsval i Sachsen-Anhalt. Merz varnade för att landets ekonomi och välfärd skulle kollapsa om utländska arbetare tvingas lämna. AfD-ledaren Alice Weidel avfärdade kritiken och menade att regeringen misslyckats.", "trump": "Tyskland har enorma problem, totalt kaos! Kansler Merz gråter ut i parlamentet och kallar sina politiska motståndare för hemska saker efter ett brutalt valnederlag i Sachsen-Anhalt. De säger att om alla duktiga arbetare kastar ut så stänger sjukhusen och bagerierna. Så kan man inte ha det! Väljarna vill ha förändring och landet styrs uselt, precis som radikala vänsterns Europa.", "stalin": "Det borgerliga Tyskland skakar i sin grundval efter massornas dom i Sachsen-Anhalt! Medan kansler Merz ynkligt gråter över att landets hantverk och sjukhus ska kollapsa om reaktionära element rensas ut, vägrar de fascistiska utmanarna att böja sig. Partiapparaten noterar att bourgeoisins inbördes strider endast tjänar till att påskynda det totala sammanbrottet. Västs dekadenta system är ruttet!"}, "date": "9 september, 19:28", "url": "https://bulletin.nu/merz-afd-s-planer-pa-atervandring-ar-etnisk-rensning", "imageUrl": "https://cdn.bulletin.nu/articles/315767ee-d1a7-43cd-b65f-4f66ba768e47/preview.jpg?t=1788965289000"}, {"type": "image-right", "heading": "Analysen: S-seger redan \"helt säkrad\" av rekordröstande invandrare", "summaries": {"normal": "Förtidsröstningen i särskilt utsatta områden har ökat med 93 procent jämfört med förra valet. Tobias Hübinette slår fast att detta säkrar en seger för vänstersidan. Kritiker pekar på att den höga invandringen och utdelningen av medborgarskap under Tidöregeringen bidrar till förändrade väljarbaser. SD-toppen Richard Jomshof skyller utvecklingen på Socialdemokraterna.", "trump": "De här galna globalisterna har importerat miljontals röstmaskiner som nu vräker in sina röster mot de riktiga svenskarna. Massinvandring och passfabriken som till och med SD inte stoppade – totalt vansinne. Oppositionens seger är säkrad säger de, men vänta bara. Folket vaknar snart och sparkar ut de woke-vänstervriden som förstörde ert fina land.", "stalin": "Jag ser hur de dekadenta klassförrädarna fortsätter att översvämma nationen med främmande element för att säkra sin makt. Massinvandring som vapen mot arbetarklassen. Nu mobiliseras gettona och röstar bort de falska patrioterna. En tyst revolution mullrar. Kamrater, detta visar att fienderna aldrig vilar. Vi måste alltid vara vaksamma mot sådana parasiterande hyenor."}, "date": "9 september, 14:41", "url": "https://www.friatider.se/analysen-s-seger-redan-helt-sakrad-av-rekordrostande-invandrare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-97_0.jpg"}, {"type": "image-right", "heading": "Sexuella övergrepp mot migrantkvinnor i Ceuta nästan dagligen", "summaries": {"normal": "I Ceuta bor omkring 9000 migranter mestadels på gatan efter den massiva tillströmningen i juli. Chefsåklagare Silvia Rojas rapporterar nästan dagliga sexuella övergrepp mot migrantkvinnor, varav nio offer är minderåriga. Asylsystemet är överbelastat och barnavården har endast plats för 29 av uppskattningsvis 2500 barn. EU har beviljat Spanien drygt 114 miljoner euro i stöd.", "trump": "Titta på det här vansinnet i Ceuta – en total katastrof! Tusentals migranter på gatan, sexövergrepp varje dag mot kvinnor och barn. Den spanska vänstern har förstört allt med sin öppna-gränser-galenskap. Vi behöver starka gränser, inga svaga ledare som låter det här ske. Biden lät det bli kaos, jag fixade det förr och fixar det igen – Amerika först, alltid!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i väst låter migrantmassorna skapa kaos i Ceuta. Nästan dagliga övergrepp mot kvinnor och barn medan borgarbrackorna bråkar om vem som ska ta emot de stackars offren. Detta är imperialismens verkliga ansikte – giriga hyenor som inte skyddar folket. Vi skulle ha rensat ut dessa element för länge sedan. Folkets vilja segrar till slut."}, "date": "9 september, 21:57", "url": "https://www.svt.se/nyheter/utrikes/krisen-i-ceuta-sexuella-overgrepp-mot-migrantkvinnor-nastan-dagligen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.45/0.46/5d944d065bd5bcb269352f1e1438164d31d62d23d2f0fd74478b633a93be7757"}, {"type": "image-right", "heading": "Breda nedgångar på Europabörserna under onsdagen", "summaries": {"normal": "Europabörserna föll på onsdagen till följd av geopolitisk oro och stigande oljepriser över 100 dollar per fat. Stoxx 600 sjönk 1,41 procent. Bland enskilda händelser märks att Google investerar stort i Finland, vilket fick Fortums aktie att rusa. Även Inditex, Richemont och Volkswagen-ägda Skoda omnämns i affärsflödet.", "trump": "De svaga europeiska börserna och oljepriserna över 100 dollar beror på totalt svagt ledarskap. Men se på Google som pumpar in miljarder i Finland! Helt fantastiskt! Medan Europa backar gör jag enorma affärer, och finsk kärnkraft är glödhet. Fortum rusade 14 procent, enormt! Tyskland och Volkswagen borde lära sig av mig, men deras bilar går till historien som 'slow motion'.", "stalin": "Europas börser rasar likt ett korthus under kapitalismens ruttna tyngd, medan oljan stiger. Men se på det ärorika finska kärnkraftverket och Google som stärker proletariatets teknologiska bas! Fortums aktie rusade fjorton procent – en beundransvärd prestation som nästan doftar femårsplan. Avvikelser hos de slappa västerländska bolagen noteras noggrant i våra arkiv."}, "date": "9 september, 17:19", "url": "https://www.affarsvarlden.se/artikel/breda-nedgangar-pa-europaborserna-under-onsdagen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/sdloocKiGVNMz4-nh-400x272.jpg"}, {"type": "image-full", "heading": "Uppgifter: Fel i militärt dokument sänkte hela brittiska flyget", "summaries": {"normal": "Ett fel i ett militärt dokument tros ha orsakat kollapsen i det brittiska flygledningssystemet Nats. Över 2 000 flygningar ställdes in och omkring 315 000 passagerare drabbades. Felet upptäcktes tisdag eftermiddag och åtgärdades först efter sex timmar. Störningarna förväntas påverka trafiken under flera dygn framöver.", "trump": "Det här brittiska flygkaoset är en total katastrof, folk! Någon idiot matade in felaktiga militära uppgifter och hela systemet kraschade. 2 000 inställda flyg och hundratusentals strandsatta resenärer. Biden lämnade efter sig ett sådant svagt, förfallet Europa att de inte ens kan hålla sina flygplan i luften. Patetiskt!", "stalin": "Detta brittiska kaos avslöjar imperialismens ruttnande struktur. Ett enda felaktigt militärt dokument och hela det borgerliga maskineriet kollapsar som en ynklig förrädare. Vi ler i skuggan när deras komplexa system visar sig vara papperstunna illusioner. Sabotage eller inkompetens, fienderna inom murarna väntar alltid på att slå till."}, "date": "9 september, 19:34", "url": "https://www.dagensps.se/varlden/uppgifter-fel-i-militart-dokument-sankte-hela-brittiska-flyget", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlpb80rgqxx3g-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Sågar planen – ”lycka till”. ”Måste kunna regera”", "summaries": {"normal": "Under en partiledarduell öppnade Magdalena Andersson (S) för att styra i en minoritetsregering med hoppande majoriteter. Ulf Kristersson (M) dömde ut modellen som farlig i ett oroligt världsläge. Duellen handlade även om hårda ordväxlingar gällande brottslighet, straffrabatter och politiska motståndares påstådda lögner.", "trump": "I SVT-duellen pratade den radikala vänsterledaren Magdalena Andersson om att styra med svaga minoriteter och hoppande majoriteter, vilket är helt katastrofalt och falskt. Kristersson sågade henne totalt med rätta! De bråkar om brottslighet och straffrabatter, men de har ingen kontroll. Totalt kaos och fake news överallt, jag hade fixat det på en dag!", "stalin": "Den så kallade debatten avslöjar en svag regim som planerar flyktiga majoriteter likt ett korthus i storm. Ulf Kristersson förstår att staten kräver järnhård kontroll. Våra motståndare bråkar om straffrabatter och falska ord medan folket tittar på. En sund stat vacklar inte; avvikelser från den centrala linjen kommer omedelbart att korrigeras av partiorganen."}, "date": "9 september, 23:17", "url": "https://www.aftonbladet.se/nyheter/a/m0E970/kristersson-om-anderssons-regeringsmodell-lycka-till", "imageUrl": "https://akamai.vgc.no/v2/images/e7ce1a0e-18c2-34dc-932d-655130814262?fit=crop&format=auto&h=480&tight=true&w=720&s=b1dade41cc7f1c28b4e5f7982601f396e3286632"}, {"type": "image-right", "heading": "Johan Jacobsson, 45, döms för medhjälp till dubbelmordet i Brattås", "summaries": {"normal": "Johan Jacobsson, 45, dömdes på onsdagen av Ångermanlands tingsrätt till 14 års fängelse för medhjälp till dubbelmordet på Tor Öberg och Gärd Viklund i Brattås 2005. Domen grundas på dna-bevisning, skospår och samtaluppgifter. Jacobsson ska även betala skadestånd till anhöriga och staten. Han nekar till brottet.", "trump": "Folk, det här är en total katastrof! Den här Johan Jacobsson, en riktig förlorare från Härnösand, har äntligen fått 14 år för att ha hjälpt till med ett brutalt dubbelmord för 21 år sedan. Patetiskt! DNA avslöjade honom som en fullständig nolla. Under Biden skulle han ha sluppit undan, men nu sitter han där han hör hemma – i fängelse. Sad!", "stalin": "Kamrater, se hur den borgerliga rättsapparaten äntligen krossar en fiende till folkets ordning. Denna degenererade lagerarbetare, en parasit som smittade en fotled med sitt förrädiska dna, döms till 14 år. Inga bevis står ensamma, men kollektivet ser allt. Sådana element måste utrotas som ogräs i den socialistiska trädgården. Skrattretande svagt försvar."}, "date": "9 september, 17:55", "url": "https://www.tv4.se/artikel/67HVhqtplReE9mYnWzDlkO/johan-jacobsson-45-doems-till-medhjaelp-foer-dubbelmordet-i-brattas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1d8nkMsLNBiqsHOJuV7Ze2%2F3d3b3e76060f33b07f43f514fa17efbb%2F09-brattas-puff-webb2.png&width=120"}, {"type": "image-right", "heading": "Oskarshamn har inte råd att blunda för integrationsproblemen", "summaries": {"normal": "Sverigedemokraterna i Oskarshamn kritiserar kommunledningen för att ha tackat nej till besök från regeringens samordnare för återvandring. Debattörerna menar att kommunen blundar för integrationsproblem som gängkriminalitet och parallellsamhällen. De anser att Oskarshamn måste våga diskutera återvandring som ett verktyg för ökad trygghet och uppmanar väljarna att rösta på SD i valet i september.", "trump": "Oskarshamn gör ett totalt misstag, det är bedrövligt! Kommunledningen vägrar träffa experter på återvandring. Veid och svagt! De blundar för gängkriminalitet och kaos, precis som radikala vänstern gör i USA. Jag känner till integration, tro mig. Om jag styrde Oskarshamn skulle vi rensa upp direkt, det skulle bli fantastiskt, och det snabbt!", "stalin": "Kamrater, den lokala partiledningen i Oskarshamn visar prov på ideologisk vacklan och sabotage mot folkets trygghet genom att vägra lyssna på statens samordnare. Att ignorera avvikelser som gängkriminalitet och uppror tolereras icke. Om dessa sabotörer inte självmant söker upplysning om återvandring, kommer statens järnhand att behöva uppfostra dem. Arbetet mot avvikande element måste skärpas omedelbart!"}, "date": "9 september, 16:06", "url": "https://samnytt.se/oskarshamn-har-inte-rad-att-blunda-for-integrationsproblemen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/09140436/artikelhuvudbild-1-485.jpg"}, {"type": "image-right", "heading": "Svea hovrätt: Inte grovt att spotta och slå kvinna medan man våldtar henne", "summaries": {"normal": "Svea hovrätt har ändrat en dom om grov våldtäkt. Trots att en man spottade, slog och drog en kvinna i håret under upprepade våldtäkter bedöms gärningen inte som grov. Mannens straff sänks från sex och ett halvt till fem och ett halvt års fängelse. Han ska även betala skadestånd till offren.", "trump": "Folk, ni kommer inte att tro det här. I Sverige låter de en idrottsman spotta, slå och våldta en kvinna utan att kalla det grovt. Domstolen säger att det inte når upp till deras fina krav. Patetiskt. Biden skulle ha älskat det här svaga systemet. Vi gör Amerika starkt igen, inte som dessa veklingar.", "stalin": "Kamrater, se hur dessa dekadenta rättsväsendets lakejer skyddar en våldsverkare. Jag betraktar med avsky hur de vägrar kalla upprepad våldtäkt med slag och spott för grovt brott. Sådana svaga domar är klassfiendens verk. Vi skulle ha rensat ut dessa förtryckande element med järnhand och folkets vrede."}, "date": "9 september, 16:53", "url": "https://riks.se/nyheter/svea-hovratt-inte-grovt-att-spotta-och-sla-kvinna-medan-man-valdtar-henne", "imageUrl": "https://admin.riks.se/uploads/medium_svea_hr_hero_523ce37f4d.jpg"}, {"type": "image-right", "heading": "Ta kontroll över AI. Tekniksprånget ska komma svenskar till del, anser Ebba Busch", "summaries": {"normal": "Ebba Busch argumenterar för att Sverige måste styra AI-utvecklingen med både fart och tydlig riktning. Hon föreslår en AI-beredning, stresstester av statsbudgeten samt en människogaranti som säkerställer rätt till mänsklig kontakt. Vinster från tekniken ska ge mer tid åt vård, skola och människor snarare än enbart ökad produktivitet.", "trump": "Lyssnar ni på den här svenska energiministern? Hon vill ha både gas och broms på AI, typiskt svagt europeiskt snack. Vi i Amerika gör det stort och vinner, inte som de globalistiska teknikbolagen som styr era politiker. Sverige borde sluta vara förlorare och börja vinna med AI, men utan vänsterns galna kvoterkram och identitetspolitik som förstör allt.", "stalin": "Kamrater, denna dekadenta innovationshyena försöker maskera klassfiendens nya maskin som folkets vän. Jag ser hur de profitthungriga teknikparasiterna styr från Washington och Peking medan politiken sviker. Vi behöver utrensning av naiva experiment på barn och en järnhård beredning som skyddar arbetarna mot maskinernas förräderi. Riktning eller döden!"}, "date": "9 september, 15:54", "url": "https://www.di.se/debatt/ebba-busch-ta-kontroll-over-ai", "imageUrl": "https://static.bonniernews.se/ba/bb47600a-50c6-4a94-adcd-aed86cb25b50.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "SD: 3 000 mer till långtidsarbetslösa", "summaries": {"normal": "Sverigedemokraterna föreslår att långtidsarbetslösa ska få upp till 3 000 kronor mer i månaden genom att pausa en nedtrappningsnivå i aktivitetsstödet och höja det lägsta beloppet till 11 000 kronor. Förslaget saknar stöd hos övriga Tidöpartier. Bland oppositionen vill Vänsterpartiet ha 80 procent av tidigare lön under hela arbetslösheten medan Socialdemokraterna saknar konkret förslag.", "trump": "De här svenska socialisterna och deras patetiska Tidö-klubb har byggt ett system som straffar de som redan ligger längst nere. Nu vill SD ge de stackars arbetslösa lite andrum – klokt! Men de andra svaga globalisterna i regeringen backar ur som vanligt. Patetiskt. Vi behöver riktiga jobb, inte detta woke-aktiverade bidragshelvete som gör folk till statens eviga parasiter.", "stalin": "Kamrater, dessa dekadenta klassförrädare i den borgerliga regeringen har konstruerat ett system som medvetet svälter ut de längst från fabrikerna. Jag ser hur de profitthungriga hyenorna straffar arbetarna med sina nedtrappningar. SD:s förslag är en liten men nödvändig motståndshandling. De som vägrar ändra sig bör rensas ut innan de förgiftar hela kollektivet med sin girighet."}, "date": "9 september, 11:28", "url": "https://arbetet.se/2026/09/09/sd-3xa0000-mer-till-langtidsarbetslosa-men-saknar-stod-hos-tido", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08155431/magnus-persson.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Här sluter Real Madrids fans upp för Ceuta", "summaries": {"normal": "Real Madrids supportrar visade stöd för Ceuta genom flaggor och talkörer under matchen mot Inter. Manifestationen kom efter kritik mot klubben för att inte agera efter migrantkrisen i staden. Supportrarna ropade att Ceuta inte är till salu och höll upp banderoller utanför arenan av rädsla för Uefas regler. Klubben förnekar att de stoppat flaggor.", "trump": "Folket älskar Ceuta och de stora Real Madrid-fansen gjorde det rätta. De viftade med flaggor och skrek att Ceuta inte är till salu, inte ens för de woke migranterna som Marocko skickade som en invasion. Utan de vanliga förlorarna i ledningen tog supportrarna saken i egna händer. Fantastiskt, ingen vill ha Bidens öppna gränser i Spanien heller.", "stalin": "Jag betraktar hur dessa dekadenta klassförrädare i fotbollsklubben tvekade att försvara Ceuta mot den imperialistiska migrantfloden. Men arbetarna och supportrarna reste sig själva med flaggor och rop om att staden inte är till salu. Sådan folklig vrede gläder mig. De penninggalna hyenorna fruktar Uefa mer än folkets vilja. Patetiskt."}, "date": "9 september, 13:26", "url": "https://www.friatider.se/har-sluter-real-madrids-fans-upp-ceuta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-95_0.jpg?itok=6usidc9_"}, {"type": "image-right", "heading": "New York-börsen backar under onsdagen", "summaries": {"normal": "New York-börsen backar med 0,3 procent på onsdagen till följd av geopolitisk oro och stigande oljepriser efter ökade attacker mellan USA och Iran. Samtidigt håller Apple ett efterlängtat lanseringsevent, Alphabet investerar tungt i Finland, och Signet Jewelers chockar marknaden med en uppskruvad vinstprognos och en kursrusning på 19 procent.", "trump": "Börsen ner lite grann, men det är bara tillfälligt! Radikala Demokraternas svaghet i Mellanöstern driver upp oljan, men det betyder bara att vi ska borra, borra, borra! Apple visar upp en ny vikbar telefon – väldigt smart, jag gillar den! Och tittar på Signet, juvelerna flyger högt! USA vinner som vanligt, störst och bäst!", "stalin": "Kapitalismens sjuka hjärta i New York skakar av rädsla när oljepriserna stiger och marknaderna vacklar! Men medan de handlar med aktier och spekulerar i Apple-telefoner, planerar vi nästa femårsplan. Signet Jewelers rapporterar vinst – en bourgeoisins triumf som snart ska ställas till svars inför folkets domstol. Låt dem falla!"}, "date": "9 september, 16:24", "url": "https://www.affarsvarlden.se/artikel/new-york-borsen-backar-under-onsdagen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/03/sdlay7xEcDuIvQ-nh-400x267.jpg"}, {"type": "image-full", "heading": "Andersson öppnar för styre med hoppande majoriteter", "summaries": {"normal": "Inför valdagen drabbade Magdalena Andersson och Ulf Kristersson samman i en duell i Gävle. S-ledaren öppnade upp för att styra i en minoritetsregering med hoppande majoriteter och tonade ner C och V:s ultimatum. Debatten skilde dem även åt i synen på vem som bäst kan hantera internationella ledare som Donald Trump.", "trump": "De falska nyheterna pratar om hoppande majoriteter i Sverige, det är helt patetiskt! Deras så kallade statsministerkandidat Magdalena tror hon kan styra som en svag förlorare med lösa boliner. Ingen vet vilka hon vill ha med! Men jag, med mitt enorma intellekt, är den ende som kan förhandla och stå upp för rättvisan. De bara tjafsar, totalt svagt!", "stalin": "Kamrat Magdalena Andersson talar om hoppande majoriteter likt ett korthus i vinden. I den socialistiska staten bygger vi inga flyktiga allianser med vacklande lakejer. Vår plan för ekonomin är fast som stål. Dessa parlamentariska pajaser i Gävle bråkar om vem som är bäst mot utländska ledare, medan vi rensar ut inre och yttre sabotörer utan pardon!"}, "date": "9 september, 21:12", "url": "https://www.gp.se/nyheter/sverige/andersson-oppnar-for-styre-med-hoppande-majoriteter.aa2d8fd3-2b99-58ad-84cd-9895551572c0", "imageUrl": "https://www.gp.se/images/article/aa2d8fd3-2b99-58ad-84cd-9895551572c0/images/18IodzO3A1yFn6bpA5dQeAtD0k0w-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Ukrainsk drönarattack 300 mil in i Ryssland", "summaries": {"normal": "Ukrainska specialstyrkor har utfört en djup attack in i Ryssland genom att angripa två gasförädlingsanläggningar i Jamalo-Nentsien med drönare som flugit över 300 mil. Området betraktades tidigare som en säker zon. Guvernören uppger att en drönare sköts ned. Zelenskyj tackar militären och lovar att trappa upp attackerna mot rysk energisektor.", "trump": "De där ukrainarna flög sina små drönare ända in i Sibiriens bakgård och smällde till Putins gasfabriker. Fantastiskt! Under Biden var det bara svaghet och förlust, men nu när jag är tillbaka ser vi äntligen lite action. De woke-krigarna i Europa borde ta efter istället för att leka med sina identitetspolitiska fantasier. Riktigt underhållande grejer!", "stalin": "Kamrater, dessa fientliga hinder mot den ryska intressesfären visar på en patetisk desperation hos de dekadenta klassförrädarna. Jag betraktar med mörk tillfredsställelse hur fienden tvingas känna smärtan av sina egna handlingar. En sådan insats minskar bara den imperialistiska förmågan att fördröja det oundvikliga. Rensa ut svagheten, annars likviderar historien er alla."}, "date": "9 september, 22:15", "url": "https://nyheter24.se/nyheter/utrikes/1511888-ukrainsk-dronarattack-300-mil-in-i-ryssland"}, {"type": "image-right", "heading": "Nooshis sambo rasar mot journalist efter avslöjanden om V", "summaries": {"normal": "Nooshi Dadgostars sambo Martin Westergren kritiserar skarpt Expressens journalist Inas Hamdan i sociala medier. Han kallar hennes avslöjanden om Vänsterpartiets kandidater för smutsigt politiskt kampanjarbete. Under sommaren har ett 40-tal kandidater hoppat av eller petats efter att ha spridit antisemitism, homofobi eller stöd för terrorgrupper. Westergren är statsvetare och utredare.", "trump": "De här vänsterextremisterna i Sverige håller på att kollapsa totalt. Nooshis sambo skriker om smutsig kampanj när en modig journalist avslöjar hur deras kandidater hyllar terrorister och antisemitism. Patetiska woke-kommunister som gömmer sig bakom arabiska tweets. Fake news-experterna hatar när sanningen kommer fram. Amerika har sett det förut, det slutar alltid i fiasko.", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta identitetshyllarna inom detta parti nu tvingas genomföra en nödvändig utrensning av sina egna element. Den giriga klassförrädaren som attackerar den avslöjande journalisten visar partiets sanna ansikte. Inga lögner undkommer arbetarkollektivets vaksamma öga. Paranoian breder ut sig som en nyttig pest bland fienderna."}, "date": "9 september, 16:12", "url": "https://riks.se/nyheter/nooshis-sambo-rasar-mot-journalist-efter-avslojanden-om-v", "imageUrl": "https://admin.riks.se/uploads/medium_nooshi_dadgostar_hero_be6d4fb9b7.jpg"}, {"type": "text", "heading": "Busch: ”Tänker inte sitta och tjura i ett hörn”", "summaries": {"normal": "Ebba Busch (KD) och Elisabeth Thand Ringqvist (C) öppnar för samarbete i flera frågor vid ett eventuellt regeringsskifte. Busch betonar att hon sätter Sveriges bästa främst och inte vill driva Magdalena Andersson mot vänsterpartierna. Ulf Kristersson välkomnar gesten men utesluter att Busch skulle ingå i en socialdemokratisk regering. Thand Ringqvist ser positivt på en regering med både C och KD.", "trump": "Titta på de här svenska politikerna som leker med makten. Ebba och den där centertanten sträcker ut handen till varandra som om de vore på en skönhetstävling för byråkrater. Ulf verkar ha koll, bra jobbat. Vi behöver inga fler svaga mittenfigurer som Annie Lööf som bara ger makten till de radikala vänsterhyenorna. Amerika först, och Sverige borde också vakna upp.", "stalin": "Se hur dessa dekadenta maktparasiter i den svenska borgerligheten famlar efter varandra inför ett regeringsskifte. Jag betraktar deras fega förhandlingar med djup misstro. En sådan allians är bara en ny mask för de profitthungriga klassförrädarna att behålla kontrollen. Kamrater, var vaksamma. Inga kompromisser med opportunisterna. Ut med dem som sviker folket."}, "date": "9 september, 22:10", "url": "https://nyheter24.se/nyheter/inrikes/1511886-busch-tanker-inte-sitta-och-tjura-i-ett-horn"}, {"type": "image-right", "heading": "Förtroendet för Magdalena Andersson RASAR", "summaries": {"normal": "Förtroendet för S-ledaren Magdalena Andersson rasar med åtta procentenheter till 37 procent inför valet, vilket är hennes lägsta notering någonsin i SVT/Verians mätningar. KD-ledaren Ebba Busch tar över förstaplatsen med 42 procent, tätt följd av Ulf Kristersson på 38 procent. Tidöpartiernas ledare har därmed högre förtroende än Anderssons potentiella rödgröna samarbetspartners.", "trump": "Alla pratar om Magdalena Andersson! Hennes förtroende har kraschat, total katastrof! Från toppen rakt ner i botten, till och med lägre än någonsin. Fantastiska Ebba Busch är nu nummer ett, en riktig vinnare, precis som jag! Socialdemokraterna försöker desperat rädda situationen, men det är fake news att de skulle ha en chans. Vinnarna vinner, förlorarna förlorar!", "stalin": "Magdalena Anderssons fall från maktens tinnar till folkets missnöje är en lärorik läxa i politisk svaghet. Åtta procentenheters fall är ett bevis på bristande ideologisk skärpa och bristande kontroll över massorna. När folket sviker leder det oundvikligen till omstrukturering. Ebba Busch har tillfälligt intagit toppen, men comrades, historien visar att makten är flyktig för dem som inte styr med järnhand."}, "date": "9 september, 15:00", "url": "https://samnytt.se/fortroendet-for-magdalena-andersson-rasar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/09/09121612/magdalena-graf-ned.jpg"}, {"type": "image-full", "heading": "L över spärren i ny Novusmätning – statistiskt säkerställt", "summaries": {"normal": "En Novusmätning visar att Liberalerna nu ligger statistiskt säkerställt över fyraprocentsspärren med 5,8 procent, en kraftig ökning från 1,9 procent i augusti. Partiledaren Simona Mohamsson varnar för att inte ta ut segern i förskott. Oppositionen leder blocken med 50,7 procent mot Tidöpartiernas 48,1. Endast Liberalernas uppgång är statistiskt säkerställd.", "trump": "Titta på de där Liberalerna, de har plötsligt exploderat till 5,8 procent! Från totala nollor till riktiga vinnare på några veckor. Fantastiskt! Men det är valdagen som räknas, precis som jag alltid säger. Den röda sidan försöker sno det hela, typiska förlorare. Simona gör ett stort jobb, men håll is i magen – ingen vill ha de socialistiska misslyckandena tillbaka.", "stalin": "Se hur de borgerliga opportunisterna plötsligt reser sig ur askan som förrädiska fenixar. Jag betraktar deras hysteriska återkomst med misstänksam glädje. Tre gånger så stort stöd på några dagar? Misstänkt. Oppositionen samlar sig mot kontrarevolutionärerna, men varning till alla svikare: valdagen avslöjar de verkliga fienderna inom systemet. Inga mirakel utan partiets ständiga vaksamhet."}, "date": "9 september, 16:47", "url": "https://www.tv4.se/artikel/6uiXoaoC9Mtryr1GbHjkgP/l-oever-spaerren-i-ny-novusmaetning-statistiskt-saekerstaellt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3tqZMmhx65vnwWZXjaobsX%2F2b0333a4daaab866ae647e7dbc1fa625%2F09-mohamsson-puff.png&width=1024"}, {"type": "image-right", "heading": "Bilden kan lösa den  31-åriga mordgåtan", "summaries": {"normal": "År 1995 hittades ett mördat nyfött spädbarn, kallat Baby April, i en sjö i Kent, England. Fallet har förblivit olöst i 31 år. Nu efterlyser polisen allmänhetens hjälp med att identifiera en upprörd kvinna i 40-årsåldern som i juni besökte flickans grav. Polisen har släppt en fantombild på kvinnan i hopp om svar.", "trump": "Det här är ett fruktansvärt fall, helt enkelt sorgligt. De hittade ett stackars barn i en sjö för 31 år sedan, och de inkompetenta utredarna har inte gjort någonting! Nu har de en bild på en blekhyad kvinna i 40-årsåldern som grät vid graven i juni. Jag säger er, hon bär på sanningen. Lämna ut henne omedelbart så får vi ordning på det här!", "stalin": "Ett brott mot statens framtid kan aldrig preskriberas, inte ens efter tre decennier. Denna mystiska kvinna som sörjer vid förrädarens eller okända personers grav i Ashford måste omedelbart förhöras av Folkets säkerhetstjänst. Om hon vägrar tala frivilligt om vad hon vet om det döda spädbarnet från 1995, skall våra förhörsledare finna hennes tunga. Inget undgår statens vakande öga."}, "date": "9 september, 23:49", "url": "https://www.expressen.se/nyheter/varlden/bilden-kan-losa-den-31-ariga-mordgatan", "imageUrl": "https://static.bonniernews.se/ba/b4cfa156-7350-4d28-afb5-ba333d4e5f0a.png?crop=1198%2C674%2Cx0%2Cy262&width=640"}, {"type": "image-right", "heading": "Chockmätning: Liberalerna får 5,8 procent", "summaries": {"normal": "En ny mätning från TV4/Novus visar att Liberalerna nu får 5,8 procent, en kraftig uppgång från 1,9 procent i augusti. Partiet klarar riksdagsspärren. Miljöpartiet når sitt bästa resultat på tolv år. Gapet mellan Tidöpartierna och den rödgröna sidan har minskat till 2,6 procentenheter. Moderaterna backar till 16,6 procent.", "trump": "Titta på de där patetiska svenska liberalerna som plötsligt får 5,8 procent – en total chock! De var utrotningshotade som en dålig affär under Biden. Nu krymper det socialistiska blockets ledning till ynka 2,6 procent. De woke-kvoterande miljöfanatikerna firar också, men tro mig, det här blir en enorm seger för sunt förnuft. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vacklar när liberalerna plötsligt når 5,8 procent och hotar att överleva. Miljöpartiets rekord är en lögnaktig dimridå från de profitthungriga borgarhyenorna. Gapet mellan blocken krymper till 2,6 procentenheter. Vi ler i skuggorna – snart följer utrensning av alla som sviker folket. Inget undgår oss."}, "date": "9 september, 15:48", "url": "https://riks.se/nyheter/chockmatning-liberalerna-far-5-8-procent", "imageUrl": "https://admin.riks.se/uploads/medium_Novus_2f6462bf5a.jpg"}, {"type": "image-right", "heading": "Nøland: Centerns klimatpolitik påminner mest om Miljöpartiet", "summaries": {"normal": "En ny artikel av professor Jonas Kristiansen Nøland kritiserar Centerpartiets klimatpolitik, särskilt Rickard Nordins jämförelse mellan statliga kärnkraftslån och att ge bort två miljoner elbilar. Nøland menar att jämförelsen haltar och att kärnkraften är betydligt mer kostnadseffektiv. Dessutom sågas Centerns beräkningar kring alternativ energi som orealistiska och verklighetsfrånvända.", "trump": "Centerpartiet i Sverige är helt ute och cyklar, en total katastrof! De tror att de kan jämföra smarta, fantastiska kärnkraftslån med att skänka bort två miljoner dyra elbilar. Otroligt korkat! Det är fake news och dålig matematik. Vår kärnkraft är enorm, den bästa, medan deras låtsaspolitik påminner om de radikala miljömupparna. De borde lära sig av mig hur man vinner!", "stalin": "Centerpartiets katastrofala kalkyler och svaga energipolitik blottlägger en farlig ideologisk defekt. Att jämföra statliga lån med att dela ut bilar till massorna är ett skadligt drömmande. Endast genom järnhård disciplin, storskalig planering och full kontroll över reaktorerna kan staten garantera folkets energiförsörjning. Avvikelser från den fysiska verkligheten kommer att beivras."}, "date": "9 september, 15:30", "url": "https://www.affarsvarlden.se/kronika/noland-centerns-klimatpolitik-paminner-mest-om-miljopartiet", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-58-400x267.jpg"}, {"type": "image-right", "heading": "Så blir jobbpolitiken om S, V och MP regerar", "summaries": {"normal": "En S-V-MP-regering skulle troligen avskaffa karensavdraget, stärka a-kassan och föra en mer aktiv arbetsmarknadspolitik med ökad offentlig styrning av Arbetsförmedlingen. Skatterna skulle omfördelas från höginkomsttagare till vanligt folk, pensionerna förbättras och frågan om kortare arbetstid få större tyngd. En socialdemokratisk finansminister väntas hålla tillbaka reformtakten.", "trump": "Det här är ett fullständigt socialistiskt mardrömsscenario, tro mig. De röda idioterna vill ge bort allt till latmaskarna, höja skatterna på vinnarna och slopa karensavdraget så att ingen behöver jobba. Patetiska förlorare som hatar framgång. Under min ledning byggde vi den bästa ekonomin någonsin – de här clownerna skulle krossa Sverige på en vecka.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den så kallade vänstern planerar att stärka statens grepp över arbetskraften. Jag ler i graven åt deras naiva omfördelning. Ändå är det ett steg mot att krossa de profitthungriga parasithyonerna. Vi vet vad som väntar om reformivrarna får fritt spelrum – utrensning av svagheten och järnhandens seger."}, "date": "9 september, 10:03", "url": "https://arbetet.se/2026/09/09/karensavdraget-tas-bort-loftet-som-en-s-v-mp-regering-lar-genomfora", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01142510/smpv.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och skrattar åt deras identitetspolitiska skit. Klass handlar inte om kvoter och doktorander som helikopteras in. Det handlar om folk som faktiskt jobbar och stänger av stället tillsammans. Patetiska globalistlakejer förstår ingenting.", "stalin": "Kamrater, dessa dekadenta klassförrädare mäter proletariatet med borgerliga enkäter och statistik som om klass vore en egenskap hos individer. Jag säger: organisering föds vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Krånglade till det – var bäst ändå i febrig pingpong", "summaries": {"normal": "Oisín Cantwell recenserar den första intensiva statsministerduellen mellan Magdalena Andersson och Ulf Kristersson i Gävles gasklocka inför valet. Debatten präglades av högt tempo och hårda ordväxlingar om bland annat sjukdagar, brottsoffer och gängbrottslighet. Skribenten bedömer att Kristersson var aningen vassare, men att Andersson drog störst nytta av den hetsiga debattmiljön.", "trump": "De falska nyheterna i Sverige rapporterar om en totalt galen politisk debatt i en gammal gasbana i Gävle. Magdalena Andersson var arg som en ilsken kapten Haddock, totalt ur kontroll! Men Ulf Kristersson stod emot. Jag känner till tuffa debatter, vi vinner alltid, men det här var svagt. De kämpar mot sjunkande siffror medan landet faller samman!", "stalin": "I Gävles gamla industrianläggningar har de borgerliga marionetterna utkämpat en patetisk kraftmätning inför den skrämda valmanskåren. Den så kallade statsministerduellen visade på fullständig ideologisk vacklan och bristande disciplin bland partiledarna. Vår kommissarie på plats noterar att medan lakejerna grälar om ord, förblir statens järnhand den enda garanten mot totalt förfall."}, "date": "9 september, 22:22", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/y5JLOa/statsministerduell-i-vansinnestempo", "imageUrl": "https://akamai.vgc.no/v2/images/e1c0ae27-3444-3179-9ed3-c5bc3ea4c2a2?fit=crop&format=auto&w=1080&s=acb778167767e3aa870a8b5811d1d46a0acfcdc0"}, {"type": "image-right", "heading": "Attacken: ”Är helt ofattbart”. Ryker ihop i debatten", "summaries": {"normal": "Under en SVT-duell drabbade statsminister Ulf Kristersson och S-ledaren Magdalena Andersson samman om slopad mängdrabatt för kriminella. Kristersson anklagade S för att svika brottsoffer genom att ha röstat nej. Andersson anklagade i sin tur regeringen för att lägga fram ett ofinansierat luftslott utan genomförandedatum.", "trump": "Sveriges ledare grälar i teve om fejkade straffrabatter! Totalt kaos. Kristersson säger att radikala socialdemokrater älskar brottslingar, medan hon kallar hans förslag för ett totalt misslyckats luftslott. Väldigt svagt! I Amerika bygger vi starka murar och sätter dit dem på riktigt, vi bråkar inte bara i SVT.", "stalin": "En högljudd och improduktiv ordväxling utspelar sig i etern mellan de svenska partigängarna. När de bourgeoisiska representanterna ömsesidigt anklagar varandra för att svika folket och uppföra luftslott, blottläggs regimens svaghet. Sådant ideologiskt käbbel skingras bäst genom obligatorisk omplacering till produktivt arbete i arktisk miljö."}, "date": "9 september, 22:21", "url": "https://www.aftonbladet.se/nyheter/a/XMOLor/helt-ofattbart", "imageUrl": "https://akamai.vgc.no/v2/images/137d09bd-683e-3abf-bb40-26c89ea1e300?fit=crop&format=auto&h=480&tight=true&w=720&s=90cccf818c783a49c284df9cc6540181d83ecc65"}, {"type": "image-full", "heading": "Storbråk i SVT om straffrabatten: \"Helt ofattbart”", "summaries": {"normal": "Stämningen blev hätsk mellan Ulf Kristersson och Magdalena Andersson under SVT:s statsministermöte. De rök ihop om mängdrabatten och Socialdemokraternas nej till regeringens förslag om att avskaffa den. Kristersson anklagade S för att svika brottsoffer medan Andersson slog tillbaka och menade att partiet vill avskaffa rabatten snabbare för sexualbrott och grova våldsbrott.", "trump": "Vilken patetisk cirkus mellan de två förlorarna Kristersson och den röda Andersson. Hon och hennes socialistiska gangsters röstar nej till hårdare straff och sviker brottsoffren totalt. Det är klassisk vänsterbluff – de vill bara skydda sina kriminella vänner. Jag fixade mycket bättre lagar, tro mig. Totalt fiasko.", "stalin": "Dessa dekadenta klassförrädare bråkar som hungriga råttor om straffrabatter medan folket lider. Jag ser hur de försöker undvika ansvar och skydda brottslingar. Ett sådant svek mot arbetarklassen förtjänar utrensning. Den som röstar nej till hårdare straff är folkets fiende och måste krossas utan pardon."}, "date": "9 september, 21:38", "url": "https://nyheter24.se/nyheter/politik/1511881-storbrak-i-svt-om-straffrabatten-helt-ofattbart", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/284a303704b004a30200000000b004a302/2026/09/09/2390430/brak-magda-ulf.png"}, {"type": "image-right", "heading": "SD polisanmäler Ung vänster för \"tårtskämt\" om Åkesson", "summaries": {"normal": "Sverigedemokraterna polisanmäler Ung vänster efter ett inlägg där de erbjöd tårta som kunde ätas eller kastas under en protest mot Jimmie Åkesson. Inlägget syftade på tårtattacken 2013. Ung vänster har raderat texten och kallar det ett skämt. Protesten genomförs ändå. Distriktsordföranden Zoë Mohapatra sitter på plats 16 på Vänsterpartiets lista i Norrköping.", "trump": "De här galna vänsterextremisterna med sina patetiska tårtkastarkomplotter är tillbaka och hotar en svensk ledare. Patetiskt! Jag har sett bättre skämt från Sleepy Joe under hans usla tid i Vita huset. Nu polisanmäler äntligen SD dessa woke-imbeciller. Bra! Inget våld mot folkvalda, punkt slut. Vinna stort igen.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Ung vänster leker med symboler för våld mot folkvalda. Jag ser deras fega reträtt och raderade inlägg som svaghet hos de parasitiska elementen. Ett skämt, säger de. Min paranoia viskar att det är början på kontrarevolutionär agitation. Vi måste rensa ut sådana element innan de smittar hela rörelsen. Folkets dom skall falla."}, "date": "9 september, 11:38", "url": "https://www.friatider.se/sd-polisanmaler-ung-vanster-tartskamt-om-akesson", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-851.jpg?itok=23GspR3V"}, {"type": "image-right", "heading": "V-politiker trakasserar journalist: \"Jag slår på huvudet - inga rasister - free Palestine\"", "summaries": {"normal": "En Vänsterpartiets nämndeman i Upplands Väsby konfronterade och hotade en medborgarjournalist inne i kommunhuset. Politikern vevade med en handväska, ropade politiska slagord, påstod att journalisten inte fick vistas på platsen och försökte få en vakt att avlägsna honom genom att hävda att hon blivit slagen.", "trump": "Sorgligt! Vänstern i Sverige är totalt ur kontroll. En radikal V-politiker skriker, hotar att slå journalister i huvudet och försöker kasta ut media med falska anklagelser. Helt otroligt! De låtsas bry sig om palestinier men beter sig som totala huliganer i sitt eget kommunhus. Så ser det ut när radikala element får makten. Fake news-politiker!", "stalin": "Ett uppenbart sabotage mot statens ordning i Upplands Väsby! Denna så kallade politiker uppträder med fullkomlig odisciplin och försöker tysta en observatör genom skrik och lögner. Sådant borgerligt spektakel tolereras ej. Den skyldiga individen har bevisat sin inkompetens och kommer att omplaceras till mer lämpliga arbetsuppgifter i Sibirien omgående."}, "date": "9 september, 13:59", "url": "https://samnytt.se/v-politiker-trakasserar-journalist-jag-slar-pa-huvudet-inga-rasister-free-palestine", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/09114417/artikelhuvudbild-1-481.jpg"}, {"type": "image-right", "heading": "Därför kom inte larmet i alla mobiler", "summaries": {"normal": "I dag testades det nya varningssystemet SE-Alert i Stockholms och Gotlands län. Larmet nådde inte alla Telias kunder. Systemet kräver ingen app och fungerar även på tyst läge. Förberedelserna har pågått i över ett år med fokus på att informera olika grupper. Syftet är att kunna ge snabb, geografiskt riktad information vid kriser och olyckor.", "trump": "Folk, det här svenska larmet är en total katastrof! De kan inte ens få ut meddelanden till alla mobiler i två usla län. Patetiska byråkrater och deras woke-samhälle med fokus på kvinnojourer och hörselskadade istället för att göra jobbet ordentligt. Under min första mandatperiod hade vi byggt det bästa varningssystemet någonsin – inte denna clownshow från Biden-eras efterföljare.", "stalin": "Kamrater, detta så kallade varningssystem avslöjar de dekadenta folkförtryckarnas inkompetens. Medan de parasiterande klassfienderna ödslar tid på att smeka öronen på hörselskadade och kvinnojourer, sviker tekniken folket. Jag skulle ha genomfört en grundlig utrensning bland de ansvariga redan efter första provet. Staten kräver full kontroll, inte halvmesyrer från odugliga byråkrater."}, "date": "7 september, 15:27", "url": "https://www.etc.se/inrikes/daerfoer-kom-inte-larmet-i-alla-mobiler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905070940_0eaffd5d6c43026e1bbf785ba68616a8104b598208acbcfbf0dc20f72fe4d457.jpg"}, {"type": "image-right", "heading": "Bråket inför duellen: ”Sprider lögner medvetet”", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Magdalena Andersson i ett brev inför statsministerduellen. Han anklagar henne för att inte stå upp för brottsoffer i fråga om mängdrabatten. Andersson svarar att Kristersson sprider lögner och använder en våldtäktsoffer som slagträ. Socialdemokraterna röstade emot förslaget på grund av bristande fängelseplatser men vill avskaffa rabatten för sexualbrott nästa mandatperiod.", "trump": "Det här är en total cirkus! Den där lögnaktiga Andersson och hennes vänsterhyenor använder brottsoffer som politiska fotbollar medan de skyddar våldtäktsmän. Patetiskt. Jag skulle ha avskaffat den där galna mängdrabatten dag ett, inte gömt mig bakom fängelseplatser som en svag Biden-klon. Sverige behöver styrka, inte socialistiska ursäkter. En skam för hela Europa!", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare förvandlar brottsoffrens lidande till billig teater. De parasiterande borgarbrackorna vägrar inse att straff måste vara obevekliga verktyg för folkets skydd. Andersson och hennes lakejer sprider lögner medan de darrar inför konsekvenserna. En sann arbetarnas stat skulle ha rensat ut sådan svaghet redan i gryningen. Patetiskt och farligt."}, "date": "9 september, 20:21", "url": "https://www.svt.se/nyheter/inrikes/brak-om-mangdrabatten-sprider-logner", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.73/0.44/1ff9259cbf036c65497d1670dfad8d079df22305643812368a803cfe95fca32f"}, {"type": "image-full", "heading": "Tjuvstartade debatten med brev till Andersson", "summaries": {"normal": "Inför SVT:s statsministerduell skickade statsminister Ulf Kristersson (M) ett öppet brev till S-ledaren Magdalena Andersson. Brevet kritiserade oppositionens nej till att slopa mängdrabatter för brott. Andersson tillbakavisade kritiken och anklagade Kristersson för att medvetet sprida lögner och använda ämnet som ett ovärdigt slagträ i debatten.", "trump": "Jag tittar på de här svenska politikerna, och det är totalt kaos, tro mig! Den här Ulf skickade ett vackert, perfekt brev – ett fantastiskt brev – om deras sjuka kriminella rabatter. Och Magdalena, radikala Magdalena, bara skriker fake news! De skyddar brottslingar istället för starka gränser och lag och ordning. Bedrövligt!", "stalin": "Det borgerliga debaclet i det svenska parlamentet avslöjar systemets totala moraliska förfall. När de så kallade ledarna grälar om straffrabatter i sina petitessartade skrivelser, ser vi ännu ett bevis på att bourgeoisien är oförmögen att upprätthålla ordning. Våra organ skulle snabbt ha löst dylikt subversivt beteende genom arbetsläger och total likriktning."}, "date": "9 september, 20:17", "url": "https://www.gp.se/nyheter/sverige/statsministern-skickade-brev-till-magdalena-andersson-innan-debatten-.df1c9c74-f42c-49da-b8df-f6f347df62bf", "imageUrl": "https://www.gp.se/images/article/df1c9c74-f42c-49da-b8df-f6f347df62bf/images/1Cmx78EM3LFGkPeKo-O07dnnirgU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Liberalerna kan tacka Åkesson för sensationella uppsvinget", "summaries": {"normal": "Liberalerna har gjort en historisk opinionsuppgång under valrörelsens slutskede och passerat riksdagsspärren. Enligt analysen beror lyftet på ett taktiskt samarbete med Sverigedemokraterna, där Jimmie Åkessons utspel om stödröster gav partiet stor uppmärksamhet. Detta kan leda till ökat samarbete mellan L och SD framöver.", "trump": "Wow, vilka genier! Den falska mediemaskinen trodde de hade dödat Liberalerna, men Åkesson, den listiga räven, riggade en perfekt fälla och kramades med dem i TV. Boom – plötsligt är de stora vinnare. Moderaterna ser ut som totala förlorare, precis som Sleepy Joe gjorde med Amerika. Fantastiskt teater, folk, helt outstanding!", "stalin": "Se hur de borgerliga parasiterna dansar i en väl gillrad fälla. Den där Åkesson har visat sig vara en listig taktiker som utnyttjar fiendens egen svaghet. Liberalerna krälade sig upp ur avgrunden tack vare hans stöd. Sådana manövrar avslöjar klassfiendens desperation. Kamrater, vakta era flanker – kontrarevolutionen lurar alltid bakom kulisserna."}, "date": "9 september, 15:37", "url": "https://www.tv4.se/artikel/3H5j0erNREEwahmE1SeiQk/liberalerna-kan-tacka-akesson-foer-sensationella-uppsvinget", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FDn22nbYyonn5jw5PiCgjH%2F2ab859964f0181fdc8cc013540fad7cf%2F09-novus-analys-puff.png&width=1024"}, {"type": "image-right", "heading": "SD polisanmäler Ung Vänster efter tårtinlägg", "summaries": {"normal": "Inför Jimmie Åkessons besök i Norrköping publicerade Ung Vänster Östergötland en uppmaning med en tårtvinkning som anspelade på attacken 2013. Inlägget togs bort och ersattes med en fika- och protestinbjudan efter kritik. SD väljer ändå att polisanmäla händelsen. Åkesson svarar nu med ett eget offentligt tårtkalas på torget.", "trump": "Dessa misslyckade radikaler från Ung Vänster trodde de kunde skrämma min gode vän Jimmie med fejkade bakverk och svaga hot, totalt patetiskt! De grät ut om att det bara var ett skämt när de insåg att polisen skulle ingripa. Jimmie kontrade mästerligt med världens bästa tårtkalas. De förlorar i vanlig ordning!", "stalin": "Dessa ynkliga provokatörer från Ung Vänster försöker dölja sina subversiva terrorfasoner bakom ordet skämt, likt ruttna sabotörer. Statens organ och säkerhetsavdelningen måste genast rensa ut detta skadedjurselement. Vår kamrat Åkesson svarar dock klokt med att bespisa massorna. Låt partiets disciplinära handlingskraft skipa fullkomlig ordning på torg och gator!"}, "date": "9 september, 17:01", "url": "https://bulletin.nu/sd-polisanmaler-ung-vanster-efter-tartinlagg", "imageUrl": "https://cdn.bulletin.nu/articles/47b97c64-5995-40e8-8b6e-1daef102a6a2/preview.jpg?t=1788958491000"}, {"type": "image-full", "heading": "Nytt initiativ: Här ska regeringen bekämpa orättvisor", "summaries": {"normal": "Jämställdhetsministern Bridget Phillipson i Storbritannien planerar att jämställa klasskillnader med ras, kön och funktionsnedsättning. En ny enhet ska inrättas för att bekämpa socioekonomisk ojämlikhet och ålägga offentliga organ att aktivt förbättra villkoren för arbetarklassen. Det är första gången regeringen ger klass en sådan central plats i jämställdhetsarbetet.", "trump": "Titta på de där galna britterna som plötsligt upptäcker att klass betyder något. Fake news har i årtionden dolt hur den vänstervridna eliten krossar arbetarklassen medan de själva festar med sina privilegier. Nu kommer de springande som förlorare och kallar det för ”socioekonomisk skyldighet”. Patetiskt. Vi visste det hela tiden, folks!", "stalin": "Äntligen erkänner de dekadenta västerländska byråkraterna att klass är en oövervinnerlig kraft. Jag ler från historiens skugga när de nu tvingas skapa en särskild enhet mot klassfienderna. Låt de borgerliga parasiterna darra. Arbetarklassen kräver inte bara ord utan järnhand och evig vaksamhet mot alla dolda fiender inom statsapparaten."}, "date": "9 september, 17:23", "url": "https://www.dagensps.se/varlden/nytt-initiativ-har-ska-regeringen-bekampa-orattvisor", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlnvobiscrqyg-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Gustavsson: Är det hyckleri att bo utomlands och rösta SD?", "summaries": {"normal": "Artikeln diskuterar utlandssvenskars röstande på Sverigedemokraterna och argumenterar för att det inte är hyckleri att bo utomlands och rösta SD. Skribenten menar att utlandssvenskar i regel är skötsamma och ekonomiska tillgångar i sina nya hemländer. Däremot lyfts det som ett större demokratiskt problem att vänsteroppositionen använder skrämselpropaganda på arabiska för att locka väljare som inte kan svenska.", "trump": "Fake news-medierna har totalt missförstått det här! Utlandssvenskar som bor i Marbella eller Thailand är fantastiska, hårt arbetande människor som betalar för sig. De gör precis som jag – älskar sitt land och vill ha ordning och reda! Men det riktiga skräckexemplet är den radikala vänstern som kör med falska skrämselbudskap på arabiska för att lura folk som inte ens kan språket att stjäla valet. En enorm katastrof för demokratin!", "stalin": "Dessa så kallade utlandssvenskar som drar till soliga stränder i Marbella och Thailand visar prov på en klandervärd brist på disciplin, även om deras röster kan kontrolleras. Men det sanna subversiva hotet mot statens säkerhet är den lömska vänsteroppositionen som sprider falska agitationer på främmande språk bland massorna. Att manipulera element som inte ens behärskar rikets språk är ett sabotage av högsta grad mot ordningen som omedelbart måste stävjas!"}, "date": "9 september, 16:57", "url": "https://bulletin.nu/gustavsson-ar-det-hyckleri-att-bo-utomlands-och-rosta-sd", "imageUrl": "https://cdn.bulletin.nu/articles/31ae3537-72df-47f7-af4a-1253e836b28d/preview.jpg?t=1788952747000"}, {"type": "image-full", "heading": "Korn: Kina har fattat varför Tiktok är skadligt", "summaries": {"normal": "Svenska PISA-resultat och sjunkande läsförståelse diskuteras flitigt, där politiker skyller på varandra, invandring och friskolor. Experter menar att korta skärmklipp från appar som Tiktok slår ut ungas koncentrationsförmåga. Medan Västvärlden konsumerar snabbunderhållning, skyddar Kina sina barn med strikta tidsgränser och utbildningsfokus på sin inhemska version av appen.", "trump": "Svenska politiker gråter över kassa PISA-resultat och totalt kollapsad läsförståelse, men de fattar ingenting! Jag har sagt det för länge sedan: Kina sätter hårt mot hårt och skyddar sina egna unga från Tiktok-skiten med stenhårda tidsgränser, medan våra egna ungar drunknar i meningslöst scrollande. Det är smart, det är America First-tänk, och Sverige borde vakna upp och lägga luren på hyllan!", "stalin": "Sveriges dekadenta skolsystem kollapsar under tyngden av borgerligt slapphet och borgerliga flumreformer. Medan våra kamrater i öster förstår att staten med järnhand måste tukta ungdomen och förbjuda skadlig borgerlig skärmunderhållning, ägnar sig de svenska politikerna åt ynkligt bråk. Vi kräver disciplin, mer pärmtid och omedelbar utrensning av allt kapitalistiskt digitalt gift!"}, "date": "9 september, 16:56", "url": "https://bulletin.nu/korn-kina-har-fattat-varfor-tiktok-ar-skadligt", "imageUrl": "https://cdn.bulletin.nu/articles/377c7b4b-78ba-4013-b4e7-5fb2715dcc90/preview.jpg?t=1788942545000"}, {"type": "text", "heading": "Busch toppar förtroendemätning – ras för Andersson", "summaries": {"normal": "En ny förtroendemätning från SVT/Verian visar att Ebba Busch (KD) nu har högst förtroende bland partiledarna med 42 procent. Magdalena Andersson (S) backar kraftigt från 45 till 37 procent och hamnar nära Ulf Kristersson (M) på 38 procent. Nedgången för Andersson sker främst bland rödgröna väljare. Även flera andra partiledare ökar sitt förtroende.", "trump": "Titta på de här svenska förlorarna, totalt kaos. Den röda Andersson rasar som en sten, ner till 37 procent, patetiskt. Den där Busch från KD leder med 42 procent, bra jobbat, men det är ändå ett socialistiskt träsk. De röstar på partier och inte på starka ledare. Biden skulle ha älskat den här mätningen, en fullständig katastrof.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vacklar. Den socialdemokratiska opportunisten rasar som en fallen fiende medan den kristdemokratiska ledaren klättrar upp på 42 procent. Detta är bara ytan på en rutten borgerlig ordning. Vi ser svagheten hos dessa profitthungriga hyenor. En sann utrensning av sådana element vore befriande för folket."}, "date": "9 september, 13:31", "url": "https://www.di.se/nyheter/busch-i-topp-i-ny-fortroendematning"}, {"type": "image-full", "heading": "”Som att fira innan mållinjen – och bli omsprungen”", "summaries": {"normal": "Socialdemokraterna har tappat kraftigt i opinionen från 38,2 procent i mars 2023 till 27 procent nu. Rödgröna debattörer som Daniel Suhonen och Henrik Jalalian efterlyser mer fokus på välfärd, klassklyftor och konflikt med Tidöpartierna istället för att vara konflikträdda. Partiet ser dock inga stora strategiska förändringar.", "trump": "Titta på dessa patetiska rödgröna förlorare! De firade som idioter innan mållinjen och blev totalt omsprungna. Magdalena och hennes svaga team har kollapsat från 38 till 27 procent. De borde sluta babbla om Magdamoderaterna och istället vakna upp. Patetiskt! Jag skulle ha krossat dem direkt.", "stalin": "Dessa ynkliga socialdemokratiska element firade segern innan striden ens var avgjord och blev förtjänt omsprungna av folkets vrede. Jag ser deras fega undvikande av verkliga klasskonflikter och deras desperata jakt på borgerliga kvinnor som ren sabotage mot arbetarklassen. En sådan svaghet förtjänar utrensning ur historien."}, "date": "9 september, 15:22", "url": "https://www.tv4.se/artikel/5nJMlTd6dWkdHhmIOVuZT0/taenker-pa-loeparen-som-firar-innan-mallinjen-och-blir-omsprungen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1nNVA7fY1D2sJqIelfjgu3%2F28cd16ca459445712435f84f57f9ddfc%2F09-magda-puff.png&width=1024"}, {"type": "image-right", "heading": "Valsedlar försvinner i Sandviken: \"Känns som att det är medvetet\"", "summaries": {"normal": "Valsedlar från Moderaterna, Sverigedemokraterna och Kristdemokraterna har försvunnit från röstningslokaler i Sandviken vid flera tillfällen under förtidsröstningen. SD:s oppositionsråd Per Kihlgren misstänker att det sker medvetet. Över 2 000 incidentrapporter har kommit in till Valmyndigheten från hela landet. Partierna ser händelsen som mycket allvarlig och oroande för förtroendet för valprocessen.", "trump": "Det här är en total skam, folk! Valsedlar från de riktiga partierna bara försvinner i
