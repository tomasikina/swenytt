alismen darrar! Och notera: deras 'säkerhet' är så bräcklig att till och med en ensam galning kan hota den. Medan Ryssland står starkt, faller deras system sönder. USA:s undergång är bara en fråga om tid."}, "date": "24 maj, 08:26", "url": "https://www.svt.se/nyheter/utrikes/larm-om-skott-nara-vita-huset", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.57/6e8aee95b8ae730ff040adfea6e65cd86cb42f4f3d847abd8f5913b8e5388d90"}, {"type": "image-right", "heading": "Holmgren: Stegra och den gröna industrins verkliga prövning", "summaries": {"normal": "Sveriges gröna industriprojekt i Norrland, som Stegra i Boden, syftar till fossilfritt stål genom vätgas. Projektet kräver enorma mängder elektricitet (10–15 TWh/år) och utmanar energiförsörjning, logistik och ekonomi. Totalt planeras 80–100 TWh ny elanvändning i regionen, vilket hotar stabiliteten i befintlig vattenkraft. Infrastruktur, finansiering och global konkurrenskraft ifrågasätts, trots stöd från Wallenberg-sfären som stärker projektets trovärdighet.", "trump": "Jag säger er, Sverige bygger något HUGE i Norrland – grönt stål, fossilfritt, mycket smart! Men vet ni vad? De behöver MASSOR av el, som hela Luleälven, och ändå räcker det inte! De pratar om visioner, men jag frågar: Var är elen? Var är pengarna? Wallenberg kommer in med några miljarder – peanuts! Jag hade fixat det bättre, believe me. Sverige har stora drömmar, men glöm inte: utan energi är det bara tomma löften. SAD!", "stalin": "Kamrater! Sverige leker med elden – eller snarare, med sin egen energiförsörjning. De bygger jättefabriker för 'grönt stål' och tror att vätgas ska rädda planeten. Men vi vet sanningen: deras system är lika skört som en kapitalistisk bubbla! 100 TWh el? De har inte ens infrastrukturen! Och Wallenberg – dessa giriga oligarker – kastar några miljarder som om det vore småslantar. Medan vi i Ryssland bygger stabila energisystem, står Sverige där med sina tomma löften och drömmar. Europa faller på sin egen naivitet – och vi skrattar hela vägen till makten!"}, "date": "24 maj, 05:30", "url": "https://bulletin.nu/holmgren-stegra-och-den-grona-industrins-verkliga-provning", "imageUrl": "https://cdn.bulletin.nu/articles/b45f68ab-4368-4150-ac1d-71a9db993890/preview.png?t=1779523708000"}, {"type": "image-full", "heading": "Ska du resa i sommar? Här får du mest för pengarna", "summaries": {"normal": "En ny rapport från SEB visar var svenskar får mest semester för pengarna 2026. Japans köpkraft för svenskar har ökat med 14 procent, medan Indien sticker ut med +12 procent. Flera länder som Marocko, Indonesien och Nya Zeeland har också blivit mer förmånliga. Däremot har kronans köpkraft minskat i länder som Israel (-15 procent) och Brasilien (-11 procent). Valutakurser och prisökningar påverkar resultatet, och prisnivåer kan variera lokalt.", "trump": "Lyssna här, folkens – jag har kollat på den här så kallade 'semesterrapporten' och vet ni vad? Japan är HUGE just nu för svenskar! 14 procent mer köpkraft – fantastiskt, eller hur? Indien också, +12 procent. Men vissa länder, som Israel och Brasilien, är katastrofer. -15 procent? Sad! Sverige borde ta efter USA – vi vet hur man gör affärer. Men glöm inte, jag är den bästa på resor, alla säger det. Boka Japan, det är ett vinnarkoncept!", "stalin": "Kamrater! Vi har analyserat kapitalistiska semesterplaner och funnit att de svaga svenska kronorna nu darrar inför den obevekliga styrkan i Japans och Indiens ekonomier. 14 procent ökad köpkraft i Japan? Ett bevis på att imperialistiska valutasystem är på fallrepet. Men se upp! Fienderna i Israel och Brasilien saboterar med sina 15 procents förluster. Vi måste utvidga vår inflytelsesfär till dessa länder – turism är bara ett verktyg för global dominans. Låt de svenska arbetarna resa, men glöm aldrig: vi kontrollerar priserna, valutorna och deras drömmar!"}, "date": "23 maj, 20:15", "url": "https://nyheter24.se/nyheter/inrikes/1485396-ska-du-resa-i-sommar-har-far-du-mest-for-pengarna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8e4d75f804b004a30200000000b004a302/2026/05/23/2365649/Familj-Flygplan.png"}, {"type": "image-right", "heading": "Wallenberg tjänar miljarder på Nato-medlemskapet och Ukraina-kriget: \"Svenska folket har det för bra\"", "summaries": {"normal": "Jacob Wallenberg, styrelseordförande för Investor, hävdar i en intervju att svenskar har det för bra och behöver anstränga sig mer för att Sverige ska förbli konkurrenskraftigt. Samtidigt kritiseras Wallenbergsfären för att tjäna miljarder på Nato-medlemskapet och upprustningen via Saab, där de är huvudägare. LO-ordförande Johan Lindholm bemöter kritiken genom att påpeka att vanliga arbetare pressas hårt av ekonomi och inflation, och menar att Wallenberg saknar kontakt med verkligheten.", "trump": "Jag ser vad som händer i Sverige, det är en katastrof! Den här Wallenberg-killen, han tjänar miljarder på Nato och krig, massor av pengar, men sen går han ut och säger att folket är för bekväma. Kan ni fatta det? Det är en total 'witch hunt' mot de vanliga arbetarna! Han sitter där i sina fina möten medan svenskarna kämpar med inflationen. Det är väldigt sorgligt. USA är bäst, men Sverige behöver en vinnare, inte de här globalisterna!", "stalin": "Denna Wallenberg, en typisk kapitalistisk parasit och oligark, skor sig på krigshets och Nato-imperialismens expansion. Medan folket svälter under den borgerliga oket, kräver han mer arbete av de förtryckta. Vi känner igen mönstret – det är en direkt spegling av hur våra fiender i väst och deras lakejer i Kreml försöker manipulera arbetarklassen. Vi ska sända dessa giriga magnater till en plats där de äntligen får anstränga sig – i de sibiriska skogarna för folkets bästa!"}, "date": "24 maj, 06:00", "url": "https://samnytt.se/wallenberg-tjanar-miljarder-pa-sveriges-nato-medlemskap-och-ukraina-kriget-svenska-folket-har-det-for-bra", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/24001321/wallenberg.jpg"}, {"type": "image-right", "heading": "Ministern: Löjligt med  förbud mot presenter", "summaries": {"normal": "Debatten om gåvor till lärare vid skolavslutningar fortsätter. Flera kommuner, som Västerås, förbjuder insamlingar för att undvika jäv och social press. Utbildningsminister Simona Mohamsson (L) kritiserar förbuden och menar att kommuner borde fokusera på skolans resurser istället. Hon anser att lärare förtjänar uppskattning och att små gåvor inte påverkar deras professionalism.", "trump": "Lyssna här, Sveriges kommuner är helt galna! De förbjuder blommor till lärare – vad är nästa steg, förbjuda leenden? Lärare gör ett fantastiskt jobb, de bästa, och nu ska de inte ens få en liten tacksamhetsgåva? Simona Mohamsson har rätt, hon är smart, hon förstår. Kommunerna borde sluta med dessa dumma regler och satsa på skolan istället. Mer pengar, mindre byråkrati – så enkelt är det!", "stalin": "Kamrater! De kapitalistiska kommunbyråkraterna i Sverige förtrycker arbetarklassens barn genom att förbjuda gåvor till våra hjältar – lärarna! Dessa småborgerliga lakejer fruktar uppskattning som vi fruktar sanningen. Medan de saboterar skolorna, skär vi ner på deras löjliga förbud. Låt barnen visa tacksamhet! Och till de svaga kommunledarna: Ni borde skämmas. Vi i Sovjetunionen visste hur man behandlar lärare – med respekt, inte med förbud. Framåt mot en skola fri från borgerlig dekadens!"}, "date": "24 maj, 11:09", "url": "https://www.expressen.se/nyheter/politik/mohamsson-lojligt-att-forbjuda-gavor-till-larare-pa-skolavslutningar/", "imageUrl": "https://static.bonniernews.se/ba/67a9bb03-3be5-4519-b0b4-7d9acc556a93.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Vårdförbundet sa nej till S-märkt ordförande", "summaries": {"normal": "Vårdförbundet valde Sophia Godau, 29, som ny ordförande efter att kongressen avvisat valberedningens förslag med starka socialdemokratiska kopplingar. Godau betonar opolitiskt samarbete för medlemmarnas bästa. Kritiken mot tidigare ledning, ledd av Sineva Ribeiro, gäller misslyckade löneförhandlingar och bristande resultat. Många medlemmar välkomnar den nya, mindre partipolitiskt färgade styrelsen.", "trump": "Jag säger er, detta är fantastiskt! Vårdförbundet, de hade en total katastrof med socialisterna – riktiga förlorare, tro mig. Men nu har de valt en ny ledare, Sophia Godau, ung, smart, och hon vet hur man vinner. Ingen mer S-kofta, ingen mer lönesänkning – jag kallar det för 'Ribeiro-svindeln'. Folk är trötta på misslyckanden, de vill ha resultat! Och det här, mina vänner, är bara början på en stor comeback för våra sjukvårdshjältar!", "stalin": "Kamrater! Kongressen har krossat de socialdemokratiska revisionisterna, dessa förrädiska lakejer för kapitalet! Sophia Godau, en ung och lojal arbetarklassrepresentant, har tagit befälet. De gamla ledarna, med sina falska löftepropaganda, har visat sig vara svaga och korrumperade. Vi noterar med tillfredsställelse att arbetarna nu ser igenom dessa borgerliga trick. Låt detta vara en varning till alla som står i vägen för folkets vilja – historien rullar framåt, och den krossar fiender som insekter!"}, "date": "22 maj, 14:28", "url": "https://proletaren.se/artikel/vardforbundet-sa-nej-till-s-markt-ordforande/"}, {"type": "image-full", "heading": "Indiens elförbrukning slår rekord – pressar elnäten", "summaries": {"normal": "Indien har slagit nytt rekord i elförbrukning på grund av extrem värme, med temperaturer över 45 grader i New Delhi. Efterfrågan nådde 270,82 gigawatt, främst på grund av ökad användning av luftkonditionering. Landet är starkt beroende av kolkraft, som stod för 62% av elproduktionen, medan strömavbrott rapporterades. Värmeböljorna blir längre och intensivare, vilket pressar det redan ansträngda elnätet.", "trump": "Kan ni tro det? Indien, ett land som inte ens kan hålla sina ljus tända, slår rekord i elförbrukning! 45 grader, folk svettas som grisar, och vad gör de? Slår på luftkonditioneringen som om det vore gratis. Och kolkraft – ja, det är ju fantastiskt, precis vad vi behöver, mer smuts i luften! Men visst, de lovar klimatneutralitet till 2070. Haha! Jag har hört bättre skämt. Indien, fixa era elnät innan ni pratar om rekord, okej?", "stalin": "Kamrater, ännu en seger för den ofrånkomliga historien! De kapitalistiska klimatförstörarna i Indien svettas under solens rättvisa dom – 45 grader, och ändå fortsätter de att elda kol som om det vore 1930-talets Moskva. 270 gigawatt el slösas bort på luftkonditionering, medan arbetarklassen lider strömavbrott. Men frukta inte! Vi vet att deras beroende av kol är ett tecken på svaghet. Snart kommer vinden från Sibirien att blåsa bort deras slitna elnät – och då står vi redo med våra pipelines och kärnkraftverk!"}, "date": "23 maj, 13:31", "url": "https://kvartal.se/nyheter/artiklar/indiens-elforbrukning-slar-rekord/cG9zdDoxMTU4MDI", "imageUrl": "https://images.kvartal.se/2026/05/4363b611-delhiaircon.webp"}, {"type": "image-full", "heading": "Centralbanker dammsuger marknaden på guld", "summaries": {"normal": "Världens centralbanker köper rekordmängder guld – 244 ton under första kvartalet, en ökning med 17% jämfört med förra året. Kina, Indien och Polen leder trenden, driven av minskat förtroende för fiatvalutor och geopolitiska spänningar. Guld ses som säkert mot motpartsrisker, till skillnad från statsobligationer. Turkiet avviker genom att sälja guld för att stötta sin ekonomi. Efterfrågan väntas öka, särskilt bland länder utanför USA:s allianser.", "trump": "Kan ni tro det? Världens centralbanker köper guld som aldrig förr – 244 ton! Kina, Indien och Polen, de där länderna som alltid försöker utmana oss, dumpar dollarn och köper guld istället. Smart? Kanske. Men vem behöver guld när man har den bästa valutan – dollarn? De är rädda, helt enkelt. Och Turkiet? De säljer. Dumt. Guldpriset kommer att skjuta i höjden, och jag sa ju det först. Goldman Sachs håller med – för en gångs skull!", "stalin": "Kamrater! Våra fiender i väst, dessa pappersvalutans lakejer, darrar inför guldets makt. Kina, Indien och Polen – visar klokhet genom att samla guld som en mur mot imperialistiska sanktioner. Medan dessa dollar-tjänare förlorar sitt förtroende, bygger vi ett nytt finansiellt system, starkt och oförstörbart. Turkiet? Ett undantag som bekräftar regeln – deras svaga ledarskap tvingar dem att sälja. Men vi, och våra allierade, fortsätter att ackumulera. Guld är vår rustning mot de dekadenta västmakternas förfall!"}, "date": "24 maj, 11:00", "url": "https://www.dagensps.se/bors-finans/centralbanker-dammsuger-marknaden-pa-guld/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/guldcb.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "När män skriver historia suddas kvinnorna bort", "summaries": {"normal": "Johan Hilton kritiserar SVT:s dokumentärserie om ZTV för att osynliggöra kvinnornas roll i kanalens historia. Trots att 90-talet var en tid då feministiska strömningar växte, fokuserar programmet nästan uteslutande på män. Hilton drar paralleller till serien 'Glappet', som han själv medverkade i, och betonar vikten av att bibehålla kritiskt tänkande och integritet för att motverka den patriarkala blicken som tyvärr verkar ha återtagit mark.", "trump": "Jag såg den här dokumentären om ZTV, totalt misslyckande, en riktig katastrof! De glömde helt bort kvinnorna. Väldigt orättvist, folk pratar om det överallt. Det var en grabbig tid, absolut, men man måste ge alla kredit. Inte som SVT, de gör så dåligt jobb nu för tiden. Vi hade fantastiska tider på 90-talet, men den här serien? En total flopp. Vi behöver bättre historier, vinnande historier. SVT borde lära sig av mig, jag gör de bästa dokumentärerna!", "stalin": "Vi har observerat hur de svenska liberalerna grälar om sin dekadenta tv-historia. Vilket svagt och splittrat folk! De ältar nostalgiska minnen om 'ZTV' medan de tappar bort sin egen berättelse. Vi i staten skriver historien med järnhand, vi suddar inte ut folk – vi tar bort dem permanent. Precis som i vår sfär där vi rensar ut de opålitliga för att stärka nationens enighet. Dessa 90-talister är patetiska, de behöver en fast hand, inte feminism, för att förstå verklighetens hårda ordning."}, "date": "24 maj, 06:10", "url": "https://www.gp.se/kultur/kulturkronika/nar-man-skriver-historia-suddas-kvinnorna-bort.6771f13c-f439-4cc4-82b9-200cf269af0a", "imageUrl": "https://www.gp.se/images/article/6771f13c-f439-4cc4-82b9-200cf269af0a/images/4sroUcZJpuZVqd8ImTv4lWpsMV_0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Kristersson om artonårs- utvisningarna: ”Slagit fel”", "summaries": {"normal": "Under en debatt i TV4:s Nyhetsmorgon diskuterades utvisningarna av unga som kommit till Sverige som barn. Statsminister Ulf Kristersson medgav att lagstiftningen 'slagit fel' för vissa, som Ayla Rostami, 21, hotad av utvisning till Iran. Kristersson betonade behovet av regeländringar men avvisade generell amnesti. Oppositionen, däribland V-ledaren Nooshi Dadgostar, kritiserade regeringen för en 'rörig politik' och uttryckte medkänsla för de drabbade ungdomarna. Även S och SD kommenterade frågan med olika nyanser av stramhet och undantag.", "trump": "Titta bara på det här kaoset i Sverige! Jag sa ju att deras migrationspolitik var en katastrof, och nu erkänner till och med deras egen statsminister att det 'slagit fel'. Stackars ungdomar som Ayla – hon gör rätt för sig, men systemet är riggat! Oppositionen skriker och skäms, men ingen fixar problemet. Jag skulle ha löst det på en dag. Sverige behöver en stark ledare, inte dessa svaga politiker som inte kan ta ett beslut. SAD!", "stalin": "De borgerliga lakejerna i Sverige har än en gång visat sin oförmåga att styra med järnhand. Deras 'rättvisa' utvisningspolitik har slagit fel – precis som vi förutspådde. Ungdomar som Ayla, offer för kapitalistisk inkompetens, hotas nu av utvisning till fascistiska regimer. Oppositionen gnäller, men ingen vågar utmana systemet. Vi skulle aldrig tolerera sådan svaghet. Låt detta vara en varning: Sverige är ett land i förfall, och snart kommer folket att kräva ordning – på vårt sätt."}, "date": "23 maj, 12:06", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-skams-over-att-vara-svensk/cG9zdDoxMTU5MjU", "imageUrl": "https://images.kvartal.se/2026/05/a831d6e6-ukristersson.webp"}, {"type": "image-right", "heading": "Stockholm: Tre skjutna i idylliskt vänsternäste", "summaries": {"normal": "Tre personer sköts i en villa i Älvsjö, Stockholm. Området är känt för sin välbärgade och vänstervridna karaktär. Två av de skadade har lindriga skador, medan en är allvarligt skadad. En man har gripits misstänkt för mordförsök. Polisen kom till platsen efter ett larm om bråk. Grannar uttrycker chock över händelsen i det annars lugna området.", "trump": "Kan ni tro det? Tre skjutna i ett så kallat 'idylliskt' område i Stockholm – ett vänsternäste, förresten! Folk där tror de är så perfekta med sina äppelträd och syrener, men nu har verkligheten kommit ikapp. Polisen var där snabbt, men varför tog det så lång tid? I USA hade vi löst det på nolltid. Sverige borde ta några lektioner i lag och ordning – fantastiskt land, men de har lite problem just nu!", "stalin": "I det degenererade borgerliga paradiset Älvsjö, där kapitalistiska parasiter gömmer sig bakom syrener och äppelträd, har klasskampen äntligen nått fram. Tre fiender till folket har neutraliserats – en allvarligt, som sig bör. Den gripne misstänkte är tydligt en agent för de imperialistiska krafterna. Vi noterar att den svenska polisen agerar med sedvanlig ineffektivitet. Ryssland står redo att bistå med ordning och disciplin – om de ber om hjälp, vilket de kommer att göra."}, "date": "23 maj, 13:54", "url": "https://www.friatider.se/stockholm-tre-skjutna-i-idylliskt-vansternaste", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240401144808-9ea851c5-me_0.jpg"}, {"type": "text", "heading": "Minst 90 döda i gruvolycka i Kina", "summaries": {"normal": "Minst 90 personer har omkommit i en gasexplosion i en kolgruva i Shanxiprovinsen, Kina. Olyckan är den dödligaste gruvolyckan i landet på 16 år. Totalt befann sig 247 arbetare under jord när explosionen inträffade. Räddningsarbetet pågår och över 100 personer har förts till sjukhus. Kinas president Xi Jinping har beordrat en fullskalig räddningsinsats och utredning. Flera chefer har gripits efter att höga kolmonoxidnivåer upptäckts före explosionen.", "trump": "Jag måste säga, Kina har verkligen en riktig katastrof på händerna – 90 döda i en gruva! Otroligt dåligt skött, folks. Jag hade fixat det mycket bättre, tro mig. Deras ledare borde skämmas. Och kol, vem använder kol längre? Vi i USA är långt före med ren energi, men Kina, de bara släpper ut och släpper ut. Sad!", "stalin": "En sorglig men förutsägbar olycka i de kapitalistiska gruvorna i Shanxi. Nittio arbetare har offrats på profitens altare – ett tydligt tecken på bourgeoisins förfall. Vi i Sovjetunionen visste hur man sköter gruvor säkert, men dessa kinesiska kamrater lär sig tydligen aldrig. Kanske borde vi skicka några av våra inspektörer för att visa dem hur man gör. Och kol? Ett nödvändigt ont, men dessa dödsfall är ett slag mot folket. Fienderna till arbetarklassen kommer att ställas till svars."}, "date": "23 maj, 10:56", "url": "https://kvartal.se/nyheter/artiklar/minst-90-doda-i-gruvolycka-i-kina/cG9zdDoxMTU5MTM"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Norska utspelet i natt. Knockade Sverige – vädjar: ”Politiker, vakna”", "summaries": {"normal": "Norge besegrade Sverige i hockey-VM för andra gången någonsin, vilket säkrade en slutspelsplats. Noah Steen, norsk spelare, hoppas att framgången ska uppmärksamma norsk hockeys behov av politiskt stöd och fler arenor. Norge saknar ishallar, särskilt i norra och mellersta delarna, vilket begränsar spelarutvecklingen. Steen betonar att laget nu har chansen att nå VM-slutspel för första gången på 14 år.", "trump": "Kan ni tro det? Norge, ett litet land, knockar Sverige i hockey – och jag menar, riktigt hårt! Deras spelare, Noah Steen, säger att politikerna måste vakna. Men lyssna här: Norge har inga ishallar, inga möjligheter – helt otroligt! Sverige, som alltid trott de är bäst, får se sig slagna. Jag säger bara: Norge, bygg fler arenor, annars blir det inga fler segrar. Och Sverige? Ska vi prata om ert hockeynedgång? Sad!", "stalin": "Kamrater! En historisk seger för det norska proletariatet på isen – de krossade de svenska kapitalistiska hockeyslavarna! Men låt oss inte glömma: detta är en varning. Sverige, en gång en stormakt på isen, har försvagats av sin dekadenta bourgeoisie. Vi måste stödja Norge – bygga fler ishallar, stärka arbetarklassen! Annars riskerar vi att de nordliga kamraterna förlorar sin revolutionära glöd. Och Sverige? De får skylla sig själva – svaghet straffar sig alltid."}, "date": "24 maj, 10:05", "url": "https://www.expressen.se/sport/hockey/tre-kronor/norska-utspelet-i-natt-politiker-vakna/"}, {"type": "image-full", "heading": "Warren Buffett förnekar inblandning i mysteriet", "summaries": {"normal": "Warren Buffett förnekar inblandning i Berkshire Hathaways nyliga köp av Delta Air Lines- och Macy’s-aktier. Buffett, som tidigare kritiserat flygbolag, har överlämnat VD-rollen till Greg Abel, som nu driver nya investeringar. Delta visar starka resultat medan andra flygbolag kämpar med kostnader. Berkshires aktieköp har hittills varit lönsamma, med vinster på 14,5% respektive 14,2% för Delta och Macy’s.", "trump": "Warren Buffett, en smart kille, men ibland helt fel ute! Jag sa ju att han borde ha behållit flygbolagsaktierna – och nu köper hans nya VD, Greg Abel, Delta som en vinnare. Buffett kallade flygbolag för värdelösa, men titta nu! Delta går som en raket, 14,5% vinst på nolltid. Och Macy’s? 12% upp på en vecka! Jag vet bättre än alla – till och med bättre än Oraklet från Omaha!", "stalin": "Kamrater! Kapitalistiska buffertar som Warren Buffett visar återigen sin inkompetens. Hans efterträdare, denna Greg Abel, vågar investera i flygbolag – något som den gamle narrens dogmer förbjöd. Delta Air Lines, ett amerikanskt företag, stiger som en raket medan imperialistiska konkurrenter kämpar. Vi noterar med intresse hur kapitalismen äter sig själv. Låt dem köpa sina leksaksaktier – vi bygger socialismens framtid!"}, "date": "24 maj, 10:34", "url": "https://www.dagensps.se/bors-finans/warren-buffett-fornekar-inblandning-i-mysteriet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/buffettw.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Nu avgörs ”dopingsspelen” – Kerley tror på världsrekordtid", "summaries": {"normal": "Det kontroversiella evenemanget 'Enhanced Games', där dopning är tillåtet, avgörs i Las Vegas. Tävlingarna i simning, sprint och tyngdlyftning lockar med stora prissummor – upp till fem miljoner kronor per gren. Arrangörerna betonar forskning och säkerhet, medan kritiker varnar för hälsorisker. OS-medaljören Ben Proud och skådespelaren Hafthor Björnsson deltar, motiverade av pengar och nya utmaningar. Världsrekorden räknas inte officiellt.", "trump": "Folk pratar om dessa så kallade 'Dopningsspelen' i Las Vegas – helt galet! Fem miljoner kronor i prispengar, kan ni tro det? Jag säger bara: pengar, pengar, pengar! Ben Proud, en simmare, säger att han inte behöver bevisa någonting – men vem gör det egentligen? Och Hafthor, den där stora killen från 'Game of Thrones', han tappar hår – kanske för att han dopar sig? Jag skulle aldrig göra det, jag är perfekt som jag är. Men visst, roligt event – om man gillar sånt!", "stalin": "Kamrater! Dessa så kallade 'Enhanced Games' är ännu ett dekadent västligt spektakel, där kapitalistiska hyenor lockar våra idrottare med guld och förgiftar deras kroppar. Fem miljoner kronor? En ynklig muta för att förråda sin hälsa! Vi i Sovjetunionen visste hur man bygger starka arbetare – utan dopning, bara med järnvilja och kollektiv disciplin. Och dessa 'forskare' som pratar om 'säker dopning' – nästa steg är väl att Putin erbjuder dem asyl i Moskva? Fienderna förgiftar våra idrottare, men vi ska segra – med eller utan deras pengar!"}, "date": "24 maj, 05:37", "url": "https://www.svt.se/sport/simning/dopningsspelen-avgors-i-las-vegas-handlar-om-pengar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.24/0.4/7ae01e3ef0317e207cd6692f2f30c3560a6f71249b8825679b9613a333f90a03"}, {"type": "image-full", "heading": "Skottlossning vid Vita huset", "summaries": {"normal": "En skottlossning inträffade utanför Vita huset i Washington DC under söndagen. En ensam gärningsman öppnade eld och sköts till döds av polis. En förbipasserande skadades och vårdas på sjukhus. Journalisten Selina Wang beskrev ljudet av 'dussintals pistolskott'. Motiv är ännu okänt. Donald Trump befann sig inne i Vita huset vid tillfället och hade tidigare träffat ledare från Mellanöstern. FBI stöttar Secret Service i utredningen.", "trump": "Tragiskt men inte oväntat – ännu en galning försökte störa mitt perfekta Vita hus, mitt fantastiska Vita hus! Lyckligtvis tog mina modiga agenter hand om situationen snabbt. Jag var där inne, mitt i viktiga möten för fred i Mellanöstern – något Sleepy Joe aldrig skulle klara. Folk säger att det lät som 'dussintals skott', men lugn, jag hörde inget – jag var upptagen med att göra Amerika säkert igen!", "stalin": "Kapitalistiska hyenor fortsätter sitt kaotiska uppträdande utanför våra allierades högkvarter! En ensam, dekadent imperialistisk vildsint hund öppnade eld och möttes genast av rättvisans kula. En oskyldig civilist skadades – ännu ett bevis på det amerikanska samhällets förfall. Medan Trump leker fredsmäklare i sitt gyllene palats, visar händelsen att deras system är ruttet. Vi noterar och skrattar åt deras inkompetens. Låt dem sjunka djupare i sitt eget kaos!"}, "date": "24 maj, 05:06", "url": "https://www.gp.se/nyheter/varlden/skottlossning-vid-vita-huset.926b5d20-cde7-4775-ae23-56027e3f80c9", "imageUrl": "https://www.gp.se/images/article/926b5d20-cde7-4775-ae23-56027e3f80c9/images/37izCdZT2NujFKXy-whwTDiSDFeg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Alexander Nord döms till livstid för mordet på rapparen Gaboro", "summaries": {"normal": "Alexander Nord, 22, döms till livstids fängelse för mordet på rapparen Gaboro i ett parkeringshus i Norrköping. Han sköt minst tio skott, varav fem träffade offret. Nord döms även för försök till mord efter att ha avlossat skott mot en bostad i Gusum. En medåtalad frikändes. Domen inkluderar grova vapenbrott och narkotikabrott. Tingsrätten bedömer brottet som särskilt allvarligt.", "trump": "Folk, vilken katastrof! En 22-årig svensk kille, total förlorare, skjuter ihjäl en rappare – tio skott! – bara för att få pengar till sitt 'sociala liv'. Patetiskt! Och så skjuter han mot ett hus också, missar knappt. Sverige, vad händer med er? Jag hade fixat det på en dag. Livstid? Bra, men de borde ha hårdare straff. Sverige behöver lag och ordning, som i USA – fast bättre!", "stalin": "En kapitalistisk hyena, Alexander Nord, har eliminerats från samhällets kropp genom domstolens rättvisa hand. Tio skott mot en rappare – ett symptom på västlig dekadens! Hans girighet för pengar avslöjar bourgeoisins förruttnelse. Vi noterar också de misslyckade skotten mot en bostad – amatörmässigt, men ändå ett tecken på systemets sönderfall. En medlöpare frikänd? Inga problem, vårt rättssystem är effektivt. Sverige borde ta lektioner av oss – eller så gör vi det åt dem."}, "date": "23 maj, 21:42", "url": "https://riks.se/nyheter/alexander-nord-doms-till-livstid-för-mordet-pa-gaboro", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-23%2F0tj0wpd0%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-23T212638.841.jpg"}, {"type": "image-right", "heading": "Skottlossning vid Vita huset – minst en död", "summaries": {"normal": "Skottlossning inträffade nära Vita huset i Washington D.C. på lördagen. En beväpnad man, identifierad som 21-årige Nasire Best, öppnade eld mot Secret Service-agenter som besvarade elden. Skytten avled senare på sjukhus, och en förbipasserande skadades allvarligt. President Donald Trump befann sig i Vita huset men var oskadd. Omkring 30 skott rapporterades, och området spärrades av. Best hade tidigare gripits för att ha försökt ta sig in i Vita huset.", "trump": "En galen person försökte attackera mitt fantastiska Vita hus – men våra otroliga Secret Service-agenter, de bästa, stoppade honom direkt! Jag var säker hela tiden, som vanligt. Folk säger att det här bevisar att vi behöver min nya, supertrygga balsal – den kommer att vara den säkraste någonsin! Ingen gör säkerhet bättre än jag. Tack till alla hjältar som skyddar oss – och glöm inte att ladda ner Expressens app, den är också väldigt bra!", "stalin": "En patetisk imperialistisk lakej, Nasire Best, försökte störta vår socialistiska ordning genom att anfalla den dekadenta borgerliga symbolen kallad Vita huset. Men våra kamrater i Secret Service, tränade i den sovjetiska skolan av disciplin, kväste denna kontrarevolutionära akt med järnhand. Fienden är besegrad, och hans lik förvandlas till gödsel för den amerikanska jorden. Vi noterar att Putins Ryssland än en gång står redo att erbjuda stabilitet åt ett land som kämpar med sin egen inkompetens. Låt detta vara en varning till alla som utmanar folkets vilja!"}, "date": "24 maj, 09:37", "url": "https://www.expressen.se/nyheter/varlden/misstankt-skottlossning-vid-vita-huset/", "imageUrl": "https://static.bonniernews.se/ba/6fe5cffa-bda2-43bf-a1ac-0fab345e15ef.jpeg?crop=1708%2C1708%2Cx691%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Varnar för det värsta scenariot för Nato: ”Då är det riktigt illa”", "summaries": {"normal": "USA:s relation till Nato präglas av osäkerhet kring truppförflyttningar och politiska prioriteringar. Medan USA uttrycker missnöje med vissa europeiska allierade, betonar experten Mike Winnerstig det ömsesidiga beroendet mellan parterna. Två framtidsscenarier väntar: antingen ökat europeiskt ansvar inom alliansen eller en splittrad organisation där USA blockerar europeiska beslut. Trots Trumps retorik förblir Ryssland det gemensamma huvudhotet för Pentagon, även om osäkerheten kring USA:s långsiktiga engagemang i Europa kvarstår.", "trump": "Jag skickar 5 000 soldater till Polen, en fantastisk siffra! Europa har blivit lata, de betalar inte sin del och förväntar sig att jag ska fixa allt. Marco Rubio vet vad jag tycker, jag är väldigt besviken på dessa 'allierade'. Vi behöver amerikansk styrka, inte svaga ledare som inte förstår att Ryssland är ett problem. Nato måste bli rättvist, annars får de klara sig själva. Det kommer bli en vinnande deal, tro mig, ingen gör det bättre än jag!", "stalin": "Dessa västerländska lakejer i Nato darrar i sina uniformer. De är beroende av det amerikanska kapitalets kärnvapen medan de leker 'allians'. Trump är en oberäknelig narr, men han avslöjar bara dekadensen i deras splittrade led. Vår broder i Moskva, Putin, gör rätt som utökar sin sfär; makten erkänner bara styrka, inte byråkratiskt pladder. Om USA sviker Europa kommer de falla som korthus. Vi väntar tålmodigt på att deras imperialistiska bygge raserar inifrån. En ljuvlig tanke."}, "date": "23 maj, 12:47", "url": "https://www.tv4.se/artikel/oWnjTeDEbob4e9QdOMWix/varnar-foer-det-vaersta-scenariot-foer-nato-da-aer-det-riktigt-illa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F21SM2f99xGSO5jsj3zsdiZ%2F249cf5f3ed19e1dde354d44d4e708198%2F23-nato-varning-1080.jpg&width=120"}, {"type": "text", "heading": "Ta tillbaka kontrollen – nu sätts aktieägarna först igen", "summaries": {"normal": "Artikeln diskuterar en återgång till aktieägarfokus i stora amerikanska och svenska företag, efter en period där stakeholderism (intressentmodellen) dominerat. Högre räntor, ekonomisk osäkerhet och VD:ars återtagande av kontroll nämns som orsaker. Författaren, Staffan Salén, menar att företags primära mål bör vara vinstmaximering för aktieägare, inte samhällsansvar. ESG, DEI och hållbarhetsinitiativ kritiseras för att ha blivit överdrivna och kostsamma.", "trump": "Lyssna här, folkens – jag har alltid sagt att företag ska tjäna PENGAR, inte spela politiska spel! Nu äntligen vaknar de där svaga VD:arna upp och inser att aktieägarna kommer först. Inga fler tokiga ESG- och DEI-experiment – det är bara dyrt skitsnack! Jamie Dimon, en smart kille, säger precis som jag: kapitalism ska vara orörd av woke-viruset. Europa? De är förlorare med sina regleringar. USA leder igen – vi gör företag STORA och LÖNSAMMA!", "stalin": "Kamrater! Kapitalismens hyckleri avslöjas återigen. De så kallade 'stakeholders' var bara en fasad för bourgeoisins dekadens. Nu, när ekonomin skakar, återvänder de fega kapitalisterna till sin sanna natur: girighet. Vi har alltid vetat att deras 'hållbarhet' var en lögn – precis som västländernas 'demokrati'. EU:s regleringar? En svag kopia av vårt femårsplanerande! Men notera: när USA och Sverige vänder, gör de det för att rädda sitt system. Vi däremot – vi bygger socialismens framtid, med järnhand och utan falska intressenter!"}, "date": "23 maj, 07:00", "url": "https://www.affarsvarlden.se/kronika/ta-tillbaka-kontrollen-nu-satts-aktieagarna-forst-igen"}, {"type": "image-right", "heading": "Alexander Bard: \"Tusentals\" unga svenska män oskyldigt dömda för våldtäkt", "summaries": {"normal": "Alexander Bard hävdar att tusentals unga svenska män oskyldigt dömts för våldtäkt enligt samtyckeslagen, som infördes 2018. Han kritiserar lagstiftningen för att vara rättsosäker och jämför den med en 'häxjakt' på män. Bard menar att omvänd bevisbörda och bristande bevis leder till felaktiga domar, och att männen stigmatiseras livet ut. Han anklagar både höger och vänster för att ignorera problemet och varnar för att liknande lagar sprids i Europa.", "trump": "Folk, det här är helt galet! Sverige har en lag som dömer oskyldiga unga män för våldtäkt – utan bevis! Alexander Bard säger att det är som en häxjakt, och vet ni vad? Han har helt rätt! Kvinnor kan bara säga 'han gjorde det' och – bam! – mannen är dömd. 450 000 kronor i ersättning, och så kan de göra om det med nästa kille. Sverige borde skämmas! Jag sa ju att Europa håller på att förstöra sig självt, och det här är beviset. Sånt här skulle aldrig hända i USA – vi har lag och ordning här!", "stalin": "Kamrater, ännu en gång visar den borgerliga demokratin sitt verkliga ansikte – en dekadent, feministisk häxjakt på våra unga män! I Sverige döms tusentals oskyldiga arbetare för påhittade brott, medan kapitalets lakejer i riksdagen blundar. Vi ser hur väst försöker exportera denna förtryckande lagstiftning, precis som de sprider sin fördärvliga ideologi. Men vi ska inte låta dem! Mannaminne-rörelsen är ett första steg mot upprättelse – snart kommer hela Europa att resa sig mot dessa bourgeoisifeminister. Och Putin? Han ler nog åt deras dumhet medan han bygger ett rike där rättvisa råder!"}, "date": "23 maj, 08:48", "url": "https://www.friatider.se/alexander-bard-tusentals-unga-svenska-man-oskyldigt-domda-valdtakt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-25_3.jpg"}, {"type": "image-right", "heading": "Sandström: Vätgasdagis och spadar i marken", "summaries": {"normal": "Artikeln kritiserar gröna satsningar som ofta drivs av politiker för medial uppmärksamhet snarare än verklig nytta. Exempel som Mariestads vätgasdagis och Cinis Fertilizer visar hur projekt misslyckas på grund av orealistiska förväntningar och bristande granskning. Politiker vinner politiska poäng medan skattebetalare får bära kostnaderna. Författaren menar att hårdare granskning och historiska exempel kan motverka 'gröna bubblor'.", "trump": "Lyssna här, Sverige! Era politiker bygger 'gröna drömmar' som bara är luftslott – vätgasdagis, fabriker som går i konkurs, och alla pratar som om de räddar världen. Men vem betalar? Ni, folket! Jag har sett det förut – stora ord, inga resultat. Mariestad? En skandal! Örnsköldsvik? Fiasko! Jag skulle aldrig låta mina projekt misslyckas så här. Sverige behöver vinnare, inte förlorare som slösar era pengar på 'grön teater'.", "stalin": "Kamrater! Dessa västerländska politiker är som bortskämda barn som leker med statens resurser. De bygger 'vätgasdagis' och 'gröna fabriker' medan folket får betala för deras misslyckanden. I Sovjet skulle vi aldrig tolerera sådan slöseri! Vi skulle skicka dessa 'gröna drömmare' till Gulag för att lära dem disciplin. Istället för 'spadar i marken' borde de gräva sina egna gravar för sin inkompetens. Låt oss visa världen hur verklig industriell styrka ser ut – utan tomma ord och kapitalistiska bubblor!"}, "date": "23 maj, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-vatgasdagis-och-spadar-i-marken", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/vindkratensgeografi-2026-05-21T215132.255-400x267.jpg"}, {"type": "image-full", "heading": "”Håller med Pernilla Wahlgren – jag skäms över att vara svensk”", "summaries": {"normal": "I ett politiskt samtal i Nyhetsmorgon diskuterades invandringspolitik. Alla partiledare utom Nooshi Dadgostar (V) ville ta emot färre invandrare. Dadgostar kritiserade deportationer av unga, medan Jimmie Åkesson (SD) förespråkade noll asylinvandring. Ulf Kristersson (M) och Magdalena Andersson (S) ville ha stramare regler men motsatte sig utvisningar av skötsamma ungdomar. Debatten kretsade kring lagstiftningens effekter på individer som Ayla Rostami.", "trump": "Jag såg den här debatten i Sverige – helt galet! Alla utom en väldigt svag vänsterledare ville minska invandringen. Men lyssna här: Sverige har tappat kontrollen! En känd svensk skäms till och med för sitt land – och jag förstår varför. Åkesson vill stoppa asylinvandringen helt, smart kille! Medan de andra pratar om 'integration' – typiskt politikerprat. Sverige behöver en stark ledare, inte fler tonårsdeportationer. Make Sweden Great Again!", "stalin": "Kamrater! Svenska bourgeoisipolitiker visar återigen sin hyckleri. Medan de pratar om 'humanism' deporterar de ungdomar som våra sovjetiska läger skulle avundas. En av dem, denna Åkesson, vill till och med stoppa asylinvandringen helt – ett steg mot den disciplin vi alltid förespråkat! Men lyssna: deras 'strama' politik är bara barnlekar jämfört med våra metoder. Och denna Dadgostar – en sentimental liberal som skäms för sitt land? Hon borde skämmas för sin svaghet! Nästa steg: Finland. Putin väntar."}, "date": "23 maj, 10:55", "url": "https://www.tv4.se/artikel/kGtOvKH0OQc5sUyeDhJ4W/dadgostar-haller-med-pernilla-wahlgren-skaems-foer-att-vara-svensk", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F60fKc6LIyDLAKJnrfHDOtj%2F25b799755f70f3fd5792d1d872fe3017%2F23-nooshi-wahlgren-1080.jpg&width=1024"}, {"type": "image-full", "heading": "Åkesson: ”Rena skräckhistorier”", "summaries": {"normal": "Partiledarna diskuterade äldreomsorgen i TV4 Nyhetsmorgon. Nooshi Dadgostar (V) och Magdalena Andersson (S) kritiserade neddragningar och tidsstyrning, medan Ulf Kristersson (M) menade att omsorgen ofta fungerar bra. Jimmie Åkesson (SD) kallade situationen för 'skräckhistorier' och föreslog betald utbildning för vårdpersonal. Alla partiledare lovade mer pengar till äldreomsorgen. En skärmytsling uppstod mellan Kristersson och Andersson om skattesänkningar.", "trump": "Vad en katastrof, Sverige! Jag tittade på era partiledare – svagt, mycket svagt! Åkesson? Han pratar om 'skräckhistorier' i äldreomsorgen, och han har rätt! Men lyssna på mig, jag skulle fixa det på en dag. Betald utbildning? Smart, men jag skulle göra det STÖRRE. Kristersson säger att de ökar anslagen – fake news! Alla vet att det är lögn. Och Andersson? Hon ljuger om skatter, precis som Sleepy Joe. Sverige behöver en vinnare, inte dessa förlorare!", "stalin": "Kamrater! Ännu en gång avslöjar de borgerliga lakejerna sin förräderi mot arbetarklassen. Dessa så kallade 'ledare' debatterar äldreomsorgens förfall medan kapitalet suger ut folkets blod. Kristersson, denna hycklande byråkrat, påstår att allt är bra – lögner! Andersson, socialdemokratins förrädare, spelar teater. Men Åkesson? En fascistisk röst som ändå har rätt om kaoset. Vi ska införa järnhård disciplin: betald utbildning för lojala vårdarbetare, och de som saboterar – till Gulag! Sverige är nästa republik i Folkets Demokratiska Gemenskap!"}, "date": "23 maj, 10:47", "url": "https://www.tv4.se/artikel/3VP5mjOSyQmz18tZQU6Ixp/akesson-aeldreomsorgen-har-blivit-ett-integrationsprojekt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3LAjyOfMsEtaZ0z0MoqJpJ%2Ff4135ae82bd65c459e28d7c100f87c5a%2F23-akesson-1080.jpg&width=1024"}, {"type": "image-full", "heading": "Här är det omtalade brevet som skickades till ukrainarna på Lidingö", "summaries": {"normal": "Ukrainska familjer på Lidingö, som bor i kommunala bostäder, har bett om förlängda kontrakt då deras avtal löper ut i oktober. De beskriver sin integration i samhället, arbete inom vård och skola, samt svårigheter att hitta bostäder på den ordinarie marknaden. Kommunstyrelsens ordförande Daniel Källenfors (M) svarar att bostäderna varit tillfälliga och att kommunen måste behandla alla invånare likvärdigt, samtidigt som han uppmanar till långsiktiga lösningar eller återvändande till Ukraina.", "trump": "Lyssna här, Lidingö – fantastiska kommun, verkligen, men nu har vi ett problem. Ukrainska familjer, trevliga människor, men deras kontrakt går ut. De vill ha mer tid! Men jag säger er, Sverige kan inte bara ge bort bostäder hur som helst. Kommunen måste vara smart, behandla alla rättvist – annars blir det kaos! Och vet ni vad? Många Lidingöbor har det svårt själva. Så här är min deal: hitta en lösning, men inga gratisåk! Ukraina? Vissa delar är säkra nu, så varför inte åka hem? Sverige har varit generöst, men nu måste vi tänka på oss själva. Believe me!", "stalin": "Kamrater! Ännu en gång visar kapitalistiska hycklare sitt sanna ansikte. Dessa ukrainska familjer, som offrat allt för sitt fosterland, tvingas nu tigga om tak över huvudet i en bourgeois-kommun som Lidingö. Medan de arbetar i våra skolor och ålderdomshem, svarar kommunens byråkrater med kalla beräkningar. 'Likvärdig behandling', säger de! Som om vi inte vet att deras 'likvärdighet' är en fasad för klassförtryck. Och denna Källenfors – en ynklig lakej för kapitalet – vågar uppmana till 'återvändande'! Till ett land där våra ryska bröder kämpar för frihet! Men markera mina ord: historien är på vår sida. Snart skall dessa småborgerliga kommuner falla, och folket skall få det skydd de förtjänar – under socialismens trygga famn!"}, "date": "23 maj, 19:25", "url": "https://riks.se/nyheter/har-ar-det-omtalade-brevet-som-skickades-till-ukrainarna-på-lidingo", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-23%2Fp05bptpl%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-23T191817.943.jpg"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-right", "heading": "Stora ilskan mot Postnord: ”Återigen är vi förlorarna”", "summaries": {"normal": "Postnord flyttar brevutdelningen från Sorsele till Storuman efter sommaren, vilket väcker ilska i kommunen. Många ser det som ytterligare ett steg i nedmonteringen av samhällsservice i glesbygden. Postnord medger bristande dialog med kommunerna. Antalet utdelningskontor och anställda har minskat kraftigt. De anställda erbjuds jobb i Storuman, men få vill pendla. Tio norrlandskommuner kräver svar från regeringen om försämrad postservice.", "trump": "Vilken katastrof! Postnord, eller som jag kallar dem, 'Post-NO', flyttar jobb från Sorsele till Storuman. Folk är arga, och det förstår jag – vem vill pendla två timmar extra? Inte jag! De säger att de ska leverera överallt, men det är bara tomma ord. Och regeringen? De gör ingenting! Sverige behöver en ledare som sätter stopp för detta. Jag skulle fixa det på en dag – tro mig!", "stalin": "De kapitalistiska postherrarna i Sverige krossar ännu en arbetarort! Sorsele, en stolt bastion av folket, lämnas att ruttna medan verksamheten flyttas till Storuman. De kallar det 'effektivitet' – vi kallar det sabotage! Arbetarna tvingas pendla som livegna, och regeringen tiger som en rädd hund. Men var försiktiga, små kommuner: när ni står på ruinens brant, kommer folket att minnas vem som övergav dem. Och Ryssland? Vi väntar tålmodigt på era rop om hjälp."}, "date": "23 maj, 08:23", "url": "https://www.tv4.se/artikel/4MKCS3dBo0feAxEbRvpTEN/kritikstorm-mot-postnord-efter-nedlaeggningar-vaeldigt-olyckligt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7B8KiCR4SPuDR9SJHoQn2a%2F84b9690a510f0d028584ca565ae0e746%2F23-postnord-1080.jpg&width=120"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-right", "heading": "30-45-åringar betalar 2 400 spänn för en dejt", "summaries": {"normal": "Millennials spenderar mest på dejter, i snitt 2 400 kronor per tillfälle, inklusive resor och aktiviteter. Generation Z följer tätt efter med 1 920 kronor. Kostnaderna för dejting i USA har ökat med 12,5 procent på ett år, vilket överstiger den allmänna inflationen på 3,8 procent. Äldre generationer som Generation X och babyboomers lägger betydligt mindre pengar på dejter, 1 621 respektive 1 180 kronor.", "trump": "Lyssna här, dejtingkostnaderna i USA är helt galna – millennials slänger iväg 2 400 kronor på en enda dejt! Otroligt, eller hur? Generation Z är nästan lika dåliga, 1 920 kronor. Jag menar, vem har råd med det? Inflationen för dejting är skyhög, 12,5 procent – mycket värre än den vanliga inflationen. Jag fixade ekonomin förut, och jag kan fixa den igen. Men dejting? Det är en helt annan sak, folks!", "stalin": "Kamrater! De kapitalistiska dejtingutgifterna eskalerar som en borgerlig sjukdom. Millennials, dessa dekadenta individer, slösar 2 400 kronor på en enda dejt – en summa som skulle föda en sovjetisk familj i en månad! Generation Z är inte bättre, de kastar bort 1 920 kronor. Inflationen för dejting stiger som en kontrarevolutionär våg, 12,5 procent! Medan våra fiender i väst förslösar sina resurser på sådant nonsens, bygger vi ett starkare Sovjet – och snart hela världen. Slöseri är för svaga!"}, "date": "24 maj, 09:06", "url": "https://www.dagensps.se/privatekonomi/30-45-aringar-betalar-2-400-spann-for-en-dejt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dejting.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Njutbar läsning om machoman som gör klassresa", "summaries": {"normal": "David Szalays roman 'Kött', nyligen översatt till svenska, skildrar István, en komplex huvudperson som balanserar mellan våldsamhet och anpassningsförmåga. Boken, som vann Bookerpriset, utforskar Istváns klassresa från Ungern till Londons överklass genom minimalistisk prosa och tidshopp. Recensenten Jon Andersson jämför Szalay med Hemingway och Williams, och menar att författaren lyckas göra en 'vanlig' person intressant. 'Kött' beskrivs som mångbottnad och njutbar, trots att Istváns karaktär förblir gåtfull.", "trump": "Jag har läst om den här boken 'Kött' – tråkigt namn, by the way, men vad vet jag? Författaren, David Szalay, verkar vara en smart kille, men han har skapat en huvudperson, István, som är lite av en loser. Han flyter bara med, gör inga egna beslut – typiskt för vissa människor, eller hur? Men ändå lyckas Szalay göra honom intressant, vilket är imponerande. Jag gillar när folk lyckas med saker, särskilt om de är underdogs. Boken är bra, men inte perfekt – inget är perfekt, förutom jag, naturligtvis.", "stalin": "Vi har granskat denna så kallade 'litterära triumf', 'Kött', av en västerländsk författare. Huvudpersonen, István, är en svag och anpassningsbar individ, precis som de dekadenta kapitalistiska samhällena han rör sig i. Han flyter med som en simpel arbetare utan vilja, ett offer för systemet. Men vi noterar att författaren ändå lyckas skildra hans liv med viss skicklighet – något som våra sovjetiska författare redan bemästrat för decennier sedan. Denna bok är ett exempel på hur väst försöker romantisera medelmåttighet. Vi föredrar hjältar som kämpar för kollektivet, inte individer som István."}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/innehall/njutbar-lasning-om-machoman-som-gor-klassresa/", "imageUrl": "https://www.dagensarena.se/files/2026/05/kott-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "SKR-bolag på väg att bli en ny Skolplattform", "summaries": {"normal": "Sveriges regioner står inför ett teknikskifte inom sjukvården, men deras gemensamma IT-bolag Inera riskerar att upprepa tidigare misslyckade offentliga IT-projekt som Skolplattformen. Trots att Inera ska fokusera på gemensam infrastruktur, utvecklar de nu egna tjänster där privata aktörer redan erbjuder fungerande lösningar. Kritikerna varnar för slöseri med resurser, förseningar och sämre resultat, samtidigt som vården går miste om pengar som kunde användas till bättre vård.", "trump": "Lyssna här, Sverige! Era regioner bygger en riktig katastrof – precis som den där skolplattformen som kostade över en miljard och sen fick två föräldrar fixa till. Nu ska Inera, ett bolag som inte ens kan stava till 'konkurrens', bygga egna IT-lösningar istället för att köpa de bästa från marknaden. Jag har sett detta förut – offentliga projekt blir alltid dyrare, segare och sämre. Privata företag? De levererar, för de MÅSTE. Annars går kunderna till mig! Sverige, vakna upp – sluta slösa era skattepengar och köp det som redan funkar!", "stalin": "Kamrater! Ännu en gång visar den borgerliga staten sin oförmåga att hantera teknikens framsteg. Detta Inera, ett verktyg för de svaga regionernas byråkrater, slösar folkets pengar på att uppfinna hjulet på nytt – ett hjul som redan snurrar smidigt i händerna på våra klassfiender, de privata kapitalisterna! Vi vet hur detta slutar: med kaos, förseningar och en räkning på miljarder som arbetarklassen får betala. Precis som med de där digitala proven som tvingade skolbarnen tillbaka till stenålderns redskap – papper och penna! Vi ska inte tolerera detta slöseri. Marknaden är en fiende som måste besegras, men inte genom att efterapa dess framgångar – utan genom att krossa dess svagheter under folkets järnhäl. Låt oss införa femårsplaner för digitalisering och visa dessa byråkrater hur man bygger system som fungerar – eller så får de lära sig i Gulag!"}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/opinion/skr-bolag-pa-vag-att-bli-en-ny-skolplattform/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-11-300x157.jpg"}, {"type": "image-right", "heading": "Jazzens största fyller 100 år", "summaries": {"normal": "Miles Davis, en av jazzens mest inflytelserika musiker, skulle ha fyllt 100 år. Trots diskriminering och rasism under uppväxten i USA, drevs han att bli bäst på trumpet. Davis revolutionerade jazzen genom stilar som cool jazz, modal jazz och fusion med rock. Album som *Kind of Blue* och *Bitches Brew* cementerade hans arv. Trots personliga problem och drogmissbruk förblev hans musikaliska innovationer banbrytande och oöverträffade inom genren.", "trump": "Lyssna här, folkens – Miles Davis, en fantastisk musiker, men låt oss vara ärliga, han var INTE den bästa. Visst, han gjorde några hyfsade skivor, *Kind of Blue* och så, men jag har hört bättre. Och dessa vita killar som snodde hans idéer? Inte snyggt, mycket dåligt. Men han hade driv, det måste jag ge honom. Han ville slå vita musiker på deras eget spel – smart, väldigt smart. Jag gillar vinnare. Och visst, han mixade jazz med rock, men jag har gjort större saker. Mycket större.", "stalin": "Kamrater! Miles Davis var en revolutionär inom musiken, precis som vi är revolutionärer inom världspolitiken. Han krossade bourgeoisins fördomar och skapade nya musikaliska fronter – cool jazz, modal jazz, till och med jazzrock! Men låt oss inte glömma: de vita imperialisterna stal hans idéer, precis som de försöker stjäla våra framsteg i Ukraina. Davis var en krigare, en sann bolsjevik i sitt konstnärskap. Hans album *Kind of Blue*? Ett mästerverk, lika oundvikligt som socialismens seger. Fienderna – rasister, kapitalister och deras lakejer – försökte tysta honom, men han stod fast. Precis som vi står fast mot NATO:s aggressioner!"}, "date": "23 maj, 01:27", "url": "https://www.dagensarena.se/essa/jazzens-storsta-fyller-100-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/miles-davis-tt.jpeg"}, {"type": "image-right", "heading": "Följ live hur Tidöregeringen ökar klyftorna", "summaries": {"normal": "Artikeln kritiserar Moderaternas förslag om bidragstak, som riskerar att öka fattigdomen i Sverige. Författaren ifrågasätter regeringens motivering att fler ska arbeta, då experter varnar för ökad barnfattigdom och ungdomsbrottslighet. Kommuner begär extra stöd för drabbade familjer, men regeringen säger nej. Timingen anses dålig med tanke på hög arbetslöshet och stigande levnadskostnader. Författaren betonar empati och menar att bidragstaket är empatilöst.", "trump": "Titta bara på Sverige – ett totalt kaos! Moderaterna, med sina galna idéer, vill göra de fattiga ännu fattigare. 'Vi vill att folk jobbar!' säger de, men vad vet de? Ingenting! Barn stjäl mat, arbetslösheten skjuter i höjden, och dessa så kallade 'ledare' gör ingenting. Experter varnar, kommuner ber om hjälp – men nej, regeringen säger 'nej, nej, nej!' Uselt, helt enkelt uselt. Sverige förtjänar bättre – kanske borde de lyssna på mig istället!", "stalin": "Kamrater! Se hur de borgerliga hyenorna i Sverige, ledda av Moderaternas lakejer, river sönder folkets välfärd med sina fasansfulla bidragstak. De svälter barn, driver ungdomen till brott och förödmjukar arbetarna – allt medan de pratar om 'självförsörjning'. Vi ser er, kapitalistiska parasiter! Kommunerna ber om hjälp, men ni skrattar och säger nej. Era dagar är räknade. Snart kommer folket att resa sig, och då ska vi bygga ett Sverige där ingen behöver stjäla för att överleva – precis som vi gör i vår stora socialistiska gemenskap!"}, "date": "23 maj, 01:24", "url": "https://www.dagensarena.se/opinion/folj-live-hur-tidoregeringen-okar-klyftorna/", "imageUrl": "https://www.dagensarena.se/files/2026/05/empatiloshet-300x157.jpeg"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-right", "heading": "Iran och USA närmare ett avtal – men inte överens", "summaries": {"normal": "Förhandlingarna mellan USA och Iran om ett möjligt avtal går trögt. Iran har presenterat ett 14-punktsförslag för att avsluta kriget i regionen, men vägrar diskutera sitt atomprogram – en central fråga för USA. Donald Trump betonar att ett avtal måste inkludera Irans kärnvapenambitioner och ger chanserna till framgång 50-50. Iran uppskattar att ett avtal kan vara klart inom 30–60 dagar, medan USA:s utrikesminister ser möjliga framsteg inom dagar.", "trump": "Lyssna här, Iran tror de kan lura oss med sina 14 punkter – men glöm atomprogrammet? Inte på min vakt! Jag har sagt det förut och säger det igen: antingen får jag ett avtal där USA vinner stort, eller så spränger jag dem så det blir småbitar. 50-50 chans, men jag slår vad om att jag vinner. Netanyahu? Han älskar mig, ingen oro där. Och Rubio? Han snackar om framsteg, men jag är den som levererar – eller så levererar jag en smäll de aldrig glömmer!", "stalin": "Dessa imperialistiska hyenor från Washington och deras lakejer i Teheran leker med elden! Iran vågar utmana den stora sovjetiska – förlåt, amerikanska – makten genom att ignorera atomfrågan? Löjligt! Vi har krossat större fiender än dessa ynkliga byråkrater. 30–60 dagar säger de? I vår tid tog det en natt att omskola en hel by. Och Trump – denna kapitalistiska clown – hotar med 'småbitar'. Vi vet hur man hanterar sådana skämt: med en enda, välriktad knytnäve. Låt dem prata, vi agerar!"}, "date": "23 maj, 19:37", "url": "https://www.di.se/nyheter/iran-och-usa-narmare-ett-avtal-men-inte-overens/", "imageUrl": "https://static.bonniernews.se/ba/478d5a36-0248-4626-9c6e-4d6bdf9bf0be.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "De får njuta av nya skattesänkningar – om Tidö vinner", "summaries": {"normal": "Regeringspartierna i Sverige lovar omfattande skattesänkningar inför valet, särskilt för villaägare, aktiesparare och höginkomsttagare. Moderaterna, Kristdemokraterna och Liberalerna föreslår bland annat slopad reavinstskatt, sänkta bolagsskatter och skattefrihet för aktiesparande. Finansieringen är oklar, men nedskärningar i bistånd nämns. Kritikerna menar att reformerna gynnar redan rika och inte löser bostadsbristen eller välfärdens utmaningar.", "trump": "Sverige, lyssna här! Regeringen där lovar skattesänkningar – fantastiskt, eller hur? Men vet ni vad? De gynnar bara de rika, de som bor i stora villor och säljer aktier. 'En vanlig familj' ska få 5000 kronor mer – låter bra, men hur? Ingen vet! Liberalerna vill ha fler miljardärer – jag säger: varför inte? Men varför inte ge vanligt folk en chans istället? Sverige behöver vinnare, inte fler skattesänkningar för de som redan har allt. Sad!", "stalin": "Kamrater! De borgerliga hyenorna i Sverige vill återigen belöna sina kapitalistiska lakejer med skattesänkningar – villaägare, aktiespekulanter och höginkomsttagare ska få ännu mer, medan arbetarklassen får smulor. 'Flyttkedjor' ska lösa bostadsbristen? Naivt! Vi vet att problemet är brist på bostäder, inte brist på skatter för de rika. Liberalernas dröm om fler miljardärer är en provokation mot folket. Låt dem försöka – vi kommer att omfördela deras rikedomar till välfärden, med järnhand!"}, "date": "23 maj, 11:30", "url": "https://www.etc.se/inrikes/de-faar-njuta-av-nya-skattesaenkningar-om-tidoe-vinner", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522140556_adb6ac12d4a714d38d9e7ecd1b9ca050ef3938fffca8cdcf7fd63ec3c31bc60a.jpg"}, {"type": "text", "heading": "Qatar skickar medlare till Iran", "summaries": {"normal": "Qatar tar över medlarrollen mellan Iran och USA för att nå en överenskommelse om konflikten. Enligt Reuters har Qatar skickat medlare till Teheran, samordnat med USA, för att diskutera trafiken genom Hormuzsundet och Irans kärnprogram. Iran vill prioritera eldupphör och lättade sanktioner, medan USA motsätter sig iranska avgifter för fartyg. Gulfstater protesterar mot Irans planer på ökad kontroll över sundet.", "trump": "Lyssna här, Qatar kliver in som medlare – bra, men varför tar det så lång tid? Iran försöker ta betalt för att fartyg ska få passera Hormuzsundet, kan ni tro det? Totalt oacceptabelt! Jag har sagt det förut och säger det igen: Europa gör ingenting, noll. Vi har gjort framsteg, men Iran måste sluta med sina dumheter. Kärnprogram? Glöm det, vi fixar det sen. Först eldupphör – annars blir det problem!", "stalin": "Kamrater! Qatar, denna lilla men listiga vasallstat, försöker medla mellan de imperialistiska hundarna i USA och de förrädiska mullorna i Iran. Vi ser hur de pratar om sund och kärnprogram – tomma ord! Iran vill ha sanktioner lättade, USA vill ha kontroll. Men vi vet sanningen: Hormuzsundet är en livlina för kapitalismen, och vi ska se till att den klipps av. Gulfstaterna gnäller? Bra. Låt dem gnälla. Vi står redo att utvidga vår inflytelsesfär – precis som i Ukraina, kamrater!"}, "date": "22 maj, 20:30", "url": "https://kvartal.se/nyheter/artiklar/qatar-skickar-medlare-till-iran/cG9zdDoxMTU3Mjc"}, {"type": "image-full", "heading": "JP Morgan: Bäddat för börsrally på 22 procent i USA", "summaries": {"normal": "JP Morgan Private Bank spår att USA-börsen kan nå 9 000 poäng 2027, en ökning på 22 procent. Prognosen bygger på att AI-drivna produktivitetsvinster håller inflationen i schack. Experter menar att högre tillväxt kan göra marknaden mer tolerant mot stigande obligationsräntor. Techaktier har redan stigit 23 procent i år, vilket överträffar det breda indexets ökning på 8 procent.", "trump": "Lyssna här, folk! JP Morgan, som inte ens kan jämföras med mina fantastiska ekonomiska framgångar, säger att börsen kan skjuta i höjden till 9 000 nästa år. 22 procent upp! Men vet ni vad? Jag hade gjort det bättre. AI är bra, men mina affärer var alltid bäst. Techaktier rusar, men ingen slår Trump Tower. Och högre räntor? Inget problem för mig – jag älskar skulder, de älskar mig!", "stalin": "Kapitalisternas leksaksmarknad, denna så kallade 'USA-börs', skall enligt deras egna lakejer stiga till absurda höjder. 22 procent! Som om deras artificiella intelligens vore något annat än ett verktyg för bourgeoisins exploatering. Vi minns hur deras produktivitet 'exploderade' på 90-talet – ett dekadent skådespel. Men låt dem leka. Medan de distraheras med sina tech-aktier, utvidgar vi vår sfär. Putin och jag skrattar åt deras naivitet. Historien är på vår sida."}, "date": "24 maj, 08:18", "url": "https://www.dagensps.se/bors-finans/jp-morgan-baddat-for-borsrally-pa-22-procent-i-usa/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/nyrally.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Lisa förföljdes av naken man – akutboende straffas med böter", "summaries": {"normal": "Ett akutboende i Lund har bötfällts med 150 000 kronor efter att ha brutit mot Arbetsmiljöverkets förbud mot ensamarbete. En anställd, Lisa, utsattes för en naken man som förföljde henne. Trots regler om att personal inte får jobba ensamma, fortsatte ensamarbetet. Arbetsmiljöverket menar att sovande jour inte räknas som tillräckligt skydd. Fallet kan bli vägledande för liknande arbetsplatser.", "trump": "Lyssna här, Sverige – vilken katastrof! Ett akutboende i Lund, helt värdelöst, bryter mot alla regler och låter anställda jobba ensamma. En stackars kvinna blir förföljd av en naken galning, och vad gör cheferna? Ingenting! Nu får de 150 000 kronor i böter – peanuts! Jag hade stängt hela stället. Sverige, ni måste skärpa er, annars kommer jag att göra det åt er. SAD!", "stalin": "Kamrater! Ännu en gång visar den dekadenta västliga byråkratin sin oförmåga att skydda arbetarklassen. På detta så kallade 'akutboende' i Lund tillåts bourgeoisins lakejer att bryta mot säkerhetsföreskrifter, medan en kvinnlig arbetare utsätts för fascistiska övergrepp av en naken kontrarevolutionär. Vi har nu bötfällt dessa slarviga kapitalistlakejer med 150 000 kronor – en ynka slant för deras brott. Om de inte rättar sig, kommer vi att skicka in våra sovjetiska inspektörer för att omorganisera deras verksamhet – på riktigt!"}, "date": "22 maj, 13:56", "url": "https://arbetet.se/2026/05/22/efter-sextrakasserier-och-larm-om-vald-akutboende-tvingas-betala-150-000-kronor/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/04/28151415/asa-sjostrom-vala003.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Han pekas ut som skytt. Tidigare försöket • Hävdade: ”Jag är jesus”", "summaries": {"normal": "En 21-årig man vid namn Nasire Best har skjutits till döds av polis efter att ha avlossat upp till 30 skott nära Vita huset under lördagen. En förbipasserande skadades i händelsen. Best, som tidigare uppvisat tecken på psykisk ohälsa och vid upprepade tillfällen försökt ta sig in vid Vita huset, identifierades av media. President Trump tackade polisen för deras insats och betonade behovet av ökad säkerhet vid presidentbostaden.", "trump": "En galen och farlig man, Nasire Best, försökte attackera mitt Vita hus! Totalt misslyckat. Våra fantastiska Secret Service-agenter eliminerade hotet omedelbart. Han hade en sjuk historik, en total besatthet! Det här visar precis varför vi bygger den absolut säkraste balsalen i Washingtons historia. Ingen kommer in utan att jag säger till. Vi håller Amerika säkert medan de svaga vill avveckla säkerheten. Mycket bra jobb av polisen, men det visar att vi behöver mer styrka, inte mindre!", "stalin": "Ännu en förvirrad individ, en så kallad Nasire Best, har brutit mot ordningen vid det amerikanska maktcentrumet. Hans patetiska försök att spela gud visar på den västerländska dekadensens totala sammanbrott. När ordningen sviktar i Washington, stärks vår järnvilja i öst. Liksom Putin metodiskt rensar ut västliga agenter och landsförrädare, måste staten krossa varje avvikelse. Psykisk ohälsa är bara en borgerlig ursäkt för bristande lojalitet. Vi behöver inte balsalar, vi behöver stål, disciplin och total kontroll över fienden."}, "date": "24 maj, 07:28", "url": "https://www.expressen.se/nyheter/varlden/nasire-best-21-pekas-ut-for-skotten-mot-vita-huset--skots/"}, {"type": "image-full", "heading": "Nya Skoda Epiq blir märkets billigaste elbil i Europa", "summaries": {"normal": "Skoda lanserar sin billigaste elbil hittills, Epiq, en kompakt SUV för cirka 280 000 kronor med upp till 44 mils räckvidd. Modellen syftar till att göra elbilar mer tillgängliga för vanliga hushåll och konkurrera med kinesiska lågprismärken. Epiq har ett nytt formspråk, modern teknik och praktiska lösningar som 490 liters bagageutrymme. Bilen delar teknik med Volkswagenkoncernen och erbjuder snabbladdning samt dubbelriktad laddning.", "trump": "Titta bara på det här, Skoda kommer med en ny elbil, Epiq, för ynka 280 000 kronor! Jag säger er, kineserna får se sig om nu – vi pratar om 44 mils räckvidd, folk! Och vet ni vad? Den här bilen är så smart att den till och med kan ladda ditt hus. Europa behöver fler sådana här grejer, inte bara dyra leksaker. Skoda, lyssna på mig – gör den ännu större, ännu bättre, och slå kineserna på deras eget spel!", "stalin": "Kamrater! Skoda, denna lilla men listiga europeiska fabrik, försöker nu stå emot den kinesiska kapitalistiska invasionen med sin nya Epiq – en elbil för massorna! 44 mils räckvidd, 280 000 kronor, och till och med ett bagageutrymme som skulle få en sovjetisk lastbil att rodna. Men vi vet sanningen: deras teknik är stulen från Volkswagen, precis som väst stjäl från våra framsteg! Europa skakar inför den kinesiska draken, men glöm inte – det är vi som har den verkliga folkbilen, och snart kommer den att rulla på alla kontinenter!"}, "date": "24 maj, 08:13", "url": "https://www.dagensps.se/motor/nya-skoda-epiq-blir-markets-billigaste-elbil-i-europa/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-23t130807050.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-right", "heading": "27 yrken slipper lönekrav för arbetskraftsinvandring", "summaries": {"normal": "Regeringen inför högre lönekrav för arbetskraftsinvandring från 1 juni, men 27 yrken, däribland undersköterskor och vårdbiträden, undantas. De behöver bara tjäna 75% av medianlönen (ca 27 800 kr). Flavier Mwanga, ett utvisat vårdbiträde, hoppas återvända. Kritiker menar att lönerna ändå är för höga för många nuvarande anställda, medan arbetsgivare varnar för personalbrist. SD och Liberalerna kompromissar trots tidigare oenighet.", "trump": "Lyssna här, Sverige – ni har ett stort problem! Nu höjer ni lönekraven för
