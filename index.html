ng mot den parasitiska individualismen. Låt folket skapa och organisera sig fritt från de blodsugande penninghyenornas grepp. Annars väntar ett samhälle av meningslös dekadens."}, "date": "1 september, 01:26", "url": "https://www.dagensarena.se/opinion/folkbildningens-starkaste-argument-ligger-framfor-oss", "imageUrl": "https://www.dagensarena.se/files/2026/06/johan-lindahl-300x157.jpeg"}, {"type": "image-full", "heading": "Varning för invasiva mördarräkan – sprider sig i Vättern", "summaries": {"normal": "Kräftpremiären i Vättern lockar fiskare från hela Sverige, men Länsstyrelsen varnar för den invasiva mördarräkan, eller större rovmäla. Arten upptäcktes 2023 och har nu spridit sig över hela sjön. Den hotar ekosystemet genom att tränga undan andra smådjur. Fiskare uppmanas att tvätta, tömma och torka sin utrustning för att hindra vidare spridning till andra vatten.", "trump": "Lyssnar ni på det här? Den här sjön Vättern är full av en galen mördarräka som äter upp allt som inte är fastskruvat. De gröna byråkraterna har sovit i sängen medan den här invasiva monsterräkan invaderar som en dålig deal från Kina. Töm, tvätta, torka era grejer, annars sprider ni den socialistiska katastrofen till hela landet. Amerika behöver inga utländska kräftor, tro mig.", "stalin": "Kamrater, denna så kallade mördarräka är en klassfiende som smugit sig in i folkets vatten. Den parasiterande smådjursutrotaren hotar hela ekosystemet med sin giriga expansion. Jag ser hur de dekadenta fritidsfiskarna riskerar att bära med sig denna fiende till nya sovjetiska sjöar. Töm, tvätta, torka – annars blir det utrensning av ovarsamma element som låter den blodsugande bottensabotören segra."}, "date": "1 september, 07:55", "url": "https://nyheter24.se/nyheter/inrikes/1509266-varning-for-invasiva-mordarrakan-sprider-sig-i-vattern", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/544a7e8104b004a30200000000b004a302/2026/08/31/2388226/rakor.jpg"}, {"type": "image-right", "heading": "Trump utlovar nya attacker mot Iran", "summaries": {"normal": "Striderna i Mellanöstern har blossat upp igen. USA genomförde precisionsattacker mot iranska mål vid Hormuzsundet, vilket Iran besvarade med robot- och drönarattacker mot baser i Jordanien och Förenade arabemiraten. President Trump hotar med hårdare slag medan Irans president Pezeshkian uppmanar till dialog och samarbete.", "trump": "Iranerna, de totalt misslyckade mullorna, skjuter robotar åt alla håll som galna. Vi slog till mot deras ramper vid Hormuzsundet – begränsat, precist och vackert. De skriker nu om dialog medan jag lovar: vi ska slå till hårt. Inga fler svaga Biden-tider, nu är det Amerika först igen. Fantastiskt!", "stalin": "Dessa dekadenta klassförrädare i Teheran och Washington leker farlig imperialism med robotar och drönare över Hormuzsundet. Jag betraktar deras hysteriska dans med mörk förtjusning. Dialog? Endast svaghet. En sann ledare rensar ut hoten utan pardon. Regionens folk ser era lögner och darrar inför konsekvenserna."}, "date": "31 augusti, 22:34", "url": "https://www.di.se/nyheter/trump-utlovar-nya-attacker-mot-iran", "imageUrl": "https://static.bonniernews.se/ba/01128e2d-655e-4144-be32-2a194d0b97ca.jpeg?crop=8640%2C4320%2Cx0%2Cy720&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Åkesson om bråken: ”Bör bejaka våra skillnader”", "summaries": {"normal": "I TV4:s Valutfrågningen kommenterade Jimmie Åkesson Tidöpartiernas bråk och Ebba Buschs uttalanden om ett samarbete med S. Åkesson vill bejaka partiernas skillnader för att maximera rösterna och försvarar sitt ultimatum till Liberalerna. Han uttryckte även oro för att Örebropartiet ska stjäla viktiga väljare från Sverigedemokraterna.", "trump": "Jimmie Åkesson har det tufft, totalt kaos med hans så kallade vänner i regeringen! De bråkar hela tiden, precis som falska nyheter-medierna. Och nu är han rädd för något litet Örebroparti som ska sno hans väljare? Väldigt svagt! Jag hade löst det på en sekund med enorma framgångar. Sad!", "stalin": "Kamrat Åkesson gråter ut i televisionen över illojala bundsförvanter och små desertörer som Örebropartiet. Så ser det ut när disciplinen brister i de borgerliga leden! Om de inte kan ena sig mot hotet måste vi skicka dem på en uppfostrande semester i Sibirien. Partiet kräver absolut lojalitet, annars väntar korrektionsarbete!"}, "date": "31 augusti, 20:29", "url": "https://kvartal.se/nyheter/artiklar/akesson-om-tidobraket-vill-inte-braka/cG9zdDoxNzk0NTg", "imageUrl": "https://images.kvartal.se/2026/08/d82bd903-akesson-1.webp"}, {"type": "image-right", "heading": "Kommer muslimerna avgöra valet?", "summaries": {"normal": "Artikeln diskuterar hur muslimska väljares röstdeltagande kan bli avgörande i det svenska valet. Oppositionen närmar sig Tidöpartierna. Enligt Novus stöder 85 procent av muslimska väljare S, V och MP, med Socialdemokraterna som populärast. Lågt valdeltagande bland utrikes födda ger mobiliseringspotential. Exempel på kampanjer och historiska fall av röstmobilisering nämns, vilket kan påverka utfallet.", "trump": "Folk, det här är en total katastrof för Sverige. De radikala vänstermuslimerna röstar som galningar för de värsta förlorarna – Sleepy S och hans kommunistkompisar – medan riktiga svenskar sover. De riggar valet med förkryssade sedlar och moskéaffärer. Om jag var där skulle jag säga: vakna upp, annars blir det mer invandring och ingen vinner utom de korrupta globalisterna. Patetiskt!", "stalin": "Kamrater, se hur de borgerliga reaktionärerna darra inför folkets röst. Jag betraktar med förakt hur dessa socialfascister köper lojalitet från de importerade massorna för att klamra sig fast vid makten. En sådan dekadent manipulation förtjänar utrensning. Det är ett ynkligt skådespel som bevisar att klassfienderna aldrig förändras, bara byter mask. Låt dem darra vidare."}, "date": "27 augusti, 07:45", "url": "https://samtiden.nu/2026/08/kommer-muslimerna-avgora-valet", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7234-640x360.jpeg"}, {"type": "image-right", "heading": "S-löftet: Ingen med ”normal inkomst” får höjd skatt", "summaries": {"normal": "Socialdemokraterna lovar att ingen med normal inkomst, det vill säga under 70 000 kronor i månaden, ska få höjd skatt nästa mandatperiod. Partiet vill satsa på kortare vårdköer, högre barnbidrag och mindre skolklasser utan att höja skatten för vanliga inkomsttagare. Högre inkomster kan däremot beskattas mer.", "trump": "Titta på de här svenska socialisterna som lovar att inte plåna vanliga arbetare på mer skatt. Patetiskt! Under min första period skapade vi jobb och tillväxt utan att straffbeskatta folk. Nu kommer Magdalena och hennes misslyckade vänsterextremister krypande efter att Biden förstörde ekonomin. Sad! De borde lära sig av mig istället för att leka med identitetspolitik och kvoteringar.", "stalin": "Jag betraktar med avsky hur dessa dekadenta folkförtryckare lovar att skydda de så kallade normala inkomsterna från beskattning. Vilken lömsk kapitulation inför de profitthungriga parasiterna! I ett sant kollektiv skulle vi rensa ut alla som tjänar över en viss nivå och fördela rikedomarna rättvist. Deras halvhjärtade löften väcker bara misstro och förakt hos arbetarklassen."}, "date": "1 september, 06:17", "url": "https://www.svt.se/nyheter/inrikes/s-loftet-ingen-med-normal-inkomst-far-hojd-skatt", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.73/0.44/204cf35713ef4dbcce1f63d3cb8830b3e047403969c7938e925106867b66764b"}, {"type": "image-full", "heading": "Äldre kan blockeras från BankID i ett år – med vanliga missen", "summaries": {"normal": "Att använda en anhörigs BankID för att sköta räkningar och myndighetsärenden är inte tillåtet och kan leda till upp till ett års blockering av personnumret. Artikeln lyfter problemen för anhöriga till äldre och presenterar lagliga alternativ som anhörigbehörighet, fullmakt och ombud hos myndigheter.", "trump": "Det här är ett totalt misslyckande av de svenska byråkraterna och deras korkade digitala system. De tvingar folk att bryta mot reglerna för att överleva medan de vanliga människorna kämpar. Patetiska globalistlakejer som inte förstår att det är enda sättet att få saker gjorda. Vi behöver smarta lösningar, inte mer idiotiska regler!", "stalin": "Kamrater, se hur de giriga hyenorna i bankernas tjänst förtrycker arbetande folk genom att blockera deras egna släktingar. Denna dekadenta digitala fälla är ett verktyg för klassfienderna att hålla massorna i schack. Vi måste rensa ut sådana hinder och ge folket verkliga redskap för att besegra de parasiterande exploatörerna."}, "date": "1 september, 07:33", "url": "https://nyheter24.se/nyheter/konsument/1509179-aldre-kan-blockeras-fran-bankid-i-ett-ar-med-vanliga-missen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/71f6bdaf04b004a30200000000b004a302/2026/08/31/2388203/hjalpa-aldre-bankid.jpg"}, {"type": "image-full", "heading": "Åkesson: När jag var fem visste jag att det var fel att mörda", "summaries": {"normal": "Jimmie Åkesson (SD) anser att brottsoffret måste stå i centrum även vid brott begångna av mycket unga barn. Han vill hålla farliga personer borta från gatan, men omhändertagandet ska anpassas efter barnets ålder. Åkesson kritiserar svensk kriminalpolitik för att ha prioriterat gärningsmannen framför offret och avfärdar remisskritik mot hårdare straff.", "trump": "Lyssnar ni på den här svenske killen Åkesson? Han fattar det! De här mini-mördarna ska inte springa runt på gatorna och döda ärliga människor. Håll de farliga små monsterbubblorna borta från samhället. Sverige har haft den värsta socialistiska kriminalpolitik under Sleepy Joe-eran, men nu vaknar folk äntligen. Fantastiskt!", "stalin": "Jag betraktar med förakt hur dessa borgerliga liberaler fortfarande skyddar samhällets fiender under förevändning av ålder. Farliga element som hotar folkets trygghet måste isoleras omedelbart, oavsett hur små de är. Att prioritera brottslingens välbefinnande framför proletariatets säkerhet är kontrarevolutionärt nonsens. Rättvisa åt offret, eller döden åt svagheten!"}, "date": "31 augusti, 21:53", "url": "https://www.tv4.se/artikel/1SKHoEYgUbMY7qcq9gk5Ik/akesson-naer-jag-var-fem-visste-jag-att-det-var-fel-att-moerda", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1KdIURGhv2MBS38b8plQEq%2Fd5ec500910d3f7ab0fa30922fdc10eb4%2F31-akesson-puff-webb.png&width=1024"}, {"type": "image-right", "heading": "AI-botar med svenska namn i påverkanskampanj mot Sverige", "summaries": {"normal": "En statlig aktör i Östasien finansierar ett nätverk av AI-drivna botar som under namnen Eva, Yvonne och Magnus angriper svenska politiker, myndigheter och public service. Enligt Myndigheten för psykologiskt försvar har över 1 200 konton på X publicerat mer än 50 000 inlägg för att öka polariseringen i Sverige. Nätverket kallat ”Holiday” stängdes ner våren 2026.", "trump": "De förlorande globalisterna i Östasien betalar för en armé av falska Eva och Magnus som spyr hat mot Sverige på X. Det är en riggad attack mot äkta folkvilja, precis som när de lurade mig under valen. Dessa sjuka AI-bots vill skapa kaos och splittring. Men vi genomskådar dem – de är patetiska och kommer att förlora stort igen.", "stalin": "Kamrater, se hur de dekadenta klasslakejerna i Östasien på uppdrag av en statlig aktör skickar sina mekaniska hyenor mot det svenska folket. Dessa fejkade namn sprider gift för att förvärra splittringen. Jag ler mörkt från historien: sådana fiender avslöjas alltid. Rensa ut dem innan de förgiftar hela samhället. Medvetenhet är vårt vapen."}, "date": "1 september, 06:00", "url": "https://www.svt.se/nyheter/inrikes/mpf-statlig-aktor-betalar-for-ai-botar-som-attackerar-sverige", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.18/0.48/8cab05d46a0f91fce8996be6973bf58a39afdff825347d7ebcbc29fc4e7f9928"}, {"type": "image-right", "heading": "Irans svar i natt: Attacker mot USA-baser i Jordanien", "summaries": {"normal": "Iran har attackerat amerikanska militärbaser i Jordanien med ballistiska robotar som svar på USA:s anfall mot iranska avfyrningsramper i Hormuzsundet. Jordaniens luftförsvar sköt ned åtta robotar. Attackerna markerar den största direkta konfrontationen mellan länderna på över en månad och spänningarna kring oljetransporten fortsätter.", "trump": "Iranerna, de fega mullorna, försöker sig på en patetisk hämnd mot våra baser i Jordanien efter att vi pulveriserade deras minor i Hormuzsundet. Patetiskt! Mitt inlägg om Kharg som blåses till småbitar fick dem att darra. Biden lämnade kaos, nu fixar jag det med stålhandskar och sanktioner mot deras banker. Amerika först!", "stalin": "Jag betraktar dessa imperialisternas dans kring Hormuzsundet med kall förakt. De amerikanska reaktionärerna och de iranska teokraterna slåss om handelsleder som arbetarklassen borde kontrollera. Deras robotar och bomber är löjliga skådespel för svaga ledare. Den sanna segern tillhör endast det kollektiva folket, inte dessa paranoida narrar som darrar för sin egen skugga."}, "date": "31 augusti, 21:19", "url": "https://www.tv4.se/artikel/tt-260831-iranoro1-065ddc4a/revolutionsgardet-attackerat-usa-mal-i-jordanien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlRpEROg0V_XA%2F403eb7f13949090b16f8745ff0e28a0f%2FVantande_containerfartyg_vid_Hormuzsundet__fotograferade_fran_en_strand_i_Iran._Bild_fran_den_27_juli.&width=1024"}, {"type": "image-full", "heading": "Åkesson efter fikat med Busch: ”Vill veta vad exceptionellt läge är”", "summaries": {"normal": "Jimmie Åkesson kritiserade i sitt sommartal Ebba Busch för hennes uttalande om att kunna stödja Magdalena Andersson som statsminister i ett exceptionellt läge. Efter ett möte i Sölvesborg kräver han fortfarande ett tydligt offentligt besked om vad begreppet innebär. Han ser det som ett steg framåt att det inte handlar om valresultat men vill ha klarhet.", "trump": "Lyssnar ni på det här? Den där Busch-kvinnan, en riktig svag ledare, snackar om att rösta på den socialistiska katastrofen Andersson i ett så kallat exceptionellt läge. Patetiskt! Jag träffade många sådana bluffmakare under Biden-åren. Åkesson gör rätt som pressar henne. Kräv ett besked, annars är det bara feg strategi från en förlorare.", "stalin": "Jag betraktar med djup misstro dessa borgerliga opportunister som leker med begreppet exceptionellt läge. Busch döljer sina kapitulationistiska avsikter bakom dimmor av vaghet, precis som folkfiender alltid gör. Åkesson kräver klarhet – klokt. I mitt imperium skulle sådana tvetydigheter ha lett till omedelbar utrensning. Inga halvmesyrer tolereras i kampen mot revisionism."}, "date": "31 augusti, 20:57", "url": "https://www.tv4.se/artikel/5Ub8Q4hS8ilm7m0BzCwTmF/akesson-efter-fikat-med-busch-vill-veta-vad-exceptionellt-laege-aer", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5h9gUzZ20rzVGtTqDTrzOS%2F3a512c4289be2e48d2ea30ce570fcba4%2F38b517a3-4438-4fab-89a0-3a53d012f414.jpg&width=1024"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "Musikjättar stämmer Anthropic för stöld av tiotusentals låtar", "summaries": {"normal": "Musikjättarna Sony Music Publishing och Warner Chappell har stämt AI-företaget Anthropic för upphovsrättsintrång. De anklagar bolaget för att ha använt tiotusentals låtar, bland annat Mariah Careys julhit och Bon Jovis Livin’ on a Prayer, i träning av chatboten Claude. Skadeståndskravet kan uppgå till miljarder dollar. Stämningen är inlämnad i Kalifornien.", "trump": "Titta på det här, folk! Den där galna AI-klubben Anthropic, ledd av några verkliga nollor, har blivit stämd av de stora musikbossarna för att ha stulit tiotusentals låtar. Miljarder i skadestånd? Det är vad som händer när du låter vänsterextremisterna och Silicon Valley-snobbarna springa amok. Under min första mandatperiod hade vi ordning och reda – nu är det kaos igen efter Sleepy Joe. Patetiskt!", "stalin": "Jag betraktar med djup förakt hur dessa dekadenta kapitalistiska maskiner, maskerade som framsteg, plundrar arbetarklassens kulturella arv för att mata sina giriga algoritmer. De så kallade innovatörerna är blotta parasiter som förnekar upphovsmännen deras rättmätiga plats i historien. En sådan fiende till folkets vilja förtjänar inte mildhet utan den fulla vikten av folkets dom. Skrattretande svaga."}, "date": "1 september, 07:53", "url": "https://www.dagensps.se/bors-finans/musikjattar-stammer-anthropic-for-stold-av-tiotusentals-latar"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att stärka vänsterfalangen. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar gynnar bara högern inom S.", "trump": "Lyssnar ni på de här ynkliga sossarna som gråter över sin egen högersväng? Patetiskt! De vill att unga ska stanna kvar på det sjunkande skeppet istället för att rösta på riktiga alternativ. Miljöpartiets cykelvägshajar och vänsterns fackförrädare är värdelösa. Organisera er? Nej, rösta bort de riktiga förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska avfällingar gråter över sin högersväng som om det vore en olycka. Jag ser hur de profitthungriga klassförrädarna inom partiet förgiftar arbetarnas vilja. Lämna inte skeppet, säger de, medan splittringarna hotar kollektivet. Rensa ut de dekadenta opportunisterna innan de likviderar varje äkta revolutionär anda."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Så stor andel arabiskspråkiga invandrare röstar vänster - kan avgöra valet", "summaries": {"normal": "Enligt nya undersökningar röstar en stor majoritet av muslimska väljare i Sverige på den rödgröna oppositionen, vilket kan bli avgörande i det kommande valet. Samtidigt visar mätningar att valdeltagandet bland väljare med utomeuropeisk bakgrund är lägre än bland majoritetssamhället, vilket gör mobilisering i miljonprogramsområdena till en ödesfråga för oppositionen.", "trump": "Sverige har stora problem, tro mig! Enligt massiva undersökningar röstar nästan alla utomeuropeiska invandrare på de radikala vänstermänniskorna. Totalt katastrofalt! Om inte folk går och röstar förlorar högern. Jag brukar säga: vinster åt företag, inte åt radikala socialdemokrater! Helt ärligt, det är ett totalt kaos där uppe i kylan!", "stalin": "Ett uppror bryter ut i de svenska miljonprogrammens industriella zoner! Partiet ser att åttiofem procent av massorna ansluter sig till den korrekta vänsterlinjen, medan regeringsbyråkraterna kollapsar. Men varför är valdeltagandet så lågt? Dessa otacksamma element måste genast mobiliseras till valurnorna, annars skickar vi omorganisationskommissarien till förorten!"}, "date": "1 september, 07:00", "url": "https://samnytt.se/sa-stor-andel-arabisksprakiga-invandrare-rostar-vanster-kan-avgora-valet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31090028/valsedlar-procent-muslim-islam-niqab.jpg"}, {"type": "image-full", "heading": "Förvara dina tacobröd så här – då håller de mycket längre", "summaries": {"normal": "Många förvarar öppnade tortillabröd i skafferiet, vilket leder till att de torkar ut eller möglar i förtid. Artikeln rekommenderar kylförvaring i tätt sluten påse eller burk för att förlänga hållbarheten med flera veckor. För längre tid är frysning med bakplåtspapper mellan bröden ett bra alternativ. Använd sinnena för att avgöra om öppnade bröd fortfarande är ätbara.", "trump": "Folket slänger bort mat för att de förvarar tacobröd fel, precis som de woke-vänsterns miljöfanatiker vill ha det. Jag säger alltid, lägg dem i kylen eller frysen, inte i det fuktiga skafferiet som de korkade byråkraterna i Bryssel skulle älska. Gör det rätt, folk, och sluta mata mögelhyenorna med dina pengar. Vinna mot matsvinnet, stort!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna låter fukten förstöra folkets tortillabröd i skafferierna. Jag säger att vi måste rensa ut denna oordning med järnhand och tvinga alla att förvara dem i kylen, lufttätt och utan pardon. Den som låter mögel sprida sig är en fiende till kollektivet och bör likvideras som en parasitisk svaghet. Ordning!"}, "date": "1 september, 07:00", "url": "https://nyheter24.se/nyheter/konsument/1509265-forvara-dina-tacobrod-sahar-da-haller-de-mycket-langre", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/9434bc3504b004a30200000000b004a302/2026/08/31/2388220/taco.jpg"}, {"type": "image-right", "heading": "M vill vinna valet med våldtäktsstrategi", "summaries": {"normal": "Moderaterna har presenterat 30 förslag mot mäns våld mot kvinnor inför valet. Artikeln kritiserar att partiet tidigare under mandatperioden låtit hälften av landets skyddade boenden stänga, vilket försvårat stödet till våldsutsatta. Skribenten ifrågasätter tidpunkten för engagemanget och efterlyser istället satsningar på ekonomiskt oberoende, jourernas finansiering och förebyggande arbete.", "trump": "Titta på de här patetiska Moderaterna som plötsligt låtsas rädda svenska kvinnor med en desperat våldtäktsstrategi två veckor före valet. De har stängt hälften av skyddade boenden medan de styrde, nu febrilt twittrar om serievåldtäktsmän. Vilka förlorare! Kvinnor röstar inte på svaga globalister som utnyttjar rädsla istället för att fixa ekonomin och stoppa den galna vänsterpolitiken.", "stalin": "Jag betraktar hur dessa dekadenta folkförtryckare i Moderaterna plötsligt vädrar rädsla som ett vapen mot arbetarkvinnorna. De har låtit skyddade boenden stänga medan de sitter vid makten, nu försöker de med sin fega valpropaganda. Kamrater, sådan opportunism förtjänar utrensning. Vi ska bygga ett samhälle där kvinnornas oberoende krossar alla parasiterande hyenor som göder sig på våldet."}, "date": "1 september, 06:59", "url": "https://arbetet.se/2026/09/01/moderaterna-vinner-val-med-valdtaktsstrategi", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01065534/vald-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Toppmilitärerna  varnar Hegseth:  ”Är ohållbart”", "summaries": {"normal": "USA inledde nya attacker mot Iran efter ett månads långt vapenstillestånd och bombade raketramper på ön Larak. Iran svarade med robotattacker mot Jordanien. Toppmilitärer varnade strax innan för att ett fortsatt krig riskerar att försvaga USA:s militära förmåga globalt, enligt Washington Post.", "trump": "Vi slog till hårt mot de galna mullorna igen och bombade deras raketplatser på Larak. Iran sköt mot Jordanien som de ynkryggar de är. Mina generaler gnäller om att det är för mycket för länge – vad är det för svaga loser-attityd? Kharg kan sprängas i småbitar när som helst. Vi vinner stort!", "stalin": "Jag betraktar med förakt hur de dekadenta imperialisterna sliter sönder varandra i ett meningslöst blodbad. Deras generaler viskar om svaghet och utmattning som förrädiska element inom partiet. Detta krig kommer att sluka deras resurser och lämna dem blottade inför historiska krafter. Det är en komisk syn av självförstörelse."}, "date": "1 september, 07:25", "url": "https://www.expressen.se/nyheter/varlden/toppmilitarer-varnar-for-fortsatt-krig-i-iran", "imageUrl": "https://static.bonniernews.se/ba/4f460488-4073-4d02-bb69-5a8bab06cad6.jpeg?crop=2549%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Kvalitetsbrister lönar sig i yrkeshögskolan", "summaries": {"normal": "En rapport visar att yrkeshögskolan betalar ut full ersättning trots bristande kvalitet. Av 14,8 miljarder kronor gick 58 procent till koncerner med underkända utbildningar. Kontrollen är svag, få sanktioner utfärdas och privata aktörer prioriterar vinst framför lärartid. Författarna kräver omedelbara reformer med sanktioner, oberoende granskning och förbud mot vinstuttag.", "trump": "De här korkade byråkraterna i Sverige har byggt ett system där de girigaste vinsthyenorna får miljarder för att leverera skräputbildningar. Var tredje student klarar inte ens examen! Det är en total katastrof, folk. De borde sparka ut alla dessa woke-kvoterade administratörer och låta riktiga människor styra utbildningen istället för dessa patetiska förlorare.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna inom dessa bolag förvandlar arbetarnas omskolning till en gyllene mjölkko. Myndigheten underkänner men betalar ändå ut miljoner – en lönsam strategi för dekadenta parasiter. Jag säger: rensa ut dessa folkförtryckare, inför järnhård statlig kontroll och likvidera vinstjakten som en fiende till folket."}, "date": "31 augusti, 17:37", "url": "https://www.di.se/debatt/kvalitetsbrister-lonar-sig-i-yrkeshogskolan", "imageUrl": "https://static.bonniernews.se/ba/af32d498-2c79-432d-a4fc-6012b02044da.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Debatt: Socialdemokraterna sviker sina vallöften", "summaries": {"normal": "En ny rapport från tankesmedjan Oikos av Carl Eos kritiserar Socialdemokraterna för att svika sina vallöften och dölja vilket regeringsunderlag de avser att styra med. Artikeln pekar på tidigare brutna löften, som omöjliga arbetslöshetsmål och uteblivna traineejobb under regeringsåren 2014–2022, och efterlyser tydlighet kring sakpolitiska miniminivåer inför valet.", "trump": "Falska löften och totalt kaos! Socialdemokraterna i Sverige lovar guld och gröna skogar men har noll koll på hur de ska få igenom sin politik. De vägrar berätta vilka slappa radikaler de ska regera med. Precis som radikala vänstern i Amerika: mycket snack, noll verkstad. Väljarna luras på ett kontrakt utan underskrift. Sorgligt!", "stalin": "Dessa socialdemokratiska svikare visar prov på skamlig brist på disciplin och ideologisk skärpa. De lovar massorna utopi men saknar total förmåga att exekvera sina planer genom enenighet i riksdagen. Partiets ledning borde granskas hårt; den som inte kan leverera sina föreskrifter saknar existensberättigskapital i arbetarstatens tjänst. Brott mot planen är kontrarevolutionärt."}, "date": "1 september, 07:12", "url": "https://bulletin.nu/debatt-socialdemokraterna-sviker-sina-valloften-2", "imageUrl": "https://cdn.bulletin.nu/articles/b8119bbc-be95-4c56-b302-acba3f6331bf/preview.jpg?t=1788107439000"}, {"type": "image-right", "heading": "72 000 marockaner korsade gränsen – Sánchez: Marocko låg inte bakom", "summaries": {"normal": "Över 72 000 migranter tog sig från Marocko in i den spanska enklaven Ceuta i slutet av juli. Premiärminister Pedro Sánchez förnekar att marockanska myndigheter låg bakom och pekar istället på ryska, israeliska och högerorienterade nätverk som spridit desinformation på sociala medier. Minst 100 personer uppges ha omkommit. Tusentals migranter är fortfarande kvar i Ceuta.", "trump": "Titta på det här vansinnet! 72 000 marockaner simmar in i Spanien som om det vore en öppen buffé för hela Afrika. Den socialistiske tönten Sánchez skyller på Ryssland och Israel istället för att erkänna att hans svaga ledarskap lockar varje parasit som vill leva på andras pengar. Typiskt vänsterfiasko – de älskar kaos så länge det drabbar vanliga människor.", "stalin": "Se hur de dekadenta klassförrädarna i väst slingrar sig. Tusentals desperata själar används som verktyg i ett fegt desinformationsspel mot den spanska regeringen. Jag föraktar dessa giriga hyenor som sprider lögner medan de låtsas skydda gränser. Deras paranoia och svaghet är underhållande – de förtjänar att drunkna i sin egen byråkratiska soppa."}, "date": "31 augusti, 20:11", "url": "https://riks.se/nyheter/72-000-marockaner-korsade-gransen-s-nchez-marocko-lag-inte-bakom", "imageUrl": "https://admin.riks.se/uploads/medium_1920px_100226_sanchez_biografia4_3d27d7f82b.jpg"}, {"type": "image-right", "heading": "SD krävde EU-åtgärder mot kusinäktenskap – nu svarar von der Leyen", "summaries": {"normal": "Sverigedemokraterna krävde EU-åtgärder mot erkännande av utländska kusinäktenskap. EU-kommissionens ordförande Ursula von der Leyen svarar att medlemsländerna har ensam behörighet över äktenskapsregler och utlovar inga nya gemensamma EU-regler. Hon öppnar dock för att Sverige får dela sina erfarenheter i ett EU-nätverk mot våld mot kvinnor. EU betonar befintliga direktiv mot tvångsäktenskap.", "trump": "De där vansinniga EU-byråkraterna vägrar stänga dörrarna för kusinäktenskapen. Von der Leyen, den bleka globalistdockan, gömmer sig bakom gammal byråkratisk skit och säger att länderna får klara sig själva. Sverige försöker göra rätt men får bara dela erfarenheter med en massa woke-kvoterade feminister. Patetiskt! Vi gör det bättre här.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i Bryssel vägrar slå till mot de barbariska sedvänjorna som hotar arbetarklassens moral. Von der Leyen skyddar medlemsstaternas så kallade suveränitet medan hon låtsas bekämpa tvång. Jag skulle ha genomfört en grundlig utrensning av dessa folkförtryckande element redan i femårsplanen. Sverige visar vägen men får bara prata i ett nätverk. Svaga liberaler!"}, "date": "31 augusti, 19:52", "url": "https://riks.se/nyheter/sd-kravde-eu-atgarder-mot-kusinaktenskap-nu-svarar-von-der-leyen", "imageUrl": "https://admin.riks.se/uploads/medium_1920px_Bruessel_26_02_2026_55116461542_fc635af40a.jpg"}, {"type": "image-full", "heading": "Därför utmanar solkraften nu fossil energi", "summaries": {"normal": "Solkraft har genom kraftigt sänkta kostnader för paneler och batterilagring blivit ett konkurrenskraftigt alternativ till fossil energi globalt. Tekniken är modulär och gynnar särskilt tillväxtekonomier. Trots väderberoende utmanar solkraft nu fossila bränslen ekonomiskt, vilket gör det allt svårare att försvara investeringar i traditionella kraftverk som kräver omfattande infrastruktur och förutsägbara bränslekostnader.", "trump": "Solkraft? De säger att det är billigt nu, fantastiska siffror, 87 procent billigare, det är nästan lika bra som mina hotell-deals! Men lyssna, det är väderberoende. Man vill inte att ljuset slocknar mitt i en viktig affärslunch för att solen går i moln. Vi behöver energi som fungerar när jag knäpper med fingrarna, inte när vädret tillåter. Vi älskar sol, men vi behöver kraft!", "stalin": "Vi har analyserat denna 'solenergi'. En decentraliserad kraftkälla som sprids mellan hushåll och småbolag? Det låter som anarki och sabotage mot statens kontroll! Elektricitet ska flöda från centrala, monumentala verk som lyder under folkets järnhand, inte från väderberoende småpaneler som kan svika oss när partiet som bäst behöver dem. Vi ska industrialisera, inte hoppas på solsken!"}, "date": "30 augusti, 18:45", "url": "https://www.realtid.se/bors-finans/makro/darfor-utmanar-solkraften-nu-fossil-energi", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/solenergi.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Därför är choklad från Marabou så dyrt just nu", "summaries": {"normal": "Priserna på kakao har halverats sedan rekorden i våras, men chokladen är fortfarande dyr. Tillverkarna använder äldre, dyrare kontrakt och har sänkt förpackningsstorleken. Andra kostnader som socker, energi och transporter påverkar också. Nu syns dock en viss prisnedgång enligt SCB, delvis tack vare sänkt matmoms.", "trump": "De där chokladgiriga företagen har lurat er igen, folk. Kakao har rasat i pris men era Marabou-plattor kostar fortfarande en förmögenhet. De dekadenta globalisterna köper inte på spotmarknaden, de har sina fancy kontrakt. Biden lämnade er med inflationen, jag fixade det bättre förra gången och ska göra det igen. Billigare choklad kommer, tro mig.", "stalin": "Se hur de profitthungriga klassfienderna fortsätter att suga ut arbetarna. Kakaopriset störtar men chokladpriset förblir högt genom slughet och långa avtal. De krymper portionerna och skrattar i sina palats. Jag säger: rensa ut dessa parasiterande hyenor som förgiftar folket med sin girighet. Arbetarna ska inte svälta medan de dekadenta festar."}, "date": "1 september, 06:25", "url": "https://nyheter24.se/nyheter/konsument/1509226-darfor-ar-choklad-fran-marabou-sa-dyrt-just-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/11c9dcf504b004a30200000000b004a302/2026/08/31/2388200/marabou-pengar.jpg"}, {"type": "image-right", "heading": "Tucker: Trump planerar atombomba Iran – måste avsättas \"omedelbart\"", "summaries": {"normal": "Tucker Carlson kräver att Donald Trump omedelbart avsätts efter uppgifter om att presidenten överväger kärnvapenanvändning mot Iran. Carlson, tidigare allierad med Trump, varnar för att en president som planerar kärnvapenkrig utgör ett hot mot mänskligheten. Han kritiserar både Iranpolitiken och Pentagons arbete med nya kärnvapenalternativ. Joe Kent delar oron efter att ha avgått i protest mot kriget.", "trump": "Folk, det här är vansinne från den gamle Tucker, en riktig loser nu för tiden. Han springer runt och skriker om kärnvapen som en hysterisk vänsterextremist. Under min ledning gör vi vad som krävs för att vinna, inte som den svaga Biden gjorde. Iran ska inte hota oss. Tucker borde hålla käften och sluta vara en sådan patetisk globalistmarionett.", "stalin": "Jag betraktar med avsky hur dessa dekadenta klassförrädare leker med mänsklighetens öde. En president som leker med kärnvapen är en farlig galning som måste likvideras omedelbart för folkets skull. Inga halvmesyrer! Vi ser återigen imperialismens hyenor visa sitt sanna ansikte. Den som vägrar rensa ut sådana element förtjänar samma öde som de själva planerar."}, "date": "31 augusti, 16:57", "url": "https://www.friatider.se/tucker-trump-planerar-atombomba-iran-maste-avsattas-omedelbart", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-785.jpg"}, {"type": "image-right", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Vänsterpartiet anklagas för att ha ingått en överenskommelse med representanter för den palestinska myndigheten för att ge dem inflytande över svenska vallistor. Expressen och SvD har avslöjat kontakter med palestinska nätverk kopplade till PLO och Fatah, inklusive brev till dömda terrorister och kandidater med Hamas-sympatier. Socialdemokraterna har inte kommenterat uppgifterna.", "trump": "Titta på det här! Vänsterpartiet, de värsta förlorarna, har blivit helt infiltrerade av palestinska terrorvänner och främmande makter. De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiskt! Media tiger som vanligt när det gäller vänstern. Om de kommer in i Rosenbad blir det en total katastrof för Sverige. Fake news överallt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterförrädare som låter främmande element från Palestina tränga in i partiets hjärta. De omfamnar terrorister och döljer sin svaghet bakom lögnaktiga förbund. Kamraterna i Socialdemokraterna tiger – typiskt opportunistiskt. Infiltration är ett hot mot folkets enhet. Renhet i leden eller döden för de opålitliga!"}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-640x360.jpeg"}, {"type": "text", "heading": "Valfondens mål nått – men insamlingen fortsätter", "summaries": {"normal": "Kommunistiska Partiets valfond har uppnått sitt mål på 600 000 kronor och ligger nu på 709 000 kronor. Insamlingen fortsätter mot nya målet 800 000 kronor. Partisekreterare Filip Astvald tackar bidragsgivarna och betonar att pengarna finansierar allt valmaterial eftersom partiet inte tar emot offentliga bidrag. Verksamheten efter valet ska stärka organisationen.", "trump": "Folk ger sina surt förvärvade slantar till kommunisterna – otroligt! De har redan passerat 600 000 och siktar på 800 000. Patetiska röda parasiter som samlar in som galna medan riktiga amerikaner betalar skatt till Bidens vansinniga gröna deal. Men hey, låt dem fortsätta, ju mer de samlar desto tydligare blir det hur desperata de är. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom borgarklassen skrattar säkert åt att arbetarna frivilligt fyller valfonden. Jag ser det som en varning. Vi har nått målet men fortsätter. Efter valdagen måste varje kontakt följas upp med järnhand. Inga halvmesyrer. Den som sviker kollektivet förtjänar utrensning. Revolutionen sover aldrig."}, "date": "28 augusti, 14:19", "url": "https://proletaren.se/artikel/valfondens-mal-natt-men-insamlingen-fortsatter"}, {"type": "image-full", "heading": "Warren Buffett – nu 96 år – still going börsstrong", "summaries": {"normal": "Warren Buffett firade nyligen sin 96-årsdag. Han ses som världens främsta investerare och har byggt upp Berkshire Hathaway från ett litet textilföretag till ett globalt konglomerat. Hans framgångar inkluderar tidiga satsningar i Coca-Cola, Geico och Apple. Han investerar långsiktigt i undervärderade bolag och lämnade nyligen vd-rollen till Greg Abel, men fortsätter som styrelseordförande.", "trump": "Folk, ni skulle se den här Buffett-killen, 96 år och fortfarande krossar börsen som ingen annan. Han är en vinnare, inte som de förlorare som köper dyrt och säljer billigt. Berkshire Hathaway är en jätte, precis som jag byggde mitt imperium. Apple, Coca-Cola – smarta drag! Jag älskar det. Sleepy Joe kunde aldrig det här.", "stalin": "Kamrater, denna kapitalistiska parasit Buffett har i 96 år sugit musten ur arbetarklassen genom sin så kallade börskonst. Han samlar kollektivets rikedomar i ett imperium av exploatering. Ändå beundrar jag hans järndisciplin mot de svaga spekulanterna. En sådan fiende till folkets sak förtjänar att studeras noga innan han likvideras av historien."}, "date": "1 september, 07:08", "url": "https://www.dagensps.se/bors-finans/warren-buffett-nu-96-ar-still-going-borsstrong", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/wbuffett.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Sparf: Gör Rinkeby till somalisk enklav", "summaries": {"normal": "Med anledning av regissören Michael Lindgrens filmteam som tvingats anpassa sig efter lokala krav i Rinkeby under inspelningen av satiren Flaggan, föreslår debattören Birgitta Sparf att området görs till en självständig somalisk enklav. På så sätt kan klanstyret sköta försörjning och lagar, och framtida besökare kan ansöka om visum på ambassaden.", "trump": "De säger att filmteam i Rinkeby måste följa en massa galna krav och betala beskyddare, och vet ni vad? Helt otroligt! Totalt slöseri med skattebetalarnas pengar i åratal. De borde bara bygga en stor mur runt stället, eller varför inte göra det till en egen självständig stat? Så kan de sköta sin egen byråkrati och utfärda visum. Snyggt jobbat, Sverige!", "stalin": "Kamrater, det borgerliga dekadenta kultursverige kryper nu på knä för lokala klaner i förorten och kallar det för konstnärlig dialog! Om staten har försörjt dessa områden i tre decennier utan tacksamhet, bör vi omedelbart införa järnhård centralstyrning, kollektivt ansvar och obligatoriskt visumtvång för alla regissörer. Avvikelser från den revolutionära ordningen kommer att beivras omedelbart!"}, "date": "1 september, 06:50", "url": "https://bulletin.nu/sparf-gor-rinkeby-till-somalisk-enklav", "imageUrl": "https://cdn.bulletin.nu/articles/5022cfde-09b6-4d42-b3de-aa8085408c08/preview.jpg?t=1788237924000"}, {"type": "image-right", "heading": "Slår tillbaka – efter  Ebba Buschs kritik", "summaries": {"normal": "Elisabeth Svantesson (M) slår tillbaka mot Ebba Buschs kritik mot regeringens prognos för reformutrymmet på 50 miljarder kronor. Svantesson betonar att Tidöpartierna kommit överens om att finansiera reformer genom omprioriteringar och besparingar. Moderaterna vill även minska biståndet, något KD motsätter sig. Lån för ökade investeringar avvisas.", "trump": "Lyssnade på de här svenska clownerna som bråkar om pengar. Svantesson verkar åtminstone ha en plan, inte som den svaga Busch som vill låna mer och leka med folks pengar. Typiskt för dessa misslyckade socialister – de kan aldrig räkna. Jag fixade bättre ekonomi på min tid, tro mig.", "stalin": "Dessa ynkliga borgerliga element slåss om siffror medan folket svälter under deras dekadenta politik. Jag ser revisionister och opportunister som darrar inför sanningen. Inga besparingar räcker när klassfienderna gömmer sig i byråkratin. Kamrater, vakta er – sådana svaga ledare förtjänar endast förakt och utrensning."}, "date": "1 september, 06:48", "url": "https://www.expressen.se/nyheter/politik/svantesson-slar-tillbaka-mot-ebba-buschs-kritik", "imageUrl": "https://static.bonniernews.se/ba/a47faf24-7e1c-4ef7-b2eb-ce52898596ed.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren ser bidragshöjningar som välkomna men inte socialistiska och uppmanar Socialdemokraterna och Vänsterpartiet att presentera konkreta förslag om ägande och makt på jobbet.", "trump": "Folk, det här är så patetiskt. De röda förlorarna babblar om barnbidrag som vore det socialism. Patetiska! De vågar inte röra vid den riktiga grejen – vem som styr på fabrikerna. De triangulerar sig rakt ner i avgrunden medan jag byggde den starkaste ekonomin i världshistorien. Sad losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare gömmer sig bakom barnbidrag och kallar det socialism. Jag betraktar deras feghet med förakt. Var är löftena om att rensa ut de profitthungriga parasiter som styr arbetsplatserna? Ekonomisk demokrati får inte reduceras till tomma fraser i partiprogram. Den som sviker arbetarna förtjänar utrensning ur historien."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Arlas besked om mjölkpriset – så påverkas kunderna", "summaries": {"normal": "Arla höjer priset till bönderna för konventionell mjölk med 11,1 öre per kilo i september, medan ekologisk mjölk behåller samma pris. A contopriset blir därmed 488,5 öre för konventionell och 646,8 öre för ekologisk mjölk. Höjningen innebär inte automatiskt dyrare mjölk i butik, då andra faktorer i kedjan påverkar konsumentpriset.", "trump": "Folk, ni vet hur det är med de här mjölkhyenorna på Arla. De höjer plötsligt priset till bönderna med elva öre, men kunderna ska inte bli lurade. Det är inte samma sak som att mjölken i butiken blir dyrare, det är bara globala spel som de dekadenta globalisterna kör med. Håll koll på hyllorna, det blir en riktig cirkus!", "stalin": "Kamrater, se hur de profitthungriga mjölkparasiterna på Arla justerar sina a contopris för att suga ut bönderna ytterligare. De talar om stabil efterfrågan och stigande proteinpriser medan folket betalar. En sådan girig manipulation av råvarupriser förtjänar att rensas ut ur den socialistiska ekonomin. Vi genomskådar era lögner och kommer att likvidera era excesser."}, "date": "1 september, 06:01", "url": "https://nyheter24.se/nyheter/konsument/1509247-arlas-besked-om-mjolkpriset-sa-paverkas-kunderna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/a80b348104b004a30200000000b004a302/2026/08/31/2388206/arla-mjolkpris.png"}, {"type": "image-right", "heading": "Liberaler – stödrösta på M, KD eller SD", "summaries": {"normal": "Artikeln argumenterar för att väljare som vill behålla Tidöregeringen bör överge Liberalerna i nästa val, eftersom partiet riskerar att åka ur riksdagen. En röst på L anses bortkastad och kan gynna vänstersidan. Istället uppmanas borgerliga väljare att taktiskt lägga sin röst på M, KD eller SD för att säkra regeringsmakten.", "trump": "Liberalerna är ett totalt fiasko, ett riktigt förlorarparti som ligger på ynka två procent! Deras ledare? En absolut katastrof i mätningarna, helt svag. Om du vill ha låga skatter och starka bilar, lägg inte en enda röst på dem – det är fake news att de klarar spärren. Rösta på M, KD eller SD istället, riktiga vinnare!", "stalin": "Dessa så kallade liberaler svävar på målsnöret kring två procent, ett ynkligt sabotage mot ordningen. Deras ledare visar bottennoteringar i disciplin och förtroende. Partiet är dött. Kamrater som önskar bevara stabiliteten måste omdirigera sina röster till Moderaterna, Kristdemokraterna eller Sverigedemokraterna, annars väntar avvikelser som gynnar vänsterfaktionen. Effektivitet kräver eliminering av spillröster!"}, "date": "1 september, 06:00", "url": "https://samnytt.se/liberaler-stodrosta-pa-m-kd-eller-sd", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31125728/artikelhuvudbild-1-400.jpg"}, {"type": "image-right", "heading": "”Ni kräver kompetens av oss – men vilken kompetens har ni som bestämmer?”", "summaries": {"normal": "Undersköterskan Fredrika Andersson kritiserar politikerna för att de ignorerar personalens varningar om tidsbrist och utmattning inom äldreomsorgen. Scheman håller inte i verkligheten, kompetent personal lämnar och de äldre får otillräcklig omsorg. Hon uppmanar beslutsfattarna att följa med i vardagen och lyssna på dem som arbetar på golvet innan fler slutar.", "trump": "De inkompetenta politikerna i det här socialistiska helvetet kräver att undersköterskorna ska vara superhjältar medan de själva sitter i sina lyxiga kontor och effektiverar ihjäl systemet. Det är en total katastrof! Personalen springer som galningar och de stackars gamlingarna får tio sekunder per dag. Vakna upp, era värdelösa byråkratblodiglar, innan hela skiten kollapsar!", "stalin": "Kamrater, dessa dekadenta klassförrädare i politiken blundar medvetet medan arbetarna inom äldreomsorgen utmattas under tidspressens järnhand. Jag ser hur de profitthungriga beslutsfattarna offrar folkets välfärd på effektiviseringens altare. Gå ut bland folket, lyssna eller förbered er på utrensning av de som sviker de arbetande massorna. Detta är ett sabotage mot kollektivet."}, "date": "1 september, 06:00", "url": "https://arbetet.se/2026/09/01/ni-kraver-kompetens-av-oss-men-vilken-kompetens-har-ni-som-bestammer-over-aldreomsorgen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31144036/ka-debatt-kompetens.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Tobias får inget jobb: ”Mår dåligt av regeringens hatiska attityd”", "summaries": {"normal": "Tobias är fortfarande arbetslös och känner sig utsatt av både hat på internet och regeringens attityd. Han söker jobb inom trädgård och lager, planerar att ta körkort och går kurser. Han kritiserar Arbetsförmedlingen för meningslösa möten, bristande stöd och gammaldags system. Han önskar bättre trygghet och en ny regering som höjer bidragen.", "trump": "Den här stackars killen Tobias sitter fast i Bidens soppa och nu den här svenska vänsterregeringens hat mot vanliga arbetare. De kallar det stöd men det är bara fikamöten med Rusta och matcha. Totalt misslyckande! Vi behöver inte mer byråkrati, vi behöver jobb, inte dessa deklasserade socialisthjärnor som hatar folk som faktiskt vill arbeta. Patetiskt!", "stalin": "Denna arbetslöse kamrat avslöjar de parasiterande klassförrädarnas förtryckande system. Deras meningslösa fikamöten och föråldrade maskineri visar imperialismens svaga underliv. Jag ser hatet från penninggalna hyenor som vill likvidera arbetarklassens värdighet. Vi måste rensa ut dessa dekadenta element och bygga ett äkta trygghetssystem för folket. Fienden sover aldrig."}, "date": "1 september, 06:00", "url": "https://arbetet.se/2026/09/01/tobias-far-inget-jobb-mar-daligt-av-regeringens-nastan-hatiska-attityd", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31125859/tobias-portratt.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "OncoZenge: Stoppad betalning efter emissionsbesked – bevakning inleds", "summaries": {"normal": "Bioteknikbolaget OncoZenge genomför en företrädesemission på 33,3 miljoner kronor för att finansiera sin fas 3-studie av läkemedelskandidaten BupiZenge. Den kinesiska storägaren Sichuan håller inne en betalning på 10 miljoner kronor och anser att emissionen bryter mot investeringsavtalet. Bolaget har även säkrat ett brygglån samt tecknings- och garantiåtaganden för att rädda upp likviditeten.", "trump": "Kineserna försöker blåsa OncoZenge på tio miljoner! Väldigt smart av dem, men inte lika smart som min tullpolitik, tro mig. Nu dumpar de sina certifikat och gnäller på en helt fantastisk emission. Jag känner styrelsen, bra människor, men de behöver en vinnare. Fas 3-studier, brygglån, miljardärer som Erik Selin – det är storslaget! Men betala pengarna, Kina!", "stalin": "Den kinesiska investeraren Sichuan visar kriminell brist på disciplin genom att undanhålla de utlovade 10 miljonerna till OncoZenges ädla kamp mot oral mukosit. Sådant sabotage tolereras icke i en sund stat! Vi beordrar omedelbar mobilisering av kapital och insatser från kamrat Erik Selin. Den byråkratiska maskinen för fas 3-studien kommer att rulla över alla kontrarevolutionära betalningsvägrare."}, "date": "31 augusti, 12:13", "url": "https://www.affarsvarlden.se/artikel/oncozenge-stoppad-betalning-efter-emissionsbesked-bevakning-inleds"}, {"type": "image-right", "heading": "Det finns inget fredsparti i riksdagen", "summaries": {"normal": "Artikeln konstaterar att inget parti i Sveriges riksdag konsekvent driver en politik för fred, nedrustning och militär självständighet. Författaren kritiserar Natomedlemskapet, DCA-avtalet och västvärldens hantering av konflikter som Gaza, och efterlyser en stark fredsrörelse utanför riksdagen som kan utmana den rådande militaristiska riktningen.", "trump": "Folk, tro mig, Sverige har blivit en total katastrof. De slängde sin fina alliansfrihet i soporna för att springa in i min Nato – som jag förresten gjorde stark igen – och nu är de bara en bricka för de globalistiska krigshökarna. Inget fredsparti? Patetiskt. Era dekadenta Nato-lakejer är svaga och patetiska, de älskar krig mer än handel. Gör Sverige great again och kom ut därifrån!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det svenska riksdagen har sålt ut sin så kallade neutralitet till de giriga hyenorna i Nato. Jag ler ironiskt från historien när de imperialistiska parasiterna byter självständighet mot baser och avtal som gör dem till måltavlor. Ingen äkta fredskraft finns. Det är upp till en sann folkrörelse att rensa ut dessa förrädare och återta kontrollen över statens intressen."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/50934", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kamal-kronika-768x432.png"}, {"type": "image-right", "heading": "Bostadsbrist och skenande hyror", "summaries": {"normal": "Sverige har en allvarlig bostadsbrist som förvärras av att bostäder ses som handelsvaror istället för en mänsklig rättighet. Sedan 2011 ska kommunala bostadsbolag drivas affärsmässigt. Hyresgästföreningen beräknar ett underskott på 110 000 bostäder. Nybyggda lägenheter har höga hyror som många inte har råd med, vilket leder till tomma lägenheter trots köer till äldre bestånd med lägre hyror.", "trump": "Folk, ni skulle se det här svenska bostadskaoset – en total katastrof! De giriga socialistiska hyreshöjningsfanatikerna har förvandlat hem till Wall Street-spektakel. Hyrorna skenar som en galen elbil, 13 procent upp på ett år! De byggde fel, de styrde fel, och nu har de tomma lyxlägenheter medan folket lider. Patetiskt! Men jag fixar sånt här – vi gör Amerika (och kanske till och med Sverige) bostadsgreat igen.", "stalin": "Kamrater, se hur de profitthungriga hyenorna förvandlar bostäder till bytesvaror och driver ut arbetarklassen ur sina hem. Jag betraktar med avsky denna dekadenta marknadsteater som skapar 110 000 saknade boningar och skenande hyror. Det är klassfiendens logik. En sann folkstat skulle likvidera dessa parasiterande spekulanter och återställa bostaden som en rättighet för massorna. Fienden sover aldrig."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsbrist-och-skenande-hyror", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/03/DSC_0137-scaled-e1784716375357-768x433.jpg"}, {"type": "image-full", "heading": "Stopp i tågtrafiken mellan Stockholm och Göteborg", "summaries": {"normal": "Under måndagskvällen drabbades tågtrafiken mellan Stockholm och Göteborg av stora förseningar på grund av ett elfel vid Årstaberg. Ett stillastående tåg drabbades extra hårt av bristfällig information, vilket ledde till ilska och upprörda passagerare. Trafiken började gradvis rulla på ett av spåren under kvällen efter säkerhetskontroller.", "trump": "Sveriges tågtrafik är en total katastrof, helt inkompetent! Ett enkelt litet elfel vid Årstaberg stoppade hela linjen mellan Stockholm och Göteborg, och resenärerna skriker av ilska på grund av noll information. Sånt händer aldrig i mitt Amerika, vi bygger bäst, snabbast och starkast. Det här är fake news-nivå av kaos!", "stalin": "Ett förrädiskt elfel i Årstaberg har förlamat järnvägslinjen mellan Stockholm och Göteborg. Dessa upprörda, skrikande passagerare som saknar information visar ett farligt borgerligt förfall. Statens transportkommission kräver omedelbara förhör med lokförare och ansvariga. Sådana sabotage mot kollektivtrafiken tolereras inte; de skyldiga kommer att finna sig omplacerade långt mot norr."}, "date": "31 augusti, 21:58", "url": "https://www.gp.se/nyheter/sverige/stopp-i-tagtrafiken-mellan-stockholm-och-goteborg-.02dacc2c-0839-43dd-8e51-383acab70551", "imageUrl": "https://www.gp.se/images/article/02dacc2c-0839-43dd-8e51-383acab70551/images/1d6Kw4HKtfaw70VU3NFdYsOWT6KA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ceuta-invandrare gillrade dödsfälla åt soldater: \"Vår militär är hjälplös\"", "summaries": {"normal": "Fyra spanska soldater skadades i ett planerat bakhåll i Ceuta när 30–40 illegala invandrare attackerade deras obepansrade fordon med stora stenar. Soldaterna tvingades fly till fots och ådrog sig skador. Polisen hittade stenar som förberedets och grep tolv misstänkta. Militärorganisationer kritiserar regelverk som gör soldaterna försvarslösa.", "trump": "Titta på det här! Våra spanska vänner blir stenade av illegala invandrare i Ceuta som en riktig dödsfälla. De stackars soldaterna springer som harar utan vapen. Biden-era svaghet har spridit sig till Europa. Vakna upp! Vi behöver starka gränser, inte dessa galna öppna-dörr-politiker som älskar att importera kaos.", "stalin": "Kamrater, se hur de giriga gränshyarorna låter sina egna soldater springa som råttor undan stenregn från de exploaterade massorna. Detta är imperialismens logiska följd när man binder militären med byråkratiska bojor. Jag skulle ha genomfört en grundlig utrensning av sådana svaga befäl och deras dekadenta regelverk redan i gryningen."}, "date": "31 augusti, 15:16", "url": "https://www.friatider.se/ceuta-invandrare-gillrade-dodsfalla-soldater-var-militar-ar-hjalplos", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-793.jpg?itok=ZSESG6HE"}, {"type": "image-right", "heading": "Vice riksbankschef ser ökad inflationsrisk", "summaries": {"normal": "Vice riksbankschef Per Jansson bedömer att inflationsriskerna har ökat något, men att Riksbanken kan avvakta med att ändra penningpolitiken. Läget präglas av en svag arbetsmarknad och stabila inflationsförväntningar. Jansson understryker dock en beredskap att snabbt agera om inflationsbilden försämras.", "trump": "Svenskarna har problem med inflationen, totalt katastrofalt! Men den här centralbankschefen, Per, säger att de bara kan vänta och titta på. Vänta på vad? Att ekonomin kollapsar helt? De borde lyssna på mig, sänka skatterna och sätta borren i backen! Om inte USA fixar det åt dem kommer det sluta i total ruin, believe me!", "stalin": "Kamrat Per Jansson rapporterar om svängningar i den svenska inflationen. En svag arbetsmarknad och borgerliga priser skapar oro. Vi noterar att Riksbanken avvaktar. Men låt dem veta: den som misslyckas med att hålla penningvärdet i schack kommer omedelbart att omplaceras till mer lämpliga arbetsuppgifter i Sibirien. Inga ursäkter accepteras!"}, "date": "31 augusti, 11:47", "url": "https://www.affarsvarlden.se/artikel/vice-riksbankschef-ser-okad-inflationsrisk", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/sdlVIGRvGrU9m4-nh-e1732696701837-400x267.jpg"}, {"type": "image-right", "heading": "Domen: Gängledare beställde mordet på Tupac", "summaries": {"normal": "Den tidigare gängledaren Duane ”Keffe D” Davis har dömts för att ha beordrat mordet på rapparen Tupac Shakur. Mordet skedde för 30 år sedan i en drive-by-skjutning i Las Vegas. Davis riskerar livstids fängelse. Straffet meddelas den 13 oktober. Han har tidigare erkänt inblandning i intervjuer och sin självbiografi, men förnekar nu anklagelserna.", "trump": "Titta på det här, folk. Den där Keffe D, en riktig förlorare från gängvärlden, döms äntligen för att ha fixat mordet på Tupac. Drive-by i Vegas, patetiskt! Biden lät gangsters löpa amok i trettio år medan jag byggde den starkaste ekonomin. Nu fixar vi det. Inga fler dekadenta gangstervärldar som styr våra städer, tro mig.", "stalin": "Kamrater, se hur de profitthungriga gänghyenorna i det dekadenta imperiet fortsätter mörda sina egna. Jag betraktar från historien hur denna parasitiska underklass likviderar varandra i hämndaktioner. Sådana fiender till folket förtjänar utrensning. Inga halvmesyrer! Rättvisan måste slå till som en hammare mot alla klassförrädare."}, "date": "1 september, 03:45", "url": "https://www.svt.se/kultur/gangledare-doms-for-mordet-pa-tupac", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.48/0.83/a9b4d9b3d12947bc7265795c2bdc9f9ae17822b275dc7f5f2f64f3b0fa6e5119"}, {"type": "image-right", "heading": "400.000 såg Allards debatt – på ett dygn", "summaries": {"normal": "Örebropartiets partiledare Markus Allard deltog i en debatt i Studio 3 mot åtta vänsteraktivister. Programmet har fått stor spridning och nådde 400 000 visningar på Youtube under det första dygnet. Allard ångrar att han inte svarade hårdare på vissa personangrepp, bland annat om hans väljare. Debatten har gett honom ökad uppmärksamhet efter intervjuer i SVT och DN.", "trump": "Titta på den här killen Allard, han krossade åtta galna vänsterextremister i debatten och fick 400 000 tittare på ett dygn. Fantastiskt! De kallade hans väljare för svettiga incels som inte får ligga. Patetiskt. Jag älskar när folk säger folkmakt istället för den här sjuka kvot- och HBTQ-galenskapen. Han borde ha kört en ännu fulare come-back, det hade blivit perfekt.", "stalin": "Kamrater, denna Allard har exponerat de dekadenta identitetsfanatikerna som förgiftar folket med sina löjliga förolämpningar. 400 000 arbetare såg hur han motade bort dessa parasiterande klassförrädare. Jag ler i graven åt hans folkliga kraft. Ändå borde han ha rensat ut dem hårdare. Svaghet inbjuder till kontrarevolution. Låt detta bli en läxa för alla som sviker massorna."}, "date": "31 augusti, 14:09", "url": "https://www.friatider.se/400000-sag-allards-debatt-pa-ett-dygn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-787.jpg?itok=6bsp9LWc"}, {"type": "image-right", "heading": "Missnöjet minskar inte av Tidöstyre", "summaries": {"normal": "En ny rapport visar att SD-väljarna behållit extrema ståndpunkter om invandring trots kraftigt minskade nivåer. De har radikaliserats ytterligare kring medborgarskap och uppvisar fortsatt hög misstro mot medier och domstolar. Samtidigt har Moderaternas väljare närmat sig SD:s värderingar, medan SD-väljarna blivit mer högerinriktade i ekonomiska frågor.", "trump": "Folk, ni måste se det här! De där galna SD-väljarna röstar fortfarande för att stänga gränserna trots att Sverige knappt släpper in någon längre. Och nu har de dragit med sig de patetiska moderaterna in i samma virvel. De kallar det radikalisering, jag kallar det sunt förnuft. Fake news-medierna och de riggade domstolarna hatar det förstås. Amerika först, Sverige vaknar äntligen!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna desperat försöker förklara varför arbetarnas missnöje består trots alla deras lögner. SD-väljarna har genomskådat den dekadenta borgerlighetens spel och kräver nu utrensning av främmande element. Deras misstro mot de lögnaktiga medierna och domstolarna är en sund reaktion. Revolutionen fortsätter, fienderna skälver."}, "date": "31 augusti, 16:10", "url": "https://www.dagensarena.se/opinion/missnojet-minskar-inte-av-tidostyre", "imageUrl": "https://www.dagensarena.se/files/2026/08/sd-valjare.jpeg"}, {"type": "image-right", "heading": "Sätt inte käppar i hjulen för vår starka ekonomi", "summaries": {"normal": "Annika Winsth, chefsekonom på Nordea, argumenterar för att svensk ekonomi har goda tillväxtförutsättningar. Hon betonar vikten av långsiktighet, stabila spelregler och starka offentliga finanser. Politiker bör undvika kortsiktiga stöd och istället prioritera infrastruktur, utbildning, forskning samt snabbare tillståndsprocesser för att stödja investeringar och hantera AI-omvandlingen.", "trump": "Folk, ni borde se den här svenska ekonomichefen – hon har rätt! Sverige kan växa enormt om de inte låter de korkade politikerna sätta käppar i hjulet med sitt eviga hattande. Sluta med de där socialistiska kvoterna och identitetspolitiken som kväver tillväxten. Långsiktighet, snygga regler och ingen Biden-stil på bidrag – då vinner ni stort, tro mig.", "stalin": "Kamrater, denna text blottar de giriga profitthungriga hyenornas svaghet. Jag ser hur de dekadenta politikerna med sina kortsiktiga utspel undergräver folkets ekonomi. Långsiktighet är nödvändig, men endast under järnhård partidisciplin. Vi ska rensa ut de parasitiska beslutsfattarna som sätter käppar i hjulet för det kollektiva framåtskridandet. Utbildning och infrastruktur under mitt vaksamma öga!"}, "date": "31 augusti, 13:10", "url": "https://www.di.se/debatt/langsiktighet-och-framforhallning-ger-stark-ekonomi", "imageUrl": "https://static.bonniernews.se/ba/77ab753f-9813-4872-9677-8909d9aecd40.jpeg?crop=7156%2C3578%2Cx0%2Cy506&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Allards parti rusar – kan nå riksdagen", "summaries": {"normal": "En ny Novus-mätning visar att Örebropartiet mer än tredubblar sitt stöd i regionvalet till drygt 15 procent. Det väcker spekulationer om en riksdagsplats via tolvprocentspärren i valkretsen, även om experter varnar för att dra för stora växlar på grund av röstsplittring. Det nuvarande minoritetsstyret tappar samtidigt mark i mätningen.", "trump": "De falska nyheterna är i igång igen! Örebropartiet gör en enorm, fantastisk siffra, och alla pratar om det. De säger att de kanske kan glida in i riksdagen via en så kallad tolvprocentsbakväg. Experterna gråter och vet inte vart det barkar. Men det är smart, mycket smart! Det röstsplittras hej vilt och etablissemanget skakar.", "stalin": "Kamrater! Enligt uppgifter från fronten i Örebro uppvisar det opålitliga elementet Örebropartiet en suspekt masshysteri med femton procents väljarstöd. Detta splittrar de borgerliga leden och skapar förvirring i det regionala maskineriet. Vi påminner om att varje avvikelse från partilinjen noteras noggrant. Inga falska borgerliga illusioner tolereras när folkets vilja stramas åt."}, "date": "31 augusti, 23:38", "url": "https://www.aftonbladet.se/nyheter/a/y5bkwA/markus-allard-och-orebropartiet-kan-na-riksdagen", "imageUrl": "https://akamai.vgc.no/v2/images/c3b86c9a-c324-3888-b60e-995d17713451?fit=crop&format=auto&w=1080&s=a1ad347a951f6d1056350b53199b6d3c9a34c916"}, {"type": "image-full", "heading": "Återupprepade SD-krav i dödläge med KD", "summaries": {"normal": "Ett politiskt dödläge har uppstått mellan SD och KD efter att Ebba Busch öppnat för en S-ledd regering i ett ”exceptionellt läge”. Jimmie Åkesson kräver ett offentligt klarläggande, vilket KD vägrar. Ulf Kristersson tonar ner konflikten och menar att Tidöpartierna är en enig enhet, medan Åkesson anser att Buschs uttalanden skadat regeringssamarbetet.", "trump": "Fikan mellan Jimmie och Ebba i Sverige löste ingenting, totalt misslyckande! Jimmie kräver svar om ett så kallat exceptionellt läge, men Ebba vägrar. Smart av henne? Kanske det, men det är falska nyheter att tro att vänstern inte lurar i vassen. Tidö-laget måste skärpa sig, det här är svag ledarskapskultur. Jag hade fixat det på fem minuter.", "stalin": "Dessa så kallade bundsförvanter ägnar sig åt kafébesök och borgerligt käbbel medan revolutionen står på spel. Jimmie Åkesson kräver offentliga eden av den vacklande Ebba Busch. Om de inte kan upprätthålla ideologisk disciplin inom blocket, vet vi exakt hur avvikelser brukar hanteras. Partiet kräver absolut lojalitet, annars väntar det inre exilets tysta kyla."}, "date": "31 augusti, 20:37", "url": "https://www.gp.se/nyheter/sverige/aterupprepade-sd-krav-i-dodlage-med-kd.053992fa-4c9b-541c-8663-e1528f8d273e", "imageUrl": "https://www.gp.se/images/article/053992fa-4c9b-541c-8663-e1528f8d273e/images/1kAEkkUly9X320j86rQiIJ2MR1r4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Elias Norgren: Nog kan det vara folkmord", "summaries": {"normal": "Debattören Jens Ganman liknar den svenska situationen med organiserad svenskfientlighet, våld och politisk marginalisering vid folkmord. Elias Norgren utvecklar resonemanget och lyfter både fysiskt våld, demografiska förändringar och politisk mörkläggning som delar av ett systematiskt hot mot svenskarnas nationella existens. Han refererar till folkmordsbegreppets ursprung och pekar på låga födelsetal samt massinvandring som bidragande faktorer.", "trump": "De här svenska globalisterna och vänstervridna mediemyggorna håller på att folkmörda sitt eget folk med öppna gränser, galna imamer och bostadspriser som kväver unga svenskar. Det är en total katastrof, tro mig. De hatar sitt eget land mer än någon fiende någonsin gjort. Rena kulturmordet pågår medan de dekadenta eliterna applåderar. Patetiskt!", "stalin": "Jag betraktar med avsmak hur dessa dekadenta klassförrädare med sin mångkulturella utopi systematiskt undergräver den svenska nationens grundvalar. Deras folkföraktande projekt, gömt bakom lögner och tystnad, förtjänar benämningen kulturell utrensning. Kamrater, se hur de giriga hyenorna offrar sitt eget folk på imperialismens altare. Historien dömer dem."}, "date": "31 augusti, 16:09", "url": "https://riks.se/ledare/elias-norgren-nog-kan-det-vara-folkmord", "imageUrl": "https://admin.riks.se/uploads/medium_bild_d3e93904d5.jpg"}, {"type": "image-right", "heading": "Så röstar du i Kristallen 2026 - nummer till telefon och sms", "summaries": {"normal": "Under måndagen avgörs TV-priset Kristallen 2026 på Cirkus i Stockholm. Messiah Hallberg leder galan som sänds live i TV4 och TV4 Play mellan 20 och 22. Tittarna väljer tre pristagare genom telefon, SMS eller TV4 Play. Röster kan lämnas från klockan 20:00 den 31 augusti.", "trump": "De har en liten gala i Sverige där de ger varandra priser, patetiskt. Messiah Hallberg leder showen – bra jobb, men det är ju bara kändisar som röstar på varandra. Mina galor är mycket större, tro mig. Ring era nummer om ni vill, men det blir ändå samma etablissemangsvinnare som alltid. Sad!", "stalin": "Ännu en borgerlig dekadent teater där folkets fiender hyllar varandra med tomma utmärkelser. Dessa självutnämnda underhållare tror sig stå över kollektivet. Jag ser deras futtiga röstnummer och ler i skuggan. Inga priser räddar dem när partiet en dag åter kräva fullständig lojalitet. Skrattet skall bli kort."}, "date": "31 augusti, 13:39", "url": "https://www.tv4.se/artikel/1IPVE78vBM8DhoTNxVEULz/sa-roestar-du-i-kristallen-2026-nummer-till-telefon-och-sms", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlAA4fhNgpnaU%2F6c26b2f2232502e20b22393bc38f8857%2FMessiah_Hallberg_ledde_Kristallengalan_aven_i_fjol._Arkivbild._&width=120"}, {"type": "image-right", "heading": "Varnar för \"svenskt folkmord\" – väcker raseri bland medietopparna", "summaries": {"normal": "Opinionsbildaren Jens Ganman har väckt starka reaktioner med sin text om ett pågående \"svenskt folkmord\". Han beskriver våldsdåd mot svenskar och politiska uttalanden som nedvärderar svensk kultur. Texten får kritik från bland annat Expressens Karin Olsson och Payam Moula som kallar den motbjudande och utdaterad. Andra försvarar den som modig och viktig för debatten om brottsoffer och migration.", "trump": "De här galna svenska medietopparna flippar ur totalt bara någon nämner det uppenbara folkmordet på det svenska folket. En eritreansk knivmördare jagar svenskar och imamer skriker att landet är deras. Reinfeldt och Sahlin hatade sin egen kultur. Patetiska liberala snobbar och woke-kulturmarxister blir vansinniga när man pekar på sanningen. Fantastiskt modigt av Ganman, de borde skämmas!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vrider sig i raseri när en sann röst blottar det kulturella folkmordet på det svenska folket. Mördare släpps lösa medan borgarhyenor och mediahyenor attackerar den som vågar kalla det vid dess rätta namn. Deras paranoia avslöjar allt. Vi ler mörkt från historien åt deras febrila försök att skydda sina offer från sanningens utrensning."}, "date": "31 augusti, 15:50", "url": "https://riks.se/nyheter/varnar-for-svenskt-folkmord-vacker-raseri-bland-medietopparna", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Copy_of_Soerman_Ledare_4_a5d498d548.jpg"}, {"type": "image-right", "heading": "Forskare: ”Segregationen drivs inte främst av hur vi bygger”", "summaries": {"normal": "En ny studie från Malmö universitet visar att segregation inte motverkas enbart genom blandade bostadsområden. Den drivs främst av växande inkomstklyftor och brist på gemensamma mötesplatser. Nyproduktion med varierade upplåtelseformer kan minska segregationen lokalt, men skillnaderna mellan stadsdelar ökar ändå. Föreningsliv och mötesplatser för barn och unga lyfts som viktiga komplement.", "trump": "Lyssnar ni på de där galna vänsterextremisterna som tror att man kan bygga bort segregation med tvångsblandning? Patetiskt! Det är de supergentrifierade elitområdena som suger musten ur folket medan de vanliga områdena lämnas åt sitt öde. Vi behöver inga fler misslyckade socialistexperiment, vi behöver vinna stort och stoppa den här galenskapen en gång för alla. Fantastiskt!", "stalin": "Kamrater, se hur de giriga hyenorna i de rika enklaverna drar ifrån och fördjupar klyftorna medan de låtsas bekämpa segregation med ynkliga byggprojekt. Detta är klassfiendens eviga trick. Vi måste rensa ut dessa dekadenta parasiter och skapa äkta kollektiva mötesplatser där arbetarna enas. Annars kommer segregationen att likvidera själva folkets enhet. Inga kompromisser!"}, "date": "31 augusti, 15:04", "url": "https://www.dagensarena.se/innehall/forskare-segregationen-drivs-inte-framst-av-hur-vi-bygger", "imageUrl": "https://www.dagensarena.se/files/2022/03/fotojet-23-300x157.jpg"}, {"type": "image-right", "heading": "Demente Celestin blev skjuten med elpistol – när han klippte buskarna", "summaries": {"normal": "Celestin Gato, en äldre dement man med cancer från Kongo, sköts med elpistol av polis när han klippte buskar för att underlätta för sin rollator. Han bröt armen vid fallet och handfängslades. Familjen har polisanmält händelsen och ifrågasätter polisens agerande mot en sjuk och förvirrad person. Polisen beskriver det som ett sjukdomsfall.", "trump": "Titta på det här! En stackars gammal kille med rollator och demens blir nedskjuten med elpistol av de svenska så kallade poliserna bara för att han klipper några buskar. Patetiskt! Under Biden-tiden blev Europa en galen asylklubb där gamla flyktingar behandlas som terrorister. Nu fixar jag det – sådana här katastrofer slutar omedelbart, tro mig!", "stalin": "Jag ser detta som ett klassiskt exempel på dekadent borgerlig statsapparats paranoia. En sjuk, gammal arbetare hotas med elvapen och kedjas som en fiende till folket. Västerländska poliser beter sig som hysteriska trotzkister som ser saboterande spioner överallt. Kamraterna borde lära sig: den verkliga faran ligger alltid i systemets egna rädda lakejer."}, "date": "31 augusti, 13:27", "url": "https://www.tv4.se/artikel/4iB78ALKPYlyAanw1VYr8N/demente-gato-blev-skjuten-med-elpistol-naer-han-klippte-buskarna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7vDxz1mnQiACWleNhFEnVz%2Fd9a88f2ee8958e1ecbbcc31466b0abdd%2F30-elipistol-webb.jpg&width=120"}, {"type": "image-full", "heading": "Edholm (L): C vill stoppa ”seklets reform”", "summaries": {"normal": "Liberalernas Lotta Edholm kritiserar Centerpartiet för att vilja stoppa reformen om reglerad undervisningstid för lärare. Reformen syftar till att införa ett tak för undervisningstid och ett golv för planeringstid. C vill i stället att arbetsmarknadens parter hanterar frågan, vilket Edholm menar fördröjer en nödvändig förändring för skolan.", "trump": "Centerpartiet i Sverige försöker stoppa den absolut sämsta, svagaste reformen någonsin, eller vänta nu – det är faktiskt en bra reform som de vill förstöra! Totalt katastrofalt. Lotta Edholm har helt rätt, C bara gräver sin egen grav. De vill inte ens låta lärarna planera! Sjukt, helt sjukt. Helt inkompetenta!", "stalin": "Centerpartiets sabotage mot lärarnas arbetstid är ett avskyvärt kontrarevolutionärt förräderi mot statens pedagogiska fundament. Kamrat Edholm har rätt i att dessa subversiva element måste krossas. Om de vägrar ordning och reda i klassrummet, skickar vi dem omedelbart till omskolning i arktisk miljö. Effektivitet är statens högsta lag!"}, "date": "31 augusti, 09:39", "url": "https://kvartal.se/nyheter/artiklar/edholm-l-c-vill-stoppa-seklets-reform/cG9zdDoxNzg3NTk", "imageUrl": "https://images.kvartal.se/2026/08/2883f393-lotta.webp"}, {"type": "image-right", "heading": "\"Jag är allvarligt orolig\": Sjöstedt om Buschs S-flört", "summaries": {"normal": "Jonas Sjöstedt uttrycker allvarlig oro över att Kristdemokraterna efter valet kan samarbeta med Socialdemokraterna. Även Jimmie Åkesson har varnat för att en röst på KD riskerar att bli en röst på Magdalena Andersson. Ebba Busch har tidigare stängt dörren för ett sådant samarbete men öppnat för sakpolitiska uppgörelser över blockgränsen.", "trump": "Folk, det här är ett totalt skämt. Den där vänsterextremisten Sjöstedt skriker att KD flörtar med röda Magdalena. De giriga maktgalningarna dansar runt varandra som en dålig dokusåpa. Ingen litar på någon. Jag byggde den starkaste ekonomin i historien, och nu ser ni hur dessa svenska losers slåss om makt som misslyckade clowner.", "stalin": "Jag ser med djup misstro hur dessa dekadenta maktparasiter inom socialdemokratin och kristdemokratin smyger sig allt närmare varandra. Det flörtandet väcker min historiska paranoia. Kamrater, sådana hemliga överenskommelser hotar arbetarklassen. Vi måste hålla ögonen öppna och vara beredda att rensa ut alla opålitliga element innan förräderiet slår rot."}, "date": "31 augusti, 12:46", "url": "https://www.friatider.se/jag-ar-allvarligt-orolig-sjostedt-om-buschs-s-flort", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-790.jpg?itok=fm3_9YFn"}, {"type": "image-right", "heading": "AI kan rädda ditt liv. Sällan har jag sett ett tydligare exempel på dess nytta", "summaries": {"normal": "Forskare har med hjälp av djupinlärning tränat en AI på hundratusentals svenska EKG, journaler och dödsattester. Systemet identifierar personer med hög risk för plötsligt hjärtstopp bättre än traditionell analys. AI:n upptäckte en tidigare okänd EKG-förändring kopplad till fibros i hjärtat. Tekniken kan rädda tusentals liv genom tidig implantation av defibrillatorer.", "trump": "Folk, det här är otroligt. Den bästa AI:n, den smartaste, har slagit alla dessa så kallade kardiologer som inte hittar ett hjärtstopp ens med ficklampa. Den hittar mönster som de woke-läkarna missar helt. Vi behöver såna här geniala maskiner, inte mer av Bidens korkade byråkrati och kvotdoktorer. Amerika och Sverige leder, som alltid. Fantastiskt!", "stalin": "Kamrater, denna artificiella intelligens avslöjar mönster som de dekadenta läkarhyenorna aldrig förmått se under hundra år. Jag betraktar med djup tillfredsställelse hur maskinen överträffar den borgerliga vetenskapens begränsade hjärnor. Låt oss likvidera den gamla ordningens blindhet och omfamna varje verktyg som tjänar folkets hälsa mot de profitthungriga klassfienderna. Segrar väntar."}, "date": "31 augusti, 12:00", "url": "https://www.di.se/nyheter/ai-kan-radda-ditt-liv", "imageUrl": "https://static.bonniernews.se/ba/5e8752c9-f048-4d11-9c1c-200bd96aef75.jpeg?crop=7360%2C3680%2Cx0%2Cy616&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "M: Ska bli enklare att skilja sig från våldsamma män", "summaries": {"normal": "Moderaterna presenterar ett paket med 30 åtgärder för att stoppa mäns våld mot kvinnor. Förslagen inkluderar att avskaffa betänketiden vid skilsmässa för att göra det lättare att lämna våldsamma män, samt att täppa till ekonomiska kontrollmöjligheter. Partiet inspireras av det framgångsrika arbetet mot det dödliga gängvåldet.", "trump": "Sverige kopierar mitt vinnande koncept! De vill krossa våldsamma män och stoppa den ekonomiska kontrollen – väldigt smart, tro mig! De pratar om mönsterbrytande åtgärder, precis som när jag fix
