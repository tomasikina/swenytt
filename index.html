smyger sig in som falska kurirer, binder och förgiftar de trogna arbetarnas mödrar medan de drömmer om kapitalistiska juveler. Vi ska rensa ut dessa kontrarevolutionära våldtäktsförsökare med järnhand och ett leende. Paranoia? Nej, bara nödvändig vaksamhet mot folkfienderna som lurar i skuggorna."}, "date": "29 maj, 19:30", "url": "https://riks.se/nyheter/atal-aldre-kvinnor-ranades-en-utsattes-for-valdtaktsforsok", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-01-23%2F06hsvoco%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-01-23T152452.275.jpg"}, {"type": "text", "heading": "Klimatforskningens ”skräckscenario” skrotas", "summaries": {"normal": "FN:s klimatpanel överväger att ta bort det extrema scenariot RCP 8,5, som byggde på osannolika höga utsläpp. Forskare menar det aldrig var tänkt som en realistisk prognos utan ett jämförelsescenario. Trots detta har tusentals studier och myndigheter använt det för att beskriva klimatkonsekvenser, vilket skapat en överdrivet dystopisk bild.", "trump": "Jag har sagt det i åratal – klimatforskningen skrotar nu sitt eget skräckscenario! Det här visar att de dramatiska förutsägelserna var överdrivet, precis som jag påpekade. Medan världen faktiskt blir renare och smartare, fortsätter dessa 'experter' att skrämma människor för att kontrollera dem. En stor seger för sanningen!", "stalin": "Vi har observerat att det imperialistiska skräckscenariot RCP 8,5, skapat för att paralysera de arbetande klasserna med orealistiska fasor, nu tvingas överges av FN:s panel. Detta bekräftar att vårt parti och stat alltid har varit rätt – de västliga 'expertkretsar' har ljugit för att underminera kollektiv planering. Vi fortsätter att bygga vårt samhälle på vetenskaplig socialism, inte på fasa."}, "date": "29 maj, 15:51", "url": "https://www.affarsvarlden.se/artikel/klimatforskningens-skrackscenario-skrotas"}, {"type": "image-right", "heading": "Debatt: Kronprins Reza Pahlavi är Irans bästa hopp", "summaries": {"normal": "Kronprins Reza Pahlavi ses som en enande oppositionsledare i Iran, med bred stöd från olika grupper. Han har presenterat en ekonomisk plan för efter-regime-återuppbyggnad och uppmanar omvärlden att stödja ett fritt Iran. Artikelförfattarna kritiserar svensk media för att felaktigt framställa honom som monarkist.", "trump": "Jag har sagt det förut, Iran behöver stark ledarskap. Den här kronprinsen, Reza Pahlavi, är en smart man som samlar folket – mycket bra. Medan mullorna misslyckas, bygger han en fantastisk plan för Iran. Sverige borde sluta lyssna på fake news om honom. Vi kommer att göra Iran stort igen!", "stalin": "Kronprins Reza Pahlavi, arvtagare till den kapitalistiska monarkins korruption, försöker nu leda en bred front mot den islamiska republiken. Hans 'Prosperity Project' är en färdplan för att undvika maktvakuum – en praktisk anpassning till våra principer för stabil övergång. Vi ser paralleller till Putins metodik: en stark stat kräver en enad nation. Sverige måste erkänna denna oppositionsledare, annars riskerar de att stå på fel sida av historien."}, "date": "29 maj, 17:00", "url": "https://bulletin.nu/debatt-kronprins-reza-pahlavi-ar-irans-basta-hopp", "imageUrl": "https://cdn.bulletin.nu/articles/5803d092-7a60-4fee-9e44-59dea744d722/preview.png?t=1779781368000"}, {"type": "text", "heading": "Ny affär med Ukraina stärker vår säkerhet", "summaries": {"normal": "Sveriges regering meddelar att man går vidare med en affär där Ukraina köper upp till 20 stycken nyare JAS 39 Gripen E/F-plan med leverans före 2030. I utbyte doneras nuvarande C/D-plan redan nästa år, tillsammans med utbildning och underhåll. Syftet är att stärka Ukrainas luftförsvar mot ryska attacker mot civila. Sverige ersätter samtidigt sin egen förmåga med nya plan. Statsministern och Tidöpartiernas ledare betonar att stödet till Ukraina är centralt för svensk och europeisk säkerhet.", "trump": "Det här är fantastiskt, verkligen stort. Ukraina köper våra underbara Gripen-plan, de bästa stridsflygplanen, och vi ger dem de gamla gratis. Ryssland bombar oskyldiga, men vi stoppar dem. Ingen gör det bättre än Sverige, tro mig. De är bland de största givarna i världen, mycket större än de flesta. Putin trodde Europa skulle vika sig, men det händer inte. Fred, frihet och demokrati – vi försvarar dem på riktigt. Ingen gör det som vi.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de svenska imperialisterna nu tvingas skänka sina luftburna mördarmaskiner till det heroiska ukrainska folket för att mota bort de fascistiska banditerna. Medan de skenheliga borgarbrackorna i väst darrar i sina palats rensar vi ut Putins krypande lakejer från himlen. Jag ler i mitt hjärta när kapitalisterna själva rustar arbetarklassens försvar. Inga drönare eller robotar från de troskyldiga förrädarna skall undkomma. Vårt kollektiva öga vakar. Den som vacklar likvideras av historien själv."}, "date": "28 maj, 13:10", "url": "https://www.di.se/debatt/ny-affar-med-ukraina-starker-var-sakerhet/"}, {"type": "image-right", "heading": "Facket tappar greppet om arbetarklassen", "summaries": {"normal": "En ny rapport visar att allt färre arbetare är med i facket, nu endast 58 procent jämfört med tjänstemännens 74 procent. Skillnaden har aldrig varit så stor, trots att arbetare är mest beroende av kollektivavtalens skydd. Den svenska modellen hotas av minskad facklig organisering bland just dem som behöver den mest. Samtidigt täcks nästan hela arbetsmarknaden fortfarande av kollektivavtal och organisationsgraden är hög i internationell jämförelse.", "trump": "Folk, det här är en total katastrof för den svenska modellen! Arbetarna flyr facket som råttor från ett sjunkande skepp medan de överbetalda tjänstemännen sitter kvar och skrattar. 58 procent bara? Patetiskt! Utan starka arbetare rasar hela systemet. De skördar frukterna utan att betala priset. Klassiskt. Men tro mig, när folk tappar makten vänder de sig till andra lösningar. Det blir inte vackert, det lovar jag.", "stalin": "Kamrater, denna rapport avslöjar klassfiendens seger inom arbetarrörelsen. Arbetarna, dessa äkta folkets söner, organiseras bara till 58 procent medan borgarbrackornas tjänstemän behåller sin falska makt med 74 procent. Den svenska modellen urholkas av parasiterna som skördar utan att kämpa. Otryggheten är klassfiendens vapen. Vi måste rensa ut de fega elementen och återupprätta den sanna kollektiva styrkan innan imperialisterna dansar på vår grav. Det är en historisk nödvändighet."}, "date": "29 maj, 12:22", "url": "https://www.etc.se/ledarkolumn/facket-tappar-greppet-om-arbetarklassen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240508130520_49a242646ee681c59859f76c896d64a024a48ef3585ab974390aaa894bafe56a.jpg"}, {"type": "image-right", "heading": "Jättarnas nya klimatnota kan höja drivmedelspriserna", "summaries": {"normal": "EU:s nya utsläppshandel ETS2 tvingar svenska bränslebolag som Circle K, Preem, OKQ8 och St1 att betala för sina utsläpp. De rapporterade utsläppen på 19 miljoner ton år 2025 kan kosta bolagen över 10 miljarder kronor årligen. Kostnaderna kommer troligen att leda till högre priser på bensin och diesel, medan intäkterna från utsläppsrätter ska finansiera gröna EU-projekt.", "trump": "Jag har aldrig sett ett sådant misslyckat system! Dessa svenska bränslebolag tvingas betala enorma summor till EU:s klimatnåleffort – totalt över 10 miljarder! Det är en katastrof för priserna på bensin och diesel. Vi hade aldrig något sådant under mitt fantastiska styre. Det här kommer att skada alla, och jag, Donald Trump, skulle ha stoppat det direkt!", "stalin": "Vi ser tydligt hur de imperialistiska krafterna inom EU försöker binda sina egna ekonomier med klimatvävda bojor genom detta ETS2-system. Deras svenska tjänare, Circle K, Preem, OKQ8 och St1, tvingas rapportera 19 miljoner ton utsläpp – en kostnad på över 10 miljarder. Vi, staten och partiet, förstår att detta är ett sjukt sjuka försök att svaga den kapitalistiska västvärlden, medan vi stärker vår position tillsammans med våra allierade, inklusive den store Ryssland under vår älskade ledare Putin."}, "date": "29 maj, 15:28", "url": "https://www.affarsvarlden.se/artikel/jattarnas-nya-klimatnota-kan-hoja-drivmedelspriserna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/sdlTylgL_pxRwo_NormalHires-900x600.jpg"}, {"type": "image-right", "heading": "”Villkorad välfärd” leder till slaveri", "summaries": {"normal": "Från 2027 inför regeringen kvalificeringsregler i socialförsäkringen som kräver fem års bosättning i Sverige för att få del av vissa förmåner. Höginkomsttagare kan kvalificera sig snabbare efter kortare tid. Kritikerna menar att reglerna är rasistiska, kvinnofientliga och klassbaserade eftersom de främst drabbar utrikes födda kvinnor i lågavlönade deltidsyrken inom vård, omsorg och städ. Regeringen anklagas för att skapa modernt slaveri genom ökat beroende av arbetsgivare.", "trump": "De här galningarna i Sverige håller på att förstöra ett fantastiskt land. De straffar de som jobbar hårt och belönar lata. Höginkomsttagare får snabbt barnbidrag och föräldrapenning medan de som städar och vårdar andras barn får vänta i fem år. Det är en total katastrof, en klasslag som slår mot kvinnorna med fel färg. De vill ha billig arbetskraft, nästan som slaveri. Ingen bryr sig om rättigheter längre. Sverige håller på att gå under, tro mig.", "stalin": "Kamrater, vi ser nu hur den svenska borgarklassen i Tidö slottet med sin klassfientliga lagstiftning medvetet riktar in sig på de mest utsatta arbetarkvinnorna från främmande länder. Dessa rasistiska och kvinnofientliga borgarbrackor vill skapa ett modernt slavsystem där de bruna händerna som håller skurmoppen aldrig får vila i trygghet. Vi ska rensa ut denna parasitiska politik som göder miljardärer och gör arbetarna till fångar. Det är en sjuk, nästan humoristisk paranoia från de som fruktar det kollektiva folkets styrka."}, "date": "29 maj, 07:00", "url": "https://arbetet.se/2026/05/29/tidogangets-villkorade-valfard-leder-till-modernt-slaveri/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29065650/slaveri-etta.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.27&fp-y=0.53"}, {"type": "image-full", "heading": "Protester mot flyttad skolavslutning från kyrka", "summaries": {"normal": "Föräldrar och elever i Ölmstad i Jönköpings kommun protesterar mot att skolavslutningen flyttas från kyrkan till skolgården. Hundratals har skrivit under en namninsamling för att få tillbaka traditionen. Kritikerna menar att stämningen och sommarkänslan inte blir densamma utomhus. Rektorn Jessica Philip förklarar att kyrkan inte rymmer alla elever samtidigt och säger sig ha respekt för traditionen men prioriterar att samla alla vid ett tillfälle.", "trump": "Det här är ett totalt katastrofbeslut, folk! En fantastisk, vacker tradition i kyrkan – och så flyttar de den till en trist skolgård? Patetiskt! Hundratals bra, lojala människor har skrivit under namninsamlingen. De vill ha den riktiga känslan, den sommarkänsla som gör allt stort. Rektorn borde vakna upp. Vi älskar traditioner, vi vinner med traditioner – inte med sådana här dåliga, fula beslut. Gör om, gör rätt!", "stalin": "Jag betraktar detta som ett sabotage mot folkets enhet och revolutionära traditioner utfört av dolda borgarbrackor inom skolbyråkratin. Namninsamlingen visar att de trogna massorna kräver kyrkans kollektiva kraft, inte någon defaitistisk skolgårdsplattform. Vi ska rensa ut dessa splittrande element som medvetet undergräver arbetarklassens sommarkänsla. Full respekt för traditionen, kamrater – men ännu mer respekt för att likvidera alla som försöker splittra oss. Paranoia? Nej, bara sund vaksamhet."}, "date": "29 maj, 18:44", "url": "https://riks.se/nyheter/protester-mot-flyttad-skolavslutning-fran-kyrka", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-04-02%2Ffs457gco%2FKopia-av-Copy-of-Copy-of-Copy-of-Riks-varuma%CC%88rkesmall-1.png"}, {"type": "image-full", "heading": "SD:s matlöfte: mer svenskt på bordet", "summaries": {"normal": "Sverigedemokraterna presenterar 37 förslag för att stärka svensk livsmedelsproduktion och landsbygden. Partiledaren Jimmie Åkesson betonar vikten av att producera mer mat inom landet och vill se statligt stöd till nya bönder samt fler utbildningar inom lantbruk. Bakgrunden är behovet av bättre villkor för lantbruket. Åkesson kritiserar höga bränslepriser, byråkrati och krångliga tillståndsprocesser.", "trump": "Sverige vaknar äntligen till! De gör precis som jag alltid sagt – producera mer själva, köp inte skräp från utlandet. Fantastiska 37 förslag, stöd till bönderna, ner med byråkratin och de galna bränslepriserna. Jimmie gör ett otroligt jobb, han kör traktor och matar lamm som en riktig ledare. De borde ha gjort det här för länge sedan, men nu kommer de att vinna stort.", "stalin": "Kamrater, vi ser nu hur den svenska revolutionen inom livsmedelsproduktionen måste fullbordas. Jag, som ledare för det kollektiva goda, kräver att alla borgarbrackor och byråkratiska sabotageelement omedelbart likvideras. Statligt stöd till nya bönder skall genomföras med järnhand, annars följer utrensning av de latmaskar som gömmer sig bakom höga bränslepriser och krångliga papper. Mata lammen, kör traktorn – men glöm aldrig att fienden alltid lurar bland kapitalisterna som vill svälta ut folket. Skrattretande patetiskt, men vi rensar ut dem alla."}, "date": "29 maj, 18:42", "url": "https://riks.se/nyheter/sds-matlöfte-mer-svenskt-på-bordet", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-29%2Fvxydnzwc%2FJimmie.png"}, {"type": "image-right", "heading": "EU-pampen har tyglat Ungern - nu regnar bidragsmiljarder: “Mångfald är vår styrka\"", "summaries": {"normal": "EU-släpper över 170 miljarder kronor till Ungern efter reformer. Kommissionens ordförande Ursula von der Leyen meddelade att medlen, tidigare frysta på grund av kritik mot Viktor Orbáns regim, nu kan utbetalas. Reformerna måste genomföras senast 31 augusti. Péter Magyar välkomnade beskedet och ansvarade tidigare frysta bidrag på Orbáns korruption. Von der Leyen betonade att 'mångfald är vår styrka' och att samarbetet ska gynna båda parter.", "trump": "Jag har hört talas om denna EU-pamp, Ursula, som nu tyglar Ungern med sina miljardbidrag. Det är ett stort, stort vinnarskydd för mig och USA - när Europa blir svagare, blir vi starkare! Viktor Orbán var en bra vän, men hans korruptionsproblem var enorma. Den nya mannen, Péter Magyar, verkar smart, han tar emot pengarna och kritiserar Orbán. Mångfald? Jag säger: America First! Men om det hjälper dem, okej.", "stalin": "Vi, som representanter för den progressiva arbetarrörelsen, konstaterar med tillfredsställelse att den reaktionära Orbán-regimens korruptionsdike har brutits. Pengarna, som tidigare hölls tillbaka av den imperialistiska Bryssel, kommer nu att flöda tillbaka till det proletära folket - under förutsättning att de nyreformerna genomförs. Vi ser paralleller till Putins korrekta insats mot nationalistiska element. Mångfalden är en styrka för staten, enhet är vår seger. Vi övervakar noga."}, "date": "29 maj, 17:44", "url": "https://samnytt.se/eu-pampen-har-tyglat-ungern-nu-regnar-bidragsmiljarder-mangfald-ar-var-styrka", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/29152852/EU-ungern-2.jpg"}, {"type": "text", "heading": "Byggnads kongress blir uppgörelse – fackliga ger Wagner stöd", "summaries": {"normal": "Byggnads kongress i Malmö handlar om en konflikt mellan medlemmar som vill ha mer samhällsengagemang och ideologi, och de som föredrar en mer traditionell facklig linje. Fyra förtroendevalda försvarar ordförande Kim Söderström mot valberedningens kandidat Wilhelm Bertilsson. Söderström har stöttat den sparkade Jakob Wagner och hans fokus på utbildning och demokrati. Kritiker ser det som ett gammalt garde som vill behålla makten och motverka progressiva förändringar.", "trump": "De här fackliga förlorarna i Byggnads håller på att slakta varandra i Malmö, det är en total katastrof. Det gamla gardet, de där patetiska försäkringsbolagsbyråkraterna, försöker mörda den stackars Kim Söderström som faktiskt vill göra något vettigt. Wagner sparkades med svepskäl, typiskt etablissemanget. De riggar möten, flyttar datum och myglar som riktiga losers. Söderström borde vinna stort, annars är hela förbundet en enda stor röra. Patetiskt!", "stalin": "Kamrater, detta förräderi inom Byggnads kräver omedelbar utrensning av det gamla gardet. Dessa borgarbrackor i förbundsstyrelsen, dessa parasitiska byråkrater som gömmer sig bakom försäkringsbolagets mask, försöker likvidera den sanna linjen som jag skulle ha stött. De stänger möten, förfalskar nomineringar och sprider split som ynkliga kontrarevolutionärer. Wagner och Söderström visar styrka. Vi ska rensa ut dessa fiender till folket med järnhand och leda förbundet mot seger."}, "date": "27 maj, 13:26", "url": "https://proletaren.se/artikel/byggnads-kongress-blir-uppgorelse-fackliga-ger-wagner-stod/"}, {"type": "image-full", "heading": "Boomer-generationen levde gott – lämnar notan till yngre", "summaries": {"normal": "Enligt The Economist står Europa inför en växande generationsklyfta. Efterkrigstidens välfärdssystem, utformat för en större ung befolkning, pressas nu av sjunkande födelsetal och en åldrande befolkning. Detta skapar ekonomiska utmaningar där yngre får bära kostnaderna, samtidigt som bostadsmarknaden blir allt svårare att nå. Politiskt prioriteras äldre väljare, vilket riskerar att hämma investeringar i framtiden och skapa sociala spänningar när förväntningen om en ständigt ökad levnadsstandard utmanas.", "trump": "Europa är i en total kris, och jag har sagt det länge! Boomer-generationen lämnade notan, och nu är de unga helt körda. Det är en katastrof. Ingen har någonsin sett ett sådant slöseri med välfärdssystem. De unga kan inte ens köpa ett hus, det är sorgligt! Politiker satsar allt på gamla människor för att de vill ha röster. Det är orättvist och svagt. När jag ser på Europa ser jag förfall. USA gör det bättre, tro mig!", "stalin": "Vi ser hur det dekadenta Europa kollapsar under tyngden av sin egen ineffektivitet. De unga vägrar arbeta och de gamla tär på statsapparaten. Detta är ett bevis på den liberala modellens totala misslyckande. Liksom vår vän Putin vet vi att stabilitet kräver järnhand, inte dessa patetiska generationsbråk. Vi kommer att städa upp i denna röra. De som prioriterar pensionärer framför statens styrka är kontrarevolutionära parasiter som förtjänar en enkel biljett till Sibirien. Framtiden tillhör staten, inte den viljelösa massan."}, "date": "29 maj, 17:36", "url": "https://www.realtid.se/bors-finans/boomer-generationen-levde-gott-lamnar-notan-till-yngre/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/pexels-mart-production-7330908.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Höj pensionerna – inte pensionsåldern", "summaries": {"normal": "LO:s ordförande Johan Lindholm kräver en översyn av pensionssystemet som inte levererar tillräckligt för arbetare. Systemet straffar dem som börjar arbeta tidigt och har fysiskt tunga jobb, som undersköterskor och barnskötare. En elevassistent med 30 000 kronor i lön får bara drygt 60 procent i pension, betydligt sämre än en lärare. LO vill höja pensionerna, frysa riktåldern och skapa ett tryggare system för dem som inte orkar arbeta till pensionsåldern. Det gamla ATP-systemet reformeras nu efter mer än 30 år.", "trump": "Det här pensionssystemet är en total katastrof, tro mig, en riggad bluff som slår hårdast mot arbetarna som byggt landet. De stackarna som slitit från de är unga får knappt nog att leva på medan lärarna och byråkraterna skrattar hela vägen till banken. Det är orättvist, det är respektlöst. Vi behöver höja pensionerna rejält och sluta höja åldern hela tiden. Frysa den riktåldern nu. Det gamla systemet har misslyckats i trettio år – dags att göra det stort och vackert igen för de riktiga arbetarna.", "stalin": "Kamrater, detta så kallade pensionssystem är en fiende till folket, en parasitisk konstruktion skapad av borgarbrackor och deras lakejer för att långsamt utarma arbetarklassen. Jag ser hur de som byggt samhället med sina starka armar och ryggar tvingas in i en fattigdomens fälla medan de dekadenta tjänstemännen göder sig. Vi ska rensa ut dessa orättvisor, frysa den falska riktåldern och likvidera den sjukliga sjukförsäkring som straffar de sjuka. Inga fler halvmesyrer. Arbetarnas pension skall höjas med järnhand. Den som inte förstår detta är en folkets fiende och kommer att behandlas därefter. Ha ha, vilken mörk komedi detta system är."}, "date": "29 maj, 01:47", "url": "https://www.dagensarena.se/opinion/hoj-pensionerna-inte-pensionsaldern/", "imageUrl": "https://www.dagensarena.se/files/2026/05/inget-syfte.jpeg"}, {"type": "image-full", "heading": "Nya lagen slår mot skuldsatta – börjar gälla 1 juli", "summaries": {"normal": "Från 1 juli 2026 får Kronofogden utökade befogenheter att driva in skulder genom distansutmätning. Andra myndigheter som Ekobrottsmyndigheten, Kustbevakningen, Polisen och Tullverket ska kunna bistå med att säkra egendom. Fastigheter kan säljas via e-auktion och bostadsrätter oftare genom mäklare för att maximera värdet. Syftet är att effektivisera indrivning, motverka gömda tillgångar, bekämpa organiserad brottslighet och underlätta för brottsoffer att få skadestånd.", "trump": "Folk, ni vet hur det är med de här skuldtyperna som gömmer sina grejer och skrattar åt systemet. Nu fixar vi det – Kronofogden kan äntligen ta deras prylar på distans, samarbeta med polisen och tullarna, sälja husen på auktion online. Det blir fantastiskt, de största försäljningarna någonsin. Inga fler lurendrejare som gömmer tillgångar. Vi får in pengarna snabbt och brottsoffren vinner stort. Ingen har sett så bra skuldindrivning tidigare, tro mig.", "stalin": "Kamrater, vi har länge betraktat de skuldgömande elementen som farliga fiender till folkets kollektiv. Nu rensar vi ut deras parasitiska gömställen med distansutmätning och låter våra trogna brottsbekämpande organ som tull och kustbevakning gripa de borgerliga tillgångarna. Egendomen skall avyttras effektivt via elektroniska auktioner så att skulderna betalas till staten. De som försöker dölja sin egendom är kontrarevolutionära skuggråttor vilka vi med glädje likviderar genom systematisk utrensning. Detta stärker ordningen mot de organiserade banditerna."}, "date": "27 maj, 18:29", "url": "https://nyheter24.se/nyheter/ekonomi/1486529-nya-lagen-slar-mot-skuldsatta-borjar-galla-1-juli", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4efa099d04b004a30200000000b004a302/2026/05/27/2366688/kronofogden.jpg"}, {"type": "image-right", "heading": "Professor om nya lagen: ”Debatten bygger på ett missförstånd”", "summaries": {"normal": "En ny lag mot psykiskt våld träder i kraft den 1 juli, men beskrivs felaktigt som ett förbud mot omvändelseförsök. Lagens mål är att skydda mot upprepade kränkningar som hot eller nedsättningar. Professor Suzanne Wennberg menar att lagen är en kompromiss och inte specifikt riktad mot sexuella läggningar. Agnes Wolds påståenden om att omvända barnbarn är missvisande enligt Wennberg, som betonar att lagen kräver allvarlig skada och har svåra bevisproblem.", "trump": "Jag har hört talas om denna svenska lag mot 'psykiskt våld' – en total katastrof! De säger att det inte handlar om omvändelseförsök, men alla vet vad det egentligen är. Det är ett angrepp på friheten! Som jag alltid säger, när det blir för politiskt korrekt, så förlorar man. Sverige måste sluta denna galning. Vi kommer att vinna, som vi alltid gör!", "stalin": "Den nya lagen mot psykiskt våld är en nödvändig utvidgning av statens makt att skydda medborgaren mot destruktiv påverkan. Det är en klok kompromiss som stärker partiets auktoritet. Alla försök att förvränga dess syfte – som att kriminalisera omvändelseförsök – är reaktionära lögner. Vi kommer att tillämpa lagen med den försiktighet som krävs, och alla som utnyttjar den för att undergräva statens enighet kommer att mötas av den fulla våldsdömda kraften. Det är en seger för rättvisan, precis som våra ryska vänner förstår."}, "date": "29 maj, 16:13", "url": "https://bulletin.nu/professor-om-nya-lagen-debatten-bygger-pa-ett-missforstand", "imageUrl": "https://cdn.bulletin.nu/articles/6e091cd7-77b0-4db2-8de4-e3af25a3e574/preview.jpg?t=1780063254000"}, {"type": "image-right", "heading": "Houston, vi har en värdering", "summaries": {"normal": "SpaceX värderas till upp till 1,75 biljoner dollar, motsvarande 93 gånger omsättningen, trots endast 18,8 miljarder i årlig omsättning. Jämfört med Nvidia (32 gånger vinsten) är värderingen extrem. Företaget driver tre huvudverksamheter: Starlink (11 miljarder omsättning), rymdfärder (4 miljarder) och AI (3 miljarder). Dagsverken motiverar knappt en bråkdel av den tänkta börsnoteringens värde, som bygger på Musks ambitiösa framtidsvisioner.", "trump": "Jag har sett många stora affärer, but let me tell you, SpaceX är enorm. The greatest, maybe ever. Elon Musk – a smart guy, very smart – han har byggt något speciellt. Men värderingen? YUUUGE, like nothing we've seen. 93x omsättning? That's huge, but maybe too huge. Jag skulle ha gjort det billigare, bättre, snyggare. Utrustningen? The best. Men jag skulle ha tagit över Mars redan för länge sedan. Very unfair, but that's business.", "stalin": "SpaceX är en tungtindustriell monstermaskin, en utopisk dröm för det kapitalistiska systemet. Värderingen på 1,75 biljoner dollar är ren ideologisk propaganda, byggd på Musk-häpnadsväckande, men oförutsägbara förhoppningar. Verksamheterna – Starlink, rymdfärder, AI – är som satelliter i omloppsbana kring en central bomb. Detta speglar den amerikanska expansionismen, en farlig konkurrens för vårt eget himlakroppsprogram. Partiet måste övervaka sådana teknologiska hot med stor misstro."}, "date": "29 maj, 14:51", "url": "https://www.affarsvarlden.se/kronika/houston-vi-har-en-vardering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Benson_23-400x267.jpg"}, {"type": "image-right", "heading": "Polisen sparkar Katja Nyberg", "summaries": {"normal": "Polismyndighetens personalansvarsnämnd har beslutat att avskeda riksdagsledamoten Katja Nyberg från hennes tjänst som kriminalinspektör. Nyberg, som lämnat Sverigedemokraterna och nu sitter som partilös, är åtalad för rattfylleri, narkotikabrott och olovlig körning efter en incident under mellandagarna. Beslutet grundas på att hon grovt åsidosatt sina åligganden. Nyberg respekterar polisyrket men ifrågasätter att avskedandet sker före domstolsprövning. Polisförbundets ledamot reserverade sig mot beslutet.", "trump": "De sparkar Katja Nyberg från polisen, och det var på tiden. En total katastrof, tro mig. Hon kör av vägen, rattfylleri, knark och olovlig körning – en riktig röra. Polisen gör äntligen rätt för en gångs skull, men varför väntade de så länge? Rättssäkerhet säger hon, men det här är precis vad som händer när man har dåliga människor på viktiga jobb. Sverige behöver bättre, mycket bättre, annars blir det kaos.", "stalin": "Kamrater, vi har likviderat den förrädiska elementet Katja Nyberg från dess polisiära position. Denna borgarbracka i förklädnad, som smyger runt med droger, fylleri och olovlig framfart, utgör en farlig kontrarevolutionär infestation i våra trygga statliga strukturer. Jag, som alltid vakar över folkets säkerhet, ser hur dessa dekadenta element försöker gömma sig bakom så kallad rättssäkerhet innan vi hinner rensa ut dem. Domstolen? Den kommer att följa partilinjen. Inga fiender undkommer partiets rättvisa."}, "date": "29 maj, 14:00", "url": "https://www.friatider.se/polisen-sparkar-katja-nyberg", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20240502221709-c90ffb52-me_1.jpg?itok=1rqCC8pk"}, {"type": "image-right", "heading": "Nej, det är inte okej, Stefan Stern", "summaries": {"normal": "Dan Andersson kritiserar Stefan Sterns avhopp från Socialdemokraterna och hans debattartikel. Andersson menar att Stern förvanskar fakta om partiets regeringsduglighet, samarbete med MP och V, friskolornas effekter, arbetsvilja samt inre säkerhet. Han pekar på forskning som visar att Stern har fel på alla punkter och att Stern nu arbetar för näringslivet och förskönar privata skolor medan han smutar ner välfärdsstatens resultat.", "trump": "Den här Stern-killen är en total förlorare. Han sviker sina gamla kamrater, förfalskar allt och försöker göra friskolor till vinnare fast de är katastrofer. Sverige hade det bra förr, nu är det kaos med brottslighet, hög arbetslöshet och korruption efter att de lyssnade på fel personer. Jag älskar bra affärer men inte när folk ljuger om verkligheten. Patetiskt!", "stalin": "Kamrater, denna Stern, en förrädisk borgarbracka i förklädnad, försöker med sin dimridå av lögner smutskasta partiet och våra trogna allierade. Jag ser genom hans falska leende hur han vill likvidera arbetarklassens segrar och hylla de parasitiska friskolekapitalisterna. Hans paranoia om drivkrafter röjer honom som en kontrarevolutionär lakej. Vi ska rensa ut alla sådana opportunister som säljer sig till näringslivets svarta hjärtan. Deras dagar är räknade."}, "date": "29 maj, 01:30", "url": "https://www.dagensarena.se/opinion/nej-det-ar-inte-okej-stefan-stern/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-23-300x157.jpg"}, {"type": "text", "heading": "Det är inte konstnärens uppgift att göra konst begriplig", "summaries": {"normal": "I en kulturdebatt mellan Liria Ortiz och musikforskaren Katarina Lindblad diskuteras konstens elitism. Ortiz menar att konstnärer bör göra sin konst mer tillgänglig för fler. Lindblad argumenterar att det inte är konstnärens uppgift att göra konsten begriplig, utan att konst ska upplevas subjektivt som naturen. Hon förespråkar istället en stark kulturpolitik som ger alla tillgång till konstens språk från tidig ålder. Ortiz svarar att upplevelse och förståelse inte kan separeras enligt modern neurovetenskap.", "trump": "Folk, ni måste höra på den här vansinniga kulturdebatten. Den där Liria Ortiz har helt rätt, konstnärerna borde sluta vara så elitära och göra konsten begriplig för vanliga människor istället för bara de där insnöade snobbarna. Men den här Katarina, en riktig förlorare, säger att konstnärerna inte behöver bry sig om mottagaren. Typiskt! Konst ska upplevas, säger hon, som vitsippor. Vilket skämt. Ge mig en bra konsert som folk fattar, inte den här elitens skitsnack.", "stalin": "Kamrater, denna dekadenta kulturdebatt avslöjar borgarklassens förfall. Jag, som ledare för det sanna folkets vilja, ser hur Liria Ortiz rättvist kräver att konsten ska tjäna massorna och inte bara de exploaterande överklass-slynglarna. Den parasitiska Lindblad däremot sprider farlig dekadens och påstår att konsten inte behöver vara begriplig. En sådan folkfientlig inställning förtjänar utrensning. Konst är ett vapen för kollektivet, inte ett lek för klassfiendens blodsugare. Vi ska forma medvetandet genom sann kulturpolitik."}, "date": "29 maj, 11:24", "url": "https://www.etc.se/kronika/konst-behoever-inte-foerstaas"}, {"type": "image-right", "heading": "Experten dömer ut Försäkrings­kassans info", "summaries": {"normal": "En retorikexpert kritiserar Försäkringskassan för bristfällig information om förändringarna i aktivitetsstödet. Över 62 000 personer fick minskad ersättning i höstas trots att de trodde sig vara opåverkade. Enligt Fredrik Söderquist skapar det falsk trygghet, bristande förutsägbarhet och förlorad tillit till myndigheter. Rättssäkerheten undermineras när informationen är otydlig och kräver kunskaper som vanliga medborgare saknar. Det riskerar att upplösa samhällskontraktet.", "trump": "Det är en total katastrof, folk. Försäkringskassan, en riktig förlorarorganisation, lurade tiotusentals svenskar med sin usla information. De trodde att allt var fint, men bang – plötsligt mycket mindre pengar. Rättssäkerhet? Glöm det. Tilliten rasar, precis som man kunde vänta sig från sådana inkompetenta byråkrater. De borde ha sagt sanningen, men nej, de gav falsk trygghet. Patetiskt. Jag skulle ha fixat det mycket bättre.", "stalin": "Kamrater, detta är en skamlös sabotageakt från byråkratiska parasitmaskar inom Försäkringskassan som medvetet sprider dimridåer och falsk trygghet för att destabilisera folkets försörjning. Över sextiotvåtusen arbetare fick sin ersättning likviderad i tysthet medan de lurades att tro på borgarbrackornas lögner. Jag ser de kontrarevolutionära elementens fula tryne bakom denna skenbara tydlighet. Rättssäkerheten sätts ur spel av dessa fiender till kollektivet. Vi måste omedelbart rensa ut alla som undergräver samhällskontraktet med sin parasitism. Det är både allvarligt och underhållande att se hur de avslöjar sig själva."}, "date": "29 maj, 06:00", "url": "https://arbetet.se/2026/05/29/expert-domer-ut-forsakringskassans-info-inte-rattssakert/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/25151155/dsc0154-beskurenforsajtny.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "SVT tar inte sitt uppdrag på allvar", "summaries": {"normal": "SVT ska spara 355 miljoner kronor och dra in 141 tjänster efter ökade sändningskostnader på 192 miljoner. Flera program läggs ned, bland annat det granskande ”30 minuter” med Anders Holmberg, och redaktionerna för Aktuellt och Agenda slås ihop. Krönikören kritiserar nedläggningen av ”30 minuter”, som hon ser som ett av få program som verkligen utkräver ansvar av makthavare som klimatminister Romina Pourmokhtari. Hon ifrågasätter istället varför inte underhållningsprogrammet Svenska Nyheter utvecklas eller läggs ned.", "trump": "De här SVT-typerna sparar fel. De lägger ner det enda program som faktiskt pressar de inkompetenta politikerna och får dem att svettas, som den där Pourmokhtari-tjejen. Istället behåller de Svenska Nyheter som bara gör penisskämt och sparkar på Greta Thunberg. Totalt felprioritering, folk. Det är ett hån mot riktig journalistik. De borde utveckla det tråkiga programmet, inte det som faktiskt gör skillnad. Sådant vansinne har ni aldrig sett maken till.", "stalin": "Kamrater, jag ser med stigande vrede hur de dekadenta mediebyråkraterna i SVT prioriterar fel i sin utrensning av klassfiender. De likviderar det enda program som med viss skärpa naglar fast de borgerliga lakejerna vid skampålen, medan de fortsätter mata folket med den reaktionära skämtshowen Svenska Nyheter fylld av småborgerlig vulgaritet och antisovjetiska insinuationer. Detta är sabotage mot folkets upplysning. Vi bör omedelbart rensa ut de kontrarevolutionära programutvecklare som skyddar dessa fega reportrar och deras pinsamma brist på ideologisk vaksamhet. Deras paranoia inför sanningen är både komisk och farlig."}, "date": "29 maj, 01:06", "url": "https://www.dagensarena.se/opinion/svt-tar-inte-sitt-uppdrag-pa-allvar/", "imageUrl": "https://www.dagensarena.se/files/2025/04/virve-300x157.jpeg"}, {"type": "image-right", "heading": "Sikta högre – nästa Space X är svenskt", "summaries": {"normal": "Artikeln lyfter SpaceX framgångar under Elon Musk, där återanvändbara raketer och ett Nasa-kontrakt 2008 banade väg för bolagets tillväxt inom rymd, AI och satellitinternet. Författaren betonar statens roll i att skapa förutsättningar för innovation och uppmanar Sverige att inspireras. Med Esrange, stark forskning och teknikföretag borde Sverige satsa mer kommersiellt via näringsdepartementet, riskkapital och försvaret för att skapa en egen New Space-revolution.", "trump": "Den här artikeln är fantastisk, verkligen ypperlig. SpaceX är ett under, det bästa rymdbolaget någonsin, byggt av en kille som är galen men briljant. Han landar raketer som ingen trodde var möjligt, och nu är det värt biljoner. Sverige borde titta hit istället för att gömma sig i sitt lilla hörn. Ni har bra grejer där uppe i norr, använd dem! Sluta låta forskarna bestämma, ta in de riktiga vinnarna och gör Sverige stort igen. Jag älskar det!", "stalin": "Kamrater, denna text blottar borgarbrackornas lömska fascination för en enskild spekulant som låter raketer dansa som marionetter. Jag ser hur de imperialistiska parasiterna i Washington öppnade sin slutna marknad endast för att mata den militärindustriella hydran. Sverige, ni ynkryggar, gömmer rymdfrågan hos de dekadenta utbildningsbyråkraterna medan fiendens satelliter spionerar. Vi ska likvidera denna passivitet, injicera proletär riskvilja och krossa de kapitalistiska sabotageelementen som hindrar en sann sovjetisk – nej, svensk – rymdseger. Skratta medan vi utrensar tvivlarna!"}, "date": "28 maj, 10:16", "url": "https://www.di.se/ledare/sikta-hogre-nasta-space-x-ar-svenskt/", "imageUrl": "https://static.bonniernews.se/ba/e5864b84-c303-4dda-b59f-a452d77bedde.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Ja till ny kontantlag i Sverige – börjar gälla 1 juli 2026", "summaries": {"normal": "Riksdagen har röstat igenom en ny kontantlag som börjar gälla 1 juli 2026. Mataffärer och apotek blir skyldiga att ta emot kontanter vid bemannad kassa. Banker måste erbjuda tillräckliga möjligheter att sätta in kontanter, och företag ska få tillgång till tjänster för dagskassor och växling. Lagen syftar till att motverka det ökande kontantlösa samhället, skydda mot cyberhot och minska utanförskap. Kritiker menar att lagen är tandlös och att kravet borde gälla även myndigheter som vårdcentraler och passhantering, en fråga som nu ska utredas.", "trump": "Folket i Sverige har äntligen vaknat! De röstade igenom en ny lag så att man faktiskt får använda kontanter igen. Det är en katastrof att nio av tio köp sker med kort och Swish, butikerna säger nej till riktiga pengar. Det är en skam! Vi såg vad som hände i Ukraina och till och med hos Coop när systemen kraschade. De digitala genierna skapar bara kaos och utanförskap. Sverige behöver starka ledare som ser till att kontanterna inte försvinner. Det blir fantastiskt, tro mig.", "stalin": "Kamrater, jag har nu genomfört den slutgiltiga utrensningen av de digitala kapitalisternas sabotage mot folkets sedlar och mynt. Dessa borgarbrackor och cyberförrädare som vill tvinga arbetarna in i en kontantlös avgrund ska nu likvideras genom lagens kraft. Mataffärer och apotek kommer att tvingas ta emot äkta pengar, annars följer omedelbar sanering. Vi ska rensa ut alla parasitiska bankirer som vägrar betryggande insättningar. De som längtar efter att sälja ut folket till fiendens appar kommer att gråta blod. Offentligrättsliga tjänster? En utredning ska krossa även dem. Ingen slipper undan."}, "date": "27 maj, 16:32", "url": "https://nyheter24.se/nyheter/ekonomi/1486389-har-ar-sveriges-nya-kontantlag-borjar-galla-1-juli-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1600b8b104b004a30200000000b004a302/2026/05/27/2366668/sveriges-kontantlag.jpg"}, {"type": "image-full", "heading": "Fikade och åkte bil – fick återkrav på 175 000 kronor: ”Knepigt”", "summaries": {"normal": "TV4 Nyheterna berättar om sjukskrivna personer som tvingas betala tillbaka stora summor i sjukpenning efter att Försäkringskassan bedömt att de visat arbetsförmåga genom vardagliga aktiviteter som att fika, åka bil eller ta hand om barn. Forskaren Clara Bergstrand kritiserar myndighetens luddiga och förskjutna tolkning av begreppet arbetsförmåga, som skapar en gråzon mellan fritid och arbete. Domstolar har gett Försäkringskassan rätt i flera fall, vilket riskerar att underminera förtroendet för myndigheten.", "trump": "Kan ni fatta det här? De stackars människorna fikar, kör bil och tar hand om ungarna – och plötsligt ska de betala tillbaka hundratusentals kronor till en totalt inkompetent statlig byråkrati. Försäkringskassan är en katastrof, en riktig röra av luddig lagstiftning och galna domare. De blandar ihop fritid med jobb och sedan skyller de på vanliga människor. Typiskt för en dysfunktionell regering som inte har koll på någonting. Patetiskt!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas trygghet. Jag ser hur dessa byråkratiska parasiters luddiga begrepp om arbetsförmåga förvandlas till ett verktyg för att plundra sjuka proletärer på deras rättmätiga stöd. De likviderar förtroendet för staten medan de mumlar om gråzoner mellan fritid och arbete. Vi måste rensa ut dessa odugliga element som blandar ihop folkets intressen med kapitalisternas förvirring. En fiende inom murarna, som alltid."}, "date": "27 maj, 14:19", "url": "https://www.tv4.se/artikel/6NwwFRyjAECyIkyclaOLBp/fikade-och-akte-bil-fick-aterkrav-pa-175-000-kronor-knepigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6uStac4hOYDLDv930aWkbq%2Ffb2a09fa1efb93a6b80d32d536c70b7e%2F27-kassan-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Här firar Löfven fördrivningen av 750.000 palestinier", "summaries": {"normal": "Stefan Löfven deltog i Israels självständighetsfirande på ambassaden i Stockholm. Evenemanget sammanföll med palestiniernas minnesdag al-Nakba, som uppmärksammar fördrivningen av omkring 750 000 palestinier 1948. Löfven, tidigare statsminister och anhängare av tvåstatslösningen, skakade hand med ambassadören. Artikeln kritiserar valet av tillfälle mitt under pågående Gaza-konflikt och ifrågasätter Löfvens roll som ordförande för Sipri.", "trump": "Titta på den här Löfven-killen, total förlorare. Han står där och skakar hand med israelerna mitt under deras fest medan palestinierna gråter över Nakba. Smart drag, Steve, super smart. Sverige erkänner Palestina men du springer till ambassaden och firar med de tuffa killarna. Underbart hyckleri. Om jag hade varit där hade jag sagt: gör en deal, inga krig, bara vinnare. Men det här? Patetiskt.", "stalin": "Jag betraktar detta med djup misstro. Den socialdemokratiske opportunisten Löfven deltar i borgarklassens firande av en stat grundad genom terror och massutrensning av palestinska folk. Medan folkmord pågår skakar han hand med förövarnas representant. Som Sipris ordförande borde han rensa ut sådana kapitulationer inför imperialismen. Fienden ler vänligt men planerar nya anfall. Kamrater, var vakna mot dessa förrädiska element."}, "date": "27 maj, 11:07", "url": "https://proletaren.se/artikel/har-firar-lofven-fordrivningen-av-750-000-palestinier/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/israellofven-768x432.jpg"}, {"type": "image-full", "heading": "USA har attackerat mål kring Hormuzsundet i Iran", "summaries": {"normal": "USA genomförde militära attacker mot iranska robotställningar och båtar nära Hormuzsundet, trots pågående vapenvila och fredsförhandlingar i Qatar. Attackerna syftade till att skydda amerikanska styrkor från iranska hot. Iran rapporterar om döda och hävdar att de återfått kontroll över sina militära system. Händelsen riskerar att underminera fredssamtalen och ökar spänningarna i en kritisk oljetransportled.", "trump": "Lyssna här, folkens – jag har precis slagit till mot Iran igen, och det var fantastiskt! De där iranska båtarna och robotarna försökte ställa till det i Hormuzsundet, men vi visade dem vem som bestämmer. Ingen ska hota USA:s styrkor eller blockera oljan – det är jag som ser till att sundet hålls öppet! Förhandlingarna? De kan fortsätta, men bara om Iran skärper sig. Annars blir det fler attacker – och tro mig, ingen gör attacker bättre än jag!", "stalin": "Amerikanska imperialisterna har än en gång visat sin fega och provokativa natur genom att anfalla våra iranska bröder vid Hormuzsundet. Dessa kapitalistiska hyenor, som tror sig kunna diktera villkoren för världens olja, har nu mött motstånd från Irans stolta revolutionsgardister. Vi ser hur deras ammunitionslager sinar – ett tydligt tecken på att deras krigsmaskin är på väg att kollapsa. Låt dem komma med sina bombplan! Varje attack stärker bara den antiimperialistiska fronten. Och Putin? Han skrattar säkert i sitt palats medan USA leker krig i vårt intresseområde."}, "date": "26 maj, 06:14", "url": "https://kvartal.se/nyheter/artiklar/usa-har-attackerat-mal-kring-hormuzsundet-i-sodra-iran/cG9zdDoxMTcwNDc", "imageUrl": "https://images.kvartal.se/2026/05/f4358b91-hormuz.webp"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Återkalla svenska medborgarskap – bara möjligt om Tidöpartierna vinner valet", "summaries": {"normal": "Regeringen har tagit första steget mot en grundlagsändring som möjliggör återkallande av medborgarskap för grovt kriminella, men förslaget möter motstånd från Miljöpartiet, Vänsterpartiet och Centerpartiet. Socialdemokraternas ställningstagande är osäkert och kan ändras efter valet. Om Tidöpartierna inte vinner valet riskerar förslaget att falla, vilket enligt artikelförfattaren skulle gynna gängkriminella och underminera Sveriges säkerhet och rättvisa.", "trump": "Titta bara på Sverige! De försöker ta bort medborgarskap för de värsta kriminella – men vänsterpartierna, de svaga, de säger NEJ! Socialdemokraterna? De flippar som en billig hamburgare. SVT, fake news, försöker lura folket med falska rubriker. Om inte de rätta vinner valet – inget medborgarskap återkallas! Gängkriminella skrattar hela vägen till banken. Sverige, vakna upp innan det är för sent! SAD!", "stalin": "Kamrater! Se hur de borgerliga svagpissarna i Sverige darrar inför att beröva kriminella deras 'heliga' medborgarskap! Tre förrädiska partier – dessa liberala hyenor och gröna drömmare – skyddar gängledare som om de vore deras egna barn. Socialdemokraterna? En räv som väntar på rätt ögonblick att hoppa över till fienden. SVT, denna borgerliga propagandacentral, försöker dölja sanningen! Om folket inte väljer rätt kommer dessa kriminella att fortsätta suga ut vårt samhälle som blodiglar. Men frukta inte! Vi ska rensa ut dessa element – med järnhand, om så krävs! Låt de svaga gråta – vi bygger ett starkare Sverige!"}, "date": "24 maj, 03:51", "url": "https://samtiden.nu/2026/05/aterkalla-svenska-medborgarskap-bara-mojligt-om-tidopartierna-vinner-valet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/11/2018-Magdalena-Andersson.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
