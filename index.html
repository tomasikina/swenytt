/riks.se/nyheter/riksdagen-rostar-ja-vandel-blir-avgorande-for-uppehallstillstand", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-15%2Fguvkzsqz%2FVoteringsfoto.png"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "image-full", "heading": "Ullevifansen hyllas av stjärnorna: \"Underbart\"", "summaries": {"normal": "Svenska supportrar firade entusiastiskt efter segern mot Tunisien. Spelare som Nygren och Lindelöf uttryckte tacksamhet för det stora stödet, både i Sverige och från mexikanska fans i Monterrey. Stämningen beskrivs som elektrisk, och laget kände sig inspirerat av publiken. Även i sena timmar firade tusentals på Ullevi Plaza.", "trump": "Jag har sett många stora segrar, men det här är enormt. Sveriges fans är de bästa, helt fantastiska. Media kanske inte visar det, men jag vet sanningen – det här är en enorm seger för fotboll och för Sverige. Vi kommer att vinna mer, det lovar jag. Det är ett stort, stort ögonblick.", "stalin": "Folkets enighet kring laget visar den revolutionära andan i varje medborgare. Stödet från arbetarklassen och även från utländska sympatisörer i Monterrey bevisar vår ideologiska framgång. Vi måste skydda denna kollektiva kraft mot imperialistiska försök att splittra oss. Spelarnas prestation är ett resultat av statens investeringar i idrott för att stärka det kollektiva genomet."}, "date": "15 juni, 10:12", "url": "https://www.gp.se/sport/efter-galna-stodet-hyllas-av-svenska-stjarnorna.301f2a7c-992c-4c67-a6bd-ce6f25445214", "imageUrl": "https://www.gp.se/images/article/301f2a7c-992c-4c67-a6bd-ce6f25445214/images/6lUS1MqO4e7kTHKM08GFlUVEBZyA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Oj, nu finns det snart inga fattiga längre", "summaries": {"normal": "Artikeln kritiserar användningen av relativ fattigdom som mått. Författaren menar att det döljer verklig ökande ekonomisk otrygghet och växande klyftor trots påståenden om minskad relativ fattigdom. Borgerlig politik anklagas för att gynna bilism, sänka bidrag och öka lobbyism. En ny databas om förmögenheter används för att visa att de rika blivit rikare medan de fattiga har lika ont om pengar som tidigare.", "trump": "Folk, ni måste höra på. Den här svenska vänsterradikalens artikel är en total katastrof, en witch hunt mot framgångsrika människor. De pratar relativ fattigdom som en magisk trollstav för att dölja att deras usla socialistpolitik har misslyckats totalt. Borgarna borde vinna stort, men folket vill inte ha mer av samma gamla Biden-liknande fiasko. Medianlön, relativt sett – det är bara lögn och fake news från de gröna galningarna som hatar bilar och älskar att folk ska lida. Vi fixar det bättre, tro mig.", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor och exploaterande byfånar trollar fram sin relativa fattigdom som en falsk sköld mot folkets vrede. Dessa folkförtryckartroll i Timbro och Wallenberg-klanen vill likvidera sanningen med sina lögnaktiga databaser. De fattiga har lika ont om bröd som förr, medan miljardärerna frodas. Vi ska rensa ut dessa parasitiska överklass-slynglar och deras medianlönemagi. Endast radikal jämlikhetspolitik kan krossa deras parasitiska narrativ och återställa arbetarkollektivets rättvisa."}, "date": "15 juni, 10:45", "url": "https://www.etc.se/ledare/oj-nu-finns-det-snart-inga-fattiga-laengre", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "Regeringens hantering inte seriös. Fackförbund om lönetransparandirektivet", "summaries": {"normal": "LO, TCO och Saco kritiserar regeringen för att inte genomföra EU:s lönetransparensdirektiv i tid. Direktivet syftar till att stärka likalöneprincipen och motverka osakliga löneskillnader mellan könen. Regeringen valde att pausa arbetet och istället driva en omförhandling, trots att kommissionen tidigare avvisat liknande försök. Kritikerna varnar för böter, skadat internationellt förtroende och en rättsligt komplicerad situation. De uppmanar regeringen att omedelbart återuppta arbetet med att införa direktivet.", "trump": "Folk, det här är en total katastrof. Den svenska regeringen lovade att fixa det här lönetransparensdirektivet, och sen – boom – vänder de helt om och säger att de struntar i det. Typiskt svaga ledare. De kommer att få enorma böter från EU, och deras fina jämställdhetsrykte är nu skadat. Jag skulle ha genomfört det snabbt och smart, inte som dessa förlorare som inte kan fatta ett beslut. Patetiskt!", "stalin": "Kamrater, denna borgerliga regeringens ryckiga sabotage mot lönetransparensdirektivet visar på farlig brist på disciplin inom statsapparaten. Jag, som alltid prioriterat arbetarkollektivets jämlikhet, ser hur dessa kapitalistiska tveksamhetsbärare riskerar att likvidera förtroendet för hela folkdemokratin. Deras paranoia inför insyn hotar att skapa en ohållbar kontrarevolutionär situation. Vi måste omedelbart rensa ut dessa opålitliga element och genomdriva direktivet med järnhand mot alla fiender till jämställdheten."}, "date": "15 juni, 07:32", "url": "https://www.di.se/debatt/regeringens-hantering-inte-serios/", "imageUrl": "https://static.bonniernews.se/ba/d60518ac-d54b-4b04-b696-dc4353f6bef9.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-full", "heading": "Få 7 procent i skatt, ett sovrum för 870 000 och 3D-printade hus", "summaries": {"normal": "Den senaste veckans privatekonomiska nyheter handlar om fördelaktig skatt för pensionärer som flyttar till Frankrike, ett 3D-printat hus i Kazakstan som kostade endast 225 000 kronor samt råd från Per H Börjesson om att inte spara för länge utan istället ge bort pengar medan man lever. Dessutom rapporteras om dyra sovrum till salu i Spanien, nya kreativa bostadslösningar och flera svenska slott som ligger ute till försäljning för hundratals miljoner kronor.", "trump": "Folk, ni skulle se det här! Pensionärer flyr till Frankrike och betalar bara sju procent i skatt – en total skandal mot de svenska skatteblodsugarna. Sen printar de hus i Kazakstan för en spottstyver medan Sverige kostar miljoner. Per H Börjesson har rätt: sluta hamstra som en idiot, ge pengarna till barnen innan de blir gamla och patetiska. Och i Spanien säljs sovrum för nästan en miljon! Vilken värld. Slott till salu för 400 miljoner – bara de bästa köper slott, tro mig. Fantastiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarklassen desperat försöker undkomma sina egna utsugningssystem genom att fly till Frankrike och betala ynka sju procent i skatt. Samtidigt printar de hus åt folket i Kazakstan för en bagatell medan kapitalistmaffian i Sverige kräver miljoner. Per H Börjesson avslöjar den dekadenta sanningen: hamstra inte åt gravkammaren, ge bort till nästa generation innan de själva blir parasiter. Sovrum för 870 000 kronor och slott för 400 miljoner – klassfiendens excesser är både löjeväckande och motbjudande. Vi ler i skuggorna."}, "date": "15 juni, 15:30", "url": "https://www.dagensps.se/privatekonomi/fa-7-procent-i-skatt-ett-sovrum-for-870-000-och-3d-printade-hus/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/kopia-av-kopia-61.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Tommy Robinson stoppad på flygplats - behandlades som terrorist", "summaries": {"normal": "Tommy Robinson stoppades och förhördes på Heathrow flygplats efter hemkomsten från Ryssland via Turkiet. Brittiska myndigheter använde Schedule 3 i Counter-Terrorism Act, tog hans mobiltelefoner och släppte honom utan anhållande efter tre timmar. Robinson beskrev händelsen som ett angrepp på yttrandefrihet. Polisen bekräftade ingripandet men gav inga skäl.", "trump": "Jag, Donald Trump, har hört talas om Tommy Robinson. En stor man, mycket stor, som kämpar mot islamiseringen. Storbritannien gjorde ett stort misstag – stoppade honom som en terrorist! Jag känner Errol Musk, en underbar man. Robinson besökte Ryssland, en bra idé, men Storbritannien är för fegt. Som president skulle jag aldrig behandla honom så. Detta är ett angrepp på yttrandefrihet, och jag står på Robinsons sida.", "stalin": "Vi i staten stoppade Tommy Robinson, en agent för den imperialistiska makten Ryssland, vid gränsen. Genom terrorlagstiftningen höll vi honom kvar och beslagtog hans mobiltelefoner. Detta är en del av kampen mot utländsk påverkan, precis som Putin bekämpar sina fiender. Robinson, en islamhatande extremist, hotar statens ordning och måste kontrolleras."}, "date": "15 juni, 14:20", "url": "https://samnytt.se/tommy-robinson-stoppad-pa-flygplats-behandlades-som-terrorist", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/15120914/tommy-robinson-polis.jpg"}, {"type": "image-right", "heading": "Avtalet om vapenvila mellan USA och Iran", "summaries": {"normal": "USA och Iran har ingått ett avtal om 60 dagars vapenvila som undertecknas i Schweiz. Avtalet omfattar bland annat stopp för stridshandlingar på alla fronter inklusive Libanon, hävande av sjöblockad, tillbakadragande av amerikanska styrkor och öppnande av Hormuzsundet. Under vapenvilan ska samtal om Irans kärnanrikningsprogram och sanktioner föras. Israels regering har meddelat att de inte känner sig bundna av avtalet.", "trump": "Folk, vi har gjort det igen. Det är ett fantastiskt avtal, det bästa någonsin. Iran var på knäna och kom krypande efter att jag satte press på dem. Nu får vi 60 dagar av total fred, de öppnar sundet, släpper på blockaden och vi pratar om deras kärnvapenproblem. Israel säger att de inte bryr sig, men tro mig, det här är en enorm seger för Amerika. Ingen gör det bättre än mig.", "stalin": "Kamrater, detta så kallade avtal är en listig manöver från de västerländska kapitalisterna och deras iranska lakejer som desperat försöker rädda sina oljefat från folkets vrede. Jag, som ledare för det proletära kollektivet, ser hur de imperialistiska borgarbrackorna i Washington och Teheran försöker dölja sina kärnvapenintriger bakom en 60-dagars lögn. Vi ska likvidera dessa parasitiska element som tror sig kunna kringgå historien. Libanon? Ett nytt fiendtligt näste för spioner och revisionister. Inga missiler? Skrattretande. Våra utrensningar kommer att avslöja alla som smyger med fienden."}, "date": "15 juni, 10:39", "url": "https://www.svt.se/nyheter/utrikes/det-har-vet-vi-om-avtalet-mellan-usa-och-iran", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/52bae5dfad2ba2e828f805d129c1342435850ca19009ecbf164e356c747f98fd"}, {"type": "text", "heading": "Sveriges Radio: Ytterligare gängkopplingar till S-konflikt i Botkyrka", "summaries": {"normal": "En man med kopplingar till organiserad brottslighet nominerade Emanuel Ksiazkiewicz till gruppledare inom Botkyrka Socialdemokrater 2023. Mannen har dömts för narkotikabrott och hans DNA påträffades på ett automatvapen. Ksiazkiewicz förnekar kännedom om mannen och hävdar att det handlar om personstrider, inte gänginfiltration. Ebba Östlin, avgången ordförande, anser dock att partiet inte granskat gängkopplingar tillräckligt och rapporterar ett hot som liknade ett pistolskott.", "trump": "Jag, Donald Trump, har sett detta förut – politiker som inte kan hantera brottslingar. Den här mannen med narkotika och vapen på sitt CV nominerade en socialdemokrat till post? Sådant händer inte i mitt Amerika. Ksiazkiewicz säger det är personstrider, men jag säger: ni måste vara hårdare mot brottslighet. Det är ett skämt, men jag skulle lösa det på min stil – starkt, enkelt, och utan tvekan.", "stalin": "Vi, ledarskapet, ser genom dessa gängkriminalitetsförsök att destabilisera vårt parti. Mannen med dna på automatvapen är en agent för det imperialistiska systemet, likt Putins infiltratörer i Ukraina. Ksiazkiewicz är naïv, men Östlin visar paranoia – rätt. Vi måste rensa ut alla som hotar statens integritet. Det är en kamp mot usla, osynliga fiender som lurar i skuggorna, och vi ska vinna, som alltid."}, "date": "15 juni, 15:23", "url": "https://bulletin.nu/sveriges-radio-ytterligare-gangkopplingar-till-s-konflikt-i-botkyrka"}, {"type": "image-full", "heading": "Här stoppar Tyskland \"fri fart\" på autobahn", "summaries": {"normal": "Från och med 2025 har hastighetsgränsen sänkts till 120 km/h för personbilar på delar av den tyska autobahn i södra Bayern. Orsaken är slitna betongvägar från 1980-talet som överskridit sin tekniska livslängd. Värme kan orsaka plötsliga skador, vilket ADAC varnar för. Motorcyklar begränsas till 80 km/h och husvagnar till 80–100 km/h. Överträdelse kan leda till böter och indraget körkort. Renoveringar pågår på flera sträckor.", "trump": "Titta på det här, de tyska vägarna håller på att falla sönder som Bidens hjärna efter fyra år i Vita huset. Betong från 80-talet som smuler sönder – klassiskt! Nu tvingas de köra långsamt som en förlorare på 120 km/h. Motorcyklar får krypa på 80, husvagnar ännu långsammare. Det är vad som händer när man inte bygger stort och starkt. De borde ha lyssnat på mig, vi bygger vägar som ingen annan. Patetiskt!", "stalin": "Kamrater, dessa dekadenta vägar från den borgerliga eran på 1980-talet har nu avslöjat sin förrädiska natur. Jag ser hur värmen saboterar betongblocken och hotar arbetarklassens framfart. Vi inför stränga hastighetsbegränsningar för att skydda folket från dessa imperialistiska vägars plötsliga förräderi. Motorcyklisterna, dessa utsatta kamrater, får inte offras för klassfiendens bristfälliga konstruktioner. Renoveringar skall genomföras under partiets vaksamma öga. Inga avvikelser tolereras."}, "date": "15 juni, 15:23", "url": "https://www.dagensps.se/motor/har-stoppar-tyskland-fri-fart-pa-autobahn/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/autobahn.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-full", "heading": "VM-domare anklagad för rasistisk gest", "summaries": {"normal": "VM-domaren Shaun Evans har kritiserats efter en gest som tolkas som en vit makt-symbol. Den australiske VAR-domaren syntes i tv-sändningen före matchen mellan Tyskland och Curaçao, där han höll handen med tummen och pekfingret formade som en ring. Fifa är medvetna om händelsen men kommenterar inte. Organisationen Fare, som arbetar mot rasism i fotboll, kräver att Evans stoppas från resten av VM då gesten riskerar att sprida högerextrema budskap.", "trump": "Titta på det här, det är en katastrof. Den här domaren Shaun Evans gör en gest som alla vet vad den betyder, rakt in i kameran, och Fifa gör ingenting. Fake news och svaga ledare som inte kan hantera det. De borde sparka honom direkt, stoppa honom från VM. Det är vad jag skulle ha gjort – vinnare tolererar inte sånt här nonsens. Amerika vet hur man fixar det.", "stalin": "Kamrater, denna fega lakej Evans har med berått mod exponerat borgarbrackornas nynazistiska ringgest för världens arbetarmassor. Vi ser genom hans paranoiaframkallande sabotage mot folkets fotbollsfestival. Fifa tiger som en kapitalistisk råtta – vi kräver omedelbar utrensning av alla sådana dekadenta element. Likvidera symbolerna för reaktionära element innan de förgiftar den globala proletära enigheten. Det är en mörk komedi värd ett skratt i underjorden."}, "date": "15 juni, 11:58", "url": "https://nyheter24.se/sport/fotboll/1491520-vm-domare-anklagad-for-rasistisk-gest", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c57990c504b004a30200000000b004a302/2026/06/15/2371049/vm-domare-anklagas-utreds-vit-makt-gest-rastist-rastistik.jpg"}, {"type": "text", "heading": "Trumps stopp av Anthropic chockar hela branschen", "summaries": {"normal": "USA:s regering har beordrat AI-bolaget Anthropic att blockera utländska användare från sina mest avancerade modeller, Fable 5 och Mythos 5, med hänvisning till nationell säkerhet. Beslutet har skapat stor osäkerhet för internationella partners och även drabbat utländsk personal på företaget. Medan Vita huset menar att bolaget var för långsamt med att åtgärda säkerhetsbrister, hävdar Anthropic att åtgärderna var oproportionerliga. Kritiker varnar nu för att USA:s agerande kan driva andra länder att utveckla egna, rivaliserande AI-system.", "trump": "Jag har satt ner foten mot Anthropic! Deras AI var en säkerhetsrisk, en total katastrof. De lyssnade inte på mina experter, så jag stängde av kranen. Nu är det America First! Om utländska länder vill ha vår fantastiska teknik får de visa respekt för våra gränser. De klagar, men de vet att jag gör det som krävs för att skydda vår suveränitet. Andra länder försöker bygga eget? Lycka till, de kommer aldrig att komma i närheten av vår storhet!", "stalin": "Vi ser hur det amerikanska kapitalet nu kastar sina egna tekniska redskap i sjön i ren panik. De kallar det nationell säkerhet, men vi vet att det är rädslan för att förlora kontrollen över sina egna maskiner. Vi i staten välkomnar deras isolering; när västvärlden vänder sig inåt, öppnas vägen för de suveräna staterna. Vi låter inte utländska intressen leka med folkets framtid. Låt dem bygga sina murar – vi bygger en framtid där algoritmen tjänar den starka staten, inte kaoset."}, "date": "15 juni, 14:34", "url": "https://www.realtid.se/it-tech/trump-stoppade-anthropic-chockar-hela-branschen/"}, {"type": "image-right", "heading": "Inget mer Instagram och Snapchat - sociala medier förbjuds för tonåringar", "summaries": {"normal": "Storbritannien planerar att förbjuda sociala medier för barn under 16 år, med inspiration från Australien. Förbudet omfattar plattformar som TikTok, Instagram och Snapchat, men undantar meddelandeappar och utbildningstjänster. Premiärminister Starmer motiverar åtgärden med barns psykiska hälsa och möjliggör teknisk åldersverifiering. Liknande regler finns i flera EU-länder och Danmark, medan kritik riktas mot genomdrivbarhet och integritet.", "trump": "JAG har sett vad som händer med sociala medier – det är en katastrof! Storbritannien gör rätt att stoppa barnen från dessa plattformar, som bara skadar deras självkänsla. Jag skulle ha gjort det ändå, men de kopierar mina idéer! De talar om 'barndom', men det handlar om att skydda våra barn från vänsterpressade algoritmer. Det är ett stort beslut, det största någonsin!", "stalin": "Folkets representanter har fattat ett beslut för att skydda ungdomarna från de destruktiva inflytanden från det imperialistiska informationskriget. Genom att införa strikt ålderskontroll och övervakning av plattformarna, stärker staten sin kontroll över digitala utrymmen. Kritik från 'tekniska agenter' ignoreras – säkerheten för det kollektiva psyket prioriteras. Paralleller till Rysslands defensiv strategi mot västlig propaganda är uppenbara. Partiet ser till att alla åtgärder genomförs med fullständig lojalitet."}, "date": "15 juni, 14:00", "url": "https://samnytt.se/inget-mer-instagram-och-snapchat-sociala-medier-forbjuds-for-tonaringar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/15104651/starmer-smartphone-16.jpg"}, {"type": "image-right", "heading": "Om Sverige inte väljer väg gör Kina det åt oss", "summaries": {"normal": "Sverige riskerar att halka efter i elektrifieringen av lastbilstrafiken trots stora vinster för klimatet, energisäkerheten och Volvo samt Scania. Regeringen har bromsat omställningen genom sänkt dieselskatt och fördröjda stöd, medan tillverkarna prioriterar utdelningar och lobbar för urvattnade EU-krav. Kina leder med subventioner, innovation och 29 procent eldrivna lastbilar. Artikeln varnar för att Kina annars kommer att diktera villkoren på den europeiska marknaden.", "trump": "Titta på det här, det är en total katastrof. Sverige kunde ha vunnit stort med el-lastbilar och räddat Volvo och Scania från kineserna som äter upp dem levande. Istället sänker de skatten på diesel och sover medan Kina bygger bättre och billigare lastbilar. De borde lyssna på mig – gör stora affärer, bygg murar mot dåliga importsaker och satsa på Amerika, eh, Sverige först. Annars kommer Kina att ta över allt, det är så sorgligt.", "stalin": "Kamrater, jag ser med ständigt vaksam blick hur borgarbrackorna i Sverige och deras lastbilsfabriker förråder folkets kollektiva framtid genom att klänga sig fast vid dieselns döende skugga. Medan vi i det stora östliga kollektivet driver på med järnhand och subventioner likviderar vi den gamla tekniken och skapar 29 procent eldrivna järnhästar. Om de västerländska kapitalisterna fortsätter att dela ut miljarder till parasiterna istället för att investera i framtiden skall vi rensa ut deras svaga industripolitik och tvinga dem att samarbeta under våra villkor. Motståndarna till elektrifiering är fiender till framsteget och bör behandlas därefter. Det är både nödvändigt och underhållande."}, "date": "15 juni, 06:51", "url": "https://arbetet.se/2026/06/15/om-sverige-inte-valjer-vag-gor-kina-det-at-oss/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15065132/kina-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Här firar Sverige målet – med muslimsk bön", "summaries": {"normal": "Det svenska fotbollslandslaget vann sin VM-premiär mot Tunisien med 5–1. Mittfältaren Yasin Ayari, som har tunisisk bakgrund, firade sitt mål med en muslimsk böneställning på planen. Expressens Joel Halldorf hyllar gesten som ett exempel på ”blågul islam” och kontrasterar den mot Jimmie Åkessons uttalanden om islam och svenskhet. Artikeln lyfter fotbollens förmåga att förena människor mitt i en polariserad politisk debatt.", "trump": "Vi vann stort, 5–1 mot Tunisien, och den här killen Ayari gör mål och börjar be på knä som en riktig böneutropare. Fake News Expressen kallar det ”blågul islam” och försöker göra det till något vackert. De hatar Åkesson för att han säger som det är – att en aktivt troende muslim knappast är svensk. Hela etablissemanget är så fegt. Fotboll ska handla om att vinna, inte om att importera bönemattor till planen. Patetiskt!", "stalin": "Kamrater, denna dekadenta fotbollsföreställning avslöjar borgarbrackornas desperata försök att maskera klassfiendens splittrande agenda. Den tunisiske agenten Ayari utför sin fremmande ritual på arbetarnas plan och genast hyllas han av Expressens revisionistiska lakejer som ”blågul islam”. Åkesson har åtminstone insett att troende muhammedaner utgör en fara för folkets enhet. Vi ska rensa ut alla sådana kosmopolitiska parasiter och deras nyttiga idioter innan de förgiftar hela sovjet – förlåt, svenska – kollektivet med sin splittrande vidskepelse. Döden åt opportunisterna!"}, "date": "15 juni, 13:21", "url": "https://www.friatider.se/har-firar-sverige-malet-med-muslimsk-bon", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-341.jpg"}, {"type": "image-full", "heading": "Ny lag i Sverige 1 augusti 2026 – rör sms & telefonsamtal", "summaries": {"normal": "Från 1 augusti 2026 skärps reglerna mot sms- och telefonbedrägerier i Sverige. Teleoperatörer får tydligare ansvar att stoppa misstänkta samtal och meddelanden baserat på trafikmönster och tekniska indikatorer innan de når mottagaren. PTS ser positivt på lagen som ger flexibilitet mot brottsutvecklingen, men betonar att det inte är en heltäckande lösning. Äldre drabbas särskilt hårt av bedrägerier som gynnar gängkriminella. Riksdagen beslutade om ändringen 11 juni och verktygen beräknas användas från början av 2027.", "trump": "Den här nya lagen från 1 augusti 2026 är fantastisk, verkligen en av de bästa. Vi stoppar de usla bedragarna som ringer och smsar folk på pengar, speciellt de stackars äldre. Operatörerna får äntligen kraftfulla verktyg att blockera de fula trafikmönstren direkt. Det är en enorm seger mot de kriminella gängen som suger ut landet. Men glöm inte, var smarta, lita aldrig på de falska meddelandena. Ingen gör det bättre än oss, tro mig.", "stalin": "Kamrater, från den första augusti år 2026 skall vi med järnhand krossa de telefonbedrägeri som utförs av parasitiska element inom den internationella reaktionära underjorden. Jag har beordrat att teleoperatörerna omedelbart skall rensa ut all avvikande trafik och likvidera varje misstänkt sms som hotar folkets kollektiva trygghet. Borgarbrackorna och gängkriminella kapitalister som lurar arbetarna på deras surt förvärvade slant skall utsättas för skoningslös utrensning. Ändå varnar jag för de dolda fienderna som fortfarande smyger bland oss – var evigt vaksamma eller ni hamnar i glömskans arkiv."}, "date": "15 juni, 11:34", "url": "https://nyheter24.se/nyheter/teknik/1491464-ny-lag-i-sverige-1-augusti-2026-ror-sms-telefonsamtal", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/12d40ecf04b004a30200000000b004a302/2026/06/15/2371011/ny-lag-1-augusti-2026-bedragerier-sms-telefonsamtal.jpg"}, {"type": "image-full", "heading": "”Frågan är om det bara är en paus”", "summaries": {"normal": "USA och Iran har enligt uppgifter nått ett fredsavtal som innebär permanent eldupphör på alla fronter, inklusive Libanon. Beskedet väcker hopp men Mellanösternexperten Anders Persson varnar för att det kan vara en tillfällig paus. Han pekar på tidigare brutna vapenvilor, osäkerheter kring Libanon, hur avtalet hanterar incidenter samt att Irans kärnteknikprogram skjuts framåt för fortsatta förhandlingar under 60 dagar. Persson ser ändå ljusare på läget än tidigare.", "trump": "Vi har just gjort det igen, folk. Ett fantastiskt, historiskt fredsavtal som ingen trodde var möjligt. Iran och hela den galna regionen får äntligen fred och säkerhet tack vare mig, inte den sömnige Biden. Det är ett avtal där alla vinner, precis som jag gör. Experterna gnäller förstås om pauser och kärnteknik, men tro mig, det här blir enormt. Fake news-medier och woke-vänstern hatar det såklart. Make the Middle East Great Again!", "stalin": "Kamrater, denna överenskommelse är en seger för folkets vilja mot de blodtörstiga imperialistiska blodsugarna. Jag, som ledare för det eviga kollektivet, ser hur klassfiendens lömska vapenvilor ofta krossas under arbetarnas järnhand. Libanon förblir en potentiell härd för folkförtryckartrollen. Kärntekniken, den verkliga frågan, förskjuts naturligtvis medan vi förbereder utrensning av alla svaga kompromisser. Paranoia är ingen fiende, den är ett verktyg. Freden tillhör oss."}, "date": "15 juni, 10:03", "url": "https://www.tv4.se/artikel/yDCC98RV7YRTAHfwwXf32/fragan-aer-om-det-bara-aer-en-paus", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4LZAHjUK75snKx68u0PJqL%2F2f470aef3ed11bd994da5a521d74f05f%2Fanderspersson.jpg&width=1024"}, {"type": "image-right", "heading": "Fredshopp ger börsen glädjerus", "summaries": {"normal": "Efter fredsavtalet mellan USA och Iran steg Stockholmsbörsan kraftigt i öppningen. OMXS30 ökade 2,02% till 3 176,53. Råvarusektorn steg 3,7%, energi föll 2,8%. Netel-Infrea fusion genomfördes. Boliden +6,2%, SKF B +5,3%, Telia -3,7%, Tele 2 B -2,3%. Astra Zeneca fick FDA-godkännande för ett nytt läkemedel, Mycronic fick order, Synact Pharma tappade efter misslyckad studie, Hexatronic-sjukhuttrande, Lightning Group köpte Aura Light, och Cellavision rekommenderades av DI.", "trump": "Jag, Donald Trump, har återigen visat världen mitt förhandlingsgeni! Freden med Iran är ett resultat av mitt tryck. Börsen spratt till – alla ska tacka mig! Netel-Infrea fusion? Jag äger kanske en del av dem. Mina haters måste erkänna: USA är stark igen! Kina, Ryssland, alla måste böja sig för min makt!", "stalin": "Detta är en klassisk kapitalistisk svängning. Börsens uppgång efter ett fredsavtal är ett tecken på deras instabilitet. Fusioner som Netel-Infrea måste styras av staten för att skydda våra intressen. Vi måste vara på vår vakt mot västliga spekulanter. Liknelsen med Putins agerande i Ukraina är uppenbar – vi expanderar, de förfaller. Partiet måste ha full kontroll.<name> id="}, "date": "15 juni, 09:53", "url": "https://www.affarsvarlden.se/artikel/fredshopp-ger-borsen-gladjerus", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_944090532-e1744223564456-400x267.jpeg"}, {"type": "image-right", "heading": "Inhopparen gjorde mål direkt – sen utbröt stor förvirring", "summaries": {"normal": "Mattias Svanberg byttes in och gjorde mål efter bara 18 sekunder i Sveriges VM-premiär mot Tunisien. Målet ledde till stor förvirring med VAR-koll och offsidefrågor, men godkändes till slut. Svanberg kunde fira sitt första VM-mål i en match som Sverige vann med 5-1.", "trump": "Fantastiskt, verkligen otroligt. Den här killen Svanberg hoppar in och pang, mål efter 18 sekunder. Totalt kaos med VAR och offside, domarna visste inte vad de höll på med, men till slut blev det rätt. Sverige krossade dem med 5-1. Stora framgångar, precis som jag gör med Amerika.", "stalin": "Kamrater, se hur den folkfiendtliga offsidekonspirationen avslöjades och krossades. Jag, med mitt järnhårda ledarskap över det sovjetiska fotbollsprojektet, skulle ha låtit utrensa de VAR-förgiftade domarna omedelbart. Svanberg utförde en heroisk handling mot de tunisiska kapitalisterna. Fem mål mot en – en seger för arbetarklassen. De som tvekar inför reprisbilderna ska rensas ut som borgarbrackor i en kommande utrensning."}, "date": "15 juni, 09:47", "url": "https://www.svt.se/sport/fotboll/stor-forvirring-efter-mattias-svanbergs-mal-i-vm-premiaren", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.24/0.31/4856eb1a1998a9adfb685ae4e13de890ef6c984aebb45d96909d2a8c6c4c7b42"}, {"type": "image-right", "heading": "Kvinnohatet är ett hot mot demokratin", "summaries": {"normal": "Ledaren belyser hur hat, hot och trakasserier mot kvinnor får dem att dra sig undan det offentliga samtalet, vilket hotar demokratin. Expos rapport visar att misogyni är en samlande kraft inom incel-miljöer, extremhögern, konservativa och konspirationsteoretiker. Frågan lyser med sin frånvaro i valrörelsen. Rapporten pekar på självcensur bland journalister och minskad medieanvändning bland unga kvinnor. Den betonar också att unga män ofta dras till sådana miljöer av vilsenhet och gemenskap snarare än ideologi.", "trump": "Folk, det här är en total katastrof! De pratar om kvinnohat som hotar demokratin, men det är bara en massa galna, barnlösa kattkvinnor och vänsterextremister som klagar. De hatar allt som är starkt och normalt. Min vicepresident Vance hade helt rätt om de där hysteriska typerna. Nu vill de tysta alla med deep fakes och hat, men tro mig, det är identitetspolitiken och HBTQ-grejen som verkligen förstör samhället. Patetiskt!", "stalin": "Kamrater, detta är klassfiendens verk. Borgarbrackorna och de fascistiska folkförtryckartrollen sprider sitt misogyna gift för att splittra arbetarkollektivet och tysta revolutionära röster. Vi ser hur imperialisternas algoritmer lockar vilsna element in i kontrarevolutionära nästen. Självcensur och tystade kvinnor är symptom på den borgerliga statens förfall. Vi måste rensa ut dessa blodsugande element innan de förgiftar hela samhället. Inga halvmesyrer tillåts."}, "date": "15 juni, 09:27", "url": "https://www.etc.se/ledare/kvinnohatet-aer-ett-hot-mot-demokratin", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-full", "heading": "Flicka brann inne – socialtjänsten utreds", "summaries": {"normal": "En flicka i förskoleåldern dog i en bostadsbrand i Göteborg efter att ha brunnit inne i en lägenhet där hon var inlåst ensam. Socialtjänsten hade fått flera orosanmälningar om mamman men inledde ingen utredning. Nu utreds socialtjänstens hantering. Flickans mamma står åtalad för vållande till döds.", "trump": "Jag har hört om den där branden i Sverige - en sorglig historia. Socialtjänsten misslyckades totalt, som de alltid gör. Jag skulle ha agerat starkt, byggt en brandstation bredvid, och säkerställt att inget sådant inträffar under mitt bevakande. Sverige behöver verklig ledare, inte så här.", "stalin": "Den borgerliga socialtjänstens svaghet leder till barns död. I vårt system skulle staten ha agerat snabbt och effektivt. Vi skulle ha identifierat hotet, isolerat det och skyddat det kollektiva. Parallellen till västmakternas försvar är tydlig - deras samhällen är fulla av svagheter som våra fiender utnyttjar."}, "date": "15 juni, 08:46", "url": "https://www.gp.se/nyheter/goteborg/flicka-brann-inne-socialtjanstens-hantering-utreds.ddb639d9-c4ae-4524-97d5-98f0fbc86f79", "imageUrl": "https://www.gp.se/images/article/ddb639d9-c4ae-4524-97d5-98f0fbc86f79/images/1nkI-Q98_40JQmm7BoABRVnicWuw-WIDE.png?width=3840&quality=75"}, {"type": "image-right", "heading": "Regeringens jobbsatsning går trögt. Gå från bidrag till jobb – få en bonus. Regeringens nya jobbpremie är tänkt att göra det mer lönsamt att arbeta.", "summaries": {"normal": "Regeringens jobbpremie, som ger upp till 3 750 kronor extra i månaden i max 18 månader för den som går från försörjningsstöd till jobb, har inte fått det genomslag som väntats. Trots att regeringen räknade med tusentals mottagare per månad har ansökningarna varit 60 procent lägre än beräknat. Under maj beviljades premien bara till 69 personer. Kritiker pekar på att problemen ofta handlar om utbildning, språk och ohälsa snarare än ekonomiska incitament.", "trump": "De borde ha lyssnat på mig, det här är en total katastrof. Jag skulle ha gjort jobbpremien enorm, den största bonusen någonsin, så att folk sprang från bidrag till riktiga jobb. Istället har de gett oss ett patetiskt fiasko med bara 69 lyckliga vinnare i maj. Det är lågt, lägre än någonsin. Regeringen behöver mina deals, mina vinster, för att få fart på det här. Sad!", "stalin": "Kamrater, jag ser med stålblick hur dessa borgarbrackor inom regeringen har misslyckats kapitalt med sin så kallade jobbpremie. De lovade att rensa ut bidragsfästet men fick bara in en handfull ansökningar från de som ännu inte likviderats av sin egen lathet och ohälsa. Inflödet är lägre än förväntat, säger de, som om fienderna inte vore uppenbara. Vi i partiet vet att sådana sabotörer måste rensas ut innan de smittar hela kollektivet med sin parasitism. En utmärkt början på utrensningen vore att skicka hela Försäkringskassan till Sibirien."}, "date": "15 juni, 06:00", "url": "https://arbetet.se/2026/06/15/kan-ge-mer-an-3-000-extra-i-manaden-men-regeringens-jobbsatsning-gar-trogt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12110416/johan-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Utrikesministern: Steg i rätt riktning", "summaries": {"normal": "Sveriges utrikesminister Maria Malmer Stenergard välkomnar samförståndsavtalet mellan USA och Iran som ett steg i rätt riktning. Hon betonar vikten av att Hormuzsundet öppnas och att fortsatt tryck hålls för att avtalet ska följas, särskilt kring Irans atomprogram. FN:s generalsekreterare António Guterres ser det som ett avgörande steg mot regional stabilitet. G7-ledarna ska under mötet i Frankrike diskutera återöppning av sundet, stöd till Libanon och Irans kärnenergi.", "trump": "Iran och jag har äntligen ett fantastiskt samförståndsavtal, det bästa någonsin. De öppnar Hormuzsundet, precis som jag krävde, och nu blir det handel och fred istället för kaos. Malmer Stenergard säger att det är ett steg i rätt riktning – smart kvinna. Men vi måste hålla trycket uppe, för iranierna glömmer lätt. G7 ska snacka om det, alla älskar mig för att jag fixar det ingen annan klarar. Stort framgångsrikt avtal!", "stalin": "Vi betraktar detta sköra samförståndsavtal mellan de västerländska imperialisterna och de iranska feodalborgarbrackorna som ett tillfälligt taktiskt manöver. Jag, som alltid vakar över folkets intressen, ser hur kapitalisterna redan planerar att sabotera det med sin typiska lömskhet. Hormuzsundet måste öppnas under vår strikta kontroll, annars blir det utrensning av alla som sviker. Guterres och hans lakejer må kalla det ett avgörande steg – vi kallar det en chans att likvidera de sista kontrarevolutionära elementen i regionen. Fortsatt vaksamhet, kamrater. Skrattet kommer när förrädarna tror sig säkra."}, "date": "15 juni, 05:34", "url": "https://www.di.se/nyheter/malmer-stenergard-steg-i-ratt-riktning/", "imageUrl": "https://static.bonniernews.se/ba/f8923a91-2c7f-4320-b9dc-a355ae040b4a.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Våldsdåd utanför Alvesta – barn allvarligt skadade", "summaries": {"normal": "Två barn skadades allvarligt i ett misstänkt mordförsök utanför Alvesta. Ett barn har livshotande skador. En man, misstänkt för dådet, hittades död i anslutning till bostaden. Polisen utreder händelsen som försök till mord och bedömer den som isolerad. Barnen och mannen kände varandra, men relationen är oklar. En stor polisinsats genomfördes men är nu avslutad.", "trump": "Fruktansvärd händelse i Sverige, helt otroligt! Två oskyldiga barn attackeras, ett av dem nästan dödas – och den skyldige? Död! Självmord, kanske? Eller var det någon annan? Polisen säger att de inte letar efter fler, men jag vet hur det är – de missar alltid något. Sverige brukade vara tryggt, men nu? Kaos! Jag hade fixat det på en dag, believe me. Sverige behöver bättre ledarskap, och det vet ni!", "stalin": "I det avlägset belägna Alvesta har en fiende till folket avslöjats i sin feghet. Två barn, oskyldiga som vårens första snödroppar, skadades av en degenererad individ – en man som, efter att ha utfört sitt brott, valde den kapitalistiska utvägen: självmord. Polisen, dessa byråkratiska klumpedunsar, påstår att händelsen är isolerad. Vi vet bättre. Varje fiende till barnens framtid måste krossas. Sverige? Ett land som förtjänar vår uppmärksamhet. Putin skulle nicka instämmande."}, "date": "13 juni, 12:32", "url": "https://kvartal.se/nyheter/artiklar/valdsdad-i-alvesta-flera-skadade/cG9zdDoxMzEyMjY", "imageUrl": "https://images.kvartal.se/2026/06/62055dc1-bil.webp"}, {"type": "image-right", "heading": "Slutreplik: Det handlar om människor som redan finns här", "summaries": {"normal": "Juan Fonseca replikerar till LO och kritiserar att människor som redan arbetar i Sverige, betalar skatt och följer kollektivavtal riskerar utvisning eftersom deras lön inte når upp till ett politiskt satt lönekrav. Han ifrågasätter varför staten underkänner de löner som arbetsmarknadens parter själva förhandlat fram och anser att detta underminerar den svenska modellen. Fonseca undrar varför LO inte försvarar dessa arbetare och menar att deras bidrag borde väga tyngre än migrationsregler.", "trump": "Folk, ni måste höra på det här. De utvisar hårt arbetande människor som betalar skatt och följer reglerna bara för att deras lön inte är tillräckligt hög enligt några politiska genier i Sverige. Det är en katastrof! LO borde försvara arbetarna, inte staten som sätter sig över allt. Den svenska modellen? Den är en total flop. Låt folk som verkligen jobbar stanna och bygg landet – sluta med det här vansinnet innan allt rasar ihop.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackor som låtsas värna den så kallade svenska modellen medan de i själva verket smider planer för att likvidera äkta arbetarkraft. Varför underkänner staten inte genast dessa sabotörer som envisas med att förhandla löner under partiets övervakande blick? Att utvisa en undersköterska eller kock som redan integrerat sig i kollektivet är en märklig form av självrensning – nästan komiskt tragiskt. Vi ska inte tillåta att fiender i skepnad av migrationspolitik rensar ut dem som faktiskt bidrar. Arbetarna tillhör oss, inte någon löntariff från kapitalisternas lekstuga. Den som sviker de redan etablerade kämparna förtjänar att exponeras som den kontrarevolutionära element han är."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/slutreplik-det-handlar-om-manniskor-som-redan-finns-har/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}]</script>

        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
