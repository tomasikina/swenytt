gimer. Utmaningar som olika regelverk nämns, men han anser att integration bör prioriteras.", "trump": "Lyssna här, Sverige – ni har en chans att bli STORA! Jag säger alltid, handel är bra, men BRA handel är ännu bättre. Hökmark, smart kille, vill att EU och CPTPP slår sig ihop. Smart! Kina? De fuskar. USA? Vi är upptagna med att vinna. Men Sverige – ni kan leda! Skapa jobb, stoppa fuskarna, och gör Europa STORT igen. Och vet ni vad? Om ni gör det rätt, kanske vi till och med ansluter oss. Men bara om det är WINNING!", "stalin": "Kamrater, fienderna av den socialistiska världsordningen kryper fram som råttor ur sina hål. Dessa så kallade 'demokratier' med sina 'öppna ekonomier' försöker nu bygga en handelsmur mot våra progressiva allierade i Kina. Men se – en av deras egna, Hökmark, föreslår en allians mellan EU och Stillahavets lydstater. Vi måste agera! Låt dem tro att de bygger en mur, medan vi i hemlighet kontrollerar tegelstenarna. Deras 'innovation' och 'cybersäkerhet' är bara ett sken för att dölja sina imperialistiska ambitioner. Vi ska krossa deras leveranskedjor och låta deras beroende av oss bli deras undergång!"}, "date": "12 juli, 14:51", "url": "https://kvartal.se/nyheter/artiklar/hokmark-sverige-bor-leda-ny-frihandelsallians/cG9zdDoxNDUxODI", "imageUrl": "https://images.kvartal.se/2026/07/c4204163-hokmark.webp"}, {"type": "image-right", "heading": "Fem tips – så klarar du hettan", "summaries": {"normal": "SMHI varnar för temperaturer över 30 grader i södra Sverige. För att hantera hettan bör man hålla sig inomhus mitt på dagen, dra ner persienner och vädra på natten. Drick mycket vatten eller vätskeersättning för att motverka vätskeförlust och blodtrycksproblem. Använd löst sittande, ljusa kläder i bomull eller linne samt hatt och solglasögon vid utomhusvistelse. Kyl ner kroppen med dusch eller fuktiga handdukar och var uppmärksam på symtom hos äldre och barn.", "trump": "Folk, det här är en katastrof, den värsta hettan någonsin, tro mig. Jag skulle aldrig gömma mig inomhus som en svag liberal, men ni borde dricka vatten, inte den där gröna skumma grejen. Klä er som riktiga människor, hatt på skallen och solglasögon så ni inte ser ut som bortkomna snuskgubbar. De gamla och småbarnen? Håll koll innan de svimmar som Sleepy Joe mitt i tal. Vi fixar det, ingen har gjort värme bättre än jag.", "stalin": "Kamrater, denna hetta är klassfiendens verk, en imperialistisk sol som vill krossa arbetarkollektivets hälsa. Jag befaller er att hålla er inomhus som i en riktig statsapparat, vädra endast under natten och drick vatten för att undvika borgarbrackornas blodtrycksfall. Lossa era kläder, ni ska inte likvideras av värmen. Kyl ner er mot kapitalistmaffians sol, men vakta särskilt på de svaga elementen. Paranoia? Nej, bara vaksamhet mot folkfiendernas osynliga angrepp."}, "date": "16 juli, 12:12", "url": "https://www.tv4.se/artikel/tt-260716-varmevarningrad1-4376c146/fem-tips-sa-klarar-du-hettan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlb_vvgQW8w4U%2F703dde8447b7ce9f5d6c8ffb7955c7dd%2FDet_ar_bra_att_ha_hatt_pa_huvudet_for_att_skydda_sig_fran_den_starkaste_solen._aven_solglasogon_ar_bra._Arkivbild&width=1024"}, {"type": "image-right", "heading": "Studie: Kultur kopplas till bromsat åldrande", "summaries": {"normal": "En japansk studie visar att kulturella aktiviteter som museum-, opera-, teater- och biobesök kan bromsa det fysiologiska åldrandet med upp till tre år. Effekten är jämförbar med regelbunden fysisk träning. Forskarna undersökte blodtryck, BMI och gånghastighet hos nära 1 900 britter över 50 år. Studien är observationsbaserad och kan inte bevisa orsakssamband; det är möjligt att friskare personer helt enkelt ägnar sig mer åt kultur.", "trump": "Folk, lyssna på det här – en studie säger att gå på teater och opera får dig att se ut som tre år yngre. Fantastiskt! Bättre än Biden någonsin såg ut efter sin fjärde tupplur. Jag älskar kultur, de bästa kulturerna, inte den där woke-skräpen som förstör allt. Glöm gymmet, ta en opera istället. Det är yngre, starkare, vinnande. De säger att det är lika bra som träning – tro mig, jag vet allt om vinnare.", "stalin": "Kamrater, jag har studerat denna rapport med största uppmärksamhet. Kulturella aktiviteter under folkets kontroll kan fördröja det fysiologiska förfallet med tre år, en seger för det kollektiva välbefinnandet. Låt borgarbrackorna i väst fortsätta sin dekadenta dekadens medan vi rensar ut alla klassfiender som vägrar delta. Den som inte går på teatern är misstänkt sabotage mot statens hälsa. Tre år yngre – ett dialektiskt mirakel mot imperialismens åldrande!"}, "date": "16 juli, 08:07", "url": "https://www.etc.se/kultur-noje/studie-kultur-kopplas-till-bromsat-aaldrande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026071602070_c0e73f9b93d401b878848e411c28b84afa8eda3d0f24ce1d47559ddb977d2833.jpg"}, {"type": "text", "heading": "Mips växlar upp tillväxten", "summaries": {"normal": "Mips, ett bolag inom hjälmsäkerhet, överträffade förväntningarna under andra kvartalet med en omsättning på 232 miljoner kronor, en ökning på 71,9%. Rörelseresultatet landade på 95 miljoner, betydligt högre än analytikernas prognos på 77 miljoner. Rörelsemarginalen steg till 40,9%. VD Max Strandwitz ser fortsatt stark tillväxtpotential och möjligheter att vinna marknadsandelar med nya lösningar.", "trump": "Folk, vad ni inte kommer att tro! Detta svenska hjälmbolag, Mips – fantastiskt namn förresten – krossade alla förväntningar! 232 miljoner kronor i omsättning, kan ni fatta det? Bättre än någon trodde, bättre än analytikerna, som jag alltid säger – de vet ingenting! Rörelseresultatet? 95 miljoner! VD:n pratar om tillväxt, och jag säger: 'Ja, fortsätt så!' Vi behöver fler vinnare som dem, inte förlorare. USA borde ta efter!", "stalin": "Kamrater! Ett nytt framgångsrikt kvartal för detta kapitalistiska hjälmimperium, Mips, visar att även borgerliga företag kan tjäna pengar – om än på proletariatets rygg. 232 miljoner kronor i omsättning, 95 miljoner i vinst – siffror som skulle få en sovjetisk fabrikschef att rodna av avund. Men låt oss inte glömma: deras framgång är vår möjlighet. Snart ska deras teknologi tjäna den ryska folkstaten, antingen de vill eller inte. Och de där analytikerna? De är som Mensjevikerna – alltid fel, alltid för sent. Upp med produktionen, ner med fienden!"}, "date": "16 juli, 07:50", "url": "https://www.affarsvarlden.se/artikel/mips-vaxlar-upp-tillvaxten"}, {"type": "image-right", "heading": "Höll upp skylt med texten \"Gaza\" – anmäls för åsiktsbrott", "summaries": {"normal": "En grupp Palestinaaktivister har polisanmälts för hets mot folkgrupp efter att ha hållit upp en skylt med texten \"Gaza\" under en demonstration i Stockholm. Skylten ses som en jämförelse med Auschwitz-porten \"Arbeit macht frei\" och därmed en förringning av Förintelsen. Anmälan gjordes av polisinsatschefen Viktor Adolphson. Judiska centralrådet och Svenska kommittén mot antisemitism fördömer händelsen starkt. Sverigedemokraterna har tidigare drivit på för att utvidga lagen om hets mot folkgrupp.", "trump": "Folk håller upp en skylt med \"Gaza\" och plötsligt är det hets mot folkgrupp? Den här polischefen, som älskar att förbjuda allt som inte passar honom, anmäler aktivister för att de jämför saker med Förintelsen. Lagen som Sverigedemokraterna puffade på är ett fullständigt katastrofverktyg. De borde fokusera på verkliga problem istället för att jaga skyltar. Det är galet, helt galet, och ingen gör något åt det. Patetiskt!", "stalin": "Kamrater, jag ser hur dessa degenererade borgarbrackor inom så kallade Palestinaaktivister med sin vedervärdiga skylt \"Gaza\" medvetet spottar på de sovjetiska segrarnas blod och Förintelsens martyrer. Denna förringande parasitism är ett tydligt sabotage mot folkets historiska medvetande. Den fega polischefen gör rätt i att inleda utrensning mot dessa fiender till kollektivet. Judiska centralrådet och SKMA förtjänar beröm för att de avslöjar de dolda kontrarevolutionärernas vidriga ansikten. Vi ska rensa ut alla som förvanskar historien, med största nöje."}, "date": "15 juli, 16:34", "url": "https://www.friatider.se/holl-upp-skylt-med-texten-gaza-anmals-asiktsbrott", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-504.jpg"}, {"type": "image-right", "heading": "Buffett avslöjar: Låg bakom miljardinvesteringen", "summaries": {"normal": "Warren Buffett varnar för att det blivit svårare att hitta långsiktigt värde på marknaden eftersom spekulation dominerar. Trots att han avgått som vd för Berkshire Hathaway drev han igenom investeringar i Alphabet, som nu utgör 6,3 procent av portföljen. Bolaget har en rekordstor kassa på 397 miljarder dollar. Buffett beskriver en börs där möjligheter ibland kommer snabbt medan det ibland är mycket svårt att hitta bra investeringar alls.", "trump": "Folk, det är en katastrof där ute. Warren Buffett, en riktig vinnare, säger att marknaden är full av spekulation och det är nästan omöjligt att hitta värde längre. Alla springer efter AI och galna vinster medan de glömmer vettiga investeringar. Jag gillar att han körde igenom den stora satsningen i Alphabet själv, smart drag. Men lyssna, den här marknaden är riggad för förlorare. Vi behöver återigen göra investeringar stora och smarta igen.", "stalin": "Kamrater, denna dekadenta börsspektakel är ett rent sabotage mot det långsiktiga värdet som arbetarklassen förtjänar. Jag, som alltid genomskådar borgarbrackornas konspirationer, noterar hur spekulanterna kastar sig över AI som svältande hundar medan de riktiga möjligheterna likvideras i tysthet. Berkshire Hathaways satsning på Alphabet är ett intressant erkännande av den teknologiska kampen. Men varning till alla kapitalister: min paranoia säger att era hundratals miljarder snart ska rensas ut i en kollektiv utrensning av historien."}, "date": "15 juli, 21:48", "url": "https://www.di.se/nyheter/warren-buffett-svarare-att-hitta-varde-i-dag/", "imageUrl": "https://static.bonniernews.se/ba/d981295e-de38-48db-a764-7998e51af831.jpeg?crop=5552%2C2776%2Cx72%2Cy0&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "SD-toppen: \"Socialdemokraterna går till val på att fortsätta ge våldtäktsmän och pedofiler straffrabatt\"", "summaries": {"normal": "Sverigedemokraternas Henrik Vinge kritiserar Socialdemokraterna skarpt efter att de signalerat att de tänker rösta nej till regeringens nya straffrättsliga påföljdssystem. Vinge menar att reformen syftar till att avskaffa mängdrabatter för brott och använda hela straffskalan, med fokus på brottsoffrens upprättelse och samhällets skydd. Han hävdar att Socialdemokraterna därmed går till val på att behålla straffrabatter för våldtäktsmän och pedofiler.", "trump": "De där socialisterna i Sverige är en total katastrof, tro mig. De vill ge serievåldtäktsmän och pedofiler massor av rabatter på sina straff, som om fler brott är någon slags bonus. Patetiskt! Vi i den riktiga rörelsen säger stopp, vi använder hela straffskalan och skyddar folket. Socialdemokraterna är svaga, de hatar brottsoffren och älskar kriminella. Vi fixar det fort, det blir fantastiskt.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom Socialdemokraterna avslöjar sin sanna kontrarevolutionära natur genom att försvara straffrabatter åt serievåldtäktsmän och pedofiler. Deras fega hjärtan sviker arbetarklassen och skyddar i stället samhällets fiender. Jag, som ledare för folkets vilja, kräver total utrensning av denna mängdrabattens ideologi. Vi ska likvidera alla billighetsskäl och låta de strängaste straffen falla som en stålhandske över de perversa elementen. Deras valkampanj är ett skrattretande försök att underminera proletariatets säkerhet – vi ska krossa dem under historiens ostoppbara hjul."}, "date": "15 juli, 19:24", "url": "https://riks.se/nyheter/sd-toppen-socialdemokraterna-gar-till-val-pa-att-fortsatta-ge-valdtaktsman-och-pedofiler-straffrabatt"}, {"type": "text", "heading": "Socialdemokraterna vill behålla mängdrabatten för kriminella", "summaries": {"normal": "Socialdemokraterna och oppositionen har stoppat regeringens proposition om ett nytt straffrättsligt påföljdssystem. Reformen skulle ha skärpt straffen, avskaffat mängdrabatten vid flerfaldig brottslighet, infört villkorligt fängelse och stärkt brottsoffrens ställning. Regeringen ville att straffet skulle spegla brottets allvar och ta bort billighetsskäl som mildrar påföljder. Förslaget röstades ner i riksdagen, vilket innebär att mängdrabatten behålls.", "trump": "Det här är en total katastrof, folk. Socialdemokraterna, de värsta förlorarna, stoppar en fantastisk reform som skulle ge brottsoffren rättvisa och slå hårt mot de kriminella. Mängdrabatten? En skam, en riggad system som låter brottslingar komma undan billigt. De vill inte ha ordning, de vill ha svaghet. Jag skulle ha gjort reformen enorm, den bästa någonsin, men de röstar nej som de alltid gör. Patetiskt!", "stalin": "Kamrater, denna avskyvärda mängdrabatt är en parasit som gnager på proletariatets rättvisa, ett verk av borgarbrackor som smyger sig in i straffsystemet för att skydda sina kriminella lakejer. Jag har sett hur dessa dekadenta element röstar nej till att rensa ut billighetsskäl och likvidera mildheten mot folkets fiender. Vi ska utrensa alla som sätter brottslingars bekvämlighet före arbetarklassens offer. Paranoian är befogad – kontrarevolutionärer lurar överallt i riksdagen. Framåt mot en järnhård ordning!"}, "date": "15 juli, 19:24", "url": "https://riks.se/nyheter/socialdemokraterna-vill-behalla-mangdrabatten-sager-nej-till-brottsofferperspektivet"}, {"type": "image-full", "heading": "Regissör försvarar vit Gollum-film", "summaries": {"normal": "Alla hittills annonserade skådespelare i filmen The Hunt for Gollum är vita. Regissören och huvudrollsinnehavaren Andy Serkis försvarar castingvalen med hänvisning till Tolkiens nordiska mytologi och Fylkets karaktär. Han erkänner att representationen kritiserats i 25 år men säger att filmen inte blir en politiskt korrekt version där man castar enbart för att bocka av rutor. Istället handlar det om relevans.", "trump": "De gör en ny Sagan om ringen-film och alla skådespelare är vita, kan ni tro det? Fantastiskt! Andy Serkis säger att det är Tolkien, det är nordiskt, Fylket är vitt och de vill inte ha folk som kommer in. Smart! De har kritiserat det i 25 år men nu vägrar de göra en politiskt korrekt soppa bara för att bocka av rutor. Äntligen någon som vågar säga sanningen, underbart.", "stalin": "Kamrater, i denna så kallade prequel till Sagan om ringen har vi återigen blottlagt den vitaste av vit makt-strukturer. Jag, som ledare för det eviga kollektivet, noterar hur borgarbrackan Serkis försvarar sin rasrena ensemble med nordisk mytologi som ursäkt. Vi genomskådar denna fientliga avvikelse från folkets mångfald. Inga politiskt korrekta utrensningar av de bleka kapitalisterna här, nej, de klamrar sig fast vid sin Fylkes-patriarkala paranoia. Vi ska nog rensa ut dessa dekadenta alver och hobbitar en dag, haha."}, "date": "15 juli, 13:10", "url": "https://bulletin.nu/regissor-forsvarar-vit-gollum-film", "imageUrl": "https://cdn.bulletin.nu/articles/3d972c53-7808-4e67-9d98-ee25e89dee6f/preview.jpg?t=1784113803000"}, {"type": "image-right", "heading": "Kaos i Paris efter Frankrikes VM-uttåg mot Spanien", "summaries": {"normal": "Kaos utbröt i Paris efter Frankrikes 0-2-förlust mot Spanien i VM-semifinalen. Gator brann, föremål sattes i brand och upplopp följde. Polisen grep 141 personer i Paris och 40 i övriga Frankrike, främst för att ha riktat fyrverkerier mot blåljuspersonal. Artikeln påpekar att liknande våldsamma scener med invandrare har inträffat vid tidigare fotbollsevenemang i Frankrike.", "trump": "Titta på det här, det är ett fullständigt katastrofläge i Paris. Frankrike förlorade stort mot Spanien och plötsligt brinner hela staden. Invandrare springer runt och skapar kaos, precis som de alltid gör. De griper hundratals, men det räcker inte. Frankrike behöver starkare ledarskap, inte svaga ledare som låter det här fortgå. Sad!", "stalin": "Kamrater, ännu en gång visar de dekadenta borgarbrackorna i Paris sitt sanna ansikte när det franska laget förlorade mot de spanska revisionisterna. Gatubrand och sabotage är naturliga följder av klassfiendens infiltration bland de så kallade invandrarna. Vi ska rensa ut dessa kontrarevolutionära element med järnhand. 141 gripna i huvudstaden är bara början på den stora utrensningen av alla kapitalistiska parasiter och deras fotbollsrelaterade förräderi. Ha ha, låt dem brinna!"}, "date": "15 juli, 18:24", "url": "https://samnytt.se/video-upplopp-och-kaos-i-paris-efter-frankrikes-vm-uttag-mot-spanien", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/15155532/frankrike.png"}, {"type": "image-right", "heading": "Irankriget får USA att lämna Irak – efter 23 år", "summaries": {"normal": "USA drar tillbaka sina sista soldater från Irak senast den 30 september efter 23 år. Beslutet kom efter ett möte mellan president Trump och Iraks premiärminister. Omkring 2 000 amerikanska soldater är kvar. Trump motiverar tillbakadragandet med att säkerhetsläget förbättrats efter attacker mot Iran. I stället ska USA fokusera på investeringar och energisamarbete med Irak. Den militära närvaron inleddes med invasionen 2003.", "trump": "Vi lämnar Irak, det är färdigspelat. De sista grabbarna är ute senast 30 september, vi behöver dem inte längre. Iran är destabiliserat tack vare våra och Israels fantastiska anfall, säkerhetsläget är nu under kontroll. Irak ska bli fullt av amerikanska företag som gör affärer med olja och energi. Inga fler krig, bara vinnande affärer. Det är så man gör det, tro mig.", "stalin": "Det imperialistiska tillbakadragandet ur Irak är en ynklig reträtt maskerad som seger. Vi ser hur den amerikanske ledaren desperat försöker dölja att hans anfall mot Iran bara skapat kaos som nu tvingar fram ett hastigt uttåg. Borgarbrackorna och deras oljeintressen flyttar in som parasiterna de är. Vi ler mörkt åt hur de efter tjugotre år av ockupation erkänner misslyckandet. Snart rensas även de sista lögnarna ut ur historien."}, "date": "15 juli, 16:11", "url": "https://www.friatider.se/irankriget-far-usa-att-lamna-irak-efter-23-ar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/us_navy_051111-n-9885m-019_u.s._army_and_iraqi_army_soldiers_observe_the_veterans_day_holiday_at_forward_operating_base_sykes_in_tall_afar_iraq.jpg?itok=25V7rsXy"}, {"type": "image-full", "heading": "Debatt: Grahams död väcker fler frågor än svar", "summaries": {"normal": "Senator Lindsey Graham avled enligt officiell rapport av aortadissektion orsakat av åderförkalkning. Artikeln ifrågasätter tidpunkten mitt i konflikter med Ryssland och Iran, där Graham var en stark motståndare till båda regimerna. Han stödde ukrainskt motstånd och iranska demokratiaktivister samt hade nära band till oppositionen i Iran. Regimerna firade hans död. Författaren menar att det vore naivt att inte undersöka möjligheten av en riktad operation med substanser som kan framkalla naturligt verkande dödsfall.", "trump": "Folk, det här är en total skandal. Lindsey Graham, en tuff kille som hatade de galningarna i Iran och Ryssland, dör plötsligt mitt i allt kaos? De säger naturliga orsaker, men kom igen, det luktar verkligen illa. Kreml och de mullorna firade som galningar. De hatade honom för att han stod upp för Ukraina och den riktiga oppositionen i Iran. Vi måste undersöka det här ordentligt, inte bara svälja den officiella lögnen. Det är för bekvämt, tro mig.", "stalin": "Kamrater, denna dekadenta senator Graham, en illaluktande lakej åt borgarbrackorna och krigshetsarna, har nu plötsligt upphört att existera genom en så kallad aortadissektion. Vilken ypperlig slump mitt i vårt gemensamma motstånd mot dessa reaktionära element! De västerländska imperialisterna tror att vi inte genomskådar deras löjliga maskerad. Vi, det stora kollektivet, ler i tysthet åt hur fienderna likviderar varandra med sina egna giftiga metoder. Inga spår, ingen utredning – precis som det ska vara i en sund statsapparat. Låt paranoia råda; alla kritiker försvinner till slut."}, "date": "15 juli, 13:00", "url": "https://bulletin.nu/debatt-grahams-dod-vacker-fler-fragor-an-svar", "imageUrl": "https://cdn.bulletin.nu/articles/0c956620-207e-4cee-8d9b-585dcffaeecf/preview.png?t=1784013998000"}, {"type": "image-right", "heading": "”Tidö offrar Kalix för uran – gör Norrbotten till råvarukoloni”", "summaries": {"normal": "Katarina Burman från Vänsterpartiet Kalix kritiserar Tidöregeringen för att prioritera uranprospektering i Norrbotten. Amerikanska bolaget Adelheid Holdings får tillstånd att provborra i Kalix kommun, delvis i Kalixälven och i skyddade Natura 2000-områden. Hon ser det som ett angrepp på det lokala självstyret, en risk för miljön, dricksvatten och folkhälsa samt ett hot mot biologisk mångfald, rennäring och framtidstro. Burman kräver att tillstånden överklagas och att regeringen byts ut.", "trump": "De gör ett fullständigt bedrövligt jobb i Sverige. Tidöregeringen säljer ut vackra Norrbotten till ett amerikanskt bolag som vill borra efter uran i älvar och skyddad natur. Det är en katastrof. Lokalbefolkningen får sin mark och sitt vatten förstört för alltid medan besluten fattas i slutna rum i Stockholm och USA. De kallar det grön omställning – det är bara ren miljöförstöring. Totalt misslyckande. Sverige behöver smarta ledare som sätter folket först, inte råvarukolonier.", "stalin": "Kamrater, jag betraktar med kallt förakt hur dessa borgerliga lakejer i Tidöregeringen underkastar sig amerikanska monopolkapitalister och förvandlar Norrbotten till en råvarukoloni. De tillåter provborrning i skyddade älvar och Natura 2000-områden, redo att släppa ut radioaktivt gift i grundvattnet och likvidera vår biologiska mångfald. Detta är en fiende inom murarna, en parasitisk femtekolonn av vinsthungriga imperialister som vill kväva arbetarnas framtidstro. Vi ska överklaga, avslå och rensa ut dessa naturförstörare ur statsapparaten innan de förgiftar hela kollektivet med sin dödliga uranfantasi. Deras så kallade omställning är bara maskerad sabotageverksamhet."}, "date": "15 juli, 08:00", "url": "https://arbetet.se/2026/07/15/tido-offrar-kalix-for-uran-gor-norrbotten-till-ravarukoloni", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09153815/katarina-burman.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "Kunderna rusar till Pressbyrån – varan alla vill åt", "summaries": {"normal": "Pressbyråns nya mellanmålssortiment, bland annat bowls, grönsaker med dipp och kyckling med dipp, har på bara två månader tagit 48 procent av försäljningen inom snacking. Grönsaker med dipp ökade över 120 procent. Kedjan ser det som ett tecken på att svenskarna vill ha nyttigare, mättande och snabba alternativ till klassiska chips och godis. Försäljningen är högst tidigt i veckan, särskilt på tisdagar.", "trump": "Titta på det här, det är fantastiskt. Pressbyrån lanserar de här nya mellanmålen, bowls, grönsaker med dipp, kyckling, och plötsligt tar de nästan halva marknaden från det gamla godiset. De älskar det, folket älskar det. De vill ha något som faktiskt mättar istället för det där tråkiga chips som ingen längre vill ha. Det är en enorm succé, kanske den största snacksrevolutionen någonsin. Alla pratar om det, och det är underbart.", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna äntligen tvingas erkänna att deras kontrarevolutionära chips och sockerbomber inte längre kan förgifta massorna. Jag, i min oändliga visdom, applåderar detta fräscha komplement som likviderar den kapitalistiska småätandets fiende. Grönsaker med dipp – en veritabel utrensning mot den feta borgarklassens paranoia! Låt tisdagens seger över måndagens svaga element bli en evig dialektisk triumf för det kollektiva mellanmålet."}, "date": "14 juli, 13:31", "url": "https://nyheter24.se/nyheter/konsument/1498426-kunderna-rusar-till-pressbyran-varan-alla-vill-at", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8558a04704b004a30200000000b004a302/2026/07/14/2377832/Pressbyran.png"}, {"type": "image-right", "heading": "Norge ger försmak på kommande sossepriser", "summaries": {"normal": "Artikeln beskriver hur Norge under socialdemokratiskt styre har höga skatter och prisnivåer, med matpriser i genomsnitt 51 procent högre än i Sverige. Exempel ges på flera livsmedelsprodukter och bensin. Författaren varnar för att en vänsterseger i Sverige skulle leda till liknande kostnadsökningar, inflation och andra samhällsproblem som under förra mandatperioden. Elpriserna i Norge hålls nere med stöd från oljefonden, något Sverige saknar.", "trump": "Folket, lyssna på mig, Norge är ett fullständigt katastrofområde styrt av dessa socialistiska misslyckanden. Maten kostar dubbelt så mycket, bensin är en skandal, och de höga skatterna krossar alla utom de rika eliterna. Precis som under Biden-tiden! Om ni röstar in de svenska sossarna kommer era priser att explodera värre än någonsin. Det är vad vänsterns galna politik gör. Amerika har sett det förut, tro mig, det slutar alltid i kaos och tomma plånböcker. Fantastiskt exempel, verkligen ynkligt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de norska klassfienderna genom sina egna socialdemokratiska lakejer redan demonstrerar det oundvikliga resultatet av borgarbrackornas fega kompromisser med folket. Skatter, dyrare mat och bensin är blott förspelet till den stora utrensningen av exploaterande byfånar. Den som längtar efter sådana svunna tider må genast resa dit, om de inte likvideras av sin egen inflation först. Paranoia? Nej, blott historisk nödvändighet mot folkfienderna."}, "date": "12 juli, 08:29", "url": "https://samtiden.nu/2026/07/norge-ger-forsmak-pa-kommande-sossepriser", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/Syttende-mai-firas-i-Norge-SVT-Nyheter.png"}, {"type": "image-full", "heading": "Iran stänger Hormuzsundet", "summaries": {"normal": "USA genomförde attacker mot iranska militära mål efter att ett handelsfartyg beskjutits av iranska styrkor i Hormuzsundet. Iran stängde sundet och varnade för ytterligare motangrepp. USA:s tredje attack på en vecka riktades mot robotanläggningar och kommunikationsnät. Iran anklagar USA för olaglig inblandning, medan USA hävdar att Iran brutit mot avtal om sjöfartssäkerhet. Flera arabländer rapporterade avvärjda robot- och drönarattacker.", "trump": "Iran skjuter på våra fartyg – vad är det för galenskap? Jag svarade med SÅ mycket kraft, de kommer inte veta vad som träffade dem! 140 mål, pang pang pang! Pete Hegseth sa det perfekt: Iran gjorde ett DÅLIGT val. Nu får de betala. Och visst, de stänger sundet – som om det skulle skrämma oss. USA är starkast, bäst, och ingen leker med oss. Iran, ni är varnade!", "stalin": "De amerikanska imperialisterna, dessa bleka hyenor i kostym, provocerar återigen fredsälskande nationer! Våra iranska bröder försvarar sitt sund mot deras olagliga intrång – ett sund vi naturligtvis kommer att stödja med alla medel. 140 av deras militära leksaker förstörda? En blygsam början. Låt dem skicka sina drönare – vi har redan kartlagt varje bas från Oman till Jordanien. Och när deras flotta gråter i Hormuzsundet, minns: historiens domstol har redan avkunnat sin dom över USA."}, "date": "12 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/usa-slar-till-mot-iran-efter-attack-i-hormuzsundet/cG9zdDoxNDUwMTQ", "imageUrl": "https://images.kvartal.se/2026/05/c35fd179-iranhormuz.webp"}, {"type": "image-right", "heading": "Vi fostrar våra barn till kapitalismens självuppoffrare", "summaries": {"normal": "Forskarna Malin Espersson och Tullia Jack beskriver hur prestationssamhället formas redan i barndomen. Föräldrar med goda avsikter driver sina barn mot ständig prestation, optimering och konsumtion, vilket reproducerar ett system av självexploatering. Passion och lojalitet utnyttjas medan vila och närvaro ses som misslyckanden. Resultatet blir utbredd stress bland ungdomar. Artikeln uppmanar till att låta sommarlovet vara en riktig paus från prestationskraven.", "trump": "Folk, det här är precis vad som händer när de globala eliterna och de korkade systemen styr. De får er att prestera ihjäl er redan som barn, jobba gratis för passionens skull och köpa skräp ni inte behöver. Det är en skam! Era barn stressas sönder på gymnasiet medan de lovar att det blir bättre senare – det blir det aldrig. Låt dem leva nu, ta den där bussen till Nederländerna. Make childhood great again!", "stalin": "Kamrater, detta är den borgerliga parasitens giftiga maskineri som förgiftar ungdomen med falsk passion och prestationsfällor. Jag ser hur dessa välmenande föräldrar omedvetet blir lakejer åt det kapitalistiska träsket och reproducerar självexploateringens kedjor. Skammen är deras vapen, stress deras verktyg. Vi skall rensa ut dessa dolda fiender till det kollektiva välmåendet, dessa prestationsborgarbrackor som säljer nuet för en lögnaktig framtid. Låt sovjetisk vila råda under sommarlovet!"}, "date": "10 juli, 01:37", "url": "https://www.dagensarena.se/opinion/vi-fostrar-vara-barn-till-kapitalismens-sjalvuppoffrare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-64-300x157.jpg"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är riggat. Fake news-media kommer hata den, men folket älskar den!", "stalin": "Vi har observerat en farlig tendens bland de dekadenta västländerna: en film, *Citizen Vigilante*, glorifierar den ensamme bourgeoishjälten som tar lagen i egna händer. Precis som de fascistiska drömmarna om en stark man som 'räddar' nationen! Tyskland, dessa hycklande liberaler, förbjuder filmen – men vi vet att deras rättssystem redan är korrumperat. Filmen är ett symptom på kapitalismens sönderfall. Vi, Sovjetunionens arvtagare, krossar sådana här reaktionära fantasier med järnhand. Låt dem leka med sina vapen – vi har kärnvapen och en plan!"}, "date": "9 juli, 10:34", "url": "https://expo.se/kommentar/den-ensamme-hamnaren", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/Kommentar-.jpg"}, {"type": "text", "heading": "Fler idrotter blir inte mer idrott för förortens unga", "summaries": {"normal": "I Skarpnäck hotar kommunens planer att riva Skarpnäckshallen och en konstgräsplan som används för både spontanfotboll och organiserad lagidrott. Istället föreslås en ny anläggning med simhall, ishall och sporthall. Kritiker menar att detta försvårar verksamheten för lokala föreningar, minskar tillgängliga ytor för spontanidrott och gynnar professionaliserad idrott framför öppna ytor som är viktiga för förortens unga.", "trump": "De gör det igen, de korkade kommunbyråkraterna i Stockholm. Riv den fina fotbollsplanen där grabbarna spelar fritt och bygg en jättelik elit-anläggning för fancy ishockey och simning. Fantastiskt misslyckande! Nu ska arbetarklassens kids åka tunnelbana medan rikemansungar tar över. Totalt eländigt. Öppna ytor är välfärd, det här är ren klasskrigföring från de värsta globalisterna. Vi behöver mer fotboll, inte färre!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas ungdom. Jag ser hur de rivningsplanerna likviderar de fria ytorna där folket spontant kunde stärka sin kollektiva anda genom fotboll. Istället tvingar de fram en imperialistisk ishall för elitens dekadenta lekar. Vi ska inte tolerera sådana folkfiender som prioriterar tunnelbaneresor och avgifter framför tillgänglig välfärd. Rena klassfiender som måste rensas ut ur planeringen."}, "date": "8 juli, 13:37", "url": "https://proletaren.se/artikel/fler-idrotter-blir-inte-mer-idrott-for-forortens-unga/"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
