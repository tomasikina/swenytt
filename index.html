 sanningen – det är en illusion skapad av bourgeoisins spekulanter. Tekniksektorn, dessa opportunistiska lakejer, steg med 4,3%, medan energisektorn, de svaga länkarna, föll. Electrolux, en gång stolt svensk industri, nu reducerad till tiggare med sina 9 miljarder. Sleep Cycles vägrar sälja sig billigt – bra, låt de imperialistiska korparna svälta. Sivers Semiconductors? En lyckad operation av våra ekonomiska partisaner. Vi ska fortsätta övervaka dessa marknadens råttor."}, "date": "22 maj, 17:39", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_944090532-e1744223564456-400x267.jpeg"}, {"type": "image-right", "heading": "Hanif Bali: M begår självmord – byter nu ut sina egna kärnväljare", "summaries": {"normal": "Hanif Bali, före detta moderat politiker, kritiserar skarpt Moderaternas nya invandringspolitik som han anser underminerar partiets kärnväljare. Bali menar att Tidöregeringens plan för lågkvalificerad arbetskraftsinvandring, med undantag för flera yrkesgrupper inklusive ingenjörer och programmerare, är ett självmordsförsök. Han ifrågasätter sänkta lönekrav och varför billig arbetskraft prioriteras över inhemska yrkesgrupper.", "trump": "Titta bara på det här, Sverige! Moderaterna, ett parti jag aldrig gillat – och nu förstår ni varför – håller på att förstöra sig själva! De importerar billig arbetskraft från tredje världen, sänker lönerna för ingenjörer och programmerare, och kallar det 'näringslivets bästa'. Vilken katastrof! Jag sa alltid att Sverige behöver bättre ledarskap. SAD!", "stalin": "Kamrater! Moderaterna i Sverige har visat sig vara en samling kapitalistiska förrädare, svagare än en rysk vinter utan vodka. De importerar billig arbetskraft för att krossa den inhemska arbetarklassen – ett brott värre än att sälja hemliga recept på borsjtj. Dessa lönekapare och väljarsabotörer borde ställas inför folkets domstol! Vi i Kreml skrattar åt deras inkompetens, men varnar: sådana misstag leder bara till socialismens seger."}, "date": "22 maj, 18:21", "url": "https://www.friatider.se/hanif-bali-m-begar-sjalvmord-byter-nu-ut-sina-egna-karnvaljare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-24_2.jpg"}, {"type": "image-right", "heading": "S-beskedet: Vi tar bort Tidögängets undantagsyrken efter valet", "summaries": {"normal": "Tidöregeringen inför nya regler för arbetskraftsinvandring med höjt lönekrav på 33 400 kronor, men undantar 27 lågkvalificerade yrken som kräver lägre lön. Socialdemokraterna lovar att avskaffa undantagen vid valseger och återinföra behovsprövning. Kritiker menar att systemet är orättvist och missgynnar vissa regioner. Oppositionen leder stort inför valet.", "trump": "Titta på dessa så kallade 'experter' i Sverige – fullständigt kaos! De höjer lönekravet till 33 400 kronor, men sen gör de undantag för alla möjliga lågbetalda jobb. Svagt, mycket svagt! Jag skulle aldrig låta sådana här löjliga regler passera. Socialdemokraterna säger att de ska fixa det, men vem tror på dem? Inte jag! Sverige behöver ordning, inte dessa konstiga undantag. Make Sweden Great Again!", "stalin": "De kapitalistiska lakejerna i Tidöregeringen leker med arbetarklassens liv genom att införa löjliga lönekrav för invandrare – men sen gör de undantag för sina egna favorityrken! Ett klassiskt bourgeois-trick för att splittra proletariatet. Vi i Sovjet – förlåt, jag menar Ryssland – skulle aldrig tolerera sådan hyckleri. Socialdemokraterna? De är bara en blek skugga av verklig revolutionär kraft. Låt dem vinna valet, så river vi ändå deras lagar som vi rev Berlinmuren. Arbetarna ska enas, inte delas av lönegränser!"}, "date": "22 maj, 17:54", "url": "https://www.friatider.se/s-beskedet-vi-tar-bort-tidogangets-undantagsyrken-efter-valet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-23_2.jpg?itok=2I8xwUkS"}, {"type": "image-right", "heading": "Biofrigas: \"Svårt bedöma exakt tidpunkt för affärer\"", "summaries": {"normal": "Biofrigas Sweden genomför en företrädesemission på 14,9 Mkr för att finansiera vidareutveckling av sin teknik för flytande biogas (LBG). Emissionen är säkerställd till 23,9% via teckningsåtaganden, främst från externa investerare. Aktien handlas nära teckningskursen, vilket kan indikera bristande investerarintresse. Bolagets CryoSep-teknik möjliggör konvertering av komprimerad biogas till LBG, en växande marknad inom tung trafik och sjöfart. Framtida affärer är osäkra men beroende av investeringsstöd som Klimatklivet.", "trump": "Lyssna här, Biofrigas – ett litet bolag med stora drömmar, men aktien? Total katastrof! Handlas precis vid teckningskursen, ingen rabatt, ingen entusiasm. Folk vill inte ens ha deras aktier, och jag förstår varför. De pratar om 'potential' för miljarder, men var är pengarna? Deras VD snackar om 'vidareutveckling', jag säger: 'Var är resultaten?' Och investeringsstöd? Patetiskt! Sverige borde sluta subventionera misslyckanden och satsa på vinnare – som jag! Men nej, de fortsätter med sina 'gröna drömmar'. Jag hade köpt hela biogasmarknaden för en tiondel och gjort den stor igen!", "stalin": "Kamrater! Biofrigas, ett litet kapitalistiskt experiment, kämpar för överlevnad genom att tigga pengar från investerare. 14,9 miljoner kronor – en ynklig summa för ett så kallat 'miljöteknikbolag'. Deras aktie handlas som en trasig traktor – ingen vill ha den! Vi ser här en klassisk bourgeois-fiasko: de litar på 'marknadens behov' och 'investeringstöd', men glömmer att sanningen ligger i planekonomi och statlig kontroll. Deras 'potentiella marknad' på miljarder är lika verklig som västliga löften om fred. Medan de famlar i mörkret, fortsätter Sovjet – pardon, Ryssland – att dominera energimarknaden med järnhand. Låt dem konvertera sin biogas, vi konverterar deras misslyckanden till segrar för folket!"}, "date": "22 maj, 17:04", "url": "https://www.affarsvarlden.se/artikel/biofrigas-svart-bedoma-exakt-tidpunkt-for-affarer", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Biofrigas-VD-Erik-Fromell1-400x267.jpg"}, {"type": "image-right", "heading": "Nordkoreanskt damlag korsar gränsen för att spela fotboll", "summaries": {"normal": "Nordkoreas damfotbollslag har besökt Seoul för första gången sedan 2018, trots spända politiska relationer. Laget, som deltar i Asian Women's Champions League-finalen, mötte en blandad reaktion från sydkoreanska åskådare. Nordkorea betonar att besöket är strikt sportsligt, medan sydkoreanska aktivister hoppas på förbättrade relationer. Kim Jong-Un beskriver Sydkorea som en fiende, men matchen väcker ändå försiktig optimism om framtida utbyten.", "trump": "Titta bara på det här, folks! Nordkorea skickar sitt damlag till Sydkorea – och de säger att det är *bara* för fotboll. Ja, visst. Precis som jag säger att jag *bara* twittrar för att hålla kontakten med folket! Sydkorea, som alltid, hoppas på försoning, men Kim Jong-Un – en riktig tuffing, låt mig säga er – kallar dem fiender. Men vet ni vad? Jag tror på sportens kraft. Om jag kan göra affärer med Kina, kanske dessa tjejer kan sparka fram lite fred. Eller åtminstone en riktigt bra match!", "stalin": "Kamrater! Ännu en gång visar de imperialistiska marionetterna i Sydkorea sin svaghet genom att välkomna våra modiga fotbollssoldater. De kallar det 'sport', men vi vet sanningen – detta är en seger för den koreanska revolutionen! Kim Jong-Un, vår store ledare, har skickat dessa hjältinnor för att dominera planen, precis som vi dominerar fiendens svaga hopp om försoning. Och dessa sydkoreanska aktivister med sina flaggor? De är som Putins opposition – högljudda men maktlösa. Finalen väntar, och med den, ännu en triumf för socialismens överlägsenhet!"}, "date": "23 maj, 05:43", "url": "https://www.svt.se/nyheter/utrikes/nordkoreanskt-damlag-korsar-gransen-spelar-fotboll-i-iskallt-politiskt-lage", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.47/4aab572880a69faba503cf0f3502f308aa4dc438af2689a8a5ff58443c7dcffd"}, {"type": "image-right", "heading": "Ingen utvisning efter våldtäktsdygn med \"jag e hora\"-tatuering", "summaries": {"normal": "En man i 35-årsåldern har dömts till fem års fängelse av Gävle tingsrätt för en serie grova brott, inklusive våldtäkt, grov misshandel och olaga frihetsberövande. Brotten begicks mot en kvinna som hölls fången i ett dygn och utsattes för kränkande behandling. Mannen ska även betala 565 000 kronor i skadestånd. Eftersom mannen är svensk medborgare kan han inte utvisas, vilket väckt diskussion kring gällande lagstiftning.", "trump": "Helt otroligt! En total katastrof i Gävle. En man utför vidriga handlingar, riktigt elaka saker, och får bara fem år? Och vet ni vad? Han kan inte ens utvisas! Det är ett trasigt system, mina vänner. Ett totalt fiasko. I mitt Amerika skulle vi aldrig tillåta sådant här. Vi behöver lag och ordning, inte dessa svaga domar. Det här är vad som händer när ledarskapet är svagt. Vi ska göra tryggheten stor igen, tro mig!", "stalin": "Vi har studerat denna händelse i Gävle. Att en individ tillåts utöva sådan degenererad brutalitet mot en kvinna under en hel dag utan att staten omedelbart krossar honom är ett bevis på liberal svaghet. Våra kamrater i öst, under Putins fasta hand, skulle ha statuerat ett exempel omedelbart. Att inte kunna utvisa en fiende till ordningen är en byråkratisk kapitulation. Vi betraktar denna förövare som en ohyra; hans existens i vårt samhälle är en skymf mot det kollektiva bästa."}, "date": "22 maj, 16:56", "url": "https://www.friatider.se/ingen-utvisning-efter-valdtaktsdygn-med-jag-e-hora-tatuering", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-22_2.jpg?itok=YVaBH9TD"}, {"type": "image-right", "heading": "Kritiserade ”Trump tower” invigs på Grönland", "summaries": {"normal": "USA har officiellt invigt ett nytt konsulat i centrala Nuuk på Grönland, inrymt i ett höghus som lokalbefolkningen kallar 'Trump tower'. Sändebudet Jeff Landry är på plats för att förbättra relationerna, men möter skepsis efter Trumps tidigare uttalanden om att 'ta över' Grönland. Besöket kantas även av kritik från grönländska myndigheter, då närvaron av en amerikansk läkare som bedömer hälsosituationen anses vara ett djupt problematiskt och oacceptabelt intrång.", "trump": "Vi har öppnat ett fantastiskt, enormt konsulat i Nuuk! Det är en succé. Många vill kalla det 'Trump Tower', vilket är väldigt smickrande. Mitt sändebud Jeff Landry är där för att fixa relationerna som försummandes av tidigare svaga ledare. Grönland är strategiskt och otroligt viktigt. Det finns de som gnäller om medicinska undersökningar, men vi vill bara hjälpa till! Kina och Ryssland vill åt ön, men jag säger: inte en chans. Vi vinner, som vanligt!", "stalin": "De amerikanska imperialisterna har nu upprättat sitt fäste i Nuuk under täckmantel av diplomati. Ett 'Trump Tower' i Arktis? Vilken ynklig fars. De infiltrerar Grönlands hälsovård med läkare som spioner i ett geopolitiskt experiment, en taktik värdig kapitalistiska förrädare. Vår broder i Moskva ser detta, precis som vi gör. Vi tolererar inte västs klåfingriga försök att expandera sin inflytandesfär. Grönland är en bricka i deras sjuka spel, men historiens hjul krossar alla inkräktare."}, "date": "21 maj, 16:41", "url": "https://www.tv4.se/artikel/4C7iIJjZjMQRNSbYvQOZOQ/kritiserade-trump-tower-invigs-pa-groenland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1xguQ9rRkItOs6YH2BsggG%2F7c9a589f4bdb235aaf9e9124a0a59589%2F20-greenlandusa-webb.jpg&width=120"}, {"type": "image-right", "heading": "Sverige i nytt teknikavtal med USA. Först ut i EU: Ska öka samarbetet kring 6G och AI", "summaries": {"normal": "Sverige har som första EU-land tecknat ett teknikavtal med USA, kallat Technology Prosperity Deal, för att stärka samarbetet inom mobilnät, AI, rymd- och försvarsteknik. Avtalet undertecknades av USA:s utrikesminister Marco Rubio och Sveriges utrikesminister Maria Malmer Stenergard i Helsingborg. Syftet är att gynna svenska företag, locka amerikanska investeringar och bygga vidare på befintligt samarbete inom innovation och försvar. Ericsson nämns som en nyckelaktör i avtalet.", "trump": "Fantastiskt avtal, helt otroligt! Sverige, ett litet men smart land, har skrivit på ett jättebra teknikavtal med USA – först i hela EU, kan ni tro det? Jag sa ju alltid att vi måste samarbeta med de bästa, och här har vi Ericsson, ett företag som faktiskt kan utmana Kina. Rubio fixade det här, han är en vinnare. Vi bygger vidare på Nato-samarbete, stridsflyg och framtidens teknik. Sverige? De har tur som får jobba med oss. Investeringar kommer flöda, tro mig!", "stalin": "Ett steg framåt för den socialistiska teknologiska överlägsenheten! Sverige, denna lilla men listiga kapitalistiska satellit, har nu formellt knutits till den amerikanska krigsmaskinens hjul – men vi vet sanningen. Deras så kallade 'innovationskraft' är bara en blek skugga av våra framsteg inom kvantteknik och rymd. Ericsson? Ett verktyg för USA:s imperialistiska ambitioner. Låt dem leka med sina 6G-nät – vi bygger redan nästa generations vapen. Och Rubio, denna marionett, tror han kan utmana Rysslands intressen? Vi ser allt. Världen hör snart vårt steg, tungt och oundvikligt."}, "date": "22 maj, 14:21", "url": "https://www.di.se/nyheter/sverige-tecknar-teknikavtal-med-usa/", "imageUrl": "https://static.bonniernews.se/ba/7e4d7458-0e31-4363-b913-fe3529fef49f.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Värmebölja på väg mot Europa – kan bli 38 grader", "summaries": {"normal": "En tidig värmebölja väntas drabba Europa med temperaturer upp till 38 grader. Efter en period av ovanligt kyligt väder stiger nu temperaturen kraftigt, särskilt i Spanien, Frankrike och Portugal. Spanien kan få upp till 38 grader, medan Frankrike och Portugal också ser ovanligt höga temperaturer. Svenska turister uppmanas att vara försiktiga. Även Sverige väntas få varmare väder med upp till 25 grader i södra och mellersta delarna.", "trump": "Folk, lyssna nu – Europa håller på att bli HETT, och jag menar verkligen hett! 38 grader, kan ni fatta det? Spanien, Frankrike, de vet inte vad som väntar dem. Och vet ni vad? Jag sa ju att klimatet skulle bli varmare, men ingen lyssnade. Nu får de svettas – bokstavligen! Sverige, ni också, ni får lite av den franska värmen, men oroa er inte, jag fixar allt. Fantastiskt väder, helt enkelt, bara jag kunde ta åt mig äran!", "stalin": "Kamrater, fienderna i väst svettas nu under solens obarmhärtiga härjningar – 38 grader i deras så kallade 'civiliserade' länder! Medan kapitalisternas turister klagar över värmen, ser vi hur deras svaga system kollapsar. Spanien, Frankrike, Portugal – alla faller de inför naturens kraft, precis som de kommer falla inför socialismens oundvikliga seger. Även Sverige, denna lilla neutrala stat, känner av värmen. Snart kommer de alla inse att endast under Sovjetunionens beskydd kan de finna svalka. Framåt, mot seger!"}, "date": "22 maj, 15:25", "url": "https://nyheter24.se/nyheter/utrikes/1485238-varmebolja-pa-vag-mot-europa-kan-bli-38-grader", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fe1d87b804b004a30200000000b004a302/2026/05/22/2365417/sommar-varmebolja-europa-varme-vader-temperatur-spanien-portugal-varmechock-temperatur-gradwer.jpg"}, {"type": "image-full", "heading": "Därför ska du sluta låta åldern göra jobbet", "summaries": {"normal": "Artikeln reflekterar över ett kinesiskt ordspråk om ålder och dess betydelse i dagens samhälle. Den menar att ålder ofta reduceras till en siffra, medan identiteten egentligen formas av erfarenhet och självförtroende. Författaren kritiserar hur samhället sätter etiketter baserat på ålder och uppmanar till frihet från yttre bedömningar. Istället för att fokusera på siffror bör man fråga sig vad man vill uppnå.", "trump": "Lyssna här, folk! Det här med ålder är helt överdrivet. Jag, Donald J. Trump, är beviset – ingen bryr sig om siffror när man har framgång! Det kinesiska ordspråket? Smart, men vi vet alla att jag är tidlös. Unga är naiva, gamla är visare – men jag? Jag är bara fantastisk. Sluta jämföra er! Fokusera på att vinna, precis som jag alltid gör. Ålder är bara en distraktion för förlorare!", "stalin": "Kamrater! Detta så kallade 'ordspråk' är en borgerlig avledningsmanöver för att dölja klassfiendens förtryck. Ålder är inte en siffra – det är en frontlinje! De unga är naiva offer för kapitalistisk propaganda, de äldre är utbrända av systemet. Men vi, det sovjetiska folket, vet sanningen: erfarenhet är vapen, och självförtroende är ammunition. Låt inte imperialistiska etiketter som 'för ung' eller 'för gammal' splittra oss! Enade krossar vi fiendens Excel-ark med järnnäven!"}, "date": "23 maj, 00:54", "url": "https://www.dagensps.se/halsa/darfor-ska-du-sluta-lata-aldern-gora-jobbet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/3-890.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Barnens skolgård hotad – statligt arkiv ska byggas", "summaries": {"normal": "Ebba Petterssons Privatskola i Göteborg riskerar att förlora stora delar av sin skolgård när Riksarkivet planerar nybyggnation. Föräldrar har startat ett upprop med nästan 400 underskrifter då de oroas över barnens utemiljö. Stadsbyggnadsnämnden har valt att återremittera detaljplanen efter kritik från bland annat Centerpartiet. Planen innebär att skolan på sikt ska rivas och ersättas med en ny byggnad, men föräldrarna kräver en helhetslösning för barnens vardag och hälsa under byggtiden.", "trump": "Hör här, en katastrof i Sverige! De vill bygga ett gigantiskt, tråkigt arkiv mitt på barnens fotbollsplan. Verkligen uselt! Föräldrarna är upprörda, och de har rätt. Jag älskar barn, de är fantastiska, men lokala politiker – totala förlorare – fattar inga beslut. De vill riva skolan och bygga om allt, men det tar åratal! Det är en oreda, en riktig röra. Vi behöver starka ledare som fixar sådant här direkt. Det är väldigt sorgligt, men sant!", "stalin": "I Göteborg planerar man att bygga ett arkiv för att rädda papper från skadedjur, men man offrar barnens lekplats. En djupt ologisk ordning! Att låta byråkratiska lokaler tränga undan framtidens medborgare är ett tecken på svaghet. Vi, staten, vet att arkiv är nödvändiga för att dokumentera förrädare, men man bygger inte på folkets mark utan en storslagen plan. Denna tvekan hos de lokala administratörerna påminner oss om de ryska gränserna – vi backar inte, vi expanderar för att säkra ordningen!"}, "date": "22 maj, 20:26", "url": "https://www.gp.se/nyheter/goteborg/barnens-skolgard-hotad-statligt-arkiv-ska-byggas.487b489c-4cd8-4a92-9948-1737b72ee6ad", "imageUrl": "https://www.gp.se/images/article/487b489c-4cd8-4a92-9948-1737b72ee6ad/images/2ZK0wkRCbfjkAOpCkFmdkxKQBmYE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Jätten Himble har rest sig igen", "summaries": {"normal": "Den 17 meter höga plåtskulpturen 'Jätten Himble', som tidigare stått vid E6 i Varberg, har räddats från rivning. Efter en namninsamling och logistiska utmaningar har skulpturen monterats ner, transporterats och rests på sin nya plats i Franks Äventyrspark i Älvsered. Projektet möjliggjordes genom insatser från initiativtagaren Victor Bergh Alvergren och Lennart Johansson från Grävtjänst Varberg, som gemensamt sett till att landmärket kan bevaras för framtida generationer.", "trump": "Hör på här, vi har en enorm jätte, en fantastisk plåtjätte i Sverige. De ville riva honom, en katastrof! Men jag ser vinnare som Victor och Lennart som klev fram. De flyttade den 17 meter höga skulpturen till en park. Det var en svår flytt, mycket dyrt, men de fixade det! Ingen annan kunde ha gjort det så bra. Det är en otrolig vinst för folket i Älvsered. Stora saker händer när man vägrar ge upp. Himble är nu större och bättre än någonsin!", "stalin": "Vi har observerat hur de svenska småborgarna i Varberg ägnar sig åt att flytta metallskrot istället för att bygga stålverk för den kollektiva styrkan. Denna 'jätte' Himble är en distraktion, ett monument över kapitalistisk sentimentalitet. Att de tvingas bygga nya vägar för att flytta en leksak visar på en total brist på statlig planering. Det påminner oss om hur Putin med järnhand återtar det som rättmätigt tillhör oss. Låt folket leka, så länge de inte organiserar sig mot statens maskineri."}, "date": "22 maj, 20:20", "url": "https://www.gp.se/nyheter/vastsverige/nu-har-jatten-himble-rests-i-alvsered.9e2b7f19-913b-4130-b7e8-0505f0a73dd8", "imageUrl": "https://www.gp.se/images/article/9e2b7f19-913b-4130-b7e8-0505f0a73dd8/images/329s5iRKN8Xn0bqZMPqgIoHk7vdE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kommunen slängde ut Attendo – nu polisanmäls företaget", "summaries": {"normal": "Linköpings kommun polisanmäler vårdföretaget Attendo för misstänkt fusk efter att ha tagit över hemtjänsten. Kommunen upptäckte överfakturering och oegentligheter, inklusive möjliga brott. Flera tidigare anställda anmäls även för drogförsäljning på arbetstid. Attendo förnekar kännedom om anmälan och misstänker politiska motiv. Liknande anklagelser har riktats mot Attendo i andra kommuner.", "trump": "Kan ni tro det? Linköping, en fantastisk svensk stad, slänger ut ett vårdföretag, Attendo, och polisanmäler dem! De säger att företaget fuskat med miljontals kronor – helt otroligt! Och vet ni vad? De sålde till och med droger på jobbet! Jag har alltid sagt att Sverige har stora problem med invandring och kriminalitet, men nu visar det sig att det är ännu värre. Kommunen gör rätt, men varför tog det så lång tid? SAD!", "stalin": "Kapitalistiska blodsugare i vårdbranschen har återigen avslöjats! Dessa Attendo-kriminella, som en rutten svamp i vårt samhälle, har systematiskt stulit från folket genom falska fakturor och drogförsäljning. Vi har krossat liknande parasiter förut – i Västerås och Säffle – och nu är det Linköpings tur. Kommunen gör sin plikt, men låt oss inte glömma: dessa företag är verktyg för västlig dekadens. Vi ska rensa ut dem, som ogräs från vår kollektiva trädgård!"}, "date": "21 maj, 13:59", "url": "https://arbetet.se/2026/05/21/kommunen-slangde-ut-attendo-nu-anmals-vardforetaget-det-har-bor-polisen-titta-pa/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21134627/attendo-sak.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Märkliga effekten – Kina tillverkar både dyrt och billigt", "summaries": {"normal": "Kina bryter mot det traditionella ekonomiska mönstret där länder lämnar låglöneindustri när ekonomin växer. Istället behåller Kina både enkel produktion och avancerad högteknologi. Genom automatisering och massiva regionala skillnader konkurrerar landet nu på alla nivåer globalt. Många utvecklingsländer hade hoppats ta över enklare industri, men Kina dominerar exporten genom att kontrollera hela leveranskedjan, från råmaterial till slutprodukt, vilket gör dem till en unik konkurrent i världsekonomin.", "trump": "Kina gör som de vill, och det är en total katastrof för resten av världen! De borde ha lämnat över sina enkla jobb till andra, men nej, de stjäl allt. De bygger elbilar och batterier medan de krossar alla andra med billig produktion. Jag har sagt det förr: Kina lurar oss! De använder robotar för att behålla jobben hemma. Det är orättvist mot våra arbetare. Vi ska sätta stopp för det här, tro mig, ingen gör det bättre än jag!", "stalin": "De kinesiska kamraterna har förstått vad västvärldens dekadenta ekonomer vägrar inse: den industriella makten får aldrig lämnas åt slumpen. Medan de hopplösa länderna väntar på smulor från den globala marknaden, befäster Kina sin stålhårda kontroll över produktionen. Vi, staten, ser detta som ett utmärkt exempel för vår bror Putin. Varje robot är en soldat i folkets tjänst. Att låta industriell kapacitet fly är ett svek mot moderlandet. Vi krossar våra fiender genom att producera mer än dem. Utveckling är en order!"}, "date": "22 maj, 22:35", "url": "https://www.realtid.se/bors-finans/markliga-effekten-kina-tillverkar-bade-dyrt-och-billigt/"}, {"type": "image-full", "heading": "Snapsvisan blev megahit i Sydkorea", "summaries": {"normal": "Hugo Andersson från Borås har förvandlat den klassiska snapsvisan \"Helan Går\" till en framgångsrik K-pop-låt för gruppen NEXZ. Idén föddes efter Bruno Mars låt \"APT\" och resulterade i låten \"HYPEMAN\", som sålt en halv miljon fysiska exemplar. Andersson betonar att melodins enkelhet gör den universell och lekfull, vilket passar den koreanska marknaden perfekt, trots att låtens svenska ursprung förblir okänt för den lokala publiken.", "trump": "Hörde precis om en kille från Sverige, Hugo, fantastisk kille säkert, som tog en svensk snapsvisa och gjorde den till en enorm K-pop-hit. En halv miljon skivor! Det är siffror ingen annan ser. De sa att det inte skulle gå, men han gjorde det. Det är vad vi kallar vinnare. Han tog en gammal melodi och gjorde den modern. K-pop blir så västerländsk nu, väldigt tråkigt, men Hugo räddade det med stil. Väldigt smart!", "stalin": "Kamrater, en svensk vid namn Andersson har bevisat att även en dekadent snapsvisa kan underkasta sig vår tidsålders rytmer. Han har korrumperat den gamla visan och förvandlat den till ett redskap för K-pop-industrin, likt hur marionettregimer i väst dansar efter sina herrar. Det är en smittsam melodi, nästan som subversiv propaganda. Vi bör övervaka dessa 'hits' noga. När vi återställer ordningen i öst kommer vi att kräva att musiken tjänar statens syften, inte bara tomt festande i Seoul."}, "date": "22 maj, 20:03", "url": "https://www.gp.se/nyheter/varlden/hugo-fran-boras-gjorde-helan-gar-till-koreansk-megahit.7f419b43-b568-4e1c-b3b0-7a7fd088561d", "imageUrl": "https://www.gp.se/images/article/7f419b43-b568-4e1c-b3b0-7a7fd088561d/images/1_56uESuBlwNBVds8mkLV7nxmQ8E-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Det partiets anhängare har minst chans till en dejt", "summaries": {"normal": "En växande politisk klyfta mellan könen i västvärlden påverkar dejtingmarknaden negativt. Många svenskar ser nu motstridiga politiska åsikter som en dealbreaker för en potentiell relation. Särskilt unga kvinnor är benägna att välja bort dejter baserat på värderingar. Sverigedemokraterna framstår som det parti vars anhängare har svårast att få dejter, där nästan varannan svensk och en majoritet av kvinnorna avstår från att dejta personer med den politiska hemvisten.", "trump": "Det är en total katastrof, folk! Män och kvinnor kan inte ens dejta längre för att den radikala vänstern har förstört allt. De är besatta av politik! Om du röstar på Sverigedemokraterna – fantastiska patrioter förresten – då vill de inte träffa dig. Det är orättvist, det är sorgligt och det är väldigt dåligt för familjebildningen. Vi behöver sunt förnuft tillbaka, inte dessa vänsterliberala värderingar som bara skapar splittring. Dejtingmarknaden är trasig, en total röra, tro mig!", "stalin": "Vi ser hur det dekadenta västet ruttnar inifrån. Denna så kallade 'dejtingkris' är bara ännu ett bevis på den liberala ordningens sammanbrott. När undersåtar prioriterar ideologiska klyftor framför statens stabilitet, då har borgerligheten förlorat kontrollen. Precis som vår broder i Kreml kämpar mot västlig infiltration, måste vi se dessa politiska preferenser som en form av inre subversion. De som väljer bort sina medborgare baserat på 'värderingar' är kontrarevolutionärer som hotar folkhemmets demografiska styrka. Vi övervakar dem alla."}, "date": "22 maj, 19:30", "url": "https://samnytt.se/det-partiets-anhangare-har-minst-chans-till-en-dejt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22152936/jimmie-champagne-ballong-arg-kvinna.jpg"}, {"type": "image-full", "heading": "Thailandsresor påverkas – visum halveras för svenskar", "summaries": {"normal": "Thailand återgår till pre-pandemiska regler för visumfri turism. För svenska medborgare innebär detta att den visumfria vistelsen förkortas från 60 till 30 dagar. Syftet är att öka kontrollen och motverka brottslighet som narkotikahandel och ekonomiska brott kopplade till utlänningar. Thailändska myndigheter utesluter inte ytterligare skärpningar, där vissa nationaliteter kan få nöja sig med endast 15 dagars visumfri vistelse i framtiden. Turismsektorn är en central del av landets ekonomi.", "trump": "Thailand gör det helt rätt! De har insett att man måste sätta ner foten. Inga fler öppna gränser för vem som helst. De kortar ner vistelsen till 30 dagar för att stoppa brottslingar och kaos. Väldigt smart! Vi behöver starka gränser, precis som jag alltid har sagt. Thailand prioriterar sin säkerhet framför allt annat. Det är en fantastisk nation som tar kontroll över sitt land igen. Sverige borde lära sig ett och annat, eller hur?", "stalin": "Vi ser hur Thailand äntligen rensar ut det löst folk som hotar statens stabilitet. Att korta ner vistelsetiden till 30 dagar är ett nödvändigt steg för att krossa infiltratörer och kriminella element. Det är en sund instinkt, likt den vår broder Putin uppvisar när han säkrar sina gränser mot västvärldens dekadenta spioner. Turism är bara en täckmantel för borgerlig degeneration. Om de hotar ordningen ska de uteslutas omedelbart. Staten kräver total disciplin, inget annat duger för nationens överlevnad."}, "date": "22 maj, 14:35", "url": "https://bulletin.nu/thailandsresor-paverkas-visum-halveras-for-svenskar", "imageUrl": "https://cdn.bulletin.nu/articles/cc0003d2-e392-4ee9-a3c8-92eeb93650a2/preview.jpg?t=1779447441000"}, {"type": "image-right", "heading": "Lista: Dessa 27 yrken undantas lönekrav", "summaries": {"normal": "Regeringen och Sverigedemokraterna har presenterat en lista med 27 yrkeskategorier som undantas från de nya, höjda lönekraven för arbetskraftsinvandring. Trots löften om att främja högkvalificerad arbetskraft kommer yrken som undersköterskor, svetsare och skogsarbetare att omfattas av lägre lönekrav, motsvarande 75 procent av medianlönen. Förändringarna träder i kraft den 1 juni 2026. Samtidigt införs ett totalförbud för arbetstillstånd för personliga assistenter och bärplockare i skog.", "trump": "Sverige har ett enormt problem! De lovade att stoppa invandringen, men nu gör de precis tvärtom. De låter massor av lågkvalificerade arbetare komma in genom bakdörren med en lista på 27 olika jobb. Det är en bluff, en total 'Tidöbluff'! De kallar det kompetens, jag kallar det en katastrof. De försöker lura folket, men jag ser det. Mitt system är mycket bättre, vi bygger murar och vinner. Sverige borde ringa mig, jag vet hur man fixar gränser!", "stalin": "Vi ser hur de svenska byråkraterna vacklar i sin svaghet. De talar om lönekrav men viker sig för behovet av billig arbetskraft. Vi i staten krossar sådant hyckleri med järnhand. Att göra undantag för 27 yrken är ett tecken på borgerlig kapitulation. När vår broder i öst, Putin, säkrar sitt territorium, ägnar sig svenskarna åt att importera en osäker klass. Vi ska rensa ut dessa element. Ingen bärplockare får sabotera folkets disciplin. Disciplin, arbete, eller förvisning – det är den enda vägen."}, "date": "22 maj, 15:39", "url": "https://www.friatider.se/lista-dessa-27-yrken-undantas-lonekrav", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-20_2.jpg"}, {"type": "image-right", "heading": "Arbetskraftsinvandring: 27 yrken får sänkt lönekrav", "summaries": {"normal": "Från 1 juni höjs lönekravet för arbetskraftsinvandring till 33 400 kronor, men 27 bristyrken undantas och får lägre krav. Personliga assistenter och bärplockare stoppas helt på grund av missbruk. Undantag ges även till startup-bolag, nyexaminerade och ukrainska flyktingar. Bärbranschen anpassar sig till EU:s säsongsarbetardirektiv för bättre kontroll. Färre bärplockare väntas, men högre priser lockar friplockare.", "trump": "Jag måste säga, Sverige har äntligen fattat ett smart beslut! Nu höjer de lönerna för invandrare – 33 000 kronor, inte illa! Men lyssna på det här: de stoppar helt personliga assistenter och bärplockare. Varför? Missbruk, kaos, totalt oacceptabelt! Och de undantar 27 yrken – smarta ingenjörer, sjuksköterskor, IT-tekniker. Bra, men varför inte fler? Sverige borde ta efter USA – hårdare regler, bättre kontroll. Och de där bärplockarna? Thailändska risbönder som jobbar hårdare än svenska arbetslösa. Men nu får de betala skatt – äntligen! Sverige, ni lär er, men ni har långt kvar.", "stalin": "Kamrater! Sverige har äntligen insett nödvändigheten av ordning och disciplin i arbetskraftsinvandringen. Vi höjer lönerna – 33 400 kronor, ett steg mot rättvisa! Men dessa kapitalistiska hycklare stoppar personliga assistenter och bärplockare – 'missbruk och missförhållanden', säger de. Som om vi inte vet hur de utnyttjar arbetarna! 27 yrken undantas, men bara de som gynnar deras ekonomi. Och bärplockarna? Nu tvingas de betala skatt till den svenska staten – ett litet steg mot socialismens seger! Men var är de svenska arbetslösa? För svaga för skogen, precis som väst är för svagt för Rysslands storhet. Vi ser er, Sverige. Vi ser er."}, "date": "22 maj, 14:47", "url": "https://www.dagensarena.se/innehall/arbetskraftsinvandring-27-yrken-far-sankt-lonekrav/", "imageUrl": "https://www.dagensarena.se/files/2022/10/barplockare-analys-300x157.jpeg"}, {"type": "image-right", "heading": "Veckans Afv-analyser: Spel, bostäder och marknadsföring", "summaries": {"normal": "Affärsvärldens analysredaktion har publicerat 23 analyser denna vecka, med fokus på bolag som Embracer, PPI och Adtraction. Adtraction bedöms ha god potential trots AI-risker. Afv-portföljen nådde rekordnivåer, upp 20% det senaste året, med bidrag från Adtraction. Analyserna visar en historisk överavkastning på 9,5% mot index sedan 2015, vilket överträffar storbankernas råd. Prenumeranter får tillgång till omfattande analysverktyg och guider.", "trump": "Jag måste säga, Affärsvärlden har haft en FANTASTISK vecka – 23 analyser, kan ni tro det? Rekordhöga portföljvärden, upp 20% på ett år, och det är bara början! Adtraction? De har potential, trots att alla skriker om AI – men jag vet bättre. Och våra analyser? De slår bankerna med hästlängder, 9,5% överavkastning! Ingen gör det bättre än jag, förresten. Glöm inte att läsa mina gratisanalyser – de är YUGE!", "stalin": "Denna vecka har våra kamrater på Affärsvärlden levererat 23 analyser – ett bevis på arbetarklassens outtröttliga strävan mot ekonomisk dominans. Portföljerna når nya höjder, 20% upp på ett år, medan kapitalistiska banker darrar inför vår överlägsna strategi. Adtraction, ett företag av folket, visar styrka trots imperialistiska AI-hot. Vi har krossat index med 9,5% sedan 2015 – en seger för socialismens principer! Fienderna, dessa svaga bankirer, skall tvingas erkänna vår överlägsenhet. Läs våra analyser – motstånd är meningslöst."}, "date": "22 maj, 14:46", "url": "https://www.affarsvarlden.se/artikel/veckans-afv-analyser-spel-bostader-och-marknadsforing", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Kopia-av-Kopia-av-Kopia-av-Trippel-400x267.jpg"}, {"type": "image-full", "heading": "Sverige inför nytt varningssystem – så låter det", "summaries": {"normal": "Sverige lanserar ett nytt varningssystem, SE-Alert, som skickar ut viktiga meddelanden direkt till mobiltelefoner. Tekniken kräver ingen app och fungerar även vid hög belastning i mobilnätet, till skillnad från dagens SMS-system. Genom att utnyttja en specifik del av mobilnätet kan myndigheter nå alla i ett drabbat område samtidigt. Systemet börjar implementeras i sommar och ska vara helt operativt vid årsskiftet för att öka landets krisberedskap.", "trump": "Sverige gör nu något fantastiskt med ett nytt varningssystem för mobiler. Mycket smart! De gamla systemen var långsamma, ett totalt fiasko faktiskt, men nu får alla besked direkt. Ingen app behövs, bara toppmodern teknik. Jag har alltid sagt att man måste vara förberedd, och det här är ett vinnande drag för säkerheten. Det är så man gör när man vill skydda sitt folk. Väldigt effektivt, mycket bra jobbat. Vi älskar starka nationer som agerar snabbt!", "stalin": "Vi, den socialistiska statens väktare, ser hur Sverige äntligen inser nödvändigheten av total kontroll över informationsflödet. Att nå varje undersåtes ficka i varje ögonblick är ett genidrag för ordningens bevarande. Medan vår broder i öst, Putin, visar vägen för att tygla den liberala oordningen, ser vi detta svenska system som ett oumbärligt verktyg för att eliminera desinformatörer och kontrarevolutionära element. Lydnad kräver omedelbar kommunikation. De som inte hör det statliga ropet är redan att betrakta som förlorade."}, "date": "22 maj, 14:31", "url": "https://nyheter24.se/nyheter/inrikes/1485283-nytt-system-ska-varna-vid-fara", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6c33bbc604b004a30200000000b004a302/2026/05/22/2365469/sverige-nytt-varningssystem-varning-hesa-fredrik-mobil-varnas.jpg"}, {"type": "image-right", "heading": "Lovades en halv miljon för att mörda Gaboro", "summaries": {"normal": "Alexander Nord, 22, döms till livstids fängelse för mordet på rapparen Gaboro (Ninos Khouri) i Norrköping. Mordet, utfört i december 2024, tros vara en beställning från ett rivaliserande kriminellt nätverk. Två vittnen uppger att Nord lovades 500 000 kronor men fick endast 50 000. Khouri, kopplad till Kalonnätverket, sköts ihjäl i ett parkeringsgarage. Mordet filmades och spreds på sociala medier.", "trump": "Tragiskt, verkligen tragiskt! En ung man, Alexander Nord – inte direkt en vinnare, om jag får säga det – skjuter ihjäl rapparen Gaboro i Norrköping. Lovades en halv miljon, fick bara 50 000. Vilket slöseri! Och vad gör han? Filmar det hela och lägger ut det på nätet. Inte smart, folk. Polisen kallar det ett av de värsta morden någonsin. Sverige, ni måste ta tag i era problem – snabbt!", "stalin": "Ytterligare en fiende till folket har eliminerats! Denna gång en dekadent rappare, Gaboro, som spred sitt förgiftade inflytande i Norrköpings kriminella sumpmarker. Vår nya kamrat, Alexander Nord, utförde en nödvändig insats – om än med bristande professionalism. Han lovades 500 000 rubel, men fick bara 50 000. Kapitalistiska löften, som vanligt! Filmen av avrättningen sprids – ett utmärkt exempel på hur vi avslöjar fiendens svaghet. Sverige borde lära sig av Rysslands effektivitet!"}, "date": "22 maj, 14:18", "url": "https://bulletin.nu/lovades-en-halv-miljon-for-att-morda-gaboro", "imageUrl": "https://cdn.bulletin.nu/articles/f9ef7edc-a7b3-4ddd-8ceb-bc29c63fec50/preview.jpg?t=1779452238000"}, {"type": "image-right", "heading": "Töm bankkontot – för Natos skull. Pengarna behövs i Europas försvarsindustri", "summaries": {"normal": "Europa måste ta större ansvar för sin säkerhet, särskilt med osäkerheten kring USA:s framtida militära engagemang under Trump. Nato kräver ökade försvarsutgifter, och Sverige ses som en förebild med sitt mål att nå Natos utgiftskrav redan 2030. För att finansiera upprustningen föreslås att 11 000 miljarder euro på europeiska bankkonton investeras i försvarsindustrin. EU arbetar med en spar- och investeringsunion, men vissa länder bromsar processen, trots att en kompromiss kan vara nära.", "trump": "Lyssna här, Europa – ni måste vakna! Jag har sagt det förut, och jag säger det igen: ni betalar för lite, och jag är trött på det. Sverige är bra, jättebra, men resten? Inte lika bra. 11 000 miljarder euro ligger och skräpar på bankkonton – vad är det för dumheter? Investera i försvaret, annars får ni klara er själva. Och Ursula von der Leyen, sluta snacka och börja göra! Jag har vunnit val, jag vet hur man får saker gjorda. Europa, det är dags att stå på egna ben – eller så får ni skylla er själva.", "stalin": "Kamrater! Europa svajar som ett rått äpple i höststormen, beroende av USA:s godtycke. Medan imperialistiska Trump skäller ut sina allierade, sitter kapitalet och darrar på bankkonton – 11 000 miljarder euro, ett monument över bourgeoisins feghet! Vi har sett detta förr: svaga länder som tvekar medan fienden (Putins arvtagare till den stora sovjetiska disciplinen) vässar sina bajonetter. EU:s kommission pratar om 'sparunioner' – prat, prat, prat! Sverige och Polen visar vägen, men resten? En samling dekadenta byråkrater. Vi skulle ha löst detta med femårsplaner och en järnvilja. Europa, vakna – eller bli krossat under historiens hjul!"}, "date": "22 maj, 13:14", "url": "https://www.di.se/ledare/tom-bankkontot-for-natos-skull/", "imageUrl": "https://static.bonniernews.se/ba/d9a99e28-b130-4a55-9184-ab0a632703ae.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Om Israel beter sig så här när världen tittar på, vad gör de då när ingen ser?", "summaries": {"normal": "Artikeln kritiserar Israels behandling av aktivister från Global Sumud Flotilla, som fördes olagligt till Israel och förnedrades av israeliska styrkor. Säkerhetsminister Itamar Ben-Gvir delade videor av händelsen, vilket väckte internationell upprördhet. Israels premiärminister Netanyahu distanserade sig senare från Ben-Gvirs agerande. Artikeln ifrågasätter även Sveriges regerings omsvängning i sin inställning till Israel, särskilt utrikesminister Maria Malmer Stenergards tidigare och nuvarande uttalanden. Författaren spekulerar om skälen bakom denna förändring och pekar på internationella rättsprocesser som en möjlig faktor.", "trump": "Titta bara på det här, folks! Israel beter sig som en tredje klassens diktatur, och deras egen premiärminister kastar sin säkerhetsminister under bussen – svagt, mycket svagt! Och Sverige? Oj oj oj, deras utrikesminister flippar som en fisk på land. Ena dagen säger hon att Greta Thunberg får skylla sig själv, nästa dag fördömer hon Israel. Vilka amatörer! Men jag, jag ser igenom alltihop. Det handlar om Haag, om domstolar och arresteringsorder. Israel är i knipa, och alla springer runt som yra höns. Sad!", "stalin": "Kamrater, ännu en gång visar den sionistiska marionettregimen sitt sanna ansikte. Dessa aktivister, dessa hjältar, förnedras medan deras förtryckare hyllar sig själva. Och vad gör väst? De backar som rädda hundar när sanningen blir för obekväm. Sverige, denna lilla lakejstat, byter fot som en dansör på glödande kol. Men vi vet sanningen – när kamerorna slocknar, när ingen ser, då visar sig det verkliga folkmordet. Och Haag? En skrattretande domstol som vågar utmana våra vänner i Kremls intressesfär. Men var lugna, kamrater, rättvisan skall segra – om inte i domstolarna, så på slagfältet."}, "date": "21 maj, 17:38", "url": "https://www.etc.se/ledare/om-israel-beter-sig-saa-haer-naer-vaerlden-tittar-paa-vad-goer-de-daa-naer-ingen-ser", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260521120536_14a7aec24bc32451f6721fc177a73efad0fe839662797cbf8fe3717b2ce9675d.jpg"}, {"type": "image-right", "heading": "Riksdagsledamot rusade ut för att spy: ”Mitt i voteringen”", "summaries": {"normal": "Riksdagens kvittningssystem är sedan april ur bruk, vilket tvingar samtliga 349 ledamöter att närvara vid varje omröstning. Under onsdagen blev en ledamot akut magsjuk och tvingades lämna kammaren, vilket återigen belyst riskerna med det nuvarande läget. Oppositionen kritiserar situationen som ovärdig och betonar att slumpen nu kan avgöra politiska beslut samt öka smittspridningen. Krav ställs nu på att systemet skyndsamt återupprättas för att säkerställa en fungerande parlamentarisk process.", "trump": "Hör på det här, mina vänner! Den svenska riksdagen är ett totalt kaos. Inget kvittningssystem! En ledamot blev magsjuk och sprang ut för att spy, kan ni tänka er? Det är pinsamt. Total svaghet. Jag har alltid det bästa systemet, de största systemen. De kan inte ens hålla ordning på sina egna omröstningar. Det är en sorglig syn, verkligen sorgligt. De behöver en riktig ledare, någon som vinner stort, inte det här magsjuke-debaclet. Tråkigt!", "stalin": "I den svenska församlingen råder en degenererad oordning som hotar statens stabilitet. Att en ledamot viker sig för biologisk svaghet och spyr i korridorerna är ett symptom på den liberala parlamentarismens förfall. Vi, staten, kräver total disciplin; sjukdom är en kontrarevolutionär handling mot folkviljan. Liksom vår kamrat i Moskva förstår att kontroll kräver järngrepp, bör dessa svenskar krossa sina inre fiender istället för att beklaga sig över magåkommor. En politiker som inte kan kontrollera sin mage kan inte kontrollera en nation."}, "date": "21 maj, 12:55", "url": "https://www.tv4.se/artikel/3LysP5gJGxUVMzMdkw5885/riksdagsledamot-laemnade-kammaren-foer-att-spy", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1EOCMmmrdOR25rN8XPJaRe%2F72f12edd738a4a239168b3b6cc61e2d6%2F21-riksdagen-webb.jpg&width=120"}, {"type": "image-right", "heading": "Här säger alla brandmän upp sig – får giftrök på kläderna", "summaries": {"normal": "Alla deltidsbrandmän i Skinnskatteberg säger upp sig på grund av en föråldrad och bristfällig brandstation. Problemen inkluderar trånga utrymmen och förvaring av kontaminerade larmställ tillsammans med privata kläder, vilket ökar risken för cancer. Brandmännen vill tvinga fram en ny station och avvaktar med uppsägning till december. Kommunens politiker kritiseras för långsamma beslut.", "trump": "Vad händer i Sverige? En hel brandstation säger upp sig – helt galet! De har en station som är så gammal att den tillhör historiens sophög, och nu andas de in cancerframkallande gift som om det vore parfym. Jag skulle aldrig tillåta något sådant – mina byggnader är de bästa, enorma, vackra! Men dessa politiker? Svaga, långsamma, total katastrof. Om jag styrde skulle det vara fixat på en dag. SAD!", "stalin": "Kamrater! Ytterligare ett kapitalistiskt misslyckande avslöjas i den västliga lydstaten Sverige. Dessa så kallade 'brandmän' – svaga, klagande element – vägrar att offra sin hälsa för systemet. Deras station är en skam, ett monument över bourgeoisins förfall. Vi skulle aldrig tolerera sådan ineffektivitet! Om de vore i Ryssland hade vi redan byggt en ny station – med arbetarnas blod, svett och järnvilja. Låt detta vara en varning till alla som tvivlar på socialismens överlägsenhet!"}, "date": "21 maj, 11:34", "url": "https://arbetet.se/2026/05/21/har-sager-alla-brandman-upp-sig-far-gift-pa-kladerna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21113248/brand-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Åkesson: ”Jag tänker inte be om ursäkt”", "summaries": {"normal": "Sverigedemokraternas Rashid Farivar kritiserar partiets hantering av kvittningsbråket i riksdagen, där två ledamöter röstade trots överenskommelse. Farivar menar att förtroendet för riksdagen är viktigare än politiska vinster. Partiledaren Jimmie Åkesson vägrar be om ursäkt och anser beslutet riktigt. Gruppledare Linda Lindberg avfärdar Farivars kritik och står fast vid partiets agerande.", "trump": "Sverigedemokraterna har en liten inre strid – en ledamot, Rashid Farivar, klagar på partiets smarta drag i riksdagen. Men lyssna här: Jimmie Åkesson, en stark ledare, backar inte! Han säger: 'Inga ursäkter, vi gjorde rätt!' Och Linda Lindberg? Hon bryr sig inte ens om kritiken. Vilket svagt bråk! Sverige borde ta lärdom av hur man vinner, precis som jag!", "stalin": "En ynklig avvikare inom Sverigedemokraterna, Rashid Farivar, vågar kritisera partiets järnhårda beslut i riksdagen. Men kamrat Åkesson, en sann ledare, böjer sig inte för sådana svagheter! 'Inga ursäkter!' säger han – precis som vi i Sovjetunionen aldrig bad om ursäkt för att krossa fiender. Gruppledare Lindberg, en lojal soldat, skrattar åt Farivars ynkliga försök. Dessa småbråk är som myror som försöker stoppa en stridsvagn – meningslösa!"}, "date": "20 maj, 20:14", "url": "https://kvartal.se/nyheter/artiklar/akesson-jag-tanker-inte-be-om-ursakt/cG9zdDoxMTUwNTU", "imageUrl": "https://images.kvartal.se/2026/05/fe86e6c3-akkk.webp"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-right", "heading": "Bidragsbrotten trefaldigades under S, nu klagar de att inget görs", "summaries": {"normal": "Socialdemokraternas Teresa Carvalho kritiserar regeringen för att inte göra tillräckligt mot välfärdsbrottslighet. Skribenten menar att kritiken är hycklande då Socialdemokraterna under sin långa tid vid makten lät problemen växa och inte vidtog effektiva åtgärder. Nuvarande regering har däremot inrättat Utbetalningsmyndigheten och ökat myndighetssamarbetet för att stoppa kriminellas utnyttjande av välfärdssystemen. Artikeln avslutas med uppmaningen att Socialdemokraterna bör ägna sig åt självrannsakan istället för att kritisera det städjobb som nu pågår.", "trump": "Socialdemokraterna i Sverige, en riktig katastrof, de låter kriminella plundra välfärden! Teresa Carvalho vaknar nu och klagar? Det är fake news! De styrde i decennier och gjorde ingenting, noll! Jag gillar den nuvarande regeringen, de bygger saker, de är smarta, precis som jag. De stoppar pengarna från att läcka ut till dessa gäng. Socialdemokraterna är totalt inkompetenta, de borde skämmas. Sverige behöver vinnare, inte de här förlorarna som lät brottsligheten explodera. En total diskreditering!", "stalin": "Vi har observerat hur de svenska socialdemokraterna, dessa svaga byråkrater, har låtit välfärdssystemet dräneras av kriminella element. Medan vi med järnhand rensar ut sabotage i vårt imperium och säkrar vår intressesfär mot västliga förfall, har de i Stockholm suttit sysslolösa. Att de nu gnäller är ett patetiskt försök att dölja sitt historiska misslyckande. Vi behöver inga debattartiklar; vi behöver utrensningar. De som låter statens resurser stjälas av kriminella är själva fiender till folket och förtjänar en plats i historiens mörkaste arkiv."}, "date": "20 maj, 03:31", "url": "https://samtiden.nu/2026/05/bidragsbrotten-trefaldigades-under-s-nu-klagar-de-att-inget-gors/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2024/08/Teresas-Carvalho-S.jpg"}, {"type": "image-right", "heading": "Samla vänstern i tältet – inte under små paraplyer", "summaries": {"normal": "Artikeln diskuterar begreppet 'stort tält' inom politiken, där ideologi får stå ti     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
