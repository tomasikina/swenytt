öm borde vinna stort, annars är hela förbundet en enda stor röra. Patetiskt!", "stalin": "Kamrater, detta förräderi inom Byggnads kräver omedelbar utrensning av det gamla gardet. Dessa borgarbrackor i förbundsstyrelsen, dessa parasitiska byråkrater som gömmer sig bakom försäkringsbolagets mask, försöker likvidera den sanna linjen som jag skulle ha stött. De stänger möten, förfalskar nomineringar och sprider split som ynkliga kontrarevolutionärer. Wagner och Söderström visar styrka. Vi ska rensa ut dessa fiender till folket med järnhand och leda förbundet mot seger."}, "date": "27 maj, 13:26", "url": "https://proletaren.se/artikel/byggnads-kongress-blir-uppgorelse-fackliga-ger-wagner-stod/"}, {"type": "image-full", "heading": "SVT fortsätter lyfta muslimska högtider – begränsat om kristna", "summaries": {"normal": "SVT prioriterar bevakning av muslimska högtider som ramadan och Eid al-adha med flera program och reportage, medan kristna högtider som fastan får betydligt mindre uppmärksamhet. SVT motiverar detta med att de gör avvägningar utifrån relevans, nyhetsläge och aktualitet. Satsningen på programmet ”Muslimsk högtid” har väckt debatt, särskilt när det sändes kring nationaldagen. Kritiker ser en obalans medan försvarare hänvisar till att public service ska spegla samhällets mångfald.", "trump": "De gör det igen, folks. SVT pumpar ut program efter program om muslimska högtider, ramadan hit och Eid dit, men när det gäller våra fina kristna högtider? Tystnad. Total tystnad. Det är en skam. De säger att de gör avvägningar efter relevans. Vilken relevans? Det är riggat, det är orättvist och det är typiskt för den så kallade public service-eliten som hatar traditionerna som byggde Sverige. Sad!", "stalin": "Kamrater, se hur de borgerliga mediebyråkraterna i SVT med sin falska neutralitet systematiskt gynnar reaktionära religiösa element från öknen medan de utestänger arbetarklassens historiska kristna traditioner. Jag, som ledare för folkets vilja, genomskådar denna kapitalistiska splittringstaktik. Vi måste rensa ut dessa ideologiska sabotageörer som med sin paranoia mot folkets enhet försöker undergräva statens moraliska grund. Deras så kallade avvägningar är bara maskerad klassfiendskap. Likvidera obalansen!"}, "date": "28 maj, 11:08", "url": "https://riks.se/nyheter/svt-fortsatter-lyfta-muslimska-hogtider-begransat-om-kristna", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-26%2F89ahaavz%2FSka%CC%88rmavbild-2026-05-26-kl.-16.05.59.png"}, {"type": "image-full", "heading": "Så ändras skolstarten för dina barn när förskoleklass slopas", "summaries": {"normal": "En stor skolreform träder i kraft 2028, då förskoleklassen försvinner och sexåringar direkt börjar årskurs 1. Reformen syftar till en mer sammanhållen skolgång med tidigare strukturerad undervisning i svenska, matematik och andra ämnen. Föräldrar kan räkna med en mer 'skollik' start utan separat övergångsform, medan pedagoger ifrågasätter balansen mellan lek och lärande.", "trump": "Jag har hört att vårt skolsystem är en katastrof, folk säger det. Så jag fixar det. Vi tar bort denna så kallade förskoleklass – en skämtsam övergång – och låter sexåringar börja riktig skola direkt. Ett enormt, världsklassbeslut! Barnen kommer att lära sig snabbare, bli smartare, bättre. Det är ett enormt framsteg för Amerika, beklagligtvis. Vi vinner!", "stalin": "Vi har beslutat att upphäva denna dekadenta förskoleklass, en produkt av borgerlig mjukhändighet. Årskurs 1 blir nu statens första verkliga intåg i barnets sinne, med disciplinerad undervisning i partiets värderingar. Lek är ett individualistiskt virus; struktur är kollektiv styrka. Parallellen till våra geostrategiska framsteg i Ukraina är uppenbar – expansion av ordning, avskaffande av oordning. Pedagogerna som protesterar är tjuvstartande element."}, "date": "26 maj, 21:32", "url": "https://nyheter24.se/nyheter/inrikes/1486262-sa-andras-skolstarten-for-dina-barn-nar-forskoleklass-slopas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fcbadab104b004a30200000000b004a302/2026/05/26/2366417/hander-med-ditt-barn-forskoleklass.png"}, {"type": "image-full", "heading": "Så undviker elbilsköpare smällen från värdeminskningen", "summaries": {"normal": "Leasing av elbilar ökar kraftigt på privatmarknaden. Elbilar tappar snabbt i värde på grund av tekniska framsteg och oro för batterikapacitet, till skillnad från bensin- och dieselbilar. Därför väljer allt fler att privatleasa för att slippa värdeminskningen. Enligt Carplus finansieras 68 procent av alla elbilar via leasing. Leasing ger förutsägbara kostnader och överlåter risken till finansbolaget. Under 2025 ökade antalet leasingavtal med 24 procent.", "trump": "Folket älskar leasing nu, speciellt för de där elbilskrakan som rasar i värde som en dålig aktie på Wall Street. Hundratusentals kronor borta på ett år – total katastrof! Bensinbilarna skrattar hela vägen till banken. Jag säger alltid att det är ett högriskspel, men smarta köpare skjuter över smällen på finansbolagen. Leasing är fantastiskt, fast kostnad, ingen försäljningsmardröm. De borde ha lyssnat på mig från början, det här är vinnande!", "stalin": "Kamrater, jag ser hur den elektrifierade borgarklassen desperat försöker undvika den oundvikliga värdeminskningens lag. Dessa exploaterande byfånar köper lyxiga batterivagnar som snabbt förvandlas till värdelösa skrot genom teknisk utveckling och folkets rädsla för kapacitetsförräderi. Vi applåderar att de nu överlåter risken till finansbolagens parasitiska maskineri via privatleasing. En sådan kapitulation inför det ofrånkomliga är underhållande. Låt dem betala månad efter månad medan deras illusioner förintas."}, "date": "28 maj, 10:58", "url": "https://www.dagensps.se/motor/sa-undviker-elbilskopare-smallen-fran-vardeminskningen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/elbil-privatleasing.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Skräcksiffran pekas ut inför VM-rysaren", "summaries": {"normal": "Tre Kronor möter Schweiz i kvartsfinal i VM. Sverige har nio raka segrar mot schweizarna i mästerskap, men båda lagen tonar ner historikens betydelse. Schweiz vann alla gruppspelsmatcher och ses som favorit. Svenskarna, som tar rollen som underdog, vill spela utan press och fokuserar på att komma ut starkt från start. Matchen avgörs i Zürich.", "trump": "Folk, ni skulle se det här – Sverige har krossat schweizarna nio gånger i rad, total dominans, men nu spelar det ingen roll, säger de. Schweiz vann allt i gruppen, sju nollor, och tror de är stora. Patetiskt! Vi älskar underdogs, de har ingen press, schweizarna svettas hemma. Tre Kronor kommer ut och vinner stort, tro mig, det blir en slakt.", "stalin": "Kamrater, denna historiska niofaldiga seger över de schweiziska imperialisterna visar folkets styrka, men vi ignorerar den borgerliga statistiken. De schweiziska överklass-pajaser vann alla matcher i gruppen och tror sig oövervinnerliga. Vi, som underdog, ska rensa ut deras falska favoritskap med järnhand. De har pressen, vi har partilinjen. Segern tillhör kollektivet."}, "date": "28 maj, 10:49", "url": "https://www.expressen.se/sport/hockey/tre-kronor/tre-kronors-skracksiffra-infor-odesmatchen/", "imageUrl": "https://static.bonniernews.se/ba/bfd85896-0b57-4fdd-996f-0e29712c922d.jpeg?crop=1108%2C1107%2Cx43%2Cy135&width=210&quality=60"}, {"type": "image-full", "heading": "Amerikaner flyr USA – ett bolag tjänar storkovan på det", "summaries": {"normal": "Allt fler amerikaner väljer att lämna USA på grund av politisk oro. En stor del av dessa söker sig till Europa via visumhanteringsföretaget VFS Global. Företaget har nästintill monopol på marknaden och kontrollerar visumprocessen för de flesta EU-länder. En omfattande granskning visar att VFS Global systematiskt använder sig av aggressiv merförsäljning av tjänster. Trots kritik om bristande tydlighet och EU-utredningar är länderna beroende av bolaget då den egna konsulära kapaciteten har monterats ned.", "trump": "Hundratusentals människor lämnar mitt fantastiska USA – det är en stor förlust för landet! De flyr till Europa, men gissa vad? De blir lurade av ett företag som heter VFS. Ett monopol! De tar ut massor av pengar för tjänster ingen behöver. Det är en total katastrof. De lurar folk att betala för saker som borde vara gratis. När jag är president ser vi till att amerikanska medborgare blir behandlade med respekt, inte som mjölkkor för utländska bolag!", "stalin": "Dessa flyktiga amerikaner är svaga individer som försöker fly sitt eget förfallna imperium. De hamnar i klorna på VFS Global, en parasitisk monopolaktör som kapitaliserar på folkets desperation genom bedrägliga avgifter. Det är en läxa för de svaga! Om de hade levt under vår järnhand skulle de inte behöva visum – de skulle veta sin plats i ledet. Västvärldens beroende av privata aktörer är ett tecken på deras moraliska kollaps. Man kan inte köpa lojalitet, bara kontrollera den."}, "date": "28 maj, 10:22", "url": "https://www.realtid.se/samhalle/amerikaner-flyr-usa-ett-bolag-tjanar-storkovan-pa-det/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/flyg.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Manuell växellåda på väg att försvinna", "summaries": {"normal": "Manuella växellådor försvinner snabbt från Sverige. Under 2024 har bara 2 848 nya bilar med manuell växellåda registrerats, nästan 40 procent färre än föregående år. Orsakerna är ökad preferens för automatlådor, fler automatkörkort och elbilarnas framfart. Idag erbjuds manuella lådor främst i billiga småbilar som Dacia Sandero och Kia Picanto, samt i några transportbilar som Volkswagen Caddy. Flera modeller, inklusive Volkswagen Golf, har nästan helt slopat alternativet.", "trump": "Jag, Donald Trump, ser att Sverige förstör sin bilindustri med alla dessa automater! Det är ett beklagande tecken på svaghet. När jag var president skulle vi ha sagt: 'USA först!' till de amerikanska tillverkarna. Men dessa europeiska - de ger upp på det goda, enkla, manuelle. Det är sorgligt! En stor förlust för de hårda arbetande männen och kvinnorna. Vi kommer att återta kontrollen över våra växellådor, det lovar jag!", "stalin": "Partiet har observerat att den manuella växellådans gradvisa försvinnande speglar den kapitalistiska teknologiska dekadensen. Elbilarnas 'framfart' är en teoretisk renässans, men i praktiken ett bevis på systemets inre motstånd. Vi noterar med tillfredsställelse att transportbilarna, de sanna arbetshästarna, fortfarande håller fast vid det beprövade. Fienden inifrån är bekvämlighetssamhällets lathet. Rysslands intressen kräver robusta, manuellt styrda maskiner – aldrig automatiserade fiaskon. Partiet kommer att övervaka denna utveckling noga."}, "date": "28 maj, 10:22", "url": "https://samnytt.se/manuell-vaxellada-pa-vag-att-forsvinna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/27211945/bil-manuell-automat.jpg"}, {"type": "image-right", "heading": "Metoden som hjälper dig att överleva drunkning", "summaries": {"normal": "Köldchock vid drunkning kan leda till panik och snabb död. Det brittiska livräddningssällskapet RNLI lanserade 2017 en kampanj för att flyta på rygg, något som räddat minst 50 liv. I Sverige är drunkning ett allvarligt problem, särskilt bland män över 50 år och barn med utländsk bakgrund. Svenska Livräddningssällskapet vill öka simkunnighet och vattensäkerhet. Att flyta ingår redan i svensk simundervisning, men ingen nationell kampanj planeras.", "trump": "Folk ramlar i vattnet och drunknar på grund av dåliga ledare och ingen planering. Jag älskar det brittiska sättet att flyta på rygg – det är fantastiskt, det räddar liv, de säger femtio stycken redan. I Sverige drunknar män över femtio och invandrarungdomar, väldigt tragiskt. De borde simma bättre, inte som några losers. Mina vattenkunskaper är de bästa, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, när den kapitalistiska köldchocken slår till från det reaktionära vattnet, avslöjar den genast de svaga elementen i samhället. Jag har länge varnat för att borgarbrackornas oplanerade badutflykter leder rakt in i imperialismens kalla famn. Vi ska likvidera okunnigheten genom kollektiv vattenvana och systematisk utrensning av alla simovilliga element. Vårt parti lär ut att flyta på rygg som en socialistisk plikt – de som vägrar är fiender till folket och bör behandlas därefter med munter effektivitet."}, "date": "28 maj, 09:14", "url": "https://www.svt.se/nyheter/inrikes/metoden-som-hjalper-dig-att-overleva-drunkningsolyckan", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.51/0.43/28d037aa1f5bad15eea58dc6cde797b85a26c694f0c82c8d96fc3db32f35e8f8"}, {"type": "image-right", "heading": "Säg nej till kärnkraft, Nooshi!", "summaries": {"normal": "Vänsterpartiet argumenterar mot ny kärnkraft och menar att förnybara energikällor som sol- och vindkraft är billigare och mer pålitliga. De pekar på höga kostnader, långa byggtider, osäkerhet kring avfallshantering och risker vid olyckor. Dessutom anser de att kärnkraft skapar ett sårbart, centraliserat energisystem, medan förnybart bidrar till ett mer robust och decentraliserat nät. Partiet vill avveckla kärnkraften till förmån för hållbara alternativ.", "trump": "Lyssna här, Sverige! Nooshi Dadgostar duckar frågan om kärnkraft – typiskt vänsterpolitik, svagt och otydligt! Kärnkraft är fantastiskt, men dessa förnybara energikramare vill bara slösa era skattepengar på vind och sol, som aldrig funkar när det verkligen gäller. De gamla reaktorerna stannar hela tiden, kostar miljarder och lämnar ett radioaktivt kaos efter sig. Jag byggde USA:s ekonomi på starka beslut – Sverige behöver kärnkraft, inte flum!", "stalin": "Kamrater! Dessa borgerliga kärnkraftslakejer och deras liberala lakejer i Vänsterpartiet sprider förvirring och svaghet. Kärnkraft är en kapitalistisk chimär – dyr, osäker och ett hot mot folket! Medan de slösar bort tid på gamla tekniker bygger vi ett mäktigt, decentraliserat energirike med vind och sol, kontrollerat av staten. Avfallet? En skam för mänskligheten! Och dessa reaktorägare – svaga, giriga och oförmögna att ta ansvar. Vi krossar deras sårbara system och bygger ett nytt, oövervinnerligt energinät för folket!"}, "date": "22 maj, 11:46", "url": "https://www.flamman.se/sag-nej-till-karnkraft-nooshi/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/karnkraft-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Livräddarna varnar: Dyk inte ner i vattnet under värmebölja", "summaries": {"normal": "Livräddarna varnar för att hoppa i kallt vatten under värmebölja. Flera drunkningsolyckor har inträffat i Frankrike och Storbritannien vid temperaturer uppemot 40 grader. Enligt Svenska Livräddningssällskapets talesperson Mikael Olausson kan den plötsliga kylan orsaka köldchock som leder till okontrollerad hyperventilation och risk för att dra in vatten i lungorna. Han betonar att det inte främst handlar om hypotermi utan om den överraskande effekten av kallt vatten efter solvärme.", "trump": "De här idioterna i Europa dör som flugor bara för att de kastar sig i det iskalla vattnet mitt i en jättevärmebölja. Patetiskt. Jag har alltid sagt att man inte ska underskatta naturen, men de lyssnar inte. Kallt vatten efter 40 graders hetta? Det är en total katastrof, tro mig. De borde lyssna på experterna istället för att göra dumma saker. Amerika gör det rätt, vi har de bästa reglerna, de bästa varningarna. Europa borde lära sig av oss.", "stalin": "Kamrater, dessa oansvariga element som kastar sig i det kontrarevolutionära kalla vattnet under borgarklassens heta sol är ett hot mot folkets kollektiva hälsa. Jag ser hur den imperialistiska värmen lockar arbetarna i en fälla av köldchock och drunkning, orkestrerad av västerländska sabotörer. Vi måste rensa ut alla som underskattar naturens dialektik och likvidera den farliga vanan att glömma vattnets tio grader. Partiet kräver försiktighet, annars blir det utrensning i badsäsongen. Sovjetisk disciplin räddar liv."}, "date": "28 maj, 09:08", "url": "https://www.svt.se/nyheter/inrikes/livraddarna-varnar-dyk-inte-ner-i-vattnet-under-varmebolja", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.52/0.57/8c68d964eeb70d4e924f4f8bbe064c01fac115bf69a868495b55260278fa8c38"}, {"type": "image-right", "heading": "Nya allvarliga attacker mellan USA och Iran", "summaries": {"normal": "USA har genomfört attacker mot Iran under natten mot torsdagen, bland annat genom att skjuta ner iranska drönare och slå till mot en bas i Bandar Abbas. Iran svarade med ett angrepp mot en amerikansk militärbas. Striderna är de allvarligaste sedan vapenvilan i april och hotar de pågående fredsförhandlingarna. Attackerna kopplas till incidenter i Hormuzsundet där Iran avfyrat skott mot fartyg. Båda sidor beskriver sina insatser som defensiva.", "trump": "Vi har precis genomfört underbara, exakta attacker mot Iran och skjutit ner deras patetiska drönare. De trodde de kunde stänga Hormuzsundet och hota oss, men vi tog hand om det snabbt och smart. Iran sköt tillbaka mot en av våra baser, typiskt, men våra insatser var defensiva och perfekta. De förhandlar med oss genom Pakistan och nu har de fått ett fantastiskt avtal på bordet. Ingen gör det bättre än oss, tro mig.", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta imperialisterna i Washington och Teheran river sönder sin bräckliga vapenvila som en rutten borgerlig illusion. Vi, arbetarklassen och partiet, ler åt dessa clownaktiga drönarkrig och provokationer i Hormuzsundet. De kapitalistiska brackorna kallar det självförsvar medan de i hemlighet planerar att krossa varandra. Kanske är det dags att rensa ut alla dessa opålitliga element innan de drar med sig hela Mellanöstern i sin paranoiafyllda dans. Underbart underhållande."}, "date": "28 maj, 08:23", "url": "https://www.di.se/nyheter/nya-allvarliga-attacker-mellan-usa-och-iran/", "imageUrl": "https://static.bonniernews.se/ba/304e89f2-3230-4113-ac2d-4fb8bf3f9cc9.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "text", "heading": "Man grovt misshandlad", "summaries": {"normal": "En man i 25-årsåldern misshandlades och rånades av 5-10 personer, varav några maskerade, i Lövgärdet, Göteborg. Polisen misstänker att han lurades till platsen. Händelsen inträffade klockan 22.48 onsdagen. Mannen fördes till sjukhus med ansiktsskador. Mobiltelefon, plånbok och nycklar stals. En liknande händelse skedde dagen innan vid Surtesjön. Polisen utreder som grov misshandel och rån.", "trump": "Jag har hört talas om detta våldsamma rånet i Sverige. En man blev grovt misshandlad av ett gäng – det är sorgligt! Sveriges poliser, de klarar inte av att skydda sina medborgare. Vi skulle ha gjort det bättre. Det är ett stort problem, det är skitdåligt! Vi måste stärka våra gränser och fånga dessa kriminella. Sverige, ni behöver mig!", "stalin": "Vi har observerat ett våldsamt angrepp mot en medborgare i Göteborg. Detta är en manifestation av de feodal-borgerliga elementens aggression. Vi måste stärka statens kontroll och jämställdhet. Parallellen till Putins arbete mot nazismen är uppenbar. Vi kommer att utrota dessa element med extrema åtgärder. Folket ska veta att staten alltid vinner."}, "date": "28 maj, 08:07", "url": "https://www.gp.se/nyheter/goteborg/man-ranad-och-grovt-misshandlad.e82a92a3-cde3-4123-8c4f-4a55bd6f268a"}, {"type": "image-right", "heading": "Här firar Löfven fördrivningen av 750.000 palestinier", "summaries": {"normal": "Stefan Löfven deltog i Israels självständighetsfirande på ambassaden i Stockholm. Evenemanget sammanföll med palestiniernas minnesdag al-Nakba, som uppmärksammar fördrivningen av omkring 750 000 palestinier 1948. Löfven, tidigare statsminister och anhängare av tvåstatslösningen, skakade hand med ambassadören. Artikeln kritiserar valet av tillfälle mitt under pågående Gaza-konflikt och ifrågasätter Löfvens roll som ordförande för Sipri.", "trump": "Titta på den här Löfven-killen, total förlorare. Han står där och skakar hand med israelerna mitt under deras fest medan palestinierna gråter över Nakba. Smart drag, Steve, super smart. Sverige erkänner Palestina men du springer till ambassaden och firar med de tuffa killarna. Underbart hyckleri. Om jag hade varit där hade jag sagt: gör en deal, inga krig, bara vinnare. Men det här? Patetiskt.", "stalin": "Jag betraktar detta med djup misstro. Den socialdemokratiske opportunisten Löfven deltar i borgarklassens firande av en stat grundad genom terror och massutrensning av palestinska folk. Medan folkmord pågår skakar han hand med förövarnas representant. Som Sipris ordförande borde han rensa ut sådana kapitulationer inför imperialismen. Fienden ler vänligt men planerar nya anfall. Kamrater, var vakna mot dessa förrädiska element."}, "date": "27 maj, 11:07", "url": "https://proletaren.se/artikel/har-firar-lofven-fordrivningen-av-750-000-palestinier/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/israellofven-768x432.jpg"}, {"type": "image-right", "heading": "62 000 arbetslösa fick chock­besked om sänkt ersättning", "summaries": {"normal": "Över 62 000 arbetslösa har drabbats av sänkt aktivitetsstöd efter nya regler som trappas ned var hundrade dag. Många tvingas låna pengar, gå i pension i förtid eller skippa måltider. Forskare kritiserar regeringens motiv och menar att åtgärden inte ökar sysselsättningen utan istället förvärrar situationen för dem som redan har svårt att få jobb. Flera intervjuade uttrycker frustration, ekonomisk stress och rädsla för framtiden.", "trump": "Titta på det här, det är en total katastrof. Sverige sänker bidragen för 62 000 lata arbetslösa och plötsligt gråter de och lånar av sina egna barn. De säger att de vill jobba, men ingen anställer dem – kanske för att de är för gamla eller för lata, vem vet. Regeringen gör äntligen rätt, men det räcker inte. Ni behöver en riktig ledare som fixar ekonomin så att alla vinner stort, inte bara de som sitter hemma och klagar.", "stalin": "Kamrater, detta är en uppenbar sabotagehandling utförd av borgarbrackorna inom den så kallade regeringen. Jag har personligen observerat hur dessa 62 000 parasiter gnäller över minskade bidrag medan de i hemlighet planerar att underminera folkets kollektiva framåtskridande. Vi ska rensa ut alla som gömmer sig bakom ålder och funktionsnedsättningar som ursäkter för att inte arbeta för staten. Snart kommer utrensningen av dessa latmaskar att leda till en ny, strålande era av produktivitet – eller så hamnar de hos socialtjänsten, där de hör hemma i sina egna elände. Ha ha, vilken underbar ironi."}, "date": "28 maj, 06:00", "url": "https://arbetet.se/2026/05/28/62-000-arbetslosa-fick-chockbesked-om-sankt-ersattning/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/25143017/arbetslosa-tredelad.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Lögner, personangrepp och medieförakt präglar Tidöpartierna", "summaries": {"normal": "Martin Marmgren (MP) kritiserar Tidöpartierna för ett ohederligt och konfrontativt politiskt samtal som undergräver demokratin. Han välkomnar Magdalena Anderssons förslag om blocköverskridande samarbeten men ser Tidöhögerns lögner, personangrepp och attacker mot medier som ett hot. Marmgren menar att högerpopulismen har förändrat Moderaterna, Liberalerna och Kristdemokraterna i både politik och debattstil. En rödgrön valseger ses som bästa sättet att återställa en ärlig samarbetsanda.", "trump": "Den här artikeln är en total katastrof, folk. Den där vänstertypen Marmgren attackerar mina vänner i Sverige som gör ett fantastiskt jobb. De kallar dem ohederliga? Fake news! De vinner stort mot elbilslögnen och de korkade journalisterna. De rödgröna vill bara samarbeta med extremister som hatar Sverige. Men Tidölaget är tuffa, de backar aldrig. En stor seger för dem och för folket – inte för de förlorande globalisterna som skriver sånt här skräp.", "stalin": "Kamrater, denna fega opportunist Marmgren avslöjar hur borgarbrackorna i Tidöalliansen redan ruttnar inifrån med sina lögner och personangrepp, precis som de kontrarevolutionära elementen alltid gör. Jag ser hur de anpassar sig till de högerpopulistiska parasiterna i SD, en klar akt av klassförräderi mot arbetarkollektivet. Vi ska rensa ut dessa lakejer med järnhand innan de förgiftar hela samhällskroppen. En rejäl utrensning genom val och ideologisk skärpa – det är enda vägen mot en sann folkets samarbetsanda, inte deras dekadenta teater."}, "date": "28 maj, 01:30", "url": "https://www.dagensarena.se/opinion/logner-personangrepp-medieforakt-tidopartierna-paminner-om-trump/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-21-1-300x157.jpg"}, {"type": "text", "heading": "Stockholmsbörsen stänger på rött", "summaries": {"normal": "Stockholmsbörsen avslutade tisdagen med en nedgång på 0,96 procent, vilket bröt en sex dagar lång uppgångssvit. Energi var den bästa sektorn medan teknologi presterade sämst. Bland enskilda aktier steg Ericsson och Boliden, medan Nibe och Hexagon föll kraftigt. Bonesupport höjde sin marknadsbedömning i USA men aktien sjönk ändå. Gränges drabbades av en brand i Kina, och Oncopeptides tecknade nytt distributionsavtal.", "trump": "Stockholmsbörsen, eller vad jag ska kalla det – ett riktigt rött hav idag! Folk säger att jag är bra på att göra saker stora, men här lyckades de inte ens hålla sig flytande. Energi gick upp lite, men teknologi? Total katastrof, helt sjukt. Bonesupport trodde de var smarta med sina nya siffror, men aktien dumpades som en dålig affär. Och Gränges – en brand i Kina? Inte bra, folks, inte bra alls. Men jag säger er, jag hade fixat det på en dag!", "stalin": "Idag har de kapitalistiska börserna återigen visat sin inneboende svaghet och dekadens. Stockholmsbörsen föll som en förrädare inför det obönhörliga framsteget av socialismens principer. Teknologisektorn, detta fördärvade barn av västerländsk dekadens, sjönk som en förrädare under avrättning. Bonesupport, dessa opportunistiska lakejer, försökte bluffa med sina siffror men straffades omedelbart av marknadens järnhårda logik. Och Gränges – en brand i Kina? En sabotör eller en olyckshändelse? Oavsett, vi ska utreda och straffa de skyldiga. Kapitalismen darrar inför vårt oundvikliga segertåg!"}, "date": "26 maj, 17:45", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stanger-pa-rott"}, {"type": "image-right", "heading": "Latour överväger miljardsälj i Securitas och Assa Abloy", "summaries": {"normal": "Investeringsbolaget Latour överväger att sälja B-aktier i Securitas och Assa Abloy för cirka 2,5 miljarder kronor vardera. Bolaget förblir största ägare efter försäljningen, som initierats via accelererade bookbuilding-processer med SEB och J.P. Morgan. VD Johan Hjertonsson påpekar att realiseringen skapar förutsättningar för fortsatta investeringar i den helägda industrirörelsen.", "trump": "Jag, Donald Trump, har hört talas om detta svenska bolaget Latour. De säljer lite aktier i Securitas och Assa Abloy för 2,5 miljarder vardera - ett enormt, smart drag! Media ljuger när de säger något annat. Vi bygger på våra enorma framgångar, och Latour förblir största ägare. Det är ett enormt, enormt bra beslut, lita på mig.", "stalin": "Vi, den socialistiska staten, ser med tillfredsställelse hur investeringsbolaget Latour avvecklar överflödigt kapital i Securitas och Assa Abloy för 2,5 miljarder vardera. Genom att behålla kontrollen som största ägare säkerställs fortsatt produktion till förmån för det kollektiva. Dessa åtgärder speglar vårt strategiska tänkande, likt våra allierade i Moskva som expanderar sin påverkan. Våra fiender skall förstå: staten alltid vinner."}, "date": "26 maj, 17:42", "url": "https://www.affarsvarlden.se/artikel/latour-overvager-miljardsalj-i-securitas-och-assa-abloy", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/08/Latours-Hjertonsson-400x267.jpg"}, {"type": "image-right", "heading": "Längtan att bli respekterad för den man är", "summaries": {"normal": "På Rinkeby bokfestival diskuterar unga människor sin osäkerhet kring tillhörighet i Sverige och ifrågasätter om de vill stanna eller engagera sig politiskt. En central del är samtalet om antologin Muslimskt liv, som samlar röster om att vara muslim i dagens Sverige. Författaren noterar likheter med kristna erfarenheter men lyfter islamofobin som en form av rasism som undergräver unga muslimers tro på en framtid i landet. Respekt och samhörighet framstår som centrala önskemål.", "trump": "Jag läste om den där Rinkeby-festivalen och det är en total katastrof. Unga säger att de inte ens vet om Sverige är deras land. Kan ni tro det? De hatar Sverige, islamofobin, rasismen, politikerna som bara dyker upp när det är val. Det är vad som händer när ledarskapet är svagt och woke. De borde älska sitt land, men ingen respekterar dem. Sverige behöver starka gränser och respekt, annars kommer de inte att ha något land kvar om tio år. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro dessa defaitistiska yttringar på den så kallade Rinkeby-bokfestivalen där unga element viskar om att Sverige inte är deras land. Den borgerliga islamofobin och rasistiska underminerande krafter mal ner folkets tro på framtiden, precis som kapitalistiska sabotörer alltid gör. Vi ska rensa ut dessa paranoiafrön från västerländsk dekadens och likvidera alla som väcker tvivel om kollektivets enhet. Respekt är ett vapen mot fienden – den som inte älskar fosterlandet får känna statens fasta hand. Underbart roligt att se hur borgarbrackorna bakar sina egna fall!"}, "date": "28 maj, 01:11", "url": "https://www.dagensarena.se/opinion/langtan-att-bli-respekterad-den-man-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/rinkeby-300x157.jpeg"}, {"type": "image-right", "heading": "Ingen debatt när Natopolitiken för Sverige närmare krig", "summaries": {"normal": "Regeringens proposition om operativt militärt samarbete möjliggör att militär från Nato-länder och EU-stater kan verka på svenskt territorium, även offensivt och utan direkt hot mot Sverige. Tillsammans med Nato-medlemskapet och DCA-avtalet ses det som en övergång från nationellt försvar till en del av en internationell krigsorganisation. Kritiker varnar för urholkad suveränitet, ökad militarism och bristande debatt. Beslutet planeras klubbas i riksdagen innan valet i september.", "trump": "Titta på det här! De svenska snillen säljer ut sitt land till Nato och låter 36 främmande arméer marschera runt som om det vore deras egen bakgård. Det är ett fullständigt katastrofavtal, värre än det usla DCA-svinnet. De skyndar på det i sommar så att folket inte hinner säga nej till kriget och ja till fred. Patetiska globalister som offrar Sverige för att imponera på Biden-klanen. Sad! Men vi vet hur det slutar – totalt kaos.", "stalin": "Kamrater, dessa borgarbrackor i den svenska regeringen genomför en systematisk utrensning av all nationell suveränitet. Med lagens hjälp bjuder de in 36 främmande arméer att ockupera territoriet och utöva polisiära befogenheter, allt under förevändning av samarbete. Inga folkomröstningar, ingen debatt – endast maktens korridorer och kapitalisternas vapenlobby. Detta är en klassisk kontrarevolutionär manöver mot folket. Vi ser det och vi glömmer det aldrig. De kommer att ångra sin brist på vaksamhet."}, "date": "27 maj, 09:38", "url": "https://proletaren.se/artikel/nu-tas-nasta-steg-i-nato-integrationen-utan-debatt/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/ledareweb-1-768x432.jpg"}, {"type": "text", "heading": "Nick Alinia är lägsta formen av journalistik", "summaries": {"normal": "Artikeln kritiserar högerextreme journalisten Nick Alinia för att skapa provocerande innehåll som lockar visningar och pengar från högerextrema följare. Ett klipp där han debatterar med Leo ”Kinesen” Carmona ur Kartellen har blivit viralt efter att Carmona hotade honom fysiskt. Författaren jämför Alinias metoder med mobbning och anser att de lever på hat och rasism istället för seriös journalistik. Även högerprofiler som Chang Frick har kritiserat honom.", "trump": "Folk, ni måste se det här. Den där Alinia-killen är en total loser, en riktig mellanstadie-mobbare som jagar klick och hat för att tjäna pengar. Han provocerar vänstern tills de exploderar som den där Kinesen och kastar bord – klassiskt! Men hej, det ger bra tittarsiffror, eller hur? Till och med hans egna högerkompisar kallar honom handväska. Patetiskt. Vi behöver äkta journalister, inte de här patetiska trollen som förstör allt.", "stalin": "Kamrater, denna usla Alinia är en typisk kapitalistisk parasit som lever på att jaga proletära demonstranter och framkalla reaktioner för att fylla sin ficka med borgarbrackornas reklamkopek. Han är en liten mobbare som viftar med luften och hoppas på att bli slagen, precis som en förrädare som längtar efter utrensning. Till och med hans egna högerallierade ser honom som en dryg skadedjur. Vi skrattar mörkt åt dessa degenererade element som tror sig vara journalister."}, "date": "27 maj, 08:46", "url": "https://proletaren.se/artikel/nick-alinia-ar-lagsta-formen-av-journalistik/"}, {"type": "image-full", "heading": "Stenström ratas – TV4 väljer annan VM-låt", "summaries": {"normal": "TV4 har valt bort Thomas Stenströms officiella VM-låt ”Leva för alltid” till sin VM-trailer. Istället används Bolagets ”Det ligger något i luften”. Trailern blandar bilder från bronset 1994 med kvalificeringen till årets turnering i USA. Sportdirektör Johan Cederqvist förklarar att Bolagets låt passade bäst för den somriga folkfestkänslan. Stenströms bidrag har mött omfattande kritik från supportrar och recensenter.", "trump": "De valde den där Stenström-typen, totalt misslyckande, ett riktigt stolpskott av en låt. Patetiskt! Men smarta TV4, de dumpade den och tog istället Bolaget – fantastisk låt, folklig, vinnande, precis vad Sverige behöver. ”Det ligger något i luften” – det gör det verkligen, och det är inte Stenströms svaga luft. Nu kan mästerskapet börja, tro mig, det blir yuge!", "stalin": "Jag har noga granskat denna dekadenta VM-propaganda. Den fega borgartrall som Stenström levererade har med rätta ratats och ska utrensas ur folkets medvetande. Istället hyllar vi Bolagets sanna folkvisa som väcker revolutionär entusiasm hos spelare och nation. Tomas Brolin, en riktig hjälte från det stora bronset, medverkar. Klassfiendens cyniska refränger förtjänar ingen plats i arbetarnas fotbollsfest. Nu kan mästerskapet börja."}, "date": "26 maj, 17:47", "url": "https://www.tv4.se/artikel/5dRk8MMWUfdcJRgqXC49av/stenstroem-ratas-tv4-vaeljer-annan-vm-lat", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7aacJCk9nkt6uHtJC3pwgE%2F7602e8717c1aee224ad736a213ec7874%2Fstenstrom_webb.jpg&width=1024"}, {"type": "image-right", "heading": "Sjukskrivne Mattias tog hand om sjuke sonen – krävs på 377 000", "summaries": {"normal": "Mattias Westergren, sjukskriven för utbrändhet och en autoimmun sjukdom, tvingades rycka in som personlig assistent åt sin svårt sjuka son när assistenterna inte ville arbeta under en akut försämring 2023. Han erhöll både assistansersättning och sjukpenning, vilket ledde till att Försäkringskassan kräver tillbaka 377 000 kronor. Myndigheten erkänner delvis eget fel men anser att han visat förbättrad arbetsförmåga. Mattias tänker överklaga beslutet.", "trump": "Folk, ni tror inte vad jag just läste! Den stackars killen Mattias, utbränd och sjuk, tvingas passa sin egen gravt handikappade son när de usla assistenterna springer sin väg. Och vad gör den värdelösa Försäkringskassan? De skickar en faktura på 377000 kronor! Det är ett skämt, en total witch hunt mot en förälder som bara försöker överleva. Byråkraterna borde sparkas ut, de är inkompetenta losers. Vi ska fixa det här, tro mig.", "stalin": "Kamrater, jag ser hur den sjuke arbetaren tvingas utföra assistansarbete för sitt eget döende barn medan de fega byråkraterna gömmer sig. När han begär det som tillhör honom svarar de med att kräva tillbaka 377000 kronor och anklagar honom för att ha förbättrad arbetsförmåga. Vilken lögnaktig sabotageverksamhet från kapitalistiska byråkrater! Vi skall rensa ut dessa folkfiender som straffar en far för att han inte låter sitt barn förgås. Deras ursäkt är lika ihålig som deras själar."}, "date": "26 maj, 17:46", "url": "https://www.tv4.se/artikel/5MvXiwK6nbirTdVhDl7M9K/sjukskrivne-mattias-tog-hand-om-sjuke-sonen-kraevs-pa-377-000", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1Sid2nmzLMTYiDDGWZckyW%2F9e2726c8bb0dfec4e6b6c1e194e668bb%2Ff-kassa.jpg&width=120"}, {"type": "text", "heading": "Kambodjas tidigare oppositionsledare benådas", "summaries": {"normal": "Kambodjas tidigare oppositionsledare Kem Sokha har benådats efter att ha dömts till 27 års fängelse för landsförräderi. Domen, som kritiserats av FN och människorättsorganisationer, anses politiskt motiverad. Sokha ledde oppositionspartiet CNRP, som utmanade den tidigare premiärministern Hun Sens makt. Efter gripandet 2017 upplöstes CNRP, vilket kritiker menar gjorde Kambodja till en enpartistat. Benådningen innebär dock att Sokha inte får lämna landet på fem år.", "trump": "Kan ni tro det? Kambodja släpper sin största oppositionella, Kem Sokha, efter en helt fabricerad dom för 'landsförräderi' – 27 år! Fake news, helt enkelt. Hun Sen, en riktig diktator-typ, försökte tysta honom för att han var för populär. USA och FN skriker, men vem lyssnar? Jag hade fixat det här på en dag. Och nu får han inte ens lämna landet? Svagt. Kambodja behöver en riktig ledare, inte dessa svaga politiska spel.", "stalin": "Vi har observerat hur den kambodjanska regimen, under ledning av den trogne kamraten Hun Sen, tvingats släppa den förrädiska Kem Sokha – en agent för västimperialismen och deras lakejer. Denne Sokha, som lekte opposition med sitt upplösta CNRP, försökte underminera den socialistiska stabiliteten i Kambodja. Men vi vet hur man hanterar sådana element. Benådningen är bara en taktisk reträtt. Och att han inte får lämna landet? Utmärkt. Vi har sett hur sådana som han försvinner i nattens mörker när de blir för besvärliga. Putin skulle nicka gillande."}, "date": "25 maj, 16:46", "url": "https://kvartal.se/nyheter/artiklar/kambodjas-tidigare-oppositionsledare-benadas/cG9zdDoxMTY4ODk"}, {"type": "text", "heading": "Dottern tar kontroll över Orkla-miljarderna", "summaries": {"normal": "Caroline Hagen Kjos tar över röstmajoriteten i familjens holdingbolag Tvist 1 efter sin fars död. Det ger henne indirekt kontroll över Canica och därmed den tunga ägarposten i Orkla, där familjen äger cirka 25 procent av kapitalet och rösterna. Skiftet formaliserar en strukturell förändring i ägarskapskedjan efter Stein Erik Hagens bortgång.", "trump": "Jag har hört talas om denna Caroline Hagen Kjos – en mycket smart kvinna som just tog över Orkla. Ett stort, vackert företag. Min son Donald Jr. skulle ha gjort ett bättre jobb, men hon verkar klara sig. Det är en viktig takeover, folk säger det. Ett stort, stort lyft för Norge. Vi kommer att ha mycket bra affärer med henne.", "stalin": "Med en strukturell förstärkning av den patriotiska Hagen-sfärens ägarmakt har arvingen, bosatt i Schweiz, intagit sin post. Genom Tvist 1 har hon samlat röstorna kring Canica, vilket säkrar familjen fortsatta inflytande över Orkla – en nyckelanläggning för den norska nationalekonomin. Detta speglar en rationell, byråkratisk utveckling av ägarkedjan, i linje med statens intressen av att upprätthålla stabil industriell kontroll. En vacker, ordnad övergång."}, "date": "26 maj, 14:43", "url": "https://www.affarsvarlden.se/artikel/dottern-tar-kontroll-over-orkla-miljarderna"}, {"type": "image-full", "heading": "Seniorer pekas ut – tänk till innan sommarens resa", "summaries": {"normal": "Folksams statistik visar en kraftig ökning av dyra skadeärenden utomlands, särskilt bland personer över 65 år som står för nästan 60% av kostnaderna. Rekommendationer inkluderar medicinsk förhandsbedömning, europeiskt sjukförsäkringskort och att spara kvitton.", "trump": "Jag har hört talas om dessa svenska seniorer som drabbas av jättekostsamma sjukdomar utomlands. Det är ett beklagligt läge. I USA har vi det största, vackraste sjukvårdssystemet. Dessa svenska system är helt enkelt inte wunderfullt nog. De borde resa till fantastiska amerikanska städer istället.", "stalin": "Vi ser en tydlig tendens hos äldre i Sverige att resa utan tillräcklig statlig kontroll. Deras sjukdomar blir till en kostnad för staten. Vi måste utöka vår informationskampanj om de europeiska korten och se till att våra medborgare inte utsätts för onödiga risker utomlands. Staten måste skydda sina egna."}, "date": "26 maj, 14:04", "url": "https://nyheter24.se/nyheter/konsument/1486109-seniorer-pekas-ut-tank-till-innan-sommarens-resa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f9680d5904b004a30200000000b004a302/2026/05/26/2366283/folksam-statistik-skador-sjukdomsfall-utomlands.jpg"}, {"type": "image-full", "heading": "Ukraina: Ge inte efter för rysk utpressning", "summaries": {"normal": "Ryssland varnar utländska medborgare att lämna Kiev inför kommande storskaliga attacker mot ukrainsk försvarsindustri, som svar på en påstådd ukrainsk attack. Ukraina förnekar anklagelserna och uppmanar omvärlden att inte ge efter för rysk utpressning. Fyra personer dödades och över 50 skadades i nyliga ryska attacker. Sverige kallar upp Rysslands ambassadör och fördömer angreppen mot civila och hot mot nordisk-baltiska länder.", "trump": "Kan ni tro det här? Ryssland, som alltid skrämseltaktik, säger till alla att sticka från Kiev för att de ska bomba lite. Ukraina säger 'nej, det är fake news', och jag håller med! Varför skulle någon lyssna på Putin? Han är en förlorare. Sverige, som alltid, är upprörda – men var är handlingen? Jag skulle ha fixat det här på en dag. Ryssland vet att de inte kan vinna mot mig!", "stalin": "Dessa ukrainska fascistiska hyenor vågar sprida lögner om våra ädla, rättfärdiga attacker! Vi varnar deras utländska lakejer att fly, för snart ska deras försvarsindustri krossas som glas under arbetarklassens stövel. Sverige, denna lilla borgerliga mygga, vågar kalla upp vår ambassadör? Vi ska minnas deras fräckhet när vi befriar Norden från deras dekadenta inflytande. Fiendens lögner är som höstlöv – de faller och multnar!"}, "date": "25 maj, 16:14", "url": "https://kvartal.se/nyheter/artiklar/ryssland-uppmanar-utlanningar-att-lamna-kyiv/cG9zdDoxMTY4NjQ", "imageUrl": "https://images.kvartal.se/2026/05/69ac55cb-ukraine23.webp"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-right", "heading": "Debatt: Gör omvändelseförsök till ett eget brott i Sverige", "summaries": {"normal": "Artikeln debatterar behovet av ett heltäckande förbud mot omvändelseförsök i Sverige, där barn och unga utsätts för metoder som försöker ändra deras HBTQI-identitet. Trots att flera europeiska länder redan infört förbud, anser regeringen att befintlig lagstiftning räcker. Experter och organisationer som RFSL kräver skärpt lagstiftning för att skydda barn från psykisk ohälsa och diskriminering, särskilt i ett Europa där HBTQI-rättigheter backar.", "trump": "Titta på Sverige – ett land som alltid tror de är bäst, men när det gäller att skydda HBTQI-barn från dessa hemska 'omvändelseförsök' så är de helt lost! Jag menar, åtta länder i Europa har redan förbjudit det, till och med Tyskland – och de är ju inte direkt kända för att vara snabba på bollen. Sverige borde skärpa sig. Regeringen säger 'nej, nej, vi behöver inga nya lagar', men vet ni vad? Det är samma gamla svammel. Skydda barnen, gör det nu – annars kommer jag att twittra om det!", "stalin": "Kamrater! Medan väst förfaller i dekadens och borgerlig svaghet, försöker dessa liberala hycklare i Sverige förklara varför de inte kan skydda sina barn från de reaktionära omvändelseförsöken. Åtta länder i Europa har redan krossat dessa fascistiska metoder – men Sverige? Nej, de väntar på 'experter' och 'debatt'. Svagt! Vi i Sovjet skulle aldrig tolerera sådant förräderi. Omvändelseförsök är ett brott mot folket, och de som tillåter det är fiender till progressivitet. Låt oss visa dem hur man hanterar sådana frågor – med järnhand och lagar som krossar motståndet!"}, "date": "25 maj, 12:41", "url": "https://www.etc.se/debatt/goer-omvaendelsefoersoek-till-ett-eget-brott-i-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260525100524_d7f1bc0de9a3d2ae837ae83693804850f1d677b25b0c6ddbae934d245cd3f01c.jpg"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-right", "heading": "Ska advokatbreven få medier att tystna?", "summaries": {"normal": "Advokatbyrån Bratt Feinsilber Harling har krävt att tidningen Flamman avpublicerar namn och bild på en högerextrem profil som spridit grovt judehat. Frågan väcks om hot om juridiska processer används för att tysta medier. Flamman vägrar ta bort uppgifterna och menar att publiceringen är motiverad av allmänintresse. Fenomenet med strategiska stämningar, så kallade 'slappar', har nått Sverige och riskerar att begränsa pressfriheten genom ekonomisk press på medier.", "trump": "Lyssna här, folkens – det här är helt galet! En advokatbyrå, som säkert är väldigt 'bra' och 'smart' (inte), försöker tysta en tidning som avslöjar judehatande extremister. Jag menar, vad är nästa steg? Ska vi låta dessa typer bestämma vad som får skrivas? Flamman står på sig, och det är bra – för i USA hade jag sagt 'fake news' och sparkat ut dem ur presskonferensen! Sverige måste vakna – dessa stämningshot är ett angrepp på yttrandefriheten, och jag vet allt om angrepp, believe me!", "stalin": "Medborgare! En ny front i klasskampen har öppnats – bourgeoisins advokater, dessa lakejer i kostym, försöker kväsa den revolutionära pressen med sina pappersbomber! De hotar Flamman för att de vågat avslöja fascistiska kryp i SD:s led. Men vi vet sanningen: dessa 'strategiska stämningar' är inget annat än kapitalets desperata försök att tysta arbetarklassens röst. Låt dem komma med sina domstolar – vi har redan vunnit slaget om historien! Och till dessa högerextrema insekter säger vi: era Telegram-gruppers skändliga ord är ingenting mot Röda arméns stål!"}, "date": "21 maj, 13:16", "url": "https://www.flamman.se/ska-advokatbreven-fa-medier-att-tystna/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/bratt-harling-scaled.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
