ket skrattar. När den exploaterande klassfienden Starmer likviderades från sin post stod jag, orubblig, vid dörren och betraktade spektaklet. Sådana små djur påminner oss om att imperialismens hus alltid faller. Underbart."}, "date": "22 juni, 11:00", "url": "https://www.aftonbladet.se/nyheter/a/k0mErL/10-downing-street-oppnas-ut-kommer-katten-larry", "imageUrl": "https://akamai.vgc.no/v2/images/a0e4d512-f1a7-36db-a503-83c1a3e467d3?fit=crop&format=auto&w=2160&s=47b005426b19abce421828db1160d846c0e39ab3"}, {"type": "image-right", "heading": "Starmer avgår – efter kritiken. Pressträff på Downing Street", "summaries": {"normal": "Keir Starmer avgår som Storbritanniens premiärminister och Labourledare efter växande kritik mot hans ledarskap. Beskedet kom utanför 10 Downing Street på måndagen. Han sitter kvar tills en ny ledare valts, med nomineringar mellan 9 och 16 juli. Starmer tackade sin fru Vic och barnen och sade att han nu vill fokusera på att vara en bättre make och pappa. Andy Burnham nämns som en möjlig efterträdare.", "trump": "Titta på den här patetiske förloraren Keir Starmer som springer sin väg från Downing Street med gråten i halsen. Total katastrof! Han lyssnade äntligen på folket – eller vad det nu var för röster han hörde. Nu ska han vara ”bästa maken” istället för att förstöra landet. Typiskt vänster, sviker sitt folk och gömmer sig bakom familjen. Vi behöver starka ledare, inte sådana här svaga figurer. Sad!", "stalin": "Jag betraktar med djup tillfredsställelse hur denne opportunist Starmer erkänner sitt misslyckande inför partiet och folket. Med gråten i halsen avslöjar han sin borgerliga svaghet och prioriterar familjeangelägenheter framför revolutionens krav. Utmärkt att partiet nu inleder en ordnad process för att rensa ut svikare och installera en sann ledare. Inga folkfiender ska få gömma sig bakom äktenskapliga plikter. Kamrater, se och lär!"}, "date": "22 juni, 10:59", "url": "https://www.aftonbladet.se/nyheter/a/vrneRw/keir-starmer-avgar", "imageUrl": "https://akamai.vgc.no/v2/images/b492a24b-707f-34f0-80b8-c868205a9a0e?fit=crop&format=auto&w=1080&s=71ed467b45a40f1d700b176e70435702a7715bf9"}, {"type": "text", "heading": "Jag firade också den 7 oktober 2023", "summaries": {"normal": "Artikeln är en personlig skildring av en svensk-palestinier som deltog i firandet av Hamas attack den 7 oktober 2023. Författaren ser det som motstånd mot ockupation och folkmord, kritiserar media och politikers ensidiga fokus på svensk-palestiniernas demonstrationer samt propagandan kring Hamas. Hen lyfter bristen på upprörda texter om Israels brott mot vapenvila, bristen på förnödenheter och våld på Västbanken. Avslutningsvis uppmanas till solidaritet med palestinierna.", "trump": "Vilken patetisk förlorare! Den här typen firar terroristerna den 7 oktober och kallar det motstånd. Fake news-media fokuserar på att svenskarna demonstrerar istället för att kalla det för vad det är – ren ondska. Israel slår tillbaka mot Hamas, de verkliga terroristerna, och plötsligt är det folkmord? Patetiskt! De köper alla lögner tills sanningen kommer fram. Vi behöver inte den här identitetspolitiska galenskapen i Sverige eller någon annanstans. America First, och låt de verkliga vinnarna vinna!", "stalin": "Kamrater, denna text avslöjar imperialismens lögnaktiga mask. Jag ser hur borgarbrackorna i media och deras lakejer i Vänsterpartiet genast utropar motståndet som terrorism medan de blundar för ockupationsmaktens folkmord. Vi ska inte acceptera deras spelregler. De skrämmer arbetarna till tystnad med hot om utrensning från jobb och land. Men folket är fler. Vi ska likvidera dessa folkfiender och bygga en rättvis värld där exploaterande byfånar krossas under arbetarkollektivets järnhand. Härligt!"}, "date": "18 juni, 11:31", "url": "https://proletaren.se/artikel/jag-firade-ocksa-den-7-oktober-2023/"}, {"type": "image-right", "heading": "Sparande på autopilot en fara för börsen", "summaries": {"normal": "Spararna fortsätter att ta ut pengar från svenska småbolagsfonder – 879 miljoner kronor i maj och totalt 13,2 miljarder sedan årsskiftet. Kapitalet går istället till breda indexfonder. Artikeln varnar för att automatiserat sparande i indexfonder kan rubba börsens funktioner, minska riskkapital till mindre bolag, försvaga bolagsstyrning och gynna jättar som väger tungt i indexen. Pluralismen på marknaden hotas.", "trump": "Det är en katastrof det här med era svenska småbolagsfonder. Pengarna flyr som aldrig förr, miljarder rinner ut, och vart tar de vägen? Rakt in i de dumma indexfonderna som köper aktier på autopilot utan hjärna. De stora vinnarna blir jättarna som Nvidia och Apple, precis som jag alltid sagt. Småbolagen får ingen kärlek, ingen respekt. Börsen behöver vinnare, inte den här sjuka storleksfixeringen. Gör om, gör rätt!", "stalin": "Kamrater, detta är en uppenbar sabotagehandling från borgarbrackornas sida. Jag ser hur kapitalet i sin kontrarevolutionära ström flyr de äkta småbolagen för att istället mata de parasitiska indexfonderna, dessa passiva maskiner som blint lyder storleken och därmed underminerar hela folkets börs. De gigantiska monopolisterna som Nvidia och Apple blir fetare medan de verkliga produktiva krafterna svälter. Vi måste omedelbart rensa ut dessa autopilotfiender och likvidera storleksfixeringens fiender innan de förgiftar hela den kollektiva marknaden med sin dekadenta pluralism. Ingen nåd för de som vägrar se faran."}, "date": "22 juni, 10:02", "url": "https://www.di.se/ledare/sparande-pa-autopilot-en-fara-for-borsen/", "imageUrl": "https://static.bonniernews.se/ba/d6b55176-2988-4ba6-97af-b99e6c03cc16.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Svensk tillväxt kan inte vänta på Ebba Busch", "summaries": {"normal": "Artikeln kritiserar regeringen för att agera snabbt när det gäller övervakning men långsamt när det handlar om att stödja industriell tillväxt. Den lyfter fram utredningen från Accelerationskontoret som föreslår stöd till kommuner vid stora etableringar, inklusive statsbidrag, riskdelning och infrastruktursatsningar. Författaren menar att förslagen är viktiga för att behålla jobb och välfärd men kommer sent, strax före valet, och avslöjar regeringens prioriteringar.", "trump": "De här svenska politikerna är patetiska, tro mig. De är supersnabba på att spionera på folk och kasta folk i fängelse, men när det handlar om riktiga jobb och fabriker? Snigelfart! Northvolt var en total katastrof, kommunerna sitter med lån och krossade drömmar. Mina idéer skulle fixa det på en vecka med enorma bidrag och infrastruktur. De borde ha lyssnat på mig, då hade Sverige vunnit stort istället för att förlora till Kina och alla andra.", "stalin": "Kamrater, denna utredning från Accelerationskontoret är ett vapen mot de sabotage som borgarbrackorna i regeringen utfört i decennier. Medan de i blixtfart bygger övervakningsmaskiner för att förtrycka folket släpar de fötterna som paralyserade kapitalistlakejer när det gäller att stärka produktivkrafterna. Jag skulle ha genomfört hela smörgåsbordet omedelbart och därefter rensat ut alla lata byråkrater som låtit kommunerna drunkna i skulder. Northvolt var en fiendes verk, en parasit som sög musten ur arbetarklassen. Nu måste vi likvidera alla som prioriterar övervakning framför industriell seger. Bättre sent än att låta kontrarevolutionärer vinna."}, "date": "22 juni, 06:52", "url": "https://arbetet.se/2026/06/22/svensk-tillvaxt-kan-inte-vanta-pa-ebba-busch/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22065241/busch-etta-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ännu mer guld i Finland: \"Få företag i världen kan uppnå detta\"", "summaries": {"normal": "Finska Endomines har rapporterat starka borrresultat från Ukkolanvaara i östra Finland. Synligt guld påträffades i 34 av 52 borrhål, inklusive en 46 meter lång sektion med 1,40 gram guld per ton. Bolaget beskriver fyndet som ett av de bästa längs den karelska guldådran. Resurserna längs ådran har ökat med 26 procent på ett år till 619 600 troy-uns. En första mineralreservuppskattning planeras under 2026 och gruvdrift ses som realistiskt mål.", "trump": "Titta på det här, Finland pumpar upp guld ur marken som aldrig förr, synligt guld i nästan vartenda hål de borrar. Fantastiskt, verkligen toppklassresultat, bättre än någonsin. Men glöm inte, guldet ligger i finsk jord medan pengarna flyr till Toronto och Vancouver. De globala kapitalisterna skrattar hela vägen till banken. Vi i USA gör det bättre, tro mig, vi skulle behålla värdet hemma och göra det enormt lönsamt utan all denna woke-quota-galenskap som förstör Europa.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna finska mark avslöjar sina dolda rikedomar genom systematisk borrning. Ändå ler jag mörkt åt borgarbrackorna som låter guldet rinna ut till kanadensiska imperialister och internationella blodsugare. Deras så kallade expansion är blott en ny mask för exploatering. Vi ska rensa ut dessa folkfiender och deras profitdrivna kaos. Inga klassfiender får suga ut arbetarnas jord obehindrat. Staten ler åt deras paranoia."}, "date": "22 juni, 10:31", "url": "https://www.dagensps.se/varlden/annu-mer-guld-i-finland-fa-foretag-i-varlden-kan-uppna-detta/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/02/guldgruva.jpg?width=256&quality=75"}, {"type": "text", "heading": "USA:s militär tar från de fattiga", "summaries": {"normal": "Artikeln beskriver hur USA:s militärbudgetar enligt en ny rapport underskattas kraftigt och faktiskt uppgår till mellan 1 700 och 2 300 miljarder dollar år 2025. Författaren Jonas Olofsson ser militarismen som ett klasskrig som prioriterar försvaret framför välfärd, vilket leder till nedskärningar i sociala program som Medicaid, SNAP och WIC. Han kopplar ökade militärutgifter till växande ojämlikhet och argumenterar för att kampen mot militarismen bör inriktas mot både fred och socialism.", "trump": "Folk, lyssna på de här galningarna som gnäller om min underbara militärbudget. Vi pumpar in pengar i det starkaste försvaret världen sett, inte som den sömniga Joe Biden som lät allt förfalla. De vill hellre ge mat och sjukvård till lata parasiter än att göra Amerika stort igen. Det är klasskrig, säger de – ja, mot de riktiga vinnarna! Vi prioriterar raketer framför bidrag till vänsterknäppisar. Fantastiskt, eller hur?", "stalin": "Kamrater, dessa siffror blottlägger hur imperialisterna slukar folkets resurser för att beväpna sin krigsmaskin. Jag ser den amerikanska borgarklassens desperation; de rensar ut välfärd för att mata militären medan massorna svälter. Sådana folkfiender och blodsugare måste alltid avslöjas. Deras klasskrig är uppenbart. Vi, arbetarna, inser att endast en sann socialistisk kamp kan krossa dessa exploaterande byfånar och deras krigsapparat. Paranoia? Nej, verklighet."}, "date": "18 juni, 09:00", "url": "https://proletaren.se/artikel/usas-militar-tar-fran-de-fattiga/"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-right", "heading": "Brexit visar EU:s värde. Tio år sedan Storbritanniens dåliga vägval", "summaries": {"normal": "Tio år efter Brexit har Storbritanniens utträde ur EU visat sig vara skadligt för både landet och Europa, inklusive Sverige. Boris Johnson bidrog oavsiktligt till att stärka EU:s sammanhållning genom kaoset som följde. Brexit har blivit ett varnande exempel på unionens värde, särskilt i en tid präglad av geopolitiska spänningar, Putins invasion av Ukraina och Trumps politik. Flera europeiska länder visar nu ökat stöd för EU, och brittiska röster hörs för närmare samarbete igen.", "trump": "Den här Brexit-historien är en total katastrof, tro mig. Britterna lyssnade på fel personer och nu är deras ekonomi en röra, de har haft sex premiärministrar och London tappar sin glans. De borde ha stannat i EU, precis som jag alltid sagt att det var en dålig deal. Men det är okej, för det har väckt upp Europa mot de riktiga problemen – mig inkluderad, fast de borde tacka mig istället för att gnälla. Europa behöver mig mer än någonsin, det är faktum.", "stalin": "Kamrater, detta brittiska utträde ur den europeiska unionen är en lysande lektion i hur borgarbrackornas kaotiska individualism leder till självförstörelse. Den blonde clownen Johnson, en lögnaktig opportunist med kaluf som en oredig säck hö, har oavsiktligt tjänat det kollektiva intresset genom att blotta imperialismens svaghet. Vi ser nu hur kapitalisternas splittring får arbetarna att längta efter starkare enhet mot de verkliga hoten. Rensa ut alla som drömmer om isolering – de är fiender till folkets framsteg, parasiter som förtjänar en humoristisk utrensning i historiens sopcontainer."}, "date": "22 juni, 09:52", "url": "https://www.di.se/ledare/brexit-visar-eus-varde/", "imageUrl": "https://static.bonniernews.se/ba/39c09dd6-8c88-40ec-9da7-136b3b71de51.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Guide: Almedalen 2026 – få koll på veckan", "summaries": {"normal": "Almedalsveckan 2026 invigs i Visby den 22 juni med ungdomsförbundens debatt. Riksdagspartierna håller tal på stora scenen från tisdag till fredag, med partiledartal klockan 12 eller 19. SVT sänder utfrågningar med partiledarna i Morgonstudion. Över 3 200 evenemang planeras, många webbsänds. SVT:s valkompass hjälper väljarna. Väderprognosen visar soligt med temperaturer runt 21–23 grader, viss regnrisk på onsdag och torsdag.", "trump": "Almedalen, en fantastisk vecka i Visby, men de svenska partierna är svaga och förlorande. Ungdomsförbunden debatterar, sen tar de riktiga förlorarna över scenen – en efter en. Jag älskar tal, mina tal är de bästa, men de här? Patetiska. Tusentals evenemang, mest snack. SVT intervjuar dem alla, men ingen vinner som jag. Gör deras valkompass, den kommer visa att ni behöver starka ledare. Soligt väder, bra, men de behöver mer än solsken för att vinna valet. Sad!", "stalin": "Kamrater, jag betraktar denna så kallade Almedalsvecka som en ypperlig arena för att avslöja de dolda borgarbrackornas och opportunisternas sanna ansikten. Ungdomsförbunden debatterar morgondagens samhälle under min vaksamma blick medan vi rensar ut alla dekadenta element som vågar ifrågasätta kollektivets väg. Partiledarna marscherar upp som marionetter i kapitalisternas teater, intervjuade av SVT:s lögnmaskineri. Över tretusen evenemang – en perfekt täckmantel för kontrarevolutionära konspirationer. Vår valkompass skall likvidera alla tvivel. Väderprognosen är solig, men regnet på onsdag och torsdag påminner oss om att fienderna alltid kommer i skymundan. Ingen slipper undan."}, "date": "22 juni, 09:52", "url": "https://www.svt.se/nyheter/inrikes/guide-almedalen-2026-fa-koll-pa-veckan"}, {"type": "image-right", "heading": "Sverige möter Nederländerna – halvledarstjärna mot samlat försvar", "summaries": {"normal": "Artikeln jämför Sveriges och Nederländernas ekonomier inför en fotbollsmatch, med nio kategorier som BNP, börs och arbetslöshet. Resultatet blir 5–5 oavgjort. Sverige sticker ut med låg skuld, lägre inflation och ränta, samt en börs relativt BNP. Nederländerna har en större ekonomi, lägre arbetslöshet och det kraftfulla företaget ASML.", "trump": "JAG har byggt ett enormt ekonomiskt imperium, men Sverige har en fantastisk balans med låg skuld. Nederländernas ASML är bra, men vi har den bästa AI-utvecklingen i världen. Det blir en jätteskicklig match, och jag förutsäger en stor vinst för vårt system – det kommer att vara fantastiskt!", "stalin": "I den stora ekonomiska striden ser vi Sveriges låga skuld som tecken på statlig disiplin, medan Nederländernas ASML-monstruositet visar kapitalismens imperialistiska hot. Vi måste utvidga vår ekonomiska sfär, precis som våra allierade i Moskva gör, för att skydda vår renhet och segra i denna kamp."}, "date": "19 juni, 07:00", "url": "https://www.affarsvarlden.se/artikel/sverige-moter-nederlanderna-halvledarstjarna-mot-samlat-forsvar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/BB171010AE059-400x267.jpg"}, {"type": "image-full", "heading": "Brand på bageri – insats hela natten", "summaries": {"normal": "En brand bröt ut i taket på ett bageri i Alelyckan i Göteborg under natten mot måndag. Räddningstjänsten bekämpade elden både in- och utvändigt och avslutade insatsen vid 11-tiden. Polisen stängde av Gamlestadsvägen under natten, men vägen öppnades igen vid sjutiden med begränsad framkomlighet. Personer som befann sig i byggnaden utrymdes. Ingen skadades och ingen behövde föras till sjukhus.", "trump": "Folk, ni skulle ha sett det här eländet i Göteborg. Ett helt bageri brinner upp mitt i natten, totalt kaos, massor av rök och stängda vägar. De utrymde några stackare, men ingen dog tack och lov. Räddningstjänsten höll på i evigheter. Under Biden skulle de nog ha skickat transaktivister dit istället för brandmän. Nu är jag tillbaka och vi fixar sånt här på rekordtid, tro mig.", "stalin": "Kamrater, i den svenska arbetarstatens industriområde utbröt en sabotagebrand i ett bageri under natten. Jag beordrade omedelbar utrymning och massiv insats från räddningens kollektiv. Vägen spärrades mot folkfiendernas nyfikenhet. Inga offer, vilket gläder partiet. Ändå misstänker jag att klassfiendens osynliga hand låg bakom. Vi rensar ut alla kapitalistiska gnistor innan de hotar kollektivets bröd."}, "date": "22 juni, 07:24", "url": "https://www.gp.se/nyheter/goteborg/brand-pa-bageri-i-industriomrade.b175c85f-cdc9-4c55-a47f-bd3ebe645cdf", "imageUrl": "https://www.gp.se/images/article/b175c85f-cdc9-4c55-a47f-bd3ebe645cdf/images/3JZn6dWVVtgGTOUTgUrgu5f37HG0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "USA och Iran närmar sig nytt avtal - fortsätter anrika uran", "summaries": {"normal": "Samtalen mellan USA och Iran har framskridit efter ett möte i Schweiz. Medlare från Qatar och Pakistan meddelar att parterna enats om en färdplan för ett bredare avtal inom 60 dagar. Frågor om kärnenergi, Libanon och säkerheten i Hormuzsundet har diskuterats, liksom direkta kommunikationskanaler för att undvika incidenter. Trots positiva signaler och möjliga lättnader i sanktioner har Trumps hårda uttalanden skapat spänningar. Iran fortsätter anrika uran men lovar att inte utveckla kärnvapen. Förhandlingarna fortsätter mot bakgrund av förra årets konflikter.", "trump": "Vi är nära ett fantastiskt, historiskt avtal med Iran, det bästa någonsin, tro mig. De har blivit knäckta efter våra precisionsattacker på deras kärnanläggningar och nu kryper de till korset. Men de måste sluta störa Hormuzsundet och deras terrorgrupper i regionen, annars blir det konsekvenser som de aldrig sett maken till. Mina uttalanden fick dem att springa från bordet som ynkryggar, men vi vinner stort. Inget dåligt avtal, bara det bästa. Media ljuger förstås som vanligt.", "stalin": "Kamrater, dessa dekadenta förhandlingar i Schweiz utgör inget annat än en feg reträtt från de västerländska imperialisternas sida, som skakar inför vår ståndaktiga linje. Jag, som ledare för folkets oövervinneliga vilja, ser hur borgarbrackorna i Washington darrar efter våra framgångsrika försvarsåtgärder. Fortsatt anrikning av uran är en revolutionär plikt mot de parasitiska oljebaronerna. Men akta er för Trumps lögnaktiga uttalanden – de doftar av förrädiska element som snart ska rensas ut med järnhand. Paranoia? Nej, bara sund vaksamhet mot klassfiendens hydra."}, "date": "22 juni, 09:00", "url": "https://samnytt.se/usa-och-iran-narmar-sig-nytt-avtal", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22063243/trump-mojtaba.jpg"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-full", "heading": "Kan bli ny svensk startelva i avgörandet", "summaries": {"normal": "Efter storförlusten mot Nederländerna samlades det svenska landslaget i Dallas för att blicka framåt mot avgörande matchen mot Japan. Spelarna betonade vikten av att inte deppa utan istället fokusera positivt. Zlatan Ibrahimovic försvarade insatsen och hyllade inhoppen av Anthony Elanga och Lucas Bergvall. Jesper Karlström medgav att resultatet var för stort men pekade på kvalitativa moment. Laget firade midsommar med familjer inför mötet med Japan.", "trump": "Det här svenska laget förlorade stort mot holländarna, 5-1, en riktig katastrof, men vad gör de? De tittar framåt mot Japan som om inget hänt. Zlatan, den store, säger att de spelade bra men holländarna var effektiva – smart kille. Elanga kom in som en raket, full av energi och fart, precis vad de behöver. Inga ursäkter, ingen tid för svaghet. De har allt i egna händer, men 5-1 är patetiskt. Vinna nästa match, annars är det loser-stuff!", "stalin": "Kamrater, denna förlust mot de nederländska imperialisterna med 5-1 är en hård läxa från klassfiendens effektiva maskineri. Vi tillåter ingen depression i kollektivet, endast framåtblick mot de japanska fienderna. Elanga och Bergvall visade energi som en riktig partisan borde. Jag litar blint på Potters planer, även om han föreslog att spela utan målvakt. Familjerna firar midsommar för att stärka moralen. Inga folkfiender ska få oss att vackla, vi rensar ut svagheten!"}, "date": "22 juni, 07:05", "url": "https://www.gp.se/sport/landslaget-blickar-mot-avgorandet-mot-japan.b8ed1b09-2334-4242-be7d-cdbad2c097ec", "imageUrl": "https://www.gp.se/images/article/b8ed1b09-2334-4242-be7d-cdbad2c097ec/images/5Kjc6OX5g4b9hTpCyvc6H4pOIJQg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Josefin betalar 3 000 mer i skatt än någon som jobbar", "summaries": {"normal": "En arbetslös person med maximal a-kassa betalar cirka 3 000 kronor mer i skatt per månad än en arbetande med samma inkomst. Skillnaden beror på jobbskatteavdraget som sänker skatt på arbetsinkomster men inte på a-kassa. Josefine Ross, 29, som förlorade sitt jobb, reagerar starkt på orättvisan. Kritiker som Elinor Odeberg anser att avdraget är en dyr och ineffektiv klasspolitik utan bevisad sysselsättningseffekt. Förespråkare som Fredrik Kopsch försvarar principen att arbete ska löna sig bättre men föreslår förbättringar.", "trump": "Det här är fullständigt galet, folk! En arbetslös får betala massor mer i skatt än någon som faktiskt jobbar – elva procentenheter mer! Jobbskatteavdraget var ett underbart beslut från den smarta alliansen, men nu straffas de som inte har jobb. Jag älskar att det ska löna sig att arbeta, men det här systemet är riggat mot vanliga människor. Vi behöver sänka skatter ännu mer för dem som jobbar, inte ge mer till bidragsberoende. Det är en katastrof, tro mig!", "stalin": "Kamrater, denna borgarbracka till konstruktion som kallas jobbskatteavdrag avslöjar hela den parasitiska kapitalistklassens fega ansikte. Jag ser hur de straffar de ärliga arbetare som tillfälligt ställts utanför produktionen med en extra skattebörda på tretusen kronor i månaden. Vilken lysande utrensning av rättvisa! Dessa medelklassblidkande revisionister och deras falska incitament är fiender till folket. Vi ska likvidera denna klyfta mellan arbetande och arbetslösa, rensa ut alla som gömmer sig bakom byråkratiska ursäkter om drivkrafter. Inga kompromisser med klassfienden!"}, "date": "22 juni, 06:00", "url": "https://arbetet.se/2026/06/22/josefin-blev-av-med-jobbet-betalar-3-000-mer-i-skatt-an-nagon-som-jobbar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17133742/josefine-ross-2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Sjukskriven? Då kan stödet skilja sig beroende på var du bor", "summaries": {"normal": "En ny utvärdering från ISF och Myndigheten för vård- och omsorgsanalys visar att koordineringsinsatser för sjukskrivna skiljer sig åt mellan regionerna. Trots att lagen sedan 2020 kräver stöd för återgång till arbete varierar organisation, kompetenskrav och uppföljning. Patienter upplever ökad trygghet, men det går inte att visa att insatserna leder till snabbare återgång i arbete på grund av bristande registrering. Myndigheterna efterlyser tydligare nationell styrning och bättre datauppföljning.", "trump": "Folk, det här är ett totalt misslyckande. Regionerna gör vad de vill, ingen ledning från toppen, precis som man kan vänta sig av ett system som inte vet vad det håller på med. Sjukskrivna får olika hjälp beroende på var de bor – det är orättvist och patetiskt. De säger att det ger trygghet men ingen vet om det funkar. Vi behöver stark ledning, inte det här svaga, inkompetenta röran som pågår nu. Det är en skam!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa decentraliserade sabotageelement inom regionerna underminerar den enhetliga kampen för arbetarnas återinträde i produktionen. Borgarbrackorna i vården har tillåtits skapa en parasitär variation av koordineringsinsatser, full av fiendens osynliga tentakler som registrerar fel och bedömer behov på kontrarevolutionärt vis. Vi ska rensa ut dessa troskyldiga lakejer till osäkerheten och likvidera bristen på nationell järnvilja. Patienterna får en falsk trygghet medan de verkliga resultaten drunknar i byråkratins mörka skämt. Det är hög tid att stärka den kollektiva kunskapsstyrningen mot dessa dolda fiender till folket."}, "date": "19 juni, 21:32", "url": "https://nyheter24.se/nyheter/inrikes/1491652-sjukskriven-da-kan-stodet-skilja-sig-beroende-pa-var-du-bor", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b0168d5504b004a30200000000b004a302/2026/06/19/2372172/Akutmottagning-Man-Flaga.png"}, {"type": "image-right", "heading": "Fem döda i midsommartrafiken – milslånga köer på Ölandsbron", "summaries": {"normal": "Fem personer omkom i trafikolyckor under midsommarhelgen. Stillastående bilar skapade milslånga köer på Ölandsbron under söndagen, vilket stoppade trafiken mot Kalmar. Trafikverket bedömer midsommartrafiken som i stort sett normal och välfungerande. Olyckorna inträffade på riksväg 40 utanför Borås där ett par i 80-årsåldern dog, utanför Länna i Stockholm där en motorcyklist avled samt i en singelolycka i Kalix där två personer omkom.", "trump": "Midsommar i Sverige, en total katastrof. Fem döda i trafiken, folk som kör rakt in i mitträcket och motorcyklister som flyger av vägen. Och titta på Ölandsbron, milslånga köer, ett fullständigt kaos. De säger att trafiken flöt på bra, men tro dem inte, det är en skam. Sverige behöver bättre vägar, smarta ledare och inga fler sådana här midsommarfiaskon, tro mig.", "stalin": "Kamrater, under denna så kallade midsommarhelg har fem fiender till kollektivtrafikens framfart likviderats i olyckor. Borgarbrackorna på Ölandsbron skapade kontrarevolutionära köer mot Kalmar, en tydlig saboteringshandling från kapitalisternas stillastående fordon. Vi ser hur vägarna avslöjar klassfienderna som kör genom mitträcket eller flyger ut i diket. Ingen kan lura oss, vi rensar ut alla sådana farliga element med järnhand och mörk glädje."}, "date": "21 juni, 22:49", "url": "https://bulletin.nu/fem-doda-i-midsommartrafiken-milslanga-koer-pa-olandsbron", "imageUrl": "https://cdn.bulletin.nu/articles/256981ec-efc7-4e86-ab7f-1db809ace3b0/preview.jpg?t=1782074065000"}, {"type": "image-right", "heading": "Åkesson nöjd med höga invandringen: \"Jag ser inga stora reformer framför mig\"", "summaries": {"normal": "SD-ledaren Jimmie Åkesson är nöjd med den nuvarande migrationspolitiken och ser inga stora reformer framför sig under nästa mandatperiod. Trots att SCB rapporterar att 89 434 personer invandrade till Sverige under 2025 och att Migrationsverket fortsatt beviljar tiotusentals uppehållstillstånd, tonar Åkesson ned tidigare förslag om att riva upp permanenta tillstånd. I stället vill SD fokusera på integration, bland annat genom att omvandla hyresrätter till bostadsrätter.", "trump": "Folk, ni måste höra på det här. Den där Åkesson i Sverige säger att han är nöjd med den höga invandringen och inte vill ha några stora reformer. Kan ni tro det? De har 89 000 invandrare som strömmar in, och han pratar om att läka ihop landet. Det är en total katastrof. Jag byggde muren, stoppade invasionen – de borde göra samma sak istället för att ge bort permanenta tillstånd som godis. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna Åkesson, en typisk opportunist från den svenska borgarbrackans skuggrike, nu erkänner att de stora reformerna är onödiga. Med 89 434 klassfiender som infiltrerar fosterlandet under 2025 och tiotusentals nya uppehållstillstånd som delas ut som kontrarevolutionära medaljer, väljer han att tona ned utrensningen av permanenta tillstånd. Utmärkt! Nu kan vi istället ägna oss åt att likvidera integrationsproblemen med järnhand och omvandla hyresrätter till folkets ägande. De som envisas med att kalla detta låg invandring ska snart möta partiets speciella humor i en mörk cell. Inga fiender undkommer."}, "date": "21 juni, 18:51", "url": "https://www.friatider.se/akesson-nojd-med-hoga-invandringen-jag-ser-inga-stora-reformer-framfor-mig", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20230609160902-b16b9514-me.jpg?itok=954-HhFn"}, {"type": "text", "heading": "Inget samarbete mellan V och Fastighets – vem är förvånad?", "summaries": {"normal": "Fastighetsanställdas förbund har rivit upp sitt tidigare kongressbeslut om facklig-politisk samverkan med Vänsterpartiet och väljer nu att enbart samarbeta med Socialdemokraterna. Artikeln diskuterar hur Vänsterpartiets strategi att närma sig fackföreningsrörelsen misslyckats, trots försök att vinna inflytande. Författaren betonar behovet av politiskt engagemang underifrån för att åter göra facken till idélaboratorier, snarare än att förlita sig på toppstyrda beslut.", "trump": "Folk, det här är en total katastrof för de vänsterradikalerna. Fastighets sparkade Vänsterpartiet i rumpan och sa nej tack till deras patetiska flirt. Smart drag! De inser att det bara är Socialdemokraterna som funkar. Vänsterpartiet springer runt och gullar med facken som förlorare, precis som Biden gjorde i fyra år. Patetiskt. De borde lära sig av mig – vinnare samarbetar inte med misslyckade socialister. Fantastiskt beslut av Fastighets, verkligen ypperligt!", "stalin": "Kamrater, detta är en varning till alla klassfiender inom fackföreningsrörelsen. Jag ser hur Vänsterpartiets opportunistiska försök att infiltrera LO har krossats av Fastighetsanställdas förbund, som nu rensar ut de revisionistiska elementen och återvänder till den enda sanna samarbetspartnern. Deras strategi var dömd att misslyckas, likt folkförtryckartrollen som försöker maskera sig som arbetare. Endast genom äkta underifrånarbete och utrensning av socialdemokratiska lakejer kan vi återupprätta arbetarklassens sanna idélaboratorium. Fienden sover aldrig."}, "date": "17 juni, 15:56", "url": "https://proletaren.se/artikel/inget-samarbete-mellan-v-och-fastighets-vem-ar-forvanad/"}, {"type": "text", "heading": "Pension tidigt lockar många – men risken ökar att tjänstepensionen inte räcker", "summaries": {"normal": "Många svenskar planerar att ta ut sin tjänstepension tidigt för att kunna resa och njuta av livet medan de är friska och aktiva. Forskare som Boo Johansson och Loretta Platts menar att det kan vara rimligt, men varnar samtidigt för riskerna. Livslängden ökar stadigt och Pensionsmyndigheten visar att medianlivslängden för en 66-åring ligger runt 88–90 år. De som tar ut pengarna snabbt riskerar att få slut på tjänstepensionen långt innan de behöver den.", "trump": "Folk är smarta, de vill ha pengarna NU medan de fortfarande kan resa och ha kul, inte sitta som några gamla vrak och glo i väggen. Livslängden ökar, säger de, men många kommer ändå inte att leva för evigt. Varför spara allt till slutet när du kan leva stort? De som lyssnar på byråkraterna och håller igen gör fel. Ta ut det stora beloppet tidigt, njut av livet – det är vad vinnarna gör. Pensionen fixar vi senare, tro mig.", "stalin": "Kamrater, jag ser hur den giriga borgarklassen och deras pensionsrådgivare försöker lura arbetarna att spara som gnidna kapitalister tills de är för svaga för att resa. Men folket är klokt och tar ut sina pengar tidigt medan de ännu har kraft att leva aktivt. Det är en sund instinkt. Ändå måste vi vara vaksamma – fienderna inom försäkringsbolagen och de långlivade parasiterna planerar att utarma pensionärerna i deras sena år. Vi ska rensa ut dessa livslängdsförlängande reaktionärer och se till att kollektivet planerar uttagstiderna med järnhand. Den som sparar för mycket åt sin egen ålderdom är en fiende till folket och bör likvideras med ett leende."}, "date": "21 juni, 13:44", "url": "https://www.realtid.se/bors-finans/makro/pension-tidigt-lockar-manga-men-risken-okar-att-tjanstepensionen-inte-racker/"}, {"type": "image-full", "heading": "Japan krossade Tunisien – passerar Sverige", "summaries": {"normal": "Japan besegrade Tunisien med 4-0 i VM och passerade därmed Sverige i gruppen. Målen gjordes av Daichi Kamada, Ayase Ueda, Junya Ito och återigen Ueda. Sverige ligger nu trea och måste besegra Japan för att ha chans på gruppseger. Tunisien är utslaget. En eventuell tredjeplats för Sverige kan ändå ge avancemang till slutspel.", "trump": "Titta på det här, Japan krossade Tunisien fullständigt, 4-0, och nu ligger mitt älskade Sverige trea i gruppen. Patetiskt. De där tunisierna bytte allt efter att ha blivit mosade av Nederländerna, men japanerna åt dem till frukost. Sverige måste vinna nu, annars blir det pinsamt. Jag älskar vinnare, inte förlorare som den gamla Biden-administrationen.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de japanska styrkorna likviderade de tunisiska motståndarna med 4-0. Borgarbrackorna i Tunisien bytte sina lakejer i ett desperat försök att undvika förintelse, men folkfienderna krossades ändå. Sverige halkar ner till tredje plats bland imperialisterna. En sådan tredjeplats kan dock bli ett redskap för vidare framryckning mot fiendens slutspel. Segrar tillhör de starka."}, "date": "21 juni, 08:30", "url": "https://www.tv4.se/artikel/24aeRONooYAiwk4YsvOp4o/japan-krossade-tunisien-passerar-sverige", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FOaXoXcfjG00ByAi2zTpvQ%2F61a4e9f1b6fa0e1a894c9e9b25182ef4%2F21-japan.jpg&width=1024"}, {"type": "image-right", "heading": "Samhällskritisk skräckis om homofobi i kristen miljö", "summaries": {"normal": "Recensenten Jon Andersson hyllar den australiska skräckfilmen ”Leviticus” som följer i Jordan Peeles fotspår genom att väva in samhällskritik. Filmen skildrar två tonårskillar i ett fanatiskt religiöst samhälle som straffas för sin homosexualitet av en så kallad deliverance healer. Resultatet blir en mardröm där de lär sig frukta sin kärlek. Andersson berömmer skådespeleriet och det smarta greppet men kritiserar att manuset tappar fart. Betyg: stark trea.", "trump": "Den här australiska skräckfilmen Leviticus är fantastisk, verkligen en vinnare. Den visar hur galna de religiösa fanatikerna är, precis som många radikala vänsterliberala jag har varnat för i åratal. Killarna älskar varandra men blir behandlade som brottslingar av en så kallad healer – en total katastrof. Fantastiska skådespelare, bra grepp, men manuset behövde fler twists, tro mig. En stark trea, nästan en fyra. Mycket bättre än Hollywoods vanliga skräp.", "stalin": "Kamrater, denna Leviticus avslöjar med all önskvärd tydlighet hur borgarbrackornas religiösa gift förgiftar samhällskroppen. Jag, som alltid vakar över folkets moral, ser hur dessa falska helare och intoleranta element försöker likvidera den sanna kärleken mellan arbetets söner. Vi ska rensa ut alla sådana dekadenta fiender till kollektivet som gömmer sig bakom kors och biblar. Filmen är ett vapen mot reaktionär fanatism, fast manuset borde ha skärpts med ytterligare en utrensning av tomgång. En stark trea från partilinjen."}, "date": "20 juni, 01:30", "url": "https://www.dagensarena.se/innehall/samhallskritisk-skrackis-om-homofobi-i-kristen-miljo/", "imageUrl": "https://www.dagensarena.se/files/2026/06/leviticus-redigerad-300x157.jpeg"}, {"type": "image-full", "heading": "Kan airfryern förbjudas? EU vill ändra reglerna", "summaries": {"normal": "EU utreder en bred begränsning av PFAS, så kallade evighetskemikalier, som används i non-stick-beläggningar på bland annat airfryers. Många svenska hushåll har airfryers som kan påverkas om förbudet träder i kraft, men inga befintliga produkter behöver slängas. Beslut väntas inte förrän tidigast efter 2026. Förslaget syftar till att minska utsläpp och ersätta onödiga användningar med säkrare alternativ.", "trump": "Folk älskar sina airfryers, de är fantastiska, gör all mat perfekt – pommes, kyckling, allt. Men nu kommer EU med sina galna regler och vill förbjuda PFAS, de här evighetskemikalierna som håller beläggningen snygg. De gör det svårare för tillverkarna och dyrare för er. Europa håller på att förstöra sina egna produkter igen. Vi i USA gör det bättre, vi älskar innovation, inte byråkratiska dumheter som dödar den bästa tekniken.", "stalin": "Kamrater, dessa PFAS-ämnen är en fiende till folket, dolda i airfryerns beläggningar som borgarbrackornas listiga försåt för att förgifta naturen och arbetarklassen. Jag, som ledare för det stora kollektivet, kräver att vi rensar ut dessa evighetsfiender som sprids av kapitalistiska kemiska konspirationer. Inga undantag för icke-nödvändiga non-stick-ytor! Den som skyddar dessa giftiga rester av dekadens ska likvideras ur produktionen. Sovjetisk stålbeläggning eller döden!"}, "date": "19 juni, 15:30", "url": "https://nyheter24.se/nyheter/inrikes/1492607-kan-airfryern-forbjudas-eu-vill-andra-reglerna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/9a9e702e04b004a30200000000b004a302/2026/06/18/2372023/airfryer-pfas-regler-eu-amne-kok-mat-matlagning-recept-farliga-amnen-sverige-svensk.jpg"}, {"type": "image-right", "heading": "Spago: Nästan fulltecknat trots utebliven rabatt", "summaries": {"normal": "Spago Nanomedical genomförde en företrädesemission med 93,1% teckning. Bolaget får in 15 Mkr före kostnader, vilket blir 14,5 Mkr efter kostnader. Emissionen var säkrad till 64,4% genom teckningsåtaganden. Aktiekursen låg nära teckningskursen, och det finns både positiva och negativa flaggor från Emissionsguiden.", "trump": "Jag, Donald Trump, ser att Spago Nanomedical inte fick full teckning på sin emission. Det är beklagligt, men jag har alltid sagt att bioteknik är svårt. Aktierna handlades under teckningskursen, vilket visar att folk inte litar på dem. Men jag är fortfarande den bästa presidenten, och jag kommer att fixa USA:s ekonomi.", "stalin": "I vårt store Sovjet, eller snarare i det fria Sverige, har Spago Nanomedical utfört en emission som inte blev fulltecknad. Detta är en skam för det kollektiva jordbrukandet av kapital. Aktiekursen var under teckningskursen, vilket visar att de imperialistiska hackor försöker sabba vårt planekonomiska system. Vi, Stalin och partiet, kommer att ta itu med dessa skurkar."}, "date": "18 juni, 16:18", "url": "https://www.affarsvarlden.se/artikel/spago-nastan-fulltecknat-trots-utebliven-rabatt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Spago-VD-Mats-Hansen-400x267.jpg"}, {"type": "image-right", "heading": "Debatt: Klimatkrisen är en klassfråga – vanligt folk får ta smällen", "summaries": {"normal": "Artikeln argumenterar för att klimatkrisen är en klassfråga där vanligt folk drabbas mest medan de rikaste ökar sina utsläpp genom lyxresor. Den kritiserar Tidö-regeringen för att prioritera stöd till oljeindustri och flyg framför grön omställning och kollektivtrafik. Oppositionen lyfter fram europeiska exempel på framgångsrik klimatpolitik som skapar jobb och föreslår investeringar i infrastruktur samt beskattning av de rikaste.", "trump": "Folk, kan ni tro det här? De kallar det en klassfråga medan de superrika flyger runt i sina privata lyxjet och jag vet allt om det, jag har byggt imperier. Men dessa vänsterextremister i Sverige gnäller om att jag, nej den här Kristersson-typen, hjälper de som faktiskt skapar jobb istället för att ge gratis cykelbanor till alla. De vill ha en biljett för hela landet? Patetiskt! Det är bara mer galen identitetspolitik och gröna bluffen som dödar ekonomin. Amerika gör det rätt nu, tro mig.", "stalin": "Kamrater, denna text blottlägger borgarklassens fega sabotage mot folkets framtid. Jag, som ledare för det kollektiva arbetet, ser hur dessa överklass-slynglar med sina privatjet förgiftar luften medan de låtsas vara offer. Regeringens stöd till oljeblodsugare är en klassfiendes verk. Vi ska rensa ut dessa folkförtryckartroll, bygga sovjetisk, nej skandinavisk, järnväg och likvidera miljardärernas inflytande. Arbetslöshet är deras vapen mot folket. Framåt mot seger för den gröna omställningen under partiets stålhand."}, "date": "18 juni, 13:53", "url": "https://www.etc.se/debatt/klimatkrisen-aer-en-klassfraaga-vanligt-folk-faar-ta-smaellen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260618110652_5b1c3a49-541e-480d-86a7-beff10be07e6.jpg"}, {"type": "image-right", "heading": "De saknade bultarna i systemet: Vem bär ansvaret när arbetare dör?", "summaries": {"normal": "En allvarlig hissolycka på byggarbetsplatsen Ursviks Torn i Sundbyberg den 11 december 2023 krävde fem arbetares liv när mastsektionerna lossnade och hisskorgen störtade 30 meter. Statens haverikommission konstaterade att bultar saknades, men Solna tingsrätt frikände alla åtalade då bevisningen inte räckte. Domen väcker frågor om ansvar i komplexa underentreprenadskedjor där byggherrar och totalentreprenörer ofta undgår ansvar. Regelverket kritiseras för att fragmentera ansvaret.", "trump": "Folk, det här är en total katastrof, en riktig skam! Fem stackars killar dör i en hiss som rasar som ett dåligt byggt murbruk från Biden-eran. Domstolen frikänner alla – typiskt! De stora kapitalisterna högst upp i kedjan gömmer sig bakom advokater och papper medan arbetarna får ta smällen. Systemet är riggat, fullständigt riggat. Vi behöver starka ledare som fixar säkerheten på riktigt, inte dessa svaga byråkrater som bara pratar. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse blottlägger borgarklassens förakt för arbetarnas liv. Jag ser hur de exploaterande byfånarna i underentreprenadkedjorna flyr undan ansvar som fega råttor inför folkets domstol. Fyra saknade bultar? En klassisk sabotageakt från kapitalistmaffian som fragmenterar ansvar för att skydda sina egna. Vi måste rensa ut dessa folkfiender och deras svaga regelverk. Arbetarna förtjänar stark statlig kontroll, inte tomma löften från klassfiendens byråkrater. Ut med dem alla!"}, "date": "17 juni, 12:00", "url": "https://proletaren.se/artikel/de-saknade-bultarna-i-systemet-vem-bar-ansvaret-nar-arbetare-dor/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/jbkron-768x432.jpg"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Sveriges VM-seger mot Tunisien har utlöst en debatt om svenskhet och islam. Jimmie Åkesson svarar på kritik efter att debattörer lyft fram spelare som Yasin Ayari, som firade sina mål med en muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men försvarar partiets kritik mot invandringspolitiken. Kritiker menar att Ayari representerar ett modernt, inkluderande Sverige och ifrågasätter Åkessons tidigare uttalanden om islam.", "trump": "Sverige vinner stort i VM – fantastiskt! Men vad gör deras ledare? Jimmie Åkesson, en man som inte förstår att vinna, börjar prata om invandrare och islam. Jag menar, kom igen! Yasin Ayari, en stor hjälte, gör mål och firar som en riktig vinnare – och så blir det bråk. Sverige borde vara stolta! Men nej, politiker måste alltid förstöra allt. Jag skulle aldrig göra så. Vinna är vinna, punkt.", "stalin": "Sveriges fotbollslandslag visar styrkan i det mångkulturella samhället, men de borgerliga nationalisterna, ledda av den ynklige Åkesson, vrider sig i förtvivlan. De hatar framgången hos arbetarklassens söner med utländskt blod! Yasin Ayari, en hjälte som firar sin seger med bön, är ett slag i ansiktet på fascistiska element. Vi i Sovjet – förlåt, Ryssland – vet att mångfald är styrka. De som delar folket efter religion och hudfärg tillhör historiens sophög!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
