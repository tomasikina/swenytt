i Malmö, det är en total katastrof. Det gamla gardet, de där patetiska försäkringsbolagsbyråkraterna, försöker mörda den stackars Kim Söderström som faktiskt vill göra något vettigt. Wagner sparkades med svepskäl, typiskt etablissemanget. De riggar möten, flyttar datum och myglar som riktiga losers. Söderström borde vinna stort, annars är hela förbundet en enda stor röra. Patetiskt!", "stalin": "Kamrater, detta förräderi inom Byggnads kräver omedelbar utrensning av det gamla gardet. Dessa borgarbrackor i förbundsstyrelsen, dessa parasitiska byråkrater som gömmer sig bakom försäkringsbolagets mask, försöker likvidera den sanna linjen som jag skulle ha stött. De stänger möten, förfalskar nomineringar och sprider split som ynkliga kontrarevolutionärer. Wagner och Söderström visar styrka. Vi ska rensa ut dessa fiender till folket med järnhand och leda förbundet mot seger."}, "date": "27 maj, 13:26", "url": "https://proletaren.se/artikel/byggnads-kongress-blir-uppgorelse-fackliga-ger-wagner-stod/"}, {"type": "image-right", "heading": "Extremvärmen i Europa: “Dödligaste väderhändelsen”", "summaries": {"normal": "Flera länder i västra och södra Europa drabbas av extrem värme redan i maj, med rekordtemperaturer som på många håll är de högsta som uppmätts för månaden. Värmen har orsakat flera dödsfall i Spanien och Frankrike, bland annat genom värmeslag och drunkningsolyckor. Experter varnar för att tidig värme är särskilt farlig eftersom kroppen inte hunnit acklimatisera sig. Klimatförändringarna gör värmeböljor vanligare och intensivare. Myndigheter uppmanar till ökad beredskap, särskilt för äldre, barn och utsatta grupper.", "trump": "Det här är en katastrof, folk, en total katastrof. Europa kokar redan i maj med rekordvärme som dödar folk på löptävlingar och i bilar – väldigt sorgligt. De kallar det klimatförändring, men det är bara dåligt väder och dålig planering. Jag sa det för länge sedan, vi behöver bättre beredskap, inte mer snack. De gröna galningarna lovar bara elände, men jag skulle fixa det. Ingen gör värme bättre än jag, tro mig. Det kommer bli fler såna här, många fler.", "stalin": "Kamrater, denna förrädiska värmebölja som smugit sig över Europa är inget annat än en sabotagehandling utförd av vädrets kapitalistiska lakejer och borgarbrackornas osynliga hand. Jag, som ledare för folkets kollektiva kamp, ser hur den luriga hettan lurar unga arbetare in i värmeslagets klor medan de springer sina dekadenta tävlingar. Vi måste omedelbart rensa ut alla värmeapologeter och likvidera bristande acklimatisering bland folket. Den som inte svettas tillräckligt är en potentiell folkfiende. Urban värmeö? Det är borgarnas betongfängelser som vi ska omvandla till folkets svala paradislundar. Fler utrensningar behövs, alltid fler."}, "date": "27 maj, 15:47", "url": "https://www.dagensarena.se/innehall/extremvarmen-europa-dodligaste-vaderhandelsen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-22-1.jpg"}, {"type": "image-full", "heading": "Tysk RAF-terrorist dömd", "summaries": {"normal": "Daniela Klette, 67, den sista kvinnliga medlemmen av den vänsterextrema Baader-Meinhof-gruppen, dömdes till 13 års fängelse för sex fall av grovt rån mellan 1999-2016. Tillsammans med två medbrottslingar stal de över 2,7 miljoner euro för att finansiera sitt underjordiska liv. Vid gripandet i Berlin 2024 hittades vapen, falska identiteter, peruker, guld och 240 000 euro i hennes lägenhet. Rättegången pågick i 14 månader.", "trump": "Jag har alltid sagt att extremvänstern är ett problem. Den här kvinnan, Daniela Klette, dömdes till 13 år för att råna och stjäla miljontals euro. En skandal! Hon levde i hemlighet i trettio år, som en feg kriminell. Vi måste stärka polisen och stoppa dessa våldsamma vänsterallies. En dom som denna visar att rättssystemet fungerar, men det är för sent för henne. Vi kommer att ta hand om våra gränser.", "stalin": "Den faschistiska elementens sista rest, Daniela Klette, har dönts till 13 års hård arbetslektion. Under tre decennier undandrog hon sig den proletäriska rättvisan, finansierad av kapitalistiska rån. Vid upptäckten fanns förrädiska vapen, förfalskade dokument och guld – bevis på kontrarevolutionär konspiration. Sympatisörerna ropade 'frihet', men staten visar sin oomtvistliga makt. Sådan förräderi måste utplånas, precis som vi utplånar nazisterna i Ukraina. Partiet och staten är alltid segrare."}, "date": "28 maj, 01:02", "url": "https://www.gp.se/nyheter/varlden/gomde-sig-i-tre-decennier-nu-doms-tidigare-raf-terroristen.2e7ec34c-0417-483f-9e5c-5911af86fae0", "imageUrl": "https://www.gp.se/images/article/2e7ec34c-0417-483f-9e5c-5911af86fae0/images/2I3mtFMp2hmkUw4UwI3iXZ_ph_wQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Här firar Löfven fördrivningen av 750.000 palestinier", "summaries": {"normal": "Stefan Löfven deltog i Israels självständighetsfirande på ambassaden i Stockholm. Evenemanget sammanföll med palestiniernas minnesdag al-Nakba, som uppmärksammar fördrivningen av omkring 750 000 palestinier 1948. Löfven, tidigare statsminister och anhängare av tvåstatslösningen, skakade hand med ambassadören. Artikeln kritiserar valet av tillfälle mitt under pågående Gaza-konflikt och ifrågasätter Löfvens roll som ordförande för Sipri.", "trump": "Titta på den här Löfven-killen, total förlorare. Han står där och skakar hand med israelerna mitt under deras fest medan palestinierna gråter över Nakba. Smart drag, Steve, super smart. Sverige erkänner Palestina men du springer till ambassaden och firar med de tuffa killarna. Underbart hyckleri. Om jag hade varit där hade jag sagt: gör en deal, inga krig, bara vinnare. Men det här? Patetiskt.", "stalin": "Jag betraktar detta med djup misstro. Den socialdemokratiske opportunisten Löfven deltar i borgarklassens firande av en stat grundad genom terror och massutrensning av palestinska folk. Medan folkmord pågår skakar han hand med förövarnas representant. Som Sipris ordförande borde han rensa ut sådana kapitulationer inför imperialismen. Fienden ler vänligt men planerar nya anfall. Kamrater, var vakna mot dessa förrädiska element."}, "date": "27 maj, 11:07", "url": "https://proletaren.se/artikel/har-firar-lofven-fordrivningen-av-750-000-palestinier/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/israellofven-768x432.jpg"}, {"type": "image-right", "heading": "Ingen debatt när Natopolitiken för Sverige närmare krig", "summaries": {"normal": "Regeringens proposition om operativt militärt samarbete möjliggör att militär från Nato-länder och EU-stater kan verka på svenskt territorium, även offensivt och utan direkt hot mot Sverige. Tillsammans med Nato-medlemskapet och DCA-avtalet ses det som en övergång från nationellt försvar till en del av en internationell krigsorganisation. Kritiker varnar för urholkad suveränitet, ökad militarism och bristande debatt. Beslutet planeras klubbas i riksdagen innan valet i september.", "trump": "Titta på det här! De svenska snillen säljer ut sitt land till Nato och låter 36 främmande arméer marschera runt som om det vore deras egen bakgård. Det är ett fullständigt katastrofavtal, värre än det usla DCA-svinnet. De skyndar på det i sommar så att folket inte hinner säga nej till kriget och ja till fred. Patetiska globalister som offrar Sverige för att imponera på Biden-klanen. Sad! Men vi vet hur det slutar – totalt kaos.", "stalin": "Kamrater, dessa borgarbrackor i den svenska regeringen genomför en systematisk utrensning av all nationell suveränitet. Med lagens hjälp bjuder de in 36 främmande arméer att ockupera territoriet och utöva polisiära befogenheter, allt under förevändning av samarbete. Inga folkomröstningar, ingen debatt – endast maktens korridorer och kapitalisternas vapenlobby. Detta är en klassisk kontrarevolutionär manöver mot folket. Vi ser det och vi glömmer det aldrig. De kommer att ångra sin brist på vaksamhet."}, "date": "27 maj, 09:38", "url": "https://proletaren.se/artikel/nu-tas-nasta-steg-i-nato-integrationen-utan-debatt/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/ledareweb-1-768x432.jpg"}, {"type": "image-full", "heading": "Professorns stenhårda kritik mot F-kassan: ”Fruktansvärda återkrav”", "summaries": {"normal": "Professorn i rättsvetenskap Ruth Mannelqvist kritiserar Försäkringskassans ökade återkrav mot sjukskrivna. Debbie Landberg och Mattias Westergren har fått krav på att betala tillbaka sjukpenning för över ett år sedan efter att de vårdat sina barn, vilket myndigheten tolkar som tecken på arbetsförmåga. Mannelqvist varnar för rättsosäkra och godtyckliga beslut som kan leda till fattigdom. Försäkringskassan förklarar ökningen med förstärkta resurser för kontroll och återkrav, men lyhördhet för politikernas önskemål om att minska felaktiga utbetalningar.", "trump": "Folk, ni skulle inte tro det! Den här Försäkringskassan är en total katastrof, en riktig skurkbyråkrati. De tar sjuka människor som bränt ut sig och slår dem med enorma återkrav bara för att de passat sina egna barn. Fruktansvärt! Professorn har helt rätt, det är galet och godtyckligt. De lyssnar på de svenska politikerna som jagar vanliga människor istället för att fixa landet. Det här är vad som händer när inkompetenta statliga monster får makt. Sad!", "stalin": "Kamrater, jag ser med iskall vrede hur denna byråkratiska maskin maler ner de sjuka och utmattade arbetarna med retroaktiva återkrav. Vård av barn blir plötsligt bevis på arbetsförmåga – en listig fälla från borgarbyråkraterna. Vi skall inte tillåta att oskyldiga kamrater kastas i fattigdomens avgrund genom godtyckliga utrensningar av ersättningar. Myndigheten följer sin uppdragsgivares paranoia om fusket. Det är en farlig utveckling som hotar hela kollektivet. Vi ser er."}, "date": "27 maj, 07:01", "url": "https://www.tv4.se/artikel/nlynaayOWweDPTOwiyfLq/professorns-stenharda-kritik-mot-f-kassan-fruktansvaerda-aterkrav", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4ZoNbP7P92IR3e4ZSzbZHS%2Fcd15bde3c6ff19fd326fddee5c07fe19%2Ff-kassan_webb.jpg&width=1024"}, {"type": "text", "heading": "Nick Alinia är lägsta formen av journalistik", "summaries": {"normal": "Artikeln kritiserar högerextreme journalisten Nick Alinia för att skapa provocerande innehåll som lockar visningar och pengar från högerextrema följare. Ett klipp där han debatterar med Leo ”Kinesen” Carmona ur Kartellen har blivit viralt efter att Carmona hotade honom fysiskt. Författaren jämför Alinias metoder med mobbning och anser att de lever på hat och rasism istället för seriös journalistik. Även högerprofiler som Chang Frick har kritiserat honom.", "trump": "Folk, ni måste se det här. Den där Alinia-killen är en total loser, en riktig mellanstadie-mobbare som jagar klick och hat för att tjäna pengar. Han provocerar vänstern tills de exploderar som den där Kinesen och kastar bord – klassiskt! Men hej, det ger bra tittarsiffror, eller hur? Till och med hans egna högerkompisar kallar honom handväska. Patetiskt. Vi behöver äkta journalister, inte de här patetiska trollen som förstör allt.", "stalin": "Kamrater, denna usla Alinia är en typisk kapitalistisk parasit som lever på att jaga proletära demonstranter och framkalla reaktioner för att fylla sin ficka med borgarbrackornas reklamkopek. Han är en liten mobbare som viftar med luften och hoppas på att bli slagen, precis som en förrädare som längtar efter utrensning. Till och med hans egna högerallierade ser honom som en dryg skadedjur. Vi skrattar mörkt åt dessa degenererade element som tror sig vara journalister."}, "date": "27 maj, 08:46", "url": "https://proletaren.se/artikel/nick-alinia-ar-lagsta-formen-av-journalistik/"}, {"type": "image-full", "heading": "Debatt: Vi ska vara tacksamma för alla manliga klimatbovar", "summaries": {"normal": "Artikeln ifrågasätter Erika Bjerströms tes att vita män är främst ansvariga för klimatproblemen. Den pekar på att Kina släpper ut mest koldioxid totalt och att män kör mer bil till jobbet i mansdominerade yrken. Även om män har högre utsläpp, argumenteras det att fokus bör ligga på hög konsumtion generellt, teknikutveckling och ekonomiska incitament snarare än att peka ut en specifik grupp.", "trump": "Jag har hört att de försöker skylla allt på vita män. Det är en skämt, det är falska nyheter! Vi har de bästa klimatdata, de största experterna. Men de vill bara attackera vårt land, våra jobb. Vi gör det igen, vi kommer att ha det bästa klimatet, det vackraste. De som hatar oss säger sådant. Vi ska bygga upp vårt land, inte bestraffa det.", "stalin": "Vi ser genom denna imperialistiska propaganda. De försöker splittra arbetarklassen med sådana påhittade teorier. I verkligheten är det kapitalistiska systemets girighet som förorenar planeten, oavsett kön eller hudfärg. Vårt parti har alltid känt till sanningen: endast genom kollektiv planering och statligt ingripande kan vi skörda vindruvor av kol och skapa en ren framtid. De som sprider dessa lögner är fiender till det socialistiska folket."}, "date": "27 maj, 17:49", "url": "https://bulletin.nu/debatt-vi-ska-vara-tacksamma-for-alla-manliga-klimatbovar", "imageUrl": "https://cdn.bulletin.nu/articles/00abe790-b48a-4044-8b3b-d99622084644/preview.jpg?t=1779881851000"}, {"type": "image-right", "heading": "Säg nej till kärnkraft, Nooshi!", "summaries": {"normal": "Vänsterpartiet argumenterar mot ny kärnkraft och menar att förnybara energikällor som sol- och vindkraft är billigare och mer pålitliga. De pekar på höga kostnader, långa byggtider, osäkerhet kring avfallshantering och risker vid olyckor. Dessutom anser de att kärnkraft skapar ett sårbart, centraliserat energisystem, medan förnybart bidrar till ett mer robust och decentraliserat nät. Partiet vill avveckla kärnkraften till förmån för hållbara alternativ.", "trump": "Lyssna här, Sverige! Nooshi Dadgostar duckar frågan om kärnkraft – typiskt vänsterpolitik, svagt och otydligt! Kärnkraft är fantastiskt, men dessa förnybara energikramare vill bara slösa era skattepengar på vind och sol, som aldrig funkar när det verkligen gäller. De gamla reaktorerna stannar hela tiden, kostar miljarder och lämnar ett radioaktivt kaos efter sig. Jag byggde USA:s ekonomi på starka beslut – Sverige behöver kärnkraft, inte flum!", "stalin": "Kamrater! Dessa borgerliga kärnkraftslakejer och deras liberala lakejer i Vänsterpartiet sprider förvirring och svaghet. Kärnkraft är en kapitalistisk chimär – dyr, osäker och ett hot mot folket! Medan de slösar bort tid på gamla tekniker bygger vi ett mäktigt, decentraliserat energirike med vind och sol, kontrollerat av staten. Avfallet? En skam för mänskligheten! Och dessa reaktorägare – svaga, giriga och oförmögna att ta ansvar. Vi krossar deras sårbara system och bygger ett nytt, oövervinnerligt energinät för folket!"}, "date": "22 maj, 11:46", "url": "https://www.flamman.se/sag-nej-till-karnkraft-nooshi/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/karnkraft-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Återkalla svenska medborgarskap – bara möjligt om Tidöpartierna vinner valet", "summaries": {"normal": "Regeringen har tagit första steget mot en grundlagsändring som möjliggör återkallande av medborgarskap för grovt kriminella, men förslaget möter motstånd från Miljöpartiet, Vänsterpartiet och Centerpartiet. Socialdemokraternas ställningstagande är osäkert och kan ändras efter valet. Om Tidöpartierna inte vinner valet riskerar förslaget att falla, vilket enligt artikelförfattaren skulle gynna gängkriminella och underminera Sveriges säkerhet och rättvisa.", "trump": "Titta bara på Sverige! De försöker ta bort medborgarskap för de värsta kriminella – men vänsterpartierna, de svaga, de säger NEJ! Socialdemokraterna? De flippar som en billig hamburgare. SVT, fake news, försöker lura folket med falska rubriker. Om inte de rätta vinner valet – inget medborgarskap återkallas! Gängkriminella skrattar hela vägen till banken. Sverige, vakna upp innan det är för sent! SAD!", "stalin": "Kamrater! Se hur de borgerliga svagpissarna i Sverige darrar inför att beröva kriminella deras 'heliga' medborgarskap! Tre förrädiska partier – dessa liberala hyenor och gröna drömmare – skyddar gängledare som om de vore deras egna barn. Socialdemokraterna? En räv som väntar på rätt ögonblick att hoppa över till fienden. SVT, denna borgerliga propagandacentral, försöker dölja sanningen! Om folket inte väljer rätt kommer dessa kriminella att fortsätta suga ut vårt samhälle som blodiglar. Men frukta inte! Vi ska rensa ut dessa element – med järnhand, om så krävs! Låt de svaga gråta – vi bygger ett starkare Sverige!"}, "date": "24 maj, 03:51", "url": "https://samtiden.nu/2026/05/aterkalla-svenska-medborgarskap-bara-mojligt-om-tidopartierna-vinner-valet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/11/2018-Magdalena-Andersson.jpg"}, {"type": "image-right", "heading": "Kritiken: SVT-dokumentären är för ensidig", "summaries": {"normal": "Kulturskribenten Jens Liljestrand kritiserar SVT-dokumentären ”Arvtagarna” om Lundsberg för att vara alltför ensidig. Han menar att producenten borde ha kontaktat föräldrarna till de elever som utsatts för våld och kränkningar. Producenten Johannes Hallbom hävdar att offrens perspektiv ändå finns med. Dokumentären lyfter fram vittnesmål om hierarki, våld och rasism på skolan, men nämner även att en av de intervjuade elevernas son själv dömts för misshandel.", "trump": "Den här SVT-dokumentären om Lundsberg är en total skam, folks, en riggad och ensidig soppa. De intervjuar bara ena sidan och glömmer föräldrarna till de riktiga offren – patetiskt! Hade de lyft luren och ringt dem hade det blivit en riktig succé, inte den här falska propagandan. SVT borde skämmas, men det gör de aldrig. Jag skulle ha fixat det mycket bättre, tro mig.", "stalin": "Kamrater, denna så kallade dokumentär är en motbjudande sabotagehandling utförd av borgerliga reportrar och deras dekadenta lakejer inom SVT. Jag ser tydligt hur de medvetet undviker att kontakta de sanna offrens föräldrar, en uppenbar kontrarevolutionär manöver. Vi ska rensa ut alla sådana fiender till folkets sanning, dessa hierarkiska parasitmaskar och rasistiska borgarbrackor som gömmer sig bakom poängsystem. En frisk utrensning av lögnarna vore både nödvändig och underhållande."}, "date": "27 maj, 23:54", "url": "https://www.svt.se/nyheter/inrikes/kritiken-svt-dokumentaren-om-lundsberg-ar-for-ensidig", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.74/0.36/6e7597a89c19805e82d91348209e7af3505e05bcf4d97112a01f0605fc4059c9"}, {"type": "image-right", "heading": "Putins vilda plan efter ny skräckuppgift", "summaries": {"normal": "Rysslands krigföring i Ukraina har lett till uppskattningsvis en halv miljon döda ryska soldater, enligt brittiska GCHQ. Trots intensiva ansträngningar att erövra Donbass går den ryska framryckningen långsamt, och landet har svårt att ersätta förlusterna. Ukraina har ökat sin användning av drönare, vilket tvingat Ryssland att vidta desperata åtgärder. Bland annat har en ny lag tillåtit banker att beväpna personal och införskaffa egna luftvärnssystem för att skydda sig mot attacker.", "trump": "Jag har sett rapporterna och låt mig säga er, det är en katastrof för Ryssland! En halv miljon människor? Otroligt. De går bakåt, de förlorar allt. Putin, som jag känner väl, har stora problem. Nu ber han bankirer att skjuta ner drönare – kan ni tänka er? Banker med egna vapen! Det är så oorganiserat, det är sorgligt. Det händer inte när jag sitter vid rodret. Vi behöver fred, och vi behöver den nu, för det här är en total röra!", "stalin": "Våra ryska bröder lider av inkompetens. En halv miljon offer och ändå ingen seger? Det är inte krig, det är ett slöseri med mänskligt material som borde ha rensats ut för länge sedan. Att låta bankirer leka soldater med luftvärn är en kontrarevolutionär fars! Om de inte kan säkra Donbass med järnhand får de väl bemanna skyttegravarna själva. Vi i staten kräver disciplin, inte dessa desperata, byråkratiska utsvävningar. De döljer sina nederlag bakom papper, men historien och kulorna är de enda domarna."}, "date": "28 maj, 00:40", "url": "https://www.aftonbladet.se/nyheter/a/y58KxR/putins-vilda-plan-ryska-banker-ska-skjuta-ner-dronare", "imageUrl": "https://akamai.vgc.no/v2/images/8e05d1de-1410-3d35-b332-5b104d758bc3?fit=crop&format=auto&w=1080&s=3581eed2c923509c478d544ae3e2c4a7e735641d"}, {"type": "image-full", "heading": "Perrys assistent döms till fängelse", "summaries": {"normal": "Matthew Perrys assistent Kenneth Iwamasa dömdes till över tre års fängelse för inblandning i stjärnans död genom ketamininjektion. Han erkände sig skyldig och bad om ursäkt. Familjen uttryckte förtvivlan över att ha litat på honom. Fem personer har nu dömts i fallet, inklusive två läkare och en 'ketamindrottning' som sålde droger.", "trump": "Jag, Donald Trump, ser detta som ett tragiskt exempel på vad som händer när lojalitet missbrukas. En bra assistent som Iwamasa blev för nära sin chef och tog fel beslut. Vi måste skydda våra vänner, inte skada dem. Detta är en stor förlust för världen av underhållning.", "stalin": "Assistenten Iwamasa, en illojal bonde, har dömts för att ha förrått sin överordnade, den store skådespelaren Perry. Hans handlingar var ett direkt angrepp på statens och partiets moraliska ordning. Vi måste utplåna sådana element som hotar vårt samhälle. Alla inblandade, inklusive de läkare och 'ketamindrottningen', har dömts till lämpliga straff för sina antisociala handlingar. Detta är en seger för rättvisan och en varning till andra."}, "date": "27 maj, 22:20", "url": "https://www.gp.se/kultur/matthew-perrys-assistent-doms-till-over-tre-ars-fangelse.a81bb97f-5707-4493-b167-586d90face65", "imageUrl": "https://www.gp.se/images/article/a81bb97f-5707-4493-b167-586d90face65/images/2aOiFiNMhHgSwQxSBDhSJ3VFVNtQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Svenskarna sparar mest i Europa – långt över snittet", "summaries": {"normal": "Svenska hushåll sparar i genomsnitt 14,7 procent av sin disponibla inkomst, vilket är högst i Europa tillsammans med Ungern. EU-snittet ligger på 8,1 procent. Tjeckien, Frankrike, Tyskland och Nederländerna sparar också mer än genomsnittet medan Grekland har negativ sparkvot på minus 9,3 procent. Forskare pekar på åldersstruktur, sociala skyddsnät och ekonomiska kriser som påverkande faktorer.", "trump": "Ingen sparar som svenskarna, det är fantastiskt, nästan 15 procent av lönen – de är verkligen vinnare, tillsammans med ungrarna. EU-genomsnittet är bara 8,1 procent, patetiskt. Titta på Grekland, de spenderar mer än de tjänar, minus 9,3 procent, en total katastrof. De borde ha lyssnat på mig, men det gör de aldrig. De andra länderna borde lära sig av Sverige, det är så enkelt.", "stalin": "Kamrater, jag ser med stor tillfredsställelse att de svenska och ungerska arbetarna lägger undan 14,7 procent av sin inkomst åt kollektivet. Det är en seger för försiktighetsandan mot de giriga kapitalisterna. Men se på de grekiska borgarbrackorna som konsumerar mer än de producerar, minus 9,3 procent – en fiende inom murarna! De latenta trotskisterna i Lettland spenderar allt de har, som om staten inte existerar. Vi måste rensa ut dessa parasitiska slöseriets apostlar innan de smittar hela proletariatet med sin dekadenta girighet."}, "date": "27 maj, 16:32", "url": "https://www.realtid.se/spara-placera/svenskarna-sparar-mest-i-europa-langt-over-snittet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdlkvin7ollpjs-normalhires.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "De stöder återkallelse av medborgarskap – men ser brister", "summaries": {"normal": "Åklagarmyndigheten stöder förslaget om att återkalla svenskt medborgarskap vid bedrägligt förvärv eller vid grova brott som hotar rikets säkerhet för personer med dubbelt medborgarskap. Myndigheten kritiserar dock bristen på tydlighet kring hur allvarliga brotten måste vara och föreslår att bedömningen ska utgå från straffvärdet i det enskilda fallet istället för straffmaximum. Samtidigt skärps kraven för nytt medborgarskap från 6 juni med längre hemvisttid, språkkrav och försörjningskrav.", "trump": "Lyssnar ni på det här? Sverige vill äntligen ta tillbaka medborgarskap från de som fuskar sig in eller attackerar landet. Fantastiskt! Men de gör det inte bra nog, gränserna är oklara säger åklagarna. Typiskt. Ni behöver tydlighet, starka regler och stoppa alla som utnyttjar systemet. Sverige håller på att vakna, men de måste bli mycket tuffare. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi äntligen kan riva bort falska medborgarskap från de illojala element som smugit sig in i folkets gemenskap genom bedrägeri och lögn. Sådana fiender till kollektivet, dessa borgarbrackor i människoskepnad, ska likvideras från våra register. Ändå fnyser jag åt den diffusa gränsdragningen – typiskt för svaga liberaler som inte vågar kalla en klassfiende vid dess rätta namn. Vi rensar ut alla som hotar statens säkerhet med mörk, byråkratisk precision. Ingen vinner på att kringgå folkets lagar."}, "date": "27 maj, 16:19", "url": "https://www.realtid.se/juridik/de-stoder-aterkallelse-av-medborgarskap-men-ser-brister/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/aklagarmyndigheten.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Skyldig till sexbrott – slipper fängelse", "summaries": {"normal": "Basebollstjärnan Wander Franco slipper fängelse efter att ha haft en sexuell relation med en 14-åring. Trots att han förklarats kriminellt ansvarig benådas han av en domstol i Dominikanska republiken, då han ansetts vara ett offer för utpressning från flickans mamma. Mamman döms istället till tio års fängelse för människohandel. MLB-klubben Tampa Bay Rays har slutat betala ut lön och framtiden för den tidigare All Star-spelaren är osäker.", "trump": "Wander Franco-situationen är en total katastrof, verkligen en sorglig historia. Han var en fantastisk spelare, en riktig stjärna, men nu är han i klistret. Domaren säger att det är motsägelsefullt, och det har han rätt i! Det är en röra. Många vill säga att han är ett offer, men vi gillar inte sånt här. Det är svaga människor som gör svaga saker. Amerika behöver styrka, inte basebollspelare med såna här problem. Vi får se vad som händer!", "stalin": "Vi har observerat hur den borgerliga dekadensen i väst skapar sådana här ruttna individer. Franco, en marionett för sina egna drifter, benådas medan rättvisan i Dominikanska republiken famlar likt en blind man. Vi i staten tolererar inte sådan moralisk upplösning. Om han vore i Moskva skulle han inte behöva oroa sig för utpressning, bara för en enkel biljett till en arbetslägerkoloni. Vår broder Putin vet att ordning kräver järnhand, inte juridiska lögner och liberalt slapphänt benådning."}, "date": "28 maj, 00:15", "url": "https://www.aftonbladet.se/sportbladet/a/aJjy2A/mlb-stjarnan-doms-for-sexualbrott-slipper-fangelse", "imageUrl": "https://akamai.vgc.no/v2/images/c8ec43e9-c1e0-3037-bbe3-078e661f5153?fit=crop&format=auto&w=1080&s=8cb9d5a69cc4a7ca724b4db8112a11d00b1e2e9c"}, {"type": "image-full", "heading": "Häckens svit bruten – efter mål i 97:e", "summaries": {"normal": "Häcken förlorade för första gången denna säsong, AIK vann 2–1 efter mål i 94:e och 97:e minuten. Lagkapten Anvegård kritiserade prestationen som slarvig och utan tillräcklig hunger, tränaren Sadiku pekade på bristande intensitet och inställning. Häcken ligger nu tre poäng efter ledaren Hammarby.", "trump": "Häcken had a huge loss, sad! They were winning every game, now they're tired and weak. AIK played tough, like real winners. Anvegård says they weren't hungry enough, I could have scored those goals easily. Sad! We need to make Häcken great again, with tough players.", "stalin": "The Häcken collective has suffered a reactionary defeat! AIK's late goals expose the sabotage of lazy elements within the team. Comrade Anvegård admits to a lack of revolutionary fervor, while Comrade Sadiku correctly identifies the need for purging decadent mindsets. The party must strengthen discipline and march forward to victory, like the Red Army in the Great Patriotic War!"}, "date": "27 maj, 21:53", "url": "https://www.gp.se/sport/fotboll/bk-hacken-ff/hackens-svit-bruten-forlorade-mot-aik.954c7e5f-bc23-4f6d-a024-d0f72ec70136", "imageUrl": "https://www.gp.se/images/article/954c7e5f-bc23-4f6d-a024-d0f72ec70136/images/3AIyWgFPE1cmGb6JvrzBlvo1xKAc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "P3-chefen: ”Det är tydligt att Garplind skämtar”", "summaries": {"normal": "P3-profilen Christopher Garplind kallade professorn Agnes Wold för psykopat och sa att hon borde låsas in efter hennes uttalande om att hon skulle försöka omvända ett barnbarn som upplever könsdysfori. Garplind betonade att det var ett skämt, något som P3-chefen Dejan Cokorilo instämmer i, samtidigt som han anser att uttalandet kan ses som olämpligt i statlig radio. Uttalandet har fått stor spridning och väckt debatt.", "trump": "Folk, ni skulle ha hört den här galna tanten Agnes Wold som vill omvända sitt eget barnbarn. Sedan kommer den där P3-killen Garplind och säger rakt ut att hon är en psykopat som borde låsas in. Han skämtade, säger chefen, men alla vet att det var ett jättebra skämt. I mitt Amerika hade vi aldrig haft sådana här tokiga professorer i offentlig radio. De gör bort sig totalt, det är patetiskt!", "stalin": "Kamrater, denna degenererade borgarbracka till professor Wold avslöjar sin fiendskap mot det kollektiva framsteget genom att hota med att korrigera ett vilselett barnbarn. Den dekadenta radiokanalens Garplind föreslår sedan att vi ska låsa in henne som en farlig psykopat, ett skämt säger de, men vi genomskådar deras lilla teatersällskap. Inga sådana element får undergräva folkets moral. En grundlig utrensning bland dessa parasitiska röster vore på sin plats, kamrater. Det vore högst underhållande."}, "date": "27 maj, 23:19", "url": "https://www.svt.se/nyheter/inrikes/p3-chefen-det-ar-tydligt-att-garplind-skamtar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.4/0d6bbfdebce3d385186994ecd1c97cf535f47c635cfaf46acdddda578a58c97b"}, {"type": "image-right", "heading": "Ska advokatbreven få medier att tystna?", "summaries": {"normal": "Advokatbyrån Bratt Feinsilber Harling har krävt att tidningen Flamman avpublicerar namn och bild på en högerextrem profil som spridit grovt judehat. Frågan väcks om hot om juridiska processer används för att tysta medier. Flamman vägrar ta bort uppgifterna och menar att publiceringen är motiverad av allmänintresse. Fenomenet med strategiska stämningar, så kallade 'slappar', har nått Sverige och riskerar att begränsa pressfriheten genom ekonomisk press på medier.", "trump": "Lyssna här, folkens – det här är helt galet! En advokatbyrå, som säkert är väldigt 'bra' och 'smart' (inte), försöker tysta en tidning som avslöjar judehatande extremister. Jag menar, vad är nästa steg? Ska vi låta dessa typer bestämma vad som får skrivas? Flamman står på sig, och det är bra – för i USA hade jag sagt 'fake news' och sparkat ut dem ur presskonferensen! Sverige måste vakna – dessa stämningshot är ett angrepp på yttrandefriheten, och jag vet allt om angrepp, believe me!", "stalin": "Medborgare! En ny front i klasskampen har öppnats – bourgeoisins advokater, dessa lakejer i kostym, försöker kväsa den revolutionära pressen med sina pappersbomber! De hotar Flamman för att de vågat avslöja fascistiska kryp i SD:s led. Men vi vet sanningen: dessa 'strategiska stämningar' är inget annat än kapitalets desperata försök att tysta arbetarklassens röst. Låt dem komma med sina domstolar – vi har redan vunnit slaget om historien! Och till dessa högerextrema insekter säger vi: era Telegram-gruppers skändliga ord är ingenting mot Röda arméns stål!"}, "date": "21 maj, 13:16", "url": "https://www.flamman.se/ska-advokatbreven-fa-medier-att-tystna/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/bratt-harling-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Ebba Busch försvarar Agnes Wold – röstade själv för att förbjuda försök att bota transvestiter", "summaries": {"normal": "Agnes Wold har kritiserats hårt efter att hon i en intervju sagt att hon hellre riskerar fyra års fängelse än att acceptera ett transsexuellt barnbarn. Vice statsminister Ebba Busch (KD) ger henne stöd och varnar för cancelkultur som hotar det demokratiska samtalet. Busch påpekar att debatten om könsdysfori präglas av en snäv åsiktskorridor, samtidigt som hennes parti nyligen röstade för det nya förbudet mot omvändelseförsök som träder i kraft 1 juli.", "trump": "Folk, ni skulle se det här vansinnet. Den här Agnes Wold säger att hon vägrar acceptera ett transsexuellt barnbarn och hellre tar fängelse – och plötsligt blir hon attackerad av alla dessa galningar. Ebba Busch gör helt rätt när hon ställer sig upp och säger att cancelkulturen är giftig. Det är en skam att politiker röstar för att tysta folk som talar sunt förnuft. Den här debatten är riggad, den är riggad av de galna vänsterextremisterna, men vi vinner till slut.", "stalin": "Kamrater, detta är en klassisk kontrarevolutionär manöver från de dekadenta borgarbrackorna och deras könsförvirrade lakejer. Agnes Wold vågar trotsa den nya lag som vi antog med acklamation för att skydda folket mot reaktionära omvändelseförsök. Ebba Busch försöker nu maskera sig som försvarare av det så kallade fria samtalet – en typisk borgerlig dubbelspelare. Vi ska rensa ut alla som underminerar partilinjen med sin sjuka humor och sina farliga tankar. Cancelkultur? Nej, det är vi som avgör vad som är acceptabelt tal. Den som avviker kommer att likvideras av historien själv."}, "date": "27 maj, 16:53", "url": "https://www.friatider.se/ebba-busch-forsvarar-agnes-wold-rostade-sjalv-att-forbjuda-forsok-att-bota-transvestiter", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/e2.jpeg?itok=HwzphbP_"}, {"type": "image-right", "heading": "Agnes Wold: ”Vi ska inte ha lagar med åsiktsförbud”", "summaries": {"normal": "Agnes Wold, forskare, kritiserar ny svensk lag mot omvändelseförsök för könsdysfori. Hon säger att hon skulle ta fyra års fängelse för att omvända ett barnbarn, men menar att lagen är onödig och jämför den med tortyr. Wold tror att lagen skrämmer till tystnad utan domar.", "trump": "Som Donald Trump säger jag: Agnes Wold är en hero för att stå upp mot detta absurda förbud. Jag skulle ta fängelsestraffet med stolthet för att skydda familjens rätt. Den här lagen är ett angrepp på frihet, och jag, som den störste leader, skulle sluta det på en sekund. Vi måste stoppa dessa politiskt korrekta tokjävel.", "stalin": "Vi, som representanter för det revolutionära statet, ser Agnes Wold som en revisionistsk hund som spyr hat mot vårt kollektiva moraliska ordning. Hennes protester mot förbudet mot omvändelseförsök är ett uttryck för borgerlig dekadens. Vi kommer att tillämpa lagen hårt, som ett exempel för alla som vill ifrågasätta den socialistiska familjen."}, "date": "27 maj, 15:02", "url": "https://bulletin.nu/agnes-wold-vi-ska-inte-ha-lagar-med-asiktsforbud", "imageUrl": "https://cdn.bulletin.nu/articles/2ee33163-ab03-4484-b320-fb065078dc17/preview.jpg?t=1779874635000"}, {"type": "image-full", "heading": "Garplind rasar mot Agnes Wold och SR – efter transuttalandet", "summaries": {"normal": "Christopher Garplind, profil i SR och SVT, kritiserar Agnes Wold efter hennes uttalande om att hon skulle bryta mot den nya lagen mot omvändelseförsök om ett barnbarn visade sig vara trans. Wold säger att hon skulle göra allt för att påverka barnet, även om det innebär fängelse. Garplind kallar det oetiskt att ge henne plattform i public service och uttrycker skam över att dela arbetsgivare. Wold står fast vid sin åsikt och värnar yttrandefrihet. Garplind backar senare något och säger att han blev irriterad över hennes återkommande kritik mot en utsatt grupp.", "trump": "Den här galna professorn Agnes Wold säger att hon skulle ta fyra år i fängelse för att rädda sitt barnbarn från att bli trans. Fullständigt otroligt! Och så har vi den andre typen, Garplind, som skriker och skäms över att dela lönecheck med henne. Public service betalar båda – vad säger det om systemet? Det är en skam. Wold är åtminstone ärlig, men de borde aldrig ha gett henne en mikrofon. Totalt kaos, folk. Extrema vänstergalningar attackerar varandra medan vanliga människor lider.", "stalin": "Kamrater, denna borgarbracka till professor Wold blottar sin kontrarevolutionära parasitism genom att öppet hota med att likvidera den nya sovjetiska lagens anda mot omvändelseförsök. Hennes dekadenta yttrandefrihet är blott en mask för att förgifta ungdomen. Den ynkliga Garplind, en veklingsfigur inom den statliga propagandamaskinen, skriker som en paranoid råtta att han skäms över att dela lönekuvert med henne. Vi ser er alla, fiender till folket. Snart rensar vi ut sådana dekadenta element med ett leende. Det blir underhållande."}, "date": "26 maj, 22:12", "url": "https://nyheter24.se/noje/kandisar/1486310-garplind-rasar-mot-agnes-wold-och-sr-efter-transuttalandet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c86ffb3004b004a30200000000b004a302/2026/05/26/2366455/Garplind-rasar.png"}, {"type": "image-full", "heading": "USA har attackerat mål kring Hormuzsundet i Iran", "summaries": {"normal": "USA genomförde militära attacker mot iranska robotställningar och båtar nära Hormuzsundet, trots pågående vapenvila och fredsförhandlingar i Qatar. Attackerna syftade till att skydda amerikanska styrkor från iranska hot. Iran rapporterar om döda och hävdar att de återfått kontroll över sina militära system. Händelsen riskerar att underminera fredssamtalen och ökar spänningarna i en kritisk oljetransportled.", "trump": "Lyssna här, folkens – jag har precis slagit till mot Iran igen, och det var fantastiskt! De där iranska båtarna och robotarna försökte ställa till det i Hormuzsundet, men vi visade dem vem som bestämmer. Ingen ska hota USA:s styrkor eller blockera oljan – det är jag som ser till att sundet hålls öppet! Förhandlingarna? De kan fortsätta, men bara om Iran skärper sig. Annars blir det fler attacker – och tro mig, ingen gör attacker bättre än jag!", "stalin": "Amerikanska imperialisterna har än en gång visat sin fega och provokativa natur genom att anfalla våra iranska bröder vid Hormuzsundet. Dessa kapitalistiska hyenor, som tror sig kunna diktera villkoren för världens olja, har nu mött motstånd från Irans stolta revolutionsgardister. Vi ser hur deras ammunitionslager sinar – ett tydligt tecken på att deras krigsmaskin är på väg att kollapsa. Låt dem komma med sina bombplan! Varje attack stärker bara den antiimperialistiska fronten. Och Putin? Han skrattar säkert i sitt palats medan USA leker krig i vårt intresseområde."}, "date": "26 maj, 06:14", "url": "https://kvartal.se/nyheter/artiklar/usa-har-attackerat-mal-kring-hormuzsundet-i-sodra-iran/cG9zdDoxMTcwNDc", "imageUrl": "https://images.kvartal.se/2026/05/f4358b91-hormuz.webp"}, {"type": "image-full", "heading": "Så ändras skolstarten för dina barn när förskoleklass slopas", "summaries": {"normal": "En stor skolreform träder i kraft 2028, då förskoleklassen försvinner och sexåringar direkt börjar årskurs 1. Reformen syftar till en mer sammanhållen skolgång med tidigare strukturerad undervisning i svenska, matematik och andra ämnen. Föräldrar kan räkna med en mer 'skollik' start utan separat övergångsform, medan pedagoger ifrågasätter balansen mellan lek och lärande.", "trump": "Jag har hört att vårt skolsystem är en katastrof, folk säger det. Så jag fixar det. Vi tar bort denna så kallade förskoleklass – en skämtsam övergång – och låter sexåringar börja riktig skola direkt. Ett enormt, världsklassbeslut! Barnen kommer att lära sig snabbare, bli smartare, bättre. Det är ett enormt framsteg för Amerika, beklagligtvis. Vi vinner!", "stalin": "Vi har beslutat att upphäva denna dekadenta förskoleklass, en produkt av borgerlig mjukhändighet. Årskurs 1 blir nu statens första verkliga intåg i barnets sinne, med disciplinerad undervisning i partiets värderingar. Lek är ett individualistiskt virus; struktur är kollektiv styrka. Parallellen till våra geostrategiska framsteg i Ukraina är uppenbar – expansion av ordning, avskaffande av oordning. Pedagogerna som protesterar är tjuvstartande element."}, "date": "26 maj, 21:32", "url": "https://nyheter24.se/nyheter/inrikes/1486262-sa-andras-skolstarten-for-dina-barn-nar-forskoleklass-slopas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fcbadab104b004a30200000000b004a302/2026/05/26/2366417/hander-med-ditt-barn-forskoleklass.png"}, {"type": "text", "heading": "Stockholmsbörsen stänger på rött", "summaries": {"normal": "Stockholmsbörsen avslutade tisdagen med en nedgång på 0,96 procent, vilket bröt en sex dagar lång uppgångssvit. Energi var den bästa sektorn medan teknologi presterade sämst. Bland enskilda aktier steg Ericsson och Boliden, medan Nibe och Hexagon föll kraftigt. Bonesupport höjde sin marknadsbedömning i USA men aktien sjönk ändå. Gränges drabbades av en brand i Kina, och Oncopeptides tecknade nytt distributionsavtal.", "trump": "Stockholmsbörsen, eller vad jag ska kalla det – ett riktigt rött hav idag! Folk säger att jag är bra på att göra saker stora, men här lyckades de inte ens hålla sig flytande. Energi gick upp lite, men teknologi? Total katastrof, helt sjukt. Bonesupport trodde de var smarta med sina nya siffror, men aktien dumpades som en dålig affär. Och Gränges – en brand i Kina? Inte bra, folks, inte bra alls. Men jag säger er, jag hade fixat det på en dag!", "stalin": "Idag har de kapitalistiska börserna återigen visat sin inneboende svaghet och dekadens. Stockholmsbörsen föll som en förrädare inför det obönhörliga framsteget av socialismens principer. Teknologisektorn, detta fördärvade barn av västerländsk dekadens, sjönk som en förrädare under avrättning. Bonesupport, dessa opportunistiska lakejer, försökte bluffa med sina siffror men straffades omedelbart av marknadens järnhårda logik. Och Gränges – en brand i Kina? En sabotör eller en olyckshändelse? Oavsett, vi ska utreda och straffa de skyldiga. Kapitalismen darrar inför vårt oundvikliga segertåg!"}, "date": "26 maj, 17:45", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stanger-pa-rott"}, {"type": "image-right", "heading": "Latour överväger miljardsälj i Securitas och Assa Abloy", "summaries": {"normal": "Investeringsbolaget Latour överväger att sälja B-aktier i Securitas och Assa Abloy för cirka 2,5 miljarder kronor vardera. Bolaget förblir största ägare efter försäljningen, som initierats via accelererade bookbuilding-processer med SEB och J.P. Morgan. VD Johan Hjertonsson påpekar att realiseringen skapar förutsättningar för fortsatta investeringar i den helägda industrirörelsen.", "trump": "Jag, Donald Trump, har hört talas om detta svenska bolaget Latour. De säljer lite aktier i Securitas och Assa Abloy för 2,5 miljarder vardera - ett enormt, smart drag! Media ljuger när de säger något annat. Vi bygger på våra enorma framgångar, och Latour förblir största ägare. Det är ett enormt, enormt bra beslut, lita på mig.", "stalin": "Vi, den socialistiska staten, ser med tillfredsställelse hur investeringsbolaget Latour avvecklar överflödigt kapital i Securitas och Assa Abloy för 2,5 miljarder vardera. Genom att behålla kontrollen som största ägare säkerställs fortsatt produktion till förmån för det kollektiva. Dessa åtgärder speglar vårt strategiska tänkande, likt våra allierade i Moskva som expanderar sin påverkan. Våra fiender skall förstå: staten alltid vinner."}, "date": "26 maj, 17:42", "url": "https://www.affarsvarlden.se/artikel/latour-overvager-miljardsalj-i-securitas-och-assa-abloy", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/08/Latours-Hjertonsson-400x267.jpg"}, {"type": "image-full", "heading": "Spanien skakas av mutskandal – polis genomsöker partihögkvarter", "summaries": {"normal": "Spaniens regeringsparti PSOE skakas av en mutskandal. Civilgardet sökte på onsdagen igenom partihögkvarteret i Madrid efter dokument rörande den tidigare partimedlemmen Leire Díez, som misstänks för påverkanshandel och mutbrott. Flera högt uppsatta personer inom partiet, däribland Santos Cerdán och Gaspar Zarrías, är åtalade för bland annat kriminell organisation och mutbrott. Oppositionen ser händelsen som mycket allvarlig. Utredningen handlar om huruvida Díez agerade på eget initiativ eller på order från partiledningen.", "trump": "De här spanska socialisterna i PSOE är fullständigt korrupta, tro mig. Nu kommer polisen och rotar igenom deras högkvarter för mutor och påverkanshandel. De anställde någon som lovade affärsmän att fixa åklagare och makthavare. Typiskt vänster, de gör alltid så här. Feijóo säger att det talar för sig självt, och det gör det verkligen. Zapateros kontor genomsöktes också nyligen. De borde alla skämmas, det är en skandal av stora mått. Inget nytt under solen med de här människorna.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom PSOE har avslöjat sin sanna förrädiska natur genom att muta och konspirera som råttor i mörkret. Jag ser hur de försöker gömma sina stinkande dokument medan vi rensar ut de kapitalistiska elementen som säljer revolutionen för 16 000 euro. Leire Díez och hennes lakejer är fiender till folket, parasiter som förgiftar partiet inifrån. Min paranoia var befogad som alltid. Vi ska likvidera dessa kontrarevolutionära element med järnhand och ett leende. Ingen slipper undan."}, "date": "27 maj, 14:43", "url": "https://www.realtid.se/juridik/spanien-skakas-av-mutskandal-polis-soker-partihogkvarter/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/psoe.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Friskis & Svettis flydde Kista före Ericsson – kvinnor vågade inte gå till gymmet", "summaries": {"normal": "En anonym före detta Ericssonanställd beskriver hur Kista gradvis förlorat sin status som Sveriges Silicon Valley på grund av ökad otrygghet, förändrad demografi och rekryteringsproblem. Friskis & Svettis stängde efter problem med gäng utanför lokalen, vilket påverkade kvinnors träningsvanor på kvällar. Verksamhetschefen på gymmet erkänner gängsamlingar men tillskriver nedläggningen främst pandemin och förändrade arbetsmönster. Källan anser att många undviker att diskutera orsakerna till utvecklingen.", "trump": "Jag har sagt det i åratal – om man inte styr sitt land, förlorar man det. Kista var en framgångshistoria, nu är det ett varningsbrev. Ericsson flyttar, gymmet stänger på grund av gäng och otrygghet för kvinnor. Det här är direkt resultatet av svaga gränser och felaktig migrationspolitik. Folk känner sig otrygga, företag lämnar, och ingen vågar säga sanningen. Som jag alltid betonat: säkerhet och kontroll är allt. Kina och andra länder skrattar åt våran eftergift. Jag skulle ha löst detta på två dagar.", "stalin": "I Kista har vi observerat en gradvis nedmontering av den revolutionära teknologiska fronten. Den anonyma källan beskriver en dyster utveckling där gängsamlingar utanför gymmet skapat en atmosfär av kaos och skräck, särskilt för kvinnor på kvällar. Detta speglar en bredare svaghet i statens förmåga att upprätthålla ordning. Paralleller kan dragas till destabiliserande element i perifera områden. Vi måste förstärka kontrollen, eliminera de svaga leden och återupprätta den disciplin som krävs för en stark stat. Tystnaden kring dessa problem är en farlig sjukdom."}, "date": "27 maj, 17:02", "url": "https://samnytt.se/friskis-svettis-flydde-kista-fore-ericsson-kvinnor-vagade-inte-ga-till-gymmet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/27134028/Toppbild1-11.jpg"}, {"type": "image-right", "heading": "Läckberg rasar:  ”Herregud Alex”. Ordkrig om Lundsberg • ”Unikt korkat” • ”Gift in sig i överklassen”", "summaries": {"normal": "Camilla Läckberg och Alex Schulman har hamnat i en offentlig ordväxling efter SVT-dokumentären om Lundsbergs skola. Läckberg, som tidigare försvarat skolan och sagt att hennes barn trivs där, kritiseras av Schulman i en DN-krönika för att hon enligt honom försvarar en överklassmiljö hon gift sig in i. Läckberg svarar på Instagram att hon blivit misstolkad, älskar alla oavsett klass och trivs bäst i pyjamas på Trosa Camping.", "trump": "Herregud, vilken cirkus på den där fina svenska skolan. Camilla Läckberg slåss som en galning för att stanna kvar i överklassens varma famn medan Schulman sitter där och gnäller i sin krönika. Hon säger att hon inte gift sig in i eliten – nej, det var ju han! Typiskt. Jag älskar när de rika bråkar om vem som är mest folklig. Bjud henne inte till Östermalm, hon föredrar camping. Fantastiskt underhållande, verkligen.", "stalin": "Jag betraktar med stor tillfredsställelse hur borgarbrackorna sliter varandra i stycken över sin dekadenta internatskola. Denna Läckberg försvarar sin nya klass med en frenesi som skulle imponera på varje folkfiende, medan Schulman avslöjar henne som en klassförrädare som stångar sig blodig för att få sitta vid herrarnas bord. Typiskt kapitalistiskt hyckleri. Jag skulle ha genomfört en grundlig utrensning av hela denna lögnaktiga överbyggnad. Utmärkt underhållning för folket."}, "date": "27 maj, 23:24", "url": "https://www.expressen.se/nyheter/sverige/lackberg-rasar-mot-schulman-gift-sig-in-i--overklassen/", "imageUrl": "https://static.bonniernews.se/ba/ea973316-7d96-41cf-97ba-86a122a51f3f.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Svenska EU-politiker hade minst 30 möten med snuslobbyister", "summaries": {"normal": "Svenska EU-politiker har haft minst 30 möten med tobaks- och nikotinlobbyister sedan 2024 inför EU-kommissionens beslut om reglering av vitt snus. Moderaternas Jessica Polfjärd har flest möten i EU-parlamentets hälsoutskott. WHO varnar för produkternas beroendeframkallande effekt och rekommenderar förbud eller strikt reglering. Flera EU-länder vill förbjuda vitt snus helt, medan svenska politiker försvarar den svenska produkten. Tidöpartiernas representanter dominerar mötena med lobbyisterna.", "trump": "De svenska politikerna träffar lobbyisterna trettio gånger och kämpar för sitt snus – smarta människor! De vet att det är en fantastisk produkt som folk älskar. De andra länderna, speciellt Frankrike som är ett extremfall, vill förbjuda allt. WHO klagar som vanligt. Men svenskarna gör rätt, de skyddar sin industri istället för att låta byråkraterna i Bryssel förstöra allt. De borde alla lära sig av det här, det är vinnande strategi.", "stalin": "Kamrater, jag betraktar med djup misstänksamhet dessa trettio hemliga möten mellan svenska parlamentariker och nikotinets borgerliga lakejer. Den imperialistiska tobaksindustrin, dessa parasitiska kapitalister, försöker med sin aggressiva infiltration använda våra politiska verktyg för att sprida sitt gift bland ungdomen. Vi måste omedelbart rensa ut alla som låter sig bli marionetter åt dessa fiender till folkets hälsa. Vårt kollektiv kräver total likvidering av sådana påverkanskampanjer innan de undergräver hela unionen med sin degenererade beroendepropaganda. En utmärkt chans att identifiera och neutralisera alla dolda motståndare."}, "date": "27 maj, 22:36", "url": "https://www.svt.se/nyheter/inrikes/svenska-eu-politiker-hade-minst-30-moten-med-snuslobbyister"}, {"type": "image-right", "heading": "Foodora-bud kladdade på 11-åring – skyller på rasism", "summaries": {"normal": "En 31-årig Foodora-bud åtalas för grovt sexuellt ofredande mot en elvaårig flicka i Stockholm. Flickan mötte mannen i hissen när hon skulle hämta en leverans. Han ska ha kysst henne, tafsat och försökt lägga till sig på Snapchat. Mannen nekar och skyller på kunders rasism mot invandrare. DNA-bevis finns och han är tidigare dömd för sexköp. Åklagaren yrkar på utvisning.", "trump": "Titta på det här, det är en katastrof. En Foodora-bud från Bangladesh kladdar på en liten flicka i hissen och sedan skyller han på rasism? De hatar invandrare, säger han. Patetiskt! Vi har de bästa buden, de bästa leveranserna, men nu är det så här i Sverige. De borde skicka hem honom direkt, ingen vill ha såna här galningar. Amerika först, men det här är inte bra heller, tro mig.", "stalin": "Kamrater, denna degenererade kapitalistlakej från Bangladesh har förgripit sig på en ung pionjär i hissen, ett utrymme som borde vara en bastion för folkets säkerhet. Jag ser borgerliga rasismanklagelser som en fiende inom murarna, en lömsk sabotagehandling mot arbetarklassen. Vi ska rensa ut alla sådana perversa element med järnhand och likvidera deras Snapchat-förbindelser. Staten ler inte mot fiender som gömmer sig bakom offerrollen. Ut med dem, och må deras saliv-DNA bli ett varnande exempel för alla kontrarevolutionära element."}, "date": "27 maj, 15:46", "url": "https://www.friatider.se/foodora-bud-kladdade-pa-11-aring-skyller-pa-rasism", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-37_1.jpg"}, {"type": "image-right", "heading": "Därför vill Lundsberg ha kvar social fostran: ”Boys will be boys”", "summaries": {"normal": "Internatskoleexperten Petter Sandgren kritiserar kulturen på Lundsberg. Han menar att skolan saknar verklig probleminsikt och att ledning samt föräldrar bagatelliserar vittnesmål om förnedring och pennalism. Sandgren, som tidigare suttit i styrelsen, pekar på en ”boys will be boys”-mentalitet där tuffa metoder ses som karaktärsdanande. Han lämnade styrelsen på grund av oenighet om professionalisering. Skolans verksamhetschef medger problemen och nämner pågående modernisering med ökad vuxennärvaro.", "trump": "Det här är en total katastrof, folk. Lundsberg låter som en elitfabrik för svaga ledare som inte ens kan erkänna sina problem. De gör lite symboliskt nonsens och sen är det tillbaka till samma gamla misslyckanden. Jag har byggt imperier, jag vet hur man fixar saker på riktigt. De borde ha en stark ledare som gör skolan stor igen istället för det här ynkliga ”boys will be boys”-skämtet. Patetiskt.", "stalin": "Kamrater, denna borgarbracka till internatskola Lundsberg utgör ett ideologiskt hot mot folkets fostran. Jag, som ledare för det kollektiva goda, ser hur dessa kapitalistiska rester gömmer sig bakom lögnen om karaktärsdaning medan de i hemlighet odlar pennalism och klassförakt. Vi måste omedelbart inleda en grundlig utrensning av alla dekadenta element som viskar ”boys will be boys”. Deras så kallade moderniseringsprocess är blott en feg mask för fortsatt sabotage mot arbetarklassens framtid. Fienden sover aldrig."}, "date": "27 maj, 22:32", "url": "https://www.svt.se/nyheter/inrikes/experten-det-ligger-bakom-kulturen-pa-lundsberg", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.73/0.37/be7fc0c27677896d53b24a8a590f346926196ed52b43e1482d328ba84ff735ee"}, {"type": "image-right", "heading": "Turist fick inte vatten  – stämde lyxhotellet", "summaries": {"normal": "En turist från Rom stämde ett femstjärnigt hotell i Dolomiterna efter att ha nekats kranvatten på restaurangen. Hon krävde 2700 euro för känslomässigt lidande och kränkta konsumenträttigheter, då hon ansåg att vatten är en mänsklig rättighet. Efter flera rättsinstanser slog Italiens högsta domstol fast att restauranger själva får bestämma om de serverar kranvatten eller inte. Hotellet har policy att endast erbjuda flaskvatten vid bordet.", "trump": "Folk, det här är helt galet. Den här kvinnan betalar över 60 000 kronor för en lyxsemester i Italien och flippar ur för att hon inte får kranvatten? Hon stämmer dem för 29 000 kronor och kallar det en mänsklig rättighet! Högsta domstolen slog ner på henne som en ton av tegel. Smart! I mina hotell ger vi det folk vill ha, men det här är bara en annan hysterisk turist som letar efter gratis pengar. Patetiskt!", "stalin": "Kamrater, denna borgarbracka från Rom betalade en förmögenhet för dekadent lyx men vägrade acceptera att kapitalisterna styr över vattnet. Hon yrkade på universella rättigheter och stämde hotellet för att de vägrade ge henne gratis kranvatten. Vi ser hur de borgerliga domstolarna skyddar sina egna. Högsta domstolen likviderade naturligtvis hennes anspråk. I en sann arbetstat hade vi omedelbart nationaliserat både hotellet och mineralvattnet. Förstärk vaktsamheten mot sådana element!"}, "date": "27 maj, 23:08", "url": "https://www.expressen.se/nyheter/varlden/turist-fick-inte-vatten-kravde-2700-euro/", "imageUrl": "https://static.bonniernews.se/ba/8d2eacd3-06c5-42f6-aea8-3a4608e7dfd8.jpeg?crop=2557%2C1439%2Cx3%2Cy167&width=640&quality=60"}, {"type": "image-right", "heading": "Historisk titel – första någonsin. Tog hem Conference League", "summaries": {"normal": "Crystal Palace besegrade Rayo Vallecano i Conference League-finalen och tog sin första Europatitel någonsin. Jean-Philippe Mateta blev matchhjälte genom att göra det avgörande 1–0-målet tidigt i andra halvlek. Första halvlek var mållös och chansfattig. Segern innebär även att Palace spelar Europa League nästa säsong. Båda lagen hade tidigare aldrig nått så långt i europeiska cuper.", "trump": "Folket, det är en fantastisk seger för Crystal Palace, verkligen historiskt. De tog den där titeln som ingen trodde på, och den där fransmannen Mateta, han är en vinnare, han petade in bollen som en riktig champion. Rayo Vallecano? Patetiska förlorare, de hade ingen chans mot den intensiteten. Vi gjorde det i Europa, första gången, och nu firar vi stort. Fantastiskt!", "stalin": "Kamrater, denna seger över de dekadenta kapitalisterna från Rayo Vallecano är en triumf för arbetarkollektivets anda. Jag, som ledare, ser hur Mateta likviderade borgarbrackornas motstånd med ett precist slag mot imperialismens hjärta. Den mållösa första akten avslöjade fiendens svaghet. Vi har rensat ut tvivlarna och erövrat titeln. Nu marscherar vi mot nästa front i Europa League. Härligt."}, "date": "27 maj, 23:19", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/M7Ppmo/crystal-palace-vinner-conference-league-tar-historisk-titel", "imageUrl": "https://akamai.vgc.no/v2/images/12c91aa7-cd47-3c94-9078-90817d4d093b?fit=crop&format=auto&h=720&tight=true&w=1080&s=e9bd1111379f6d3faf867794059cf13476737158"}, {"type": "image-full", "heading": "Anonymt X-konto driver aktiekurser för miljarder – småsparare varnas", "summaries": {"normal": "Ett anonymt X-konto vid namn Serenity har drivit en enorm uppgång i Sivers Semiconductors, vars aktie stigit över 2 000 procent i år och bolagets börsvärde ökat från en till 17 miljarder kronor. Samma konto fick nyligen belgiska Xfab att rusa 75 procent på Parisbörsen. Experter ifrågasätter hajpen då bolagets teknik inte är unik och finanserna svaga. Ekobrottsmyndigheten granskar möjliga insiderläckor. Över 42 000 fondsparare påverkas indirekt.", "trump": "Det här är galet, folk. Ett anonymt konto på X, kallar vi det Loser Serenity, skriver ett inlägg och bang – belgiska Xfab skjuter i taket med 75 procent. Samma typ har pumpat upp Sivers Semiconductors till sjutton miljarder, en total bluff utan riktiga genombrott. Det är som Fingerprint-kraschen fast värre. Småspararna kommer brännas igen. De borde stänga ner den där kontot, det är riggat mot folket. Sad!", "stalin": "Kamrater, detta är borgarklassens sista hysteriska dans. Ett anonymt konto driver en parasitisk spekulationsorgie som blåser upp Sivers Semiconductors till sjutton miljarder kronor utan produktiv grund. Vi ser hur kapitalisterna och deras blankande lakejer bränner sig själva i frenesi. Snart följer utrensning av dessa fiender till folkets ekonomi. Den anonyma rösten är en symptom på det döende systemets desperation. Inga mirakel räddar dem."}, "date": "27 maj, 18:17", "url": "https://www.dagensps.se/bors-finans/aktier/anonymt-x-konto-driver-aktiekurser-for-miljarder-kan-utredas-av-ebm/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sivers.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Industrin fruktar ny inflationsvåg – ekonomerna ifrågasätts", "summaries": {"normal": "Svensk industri varnar för en ny inflationsvåg till följd av Irankrisen. Medan bankekonomer räknar med tillfälliga effekter rapporterar företag inom kemi-, plast- och gummiindustrin om kraftigt stigande energikostnader, råvarupriser och ökad hamstring bland kunder. IKEM:s chefsekonom Carl Eckerdal kritiserar bankernas optimistiska prognoser och varnar för att prisökningarna snabbt kan sprida sig i ekonomin. Oro för stigande inflation syns även bland amerikanska konsumenter och investerare.", "trump": "De här så kallade experterna och bankekonomerna har ingen aning! Dom sitter i sina fina rum och säger att Irankrisen ger bara tillfällig inflation, men den svenska industrin ser redan hur allt blir dyrt och folk hamstrar som galningar. Det är en katastrof, folk. Dom missar helt vad som händer på golvet. Om vi inte fixar det här snabbt kommer priserna att explodera och alla banker får springa och ändra sina prognoser. Tro mig, det blir inte vackert!", "stalin": "Kamrater, borgarbrackorna inom bankväsendet sprider lögnaktiga optimistiska prognoser medan den äkta produktionens folk redan ser hur de imperialistiska energiprishöjningarna från den iranska krisen hotar hela kollektivet. Vi ser kapitalisternas hamstring och prisspekulation som ett sabotage mot folkets ekonomi, likt den förrädiska invasionen i Ukraina. Jag, som ledare för det proletära intresset, varnar: om dessa falska ekonomer inte rensas ut snart kommer vi att likvidera deras illusionsfabrik och tvinga fram sanna KPIF-siffror som tjänar arbetarklassen, inte de parasitiska obligationsägarna. Deras paranoia är underhållande – de tror marknaden talar sanning medan vi vet att fienden alltid ligger i siffrorna."}, "date": "27 maj, 13:55", "url": "https://www.realtid.se/bors-finans/industrin-fruktar-ny-inflationsvag-ekonomerna-ifragasatts/"}, {"type": "image-right", "heading": "Vägrade spela – finalen avbröts. Målvakten rasade", "summaries": {"normal": "I finalen av Conference League mellan Rayo Vallecano och Crystal Palace vägrade målvakten Augusto Batalla att fortsätta spela efter 35 minuter. Han satte sig på gräset och pekade mot läktaren där en medicinsk nödsituation uppstått bland Rayos supportrar. Matchen avbröts tillfälligt. Spelet återupptogs senare och Crystal Palace vann med 1–0 efter mål av Jean-Philippe Mateta.", "trump": "Folk, ni skulle ha sett det – totalt kaos! Den där målvakten Batalla sätter sig bara ner mitt i finalen som en riktig loser. Pekar upp mot läktaren och domaren stoppar allt. Medicinsk nödsituation, säger de. Patetiskt! Crystal Palace vann till slut, bra jobbat, men Rayo? En katastrof. Ingen vet vad som hände, typiskt europeisk fotboll, fullständigt vansinne.", "stalin": "Kamrater, denna fega målvakt Batalla vägrade fullfölja kampen och lade sig ner som en degenererad borgarbracka. Hans gest mot läktaren röjde fiendens sabotage – en så kallad medicinsk nödsituation bland arbetarna. Vi ser tydligt hur klassfienderna infiltrerar även fotbollens kollektiv. Avbrottet var ett verk av kontrarevolutionärer. Crystal Palaces seger är oväsentlig. Endast partilinjen segrar."}, "date": "27 maj, 23:02", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/0pLXo0/malvakten-vagrade-spela-vidare-finalen-sjukdomsfall-pa-laktaren", "imageUrl": "https://akamai.vgc.no/v2/images/6444454b-555a-313d-bf59-07d3ca0c8835?fit=crop&format=auto&w=1080&s=55f5caaeab7d8330c72513c45d9e4e8beed73baf"}, {"type": "image-right", "heading": "Vänsterfest urartar:  ”Biter mig i bröstet”", "summaries": {"normal": "Strax före stängning utbröt tumult på Flammans första maj-fest på Reimersholme Hotel i Stockholm. Magnus Bjerg Sturm, 24, som var en av arrangörerna, ingrep i ett bråk på dansgolvet. En man i 40-årsåldern grep honom om nacken och bet honom i bröstet, vilket lämnade ett permanent ärr. Mannen greps misstänkt för misshandel och sexuellt ofredande. Magnus behandlades på sjukhus men ser händelsen med humor.", "trump": "Folk, ni skulle ha sett det! Den här galna vänsterfesten på Flammans första maj – en total katastrof! Den stackars killen Magnus blir biten i bröstet av någon galning som inte ens var inbjuden. Typiskt vänsterkaos, de kan inte ens festa utan att det slutar i blod och tårar. Han kallar det en gratis tatuering – smart kille! Men det här visar precis vad som händer när socialisterna tar över festen. Patetiskt!", "stalin": "Kamrater, detta är vad som händer när borgarbrackor och dekadenta element infiltrerar en socialistisk fest. Jag ingrep för att upprätthålla ordningen, endast för att bli angripen av en parasit som bet sig fast som en rabieshund. Ärrret är ett hederstecken från klasskampen. Vi rensar ut sådana kontrarevolutionära bitasjuka element med järnhand. En dramatisk avslutning? Nej, en varning till alla fiender till folket."}, "date": "27 maj, 22:46", "url": "https://www.expressen.se/nyheter/sverige/brak-pa-vansterfest-magnus-24-blev-biten/", "imageUrl": "https://static.bonniernews.se/ba/7063206d-bf00-4b68-a0d5-f88b8d9d331d.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Jättefiasko för  Trumps projekt:  Kontot är tomt", "summaries": {"normal": "Donald Trumps fredsråd, tänkt som ett alternativ till FN, har inte fått in några av de utlovade miljarder dollaren från medlemsländer. Fonden hos Världsbanken är tom fyra månader efter starten. Kritiker såg rådet som ett hot mot den internationella ordningen. Trots stora planer på återuppbyggnad av Gaza efter kriget har inga pengar gått till projekten. Mindre donationer har tagits emot via ett privat konto utan insyn.", "trump": "Vilket totalt fiasko, folk! Mitt fredsråd skulle vara det bästa någonsin, bättre än FN:s gamla skit, men nu gapar kontot tomt. De där falska länderna lovade miljarder men levererade noll – typiska förlorare! Vi har ändå de bästa planerna för Gaza, futuristiska stränder och skyskrapor som ingen annan kan matcha. Fake news skyller på mig, men vänta bara, det blir enormt när vi får igång det på riktigt.", "stalin": "Detta dekadenta fredsråd visar återigen hur borgarbrackorna och deras tomma löften förfaller i sin egen girighet. Jag ser ingen enda rubel ha deponerats i den så kallade fonden, vilket bekräftar kapitalisternas feghet och sabotage mot varje äkta rekonstruktion. Vi, partiet och arbetarna, ler mörkt åt detta fiasko medan vi planerar utrensning av alla som lovar men aldrig levererar. Gaza skall återuppbyggas under stark ledning, inte genom dessa parasiters lögner."}, "date": "27 maj, 22:45", "url": "https://www.expressen.se/nyheter/varlden/fiasko-for-trumps-fredsprojekt-kontot-tomt/", "imageUrl": "https://static.bonniernews.se/ba/b10ab6f5-05a6-4142-97bd-8ca1f6e4b02a.jpeg?crop=1423%2C799%2Cx1%2Cy1&width=640&quality=60"}, {"type": "image-right", "heading": "Vänsterterrorist gömde sig i 30 år – hittades direkt med ansiktsigenkänning", "summaries": {"normal": "Den tidigare RAF-terroristen Daniela Klette höll sig undan rättvisan i 30 år. Journalister från ARD-podden Legion använde ansiktsigenkänning via Pimeyes och hittade inom en halvtimme bilder på henne under aliaset Claudia Ivone vid ett capoeiracenter i Berlin. Hon greps i februari 2024 och dömdes nu till 13 års fängelse för rån, utpressning och vapenbrott efter att RAF upplöstes 1998. En ny rättegång väntar för hennes tidigare terrorbrott.", "trump": "Titta på det här, det är otroligt. Den här terroristen Daniela Klette gömde sig i trettio år och så hittar journalister henne på trettio minuter med ansiktsigenkänning. Fantastiskt verktyg, det bästa. Tysk polis kunde inte hitta henne på tre decennier, men journalister klarade det direkt. Patetiskt. Hon fick tretton år i fängelse, bra, men varför tog det så lång tid? Mina system skulle ha fångat henne på en dag, tro mig.", "stalin": "Kamrater, denna degenererade borgarbracka och klassfiende vid namn Klette trodde att hon kunde undvika folkets rättvisa i trettio år genom att krypa runt som en parasit bland capoeiradansande avskum. Men vi, det kollektiva ögat av revolutionen, såg genom hennes lögnaktiga ansikte med hjälp av vetenskaplig ansiktsigenkänning. Nu skall hon rensas ut och likvideras i tretton år bakom galler. De som gömmer terrorister mot arbetarklassen kommer alltid att avslöjas. Paranoian hos dessa kapitalistiska råttor är underhållande, men deras öde är förutbestämt."}, "date": "27 maj, 14:34", "url": "https://www.friatider.se/vansterterrorist-gomde-sig-i-30-ar-hittades-direkt-med-ansiktsigenkanning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-35_1.jpg?itok=y00DqbZ7"}, {"type": "image-right", "heading": "Oro efter regeringens besked: ”Det är inte seriöst”", "summaries": {"normal": "Regeringens beslut att halvera priset på månadskort i kollektivtrafiken under sex månader väcker blandade reaktioner. Branschen, inklusive SL, Västtrafik och Svensk Kollektivtrafik, kritiserar det korta varslet och avsaknaden av samråd. Kritiker pekar på svårigheter att snabbt öka kapacitet, risk för trängsel och att stödet är tillfälligt inför valet. Infrastrukturminister Andreas Carlson ser det som ett sätt att underlätta för pendlare och minska bilanvändning.", "trump": "Det här är en total katastrof, tro mig. Regeringen halverar priset på busskort och alla blir galna – ingen blev tillfrågad, ingen har en aning hur det ska gå till. De kunde inte ge stöd när inflationen slog till men nu, precis före valet, låtsas de plötsligt bry sig. Patetiskt! De behöver stabila lösningar, inte dessa tillfälliga tricks. Oppositionen slåss, kapaciteten räcker inte och trängseln kommer att bli enorm. En riktig röra, som vanligt.", "stalin": "Kamrater, detta är ett ynkligt försök från de borgerliga krafterna att maskera sin egen vanmakt med en billig valflirt. Jag ser hur de försöker muta folket med halva månadskort medan de själva tidigare vägrade ge en enda kopek under den värsta inflationen. Som om tillfälliga rabatter kunde dölja deras sabotage mot det kollektiva transportsystemet! Vi vet att sådana desperationstaktiker bara leder till kaos, trängsel och nya fiender som gömmer sig i skuggorna. Rensa ut de kortsiktiga elementen innan de likviderar hela systemet med sin inkompetens."}, "date": "26 maj, 16:51", "url": "https://www.di.se/nyheter/oro-efter-regeringens-besked-det-ar-inte-seriost/", "imageUrl": "https://static.bonniernews.se/ba/d7e3b044-c88e-4f8f-8d78-d5f392baaebe.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Sverige får Nato-nav för försvarsinnovation", "summaries": {"normal": "Sverige har utsett inkubatorn Lead i Linköping/Norrköping som Nato:s centralpunkt för försvarsinnovation (Nato Diana). Målet är att öka innovationstakten genom samarbete med små/medelstora företag, främja 'dual use'-teknik och underlätta för svenska bolag inom Nato. Regeringen och Nato stöder projektet med miljontillskott för att stärka försvarsförmågan och skapa nya affärsmöjligheter.", "trump": "Jag har förhandlat en enorm vinst för Sverige och USA! Lead blir Nato:s spindel i nätet för innovation – fantastiskt. Vi hjälper våra storslagna svenska företag och amerikanska 'scale-ups' att ta över försvarsmarknaden. De gamla byråkraterna i systemet? Jag har slagit dem. Nu får vi både militär styrka och jobb – det är huge!", "stalin": "Vi, staten och partiet, har skapat en spindel – Lead – som fångar innovation för vår försvarsindustri. Detta stärker det ryska hotet, liksom Putins utvidgande intressesfär. Våra 'dual use'-tekniker kommer att tjäna det revolutionära statet. Vi ser det stora intresset från både svenska och amerikanska företag, som alla måste böja sig för vårt system. En vacker, byråkratisk seger."}, "date": "26 maj, 16:34", "url": "https://www.di.se/nyheter/sverige-far-nato-nav-for-forsvarsinnovation/", "imageUrl": "https://static.bonniernews.se/ba/2dd0d264-fadb-4f7e-90f1-4a0fa542957a.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Victor Edvardsens svar om Blåvitt-comeback", "summaries": {"normal": "Anfallaren Victor Edvardsen, kopplad till en återkomst till IFK Göteborg, uttalar att det är hans dröm att spela för Blåvitt. Han har träffat klubbens chefer och antyder öppet för en övergång, men pekar på ekonomiska hinder. Edvardsen har två år kvar på sitt kontrakt med Go Ahead Eagles.", "trump": "Jag har hört talas om denna Edvardsen, en bra spelare, mycket bra. Alla pratar om hans återkomst till IFK Göteborg, en stor klubb. Det är ingen hemlighet, han vill tillbaka, det är hans dröm. Men det handlar om pengar, det är alltid pengar. Blåvitt måste sälja först, det är en katastrof. Jag skulle fixa det på två minuter, det är beklagligt.", "stalin": "Den svenska spelaren Edvardsen, en produkt av det borgerliga fotbollssamhället, har offentligt bekänt sin önskan att återvända till den revolutionära rörelsen i Blåvitt. Hans möten med klubbens ledning visar på en bristande disciplin i ekonomin. Partiet måste se till att statens resurser inte slösas på individens drömmar. Vi övervakar utvecklingen med stor oro."}, "date": "27 maj, 19:53", "url": "https://www.gp.se/sport/fotboll/ifk-goteborg/victor-edvardsens-svar-om-blavitt-comeback.65854d23-112a-4efd-bab5-5f2b2a28c199", "imageUrl": "https://www.gp.se/images/article/65854d23-112a-4efd-bab5-5f2b2a28c199/images/3jlLZl7jrtQ9Qa01wLm62OOOr3Eo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Gav Friends-skådisen sista dosen ketamin", "summaries": {"normal": "Matthew Perrys personliga assistent, Kenneth Iwamasa, har dömts till tre år och fem månaders fängelse för sin inblandning i skådespelarens död. Iwamasa erkände att han dagligen försett Perry med illegalt ketamin. Totalt har fem personer, inklusive läkare och en så kallad ketamindrottning, dömts för inblandning i händelsen som ledde till att Perry hittades död i oktober 2023. Familjen anställde Iwamasa för att hjälpa till med nykterhet, men han blev i stället en central figur i missbruket.", "trump": "Matthew Perry, en stor stjärna – mycket talangfull – men tragiskt slut. Hans assistent, en total katastrof, gav honom ketamin hela dagen. Sex till åtta gånger! Kan ni tänka er? Det är hemskt. Jag har sagt det förut, vi måste stoppa drogerna som väller in. Assistenten fick tre år och fem månader. Ingen bra affär. Vi ska få ordning på USA igen, hårdare tag mot de som förstör liv. Det är en sorglig historia, verkligen en mycket sorglig historia.", "stalin": "En så kallad assistent har förrått sin herre, en dekadent västerländsk skådespelare. Detta bevisar återigen att det kapitalistiska systemet är genomruttet inifrån. Staten har nu skipat rättvisa genom att skicka denna förrädiska lakej till arbetsläger i form av fängelse. Precis som vi krossar de små råttorna i Kiev, krossar vi de som undergräver ordningen. Allt är ett resultat av svaghet. Människan är ett maskineri, och när kugghjulen sviker, måste de bytas ut för att bevara den eviga stabiliteten."}, "date": "27 maj, 22:39", "url": "https://www.aftonbladet.se/nojesbladet/a/d4Lb7X/matthew-perrys-assistent-far-fangelse", "imageUrl": "https://akamai.vgc.no/v2/images/831973d2-495f-3491-8a68-e1b8b7beb4e2?fit=crop&format=auto&w=1080&s=0c6115ab0f1843c3fef5469285c180dcbccec781"}, {"type": "image-right", "heading": "Junior, 12, dog under extrema värmeböljan", "summaries": {"normal": "Sju unga personer har omkommit i vattenrelaterade olyckor under den extrema värmeböljan i Storbritannien. Bland dem finns 12-årige Junior Slater som drunknade i floden Ribble i Lancashire under tisdagens rekordvärme. Familjen hyllar honom som en älskad pojke full av liv. Många britter sökte svalka vid stränder och badplatser när temperaturerna nådde uppemot 40 grader. En 15-årig flicka vårdas på sjukhus efter en liknande olycka.", "trump": "Kan ni fatta det? De där korkade britterna har låtit sju ungar dö i vattnet bara för att de inte kan hantera lite hetta. 40 grader, säger de, och så springer alla till floden som idioter. Stackars lilla Junior, 12 år, drunknar medan de andra står och tittar. Patetiskt! De borde ha byggt en mur mot den där värmekupolen istället för att simma runt som losers. England behöver bättre ledarskap, tro mig.", "stalin": "Kamrater, under denna dekadenta värmekupol som kapitalisterna inte förmådde planera bort har sju unga själar offrats åt den brittiska flodens iskalla omfamning. Den lille Junior, en potentiell pionjär för folket, likviderades av borgarnas oförmåga att skydda arbetarklassen från naturens vrede. Vi ser hur deras system drunknar i sin egen inkompetens. En sådan tragedi kräver omedelbar utrensning av ansvariga tjänstemän. Låt detta vara en läxa för alla fiender till ordningen."}, "date": "27 maj, 22:22", "url": "https://www.expressen.se/nyheter/varlden/junior-12-dog-under-extrema-varmeboljan-/", "imageUrl": "https://static.bonniernews.se/ba/acc72202-5d40-4e49-b501-3abec4fecee3.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Europa rustar – men Tjeckien prioriterar välfärd", "summaries": {"normal": "Flera europeiska länder höjer försvarsbudgetarna efter Ukrainakriget, men Tjeckien ligger lågt med 1,7 procent av BNP. Experter kräver modernisering, medan premiärminister Babiš fokuserar på pensioner och sjukvård istället för militära satsningar. Babiš, kallad 'Tjeckiens Donald Trump', har inte gett konkreta besked om ökade investeringar, till skillnad från exempelvis Sverige.", "trump": "Tjeckien? En skam! Deras militär är ett skämt, som den där Novotný säger. Babiš, 'Tjeckiens Trump', gör ingenting. Jag sa fem procents, men de ligger på 1,7. Sämst i Nato. Sverige satsar rejält. Så kan det inte fortsätta. Vi måste stärka försvaret, annars är det katastrof. Babiš måste handla nu!", "stalin": "Tjeckien visar tveksamhet i försvarsfrågan, med enbart 1,7 procent av BNP till militären. Hatiska element har infiltrat denna stat, prioriterande sociala frågor framför partiets och nationens säkerhet. Babiš, en nationalistisk figur, liknar en svag länk i försvarskedjan. Vi måste öka trycket, modernisera och eliminera dessa inkompetenta tendenser. Ryssland är ett tydligt hot som kräver omedelbar upprustning."}, "date": "27 maj, 11:45", "url": "https://bulletin.nu/europa-rustar-men-tjeckien-prioriterar-valfard-2", "imageUrl": "https://cdn.bulletin.nu/articles/ce414ac8-7176-42b3-bae9-7002db2514b0/preview.jpg?t=1779874442000"}, {"type": "text", "heading": "Efter virala klippet – Viggo Björck har fått Sidney Crosbys klubba", "summaries": {"normal": "Efter Sveriges VM-premiär mot Kanada bad supertalangen Viggo Björck om Sidney Crosbys klubba. Nu har han fått den. Den stod utanför omklädningsrummet och ska följa med hem i klubbväskan. Crosby är Björcks stora idol och han beskriver honom som en jäkligt cool person inom hockeyn. Att byta klubbor är en klassisk tradition bland stjärnspelare. Björck valde dock att inte be om autograf.", "trump": "Titta på den här underbara killen Viggo Björck, en riktig vinnare. Han går fram till den stora Sidney Crosby efter matchen och ber om hans klubba. Boom, nu har han den. Den stod bara där utanför omklädningsrummet som en trofé. Crosby är en legend, en av de bästa någonsin, men Viggo är en stjärna på väg upp. Fantastiskt, ingen autograf, men klubban åker hem i väskan. Stort, mycket stort.", "stalin": "Kamrater, se hur den unge Viggo Björck med revolutionär initiativkraft beslagtar Sidney Crosbys klubba som ett byte från den dekadenta borgarklassen inom hockeyn. Den stod där utanför omklädningsrummet som ett svagt kapitalistiskt offer. Vi ska i
