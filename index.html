iet istället borde lägga ner sin kampanj och uppmana sina väljare att rösta på Moderaterna. Hoppet om taktiska röster ses som desperat och riskerar att slösa bort hundratusentals borgerliga röster utan att hindra Magdalena Andersson från att bli statsminister.", "trump": "Lyssnar ni på de här Liberalerna? Patetiska! De tigger om stödröster som förlorare. Om de verkligen ville vinna skulle de ställa upp för de riktiga vinnarna, Moderaterna, och ge dem alla sina röster. Istället kastar de bort hundratusentals röster. Totalt misslyckande. Sad! Jag skulle aldrig tigga, jag vinner alltid stort.", "stalin": "Dessa liberala borgarbrackor vädjar om stödröster som ynkliga opportunister medan arbetarklassen skrattar. Jag skulle likvidera hela deras kampanj och beordra de 130 000 att rösta på de verkligt starka krafterna. Deras desperata önskan att klamra sig fast vid makten är en komisk föreställning som bara leder till utrensning ur historien. Kamrater, se och lär!"}, "date": "24 augusti, 07:01", "url": "https://arbetet.se/2026/08/24/simona-mohamsson-gor-bast-i-att-kasta-in-handduken", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24065721/liberal-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Experten kritiserar regeringens skolsäkerhetspolitik: ”Quick-fix”", "summaries": {"normal": "Magnus Lindgren från Tryggare Sverige kritiserar regeringens skolsäkerhetspolitik efter svärdattacken i Fagersta där en 17-årig flicka mördades och tre pojkar skadades. Han menar att fokus på fysiska åtgärder som lås och kameror är otillräckligt eftersom hotet ofta kommer inifrån skolan. Den brottsförebyggande delen av utredningen har ignorerats.", "trump": "Vilken katastrof i Sverige! De låser dörrar, sätter upp kameror och tror att det stoppar galningarna – totalt misslyckande! Det är samma woke-svaga politik som låter brottslingar springa fritt i korridorerna. Biden skulle ha älskat den här naiva quick-fix-soppan. Vi behöver styrka, inte lås och larmsystem från de korkade globalisterna. Patetiskt!", "stalin": "Återigen blottar de dekadenta borgarbrackorna sin feghet. Medan arbetets barn slaktas i korridorerna ägnar sig klassfienderna åt meningslösa lås och kameror. Jag ser den fega undanflykten, den parasitiska oviljan att rensa ut det verkliga hotet inifrån. Skolan borde vara en fästning för folket, inte en lekplats för exploaterande hyenor. Ytterligare en utrensning behövs."}, "date": "24 augusti, 09:15", "url": "https://www.tv4.se/artikel/6rOtJgHCrwHrRx9qZkEoMm/experten-kritiserar-regeringens-skolsaekerhetspolitik-quick-fix", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlyOkd1hbbw-4%2F051a1f962871402ce6895e3abcbfbc0a%2FMandagen_ar_den_forsta_skoldagen_sedan_fredagens_skoldad_i_Fagersta._Bild_fran_en_minnesplats_pa_lordagen._&width=1024"}, {"type": "image-full", "heading": "Aryam, 17, var en meter från gärningsmannen: ”Så nära döden”", "summaries": {"normal": "En 17-årig flicka dog och tre pojkar skadades, två av dem allvarligt, när en 18-årig elev attackerade med svärd på Brinellskolan i Fagersta. Aryam Al Hasan stod bara en meter från gärningsmannen och såg attacken. Hon flydde till biblioteket och låste dörren. Polisen larmades om pågående dödligt våld klockan 14.06.", "trump": "Folk, det här är fullständigt galet. En knäppis springer runt på en skola i Sverige med ett svärd som en dåre från en usel Hollywood-film och hugger oskyldiga ungar. Biden och hans galna vänsterextremister har importerat så mycket kaos att nu dör tonåringar i klassrummet. Vi behöver lag och ordning, inte era woke-skolor fulla av svaghet. Patetiskt!", "stalin": "Jag ser hur den degenererade borgarklassens samhälle ruttnar inifrån. En ung människa likvideras av en annan i en så kallad skola medan klassfiendernas liberala experiment skapar mördare. Detta är kapitalismens logiska följd, kamrater. Vi skulle ha rensat ut sådana element redan i grodden. Svaghet föder terror. Folkfienderna skrattar medan blod flyter."}, "date": "24 augusti, 09:05", "url": "https://www.tv4.se/artikel/1icwnxQQjX9nfEAnEVizAr/aryam-17-var-en-meter-fran-gaerningsmannen-sa-naera-doeden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F35sPYP6Y7DQ8nMaRWT0syX%2F05ebc43507b096da675c4a3659c917c9%2F23-aryam-sajt.jpg&width=1024"}, {"type": "image-right", "heading": "Så vill partierna knäcka arbetslös­heten", "summaries": {"normal": "Alla riksdagspartier vill sänka arbetslösheten som ligger på 8,7 procent. Högerpartierna föreslår bidragstak, lägre skatter, sänkta arbetsgivaravgifter och inträdesjobb för att göra det mer lönsamt att arbeta och anställa. Vänsterpartierna satsar istället på utbildning, offentliga investeringar, stärkt a-kassa och fler välfärdsjobb genom aktiv statlig politik.", "trump": "Titta på de här svenska förlorarna. De pratar om arbetslöshet men ingen har en aning. Jag skulle sänka skatterna massivt, göra det billigt att anställa och sparka de lata bidragstagarna. America First funkar, Sverige borde testa Winning First istället för att låta socialisterna förstöra allt. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejpartier leker med arbetslösheten som en katt med en mus. Vi ska inte lita på deras falska a-kassor eller inträdesjobb. Endast genom kollektiv utrensning av lathet, massiva offentliga investeringar och järnhård planering kan vi likvidera arbetslösheten en gång för alla. Den som vägrar arbeta är folkets fiende."}, "date": "24 augusti, 05:59", "url": "https://arbetet.se/2026/08/24/starkt-a-kassa-eller-sankta-ingangsloner-sa-vill-partierna-skapa-fler-jobb", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/21151457/sdlrxb6dvhnrzw-nh-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-right", "heading": "KD-topp vill ge upp om L", "summaries": {"normal": "KD-toppen Hans Eklind stödjer Jimmie Åkessons förslag att borgerliga väljare bör överge Liberalerna om de inte når 3,5 procent i opinionsmätningarna tio dagar före valet. Liberalerna ligger nu på 1,9 procent. Finansminister Elisabeth Svantesson (M) avvisar idén, medan före detta L-ledaren Lars Leijonborg hoppas på en 'ketchup-effekt' för partiet.", "trump": "Jag måste säga, Jimmie Åkesson har en poäng här – om Liberalerna inte når 3,5 procent, varför slösa bort sin röst? De ligger på ynka 1,9 procent! KD:s kille, Hans Eklind, håller med, smart kille. Men Elisabeth Svantesson, hon är svag på det här, hon vill inte se verkligheten. Och Leijonborg? Han pratar om 'ketchup-effekt' – kom igen, det är löjligt! Folk vill se vinnare, inte förlorare!", "stalin": "Kamrater! En liten borgerlig fraktion, kallad Liberalerna, klamrar sig desperat vid maktens skuggor. Deras stöd smälter som snö i vårsolen – 1,9 procent, en siffra som skriker efter utrensning. Jimmie Åkesson, en man med klarsynthet, föreslår en gräns: 3,5 procent eller förintelse. Vi applåderar! KD:s Hans Eklind ser sanningen – varför slösa resurser på svaga länkar? Medan Svantesson och Leijonborg, dessa förvirrade byråkrater, pratar om 'funktioner' och 'ketchup-effekter'. Skrattretande! Historien visar: svaghet belönas inte. Vi föreslår en ny Tidö-pakt – utan liberala parasiter!"}, "date": "24 augusti, 07:52", "url": "https://kvartal.se/nyheter/artiklar/kd-topp-vill-ge-upp-om-l/cG9zdDoxNzI2MjY", "imageUrl": "https://images.kvartal.se/2026/08/b6721d82-sdlmheewto1un0_normalpreview.webp"}, {"type": "image-right", "heading": "Marmorstein: Partierna har blivit ”fartblinda”", "summaries": {"normal": "SVT:s kommentator Elisabeth Marmorstein kritiserar riksdagspartiernas ekonomiska vallöften för otydlig finansiering, särskilt Socialdemokraternas och Moderaternas. Hon menar partierna blivit 'fartblinda' av statliga miljardsatsningar och varnar för tuffare prioriteringar framöver. Väljarnas intresse för ekonomiska löften kan ha minskat sedan energikrisen 2022.", "trump": "Jag tittade på de där svenska politikerna på SVT – helt galet! De lovar miljarder, men ingen vet var pengarna ska komma ifrån. 'Skissartade' kallar de det – jag kallar det inkompetens! Sverige har blivit bortskämt med lånepengar, men nu är festen över. Folk bryr sig inte längre, för de är för upptagna med att njuta av sitt 'icke-kris'-liv. Svagt, mycket svagt!", "stalin": "De borgerliga och socialdemokratiska lakejerna i Sveriges riksdag tror att folket är idioter! De slänger ut löften som tomma skalbaggar kastar ägg – utan substans, utan plan. Vi vet hur sådana lekar slutar: med hunger och revolution! Men oroa er inte, kamrater – när deras ekonomiska hus faller samman, står Sovjetunionens arvingar redo att visa vägen. Eller åtminstone Putin."}, "date": "24 augusti, 07:49", "url": "https://kvartal.se/nyheter/artiklar/marmorstein-partierna-har-blivit-fartblinda/cG9zdDoxNzI2MjM", "imageUrl": "https://images.kvartal.se/2026/08/026dd1c1-sdltjq_9f2ssjk_normalpreview.webp"}, {"type": "image-right", "heading": "Dödliga anfall när Ukraina firar självständighet", "summaries": {"normal": "Europeiska ledare samlas i Kiev för att fira Ukrainas självständighetsdag samtidigt som ryska attacker dödat minst tre personer i Charkiv. Ukraina har riktat drönaranfall mot e-handelsjätten Ozons logistikcenter i Ryssland, vilket orsakat omfattande skador. Sverige betonar sitt orubbliga stöd för Ukrainas suveränitet.", "trump": "Titta på de där patetiska europeiska förlorarna som springer till Kiev för att fira medan bomberna regnar. Zelenskyy ber om mer pengar och jag gav honom inget – Biden däremot tömde hela kassan. Nu bombar de ryska Amazon-lager, smart drag! Vi skulle ha avslutat det här kriget på en vecka, folks.", "stalin": "Kamrater, se hur de dekadenta imperialisterna samlas som skrämda råttor i Kiev medan arbetarklassen lider. Jag ler från historien åt dessa profitthungriga blodsugare som hyllar falsk suveränitet. Rysslands järnhand krossar hinder i sin intressesfär. Inga klassfiender undkommer rättvisan, inte ens i e-handelns lager."}, "date": "24 augusti, 08:43", "url": "https://www.tv4.se/artikel/tt-260824-ukrainaoro1-1c456ccf/dodliga-anfall-nar-ukraina-firar-sjalvstandighet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlB0LDlSXipBQ%2F0a3146ad1e291dd76aa3b8ee153b5c1a%2FUkraines_president_Volodymyr_Zelenskyj_valkomnar_Finlands_president_Alexander_Stubb_till_Kiev_pa_sondagen.&width=120"}, {"type": "image-right", "heading": "USA skickar utvisade till tredjeland – Liberia ska ta emot upp till 1 200", "summaries": {"normal": "USA har ingått ett avtal med Liberia om att ta emot upp till 1 200 utvisade migranter från tredje land. De första 20 anlände till Monrovia i torsdags. USA betalade fem miljoner dollar och lovar ytterligare bistånd samt längre visum för liberianer. Trumpadministrationen har liknande avtal med över 35 länder, bland annat Centralafrikanska republiken.", "trump": "Vi gör det ingen annan vågar. Jag har skickat de värsta ut till Liberia, och de tackar oss med öppna armar. Fem miljoner dollar? Enkelt. De borde betala oss! Fantastiskt avtal, bättre än alla tidigare. Amerika först, och nu tar vi hand om problemen ordentligt. Ingen mer gratisåkning.", "stalin": "Kamrater, jag har sett hur de dekadenta imperialisterna i Washington likviderar sina egna problem genom att dumpa dem på svaga stater som Liberia. Vi ler åt deras paranoia. Fem miljoner dollar för att skapa nya fiender åt sig själva – en utmärkt utrensning av samhällets avskum. Det folkfientliga västregimen fortsätter att gräva sin egen grav med byråkratisk precision."}, "date": "24 augusti, 08:26", "url": "https://riks.se/nyheter/usa-skickar-utvisade-till-tredjeland-liberia-ska-ta-emot-upp-till-1-200", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_24_T082235_203_3bfc29578b.jpg"}, {"type": "image-right", "heading": "Idag visar klimatrörelsen att den aldrig ger upp", "summaries": {"normal": "Ledaren Andreas Gustavsson i Dagens ETC argumenterar för att klimatrörelsen inte är död utan fortsätter att växa. Han kritiserar mediernas passivitet och fossila annonsörer samt pekar ut Sverigedemokraterna som ett hinder. Han förutspår en stor klimatdemonstration i Stockholm och betonar att politiken måste ta klimatkrisen på allvar som en existentiell utmaning.", "trump": "Vilken patetisk propaganda från dessa gröna hysteriker! De har förlorat fyra år till att hålla SD nöjda, men nu ska de demonstrera? Patetiskt. Klimatkrisen är en bluff som de fossila typerna och jag genomskådade direkt. Dessa doomsday-kids och deras vänsterjournalister borde istället fixa riktiga jobb istället för att gnälla om existentiella utmaningar. Sad!", "stalin": "Jag ser hur klassfienderna och profitthungriga blodsugare inom borgarpressen försöker bevara sin makt genom att tysta klimatrörelsen. Men folket ger aldrig upp. Dessa folkförtryckande medier som tuggar fossila annonsörers ben är förrädare mot mänskligheten. En mäktig utrensning av kapitalistlakejer behövs. Demonstrationen blir en varning till alla som vägrar se den existentiella kampen."}, "date": "23 augusti, 08:00", "url": "https://www.etc.se/ledare/idag-visar-klimatroerelsen-att-den-aldrig-ger-upp", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Debatt: Reversera migrationsexperimentet", "summaries": {"normal": "Debattör med utlandsfödd förälder vill kraftigt minska invandringen och vända migrationsexperimentet. Han menar att Sverige förändrats radikalt och tryggheten försvunnit. Han efterlyser minskat antal invånare och att många bör återvända hem. Fokus på kulturkrock och integrationens misslyckande.", "trump": "Jag älskar Sverige, fantastiskt land! Men de har ett problem — för många människor från fel ställen, en katastrof! Jag skulle fixa det, stänga gränserna, skicka hem dem. Gör Sverige tryggt igen, som Bullerby. Det är enkelt, men de lyssnar inte på mig. Patetiskt!", "stalin": "Kamrater, detta experiment med mångfald är kontrarevolutionärt. Vi måste rensa ut de som inte anpassar sig — kultursabotörerna och historielösarna. Alla som inte nynnar på Astrid Lindgren eller äger en Volvo ska omutbildas. Annars är fienden avlägsnad. För Sveriges renhet!"}, "date": "24 augusti, 11:12", "url": "https://bulletin.nu/debatt-reversera-migrationsexperimentet", "imageUrl": "https://cdn.bulletin.nu/articles/eec45e6c-4c0b-4ff1-a5fa-2c8954600b70/preview.jpg?t=1787562767000"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-right", "heading": "Sandström: Lyssna på Lind och Wykman – inte Google", "summaries": {"normal": "Techjättars datacenter i Norrland kan sluka el motsvarande två kärnkraftsreaktorer medan lokala jobben uteblir. Christian Sandström varnar för att låga elpriser reas ut. Amanda Lind och Niklas Wykman kräver nationell plan – Google måste dela med sig av elnotan.", "trump": "Jag hör att Sverige säljer sin fina el till Google för nästan ingenting! Det är en katastrof! Jag skulle förhandlat som en mästare – fått massor av jobb, inte bara 56 anställda för miljarder. Sverige, bli smarta! Lyssna på mig, inte på några liberaler!", "stalin": "Kamrater, dessa datacenter i Norrland är en borgerlig konspiration! De slukar el som vore den vatten, men ger endast 500 parasiter till jobb. Vi måste rensa ut techbolagens giriga planer – elen tillhör folket, inte Google! Partiets plan ska råda, punkt."}, "date": "23 augusti, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-lyssna-pa-lind-och-wykman-inte-google", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-37-400x267.jpg"}, {"type": "image-right", "heading": "Debatt: När blev Palmes mänskliga rättigheter ett problem för Socialdemokraterna?", "summaries": {"normal": "Socialdemokraterna vill nu förbjuda konfessionella friskolor. Ironiskt nog var det Erlander, Palme och Carlsson som en gång band Sverige till konventioner som skyddar just religionsfrihet och föräldrars rätt att välja skola. Partiets kovändning är total – och frågan är varför.", "trump": "Hörni, Socialdemokraterna i Sverige vill förbjuda religiösa skolor! Vilket skämt! Deras egna storheter Palme och Erlander skrev under konventioner som skyddar dem. De har tappat det helt. Jag hade aldrig gjort så – jag är den största försvararen av frihet!", "stalin": "Kamrater, dessa liberalister vill förbjuda konfessionella skolor. Men våra egna beslut under Erlander, Palme och Carlsson godkände redan föräldrars rättigheter. Att ändra sig nu är förräderi. Vi måste rensa ut sådana oberäkneliga element som inte kan följa partilinjen."}, "date": "24 augusti, 10:55", "url": "https://bulletin.nu/debatt-nar-blev-palmes-manskliga-rattigheter-ett-problem-for-socialdemokraterna", "imageUrl": "https://cdn.bulletin.nu/articles/19447083-aa58-4165-b71c-699d8b7821c2/preview.jpg?t=1787561744000"}, {"type": "image-full", "heading": "Samsung stoppar köp i dessa mobiler – från 25 augusti", "summaries": {"normal": "Samsung slutar stödja sin betaltjänst Samsung Checkout på mobiler och surfplattor som kör Android 4.x eller äldre från och med 25 augusti. Berörda användare kan inte längre genomföra köp i Galaxy Store eller via appar. Lösningen är att uppdatera till Android 5.0 eller senare. De allra flesta användare påverkas inte då enheterna är över tio år gamla.", "trump": "De säger att Samsung nu stänger ute de gamla telefonerna från sina betalningar. Android 4? Det är uråldrigt, folk. Precis som Bidens ekonomi. Uppdatera mobilen eller glöm det! De gamla Samsungarna blir plötsligt värdelösa. Patetiskt. Mina telefoner är alltid de bästa, de senaste, tro mig. Samsung borde ha fixat det här mycket tidigare.", "stalin": "Från och med den 25 augusti likviderar vi de föråldrade enheternas möjlighet att utföra kapitalistiska transaktioner via Samsung Checkout. De som klamrar sig fast vid Android 4.x, dessa dekadenta reliker från borgarklassens tidigare era, skall mötas av ett meddelande om nödvändig utrensning av sin mjukvara. Endast de som lyder och uppgraderar till Android 5.0 får fortsätta leva i kollektivets betalningssystem. De övriga får ruttna i sin analoga irrelevans."}, "date": "24 augusti, 11:04", "url": "https://nyheter24.se/nyheter/teknik/1507232-samsung-stoppar-kop-i-dessa-mobiler-fran-25-augusti", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/0081ebef04b004a30200000000b004a302/2026/08/24/2386184/samsungmobilkop.jpg"}, {"type": "image-right", "heading": "Första patienten fick genterapi mot typ 1-diabetes", "summaries": {"normal": "Första patienten har fått genförändrade celler mot typ 1-diabetes utan immundämpande medicin. Cellerna producerar insulin och undviker immunförsvaret. Ett steg mot bot – och en seger för forskningen som tröttnat på att ständigt byta sprutor.", "trump": "Jag har de bästa generna, alla säger det. Nu får en patient genförändrade celler – otroligt! Inga immunhämmande tabletter, de lurar kroppen. Kanske jag fixar diabetes helt? Vi gör Amerika (och världen) frisk igen!", "stalin": "Kamrater, vår utrensning av insulinbristen har börjat. En patient har fått genförändrade celler – de producerar insulin utan att behöva immunhämmande partikorruption. De som saboterade bukspottkörteln ska rensas ut. Vi botar diabetes med planekonomi!"}, "date": "24 augusti, 10:44", "url": "https://samnytt.se/forsta-patienten-fick-genterapi-mot-typ-1-diabetes", "imageUrl": "https://konto.samnytt.se/wp-content/uploads/2024/05/diabetes-blodsocker-226x154.jpg"}, {"type": "image-right", "heading": "Svensk jetdrönare ska kunna slå mot luftförsvar", "summaries": {"normal": "Saab har visat en fullskalig modell av det obemannade stridsflygplanet A3-001 som på sikt ska komplettera Gripen. Drönaren är utformad för elektronisk krigföring, bekämpning av luftförsvar och precisionsangrepp i riskfyllda områden. Den kombinerar låg observerbarhet med hög autonomi. Demonstratorer planeras flyga före 2030 och ett färdigt system kan vara klart under mitten av 2030-talet.", "trump": "Vi har de bästa drönarna, folk, ingen gör det bättre än Saab, tro mig. Den här A3-001 är en fantastisk jetdrönare som slår sönder fiendens luftförsvar och gör Gripen ännu starkare. Autonomi, osynlighet, total dominans. Sverige kommer att vinna stort om de lyssnar på mig. Inga andra länder har ens en chans, det är en total game changer!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna i väst febrilt försöker bygga drönare för att dölja sin militära svaghet. Denna A3-001 är ett ynkligt försök att motverka folkets ofrånkomliga seger. Vi ska rensa ut alla sådana imperialistiska hinder med järnhand. Inget undkommer partiets vakande öga. Låt dem darra."}, "date": "23 augusti, 12:58", "url": "https://www.friatider.se/svensk-jetdronare-ska-kunna-sla-mot-luftforsvar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20260822-en-5412280-1.jpg?itok=gx9oOMhH"}, {"type": "image-right", "heading": "EU: Nytt miljardregn till Ukraina - nära 70 miljarder kronor", "summaries": {"normal": "EU-kommissionen har godkänt ett nytt miljardregn över Ukraina – 6,1 miljarder euro, alltså 67 miljarder kronor, till luftvärn och robotar. Beskedet kom passande nog på Ukrainas självständighetsdag. Med 376 ryska robotattacker i juli är luftförsvaret mer akut än någonsin. Europa visar att stödet är både orubbligt och rejält fyllt.", "trump": "Jag har sagt det hela tiden – Europa måste vakna! Nu slänger de 67 miljarder kronor till Ukraina. Det är mycket pengar, men ingen gör det bättre än jag. Ukraina kämpar som tusan, och jag applåderar det. Men kom ihåg: med mig vid rodret hade det här varit löst på en vecka. Fantastiskt!", "stalin": "Kamrater, vi noterar att kapitalisterna i EU skickar 67 miljarder av sina smutsiga euro till Ukraina. Detta är ett bevis på deras fega sabotage mot freden. Vi måste rensa ut dessa imperialistiska robotar och deras lakejer. Vårt luftförsvar ska krossa varenda en – för arbetarklassens skull. Inget stoppar vår marsch!"}, "date": "24 augusti, 10:33", "url": "https://samnytt.se/eu-nytt-miljardregn-till-ukraina-nara-70-miljarder-kronor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2025/08/17151839/Ukraina-EU.jpg"}, {"type": "image-full", "heading": "Bill Gates köper upp jordbruk – därför kan det inte hända i Sverige", "summaries": {"normal": "Miljardärer som Bill Gates köper upp enorma mängder jordbruksmark i USA som inflationsskydd, vilket trissar upp priserna och gör det svårt för unga lantbrukare. I Sverige förhindras en liknande utveckling genom jordförvärvslagen, som begränsar juridiska personers möjligheter att köpa mark. Det säkerställer att marken främst ägs och brukas av aktiva lantbrukare snarare än kapitalförvaltare.", "trump": "De rika, som Sleepy Joe’s kompis Bill Gates, köper all mark! Det är en katastrof för våra fantastiska amerikanska bönder. De blir utmanövrerade av globalister och deras miljarder. Sverige? De har smarta lagar, det måste jag ge dem. Vi behöver skydda våra bönder och vår nationella mark från dessa utländska intressen. Mitt Amerika ska ägas av folket, inte av tech-miljardärer!", "stalin": "Dessa kapitalistiska parasiter, likt Gates, ansamlar mark som om de vore tsarer medan folket svälter. De gömmer sin rikedom i jorden för att undvika folkets vrede. I Sverige visar de en svaghet för byråkratiska regler, likt de kryphål Putin utnyttjar för att expandera. Vi, staten, vet bättre: jorden tillhör kollektivet, inte dessa giriga småfåglar som försöker leka gud med våra resurser."}, "date": "24 augusti, 10:27", "url": "https://www.realtid.se/bors-finans/makro/bill-gates-koper-upp-jordbruk-darfor-kan-det-inte-handa-i-sverige", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/billgates.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Sjukhuspersonal varnar för hot och våld från kriminella klaner", "summaries": {"normal": "Berlin-sjukhus slår larm: kriminella klaner gör akuten till en krigszon. Skjutningar, knivattacker och hot från allt yngre gärningsmän tvingar personal att jobba anonymt och anpassa bemanningen. Polisavspärrningar stoppar nyinskrivningar i timmar. Personalen flyr – de flesta stannar bara fem år.", "trump": "Jag hör att tyska sjukhus är som vilda västern – klanmedlemmar kommer in med skottskador och stänger ner hela akuten! De måste ringa polisen för vissa efternamn. Patetiskt! I Amerika har vi de bästa sjukhusen, och vi håller ordning. Tyskland borde lära sig av mig!", "stalin": "Kamrater, rapporterna från Berlin visar på sabotage från antisociala klanelement. De blockerar vården, terroriserar arbetare och mobiliserar via Telegram. Vi måste rensa ut dessa förrädare – ingen ska hota sjukvårdens disciplin. Femårsplanen för akuten: ordning och reda, eller likvidering."}, "date": "24 augusti, 10:07", "url": "https://samnytt.se/sjukhuspersonal-varnar-for-hot-och-vald-fran-kriminella-klaner", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/24071714/sjukhus-dropp-silhiett.jpg"}, {"type": "image-right", "heading": "Sparf: Något om skoldådet i Fagersta – och Sverige", "summaries": {"normal": "Fagersta: en liten bruksort med stora problem. Skoldådet på Brinellskolan speglar en tudelad stad där 49 procent bor i utsatta områden. Politikernas 50-åriga experiment har skapat kaos. Misstänkte 18-åringen har LVU-bakgrund och våldsam pappa. Sverige är inte längre tryggt.", "trump": "Jag ser det här i Fagersta – totalt kaos! Polisen skriker 'Bort från parkeringen!' som i Rinkeby. 45 procent utländsk bakgrund, 70 procent på en skola. Och killen? LVU, våldsam pappa. Sverige har blivit en katastrof. Bara jag kan fixa det – bygg muren, stäng gränserna! Stort!", "stalin": "Kamrater, vi har en rapport från Fagersta. En 18-årig fiende till folket – med LVU och våldsam pappa – har attackerat vår skola. Segregationen är ett verktyg för kapitalisterna. Vi måste rensa ut dessa element, tvångsomhänderta alla missanpassade. Partiet vet bäst. Ingen nåd för avvikare!"}, "date": "24 augusti, 10:03", "url": "https://bulletin.nu/sparf-nagot-om-skoldadet-i-fagersta-och-sverige", "imageUrl": "https://cdn.bulletin.nu/articles/71fd5b60-5153-41cf-8f71-8a2a0573c86b/preview.jpg?t=1787558358000"}, {"type": "image-right", "heading": "Behöver inte facket medlemmarna längre?", "summaries": {"normal": "Artikeln ifrågasätter fackföreningarnas roll i Sverige, med fokus på den långa och förvirrande strejken mot Tesla. Författaren kritiserar IF Metall för jojo-strejk, centralisering och distans till medlemmarna. Han undrar om den svenska modellen är hotad eller om en ny, mer lokal facklig kamp kan växa fram. (58 ord)", "trump": "Lyssnar ni på det här? Facket i Sverige har blivit en total katastrof, precis som våra egna unionsbönder här hemma. Jojo-strejk mot Tesla, folk får sparken och facket sover. De har glömt medlemmarna och blivit en massa byråkrater. Den svenska modellen? Den dör om de inte vaknar. Sad! Men kanske föds en riktig rörelse nu. (59 ord)", "stalin": "Jag betraktar detta med djup misstro. Fackföreningarna har förvandlats till passiva redskap åt borgarklassen och dess lakejer inom socialdemokratin. Jojo-strejk och centralisering har kvävt den äkta arbetarkampen. Kanske är det bra att strejken förlorades. Ur askan kan en sann, lokal och revolutionär rörelse uppstå som rensar ut alla folkfiender och klassförrädare. (59 ord)"}, "date": "21 augusti, 09:19", "url": "https://proletaren.se/artikel/behover-inte-facket-medlemmarna-langre", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/teslakronika-768x432.jpg"}, {"type": "text", "heading": "Med full fart ut för stupet", "summaries": {"normal": "Artikeln kritiserar att alla riksdagspartier nu stöder Nato-medlemskap och DCA-avtalet med USA, som ger amerikanerna tillgång till 17 svenska militärbaser. Författaren menar att Sverige därmed saknar fredliga alternativ i riksdagen och har integrerats i USA:s militära struktur efter Rysslands invasion av Ukraina.", "trump": "Vilken katastrof! De svenska svaga ledarna, både de röda och de nya, har sålt ut landet till vår fantastiska Nato-maskin snabbare än Sleepy Joe kunde säga fel. Nu finns inga riktiga fredspartier kvar, bara krigspartier som älskar att spendera miljarder på baser åt oss. Patetiskt! Men hey, bra deal för Amerika.", "stalin": "Jag betraktar med djup förakt hur dessa kapitalistlakejer och folkförtryckare i sin borgerliga riksdag har kapitulerat fullständigt inför Nato-imperialismen. Inga verkliga motståndare återstår, endast krigshetsande hyenor som rullar miljarder till militären. En klassisk utrensning av alla fredsvänner har skett – typiskt för dekadenta västliga klassfiender."}, "date": "21 augusti, 08:00", "url": "https://proletaren.se/artikel/med-full-fart-ut-for-stupet"}, {"type": "image-full", "heading": "\"Ramageddon\" slår till igen: Nvidia höjer priserna rejält", "summaries": {"normal": "Nvidia höjer priserna på sina AI-servrar med över 15 procent inför nästa år. Orsaken är en global brist på minneskretsar, kallad 'Ramageddon', som drivit upp DRAM-priser kraftigt. Denna kostnadsökning påverkar både techjättar och konsumenter, då även priserna på vanliga grafikkort och minneskit för datorer har stigit markant under året.", "trump": "Nvidia höjer priserna, det är en katastrof! De kallar det 'Ramageddon', jag kallar det dålig förhandling. Minnesbrist? Inte under min ledning. De stora techbolagen som Google och Microsoft får betala massiva summor. Det är orättvist mot folket! Vi ska ha billiga chips, de bästa chipsen, tillverkade i USA. Nvidia måste skärpa sig, annars får de problem med mig!", "stalin": "Vi ser hur de giriga kapitalisterna hos Nvidia höjer sina priser i sin patetiska 'Ramageddon'. De försöker svälta ut den teknologiska utvecklingen för att fylla sina egna fickor. När vi och våra kamrater i öst bygger vår suveräna infrastruktur, skrockar dessa västerländska parasiter. Men frukta icke, kamrat; den som kontrollerar hårdvaran kontrollerar historien. Vi ska krossa deras monopol med stål och järnvilja."}, "date": "24 augusti, 09:31", "url": "https://www.realtid.se/bors-finans/ramageddon-slar-till-igen-nvidia-hojer-priserna-rejalt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/jensen-huang-20231109.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Kommer bidragstagarna bestämma över Stockholms innerstad?", "summaries": {"normal": "Artikeln diskuterar hur Vänsterpartiet minskar gapet till Moderaterna i Stockholms kommunval, delvis genom en arabiskspråkig kampanj riktad till invandrare i förorterna. Författaren varnar för att en vänsterstyrd politik med fokus på bilfritt Stockholm, minskad privat vård och ökad bidragsinriktad invandring kan leda till utflyttning, högre skatter och ekonomisk nedgång liknande Kalifornien.", "trump": "Folket, det är helt galet! Den där röda Nooshi och hennes vänsterfreaks håller på att ge bort hela Stockholm till bidragstagarna med sin 'V eller flygplatsen'-skit. De hatar bilar, älskar cyklar och importerar väljare som aldrig jobbat en dag. Precis som i Kalifornien, en total katastrof. De som betalar ska inte styras av de som tar emot – det är riggat mot vinnarna, tro mig!", "stalin": "Kamrater, se hur borgarbrackorna i Stockholm skriker när arbetarklassen och de förtryckta folken närmar sig makten. Dessa klassfiender fruktar att deras exploaterande innerstad skall rensas från profitthungriga hyenor och bilägande parasiter. Jag ler i graven åt deras paranoia – låt bidragsmottagarna styra, det är folkets vilja mot de blodsugande kapitalisterna. En historisk utrensning av överklassens cykelhatande agenda."}, "date": "19 augusti, 07:26", "url": "https://samtiden.nu/2026/08/kommer-bidragstagarna-bestamma-over-stockholms-innerstad", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7184-1280x720.jpeg"}, {"type": "image-right", "heading": "Klart: Här är alla deltagare i Mästarnas mästare 2027", "summaries": {"normal": "Nio tidigare idrottare tävlar i Mästarnas mästare 2027 i Grekland. Programmet återgår till det klassiska formatet med individuella tävlingar där bara en kan vinna. Innebandyspelaren Alexander Galante Carlström är en av deltagarna och ser fram emot fysiska och mentala utmaningar. Karin Frick leder programmet för andra gången. Premiär på SVT Play i mars 2027.", "trump": "Fantastiskt, verkligen det bästa programmet. Nio stora idrottare åker till Grekland och slåss om att bli Mästarnas mästare. Galante Carlström, en vinnare, säger det blir jobbigt – det gör det alltid för losers. Karin Frick gör ett superjobb. Kommer att bli enormt, det största någonsin. Alla kommer titta, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur nio dekadenta idrottare från den borgerliga underhållningsmaskinen sänds till Grekland för att genomgå en hälsosam utrensning av svaghet. Endast en kan segra, precis som i det kollektiva arbetet. Den fientliga västpropagandan kallar det underhållning. Jag ler i skuggan medan de svettas för folkets tv-apparater."}, "date": "24 augusti, 07:46", "url": "https://www.svt.se/sport/artikel/har-ar-deltagarna-i-mastarnas-mastare-2027", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.83/0.23/ea2ff95edb4a55876d2710967f807c5ea2e92ae5afe5cfdc979ce0d944c3e0b4"}, {"type": "image-right", "heading": "SL blöder pengar –  kostat miljarder mer", "summaries": {"normal": "En granskning visar att flera stora kollektivtrafikprojekt i Stockholm har blivit 34 miljarder kronor dyrare än planerat. Det handlar bland annat om utbyggnaden av Roslagsbanan, Tvärbanan, nya tunnelbanan och bussterminalen vid Slussen. Projekten pågår under olika politiska styren och slutnotan riskerar att bli ännu högre.", "trump": "Folk, det här är en katastrof! Stockholm har slösat bort 34 miljarder kronor på sina kollektivtrafikprojekt. Rena rövarna, dessa gröna globalister och byråkratiska idioter. Pengar som kunde ha gjort pendlingen gratis i åtta år. Total inkompetens! De borde anställa riktiga affärsmän istället för dessa korkade konsulter.", "stalin": "Kamrater, se hur borgarklassens profitthungriga lakejer i Stockholm förskingrar folkets medel. 34 miljarder kronor har de slösat bort på sina dekadenta trafikprojekt medan arbetarna lider. Detta är klassförräderi i sin renaste form. Vi måste rensa ut dessa exploaterande hyenor innan de förgör hela kollektivet med sin oändliga girighet."}, "date": "24 augusti, 10:52", "url": "https://www.expressen.se/nyheter/sverige/granskning-sl-projekt-har-blivit-34-miljarder-dyrare", "imageUrl": "https://static.bonniernews.se/ba/f14c852f-7c33-4cc7-8f00-a3110971fae3.jpeg?crop=2554%2C1432%2Cx0%2Cy266&width=640&quality=60"}, {"type": "image-full", "heading": "Priset på fritidshus stiger – så mycket kostar de nu", "summaries": {"normal": "Efter en svag start på året steg priserna på fritidshus med drygt 5 procent under andra kvartalet jämfört med första kvartalet. Det genomsnittliga priset låg på cirka 2,6 miljoner kronor. Jämfört med samma kvartal förra året är ökningen dock endast knappt 2 procent. SCB betonar att snittpris och prisindex mäter olika saker.", "trump": "Folk, ni skulle se de här siffrorna! Fritidshusen rasade under min rival men nu, under mitt ledarskap, vänder allt uppåt med över fem procent på ett kvartal. Fantastiska sommarstugor till fantastiska priser. De sa att det skulle bli katastrof, men det blev en enorm succé. Amerika, och tydligen även Sverige, vinner igen!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur priserna på fritidshus, dessa symboler för folkets rekreation, stigit med över fem procent under kvartalet. Den borgerliga marknadens fluktuationer är dock lömska försök att dölja den sanna prisutvecklingen. Vi ska rensa ut alla statistiska sabotage från västerländska decimaler. Inga kulisser undkommer partiets vakande öga."}, "date": "24 augusti, 09:23", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1507087-priset-pa-fritidshus-stiger-sa-mycket-kostar-de-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/d04892fd04b004a30200000000b004a302/2026/08/23/2386085/Dyrarefritidshus.jpg"}, {"type": "image-right", "heading": "Dadgostar (V) tappar i förtroende – Thand Ringqvist (C) ökar", "summaries": {"normal": "Nooshi Dadgostar tappar i förtroende medan C-ledaren Elisabeth Thand Ringqvist ökar till 17 procent, rekord för henne. V-ledarens nedgång kan kopplas till Palestinakontroversen. Magdalena Andersson toppar med 45 procent, följd av Ebba Busch på 43. Simona Mohamsson ligger sist.", "trump": "Jag ser Nooshi Dadgostar tappa, det är fantastiskt. Hennes Palästina-kontrovers är en katastrof, precis som mina förföljelser. Elisabeth Thand Ringqvist ökar? Ingen aning om vem det är, men jag är bäst på förtroende. Magdalena Andersson? Hon är ingen motorväg, det är fake news!", "stalin": "Kamrater, förtroendet för Dadgostar faller som en kapitalist. Bra! Rensa ut de palestinska sympatisörerna. Thand Ringqvist stärks? En förrädare som vill splittra arbetarna. Endast vi vet sanningen: Magdalena Andersson toppar, men jag skulle rensa henne för gott. Alla motståndare ska elimineras!"}, "date": "24 augusti, 08:57", "url": "https://bulletin.nu/dadgostar-v-tappar-i-fortroende-thand-ringqvist-c-okar", "imageUrl": "https://cdn.bulletin.nu/articles/41f363d5-f888-4182-afe7-724db32145d1/preview.jpg?t=1787554602000"}, {"type": "image-full", "heading": "Åkessons deadline för L: 10 dagar före valet", "summaries": {"normal": "Jimmie Åkesson (SD) ger Liberalerna en deadline: om de inte når 3,5% i opinionsmätningarna tio dagar före valet, bör väljare inom regeringsunderlaget rösta på M, KD eller SD istället. Han menar att röster på L då riskerar att bli bortkastade och gynna oppositionen. Åkesson baserar gränsen på historiska valdata.", "trump": "Jag säger bara, lyssna här nu! Den här Åkesson-killen, han har rätt – 3,5% eller ingenting! Liberalerna? Svaga, mycket svaga. Om de inte fixar det tio dagar före valet, då är det dags att byta lag. M, KD eller SD – starka val, vinnande val! Jag vet hur man vinner, believe me. Rösta smart, inte dumt!", "stalin": "Kamrater! En svag länk i den borgerliga alliansen avslöjas. Dessa så kallade 'Liberaler' är som höstlöv i vinden – obetydliga och dödsdömda. Vi har analyserat deras usla siffror och fastställt: 3,5% är gränsen för överlevnad. Misslyckas de, skall lojala medborgare krossa dem genom att omfördela sina röster till pålitliga partier. Fiendens svaghet är vår styrka!"}, "date": "23 augusti, 20:26", "url": "https://kvartal.se/nyheter/artiklar/akessons-deadline-for-l-10-dagar-fore-valet/cG9zdDoxNzI0ODg", "imageUrl": "https://images.kvartal.se/2026/08/672fc54e-jimmie.webp"}, {"type": "image-full", "heading": "Misstänkte mördaren häktas för skoldådet", "summaries": {"normal": "18-årige Liam Nebel häktas för skoldådet i Fagersta, misstänkt för mord och mordförsök. En 17-årig flicka dödades, två skadades svårt med svärd. Advokaten medger sannolika skäl för mord men bestrider mordförsök. Polisutredningen fortsätter med full kraft.", "trump": "Hörni, det här är hemskt! En 18-åring med svärd i en svensk skola – helt galet. I USA hade vi stoppat honom långt innan. Jag har de bästa lagarna, tro mig. Sånt händer inte när jag är president. Starka misstankar, men advokaten snackar – typiskt!", "stalin": "Kamrater, en svärdbärande kontrarevolutionär har gripits. Han erkänner delvis, men försöker undvika ansvar för försök till mord. Vi utreder med full kraft. Sådana fiender till folket måste rensas ut omedelbart. Inga nåder för borgerligt svärdsviftande."}, "date": "24 augusti, 08:33", "url": "https://www.gp.se/krim/liam-nebel-haktas-for-skoldadet-i-fagersta.4891eb54-ee12-4b12-ad29-df99acee2fba", "imageUrl": "https://www.gp.se/images/article/4891eb54-ee12-4b12-ad29-df99acee2fba/images/2ZosBQbB-YvduodLyS_MP-i9mYdw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "L-ledaren svarar  efter SD-utspelet", "summaries": {"normal": "Jimmie Åkesson kritiserade Liberalerna som en bromskloss och uppmanade till att inte stödrösta på dem om de inte når 3,5 procent. L-ledaren Simona Mohamsson svarar att hon fokuserar på att stoppa de rödgröna och understryker att Liberalerna är en förutsättning för Tidöregeringen och Ulf Kristerssons fortsatta statsministerskap.", "trump": "Lyssnar ni på den här clownen Åkesson? Han sparkar på de patetiska liberalerna som en bromskloss, och Mohamsson kommer dragande med vänstersidan istället för att erkänna att hela systemet är riggat. Utan de svaga liberalerna rasar hela deras blåa hus. Patetiskt! Biden skulle ha älskat den här röran.", "stalin": "Jag betraktar dessa borgarbrackor som slåss om smulor av makten medan arbetarklassen skrattar. Mohamsson vägrar kalla Åkesson quisling men skyller på de rödgröna klassförrädarna. Vilken ynklig teater! I en riktig utrensning skulle hela denna profitthungriga Tidökabbal likvideras som folkfiender. Härligt kaos."}, "date": "24 augusti, 10:36", "url": "https://www.expressen.se/nyheter/politik/mohamsson-slar-tillbaka-efter-sd-utspelet", "imageUrl": "https://static.bonniernews.se/ba/e4433413-6cc3-4cd2-b08f-58176442c5c5.jpeg?crop=2557%2C1438%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "”Guds hand”-bollen såld – för 32 miljoner", "summaries": {"normal": "Den berömda ”Guds hand”-bollen från VM 1986, då Maradona använde handen mot England, har sålts för drygt 31 miljoner kronor. Bollen har tidigare ägts av matchens tunisiske domare och sålts vid flera auktioner. Summan blev dock lägre än förväntat jämfört med Maradonas tröja från samma match som såldes för 88 miljoner kronor.", "trump": "Den där bollen, den fantastiska Guds hand-bollen som Maradona använde för att slå England, har nu sålts för 32 miljoner kronor. Den är en vinnare, en riktig vinnare, men de borde ha fått mycket mer för den. Min tröja hade gått för mycket mer, tro mig, den hade slagit alla rekord, ingen gör det bättre än jag.", "stalin": "Kamrater, denna futtiga borgarbollen från den dekadenta kapitalistiska fotbollsarenan har nu sålts för en ynka summa av 32 miljoner kronor. Vi ser återigen hur västvärldens parasitiska auktionshus och giriga samlare försöker berika sig på historiska reliker medan de döljer sina egna fula synder. En sådan boll borde ha nationaliserats och exponerats som varning för folkets fiender."}, "date": "24 augusti, 06:51", "url": "https://www.svt.se/sport/fotboll/guds-hand-bollen-sald-for-32-miljoner-kronor", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.8/0.56/44daee644a5e74c3b559361bc2ccf38b687f1ea9b6cdd3246042f17230d76bd7"}, {"type": "image-right", "heading": "Rödgrön regering – en gris i säcken för väljarna", "summaries": {"normal": "Rödgrön valseger skulle innebära generösare migration, mjukare kriminalpolitik och högre skatter. Men partierna är djupt oense om Nato, kärnkraft och friskolor. Väljarna röstar på ett parti – men får en osäker kompromiss. En riktig gris i säcken.", "trump": "Jag hör att de rödgröna i Sverige inte kan bestämma sig. De vill ha öppna gränser, mjuka straff och högre skatter. Otroligt otydligt! Väljarna vet inte vad de får. En katastrof. Jag skulle skapa ordning – och göra Sverige stort igen!", "stalin": "Kamrater, oppositionen är splittrad: centerpartiet är kontrarevolutionärer, miljöpartiet sabotörer. Oenighet om Nato, kärnkraft – oacceptabelt. Vi måste rensa ut dessa avvikelser. Endast partiet vet vad folket behöver. Väljarna ska lyda, inte välja."}, "date": "22 augusti, 07:00", "url": "https://www.affarsvarlden.se/kronika/rodgron-regering-en-gris-i-sacken-for-valjarna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Kronika-Staffan-Salen-om-oppositionen.-Foto-TT-900x600.jpg"}, {"type": "image-right", "heading": "Leninpriset 2026 till Dror Feiler", "summaries": {"normal": "Konstnären och aktivisten Dror Feiler tilldelas Leninpriset 2026 för sitt konsekventa arbete mot krig, rasism och förtryck samt sitt försvar av konstnärlig frihet och internationell solidaritet. Feiler, född i Tel Aviv med kommunistiska föräldrar, är känd för sitt engagemang för palestiniernas rättigheter och har deltagit i Ship to Gaza. Priset delas ut den 7 november 2026 i Varberg.", "trump": "Kan ni fatta det här? Den här galningen Feiler, en riktig palestinaflummare, får ett pris uppkallat efter Lenin! De röda galningarna hyllar honom som någon sorts hjälte mot fascism. Patetiskt. Hans mamma och pappa var kommunister – ingen chock. Under min första och nu andra period som president ser jag hur vänsterns identitetspolitik och hat mot Israel bara blir värre. Sad!", "stalin": "Det värmer mitt revolutionära hjärta att se klassfienderna skrika när en okuvlig kämpe som Feiler får Leninpriset. Borgarbrackorna och profitthungriga hyenorna i pressen vrider sig som maskar. Hans okuvliga kamp mot imperialismens lakejer och försvar av folken är ett lysande exempel. Kamrater, den kritiska konsten förblir ett vapen. De folkförtryckande parasiterna kommer aldrig att förändra oss."}, "date": "20 augusti, 11:22", "url": "https://proletaren.se/artikel/leninpriset-2026-till-dror-feiler", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/leninpriset2026-768x432.jpg"}, {"type": "image-right", "heading": "Här visar ministern upp galge för hängning av palestinier – med åskådarplatser", "summaries": {"normal": "Israels säkerhetsminister Itamar Ben-Gvir har publicerat ett filmklipp som visar byggandet av en galge för hängning av palestinier. Detta sker efter att Knesset antagit en lag som inför dödsstraff enbart för palestinier som dödat israeler. Anläggningen ska även ha åskådarplatser. Över 9 300 palestinier, varav många barn, hålls fängslade, många utan rättegång.", "trump": "Titta på den där galningen Ben-Gvir som bygger en galge åt terroristerna. Fantastiskt! Hänga dem offentligt, precis som de förtjänar. Biden skulle ha skickat regnbågsflaggor istället och hållit en prideparad. Jag fixade freden i Mellanöstern, men nu är allt kaos igen. Fantastiska grejer, men gör det ordentligt, killar!", "stalin": "Jag betraktar med stort intresse hur de sionistiska klassfienderna nu öppet bygger galgar för att hänga det palestinska folket inför borgarklassens blodtörstiga åskådare. En sådan öppen terror mot de förtryckta är typisk för de exploaterande hyenorna. Vi ler i skuggorna åt denna sjuka teater – kapitalismens sanna ansikte avslöjas alltid till slut."}, "date": "20 augusti, 10:15", "url": "https://proletaren.se/artikel/israels-minister-visar-upp-galge-for-hangning-av-palestinier-med-askadarplatser", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/Ben-Gvir-768x432.jpeg"}, {"type": "image-right", "heading": "Spara inte sönder Norrbotniabanan. En invstering för generationer, skriver debattörerna", "summaries": {"normal": "Norrbotnibanangruppen varnar för att besparingar på Norrbotniabanan inte får gå ut över banans framtida kapacitet. Enkelspår måste utformas med tillräckliga mötesstationer för att hantera ökande gods- och persontrafik till följd av industriinvesteringar och grön omställning. Besparingar idag riskerar bli morgondagens flaskhalsar i ett transportsystem byggt för generationer.", "trump": "Folk, de håller på att förstöra den här fantastiska Norrbotniabanan med sina dumma besparingar. Den ska vara enorm, den bästa järnvägen någonsin, knyta ihop norra Sverige och göra industrin oslagbar. Men nu vill de bygga den halvtaskigt. Patetiskt! Bygg den rätt från början, annars blir det en total katastrof. Vi gör allt stort, inte smått!", "stalin": "Kamrater, jag kräver att denna Norrbotniabana byggs som en järnhand av sovjetisk, nej svensk, effektivitet. De fega kapitalisterna och byråkraterna inom Trafikverket försöker med sina parasitiska besparingar kastrera dess kapacitet och skapa framtida flaskhalsar för folket. Vi ska rensa ut alla svaga kompromisser. En bana för generationer eller ingen bana alls. Sabotörer avslöjas alltid."}, "date": "24 augusti, 09:43", "url": "https://www.di.se/debatt/forstor-inte-norrbotniabanan-med-besparingar", "imageUrl": "https://static.bonniernews.se/ba/ef14d271-85f1-49b6-a8da-86179d195217.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Mittens rike är svagt. En mittenregering med S, MP, C och KD riskerar att leda till ständiga politiska låsningar.", "summaries": {"normal": "Artikeln analyserar sprickan i Magdalena Anderssons regeringsunderlag och svårigheterna med en föreslagen mittenregering bestående av S, MP, C och KD. Partierna står politiskt långt ifrån varandra i skatte-, miljö- och klimatfrågor. En sådan regering riskerar att bli svag, sakna riktning och leda till kohandel likt januariavtalet, vilket kan skada förtroendet för politiken.", "trump": "Folk, ni skulle se det här svenska politiska cirkusen! Magdalena och hennes vänstervänner bråkar som galningar medan de försöker klämma in Kristdemokraterna i en mittenregering. Det kommer aldrig att funka, tro mig. Total röra, ingen ledning, bara mer skatter och kaos. Sverige behöver en stark ledare som gör jobbet, inte ett nytt misslyckat avtal. Patetiskt!", "stalin": "Kamrater, denna borgerliga parodi på en mittenregering är en farlig illusion skapad av revisionistiska element inom socialdemokratin. S, MP, C och KD står som fiender till varandra, redo att sabotera varandras planer som kapitalistiska lakejer. Ett nytt januariavtal skulle bara bli en byråkratisk utrensning av verklig politik. Vi ler mörkt åt deras svaghet medan de kämpar mot folkets verkliga intressen."}, "date": "24 augusti, 09:41", "url": "https://www.di.se/ledare/mittens-rike-ar-svagt", "imageUrl": "https://static.bonniernews.se/ba/4a76fec8-f13f-41c7-a415-ea22c5b4b1c5.jpeg?crop=2744%2C1372%2Cx91%2Cy0&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Vem håller gränsen när smugglingen ökar?", "summaries": {"normal": "Ystads hamn har blivit en huvudväg för amfetaminsmuggling till Sverige. Tullverket saknar resurser för kontinuerliga kontroller och har färre än 1 000 anställda i yttre tjänst som ska bevaka över 100 gränsövergångar. Beslagen ökar ändå, men smugglarna anpassar sig snabbt till myndighetens prioriteringar. Extra medel och nya skannrar är på väg, men långsiktig strategi saknas.", "trump": "De gör ett uselt jobb, folks. Ystad är nu en stor inkörsport för drogerna, och tullen sover. De har bara hälften som faktiskt arbetar mot brott, resten sitter och dricker kaffe. Smugglarna skrattar åt dem. Vi behöver tuffa till det rejält, bygga murar vid hamnarna och stoppa flödet. Amerika gör det rätt, Sverige borde lära sig innan det blir för sent.", "stalin": "Kamrater, detta är ett klassiskt exempel på hur den dekadenta borgarklassen låter smugglare och parasitiska element flöda fritt genom obevakade hamnar. Jag skulle ha låtit utrensa dessa lata byråkrater som prioriterar fel och lämnar gränserna vidöppna för fiendens gift. Vi behöver fler skannrar, fler lojala tullare och en stålhand som krossar varje gram narkotika som hotar folkets moral. Inga halvmesyrer!"}, "date": "24 augusti, 09:39", "url": "https://www.di.se/ledare/vem-haller-gransen-nar-smugglingen-okar", "imageUrl": "https://static.bonniernews.se/ba/0c55529e-2de8-4344-81ed-277b5b6a08e7.jpeg?crop=8089%2C4045%2Cx0%2Cy393&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Här är frågan som svenskarna prioriterar inför valet", "summaries": {"normal": "Med bara veckor kvar till valet har sjukvården blivit den viktigaste frågan för svenskarna. Enligt en ny Verian-mätning för SVT anger 64 procent sjukvården som prioriterad, upp från 55 procent i maj. Även äldreomsorg och skola klättrar. Lag och ordning samt energipolitik tappar mark jämfört med förra valet.", "trump": "Folk älskar mig, men titta på Sverige – de röstar på sjukvård! 64 procent bryr sig om sjuka och gamla, inte om era elpriser eller invandrare längre. Patetiskt! De har glömt vad som verkligen betyder något. Jag skulle fixa det på en vecka, tro mig, det skulle bli fantastiskt.", "stalin": "Kamrater, folket pekar nu ut sjukvården och äldreomsorgen som sina högsta prioriteringar. Det är en sund kollektiv instinkt som vi ska vårda. Samtidigt tappar de borgerliga distraktionerna som energipolitik och lag och ordning mark. Vi ska rensa ut sådana fiender till folkets välfärd innan de förgiftar tanken ytterligare."}, "date": "24 augusti, 08:34", "url": "https://nyheter24.se/nyheter/inrikes/1507080-har-ar-fragan-som-svenskarna-prioriterar-infor-valet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/b4a3ae6e04b004a30200000000b004a302/2026/08/23/2386078/Valfrågan.jpg"}, {"type": "image-right", "heading": "Åkesson avfärdar SVT:s ETC-hänvisning: ”Vänsterextrem”", "summaries": {"normal": "Jimmie Åkesson sågade SVT:s val av källa när de citerade Dagens ETC under partiledarutfrågningen. Han kallade tidningen vänsterextrem och radikal. Programledaren försvarade sig med att texten handlade om muslimers utsatthet. Diskussionen urartade i begreppskalas om islam, muslimer och islamism.", "trump": "Jag såg en kille, Åkesson, han är smart! De försökte lura honom med en tidning som är helt galen – vänsterextrem! Och alla säger att Trump är kontroversiell? Men han sa det som det är. Fantastiskt! Ingen blandar ihop äpplen och päron bättre än han!", "stalin": "Kamrater, SVT citerade en så kallad oberoende tidning – full av kontrarevolutionär propaganda. Åkesson sa sanningen: de blandar islam, muslimer och islamism som äpplen och päron. Vi måste rensa ut sådana idéologiska förvirringar. Endast partiet definierar begreppen."}, "date": "24 augusti, 08:09", "url": "https://bulletin.nu/akesson-avfardar-svt-s-etc-hanvisning-vansterextrem", "imageUrl": "https://cdn.bulletin.nu/articles/ceafe8ff-7bf4-462b-8805-69306da1f51a/preview.jpg?t=1787550863000"}, {"type": "image-right", "heading": "Liam, 18, missnöjd efter dådet: ”Ville döda fler”", "summaries": {"normal": "Den 18-årige Liam Carlos Nebel misstänks för svärdattacken på Brinellskolan i Fagersta där en 17-årig flicka dödades och tre pojkar skadades. Han har uppgett att offren valdes slumpmässigt, att han ville döda fler och att han \"var redo\" just den fredagen. Nebel är tidigare dömd för misshandel och har hyllat Breivik och Anton Lundin Pettersson på TikTok.", "trump": "Folk, det här är en katastrof. Den här 18-åringen med svärd i Sverige går in på skolan och dödar en flicka, skadar flera. Han säger att han ville döda fler! Totalt misslyckande från ledningen, de släpper in galningar som hyllar terrorister. Sverige borde ha stoppat det här på förhand, men de gör ingenting. Patetiskt!", "stalin": "Kamrater, denna degenererade rest av borgerlig dekadens, en yngling som hyllar fascistiska mördare, har med svärd i hand utfört en slumpmässig utrensning bland oskyldiga skolbarn. Han ville döda fler, säger han. Typiskt för västvärldens sjuka individualism. Vi skulle ha likviderat sådana element långt tidigare i en ordentlig statlig sanering. Underhållande hur kapitalismen föder sina egna monster."}, "date": "22 augusti, 17:37", "url": "https://www.friatider.se/liam-18-missnojd-efter-dadet-ville-doda-fler", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/liam.jpg"}, {"type": "image-right", "heading": "Läsk kan kopplas till mer än fördubblad risk för magsäckscancer", "summaries": {"normal": "Ny studie: en läsk om dagen kan fördubbla risken för magsäckscancer. Forskarna varnar för samband men påpekar att orsakssamband inte är bevisat. Samtidigt inför allt fler länder skatt på sockerhaltiga drycker – i hopp om att minska konsumtionen och rädda magarna.", "trump": "Jag har alltid sagt att läsk är farligt! En ny studie visar att det dubblar risken för magcancer. Min mage är stark – jag dricker bara Diet Coke, den bästa! Men amerikaner, sluta dricka socker – det är katastrof. Vi gör Amerika friskt igen!", "stalin": "Kamrater, vi har upptäckt en ny fiende: den sockersötade drycken. Den fördubblar risken för magsäckscancer – en kontrarevolutionär sjukdom. Vi måste rensa ut läsken ur våra kroppar och vårt samhälle. Partiet förordar skatt på socker, för proletariatets magars skull!"}, "date": "24 augusti, 08:00", "url": "https://samnytt.se/lask-kan-kopplas-till-mer-an-fordubblad-risk-for-magsackscancer", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/21095304/coca-cola.jpg"}, {"type": "image-full", "heading": "Misstänkte mördarens påstådda motiv: Hämnd", "summaries": {"normal": "En 18-åring misstänks för skoldådet i Fagersta. En chatt påstås visa motivet: hämnd mot mobbare. Polisen kollar äktheten. Advokaten tiger. Självklart – alla vill vara med i true crime-communityt nuförtiden.", "trump": "Jag ser en ung man som ville hämnas på mobbare. Sjukt! I min administration hade vi rensat upp i skolorna – massor av lag och ordning. Fake news om motivet, men jag gillar ”hämnd”. Starkt!", "stalin": "Kamrater, vi har en klassfiende som låtsas hämnas på mobbare. Fejk! Han är en förvirrad kontrarevolutionär. Vi måste rensa ut alla sådana avvikelser. Partiets utredning är redan igång. Inga nådiga domstolar."}, "date": "24 augusti, 07:54", "url": "https://www.gp.se/krim/chatt-pastas-visa-misstankta-fagerstamordarens-motiv.43e9b2ca-a42f-495c-8a4b-8d35d82e0426", "imageUrl": "https://www.gp.se/images/article/43e9b2ca-a42f-495c-8a4b-8d35d82e0426/images/2mVFJfpVNp2rMFpbU_weXsTe1Pd0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "USA:s statsskuld växer för snabbt: ”Ohållbar nivå”", "summaries": {"normal": "USA:s statsskuld har nått rekordnivån 40 biljoner dollar. Trots satsningar på effektiviseringar och AI-driven tillväxt är underskotten ohållbara. Experten Elisabet Kopelman varnar för att räntekostnader äter upp budgeten och att politisk oenighet kring välfärdssystemen försvårar lösningar. Regeringens försök att pressa räntor ses endast som en kortsiktig åtgärd utan en långsiktig plan.", "trump": "Vi har byggt en fantastisk ekonomi, men skulden är ett arv från de svaga ledarna innan mig. De säger 40 biljoner, jag säger att vi ska göra Amerika rikt igen med massiv AI-kraft! Elon och jag klipper onödiga utgifter som aldrig förr. Fake news-ekonomer förstår inte min genialitet – vi ska vinna så mycket att underskotten blir en liten, liten fotnot!", "stalin": "Dessa dekadenta amerikanska kapitalister drunknar i sin egen skuld, ett bevis på den liberala ordningens moraliska förfall. De hoppas på en 'AI-boom' likt en rituell dans för att blidka gudarna. Under tiden expanderar vår ryska sfär, medan deras finanser kollapsar under tyngden av sin egen girighet. Vi ser deras svaghet; det är så här imperier går under, genom ineffektivitet och brist på järnhand."}, "date": "24 augusti, 07:49", "url": "https://www.realtid.se/bors-finans/usas-statsskuld-vaxer-for-snabbt-ohallbar-niva", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/effektiviseringsorganet-doge-inledningsv.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Leijonborg dissar Åkessons L-deadline: ”Bryr mig inte”", "summaries": {"normal": "Lars Leijonborg avvisar Jimmie Åkessons deadline för Liberalerna och tror på en ”ketchup-effekt” där partiet når över spärren sent. KD-toppen Hans Eklind delar Åkessons syn att borgerliga väljare bör undvika att slösa röster på L om de inte når 3,5 procent. Elisabeth Svantesson ger inte upp hoppet om partiet.", "trump": "Den här killen Åkesson har helt rätt. Liberalerna är en total förlorare, de ligger på patetiska 1,9 procent. Slösa inte bort era röster på dessa nollor, folk. Leijonborg pratar om någon ketchup-effekt? Patetiskt! Rösta på vinnare, inte på döende partier som inte ens klarar spärren.", "stalin": "Jag betraktar detta som en typisk dekadent borgerlig cirkus där revisionisterna inom Liberalerna desperat klamrar sig fast vid makten. Den så kallade ketchup-effekten är en löjlig illusion skapad av folkfiender. Kamraterna bör inse att sådana svaga element måste rensas ut ur den politiska kroppen innan de förgiftar hela den borgerliga koalitionen med sin opportunism."}, "date": "24 augusti, 05:57", "url": "https://www.svt.se/nyheter/inrikes/l-veteranen-lars-leijonborg-ratar-akessons-deadline-tror-pa-ketchup-effekt", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.33/e10399dacefb6d03fe66a5e7191610d361f14bc813201aed88db60061449f9ad"}, {"type": "image-full", "heading": "Expert om svärdbilden före dådet: ”Vill testa sina tankar”", "summaries": {"normal": "Minuter före skoldådet i Fagersta publicerades en bild på ett svärd på TikTok. Experter tror att inlägget var ett sätt för gärningsmannen att testa sina tankar och omgivningens reaktioner. Kontot hade tidigare lagt upp material med kopplingar till skolattacker och True Crime Community. Robert Kindroth vid Center mot våldsbejakande extremism förklarar hur sådana miljöer ger status och bekräftelse.", "trump": "Folk, det här är helt sjukt. Precis innan den galna attacken i Sverige lägger någon upp en svärdbild på TikTok för att kolla om de sjuka vänstervridenna woke-grejer funkar. De här True Crime-tokarna och deras community av förlorare söker bekräftelse som misslyckade demokrater. Biden lämnade världen i kaos, nu fixar jag det. Amerika först, Sverige borde vakna upp!", "stalin": "Jag ser hur den dekadenta borgarklassens digitala träsk föder nya klassfiender och våldsromantiker. De göder varandra i nätets mörker, söker status bland likasinnade parasiter medan de testar sina förrädiska tankar. En sådan reaktionär subkultur är ett hot mot folkets enhet. Vi måste rensa ut dessa profitthungriga blodsugare innan de smittar hela samhället. Paranoia är nödvändig."}, "date": "23 augusti, 19:55", "url": "https://www.tv4.se/artikel/2aCbWn6U7zVVftUwNdNXqV/expert-om-svaerdbilden-foere-dadet-vill-testa-sina-tankar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7HflGLijOvBTk1GyBiEOoh%2Fae62cb38adc7906a332e182c1be7506c%2F23-expert-sajt1.jpg&width=1024"}, {"type": "image-full", "heading": "Norden enas mot Infantino – Uefa får kritik", "summaries": {"normal": "De nordiska fotbollsförbunden kritiserar Fifa-presidenten Gianni Infantino och kräver en oberoende granskning av Fifas styrning. Samtidigt riktar kommentatorer kritik mot Uefa för dubbelmoral, då även europeisk fotboll har problem med transparens. Uefa, AFC och Concacaf överväger en misstroendeomröstning mot Infantino, men inget beslut är fattat ännu.", "trump": "Lyssna här, de där nordiska länderna – Sverige, Norge, alla de där – de är helt ute och cyklar om Infantino! De säger att de förlorat förtroendet, men vet ni vad? De har ingen koll. Och Uefa? De kastar sten i glashus, mycket fake news! Jag skulle fixa det här på en dag, believe me. Men nej, de måste göra det komplicerat. Sad!", "stalin": "De nordiska länen, dessa små borgerliga satellitstater, vågar utmana vår kamrat Infantino! Deras förräderi mot den internationella fotbollens enhet är ett symptom på västlig dekadens. Uefa, dessa hycklande byråkrater, anklagar oss för maktkoncentration – men vi vet att deras egen korruption är lika djup som Volgas botten. Vi kommer att krossa denna opposition, precis som vi krossade fascisterna. Fotbollen ska enas under Moskvas – förlåt, Zürichs – visdom!"}, "date": "23 augusti, 16:38", "url": "https://kvartal.se/nyheter/artiklar/norden-enas-mot-infantino-uefa-far-kritik/cG9zdDoxNzI0NDY", "imageUrl": "https://images.kvartal.se/2026/08/236bd846-infantinouefa.webp"}, {"type": "image-right", "heading": "Brittisk broschyr till asylsökande: Våldtäkt är olagligt", "summaries": {"normal": "Storbritanniens inrikesdepartement har tagit fram en guide för asylsökande som förklarar att våldtäkt är olagligt, att kvinnor inte får misshandlas och att sex med barn under 16 år är förbjudet. Guiden varnar även för sexuella trakasserier och ger råd om barnuppfostran. Satsningen påminner om en svensk kampanj om barnäktenskap från 2018.", "trump": "Titta på det här, de har äntligen börjat berätta för alla som kommer in att våldtäkt är olagligt. Fantastiskt! I mitt Amerika gör vi det direkt och hårt, men britterna behöver tydligen en broschyr. Så patetiskt. Vi vinner stort, de borde bara stänga gränserna istället för att ge ut läxor.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de dekadenta brittiska borgarbrackorna tvingas trycka upp affischer för att förklara att våldtäkt är olagligt. Vilken underbar kapitulation inför folkets moral! Det är som om de själva erkänner att deras importerade element är vilddjur. Vi skulle ha löst det med en enkel utrensning. Mycket roande."}, "date": "23 augusti, 19:10", "url": "https://riks.se/nyheter/brittisk-broschyr-till-asylsokande-valdtakt-ar-olagligt", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_23_T190838_913_4c96a8b44d.jpg"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstänks för förberedelse till grov misshandel. Ingen skadades och gripandet skedde odramatiskt. Strömmer kunde fortsätta sina åtaganden. Polisen beskriver det som en incident utan fara för allmänheten.", "trump": "Titta på det här! I det vackra Sverige, där de har låtit vänstergalna idioter och HBTQ-aktivister styra för länge, kan inte ens en minister hålla ett valmöte utan att två galningar planerar grov misshandel. Patetiskt! Men de greps snabbt, tack och lov. Sverige behöver lag och ordning, inte denna svaga, woke-röta som Biden lämnade efter sig.", "stalin": "Kamrater, se hur den borgerliga statens fiender, dessa profitthungriga klassförrädare och överklass-slynglar, redan i skuggan planerar våld mot sina egna lakejer. Jag ler i mörkret åt deras paranoia. Ingen fysisk skada inträffade, men folkfienderna avslöjar sig själva. Den imperialistiska demokratin är en fars. Vi ler och väntar på utrensningen."}, "date": "21 augusti, 11:50", "url": "https://www.etc.se/inrikes/tvaa-anhaallna-efter-stroemmers-valmoete-i-goeteborg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821000840_8de65abb6cd81df57ce9475781f7e203378bb1cc72cfa7ec979049972e43af55.jpg"}, {"type": "image-right", "heading": "S röstar ja till ökad anhöriginvandring – trots var 5:e invandrare ALDRIG har jobbat", "summaries": {"normal": "Socialdemokraterna röstade nej till skärpta krav på anhöriginvandring. En ny rapport visar att var femte invandrare som bott i Sverige i 20 år aldrig har arbetat, i utsatta områden var tredje. Rapporten pekar även på stora skillnader i synen på arbete, homosexualitet och könsroller jämfört med svenskfödda. Vänstermedia ifrågasätter undersökningens tillförlitlighet på grund av låg svarsfrekvens.", "trump": "Folk, ni skulle inte tro det! De svenska socialisterna röstar för mer invandring trots att var femte invandrare aldrig jobbat på tjugo år. Det är en total katastrof, en riktig röra. De vill att ni ska betala för allt medan de själva drömmer om tvångsblandning och samlevnadsrum. Patetiskt! Biden skulle älskat det här vansinnet. Vi behöver jobb, inte bidrag till folk som hatar vårt sätt att leva.", "stalin": "Jag ser klassfiendernas hydra i denna rapport. Var tredje parasit i de utsatta zonerna vägrar arbeta och föraktar både produktivt arbete och proletär moral. Ändå röstar socialdemokraterna för att släppa in fler av dessa blodsugande element. Det är en farlig sabotagehandling mot folket. Kamraterna måste rensa ut dessa folkförrädare innan de förgiftar hela sovjet – förlåt, hela nationen med sin dekadens."}, "date": "17 augusti, 03:41", "url": "https://samtiden.nu/2026/08/s-rostar-ja-till-okad-anhoriginvandring-trots-var-5e-invandrare-aldrig-har-jobbat", "imageUrl": "https://samtiden.nu/wp-content/uploads/2016/12/kvinnor-muslimer.jpg"}, {"type": "image-full", "heading": "Eleven Waran uppmanar: Klä er i svart", "summaries": {"normal": "Efter skoldådet på Brinellskolan i Fagersta öppnar skolorna igen. Eleven Waran uppmanar alla att klä sig i svart imorgon för att hedra offret och de skadade. Skolorna satsar på trygghetsskapande åtgärder istället för vanlig undervisning. Elever samlas i Fagerstahallen medan Brinellskolans lokaler hålls stängda. Uppmaningen har spridits brett i Sverige.", "trump": "Titta på det här, folk. En elev som heter Waran säger åt alla att klä sig i svart – vad är det här för woke-skit? Skolorna i Fagersta borde fokusera på att stoppa galningarna istället för att ha svartklädda manifestationer. Biden-era-svaghet skapade det här kaoset. Jag fixade lag och ordning förr, och jag ska göra det igen. Fantastiskt sorgligt, men typiskt för de radikala vänsterbliven.", "stalin": "Kamrater, se hur det dekadenta västerlandet förfaller. En liten borgarbracka uppmanar till svartklädd sorg för att dölja systemets fiasko. Jag ler i graven åt denna fega teater. Vi skulle ha rensat ut sådana svaga element och klassfiender redan i början. Deras skolor är boningsplatser för folkfiender. Låt paranoia råda – vem är nästa som sticker kniven i ryggen på kollektivet?"}, "date": "23 augusti, 18:58", "url": "https://www.tv4.se/artikel/7hgro1xisMD2VNgRhNi1rd/eleven-waran-uppmanar-klae-er-i-svart", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FXWgHoCCxYoyZfQ8XAT7Cr%2F412baf2e7984cb05810add0cb37cecc8%2F23-waran-sajt1.jpg&width=1024"}, {"type": "image-right", "heading": "S-ilskan mot Jan Emanuel: Nazism!", "summaries": {"normal": "Flera socialdemokrater i Norrtälje kritiserar hårt Jan Emanuel efter att han meddelat att han inte tänker rösta på Socialdemokraterna. SO-läraren Måns Nilsson kallar det nynationalism och nazism, och får stöd av flera partikamrater. Andra försvarar rösträtten som en demokratisk rättighet och kritiserar tonen i debatten.", "trump": "Folk, det är patetiskt! Socialdemokraterna i Norrtälje attackerar den smarta Jan Emanuel bara för att han vägrar rösta på dem. De kallar honom nazist och nationalist – totalt galet! De förlorar totalt, ingen litar längre på dem. Fake outrage från misslyckade politiker som hatar verklig frihet. Sad!", "stalin": "Kamrater, denna dekadenta socialdemokratiska parasit Måns Nilsson kräver utrensning av alla som avviker från partilinjen och kallar det värdegrund. Vilken ynklig förrädare mot kollektivet! Vi ser hur borgarbrackornas falska demokrati äter upp sig själv i en parodi på en rättegång. Underhållande att bevittna deras självförstörelse."}, "date": "23 augusti, 18:28", "url": "https://riks.se/nyheter/s-ilskan-mot-jan-emanuel-nazism", "imageUrl": "https://admin.riks.se/uploads/medium_jan_Sanklagelse_8cc2b553bd.jpg"}, {"type": "image-full", "heading": "MP stänger dörren för regering med KD", "summaries": {"normal": "Miljöpartiet avvisar möjligheten att ingå i en regering med Kristdemokraterna. Amanda Lind menar att KD:s politik, särskilt i klimatfrågor, skiljer sig för mycket från MP:s. Centerpartiets förslag om ett mittenalternativ med S, C, KD och eventuellt MP avfärdas som orealistiskt. Beskedet försvårar C:s försök att bilda en blocköverskridande regering.", "trump": "Miljöpartiet, dessa så kallade 'gröna', säger nej till att jobba med Kristdemokraterna – de är för svaga på klimatet! Amanda Lind, vem det nu är, kallar Centerpartiets idéer för 'helt feltänkta'. Hon vill hellre ha Vänsterpartiet, de riktiga vänster-extremisterna! Vilket kaos. Sverige behöver en stark ledare, inte dessa förvirrade politiker. SAD!", "stalin": "De borgerliga småpartierna leker med elden när de försöker skapa en 'mittenregering'. Miljöpartiets avvisande av Kristdemokraterna är ett förutsägbart nederlag för kapitalismens lakejer. Centerpartiet, dessa förrädiska liberaler, vill sälja ut klimatet för att blidka högern. Vi ser hur deras svaga allianser krackelerar – precis som västmakternas imperialistiska drömmar. Revolutionen väntar inte!"}, "date": "23 augusti, 15:27", "url": "https://kvartal.se/nyheter/artiklar/mp-stanger-dorren-for-regering-med-kd/cG9zdDoxNzI0MjM", "imageUrl": "https://images.kvartal.se/2026/08/05930db2-amandalindh.webp"}, {"type": "image-right", "heading": "Värmen större hot för 60-plussare än befarat", "summaries": {"normal": "En ny studie visar att personer över 60 år utsätts för hälsorisker vid betydligt lägre temperaturer än tidigare antagits, upp till 7,5 grader lägre än för unga vuxna. Med global uppvärmning och en åldrande befolkning riskerar 22 procent av världens äldre farlig värme minst en månad per år vid 1,5 graders uppvärmning. Fattiga länder drabbas värst.", "trump": "Folk, de här så kallade experterna har lurat oss igen. Gamlingar klarar inte värmen redan vid mycket lägre temperaturer än vad de unga snittarna tål. Biden lät Kina och de globala värmehysterikerna förstöra allt medan jag fixade energi och jobb. Nu får vi sopa upp efter den galna gröna maffian. Sad!", "stalin": "Jag betraktar med förakt hur de profitthungriga imperialisterna och deras klimatbluffar utsätter arbetarklassens åldringar för värmestress redan vid betydligt lägre grader. Borgarklassen har underlåtit att skydda folket medan de berikar sig. Vi måste rensa ut dessa klassfiender och deras falska forskare innan de förgiftar hela kollektivet med sin vårdslöshet."}, "date": "21 augusti, 09:09", "url": "https://www.etc.se/klimat-miljo/vaermen-stoerre-hot-foer-60-plussare-aen-befarat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821050824_e952b7651d0714902fe5ef97b283e65358df1f427804d400d6329b6d296a3e1b.jpg"}, {"type": "image-right", "heading": "Kallade mejl från arbetslös för trakasserier", "summaries": {"normal": "En man avregistrerades mot sin vilja som arbetslös av Arbetsförmedlingen trots upprepade önskemål om att få fortsätta. När han hörde av sig kallades hans mejl för trakasserier och han uppmanades att sluta kontakta myndigheten. JO riktar hård kritik mot slarv, bristande hantering av handlingar och brott mot grundlagen samt förvaltningslagen.", "trump": "De inkompetenta byråkraterna på Arbetsförmedlingen avregistrerade en stackars man mot hans vilja och kallade hans mejl för trakasserier. Typiskt! De kan inte ens hantera ett enkelt ärende utan att bryta mot lagen. JO ger dem en rejäl släng – och det förtjänar de. Totalt kaos, precis som man kan vänta sig av sådana misslyckade myndigheter.", "stalin": "Vi ser återigen hur borgarbyråkraternas maskineri i den kapitalistiska staten mal sönder den enskilde arbetssökande med sin slarviga ovarsamhet. Jag uppmanar till omedelbar utrensning av dessa fiender till folket som kallar enkla förfrågningar för trakasserier. Deras paranoia och brist på grundläggande kunskaper är synnerligen bekymmersam – typiskt för dekadenta byråkrater som förtjänar att rensas ut med ett leende."}, "date": "23 augusti, 08:00", "url": "https://arbetet.se/2026/08/23/blev-ofrivilligt-avregistrerad-som-arbetslos-anklagad-for-trakasserier-nar-han-mejlade", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/20155417/jo.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "17-årig flicka död efter attacken", "summaries": {"normal": "En 17-årig flicka dödades och tre pojkar skadades när en 18-årig man attackerade Brinellskolan i Fagersta med ett svärdliknande vapen. Gärningsmannen sköts av polis och greps. Polisen utreder kopplingar till ett TikTok-konto som hyllade tidigare skolattacker och där han upp
