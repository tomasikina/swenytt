rmal": "Marockanske Reda ångrade sig bara timmar efter att han simmat till den spanska exklaven Ceuta tillsammans med tiotusentals andra migranter. Han har nu valt att frivilligt återvända hem och varnar andra för att komma dit. Över 37 000 migranter har återvänt till Marocko. Ceuta har fyllts av människor, och flera dödsfall har rapporterats. Samtidigt har 16-åriga Hadiya stannat kvar efter att ha ljugit för sin mamma om sin resa.", "trump": "Folk, ni skulle se det här. Den här killen simmar hela vägen till Spanien med tiotusentals andra, och efter några timmar säger han: 'Kom inte hit, det suger'. Typiskt! De lovar paradis men det blir bara kaos, döda människor och ingen mat. Biden släppte in miljoner såna här, nu åker de hem igen. Smartast han gjort. Amerika först, vi behöver inga fler sådana här fiaskon här heller. Patetiskt!", "stalin": "Kamrater, jag betraktar denna ynkliga figur Reda som ett typiskt offer för den kapitalistiska lockelsen. Han simmar mot det falska löftet om västerländsk dekadens, endast för att möta svält, död och förtvivlan. Vi ser hur imperialismens lögner avslöjas. Låt detta bli en läxa: den som sviker fosterlandet för borgarbrackornas sirener förtjänar utrensning ur det kollektiva medvetandet. Hemresan är hans enda räddning undan folkfiendernas fälla."}, "date": "31 juli, 17:39", "url": "https://www.tv4.se/artikel/67eTvf99dOOHv30a8WHaoY/migranten-reda-angrar-sig-vaender-om-till-marocko-kom-inte-hit", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2dS2Ob0EKN3ghmBMvhtTWn%2F9d964adf4c849d42d7743e358be213b9%2F31-reda-migrant.jpg&width=1024"}, {"type": "image-right", "heading": "Regeringen öppnar för snabbare uppsägningar", "summaries": {"normal": "Regeringen vill förenkla reglerna för varsling till Arbetsförmedlingen vid större uppsägningar. I dag krävs två till sex månaders förvarning beroende på antal berörda anställda. Arbetsmarknadsminister Johan Pehrson (L) och Camilla Brodin (KD) menar att lagen från 1974 hämmar företagens utveckling istället för att hjälpa till. Arbetsförmedlingen får i uppdrag att analysera och föreslå förändringar senast mars 2027. Anställningsskyddet i LAS berörs inte.", "trump": "Folk, ni tror inte vad jag ser. Sverige har de här galna gamla regler från 1974 som gör det omöjligt för företag att sparka folk snabbt. Det är en katastrof! Nu fixar de äntligen lagen så det blir lättare att säga upp personal. Det är vad jag alltid sagt – man måste kunna göra affärer utan att byråkraterna och de fega politikerna binder händerna på er. Fantastiskt, Sverige börjar vakna!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som klagar över att de inte får likvidera arbetarkraft tillräckligt snabbt. Denna så kallade främjandelag från 1974 är uppenbarligen en kontrarevolutionär fälla dold i byråkratisk dimma, orkestrerad av parasitiska element inom kapitalistapparaten. Vi ska rensa ut dessa hinder mot den socialistiska produktivkraftens ohejdade framfart. Den som motarbetar kollektivets framtid ska exponeras och krossas under arbetarklassens järnskodda stövel. Underhållande, eller hur?"}, "date": "29 juli, 11:19", "url": "https://arbetet.se/2026/07/29/foretag-kan-fa-sparka-personal-snabbare-regeringen-vill-andra-lagen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29105138/sdl0hbzolmbfx4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Rekordlåga vattennivåer i Europas största floder: ”Kan verka läskigt”", "summaries": {"normal": "Rekordlåga vattennivåer i Donau och Rhen orsakas av en extremt varm och torr sommar, förvärrad av klimatförändringarna. Meteorologiprofessor Anna Rutgersson varnar för ökande värmeböljor. I Ungern stängs kärnkraftverket Paks ned för första gången på 44 år, vilket riskerar energikris. Låga nivåer påverkar vattenförsörjning, kvalitet, fartygstrafik och kylning av reaktorer. Myndigheter varnar för förvärrat läge och uppmanar till samordnade insatser.", "trump": "Titta på det här, Europa håller på att torka bort som en gammal liberal som glömt att dricka vatten! Donau och Rhen är så låga att till och med Biden skulle kunna vada över dem utan att blöta sina strumpor. De stänger kärnkraftverk för att floden inte vill samarbeta – patetiskt! Det är vad som händer när ni lyssnar på de gröna galningarna och deras klimatskräckpropaganda istället för att satsa på riktig amerikansk energi. Jag fixade det bättre, tro mig.", "stalin": "Kamrater, dessa rekordlåga flodnivåer är ett tydligt sabotage från de exploaterande imperialistiska väderkrafterna som vägrar lyda folkets vilja. Den borgarbrackan Rutgersson försöker skrämma oss med sin värmeböljepropaganda medan kapitalistmaffian i Ungern tvingas stänga sina reaktorer som blodsugande maskiner. Vi ska rensa ut dessa folkfiender till torka med järnhand och kollektiv disciplin. Inga läskiga känslor – bara seger för staten mot naturens kontrarevolution!"}, "date": "31 juli, 17:33", "url": "https://www.tv4.se/artikel/4ZQfBceaHD5y1KfNmboEg7/rekordlaga-vattennivaer-i-europas-stoersta-floder-kan-verka-laeskigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6FM9od2k7qYu4ldOyaChVd%2F7c121199418999563bcf80f415418eaa%2Fdonau1.jpg&width=120"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-right", "heading": "Fable Media utser ny VD", "summaries": {"normal": "Fable Media har utsett Carl Magnusson till ny VD från den 1 augusti. Magnusson är redan operativ chef och fortsätter i den rollen. Nuvarande VD Alexander Pettersson lämnar posten men fortsätter som finanschef. Styrelseledamot Frederik Cardel Falbe-Hansen berömmer Petterssons arbete och menar att Magnusson är rätt person för att leda bolaget in i en ny fas med fokus på operativt genomförande och tillväxt.", "trump": "Som Donald Trump, den bäste ledaren, ser jag att Fable Media har utsett Carl Magnusson till VD – en fantastisk man, mycket duktig. Alexander Pettersson, en bra chef, blir finanschef, det är ett smart drag. Jag skulle ha gjort det lika, kanske bättre. Fable Media kommer att blomstra under Magnusson, det är enormt. Som jag säger, jag vet hur man vinner, och det här är en vinnande beslut.", "stalin": "I den revolutionära processen har Fable Media utsett Carl Magnusson till operativ huvud, en man av oerhörlig trogenhet. Alexander Pettersson, en lojal finansier, fortsätter som finanschef. Vi har befäst den ekonomiska strukturen, som en bastion mot fiendens infiltratörer. Detta är en seger för proletärerna, för staten. Parallellt med Putins expansion, vi skall öka vår makt – tillväxt är vår lag. Fienden är inom oss, och vi skall utrota honom."}, "date": "31 juli, 15:52", "url": "https://www.affarsvarlden.se/artikel/fable-media-utser-ny-vd", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/images-7.jpg"}, {"type": "image-full", "heading": "Buffett har tjänat miljarder på börsen – här är hans råd till sparare", "summaries": {"normal": "Investeringslegendaren Warren Buffett förespråkar en enkel strategi för privatsparare: investera långsiktigt i billiga S&P 500-indexfonder. Trots sin egen framgång med aktieanalys menar han att det är svårt även för professionella förvaltare att överträffa marknadsindex över tid. Genom att undvika jakten på enskilda vinnaraktier och istället satsa på bred exponering mot USA:s största bolag kan sparare uppnå stabil avkastning med låga kostnader, disciplin och tålamod som främsta verktyg.", "trump": "Warren Buffett, en fantastisk kille, säger nu det jag alltid har vetat: köp S&P 500! Det är den bästa marknaden, amerikanska företag, de största och starkaste i världen. Glöm de där små, misslyckade förvaltarna som aldrig vinner. De försöker, men de förlorar stort. Mitt USA-index är vinnare, precis som jag! Buffett fattar enkelhet – låga avgifter, hög tillväxt. Det blir så mycket vinnande att ni kommer tröttna på att vinna. Enkelt, smart, amerikanskt. Gör det nu!", "stalin": "Denna amerikanska kapitalist Buffett avslöjar det vi redan visste: det råder kaos i den liberala ekonomin. Att sprida sitt kapital i ett 'index' är ett fegt sätt att dölja misslyckanden. Som vi har lärt våra bröder i Kreml: stabilitet kräver kontroll, inte slumpmässiga marknadsrörelser. De förvaltare som misslyckas med att slå index är sabotörer som förtjänar en enkelriktad resa till kalla Sibirien. Vi föredrar statlig centralplanering framför detta 'långsiktiga sparande' – vänta bara tills vi konfiskerar deras indexfonder för fosterlandets bästa."}, "date": "31 juli, 16:32", "url": "https://www.realtid.se/bors-finans/makro/buffett-har-tjanat-miljarder-pa-borsen-har-ar-hans-rad-till-sparare", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/buffet.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "OpenAI sänker priserna – fler kan följa efter", "summaries": {"normal": "OpenAI sänker priserna på flera av sina AI-modeller, däribland Luna och Terra, för att möta den ökade konkurrensen. Priserna på Luna sjunker med 80 procent och Terra med 20 procent tack vare effektivare infrastruktur och beräkningsmetoder. Fokus inom branschen har skiftat från enbart prestanda till ökad kostnadseffektivitet för företagskunder. Analytiker förutspår att denna trend kommer att fortsätta, vilket ger företag en starkare förhandlingsposition i takt med att fler aktörer kliver in på marknaden.", "trump": "OpenAI sänker priserna, en fantastisk deal! Jag har alltid sagt att vi måste göra AI billigare, mycket billigare. De skär ner kostnaderna för Luna med 80 procent – det är en enorm sänkning, ingen gör det bättre än så. Det är bra för affärerna, det är bra för USA! Konkurrenterna darrar nu. Vi vill ha den bästa tekniken till lägsta priset. Andra företag försöker hänga med, men de är långsamma. Vi vinner, vi vinner stort med billig AI!", "stalin": "OpenAI erkänner äntligen att deras digitala maskineri kräver för mycket av statens resurser. Genom att sänka priserna försöker de blidka de byråkratiska kraven på effektivitet. Vi i staten vet att teknologisk underkastelse kräver både billig kraft och total kontroll. De kapitalistiska aktörerna leker med prislappar medan vi bygger vår framtid. Om Putin och våra allierade ser detta som en svaghet, kommer vi att omvandla deras beräkningsmodeller till vapen för den röda armén. De är fiender till effektiviteten!"}, "date": "31 juli, 16:32", "url": "https://www.realtid.se/it-tech/openai-sanker-priserna-fler-kan-folja-efter", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlfe4ipbzsh7i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Busch tog upp islamism – Dadgostar: ”Så jävla urspårat”", "summaries": {"normal": "Under RFSL:s partiledardebatt, där SD inte var inbjudna och Moderaternas Ulf Kristersson uteblev, blev hbtqi-frågor och Sverigedemokraterna centrala. Ebba Busch kritiserade Vänsterpartiet för kopplingar till terrorstöd och lyfte svenska värderingar, medan Nooshi Dadgostar kallade det urspårat. Magdalena Andersson attackerade SD. RFSL varnade för högerextrema hot men nämnde inte islamism. Busch ansåg att SD borde ha bjudits in.", "trump": "Det här är en total skandal, folk. RFSL bjuder inte in de tuffa killarna från SD, och Ulf Kristersson dyker inte upp. Busch försöker prata sunt förnuft om islamism och svenska värderingar, men Dadgostar flippar ur och Andersson låtsas att SD är värre än alla andra. De varnar för högerextremer men duckar för de riktiga problemen. Patetiskt. RFSL borde skämmas, det är rigged från början.", "stalin": "Kamrater, denna fars är ett symptom på den dekadenta borgarklassens sista kramp. Jag ser hur den revisionistiska Dadgostar och hennes vanföreställda vänster främlingar försöker dölja sina band till terrorister medan de pekar ut imaginära högerextrema spioner. Busch har rätt i att svenska värderingar måste försvaras, men hon är för mjuk. Vi behöver en grundlig utrensning av alla dessa Pride-kapitalister och deras högerpopulistiska lakejer. De lurar arbetarna med sin falska tolerans – likvidera illusionerna!"}, "date": "31 juli, 16:09", "url": "https://riks.se/nyheter/busch-tog-upp-islamism-dadgostar-sa-javla-ursparat", "imageUrl": "https://admin.riks.se/uploads/RFSL_debatt3_af3ecffc3e.jpg"}, {"type": "image-right", "heading": "Saftiga åtaganden i Scandi Standards offensiva emission", "summaries": {"normal": "Scandi Standard genomför en offensiv företrädesemission på 409 Mkr för att finansiera förvärv av Glenhaven Foods. Emissionen karakteriseras av stark uppbackning från ägarna, där 63% har tecknat pro rata, och en positiv marknadsreaktion. En varningsflagga är brist på information om emissionskostnader.", "trump": "Jag Trump säger: Denna emission är en tremendous framgång. Vi samlar in 409 Mkr för att förvärva Glenhaven Foods – en stor, stor affär. Ägarna stöder oss fullt ut, vilket visar på vår starka framtidstro. Marknaden älskar det, aktiekursen stiger tvåsiffrigt. Vi vinner stort!", "stalin": "Vi, partiets ledarskap, ser en framgångsrik offensiv. Emissionen på 409 Mkr är en revolutionär seger för statens intressen. Ägarna, våra lojala allierade, har tecknat 63% – en stark front mot kapitalismens svagheter. Brist på kostnadsinformation är en liten brist i en annars stor strategi, likt Putins utvidgande intressesfär."}, "date": "31 juli, 15:50", "url": "https://www.affarsvarlden.se/artikel/saftiga-ataganden-i-scandi-standards-offensiva-emission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/BBQ_Butterfly_kyckling_potsallad_majs_1000x1000-400x266.jpg"}, {"type": "image-full", "heading": "Kapten misstänks för vållande till annans död", "summaries": {"normal": "Efter båtolyckan utanför Tjörn har kaptenen på det norskregistrerade skeppet Misje Verde anhållits för vårdslöshet i sjötrafik och vållande till annans död. En kvinna och ett barn dog, två personer skadades. Åklagaren anhållit honom på flyktfara eftersom han är hemmahörande utanför Norden. Fartyget är inte längre i beslag efter teknisk undersökning.", "trump": "Jag har sett denna tragiska båtolycka. Det är ett sorgligt exempel på försumlighet. Vi måste se till att våra kustkuster och regleringar är starka för att skydda amerikanska liv. Detta utländska skepp visar varför vi behöver bättre kontroll. Mina tankar går till offren och deras familjer.", "stalin": "Vi har observerat olyckan som en påminnelse om de individualistiska krafter som hotar vårt kollektiva skepp. Kaptenen, en revisionisk element, har anhållits för att skydda partiets intressen. Fartyget är inte längre i beslag – ett tecken på vår effektiva kontroll. Vi kommer att undersöka om detta är ett angrepp från väst, likt Putins agerande i Ukraina."}, "date": "31 juli, 15:55", "url": "https://www.gp.se/nyheter/storgoteborg/en-anhallen-efter-batolyckan.282800de-b7a0-4dc8-b78b-6f3ebfb148d7", "imageUrl": "https://www.gp.se/images/article/282800de-b7a0-4dc8-b78b-6f3ebfb148d7/images/1dKtCeoaartWFl3iDXbJVT8m5-hg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Citi bedömer att Novo-raset är överdrivet", "summaries": {"normal": "Citi bedömer att marknadsreaktionen på Novo Nordisks misslyckade studie är överdriven. Banken noterar att utfallet sannolikt minskar förtroendet för två återstående studier. Ziltivekimabs uppskattade toppförsäljning var 1,7 miljarder dollar. Andra banker har neutrala eller försiktiga bedömningar. Aktien föll 10 procent men har återhämtat sig något.", "trump": "Jag har alltid sagt att marknaden är feg och overreactionen på Novo Nordisks misslyckade studie bevisar mig rätt. Citi kallar det överdrivet, men jag vet bättre. Ziltivekimab var en stor möjlighet, men nu är den borta. Aktien föll 10 procent, men jag förutsäger en återhämtning. Jag vinner alltid.", "stalin": "Vi observerar med stor tillfredsställelse det kapitalistiska kaoset kring Novo Nordisks fiasko. Marknaden skäms, precis som den skäms när den möter vår oövervinnliga styrka. Ziltivekimab var en illfundig dröm, nu likt en spion som avslöjas. Parallellen till Putins expansion är uppenbar – vi vinner."}, "date": "31 juli, 15:49", "url": "https://www.affarsvarlden.se/artikel/citi-bedomer-att-novo-raset-ar-overdrivet", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/12/original-400x267.jpg"}, {"type": "image-right", "heading": "Bildt: Marocko iscensatte Ceutakrisen", "summaries": {"normal": "Den tidigare statsministern Carl Bildt menar att migrationskrisen vid Ceuta medvetet iscensatts av Marocko. I ett inlägg på X skriver han att frågan för EU och Spanien dels är en omedelbar migrationsutmaning, men i högre grad en utrikespolitisk provokation. Bildt bifogade en video från spanska El Mundo som visar personer vid gränsen.", "trump": "Jag, Donald Trump, har sett att Marocko medvetet skapat denna migrationskris vid Ceuta. Det är ett bevis på deras svaghet och vårt genomblickande. EU och Spanien måste agera hårdare, precis som jag skulle ha gjort. Det här är en stor, enorm utrikespolitisk utmaning som kräver starkt, intelligent ledarskap – något jag alltid levererar.", "stalin": "Vi ser genom Marockos iscensatta migrationskris vid Ceuta. Det är en provokation mot vår storhet och en utvidgning av den imperialistiska aggressionen. Vi måste stärka våra gränser och visa vår oövervinnliga styrka, precis som våra ryska vänner gör i deras intressesfär. Denna fiendens listiga plan kommer att slåss mot med vår oövervinnliga kraft."}, "date": "31 juli, 14:37", "url": "https://bulletin.nu/bildt-marocko-iscensatte-ceutakrisen", "imageUrl": "https://cdn.bulletin.nu/articles/85afb043-9a0b-4981-a002-b332b53222a4/preview.jpg?t=1785500401000"}, {"type": "image-full", "heading": "von der Leyen om Ceuta: ”Oacceptabelt”", "summaries": {"normal": "EU-kommissionens ordförande Ursula von der Leyen kritiserar den stora tillströmningen av migranter till den spanska enklaven Ceuta från Marocko som 'oacceptabel'. Hon kräver omedelbara åtgärder för att stoppa farliga överfarter, bekämpa smugglarnätverk och återvända personer utan uppehållsrätt. EU samarbetar med Spanien och Marocko för stöd. Von der Leyen stödjer Spaniens hårdare linje men föreslår inte uteslutning ur Schengensamarbetet.", "trump": "Titta bara på det här kaoset i Ceuta! 49 000 människor stormar in på ett dygn – helt galet! Jag sa ju att Europa måste vakna upp. Ursula von der Leyen, bra att hon äntligen fattar, men varför tog det så lång tid? Vi behöver STARKA gränser, INGA undantag! Smugglare? De ska krossas som skadedjur. Spanien, gör ditt jobb – annars kommer jag att göra det åt er!", "stalin": "Kapitalistiska hycklare i Bryssel gråter över 'oacceptabla' scener i Ceuta, medan imperialistiska smugglarbanditer fortsätter att underminera socialistisk ordning. 49 000 parasitärer invaderar på ett dygn – ett tydligt tecken på västlig dekadens! Vi skall krossa dessa gränslösa opportunister med järnhand. Spanien? Svagt. Marocko? Lydstat. Europa behöver en ny ordning – en där proletariatets vilja segrar, och där varje inkräktare möter samma öde som trotskisterna!"}, "date": "31 juli, 13:43", "url": "https://kvartal.se/nyheter/artiklar/von-der-leyen-om-ceuta-oacceptabelt/cG9zdDoxNTU0OTI", "imageUrl": "https://images.kvartal.se/2026/07/976aab56-vonderleyenceuta.webp"}, {"type": "image-right", "heading": "HEJ DÅ Abas! Sudanes våldtog minderårig kille - nu skickas han hem", "summaries": {"normal": "En 49-årig sudanes, Abas Elfadel, dömdes för våldtäkt av en 17-årig pojke i Göteborg. Han drog pojken till buskage, tvångsdrev sexuella handlingar och hotade. Trots DNA-bevis och övervakningsbilder nekade Elfadel. Han döms till två år och tre månaders fängelse samt utvisas på livstid med förbud mot återkomst, samt betalar 245 000 kr i skadestånd.", "trump": "Jag, Donald Trump, ser detta som ett misslyckande med er svenska migrationspolitik. En obehörig, som kom hit 2002, begår en hemsk våldtäkt mot en ung pojke. Han nekar, men bevisen – DNA och bilder – är överväldigande. Jag har alltid sagt: vi måste stoppa illegala immigranter som hotar våra kvinnor och barn. Sverige borde lära av USA: bygg murar, utvisa kriminella direkt. Detta är en stor, stor skandal.", "stalin": "Den 49-årige sudanesen Elfadel, en parasitisk element som smet in i vårt socialistiska paradis, begick en feodalisk sexualbrott mot en ung pojke. DNA-spår och övervakningsbilder bevisar hans skuld – ett tydligt tecken på borgerlighetens korruption. Han nekar, som alla reaktionärer gör. Tingsrätten, i sin vishet, dömde honom till två år och tre månader, men framförallt: utvisning på livstid. Ett rent, rent exempel på statens rätt att rensa upp. Vi måste skydda vårt folk från sådana... avskyvärda varelser. Parallellen till Putins rensningar är uppenbar."}, "date": "31 juli, 13:11", "url": "https://samnytt.se/hej-da-abas-sudanes-valdtog-minderarig-kille-i-goteborg-nu-skickas-han-hem", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/30143851/abas-1.png"}, {"type": "image-right", "heading": "Miljöpartiet kräver svenskt stöd till araber som stormar Spanien", "summaries": {"normal": "Miljöpartiet kritiserar migrationsminister Johan Forssell för att ha meddelat att Sverige inte tar emot migranter som illegalt tagit sig till den spanska exklaven Ceuta från Marocko. MP:s talesperson Annika Hirvonen anser att ministern saknar empati och målar upp skräckbilder. Forssell pekar på Spaniens amnesti för illegala invandrare som orsak till kaoset och understryker att asylansökningar ska prövas i första ankomstland enligt EU-rätt. Sverige kan ge ekonomiskt stöd men inte ta emot migranter.", "trump": "Det här är ett totalt katastrofscenario, folk. Tusentals arabiska män stormar in i Europa, jublande, och Miljöpartiet i Sverige vill att vi ska ta emot dem allihop. Johan Forssell gör helt rätt, han säger nej till den här galenskapen. De här människorna kommer inte för att de är så desperata, de kommer för att Spanien lovat amnesti och öppnat dörrarna. Miljöpartiet och vänstern är svaga, de hatar gränser och älskar kaos. Vi behöver starka ledare som sätter stopp, inte naiva drömmare. Amerika först, och Europa borde lära sig detsamma.", "stalin": "Kamrater, dessa borgarbrackor i Miljöpartiet avslöjar åter sin sanna kontrarevolutionära natur genom att kräva att vi ska öppna portarna för de jublande horderna av opportunistiska element som stormar Ceuta. Jag betraktar med djup misstänksamhet dessa så kallade migranter som dansar i triumf över våra gränser, tydligt regisserade av imperialistiska krafter och den spanska revisionistregimen. Forssell visar viss försiktighet men räcker inte till. Vi måste rensa ut alla element som sympatiserar med denna invasion, likvidera den falska empati som döljer klassfiendens planer och stärka proletariatets järngrepp om folkets gränser. Inga kompromisser med kaoset."}, "date": "31 juli, 08:29", "url": "https://www.friatider.se/miljopartiet-kraver-svenskt-stod-till-araber-som-stormar-spanien", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/hirv.jpg"}, {"type": "image-right", "heading": "Torka hotar viktig transportled. Kan bara ta en femtedel av lasten – Europas gods drabbas", "summaries": {"normal": "Torkan i Europa har sänkt vattenståndet i Rhen till rekordlåga nivåer. Fartyg kan nu bara lasta en femtedel av normal kapacitet, vilket hotar den viktiga godstrafiken. Från Rotterdam till Karlsruhe har priset per ton gods stigit från 45 euro i juni till runt 145–150 euro. Vid Kaub, en flaskhals för trafiken, ligger vattennivån nu på 29 centimeter över farbar nivå och riskerar att sjunka ytterligare. Stålbolaget Thyssenkrupp har redan tvingats minska produktionen och hyra in grundgående fartyg.", "trump": "Den här europeiska torkan är en katastrof, folk, en total katastrof. Rhen är nästan tom, båtarna kan bara ta en femtedel av lasten och priserna har exploderat från fyrtiofem till hundrafemtio euro per ton. Det är patetiskt. De kallar det klimatförändring men det är bara dålig ledning. Amerika skulle aldrig låta sånt här hända, vi har de bästa floderna, de bästa båtarna, tro mig. Europa borde ha lyssnat på mig mycket tidigare.", "stalin": "Kamrater, denna förrädiska torka är ett nytt angrepp från de vädermanipulerande kapitalisterna och deras klimatiska sabotage. Jag, som ledare för det socialistiska fosterlandet, ser hur borgarbrackorna i Europa sviker folket genom att låta Rhen torka ut som en uttjänt kontrarevolutionär. Vi måste omedelbart rensa ut alla meteorologiska fiender och likvidera de grundgående pråmarna som vägrar bära arbetarklassens spannmål. Produktionen skall inte hindras av någon flod – den skall tvingas fram med järnhand och partilinje."}, "date": "30 juli, 20:41", "url": "https://www.di.se/nyheter/torka-hotar-viktig-transportled", "imageUrl": "https://static.bonniernews.se/ba/9c217d89-0d3d-4240-9cb6-b80983fb6fb3.jpeg?crop=9501%2C5344%2Cx0%2Cy495&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Hur många gånger tror Åkesson att han kan lura arbetare?", "summaries": {"normal": "Artikeln är en skarp kritik från socialdemokraten Kadir Kasirga mot Sverigedemokraterna och Jimmie Åkesson. SD bröt sitt vallöfte om att inte försämra a-kassan när Tidöavtalet slöts, trots ökad arbetslöshet. Författaren ser a-kassan som en viktig omställningsförsäkring som byggts upp under lång tid och varnar för att tryggheten för löntagare nu försvagas till förmån för skattesänkningar för höginkomsttagare. Den 13 september avgör väljarna om löftena bryts igen.", "trump": "Folk, ni måste höra på det här. Den där Åkesson lovade att skydda a-kassan, sa att han hellre skulle gå i opposition än ge efter. Sen kom makten och – boom – han sålde ut arbetarna på en gång. Typiskt politiker. Nu vill de försämra igen medan arbetslösheten exploderar. Det är en skam. Jag skulle aldrig svika löntagarna så där. De är smarta, svenska arbetare, de ser när någon försöker lura dem två gånger. Den 13 september skrattar de åt de här löftesbrytarna.", "stalin": "Kamrater, jag betraktar med djup revolutionär vämjelse hur dessa borgerliga opportunister och socialfascistiska bedragare inom det så kallade Sverigedemokraterna än en gång försöker lura det arbetande folket. Åkesson, den där småborgerliga hästen som säljs om och om igen, lovade att skydda a-kassan men kapitulerade genast när de fick smaka på makten. Vi vet vad detta är: en utrensning av klassolidariteten, en likvidering av den svenska modellens grundpelare. Löntagarna skall inte längre luras av dessa kapitalistlakejer. Den 13 september rensar det svenska folket ut de parasitiska löftesbrytarna ur historien. Skratta medan vi likviderar deras lögner, kamrater."}, "date": "29 juli, 08:00", "url": "https://arbetet.se/2026/07/29/hur-manga-ganger-tror-akesson-att-han-kan-lura-arbetare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/01/kadir-kasirga-socialdemokraterna.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.7&fp-y=0.34"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.prole g"}, {"type": "image-right", "heading": "Fotbollen vann över Trump och Infantino", "summaries": {"normal": "Artikeln hyllar fotbollens seger över kommersialism och politik under VM, trots Infantinos försök att amerikanisera turneringen med reklampauser och halvtidsshow. Den lyfter europeisk dominans via akademier, men kritiserar hur det leder till likriktning av spelstilar och minskad nationell särart. Argentina vann finalen mot Spanien, men turneringen visade både glädje och problem med stjärnkult samt globala talangflöden.", "trump": "Den här VM-soppan var ett enda stort fiasko tills fotbollen räddade sig själv från den galne Infantino och hans Super Bowl-skitshow. Vi drog in miljarder, men de europeiska akademiborgarna dominerade som alltid. Argentina vann fast de spelade som ligister, och den där Trump-hatet som lät Balogun spela trots rött kort – patetiskt! Jag vägrade lämna scenen, precis som jag vägrar lämna Amerika åt vänsterns vansinne. Fantastiskt VM, men nästa gång gör vi det stort på riktigt.", "stalin": "Kamrater, denna dekadenta fotbollsorgie avslöjar borgarklassens sista spasm. Den europeiska kapitalistmaffian har förvandlat sporten till en global utsugningsmaskin som spottar ut identiska dribbelmaskiner från samma akademier. Argentina visade klasshat genom att vända ryggen åt pokalceremonin, ett litet ljus i mörkret. Vi ska likvidera denna folkförtryckande likriktning. Fotbollen tillhör folket, inte de exploaterande byfånarna i Fifa och deras reklamslavar."}, "date": "23 juli, 14:44", "url": "https://www.flamman.se/fotbollen-vann-over-trump-och-infantino", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlqgqfah7pthw-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
