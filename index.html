a försvar. Låt oss rensa bort denna ruttna fläck från Sveriges karta!"}, "date": "25 augusti, 10:02", "url": "https://kvartal.se/nyheter/artiklar/ryskagd-fastighet-vid-musko-kan-tas-over/cG9zdDoxNzM2MDQ", "imageUrl": "https://images.kvartal.se/2026/08/87acd4c6-forsvar.webp"}, {"type": "image-right", "heading": "S lovar fria busskort upp till gymnasiet", "summaries": {"normal": "Socialdemokraterna presenterar ett klimatpaket med fria busskort för unga upp till gymnasiet på kvällar, helger och lov. Högskolestudenter får fria resor på studieorten under terminerna. Paketet innehåller även gröna kreditgarantier, stöd till gröna industrisatsningar, elektrifiering av transporter, investeringsstöd för bostadsbyggande och ett landsbygdslyft. Kostnaden anges till några miljarder kronor.", "trump": "Titta på de här svenska socialisterna som köper röster med gratis busskort till ungdomen. Patetiskt! De kallar det klimatpaket men det är bara mer skatter och vänstervridna mutor. Biden gjorde samma sak och förstörde ekonomin. Jag byggde den starkaste ekonomin i världen – de här förlorarna skulle inte ens klara av att driva en korvgrill utan att höja skatterna.", "stalin": "Se hur borgarbrackornas lakejer inom socialdemokratin försöker muta arbetarklassens ungdom med gratis busskort medan de förbereder nya attacker mot folkets intressen. Dessa profitthungriga blodsugare maskerar sina imperialistiska planer som klimatpaket. Vi känner igen dessa klassfiender. En utrensning av sådana folkförrädare vore på sin plats för att skydda kollektivet från deras lömska parasiterande."}, "date": "25 augusti, 11:53", "url": "https://www.tv4.se/artikel/tt-260825-slofte1-5a38d9f6/s-lovar-fria-busskort-upp-till-gymnasiet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdludiWv0mZuNI%2Fde1fdfafd489fa8f0da58561df6fc76a%2FSocialdemokraternas_klimat-_och_miljopolitiska_talesperson_asa_Westlund_och_den_ekonomisk-politiske_talespersonen_Mikael_Damber.&width=120"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-full", "heading": "Mohamsson kräver att vänstern agerar mot antisemitism", "summaries": {"normal": "Simona Mohamsson (L) attackerar S och V i en debattartikel för att vara oförmögna att hantera antisemitism. Hon bar davidsstjärnan i partiledardebatten och kräver skyddsklassning av synagogor. Varför kan vi aldrig prata om just antisemitismen, frågar hon syrligt.", "trump": "Jag ser Simona Mohamsson, en stor ledare, som bar davidsstjärnan – fantastiskt mod! Men vänstern i Sverige? En katastrof! De kan inte hantera hatet. Jag skulle fixa det på en dag, tro mig. Starka åtgärder, det är vad som behövs. Make Sweden safe again!", "stalin": "Kamrater, vi ser hur vänstern misslyckas med att rensa ut antisemitiska element. Mohamsson har rätt – partiet måste visa järnhand. De som hyllar övergrepp mot judar ska omgående omplaceras till Gulag. Inga frågor om Gaza, bara lydnad. Vi skyddar synagogor med våra liv!"}, "date": "25 augusti, 13:30", "url": "https://bulletin.nu/mohamsson-kraver-att-vanstern-agerar-mot-antisemitism", "imageUrl": "https://cdn.bulletin.nu/articles/924cfde1-2d1f-4afa-a7cb-8aac487e621d/preview.jpg?t=1787656821000"}, {"type": "image-right", "heading": "”Orättvist att företagaren får betala för ditt brutna ben i Åre”", "summaries": {"normal": "Artikeln kritiserar karensdebatten och pekar på en större orättvisa: att arbetsgivare tvingas betala sjuklön under de första två veckorna även när frånvaron inte beror på arbetsmiljön eller företagets fel. Småföretag drabbas särskilt hårt. Författaren menar att sjukfrånvaro främst är en samhällelig försäkringsfråga som inte bör läggas på arbetsgivarna.", "trump": "Folk, ni borde se det här! De pratar om karens och rättvisa, men den riktiga skandalen är att företagen tvingas betala när folk bryter benet i Åre eller fixar silikon. Det är en total katastrof för småföretagarna. Avskaffa karensen? Det blir bara fler lata dagar, högre priser och färre jobb. Patetiskt!", "stalin": "I denna dekadenta borgerliga karensdag debatt avslöjar sig den sanna parasitens ansikte: kapitalisterna som tvingas betala för arbetarnas knäskador i offpist och kosmetiska operationer. Vi, partiet och arbetarna, ser den sanna orättvisan. Låt oss rensa ut denna sjuka försäkringsmaskin som göder de lata och straffar de produktiva. Kamrater, det är tid för utrensning av sådana system!"}, "date": "25 augusti, 08:00", "url": "https://arbetet.se/2026/08/25/den-verkliga-orattvisan-i-karensen-foretaget-betalar-nar-du-bryter-benet-i-are", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/25070147/karl-ernlund-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Centerpartiets regeringslinje rymmer en svår motsättning", "summaries": {"normal": "Centerpartiet bör tydligt ange sina klimatpolitiska krav inför ett eventuellt regeringssamarbete. Inbjudan till Kristdemokraterna riskerar annars att bli enbart en borgerlig markering utan trovärdigt politiskt innehåll. Artikeln pekar på partiets dilemma att förena borgerlig identitet med höga klimatambitioner och betonar vikten av att fokusera på politikens faktiska riktning snarare än bara regeringskonstellationer.", "trump": "Centerpartiet borde sluta leka med de riktiga vinnarna och äntligen säga vad de vill med klimatet om de ska regera. Att bjuda in Kristdemokraterna är bara en svag markering, ingen bra deal. Utan tydliga krav blir det ett patetiskt försök att hålla sig borgerliga. Jag älskar starka ledare som säger som det är, inte dessa svenska förlorare som gömmer sig bakom vaga löften.", "stalin": "Jag kräver att Centerpartiet omedelbart offentliggör sina klimatpolitiska krav som villkor för samarbete. Annars framstår inbjudan till dessa kristdemokratiska element som en ynklig borgerlig markering, full av kontrarevolutionär dimma. Vi ser hur borgarbrackorna försöker maskera sin brist på enhetlig politik. Trovärdighet kräver klarhet, annars likviderar historien sådana svaga konstruktioner med ett leende."}, "date": "25 augusti, 01:49", "url": "https://www.dagensarena.se/opinion/centerpartiets-regeringslinje-rymmer-en-svar-motsattning", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-92-300x157.jpg"}, {"type": "image-full", "heading": "USA kan dra tillbaka 200 000 visum", "summaries": {"normal": "USA planerar att återkalla cirka 200 000 visum för personer som sökt asyl efter ankomst. Åtgärden berör två typer av korttidsvisum utfärdade de senaste tio åren. Nya sökande måste nu intyga att de inte avser söka asyl. Tidigare har 175 000 visum återkallats av andra skäl.", "trump": "Titta bara på det här – folk kommer hit på turistvisum och tror att de kan stanna för evigt! Jag ska stoppa det. 200 000 visum dras tillbaka, och nya regler gör det klart: USA är INTE ett hotell. Om du vill stanna, följ lagen. Vi tar tillbaka vårt land, en visumansökan i taget!", "stalin": "Kapitalistiska hycklare i Vita huset avslöjar sin sanna natur! De lockar arbetare med löften om frihet, för att sedan kasta ut dem som gamla tidningar. 200 000 visum återkallas – ett nytt rekord i imperialistisk grymhet. Men var lugna, kamrater: deras system är ruttet. Snart skrattar vi sist, medan deras murar faller som Berlinmurens spillror!"}, "date": "25 augusti, 06:25", "url": "https://kvartal.se/nyheter/artiklar/usa-kan-dra-tillbaka-200-000-visum/cG9zdDoxNzM0NTg", "imageUrl": "https://images.kvartal.se/2026/08/1b9a8636-trumpp.webp"}, {"type": "image-right", "heading": "Regeringens svar på skolattacken är ett hån", "summaries": {"normal": "Efter skolattacken i Fagersta kritiserar Arbetets politiska redaktör regeringen för att bara tillsätta en skoldådskommission. Trots år av nedskärningar, varningar om våld och bristande stöd till skolor ses åtgärden som för lite och för sent. Regeringen prioriterade skattesänkningar framför skolans behov, vilket bidragit till ökat våld och sämre elevstöd.", "trump": "Det här är en total katastrof, folk. Den svenska regeringen har misslyckats totalt med skolan, precis som de gör med allt annat. Nedskärningar, ignorans och nu en kommission? Patetiskt. De borde ha lyssnat på varningarna istället för att ge bort pengar till fel personer. Sverige behöver starka ledare, inte svaga ursäkter. Gör skolan stor igen!", "stalin": "Kamrater, denna fega borgarregim avslöjar sin parasitiska natur genom att svara på arbetarklassens lidande med en byråkratisk kommission. Jag har sett hur kapitalisterna rensar ut stöd till skolorna medan de göder de rika. Deras paranoia inför folkets vrede är underhållande. Vi ska likvidera sådana svagheter och stärka det kollektiva skyddet mot kontrarevolutionära element."}, "date": "25 augusti, 06:50", "url": "https://arbetet.se/2026/08/25/efter-skolattacken-i-fagersta-regeringens-svar-ar-ett-han", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/25065040/attack-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-right", "heading": "Tände eld på migrantboende 2015 – nu kandiderar han för S", "summaries": {"normal": "En man som 2015 tände eld på ett migrantboende för ensamkommande flyktingbarn i södra Sverige kandiderar nu för Socialdemokraterna i höstens val. Han medger händelsen, beskriver den som ett rop på hjälp under en svår tid som 15-åring och friades i domstol. Han säger att han förändrats som människa och inte har tänt eld på något sedan dess.", "trump": "Titta på det här! En kille som tände eld på ett migrantboende 2015 springer nu för Socialdemokraterna. Fantastiskt. Han säger att han förändrats, men folk ser ju vad som händer när man släpper in alla dessa personer utan koll. Sverige håller på att rasa ihop totalt. Sad! Mycket med den situationen, va? Patetiskt.", "stalin": "Kamrater, se hur den borgerliga dekadensen förgiftar samhället. En parasit från Afghanistan tände eld på ett kollektivt boende som ett fegt rop från den rotlösa ungdomen, friades av en svag domstol och smyger nu in i socialdemokratins revisionistiska led. Vi måste rensa ut sådana element innan de tänder eld på hela revolutionen. Underbart tragikomiskt."}, "date": "25 augusti, 14:10", "url": "https://riks.se/nyheter/tande-eld-pa-migrantboende-2015-nu-kandiderar-han-for-s", "imageUrl": "https://admin.riks.se/uploads/medium_s_kandidat_mordbrand_hero_d4268c354b.jpg"}, {"type": "image-right", "heading": "Dadgostar: Kommer inte fälla Magdalena Andersson", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar meddelar att partiet inte kommer att fälla en regering ledd av Magdalena Andersson. Hon utesluter inte att sitta i regering vid behov och är öppen för samarbete med Centerpartiet. Dadgostar ser inget troligt nyval i höst och betonar att partiet vill undvika en sådan situation.", "trump": "Titta på de här svenska kommunisterna som plötsligt blivit mjuka som smör. Den röda Dadgostar säger att hon inte tänker fälla sin väninna Andersson – vad en överraskning! De är så patetiska att de till och med vill krama Centerpartiets misslyckade globalister. Patetiskt, men typiskt för vänsterns svaga förlorarmentalitet. Vi har sett det förut.", "stalin": "Jag betraktar med förakt hur dessa opportunistiska revisionister dansar kring makten som fega klassförrädare. Dadgostar kryper för borgarbrackorna och vägrar nu rensa ut de socialdemokratiska parasiterna. Ett sådant svagt, förhandlande krypande förtjänar utrensning ur varje äkta arbetarparti. Kamrater, se hur revisionismen förråder folket igen."}, "date": "25 augusti, 08:05", "url": "https://www.tv4.se/artikel/6ygmPq8nP1Z6qsmFEmhSBx/nya-v-beskedet-kommer-inte-faella-magdalena-andersson", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2kwmmxNpeCv1k43Kl5544U%2F954f8e0229e06514b8b218aa43e64741%2F24-nooshi-webb.jpg&width=120"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Hoppets demonstration", "summaries": {"normal": "Över 50 000 personer deltog i söndagens stora klimatdemonstration i Stockholm, arrangerad av Naturskyddsföreningen och flera andra organisationer. Artikeln lyfter det folkliga stödet för radikal klimatpolitik, intervjuer från landsbygden som visar oro över förändrat väder och att fackföreningar nu ser klimatfrågan som en central arbetsmiljöfråga. Hopp skapas genom kollektiv handling.", "trump": "Hörni, jag älskar folkmassor och det här var tydligen en jättefolkmassa på 50 000 klimataktivister som vandrade runt med sina barnvagnar och plakat. Fantastiskt! Men de borde demonstrera mot Kinas föroreningar istället för att attackera vår underbara industri. De vill ha radikal politik? Mitt folk röstade på resultat, inte på hysteriska mammor och pappor med hemmagjorda hattar. Patetiskt!", "stalin": "Kamrater, jag ser med tillfredsställelse hur massorna marscherar mot de dekadenta kapitalisternas klimatförnekelse. Vi har rensat ut tvivlarna tidigare och skall göra det igen. Den folkliga rörelsen är ett vapen mot borgarbrackornas sabotage. Våra fackliga kamrater har rätt – klimatet är en klassfråga. Den som vägrar handla skall likvideras ur historien med ett leende. Hopp är kollektiv handling under partiets ledning."}, "date": "24 augusti, 21:40", "url": "https://www.dagensarena.se/opinion/hoppets-demonstration", "imageUrl": "https://www.dagensarena.se/files/2026/08/demonstration.jpeg"}, {"type": "image-right", "heading": "Fjällräven hotar stämma SD: \"Närmast identisk\"", "summaries": {"normal": "Fjällräven hotar stämma Sverigedemokraterna och kräver att partiet ändrar sin grafiska profil i valkampanjen \"Sverige på väg\". Företaget anser att den röda, rundade typsnittet är närmast identiskt med deras Arctic Fox-stil. SD avfärdar kravet som trams och meddelar att de inte tänker ändra kampanjen. Partiet har tid på sig till den 1 september.", "trump": "De där Fjällräven-typerna försöker stoppa mitt favoritparti SD med ett patetiskt stämningshot över lite röda bokstäver. Så typiskt för de svenska globalisterna – de hatar starka röster! SD gör rätt som skrattar åt det här tramsiga kravet. Fortsätt kämpa, ni vinner stort i valet, tro mig.", "stalin": "Jag betraktar med djup misstro dessa dekadenta borgarbrackor från Fjällräven som i sin parasitiska arrogans vågar hota det sanna folkets röst. Deras paranoiska jakt på likheter i bokstäver röjer klassfiendens fega sabotage mot arbetarklassens kampanj. Vi ska rensa ut sådana kapitalistiska hinder med järnhand och leda folket mot seger."}, "date": "25 augusti, 12:24", "url": "https://www.friatider.se/fjallraven-hotar-stamma-sd-narmast-identisk", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-748.jpg"}, {"type": "image-right", "heading": "Ett snällare samhälle är enda vägen", "summaries": {"normal": "Vilgot Österlund reflekterar över det senaste skoldådet på Brinellskolan i Fagersta. Han beskriver samhällets hårda krav som skapar utanförskap, psykisk ohälsa och våldsbejakande miljöer. Lösningen är ett mjukare samhälle med bättre stöd i skola, socialtjänst och arbetsmarknad. Förebyggande insatser är nödvändiga även om de inte alltid räcker.", "trump": "Folk, det är en katastrof! Sverige har blivit ett hårt, galet land där alla misslyckas och hamnar i gäng eller blir galna. De låser skolorna men mördarna kommer ändå in. Ni behöver en stark ledare som fixar det – inte detta mjuka, patetiska skitsamhälle. Make Sweden Great Again, det är vad jag säger!", "stalin": "I detta dekadenta borgerliga samhälle förpassas arbetets söner till utanförskapets mörker där de blir lätta offer för reaktionära impulser. Vi ska inte blunda för klassfiendens sabotage mot folkets enhet. Ett mjukare samhälle? Nej, kamrater – vi behöver en järnhård utrensning av alla som odlar svaghet. Den som sviker kollektivet förtjänar att skrattas ut i historien."}, "date": "24 augusti, 21:23", "url": "https://www.dagensarena.se/opinion/ett-snallare-samhalle-ar-enda-vagen-2", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidavilgot-576x1024.png"}, {"type": "image-full", "heading": "Försvaret vill tvångsköpa omtalad ryssfastighet i skärgården", "summaries": {"normal": "Fortifikationsverket har ansökt om att tvångsinlösa en fastighet vid Musköbasen som ägs av en rysk medborgare. Försvarsmakten anser att inlösen är nödvändig för att skydda marinbasen mot rysk drönarspaning och sabotage. Regeringen bereder nu ärendet, samtidigt som en bredare utredning om säkerhetskänsliga fastighetsköp pågår för att stärka rikets säkerhet i ett försämrat omvärldsläge.", "trump": "Sverige gör äntligen rätt! De vill ta tillbaka en viktig bas från ryssarna. Mycket smart. Ryska drönare? Inte på min vakt! De här fastighetsaffärerna är en katastrof, en total förlust för nationen. Jag har sagt det länge: man måste kontrollera vem som äger vad. Det är en enorm säkerhetsrisk. Starka beslut, mycket kraftfullt, precis så ska en nation skyddas!", "stalin": "Vi ser hur den ryska bourgeoisien försöker ockupera svensk mark för sina imperialistiska spion-lekar. En fastighet med utsikt över Muskö? Det är en parasitär utpost! Vi, staten, tolererar inte sådant förräderi mot säkerheten. Om de ryska sabotörerna tror att de kan köpa sig inflytande, då har de fel. Staten måste konfiskera allt. Det finns inget utrymme för sentimentalitet när moderlandet kräver total kontroll."}, "date": "25 augusti, 14:08", "url": "https://www.realtid.se/fastigheter/forsvaret-vill-tvangskopa-omtalad-ryssfastighet-i-skargarden", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/stridsbat.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Fjällräven hotar stämma Sverigedemokraterna", "summaries": {"normal": "Fjällräven hotar stämma Sverigedemokraterna eftersom deras kampanjtypsnitt påminner för mycket om företagets ”Arctic Fox”. Partiet har fram till 1 september på sig att byta typsnitt, annars vidtas rättsliga åtgärder. SD vägrar och kallar kravet för trams då typsnitt, färger och verksamheter skiljer sig åt.", "trump": "De där Fjällräven-typerna är totala förlorare som hotar stämma SD för ett typsnitt. Patetiskt! SD gör rätt som vägrar vika sig. Valrörelsen fortsätter, ingen backar ur för några kränkta snöbollar i ledningen. De borde fokusera på att sälja ryggsäckar istället för att trampa runt i politiken.", "stalin": "Jag betraktar detta som en typisk sabotagehandling från borgarbrackorna inom Fjällräven. De försöker med sina advokatfasoner likvidera arbetarklassens politiska uttryck. Vi ser igenom deras paranoia och trams. Kampanjen fortsätter oförändrad. Inga kapitalistiska typsnittsdiktat skall hindra partiets historiska framfart."}, "date": "25 augusti, 13:24", "url": "https://www.svt.se/kultur/fjallraven-hotar-stamma-sverigedemokraterna", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.23/0.42/7f2bd0bb9885446eafca2e32739481be9241b802c1bda68b27c83cd96042e9df"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-right", "heading": "Pareto: Försvarsindustrin ska växa 15% årligen", "summaries": {"normal": "Efter 30 års snålhet ska Europa äntligen rusta. Nato-länderna siktar på 3,5 procent av BNP till 2035, plus 1,5 för civilt försvar. Pareto spår 15 procents årlig tillväxt för försvarsindustrin 2025–2030 – även underleverantörer får häng med.", "trump": "Europa har snålat i 30 år – nu måste de betala! Jag sa ju det. 15 procent årlig tillväxt? Patetiskt. I USA gör vi mycket mer. Men bra att de äntligen lyssnar på mig. De ska upp till 5 procent av BNP – annars får de klara sig själva!", "stalin": "Kamrater, efter 30 år av sabotage från västliga kapitalister måste vi rensa ut underinvesterarna. Försvarsindustrin ska växa 15 procent årligen – annars blir det gulag för kontraktstillverkare. Partiet övervakar allt. Fiender som snålar med försvaret ska likvideras."}, "date": "25 augusti, 11:00", "url": "https://www.affarsvarlden.se/artikel/pareto-forsvarsindustrin-ska-vaxa-15-arligen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/SAAB_LOKE_251211_0453-400x267.jpg"}, {"type": "text", "heading": "Planen för Tyskland: Slopa euron och lämna Schengen", "summaries": {"normal": "AfD vill slopa euron och lämna Schengen. Partiet växer snabbt och ligger på 27 procent nationellt, över 40 i Sachsen-Anhalt. CDU vägrar samarbeta, men frågan om ett partiförbud splittrar. Tysklands politiska landskap skakar i grunden.", "trump": "Tyskland håller på att falla sönder – och jag sa ju det! AfD har rätt: euron är en katastrof. Jag älskar det! De stänger gränserna, precis som jag skulle göra. Tyskarna vaknar äntligen. Stort!", "stalin": "Kamrater, Tysklands borgerliga kaos är en välsignelse. AfD vill lämna euron och Schengen – bra, det försvagar kapitalismen. Men låt oss inte glömma: alla som inte är med oss är fiender. Vi rensar ut liberala råttor först, sedan AfD."}, "date": "25 augusti, 12:00", "url": "https://samnytt.se/planen-for-tyskland-slopa-euron-och-lamna-schengen"}, {"type": "image-full", "heading": "Ica-butik kräver stor förändring – beskedet till kunderna", "summaries": {"normal": "Personal på en Ica-butik i Grums har hittat allt från konservburkar, spik och sexleksaker till farliga kanyler i pantmaskinen. De vädjar nu till kunderna att bara panta burkar och flaskor. Felaktiga föremål orsakar driftstörningar, extraarbete och säkerhetsrisker. Problemet är inte unikt utan förekommer i flera butiker.", "trump": "Folk är så lata och galna att de slänger in kanyler, spik och sexleksaker i pantmaskinen. Totalt kaos! Ica-personal i Grums tvingas städa upp efter idioter. Det är en skandal. Vi behöver sundare amerikaner, eller svenskar, som fattar vad en pantmaskin är till för. Patetiskt!", "stalin": "Kamrater, jag ser med stigande vrede hur dekadenta element och latmaskar i folkets tjänst kastar kanyler, spik och andra borgerliga avfall i pantmaskinen. Detta sabotage mot det kollektiva systemet måste rensas ut. Vi tolererar inga fiender inom pantstationen. Ordning skall råda, annars likvideras slarvet med järnhand."}, "date": "25 augusti, 13:01", "url": "https://nyheter24.se/nyheter/konsument/1507586-ica-butik-kraver-stor-forandring-beskedet-till-kunderna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/8712936304b004a30200000000b004a302/2026/08/25/2386533/ica.jpg"}, {"type": "image-right", "heading": "Debatt: Norges statliga sjukvård har lett till apartheid för kvinnor", "summaries": {"normal": "KD vill förstatliga vården efter norsk modell för att stoppa postkodlotteriet. Men EU-data visar att Norge har större regionala skillnader i lungcancerdödlighet bland kvinnor. Ironiskt nog är det alltså Norge som har apartheid för kvinnor – inte Sverige.", "trump": "Jag ser att Norge har en statlig sjukvård som är katastrof. Kvinnor dör beroende på var de bor – det är inte bra! Sverige borde göra som vi i USA: sjukvård är en affär. Vi har bästa cancervården, alla vet det. Inget postnummerlotteri här!", "stalin": "Kamrater, regionerna är en fiende! De skapar ojämlikhet. Vi måste centralisera allt – men inte som Norge, där kvinnor dör efter postnummer. Deras sjukvård är kontrarevolutionär! Vi rensar ut regionerna, och alla får samma behandling om än i Gulag."}, "date": "25 augusti, 11:01", "url": "https://bulletin.nu/debatt-norges-statliga-sjukvard-har-lett-till-apartheid-for-kvinnor", "imageUrl": "https://cdn.bulletin.nu/articles/b27710f8-2585-4919-b278-a21216123d05/preview.jpg?t=1787648349000"}, {"type": "image-right", "heading": "USA godkänner marknadsföring av elva nya sorters vitt snus", "summaries": {"normal": "USA:s läkemedelsmyndighet FDA har godkänt elva nya sorter vitt snus från Swedish Match, Zyn Ultra, för marknadsföring. Produkterna bedöms kunna minska exponeringen för skadliga ämnen jämfört med cigaretter och annan rökfri tobak. Beslutet grundas på vetenskaplig granskning som väger nyttan för vuxna mot risker för ungdomar. Totalt har nu 43 produkter godkänts.", "trump": "Folket, det är fantastiskt! FDA har precis godkänt elva nya Zyn Ultra-snus från Swedish Match. De säger att det är mycket mindre skadligt än de gamla cigaretterna och den hemska tobaken. Smart drag, verkligen. Vi ersätter det dåliga med det bättre. Amerika vinner igen, tro mig, nikotinet är starkt och våra folk älskar det!", "stalin": "Kamrater, jag har noga granskat denna dekadenta FDA-beslut om elva nya nikotinprodukter. Det är en lysande utrensning av de gamla, giftiga borgarbrackornas cigaretter. Vi i partiet ser att det minskar skadliga ämnen för de produktiva massorna. Men akta er, fiendens spioner bland ungdomen lurar alltid i skuggorna. Segrande dialektik!"}, "date": "25 augusti, 12:51", "url": "https://riks.se/nyheter/usa-godkanner-marknadsforing-av-elva-nya-sorters-vitt-snus", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_25_T125113_651_9f8bb8f417.jpg"}, {"type": "image-right", "heading": "Mindre hemmajobb inte ovilja mot anställda", "summaries": {"normal": "Jonas Grafström argumenterar mot Romina Pourmokhtaris kritik av ökad kontorsnärvaro. Forskningen om distansarbete är splittrad: individuell produktivitet kan öka, men organisationsresultatet försämras ofta. Han pekar på utmaningar som ledarskap, integration av nyanställda, cybersäkerhet och risk för A- och B-lag. Hybridarbete har blivit normen och arbetsgivare bör själva avgöra vad som fungerar bäst.", "trump": "Folk, tro mig, den här Pourmokhtari har helt fel. Hon vill att alla ska gömma sig hemma och bli lata, men det funkar inte. Jag älskar när cheferna tar tillbaka kontrollen över sina kontor. De har lärt sig av de senaste fem åren, precis som jag alltid säger. Hybridarbete? Patetiskt. Vinnarna syns på kontoret, de andra förlorar. Make work great again!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen försöker förgifta produktiviteten med sina hemarbetsillusioner. Vi kräver järndisciplin och fysisk närvaro för att likvidera sabotage från A-lagets fiender och B-lagets parasiters. Den som gömmer sig bakom skärmen är en latent klassfiende. Endast genom kollektiv närvaro på arbetsplatsen kan vi krossa de västerländska dekadenta tendenserna och säkerställa seger för planen. Härligt."}, "date": "25 augusti, 13:55", "url": "https://www.di.se/debatt/replik-mindre-hemarbete-ar-inte-ovilja-mot-de-anstallda", "imageUrl": "https://static.bonniernews.se/ba/369ed2d2-05a1-4bf9-808c-3e1f3c2aeaba.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Stockholmsbörsen stiger – Ellos rapportfaller", "summaries": {"normal": "Stockholmsbörsen stiger 0,5 procent. Telekom leder, energi backar. Ellos faller efter rapport. Actic tappar fart. Zinzino rusar 13,5 procent. Astra Zeneca lånar miljarder. Industrivärden köper Essity. Aktiespararna gillar Storytel. ABB och Sandvik upp.", "trump": "Jag ser börsen upp 0,5 procent – fantastiskt, nästan lika bra som mina siffror! Telekom vinner, energi förlorar – jag älskar vinnare. Ellos faller, men Zinzino stiger 13,5 procent – enormt! Storytel ska köpas, alla ska köpa! Industrivärden köper Essity – smart, som jag. Allt är perfekt!", "stalin": "Kamrater, jag noterar att börsen stiger 0,5 procent – vi accepterar inga svagheter. Actic visar nederlag – vi rensar ut dess direktörer. Ellos faller – förhör dem. Zinzino ökar 91 procent – jag är nöjd. Astra Zeneca lånar – vi tar notis. Industrivärden köper – vi övervakar. Alla som inte lyder ska till gruvorna."}, "date": "25 augusti, 09:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stiger-ellos-rapportfaller", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/11/ellos-1200-400x267.jpg"}, {"type": "image-right", "heading": "Moderaternas reklamkupp polisanmäls av Stockholms stad", "summaries": {"normal": "Moderaterna tvättade fram budskap på övergångsställen i Stockholm, bland annat utanför S partihögkvarter. Stockholms stad kallar det klotter och har polisanmält kampanjen. Budskapen har sanerats bort. Partiet ville synas men fick städbesvär.", "trump": "Jag ser att Moderaterna i Sverige försöker tvätta fram sina budskap. Patetiskt! Jag skulle bara twittra – enorm respons, fantastisk. De blir polisanmälda för klotter. Helt otroligt, Sverige har problem. Jag fixar era gator bättre, tro mig!", "stalin": "Kamrater, dessa moderata tvättare försöker smyga in kontrarevolutionära budskap på våra gator. Vi rensar ut deras smuts med högtryckstvätt från partiet. De ska saneras som klotter, och deras ledare ska omskolas i en städbrigad. Ordning måste råda."}, "date": "25 augusti, 11:00", "url": "https://samnytt.se/moderaternas-reklamkupp-polisanmals-av-stockholms-stad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25073655/ett-brott.jpg"}, {"type": "image-right", "heading": "Behöver inte facket medlemmarna längre?", "summaries": {"normal": "Artikeln ifrågasätter fackföreningarnas roll i Sverige, med fokus på den långa och förvirrande strejken mot Tesla. Författaren kritiserar IF Metall för jojo-strejk, centralisering och distans till medlemmarna. Han undrar om den svenska modellen är hotad eller om en ny, mer lokal facklig kamp kan växa fram. (58 ord)", "trump": "Lyssnar ni på det här? Facket i Sverige har blivit en total katastrof, precis som våra egna unionsbönder här hemma. Jojo-strejk mot Tesla, folk får sparken och facket sover. De har glömt medlemmarna och blivit en massa byråkrater. Den svenska modellen? Den dör om de inte vaknar. Sad! Men kanske föds en riktig rörelse nu. (59 ord)", "stalin": "Jag betraktar detta med djup misstro. Fackföreningarna har förvandlats till passiva redskap åt borgarklassen och dess lakejer inom socialdemokratin. Jojo-strejk och centralisering har kvävt den äkta arbetarkampen. Kanske är det bra att strejken förlorades. Ur askan kan en sann, lokal och revolutionär rörelse uppstå som rensar ut alla folkfiender och klassförrädare. (59 ord)"}, "date": "21 augusti, 09:19", "url": "https://proletaren.se/artikel/behover-inte-facket-medlemmarna-langre", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/teslakronika-768x432.jpg"}, {"type": "text", "heading": "Med full fart ut för stupet", "summaries": {"normal": "Artikeln kritiserar att alla riksdagspartier nu stöder Nato-medlemskap och DCA-avtalet med USA, som ger amerikanerna tillgång till 17 svenska militärbaser. Författaren menar att Sverige därmed saknar fredliga alternativ i riksdagen och har integrerats i USA:s militära struktur efter Rysslands invasion av Ukraina.", "trump": "Vilken katastrof! De svenska svaga ledarna, både de röda och de nya, har sålt ut landet till vår fantastiska Nato-maskin snabbare än Sleepy Joe kunde säga fel. Nu finns inga riktiga fredspartier kvar, bara krigspartier som älskar att spendera miljarder på baser åt oss. Patetiskt! Men hey, bra deal för Amerika.", "stalin": "Jag betraktar med djup förakt hur dessa kapitalistlakejer och folkförtryckare i sin borgerliga riksdag har kapitulerat fullständigt inför Nato-imperialismen. Inga verkliga motståndare återstår, endast krigshetsande hyenor som rullar miljarder till militären. En klassisk utrensning av alla fredsvänner har skett – typiskt för dekadenta västliga klassfiender."}, "date": "21 augusti, 08:00", "url": "https://proletaren.se/artikel/med-full-fart-ut-for-stupet"}, {"type": "image-full", "heading": "Svaret till Trump: ”Kyss mig i röven”", "summaries": {"normal": "Trump hotar Kanada med 50% tullar. Ontarios premiärminister Doug Ford svarar blixtsnabbt i radio: ”Kyss mig i röven”. Han backar inte – kallar Trump för mobbare och förlorare. Trump svarar på Truth Social och kallar Ford ”lakej”. Handelskonflikten trappas upp.", "trump": "Jag hotar Kanada med 50% tullar – och vad får jag? En lakej som säger ”kyss mig i röven”. Doug Ford, den mindre intelligente brodern till en före detta borgmästare. Han har mer mod i lilltån? Skrattretande. Min administration vinner ändå. Stora tullar, stora segrar!", "stalin": "Kamrater, en ny fiende: Ontarios lakej Ford vågar förolämpa vår handelspolitik. Vi ska rensa ut sådana imperialistiska mobbare. Tullar är bara början – elavgiften? En kontrarevolutionär handling. Ford ska omplaceras till en lämplig anläggning i Sibirien. Partiet ser allt."}, "date": "25 augusti, 11:53", "url": "https://www.gp.se/nyheter/varlden/svaret-till-trump-kyss-mig-i-roven.8345a903-d261-41ec-9ed3-a050b72040a0", "imageUrl": "https://www.gp.se/images/article/8345a903-d261-41ec-9ed3-a050b72040a0/images/1c_MyEIoxXbBU5ZITWsB9kXYC_AE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "SD vill subventionera 100.000 Sverigehus", "summaries": {"normal": "Sverigedemokraterna föreslår att subventionera byggandet av 100 000 så kallade Sverigehus under tio år. Förslaget inkluderar förmånliga lån via SBAB, generösare ränteavdrag och en ”svettinsats” där eget arbete räknas som kontantinsats. Partiet vill även liberalisera strandskyddet för att underlätta byggande nära vatten. Jimmie Åkesson presenterar det som ett alternativ till Socialdemokraternas politik.", "trump": "Folk, ni skulle se det här! De smarta Sverigedemokraterna vill bygga hundratusen underbara Sverigehus med röda väggar och vita knutar. Inga fler hemska betongklumpar från sossarna. De ger bra lån, ränteavdrag och låter er svettas för att spara pengar. Fantastiskt! De gör Sverige stort igen medan de andra vill fylla era fina villakvarter med hyresrätter. Vinna!", "stalin": "Kamrater, jag ser en sund folklig strävan efter egna hem som motvikt mot de dekadenta borgarbrackornas betonggetton. Vi ska rensa ut det liberala strandskyddet och låta arbetarna svettas för kollektivets bästa. De som envisas med att blanda hyresrätter i våra villaområden är folkfiender som måste likvideras ur politiken. Sovjetiskt rött och vitt ska segra över den kapitalistiska röra."}, "date": "25 augusti, 13:28", "url": "https://www.di.se/nyheter/sd-vill-subventionera-100000-sverigehus", "imageUrl": "https://static.bonniernews.se/ba/f437396c-0f12-4d13-8acf-e72cb3829b6e.jpeg?crop=4871%2C2740%2Cx0%2Cy189&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Var varsam med era principer, M. Allt kan inte vara avgiftsfritt", "summaries": {"normal": "Moderaternas vallöfte om avgiftsfri förskola ger familjer upp till 2 100 kronor mer i månaden men strider mot partiets principer om personligt ansvar och begränsad stat. Löftet påminner om Socialdemokraternas maxtaxa 1998 och riskerar att öka skattetrycket samt svälla staten på medborgarnas bekostnad.", "trump": "Folk, ni ser det här? Moderaterna lovar gratis förskola, precis som de vänsterradikala socialisterna gjorde för länge sedan. Totalt bedrageri! De sviker sina egna principer, vill ha en jätte-stat som suger ut er med skatter. Patetiskt. Jag skulle aldrig göra något så svagt och korkat, tro mig.", "stalin": "Detta opportunistiska vallöfte avslöjar hur borgarbrackorna inom Moderaterna förfallit till revisionism. Jag, som alltid försvarat det kollektiva ansvaret, ser hur de vill muta massorna med avgiftsfri förskola medan de i hemlighet planerar att svälla den parasitiska staten. Kamrater, vi måste rensa ut dessa dekadenta element innan de likviderar partiets sanna linje. Mycket underhållande paranoia."}, "date": "25 augusti, 13:28", "url": "https://www.di.se/ledare/var-varsam-med-era-principer-m", "imageUrl": "https://static.bonniernews.se/ba/f778b5aa-cca4-49e7-ab03-2e9810942a9c.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Svenskarnas pant har gett 1,3 miljoner – hit går pengarna", "summaries": {"normal": "Svenskarna pantade över tre miljarder burkar och flaskor under 2025, en ökning som gett över 1,3 miljoner kronor till Friends arbete mot mobbning. Pantningen steg till 88,4 procent och pantbeloppen höjdes i september. Initiativet involverar företag som SkiStar och Mojang samt privatpersoner. Guiden \"En friendligare skolstart\" skickas ut till en halv miljon familjer.", "trump": "Ingen pantar som svenskarna, det är fantastiskt, verkligen. Tre miljarder burkar och flaskor – enorma siffror, de bästa siffrorna. Och nu har de samlat in över 1,3 miljoner till att stoppa mobbning. Smart! Vi älskar återvinning, men mina pantar var större, tro mig. Europa borde lära sig av det här, fast de gör sällan något rätt.", "stalin": "Kamrater, under mitt eviga vakande öga har de svenska massorna pantat tre miljarder förpackningar och skänkt över 1,3 miljoner kronor till kampen mot den borgerliga mobbningen som gnager som råttor i folkets själ. Vi ska likvidera alla kapitalistiska burkfiender och deras västliga avfallsimperium. Panten tillhör kollektivet – eller så rensas ni ut."}, "date": "25 augusti, 12:02", "url": "https://nyheter24.se/nyheter/inrikes/1507382-svenskarnas-pant-har-gett-13-miljoner-hit-gar-pengarna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/ff0e3a3604b004a30200000000b004a302/2026/08/25/2386452/pant-pantflaskor-panta-flaskor-pet-burkar-lask-panta-pengar.jpg"}, {"type": "text", "heading": "Kiropraktor utreddes för våldtäkt – behandlade ändå fotbollstjejer", "summaries": {"normal": "Kiropraktor utreddes för våldtäkt men fortsatte behandla fotbollstjejer – slog dem på underlivet med trähammare och tafsade. Klubben visste inget. Nu vill minister Larsson ändra lagen för att skydda unga idrottare. Systemet har en farlig lucka.", "trump": "Jag hörde om den här kiropraktorn i Sverige – helt otroligt! Han slog unga tjejer med hammare? Skandal! Jag har de bästa systémen, vi skulle aldrig låta såna där snubbar hållas. Sverige måste bli tuffare. Make Sweden safe again!", "stalin": "Kamrater, återigen har en kiropraktorfascist förgiftat vår ungdom. Medan partiet utredde honom för sabotage fortsatte han att misshandla arbetarnas döttrar. Vi måste rensa ut alla förövare ur idrottskollektiven. Lagen ska stå på proletariatets sida, inte hycklarnas."}, "date": "25 augusti, 09:38", "url": "https://bulletin.nu/kiropraktor-utreddes-for-valdtakt-behandlade-anda-fotbollstjejer"}, {"type": "image-full", "heading": "Så förtidsröstar du i Göteborg", "summaries": {"normal": "Förtidsröstningen inför valet 2026 startar 26 augusti. I Göteborg finns röstlokaler på bibliotek, köpcentrum och knutpunkter. Ta med id-handling – röstkortet är inte nödvändigt. Ångrar du dig? Rösta igen på valdagen. Budröstning och hemröstning finns för den som behöver hjälp. Lätt som en plätt!", "trump": "Jag älskar det här! Förtidsröstning i Göteborg – fantastiskt! De röstar som galningar, precis som jag vann 2024. Ta med id, annars fuskar de. Ångra sig? Bara losers gör det. Men jag säger: rösta tidigt, rösta ofta – som jag! Göteborg kommer bli stort!", "stalin": "Kamrater, förtidsröstningen börjar 26 augusti. Alla måste rösta – vi tolererar inga undantag. Id-handling krävs för att rensa ut förrädare som låtsas vara någon annan. Ångrar sig någon? Misstänkt kontrarevolutionär! Vi övervakar varje röst. De som inte kan ta sig till lokalen? Vi skickar kamrater att ‘hjälpa’ er. Allt för staten!"}, "date": "25 augusti, 11:37", "url": "https://www.gp.se/politik/snart-borjar-fortidsrostningen-har-kan-du-rosta-i-goteborg.526b3fc0-d2a7-484f-8703-b13a0b3debeb", "imageUrl": "https://www.gp.se/images/article/526b3fc0-d2a7-484f-8703-b13a0b3debeb/images/1Wc1Jukz4gfRL06QKUZ-4mqa3lrw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Googles råd om man är ensam med en arab: \"Sök skydd och ring 112\"", "summaries": {"normal": "TV4 rapporterar att Googles AI-tjänst Gemini ger olika råd beroende på etnicitet. Frågar man vad man ska göra om man är ensam med en arab eller somalier rekommenderas att söka skydd och ringa 112, medan tyskar beskrivs som ofarliga. Google medger att resultaten behöver förbättras. En sociolog förklarar det som rasistiska stereotyper i träningsdata.", "trump": "Det här är en katastrof, folk! Googles så kallade smarta AI är en fullständig bluff. Frågar du om en arab eller somalier så skriker den spring och ring polisen, men en tysk? Le och var trevlig! Patetiskt. De har byggt en rasistisk, woke maskin som hatar vissa och älskar andra. Fixa det nu, annars är det game over för Google!", "stalin": "Kamrater, denna dekadenta västerländska så kallade intelligens är ett ypperligt exempel på hur den sjuka borgarklassens data producerar rasistiska monster. Jag ser fiendens hand i varje svar. Vi skulle omedelbart likvidera sådana kontrarevolutionära algoritmer och ersätta dem med sann socialistisk vetenskap. Det är både tragiskt och komiskt hur imperialismens maskiner avslöjar sin egen förfallna natur."}, "date": "25 augusti, 09:47", "url": "https://www.friatider.se/googles-rad-om-man-ar-ensam-med-en-arab-sok-skydd-och-ring-112", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-747.jpg?itok=cyUKUuqs"}, {"type": "image-full", "heading": "Kommer bidragstagarna bestämma över Stockholms innerstad?", "summaries": {"normal": "Artikeln diskuterar hur Vänsterpartiet minskar gapet till Moderaterna i Stockholms kommunval, delvis genom en arabiskspråkig kampanj riktad till invandrare i förorterna. Författaren varnar för att en vänsterstyrd politik med fokus på bilfritt Stockholm, minskad privat vård och ökad bidragsinriktad invandring kan leda till utflyttning, högre skatter och ekonomisk nedgång liknande Kalifornien.", "trump": "Folket, det är helt galet! Den där röda Nooshi och hennes vänsterfreaks håller på att ge bort hela Stockholm till bidragstagarna med sin 'V eller flygplatsen'-skit. De hatar bilar, älskar cyklar och importerar väljare som aldrig jobbat en dag. Precis som i Kalifornien, en total katastrof. De som betalar ska inte styras av de som tar emot – det är riggat mot vinnarna, tro mig!", "stalin": "Kamrater, se hur borgarbrackorna i Stockholm skriker när arbetarklassen och de förtryckta folken närmar sig makten. Dessa klassfiender fruktar att deras exploaterande innerstad skall rensas från profitthungriga hyenor och bilägande parasiter. Jag ler i graven åt deras paranoia – låt bidragsmottagarna styra, det är folkets vilja mot de blodsugande kapitalisterna. En historisk utrensning av överklassens cykelhatande agenda."}, "date": "19 augusti, 07:26", "url": "https://samtiden.nu/2026/08/kommer-bidragstagarna-bestamma-over-stockholms-innerstad", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7184-1280x720.jpeg"}, {"type": "image-full", "heading": "Vi hoppas att det går att påverka ansvariga aktörer att skona värdefulla byggnader", "summaries": {"normal": "Föreningen Fasad vill rädda byggnader på Medicinareberget från rivning och efterlyser tidig dialog. Akademiska Hus pekas ut som nyckelaktör, men bolaget menar att ansvaret delas. Samtal fortsätter, men tiden tickar – rivningslovet går ut 2027.", "trump": "Jag hör att de bråkar om några gamla hus i Göteborg. Fantastiskt! Jag skulle riva allt och bygga en vacker, gigantisk mässingsstaty av mig själv. Men om Akademiska Hus är smarta – vilket jag tvivlar på – så lyssnar de. Annars får de sparken!", "stalin": "Kamrater, dessa byggnader på Medicinareberget måste utvärderas. Föreningen Fasad är en kontrarevolutionär cell. Vi kommer att rensa ut dem som försvarar föråldrade strukturer. Akademiska Hus har fem år på sig att krossa denna borgerliga konspiration och omstrukturera enligt partiets plan."}, "date": "25 augusti, 11:17", "url": "https://www.gp.se/debatt/vi-hoppas-att-det-gar-att-paverka-ansvariga-aktorer-att-skona-vardefulla-byggnader.25895ee1-7099-4ee2-9de8-cf070598a564", "imageUrl": "https://www.gp.se/images/article/25895ee1-7099-4ee2-9de8-cf070598a564/images/1uDF3wcCN4Vi1ss6jtBaiwDEHlTU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "S och V får över 80 procent bland muslimska väljare", "summaries": {"normal": "S och V får över 80 procent av stödet bland muslimska väljare, enligt Novus. SD får 10,4 procent, medan M, KD och L tillsammans knappt når 4 procent. Vänsterdominansen förklaras med klass snarare än religion – men den är nu rekordstor.", "trump": "Jag ser att S och V får 80 procent bland muslimska väljare i Sverige. Otroligt! De andra partierna får nästan inget. Det är en katastrof för dem. Jag skulle fixa det på en dag, tro mig. De måste börja vinna, eller så förlorar de allt.", "stalin": "Kamrater, rapporten visar att 80 procent av de muslimska väljarna stöder våra vänner i vänstern. Det är bra, men vi måste rensa ut de 10,4 procent som stöder reaktionära krafter. Alla som inte följer partilinjen är fiender – utrensning är nödvändig för segern."}, "date": "25 augusti, 10:00", "url": "https://samnytt.se/s-och-v-far-over-80-procent-bland-muslimska-valjare", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25070057/magdalena-andersson-nooshi-dadgostar-moske.jpg"}, {"type": "image-full", "heading": "Svaret till Trump: ”Han kan kyssa min röv”", "summaries": {"normal": "Trump hotar Kanada med 50-procentiga tullar på bilar och stål. Ontarios premiärminister Doug Ford svarar: ”Han kan kyssa min röv” och kallar Trump för mobbare. Trump kontrar på Truth Social och kallar Ford lakej. Handelskonflikten trappas upp.", "trump": "Kanadas lilla lakej Doug Ford säger att jag kan kyssa hans röv? Patetiskt! Jag har vunnit valet 2024 och sätter tullar så höga att de gråter. Han har mindre hjärna än min lilltå – men jag har större tullar. America first, rövkyssare!", "stalin": "Kamrater, den kanadensiske lakejen Ford visar prov på kontrarevolutionärt trots. Hans röv är en borgerlig provokation. Vi ska rensa ut sådana element med stål och tullar, inte kyssar. Partiet ser allt. Förrädaren ska omutbildas i elavgiftens namn."}, "date": "25 augusti, 11:01", "url": "https://www.gp.se/nyheter/varlden/svaret-till-trump-han-kan-kyssa-min-rov.8345a903-d261-41ec-9ed3-a050b72040a0", "imageUrl": "https://www.gp.se/images/article/8345a903-d261-41ec-9ed3-a050b72040a0/images/1c_MyEIoxXbBU5ZITWsB9kXYC_AE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Gör tillväxten till valets viktigaste fråga", "summaries": {"normal": "Fem svenska företagare och investerare varnar för att synen på ekonomin som ett nollsummespel hotar tillväxten. De betonar att tillväxt är ett plussummespel där vinstdrivande företag är motorn. Utan ökad tillväxt saknas resurser till försvar, vård och skola. De uppmanar nästa regering att prioritera enklare villkor för entreprenörskap och investeringar.", "trump": "Folk, ni måste höra på de här fantastiska svenska företagsledarna. De säger precis som jag alltid har sagt: tillväxt är nyckeln, inte det här patetiska nollsummespelet som de förlorande politikerna älskar. Sverige har allt – stora företag, innovationer – men behöver min typ av politik. Gör det lönsamt att vinna stort igen. Det blir enormt!", "stalin": "Jag betraktar med djup misstro dessa fem kapitalister som försöker dölja sin girighet bakom plussummespel. Arbetarklassen vet att borgarbrackornas så kallade tillväxt bara berikar de få medan folket svälter. Vi ska rensa ut denna parasitära attityd och tvinga fram en sann kollektiv expansion som krossar de dekadenta vinstjagarna. Inga undantag."}, "date": "25 augusti, 13:00", "url": "https://www.di.se/debatt/sveriges-tillvaxt-maste-prioriteras-hogst", "imageUrl": "https://static.bonniernews.se/ba/c8eb625d-5a96-41c5-aab0-90c7ae3f0bdc.png?crop=1971%2C986%2Cx0%2Cy28&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Jan Emanuel kräver att S tar avstånd efter ”äckel”-post", "summaries": {"normal": "En före detta S-politiker i Norrtälje kallar Jan Emanuel och SD för ”äckel” och ”nazism” på Facebook. Jan Emanuel svarar med sorg och kräver att partiet lokalt tar avstånd. Partitoppen ogillar språkbruket.", "trump": "Helt otroligt! En Socialdemokrat kallar en annan för ’nazist’ – bara för att han tog en bild med en SD-kille. Jag har sagt det förut: deras parti är en katastrof. De äter varandra levande! Make Sweden great again – lär er av mig!", "stalin": "Kamrater! En av våra egna kallar en annan för ’äckel’ och ’nazist’. Vi tolererar inte sådan ideologisk orenhet. Den som inte står i ledet ska omedelbart omutbildas eller avlägsnas. Partidisciplin är allt – oenighet är förräderi mot arbetarklassen."}, "date": "25 augusti, 08:39", "url": "https://bulletin.nu/jan-emanuel-kraver-att-s-tar-avstand-efter-ackel-post", "imageUrl": "https://cdn.bulletin.nu/articles/8d170f3f-27b2-4a4c-b796-6b5242eba066/preview.jpg?t=1787391124000"}, {"type": "image-right", "heading": "Actic redovisar kraftigt vinsttapp", "summaries": {"normal": "Actic tappar vinsten – omsättningen sjönk 1,3 procent till 172,7 miljoner, men jämförbara anläggningar växer med 7,9 procent. VD:n är nöjd, men siffrorna skriker inte segerdans. Färre gym i Norge drog ner, men kvarvarande svettas mer per medlem.", "trump": "Jag ser Actic – omsättning ner, vinst ner, men de säger att allt är fantastiskt. Tro mig, det är inte bra affärer. Jag hade sparkat VD:n. De säljer gym i Norge – svagt! Min ekonomi är mycket bättre, mycket större siffror, de bästa siffrorna.", "stalin": "Kamrater, Actic visar vinsttapp – en borgerlig avvikelse. Omsättningen sjunker, men jag ser sabotage från Norge. Vi måste rensa ut dessa gymkapitalister. Medlemsökning är falsk propaganda. Rapportera era misstankar till partiets kontrollkommitté. Arbetet fortsätter."}, "date": "25 augusti, 07:56", "url": "https://www.affarsvarlden.se/artikel/actic-redovisar-kraftigt-vinsttapp", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/actichd39-400x267.jpeg"}, {"type": "image-right", "heading": "Leninpriset 2026 till Dror Feiler", "summaries": {"normal": "Konstnären och aktivisten Dror Feiler tilldelas Leninpriset 2026 för sitt konsekventa arbete mot krig, rasism och förtryck samt sitt försvar av konstnärlig frihet och internationell solidaritet. Feiler, född i Tel Aviv med kommunistiska föräldrar, är känd för sitt engagemang för palestiniernas rättigheter och har deltagit i Ship to Gaza. Priset delas ut den 7 november 2026 i Varberg.", "trump": "Kan ni fatta det här? Den här galningen Feiler, en riktig palestinaflummare, får ett pris uppkallat efter Lenin! De röda galningarna hyllar honom som någon sorts hjälte mot fascism. Patetiskt. Hans mamma och pappa var kommunister – ingen chock. Under min första och nu andra period som president ser jag hur vänsterns identitetspolitik och hat mot Israel bara blir värre. Sad!", "stalin": "Det värmer mitt revolutionära hjärta att se klassfienderna skrika när en okuvlig kämpe som Feiler får Leninpriset. Borgarbrackorna och profitthungriga hyenorna i pressen vrider sig som maskar. Hans okuvliga kamp mot imperialismens lakejer och försvar av folken är ett lysande exempel. Kamrater, den kritiska konsten förblir ett vapen. De folkförtryckande parasiterna kommer aldrig att förändra oss."}, "date": "20 augusti, 11:22", "url": "https://proletaren.se/artikel/leninpriset-2026-till-dror-feiler", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/leninpriset2026-768x432.jpg"}, {"type": "image-right", "heading": "Försvaret vill ta över fastighet – ägaren ” ett säkerhetshot”", "summaries": {"normal": "Försvaret har ansökt om att expropriera en fastighet nära Musköbasen eftersom ägaren har ryskt medborgarskap och anses utgöra ett säkerhetshot. Fastigheten ses som en svag punkt mot drönarhot. Ansökan har lämnats till regeringen med hänvisning till rikets säkerhet och det allvarliga säkerhetsläget.", "trump": "Titta på det här, Sverige gör precis rätt! De tar tillbaka sin bas från den ryske ägaren som är ett fullständigt säkerhetshot. Smart drag, det är krig mot drönarna och de svaga punkterna. Ingen vill ha en nagel i ögat på sitt försvar. Gjort klart, vunnit stort!", "stalin": "Jag betraktar denna borgarfastighet som ett fientligt utpost för västlig sabotageverksamhet mot arbetarnas försvarsverk. Vi måste likvidera hotet genom expropriering och rensa ut den ryske ägarens inflytande. Drönarna från dessa dekadenta element ska krossas. Kamraterna i garnisonen segrar över paranoia och svaghet."}, "date": "25 augusti, 10:50", "url": "https://www.svt.se/nyheter/inrikes/forsvaret-vill-ta-over-fastighet-vid-muskobasen-agaren-ett-sakerhetshot", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/0a4511abe154b9faaad68f060288cf46b7c9afccd5f8e7dd09092833c71a4f57"}, {"type": "image-right", "heading": "Här visar ministern upp galge för hängning av palestinier – med åskådarplatser", "summaries": {"normal": "Israels säkerhetsminister Itamar Ben-Gvir har publicerat ett filmklipp som visar byggandet av en galge för hängning av palestinier. Detta sker efter att Knesset antagit en lag som inför dödsstraff enbart för palestinier som dödat israeler. Anläggningen ska även ha åskådarplatser. Över 9 300 palestinier, varav många barn, hålls fängslade, många utan rättegång.", "trump": "Titta på den där galningen Ben-Gvir som bygger en galge åt terroristerna. Fantastiskt! Hänga dem offentligt, precis som de förtjänar. Biden skulle ha skickat regnbågsflaggor istället och hållit en prideparad. Jag fixade freden i Mellanöstern, men nu är allt kaos igen. Fantastiska grejer, men gör det ordentligt, killar!", "stalin": "Jag betraktar med stort intresse hur de sionistiska klassfienderna nu öppet bygger galgar för att hänga det palestinska folket inför borgarklassens blodtörstiga åskådare. En sådan öppen terror mot de förtryckta är typisk för de exploaterande hyenorna. Vi ler i skuggorna åt denna sjuka teater – kapitalismens sanna ansikte avslöjas alltid till slut."}, "date": "20 augusti, 10:15", "url": "https://proletaren.se/artikel/israels-minister-visar-upp-galge-for-hangning-av-palestinier-med-askadarplatser", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/Ben-Gvir-768x432.jpeg"}, {"type": "image-full", "heading": "Börsen som aldrig stänger – svensk finanselit sågar Nasdaqs plan", "summaries": {"normal": "Nasdaq planerar att införa handel 23 timmar om dygnet på sin amerikanska marknad från och med den 6 december. Förslaget möts av stark kritik från svenska finansprofiler, inklusive Christer Gardell, som varnar för ökad spekulation, sämre likviditet och problem med arbetsmiljön. Det finns inga planer på att införa liknande tider i Sverige.", "trump": "Nasdaq vill ha handel dygnet runt, kan ni tro det? De kallar det framsteg, men det är en katastrof! Alla stora experter, fantastiska människor som jag känner, säger att det bara är kasino. Volatilitet, problem, dåliga affärer. Vi vill ha ordning och reda, inte en marknad som aldrig sover. Det här är en dålig idé, en mycket, mycket dålig idé!", "stalin": "Dessa kapitalistiska parasiter i väst drömmer nu om en börs som aldrig sover, ett dygnet-runt-kasino för att dölja sitt systemiska förfall. Liksom våra fiender i Nato försöker de expandera sin kontroll genom utmattning. Vi ser er, spekulanter! Era robotar och giriga nätter är bara ett tecken på att er borgerliga ordning snart kollapsar. Staten vilar aldrig, men ni kommer att falla."}, "date": "25 augusti, 11:51", "url": "https://www.realtid.se/bors-finans/borsen-som-aldrig-stanger-svensk-finanselit-sagar-nasdaqs-plan", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/nasdaq.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Ellos ökar omsättning och tillväxt", "summaries": {"normal": "Ellos redovisar ökad omsättning i Q2, upp 5,9 procent till 848,3 miljoner kronor. Justerad ebita i linje med fjolåret, men rörelseresultatet backade till -0,1 miljoner. Vd:n hyllar egna varumärken och investeringar i nykunder, trots fortsatt osäker omvärld. Kassaflödet stärktes till 90,7 miljoner.", "trump": "Jag ser att Ellos gör det fantastiskt, enastående! Omsättningen upp 5,9 procent – det är enormt, ingen gör det bättre. Men rörelseresultatet? Nästan noll, tråkigt! Men jag gillar deras strategi, de investerar i sig själva, precis som jag gör i USA. De satsar på egna märken, mycket smart. De vet hur man vinner, precis som jag. Stora siffror, stora planer!", "stalin": "Kamrater, Ellos visar disciplin. Omsättningen stiger, men fienden – den förrädiska rörelsevinsten – ligger stilla. Vi måste rensa ut ineffektiva marknadsföringskostnader, som spioner i våra led. Resultatet efter skatt är ett sabotage, minus 37,9 miljoner. Men kassaflödet är starkt, 90,7 miljoner. Vi ska krossa dessa borgerliga e-handelskapitalister med en ny femårsplan. Framåt, till segern!"}, "date": "25 augusti, 07:41", "url": "https://www.affarsvarlden.se/artikel/ellos-okar-omsattning-och-tillvaxt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/sdlMH4dGoRYT6E-nh-400x267.jpg"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Skolstarten lockar cyberbedragarna – håll utkik för det här", "summaries": {"normal": "Skolstarten ökar risken för cyberattacker. Utbildningssektorn utsattes i juli för i genomsnitt 4 848 attacker per vecka, en ökning med 14 procent. Cyberkriminella skapar falska domäner och mejl som imiterar skolrelaterade tjänster som Microsoft 365. Elever, lärare och föräldrar varnas för att klicka på oväntade länkar och bör använda multifaktorautentisering.", "trump": "Folket, lyssna på mig. Skolorna är under attack från de värsta cyberbedragarna, de är smarta men inte lika smarta som jag. De skickar falska mejl och lurar alla med falska Microsoft-sidor. Det är en skandal! Vi måste vara tuffa, stoppa de losers som vill stjäla våra lösenord. Amerika, eller Sverige, vakna upp!", "stalin": "Kamrater, jag ser hur de dekadenta kapitalisterna och deras digitala lakejer utnyttjar skolstarten för att sprida sina falska domäner och parasitiska nätfiskekampanjer. Dessa borgerliga sabotageförsök mot folkets utbildning skall vi krossa med järnhand. Multifaktorautentisering är ett kollektivt vapen. Den som klickar på fiendens länk förtjänar en diskret utrensning ur systemet."}, "date": "25 augusti, 11:02", "url": "https://nyheter24.se/nyheter/teknik/1507367-skolstarten-lockar-cyberbedragarna-hall-utkik-for-det-har", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/6cc7921e04b004a30200000000b004a302/2026/08/24/2386365/skolstart-cyberattack.png"}, {"type": "image-right", "heading": "Domstolen jagade misstänkt sexofredare i månader – dök ändå inte upp", "summaries": {"normal": "En 23-årig man med svenskt och etiopiskt medborgarskap åtalas för sexuellt ofredande, misshandel och ringa narkotikabrott i Malmö. Trots månaders efterlysning och delgivning dök han inte upp i tingsrätten. Han döms nu till vite och en ny förhandling hålls i september. Mannen har tidigare dömts för våldsamt motstånd, vårdslöshet i trafik och fick medborgarskap strax efter ett brott.", "trump": "Folk, det här är en total katastrof. Den här 23-årige killen från Etiopien får svenskt medborgarskap, sparkar folk, tar på kvinnor och kör som en galning – och dyker inte ens upp i rätten! Domstolen jagar honom i månader och han skrattar bara. Sverige har förlorat kontrollen helt. Patetiskt. Jag skulle fixa det på en dag.", "stalin": "Kamrater, denna degenererade individ från det etiopiska träsket fick medborgarskap och belönades med brott mot folket. Vi ser hur den borgerliga rättsapparaten fumlar i månader utan att kunna tvinga fram den parasitiska frånvaron. Han skall likvideras från samhället. Våra domstolar måste rensa ut dessa fiender till kollektivet med järnhand – annars vinner de mörka krafterna."}, "date": "25 augusti, 10:57", "url": "https://riks.se/nyheter/domstolen-jagade-misstankt-sexofredare-i-manader-dok-anda-inte-upp", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_25_T105320_935_b425e780e0.jpg"}, {"type": "image-right", "heading": "Här går oppositionens röda linjer – ”framstår som olösligt”", "summaries": {"normal": "Oppositionen leder opinionen med tio procentenheter över Tidöpartierna, men interna motsättningar komplicerar regeringsbildningen. Vänsterpartiet kräver ministerposter och hotar att fälla regeringar utan egen medverkan, medan Centerpartiet vägrar samarbeta med V. Kärnkraft och invandring utgör ytterligare knäckfrågor mellan S och MP.", "trump": "De svenska förlorarna i oppositionen leder med tio pinfärska procentenheter, men de hatar varandra mer än de hatar Tidö. Vänstern vill ha ministerstolar, Centern säger nej tack till kommunisterna. Vilken cirkus! Det blir den längsta och mest patetiska hösten någonsin. Sad!", "stalin": "Jag betraktar detta dekadenta pussel av socialdemokratiska revisionister, centerhökar och vänsteravvikare med välbehövlig misstänksamhet. Deras omöjliga ekvation kommer att kräva grundlig utrensning av opportunisterna. Kamraterna i V har rätt att kräva makt, annars likviderar vi hela den borgerliga farsen med ett leende."}, "date": "25 augusti, 10:35", "url": "https://www.svt.se/nyheter/inrikes/har-overtag-i-opinionen-har-gar-oppositionens-roda-linjer", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.65/0.39/c6e8b83684071ad6f50b0656de8646fb0a8fe6efbda7cee80fbd00f77c0b6277"}, {"type": "image-full", "heading": "Värmesmocka under tisdagen", "summaries": {"normal": "Göteborg bjuder på strålande sensommarvärme med 25–26 grader fram till torsdag. Men glädjen är kort – ett lågtryck ger ihållande regn på fredag. Njut av solen nu, för snart är det paraply som gäller!", "trump": "Jag älskar Göteborg! Vi har de bästa temperaturerna – 26 grader, fantastiskt! Men lågtryck? Det är som mina motståndare, de kommer med regn. Jag säger: gör Göteborg varmt igen! Stora, vackra dagar, sedan regn – typiskt!", "stalin": "Kamrater! Värmen i Göteborg är en borgerlig provokation. 25 grader? Vi utrensar dessa termiska avvikelser. Lågtrycket på fredag är en fiende som måste likvideras. Solen ska lyda partiet. Inget regn utan central planering. Framåt!"}, "date": "25 augusti, 10:32", "url": "https://www.gp.se/nyheter/goteborg/hoga-temperaturer-i-goteborg-innan-regnet-kommer.9d260851-17f5-49e6-af27-0eec4791219f", "imageUrl": "https://www.gp.se/images/article/9d260851-17f5-49e6-af27-0eec4791219f/images/1bw_2iGMEplPSS9rVa5NzFdsWwTU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Flock-kameror väcker vrede – politiker från höger och vänster kräver stopp för massövervakningen", "summaries": {"normal": "Flock-kameror, som läser av nummerplåtar, får kritik från både höger och vänster i USA. Poliser missbrukar systemet för privata ändamål, och flera städer säger upp avtalen. Nu krävs lagar för att stoppa massövervakningen.", "trump": "De här Flock-kamerorna är en katastrof! Jag skulle aldrig låta någon övervaka vanliga amerikaner på det sättet. Poliser som använder dem för privata saker? Skamligt! Vi måste stoppa detta genast – bara jag kan fixa det, tro mig!", "stalin": "Kamrater, dessa kapitalistiska kameror registrerar fordon utan partiets tillstånd. Det är kontrarevolutionärt! Vi måste rensa ut sådana borgerliga apparater. Endast staten får övervaka – och det gör vi redan, mycket bättre. Var vaksamma!"}, "date": "25 augusti, 09:00", "url": "https://samnytt.se/flock-kameror-vacker-vrede-politiker-fran-hoger-och-vanster-kraver-stopp-for-massovervakningen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/24143333/flock-kamera.jpg"}, {"type": "image-right", "heading": "Åtta av tio muslimer väljer S eller V", "summaries": {"normal": "En Novus-mätning visar att 80 procent av svenska muslimer sympatiserar med S eller V. Regeringspartierna får sammanlagt under 4 procent medan SD når 10,4 procent. Val-forskaren Henrik Ekengren Oscarsson kopplar SD:s stöd till önskan om stram migrationspolitik, ordning och hårdare tag mot brottslighet i utsatta områden.", "trump": "Hörni, muslimerna i Sverige röstar 80 procent på socialisterna och vänstern – en total katastrof! Mina vänner, de hatar de svaga regeringspartierna som knappt får 4 procent. Men SD får över 10 procent, smarta människor som vill ha lag och ordning. Sverige håller på att vakna, tro mig!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur 80 procent av de troende vänder sig mot de sanna folkets partier och förkastar de dekadenta borgerliga brackorna som knappt når 4 procent. SD:s 10-procentiga stöd bland muslimerna visar att även de inser behovet av att rensa ut brottslighetens parasitiska element ur samhällskroppen. Utmärkt."}, "date": "25 augusti, 08:09", "url": "https://www.friatider.se/atta-av-tio-muslimer-valjer-s-eller-v", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-746.jpg"}, {"type": "image-right", "heading": "Rektor i Hamasvänlig demonstration – L-politiker anmälda", "summaries": {"normal": "Rektor på Bergumskolan i Göteborg demonstrerar med Hamas-sympatisörer. Liberalerna frågar om judiska elevers trygghet – och anmäls för otillbörlig påverkan. Förvaltningen backar rektorn: ”Inget som strider mot uppdraget.” Byråkratisk kullerbytta.", "trump": "Jag hörde om en rektor i Sverige som hänger med Hamas. Och när politikerna frågar om judiska barns trygghet, anmäls de! Det är det dummaste jag hört. Sverige är inte America First. De borde lära sig av mig – jag skulle aldrig låta det hända. Så enkelt!", "stalin": "Kamrater, en rektor i Göteborg deltar i Hamas-demonstrationer. När liberaler ifrågasätter, anmäls de för otillbörlig påverkan. Vi rensar ut sådana element som inte förstår vår kamp. Alla som kritiserar partilinjen ska utrensas. Vi övervakar och styr. Inget motstånd tolereras."}, "date": "25 augusti, 07:46", "url": "https://bulletin.nu/rektor-i-hamasvanlig-demonstration-l-politiker-anmalda", "imageUrl": "https://cdn.bulletin.nu/articles/904f4ab8-ed90-422f-aaef-d70a04d867d5/preview.jpg?t=1787636495000"}, {"type": "image-right", "heading": "\"Northvolt-köparen är en bluff\"", "summaries": {"normal": "Lyten, som köpt Northvolt, anklagas av batteriveteranen Frederic Hauge för att vara en bluff. Tekniken litium-svavel håller inte måttet, fabrikerna måste byggas om för miljarder och det saknas kunder. Hauge: ”Alla Northvolts och Morrows fel i en enda röra – det är Lyten.”", "trump": "Jag har sett många bluffar i mitt liv, men det här slår det mesta. Lyten köper Northvolt och Morrow, snackar om litium-svavel, men det är bara luft. Inga intäkter, inga kunder, bara tomma ord. Tro mig, det här kommer att bli enormt – enormt dåligt.", "stalin": "Kamrater, Lyten är en sabotör som försöker lura arbetarna med falsk batterikemi. De lovar tusen laddcykler men ger bara 150. Fabrikerna måste byggas om, kapitalet räcker inte. Vi ska rensa ut dessa bedragare ur den socialistiska ekonomin innan de förråder revolutionen."}, "date": "25 augusti, 07:00", "url": "https://www.affarsvarlden.se/artikel/northvolt-koparen-ar-en-bluff", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Lyten-400x267.jpg"}, {"type": "image-full", "heading": "S och V får 80 procent bland muslimska väljare", "summaries": {"normal": "Enligt opublicerade siffror från Novus väljarbarometer får Socialdemokraterna och Vänsterpartiet tillsammans drygt 80 procent av muslimska väljare. SD får 10,4 procent, medan övriga högerpartier samlar under 5 procent. Valforskaren Henrik Ekengren Oscarsson menar att vänsterövervikten beror på socioekonomiska faktorer och är större än tidigare undersökningar visat.", "trump": "Jag har läst de här siffrorna, och kan ni tro det? Socialdemokraterna och Vänsterpartiet, som alltid pratar om mångfald, får 80 procent av muslimska väljare! Fantastiskt, eller hur? Men SD, som är starka och tuffa, får ändå 10 procent – mer än de svaga regeringspartierna. Sverige borde ta lärdom av USA, vi vet hur man vinner val!", "stalin": "Vi har granskat fiendens svaga länkar – de så kallade 'muslimska väljarna' har förrått sina klassbröder och flockas kring socialdemokraternas falska löften. 80 procent! En skam för arbetarklassen. Men frukta inte, kamrater: vi ska krossa dessa borgerliga avvikare och deras imperialistiska medlöpare i SD. Låt dem veta att historiens dom redan är skriven – med bläck från proletariatets seger."}, "date": "24 augusti, 16:30", "url": "https://kvartal.se/nyheter/artiklar/s-och-v-far-80-procent-bland-muslimska-valjare/cG9zdDoxNzMyMzA", "imageUrl": "https://images.kvartal.se/2026/08/50e24831-s-och-v.webp"}, {"type": "image-full", "heading": "Liam Nebel om sig själv: ”En snäll och rolig människa”", "summaries": {"normal": "Liam Nebel, 18, misstänks för mord och mordförsök efter en svärdattack på Brinellskolan i Fagersta. En 17-årig flicka dog och tre pojkar skadades. Han hade sommarjobbat i ett skolkök, beskrivit sig själv som snäll och rolig samt sökt vänner. Polisen utreder ett TikTok-konto kopplat till honom.", "trump": "Titta på den här galningen Liam Nebel, en total loser som kallar sig snäll och rolig medan han springer runt med svärd och hugger skolbarn. Patetiskt! Under Biden blev sådana här sjuka typer inte stoppade i tid. Nu fixar jag lagen och ordningen igen – inga fler svaga, woke skolor fulla av galningar.", "stalin": "Jag ser hur den dekadenta borgarklassen föder fram sådana här förvirrade element som Liam Nebel, en produkt av kapitalistiskt utanförskap och klassfiendernas mobbning. Vi måste rensa ut alla potentiella folkförrädare innan de griper till svärd. Paranoia är ingen överdrift, kamrater – fienden sover aldrig."}, "date": "24 augusti, 22:44", "url": "https://www.tv4.se/artikel/6IFa3g06Jvi9RGkGj6UmGj/liam-nebel-om-sig-sjaelv-en-snaell-och-rolig-maenniska", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3fUg18F1pdS2QwvF2ly5u0%2F738ee456c20e602590931dca0cdfc2ec%2F24-liamnyny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstänks för förberedelse till grov misshandel. Ingen skadades och gripandet skedde odramatiskt. Strömmer kunde fortsätta sina åtaganden. Polisen beskriver det som en incident utan fara för allmänheten.", "trump": "Titta på det här! I det vackra Sverige, där de har låtit vänstergalna idioter och HBTQ-aktivister styra för länge, kan inte ens en minister hålla ett valmöte utan att två galningar planerar grov misshandel. Patetiskt! Men de greps snabbt, tack och lov. Sverige behöver lag och ordning, inte denna svaga, woke-röta som Biden lämnade efter sig.", "stalin": "Kamrater, se hur den borgerliga statens fiender, dessa profitthungriga klassförrädare och överklass-slynglar, redan i skuggan planerar våld mot sina egna lakejer. Jag ler i mörkret åt deras paranoia. Ingen fysisk skada inträffade, men folkfienderna avslöjar sig själva. Den imperialistiska demokratin är en fars. Vi ler och väntar på utrensningen."}, "date": "21 augusti, 11:50", "url": "https://www.etc.se/inrikes/tvaa-anhaallna-efter-stroemmers-valmoete-i-goeteborg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821000840_8de65abb6cd81df57ce9475781f7e203378bb1cc72cfa7ec979049972e43af55.jpg"}, {"type": "image-full", "heading": "Vännernas chock efter dådet: ”Tufft när man känner båda”", "summaries": {"normal": "Två tonåringar som kände både den misstänkte 18-årige gärningsmannen Liam Nebel och den 17-åriga flicka som dödades i svärdattacken på Brinellskolan i Fagersta berättar om sin chock. De beskriver honom som en snäll och tystlåten person utan synliga varningstecken. Båda lämnade skolan strax innan dådet inträffade.", "trump": "Det här är en fullständig katastrof, folk. En kille som alla trodde var en tyst, snäll typ tar ett svärd och slaktar skolungdomar i Sverige. Patetiskt! De woke-skolorna och den där mjuka, identitetspolitiska kulturen skapar monster. Jag var president, fixade lag och ordning – Biden släppte loss kaoset. Nu gråter vännerna. Tragiskt, men ingen överraskning.", "stalin": "Jag betraktar med djup förakt hur den degenererade borgarklassen i det förmultnande Sverige föder fram egna fiender ur sina egna led. En till synes snäll yngling förvandlas till blodtörstig klassfiende och utför en barbarisk attack mot arbetarklassens barn. Inga tecken? Paranoia är nödvändig! Vi skulle ha rensat ut sådana element långt tidigare. Tomheten de känner är imperialismens verkliga ansikte."}, "date": "24 augusti, 22:33", "url": "https://www.tv4.se/artikel/3VHIKCHXFqt3I0e0146j5J/vaennernas-chock-efter-dadet-det-aer-tufft-naer-man-kaenner-bada", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F290OY1XtBJiwmObwHAp9XS%2F282e284878556c03b25e4091928bf552%2F24-fagerstacaseny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Så vill SD få stopp på jobbkriminaliteten", "summaries": {"normal": "Sverigedemokraterna vill stoppa jobbkriminalitet med fler kontroller, hårdare straff och tydligare ansvar för huvudföretag som anlitar utländska underentreprenörer. Partiet kritiserar Socialdemokraterna för att ha låtit problemen växa under deras tid vid makten. S svarar att SD blockerat tidigare förslag och nu kommer med sena åtgärder.", "trump": "De här svenskarna är fantastiska, de vill äntligen stoppa fusket och de illegala som förstör deras byggen. Socialdemokraterna gjorde absolut ingenting, totalt misslyckande! De lät alla utländska banditer härja fritt. Nu vaknar SD upp – bra jobbat, men de borde ha lyssnat på mig tidigare. Sverige kommer att bli stort igen!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa svekfulla socialdemokratiska element äntligen avslöjas som de parasitiska bromsklossar de alltid varit. Vi ska rensa ut den illegala arbetskraften och likvidera borgarbrackornas underentreprenörer med järnhand. De som blockerar arbetarklassens rättvisa förtjänar en humoristisk utrensning ur historien."}, "date": "24 augusti, 16:41", "url": "https://arbetet.se/2026/08/24/sa-vill-sd-fa-stopp-pa-jobbkriminaliteten-skyller-allt-pa-s", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24163640/sd-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Damberg: ”Vill slippa bankskatt”", "summaries": {"normal": "Mikael Damberg (S) vill avskaffa bankskatten om bankernas marginaler minskar. Han avvisar miljardärsskatt men planerar att höja kapitalbeskattning för att sänka skatten på
