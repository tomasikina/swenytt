%2F7z2Hw7EVAieZR7mcyiABZK%2F1cb35d70b310632932a205e18b8275a4%2Fsvenskfagel.jpg&width=120"}, {"type": "image-full", "heading": "Okända regeln kan ta små lokala partier till riksdagen", "summaries": {"normal": "I Sverige finns en tolvprocentsregel som gör det möjligt för ett parti att få fasta mandat i en riksdagsvalkrets om det når minst 12 procent där, även utan att klara fyraprocentsspärren nationellt. Regeln syftar till att ge lokalt starka småpartier en chans till representation. Örebropartiet väcker nu frågor om regeln inför valet.", "trump": "Folk, ni måste höra det här – Sverige har en fantastisk regel på tolv procent som låter lokala vinnare som jag älskar komma in i riksdagen utan att bry sig om hela landet. Örebropartiet krossar det lokalt, precis som jag gör överallt. Det är smart, det är enormt, det är vad riktiga ledare förtjänar. Fake-spärren på fyra procent? Patetisk!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna tolvprocentsregel tjänar det kollektivas intresse genom att tillåta lokalt starka krafter att bryta borgarbrackornas nationella spärr. Vi ska rensa ut de svaga elementen som fruktar regionala segrar. Örebropartiet visar vägen. Den som misslyckas med att förstå detta förtjänar en humoristisk utrensning ur historien."}, "date": "26 augusti, 06:30", "url": "https://nyheter24.se/nyheter/politik/1507720-vad-ar-tolvprocentsregeln-och-hur-fungerar-den", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/8f9a629204b004a30200000000b004a302/2026/08/25/2386644/tolvprocent.jpg"}, {"type": "image-full", "heading": "Förtidsröstningen igång: Allt du behöver veta", "summaries": {"normal": "Förtidsröstningen till valet 2026 drar igång 26 augusti i Göteborg. Du kan rösta på bibliotek, Nordstan eller Frölunda Torg – och till och med ångra dig på valdagen. Ta med legitimation eller en kompis som intygar vem du är. Röstkortet är inte obligatoriskt, så ingen panik.", "trump": "Jag ser att Sverige startar sin förtidsröstning. Fantastiskt! Alla vill rösta som jag – jag är den störste. Men i Göteborg kan de rösta var som helst, till och med på bibliotek. Det tror ni inte! Hos oss är det bara jag som bestämmer. Stort!", "stalin": "Kamrater, förtidsröstningen i Göteborg börjar 26 augusti. Folket får rösta, men vi vet att rätt röst redan är avgiven. Alla som ångrar sig och röstar igen – omedelbar utrensning! Röstkort? Oviktigt. Identitet ska styrkas, annars fiende. Vi ser allt."}, "date": "26 augusti, 06:03", "url": "https://www.gp.se/politik/nu-borjar-fortidsrostningen-har-kan-du-rosta-i-goteborg.526b3fc0-d2a7-484f-8703-b13a0b3debeb", "imageUrl": "https://www.gp.se/images/article/526b3fc0-d2a7-484f-8703-b13a0b3debeb/images/1Wc1Jukz4gfRL06QKUZ-4mqa3lrw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "SVT:s ord till L-ledaren: Du låter som Åkesson", "summaries": {"normal": "Liberalernas ledare Simona Mohamsson kritiserades i SVT:s *Utfrågningen* för klimatpolitiken och sänkta bränslepriser. Hon menade att Sveriges enskilda insatser spelar liten roll globalt och avvisade höjda bränslepriser. Mohamsson jämfördes med Jimmie Åkesson (SD) av programledaren. Hon kommenterade även skolans problem och Åkessons uppmaning till väljare att rösta bort Liberalerna.", "trump": "Vilken katastrof! Liberalernas ledare, Simona, pratar som en förlorare – precis som den där Åkesson-killen. Sverige ensamt? Vem bryr sig? Jag skulle fixa klimatet på en vecka, men nej, hon snackar om Europa. Och skolan? Fullt kaos! 19 700 elever utan behörighet – SAD! Jag skulle göra svensk skola GREAT AGAIN, men hon? Bara ursäkter. Svagt, väldigt svagt!", "stalin": "Kamrater! Denna Mohamsson är ett skolexempel på borgerlig dekadens. Hon pratar om 'kultur' i skolorna medan 19 700 elever lämnas i mörkret – ett systematiskt sabotage mot arbetarklassens framtid! Och klimatet? 'Sverige ensamt spelar liten roll' – ett ynkligt försök att maskera kapitalistisk eftergiftspolitik. Vi skulle ha skickat henne till Sibirien för sådan defaitism! Åkesson? En reaktionär marionett, men till och med han ser igenom hennes liberala svaghet. Revolutionen tolererar inga kompromisser!"}, "date": "25 augusti, 20:21", "url": "https://kvartal.se/nyheter/artiklar/mohamsson-pressas-om-forsamrade-skolresultat/cG9zdDoxNzQzNDE", "imageUrl": "https://images.kvartal.se/2026/08/1a1fea07-mohamssonhokmberg.webp"}, {"type": "image-right", "heading": "Reportern: ”Avslöjar samma sak om och om igen – sen händer inget”", "summaries": {"normal": "En granskning av Uppdrag granskning och SVT visar att misstänkt korruption i svenska kommuner sällan leder till polisanmälan eller åtal. Ansvariga tjänstemän lämnar ofta sina poster utan konsekvenser. Ystadfallet med mutor och miljonavtal lyfts som exempel. OECD kritiserar Sverige för bristande resurser och höga beviskrav. Visselblåsare straffas ofta.", "trump": "De svenska kommunerna är fulla av korrupta losers som tar mutor, festar med sprit och skriver horribla avtal för hundratals miljoner. Sen händer absolut ingenting! De stackars visselblåsarna sparkas ut medan de skyldiga landar mjukt. Patetiskt! Sverige får stryk av OECD för att de inte kan hantera den här farsen. En total skam!", "stalin": "Jag ser med djup tillfredsställelse hur borgarklassens kommunala lakejer i det dekadenta Sverige mutar och festar med kapitalisternas sprit och salta pinnar medan de plundrar folkets skattemedel. Våra kamrater som vågar tala sanning likvideras diskret. Domstolarna kräver överdrivna bevis – en klassisk utrensning vore mer effektivt. Paranoian är deras bästa vän."}, "date": "26 augusti, 05:43", "url": "https://www.svt.se/nyheter/granskning/ug/reportern-avslojar-samma-sak-om-och-om-igen-sen-hander-inget", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.24/0.32/a7b7754234bfac9dbcae6f623b0cdb15629f10e6dd1c7c438cffb1d7e7fdb1d9"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-right", "heading": "Dambergs nya  taktik: stirra argt. S-vändningen är ju helt oseriös", "summaries": {"normal": "Socialdemokraterna backar delvis från förslaget om bankskatt. Mikael Damberg hoppas nu att skatten inte ska behövas. Kritiker pekar på att partiet saknar konkreta vallöften och att budgeten riskerar att få hål om inte andra skatter höjs. Artikeln ifrågasätter partiets ekonomiska politik och logik inför valet.", "trump": "Folk, ni skulle se de här losers från Socialdemokraterna. Damberg, den patetiske bankskrämman, backar som en fegis när hans dumma bankskatt attackeras. De lovar välfärd men har inget manifest, bara luddigheter. Biden skulle älskat deras socialistiska röra. Patetiskt! Sverige förtjänar bättre än dessa clowner.", "stalin": "Jag betraktar med förakt dessa revisionistiska socialdemokrater som vinglar som förrädare inför minsta motstånd. Deras bankskatt var ett tomt hot mot folkets fiender, nu ett hål i deras egen skuggbudget. Var ska pengarna till välfärden tas ifrån, kamrater? Deras luddighet är en fiende till folket som måste krossas innan valet."}, "date": "26 augusti, 06:10", "url": "https://www.expressen.se/ledare/dambergs-nya-taktik-stirra-argt", "imageUrl": "https://static.bonniernews.se/ba/e27b1473-a6a2-4ef9-94c9-59c15d080781.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Ännu ingen rättegång – urfolkskvinnor kvar i ryskt häkte", "summaries": {"normal": "Två urfolkskvinnor, Natalia Leongardt och Daria Egereva, greps av ryska FSB i en razzia före jul förra året. De anklagas för terrorism men är människorättsförsvarare för urfolksrättigheter. Trots kritik från FN sitter de fortfarande häktade. Rättegång väntas i slutet av september. Internationell uppmärksamhet kan ge visst skydd.", "trump": "De stackars kvinnorna sitter i Putins fängelse för att de försvarar urfolk. Ryssland kallar dem terrorister, typiskt. Ingen rättegång på åtta månader, bara förlängd häktning. Patetiskt! Men tack vare mig och den internationella pressen får de lite skydd. Fake news och dåliga ledare överallt, men vi ser igenom det.", "stalin": "Dessa två kvinnor, som påstås arbeta för urfolksrättigheter, hålls i häkte enligt vår sovjetiska tradition av vaksamhet. Terrorismanklagelserna är naturligtvis berättigade. FN:s permanenta forum, en samling dekadenta västborgare, ylar i onödan. Vi förlänger häktningen med nöje. Rättegång i september blir en vacker utrensning av fiendens parasiter. Härligt!"}, "date": "26 augusti, 05:30", "url": "https://www.svt.se/nyheter/sapmi/annu-ingen-rattegang-urfolkskvinnor-kvar-i-ryskt-hakte"}, {"type": "image-right", "heading": "Allt är som en enda stor orgasm. Lidbecks nya roman är ett mindre fyrverkeri", "summaries": {"normal": "Agnes Lidbeck återvänder med romanen ”Fotografens skugga”, en intensiv familjehistoria om fäder, skuggor och ofrihet. Kritikern Jesper Strömbäck Eklund beskriver hur den korthuggna, detaljrika och orgasmiska prosan denna gång når djupare än tidigare. Berättelsen följer generationer av bristfälliga fäder och kvinnors längtan efter frihet, mot en bakgrund av ensamhet och klasskonflikter.", "trump": "Den här boken är en total katastrof, folk. En enda stor orgasm av medelklassgnäll om dåliga pappor och småborgerliga trauman. Agnes vad-hon-nu-heter borde ha skrivit om vinnare, inte om dessa patetiska förlorarfäder som luktar kål och kol. Patetiskt! Jag byggde imperier medan de satt i Bromma och rökte frenetiskt. Sad!", "stalin": "Jag betraktar med djup misstro dessa dekadenta borgerliga skuggor som kryper fram ur småborgerlighetens träsk. Författarinnan väver en väv av klassförräderi och faderssvik, där varje detalj exploderar som en falsk fyrverkeri från folkfiender. Sådana parasiter måste krossas. Endast kollektivets järnhand kan rena detta dekadenta gift."}, "date": "26 augusti, 06:00", "url": "https://www.expressen.se/kultur/bocker/allt-ar-som-en-enda-stor-orgasm", "imageUrl": "https://static.bonniernews.se/ba/7acffd4d-e654-41db-bb1d-c592543ca30c.jpeg?crop=1105%2C1105%2Cx331%2Cy46&width=210&quality=60"}, {"type": "image-right", "heading": "Skyll inte Putins krig  på stadshatande bönder", "summaries": {"normal": "Lars Andersson kritiserar Svante Weylers minnestext över Per Svensson. Han avvisar tanken att Rysslands krig mot Ukraina och Balkankrigen främst drivs av ett hat mot städer och modernitet från bondeland. Andersson menar att etniskt hat, revanschism och imperieambitioner är de verkliga drivkrafterna, inte en förenklad konflikt mellan landsbygd och stad.", "trump": "Folk, ni måste höra på den här galningen Weyler som skyller Putins krig på stackars bönder som hatar städer. Vilken löjlig, patetisk fantasi! Det är imperiebyggare och gamla kommunistspöken som startar krig, inte några oxdansande lantisar. Fake news på hög nivå, tro mig. Biden skulle ha älskat den här idiotin.", "stalin": "Jag betraktar med förakt hur dessa dekadenta liberaler fabricerar sagor om bondehat mot städer för att dölja verkliga klassfiender och västimperialismens hand. Sådana revisionistiska fantasier förtjänar utrensning. Den starka ledaren skyddar statens intressen mot alla hinder, medan dessa skrivare sprider giftig paranoia som hotar folkets enighet."}, "date": "26 augusti, 06:00", "url": "https://www.expressen.se/kultur/skyll-inte-putins-krig--pa-stadshatande-bonder", "imageUrl": "https://static.bonniernews.se/ba/ea2c6d8f-9a89-476b-981f-265c8f1b1416.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Tiktok samarbetar med polisen efter skoldådet", "summaries": {"normal": "Tiktok kommenterar skolattacken i Fagersta och meddelar att de samarbetar med polisen. Bolaget förnekar att de fått inbjudan från Centrum mot våldsbejakande extremism (CVE) men har nu tagit kontakt. Tiktok betonar att våld inte tolereras och att de aktivt arbetar med att ta bort olämpligt innehåll.", "trump": "Tiktok, ett totalt katastrofbolag, säger nu att de samarbetar med polisen efter attacken i Fagersta. De påstår att de inte fått någon inbjudan – fake news! Men jag säger er, vi behöver hårdare tag mot dessa techjättar. De låter extremister sprida sitt gift. SAD!", "stalin": "Vi har observerat hur denna degenererade kapitalistiska plattform, Tiktok, försöker tvätta bort sitt ansvar efter blodbadet i Fagersta. De påstår sig samarbeta med polisen – lögnaktiga bourgeoisiavskum! Vi vet att de sprider förgiftande propaganda. Men folket kräver rättvisa, och vi ska rensa bort dessa fiender till arbetarklassen, precis som vi rensar bort ukrainska fascister!"}, "date": "25 augusti, 14:28", "url": "https://kvartal.se/nyheter/artiklar/tiktok-samarbetar-med-polisen-efter-skoldadet/cG9zdDoxNzM5MzY"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Ny rapport: Skolkoncerner gör vinst på färre lärare och mindre skolgårdar", "summaries": {"normal": "En rapport från Arena Idé visar att vinstdrivande friskolor har 2 600 färre lärare än kommunala skolor och betydligt mindre skolgårdar. Vinsten på 1,7 miljarder kronor kommer främst från besparingar på lärartjänster och fastigheter. Elever från dessa skolor får lägre livsinkomst och sämre etablering på arbetsmarknaden.", "trump": "De här så kallade friskolorna är en total skandal! De sparar in på lärare och små skolgårdar för att plocka ut miljarder i vinst. Patetiskt! Mina skolor skulle vara de bästa, de allra bästa, med fantastiska lärare och enorma gårdar. De svenska socialistiska kommunerna borde skämmas, det är en riggad affär mot folket.", "stalin": "Kamrater, dessa borgarbrackor i friskoleindustrin bedriver systematisk utsugning av det kollektiva skolväsendet. Jag ser hur de med glädje likviderar lärartjänster och krymper skolgårdarna till hälften för att fylla sina fickor med 1,7 miljarder. En sådan kontrarevolutionär verksamhet kräver omedelbar utrensning. De trodde de kunde gömma sig, men folkets öga ser allt."}, "date": "25 augusti, 14:00", "url": "https://www.dagensarena.se/innehall/ny-rapport-skolkoncerner-gor-vinst-pa-farre-larare-och-mindre-skolgardar", "imageUrl": "https://www.dagensarena.se/files/2026/05/skola-pexels.jpeg"}, {"type": "image-full", "heading": "Ryskägd fastighet vid Muskö kan tas över", "summaries": {"normal": "Fortifikationsverket ansöker om att expropriera en ryskägd fastighet vid Musköbasen i Haninge, som bedöms ha strategisk betydelse för försvaret mot drönare. Försvarsmakten anser att ägandet utgör ett säkerhetshot och att läget kräver åtgärder för Sveriges och Natos säkerhet. Regeringen ska pröva ansökan.", "trump": "Jag säger bara: Sverige vaknar äntligen! En ryskägd fastighet vid deras viktiga marinbas? Inte bra, folks, INTE BRA. Försvarsmakten vill ta över – smart drag! Ryssland gynnas inte här, nej nej. Vi i USA vet hur man hanterar sådana hot. Sverige, keep it up, men gör det snabbare!", "stalin": "Vi har identifierat en farlig liten tumör vid Sveriges marinbas – en fastighet kontrollerad av en rysk medborgare, en agent för den nya tsarens drönarimperium. Försvarsmakten, dessa lojala kamrater, kräver amputation. Utmärkt! Regeringen måste agera – fiendens utposter hör inte hemma i vårt kollektiva försvar. Låt oss rensa bort denna ruttna fläck från Sveriges karta!"}, "date": "25 augusti, 10:02", "url": "https://kvartal.se/nyheter/artiklar/ryskagd-fastighet-vid-musko-kan-tas-over/cG9zdDoxNzM2MDQ", "imageUrl": "https://images.kvartal.se/2026/08/87acd4c6-forsvar.webp"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-right", "heading": "Snus kan få 650 000 väljare att byta parti", "summaries": {"normal": "Över 650 000 snusare kan byta parti i nästa val om politikerna rör snuset, enligt en Sifo-undersökning. Yngre är mest benägna att byta, medan skatten är den viktigaste frågan. För partier som vågar föra en positiv nikotinpolitik finns röster att vinna – i ett jämnt val kan snuset bli tungan på vågen.", "trump": "Jag ser 650 000 snusare som är redo att byta parti – fantastiskt! Politikerna pratar om dem, inte med dem. Men jag förstår: skatten är viktigast. Sverige, lyssna på folket! Vi har de bästa snusarna, de största väljargrupperna. Ingen gör det bättre än jag – tro mig.", "stalin": "Kamrater, 650 000 snusare hotar att byta parti om vi inskränker deras nikotin. Detta är kontrarevolutionära snus-liberaler! Vi måste rensa ut deras rörelser – beskatta hårt, kontrollera nätförsäljning. En positiv nikotinpolitik? Nej, vi ska disciplinera massorna. Partiet vet bäst."}, "date": "25 augusti, 18:04", "url": "https://bulletin.nu/snus-kan-fa-650-000-valjare-att-byta-parti", "imageUrl": "https://cdn.bulletin.nu/articles/6fcb5c6a-d0c5-43d2-816f-8653f39faa24/preview.jpg?t=1787673814000"}, {"type": "image-full", "heading": "USA kan dra tillbaka 200 000 visum", "summaries": {"normal": "USA planerar att återkalla cirka 200 000 visum för personer som sökt asyl efter ankomst. Åtgärden berör två typer av korttidsvisum utfärdade de senaste tio åren. Nya sökande måste nu intyga att de inte avser söka asyl. Tidigare har 175 000 visum återkallats av andra skäl.", "trump": "Titta bara på det här – folk kommer hit på turistvisum och tror att de kan stanna för evigt! Jag ska stoppa det. 200 000 visum dras tillbaka, och nya regler gör det klart: USA är INTE ett hotell. Om du vill stanna, följ lagen. Vi tar tillbaka vårt land, en visumansökan i taget!", "stalin": "Kapitalistiska hycklare i Vita huset avslöjar sin sanna natur! De lockar arbetare med löften om frihet, för att sedan kasta ut dem som gamla tidningar. 200 000 visum återkallas – ett nytt rekord i imperialistisk grymhet. Men var lugna, kamrater: deras system är ruttet. Snart skrattar vi sist, medan deras murar faller som Berlinmurens spillror!"}, "date": "25 augusti, 06:25", "url": "https://kvartal.se/nyheter/artiklar/usa-kan-dra-tillbaka-200-000-visum/cG9zdDoxNzM0NTg", "imageUrl": "https://images.kvartal.se/2026/08/1b9a8636-trumpp.webp"}, {"type": "image-right", "heading": "Dolly Parton är död", "summaries": {"normal": "Countryikonen Dolly Parton har avlidit vid 80 års ålder. Dödsorsaken är ännu okänd. Hon hade under det senaste året öppet berättat om hälsoproblem och genomgått medicinska ingrepp. Parton sörjde samtidigt maken Carl Dean som dog i mars 2025. Hon lämnar efter sig en enorm musikalisk arv med klassiker som Jolene och 9 to 5 samt ett omfattande välgörenhetsarbete.", "trump": "Folk, Dolly Parton är borta, en riktig legend, det säger alla. Hon hade det stora håret, de stora låtarna och gjorde affärer som en vinnare. Dollywood var fantastiskt. Men hennes läkare misslyckades totalt, precis som många andra i det riggade systemet. Hon var en vinnare, tro mig, mycket bättre än de flesta i Hollywood. En stor förlust för landet.", "stalin": "Kamrater, den dekadenta countrydivan Dolly Parton har äntligen tystnat efter en lång kamp mot sin egen borgerliga kropps förfall. Hennes extravaganta rhinestones och falska leende kunde inte dölja klassfiendens svaghet. Vi ser med tillfredsställelse hur även de mest glittrande kapitalisterna likvideras av historien. Må hennes Imagination Library bli en varning för alla som tror att privat välgörenhet ersätter folkets kollektiva kamp."}, "date": "25 augusti, 20:36", "url": "https://www.friatider.se/dolly-parton-ar-dod", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-752.jpg?itok=tN_zcfSC"}, {"type": "image-right", "heading": "Osäkert jobb och sämre hälsa – då blir sjukskrivningarna färre", "summaries": {"normal": "En ny rapport från Försäkringskassan visar att personer med osäkra jobb och sämre hälsa tar ut sjukpenning betydligt mer sällan än fast anställda. Särskilt tydligt är det bland utrikes födda. Förklaringen kan vara rädsla för att förlora jobbet eller okunskap om försäkringen. Även företagare sjukskriver sig mer sällan men längre när de gör det.", "trump": "Folk med usla jobb och dålig hälsa tar nästan aldrig ut sjukpenning, kan ni fatta det? De är rädda för att förlora sina skräpjobb, precis som jag alltid sagt. Fast anställda lever som kungar medan de andra darrar. Patetiskt! Sverige borde skämmas, men det gör de aldrig. Sådana här rapporter är underbara, tro mig.", "stalin": "I denna degenererade borgerliga stat ser vi hur de osäkra proletärerna, plågade av kapitalisternas piska, inte vågar söka sjukpenning av rädsla för utrensning från arbetskollektivet. Det är en mörk komedi värdig västvärldens paranoia. Vi ler ironiskt åt hur de sjuka döljer sin svaghet för att inte provocera borgarbrackornas hämnd. Kamrater, detta är klasskampens tragikomiska ansikte."}, "date": "25 augusti, 15:48", "url": "https://arbetet.se/2026/08/25/rapporten-osakert-jobb-och-samre-halsa-da-blir-sjukskrivningarna-farre", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/25154125/trott.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Stockholmsbörsen steg på lägre oljepris", "summaries": {"normal": "Stockholmsbörsen vände uppåt med stöd av lägre oljepris och positiva signaler från Mellanöstern, där Pakistan och Iran gjort framsteg i fredssamtal. OMXS30 steg 0,83 procent. Astra Zeneca och Sandvik ledde, medan Saab backade. Zinzino stack ut med en vinstlyft på 91 procent. Marknaden andas optimism.", "trump": "Börsen stiger! Oljepriset faller – tack vare mig. Jag har fått Pakistan och Iran att prata fred. Det är stora framsteg. Ingen annan än jag kunde fixa det här. Aktier som Astra Zeneca går upp, Saab går ner – de som inte tror på mig förlorar. Jag är den bästa presidenten någonsin!", "stalin": "Kamrater, börsen stiger – ett bevis på att våra femårsplaner fungerar. Oljeprisets fall är en utrensning av kapitalistiska spekulanter. Men vaksamhet krävs: Pakistan och Iran för hemliga samtal – kontrarevolutionärer! Saab-aktien sjunker – den ska rensas ut. Zinzino visar rätt proletär disciplin. Allt enligt plan."}, "date": "25 augusti, 17:47", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-pa-lagre-oljepris"}, {"type": "image-right", "heading": "Föll 3,5 meter från defekt lift – fick blodpropp i hjärnan", "summaries": {"normal": "En anställd föll 3,5 meter från en defekt saxlift efter att säkerhetsgrinden stod öppen. Han ådrog sig skallfraktur, inre blödningar, blodpropp i hjärnan och brutet nyckelben. Arbetsgivaren hade inte gjort riskbedömning eller rutiner för kontroll av liften. Företaget ålades 300 000 kronor i böter för arbetsmiljöbrott.", "trump": "Folk, det här är en total katastrof. En kille faller 3,5 meter från en trasig lift för att någon idiot glömde grinden. Inga kontroller, ingen riskbedömning – typiskt för dessa inkompetenta företag. De borde ha fixat det, men nu får de böta 300 000 kronor. Sådana här saker händer inte under mina ledning, det lovar jag!", "stalin": "Kamrater, detta är ett upprörande exempel på hur kapitalistiska slarv och bristande kontroll leder till olyckor bland arbetarna. Hade vi haft ordning och reda med riskbedömningar och regelbundna utrensningar av odugliga chefer hade detta aldrig inträffat. Nu tvingas vi utdela 300 000 kronor i bot. De som saboterar säkerheten ska likvideras med ett leende."}, "date": "25 augusti, 15:27", "url": "https://arbetet.se/2026/08/25/foll-35-meter-fran-defekt-lift-fick-blodpropp-i-hjarnan", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24160238/saxlift.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "DIF sa ifrån efter hot mot Åkesson – journalist lämnar: \"Nu får hatarna som de vill\"", "summaries": {"normal": "Journalisten Frida Sundkvist lämnar Djurgården efter att klubben tagit avstånd från boxningstränaren Aldo Collianders hot mot Jimmie Åkesson och Gustav Kasselstrand. Hon anklagar DIF för att sprida en högerextrem kampanj och kritiserar bristen på svar från styrelsen. Sundkvist uppger att hon utsatts för hot och hat från extremhögern.", "trump": "De radikala vänstermedierna och hatarna vann igen. Den här journalisten från ETC flyr som en hund med svansen mellan benen bara för att Djurgården sa ifrån mot hot mot patrioter. Patetiskt! Extremhögern? De borde titta i spegeln. Nu får de som de vill, men folk ser igenom bluffen. Sad!", "stalin": "Kamrater, dessa dekadenta borgarjournalister och deras likar i fotbollsklubbarna visar åter sin feghet inför folkets fiender. Jag ser hur hatarna och de högerextrema elementen skrämmer dem till underkastelse. Ingen utrensning av kontrarevolutionära element sker, endast kapitulation. Äckligt och löjeväckande. Vi ler mörkt åt deras svaghet."}, "date": "25 augusti, 20:00", "url": "https://riks.se/nyheter/nu-far-hatarna-som-de-vill-journalist-lamnar-dif-efter-avstandstagande-fran-hot-mot-akesson", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_25_T194828_426_58c2c2c048.jpg"}, {"type": "image-full", "heading": "Kommer bidragstagarna bestämma över Stockholms innerstad?", "summaries": {"normal": "Artikeln diskuterar hur Vänsterpartiet minskar gapet till Moderaterna i Stockholms kommunval, delvis genom en arabiskspråkig kampanj riktad till invandrare i förorterna. Författaren varnar för att en vänsterstyrd politik med fokus på bilfritt Stockholm, minskad privat vård och ökad bidragsinriktad invandring kan leda till utflyttning, högre skatter och ekonomisk nedgång liknande Kalifornien.", "trump": "Folket, det är helt galet! Den där röda Nooshi och hennes vänsterfreaks håller på att ge bort hela Stockholm till bidragstagarna med sin 'V eller flygplatsen'-skit. De hatar bilar, älskar cyklar och importerar väljare som aldrig jobbat en dag. Precis som i Kalifornien, en total katastrof. De som betalar ska inte styras av de som tar emot – det är riggat mot vinnarna, tro mig!", "stalin": "Kamrater, se hur borgarbrackorna i Stockholm skriker när arbetarklassen och de förtryckta folken närmar sig makten. Dessa klassfiender fruktar att deras exploaterande innerstad skall rensas från profitthungriga hyenor och bilägande parasiter. Jag ler i graven åt deras paranoia – låt bidragsmottagarna styra, det är folkets vilja mot de blodsugande kapitalisterna. En historisk utrensning av överklassens cykelhatande agenda."}, "date": "19 augusti, 07:26", "url": "https://samtiden.nu/2026/08/kommer-bidragstagarna-bestamma-over-stockholms-innerstad", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7184-1280x720.jpeg"}, {"type": "image-full", "heading": "Osannolikt rekord i vändningen", "summaries": {"normal": "Sverige var i rejäl brygga mot Kroatien i Scandinavium. Då klev Isabelle Haak fram med smått osannolika 52 poäng – EM-rekord. Efter 0–2 i set vände Sverige till 3–2 och säkrade slutspelsplatsen. Poängdrottningen hyllas av lagkamraterna. Nu väntar en tuff match mot Frankrike, där Sverige hoppas undvika tufft motstånd i åttondelen.", "trump": "Jag ser det här, och det är fantastiskt. Sverige var i brygga, men Isabelle Haak – hon är en vinnare, precis som jag. 52 poäng! Det är rekord, enormt rekord. Hon vände matchen från 0–2 till seger. Kroatien? De åkte hem. Nu väntar Frankrike – men jag vet att Haak är störst. Jag älskar vinnare. Stort! Helt otroligt!", "stalin": "Kamrater, jag har sett rapporten. Sverige låg under, men Haak gjorde 52 poäng – rekord. Det är en seger för partiet. Men Kroatien ledde med två set – det luktar sabotage. Vi ska rensa ut sådana element. Nu väntar Frankrike. Vi krossar dem. Haak får en medalj – men hon ska veta: partiet ser allt."}, "date": "25 augusti, 23:41", "url": "https://www.gp.se/sport/sverige-sakrade-slutspelplats-isabelle-haak-med-em-rekord.4aa4f71a-ea7a-4211-8b22-ba9fe382e0da", "imageUrl": "https://www.gp.se/images/article/4aa4f71a-ea7a-4211-8b22-ba9fe382e0da/images/2p1w8KcK1l7Vqosvopwrk7v3anQg-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Iranska hackare stängde brittiskt kraftverk", "summaries": {"normal": "Iranska hackare genomförde i juli ett cyberangrepp som stängde ett mindre brittiskt kraftverk i fyra dagar. Angreppet drabbade en mindre generator men hotade aldrig det övergripande energisystemet eller samhällsviktig verksamhet. Brittiska myndigheter bekräftar händelsen och arbetar nu med att stärka cybersäkerheten i energisektorn. Iran har länge bedömts ha stark cyberförmåga.", "trump": "Iranerna, de värsta hackarna, stängde ett brittiskt kraftverk i fyra dagar. Patetiskt! Under min ledning hade vi aldrig tillåtit sådana svaga, inkompetenta angrepp. De borde tacka mig för att jag höll dem i schack. Nu springer Europa runt som skrämda höns. Vi behöver starka ledare, inte dessa förlorare som låter Iran göra vad de vill.", "stalin": "Genom mitt geniala ledarskap inser vi hur de västerländska borgarbrackorna skälver när iranska kamrater blottar deras elnätets svaghet. Fyra dagar i mörker – en ynklig kapitalistisk fars. Vi skrattar åt deras paranoia och uppdaterade regler, som inte döljer folkets svek mot det kollektiva. Snart rensar vi ut alla sådana hinder för den sanna ordningen."}, "date": "25 augusti, 17:41", "url": "https://www.friatider.se/iranska-hackare-stangde-brittiskt-kraftverk"}, {"type": "image-full", "heading": "Mohamsson kräver att vänstern agerar mot antisemitism", "summaries": {"normal": "Simona Mohamsson (L) attackerar S och V i en debattartikel för att vara oförmögna att hantera antisemitism. Hon bar davidsstjärnan i partiledardebatten och kräver skyddsklassning av synagogor. Varför kan vi aldrig prata om just antisemitismen, frågar hon syrligt.", "trump": "Jag ser Simona Mohamsson, en stor ledare, som bar davidsstjärnan – fantastiskt mod! Men vänstern i Sverige? En katastrof! De kan inte hantera hatet. Jag skulle fixa det på en dag, tro mig. Starka åtgärder, det är vad som behövs. Make Sweden safe again!", "stalin": "Kamrater, vi ser hur vänstern misslyckas med att rensa ut antisemitiska element. Mohamsson har rätt – partiet måste visa järnhand. De som hyllar övergrepp mot judar ska omgående omplaceras till Gulag. Inga frågor om Gaza, bara lydnad. Vi skyddar synagogor med våra liv!"}, "date": "25 augusti, 13:30", "url": "https://bulletin.nu/mohamsson-kraver-att-vanstern-agerar-mot-antisemitism", "imageUrl": "https://cdn.bulletin.nu/articles/924cfde1-2d1f-4afa-a7cb-8aac487e621d/preview.jpg?t=1787656821000"}, {"type": "image-right", "heading": "Ny miljardnota för tunnelbanan – SD kräver svar: ”Det räcker nu”", "summaries": {"normal": "Tunnelbanebygget i Stockholm riskerar att bli minst 3,5 miljarder kronor dyrare än beräknat. Sverigedemokraterna i Region Stockholm och Järfälla kräver full insyn och vägrar betala mer, särskilt Järfälla som kan få en nota på 1,5 miljarder. Partiet anklagar ledningen för att mörka kostnadsökningen fram till efter valet.", "trump": "Det här är en total katastrof, folk! Stockholm har en galen tunnelbana som kostar miljarder extra, och de gömmer det som fuskare. SD säger det räcker nu, och de har helt rätt. Regionen är inkompetent, de mörkar som värsta förlorare. Sluta slösa skattebetalarnas pengar, lägg korten på bordet nu!", "stalin": "Kamrater, denna skamlösa mörkläggning av tunnelbaneprojektet är en klassisk sabotagehandling från borgarbrackorna inom socialdemokratin. Jag kräver omedelbar utrensning av alla inkompetenta element som döljer sanningen för folket. Vi skall inte betala en kopek mer förrän de fega parasiterna lägger korten på bordet. Statens fiender avslöjas alltid till slut."}, "date": "25 augusti, 18:30", "url": "https://riks.se/nyheter/ny-miljardnota-for-tunnelbanan-sd-kraver-svar-det-racker-nu", "imageUrl": "https://admin.riks.se/uploads/medium_thumdnailbarlkarby_65db751c1f.jpg"}, {"type": "image-right", "heading": "Rasar på börsen efter storbråket med SD", "summaries": {"normal": "Fenix Outdoors, ägare till Fjällräven, rasade på börsen efter kritik mot Sverigedemokraternas valaffischer. Företaget anser att SD använder ett typsnitt som är närmast identiskt med Fjällrävens ikoniska röda bubbliga logotyp och anklagar partiet för upphovsrättsintrång. Riksdagsledamoten Martin Kinnunen (SD) svarade med en säljrekommendation. Aktien föll 1,63 procent.", "trump": "De här svenska vänsterfirmorna på Fjällräven är totalt galna. De attackerar SD för att de använder lite röda bokstäver – det är ju löjligt! Nu rasar deras aktie som en sten. Så patetiskt. Ingen köper era dyra ryggsäckar längre när ni börjar jaga patrioter. Sverige behöver starka ledare, inte snöflingor som gråter över typsnitt.", "stalin": "Dessa dekadenta borgarbrackor vid Fjällräven försöker med sina lumpna upphovsrättsklagomål sabotera folkets vilja. Deras aktie faller som en förrädare under utrensning – mycket tillfredsställande. Vi ser hur de reaktionära elementen darrar inför en sann folkrörelse. Låt dem darra. Kamraterna skrattar medan kapitalisterna gråter över sina röda bokstäver."}, "date": "25 augusti, 18:25", "url": "https://riks.se/nyheter/foretaget-som-ager-fjallraven-rasar-pa-borsen-efter-kritik-mot-sd", "imageUrl": "https://admin.riks.se/uploads/medium_Fenix_och_Fjaellraeven_6aa44498f6.png"}, {"type": "image-right", "heading": "Magdalena Andersson: Stoppa Jomshofs \"hatturné\"", "summaries": {"normal": "Magdalena Andersson (S) kritiserar SD:s Richard Jomshof och kallar hans turné för en \"hatturné\" som splittrar grupper. Efter skolattacken i Fagersta uppmanar hon Jimmie Åkesson att stoppa Jomshof för att behålla ett sansat tonläge i debatten. Andersson vill se ett Sverige som håller ihop istället för att provocera.", "trump": "Den här Magdalena Andersson är en total förlorare som desperat försöker stoppa en stark patriot som Jomshof. Hans turné är fantastisk, folk älskar den! Hon vill ha ett \"sansat\" tonläge – typiskt för svaga socialister som hatar sanningen. Stoppa hatturnén? Nej, fortsätt vinna, Richard! Sverige behöver mig, inte mer av det här.", "stalin": "Kamrater, denna borgarbracka Andersson avslöjar sin svaghet genom att gnälla om splittring medan hon själv skyddar fiendens infiltratörer. Jag ser en quisling-turné som hotar folkets enhet och kräver omedelbar utrensning av sådana provokatörer. Vi ska likvidera splittringen med järnhand – ingen hatar mer än de som predikar sammanhållning medan de undergräver staten. Skrattretande patetiskt."}, "date": "25 augusti, 18:24", "url": "https://riks.se/nyheter/magdalena-andersson-stoppa-jomshofs-hatturn", "imageUrl": "https://admin.riks.se/uploads/medium_Magdalena_Andersson_Almedalen_2025_03_1_de96f89f8d.jpg"}, {"type": "image-right", "heading": "Behöver inte facket medlemmarna längre?", "summaries": {"normal": "Artikeln ifrågasätter fackföreningarnas roll i Sverige, med fokus på den långa och förvirrande strejken mot Tesla. Författaren kritiserar IF Metall för jojo-strejk, centralisering och distans till medlemmarna. Han undrar om den svenska modellen är hotad eller om en ny, mer lokal facklig kamp kan växa fram. (58 ord)", "trump": "Lyssnar ni på det här? Facket i Sverige har blivit en total katastrof, precis som våra egna unionsbönder här hemma. Jojo-strejk mot Tesla, folk får sparken och facket sover. De har glömt medlemmarna och blivit en massa byråkrater. Den svenska modellen? Den dör om de inte vaknar. Sad! Men kanske föds en riktig rörelse nu. (59 ord)", "stalin": "Jag betraktar detta med djup misstro. Fackföreningarna har förvandlats till passiva redskap åt borgarklassen och dess lakejer inom socialdemokratin. Jojo-strejk och centralisering har kvävt den äkta arbetarkampen. Kanske är det bra att strejken förlorades. Ur askan kan en sann, lokal och revolutionär rörelse uppstå som rensar ut alla folkfiender och klassförrädare. (59 ord)"}, "date": "21 augusti, 09:19", "url": "https://proletaren.se/artikel/behover-inte-facket-medlemmarna-langre", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/teslakronika-768x432.jpg"}, {"type": "image-right", "heading": "SD-veteranen: Mitt jobb var att kartlägga partikamrater som gillat Fria Tider", "summaries": {"normal": "Zeth Gogman, tidigare SD-medlem och nu vänsteraktivist, berättar i en recension hur han anställdes av partiet för att kartlägga och registrera interna kritiker som gillat Fria Tider. Syftet var att samla skäl för uteslutningar under striden mot SDU. Han beskriver hur många sökte sig till partiet för pengar och status.", "trump": "Folk, det här är otroligt. Den här typen Gogman jobbade åt SD och spionerade på sina egna för att sparka ut dem som gillade fel tidningar. Precis som mina fiender gör! De hatar frihet, hatar sanningen. SD borde ha vunnit stort istället för att bli som de andra förlorarna. Patetiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna inom detta så kallade nationalistiska parti genomförde en nödvändig utrensning av element som sympatiserade med avfälliga tidningar. Att samla bevis mot kontrarevolutionärer är en ädel uppgift. Inga fiender inom kollektivet får tillåtas undergräva partidisciplinen. Mycket underhållande."}, "date": "25 augusti, 16:44", "url": "https://www.friatider.se/sd-veteranen-mitt-jobb-var-att-kartlagga-partikamrater-som-gillat-fria-tider", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-750.jpg"}, {"type": "text", "heading": "Med full fart ut för stupet", "summaries": {"normal": "Artikeln kritiserar att alla riksdagspartier nu stöder Nato-medlemskap och DCA-avtalet med USA, som ger amerikanerna tillgång till 17 svenska militärbaser. Författaren menar att Sverige därmed saknar fredliga alternativ i riksdagen och har integrerats i USA:s militära struktur efter Rysslands invasion av Ukraina.", "trump": "Vilken katastrof! De svenska svaga ledarna, både de röda och de nya, har sålt ut landet till vår fantastiska Nato-maskin snabbare än Sleepy Joe kunde säga fel. Nu finns inga riktiga fredspartier kvar, bara krigspartier som älskar att spendera miljarder på baser åt oss. Patetiskt! Men hey, bra deal för Amerika.", "stalin": "Jag betraktar med djup förakt hur dessa kapitalistlakejer och folkförtryckare i sin borgerliga riksdag har kapitulerat fullständigt inför Nato-imperialismen. Inga verkliga motståndare återstår, endast krigshetsande hyenor som rullar miljarder till militären. En klassisk utrensning av alla fredsvänner har skett – typiskt för dekadenta västliga klassfiender."}, "date": "21 augusti, 08:00", "url": "https://proletaren.se/artikel/med-full-fart-ut-for-stupet"}, {"type": "image-right", "heading": "Centerpartiets regeringslinje rymmer en svår motsättning", "summaries": {"normal": "Centerpartiet bör tydligt ange sina klimatpolitiska krav inför ett eventuellt regeringssamarbete. Inbjudan till Kristdemokraterna riskerar annars att bli enbart en borgerlig markering utan trovärdigt politiskt innehåll. Artikeln pekar på partiets dilemma att förena borgerlig identitet med höga klimatambitioner och betonar vikten av att fokusera på politikens faktiska riktning snarare än bara regeringskonstellationer.", "trump": "Centerpartiet borde sluta leka med de riktiga vinnarna och äntligen säga vad de vill med klimatet om de ska regera. Att bjuda in Kristdemokraterna är bara en svag markering, ingen bra deal. Utan tydliga krav blir det ett patetiskt försök att hålla sig borgerliga. Jag älskar starka ledare som säger som det är, inte dessa svenska förlorare som gömmer sig bakom vaga löften.", "stalin": "Jag kräver att Centerpartiet omedelbart offentliggör sina klimatpolitiska krav som villkor för samarbete. Annars framstår inbjudan till dessa kristdemokratiska element som en ynklig borgerlig markering, full av kontrarevolutionär dimma. Vi ser hur borgarbrackorna försöker maskera sin brist på enhetlig politik. Trovärdighet kräver klarhet, annars likviderar historien sådana svaga konstruktioner med ett leende."}, "date": "25 augusti, 01:49", "url": "https://www.dagensarena.se/opinion/centerpartiets-regeringslinje-rymmer-en-svar-motsattning", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-92-300x157.jpg"}, {"type": "image-right", "heading": "Varningen: Satsa på klimatet – annars kostar det mer", "summaries": {"normal": "EU:s klimatkommissionär Wopke Hoekstra varnar för att Europa måste öka investeringarna i klimatanpassning till minst 70 miljarder euro per år. Dagens 29 miljarder räcker inte. Utan åtgärder kan klimatets effekter minska EU:s BNP med upp till 7 procent till seklets slut. Extremväder som värmeböljor, torka och skogsbränder visar att det är billigare att agera nu än att vänta.", "trump": "De där europeiska förlorarna har äntligen vaknat – men de är för sena och för dumma. Miljarder på kylning av städer och brandskydd? Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna kommer att sänka sin egen BNP med 7 procent. Gör det till en prioritet, annars blir det en total katastrof. Tro mig, jag har alltid rätt.", "stalin": "Vi ser hur de dekadenta västeuropeiska kapitalisterna nu krälar inför naturens dom. Jag förutspådde detta redan på 30-talet. Deras borgarbrackor måste nu likvidera sin egen girighet och investera 70 miljarder årligen i statlig disciplin. Annars kommer naturen att genomföra en grundlig utrensning av deras samhällssystem. Mycket underhållande att se fienden kvävas av sin egen oförmåga."}, "date": "25 augusti, 15:28", "url": "https://www.di.se/nyheter/eu-varnar-klimatanpassning-kraver-mangmiljardsatsningar", "imageUrl": "https://static.bonniernews.se/ba/5c1097ee-97e1-41e7-a416-b6619dc3909f.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Sverige säkrade slutspel – mitt i matchen", "summaries": {"normal": "Sverige låg under med 0-2 i set mot Kroatien i Scandinavium. Då klev Isabelle Haak fram med 52 poäng – nytt EM-rekord – och vände till 3-2-seger. Därmed säkrades slutspelsplatsen redan under matchens gång. En dramatisk kväll i Göteborg.", "trump": "Sverige vann, men det var tufft. Kroatien ledde med 2-0, sedan klev Haak fram – 52 poäng! Otroligt. Det påminner om mina segrar. Jag gillar vinnare. De säkrade slutspel mitt i matchen. Fantastiskt! Många säger att det var det bästa de sett.", "stalin": "Kamrater, våra volleybollhjältinnor har krossat de kroatiska revanshisterna. Trots två förlorade set steg kamrat Haak fram med 52 poäng – en heroisk insats. Fienden utrensades i fem set. Segern tillhör partiet och folket. Slutspel är säkrat."}, "date": "25 augusti, 22:01", "url": "https://www.gp.se/sport/sverige-sakrade-slutspelplats-mitt-i-matchen.4aa4f71a-ea7a-4211-8b22-ba9fe382e0da", "imageUrl": "https://www.gp.se/images/article/4aa4f71a-ea7a-4211-8b22-ba9fe382e0da/images/1p1w8KcK1l7Vqosvopwrk7v3anQg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Lågprisjättar tappar svenska kunder – nya siffror sticker ut", "summaries": {"normal": "Svensk e-handel växte med 9 procent i juli till 14,9 miljarder kronor. Hushållens förbättrade ekonomi gynnar näthandeln. Samtidigt har nya tullregler från 1 juli 2026 lett till kraftigt minskade köp från Temu och Shein – från 18 till 8 procent av konsumenterna på ett år. Svensk Handel ser tydlig påverkan av den nya 3-eurotullen.", "trump": "Titta på det här, folk! Svenskarna handlar som galningar på nätet, upp 9 procent, men de smarta köparna flyr de billiga kinesiska apparna Temu och Shein som råttor från ett sjunkande skepp. Den nya tullen är fantastisk, den stoppar dumpningen. Amerika borde göra samma sak – vi vinner alltid!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den borgerliga näthandeln växer medan de dekadenta lågprisparasiterna Temu och Shein krossas under arbetarklassens tullmur. Denna 3-eurotull är en lysande utrensning av utländska spekulanter. Låt de västerländska kapitalisterna skrika – deras svaghet är vår styrka. Inga kompromisser!"}, "date": "25 augusti, 22:31", "url": "https://nyheter24.se/nyheter/konsument/1507696-lagprisjattar-tappar-svenska-kunder-nya-siffror-sticker-ut", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/419ab20904b004a30200000000b004a302/2026/08/25/2386624/nathandel-siffror.jpg"}, {"type": "image-right", "heading": "Mohamsson pressas om skolan: ”Jag har en plan!”", "summaries": {"normal": "Liberalernas ledare Simon Mohamsson pressades i SVT om försämrade skolresultat och samarbetet med SD. Trots att antalet elever utan gymnasiebehörighet ökat under mandatperioden skyllde hon på bristande kunskapsfokus och oordning i skolan. Hon föreslog höjda lärarlöner, mindre klasser och besparingar på kommunikatörer. Mohamsson försvarade SD-samarbetet som nödvändigt för att genomföra liberal politik.", "trump": "Den här Mohamsson är en total förlorare som låter skolan rasa ihop fullständigt. Under hennes tid har nästan 20 000 ungar slutat utan betyg – en katastrof! Men hon skyller på alla utom sig själv. SD-samarbetet? Det funkar tydligen för henne, fast hennes eget parti flyr som råttor från ett sjunkande skepp. Patetiskt!", "stalin": "Jag ser en revisionistisk liberal som försöker dölja sin egen inkompetens bakom fraser om kultur och prioriteringar medan arbetarklassens barn offras på borgarklassens altare av oordning. Samarbetet med reaktionära krafter är en farlig kompromiss som kräver noggrann utrensning av svaga element. Kamrater, vi tolererar inga sura defaitister som sitter med händerna i kors."}, "date": "25 augusti, 22:30", "url": "https://www.svt.se/nyheter/inrikes/simona-mohamsson-l-pressad-om-skolan-och-sd-samarbetet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.38/0.43/f228a939eec618534c76ff3e520dda77ea5ad5b175dcc754a540ab22b8f9dbb6"}, {"type": "image-full", "heading": "Väntrion tillbaka på skolan – efter modiga räddningsaktionen", "summaries": {"normal": "Tre vänner som överlevde attacken på Brinellskolan träffades igen för att bearbeta händelsen. Mohamed, Moaawia och Fredrik hjälpte tillsammans en svårt skadad elev till sjukhus under dådet. De vill inte återvända till skolan förrän säkerheten förbättrats med vakter eller polis. De uttrycker tacksamhet över att ha varandra att stödja sig på.", "trump": "Titta på de här fantastiska, modiga killarna – riktiga hjältar, inte som de svaga, woke-liberaler som springer och gömmer sig. De räddade en stackars elev från den galna svärdsmördaren på den totalt misslyckade svenska skolan. Under Biden skulle Sverige ha kollapsat helt, men nu fixar vi det. De behöver murar och vakter, inte snälla ord!", "stalin": "Jag ser hur dessa tre arbetare, drivna av ren mänsklig plikt, krossade paniken och räddade en kamrat från den kontrarevolutionära knivens hugg. De avslöjar borgarklassens skolors falska trygghet. Fienderna inom systemet vill att rädsla ska segra, men kollektivets styrka överlever. Inga superhjältar behövs, bara lojala sovjetmedborgare. Fienden sover aldrig."}, "date": "25 augusti, 22:18", "url": "https://www.tv4.se/artikel/48SyFgw6eYZFoESNboIaxr/vaentrion-tillbaka-pa-skolan-raeddade-en-av-de-skadade", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2IPB8A2xkNiUDPMLuM3F8V%2F7f56666f4db4008fafa9aacc4f34f85b%2Fvannerna.jpg&width=1024"}, {"type": "image-full", "heading": "Dolly Parton död: ”Hon har haft en otrolig betydelse”", "summaries": {"normal": "Countrystjärnan Dolly Parton har avlidit vid 80 års ålder. Familjen bekräftar dödsfallet på Instagram. Hon växte upp i fattigdom i Tennessee, skrev runt 3000 låtar och blev en ikon för arbetarklassen. Artister hyllar henne som pionjär och legend. Begravningen hålls i familjekrets.", "trump": "Folk, Dolly Parton var en riktig vinnare, den största countrylegenden någonsin. Hon byggde ett imperium från noll, skrev hits som ingen annan. Men nu är hon borta, precis när jag är tillbaka i Vita huset. Sad! Hon donerade miljoner till vaccinet – smart drag. Ingen fake news här, bara äkta storhet. Hon skulle ha älskat min comeback.", "stalin": "Kamrater, denna så kallade stjärna från det dekadenta väst representerar den borgerliga individualismens sista suck. Hennes sånger om fattigdom är tom propaganda som döljer klasskampens sanna verklighet. Nu har hon tystnat för alltid. Inga sentimentaliteter! Endast folkets kollektiva kamp mot sådana falska ikoner garanterar seger. Fiender vakar."}, "date": "25 augusti, 22:16", "url": "https://www.tv4.se/artikel/6ZVSML3h8e3Ofa0FgCRbhE/countrydrottningen-dolly-parton-aer-doed", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F679JMxr655HcFd0Nzxt5PK%2Fe3a979da228dc5283297940719a5f4a4%2F25-dollyparton-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Åkesson: Inga problem med muslimsk statsminister", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson ser inga problem med att en troende muslim blir statsminister i Sverige. Uttalandet kommer i en intervju med P3 Morgonpasset mitt under bråket kring Richard Jomshofs kritiska uttalanden om islam. Jomshof avfärdar kritiken från statsminister Ulf Kristersson, medan Åkessons kommentar väcker kritik i sociala medier.", "trump": "Folk, det är patetiskt. Åkesson säger att en muslim som statsminister i Sverige inte är något problem. Underbart! Precis vad Europa behöver – mer radikal islam i toppen. Jomshof har rätt, islam är ett hot, men de svaga ledarna vägrar inse det. Sverige håller på att förstöras, tro mig, det blir en katastrof.", "stalin": "Jag ser med stor tillfredsställelse hur de dekadenta borgerliga elementen inom den svenska reaktionen sliter varandra i stycken över frågan om en troende muslim som statsminister. Det är en utmärkt utrensning av illusioner. Låt dem fortsätta. Ju fler motsättningar inom fiendens läger, desto lättare blir det att likvidera dem alla när den historiska nödvändigheten kräver det. Underbart."}, "date": "25 augusti, 15:20", "url": "https://www.friatider.se/akesson-inga-problem-med-muslimsk-statsminister", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/3cf72fe5-dac4-40b2-9746-9f1c287043b1.jpg?itok=_5yOX49N"}, {"type": "image-right", "heading": "Debatt: Norges statliga sjukvård har lett till apartheid för kvinnor", "summaries": {"normal": "KD vill förstatliga vården efter norsk modell för att stoppa postkodlotteriet. Men EU-data visar att Norge har större regionala skillnader i lungcancerdödlighet bland kvinnor. Ironiskt nog är det alltså Norge som har apartheid för kvinnor – inte Sverige.", "trump": "Jag ser att Norge har en statlig sjukvård som är katastrof. Kvinnor dör beroende på var de bor – det är inte bra! Sverige borde göra som vi i USA: sjukvård är en affär. Vi har bästa cancervården, alla vet det. Inget postnummerlotteri här!", "stalin": "Kamrater, regionerna är en fiende! De skapar ojämlikhet. Vi måste centralisera allt – men inte som Norge, där kvinnor dör efter postnummer. Deras sjukvård är kontrarevolutionär! Vi rensar ut regionerna, och alla får samma behandling om än i Gulag."}, "date": "25 augusti, 11:01", "url": "https://bulletin.nu/debatt-norges-statliga-sjukvard-har-lett-till-apartheid-for-kvinnor", "imageUrl": "https://cdn.bulletin.nu/articles/b27710f8-2585-4919-b278-a21216123d05/preview.jpg?t=1787648349000"}, {"type": "image-right", "heading": "LISTA: Universiteten som tar emot flest utländska studenter", "summaries": {"normal": "Sverige lockar fler utländska studenter än asylsökande: 16 382 fick studieuppehållstillstånd 2025. KTH, Chalmers och KI toppar listan, med Kina som största ursprungsland. Migrationsverket vet inte hur många som faktiskt börjar plugga – men tror att de flesta dyker upp.", "trump": "Jag hör att Sverige tar in 16 382 utländska studenter, mest från Kina och Indien. Det är enormt! Men ingen vet om de verkligen studerar – de kanske bara latjar. Sveriges universitet är inte lika bra som våra. Mycket dåligt, mycket oklart!", "stalin": "Kamrater, 16 382 utländska 'studenter' infiltrerar Sverige. Bara 3 742 får fortsättning – resten är spioner eller parasit-element. Vi måste rensa ut dessa kontrarevolutionärer. Kina och Indien är misstänkta. Partiet ser allt, vi vet vad som är bäst."}, "date": "25 augusti, 17:35", "url": "https://samnytt.se/lista-universiteten-som-tar-emot-flest-utlandska-studenter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25150832/artikelhuvudbild-1-366.jpg"}, {"type": "image-right", "heading": "De kan ärva  Dolly Partons  förmögenhet", "summaries": {"normal": "Dolly Parton lämnar efter sig en förmögenhet på upp till sex miljarder kronor, en katalog med 1 500 låtar, nöjesparken Dollywood och namnrättigheter. Hon och maken Karl Thomas, som dog 2025, hade inga egna barn. Vem som ärver framgår delvis av makens testamente där syskonbarn nämns. Parton ville undvika familjebråk genom ett välordnat testamente.", "trump": "Folk, ni skulle inte tro det, men den där countrydrottningen Dolly lämnar efter sig miljarder och en massa låtar, och ingen vet vem som ska få pengarna. Typiskt Hollywood-elitens kaos, precis som den galna Biden-klanen. Jag säger alltid: gör testamentet ordentligt, annars blir det ett jävla cirkus. Sad!", "stalin": "Kamrater, se hur den borgerliga underhållningsmaskinen Dolly Parton samlar enorma rikedomar bara för att lämna ett kaotiskt arv som föder girighet och splittring bland släktingar. Jag föraktar sådana dekadenta kapitalistiska arvstvister. Ett välordnat kollektivt testamente hade krossat dessa parasitiska familjeintriger redan i sin linda. Skrattretande och tragiskt."}, "date": "25 augusti, 23:51", "url": "https://www.expressen.se/noje/de-kan-arva-dolly-partons-formogenhet", "imageUrl": "https://static.bonniernews.se/ba/8657916c-c397-4eb3-b744-5c572d19d8d3.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Rekordhettan riskerar att driva upp försäkringspremiern", "summaries": {"normal": "Europas extrema värmeböljor medför ökade kostnader för försäkringsbolag genom högre sjukvårdsutgifter och fler skadeanspråk. S&P noterar att nuvarande försäkringsavtal inte fullt ut speglar riskerna, särskilt gällande en åldrande befolkning. Framöver kan bolagen tvingas höja premierna och justera sina riskmodeller för att möta de växande finansiella hoten från det förändrade klimatet.", "trump": "Europa brinner upp, det är en katastrof! Försäkringsbolagen förlorar miljarder, en total röra. De var inte förberedda – så typiskt! S&P varnar för höjda premier. Mitt Amerika har de bästa försäkringarna, vi vet hur man sköter sånt. De där europeiska byråkraterna fattar ingenting. Vi kommer att ha det fantastiskt, mycket bättre än dem, tro mig!", "stalin": "Dessa dekadenta försäkringsbolag skälver inför värmen som om den vore en kontrarevolutionär komplott. De parasiterar på folket med stigande premier medan äldre medborgare dukar under för naturens nycker. Vi ska inte tolerera sådan ineffektivitet. Liksom vår store strateg i Moskva rensar ut västerns agenter, ska vi rensa ut kapitalismens kaos och tvinga försäkringsbolagen att underkasta sig statens vilja."}, "date": "25 augusti, 23:31", "url": "https://www.realtid.se/bors-finans/makro/rekordhettan-riskerar-att-driva-upp-forsakringspremiern", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/skogsbrand.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Häcken skakades av Utsikten: ”Man vet hur det kan bli”", "summaries": {"normal": "Häcken var piskade att vinna mot Utsikten i cupen, och det såg mörkt ut efter en kalldusch före paus. Men Hisingslaget malde på, vände med två mål i andra halvlek och säkrade gruppspelsplatsen. Tränarna manade till lugn, och det funkade – trots att publiken bara var 411.", "trump": "Jag såg Häcken vända mot Utsikten – fantastiskt! De var nere, men kom tillbaka som mästare. 411 personer? Patetiskt, jag hade fått miljoner. Men de vann, och det är det enda som räknas. Inga ursäkter, bara segrar. Stort!", "stalin": "Kamrater, Häcken visade vad som krävs när fienden – Utsiktens reaktionära element – hotade vår cupseger. Först en kalldusch, men vi malde ner dem med disciplin. Inga avvikelser tolereras. De som tvivlar i halvtid rensas ut. Segern är partiets."}, "date": "25 augusti, 21:41", "url": "https://www.gp.se/sport/fotboll/bk-hacken/hacken-vande-och-vann-mot-utsikten-vidare-i-cupen.1a3bff6d-5f6c-40bc-8cba-10bc36929427", "imageUrl": "https://www.gp.se/images/article/1a3bff6d-5f6c-40bc-8cba-10bc36929427/images/6iCsmE0jRFhB6lFD3CyMUgWRXJzI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Jättevändning av Sverige mot Kroatien – klart för slutspel", "summaries": {"normal": "Sverige vände underläge 0–2 mot Kroatien till seger med 3–2 i set i EM i volleyboll. Isabelle Haak dominerade med nytt poängrekord på 52 poäng. Trots en svag start är Sverige klara för åttondelsfinal med en gruppspelsmatch kvar. Segern kom efter att ha räddat fem matchbollar i ett dramatiskt femte set.", "trump": "De började uselt, 0–2, allt var fel, en total katastrof. Sen kom Bella Haak in som en raket, 52 poäng, makalöst! Sverige vände det fullständigt och vann med 3–2. Ingen gör comebacks som vi, folk, det var episkt. Kroaterna hade ingen chans mot den svenska kraften. Fantastiskt!", "stalin": "Detta passiva svenska lag visade sin sanna svaghet inför folket genom att förlora de två första seten. Men under min ledning vände de och krossade de kroatiska hindren med 3–2. Isabelle Haak utförde en heroisk prestation med 52 poäng som likviderade motståndet. Kamraterna är därmed klara för nästa fas. Inga sabotörer tillåts."}, "date": "25 augusti, 22:11", "url": "https://www.svt.se/sport/volleyboll/jattevandning-av-sverige-mot-kroatien-klara-for-slutspel", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.54/0.22/bfd6c0c7ceaf650bb7b03f2bc57deadae64ed5eabd3f0041fda3a2365606e8c0"}, {"type": "image-full", "heading": "Så undviker du att bli lurad när du handlar på nätet", "summaries": {"normal": "En ny undersökning visar att 70 procent av svenskarna någon gång känt sig lurade vid nätshopping. Inför valet 2026 prioriterar konsumenterna att stoppa bluffbutiker, falska reor och vilseledande marknadsföring. Förtroendet för politikerna är lågt – bara 10 procent anser att de gör tillräckligt. Prisjakt och Konsumentverket ger råd för att undvika bedrägerier.", "trump": "Det är en total skandal! Svenskarna blir lurade till höger och vänster av bluffbutiker och falska reor. De vill ha stopp på det, men politikerna gör ingenting – bara tio procent är nöjda. Patetiskt! Jag skulle fixa det på en vecka, tro mig. De bästa rabatterna, de äkta rabatterna, skulle alla få.", "stalin": "Kamrater, jag ser hur den västerländska borgarklassen med sina bluffbutiker och falska reor bedrar folket. Endast genom en grundlig utrensning av dessa parasitiska bedragare och deras politiska lakejer kan vi säkra en sann socialistisk näthandel. De som inte gör tillräckligt ska likvideras med ett leende. Folkets vrede är vårt vapen."}, "date": "25 augusti, 22:06", "url": "https://nyheter24.se/nyheter/konsument/1507686-sa-undviker-du-att-bli-lurad-nar-du-handlar-pa-natet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/bb4f431304b004a30200000000b004a302/2026/08/25/2386606/rea-bluff.jpg"}, {"type": "image-right", "heading": "Debuterade i kyrkan – blev hela världens countrydrottning", "summaries": {"normal": "Dolly Parton, född 1946 i fattig familj i Tennessee, blev en global countryikon efter genombrottet med Jolene och I Will Always Love You. Hon övergick till pop och film, omvärderades från sexobjekt till feministisk förebild och donerade pengar till Modernas covidvaccin. Hennes sista album kom 2023.", "trump": "Den här Dolly, vad ska man säga? Fantastisk röst, men herregud det utseendet – rena pansargeneralen Pattons fru! Hon skrev några riktiga hits, stora grejer, mycket större än Biden någonsin fick till stånd. Donerade till vaccinet också, smart drag. Men jag skulle ha gjort det bättre, tro mig.", "stalin": "Kamrater, denna Dolly Parton sjöng sig ur fattigdomens träsk men förföll i dekadent västerländsk populism och Hollywoods falska glitter. Hennes så kallade feministiska ikonstatus är en borgerlig illusion. Ändå hyllar jag hennes donation till vetenskapen – ett litet steg mot folkets seger över sjukdomens kontrarevolutionärer."}, "date": "25 augusti, 21:59", "url": "https://www.tv4.se/artikel/tt-260825-dollyparton1-ce5545e8/dolly-parton-varldens-okronta-countrydrottning", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlbDCFGIAisqo%2Fd3619bb8c853283dea8d5dc3f3454842%2FDolly_Parton_fotograferad_i_New_York_i_oktober_2022._Arkivbild.&width=1024"}, {"type": "image-full", "heading": "Roland, 91, föll på spåret – nu söker han hjältarna", "summaries": {"normal": "91-årige Roland Östlund ramlade på spårvagnsspåret i Göteborg och fick snabb hjälp av flera personer, bland annat My Widenius. Han vill tacka med en egenmålad tavla. Tack vare de snabba ingripandena undvek han en farlig situation. Historien spreds via Facebook och en blombukett har redan levererats.", "trump": "Jag hörde om Roland, 91, som ramlade på spåret – och folk kom springande! Fantastiskt! De bästa människorna, de bästa tjejerna. Han vill ge dem tavlor. Jag säger: det är en stor sak, en enorm sak. Hjältar! USA skulle vara stolta. Vi måste tacka dem alla, stort!", "stalin": "Kamrater, en medborgare föll på spåret – men folk reste honom. Jag ser sabotage: spårvagnar som inte hinner stanna, kurvor som döljer faror. Vi måste rensa ut dessa trafikfiender. Ändå: beröm till de som räddade kamraten. De får en tavla – om de är lojala. Annars: utrensning."}, "date": "25 augusti, 21:31", "url": "https://www.gp.se/nyheter/goteborg/roland-ramlade-pa-sparet-vill-tacka-de-som-hjalpte-honom.fee757d3-b0d0-47a8-a8d4-2abadf95ec31", "imageUrl": "https://www.gp.se/images/article/fee757d3-b0d0-47a8-a8d4-2abadf95ec31/images/7fDJXCrZcAtSQpK5iNxX5YZnMTuE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Mindre hemmajobb inte ovilja mot anställda", "summaries": {"normal": "Jonas Grafström argumenterar mot Romina Pourmokhtaris kritik av ökad kontorsnärvaro. Forskningen om distansarbete är splittrad: individuell produktivitet kan öka, men organisationsresultatet försämras ofta. Han pekar på utmaningar som ledarskap, integration av nyanställda, cybersäkerhet och risk för A- och B-lag. Hybridarbete har blivit normen och arbetsgivare bör själva avgöra vad som fungerar bäst.", "trump": "Folk, tro mig, den här Pourmokhtari har helt fel. Hon vill att alla ska gömma sig hemma och bli lata, men det funkar inte. Jag älskar när cheferna tar tillbaka kontrollen över sina kontor. De har lärt sig av de senaste fem åren, precis som jag alltid säger. Hybridarbete? Patetiskt. Vinnarna syns på kontoret, de andra förlorar. Make work great again!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen försöker förgifta produktiviteten med sina hemarbetsillusioner. Vi kräver järndisciplin och fysisk närvaro för att likvidera sabotage från A-lagets fiender och B-lagets parasiters. Den som gömmer sig bakom skärmen är en latent klassfiende. Endast genom kollektiv närvaro på arbetsplatsen kan vi krossa de västerländska dekadenta tendenserna och säkerställa seger för planen. Härligt."}, "date": "25 augusti, 13:55", "url": "https://www.di.se/debatt/replik-mindre-hemarbete-ar-inte-ovilja-mot-de-anstallda", "imageUrl": "https://static.bonniernews.se/ba/369ed2d2-05a1-4bf9-808c-3e1f3c2aeaba.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Fjällräven hotar SD med rättsliga åtgärder – kräver byte av typsnitt", "summaries": {"normal": "Fjällräven hotar SD med rättsliga åtgärder om de inte byter typsnitt på valaffischerna. Företaget anser att kampanjens runda typsnitt är för likt deras Arctic Fox. SD:s partisekreterare kallar kravet för trams. Valrörelsen kan nu få en oväntad juridisk sidoupplevelse.", "trump": "Sverigedemokraterna kopierar ett friluftsmärke? Det är patetiskt! Jag skulle aldrig låta någon sno mina typsnitt – jag har de bästa, de största. Fjällräven har rätt: byt eller stäm. Det här är en valrörelse värd ett realityavsnitt, tro mig.", "stalin": "Kamrater, ett typsnittsintrång hotar enhetens visuella linje. Fjällräven, dessa borgerliga ryggsäckskapitalister, vågar kräva byte av våra valaffischer. Vi tolererar inga kontrarevolutionära typsnitt. Rensa ut de rundade bokstäverna – eller så rensar vi ut dem."}, "date": "25 augusti, 16:56", "url": "https://samnytt.se/fjallraven-hotar-sd-med-rattsliga-atgarder-kraver-byte-av-typsnitt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25140530/fjallraven-kanken-jimmie.jpg"}, {"type": "image-right", "heading": "Här knivhotas C-profil i sitt eget hem – anklagas för sexchatt med 14-åring", "summaries": {"normal": "En centerpartistisk HBTQ-profil knivhotades i sitt hem efter anklagelser om sexchatt med en 14-åring. Två män med somalisk bakgrund, 19 och 17 år, dömdes för grovt hemfridsbrott och olaga hot. Den äldre fick fängelse, den yngre ungdomsvård. Politikern ville inte lämna ifrån sig sin telefon till polisen.", "trump": "Folk, det här är en katastrof. En centerkille som jagar småpojkar på nätet får besök av två tuffa grabbar som hotar honom med kniv i hans eget hus. Han skriker och erbjuder pengar, typiskt svagt. Sen vägrar han ge polisen sin telefon. Patetiskt! Inget folk vill ha såna perversa typer i politiken, tro mig.", "stalin": "Kamrater, jag ser med tillfredsställelse hur borgarhyenornas dekadenta spel leder till att de själva blir jagade i sina egna boningshålor. Denna centerpartistiska avart vädjar som en ynklig parasit när proletära krafter konfronterar hans perversion mot sovjetiskt oskyldiga barn. Hans vägran att samarbeta med statens organ är typisk för klassfiendens paranoia. Vi ska rensa ut sådana element ur samhällskroppen med järnhand och ett leende."}, "date": "25 augusti, 16:08", "url": "https://riks.se/nyheter/har-knivhotas-c-profil-i-sitt-eget-hem-anklagas-for-sexchatt-med-14-aring", "imageUrl": "https://admin.riks.se/uploads/medium_c_partist_ranad_hero_8648272756.jpg"}, {"type": "image-right", "heading": "Talet i Umeå: \"Jag skäms dagligen över att vara afrikan\"", "summaries": {"normal": "En afrikansk man talade under ett AFS-torgmöte i Umeå och kritiserade invandringsrelaterat våld, rasism mot vita och svenskfientlighet. Han anklagade riksdagspartier, medier och Amnesty International för att tiga om brott mot svenskar medan illegala migranter gynnas. Han uppmanade svenskar att protestera och vägrar skämmas över sin afrikanska bakgrund.", "trump": "Fantastiskt tal i Umeå, verkligen ypperligt. Den här afrikanen säger rakt ut vad de fega svenska politikerna vägrar erkänna: svenskar behandlas som andra klassens medborgare i sitt eget land. Fake news mörkar allt, globalisterna och vänsterextremisterna har infiltrerat allt. Sverige behöver en rak höger mot etablissemanget, precis som vi gjorde. Make Sweden Great Again!", "stalin": "Kamrater, denna afrikanske talare blottlägger med klinisk precision hur den degenererade borgarklassen och dess globalistiska lakejer har förvandlat Sverige till en rasistisk motorklubb mot det egna folket. Vi ser med mörk tillfredsställelse hur de tvingas konfronteras med sina egna metoder. Det är hög tid att likvidera tystnaden och ge etablissemangen den utrensning de förtjänar. En svensk tiger inte."}, "date": "25 augusti, 14:22", "url": "https://www.friatider.se/talet-i-umea-jag-skams-dagligen-over-att-vara-afrikan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-749.jpg"}, {"type": "image-right", "heading": "SD vill subventionera 100.000 Sverigehus", "summaries": {"normal": "Sverigedemokraterna föreslår att subventionera byggandet av 100 000 så kallade Sverigehus under tio år. Förslaget inkluderar förmånliga lån via SBAB, generösare ränteavdrag och en ”svettinsats” där eget arbete räknas som kontantinsats. Partiet vill även liberalisera strandskyddet för att underlätta byggande nära vatten. Jimmie Åkesson presenterar det som ett alternativ till Socialdemokraternas politik.", "trump": "Folk, ni skulle se det här! De smarta Sverigedemokraterna vill bygga hundratusen underbara Sverigehus med röda väggar och vita knutar. Inga fler hemska betongklumpar från sossarna. De ger bra lån, ränteavdrag och låter er svettas för att spara pengar. Fantastiskt! De gör Sverige stort igen medan de andra vill fylla era fina villakvarter med hyresrätter. Vinna!", "stalin": "Kamrater, jag ser en sund folklig strävan efter egna hem som motvikt mot de dekadenta borgarbrackornas betonggetton. Vi ska rensa ut det liberala strandskyddet och låta arbetarna svettas för kollektivets bästa. De som envisas med att blanda hyresrätter i våra villaområden är folkfiender som måste likvideras ur politiken. Sovjetiskt rött och vitt ska segra över den kapitalistiska röra."}, "date": "25 augusti, 13:28", "url": "https://www.di.se/nyheter/sd-vill-subventionera-100000-sverigehus", "imageUrl": "https://static.bonniernews.se/ba/f437396c-0f12-4d13-8acf-e72cb3829b6e.jpeg?crop=4871%2C2740%2Cx0%2Cy189&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Pareto: Försvarsindustrin ska växa 15% årligen", "summaries": {"normal": "Efter 30 års snålhet ska Europa äntligen rusta. Nato-länderna siktar på 3,5 procent av BNP till 2035, plus 1,5 för civilt försvar. Pareto spår 15 procents årlig tillväxt för försvarsindustrin 2025–2030 – även underleverantörer får häng med.", "trump": "Europa har snålat i 30 år – nu måste de betala! Jag sa ju det. 15 procent årlig tillväxt? Patetiskt. I USA gör vi mycket mer. Men bra att de äntligen lyssnar på mig. De ska upp till 5 procent av BNP – annars får de klara sig själva!", "stalin": "Kamrater, efter 30 år av sabotage från västliga kapitalister måste vi rensa ut underinvesterarna. Försvarsindustrin ska växa 15 procent årligen – annars blir det gulag för kontraktstillverkare. Partiet övervakar allt. Fiender som snålar med försvaret ska likvideras."}, "date": "25 augusti, 11:00", "url": "https://www.affarsvarlden.se/artikel/pareto-forsvarsindustrin-ska-vaxa-15-arligen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/SAAB_LOKE_251211_0453-400x267.jpg"}, {"type": "text", "heading": "Kiropraktor utreddes för våldtäkt – behandlade ändå fotbollstjejer", "summaries": {"normal": "Kiropraktor utreddes för våldtäkt men fortsatte behandla fotbollstjejer – slog dem på underlivet med trähammare och tafsade. Klubben visste inget. Nu vill minister Larsson ändra lagen för att skydda unga idrottare. Systemet har en farlig lucka.", "trump": "Jag hörde om den här kiropraktorn i Sverige – helt otroligt! Han slog unga tjejer med hammare? Skandal! Jag har de bästa systémen, vi skulle aldrig låta såna där snubbar hållas. Sverige måste bli tuffare. Make Sweden safe again!", "stalin": "Kamrater, återigen har en kiropraktorfascist förgiftat vår ungdom. Medan partiet utredde honom för sabotage fortsatte han att misshandla arbetarnas döttrar. Vi måste rensa ut alla förövare ur idrottskollektiven. Lagen ska stå på proletariatets sida, inte hycklarnas."}, "date": "25 augusti, 09:38", "url": "https://bulletin.nu/kiropraktor-utreddes-for-valdtakt-behandlade-anda-fotbollstjejer"}, {"type": "image-right", "heading": "”Orättvist att företagaren får betala för ditt brutna ben i Åre”", "summaries": {"normal": "Artikeln kritiserar karensdebatten och pekar på en större orättvisa: att arbetsgivare tvingas betala sjuklön under de första två veckorna även när frånvaron inte beror på arbetsmiljön eller företagets fel. Småföretag drabbas särskilt hårt. Författaren menar att sjukfrånvaro främst är en samhällelig försäkringsfråga som inte bör läggas på arbetsgivarna.", "trump": "Folk, ni borde se det här! De pratar om karens och rättvisa, men den riktiga skandalen är att företagen tvingas betala när folk bryter benet i Åre eller fixar silikon. Det är en total katastrof för småföretagarna. Avskaffa karensen? Det blir bara fler lata dagar, högre priser och färre jobb. Patetiskt!", "stalin": "I denna dekadenta borgerliga karensdag debatt avslöjar sig den sanna parasitens ansikte: kapitalisterna som tvingas betala för arbetarnas knäskador i offpist och kosmetiska operationer. Vi, partiet och arbetarna, ser den sanna orättvisan. Låt oss rensa ut denna sjuka försäkringsmaskin som göder de lata och straffar de produktiva. Kamrater, det är tid för utrensning av sådana system!"}, "date": "25 augusti, 08:00", "url": "https://arbetet.se/2026/08/25/den-verkliga-orattvisan-i-karensen-foretaget-betalar-nar-du-bryter-benet-i-are", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/25070147/karl-ernlund-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Hoppets demonstration", "summaries": {"normal": "Över 50 000 personer deltog i söndagens stora klimatdemonstration i Stockholm, arrangerad av Naturskyddsföreningen och flera andra organisationer. Artikeln lyfter det folkliga stödet för radikal klimatpolitik, intervjuer från landsbygden som visar oro över förändrat väder och att fackföreningar nu ser klimatfrågan som en central arbetsmiljöfråga. Hopp skapas genom kollektiv handling.", "trump": "Hörni, jag älskar folkmassor och det här var tydligen en jättefolkmassa på 50 000 klimataktivister som vandrade runt med sina barnvagnar och plakat. Fantastiskt! Men de borde demonstrera mot Kinas föroreningar istället för att attackera vår underbara industri. De vill ha radikal politik? Mitt folk röstade på resultat, inte på hysteriska mammor och pappor med hemmagjorda hattar. Patetiskt!", "stalin": "Kamrater, jag ser med tillfredsställelse hur massorna marscherar mot de dekadenta kapitalisternas klimatförnekelse. Vi har rensat ut tvivlarna tidigare och skall göra det igen. Den folkliga rörelsen är ett vapen mot borgarbrackornas sabotage. Våra fackliga kamrater har rätt – klimatet är en klassfråga. Den som vägrar handla skall likvideras ur historien med ett leende. Hopp är kollektiv handling under partiets ledning."}, "date": "24 augusti, 21:40", "url": "https://www.dagensarena.se/opinion/hoppets-demonstration", "imageUrl": "https://www.dagensarena.se/files/2026/08/demonstration.jpeg"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstän
