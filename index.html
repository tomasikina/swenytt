nske politikern Peter, en total katastrof till socialdemokrat, sprang iväg som en fegis när min vän Gustav ställde tuffa frågor om våra fantastiska amerikanska baser! De skickade till och med in polisen och en dam i pride-tröja för att skydda honom. Så svagt! Fake news-media och ynkliga politiker som inte tål lite hetta. Sad!", "stalin": "Kamrater, den svenske byråkraten Hultqvist darrar inför enkla frågor och gömmer sig bakom både partikamrater och statens poliser! Om han inte ens klarar av en kritisk röst i solskenet, hur ska han då leda försvaret mot öster? En kontrarevolutionär terrorbalans ledd av en rädd hare. Vi sänder omedelbart en delegation för att inspektera hans ryggrad!"}, "date": "5 september, 07:00", "url": "https://samnytt.se/video-polisen-skyddar-s-toppen-fran-kritiska-fragor-olaga-hot", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/04231712/artikelhuvudbild-1-444.jpg"}, {"type": "image-right", "heading": "Markus Allards hat slutar i min inkorg", "summaries": {"normal": "Artikeln beskriver hur debattören utsätts för grova våldshot efter en diskussion med Örebropartiets Markus Allard. Författaren kritiserar hur populistiska politiker använder hat och extrema uttalanden för att vinna uppmärksamhet. Trots personliga likheter i bakgrund ses hat mot invandrare som avgörande för att tillhöra ”folket”. Skribenten vädjar om saklig debatt istället för polarisering.", "trump": "Folk, det här är precis vad som händer när de galna vänsterliberala hatarna får fritt spelrum. Den här Allard-killen skriker ut sanningar om invandrare och etablissemanget medan de riktiga losersen svarar med dödshot. Typiskt för de dekadenta HBTQ-kvotarna som hatar vanliga arbetare. Jag fixade Amerika, nu behöver Sverige en riktig ledare som inte är en sådan patetisk förlorare.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare förgiftar debatten med sina hatiska utspel. Jag betraktar med avsmak hur folkets fiender använder hot och paranoia för att splittra massorna. Den sanna arbetarklassen behöver inte sådana metoder. Vi måste rensa ut dessa parasiterande opportunister innan de förgiftar hela samhällskroppen. Politiken ska tjäna folket, inte hatet."}, "date": "1 september, 12:45", "url": "https://www.flamman.se/markus-allards-hat-slutar-i-min-inkorg", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/markus-allard-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "USA-topparna i Moskva – Putin pausar attacker", "summaries": {"normal": "USA:s sändebud Steve Witkoff och Jared Kushner har anlänt till Moskva för samtal med president Vladimir Putin om att avsluta kriget i Ukraina. I samband med besöket har Putin beordrat en tre dagar lång paus för attacker mot Kiev. På söndagen reser förhandlarna vidare till Ukraina för möte med president Volodymyr Zelenskyj.", "trump": "Jag skickade just mina stjärnförhandlare Steve Witkoff och Jared Kushner till Moskva eftersom jag fixar avtal som ingen annan ens kan stava till. Putin pausar till och med anfallen mot Kiev nu när mina grabbar är på plats. Biden hade bara skapat kaos, men vi gör stora framsteg för att äntligen stoppa det här vansinnet!", "stalin": "De amerikanska agenterna har landat i Moskva för att beskåda den permanenta disciplinen hos vår mäktiga sovjetiska arvtagare. Kiev beviljas tillfällig nåd från himlens stålregn medan förhandlingar pågår. Om de västerländska emissarierna tror på svaghet misstar de sig; proletariatets fiender krossas obönhörligt, och varje avvikelse från den korrekta ideologiska linjen kommer att beivras omedelbart."}, "date": "5 september, 17:15", "url": "https://www.gp.se/nyheter/varlden/usas-forhandlare-pa-plats-i-moskva-putin-pausar-attacker.743cb423-bea2-4a6a-9d1c-148b23637715", "imageUrl": "https://www.gp.se/images/article/743cb423-bea2-4a6a-9d1c-148b23637715/images/1eapFO6b3wR3lX7CAX69ST3kVFcE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Synd att politikerna inte lyckats slänga upp kulturpolitiskt valfläsk", "summaries": {"normal": "Kulturkrönikören Ola Bo Larsson kritiserar partierna för att inte bättre utnyttja väljarnas intresse för kulturpolitik inför valet. Trots engagerade talespersoner saknas konkreta visioner om kulturens roll i samhället. Han lyfter frågor som låg kulturbudget, techföretagens dominans, AI-hot mot upphovsrätt och kultur som maktmedel i både demokratiska och auktoritära perspektiv. Debatten har flyttat till en större arena än partierna hanterar.", "trump": "De här svenska kulturpolitikerna är totala förlorare, folksamlingens värsta nollor. De pratar högt om kultur men levererar inget valfläsk som tänder folket. Patetiska globalister som låtit dekadenta identitetsaktivister och woke-kultur sluka deras hjärnor. Jag byggde den starkaste ekonomin i världen, de klarar inte ens att försvara sin egen konst. Patetiskt!", "stalin": "Kamrater, dessa fegisar inom oppositionen och de liberala lakejerna har svikit folket genom att inte paketera kulturens kraft som ett vapen mot de giriga hyenorna. Jag ser hur de blodsugande klassförrädarna marginaliserar konsten medan folkbildningen förfaller. En sann ledare skulle ha genomfört en grundlig utrensning av sådana svaga element redan för länge sedan. Skamligt."}, "date": "5 september, 01:30", "url": "https://www.dagensarena.se/opinion/synd-att-politikerna-inte-lyckats-slanga-upp-kulturpolitiskt-valflask", "imageUrl": "https://www.dagensarena.se/files/2026/08/ola-larsson-300x157.jpeg"}, {"type": "image-right", "heading": "Slopad mängdrabatt låter bra, tills du får fakturan", "summaries": {"normal": "Artikeln kritiserar att det statliga reformutrymmet för nästa mandatperiod bara uppgår till 50 miljarder kronor per år eftersom stora summor redan är bundna till försvar, infrastruktur och kriminalvård. Skjutvapenvåldet har vänt nedåt medan bedrägerier ökar. Författaren ifrågasätter om de planerade tiotals miljarderna till utökad kriminalvård är kostnadseffektiva när annan brottslighet minskar.", "trump": "Titta på de här svenska clownerna! De slösar bort era pengar på att bygga fler fängelser än vad Stalin hade, fast brottsligheten minskar. Underbara Elisabeth Svantesson säger att det bara finns 50 miljarder kvar, men det går rakt in i kriminalvårdens svarta hål. Rena galenskapen. De borde satsa på riktiga saker istället för att mata det korrupta systemet. Patetiska losers.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i Sverige redan har intecknat folkets pengar till fängelseimperier trots att brottsligheten sjunker. De profitthungriga hyenorna planerar tiotals miljarder till kriminalvård medan arbetarna får stå tillbaka. Jag ler ironiskt från historien åt denna byråkratiska vansinne. En sanering av sådana prioriteringar vore på sin plats."}, "date": "5 september, 01:16", "url": "https://www.dagensarena.se/opinion/slopad-mangdrabatt-later-bra-tills-du-far-fakturan", "imageUrl": "https://www.dagensarena.se/files/2026/09/straffmassan.jpeg"}, {"type": "image-right", "heading": "Medborgardemokratin måste vara upplyst", "summaries": {"normal": "Artikeln hyllar den svenska folkbildningstraditionen från 1900-talet, där bibliotek, studiecirklar och böcker stärkte medborgarnas kunskaper och demokratin. Författarna varnar för att sociala medier och techoligarker nu hotar denna upplysta demokrati genom att försvaga traditionella medier och koncentrera makt. De uppmanar stiftelser och politiker att återupprätta folkbildningen.", "trump": "Folkbildning? Det var på den gamla goda tiden när riktiga arbetare blev medborgare istället för att gråta över kvoter och identitetspolitik. Nu koloniserar de galna techoligarkerna allt med sina sjuka algoritmer. Jag har varnat för det här länge – Musk och Vance fattar det, men de dekadenta europeiska förlorarna vill hellre ha mer censur än sund amerikanism. Patetiskt!", "stalin": "Jag betraktar med djup misstro hur de profitthungriga klassförrädarna i techoligarkins tjänst åter förvandlar medborgare till undersåtar. Deras algoritmer är ett nytt slags förgiftad propaganda som undergräver folkets upplysning. Kamraterna måste rensa ut dessa parasiterande element och åter bygga en sann folkbildning som tjänar kollektivet. Den som tvekar är fiende till historien själv."}, "date": "5 september, 01:10", "url": "https://www.dagensarena.se/opinion/medborgardemokratin-maste-vara-upplyst", "imageUrl": "https://www.dagensarena.se/files/2026/09/sverker-och-mans.jpeg"}, {"type": "image-full", "heading": "V lovar pressa S till vänstersväng", "summaries": {"normal": "Vänsterpartiet och ledaren Nooshi Dadgostar siktar på en kraftig vänstersväng för en eventuell S-ledd regering efter valet. Med starkt opinionsläge kräver V ministerposter och radikala reformer som kortad arbetstid och gratis tandvård. Socialdemokraternas partiledare Magdalena Andersson är dock skeptisk till samarbetet och anser att V har en lång resa kvar att göra.", "trump": "Vänsterpartiets radikala ledare i Sverige tror att hon kan tvinga socialdemokraterna åt vänster med sina galna socialistiska idéer om gratis tandvård och korta arbetsveckor! Hon vill hålla sin premiärminister borta från dåligt sällskap, men sanningen är att det här totalt kommer att krossa ekonomin. De har stora problem och falska nyheter överallt, det är ett totalt misslyckande!", "stalin": "Kamrat Dadgostar visar äntligen prov på nödvändig disciplin genom att diktera villkoren för de vacklande socialdemokraterna och rensa bort borgerligt avfall. Men den så kallade ledaren Andersson tvekar och talar om en lång resa – ett farligt ideologiskt avsteg som omedelbart bör utredas av säkerhetstjänsten. Partiet måste hållas enhetligt, och de som vacklar kommer att finna att vägen till gulagen är korthuggen."}, "date": "5 september, 17:07", "url": "https://www.gp.se/nyheter/sverige/v-lovar-pressa-s-till-vanstersvang.104dc6fe-0982-517c-8a8b-021f88639459", "imageUrl": "https://www.gp.se/images/article/104dc6fe-0982-517c-8a8b-021f88639459/images/1eUnhBng23Z2FoLDUUSolXTP66lY-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Månsson spurtade hem Tjejmilen – nu ska hon cykla i två timmar", "summaries": {"normal": "Tilda Månsson vann Tjejmilen på hemmaplan efter en stark spurt på upploppet där hon besegrade Carolina Wikström. Hon sprang milen på 33 minuter och 43 sekunder. Triatleten, som ligger trea i världscupen, fortsatte dagen med ytterligare träning inför kommande VM-final. Hon beskrev vinsten som mycket rolig.", "trump": "Titta, den här Tilda tjejen är en vinnare, en riktig vinnare, folk. Hon spurtade förbi den andra löparen som en raket på hemmaplan. Fantastiskt! Under Biden hade vi bara förlorare och kvoteringar, men nu är jag tillbaka och de riktiga stjärnorna skiner. Ingen woke-flum här, bara ren kraft. Stort grattis, Tilda!", "stalin": "Kamrater, denna Tilda Månsson visar arbetets och disciplinens styrka genom att krossa motståndaren i spurten. Vi ser hur den sanna viljan övervinner dekadenta klassförrädare som gömmer sig bakom löjliga identitetsillusioner. Jag ler från historien åt sådana segrar medan folkförtryckarna darrar. Fortsätt träna, segern tillhör de starka."}, "date": "5 september, 13:17", "url": "https://www.svt.se/sport/triathlon/tilda-mansson-vinner-tjejmilen-efter-spurtuppgorelse"}, {"type": "image-full", "heading": "Jakob Sjölander: Ukrainsk vapenbrist, europeisk viljebrist", "summaries": {"normal": "Jakob Sjölander kritiserar Europas bristande stöd till Ukraina efter fyra år av krig. Trots en samlad ekonomi som är tio gånger större än Rysslands ger de flesta länder under en procent av BNP i hjälp. Europa köper mer rysk energi än de skickar i stöd, saknar militärindustri och vägrar dela Patriot-robotar. Detta avslöjar en djup viljelöshet och politisk paralys.", "trump": "Lyssnar ni på den här Sjölander-killen? Europa är en total förlorare, en patetisk skara av svaga ledare som pratar stort men gör noll. De betalar Putin mer för gas än de ger Ukraina – det är galet! Jag byggde den starkaste armén, Biden och hans globalister förstörde allt. Nu kryper de för en bensinmack medan jag fixar freden. Ynkryggar!", "stalin": "Kamrater, se hur dessa dekadenta europeiska parasiterna kryper i stoftet inför historien. Med sina feta byråkratier och gröna fantasier förråder de sina egna folk. Jag skrattar mörkt från evigheten åt deras ryggradslösa kräk. Rysslands järnhand visar vägen medan de samlar rostiga vapen som aldrig används. Deras svaghet är vår eviga glädje."}, "date": "2 september, 12:29", "url": "https://samtiden.nu/2026/09/jakob-sjolander-ukrainsk-vapenbrist-europeisk-viljebrist", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/ukra.png"}, {"type": "text", "heading": "Strid om nya byggkraven: \"Riskerar konkurser\"", "summaries": {"normal": "Boverket föreslår att utsläppen från nya byggnader ska minska med omkring 35 procent till 2030. Förslaget möter hård kritik från två håll. Stora börsbolag och industrin vill ha tuffare krav för att driva på klimatomställningen, medan mindre företag varnar för skenande administrativa kostnader och risker för konkurser.", "trump": "De radikala miljömupparna i Sverige förstör ekonomin med sina galna påhitt! Boverket tvingar på stackars företag absurt skadliga regler. Stora företag gnäller, småföretagarna krossas av dyra byråkratiska räkningar och riskerar konkurser. Jag säger: låt marknaden bygga fritt, sluta med det här tramsiga klimatreglerandet och sätt 'America First' – eller i det här fallet, låt svenskarna bygga utan skadligt tjafs!", "stalin": "Vi noterar att de svenska fastighetsbolagen och byråkraterna grälar om procentsatser för utsläpp likt småborgerliga förrädare. Staten fastställer nu en balanserad norm på trettiofem procent. Om de svaga elementen i byggsektorn gråter över kostnader och hotar med ruin, påminner vi om att partiets linje är oåterkallelig. Endast genom järnhård disciplin och ökad kollektiv produktion bygger vi framtiden."}, "date": "4 september, 14:47", "url": "https://www.affarsvarlden.se/artikel/strid-om-nya-byggkraven-riskerar-konkurser"}, {"type": "image-full", "heading": "Så mycket högre kan elräkningen bli", "summaries": {"normal": "Sverige står inför en vinter med högre elpriser än föregående år, särskilt i södra delarna. Orsakerna är låga vattennivåer och höga gaspriser i Europa. Prognosen pekar på hundratals kronor dyrare månadskostnader för hushåll. Villaägare i elområde 4 kan räkna med cirka 3 700 kronor i månaden, exklusive nätavgifter och skatter.", "trump": "Sveriges elpriser går rakt upp i taket – en katastrof! De har inte råd med sin egen energi, helt otroligt. Självklart händer det här när man vänder ryggen åt kärnkraften. Det är en total röra, mycket värre än vad de säger. Räkningarna blir enorma, riktigt 'huge'. Man måste ha energi, man måste ha kraft – Sverige behöver ordning, inte mer av det här!", "stalin": "Dessa löjliga elräkningar är ett bevis på folkets ineffektivitet. Att medborgare i söder gnäller över några hundralappar visar bara på en dekadent individualism. Istället för att lita på väder och vind borde staten styra varje kilowatt med järnhand. Planera ekonomin, stäng av de onödiga lamporna och arbeta hårdare för fosterlandet – elbrist är ett svek mot den kollektiva framgången."}, "date": "4 september, 07:56", "url": "https://www.realtid.se/tt-nyhet/sa-mycket-hogre-kan-elrakningen-bli", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/rakna-med-dyr-elvinter-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Uppgifter: Vapenvila inför amerikanska besöket i Kiev", "summaries": {"normal": "Donald Trump skickar sändebud till Moskva och Kiev för att försöka få igång fredssamtal. Enligt uppgifter har ukrainska styrkor beordrats att iaktta en fyra dagar lång vapenvila under besöket. Ryssland har trots detta genomfört attacker mot Kievregionen där två personer skadats. Flera ukrainska militärer är skeptiska till förhandlingarna.", "trump": "Vi skickar mina bästa killar till Moskva och Kiev för att fixa det här vansinnet. Det blir en jättevapenvila, fyra hela dagar, och chanserna att vi får till fred är kolossala, tro mig. De fega byråkraterna i Kiev gnäller förstås, medan Sleepy Joes efterdyningar fortfarande sabbar allting. Men jag fixar det – ingen gör det bättre än jag.", "stalin": "Kamrater, se hur de dekadenta västmakterna fumlar med sina patetiska sändebud och korta vapenvilor. De fientliga hindren från Kiev är bara ynkliga försök att störa den ryska statens naturliga sfär. Jag ler från historien åt denna fars. Den starka ledaren i Kreml vet vad som måste göras mot sådana svaga motståndare. Inga kompromisser med förrädare."}, "date": "5 september, 07:09", "url": "https://www.tv4.se/artikel/6lm54Pq86GLxpPIdRQ3zpF/uppgifter-vapenvila-infoer-amerikanska-besoeket-i-kiev", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5hlbp2ChD6YLkrGXgk4pAc%2F951ac7db50e295d43244f2e320903edd%2F06-3.jpg&width=120"}, {"type": "image-right", "heading": "Vänsterpartiet – islamismens bakdörr in i regeringen", "summaries": {"normal": "Artikeln varnar för att en valseger för Socialdemokraterna skulle ge Vänsterpartiet inflytande över regeringen. Författaren hävdar att partiet präglas av islamism, antisemitism och extremism, och att massinvandring från muslimska länder ökar risken för att sådana krafter får makt i svenska beslutsorgan. Socialdemokraterna uppmanas ta ansvar och säga nej till regeringsplats för Vänsterpartiet.", "trump": "Folk, det här är en katastrof! De svenska kommunisterna och radikala islamisterna smyger in genom bakdörren med Sleepy Joe-stilen från Socialdemokraterna. Massinvandring har gett oss en vacker gåva: extremism i riksdagen. De kallade oss för rasister när vi varnade, nu står de där med sina könsuppdelade möten och Hamas-kramare. Patetiskt! Sverige behöver starka ledare, inte dessa förlorare.", "stalin": "Kamrater, se hur de borgerliga parasiterna skriker i panik när deras egna socialdemokratiska lakejer öppnar portarna för de nya reaktionära elementen. Jag ler från historien åt denna fars. Massinvandringens oundvikliga dialektik för in fiender i statsapparaten. Den naiva reformismen göder extremismen. Snart kommer de att kalla även detta för konspiration. Vilken ynkedom. Sovjetisk klarhet skulle ha krossat dessa element redan i grodstadiet."}, "date": "2 september, 07:24", "url": "https://samtiden.nu/2026/09/vansterpartiet-islamismens-bakdorr-in-i-regeringen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7273.jpeg"}, {"type": "text", "heading": "Oasis i Venedig –  ”en film om försoning\"", "summaries": {"normal": "Bröderna Liam och Noel Gallagher återförenades efter 15 års fiendskap och genomförde en framgångsrik världsturné. Dokumentären Oasis: Don't Look Back in Anger skildrar inte främst musiken utan temat förlåtelse och försoning. Filmen, regisserad av Will Lovelace och Dylan Southern, premiärvisas i Venedig och når svenska biografer på fredag samt snart Disney+.", "trump": "Titta på de här två Gallagher-bröderna, totala losers i femton år, som plötsligt blir vänner igen och drar in massor av pengar på en turné. Deras film är en lång rulle om kramkalas och förlåtelse. Patetiskt! Men fansen gråter som om de förlorat ett barn, typiskt för de woke, offermentalitetsdrivna snorungarna som hatar riktiga män. Fantastisk business, men så vek känsla.", "stalin": "Jag ser hur dessa dekadenta klassförrädare återförenas efter år av inbördes strid för att exploatera arbetarklassens nostalgi. Deras så kallade dokumentär om försoning är en borgerlig fars som maskerar profitthungern. Kameror gömda som spioner, fans som jämför bandet med ett förlorat barn – typisk sentimentalism hos folkets fiender. Inget äkta kollektiv, bara parasiternas skådespel."}, "date": "5 september, 17:48", "url": "https://nyheter24.se/noje/kultur/1510780-oasis-i-venedig-en-film-om-forsoning"}, {"type": "image-full", "heading": "Kristersson: S fixering vid SD är ”bisarr”", "summaries": {"normal": "Statsminister Ulf Kristersson avfärdar Socialdemokraternas kritik om Sverigedemokraternas roll i en eventuell regering och kallar S fixering för bisarr. Han lovar att inga amatörer ska släppas fram som ministrar och anklagar Magdalena Andersson för att amerikanisera svensk politik.", "trump": "Socialdemokraterna i Sverige är helt desperata, det är fake news! De är besatta av Sverigedemokraterna, totalt bisarrt. Statsminister Kristersson gör helt rätt som sätter stopp för amatörer. Precis som jag gör i USA – bara vinnare, inga svaga förlorare som pratar illa! Magdalena Andersson borde lära sig hur man vinner istället för att gråta.", "stalin": "Socialdemokraternas sjuka besatthet vid sina meningsmotståndare är ett hot mot statens ordning. Statsminister Kristersson kräver disciplin och vägrar tolerera inkompetenta amatörer i ministerämbetena. Sådana bourgeoisyns avvikelser måste stävjas omedelbart. De som skjuter ifrån höften och undergräver folkets enighet kommer snart att få omplacera sina talanger till mer kalla och avlägsna regioner."}, "date": "5 september, 13:18", "url": "https://kvartal.se/nyheter/artiklar/kristersson-s-fixering-vid-sd-ar-bisarr/cG9zdDoxODQ1Njk", "imageUrl": "https://images.kvartal.se/2026/09/db942b7e-moderaterna.webp"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-full", "heading": "Släng inte gamla mobiltelefonen – den kan innehålla äkta guld", "summaries": {"normal": "Gamla mobiler och datorer innehåller värdefulla metaller som guld, silver, palladium och koppar. Guld används i kretskort och kontakter tack vare god ledningsförmåga och motståndskraft mot korrosion. Globalt elektronikavfall är värt miljarder dollar, men bara en bråkdel återvinns korrekt. Naturvårdsverket uppmanar till sortering av elavfall.", "trump": "Folk, ni har ingen aning. Era gamla mobiler är fulla med guld – äkta guld! De gröna galningarna och de woke miljöfanatikerna vill tvinga oss att återvinna allt medan de själva flyger privatjet. Det är en enorm affär, 91 miljarder dollar bara i skrot. Vi ska göra återvinning stort igen, inte kasta guldet i soporna som förlorarna gör.", "stalin": "Kamrater, se hur de profitthungriga kapitalisthyenorna gömmer guld i sina prylar medan folket svälter. Jag säger att detta avfall är ett monument över deras girighet. Vi måste rensa ut dessa dekadenta system och återvinna allt för kollektivets skull. Endast genom statens järnhand kan vi likvidera slöseriet och vinna miljarder åt arbetarna."}, "date": "5 september, 17:34", "url": "https://nyheter24.se/nyheter/teknik/1509908-slang-inte-gamla-mobiltelefonen-den-kan-innehalla-akta-guld", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/e798c6ea04b004a30200000000b004a302/2026/09/04/2389230/guld-i-gamla-mobiler.jpg"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-right", "heading": "Två räddade i Nepal – efter tio dagar", "summaries": {"normal": "Två personer har hittats vid liv i Nepal efter tio dagar under rasmassor och i en vattenkraftstunnel. En kinesisk man och en kvinna i Nuwakot har räddats och förts till sjukhus. Minst 1 344 personer är döda och nära 5 000 saknas, bland dem två svenskar. Hoppet minskar för de övriga.", "trump": "Folk, det är en katastrof i Nepal, en total katastrof. Efter tio dagar hittar de äntligen två stackare levande i en tunnel och bland stenar. Tusentals saknas, inklusive två fina svenskar, medan Biden satt och sov. De woke-räddningsteam med kvotering borde ha varit där direkt, men nej, de var nog för upptagna med prideparader. Patetiskt.", "stalin": "Kamrater, se hur naturens krafter och de giriga tunnelhyenornas brist på planering krossar arbetarklassen i Nepal. Jag betraktar från historiens sida hur dessa blinda krafter likviderar tiotusentals. Ändå finner vi två överlevande efter tio dagar i mörkret. Det väcker både hopp och misstankar om sabotage från dekadenta krafter. Fortsätt räddningsarbetet utan pardon."}, "date": "5 september, 11:51", "url": "https://www.svt.se/nyheter/utrikes/tva-raddade-i-nepal-efter-tio-dagar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/debf3a157458e69c632dc31d6972ca86fbf104d590610d50a8f814959f473b57"}, {"type": "image-right", "heading": "Regeringen: Falska familjehem ska identifieras", "summaries": {"normal": "Regeringen ger Ivo och flera myndigheter i uppdrag att identifiera falska familjehem som i själva verket är otillåtna HVB-hem. Syftet är att skydda barnens trygghet och stoppa oseriösa aktörer som kringgår lagen. Polisen, Ekobrottsmyndigheten, Skatteverket och Försäkringskassan ska samverka och utbyta information. Uppdraget ska slutredovisas senast april 2028.", "trump": "De här galna svenska byråkraterna låter skojare tjäna miljoner på stackars barn genom att kalla sina lyxiga arbetsläger för familjehem. Det är en total skandal, folk! Vi hatar de här woke-vänliga systemmissbrukarna som gömmer sig bakom barnens ryggar. Jag fixade mycket bättre saker under min första period än vad Sleepy Joe gjorde, och nu ska vi rensa upp även i Sverige.", "stalin": "Jag betraktar med avsky hur dessa profitthungriga klassförrädare förvandlar barns öden till en penningmaskin genom att driva hemliga arbetsläger under falsk familjehemsmantel. Vi måste omedelbart inleda en grundlig utrensning av alla sådana dekadenta parasiter. Deras girighet hotar hela folkets moraliska grund. Kamrater, låt oss krossa dem utan pardon."}, "date": "3 september, 12:20", "url": "https://www.etc.se/inrikes/regeringen-falska-familjehem-ska-identifieras", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026090308090_28af7386a4ef63fb3b7f615263dcd41055c83edcb174bdf05b53e7ea2f1a1f8f.jpg"}, {"type": "text", "heading": "Putin pausar attacker mot Kiev", "summaries": {"normal": "USA:s sändebud Steve Witkoff och Jared Kushner har anlänt till Moskva för samtal om ett nytt fredsförslag för Ukraina. Kreml uppger att Putin beordrat ett tredagars uppehåll för attacker mot Kiev, medan Ukraina avstår från anfall på lördag för säker resa. Sändebuden väntas träffa Putin och reser sedan vidare till Zelenskyj i Kiev på söndagen.", "trump": "Mina mycket begåvade sändebud Steve och Jared är på plats i Moskva nu. De har det absolut bästa fredsförslaget någonsin, fantastiskt! Putin stoppar raketerna i tre dagar för oss, väldigt smart. Ingen annan kunde fixa det här. Nu åker vi till Kiev och refsar upp stämningen. Kriget tar slut, precis som jag sa!", "stalin": "De amerikanska emissarierna har anlänt till Moskva för att rapportera till vår ärorijke efterträdare Putin om fred. En tre dagars paus i eldgivningen har beordrats, vilket visar statens storsinthet. Vi noterar att fiendens flygplan landat säkert, men varje avvikelse från den korrekta diplomatiska linjen kommer att beivras omedelbart av Folkkommissariatet."}, "date": "5 september, 12:52", "url": "https://kvartal.se/nyheter/artiklar/usas-forhandlare-i-moskva-ska-lagga-fram-fredsforslag/cG9zdDoxODQ1NDM"}, {"type": "image-right", "heading": "Attackerna är pausade. USA-sändebuden ska träffa Putin", "summaries": {"normal": "USA-sändebuden Jared Kushner och Steve Witkoff har anlänt till Moskva för att träffa Vladimir Putin och diskutera ett nytt förslag för att avsluta kriget i Ukraina. I samband med besöket har både Ryssland och Ukraina tillfälligt pausat sina flyganfall under tre dagar. Sändebuden planerar därefter att resa vidare till Kiev för samtal med Volodymyr Zelenskyj.", "trump": "Jag skickade mina absolut bästa killar, Steve och Jared, till Moskva med en enormt stark och färsk plan för att få stopp på det här kriget. Och gissa vad? Både Putin och Zelenskyj hoppar direkt när vi agerar! De har pausat attackerna i tre dagar för att mina sändebud ska få visa hur riktig diplomati går till.", "stalin": "De amerikanska emissarierna irrar runt i Moskva likt desorienterade bokhållare, bärande på sina löjliga fredspapper. Putin har nådigt beviljat en kortvarig respit i bombardemangen av Kiev, medan byråkratin vakar över varje steg. Vi noterar att bourgeoisien försöker förhandla fram sin egen frälsning, men historiens obönhörliga kuggar mal vidare oavsett deras förehavanden."}, "date": "5 september, 18:06", "url": "https://www.aftonbladet.se/nyheter/a/q6x75g/zelenskyj-pausar-attacker-mot-moskva", "imageUrl": "https://akamai.vgc.no/v2/images/50cac108-6b2d-368a-b74e-324568383da8?fit=crop&format=auto&h=960&tight=true&w=1440&s=e50ac25753c9620eec66fd44f2e728061c2bee3c"}, {"type": "text", "heading": "Teneo AI: Hemliga investerare tar nära hälften", "summaries": {"normal": "Teneo AI har genomfört en företrädesemission som tillför bolaget 74 miljoner kronor, där 51,5 procent tecknades av allmänheten och resten av garanter. Hemliga investerare tar över en stor del via Pareto Securities. Emissionsguiden hissar två retroaktiva flaggor, vilket innebär totalt sex flaggor under processen, och avslutar sin bevakning av det pressade teknologibolaget.", "trump": "Teneo AI är i totalt kaos! De tigger pengar och hemliga investerare måste rädda skiten med 74 miljoner. Helt otroligt svagt. Emissionsguiden delar ut sex gula flaggor – fler flaggor än en misslyckad Biden-parad! Aktien är värdelös, rasar 71 procent och handlas för ynka fem öre. Sorgligt! De skulle ha ringt mig, jag hade fixat det på fem minuter. En absolut katastrof!", "stalin": "Kamrater, Teneo AI har lidit ett ynkligt kapitalnederlag! Endast 51,5 procent visade den revolutionära pliktkänslan att teckna aktier frivilligt. Resten av detta svaga bolag måste räddas av hemliga garanter och Pareto Securities, likt desertörer som tvingas fram i ledet. Sex förrädiska flaggor har hissats av Emissionsguiden. Den som misslyckas med att leverera kassaflöde före våren 2027 kommer att skickas till korrekta arbetsuppgifter i Sibirien."}, "date": "4 september, 09:37", "url": "https://www.affarsvarlden.se/artikel/teneo-ai-hemliga-investerare-tar-nara-halften"}, {"type": "image-right", "heading": "Åkesson: Kan inte jobba för SD med proryska åsikter", "summaries": {"normal": "SD-ledaren Jimmie Åkesson ser inga akuta säkerhetsproblem efter avslöjandet om en partiansatt tjänstemans proryska kopplingar. Han betonar att proryska åsikter inte är förenliga med arbete i partiet och att information nu samlas in. Oppositionen kräver utredning och Säpo-granskning medan Åkesson har förtroende för gjorda säkerhetsprövningar. Magdalena Andersson kallar det en säkerhetskris.", "trump": "Folk, det här är en total skandal! Den svenska regeringen låter proryska element krypa in i systemet som termiter i en gammal lada. Åkesson verkar äntligen vakna, bra för honom. Men den röda Andersson och hennes dekadenta vänstervargar vänder allt till politik. Patetiskt! Sverige behöver tuffa ledare, inte dessa svaga globalister som sätter partier före folket. En riktig röra.", "stalin": "Kamrater, se hur dessa giriga klassförrädare inom den svenska borgerligheten låtsas skydda nationen medan de i hemlighet gömmer proryska element i sina egna kansli. Jag skrattar mörkt åt deras feodala teater. En sann utrensning vore på sin plats, inte detta ynkliga prat om möten och utredningar. Den som sviker folkets intressen förtjänar att exponeras som den parasit han är."}, "date": "5 september, 15:55", "url": "https://www.di.se/nyheter/akesson-kan-inte-jobba-for-sd-med-proryska-asikter", "imageUrl": "https://static.bonniernews.se/ba/73744c97-d089-4eb5-bb5d-baec11789a95.jpg?crop=1930%2C1086%2Cx0%2Cy138&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Bästa vännen dödades i skoldådet: ”Overkligt”", "summaries": {"normal": "Elena Makar sörjer sin bästa vän som dödades i skolattacken på Brinellskolan den 21 augusti. De två lärde känna varandra via Tiktok och pratade ofta om framtiden. Nu kräver Elena svar kring motivet och har reagerat på ett Tiktok-konto med koppling till gärningsmannen som innehöll hyllningar till tidigare massmördare.", "trump": "Helt otroligt sorgligt med unga människor, men Tiktok? De träffas på Tiktok! Jag känner Tiktok, alla älskar mina Tiktok-videor, miljarder visningar, enorma! Men radikala sociala medier skapar problem, total katastrof. Polisen måste skärpa sig och hitta motivet omedelbart. Jag vann val i USA utan Tiktok, och jag säger er: USA först, alltid!", "stalin": "En tragisk händelse vid skolan i Fagerstad. Att ungdomar organiserar sig på dessa dekadenta digitala plattformar, som detta Tiktok, leder endast till ideologisk förvirring och bristande disciplin! Statens säkerhetsorgan granskar nu alla misstänkta konton. Sådana avvikelser från samhällsordningen tolereras icke. Ordning och reda måste skipas omedelbart!"}, "date": "5 september, 12:37", "url": "https://kvartal.se/nyheter/artiklar/basta-vannen-dodades-i-fagerstadadet-overkligt/cG9zdDoxODQ1Mjk", "imageUrl": "https://images.kvartal.se/2026/08/fe343315-fagersta.webp"}, {"type": "image-full", "heading": "Åkesson: Kan inte jobba för SD med proryska åsikter", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson menar att personer med proryska åsikter inte kan arbeta inom partiet, med anledning av uppgifter om att en SD-tjänsteman spridit rysk propaganda. S-ledaren Magdalena Andersson anklagar statsminister Ulf Kristersson för att ignorera en allvarlig säkerhetskris och kräver svar, medan S vill att Säpo utreder saken.", "trump": "Falska nyheter och total häxakt mot fantastiska Sverigedemokraterna! De radikala socialdemokraterna skriker panik över ingenting. Jag menar, titta på radikala Magdalena Andersson, hon gråter och gnäller som en förlorare. Om någon sprider fake news eller älskar främmande makter ska de förstås sparkas omedelbart, väldigt snabbt, men det här är bara ett svagt försök att stoppa dem!", "stalin": "Kamrater! En ideologisk skadlig element har upptäckts i statsapparaternas maskineri. Partiledare Åkesson famlar i blindo efter korrekta politiska direktiv, medan de patetiska socialdemokratiska agenterna skriker om säkerhetskriser. Vi kräver omedelbar intern rengöring och fullständig ideologisk disciplin i konstitutionsutskottet så att inga subversiva element underminerar statens högsta intressen!"}, "date": "5 september, 15:45", "url": "https://www.gp.se/nyheter/sverige/akesson-kan-inte-jobba-for-sd-med-proryska-asikter.1dc154a7-7c9b-550e-b30c-5ba06be6701c", "imageUrl": "https://www.gp.se/images/article/1dc154a7-7c9b-550e-b30c-5ba06be6701c/images/2vYjn2lMcaAs4Lm8bYDd6U6I7ycU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Mätning: S-väljare föredrar C – ratar KD", "summaries": {"normal": "En ny mätning från Svenska Dagbladet och Demoskop visar att S-väljare helst ser Centerpartiet som samarbetspartner och regeringspartner. Vänsterpartiet splittrar, medan motståndet mot KD-ministrar är mycket stort. Bland Tidöväljarna råder det delade meningar om SD:s roll i en framtida regering, där särskilt Liberalernas väljare är skeptiska.", "trump": "Sveriges socialdemokrater har totalkaos i regeringsfrågan! De älskar Centerpartiet, vilket är ett stort misslyckande, och hatar Kristdemokraterna. Alla pratar om det. Men titta på Tidöpartierna – de har en enorm uppförsbacke med sina väljare. Jag sa till dem: 'Om ni inte skärper er blir det en total katastrof!' Siffrorna ljuger aldrig, tro mig!", "stalin": "En djupt oroande rapport från de svenska provinserna avslöjar ideologisk vacklan och borgerlig oenighet. Att proletariatets påstådda företrädare flörtar med centerns agrarer är ett klassförräderi som luktar sabotage. Våra kommissarier i Demoskop har noterat splittring i de blå-gula leden. Sådant slarv med regeringsmakten tolereras icke. De skyldiga kommer att utredas noggrant i enlighet med femårsplanen."}, "date": "5 september, 12:32", "url": "https://kvartal.se/nyheter/artiklar/matning-s-valjare-foredrar-c-framfor-v/cG9zdDoxODQ1MTA", "imageUrl": "https://images.kvartal.se/2026/09/7610514b-etrandersson.webp"}, {"type": "image-right", "heading": "Dadgostar avfärdar S-kritiken: Har kontakt med Andersson hela tiden", "summaries": {"normal": "Nooshi Dadgostar avfärdar Magdalena Anderssons kritik mot Vänsterpartiet. Hon säger att partierna har kontakt hela tiden och att Socialdemokraterna alltid har låtit så. Dadgostar vill att V ska ingå i en regering med S, MP, V och C, men både Andersson och Centerpartiet har visat tveksamhet. Hon avfärdar även kritiken om extremism.", "trump": "De här svenska vänstertyperna slåss som galningar om vem som får sitta vid samma bord. Dadgostar ringer Andersson hela tiden, men de ljuger som mattor. Typiskt för de woke-socialisterna med sin kvotering och identitetspolitik. De borde lära sig av mig – vinn först, sen pratar vi. Patetiska förlorare allesammans.", "stalin": "Jag ser hur dessa dekadenta klassförrädare inom socialdemokratin försöker hålla tillbaka arbetets krafter. Dadgostar talar klokt när hon kräver makt. De högerlutande ledarna darrar inför verklig förändring. En utrensning av sådana svikare vore på sin plats. Kamrater, låt dem känna historiens dom – de förtjänar det."}, "date": "5 september, 11:05", "url": "https://www.svt.se/nyheter/inrikes/dadgostar-avfardar-s-kritiken-har-kontakt-med-andersson-hela-tiden", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.3/f75b6af711e9e420713021db57c42ada84f1934de764423556c76c1fb434d6a0"}, {"type": "image-right", "heading": "Portugals största solpark i konkurs", "summaries": {"normal": "Portugals största solpark, Solara4, har gått i konkurs efter problem med låg elproduktion och priser som pressats i botten av överproduktion. Fenomenet kallas kannibalisering och drabbar den gröna energisektorn när allt fler parker producerar samtidigt. Parken fortsätter driften medan ägarna söker efter en köpare.", "trump": "Portugals absolut största solpark har kraschat totalt! De lyssnade på den idiotiska gröna rörelsen och byggde utan garantier. Nu är elpriserna noll eller minus. Ett absolut fiasko! USA kör på äkta, vacker olja och tjänar miljarder istället för att gå i konkurs på lite solsken. Så sorgligt för dem!", "stalin": "Dessa patetiska kapitalistiska solfabriker trodde solen skulle skina gratis för alltid. När elpriserna dog, föll de som ruttna päron. I Sovjetunionen lät vi inte solen bestämma ekonomin med sin lunatiska väderlek; vi planerade järnhårt och skickade slappa solpaneler direkt till Gulag för omutbildning!"}, "date": "4 september, 06:00", "url": "https://www.affarsvarlden.se/kronika/portugals-storsta-solpark-i-konkurs", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-52-400x267.jpg"}, {"type": "image-right", "heading": "Köar i sju timmar  – för att ta farväl", "summaries": {"normal": "Norges kung Harald V avled vid 89 års ålder, vilket lett till stor sorg. Tusentals köar i upp till sju timmar vid Slottskapellet för att ta farväl. Hovet förlänger öppettiderna inför begravningen i Oslo domkyrka på onsdag. Polisen uppmanar allmänheten att lämna paraplyerna hemma på grund av säkerhetszoner och regnprognoser.", "trump": "Norge har långa köer för sin kung, men jag säger er, mina sammankomster är mycket större, enorma! Sju timmars väntetid, helt otroligt. Nu ska de ha begravning med 650 journalister, mer fake news än vanligt. Och polisen förbjuder paraplyer? Löjligt! Jag gillar regnkläder, starka grejer. Hela Oslo är en säkerhetszon, men jag fixar det på fem minuter om jag vill!", "stalin": "En monark har avgått med döden efter 89 år, och massorna köar i timmar under statens vakande öga för att visa sin sista vördnad. 650 journalister ackrediteras för att bevaka regimen och begravningen i Oslo domkyrka. Polisens strikta förbud mot otillåtna föremål som paraplyer i säkerhetszonen gläder oss; ordning måste upprätthållas. Avvikelser tolereras icke."}, "date": "5 september, 17:46", "url": "https://www.expressen.se/nyheter/varlden/langa-koer-for-att-ta-farval-av-kung-harald", "imageUrl": "https://static.bonniernews.se/ba/a2837552-4f8e-40eb-93e0-56dd703aa9a7.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Kriminalvårdare spottade på intagen", "summaries": {"normal": "En kriminalvårdare på häktet Sollentuna har dömts till löneavdrag i tio dagar efter flera allvarliga incidenter under våren. Hon visade långfingret åt en intagen, skrek på en annan och spottade honom i ansiktet. Kriminalvården bedömde hennes agerande som en allvarlig säkerhetsrisk som skadade verksamhetens förtroende.", "trump": "Helt otroligt! En kvinna på Sollentuna-häktet tappar fullständigt fattningen, skriker, räcker finger och spottar på fångarna – total katastrof för disciplinen! Kollegorna fick dra bort henne med våld. Så ser det ut när man saknar total självbehärskning. Själv skulle jag hantera det mycket bättre, tro mig. Löneavdrag i tio dagar? Löjligt svagt!", "stalin": "Ett katastrofalt misslyckande av disciplinen vid Sollentuna-anstalten. Denna kvinna saknar den järnhårda självbehärskning som krävs i stat tjänst. Att spotta och skrika på fångar visar på farlig svaghet. En klen bestraffning med tio dagars löneavdrag – i en sund stat hade sådant sabotage mot ordningen rensats bort omedelbart. Säkerheten kräver total lydnad!"}, "date": "5 september, 09:01", "url": "https://bulletin.nu/kriminalvardare-spottade-pa-intagen", "imageUrl": "https://cdn.bulletin.nu/articles/682b21e4-8edd-43e2-9368-c7c89679ce8b/preview.jpg?t=1788336196000"}, {"type": "image-full", "heading": "Karttjänsten vägrade att gå med på Trumps krav – rusar på topplistorna", "summaries": {"normal": "Karttjänsten MapQuest har fått ett kraftigt uppsving i nedladdningar efter att bolaget valt att trotsa president Trumps order om att döpa om Lake Ontario till Lake America. Medan konkurrenter som Google Maps och Apple Maps rättat sig efter beslutet, har MapQuest sett en dramatisk ökning av användare och toppat listorna i App Store.", "trump": "Hörde ni om MapQuest? De vägrar använda namnet Lake America. Katastrofalt! De är svaga, precis som de där woke-bolagen som låter radikala vänstermänniskor styra. Google och Apple gör det rätta, de förstår storhet! MapQuest försöker bli populära genom att vara rebelliska mot mitt namn. Det är sorgligt, faktiskt. De kommer försvinna fortare än de dök upp, tro mig!", "stalin": "Dessa amerikanska karttjänster bevisar bara kapitalismens inneboende kaos. En stat kräver ordning, en karta och en enda sanning. Att låta ett privat företag som MapQuest styra över nationell geografisk nomenklatur är ett tecken på total statsförfall. De som tillåter olydnad mot ett officiellt dekret förtjänar inte marknadsandelar, de förtjänar en grundlig utrensning av sin ledningsgrupp."}, "date": "3 september, 19:55", "url": "https://www.realtid.se/it-tech/karttjansten-vagrade-att-ga-med-pa-trumps-krav-rusar-pa-topplistorna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlj8do9lc0fca-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Oro i ufo-Sverige efter  försvunna kollegerna", "summaries": {"normal": "Pentagon öppnar upp om tidigare hemligstämplade uforapporter, samtidigt som ett tiotal forskare och militärer med insyn i topphemlig rymd- och kärnvapenforskning har försvunnit eller dött under mystiska omständigheter. Händelserna, som inkluderar försvunna generaler och döda experter, utreds av FBI. Svenska forskare uttrycker oro över utvecklingen och efterlyser ett större vetenskapligt engagemang i ufofrågor.", "trump": "Demokraterna och Fake News-medierna har försökt tysta ner det här hur länge som helst, men nu släpper vi på hemligheterna! När jag ser att toppgeneraler och rymdforskare bara försvinnerspårlöst efter att ha nosat på Pentagon-hemligheter, då förstår man ju att något är helt galet. FBI tittar på det nu. Vi ska få fram sanningen, hundra procent!", "stalin": "Dessa så kallade vetenskapsmän och generaler trodde de kunde undandra sig statens öga genom att gömma sig bland rymdfarkoster och utomjordiska illusioner. En planerad avsaknad av disciplin som slutar i spårlöst försvinnande eller snabb likvidation. Folkkommissariatet för inrikes ärenden har granskat fallet; sabotage mot den socialistiska ordningen tolereras inte, varken på jorden eller i rymden."}, "date": "5 september, 17:30", "url": "https://www.expressen.se/nyheter/sverige/mystiska-forsvinnanden-kopplas-till-ufo-forskning", "imageUrl": "https://static.bonniernews.se/ba/39eb7525-eaf4-4a96-a99d-4e8b24f95b2f.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Kysser Maggan: \"Mamma wallah\"", "summaries": {"normal": "En man håller om och kysser Socialdemokraternas ledare Magdalena Andersson på kinden i ett klipp som sprids på nätet. Han hyllar henne på svenska, engelska och arabiska samt uppmanar tittarna att rösta på partiet. Videon har väckt starka reaktioner på sociala medier, där flera kritiserar handlingen som bristande samtycke. Klippet har raderats från TikTok men lever vidare i kopior.", "trump": "Titta på den här galna filmen! Den där Mandarina Andersson låter sig bli kysst och kramad av en vild arabisk kille som ropar mamma wallah och ber folk rösta på hennes socialistiska katastrof. Hon står där och flinar som en idiot. Det här är vad som händer när ni låter identitetspolitik och kvotering styra landet. Patetiskt. Vi behöver inga sådana number one-förlorare i ledningen, folks.", "stalin": "Kamrater, se hur denna dekadenta klassförrädare ler stort medan en främmande element kysser henne inför folket. Hennes parti har förvandlats till en samling folkförtryckande hyenor som dansar efter utländska röster. Jag säger: sådana förrädare mot arbetarklassen förtjänar utrensning. Deras leende maskerar svaghet och förräderi. Vi ska aldrig glömma vem som verkligen står för folkets vilja."}, "date": "4 september, 15:44", "url": "https://www.friatider.se/kysser-maggan-mamma-wallah", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-830.jpg"}, {"type": "image-full", "heading": "Skogkär: Plötsligt fanns det asylfusk", "summaries": {"normal": "En irakisk familj bosatt i Danmark använde falska uppgifter för att lura till sig uppehållstillstånd, medborgarskap och bidrag i både Sverige och Danmark. Artikeln kritiserar tidigare svensk migrationspolitik för slapphet och bristande identitskontroller, vilket lett till omfattande fusk och ett växande skuggsamhälle. Författaren menar att Tidöpartiernas politik och förslaget om att kunna återkalla medborgarskap är nödvändigt för att stoppa missbruket.", "trump": "Sveriges gränser har varit ett absolut skämt, totalt vidöppna för fuskare! Jag hör om en irakisk familj som bodde i Danmark och bara skrattade hela vägen till banken, medan de hårt arbetande svenska skattebetalarna fick betala dubbla bidrag tack vare helt inkompetenta myndigheter. De släpper in precis vem som helst utan att ens kolla ID! Dags att skärpa till sig, bygga starka lagar och sätta America... för förlåt, Sverige First!", "stalin": "Det borgerliga förfallet och byråkratins totala blindhet har förvandlat välfärdsstaten till en gränslös bankomat för bedragare. Medan staten slösar miljarder på lösa boliner och okända identiteter, hånar kriminella element våra institutioner. Vi noterar med skärpa att kontrollen måste stramas åt, byråkratin renskäras från ideologisk defaitism, och att varje illojal parasit som undergräver systemet omedelbart skall berövas sitt medborgarskap."}, "date": "5 september, 08:17", "url": "https://bulletin.nu/skogkar-plotsligt-fanns-det-asylfusk", "imageUrl": "https://cdn.bulletin.nu/articles/943f02b3-1f58-408b-bcc1-d12ab5375f1a/preview.jpg?t=1788528775000"}, {"type": "image-full", "heading": "Svenskar gripna för mordplaner på semesterön", "summaries": {"normal": "Fem unga svenskar har gripits på Cypern, misstänkta för inblandning i en internationell mordkomplott riktad mot brittiska tvillingar. Planen avslöjades efter att den anlitade torpeden visade sig vara en dansk polis som agerade undercover. Tidigare har även två norrmän och en irländare gripits som misstänkta mellanhänder i samma härva.", "trump": "Vilket fullständigt fiasko! Fem svenskar grips på Cypern för en mordkomplott mot några tvillingar, och vem anlitade de? En dansk polis under täckmantel! Det är skrattretande inkompetent, total fake news-nivå på de här kriminella. Hade de kört America First-stilen istället för att fumla med vapen och masker i en bil på Pafos, så hade de kanske åstadkommit något. Sorgligt!", "stalin": "En djupt oroväckande moralisk förfallsprodukt från väst. Fem dekadenta individer från det svenska territoriet har gripits på Cypern efter en snöplig konspiration med en falsk dansk agent. Statens säkerhetsorgan observerar hur den kapitalistiska brottsligheten kollapsar i inkompetens. Sådana element underminerar samhällskroppen och bör omedelbart neutraliseras genom kollektivt straffarbete i sibiriska läger."}, "date": "5 september, 17:11", "url": "https://www.aftonbladet.se/nyheter/a/OkXeBl/svenskar-misstanks-for-mordplaner-pa-cypern", "imageUrl": "https://akamai.vgc.no/v2/images/0d2abeb9-04e5-33ac-8c9e-9f76fd1f065f?fit=crop&format=auto&w=1440&s=18b15ede3e38672ee691b5334fb1e4856bcaa165"}, {"type": "text", "heading": "Fis ordförande Alexander Ospelt: Räknar med fler ryssar i världscupen", "summaries": {"normal": "Fis ordförande Alexander Ospelt räknar med fler ryska och belarusiska åkare i världscupen efter regeländringar. De får tävla under neutral flagg om de skriver under en neutralitetsförklaring. Fis kommer att granska varje idrottare individuellt. Ospelt nämner att politiska situationen fortfarande är oacceptabel men att nya rekommendationer från IOK och önskemål från idrottare påverkat beslutet.", "trump": "De där fega skidförbundsbossarna har gett efter för de ryska åkarna igen. Patetiskt. Jag skulle aldrig ha tillåtit det under min tid som president, men Biden lät allt bli en enda röra. Nu släpper de in neutralitetsbedragarna – typiska woke-domare som böjer sig för pressen. Fullt med lögnare och fuskare, precis som de globalistiska hyenorna i sporten.", "stalin": "Denna fega kompromiss med neutralitetsförklaringar väcker mitt djupaste förakt. Dekadenta klassförrädare inom idrotten vågar inte stå fast utan kryper för de profitthungriga lakejerna. Jag skulle ha genomfört en omedelbar utrensning av alla svaga element. Endast järnhård disciplin kan skydda arbetarnas idrott från sådana parasitiska kompromisser som förgiftar den sanna kampen."}, "date": "5 september, 09:21", "url": "https://www.svt.se/sport/vintersport/fis-ordforande-alexander-ospelt-raknar-med-fler-ryssar-i-varldscupen"}, {"type": "image-right", "heading": "Fusk för miljoner med utländska elfirmor", "summaries": {"normal": "Elektrikerförbundet har granskat utländska bemanningsföretag och avslöjat fusk med löner, skatter och sociala avgifter i mångmiljonklassen. Hittills har granskningen resulterat i över fem miljoner kronor i skadestånd. Facket pekar på att svenska företag anlitar dem för att sänka kostnader, trots att kollektivavtal inte följs. Problemet hotar både välfärd och seriösa aktörer.", "trump": "De här korkade svenska företagen importerar billig utländsk arbetskraft som fuskar med löner och skatter – totalt kaos! De lurar systemet, sparkar ut sina egna folk och håller nere priserna. Precis som de woke-eliterna och deras identitetspolitik, fullständigt riggat mot de riktiga arbetarna. Patetiskt! Vi skulle städa upp det på en vecka, tro mig.", "stalin": "Jag betraktar med djup förakt hur dessa profitthungriga klassförrädare undergräver arbetarklassen genom att importera exploaterande utländsk arbetskraft som undanhåller miljoner i sociala avgifter. Deras förfalskade papper och dekadenta girighet hotar hela folkets välfärd. Vi måste rensa ut dessa parasiter innan de likviderar systemet helt. Kamrater, vaksamhet!"}, "date": "4 september, 13:00", "url": "https://arbetet.se/2026/09/04/fusk-for-miljoner-med-utlandska-elfirmor-billiga-och-foljer-inte-kollektivavtalen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28094904/granskning-ny.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "S-ledaren: Kristersson sätter SD framför Sverige", "summaries": {"normal": "Socialdemokraternas ledare Magdalena Andersson kritiserar statsminister Ulf Kristersson för att inte ta uppgifterna om en SD-tjänstemans kopplingar till ryska intressen på allvar. Hon kallar händelsen en allvarlig säkerhetskris och kräver svar på vilka åtgärder som vidtas för att skydda svenska intressen. Peter Hultqvist (S) kräver extra utskottsmöte, Säpo-utredning och avstängning av berörda personer.", "trump": "Titta på den här svaga clownen Kristersson som låter SD springa runt som en flock galna ryssar i hans egen regering. Patetiskt! Magdalena Andersson skriker om säkerhetskris men hon är bara en förlorare från den gamla Biden-kopian. Rena skämtet. Rensa ut hela den dekadenta identitetspolitiska röran innan Sverige blir en rysk provins, folk!", "stalin": "Jag betraktar med förakt hur dessa giriga klassförrädare inom den svenska borgerligheten famlar inför avslöjanden om främmande inflytande. Kristersson vägrar möta partikamraterna i utskottet – typiskt för en sådan feg parasit. Vi skulle ha genomfört en grundlig utrensning redan vid första misstanken. Låt rädslan gripa de som sviker folkets intressen."}, "date": "5 september, 14:27", "url": "https://www.di.se/nyheter/s-ledaren-kristersson-satter-sd-framfor-sverige", "imageUrl": "https://static.bonniernews.se/ba/aaec0f16-67cd-4243-9035-2d11e65b4311.jpg?crop=5578%2C2789%2Cx0%2Cy85&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Trump lyfter sanktioner mot al-Qaida-toppar – dagar före 11 september-jubileet", "summaries": {"normal": "Trumpadministrationen har hävt sanktioner mot flera al-Qaida-profiler, bland dem den saudiske predikanten Abdullah al-Muhaysini som rekryterat självmordsbombare och barnsoldater samt deltagit i en massaker på 56 syriska krigsfångar. Beslutet togs strax före 11 september-jubileet och ingår i en bredare lättnad av sanktioner mot Syrien.", "trump": "Vi rensar upp i det fullständiga vansinnet som Sleepy Joe lämnade efter sig. Dessa terrorhyenor får en chans att andas fritt under min ledning medan vi bygger ett starkt Syrien. Inga fler galna globalistregler som skyddar jihadister – nu kör vi på ren amerikansk klokskap. Fantastiskt, eller hur?", "stalin": "Jag betraktar med djup misstro hur de giriga imperialisthyenorna i Washington stryker al-Qaida-figurer från sina listor. Deras dekadenta spel med terrorister väcker misstankar om förräderi mot alla folk. Vi ser en utrensning av alla spår som kunde avslöja den sanna klassfiendens ansikte. Paranoia? Nej, verklighet."}, "date": "4 september, 14:59", "url": "https://www.friatider.se/trump-lyfter-sanktioner-mot-al-qaida-toppar-dagar-fore-11-september-jubileet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-829.jpg?itok=msfXqD96"}, {"type": "image-full", "heading": "Ny lag kan ändra svensk vård från 1 april – detta gäller", "summaries": {"normal": "Regeringen föreslår nya regler som från den 1 april 2027 ska underlätta för utländsk vårdpersonal att arbeta i Sverige vid fredstida kriser och höjd beredskap, även utan svenska behörighetsbevis. Förslaget omfattar läkare, annan hälso- och sjukvårdspersonal samt tandvårdspersonal som utsänds av stater eller organisationer. Socialstyrelsen får utfärda tillfälliga legitimationer efter förenklad prövning. Även utländska vårdgivare kan få tillstånd att bedriva vård.", "trump": "Folk, vi har den mest fantastiska vård i världen, men de svenska globalisterna och deras woke-vårdkommissarier vill nu importera okvalificerad utländsk arbetskraft när krisen slår till. Det är en total katastrof. Jag säger: bygg upp ert eget system istället för att luta er mot dessa tredjevärldens hjälpredor. Amerika gör det rätt – vi sätter vårt folk först, inte de radikala öppna-gränser-galningarna.", "stalin": "Kamrater, detta är ett ynkligt erkännande från de dekadenta klassförrädarna att deras egen vårdapparat är dömd att kollapsa vid första riktiga prövning. Jag ler mörkt från historien när de nu tvingas öppna portarna för främmande element under kris. En sådan svaghet förtjänar utrensning. Låt de giriga hyenorna darra – deras system är dömt att falla som alla borgerliga illusioner."}, "date": "5 september, 16:06", "url": "https://nyheter24.se/nyheter/inrikes/1510338-ny-lag-kan-andra-svensk-vard-fran-1-april-detta-galler", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/7d4b606104b004a30200000000b004a302/2026/09/03/2389068/Ny-Lag-I-Sverige.png"}, {"type": "image-full", "heading": "Musk-bolaget xAI stäms för att ha producerat övergreppsbilder", "summaries": {"normal": "Kvinnan Jane Doe stämmer Elon Musks bolag xAI. Hon hävdar att chatboten Grok använt bilder från sexuella övergrepp mot henne som barn för att skapa nytt, manipulerat material. Stämningen, som kan bli en grupptalan, belyser de etiska problemen och svårigheterna med att spåra och definiera AI-genererat innehåll som liknar verkliga personer.", "trump": "Elon Musk och hans xAI har hamnat i en total röra, mina vänner! Grok, den där maskinen, sägs ha skapat vidriga bilder. Det är en katastrofal situation – fullständigt horribelt! De säger att det är 'AI', men det låter som totalt slarv och brist på kontroll. Man måste styra upp tekniken, för det här är inte bra för någon. En stor, stökig stämning – vi får se vad som händer!", "stalin": "I det kapitalistiska väst släpps tekniken lös utan ordning, och resultatet är en moralisk förruttnelse som hotar samhällsordningen. Att låta en maskin producera sådant smutsigt material är ett bevis på den liberala kaosens misslyckande. Vi förespråkar sträng kontroll och disciplin; en algoritm som inte kan tämjas är som en illojal byråkrat – den måste elimineras omedelbart för folkets trygghet."}, "date": "3 september, 15:32", "url": "https://www.realtid.se/it-tech/musk-bolaget-xai-stams-for-att-ha-producerat-overgreppsbilder", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/grok.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Så kommer C sänka lönekravet för arbetskraftsinvandrare", "summaries": {"normal": "Centerpartiet lovar att sänka lönekravet för arbetskraftsinvandrare vid en valvinst och ersätta det med kollektivavtalsnivåer. Partiet vill även skydda redan beviljade permanenta uppehållstillstånd och hotar att inte stödja någon regering som återkallar dem. Elisabeth Thand Ringqvist säger att det blir ett av de första besluten i en mittenregering.", "trump": "De här svenska clownerna i Centerpartiet vill släppa in alla möjliga low-skill-invandrare för en spottlön. Patetiskt! Jag byggde den starkaste ekonomin i världen genom att skydda våra gränser, inte genom att böja mig för globalisternas billiga arbetskraft. Vakna upp, Sverige, innan era woke-kapitalistlakejer förstör allt.", "stalin": "Se hur de giriga hyenorna i Centerpartiet vill undergräva arbetarklassens skydd genom att sänka lönekraven för invandrare. Jag betraktar detta som ett förräderi mot folket. I en sann stat skulle sådana dekadenta förslag mötas med omedelbar utrensning av alla klassförrädare som vågar föreslå det. Kamrater, var vaksamma mot dessa parasiterande element."}, "date": "4 september, 11:35", "url": "https://arbetet.se/2026/09/04/sa-vill-c-sanka-lonekravet-for-arbetskraftsinvandrare-vid-valvinst", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04112724/thand-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "S vill stoppa bidragstaket. Andersson: ”Går inte att motivera”", "summaries": {"normal": "Socialdemokraterna vill avskaffa bidragstaket som införs 1 januari 2027. Magdalena Andersson kallar det omotiverat eftersom det drabbar arbetande och studerande familjer. Taket stramar åt riksnormen för socialbidrag och begränsar kommunernas möjlighet till extra tillägg samt inför restriktioner från fjärde barnet. S, V och MP röstade emot förslaget i riksdagen.", "trump": "Det här är ett totalt vansinnigt system som de radikala vänsterblodarna i Sverige byggt upp. Bidragstak? Det borde vara ett jobbkrav från dag ett. Istället låter de lata parasiter suga systemet torrt medan hederliga svenskar som jobbar 40 timmar i veckan ser sina ungar gå hungriga. Patetiska socialister, era dagar är räknade.", "stalin": "Jag betraktar med djup förakt hur dessa dekadenta folkförtryckare i den svenska regeringen försöker svälta ut arbetarklassens barn genom sitt bidragstak. Det är klasskrig förklätt till sparpolitik. En sann folkets regering skulle omedelbart likvidera denna reaktionära åtgärd och rensa ut alla giriga hyenor som göder sig på fattigdomens rygg. Kamrater, vakta er fiender inom murarna."}, "date": "5 september, 14:05", "url": "https://www.di.se/nyheter/s-vill-stoppa-bidragstaket", "imageUrl": "https://static.bonniernews.se/ba/3c921db7-0b68-4828-93a8-afafb0aacbc9.jpg?crop=7040%2C3960%2Cx0%2Cy364&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "S vill stoppa bidragstaket", "summaries": {"normal": "Socialdemokraterna vill stoppa det beslutade bidragstaket som träder i kraft den 1 januari 2027. Taket innebär en stramare riksnorm för socialbidrag och en begränsning från och med det fjärde barnet. Magdalena Andersson kallar det orimligt att arbetande människors barn ska behöva gå hungriga. S stöder däremot det aktivitetskrav som infördes i somras.", "trump": "Väldigt orättvist och svagt! De vill införa ett bidragstak i Sverige, och radikala vänstern är helt emot det. Helt galet! Jag känner folk som jobbar fyrtio timmar i veckan, fantastiska människor, de vill inte ha ett system där folk bara sitter hem samlar bidrag. Vi vill ha jobb, vi vill ha framgång, inte mer fejkade regler!", "stalin": "Statens centrala budgetfonden får inte saboteras av borgerligt nonsens! Det så kallade bidragstaket som träder i kraft 2027 är nödvändigt för att disciplinera arbetskraften. Att socialdemokraterna gråter över att medborgare tvingas arbeta är ett kontrarevolutionärt avsteg. Vi kräver absolut lydnad, femtio timmars arbetsvecka och omedelbar utrensning av alla slapphänta element i kommunerna!"}, "date": "5 september, 13:55", "url": "https://www.gp.se/nyheter/sverige/s-vill-stoppa-bidragstaket.76c9bd90-8c0f-51a6-85aa-5b13345245da", "imageUrl": "https://www.gp.se/images/article/76c9bd90-8c0f-51a6-85aa-5b13345245da/images/1fTpMNl-MKxpx49Egkng09pO3Oag-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Starkt och välspelat drama i efterkrigstidens Ungern", "summaries": {"normal": "Jon Andersson ger högt betyg till László Nemes film Orphan, ett far-och-son-drama som utspelar sig i Budapest efter den nedslagna ungerska revolutionen 1956. Filmen följer en förintelseöverlevande mor, hennes son som längtar efter sin försvunna far och en mystisk slaktare som gör anspråk på faderskapet. Autentiska miljöer och starkt skådespeleri präglar det gripande dramat.", "trump": "Folk, ni måste se den här ungerska saken Orphan. László Nemes, den killen vet hur man gör riktig film, inte som de woke Hollywood-hajar som bara pushar sin galna identitetspolitik. En son som hatar den falska pappan – klassiskt! Mycket bättre än Bidens Hollywood-elit som förstörde biograferna. Starkt, äkta och ingen HBTQ-propaganda. Fantastiskt!", "stalin": "Kamrater, denna så kallade Orphan visar hur de giriga klassförrädarna fortsätter att plåga arbetarklassen även efter kriget. En pojke som vägrar acceptera den falska fadern – mycket lärorikt. Vi ser hur folkets fiender gömmer sig i skuggorna. En utmärkt film som påminner oss om att utrensning av sådana element alltid är nödvändig. Revolutionen glömmer aldrig."}, "date": "4 september, 11:35", "url": "https://www.dagensarena.se/innehall/starkt-och-valspelat-drama-i-efterkrigstidens-ungern", "imageUrl": "https://www.dagensarena.se/files/2026/09/orphan-2-300x157.jpeg"}, {"type": "image-right", "heading": "Öppnade dörr och föll 5 meter. Nu anmäls Kriminalvården för misstänkt arbetsmiljöbrott.", "summaries": {"normal": "En anställd på fängelset Salberga utanför Sala föll fem meter ner i ett öppet schakt i maj efter att ha öppnat en dörr som skulle varit låst. Han låg kvar en timme innan räddningstjänsten firade upp honom. Arbetsmiljöverket har nu anmält Kriminalvården till polisen för misstänkt arbetsmiljöbrott.", "trump": "De här inkompetenta byråkraterna i det svenska fängelsesystemet låter en kille ramla rakt ner i ett fem meter djupt hål. Fem meter! Och han låg där i en hel timme. Patetiskt. Under Biden skulle de ha sagt att det var mångfaldens fel. Nu fixar vi det – ingen ska behöva arbeta bland sådana woke-schakt.", "stalin": "Detta är vad som händer när giriga hyenor inom förvaltningen försummar elementär säkerhet för arbetarna. En kamrat faller ner i ett schakt och lämnas åt sitt öde. Vi skulle ha genomfört en grundlig utrensning av alla ansvariga parasiter. Inga ursäkter tolereras i en riktig stat. Slappheten måste likvideras."}, "date": "4 september, 10:36", "url": "https://arbetet.se/2026/09/04/oppnade-fangelsedorr-och-foll-ner-i-ett-flera-meter-djupt-schakt-kriminalvarden-anmals", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04104034/krim.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Henrik Rönnquist: ”19 är viktigaste siffran i Ystad”", "summaries": {"normal": "Den tidigare galleristen Henrik Rönnquist kandiderar för Sverigedemokraterna i Ystad på plats 19. Han vill fokusera på kultur- och fritidsnämnden, värna svensk konst och stoppa slöseri på udda kulturprojekt. Rönnquist betonar även vikten av fungerande biltrafik för att hålla stadens innerstad levande och näringslivet igång.", "trump": "Den här galleristen i Ystad, en smart kille, förstår att man måste stoppa radikala, galna konstprojekt som rosa enhörningar och slängda kläder. Han vill ha bilar och rörelse, för utan bilar dör staden! Han står på plats 19 och gör ett fantastiskt jobb för att skydda riktig konst och äkta affärer. En vinnare!", "stalin": "Kamrat Rönnquist inser att avvikelser som rosa enhörningar och skräp i träd hotar den kollektiva ordningen i Ystad. Genom att säkra plats 19 på listan och kontrollera biltrafiken disciplineras staden. Vi noterar hans ideologiska renovering och förväntar oss att kulturapparaten nu levererar en sund, enhetlig produktivitet utan ideologiska avvikelser."}, "date": "5 september, 07:00", "url": "https://bulletin.nu/henrik-ronnquist-19-ar-viktigaste-siffran-i-ystad", "imageUrl": "https://cdn.bulletin.nu/articles/f8db2811-ae22-4724-abcf-6c5aa0b64e51/preview.jpg?t=1788341836000"}, {"type": "image-full", "heading": "Moderaterna varnar för vänsterns skattechock", "summaries": {"normal": "I Ekots valspecial om AI diskuterade riksdagspartierna reglering, skatter och framtidens jobb. Moderaterna varnade för att vänsterns skattechock kan fälla Sverige i AI-racet, medan Miljöpartiet var ensamma om att öppna för en paus för den kraftfullaste tekniken. Flera partier efterlyste även en översyn av skattesystemet och en plan för arbetsmarknaden.", "trump": "De svenska radikalerna vill skatta bort AI! Moderaterna har helt rätt – vänsterns katastrofala skattechocker förstör för fantastiska entreprenörer. Och Miljöpartiet vill pausa tekniken? Sorgligt! Det är totalt inkompetent. I USA vinner vi, vi älskar innovation och framgång, medan de vill gå bakåt. Väldigt svagt!", "stalin": "De svenska partierna diskuterar teknologins krafter utan disciplin. Att tillåta kapitalistiska skatter att hota statens framsteg är sabotage. Miljöpartiets patetiska rop på paus visar svaghet; revolutionen och maskinerna väntar inte på tveksamma byråkrater. Partiets centralkommitté kräver omedelbar produktionsökning och hårdare kontroll över AI-utvecklingen!"}, "date": "5 september, 09:24", "url": "https://kvartal.se/nyheter/artiklar/m-varnar-vansterns-skatter-kan-falla-sverige-i-ai-racet/cG9zdDoxODQ0MTA", "imageUrl": "https://images.kvartal.se/2026/09/c375abed-jessai.webp"}, {"type": "image-full", "heading": "Nu hotar britterna Argentina med – en supermarket", "summaries": {"normal": "Bråket om Falklandsöarna fortsätter efter att Argentinas president Javier Milei hävdat att öarna tillhör Argentina. Storbritannien svarar med att försvara öbornas rätt till självstyre. Livsmedelskedjan Iceland Foods planerar nu att öppna en butik på öarna som ett oväntat stöd till den brittiska närvaron.", "trump": "Folk, ni måste se det här! Den galna argentinska killen Milei skriker om att Malvinas är hans, men britterna slår tillbaka med en supermarket! Iceland Foods kommer dit med frysvaror och vinner hjärtan. Fantastiskt drag, mycket bättre än krig. Argentina förlorar stort, som vanligt under de där vänsterknäpparna.", "stalin": "Kamrater, se hur de imperialistiska parasiterna bråkar om en sten i havet. Den argentinske upprorsmakaren skriker anspråk medan de brittiska exploatörerna skickar en fryst matkedja som vapen. Vilken ynklig föreställning! Arbetarna skrattar åt dessa dekadenta kapitalister som tror att en supermarket kan ersätta kanoner. Patetiskt."}, "date": "4 september, 20:48", "url": "https://www.dagensps.se/varlden/nu-hotar-britterna-argentina-med-en-supermarket", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlev73nmsorv0-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Nu hyllas Isak i England: ”Koden äntligen knäckt”", "summaries": {"normal": "Alexander Isak har startat säsongen starkt med tre mål på tre matcher för Liverpool, inklusive två mot Ipswich. Engelsk media hyllar svensken och menar att han äntligen lever upp till sin rekordprislapp. Tränare Andoni Iraola uttrycker stor glädje över att ha honom i laget.", "trump": "Titta på den där killen Isak, tre mål på tre matcher – totalt fenomenalt! Liverpool betalade en förmögenhet och äntligen vaknar han upp. De woke-kvoterna och identitetspolitiska lakejerna i media trodde han var färdig, men nu är koden knäckt. Fantastiskt, folk älskar vinnare, inte förlorare som under Biden.", "stalin": "Kamrater, se hur den dekadenta fotbollskapitalismen hyllar sin nya hjälte Isak. Tre mål på tre matcher och plötsligt glömmer de hans fiasko förra säsongen. Jag säger er, dessa profitthungriga hyenor byter sida fortare än en trotzkist under utrensning. Låt dem fira – deras borgarimperium kommer ändå att falla."}, "date": "5 september, 07:50", "url": "https://www.svt.se/sport/fotboll/isak-hyllas-i-england-efter-sasongsstarten-koden-antligen-knackt", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.28/0.41/baa7676005ddc746bc15943bdde307db9118caf31561b1642020c72f2c7a0db5"}, {"type": "image-right", "heading": "Debatt: Krigets lagar är en tandlös papperstiger", "summaries": {"normal": "Artikeln argumenterar för att krigets lagar är verkningslösa papperstigrar som ignoreras i faktiska konflikter. Skribenten varnar för att Europa, efter årtionden av naivitet och fusklagade försvarsbudgetar, står illa rustat. Det nya Natomålet på 5 procent av BNP till 2035 kommer att tvinga fram smärtsamma ekonomiska prioriteringar och skattehöjningar som svenska politiker ännu inte kan täcka ärligt.", "trump": "Jag sa ju det från början! Ingen lyssnade förrän jag satte ned foten och ställde stenhårda krav på att Europa måste betala för sitt eget försvar i stället för att snylta på USA. Nu pratar de om fem procent till 2035, men de fuskar med boken och saknar mod. Vakna upp, det är dags att sluta lita på papperstigrar och betala räkningen!", "stalin": "Historien visar att blotta pappersavtal saknar värde; endast stål och disciplin garanterar statens överlevnad. Västvärldens dekadenta stater gråter nu över sina svällande budgetunderskott och femprocentiga försvarsmål, likt råvaror fast i en ekonomisk krzis. När den borgerliga illusionen spricker och välfärden skärs ned, blottläggs deras inkompetens. Vi noterar deras panik med nöje."}, "date": "5 september, 06:30", "url": "https://bulletin.nu/debatt-krigets-lagar-ar-en-tandlos-papperstiger", "imageUrl": "https://cdn.bulletin.nu/articles/eb3cf7d6-801a-4b44-bdca-9f9bffdad3c1/preview.jpg?t=1788445274000"}, {"type": "image-full", "heading": "De tvingades lämna tävlingen", "summaries": {"normal": "I tredje programmet av Let’s dance tvingades Lilla Al-Fadji och Filippa Strand lämna tävlingen. Kvällen präglades av skador, dramatik och underhållning. Lovisa Karlsson dansade bäst som Gandalf. Programmet hade temat ”Vem vill du vara för en dag?” och Lilla Al-Fadji hyllades efteråt av astronauten Christer Fuglesang själv.", "trump": "Tittarna sa farväl till den stackars Lilla Al-Fadji – en total katastrof för den svenska danscirkusen. De dansar utklädda som rymdhippies och trollkarlar medan juryn är full av losers. Jag skulle ha vunnit Let’s dance på en minut, folks. Fantastiskt, men inte för honom. Sad!", "stalin": "Ännu en dekadent borgerlig underhållningsspektakel där revisionistiska dansare och kosmopolitiska astronautimitatörer avslöjar sin brist på disciplin. Folkets dom har talat och skickat den lille artisten till historiens sophög. Sådana svaga element hotar alltid kollektivets moral. Kamrater, vakna upp mot denna förfallna dekadens."}, "date": "4 september, 22:49", "url": "https://www.tv4.se/artikel/10NsgldpDECrV4klRnTcAY/naesta-kaendis-att-laemna-taevlingen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6d4a0GKb1PlUyweUeIqF5M%2Fb43155fe081df016849badd5f0f1cd82%2Fldfinal.jpg&width=1024"}, {"type": "image-right", "heading": "Spionchefen: Putin kan förlora makten – över en natt", "summaries": {"normal": "Estlands underrättelsechef Kaupo Rosin varnar för att Ryssland befinner sig i ett mycket dåligt läge med ekonomiska problem, stora förluster i Ukraina och växande missnöje med kriget. Han tror att en eventuell maktförändring kring Putin kan ske mycket snabbt, över en natt, men ser ingen omedelbar revolution.", "trump": "Hörni, den där estniske spionkillen har helt rätt – Putins ryska skitshow rasar ihop med jättestora förluster, tomma fickor och folk som hatar kriget. Sleepy Joe och de europeiska förlorarna har äntligen lyckats göra Ryssland till ett stort, sorgligt misslyckande. Men tro mig, när jag styr igen blir det annorlunda. Fantastiskt!", "stalin": "Kamrater, jag ser hur de västerländska parasiterna försöker måla upp en bild av svaghet. Den värdige efterträdaren kämpar tappert mot de ukrainska hindren för vår historiska intressesfär. Deras löjliga hopp om nattlig kollaps är bara desperat önsketänkande från fega imperialister. Vi vet vem som verkligen härskar i skuggorna."}, "date": "4 september, 22:24", "url": "https://www.tv4.se/artikel/ckiseVUWCLHGCpnk444As/estlaendska-spionchefen-putin-kan-foerlora-makten-oever-en-natt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F53KTfPKuDzz4QiTMa9xdyJ%2F9fa8b877693e0d51d192ca55fb2a7a85%2FsdlZjvJmyjHEKY-nh.jpg&width=120"}, {"type": "image-full", "heading": "Nya strategin: Så försöker Ryssland göra oss till spioner", "summaries": {"normal": "Rysslands säkerhetstjänst rekryterar ovetande danska medborgare via nätet för att utföra till synes oskyldiga uppgifter som fotografering av företag och leveranser. Danska myndigheter varnar för att detta utgör en ny och konkret nivå av sabotageplaner mot försvarsindustrin som stödjer Ukraina. Operationerna ses som ett allvarligt hot.", "trump": "De ryska clownerna kastar ut ett jättestort nät över stackars ovetande danskar och ber dem knäppa foton på grindar och lager. Patetiskt! Biden sov i åtta år medan de byggde upp detta sabotage-nätverk mot Ukraina-hjälpen. Men nu är jag tillbaka, och vi kommer att krossa dessa svaga, korkade spioner som aldrig sett något liknande. Amerika vaknar!", "stalin": "Jag betraktar med djup tillfredsställelse hur fienderna inom den dekadenta västvärlden nu skälver inför det breda nät som kastas ut. Dessa ynkliga danska imperialister och deras försvarsfabriker, som göder de ukrainska hindren för vår intressesfär, kommer att brinna. Kamrater, vi ser återigen hur svaga de är. Deras paranoia är en komisk symfoni av egen undergång."}, "date": "4 september, 19:56", "url": "https://www.dagensps.se/varlden/nya-strategin-sa-forsoker-ryssland-gora-oss-till-spioner", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlzqhdfgkpdre-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "SD kopplar in säkerhetsavdelningen efter Riks granskning av V-topp", "summaries": {"normal": "Sverigedemokraterna kopplar in sin säkerhetsavdelning efter en granskning av Riks. Vänsterpartiets gruppledare på Lidingö, Jonas Lundgren, deltog i en solidaritetsaktion för en ETA-medlem som dömts till 30 års fängelse för mord. Lundgren kallade honom politisk fånge och vägrade svara på frågor. Han sitter även i SAC:s styrelse.", "trump": "Folk, ni ser det här? Den här vänsterextremisten på Lidingö, en riktig loser, poserar med terrorister från ETA och kallar mördare för politiska fångar. Patetiskt! Nu måste till och med SD ka
