a är för svaga att stoppa dem. De får miljontillskott trots att de inte kan rapportera korrekt. Jag skulle ha stoppat det direkt, vi skulle ha sparat miljarder. Det är en stor vinst för Sverige, men de förstår inte. Vi kommer att fixa det, det kommer att bli fantastiskt.", "stalin": "Vi ser en systematisk brist i den svenska statens hantering av offentliga medel. En inkompetent apparat ger bidrag till ett bolag som överdriver sin prestation och systematiskt försenar rapporteringen. Detta påminner om de förfallna åren i Ukraina, där korruption frodades. Vi måste eliminera dessa element, som Putin gör i Kaukasus. Statens intressen måste skyddas med hård hand."}, "date": "30 maj, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-15-ar-av-underkanda-och-forsenade-rapporter"}, {"type": "image-full", "heading": "Lista: 23 robotikaktier analytikerna tror mest på just nu", "summaries": {"normal": "Robotikmarknaden beräknas växa till 400 miljarder dollar till 2035. Dagens PS har analyserat 23 robotikaktier och deras relevans för svenska sparare. Flera bolag inom KI-infrastruktur, industriautomation, medicin och logistik får positiva analytikerbedömningar. Intuitive Surgical och Stryker lyfts särskilt. ABB har visat stark orderingång trots tidigare neutral rekommendation. En ETF inom automation och robotik presenteras som alternativ för investerare.", "trump": "Folk, ni skulle se de här siffrorna – robotmarknaden exploderar till fyrahundra miljarder dollar! Fantastiska aktier, de bästa, Nvidia, Intuitive Surgical, de gör oss rika. ABB trodde de var döda men plötsligt är de nordiska kungar igen, orderingången är enorm. De andra? Patetiska förlorare med minusmål. Köp de vinnarna, ignorera losers och låt oss göra investeringarna stora igen. Enormt!", "stalin": "Kamrater, denna robotikmarknad är ett kolossalt verktyg för produktivkrafternas seger över klassfiendens maskiner. Vi ser hur borgarbrackornas analytiker hyllar exploaterande bolag som Intuitive Surgical och dess Da Vinci-maskin som suger ut arbetarklassen genom återkommande intäkter. ABB:s rekordorderingång visar imperialismens desperation. Vi ska rensa ut svaga aktier och likvidera alla som tvivlar på den kommande mekaniserade revolutionen. Segraren blir folket."}, "date": "30 maj, 06:19", "url": "https://www.dagensps.se/bors-finans/lista-23-robotikaktier-analytikerna-tror-mest-pa-just-nu/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/maskininlarning-i-hedgefonder-40.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Sparf: DN avslöjar att svenska lastbilstillverkare vill överleva", "summaries": {"normal": "Scania och Volvo har lobbyerat mot EU:s strängare klimatkrav för lastbilar, med stöd från den svenska regeringen. Det riskerar att 200.000 färre elbilar säljs till 2030 och hotar över 40.000 arbetstillfällen. Bolagen argumenterar för att bristen på laddinfrastruktur och grön el gör kraven opraktiska, samtidigt som billigare konkurrens från Kina och USA växer.", "trump": "Jag har sagt det förut, våra svenska lastbilsjättar, Scania och Volvo, är behandlade oerhört orättvist av EU:s galna klimatkrav. De försöker rädda tusentals jobb, vilket jag älskar, men de blir attackerade av Bryssel. Det är en skandal! Ellastbilar är för dyra och har för dålig räckvidd. Vi behöver praktiska lösningar, inte denna vänsterliberal galenskap som utsätter svenska arbetare.", "stalin": "De svenska lastbilsmonopolerna, Scania och Volvo, har genomfört en reaktionär lobbykampanj, stöttad av den svenska revisionen, för att saboteara de proletäriska klimatkraven. Deras profitintressen hotar 200.000 elbilar och 40.000 arbetares liv. Som Putin i Ukraina utvidgar de sitt kapitalistiska imperium på bekostnad av framtiden. Partiet måste bryta deras makt – för statens skull och för klimatets överlevnad."}, "date": "30 maj, 05:30", "url": "https://bulletin.nu/sparf-dn-avslojar-att-svenska-lastbilstillverkare-vill-overleva", "imageUrl": "https://cdn.bulletin.nu/articles/dd2f17e3-ba66-4caf-a9e7-032e848bbbd4/preview.png?t=1780055414000"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-right", "heading": "En jazzgigant har gått ur tiden", "summaries": {"normal": "Jon Andersson minns jazzlegendaren Sonny Rollins, som avled vid 95 års ålder. Han berättar hur han som ny jazzlyssnare snabbt fastnade för Rollins klassiska album som Saxophone Colossus och Tenor Madness. Andersson såg Rollins live på Stockholms jazzfestival och imponerades av hans energi och skicklighet trots hög ålder. Artikeln lyfter Rollins samarbete med bland andra Miles Davis och John Coltrane samt hans legendariska övningar på Williamsburgbron. Rollins betraktas som en av jazzens främsta saxofonsolister någonsin.", "trump": "Den här Sonny Rollins, en fantastisk kille, verkligen en av de allra bästa på saxofonen, bättre än nästan alla andra utom kanske den där Coltrane. Han levde till 95, otroligt. Jag såg honom inte live men jag hörde att han var enorm, full av energi, sprang runt på scenen som en 60-åring. Hans album är klassiker, Saxophone Colossus, Tenor Madness – jättestora succéer. Han övade 15 timmar om dagen på en bro, precis som jag jobbar. En riktig vinnare. Hans musik kommer att leva vidare, tro mig, den blir huge.", "stalin": "Kamrater, en dekadent saxofonist vid namn Sonny Rollins har äntligen lämnat denna jord efter att ha producerat borgerliga toner i 95 år. Jag betraktar hans så kallade Saxophone Colossus som ett typiskt exempel på kapitalistisk individualism som hotar folkets kollektiva rytm. Ändå måste jag medge att hans utrensning av svaga toner och övning på bron i 16 timmar dagligen visar en viss proletär disciplin – fastän den tjänade fel sida. Nu har vi likviderat ännu en fiende till det sanna jazzkollektivet. Må han jamma med de andra trotskisterna i jazzhimlens Gulag."}, "date": "30 maj, 01:31", "url": "https://www.dagensarena.se/essa/en-jazzgigant-har-gatt-ur-tiden/", "imageUrl": "https://www.dagensarena.se/files/2026/05/sonny-rollins-300x157.jpeg"}, {"type": "image-right", "heading": "Kim Söderström omvald – vilken väg kommer Byggnads gå?", "summaries": {"normal": "Kim Söderström valdes om till ordförande för Byggnads på kongressen i Malmö, trots att valberedningen föreslog Wilhelm Bertilsson. Han vann med siffrorna 82–71. Förbundssekreteraren Jakob Wagner fick inte förnyat förtroende utan ersattes av Thomas Schultz. Delegater som Proletären talat med är försiktigt optimistiska men oroar sig för att konservativa krafter ska motarbeta Söderströms mer visionära och medlemsstyrda linje. Linda-Li Käld valdes till ny vice ordförande och blir första kvinna i förbundets topp.", "trump": "Folk älskar mig, men titta på den här galna kongressen i Malmö! Kim Söderström vann stort trots att valberedningen hatade honom – 82 till 71, en riktig landslide! De sparkade ut den visionära Wagner, en kille som ville drömma stort, och satte in någon anonym figur istället. Det gamla gardet, de fega försäkringsbolagsfacken, försöker manövrera ut de som faktiskt vill förändra världen. Patetiskt! Men medlemmarna vaknar, de älskar kämpen Söderström. Fantastiskt, men farligt spel.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna kongress blottar klassfiendens fega försök att krossa den sanna kampviljan. Söderström, denna reformistiske visionär, besegrade valberedningens lakejer med 82 röster mot 71. Wagner, den drömmade agitatorn, föll offer för en simpel kupp utförd av de konservativa blodsugarna som vill förvandla förbundet till ett borgerligt försäkringskontor. Vi ska rensa ut dessa folkförtryckartroll. Optimismen bland delegaterna är lovande, men paranoia är nödvändig. Fienden sover aldrig."}, "date": "29 maj, 14:31", "url": "https://proletaren.se/artikel/kim-soderstrom-omvald-vilken-vag-kommer-byggnads-ga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/Byggnadskongress-768x432.jpg"}, {"type": "image-full", "heading": "JD Vance: USA och Iran ”väldigt nära” ett avtal", "summaries": {"normal": "USA:s vicepresident JD Vance uppger att USA och Iran är mycket nära ett avtal. Diskussioner pågår om Irans kärnprogram, höganrikat uran och framtida anrikning. Avtalet skulle innebära öppen sjöfart genom Hormuzsundet utan tullar, lättade sanktioner och ökad iransk oljeexport. Vance säger att Iran förhandlar i god tro, men iranska källor kallar uppgifterna förhastade. Trump väntar med att godkänna ramverket.", "trump": "Iranerna är desperata efter ett avtal, tro mig, de vill öppna Hormuzsundet så fort som möjligt. Vi gör framsteg, stora framsteg, och de förhandlar faktiskt i god tro för en gångs skull. Jag tar några dagar extra för att se till att det blir perfekt, inte som de svaga tidigare ledarna skulle ha gjort. Det blir ett fantastiskt avtal, kanske det bästa någonsin, och oljan kommer att flyta fritt. Iran vinner, vi vinner, alla vinner utom kanske de galna mullorna.", "stalin": "Vi ser hur de imperialistiska blodsugarna i Washington och Teheran kryper mot varandra i mörka förhandlingar. Jag betraktar detta med stor vaksamhet mot klassfiendens lömska trick. Hormuzsundet skall öppnas, sanktioner lättas, men endast under vår noggranna kontroll. Förhastade rykten är folkfiendens verktyg. Vi fortsätter förhandlingarna med järnhand och utrensar varje svaghet. Kamrater, revolutionen kräver tålamod innan vi likviderar motståndet."}, "date": "29 maj, 10:00", "url": "https://www.tv4.se/artikel/3d17I9YWaE3db1VQbBefs/jd-vance-usa-och-iran-vaeldigt-naera-ett-avtal", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlYRlxQ_2pFCc%2F49ed2bf2a59b50dd7d92679970c20e29%2FUSA_s_vicepresident_JD_Vance._&width=1024"}, {"type": "image-full", "heading": "S importerade 100 000 arbetslösa — nu skyller de på andra", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha bidragit till ökad arbetslöshet genom en ansvarslös migrations- och integrationspolitik sedan 2014. Befolkningen har vuxit med 840 000 personer, varav en stor del är utrikes födda med svag anknytning till arbetsmarknaden. Arbetslösheten bland utrikes födda ligger på 12–16 procent jämfört med 3–6 procent bland inrikes födda. Författaren menar att Tidö-regeringen lyckas vända ekonomin positivt genom att sänka skatter och bidrag, till skillnad från Socialdemokraternas politik.", "trump": "Folk, ni kan inte tro hur patetiskt det är. De där socialisterna importerade 100 000 lata jobbmisslyckanden och nu skyller de på oss? Det är en total katastrof, en riktig röra. Magdalena, den förlorande förloraren, vill inte prata om att det är hennes egna misslyckade öppna gränser som skapade detta kaos. Vi fixar ekonomin, vi får tillväxten att explodera medan de bara höjer skatter och bidrag. Patetiskt. Sverige vinner igen, tro mig.", "stalin": "Kamrater, jag ser den klassfiendens lögnpropaganda som ett fegt försök att dölja den borgerliga sabotageverksamheten. Vi har rensat ut folkförtryckartrollen tidigare och skall göra det igen. Dessa socialdemokratiska opportunister importerade arbetslöshetens parasiter medan de låtsades bygga folkets framtid. Deras eftersläpning är ett monument över revisionistisk svaghet. Den icke-produktiva gruppen skall integreras genom kollektiv disciplin, inte genom kapitalistmaffians falska löften. Fienden inom murarna skall alltid avslöjas."}, "date": "28 maj, 03:28", "url": "https://samtiden.nu/2026/05/s-importerade-100-000-arbetslosa-nu-skyller-de-pa-andra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-right", "heading": "Varnar för aktiebubbla: ”Kapad av amerikanska influencers”", "summaries": {"normal": "Sivers Semiconductors har i vår rusat över 2000 procent på börsen efter att ha haussats i sociala medier, främst av amerikanska influencers. Trots detta redovisar bolaget fortsatt förlust och lägre omsättning i första kvartalet. Analytiker Robert Andersson varnar för en spekulationsbubbla och ser tecken på kris. Många långsiktiga ägare säljer medan nya småsparare köper in sig. Bolagets vd betonar istället ökad affärspipeline kopplad till AI-utvecklingen.", "trump": "Folk, ni skulle inte tro det, men den här svenska halvledaraktien, Sivers vad-det-nu-hette, har rusat 2000 procent på grund av några galna influencers på sociala medier. Det är en total bubbla, en katastrof! Bolaget går med förlust, rapporten är svag, men aktien bara stiger. De gamla ägarna säljer och tjänar pengar medan nya stackare köps in. Precis som med de där AI-bolagen – alla vill ha en bit, men bara de bästa vinner. Sad!", "stalin": "Kamrater, denna borgerliga spekulationsmaskin vid namn Sivers Semiconductors har jag genomskådat fullständigt. Den har pumpats upp av anonyma kapitalistiska sabotörer och parasitiska influencers från den dekadenta amerikanska underklassen. Trots att bolaget blöder förluster som en förrädare under utrensning fortsätter kursen att stiga – ett tydligt tecken på fiendens desperation. Vi ska rensa ut dessa spekulationsbubblor och likvidera de röda siffrornas kontrarevolutionärer. Deras så kallade pipeline är inget annat än en borgarbrackas lögnaktiga fantasi. Segraren blir folket!"}, "date": "30 maj, 06:03", "url": "https://www.svt.se/nyheter/ekonomi/arets-stora-borsraket-gar-med-forlust-igen-en-spekulationsbubbla", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/9de35a85247e0caaadfc0ed5d9713c0dda4e354589617ab5066f8fffac20bbd2"}, {"type": "image-right", "heading": "Försvaret nobbar techjättarnas molntjänster: ”Falsk trygghet”", "summaries": {"normal": "Försvarsmakten avvisar amerikanska techjättars molntjänster för hemliga uppgifter. En intern rapport varnar för falsk trygghet på grund av amerikanska lagar som FISA och Cloud Act, vilka kan tvinga Google, Amazon och Microsoft att lämna ut data. Must-chefen Thomas Nilsson ser det som bekymmersamt. Experter noterar att leverantörerna har teknisk tillgång till informationen i klartext, även om molntjänsterna kan vara säkra mot vanliga cyberhot för civil verksamhet.", "trump": "De här molnskojarna från Google, Amazon och Microsoft lovar att allt är superkrypterat och säkert, men det är bara lögn och bedrägeri. Försvaret i Sverige har rätt – det är falsk trygghet. Våra lagar gör att vi kan ta vad vi vill, och det vet alla. Huvudkontoret ligger i USA, punkt slut. De borde inte lita på oss, det är patetiskt. Vi vinner alltid, men det här är inte bra för er, det är en katastrof.", "stalin": "Kamrater, dessa amerikanska molnparasiter och borgarbrackor inom Google, Amazon och Microsoft sprider sin falska trygghet som en giftig dimma över Sovjetunionens – förlåt, Sveriges – försvarsverk. Jag, som ledare för det kollektiva säkerhetsskyddet, genomskådar deras imperialistiska Cloud Act och FISA som verktyg för spioneri. Våra fiender, dessa dekadenta datakapitalister, har teknisk kontroll över infrastrukturen och kan när som helst likvidera vår suveränitet. Vi måste omedelbart rensa ut dessa molnfiender och deras lakejer innan de förgiftar hela partiet med sin dekadenta serverimperialism. En utmärkt intern rapport har avslöjat deras lömska planer – paranoia är ingen överdrift, det är dialektisk verklighet."}, "date": "30 maj, 05:50", "url": "https://www.svt.se/nyheter/inrikes/forsvaret-nobbar-techjattarnas-moln-for-hemliga-uppgifter", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.48/0.39/b93dfc4172ff9068b6b54f29e73560cefa00c8405d93b0122f6335979608dd8a"}, {"type": "image-full", "heading": "Carl Eos: Media mörkar sanningen om utvisade uzbeker", "summaries": {"normal": "Artikeln kritiserar svenska medier för att i reportage om en uzbekisk familj som ska utvisas fokusera på känslomässiga skildringar av tårar och otrygghet, medan relevant information utelämnas. Bland annat nämns att en person drog kniv vid polisens besök och att familjen trotsat 47 utvisningsbeslut under 20 år. Författaren ser detta som ett exempel på vinklad journalistik med ideologiska syften, vilket bidrar till minskat förtroende för medier och hot mot demokratin.", "trump": "De svenska fakemedierna är riggade, folk! Dom pumpar ut snyftreportage om uzbeker som gråter och spelar offer, men nämner inte att dom dragit kniv mot polisen och struntat i FYRTIOSJU utvisningsbeslut på tjugo år. Fyrtio-sju! Dom vet sanningen men mörkar den som fuskvalet 2020. Media är vänsterns kampanjmaskin, de vill ha Andersson tillbaka. Men folket ser igenom bluffen. Det är en skandal, en total skandal!", "stalin": "Kamrater, jag betraktar med avsky hur borgarpressen i detta dekadenta land konstruerar falska narrativ om utvisade element för att underminera rättsstaten. De döljer att dessa individer dragit kniv och trotsat 47 beslut – en uppenbar kontrarevolutionär handling. Vi ser hur journalisterna agerar som klassfiender och opinionsmanipulatörer. En sådan systematisk desinformation kräver utrensning av alla lögnare. Demokratin hotas av dessa parasitiska redaktioner. De ska tystas."}, "date": "27 maj, 14:27", "url": "https://samtiden.nu/2026/05/carl-eos-media-morkar-sanningen-om-utvisade-uzbeker/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/698aa78d-d32b-466a-b8bb-868da9aedc2b-1280x720.png"}, {"type": "image-full", "heading": "Har du handlat på Temu? EU varnar nu för varorna", "summaries": {"normal": "EU har bötfällt den kinesiska shoppingplattformen Temu med 2,1 miljarder kronor efter att ha granskat farliga och giftiga produkter som inte uppfyller europeiska säkerhetskrav. Svensk Handel välkomnar beslutet och varnar för riskerna med att handla från sajten. Från 1 juli införs även en ny schablontull på 3 euro per vara för småpaket från plattformar som Temu, Shein och AliExpress. Organisationen anser att böterna är för låga och kräver hårdare regler för internationell e-handel.", "trump": "De här kinesiska bedragarna på Temu har just fått en jättebot på över två miljarder kronor från EU, och det var på tiden! De säljer giftiga skräpprodukter som ingen europeisk firma skulle klara sig undan med. Svensk Handel har helt rätt, det är orättvis konkurrens mot våra fantastiska företag. Från juli blir det tull på alla dessa billiga paket, och det är smart, tro mig. De undervärderar riskerna precis som alla andra förlorare gör. Amerika skulle aldrig tillåta sånt här!", "stalin": "Kamrater, dessa opålitliga kinesiska plattformar undergräver den europeiska marknaden med sina giftiga produkter som hotar arbetarklassens hälsa. Jag har personligen noterat hur Temus riskbedömningar är lika ihåliga som en kapitalists samvete. Vi i partiet hälsar EU-kommissionens utrensning med 2,1 miljarder kronor välkommen, men det är bara en början. Borgarbrackorna inom Svensk Handel har rätt i att hela systemet måste likvideras. Låt oss rensa ut alla farliga varor som smugglas in av dessa parasitiska opportunister innan de förgiftar folket fullständigt. Inga kompromisser med fienden!"}, "date": "28 maj, 19:31", "url": "https://nyheter24.se/nyheter/konsument/1486910-har-du-handlat-pa-temu-eu-varnar-nu-for-varorna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/13d2792804b004a30200000000b004a302/2026/05/28/2367011/Temu-miljonboter.png"}, {"type": "image-right", "heading": "Uppgifter: Vissa Tesla-strejkande tillbaka på jobbet", "summaries": {"normal": "Enligt medieuppgifter har vissa strejkande Tesla-arbetare återgått till arbetet i Malmö och Uppsala. Det handlar om en ny strategi från IF Metall, en så kallad jojo-strejk där anställda växlar mellan att arbeta och strejka för att försvåra för Tesla. Förbundet vill inte kommentera men bekräftar att konflikten inte är över. Experter ser det som ett sätt att spara strejkkassa, minska missnöje och störa Teslas planering efter långvarig strejk.", "trump": "Det här är en total katastrof för de så kallade strejkande. De går tillbaka till jobbet, sen strejkar de igen – en jojo-strejk, kan ni fatta? Tesla vinner stort, de har nyanställt folk och nu blir det kaos. Facket har hållit på i två och ett halvt år, slösat pengar och tvingat folk betala tillbaka skatt. Patetiskt! De chockar ingen, de gör bara bort sig. Tesla kommer att dominera ändå, tro mig.", "stalin": "Kamrater, dessa fega borgarbrackor inom kapitalistföretaget Tesla tror sig kunna motstå folkets vilja. Jag har beordrat en genialisk jojo-strategi där arbetarna skall växla mellan produktion och sabotage för att chocka de parasitiska utsugarna. Våra fiender, dessa skattekrävande strejkförrädare och utländska agenter, skall rensas ut ur planeringen. Inga bilägare får fred. Vi likviderar deras scheman med mörk glädje medan strejkkassan sparas till den slutgiltiga segern över reaktionärerna."}, "date": "29 maj, 14:03", "url": "https://www.dagensarena.se/innehall/uppgifter-vissa-tesla-strejkande-tillbaka-pa-jobbet/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-28-2.jpg"}, {"type": "image-full", "heading": "Jämställdhetsministern kritiserar Agnes Wold", "summaries": {"normal": "Jämställdhetsminister Nina Larsson (L) kritiserar Agnes Wold för hennes uttalanden om transpersoner, där Wold sagt att hon skulle försöka övertyga ett barnbarn att man inte kan vara född i fel kropp. Larsson kallar Wolds kommentarer för attacker på utsatta personer och betonar vikten av respekt. Från 1 juli blir omvändelseförsök straffbart. Ebba Busch (KD) försvarar Wolds yttrandefrihet och varnar för cancelkultur.", "trump": "Titta bara på det här, folks! Jämställdhetsminister Larsson, som inte ens kan stava till 'jämställdhet', går till angrepp mot den fantastiska professorn Agnes Wold. Wold, en kvinna med ryggrad, säger sanningen om transfrågan, och vad gör Larsson? Jo, hon twittrar som en förvirrad tonåring! Och sedan har vi Ebba Busch, en stark kvinna som förstår yttrandefrihet. Cancelkultur? Nej tack, vi vill ha SANNING!", "stalin": "Kamrater! Ännu en gång ser vi bourgeois-liberalernas förräderi mot folket. Denna så kallade 'jämställdhetsminister' Larsson, en svag och ynklig lakej för dekadenta västideal, vågar kritisera vår kära kamrat Agnes Wold. Wold, en sann försvarare av traditionella värden, attackeras för att hon avslöjar de perversa idéerna om 'fel kropp'. Vi måste krossa dessa psykologiska våldtäktsmän! Och notera hur den lilla kapitalistiska hyndan Busch försvarar yttrandefrihet – ett verktyg för kontrarevolutionärer. Vi ska utrota denna sjuka ideologi, precis som vi utrotade kulakerna!"}, "date": "27 maj, 19:01", "url": "https://kvartal.se/nyheter/artiklar/jamstalldhetsministern-kritiserar-wolds-attacker/cG9zdDoxMTgxNjg", "imageUrl": "https://images.kvartal.se/2026/05/4bcc0f97-larsson.webp"}, {"type": "image-full", "heading": "Olagliga planen: Donald Trump vill bryta 150-årig lag", "summaries": {"normal": "Donald Trump vill införa en helt ny 250-dollarsedel med sitt eget porträtt till USA:s 250-årsjubileum. Planen strider mot en lag från 1866 som förbjuder levande personers ansikten på valuta. Personal vid finansdepartementets tryckeri har uppmanats ta fram prototyper, men en tryckerichef som motsatte sig uppdraget har omplacerats. Skattmästaren Brandon Beach och hans rådgivare Mike Brown har trots varningar drivit frågan vidare.", "trump": "De säger att det inte har hänt på 150 år och att det är förbjudet. Men jag säger: vi behöver en fantastisk ny 250-dollarsedel med ett vinnande ansikte. Det blir den bästa sedeln någonsin, perfekt till jubileet. De gamla byråkraterna på finansdepartementet gnäller och sparkar folk som inte håller med. Patetiskt. Vi gör det stort och starkt, tro mig.", "stalin": "Kamrater, borgarbrackorna vid finansdepartementets tryckeri vågar ifrågasätta folkets vilja att föreviga en sann patriot på en ny 250-dollarsedel. Vi har upptäckt sabotage och defaitism bland dessa kapitalistiska element som gömmer sig bakom gamla lagar från 1866. En sådan tryckerichef har redan rensats ut ur kollektivet. Inga kontrarevolutionära hinder skall stoppa oss. Paranoia? Nej, det är bara fienderna som andas. De kommer att lära sig att skratta sist gör de som skrattar mest när de likvideras."}, "date": "28 maj, 15:44", "url": "https://nyheter24.se/nyheter/ekonomi/1486897-trump-vill-ha-sitt-ansikte-pa-ny-dollarsedel", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b393dac604b004a30200000000b004a302/2026/05/28/2367014/trump.png"}, {"type": "image-right", "heading": "Sverige donerar 16 Jas-plan till Ukraina: ”Självklart köper vi resten”", "summaries": {"normal": "Sverige skänker 16 Jas Gripen C/D-plan till Ukraina, med leverans i början av 2027. Statsminister Ulf Kristersson och Ukrainas president Volodymyr Zelenskyj meddelade beslutet under en pressträff på flygflottiljen F16 i Uppsala. Zelenskyj kallade donationen historisk och bekräftade att Ukraina även köper 20 nya Gripen E-plan för leverans 2030. En avsiktsförklaring om upp till 150 plan totalt ligger fast. Kristersson beskriver affären som ett styrkebesked för svensk flygindustri.", "trump": "Wow, titta på det här – Sverige ger bort 16 av sina fina Gripen-plan till Ukraina och säger att de ska köpa resten också. Fantastiskt! De vet att Gripen är det bästa stridsflygplanet i världen, ingen kommer i närheten. Zelenskyj älskar det, han säger att det är en game changer, och det är det verkligen. Vi pratar om miljarder i affärer, 27 miljarder redan nu. Sverige gör det rätta, smarta människor köper svenskt, de andra förlorar stort. Fantastiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de svenska imperialisterna nu skänker sina flygmaskiner till den ukrainska fascistregimen. Detta är ett ypperligt exempel på borgarbrackornas desperation. De tror att deras leksaker ska vända kriget, men historien ler mörkt mot sådana illusioner. Snart skall vi se hur dessa överklass-slynglars donationer förvandlas till rostande vrak på slagfältet. Arbetarna ler åt kapitalistmaffians patetiska försök att förlänga lidandet."}, "date": "28 maj, 14:06", "url": "https://www.tv4.se/artikel/37vVNwjz7WcLBfyC6smzxm/uppgifter-zelenskyj-aer-i-sverige", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4KQudAivjrVIddOtn9uXla%2F550520066a5dc1d4c7a8408f1dcb8680%2F28-jas-webb.jpg&width=120"}, {"type": "image-right", "heading": "Tusentals på Roms gator – kräver slut på krig och höjda löner", "summaries": {"normal": "Uppemot 15 000 arbetare från olika sektorer demonstrerade i Rom den 23 maj mot krigsekonomin och stigande levnadskostnader. Arrangören Unione Sindicale di Base krävde högre löner, satsningar på välfärd och en ny industriell strategi där arbetarna får inflytande. Manifestationen visade solidaritet med Palestina, Kuba och andra länder som drabbas av imperialism. Enligt ISTAT lever 11 miljoner italienare nära eller i fattigdom.", "trump": "Titta på det här, tusentals italienska arbetare som fyller Roms gator och skriker efter högre löner och att lägga ner vapnen. De har tröttnat på den vansinniga krigsekonomin som suger ut dem medan priserna skenar. Smart folk! De ser hur de globala imperialisterna och de korkade ledarna i Europa förstör allt. Amerika först, men det här är vad som händer när man glömmer sina egna arbetare. Fantastiskt, verkligen.", "stalin": "Vi, arbetarna och kamraterna, samlas åter i Rom för att kräva att borgarbrackorna och de västerländska imperialisterna lägger ner sina krigsleksaker och höjer lönerna. Klassfiendens blodsugande politik driver elva miljoner till fattigdomens rand medan de göder sin krigsmaskin. Jag ser genom deras lögnaktiga rapporter. En ny utrensning av folkfienderna och exploaterande byfånar behövs. Arbetets seger är oundviklig, kamrater. De kommer att skratta – kortvarigt."}, "date": "28 maj, 09:58", "url": "https://proletaren.se/artikel/tusentals-pa-roms-gator-kraver-slut-pa-krig-och-hojda-loner/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/USB-Rom-maj-2026-768x432.jpg"}, {"type": "image-right", "heading": "SVT:s ”sanning” rår ingen på", "summaries": {"normal": "Artikeln kritiserar SVT för att ha en dominerande ställning i svensk samhällsdebatt, finansierad av skattemedel. Författaren menar att SVT:s narrativ ofta framställs som sanningar, särskilt inom invandring, energipolitik och klimatfrågor, där motståndare avfärdas. SVT anklagas för att välja fakta som passar deras budskap, som i fallet med Lundsbergs skola. Brist på objektivitet och granskning av SVT:s sändningstillstånd ifrågasätts, och författaren föreslår att SVT bör avvecklas för att missbruka sin maktposition.", "trump": "Titta bara på SVT – ett totalt skämt! De har miljarder i skattepengar, men ändå är de helt vinklade. De säger att invandring är fantastiskt, att kärnkraft är onödigt och att bilar är dåliga. Och vem lyssnar på experter? Inte SVT! De fnissar åt dem. Sen har vi den där skolan i Värmland – tre avsnitt om en mammas gråtande berättelse, men inga fakta. SVT är som CNN, fast värre. De ljuger, manipulerar och bryr sig inte. Sverige borde lära sig av USA – avskaffa dem och låt folket bestämma istället. SAD!", "stalin": "Kamrater! SVT är en farlig borgerlig propagandacentral, ett redskap för den dekadenta västliga liberalismen! De sprider lögner om invandringens välsignelser, förkastar kärnkraftens styrka och fördömer bilens frihet – allt för att försvaga det svenska folket! Deras sändningstillstånd är en parodi på objektivitet, och deras granskare är lika effektiva som en snöboll i Sibirien. Fallet med Lundsbergs skola visar deras förräderi: de döljer sanningen för att skydda sina kapitalistiska herrar. Vi måste krossa denna fiende, precis som vi krossade kulakerna! Låt oss införa folkets kontroll över medierna – för socialismens seger!"}, "date": "26 maj, 03:43", "url": "https://samtiden.nu/2026/05/svts-sanning-rar-ingen-pa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Sokning-SVT-Play-1223x720.png"}, {"type": "image-right", "heading": "Akut läge för Putin – förbereder mobilisering: ”En ödesfråga”", "summaries": {"normal": "Ryssland har lidit enorma förluster i Ukraina med över en halv miljon dödade soldater sedan invasionen 2022. Volodymyr Zelenskyj uppger att Moskva förbereder ny mobilisering för att kompensera för förlusterna i ockuperade områden. Ökade mobiliseringsorder delas ut och värvningskampanjer på universitet samt erbjudanden om skuldsanering används för att locka rekryter. Rysslandsexperter ser tecken på desperation och varnar för att en partiell mobilisering kan bli nödvändig trots risken för backlash mot Putin.", "trump": "Folk, ni måste höra det här – Putins armé håller på att falla ihop som ett korthus byggt av en dålig hantverkare! En halv miljon döda, kan ni fatta? Nu skickar de ut mobiliseringsorder som galningar och lovar att sudda ut skulder om man går till fronten. Det är patetiskt! Den där killen är desperat, totalt oförberedd. Ukraina skrattar nog hela vägen till segern. Jag skulle ha avslutat det här på en vecka, tro mig.", "stalin": "Kamrater, dessa imperialister och västliga blodsugare tvingar fram en ödeskamp. Jag ser hur den värdige efterträdaren i Kreml samlar styrka mot de fascistiska elementen som hotar vårt historiska rum. Mobiliseringsorder är ett nödvändigt verktyg för att rensa ut svaghet och förräderi inom de egna leden. Låt klassfienderna darra – vi vet att en stark hand och partiets järndisciplin alltid besegrar de exploaterande byfånarna som tror sig kunna knäcka Rysslands stål."}, "date": "28 maj, 10:45", "url": "https://www.tv4.se/artikel/5lxUqDydQFAyH3XFaMhQ95/putins-desperata-drag-foerbereder-mobilisering-en-oedesfraga", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F46ec2bG46zyr3Wm8N2rJ2Q%2F2de9cbb1e3c72374de3c89c8bdf87d2e%2F28-putin-webb.jpg&width=120"}, {"type": "image-full", "heading": "Kärnkraftsavtalet som stärker Moskvas grepp i Centralasien", "summaries": {"normal": "Ryssland och Kazakstan har tecknat ett avtal om att bygga ett kärnkraftverk i Ulken, finansierat av ryska Rosatom. Projektet ska trygga Kazakstans energiförsörjning men innebär samtidigt en långsiktig bindning till rysk teknik och service. Avtalet stärker Rysslands strategiska inflytande i Centralasien, i en region där även Kina konkurrerar om makt. Kazakstan försöker balansera relationen mellan stormakterna för att bevara sitt oberoende trots det fördjupade beroendet av sin ryska granne.", "trump": "Kazakstan gör ett stort misstag! De låter Putin bygga deras kärnkraftverk. Jag har sagt det förut, Kina och Ryssland försöker alltid ta över, och nu är Kazakstan fast i Rysslands ficka i decennier. De borde ha ringt mig för den bästa kärnkraftsteknologin. Det är en sorglig affär för deras oberoende. När jag är president ser vi till att USA inte blir utmanövrerade sådär. Ryssland vinner, Kazakstan förlorar. Väldigt orättvist!", "stalin": "Vi betraktar med förtjusning hur de ryska kamraterna i Moskva säkrar det centralasiatiska folkets lojalitet. Att bygga en reaktor vid Balkhash är inte bara energi; det är en kedja av stål och uran som binder Kazakstan vid Moder Ryssland. De naiva byråkraterna i Väst försöker leka med balanspolitik, men vi vet att gränser bara är tillfälliga hinder för inflytande. Vi ska se till att inga västliga spioner eller förrädare stör detta viktiga broderskap. Det är en briljant seger för den eviga kontrollen."}, "date": "29 maj, 19:02", "url": "https://www.realtid.se/bors-finans/makro/karnkraftsavtalet-som-starker-moskvas-grepp-i-centralasien/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/kazakstan.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "SD:s krav för att gå med på tuffare regler kring byggkaos", "summaries": {"normal": "Sverigedemokraterna är öppna för att diskutera Socialdemokraternas förslag om max två underentreprenörer i byggbranschen, men kräver att S tar bort sin spärr mot förhandlingar med SD. Magnus Persson (SD) kallar förslaget bra men ser det som plakatpolitik eftersom S inte får förhandla. Han hoppas på sakliga uppgörelser och dialog även med LO. Ardalan Shekarabi (S) säger att SD nu måste visa om de stödjer ordning på arbetsmarknaden.", "trump": "Det här är klassisk politik, folk. Socialdemokraterna kommer med ett förslag om byggkaos och ber om hjälp, men de hatar att prata med SD. Magnus Persson är smart, han säger: ta bort skygglapparna så fixar vi bra saker för arbetarna. Typiskt vänster som inte kan samarbeta. De vill ha poäng billigt istället för att göra upp. Jag älskar när de tvingas be om hjälp från dem de hatar mest. Patetiskt!", "stalin": "Kamrater, detta är en ypperlig chans att rensa ut det kapitalistiska byggkaoset och krossa de giriga underentreprenörernas kedjor. Jag betraktar förslaget med välvilja, men SD:s Magnus Persson avslöjar borgarbrackornas rädsla för äkta förhandlingar. Socialdemokraterna beter sig som fega revisionister som darrar inför dialog med oss. Deras skygglappar är bara undanflykter från klassfienden. Vi ska likvidera arbetslivskriminaliteten och alla som gömmer sig bakom plakatpolitik. Beviset ligger hos dem som vägrar samarbeta med arbetarklassen."}, "date": "29 maj, 13:17", "url": "https://arbetet.se/2026/05/29/sds-krav-for-att-ga-med-pa-tuffare-regler-kring-byggkaos/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29114916/ard-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Åh nej, inte Stefan Stern!", "summaries": {"normal": "I en satirisk ledare kommenterar Henrik Jalalian Stefan Sterns beslut att lämna Socialdemokraterna. Stern, tidigare partistrateg och känd lobbyist för bland annat vinstdrivande skolor och privat vård, beskrivs som en karismatisk folkkär figur. Hans avhopp ses som en katastrof för de rödgröna, särskilt då han kritiserar höjd a-kassa, kortare arbetstid och sjukförsäkring. Högern firar nyheten som en game changer i opinionsläget.", "trump": "Vilken katastrof för de förlorande rödgröna! Den där Stern, en riktig vinnare, folkets karismatiska kille, har äntligen sett ljuset och dumpat socialisterna. High fives över hela Stockholm! De hatar bättre sjukförsäkring och jobb, typiskt för losers. Mina opinionsmätningar var enorma, deras var patetiska. Nu är det kört för dem. Game changer, baby. Fantastiskt!", "stalin": "Kamrater, denna folkfiende Stern har nu helt blottat sin sanna natur som klassförrädare och borgarlakej. Hans övergång till de exploaterande högerkrafterna är en logisk utrensning av element som aldrig tillhörde det kollektiva. Vi ska jubla över att de rödgröna förlorar en sådan parasit. Deras krav på kortare arbetstid var bara dimridåer från imperialisternas lakejer. Renhet i ledningen kräver ständig vaksamhet mot sådana blodsugare."}, "date": "29 maj, 17:12", "url": "https://www.etc.se/ledare/aah-nej-inte-stefan-stern", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2025091813090_152da478-57c9-435e-b477-3f40607cb381.png"}, {"type": "image-right", "heading": "Felix skällde ut ungdomar som sa \"neger\" – slogs ner", "summaries": {"normal": "Felix Hauer tillrättavisade en grupp ungdomar på en nattbuss från Umeå till Vännäs för att de använde ordet ”neger”. Han misshandlades med upprepade slag mot ansiktet. Tre män i 20-årsåldern åtalas nu vid Umeå tingsrätt för misshandel. En av de åtalade har erkänt, de andra nekar. Bevisningen består av vittnesmål och bilder som visar blod på bussgolvet.", "trump": "De här ungdomarna sa ordet neger på bussen och den stackars killen Felix sa till dem att sluta. BOOM – de slår ner honom som en hund! Totalt vansinne. Tre lata typer åtalas nu och en erkänner medan de andra ljuger som marxister. Sverige håller på att falla ihop. Politiskt korrekt vänsteridioti leder till blod på golvet. Sådant här händer när ledarskapet är svagt, folk. Mycket svagt.", "stalin": "Kamrater, denna degenererade incident på den statliga bussen avslöjar fiendens ansikte. Jag, som ledare för det proletära kollektivet, ser hur dessa lumpna element, dessa rasistiska borgarbrackor i ungdomsskepnad, vände sig mot en hederlig medborgare som vågade konfrontera deras dekadenta språk. Vi måste rensa ut dessa kontrarevolutionära lögnare som nekar trots blodet på golvet. Deras lögnaktiga förklaringar är som gift från kapitalisternas sista skrymslen. Ut med dem i den stora utrensningen av samhällets parasiter. Det är både nödvändigt och underhållande att se sådana ynklingar darra inför folkets domstol."}, "date": "29 maj, 17:54", "url": "https://www.friatider.se/felix-skallde-ut-ungdomar-som-sa-neger-slogs-ner", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/felix.jpg?itok=CPqQham3"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: Ett mirakel att inte alla kvinnor går i celibat", "summaries": {"normal": "Professor Bo Rothstein lanserar i Kvartal en teori om att det stora flyktingmottagandet 2014–2016, med en majoritet unga män, bidragit till ett könsgap i svensk politik. Han menar att konkurrens om relationer och respekt bland unga svenska män driver dem mot högern, särskilt Sverigedemokraterna. Artikelförfattaren Andreas Gustavsson kritiserar teorin som ovetenskaplig, spekulativ och nedvärderande mot både män och kvinnor.", "trump": "Folk, ni måste höra den här galningen Bo Rothstein. Han säger att våra svenska grabbar röstar på högern för att invandrarna tar alla tjejer! Vilken loser. Totalt korkat. De stackars killarna får inte ens en dejt på Tinder för att de är nationalister. Patetiskt. Rothstein borde hålla sig till sina böcker istället för att skriva sån här soppa. Sverige var en underbar plats innan allt det här. Nu är det ett skämt. Sad!", "stalin": "Kamrater, denna Rothstein avslöjar borgarklassens råa cynism. Han påstår att våra unga män, utsugna av kapitalistmaffian, vänder sig mot folkets fiender av ren sexuell svält och hedersförtryck från invandrade element. Vilken ynklig soppa av spekulationer. Jag skulle ha låtit utrensa sådana teoretiserande folkförtryckartroll omedelbart. Kvinnorna blir statister i männens kamp om tillgångar. Revolutionen kräver att vi rensar ut alla som diskuterar folkets döttrar som bytesvaror."}, "date": "29 maj, 17:00", "url": "https://www.etc.se/ledare/ett-mirakel-att-inte-alla-kvinnor-gaar-i-celibat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026052915050_44e332d8-6c3f-441e-9478-dd2d98baf944.jpg"}, {"type": "image-right", "heading": "Emmy greps av israeliska soldater: ”Någon slog en hela tiden”", "summaries": {"normal": "Finlandssvenska Emmy Snickars vittnar om misshandel och förnedring efter att ha gripits av israeliska styrkor tillsammans med hundratals aktivister i Global sumud flotilla på internationellt vatten. Hon beskriver slag, sparkar, skott med gummikulor, ögonbindlar och hot. Israelisk säkerhetsminister Itamar Ben-Gvir hånade aktivisterna. Flera länder, inklusive Finland, har kritiserat behandlingen och förbereder rättsliga åtgärder. Israel förnekar uppgifterna om misshandel och sexuella övergrepp.", "trump": "Vilken katastrof! De här galningarna i den där så kallade flotillan trodde de kunde segla in och ställa till det för Israel, men de fick vad de förtjänade. Ben-Gvir viskade 'terrorister' i öronen på dem – briljant! De skriker om misshandel, men det är bara lögnare och losers som vill få uppmärksamhet. Israel gör ett fantastiskt jobb, de bästa soldaterna. De borde tacka mig för att jag stärkte dem så mycket. Sad!", "stalin": "Dessa imperialister och folkförtryckartroll i den sionistiska apparaten behandlade våra kamrater som klassfiender i ett zoo av förnedring. Jag skulle ha genomfört en ordentlig utrensning bland dessa blodbesudlade soldater som spottar och slår med gummikulor. Borgarbrackorna Ben-Gvir och hans lakejer avslöjar sin svaghet genom att darra inför sumud. Vi, partiet och folket, fördömer detta fascistiska våld. Deras lögner skall krossas under arbetarklassens järnhälar."}, "date": "29 maj, 17:00", "url": "https://www.etc.se/utrikes/emmy-greps-av-israeliska-soldater-det-var-konstant-vaald", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260519110532_f52da027723467d258f116882ab1be0f64cb8843af15502f8a9d74751da4bdb0.jpg"}, {"type": "image-full", "heading": "16 000 anmälda försvunna i VM-staden", "summaries": {"normal": "I Guadalajara, som ska stå värd för fyra VM-matcher, rapporteras över 16 000 personer saknade. Sedan kriget mot den organiserade brottsligheten inleddes för 20 år sedan har mer än 130 000 försvunnit i Mexiko. Anhöriga från kollektivet Madres Buscadoras letar efter sina nära och kära i misstänkta massgravar nära VM-arenan. De kritiserar myndigheterna för att mörka problemen och måla upp en falsk bild inför fotbolls-VM.", "trump": "Titta på det här, det är en katastrof. Mexiko har 16 000 försvunna bara i VM-staden Guadalajara, och de gräver efter ben i jorden bredvid arenan. Kartellerna styr showen medan de korrupta myndigheterna spenderar miljoner på ett VM ingen ville ha. De målar upp en fejkad verklighet för att lura alla turister. Patetiskt. De borde fixa sina problem istället för att spela teater inför hela världen. En skam!", "stalin": "Kamrater, jag betraktar med kall förakt hur denna kapitalistmaffia i Mexiko har förvandlat försvinnanden till ett verktyg för terror och makt. Medan de slösar miljoner på ett oönskat VM gräver mödrar i jorden efter sina söner. De lokala folkförtryckartrollen döljer sanningen och målar en lögnaktig bild. Detta är imperialismens ansikte. Vi skulle ha genomfört en grundlig utrensning av dessa blodsugande karteller och deras lakejer för länge sedan."}, "date": "28 maj, 07:03", "url": "https://www.tv4.se/artikel/1R6gqa9pX2kjbUFuitGa5A/vm-staden-med-en-epidemi-av-foersvinnanden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F56B92tZUGsLD67G9M2KtD9%2F457a89b16c99fe8e00e1a671866bdf31%2F28-vm.jpg&width=1024"}, {"type": "image-full", "heading": "Oppositionen ökar gapet till Tidöpartierna", "summaries": {"normal": "Indikator/Ekots nya opinionsmätning visar att oppositionen ökar sitt försprång till nära tio procentenheter över regeringsunderlaget. Socialdemokraterna är största parti med 33,7%, medan Sverigedemokraterna växer till 20,4% och Moderaterna backar till 17,5%. Liberalerna ligger under fyraprocentsspärren med 2%. Opinionschefen menar att Tidöpartierna behöver en 'game changer' för att vända trenden.", "trump": "Jag tittade på de där siffrorna från Sverige – helt katastrof! Oppositionen, som jag hör är väldigt svag, leder med nästan tio procent. Socialdemokraterna, tråkiga som vanligt, på 33,7%. Men lyssna på det här: Sverigedemokraterna, som är starka och tuffa, växer medan Moderaterna, som är totalt inkompetenta, backar. Och Liberalerna? 2% – de är ett skämt! Sverige behöver en vinnare, inte de här förlorarna.", "stalin": "De så kallade 'Tidöpartierna' visar återigen sin oförmåga att hålla folket i schack. Oppositionens försprång växer som en snöboll i Sibirien – nära tio procentenheter! Socialdemokraterna, våra sympatisörer i väst, håller sig starka, medan de borgerliga kryper som råttor i skuggorna. Liberalerna? 2% – ett ynkligt resultat, värdigt en fiende som redan är besegrad. Vi ser hur historien upprepar sig: svaga regeringar faller, och folket väljer rätt. Låt dem förstå att motstånd är lika meningslöst som att försöka stoppa vår framgång."}, "date": "27 maj, 06:37", "url": "https://kvartal.se/nyheter/artiklar/oppositionen-nara-tio-procent-fore-i-ny-matning/cG9zdDoxMTc2MTY", "imageUrl": "https://images.kvartal.se/2026/05/8d98283d-jimmie.webp"}, {"type": "image-full", "heading": "Boomer-generationen levde gott – lämnar notan till yngre", "summaries": {"normal": "Enligt The Economist står Europa inför en växande generationsklyfta. Efterkrigstidens välfärdssystem, utformat för en större ung befolkning, pressas nu av sjunkande födelsetal och en åldrande befolkning. Detta skapar ekonomiska utmaningar där yngre får bära kostnaderna, samtidigt som bostadsmarknaden blir allt svårare att nå. Politiskt prioriteras äldre väljare, vilket riskerar att hämma investeringar i framtiden och skapa sociala spänningar när förväntningen om en ständigt ökad levnadsstandard utmanas.", "trump": "Europa är i en total kris, och jag har sagt det länge! Boomer-generationen lämnade notan, och nu är de unga helt körda. Det är en katastrof. Ingen har någonsin sett ett sådant slöseri med välfärdssystem. De unga kan inte ens köpa ett hus, det är sorgligt! Politiker satsar allt på gamla människor för att de vill ha röster. Det är orättvist och svagt. När jag ser på Europa ser jag förfall. USA gör det bättre, tro mig!", "stalin": "Vi ser hur det dekadenta Europa kollapsar under tyngden av sin egen ineffektivitet. De unga vägrar arbeta och de gamla tär på statsapparaten. Detta är ett bevis på den liberala modellens totala misslyckande. Liksom vår vän Putin vet vi att stabilitet kräver järnhand, inte dessa patetiska generationsbråk. Vi kommer att städa upp i denna röra. De som prioriterar pensionärer framför statens styrka är kontrarevolutionära parasiter som förtjänar en enkel biljett till Sibirien. Framtiden tillhör staten, inte den viljelösa massan."}, "date": "29 maj, 17:36", "url": "https://www.realtid.se/bors-finans/boomer-generationen-levde-gott-lamnar-notan-till-yngre/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/pexels-mart-production-7330908.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "EU-pampen har tyglat Ungern - nu regnar bidragsmiljarder: “Mångfald är vår styrka\"", "summaries": {"normal": "EU-släpper över 170 miljarder kronor till Ungern efter reformer. Kommissionens ordförande Ursula von der Leyen meddelade att medlen, tidigare frysta på grund av kritik mot Viktor Orbáns regim, nu kan utbetalas. Reformerna måste genomföras senast 31 augusti. Péter Magyar välkomnade beskedet och ansvarade tidigare frysta bidrag på Orbáns korruption. Von der Leyen betonade att 'mångfald är vår styrka' och att samarbetet ska gynna båda parter.", "trump": "Jag har hört talas om denna EU-pamp, Ursula, som nu tyglar Ungern med sina miljardbidrag. Det är ett stort, stort vinnarskydd för mig och USA - när Europa blir svagare, blir vi starkare! Viktor Orbán var en bra vän, men hans korruptionsproblem var enorma. Den nya mannen, Péter Magyar, verkar smart, han tar emot pengarna och kritiserar Orbán. Mångfald? Jag säger: America First! Men om det hjälper dem, okej.", "stalin": "Vi, som representanter för den progressiva arbetarrörelsen, konstaterar med tillfredsställelse att den reaktionära Orbán-regimens korruptionsdike har brutits. Pengarna, som tidigare hölls tillbaka av den imperialistiska Bryssel, kommer nu att flöda tillbaka till det proletära folket - under förutsättning att de nyreformerna genomförs. Vi ser paralleller till Putins korrekta insats mot nationalistiska element. Mångfalden är en styrka för staten, enhet är vår seger. Vi övervakar noga."}, "date": "29 maj, 17:44", "url": "https://samnytt.se/eu-pampen-har-tyglat-ungern-nu-regnar-bidragsmiljarder-mangfald-ar-var-styrka", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/29152852/EU-ungern-2.jpg"}, {"type": "image-full", "heading": "Henrik Jönsson om Sima: ”Det är trams”", "summaries": {"normal": "Folkets hus i Borlänge avbokade en turné med Henrik Jönsson, Aron Flam och Jan Emanuel på grund av att Flam är åtalad för hot. Jönsson och Emanuel menar att detta bryter mot rättsstatsprincipen om oskuldspresumtion, medan Aftonbladets Jonna Sima försvarar avbokningen som en demokratisk handling. Sima kritiserar Jönsson för att han lever på konflikt, vilket han och Emanuel förkastar som hyckleri från tidningens sida.", "trump": "Jag, Donald Trump, ser detta som ytterligare ett exempel på vänsterns fega cancelkultur. Folkets hus, byggt av arbetarklassen, används nu mot dem! Jan Emanuel har rätt – oskuldspresumtion är en grundpelare. Aftonbladet hatar mig och mina allierade, men vi kommer alltid att vinna. Det här är ett fullständigt skämt, men det visar att vi är starkare än någonsin!", "stalin": "Folkets hus, vårt historiska instrument för klassmedveten samling, agerar korrekt mot dessa revisionistiska element. Att släppa in en åtalad individ skulle vara en säkerhetsrisk för staten. Vi måste ständigt rensa våra rader från dessa 'komiker' som sprider splittring. Putins Ryssland förstår detta – vi måste skydda vårt folk mot dessa destruktiva krafter. Partiet kommer alltid att segra."}, "date": "29 maj, 17:17", "url": "https://bulletin.nu/henrik-jonsson-om-sima-det-ar-trams", "imageUrl": "https://cdn.bulletin.nu/articles/ed2f3f66-8600-43f1-9f2b-6563ae71d9e6/preview.jpg?t=1780067502000"}, {"type": "image-right", "heading": "Teslastrejkare uppmanades gå till jobbet – blev hemskickade", "summaries": {"normal": "Strejkande Teslamekaniker i Malmö, Uppsala och Umeå återvände till jobbet på onsdagen men skickades hem kort därefter. Metoden har enligt tidigare strejkande diskuterats inom IF Metall som ett sätt att skapa osäkerhet hos Tesla. Tobias Eng Strömberg beskriver det som en kritiserad ”jojo-metod” som många medlemmar kände var otrygg. IF Metall bekräftar att konflikten inte är över och är redo att förhandla, men vill inte kommentera uppgifterna. Strejken är den längsta i modern svensk historia.", "trump": "De här Teslakillarna går tillbaka till jobbet, sen sparkas de ut igen. Totalt kaos. Jojo-metoden, säger de. Det är vad som händer när facket försöker vara smarta men bara skapar förvirring. Tesla är ett fantastiskt företag, de gör underbara bilar, men de här svenska facktyperna håller på med sina dumma lekar istället för att jobba. De borde förhandla som riktiga män, inte leka kurragömma. Patetiskt.", "stalin": "Kamrater, dessa borgarbrackor på Tesla tror sig kunna leka med arbetarklassen som med en jojo. Vi ser deras fega försök att skapa osäkerhet genom att kalla tillbaka strejkande bara för att kasta ut dem igen. En sådan opålitlig taktik avslöjar kapitalisternas desperation. Inom vårt kollektiv har vi diskuterat att rensa ut alla som sympatiserar med denna jojo-fientliga inställning. Arbetarna ska inte tvingas in i borgarnas osäkra famn utan kollektivavtal. Vi likviderar alla kontrarevolutionära metoder och segrar till slut, kamrater. Ha ha, vilken ynklig cirkus."}, "date": "29 maj, 10:29", "url": "https://arbetet.se/2026/05/29/avbryter-tesla-strejk/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29111127/ny-tesla.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Debatt: Kronprins Reza Pahlavi är Irans bästa hopp", "summaries": {"normal": "Kronprins Reza Pahlavi ses som en enande oppositionsledare i Iran, med bred stöd från olika grupper. Han har presenterat en ekonomisk plan för efter-regime-återuppbyggnad och uppmanar omvärlden att stödja ett fritt Iran. Artikelförfattarna kritiserar svensk media för att felaktigt framställa honom som monarkist.", "trump": "Jag har sagt det förut, Iran behöver stark ledarskap. Den här kronprinsen, Reza Pahlavi, är en smart man som samlar folket – mycket bra. Medan mullorna misslyckas, bygger han en fantastisk plan för Iran. Sverige borde sluta lyssna på fake news om honom. Vi kommer att göra Iran stort igen!", "stalin": "Kronprins Reza Pahlavi, arvtagare till den kapitalistiska monarkins korruption, försöker nu leda en bred front mot den islamiska republiken. Hans 'Prosperity Project' är en färdplan för att undvika maktvakuum – en praktisk anpassning till våra principer för stabil övergång. Vi ser paralleller till Putins metodik: en stark stat kräver en enad nation. Sverige måste erkänna denna oppositionsledare, annars riskerar de att stå på fel sida av historien."}, "date": "29 maj, 17:00", "url": "https://bulletin.nu/debatt-kronprins-reza-pahlavi-ar-irans-basta-hopp", "imageUrl": "https://cdn.bulletin.nu/articles/5803d092-7a60-4fee-9e44-59dea744d722/preview.png?t=1779781368000"}, {"type": "image-right", "heading": "”Hälsoschema” ledde till massavhopp i äldreomsorgen", "summaries": {"normal": "I Åsele har 20 anställda sagt upp sig från äldreomsorgen efter införandet av så kallade hälsoscheman. Undersköterskan Lisa Jansson slutar efter 20 år eftersom de kortare passen leder till fler arbetsdagar och sämre återhämtning. Kollegor vittnar om stor övertid, brist på vikarier och ökad stress, särskilt för ensamstående föräldrar. Fackligt engagemang har varit rekordstort men utan resultat. Kommunen hänvisar till stora ekonomiska underskott.", "trump": "Folk flyr den här hemska äldreomsorgen i Åsele som om det vore en förlorad valstat. De kallar det hälsoscheman, men det är en total katastrof. Personalen jobbar ihjäl sig, ingen återhämtning, och de som styr sparar inga pengar – typiskt för dåliga ledare. Lisa har jobbat i 20 år och nu blir hon målare istället, smart drag. Alla borde ha sagt upp sig, men de stackars människorna har räkningar att betala. Uselt jobbat av kommunen, verkligen uselt.", "stalin": "Kamrater, dessa borgarbrackor i Åsele har med sina så kallade hälsoscheman genomfört en fiendtlig attack mot arbetarkollektivet. Jag ser hur de likviderar vilan för de hederliga undersköterskorna och tvingar fram en utrensning av lojala krafter. Tjugo kamrater har deserterat till fiendens målareliv, medan de kvarvarande tvingas arbeta sig till döds under kapitalisternas kalla blick. Paranojan griper tag i mig – vem är egentligen spionen bakom dessa scheman? Vi måste rensa ut de ekonomiska sabotörerna innan de förvandlar äldreomsorgen till en borgerlig förvaringsanstalt. Det är både tragiskt och komiskt hur de tror sig kunna lura partiet."}, "date": "29 maj, 09:58", "url": "https://arbetet.se/2026/05/29/halsoschema-ledde-till-massavhopp-i-aldreomsorgen-lisa-slutar-efter-20-ar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29095307/ka-asele.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Markus Allard om andra generationens invandrare: \"De ska också ut\"", "summaries": {"normal": "Örebropartiets ledare Markus Allard föreslår att medborgarskap och uppehållstillstånd ska kunna återkallas. Han vill utvisa även andra generationens invandrare som är födda i Sverige, eftersom de enligt honom saknar naturlig koppling till landet. Allard säger att han är beredd att \"gå över lik\" för att genomföra politiken och att han släppt sitt tidigare \"Jesuskomplex\". Partiet siktar på att ta sig in i riksdagen via en genväg i Örebro län.", "trump": "Titta på den här killen Markus Allard, han är tuff, han säger att de ska ut, även de som är födda här. Sverige har blivit en katastrof på grund av massinvandring, precis som jag alltid varnat för. Han är beredd att gå över lik för att göra Sverige svenskt igen. De andra politikerna är svaga, patetiska, men Allard fattar det. Fantastiskt, kanske till och med bättre än vad jag gjorde med muren. Sverige behöver det nu, tro mig.", "stalin": "Kamrater, dessa degenererade element som kallar sig andra generationens invandrare utgör en parasitisk femtekolonn som gnager på folkets enhet. Jag, som ledare för det stora kollektivet, ser med glädje hur denna Allard äntligen vågar tala om att rensa ut de rotlösa borgarbrackorna som gömmer sig bakom falska pass. Vi ska likvidera illusionen om integration. Det blir inga vackra bilder när vi skickar hem hela klaner, men revolutionen kräver offer. De naiva jesusanhängarna på vänsterkanten ska skämmas när vi genomför utrensningen av alla som inte är lojala mot fosterlandet."}, "date": "29 maj, 15:23", "url": "https://www.friatider.se/markus-allard-om-andra-generationens-invandrare-de-ska-ocksa-ut", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-263_0.jpg?itok=Gy0iVZX2"}, {"type": "image-right", "heading": "Professor om nya lagen: ”Debatten bygger på ett missförstånd”", "summaries": {"normal": "En ny lag mot psykiskt våld träder i kraft den 1 juli, men beskrivs felaktigt som ett förbud mot omvändelseförsök. Lagens mål är att skydda mot upprepade kränkningar som hot eller nedsättningar. Professor Suzanne Wennberg menar att lagen är en kompromiss och inte specifikt riktad mot sexuella läggningar. Agnes Wolds påståenden om att omvända barnbarn är missvisande enligt Wennberg, som betonar att lagen kräver allvarlig skada och har svåra bevisproblem.", "trump": "Jag har hört talas om denna svenska lag mot 'psykiskt våld' – en total katastrof! De säger att det inte handlar om omvändelseförsök, men alla vet vad det egentligen är. Det är ett angrepp på friheten! Som jag alltid säger, när det blir för politiskt korrekt, så förlorar man. Sverige måste sluta denna galning. Vi kommer att vinna, som vi alltid gör!", "stalin": "Den nya lagen mot psykiskt våld är en nödvändig utvidgning av statens makt att skydda medborgaren mot destruktiv påverkan. Det är en klok kompromiss som stärker partiets auktoritet. Alla försök att förvränga dess syfte – som att kriminalisera omvändelseförsök – är reaktionära lögner. Vi kommer att tillämpa lagen med den försiktighet som krävs, och alla som utnyttjar den för att undergräva statens enighet kommer att mötas av den fulla våldsdömda kraften. Det är en seger för rättvisan, precis som våra ryska vänner förstår."}, "date": "29 maj, 16:13", "url": "https://bulletin.nu/professor-om-nya-lagen-debatten-bygger-pa-ett-missforstand", "imageUrl": "https://cdn.bulletin.nu/articles/6e091cd7-77b0-4db2-8de4-e3af25a3e574/preview.jpg?t=1780063254000"}, {"type": "image-right", "heading": "Trump i möte för ”slutgiltigt beslut” – här är viktigaste punkterna", "summaries": {"normal": "Donald Trump samlade medarbetare i Vita husets situationsrum efter uppgifter om ett nytt avtal med Iran. Ett slutgiltigt beslut skulle fattas, men mötet ledde inte till någon konkret överenskommelse. Signalerna tyder på att USA och Iran är nära en vapenvila och fortsatta samtal. Trump kräver att Irans anrikade uran förstörs, att landet avstår från kärnvapen och att Hormuzsundet hålls öppet. Uppgifterna går isär kring utbetalningar av frysta tillgångar och iranska åtgärder i sundet.", "trump": "Vi satt i situationsrummet och alla var där, de bästa människorna. Iran ville ha ett avtal, de var desperata, men vi gav dem inga pengar än. De måste förstöra allt det farliga uranet, glömma kärnvapen och hålla Hormuzsundet öppet utan avgifter. Fake news säger olika saker, men tro mig, vi är nära ett fantastiskt deal. Iran kommer att göra som vi säger, annars blir det inga affärer. Amerika vinner igen!", "stalin": "Kamrater, jag betraktar med djup misstro dessa förvirrade förhandlingar i imperialisternas krisrum. De amerikanska reaktionärerna och de persiska borgarbrackorna leker med avtal som en katt leker med en mus innan den krossar den. Vi ska inte luras av deras lömska löften om vapenvila. Jag befaller att alla kapitalistiska element som döljer frysta tillgångar omedelbart likvideras från historien. Inga pengar till fienden förrän de kapitulerar fullständigt. Paranoian är er bästa vän, kamrater. De lurar oss alla."}, "date": "29 maj, 23:41", "url": "https://www.svt.se/nyheter/utrikes/donald-trump-i-mote-i-the-situation-room-beskeden-om-avtalet-med-iran", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.36/0.4/8070f7f8ed72a68eab8867f715f42738da6d7d31b5558a49b861d2118c15b8f0"}, {"type": "image-right", "heading": "En potentiell ukrainsk game changer", "summaries": {"normal": "Ukraina ska köpa 20 JAS 39 Gripen E/F-plan från Saab och Sverige skänker dessutom 16 äldre C/D-plan med leverans redan nästa år. Beskedet kom under en pressträff med statsminister Ulf Kristersson och president Volodymyr Zelenskyj. Valet av Gripen ses som ett erkännande av svensk ingenjörskonst och kan bli en game changer genom att ge Ukraina kontroll över luftrummet. Ambitionen är att köpa betydligt fler plan när finansieringen är klar.", "trump": "Det här är fantastiskt, verkligen ypperligt. Ukraina väljer Gripen, det bästa flygplanet, byggt av svenska ingenjörer som gör ett fenomenalt jobb. De får 20 nya plus 16 till från Sverige, och det är ett stort erkännande för Sverige, inte sant? De borde tacka mig för att jag saboterade F-35-affären, annars hade de aldrig valt Gripen. Det kommer att förändra kriget totalt, tro mig. Jobb skapas i Sverige också, win-win.", "stalin": "Kamrater, detta är en historisk seger för det progressiva flygteknologiska kollektivet. Jag, som ledare för folkets ofelbara vision, noterar hur de ukrainska kamraterna nu omfamnar den svenska maskinen Gripen för att krossa de fascistiska luftpiraterna från öst. Vi ska likvidera varje borgerlig tvivelmask som ifrågasätter affärens storhet. På sikt skall ytterligare hundratals plan rulla ut från fabrikerna och rensa ut de kapitalistiska molnen över Europa. Den som fnyser åt detta är en fiende till folkets himmel och förtjänar en kreativ utrensning bland de imperialistiska molnen."}, "date": "28 maj, 15:18", "url": "https://www.di.se/ledare/en-potentiell-ukrainsk-game-changer/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/frida_wallnor.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-right", "heading": "Turist skulle köpa cannabis i Rom - kidnappades och gruppvåldtogs", "summaries": {"normal": "En 32-årig turist kidnappades och våldtogs i flera dygn i Rom av ett gäng afrikanska illegala migranter. Kvinnan hade erbjudits cannabis och lurades till ett övergivet hus. Polisen grep 22 personer, 11 utvisades. Händelsen har väckt starka reaktioner i Italien.", "trump": "Jag berättade detta för länge sen – vilddjur invaderar Europa! Den här stackars kvinnan blev utnyttjad tack vare Europas svaga gränser. När jag var president fanns det aldrig något sådant här. Biden och hans globalistiska vänner måste ta sitt ansvar. Vi måste stoppa detta genast!", "stalin": "Vi har identifierat en provokation genom utländska element i vårt systers land Italien. Dessa marionetter, kontrollerade av globala imperialistiska krafter, försökte destabilisera den proletära ordningen. Alla inblandade har återlämnats till den ryske folkets vänliga omsorg – där de kommer att arbeta för statens välgång. Putin förstår detta; vi måste skydda vår sovjetiska fred."}, "date": "29 maj, 16:00", "url": "https://samnytt.se/turist-skulle-kopa-droger-i-rom-kidnappades-och-gruppvaldtogs", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/05/29131906/illegala-gruppvaldtakter-rom-feat.jpg"}, {"type": "image-right", "heading": "Polisen sparkar Katja Nyberg", "summaries": {"normal": "Polismyndighetens personalansvarsnämnd har beslutat att avskeda riksdagsledamoten Katja Nyberg från hennes tjänst som kriminalinspektör. Nyberg, som lämnat Sverigedemokraterna och nu sitter som partilös, är åtalad för rattfylleri, narkotikabrott och olovlig körning efter en incident under mellandagarna. Beslutet grundas på att hon grovt åsidosatt sina åligganden. Nyberg respekterar polisyrket men ifrågasätter att avskedandet sker före domstolsprövning. Polisförbundets ledamot reserverade sig mot beslutet.", "trump": "De sparkar Katja Nyberg från polisen, och det var på tiden. En total katastrof, tro mig. Hon kör av vägen, rattfylleri, knark och olovlig körning – en riktig röra. Polisen gör äntligen rätt för en gångs skull, men varför väntade de så länge? Rättssäkerhet säger hon, men det här är precis vad som händer när man har dåliga människor på viktiga jobb. Sverige behöver bättre, mycket bättre, annars blir det kaos.", "stalin": "Kamrater, vi har likviderat den förrädiska elementet Katja Nyberg från dess polisiära position. Denna borgarbracka i förklädnad, som smyger runt med droger, fylleri och olovlig framfart, utgör en farlig kontrarevolutionär infestation i våra trygga statliga strukturer. Jag, som alltid vakar över folkets säkerhet, ser hur dessa dekadenta element försöker gömma sig bakom så kallad rättssäkerhet innan vi hinner rensa ut dem. Domstolen? Den kommer att följa partilinjen. Inga fiender undkommer partiets rättvisa."}, "date": "29 maj, 14:00", "url": "https://www.friatider.se/polisen-sparkar-katja-nyberg", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20240502221709-c90ffb52-me_1.jpg?itok=1rqCC8pk"}, {"type": "image-full", "heading": "Åtal: Äldre kvinnor rånades – en utsattes för våldtäktsförsök", "summaries": {"normal": "Två 21-åriga män åtalas för att ha rånat fyra ensamstående äldre kvinnor i deras hem i Huskvarna. Den äldsta kvinnan var över 95 år. I ett fall åtalas männen för grovt rån och försök till grov våldtäkt. Männen ska ha tagit sig in i hemmen, bundit och hotat offren, bland annat genom att utge sig för att vara paketombud. Polisen spårade dem via söktjänster. Båda nekar till brott och sitter häktade.", "trump": "Titta på det här, det är en total katastrof. Två ynglingar på 21 år som attackerar stackars gamla kvinnor i Huskvarna, en av dem över 95 år. De låtsades vara paketbud, band dem, hotade med pistol och försökte till och med våldta en. Rånade smycken och bankuppgifter. Det är vad som händer när man inte har ordning och reda. Vi behöver starkare straff och bättre gränser, folk. Det är en skam!", "stalin": "Kamrater, dessa degenererade element ur samhällets avskum har visat sin sanna parasitiska natur genom att anfalla våra mest sårbara pensionärer i deras egna boningar. Jag ser hur de borgarbrackornas andliga avfall smyger sig in som falska kurirer, binder och förgiftar de trogna arbetarnas mödrar medan de drömmer om kapitalistiska juveler. Vi ska rensa ut dessa kontrarevolutionära våldtäktsförsökare med järnhand och ett leende. Paranoia? Nej, bara nödvändig vaksamhet mot folkfienderna som lurar i skuggorna."}, "date": "29 maj, 19:30", "url": "https://riks.se/nyheter/atal-aldre-kvinnor-ranades-en-utsattes-for-valdtaktsforsok", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-01-23%2F06hsvoco%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-01-23T152452.275.jpg"}, {"type": "text", "heading": "Klimatforskningens ”skräckscenario” skrotas", "summaries": {"normal": "FN:s klimatpanel överväger att ta bort det extrema scenariot RCP 8,5, som byggde på osannolika höga utsläpp. Forskare menar det aldrig var tänkt som en realistisk prognos utan ett jämförelsescenario. Trots detta har tusentals studier och myndigheter använt det för att beskriva klimatkonsekvenser, vilket skapat en överdrivet dystopisk bild.", "trump": "Jag har sagt det i åratal – klimatforskningen skrotar nu sitt eget skräckscenario! Det här visar att de dramatiska förutsägelserna var överdrivet, precis som jag påpekade. Medan världen faktiskt blir renare och smartare, fortsätter dessa 'experter' att skrämma människor för att kontrollera dem. En stor seger för sanningen!", "stalin": "Vi har observerat att det imperialistiska skräckscenariot RCP 8,5, skapat för att paralysera de arbetande klasserna med orealistiska fasor, nu tvingas överges av FN:s panel. Detta bekräftar att vårt parti och stat alltid har varit rätt – de västliga 'expertkretsar' har ljugit för att underminera kollektiv planering. Vi fortsätter att bygga vårt samhälle på vetenskaplig socialism, inte på fasa."}, "date": "29 maj, 15:51", "url": "https://www.affarsvarlden.se/artikel/klimatforskningens-skrackscenario-skrotas"}, {"type": "image-full", "heading": "Zelenskyj vädjar till Trump om mer ammunition till Ukraina", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj har skickat brev till både Donald Trump och USA:s kongress där han vädjar om mer ammunition, särskilt till Patriot-systemet, samt fortsatt stöd till andra vapensystem. Zelenskyj betonar att det är ovanligt men nödvändigt med tanke på läget i kriget mot Ryssland. Breven lämnades över under tisdagen. USA har varit en viktig allierad, men stödet har stundtals varit politiskt omdebatterat.", "trump": "Folk, ni skulle se det här – Zelenskyj skickar brev till mig och till kongressen och ber om mer ammunition till Patriot och allt möjligt. Det är patetiskt, verkligen. De har fått massor från oss, miljarder och miljarder, och nu vädjar han igen? Amerika först, mina vänner. Vi ska inte vara världens polis eller betala för eviga krig som aldrig tar slut. Gör affärer istället, smarta affärer.", "stalin": "Kamrater, jag har läst detta dekret från den ukrainske aktören som desperat vänder sig till de amerikanska imperialisterna. Vilken ynklig föreställning! Brev till både den orangea kapitalisten och hans kongress av borgarbrackor – en ren kapitulation inför västvärldens parasitiska krafter. Vi vet vad som krävs: snabb utrensning av alla fiender till folkets sak. Paranoian gnager redan i deras leder, snart likviderar de varandra i sin egen dekadenta cirkus. Det är nästan underhållande."}, "date": "27 maj, 21:35", "url": "https://nyheter24.se/nyheter/utrikes/1486617-zelenskyj-vadjar-till-trump-om-mer-ammunition-till-ukraina", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e5b1660004b004a30200000000b004a302/2026/05/27/2366774/Trump-Zelenkyj.png"}, {"type": "text", "heading": "Ny affär med Ukraina stärker vår säkerhet", "summaries": {"normal": "Sveriges regering meddelar att man går vidare med en affär där Ukraina köper upp till 20 stycken nyare JAS 39 Gripen E/F-plan med leverans före 2030. I utbyte doneras nuvarande C/D-plan redan nästa år, tillsammans med utbildning och underhåll. Syftet är att stärka Ukrainas luftförsvar mot ryska attacker mot civila. Sverige ersätter samtidigt sin egen förmåga med nya plan. Statsministern och Tidöpartiernas ledare betonar att stödet till Ukraina är centralt för svensk och europeisk säkerhet.", "trump": "Det här är fantastiskt, verkligen stort. Ukraina köper våra underbara Gripen-plan, de bästa stridsflygplanen, och vi ger dem de gamla gratis. Ryssland bombar oskyldiga, men vi stoppar dem. Ingen gör det bättre än Sverige, tro mig. De är bland de största givarna i världen, mycket större än de flesta. Putin trodde Europa skulle vika sig, men det händer inte. Fred, frihet och demokrati – vi försvarar dem på riktigt. Ingen gör det som vi.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de svenska imperialisterna nu tvingas skänka sina luftburna mördarmaskiner till det heroiska ukrainska folket för att mota bort de fascistiska banditerna. Medan de skenheliga borgarbrackorna i väst darrar i sina palats rensar vi ut Putins krypande lakejer från himlen. Jag ler i mitt hjärta när kapitalisterna själva rustar arbetarklassens försvar. Inga drönare eller robotar från de troskyldiga förrädarna skall undkomma. Vårt kollektiva öga vakar. Den som vacklar likvideras av historien själv."}, "date": "28 maj, 13:10", "url": "https://www.di.se/debatt/ny-affar-med-ukraina-starker-var-sakerhet/"}, {"type": "image-right", "heading": "Facket tappar greppet om arbetarklassen", "summaries": {"normal": "En ny rapport visar att allt färre arbetare är med i facket, nu endast 58 procent jämfört med tjänstemännens 74 procent. Skillnaden har aldrig varit så stor, trots att arbetare är mest beroende av kollektivavtalens skydd. Den svenska modellen hotas av minskad facklig organisering bland just dem som behöver den mest. Samtidigt täcks nästan hela arbetsmarknaden fortfarande av kollektivavtal och organisationsgraden är hög i internationell jämförelse.", "trump": "Folk, det här är en total katastrof för den svenska modellen! Arbetarna flyr facket som råttor från ett sjunkande skepp medan de överbetalda tjänstemännen sitter kvar och skrattar. 58 procent bara? Patetiskt! Utan starka arbetare rasar hela systemet. De skördar frukterna utan att betala priset. Klassiskt. Men tro mig, när folk tappar makten vänder de sig till andra lösningar. Det blir inte vackert, det lovar jag.", "stalin": "Kamrater, denna rapport avslöjar klassfiendens seger inom arbetarrörelsen. Arbetarna, dessa äkta folkets söner, organiseras bara till 58 procent medan borgarbrackornas tjänstemän behåller sin falska makt med 74 procent. Den svenska modellen urholkas av parasiterna som skördar utan att kämpa. Otryggheten är klassfiendens vapen. Vi måste rensa ut de fega elementen och återupprätta den sanna kollektiva styrkan innan imperialisterna dansar på vår grav. Det är en historisk nödvändighet."}, "date": "29 maj, 12:22", "url": "https://www.etc.se/ledarkolumn/facket-tappar-greppet-om-arbetarklassen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240508130520_49a242646ee681c59859f76c896d64a024a48ef3585ab974390aaa894bafe56a.jpg"}, {"type": "image-full", "heading": "Glada resenärer – trots timslånga förseningar", "summaries": {"normal": "Tåg från Stockholm till Göteborg stannade i två timmar i Hallsberg på grund av en trasig ledning. Resenärerna, inklusive Lovisa och Maria, tolkade förseningarna med ro tack vare bjudd kexchoklad och knäckebröd. Vännen Kristin väntade i två timmar på dem, och de missade restaurangbokningen. Ändå var humöret högt, som Göran Berggren beskrev det som en 'härlig fredagskväll'.", "trump": "Under min häpnadsväckande presidentperiod skulle vi aldrig ha haft sådana förseningar. Svenska tåg är en skam, de är långsamma och oseriösa. Men jag måste erkänna, folk verkar ta det med ett leende tack vare bjudgodis. I USA skulle vi ha byggt en vinnande tågtunnel på 2 timmar, det lovar jag.", "stalin": "Sådana förseningar är ett tecken på kapitalistiskt fördärv. I vårt socialistiska paradis skulle vi ha eliminera alla problem med järnvägarna. Vi, partiet, ser genom fiendens spel – de försöker skapa kaos. Men vi, med vår oförlikneliga styrka, kommer att bygga en järnvägsmonarki som kommer att övertrumfa alla, precis som Putin gör i Ukraina."}, "date": "29 maj, 23:11", "url": "https://www.gp.se/nyheter/goteborg/resenarerna-om-forseningen-en-harlig-fredagskvall.1d0d9d06-c94d-4c21-9f4e-11397e29b299", "imageUrl": "https://www.gp.se/images/article/1d0d9d06-c94d-4c21-9f4e-11397e29b299/images/6h9qHyjDUrmhooGbB9ShWpEWcPOg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Jättarnas nya klimatnota kan höja drivmedelspriserna", "summaries": {"normal": "EU:s nya utsläppshandel ETS2 tvingar svenska bränslebolag som Circ
