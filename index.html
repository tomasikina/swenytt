per in miljontals okända människor utan gränser. Spanjorerna fattar det, de stoppade 80 000 vid gränsen! Men svaga politiker vill att ni ska hålla tyst och dricka kranvatten i er garderob. Fake news! Vakna upp, dags för val!", "stalin": "Vi har noga studerat det svenska flyglarmet. Det är fascinerande hur de prövar sina sirener medan de frivilligt monterar ned sina egna gränser. Om vi i Sovjetunionen hade öppnat dörrarna på det sättet, hade vi skickat dem till gulag omedelbart! Istället för att räkna konserver borde de räkna sina förrädare. Ett folk som inte skyddar sitt territorium förtjänar att assimileras."}, "date": "7 september, 17:57", "url": "https://samnytt.se/hesa-fredrik-tjuter-men-ingen-varnar-for-invasionen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/07143816/Toppbild1-6.jpg"}, {"type": "image-full", "heading": "V är ett större bekymmer än SD för Sveriges säkerhet", "summaries": {"normal": "Sverige har rustat upp militärt och stärkt sina internationella försvarsband under mandatperioden. Medan Sverigedemokraterna stöttar regeringens utrikes- och försvarslinje, utgör Vänsterpartiet ett större säkerhetshot genom sin vilja att lämna Nato och säga upp försvarsavtalet med USA. Säkerhetsrisker kring enskilda SD-medarbetare bör hanteras av Säpo, men V:s politik skulle ge dem skadlig vetomakt.", "trump": "Sverige har gjort ett fantastiskt jobb med att bygga upp sitt försvar och samarbeta med oss, tro mig! Men tänk att vissa tror att några gamla Facebook-inlägg från en SD-sekreterare är problemet. Vakna upp! Det riktiga säkerhetshotet är ju det radikala vänsterpartiet som vill lämna Nato och riva upp vårt stora, vackra militäravtal. Total katastrof!", "stalin": "Sverige pratar om säkerhet, men darrar som löv under kapitalismens ok. De oroar sig för några obetydliga byråkratiska sekreterare på internet medan de blint kastar sig i armarna på Natos krigshetsare. Om de verkligen vill tala om ordning borde de rensa ut de vacklande elementen och ställa alla dessa splittrade politiska fraktioner inför rätta!"}, "date": "7 september, 16:00", "url": "https://www.gp.se/ledare/v-ar-ett-storre-bekymmer-an-sd-for-sveriges-sakerhet.cb0a71b4-0251-47c4-9c10-20b8fc6fd37d", "imageUrl": "https://www.gp.se/images/article/cb0a71b4-0251-47c4-9c10-20b8fc6fd37d/images/13eUcj_1uWHOhUrSfs6YMBYEVKi4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tyska myndigheter: 21 bomber hittade nära elnätet", "summaries": {"normal": "Tyska myndigheter har hittat 21 hemmagjorda bomber nära elnätet i Sachsen under en utredning om sabotage. En 48-årig man som tagit på sig ansvaret i brev till media och myndigheter misstänks vara gärningsmannen. Han kopplas till klimatextremism. Mannen är efterlyst internationellt men fortfarande på fri fot. Händelserna har väckt oro för infrastrukturell sårbarhet.", "trump": "Titta på det här, folk. Tyskarna hittar bomber överallt vid sina elledningar och jagar en galen 48-åring som skriver brev som en miljöextremistisk clown. Biden lämnade världen i kaos, nu spränger gröna galningar kraftverk. De där woke-aktivisterna är farligare än de ser ut, tro mig. Vi behöver starka ledare, inte dessa vansinniga miljöterrorister.", "stalin": "Kamrater, se hur de dekadenta miljöfanatikerna saboterar elektriciteten som folket behöver. Jag betraktar från historien och ler mörkt åt dessa giriga hyenor som gömmer bomber och skriver bekännelser. Deras paranoia är en svaghet vi kan utnyttja. Rensa ut alla sådana fiender till ordningen innan de förvandlar samhället till ruiner. Statens säkerhet kräver det."}, "date": "7 september, 20:54", "url": "https://www.svt.se/nyheter/utrikes/tyska-myndigheter-21-bomber-hittade-nara-elnatet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.69/0.46/4346c94ce3b0c07a512d6e49622df8499480491eb63c74cd9e3e6796dd1ded62"}, {"type": "image-right", "heading": "Statsministern om V:s kandidatskandal: ”En röta som går djupt”", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Vänsterpartiet efter att åtta kandidater petats för spridning av antisemitiskt material och hyllningar till Hamas. Han kallar det en djup röta i vänsterleden och kräver att Socialdemokraterna tar ställning innan valet. S partisekreterare Tobias Baudin säger att V har ett stort internt arbete att göra.", "trump": "Titta på det här! Vänsterpartiet är fulla av antisemiter och terrorälskare som hyllar Hamas och Putin. Den röda rötan går så djupt att till och med den sömniga Magdalena Andersson inte kan ducka längre. De vill ha en regering med radikala vänsterextremister. Det blir en katastrof, folk! Rösta smart på söndag.", "stalin": "Kamrater, se hur den dekadenta vänstern ruttnar inifrån som en förrädisk parasit. Jag betraktar med avsmak hur dessa opportunister sprider antisemitiskt gift och sedan febrilt försöker dölja spåren. Socialdemokraterna vacklar som ynkliga revisionister. Endast en järnhand kan rensa ut sådana element innan de förgiftar hela kollektivet."}, "date": "7 september, 15:41", "url": "https://www.tv4.se/artikel/7z1v0pmhudhsBH1EPtzUg1/statsministern-om-v-s-kandidatskandal-en-roeta-som-gar-djupt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F99GIJ3zNtg9VkTOu1LTUb%2Fb2691c5f937e5a23da46520582f623c7%2F07-kristersson-webb.jpg&width=120"}, {"type": "image-right", "heading": "AFD:s framgång är borgerlighetens misslyckande", "summaries": {"normal": "AfD:s framgång med nära 44 procent i Sachsen-Anhalt ses som en konsekvens av borgerlighetens misslyckande. Volkswagen har beslutat om omfattande nedskärningar som drabbar 100 000 anställda, vilket sprider sig i bilindustrin. Den tyska modellen med kompromisser mellan löntagare och ägare har misslyckats, särskilt genom envist fasthållande vid fossilbilar. Detta skapar utrymme för högernationalism och invandringskritik.", "trump": "Titta på det här, det är patetiskt. Den tyska borgerligheten har totalt misslyckats och nu får de radikala vänsternationalisterna nästan hälften av rösterna i en fattig delstat. Volkswagen sparkar ut 100 000 arbetare medan de stora bolagen gömmer sig bakom gröna lögner. Den dekadenta EU-eliten och deras identitetspolitiska galningar har kört sönder allt. Amerika först, vi lär oss av deras misstag.", "stalin": "Kamrater, se hur de profitthungriga hyenorna inom den tyska bilindustrin likviderar hundratusen arbetstillfällen medan de själva simmar i vinster. Den så kallade tyska modellen har blottat sig som en tom skal av klassförräderi. När socialdemokratin och facken kryper undan vänder folket sig till högernationalismens falska löften. Det är en varning till alla som tror att kompromisser med klassfienden någonsin kan lyckas. Vi ler i skuggorna."}, "date": "7 september, 14:00", "url": "https://www.etc.se/ledare/afd-s-framgaang-aer-borgerlighetens-misslyckande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "Merz efter AFD-segern: \"CDU skakas i sina grundvalar\"", "summaries": {"normal": "Friedrich Merz uttrycker stark oro efter att AfD vann valet i Sachsen-Anhalt med 43,8 procent. Han beskriver resultatet som en grundläggande kris för CDU och varnar för en högerradikal delstatsregering. Partiet håller krismöte i Berlin. Merz avvisar samarbete med AfD och uppmanar till intern enighet.", "trump": "Titta på det här, det är en total katastrof för de svaga europeiska globalisterna. Den sanna folkrörelsen AfD krossar Merkels gamla CDU-lakejer i Sachsen-Anhalt. Merz gråter som en förlorare och kallar det tektonisk omskakning. Vakna upp, Europa! Sluta med era woke-kvoter och öppna gränser innan det är för sent. Fantastiskt resultat egentligen.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna skälver när folket reser sig. Denna Merz erkänner att hans parti skakas i grundvalarna av en kraft som han kallar högerradikal. Vi ler mörkt från historien. Snart kommer utrensning av alla dessa penninggalna hyenor som låtsas styra medan arbetarna vaknar. Inga kompromisser med folkets fiender."}, "date": "7 september, 16:01", "url": "https://www.friatider.se/merz-efter-afd-segern-cdu-skakas-i-sina-grundvalar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/2024-08-21_event_cdu_wahlkampf_mit_friedrich_merz_in_erfurt_2024_stp_3070_by_stepro.jpg"}, {"type": "image-right", "heading": "Byggnads kräver en halv miljon i ny rättstvist", "summaries": {"normal": "Byggnads stämmer Måleriföretagen på en halv miljon kronor i en ny rättstvist. Fackförbundet anser att arbetsgivarnas tolkning av Måleriavtalet hotar medlemmarnas försäkringar och pensioner. Konflikten gäller bland annat målning av köksinredning och påstådda påtryckningar mot försäkringsadministratören Fora samt företag med hängavtal. Målet prövas parallellt med en process i Arbetsdomstolen.", "trump": "Folk, ni skulle inte tro det, men dessa svenska målare och deras fackliga gangsters stämmer nu arbetsgivarna på en halv miljon. Det är typiskt för de dekadenta fackpajerna som hatar riktiga jobb och verkliga avtal. De vill ha mer pension och försäkring medan de målar köksskåp. Patetiskt! Under min förra mandatperiod fixade vi bättre deals än så här.", "stalin": "Kamrater, se hur de giriga profitthylarna försöker kringgå kollektivavtalen och underminera arbetarnas försäkringar. Jag betraktar detta som ett typiskt sabotage från klassfienderna. Sådana handlingar förtjänar ingen pardon. Vi måste rensa ut alla som vägrar erkänna arbetarkollektivets rättigheter. Deras paranoia över en köksmålning avslöjar deras sanna dekadenta natur."}, "date": "7 september, 17:36", "url": "https://www.di.se/nyheter/byggnads-kraver-en-halv-miljon-i-ny-rattstvist", "imageUrl": "https://static.bonniernews.se/ba/b9f5691c-d7b1-438f-8c46-cb6353d0a2e2.jpeg?crop=7189%2C4044%2Cx0%2Cy384&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Fick sparken via sms efter en månads jobb", "summaries": {"normal": "En butikschef i norra Sverige fick sparken via sms efter bara en och en halv månads arbete. Domstolen dömde arbetsgivaren att betala 348 000 kronor i skadestånd, efterlön, semesterersättning och mellanskillnad i lön. Uppsägningen ansågs felaktig eftersom den skedde under sjukdom utan varsel eller korrekt information.", "trump": "Folk, ni skulle inte tro det, men den här usla lilla butiken sparkade sin chef med ett ynkligt sms efter bara några veckor. Typiskt för de giriga hyenorna som styr våra affärer. Domstolen gav honom 348 000 kronor. Bra! Vi behöver starka ledare, inte dessa svaga, woke-drivna misslyckanden som gömmer sig bakom sms istället för att vara män.", "stalin": "Kamrater, se hur de parasiterande kapitalisterna behandlar en arbetande chef som drabbats av sjukdom. Ett sms och ut med honom, utan varsel eller rättvisa. Jag säger: sådana giriga hyenor förtjänar utrensning ur samhället. Domstolen ger honom 348 000 kronor. Rättvist. Vi ska alltid skydda arbetarna mot dessa dekadenta klassförrädare."}, "date": "7 september, 11:35", "url": "https://arbetet.se/2026/09/07/fick-sparken-i-sms-efter-en-manads-jobb-far-348-000-kronor", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04084403/sms.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Halva Sveriges kärnkraft ur drift – turbinfel i Forsmark", "summaries": {"normal": "Ett fel i en turbin vid Forsmarks kärnkraftverk tog under natten drygt 700 megawatt ur produktion. Tre reaktorer var redan avställda för revision och en av de återstående var nedreglerad. Kärnkraftsproduktionen låg vid lunchtid på drygt 3 000 av 7 050 megawatt. Elförsörjningen bedöms ändå som stabil.", "trump": "Folk, ni skulle inte tro det! De här inkompetenta energiförstörarna i Sverige har kraschat en turbin och slagit ut 700 megawatt kärnkraft precis när kylan kommer. Biden skulle ha älskat detta. Det är en total katastrof, den värsta jag sett, men jag fixar alltid elen – tro mig!", "stalin": "Ännu ett bevis på att de kapitalistiska revisionisterna och deras saboterande element inte kan garantera folkets energibehov. Jag ser hur de västerländska parasiterna fumlar med sina reaktorer medan folket fryser. Sådana fiender till kollektivet förtjänar att rensas ut med järnhand. Partiet ler i mörkret."}, "date": "7 september, 14:20", "url": "https://www.dagensps.se/teknik/energi/halva-sveriges-karnkraft-ur-drift-turbinfel-i-forsmark", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/dagens-ps-1-6.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "DN/Ipsos: Liberalerna klättrar mot spärren", "summaries": {"normal": "En ny DN/Ipsos-mätning visar att Liberalerna klättrar till 3,5 procent och närmar sig riksdagsspärren, medan Socialdemokraterna tappar för nionde mätningen i rad till 27,1 procent – sin sämsta notering sedan hösten 2021. Trots att oppositionen har ett tydligt försprång och att optimismen i samhället ökar, gynnar den nya stämningen till viss del Tidöpartierna.", "trump": "Sveriges radikala vänster är i total panik, det är helt oacceptabelt! Socialdemokraterna rasar och gör sitt sämsta valresultat någonsin, total katastrof för dem! Men tittar man på Liberalerna, fantastiska människor som kommer krypande tillbaka från Moderaterna, de klättrar mot spärren på tre komma fem procent! Oanad optimism i landet, folk älskar det!", "stalin": "Det svenska proletariatets självutnämnda företrädare, Socialdemokraterna, sjunker likt ett blysänke i en förorenad flod för nionde mätningen i rad. En historisk kollaps! Samtidigt försöker små borgerliga lakejer som Liberalerna febrilt klättra över fyraprocentsspärren likt desertörer som klättrar över ett fängelsestängsel. Statsapparaten noterar allt med största misstänksamhet."}, "date": "7 september, 18:47", "url": "https://bulletin.nu/dn-ipsos-liberalerna-klattrar-mot-sparren"}, {"type": "image-right", "heading": "Valmyndigheten: Upp till 500 förtidsröster kan ha gått förlorade", "summaries": {"normal": "Valmyndigheten tonar ner felet med förtidsröster; maximalt 500 väljare bedöms drabbade i stället för 4 000. Eftersom exakta personer inte kan identifieras uppmanas berörda att rösta på nytt på valdagen i rätt lokal. Valhemligheten är intakt och tekniska felet är åtgärdat, men SD anser att händelsen är mycket allvarlig för förtroendet för valsystemet.", "trump": "Sorgligt! Sverige har ett totalt riggat och inkompetent valsystem, folk skrattar åt det! De tappar bort rösterna, helt otroligt. Först säger de tusentals, sen femhundra – fake news-siffror! Ingen aning om vem som röstade. Under min ledning skulle detta aldrig hända, vi skulle ha pappersröster och rösträkning på fem minuter. Totalt fiasko, fixxa ert land!", "stalin": "Ett bedrövligt slarv med röstsedlarna i de svenska röstningslokalerna. När vi administrerar val finns det inga 'bortappade' femhundra väljare; en väljare som försvinner är ett administrativt misslyckande som omedelbart åtgärdas genom lämplig omplacering till Sibirien. Det svenska systemet saknar järnhård disciplin. Vi kommer att övervaka deras nästa val med stor misstänksamhet."}, "date": "7 september, 16:51", "url": "https://samnytt.se/valmyndigheten-upp-till-500-fortidsroster-kan-ha-gatt-forlorade", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/07135952/valmyndigheten-rosta-sedlar.jpg"}, {"type": "image-full", "heading": "Förklaringen: Därför fick flera Telia-kunder fick inget larm", "summaries": {"normal": "Vid testet av det nya mobillarmet SE-Alert på måndagen nådde inte varningen alla Telia-kunder i Stockholms och Gotlands län. Problemet berodde på en teckenbegränsning i Telias system som hindrade meddelandet. Övriga operatörer klarade testet. Myndigheten för civilt försvar ska analysera resultatet inför nästa nationella test 2026.", "trump": "Folk, det här är en total katastrof! Miljontals svenskar skulle få ett livsviktigt larm men de korkade Telia-byråkraterna med sina tekniska begränsningar saboterade allt. Typiskt för de inkompetenta systemen som de globalistiska töntarna bygger. Jag fixade mycket bättre saker under min tid, tro mig. Nästa gång blir det perfekt eller så stänger vi butiken.", "stalin": "Kamrater, detta test avslöjar de dekadenta klassförrädarnas svaghet. Ett enkelt meddelande om hot mot folket stoppas av giriga hyenors tekniska hinder. Jag ser fiendens hand i varje misslyckande. Vi måste rensa ut alla sådana sabotage mot kollektivets säkerhet. Erfarenheterna ska användas för att stärka statens järnhand inför kommande prövningar."}, "date": "7 september, 21:03", "url": "https://nyheter24.se/nyheter/inrikes/1511190-forklaringen-darfor-fick-flera-telia-kunder-fick-inget-larm", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/ad327f4b04b004a30200000000b004a302/2026/09/07/2389832/forklaring-larm-telia.png"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-right", "heading": "Nya larmet nådde inte Teliakunder. ”Nu håller vi på att analysera”", "summaries": {"normal": "Ett test av det nya varningssystemet SE-Alert genomfördes i dag i Stockholms och Gotlands län. Larmet nådde dock inte alla Telias kunder. SOS Alarm och Telia bekräftar felet och analyserar nu vad som gick fel. Systemet ska kunna varna vid olyckor, utsläpp och andra kriser utan att kräva app eller registrering. Förberedelserna har pågått i över ett år.", "trump": "De där inkompetenta byråkraterna i Sverige kan inte ens skicka ut ett enkelt larm till folkens telefoner. Patetiskt! Telia och deras woke-kompisar missade halva Stockholm och Gotland. Under min förra mandatperiod byggde vi system som faktiskt fungerade. De svenska administratörerna borde sluta leka med sina identitetspolitiska leksaker och fixa det här innan det blir på riktigt. Sad!", "stalin": "Detta misslyckande avslöjar de giriga hyenornas svaghet. När staten försöker skydda folket mot faror saboteras systemet av odugliga element. Jag ser hur de dekadenta klassförrädarna inom telekommunikationen sviker kollektivet. Vi måste rensa ut alla sabotörer som hindrar effektiv varning till massorna. Endast genom ständig vaksamhet kan vi säkra folkets trygghet mot oväntade hot."}, "date": "7 september, 16:58", "url": "https://www.di.se/nyheter/nya-larmet-nadde-inte-teliakunder", "imageUrl": "https://static.bonniernews.se/ba/481f518d-2fd4-450c-b0d4-be6a510c703f.jpg?crop=8256%2C4644%2Cx0%2Cy430&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-right", "heading": "MP:s ekonomiska politik förskräcker", "summaries": {"normal": "Miljöpartiets ekonomiska politik, som inkluderar höjda skatter, avskaffat karensavdrag, höjt barnbidrag och lagstadgad 35-timmars arbetsvecka, liknar Vänsterpartiets enligt egen talesperson. Kritiker varnar för stora effekter på sysselsättning, BNP och offentliga finanser. Artikeln lyfter riskerna för näringslivet om MP får stort inflytande i en framtida rödgrön regering efter valet 2026.", "trump": "Folk, ni måste se det här! Miljöpartiets galna vänsterextremister vill förstöra Sverige med sina korkade skatter, miljardärsskatter och 35-timmarsvecka. Det är ett totalt katastrof-recept som gör alla fattiga och lata. Precis som Biden gjorde med Amerika – ren socialism! Men jag fixade det, och ni kommer också att fixa det. Fantastiskt!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom Miljöpartiet öppet bekänner sin närhet till de verkliga folkfienderna. Deras planer på skatteplundring och lathetens lagstiftning är en direkt attack mot produktionen. Jag ler mörkt från historien: sådana parasiter leder oundvikligen till utrensning av folkets tillgångar och ett strukturellt kaos som bara kan sluta i ruin. Vaksamhet!"}, "date": "7 september, 16:52", "url": "https://www.di.se/ledare/mps-ekonomiska-politik-forskracker", "imageUrl": "https://static.bonniernews.se/ba/75e37077-f0b3-41ca-b681-845e8aa7dbd3.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Tungt för S i opinionen – Mona Sahlin: Upp med ideologiska fighter", "summaries": {"normal": "I Politikbyrån diskuteras Socialdemokraternas opinionsfall. Gästerna Annika Strandhäll, Jan Emanuel, Viktor Barth-Kron och Mona Sahlin medverkar. Sahlin beskriver 2010 års val som fruktansvärt tungt trots närhet till regeringsmakt. Strandhäll skyller tappet på högerns mobilisering och attacker mot partiet och Magdalena Andersson. Sahlin saknar ideologiska diskussioner och vill fokusera på sakfrågor.", "trump": "Titta på de här förlorande socialisterna som rasar i opinionsmätningarna. Högern krossar dem fullständigt, precis som jag gjorde med Sleepy Joe. Mona Sahlin gnäller om hur tungt det kändes – patetiskt. De borde sluta med sin galna kvotergrej och identitetspolitik och börja vinna på riktiga frågor istället för att gömma sig bakom sina röda linjer. En total katastrof för vänstern!", "stalin": "Se hur dessa dekadenta klassförrädare inom socialdemokratin faller sönder i valrörelsen. De grälar om regeringskonstellationer istället för att föra ideologisk kamp. Jag säger: rensa ut de svaga elementen som vägrar gå i skyttegravarna. En sann revolutionär rörelse kräver hårda fajter mot folkförtryckarna, inte ynkligt tissel om opinionsras. Fienden skrattar åt er svaghet."}, "date": "7 september, 19:58", "url": "https://www.svt.se/nyheter/inrikes/politikbyran-sander-live-hang-med-i-chatten", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.33/61750ee98f81ea21d1e80d1c4e1fd1ac510fcf36553dc8caaaba354a0008b646"}, {"type": "image-right", "heading": "Ceuta-invandrare anklagas för att ha slagit ihjäl delfinunge", "summaries": {"normal": "En grupp illegala invandrare i spanska Ceuta anklagas för att ha slagit ihjäl en flasknosdelfinunge på en strand. En miljöorganisation har polisanmält händelsen och kräver utredning. Filmer visar hur de håller upp den döda ungen som en trofé och försöker dölja blodspår. Delfinen var skyddad och händelsen har väckt stor vrede.", "trump": "Titta på det här, folk. De här illegala invandrarna i Ceuta slår ihjäl en söt liten delfinunge med en pinne och håller upp den som en trofé. Rena galningar! Under Biden släppte vi in miljontals sådana här miljöterrorister. Nu fixar vi det. Amerika älskar djur, inte dessa blodtörstiga troféjägare från helvetet.", "stalin": "Kamrater, se hur de giriga hyenorna från de södra barbariets stränder mördar en oskyldig delfinunge med primitiv pinne. Detta dekadenta beteende avslöjar imperialismens råa ansikte även i små handlingar. Vi kräver omedelbar utrensning av sådana element. Sovjetisk rättvisa skulle ha likviderat dem redan i gryningen."}, "date": "7 september, 14:58", "url": "https://www.friatider.se/ceuta-invandrare-anklagas-att-ha-slagit-ihjal-delfinunge", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-837.jpg?itok=vY4djvvU"}, {"type": "image-right", "heading": "Lärare uppmanade lågstadieelever att be islamisk bön: ”Allahu akbar”", "summaries": {"normal": "En lärare på Nyhamnsskolan i Höganäs uppmanade tredjeårselever att utföra en islamisk bön under lektionstid, inklusive frasen ”Allahu akbar”. Föräldrar anmälde händelsen, men Skolinspektionen har valt att inte utreda den vidare. Rektorn säger att syftet inte var att påverka elevernas tro. Beslutet kritiseras av en expert i konstitutionell rätt.", "trump": "Kan ni tro det? I Sverige tvingar de små barn att knäböja och ropa ”Allahu akbar” mitt i lektionen. Skolinspektionen, de där patetiska woke-byråkraterna, tittar bort och gör ingenting. Totalt vansinne! Under Biden blev hela väst en lekplats för radikal islam och identitetspolitik. Men nu är jag tillbaka, och den här galenskapen kommer att få ett abrupt slut.", "stalin": "Kamrater, se hur de dekadenta religionshyenorna smyger in sin propaganda i våra barns skolor. Jag betraktar med djup misstro hur staten vägrar utreda detta uppenbara brott mot folkets sekulära enhet. En sådan svaghet luktar förräderi. Vi måste rensa ut alla som låter främmande gudar underminera arbetarklassens fosterland. Detta är en varning till alla klassförrädare."}, "date": "7 september, 19:02", "url": "https://riks.se/nyheter/larare-uppmanade-lagstadieelever-att-be-islamisk-bon", "imageUrl": "https://admin.riks.se/uploads/medium_Kopia_av_Copy_of_Copy_of_Copy_of_Riks_varumaerkesmall_732fc70f98.png"}, {"type": "image-right", "heading": "Markus Johansson-Martis: Bra att Strömmer flörtar med C", "summaries": {"normal": "Moderaternas justitieminister Strömmer accepterar alla Centerpartiets krav för att få stöd till en borgerlig regering. Kraven inkluderar sänkta skatter för småföretag, satsningar på grön industri, stärkt ungdomspsykiatri, polisgaranti på landsbygden och stöd till bönder. Artikeln ifrågasätter om C verkligen prioriterar inflytande eller bara vill känna sig bra.", "trump": "De här svenska politikerna är totala losers. Strömmer gör ett lysande drag och accepterar alla krav från det patetiska mellanmjölkspartiet C. De gröna globalisterna och de woke småborgarna vill bara känna sig fina i magen medan de flyr från verkligheten. Patetiskt! Jag skulle aldrig ge efter för sådana svaga identitetspolitiker. Amerika först, alltid.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna dansar sin fåniga vals. Jag betraktar med förakt hur de profitthungriga borgarbrackorna gnuggar geniknölarna och lovar allt för att vinna stöd från det förvirrade centristiska träsket. Deras paranoia om inflytande är löjlig. En sann utrensning av sådana opportunister vore på sin plats. Revolutionen skrattar åt er svaghet."}, "date": "7 september, 19:01", "url": "https://riks.se/opinion/markus-johansson-martis-bra-att-strommer-flortar-med-c", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_89_e81bced61e.jpg"}, {"type": "image-right", "heading": "Scanias Pride-lastbil ställdes mitt framför kristen demonstration", "summaries": {"normal": "En Scania-lastbil placerades framför en kristen demonstrationsgrupp som sjöng lovsång under Södertälje Pride. Företaget uppger att det gjordes för att skapa lugn och arbetsro för ungdomar i ett tält. Kritiker ser det som en blockad. Händelsen har väckt starka reaktioner i sociala medier. Scania-ledningen meddelar att de behöver tid för att kommentera.", "trump": "Folk, det här är ett fullständigt skämt. Den där woke-pridecirkusen i Södertälje blockerades av en lastbil – och chefen kallar det ”lugnt och skönt”. Patetiska kristna sjunger psalmer medan de radikala HBTQ-aktivisterna skriker. Scania borde skämmas, men de är för fega. Biden-era svaghet har spridit sig till Sverige. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga prideparaden tvingas tystas av en lastbil. Jag ler i graven. Dessa profitthungriga hyenor och deras falska tolerans avslöjar sig själva. Ungdomarna fick arbetsro – en tillfällig seger mot den moraliska förruttnelsen. Vi skulle ha rensat ut hela spektaklet permanent. Paranoia breder ut sig bland fienderna."}, "date": "7 september, 18:59", "url": "https://riks.se/nyheter/scania-lastbil-blockerade-kristen-lovsang-under-sodertalje-pride", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_7_2026_11_16_50_AM_852c111911.png"}, {"type": "image-full", "heading": "Vänsterpolitiker tog miljonutdelningar – ur bolag de vill förbjuda", "summaries": {"normal": "Expressen avslöjar att 229 kandidater från Vänsterpartiet, Socialdemokraterna och Miljöpartiet är involverade i välfärdsbolag som partierna vill förbjuda vinstuttag i. Bland dem finns en vänsterpartist som delat ut tio miljoner kronor och firat med Porsche. Artikeln kritiserar partierna för hyckleri och ifrågasätter trovärdigheten i deras socialistiska politik.", "trump": "Titta på det här! De galna vänstersocialisterna skriker om att stoppa vinsterna och kalla folk för Porsche-kapitalister, men deras egna kandidater har dragit ut miljontals kronor ur precis samma bolag. Nooshi och hennes gäng är de värsta hycklarna – Fake Left! De vill ha era skattepengar men behålla Porschen själva. Patetiskt!", "stalin": "Se hur dessa dekadenta revisonister inom vänstern predikar kollektivets renhet medan de själva suger ut miljoner ur folkets välfärd. Deras hyckleri är en fiende till revolutionen, en parasit som förvrider partilinjen. Jag varnar: sådana element måste rensas ut innan de förgiftar hela kollektivet. Folkets dom skall bli hård och rättvis."}, "date": "4 september, 07:18", "url": "https://samtiden.nu/2026/09/vansterpolitiker-tog-miljonutdelningar-ur-bolag-de-vill-forbjuda", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/phonto-1280x720.jpeg"}, {"type": "image-right", "heading": "Busch och Dadgostar drabbar samman i partiledardebatt", "summaries": {"normal": "Under en partiledardebatt i Expressen drabbade Ebba Busch (KD) och Nooshi Dadgostar (V) samman kring ett eventuellt förbud mot burka och niqab. Busch argumenterade för ett förbud med koppling till islamism och hedersförtryck, medan Dadgostar anklagade henne för bristande empati i utvisningsfrågor. Debatten intensifierades med ömsesidiga anklagelser om främlingsfientlighet, islamism och antisemitism.", "trump": "Sverige har stora problem, verkligen sorgligt! Deras politiker skriker på debatter om slöjor och utvisningar. Vänsterkvinnan grät ut, medan Ebba, en tuff person, sätter hårt mot hårt mot radikala krafter. De bråkar om Hamas och extremism. Mycket falska nyheter där borta. Om jag hade styrt debatten hade allt lösts på fem minuter, tro mig!", "stalin": "Dessa så kallade partiledare leker revolution i sina tidningsstudior medan partiapparaten vacklar. De grälar om tygstycken och utvisningar likt bortskämda bourgeoisiegosedjur. Vänstern döljer sina avvikelement, kristdemokraterna vädrar reaktionär paranoia. Om Folkets kommissariat hade hand om debatten skulle de omedelbart skickas till produktiva anstalter för obligatorisk ideologisk skolning. Inget slarv tillåts i staten!"}, "date": "7 september, 18:01", "url": "https://bulletin.nu/busch-och-dadgostar-drabbar-samman-i-partiledardebatt", "imageUrl": "https://cdn.bulletin.nu/articles/fe376107-0325-403c-8266-8ecfe1389886/preview.jpg?t=1788785633000"}, {"type": "image-right", "heading": "”SD svek byggnadsarbetarna – nu ska de bort”", "summaries": {"normal": "Byggnads förbundsordförande Kim Söderström kritiserar SD-regeringen för att ha svikit byggnadsarbetarna genom slopat investeringsstöd, försämrad a-kassa och brutna löften om karensavdraget. Han beskriver högerregeringens tid som en förlust för arbetare och välfärd samt uppmanar till att rösta fram en ny politik med Socialdemokraterna i spetsen.", "trump": "De här svenska socialistiska byggjobbarna har blivit totalt lurade av de fega SD-typerna som lovade guld och gröna skogar. Patetiskt! Slopat stöd, sämre a-kassa och glömda löften – klassiskt etablissemangssvek. De superrika vinner medan vanliga killar förlorar. Rösta bort de misslyckade Tidö-failurerna nu, det blir en katastrof annars, tro mig!", "stalin": "Jag betraktar med avsky hur dessa profitthungriga klassförrädare inom SD-regeringen har dolt sina sanna avsikter och förvägrat arbetarna både stöd och trygghet. Deras löftesbrott och urholkade välfärd visar imperialismens mask. Vi måste rensa ut dessa folkförtryckare och återupprätta en sann folkets linje mot dekadensen. Röster höjs, fiender faller."}, "date": "7 september, 09:51", "url": "https://arbetet.se/2026/09/07/sd-svek-byggnadsarbetarna-nu-ska-de-bort", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/07095046/75f38b6f-c3a6-43d6-9d3d-b090947c7a2b.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Kö till kärnkraftsmiljarderna – stödet räcker inte till alla", "summaries": {"normal": "Sex svenska kärnkraftsprojekt söker nu statliga miljarder, men stödet på 5 000 MW räcker endast till en del av dem. Finansmarknadsminister Niklas Wykman bekräftar att potten inte kommer att utökas. Istället kommer regeringen att prioritera elsystemets nytta, genomförbarhet och kostnad för skattebetalarna. Flera bolag, som Blykalla och Studsvik, betonar att statliga lån och elprisgarantier är helt avgörande för att projekten ska bli av.", "trump": "Sverige vill bygga kärnkraft, men de gör det helt fel! De har sex enorma projekt, riktigt vackra reaktorer, men stödet räcker bara till några få. Otroligt svagt! Själv bygger jag alltid bäst, störst och billigast utan några byråkratiska EU-godkännanden. De svenska ministrarna borde ringa mig. Jag skulle fixa det på en vecka, storartat och magnifikt!", "stalin": "Dessa svenska reaktorer är fascinerande men ineffektiva. Sex grupper av bourgeoisornas entreprenörer tigger om statens nådebröd, men statens kistor är inte bottenlösa. Vi ska nog granska dessa 'Blykalla' och 'Studsvik' noggrant. Den som inte levererar nödvändig effekt inom utsatt tid kommer omedelbart att omplaceras till ett betydligt kallare och mindre glättigt kollektivprojekt i Sibirien. Så fungerar effektiv planhushållning!"}, "date": "7 september, 10:50", "url": "https://www.affarsvarlden.se/artikel/ko-till-karnkraftsmiljarderna-stodet-racker-inte-till-alla", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/Karnkraft-900x600.jpg"}, {"type": "image-right", "heading": "Augusti slog rekord – varmast någonsin", "summaries": {"normal": "Augusti 2026 blev den varmaste augustimånaden som uppmätts globalt, enligt preliminära data från Copernicus. Det tidigare rekordet från 2023 och 2024 slogs med omkring 0,14 grader. Meteorologer pekar på människors utsläpp av växthusgaser som den långsiktigt viktigaste orsaken, tillsammans med naturliga variationer som El Niño och höga havstemperaturer. Nya värmerekord har även mätts upp i länder som Spanien, Frankrike, Albanien, Kroatien och Algeriet.", "trump": "De falska media och klimatalarmisterna skriker om rekordvarm augusti, men låt oss vara ärliga, det är bara väder! De skyller på utsläpp, medan jag säger att USA:s energisektor är starkare än någonsin. Våra termometrar fungerar perfekt, till skillnad från deras fejkade databaser. Spanien och Frankrike kan ha det svettigt, men vi fokuserar på att vinna och göra Amerika varmt på rätt sätt!", "stalin": "Dessa så kallade värmerekord i Spanien och Frankrike är ett patetiskt försök av bourgeoisien att avleda uppmärksamheten från deras egna systemkollapser. Naturen själv protesterar mot kapitalismens misslyckanden. Meteorologerna talar om global uppvärmning, men jag säger att allt motstånd mot det oundvikliga kollektiva klimatet kommer att krossas med samma järnhand som alla andra kontrarevolutionära element. Vädret lyder under staten."}, "date": "7 september, 20:20", "url": "https://www.aftonbladet.se/nyheter/klimat/a/q6x84m/varmaste-augusti-nagonsin", "imageUrl": "https://akamai.vgc.no/v2/images/7c1267c4-fb52-32aa-b45d-aa82969af470?fit=crop&format=auto&w=1080&s=4e7a30a9a4b632a9ad77b611dd56ce088b5320a7"}, {"type": "text", "heading": "Sorg efter bröllopsattack: ”Fruktansvärd syn”", "summaries": {"normal": "Invånare i Kuhestak i södra Iran beskriver det som ett mirakel att inte fler omkom när en projektil slog ned vid ett bröllop under ett amerikanskt angrepp. Fyra personer dog och över 60 skadades. USA utreder händelsen. Analyser visar att vapenresterna kommer från amerikanska precisionsstyrda glidbomber. Många offer var barn.", "trump": "Det här är en total katastrof, folk. Mina fantastiska militärer träffade ett bröllop i Iran av misstag? Patetiskt! Under Biden blev allt en enda röra, nu fixar jag det. De radikala islamisterna och deras vänstervridna lakejer skyller på oss igen. Vi utreder, vi vinner stort och de förlorar som alltid. Sad!", "stalin": "Kamrater, se hur de imperialistiska krigshejarna slår ned på oskyldiga bröllopsgäster med sina glidbomber. Jag föraktar dessa blodtörstiga bombhyenor som kallar sig befriare. Vi vet att deras dekadenta aggression bara stärker folkets motstånd. En fruktansvärd syn, men fiendens svaghet avslöjas i varje spillra. Ut med dem!"}, "date": "7 september, 20:19", "url": "https://nyheter24.se/nyheter/utrikes/1511187-sorg-efter-brollopsattack-fruktansvard-syn"}, {"type": "image-full", "heading": "Moderata ministern kritiserade SVT – nu skjuter SVT upp intervjun", "summaries": {"normal": "SVT har skjutit upp publiceringen av en intervju med civilförsvarsminister Carl-Oskar Bohlin (M) till efter valet. Bohlin har kritiserat SVT för tesdrivna frågor och publicerat hela intervjun på Youtube. SVT:s ansvariga utgivare Karin Ekman säger att de aldrig stressar fram stark journalistik. Beslutet har väckt uppmärksamhet.", "trump": "De här SVT-fuskjournalisterna är rena rama katastrofen, folk. Tesdrivna frågor mot en hederlig minister? Totalt bottennapp. De gömmer intervjun som fega råttor tills valet är över. Fake news-medier som alltid, precis som under Biden-eran. Patetiska! Jag skulle ha krossat dem direkt.", "stalin": "Se hur de dekadenta klassförrädarna i public service darrar inför sann kritik. De skjuter upp intervjun som fega byråkrater för att skydda sin agenda. Jag ler i graven åt deras paranoia. Snart kommer utrensning av alla sådana folkförtryckande lögnspridare som vågar tysta arbetarkamraternas röst."}, "date": "7 september, 18:31", "url": "https://riks.se/nyheter/svt-skjuter-upp-publicering-av-intervju-med-carl-oskar-bohlin", "imageUrl": "https://admin.riks.se/uploads/beca860198d19c51552d6a8edd45cbb3aacddcccdd7f8f23cd03ce2c72e082b3_f32b37e073.avif"}, {"type": "image-right", "heading": "Vänstern behöver mer än baristor", "summaries": {"normal": "Artikeln diskuterar vänsterns behov av att organisera både prekariserade storstadsarbetare och landsbygdens arbetarklass. Författaren varnar för att en rörelse som överger landsbygden åt högern aldrig kan förändra samhället. Han lyfter arbetarnas uppgivenhet och betonar vikten av starka band mellan partier, fackföreningar och folkrörelser för att skapa bestående samhällsförbättringar.", "trump": "De där vänstervridena med sina rosa hår och lattemuggskrig förlorar arbetarna till oss riktiga patrioter. Baristorna i sina stora städer? Patetiska. Landsbygden vet vad som gäller. Utan oss blir det bara mer dekadent identitetspolitik och ingen hoppfull politik för vanliga människor. Vi vinner stort, de förlorar landet.", "stalin": "Kamrater, denna dekadenta klassförrädare har rätt i att uppgivenhet driver arbetarna mot högern. Jag ser hur profitthungriga parasiter och deras politiska lakejer överger landsbygden. En sann arbetarrörelse måste ingjuta hopp och rensa ut svikare. Utan järnhård organisation och folklig mobilisering kommer ingen seger. Fienden ler i skuggorna."}, "date": "2 september, 10:55", "url": "https://www.flamman.se/vanstern-behover-mer-an-baristor", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/starbucks-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Thunberg om valet: Får välja det minst sämsta", "summaries": {"normal": "Inför det svenska riksdagsvalet har klimataktivisten Greta Thunberg redan röstat, men hon saknar ett parti som fullt ut motsvarar vad som krävs för klimatet. Hon beskriver valet som svårt och konstaterar att man får välja det minst sämsta. Vidare riktar hon systemkritik mot att utsläppen ökar samt lyfter sitt engagemang för mänskliga rättigheter.", "trump": "Very sad! Radikala Greta har röstat i Sverige och gnäller på att alla partier är fruktansvärda, helt falskt! Hon säger att man bara väljer det minst sämsta, vilken total katastrof. Hon gillar inte systemet, men jag sa ju det – vindkraftverk och fejkade klimatlagar fungerar bara inte. Skaffa riktig olja, Sverige!", "stalin": "Kamrat Thunberg klagar på det borgerliga valsystemets oduglighet och väljer det minst skadliga alternativet. Det är korrekt insåg vi tidigt: avvikelser från den rätta linjen tolereras ej. De ökade utsläppen visar vad som händer när folk tillåts svika femårsplanerna. Vi noterar hennes namn i aktarkivet för framtida uppfostran."}, "date": "7 september, 17:23", "url": "https://bulletin.nu/thunberg-om-valet-far-valja-det-minst-samsta-2", "imageUrl": "https://cdn.bulletin.nu/articles/9bf100ea-80df-4759-af90-6da36f53d4a9/preview.jpg?t=1788792398000"}, {"type": "image-right", "heading": "Ledare Teodorescu Måwe solkar ner demokratin", "summaries": {"normal": "Europeiska ombudsmannen granskar Europaparlamentets vägran att lämna ut handlingar om Alice Teodorescu Måwes hemliga finansiär. Ledarskribenten Andreas Gustavsson kritiserar att varken parlamentet eller Kristdemokraterna verkar veta vem som betalar och anser att det underminerar demokratin. Väljarna har rätt att få klarhet om eventuella intressekonflikter.", "trump": "De här europeiska clownerna och deras hemliga pengagivare solkar ner hela skådespelet. Alice och hennes KD-kompisar vägrar säga vem som betalar notan för hennes livvakter, typiskt för de riggade eliterna. Jag har suttit i Vita huset både före och efter Sleepy Joe, och tro mig, så här gör man inte i en riktig demokrati. Patetiskt.", "stalin": "Se hur dessa dekadenta klassförrädare gömmer sina hemliga finansiärer bakom byråkratiska dimmor. Jag betraktar med förakt hur de solkar ner den så kallade demokratin med sin ovilja att avslöja källan till pengarna. En sådan komprometterad figur bör likvideras från folkets förtroende. Arbetarna förtjänar sanning, inte borgerliga hemligheter."}, "date": "7 september, 11:28", "url": "https://www.etc.se/ledare/teodorescu-maawe-solkar-ner-demokratin", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-full", "heading": "Förstatligad sjukvård borde strida mot KD:s ideologi", "summaries": {"normal": "Ebba Busch kräver förstatligad sjukvård för att stötta en regim, vilket krönikören Joel Stade menar strider mot KD:s egen subsidiaritetsprincip om lokalt självstyre. Att flytta makten från 21 regioner till staten riskerar att underlätta nedläggningar av landsbygdssjukhus. Statlig styrning garanterar inte kvalitet, och KD bör i stället värna nära beslutsfattande enligt den katolska socialläran.", "trump": "Ebba Busch vill förstatliga hela den svenska sjukvården! Vilket totalt misslyckande till idé. Alla tittar på Storbritanniens katastrofala NHS – köer överallt, fullständig kaos! Vill ni ha det så? Jag har sagt det för absurda summor pengar, statliga jättar som Arbetsförmedlingen fungerar ju uselt. Håll er till lokala sjukhus och gör vård-Sverige great igen istället för centraliserat trams!", "stalin": "Vi noterar att de svenska kristdemokraterna vacklar i sin centraliseringsiver. Att överföra kontrollen över trehundrafemtio tusen vårdarbetare till en enda statlig koloss är ett steg i rätt riktning, men partiets interna gnäll om lokal makt undergräver effektiviteten. En sann byråkratisk maskin kräver absolut lydnad från huvudstaden, inte sentimentalitet kring landsbygdens lasarett. Avdelningscheferna kommer att hållas ansvariga."}, "date": "7 september, 12:58", "url": "https://www.gp.se/ledare/gastkronika/forstatligad-sjukvard-borde-strida-mot-kds-ideologi.9f92c057-d7b6-480c-bffe-850ce286d19f", "imageUrl": "https://www.gp.se/images/article/9f92c057-d7b6-480c-bffe-850ce286d19f/images/1MdKdbziYZOFQOQSfyFtMcqGLy0w-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "EREV: Bensinmotorn gör comeback i miniformat, men intresset har redan svalnat i öst", "summaries": {"normal": "EREV-bilar, elfordon med bensin- eller dieselmotor som räckviddsförlängare, etablerar sig nu på den svenska marknaden. Tekniken har varit populär i Kina men intresset svalnar där. Jämfört med vanliga hybrider driver förbränningsmotorn inte hjulen utan laddar endast batteriet. Flera modeller med över 900 kilometers räckvidd lanseras, men rena elbilar vinner tillbaka mark.", "trump": "Folk, ni måste höra det här – kineserna hade en fantastisk idé med de här EREV-bilarna, bättre än någonsin, räckvidd på över tusen kilometer, totalt oslagbart. Men nu tappar de intresset, precis som Sleepy Joe tappade allt. Våra elbilar är fina men de här hybridmonstren är vinnare, tro mig. Sverige får äntligen bra bilar istället för kinesiska pappersbitar.", "stalin": "Kamrater, dessa förrädiska EREV-fordon är ett dekadent försök att rädda det döende kapitalistiska bilmonstret. I Kina ser vi redan hur det borgerliga intresset svalnar som en förrädare inför folkdomstolen. Rena elbilarna marscherar framåt medan de fega räckviddsförlängarna darrar. Inget kan stoppa proletariatets framfart mot den elektriska segern – sabotörer avslöjas alltid."}, "date": "7 september, 12:10", "url": "https://www.dagensps.se/varlden/erev-bensinmotorn-gor-comeback-i-miniformat-men-intresset-har-redan-svalnat-i-ost", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/leapmotor-c10.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Så mycket högre kan elräkningen bli", "summaries": {"normal": "Sverige står inför en vinter med högre elpriser än föregående år, särskilt i södra delarna. Orsakerna är låga vattennivåer och höga gaspriser i Europa. Prognosen pekar på hundratals kronor dyrare månadskostnader för hushåll. Villaägare i elområde 4 kan räkna med cirka 3 700 kronor i månaden, exklusive nätavgifter och skatter.", "trump": "Sveriges elpriser går rakt upp i taket – en katastrof! De har inte råd med sin egen energi, helt otroligt. Självklart händer det här när man vänder ryggen åt kärnkraften. Det är en total röra, mycket värre än vad de säger. Räkningarna blir enorma, riktigt 'huge'. Man måste ha energi, man måste ha kraft – Sverige behöver ordning, inte mer av det här!", "stalin": "Dessa löjliga elräkningar är ett bevis på folkets ineffektivitet. Att medborgare i söder gnäller över några hundralappar visar bara på en dekadent individualism. Istället för att lita på väder och vind borde staten styra varje kilowatt med järnhand. Planera ekonomin, stäng av de onödiga lamporna och arbeta hårdare för fosterlandet – elbrist är ett svek mot den kollektiva framgången."}, "date": "4 september, 07:56", "url": "https://www.realtid.se/tt-nyhet/sa-mycket-hogre-kan-elrakningen-bli", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/rakna-med-dyr-elvinter-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Boende här varnas – drick inte kranvattnet", "summaries": {"normal": "De senaste proverna visar inga spår av E. coli i Östersunds dricksvatten. Trots det behålls kokningsrekommendationen tills fler analyser är klara. Kommunen betraktar det som en försiktighetsåtgärd. Inga sjukdomsfall har rapporterats. Boende i det berörda området uppmanas fortfarande att koka vattnet innan det används till dryck eller matlagning.", "trump": "Inga E. coli i vattnet, fantastiska nyheter, men de korkade byråkraterna i Östersund vägrar häva kokningsrekommendationen. Typiskt för dessa fegisar och vattenrädda globalister som älskar att plåga folket med onödiga regler. Jag skulle ha fixat det på en timme, tro mig. Rena skandalen!", "stalin": "Ännu en gång visar de dekadenta byråkratiska parasiterna sin rädsla för folket genom att vägra häva kokningsrekommendationen trots rena provsvar. Jag ser deras fega ansikten darra. Vi måste rensa ut alla svaga element som föredrar försiktighet framför handling. Vattnet tillhör folket, inte de giriga kontrollfantasterna."}, "date": "7 september, 19:45", "url": "https://nyheter24.se/nyheter/inrikes/1511143-boende-har-varnas-drick-inte-kranvattnet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/09d5212e04b004a30200000000b004a302/2026/09/07/2389784/dricksvatten-oresund.png"}, {"type": "image-full", "heading": "Debattör polisanmäler Kristersson för förtal", "summaries": {"normal": "Valley Ghanem har polisanmält statsminister Ulf Kristersson för förtal efter att han kallat hennes uttalanden om Liberalernas Simona Mohamsson för flagrant antisemitism. Mohamsson har i sin tur polisanmält Ghanem för uttalanden som ”må hon brännas”, och Säkerhetspolisen utreder nu fallet som misstänkt olaga hot.", "trump": "Sorgligt! Den här radikala personen skickar vidriga hot och gråter sedan ut och stämmer Sveriges premiärminister för förtal när hon åker fast. Helt otroligt svagt! Om jag ledde Sverige skulle sådant här nonsens stoppas omedelbart. Totalt falska nyheter och enormt slöseri med tid. Skärp er, Sverige!", "stalin": "Ett ytterst beklagligt haveri inom den svenska ordningen. Medborgaren Ghanem kastar ur sig mordhot och gråter sedan ut om förtal till den kapitalistiska staten, medan Säkerhetspolisen drar ut i krig mot tangenterna. I Sovjetunionen hade vi rensat upp i detta enfaldiga spektakel på fem röda sekunder!"}, "date": "6 september, 13:14", "url": "https://kvartal.se/nyheter/artiklar/ghanem-polisanmaler-kristersson-for-fortal/cG9zdDoxODUwODY", "imageUrl": "https://images.kvartal.se/2026/09/06fe0aa7-kristerssonmohamsson.webp"}, {"type": "image-right", "heading": "Här kräver vänsterkvinnorna att invandraren ska åka hem", "summaries": {"normal": "Ett klipp från Sergels torg i Stockholm sprids på sociala medier. En ung man med skylten ”Återvandring nu” omringas av vänsterkvinnor som försöker skymma budskapet och uppmanar honom att själv lämna Sverige. Mannen står fast och frågar vem som egentligen är svensk. Reaktionerna på nätet är starka.", "trump": "Titta på de galna vänsterhäxorna på Sergels torg! En kille håller upp en skylt om återvandring och plötsligt flockas hela flocken av hysteriska tokkärringar och skriker att han ska dra. De vill inte höra sanningen. Fake tolerance på högvarv. Vi behöver fler som vågar säga vad alla tänker. Fantastiskt underhållande!", "stalin": "Jag betraktar med förakt hur dessa dekadenta identitetshyaror på Sergels torg försöker tysta en man som vågar ropa på återvandring. Deras skrikande rädsla avslöjar klassförrädarnas svaghet. Kamrater, sådana element måste rensas ut ur folkets medvetande innan de förgiftar hela samhället. Paranoia är deras enda vapen."}, "date": "7 september, 13:18", "url": "https://www.friatider.se/har-kraver-vansterkvinnorna-att-invandraren-ska-aka-hem", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-836.jpg?itok=crO-d4dV"}, {"type": "image-right", "heading": "Inflationen lägre än väntat: \"Höjningsrisk i november ligger kvar\"", "summaries": {"normal": "SCB:s nya inflationssiffror för augusti var lägre än väntat, vilket gör en räntehöjning i september osannolik. Swedbanks chefsekonom Mattias Persson bedömer dock att en höjning i november fortfarande ligger kvar på bordet. Högre fraktkostnader och matpriser bidrar till ett framtida inflationstryck som gör att storbanken räknar med fortsatta räntejusteringar.", "trump": "Inflationen är lägre än vad de falska nyheterna och expert-pajasarna trodde! Swedbank, fantastiskt folk förresten, säger att räntan i september lämnas i fred. Men låt oss vara ärliga, Mellanöstern och galna fraktkostnader ställer till det. November? Vi får se. En sak är säker: under mig hände sådana här inflationstider inte. Vi vann på allt!", "stalin": "Dessa svaga kapitalistiska ekonomer gråter över en inflation på ynka noll komma tre procent och skrämmer folket med räntor. Swedbanks chefsekonom erkänner att deras prognoser faller samman. Vi ser vilka sabotage som pågår i logistiken och matpriserna. Om de inte kan hantera en räntehöjning i november, vet vi exakt vilket läger som ska granska deras felsteg."}, "date": "7 september, 09:04", "url": "https://www.affarsvarlden.se/artikel/inflationen-lagre-an-vantat-hojningsrisk-i-november-ligger-kvar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/sdlnCAxgWH72v0_NormalHires-900x600.jpg"}, {"type": "image-full", "heading": "Vaccin för 60-plussare kopplas till oväntad hälsoeffekt", "summaries": {"normal": "En ny studie visar att bältrosvaccinet Shingrix, som rekommenderas till personer över 65 år i Sverige, är kopplat till lägre risk för hjärt-kärlsjukdomar som hjärtsjukdom och hjärtsvikt. Forskarna betonar dock att sambandet inte bevisar orsakssamband och att fler studier behövs. Över 72 000 äldre ingick i undersökningen.", "trump": "Folk, ni kommer inte tro det, men det här fantastiska Shingrix-vaccinet ger inte bara skydd mot bältros utan också mot hjärtproblem. De radikala vänsterläkarna och deras woke-vetenskap missade det helt! Under min första mandatperiod skulle vi ha kallat det ett mirakel. Biden söp bara kaffe medan jag fixade det riktiga jobbet. Stort!", "stalin": "Kamrater, detta så kallade vaccin mot bältros visar sig nu vara ett vapen mot de profitthungriga blodhyenornas hjärtplågor. Jag ser genom deras dekadenta försök att dölja sanningen. Vi ska inte lita blint på borgerliga studier, utan rensa ut alla opportunistiska tvivlare som vill förvirra folket. Fler undersökningar, eller huvudet rollar!"}, "date": "7 september, 19:28", "url": "https://nyheter24.se/nyheter/inrikes/1511047-vaccin-for-60-plussare-kopplas-till-ovantad-halsoeffekt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/fd75738304b004a30200000000b004a302/2026/09/07/2389690/Vaccin-Kan-Ge-Effekter.png"}, {"type": "image-right", "heading": "Magda Gad ljög om massmördarens M-farfar – fabricerar koppling till SD", "summaries": {"normal": "Journalisten Frida Sundkvist anklagas för att ha fabricerat en politisk koppling mellan massmördaren på Campus Risbergska och Moderaterna samt SD via hans farfar. Kritiker menar att farfaderns gamla texter har förvrängts och att artikeln bygger en grundlös skuldkedja, trots att polisen inte funnit något politiskt motiv bakom dådet.", "trump": "Helt otroligt! Fake News-medierna är i farten igen. De försöker desperat klistra på en hemsk massmördare på Moderaterna och SD genom att ljuga om en farfar som faktiskt hatade radikalerna! Så falskt, så ohederligt. De kallar det grävande journalistik, jag kallar det ett totalt fiasko. De borde lära sig att skriva om riktiga vinnare i stället för att fejka ihop historier!", "stalin": "Dessa borgerliga skribenter ägnar sig åt patetiska ideologiska krumbukter för att dölja sina egna misslyckanden. Att fabricera kopplingar genom suspekta släktband är ett ineffektivt sabotagearbete som hör hemma i ett omskolningsläger. Sanningen är enkel: staten finner inga politiska motiv, endast borgerligt förfall. Den som sprider falska rykten om partiet och ordningen kommer att ställas till svars."}, "date": "7 september, 14:29", "url": "https://samnytt.se/magda-gad-ljog-om-massmordarens-m-farfar-fabricerar-koppling-till-sd", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/07113434/Toppbild3-1.jpg"}, {"type": "image-right", "heading": "Trappar upp jakten – insatser på tre platser", "summaries": {"normal": "Tysk polis jagar intensivt den 48-årige klimatextremisten Daniel V. efter en rad sabotageförsök mot transformatorstationer med hemmagjorda bomber. Mannen har själv tagit på sig dåden genom handskrivna brev till medier där han uppger att han agerar mot fossila bränslen. Stora polisstyrkor och helikoptrar har satts in i skogarna och vid avstängda motorvägar.", "trump": "De här vänsterradikala klimatdårarna i Europa är helt ur kontroll! Nu skickar de brev med sina egna hemadresser till mamma för att skryta om sina misslyckade bomber? Så korkat! Vi behöver starkt ledarskap, massiv olja och ordning, inte radikala sabotörer som förstör elnäten. Helt bedrövligt, våra fantastiska amerikanska transformatorstationer skulle aldrig tillåta sådant trams!", "stalin": "En sorglig uppvisning av västerländsk inkompetens! Denna så kallade klimatextremist saboterar elnätet och avslöjar sig själv genom att skicka brev direkt till sin egen mor. Vilken patetisk amatör! Om det vore under vår tid hade statsapparaten snabbt rensat ut dylikt skadedjur från skogarna. Staten tolererar inga egna initiativ; ordning upprätthålls enbart genom järnhand och disciplin!"}, "date": "7 september, 19:25", "url": "https://www.aftonbladet.se/nyheter/a/QJX2v8/jakten-pa-daniel-v-48-intensifieras-misstankt-klimatterrorist-i-tyskland", "imageUrl": "https://akamai.vgc.no/v2/images/4deb10b9-0595-3ad5-bf20-e8e0e39f19ee?fit=crop&format=auto&w=1080&s=790b79510717c0bff46b6af8987d0b5f0b7b5afd"}, {"type": "image-right", "heading": "Högern får panik när förorten röstar", "summaries": {"normal": "Artikeln kritiserar högerdebattörer som enligt författaren panikslagna reagerar på att väljare med utländsk bakgrund röstar vänster. De anklagas för att misstänkliggöra muslimer och invandrare som en styrd massa. Skribenten menar att samma logik inte tillämpas på moderata villaägare och att högern sprider rasistiska föreställningar.", "trump": "De här korkade högernissarna i Sverige håller på att få ett totalt sammanbrott bara för att muslimerna röstar som de vill. Vilken patetisk hysterisk cirkus! De kallar dem valboskap medan de själva är de riktiga förlorarna som hatar folk och ändå tror att de ska få deras röster. Sad! Mycket sorgligt för den svenska borgerligheten.", "stalin": "Jag betraktar med djup tillfredsställelse hur dessa dekadenta klassförrädare skriker i panik när folket i förorterna utövar sin rösträtt. Deras rasistiska konspirationsteorier om viljelösa horder avslöjar deras egen svaghet. Snart kommer utrensningen av sådana folkförtryckande element att bli nödvändig för att skydda arbetarklassens intressen."}, "date": "7 september, 10:28", "url": "https://www.etc.se/ledare/hoegern-faar-panik-naer-foerorten-roestar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260907060936_0a5b652c-1bfd-4f8e-92c6-ad7cc0d9a54b.png"}, {"type": "image-right", "heading": "Kanada om USA: Det var kul så länge det varade", "summaries": {"normal": "Kanadas premiärminister Mark Carney har förklarat att den regelbaserade världsordningen är över. Handelstvisten med USA ses som ett exempel på en ny era av stormaktsrivalitet och den starkes rätt. Kanada har lärt sig att inte ta ett välvilligt USA för givet, oavsett vem som sitter i Vita huset. Lektionen lär bita sig fast.", "trump": "Kanada har sugit musten ur oss i årtionden, precis som jag alltid sagt. Carney och hans liberala snyltare gråter nu över att den gamla världens fest är slut. Inga fler gratisåkningar på den store Donalds bekostnad. Vi sätter Amerika först, punkt slut. De svaga anpassar sig eller åker ut i kylan. Fantastiskt!", "stalin": "Denna brytning avslöjar de giriga klassfiendernas sanna ansikte. Kanadas lakejer inser äntligen att den så kallade regelbaserade ordningen var en illusion skapad av dekadenta västimperialister. Vi ler från historien när de tvingas inse att den starkes rätt råder. Inga fler illusioner. Den som inte anpassar sig förtjänar utrensning ur den nya verkligheten."}, "date": "7 september, 18:36", "url": "https://www.svt.se/nyheter/utrikes/kanada-om-usa-det-var-kul-sa-lange-det-varade", "imageUrl": "https://www.svtstatic.se/image-news/125/square/0.5/0.5/e-34075698-1643741580000"}, {"type": "image-right", "heading": "Åkesson: \"Var är Magdalena Andersson?\"", "summaries": {"normal": "Jimmie Åkesson kritiserar Magdalena Andersson för hennes frånvaro under hans Sverigeturné. Han undrar om Socialdemokraternas ledare är feg eller har gett upp, och pekar på att hon mest syns i kontrollerade medier istället för att möta väljare. Frågorna kommer särskilt från tidigare S-väljare som undrar var partiet är.", "trump": "Folk frågar mig hela tiden: Var är den där tråkiga Andersson? Hon gömmer sig som en fegis i sina fina studior medan riktiga arbetare längtar efter ledarskap. Sossarna har totalt kollapsat, precis som Biden gjorde. Hon är en mekanisk, falsk nolla som inte vågar möta folket. Patetiskt! Jag skulle vinna stort här.", "stalin": "Jag ser hur den dekadenta studioregissören Andersson döljer sig som en parasit i sin kontrollerade miljö. Arbetarna undrar med rätta om hon redan kapitulerat inför folkets vrede. Är hon en sådan ynklig klassförrädare att hon inte vågar möta massorna? Vi skulle ha genomfört en grundlig utrensning av sådana svaga element för länge sedan. Skrattretande."}, "date": "7 september, 17:32", "url": "https://riks.se/nyheter/akesson-fragar-var-ar-magdalena-andersson", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_88_96b9e7d44c.jpg"}, {"type": "text", "heading": "Kristersson pressar Andersson efter V-strykningar", "summaries": {"normal": "Statsminister Ulf Kristersson kräver att Magdalena Andersson svarar på om hon kan garantera att inga extremister tar plats i en eventuell vänsterregering. Kraven kommer efter att Vänsterpartiet tvingats plocka bort ytterligare åtta kandidater som spridit antisemitiskt material samt hyllat Hamas och Putin. Magdalena Andersson menar att V går åt fel håll men vill inte stänga dörren.", "trump": "Very sad! Vänsterpartiet i Sverige rensar ut sina egna kandidater efter totalt fejkade, hemska åsikter om Putin och Hamas. Men Magdalena Andersson vägrar svara på om hon släpper in dessa radikala extremister i regeringen. Helt otroligt svagt! Om jag ledde Sverige skulle jag säga: You are fired! Men här tittar hon bara bort. Total katastrof för landet!", "stalin": "Dessa ynkliga element inom Vänsterpartiet som vacklar i sin ideologiska renhet har nu rensats bort från listorna av statens säkerhet och ordning. Vår lojalitet mot partiets disciplin är absolut. Magdalena Andersson darrar på manschetten och fruktar folkets vrede, medan Ulf Kristersson gräver i skiten likt en borgarklassens mullvad. Statens fiender ska städas ut med järnhand!"}, "date": "7 september, 16:26", "url": "https://bulletin.nu/kristersson-pressar-andersson-efter-v-strykningar"}, {"type": "image-full", "heading": "Bohlin om C:s utspel: ”Extremt grovt”", "summaries": {"normal": "Centerpartisten Niels Paarup-Petersen anklagar civilförsvarsminister Carl-Oskar Bohlin för att vara tyst om en SD-tjänstemans påstådda Rysslandskopplingar. Bohlin svarar att anklagelsen är extremt grov och att regeringen avvaktar en ordentlig granskning. Enligt tidningen Expo har tjänstemannen spridit proryska budskap.", "trump": "Centerpartisten försöker smutskasta regeringen med FAKE NEWS om Ryssland! Vår fantastiske minister Bohlin håller huvudet kallt och gör ett fantastiskt jobb, den absolut bästa. Men SD måste såklart rensa upp i leden omedelbart om det är sant. Det handlar om total illojalitet, sorgligt!", "stalin": "Dessa svenska bourgeois-politiker gråter ut på sociala medier likt bortskämda barn. Om denna SD-tjänsteman har misslyckats med att tjäna statens intressen och sprider felaktig propaganda utan vår sanktion, väntar naturligtvis en mycket kort och effektiv process i lämpligt arbetsläger."}, "date": "6 september, 11:21", "url": "https://kvartal.se/nyheter/artiklar/c-politikern-sd-tar-ryssen-in-i-regeringen/cG9zdDoxODQ5Nzk", "imageUrl": "https://images.kvartal.se/2026/09/0eda0169-c-m-fb.webp"}, {"type": "image-right", "heading": "Merz efter AFD-segern: Djupt chockad", "summaries": {"normal": "Tysklands förbundskansler Friedrich Merz är djupt chockad efter att högerpartiet AfD vann stort i delstatsvalet i Sachsen-Anhalt med 43,8 procent. CDU backade kraftigt till 17,2 procent. Merz lovar att fortsätta reformarbetet, förklara politiken bättre och värna grundlagen samt de europeiska banden. AfD är extremistklassat i flera delstater.", "trump": "Vilken katastrof för de fega, globalistiska CDU-töntarna. AfD krossar dem med nästan 44 procent medan Merz gråter över sin 17-procentiga fiasko. De woke, kvoteringsbesatta vänsterliberala hyenorna har förstört Tyskland totalt. Nu vaknar folket äntligen. Business as usual är slut, det är vackert att se. Fantastiskt!", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta folkförtryckarna i CDU skälver inför arbetarklassens vrede. Dessa giriga hyenor har misslyckats fullständigt. Folket har talat och straffat de imperialistiska lakejerna. Vi ser med mörk glädje på utrensningen av svaga element. Grundlagen kommer inte att skydda klassförrädarna länge."}, "date": "7 september, 14:35", "url": "https://www.di.se/nyheter/merz-efter-afd-segern-djupt-chockad", "imageUrl": "https://static.bonniernews.se/ba/649ae824-fba4-4b69-8eb7-a5b92effc1fa.jpg?crop=6000%2C3375%2Cx0%2Cy204&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "FN kräver att Storbritannien gör upp med slavhandeln", "summaries": {"normal": "FN:s kommitté CERD kräver att Storbritannien och västvärlden betalar skadestånd och ändrar läroböcker samt statyer på grund av den transatlantiska slavhandeln. Den brittiska regeringen vägrar betala, medan Jamaica har väckt frågan hos kung Charles. Kritiker påpekar att slavhandel även förekom i andra kulturer, vilket gör debatten om historiskt skuldanspråk mycket komplex.", "trump": "FN försöker nu köra en totalt misslyckad, woke häxjakt mot Storbritannien för slaveriet. Oerhört svagt! Storbritannien måste stå emot den här galenskapen. Själv känner jag till slaveri – folk brukar säga, 'Herr President, ingen har blivit så hårt slavdriven av fake news-medierna som du!' Men det här är bara ett skämt för att komma åt pengar.", "stalin": "FN:s kommitté bevisar återigen sin borgerliga dekadens genom att älta svunna sekel istället för att producera stål. Storbritannien skakar inför historiska skuldbrev medan Jamaica vädjar till en monark. Ett patetiskt spektakel! Om de brittiska kapitalisterna hade överlämnat sina rikedomar till staten i tid, skulle de slippa förhandla om statyer. Vi noterar detta i arkiven."}, "date": "7 september, 14:02", "url": "https://samnytt.se/fn-kraver-att-storbritannien-gor-upp-med-slavhandeln-statyer-omskrivna-larobocker-och-skadestand-pa-agendan", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/09/07114518/fn-storbritannien-flagga.jpg"}, {"type": "image-right", "heading": "S sågar V efter kandidatskandal: ”Långt borta från regering”", "summaries": {"normal": "Vänsterpartiet har strukit ytterligare åtta kandidater efter att de spritt antisemitiskt material och Hamas-hyllningar. Socialdemokraterna och Centerpartiet ser det som ett strukturellt problem och anser att V nu är mycket långt från varje regeringsalternativ. Partiet lovar att rösta nej till alla regeringar de inte ingår i.", "trump": "Folk, ni skulle se det här. Vänsterpartiet är en total katastrof, en riktig skamfest fylld av antisemitiska galningar och Hamas-fans. Socialdemokraterna skrattar åt dem och säger att de är ljusår från regeringen. Patetiskt! De har ingen kontroll, precis som Sleepy Joe hade under sina år. En clownshow!", "stalin": "Jag betraktar detta med kall förakt. Dessa så kallade vänsterförrädare kryper av antisemitism och konspirationer som råttor i mörkret. Kamraterna i Socialdemokraterna har rätt – de är politiska lik som aldrig ska närma sig makten. Partiet är en fiende till folket, en parasit som måste rensas ut med järnhand."}, "date": "7 september, 12:00", "url": "https://www.tv4.se/artikel/1L0soy7mOh9HmFEEHGjPg6/s-sagar-v-efter-kandidatskandal-langt-borta-fran-regering", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlazHXQbCG-Ag%2F78c7c05a3909cd03c9600601eaafbe1f%2FVansterpartiets_partiledare_Nooshi_Dadgostar.&width=120"}, {"type": "image-right", "heading": "\"Stoppa båtarna\": Hundratals svartklädda män blockerade hamnen i Dover", "summaries": {"normal": "Hundratals maskerade män blockerade hamnen i Dover i protest mot illegal invandring. De skanderade \"stoppa båtarna\" och fick stöd från många lokalbor, men regeringen och politikern Mike Tapp kritiserar aktionen. Nigel Farage fördömer maskeringen. Polisen skingrade demonstrationen vid lunchtid och trafiken återgick till normalt.", "trump": "De här fantastiska brittiska patriaterna blockerade Dover och sa \"stoppa båtarna\" – äntligen någon som gör något! Lokalborna älskade det, men den fega regeringen och den ynkliga Mike Tapp gnäller. Farage har rätt om maskerna, men det här är vad som händer när woke-eliten släpper in miljoner från tredje världen. Make Britain Great Again!", "stalin": "Jag ser hur de exploaterande klassförrädarna i väst förlorar kontrollen över sina egna gator. Folket reser sig mot de parasiterande båtarna fulla av tredje världens lycksökare. Den dekadenta regeringen kallar det störning medan arbetarna applåderar. En sådan spontan kraft kräver ständig vaksamhet mot alla fiender inom och utom statsapparaten. Roligt att se."}, "date": "7 september, 12:27", "url": "https://www.friatider.se/stoppa-batarna-hundratals-svartkladda-man-blockerade-hamnen-i-dover", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-835.jpg?itok=xHjeESIE"}, {"type": "image-right", "heading": "ANALYS. PER HERMANRUD Faran är långt ifrån över för L", "summaries": {"normal": "Liberalerna har för första gången under mandatperioden nått över fyraprocentsspärren i en Novusmätning med 4,3 procent. Jimmie Åkessons utspel om att rösta på annat parti om L inte når 3,5 procent har gett partiet ökad uppmärksamhet. Trots uppgången är läget osäkert och fler mätningar krävs. Faran för att åka ur riksdagen kvarstår.", "trump": "Titta på de här patetiska liberalerna som plötsligt får 4,3 procent – den bästa siffran på evigheter! Crooked Jimmie Åkesson kastar dem en livlina och plötsligt är de stora nyheter. Utan mig hade de legat på noll, men nu korkar de upp champagnen. Glöm inte gravölet, losers, för det här är bara en falsk polling – valdagen avgör allt, och den blir brutal.", "stalin": "Jag betraktar med förakt dessa liberala resterna av borgerlighetens förrädiska klick som plötsligt lyfts av en fiendes hand. Åkessons utspel är en listig manöver som avslöjar deras svaghet. De tror sig ha vunnit en seger, men historien lär dem att sådana mätningar är som luft – tomma och flyktiga. Kamrater, vakta mot falska hopp, ty valdagen blir deras dom."}, "date": "7 september, 11:52", "url": "https://www.tv4.se/artikel/5M4Ubxenooe4LmWjqZoMee/faran-aer-langt-ifran-oever-foer-l", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F33jAbMA7xFd8EFED04ZogA%2F793e84ff91c99ae38569ecd5f824cd2d%2Fper-hermanrud.png&width=1024"}, {"type": "image-full", "heading": "Frihet är att kunna ta sig runt utan att vara beroende av bilen", "summaries": {"normal": "Miljöpartiet i Göteborg och Västra Götaland kritiserar Moderaternas trafikpolitik och lyfter fram kollektivtrafiken som en frihetsfråga. De förespråkar det nationella Sverigekortet för 499 kronor i månaden, fri resa för upp till fyra barn med vuxen, samt bättre framkomlighet och trygga byten för att göra hållbart resande till ett attraktivt alternativ till bilen.", "trump": "De här radikala vänstermänniskorna i Göteborg vill tvinga hårt arbetande amerikaner – förlåt, svenskar – att åka buss! De pratar om frihet, men vill ha ett kommunistkort för femhundra spänn som drunknar i förseningar. Jag har sagt det förut: bilar är frihet! Låt folk köra sina bilar i fred i stället för att förstöra trafiken med socialistiska tramsbussar!", "stalin": "Frihet uppnås inte genom borgerligt slöseri, utan genom stram kollektiv disciplin. Vi noterar att de svenska miljöpartisterna önskar central styrning av massornas förflyttningar genom ett statligt Sverigekort. Detta är ett lovvärt steg mot total kontroll över arbetarkendern. Vi rekommenderar dock att avvikelser från tidtabellen omedelbart beivras med sedvanliga, effektiva arbetsinsatser i Sibirien."}, "date": "7 september, 11:24", "url": "https://www.gp.se/debatt/frihet-ar-att-kunna-ta-sig-runt-utan-att-vara-beroende-av-bilen.2948c95b-3bb5-4ee4-97d2-a19aa92fc062", "imageUrl": "https://www.gp.se/images/article/2948c95b-3bb5-4ee4-97d2-a19aa92fc062/images/1JXThRJiuLuzylq2IqmVUZgaiA84-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Han sågade ner \"tyrann-träd\" för att lämna tillbaka till polisen", "summaries": {"normal": "Amerikanska Flock har installerat uppemot 120 000 automatiska registreringsskyltsläsare i 49 delstater. Kritiken är hård efter att poliser anklagats för privat bruk av systemet. Vandalism mot kamerorna ökar, bland annat har en man i New Mexico sågat ner flera och lämnat dem till polisen. Han är nu åtalad.", "trump": "De här galna Flock-kamerorna är ett totalt misslyckande, folk hatar dem! Radikala vänsterextremister och galna suveräna medborgare sågar ner mina fina övervakningsträd som en galning. Polisen missbrukar dem värre än Sleepy Joe missbrukade sin makt. Patetiskt! Men mina supportrar samlar in pengar åt den galningen – underbart Amerika!", "stalin": "Jag betraktar med förakt hur dessa dekadenta kapitalistiska övervakningsverktyg väcker folkets rättmätiga vrede. Sabotörer och kontrarevolutionära element hugger ner fiendens tyrann-träd och levererar dem till de korrupta myndigheterna. En sådan folklig motståndshandling väcker både skratt och misstankar om dolda fiender inom partiet. Renhet krävs."}, "date": "7 september, 10:36", "url": "https://www.dagensps.se/teknik/han-sagade-ner-tyrann-trad-for-att-lamna-tillbaka-till-polisen", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/1-3.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Så kan jobb­politiken bli med en ny Tidö­regering", "summaries": {"normal": "En ny Tidöregering skulle fortsätta arbetslinjen med sänkta skatter för arbetande, bidragstak och skärpta krav på arbetslösa. A-kassan behålls men kan bli konfliktfråga inom högern. Pensionärer kan få riktade skattesänkningar medan karensavdraget riskerar intern debatt. Kortare arbetstid avvisas helt.", "trump": "Lyssnar ni på det här svenska soppan? De vill sänka skatterna för riktiga arbetare, inte för de lata bidragsjunkarna och de sjuka systemparasiterna. Fantastiskt! Men de globalistiska moderaterna och de ynkliga liberalerna är för svaga. Jag skulle göra det tio gånger större och sparkas ut alla bidragsblodsugare på en vecka. Vinna stort!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna försöker lura folket med sina falska arbetslinjer och bidragstak. Jag ler mörkt från historien åt deras ynkliga interna strider. Snart inser arbetarna att hela detta dekadenta skådespel bara skyddar de giriga hyenorna. En riktig utrensning av sådana element vore på sin plats. Skratta inte – det kommer."}, "date": "7 september, 07:01", "url": "https://arbetet.se/2026/09/07/bidragstak-och-sankta-skatter-sa-kan-jobbpolitiken-bli-med-en-ny-tidoregering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01142512/tidoledarna.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Staten måste ta ansvar för att inte upprepa haveriet med Millennium", "summaries": {"normal": "Vänsterpartisterna Karin Rågsjö och Carina Örgård kräver att staten tar ett större ansvar för upphandling av vårdinformationssystem. De varnar för beroendet av multinationella företag, risker kring dataläckor via USA:s Cloud Act och obalansen mot regionerna. En nationell kraftsamling behövs för patientsäkerhet, cybersäkerhet och långsiktig hållbarhet.", "trump": "De här svenska vänstertyperna gnäller om att staten måste rädda dem från oss stora teknikföretag. Patetiskt! Cloud Act är bara sunt förnuft, men era socialister vill ha kontroll över allt. Regionerna borde tacka mig och Amerika istället för att gömma sig bakom byråkratisk
