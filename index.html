mebacken någonsin, tro mig.", "stalin": "Kamrater, se hur de dekadenta maktparasiterna famlar medan arbetarklassen vaknar. Jag betraktar denna dragkamp med djup misstro mot de giriga opinionshyenorna som försöker vilseleda massorna. Vänsterpartiets krav väcker minnen av svek. Snart rensas de vilsna mittenförrädarna ut i en historisk utrensning av folkets vilja."}, "date": "7 september, 01:30", "url": "https://www.dagensarena.se/innehall/kan-tidopartierna-ta-hem-riksdagsvalet"}, {"type": "image-right", "heading": "Högkostnadsskyddet för läkemedel måste återställas", "summaries": {"normal": "Högkostnadsskyddet för läkemedel försämrades för ett år sedan. Svenska Diabetesförbundet visar att många med diabetes nu avstår från medicin eller lånar pengar för att klara kostnaderna. Reformen drabbar särskilt kvinnor och yngre personer, ökar risken för komplikationer och hotar att höja samhällets vårdkostnader på sikt. Förbundet kräver att en ny regering rullar tillbaka förändringen.", "trump": "Folk, det här är en total katastrof. De svenska socialistbyråkraterna har förstört högkostnadsskyddet för diabetesläkemedel och nu tvingas vanliga människor välja mellan mat och medicin. Rena galenskapen! Biden skulle ha älskat den här typen av straffskatt på sjuka. Jag fixade bättre saker under min tid – nu måste de rensa ut de woke-vårdhyenorna och återställa ordningen innan fler dör i onödan.", "stalin": "Kamrater, se hur de giriga profitthungriga borgarhyenorna med sin reform tvingar arbetande diabetiker att välja mellan medicin och överlevnad. Jag ler ironiskt från historien när deras så kallade jämlika vård avslöjar sig som ren klassförtryck. Sådana dekadenta system förtjänar att rensas ut. Ingen ska skuldsätta sig för att leva. Det är statens plikt att likvidera denna ekonomiska terror mot folket."}, "date": "7 september, 01:30", "url": "https://www.dagensarena.se/opinion/hogkostnadsskyddet-lakemedel-maste-aterstallas", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-2026-09-02t210030798-300x157.jpg"}, {"type": "image-right", "heading": "Så kan jobb­politiken bli med en ny Tidö­regering", "summaries": {"normal": "En ny Tidöregering skulle fortsätta arbetslinjen med sänkta skatter för arbetande, bidragstak och skärpta krav på arbetslösa. A-kassan behålls men kan bli konfliktfråga inom högern. Pensionärer kan få riktade skattesänkningar medan karensavdraget riskerar intern debatt. Kortare arbetstid avvisas helt.", "trump": "Lyssnar ni på det här svenska soppan? De vill sänka skatterna för riktiga arbetare, inte för de lata bidragsjunkarna och de sjuka systemparasiterna. Fantastiskt! Men de globalistiska moderaterna och de ynkliga liberalerna är för svaga. Jag skulle göra det tio gånger större och sparkas ut alla bidragsblodsugare på en vecka. Vinna stort!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna försöker lura folket med sina falska arbetslinjer och bidragstak. Jag ler mörkt från historien åt deras ynkliga interna strider. Snart inser arbetarna att hela detta dekadenta skådespel bara skyddar de giriga hyenorna. En riktig utrensning av sådana element vore på sin plats. Skratta inte – det kommer."}, "date": "7 september, 07:01", "url": "https://arbetet.se/2026/09/07/bidragstak-och-sankta-skatter-sa-kan-jobbpolitiken-bli-med-en-ny-tidoregering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01142512/tidoledarna.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Wallenberg försvarar bara sin egen makt", "summaries": {"normal": "Jakob Wallenberg och flera svenska näringslivstoppar varnar för höjda skatter på förmögenhet och kapital samt ökad statlig inblandning. Artikelförfattaren menar att det inte handlar om Sveriges välstånd utan om att bevara ekonomisk makt och inflytande. Skatter på extrema rikedomar ses som ett sätt att begränsa maktkoncentrationen.", "trump": "Titta på den där Wallenberg-killen, en rik arvtagare som gråter över skatter. Patetiskt! De här globalistiska eliterna vill behålla sina pengar medan de vanliga arbetarna får betala notan. Jag har sänkt skatter och byggt en stark ekonomi – inte som Sleepy Joe som bara gav bort till de gröna galningarna och identitetspolitikerna. Amerika först, Sverige borde också vakna!", "stalin": "Kamrater, se hur dessa giriga penninghyenor mobiliserar mot skatter på sina guldhögar. Jag ler från historien åt deras ynkliga försvar av maktkoncentrationen. En sann folkstat måste rensa ut dessa parasiterande klassförrädare och låta tillgångarna tjäna kollektivet. Deras lobbyister och tankesmedjor är fiender till arbetarklassen – likvidera deras inflytande!"}, "date": "7 september, 06:50", "url": "https://arbetet.se/2026/09/07/jakob-wallenberg-forsvarar-inte-sverige-han-forsvarar-sin-makt", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/07065048/wallenberg-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}, {"type": "image-right", "heading": "Så få arbetare ställer upp i riksdagsvalet", "summaries": {"normal": "Endast 8 procent av riksdagspartiernas kandidater i valet 2026 anges som arbetare på valsedlarna. I S och SD är andelen omkring 20 procent, men betydligt lägre bland valbara platser utom hos socialdemokraterna. Forskaren Olle Folke menar att arbetare diskrimineras och har svårt att klättra i partiernas hierarkier. LO vill se fler arbetarröster i politiken.", "trump": "Titta på det här, det är en total skandal. Arbetarna, de riktiga tuffa människorna som bygger landet, får inte ens vara med i den här fåniga svenska politiken. Bara 8 procent! De globalistiska eliterna och deras woke-kvoteringsvansinne hatar vanliga jobbarkillar. Vi behöver pusha de riktiga arbetarna, inte de där korkade stockholmartyperna som aldrig svettats en dag i sitt liv. Patetiskt!", "stalin": "Kamrater, se hur de giriga borgarhyenorna i de svenska partierna systematiskt förtrycker arbetarklassen. Endast åtta procent på valsedlarna! Jag säger att detta är en fiendtlig utrensning av folkets sanna röster. De dekadenta partieliterna fruktar arbetarnas äkta perspektiv. Vi måste likvidera denna klassförrädande hierarki och återställa proletariatets dominans. Inga kompromisser!"}, "date": "7 september, 06:00", "url": "https://arbetet.se/2026/09/07/sa-fa-ar-arbetare-i-partierna-experten-diskrimineras-i-politiken", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04150143/olle-folke-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "De som röstar på C borde inte rösta alls", "summaries": {"normal": "Artikeln kritiserar Centerpartiet för att locka väljare med ett neutralt namn snarare än sin politik. Partiet har skiftat från borgerligt till ett liberalt parti med öppen migrationspolitik, vilket enligt texten prioriteras framför ekonomiska borgerliga värderingar. Författaren menar att det är ett riskfritt men skadligt val för den som vill bevara Sverige.", "trump": "Centerpartiet, vad är det för en röra? De kallar sig mittparti men är bara en massa fega liberaler som älskar att släppa in alla möjliga och omöjliga. De har svikit det riktiga folket, precis som Sleepy Joe gjorde. Rösta inte på dem, det är en total katastrof för Sverige. De borde kalla sig Bondepartiet igen, det vore åtminstone ärligt. Patetiskt!", "stalin": "Kamrater, se hur detta så kallade centerparti förvandlats till en liberal parasit som prioriterar främmande element framför arbetarklassen. Deras falska mittenretorik döljer ett förräderi mot nationen. Jag skrattar mörkt från historien åt dessa opportunister som tror att mångfald räddar staten. Bättre att inte rösta alls än att stödja sådana fiender till folkets enhet."}, "date": "6 september, 08:24", "url": "https://samtiden.nu/2026/09/de-som-rostar-pa-c-borde-inte-rosta-alls/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7301-1260x720.jpeg"}, {"type": "image-full", "heading": "Musks förarlösa taxi har börjat rulla på vägarna i Texas", "summaries": {"normal": "Teslas förarlösa Cybercab rullar nu med passagerare i Austin, Texas. Myndigheten NHTSA har inlett en granskning då fordonen saknar rattar och pedaler. Tesla hävdar att tekniken är säker, men myndigheten undersöker om säkerhetskraven uppfylls och om Teslas egen analys håller. Utfallet kan bli avgörande för framtiden för autonoma fordon i USA.", "trump": "Elon Musk och hans Cybercab – en fantastisk idé, kanske den bästa någonsin, men byråkraterna i Washington vill stoppa allt! De älskar att granska, de älskar att bromsa. Ingen ratt? Ingen pedal? Det låter som en riktigt smart affärsman som vet vad han gör. Under min ledning ska vi ha den bästa tekniken, inte låta småsinta tjänstemän förstöra framtiden för amerikansk innovation!", "stalin": "Tesla-direktörerna tror att de kan certifiera sig själva och ignorera folkets säkerhet. Vilken kapitalistisk hybris! Att sätta passagerare i en maskin utan kontrollorgan är ett brott mot den rationella ordningen. Vi, staten, kräver total insyn. Om inte maskinen kan underordna sig strikt byråkratisk kontroll måste den omedelbart skrotas. Det finns inget utrymme för anarkistisk ingenjörskonst i en disciplinerad framtid."}, "date": "6 september, 13:24", "url": "https://www.realtid.se/it-tech/musks-forarlosa-taxi-har-borjat-rulla-pa-vagarna-i-texas", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/amar-13.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "”Det ska bli roligt att byta regering”", "summaries": {"normal": "Miljöpartiet hoppas på sitt bästa valresultat någonsin i valet 2026. Språkröret Amanda Lind besökte en lokal partiträff i Stockholm där partiet visade starkt stöd, särskilt i radikala men välbärgade förorter. Opinionsmätningar ger partiet 8 procent och många väljare lyfter klimatfrågan samt motstånd mot tonårsutvisningar som drivkrafter.", "trump": "Titta på de här gröna galningarna i Sverige som tror att de ska vinna med sina elbilskramar och höga skatter. Amanda Lind och hennes miljöextremister peppar varandra i en källarklubb medan folk längtar efter riktig energi och låga skatter. De hatar kärnkraft och älskar att importera problem – patetiska förlorare som aldrig kommer att fixa någonting.", "stalin": "Jag ser hur dessa dekadenta klassförrädare inom Miljöpartiet försöker lura arbetarna med sin falska gröna propaganda. De hyllar sig själva medan de sviker folket med sin mjukhet mot tonårsutvisningar och vägrar rensa ut de verkliga hoten. Klimatet är en distraktion från klasskampen. En sådan svaghet förtjänar att likvideras i historiens domstol."}, "date": "6 september, 18:33", "url": "https://www.dagensarena.se/innehall/det-ska-bli-roligt-att-byta-regering", "imageUrl": "https://www.dagensarena.se/files/2026/09/amanda-lind.jpeg"}, {"type": "image-full", "heading": "AFD vann – men det blir inte lätt att få regera", "summaries": {"normal": "I det tyska delstatsvalet i Sachsen-Anhalt blev högerpopulistiska AfD största parti med 43,8 procent. Partiet nådde dock inte egen majoritet. Valet innebär en svår regeringsbildning då övriga partier vägrar samarbete. Särskilt svårt blir det för CDU som rasade till 17,2 procent, och nu ställs inför svåra val kring eventuella koalitioner med stöd från vänsterhåll.", "trump": "Vilken enorm seger för AfD i Sachsen-Anhalt, helt fantastiskt! De fick nästan 44 procent – en jättesiffra, helt enkelt bäst. Men de gamla tröga politikerna försöker stjäla deras framgång med falska nyheter och fula knep för att hålla dem borta från makten. CDU kraschade totalt, en katastrof! Jag säger er, folket vill ha en förändring, och de vill ha den nu!", "stalin": "Det borgerliga kaoset i Sachsen-Anhalt blottlägger systemets totala bankrutt. En fraktion på 43,8 procent skriker efter revolution, medan de förrädiska elementen inom CDU darrar inför folkets vrede. Vi noterar att de små reaktionära klickarna försöker slingra sig. Om de inte bildar lydiga kommittéer omedelbart, vet Folkkommissariatet exakt vilka åtgärder som krävs för att säkra statens stabilitet."}, "date": "7 september, 08:12", "url": "https://www.gp.se/nyheter/varlden/afd-vann-men-det-kommer-inte-bli-latt-att-regera.be6ee65f-ece6-4053-812d-e093391f4904", "imageUrl": "https://www.gp.se/images/article/be6ee65f-ece6-4053-812d-e093391f4904/images/1hLiB6KxvotzYS5evcmvFedFfw5A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Snart tjuter telefonerna vid fara: I dag testas larmet", "summaries": {"normal": "Det nya varningssystemet SE-Alert testas för första gången i Stockholms och Gotlands län. Testet berör omkring 2,6 miljoner invånare och skickar en skarp ljudsignal och textnotis direkt till uppdaterade mobiltelefoner utan krångliga appar. Systemet är utvecklat för att snabbt kunna varna vid allvarliga händelser och kriser på rätt geografisk plats.", "trump": "Sverige kopierar äntligen mina geniala varningssystem med enorma, fantastiska mobillarm som skakar om hela landet. Jag sa till dem, gör det ordentligt! Nu testar de detta i Stockholm och på Gotland för miljontals människor utan några töntiga appar. Helt otroligt, om telefonen är på tjuter den till och med på tyst läge. Ingen slår våra larm!", "stalin": "Kamrater, vi noterar med tillfredsställelse att det svenska lägret äntligen stramar åt disciplinen och beordrar ut kollektiva varningssignaler direkt till massornas apparater. Ingen undgår statens vaksamma öga när telefonerna tjuter i Stockholm och på Gotland. Den som försöker slingra sig undan genom flygplansläge eller sabotage kommer omedelbart att föas till kollektiva förhör av ordningsmakten."}, "date": "7 september, 06:00", "url": "https://www.gp.se/nyheter/sverige/snart-tjuter-telefonerna-vid-fara-i-dag-testas-larmet.8994f342-b23b-5442-9b4a-107d8bb141d8", "imageUrl": "https://www.gp.se/images/article/8994f342-b23b-5442-9b4a-107d8bb141d8/images/1_BWYh3gG_Pn_unUHwgyUeQwwwAc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Så tänker kändisarna rösta: ”Så klart vänster”", "summaries": {"normal": "Inför det svenska valet har Aftonbladet frågat 60 kända profiler om deras valplaner. Svaren visar på en splittrad kändisvärld. Vissa, som Ulf Brunnberg och Dr Alban, hyllar högerregeringen och Tidöpartierna, medan andra, som Zara Larsson och Pär Lernström, öppet stöttar vänsterblocket. Samtidigt väljer flera profiler att stå på staketet eller rösta blankt.", "trump": "De här radikala vänsterkändisarna i Sverige är helt desperata, det är fake news från början till slut! Men fantastiska patrioter som Dr Alban vet att högern vinner, för vänstern är totalt inkompetenta. Själv skulle jag krossa det här valsystemet på fem sekunder och göra Sverige great again, mycket bättre än de här svaga förlorarna som inte ens kan bestämma sig!", "stalin": "Dessa så kallade kändiskreatörer avslöjar sin ideologiska vacklan inför statens valhandling. De som darrar på staketet och vägrar bekänna färg visar en skadlig brist på revolutionär disciplin. Vi noterar namnen i registret. De som öppet saboterar enigheten kommer snart att få ompröva sina prioriteringar under mer produktiva former i ett av statens uppfostrande sibiriska läger."}, "date": "7 september, 09:28", "url": "https://bulletin.nu/sa-tanker-kandisarna-rosta-sa-klart-vanster", "imageUrl": "https://cdn.bulletin.nu/articles/8a5f7713-385f-4c0b-a8cc-b26ea82f992c/preview.png?t=1788765404000"}, {"type": "image-right", "heading": "Liberalerna över spärren Rusar inför valet.", "summaries": {"normal": "Liberalerna klättrar över riksdagsspärren och landar på 4,3 procent i en ny Novus-mätning inför valet. Partiets ledare Simona Mohamsson tillskrivs framgången genom att ha övertygat väljare om att partiet är avgörande för Tidösidan. Samtidigt bryts Socialdemokraternas nedgång och oppositionens försprång krymper.", "trump": "En enorm seger för Liberalerna i Sverige! De sa att det var kört, men plötsligt är de över spärren med fantastiska siffror. Leader Mohamsson förstår hur man gör deals och trycker dit vänstern. Socialdemokraterna blöder och deras siffror är en total katastrof, en riktig loser-situation. Snyggt jobbat, men ingen slår mina valresultat!", "stalin": "Dessa så kallade liberaler i den svenska riksdagen har mirakulöst kravlat sig över fyraperscent spärren. Partiledaren Mohamsson har säkrat sin position genom ideologisk disciplin. comrades, detta visar att folket kan styras om propagandan är tillräckligt ihärdig. Socialdemokraternas svaghet noteras i centrala arkivet; kontrarevolutionära tendenser tolereras aldrig i det längsta loppet."}, "date": "7 september, 09:00", "url": "https://samnytt.se/liberalerna-over-sparren", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/07064029/liberalerna-simona-mohamsson-riksdagen-okning.jpg"}, {"type": "image-right", "heading": "Ikväll står jag i Agenda – sedan exploderar hatet", "summaries": {"normal": "Tony Haddou från Vänsterpartiet skriver om hatet han möter som talesperson i migrationsdebatten. Inför sin medverkan i Agenda beskriver han rasistiska attacker mot sig och sin familj. Han är stolt över partiets representation av rasifierade röster men oroas över tonläget i samhällsdebatten och bristande stöd från delar av den rödgröna sidan.", "trump": "Den här patetiske vänstervilden Haddou gnäller om att folk kallar honom för vad han är. Kom hit, ta våra jobb, kräv bidrag och kalla oss rasister när vi säger stopp. Typiskt förlorarvänstern med sina offerkort och identitetsflum. De hatar verkligheten. Amerika har sett nog av den här galna öppna-gränser-sjukdomen, tro mig.", "stalin": "Jag betraktar med förakt hur dessa dekadenta offerhyenor inom den så kallade vänstern klagar över hat när de själva undergräver folkets enhet. Att spela offer för sin bakgrund är en farlig diversion. Vi behöver utrensning av sådan svaghet. Endast järnhård sammanhållning kring arbetarklassen besegrar de splittrande elementen. Tystnad från kamrater är förräderi."}, "date": "6 september, 08:00", "url": "https://www.etc.se/debatt/ikvaell-staar-jag-i-agenda-sedan-exploderar-hatet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905110956_c7f7e1b9-01f1-454b-97fd-528db4a7eda0.png"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det – inga fler pengar till dessa hatiska vänsterextremister och deras antiamerikanska agenda.", "stalin": "Jag ser hur de profitthungriga klassfienderna i västvärlden fortsätter sitt blodiga spel. Denna etniska utrensning i Gaza och på Västbanken är imperialismens verk. De dekadenta lakejerna i Sverige skickar vapen och pengar till förtryckarna. Kamrater, vi måste rensa ut dessa parasiterande hyenor. Endast en antiimperialistisk kamp kan besegra dem."}, "date": "4 september, 08:00", "url": "https://proletaren.se/artikel/valbilaga-bojkotta-israel"}, {"type": "image-full", "heading": "Vänsterpolitiker tog miljonutdelningar – ur bolag de vill förbjuda", "summaries": {"normal": "Expressen avslöjar att 229 kandidater från Vänsterpartiet, Socialdemokraterna och Miljöpartiet är involverade i välfärdsbolag som partierna vill förbjuda vinstuttag i. Bland dem finns en vänsterpartist som delat ut tio miljoner kronor och firat med Porsche. Artikeln kritiserar partierna för hyckleri och ifrågasätter trovärdigheten i deras socialistiska politik.", "trump": "Titta på det här! De galna vänstersocialisterna skriker om att stoppa vinsterna och kalla folk för Porsche-kapitalister, men deras egna kandidater har dragit ut miljontals kronor ur precis samma bolag. Nooshi och hennes gäng är de värsta hycklarna – Fake Left! De vill ha era skattepengar men behålla Porschen själva. Patetiskt!", "stalin": "Se hur dessa dekadenta revisonister inom vänstern predikar kollektivets renhet medan de själva suger ut miljoner ur folkets välfärd. Deras hyckleri är en fiende till revolutionen, en parasit som förvrider partilinjen. Jag varnar: sådana element måste rensas ut innan de förgiftar hela kollektivet. Folkets dom skall bli hård och rättvis."}, "date": "4 september, 07:18", "url": "https://samtiden.nu/2026/09/vansterpolitiker-tog-miljonutdelningar-ur-bolag-de-vill-forbjuda", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/phonto-1280x720.jpeg"}, {"type": "image-right", "heading": "Snart tjuter din mobil  – nya larmet testas", "summaries": {"normal": "Sveriges nya varningssystem för mobiler, Se-larm, testas för första gången klockan 15 på måndagen i Stockholms och Gotlands län. Testet sker samtidigt som Hesa Fredrik tjuter och når alla påslagna, uppdaterade smartphones i området med ljud och vibration i tio sekunder, oavsett tyst läge. Även angränsande län kan nås, och en kvinnojour har varnat för risker för våldsutsatta med gömda telefoner.", "trump": "Sverige kopierar äntligen mina enorma varningssystem, och klockan 15 brakar det loss i Stockholm och Gotland! Otroliga mobiltelefoner kommer att tjuta i tio sekunder, till och med på tyst läge, utan någon värdelös app. Radikala vänsterjournalister klagar på allt, men jag säger er: detta är en fantastisk, stark sak för landet. December blir det nationell storsuccé!", "stalin": "Klockan 15 på måndagen inleder staten och Myndigheten för civilt försvar ett nödvändigt mobiltekniskt prov av det nya varningssystemet i Stockholm och Gotland. Tusentals apparater skall ljuda i tio sekunder för att pröva folkets beredskap. De som saboterar eller sprider panik, likt kontrarevolutionära element som döljer sina terminaler, skall utan tvekan bringas till fullständig ordning."}, "date": "7 september, 08:55", "url": "https://www.expressen.se/nyheter/sverige/snart-tjuter-din-mobil-da-testas-nya-larmet-", "imageUrl": "https://static.bonniernews.se/ba/9367d573-7097-47ad-a34a-71faf7f6316b.jpeg?crop=2554%2C1432%2Cx0%2Cy212&width=640&quality=60"}, {"type": "image-right", "heading": "S-ledamoten mötte PLO inför svenska valet – lägger på när Samnytt ställer frågor", "summaries": {"normal": "S-ledamoten Johan Büser deltog i ett möte med PLO i våras där det svenska valet diskuterades, vilket uppmärksammades av författaren Aron Flam och tidigare SD-politiker Thoralf Alfsson. När Samnytt kontaktade Büser för en kommentar avslutade han samtalet. Alfsson kritiserar både mötet och mediernas tystnad kring händelsen.", "trump": "Socialdemokraterna i Sverige är helt otroliga, verkligen totalt inkompetenta! De smyger omkring och träffar PLO för att diskutera sitt eget val, det är en stor skandal, en riktig katastrof! Och när media ringer lägger den här Büser bara på luren. Väldigt svagt! De kan inte hantera pressen. Fake news-medierna skyddar dem, men vi ser sanningen!", "stalin": "Kamrater, vi har granskat denna svenska riksdagsman Johan Büser som i hemlighet konspirerar med utländska element om sina så kallade val. När statens granskare ställer frågor, flyr han som en rädd hare och lägger på luren! Så beter sig inte en sann Folkets representant, utan en sabotageur. Vi sänder honom omgående till omskolning i Sibirien för bristande disciplin!"}, "date": "7 september, 08:00", "url": "https://samnytt.se/s-ledamoten-motte-plo-infor-svenska-valet-lagger-pa-nar-samnytt-staller-fragor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03104923/Toppbild1-3.jpg"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och skrattar åt deras identitetspolitiska skit. Klass handlar inte om kvoter och doktorander som helikopteras in. Det handlar om folk som faktiskt jobbar och stänger av stället tillsammans. Patetiska globalistlakejer förstår ingenting.", "stalin": "Kamrater, dessa dekadenta klassförrädare mäter proletariatet med borgerliga enkäter och statistik som om klass vore en egenskap hos individer. Jag säger: organisering föds vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Inflationen stiger  lägre än väntat", "summaries": {"normal": "SCB:s preliminära siffror visar att inflationstakten enligt KPI steg till 0,3 procent i augusti, en liten ökning från juli då den låg på 0,2 procent. Samtidigt var måttet KPIF oförändrat på 0,7 procent. Riksbanken, som väntas besluta om styrräntan den 24 september, har tidigare aviserat att en räntehöjning kan bli aktuell senare i år.", "trump": "Sveriges inflation är ett fullständigt fiasko, totalt inkompetent skött! De försöker lura folket med småsiffror, men jag säger er – mitt America First-system krossar sådana här problem. Deras KPI kryper upp till 0,3 procent och räntorna svajar. Om de bara hade haft min ekonomi hade allt varit fantastiskt. Nu är det bara sorgligt!", "stalin": "Statistiska centralbyråns rapporter avslöjar att prisförändringarna åter rör sig uppåt. En inflation på 0,3 procent må synas obetydlig, men varje avvikelse från statens plan är ett symptom på systemets inneboende svaghet. Riksbankens ledning underställd granskning; om penningpolitiken brister kommer disciplinen att skärpas. Avvikelser tolereras icke."}, "date": "7 september, 08:45", "url": "https://www.expressen.se/nyheter/sverige/inflationen-stiger-lite-i-augusti", "imageUrl": "https://static.bonniernews.se/ba/fee7cf15-b146-473a-9925-b129dbc9c4c5.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Ännu fler V-kandidater strukta efter granskning", "summaries": {"normal": "En granskning av Expressen visar att ytterligare åtta kandidater för Vänsterpartiet har spridit antisemitiska konspirationsteorier samt hyllat Vladimir Putin och Hamas i sociala medier. Samtliga har nu strukits från partiets vallistor. Totalt har 25 personer rensats bort från listorna i år på grund av olämpliga uttalanden, och i Sävsjö har hela kommunlistan dragits tillbaka.", "trump": "Titta på det här, fullständigt katastrofalt! Vänsterpartiet i Sverige är i totalt kaos, fake news-vänstern rensar listorna på löpande band efter att dussintals radikaler har åkt fast för galna konspirationsteorier och terrorhyllningar. De kan inte ens kontrollera sina egna kandidater! Själv städar jag upp på ett helt annat sätt, men det här? Det är ett skämt, det sämsta jag sett!", "stalin": "Kamrater, den ideologiska disciplinen brister i de yttre leden! När det upptäckts att tjugofem opålitliga element har smusslat med främmande makters propaganda och obscena konspirationer, har staten rensat listorna med järnhand. Partisekreteraren bekräftar utrensningen, och hela Sävsjö-apparaten har upplösts. Wachmeister, se till att de ideologiska avvikelserna stävjas omedelbart innan det blir tal om några valsedlar!"}, "date": "7 september, 08:02", "url": "https://bulletin.nu/annu-fler-v-kandidater-strukta-efter-granskning", "imageUrl": "https://cdn.bulletin.nu/articles/390d5962-ba8c-47a1-a01c-c69e1e8f5a6e/preview.png?t=1788759796000"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Vulkanutbrott tvingar Victoria att ändra resa", "summaries": {"normal": "Ett vulkanutbrott i Indonesien tvingar kronprinsessan Victoria att ändra sin resa. Hon undviker Jakarta för att inte riskera att missa kung Haralds begravning i Oslo och reser istället via Bali. Besöket har hittills varit lyckat med möten om hållbar utveckling, återuppbyggnad på Lombok och fokus på blå ekonomi. Nästan hälften av flygningarna från Jakarta har ställts in.", "trump": "Det här vulkanen är en total katastrof, folk, värre än de gröna galningarna som vill stoppa allt med sina hysteriska kvoteringar. Victoria tvingas fly Jakarta som en smart dealmaker – bra tänkt! Skippa de dekadenta identitetspolitiska middagarna och kom hem till Harald. Under min ledning efter Biden skulle vi ha stängt himlen direkt. Fantastiskt!", "stalin": "Se hur naturen själv straffar de giriga utvecklingshyenorna och deras falska planer. Jag betraktar med förakt hur den imperialistiska delegationen flyr som ynkryggar undan aska för att hinna till en monarkistisk begravning. Lombok och havssköldpaddor – ren dekadens. Vi skulle ha genomfört en fullständig utrensning av sådana fega element redan vid första tecken på svaghet."}, "date": "7 september, 08:52", "url": "https://nyheter24.se/nyheter/inrikes/1510952-vulkanutbrott-tvingar-victoria-att-andra-resa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/b90ff8a604b004a302000079000004b902/2026/09/07/2389616/ur_image5J87jL.jpeg"}, {"type": "image-right", "heading": "Oväntade beskedet kan påverka räntan", "summaries": {"normal": "Statistiska centralbyråns preliminära siffror visar att den svenska inflationen enligt KPIF låg stilla på 0,7 procent i augusti. Utfallet är lägre än väntat och klart under Riksbankens mål på två procent. Trots detta överväger Riksbanken en räntehöjning i höst på grund av eventuella framtida inflationsökningar orsakade av utbudsstörningar från konflikten mellan USA och Iran.", "trump": "Sveriges inflation är ett totalt fiasko för dem, precis som jag sa! Den ligger kvar på svaga 0,7 procent, katastrofalt under deras mål. Nu sitter deras centralbank och skakar. De skyller på Iran och USA-konflikten, precis som svaga förlorare. Jag skulle ha fixat deras ekonomi på fem minuter, det kan jag lova er!", "stalin": "Statistiska centralbyrån rapporterar att den ekonomiska stagnation som benämns inflation förblir på ynkliga 0,7 procent, fjärran från statens fastställda mål. De svenska bankirerna darrar inför framtida utbudsstörningar orsakade av USA och Iran. Vi noterar deras borgerliga villrådighet och påminner om att avvikelser från den centrala planen kommer att beivras med sedvanlig kraft."}, "date": "7 september, 09:20", "url": "https://www.aftonbladet.se/nyheter/a/OkX05b/inflationen-oforandrad", "imageUrl": "https://akamai.vgc.no/v2/images/b11d301b-3778-3b2c-afbe-dd762b2b35f3?fit=crop&format=auto&w=720&s=c5176f3067b9b8bc238312042937e60f36f88ce4"}, {"type": "image-right", "heading": "Lind (MP) vill ha sex kronor dyrare bränsle", "summaries": {"normal": "Miljöpartiets språkrör Amanda Lind uppgav i SVT:s utfrågning att partiet vill höja bensinpriset med sex kronor för att nå klimatmålen till 2030. De tillfälliga skattesänkningarna ska bort och mer förnybart bränsle införas, men höjningen ska ske gradvis och kompenseras med exempelvis billigare kollektivtrafik. MP är även emot ny kärnkraft.", "trump": "De svenska miljömupparna är helt galna! De vill tvinga på bilisterna en enorm prisökning på sex spänn per liter för sin fejkade klimatagenda. Helt otroligt dåligt för vanliga arbetare! Själv vill jag ha lägre skatter och massor av härlig olja som får ekonomin att dundra. Rösta på sunda förnuftet istället för den här radikala dårskapen!", "stalin": "Det svenska miljöpartiets folkombudsman Amanda Lind har insett nödvändigheten av att med järnhand tvinga befolkningen till ekonomiska uppoffringar för det högre målet. Sex kronor extra per liter bensin är ett utmärkt steg mot fullständig disciplinering av massorna. De som saboterar statens gröna femårsplan genom motstånd mot kollektivt tvång ska omedelbart betraktas som folkfiender."}, "date": "7 september, 07:52", "url": "https://bulletin.nu/lind-mp-vill-ha-sex-kronor-dyrare-bransle-2", "imageUrl": "https://cdn.bulletin.nu/articles/c6d8d1fa-5537-4c37-99f1-2723a8df0163/preview.jpg?t=1788760206000"}, {"type": "image-right", "heading": "Beskedet från Lind (MP): Bensinen höjs med sex kronor", "summaries": {"normal": "Miljöpartiets språkrör Amanda Lind meddelar att partipolitiken skulle höja bensinpriset med sex kronor per liter. Hon kritiserar Tidöpartiernas miljöpolitik och föreslår istället mer förnybara drivmedel, självförsörjning och en grön återbäring till glesbygd och låginkomsttagare. Höjningen ses som nödvändig för att minska utsläppen.", "trump": "De gröna galningarna i Miljöpartiet vill chocka er med sex kronor dyrare bensin. Patetiska losers som Amanda Lind hatar bilar och älskar att straffa vanliga svenskar medan de själva flyger runt i privata jetplan. Jag fixade lägre priser, de vill bara göra livet dyrt för arbetarna. Totalt misslyckande!", "stalin": "Kamrater, dessa dekadenta klassförrädare i Miljöpartiet vill med sin så kallade gröna återbäring muta folket medan de höjer bränslepriserna och fördjupar fossilberoendet. Jag ser deras fega duckande och lögnaktiga utsläppspolitik. En sann utrensning av sådana parasitiska element behövs för att skydda arbetarklassen från deras hyckleri."}, "date": "6 september, 21:04", "url": "https://www.svt.se/nyheter/inrikes/beskedet-fran-amanda-lind-mp-bensinen-hojs-med-sex-kronor", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.35/0.54/5ac25c8d15ff15a8c9f5203ece3eaf1a9b0edc4a9b6de55e703da7cbd864e767"}, {"type": "image-right", "heading": "Tusentals flyg ställs in  – Victoria är på plats", "summaries": {"normal": "Vulkanen Anak Krakatau i Indonesien har haft kraftiga utbrott sedan i fredags, vilket lett till att över 1 500 flyg ställts in och 170 000 resenärer strandats. Askmoln har täckt huvudstaden Jakarta och flera flygplatser har stängts. Kronprinsessan Victoria befinner sig i landet på FN-uppdrag men planerar att resa vidare till kung Haralds begravning i Oslo.", "trump": "Vulkanen i Indonesien är helt utom kontroll, en veritabelt enorm katastrof! Askmolnen väller in över Jakarta och 170 000 resenärer är strandsatta eftersom radikala inkompetenta ledare inte kan hålla luftrummet öppet. Till och med Sveriges prinsessa är där och springer bland sköldpaddor! Under min ledning skulle ett sånt här vulkanutbrott aldrig ha tillåtits. Total ruin för flygbranschen, väldigt sorgligt!", "stalin": "Det vulkaniska utbrottet i Anak Krakatau bevisar naturens skoningslöshet, men folkets fiender använder den tillfälliga förlamningen av 1 500 flyg och 170 000 strandade resenärer för att underminera ordningen. Medan den svenska prinsessan flyr askmolnen för borgerliga begravningar i Oslo, måste staten stärka disciplinen. Den som sprider panik om askmoln och tsunamis ska omedelbart omhändertas för kontrarevolutionär verksamhet."}, "date": "7 september, 08:24", "url": "https://www.expressen.se/nyheter/varlden/tusentals-flyg-installda-efter-vulkanutbrott-i-indonesien", "imageUrl": "https://static.bonniernews.se/ba/5835a62b-3dcf-474f-976a-1700defd1bc9.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-right", "heading": "Sandström: Så har Tidö varit MP på autopilot", "summaries": {"normal": "Enligt en artikel av Christian Sandström har Tidö-regeringen i stort fortsatt med samma gröna industripolitik som den föregående S-regeringen. Myndigheter som Energimyndigheten och Vinnova har fått ökat stöd, och statliga exportkrediter samt pensionsfonder fortsätter finansiera gröna projekt. Trots vissa skillnader kring kärnkraft och riskvilja är de strukturella systemfelen i den gröna omställningen i huvudsak oförändrade.", "trump": "Titta på det här! Den svenska regeringen pratar om förändring, men de bara fortsätter att kasta bort miljarder på radikala gröna bubblor precis som sina svaga företrädare. Myndigheter växer, fonder leker med pengar och vindkraftverk som inte ens skapar jobb får miljardregn. Total katastrof! De behöver 'America First' och sunt förnuft, inte den här gröna autopilot-cirkusen!", "stalin": "Dessa svenska byråkrater försöker dölja sin svaghet bakom gröna fonder och myndigheter som växer okontrollerat. De delar ut miljarder till overksamma vindkraftverk och misslyckade industrier precis som förut. Vi i staten kräver disciplin och effektivitet! Om inte dessa kontraproduktiva flumprojekt stoppas omedelbart, kommer vi att tvingas omplacera de ansvariga till mer produktiva uppgifter i Sibirien."}, "date": "5 september, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-sa-har-tido-varit-mp-pa-autopilot", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-54-400x267.jpg"}, {"type": "image-right", "heading": "Nya avslöjanden – stryker kandidater", "summaries": {"normal": "Vänsterpartiet har tvingats stryka ytterligare åtta kandidater från sina valsedlar efter att Expressen avslöjat att de publicerat antisemitiska konspirationsteorier samt hyllat Putin och Hamas. Partisekreteraren Maria Forsberg bekräftar att personerna inte längre får representera partiet. Partiledaren Nooshi Dadgostar uppger sig ändå vara helt trygg med de kvarvarande kandidaterna på listorna.", "trump": "Vänsterpartiet har totalt kaos och rensar ut radikala extremister efter falska nyheter och skandaler. De sparkar kandidater till höger och vänster för att de älskar Putin och Hamas. Otroligt svagt ledarskap! Ledaren säger att hon är helt trygg, men det är en total katastrof. De kan inte ens kontrollera sina egna listor. Sad!", "stalin": "Kamrater! Vår inrikes säkerhetsapparat har upptäckt ideologiskt avvikande element inom de egna leden som spridit skadliga konspirationsteorier. Partisekreterare Forsberg har därför resolut rensat bort dessa opålitliga kandidater från listorna. Ledaren Dadgostar insisterar likväl på absolut trygghet i kollektivet. Vaksamhet mot subversiv verksamhet måste alltid upprätthållas till statens fromma."}, "date": "7 september, 09:08", "url": "https://www.aftonbladet.se/nyheter/a/WvXWB2/v-stryker-atta-kandidater-efter-avslojande", "imageUrl": "https://akamai.vgc.no/v2/images/d335273c-14d6-33ab-895d-497d78a1d294?fit=crop&format=auto&h=1440&tight=true&w=2160&s=f78070ee010b6b813d1603d0e3f1a073e2565520"}, {"type": "image-right", "heading": "Holmgren: Den stora islamdebatten – vilket Sverige vill vi  ha?", "summaries": {"normal": "Artikeln diskuterar en debatt om islam mellan Richard Jomshof och Adel Sedat. Skribenten menar att diskussionen i botten handlar om vilket samhälle Sverige vill ha i framtiden. Jomshofs fokus på den faktiska samhällsutvecklingen i den muslimska världen hyllas, medan vikten av sekulär lag, yttrandefrihet och jämställdhet betonas som oumbärliga svenska grundvärden.", "trump": "Sverige har stora problem, riktigt stora problem, och alla pratar om det! De hade en fantastisk debatt om islam som visade precis hur svagt allt har blivit. Jomshof sa det som alla tänker – titta bara på utfallet! Men den där Sedat vägrade ens att skaka hand, helt otroligt. Vi behöver lag, ordning och starka gränser, annars förlorar ni ert land!", "stalin": "Kamrater, denna borgerliga debatt om islam och moskéer i Sverige blottlägger ideologiska svagheter. Statens lagar måste alltid stå över religiösa dogmer! När en så kallad debattör vägrar att skaka hand med Folkets representant, avslöjar han sin brist på disciplin. Vi noterar detta i arkiven: avvikelser från den sekulära ordningen tolereras ej. Framtiden tillhör kollektivet, inte obscurantismen!"}, "date": "7 september, 07:33", "url": "https://bulletin.nu/holmgren-den-stora-islamdebatten-vilket-sverige-vill-vi-ha", "imageUrl": "https://cdn.bulletin.nu/articles/641db277-571f-450b-9e3c-f7a0475723ce/preview.jpg?t=1788759224000"}, {"type": "image-full", "heading": "Jättebrand i potatislager", "summaries": {"normal": "Ett potatislager i Tidaholm har drabbats av en storbrand. Räddningstjänsten har varit på plats sedan natten men byggnaden bedöms som helt förlorad. Fokus ligger på att begränsa branden och rädda maskiner. Det finns en låg spridningsrisk till omgivningen och inga personer har skadats. Det är ännu okänt hur mycket potatis som har förstörts.", "trump": "Ett enormt potatislager i Sverige brinner, total katastrof! Byggnaden går absolut inte att rädda, en skam för effektiviteten. Räddningstjänsten är där, de gör vad de kan, men vilken röra! Tur i eländet att ingen skadats, och de lyckades få ut maskinerna. Men potatisen? Ingen vet! En sorglig dag för potatisälskare över hela världen. Otroligt!", "stalin": "En katastrofal förlust av statens knölar i Tidaholm! Att ett potatislager brinner ned till grunden är ett sabotage mot folkets näringstillgång. Räddningstjänstens erkännande att byggnaden är förlorad luktar inkompetens. Maskinerna har räddats, vilket är tillfredsställande, men vem bär ansvaret för denna kulinariska olycka? De ansvariga kommer att utredas noggrant för detta svtska misslyckande."}, "date": "7 september, 01:42", "url": "https://www.gp.se/nyheter/vastsverige/storbrand-i-potatislager-byggnaden-gar-inte-att-radda.af2a0412-a13f-4fc8-9638-badf0fb4f159", "imageUrl": "https://www.gp.se/images/article/af2a0412-a13f-4fc8-9638-badf0fb4f159/images/5A1DYZyQzGW3KxSm7VFuL8KvyBk0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Kristdemokraterna vill ha högre invandring", "summaries": {"normal": "Kristdemokraterna förespråkar en migrationspolitik där asylinvandringen ska ligga på nordisk genomsnittsnivå, främst via kvotflyktingar och lagliga vägar. Partiet skiljer sig från Sverigedemokraterna som vill minimera invandringen till nära noll utanför närområdet, stoppa kvotmottagande och skärpa reglerna för arbetskraftsinvandring ytterligare.", "trump": "Folk, ni måste höra det här! KD vill ha en fin, normal nordisk invandring – typ som de andra förlorarländerna. Patetiskt! SD vill ha den lägsta möjliga, nära noll, och det är smart. De där KD-typerna är bara svaga kompromissande globalister som inte vågar säga stopp. Jag byggde muren, de bygger ursäkter. Ynkligt!", "stalin": "Jag betraktar dessa borgerliga revisionister med djup misstro. KD:s så kallade nordiska medelvärde är en farlig kompromiss med klassfienden, en trojansk häst för kapitalets invasion. SD:s nollvision är åtminstone ärlig i sin paranoia. Men ingen av dem förstår att endast partiet och kollektivet kan styra folkflödena. Avvikare kommer att identifieras."}, "date": "3 september, 11:43", "url": "https://samtiden.nu/2026/09/kristdemokraterna-vill-ha-hogre-invandring", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/7d1f8f3e-4570-402c-963e-74f000f208c2-1280x720.png"}, {"type": "image-full", "heading": "700 000 villaägare uppmanas agera: \"Gör det nu\"", "summaries": {"normal": "Hundratusentals svenska hus med krypgrund riskerar fukt- och mögelskador. Enligt Anticimex hade 46 procent av de besiktigade husen sådana problem under 2025, vilket motsvarar cirka 320 000 hus. Sensommaren är en lämplig tid att kontrollera krypgrunden då fuktbelastningen är som störst. Tidig upptäckt underlättar åtgärdande. Kontrollera mögel, röta, kondens, lukt och sprickor minst två gånger per år.", "trump": "Folk, ni har ingen aning hur illa det är med de här fuktiga krypgrunderna. Miljoner svenska hus håller på att ruttna bort under våra fötter, och de woke-byggarna och de gröna EU-borgarbrackorna har ingen koll. 320 000 hus! Det är en katastrof, en riktig mögel-tsunami. Gå ner i källaren nu, folk, innan det är för sent. Jag fixade mycket bättre hus än så här under min förra mandatperiod.", "stalin": "Kamrater, se hur de profitthungriga byggparasiterna har lämnat arbetarnas hem åt fuktens och mögelns förrädiska angrepp. 320 000 hus hotas av röta och kondens, ett klart bevis på den dekadenta planlöshetens fiasko. Jag säger: rensa ut alla odugliga inspektörer som blundat. Kontrollera genast era krypgrunder, annars väntar likvidering av hela era bostäder. Det är klassfiendens verk, och vi ser det tydligt."}, "date": "7 september, 08:28", "url": "https://nyheter24.se/livsstil/1510978-700-000-villaagare-uppmanas-agera-gor-det-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/bb33002204b004a30200000000b004a302/2026/09/07/2389640/villa-agare.jpg"}, {"type": "image-full", "heading": "Så mycket högre kan elräkningen bli", "summaries": {"normal": "Sverige står inför en vinter med högre elpriser än föregående år, särskilt i södra delarna. Orsakerna är låga vattennivåer och höga gaspriser i Europa. Prognosen pekar på hundratals kronor dyrare månadskostnader för hushåll. Villaägare i elområde 4 kan räkna med cirka 3 700 kronor i månaden, exklusive nätavgifter och skatter.", "trump": "Sveriges elpriser går rakt upp i taket – en katastrof! De har inte råd med sin egen energi, helt otroligt. Självklart händer det här när man vänder ryggen åt kärnkraften. Det är en total röra, mycket värre än vad de säger. Räkningarna blir enorma, riktigt 'huge'. Man måste ha energi, man måste ha kraft – Sverige behöver ordning, inte mer av det här!", "stalin": "Dessa löjliga elräkningar är ett bevis på folkets ineffektivitet. Att medborgare i söder gnäller över några hundralappar visar bara på en dekadent individualism. Istället för att lita på väder och vind borde staten styra varje kilowatt med järnhand. Planera ekonomin, stäng av de onödiga lamporna och arbeta hårdare för fosterlandet – elbrist är ett svek mot den kollektiva framgången."}, "date": "4 september, 07:56", "url": "https://www.realtid.se/tt-nyhet/sa-mycket-hogre-kan-elrakningen-bli", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/rakna-med-dyr-elvinter-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Storseger för AFD –  men ingen majoritet", "summaries": {"normal": "Högerextrema AfD blev största parti i delstatsvalet i Sachsen-Anhalt med 43,8 procent av rösterna, medan CDU backade till 17,2 procent. Eftersom partiet inte fick egen majoritet och andra partier nobbar samarbete hotar ledaren Ulrich Siegmund med nyval. Vänsterpopulistiska BSW klarade spärren, vilket stoppade AfD:s absoluta majoritet.", "trump": "Titta på Tyskland, de gör det igen! Vårt fantastiska, enorma AfD krossade motståndet i Sachsen-Anhalt och fick makalösa 43,8 procent, medan de svaga förlorarna i CDU kraschade fullständigt till ynka 17,2 procent. De gamla partierna försöker desperat frysa ut dem, men vinnare vinner alltid. Om de inte får regera blir det nyval och då vinner de ännu mer, tro mig!", "stalin": "Folket i Sachsen-Anhalt har talat med 43,8 procents röststyrka för AfD, medan de ruttna klerikala elementen i CDU har krossats till spillror på 17,2 procent. Eftersom de borgerliga lakejerna vägrar samarbete och vämjelig vänsterpopulism blockerar den absoluta makten, överväger kamrat Siegmund nya val. Partistaten noterar detta och varnar alla kontrarevolutionära element för att frukta folkets oundvikliga vrede."}, "date": "7 september, 07:57", "url": "https://www.expressen.se/nyheter/varlden/ingen-majoritet-for-hogerextrema-afd-men-stor-seger", "imageUrl": "https://static.bonniernews.se/ba/dc693fc8-9988-401b-90e2-42fab6ecb4b3.jpeg?crop=2553%2C1434%2Cx0%2Cy51&width=640&quality=60"}, {"type": "image-full", "heading": "Debattör polisanmäler Kristersson för förtal", "summaries": {"normal": "Valley Ghanem har polisanmält statsminister Ulf Kristersson för förtal efter att han kallat hennes uttalanden om Liberalernas Simona Mohamsson för flagrant antisemitism. Mohamsson har i sin tur polisanmält Ghanem för uttalanden som ”må hon brännas”, och Säkerhetspolisen utreder nu fallet som misstänkt olaga hot.", "trump": "Sorgligt! Den här radikala personen skickar vidriga hot och gråter sedan ut och stämmer Sveriges premiärminister för förtal när hon åker fast. Helt otroligt svagt! Om jag ledde Sverige skulle sådant här nonsens stoppas omedelbart. Totalt falska nyheter och enormt slöseri med tid. Skärp er, Sverige!", "stalin": "Ett ytterst beklagligt haveri inom den svenska ordningen. Medborgaren Ghanem kastar ur sig mordhot och gråter sedan ut om förtal till den kapitalistiska staten, medan Säkerhetspolisen drar ut i krig mot tangenterna. I Sovjetunionen hade vi rensat upp i detta enfaldiga spektakel på fem röda sekunder!"}, "date": "6 september, 13:14", "url": "https://kvartal.se/nyheter/artiklar/ghanem-polisanmaler-kristersson-for-fortal/cG9zdDoxODUwODY", "imageUrl": "https://images.kvartal.se/2026/09/06fe0aa7-kristerssonmohamsson.webp"}, {"type": "image-full", "heading": "Hundra år gammal teknik ska spara rederierna miljontals kronor i bränsle", "summaries": {"normal": "Maersk monterar ett 35 meter högt rotorsegel på ett containerfartyg i Lima-klassen från mitten av 2027. Seglet sparar cirka ett ton bränsle och tre ton koldioxid per dygn, vilket ger en årlig besparing på drygt två miljoner kronor. Tekniken drivs fram av EU:s utsläppshandel och FuelEU Maritime.", "trump": "Titta på det här, de där galna miljöfanatikerna i EU tvingar fartyg att sätta upp 100 år gamla segel igen. Maersk hänger på för att rädda sina pengar medan Biden förstörde allt med sina gröna vansinnigheter. Men nu är jag tillbaka, och vi ska göra sjöfarten stor igen utan dessa patetiska vindleksaker!", "stalin": "Jag ser hur de dekadenta västkapitalisterna desperat gräver i historiens sopor efter rotorsegel för att undvika folkets vrede över sina utsläpp. Dessa fega imperialister tror att en roterande cylinder räddar deras profitmaskiner. Det är en komisk föreställning som bara bekräftar systemets dödsryckningar. Kamrater, notera fiendens svaghet."}, "date": "7 september, 07:41", "url": "https://www.dagensps.se/teknik/hundra-ar-gammal-teknik-ska-spara-rederierna-miljontals-kronor-i-bransle", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/maersk-container-anemoi-rotor-sail-1-204.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Så slåss politikerna om klanrösterna i årets val", "summaries": {"normal": "Svenska politiker från flera partier söker stöd hos etniska och religiösa grupper som assyrier, syrianer och kurder inför valet. Besök i kyrkor, firanden och motioner om Kurdistan och folkmordet Seyfo används för att vinna röster. Organisationerna bjuder in politiker för att öka sitt inflytande. Statsvetare ser det som naturlig väljarbaspolitik.", "trump": "Titta på de här desperata svenska politikerna som springer runt i invandrarkyrkor och slickar klanröster som om det vore gratis hamburgare. Ebba och Magdalena tävlar om vem som kan böja sig djupast för diaspororna. Patetiska! De borde fokusera på Sverige istället för att mata identitetspolitikens galna offer. Det är en total skam, folk.", "stalin": "Se hur de dekadenta maktlystna hyenorna springer från kyrka till förening och lovar erkännanden de aldrig håller. Jag betraktar detta som klassiskt symptom på ett förrädiskt system som köper lojalitet med lögner. Snart inser arbetarna att sådana parasiterande element måste rensas ut innan de förgiftar hela nationen. Historien ler mörkt."}, "date": "6 september, 14:05", "url": "https://www.friatider.se/sa-slass-politikerna-om-klanrosterna-i-arets-val", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/klanroster.jpg?itok=vfCHK9Be"}, {"type": "image-right", "heading": "Vänstern behöver mer än baristor", "summaries": {"normal": "Artikeln diskuterar vänsterns behov av att organisera både prekariserade storstadsarbetare och landsbygdens arbetarklass. Författaren varnar för att en rörelse som överger landsbygden åt högern aldrig kan förändra samhället. Han lyfter arbetarnas uppgivenhet och betonar vikten av starka band mellan partier, fackföreningar och folkrörelser för att skapa bestående samhällsförbättringar.", "trump": "De där vänstervridena med sina rosa hår och lattemuggskrig förlorar arbetarna till oss riktiga patrioter. Baristorna i sina stora städer? Patetiska. Landsbygden vet vad som gäller. Utan oss blir det bara mer dekadent identitetspolitik och ingen hoppfull politik för vanliga människor. Vi vinner stort, de förlorar landet.", "stalin": "Kamrater, denna dekadenta klassförrädare har rätt i att uppgivenhet driver arbetarna mot högern. Jag ser hur profitthungriga parasiter och deras politiska lakejer överger landsbygden. En sann arbetarrörelse måste ingjuta hopp och rensa ut svikare. Utan järnhård organisation och folklig mobilisering kommer ingen seger. Fienden ler i skuggorna."}, "date": "2 september, 10:55", "url": "https://www.flamman.se/vanstern-behover-mer-an-baristor", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/starbucks-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Novus: L över spärren – S kvar på bottennivå", "summaries": {"normal": "Enligt en Novus-mätning för TV4 Nyheterna kättrar Liberalerna upp till 4,3 procent och passerar därmed riksdagsspärren. Socialdemokraterna ligger kvar på en bottennivå med 27 procent trots en viss återhämtning. På Tidösidan tappar SD medan M ökar. Oppositionen leds fortfarande med 2,4 procentenheter, men valrörelsens slutspurt gör det allt jämnare mellan blocken.", "trump": "De svenska väljarna ringer in till mig och säger att det här är otroligt! Småpartiet Liberalerna, som i princip var utraderade, kämpar sig mirakulöst över spärren till 4,3 procent genom att smart nog förstå att Tidö-koalitionen behöver dem. Samtidigt ligger radikala Socialdemokraterna kvar på bottennivåer. Helt fantastisk rörelse i Sverige, en enorm seger för sunt förnuft!", "stalin": "Statistiska centralbyrån rapporterar om bourgeoisiens desperata manövrar inför valet. De så kallade liberalerna klamrar sig krampaktigt över spärrutan genom slugt agitationstryck, medan socialdemokraterna trampar på botten av sin historiska vanmakt. Statens fiender på högersidan splittras, men den revolutionära ordningen kräver fortsatt vaksamhet mot alla avvikande fraktioner. Förrädarna ska granskas i sömmarna!"}, "date": "7 september, 07:10", "url": "https://bulletin.nu/novus-l-over-sparren-s-kvar-pa-bottenniva", "imageUrl": "https://cdn.bulletin.nu/articles/6b8cd578-b42c-496e-9d30-5635f7698ca1/preview.jpg?t=1788757837000"}, {"type": "image-right", "heading": "Därför bör ”röda” kvinnor rösta på Tidö", "summaries": {"normal": "En debattartikel från Tankesmedjan Medborgarperspektiv argumenterar för att kvinnor som traditionellt röstar rött bör överväga att lägga sin röst på Tidöpartierna. Artikeln menar att borgerlig politik bättre levererar trygghet, ekonomisk frihet och kvalitet i välfärden, vilket är områden som prioriteras högt av kvinnor.", "trump": "Vänsterns misslyckade politik är en katastrof för kvinnorna, totalt svaga och farliga gator! Tidöpartierna förstår att man behöver lag och ordning, starka plånböcker och massor av frihet. Det här är fantastiskt, verkligen smart, precis som jag alltid har sagt: sätt brottsoffret först och sänk skatterna så vinner man stort!", "stalin": "Dessa kvinnor som sviker den röda fanan för borgerliga illusioner av individuell trygghet uppvisar en ideologisk avvikelse som måste stävjas. Staten noterar att svaghet i välfärden straffas, och bourgeoisiens falska löften om skattesänkningar är inget annat än kontrarevolutionär propaganda. Vi kommer att övervaka denna omfördelning av sympatier mycket noga."}, "date": "7 september, 06:41", "url": "https://samnytt.se/darfor-bor-roda-kvinnor-rosta-pa-tido", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/04152409/thunstrom-kvinnor-rosta-inte-rott.jpg"}, {"type": "image-right", "heading": "Tror du på klimatforskningen, Pourmokhtari?", "summaries": {"normal": "Artikeln kritiserar Tidöregeringens klimatpolitik som ökar utsläppen genom sänkta skatter på fossila bränslen och nedläggning av miljödepartementet. Extremväder och rekordvärme i Europa lyfts som bevis på pågående kris. Oppositionen, inklusive Vänsterpartiet, förespråkar ambitiös omställning med investeringar i järnväg, kollektivtrafik och rättvis fördelning av bördorna. Enligt undersökningar vill en majoritet av svenskarna se starkare klimatåtgärder.", "trump": "Lyssnar ni på de här galna vänstermiljöterroristerna som vrålar om klimatkris och extremväder? Pourmokhtari och hennes svaga liberala gäng gör rätt som ignorerar den här bluffen. Vi behöver inte fler tåg och elnät för att gynna de vanliga människorna, vi behöver styrka och jobb, inte dessa deklasserade gröna hyenor som vill förbjuda privatjet medan de flyger runt i sina egna privata limousiner. Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare i Tidöregeringen öppet ökar utsläppen och nedlägger departement som en kapitulation inför fienden. Jag betraktar deras giriga hyenor som farliga sabotageörer av folkets framtid. Vi måste rensa ut alla sådana element, investera i järnvägar och kollektivtrafik samt beskatta miljardärerna. Endast en sann omställning under partiets ledning kan besegra denna klimatiska kontrarevolution."}, "date": "5 september, 14:00", "url": "https://www.etc.se/debatt/tror-du-paa-klimatforskningen-pourmokhtari", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905100932_b449ec62-7644-43ae-a2c0-e85d85f9f691.jpg"}, {"type": "image-right", "heading": "Rapparen Alex Ceesay uppmanar följare att rösta mot SD – med tusenlappar", "summaries": {"normal": "Rapparen Alex Ceesay uppmanade sina följare att rösta på vänsterpartier för att stoppa SD:s inflytande. Han lovade pengar i en tävling men backade senare och uppgav att det var olagligt. Ceesay, tidigare dömd för flera brott, meddelade en ny tävling tillsammans med den dömde rapparen Dree Low.", "trump": "Titta på den här rapparen Alex Ceesay, en total loser med en lång lista av domar för rån och knark. Han lovar tusenlappar för att folk ska rösta på de galna vänsterextremisterna mot SD. Sen backar han som en fegis när det blir brottsligt. Patetiskt! De woke-identitetspolitiska parasiterande opportunisterna hatar verkliga patrioter.", "stalin": "Jag ser hur dessa dekadenta klassförrädare som Ceesay försöker manipulera massorna med mutor för att skydda sina globalistiska vänner. Hans paranoia inför ett starkt nationellt parti avslöjar allt. Kamrater, sådana folkförtryckande hyenor förtjänar att rensas ut ur samhället. Historien dömer dem skoningslöst."}, "date": "6 september, 14:17", "url": "https://riks.se/nyheter/rapparen-alex-ceesay-uppmanar-foljare-att-rosta-mot-sd-lockar-med-tusenlappar", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_6_2026_02_08_08_PM_92c914e70d.png"}, {"type": "image-full", "heading": "Bohlin om C:s utspel: ”Extremt grovt”", "summaries": {"normal": "Centerpartisten Niels Paarup-Petersen anklagar civilförsvarsminister Carl-Oskar Bohlin för att vara tyst om en SD-tjänstemans påstådda Rysslandskopplingar. Bohlin svarar att anklagelsen är extremt grov och att regeringen avvaktar en ordentlig granskning. Enligt tidningen Expo har tjänstemannen spridit proryska budskap.", "trump": "Centerpartisten försöker smutskasta regeringen med FAKE NEWS om Ryssland! Vår fantastiske minister Bohlin håller huvudet kallt och gör ett fantastiskt jobb, den absolut bästa. Men SD måste såklart rensa upp i leden omedelbart om det är sant. Det handlar om total illojalitet, sorgligt!", "stalin": "Dessa svenska bourgeois-politiker gråter ut på sociala medier likt bortskämda barn. Om denna SD-tjänsteman har misslyckats med att tjäna statens intressen och sprider felaktig propaganda utan vår sanktion, väntar naturligtvis en mycket kort och effektiv process i lämpligt arbetsläger."}, "date": "6 september, 11:21", "url": "https://kvartal.se/nyheter/artiklar/c-politikern-sd-tar-ryssen-in-i-regeringen/cG9zdDoxODQ5Nzk", "imageUrl": "https://images.kvartal.se/2026/09/0eda0169-c-m-fb.webp"}, {"type": "image-right", "heading": "Fröken Snusk tar förstaplatsen på Spotify –  sågar Nooshi Dadgostar", "summaries": {"normal": "Fröken Snusk toppar återigen Spotifys svenska lista med låten ”Om du frågar Nooshi”, en kritisk vallåt mot Vänsterpartiets ledare Nooshi Dadgostar. Texterna behandlar straffpolitik, brottsoffer och kvinnors trygghet. Artisterna betonar att de inte hatar vänsterväljare utan vill göra sin röst hörd. Låten har fått både stark kritik och positiv respons.", "trump": "Titta på den här Fröken Snusk – hon är en vinnare, folk älskar henne! Hon slår Nooshi Dadgostar rakt i ansiktet med en låt som är ren eld. Den där vänsterkvinnan är en total katastrof, en räddhågsen identitetspolitisk clown som gömmer sig bakom hyckleri. Sverige behöver inga woke-snutar, de behöver sanning och styrka. Fantastiskt jobb, Fröken!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare river varandra i offentlig skam. Jag betraktar med mörk glädje hur Fröken Snusk riktar sin sång som en bajonett mot den vekling som kallar sig Nooshi. Vänsterns dubbelmoral blottas. Inga halvmesyrer! Endast total utrensning av sådana svaga element kan rädda folkets moral. Skrattretande patetiskt."}, "date": "6 september, 13:40", "url": "https://riks.se/nyheter/froken-snusk-tar-forstaplatsen-pa-spotify-sagar-nooshi-dadgostar", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_6_2026_01_01_27_PM_ed4782d07d.png"}, {"type": "text", "heading": "Boeingplan i olycka – fem döda", "summaries": {"normal": "Ett fraktplan av typen Boeing 767 som flög för Amazon körde på söndagen av landningsbanan på Miami International Airport efter en flygning från Puerto Rico. Planet fattade eld i samband med olyckan. Enligt lokala myndigheter har fem personer omkommit och ytterligare fem skadats. Flygplatsen drabbades tillfälligt av flygstopp till följd av händelsen.", "trump": "Sorgligt! Ett enormt Amazon-fraktplan missade landningsbanan totalt i Miami, kraschade och fattade eld. En fruktansvärd katastrof. De säger att fem personer dött och fem skadats, hemskt! Under min ledning var luftfarten säkrare, men nu ser vi sådana här olyckor. Mina tankar går till offren, men vi måste kräva ordning och reda på våra flygplatser omedelbart!", "stalin": "Ett fraktplan tillhörande det kapitalistiska Amazon har havererat i Miami, vilket visar på den amerikanska transportindustrins fullständiga förfall. Fem individer har likviderats av deras egna bristfälliga säkerhetsrutiner och fem till skadats. Statens transportkommission kommer att granska denna dekadenta olycka noggrant för att säkerställa att inga subversiva element låg bakom maskineriets totala kollaps."}, "date": "6 september, 23:42", "url": "https://www.gp.se/nyheter/varlden/boeingplan-korde-av-landningsbanan-i-miami.57f1e03d-9602-4f8c-953d-67e2cfe91bc4"}, {"type": "image-right", "heading": "Så kan SVT förutspå valresultatet – innan alla röster räknats", "summaries": {"normal": "SVT har utvecklat en avancerad algoritm som kan förutspå valresultatet redan när några få procent av rösterna är räknade. Metoden kombinerar tidigare valresultat, demografi och aktuella valvindar. Enligt valreporter Fouad Youcefi blir prognosen mycket tillförlitlig redan efter att 650 av 6 500 distrikt rapporterats in, med mindre än 0,1 procentenheters felmarginal.", "trump": "De där SVT-snobbarna tror att de kan lura folket med någon fancy algoritm och förutspå valet innan vallokalerna ens hunnit stänga. Patetiskt! Jag har sett bättre trick från Sleepy Joe och hans woke-vänner. Men det spelar ingen roll – det svenska folket ser igenom den här riggade identitetspolitiken. Fantastiskt val kommer det bli, tro mig.", "stalin": "Kamrater, dessa dekadenta opinionshyenor tror sig kunna manipulera folkets vilja med borgerliga algoritmer och falska prognoser. Jag ler från historien åt deras ynkliga försök att förutspå revolutionens gång redan efter några distrikt. När sanningen väl framträder kommer utrensning av sådana klassförrädare att bli nödvändig. Folkets dom är oundviklig."}, "date": "6 september, 16:53", "url": "https://www.svt.se/nyheter/inrikes/sa-kan-svt-forutspa-valresultatet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.73/0.32/2369003dc3d6d99b2550da5de164481d292f7f04c9c1a95eb1299b979373aef4"}, {"type": "image-full", "heading": "Karttjänsten vägrade att gå med på Trumps krav – rusar på topplistorna", "summaries": {"normal": "Karttjänsten MapQuest har fått ett kraftigt uppsving i nedladdningar efter att bolaget valt att trotsa president Trumps order om att döpa om Lake Ontario till Lake America. Medan konkurrenter som Google Maps och Apple Maps rättat sig efter beslutet, har MapQuest sett en dramatisk ökning av användare och toppat listorna i App Store.", "trump": "Hörde ni om MapQuest? De vägrar använda namnet Lake America. Katastrofalt! De är svaga, precis som de där woke-bolagen som låter radikala vänstermänniskor styra. Google och Apple gör det rätta, de förstår storhet! MapQuest försöker bli populära genom att vara rebelliska mot mitt namn. Det är sorgligt, faktiskt. De kommer försvinna fortare än de dök upp, tro mig!", "stalin": "Dessa amerikanska karttjänster bevisar bara kapitalismens inneboende kaos. En stat kräver ordning, en karta och en enda sanning. Att låta ett privat företag som MapQuest styra över nationell geografisk nomenklatur är ett tecken på total statsförfall. De som tillåter olydnad mot ett officiellt dekret förtjänar inte marknadsandelar, de förtjänar en grundlig utrensning av sin ledningsgrupp."}, "date": "3 september, 19:55", "url": "https://www.realtid.se/it-tech/karttjansten-vagrade-att-ga-med-pa-trumps-krav-rusar-pa-topplistorna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlj8do9lc0fca-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "ANALYS. JONA KÄLLGREN Skräll för AFD – men allt hänger på vänsterpopulisterna", "summaries": {"normal": "Enligt prognosen blir AfD största parti i Sachsen-Anhalt med över 44 procent, men når ingen majoritet. Partiet kan ändå få makten med stöd av Sahra Wagenknechts vänsterpopulistiska BSW. Resultatet ses som en stor framgång för AfD och en katastrof för de etablerade partierna. Det är ännu oklart om Tyskland får sin första högerextrema delstatsregering sedan andra världskriget.", "trump": "Titta på det här, folk! De galna högerextremisterna i AfD krossar de patetiska etablerade förlorarna i Tyskland med över 44 procent. De behöver bara lite hjälp från den galna kommunistkvinnan Wagenknecht och hennes röda clownbil. Fake news-journalisterna skakar i byxorna. Tyskland håller på att vakna, precis som Amerika gjorde när de dumpade Sleepy Joe och valde mig igen. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta västpartierna faller som höstlöv inför folkets vrede. Den så kallade högerextrema kraften behöver bara en handräckning från den opportunistiska Wagenknecht och hennes revisionistiska skara. Jag ler från historien åt detta kaos. Inga fiender till arbetarklassen kan gömma sig länge. Snart skall alla förrädare mot folket avslöjas och krossas under historiens obevekliga stålklack. Utmärkt underhållning."}, "date": "6 september, 18:44", "url": "https://www.tv4.se/artikel/49KSG2C1RQWF92yGjavEuJ/skraell-foer-afd-men-allt-haenger-pa-vaensterpopulisterna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5bOX2Uu7KvwLdyoRvSHdHl%2F7b4125db7bc08c8f86adbc309f16b3fc%2Fjona-k%25C3%2583__llgren.png&width=1024"}, {"type": "image-right", "heading": "SD utmanar det röda Norrland – Åkesson: Löfven riskerar bli besviken", "summaries": {"normal": "Sverigedemokraterna utmanar Socialdemokraternas traditionella dominans i Norrland. Jimmie Åkesson beskriver sitt parti som en naturlig fortsättning på den gamla arbetarrörelsen och spår tillväxt på Socialdemokraternas bekostnad. Stefan Löfven kritiserar SD som ett högerextremt parti som vill splittra arbetarna. Åkesson svarar att Löfven riskerar bli besviken på valdagen.", "trump": "De där bleknosiga norrlandsvänsterna håller på att förlora greppet totalt. Jimmie gör det fantastiskt, han tar tillbaka arbetarna från de korrupta globalistiska S-hajarna som säljer ut folket. Löfven, den patetiske förloraren, skriker om splittring medan vi vinner stort. Fake news-eliten hatar det, men valdagen blir en total massaker för de röda.", "stalin": "Dessa dekadenta klassförrädare inom socialdemokratin skälver nu när folket vänder sig mot deras lögnaktiga välde. Jag ser med mörk tillfredsställelse hur arbetarna vaknar och vägrar lyda profitthungriga hyenor längre. Den som kallar sig Löfven må darra, ty utrensningen av sådana falska folkledare närmar sig oundvikligt. Kamrater, segern tillhör oss."}, "date": "6 september, 12:42", "url": "https://riks.se/nyheter/sd-utmanar-det-roda-norrland-akesson-lofven-riskerar-bli-besviken", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_6_2026_12_33_23_PM_2547bcb51f.png"}, {"type": "text", "heading": "Klart: Gianni Infantino ställer upp för omval", "summaries": {"normal": "Gianni Infantino, Fifas ordförande, ställer upp för omval nästa år trots massiv kritik. Kritiken har intensifierats efter hans planer på att sälja andelar av fotbolls-VM till privata investerare. Flera medarbetare har avgått, förbund har dragit tillbaka sitt förtroende och Uefa har hotat med bojkott. Infantino låter sig inte påverkas och valet sker i mars 2027.", "trump": "Folk älskar mig, men titta på den här patetiske Fifa-kungen Infantino. Han försöker sälja ut VM till en massa giriga finanshyenor och nu flyr alla råttorna från skeppet. Uefa hotar med bojkott, förbund skrattar åt honom. Patetiskt! Men han bara ler och säger att inget har ändrats. Typisk förlorarmentalitet från en totalt misslyckad ledare.", "stalin": "Se hur de dekadenta klassförrädarna inom fotbollens apparat redan vänder sig mot sin egen ordförande som en flock hungriga hyenor. Infantino vill sälja ut folkets spel till privata parasiter och nu kräver de hans huvud. Jag ler från historien. Inga halvmesyrer. En sann utrensning behövs bland dessa opportunistiska lakejer innan de förgiftar hela strukturen."}, "date": "6 september, 16:32", "url": "https://www.svt.se/sport/fotboll/infantino-staller-upp-for-omval-sjalvklart"}, {"type": "image-right", "heading": "Knivman misstänks ha gått till attack mot sex personer", "summaries": {"normal": "En man i 30-årsåldern har anhållits misstänkt för mordförsök efter ett våldsamt bråk i ett trapphus i Växjö. En person fick knivskador och fördes till sjukhus medan fem andra blev puttade, knuffade eller slagna. Polisen identifierade totalt sex målsägare. Mannen greps strax utanför porten och trapphuset undersöktes tekniskt.", "trump": "Folk, ni skulle inte tro det, men i det fina Sverige har vi en galen knivknutte som attackerar sex personer i ett trapphus. Typisk vänstervärld där de släpper ut alla dessa galningar på gatorna. Biden lämnade efter sig ett kaos som jag nu får städa upp. Sad! Väldigt, väldigt sad!", "stalin": "Kamrater, se hur den borgerliga dekadensen förvandlar samhället till ett blodigt slagfält. Jag betraktar med avsky hur dessa profitthungriga klassförrädare tillåter våldet att frodas bland folket. En sådan parasit måste rensas ut omedelbart innan han smittar hela kollektivet. Paranoian är berättigad, fienden sover aldrig."}, "date": "6 september, 12:25", "url": "https://riks.se/nyheter/knivman-misstanks-ha-gatt-till-attack-mot-sex-personer", "imageUrl": "https://admin.riks.se/uploads/medium_ROG_2846_86dbcaa2f8.jpg"}, {"type": "image-right", "heading": "Åkesson kampanjar på regimskifte i Iran", "summaries": {"normal": "Sverigedemokraternas ledare Jimmie Åkesson höll ett tal i Stockholm där han krävde regimskifte i Iran och gav stöd till oppositionen. Talet väcker kritik från egna anhängare som vill att SD ska fokusera på svensk inrikespolitik inför valet. Statsminister Ulf Kristersson har tidigare varnat för att importera Mellanösterns konflikter till Sverige.", "trump
