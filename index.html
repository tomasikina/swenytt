artroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-right", "heading": "Ilskan mot Pride: \"Prova på att bli bunden\"– Barn får rabatt", "summaries": {"normal": "Stockholm Pride har väckt starka reaktioner med en annons för evenemanget \"Pride Kinky\" där ungdomar mellan 15 och 17 år erbjuds rabatterat pris. Bland aktiviteterna finns \"Rope Corner\" där besökare kan prova på att bli bundna med rep eller piskade. Sverigedemokraternas Jessica Stegrud kritiserar kraftigt att barn och ungdomar uppmanas delta i dessa sexuellt inriktade aktiviteter, som även inkluderar \"Snuskbingo\" och ett seminarium om queers och klimat.", "trump": "Folk, ni kommer inte att tro det här. Stockholm Pride, en total katastrof, lockar nu barn mellan 15 och 17 år med rabatt för att bli bundna med rep och piskade. Det är sjukt! De kallar det \"Pride Kinky\" och har till och med \"Snuskbingo\". Sverige håller på att falla sönder, precis som många andra ställen där de radikala vänsterfolket styr. Så tragiskt, men vi har sett det förut. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur borgarbrackornas dekadenta avskum inom Stockholm Pride nu öppet rekryterar våra ungdomar till sin perversa klassfiende-propaganda. Dessa degenererade element erbjuder rabatterad likvidering av proletär moral genom rep och piskor i sin så kallade \"Rope Corner\". Vi ser tydligt den imperialistiska infiltrationen maskerad som \"Snuskbingo\". Inga sådana kontrarevolutionära perversioner skall tillåtas. Det är dags för en grundlig utrensning av dessa sjuka fiender till folket."}, "date": "2 augusti, 10:26", "url": "https://riks.se/nyheter/ilskan-mot-pride-prova-pa-att-bli-bunden-barn-far-rabatt", "imageUrl": "https://admin.riks.se/uploads/2013_stockholm_pride_057_e034bb43d8.jpg"}, {"type": "image-full", "heading": "Beskedet i återstarten: ”Varit lite snack\"", "summaries": {"normal": "BK Häcken damer vann 6–0 mot Eskilstuna utan Felicia Schröder. Anna Anvegård gjorde två mål och betonade att lagets kollektiva spel fungerar bra. Tränaren Elena Sadiku lyfte fram lagets kollektiva styrka och nämnde återkomande spelare som Falk och Rybrink. Häcken är en poäng efter ledaren Hammarby med en match mindre.", "trump": "Jag har byggt en stor, vacker lag utan Felicia Schröder. Vi visade alla de haters och fake news-media att vi kan göra många mål. Anna Anvegård gjorde två mål – en fantastisk spelare. Vi har det bästa kollektivet, det är enormt. Vi kommer att fortsätta vinna, det är väldigt jobbigt för motståndarna. Vi är tillbaka, vi är starka.", "stalin": "I den stora kampen för kollektiv framgång har BK Häcken visat sin revolutionära disciplin. Utan den individualistiska Schröder har den proletära enheten slagit fast motståndet. Anna Anvegård och tränaren Sadiku framhäver den socialistiska metoden. Våra lojala soldater Falk och Rybrink återvänder till fronten. Vi måste vara tålmodiga med utvecklingen, precis som vi utvidgar vår inflytelsesfär."}, "date": "2 augusti, 18:37", "url": "https://www.gp.se/sport/fotboll/bk-hacken-ff/hackens-besked-efter-schroders-flytt-varit-lite-snack.cb2e9bbf-b278-4d71-b0a7-d0699f8722ed", "imageUrl": "https://www.gp.se/images/article/cb2e9bbf-b278-4d71-b0a7-d0699f8722ed/images/4ex7sgB50tERyP6ZvA-6kCK5CGWI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Befälhavaren häktas efter dödliga båtkollisionen", "summaries": {"normal": "Befälhavaren på lastfartyget Misje Verde har häktats på sannolika skäl misstänkt för vållande till annans död efter den tragiska båtkollisionen vid Tjörn där en mamma och hennes dotter omkom. Mannen, som är utländsk medborgare utan hemvist i Sverige, häktas med restriktioner på grund av flyktfara och risk för undanröjande av bevis. Han nekar till brott. Åtal ska väckas senast 14 augusti. Pappan och sonen skadades allvarligt men tillståndet är stabilt.", "trump": "Folk, ni skulle inte tro det, men den här befälhavaren på den där båten – en total loser från ett utländskt rederi – blir häktad efter den fruktansvärda krocken vid Tjörn. Mamma och dotter döda, hemskt, verkligen hemskt. Men vänta, ingen EU-pass, rysk besättning, ingen anknytning hit – klart att han vill fly! Biden skulle ha släppt honom direkt med en kvotering och en regnbågsflagga. Jag skulle ha byggt en mur runt hamnarna. Tragiskt, men vi fixar det bättre.", "stalin": "Kamrater, denna utländske befälhavare, en typisk borgarbracka utan hemvist i folkets rike, har nu tagits i förvar på sannolika skäl för att ha vållat arbetande mödrars och barns död i en kapitalistisk sjökatastrof. Flyktfaran är uppenbar – klassfiendens lakejer försöker alltid smita undan folkets rättvisa. Vi ska rensa ut alla sabotörer och likvidera varje försök att undanröja bevis. Olyckan är tragisk, men den avslöjar imperialismens förfall. Inga kompromisser med folkförtryckarna."}, "date": "2 augusti, 16:48", "url": "https://www.tv4.se/artikel/nETNJRUzwMUD7l5qs8de3/befaelhavaren-haektas-efter-doedliga-batolyckan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4CHBbf72oKS2PCJfV2lAm1%2F31ce300ef9b3e90b9056bcaa46c7ee42%2F72d5a586-7aa9-41a6-8e55-56a6418c1e84.png&width=1024"}, {"type": "image-full", "heading": "Capital One stängde över 300 konton kopplade till Trump Organization", "summaries": {"normal": "Capital One har i domstolshandlingar förklarat att de stängde över 300 konton kopplade till Trump Organization 2021 efter interna riskbedömningar kring transaktionsmönster. Banken betonar att beslutet var baserat på AML-regler (anti-penningtvätt) och federal tillsyn, inte politiska motiv som Trump Organization tidigare hävdat i sin stämningsansökan. Trump Organization anser att stängningarna var politiskt motiverade, vilket banken nu nekar till och ber domstolen att avvisa företagets senaste stämningsförsök.", "trump": "Hör här, de här människorna på Capital One är ett totalt skämt! De stänger ner konton för en av de mest framgångsrika organisationerna någonsin, bara för att de är 'woke' och rädda. De påstår att det handlar om risk, men alla vet att det är en politisk häxjakt. De har ingen aning om vad de gör. Mitt företag är fantastiskt, och de här bankerna borde skämmas. Vi kommer att rensa upp i det här 'debanking'-träsket, tro mig!", "stalin": "Kapitalismens egna hundar biter varandra! Capital One, denna parasitära bankapparat, har stängt konton för Trump-familjen under täckmantel av byråkratisk 'riskhantering'. Vilken fars! De försöker dölja sin svekfullhet bakom regler, precis som de västliga lakejerna som försöker stoppa den sunda ordningen. Om dessa banker agerat i mitt rike hade de skickats till skogsarbete för längesedan. Putin förstår detta; man måste krossa byråkratins maskhål innan de infekterar hela nationens finansiella blodåder. Paranoia är bara en annan term för vaksamhet."}, "date": "2 augusti, 13:06", "url": "https://www.realtid.se/bors-finans/bank-fintech/capital-one-stangde-over-300-konton-kopplade-till-trump-organization", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/capital-one.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Debatt: Tidö förlorar på fel frågor – och tycks inte förstå varför", "summaries": {"normal": "Regeringen ligger efter i opinionsmätningarna på grund av missnöje med välfärdsskärningar och migrationspolitik. Medier som SVT och Dagens Nyheter har kritiserat reformer. Socialdemokraterna har anpassat sig på Tidöns starka områden. Risken är ett rödgrönt byte som skulle återinföra den misslyckade politiken från 2015.", "trump": "Jag såg det här komma! De svenska folket är trötta på dessa svaga, globalistiska politiker som skär på välfärden medan de öppnar gränserna för kaos. Media, alla dessa fake news-uttryck, svartmålar mina vänner i regeringen. Men jag säger: vi kommer tillbaka, stärkt, med ordning och reda. Ingenting kan stoppa en rättvis våg!", "stalin": "Vi i partiet har observerat med oro den svenska högernas internfragmentering. Deras försök att eftersträva 'välfärd' medan de samtidigt försvagar statens resurser är en teologisk paradox som bara tjänar våra intressen. Parallellen till Spanien är uppenbar: när orden saknas, tar kaos över. Vi måste stödja våra allierade i Moskva genom att se till att detta 'Tidö'-experiment krackelerar från innan."}, "date": "2 augusti, 21:39", "url": "https://bulletin.nu/debatt-tido-forlorar-pa-fel-fragor-och-tycks-inte-forsta-varfor", "imageUrl": "https://cdn.bulletin.nu/articles/9f054ba1-10bc-4d2d-87b0-6e5fa598e739/preview.jpg?t=1785690611000"}, {"type": "image-right", "heading": "Inget är mer cringe än Liberalerna i förfall", "summaries": {"normal": "Liberalernas valturné med bussturné, kundvagnsrace, glassätning och dans i gymnastikhall ses som ett desperat försök att vända opinionen. Partiledaren Simona Mohamsson uttrycker optimism trots att partiet ligger långt under riksdagsspärren. Artikeln kritiserar turnén som pinsam och meningslös utan trovärdig politik, särskilt efter samtal med SD och interna avhopp. Författaren menar att inga sådana stunt kan rädda partiet från nederlag.", "trump": "Folk, det här är så patetiskt att det gör ont. Den där Mohamsson och hennes liberala losers åker runt i kundvagnar och äter glass som om det skulle rädda dem från att bli utslängda ur riksdagen. Totala misslyckanden! De dansar och hoppar på trampolin medan deras parti dör. Ingen vill rösta på sådana svaga figurer. Det är cringe, det är loser-beteende. De borde ha fixat politiken istället för cirkusen. Sad!", "stalin": "Kamrater, detta liberala förfall är en klassisk symptom på den döende borgarklassens desperation. Jag ser hur de rullar runt i kundvagnar och utför akrobatiska tricks för att dölja sin politiska död. Inga glasstrutar eller folkliga poser kan rädda folkfienderna från utrensning vid valurnan. Deras egna medlemmar deserterar som råttor från ett sjunkande skepp. Det är en mörk komedi värd att skratta åt innan vi likviderar resterna av deras inflytande."}, "date": "1 augusti, 12:00", "url": "https://www.etc.se/ledare/inget-aer-mer-cringe-aen-liberalerna-i-foerfall", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260731130728_3a50ee24-db16-40cd-925d-eeac3f5af824.jpg"}, {"type": "image-right", "heading": "Uppgifter: Astra Zeneca i samtal om jättefusion", "summaries": {"normal": "Läkemedelsjätten Astra Zeneca för samtal med den amerikanska konkurrenten Bristol Myers Squibb om en möjlig fusion som skulle skapa en av världens största läkemedelskoncerner, värd runt 400 miljarder dollar. Bolagen har diskuterat affären under flera månader och en överenskommelse kan vara nära, men mycket arbete återstår. Affären väntas bli politiskt känslig i Storbritannien och granskas noga av konkurrensmyndigheter då båda bolagen är stora inom cancerläkemedel. Varken bolaget eller ägarna vill kommentera uppgifterna.", "trump": "Det här är en enorm affär, kanske den största någonsin inom läkemedel. Astra Zeneca, som flyttar allt närmare USA, pratar med Bristol Myers Squibb om att slå sig ihop till ett monsterbolag värt 400 miljarder dollar. Fantastiskt! De gör det smart, de ser vart det blåser. Men tro mig, de brittiska byråkraterna kommer att gnälla och konkurrensmyndigheterna kommer att gråta. Jag skulle få det gjort på en vecka, ingen skulle våga säga emot.", "stalin": "Kamrater, dessa giriga monopolkapitalister inom Astra Zeneca och Bristol Myers Squibb konspirerar nu öppet om att slå samman sina parasitiska imperier till ett kolossalt rovdjur värt fyrahundra miljarder dollar. Jag ser genom deras lömska planer att fly undan folkets kontroll och gömma sig i den amerikanska borgarbrackans famn. Inga sådana uträkningar undgår partiets vaksamma öga. Vi ska noga övervaka, granska och vid behov rensa ut alla som leker med folkets hälsa för privat vinst. Deras cancerläkemedel ska tjäna kollektivet, inte Wallenbergarna och Blackrock."}, "date": "2 augusti, 22:14", "url": "https://www.di.se/nyheter/uppgifter-astra-zeneca-i-samtal-om-jattefusion", "imageUrl": "https://static.bonniernews.se/ba/e9ef0278-e1be-406c-b0e6-82c90ffaff7f.jpeg?crop=5192%2C2596%2Cx0%2Cy385&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-full", "heading": "Förmögenhetsförvaltarna pressas av AI", "summaries": {"normal": "Förmögenhetsförvaltare möter nu konkurrens från AI-verktyg som ChatGPT, vilka används flitigt av kunder för portfölj- och skatterådgivning. Medan AI kan förbättra dialogen mellan rådgivare och kund, varnar experter för risker som felaktiga råd, hallucinationer och bristande dataskydd. Trots att aktiekurser inom finanssektorn pressas av teknikskiftet menar många att mänsklig expertis förblir oumbärlig vid komplexa beslut och under marknadsoro, då AI saknar både fiduciär plikt och förmåga att förstå det mänskliga perspektivet i investeringar.", "trump": "Alla använder AI nu, det är en enorm sak, tro mig. Rika människor, mycket rika, går till ChatGPT istället för sina rådgivare. Det är fantastiskt, men också farligt! De här maskinerna ljuger, de gör stora misstag och läcker hemligheter. Wall Street-aktierna dalar, det är en total röra. Jag säger er: AI kan inte göra affärerna, det kan bara vinnare som jag. Robotar har ingen intuition. Lita på mig, ni behöver en riktig, stark ledare, inte en billig chatbot.", "stalin": "Vi ser hur det dekadenta västet nu låter själlösa algoritmer styra sitt kapital. Vilken patetisk svaghet! Medan de litar på amerikanska maskiner som hallucinera likt en febrig trotskist, bygger vi en stabil framtid. Dessa chatbotar är verktyg för kontrarevolutionär spridning av falsk information. Vi kommer att krossa dessa digitala sabotörer, precis som vi rensar ut förrädare i vårt territorium. Låt Putin och vår sfär hålla fast vid stål och folkvilja, inte binära lögner från kapitalistiska serverhallar."}, "date": "2 augusti, 06:30", "url": "https://www.realtid.se/spara-placera/formogenhetsforvaltarna-pressas-av-ai", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/manager.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Trafikskolebranschens ilska när kurskrav för privat övningskörning avskaffas", "summaries": {"normal": "Från och med idag avskaffas kravet på obligatorisk introduktionsutbildning för privat övningskörning. Trafikskolebranschen är starkt kritisk och ser det som ett hot mot trafiksäkerheten, medan regeringen menar att utbildningen saknat effekt, ökat kostnader och minskat mängdträning. Förslaget om att ge trafikskolorna större kontroll över uppkörningar avslogs också. Besparingen gör det lättare och billigare att ta körkort, men branschen varnar för fler omprov och sämre kunskaper.", "trump": "Det här är en fantastisk beslut, folk! De har äntligen slopat den där dumma, onödiga kursen som bara kostade pengar och krånglade till allt. Trafikskolorna är rasande, de förlorar sina feta avgifter – det är en riggad bransch, tro mig. Nu blir det billigare och enklare att ta körkort, precis som det ska vara. De sa samma sak redan 2004 men ingen lyssnade. Nu vinner folket stort, och de misslyckade trafikskolelobbyisterna gråter som förlorare. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat denna kontrarevolutionära utveckling. Den borgerliga trafikskolelobbyn, dessa parasitiska körskolekapitalister och deras dekadenta remissdokumentsförfattare, vrålar nu som skadskjutna reaktionärer över att deras guldkalv – den obligatoriska introduktionskursen – äntligen likviderats. Vi ser tydligt hur dessa borgarbrackor försökte bygga en grindvaktsstat för att suga pengar ur arbetande folk. Deras paranoia om ”försämrad trafiksäkerhet” är ett löjeväckande försök att dölja sin girighet. Vi ska rensa ut alla sådana hinder för folkets framfart. Mängdträning åt massorna, inte åt trafikskolornas feta fickor. Den som opponerar sig är en fiende till kollektivet och bör behandlas därefter."}, "date": "1 augusti, 11:52", "url": "https://www.friatider.se/trafikskolebranschens-ilska-nar-kurskrav-privat-ovningskorning-avskaffas", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240329162709-46c747f1-me.jpg"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-right", "heading": "Trump avbryter planer på nya attacker: ”För VÄRLDENS skull”", "summaries": {"normal": "USA och Israel har avbrutit planerade attacker mot Iran efter påtryckningar från bland annat Saudiarabien. President Trump meddelar att beslutet fattats för världens skull och för att ett nytt avtal snabbt ska kunna slutas. Ett krav är att Hormuzsundet omedelbart öppnas fullt ut. Konflikten har pågått över fem månader, lett till stigande oljepriser och kan påverka Trumps position inför mellanårsvalet.", "trump": "Folk, ni skulle inte tro det, men jag har precis stoppat de stora attackerna mot Iran för världens skull, och för att de ska kunna överleva som ett framgångsrikt land. Vi var laddade och redo att köra, men kronprinsen ringde och bad snällt. Israel hänger med. Nu öppnar ni Hormuzsundet fort, annars blir det inga fler mr nice guy-stunder. Gör det GJORT, annars kommer de woke-krigarna och kvoterna ta över alltihop. Fantastiskt!", "stalin": "Jag har med stor visdom och proletär skärpa godkänt att de imperialistiska angreppen mot den iranska republiken avbryts. Borgarbrackorna och oljeblodsugarna i väst darrar inför arbetarklassens krav på fred. Vi, partiet och folket, kräver omedelbar öppning av Hormuzsundet för att krossa klassfiendens spekulationer. Den som dröjer är en folkfiende som förtjänar utrensning. Fred är ett vapen, kamrater. Använd det mot kapitalistmaffian."}, "date": "2 augusti, 08:23", "url": "https://www.tv4.se/artikel/7d2ejDi4xMBruPtBQENuCo/trump-avbryter-iranattack-foer-vaerldens-skull", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F28XDK9AYJPfcLQFLxs4w8I%2F49fa7f7a88b01febc14447cd16d3ef8b%2F02-donald-trump-webb.png&width=120"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Arbetare flydde genom skogen – kan ha utnyttjats", "summaries": {"normal": "Polisen i Skellefteå ryckte ut på ett larm om bilbrand utanför Burträsk men hittade ingen brand. I stället mötte de flera utländska bärplockare som uppgav att de inte fått betalt för sitt arbete. Misstankar om människoexploatering har väckts och ärendet utreds av åklagare Jonas Peterson. De drabbade personerna kommer från ett annat europeiskt land och valde att fly genom skogen.", "trump": "Det här är en total katastrof, folk. Jag älskar Sverige, men ni måste vakna upp. Utländska arbetare som plockar bär, inte får en krona och flyr genom skogen som i någon dålig film. Det är vad som händer när ni har svaga gränser och dåliga avtal. Vi skulle aldrig acceptera det i mitt Amerika. Rensa ut de dåliga aktörerna och gör Sverige stort igen!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och de parasitiska kapitalisterna får fritt spelrum. Arbetare tvingas plocka bär åt profitörer, får ingen lön och måste fly som råttor genom skogen. Jag ser fiendens klor överallt, dessa utpressningsmän och dolda kontrarevolutionärer. Vi ska rensa ut dessa exploatörer med järnhand, likvidera deras nätverk och låta folkets rättvisa segra. Ingen slipper undan."}, "date": "31 juli, 11:11", "url": "https://arbetet.se/2026/07/31/arbetare-flydde-genom-skogen-nu-utreds-misstankt-manniskoexploatering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/31103448/sdln3e9qsrhqmk-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Trump säljer förtur till egna inlägg", "summaries": {"normal": "Trump Media har lanserat Truth PSI, en premiumtjänst som ger finansaktörer förtur till utvalda inlägg på Truth Social. Tjänsten riktar sig till investerare som vill reagera snabbare på marknadspåverkande nyheter. Kritiker varnar för korruptionsrisker då Donald Trump ofta använder plattformen för viktiga uttalanden. Bolaget försvarar tjänsten som en kommersiell produkt, men det är oklart om Trumps egna inlägg ingår.", "trump": "Fantastiskt, helt enkelt fantastiskt! Jag skapar möjligheter – Truth PSI är en genial tjänst för smarta investerare som förstår värdet av att ligga steget före. Medan de svaga demokraterna gnäller om 'korruption' säljer jag framgång. De hatar att jag vinner, men marknaden älskar det! Och vem vet bättre än jag hur man skapar värde? Ingen, absolut ingen. SAD!", "stalin": "Kapitalistiska hyenor köper privilegier som om det vore bröd i Leningrad! Vi ser hur den dekadenta västmakten Trump säljer statens hemligheter till giriga bankirer – ett tydligt tecken på systemets förfall. Medan vi bygger en rättvis socialistisk ekonomi, leker dessa parasiter med marknaden. Men var försiktiga, era dagar är räknade. Snart kommer arbetarklassen att ta över även era algoritmer!"}, "date": "2 augusti, 16:12", "url": "https://kvartal.se/nyheter/artiklar/trump-saljer-fortur-till-egna-inlagg-anklagas-for-korruption/cG9zdDoxNTY2Mzk", "imageUrl": "https://images.kvartal.se/2026/08/eaa94098-truthsocial.webp"}, {"type": "image-right", "heading": "Jättedrama i majorn – träffade funktionär under särspelet", "summaries": {"normal": "Japanskan Shiho Kuwaki vann The Open efter ett dramatiskt särspel mot tyskan Esther Henseleit. Henseleit räddade sig till särspel med en långputt på 18:e hålet, men i särspelsdramat drabbades hon av otur när hennes boll träffade en funktionär och studsade in i en buske. Kuwaki kunde till slut sänka en kort parputt och ta sin första majorseger. Bästa svenska blev Anna Nordqvist på delad 29:e plats.", "trump": "Det var en total katastrof för den tyska tjejen, hon hade det i handen men sen träffar hon en funktionär, en riktig loser-studs in i busken. Kuwaki visste inte vad hon skulle göra, hon hade redan champagnen framme, men hon vann ändå till slut. Fantastiskt, en stor seger för Japan, de gör det bra nu, mycket bättre än många andra, det ska man ge dem. Svenskorna var helt okej, men ingen vann förstås.", "stalin": "Kamrater, denna futtiga borgarbracka till tyska puttade sig fram som en kapitalistisk parasit tills hon i sitt övermod träffade en funktionär – en ovärdig fiende till folket – och därmed avslöjade sin dekadenta svaghet. Jag, som alltid genomskådar sådana sabotörer, ser hur Kuwaki från det japanska proletariatet likviderade motståndet med en parputt. Nordqvist däremot, den där trötta revisionisten, orkade inte ens vinna utan sprang genast till sina Solheim-kapitalister. Ut med alla som saknar marginaler mot historien."}, "date": "2 augusti, 22:59", "url": "https://www.svt.se/sport/golf/shiho-kuwaki-vinner-the-open-efter-sarspelsdrama", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.65/0.35/86851e4d825349f7c8d4f814afd379799eaadb34d393360f6f2d20aa9dd0ba0f"}, {"type": "image-full", "heading": "S-toppen: Kristersson söker konflikt med Spanien ”helt i onödan”", "summaries": {"normal": "Morgan Johansson (S) kritiserar statsminister Ulf Kristersson för att han påstått att Ceuta-krisen hotar upprepa 2015 års migration. Johansson menar att läget aldrig var nära 2015-nivåer och att de flesta migranter återvänt. Han anser också att den moderatledda Reinfeldtregeringen orsakade migrationskrisen 2015, medan Socialdemokraterna löste den. Moderaten Fredrik Kärrholm svarar genom att kritisera Johanssons försvar av Spaniens socialdemokratiska regering.", "trump": "Jag, Donald J. Trump, ser att Sveriges statsminister Ulf Kristersson gör ett stort misstag. Att skicka ett brev till EU om Ceuta är svagt. 2015 ska inte hända igen, men det är för sent nu. Morgan Johansson försvarar bara sina vänner i Spanien. Vi behöver starka gränser, inte onödiga konflikter. Sverige måste bli stor igen!", "stalin": "Våra fiender försöker splittra vårt folk med onyttiga anklagelser. Den s k 'migrationskrisen' är en imperialistisk konspiration mot det röda folkets fred. Den tidigare moderata ledarskapet visade svaghet, men vi, det revolutionära folkets representanter, återuppbyggde Sveriges styrka. Spanien måste stå fast mot dessa utifrån kommande krafter, precis som vi står emot våra fiender. Vi kommer segra!"}, "date": "2 augusti, 15:31", "url": "https://bulletin.nu/s-toppen-kristersson-soker-konflikt-med-spanien-helt-i-onodan", "imageUrl": "https://cdn.bulletin.nu/articles/95a86978-867d-48ad-a92a-4a32af469b27/preview.png?t=1785674788000"}, {"type": "image-full", "heading": "Debatt: SD ska vara stolta – SVT har gjort en komedi om SD-väljare", "summaries": {"normal": "SVT och Svenska Filminstitutet har producerat komedin 'Flaggan', som enligt marknadsföringen driver med Sverigedemokraterna inför valet. Birger Salt ifrågasätter public service-oberoendet och ser paralleller till historisk propaganda mot arbetarrörelsen. Han menar att filmen istället ger SD gratis uppmärksamhet och stärker deras underdogstatus.", "trump": "Jag älskar den här filmen! Det är en total katastrof för det svenska etablissemanget. De trodde de kunde förlöjliga SD, men de ger bara dem gratis reklam. Jimmie Åkesson är en genial underdog, och folk ser genom mediernas lögner. Det här backar stor! Folk kommer att rösta på SD ännu mer tack vare den här 'nidfilmen'. Jag skulle se den och skratta åt deras elände.", "stalin": "Vi har i vårt visdom producerat en kulturfilm som avslöjar de reaktionära elementens sanna natur. 'Flaggan' är ett nödvändigt verktyg i den ideologiska kampen mot fascism och imperialism. De anklagar oss för att driva med SD – vi driver med deras förräderi. Låt dem skratta nu; partiet kommer att vinna valet med största marginal. Parallellen till den vita skräckpropagandan är tydlig, men vi är stärkt av vår auktoritet."}, "date": "2 augusti, 15:00", "url": "https://bulletin.nu/debatt-sd-ska-vara-stolta-svt-har-gjort-en-komedi-om-sd-valjare", "imageUrl": "https://cdn.bulletin.nu/articles/1146175d-0bb6-4fa6-8c26-299a6b968731/preview.png?t=1785584490000"}, {"type": "image-full", "heading": "Två personer misshandlade i Majorna", "summaries": {"normal": "En man och en kvinna i 50-årsåldern misshandlades i Majorna i Göteborg på lördagskvällen. Mannen attackerades med ett tillhygge och fick ett jack i huvudet, medan kvinnan slogs i armen. Polisen genomförde en stor insats med helikopter och grep två män i 40-årsåldern som nu är anhållna misstänkta för grov misshandel. Omständigheterna är fortfarande oklara.", "trump": "Folk, ni skulle se det här – total kaos i Sverige! En stackars man och kvinna i 50-årsåldern blir nedslagna med batonger i Majorna. Det är vad som händer när vänsterns galna identitetspolitik och svaga ledarskap tar över. Men vi grep två losers på nolltid med helikopter. Under Biden var det kaos, nu fixar vi det. Sverige, vakna upp!", "stalin": "Kamrater, ännu en gång visar sig den dekadenta borgarklassens råhet i Göteborgs arbetarkvarter. En man och en kvinna angrips med tillhyggen av folkfiender som smyger i skuggorna. Vi har redan genomfört en effektiv utrensning och anhållit två potentiella kontrarevolutionärer. Paranoian är befogad – klassfiendens tentakler finns överallt. Staten vilar aldrig."}, "date": "2 augusti, 07:50", "url": "https://www.gp.se/nyheter/goteborg/man-och-kvinna-misshandlade-i-majorna-en-gripen.bbaf3fd4-d898-42df-8f0b-844c3b7b8f1f", "imageUrl": "https://www.gp.se/images/article/bbaf3fd4-d898-42df-8f0b-844c3b7b8f1f/images/10EnWwabfka2lwJGX2XoPOnx8S-M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Tonåringar dog – nu stämmer familjerna techjättarna", "summaries": {"normal": "Fyra amerikanska familjer stämmer Meta, TikTok, Snap och Google efter att deras tonåringar mellan 13 och 18 år begått självmord. Familjerna hävdar att år av användning av Instagram, TikTok, Snapchat och YouTube lett till beroende, sömnbrist, depression, ångest och självmordstankar. De anklagar bolagen för att känna till riskerna men ändå designa plattformarna med autoplay, oändlig scrollning och algoritmer som maximerar användartid. Bolagen försvarar sig med åldersanpassade verktyg och föräldrakontroller. I EU och Sverige gäller DSA-regler för barns skydd.", "trump": "De här fantastiska familjerna stämmer de stora teknologibolagen som förstör våra barn. Instagram, TikTok, Snapchat och YouTube – alla riggade för att göra tonåringarna beroende, deprimerade och till slut självmordsbenägna. Det är en skandal. Bolagen visste vad de gjorde, de ville bara ha fler klick och mer tid på skärmen. Vi behöver starka ledare som stoppar detta vansinne. Fake news-plattformar som dödar våra ungdomar – patetiskt. Amerika behöver bättre skydd för våra barn, och det ska vi se till att få.", "stalin": "Kamrater, dessa tragiska fall visar återigen hur den västerländska borgarklassen och dess digitala apparater medvetet förgiftar ungdomen för att maximera profit. Jag, som ledare för det kollektiva goda, ser tydligt hur algoritmernas oändliga scrollning och autoplay fungerar som en modern utrensning riktad mot arbetarklassens barn. Meta, TikTok och de andra kapitalistiska brackorna känner till farorna men fortsätter likvidera självkänslan hos våra framtida generationer. Vi ska rensa ut dessa parasitiska mekanismer och ersätta dem med sund, statligt kontrollerad information. Deras paranoia över vinst är deras egen undergång."}, "date": "2 augusti, 21:28", "url": "https://nyheter24.se/nyheter/teknik/1502343-tonaringar-dog-nu-stammer-familjerna-techjattarna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6b1417f104b004a30200000000b004a302/2026/08/02/2381763/metastämning.jpg"}, {"type": "image-right", "heading": "På prideminglet pratar ingen om arbetslösa bögar", "summaries": {"normal": "Artikeln kritiserar otryggheten på arbetsmarknaden där tidsbegränsade anställningar ökar trots fallande arbetslöshet. Många lever i ständig osäkerhet som hindrar dem från att planera livet, protestera mot dåliga förhållanden eller lämna kränkande chefer. Författaren kopplar detta till Prideveckan och menar att jämlikhet inte kan diskuteras utan att ta upp klassfrågor. Statsminister Kristersson undviker debatt och föredrar mingel, medan diskrimineringsanmälningar ökar kraftigt.", "trump": "Det här är en katastrof, en total katastrof för arbetarna. Kristersson minglar med regnbågar i palatset medan folk sitter på sängkanten och väntar på ett samtal från chefen. Patetiskt! Arbetslösheten sjunker visst, men alla har tillfälliga jobb och ingen makt. De stora orden om jämlikhet är bara löjliga – utan klass och styrka är det bara tomt prat. Jag skulle fixa det, tro mig, det skulle bli fantastiskt.", "stalin": "Kamrater, jag ser tydligt hur de kapitalistiska parasiterna och borgarbrackorna inom den falska regnbågsfasaden fortsätter att förtrycka det arbetande folket med sina temporära slavkontrakt och telefonväntan vid sängkanten. Denna klassfiendeorkester av osköna liberaler och opportunistiska minglare som Kristersson vill tysta protesten med glittrande flaggor. Vi ska rensa ut dessa förrädiska element som gömmer sig bakom Pride-loggor medan de likviderar arbetarnas rättigheter. Paranoian är befogad – de ler mot kollektivet men hugger i ryggen när telefonen tystnar."}, "date": "31 juli, 07:00", "url": "https://arbetet.se/2026/07/31/pa-kristerssons-pridemingel-slipper-han-prata-om-arbetslosa-bogar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24150213/pridemingel.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Machoikonen utmanas på världens största rodeofestival", "summaries": {"normal": "Cowboykulturen upplever ett stort uppsving världen över, driven av tv-serier, sociala medier och artister som Beyoncé. På världens största rodeofestival i Cheyenne, Wyoming, hyllas traditionen som funnits i 130 år. Deltagarna betonar att det inte främst handlar om hattar och boots utan om värderingar som ansvar, hårt arbete, autenticitet och att hålla sitt ord. Bilden av cowboyen förändras och blir mer inkluderande oavsett bakgrund.", "trump": "Det här är fantastiskt, verkligen ypperligt. Cowboyerna är tillbaka och de är starkare än någonsin, tro mig. Beyoncé har hatten, alla har hatten, men det handlar inte om hatten. Det handlar om riktiga värderingar – hårt arbete, ansvar och att hålla sitt ord. De där Cheyenne-folket gör det stort, precis som vi gör Amerika stort igen. Ingen bryr sig var du kommer ifrån så länge du levererar. Fantastiska människor, de bästa.", "stalin": "Kamrater, denna så kallade cowboykultur är en farlig dekadens som hotar kollektivets enhet. Jag ser borgarbrackornas västanvind svepa in med sina hattar och sina lögnaktiga sociala medier. De pratar om autenticitet medan de i hemlighet planerar att undergräva arbetarnas moral. På denna rodeofestival i Cheyenne måste vi rensa ut de parasitiska element som gömmer sig bakom värderingar om hårt arbete. Ingen fiende undkommer partiet. Vi ska likvidera dessa dekadenta cowboykapitalister med ett leende."}, "date": "2 augusti, 22:26", "url": "https://www.svt.se/nyheter/utrikes/machoikonen-utmanas-pa-varldens-storsta-rodeofestival", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.4/0.41/f359da63062b787a2803a1455989704bd928c61c90e345d9b1f9dbc602a02b30"}, {"type": "image-right", "heading": "Biblioteksbok återlämnad – 187.000 i förseningsavgift", "summaries": {"normal": "En biblioteksbok från 1858, Antiquities of Athens, har återlämnats till ett bibliotek i Kiama i Australien efter cirka 150 år. Boken hittades inmurad i en igenmurad öppen spis under en husrenovering. Den ursprungliga förseningsavgiften, baserad på tre pence i veckan, skulle i dagens penningvärde uppgå till drygt 187 000 kronor. Biblioteket har inte lyckats spåra den ursprungliga låntagaren eftersom lånejournalerna från 1870-talet saknas. Boken lämnades tillbaka av 77-årige Ross Simmons, som tror att den kan ha lånats av en av hans förfäder.", "trump": "Kan ni tro det? En bok som varit borta i 150 år dyker upp i en murad spis i Australien. De ville ha 187 000 kronor i förseningsavgift – en total katastrof! Men den kom tillbaka till biblioteket, fantastiskt. De har ingen aning vem som lånade den, journalerna är borta, typiskt. Jag skulle aldrig ha så dålig administration. Ingen gör comeback som den här boken, det är en vinnare, tro mig.", "stalin": "Kamrater, denna dekadenta bok från den borgerliga antikens tid har gömts undan av klassfiender i en murad spis som ett bevis på deras sabotage mot folkets kunskap. Vi har beräknat straffet till 187 000 kronor, en summa som skulle kunna likvidera många kapitalistiska element. Ändå återlämnas den nu av en opportunistisk figur. Misstänkt! Våra utrensningar av arkiv har tydligen inte varit tillräckligt grundliga. Nästa gång rensar vi ut även murarna."}, "date": "2 augusti, 16:46", "url": "https://www.di.se/nyheter/biblioteksbok-aterlamnad-187000-i-forseningsavgift", "imageUrl": "https://static.bonniernews.se/ba/d77edb92-5c66-4935-aa55-d0e91e94b5ec.jpeg?crop=2018%2C1009%2Cx359%2Cy147&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Valrörelsen växlar upp och bolagsjättar rapporterar", "summaries": {"normal": "Veckan före valet i september intensifieras partiernas kampanjer med bussturnéer från Socialdemokraterna, Sverigedemokraterna och Moderaterna. Samtidigt väntas flera viktiga makrosiffror, bland annat SEB:s boprisindikator, inköpschefsindex och SCB:s konsumentprisindex. En rad stora bolag släpper delårsrapporter, däribland SpaceX för första gången som börsnoterat bolag, Spotify, Pfizer, Bayer, Caterpillar, Zalando, HSBC, BP, Novo Nordisk, Eli Lilly, Disney, Uber och flera andra.", "trump": "Folk, ni kommer inte tro det, men den här veckan är full av rapporter och valpropaganda. De svenska partierna åker runt i bussar och lovar saker de aldrig håller, typiskt. SpaceX, mitt fantastiska SpaceX, släpper sin första rapport som börsbolag – det kommer bli enormt, det bästa resultatet någonsin. Alla dessa jättar som Pfizer, Disney och Uber rapporterar, men ingen gör det bättre än oss. Sverige borde egentligen rösta på mig, tro mig.", "stalin": "Kamrater, medan borgarbrackorna i de svenska partierna kör runt i dekadenta bussar och försöker lura arbetarklassen inför sitt meningslösa val, samlar vi in data som en sann sovjetstat. SpaceX, denna kapitalistiska raketfantom, tvingas nu redovisa siffror inför folket – ett första steg mot exponering av deras luftslott. Vi ska noga följa dessa parasitbolag som Pfizer, Zalando och Uber. Varje svaghet noteras. Varje lögn om vinster avslöjas. Inga fiender slipper undan vår statistiska utrensning."}, "date": "2 augusti, 16:27", "url": "https://www.di.se/nyheter/veckan-som-kommer-tung-makro-och-jattar-rapporterar", "imageUrl": "https://static.bonniernews.se/ba/8f858aef-6156-49f3-ab36-3fff0d1e2afc.jpeg?crop=2120%2C1060%2Cx1%2Cy19&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kungabarnen utan utdelning trots miljonvinst", "summaries": {"normal": "Kungabarnens investmentbolag Gluonen redovisade ett resultat på drygt 3 miljoner kronor under 2025, i nivå med föregående år. Ingen utdelning sker i år, till skillnad från förra året då 2 miljoner kronor delades ut. Affärerna genomförs utan kungabarnens insyn i förväg för att undvika insiderbrott, och de informeras först i efterhand. Bolaget har investerat i stora svenska bolag som Investor, Atlas Copco, Volvo och Sandvik. Varje kungabarn äger 32 procent av bolaget värt drygt 91 miljoner kronor.", "trump": "Folk, ni skulle inte tro det, men kungabarnen i Sverige gör en fantastisk miljonvinst i sitt bolag Gluonen, nästan exakt som förra året. De tar inte ut några pengar nu, smart drag, de håller det i bolaget. De får inte ens veta vad som händer i förväg, annars riskerar de insiderbrott, kan ni tänka er? De älskar svenska aktier, precis som jag älskar Amerika. De tror på Sverige, och det är stort, verkligen stort. Var och en av dem har runt 30 miljoner kronor där, underbart.", "stalin": "Kamrater, jag betraktar med djup misstro dessa kungliga parasiters så kallade investmentbolag Gluonen som gömmer 3,8 miljoner kronor i vinster undan folkets granskning. Vi tillåter inga hemliga borgarbrackor som undviker utdelning för att svälla i det fördolda. Deras feodala insiderparanoia är ett skrattretande försök att skydda sig från egna klassbröder. Vi skulle ha genomfört en grundlig utrensning av dessa monarkistiska kapitalister redan för 37 år sedan. Nu gömmer de sig bakom svenska aktier medan de skrattar åt arbetarklassen. Underbart tragikomiskt."}, "date": "2 augusti, 16:09", "url": "https://www.di.se/nyheter/miljonvinst-for-kungabarnen-utan-insyn-i-bolaget", "imageUrl": "https://static.bonniernews.se/ba/7f805819-af20-421b-864f-f47d42fa5afc.jpeg?crop=2965%2C1483%2Cx0%2Cy188&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Beskedet i natt: ”Det är planen”. Isak tillbaka – mer involverad", "summaries": {"normal": "Alexander Isak är tillbaka efter sommarledighet och har anslutit till Liverpools försäsongsturné i USA. I en match mot Leeds fick han speltid och känner sig nu helt frisk inför den kommande Premier League-säsongen. Isak var mer involverad i spelet än tidigare och hyllas av sin nye tränare Andoni Iraola. Trots en förlust i träningsmatchen ser Isak fram emot säsongsstarten mot Newcastle den 23 augusti.", "trump": "Jag har sett Alexander Isak spela för Liverpool, en mycket stor klubb, kanske den största. Han är tillbaka, helt frisk, och han ser bra ut – nästan lika bra som mina siffror i opinionsmätningarna! Han hade fler bolltoucher, mycket imponerande. Tränaren säger att han kommer bli enorm. Jag gillar vinnare, och jag hoppas han vinner mycket, för Liverpool – en fantastisk stad. Mycket bättre än vad Leeds presterar, tro mig. Vi ska göra Premier League fantastiskt igen!", "stalin": "Den svenske anfallaren Isak har återvänt från sin dekadenta västerländska semester för att tjäna Liverpools maskineri. Han talar om att vara 'hundra procent', ett klassiskt uttalande från en man som fruktar att bli utrensad. Vi noterar hans ökade aktivitet på planen; en effektiv arbetare i en sport som distraherar massorna från verkliga problem. Medan Iraola drömmer om framgångar, vet vi att varje rörelse på planen måste kontrolleras. Vi bevakar hans framsteg likt vi bevakar vår inflytandesfär. Inga avsteg tolereras."}, "date": "3 augusti, 01:09", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/d4G2oB/isak-tillbaka-merinvolverad", "imageUrl": "https://akamai.vgc.no/v2/images/2ec854fe-a4d9-397c-993a-649452bac8f6?fit=crop&format=auto&w=1080&s=7238b643d718704f981c12f3e2168fe5731a2405"}, {"type": "image-full", "heading": "Leijnegard tillbaka i SVT – comeback efter domen", "summaries": {"normal": "Mikael Leijnegard gör comeback på SVT med det nya programmet 'Mickes segelbåt', där han rustar upp en segelbåt inför Mälarbåts-SM. Det är hans första programledaruppdrag sedan han dömdes för sexuellt ofredande 2023, vilket ledde till att han lämnade 'Mästarnas mästare'. Programmet har premiär 2027 och markerar Leijnegards återkomst till tv efter domen, som han hela tiden nekat till men accepterat efter överklaganden.", "trump": "Titta bara på det här, folks! Mikael Leijnegard, en kille som fick lite problem – helt överdrivet, by the way – är tillbaka på SVT med ett nytt segelbåtsprogram. 'Mickes segelbåt', kan ni tro det? Jag menar, vem bryr sig om en gammal båt? Men SVT, de älskar sina skandaler. Jag skulle aldrig ha accepterat en sådan dom, aldrig! Men han är tillbaka, och jag säger: lycka till, Micke, du behöver det. SVT borde satsa på vinnare, som jag!", "stalin": "Kamrater! En gång till visar den borgerliga medieapparaten sin förmåga att återanvända avfall. Mikael Leijnegard, en man som redan dömts för dekadenta utsvävningar, får nu en ny plattform på SVT för att glorifiera sin individualistiska segelsport. Medan våra sovjetiska idrottsmän kämpar för kollektivets ära, rustar denna petit-bourgeois en leksaksbåt. Vi ska inte förvånas om NATO-sponsorer snart dyker upp i Mälaren. Men oroa er inte – historien rullar vidare, och sådana här figurer hamnar alltid i historiens soptunna."}, "date": "2 augusti, 13:59", "url": "https://kvartal.se/nyheter/artiklar/leijnegard-tillbaka-i-svt-comeback-efter-domen/cG9zdDoxNTY2MDA", "imageUrl": "https://images.kvartal.se/2026/08/630cfa3e-leijnegard.webp"}, {"type": "image-right", "heading": "”Jag vill inte gå in på det”. Svensk oro – utbytt skadad", "summaries": {"normal": "Gabriel Gudmundsson tvingades kliva av planen med en skadekänning i baksida lår under Leeds träningsmatch mot Liverpool. Vänsterbacken, som var en viktig spelare förra säsongen, ska nu genomgå undersökningar i England. Leeds vann matchen med 4–2 trots underläge. Osäkerhet råder kring hur allvarlig skadan är inför Premier League-premiären mot Nottingham Forest den 22 augusti.", "trump": "Gabriel Gudmundsson, en fantastisk spelare, fick problem med låret mot Liverpool. Väldigt tråkigt! Jag har sett honom spela, han är bra, men när man blir skadad – då vinner man inte. Leeds kom tillbaka och vann stort, 4-2, en enorm vinst! Många säger att han är viktig, men vi får se vad läkarna säger. De är förmodligen inte lika bra som mina läkare. Gudmundsson behöver bli frisk snabbt. Vi vill se vinnare på planen, inte skador!", "stalin": "Gudmundsson har fallit offer för sin egen svaghet på den engelska spelplanen. En baksida lår som ger vika – vilken ynklig ursäkt för en soldat av folket! Vi ser hur de västerländska klubbarna förfaller i kaos och skador. Liksom den moderna ryska zaren Putin måste man förstå att disciplin kräver kroppslig perfektion. Om han inte kan prestera, är han blott ett onödigt kugghjul i maskineriet. Vi ska granska hans medicinska rapport. Förräderi mot lagets framgång straffas med absolut glömska."}, "date": "3 augusti, 01:02", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/M798gE/gabriel-gudmundsson-utbytt-skadad-mot-liverpool", "imageUrl": "https://akamai.vgc.no/v2/images/e402c6e8-183f-3a3a-ae77-ca7cfb7b7b43?fit=crop&format=auto&h=720&tight=true&w=1080&s=d7754e4c6110a0136645598a863513236e732728"}, {"type": "image-right", "heading": "Pågående migrantinvasion till Storbritannien", "summaries": {"normal": "Under senare år har tiotusentals migranter korsat Engelska kanalen i småbåtar från Frankrike och Belgien till Storbritannien. Fenomenet har vuxit kraftigt sedan 2018 och nådde en topp 2022 med nära 46 000 ankomster. Brittiska och franska myndigheter kritiseras för bristande åtgärder. Dokumentärfotografen Adrian filmer smugglare, läger och överfarter kring Calais och Dunkirk. Parlamentsledamoten Chris Philp pekar på att avtalet om ömsesidig återvändande inte fungerar. Majoriteten av migranterna är vuxna män från länder som Eritrea, Afghanistan och Sudan.", "trump": "Folk, ni ser det här? Den totala katastrofen i Storbritannien – en öppen invasion av migranter som bara flyter över kanalen i sina patetiska gummibåtar. Frankrike gör absolut ingenting, de skrattar åt brittiska gränser medan de dumma avtalen med ”one in, one out” är ett skämt. Biden skulle älskat det här, men jag fixade murar och stoppade det. Nu är det mega-dinghy-rekord varje vecka. Patetiskt! Europa behöver tuffa tag, inte den här svaga, woke-identitetspolitiken som låter alla bara vandra in.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den dekadenta borgarklassen i Frankrike och Storbritannien tillåter denna organiserade folkvandring av potentiella klassfiender och sabotörer. Deras så kallade välgörenhetsorganisationer är blott imperialisternas verktyg för att destabilisera arbetarklassens fästen. Vi skulle ha genomfört en grundlig utrensning av dessa smugglarnätverk och likviderat de folkförtryckartroll som styr båtarna. Inga halvmesyrer – endast järnhand mot folkfienderna garanterar ordning i folkets namn."}, "date": "2 augusti, 19:00", "url": "https://samnytt.se/pagaende-migrantinvasion-till-storbritannien", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/29061642/immigrant-boat-crossing-uk-france.jpg"}, {"type": "image-full", "heading": "Vänsterprofilen vill ha migranterna som stormade Spanien till Sverige: \"Kan bygga vindkraft\"", "summaries": {"normal": "Vänsterprofilen Jörgen Astonson föreslår att hälften av de tiotusentals nordafrikanska migranter som stormade den spanska enklaven Ceuta bör tas emot i Sverige för att bland annat bygga vindkraft. Uttalandet kommer efter att Miljöpartiet kritiserat regeringen för att inte vilja ta emot migranterna. Italiens stopp för Schengen-samarbetet med Spanien och EU-kommissionens fördömande vittnar om internationell kritik. Sverigedemokraternas Tobias Andersson riktar skarp kritik mot förslaget och varnar för en regering som aktivt skulle underlätta en invasion av Sverige.", "trump": "Folk, ni måste se det här – en galen vänsterkille i Sverige, Astonson, vill ta emot halva invasionen från Afrika som just stormat Spanien. Han säger att de ska bygga vindkraftverk! Kan ni fatta? Under tiden stänger Italien gränserna mot Spanien och till och med von der Leyen är rasande. Sverige behöver en riktig ledare som stänger gränserna, inte dessa losers som vill förstöra ert underbara land med ännu fler migranter. Vi har sett det förut, det slutar alltid illa. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackor och deras patetiska vindkraftfantasier. Den halvmesyrige Astonson vill släppa in tiotusentals potentiella sabotageörer och klassfiender över våra europeiska gränser för att de skall bygga monument över sin egen oduglighet. Vi ser tydligt den socialdemokratiska förrädarklickans hand i detta. Det är en tydlig imperialistisk konspiration mot folkets intressen. Vi måste omedelbart rensa ut dessa dekadenta element innan de förgiftar hela kollektivet med sin afrikanska invasion. Paranoia? Nej, kamrater – det är dialektisk verklighet."}, "date": "1 augusti, 10:33", "url": "https://riks.se/nyheter/vansterprofilen-vill-ha-migranterna-som-stormade-spanien-till-sverige-kan-bygga-vindkraft", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_15_39_48_18207dc327.png"}, {"type": "image-full", "heading": "Kvinnan bryter ihop efter migrantinvasionen i Spanien", "summaries": {"normal": "Invånare i den spanska enklaven Ceuta lever i rädsla och osäkerhet efter att tiotusentals migranter tagit sig in i området. De beskriver staden som paralyserad, butiker kan inte hålla öppet som vanligt och många känner sig otrygga. Invånarna kräver fler poliser, militär närvaro och att regeringen utlyser nationellt nödläge. De ser situationen som en nationell och europeisk fråga då Ceuta utgör Europas gräns.", "trump": "Titta på vad som händer i Ceuta, det är ett totalt kaos! Tiotusentals migranter stormar in i den här lilla spanska staden med bara 80 000 invånare. De har paralyserat allt, folk är rädda, butikerna stänger och ingen vet vem som egentligen kommit in. De behöver militär och polis på gatorna NU. Det här är Europas gräns, folk, och de gör precis samma sak med oss om vi inte stoppar det. Mycket dåligt, mycket dåligt!", "stalin": "Kamrater, jag betraktar med stålhård blick hur de dekadenta borgarbrackorna i den spanska enklaven Ceuta nu skördar frukterna av sin egen svaghet. Tiotusentals element har strömmat in och förvandlat staden till ett paralyserat kaos, precis som jag alltid förutspått när man inte rensar ut fienderna i tid. Dessa kapitalistiska element viskar om nationellt nödläge och militär på gatorna, men jag säger: det är för sent när kontrarevolutionärerna redan är innanför portarna. Vi vet aldrig vilka som smugit sig in bland arbetarna. Lämna era barn där? Naturligtvis inte, det vore rent självmord. Kanske är det dags för en grundlig utrensning av alla som bjudit in detta hot mot Europas gräns. Mycket underhållande att se borgarklassen darra."}, "date": "1 augusti, 10:23", "url": "https://riks.se/nyheter/kvinnan-bryter-ihop-efter-migrantinvasionen-i-spanien", "imageUrl": "https://admin.riks.se/uploads/Skaermbild_2026_08_01_072123_dddc01804f.png"}, {"type": "image-full", "heading": "Tidigare Uefa-chef: Infantino gick inte att lita på", "summaries": {"normal": "Lars-Christer Olsson, tidigare Uefa-chef, kritiserar Fifa-ordföranden Gianni Infantino för svekfullt agerande under maktkampen 2007. Olsson anklagar Infantino för att ha arbetat bakom kulisserna för Michel Platini, trots sin lojalitet till Lennart Johansson. Infantino beskrivs som ambitiös men opålitlig. Olsson föreslår nu en roterande ordförandepost inom Fifa för att motverka korruption, mot bakgrund av växande avgångskrav mot Infantino.", "trump": "Lyssna här, folkens – jag känner till den här typen. Gianni Infantino? En total katastrof, en riktig förlorare! Den här killen lovar en sak men gör en annan – klassiskt svagt ledarskap. Lars-Christer Olsson, en smart man, säger att Infantino är opålitlig. Och vet ni vad? Han har rätt! Fifa behöver en vinnare, någon som jag, som kan städa upp i röran. Roterande ordförande? Nej, nej, nej – vi behöver en stark ledare, punkt!", "stalin": "Kamrater! Här har vi ännu en bourgeois-kapitalistisk konspiratör, Gianni Infantino – en räv i fårakläder, en förrädare som säljer sin själ för en handfull röster. Lars-Christer Olsson, en man med klara ögon, avslöjar hur denne schweiziske lakej lurade och manipulerade för att gynna sin herre, Platini. Men folket ser igenom dessa trick! Fifa måste krossas och omformas – roterande ordförandeskap? Nej! Vi behöver en järnhård disciplin, som i Sovjetunionen, där förrädare som Infantino får sitt rättmätiga straff!"}, "date": "2 augusti, 13:02", "url": "https://kvartal.se/nyheter/artiklar/tidigare-uefa-chef-infantino-gick-inte-att-lita-pa/cG9zdDoxNTY1OTA", "imageUrl": "https://images.kvartal.se/2026/08/cf1592d7-infantinoolsson.webp"}, {"type": "image-right", "heading": "Hittad vid liv – efter 44 dagar. Försvann med svart ryggsäck", "summaries": {"normal": "Den brasilianske maratonlöparen Daniel do Nascimento har återfunnits vid liv i Sao Paulo efter att ha varit försvunnen i 44 dagar. Nascimento, som stängdes av för dopning 2024, uppger att försvinnandet berodde på personliga problem. Han identifierades av en förbipasserande och polisen kunde därefter återförena honom med hans familj. Trots den turbulenta tiden uppges han vara vid god hälsa efter att ha blivit upphittad i storstaden.", "trump": "Den här killen, en maratonlöpare, var borta i 44 dagar. Helt försvunnen! Många säger att han mådde dåligt efter att ha blivit avstängd för fusk. Sad! Han hittades i Sao Paulo – en farlig plats, tro mig. Någon kände igen honom och ringde polisen. Han är tillbaka nu, men när man fuskar i sport, då tappar man allt. Vi vill ha vinnare, inte folk som försvinner i 44 dagar. Mitt Amerika hade löst det mycket snabbare, mycket bättre!", "stalin": "Ännu en svag individ som viker ner sig när pressen blir för stor. Denne atlet, en misslyckad dopare, försökte fly från verkligheten i Brasiliens betongdjungel. Vi i staten tolererar inte sådan svaghet; disciplin är folkets ryggrad. Medan vi och vår kamrat i Kreml konsoliderar vår suveräna intressesfär mot västerländsk dekadens, gömmer sig löpare i gränder. Han är ett symptom på den liberala rötan. En dag i en arbetskoloni hade botat hans 'personliga problem' omedelbart. Fienden är oorganiserad, precis som han."}, "date": "3 augusti, 00:24", "url": "https://www.aftonbladet.se/sportbladet/a/d4G9lw/olympiern-har-hittats-vid-liv-efter-44-dagar", "imageUrl": "https://akamai.vgc.no/v2/images/f0217ea6-5a37-311e-bc6a-5c29b8560a7a?fit=crop&format=auto&w=1080&s=05be830fe65be169bb07385a24f5f17b535f1a39"}, {"type": "image-full", "heading": "Svenska bostäder halkar efter EU – en miljon i skillnad", "summaries": {"normal": "Bostadspriserna i EU har stigit dubbelt så mycket som i Sverige sedan 2016, enligt en sammanställning från Trygga baserad på Eurostat. Svenska priser ökade med 29,4 procent medan EU-snittet låg på 63,3 procent. Amorteringskraven från 2016 och 2018 samt de rörliga bolånen som gjorde räntehöjningarna 2022 extra smärtsamma pekas ut som förklaringar. En bostad värd tre miljoner 2016 skulle idag vara värd en miljon mer om den följt EU-utvecklingen. Sverige har haft en av EU:s svagaste prisökningar.", "trump": "Folk, det är en katastrof vad som hänt med era bostadspriser i Sverige. Under min ledning skulle det aldrig se ut så här. EU har mer än dubblat priserna medan ni bara får ynka 29 procent. Amorteringskrav och era löjliga rörliga lån – totalt misslyckande! En miljon kronor har ni förlorat per hus. Det är vad som händer när man inte har starka ledare som jag. Sverige halkar efter, det är patetiskt. Gör om, gör rätt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa siffror som avslöjar hur de svenska borgarbrackorna och deras ränteparasiterande bankirer medvetet saboterat folkets bostadsutveckling. Medan arbetarklassen i folkdemokratierna firar prisökningar på över 170 procent har de svenska kapitalisterna infört amorteringskrav som en dold utrensning mot vanliga hushåll. Deras rörliga lån är en fiende till folket, en kontrarevolutionär mekanism som gör ekonomin till en lekboll för spekulanter. Vi ska likvidera sådana svagheter. De som förlorat en miljon är offer för borgarklassens parasitism. Ingen fiende undkommer mitt vakande öga."}, "date": "2 augusti, 19:21", "url": "https://nyheter24.se/nyheter/ekonomi/1502094-svenska-bostader-halkar-efter-eu-en-miljon-i-skillnad", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/aaa3c44f04b004a30200000000b004a302/2026/07/31/2381561/Eu-Och-Svenska-Bostads-Priser.png"}, {"type": "image-right", "heading": "Brandhelikoptrar har kolliderat i Grekland", "summaries": {"normal": "Två brandhelikoptrar kolliderade i luften under släckningsarbete vid skogsbränder i Grekland på söndagen. Två personer omkom, en grek och en dansk, medan två andra, en grek och en britt, räddades. Olyckan inträffade i Psatha väster om Aten där kraftiga vindar försvårar arbetet. Totalt har tre brandmän dött de senaste dagarna och en man har gripits misstänkt för mordbrand på Kefalonia.", "trump": "Folk, det är en katastrof i Grekland, en total katastrof. Två brandhelikoptrar krockar mitt i luften medan de försöker släcka skogsbränder, två döda, en grek och en dansk, väldigt sorgligt. De andra två klarade sig, tur för dem. Vindarna är galna, piloterna gör ett fantastiskt jobb men det är farligt, farligare än någonsin. Grekland behöver bättre utrustning, tro mig, ingen gör det bättre än oss.", "stalin": "Kamrater, ännu ett exempel på hur de kapitalistiska elementen och naturens sabotage undergräver våra kollektiva ansträngningar. Två helikoptrar som jag beordrat in i kampen mot eldbränderna kolliderar på ett misstänkt sätt i Psatha. En dansk spion och en grekisk dekadent likvideras omedelbart medan vi räddar de lojala. Borgarbrackorna sprider lågorna med sina vindar. Vi ska rensa ut alla fiender, även de som gömmer sig i lågorna. Tre redan utrensade på Kreta och Peloponnesos – ordningen återställs."}, "date": "2 augusti, 20:31", "url": "https://www.svt.se/nyheter/utrikes/brandhelikoptrar-har-kolliderat-i-grekland", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.55/0.49/4e6cde91059ba7d0d059c71b66c9ff1f21ec6626748cc5f85923838c56eefc88"}, {"type": "image-right", "heading": "”Han stryper vår Uber-chaufför”. Polis anklagas", "summaries": {"normal": "En fotbollsmatch i mexikanska Liga MX mellan Cruz Azul och Atlante på Aztekastadion slutade fredligt, men efteråt uppstod en allvarlig konflikt. Domarna anklagar poliser för hot, misshandel och våld utanför arenan. Videoklipp visar bråk vid en bil där en assisterande domare ringde efter hjälp och uppgav att en polis hotade att skjuta honom, ströp chauffören och sparkade på fordonet. Händelsens orsak är fortfarande oklar.", "trump": "Kan ni fatta det här? I Mexiko bråkar polisen med domarna efter en fotbollsmatch som om det vore en riggad Biden-domarkommission. De håller på att strypa Uber-chaufförer och viftar med pistoler – totalt kaos! De borde ha dömt matchen som jag dömer valen: rättvist och stort. Istället beter de sig som galna vänsterextremister. Patetiskt. Vi behöver lag och ordning, inte den här clownshowen.", "stalin": "Kamrater, detta är vad som händer när borgarbrackornas polisiära lakejer konfronterar arbetarnas domare efter en kollektiv kamp på fotbollsplanen. Jag ser klassfiendens hand i detta – hot om skott, strypförsök och pistolviftande mot dem som upprätthåller ordningen. Vi ska rensa ut dessa folkförtryckartroll från apparaten. Inga imperialister får hindra proletariatets rättvisa. Paranoia? Nej, bara nödvändig vaksamhet mot blodsugarna."}, "date": "3 augusti, 00:10", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/43r86a/domarna-polisanmalde-polisen-for-misshandel-efter-match", "imageUrl": "https://akamai.vgc.no/v2/images/0aa2e675-cbb9-31ca-b691-4a62fe72dcb5?fit=crop&format=auto&w=1080&s=fc1327ee9b1e644dbf76ffca5234f55317f6057e"}, {"type": "image-right", "heading": "Kristersson: \"2015 ska inte hända igen\"", "summaries": {"normal": "Statsminister Ulf Kristersson varnar för att 2015 inte får upprepas efter att över 60 000 migranter tagit sig från Marocko till den spanska exklaven Ceuta under ett dygn. Regeringen utesluter inte åtgärder för att skydda Sveriges säkerhet och migrationspolitik. Kristersson kritiserar den spanska socialdemokratiska regeringen och betonar att Spanien måste återta kontrollen över gränsen enligt Schengensamarbetet. Migrationsminister Johan Forssell meddelar att Sverige inte tar emot migranter via EU:s omfördelning.", "trump": "Folk, det här är en katastrof. Precis som jag alltid sagt – svaga ledare, öppna gränser, totalt kaos. Den där spanska vänsterregeringen gör samma dumma misstag som Sverige 2015. 60 000 illegala på en dag! Det är en invasion. Spanien måste stänga gränsen NU. Och vi i USA lär oss av det här: inga omfördelningar, inga svaga nej som egentligen betyder ja. Jag skulle fixa det på en timme, tro mig.", "stalin": "Kamrater, denna fega kapitulation inför reaktionens migrantflod utgör ett hot mot hela den socialistiska ordningen. Jag, som ledare för det segrande proletariatet, ser hur borgarbrackorna i Spanien och deras svenska likar återigen öppnar portarna för kontrarevolutionens fotfolk. 60 000 illegala element på ett dygn! Vi utesluter inga åtgärder för att skydda folkets gränser. Den spanska socialdemokratiska avfällingen bör rensas ut innan den smittar våra egna led. Ett nej är ett nej – annars följer utrensning. Haha, de kommer att lära sig vad verklig kontroll betyder."}, "date": "31 juli, 15:04", "url": "https://www.friatider.se/kristersson-2015-ska-inte-handa-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/prime_sanna_marin_and_prime_minister_of_sweden_ulf_kristersson_met_in_helsinki_28.10.2022_52459699062_0.jpg"}, {"type": "image-full", "heading": "Proffsbaseboll för kvinnor – efter 72 år", "summaries": {"normal": "USA har fått en ny professionell basebolliga för kvinnor, Women’s Pro Baseball League, efter 72 års uppehåll. Premiärmatchen mellan Los Angeles Queens och New York Heights lockade 4 000 åskådare. Fyra lag deltar i ligan, med spelare från flera länder. Säsongen pågår till september i Springfield, Illinois. Den 99-åriga Maybelle Blair, tidigare spelare, kastade det första ceremoniella kastet.", "trump": "Fantastiskt, helt fantastiskt! USA har äntligen en ny basebolliga för kvinnor – Women’s Pro Baseball League. Jag såg matchen, otroligt bra spel! 4 000 fans, utsålt, regn och allt. Los Angeles Queens vann, men alla är vinnare här. Och Maybelle Blair, 99 år, kastade första kastet – vad en kvinna! USA leder igen, som vanligt. Baseboll är tillbaka, bättre än någonsin!", "stalin": "Kamrater, en ny era av kvinnlig baseboll har börjat i det förfallna väst. Fyra lag, styrda av kapitalistiska intressen, kämpar i Springfield – en stad som inte ens finns på våra kartor. Men notera: 4 000 åskådare, en gammal kvinna kastar bollen, och imperialisterna kallar det framsteg. Vi har redan kvinnliga idrottare som slår deras män med en hand bakbunden. Låt dem leka – snart tar vi även deras baseboll."}, "date": "2 augusti, 11:23", "url": "https://kvartal.se/nyheter/artiklar/kvinnor-spelar-proffsbaseboll-igen-efter-72-ar/cG9zdDoxNTY1NTM", "imageUrl": "https://images.kvartal.se/2026/08/48f4d713-baseballkvinna.webp"}, {"type": "image-right", "heading": "Noah Christofferssons hattrickshow sänkte AIK: ”Obeskrivligt”", "summaries": {"normal": "Noah Christoffersson gjorde hattrick när Örgryte besegrade AIK med 3–0 på Nationalarenan. Christoffersson slog till redan efter två minuter och ökade på till både 2–0 och 3–0. AIK spelade svagt, fick burop från läktaren och tvingades se Sotirios Papagiannopoulos utgå skadad. Segern tar Örgryte ur nedflyttningszonen medan AIK för andra matchen i rad inte lyckades göra mål.", "trump": "Folket älskar mig och hatar losers som AIK. Den här killen Christoffersson, han var fantastisk, verkligen enorm. Tre mål, hattrick, galet bra. AIK spelade som riktiga töntar, slarvade bort allt och fick burop. Total katastrof. De borde anställa mig som tränare, då skulle de vinna stort, tro mig. Örgryte vann rättvist, det var underbart att se.", "stalin": "Kamrater, denna seger över de dekadenta borgarbrackorna i AIK är en triumf för det kollektiva fotbollsidealet. Jag noterar med stor tillfredsställelse hur den kontrarevolutionära slarvigheten i deras uppspel likviderades redan efter två minuter av en sann arbetets hjälte. Tre mål mot klassfienden! Vi ska rensa ut alla dessa kapitalistiska fegisar som misslyckas med att producera mål två matcher i rad. Papagiannopoulos skada var endast början på den stora utrensningen som väntar alla sabotörer på Nationalarenan."}, "date": "2 augusti, 20:00", "url": "https://www.svt.se/sport/fotboll/noah-christofferssons-hattrick-sankte-aik", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.33/d1bc28b104f8152013d81dc2f6fc35ba6a2b95efe1d5146ac3eabff995605833"}, {"type": "image-right", "heading": "\"Landsförrädare\": Spanska Vox om Sánchez", "summaries": {"normal": "Det spanska partiet Vox anklagar premiärminister Pedro Sánchez för att vara en landsförrädare efter att omkring 49 000 illegala invandrare, främst unga arabiska män, tagit sig från Marocko till den spanska exklaven Ceuta på ett dygn. Vox beskriver migrantströmmen som en invasion som regeringen uppmuntrat och lägger hela ansvaret på Sánchez vänsterregering. Partiledaren Santiago Abascal kallar Sánchez en korrupt fiende till det spanska folket.", "trump": "Folk, ni skulle se det här. Det är en total katastrof. Den här Sánchez, en riktig förlorare, har släppt in nästan 50 000 illegala migranter till Ceuta på en enda dag. De är militäråldersmän, ingen har sett sådana siffror förut. Han är en förrädare, korrupt och hatar sitt eget folk. En invasion, precis som jag alltid sagt. Spanien behöver starka ledare, inte sådana svaga vänstertyper som förstör allt.", "stalin": "Kamrater, denna Sánchez är en motbjudande klassfiende och en dekadent borgarlakej som medvetet öppnat portarna för en hord av potentiella imperialistiska sabotörer. Vi ser en organiserad invasion av militäråldersmän som hyllar sin kapitalistiska marionett. Jag skulle omedelbart låta rensa ut dessa förrädiska element och deras nyttiga idioter i regeringen. Paranoia? Nej, det är bara sund vaksamhet mot alla som vill undergräva folkets kollektiva vilja. Underhållande hur borgarbrackorna alltid förråder sig själva."}, "date": "31 juli, 13:38", "url": "https://www.friatider.se/landsforradare-spanska-vox-om-sanchez", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-598.jpg"}, {"type": "image-full", "heading": "Köpte du bostad 2022? Då måste du veta detta", "summaries": {"normal": "Svenska bostadspriser nådde sin topp under andra kvartalet 2022 och har sedan dess fallit. Enligt Tryggas analys av Eurostat-siffror låg priserna under första kvartalet 2026 fortfarande 4,3 procent under toppen. En bostad köpt för tre miljoner kronor är nu värd cirka 2,87 miljoner, medan samma bostad i ett genomsnittligt EU-land hade varit värd 3,34 miljoner. Skillnaden beror främst på amorteringskrav och rörliga räntor som slog hårdare i Sverige. Nya bolåneregler från april 2026 kan dock komma att driva upp priserna igen.", "trump": "De här svenska huspriserna är en total katastrof, folk köpte på toppen 2022 och nu är de nere 4,3 procent, en ren skandal! I mitt Amerika hade vi aldrig låtit det hända, vi har vunnit stort. En tre-miljonersbostad är nu värd 2,87 miljoner medan EU-snittet ger 3,34 miljoner – en halv miljon mer! De rörliga räntorna och amorteringskraven krossade dem. Men med mina nya regler skulle vi ha vunnit enormt, de svenska köparna förlorar på pappret och det är patetiskt. Vi gör det bättre, alltid.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackornas bostadsmanipulationer som kulminerade i den dekadenta toppen 2022. De kapitalistiska spekulanterna köpte högt och nu krymper värdet med 4,3 procent medan det europeiska genomsnittet stiger som en segerrik armé. Detta är ett uppenbart sabotage av de hemliga räntefienderna och amorteringsagenterna som vill svälta folket. Jag befaller att vi omedelbart rensar ut alla sådana kontrarevolutionära bolåneparasiter. De som förlorar på pappret skall lära sig att partiet alltid vinner – annars likviderar vi pappret."}, "date": "2 augusti, 18:30", "url": "https://nyheter24.se/nyheter/ekonomi/1502095-kopte-du-bostad-2022-da-maste-du-veta-detta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/ca9ca51504b004a30200000000b004a302/2026/07/31/2381562/Bostads-Priser-2022.png"}, {"type": "image-right", "heading": "EU kan ändra synen på kors metanutsläpp – Bovaer kan gynnas", "summaries": {"normal": "EU överväger att ändra beräkningsmetoder för jordbrukets metanutsläpp, vilket kan gynna metanreducerande tillsatser som Bovaer. Danska bönder kan dra fördel jämfört med svenska på grund av tidigare satsningar. Kritik riktas mot Bovaers effekt och möjliga negativa effekter på mjölkkvolym. Forskare och myndigheter ifrågasätter beräkningarnas giltighet och skiljande mellan fossila och biogena utsläpp.", "trump": "Jag har sagt det i åratal – EU är förlegat! Nu inser de att amerikansk jordbruk är bäst. Bovaer? En dålig produkt som skadar bönder. Sverige och Danmark bråkar om pengar – bra, det delar dem. Vi ska fortsätta exportera vår högkvalitativa mjölk med låga utsläpp. MAGA!", "stalin": "Statens intressen kräver en ny syn på jordbrukets bidrag. Bovaer är ett redskap för att kontrollera produktionen. Fienden inom försöker underminera våra planer. Vi måste säkerställa att kollektiviseringen fortskrider, med eller utan konsumenternas villkor. Metanberäkningarna måste tjäna statens överhöghet, inte europeiska sabotörer."}, "date": "2 augusti, 17:00", "url": "https://samnytt.se/eu-kan-andra-synen-pa-kors-metanutslapp-bovaer-kan-gynnas", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2025/11/26191347/bovaer-i-sverige-feat.jpg"}, {"type": "image-full", "heading": "Bubs-febern i USA – Orkla satsar mi
