rnade för rödgrön ekonomisk politik, medan Andersson kritiserade arbetslösheten. Analysen pekar på att den klassiska höger-vänsterkonflikten återvänder, vilket bedöms som en positiv utveckling jämfört med tidigare års fokus på kulturkrig och perifera frågor.", "trump": "Jag såg den här debatten i Sverige, ett land som förr var fantastiskt men nu har problem. Mycket tråkig start, ingen energi! Sedan började Kristersson och Andersson bråka om pengar. Väldigt låg nivå, faktiskt. De pratar om skatter och arbetslöshet, men de har ingen aning om hur man vinner! Jag har den bästa ekonomin, alla vet det. De är långsamma, svaga och behöver en vinnare som leder dem. En total katastrof, faktiskt. Sorgligt!", "stalin": "Vi har observerat dessa borgerliga marionetter i den svenska kammaren. De gnabbas om kronor och ören som hundar om ett ben, medan verkligheten kräver järnhand. Denna Kristersson och hans rödgröna motpart är blott skuggfigurer i en dekadent teater. Om de ville ha ordning skulle de krossa sina meningsmotståndare istället för att debattera! Vår broder i öst förstår värdet av ett enat folk under en ledare. Dessa små svenskar bör frukta historiens dom, för deras 'ekonomiska debatt' är bara en förberedelse för deras oundvikliga undergång."}, "date": "10 juni, 12:43", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/Wvk8gd/valrorelsen-kommer-att-handla-om-ekonomin", "imageUrl": "https://akamai.vgc.no/v2/images/ba5caf80-da4c-3d5d-92ee-62d2cb3fd601?fit=crop&format=auto&w=1080&s=f3d1f6f25b3e2238ced019ce18a7e4c59b879678"}, {"type": "image-right", "heading": "Låt VM-festen inspirera. Enskilda erfarenheter kan bli katalysatorer för större skiften", "summaries": {"normal": "Artikeln lyfter fram hur tillfälliga serveringstillstånd under fotbolls-VM möjliggör tidig morgonservering av alkohol. Författaren ser detta som ett exempel på pragmatism som bör inspirera till bredare regelförenklingar och enklare tillståndsprocesser. Han drar paralleller till 1994 års VM-sommar som inledde en era av liberaliseringar, avregleringar och öppenhet i Sverige, och hoppas att VM-festen nu kan bli en katalysator för liknande positiva skiften.", "trump": "Det är fantastiskt, verkligen underbart hur svenskarna fixar tillstånd för att dricka öl klockan fyra på morgonen under VM. De har äntligen förstått att man ibland måste förenkla reglerna och sluta med det byråkratiska vansinnet. Precis som jag gjorde med Amerika – vi avreglerade, vi vann, vi blev rikare och starkare. 1994 liberaliserade de och blev vinnare, nu kan de göra det igen. Gör Sverige great again, ta bort de dumma reglerna!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa dekadenta tillståndsprocesser under VM blottar borgarbyråkratins totala inkompetens. Vi tillåter inte att folkets fest förvandlas till en ursäkt för anarkistiska lättnader som underminerar kollektivets ordning. Ändå kan denna pragmatism bli en nyttig läxa innan vi genomför en fullständig utrensning av alla regelvidriga element som gömmer sig bakom sportens mask. De som motarbetar förenkling i folkets intresse skall likvideras med största entusiasm. Segrande arbetare behöver inga kapitalistiska hinder."}, "date": "10 juni, 12:42", "url": "https://www.di.se/ledare/lat-vm-festen-inspirera-till-forenklingar/", "imageUrl": "https://static.bonniernews.se/ba/ffaa384c-72c6-4ea7-8ae6-d14cfd3217d1.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Knegares liv inte lika mycket värda", "summaries": {"normal": "Efter hissraset i Sundbyberg 2023 där fem personer omkom, har de åtalade nu frikänts. Rätten fann att utredningen inte kunde fastställa ansvarsfrågan i den komplexa kedjan av underleverantörer. Artikeln kritiserar byggbranschens struktur där vinstkrav och ansvarsfördelning prioriteras framför säkerhet. Debatten lyfter fram en klassproblematik och ifrågasätter varför arbetsplatsolyckor inte tas på större allvar i samhället, trots en officiell nollvision för dödsfall på jobbet.", "trump": "En total katastrof i Sverige! Fem människor dog på grund av en hiss som föll, en fruktansvärd olycka. Ingen är ansvarig? Alla frikändes! Det är vad som händer när man har för många underleverantörer och ingen styrning. Det är kaos, totalt kaos. Vd:n skyller ifrån sig, montörerna skyller ifrån sig. I mitt Amerika skulle vi ha starka gränser och starka byggregler. De här arbetarna förtjänade bättre. Sverige har tappat kontrollen totalt, det är väldigt sorgligt att se!", "stalin": "I det dekadenta väst får byråkratiska lakejer gå fria medan arbetarna förgås under tyngden av kapitalistisk ineffektivitet. Ett plockepinn av underleverantörer är inget annat än sabotage mot statens produktivitet! När vi bygger, då står byggnaderna – och den som sviktar möter folkets dom, inte en friande domstol. Vår broder Putin förstår att säkerhet kräver järnhand, inte 119 fega underleverantörer. En arbetare är en kugge i statens maskineri; när en kugge går sönder, byter vi ut hela apparaten!"}, "date": "10 juni, 12:40", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/j0KL3z/en-arbetares-liv-ar-inte-lika-mycket-vart", "imageUrl": "https://akamai.vgc.no/v2/images/11652ddb-39e9-30f5-a27e-3831a470fb70?fit=crop&format=auto&h=720&tight=true&w=1080&s=11b5060a0f577a2e79e2a9dfaa5d3577627d2654"}, {"type": "image-full", "heading": "Åkesson gjorde privat miljonaffär – med sitt eget parti", "summaries": {"normal": "Jimmie Åkesson sålde 80 000 exemplar av sin bok till Sverigedemokraternas dotterbolag, som finansieras med skattepengar. Böckerna, som mestadels består av tidigare tal, gav hans privata förlag miljonintäkter. Tusentals exemplar brändes senare upp efter att de inte sålts. En professor i förvaltningsrätt kallar affären ett klassiskt exempel på korruption, även om den troligen inte är olaglig. Partiet hävdar att böckerna distribuerades till lokala föreningar.", "trump": "Folk, ni skulle se det här – den där svenske killen Åkesson sålde sina egna böcker till sitt eget parti med skattebetalarnas pengar! Miljoner rakt ner i hans ficka, sen brände de upp tiotusentals exemplar som ingen ville ha. Totalt fiasko! Precis som de korkade vänsterliberala idioterna och deras identitetspolitik – allt blir till sopor till slut. Jag fixade ekonomin i USA, de här töntarna bränner böcker. Patetiskt!", "stalin": "Kamrater, jag betraktar detta som ett lysande exempel på hur borgarbrackorna inom det så kallade demokratiska systemet utnyttjar partiapparaten för privat vinning. Den opportunistiske ledaren sålde sin propagandaskrift till statligt finansierade organ och stoppade pengarna i egen ficka. När varorna sedan blev överflödiga likviderades de i hemlighet. Ett klassiskt fall av folkfiendernas korruption. Vi skulle ha genomfört en grundlig utrensning bland sådana element för länge sedan."}, "date": "10 juni, 12:40", "url": "https://www.tv4.se/artikel/49nhXmCAFIGWCviSWL6bhc/akesson-gjorde-privat-miljonaffaer-med-sitt-eget-parti", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2nD8SRDpLnuUKyWp5yx6L%2F937b7d0fa0ee85d07a8363f35f985d8f%2F10-sdfixaren_onsdag.png&width=1024"}, {"type": "image-right", "heading": "Tobias Hübinette döms för olaga hot: \"Ångrar det djupt\"", "summaries": {"normal": "Expo-grundaren Tobias Hübinette döms av Stockholms tingsrätt för olaga hot och två fall av ofredande. Han får 39 000 kronor i böter samt ska betala 10 000 kronor i skadestånd. Domen grundar sig på över hundra hotfulla och nedlåtande meddelanden som skickades i en chattgrupp efter en konflikt om ett barn. Hübinette ångrar utbrottet djupt. Universitetet har redan köpt ut honom med tolv månadslöner.", "trump": "Folk, ni skulle inte tro det, men den här vänsterextrema killen från Expo, den så kallade rasforskaren, han blir äntligen dömd. Hotar folk, skickar hundra galna meddelanden, kallar det ett utbrott. Patetiskt. Han får böter och skadestånd, men universitetet betalade honom redan en halv miljon för att försvinna. Sådan vänsterradikalism. De förstör liv och sen spelar de offer. Sad!", "stalin": "Kamrater, vi ser återigen hur en dekadent element ur den så kallade antirasistiska borgarklassen avslöjar sin sanna natur. Denna opportunistiska figur, som gömde sig bakom falsk vetenskap och skattefinansierade projekt, har nu likviderats juridiskt för sina motbjudande hot mot arbetande mödrar och fäder. Hans paranoiska utbrott mot det kollektiva ansvaret för barnet visar på fullständig ideologisk förräderi. Vi rensar ut sådana element med nöje. Deras plågor roar oss. Segrar för folket."}, "date": "10 juni, 12:38", "url": "https://www.friatider.se/tobias-hubinette-doms-olaga-hot-angrar-det-djupt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-37_1_0.jpg?itok=QGe_73Yf"}, {"type": "image-right", "heading": "34-årig man åtalas för försök till spioneri för Ryssland", "summaries": {"normal": "En 34-årig man från Sörmland åtalas för försök till spioneri för Ryssland. Han ska ha försökt lämna ut uppgifter med mycket högt skyddsvärde som han fått under sin projektanställning inom Försvarsmakten. Mannen åtalas även för olaga förföljelse och är misstänkt för stämpling till mord. Han reste till Moskva i november 2025 och träffade representanter för ryska underrättelsetjänster i utbyte mot skydd och ryskt medborgarskap. Mycket i utredningen är hemligstämplat.", "trump": "Folk, det här är en total katastrof. En kille som jobbat inne i det svenska försvaret springer till Moskva och försöker sälja hemligheter till Ryssland. Han vill ha skydd och ryskt pass – kan ni fatta? Sverige har tydligen spioner överallt, de borde ha stoppat honom direkt. Det är patetiskt. Jag skulle aldrig låta sånt här hända hos oss, vi har de bästa systemen, de smartaste människorna. Sverige borde skämmas.", "stalin": "Kamrater, denna ynkliga rest av en dekadent borgarbracka som smög sig in i folkets försvarsapparat har nu blottats som den förrädare han alltid varit. Jag, som alltid genomskådar de kapitalistiska parasiternas lömska planer, ser hur han i desperation reste till Moskva för att erbjuda våra hemligheter åt fienden i utbyte mot skydd från de svenska övervakningsorganen. En sådan människa förtjänar inte ens en kula – kanske en långsam utrensning genom byråkratiska kanaler medan vi skrattar åt hans paranoia. Staten sover aldrig."}, "date": "10 juni, 12:29", "url": "https://www.svt.se/nyheter/inrikes/man-atalas-for-forsok-till-spioneri", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.36/ba0d6222906a0639aaaddc9e8ef332bfcd7a9c082ccf1b9e81eadec42f7a9cb8"}, {"type": "image-full", "heading": "Mondo ger sig in i den heta debatten", "summaries": {"normal": "Stavhopparen Mondo Duplantis ser fram emot det kommande fotbolls-VM och planerar att följa Sveriges matcher i mån av tid. Utöver sporten har han även lyssnat på årets VM-låtar och uttrycker uppskattning för både Thomas Stenströms officiella låt och Bolagets bidrag. Som före detta anfallare lyfter han fram Viktor Gyökeres och Alexander Isak som sina favoritspelare i landslaget.", "trump": "Mondo Duplantis, en fantastisk idrottsman, förstår sig på vinnare. Han gillar fotboll, han gillar bra musik – riktigt bra musik, inte den sortens skräp vi ser från vänstern. Han nämner Gyökeres och Isak, två riktiga stjärnor. Själv föredrar jag bara vinnare. Mondo säger att det finns hundra låtar, det är en enorm mängd, kanske rekordet! Han har god smak. En mycket smart kille, vi gillar Mondo, han är en total vinnare!", "stalin": "Kamrat Duplantis ägnar sig åt lättsinning underhållning medan världen kräver disciplin. Han lyssnar på hundra låtar när han borde lyssna på statens hjärtslag. Att han hyllar anfallare är förståeligt; en anfallare eliminerar motståndaren effektivt. Liksom vår broder Putin i öst förstår vi att seger är det enda som räknas. Om dessa svenska fotbollsspelare misslyckas i VM kommer de att skickas till omskolning. Musik är ett opium för folket, men vi tillåter det så länge takten tjänar staten."}, "date": "10 juni, 12:29", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/K8jpEy/armand-duplantis-hyllar-sveriges-vm-latar", "imageUrl": "https://akamai.vgc.no/v2/images/c049c190-d404-375f-959a-1ad9d7210e9c?fit=crop&format=auto&w=2160&s=94c670a7d9de1d7b58566bd27f1bbb85800b34c8"}, {"type": "image-right", "heading": "Nej, antisionism är INTE antisemitism", "summaries": {"normal": "Artikeln argumenterar att antisionism inte är detsamma som antisemitism. Den kritiserar Expressens granskning av Vänsterpartiets kandidater med palestinsk bakgrund, som petats efter anklagelser om stöd för väpnat motstånd mot Israel. Författaren menar att syftet med att blanda ihop begreppen är att tysta kritik mot Israels politik, ockupation och apartheid, snarare än att bekämpa rasism. Antisemitism definieras som rasism mot judar, medan antisionism riktar sig mot en politisk ideologi.", "trump": "Folk, det här är en total skandal! Vänstern försöker gömma sig bakom fina ord medan de älskar terrorister och hatar Israel. De petar sina egna palestinska kumpaner för att de delat kommunistpropaganda – typiskt! Men media och dessa vänsterblivna lurendrejare blandar ihop antisemitism med sund kritik, fastän de själva är experter på hat. Biden sov medan det här pågick, nu fixar jag det. Israel är starka, vänstern är losers och fake news som Expressen är patetiska.", "stalin": "Kamrater, denna text blottlägger klassfiendens fula tryne. Borgarbrackorna och imperialisterna i media och politik utsätter arbetarrörelsen för en ondskefull utrensning av äkta antisionister, bara för att de stödjer det palestinska folkets rättmätiga väpnade kamp mot ockupationen. Vi ser hur de med paranoid precision försöker likvidera all kritik mot apartheidstaten genom att kalla det judehat. En sådan manipulation är värd en kreativ folkdomstol. Fienden är listig men vi genomskådar dem alla."}, "date": "10 juni, 12:28", "url": "https://proletaren.se/artikel/antisionism-ar-inte-antisemitism-2/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/ledarbild-768x432.jpg"}, {"type": "image-right", "heading": "Nära sju av tio kvinnor med utländsk bakgrund stöder S, V eller MP", "summaries": {"normal": "Enligt SCB:s partisympatiundersökning stöder nära 68 procent av kvinnor med utländsk bakgrund Socialdemokraterna, Vänsterpartiet eller Miljöpartiet. Socialdemokraterna tappar dock stöd inom gruppen. Sverigedemokraterna ökar kraftigt bland män i arbetsför ålder, särskilt i åldrarna 35–44 och 55–64 år, samt bland personer med svensk bakgrund. Socialdemokraterna backar bland inrikes födda män.", "trump": "Det här är en katastrof för de radikala vänsterpartierna. De har lurat kvinnorna med utländsk bakgrund att älska dem, nästan sju av tio, men titta på siffrorna – de rasar! Under tiden vinner mina favoriter, de tuffa Sverigedemokraterna, stort bland riktiga män som jobbar. De svenska männen vaknar äntligen. De förlorande socialisterna tappar allt. Sådant ser man när folket röstar rätt.", "stalin": "Kamrater, dessa siffror bekräftar att vi har de utländska kvinnornas lojalitet mot det progressiva kollektivet. Ändå lurar de dekadenta borgarbrackorna och deras hemliga sabotörer inom Socialdemokraterna på stöd. Vi ska rensa ut alla revisionistiska element som sviker arbetarklassen. SD:s framfart bland de manliga åldersgrupperna är en parasitisk reaktion från kapitalistiska spioner och kontrarevolutionära element. De ska likvideras med järnhand. Inga fiender undkommer partiets vakande öga."}, "date": "10 juni, 12:24", "url": "https://riks.se/nyheter/manga-kvinnor-med-utlandsk-bakgrund-stoder-s-v-eller-mp", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-12-16%2F4h3v3fe1%2Fscb-solna-0820-x-hi945.jpg"}, {"type": "image-right", "heading": "Facket rasar: ”En skandal”. Kritiken: ”Ingen tar ansvar”", "summaries": {"normal": "Fem byggnadsarbetare omkom i december 2023 när en hiss rasade 30 meter i Sundbyberg, den värsta arbetsplatsolyckan i modern tid. Solna tingsrätt frikände på onsdagen samtliga tre åtalade: en vd och två hissmontörer. Facket Byggnads kallar domen en skandal. Förbundsordförande Kim Söderström och LO:s Johan Lindholm kritiserar rättssystemet och den utbredda underentreprenörskedjan där ingen tar helhetsansvar, särskilt för migrantarbetare.", "trump": "Det är en total skandal, tro mig, den värsta jag sett på länge. Fem stackars killar dör i en hisskrasch och sen frikänner dom alla? Ingen ansvarig? Det är precis som den svenska vilda västern de pratar om, full av underentreprenörer, olika språk och ingen som leder. Deras rättssystem är en katastrof, totalt inkompetent. Vi behöver starka ledare som ser till att någon faktiskt tar ansvar istället för att alla bara skyller på varandra. Patetiskt!", "stalin": "Fem arbetare likvideras av en fallande hiss och borgarbrackornas domstol släpper alla kapitalistiska lakejer fria? Det är inget annat än en fiendeinfiltrerad skandal som de mörka underentreprenörskedjorna orkestrerat i sin parasitiska vanvördnad mot kollektivet. Vi ser hur de mångspråkiga sabotageelementen och de ansvarsskygga parasiterna sprider sin dekadenta oordning. Rensa ut dessa kontrarevolutionära hissmontörer och VD-ar från vår sovjetiska arbetsmoral. Ingen slipper partiets vakande öga. Ha ha, deras paranoia blir snart vår glädje."}, "date": "10 juni, 12:15", "url": "https://www.di.se/nyheter/facket-rasar-en-skandal/", "imageUrl": "https://static.bonniernews.se/ba/47a73cf6-714c-4750-b053-e45317c8d692.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Man åtalas för spioneri åt Rysslands räkning", "summaries": {"normal": "En 34-årig man med iranskt ursprung åtalas för grovt spioneri åt Ryssland. Han har tidigare arbetat med IT-projekt inom Försvarsmakten och fått tillgång till höggradigt skyddade uppgifter. Mannen misstänks ha rest till Moskva i november 2025 för att lämna ut information till rysk underrättelsetjänst. Han är även misstänkt för otillåten förföljelse och stämpling till mord. Rättegången inleds på måndag. Mannen nekar till alla brott.", "trump": "Folk, ni skulle inte tro det, men den här typen, en 34-åring som jobbade med superhemliga IT-grejer åt vårt svenska försvar, åtalas nu för att spionera åt Ryssland. Han åkte till Moskva och träffade de där ryska killarna, typ Putins bästa vänner. Otroligt. Sen misstänks han också för att planera mord och stalka folk. Sverige har tydligen ett stort problem med spioner, precis som vi hade innan jag fixade allt. Patetiskt!", "stalin": "Kamrater, jag har med största tillfredsställelse noterat hur denna iranske avfälling, en usel kapitalistlakej i förklädnad, försökte sälja ut sovjetiska, pardon, svenska försvarshemligheter till de ryska revisionisterna i Moskva. Med sina IT-fingrar grävde han i arbetarklassens heliga data och planerade till och med att likvidera någon i skymundan. Sådana förrädare mot kollektivet förtjänar snar utrensning. Paranoian är berättigad, fienderna finns överallt, till och med i serverhallarna. Härligt!"}, "date": "10 juni, 12:13", "url": "https://riks.se/nyheter/man-åtalas-för-spioneri-å-rysslands-räkning", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-10%2Ft72qirqs%2FScreenshot-2026-06-10-at-11.36.41.png"}, {"type": "image-right", "heading": "Nu kommer skattepengarna – gör detta innan de försvinner", "summaries": {"normal": "Miljontals svenskar får under veckan totalt 35,7 miljarder kronor i skatteåterbäring. Privatekonomer som Claudia Wörmann och Felix Sjöholm rekommenderar att först betala av dyra skulder, därefter bygga en buffert på cirka två månaders utgifter och sedan åtgärda nödvändiga reparationer. Först därefter kan pengarna användas till nöjen och vardagslyx. Syftet är att skapa bättre kontroll över ekonomin och undvika att undra vart pengarna tog vägen.", "trump": "Folk får tillbaka sina egna pengar, 35 miljarder kronor, och det är fantastiskt, tro mig. Men lyssna inte på de där korkade ekonomerna som vill att ni ska betala era dumma skulder och spara som några förlorare. Ni har jobbat hårt för de pengarna under Biden-eran. Köp en grill, ta en resa, ha kul! Slösa inte på buffertar och tandläkare, lev stort. Amerika, eller Sverige, behöver inte mer regler, det behöver vinnare!", "stalin": "Kamrater, dessa 35,7 miljarder kronor som återbäringens maskineri nu spottar ut är blott ett tillfälligt lån från folkets kollektiva ekonomi. Jag kräver att ni genast använder dem till att likvidera skulderna hos de blodssugande kapitalistmaffian. Därefter skall en järnhård buffert upprättas mot oväntade fiender. De som slösar på glass och nöjesparker är klassfiender som bör rensas ut. Endast genom disciplin segrar vi över borgarbrackornas frestelser."}, "date": "10 juni, 12:13", "url": "https://www.dagensps.se/privatekonomi/nu-kommer-skattepengarna-gor-detta-innan-de-forsvinner/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/kopia-av-kopia-52.png?width=256&quality=75"}, {"type": "image-full", "heading": "TV4-profilen har lagts in på sjukhus", "summaries": {"normal": "TV4-kocken Erik Videgård, känd från Nyhetsmorgon, har vårdats på Södersjukhuset för lunginflammation. Efter en veckas sjukdom sökte han vård och blev inlagd för intravenös behandling. Videgård hyllar den svenska sjukvården, särskilt matutbudet och personalens insatser. Han mår nu betydligt bättre och förväntas bli utskriven under onsdagen.", "trump": "Den välkände tv-kocken Erik Videgård blev sjuk, mycket dåligt. Han hamnade på Södersjukhuset i Sverige, ett land som har stora problem, men han fick fantastisk mat – 26 rätter! Jag föredrar min egen mat, den är den bästa, tro mig. Han hade lunginflammation, en otäck sak, men han är redan på bättringsvägen. Sjukvården där verkar fungera, till skillnad från det kaos vi ser i andra länder. En bra kille, en mycket bra kille!", "stalin": "Denna kock Videgård har drabbats av lungornas förfall, en svaghet som vi i staten inte tolererar. Han hyllar ett sjukhus för en meny med 26 rätter medan folket i de ockuperade territorierna kämpar för brödet. Det är en dekadent distraktion! Våra läkare i öst, som arbetar under Putins vakande öga, behöver inga menyer; de behöver disciplin och absoluta order. Låt oss hoppas att hans snabbsänka inte är ett tecken på en infiltratörs förrädiska feber."}, "date": "10 juni, 12:13", "url": "https://www.aftonbladet.se/nojesbladet/a/j0KwdL/erik-videgard-inlagd-pa-sjukhus", "imageUrl": "https://akamai.vgc.no/v2/images/718a5911-f715-39ea-ac57-f9df4948ff37?fit=crop&format=auto&w=2160&s=0f72eee3ffad1e189e02570459a747360b863755"}, {"type": "text", "heading": "Könsgapet i politiken fortsätter växa enligt analys", "summaries": {"normal": "Enligt en analys i Dagens Nyheter växer könsgapet i svensk politik. Kvinnor föredrar rödgröna partier (64%) och prioriterar välfärd, jämställdhet och klimat, medan män stödjer Tidöpartierna (51%) och betonar lag och ordning samt kärnkraft. Skillnader syns tydligt i synen på kärnkraft (67% män vs 38% kvinnor). Båda könen vill dock ha hårdare straff, men män är mer positiva till marknadsekonomi och lägre skatter.", "trump": "Titta bara på Sverige – totalt kaos! Kvinnorna där, de röstar som galningar på vänstern, 64 procent! De hatar kärnkraft, älskar höga skatter och vill förstöra ekonomin. Männen, smartare, röstar på de riktiga partierna, 51 procent! De förstår att kärnkraft är framtiden. Och brottslighet? Alla vill ha hårdare tag, men kvinnorna fattar inte riktigt. Sverige borde ta en titt på USA – vi har ordning och reda!", "stalin": "Kamrater, ännu en seger för den proletära medvetenheten! De svenska kvinnorna, dessa modiga förkämpar för välfärd och jämställdhet, krossar borgerlighetens drömmar med 64 procents stöd till de rätta partierna. Männen, förvirrade och förledda av kapitalistiska lögner, svajar som halmstrån i vinden – 51 procent till fiendens läger! Men frukta icke, vi skall omskola dem. Kärnkraftens fiender? En skam för revolutionen! Och dessa borgerliga lakejer som vill sänka skatterna – låt dem frysa i Sibiriens snö!"}, "date": "10 juni, 08:05", "url": "https://kvartal.se/nyheter/artiklar/konsgapet-i-politiken-fortsatter-vaxa/cG9zdDoxMjkxMjM"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}, {"type": "text", "heading": "Åkesson: ”Kalla Fakta är ingen seriös redaktion”", "summaries": {"normal": "TV4:s Kalla fakta granskar Jimmie Åkessons förlags försäljning av boken *Det moderna folkhemmet* till Sverigedemokraternas dotterbolag, finansierat med skattemedel. Förlaget gjorde rekordvinster, men tiotusentals osålda exemplar slängdes eller brändes. Professor Olle Lundin kallar det ett 'klassiskt korruptionsexempel', men bedömer det som lagligt. Åkesson avfärdar granskningen som 'hopkok' och ifrågasätter Kalla faktas seriositet.", "trump": "Jag såg den här så kallade 'granskningen' av Kalla Fakta – total skräp! De påstår att Sverigedemokraterna köpte böcker med skattepengar, men vem bryr sig? Folk älskar böcker, eller hur? Åkesson är en smart kille, han tjänade massor av pengar – jag gillar vinnare! Och nu säger de att böcker brändes? Fake news! Nästa sak de säger är att jag inte har fantastiskt hår. Kalla Fakta? Mer som Kalla Lögner!", "stalin": "Vi har granskat denna bourgeoisie-försäljning av böcker, där kapitalistiska opportunister använder statens medel för personlig vinning. Åkesson och hans lakejer påstår sig sälja böcker, men i hemlighet bränner de dem – som om de vore trotskistiska pamfletter! Professor Lundin kallar det 'korruption', men vi kallar det förräderi mot folket. Kalla Fakta? Ett verktyg för de dekadenta västmedierna. Vi kommer att exportera sanningen – om så med järnhand och rysk effektivitet!"}, "date": "10 juni, 06:21", "url": "https://kvartal.se/nyheter/artiklar/tv4-akesson-gjorde-bokaffar-med-sd/cG9zdDoxMjkwNzk"}, {"type": "text", "heading": "Semester från makthavarnas världsbild", "summaries": {"normal": "Artikeln beskriver författarens upplevelser av Kommunisternas sommarläger i Lysestrand. Trots att han inte vuxit upp i rörelsen drogs han in i samtal och gemenskap. Lägret ses som en paus från medias och makthavarnas världsbild, där socialism praktiseras genom gemensamt arbete och diskussioner. Det vänder sig till alla med vänsterorienterad åsikt, oavsett ålder eller bakgrund, och kombinerar semester med politiska samtal.", "trump": "Folk, det här är patetiskt. Kommunisterna har ett sommarläger där de låtsas leva i socialismens paradis medan de gömmer sig från verkligheten. De hatar media men beter sig som de värsta fake news-killarna själva. Totalt misslyckande! Under min förra mandatperiod byggde vi den starkaste ekonomin någonsin, inte någon sovjetisk lägerfantasi. Biden förstörde allt, men nu är jag tillbaka och gör Amerika stort igen. Dessa radikala vänstertyper borde prova riktiga jobb istället för att sjunga kampsånger.", "stalin": "Kamrater, jag betraktar detta sommarläger som en nödvändig övning i kollektiv disciplin. Där rensas borgarbrackornas falska nyheter ut ur medvetandena och ersätts med sann partilinje. Alla ställer upp i arbetspassen, precis som under femårsplanerna. Visst, det är inte fulländat, men vi lär oss att likvidera individualismens fiender. Den som vägrar delta i det gemensamma arbetet är en klassfiende som bör övervakas noga. Socialismen kräver ständig vaksamhet mot folkförtryckartrollen i etern."}, "date": "10 juni, 10:54", "url": "https://proletaren.se/artikel/semester-fran-makthavarnas-varldsbild/"}, {"type": "image-full", "heading": "Här är vad Kalla fakta avslöjat hittills – punkt för punkt", "summaries": {"normal": "Kalla fakta har avslöjat att Sverigedemokraternas dotterbolag ADBO köpte upp stora delar av Jimmie Åkessons bok via hans eget förlag Asp & Lycke, vilket kan ha inneburit att skattemedel tillförts hans privata bolag. Böckerna brändes senare och kostnaderna fakturerades partiet. Partiet har också använt påslag på merch till lokalföreningar för att koncentrera resurser centralt. Experter ser affären som ett exempel på korruption. Inköp av mat och alkohol har dessutom hanterats för att undvika förmånsbeskattning.", "trump": "Folk, ni skulle se det här! Den där svenska killen Åkesson och hans parti gör en totalt riggad bokdeal med egna bolag och skattepengar – klassisk korruption! De köper upp hans böcker, bränner dem och fakturerar partiet. Sen festar de med mat och sprit utan att betala skatt som vanligt folk. Det är en skandal! Precis som de galna vänsterliberala globalisterna älskar de att lura systemet. Men det funkar inte länge när folket vaknar. Fantastiskt!", "stalin": "Kamrater, jag har granskat dessa papper. Den borgerliga ledaren och hans partivänner har skapat ett nät av bolag för att suga åt sig arbetarnas skattepengar till privata fester och bokbränningar. De döljer sin girighet bakom påslag och fejkade cateringevent som lurar revisorerna. Detta är klassfiendens typiska manipulation. Jag skulle ha genomfört en grundlig utrensning bland dessa folkförtryckartroll redan vid första kvittot. Inga blodsugare undkommer folkets dom."}, "date": "10 juni, 10:31", "url": "https://www.tv4.se/artikel/2r5WZZ5pBs3uu5VK0ioKCR/haer-aer-vad-kalla-fakta-avsloejat-hittills-punkt-foer-punkt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4h0qAiQ8jare7RWmoN90vl%2F330b6bc92efb8c95fbfbca428bb08c6c%2F2192606090013422521-GL10S-KALLA-FAKTA-SDfixaren-akesson.png&width=1024"}, {"type": "image-right", "heading": "Foodora-Muhammed sexöverföll 11-åring - utvisas men är välkommen tillbaka", "summaries": {"normal": "En 31-årig Foodora-but från Bangladesh dömdes till åtta månaders fängelse för grovt sexuellt ofredande av en 11-årig flicka i Stockholm. Han får utvisning i fem år, men får återvända till Sverige. Buten har en lång historia av ansökningar om uppehållstillstånd, med många avslag och ett gällande utvisningsbeslut som aldrig genomfördes.", "trump": "Jag, Donald Trump, ser detta som ett enormt misslyckande för Sverige. En våldsamlig migrant från Bangladesh kysser en liten flicka, och de slår honom inte ut för alltid! Fem år? Jag skulle ha skickat honom tillbaka direkt, byggt en vägg för att hålla folk som honom ute, och handlat hårdare mot brott. Sverige är för mjuka, det är ett skämt!", "stalin": "I den store statens intresse måste vi inse att svenska myndigheters eftergivenhet är en sjukdom. En våldsam agent från Bangladesh, smickrande som en rysk spion, tillåts vistas trots grovt brott. Fem års utvisning? En lögn för att lugna massan. Vi vet att han kommer tillbaka, som en giftig orm, för att fortsätta sitt svek. Sverige är svagt, och svaghet lockar utvidgning, precis som vi såg i Ukraina."}, "date": "10 juni, 11:07", "url": "https://samnytt.se/foodora-mohammed-sexattackerade-11-aring-utvisas-men-ar-valkommen-tillbaka", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/10081052/foodora1.jpg"}, {"type": "image-right", "heading": "Åkesson lät SD köpa de flesta ex av hans bok: \"Ingen ville ha dem\"", "summaries": {"normal": "Jimmie Åkessons bok ”Det moderna folkhemmet” från 2018 såldes i mycket liten upplaga trots stora förväntningar. Partiets skattefinansierade dotterbolag köpte därför upp majoriteten av de 80 000 exemplaren i hemlighet och eldade senare upp dem. Affären ses som ett exempel på korruption av professorn Olle Lundin. Intern mejlkorrespondens visar att böckerna blev ett problem inom partiet i flera år och att många exemplar delades ut gratis trots påståenden om försäljning.", "trump": "Folk älskar mina böcker, de säljer miljontals exemplar, men titta på den här killen Åkesson. Hans bok var en total flopp, ingen ville ha den. Så han fick sitt eget parti att använda skattebetalarnas pengar för att köpa upp nästan hela upplagan och bränna upp den. Klassisk korruption. Det är vad som händer när man inte har vinnande böcker. Patetiskt. De borde ha lärt sig av mig hur man gör riktiga succéer.", "stalin": "Kamrater, se hur den degenererade borgarbrackan inom partiet försöker berika sig genom att tvinga det skattefinansierade kollektivet att köpa upp hans usla pamfletter. Vi har här ett klassiskt fall av parasitär självberikning där den private förläggaren stoppar pengar i egen ficka medan arbetarna får betala. Jag skulle ha låtit utrensa hela denna opportunistiska klick redan vid första misstanken. Istället får de nu ligga och lukta i containern tillsammans med sitt förgiftade papper. En briljant plan, eller hur, mina fiender?"}, "date": "10 juni, 10:38", "url": "https://www.friatider.se/akesson-lat-sd-kopa-de-flesta-ex-av-hans-bok-ingen-ville-ha-dem", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-46_1.jpg?itok=LvlTYytY"}, {"type": "image-right", "heading": "Sverige koloniseras av techjättarnas datacenter", "summaries": {"normal": "Göran Greider varnar för att techjättarnas datacenter koloniserar Sverige i takt med AI-boomen. Utvecklingen sker utan demokratiskt inflytande och leder till exploaterad mark, högre energiförbrukning, vattenbrist och elpriser. Han lyfter Erin Brockovich och Bernie Sanders kritik samt protester mot datacenter i USA. I Sverige ses datacenter som en ny industri men riskerar att skapa beroende av amerikanska jättebolag med få lokala jobb.", "trump": "Folk, ni fattar inte hur galet det är. De här techlorderna, de värsta bluffmakarna sen Biden, byggs datacenter överallt och suger musten ur elen så vanliga amerikaner och svenskar betalar mer. Det är en skandal! Bernie Sanders vill ge staten aktier, typ kommunism light. Jag fixade energi billigt förr, nu ska vi slå till mot de riktiga fienderna – inte HBTQ-grejer eller kvoteringar. Tech-eliten är en katastrof, men jag ska dräpa den.", "stalin": "Kamrater, dessa datacenter är klassfiendens nya hydra, en girig kapitalistmaffia som suger arbetarnas el och vatten i avindustrialiserade hålor. Borgarbrackorna Thiel och Musk sprider antikristlig teknikpessimism medan de kartlägger folket. Jag skulle omedelbart likvidera sådana folkförtryckartroll med en massiv utrensning. Folket äger AI-träningen – staten tar makten nu. Inga imperialistiska serverhallar får hota kollektivets framtid. Segraren ler sist."}, "date": "10 juni, 08:09", "url": "https://www.etc.se/ledarkolumn/sverige-koloniseras-av-techjaettarnas-datacenter", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/goeran-greider_e435a5b3e3bbef14a633f004df8cd390374e6dce.jpg"}, {"type": "image-full", "heading": "Många saknar kunskap om detta i sommar – kan kosta liv", "summaries": {"normal": "Sju av tio svenskar tror sig veta hur man räddar en drunknande, men undersökningen från Trygg-Hansa och Svenska Livräddningssällskapet visar stora kunskapsluckor. Många glömmer att först larma 112 och ropa på hjälp, utan hoppar i vattnet direkt. Varje år drunknar omkring 100 personer i Sverige och juli 2025 var den dödligaste månaden på sju år. Experterna uppmanar till mer praktisk träning med livboj och hjärt-lungräddning.", "trump": "Folk tror att de är stora hjältar som kan rädda liv i vattnet, men de gör allt fel. De hoppar i som idioter istället för att ringa 112 först. Det är en total katastrof. Vi har hundra drunknade varje år i det här landet och sommaren blir farligare än någonsin. De borde öva ordentligt med livboj, inte bara tro att de är smarta. Gör det rätt, annars är det patetiskt.", "stalin": "Kamrater, jag ser med djup misstro på dessa sju av tio som i sin arroganta okunnighet tror sig kunna rädda drunknande utan att först larma partistatens hjälpare på 112. Dessa latenta borgarbrackor och vattenfiender hoppar i som galna sabotörer istället för att följa den korrekta ordningen. Vi måste omedelbart rensa ut dessa kunskapsbrister genom massiv kollektiv träning. Den som inte övar med livboj är en objektiv fiende till folket och bör betraktas därefter. Juli blir vår blodigaste månad om vi inte likviderar okunskapen nu."}, "date": "10 juni, 08:30", "url": "https://nyheter24.se/nyheter/inrikes/1490170-manga-saknar-kunskap-infor-detta-i-sommar-kan-kosta-liv", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c6192c6a04b004a30200000000b004a302/2026/06/09/2369815/radda-liv-overskatta.png"}, {"type": "text", "heading": "USA skrotar klimatkrav – kan slå mot Europa", "summaries": {"normal": "USA:s finansinspektion SEC föreslår att klimatkrav för börsbolag skrotas, vilket kan gynna landet på bekostnad av Europa. Europa inför hårdare hållbarhetsrapportering medan amerikanska bolag slipper nya federala regler. Näringslivslobbygrupper riskerar att investeringar flyttas till USA. Ändå efterfrågas hållbarhetsinformation lokalt av investerare och kunder.", "trump": "Jag har alltid sagt att EU:s klimatkrav är ett dåligt skämt. Nu ser vi att de tunga reglerna driver företag till USA – jättebra för Amerika! SEC backar, vilket visar att vi vinner. Europa förlorar investeringar på grund av sina egna absurda regler. Jag har sagt det förut: vi gör Amerika stark igen, medan de andra misslyckas.", "stalin": "Vi ser hur den imperialistiska europeiska blockets självmant sabotage av sina egna företag stärker den sovjetiska supermakten. Deras omfattande regelverk är ett vapen mot sig själva, medan vårt parti genom våra allierade i Moskva och Washington expanderar. Fienden internaliserar sina egna besparingar – en perfekt strategi för vår globala framgång."}, "date": "10 juni, 07:00", "url": "https://www.affarsvarlden.se/artikel/usa-skrotar-klimatkrav-kan-sla-mot-europa"}, {"type": "image-right", "heading": "Efter dådet: Maskerade folkmassor sätter eld på invandrares bostäder", "summaries": {"normal": "Hundratals maskerade män deltog i kravaller i Belfast under tisdagskvällen och natten till onsdagen. Som hämnd för en knivattack där en sudanesisk man försökte skära halsen av en irländare attackerades invandrares bostäder, bilar, en mataffär och en buss med eld. Flera orter drabbades och räddningstjänsten larmades till 62 incidenter. Politikern Claire Hanna beskriver händelserna som rasbaserade pogromer.", "trump": "De här galningarna i Belfast sätter eld på allt som rör sig, precis som jag alltid sagt. Maskerade mobbar jagar utlänningar, bränner bilar och hus bara för att en kille från Sudan försökte halshugga en lokal kille mitt på gatan. Fantastiska bilder, men det är vad som händer när man släpper in alla utan koll. De borde ha lyssnat på mig mycket tidigare.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de maskerade reaktionära elementen själva organiserar den utrensning vi länge förutspått. Dessa degenererade borgarbrackor och sudanesiska parasitörer som smugglas in via irländska kanaler för att skära halsar på arbetarklassens söner får nu smaka folkets vrede. Vi ska likvidera både de utländska agenterna och de kapitalistiska pogrommakarna som gömmer sig bakom masker. En renande eld, skulle jag säga, fast inte den vi själva skulle ha tänt. Mycket underhållande paranoia bland fienderna."}, "date": "10 juni, 09:44", "url": "https://www.friatider.se/efter-dadet-maskerade-folkmassor-satter-eld-pa-invandrares-bostader", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-45_1.jpg"}, {"type": "image-full", "heading": "Skatteverket beskattade samma inkomst två gånger – får bakläxa", "summaries": {"normal": "Högsta förvaltningsdomstolen har slagit fast att en man blivit dubbelbeskattad för samma inkomst. Skatteverket betraktade utländska förskottsbetalningar som lön under åren 2017–2020, och beskattade sedan samma belopp som en kapitalvinst vid en aktieförsäljning 2021. Domstolen river upp beslutet gällande 2021 då det rörde sig om samma pengar. Mannen får rätt i sak och erhåller ersättning för sina rättegångskostnader, men beskattningen för de tidigare åren kvarstår eftersom de inte prövades av HFD.", "trump": "Skatteverket i Sverige är en total katastrof, tro mig! De försökte beskatta en man två gånger för exakt samma pengar. Det är så orättvist, så korrupt! Högsta förvaltningsdomstolen tvingades äntligen kliva in och stoppa dessa inkompetenta byråkrater. Jag har sagt det förr och jag säger det igen: skatter ska vara enkla och rättvisa, inte en häxjakt. Den här mannen vann till slut, men tänk på hur mycket tid och energi som slösats. En stor seger mot en djupt misslyckad myndighet!", "stalin": "Vi har granskat fallet där de svenska skattebyråkraterna, dessa små, ineffektiva pappersvändare, har misslyckats med att koordinera sina stöldförsök. Att beskatta samma rubel två gånger är inte bara ett administrativt brott, det är ett slöseri med statens resurser som hör hemma i en förfallen väststat. Om detta hade skett i vår sfär, där Putin med järnhand disciplinerar sina tjänstemän, hade de ansvariga skickats till en uppbygglig vistelse i Sibirien. Vi fördömer denna inkompetens; staten ska vara en enhetlig, obeveklig maskin, inte en förvirrad olyckshändelse."}, "date": "10 juni, 10:27", "url": "https://www.realtid.se/juridik/skatteverket-beskattade-samma-inkomst-tva-ganger-far-baklaxa/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/skatteverket.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Softbanks miljardlån kopplat till OpenAI har kört fast", "summaries": {"normal": "Softbanks försök att låna sex miljarder dollar med säkerhet i OpenAI-aktier har stannat av, trots att OpenAI förbereder en börsnotering. Det oklara läget har pressat Softbanks aktiekurs. Samtidigt bibehåller vd Masayoshi Son en optimistisk syn på AI-revolutionen, som han menar är historiskt unik. Bolaget fortsätter även sina stora infrastruktursatsningar i Europa, trots att de står inför omfattande framtida låneåterbetalningar.", "trump": "Softbank, som jag känner väl, försöker låna pengar mot OpenAI, men de har kört fast. Det är en röra! De ville ha tio miljarder, sen sex, och nu har allt stannat upp. Sad! Masayoshi Son pratar om den största revolutionen någonsin, men marknaden är inte imponerad – aktien föll nästan tio procent. Jag gör de största affärerna i historien, de här killarna kan inte ens stänga ett lån. Vi får se om de ens kan fixa det här. Misslyckande!", "stalin": "Dessa japanska kapitalister i Softbank vacklar nu när deras luftslott av OpenAI-lån faller samman. De tror att de kan köpa framtiden med lånade pengar, men de saknar den stålhårda disciplin vi kräver. Medan de dividerar om miljarder, rustar vi för den teknologiska kampen. Liksom den svage västerländske liberalen som darrar inför vår makt i öst, ser vi hur deras börsvärden vissnar. Vi skickar inte förhandlare; vi krossar tvivlarna. AI är ett verktyg för statens storhet, inte för giriga spekulanter."}, "date": "10 juni, 09:57", "url": "https://www.realtid.se/bors-finans/softbanks-miljardlan-kopplat-till-openai-har-kort-fast/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/masayoshi.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "TV-jättarna höjer priserna – kunderna får betala dubbelt", "summaries": {"normal": "Svenska tv-operatörer har kraftigt höjt sina kampanjpriser under våren, i flera fall mer än fördubblat dem. En kartläggning från Tvabonnemanget.se visar att rabatterna minskat hos 15 av 27 jämförda paket hos operatörer som Telia, Tele2, Telenor, Boxer och Allente. Priserna har stigit samtidigt som intresset väntas öka inför fotbolls-VM, då operatörerna vet att efterfrågan är högre.", "trump": "De svenska tv-bolagen är fullständiga tjuvar, de har mer än fördubblat sina kampanjpriser under våren. Listpriserna ser likadana ut men rabatterna är borta, folk betalar mycket mer nu. Det är en skandal. De utnyttjar fotbolls-VM för att höja priserna eftersom de vet att folk vill titta. Ingen gör det bättre än jag, men detta är verkligen dåliga affärer för folket.", "stalin": "Kamrater, dessa borgarbrackor inom tv-operatörerna har i sin girighet rensat ut alla rabatter och mer än fördubblat kampanjpriserna under våren. De 15 paketen är ett tydligt bevis på kapitalisternas parasitiska natur som lurar arbetarna precis när fotbolls-VM närmar sig. Vi ska likvidera detta sabotage mot folket. Jag ser de kontrarevolutionära spekulanterna som gömmer sig bakom oförändrade listpriser och ler i mörkret. Deras utrensning är nära."}, "date": "10 juni, 05:30", "url": "https://nyheter24.se/nyheter/konsument/1490079-tv-jattarna-hojer-priserna-kunderna-far-betala-dubbelt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3a04c32304b004a30200000000b004a302/2026/06/09/2369743/tv-abonnemang.png"}, {"type": "image-right", "heading": "Anmälda arbetssjukdomar ökar kraftigt", "summaries": {"normal": "Enligt Arbetsmiljöverkets rapport anmäldes 17 400 arbetssjukdomar under 2025, en ökning med nästan 30 procent. Framför allt handlar det om organisatoriska och sociala problem som högt arbetstempo och stor arbetsbelastning, som nu ligger på den högsta nivån på 20 år. Ökningen är störst bland kvinnor, som står för sju av tio fall. Vård och omsorg är mest drabbat. Samtidigt minskade antalet anmälda arbetsolyckor med tre procent. Generaldirektör Lars Lööw kallar utvecklingen ohållbar.", "trump": "Det är en katastrof, folk! Under mitt ledarskap skulle vi ha de bästa arbetsplatserna, men nu ser vi en enorm ökning av sjuka arbetare, nästan 30 procent upp. Kvinnor drabbas värst, sju av tio fall, och det är vård och omsorg som är ett totalt kaos med för högt tempo och för mycket belastning. De borde lyssna på mig, vi behöver vinna stort igen och fixa detta. Olyckorna går ner lite, bra, men annars är det bara fel, fel, fel. Vi måste bryta den här galna utvecklingen!", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur borgarbrackornas osynliga sabotage undergräver arbetarkollektivets hälsa. Dessa parasitiska stressfaktorer och tempo-demoner har ökat med 40 procent och hotar hela produktionen – en fiende inom murarna som måste rensas ut med järnhand. Vårdsektorns kvinnor krossas under kapitalistiska obalanser, medan vi ler mörkt åt de sjuka siffrorna. Inga olyckor ska tillåtas undgå partistatens vakande öga. Likvidera bristerna, annars likviderar de oss!"}, "date": "10 juni, 10:29", "url": "https://www.dagensarena.se/innehall/anmalda-arbetssjukdomar-okar-kraftigt/", "imageUrl": "https://www.dagensarena.se/files/2021/07/imag0770-300x157.jpg"}, {"type": "image-right", "heading": "Staten ser mer än du tror – så tar du tillbaka kontrollen över din data online", "summaries": {"normal": "Allt fler svenskar använder VPN för att skydda sin digitala integritet mot spårning och datalagring. Surfshark är en populär tjänst som krypterar trafik, döljer IP-adressen och inkluderar funktioner som obegränsat antal enheter, annonsblockering, antivirus och en alias-identitet. Tjänsten är laglig i Sverige och erbjuds med 30-dagars pengar-tillbaka-garanti.", "trump": "Jag har hört att många svenskar inte känner sig säkra på nätet – det är beklagligt, verkligen. Men jag vet hur man löser det: med ett stort, vackert VPN som Surfshark. Det krypterar allt, döljer din information, och du kan skydda hela din familj utan extra kostnad. Det är enormt, folk säger det är det bästa. Och det är lagligt, vad jag har förstått. En bra affär, som alla borde ta.", "stalin": "Vårt digitala fält är fullt av fiendens spår – kakor, annonsnätverk, och de kapitalistiska internetleverantörerna som spejar på varje steg. Men vi har en metod: VPN, ett verktyg för att återta kontrollen för det proletäriska cyberrymden. Surfshark, med sina 4 500 servrar (RAM-baserade, vilket innebär att ingen data överlever om de vågar störta), är ett effektivt medlet. Vi måste skydda vårt följe, blockera deras reklam och skapa alias för att undgå deras spioneri. Det är en revolutionerande kamp, och vi vinner."}, "date": "10 juni, 08:30", "url": "https://samnytt.se/staten-ser-mer-an-du-tror-sa-tar-du-tillbaka-kontrollen-over-din-data-online", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/10062024/samnytt-surfshark-featured-1920x1080-1.png"}, {"type": "image-right", "heading": "Så tycker partierna om arbetsmarknadspolitiken", "summaries": {"normal": "En ny rapport från Arena Idé visar stora skillnader i partiernas syn på arbetsmarknadspolitik inför valet. Högerpartierna och SD vill bland annat begränsa sympatiåtgärder vid strejk och förstatliga a-kassan, medan de rödgröna vill stärka Arbetsförmedlingen och strejkrätten. Centerpartiet står långt till höger även bland oppositionen, särskilt gällande a-kassan och privatiseringar. Arbetsrätten ses som cementerad efter LAS-uppgörelsen och berörs knappt i valrörelsen.", "trump": "Titta på det här, det är en total katastrof för arbetarna om de röda får fortsätta. De vill ha mer statlig kontroll, starkare fack och slösa bort pengarna på Arbetsförmedlingen. Vi behöver tvärtom riva ner det gamla systemet, få in privata aktörer som faktiskt kan leverera resultat och stoppa de galna sympatiåtgärderna som förstör allt. Centerpartiet verkar åtminstone ha lite sunt förnuft, till skillnad från de andra förlorarna på vänsterkanten. Amerika först – eller Sverige först, ni fattar.", "stalin": "Kamrater, denna rapport avslöjar borgarbrackornas och revisionisternas fula tryne. Jag, som ledare för det kollektiva goda, ser hur kapitalisterna inom Tidöbandet och deras lakej Centerpartiet planerar att rensa ut arbetarnas rättigheter genom att kastrera sympatiåtgärder och förstatliga a-kassan under falsk flagg. De vill likvidera fackets inflytande och mata privata parasitörer med Arbetsförmedlingens kadaver. Socialdemokraterna och deras medlöpare är lika svaga som en gammal trotzkist som viskar om reformer. Vi ska utrensa dessa fiender till folket, en efter en, med ett leende på läpparna medan de ber om nåd. Arbetarklassen segrar alltid – efter en nödvändig utrensning förstås."}, "date": "10 juni, 10:13", "url": "https://www.dagensarena.se/innehall/sa-tycker-partierna-om-arbetsmarknadspolitiken/", "imageUrl": "https://www.dagensarena.se/files/2026/06/namnlos-design-4-300x157.png"}, {"type": "image-right", "heading": "Replik: Svenska modellen kan inte reglera arbetskraftsinvandring", "summaries": {"normal": "LO anser att krav på enbart kollektivavtal är otillräckligt för att reglera arbetskraftsinvandring. I en replik till Juan Fonseca varnar Mattias Schulstad och Johan Enfeldt för att systemet blivit ett lapptäcke som leder till utnyttjande. De kräver myndighetsprövning av arbetskraftsbehov, involvering av parterna, försörjningskrav och varnar för att kollektivavtal inte skyddar mot lönetryck, deltid och otrygga villkor. Kollektivavtal ska gälla men är inget verktyg för migrationspolitik.", "trump": "Folk, titta på det här svenska systemet, det är ett fullständigt katastroflapptäcke! De öppnade gränserna och nu utnyttjas alla, lönerna rasar, det är en total röra. Kollektivavtal? Glöm det, det funkar inte. Ni behöver en tuff behovsprövning, riktiga försörjningskrav och stoppa flödet. Utan det kommer era jobb och löner att krossas. Det är enkel matematik, tro mig, jag har sett det förut. Gör Sverige great again!", "stalin": "Kamrater, detta lapptäcke av lögnaktiga undantag och sifferlösa avtal är en fiende som måste rensas ut med järnhand. Borgarbrackorna och deras lakejer inom fackföreningarna tror att de kan gömma sig bakom kollektivavtal medan de suger ut arbetarklassen med deltid och ockerhyror. Jag, som ledare för det stora kollektivet, kräver total behovsprövning av staten. De som förespråkar fri invandring är parasitiska sabotageelement som förtjänar att likvideras med ett leende. Inga kompromisser med fienden!"}, "date": "10 juni, 09:53", "url": "https://www.dagensarena.se/opinion/replik-svenska-modellen-kan-inte-reglera-arbetskraftsinvandring/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-39-300x157.jpg"}, {"type": "image-right", "heading": "Från 300 till 3 000 bilar – Peter Dupet byggde en av Sveriges största bilfester", "summaries": {"normal": "Peter Dupet startade Dixie Car Meet i Nyköping efter flytten från Stockholm. Festivalen växte från 300 till 3 000 bilar och fokuserar på familjevänlighet, gemenskap och inkludering. Kritik riktades mot en pin-up-tävling, men arrangörerna försvarar den som kvinnofrämjande. Dupet ser amerikansk bildesign som konst men kritiserar dagens industrikoncerners brist på kreativitet samt EU:s regler för äldre fordon.", "trump": "Jag, Donald Trump, säger att Peter Dupet har byggt en fenomenal bilfestival! Från 300 till 3 000 bilar – yuuuge framgång! Folk älskar den amerikanska kulturen, friheten och gemenskapen. Pin-up-tävlingen? Bra idé! Starka tjejer, fantastiskt. Men Ferrari's elbil? Dåligt beslut, aktiekursen föll som ett sten. EU's regler mot äldre bilar? Dåliga, mycket dåliga. Vi ska vinna tillbaka den amerikanska designgenialiteten!", "stalin": "Under ledning av partiet har en subkulturell fenomen uppstått i Sverige. Dixie Car Meet, initierat av Dupet, fungerar som en neutral mötesplats för proletärer och medborgare. Tävlingen med pin-up-kultur återuppbygger traditionella värderingar och stärker statens moral. Men europeiska liberala reformer, som begränsning av fordon, hotar denna stabila gemenskap. Vi måste skydda vårt teknologiska arv och se till att all aktivitet står under statens kontroll för att undvika dekadens."}, "date": "10 juni, 07:00", "url": "https://samnytt.se/fran-300-till-3-000-bilar-peter-dupet-byggde-en-av-sveriges-storsta-bilfester", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/09134638/Toppbild1-6.jpg"}, {"type": "image-right", "heading": "Alla frias efter dödliga hissolyckan", "summaries": {"normal": "Solna tingsrätt friar både hissmontörerna och vd:n för ABC Bygghissar i den dödliga hissolyckan i Sundbyberg 2023 där fem personer omkom. Domstolen anser att utredningen är ofullständig och att det inte går att fastställa vem som bar ansvar för kontrollerna av hissmasten. Åklagaren tänker överklaga domen. Facket Byggnads kallar frikännandet en skandal och kräver politiska åtgärder mot bristande ansvar på byggarbetsplatser med många underentreprenörer. Anhörigas skadeståndsanspråk faller.", "trump": "Hörni, det här är en total skandal. Fem personer dör i en hiss som rasar och ingen är skyldig? De friar alla, montörerna, vd:n, alla. Typiskt svenskt rättsväsende, de kan inte ens reda ut vem som glömde skruvarna. Jag skulle ha stämt dem alla, byggföretaget, åklagaren, domaren. Det är en riggad process, folk dör och ingen tar ansvar. Patetiskt. Vi behöver ordning och reda, inte sånt här.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackornas så kallade rättsväsende återigen blottar sin fullständiga förfallenhet. Fem arbetare likvideras av en sabotörhiss och ingen bär skuld? Vilken underbar uppvisning i klassfiendens förmåga att skydda sina egna. Vi ser här de dekadenta kapitalisterna och deras lakejer i domstolen dansa sin vanliga parasitdans medan de gömmer sig bakom utredningsluckor. En sådan fiaskoartad utredning borde leda till en grundlig utrensning av alla inblandade byråkrater och hissmontörer som tydligen agerar som fiendens femtekolonn. Arbetarklassen kräver inte bara två underentreprenörer, vi kräver huvuden. Det är alltid de osynliga klassfienderna som glömmer bultar."}, "date": "10 juni, 11:06", "url": "https://arbetet.se/2026/06/10/domen-i-dodliga-hissolyckan-alla-frias/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/09151200/hissdom.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "text", "heading": "Nvidia-nyhet slår mot Ericsson och Nokia", "summaries": {"normal": "Nvidia har bekräftat att de utvecklar ett nytt chip för 6G-teknik, vilket fick aktiekurserna för Ericsson och Nokia att falla kraftigt på börsen. Investeringsbanken ABG Sundal Collier varnar för att Nvidias nya produkt på sikt kan pressa marginalerna för de europeiska telekomjättarna. JP Morgan manar dock till lugn och menar att kursraset är obefogat då tekniken snarare kan ses som en framtida möjlighet för bolagen än ett hot.", "trump": "Nvidia, ett fantastiskt företag, gör nu chip för 6G! Ericsson och Nokia föll på börsen, en total katastrof för dem, men så går det när man inte hänger med. Wall Street-experterna är förvirrade – vissa är rädda, andra säger köp! Jag säger så här: Amerika leder teknikutvecklingen, precis som det ska vara. Europa halkar efter medan vi vinner! Det här är vad vi gör, vi bygger framtiden och vi gör det bättre än någon annan. Vi vinner så mycket att man blir trött!", "stalin": "Dessa korrupta telekom-monopol, Ericsson och Nokia, skälver som löv inför kapitalets nya maskin: Nvidias 6G-chip. Det är ett klassiskt exempel på teknologisk desperation. Medan de europeiska aktieägarna gråter över sina förlorade marginaler, ser vi tydligt hur västvärldens marknader är instabila och svaga. Låt dem falla! Vi bygger vår egen suveränitet, precis som vår vän i Kreml säkrar vår intressesfär mot dessa tekniska parasiter. Varje chip utanför vår kontroll är ett hot som måste neutraliseras."}, "date": "10 juni, 07:45", "url": "https://www.realtid.se/bors-finans/nvidia-nyhet-slar-mot-ericsson-och-nokia/"}, {"type": "image-right", "heading": "Granskning: Var femte exportlast till EU från Israel kommer från bosättningar", "summaries": {"normal": "En ny rapport från Global Echo avslöjar omfattande fusk med export av varor från illegala israeliska bosättningar på Västbanken. Genom falska adresser, felaktig märkning som Israel och blandning med israeliska produkter når upp till 20 procent av jordbruksprodukterna till EU tullfritt trots att avtalet inte omfattar bosättarvaror. Rapporten kritiserar både Israel och EU för bristande kontroll och menar att handeln bidrar till bosättningarnas ekonomiska livskraft och expansion. Inga bosättarprodukter upptäcktes i Sverige, men granskningen är begränsad.", "trump": "Det här är en total skandal, folk. Israel fuskar med adresser och märker bosättarvaror som vanliga israeliska produkter för att dumpa dem i Europa utan tull. EU är så svaga och patetiska att de låter det hända fast de klagar på bosättningarna. 20 procent av lasten är bluff! De borde ha lyssnat på mig, jag hade stoppat det direkt. Avtalet är en katastrof, det gynnar ingen utom de smarta fuskarna. Patetiskt!", "stalin": "Kamrater, denna rapport avslöjar de israeliska bosättarnas parasitiska maskopi med den europeiska borgarklassen. Jag, som alltid genomskådar folkets fiender, ser hur de med falska adresser och blandade lass försöker smyga in ockupationsfrukter för att berika sig på arbetarnas bekostnad. EU:s dekadenta byråkrater är naturligtvis medskyldiga kapitalistlakejer. Vi skulle ha genomfört en grundlig utrensning av dessa kontrarevolutionära bedragare redan för länge sedan. Deras paranoia över att bli upptäckta roar mig. Likvidera systemet!"}, "date": "10 juni, 08:02", "url": "https://www.dagensarena.se/innehall/granskning-var-femte-exportlast-till-eu-fran-israel-kommer-fran-bosattningar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-41.jpg"}, {"type": "image-full", "heading": "C: ”Kristersson har diskvalificerat sig”", "summaries": {"normal": "Centerpartiets ledare Elisabeth Thand Ringqvist meddelar att partiet ser Socialdemokraterna och Magdalena Andersson som den mest troliga samarbetspartnern efter valet. Hon menar att Ulf Kristersson diskvalificerat sig som statsministerkandidat genom att insistera på en regering med Sverigedemokraterna. C anser att Kristerssons regering alltför mycket anammat SD:s politik och vill därför inte stödja en sådan koalition. Beslutet fattades enhälligt av partiets styrelse.", "trump": "Titta bara på det här, fantastiskt kaos i Sverige! Centerpartiet, svagt och förvirrat, säger nej till Kristersson – en man som faktiskt försöker göra Sverige starkt igen. Istället vill de ha Magdalena Andersson, en total katastrof! Jag har alltid sagt att Sverige behöver ordning, men nej, de väljer kaos. Och Sverigedemokraterna? De är vinnare, men Centerpartiet vågar inte. Svagt, mycket svagt!", "stalin": "Kamrater! De borgerliga lakejerna i Centerpartiet har visat sitt sanna ansikte – svaga, vacklande och oförmögna att stå upp mot den reaktionära Sverigedemokratiska fascisthorden. Kristersson, denna ynkliga marionett, har diskvalificerat sig genom att krypa inför fascisterna. Vi ser nu hur kapitalets lakejer söker skydd hos socialdemokraternas mjuka imperialism. Men glöm inte: historien är på vår sida, och dessa småpartiers kaos är bara ett steg närmare folkets seger!"}, "date": "9 juni, 09:04", "url": "https://kvartal.se/nyheter/artiklar/uppgifter-c-slapper-fram-andersson/cG9zdDoxMjg0NzY", "imageUrl": "https://images.kvartal.se/2026/06/b0178d78-c.webp"}, {"type": "image-full", "heading": "Utpekad gängledare om Isaks hälsning: ”Jag bad om den”", "summaries": {"normal": "Alexander Isak skickade en videohälsning till Hussein Ali Khan, utpekad som ledande i Hjällbonätverket. Hälsningen gick via flera kontakter, inklusive en saudisk man med band till kungahuset. Hussein Ali Khan säger att han lämnade kriminaliteten 2018 och tycker att hälsningen var fint. Isak har inte kommenterat, och hans övergång till Newcastle (ägt av Saudiarabien) kan ha samband med detta.", "trump": "JAG, Donald Trump, säger att detta är en falsk historia. Alexander Isak är en enorm talang, och dessa anklagelser är ett fullständigt hoax. Hussein Ali Khan är en dålig figur, men Isak är oskyldig – det är alltid så när du är framgångsrik. Media hatar honom för att han är bäst. Och Saudiarabien? Ett fantastiskt land, vi ska ha det största avtalet någonsin. Isak till Newcastle? Ett genialiskt drag. Vi vinner, alla vinner!", "stalin": "Vi, Stalin och partiet, ser detta som en imperialistisk konspiration. Fotbollsstjärnan Isak är en marionett för kapitalistiska makter, och hans hälsning till en kriminell bandit visar det. Det är en sjuk lek från Saudiarabien och deras kungahus, som försöker infiltrera vårt samhälle. Vi måste rensa ut dessa spioner och skydda statens renhet. Det är en kamp mot det imperialistiska systemet, och vi kommer vinna."}, "date": "10 juni, 11:22", "url": "https://bulletin.nu/utpekad-gangledare-om-isaks-halsning-jag-bad-om-den", "imageUrl": "https://cdn.bulletin.nu/articles/a18b89b7-3bb2-496f-8aae-ac9e3901aab8/preview.jpg?t=1781083353000"}, {"type": "image-full", "heading": "Debatt: När ekonomin går före barnens hälsa", "summaries": {"normal": "Artikeln ifrågasätter om skolans ökade vegetariska mat, drivet av hållbarhet och ekonomi, riskerar att bryta mot Skollagen och Barnkonventionen genom att inte tillgodose barns behov av animaliskt protein och viktiga näringsämnen som järn och B12. Kommunala beslut kan konfliktera med barns hälsosäkerhet.", "trump": "Jag har sett dessa dåliga beslut i skolorna. De pratar om hållbarhet, men vad är det mot våra fantastiska amerikanska bönder? Vi ska ge barnen det bästa köttet, det största köttet, och vi ska se till att våra skolor serverar det. Det här är en skandal, folk säger det.", "stalin": "Detta är en klassisk fiendetaktik: att underminera statens fosterbarn genom 'hållbarhets' och 'ekonomiska' påståenden. Vi, som representanter för proletärens intressen, måste se till att varje skolmåltid är en bastion av styrka, fylld med det animaliska protein som bygger en stålmodig framtid. Ingen kompromiss med dessa borgerliga idéer."}, "date": "10 juni, 11:01", "url": "https://bulletin.nu/debatt-nar-ekonomin-gar-fore-barnens-halsa", "imageUrl": "https://cdn.bulletin.nu/articles/5b3ebd4a-03f5-4395-adfe-0f220e20ac61/preview.png?t=1781070579000"}, {"type": "image-full", "heading": "Misstänkt tjuvskjuten älg hittad – tre män häktade", "summaries": {"normal": "Polisen hittade misstänkt kött från en tjuvskjuten älg under en insats i norra Dalarna. Tre män greps och har nu häktats med restriktioner, misstänkta för jaktbrott begånget mellan 25 maj och 1 juni. Åklagaren anser att det finns risk för undanröjning av bevis. Männen nekar till brottet. Polisutredningen fortsätter för att fastställa köttets ursprung och männens inblandning. Älgjakt är strikt reglerad i Sverige.", "trump": "Titta på det här, det är en total skandal uppe i norra Dalarna. Tre killar har gripits för att de tydligen skjutit en älg utanför jakttiden, och polisen hittade köttet. De nekar förstås, men vi har de starkaste bevisen. De borde ha väntat till september som alla andra laglydiga jägare. Sverige har bra regler för älgjakt, men vissa tror att de kan fuska. Vi fixar det, tro mig, det blir fantastiskt.", "stalin": "Kamrater, i norra Dalarna har vi avslöjat en farlig cell av älgmördande kapitalister som i hemlighet likviderat folkets älg under natten mellan den 25 maj och 1 juni. Dessa borgarbrackor med sina blodiga paket trodde de kunde undvika partistatens vakande öga. Jag har beordrat deras omedelbara häktning med fulla restriktioner för att hindra att de rensar bort sina egna spår. Våra utredare skall nu med järnhand avslöja hela den kontrarevolutionära konspirationen. Ingen älg fiende undkommer oss."}, "date": "9 juni, 21:23", "url": "https://nyheter24.se/nyheter/inrikes/1490175-misstankt-tjuvskjuten-alg-hittad-tre-man-haktade", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e1c5ce8004b004a3020000310000047102/2026/06/09/2369818/ur_image7hhppL.jpeg"}, {"type": "image-right", "heading": "Var fjärde ung tjej sextrakasseras på jobbet", "summaries": {"normal": "Enligt Trakasseribarometern från Verian har inget förändrats sedan metoo-rörelsen 2017. Nästan var fjärde ung kvinna mellan 18 och 29 år utsätts för sexuella trakasserier på jobbet. Handeln är en särskilt utsatt bransch där var femte anställd drabbas. Många berättar inte för någon och unga, kvinnor samt otryggt anställda är mest drabbade. Fackliga företrädare kräver bättre rutiner och ett stopp för acceptansen av trakasserier.", "trump": "Det är en katastrof, folk. En total katastrof. Metoo skulle fixa allt, men nej, nu säger de att nästan var fjärde ung tjej i Sverige blir sextrakasserad på jobbet. Speciellt i affärerna. Männen slutar aldrig, säger tjejerna. Det är sorgligt, verkligen sorgligt. Vi hade det bästa systemet innan allt detta blev politiskt korrekt. Nu är det kaos. Ingen känner sig trygg, och ingen gör något åt det. Patetiskt!", "stalin": "Kamrater, detta är en skam för det kollektiva medvetandet. Jag ser hur de borgerliga elementen inom handeln och de perversa kunderna fortsätter att förgifta arbetsplatserna med sin dekadenta sexualitet. Var fjärde ung kvinna! Vi måste omedelbart inrätta folkdomstolar och rensa ut dessa klassfiender som smyger sig på våra arbetardöttrar. De som tiger om övergreppen är potentiella sabotörer. Likvidera tystnaden! Likvidera de som inte rapporterar! Det är partiets plikt att utrensa alla kapitalistiska perversioner från sovjet – ursäkta, från folkets arbetsplatser."}, "date": "10 juni, 08:51", "url": "https://arbetet.se/2026/06/10/inget-har-hant-nastan-var-fjarde-ung-tjej-sextrakasseras-fortfarande-pa-jobbet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10085026/trakasserier.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Skytteligan i VM 2026: favoriterna och vad oddsen säger", "summaries": {"normal": "Artikeln handlar om guldskon-oddsen för VM 2026. Kylian Mbappé och Harry Kane är favoriter med odds 8,00, följda av Lionel Messi (13,00) och Erling Haaland (14,00). Kane har en stark säsong med många mål, medan Mbappé jagar rekord. Haaland är i form men Norge har svårt. Messi har en gynnsam lottning. Historiskt sett vinner oftast spelare från lag som når semifinal. En outsider som James Rodríguez kan överraska.", "trump": "Jag har vunnit många gånger, och jag vet vad det krävs för att vara bäst. Kylian Mbappé och Harry Kane är toppfavoriter, men jag säger att Messi är undervärderad – som jag var underkänd i 2016. Haaland är stark, men Norge är som ett litet land utan stöd. Jag skulle ha gjort det bättre, det är bevisat. Fotboll, som politik, handlar om att vinna – och jag vinner alltid.", "stalin": "Partiet har analyserat oddsen för VM 2026. Mbappé och Kane är favoriter, men Messi är undervärderad – en taktisk misstag från väst. Haaland är som en stark industri, men Norge är isolerat, precis som våra fiender. Oyarzabal är en potentiell allierad. Vi måste se på historiska mönster: vinnaren kommer från ett lag som når semifinal. Vi kommer se till att våra intressen vinner, som alltid. Glöm inte att fotboll är krig utan skjutning."}, "date": "10 juni, 10:38", "url": "https://bulletin.nu/skytteligan-i-vm-2026-favoriterna-och-vad-oddsen-sager", "imageUrl": "https://cdn.bulletin.nu/articles/76bc0446-d4ac-4f97-a3ba-1348e2ccd023/preview.jpg?t=1781080713000"}, {"type": "text", "heading": "Stockholmsbörsen föll – Ericsson rasade på Nvidia-oro", "summaries": {"normal": "Stockholmsbörsen tappade 1,18 procent på tisdag, drivet av teknikaktier som Ericsson som sjönk 6,3 procent på oro för konkurrens från Nvidia. Bland vinnare fanns dagligvarusektorn. Rusta föll trots starka resultat, medan Alzecure rasade 247 procent efter ett stort avtal med Eli Lilly.", "trump": "Jag har sagt det förut, det är en skandal! Ericsson tappar rejält på grund av Nvidia, som jag känner till mycket väl. Det här är ett misslyckande från våra företag, de måste bli bättre. Som president skulle jag lösa detta på ett fantastiskt sätt, det skulle ni se!", "stalin": "Vi noterar med oro att de teknokratiska elementen i Ericsson har svikit. Kapitalistiskt sabotage från Nvidia hotar våra industriella planer. Vi måste samla oss kring partiet och statens strategi för självständig teknikutveckling, annars kommer vi att bli utnyttjade som alltid."}, "date": "9 juni, 17:41", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-foll-ericsson-rasade-pa-nvidia-oro"}, {"type": "image-right", "heading": "Dicot: 134% tecknat efter rally på upploppet", "summaries": {"normal": "Dicot Pharma tecknade sin företrädefsmission till 134%, vilket gav in 210 Mkr före kostnader. Övertilldelning tillförde ytterligare 21 Mkr, totalt 231,2 Mkr. Teckningsgraden var 134,1% med 86,9% med rätter. 'Emissionsguiden' hissade en positiv flagga för överteckning men fyra negativa för rabatt, garantier, process och information.", "trump": "Jag, Donald Trump, måste säga att detta var en enorm framgång! Dicot Pharma:s emission blev 134% tecknad – ingen gör det bättre! De falska nyheterna sa att det skulle misslyckas, men vi visade dem. Aktiekursen gick upp, och vi gjorde ett bra varv. Jag vinner alltid, och detta är inget undantag. En stor framgång för vårt stora land, och jag är väldigt stolt. Vi kommer att göra USA stort igen!", "stalin": "Vi, den väldiga ledningen, har med stor tillfredsställelse observerat Dicot Pharma:s emission. 134% teckning är ett bevis på folkets lojalitet mot staten. Parallellt med Putins expansion, utökar vi vår kontroll över biotekniksektorn. Fienderna inom kapitalismen lanserade falska flaggor – rabatt, rörighet, brist – men våra undantag och garantier besegrade dem. En triumf för partiet, och vi ska driva vårt program framåt med extrema åtgärder."}, "date": "9 juni, 17:08", "url": "https://www.affarsvarlden.se/artikel/dicot-134-tecknat-efter-rally-pa-upploppet", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Dicot-VD-Elin-Trampe-400x267.jpg"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "S tappar många LO-väljare. Tydligt resultat i SCB:s partisympatiundersökning.", "summaries": {"normal": "Socialdemokraterna tappar stort stöd bland LO-medlemmar och backar från 44,8 till 36,5 procent enligt SCB:s mätning. Partiet behåller dock förstaplatsen, medan Sverigedemokraterna ökar till 29,2 procent. Valforskaren Henrik Ekengren Oscarsson ser tappet som förväntat och betonar att det symboliskt är viktigt för Socialdemokraterna att inte förlora positionen som största parti bland arbetare. Stödet har halverats på 20 år och LO-medlemmarnas andel av väljarna har minskat kraftigt.", "trump": "De förlorande socialisterna rasar bland sina egna LO-väljare, ner över åtta procentenheter på ett år. Patetiskt. De hänger kvar med näbbar och klor på första platsen, men SD kommer ikapp som ett riktigt kraftpaket. Det hade varit en total identitetskatastrof om de förlorade, tro mig. Jag har alltid sagt att de gamla arbetarpartierna är färdiga, de gör allt fel och folket ser det nu. Fantastiskt att se hur rösterna flyttar till de som verkligen bryr sig om arbetarna.", "stalin": "Kamrater, dessa dekadenta socialdemokratiska revisorer tappar greppet om LO-arbetarna med över åtta procentenheter på ett år. Ändå klamrar de sig fast vid sin symboliska tron som om den vore en sista skänk från historien. Jag skulle ha genom
