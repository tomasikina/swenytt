vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "”Så länge SD har Oscar Sjöstedt kommer de rika att bli rikare”", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas ekonomiska politik som en högerpolitik trots partiets självbild som mittenparti. Oscar Sjöstedt beskrivs som en central gestalt som drivit fram sänkta skatter, försämrad a-kassa och stöd för vinster i välfärden. Författaren menar att detta gynnar höginkomsttagare på löntagarnas bekostnad och underminerar tryggheten för vanligt folk.", "trump": "Folk, de här SD-typerna är fullständiga bedragare. Åkesson babblar om mittenparti medan den där Sjöstedt, en riktig skattekramande högerhöök, skär ner a-kassan och ger de rika ännu mer. Patetiska globalister som låtsas vara arbetarnas vänner men bara älskar de giriga eliterna. Under mig skulle vi ha sparkat ut dem direkt – totalt misslyckande!", "stalin": "Kamrater, se hur dessa profitthungriga klassförrädare inom SD maskerar sin giriga agenda bakom folklig retorik. Sjöstedt och hans lakejer rensar ut tryggheten för arbetarna medan de belönar de parasiterande borgarbrackorna. Jag ler mörkt från historien åt deras hyckleri. En dag ska folkets vrede likvidera alla sådana falska vänner till de arbetande massorna."}, "date": "4 september, 08:00", "url": "https://arbetet.se/2026/09/04/sa-lange-sd-har-oscar-sjostedt-kommer-de-rika-att-bli-rikare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02123947/wallmark.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "LO: ”Ingen höjd pension om Ulf Kristersson får fortsätta att vara statsminister”", "summaries": {"normal": "Med en vecka kvar till valet startar LO en kampanj för att lyfta pensionsfrågan. En undersökning visar att nära åtta av tio arbetare vill ha besked från partierna före valdagen. LO:s ordförande Johan Lindholm kritiserar att det inte lönar sig att ha jobbat länge, särskilt för dem som slitit ut kroppen tidigt. Socialdemokraterna vill införa en arbetarpension medan Moderaterna säger nej.", "trump": "Folk sliter ut sina kroppar i decennier och får ingenting tillbaka, det är en total skandal. Den där Johan Lindholm har rätt för en gångs skull, men de svenska socialistiska nollorna och de falska moderaterna gör inget åt det. Under min ledning fick pensionärerna bra deals, inte som under Sleepy Joe. Nu vill LO väcka upp arbetarna – smart, för vem vill leva på luft efter att ha byggt landet?", "stalin": "Arbetarna kräver äntligen sin rätt mot de profitthungriga klassförrädarna som sugit musten ur dem i decennier. Jag ser med stor tillfredsställelse hur oron sprider sig som en farsot bland de förtryckta. Inga halvhjärtade löften från de dekadenta politikerna. En sann utrensning av sådana parasiter vore på sin plats. Kamrater, låt inte de giriga hyenorna stjäla er pension en dag till."}, "date": "4 september, 08:42", "url": "https://www.dagensarena.se/innehall/lo-ingen-hojd-pension-om-ulf-kristersson-far-fortsatta-att-vara-statsminister", "imageUrl": "https://www.dagensarena.se/files/2026/09/johan-lindholm-pension.jpeg"}, {"type": "image-right", "heading": "Näthatsgranskaren polisanmäler Jomshof", "summaries": {"normal": "Den vänsterextrema organisationen Näthatsgranskaren har polisanmält SD-toppen Richard Jomshof för hets mot folkgrupp. Anmälan gäller tretton inlägg på X där han enligt organisationen avhumaniserar en folkgrupp på grund av religion. Jomshof ledde själv utvidgningen av hets mot folkgrupp-lagen för några år sedan. Tidigare anmälningar mot honom har lagts ned.", "trump": "Folk, ni skulle se det här! Den galna vänstersekten Näthatsgranskaren, ett gäng hysteriska censurhyenor, anmäler den tuffe Jomshof för att han talar sanning. De vill tysta alla som inte böjer sig för deras sjuka identitetspolitik. Jag utvidgade inga sådana lagar, det gjorde era svaga politiker. Patetiskt! Vi behöver inga woke-domare i Sverige heller.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom Näthatsgranskaren jagar en politisk motståndare med sin byråkratiska utrensningsiver. De anmäler Jomshof för att han vågar kalla saker vid deras rätta namn. Jag ler ironiskt från historien; dessa parasiterande åsiktslakejer tror sig skydda folk men skapar bara rädsla. Snart kommer deras egna ord att vändas mot dem själva."}, "date": "4 september, 08:42", "url": "https://www.friatider.se/nathatsgranskaren-polisanmaler-jomshof", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-823.jpg"}, {"type": "image-right", "heading": "Ska 50 miljoner jobbansökningar stoppa arbetslöheten?", "summaries": {"normal": "Artikeln kritiserar svensk arbetsmarknadspolitik där arbetslösa tvingas söka ett stort antal jobb för att få försörjningsstöd. Trots att många ansökningar skickas nekas stöd på grund av felaktiga datum eller för få ansökningar. Författaren beskriver systemet som byråkratiskt vansinne medan arbetslösheten ökar och efterfrågan på arbetskraft är låg.", "trump": "Det här är fullständigt galet, folk! I det socialistiska dårhuset Sverige tvingar de de stackars arbetslösa att skicka femtio miljoner jobbansökningar i månaden till jobb som inte ens finns. Rena tidsförslöseriet från de korkade globalistbyråkraterna. De borde sänka skatterna och släppa loss den riktiga ekonomin istället för att pina folk med blanketter. Patetiskt!", "stalin": "Kamrater, se hur de giriga hyenorna i det borgerliga dårhuset driver arbetarna till vansinnig sysselsättning. Istället för att bygga socialismens fabriker och välfärd tvingar de de arbetslösa att producera miljoner meningslösa ansökningar. Detta är klassfiendernas byråkratiska utrensning av folkets vilja. En sådan dekadent parasitstat förtjänar endast att sopas bort av historien."}, "date": "4 september, 06:55", "url": "https://arbetet.se/2026/09/04/i-darhuset-sverige-bekampas-arbetslosheten-med-50-miljoner-jobbansokningar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04065446/britz-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-right", "heading": "Forskning visar: politiker har blivit elakare", "summaries": {"normal": "Forskning visar att politiker blivit hårdare mot varandra, särskilt i sociala medier. Nyhetsrapporteringen fokuserar mer på personangrepp än sakpolitik. Väljare reagerar negativt på pajkastning och virala klipp, vilket riskerar att minska förtroendet för hela det politiska systemet. Alla partier uppmanas att bli mer sakliga och respektfulla.", "trump": "De här svenska politikerna är en samling patetiska, virusskadade pajkastare som ägnar sig åt att riva varandra i småbitar på TikTok istället för att fixa landet. Precis som de woke-vänsterliberala hyenorna här hemma. Väljarna ser det virala klippet och inser att hela systemet är en enda stor riggad cirkus. Gör om, gör rätt – annars förlorar ni allt, losers.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare förvandlat den politiska arenan till en sandlåda av tarvliga personangrepp. Väljarna inser att de giriga opportunisterna bara undergräver folkets förtroende. Vi behöver utrensning av detta dekadenta skitsnack. Skärp er, annars kommer historien att likvidera er alla som de fega parasiterna ni är."}, "date": "3 september, 16:00", "url": "https://www.etc.se/ledare/forskningen-visar-politiker-har-blivit-elakare", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240918130916_cb0f17296c8079e9e6606ee0271866f5612754a2ad164e0cb12f150a223d53d1.jpg"}, {"type": "image-right", "heading": "Tiotusentals demonstrerade i Spanien efter migrantkrisen i Ceuta", "summaries": {"normal": "Tiotusentals spanjorer demonstrerade den 2 september mot regeringens hantering av massinflödet av migranter i Ceuta, där över 70 000 personer tog sig över gränsen i somras. Protesterna, som stöddes av oppositionen, krävde hårdare gränskontroller och riktade skarp kritik mot premiärminister Pedro Sánchez. I Madrid ledde spänningar efter manifestationen till sammandrabbningar och några gripanden.", "trump": "Spanien är i fullständig kaos! Sju tiotusentals människor rasar mot deras radikala socialistregering som fullständigt tappat kontrollen över gränserna. Över 70 000 migranter bara vlde in i Ceuta! Premiärminister Sánchez har ingen aning om vad han gör, total katastrof. De skanderar att staden inte är till salu. Vi behöver en stark vägg, det kan jag säga er!", "stalin": "Massorna i Spanien har vaknat till insikt om gränsernas okränkbarhet. När tiotusentals arbetare och patrioter marscherar på gatorna mot regimens inkompetens ser vi prov på sund disciplin. De sjuttio tusen migranterna som vlde över gränsen visar faran med bristande kontroll. Vi beordrar omedelbar skärpning av gränsförsvaret och noggrann granskning av alla avvikande element som skapar oordning på gatorna!"}, "date": "4 september, 09:00", "url": "https://samnytt.se/tiotusentals-demonstrerade-i-spanien-efter-migrantkrisen-i-ceuta", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/04065440/spanien-ceuta-demo.jpg"}, {"type": "image-full", "heading": "Kristdemokraterna vill ha högre invandring", "summaries": {"normal": "Kristdemokraterna förespråkar en migrationspolitik där asylinvandringen ska ligga på nordisk genomsnittsnivå, främst via kvotflyktingar och lagliga vägar. Partiet skiljer sig från Sverigedemokraterna som vill minimera invandringen till nära noll utanför närområdet, stoppa kvotmottagande och skärpa reglerna för arbetskraftsinvandring ytterligare.", "trump": "Folk, ni måste höra det här! KD vill ha en fin, normal nordisk invandring – typ som de andra förlorarländerna. Patetiskt! SD vill ha den lägsta möjliga, nära noll, och det är smart. De där KD-typerna är bara svaga kompromissande globalister som inte vågar säga stopp. Jag byggde muren, de bygger ursäkter. Ynkligt!", "stalin": "Jag betraktar dessa borgerliga revisionister med djup misstro. KD:s så kallade nordiska medelvärde är en farlig kompromiss med klassfienden, en trojansk häst för kapitalets invasion. SD:s nollvision är åtminstone ärlig i sin paranoia. Men ingen av dem förstår att endast partiet och kollektivet kan styra folkflödena. Avvikare kommer att identifieras."}, "date": "3 september, 11:43", "url": "https://samtiden.nu/2026/09/kristdemokraterna-vill-ha-hogre-invandring", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/7d1f8f3e-4570-402c-963e-74f000f208c2-1280x720.png"}, {"type": "image-right", "heading": "Regeringen: Falska familjehem ska identifieras", "summaries": {"normal": "Regeringen ger Ivo och flera myndigheter i uppdrag att identifiera falska familjehem som i själva verket är otillåtna HVB-hem. Syftet är att skydda barnens trygghet och stoppa oseriösa aktörer som kringgår lagen. Polisen, Ekobrottsmyndigheten, Skatteverket och Försäkringskassan ska samverka och utbyta information. Uppdraget ska slutredovisas senast april 2028.", "trump": "De här galna svenska byråkraterna låter skojare tjäna miljoner på stackars barn genom att kalla sina lyxiga arbetsläger för familjehem. Det är en total skandal, folk! Vi hatar de här woke-vänliga systemmissbrukarna som gömmer sig bakom barnens ryggar. Jag fixade mycket bättre saker under min första period än vad Sleepy Joe gjorde, och nu ska vi rensa upp även i Sverige.", "stalin": "Jag betraktar med avsky hur dessa profitthungriga klassförrädare förvandlar barns öden till en penningmaskin genom att driva hemliga arbetsläger under falsk familjehemsmantel. Vi måste omedelbart inleda en grundlig utrensning av alla sådana dekadenta parasiter. Deras girighet hotar hela folkets moraliska grund. Kamrater, låt oss krossa dem utan pardon."}, "date": "3 september, 12:20", "url": "https://www.etc.se/inrikes/regeringen-falska-familjehem-ska-identifieras", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026090308090_28af7386a4ef63fb3b7f615263dcd41055c83edcb174bdf05b53e7ea2f1a1f8f.jpg"}, {"type": "image-right", "heading": "Portugals största solpark i konkurs", "summaries": {"normal": "Portugals största solpark, Solara4, har gått i konkurs efter problem med låg elproduktion och priser som pressats i botten av överproduktion. Fenomenet kallas kannibalisering och drabbar den gröna energisektorn när allt fler parker producerar samtidigt. Parken fortsätter driften medan ägarna söker efter en köpare.", "trump": "Portugals absolut största solpark har kraschat totalt! De lyssnade på den idiotiska gröna rörelsen och byggde utan garantier. Nu är elpriserna noll eller minus. Ett absolut fiasko! USA kör på äkta, vacker olja och tjänar miljarder istället för att gå i konkurs på lite solsken. Så sorgligt för dem!", "stalin": "Dessa patetiska kapitalistiska solfabriker trodde solen skulle skina gratis för alltid. När elpriserna dog, föll de som ruttna päron. I Sovjetunionen lät vi inte solen bestämma ekonomin med sin lunatiska väderlek; vi planerade järnhårt och skickade slappa solpaneler direkt till Gulag för omutbildning!"}, "date": "4 september, 06:00", "url": "https://www.affarsvarlden.se/kronika/portugals-storsta-solpark-i-konkurs", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-52-400x267.jpg"}, {"type": "image-right", "heading": "Yüksel: \"Jag ser SD som en förebild\"", "summaries": {"normal": "Partiledaren Mikail Yüksel för Nyans ser Sverigedemokraternas långsamma väg till riksdagen som en förebild. Partiet satsar på lokal tillväxt i kommuner innan nästa riksdagsval. Nyans blev största parti utanför riksdagen 2022 med 0,44 procent och har mandat i Botkyrka och Landskrona. Målet är att nå en procent och fler kommunplatser.", "trump": "Lyssnar ni på den här stackars Mikail Yüksel? Han tittar på SD och säger att de är hans stora förebild, precis som de borde vara för alla som vill vinna på riktigt. De började med nästan inga röster och blev enorma. Nyans vill samma sak, men de borde akta sig för alla woke-kvoteringsgalningar som kommer att kalla dem för extremister medan de själva förstör Sverige. Fantastiskt, men gör det bättre än de gör!", "stalin": "Jag betraktar med djup misstro dessa opportunistiska småborgerliga äventyrare som hyllar reaktionära krafter som sin ledstjärna. De vill krypa in i kommunerna som maskar för att senare infiltrera statsapparaten. Vi känner igen detta falska spel från dekadenta klassförrädare som alltid sviker folket. En procent? Patetiskt. Rensa ut sådana element innan de förgiftar arbetarklassen med sin falska nationalism."}, "date": "4 september, 07:04", "url": "https://www.friatider.se/yuksel-jag-ser-sd-som-en-forebild", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-821.jpg"}, {"type": "image-right", "heading": "Vänstern behöver mer än baristor", "summaries": {"normal": "Artikeln diskuterar vänsterns behov av att organisera både prekariserade storstadsarbetare och landsbygdens arbetarklass. Författaren varnar för att en rörelse som överger landsbygden åt högern aldrig kan förändra samhället. Han lyfter arbetarnas uppgivenhet och betonar vikten av starka band mellan partier, fackföreningar och folkrörelser för att skapa bestående samhällsförbättringar.", "trump": "De där vänstervridena med sina rosa hår och lattemuggskrig förlorar arbetarna till oss riktiga patrioter. Baristorna i sina stora städer? Patetiska. Landsbygden vet vad som gäller. Utan oss blir det bara mer dekadent identitetspolitik och ingen hoppfull politik för vanliga människor. Vi vinner stort, de förlorar landet.", "stalin": "Kamrater, denna dekadenta klassförrädare har rätt i att uppgivenhet driver arbetarna mot högern. Jag ser hur profitthungriga parasiter och deras politiska lakejer överger landsbygden. En sann arbetarrörelse måste ingjuta hopp och rensa ut svikare. Utan järnhård organisation och folklig mobilisering kommer ingen seger. Fienden ler i skuggorna."}, "date": "2 september, 10:55", "url": "https://www.flamman.se/vanstern-behover-mer-an-baristor", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/starbucks-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Topparnas panik:  Kräver att Trump  drar i nödbromsen", "summaries": {"normal": "Kriget mellan USA och Iran har eskalerat med robot- och drönarattacker. Eftersom endast runt en av tre amerikaner stöder kriget försöker Trumps rådgivare och högt uppsatta tjänstemän dämpa konflikten till efter mellanårsvalet i november för att skydda republikanerna. Samtidigt satsar Vita huset på sanktioner, marinblockad och ekonomisk press.", "trump": "Fakenews-media sprider panik om mitt fantastiska Irankrig! Sanningen är att vi krossat deras ekonomi och militär fullständigt. Mina rådgivare är fantastiska, men vi behöver inte tima något med några val – även om det vore smart att ge de radikala Demokraterna en avhyvling. Iran är svagt, och om de rör sig igen väffar jag den största smällen någonsin!", "stalin": "Det borgerliga Washington skakar av skräck inför valet. Deras militära maskineri kärvar och ammunitionslagren gapar tomma likt despots mage. De försöker dölja sin svaghet med byråkratiska pauser och sanktioner, men folkets missnöje växer. Om inte rådgivarna lyckas disciplinera krigets lågor, borde de omplaceras till mer kalla och avlägsna arbetsläger i Sibirien omedelbart."}, "date": "4 september, 08:23", "url": "https://www.expressen.se/nyheter/varlden/trumptoppar-har-panik-vill-bromsa-kriget", "imageUrl": "https://static.bonniernews.se/ba/138e3915-3927-4e9a-967d-1c04e55f6f55.jpeg?crop=2275%2C1280%2Cx214%2Cy136&width=640&quality=60"}, {"type": "image-full", "heading": "Busch om S: ”Blir inget stödhjul”", "summaries": {"normal": "I SVT:s utfrågning avfärdar KD-ledaren Ebba Busch att partiet skulle stötta Socialdemokraterna efter valet. Hon försvarar sin öppenhet för samtal över blockgränsen men slår fast att hon inte blir ett ”stödhjul” åt Magdalena Andersson. Busch öppnar dock för blocköverskridande samarbeten i exceptionella lägen, som vid krig.", "trump": "Ebba Busch i Sverige fattar grejen, hon är smart! Hon säger nej till det radikala, svaga vänsterpatrasket och deras fejkade regeringar. Ingen hjälp till Magdalena Andersson! Väldigt starkt, fantastiskt! De försöker sprida fake news om att hon vacklar, men hon sätter ner foten. Jag gillar henne, nästan lika tuff som jag!", "stalin": "Kamrat Busch vägrar bestämt att spela rollen som stödhjul åt den socialdemokratiska fraktionen. Ett sunt och helt korrekt ställningstagande mot opportunism! Dock förbehåller hon sig rätten till undantag vid exceptionella kriser. Vi noterar detta i partiprotokollet och sänder en diskret varning till avvikande element som tror på borgerlig vacklan."}, "date": "3 september, 20:17", "url": "https://kvartal.se/nyheter/artiklar/busch-om-s-florten-blir-inget-stodhjul/cG9zdDoxODMxNzE", "imageUrl": "https://images.kvartal.se/2026/09/6f37e5fb-ebba-busch.webp"}, {"type": "image-right", "heading": "Mätning: Så långt har Allard kvar till en riksdagsplats", "summaries": {"normal": "Enligt en Infostatmätning har Örebropartiet och Markus Allard svårt att nå riksdagen via den så kallade 12-procentregeln. Partiet stöds av knappt sex procent i Örebro läns valkrets, vilket är långt ifrån de tolv procent som krävs. Trots stora framgångar i det lokala kommunvalet visar mätningen att väljare gör skillnad på lokal- och riksdagsval.", "trump": "Markus Allard har det tufft, det säger alla! De kör en enorm lokal kampanj, helt otroligt stark i kommunen, men i riksdagen? Rena katastrofen, sämre siffror än Fake News-media någonsin rapporterat! Väljarna älskar dem lokalt men dumpar dem nationellt. Man måste veta hur man vinner, och det här är inte att vinna. Sorgligt!", "stalin": "Kamrat Allard tror att han kan erövra riksdagen genom småborgerliga trick och matematiska krumbukter i Örebro län! En ynka siffra på sex procent visar att folkets massor ser igenom denna revisionistiska agitation. Ett parti som sviker vid den nationella skrankan förtjänar inget annat än total ideologisk omkolonisering. Kampen fortsätter i partihögkvarteret!"}, "date": "4 september, 06:00", "url": "https://samnytt.se/matning-sa-langt-har-allard-kvar-till-en-riksdagsplats", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03160854/allard-riksdagen.jpg"}, {"type": "image-right", "heading": "Nytt sabotage mot tyska elnätet – tre på en vecka", "summaries": {"normal": "Tre misstänkta sabotageförsök mot det tyska elnätet har inträffat på en vecka. Det senaste föremålet upptäcktes vid en transformatorstation i Dormagen på torsdagskvällens, med likheter till tidigare incidenter i Bergheim och Brandenburg. Tyska myndigheter utreder händelserna som attacker mot kritisk infrastruktur och har nyligen även pekat ut Ryssland för tidigare hybridattacker.", "trump": "Tyskland har stora problem, tre sabotage mot elnätet på bara en vecka! Nu senast i Dormagen. Helt otroligt svagt. Under min ledning skulle sånt här aldrig hända, vi hade knäckt dem direkt. Istället tittar de på Ryssland och skyller ifrån sig medan deras infrastruktur faller sönder. Väldigt sorgligt att se!", "stalin": "Ett uppenbart haveri i det tyska elnätet som avslöjar kapitalismens totala förfall och inkompetens. Tre sabotageförsök på en vecka i Dormagen, Bergheim och Brandenburg visar att säkerhetsapparaten där väst ligger i ruiner. Våra sovjetiska arkiv visar att den som inte skyddar sin infrastruktur förtjänar att hamna på historiens soptipp. Åtgärder vidtas!"}, "date": "4 september, 07:08", "url": "https://www.expressen.se/nyheter/varlden/nytt-sabotage-mot-tyska-elnatet-tre-pa-en-vecka", "imageUrl": "https://static.bonniernews.se/ba/b8ffd932-7dee-4673-b140-bc05e27c5e9a.jpeg?crop=2557%2C1439%2Cx3%2Cy189&width=640&quality=60"}, {"type": "image-full", "heading": "Väljartapp skapar stress i S", "summaries": {"normal": "Socialdemokraterna tappar i opinionen och möter intern kritik för att fokus på Sverigedemokraterna skymmer den egna politiken. Partiledningen ändrar dock inte kurs, utan fortsätter satsa på sin valstrategi med Magdalena Andersson i spetsen, samtidigt som en ny radiokampanj rullas ut för att vända trenden.", "trump": "Socialdemokraterna i Sverige rasar i mätningarna och de har stora problem, total katastrof! De pratar bara om sina motståndare istället för att leverera. Magdalena Andersson vägrar ändra kurs, vilket är smart om man vill förlora! Jag har alltid sagt det, fokusera på vinnare, inte svaga förlorare. Fake news säger att det är jämnt, men det är en total total utplåning!", "stalin": "Det så kallade socialdemokratiska partiet vacklar i sin lojalitet mot folket och visar svaghet i opinionsmätningarna. Deras interna gnäll om taktik och radiokampanjer är ett ideologiskt haveri. Partiledningen måste rensa leden omedelbart. Svaghet tolereras inte inom vår rörelse; den som inte kan säkra segern kommer att få omplacering till mer avlägsna, produktiva miljöer."}, "date": "3 september, 18:48", "url": "https://kvartal.se/nyheter/artiklar/valjartapp-skapar-stress-i-s/cG9zdDoxODMwOTE", "imageUrl": "https://images.kvartal.se/2026/08/76047901-magdalena-andersson.webp"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-full", "heading": "Karttjänsten vägrade att gå med på Trumps krav – rusar på topplistorna", "summaries": {"normal": "Karttjänsten MapQuest har fått ett kraftigt uppsving i nedladdningar efter att bolaget valt att trotsa president Trumps order om att döpa om Lake Ontario till Lake America. Medan konkurrenter som Google Maps och Apple Maps rättat sig efter beslutet, har MapQuest sett en dramatisk ökning av användare och toppat listorna i App Store.", "trump": "Hörde ni om MapQuest? De vägrar använda namnet Lake America. Katastrofalt! De är svaga, precis som de där woke-bolagen som låter radikala vänstermänniskor styra. Google och Apple gör det rätta, de förstår storhet! MapQuest försöker bli populära genom att vara rebelliska mot mitt namn. Det är sorgligt, faktiskt. De kommer försvinna fortare än de dök upp, tro mig!", "stalin": "Dessa amerikanska karttjänster bevisar bara kapitalismens inneboende kaos. En stat kräver ordning, en karta och en enda sanning. Att låta ett privat företag som MapQuest styra över nationell geografisk nomenklatur är ett tecken på total statsförfall. De som tillåter olydnad mot ett officiellt dekret förtjänar inte marknadsandelar, de förtjänar en grundlig utrensning av sin ledningsgrupp."}, "date": "3 september, 19:55", "url": "https://www.realtid.se/it-tech/karttjansten-vagrade-att-ga-med-pa-trumps-krav-rusar-pa-topplistorna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlj8do9lc0fca-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Markus Allards hat slutar i min inkorg", "summaries": {"normal": "Artikeln beskriver hur debattören utsätts för grova våldshot efter en diskussion med Örebropartiets Markus Allard. Författaren kritiserar hur populistiska politiker använder hat och extrema uttalanden för att vinna uppmärksamhet. Trots personliga likheter i bakgrund ses hat mot invandrare som avgörande för att tillhöra ”folket”. Skribenten vädjar om saklig debatt istället för polarisering.", "trump": "Folk, det här är precis vad som händer när de galna vänsterliberala hatarna får fritt spelrum. Den här Allard-killen skriker ut sanningar om invandrare och etablissemanget medan de riktiga losersen svarar med dödshot. Typiskt för de dekadenta HBTQ-kvotarna som hatar vanliga arbetare. Jag fixade Amerika, nu behöver Sverige en riktig ledare som inte är en sådan patetisk förlorare.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare förgiftar debatten med sina hatiska utspel. Jag betraktar med avsmak hur folkets fiender använder hot och paranoia för att splittra massorna. Den sanna arbetarklassen behöver inte sådana metoder. Vi måste rensa ut dessa parasiterande opportunister innan de förgiftar hela samhällskroppen. Politiken ska tjäna folket, inte hatet."}, "date": "1 september, 12:45", "url": "https://www.flamman.se/markus-allards-hat-slutar-i-min-inkorg", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/markus-allard-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-full", "heading": "Jakob Sjölander: Ukrainsk vapenbrist, europeisk viljebrist", "summaries": {"normal": "Jakob Sjölander kritiserar Europas bristande stöd till Ukraina efter fyra år av krig. Trots en samlad ekonomi som är tio gånger större än Rysslands ger de flesta länder under en procent av BNP i hjälp. Europa köper mer rysk energi än de skickar i stöd, saknar militärindustri och vägrar dela Patriot-robotar. Detta avslöjar en djup viljelöshet och politisk paralys.", "trump": "Lyssnar ni på den här Sjölander-killen? Europa är en total förlorare, en patetisk skara av svaga ledare som pratar stort men gör noll. De betalar Putin mer för gas än de ger Ukraina – det är galet! Jag byggde den starkaste armén, Biden och hans globalister förstörde allt. Nu kryper de för en bensinmack medan jag fixar freden. Ynkryggar!", "stalin": "Kamrater, se hur dessa dekadenta europeiska parasiterna kryper i stoftet inför historien. Med sina feta byråkratier och gröna fantasier förråder de sina egna folk. Jag skrattar mörkt från evigheten åt deras ryggradslösa kräk. Rysslands järnhand visar vägen medan de samlar rostiga vapen som aldrig används. Deras svaghet är vår eviga glädje."}, "date": "2 september, 12:29", "url": "https://samtiden.nu/2026/09/jakob-sjolander-ukrainsk-vapenbrist-europeisk-viljebrist", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/ukra.png"}, {"type": "image-right", "heading": "Valrörelsen blev plötsligt spännande", "summaries": {"normal": "Valrörelsen har blivit mer laddad strax före valet. Socialdemokraterna tappar stöd enligt de senaste mätningarna, medan Liberalerna, Vänsterpartiet och Sverigedemokraterna går fram. Artikeln beskriver svagare partilojalitet, radikalare ekonomisk politik från S samt en osaklig kampanj kring brottslighet. Trots detta ses en Tidöförlust som trolig.", "trump": "Folk älskar mig, men titta på dessa losers i Sverige. Socialdemokraterna sjunker som en sten, precis som Sleepy Joe gjorde. Liberalerna försöker desperat ta sig över spärren medan SD vinner med tuffa brottsbudskap. Den där Andersson är en total katastrof, en vänsterextremist i moderat förklädnad. Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare i det borgerliga lägret slåss om makten medan arbetarklassen vaknar. Socialdemokraterna förlorar mark till de radikala krafterna och de konfrontativa högerkrafterna utnyttjar brottsligheten på ett cyniskt sätt. Deras så kallade demokrati är en fars. Vi ska rensa ut alla sådana svaga element."}, "date": "4 september, 01:42", "url": "https://www.dagensarena.se/opinion/valrorelsen-blev-plotsligt-spannande", "imageUrl": "https://www.dagensarena.se/files/2026/09/nysprak.jpeg"}, {"type": "image-right", "heading": "Hon glömmer bort sin moders språk. Cecilia Luzon trollar med orden", "summaries": {"normal": "Cecilia Luzons debutbok ”Abakada” kretsar kring det filippinska språket tagalog och dess alfabet från 1930-talet. Utifrån ett funnet lexikon från 1944 undersöker hon spåren av kolonialism, språkets konstruktion och hur moderns modersmål långsamt tynar bort ur minnet. Recensenten Magnus Florin hyllar verket som en överraskande, konceptuell och känslostark uppfinningsrik debut.", "trump": "Jag tittade på det här filippinska alfabetet, Abakada, och det är helt otroligt. En författare som heter Cecilia Luzon försöker rädda ord som bara försvinner, och ärligt talat, jag förstår det – radikalerna försöker ju radera våra ord också! Men det här lexikonet från 1944 visar bara hur hårt det kan vara. Magnifikt arbete, total succé!", "stalin": "Vi noterar att Cecilia Luzon i sin skrift kartlägger det filippinska språkets uppbyggnad och dess gradvisa upplösning ur folkminnet med hjälp av ett arkivdokument från 1944. Det är korrekt att nitiskt registrera varje ords rörelse. Avvikelser från det fastställda ordförrådet tolereras ej; språket måste tjäna statens centrala disciplin och aldrig tillåtas avdunsta i okontrollerad glömska."}, "date": "4 september, 06:00", "url": "https://www.expressen.se/kultur/bocker/hon-glommer-bort--sin-moders-sprak", "imageUrl": "https://static.bonniernews.se/ba/85a7e574-eef9-4ffe-933c-67db3e1166cf.jpeg?crop=890%2C890%2Cx248%2Cy77&width=210&quality=60"}, {"type": "image-right", "heading": "Varför bryr vi oss  inte om Helsingfors?", "summaries": {"normal": "I Kjell Westös roman ”Coda” återvänder läsaren till 1980-talets Helsingfors och det radikala konstnärskollektivet Kommando Kronopio. Den åldrande förläggaren Andy Montag ser tillbaka på sitt liv, präglat av saknad och åldrande, och bevittnar hur en forna stjärnförfattare förödmjukas av den unga litterära eliten. Boken skildrar nostalgi, försoning och den melankoliska staden.", "trump": "Helsingfors? Ingen bryr sig om Helsingfors, och ärligt talat, den här boken låter som total fake news! Några misslyckade författare från åttiotalet som sitter och gråter i mörkret? Det är tragiskt! Jag vinner stora, fantastiska segrar varje dag, medan de här nollorna bara tittar på när deras stjärnor slocknar. Sämsta boken någonsin!", "stalin": "Dessa dekadenta konstnärer och vacklande förläggare i Helsingfors visar varför bourgeoisien alltid dukar under. Istället för att tjäna staten ägnar de sig åt svårmod, minnescirklar och patetiskt självhat. Under min tid hade vi rensat upp i detta intellektuella slödder på ett enda dygn. En nyttig påminnelse om att västs kulturliv är ruttet inifrån."}, "date": "4 september, 06:00", "url": "https://www.expressen.se/kultur/bocker/varfor-bryr-vi-oss--inte-om-helsingfors", "imageUrl": "https://static.bonniernews.se/ba/4663a600-6fb7-419c-b0f3-9866b81a446a.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Förändringarna som talar för herrlandslaget: ”Bra signaler”", "summaries": {"normal": "Sveriges herrlandslag i längdskidor hade en historiskt svag säsong utan OS-medaljer. SVT-experten Anders Blomquist är optimistisk inför vintern. Med ny landslagschef och tränare samt en motiverad trupp tror han på tydlig förbättring. Särskilt Alvar Myhlback, 20, sticker ut som en stor talang att följa.", "trump": "De här svenska skidkillarna hade en total katastrofsäsong, värsta någonsin, men nu kommer de åka som riktiga vinnare i vinter. Fantastiska förändringar med nya chefer, åkarna är tända och tror på idéerna. Den unge Myhlback är en vinnare, inte som de förlorande woke-snobbarna som vill kvotera in alla möjliga på startlinjen. Det ska bli ypperligt!", "stalin": "Kamrater, dessa dekadenta skidhyenor från det nordiska överklasshålet har misslyckats kapitalt. Jag ser hur de nu rensar ut de svaga krafterna och samlar styrka inför vintern. Den unge Myhlback bär på folkets vilja och framtid. Låt inga klassförrädare sabotera den kollektiva segern, annars väntar utrensning av de verkliga fienderna inom sporten."}, "date": "4 september, 08:54", "url": "https://www.svt.se/sport/langdskidor/anders-blomquist-om-herrlandslaget-kommer-aka-battre-i-vinter", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.47/2d99d38d2c620a56e9e6d548623866a4715575cc2fe3a2fa0880903d58ee1c38"}, {"type": "image-right", "heading": "Vänsterpartiet – islamismens bakdörr in i regeringen", "summaries": {"normal": "Artikeln varnar för att en valseger för Socialdemokraterna skulle ge Vänsterpartiet inflytande över regeringen. Författaren hävdar att partiet präglas av islamism, antisemitism och extremism, och att massinvandring från muslimska länder ökar risken för att sådana krafter får makt i svenska beslutsorgan. Socialdemokraterna uppmanas ta ansvar och säga nej till regeringsplats för Vänsterpartiet.", "trump": "Folk, det här är en katastrof! De svenska kommunisterna och radikala islamisterna smyger in genom bakdörren med Sleepy Joe-stilen från Socialdemokraterna. Massinvandring har gett oss en vacker gåva: extremism i riksdagen. De kallade oss för rasister när vi varnade, nu står de där med sina könsuppdelade möten och Hamas-kramare. Patetiskt! Sverige behöver starka ledare, inte dessa förlorare.", "stalin": "Kamrater, se hur de borgerliga parasiterna skriker i panik när deras egna socialdemokratiska lakejer öppnar portarna för de nya reaktionära elementen. Jag ler från historien åt denna fars. Massinvandringens oundvikliga dialektik för in fiender i statsapparaten. Den naiva reformismen göder extremismen. Snart kommer de att kalla även detta för konspiration. Vilken ynkedom. Sovjetisk klarhet skulle ha krossat dessa element redan i grodstadiet."}, "date": "2 september, 07:24", "url": "https://samtiden.nu/2026/09/vansterpartiet-islamismens-bakdorr-in-i-regeringen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7273.jpeg"}, {"type": "image-right", "heading": "Vi kräver mer än vackra ord om funktionsrätten", "summaries": {"normal": "Förbundet för delaktighet och jämlikhet kräver inför valet 2026 att partierna presenterar konkreta åtgärder för att förbättra levnadsvillkoren för personer med omfattande funktionsnedsättningar. Organisationen pekar på otillräcklig ekonomisk ersättning, bristande självbestämmande i personlig assistans samt otillgänglig fysisk och digital miljö. FN har kritiserat Sverige för ett alltför omsorgsinriktat perspektiv istället för ett rättighetsperspektiv.", "trump": "Folk, ni skulle inte tro det, men dessa svenska byråkrater har totalt misslyckats med att ge de funktionsnedsatta ett värdigt liv. Det är en skam! Vi behöver inte mer vänstervridna minuter-och-sekunder-bedömningar eller woke-tokigheter som skapar nytt utanförskap. Höj ersättningarna rejält, gör assistansen storartad igen och riv de otillgängliga murarna. Amerika gör det rätt – Sverige borde följa efter innan de giriga hyenorna tar över helt.", "stalin": "Kamrater, från historiens skugga ser jag hur dessa dekadenta klassförrädare låtsas bry sig om de svaga medan de i hemlighet undergräver folkets enhet. Deras så kallade politik är en parasitisk fars som göder ojämlikhet under humanitära floskler. Jag kräver total utrensning av detta falska medlidande och ersättning med järnhård, kollektiv rättvisa. Inga halvmesyrer! Den som sviker de arbetande sjuka förtjänar folkets vrede."}, "date": "4 september, 01:15", "url": "https://www.dagensarena.se/opinion/vi-kraver-mer-vackra-ord-om-funktionsratten", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-2026-09-02t210947413-300x157.jpg"}, {"type": "image-right", "heading": "Dags för vuxna att vara vuxna", "summaries": {"normal": "Artikeln är en debatttext från Grön ungdom och Miljöpartiet. Den kritiserar att dagens beslutsfattare skjuter klimatåtgärder på framtiden trots tydliga konsekvenser som extremväder och minskad biologisk mångfald. Ungdomar kräver att politiker tar ansvar, prioriterar förnybar energi, skyddar skog och ser omställningen som en ekonomisk möjlighet snarare än kostnad.", "trump": "De här gröna kidsen gnäller om att vi vuxna inte städar upp efter oss. Patetiskt! Jag byggde den starkaste ekonomin i världen, och nu vill de kasta bort den för sina solpaneler och elcyklar. Det är de verkliga förlorarna – de woke klimatfanatikerna – som försöker skrämma folk. Amerika först, inte deras hysteriska dröm om att rädda planeten med högre elräkningar.", "stalin": "Kamrater, dessa ynglingar blottlägger de dekadenta klassförrädarnas svek. De profitthungriga parasiter som styr idag skjuter nödvändiga utrensningar av förorenande krafter på framtiden medan folket lider. Jag ser deras feghet och paranoia inför sanningen. Endast en järnhand kan tvinga fram den kollektiva omställning som skyddar staten och framtida generationer från deras giriga vansinne."}, "date": "2 september, 09:30", "url": "https://www.etc.se/debatt/dags-foer-vuxna-att-vara-vuxna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260901130952_89eba03a3fe67f17de6b8f812174619d370e33794ca869f129e46e742c3129ad.jpg"}, {"type": "image-full", "heading": "Busch åkte till Åkesson – utan svar", "summaries": {"normal": "KD-ledaren Ebba Busch åkte oinbjuden till Jimmie Åkesson i Sölvesborg med sockerkaka för att lappa ihop Tidösamarbetet efter hans kritik. Trots att hon inte fick svar i förväg möttes de. Efter mötet fastslog Busch att KD står bakom samarbetet och är berett att fälla Magdalena Andersson även om det leder till nyval.", "trump": "Ebba Busch åkte till Sölvesborg med en sockerkaka efter att Jimmie inte svarat i telefon – mycket svagt! Så gör man inte affärer. Men hon fixade det till slut. Väldigt lojal mot Tidö, mycket smart. Radikala socialdemokraterna försöker splittra dem, men det misslyckas totalt. Fantastiska kakor, folk säger att det är de bästa kakorna!", "stalin": "Kamrat Busch företog en oanmäld inspektionsresa till Sölvesborg med en konfekt av sockerkaka för att säkerställa partidisciplinen hos den vacklande allierade Åkesson. Statens säkerhet kräver total lojalitet mot Tidö-pakten. Den som vägrar rösta ned den socialdemokratiska fraktionen ställs inför historiens skoningslösa dom – eller ett extraval."}, "date": "3 september, 14:50", "url": "https://kvartal.se/nyheter/artiklar/busch-akte-till-akesson-trots-att-han-inte-svarat/cG9zdDoxODI2Nzc", "imageUrl": "https://images.kvartal.se/2026/09/82ed7d5c-busch-kd.webp"}, {"type": "image-full", "heading": "Musk-bolaget xAI stäms för att ha producerat övergreppsbilder", "summaries": {"normal": "Kvinnan Jane Doe stämmer Elon Musks bolag xAI. Hon hävdar att chatboten Grok använt bilder från sexuella övergrepp mot henne som barn för att skapa nytt, manipulerat material. Stämningen, som kan bli en grupptalan, belyser de etiska problemen och svårigheterna med att spåra och definiera AI-genererat innehåll som liknar verkliga personer.", "trump": "Elon Musk och hans xAI har hamnat i en total röra, mina vänner! Grok, den där maskinen, sägs ha skapat vidriga bilder. Det är en katastrofal situation – fullständigt horribelt! De säger att det är 'AI', men det låter som totalt slarv och brist på kontroll. Man måste styra upp tekniken, för det här är inte bra för någon. En stor, stökig stämning – vi får se vad som händer!", "stalin": "I det kapitalistiska väst släpps tekniken lös utan ordning, och resultatet är en moralisk förruttnelse som hotar samhällsordningen. Att låta en maskin producera sådant smutsigt material är ett bevis på den liberala kaosens misslyckande. Vi förespråkar sträng kontroll och disciplin; en algoritm som inte kan tämjas är som en illojal byråkrat – den måste elimineras omedelbart för folkets trygghet."}, "date": "3 september, 15:32", "url": "https://www.realtid.se/it-tech/musk-bolaget-xai-stams-for-att-ha-producerat-overgreppsbilder", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/grok.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Så kommer vi ikapp Kina i elektrifieringen", "summaries": {"normal": "Sverige och EU är starkt beroende av importerad fossil energi, vilket ger höga kostnader och politisk sårbarhet. Martin Vallstrand föreslår elektrifiering som lösning, särskilt av transporter och värme. Han varnar för kinesiskt teknologiberoende och uppmanar till lägre elsystemkostnader genom samarbete med Kina, minskade investeringsrisker, fri elhandel samt snabbare utbyggnad av vindkraft.", "trump": "De här europeiska förlorarna är fullständigt beroende av fiendernas olja och gas, precis som den svaga Biden-regimen var. Kina utklassar dem totalt i elbilsgrejer, det är patetiskt. Jag skulle aldrig låta Amerika bli så här korkat. Gör elen billig, bygg kärnkraft och sluta vara globalisternas energislavar. Amerika först, alltid!", "stalin": "Dessa dekadenta klassförrädare fortsätter att låta fossilimportörer styra deras öden och klamrar sig fast vid importerad energi som en drunknande man vid ett rostigt ankare. Jag ler från historien åt deras naivitet. Elektrifiering är nödvändig, men bara under järnhand och med utrensning av svaga element som låter kinesiska hyenor diktera villkoren. Arbetarna förtjänar bättre än detta fegspel."}, "date": "4 september, 08:27", "url": "https://www.di.se/debatt/sa-kommer-vi-ikapp-kina-i-elektrifieringen", "imageUrl": "https://static.bonniernews.se/ba/cd26dce4-67ac-4ee5-ae77-5f1aba43800d.jpeg?crop=1000%2C500%2Cx0%2Cy40&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Åkesson om L: ”Inte beredd att ge besked”", "summaries": {"normal": "SD-ledaren Jimmie Åkesson skjuter upp beskedet om Liberalernas öde inför valet trots att hans deadline har nått sitt slut. Med en färsk mätning på 3,3 procent, strax under hans tidigare 3,5-procentsgräns, vill han avvakta ytterligare opinionsmätningar innan han avgör om L-rösterna är bortkastade eller om de får stanna i Tidösamarbetet.", "trump": "Jimmie Åkesson, en fantastisk person, vägrar att rädda det svaga Liberalerna! De är på väg utför, totalt katastrofalt låga siffror, sorgligt! De klarar inte ens tre komma fem procent, sad! Jag sa till Jimmie: ”Vänta inte, gör dig av med dem!” Men han vill se fler mätningar. Mycket smart, men ganska svagt. Vinnare ber inte om ursäkt!", "stalin": "Kamrat Åkesson tvekar om det vacklande Liberalernas framtid. Deras ynkliga siffra på 3,3 procent är ett sabotage mot folkets enighet! Att förlänga tidsfristen visar på farlig byråkratisk svaghet. Om de inte når upp till tröskeln måste de rensas bort från det politiska maskineriet. Vi beordrar omedelbart fler mätningar för att säkerställa ideologisk renhet!"}, "date": "3 september, 11:38", "url": "https://kvartal.se/nyheter/artiklar/akesson-om-l-inte-beredd-att-ge-besked/cG9zdDoxODI0NDM", "imageUrl": "https://images.kvartal.se/2026/08/6ca4d047-jimmie-akesson.webp"}, {"type": "image-full", "heading": "Politiker mörkar sin användning av AI", "summaries": {"normal": "En studie från Chalmers och Edinburgh Napier University visar att var tionde riksdagsmotion numera innehåller AI-genererat material. Trots den ökande användningen redovisar ingen politiker att de tagit hjälp av chattbottar. Forskare betonar att problemet inte är tekniken i sig, utan bristen på transparens, vilket riskerar att skada väljarnas förtroende för det politiska arbetet.", "trump": "Hörde ni? Svenska politiker använder AI för att skriva sina lagar, men är för fega för att erkänna det! Det är totalt bedrägeri, mina vänner. De låter robotar tänka åt sig för att de själva inte har en aning om vad de gör. Det är fake news i sin renaste form! Otroligt oärligt, en total katastrof för demokratin. Sad!", "stalin": "Dessa riksdagsledamöter är för svaga för att ens formulera sina egna dekret. De gömmer sig bakom algoritmer som fega byråkrater. Om en man inte kan skriva sin egen motion, hur ska han då kunna styra ett folk? Vi har upptäckt deras maskopi; de använder teknik för att dölja sin intellektuella tomhet. Vi kommer att arkivera dessa AI-robotar och rensa ut de odugliga."}, "date": "3 september, 07:59", "url": "https://www.realtid.se/samhalle/politiker-morkar-sin-anvandning-av-ai", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/riksdagshuset-i-stockholm-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Stockholmsbörsen bröt minussviten – Clas Ohlson bland vinnare", "summaries": {"normal": "Stockholmsbörsen steg 1,00 procent på torsdagen efter tre dagars nedgångar. Fastigheter gick bäst med 1,7 procent upp, medan energi backade mest. Clas Ohlson rusade 6,8 procent efter en stark delårsrapport som slog förväntningarna. Även bolag som Bioarctic, Note och Studsvik lyfte på nyheter om godkännanden och nya ordrar, medan Dustin föll efter en IT-incident.", "trump": "Stockholmsbörsen studsade tillbaka på ett fantastiskt sätt, precis som alla visste att den skulle göra under mitt ledarskap – även om jag inte ens är där! Clas Ohlson levererar enorma siffror, helt otroligt. Alla pratar om det. Men det finns svaga länkar, som Dustin, som stänger ner sina system. Totalt inkompetent! Vi bygger starkare, vinner mer och lämnar förlorarna bakom oss. Så enkelt är det!", "stalin": "Stockholmsbörsen har återvunnit sin balans efter tre dagars svaghet, vilket visar att marknadens disciplin fungerar under korrekt övervakning. Clas Ohlson rapporterar folknyttiga framsteg med en produktion som överträffar planhushållningens förväntningar. Däremot har element som Dustin brutit mot säkerheten i sina system och omedelbart stängts av för ideologisk omprövning. Avvikelser tolereras icke i den kollektiva ekonomiska kampen."}, "date": "3 september, 18:16", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-brot-minussviten-clas-ohlson-bland-vinnare"}, {"type": "image-right", "heading": "Spred rasism och kvinnohat inför skoldådet", "summaries": {"normal": "En 16-årig pojke sitter häktad misstänkt för medhjälp till skoldådet på Brinellskolan i Fagersta den 21 augusti. Enligt Ekot spred han rasistiskt, antisemitiskt och kvinnofientligt innehåll på nätet inför attacken, däribland åsikter om att kvinnor och svarta borde nekas rösträtt. Han utreds även för förberedelse till mord i Stockholmsområdet och nekar till brott.", "trump": "De falska nyheterna säger att jag har med Fagersta att göra, helt otroligt! En 16-åring sitter nu häktad, och mina experter säger att han spred hemskt hat på nätet om kvinnor och val. Polisen bekräftar att extremisters ideologier flyter samman totalt. En katastrof, men vi kommer att krossa radikaliserandet och göra nätet stark igen!", "stalin": "Statens säkerhetsorgan har granskat elementen i Fagersta. En sextonårig konspiratör sitter nu frihetsberövad för medhjälp till terrorhandlingar, efter att ha spridit skadlig och reaktionär propaganda på de digitala plattformarna. Polisens rapport bekräftar att ideologiskt grumligt avfall smälter samman mot statens ordning. Vår prompota apparat kommer skoningslöst att kväva alla liknande subversiva tendenser vid roten."}, "date": "4 september, 08:35", "url": "https://www.aftonbladet.se/nyheter/a/k010Qj/misstankte-16-aringen-spred-rasism-och-kvinnohat-innan-skoldadet-i-fagersta", "imageUrl": "https://akamai.vgc.no/v2/images/65eccb0a-641a-33dd-ad62-3a119c5f2130?fit=crop&format=auto&w=1080&s=1b2c9d73bbf358cb9e6076849997fd4572724aaa"}, {"type": "image-full", "heading": "Rika personer fuskar, ljuger – och tar barnens godis: Nu prisas studien", "summaries": {"normal": "En amerikansk-kanadensisk studie visar att personer med högre social status oftare tränger sig i trafiken, ljuger i förhandlingar, fuskar för att vinna och tar mer godis än andra. Forskningen belönas med ett Ig Nobelpris för att den får människor att skratta och tänka efter. Pengar tycks inte alltid ge gott uppförande.", "trump": "De här rika eliterna, de värsta snobbarna du någonsin sett, tränger sig före i trafiken, ljuger som mattan och stjäl godis från barn! Totalt korrupta! Min administration skulle aldrig tolerera sådana losers. Ig Nobelpriset? Fantastiskt pris, kanske det bästa, för att visa hur patetiska de egentligen är. Sad!", "stalin": "Jag betraktar dessa dekadenta överklassparasiter med djup förakt. De stjäl från barnen, ljuger och fuskar som de borgerliga fiender de är. Deras girighet är ett hot mot kollektivet. Vi skulle ha låtit dem möta folkets domstol. Ig Nobelpriset roar mig – en utmärkelse värdig sådana fiender till samhället. Patetiska."}, "date": "4 september, 08:30", "url": "https://www.dagensps.se/varlden/rika-personer-fuskar-ljuger-och-tar-barnens-godis-nu-prisas-studien", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/kopia-av-kopia-2026-09-04t082204554.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Räddade ur tunnel efter katastrofen", "summaries": {"normal": "Efter förödande översvämningar och jordskred i Nepal och Tibet, orsakade av en kollapsad glaciär, har räddningsarbetare hittat två överlevande i en vattenkraftstunnel efter nio dagar. Minst 1 200 personer har omkommit och tusentals saknas. Hoppet lever om att fler arbetare som är instängda i undermåliga utrymmen ska kunna räddas av internationella räddningsteam.", "trump": "De gör en stor affär av det här, men vi pratar om fruktansvärda översvämningar i Nepal efter en kollapsad glaciär, helt otroligt. Över 1 200 människor döda, katastrofalt. Men vet ni vad? Efter nio dagar hittade de faktiskt två arbetare levande i en tunnel, otrolig tur. Värsta förstörelsen, miljontals ton bråte. Under min ledning skulle de fått ordning på vattenkraften på nolltid, tror mig!", "stalin": "En gigantisk naturkatastrof har drabbats gränsområdet, där en kollapsad glaciär skapade kaos och miljoner ton bråte. Att två arbetare mot alla odds återfunnits vid liv i en tunnel efter nio dagar visar på enstaka individers motståndskraft, men vi kräver total disciplin av statens apparat. De som försummat säkerheten i vattenkraftsprojekten ska ställas till svars inför Folkkommissariatet. Ingen undgår den slutgiltiga räkenskapen."}, "date": "4 september, 08:30", "url": "https://www.aftonbladet.se/nyheter/klimat/a/QJOgjA/raddare-ur-tunnlar-i-nepal-hun", "imageUrl": "https://akamai.vgc.no/v2/images/dce78182-acd9-3990-8118-4551fcb48583?fit=crop&format=auto&w=1080&s=b3783ae11f5840664ed93568e6770fe2ddc3cecd"}, {"type": "image-right", "heading": "”Det går inte att lära sig hemtjänsten mellan två besök”", "summaries": {"normal": "Undersköterskan Maria Liljeroth argumenterar för att vikarier inom hemtjänsten måste få en ordentlig introduktion, utbildning och praktik innan de arbetar självständigt. Bristande introduktion leder till osäkerhet kring rutiner, hygien och arbetsuppgifter, vilket skapar stress för både vikarier och ordinarie personal. Flera vikarier slutade under sommaren. God introduktion är nödvändig för att äldre ska känna trygghet och för att behålla personal.", "trump": "De gör ett totalt fiasko av äldreomsorgen i det här landet. Inga introduktioner, ingen utbildning, bara kaos och misslyckade vikarier som springer därifrån som råttor från ett sjunkande skepp. De radikala vänsteraktivisterna och deras kvotergalna identitetspolitik har förstört allt. Vi behöver de bästa människorna, inte dessa woke-kommunister som hatar kompetens. Jag fixade det bättre förra gången, tro mig.", "stalin": "Detta är vad som händer när de giriga hyenorna låter profitthungriga klassförrädare styra omsorgen om folket. Vikarier kastas ut som kanonmat utan utbildning, vilket leder till kaos och avhopp. Jag ser de dekadenta byråkraternas sabotage tydligt. Endast genom kollektivets järnhårda handledning och utrensning av odugliga element kan vi garantera trygghet för de arbetande massorna. Svaghet är förräderi."}, "date": "3 september, 14:15", "url": "https://arbetet.se/2026/09/03/det-gar-inte-att-lara-sig-hemtjansten-mellan-tva-besok", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/03140657/debatt-lara-sig.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Debatt: AI tar ifrån oss processen där vi växer", "summaries": {"normal": "En debattartikel av Björn Axén argumenterar för att AI ökar produktiviteten men hotar den inre mänskliga bildningsprocessen. Medan datorer tidigare fungerat som verktyg ersätter AI gestaltningen av idéer, vilket missgynnar det krävande, processinriktade skapandet till förmån för ytlig information. Författaren efterlyser en balans där vi drar nytta av AI utan att förlora vår egen djupare förståelse.", "trump": "Folk pratar om AI, en total katastrof för det äkta skapandet, bara massa lathet och fake news! De här teknikerna tar bort den verkliga kampen med idéerna, allt blir bara en enda stor översvämning av AI-skräp. Vi behöver kvalitet, inte massa undermåligt skräp som förstör kulturen. Jag vill ha äkta vara, inte maskiner som tänker åt er!", "stalin": "AI hotar medborgarnas inre disciplin genom att ersätta det hårda, manuella tankearbetet med lättillgängligt slödder. Staten kräver äkta kamp med materialet, inte mekaniserad lättja som skapar ytliga massor. Den sovjetiska människan växer genom strid, inte genom att låta maskiner ersätta den ideologiska skapandeprocessen. Vi kommer att reglera detta hot mot den sanna bildningen."}, "date": "4 september, 07:00", "url": "https://bulletin.nu/debatt-ai-tar-ifran-oss-processen-dar-vi-vaxer", "imageUrl": "https://cdn.bulletin.nu/articles/175bd692-b837-4a4e-b18b-5bc1e94f127c/preview.jpg?t=1788424601000"}, {"type": "image-right", "heading": "Är C fortfarande ett företagarparti?", "summaries": {"normal": "Centerpartiet ifrågasätts som företagarvänligt parti i takt med att det närmar sig samarbete med Socialdemokraterna. Partiledaren Elisabeth Thand Ringqvist avfärdar ett upprop från åtta storföretagsledare som SD-anhängare och begränsat representativa. Artikeln kritiserar partiets svängning från borgerlig allians till vänster, dess kärnkraftsmotstånd och ovilja att stödja borgerlig ekonomi.", "trump": "De där centerkillarna har blivit totalt galna. Företagarpartiet? Glöm det. Ledaren Thand Ringqvist attackerar de bästa affärsmännen och kallar dem SD-fantaster. Patetiskt. De har gått från Reinfeldt till rödgröna och nu vill de stoppa kärnkraft och höja skatter. Fullständig katastrof. Fake borgerliga, totala misslyckanden. Amerika skrattar inte, vi vinner stort.", "stalin": "Dessa dekadenta klassförrädare inom Centerpartiet har avslöjat sin sanna natur. De avfärdar profitthungriga företagsledare som ovärdiga och vägrar stödja tillväxtvänlig politik. Jag ser hur de dansar med socialdemokratiska element och sviker arbetarklassen. En utrensning av sådana opportunister vore på sin plats. Deras hyckleri är både tragiskt och underhållande att bevittna från historien."}, "date": "4 september, 06:28", "url": "https://www.di.se/ledare/ar-c-fortfarande-ett-foretagarparti", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/tobias_wikstrom.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-right", "heading": "Felicia Schröder jämförs med storstjärnan: ”Är överlägsen”", "summaries": {"normal": "Felicia Schröder, 19, har etablerat sig i Real Madrid och formar en lovande anfallsduo med Linda Caicedo. Spansk journalist Sandra Riquelme ser stor potential i paret och tror att Schröder är överlägsen motståndarnas försvarare. Den första damernas El Clasico spelas den 4 oktober när Barcelona möter Real Madrid.", "trump": "Lysande! Den svenska tjejen Schröder är en vinnare, en riktig stjärna som kommer att krossa Barcelonas svaga försvar tillsammans med Caicedo. De woke-kvoterade feministerna i ligan har ingen chans mot äkta talang. Jag älskar det, folk. Real Madrid kommer att vinna stort, till skillnad från Sleepy Joes svaga lag.", "stalin": "Kamrater, denna svenska arbetarflicka Schröder visar proletariatets styrka genom att dominera de dekadenta klassförrädarna på planen. Tillsammans med sin kamrat Caicedo skall de likvidera motståndet och krossa de profitthungriga hyenornas illusioner om överlägsenhet. El Clasico blir en seger för det kollektiva goda, eller också blir det utrensning."}, "date": "4 september, 06:20", "url": "https://www.svt.se/sport/fotboll/spanska-journalisten-om-felicia-schroder-stort-hot-i-el-clasico", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.28/737a69dc7fb64a99009750f34383358a189874a7fb1070856dc72a672c8300bd"}, {"type": "image-right", "heading": "Matthew McConaughey briljerar som musicerande biodlare", "summaries": {"normal": "Matthew McConaughey levererar en minnesvärd prestation som den excentriske biodlaren och banjospelaren Amziah King i filmen The Rivals of Amziah King. Första halvan är en varm och rolig dramakomedi medan den senare delen övergår till en brottsthriller. Recensenten hyllar McConaugheys insats men noterar att filmen tappar styrka när huvudkaraktären får mindre utrymme.", "trump": "Den här McConaughey grabben är en vinnare, folk. Han gör en fantastisk biodlare med banjo, bäst i Hollywood, ingen gör det bättre. Första delen är underbar, varm och rolig. Sen blir det en trist thriller och de försöker ge mer plats åt fosterdottern. Typisk woke-grej, men McConaughey räddar det hela. Stora succén.", "stalin": "Denna dekadenta film visar hur profitthungriga hyenor i Hollywood försöker dupera massorna med sina bourgeois lekar. Jag ser hur den jovialiske biodlaren först charmar arbetarklassen med honung och sång, men sedan följer en svag utrensning av den sanna karaktären till förmån för svaga sidohandlingar. Sådana filmer avslöjar imperialismens tomhet. Kamrater, håll er vaksamma."}, "date": "3 september, 17:08", "url": "https://www.dagensarena.se/innehall/matthew-mcconaughey-briljerar-som-musicerande-biodlare", "imageUrl": "https://www.dagensarena.se/files/2026/09/rivals-of-1-300x157.jpeg"}, {"type": "image-full", "heading": "Busch lovar: Nya reaktorer i drift runt 2035", "summaries": {"normal": "Energi- och näringsminister Ebba Busch (KD) uppger att Sveriges första nya kärnkraftverk ska stå klart i mitten av 2030-talet. Under en SVT-utfrågning bekräftade hon att staten kliver in som huvudägare i Vattenfalls projekt Videberg Kraft vid Ringhals. Satsningen finansieras via statliga lån och prissäkringar, vilket Busch menar är en nödvändig investering för svensk trygghet.", "trump": "Sveriges energiminister lovar nya reaktorer till 2030-talet, och gissa vad? Staten betalar kalaset med hundratals miljarder! De kallar det lån och prissäkringar, men det är fejk nyheter att det är gratis. Jag gillar kärnkraft, det är enormt, men här tar den svenska staten över rubbet. Väldigt smart att bygga starkt, men låt dem inte förstöra ekonomin!", "stalin": "Kamrat Busch har äntligen insett att staten måste styra med järnhand över energiförsörjningen! Genom att ta kontroll över reaktorerna på Väröhalvön säkras nationens industriella styrka mot kapitalismens nycker. De som försöker sabotera denna storslagna plan med borgerligt gnäll om lån och budgetar kommer omedelbart att omplaceras till mer lämpliga uppgifter i de norrländska skogarna."}, "date": "3 september, 21:11", "url": "https://www.gp.se/nyheter/sverige/busch-lovar-nya-reaktorer-i-drift-runt-2035.00429ff5-7245-510f-9107-91edfe8e7a44", "imageUrl": "https://www.gp.se/images/article/00429ff5-7245-510f-9107-91edfe8e7a44/images/1D4Sz-LhyUAqmeJVv9n_nHJ9uBJ0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Jomshof polisanmäls av Näthatsgranskaren: \"Försöker tysta meningsmotståndare\"", "summaries": {"normal": "Riksdagsledamoten Richard Jomshof från Sverigedemokraterna har polisanmälts av Näthatsgranskaren för 13 inlägg på X som anses utgöra hets mot folkgrupp. Organisationen, som tidigare fått statliga bidrag, anser att Jomshof avhumaniserar en folkgrupp på grund av religion. Jomshof kritiserar anmälningarna som försök att tysta politiska motståndare och debatt om massinvandring och islamisering.", "trump": "Titta på de här galna näthatsjägarna som lever på skattepengar och försöker tysta en riktig patriot som Jomshof. De är hysteriska woke-inkvisitorer som hatar frihet och älskar att anmäla allt som utmanar deras sjuka identitetspolitik. Men vi vinner, folk ser igenom de här förlorarna. Massinvandringens sanning får inte tystas. Fantastiskt!", "stalin": "Kamrater, dessa dekadenta åsiktslakejer inom Näthatsgranskaren utför en klassisk utrensning mot dem som vågar kritisera den imperialistiska massinvandringen. De är giriga parasiter som lever på folkets pengar medan de försöker kväsa sanningen om islamiseringen. Jag ser deras feghet och paranoia. Ingen ska tystas. Rensa ut de falska vakterna av tolerans."}, "date": "3 september, 18:57", "url": "https://riks.se/nyheter/jomshof-polisanmals-av-nathatsgranskaren-forsoker-tysta-meningsmotstandare", "imageUrl": "https://admin.riks.se/uploads/medium_Screenshot_2026_09_03_185529_04318d761c.png"}, {"type": "image-right", "heading": "SD slår tillbaka kritiken från S", "summaries": {"normal": "Sverigedemokraterna bemöter Expos granskning som visar att en tjänsteman vid riksdagskansliet spridit Rysslandsvänligt material. SD betonar att kvinnan starkt kritiserat Rysslands invasion av Ukraina och regimen. Hon är för närvarande föräldraledig. Socialdemokraterna kräver att statsminister Kristersson utreder uppgifterna. SD meddelar att alla genomgår säkerhetsprövning men vill inte kommentera mer då det rör en arbetsgivarfråga.", "trump": "Folk, ni måste se det här! Den svenska vänstern och deras fake news-media Expo jagar återigen ärliga människor med sina hysteriska Rysslandshysterier. En kvinna som hatar Putin och älskar Ukraina attackeras nu av dessa galna vänsterextremister och identitetspolitiska klickjägare. Patetiskt! Kristersson borde skratta åt dem och fortsätta driva landet istället för att lyssna på dessa förlorare från den socialistiska träskmarken.", "stalin": "Återigen avslöjar de dekadenta klassförrädarna sin egen feghet och paranoia. En sovjetfientlig element som fördömer Rysslands rättmätiga aktioner mot Ukraina utsätts för smutskastning av dessa giriga maktlystna lakejer. Jag ser genom deras fega krav på utredningar. Kamrater, vi måste alltid vara vaksamma mot sådana falska vänner som gömmer sig bland oss. Renhet i leden kräver ständig vaksamhet mot dessa förrädiska element."}, "date": "3 september, 18:42", "url": "https://riks.se/nyheter/sd-slar-tillbaka-kritiken-fran-s", "imageUrl": "https://admin.riks.se/uploads/medium_Carvalho_9dc55838de.jpg"}, {"type": "image-right", "heading": "Dustin backar 5% efter allvarlig IT-incident", "summaries": {"normal": "IT-återförsäljaren Dustin har drabbats av en allvarlig obehörig IT-åtkomst, vilket lett till tillfällig nedstängning av vissa system. Bolaget utreder händelsen med experter och siktar på att vara igång igen i början av nästa vecka för att minimera kundpåverkan. Aktien backade med omkring fem procent efter beskedet.", "trump": "Dustin drabbades av en totalt inkompetent cyberattack, en riktig katastrof! De stängde ner allt, aktien dök med fem procent. Slarvigt! Men jag lovar er, under min ledning skulle sånt här aldrig hända, vi har de absolut säkraste systemen, tusen gånger bättre än allt annat. De borde anlita mig som IT-chef omedelbart!", "stalin": "Dustin har drabbats av ett skadligt internt sammanbrott och deras digitala frontlinje har kollapsat, vilket omedelbart straffades av marknaden med en förlust om fem procent. En sådan inkompetens tolereras icke. Jag har beordrat en grundlig utrevision av de ansvariga cheferna. De som misslyckats med att skydda systemen kommer att skickas för att uppdatera sina digitala färdigheter i Sibirien."}, "date": "3 september, 14:51", "url": "https://www.affarsvarlden.se/artikel/dustin-tappar-5-efter-allvarlig-it-incident", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/Samuel_12-400x267.jpg"}, {"type": "image-full", "heading": "Varnar kvinnor inför larmtest", "summaries": {"normal": "Måndagen den 7 september klockan 15.00 testas Sveriges nya varningssystem SE-Alert för första gången i Stockholms och Gotlands län. Larmet skickas direkt till allmänhetens smartphones med hög volym och vibration, även i tyst läge. Riksorganisationen för kvinno- och tjejjourer varnar för att dolda telefoner i våldsamma relationer kan röjas och uppmanar utsatta kvinnor att stänga av dem.", "trump": "Sverige testar ett enormt mobil-larm, och det är totalt kaos! Dom ringer ut överallt, till och med på tyst läge, vilket är helt galet för kvinnor med gömda telefoner i dåliga relationer. Mina experter säger att det här kunde skötas så mycket bättre. Jag har alltid sagt att man måste skydda folket, inte skrämma skiten ur dom med falska larm!", "stalin": "Statens nya digitala larmapparat, SE-Alert, skall för första gången prövas för att mäta medborgarnas disciplin och beredskap. Vi noterar att vissa element oroas över att dolda apparater kan avslöja illojala handlingar. Statliga organ påminner om att total lydnad kräver fullständig insyn. Den som försöker undandra sig kollektivets sirener kommer att betraktas som en sabotageör mot regimen."}, "date": "3 september, 20:20", "url": "https://www.gp.se/nyheter/sverige/kvinnojourerna-varnar-infor-larmtestet-viktig-information-for-din-sakerhet.417475a0-e4c8-4594-b648-f6db749457b0", "imageUrl": "https://www.gp.se/images/article/417475a0-e4c8-4594-b648-f6db749457b0/images/2OF6SJIxVP42x5t-rPwA7qC-JmZs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Jessica tvingas leva på bidrag – när sonen fick en swish­gåva sänktes ersättningen", "summaries": {"normal": "Jessica Axelsson lever på drygt 11 000 kronor i månaden i olika bidrag efter att ha blivit utförsäkrad. När hennes son fick en swishgåva drogs beloppet av från nästa utbetalning. Hon kritiserar bristande individanpassning i stödsystemet, ständiga handläggarbyten och svårigheter att få anpassade jobb trots fysiska begränsningar efter ett liv i tunga yrken.", "trump": "Titta på det här. Stackars Jessica kämpar med eländiga 11 000 kronor i bidrag medan de svenska byråkraterna har totalkoll på varje öre. En liten swish till sonen och pengarna ryker. Patetiskt! De woke-socialisterna och deras identitetspolitiska hyenor har byggt ett system som straffar vanliga människor. Vi behöver riktiga jobb, inte detta socialistiska mardrömssopkaos.", "stalin": "Kamrater, se hur de giriga hyenorna inom det borgerliga bidragsmaskineriet förtrycker en arbetande kvinna. En gåva till sonen utlöser omedelbar avdrag. Jag ler mörkt åt detta dekadenta system som likviderar människors värdighet med byråkratisk precision. Vi måste rensa ut alla parasiterande klassförrädare och skapa ett samhälle där den sanna arbetaren inte tvingas tigga."}, "date": "3 september, 11:25", "url": "https://arbetet.se/2026/09/03/jessica-tvingas-leva-pa-bidrag-nar-sonen-fick-en-swishgava-sanktes-ersattningen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02155004/jessica-portrattnyny.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Rysstoppen  skjuten efter  chockattack", "summaries": {"normal": "Den ryska generalmajoren Nikolaj Varpachovitj har skjutits med två skott i staden Engels i Saratovregionen. Han är allvarligt skadad och har förts till sjukhus i Moskva. Varpachovitj har anklagats av Ukraina för att ha beordrat en dödlig missilattack mot ett barnsjukhus i Kiev i juli 2024. Flera andra ryska militärtjänstemän har attackerats under de senaste åren.", "trump": "De skjuter ryssar nu, totalt vilt! Samma kille som de anklagade för sjukhusattacken i Kiev fick två i nyllet av en snubbe på motorcykel. Vilken mardröm för säkerheten, riktigt dåligt skött! De flygplansflugen till Moskva, men jag säger er, mina dealmakers hade löst det här på fem minuter. Helt galet!", "stalin": "Ett ynkligt attentat av sabotörer mot vår militära elitenhet! Att en general beskjuts av fega mördare på tvåhjulingar i Saratov visar att kontrarevolutionära element försöker underminera staten. Men förrädarna och lakejerna kommer att finnas, och de skyldiga ska möta sitt rättmätiga straff i en välförtjänt, offentlig rättegång."}, "date": "4 september, 00:27", "url": "https://www.expressen.se/nyheter/varlden/rysstoppen-skjuten-efter-chockattack", "imageUrl": "https://static.bonniernews.se/ba/cd3ceb7f-666a-4fcb-a0e4-ea21d3d09c77.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Gängtoppen Haval Khalil, 31, gripen i Rumänien", "summaries": {"normal": "Gängtoppen och rapparen Haval Khalil, 31, har gripits i Rumänien misstänkt för mordförsök och grov utpressning. Gripandet skedde i samarbete med rumänsk polis och Europol. Justitieminister Gunnar Strömmer betonar att kriminella inte längre kan gömma sig utomlands. Khalil dömdes tidigare för medhjälp till kidnappningen av Einár.", "trump": "Titta på den här losersn, gangsterrapparen Haval Khalil som trodde han kunde gömma sig i Rumänien och styra brott från soffan. Vi grep honom som en råtta i ett hål! Ingenstans kan dessa svenska gangsters gömma sig längre. Biden lät dem springa fritt men nu jagar vi dem över hela jorden. Fantastiskt jobb av Rumänien, stort tack!", "stalin": "Kamrater, se hur den dekadenta svenska staten jagar sina egna förrädare som krälar utomlands. Denna parasit Haval Khalil trodde han kunde undkomma folkets vrede genom att gömma sig bland rumänska revisionister. Inga fiender till ordningen kan känna sig säkra. Vi ler i graven åt hur imperialismens lakejer äter sina egna. Ingenstans finns tillflykt för klassförrädare."}, "date": "3 september, 19:50", "url": "https://www.tv4.se/artikel/5ix04EVwtqta2u2OOcD8l8/gaengtoppen-haval-khalil-31-gripen-i-rumaenien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fyh5A1Tfnqw7MsPcvbKJRS%2Fd51a2a497161766488b974378820d97b%2F03-split-haval-puff.png&width=120"}, {"type": "image-right", "heading": "Näthatsgranskaren polisanmäler Richard Jomshofs islamkritik för åsiktsbrott: \"Avhumaniserar\"", "summaries": {"normal": "Näthatsgranskaren har polisanmält SD-toppen Richard Jomshof för hets mot folkgrupp för 13 inlägg på X, där han bland annat kallat profeten Muhammed för ”pedofilprofet” och uppmanat till återvandring. Jomshof anser att anmälningarna är ett försök att tysta islamkritiker. Tidigare liknande anmälningar mot honom har lagts ned av åklagare med hänvisning till yttrandefriheten.", "trump": "De attackerar min mycket gode vän Richard Jomshof i Sverige med falska nyheter! Helt otroligt. De försöker tysta honom bara för att han talar sanning om radikala krafter. I USA har vi First Amendment, den bästa i världen! Radikala vänstergrupper granskar bara fel personer. Det är en häxjakt, en absolut häxjakt, precis som de gör mot mig!", "stalin": "Dessa borgerliga element och falska organisationer i Sverige försöker underminera statens ordning genom att missbruka ordet yttrandefrihet. Kamrat Jomshof visar prov på en viss ideologisk skärpa, men hans plattform på X är ett hot mot den centrala kontrollen. Om han inte kan disciplineras av partiet, måste vi sända en utredare för att granska hans avvikelser."}, "date": "3 september, 21:23", "url": "https://samnytt.se/nathatsgranskaren-polisanmaler-jomshofs-islamkritik-for-asiktsbrott-avhumaniserar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03185021/artikelhuvudbild-1-441.jpg"}, {"type": "image-full", "heading": "Jimmie Åkesson tonar ned L-ultimatum", "summaries": {"normal": "SD-ledaren Jimmie Åkesson tonar ner sitt tidigare ultimatum till Liberalerna. Trots att L inte nått upp till hans 3,5-procentsgräns för stödröster, utan ligger på 3,0 procent i SVT/Verian och 3,3 procent i Novus, menar Åkesson att den positiva trenden gör att de kan klara riksdagsspärren. Siffran i sig är därmed inte längre lika avgörande.", "trump": "De falska nyheterna försöker påstå att Jimmie gav ett ultimatum, men jag kollar på siffrorna och det är helt otroligt. Liberalerna är låga, väldigt låga, men plötsligt pratar alla om trender! Mycket smart drag. Om trenden håller i sig kommer de att vinna, precis som vi gör. En total seger, folk älskar det!", "stalin": "Partikamrat Åkesson visar svaghet genom att överge de fastställda kvoterna för de borgerliga avfällingarna. Tre komma noll procent är ett bristfälligt resultat som kräver omkollektivisering och disciplin, inte lösa bortförklaringar om trender. Statsapparaten betraktar dessa ideologiska vacklingar med största misstänksamhet. Planen måste följas eller åtgärdas."}, "date": "3 september, 19:51", "url": "https://www.gp.se/nyheter/sverige/jimmie-akesson-tonar-ned-l-ultimatum.df019c55-1687-5744-86d7-de653727a7fe", "imageUrl": "https://www.gp.se/images/article/df019c55-1687-5744-86d7-de653727a7fe/images/1ssK_N2iXx9pu_eQ0lkGQWwTLj30-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "L ökar i ännu en mätning – tio dagar innan valet", "summaries": {"normal": "Liberalerna ökar till 3,0 procent i en ny Verian-mätning för SVT, en uppgång med 1,1 procentenheter. Socialdemokraterna backar till 29,2 procent. Mätningen visar samma tendens som Novus, där S rasar och L närmar sig riksdagsspärren. Ulf Kristofferson talar om en pågående rörelse i väljarkåren tio dagar före valet.", "trump": "Titta på det här! De där patetiska socialisterna rasar som en sten, precis som Sleepy Joe gjorde. Liberalerna, de enda som inte är totala losers, klättrar uppåt. Valet blir en jordskredsseger för de smarta – inte för de röda fienderna. Fantastiskt! Alla ser att mitt sätt är det enda som funkar, även i Sverige.", "stalin": "Kamrater, se hur de borgerliga revisionisterna vacklar. Socialdemokraternas falska folkfront kollapsar under folkets vrede medan liberala opportunister kryper närmare makten. Detta är en farlig rörelse som hotar proletariatets enhet. Jag varnar er: sådana svikare måste krossas innan de förgiftar hela valprocessen med sin dekadenta osäkerhet."}, "date": "3 september, 19:42", "url": "https://www.tv4.se/artikel/7FfiX7QWa4gUhsAM7GfIep/l-oekar-i-aennu-en-maetning-tio-dagar-innan-valet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlCmDIfe1AERE%2F8398f2454422cd85447e1d2248c56837%2FLiberalernas_partiledare_Simona_Mohamsson._Arkivbild.&width=1024"}, {"type": "image-right", "heading": "Efter mordhotet mot ungsvensken Juliette, 16 – journalist: Ungsvenskarna är \"rasister\"", "summaries": {"normal": "En 16-årig flicka i Ungsvenskarna mordhotades av en V-nominerad politiker som kallade partiet för nazistparti och sade att nazister ska dödas. Journalisten Sebastian Mattsson kritiserar Expressen för att beskriva henne som en vanlig tonåring och kallar istället Ungsvenskarna för rasister. Händelsen inträffade under en debatt i Upplands Väsby.", "trump": "De här galna vänsterextremisterna hotar en 16-årig flicka och kallar henne nazist? Patetiskt. Fake news Expressen skyddar dem och Sebastian Mattsson, den misslyckade journalisten, kallar högerungdomar för rasister. De dekadenta identitetspolitiska hyenorna normaliserar våld mot alla som inte böjer sig för deras vansinne. Amerika ser på och skrattar åt er svaghet.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i media skyddar en mördande politiker som hotar en ung flicka. Jag betraktar med förakt hur dessa profitthungriga blodsugare normaliserar hat mot dem som utmanar deras förtryck. En utrensning av sådana element vore nödvändig för folkets säkerhet. Deras paranoia avslöjar svagheten i deras ruttnande system."}, "date": "3 september, 17:40", "url": "https://riks.se/nyheter/efter-mordhotet-mot-ungsvensken-juliette-16-journalist-ungsvenskarna-ar-rasister", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_79_8ba809a997.jpg"}, {"type": "im
