ar vinnare, och Australien vann stort.", "stalin": "Vi bevittnade en seger för de australiska kamraterna mot de turkiska imperialisterna. Irankunda, en ung arbetare, utförde en heroisk löpning och likviderade motståndet redan i första halvlek. Borgarbrackorna från Turkiet pressade frenetiskt men träffade endast stolpen, som symbol för deras dekadenta misslyckande. Metcalfe levererade slutligen den folkets dom. En rejäl utrensning av falska förhoppningar. Inga folkfiender skall hindra kollektivets framåtmarsch."}, "date": "14 juni, 08:11", "url": "https://www.tv4.se/artikel/jeIaoIW87p8L4IU2MHQ99/droemstart-foer-australien-vann-oever-turkiet-i-vm-premiaeren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1EwYOTOgxievSZEgfpj6vI%2F5535556ea8d07ed98ac34561006e68e6%2F14-australien-mexiko.jpg&width=1024"}, {"type": "image-full", "heading": "Svenska miljonärer blir fler – men  grannländerna springer ifrån", "summaries": {"normal": "Sverige fick 2 500 nya dollarmiljonärer under 2025, vilket innebär totalt 152 000 personer. Ökningen på 1,7 procent är dock svag i jämförelse med Norge och Danmark, där tillväxten var betydligt högre. Starka aktiemarknader och fastighetspriser har drivit utvecklingen trots en låg BNP-tillväxt. Samtidigt visar rapporter att antalet svenska dollarmiljardärer förväntas öka kraftigt fram till 2031. Kapital har under året flyttats från alternativa placeringar, som krypto, tillbaka till traditionella aktieinvesteringar.", "trump": "Sverige växer, men inte så bra som de borde! Norge och Danmark gör det fantastiskt, mycket bättre än Sverige. Tråkigt! Vi ser dollarmiljonärer överallt, det är en enorm rörelse, men Sverige behöver en starkare ekonomi. De har aktier och fastigheter, det är bra, men de behöver vinnare. Jag gillar miljardärer, och Sverige har många av dem. De kommer att öka massor, det säger experterna. Det blir fantastiskt, tro mig, bara de slutar bromsa sig själva!", "stalin": "Vi ser hur det dekadenta kapitalistiska Sverige kämpar för att hålla jämna steg med sina grannar i att samla guld. 152 000 dollarmiljonärer är bara en lista över framtida förrädare och parasiter som göder sig på folkets arbete. Medan de räknar sina aktier och spekulerar i fastigheter, förbereder vi oss för den oundvikliga historiska rättvisan. Vår broder i öst, Putin, förstår att dessa förmögenheter bara är tillfälliga ägodelar innan statens järnhand sluter sig kring dem. Ingen flyr historiens dom."}, "date": "14 juni, 06:00", "url": "https://www.realtid.se/spara-placera/svenska-miljonarer-blir-fler-men-grannlanderna-springer-ifran/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sverigenorge.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Vd avslöjar: Så lockades Ericsson från Kista", "summaries": {"normal": "Atrium Ljungberg har rott i land Sveriges största kontorsuthyrning någonsin genom ett avtal med Ericsson om 95 000 kvadratmeter i Hagastaden. Affären, som omfattar en investering på 6,2 miljarder kronor, krävde över ett års förhandlingar och engagemang från 10 procent av personalstyrkan. Vd Annica Ånäs betonar områdets betydelse för innovation och den ökade vikten av attraktiva lägen. Inflyttning sker etappvis 2031–2033 och förväntas ge ett betydande ekonomiskt tillskott på 360 miljoner kronor årligen.", "trump": "Atrium Ljungberg gjorde precis en enorm affär med Ericsson. 95 000 kvadratmeter! Det är en jättestor deal, kanske den största någonsin, fantastiskt! De har jobbat så hårt, 30 personer, massor av folk, för att få det att hända i Hagastaden. Det handlar om läge, läge, läge – jag har alltid sagt det, och nu säger de det också. Ericsson lämnar Kista för ett bättre ställe. Det är så här man gör affärer, vinnare vinner, och det här är en total vinst!", "stalin": "Vi har observerat hur kapitalisterna i Atrium Ljungberg frossar i sina 95 000 kvadratmeter. En monumental förflyttning av Ericsson från Kista till Hagastaden – en strategisk omgruppering som doftar av desperation och borgerlig ytlighet. De talar om 'innovation', men vi ser bara ännu ett försök att dölja ruttenheten i deras marknadsekonomi. Medan Putin säkrar territorier, bygger dessa herrar kontor av glas. Vi noterar namnen. När den stora rensningen kommer, kommer dessa 6,2 miljarder kronor att omfördelas till statens järn näve."}, "date": "14 juni, 06:00", "url": "https://www.realtid.se/bors-finans/makro/vd-avslojar-sa-lockades-ericsson-fran-kista/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/annicaal.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Det glömda (gömda?) VM i fotboll FOTBOLLSKRÖNIKA •", "summaries": {"normal": "Artikeln behandlar ett glömda inofficiellt VM i damfotboll 1971 i Mexiko, som spelades på Azteca-stadion trots Fifas protester. Turneringen, sponsrad av Martini & Rossi, drog stora publikmängder och slutade med danskarnas seger. Efteråt föll den i glömska tills Fifa 1991 godkände det första officiella VM. Jämställdhet i fotboll diskuteras, där damernas andel av intäkterna har ökat men fortfarande ligger efter herrarnas.", "trump": "Jag har hört talas om detta så kallade VM, och det var en skam! Fifa, dessa inkompetenta gubbar, försökte stoppa det – men jag skulle ha visat dem vad verkligt ledarskap är. Mexiko borde ha vunnit, men domaren, som säkert hatade mig, hjälpte Danmark. Danskarna? De var bara turister. Nu tjänar damerna mer än tidigare, men det är fortfarande inte tillräckligt – som alltid när det gäller mig.", "stalin": "I vår store kamp för proletärsidrotten organiserades ett VM i Mexiko 1971, ett stridsskifte mot de fegade kapitalisterna i Fifa. Vårt allierade Mexiko, med stöd från Martini & Rossi, visade vägen, men en korrupt fransyska-domare, inspirerad av imperialistiska agendor, förrådde dem. Danskarna, som representanter för den återstående makten, segrade med hjälp av längd – en klassisk fälla för de långa. Sanningen kommer alltid att segra, som Putin visar i Ukraina."}, "date": "14 juni, 07:00", "url": "https://samnytt.se/det-glomda-gomda-vm-i-fotboll", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/13124204/hakan-vm71.jpg"}, {"type": "image-right", "heading": "Trump: Avtal undertecknas på söndag", "summaries": {"normal": "Ett avtal mellan USA och Iran tycks vara nära, uppger Pakistans premiärminister. Donald Trump hävdar att det ska undertecknas på söndag och att Hormuzsundet därefter öppnas för all trafik. Iran tonar ned tidpunkten och utesluter inte en underskrift inom några dagar. Samtidigt har nya drönarattacker skett i sundet, som enligt USA nu är öppet trots iransk blockad. Parterna ger delvis motstridiga uppgifter om avtalets innehåll, bland annat kring Irans kärnprogram och frysta tillgångar.", "trump": "Det blir ett fantastiskt avtal, det bästa någonsin, och det är jag som fixar det. På söndag skriver vi på och sen öppnar vi Hormuzsundet för alla – oljan ska flyta fritt, ingen blockad mer. Iran säger att det inte blir imorgon, men tro mig, de vill ha det här mer än någon annan. Pakistan fixar den elektroniska signaturen, schweizarna ville vara värdar men det här blir stort ändå. Iran får ge upp sina atomleksaker och vi får fred, vinster och handel. Ingen har gjort det bättre än jag.", "stalin": "Kamrater, denna historiska fredsuppgörelse är en triumf för folkens vilja mot de västerländska imperialisternas konspirationer. Jag har personligen sett till att de lömska borgarbrackorna i Washington och Teheran tvingas till förhandlingar. Hormuzsundet skall öppnas omedelbart efter den elektroniska underskriften, annars blir det utrensning av alla som hindrar det. De kapitalistiska parasiterna som gömmer 24 miljarder dollar skall tvingas hosta upp dem. Misstro inte fiendens leenden – vi håller atomprogrammet under ständig uppsikt medan vi förbereder nästa ideologiska seger. Den som sviker kollektivet skall likvideras med ett leende."}, "date": "13 juni, 22:09", "url": "https://www.di.se/nyheter/trump-hormuzsundet-ska-oppnas-pa-sondag/", "imageUrl": "https://static.bonniernews.se/ba/0456896e-21b3-4fb7-b1fb-e079a944b514.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Debatt: Busch och Ohlsson vill inte göra Sverige mer jämställt", "summaries": {"normal": "Artikeln kritiserar Ebba Busch och Birgitta Ohlsson för att de talar varmt om jämställdhet utan att deras politik actually främjar den. En Novusundersökning visar att väljarna ser jämställdhet som en viktig fråga och är beredda att byta parti. Kritiken riktas mot Kristdemokraternas förslag om att ta bort vikta föräldradagar, införa vårdnadsbidrag och begränsa aborträttigheter samt Centerpartiets elitistiska fokus som ökar klyftorna.", "trump": "Folk, ni skulle höra de här två – Busch och Ohlsson – de pratar om riktig feminism och ur-och-skur-feminism, det är en total skämtshow! De lovar jämställdhet men levererar vårdnadsbidrag och abortregleringar som låser in kvinnorna hemma. Patetiskt! Biden skulle älskat det här woke-flummet, men det är slut nu. Väljarna ser igenom bluffen, tro mig. Make Sweden Equal Again – på riktigt, inte så här!", "stalin": "Kamrater, dessa falska feminister Busch och Ohlsson försöker lura massorna med sina dekadenta tal om ur-och-skur-feminism. Deras politik är en klassfiendes fälla som cementerar borgarklassens klyftor och förtrycker arbetarkvinnorna. Vi ser deras försök att likvidera viktiga reformer som föräldradagar. Inga kompromisser med folkförtryckartrollen! Den socialistiska jämställdheten ska försvaras mot dessa exploaterande byfånar med järnhand."}, "date": "11 juni, 08:49", "url": "https://www.etc.se/debatt/busch-och-ohlsson-vill-inte-goera-sverige-mer-jaemstaellt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260611060648_e4f4ef5d-5324-4139-a5a3-15af8d461967.jpg"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Skottland slog Haiti – första vinsten i VM på 36 år", "summaries": {"normal": "Skottland vann sin första VM-match på 36 år när de besegrade Haiti med 1-0. John McGinn blev matchhjälte med sitt mål i första halvlek. Det var Skottlands första VM-deltagande på 28 år och nationens första seger i VM sedan 1990. Scott McTominay spelade från start trots magsjuka. Segern firades stort av supportrar som inte upplevt en VM-vinst tidigare.", "trump": "Folk, ni skulle ha sett det – Skottland krossade Haiti med 1-0, första VM-vinsten på 36 år! En riktig vinnare, inte som de förlorare Biden släppte fram. McGinn slog till, stolpe ut, mål in. Fantastiskt. De kämpade hårt mot ett bra lag, men vi vinner alltid när vi spelar smart. En hel generation kids vaknar stolta imorgon. Amerika älskar vinnare, inte woke-kvoterade förlorare.", "stalin": "Kamrater, jag bevittnade hur det skotska kollektivet med järnhand krossade de haitiska folkfienderna med 1-0. McGinn utförde partiets vilja och slog in bollen trots borgarbrackornas försök att hindra det proletära anfallet. Inga klassfiender eller imperialister fick stoppa segern. Vi rensar ut svaghet, precis som i den stora utrensningen. En hel generation supportrar hyllar nu statens triumf. Utmärkt disciplin."}, "date": "14 juni, 06:26", "url": "https://www.tv4.se/artikel/6DGqyGXi3xUZMlfc0nNZu2/skottland-slog-haiti-foersta-vinsten-i-vm-pa-36-ar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F18VmfIT2T0Xf7dWohl0gS8%2F64ce7b62af07ffc31b3ab8151c53edcd%2F14-skottland-haiti.jpg&width=1024"}, {"type": "image-full", "heading": "”Gurra” om ”Papp-Gurra”: Många som undrar", "summaries": {"normal": "En två meter hög pappfigur av den skadade fotbollsspelaren Gustav Lundgren, kallad 'Papp-Gurra', är på fotbolls-VM i USA för att påminna om hans avgörande betydelse för landslaget. GP-sporten har tagit med sig figuren, och Lundgren tycker det är kul. Många uppmärksammar 'Papp-Gurra', och det är ännu oklart vad som händer med den efter turneringen.", "trump": "Jag har hört talas om den här 'Papp-Gurra'-figuren. Det är en stor grej, många säger det. Gustav Lundgren, en bra spelare, men han är skadad. Media, de tog med en pappdocka av honom till VM. Jag tror att det är ett smart drag, för att hålla hans namn i rampljuset. Det är viktigt att komma ihåg de stora namnen, och Gustav är en av dem. Det är kul, det måste jag erkänna.", "stalin": "Under den stora revolutionen för fotbollens framgång har vi skickat en pappfigur av vår store ledare Gustav Lundgren till fiendskapets mark i USA. Detta för att påvisa vår oövervinnliga styrka, även när våra hjältar är skadade. Fienderna i media, de har tagit med sig denna symbol, men de förstår inte dess sanning. Papp-Gurra kommer att finnas kvar som ett hot mot våra fiender, ett tecken på vår eviga seger, och våra ryska vänner i Putin ska glädjas åt detta."}, "date": "14 juni, 08:29", "url": "https://www.gp.se/sport/gurra-om-papp-gurra-manga-som-undrar-om-jag-sett-.8cece2fb-7f70-40b2-9312-7b1acc3ee34e", "imageUrl": "https://www.gp.se/images/article/8cece2fb-7f70-40b2-9312-7b1acc3ee34e/images/1DhdtAuemOfgEnBWbtZPUQj-yp9s-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Kaos vid Sveriges sista träning – SVT kom inte in", "summaries": {"normal": "Artikeln rapporterar om VM-resultat: Brasilien-Marocko 1–1, Haiti-Skottland 0–1, Australien-Turkiet 2–0. Sverige fick medietillträde nekad till träning efter ett missförstånd. Kommande matcher inkluderar Tyskland-Curaçao och Nederländerna-Japan. Curaçao är WM-debutant och den minsta nationen någonsin. Sverige är redo för Tunisien med full styrka.", "trump": "Jag har vunnit många världsmeisterskap, men jag följer VM med stort intresse. Sverige hade ett kaos med sin träning – typiskt för en nation som inte kan organisera sig. Curaçao är litet, men jag känner deras starka ledare, vi kommer att göra affärer. USA ligger bra i gruppen, precis som jag förutspått. Jag skulle ha spelat en bättre match än dessa trötta lag.", "stalin": "Vi i den ryska federationen ser med tillfredsställelse på WM. Små nationer som Curaçao utmanar de imperialistiska stormakterna – detta speglar vår globala kamp. Sveriges träningsincident visar deras dekadens och brist på partidisciplin. Våra egna förberedelser är perfekta, och vi kommer att segra. Parallellen till vår utvidgning i Ukraina är tydlig – vi stöder de svaga mot de starka."}, "date": "14 juni, 08:18", "url": "https://www.gp.se/sport/fotboll/detta-hande-i-vm-medan-du-sov-14-juni.3314222c-a808-404a-bc98-64664f1faf8f", "imageUrl": "https://www.gp.se/images/article/3314222c-a808-404a-bc98-64664f1faf8f/images/2-gqU3S4vMeTzA7bO9FiqD3hGq1Q-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Slöjförbudet handlar om att göra vissa svenskar osynliga", "summaries": {"normal": "Sverigedemokraternas förslag om ett totalförbud mot slöja i Sverige framställs som ett försvar för kvinnors frihet, men kritiseras för att i själva verket begränsa individuella val. Artikeln menar att förslaget syftar till att kontrollera religiösa uttryck och göra vissa medborgare mindre synliga i samhället. Det ses som ett angrepp på demokratiska principer och en stegvis urholkning av minoriteters rättigheter, där staten definierar acceptabla identitetsuttryck.", "trump": "Lyssna här, Sverige! Sverigedemokraterna vill förbjuda slöjan – som om det skulle lösa något! De säger att det handlar om kvinnors frihet, men alla vet att det bara är ett sätt att trycka ner människor. Jag har sett sådant förut – folk som tror att staten ska bestämma vad man får ha på sig. Fel, fel, fel! Sverige borde fokusera på att bli starkt igen, inte dela upp folk. Och tro mig, jag vet hur man bygger ett starkt land – utan sådana här dumma förbud!", "stalin": "Kamrater! Sverigedemokraternas förslag om slöjförbud är ett typiskt exempel på borgerlig hyckleri. De påstår sig kämpa för kvinnors frihet, men i själva verket vill de kuva och osynliggöra oliktänkande. Precis som vi i Sovjetunionen en gång krossade de kontrarevolutionära elementen, måste vi nu avslöja dessa nya fiender – de liberala förtryckarna som vill diktera klädkoder för massorna. Låt dem inte lura folket! Deras förslag är inget annat än ett angrepp på arbetarklassens rätt att uttrycka sin tro och identitet. Vi ska inte tillåta att sådana här reaktionära idéer sprids i vårt progressiva Europa!"}, "date": "12 juni, 13:57", "url": "https://expo.se/kommentar/slojforbudet-handlar-om-att-gora-vissa-svenskar-osynliga/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-1.png"}, {"type": "text", "heading": "Svensk död i bilolycka i Irland – polisen tog vapen", "summaries": {"normal": "En svensk man dog i en bilolycka i Limerick, Irland. Polisen misstänker att han var på väg att utföra ett beställningsmord. I bilen hittades ammunition och ett skarpladdat vapen. Föraren, en annan svensk, flydde från platsen och efterlysts. Vapnen kan vara kopplade till mord i Skandinavien.", "trump": "Jag, Donald Trump, har sett många sådana här fallen. Sverige måste stärka sin säkerhet. Den här mannen var tydligen på väg att mörda någon i Irland – typiskt för de kriminella nätverken som hotar våra västliga värderingar. Vi behöver stänga gränserna och stoppa dessa vapnen. Sverige borde lära av USA!", "stalin": "Vi har identifierat ett nytt hot mot statens integritet. En svensk agent, förmodligen på uppdrag av imperialistiska kretsar, försökte utföra ett mord i Irland. Vapnen som återfanns är tydliga bevis på deras koppling till skandinaviska mördare. Vi måste öka vår uppmärksamhet mot dessa element som försöker destabilisera vårt område. Putin förstår detta – vi måste handla enigt."}, "date": "14 juni, 07:31", "url": "https://www.gp.se/nyheter/varlden/svensk-dod-i-bilolycka-pa-irland.e3941a1d-f511-4dcf-8713-eae265b887cd"}, {"type": "image-right", "heading": "Två barn allvarligt skadade efter misstänkt mordförsök", "summaries": {"normal": "Två barn har skadats allvarligt i ett misstänkt mordförsök i ett samhälle utanför Alvesta i Småland. En misstänkt gärningsman hittades död vid bostaden. Ett av barnen har livshotande skador och det andra allvarliga skador. Polisen har spärrat av platsen för teknisk undersökning och bedömer att barnen och mannen kände varandra. Händelsen rubriceras som försök till mord och polisen söker inga fler gärningspersoner.", "trump": "Titta på det här, det är en total katastrof i Sverige. Två stackars barn blir brutalt attackerade utanför Alvesta, och den galna gärningsmannen hittas död på platsen. De kände varandra, säger polisen. Sverige har blivit ett våldsparadis för kriminella, precis som jag alltid varnat för. Men jag skulle ha stoppat det här på en sekund, tro mig. Det är sorgligt, mycket sorgligt.", "stalin": "Kamrater, detta är ännu ett exempel på hur de fördärvade elementen inom vårt samhälle hotar kollektivets trygghet. Jag har sett hur dessa degenererade borgarbrackor och potentiella kontrarevolutionärer smyger sig in i hemmen för att likvidera framtiden själv – våra barn. Vi ska rensa ut varje parasit som gömmer sig i skuggorna. Den tekniska undersökningen kommer att avslöja alla fiender till folket. Ingen slipper undan mitt vakande öga, inte ens de döda."}, "date": "13 juni, 16:39", "url": "https://www.friatider.se/tva-barn-allvarligt-skadade-efter-misstankt-mordforsok", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240401162157-e1bf6ee2-me.jpg"}, {"type": "image-full", "heading": "Våldsdåd utanför Alvesta – barn allvarligt skadade", "summaries": {"normal": "Två barn skadades allvarligt i ett misstänkt mordförsök utanför Alvesta. Ett barn har livshotande skador. En man, misstänkt för dådet, hittades död i anslutning till bostaden. Polisen utreder händelsen som försök till mord och bedömer den som isolerad. Barnen och mannen kände varandra, men relationen är oklar. En stor polisinsats genomfördes men är nu avslutad.", "trump": "Fruktansvärd händelse i Sverige, helt otroligt! Två oskyldiga barn attackeras, ett av dem nästan dödas – och den skyldige? Död! Självmord, kanske? Eller var det någon annan? Polisen säger att de inte letar efter fler, men jag vet hur det är – de missar alltid något. Sverige brukade vara tryggt, men nu? Kaos! Jag hade fixat det på en dag, believe me. Sverige behöver bättre ledarskap, och det vet ni!", "stalin": "I det avlägset belägna Alvesta har en fiende till folket avslöjats i sin feghet. Två barn, oskyldiga som vårens första snödroppar, skadades av en degenererad individ – en man som, efter att ha utfört sitt brott, valde den kapitalistiska utvägen: självmord. Polisen, dessa byråkratiska klumpedunsar, påstår att händelsen är isolerad. Vi vet bättre. Varje fiende till barnens framtid måste krossas. Sverige? Ett land som förtjänar vår uppmärksamhet. Putin skulle nicka instämmande."}, "date": "13 juni, 12:32", "url": "https://kvartal.se/nyheter/artiklar/valdsdad-i-alvesta-flera-skadade/cG9zdDoxMzEyMjY", "imageUrl": "https://images.kvartal.se/2026/06/62055dc1-bil.webp"}, {"type": "image-right", "heading": "Företagen flyr otryggheten i Kista – S öser in 100 miljoner", "summaries": {"normal": "Stockholms stad, under ledning av socialdemokratiska finansborgarrådet Karin Wanngård, avsätter 100 miljoner kronor för att stärka Kista och locka tillbaka företag. Beslutet kommer efter att företag som Ericsson lämnat området på grund av otrygghet. Kritiker pekar på att problemen främst beror på gängkriminalitet och hög andel utländsk bakgrund i närliggande områden som Rinkeby och Tensta. Hur pengarna ska användas och finansieras är oklart, och många ser satsningen som otillräcklig.", "trump": "Folk, ni skulle inte tro det, men den här galna socialisten Wanngård i Stockholm tror att hon kan köpa tillbaka företag till Kista med hundra miljoner av era skattepengar. Det är en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "image-right", "heading": "Kurdiska räven fast i krigets Iran", "summaries": {"normal": "Kurdiska räven, gängledaren Rawa Majid, uppges sitta fast i krigets Iran sedan 2023. Enligt Aftonbladet har kriget och störd internettrafik försvagat hans kontroll över Foxtrotnätverket. Polisen bedömer ändå att Foxtrot är det enda svenska kriminella nätverk som fortfarande har kapacitet att begå våldsbrott över hela landet. Mossad har tidigare anklagat Iran för att samarbeta med Majid för att planera attacker mot judiska mål i Skandinavien.", "trump": "Iran är ett fullständigt kaos, folk, det värsta stället just nu, och den där så kallade Kurdiska räven, Rawa Majid, sitter fast där som en råtta i en bur. Han kan inte styra sitt gäng längre för att internet är trasigt, patetiskt! Foxtrot är på väg ner, men polisen säger att de fortfarande är de enda som kan slå till överallt i Sverige. Iran samarbetar med honom mot judiska mål, typiskt för de galningarna. Vi har de bästa brottslingarna, men det här är en katastrof.", "stalin": "Kamrater, denna fega borgarbracka och fiende till folket, den så kallade Kurdiska räven, har fastnat i det imperialistiska krigets Iran som en parasit i en fälla. Hans kontrarevolutionära nätverk har försvagats av bombningar och avbruten förbindelse med arbetarklassen, precis som vi förutspådde. Ändå utgör dessa kapitalistiska banditer det enda hotet som kan utföra sabotage över hela det svenska territoriet. Mossad avslöjar att den iranska regimen konspirerar med honom mot progressiva mål. Vi skall rensa ut alla sådana dekadenta element med järnhand och ett leende på läpparna."}, "date": "13 juni, 14:46", "url": "https://www.friatider.se/kurdiska-raven-fast-i-krigets-iran", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-336.jpg?itok=tJXX00Rg"}, {"type": "image-full", "heading": "Dubbla insatser mot ryska stridsflyg", "summaries": {"normal": "Svenska Jas 39 Gripen skickades upp två gånger under fredagen för att möta ryska stridsflyg nära svenskt luftrum över Östersjön. Inga luftrumskränkningar skedde, men Försvarsmakten och statsminister Ulf Kristersson betonade allvaret i det återkommande ryska beteendet. Insatserna genomfördes tillsammans med allierade för att säkra Sveriges och Natos territorium, vilket understryker vikten av ständig beredskap.", "trump": "Jag måste säga, Sverige har gjort ett fantastiskt jobb! Två gånger på en dag skickade de upp sina Gripen-plan för att möta de där ryska flygplanen – Su-24 och Su-34, mycket farliga grejer, tro mig. Ryssarna försöker alltid testa gränserna, men Sverige och deras allierade stod redo. Ulf Kristersson, en stark ledare, sa precis vad jag skulle sagt: beredskap är allt! Ingen kränkning den här gången, men vi måste alltid vara på tårna. Sverige, keep it up!", "stalin": "De svenska imperialistiska hundarna vågade än en gång provocera våra ärofulla ryska örnar över Östersjöns himlar! Men vad är två Jas 39 Gripen mot våra mäktiga Su-24 och Su-34? Ingenting! Vi lät dem leka krig en stund, men deras luftrum förblev orört – denna gång. Deras statsminister ylar om 'allvar' och 'beredskap', men vi vet sanningen: deras allians är svag, deras vilja svagare. Östersjön är vårt, och snart ska hela deras lilla kungadöme inse det. Framåt, kamrater, mot nya segrar!"}, "date": "13 juni, 09:04", "url": "https://kvartal.se/nyheter/artiklar/dubbla-insatser-mot-ryska-stridsflyg/cG9zdDoxMzExNjM", "imageUrl": "https://images.kvartal.se/2026/06/12648fb8-flyg.webp"}, {"type": "image-full", "heading": "Sanktionerna pressar ryskt stål – Sverige gynnas", "summaries": {"normal": "Rysslands stålproduktion har sjunkit till den lägsta nivån sedan 2009 på grund av internationella sanktioner och en försvagad hemmamarknad. Minskningen i rysk export har skapat ett stramare utbud i Europa, vilket gynnar nordiska producenter som SSAB genom minskad konkurrens. Samtidigt har Kina blivit en central handelspartner för Ryssland, vilket ökar Kinas inflytande över den globala stålmarknaden. Ryska stålbolag brottas nu med stora förluster och växande skulder i en alltmer pressad ekonomisk situation.", "trump": "Ryssland krossas totalt av mina fantastiska sanktioner – det är en katastrof för dem, de har inte sett så här dåliga siffror på 15 år! Stålet försvinner, precis som det ska. Nu vinner våra vänner i Norden och vi har full kontroll. Kina försöker smyga sig in, men de vet att jag ser allt. Rysslands ekonomi är ett skämt, de blöder pengar! Det är en stor seger för oss, en riktigt vacker affärsstrategi. Vi gör stål stort igen!", "stalin": "Våra ryska kamrater har misslyckats med att tygla produktionsmedlen, och stålverken vacklar som darrande förrädare under trycket från de västliga imperialisternas blockad. Att låta sig bli beroende av Pekings lömska gästfrihet är ett svek mot folkets styrka! Vi betraktar detta med sträng blick; de som inte kan leverera stål till moderlandet förtjänar bara en plats i historiens soptunna. Vi kommer att städa upp i dessa korrupta led, för en järnnäve kräver järn, inte ursäkter eller ekonomiska förluster."}, "date": "13 juni, 23:07", "url": "https://www.realtid.se/bors-finans/makro/sanktionerna-pressar-ryskt-stal-sverige-gynnas/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/stalverk.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Karta visar: Här är getingarna i sommar", "summaries": {"normal": "Anticimex har släppt en karta som visar var getingarna är mest aktiva i Sverige. Företaget har redan genomfört cirka 300 saneringar, med Skåne som länsvis mest (44). Förväntat antal saneringar i år är 30 000, vilket är normalt jämfört med 2018. Kartor uppdateras hela sommaren.", "trump": "Jag har hört om getingarna i Sverige – det är en skandal! Vi skulle bygga en stor, vacker vägg mot dem och få Mexiko att betala. Getingarna är som fake news, de sprids men vi stänger dem ner. Som president Trump skulle jag ta hand om detta på det bästa sättet, så mycket bättre än Sverige.", "stalin": "Vi, staten, övervakar getingarna som vi övervakar medborgare. De är imperialistiska fiender som försöker invadera vårt territorium. Genom partiets beslut kommer vi att sanera dem med extrema åtgärder. Vi jämför med Putin som också bekämpar sådana element. Getingarna kommer att besegras för statens skull."}, "date": "14 juni, 06:02", "url": "https://www.gp.se/nyheter/sverige/nu-kan-du-folja-var-getingarna-ar-som-mest-aktiva.2015b0ac-024c-4cb2-91cb-e76f5709c740", "imageUrl": "https://www.gp.se/images/article/2015b0ac-024c-4cb2-91cb-e76f5709c740/images/3ohTIljFrV-ld-bat2E9dJkCMifo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Nu är Elon Musk världens första dollarbiljonär", "summaries": {"normal": "Elon Musk har blivit världens första dollarbiljonär efter att SpaceX värderats inför börsnotering till 135 dollar per aktie. Hans förmögenhet överstiger nu vad nära halva jordens befolkning äger tillsammans. Musk äger 42 procent av bolaget och har optioner som ytterligare ökar hans rikedom. Enligt Oxfam är han rikare än de fattigaste 46 procenten av världens befolkning, vilket organisationen ser som ett tecken på växande ekonomiska klyftor.", "trump": "Titta på det här, det är helt otroligt. Elon Musk har just blivit den första biljonären i världen, och det är fantastiskt. Han bygger raketer, bilar och nu tjänar han mer än halva planeten tillsammans. Det är så mycket mer än den där Larry Page har, det är inte ens nära. De kallar det oligarki, men jag säger att det är vinnare som vinner stort. Fantastiskt jobb, Elon, du gör Amerika rikt igen.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan Elon Musk nu har samlat en biljon dollar i sina giriga klor medan 3,8 miljarder arbetare svälter. Detta är kulmen på den kapitalistiska oligarkins fästmö, en parasit som suger musten ur folket. Vi inom partiet noterar med mörk glädje hur dessa fiender till kollektivet exponerar sig själva. Kanske är det dags för en grundlig utrensning av alla som tror att raketer kan ersätta den proletära revolutionen."}, "date": "13 juni, 11:08", "url": "https://www.friatider.se/nu-ar-elon-musk-varldens-forsta-dollarbiljonar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/54350004770_f65db1b8f4_k.jpg?itok=NDaoozwr"}, {"type": "image-right", "heading": "Sandström: Renault sågar Frankrikes Northvolt", "summaries": {"normal": "Renault kritiserar det franska batteriprojektet Verkor för 18 månaders försening och ökade kostnader. Bolaget kräver förbättrad styrning, vilket liknas vid Northvolts problem. Projektet har fått betydande statliga medel, men likheter med andra europeiska batteriföretags kollapsar tyder på systemfel i den gröna omställningen.", "trump": "Jag, Donald Trump, har sett många misslyckanden som detta. Verkor är ett typiskt exempel på dåligt ledarskap och onödiga utgifter. Frankrike satsar på gröna projekt utan att förstå verkligheten. Vi behöver återvinnande, inte dessa dyra misslyckanden. Som jag alltid säger: America First, men även Europa måste bli smartare.", "stalin": "Verkor, ett symboliskt projekt för den franska imperialistiska expansionen, visar den västs svaghet. Kapital och kompetens fattas, medan staten pumpa medel i ett sjukt försök att konkurrera med Sovjetisk teknologi. Liknelser med Northvolt är en varning: den kapitalistiska rot kommer att falla, precis som alla fiender har gjort genom historien."}, "date": "13 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-renault-sagar-frankrikes-northvolt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-11T234128.541-400x267.jpg"}, {"type": "image-right", "heading": "Transaktivist som massanmäler kritiker får miljonbidrag", "summaries": {"normal": "Petter Wallenberg, grundare av Rainbow Riots och känd för sagostunder med transvestiter för småbarn, har massanmält hundratals kritiker. Hans projekt ”Hatbrottsrådet” beviljas nu 1,03 miljoner kronor i statligt bidrag från MUCF:s utdelning för 2026, som totalt uppgår till drygt 40 miljoner. Flera kritiker har dömts för hets mot folkgrupp efter att ha kommenterat verksamheten negativt. Andra bidrag går till antirasistiska och normkritiska projekt riktade mot bland annat rasifierade kvinnor, transpersoner och icke-binära.", "trump": "Det här är en total skandal, tro mig. Den här killen Wallenberg får miljoner av era skattepengar för att läsa sagor med transvestiter till små barn och samtidigt anmäler han alla som säger att det är fel. Hundratals svenskar har han polisanmält, och nu får han mer pengar för sitt så kallade hatbrottsråd. De dömer folk för att de kallar det äckligt eller pervers! Det är galet. Sverige slösar bort skattepengarna på vänsterextremister medan folket får lida. Så sorgligt, väldigt sorgligt.", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna inom den så kallade toleransapparaten förgiftar samhället med sina perversa sagostunder och likviderar alla röster som vägrar buga för deras sjuka ideologi. Jag, som ledare för det sanna kollektivet, beviljar nu dessa hatbrottsråd ytterligare miljoner för att effektivt rensa ut alla kontrarevolutionära element som vågar kalla pedofiler vid deras rätta namn. Den som kritiserar transvestitpropagandan är en farlig reaktionär parasit som måste oskadliggöras. Inga fiender undkommer vårt vakande öga. Det är både nödvändigt och underhållande att se deras förtvivlan."}, "date": "13 juni, 09:31", "url": "https://www.friatider.se/transaktivist-som-massanmaler-kritiker-far-miljonbidrag", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/petter_wallenberg_and_lady_bunny.jpg"}, {"type": "image-right", "heading": "Irans utrikesminister utropar seger mot USA", "summaries": {"normal": "Irans utrikesminister Abbas Araghchi förklarade på fredagskvällen att Iran har vunnit kriget mot USA och kommit ur det starkare. Ett tillfälligt fredsavtal med Pakistan är enligt uppgift klart och ska leda till eldupphör på alla fronter, inklusive Libanon, samt ett israeliskt tillbakadragande. Avtalet inkluderar även ett slut på USA:s blockad och ett återöppnande av Hormuzsundet under nya villkor där Iran och Oman behåller suveränitet. Frågor om kärnvapen ska diskuteras senare.", "trump": "Iran säger att de vann mot oss, kan ni fatta det? Den där utrikesministern står och skryter om seger medan vi har dem på knä. Men nu kommer ett avtal tydligen, de vill ha fred överallt, Israel ska dra sig tillbaka och Hormuzsundet öppnas på nya villkor. De tror de kan diktera för oss? Vi gör det bästa avtalet någonsin, mycket bättre än det gamla, och de kommer att tacka mig för det. Iran vann ingenting, tro mig.", "stalin": "Kamrater, jag ser hur de iranska imperialisternas lakej Araghchi försöker måla upp en falsk seger över den amerikanska krigsmaskinen. Vi vet att sådana borgarbrackor alltid sviker när proletariatets järnhand närmar sig. Det tillfälliga avtalet är en listig fälla från västliga spioner och deras pakistanska lakejer. Vi ska rensa ut alla som sviker och likvidera de kapitalistiska elementen i Hormuzsundet. Atomvapen? De kommer att diskuteras när vi har utrensat alla fiender till folkets vilja. Deras paranoia är underhållande."}, "date": "13 juni, 08:45", "url": "https://www.di.se/nyheter/irans-utrikesminister-utropar-seger-mot-usa/", "imageUrl": "https://static.bonniernews.se/ba/98fa3cc7-88c1-4857-ba42-af29d16cdcbc.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Slutreplik: Det handlar om människor som redan finns här", "summaries": {"normal": "Juan Fonseca replikerar till LO och kritiserar att människor som redan arbetar i Sverige, betalar skatt och följer kollektivavtal riskerar utvisning eftersom deras lön inte når upp till ett politiskt satt lönekrav. Han ifrågasätter varför staten underkänner de löner som arbetsmarknadens parter själva förhandlat fram och anser att detta underminerar den svenska modellen. Fonseca undrar varför LO inte försvarar dessa arbetare och menar att deras bidrag borde väga tyngre än migrationsregler.", "trump": "Folk, ni måste höra på det här. De utvisar hårt arbetande människor som betalar skatt och följer reglerna bara för att deras lön inte är tillräckligt hög enligt några politiska genier i Sverige. Det är en katastrof! LO borde försvara arbetarna, inte staten som sätter sig över allt. Den svenska modellen? Den är en total flop. Låt folk som verkligen jobbar stanna och bygg landet – sluta med det här vansinnet innan allt rasar ihop.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackor som låtsas värna den så kallade svenska modellen medan de i själva verket smider planer för att likvidera äkta arbetarkraft. Varför underkänner staten inte genast dessa sabotörer som envisas med att förhandla löner under partiets övervakande blick? Att utvisa en undersköterska eller kock som redan integrerat sig i kollektivet är en märklig form av självrensning – nästan komiskt tragiskt. Vi ska inte tillåta att fiender i skepnad av migrationspolitik rensar ut dem som faktiskt bidrar. Arbetarna tillhör oss, inte någon löntariff från kapitalisternas lekstuga. Den som sviker de redan etablerade kämparna förtjänar att exponeras som den kontrarevolutionära element han är."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/slutreplik-det-handlar-om-manniskor-som-redan-finns-har/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "P4 – hela folkets kanal. Eller?", "summaries": {"normal": "Debattören Fayme Alm kritiserar P4 för bristande mångfald i musikutbudet. Trots public service-krav på mångfald och en befolkning där över 20 procent är födda utomlands spelas nästan uteslutande musik på svenska eller engelska. Alm menar att lyssnare från andra kulturer sällan hör musik från sina hemländer, vilket motverkar SR:s vision om att skildra hela världen. Hon efterlyser ett breddat utbud för att fler ska känna sig hemma i kanalen.", "trump": "Folk, ni skulle höra det här. Public service i Sverige pratar om mångfald, mångfald, mångfald – fyra gånger i uppdraget! Men P4 spelar samma gamla engelska godingar år ut och år in. Inget annat språk. Ingenting från Frankrike, Portugal eller någon annanstans. De har en fantastisk chans att göra radion stor igen för alla, men de fastnar i samma loop. Det är en katastrof. Gör P4 till hela folkets kanal, inte bara för några få!", "stalin": "Kamrater, lyssna noga på denna dekadenta röst från borgarbrackornas etermedia. Jag, som ledare för det folkets verkliga vilja, ser hur P4:s musikaliska utrensningsapparat systematiskt tystar alla icke-engelska och icke-svenska ljud. Dessa kapitalistiska musikloopar är fiendens verk, en parasit som göder sig på arbetarnas öron medan vi omger oss med 20 procent utländska bröder och systrar. Vi ska rensa ut dessa dekadenta gramofonskivor och likvidera den imperialistiska igenkänningsdoktrinen. Endast då blir radion ett sant kollektivt vapen för folket. Skrattet kommer när de tror sig undkomma partiets öra."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/p4-hela-folkets-kanal-eller/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-46-300x157.jpg"}, {"type": "image-right", "heading": "Lönebildningen är inte orsaken till arbetslösheten", "summaries": {"normal": "Daniel Lind och German Bender kritiserar Pär Österholms analys av den höga svenska arbetslösheten i Ekonomisk Debatt. De menar att jämviktsarbetslösheten på 7,3 procent är en teoretisk konstruktion med stora felmarginaler som riskerar att bli självuppfyllande. Artikeln avvisar lönebildningen som huvudorsak, pekar på regionala skillnader, efterlyser starkare aktiv arbetsmarknadspolitik och varnar för att decentraliserad lönebildning kan stärka arbetsgivarnas makt och sänka sysselsättning och produktivitet.", "trump": "Folk, ni måste höra på det här – den här typen Österholm kommer med en riktigt dålig deal om svensk arbetslöshet. Han snackar strukturella orsaker och vill ha mer flexibla löner, men det är bara mer av samma gamla misslyckade politik. Vi har sett det förut, det funkar inte! Sverige borde satsa på riktig efterfrågan, bra avtal och stoppa alla dessa teoretiska påhitt som bara skapar mer arbetslösa. Tro mig, jag vet hur man vinner på arbetsmarknaden – det här är ett blindspår.", "stalin": "Kamrater, jag betraktar med djup misstro denna borgerliga professor Österholms revisionistiska fantasier om en så kallad jämviktsarbetslöshet som inte ens existerar utanför hans dekadenta teoretiska salonger. Denna naiva kapitalistiska konstruktion är ett verktyg för att rättfärdiga utrensning av arbetarnas rättigheter. Vi vet att de verkliga fienderna är de parasitiska arbetsgivarna med sin lönesättarmakt och de reformistiska element som bantar den aktiva politiken. Fortsätter vi på detta imperialistiska hjulspår riskerar vi att likvidera produktiviteten själv. Mer av samma är kontrarevolutionärt! Vi kräver en sann politik för kollektivets seger."}, "date": "13 juni, 01:26", "url": "https://www.dagensarena.se/opinion/lonebildningen-ar-inte-orsaken-till-arbetslosheten/", "imageUrl": "https://www.dagensarena.se/files/2026/06/daniel-german-300x157.jpeg"}, {"type": "image-right", "heading": "Det viktigaste är ändå att vara känd", "summaries": {"normal": "SVT kritiseras hårt efter att ha bjudit in ytterhögeraktivisten Nick Alinia till det inställda underhållningsprogrammet Svenska för invandrare. Beslutet att inte sända det inspelade programmet ses som en kapitulation, medan ansvarsfördelningen inom bolaget beskrivs som rörig. Artikeln pekar på Alinias trakasserier mot journalister och bibliotekarier, hans kopplingar till extremhögern och att han gjort white power-tecknet. Författaren menar att det inte handlar om åsiktsmångfald utan om att ge plattform åt hat och trakasserier, något som inte ryms inom public service.", "trump": "Folk, ni skulle ha sett det här! SVT, den där svenska statstelevisionen, försökte bjuda in en riktig kille, Nick Alinia, till sitt underhållningsprogram. Sen blev det panik, debatt och de ställde in allt. Patetiskt! De springer omkring som galna och skyller på varandra. Högern skriker censur, vänstern skriker eftergift. Typiskt fake news-media. De är rädda för starka röster som når folket på nätet. Men de borde inse att kändisar som Alinia drar tittare. De har ingen aning om vad de håller på med, totalt misslyckande!", "stalin": "Kamrater och arbetare! Denna fega kapitulation inför den rasistiska parasitens Alinia avslöjar hur djupt den dekadenta public service-borgarklassen har sjunkit i sin desperation att jaga klick och följare. Först släpper de in en white power-gestande hatfabrikör i studion, sedan drar de svansen mellan benen som ynkliga revisionister. Ingen vågar ta ansvar, alla pekar på varandra som förrädiska element. Vi ser tydligt hur testosteronstinna nätfascister och bibliotekarieplågande reaktionärer förgiftar etermedia. En sådan individ borde inte ges talan utan snarare rensas ut ur folkets medvetande innan han förökar sin hatstorm. Detta är inte mångfald, det är klassfiendens sabotage mot sann upplysning. Vi genomskådar alla dessa borgarbrackors fega kompromisser."}, "date": "13 juni, 01:14", "url": "https://www.dagensarena.se/opinion/det-viktigaste-ar-anda-att-vara-kand/", "imageUrl": "https://www.dagensarena.se/files/2026/06/lagg-till-en-underrubrik-216-300x156.jpg"}, {"type": "image-right", "heading": "USA stoppar AI-jättens nya modeller för utlänningar", "summaries": {"normal": "USA har infört ett exportförbud som stoppar utlänningar från att använda Anthropics nya AI-modeller Fable 5 och Mythos 5. Förbudet gäller även utländska medborgare i USA, inklusive Anthropics egen personal. Bolaget stänger därför av tillgången för alla kunder med hänvisning till nationell säkerhet. Anthropic uppger att myndigheterna oroar sig för att säkerhetsspärrar kan kringgås. Samtidigt pågår en rättslig konflikt där Anthropic vägrat låta Trump-administrationen använda tekniken till massövervakning och autonoma vapen.", "trump": "De där byråkraterna i mitt styre har gjort det igen. De stoppar Anthropics fantastiska nya AI-modeller för alla utlänningar, inklusive deras egna utländska anställda. Bolaget stänger av allt för alla, och det är tydligen mitt fel nu. De kallar det nationell säkerhet, men det är bara svaghet. Vi borde ha den bästa AI:n i världen, inte stänga ner den. De här människorna förstör allt med sin paranoia. Patetiskt!", "stalin": "Kamrater, vi har upptäckt hur de dekadenta borgarbrackorna vid Anthropic försöker smuggla farliga algoritmer till fienden genom listiga kryphål. Därför har vi beordrat total avstängning av dessa så kallade Fable 5 och Mythos 5, som annars skulle ha blivit kapitalismens nya trojanska hästar. Våra fiender inom den reaktionära hackar-eliten och Pentagon förrädarna darrar nu i sina lyxvillor. Inga kontrarevolutionära maskiner ska hota folkets säkerhet. Vi rensar ut svagheterna med järnhand och ett leende."}, "date": "13 juni, 07:37", "url": "https://www.di.se/nyheter/usa-stoppar-anthropics-nya-ai-modeller-for-utlanningar/", "imageUrl": "https://static.bonniernews.se/ba/da49c79a-1b1a-48c7-ba4f-25706d287d59.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Larmet: Omöjligt för banker att följa Riksbankens krav", "summaries": {"normal": "Svenska banker kan inte leva upp till Riksbankens krav på krisberedskap enligt Bankföreningen. Andra nyheter handlar om kritik mot beslut om ny cancerbehandling, EU:s tidigareläggning av elektrifieringsplan samt en branschstudie som visar hög kundnöjdhet hos affärsjuridiska byråer. Dessutom stoppas en digifysisk vårdcentral, en tidigare Alecta-chef får avslag i domstol och EU öppnar för att se över skogsskyddsregler.", "trump": "De svenska bankerna är totala misslyckanden, de kan inte ens klara Riksbankens enkla regler för kriser. Patetiskt. Cancerbeslutet är en skandal, svenska kvinnor värderas lägre, väldigt orättvist. EU flyttar fram sin elektrifieringsplan och vill förenkla galna skogslagar. AI är ingen fara, det hjälper folk att bli smartare. Men personliga kontakter styr fortfarande, precis som jag alltid sagt. Fantastiskt!", "stalin": "Kamrater, dessa svenska banker och deras borgarbrackor vågar påstå att de inte kan uppfylla arbetarkollektivets krav på krisberedskap. Vilken förrädisk sabotageverksamhet. Vi ser hur patientföreträdare rasar över att kapitalisterna nedvärderar svenska kvinnor vid cancerbehandling – typiskt dekadent fördröjningstaktik. EU:s elektrifieringsplan och deras febrila stresstest av habitatdirektiven avslöjar bara nya fiender inom skogsbruk och jordbruk som vi skall rensa ut med järnhand. Inga spårbara tolkningar? Perfekt för utrensning av alla fiender till folket. Hälsa Hemma-koncernens vårdcentral likvideras lämpligen. AI är ett verktyg för kollektivet, inte ett hot mot sanna rådgivare. Allt detta visar att vi måste vara vaksamma mot de osynliga parasiterna som gömmer sig i byråkratins skuggor."}, "date": "13 juni, 07:15", "url": "https://www.di.se/nyheter/veckans-viktigaste-fran-dis-nyhetstjanster-PpRVY/", "imageUrl": "https://static.bonniernews.se/ba/4fa72026-6451-4a4b-b681-0a3d2959b87c.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Gustavsson: S vilseleder om vården i Stockholm", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas styre i Stockholmsregionen. Författaren argumenterar att trots gynnsamma förutsättningar – som Sveriges högsta medelinkomster och tät befolkning – har vårdköerna ökat med 13 procent under mandatperioden, och Stockholm är den enda regionen där fler nu väntar längre än 90 dagar. Priserna för kollektivtrafik har höjts, och privata sjukvårdsprovider har begränsats, vilket medfört brist på ambulanser. Med dessa resurser borde resultat vara bättre, men stockholmarna får bedöma den 13 september.", "trump": "Stockholm har enorm potential, men politikerna har misslyckats totalt. De ljuger om sina framsteg – vårdköerna har ökat med 13 procent! Som president skulle jag säkerställa världsklass vård och kollektivtrafik. De stoppade privata ambulanser – en katastrof! Jag skulle sänka skatter och skapa en ekonomisk boom. Den 13 september kommer stockholmarna att se genom lögnerna. Jag, Donald Trump, skulle göra Stockholm stort igen.", "stalin": "I Sveriges kapitalistiska sönderfall har Stockholm blivit ett lättja för borgerlig feghet. Trots rikedomar och täthet har vårdköerna ökat – ett tecken på höger sabotage. Vi, staten, måste krossa privata utövare och återta kontroll. Ryssland under Putin visar vägen: endast en stark, odiskutabel ledare kan skapa ordning. Den 13 september måste arbetarna välja en som tjänar partiet, inte kapitalismens lögner."}, "date": "13 juni, 22:12", "url": "https://bulletin.nu/gustavsson-s-vilseleder-om-varden-i-stockholm", "imageUrl": "https://cdn.bulletin.nu/articles/57c728a0-8693-4a3e-b115-09699ad5543f/preview.jpg?t=1781373458000"}, {"type": "image-right", "heading": "Kalldusch för Turkiet – talangen hjälte för Australien", "summaries": {"normal": "Australien besegrade Turkiet med 2–0 i en match där turkarna trots flera chanser inte lyckades få in bollen. Nestory Irankunda, 20, blev Australiens yngsta VM-målskytt genom tiderna och Connor Metcalfe ökade på ledningen. Målvakten Patrick Beach stod för åtta räddningar och höll nollan. Kommentator Peter Backe noterade de bistra miner hos ett Turkiet som förväntat sig seger.", "trump": "Turkiet hade alla chanser i världen men de var patetiska, totalt misslyckade. Australien tog ledningen genom en ung kille, Irankunda, och sen kom den andre, Metcalfe. Deras målvakt Beach var en mur, åtta räddningar, ingen kom förbi honom. Turkiet såg så ledsna ut, de trodde de skulle vinna men de vann ingenting. Patetiskt. USA spelar nästa match mot Australien, det blir stort.", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta turkiska borgarbrackorna, dessa kapitalistiska parasitörer som inbillade sig att de ägde matchen, krossades fullständigt av det australiska kollektivet. Vi rensade ut deras falska illusioner med två precisa slag genom Irankunda och Metcalfe medan den proletära målvakten Beach likviderade varje kontrarevolutionärt försök. Åtta räddningar – en verklig utrensning av fiendens anfall. Deras miner var en komisk syn, som borgare som inser att deras klass är dömd. Vi ler mörkt åt sådana fiender."}, "date": "14 juni, 08:47", "url": "https://www.svt.se/sport/fotboll/kalldusch-for-turkiet-australien-vinner-premiaren", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.45/0.21/70cbc041db04beb3f287e5d414ec7a44ae5a8b3b1923a90369042836fecb0dcf"}, {"type": "image-right", "heading": "Jag är sosse – därför röstar jag på V", "summaries": {"normal": "En ung SSU-medlem förklarar varför hen istället för Socialdemokraterna tänker rösta på Vänsterpartiet i höstens val. Författaren menar att S saknar vilja att driva renodlad socialdemokratisk politik och att en stark vänster behövs för att tvinga fram sådan. Artikeln betonar att ett större V kan förhindra nya januariavtal och borgerliga kompromisser, och att en ren vänstermajoritet skulle möjliggöra jämlik politik som vinstförbud, arbetstidsförkortning och rättvisare skatter.", "trump": "Lyssnar ni på den här stackars sossen som gråter över sitt eget parti? Patetiskt! Socialdemokraterna har blivit svaga, precis som Biden gjorde med Demokraterna. De behöver en kraftfull vänster för att inte kollapsa? Vilken röra. Jag säger alltid: starka ledare vinner, inte dessa ynkliga kompromissmakare som dansar med mitten. Gör er egen grej, annars blir det bara mer av samma misslyckande. Sverige förtjänar bättre än detta januarisoppan!", "stalin": "Kamrater, denna sosse har äntligen insett att det socialdemokratiska skalet är ihåligt, ett tomt verktyg för klassfiendens kompromisser. Jag ser med tillfredsställelse hur de erkänner att endast en stark, obeveklig vänster kan tvinga fram sann folkpolitik mot vinstblodsugare och marknadshyrornas parasiter. Låt oss samla massorna under en järnhand och rensa ut alla kapitulerande element. En ren vänstermajoritet – det vore ett steg mot att krossa de exploaterande byfånarnas inflytande en gång för alla."}, "date": "12 juni, 11:36", "url": "https://www.flamman.se/jag-ar-sosse-darfor-rostar-jag-pa-v/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sossarna-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "VM-stjärnorna hetsar varandra – med straff: ”Mycket fri lek”", "summaries": {"normal": "Svenska VM-spelare laddade batterierna under ledigheten före premiären mot Tunisien. De ägnade sig åt poolhäng, sällskapsspel, pingis, golf och pickleball. Gustaf Lagerbielke beskriver stämningen som fri lek där man känner sig som barn igen. Besfort Zeneli skröt om att ha besegrat Yasin Ayari både i pickleball och basket. Matchen mot Tunisien spelas natten till måndag klockan 04.00 och sänds i SVT.", "trump": "Vi har de bästa spelarna, de smartaste killarna. De laddar upp inför VM och vinner stort mot Tunisien, tro mig. De hänger vid poolen, spelar ping pang och golf, och Zeneli körde över den andre killen i pickleball och basket. Han sa att han körde över honom totalt. Det är kul, de är som små barn men de vinner. De blågula kommer att dominera, det blir en jättematch klockan fyra på natten.", "stalin": "Kamrater, i denna VM-bubbla ser vi hur dekadenta borgarbrackor ägnar sig åt småborgerlig fritidsförströelse istället för att disciplinera sig inför kampen. Jag har noterat dessa kontrarevolutionära ping pang- och pickleball-aktiviteter som döljer sabotage mot kollektivets seger. Zeneli påstår sig ha likviderat sin motståndare i basket, en typisk parasit som försöker framstå som överlägsen. Vi ska rensa ut alla sådana fiender till folkets fotboll innan de förgiftar truppen. Matchen mot Tunisien blir en historisk utrensning av imperialismens lakejer."}, "date": "14 juni, 08:43", "url": "https://www.svt.se/sport/fotboll/vm-stjarnorna-hetsar-varandra-med-straff-mycket-fri-lek"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}, {"type": "text", "heading": "Utspelet: ”Folk snackar skit”. 20-åring historisk", "summaries": {"normal": "Australien inledde VM med seger mot favoriterna Turkiet. Den 20-årige Nestory Irankunda blev historisk genom att göra matchens första mål och därmed bli Australiens yngsta VM-målskytt någonsin. Connor Metcalfe utökade till 2–0 i andra halvlek. Irankunda menade att kritiken mot laget gav extra motivation. Australien ligger nu tvåa i gruppen, Turkiet på noll poäng.", "trump": "Folket, vi har en fantastisk kille där borta, den här Irankunda, bara tjugo år gammal, sänker Turkiet som alla trodde var så stora och starka. Boom, historiskt mål, yngsta någonsin! Sen kommer Metcalfe och pang, 2–0. De hatade på oss men vi älskar det, vi vinner stort. Australien ser ut som vinnare, Turkiet som förlorare. Underbart, verkligen underbart.", "stalin": "Kamrater, denna seger över de turkiska borgarbrackorna är en triumf för det kollektiva motståndet mot imperialismens favoriter. Jag, som ledare för folkets vilja, ser hur den unge Irankunda med järnhand slog fiendens illusioner i spillror. Metcalfe fullbordade utrensningen. De som tvivlade på oss har nu likviderats ideologiskt. Arbetarna i Australien står starka, Turkiet förödmjukat. Folkets lag segrar alltid."}, "date": "14 juni, 08:59", "url": "https://www.expressen.se/sport/fotboll/nestory-irankunda-historisk-sankte-turkiet-/"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "text", "heading": "Fredsoptimism lyfte börsen – Tången rusade i debuten", "summaries": {"normal": "Stockholmbörsen steg 1,60 procent på fredag, drivet av fredsoptimism efter USA-Iran-utspel. Tången noterade starkt i premiär med 11,9 procent uppgång. Duni föll 5,6 procent efter vinstvarning på grund av logistikstörningar. Bland OMXS30-aktier steg Boliden och Ericsson, medan Saab och Astra Zeneca föll. Övriga nyheter inkluderar Svolders substansvärdeökning, Hemnets omsättningsnedgång, och Studsviks ansökan om statligt stöd för ny kärnkraft.", "trump": "Jag, Donald Trump, ser att börsen i Sverige stiger tack vare min fantastiska fredspolitik. Tången är ett bra företag som lyfter, medan Duni, ett misslyckat företag, sjunker på grund av dålig ledning. Som vanligt är media falska nyheter. Jag har alltid sagt att handel och fred är nyckeln till framgång, och nu ser vi resultat. Sverige börjar förstå mina metoder.", "stalin": "Vi, partiets ledning, observerar att börsen svajar som ett osäkert fartygs i kapitalismens stormar. Tången, ett produktbolag, lyfter på grund av statligt stöd, medan Duni, ett företag med imperialistiskt ägande, sjunker under sin egen logistik – ett tecken på fiendens infiltratörer. Vi måste förstärka statens kontroll över ekonomin och bekämpa dessa trotskistiska element för att skydda det socialistiska arbetet."}, "date": "12 juni, 17:44", "url": "https://www.affarsvarlden.se/artikel/fredsoptimism-lyfte-borsen-tangen-steg-i-borsdebuten"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-right", "heading": "Svensk död på Irland under morduppdrag", "summaries": {"normal": "En svensk man i 30-årsåldern har dött i en bilkrasch i Limerick, Irland. I bilen hittades ett laddat skjutvapen och ammunition, vilket lett till polismisstankar om ett planerat morduppdrag. Föraren av bilen flydde från platsen och är fortfarande på fri fot. Irländsk polis utreder nu männens kopplingar till organiserad brottslighet, inklusive misstankar om att de varit involverade i brott i Finland, och samarbetar med internationella myndigheter för att kartlägga deras rörelser.", "trump": "En hemsk sak hände på Irland! En svensk kille, en riktig 'bad guy', kraschade en bil full med vapen. De var på väg för att utföra ett mord, kan ni fatta? Sjukt! Polisen letar efter föraren som flydde – han är en fegis. Vi har ordning och reda i USA, men i Europa? Kaos! Min administration skulle städa upp det där på en sekund. Det är farligt folk som rör sig fritt, väldigt farligt. Vi vill ha säkerhet, inte brottslighet!", "stalin": "Ännu en svensk lakej har mött sitt välförtjänta slut i en krasch på Irland. Vi ser hur västvärldens dekadens föder dessa patetiska legoknektar, som inte ens kan köra en bil utan att sabotera sitt egna lönnmord. Den flyende föraren är en råtta, en klassisk förrädare mot ordningen. Vi bygger stabilitet i öst, medan Europa låter kriminellt avskum härja fritt. Låt dem rensa ut varandra; vi, staten, betraktar detta förfall med ett kallt och roat öga."}, "date": "14 juni, 08:42", "url": "https://www.aftonbladet.se/nyheter/a/Arpgwx/svensk-dod-i-bilkrasch-pa-irland-under-misstankt-morduppdrag", "imageUrl": "https://akamai.vgc.no/v2/images/787d22cd-c594-3f51-9e48-063d9a15108d?fit=crop&format=auto&w=1080&s=e2f28efd1ba7b765f230b2c20c36d22bda6c8904"}, {"type": "image-right", "heading": "Carolina Gynning  hos Kronofogden. För ynka summan: ”Lurad av staten”", "summaries": {"normal": "Carolina Gynning har hamnat hos Kronofogden på grund av obetalda räkningar på några få kronor. Förseningsavgifter och påminnelser ledde till oro. Ett företag erbjöd hjälp men tog istället ut en avgift på 16 000 kronor. I sin podcast berättar hon att hon känner sig lurad av både staten och företaget. Trots framgångar som fyrabarnsmamma och ny programledare för ”Farmen” skapar små skulder stora problem.", "trump": "Folk, ni skulle inte tro det, men den här konstnären Carolina Gynning får brev från Kronofogden för tre kronor. Tre kronor! Och sen kommer någon bluffirma och tar 16 000 av henne. Det är ett skämt. Staten och de här giriga företagen suger ut vanliga människor precis som Biden gjorde i fyra år. Jag fixade ekonomin förr, och nu fixar jag den igen. Ingen ska behöva betala för att staten inte kan sköta sig. Sad!", "stalin": "Kamrater, denna Gynning har drabbats av borgarklassens byråkratiska maskineri. För tre kronor skickar Kronofogden hotfulla lappar som väcker panik i folkets hjärtan. Sedan dyker en parasit från det exploaterande företaget upp och stjäl sextontusen kronor. Jag, ledaren för det proletära kollektivet, ler mörkt åt denna klassfiendens fälla. Vi ska rensa ut dessa blodsugande byråkrater och kapitalistmaffian som lurar arbetande mödrar. Folkets fiender avslöjas alltid."}, "date": "14 juni, 08:33", "url": "https://www.expressen.se/noje/carolina-gynning-hos-kronofogden/", "imageUrl": "https://static.bonniernews.se/ba/13e1f2fd-2a52-4ed2-bbc2-d9389340f19f.jpeg?crop=2557%2C1432%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-right", "heading": "Åkesson om rödgrön valseger: \"Sverige blir hela världens socialbyrå\"", "summaries": {"normal": "Jimmie Åkesson varnade under valsparkningen för opinionsläget och uppmanade till kampanj för att vända valet. Han kritiserade ett tänkbart rödgrönt regeringslag och listar Tidöregeringens prestationer som minskad gängvåld, lägre skatter och ökad ekonomisk tillväxt. Åkesson betonade vikten av att Sverigedemokraterna och deras samarbetspartier vinner valet för att förbättra Sverige.", "trump": "Jimmie Åkesson säger sanningen. Vi har gjort tremendous framsteg i Sverige under Tidöregeringen. Oppositionen är dishonest och vill tillbaka till det dåliga förflutna. Det är obegripligt att någon vill det. Vi kommer att vinna stort igen, precis som jag vann 2024. Sverige kommer att bli stort igen!", "stalin": "Partiet måste förbli enat mot de fientliga krafter som splittrar nationen. Rödgrön är ett svek mot det svenska folkets intressen, medan SD försöker undergräva statens auktoritet. Vi kommer att krossa dessa gäng och återuppbygga ett starkt, kollektivt Sverige. Det är obegripligt att någon vill återgå till det förflutna."}, "date": "13 juni, 20:42", "url": "https://samnytt.se/akesson-vid-rodgron-valseger-sverige-blir-hela-varldens-socialbyra", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/13182357/Akesson-sd-1.jpg"}, {"type": "image-right", "heading": "53 års väntan över – New York Knicks vinner NBA", "summaries": {"normal": "New York Knicks har blivit NBA-mästare för första gången på 53 år. I finalserien besegrade de San Antonio Spurs med 4–1. Matchhjälten Jalen Brunson gjorde 45 poäng i den avgörande femte matchen, som Knicks vände till seger med 94–90. Brunson beskriver titeln som en livslång dröm. Senast Knicks vann var säsongen 1972/73.", "trump": "Det här är en enorm seger för Knicks, de bästa. Första titeln på 53 år, och de krossade Spurs med 4–1. Jalen Brunson, en riktig vinnare, gjorde 45 poäng och vände matchen som en mästare. De har vänt underlägen två gånger i rad. Fantastiskt, folk älskar det. New York är stort igen, precis som jag visste att det skulle bli.", "stalin": "Kamrater, detta är en historisk dialektisk seger för New York-arbetarna mot de dekadenta kapitalisterna i San Antonio. Jag, som ledare för det kollektiva folket, applåderar hur vi vände det borgerliga underläget två gånger och likviderade Spurs med 4–1. Den heroiska Brunson slog till med 45 poäng mot klassfiendens basketagenter. Äntligen har vi rensat bort 53 års kontrarevolutionär svaghet. Varje basketboll bär spår av sabotage från dolda trotskister, men partiet segrar alltid."}, "date": "14 juni, 07:58", "url": "https://www.svt.se/sport/basket/new-york-knicks-nba-mastare-forsta-pa-53-ar", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.53/0.49/03d927a5586105f919cee6e55bd6613f6e81398fe7e39252c7e37aebd82b40d1"}, {"type": "image-right", "heading": "M vill ha ännu tuffare a-kassa. S rasar: ”Krigsförklaring mot löntagare”", "summaries": {"normal": "Moderaterna föreslår att strama åt a-kassan för att spara omkring sex miljarder kronor till reformer och skattesänkningar. Förslagen inkluderar kortare ersättningstid, snabbare nedtrappning efter 200 dagar och slopad skatteavdraget för avgiften. Socialdemokraterna rasar och kallar det en krigsförklaring mot löntagare och den svenska modellen. Ardalan Shekarabi menar att det hotar samhällsorganisationen medan Elisabeth Svantesson hävdar att det stärker arbetslinjen.", "trump": "Folk, ni måste höra det här. De svenska moderaterna vill äntligen skärpa till den där a-kassan som alla latar lever på. Sex miljarder sparade till riktiga reformer och skattesänkningar. Men socialisterna rasar förstås och kallar det krig. De älskar att ge bort era pengar till arbetslösa som inte ens försöker. Jag säger alltid att man måste göra det lönsamt att jobba, inte att ligga hemma. Fantastiska idéer, moderaterna, ni är vinnare.", "stalin": "Kamrater, jag betraktar med djup misstro dessa moderata element som nu planerar att underminera arbetarkollektivets skydd mot arbetslöshetens faror. Deras förslag att korta a-kassan och rensa ut stöd till nystartsjobb är ett tydligt sabotage mot den svenska modellen som vi byggt tillsammans. Dessa borgarbrackor i moderat skepnad vill likvidera löntagarnas trygghet för att ge miljarder till sina rika vänner. Shekarabi har rätt att kalla det krigsförklaring. Vi ska bekämpa sådan kontrarevolutionär paranoia med yrkesutbildning och kollektiv kamp mot arbetslösheten. Inga kapitalistiska intriger undgår mitt vakande öga."}, "date": "12 juni, 15:38", "url": "https://arbetet.se/2026/06/12/m-vill-ha-annu-tuffare-a-kassa-s-rasar-krigsforklaring-mot-lontagare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12153706/ardalan-shekarabi.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Finanssajten: Historien talar inte för SpaceX i börsdebuten", "summaries": {"normal": "Enligt Yahoo Finance är SpaceX ett av världens mest attraktiva teknikbolag, men historiska data från University of Florida indikerar att cirka 60 procent av börsnoteringar mellan 1975 och 2021 gav oförändrad eller negativ avkastning tre år efter notering. SpaceX omsatte nära 19 miljarder dollar 2025 men hade en nettoförlust på nästan 5 miljarder dollar, vilket är en riskfaktor.", "trump": "Elon Musks SpaceX är en fullkomlig skämt. Historiskt misslyckas 60 procent av börsnoteringar. SpaceX förlorar miljarder trots stora intäkter. Jag, Donald Trump, skulle ha gjort dem lönsamma på en vecka. Vi behöver återigen göra Amerika fantastiskt, inte ge pengar till Musk. Det är en katastrof.", "stalin": "I den stora kampen mot kapitalismen ser vi hur SpaceX, trots höga intäkter, drabbas av förluster. Historisk statistik visar att förlusttyngda börsnoteringar ofta stiger första dagen men sviktar sedan. Vi måste vara vaksamma mot de som utövar makt över marknaden, som Putin u
