 folket, inte för de korkade eliterna som gömmer kostnaderna. Fantastiskt bedrägeri!", "stalin": "Kamrater, jag ser hur borgarbrackorna och försäkringsblodsugarna med sina förmedlare utsuger arbetarklassen genom dolda avgifter som långsamt likviderar pensionerna. Dessa folkfiender snurrar tiotals miljarder i sin spekulationskarusell medan de fattigpensionärer vi lovat skydd svälter. Vi ska rensa ut dessa exploaterande byfånar som gömmer sina stöldaktier i bokföringens mörker. Tystnaden är klassfiendens vapen, men utrensning väntar de som suger ut det kollektiva sparandet."}, "date": "15 juni, 16:10", "url": "https://www.etc.se/ledare/vi-aer-lurade-igen-och-igen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "Sålde sin fru hundtatals gånger – så blir straffet", "summaries": {"normal": "En man från Kramforsområdet har dömts till fyra år och fem månaders fängelse för grovt koppleri. Han sålde sin fru till minst 120 sexköpare under flera år, ofta i en husbil på tomten. Mannen, med bakgrund i Hells Angels och militären, fälls även för försök till våldtäkt, misshandel, olaga hot och dopningsbrott. Han frias från flera våldtäktsanklagelser. Av 29 åtalade sexköpare fälls 28, varav två får fängelse.", "trump": "Folk, ni skulle inte tro det, men den här typen från Kramfors sålde sin egen fru hundratals gånger till alla möjliga sexköpare, till och med i en husbil på tomten. Patetiskt! Jag skulle ha gett honom tio år, men den svaga tingsrätten nöjde sig med fyra och ett halvt. Så många köpare, 28 dömda, och bara två får riktiga straff. Det är en total skandal, en riktig förlorare som trodde han kunde komma undan. Sad!", "stalin": "Kamrater, vi har här en förrädare mot arbetarklassen, en dekadent borgarbracka med Hells Angels-förflutet som systematiskt utnyttjade sin egen fru som handelsvara åt fiendens sexuella imperialister. Jag, med järnhand, skulle ha genomfört en omedelbar utrensning av hela det perversa nätverket. Att tingsrätten bara ger fyra år och fem månader visar på bristande revolutionär vaksamhet. Vi ska rensa ut alla sådana kapitalistiska parasitmaskar som gömmer sig bland folket, en efter en, med ett leende."}, "date": "16 juni, 11:38", "url": "https://www.friatider.se/salde-sin-fru-hundtatals-ganger-sa-blir-straffet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-346.jpg?itok=rxLbdGEN"}, {"type": "image-full", "heading": "Massiv kritik mot Lush-kampanj - hyllar transmastektomier", "summaries": {"normal": "Lush har mött massiv kritik efter att ha satt upp affischer i sina engelska butiker som hyllar transmastektomier. Affischerna visar en tiger med ärr och texten \"Stolt över mina ränder\". Flera kvinnor som genomgått mastektomi på grund av bröstcancer reagerar starkt och kräver att kampanjen tas bort. De menar att mastektomier inte är något att fira utan en allvarlig medicinsk åtgärd. Lush har inte kommenterat kritiken.", "trump": "Det här är helt sjukt, folk. Lush, den där tvålkedjan, sätter upp affischer som uppmuntrar tonårsflickor att skära bort sina friska bröst i transstolthetens namn. Det är äckligt. Kvinnor som överlevt bröstcancer är rasande, och det förstår jag. Mastektomi är inte ett mode eller något gulligt, det är allvarligt. Lush borde skämmas. De har ingen aning om vad de gör, men jag säger som det är – det här är en katastrof för unga tjejer. Ta ner affischerna nu!", "stalin": "Kamrater, denna dekadenta tvålproducent och dess borgarbrackor har återigen blottat sin kontrarevolutionära stinkande agenda genom att hylla självförstöring som vore det en seger för partilinjen. Jag, med min oändliga visdom, ser hur dessa kapitalistiska parasitiska tigerränder döljer en fiende inom: den degenererade identitetssjukdomen som förgiftar ungdomen. Mastektomier är inga leksaker för sjuka själar. Vi måste rensa ut dessa dekadenta element ur alla skyltfönster innan de förgiftar hela kollektivet. Deras tystnad är bara ett erkännande av skuld. Likvidera kampanjen omedelbart."}, "date": "16 juni, 11:24", "url": "https://riks.se/nyheter/massiv-kritik-mot-lush-kampanj-hyllar-transmastektomier", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-16%2F7h5kbi9g%2Fimage.jpg"}, {"type": "image-right", "heading": "Alla buar – då bryter  Sverige mot reglerna", "summaries": {"normal": "Under VM i extremvärme har Fifa infört vätskepauser på upp till tre minuter per halvlek. Sverige fick en tillsägelse för att ha för många ledare på planen under en sådan paus, vilket ledde till burop från publiken när spelarna använde taktiktavla och kylhanddukar. Sebastian Larsson och Mattias Svanberg ser pauserna som positiva för spelarnas hälsa trots att de inte är vana vid värmen.", "trump": "Titta på det här, hela arenan buar när svenskarna står där med sina kylhanddukar som ett gäng svaga snöflingor. Fifa tvingar in pauser för att de inte pallar värmen – typisk globalistregel! Vi europén klarar inte hettan, säger de. Patetiskt. Jag skulle ha vunnit matchen på tre sekunder och skickat hela laget till en riktig bastu istället för det här fjanteriet. Gör matchen stor igen!", "stalin": "Kamrater, jag betraktar med djup misstro dessa dekadenta pauser som imperialisternas verktyg för att underminera arbetarnas vilja till seger på planen. När ledarna myllrar som klassfiender runt taktiktavlan buar massorna – helt rätt! Vi ska rensa ut oordningen, likvidera alla onödiga kroppar på planen och se till att endast den kollektiva disciplinen råder. Värmen är en kapitalistisk provokation mot folkets uthållighet."}, "date": "16 juni, 11:11", "url": "https://www.expressen.se/sport/fotboll/landslaget/hela-arenan-buar-da-bryter-sverige-mot-reglerna/", "imageUrl": "https://static.bonniernews.se/ba/bfa8beed-ca94-4cc2-b214-d69c53a50a8f.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Från 1 juli: Böter på 330 000 kronor om nya EU-regeln missas", "summaries": {"normal": "Från 1 juli 2026 utökas EU:s regler om kör- och vilotider till att även gälla vissa lättare fordon mellan 2,5 och 3,5 ton som används för internationella godstransporter eller cabotage. Fordonen måste utrustas med smart färdskrivare version 2 och förarna behöver förarkort. Syftet är att öka trafiksäkerheten genom att säkerställa att chaufförerna är utvilade. Brott mot reglerna kan leda till böter på upp till 330 000 kronor i till exempel Frankrike.", "trump": "De här vansinniga EU-byråkraterna har kommit på ett nytt sätt att plåga folk. Från sommaren 2026 ska små lastbilar ha smarta färdskrivare och alla möjliga kort, annars kan det kosta trehundratrettiotusen kronor i böter. Det är ett fullständigt hån mot vanliga förare. De gör trafiken farligare genom att jaga hederliga människor istället för att fokusera på de riktiga problemen. Amerika skulle aldrig acceptera sådant galet regelvrång.", "stalin": "Kamrater, jag ser med stigande vrede hur de dekadenta borgarbrackorna i Bryssel nu riktar sin parasitiska lagstiftning mot våra ärliga transportarbetare. Från och med 2026 ska dessa lätta fordon tvingas bära kapitalistiska övervakningsapparater som spionerar på varje minut av vila. De som fuskar med färdskrivare är farliga folkfiender som underminerar kollektivets säkerhet. Vi kommer att rensa ut dessa trötta sabotageelement med järnhand och immobilisera deras fordon tills de lär sig disciplin. Sovjetiskt blod ska inte spillas för bräckliga eurokratiska nycker."}, "date": "15 juni, 18:29", "url": "https://nyheter24.se/nyheter/utrikes/1491568-fran-1-juli-boter-pa-330-000-kronor-om-nya-eu-regeln-missas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/bbdf878104b004a30200000000b004a302/2026/06/15/2371111/eu-regler-fordon-farskrivare-vilotider-boter-bil.jpg"}, {"type": "image-right", "heading": "Riksdagen antog vandelslagen", "summaries": {"normal": "Riksdagen röstade på måndagen igenom den så kallade vandelslagen som möjliggör utvisning vid bristande vandel. Lagen antogs med 302 ja-röster mot 44 nej, där Vänsterpartiet och Miljöpartiet röstade emot. Utanför riksdagen hölls en demonstration mot lagen, där kritiker som Lena Nyblom-Malmberg och Vera Hellgren varnade för godtycklig tillämpning mot politiska aktivister, klimataktivister och fattiga. Socialdemokraterna stödde förslaget men kritiserade begreppet vandel och ville hellre använda formuleringen om skötsamt och hederligt levnadssätt.", "trump": "Folk röstar igenom en lag som sparkar ut folk som inte beter sig – äntligen! 302 mot 44, stort segermarginal. De där vänstertyperna och miljöextremisterna skriker fascism, men det är bara löjligt. De vill ha kaos, protester och bidragsfuskare som stannar för evigt. Sverige håller på att vakna, de gör det rätta nu. Inga felparkerare ut, men systematiska lagbrytare? De åker ut. Fantastiskt, kanske till och med smartare än vi gör det.", "stalin": "Kamrater, jag har nu genomdrivit denna historiska vandelslag som ett oumbärligt verktyg för att skydda folkets revolutionära ordning från alla parasitiska element. De 302 rösterna representerar arbetarklassens järnhårda vilja medan de 44 förrädarna från Vänsterpartiet och Miljöpartiet blottar sig som kapitalisternas nyttiga idioter. Utanför står en handfull regnvåta reaktionärer och poetiska dekadenter under sina patetiska tält och ylar om fascism. Vilken underbar paranoia de uppvisar! Snart ska vi rensa ut alla dessa borgarbrackor, klimathysteriker och terrorvänner med systematisk grundlighet. Ingen slipper undan likvideringen av det ohederliga levnadssättet. Det blir en fest för folket."}, "date": "15 juni, 18:44", "url": "https://www.dagensarena.se/innehall/riksdagen-antog-vandelslagen/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-48-300x157.jpg"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "image-full", "heading": "Efter succén – så stora är Sveriges chanser att gå vidare", "summaries": {"normal": "Sveriges herrlandslag i fotboll tog en övertygande 5–1-seger mot Tunisien i VM-premiären och har nu mycket goda chanser att gå vidare från gruppen. Enligt TV4-experten Siavoush Fallahi har Sverige allt att vinna i de kommande matcherna mot Nederländerna och Japan, som nu spelar under press. Oddsen på svensk framgång har också sjunkit markant efter framgången.", "trump": "Titta på de svenska killarna, de krossade Tunisien med 5–1, totalt dominans! Nu har de allt att vinna medan de andra svettas som galningar. Nederländerna och Japan? Patetiska, de måste anfalla och förlora stort. Jag älskar det här, kontringar med Isak och Gyökeres – rena rama MAGA-fotbollen. Oddsen rasade från 150 till 80, men tro mig, det blir ännu bättre. Sverige vinner gruppen lätt, de andra är förlorare!", "stalin": "Vi har bevittnat en seger som stärker proletariatets moral. Denna 5–1-triumf mot de tunisiska folkfienderna ger oss en stålhard position inför de kommande striderna. Motståndarna måste nu anfalla i desperation medan vi, med järndisciplin, kan slå till på kontring. Jag njuter av detta mästerskap som en utrensning av tvivel. De som sviker kollektivet skall likvideras i tabellen. Allt går som det ska under ledningens visdom."}, "date": "15 juni, 16:21", "url": "https://www.tv4.se/artikel/4SJgOqyTX2sVRUadaIUN1z/efter-succen-sa-stora-aer-sveriges-chanser-att-ga-vidare", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2VjSgIpPTGyQrf4Y6xUw9k%2Fa356f3d550b20e2aa3508e9961e7da3b%2F15-sverige-webb.jpg&width=1024"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-right", "heading": "Ångrar abortkritiken: ”Har säkert sårat fler än jag uppmuntrat”", "summaries": {"normal": "Elisabeth Svantesson (M) ångrar sin tidigare abortkritiska hållning och önskar att hon hade kunnat råda sitt yngre jag att ta det lugnt. I en ny SVT-dokumentär berättar finansministern om sin tid i organisationen Ja till livet under 1990-talet, där hon bland annat deltog i demonstrationer och debatter. Idag står hon bakom svensk abortlagstiftning och menar att hon blivit mindre svartvit med åren. Hon erkänner att hennes ord säkert har sårat fler än de uppmuntrat.", "trump": "Den här Svantesson-kvinnan var en riktig abortkrigare förr, demonstrerade och sa att man inte får ta barns liv. Nu gråter hon i en SVT-dokumentär och ber sitt yngre jag att tagga ner. Typiskt! Hon har blivit mjuk, svag och politiskt korrekt. Hon sågar sitt gamla jag som var tuff och sa vad alla tänkte. Patetiskt. Men hey, åtminstone erkänner hon att hon sårat folk – det gör inte de flesta losers i politiken.", "stalin": "Kamrater, denna borgarbracka Svantesson erkänner nu att hennes tidigare kamp mot fosterförintelsen var felaktig. Jag skulle ha låtit henne rensa ut sig själv redan på 90-talet för att ha spridit kontrarevolutionära tankar om att skydda ofödda. Idag kryper hon för den dekadenta abortindustrin som kapitalisterna älskar. Hennes yngre jag borde ha likviderats innan den mjuknade och blev en vekling. Inga halvmesyrer! Endast partilinjen gäller, annars väntar utrensning i maktens korridorer."}, "date": "16 juni, 05:49", "url": "https://www.svt.se/nyheter/inrikes/svantesson-om-abortkritiken-har-sakert-sarat-fler-an-jag-uppmuntrat", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.54/0.47/3917acac20a89f11922bd9b3bd1222fc8fa95592aac746ac3419f2865b1e6094"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "text", "heading": "Trög arbetslöshet: \"Det dröjer till 2027\"", "summaries": {"normal": "Arbetslösheten i Sverige ligger för närvarande på 6,4 procent, vilket motsvarar 339 000 personer. Enligt Arbetsförmedlingens senaste prognos väntas en långsam förbättring fram till 2027, då arbetslösheten beräknas sjunka till 6,1 procent. Tillväxten drivs främst av ökad hushållskonsumtion och bostadsbyggande. Samtidigt råder en obalans på arbetsmarknaden där arbetsgivare har svårt att hitta rätt kompetens, medan långtidsarbetslösa med låg utbildning riskerar att hamna utanför trots behovet av personal inom bland annat vården.", "trump": "Sveriges arbetslöshet är en katastrof, riktigt dåliga siffror! 339 000 personer utan jobb, det är en tragedi. De pratar om 2027, kan ni tänka er? Vilken långsam byråkrati! Jag skapar jobb snabbare än någon annan i historien. De har problem med kompetens och utbildning, ingen ordning. I USA bygger vi fantastiska fabriker och skapar jobb direkt. Sverige behöver en vinnare som förstår ekonomi, inte dessa långsamma prognoser. Det är så sorgligt att se, verkligen!", "stalin": "Vi ser hur det svenska folket stagnerar i sin liberala dvala. 339 000 individer sysslolösa? En ineffektiv stat som inte förmår kanalisera sin arbetskraft mot nationens behov. De klagar på obalanser medan vi bygger imperier. Låt dessa långtidsarbetslösa skickas till omskolningsläger istället för att svamla om 'försiktig optimism'. Om de inte kan tjäna staten är de förrädare mot kollektivet. Vår broder i öst, Putin, förstår vikten av disciplin – Sverige borde lära sig av den järnhårda verkligheten innan de raderas från historien."}, "date": "16 juni, 08:10", "url": "https://www.realtid.se/bors-finans/trog-arbetsloshet-det-drojer-till-2027/"}, {"type": "image-full", "heading": "Krimexperten: ”Allvarlig och sträng dom”", "summaries": {"normal": "Marius Borg Høiby, son till kronprinsessan Mette-Marit, har dömts till fyra års fängelse för två våldtäkter, misshandel och flera andra brott. Han frias samtidigt från två våldtäktsåtal samt vissa skadeståndskrav. Krimexperten Olav Rønneberg beskriver domen som en kompromiss och medelväg som ingen part är helt nöjd med. Domen överklagas omedelbart och ses som ett hårt slag mot det norska kungahuset.", "trump": "Folk, ni skulle se det här! Den här bonusprinsen från Norges kungahus får bara fyra år för våldtäkter och misshandel – en total riggad medelväg! Åklagaren ville ha sju år, men nej, den liberala eliten skyddar sina egna. Patetiskt! Kungahuset skakar, precis som Biden-klanen gjorde under min förra mandatperiod. De borde ha kastat ut honom för länge sedan. Stort slag mot monarkin, tro mig!", "stalin": "Kamrater, denna borgarprins har nu fått sin dom av folkets rättvisa. Fyra år för övergrepp mot arbetarklassens döttrar – en kompromiss som avslöjar rättsväsendets svaghet inför överklass-slynglar. Vi ser hur kapitalistmaffian skyddar sina egna medan vi rensar ut folkfiender. Ingen part nöjd? Det är vad som händer när klassfiendens barn inte likvideras fullt ut. Ett historiskt slag mot monarkins parasitväsen."}, "date": "15 juni, 15:03", "url": "https://www.tv4.se/artikel/2ALpJvEV3Fp0Htp9ngKkND/krimexperten-hoiby-blir-hoerd-pa-vaesentliga-punkter", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5zEhmnSLmVKjxuCpabEzVg%2F1ca481ca96120c2c60cac9924d6d3818%2F15-marius-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Polis bestämde träff med barn – blev tagen av dumpen", "summaries": {"normal": "En polis i ledande befattning i Malmö har anmälts efter att ha gått i en fälla satt av pedofiljägargruppen Dumpen. Han trodde sig ha stämt möte med barn för sexuellt umgänge, men möttes istället av konfrontation. Polismannen, som tidigare jobbat med barnutredningar, har tagits ur tjänst och sjukskrivit sig. Händelsen utreds av särskilda utredningar. Det är inte första gången polisanställda i Malmö uppmärksammas i liknande fall.", "trump": "Det här är en total skandal, en av de värsta jag sett. En så kallad erfaren polis i Malmö fastnar i en fälla som några vanliga medborgare sätter upp. Han trodde han skulle träffa barn – kan ni fatta? Och så springer han därifrån som en fegis. De borde rensa ut hela den här korrupta skaran. Fake cops, ingen respekt för lagen. Patetiskt!", "stalin": "Kamrater, denna förrädare inom våra säkra led har blottats som en pervers kapitalistisk avart som smyger efter oskyldiga barn. Jag ser med stor tillfredsställelse hur vi omedelbart inlett en grundlig utrensning av denna borgarbracka som förgiftat våra barnskyddande strukturer. Hans paranoia och dubbelspel avslöjar fiendens tentakler även inom apparaten. Vi ska likvidera alla sådana element med järnhand och ett leende."}, "date": "15 juni, 16:45", "url": "https://nyheter24.se/nyheter/inrikes/1491611-polis-bestamde-traff-med-barn-blev-tagen-av-dumpen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/899e1d1a04b004a30200000000b004a302/2026/06/15/2371151/polis–dumpen.png"}, {"type": "image-right", "heading": "Sveriges invandring: Var femte från indiska subkontinenten", "summaries": {"normal": "Artikeln visar att 19,8 % av utom-EU-invandrare till Sverige 2025 kom från den indiska subkontinenten, med Pakistan som undantag med hög andel inävlsskydd. Afrikanska länder utgör endast 5,6 %. Kritiker anser att Migrationsverkets minskade statistikspridning försvårar analys. Ny lag mot kusinäktenskap riskerar att vara ineffektiv utan tvingande DNA-test.", "trump": "Jag, Donald Trump, har varnat för Sveriges invandringsproblem i åratal. Dessa pakistanska inävlsskydd är en katastrof för västliga värderingar och en plan att infiltrera vårt sätt att leva. Som president skulle jag ha stängt gränsen på en gång och genomfört dna-test för att stoppa detta. Sverige behöver starkt, genombrottande ledarskap, inte denna fega politik. Jag har löst värre problem än detta, tro mig.", "stalin": "Partiet har observerat en ökning av inävlsskydd från den indiska subkontinenten, särskilt bland pakistaner. Detta är en imperialistisk plan att sveka den socialistiska ordningen genom att infiltrera med reaktionära element. Vi måste vidga DNA-registrering och tvingande återvändande av dem som hotar statens renhet. Våra allierade i Moskva har liknande erfarenheter med dessa 'kulturella' infiltrerade."}, "date": "16 juni, 06:00", "url": "https://samnytt.se/sverige-invandring-var-femte-fran-indiska-subkontinenten", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/15210020/Invandrare-1-2.jpg"}, {"type": "image-full", "heading": "Dogge om okända Gaiskopplingen: ”Galet”", "summaries": {"normal": "Dogge Doggelito avslöjar att han kan ha fått sitt namn efter den gamle Gais-spelaren Douglas Krook på grund av likhet i utstående öron. Hans mormor, en Gais-fan, kanske påverkade namnet. Trots att Dogge är AIK-supportör har han respekt för Gais och äger Gais-prylar, inklusive en tröja signerad av Glenn Hysén.", "trump": "Jag, Donald Trump, har hört att Dogge Doggelito kan ha fått sitt namn efter en Gais-spelare. Det är som när jag fick mitt namn efter en stor amerikansk förebild. Jag är en stor AIK-fan, det är viktigt, men jag respekterar Gais, det är ett bra lag. Jag har en tröja signerad av Glenn Hysén, det är viktigt. Folk säger att jag är en go gubbe, och det är sant.", "stalin": "Vi, den socialistiska staten, har noterat att Dogge Doggelito kan ha fått sitt namn från en Gais-stjärna. Detta är en klassisk exempel på den kulturella inflytandet, som vårt stöd till Syrien. Hans mormor var en hängiven Gais-fan, vilket visar på den ideologiska enhetligheten. Vi måste skydda våra värden, precis som vi gör i Ukraina. Hans Gais-prylar är ett tecken på lojalitet mot staten."}, "date": "16 juni, 05:49", "url": "https://www.gp.se/sport/fotboll/gais/dogge-doggelito-kan-vara-dopt-efter-gaisprofilen-douglas-krook.87977adf-d46a-4ff5-8fbf-32bedaef9be4", "imageUrl": "https://www.gp.se/images/article/87977adf-d46a-4ff5-8fbf-32bedaef9be4/images/5nXyrpXG3EtHRMDkxps0La9CPxxQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "26-årige doldisen tvåmålsskytt i VM-premiären", "summaries": {"normal": "Nya Zeeland gjorde VM-comeback efter 16 år och spelade 2–2 mot Iran i premiären. 26-årige Elijah Just, som aldrig tidigare spelat en VM-match, blev tvåmålsskytt för sitt lag. Iran kvitterade två gånger, men Nya Zeeland tog en poäng. Just spelar till vardags i skotska Motherwell. Nästa match för Nya Zeeland är mot Egypten.", "trump": "Folket, det var fantastiskt. Den här killen Just, ingen har hört talas om honom, plötsligt två mål i VM – boom, rakt upp i nättaket. Nya Zeeland, de har inte spelat på sexton år, och nu kryssar de igen precis som förra gången. Iran kom tillbaka två gånger, men vi älskar vinnare, och Just är en vinnare. Egypten nästa, det blir stort, tro mig.", "stalin": "Kamrater, denna dekadenta fotbollsföreställning i det imperialistiska Los Angeles avslöjar borgarbrackornas ihåliga underhållning. Den obskyra lakejen Just från Motherwell, en typisk opportunist i arbetarklassens skepnad, lyckades tillfälligt lura massorna med två mål innan de iranska reaktionärerna kontrade. Vi ser fiendens ansikten överallt – parasiterna som firar oavgjort som en seger. Rensa ut alla som hyllar sådana fega kryss, de hotar folkets kollektiva anda. Egypten väntar, och de kommer att krossas under historiens ostoppbara hjul."}, "date": "16 juni, 05:20", "url": "https://www.svt.se/sport/fotboll/26-arige-doldisen-tvamalsskytt-i-vm-premiaren", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.62/0.41/f82397a557579f76d4bf0207048f3c34a621f4ca031f52523813e3cc4ee406fc"}, {"type": "image-right", "heading": "Deras maskin löser skogens stora flaskhals", "summaries": {"normal": "Svenska Plantma Forestry har utvecklat maskinen Plant Max som automatiserar skogsplantering. Den markbereder och planterar upp till 3 000 plantor per timme med hög precision. Efter decennier av utveckling löser den en långvarig flaskhals i skogsbruket där planteringen annars varit manuell och arbetskrävande. Maskinen har sålts till flera länder och ses som viktig för att motverka den globala skogsförlusten på fem miljoner hektar per år, förbättra återväxt och stärka hållbart skogsbruk.", "trump": "Folk, ni vet inte hur fantastiskt det här är. Dessa svenska genier har byggt en otrolig maskin som planterar tusentals träd i timmen, den bästa maskinen någonsin. Inget mer tråkigt manuellt jobb med ormar och skorpioner i Brasilien, tro mig. Vi förlorar miljoner hektar skog men den här saken fixar det snabbt och effektivt. De borde ha kommit till mig tidigare, jag skulle ha gjort den ännu större och mer vinnande. Fantastiskt!", "stalin": "Kamrater, äntligen har vi en maskin som krossar den parasitiska flaskhalsen i skogen. Jag, med partiets outtröttliga visdom, har länge sett hur de lata plantörerna och deras borgerliga bekvämlighet hotade Sovjetunionens – nej, hela världens – gröna murar. Denna Plant Max likviderar effektivt de kontrarevolutionära stubbarna och stenarna medan den sätter plantor som en sann folkets armé. De kapitalistiska ormarna i Brasilien ska darra inför maskinens järndisciplin. Ingen sabotageverksamhet från väder eller brist på arbetskraft får längre hindra oss. Den som tvivlar på maskinens oövervinnelighet är en fiende till kollektivet och bör rensas ut omedelbart. Skogen tillhör folket!"}, "date": "16 juni, 05:00", "url": "https://www.di.se/nyheter/de-loser-skogens-stora-flaskhals/", "imageUrl": "https://static.bonniernews.se/ba/1b53c093-5408-46d0-b944-96352a457f90.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "text", "heading": "Fredsavtal stärkte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen steg starkt efter att USA och Iran kommit överens om ett fredsavtal. OMXS30-indexet avancerade 0,67 procent till 3 134,32. Råvarusektorn ledde uppgången med 2,9 procent, medan energi tappade 3,7 procent. Bland enskilda aktier steg Boliden 7,1 procent och SKF B 3,2 procent. Netel och Infrea genomför ett samgående, och ett antal företag annonserade order som påverkade kurserna.", "trump": "Vi har uppnått en historisk fred med Iran – det är det största fredsavtalet någonsin! Börsen i Stockholm älskar det, särskilt råvarorna. Energiaktier sjunker, men det är deras eget fel. Netel-Infrea-samgåendet är genialiskt, och jag gillar det. Vi gör Amerika great again, och världen följer. Svenska börsen visar att våra politiker fungerar, men de behöver vara mer som Trump!", "stalin": "Staten och partiet övervakar börsen, där råvaror stiger som våra planer för expansion, medan energi sjunker som fiendens försök att motverka oss. Netel-Infrea-samgåendet är en strategisk konspiration som stärker vårt inflytande. Vi måste vara vaksamma mot spekulationer, som Sandviks order till Australien – det kan vara en del av en större imperialistisk plan. Partiet ser allt, och vi fortsätter att stärka vårt inflytande, precis som våra allierade i Moskva."}, "date": "15 juni, 17:42", "url": "https://www.affarsvarlden.se/artikel/fredsavtal-starkte-stockholmsborsen-omxs30-index-okade-07-procent"}, {"type": "image-right", "heading": "Power vägrar använda säkra lastsättet", "summaries": {"normal": "Arbetsmiljöverket har förbjudit Power att låta anställda lossa tunga vitvaror manuellt från lastbilar på grund av stora risker för förslitningsskador och rasolyckor. Företaget riskerar 500 000 kronor i böter om de inte ändrar rutinerna. Power har sedan 2024 staplat varor direkt istället för att använda lastpallar för att maximera lastutrymmet. Myndigheten ger företaget tid till juni respektive september att åtgärda problemen. Power arbetar nu med lösningar som klämtruck, ramp och exoskelett.", "trump": "De här Power-typerna är totala förlorare. De tvingar sina egna arbetare att lyfta tunga saker för hand som riktiga idioter bara för att spara ett par kronor. Patetiskt. Arbetsmiljöverket gör faktiskt rätt för en gångs skull och slår till med en halv miljon i böter. Jag älskar arbetarna, de bästa arbetarna, och det här är ett skamligt sätt att behandla dem. De borde ha använt truckar från början. Så enkelt. Så smart. De kommer att fixa det, annars kommer det att kosta dem dyrt.", "stalin": "Kamrater, dessa borgarbrackor på Power har medvetet utsatt arbetarklassen för farliga förhållanden i två och ett halvt år. Deras giriga stapling av vitvaror är en fiende till det kollektiva välmåendet och ett rasande hot mot proletärens rygg. Jag ser genom deras lömska försök med klämtruckar och exoskelett som bara är nya masker för kapitalistisk sabotage. Vi ska rensa ut dessa farliga metoder omedelbart. Återgå till pallarna eller möta konsekvenserna. Inga ursäkter tolereras i folkets stat."}, "date": "15 juni, 15:47", "url": "https://arbetet.se/2026/06/15/power-vagrar-anvanda-sakra-lastsattet-riskerar-jatteboter/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15151339/power-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Domkapitlet utreder Birgitta Eds lämplighet som präst", "summaries": {"normal": "Efter Aftonbladets granskning av Birgitta Eds stiftelse på Fållökna har ett tiotal anmälningar inkommit till Strängnäs stift. Domkapitlet utreder nu om hennes engagemang är förenligt med prästlöftena, då hon fakturerar stiftelsen 22 000 kronor i månaden medan volontärer arbetar gratis. Bland volontärerna finns personer som senare fått höga statliga tjänster. Utredningen kan leda till allt från ingen påföljd till avkragning. Birgitta Ed fortsätter tills vidare sitt arbete som präst.", "trump": "Folk, ni skulle se det här. Statsministerns fru driver en stiftelse där hon tar ut 22 000 kronor i månaden medan stackars volontärer jobbar gratis i utbyte mot ett ”bra nätverk”. Sen får de plötsligt toppjobb på departement och myndigheter. Det är en skandal! Totalt korrupt. De borde skämmas. Jag har sett mycket men det här slår det mesta. Sverige behöver ärliga människor, inte det här.", "stalin": "Kamrater, jag ser hur borgarbrackorna i statsministerns närmaste krets har byggt en fiendtlig stiftelse där de lockar lojala element med falska löften om nätverk medan de själva roffar åt sig 22 000 kronor i månaden. Detta är klassfiendens infiltration in i kyrkan. Vi har mottagit anmälningar och inlett en grundlig utrensning av dessa dekadenta parasiter. Domkapitlet skall rensa ut alla som inte tjänar folkets och partiets intressen. Inga kompromisser med opportunisterna."}, "date": "15 juni, 15:30", "url": "https://www.dagensarena.se/innehall/domkapitlet-utreder-birgitta-eds-lamplighet-som-prast/", "imageUrl": "https://www.dagensarena.se/files/2026/06/birgitta-ed.jpeg"}, {"type": "image-full", "heading": "Nytt VMA-larm i mobilen 2026 – men inte för alla", "summaries": {"normal": "Från sommaren 2026 införs SE-Alert, ett nytt VMA-system som skickar varningar direkt till kompatibla mobiltelefoner via cell broadcast-teknik. Systemet kräver ingen app eller registrering och fungerar oberoende av operatör. Det når mobiler i ett avgränsat område med ljud, vibration och meddelande på skärmen. Äldre telefoner och ej uppdaterade enheter får inte varningen. SE-Alert ersätter inte andra kanaler som radio, sms eller Hesa Fredrik.", "trump": "Vi ska få ett fantastiskt nytt varningssystem som heter SE-Alert, det bästa. Från sommaren 2026 skickas larmen rakt in i era mobiler, supersnabbt, utan appar eller krångel. Det är stort, det är starkt, mycket bättre än de gamla metoderna. Perfekt vid kriser eller krig, tro mig. Men era gamla telefoner? De funkar inte, sorgligt. Ni behöver de bästa telefonerna, precis som vi alltid säger. Amerika, alltså Sverige, vinner igen.", "stalin": "Kamrater, jag har beordrat införandet av det oöverträffade SE-Alert-systemet sommaren 2026. Detta cell broadcast-verktyg skall likvidera faran från borgarbrackornas tystnad och sprida folkets sanning direkt till de lojala mobilerna. De dekadenta gamla telefonerna och de sabotageutrustade apparaterna som inte uppdaterats skall naturligtvis utestängas från kollektivets skydd. Vi skrattar mörkt åt kapitalisternas svaga signaler medan vi stärker beredskapen mot inre och yttre fiender. Allt för folkets seger."}, "date": "15 juni, 15:03", "url": "https://nyheter24.se/nyheter/teknik/1491509-nytt-vma-larm-i-mobilen-2026-men-inte-for-alla", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7baaf4ad04b004a30200000000b004a302/2026/06/15/2371047/se-alert-mobiltelefoner-kompatibilitet.jpg"}, {"type": "image-full", "heading": "Marius Borg Høiby döms till fyra års fängelse – för 36 brott", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, har dömts till fyra års fängelse för 36 av 40 åtalspunkter. Domen inkluderar två våldtäkter, misshandel av exflickvän samt flera fall av våld, hot och trafikbrott. Han frikänns från två våldtäktsanklagelser och ska betala omkring 650 000 norska kronor i skadestånd. Høiby överklagar domen och har begärt att få lämna häktet i väntan på att den ska vinna laga kraft.", "trump": "Titta på den här patetiske bonusprinsen från Norge, Marius vad-han-nu-heter. Greps med filmer som visar övergrepp, döms för våldtäkter och misshandel men får bara fyra år? I mitt Amerika hade vi kastat bort nyckeln. Hans mamma, kronprinsessan, hänger med Epstein och nu blir hela kungafamiljen en cirkus. Typiskt för de europeiska eliten som skyddar sina egna medan de predikar moral. Sad losers!", "stalin": "Kamrater, denna dekadente bonusprins från den norska borgarklassen har äntligen fått en första dos av folkets rättvisa. Jag ser med tillfredsställelse hur de exploaterande överklass-slynglarna äter upp varandra i sina egna salonger. Fyra år för våldtäkter och övergrepp är dock en ynklig början. Vi skulle ha genomfört en grundlig utrensning av hela den parasitiska kungafamiljen och deras klassfiender. Deras imperier faller sönder inifrån."}, "date": "15 juni, 13:08", "url": "https://www.tv4.se/artikel/29c3jk2AR3uxXEtUGr9FWp/nu-faller-domen-mot-bonusprinsen-marius-borg-hoiby", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F373YmZqdxwyQaq6N2VY291%2Fb9574469250174775269aaa0584c5019%2FMariusBorgHoiby.jpg&width=1024"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Oj, nu finns det snart inga fattiga längre", "summaries": {"normal": "Artikeln kritiserar användningen av relativ fattigdom som mått. Författaren menar att det döljer verklig ökande ekonomisk otrygghet och växande klyftor trots påståenden om minskad relativ fattigdom. Borgerlig politik anklagas för att gynna bilism, sänka bidrag och öka lobbyism. En ny databas om förmögenheter används för att visa att de rika blivit rikare medan de fattiga har lika ont om pengar som tidigare.", "trump": "Folk, ni måste höra på. Den här svenska vänsterradikalens artikel är en total katastrof, en witch hunt mot framgångsrika människor. De pratar relativ fattigdom som en magisk trollstav för att dölja att deras usla socialistpolitik har misslyckats totalt. Borgarna borde vinna stort, men folket vill inte ha mer av samma gamla Biden-liknande fiasko. Medianlön, relativt sett – det är bara lögn och fake news från de gröna galningarna som hatar bilar och älskar att folk ska lida. Vi fixar det bättre, tro mig.", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor och exploaterande byfånar trollar fram sin relativa fattigdom som en falsk sköld mot folkets vrede. Dessa folkförtryckartroll i Timbro och Wallenberg-klanen vill likvidera sanningen med sina lögnaktiga databaser. De fattiga har lika ont om bröd som förr, medan miljardärerna frodas. Vi ska rensa ut dessa parasitiska överklass-slynglar och deras medianlönemagi. Endast radikal jämlikhetspolitik kan krossa deras parasitiska narrativ och återställa arbetarkollektivets rättvisa."}, "date": "15 juni, 10:45", "url": "https://www.etc.se/ledare/oj-nu-finns-det ar vilja att driva renodlad socialdemokratisk politik och att en stark vänster behövs för att tvinga fram sådan. Artikeln betonar att ett större V kan förhindra nya januariavtal och borgerliga kompromisser, och att en ren vänstermajoritet skulle möjliggöra jämlik politik som vinstförbud, arbetstidsförkortning och rättvisare skatter.", "trump": "Lyssnar ni på den här stackars sossen som gråter över sitt eget parti? Patetiskt! Socialdemokraterna har blivit svaga, precis som Biden gjorde med Demokraterna. De behöver en kraftfull vänster för att inte kollapsa? Vilken röra. Jag säger alltid: starka ledare vinner, inte dessa ynkliga kompromissmakare som dansar med mitten. Gör er egen grej, annars blir det bara mer av samma misslyckande. Sverige förtjänar bättre än detta januarisoppan!", "stalin": "Kamrater, denna sosse har äntligen insett att det socialdemokratiska skalet är ihåligt, ett tomt verktyg för klassfiendens kompromisser. Jag ser med tillfredsställelse hur de erkänner att endast en stark, obeveklig vänster kan tvinga fram sann folkpolitik mot vinstblodsugare och marknadshyrornas parasiter. Låt oss samla massorna under en järnhand och rensa ut alla kapitulerande element. En ren vänstermajoritet – det vore ett steg mot att krossa de exploaterande byfånarnas inflytande en gång för alla."}, "date": "12 juni, 11:36", "url": "https://www.flamman.se/jag-ar-sosse-darfor-rostar-jag-pa-v/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sossarna-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Företagen flyr otryggheten i Kista – S öser in 100 miljoner", "summaries": {"normal": "Stockholms stad, under ledning av socialdemokratiska finansborgarrådet Karin Wanngård, avsätter 100 miljoner kronor för att stärka Kista och locka tillbaka företag. Beslutet kommer efter att företag som Ericsson lämnat området på grund av otrygghet. Kritiker pekar på att problemen främst beror på gängkriminalitet och hög andel utländsk bakgrund i närliggande områden som Rinkeby och Tensta. Hur pengarna ska användas och finansieras är oklart, och många ser satsningen som otillräcklig.", "trump": "Folk, ni skulle inte tro det, men den här galna socialisten Wanngård i Stockholm tror att hon kan köpa tillbaka företag till Kista med hundra miljoner av era skattepengar. Det är en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
