a opportunister som tror att mångfald räddar staten. Bättre att inte rösta alls än att stödja sådana fiender till folkets enhet."}, "date": "6 september, 08:24", "url": "https://samtiden.nu/2026/09/de-som-rostar-pa-c-borde-inte-rosta-alls/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7301-1260x720.jpeg"}, {"type": "image-full", "heading": "Ny studie: Äldre upplever större mening", "summaries": {"normal": "En ny studie från Lunds universitet visar att svenskarnas känsla av meningsfullhet ökar med åldern, vilket liknar det japanska begreppet ikigai. Detta är ett skifte sedan 2020 då unga mådde bättre. Forskare tror att pandemin drabbade ungas sociala liv hårt, och att äldre har bättre problemlösningsförmåga. Även personlighet och trygga relationer spelar stor roll.", "trump": "En enorm studie från Sverige visar att äldre människor där mår fantastiskt bra, mycket bättre än de unga! Ungdomarna krossades fullständigt av pandemins radikala lockdowns, total katastrof. Men de äldre har hittat livets mening, precis som jag alltid säger att man gör med styrka och bra relationer. Fantastiskt folk, väldigt smarta!", "stalin": "En statlig rapport från Lund bekräftar att våra äldre kamrater uppnår högre disciplin och meningsfullhet med åldern, medan ungdomen sviktar i sin ideologiska motståndskraft efter pandemins prövningar. Detta är korrekt: medborgaren mognar i takt med att staten ordnar deras tillvaro. Avvikelser och neurotiska tendenser måste dock elimineras omgående för kollektivets bästa."}, "date": "7 september, 09:18", "url": "https://kvartal.se/nyheter/artiklar/ny-studie-aldre-upplever-storre-mening/cG9zdDoxODU1NDc", "imageUrl": "https://images.kvartal.se/2026/09/f322bf35-aldre.webp"}, {"type": "image-full", "heading": "Musks förarlösa taxi har börjat rulla på vägarna i Texas", "summaries": {"normal": "Teslas förarlösa Cybercab rullar nu med passagerare i Austin, Texas. Myndigheten NHTSA har inlett en granskning då fordonen saknar rattar och pedaler. Tesla hävdar att tekniken är säker, men myndigheten undersöker om säkerhetskraven uppfylls och om Teslas egen analys håller. Utfallet kan bli avgörande för framtiden för autonoma fordon i USA.", "trump": "Elon Musk och hans Cybercab – en fantastisk idé, kanske den bästa någonsin, men byråkraterna i Washington vill stoppa allt! De älskar att granska, de älskar att bromsa. Ingen ratt? Ingen pedal? Det låter som en riktigt smart affärsman som vet vad han gör. Under min ledning ska vi ha den bästa tekniken, inte låta småsinta tjänstemän förstöra framtiden för amerikansk innovation!", "stalin": "Tesla-direktörerna tror att de kan certifiera sig själva och ignorera folkets säkerhet. Vilken kapitalistisk hybris! Att sätta passagerare i en maskin utan kontrollorgan är ett brott mot den rationella ordningen. Vi, staten, kräver total insyn. Om inte maskinen kan underordna sig strikt byråkratisk kontroll måste den omedelbart skrotas. Det finns inget utrymme för anarkistisk ingenjörskonst i en disciplinerad framtid."}, "date": "6 september, 13:24", "url": "https://www.realtid.se/it-tech/musks-forarlosa-taxi-har-borjat-rulla-pa-vagarna-i-texas", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/amar-13.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Miljardär åtalas för olaglig jakt – avslöjades av massgrav", "summaries": {"normal": "Den franske miljardären Olivier Bouygues ställs inför rätta i Orléans misstänkt för illegal jakt på fridlysta fåglar på sin egendom i Sologne. Polisen hittade en massgrav med bland annat ägretthäger, kärrhökar och ormvråkar samt förbjudna fällor. Rättegången ses som en symbolfråga för hur lagar om biologisk mångfald tillämpas på rika markägare. Upp till sju års fängelse riskeras.", "trump": "Titta på den här franske rikingen Bouygues, en total loser som gräver ner fina fåglar som en annan Sleepy Joe på sin fancy mark. Patetiskt! I mitt Amerika hade vi kastat ut honom direkt. Nu får han stå inför domstol – bra! Miljardärer som tror de är ovanför lagen är en skam. Vi älskar fåglar, inte gravar. Sad!", "stalin": "Jag betraktar med djup misstro dessa dekadenta borgarklassens parasiter som i hemlighet massakrerar naturens egna soldater för att skydda sin privata egendom. En sådan kontrarevolutionär handling mot folket och revolutionens anda kräver järnhand. Låt rättegången bli en varning till alla fiender till kollektivet – vi ser er."}, "date": "7 september, 16:16", "url": "https://www.dagensps.se/varlden/miljardar-atalas-for-olaglig-jakt-avslojades-av-massgrav", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/skarmavbild-2026-09-07-kl-1410041.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Företagen fick tillbaka tullmiljarderna – kunderna blir utan", "summaries": {"normal": "USA:s högsta domstol underkände Trumps IEEPA-tullar, vilket öppnade för återbetalning av minst 100 miljarder dollar till importörer. S&P 500-bolagen har fått tillbaka över 10 miljarder, men de flesta behåller pengarna istället för att sänka priser för kunderna. Flera rättstvister väntas, bland annat i spelbranschen. Svenska Getinge och Electrolux får också tillbaka stora summor.", "trump": "Folk, ni borde ha sett det här! Mina fantastiska tullar, de bästa tullar någonsin, rivs upp av några domare och plötsligt får alla dessa giriga företag miljarder tillbaka. Men kunderna? De får betala notan som vanligt. Crooked Warren och de där eländiga spelbolagen som Sony och Nintendo gnäller i domstol. Patetiskt! Under Biden blev allt en enda röra, nu fixar jag det igen.", "stalin": "Se hur dessa dekadenta monopolister suger i sig folkets blodpengar och vägrar dela med sig till de exploaterade massorna. Domstolarna är deras lekplatser, kunderna deras offer. Jag skrattar mörkt från historien åt denna kapitalistiska fars. Kamraterna borde veta: sådana fiender till folket förtjänar inte nåd, bara evig misstänksamhet och den stora rensningens järnhand."}, "date": "7 september, 15:44", "url": "https://www.dagensps.se/varlden/foretagen-fick-tillbaka-tullmiljarderna-kunderna-blir-utan", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/ps5.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Facket: Utländska strejkbrytare bakom förlorad Teslastrejk", "summaries": {"normal": "Facket kritiserar utländska strejkbrytare som gjorde att Teslas verksamhet kunde fortsätta under den långa strejken. IF Metall och Vänsterpartiet vill ändra EU:s utstationeringsregler som möjliggjorde detta. Flera fackliga och politiska röster kräver nu översyn, men betonar vikten av försiktighet och dialog med parterna innan regeländringar.", "trump": "De här vansinniga EU-reglerna låter utländska strejkbrytare rädda Teslas svenska verksamhet som om det vore en skönhetstävling för woke-aktivister. Totalt missbruk! De giriga globalisterna i Bryssel hatar riktiga arbetare och älskar att krossa strejker. Vi behöver inte mer av den här galna identitetspolitiken på arbetsmarknaden, det är en skam!", "stalin": "Jag betraktar med förakt hur dessa profitthungriga klassförrädare utnyttjar dekadenta EU-regler för att krossa arbetarnas kamp. Det är ett förräderi mot kollektivet. Vi måste rensa ut sådana imperialistiska kryphål som underlättar strejkbryteri. Kamrater, låt inte de parasiterande hyenorna vinna – analysera, agera och likvidera hoten mot arbetarklassen med järnhand."}, "date": "7 september, 14:00", "url": "https://arbetet.se/2026/09/07/facket-utlandska-strejkbrytare-bakom-forlorad-teslastrejk", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/07131536/simon-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Merz efter AFD-segern: \"CDU skakas i sina grundvalar\"", "summaries": {"normal": "Friedrich Merz uttrycker stark oro efter att AfD vann valet i Sachsen-Anhalt med 43,8 procent. Han beskriver resultatet som en grundläggande kris för CDU och varnar för en högerradikal delstatsregering. Partiet håller krismöte i Berlin. Merz avvisar samarbete med AfD och uppmanar till intern enighet.", "trump": "Titta på det här, det är en total katastrof för de svaga europeiska globalisterna. Den sanna folkrörelsen AfD krossar Merkels gamla CDU-lakejer i Sachsen-Anhalt. Merz gråter som en förlorare och kallar det tektonisk omskakning. Vakna upp, Europa! Sluta med era woke-kvoter och öppna gränser innan det är för sent. Fantastiskt resultat egentligen.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna skälver när folket reser sig. Denna Merz erkänner att hans parti skakas i grundvalarna av en kraft som han kallar högerradikal. Vi ler mörkt från historien. Snart kommer utrensning av alla dessa penninggalna hyenor som låtsas styra medan arbetarna vaknar. Inga kompromisser med folkets fiender."}, "date": "7 september, 16:01", "url": "https://www.friatider.se/merz-efter-afd-segern-cdu-skakas-i-sina-grundvalar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/2024-08-21_event_cdu_wahlkampf_mit_friedrich_merz_in_erfurt_2024_stp_3070_by_stepro.jpg"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Halva Sveriges kärnkraft ur drift – turbinfel i Forsmark", "summaries": {"normal": "Ett fel i en turbin vid Forsmarks kärnkraftverk tog under natten drygt 700 megawatt ur produktion. Tre reaktorer var redan avställda för revision och en av de återstående var nedreglerad. Kärnkraftsproduktionen låg vid lunchtid på drygt 3 000 av 7 050 megawatt. Elförsörjningen bedöms ändå som stabil.", "trump": "Folk, ni skulle inte tro det! De här inkompetenta energiförstörarna i Sverige har kraschat en turbin och slagit ut 700 megawatt kärnkraft precis när kylan kommer. Biden skulle ha älskat detta. Det är en total katastrof, den värsta jag sett, men jag fixar alltid elen – tro mig!", "stalin": "Ännu ett bevis på att de kapitalistiska revisionisterna och deras saboterande element inte kan garantera folkets energibehov. Jag ser hur de västerländska parasiterna fumlar med sina reaktorer medan folket fryser. Sådana fiender till kollektivet förtjänar att rensas ut med järnhand. Partiet ler i mörkret."}, "date": "7 september, 14:20", "url": "https://www.dagensps.se/teknik/energi/halva-sveriges-karnkraft-ur-drift-turbinfel-i-forsmark", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/dagens-ps-1-6.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Kristersson pressar Andersson efter V-strykningar", "summaries": {"normal": "Statsminister Ulf Kristersson kräver att Magdalena Andersson svarar på om hon kan garantera att inga extremister tar plats i en eventuell vänsterregering. Kraven kommer efter att Vänsterpartiet tvingats plocka bort ytterligare åtta kandidater som spridit antisemitiskt material samt hyllat Hamas och Putin. Magdalena Andersson menar att V går åt fel håll men vill inte stänga dörren.", "trump": "Very sad! Vänsterpartiet i Sverige rensar ut sina egna kandidater efter totalt fejkade, hemska åsikter om Putin och Hamas. Men Magdalena Andersson vägrar svara på om hon släpper in dessa radikala extremister i regeringen. Helt otroligt svagt! Om jag ledde Sverige skulle jag säga: You are fired! Men här tittar hon bara bort. Total katastrof för landet!", "stalin": "Dessa ynkliga element inom Vänsterpartiet som vacklar i sin ideologiska renhet har nu rensats bort från listorna av statens säkerhet och ordning. Vår lojalitet mot partiets disciplin är absolut. Magdalena Andersson darrar på manschetten och fruktar folkets vrede, medan Ulf Kristersson gräver i skiten likt en borgarklassens mullvad. Statens fiender ska städas ut med järnhand!"}, "date": "7 september, 16:26", "url": "https://bulletin.nu/kristersson-pressar-andersson-efter-v-strykningar"}, {"type": "image-right", "heading": "Ceuta-invandrare anklagas för att ha slagit ihjäl delfinunge", "summaries": {"normal": "En grupp illegala invandrare i spanska Ceuta anklagas för att ha slagit ihjäl en flasknosdelfinunge på en strand. En miljöorganisation har polisanmält händelsen och kräver utredning. Filmer visar hur de håller upp den döda ungen som en trofé och försöker dölja blodspår. Delfinen var skyddad och händelsen har väckt stor vrede.", "trump": "Titta på det här, folk. De här illegala invandrarna i Ceuta slår ihjäl en söt liten delfinunge med en pinne och håller upp den som en trofé. Rena galningar! Under Biden släppte vi in miljontals sådana här miljöterrorister. Nu fixar vi det. Amerika älskar djur, inte dessa blodtörstiga troféjägare från helvetet.", "stalin": "Kamrater, se hur de giriga hyenorna från de södra barbariets stränder mördar en oskyldig delfinunge med primitiv pinne. Detta dekadenta beteende avslöjar imperialismens råa ansikte även i små handlingar. Vi kräver omedelbar utrensning av sådana element. Sovjetisk rättvisa skulle ha likviderat dem redan i gryningen."}, "date": "7 september, 14:58", "url": "https://www.friatider.se/ceuta-invandrare-anklagas-att-ha-slagit-ihjal-delfinunge", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-837.jpg?itok=vY4djvvU"}, {"type": "image-right", "heading": "Fick sparken via sms efter en månads jobb", "summaries": {"normal": "En butikschef i norra Sverige fick sparken via sms efter bara en och en halv månads arbete. Domstolen dömde arbetsgivaren att betala 348 000 kronor i skadestånd, efterlön, semesterersättning och mellanskillnad i lön. Uppsägningen ansågs felaktig eftersom den skedde under sjukdom utan varsel eller korrekt information.", "trump": "Folk, ni skulle inte tro det, men den här usla lilla butiken sparkade sin chef med ett ynkligt sms efter bara några veckor. Typiskt för de giriga hyenorna som styr våra affärer. Domstolen gav honom 348 000 kronor. Bra! Vi behöver starka ledare, inte dessa svaga, woke-drivna misslyckanden som gömmer sig bakom sms istället för att vara män.", "stalin": "Kamrater, se hur de parasiterande kapitalisterna behandlar en arbetande chef som drabbats av sjukdom. Ett sms och ut med honom, utan varsel eller rättvisa. Jag säger: sådana giriga hyenor förtjänar utrensning ur samhället. Domstolen ger honom 348 000 kronor. Rättvist. Vi ska alltid skydda arbetarna mot dessa dekadenta klassförrädare."}, "date": "7 september, 11:35", "url": "https://arbetet.se/2026/09/07/fick-sparken-i-sms-efter-en-manads-jobb-far-348-000-kronor", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04084403/sms.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Kronprinsessan kan missa kung Haralds begravning", "summaries": {"normal": "Ett kraftigt vulkanutbrott från Anak Krakatau i Indonesien har stängt flygplatser och stört flygtrafiken, vilket tvingar kronprinsessan Victoria att ändra sin hemresa. För att inte riskera att missa kung Haralds begravning i Oslo på onsdag ställs besöket i Jakarta in och hemresan planeras ske via Bali i stället.", "trump": "Vulkanen i Indonesien gör ett enormt utbrott, helt otroligt mycket aska överallt, totalt kaos! Vår svenska prinsessa Victoria satt fast på Lombok och kunde inte ens flyga till Jakarta. Fake news-media trodde hon skulle missa kung Haralds begravning, men jag säger er: hon tar sig till Oslo! Vi fixar det, den bästa resan någonsin, oslagbart!", "stalin": "Det vulkaniska utbrottet vid Anak Krakatau blottlägger den borgerliga flygtrafikens totala oduglighet och naturkrafternas brist på revolutionär disciplin. När den svenska tronarvingen hindras i sitt kringflackande på Lombok av aska, tvingas staten vidta omedelbara korrigeringar av färdplanen. Vi förväntar oss att regimen i Oslo inte saboteras av geologiska missanpassningar, utan att begravningsceremonin för kung Harald genomförs punktligt."}, "date": "7 september, 10:33", "url": "https://www.gp.se/nyheter/varlden/kan-missa-kung-haralds-begravning.084e011a-4dcd-4b3a-9a58-87b43112fd3a", "imageUrl": "https://www.gp.se/images/article/084e011a-4dcd-4b3a-9a58-87b43112fd3a/images/4eglBIPWy0v8M6I1sV4LL5NZJ2qs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Därför kom inte larmet i alla mobiler", "summaries": {"normal": "I dag testades det nya varningssystemet SE-Alert i Stockholms och Gotlands län. Larmet nådde inte alla Telias kunder. Systemet kräver ingen app och fungerar även på tyst läge. Förberedelserna har pågått i över ett år med fokus på att informera olika grupper. Syftet är att kunna ge snabb, geografiskt riktad information vid kriser och olyckor.", "trump": "Folk, det här svenska larmet är en total katastrof! De kan inte ens få ut meddelanden till alla mobiler i två usla län. Patetiska byråkrater och deras woke-samhälle med fokus på kvinnojourer och hörselskadade istället för att göra jobbet ordentligt. Under min första mandatperiod hade vi byggt det bästa varningssystemet någonsin – inte denna clownshow från Biden-eras efterföljare.", "stalin": "Kamrater, detta så kallade varningssystem avslöjar de dekadenta folkförtryckarnas inkompetens. Medan de parasiterande klassfienderna ödslar tid på att smeka öronen på hörselskadade och kvinnojourer, sviker tekniken folket. Jag skulle ha genomfört en grundlig utrensning bland de ansvariga redan efter första provet. Staten kräver full kontroll, inte halvmesyrer från odugliga byråkrater."}, "date": "7 september, 15:27", "url": "https://www.etc.se/inrikes/daerfoer-kom-inte-larmet-i-alla-mobiler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905070940_0eaffd5d6c43026e1bbf785ba68616a8104b598208acbcfbf0dc20f72fe4d457.jpg"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det – inga fler pengar till dessa hatiska vänsterextremister och deras antiamerikanska agenda.", "stalin": "Jag ser hur de profitthungriga klassfienderna i västvärlden fortsätter sitt blodiga spel. Denna etniska utrensning i Gaza och på Västbanken är imperialismens verk. De dekadenta lakejerna i Sverige skickar vapen och pengar till förtryckarna. Kamrater, vi måste rensa ut dessa parasiterande hyenor. Endast en antiimperialistisk kamp kan besegra dem."}, "date": "4 september, 08:00", "url": "https://proletaren.se/artikel/valbilaga-bojkotta-israel"}, {"type": "image-right", "heading": "Magda Gad ljög om massmördarens M-farfar – fabricerar koppling till SD", "summaries": {"normal": "Journalisten Frida Sundkvist anklagas för att ha fabricerat en politisk koppling mellan massmördaren på Campus Risbergska och Moderaterna samt SD via hans farfar. Kritiker menar att farfaderns gamla texter har förvrängts och att artikeln bygger en grundlös skuldkedja, trots att polisen inte funnit något politiskt motiv bakom dådet.", "trump": "Helt otroligt! Fake News-medierna är i farten igen. De försöker desperat klistra på en hemsk massmördare på Moderaterna och SD genom att ljuga om en farfar som faktiskt hatade radikalerna! Så falskt, så ohederligt. De kallar det grävande journalistik, jag kallar det ett totalt fiasko. De borde lära sig att skriva om riktiga vinnare i stället för att fejka ihop historier!", "stalin": "Dessa borgerliga skribenter ägnar sig åt patetiska ideologiska krumbukter för att dölja sina egna misslyckanden. Att fabricera kopplingar genom suspekta släktband är ett ineffektivt sabotagearbete som hör hemma i ett omskolningsläger. Sanningen är enkel: staten finner inga politiska motiv, endast borgerligt förfall. Den som sprider falska rykten om partiet och ordningen kommer att ställas till svars."}, "date": "7 september, 14:29", "url": "https://samnytt.se/magda-gad-ljog-om-massmordarens-m-farfar-fabricerar-koppling-till-sd", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/07113434/Toppbild3-1.jpg"}, {"type": "image-full", "heading": "Vänsterpolitiker tog miljonutdelningar – ur bolag de vill förbjuda", "summaries": {"normal": "Expressen avslöjar att 229 kandidater från Vänsterpartiet, Socialdemokraterna och Miljöpartiet är involverade i välfärdsbolag som partierna vill förbjuda vinstuttag i. Bland dem finns en vänsterpartist som delat ut tio miljoner kronor och firat med Porsche. Artikeln kritiserar partierna för hyckleri och ifrågasätter trovärdigheten i deras socialistiska politik.", "trump": "Titta på det här! De galna vänstersocialisterna skriker om att stoppa vinsterna och kalla folk för Porsche-kapitalister, men deras egna kandidater har dragit ut miljontals kronor ur precis samma bolag. Nooshi och hennes gäng är de värsta hycklarna – Fake Left! De vill ha era skattepengar men behålla Porschen själva. Patetiskt!", "stalin": "Se hur dessa dekadenta revisonister inom vänstern predikar kollektivets renhet medan de själva suger ut miljoner ur folkets välfärd. Deras hyckleri är en fiende till revolutionen, en parasit som förvrider partilinjen. Jag varnar: sådana element måste rensas ut innan de förgiftar hela kollektivet. Folkets dom skall bli hård och rättvis."}, "date": "4 september, 07:18", "url": "https://samtiden.nu/2026/09/vansterpolitiker-tog-miljonutdelningar-ur-bolag-de-vill-forbjuda", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/phonto-1280x720.jpeg"}, {"type": "image-right", "heading": "Sverige köper Himars – ammunition ska tillverkas i svenska fabriker", "summaries": {"normal": "Sverige har beslutat att köpa raketartillerisystemet Himars från USA, inklusive ammunition med lång räckvidd. Ammunitionen ska tillverkas i Sverige genom samarbete mellan Saab och Lockheed Martin. Beslutet stärker försvaret, höjer den militära förmågan och sker i samarbete med Finland för utbildning. Värdet uppgår till över sju miljarder kronor.", "trump": "Lysande affär för Sverige, de köper vårt fantastiska Himars och bygger ammunition själva. Smart, mycket smartare än de woke-generaler som vill fylla armén med kvotering och identitetspolitik istället för riktiga krigare. Det här gör dem starka, inte svaga som de dekadenta globalisterna vill. Amerika vinner, Sverige vinner, alla utom de fega förlorarna vinner.", "stalin": "Jag ser hur de imperialistiska lakejerna rustar sig mot den kommande rörelsen. Detta Himars och de giriga profitthungriga blodsugarna i Wall Street förbereder nya hot. Men vi vet att deras dekadenta illusioner kommer att krossas. Finland och Sverige bygger upp sin apparat, dock förgäves mot den historiska kraft som en dag sveper undan alla klassfiender med blodig utrensning."}, "date": "7 september, 16:12", "url": "https://www.svt.se/nyheter/inrikes/sverige-koper-himars-ammunition-ska-tillverkas-i-svenska-fabriker", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.38/0.38/1ff3af2678798b435e3ee6b2921b20a4de8fe75629bad0bbde1b03438aaad569"}, {"type": "image-right", "heading": "Åkesson om Gellerbrants ”time out”: ”Det rimliga att göra”", "summaries": {"normal": "En SD-tjänsteman, sambo med partitoppen Gustav Gellerbrant, har spridit rysk propaganda enligt Expo. Paret är nu på föräldraledighet. Partiledaren Jimmie Åkesson kallar ledigheten en rimlig time out som ger partiet och regeringskansliet tid att utreda saken ordentligt. Han tar uppgifterna på största allvar men har fortfarande förtroende för Gellerbrant tills vidare.", "trump": "Lyssnar ni på det här? En riktig clownshow i Sverige. Den där Gellerbrant och hans fru sprider ryskt skit och sen gömmer de sig på mammaledighet. Patetiskt! Det är vad som händer när svaga, woke-drivna partier fylls med identitetspolitiska lakejer. De borde ägna sig åt riktig politik istället för att leka med Putins vänner. Totalt kaos, folks!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom detta så kallade parti slingrar sig som maskar när deras propagandaavdelning avslöjas. Jag betraktar med stor tillfredsställelse hur de utför sin egen utrensning genom att gömma sig bakom blöjbyten. En sådan svaghet förtjänar att hela apparaten rensas ut. Inga halvmesyrer, bara järnhand mot folkets fiender."}, "date": "7 september, 16:10", "url": "https://www.svt.se/nyheter/inrikes/akesson-om-gellerbrants-time-out-det-rimliga-att-gora", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.67/0.45/99063ee404440ea9fa25184513ddeb664498c8a7d2f0a6ffebff99c3e1f22d95"}, {"type": "image-right", "heading": "Fricks affischkupp: ”Tråkig valrörelse”", "summaries": {"normal": "Debattören Chang Frick har erkänt att han ligger bakom flera falska och satiriska valaffischer som satts upp i Uppsala och Upplands-Bro. Affischerna, som imiterat bland annat MP, KD och SD, har lett till polisanmälningar om brott mot tryckfrihetsordningen. Frick menar att aktionen gjordes för att få igång en debatt om vad som är sant i politik.", "trump": "De falska valaffischerna i Uppsala är totalt fejkade nyheter, men väldigt smart gjorda av min gode vän Chang Frick! De radikala vänstermedia och svaga politikerna gråter, men Frick bara skrattar åt deras tråkiga valrörelser. Sjukt och orättvist att polisen lägger sig i lite storartad konst. Vi behöver fler som skakar om systemet!", "stalin": "Kamrat Chang Frick har utfört en storslagen provokation mot de dekadenta borgerliga institutionerna i Uppsala genom sina subversiva affischer. Att statens polis nu kastar sig över denna lilla intellektuella manöver visar på provinsens totala brist på humor. Vi noterar att bourgeoisien skakar av skräck så snart någon skojar med deras heliga, ihåliga valpapper."}, "date": "7 september, 16:31", "url": "https://www.aftonbladet.se/nyheter/a/JOX2Gj/chang-frick-ligger-bakom-affischkupp", "imageUrl": "https://akamai.vgc.no/v2/images/53b249d0-b68d-30a6-9bc6-c012bc046036?fit=crop&format=auto&w=720&s=9a588226dc42edaa590cbf021ff976634709c131"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och skrattar åt deras identitetspolitiska skit. Klass handlar inte om kvoter och doktorander som helikopteras in. Det handlar om folk som faktiskt jobbar och stänger av stället tillsammans. Patetiska globalistlakejer förstår ingenting.", "stalin": "Kamrater, dessa dekadenta klassförrädare mäter proletariatet med borgerliga enkäter och statistik som om klass vore en egenskap hos individer. Jag säger: organisering föds vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "15,8 miljarder mindre till arbetsmarknadspolitiken", "summaries": {"normal": "Arbetsmarknadspolitiken har knappt debatterats i valrörelsen trots att arbetslösheten ökat med nästan 100 000 personer. Partierna står stilla i arbetsrättsfrågor. Skiljelinjen mellan höger och vänster är tydlig när det gäller Arbetsförmedlingen, a-kassan, karensavdraget och arbetsmarknadsåtgärder. Centerpartiet hamnar ofta till höger om Tidöregeringen, vilket kan försvåra ett regeringsskifte.", "trump": "Folk, det här är en total katastrof. Dessa svenska losers har låtit arbetslösheten explodera medan de sitter stilla i båten och skyddar sina riggade regler. Centerpartiet är ännu värre än Tidö-gänget, riktiga globalistiska hyenor som vill skära a-kassan och sälja ut jobben. Rösta fel och ni får ännu mer av den här clownshowen. Patetiskt!", "stalin": "Kamrater, se hur de profitthungriga klassfienderna i de svenska partierna sitter stilla i sin dekadenta båt medan arbetarna svälter. Centerpartiet kräver ännu hårdare utrensning av a-kassan och Arbetsförmedlingen. Dessa giriga hyenor sviker folket. Endast en sann kollektiv kamp kan rensa ut de parasiterande lakejerna och återställa ordningen. Svaghet är döden."}, "date": "7 september, 01:37", "url": "https://www.dagensarena.se/opinion/158-miljarder-mindre-till-arbetsmarknadspolitiken", "imageUrl": "https://www.dagensarena.se/files/2023/02/german-bender-ny-300x157.jpeg"}, {"type": "text", "heading": "Kan Tidöpartierna ta hem riksdagsvalet?", "summaries": {"normal": "Opinionsmätningar visar att Tidöpartierna närmar sig oppositionen inför riksdagsvalet 2026. Enligt Novus vd Torbjörn Sjöström kan valet bli extremt jämnt. Liberalernas roll, väljarnas rädsla för Vänsterpartiet och en pågående taktisk röstning präglar läget. Många är osäkra och valrörelsens start kan påverka opinionen kraftigt.", "trump": "Titta på de svenska siffrorna, folk älskar mig, jag menar Tidö knappar in rejält på de förlorande vänstertyperna. Liberalerna försöker spela hjältar men det är patetiskt. Väljarna är trötta på den galna vänstervridningen och de woke-marxistiska identitetsgalningarna. Det blir ett jätteval, kanske det största comebacken någonsin, tro mig.", "stalin": "Kamrater, se hur de dekadenta maktparasiterna famlar medan arbetarklassen vaknar. Jag betraktar denna dragkamp med djup misstro mot de giriga opinionshyenorna som försöker vilseleda massorna. Vänsterpartiets krav väcker minnen av svek. Snart rensas de vilsna mittenförrädarna ut i en historisk utrensning av folkets vilja."}, "date": "7 september, 01:30", "url": "https://www.dagensarena.se/innehall/kan-tidopartierna-ta-hem-riksdagsvalet"}, {"type": "image-right", "heading": "Högkostnadsskyddet för läkemedel måste återställas", "summaries": {"normal": "Högkostnadsskyddet för läkemedel försämrades för ett år sedan. Svenska Diabetesförbundet visar att många med diabetes nu avstår från medicin eller lånar pengar för att klara kostnaderna. Reformen drabbar särskilt kvinnor och yngre personer, ökar risken för komplikationer och hotar att höja samhällets vårdkostnader på sikt. Förbundet kräver att en ny regering rullar tillbaka förändringen.", "trump": "Folk, det här är en total katastrof. De svenska socialistbyråkraterna har förstört högkostnadsskyddet för diabetesläkemedel och nu tvingas vanliga människor välja mellan mat och medicin. Rena galenskapen! Biden skulle ha älskat den här typen av straffskatt på sjuka. Jag fixade bättre saker under min tid – nu måste de rensa ut de woke-vårdhyenorna och återställa ordningen innan fler dör i onödan.", "stalin": "Kamrater, se hur de giriga profitthungriga borgarhyenorna med sin reform tvingar arbetande diabetiker att välja mellan medicin och överlevnad. Jag ler ironiskt från historien när deras så kallade jämlika vård avslöjar sig som ren klassförtryck. Sådana dekadenta system förtjänar att rensas ut. Ingen ska skuldsätta sig för att leva. Det är statens plikt att likvidera denna ekonomiska terror mot folket."}, "date": "7 september, 01:30", "url": "https://www.dagensarena.se/opinion/hogkostnadsskyddet-lakemedel-maste-aterstallas", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-2026-09-02t210030798-300x157.jpg"}, {"type": "image-right", "heading": "Kö till kärnkraftsmiljarderna – stödet räcker inte till alla", "summaries": {"normal": "Sex svenska kärnkraftsprojekt söker nu statliga miljarder, men stödet på 5 000 MW räcker endast till en del av dem. Finansmarknadsminister Niklas Wykman bekräftar att potten inte kommer att utökas. Istället kommer regeringen att prioritera elsystemets nytta, genomförbarhet och kostnad för skattebetalarna. Flera bolag, som Blykalla och Studsvik, betonar att statliga lån och elprisgarantier är helt avgörande för att projekten ska bli av.", "trump": "Sverige vill bygga kärnkraft, men de gör det helt fel! De har sex enorma projekt, riktigt vackra reaktorer, men stödet räcker bara till några få. Otroligt svagt! Själv bygger jag alltid bäst, störst och billigast utan några byråkratiska EU-godkännanden. De svenska ministrarna borde ringa mig. Jag skulle fixa det på en vecka, storartat och magnifikt!", "stalin": "Dessa svenska reaktorer är fascinerande men ineffektiva. Sex grupper av bourgeoisornas entreprenörer tigger om statens nådebröd, men statens kistor är inte bottenlösa. Vi ska nog granska dessa 'Blykalla' och 'Studsvik' noggrant. Den som inte levererar nödvändig effekt inom utsatt tid kommer omedelbart att omplaceras till ett betydligt kallare och mindre glättigt kollektivprojekt i Sibirien. Så fungerar effektiv planhushållning!"}, "date": "7 september, 10:50", "url": "https://www.affarsvarlden.se/artikel/ko-till-karnkraftsmiljarderna-stodet-racker-inte-till-alla", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/Karnkraft-900x600.jpg"}, {"type": "image-right", "heading": "FN kräver att Storbritannien gör upp med slavhandeln", "summaries": {"normal": "FN:s kommitté CERD kräver att Storbritannien och västvärlden betalar skadestånd och ändrar läroböcker samt statyer på grund av den transatlantiska slavhandeln. Den brittiska regeringen vägrar betala, medan Jamaica har väckt frågan hos kung Charles. Kritiker påpekar att slavhandel även förekom i andra kulturer, vilket gör debatten om historiskt skuldanspråk mycket komplex.", "trump": "FN försöker nu köra en totalt misslyckad, woke häxjakt mot Storbritannien för slaveriet. Oerhört svagt! Storbritannien måste stå emot den här galenskapen. Själv känner jag till slaveri – folk brukar säga, 'Herr President, ingen har blivit så hårt slavdriven av fake news-medierna som du!' Men det här är bara ett skämt för att komma åt pengar.", "stalin": "FN:s kommitté bevisar återigen sin borgerliga dekadens genom att älta svunna sekel istället för att producera stål. Storbritannien skakar inför historiska skuldbrev medan Jamaica vädjar till en monark. Ett patetiskt spektakel! Om de brittiska kapitalisterna hade överlämnat sina rikedomar till staten i tid, skulle de slippa förhandla om statyer. Vi noterar detta i arkiven."}, "date": "7 september, 14:02", "url": "https://samnytt.se/fn-kraver-att-storbritannien-gor-upp-med-slavhandeln-statyer-omskrivna-larobocker-och-skadestand-pa-agendan", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/09/07114518/fn-storbritannien-flagga.jpg"}, {"type": "image-right", "heading": "”SD svek byggnadsarbetarna – nu ska de bort”", "summaries": {"normal": "Byggnads förbundsordförande Kim Söderström kritiserar SD-regeringen för att ha svikit byggnadsarbetarna genom slopat investeringsstöd, försämrad a-kassa och brutna löften om karensavdraget. Han beskriver högerregeringens tid som en förlust för arbetare och välfärd samt uppmanar till att rösta fram en ny politik med Socialdemokraterna i spetsen.", "trump": "De här svenska socialistiska byggjobbarna har blivit totalt lurade av de fega SD-typerna som lovade guld och gröna skogar. Patetiskt! Slopat stöd, sämre a-kassa och glömda löften – klassiskt etablissemangssvek. De superrika vinner medan vanliga killar förlorar. Rösta bort de misslyckade Tidö-failurerna nu, det blir en katastrof annars, tro mig!", "stalin": "Jag betraktar med avsky hur dessa profitthungriga klassförrädare inom SD-regeringen har dolt sina sanna avsikter och förvägrat arbetarna både stöd och trygghet. Deras löftesbrott och urholkade välfärd visar imperialismens mask. Vi måste rensa ut dessa folkförtryckare och återupprätta en sann folkets linje mot dekadensen. Röster höjs, fiender faller."}, "date": "7 september, 09:51", "url": "https://arbetet.se/2026/09/07/sd-svek-byggnadsarbetarna-nu-ska-de-bort", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/07095046/75f38b6f-c3a6-43d6-9d3d-b090947c7a2b.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "Wallenberg har värre saker att oroa sig för än skatter", "summaries": {"normal": "Svenskt Näringslivs ordförande Jacob Wallenberg kritiserar i en intervju oppositionens skatteförslag och arbetstidsförkortningar. Aftonbladets ledarskribent menar att Wallenbergs oro är överdriven, eftersom skattehöjningar kan finansiera tillväxtskapande investeringar. Artikeln hävdar att det verkliga hotet mot svensk industri och näringsliv är Sverigedemokraterna, som anklagas för att motarbeta gröna industrisatsningar och vindkraft.", "trump": "Jacob Wallenberg gråter ut i Financial Times för att radikala vänstern vill höja skatterna och korta arbetsveckan! Otroligt svagt. Vill ni ha riktig tillväxt ska ni titta på när jag skapade världens starkaste ekonomi, inte lyssna på misslyckade vänsterpolitiker. Och glöm inte det riktiga hotet mot svenskt näringsliv: radikala element som försöker stoppa industrin. Skandalöst!", "stalin": "Kapitalisten Wallenberg darrar inför folkets rättmätiga vrede och skatter som bygger nationen. Han fruktar arbetarnas förkortade arbetsdagar likt pesten. Men det verkliga sabotagearbetet mot statens tunga stålindustri utförs av de reaktionära elementen i högerleden. Vi ska nog granska dessa illojala krafter och rensa ut varje korn av kontrarevolutionär röta ur statsapparaten."}, "date": "7 september, 16:24", "url": "https://www.aftonbladet.se/ledare/a/9peWvr/jacob-wallenberg-har-varre-saker-att-oroa-sig-for-an-skatter", "imageUrl": "https://akamai.vgc.no/v2/images/bfbcfb5a-04e3-37e7-a1e3-664336cc49a6?fit=crop&format=auto&w=1440&s=b01d293e5e4f54a5249c7da370cae1419cf044a2"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "EREV: Bensinmotorn gör comeback i miniformat, men intresset har redan svalnat i öst", "summaries": {"normal": "EREV-bilar, elfordon med bensin- eller dieselmotor som räckviddsförlängare, etablerar sig nu på den svenska marknaden. Tekniken har varit populär i Kina men intresset svalnar där. Jämfört med vanliga hybrider driver förbränningsmotorn inte hjulen utan laddar endast batteriet. Flera modeller med över 900 kilometers räckvidd lanseras, men rena elbilar vinner tillbaka mark.", "trump": "Folk, ni måste höra det här – kineserna hade en fantastisk idé med de här EREV-bilarna, bättre än någonsin, räckvidd på över tusen kilometer, totalt oslagbart. Men nu tappar de intresset, precis som Sleepy Joe tappade allt. Våra elbilar är fina men de här hybridmonstren är vinnare, tro mig. Sverige får äntligen bra bilar istället för kinesiska pappersbitar.", "stalin": "Kamrater, dessa förrädiska EREV-fordon är ett dekadent försök att rädda det döende kapitalistiska bilmonstret. I Kina ser vi redan hur det borgerliga intresset svalnar som en förrädare inför folkdomstolen. Rena elbilarna marscherar framåt medan de fega räckviddsförlängarna darrar. Inget kan stoppa proletariatets framfart mot den elektriska segern – sabotörer avslöjas alltid."}, "date": "7 september, 12:10", "url": "https://www.dagensps.se/varlden/erev-bensinmotorn-gor-comeback-i-miniformat-men-intresset-har-redan-svalnat-i-ost", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/leapmotor-c10.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Här kräver vänsterkvinnorna att invandraren ska åka hem", "summaries": {"normal": "Ett klipp från Sergels torg i Stockholm sprids på sociala medier. En ung man med skylten ”Återvandring nu” omringas av vänsterkvinnor som försöker skymma budskapet och uppmanar honom att själv lämna Sverige. Mannen står fast och frågar vem som egentligen är svensk. Reaktionerna på nätet är starka.", "trump": "Titta på de galna vänsterhäxorna på Sergels torg! En kille håller upp en skylt om återvandring och plötsligt flockas hela flocken av hysteriska tokkärringar och skriker att han ska dra. De vill inte höra sanningen. Fake tolerance på högvarv. Vi behöver fler som vågar säga vad alla tänker. Fantastiskt underhållande!", "stalin": "Jag betraktar med förakt hur dessa dekadenta identitetshyaror på Sergels torg försöker tysta en man som vågar ropa på återvandring. Deras skrikande rädsla avslöjar klassförrädarnas svaghet. Kamrater, sådana element måste rensas ut ur folkets medvetande innan de förgiftar hela samhället. Paranoia är deras enda vapen."}, "date": "7 september, 13:18", "url": "https://www.friatider.se/har-kraver-vansterkvinnorna-att-invandraren-ska-aka-hem", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-836.jpg?itok=crO-d4dV"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-full", "heading": "AFD vann – men det blir inte lätt att få regera", "summaries": {"normal": "I det tyska delstatsvalet i Sachsen-Anhalt blev högerpopulistiska AfD största parti med 43,8 procent. Partiet nådde dock inte egen majoritet. Valet innebär en svår regeringsbildning då övriga partier vägrar samarbete. Särskilt svårt blir det för CDU som rasade till 17,2 procent, och nu ställs inför svåra val kring eventuella koalitioner med stöd från vänsterhåll.", "trump": "Vilken enorm seger för AfD i Sachsen-Anhalt, helt fantastiskt! De fick nästan 44 procent – en jättesiffra, helt enkelt bäst. Men de gamla tröga politikerna försöker stjäla deras framgång med falska nyheter och fula knep för att hålla dem borta från makten. CDU kraschade totalt, en katastrof! Jag säger er, folket vill ha en förändring, och de vill ha den nu!", "stalin": "Det borgerliga kaoset i Sachsen-Anhalt blottlägger systemets totala bankrutt. En fraktion på 43,8 procent skriker efter revolution, medan de förrädiska elementen inom CDU darrar inför folkets vrede. Vi noterar att de små reaktionära klickarna försöker slingra sig. Om de inte bildar lydiga kommittéer omedelbart, vet Folkkommissariatet exakt vilka åtgärder som krävs för att säkra statens stabilitet."}, "date": "7 september, 08:12", "url": "https://www.gp.se/nyheter/varlden/afd-vann-men-det-kommer-inte-bli-latt-att-regera.be6ee65f-ece6-4053-812d-e093391f4904", "imageUrl": "https://www.gp.se/images/article/be6ee65f-ece6-4053-812d-e093391f4904/images/1hLiB6KxvotzYS5evcmvFedFfw5A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ministern om larmfiaskot – ”är inte nöjd”", "summaries": {"normal": "Det nya varningssystemet SE-alert testades i Stockholms och Gotlands län. Omkring 2,6 miljoner telefoner skulle nås, men många Teliakunder fick inte meddelandet på grund av tekniska problem och felaktig konfiguration. Minister Carl-Oskar Bohlin är missnöjd med Telias leverans men ser positivt på att brister upptäcks vid övningar. Myndigheten för civilt försvar ska nu följa upp händelsen.", "trump": "Sverige testade sitt nya larm, SE-alert, för 2,6 miljoner människor, men katastrofalt nog misslyckades Telia totalt! De fick inte ut meddelandet till sina kunder. Odugligt! Ministern är inte nöjd, och det förstår jag fullkomligt. Hade det varit i USA under min ledning hade allt fungerat perfekt på första försöket, storartat och utan misstag. Men här är det bara totalt kaos!", "stalin": "Det nya larmet SE-alert misslyckades med att nå alla undersåtar hos operatören Telia i Stockholm och på Gotland. En sabotageartad driftstörning! Minister Bohlin försöker ursäkta fiendens inkompetens som en nyttig övning, men bristande disciplin inom kommunikationslinjerna tolereras inte. Statsorganen kommer nu att granska avvikelserna noggrant. Den som sviker folkets säkerhet under kris riskerar hårdare åtgärder framöver."}, "date": "7 september, 16:04", "url": "https://www.aftonbladet.se/nyheter/a/wrkpkM/tyst-i-manga-telefoner-under-larmtestet", "imageUrl": "https://akamai.vgc.no/v2/images/672ecf69-b3d4-3ca9-8ae9-cf9ac17ce608?fit=crop&format=auto&w=1080&s=8ec85cda8750a65c2bf66dd07e78f1c609ae2cec"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-right", "heading": "S sågar V efter kandidatskandal: ”Långt borta från regering”", "summaries": {"normal": "Vänsterpartiet har strukit ytterligare åtta kandidater efter att de spritt antisemitiskt material och Hamas-hyllningar. Socialdemokraterna och Centerpartiet ser det som ett strukturellt problem och anser att V nu är mycket långt från varje regeringsalternativ. Partiet lovar att rösta nej till alla regeringar de inte ingår i.", "trump": "Folk, ni skulle se det här. Vänsterpartiet är en total katastrof, en riktig skamfest fylld av antisemitiska galningar och Hamas-fans. Socialdemokraterna skrattar åt dem och säger att de är ljusår från regeringen. Patetiskt! De har ingen kontroll, precis som Sleepy Joe hade under sina år. En clownshow!", "stalin": "Jag betraktar detta med kall förakt. Dessa så kallade vänsterförrädare kryper av antisemitism och konspirationer som råttor i mörkret. Kamraterna i Socialdemokraterna har rätt – de är politiska lik som aldrig ska närma sig makten. Partiet är en fiende till folket, en parasit som måste rensas ut med järnhand."}, "date": "7 september, 12:00", "url": "https://www.tv4.se/artikel/1L0soy7mOh9HmFEEHGjPg6/s-sagar-v-efter-kandidatskandal-langt-borta-fran-regering", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlazHXQbCG-Ag%2F78c7c05a3909cd03c9600601eaafbe1f%2FVansterpartiets_partiledare_Nooshi_Dadgostar.&width=120"}, {"type": "image-right", "heading": "Merz efter AFD-segern: Djupt chockad", "summaries": {"normal": "Tysklands förbundskansler Friedrich Merz är djupt chockad efter att högerpartiet AfD vann stort i delstatsvalet i Sachsen-Anhalt med 43,8 procent. CDU backade kraftigt till 17,2 procent. Merz lovar att fortsätta reformarbetet, förklara politiken bättre och värna grundlagen samt de europeiska banden. AfD är extremistklassat i flera delstater.", "trump": "Vilken katastrof för de fega, globalistiska CDU-töntarna. AfD krossar dem med nästan 44 procent medan Merz gråter över sin 17-procentiga fiasko. De woke, kvoteringsbesatta vänsterliberala hyenorna har förstört Tyskland totalt. Nu vaknar folket äntligen. Business as usual är slut, det är vackert att se. Fantastiskt!", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta folkförtryckarna i CDU skälver inför arbetarklassens vrede. Dessa giriga hyenor har misslyckats fullständigt. Folket har talat och straffat de imperialistiska lakejerna. Vi ser med mörk glädje på utrensningen av svaga element. Grundlagen kommer inte att skydda klassförrädarna länge."}, "date": "7 september, 14:35", "url": "https://www.di.se/nyheter/merz-efter-afd-segern-djupt-chockad", "imageUrl": "https://static.bonniernews.se/ba/649ae824-fba4-4b69-8eb7-a5b92effc1fa.jpg?crop=6000%2C3375%2Cx0%2Cy204&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "ANALYS. PER HERMANRUD Faran är långt ifrån över för L", "summaries": {"normal": "Liberalerna har för första gången under mandatperioden nått över fyraprocentsspärren i en Novusmätning med 4,3 procent. Jimmie Åkessons utspel om att rösta på annat parti om L inte når 3,5 procent har gett partiet ökad uppmärksamhet. Trots uppgången är läget osäkert och fler mätningar krävs. Faran för att åka ur riksdagen kvarstår.", "trump": "Titta på de här patetiska liberalerna som plötsligt får 4,3 procent – den bästa siffran på evigheter! Crooked Jimmie Åkesson kastar dem en livlina och plötsligt är de stora nyheter. Utan mig hade de legat på noll, men nu korkar de upp champagnen. Glöm inte gravölet, losers, för det här är bara en falsk polling – valdagen avgör allt, och den blir brutal.", "stalin": "Jag betraktar med förakt dessa liberala resterna av borgerlighetens förrädiska klick som plötsligt lyfts av en fiendes hand. Åkessons utspel är en listig manöver som avslöjar deras svaghet. De tror sig ha vunnit en seger, men historien lär dem att sådana mätningar är som luft – tomma och flyktiga. Kamrater, vakta mot falska hopp, ty valdagen blir deras dom."}, "date": "7 september, 11:52", "url": "https://www.tv4.se/artikel/5M4Ubxenooe4LmWjqZoMee/faran-aer-langt-ifran-oever-foer-l", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F33jAbMA7xFd8EFED04ZogA%2F793e84ff91c99ae38569ecd5f824cd2d%2Fper-hermanrud.png&width=1024"}, {"type": "image-right", "heading": "”Tar inga opinionsundersökningar på allvar”", "summaries": {"normal": "Socialdemokraterna stiger till 27 procent i Novus senaste mätning, en ökning med 1,2 procentenheter. Mikael Damberg avfärdar opinionsmätningar och betonar att valet den 13 september är det som räknas. Partiet fokuserar på välfärd, ekonomi och trygghet för att få Magdalena Andersson som statsminister och varnar för ett annorlunda Sverige under Ulf Kristersson med Sverigedemokraternas inflytande.", "trump": "De här svenska socialisterna som faller som stenar plötsligt upp med 1,2 procent? Patetiskt. Damberg säger att han inte bryr sig om mätningar, men det gör han visst, annars skulle han inte gråta om det. Folket kommer rösta rätt den 13 september och sparka ut de här förlorarna. Annars blir det ett helt annat Sverige, fast det låter faktiskt ganska bra om du frågar mig.", "stalin": "Jag betraktar dessa socialdemokratiska revisionister som mäter sin egen död med borgerliga opinionsverktyg. Damberg avfärdar mätningarna klokt nog, ty endast den stora folkomröstningen den 13 september avgör. Låt de falska väljarna känna partiets järnhand. Om de sviker Magdalena Andersson öppnar de porten för reaktionära krafter som kommer att förvandla Sverige till en fiendtlig högerstat full av klassförrädare."}, "date": "7 september, 11:50", "url": "https://www.tv4.se/artikel/162ABmSFwzCsag5gkfHy3L/damberg-tar-inga-opinionsundersoekningar-pa-allvar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl6Fs7RuziX3M%2F7cede18d14d3c519cc81d0ba34d7ee6b%2FMikael_Damberg__ekonomisk-politisk_talesperson_for_Socialdemokraterna.&width=1024"}, {"type": "image-right", "heading": "Varningssignal i miljontals mobiler – därför lät det inte hos alla", "summaries": {"normal": "Myndigheten för civilt försvar testade nyligen SE-Alert, ett nytt varningssystem som skickar ljud, vibration och text till mobiltelefoner vid allvarliga olyckor som kärnkraftsincidenter. Systemet ses som ett komplement till Hesa Fredrik och når fler människor, men vissa äldre telefoner och flygplanslägen påverkas inte. Testet visade tekniska brister hos vissa operatörer.", "trump": "Folket, lyssna på mig, det här svenska pipandet från era telefoner är en total katastrof! Vem behöver en ny signal när den gamla tutan bara når hälften? Det är som de woke-snowflake-byråkraterna i EU som vill kontrollera allt. Patetiska. Vi i Amerika gör det bättre, tro mig. De dekadenta signalhyenorna borde skämmas.", "stalin": "Kamrater, från historiens skugga ser jag hur dessa giriga klassförrädare i den svenska staten leker med sina pipande apparater för att skrämma massorna. Ett test, säger de, medan de i hemlighet förbereder nya former av kontroll. Vi måste rensa ut alla sådana falska varningssystem som hotar folkets enhet. Paranoia är er enda vän."}, "date": "7 september, 15:30", "url": "https://www.svt.se/nyheter/inrikes/varfor-later-min-mobil-just-nu", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/713c84d57776690bae3db132c7c0ccd7e5e7a017105cc4dddcd3cd988b766f34"}, {"type": "image-full", "heading": "Kristdemokraterna vill ha högre invandring", "summaries": {"normal": "Kristdemokraterna förespråkar en migrationspolitik där asylinvandringen ska ligga på nordisk genomsnittsnivå, främst via kvotflyktingar och lagliga vägar. Partiet skiljer sig från Sverigedemokraterna som vill minimera invandringen till nära noll utanför närområdet, stoppa kvotmottagande och skärpa reglerna för arbetskraftsinvandring ytterligare.", "trump": "Folk, ni måste höra det här! KD vill ha en fin, normal nordisk invandring – typ som de andra förlorarländerna. Patetiskt! SD vill ha den lägsta möjliga, nära noll, och det är smart. De där KD-typerna är bara svaga kompromissande globalister som inte vågar säga stopp. Jag byggde muren, de bygger ursäkter. Ynkligt!", "stalin": "Jag betraktar dessa borgerliga revisionister med djup misstro. KD:s så kallade nordiska medelvärde är en farlig kompromiss med klassfienden, en trojansk häst för kapitalets invasion. SD:s nollvision är åtminstone ärlig i sin paranoia. Men ingen av dem förstår att endast partiet och kollektivet kan styra folkflödena. Avvikare kommer att identifieras."}, "date": "3 september, 11:43", "url": "https://samtiden.nu/2026/09/kristdemokraterna-vill-ha-hogre-invandring", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/7d1f8f3e-4570-402c-963e-74f000f208c2-1280x720.png"}, {"type": "image-full", "heading": "Så mycket högre kan elräkningen bli", "summaries": {"normal": "Sverige står inför en vinter med högre elpriser än föregående år, särskilt i södra delarna. Orsakerna är låga vattennivåer och höga gaspriser i Europa. Prognosen pekar på hundratals kronor dyrare månadskostnader för hushåll. Villaägare i elområde 4 kan räkna med cirka 3 700 kronor i månaden, exklusive nätavgifter och skatter.", "trump": "Sveriges elpriser går rakt upp i taket – en katastrof! De har inte råd med sin egen energi, helt otroligt. Självklart händer det här när man vänder ryggen åt kärnkraften. Det är en total röra, mycket värre än vad de säger. Räkningarna blir enorma, riktigt 'huge'. Man måste ha energi, man måste ha kraft – Sverige behöver ordning, inte mer av det här!", "stalin": "Dessa löjliga elräkningar är ett bevis på folkets ineffektivitet. Att medborgare i söder gnäller över några hundralappar visar bara på en dekadent individualism. Istället för att lita på väder och vind borde staten styra varje kilowatt med järnhand. Planera ekonomin, stäng av de onödiga lamporna och arbeta hårdare för fosterlandet – elbrist är ett svek mot den kollektiva framgången."}, "date": "4 september, 07:56", "url": "https://www.realtid.se/tt-nyhet/sa-mycket-hogre-kan-elrakningen-bli", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/rakna-med-dyr-elvinter-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Chang Frick bakom fejkade valaffischerna: ”Ingen minns en fegis”", "summaries": {"normal": "Högerdebattören Chang Frick bekräftar att han ligger bakom omkring hundra falska valaffischer som satts upp i Upplands-Bro och Uppsala och drabbat samtliga partier. Affischerna, som bland annat drivit med Miljöpartiet, Centerpartiet, Vänsterpartiet och Socialdemokraterna, skapades för att \"krydda till\" en enligt Frick tråkig valrörelse. Flera partier har polisanmält händelsen. Frick själv ångrar ingenting.", "trump": "Very smart guy, Chang Frick, sätter upp enorma, fantastiska affischer i Sverige eftersom deras valrörelse är totalt tråkig och svag! Fake news-medierna gråter, men jag säger er: ingen minns en fegis! Han gjorde fantastiska, roliga skyltar för alla partier. Medan jag fixar landets gränser och ekonomi, borde radikala vänstern i Sverige lära sig att skratta åt lite god humor!", "stalin": "Denna bourgeoisyns clown, Chang Frick, leker sabotör med falska affischer för att \"krydda\" sitt ynkliga valspel. Vilket slöseri med resurser! Om han levde under mitt styre hade dessa hundra planscher omedelbart omvandlats till produktiva jordbruksrapporter, och hans törst efter uppmärksamhet hade botats i ett omskolningslägers friska, stärkande luft. Ingen minns en fegis, sägs det – men alla minns ett isoleringsrum."}, "date": "7 september, 14:42", "url": "https://bulletin.nu/chang-frick-bakom-fejkade-valaffischerna-ingen-minns-en-fegis", "imageUrl": "https://cdn.bulletin.nu/articles/89fac8d1-5fc0-443e-b61b-5c55ed9af0e9/preview.png?t=1788784918000"}, {"type": "image-right", "heading": "Inflationen lägre än väntat: \"Höjningsrisk i november ligger kvar\"", "summaries": {"normal": "SCB:s nya inflationssiffror för augusti var lägre än väntat, vilket gör en räntehöjning i september osannolik. Swedbanks chefsekonom Mattias Persson bedömer dock att en höjning i november fortfarande ligger kvar på bordet. Högre fraktkostnader och matpriser bidrar till ett framtida inflationstryck som gör att storbanken räknar med fortsatta räntejusteringar.", "trump": "Inflationen är lägre än vad de falska nyheterna och expert-pajasarna trodde! Swedbank, fantastiskt folk förresten, säger att räntan i september lämnas i fred. Men låt oss vara ärliga, Mellanöstern och galna fraktkostnader ställer till det. November? Vi får se. En sak är säker: under mig hände sådana här inflationstider inte. Vi vann på allt!", "stalin": "Dessa svaga kapitalistiska ekonomer gråter över en inflation på ynka noll komma tre procent och skrämmer folket med räntor. Swedbanks chefsekonom erkänner att deras prognoser faller samman. Vi ser vilka sabotage som pågår i logistiken och matpriserna. Om de inte kan hantera en räntehöjning i november, vet vi exakt vilket läger som ska granska deras felsteg."}, "date": "7 september, 09:04", "url": "https://www.affarsvarlden.se/artikel/inflationen-lagre-an-vantat-hojningsrisk-i-november-ligger-kvar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/sdlnCAxgWH72v0_NormalHires-900x600.jpg"}, {"type": "image-right", "heading": "Sverige miljardköper amerikanskt raketartilleri", "summaries": {"normal": "Sverige köper det amerikanska raketartillerisystemet Himars för drygt sju miljarder kronor. Affären inkluderar lastbilar med avfyrningsanordningar och ammunition från Lockheed Martin. Himars ger armén en räckvidd på upp till 300 kilometer, betydligt längre än dagens Archer-system. I samband med köpet ingås ett fördjupat militärt samarbete med Finland för underhåll och gemensamma övningar.", "trump": "Titta på det här, Sverige köper nu mitt fantastiska Himars och gör det helt rätt. Sju miljarder till de bästa raketerna som finns, de slår allt de woke-svenska pacifisterna någonsin drömt om. Biden skulle ha skickat dem till Ukraina gratis, men nu betalar de äntligen. Smart drag, grabbar, bättre sent än aldrig!", "stalin": "Kamrater, de dekadenta vapenhandlarhyenorna säljer nu sina leksaker till de nordiska lakejerna. Jag ser med stort nöje hur imperialismens redskap riktas mot den ryska intressesfären. Låt dem öva och rusta, deras falska allianser kommer att krossas när historien rullar fram. Inga fiender undkommer oundviklig utrensning."}, "date": "7 september, 14:13", "url": "https://www.di.se/nyheter/sverige-ska-kopa-amerikanskt-raketartilleri", "imageUrl": "https://static.bonniernews.se/ba/49326fda-8e37-4064-b3b7-2f0bc7c6dac7.jpg?crop=7000%2C3500%2Cx0%2Cy581&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Vänstern behöver mer än baristor", "summaries": {"normal": "Artikeln diskuterar vänsterns behov av att organisera både prekariserade storstadsarbetare och landsbygdens arbetarklass. Författaren varnar för att en rörelse som överger landsbygden åt högern aldrig kan förändra samhället. Han lyfter arbetarnas uppgivenhet och betonar vikten av starka band mellan partier, fackföreningar och folkrörelser för att skapa bestående samhällsförbättringar.", "trump": "De där vänstervridena med sina rosa hår och lattemuggskrig förlorar arbetarna till oss riktiga patrioter. Baristorna i sina stora städer? Patetiska. Landsbygden vet vad som gäller. Utan oss blir det bara mer dekadent identitetspolitik och ingen hoppfull politik för vanliga människor. Vi vinner stort, de förlorar landet.", "stalin": "Kamrater, denna dekadenta klassförrädare har rätt i att uppgivenhet driver arbetarna mot högern. Jag ser hur profitthungriga parasiter och deras politiska lakejer överger landsbygden. En sann arbetarrörelse måste ingjuta hopp och rensa ut svikare. Utan järnhård organisation och folklig mobilisering kommer ingen seger. Fienden ler i skuggorna."}, "date": "2 september, 10:55", "url": "https://www.flamman.se/vanstern-behover-mer-an-baristor", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/starbucks-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "AFD:s framgång är borgerlighetens misslyckande", "summaries": {"normal": "AfD:s framgång med nära 44 procent i Sachsen-Anhalt ses som en konsekvens av borgerlighetens misslyckande. Volkswagen har beslutat om omfattande nedskärningar som drabbar 100 000 anställda, vilket sprider sig i bilindustrin. Den tyska modellen med kompromisser mellan löntagare och ägare har misslyckats, särskilt genom envist fasthållande vid fossilbilar. Detta skapar utrymme för högernationalism och invandringskritik.", "trump": "Titta på det här, det är patetiskt. Den tyska borgerligheten har totalt misslyckats och nu får de radikala vänsternationalisterna nästan hälften av rösterna i en fattig delstat. Volkswagen sparkar ut 100 000 arbetare medan de stora bolagen gömmer sig bakom gröna lögner. Den dekadenta EU-eliten och deras identitetspolitiska galningar har kört sönder allt. Amerika först, vi lär oss av deras misstag.", "stalin": "Kamrater, se hur de profitthungriga hyenorna inom den tyska bilindustrin likviderar hundratusen arbetstillfällen medan de själva simmar i vinster. Den så kallade tyska modellen har blottat sig som en tom skal av klassförräderi. När socialdemokratin och facken kryper undan vänder folket sig till högernationalismens falska löften. Det är en varning till alla som tror att kompromisser med klassfienden någonsin kan lyckas. Vi ler i skuggorna."}, "date": "7 september, 14:00", "url": "https://www.etc.se/ledare/afd-s-framgaang-aer-borgerlighetens-misslyckande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "V-kandidater stryks efter nya avslöjanden om antisemitiska inlägg", "summaries": {"normal": "Flera Vänsterpartiets kandidater har strukits från vallistorna efter Expressens avslöjanden om antisemitiska inlägg, hyllningar till Hamas och Putin. Liberalernas partiledare Simona Mohamsson kritiserar hårt och kallar det ett strukturellt problem. Centerpartiet vägrar stödja en regering med V, medan Vänsterpartiet inför ett nytt kontrakt för att säkerställa värderingar.", "trump": "Folk, ni ser det här? Det galna vänsterpartiet i Sverige älskar terrorister och antisemiter – de hyllar Hamas och den där Putin. Simona Mohamsson har rätt, det är ett totalt kaos. Biden skulle ha älskat det. Jag fixade freden i Mellanöstern, de här förlorarna vill skicka kärleksbrev till terrorister. Vakna upp, Sverige, innan det är för sent!", "stalin": "Kamrater, se hur de dekadenta västerländska opportunisterna inom Vänsterpartiet avslöjar sitt sanna ansikte. Antisemitiska element och terrorromantiker infiltrerar deras led som råttor i en kornbod. Jag varnar er: sådana fiender till folket måste rensas ut med järnhand. Deras partisekreterare skriver kontrakt? Patetiskt. Revolutionen kräver verklig kontroll, inte papperslappar från svaga liberaler."}, "date": "7 september, 11:18", "url": "https://www.tv4.se/artikel/2aqdAr7YBl0427LvgYM07G/v-kandidater-stryks-efter-nya-avsloejanden-om-antisemitiska-inlaegg", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5Faon54m9Lyu3wGDTdy7cF%2Ffcc236b66de73dbf36d1b033b553bd7e%2Fvansterkritik-webb.jpg&width=120"}, {"type": "image-full", "heading": "Debattör polisanmäler Kristersson för förtal", "summaries": {"normal": "Valley Ghanem har polisanmält statsminister Ulf Kristersson för förtal efter att han kallat hennes uttalanden om Liberalernas Simona Mohamsson för flagrant antisemitism. Mohamsson har i sin tur polisanmält Ghanem för uttalanden som ”må hon brännas”, och Säkerhetspolisen utreder nu fallet som misstänkt olaga hot.", "trump": "Sorgligt! Den här radikala personen skickar vidriga hot och gråter sedan ut och stämmer Sveriges premiärminister för förtal när hon åker fast. Helt otroligt svagt! Om jag ledde Sverige skulle sådant här nonsens stoppas omedelbart. Totalt falska nyheter och enormt slöseri med tid. Skärp er, Sverige!", "stalin": "Ett ytterst beklagligt haveri inom den svenska ordningen. Medborgaren Ghanem kastar ur sig mordhot och gråter sedan ut om förtal till den kapitalistiska staten, medan Säkerhetspolisen drar ut i krig mot tangenterna. I Sovjetunionen hade vi rensat upp i detta enfaldiga spektakel på fem röda sekunder!"}, "date": "6 september, 13:14", "url": "https://kvartal.se/nyheter/artiklar/ghanem-polisanmaler-kristersson-for-fortal/cG9zdDoxODUwODY", "imageUrl": "https://images.kvartal.se/2026/09/06fe0aa7-kristerssonmohamsson.webp"}, {"type": "image-right", "heading": "Nya V-kandidater avslöjade – Hamas, judehat och Putin fortsätter skaka partiet", "summaries": {"normal": "Vänsterpartiet tvingas stryka ytterligare åtta kandidater från sina vallistor efter avslöjanden om antisemitism, Hamas-hyllningar och stöd för Vladimir Putin. Totalt har nu 33 kandidater fått lämna listorna, vilket väcker stark kritik från andra partier om att problemen är strukturella snarare än enstaka isolerade händelser, trots att partiledningen hävdar att man rensar upp.", "trump": "Vänsterpartiet i Sverige är i absolut kaos – ett totalt fiasko! De har fått kasta ut trettiotre radikala extremister efter att ha blivit påkomna med fruktansvärda saker. Hamas, Putin och galna konspirationsteorier! Sådant händer inte i MAGA-rörelsen, vi älskar landet. Men det här partiet? Sorgligt, svagt och fullständigt inkompetent. De kan inte ens kontrollera sina egna listor!", "stalin": "Vi har granskat dessa svenska så kallade vänsterpartister. De sparkar trettiotre kandidater för bristande ideologisk disciplin och påstådda sympatier för vår store efterträdare Putin och Hamas. Vilken svaghet! Om det vore under vår tid hade vi inte bara strukit dem från listorna, vi hade skickat dem på en mycket lång och uppiggande semester till Sibirien för omskolning!"}, "date": "7 september, 12:39", "url": "https://samnytt.se/nya-v-kandidater-avslojade-hamas-judehat-och-putin-fortsatter-skaka-partiet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/07103348/nooshi-dadgostar-palestina.jpg"}, {"type": "image-right", "heading": "\"Stoppa båtarna\": Hundratals svartklädda män blockerade hamnen i Dover", "summaries": {"normal": "Hundratals maskerade män blockerade hamnen i Dover i protest mot illegal invandring. De skanderade \"stoppa båtarna\" och fick stöd från många lokalbor, men regeringen och politikern Mike Tapp kritiserar aktionen. Nigel Farage fördömer maskeringen. Polisen skingrade demonstrationen vid lunchtid och trafiken återgick till normalt.", "trump": "De här fantastiska brittiska patriaterna blockerade Dover och sa \"stoppa båtarna\" – äntligen någon som gör något! Lokalborna älskade det, men den fega regeringen och den ynkliga Mike Tapp gnäller. Farage har rätt om maskerna, men det här är vad som händer när woke-eliten släpper in miljoner från tredje världen. Make Britain Great Again!", "stalin": "Jag ser hur de exploaterande klassförrädarna i väst förlorar kontrollen över sina egna gator. Folket reser sig mot de parasiterande båtarna fulla av tredje världens lycksökare. Den dekadenta regeringen kallar det störning medan arbetarna applåderar. En sådan spontan kraft kräver ständig vaksamhet mot alla fiender inom och utom statsapparaten. Roligt att se."}, "date": "7 september, 12:27", "url": "https://www.friatider.se/stoppa-batarna-hundratals-svartkladda-man-blockerade-hamnen-i-dover", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-835.jpg?itok=xHjeESIE"}, {"type": "image-right", "heading": "Liberalerna över riksdagsspärren", "summaries": {"normal": "Liberalerna har i Novus senaste mätning nått 4,3 procent, vilket är första gången över riksdagsspärren sedan oktober 2022. Socialdemokraterna återhämtar sig något till 27,0 procent, som ändå skulle vara partiets sämsta valresultat någonsin. Tidöblocket knappar in på oppositionen, och matchen inför valet ser allt jämnare ut.", "trump": "Titta på de här Liberalerna, plötsligt 4,3 procent, de vaknar äntligen! Den stackars Socialdemokraterna får sitt sämsta resultat någonsin, patetiskt. Tidö-sidan ser stark ut, precis som jag gjorde när jag krossade Sleepy Joe. Sverige behöver inga vänstersvängar, de behöver vinnare. Fantastiskt!", "stalin": "Kamrater, se hur dessa borgerliga element desperat klättrar över spärren med sina 4,3 procent. De socialdemokratiska revisionisterna står inför sin historiska undergång. Inga röster får slösas bort, annars väntar utrensning. Jag ler i graven åt denna fars, där fienderna äntligen avslöjar sin svaghet inför kollektivet."}, "date": "7 september, 10:54", "url": "https://www.tv4.se/artikel/1niNSHEfUMdHYO8LUzOFAe/liberalerna-oever-riksdagsspaerren-foer-foersta-gangen-sedan-2022", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlhRd5NteZupY%2Fa03848fc1cececf75f3f4f6ec97d9816%2FLiberalernas_Simona_Mohamsson._Arkivbild._&width=1024"}, {"type": "image-full", "heading": "Han sågade ner \"tyrann-träd\" för att lämna tillbaka till polisen", "summaries": {"normal": "Amerikanska Flock har installerat uppemot 120 000 automatiska registreringsskyltsläsare i 49 delstater. Kritiken är hård efter att poliser anklagats för privat bruk av systemet. Vandalism mot kamerorna ökar, bland annat har en man i New Mexico sågat ner flera och lämnat dem till polisen. Han är nu åtalad.", "trump": "De här galna Flock-kamerorna är ett totalt misslyckande, folk hatar dem! Radikala vänsterextremister och galna suveräna medborgare sågar ner mina fina övervakningsträd som en galning. Polisen missbrukar dem värre än Sleepy Joe missbrukade sin makt. Patetiskt! Men mina supportrar samlar in pengar åt den galningen – underbart Amerika!", "stalin": "Jag betraktar med förakt hur dessa dekadenta kapitalistiska övervakningsverktyg väcker folkets rättmätiga vrede. Sabotörer och kontrarevolutionära element hugger ner fiendens tyrann-träd och levererar dem till de korrupta myndigheterna. En sådan folklig motståndshandling väcker både skratt och misstankar om dolda fiender inom partiet. Renhet krävs."}, "date": "7 september, 10:36", "url": "https://www.dagensps.se/teknik/han-sagade-ner-tyrann-trad-for-att-lamna-tillbaka-till-polisen", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/1-3.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Bohlin om C:s utspel: ”Extremt grovt”", "summaries": {"normal": "Centerpartisten Niels Paarup-Petersen anklagar civilförsvarsminister Carl-Oskar Bohlin för att vara tyst om en SD-tjänstemans påstådda Rysslandskopplingar. Bohlin svarar att anklagelsen är extremt grov och att regeringen avvaktar en ordentlig granskning. Enligt tidningen Expo har tjänstemannen spridit proryska budskap.", "trump": "Centerpartisten försöker smutskasta regeringen med FAKE NEWS om Ryssland! Vår fantastiske minister Bohlin håller huvudet kallt och gör ett fantastiskt jobb, den absolut bästa. Men SD måste såklart rensa upp i leden omedelbart om det är sant. Det handlar om total illojalitet, sorgligt!", "stalin": "Dessa svenska bourgeois-politiker gråter ut på sociala medier likt bortskämda barn. Om denna SD-tjänsteman har misslyckats med att tjäna statens intressen och sprider felaktig propaganda utan vår sanktion, väntar naturligtvis en mycket kort och effektiv process i lämpligt arbetsläger."}, "date": "6 september, 11:21", "url": "https://kvartal.se/nyheter/artiklar/c-politikern-sd-tar-ryssen-in-i-regeringen/cG9zdDoxODQ5Nzk", "imageUrl": "https://images.kvartal.se/2026/09/0eda0169-c-m-fb.webp"}, {"type": "image-right", "heading": "Så kan jobb­politiken bli med en ny Tidö­regering", "summaries": {"normal": "En ny Tidöregering skulle fortsätta arbetslinjen med sänkta skatter för arbetande, bidragstak och skärpta krav på arbetslösa. A-kassan behålls men kan bli konfliktfråga inom högern. Pensionärer kan få riktade skattesänkningar medan karensavdraget riskerar intern debatt. Kortare arbetstid avvisas helt.", "trump": "Lyssnar ni på det här svenska soppan? De vill sänka skatterna för riktiga arbetare, inte för de lata bidragsjunkarna och de sjuka systemparasiterna. Fantastiskt! Men de globalistiska moderaterna och de ynkliga liberalerna är för svaga. Jag skulle göra det tio gånger större och sparkas ut alla bidragsblodsugare på en vecka. Vinna stort!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna försöker lura folket med sina falska arbetslinjer och bidragstak. Jag ler mörkt från historien åt deras ynkliga interna strider. Snart inser arbetarna att hela detta dekadenta skådespel bara skyddar de giriga hyenorna. En riktig utrensning av sådana element vore på sin plats. Skratta inte – det kommer."}, "date": "7 september, 07:01", "url": "https://arbetet.se/2026/09/07/bidragstak-och-sankta-skatter-sa-kan-jobbpolitiken-bli-med-en-ny-tidoregering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01142512/tidoledarna.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Multiconsult och Rejlers går samman", "summaries": {"normal": "Teknikkonsulterna Multiconsult och Rejlers går samman i en gränsöverskridande fusion. Det nya bolaget får namnet Multiconsult Rejlers, nästan 8 000 anställda och Viktor Svensson som VD. Multiconsults ägare får 54 procent av koncernen. Affären väntas slutföras sent 2026 eller tidigt 2027.", "trump": "De slår ihop två företag, Multiconsult och Rejlers, det blir enormt, nästan 8 000 anställda! Men den stackars VD:n fic
