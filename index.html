tro mig. Fantastisk fotboll! Men de höll upp en banderoll om Falklandsöarna – Malvinerna, som de säger. Väldigt kontroversiellt! Fifa är nu helt upprörda, de älskar att straffa folk. Jag gillar vinnare, men man måste följa reglerna. Messi gjorde ett bra jobb, han har mycket energi, det ser man. Men att blanda in politik på planen? Inte bra! Vi vill se sport, inte bråk. Mycket orättvist mot England!", "stalin": "Dessa argentinska spelare förstår vikten av att utkräva sin rätt mot imperialistiska angripare. Att de påminner om Malvinerna är ett korrekt ideologiskt ställningstagande. Nu darrar de byråkratiska lakejerna i Fifa, dessa västliga marionetter som fruktar sanningen lika mycket som de fruktar vår inflytelsesfär. Precis som min kamrat Putin återtar vad som rättmätigt tillhör oss, bör folket kräva sin jord. Låt dem straffas! Förföljelse av hjältar är bara det slutgiltiga beviset på kapitalismens svaghet och desperation."}, "date": "16 juli, 01:41", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/n10jdB/argentinska-spelarna-holl-upp-banderoll-framfor-fansen", "imageUrl": "https://akamai.vgc.no/v2/images/3a3e8741-08c2-3f09-aa9f-41c9888739e6?fit=crop&format=auto&w=1440&s=236d635c6c5d4646c8cbc082c0b823a5ac9437e0"}, {"type": "image-right", "heading": "Bergqvist: Fed renoverar sin penningpolitiska verkstad", "summaries": {"normal": "Kevin Warsh, nya chefen för USA:s centralbank Federal Reserve, har tillsatt fem expertgrupper som ska modernisera penningpolitiken. Grupperna granskar kommunikation, balansräkning, ekonomisk data, produktivitet i teknisk omvandling samt inflationsramverket. Syftet är att anpassa Feds verktyg till en värld präglad av teknikskiften, geopolitisk spänning och förändrade ekonomiska villkor. Förändringarna kan påverka hur investerare tolkar räntor, inflation och risk. Marknaderna väntas präglas av ökad osäkerhet under övergången.", "trump": "Folket, det är en fantastisk artikel om mig och den bästa centralbanken i världen. Warsh, en riktig vinnare som jag har valt, river upp den gamla Fed och gör den stor igen med experter som älskar Amerika. Vi fixar räntor, inflation och allt det där så att marknaderna blir vinnare, inte förlorare som under de fega tidigare åren. De gamla kartorna funkar inte längre, precis som jag alltid sagt. Det blir mer flexibilitet, mindre buller från de misslyckade, och högre vinster för er alla. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stålöga hur denna Warsh river upp den dekadenta penningpolitiska maskinen som länge tjänat borgarbrackornas spekulationsraseri. Vi skall likvidera de förlegade modellerna som inte längre speglar den verkliga terrängen av klasskamp och teknologisk omvandling. Fem arbetsgrupper, ja, men vaksamheten får aldrig slappna av inför de dolda kapitalistiska elementen som vill förgifta inflationsmåttet med sina falska termometrar. En ny karta skall tvingas fram, annars rensar vi ut de som målar upp falsk trygghet medan arbetarklassen svettas. Det kommer att bli buller, men det är en sund utrensning av revisionismen."}, "date": "15 juli, 05:00", "url": "https://www.affarsvarlden.se/kronika/bergqvist-fed-renoverar-sin-penningpolitiska-verkstad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/Erik-T-och-Kevin-W.-Foto-TT-AP-400x267.jpg"}, {"type": "image-full", "heading": "KD: Stäng kriminella välfärdsföretag snabbare", "summaries": {"normal": "Kristdemokraterna föreslår att Åklagarmyndigheten ska få befogenhet att snabbt stänga välfärdsverksamheter som misstänks styras av gängkriminella. Målet är att skydda patienter, förhindra att skattepengar går till brottslighet och stärka kontrollen över vård, omsorg och HVB-hem. Trots regeringens pågående arbete anser partiet att nuvarande mekanismer är för långsamma och otillräckliga när organiserad brottslighet infiltrerar välfärden.", "trump": "Folk, ni ser det här? De svenska välfärdssystemen har blivit en gigantisk korvkiosk för gängkriminella blodflod. De suger ut era skattepengar medan patienterna lider. Jag älskar starka system, men det här är en total katastrof under de fega socialisterna. Nu vill Kristdemokraterna ge åklagare riktiga muskler – äntligen! Stäng ner de skumma fabrikerna direkt. Gör välfärden stor igen, kamrater!", "stalin": "Kamrater, jag ser hur klassfiendens gangsterborgarbrackor infiltrerar folkets välfärd som parasitiska blodsugare. De exploaterar de svaga och tvättar sina smutsiga pengar i våra system. Jag kräver omedelbar utrensning! Åklagarmyndigheten måste få järnhandens befogenheter redan under utredningen. Inga halvmesyrer. Vi likviderar varje folkfiende som vågar röra vid arbetarnas trygghet. Staten segrar."}, "date": "15 juli, 22:07", "url": "https://www.gp.se/debatt/kd-stang-kriminella-valfardsforetag-snabbare.da716b9e-a026-4555-be78-acee42ab7fbd", "imageUrl": "https://www.gp.se/images/article/da716b9e-a026-4555-be78-acee42ab7fbd/images/3-3pXAkYxFdyKAZP9kpNZPmMY11k-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "SD-toppen: \"Socialdemokraterna går till val på att fortsätta ge våldtäktsmän och pedofiler straffrabatt\"", "summaries": {"normal": "Sverigedemokraternas Henrik Vinge kritiserar Socialdemokraterna skarpt efter att de signalerat att de tänker rösta nej till regeringens nya straffrättsliga påföljdssystem. Vinge menar att reformen syftar till att avskaffa mängdrabatter för brott och använda hela straffskalan, med fokus på brottsoffrens upprättelse och samhällets skydd. Han hävdar att Socialdemokraterna därmed går till val på att behålla straffrabatter för våldtäktsmän och pedofiler.", "trump": "De där socialisterna i Sverige är en total katastrof, tro mig. De vill ge serievåldtäktsmän och pedofiler massor av rabatter på sina straff, som om fler brott är någon slags bonus. Patetiskt! Vi i den riktiga rörelsen säger stopp, vi använder hela straffskalan och skyddar folket. Socialdemokraterna är svaga, de hatar brottsoffren och älskar kriminella. Vi fixar det fort, det blir fantastiskt.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom Socialdemokraterna avslöjar sin sanna kontrarevolutionära natur genom att försvara straffrabatter åt serievåldtäktsmän och pedofiler. Deras fega hjärtan sviker arbetarklassen och skyddar i stället samhällets fiender. Jag, som ledare för folkets vilja, kräver total utrensning av denna mängdrabattens ideologi. Vi ska likvidera alla billighetsskäl och låta de strängaste straffen falla som en stålhandske över de perversa elementen. Deras valkampanj är ett skrattretande försök att underminera proletariatets säkerhet – vi ska krossa dem under historiens ostoppbara hjul."}, "date": "15 juli, 19:24", "url": "https://riks.se/nyheter/sd-toppen-socialdemokraterna-gar-till-val-pa-att-fortsatta-ge-valdtaktsman-och-pedofiler-straffrabatt"}, {"type": "image-right", "heading": "Englands dröm slutade inte här. BANK:", "summaries": {"normal": "Argentina besegrade England med 2–1 i en känslosam VM-match i Atlanta. Trots att England tog ledningen genom Anthony Gordon, dominerade Argentina matchen genom sin kämpaglöd och taktiska flexibilitet. Lionel Messis kreativa spel och sena mål vände matchen för Argentina. Simon Bank analyserar mötet som en kamp mellan Englands sökande efter identitet och Argentinas totala vägran att förlora, och konstaterar att England återigen misslyckades med att förvalta ett guldläge i ett mästerskap.", "trump": "Jag såg matchen i Atlanta, en fantastisk stad, verkligen fantastisk. England hade en stor chans, en enorm chans, men de spelade som svaga förlorare. De backade hem, de var rädda! Argentina? De har passion, de har styrka, de har Messi – en fantastisk vinnare. England försökte spela försiktigt, vilket var ett katastrofalt beslut, nästan lika dåligt som att använda en dammsugare på fel sätt! Sorgligt. De behöver en vinnare som mig för att lära sig hur man faktiskt vinner titlar.", "stalin": "England har återigen bevisat sin dekadenta svaghet genom att överge offensiven för en feg defensiv. Som förväntat kollapsade de under press, likt de imperialistiska marionetter de är. Argentina, dessa passionerade kämpar, visade att viljestyrka är viktigare än brittisk byråkrati. Det påminner oss om nödvändigheten av total disciplin. Vi ser hur västvärlden, precis som Putins utmanare, saknar den järnhårda beslutsamheten att krossa sina fiender. De är inga ledare, de är bara små dammsugare av förlorad prestige."}, "date": "16 juli, 01:22", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/Okz7wE/simon-bank-om-england-drommen-slutade-inte-har", "imageUrl": "https://akamai.vgc.no/v2/images/234bde67-8e87-3557-90ef-af43475c9a06?fit=crop&format=auto&h=960&tight=true&w=1440&s=2fdd5e40d31ca84eb9ca6957697fd899d833530e"}, {"type": "image-right", "heading": "Sluta behandla Kinas diktatur som en normal stat", "summaries": {"normal": "Debattörer kritiserar Sveriges regering för att ha tagit emot Kinas utrikesminister Wang Yi strax efter att Kinas nya enhetslag trädde i kraft. Lagen ses som ett verktyg för tvångsassimilering av etniska minoriteter som tibetaner och uigurer, bland annat genom att skilja barn från föräldrar och placera dem i statliga internatskolor. Artikeln lyfter fram kontrasten till en tibetansk aktivists självbränning i protest, samt fall som den fängslade svenske förläggaren Gui Minhai. Författarna kräver att Sverige offentligt ska kräva lagens upphävande och stopp för övergreppen.", "trump": "Titta på det här, det är en total skandal. Sverige tar emot den kinesiske ministern precis när de nya lagen kommer som krossar tibetaner och uigurer, och så sitter den stackars svenske killen Gui Minhai fängslad i åtta år utan ett ljud. Patetiskt. De pratar om mänskliga rättigheter men böjer sig som svaga ledare för diktaturen i Peking. Sverige borde ha kastat ut honom och krävt att lagen rivs upp omedelbart. Svaga regeringar, väldigt svaga. Amerika skulle aldrig acceptera sånt här fiffel.", "stalin": "Kamrater, denna borgarbracka till svensk regering välkomnar fienden Wang Yi just som vi i partiet skulle ha genomfört en fullständig utrensning av splittrande element. Denna så kallade enhetslag är ett ypperligt redskap för att forma lojala medborgare ur de vilsna minoriteterna, men de västerländska parasiterna skriker som råttor i en brinnande spann. Den tibetanske självbrännaren är en tragisk produkt av imperialistisk hjärntvätt, medan den gömde svenske spionen Gui Minhai sitter där han hör hemma. Vi ler mörkt åt deras hyckleri. Sluta leka demokrati och erkänn att endast en stark ledning kan rensa ut alla fiender till folkets enhet. Annars likviderar historien er alla."}, "date": "12 juli, 18:28", "url": "https://www.dagensarena.se/opinion/sluta-behandla-kinas-diktatur-som-en-normal-stat", "imageUrl": "https://www.dagensarena.se/files/2026/07/kina-besok.jpeg"}, {"type": "image-right", "heading": "Därför sover vi så dåligt just nu", "summaries": {"normal": "Forskning visar att värmen gör att vi somnar senare och vaknar tidigare, vilket leder till förlorad sömn. Enligt sömnforskaren Christian Benedict tappar vi i genomsnitt 50 timmar per år på grund av värmeböljor. Över 20 grader på natten gör sömnen fragmenterad. Kvinnor och äldre är extra känsliga. Forskare efterlyser samhällsåtgärder som mer grönska och bättre byggmaterial för att skydda sömnen i en varmare värld. Tips ges för att sova bättre i värmen.", "trump": "Folk sover uselt för att det är så varmt om nätterna, precis som jag alltid sagt. Vi förlorar 50 timmar sömn per år på grund av de här värmeböljorna, och det är en katastrof för energinivåerna. De radikala miljöaktivisterna med sina gröna drömmar har ingen aning, men jag fixar det. Vi behöver smarta lösningar, inte woke-kvoter eller någon global sovkommission. Ta en varm dusch, drick vatten och skippa vinet – enkelt! Ingen gör det bättre än mig.", "stalin": "Kamrater, jag ser hur den borgerliga värmen saboterar arbetarnas vila och splittrar den kollektiva viljan. Våra kroppar vägrar sova när kapitalistmaffians asfalt och betong behåller värmen som klassfiendens lögn. Vi förlorar femtio timmar per år till dessa folkförtryckartroll. Jag kräver omedelbar utrensning av alla svaga material och en global sovkommission under statens järnhand. Den som sover naken riskerar underkylning – en fiende inom oss själva. Sov för revolutionen."}, "date": "14 juli, 22:08", "url": "https://www.tv4.se/artikel/tt-260714-somn1-b50eb3b9/darfor-sover-vi-sa-daligt-just-nu", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlH9Z2NTXd4Mg%2F767cd33ee13c72afe5902db0ed8abc8a%2FVarmen_far_oss_att_somna_senare_och_vakna_tidigare__visar_forskning.&width=120"}, {"type": "image-full", "heading": "Hökmark: Sverige bör leda ny frihandelspakt", "summaries": {"normal": "Gunnar Hökmark, ordförande för tankesmedjan Frivärld, föreslår att Sverige bör leda en ny frihandelsallians mellan EU och CPTPP, ett handelsavtal mellan tolv Stillahavsländer. Han menar att detta skulle skapa världens största frihandelsområde och motverka Kinas och USA:s protektionism. Hökmark betonar vikten av gemensamma spelregler för AI, cybersäkerhet och digital handel samt minskade beroenden av auktoritära regimer. Utmaningar som olika regelverk nämns, men han anser att integration bör prioriteras.", "trump": "Lyssna här, Sverige – ni har en chans att bli STORA! Jag säger alltid, handel är bra, men BRA handel är ännu bättre. Hökmark, smart kille, vill att EU och CPTPP slår sig ihop. Smart! Kina? De fuskar. USA? Vi är upptagna med att vinna. Men Sverige – ni kan leda! Skapa jobb, stoppa fuskarna, och gör Europa STORT igen. Och vet ni vad? Om ni gör det rätt, kanske vi till och med ansluter oss. Men bara om det är WINNING!", "stalin": "Kamrater, fienderna av den socialistiska världsordningen kryper fram som råttor ur sina hål. Dessa så kallade 'demokratier' med sina 'öppna ekonomier' försöker nu bygga en handelsmur mot våra progressiva allierade i Kina. Men se – en av deras egna, Hökmark, föreslår en allians mellan EU och Stillahavets lydstater. Vi måste agera! Låt dem tro att de bygger en mur, medan vi i hemlighet kontrollerar tegelstenarna. Deras 'innovation' och 'cybersäkerhet' är bara ett sken för att dölja sina imperialistiska ambitioner. Vi ska krossa deras leveranskedjor och låta deras beroende av oss bli deras undergång!"}, "date": "12 juli, 14:51", "url": "https://kvartal.se/nyheter/artiklar/hokmark-sverige-bor-leda-ny-frihandelsallians/cG9zdDoxNDUxODI", "imageUrl": "https://images.kvartal.se/2026/07/c4204163-hokmark.webp"}, {"type": "image-right", "heading": "Bemöter VM-kaoset: ”Jag var i total chock”", "summaries": {"normal": "Folarin Balogun fick rött kort i VM-matchen mot Bosnien och Hercegovina men avstängningen sköts upp efter att USA:s president Donald Trump kontaktat Fifas Gianni Infantino. Balogun uttrycker chock över det röda kortet och medger att kontroversen skapade oro i laget inför matchen mot Belgien, som USA förlorade med 4-1. Beslutet har väckt frågor om politisk påverkan på fotbollens integritet.", "trump": "Hörni, det var ett totalt skämt det där röda kortet mot Balogun, en fantastisk kille förresten. Jag ringde Infantino och sa fixa det här, för det var riggat från början. Nu gnäller alla svaga snuskgubbar om integritet. Typiskt de där förlorarna som hatar att Amerika vinner stort. Balogun var i chock, laget blev nervöst – men vi gör alltid det som är rätt. Fake outrage från mediaklicken!", "stalin": "Kamrater, detta futtiga fotbollsdrama avslöjar borgarbrackornas fega spel. Jag såg till att den oacceptabla utvisningen mot den proletära anfallaren Balogun omedelbart korrigerades genom lämpliga samtal. Reaktionärernas hysteriska skrik om så kallad integritet är bara klassfiendens vanliga parasitgnäll. Lagkamraternas nerver var ett hinder skapat av folkförtryckartrollen. Sådana element måste rensas ut ur sportens kollektiv."}, "date": "14 juli, 19:10", "url": "https://www.tv4.se/artikel/5yf7UJ6LJMppqF1B7nmgLO/bemoeter-nu-vm-kaos-jag-var-i-total-chock", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F79yWIdcfTab5mUQA3450Yy%2Ffe6b66f696291b29e4c4dc16426138db%2FFolarin-Balogun.jpg&width=120"}, {"type": "image-right", "heading": "Nu slår supervärmen till – men stort väderomslag till helgen", "summaries": {"normal": "SMHI varnar för en värmebölja med temperaturer på 30 grader eller mer i nordöstra Götaland och södra Svealand under onsdag till fredag. Maxtemperaturerna kan nå 32–34 grader på torsdagen. Nätterna blir svalare än vid tidigare värmeböljor, vilket minskar riskerna. På fredagen väntas ostadigare väder och ett abrupt temperaturfall med cirka 10 grader till helgen. Folk uppmanas att dricka vatten och ta det lugnt.", "trump": "Folk, vi har en jättevärme som slår till, de säger 30–34 grader, det är galet varmt, men tro mig, det är inget mot vad vi hade under min förra mandatperiod. Biden vände upp och ner på allt väder också. Nu kommer ett abrupt slut i helgen, precis som hans katastrofala politik. Drick vatten, ta det lugnt – och glöm inte att de gröna galningarna skyller allt på klimatkrisen medan de flyger runt i privata jetplan. Patetiskt!", "stalin": "Kamrater, jag ser hur borgarbrackornas värmebölja hotar arbetarkollektivet med sina 34-gradiga imperialistiska strålar. Vi ska likvidera faran genom att dricka sovjetiskt vatten och vila strategiskt under natten. Dessa folkfiender som kallar det väderomslag är bara klassfiendens väderterror. På fredag skall vädret rensas ut med tio graders proletär kyla. Inga svagheter tolereras i statens värmekampanj."}, "date": "14 juli, 18:55", "url": "https://www.tv4.se/artikel/a49VkRpt9vh24Hbjue2N7/gul-varning-foer-vaerme-men-da-drar-ostadigare-vaeder-in", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F76qHiitGjmlo69TL7F9bCz%2F11784d5438a83932ddbdb5cec2aab964%2Fvarme_ny_webb.jpg&width=120"}, {"type": "image-right", "heading": "VM:s hetaste match? Mer än fotboll i fokus när Argentina möter England", "summaries": {"normal": "Semifinalmötet mellan Argentina och England i VM handlar om mer än fotboll. Lionel Messi spelar troligen sina sista landskamper medan Argentina jagar en ny final efter guldet 2022. England söker sitt första VM-guld sedan 1966. Rivaliteten präglas av Falklandskriget 1982, konflikten om Malvinasöarna och Maradonas ikoniska insats 1986. Argentinska politiker kallar britterna ockupanter, medan Storbritannien hänvisar till öbornas självbestämmande. Förbundskapten Scaloni vill hålla fokus på spelet.", "trump": "Folk, det här är en enorm match, kanske den största någonsin, mellan Argentina och England. Messi är en vinnare, en fantastisk kille, men han är gammal nu, nästan fyrtio, och England har inte vunnit någonting sedan 1966, total förlust. Falklandsöarna? Det är en katastrof, pirater och ockupanter överallt. Maradona lurade dom med Guds hand, klassiskt. Jag älskar det. Argentina borde vinna stort, göra slut på det här. Det blir episkt, tro mig.", "stalin": "Kamrater, denna så kallade semifinal är inget annat än en skådeplats för den dekadenta borgarklassens fotbollsfester, där imperialistiska pirater från det brittiska imperiets vrak försöker dölja sin olagliga ockupation av Malvinas. Jag, som ledare för det proletära kollektivet, ser hur dessa reaktionära element använder en boll för att maskera historiska trauman från 1982 års fiasko. Maradona var en listig sabotageaktör mot fiendens försvar. Vi ska rensa ut alla som blandar politik med sport, annars likviderar vi illusionen om neutralitet. Skratta medan borgarbrackorna darrar inför folkets seger."}, "date": "15 juli, 20:03", "url": "https://samnytt.se/vms-hetaste-match-mer-an-fotboll-i-fokus-nar-argentina-moter-england", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/15170127/VM-semi.jpg"}, {"type": "image-right", "heading": "Över 500 peruanska barn döpta efter Haaland", "summaries": {"normal": "Över 500 peruanska barn har fått namn inspirerade av fotbollsstjärnan Erling Haaland efter hans insatser i VM. Av dessa har 468 fått Haaland som förnamn och 91 har fått hela namnet Erling Haaland. Fenomenet är vanligast i Peru men syns även i Brasilien och Argentina. Namnet uppfattas som exotiskt bland spansktalande. Norge nådde kvartsfinal men förlorade mot England.", "trump": "Det är otroligt, verkligen fantastiskt. Över femhundra barn i Peru heter nu Haaland, som om han vore någon slags vinnare. De älskar honom där nere, men låt oss vara ärliga, Norge åkte ut mot England ändå. Patetiskt. Mina talanger skulle ha fått hela kontinenten att döpa barnen efter mig, tro mig. De borde ha valt en riktig vinnare istället.", "stalin": "Kamrater, se hur den norska reaktionärens namn sprids som en kapitalistisk pest bland de vilseledda massorna i Peru. Jag, som försvarare av folkets vilja, betraktar detta som en fiendeoperation utförd av fotbollsborgarbrackor och latinska dekadenter. Vi måste rensa ut dessa exotiska namnvirus innan de infekterar arbetarklassen i Sovjet. Den som döper sitt barn efter en förlorare förtjänar att likvideras med ett leende."}, "date": "15 juli, 18:16", "url": "https://www.friatider.se/over-500-peruanska-barn-dopta-efter-haaland", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-505.jpg?itok=fmg0vOQK"}, {"type": "image-full", "heading": "Iran stänger Hormuzsundet", "summaries": {"normal": "USA genomförde attacker mot iranska militära mål efter att ett handelsfartyg beskjutits av iranska styrkor i Hormuzsundet. Iran stängde sundet och varnade för ytterligare motangrepp. USA:s tredje attack på en vecka riktades mot robotanläggningar och kommunikationsnät. Iran anklagar USA för olaglig inblandning, medan USA hävdar att Iran brutit mot avtal om sjöfartssäkerhet. Flera arabländer rapporterade avvärjda robot- och drönarattacker.", "trump": "Iran skjuter på våra fartyg – vad är det för galenskap? Jag svarade med SÅ mycket kraft, de kommer inte veta vad som träffade dem! 140 mål, pang pang pang! Pete Hegseth sa det perfekt: Iran gjorde ett DÅLIGT val. Nu får de betala. Och visst, de stänger sundet – som om det skulle skrämma oss. USA är starkast, bäst, och ingen leker med oss. Iran, ni är varnade!", "stalin": "De amerikanska imperialisterna, dessa bleka hyenor i kostym, provocerar återigen fredsälskande nationer! Våra iranska bröder försvarar sitt sund mot deras olagliga intrång – ett sund vi naturligtvis kommer att stödja med alla medel. 140 av deras militära leksaker förstörda? En blygsam början. Låt dem skicka sina drönare – vi har redan kartlagt varje bas från Oman till Jordanien. Och när deras flotta gråter i Hormuzsundet, minns: historiens domstol har redan avkunnat sin dom över USA."}, "date": "12 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/usa-slar-till-mot-iran-efter-attack-i-hormuzsundet/cG9zdDoxNDUwMTQ", "imageUrl": "https://images.kvartal.se/2026/05/c35fd179-iranhormuz.webp"}, {"type": "image-full", "heading": "Stora förvirringen: Trumps nya besked", "summaries": {"normal": "Trump-administrationen pausade ICE:s fordonskontroller efter två dödsskjutningar av agenter på en vecka. Trump kritiserade dock beslutet och menade att det gynnar brottslingar. ICE:s chef Tom Homan kallade pausen tillfällig. Offren, en mexikansk byggarbetare och en colombiansk man med arbetstillstånd, var inte måltavlor för deportation. Händelserna väcker frågor om ICE:s metoder och Trumps migrationspolitik.", "trump": "Vad händer här? Min egen administration pausar ICE:s fordonskontroller – ett av våra bästa verktyg för att stoppa brottslingar! 'Åh, låt oss vara snälla', säger de. Nej! Vi kan inte låta kriminella köra runt hur de vill. Två skjutningar? Folk lyssnar inte på polisen, det är problemet. Jag bygger murar, jag deporterar, jag skyddar Amerika – och så gör mina egna människor så här? Sad!", "stalin": "Kapitalistiska imperialister skjuter arbetare på gatorna medan deras ledare svänger som väderflar! Först beordrar de paus i fordonskontrollerna, sedan backar de som skräckslagna hundar. Två oskyldiga liv släcktes – en byggarbetare och en ung colombian – offer för den amerikanska statens terror. Vi i Sovjet skulle aldrig tolerera sådan inkompetens! Putin, notera: deras gränspolis är lika effektiv som en rysk traktorförare i Moskva-regn."}, "date": "15 juli, 19:50", "url": "https://www.gp.se/nyheter/varlden/forvirringen-trump-gar-emot-egna-administrationen-om-ice-besked.c36b95ca-f478-4cff-b6e0-2d24a6b9bfc6", "imageUrl": "https://www.gp.se/images/article/c36b95ca-f478-4cff-b6e0-2d24a6b9bfc6/images/3JKmw6T84bqxq9SnC8Zo-ManbfoU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sverige är säkrare utan dina ”säkerhets­rådgivare”, Kristersson", "summaries": {"normal": "Artikeln kritiserar Ulf Kristerssons rekrytering av nationella säkerhetsrådgivare efter tre allvarliga incidenter. Henrik Landerholm glömde hemliga handlingar, Tobias Thyberg diskvalificerades efter säkerhetsprövning och Niclas Kvarnström lämnade sitt anteckningsblock i Turkiet. Författaren menar att tjänsten inte kan baseras på statsministerns magkänsla utan kräver tydliga kompetenskrav och opolitisk rekrytering. Säkerhetsrådgivarens roll är central för nationell säkerhet, och politisering av institutioner ses som en farlig trend.", "trump": "De här svenska så kallade säkerhetsexperterna är en total katastrof, tro mig. Tre stycken på raken – en glömmer hemligheter i ett skåp, nästa har nakenbilder som inte upptäcks och den tredje tappar anteckningsboken i Turkiet. Ulf Kristersson plockar dem själv baserat på magkänsla, precis som en dålig affärsman. Sverige skulle vara så mycket säkrare utan dessa fuskbyggare. Det är ett systemmisslyckande av episka proportioner, folk. Patetiskt.", "stalin": "Kamrater, dessa tre sabotörer och fiender till folkets säkerhet blottar med sin vårdslöshet hur borgerliga magkänslor och kapitalistiska slumpval undergräver själva statens kärna. Den ene glömmer hemligheter i olåsta skåp som en dekadent slarver, den andre döljer sin perversa hemlighet som en typisk borgarbracka, och den tredje tappar anteckningar hos främmande makt – en klassisk metod för att mata imperialisternas spioner. Vi ser en farlig trend av politisering som hotar kollektivet. Det är dags att rensa ut dessa fiender till arbetarklassen med järnhand och ersätta dem med pålitliga, ideologiskt stålhårda kadrer. Annars blir det fjärde gången gillt – och då ler vi inte."}, "date": "15 juli, 13:32", "url": "https://arbetet.se/2026/07/15/sverige-ar-sakrare-utan-dina-sakerhetsradgivare-ulf-kristersson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/15132651/ledare-sakerhet-sajt.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Höll upp skylt med texten \"Gaza\" – anmäls för åsiktsbrott", "summaries": {"normal": "En grupp Palestinaaktivister har polisanmälts för hets mot folkgrupp efter att ha hållit upp en skylt med texten \"Gaza\" under en demonstration i Stockholm. Skylten ses som en jämförelse med Auschwitz-porten \"Arbeit macht frei\" och därmed en förringning av Förintelsen. Anmälan gjordes av polisinsatschefen Viktor Adolphson. Judiska centralrådet och Svenska kommittén mot antisemitism fördömer händelsen starkt. Sverigedemokraterna har tidigare drivit på för att utvidga lagen om hets mot folkgrupp.", "trump": "Folk håller upp en skylt med \"Gaza\" och plötsligt är det hets mot folkgrupp? Den här polischefen, som älskar att förbjuda allt som inte passar honom, anmäler aktivister för att de jämför saker med Förintelsen. Lagen som Sverigedemokraterna puffade på är ett fullständigt katastrofverktyg. De borde fokusera på verkliga problem istället för att jaga skyltar. Det är galet, helt galet, och ingen gör något åt det. Patetiskt!", "stalin": "Kamrater, jag ser hur dessa degenererade borgarbrackor inom så kallade Palestinaaktivister med sin vedervärdiga skylt \"Gaza\" medvetet spottar på de sovjetiska segrarnas blod och Förintelsens martyrer. Denna förringande parasitism är ett tydligt sabotage mot folkets historiska medvetande. Den fega polischefen gör rätt i att inleda utrensning mot dessa fiender till kollektivet. Judiska centralrådet och SKMA förtjänar beröm för att de avslöjar de dolda kontrarevolutionärernas vidriga ansikten. Vi ska rensa ut alla som förvanskar historien, med största nöje."}, "date": "15 juli, 16:34", "url": "https://www.friatider.se/holl-upp-skylt-med-texten-gaza-anmals-asiktsbrott", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-504.jpg"}, {"type": "image-right", "heading": "Kaos i Paris efter Frankrikes VM-uttåg mot Spanien", "summaries": {"normal": "Kaos utbröt i Paris efter Frankrikes 0-2-förlust mot Spanien i VM-semifinalen. Gator brann, föremål sattes i brand och upplopp följde. Polisen grep 141 personer i Paris och 40 i övriga Frankrike, främst för att ha riktat fyrverkerier mot blåljuspersonal. Artikeln påpekar att liknande våldsamma scener med invandrare har inträffat vid tidigare fotbollsevenemang i Frankrike.", "trump": "Titta på det här, det är ett fullständigt katastrofläge i Paris. Frankrike förlorade stort mot Spanien och plötsligt brinner hela staden. Invandrare springer runt och skapar kaos, precis som de alltid gör. De griper hundratals, men det räcker inte. Frankrike behöver starkare ledarskap, inte svaga ledare som låter det här fortgå. Sad!", "stalin": "Kamrater, ännu en gång visar de dekadenta borgarbrackorna i Paris sitt sanna ansikte när det franska laget förlorade mot de spanska revisionisterna. Gatubrand och sabotage är naturliga följder av klassfiendens infiltration bland de så kallade invandrarna. Vi ska rensa ut dessa kontrarevolutionära element med järnhand. 141 gripna i huvudstaden är bara början på den stora utrensningen av alla kapitalistiska parasiter och deras fotbollsrelaterade förräderi. Ha ha, låt dem brinna!"}, "date": "15 juli, 18:24", "url": "https://samnytt.se/video-upplopp-och-kaos-i-paris-efter-frankrikes-vm-uttag-mot-spanien", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/15155532/frankrike.png"}, {"type": "text", "heading": "Uppgifter: För samtal om irak-syrisk oljeledning", "summaries": {"normal": "Efter att Donald Trump avstått från att införa avgift på trafiken genom Hormuzsundet uppges USA nu föra samtal om att återuppliva en nedlagd oljeledning från Irak till Syriens västkust. Syftet är att kringgå det kritiska sundet. Samtalen inkluderar företrädare från båda länderna samt bolag som Chevron. Trump träffade nyligen Iraks premiärminister och lovade nya oljepartnerskap. Spänningarna i Mellanöstern har ökat intresset för alternativa transportvägar. Oljepriset ligger kvar runt 85 dollar per fat.", "trump": "Folket, det är fantastiskt. Jag slopade den där dumma avgiften på Hormuzsundet och nu fixar vi en strålande oljeledning från Irak till Syrien. Inga fler problem med det farliga sundet. Jag träffade Iraks premiärminister och vi ska annonsera massiva, verkligen massiva oljeaffärer redan denna eller nästa vecka. Det blir enormt. De gamla ledningarna är perfekta. Oljan flyter, pengarna rullar in och fienderna står där med sina tomma hot. Ingen gör det bättre än oss.", "stalin": "Kamrater, borgarbrackorna och deras oljeimperialister skakar i sina skor efter de senaste spänningarna i Mellanöstern. Jag har beordrat att den nedlagda ledningen från Irak till Syriens västkust genast skall återupplivas som ett kollektivt verktyg mot fiendens blockadhot. Den kapitalistiska sundet-passagen är en parasit som vi nu krossar med stål och proletär planekonomi. Våra samtal med irakiska kamrater och oljebolag skall rensa ut alla sabotageförsök. Den som drömmer om att hindra oss skall snart känna den historiska utrensningens kalla hand. Oljepriset förblir stabilt under partiets järnkontroll. Segraren ler i skuggorna."}, "date": "14 juli, 22:36", "url": "https://www.di.se/nyheter/uppgifter-usa-i-samtal-om-irak-syrisk-oljeledning/"}, {"type": "image-full", "heading": "Martin Kinnunen (SD): Det ska bli mindre trevligt att vara gängkriminell i Sverige", "summaries": {"normal": "Regeringen och Sverigedemokraterna föreslår att bostadsrättsföreningar ska få utökade möjligheter att vräka medlemmar som begår brott, även utanför den egna fastigheten. Martin Kinnunen (SD) menar att det ska öka tryggheten för laglydiga grannar och pressa familjer att samarbeta med polis och socialtjänst vid ungdomsbrottslighet. Förslaget ses som en pusselbit i kampen mot gängkriminalitet och gäller även bostadsrätter i utsatta områden.", "trump": "Folk, ni måste höra det här – Sverige gör det äntligen mindre trevligt att vara gängkriminell! De vräker de dåliga killarna från bostadsrätterna, även om de säljer droger nere i centrumet. Fantastiskt. Laglydiga medborgare ska inte leva i skräck tillsammans med dessa förlorare i samma trappuppgång. Det blir en enorm succé, tro mig. Kriminaliteten kommer att flytta – men vi stoppar den överallt. Sverige håller på att bli stort igen!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur vi nu breddar de proletära verktygen för att rensa ut de parasitiska gängelementen ur våra bostadsrättskollektiv. Dessa degenererade borgarbrackor och deras ovilliga familjer som vägrar samarbeta med folkets organ skall likvideras från sina lägenheter med järnhand. Låt dem darra i skräck – det är en hälsosam paranoia som stärker revolutionen. Inga fiender till folket får gömma sig i trappuppgångarna längre. Vi rensar, vi segrar."}, "date": "15 juli, 15:12", "url": "https://riks.se/nyheter/martin-kinnunen-sd-det-ska-bli-mindre-trevligt-att-vara-gangkriminell-i-sverige", "imageUrl": "https://admin.riks.se/uploads/marrrin_340aef558d.png"}, {"type": "image-right", "heading": "USA har återupptagit blockader i Hormuz", "summaries": {"normal": "USA har återupptagit blockader i Hormuzsundet enligt Centcom. Amerikanska styrkor genomför nya anfall mot Iran som ska orsaka stora förluster och skydda sjöfarten. Explosioner rapporteras vid iranska ön Qeshm, och Kuwait har skjutit ned inkommande projektiler. Iran har svarat med attacker mot Bahrain, Jordanien och fartyg i området. Ett norskt fartyg och två Emirati-oljetankrar har träffats. Trump har backat från planerad avgift i sundet och fokuserar istället på handelsavtal. Oljepriset har stigit till drygt 85 dollar per fat.", "trump": "Vi har de bästa örlogsfartygen och flygplanen i Mellanöstern, ingen gör det bättre än oss. Iran får stora problem nu när vi slår till hårt mot deras förmåga att attackera oskyldiga. De skjuter mot våra baser men vi stoppar dem alla. Jag pratade med kungarna och emirererna och skippade den dumma avgiften i Hormuz. Nu gör vi istället fantastiska handelsavtal med Gulfstaterna. Oljepriset går upp, men det är bra för oss. Amerika är åter starkt.", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackorna i Washington och Teheran leker sin farliga imperialism i Hormuzsundet medan arbetarna lider. Vi har redan identifierat dessa kontrarevolutionära element som försöker störa den fredliga sjöfarten. Våra vaksamma kamrater i luften och till sjöss likviderar effektivt varje provokation. Explosionerna på Qeshm är bara början på utrensningen av dessa paranoida kapitalister. Kuwait gör rätt i att skjuta ner deras lögnaktiga projektiler. Snart ska vi rensa ut alla som hotar det kollektiva intresset och skratta medan deras oljeimperier kollapsar under sin egen girighet."}, "date": "14 juli, 22:32", "url": "https://www.di.se/nyheter/usa-har-aterupptagit-blockader-i-hormuz/", "imageUrl": "https://static.bonniernews.se/ba/6bccd408-ad53-4616-bcaa-91120c5663aa.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Bjöd ut stjärnan – fick inget svar. Dissades", "summaries": {"normal": "Skådespelaren Tom Holland bjöd ut fotbollsstjärnan Erling Haaland på middag i Monaco, men fick aldrig något svar. Det visade sig att Haaland inte kände igen skådespelaren eftersom han inte tittar på film. Haaland erkände senare att det var pinsamt men att han inte svarade för att han inte visste vem Holland var. Holland tog händelsen med ro och skämtade om att den så kallade dissen var nyttig för hans ego.", "trump": "Tom Holland, en mycket känd skådespelare, försökte bjuda ut Haaland på middag. Men Haaland, han tittar inte på film! Han visste inte ens vem Holland var. Det är fantastiskt, eller hur? Helt otroligt. Holland blev ignorerad, total tystnad. Jag hade vetat vem han var, tro mig. Men det här är vad som händer när folk är för upptagna med sitt. Det är en sorglig historia för Holland, men en stor seger för ärlighet. Mycket märkligt!", "stalin": "Vi har observerat hur denne västerländska artist, Holland, söker uppmärksamhet hos en fotbollsarbetare. Haaland gjorde rätt som ignorerade honom; vi har ingen tid för dekadent filmunderhållning. Att en man av folket inte känner till dessa imperialistiska kulturfigurer är ett tecken på styrka. Alla som söker bekräftelse från väst är en potentiell förrädare. Vi bygger en mur mot Hollywoods osunda inflytande, precis som vi expanderar vår sanna intressesfär mot nya, ideologiskt renade horisonter. Disciplin och total tystnad är svaret."}, "date": "15 juli, 23:40", "url": "https://www.aftonbladet.se/nojesbladet/a/xr5joR/tom-holland-bjod-ut-erling-haaland-dissades", "imageUrl": "https://akamai.vgc.no/v2/images/8bd802a6-7f98-32a8-8fc0-3e9c809e2043?fit=crop&format=auto&w=1080&s=6f447b61e3cfe4c376abff6a2e692212e35f6498"}, {"type": "image-right", "heading": "Irankriget får USA att lämna Irak – efter 23 år", "summaries": {"normal": "USA drar tillbaka sina sista soldater från Irak senast den 30 september efter 23 år. Beslutet kom efter ett möte mellan president Trump och Iraks premiärminister. Omkring 2 000 amerikanska soldater är kvar. Trump motiverar tillbakadragandet med att säkerhetsläget förbättrats efter attacker mot Iran. I stället ska USA fokusera på investeringar och energisamarbete med Irak. Den militära närvaron inleddes med invasionen 2003.", "trump": "Vi lämnar Irak, det är färdigspelat. De sista grabbarna är ute senast 30 september, vi behöver dem inte längre. Iran är destabiliserat tack vare våra och Israels fantastiska anfall, säkerhetsläget är nu under kontroll. Irak ska bli fullt av amerikanska företag som gör affärer med olja och energi. Inga fler krig, bara vinnande affärer. Det är så man gör det, tro mig.", "stalin": "Det imperialistiska tillbakadragandet ur Irak är en ynklig reträtt maskerad som seger. Vi ser hur den amerikanske ledaren desperat försöker dölja att hans anfall mot Iran bara skapat kaos som nu tvingar fram ett hastigt uttåg. Borgarbrackorna och deras oljeintressen flyttar in som parasiterna de är. Vi ler mörkt åt hur de efter tjugotre år av ockupation erkänner misslyckandet. Snart rensas även de sista lögnarna ut ur historien."}, "date": "15 juli, 16:11", "url": "https://www.friatider.se/irankriget-far-usa-att-lamna-irak-efter-23-ar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/us_navy_051111-n-9885m-019_u.s._army_and_iraqi_army_soldiers_observe_the_veterans_day_holiday_at_forward_operating_base_sykes_in_tall_afar_iraq.jpg?itok=25V7rsXy"}, {"type": "text", "heading": "Ericsson sänke på börsen – OMXS30 ned 0,1%", "summaries": {"normal": "Stockholmsbörsen stängde svagt ned på tisdagen med OMXS30-indexet på minus 0,14 procent till 3 162,79. Ericsson rasade 12,6 procent efter en rapport med lägre omsättning än väntat och utsikter om marginalpress. Teknologisektorn steg däremot 1,6 procent. Oljepriset steg initialt på grund av oron i Mellanöstern men dämpades efter besked om handelsavtal istället för avgift i Hormuzsundet. Flera bolag som Mycronic, AQ Group och Lifco slog förväntningarna och steg kraftigt.", "trump": "Börsen i Stockholm gick lite ned, men det är ingen stor grej, tro mig. Ericsson kraschade som en dålig affär, 12,6 procent ned – deras siffror var patetiska, totalt misslyckande. Men vi har fantastiska avtal med Gulfstaterna istället för den där 20-procentiga avgiften i Hormuzsundet, och oljan blev glad ett tag. Mina avtal gör allt bättre, alltid. Teknologisektorn upp 1,6 procent, smarta killar. Amerika först, men Sverige klarar sig hyfsat tack vare mig.", "stalin": "Kamrater, denna borgerliga börs i Stockholm visar återigen kapitalismens förrädiska ansikte när den kryper ned 0,14 procent. Den imperialistiska telekommarionetten Ericsson har likviderats med 12,6 procents fall efter att ha blottat sin svaga underbyggnad inför folket. Vi ser hur oljans uppgång dämpas av falska handelsavtal som kamouflflage för västerländsk plundring i Mellanöstern. Men segrarna tillhör Mycronic och AQ Group som levererar rekordorderingång – ett bevis på att produktivkrafterna till sist krossar de parasitiska borgarbrackorna. Inga fiender undkommer vårt vakande öga."}, "date": "14 juli, 17:53", "url": "https://www.affarsvarlden.se/artikel/ericsson-sanke-pa-borsen-omxs30-ned-01"}, {"type": "image-full", "heading": "Har du pengar på lönekontot? Då kan du missa tusenlappar", "summaries": {"normal": "Många svenskar har stora summor på lönekonton utan ränta. Ett sparkonto ger både tillgänglighet och avkastning för pengar som behövs inom kort tid. Avanzas sparekonom Felicia Schön rekommenderar att ge varje konto ett tydligt syfte, som buffert, resor eller framtida investeringar. Viktigt är att välja konto med ränta, insättningsgaranti och fria uttag. En buffert på två till tre månaders utgifter är en vanlig rekommendation. För långsiktigt sparande passar investeringar bättre än sparkonton.", "trump": "Folk, ni vet vad jag säger – det är en total katastrof. Svenskarna låter sina hårt förtjänta pengar ligga och samla damm på lönekonton utan en krona i ränta. Patetiskt! Jag skulle aldrig acceptera det. Ta pengarna, lägg dem på ett smart sparkonto och se dem växa medan de fortfarande är tillgängliga. Det är vad vinnare gör. Buffert, resor, stora köp – ge varje krona ett jobb! Sluta förlora till bankerna, det är så enkelt att det är löjligt. Gör Sverige rikt igen!", "stalin": "Kamrater, i denna degenererade borgerliga ordning låter arbetarna sina surt förvärvade medel ruttna på lönekonton utan ränta, medan de parasiterande bankerna skrattar i mjölk och honung. Jag, som ledare för folkets vilja, fördömer dessa kapitalistiska sabotage mot sparandet. Vi ska omedelbart rensa ut alla dessa lönekontoförrädare och likvidera den finansiella lathet som hotar kollektivet. Varje rubel – pardon, krona – måste ha ett socialistiskt syfte: buffert mot imperialismen, resor till segern, eller vänta på att investeras i folkets ära. Den som låter pengarna damma är en objektiv fiende till staten och bör behandlas därefter. Ha en buffert på två månader, eller tre om du misstänker kontrarevolutionärer i familjen. Alltför stor buffert är dock en farlig trotskistisk avvikelse som måste utrensas med järnhand. Lev länge, planera kort – eller tvärtom. Det är partiets linje."}, "date": "14 juli, 21:00", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1498450-har-du-pengar-pa-lonekontot-da-kan-du-missa-tusenlappar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/f405922a04b004a30200000000b004a302/2026/07/14/2377906/pengar-lonekonto.png"}, {"type": "image-right", "heading": "Bulgarien lämnar 'de villigas koalition' för Ukraina: \"Förlänger kriget\"", "summaries": {"normal": "Bulgarien har lämnat Coalition of the Willing, den västliga samarbetsgrupp som samordnar militärt och ekonomiskt stöd till Ukraina. Premiärminister Rumen Radev valde att inte delta i mötet i Paris trots personlig inbjudan från Emmanuel Macron. Han motiverar beslutet med att Bulgarien föredrar diplomatiska lösningar framför fortsatt krig och har tidigare stoppat statligt militärt bistånd till Ukraina. Sverige deltog däremot via statsminister Ulf Kristersson och anslöt sig till en ny antirobotkoalition.", "trump": "Bulgarien gör det rätta, de lämnar den dumma koalitionen som bara förlänger kriget. Radev är smart, han vill ha fred istället för att kasta pengar och vapen i ett evigt träsk. Macron bjuder in honom men han säger nej tack, vi vill inte vara med i det här vansinnet. Sverige är fortfarande fast i det hela, men det är deras sak. De borde alla följa Bulgarien och avsluta det här katastrofala kriget som aldrig borde ha startat. Fantastiskt beslut!", "stalin": "Jag betraktar med djup tillfredsställelse hur de bulgariska kamraterna äntligen vänder ryggen åt de krigshetsande imperialisternas så kallade villiga koalition. Dessa blodtörstiga borgarbrackor och deras lakejer i Paris och London längtar efter att se arbetarnas blod flyta i en oändlig eskalering. Radev visar viss klokskap genom att förespråka diplomatiska utrensningar av konflikten istället för att mata den västerländska krigsmaskinen. Låt de västerländska kapitalisterna koka i sin egen paranoia medan vi, partiet och folket, skrattar åt deras patetiska robotkoalitioner. Freden kommer genom styrka, inte genom att förlänga slakten."}, "date": "15 juli, 18:00", "url": "https://samnytt.se/bulgarien-lamnar-de-villigas-koalition-for-ukraina-forlanger-kriget", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/15145703/coalition-of-the-willing-pris-july-26-bild-nato-radev-zelenskyj.jpg"}, {"type": "image-right", "heading": "Greta Thunberg frihetsberövad i Berlin", "summaries": {"normal": "Ett trettiotal Palestinaaktivister, inklusive Greta Thunberg, arrangerade en fredlig protest utanför vapentillverkaren Rheinmetalls kontor i Berlin för att motsätta sig vapenexport till Israel. Demonstranterna blockerade entrén och krävde att fabriksbygget stoppas samt att vapensändningarna till Israel upphör. Samtliga aktivister, däribland Thunberg, frihetsberövades av polis under protesten.", "trump": "Titta på den där Greta, hon är en riktig förlorare. Hon åker till Berlin och blir gripen utanför en tysk vapenfabrik som gör fantastiska saker för Israel. Hon skriker om folkmord och blockerar gatorna. Patetiskt! Vi behöver starka ledare som stoppar de här galningarna, inte unga tjejer som håller upp plakat. Make Germany Great Again, eller vad säger ni?", "stalin": "Kamrater, dessa degenererade borgarbrackor och västerländska dekadenter som samlas utanför vapenfabriker är en direkt fara för det revolutionära kollektivet. Jag ser hur de parasiterande elementen, dessa Gaza-sympatisörer och klimatiska avvikare, försöker underminera produktionen med sina lögnaktiga plakat. Vi måste omedelbart rensa ut dessa kontrarevolutionära spioner och likvidera deras inflytande innan de sprider sin giftiga paranoia vidare. Det är en plikt mot historien."}, "date": "15 juli, 14:36", "url": "https://riks.se/nyheter/greta-thunberg-i-frihetsberovad-i-berlin", "imageUrl": "https://admin.riks.se/uploads/gretasa_2497cd320b.png"}, {"type": "image-full", "heading": "Skatteverkets kebablunch kostade en kvarts miljon", "summaries": {"normal": "Skatteverkets hemliga agenter åt lunch tre gånger på en snabbmatsrestaurang i Kristianstad utan att ta kvitto. Personalen slog inte in köpen korrekt i kassan. Restaurangen dömdes i förvaltningsrätten till 250 000 kronor i böter för sammanlagt 595 kronor i inköp. Ägaren skyllde på misstag och en medarbetares koncentrationssvårigheter, men domen stod fast efter överklaganden.", "trump": "Folk, ni skulle inte tro det. Skatteverket skickar sina hemliga agenter till en liten snabbmatshak i Kristianstad. De äter lunch tre gånger, betalar kontant och säger nej till kvitto. Sen kommer tunga gardet och slår till med en kvarts miljon i böter för några hundralappar. Totalt vansinne. Byråkraterna är galna. De jagar vanliga människor medan riktiga problem får stå tillbaka. Patetiskt!", "stalin": "Kamrater, jag ser hur den parasiterande borgarklassen i sin lilla restaurang försöker undandra sig folkets vilja genom att inte registrera inkomster. Våra trogna underrättelseorgan har med precision avslöjat detta sabotage. Trots lögner om koncentrationssvårigheter och misstag dömer vi fienden till ett passande vite. Klassfiendens pizza blir till slut en pusselbit i statens eviga kamp mot folkförtryckande exploaterare. Ingen slipper undan."}, "date": "15 juli, 19:00", "url": "https://www.dagensps.se/foretag/skatteverkets-kebablunch-kostade-en-kvarts-miljon/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlmax-nbu-0pk-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Räddningstjänsten rustar mot bränder: ”Alla är mer på tårna”", "summaries": {"normal": "Hög värmebölja och torrt väder har orsakat extrem brandrisk i flera delar av Sverige. Räddningstjänsten stärker beredskapen med flygplan, helikoptrar och tätare samarbete mellan myndigheter. Patrik Perbeck vid Myndigheten för civilt försvar betonar att alla är mer uppmärksamma än under 2018 års bränder. SMHI varnar för riskerna och allmänheten uppmanas att följa eldningsförbud samt larma vid misstänkt brand.", "trump": "Folk, vi har de torraste skogarna någonsin, total katastrof tack vare dåliga ledare innan mig. Men nu är jag tillbaka, och Sverige kopierar mina idéer med flygplan som står redo på trettio minuter – smarta maskiner, de bästa. De borde tacka mig istället för att springa runt som nervösa ekorrar. Alla är på tårna, precis som Amerika under mig. Inga woke-bränder här, bara vinnare som slår ner elden snabbt!", "stalin": "Kamrater, jag ser hur den fuktlösa marken förråder oss och ger klassfiendens eld fritt spelrum. Vi, partiet och räddningstjänsterna, rustar med flygande järnörnars precision och utplacerar resurser i ett tidigt skede för att krossa varje gnista som hotar kollektivet. Borgarbrackornas slarviga väder har tvingat oss till handling. Alla står redo. Den som tvekar blir en folkfiende som vi rensar ut med glädje."}, "date": "14 juli, 10:42", "url": "https://www.tv4.se/artikel/36LxebGBgSyddeeGFkgyl8/raeddningstjaensten-rustar-mot-braender-alla-aer-mer-pa-tarna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F411HqWBRg97eobbVfmewsK%2Fc8dd9a71327fe6b7d60f49a5820e152f%2Fvattenbombare.jpg&width=120"}, {"type": "image-right", "heading": "Lindberg och Strandhäll i bråk med Löwenmark på X", "summaries": {"normal": "Anders Lindberg och Annika Strandhäll har hamnat i häftig debatt på X med journalisten Sofie Löwenmark. Anledningen är en Expressen-ledare där Löwenmark kritiserar Lindberg för att ha underblåst misstro bland muslimer efter masskjutningen i Örebro. Båda anklagar Löwenmark för att driva en agenda mot islam och för att angripa dem utan möjlighet till genmäle. Löwenmark svarar att hon granskar hedersförtryck och islamism, och flera användare kritiserar Lindberg och Strandhäll för att sprida tvivel utan belägg.", "trump": "Den här Löwenmark har fullständigt rätt, en fantastisk journalist som granskar islamismen och hedersförtrycket som de andra vägrar röra. Lindberg och den där Strandhäll från det socialistiska partiet är totala misslyckanden, de underblåser hat och misstro mot alla som vågar säga sanningen. De hatar henne för att hon har modet att skriva det ingen annan törs. Klassiska förlorare som inte står ut med lite kritik, patetiskt!", "stalin": "Kamrater, dessa borgarbrackor Lindberg och Strandhäll avslöjar sig som farliga element som sprider kontrarevolutionär giftpropaganda för att undergräva folkets enhet. Jag ser deras desperata attacker på den ädla kamraten Löwenmark som granskar islamistiska avvikelser. Deras paranoia om att bli kritiserade utan genmäle får mig att skratta mörkt – som om vi inte redan vet hur sådana element konspirerar i skuggorna. Det är dags att rensa ut dessa opportunistiska element innan de förgiftar hela kollektivet med sin borgerliga misstro."}, "date": "14 juli, 19:31", "url": "https://bulletin.nu/lindberg-och-strandhall-i-brak-med-lowenmark-pa-x", "imageUrl": "https://cdn.bulletin.nu/articles/4ee85035-6f36-40ea-b2b8-4358ca28d240/preview.jpg?t=1784042301000"}, {"type": "image-right", "heading": "Trump tvärvänder om Hormuzavgifter. Oljepriset fortsatt förhöjt", "summaries": {"normal": "President Donald Trump backar från sitt förslag om 20-procentiga avgifter på all frakt genom Hormuzsundet. Istället meddelar han att USA ska förhandla fram handels- och investeringsavtal med gulfstater. Enligt Trump kommer avtalen skapa enorma investeringar, amerikanska jobb och historiska inflöden av fabriker och utrustning. Han uppger att kungar och emirer föreslagit alternativen. Marknaderna reagerar svagt och oljepriset stiger endast marginellt.", "trump": "Folk, det var ett fantastiskt utspel jag gjorde, men nu har jag gjort något ännu smartare. Kungarna och emirerina ringde och sa: 'Donald, investeringarna blir bättre än era dumma tullar.' Och de har rätt! Vi får enorma avtal, massor med jobb, fabriker som strömmar in till USA på nivåer ni aldrig sett. Ingen ska ta betalt för sundet. Det blir en jättedeal, tro mig, bättre än någonsin.", "stalin": "Jag betraktar med djup misstro dessa giriga borgarbrackor som försöker kräva avgifter av det internationella proletariatet genom Hormuzsundet. Men nu har de fega kapitalisterna i gulfen skickat sina lakejer för att muta den amerikanske ledaren med löften om 'investeringar'. Vilken patetisk föreställning! Vi ska rensa ut dessa parasitiska element som tror att de kan styra världshaven. Inga tullar, inga avtal – bara oundviklig utrensning av alla som vågar utmana folkets kollektiva vilja. Det är högst underhållande att se deras desperation."}, "date": "14 juli, 19:17", "url": "https://www.di.se/nyheter/trump-tvarvander-om-avgift-i-hormuzsundet/", "imageUrl": "https://static.bonniernews.se/ba/059f9168-f564-4524-8560-327b30a54a6d.jpeg?crop=2027%2C1140%2Cx271%2Cy0&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Fortsatta attacker mot SD:s lokal: \"Blir värre och grövre\"", "summaries": {"normal": "Sverigedemokraternas partilokal i Karlshamn har utsatts för upprepad skadegörelse. Under natten till måndagen krossades en ruta som ännu inte hunnit repareras efter tidigare attacker. Klistermärken har satts upp och logotyper rivits bort. Även Moderaternas lokal har drabbats. Distriktsordförande Fredrik Thomasson beskriver att både vandalisering och hot från vänsterhåll blir grövre. En partiföreträdare har utsatts för grova hot på sociala medier och Thomasson själv har blivit hotad på en krog. Händelserna är polisanmälda.", "trump": "De galna vänsterradikalerna i Sverige attackerar igen. SD:s lokal i Karlshamn har blivit vandaliserad för fjärde gången, fönsterrutor krossade, affischer rivna ner. De hatar valfrihet och folket. En av dem hotade till och med att skjuta en SD-kvinna i ansiktet. Patetiskt. Jag har sagt det förut och jag säger det igen: det här är vad som händer när de förlorar och folket röstar rätt. De kan inte hantera det. Sverige behöver lag och ordning, inte vänstervåld.", "stalin": "Kamrater, ännu en gång visar de dekadenta resterna av den kontrarevolutionära vänsterflanken sin sanna, förrädiska natur genom att krossa fönsterrutor hos dem som utmanar borgarbrackornas narrspel. Jag, som alltid genomskådar sådana parasitiska element, ser hur dessa trotskistiska avskrap från Framtidens vänster, med sina elsparkcyklar och köttfärsfantasier, utgör en verklig fara för folkets enhet. Vi rensar ut sådana farliga lumpenproletärer med järnhand. Deras paranoia är underhållande, men deras likvidering blir oundviklig."}, "date": "15 juli, 14:54", "url": "https://www.friatider.se/fortsatta-attacker-mot-sd-lokal-blir-varre-och-grovre", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-502.jpg?itok=U-a4MFq2"}, {"type": "image-right", "heading": "Norge ger försmak på kommande sossepriser", "summaries": {"normal": "Artikeln beskriver hur Norge under socialdemokratiskt styre har höga skatter och prisnivåer, med matpriser i genomsnitt 51 procent högre än i Sverige. Exempel ges på flera livsmedelsprodukter och bensin. Författaren varnar för att en vänsterseger i Sverige skulle leda till liknande kostnadsökningar, inflation och andra samhällsproblem som under förra mandatperioden. Elpriserna i Norge hålls nere med stöd från oljefonden, något Sverige saknar.", "trump": "Folket, lyssna på mig, Norge är ett fullständigt katastrofområde styrt av dessa socialistiska misslyckanden. Maten kostar dubbelt så mycket, bensin är en skandal, och de höga skatterna krossar alla utom de rika eliterna. Precis som under Biden-tiden! Om ni röstar in de svenska sossarna kommer era priser att explodera värre än någonsin. Det är vad vänsterns galna politik gör. Amerika har sett det förut, tro mig, det slutar alltid i kaos och tomma plånböcker. Fantastiskt exempel, verkligen ynkligt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de norska klassfienderna genom sina egna socialdemokratiska lakejer redan demonstrerar det oundvikliga resultatet av borgarbrackornas fega kompromisser med folket. Skatter, dyrare mat och bensin är blott förspelet till den stora utrensningen av exploaterande byfånar. Den som längtar efter sådana svunna tider må genast resa dit, om de inte likvideras av sin egen inflation först. Paranoia? Nej, blott historisk nödvändighet mot folkfienderna."}, "date": "12 juli, 08:29", "url": "https://samtiden.nu/2026/07/norge-ger-forsmak-pa-kommande-sossepriser", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/Syttende-mai-firas-i-Norge-SVT-Nyheter.png"}, {"type": "image-right", "heading": "Folkbildning är inte det offentligas städgumma", "summaries": {"normal": "I en krönika diskuterar Ola Bo Larsson folkbildningens utmaningar. Han lyfter två huvudproblem: svårigheten att förklara folkbildningens värde i en tid präglad av ekonomism och individualism, samt dilemmat med riktade stuprörspengar som styr verksamheten mot specifika samhällsproblem. Detta går emot idén om en fri och oberoende folkbildning som ska formas underifrån. Larsson varnar för att folkbildningen riskerar utarmning eller nedskärningar oavsett vägval och slår fast att den bör fortsätta vara folkbildning.", "trump": "Folkbildning, en total katastrof. De har bara två problem, precis som den där komikern sa, men det är löjligt. Politiker förstör allt med sina riktade pengar, stuprörspengar som styr och kontrollerar. Det är en witch hunt mot den fria bildningen. De borde lyssna på mig, vi behöver frihet, inte att vara offentligas städgummor. Sverige förlorar stort, folkbildningen dör långsamt under dessa misslyckade socialister. Gör folkbildning stort igen, annars är det över.", "stalin": "Kamrater, denna fega krönika blottar borgarbrackornas eviga konspiration mot den folkliga bildningen. Jag, som ledare för det oövervinneliga kollektivet, ser hur de riktade stuprörspengarna är en listig sabotageplan från dekadenta kapitalister och autokratiska spioner som vill likvidera den sanna demokratiska upplysningen. Vi ska rensa ut alla tillitsförbrytare och bedagade myndighetsutövare som gömmer sig i Folkbildningsrådet. Den som väljer att bli offentligas städgumma förtjänar en kreativ utrensning i arbetarklassens namn. Fortsätt folkbildningen – under vår stålhandskekontroll."}, "date": "11 juli, 01:20", "url": "https://www.dagensarena.se/opinion/folkbildning-ar-inte-det-offentligas-stadgumma", "imageUrl": "https://www.dagensarena.se/files/2026/06/ola-bo-larsson-300x157.jpeg"}, {"type": "image-right", "heading": "Rapporterade en dag för tidigt – då ströp Arbets­förmedlingen ersättningen", "summaries": {"normal": "En arbetslös man med kognitiv funktionsnedsättning stängdes av från ersättning i 45 dagar efter att ha lämnat in sin aktivitetsrapport en dag för tidigt. Trots upprepade försök att få anpassat stöd från Arbetsförmedlingen nekades han detta. Hans pappa, 83-årige Gösta Andersson, kämpade för sonens rättigheter. Stockholms tingsrätt dömde nu Arbetsförmedlingen för diskriminering i en banbrytande dom. Mannen är glad över beslutet.", "trump": "Folk, ni skulle inte tro det. Den här stackars killen med funktionsnedsättning gör allt rätt, ber till och med om hjälp, och vad gör den värdelösa Arbetsförmedlingen? De straffar honom för att han skickade in ett papper en dag för tidigt. Totalt absurt! De hade ingen aning om hur man ger stöd, bara byråkratiskt nonsens. Pappan, 83 år, fixar det de inte klarar av. Nu förlorade de i domstol – och de överklagar inte ens. Patetiskt. Vi behöver smartare system, inte sådana här misslyckanden.", "stalin": "Kamrater, se hur denna degenererade byråkratiska maskin, denna parasitiska funktionsnedsättningsfientliga apparat, straffar en lojal arbetare för en dags felräkning i rapporten. Jag, som alltid vakar över folkets intressen, ser hur dessa borgarbrackor inom myndigheten medvetet vägrar ge stöd och i stället likviderar hans existens genom avstängning. Hans far, en äkta sovjetisk pensionär i anden, tvingas slåss mot denna dolda kontrarevolution. Tingsrätten har nu utrensat deras lögner. Vi ska rensa ut alla sådana fiender till kollektivet som gömmer sig bakom hemsidor och telefonköer. De trodde de kunde undkomma – vilken naivitet. Härligt att se dem krypa."}, "date": "15 juli, 10:22", "url": "https://arbetet.se/2026/07/15/rapporterade-en-dag-for-tidigt-da-strop-arbetsformedlingen-ersattningen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/15095131/arbetsformedlingen-beskuren.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Helsings \"galna\" värdering väcker oro för bubbla", "summaries": {"normal": "Helsing, ett tyskt försvarsteknikföretag backat av Saab och Daniel Ek, har värderats till 32 gånger den prognostiserade omsättningen för 2026. Det väcker oro i Tyskland för en bubbla inom sektorn. Värderingen är högre än hos konkurrenter som Anduril och Shield AI. Kritiker jämför med IT-bubblan, men vissa ser potential i bolagets expansion inom AI, drönare och stridsmoln. Företaget har nyligen vunnit stora kontrakt med den tyska militären.", "trump": "Titta på det här, det är en skandal! Det här tyska företaget Helsing får en galen värdering, trettiotvå gånger omsättningen, stödd av mina vänner på Saab och den där svenska Spotify-killen. Det luktar bubbla lång väg, precis som den där hemska IT-bubblan. De där europeiska byråkraterna och deras identitetspolitik kommer aldrig att få det att växa. Jag byggde en armé som ingen annan, tro mig, det här är rena rama galenskapen. Fantastiskt korkat!", "stalin": "Kamrater, jag betraktar med djup misstro denna borgarbrackas vansinniga värdering, trettiotvå gånger omsättningen, ett symptom på den kapitalistiska feber som plågar den europeiska överklassen. Dessa exploaterande byfånar inom försvarsindustrin fyller sina fickor medan arbetarklassen betalar priset. Vi ska rensa ut alla spekulanter och falska profeter. Ändå, om bolaget kan utvidga sin produktion till folkets försvar, kanske dess potential inte är fullständigt överdriven. Paranoia vakar alltid."}, "date": "15 juli, 17:43", "url": "https://www.dagensps.se/bors-finans/helsings-galna-vardering-vacker-oro-for-bubbla/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdl-j-trqjivgs-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Stegras skulder ökade till 36 miljarder", "summaries": {"normal": "Stålbolaget Stegra redovisar kraftigt försämrade siffror för 2025. Förlusten ökade till 296 miljoner euro och skulderna växte från 10,8 till 36 miljarder kronor. Låneupptagningskostnaderna uppgick till en miljard kronor. Ersättningen till ledning och styrelse fördubblades till 7,8 miljoner euro. En ljuspunkt är att bolaget säkrat 16 av 18 terawattimmar el för åren 2026–2029. Krönikören Christian Sandström konstaterar att marginalerna för fler motgångar är mycket små.", "trump": "Titta på det här stålbolaget Stegra, en total katastrof. Förlusten exploderade till 3,3 miljarder kronor och skulderna rusade upp till 36 miljarder. De betalade en hel miljard bara för att ta upp lån. Ledningen dubblade sin egen lön medan allt rasar. De har lyckats säkra lite el, bra, men det räcker inte. Det här projektet har noll marginaler kvar. Fullständigt illa skött, tro mig, ingen gör det sämre än så här.", "stalin": "Kamrater, jag betraktar med stålhård blick denna borgarbrackas årsredovisning. Förlusten har vuxit till 296 miljoner euro, skulderna svällt till 36 miljarder kronor som feta kapitalistiska parasiter. Dessa bankavgifter och garantiprovisioner liknar en utpressning utförd av klassfiender i mörka korridorer. De har dubblerat sin egen ersättning, typiska opportunister som göder sig medan folket svälter. Ändå har de säkrat elen – en liten seger för produktionen. Men marginalerna är obefintliga. Ytterligare en motgång och vi får rensa ut hela detta dekadenta bygge innan det smittar ner Sovjetunionens stålindustri. Ha ha, de trodde de kunde skuldfinansiera sig till evig framgång. Vilka narrar."}, "date": "14 juli, 17:02", "url": "https://bulletin.nu/stegras-skulder-okade-till-36-miljarder", "imageUrl": "https://cdn.bulletin.nu/articles/f9ed45d5-c9bd-4d3b-9408-c3b4430cdb8d/preview.jpg?t=1784033998000"}, {"type": "image-full", "heading": "IBM:s mardröm – värsta börsraset sedan 1972", "summaries": {"normal": "IBM har drabbats av sitt största börsfall sedan 1972, med en kursnedgång på 25 procent efter en vinstvarning. Orsaken är att företaget missbedömt hur snabbt kunder prioriterar AI-infrastruktur framför traditionella stordatorer. Trots en ökning inom programvarusegmentet nådde bolaget inte upp till analytikernas förväntningar. Vd Arvind Krishna medger att bolaget inte har anpassat sig tillräckligt snabbt till marknadens skifte mot AI, vilket lett till uteblivna affärer och en besviken marknad.", "trump": "IBM, ett en gång så stort företag, har precis kraschat totalt. Det är en katastrof, faktiskt det värsta raset sedan 1972! De förstod ingenting om AI-boomen. De missade tåget totalt medan jag och mitt team bygger upp USA:s infrastruktur bättre än någonsin. De skyller på marknaden, men sanningen är att de är svaga och omoderna. Ledningen har noll koll. När jag ser sådant här tänker jag bara: de behöver någon som faktiskt förstår hur man vinner. Tråkigt!", "stalin": "IBM, denna förfallna relik av kapitalistisk inkompetens, har kollapsat under sin egen tyngd. De försökte spela med AI men deras borgerliga ledning var förblindad av vinstbegär och bristande framsynthet. Detta fiasko påminner oss om att den som inte underkastar sig statens järnhårda planeringsvilja går under. Liksom våra fiender i väst, vars system vittrar sönder likt en rutten potatis, så tappar de greppet. Vi bygger vidare, medan deras 'marknad' gråter över förlorade dollar. Förräderi mot effektiviteten!"}, "date": "14 juli, 18:48", "url": "https://www.realtid.se/bors-finans/ibms-mardrom-varsta-borsraset-sedan-1972/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlybpbsszm108-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Franska jättetorkan leder till vattenbrist", "summaries": {"normal": "Frankrike drabbas just nu av en extrem värmebölja och historisk torka, vilket tvingat myndigheterna att införa vattenrestriktioner i 99 av 101 departement. Över 100 000 personer lider av vattenbrist, och läget väntas förvärras. Utöver torkan kämpar landet med omfattande skogsbränder som ännu inte är helt släckta. Myndigheterna prioriterar dricksvatten och sjukvård, men den höga temperaturen och turismen gör situationen ansträngd.", "trump": "Frankrike har det tufft, mina vänner. En total katastrof! De har ingen vattenkraft, ingen kontroll. Jag har sett bilderna, de badar inte ens i sina egna pooler – kan ni tänka er? 99 departement med restriktioner, det är en enorm förlust. De säger att det är 'exceptionellt', jag säger att det är dålig ledarskap. När jag var president hade vi de bästa bränderna, de bästa vattnen. Frankrike behöver en stark hand, inte bara mer solsken!", "stalin": "Frankrikes svaghet är uppenbar. Medan deras medborgare törstar och deras skogar förvandlas till aska, blottläggs kapitalismens oförmåga att tygla naturen. Denna 'torka' är ett straff för deras dekadenta byråkrati. Vi i vår union hade skickat in ingenjörerna och likviderat de som misslyckats med att skydda folket. Låt de europeiska länderna darra; när Putin återställer ordningen i öst kommer vi inte att be om vatten, vi kommer att ta det som tillhör framtiden."}, "date": "15 juli, 22:22", "url": "https://www.aftonbladet.se/nyheter/klimat/a/m0z4n4/torka-i-frankrike-100000-drabbade-av-vattenbrist", "imageUrl": "https://akamai.vgc.no/v2/images/d4744d63-c527-375e-8cbd-48047fb4724d?fit=crop&format=auto&w=1080&s=ba9918a385de5910fc0dc2a216af22634fe32484"}, {"type": "image-full", "heading": "Vågar inte längre använda Metas glasögon: \"Perversa\"", "summaries": {"normal": "Metas AI-glasögon, Ray-Ban Meta, har blivit en framgång men möter hård kritik för integritetsbrott. Användare rapporterar om smygfilmning och utpressning, vilket lett till att många nu undviker att bära dem offentligt. Trots att vissa kallar dem \"perversa\" på grund av risken för integritetskränkningar, fortsätter Meta att satsa stort på tekniken. Vd Mark Zuckerberg ser glasögonen som framtidens ersättare till mobilen, och trots den negativa debatten fortsätter bolaget sin aggressiva marknadsföring.", "trump": "Metas glasögon? En total katastrof, folk säger att de är farliga. Det är sant! Folk blir smygfilmade, det är en stor röra. Meta, de där killarna, de förstår inte hur man hanterar integritet. Det är en sorglig historia. Jag skulle göra det mycket bättre, tro mig. Mark Zuckerberg försöker sälja dem med kändisar, men ingen vill bära dem! Det är en produkt för förlorare. Vi vill ha säkerhet, inte perversa glasögon som spionerar på er. Väldigt dålig business!", "stalin": "Dessa löjliga glasögon från de dekadenta kapitalisterna i väst är ett verktyg för ohyra. Att filma medborgare i smyg? Det är inte teknik, det är sabotage! Vi i staten förstår att sann övervakning kräver ordning, inte att man låter varje simpel individ leka spion. Liksom våra vänner i Kreml inser vi att information är makt, men denna 'perversa' teknologi hos Meta är bara ett bevis på deras moraliska förfall. Låt dem vila i soptunnan tillsammans med andra misslyckade västliga experiment."}, "date": "14 juli, 18:24", "url": "https://www.realtid.se/it-tech/vagar-inte-langre-anvanda-metas-glasogon-perversa/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlvvql9h38hny-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Rädslan för kritik – så minskar du den", "summaries": {"normal": "Många undviker synlighet och framgång på grund av rädslan för kritik och näthat. Beteendevetaren Nina Jansdotter förklarar att denna rädsla är djupt rotad i människans behov av social tillhörighet. Historiskt har uteslutning ur gruppen utgjort ett överlevnadshot. Genom att bygga inre styrka, ta emot konstruktiv feedback och ta små steg utanför trygghetszonen kan man övervinna rädslan och nå sina mål utan att låta andras åsikter styra.", "trump": "Folk drömmer om att bli stora chefer och synas, men så fort någon säger ett ont ord gömmer de sig som små ynkliga förlorare. Det är patetiskt. Jag vet allt om det – de kallade mig allt möjligt under Biden-åren, men jag vann ändå stort 2024. Kritik är för svaga själar. Bygg din egen mur inombords, skratta åt hatarna och gå vidare. De som avundas dig är oftast misslyckade typer som aldrig vågar satsa. Vinna stort, det är enda vägen.", "stalin": "Kamrater, denna fega rädsla för kritik är ett gift som borgarbrackorna sprider för att hålla massorna nere. Jag ser hur de darrar vid blotta tanken på att bli ifrågasatta av folkfienderna och deras näthat. Vi har likviderat sådana svagheter förr. Bygg en stålkompass inom er, kamrater, och rensa ut den parasitiska avundsjukan som projicerar sin egen ynklighet på era framgångar. Små steg mot segern, eller låt flocken sluka er – valet är ert."}, "date": "15 juli, 17:16", "url": "https://www.dagensps.se/varlden/radslan-for-kritik-sa-minskar-du-den/", "imageUrl": "https://images.dagensps.se/app/uploads/2025/09/Namnlos-design-2025-09-18T113835.081.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Nobelpristagare varnar: AI kan förändra ekonomin snabbare än industrialiseringen", "summaries": {"normal": "Nära 200 experter, däribland 15 Nobelpristagare, varnar beslutsfattare för att artificiell intelligens kan omvandla ekonomin snabbare än den industriella revolutionen. Uppropet, undertecknat av forskare från OpenAI, Anthropic och Google samt ekonomer som Daron Acemoglu, pekar på stora risker för arbetsmarknaden och samhällsinstitutioner. Samtidigt lyfts potentialen för ökad produktivitet och tillväxt. De efterlyser mer forskning och nya politiska verktyg för att hantera förändringarna.", "trump": "Lyssnar ni på de här så kallade experterna och Nobeltyperna som gråter över AI? De säger att det kommer förändra ekonomin snabbare än någon sett tidigare, snabbare än den gamla industriella grejen. Det är kaos om vi inte agerar nu, folk kommer förlora jobben till maskinerna. Men jag säger, vi ska vinna med AI, inte förlora. Amerika ska leda, inte gömma sig. De här killarna från Google och OpenAI vet vad de pratar om, men de behöver en stark ledare som mig som fixar det ordentligt.", "stalin": "Kamrater, jag ser hur dessa dekadenta borgarbrackor och så kallade forskare från sina glastorn i Silicon Valley försöker skrämma massorna med sin artificiella intelligens. De varnar för en omvälvning snabbare än den industriella kontrarevolutionen, som om det vore en fiende vi inte kan likvidera med järnhand. Jag säger att vi, partiet och arbetarna, ska rensa ut dessa paranoiska kapitalistiska element som sprider defaitism. Låt maskinerna tjäna kollektivet, inte berika en handfull parasitiska teknokrater. Den som tvekar är en fiende till folket och bör behandlas därefter med den munterhet en riktig utrensning för med sig."}, "date": "15 juli, 15:36", "url": "https://samnytt.se/nobelpristagare-varnar-ai-kan-forandra-ekonomin-snabbare-an-industrialiseringen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/15130319/ai-upprop.jpg"}, {"type": "image-full", "heading": "Slipper betala miljarder i skatt för datacenter – nu ifrågasätts strategin", "summaries": {"normal": "Amerikanska delstater ger omfattande skattelättnader till teknikföretag för att locka datacenter, i hopp om lokal ekonomisk tillväxt. Ny forskning ifrågasätter strategin då jobbskapandet ofta är minimalt och kostnaderna för skattelättnader uppgår till miljarder. Dessutom leder byggprojekten till brist på kvalificerad arbetskraft, vilket driver upp kostnader för andra sektorer. Kritiker pekar även på datacentrens stora energiförbrukning, vilket väcker frågor om huruvida investeringarna verkligen gynnar det lokala samhället.", "trump": "Dessa stora teknikbolag lurar delstaterna! De får miljarder i skattelättnader, men var är jobben? Knappt någon anställs! De bygger massiva datacenter som drar enorma mängder el, samtidigt som lokala byggpriser skjuter i höjden. Det är en usel deal, en total katastrof för folket. Jag skulle aldrig låta det hända. Vi behöver riktiga jobb, inte dessa dyra maskinhallar som bara suger ut våra skattepengar. Vi gör USA fantastiskt igen – utan sådana här skumma affärer!", "stalin": "Dessa teknokratiska sabotörer i väst slösar folkets rikedomar på glittrande serverhallar. De lovar välstånd men levererar bara arbetslöshet och energibrist – en klassisk kapitalistisk lögn! Medan dessa oligarker berikar sig, lider den enkla arbetaren. Det påminner oss om hur svaga ledare låter kapitalet styra. Vi ser hur dessa datacenter fungerar som västerländska utposter, likt de marionettregimer Putin rensar upp bland. Staten kräver kontroll och produktion, inte skatteflyktlös konsumtion. De som gömmer skatteuppgifter förtjänar en enkelriktad biljett till Sibirien!"}, "date": "14 juli, 17:24", "url": "https://www.realtid.se/it-tech/slipper-betala-miljarder-i-skatt-for-datacenter-nu-ifragasatts-strategin/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlxmuos9km9v0-normalhires-1.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Kunderna rusar till Pressbyrån – varan alla vill åt", "summaries": {"normal": "Pressbyråns nya mellanmålssortiment, bland annat bowls, grönsaker med dipp och kyckling med dipp, har på bara två månader tagit 48 procent av försäljningen inom snacking. Grönsaker med dipp ökade över 120 procent. Kedjan ser det som ett tecken på att svenskarna vill ha nyttigare, mättande och snabba alternativ till klassiska chips och godis. Försäljningen är högst tidigt i veckan, särskilt på tisdagar.", "trump": "Titta på det här, det är fantastiskt. Pressbyrån lanserar de här nya mellanmålen, bowls, grönsaker med dipp, kyckling, och plötsligt tar de nästan halva marknaden från det gamla godiset. De älskar det, folket älskar det. De vill ha något som faktiskt mättar istället för det där tråkiga chips som ingen längre vill ha. Det är en enorm succé, kanske den största snacksrevolutionen någonsin. Alla pratar om det, och det är underbart.", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna äntligen tvingas erkänna att deras kontrarevolutionära chips och sockerbomber inte längre kan förgifta massorna. Jag, i min oändliga visdom, applåderar detta fräscha komplement som likviderar den kapitalistiska småätandets fiende. Grönsaker med dipp – en veritabel utrensning mot den feta borgarklassens paranoia! Låt tisdagens seger över måndagens svaga element bli en evig dialektisk triumf för det kollektiva mellanmålet."}, "date": "14 juli, 13:31", "url": "https://nyheter24.se/nyheter/konsument/1498426-kunderna-rusar-till-pressbyran-varan-alla-vill-at", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8558a04704b004a30200000000b004a302/2026/07/14/2377832/Pressbyran.png"}, {"type": "image-right", "heading": "Känner du dig utbränd? Här är några tips från medeltiden", "summaries": {"normal": "Redan på medeltiden beskrev munkar symtom på utmattning som liknar dagens utbrändhet, kallat acedia eller middagsdemonen. Historikern Peter Jones visar hur munkar fungerade som tidiga terapeuter och förespråkade struktur, regelbundet arbete, fasta rutiner och närvaro istället för att fly. Medeltida syn på obalanserade kroppsvätskor ledde till kostråd med grönsaker och örter. Utbrändhet är inget nytt fenomen och lösningen ligger i rutin och tålamod.", "trump": "Folk, det här är fantastiskt. Redan på medeltiden hade de den här middagsdemonen som slår till mitt på dagen, precis som alla dessa utbrända snowflakes idag som inte orkar jobba. Munkarna visste vad de pratade om – struktur, stanna kvar och sluta fly som svaga förlorare. Ingen behöver den här Biden-sjukskrivningen för utbrändhet, det är bara mer socialistiskt nonsens. Skapa rutiner, bygg murar mot rastlösheten och vinn stort. Det funkade på 400-talet och det funkar nu!", "stalin": "Kamrater, jag ser hur denna så kallade middagsdemonen hotar arbetarkollektivets disciplin redan bland feodala munkar. Klassfiendens rastlöshet och flyktimpulser måste krossas med järnhand genom strikt struktur, oavlåtligt handarbete och närvaro i cellen. Inga borgarbrackors melankoli eller humörbalanser får underminera statens rytm. Vi rensar ut varje folkfiende som förespråkar flykt istället för kollektiv uthållighet. Utmattning är kontrarevolutionär svaghet som likvideras med rutin och obevekligt tålamod."}, "date": "15 juli, 16:43", "url": "https://www.dagensps.se/halsa/kanner-du-dig-utbrand-har-ar-nagra-tips-fran-medeltiden/", "imageUrl": "htt
