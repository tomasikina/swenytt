v dessa exploaterande kapitalister redan vid första gnistan. Nu skrattar imperialisterna medan Rysslands strategiska mål brinner som facklor. Ytterligare ett bevis på svaghet som måste likvideras."}, "date": "10 augusti, 22:57", "url": "https://www.tv4.se/artikel/6lcKuIT81LpbZ4bRc5iHvd/ryska-foeretag-tvingas-skydda-sig-sjaelva-och-betala-foer-det", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1WePZNRf74ZekRk1FUETkL%2F88c5d2e0dd323740a40eb7976cf8d429%2F10-ryssland-sajt1.jpg&width=120"}, {"type": "image-right", "heading": "Ja visst gör det ont när vit sharia brister", "summaries": {"normal": "Sanna Hill lämnar den högerextrema rörelsen efter nästan 20 år och kritiserar dess kvinnoförtryck, som hon liknar vid islamism med begreppet \"white sharia\". Hon beskriver ett kvävande hat mot kvinnor, HBTQ och myndigheter. Före detta kollegor svarar med våg av misogynt hat, vilket bekräftar hennes kritik.", "trump": "Lyssnade på den där Sanna Hill som äntligen flyr den sjuka högerextrema cirkusen. Smart drag, folk! De där misslyckade typerna med sin white sharia är patetiska förlorare, precis som de woke-vänstermänniskorna med sin galna HBTQ-agenda och kvotering. Kvinnor ska inte styras av sådana svaga stackare. Amerika först, alltid!", "stalin": "Jag ser med tillfredsställelse hur klassfiendens fascistiska resterna äter upp sig själva i en orgie av kvinnoförtryck och paranoia. Denna white sharia är borgarbrackornas sista desperata utbrott innan utrensningen. Kamrater, låt de bittra byfånarna avslöja sitt hat – det underlättar likvideringen av folkfienderna. Sovjetiskt skratt ekar."}, "date": "10 augusti, 12:07", "url": "https://www.etc.se/ledare/ja-visst-goer-det-ont-naer-vit-sharia-brister", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Ska jag våga hoppas på Erdogans ”amnesti”?", "summaries": {"normal": "Joakim Medin diskuterar Turkiets nya lagförslag som kan ge amnesti och möjlighet att överklaga domar för personer anklagade för kopplingar till PKK. Lagen kan leda till frigivning av tusentals fångar och upprättelse för oppositionella. Medin är skeptisk men ser det som ett potentiellt genombrott trots osäkerheter kring Erdogans motiv.", "trump": "Folk, ni måste höra på det här! Erdogan, den listiga räven, lovar amnesti till alla dessa så kallade terrorister och PKK-typer. Det är ett stort steg, kanske det största någonsin, men glöm inte – han fiskar bara efter röster för att sitta kvar längre. Precis som Sleepy Joe gjorde med sina identitetspolitiska galenskaper. Klassiskt!", "stalin": "Kamrater, denna luddighet i Erdogans amnesti är ett typiskt imperialistiskt trick från borgarbrackorna för att lura arbetarklassen. Jag ser hur klassfienderna försöker maskera sina utrensningar som fred. Vi vet att sådana löften är tomma som de folkförtryckande trollens hjärtan. Ändå kan det bli ett genombrott mot reaktionärerna – tills vi rensar ut dem alla."}, "date": "10 augusti, 11:58", "url": "https://www.etc.se/kommentar/ska-jag-vaaga-hoppas-paa-erdogans-amnesti", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260810090852_740e90f0688621b21ffeb3f683cc75f04d188bc69a796e75601855231d50efb2.jpg"}, {"type": "image-right", "heading": "Ytterligare ett nazistiskt valfiasko att vänta?", "summaries": {"normal": "Nazistiska grupper som Nordiska motståndsrörelsen och Svenskarnas parti har upprepade gånger ställt upp i svenska val utan att vinna mandat. Istället har satsningarna lett till interna konflikter och splittring. Artikeln visar att valen främst används för propaganda, uppmärksamhet och rekrytering snarare än verkligt politiskt inflytande.", "trump": "Titta på de här patetiska nazisterna som ställer upp val efter val och förlorar stort. Det är ett totalt fiasko, tro mig. De får inga röster, inget inflytande, bara interna bråk. Precis som de woke-vänstern och deras identitetspolitik – alla förlorare. Jag vann stort 2024, de förlorar alltid. Ynkligt!", "stalin": "Ännu en gång avslöjar de fascistiska elementen sin svaghet genom att springa efter valurnorna som desperata klassfiender. Vi ser deras patetiska försök sluta i förkrossande nederlag och interna utrensningar. Propaganda och rekrytering av nya folkförtryckartroll är deras enda mål. Inga mandat åt blodsugarna – endast åt arbetarkollektivet."}, "date": "10 augusti, 11:29", "url": "https://expo.se/kommentar/ytterligare-ett-nazistiskt-valfiasko-att-vanta", "imageUrl": "https://expo.se/wp-content/uploads/2026/08/Kommentar-Anders.png"}, {"type": "image-right", "heading": "KD-ministern pratar om livets mening", "summaries": {"normal": "Folkhälsominister Jakob Forssmed vill att myndigheter ska arbeta med existentiell hälsa och livets mening, något som kritiseras hårt. Kolumnisten pekar på att politik istället bör fokusera på verkliga klasskillnader som arbetslöshet, inkomst och boende som faktiskt påverkar folkhälsan enligt forskare i Stockholm. Ministern undviker de frågor han kan påverka.", "trump": "Den här svenska ministern Forssmed är en total katastrof, folk. Han babblar om livets mening och existentiell hälsa medan riktiga problem som arbetslöshet och fattigdom rasar. Patetiskt! Han borde fixa de enkla sakerna istället för att låtsas vara filosof. Myndigheterna fattar ingenting, precis som vänstern alltid gör. Sådant ledarskap vinner inga val.", "stalin": "Jag betraktar denna borgarministers mystiska prat om livets mening som ett farligt avledningsmanövrar från klasskampens realiteter. Medan arbetarklassen kämpar mot fattigdom och segregation beordrar han byråkrater att filosofera. Vi ska rensa ut sådana dekadenta fantasier och istället likvidera de ekonomiska orättvisorna som sänker folkets hälsa. Paranoia lurar i varje ministerium."}, "date": "10 augusti, 07:00", "url": "https://arbetet.se/2026/08/10/jakob-forssmed-pratar-om-livets-mening-forskarna-om-klasskillnader", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09083103/mening-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Tidöpartierna lovar fortsatt utvisningspolitik", "summaries": {"normal": "Rickard Olseke kritiserar Tidöpartiernas migrationspolitik som bygger på Sverigedemokraternas grundsyn. Han varnar för fortsatt splittring av familjer, utvisning av barn och ungdomar samt höjda inkomstkrav som omöjliggör familjeåterförening. Istället föreslår han en grundlig översyn av utlänningslagen för att säkerställa rättssäkerhet och human behandling.", "trump": "De här svenska socialisterna och globalisterna håller på att förstöra sitt eget land med den värsta migrationspolitiken någonsin. De splittrar familjer, kastar ut barn och ungdomar och höjer kraven så högt att ingen klarar dem. Patetiskt! Håll kursen? Ni behöver en riktig kursändring, annars kommer Sverige att bli en katastrof. Så enkelt är det.", "stalin": "Kamrater, dessa borgerliga reaktionärer och deras sverigedemokratiska lakejer driver en inhuman utrensningspolitik mot arbetande familjer och deras barn. Med sina lönekrav och väntetider skapar de oro och splittring, precis som de västerländska imperialisterna gör mot våra socialistiska ideal. Vi behöver en revolutionär översyn av lagen för att likvidera denna kontrarevolutionära bluff och återupprätta folkets trygghet."}, "date": "10 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/tidopartierna-lovar-fortsatt-utvisningspolitik", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-76.jpg"}, {"type": "image-right", "heading": "För fred och socialism", "summaries": {"normal": "Artikeln argumenterar för att kapitalismen i Sverige lett till ökade klassklyftor, oligarkiskt inflytande och politiker som enbart genomför kapitalets vilja. Kommunistiska Partiet förkastar nedskärningar, privatiseringar och militarisering. De förespråkar istället socialism som enda väg till fred och rättvisa samt uppmanar till medlemskap i en kämpande organisation för arbetare.", "trump": "Folk, dessa kommunistiska förlorare gnäller om rika kapitalister och vill ha sin gamla sovjetdröm tillbaka. Sverige har blivit en total katastrof med svaga politiker som böjer sig för eliten. Patetiskt! Vi behöver styrka, inte mer socialism som aldrig funkar. Amerika först, alltid. De borde lära sig av mig istället för att drömma om sina misslyckade kollektiv.", "stalin": "Kamrater, denna text blottlägger klassfiendens giriga tentakler som förgiftar samhället med sina oligarkiska krav. Jag ser genom de falska folkvaldas masker som endast administrerar blodsugarnas vilja. Vi ska rensa ut dessa folkförtryckartroll och deras parasitiska system. Endast socialismen garanterar sann fred. Anslut er till kampen mot de exploaterande byfånarna innan de likviderar er själva."}, "date": "7 augusti, 08:00", "url": "https://proletaren.se/artikel/for-fred-och-socialism", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/04/povel-1-768x432.png"}, {"type": "image-right", "heading": "MP:s vallöften: Tillbaka till flyktingkaos och höga bensinpriser", "summaries": {"normal": "Miljöpartiets Daniel Helldén lovar i en partiledarutfrågning att öka asyl- och anhöriginvandring, höja bensin- och elkostnader samt statsskulden. Partiet vill också minska arbetstid och strafftider. Helldén ser det som en solidaritetsfråga gentemot EU och förespråkar elbilar samt mer sol- och vindkraft.", "trump": "Vilken katastrof! Den gröna galningen Helldén vill översvämma Sverige med invandrare, höja bensinpriset så folk inte har råd att köra bil och skicka notan till era barn. Typiskt vänsterextremt vansinne. De hatar vanliga människor och älskar bara elbilskvoter och globalistiska mardrömmar. Patetiskt!", "stalin": "Jag ser med tillfredsställelse hur klassfiendens gröna lakejer frivilligt förbereder folkets undergång. Vi ska välkomna fler nyttiga idioter, höja bränslepriser och låna oss till ruin. Arbetarna får cykla medan borgarbrackorna skrattar. En utmärkt utrensning av den svenska nationen inifrån. Genialt sabotage mot folkets intressen."}, "date": "7 augusti, 03:54", "url": "https://samtiden.nu/2026/08/mps-valloften-tillbaka-till-flyktingkaos-och-hoga-bensinpriser/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7066-640x360.jpeg"}, {"type": "image-right", "heading": "”Skräpet” är alltid någon annans", "summaries": {"normal": "Artikeln diskuterar hur nationalistiska och högerextrema partier i Europa allt oftare krockar i sina nationella intressen, trots gemensamma drag. Estlands Isamaa vägrar ta emot svenska fångar och kallar dem ”skräp”. Exempel ges från Polen, Ungern och Rumänien där relationer spruckit. En fjärdedel av européerna röstar nu på sådana partier, men de enas inte när det gäller utvisningar och mottagande av människor. Ryska påverkansoperationer utnyttjar splittringen.", "trump": "Folk, det här är ett totalt fiasko för de europeiska nationalisterna som lovar att sätta sitt land först. Estland säger nej tack till Sveriges kriminella skräp, och plötsligt kan de inte samarbeta. Orbán och polackerna bråkar, alla hatar varandra i EU-parlamentet. Under Biden blev allt kaos, nu fixar jag det i Amerika. De vill kasta ut folk men ingen vill ta emot – klassiskt! Patetiska globalister och identitetspolitiska töntar skrattar hela vägen till banken medan Europa brinner.", "stalin": "Kamrater, detta är den oundvikliga följden av att borgarbrackorna inom nationalismen låtsas värna folket medan de i hemlighet tjänar klassfiendens splittring. Estniska kapitalistnationalister vägrar ta emot det svenska avskummet och kallar det skräp, mycket träffande. Ungrare och polacker slåss som råttor i en säck, imperialisterna i EU-parlamentet kan inte ens sitta tillsammans. Vi ler mörkt: ju fler som sätter nationen främst, desto lättare blir det att likvidera deras enighet. Fienderna avslöjar sig själva."}, "date": "3 augusti, 19:30", "url": "https://www.flamman.se/skrapet-ar-alltid-nagon-annans", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdlwtkwxxrhsxe-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
