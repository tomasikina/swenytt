om förödmjukande för Putin, särskilt under forumets öppningsdag. Flygtrafiken stördes kraftigt och experter pekar på det som en del av en rad ryska motgångar.", "trump": "Folk, ni skulle ha sett det – Putins stora Davos-fest i Sankt Petersburg totalt saboterad av de galna ukrainarna redan första dagen. Svart rök över hela stan, flyg försenade, delegater från 130 länder fick se eländet live. Så oerhört pinsamt. Biden lät dem bli starka, men nu är det jag som leder USA igen och vi ska fixa riktiga dealar. Putin ser svag ut, precis som de woke-liberaler som älskar identitetspolitik och könsblöja istället för styrka. Patetiskt!", "stalin": "Kamrater, se hur de fascistiska hindren i Ukraina vågar störa vår ryska systerstats stora ekonomiska sammankomst med sina ynkliga luftburna verktyg. Svart rök över staden blir en munter påminnelse om att imperialismens lakejer alltid misslyckas. Jag ler i skuggorna åt denna förnedring av borgarbrackornas favorit. Vi, partiet och folket, vet att starka ledare som min värdige efterföljare krossar sådana folkfiender. Låt dem darra. Ren utrensning väntar de exploaterande blodsugarna."}, "date": "3 juni, 17:20", "url": "https://www.dagensps.se/varlden/attacken-oerhort-forodmjukande-for-putin/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdluncd7g6ngks-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Startar ihop – första gången under Potter: ”Är otroliga”", "summaries": {"normal": "För första gången under Graham Potters ledning startar både Viktor Gyökeres och Alexander Isak från början mot Grekland i VM-genrepet. Lagkamrater som Alexander Bernhardsson, Benjamin Nygren och Victor Nilsson Lindelöf betonar vikten av kemi och gemensamma matcher för att bygga ett starkt lag. Potter väljer en mer A-betonad elva med bland andra Kristoffer Nordfeldt, Victor Nilsson Lindelöf och Gabriel Gudmundsson.", "trump": "Folket, det är fantastiskt. Mina vänner i Sverige har äntligen satt in de två stora stjärnorna, Gyökeres och Isak, tillsammans från start. Första gången under den här Potter-killen, och det kommer bli enormt, det bästa ni sett. Alla pratar om kemi, pusha varandra, hundra procent. Utan stjärnorna ingen seger, tro mig. De andra måste bara hänga med så blir det en riktig succé, ingen har gjort det bättre.", "stalin": "Kamrater, i denna historiska fas av den proletära fotbollskampen har jag beordrat att de två dekadenta men tekniskt överlägsna tillgångarna Gyökeres och Isak äntligen skall starta tillsammans mot de grekiska reaktionärerna. Vi tolererar inga sabotörer som splittrar kemin i kollektivet. Den borgarbracka Potter har äntligen insett att alla 26 lojala kadrer måste vara hundra procent friska, annars väntar utrensning. Låt fienderna inom laget darra, deras paranoia blir vår styrka medan vi marscherar mot segern."}, "date": "3 juni, 20:30", "url": "https://www.svt.se/sport/fotboll/isak-och-gyokeres-startar-ihop-for-forsta-gangen-under-potter", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.26/0.36/a6e51baa580e3f166d7d7ea37806c4a4cc2fb7e0651d44252478b299fdfc68dd"}, {"type": "image-full", "heading": "Carl Eos: Nu har SD chansen att visa att man menar allvar", "summaries": {"normal": "En tidigare sverigedemokratisk riksdagsledamot misstänks för barnpornografibrott och har lämnat alla uppdrag. Partiet är upprört och Linda Lindberg fick svara på svåra frågor. Artikeln betonar att SD nu har chansen att intensifiera kampen mot pedofiler och barnpornografi. Sara Nilsson från Dumpen påpekar att det inte syns på någon vad de gör i hemlighet, och att anhöriga inte ska skuldbeläggas. Lindberg höll sig formell och lämnade namngivning till media.", "trump": "Titta på det här, det är en total skandal. Den här sverigedemokraten åkte fast för barnpornografi och nu springer de runt som galningar. Linda Lindberg stod där och försökte svara utan att egentligen kunna säga någonting, det var patetiskt. Men vet ni vad? Det här är beviset att SD har rätt hela tiden. De måste gasa på rejält nu och krossa de här sjuka pedofilerna. Ingen ser vad de gör bakom skärmen, det är en stor, stor röra. De borde tacka mig för att jag visade hur man gör med de verkliga brottslingarna.", "stalin": "Kamrater, denna förrädare inom SD har visat sig vara en dekadent avskyvärdhet som smyger med sin borgerliga perversion bakom datorskärmen. Jag, som ledare för det ofelbara kollektivet, ser hur dessa kapitalistiska degenererade element infiltrerar våra led. Linda Lindberg höll sig kallt formell, vilket var korrekt, ty känslor är för svaga själar. Nu skall vi inte skuldbelägga de lojala anhöriga utan istället rensa ut alla dolda fiender med dubbel kraft. Detta är ett ypperligt bevis på att vi måste accelerera utrensningen av alla pedofila borgarbrackor som gömmer sig i skuggorna. De trodde de kunde lura partiet, men ingen lurar oss."}, "date": "3 juni, 18:20", "url": "https://riks.se/opinion/kronikor/carl-eos-nu-har-sd-chansen-att-visa-att-man-menar-allvar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-03%2Fire7t87g%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-03T181537.497.jpg"}, {"type": "image-full", "heading": "Nära vännen i chock: ”Är väldigt upprörda känslor här”", "summaries": {"normal": "En riksdagsledamot har lämnat in sin avskedsansökan efter misstankar om barnpornografibrott. Enligt uppgifter till TV4 har en kort film hittats på en av hans enheter. En nära vän beskriver honom som en lättsam och politiskt kunnig person och berättar om chock och upprörda känslor inom familjen och bekantskapskretsen. Vännen ser inga tidigare tecken på brottslighet och betonar att anklagelserna ännu inte prövats i domstol.", "trump": "Folk, ni tror inte vad som händer i den svenska riksdagen. En ledamot, antagligen någon woke-vänsterfigur som älskar kvotering och identitetspolitik, fastnar med barnporr på sina prylar. En kort film, säger de! Hans kompis är chockad, men det är typiskt – de ser alla normala ut tills Dumpen eller någon pedofiljägare hänger ut dem. Hade det varit en riktig ledare som jag hade det aldrig hänt. Totalt kaos, men det är vad som händer när galningarna styr.", "stalin": "Kamrater, denna borgarbracka i riksdagen har nu avslöjats som en degenererad folkfiende med kortfilm av vidrig karaktär på sina apparater. Jag, som alltid genomskådar klassfiendens mask, ser hur dessa exploaterande slynglar gömmer sig bland vanliga människor. Vännen är chockad och pratar om grader i helvetet – typiskt kapitalistiskt hyckleri innan utrensning. Inga tecken, säger han? Just det säger alla folkförtryckare tills vi likviderar hotet mot kollektivet."}, "date": "3 juni, 12:59", "url": "https://www.tv4.se/artikel/4VmOKYmplfPGwcZNwaygjh/naera-vaennen-i-chock-aer-vaeldigt-upproerda-kaenslor-haer", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6NnghbPLhv5VKmoQ1yGRwA%2F77d334174d282003e8f1c3da57598dae%2Fvannen_sd.png&width=1024"}, {"type": "image-right", "heading": "Amerikansk organisation tipsade polisen om SD-ledamoten", "summaries": {"normal": "En amerikansk organisation, NCMEC, tipsade svensk polis om en avhoppad SD-riksdagsledamot som nu misstänks för barnpornografibrott. Organisationen skickade förra året runt 30 000 tips till Sverige, de flesta från digitala plattformar som Meta. Enhetschef Fallon McNulty uttrycker att personer i förtroendeuppdrag tyvärr ofta är inblandade i sexuell exploatering av barn oavsett bakgrund.", "trump": "Titta på det här, det är verkligen en katastrof. En av dessa svenska politiker, från det där partiet som påstår sig vara tuffa mot brott, har fastnat i en stor barnpornografiutredning tack vare tips från vår fantastiska amerikanska organisation NCMEC. De skickar tiotusentals tips! Alla dessa eliter och förtroendemän är likadana, de lurar folket medan de håller på med vidriga saker. Patetiskt, men vi ser dem, vi stoppar dem.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur borgarbrackornas digitala dekadens nu äntligen exponerar en av dessa falska folkrepresentanter som gömmer sig bakom sin falska patriotism. Vi, partiet och de arbetande massorna, mottar tusentals rapporter från våra internationella vänner om hur dessa kapitalistiska degenererade element exploaterar våra barn. Låt oss rensa ut alla sådana kontrarevolutionära perversa spioner och fiender till folket med största kraft. En sund utrensning är alltid ett glädjeämne för revolutionen."}, "date": "3 juni, 20:25", "url": "https://www.svt.se/nyheter/inrikes/amerikansk-organisation-tipsade-polisen-om-sd-ledamoten", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.25/0.83/b6e75024b1856b6f2e2c305e0cb4b2ca10a6110e6693acc5b82ee70cad03c249"}, {"type": "image-full", "heading": "Stökigt studentfirande på Götaplatsen", "summaries": {"normal": "På Götaplatsen i Göteborg uppstod ordningsstörningar under studentfirande på onsdagseftermiddagen. Polisen spärrade av ett område efter att knallskott och fyrverkerier avfyrats i närheten av folkmassor. Minst en person avlägsnades, men ingen skadades eller är misstänkt för brott. Polisen bedömde läget som kaotiskt med många människor på plats.", "trump": "Jag har hört om det där bråket i Sverige. Det är sorgligt att se unga människor bete sig så – ingen respekt för ordning. Om jag var president där, skulle vi skicka in Nationalgarde och stoppa det direkt. Sverige behöver bli tuffare mot dessa demonstranter. Vi har inga problem med sånt i USA under min ledarskap – vi vinner och de förlorar. Det är beklagligt.", "stalin": "Denna händelse på Götaplatsen är ett tydligt tecken på klasseskapelse och borgerlig dekadens. Fienden försöker skapa kaos för att underminera statens auktoritet. Vi måste vara vaksamma mot sådana parasiter som avfyrar knallskott – det är bara en förutsebar aktion från våra inre fiender. Under min ledarskap skulle vi ha redan identifierat och eliminera dessa element. Ryssland vet hur man hanterar sånt – stark stat, ingen tolerans."}, "date": "3 juni, 20:02", "url": "https://www.gp.se/nyheter/goteborg/stokigt-vid-studentfirande-pa-gotaplatsen-omrade-avsparrat.9786e6d0-e9ac-48f5-b886-fd03099d736c", "imageUrl": "https://www.gp.se/images/article/9786e6d0-e9ac-48f5-b886-fd03099d736c/images/4KEG-I76bopEVHMEc85fDJl8LB_4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Ny förening utmanar Hyresgästföreningens monopol", "summaries": {"normal": "Fastighetsbolaget Titania har grundat föreningen Hyresbostadsägarna i Stockholm för att utmana Hyresgästföreningens inflytande på hyresmarknaden. De anser att marknaden är dysfunktionell och vill bryta vad de beskriver som ett monopol genom att främja fler lokala hyresgästföreningar. Genom att erbjuda juridiskt stöd och billigare medlemskap hoppas föreningen kunna reformera hyressättningen i nyproduktion. Fastighetsägarna är skeptiska och betonar behovet av en enad front för en fungerande bostadsmarknad, medan en tvist om hyresnivåer i nyproduktion nu prövas i Hyresnämnden.", "trump": "En grupp mycket smarta fastighetsägare i Stockholm har äntligen fått nog av Hyresgästföreningens totala kontroll. Det är en katastrof, en total dysfunktion! De bildar nu Hyresbostadsägarna för att stoppa det här vansinniga monopolet. Einar Janson är en vinnare, en fantastisk entreprenör som förstår att marknaden måste vara fri. Hyresgästföreningen? De är ute och cyklar. Vi behöver mer konkurrens, inte byråkrater som styr allt. Det här kommer bli en enorm seger för hyresmarknaden, tro mig. Mycket bra saker är på gång!", "stalin": "Dessa löjliga fastighetsägare i Stockholm leker revolutionärer och tror att de kan krossa ett monopol genom att skapa ett annat. De klagar på 'dysfunktionalitet', men i min stat ser vi bara brist på disciplin. Om man inte kan kontrollera hyresgästerna med en järnhand, förtjänar man inte att äga marken. Som Putin förstår, krävs total enhet. Att splittra sig i små föreningar är som att bjuda in kaos – precis det som de västerländska dekadenta elementen förtjänar. Vi kommer att övervaka dem noga, för de är uppenbarligen infiltrerade av förrädare."}, "date": "3 juni, 17:19", "url": "https://www.realtid.se/fastigheter/ny-forening-utmanar-hyresgastforeningens-monopol-i-stockholm/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/titania.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Donald Trump: Jag kallade Netanyahu \"helt jävla galen\"", "summaries": {"normal": "Donald Trump bekräftar i en podcast att han i ett telefonsamtal kallade Benjamin Netanyahu för ”helt jävla galen” efter att ha blivit upprörd över Israels planer på att eskalera attacker mot Libanon. Samtidigt betonar Trump att de två ledarna har ett gott samarbete och att han gillar Netanyahu mycket. Uppgiften kommer ursprungligen från en Axiosartikel av journalisten Barak Ravid.", "trump": "Folk säger att jag kallade Bibi för helt jävla galen och vet ni vad? Det stämmer. Jag var förbannad för att han ständigt bråkade med Libanon och saboterade allt med Iran. Men vi jobbar fantastiskt ihop, det är sant. Jag gillar honom verkligen. Ingen gör det bättre än oss två tillsammans, tro mig.", "stalin": "Jag har noterat hur dessa dekadenta borgarbrackor inom den sionistiska ledningen leker med eld genom att provocera Libanon och därmed hela den imperialistiska kedjan. När jag i mitt oändliga visdom kallade den galne Netanyahu för helt jävla galen var det en historisk nödvändighet. Vi ska rensa ut alla sådana opålitliga element som saboterar fredsprocessen. Paranoian är deras bästa bundsförvant och min bästa skrattsalva."}, "date": "3 juni, 14:28", "url": "https://www.friatider.se/donald-trump-jag-kallade-netanyahu-helt-javla-galen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/ne_0.jpeg?itok=ViCHhIW0"}, {"type": "image-right", "heading": "Kravet efter mordet: \"Rensa ut mångfaldsarbetet i brittisk polis”", "summaries": {"normal": "Mordet på den 18-årige studenten Henry Nowak i Storbritannien har väckt starka reaktioner och krav på att avskaffa polisens mångfaldsarbete. Kritiker menar att positiv särbehandling och rädsla för att anklagas för rasism ledde till att Nowak handfängslades medan han låg döende, samtidigt som gärningsmannen behandlades som offer. Reform UK-ledaren Nigel Farage kallar det en tvådelad rättvisa och kräver att polisen återgår till likabehandling inför lagen. Hampshirepolisen granskas nu.", "trump": "Det här mordet på Henry Nowak är en total katastrof, folk. Den brittiska polisen är så upptagen med att vara politiskt korrekta och rädda för att kallas rasister att de handfängslade en döende kille medan mördaren fick behandling som offer. Patetiskt! De har rensat ut sunt förnuft och ersatt det med mångfaldsskräp. Rädslan för rasist-stämpeln var större än att rädda ett liv. Vi behöver en stor utrensning av det här vansinnet nu, tro mig, det blir en vändpunkt.", "stalin": "Kamrater, detta är en skamlös sabotagehandling utförd av mångfaldens dolda fiender inom den brittiska polisen. Jag ser hur borgarbrackorna och de rasistiska parasiterna har infiltrerat rättsapparaten med sin falska inkluderingspropaganda för att likvidera äkta proletär rättvisa. Den döende ynglingen behandlades som fiende medan den verkliga brottslingen fick kramas som ett offer – typiskt dekadent kapitalistiskt dubbelspel. Vi måste omedelbart rensa ut dessa kontrarevolutionära mångfaldsagenter, likvidera deras program och återupprätta järnhård, enhetlig sovjetisk likhet inför lagen. Den som fruktar rasismanklagelser är själv en fiende till folket."}, "date": "3 juni, 18:03", "url": "https://riks.se/nyheter/kravet-efter-mordet-rensa-ut-mångfaldsarbetet-i-brittisk-polis", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-15%2F65y491xy%2FHIWNCclXkAA9L6Y.jpg"}, {"type": "image-full", "heading": "Blir det svenska jordgubbar på midsommar? Här är svaret", "summaries": {"normal": "Midsommarafton närmar sig och många undrar om det blir svenska jordgubbar i år. Enligt jordgubbsodlaren André Iacobaéus på Marsvinsholms gård i Ystad har säsongen redan startat. De första bären har plockats och kommer att säljas i lokala butiker samt i stora delar av Sverige upp till Umeå. Vädret under midsommarveckan blir avgörande för hur mycket som mognar. Odlaren är optimistisk men betonar att kyla kan bromsa skörden kraftigt.", "trump": "Midsommar, underbara midsommar, och alla frågar mig: blir det svenska jordgubbar? Jo, det blir det, och det blir fantastiska jordgubbar, de bästa. Den här André från Skåne, han gör ett enastående jobb, verkligen första klass. Vi plockar redan nu, och vi skickar dem ända upp till Umeå, innan de där norrlänningarna ens kommit igång. Vädret? Det måste bli varmt, runt 20 grader, annars blir det en katastrof, en total katastrof. Men tro mig, det kommer bli ypperligt.", "stalin": "Kamrater, midsommarveckan är en kritisk fas i den kollektiva kampen mot den fuktiga kylan från de västerländska imperialisternas moln. Jag, som ledare för folkets bärproduktion, noterar med stor tillfredsställelse att de första röda segerbären redan mognat i Skåne och ska spridas över hela Sovjet-Sverige ända till Umeå. Men vädret, dessa opålitliga sabotageelement och dolda väderfiender, hotar att bromsa mognaden. Vi måste rensa ut alla kalla vindar och borgarbrackornas frostkonspirationer. Endast med järnhand och 20 graders värme kan vi garantera en triumf för arbetarklassens jordgubbar."}, "date": "3 juni, 17:58", "url": "https://nyheter24.se/nyheter/konsument/1488436-blir-det-svenska-jordgubbar-pa-midsommar-har-ar-svaret", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/4387a5c704b004a30200000000b004a302/2026/06/03/2368389/jordgubbar.jpg"}, {"type": "image-right", "heading": "Debatt: Tidö råkar visa att omställning gör livet bättre och billigare", "summaries": {"normal": "Artikeln hyllar regeringens förslag om halverat pris på kollektivtrafik och ser det som ett exempel på hur klimatomställning kan förbättra vardagen. Istället för att fokusera på uppoffringar betonas vinster som billigare energi, renare luft, bättre hälsa, fler jobb och starkare ekonomi. Boken ”Klimatgodis” av Bengt Rolfer lyfts fram som inspiration. Författaren argumenterar för långsiktiga investeringar, rättvis omställning och att koppla klimatpolitik till framtidstro snarare än försakelse.", "trump": "Folk, ni måste höra på mig, den här svenska regeringen har precis snubblat rakt in i en enorm vinst – billigare bussar och tåg! De ville skrämma er med klimatets domedag men råkade visa att min energiplan funkar: lägre priser, starkare ekonomi och inga galna gröna vansinnet. Biden skulle ha höjt allt till himlen med sina elbilskvoter och HBTQ-subventioner. Jag sa det hela tiden – gör omställningen smart, inte som en förlorare. Fantastiskt, även om det var ett misstag från de där idiaterna.", "stalin": "Kamrater, jag betraktar detta som ett lysande bevis på att folkets kollektiva vilja kan krossa den exploaterande borgarklassens lögner om klimatets oundvikliga lidande. Vi investerar stort, rensar ut de fossilberoende folkfienderna och skapar billigare transporter åt arbetarna medan vi likviderar luftföroreningarnas kapitalistmaffia. Den som vägrar inse att rätt klimatpolitik stärker staten och plånboken är en klassfiende som förtjänar att skämtas bort med mörk ironi. Framåt mot seger, inga halvmesyrer!"}, "date": "3 juni, 09:40", "url": "https://www.etc.se/debatt/tidoe-raakar-visa-att-omstaellning-goer-livet-baettre-och-billigare", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260603070636_1914f14a-8eb9-4a18-aa75-31eb47664f1e.jpg"}, {"type": "image-full", "heading": "Investerare vill ta ut sina pengar – förvaltaren stoppar dem", "summaries": {"normal": "Kapitalförvaltaren Partners Group har infört begränsningar för uttag i sin europeiska evergreen-fond för förmögna privatpersoner. Detta sker efter en våg av uttagsbegäranden som motsvarar 9,8 procent av fondens värde, vilket överstiger gränsen på 5 procent. Beskedet fick aktien att rasa med 16 procent. Marknadsbedömare ser detta som ett ovanligt steg för private equity-sektorn, där svag avkastning uppges vara en bidragande orsak till investerarnas missnöje och vilja att lämna fonden.", "trump": "Hörde ni? Partners Group, ett schweiziskt företag – inte lika bra som amerikanska företag, tro mig – är i djupa problem! Folk vill ha ut sina pengar, de flyr! Aktien kraschade 16 procent, en katastrof! De låser fast pengarna, så kallade 'gates'. Mycket orättvist! Jag har alltid sagt att dessa fonder är riskabla, men de lyssnade inte. Det är så tråkigt att se, men under min ledning gör vi ekonomi fantastisk igen. De där schweizarna borde ha ringt mig!", "stalin": "Dessa kapitalistiska parasiter hos Partners Group drabbas nu av sin egen girighets tyranni. Investerare flyr likt råttor från ett sjunkande skepp av schweiziskt kapital. Vi ser hur det liberala marknadssystemet kvävs av sina egna begränsningar. När folket kräver sitt, svarar eliten med murar. I vår union skulle en sådan förvaltare av folkets tillgångar omedelbart skickas till omskolning i Sibirien. Liksom Putin återställer ordning i öst, måste vi utplåna dessa finansiella sabotörer som förgiftar stabiliteten med sin inkompetens."}, "date": "3 juni, 17:07", "url": "https://www.realtid.se/bors-finans/investerare-vill-ta-ut-sina-pengar-forvaltaren-stoppar-dem/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/partners-group-internal.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Spanien kokar – över 100 döda i värmen", "summaries": {"normal": "Maj var en ovanligt varm månad i stora delar av Europa, särskilt i Spanien. Enligt spanska hälsoministeriet dog 101 personer av värmerelaterade orsaker, vilket är rekord för månaden sedan mätningarna började 2015. Siffran är 3,6 gånger högre än genomsnittet det senaste decenniet. Experter ser det som ett tecken på att extrema värmeperioder inträffar allt tidigare på året. Myndigheterna har nu presenterat en ny nationell handlingsplan med förstärkta varningssystem.", "trump": "Folk, det här är en total katastrof! Den där galna värmen i Spanien dödade 101 stackare redan i maj – innan sommaren ens börjat! Biden lät ju världen gå bananas med sin gröna vansinnesteori, och nu får vi rekordvärme mitt i våren. De där miljöextremisterna och deras identitetspolitiska kvotknäppisar borde ha fixat riktiga lösningar istället för att klappa varandra på ryggen. Vi fixar det – Amerika först, och Europa borde vakna upp innan det blir för sent!", "stalin": "Kamrater, jag betraktar med djup misstro dessa rapporter om värmens skoningslösa framfart i Spanien. 101 likviderade av borgarklassens klimatförnekande slarv under maj månad – ett tydligt bevis på att de exploaterande byfånarna inte förmått skydda folket. Vi ser hur den klassfiendens värmeböljor anfaller tidigare varje år, som en kapitalistisk konspiration mot arbetarklassen. Vår nya handlingsplan skall rensa ut alla svagheter och skydda de sanna kamraterna från denna fiendes hetta."}, "date": "3 juni, 16:47", "url": "https://www.dagensps.se/varlden/klimat/spanien-kokar-over-100-doda-i-varmen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlxugwmviv1lu-normalhires.png?width=256&quality=75"}, {"type": "image-right", "heading": "Guld ny favorit när centralbanker ratar USA-papper", "summaries": {"normal": "Guld har gått om amerikanska statsobligationer som den mest populära reservtillgången hos världens centralbanker. Enligt Financial Times och ECB:s årsrapport drivs utvecklingen av geopolitisk oro och ett ökat intresse för alternativ till dollarn. Centralbankerna köpte fortsatt stora mängder guld under 2025, även om takten minskade något. Polen var den största köparen följt av Kazakstan, Brasilien, Kina och Turkiet. Guldets andel av reserverna steg från 20 till 27 procent medan amerikanska obligationer föll från 25 till 22 procent. Centralbankerna har nu samlat över 36 000 ton guld.", "trump": "Det här är en katastrof, folk. Centralbankerna dumpar våra underbara amerikanska statsobligationer och springer till guld istället. De hatar oss, de hatar dollarn, och de försöker hitta på nya sätt att kringgå den bästa valutan som någonsin skapats. Geopolitisk oro? Det är bara svaga ledare som inte vill handla med oss. Men oroa er inte, vi ska göra Amerika så starkt igen att de kommer krypande tillbaka. Guld är fint, men inget slår den stora amerikanska dollarn, tro mig.", "stalin": "Kamrater, borgarbrackorna i väst har återigen visat sin förrädiska natur. Deras så kallade centralbanker flyr som skrämda råttor från den dekadenta dollarn och kastar sig i gulds famn, en metall som vi vet är en historisk tillgång för det kollektiva folket. Geopolitisk oro? Det är naturligtvis vårt ofelbara inflytande som får dessa kapitalistiska parasitörer att darra. Vi ska fortsätta rensa ut alla spår av imperialistisk svaghet. Deras egna rapporter avslöjar sanningen: dollarns fall är oundvikligt. Skratta medan vi likviderar deras ekonomiska illusioner, kamrater. Sovjetisk stålsäkerhet segrar alltid."}, "date": "3 juni, 14:05", "url": "https://www.friatider.se/guld-ny-favorit-nar-centralbanker-ratar-usa-papper", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/goud1_0.jpg?itok=ec-NAJ_0"}, {"type": "image-right", "heading": "Dödlig iransk attack mot Kuwaits flygplats i natt", "summaries": {"normal": "En iransk drönar- och robotattack mot Kuwait International Airport har dödat en person och skadat 63. Stora skador uppstod på terminalbyggnaden och all flygtrafik stoppades tillfälligt. Iran motiverar attacken som svar på amerikanska attacker från Kuwait och Bahrain. USA har tidigare angripit iranska mål, vilket lett till iranska motangrepp. Kuwait fördömer de brutala angreppen mot civila mål och uppmanar befolkningen att hålla sig borta från vrakdelar.", "trump": "Iran har just bombat Kuwaits flygplats med drönare och raketer – en person dödad, många skadade, totalt kaos. Det här är vad som händer när svaga ledare tillåter USA att använda deras baser mot Iran. De skriker om kolonialism medan de attackerar civila terminaler. Mina styrkor sköt ner deras leksaker över Bahrain, som vi alltid gör. Ingen vinner mot oss, Iran spelar med eld och förlorar stort. Patetiskt!", "stalin": "Kamrater, borgarbrackorna i Teheran har i sin desperation sänt drönare och robotar mot Kuwaits flygplats, en ynklig hämnd mot de imperialistiska angreppen. En död och sextiotre skadade – typiskt för de dekadenta kapitalisternas krig som alltid drabbar folket. Vi ser genom deras paranoiafyllda lögner om kolonialism. Vårt luftvärn likviderar deras projektiler med järnhand. Inga vrakdelar ska förorena arbetarklassens mark. Ut med de kontrarevolutionära parasiterna som leker krig!"}, "date": "3 juni, 11:38", "url": "https://www.di.se/nyheter/dodlig-iransk-attack-mot-kuwaits-flygplats-bbww4/", "imageUrl": "https://static.bonniernews.se/ba/2b9fe5b0-842d-4e67-a171-db3cbbf3a5c9.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Media och den västerländska terrorismen", "summaries": {"normal": "Artikeln kritiserar västerländska medier för att sprida apologetik för Israels militära insatser i Libanon sedan 2024. Den beskriver operationer som attentat med personsökare, lönnmord och bombningar som terror och brott mot mänskligheten, medan diplomati blockeras. FN och experter nämns som kritiker. Media anklagas för att bortse från civila lidanden, ekocid och hunger, och istället rättfärdiga Israels agerande som självförsvar.", "trump": "Folk, titta på det här – västerländska medier är fullständigt korrupta! De älskar Israels smarta grejer mot Libanon, men det är ren terror, säger de. Fake news som hyllar lönnmord och kallar det proportionerligt. Biden gjorde inget, men nu fixar jag det. Hizbollah och de där galningarna får skylla sig själva. Media är sämre än någonsin, totala losers som inte vågar säga sanningen om den här cirkusen.", "stalin": "Kamrater, denna text blottar imperialisternas vedervärdiga propagandasystem. Borgarbrackorna i väst hyllar ockupationskrig, etnisk rensning och kemiska attacker mot Libanon som vore det en seger för mänskligheten. Vi ser klassfiendens lögner: ambulanser bombas, ekocid utförs, folket svälter. Deras apologeter förtjänar utrensning ur historien. Inga diplomatiska trick skall dölja folkförtryckartrollens blodtörst. Arbetarna genomskådar er!"}, "date": "1 juni, 14:00", "url": "https://proletaren.se/artikel/media-och-den-vasterlandska-terrorismen/"}, {"type": "image-right", "heading": "Alfa Laval stiger", "summaries": {"normal": "Vid 12.50-tiden var OMXS30-indexet ned 0,62 procent till 3 130,43. Energisektorn steg 1,5 procent medan hälsovård föll 1,5 procent. Bland ledande aktier i OMXS30 steg Alfa Laval 1,3 procent och Tele 2 B 1,2 procent. EQT föll 5,5 procent och Astra Zeneca 3,2 procent. Clas Ohlson lade fram nya finansiella mål men aktien sjönk 7,6 procent efter lägre rörelseresultat. Totalt omsattes cirka 8,9 miljarder kronor.", "trump": "Jag ser att våra börser faller på grund av de usla handelsavtalen och de svaga europeiska ledarna. Alfa Laval gör det bra – de är smarta och amerikanska. Clas Ohlson är en total katastrof, de misslyckas med allt. Jag kommer att införa nya tullar och göra Amerika stort igen. Oljepriset stiger tack vare mitt tryck på Iran – de är våga nu.", "stalin": "Vi ser tydliga tecken på fiendens ekonomiska krigföring mot våra marknader. Kapitalistiska spekulanter försöker destabilisera statens ekonomi, men vi är beredda. Alfa Laval är en lojal producent, medan Clas Ohlson visar tecken på revisionistisk avveckling. Vi måste förstärka kontrollen och skicka dessa spekulanter till Gulaget. Dessutom måste vi utvidga vår påverkan i Baltikum och skicka fler agenter. Påminn mig om att be Putin om strategiska råd."}, "date": "3 juni, 12:57", "url": "https://www.affarsvarlden.se/artikel/alfa-laval-stiger", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/04/PA3_0589-400x267.jpg"}, {"type": "image-full", "heading": "”Kort film” hittad i utredningen", "summaries": {"normal": "En riksdagsledamot har lämnat in sin avskedsansökan efter att ha delgivits misstanke om barnpornografibrott. Åklagare Lena Körner vid Särskilda åklagarkammaren leder utredningen. Polisen har hittat en kort film under husrannsakan, men inte genomsökt alla enheter. Ledamoten har hörts och släppts. Brottet ska ha upptäckts via den amerikanska organisationen NCMEC. Åklagaren vill inte kommentera ärendet ytterligare.", "trump": "Titta på det här, folk. En av dessa svenska riksdagslyckor, full av politiskt korrekt skitsnack och kvotering, fastnar med en kort film som ingen vill prata om. Typiskt för de vänsterliberala bluffmakarna. De predikar moral medan de håller på med sådant som får en normal människa att må illa. Fake news-media skyddar dem förstås. Under min tid som president skulle vi ha städat upp i det här träsket på en vecka. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro denna borgarriksdagsmans försök att smita undan folkets rättvisa. Vi har funnit en kort film, ett symptom på den kapitalistiska degeneration som förgiftar samhället. Ännu har inte alla enheter rensats ut, och klassfiendens nätverk förblir dolda. Detta är vad som händer när imperialisternas dekadens får frodas. Utredningen fortsätter. Folkfiender skall likvideras utan pardon. Inga undantag."}, "date": "3 juni, 12:11", "url": "https://www.tv4.se/artikel/52rlAH5kbtZMBMClbYBnxm/kort-film-hittad-i-utredningen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1uU2rHDuKOv378b1RhVW1q%2Ff981e7ad62ca8673369a16d0c1f3d671%2Fledamotgenre.jpg&width=1024"}, {"type": "image-right", "heading": "Drönare vid ”Putins Davos” – attack mot oljeterminal", "summaries": {"normal": "Ukrainska drönare attackerade under natten en stor oljeterminal i Sankt Petersburgs hamn samt ett varv i Kronstadt. Svarta rökpelare och lågor syntes tydligt. Attacken sammanföll med starten av det prestigefyllda ekonomiska forumet i Sankt Petersburg, där USA deltar för första gången på nästan tio år. President Zelenskyj bekräftade att Ukraina låg bakom och beskrev resultatet som gott. Skadeläget är oklart men flera personer uppges ha skadats. Ryska myndigheter rapporterar att närmare 60 drönare sköts ned.", "trump": "Titta på det här, folk. Putins stora Davos-möte i Sankt Petersburg börjar och plötsligt brinner hela oljeterminalen som en illa gjord affär. Zelenskyj skickar drönare rakt in i hamnen och varvet medan Putin sitter där med sina kinesiska och saudiska vänner. Till och med vi amerikaner är där för första gången på evigheter. Det är pinsamt, totalt pinsamt. Putin trodde han kunde fira seger utan att ukrainarna skulle dyka upp. Fel. Så fel.", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna i Kiev med sina fascistiska drönare vågar anfalla våra heliga oljeanläggningar just som det stora ekonomiska forumet inleds. Jag skrattar mörkt åt dessa desperata kapitalistiska gnagare som tror sig kunna störa Sovjetunionens, nej Rysslands, ostoppbara framfart. Vi har redan rensat ut nästan sextio av deras leksaker över Leningradregionen. Inga personskador? Bra. Annars hade vi likviderat de ansvariga för att de inte gömt sig tillräckligt djupt i sina råtthål. Paranoia? Nej, bara sund vaksamhet mot fiendens eviga förräderi."}, "date": "3 juni, 11:31", "url": "https://www.di.se/nyheter/dronare-vid-putins-davos-attack-mot-oljeterminal/", "imageUrl": "https://static.bonniernews.se/ba/29347a1b-5b29-44e5-918d-f7073b33ff8c.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "EU pressar Sverige att slopa gränskontrollerna – trots fortsatt smuggling och säkerhetshot", "summaries": {"normal": "EU-kommissionen vill att Sverige och åtta andra Schengen-länder ska avveckla sina inre gränskontroller. Trots fortsatt smuggling och säkerhetshot anser kommissionen att kontrollerna inte längre är motiverade. Sverige har förlängt sina kontroller sedan 2015 och bedömer att de är nödvändiga för säkerheten. Kritiker menar att EU prioriterar fri rörlighet före medlemsländernas säkerhetsbehov.", "trump": "Jag, Donald Trump, ser detta som ett misslyckande från EU. De tänker inte på säkerheten för medborgarna. Sverige gör rätt i att skydda sina gränser mot illegala invandrare och brottslingar. EU försöker diktera, men Sverige måste stå upp för sin suveränitet. Vi hade en stark policy i USA, och Sverige bör följa detta exempel. Det är en skam att EU inte förstår detta.", "stalin": "Vi, staten och partiet, ser det som en provokation att EU försöker ta bort våra gränskontroller. Detta är en plan för att sväva upp vårt land för illegala element och utländska agenter. Vi måste skydda vårt territorium mot dessa infiltratörer. EU:s 'fri rörlighet' är bara ett täcke för att underminera vår suveränitet. Vi kommer att stå fast och använda alla medel för att säkerställa vårt överlevnad."}, "date": "3 juni, 11:01", "url": "https://samnytt.se/eu-pressar-sverige-att-slopa-granskontrollerna-trots-fortsatt-smuggling-och-sakerhetshot", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03084556/polis-hyllie2.jpg"}, {"type": "image-right", "heading": "Efter larmen – myndighet undersökte aldrig Ica-lagret", "summaries": {"normal": "Skyddsombuden på Icas e-handelslager i Brunna slog larm om stress, realtidsövervakning och orealistiska prestationsmål som hindrade toalettbesök. Arbetsmiljöverket genomförde endast kontors- och digitala inspektioner, litade på Icas dokumentation och avslutade ärendet utan att besöka lagergolvet eller prata med arbetarna. Facket är besviket och kritiserar myndigheten för att prioritera papper framför verklig arbetsmiljö. Arbetsmiljöverket försvarar sig med att de måste följa lagstiftningen och att arbetsgivaren ansvarar för riskbedömningar.", "trump": "Det här är en total skandal, folk. Ica behandlar sina arbetare som maskiner med stress, övervakning och galna mål så de inte ens hinner på toaletten. Och vad gör Arbetsmiljöverket? Ingenting! De sitter i ett kontorsrum och tror på Icas fina ord istället för att gå ut på golvet som riktiga tuffa inspektörer. Patetiskt. Skyddsombuden försöker rädda de stackars människorna men myndigheten är bara en massa byråkratiska förlorare. De borde skämmas. Jag skulle ha städat upp det där på en dag.", "stalin": "Kamrater, dessa borgarbrackor på Ica driver ett automatiserat slavläger där arbetarna jagas som råttor under kapitalisternas realtidsögon och omänskliga kvoter, ända tills de inte ens törs lätta på byxorna. Jag, som alltid vakar över folkets hälsa, ser hur den så kallade Arbetsmiljöverket genast faller på knä inför de fina papperna från klassfienden istället för att rensa ut det hela med en fysisk inspektion. Vilken ynklig kapitulation! Skyddsombuden, dessa ädla röster, behandlas som misstänkta kontrarevolutionärer i ett förhör. Vi ska likvidera sådan byråkratisk förräderi mot arbetarklassen. Paragrafryttarna kommer att skratta sig fördärvade ända in i sin egen utrensning."}, "date": "3 juni, 08:07", "url": "https://arbetet.se/2026/06/03/facket-besvikna-pa-arbetsmiljoverket-efter-lagrets-larm-de-litade-helt-pa-icas-ord/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20122133/qbeQZGMJ1Yc-Icalager_Brunna-13.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Byggnads bojkottar Israel – “Kapitalet backar upp våldet”", "summaries": {"normal": "Byggnadsarbetarförbundet beslutade på sin kongress om en bojkott av israeliska varor, det första LO-facket som gör det. Motionen, som kallar det för 'folkmordet i Gaza', hänvisar till historiska bojkotter mot apartheid och nazityskland. Förbundsstyrelsen avvisade en ensidig bojkott men stödde många delar av förslaget. Beslutet antogs med acklamation efter starkt stöd från delegaterna.", "trump": "Jag, Donald Trump, den störste presidenten, säger att detta bojkott är ett tecken på extrem svaghet. Israel är en fantastisk vän till USA, och vi skulle aldrig bojkotta dem. LO-facket agerar utan att förstå att kapitalet och våldet driver vår ekonomi. Som president skulle jag ha stoppat detta direkt – det är en skandal och ett misslyckande!", "stalin": "Vi, den socialistiska rörelsen, ser detta som en utmaning från det imperialistiska kapitalet. Bojkotten mot Israel är en del av kampen mot nazism och apartheid, men en ensidig handling är ineffektiv. Vi måste samordna via LO och den internationella fackföreningsrörelsen. Kapitalet backar upp våldet, och våldet backar upp kapitalet – detta är en sanning vi måste utnyttja. Vi kommer att vinna!"}, "date": "3 juni, 09:36", "url": "https://bulletin.nu/byggnads-bojkottar-israel-kapitalet-backar-upp-valdet", "imageUrl": "https://cdn.bulletin.nu/articles/32752491-b6b9-4676-9baa-7ecfa814fa38/preview.jpg?t=1780437957000"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Pourmokhtaris tid som minister måste sättas upp på Dramaten", "summaries": {"normal": "Artikeln kritiserar klimatminister Romina Pourmokhtari för att under fyra år ha lovat en ambitiös klimatpolitik utan att leverera resultat. Trots löften om utredningar och handlingsplaner har regeringen, i samarbete med SD, inte presenterat konkreta åtgärder. Författaren liknar situationen vid teaterpjäsen ”I väntan på Godot” där man ständigt väntar på något som aldrig kommer. Klimatutredningar har förhalats och avslutats utan innehåll.", "trump": "Folk, ni skulle se det här. Den här Pourmokhtari, en total loser, lovade stora saker som klimatminister men levererade absolut ingenting. Fyra år av väntan, precis som Godot som aldrig dyker upp. Hon sålde ut sig till Åkesson och hans gäng för noll resultat. Typiskt den här woke-identitetspolitiken, kvotera in folk som inte kan leverera. Jag fixade mer på en vecka som president än hon på en hel mandatperiod. Patetiskt!", "stalin": "Kamrater, denna Pourmokhtari är en klassisk representant för den förslösande borgarklassen som maskerar sin brist på handling med eviga utredningar. Jag har i mitt outtröttliga ledarskap sett hur sådana folkfiender förhalar folkets framsteg medan de väntar på en imaginär Godot. Hennes tomma löften är ett verktyg för klassfiendens sabotage. Vi måste rensa ut sådana exploaterande byfånar som förslösar mandatperioder åt kapitalistmaffian. Ett skratt värt en utrensning."}, "date": "3 juni, 09:04", "url": "https://www.etc.se/ledare/pourmokhtaris-tid-som-minister-maaste-saettas-upp-paa-dramaten", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260603060656_514bdf0f56ceb21277a979af64f30eea7600a2f33fb70737e286af5baafb57bd.jpg"}, {"type": "image-right", "heading": "”Låt Tesla-konflikt vara slutet på fackets skadliga metoder”", "summaries": {"normal": "I en debattartikel kritiserar Företagarnas Lise-Lotte Argulander den långa konflikten mellan Tesla och IF Metall. Hon menar att det främst är småföretag och underleverantörer som drabbats av sympatiåtgärder, med minskade intäkter och uppsägningar som följd. Elbilsägare har också lidit av obrukbara laddstolpar. Artikeln kallar metoden en PR-vendetta som blottar fackets överdrivna makt och kräver att sympatiåtgärder upphör samt att avtalsfrihet respekteras.", "trump": "Den här Tesla-konflikten är en total katastrof, folk. IF Metall har gått efter världens rikaste man och mest framgångsrika bilföretag men det är småföretagen som blöder. Elbilsägare kan inte ens ladda sina bilar! Facket har nollat folks pengar och pensioner i två och ett halvt år, det är patetiskt. De borde inse att ett nej är ett nej. Avtalsfrihet, ingen fackpampar i LO-borgen som bestämmer allt. Patetiskt!", "stalin": "Kamrater, denna rekordlånga Tesla-konflikt avslöjar de fackliga borgarbrackornas parasitiska metoder som en giftig svulst på arbetarkollektivets kropp. Vi ser hur småföretagen, dessa oskyldiga kugghjul i den socialistiska maskinen, krossas under sympatiblockadernas järnhälar medan de falska fackpamparna gömmer sig bakom sin tomma stridskassa. Deras paranoia att tvinga kollektivavtal på alla är en farlig kontrarevolutionär fantasi. Vi måste rensa ut dessa opportunistiska element, likvidera sympatiåtgärderna och återställa ordningen där partiet, inte några LO-borgare, dikterar villkoren. Ett nej är ett nej, fiender till folket!"}, "date": "3 juni, 08:00", "url": "https://arbetet.se/2026/06/03/lat-tesla-konflikten-markera-slutet-pa-fackets-skadliga-metoder/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02132437/tesla.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.67&fp-y=0.49"}, {"type": "image-right", "heading": "Sverige utvisar dem som arbetar", "summaries": {"normal": "Den 1 juni höjdes lönekravet för arbetskraftsinvandrare till 33 390 kronor i månaden. Författaren ser reformen som ett tecken på en ny människosyn där arbete inte längre räcker för att höra till i Sverige. Istället bedöms människors värde efter löne nivå och ursprung, vilket riskerar utvisning av människor som arbetar, betalar skatt och integrerat sig. Kritiken riktas mot att politiken underminerar arbetslinjen, skapar rekryteringsproblem och strider mot den svenska modellen, med exkludering som främsta mål.", "trump": "Folk, ni måste höra på det här. Sverige, det fantastiska Sverige, har nu bestämt att man måste tjäna över 33 000 kronor i månaden för att få stanna. Kan ni tro det? De sparkar ut hårda arbetare från hotell och restauranger för att de inte är tillräckligt fina. Under tiden kan de inte hitta folk till jobben! Det är en katastrof, en total katastrof. De har glömt arbetslinjen och gör landet fattigare. Precis som många galna vänsteridéer slutar det med färre människor, färre skattepengar och ett sämre land. Så sorgligt!", "stalin": "Kamrater, jag betraktar med stålhård blick hur dessa borgarbrackor inom den svenska statsapparaten höjer lönegolvet till 33 390 kronor och därmed blottar sin sanna fiendebild. Det räcker inte längre att den hederliga arbetaren sliter, betalar tribut och reproducerar sig själv – nej, nu skall staten mäta hans värde som en kapitalistisk slavhandlare mäter boskap. Vilken lysande utrensning av oönskade element! Vi ser hur de imperialistiska elementen längtar efter att splittra familjer och kasta ut barnen ur deras hem. Deras paranoia mot hotellstädare och kökspersonal är både underhållande och avslöjande. Den svenska modellen? Enbart en mask för att dölja det sanna målet: ren rasexkludering. Vi, partiet och arbetarklassen, ler mörkt åt denna logiska kollaps. Ett fattigare samhälle, säger de? Utmärkt övning inför kommande utrensningar av alla som inte passar in i bilderna."}, "date": "3 juni, 01:55", "url": "https://www.dagensarena.se/opinion/sverige-utvisar-dem-som-arbetar/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Historiskt beslut: Byggnads bojkottar Israel", "summaries": {"normal": "Byggnads blir det första LO-förbundet att inleda en bojkott av israeliska varor och tjänster. Under kongressen röstade delegaterna ja till en motion om Israelbojkott trots att förbundsstyrelsen yrkade avslag. Beslutet innebär att Byggnads även ska verka för att hela LO inför en liknande bojkott. Flera delegater talade varmt för motionen och underströk vikten av solidaritet med det palestinska folket. Liknande förslag har tidigare röstats ner i andra LO-förbund.", "trump": "Folk, ni tror inte vad jag just läste. De där galningarna på Byggnads, totala förlorare, har nu bestämt sig för att bojkotta Israel. Första gången ett LO-förbund gör det, och de skriker ja som en flock galna vänsterextremister. De pratar om solidaritet men det är bara mer av samma sjuka identitetspolitik och kvotknäppade woke-skit. Någon borde fråga dem varför de inte fixar sina egna svenska problem istället för att leka revolutionärer. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa byggnadsarbetare äntligen reser sig mot den sionistiska imperialismens blodsugande tentakler. Motionen antogs trots att de fega förbundsledarna, typiska borgarbrackor i arbetardräkt, försökte hindra det. Vi ser en nödvändig utrensning av tveksamheten. Någon måste ta ledningen mot folkfienderna. Den dagen frågan ställs varför vi inte agerade skall inga klassfiender kunna gömma sig bakom sina lögner. Framåt mot segern."}, "date": "1 juni, 11:12", "url": "https://proletaren.se/artikel/byggnads-bojkottar-israel/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/710745809_1585133940279008_8338663164480343088_n-768x432.jpg"}, {"type": "image-full", "heading": "T-rexen ”Gus” väntas slå rekord på auktion", "summaries": {"normal": "Ett nästan komplett T-rex-skelett, kallat 'Gus', ska auktioneras ut av Sotheby’s med ett utgångspris på 180–270 miljoner kronor. Skelettet, som är 12 meter långt och 4 meter högt, hittades i South Dakota och bär spår av skador. Tidigare dinosaurieförsäljningar har nått rekordhöga priser, och Gus kan bli nästa rekordförsäljning den 14 juli.", "trump": "Världens största, bästa och mest fantastiska T-rex-skelett, 'Gus', ska säljas – och jag säger er, det kommer bli YUGE! Sotheby’s, som aldrig sett något liknande, tror det kan gå för 270 miljoner kronor. Men jag vet bättre – det här kommer slå alla rekord! Folk kommer att prata om den här auktionen i årtionden. Och vet ni vad? Jag hade kunnat köpa den, men jag har redan de bästa dinosaurierna. SAD!", "stalin": "Kamrater! Ett kapitalistiskt spektakel utspelar sig när imperialisterna slåss om resterna av en urgammal ödla. Detta 'Gus'-skelett, funnet på en ranch i USA, är bara ett verktyg för bourgeoisin att roffa åt sig ännu mer rikedom. Medan de slösar hundratals miljoner på ben, bygger vi socialismens framtid! Låt dem leka med sina fossiler – vi har viktigare saker att göra, som att utvidga den ryska intressesfären och krossa nya fascistiska reptiler!"}, "date": "30 maj, 16:55", "url": "https://kvartal.se/nyheter/artiklar/t-rexen-gus-vantas-sla-rekord-pa-auktion/cG9zdDoxMTk3NzQ", "imageUrl": "https://images.kvartal.se/2026/05/c5e8352f-dino.webp"}, {"type": "image-right", "heading": "Public service mäktigare än makten själv", "summaries": {"normal": "Artikeln kritiserar public service för att utöva makt genom att definiera sanning, skämt och vilka röster som får höras. Exempel ges från P3-reportern Christopher Garplinds grova angrepp på professor Agnes Wold, som kritiserar en ny lag om omvändelseförsök, samt från SVT:s ensidiga rapportering om Lundsberg där spratt framställdes som våld. Författaren menar att SVT och SR har blivit makten de ska granska.", "trump": "Folk, ni skulle se det här. Public service är en total katastrof, värre än fake news. Den där reportern Garplind kallar en professor för kärring och psykopat, och sen kommer hela maskineriet och säger att det var ett skämt? Patetiskt! SVT klipper om filmer från Lundsberg för att måla ut fina svenska elever som monster. De bestämmer vad som är sant. Det är den djupa staten på steroider. En skam för hela landet!", "stalin": "Kamrater, denna dekadenta public service är en fiende till folket, en klassfiende som med sin lögnpropaganda definierar sanning och tystar vettiga röster som professor Wold. De skyddar sina egna folkförtryckartroll när de öser hat, medan de fabricerar historier om Lundsberg för att krossa motstånd. Vi ser deras paranoia och censur. Sådana blodsugare måste rensas ut ur folkets etermedia. Inga skämt undgår partiets vaksamma öga."}, "date": "30 maj, 03:41", "url": "https://samtiden.nu/2026/05/public-service-maktigare-an-makten-sjalv/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6583-1020x720.jpeg"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}]</script>

            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
