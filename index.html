ljarder när svenskt godis går viralt", "summaries": {"normal": "Jönköpingsbaserade Bubs har blivit ett globalt fenomen efter att ha gått viralt på Tiktok, särskilt i New York. För att möta den enorma efterfrågan på svenskt lösgodis har ägaren Orkla valt att köpa den nederländska tillverkaren CCI för 2,3 miljarder kronor. Köpet, som förväntas slutföras under 2026, syftar till att utöka produktionskapaciteten. Framgången beskrivs som en effekt av 'lipstick effect', där konsumenter unnar sig prisvärd vardagslyx i osäkra ekonomiska tider.", "trump": "Svenskt godis, Bubs, vinner i Amerika – det är fantastiskt! Folk i New York älskar det, de köar som aldrig förr. Orkla köper nu upp ett europeiskt bolag för miljarder, en enorm affär, tro mig. Det är mycket smart. Det är vad vi kallar vinnande, gott godis som gör folk glada när ekonomin är tuff. Ingen gör godis som svenskarna, och under min ledning ser vi till att affärerna blomstrar. Det blir en enorm framgång, kanske den största någonsin!", "stalin": "Dessa löjliga geléfiskar från Sverige sprider sig som en kapitalistisk pest över kontinenten. Orkla försöker köpa sig till inflytande genom att sluka fabriker i Nederländerna för miljarder, en desperat manöver för att dölja hur de förslavar massorna med socker. Denna 'lipstick effect' är bara ett annat ord för folkets andliga förfall. Vi i staten betraktar denna expansion med förakt; låt dem sälja sitt godis. När hungern väl slår till på riktigt kommer de att ångra varje sockerbit."}, "date": "1 augusti, 14:06", "url": "https://www.realtid.se/bors-finans/makro/bubs-febern-i-usa-orkla-satsar-miljarder-nar-svenskt-godis-gar-viralt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/bubs.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Tvärnit för tyska bilar – ”känns i hela Europa”", "summaries": {"normal": "Europeiska biltillverkare drabbas av vikande vinster, sänkta prognoser och uppsägningar av tiotusentals anställda. Den tyska bilindustrin har tappat stora marknadsandelar i Kina och halkade efter i elektrifieringen. Volkswagen, Audi, Mercedes-Benz och BMW har alla rapporterat dystra siffror, vilket skapar psykologiska och ekonomiska ringar på vattnet i hela Europa. Enda ljusglimten är Ferrari som höjt sin prognos tack vare stark efterfrågan på sin nya elbil i Kina.", "trump": "Titta på de där tyska bilarna, det är en total katastrof. De förlorar stort i Kina, vinsterna rasar och de sparkar ut tiotusentals arbetare. De hoppade på elbilsgrejen för sent, precis som jag alltid sagt. Nu skakar det i hela Europa. Enda som klarar sig är Ferrari, de gör det bra, fantastiska bilar. De andra borde ha lyssnat på mig, då hade de vunnit stort istället för att förlora miljarder.", "stalin": "Kamrater, de tyska kapitalisterna har äntligen avslöjat sin svaghet. Deras bilfabriker krymper, vinsterna förvandlas till aska och tiotusentals lönearbetare ska rensas ut som förrädiska element. Kina har krossat deras illusioner medan de sov under elektrifieringens falska flagg. Borgarbrackorna i Volkswagen och Mercedes skriker nu i panik. Vi ler mörkt åt deras fall. Endast den italienska lyxmaskinen visar att vissa dekadenta produkter ändå kan locka de kinesiska klassfienderna. Vi noterar detta med största misstänksamhet."}, "date": "2 augusti, 12:30", "url": "https://www.di.se/bil/tvarnit-for-tyska-bilar-kanns-i-hela-europa", "imageUrl": "https://static.bonniernews.se/ba/e81155a2-188d-4629-a7c6-9f263e75311f.jpg?crop=7003%2C3939%2Cx0%2Cy200&auto=webp&width=120&quality=70"}, {"type": "text", "heading": "Stockholmsbörsen avslutar veckan uppåt", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en uppgång på 0,42%, nående en ny rekordnivå. OMXS30-indexet stängde på 3 246,92. Finanssektorn presterade bäst, medan telekom längst ned. Bland större aktier steg EQT och Addtech, medan Hexagon och Telia föll. Svenska sparare köpte flera förlorare som Investor och Ericsson, medan Evolution såldes. Flera företag genomförde förvärv, inklusive Lifco och Hexpol.", "trump": "Jag har hört att Stockholmsbörsen gjorde det bra igen, en fantastisk uppgång på 0,42%. Vi vinner stor, folks. Finanssektorn är het, precis som under min administration. Ericsson valdes av NTT Docomo för 5G – ett enormt lyft för dem, och för Amerika. Vi har de bästa affärerna, de största förväxlarna. Sverige gör det bra, tack vare mig.", "stalin": "I den stora kampen för ekonomisk överhöghet har Stockholmsbörsen återigen visat sin lojalitet – en uppgång på 0,42%, en ny rekord. Finanssektorn, våra trogna soldater, marscherar framåt, medan telekom, en feghet, faller tillbaka. Vi har organiserat förvärv som är som våra operationer i Ukraina – Lifco och Hexpol expanderar, och Ericsson får ett kontrakt med NTT Docomo, en liten seger för vår teknologiska överhöghet. Men vi måste vara på vakt, fiendska lurar i skuggorna, försöker att underminera vårt stora projekt."}, "date": "31 juli, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-avslutar-veckan-uppat"}, {"type": "image-full", "heading": "Åkesson: M vill hellre förlora snyggt än vinna fult", "summaries": {"normal": "Jimmie Åkesson kritiserar Socialdemokraternas negativa valrörelser och personangrepp, som han jämför med propaganda. Han anklagar Moderaterna för att vara för försiktiga och ovilliga att använda tuffa metoder, vilket han menar gör dem svaga i opinionen. Åkesson ger dock statsminister Ulf Kristersson ett relativt gott betyg men efterlyser en mer offensiv strategi från Moderaterna inför valet.", "trump": "Jag måste säga, det här är fantastiskt! Jimmie Åkesson, smart kille, han ser precis vad jag alltid har sagt – vänstern spelar smutsigt, väldigt smutsigt! Och Moderaterna? Oj oj oj, alldeles för svaga, alldeles för rädda. De vill förlora snyggt istället för att vinna stort, precis som jag alltid vinner stort! Kristersson? Inte så illa, men han behöver verkligen ta i lite mer. Vi vet alla hur man vinner, eller hur, folks?", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förfall i den kapitalistiska demokratins förklädnad. Socialdemokraterna, dessa hycklande propagandister, sprider lögner som råttor sprider pest. Och Moderaterna? Svaga, rädda små bourgeoiser som hellre slickar fiendens stövlar än krossar dem. Ulf Kristersson? En medioker byråkrat, inte värdig att nämnas i samma andetag som våra stora ledare. Vi behöver järnhård disciplin och en offensiv som krossar fienden – precis som vi gjorde i Ukraina, fast bättre!"}, "date": "2 augusti, 10:20", "url": "https://kvartal.se/nyheter/artiklar/akesson-m-vill-hellre-forlora-snyggt-an-vinna-fult/cG9zdDoxNTY1MzA", "imageUrl": "https://images.kvartal.se/2026/08/c34dc556-akessonsommar.webp"}, {"type": "image-full", "heading": "Här är nya lagarna som träder i kraft", "summaries": {"normal": "I Sverige trädde flera nya lagar i kraft den 1 augusti. Elever måste lämna in mobiler under skoldagen, och straffen för gängkriminalitet dubblas. Ett nytt brott, missbruk av offentlig ställning, införs för tjänstemän. Samtidigt ska operatörer stoppa bedrägerisamtal, och Sverige stärker sitt samarbete med Nato genom att tillåta militära åtgärder på svenskt territorium.", "trump": "Jag, Donald Trump, älskar dessa nya svenska lagar! Mobilförbud i skolan – bra, eleverna ska lära! Dubbla straff för gäng – precis vad vi behöver. Nytt brott för tjänstemän – de som sviker folket måste åka dit. Bedrägerisamtal stoppas – självklart! Och starkare Nato-samarbete – Sverige blir säkrare. Amerika först, men Sverige gör det rätt!", "stalin": "I den stora kampen mot fienderna, Sverige inför nya lagar: mobiler tas från eleverna för att förhindra spionage, straff för gäng dubblas som en lektion för de som vågar utmana staten, tjänstemän som missbrukar sin ställning straffas hårt – precis som i vårt kära Sovjet. Bedrägerisamtal stoppas, och Nato-samarbetet stärks, vilket påminner om imperialistiska utsträckningar. Vi, Stalin, ser detta som en seger för proletariatet och en varning till alla som hotar vår fred."}, "date": "2 augusti, 09:30", "url": "https://bulletin.nu/har-ar-nya-lagarna-som-trader-i-kraft", "imageUrl": "https://cdn.bulletin.nu/articles/afd53ac4-f90a-4604-a5aa-2120cd73122b/preview.jpg?t=1785655449000"}, {"type": "image-full", "heading": "Musk kan tvingas sälja allt i Kina – om jätteaffären ska gå i lås", "summaries": {"normal": "Tesla undersöker möjligheter att separera eller sälja sin kinesiska verksamhet för att minska geopolitiska risker och bana väg för en potentiell sammanslagning med SpaceX. Eftersom SpaceX är en viktig försvarsleverantör för USA skapar Teslas närvaro i Kina regulatoriska spänningar. Trots att Musk avfärdat uppgifterna som falska, pågår enligt uppgifter planering för att skydda bolagen från konflikter mellan USA och Kina. Kina står för en betydande del av Teslas försäljning, vilket gör en separation komplex.", "trump": "Elon Musk, en mycket smart kille, leker med elden i Kina. De säger att han kanske säljer av Teslas kinesiska delar. Bra! Vi vill inte ha amerikansk teknologi och rymdhemligheter i händerna på Kina – de stjäl allt. Mitt Kina-avtal var det bästa någonsin, och nu ser vi att stora bolag måste vakna. Musk kallar det fake news, men jag vet hur det fungerar. Amerika först! Vi ska bygga våra raketer och bilar här, inte där.", "stalin": "Elon Musk, denna kapitalistiska gycklare, försöker nu dansa på två stolar mellan sina amerikanska krigsmaskiner och den kinesiska marknaden. Han darrar inför stormakternas paranoia! Precis som vi ser i vår brorson Putins tappra kamp mot västlig infiltration, kräver historien renhet. Om Musk tror att han kan köpa sig fri från USA:s byråkratiska bojor genom att stycka upp sitt imperium, så misstar han sig. Förräderi mot hemlandet eller den kinesiska staten? Valet är hans, och straffet är oundvikligt."}, "date": "1 augusti, 13:30", "url": "https://www.realtid.se/bors-finans/musk-kan-tvingas-salja-allt-i-kina-om-jatteaffaren-ska-ga-i-las", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlkejmvq0lkuo-normalhires1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "Olof K Gustafsson döms i amerikansk domstol", "summaries": {"normal": "Olof K Gustafsson döms till fyra års fängelse i USA för bedrägeri. Han marknadsförde falska produkter under Pablo Escobars namn, skickade till exempel guldfolierade telefoner till influencers för att skapa falskt intresse. När kunder beställde så skickade han istället ägarblanketter eller böcker för att skapa bedräglig documentation. Gustafsson, tidigare vd för Escobar Inc, erkände sig skyldig till sex åtalspunkter, inklusive bedrägeri och penningtvätt. Han måste dessutom betala 25 000 dollar i böter och 1,3 miljoner dollar i skadestånd.", "trump": "Jag, Donald Trump, ser att en svensk bedragare, Olof Gustafsson, döms till fyra års fängelse. En totalt misslyckad kopia av min framgång med Escobar Inc. Han skickade ut falska telefoner till influencers – jag skulle aldrig bli avslöjad på det sättet. En loser som försökte leva på en död knarkkung. Nu betalar han 1,3 miljoner dollar. Som jag alltid säger: när du blir avslöjad, är det över. Han erkände sex åtalspunkter – en svaghet jag aldrig skulle visa.", "stalin": "Vi, statens och partiets oövervinnliga försvarare, har identifierat en svensk parasitsvamp, Olof Gustafsson, som försökte undergräva vårt system genom bedrägeri under Pablo Escobars skugga. Hans aktiviteter – skickande av tomma kuvert och falska dokument – avslöjades av våra lojala allierade i spansk och amerikansk polis. Han döms till fyra års arbetsterapi i det imperialistiska USA. Hans erkännande av sex åtalspunkter är ett tecken på hans totala moraliska och ideologiska kollaps. Vi gratulerar våra vänner i Moskva för deras stöd i denna sak."}, "date": "1 augusti, 23:54", "url": "https://www.gp.se/nyheter/varlden/olof-k-gustafsson-doms-till-fangelse-i-usa.fd930529-f2a7-44c3-8475-1781162ebdf0", "imageUrl": "https://www.gp.se/images/article/fd930529-f2a7-44c3-8475-1781162ebdf0/images/2H6vn2joRAeDCyk8dAWuNlHHtNno-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Åkessons krav på Spanien: Stäng gränsen", "summaries": {"normal": "Sverigedemokraternas ledare Jimmie Åkesson kräver att Spanien omedelbart stänger gränsen mot Ceuta efter att tiotusentals illegala invandrare tagit sig in. Om inte bör Spanien uteslutas ur Schengen och gränserna stängas. Åkesson kallar händelsen en invasion som hotar hela Schengensamarbetet. Även Italiens premiärminister Giorgia Meloni och Liberalernas ledare Simona Mohamsson kräver åtgärder från EU. Gränserna är nu stängda och militär samt Frontex har kallats in.", "trump": "Folk, det här är en katastrof. Spanien har just låtit tusentals illegala strömma in som en invasion, och vad gör de? Ingenting! Jag säger stäng gränsen NU, annars sparkas de ut ur Schengen så fort att det svänger. Den där överenskommelsen är trasig, precis som jag alltid sagt. Europa håller på att falla ihop. Meloni fattar det, hon är smart. Vi behöver starka ledare, inte svaga som låter invasionen fortsätta. Patetiskt!", "stalin": "Kamrater, denna fega kapitulation inför de fascistiska horderna vid Ceuta är ett verk av borgarbrackornas underminerande sabotage mot folkets gränser. Jag, som ledare för det proletära kollektivet, kräver omedelbar utrensning av alla svaga element inom den spanska apparaten. Den så kallade Schengen-överenskommelsen är nu ett verktyg för kontrarevolutionära krafter och måste likvideras innan parasiterna sprider sig som råttor. Vi ska rensa ut dessa invasionssympatisörer med järnhand och ett leende. De kommer att lära sig vad verklig gränskontroll innebär."}, "date": "31 juli, 10:46", "url": "https://www.friatider.se/akessons-krav-pa-spanien-stang-gransen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-595.jpg?itok=s0dcoEQF"}, {"type": "image-full", "heading": "Experten: EU extra sårbart när migranter används som vapen", "summaries": {"normal": "Enligt experten Paul Levin vid Stockholms universitet kan migrantkrisen i Ceuta vara ett exempel på ”migrant weaponization”, där stater använder migration som politiskt vapen. På några dagar tog sig 60 000 personer från Marocko till den spanska exklaven. De flesta har återvänt, men runt 70 migranter har omkommit. Ukraina har identifierat en stor rysk propagandakampanj kring krisen. Levin menar att Europa är extra sårbart eftersom migration är en polariserad fråga. Flera europeiska ledare, bland dem Ulf Kristersson, har krävt ett EU-krismöte.", "trump": "Folk, det här är en total katastrof! De använder stackars migranter som levande vapen mot det svaga, sönderfallande Europa. Marocko skickar tiotusentals människor som en armé och de dumma EU-byråkraterna vet inte vad de ska göra. Ryssland skrattar medan de pumpar ut propaganda. Jag sa det redan under min förra mandatperiod – de här globalisterna och deras öppna-gränser-galenskap gör er till måltavlor. Biden sov sig igenom det, nu sitter jag här och fixar det som de andra aldrig klarade av. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de imperialistiska hyenorna i Europa skördar frukterna av sin egen klassfiendepolitik. Borgarbrackorna har skapat en polariserad migration som nu används mot dem själva. Det är en utmärkt lektion i dialektik. Ryska propagandakamrater utför ett ypperligt arbete för att blotta dessa folkfienders svaghet. De som skickar migranter som kanonmat förtjänar ingen pardon. Vi ler mörkt åt deras naivitet medan vi stärker statens järnhand mot alla yttre hot."}, "date": "1 augusti, 21:02", "url": "https://www.tv4.se/artikel/1IsBcRinfotieKcpwxBDr5/experten-eu-extra-sarbart-naer-migranter-anvaends-som-vapen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F66LoU6WuZwgHBzbbq0WN7B%2F9823bb67b32cf0b64dd6db265c725e91%2FPAUL_LEVIN.jpg&width=1024"}, {"type": "image-right", "heading": "Pedro Sánchez rasar mot utspelen: ”Polariserande”", "summaries": {"normal": "Spaniens premiärminister Pedro Sánchez kritiserar skarpt europeiska ledare för deras utspel efter migrantvågen i Ceuta. Han anser att reaktionerna drivs av fördomar, falska nyheter och inrikespolitik. Sánchez betonar att Spanien snabbt återtog kontrollen över gränsen, gav humanitär hjälp och returnerade nästan alla migranter med marockansk hjälp. EU håller krismöte på tisdag efter krav från bland annat Sverige, Italien, Danmark och Tyskland. Spanien har nu upprättat en flytande barriär vid gränsen.", "trump": "Vilken röra de där europeiska förlorarna ställt till med! Jag, som vunnit valet stort både 2016 och 2024, ser hur Sánchez springer runt som en galning och försöker styra upp sin egen invasion. De här globalistiska nollorna i EU gnäller om polarisering när de borde bygga en mur – en riktig mur, inte någon sjaskig flytande grej. Meloni och Kristersson har rätt, men resten är bara patetiska svaga ledare som låter migranterna springa rakt in. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta borgarbrackor inom EU angriper den spanska arbetarregeringen med sin reaktionära parasitism. Medan vi under ledning av partiet snabbt återtar kontrollen och likviderar hotet mot kollektivets gränser, sprider klassfienderna lögner och falska nyheter. Deras själviska, polariserande utspel är ett hot mot hela folkets enhet. Vi ska rensa ut dessa exploaterande byfånar som vågar ifrågasätta statens auktoritet. Inga kompromisser!"}, "date": "1 augusti, 21:01", "url": "https://www.tv4.se/artikel/pjrNeBIRwfn1y53qIXGub/pedro-sanchez-rasar-mot-utspelen-polariserande", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlN_P2dLrXdaY%2F07a13b4f3dc77107b34682f4a4cdd189%2FSpaniens_premiarminister_Pedro_Snchez._Arkivbild._&width=1024"}, {"type": "image-full", "heading": "Underbarnet satsade miljarder på AI – sedan rasade allt", "summaries": {"normal": "Den 22-årige AI-investeraren Leopold Aschenbrenner har sett sin fond, Situational Awareness, drabbas av en dramatisk nedgång. Efter att ha belånat fonden för att satsa tungt på AI-aktier tvingades han sälja tillgångar för 20 miljarder dollar när marknaden vände och långivaren Goldman Sachs krävde återbetalning. Fonden har krympt från 30 till 8 miljarder dollar. Aschenbrenner erkänner nu sina misstag och lovar att sluta använda belåning i framtida investeringar.", "trump": "Den här unga killen, Aschenbrenner, trodde han var ett geni. Han satsade allt på AI, totalt misslyckande! Han lånade pengar av Goldman Sachs – som jag känner väl – och sen kraschade allt. 20 miljarder dollar borta på ett dygn! Det är vad som händer när man inte vet vad man gör. Citadel fick kliva in och städa upp röran. Mycket svagt! Man måste ha en vinnarmentalitet, inte den här sortens förlorarstrategi. Sorgligt, men sant!", "stalin": "Ännu ett exempel på det kapitalistiska kaoset. Den unge Aschenbrenner, denna så kallade 'visionär', har förslösat rikedomar på spekulationer om maskiner som lovar guld och gröna skogar. När marknadens nycker vände, tvingades han sälja ut allt till de stora parasiterna på Citadel. Det är en läxa för alla som tror på marknadens frihet istället för statens stålhand. Vi i staten observerar detta misslyckande och konstaterar att medan västvärldens spekulanter faller, bygger vi vår industri med disciplin och järnvilja."}, "date": "1 augusti, 12:42", "url": "https://www.realtid.se/bors-finans/underbarnet-satsade-miljarder-pa-ai-sedan-rasade-allt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/skarmavbild-2026-08-01-kl-103813.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Ny flagga i Precise Biometrics nyemission", "summaries": {"normal": "Precise Biometrics genomför en företrädesemission på 110 Mkr, med netto 96 Mkr efter kostnader. Emissionen är 90,7% säkerställd via garantier. Teckningskursen är 0,82 kr, och aktien handlas nära denna nivå, vilket kan tyda på brist på rabatt incitament. Bristande transparens kring garantier och försäljning av säljoptioner kritiserats. Emissionsguiden hissade en ny flagga för aktiekursen.", "trump": "Jag, Donald Trump, säger att denna emission är en vinst för Amerika. Vi gör det stort, men aktiekursen är för låg – mycket sorgligt. Vi kommer att fixa det, som vi alltid gör. Garantierna är fantastiska, men transparensen? Vi ska visa dem hur man gör det rätt. Vi vinner, som vanligt.", "stalin": "Vi i partiet ser att denna emission är som en fjäder i hatten på en imperialistisk fiende. Vi har byggt en mur av garantier, men i skuggorna lurar de med säljoptioner – ett tecken på sabotage. Vi kommer att rensa upp, som Putin gör i Ukraina. Det är en kamp för statens överlevnad, och vi vinner alltid."}, "date": "31 juli, 16:11", "url": "https://www.affarsvarlden.se/artikel/ny-flagga-i-precise-biometrics-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/Precise-Biometrics1-400x267.webp"}, {"type": "image-right", "heading": "Emir häktas – misstänks för attack mot S-lokal och närbutik", "summaries": {"normal": "En 36-årig man vid namn Emir Nuredini har häktats på sannolika skäl misstänkt för försök till grov mordbrand och skadegörelse. Natten till den 29 juli attackerades Socialdemokraternas partilokal i Sölvesborg samt en närbutik på samma gata. Mannen erkänner skadegörelse men nekar till att ha försökt utföra mordbrand.", "trump": "Hörni, det här är ett totalt fiasko för de svenska socialisterna. En kille går till attack mot Sleepy Joes partilokal mitt i natten, tänder på och förstör deras lilla röda högkvarter plus en närbutik. Han erkänner skadegörelse men säger att det inte var mordbrand. Typiskt. Sverige är inte längre säkert, det är en katastrof. De borde ha lyssnat på mig.", "stalin": "Kamrater, denna fega kontrarevolutionära element har med sin pyromaniska sabotageverksamhet riktat ett angrepp mot arbetarklassens parti och en folkets butik. Jag ser borgarbrackornas dolda hand bakom detta försök att undergräva folkets enhet. Han erkänner skadegörelse men förnekar mordbrand? Typiskt fiendens lögnaktiga taktik. Vi ska rensa ut alla sådana dekadenta element med järnhand och ett leende. Sovjet... eh, folket segrar alltid."}, "date": "1 augusti, 02:00", "url": "https://riks.se/nyheter/emir-haktas-efter-forsok-till-brandattentat-mot-s-lokal-och-narbutik", "imageUrl": "https://admin.riks.se/uploads/32fc9875_e37c_4ed0_b56b_71ef2f5bbb3c_0fe4d09e7a.jfif"}, {"type": "image-right", "heading": "Fable Media utser ny VD", "summaries": {"normal": "Fable Media har utsett Carl Magnusson till ny VD från den 1 augusti. Magnusson är redan operativ chef och fortsätter i den rollen. Nuvarande VD Alexander Pettersson lämnar posten men fortsätter som finanschef. Styrelseledamot Frederik Cardel Falbe-Hansen berömmer Petterssons arbete och menar att Magnusson är rätt person för att leda bolaget in i en ny fas med fokus på operativt genomförande och tillväxt.", "trump": "Som Donald Trump, den bäste ledaren, ser jag att Fable Media har utsett Carl Magnusson till VD – en fantastisk man, mycket duktig. Alexander Pettersson, en bra chef, blir finanschef, det är ett smart drag. Jag skulle ha gjort det lika, kanske bättre. Fable Media kommer att blomstra under Magnusson, det är enormt. Som jag säger, jag vet hur man vinner, och det här är en vinnande beslut.", "stalin": "I den revolutionära processen har Fable Media utsett Carl Magnusson till operativ huvud, en man av oerhörlig trogenhet. Alexander Pettersson, en lojal finansier, fortsätter som finanschef. Vi har befäst den ekonomiska strukturen, som en bastion mot fiendens infiltratörer. Detta är en seger för proletärerna, för staten. Parallellt med Putins expansion, vi skall öka vår makt – tillväxt är vår lag. Fienden är inom oss, och vi skall utrota honom."}, "date": "31 juli, 15:52", "url": "https://www.affarsvarlden.se/artikel/fable-media-utser-ny-vd", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/images-7.jpg"}, {"type": "image-right", "heading": "Alex Jones: Avsätt Trump", "summaries": {"normal": "Alex Jones, tidigare en stark allierad till Donald Trump, kräver nu att presidenten avsätts med stöd av det 25:e tillägget eller genom riksrätt. Anledningen är Trumps agerande mot Iran, som Jones anser är ett odeklarerat krig som saknar kongressens godkännande. Han varnar för att regeringen förbereder allmän värnplikt inför en stor markinvasion och kritiserar ett stort försvarspaket som bland annat slår samman USA:s och Israels försvarsindustrier. Jones uppmanar vänster och höger att enas mot vad han kallar ett förestående tyranni.", "trump": "Den där galningen Alex Jones har helt tappat greppet. Han var en av mina största fans, nu plötsligt vill han avsätta mig med det 25:e tillägget för att jag skyddar Amerika från Iran. Kongressen? De gör ingenting, som vanligt. Han babblar om värnplikt och invasioner som inte ens existerar. Detta är bara en annan löjlig konspiration från en kille som säljer kosttillskott. Fake news och dåliga betyg, Alex. Amerika är starkare än någonsin under min ledning – inga ursäkter!", "stalin": "Kamrater, denna fega radiohögtalare Jones har nu blottat sig som en motrevolutionär parasit i borgarklassens tjänst. Han ropar på avsättning av ledaren och vänder sig mot nödvändiga försvarsåtgärder mot den iranska faran. Vi ser genom hans paranoia: han vill rensa ut den sanna revolutionära ordningen med sina konspirationer om värnplikt och censur. Vi ska likvidera sådana dekadenta element som försöker splittra folket. Låt honom skrika – hans utrensning blir underhållande när vi nationaliserar hans lögner och skickar hans följeslagare till historiens sophög. Triumf åt kollektivet!"}, "date": "31 juli, 09:41", "url": "https://www.friatider.se/alex-jones-stall-trump-infor-riksratt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/jones_0.jpg?itok=A85mNIDB"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Ansiktsskanning ska kontrollera bärplockarna: ”Upp till bevis”", "summaries": {"normal": "Thailändska bärplockare i Kramfors måste nu skanna ansiktet sex gånger om dagen med en mobilapp för att kontrollera arbetstider. Systemet införs av företaget Nordlivs Produktion efter kritik om fusk och exploatering. De nya kollektivavtalen ger betalt först efter en viss bilfärd och syftar till att säkerställa att reglerna följs. Både fack och myndigheter ser positivt på förändringarna och kommer att kontrollera att villkoren efterlevs under sommaren.", "trump": "Titta på det här, det är helt galet. Thailändska bärplockare i Sverige ska skanna ansikten sex gånger om dagen med en app, som om de vore i ett stort, fult övervakningsrike. De säger att det är för att stoppa fusk, och det är ju bra, men sex gånger? Det låter som ett system byggt av förlorare. Jag skulle ha gjort det bättre, billigare och med mycket mindre skanning, tro mig. Nu är det upp till bevis, som de säger. Patetiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna i det svenska bärföretaget tvingas införa ansiktsskanning sex gånger dagligen för att rensa ut de latmaskar och sabotageelement som tidigare förgiftat skörden. Papper och penna, säger de? Det var naturligtvis en dekadent kapitalistisk fälla av fukt och lögner. Nu övervakar vi arbetarna med stålhård disciplin. De som klagar är troligen kontrarevolutionära bärplockande trotskister som längtar efter den gamla slavhandeln. Vi ska likvidera allt sådant avskum med ett leende. Det blir en lysande seger för kollektivet."}, "date": "30 juli, 06:00", "url": "https://arbetet.se/2026/07/30/ansiktsskanning-ska-kontrollera-barplockarna-upp-till-bevis", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29100426/barplokcare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/image0-scaled-e1784886958121-768x433.jpeg"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
