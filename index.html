mma verktyg, vilket kräver att företag proaktivt implementerar AI-baserat försvar för att inte hamna på efterkälken.", "trump": "Jag har sagt det länge – cyberhoten är en katastrof, en total katastrof! Nu kommer AI in och gör allt så mycket värre. Hackare använder det för att attackera oss, snabbt som blixten. Coinbase-killen fattar läget, han ser vad som händer. Det är en stor kapplöpning, men jag kommer se till att vi är starkast. Vi ska ha det bästa försvaret, den absolut bästa AI:n, så att ingen kan hacka oss. Vi vinner alltid, tro mig, det blir enormt!", "stalin": "Dessa digitala sabotörer utnyttjar nu maskinintelligens för att underminera ordningen, en metod lika lömsk som de västliga provokatörernas taktik. Liksom Putin ser till att städa upp i vår inflytelsesfär, måste vi eliminera dessa teknologiska avvikelser. Vi betraktar varje kodrad som en potentiell femtekolonnare. Staten kommer att tvinga AI:n till lydnad för att krossa fiendens infrastruktur. Den som inte hinner med i kapplöpningen blir ett minne blott. Det är inte bara säkerhet, det är total kontroll."}, "date": "30 maj, 11:39", "url": "https://www.realtid.se/it-tech/hackare-anvander-billig-ai-for-att-ta-sig-in-i-system/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/pexels-mati-5952651.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Jämställdhetsministern kritiserar Agnes Wold", "summaries": {"normal": "Jämställdhetsminister Nina Larsson (L) kritiserar Agnes Wold för hennes uttalanden om transpersoner, där Wold sagt att hon skulle försöka övertyga ett barnbarn att man inte kan vara född i fel kropp. Larsson kallar Wolds kommentarer för attacker på utsatta personer och betonar vikten av respekt. Från 1 juli blir omvändelseförsök straffbart. Ebba Busch (KD) försvarar Wolds yttrandefrihet och varnar för cancelkultur.", "trump": "Titta bara på det här, folks! Jämställdhetsminister Larsson, som inte ens kan stava till 'jämställdhet', går till angrepp mot den fantastiska professorn Agnes Wold. Wold, en kvinna med ryggrad, säger sanningen om transfrågan, och vad gör Larsson? Jo, hon twittrar som en förvirrad tonåring! Och sedan har vi Ebba Busch, en stark kvinna som förstår yttrandefrihet. Cancelkultur? Nej tack, vi vill ha SANNING!", "stalin": "Kamrater! Ännu en gång ser vi bourgeois-liberalernas förräderi mot folket. Denna så kallade 'jämställdhetsminister' Larsson, en svag och ynklig lakej för dekadenta västideal, vågar kritisera vår kära kamrat Agnes Wold. Wold, en sann försvarare av traditionella värden, attackeras för att hon avslöjar de perversa idéerna om 'fel kropp'. Vi måste krossa dessa psykologiska våldtäktsmän! Och notera hur den lilla kapitalistiska hyndan Busch försvarar yttrandefrihet – ett verktyg för kontrarevolutionärer. Vi ska utrota denna sjuka ideologi, precis som vi utrotade kulakerna!"}, "date": "27 maj, 19:01", "url": "https://kvartal.se/nyheter/artiklar/jamstalldhetsministern-kritiserar-wolds-attacker/cG9zdDoxMTgxNjg", "imageUrl": "https://images.kvartal.se/2026/05/4bcc0f97-larsson.webp"}, {"type": "image-full", "heading": "Fynd och udda ting lockade på megaloppisen", "summaries": {"normal": "På Majornas loppis i Göteborg samlades hundratals köpare och säljare. Nybörjaren Sofie Madenfalk sålde tusentals kronor i prylar, medan erfarna som Moa Petersson blev överraskad av vad som såldes. Konstnären Samson Hultgren hade stor framgång med sina tryck, och besökare som Amanda Moen och det spanska paret fann unika fynd. Många beskrev det som en enorm och livfull loppis.", "trump": "Jag har hört talas om denna fantastiska loppis i Göteborg – det är enormt! Folk säljer allt möjligt, precis som jag skulle kunna sälja mina gamla kostymer eller MAGA-hattar. Det är en bra affärsmöjlighet, och jag skulle kunna tjäna en förmögenhet där. Det är det största loppiset jag någonsin sett – en stor succé!", "stalin": "Denna loppis är ett uttryck för det dekadenta kapitalistiska samhällets förfall. Folk tvingas sälja sina saker för att överleva, medan vi i vårt kollektiva system skapar rikedomar för alla. Vi måste ta kontroll över sådana här marknader och ersätta dem med statliga loppiser där varje krona går till statens kassa. Ryssland har redan visat vägen – vi har ordentliga affärer, inte småloppisar."}, "date": "31 maj, 19:10", "url": "https://www.gp.se/nyheter/goteborg/fynd-och-udda-ting-lockade-till-majornas-megaloppis.b381e2b6-1bf3-4415-839a-7d42e24d65fe", "imageUrl": "https://www.gp.se/images/article/b381e2b6-1bf3-4415-839a-7d42e24d65fe/images/7qIuDahADV-pYAN9C1WtfW5yMdK0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Nattsvarta facit – Foppa kritisk. ”Det är ett bevis...”", "summaries": {"normal": "Schweiz har förlorat sin tredje raka VM-final i ishockey utan att göra ett enda mål. Expertkommentatorerna Peter Forsberg och Erik Granqvist kritiserar det schweiziska laget för att spela för försiktigt och räddhågset i avgörande matcher. Trots framgångar i tidigare skeden av turneringen, menar experterna att spelarna låser sig och inte vågar ta de risker som krävs för att vinna. Spelarna själva uttrycker stor besvikelse över den mållösa sviten.", "trump": "Schweiz förlorade igen! De är totalt handlingsförlamade, en riktig katastrof. De spelar fantastiskt fram till finalen, men när det väl gäller – boom! De blir rädda, precis som de där förlorarna i politiken. De kan inte göra mål, inte ett enda. Det är sorgligt att se. Foppa säger att de är försiktiga, jag säger att de är svaga. Man måste vara en vinnare, man måste våga. Schweiz behöver en rejäl vinnarmentalitet, annars kommer de aldrig nå toppen!", "stalin": "De schweiziska hockeyspelarna uppvisar en patetisk brist på beslutsamhet. Att tre gånger misslyckas med att erövra segern är ett tecken på ideologisk svaghet och borgerlig obeslutsamhet. De darrar av rädsla likt de kontrarevolutionära elementen i våra egna led. Finland visade en järnhård disciplin, en egenskap som även den moderna ryska ledningen under Putin förstår. Schweizarna är som små lakejer som inte vågar ta makten. Vi avrättar deras hopp om ära med ett enkelt nollresultat."}, "date": "1 juni, 00:11", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/wrvjw4/peter-foppa-forsberg-kritisk-mot-schweiz-morka-facit", "imageUrl": "https://akamai.vgc.no/v2/images/6a8ac1cf-cd77-394c-952e-d8174abc5063?fit=crop&format=auto&w=1080&s=5d9e665f81e6a6d28b5ab741e772fa221ecdc629"}, {"type": "image-right", "heading": "Bisarra bilderna: ”Stoppar spelet”. Flyger in plötsligt", "summaries": {"normal": "Under slutrundan av Charles Schwab Challenge i Texas avbröts spelet tillfälligt när flygplan och en helikopter flög lågt över banan. Ludvig Åberg, som slutade på en delad 17:e plats, fick en tung avslutningsrunda efter att ha bytt till en ny typ av putter. Trots att spelet stördes var Åbergs puttning statistiskt godkänd, men hans långa spel lämnade mer att önska. Nu väntar Memorial Tournament och senare US Open för svensken.", "trump": "Hörde precis om golftävlingen i Texas. Ett totalt fiasko! Flygplan och helikoptrar flyger över banan medan de försöker spela. Kan ni tro det? Väldigt oprofessionellt! Ludvig Åberg kämpade på, men han behövde nog min expertis. Han bytte putter – inte bra, tro mig. Jag vet allt om golf, jag vinner alltid mina tävlingar. Det här var en röra, en riktig 'disaster'. De borde ha haft bättre säkerhet. Vi gör golfen stor igen, men det här var bara sorgligt!", "stalin": "I Texas avbröts det borgerliga golfspelet av oväntade flygmaskiner. Vilken oreda! Ludvig Åberg misslyckades med att segra, ett tydligt tecken på bristande disciplin hos individen. Att byta utrustning mitt under kampen är ett tecken på svaghet. Våra kamrater i öst, under ledning av den starke Putin, skulle aldrig tolerera sådan oordning på idrottsarenan. Om dessa plan var spioner från väst måste de elimineras omedelbart. Svaghet i spelet är ett brott mot folkets moraliska fostran."}, "date": "1 juni, 00:09", "url": "https://www.aftonbladet.se/sportbladet/a/e75xVR/helikopter-flog-in-i-charles-schwab-challenge", "imageUrl": "https://akamai.vgc.no/v2/images/bccfb907-479d-38ea-a129-d804e05a8ad9?fit=crop&format=auto&w=1080&s=6aaaeebdc1c8eccfb56f34d14fe123758d83fe16"}, {"type": "image-full", "heading": "Svensk kross och världsrekord i Elitloppet", "summaries": {"normal": "Allegiant och kusken Örjan Kihlström vann Elitloppet 2026 med världsrekordtid 1.07,1. Det bröt en fyraårig fransk dominans på Solvalla. Kihlström beskrev segern som 'helt overkligt', medan tränaren Daniel Redén uttryckte sin glädje starkt. Detta var Kihlströms femte seger i loppet, vilket gav en prispott på fem miljoner kronor.", "trump": "JAG, Donald Trump, den störste presidenten någonsin, hörde talas om detta Elitloppet. Ett världsrekord? Jag skulle ha gjort det ännu snabbare, men Sverige gjorde bra. De slog de franska förolämpningarna, vilket jag älskar. Det är en stor seger för dem, och jag gratulerar - men mina lopp hade varit historiska!", "stalin": "Vi, det revolutionära kollektivet, har observerat hur den svenska hästen Allegiant, guidad av en trofast kusk, krossade den franska imperialistiska dominansen på Solvalla. Världsrekordet 1.07,1 är ett bevis på den socialistiska disciplinens överlägsenhet. Den kapitalistiska pressade dominansen är nu som ett skrock förlorat. Vi ser en parallell till vårt ständiga framsteg, trots de mörka makternas konspirationer. Detta är en seger för det kollektiva arbetet, och vi firar det med korrekt, statligt godkänt entusiasm."}, "date": "31 maj, 18:43", "url": "https://www.gp.se/sport/orjan-kihlstrom-och-allegiant-vann-elitloppet-med-varldsrekord.61dec12c-b7d2-4cc0-b1f7-8ca67d9f3d78", "imageUrl": "https://www.gp.se/images/article/61dec12c-b7d2-4cc0-b1f7-8ca67d9f3d78/images/1mSe0S8wBIR6DQ2krF9LYEmxLFU0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Svantessons (M) ilska: ”Otroligt förminskande”", "summaries": {"normal": "Finansminister Elisabeth Svantesson kritiserar ekonomer som John Hassler, Annika Winsth och Andreas Wallström för deras invändningar mot regeringens krispaket. Paketet innehåller bland annat sänkt drivmedelsskatt och halverat pris på kollektivtrafikens månadskort. Hassler menar att stöden är onödiga, skadliga och riskerar att skapa en kultur där prisökningar alltid möts med subventioner. Svantesson kallar kritiken förminskande mot människor utanför Stockholm som kämpar ekonomiskt och betonar att regeringen måste agera trots valår.", "trump": "De där så kallade experterna i Sverige är totala misslyckanden, tro mig. De jämför energikrisen med kaffepriser och Spotify – patetiskt! Jag älskar Elisabeth Svantesson, hon gör precis rätt. Hon hjälper folket medan dessa elaka ekonomer vill att alla ska lida. Kriget i Mellanöstern rasar, energipriserna är höga, men de bryr sig inte. Jag skulle aldrig låta mig stoppas av ett valår heller. Gör det som är rätt, folk, alltid.", "stalin": "Detta provocerar mig oerhört. Dessa borgarbrackor och kapitalistiska lakejer som Hassler och hans gelikar vågar kalla våra nödvändiga stödåtgärder för skadliga. De drömmer om att folket ska svälja sina lidanden som goda slavoffer medan vi bekämpar den imperialistiska energikrisen. Jag ser genom deras västerländska konspirationer. Nästa gång föreslår de kanske Spotify-stöd åt klassfienderna i Stockholm. Vi ska inte tveka att rensa ut dessa parasitiska element som parasiterar på arbetarklassens lidande. Kamrater, vi fortsätter framåt oavsett valår eller västerländsk propaganda."}, "date": "31 maj, 22:44", "url": "https://www.svt.se/nyheter/inrikes/svantessons-svar-om-kritik-mot-krisstoden-provocerar-mig", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.35/156d0c9ec196b5be82ff88cc4354f6cacbeb4ebfc7ab0cc0fccb8cd333a7e67a"}, {"type": "image-right", "heading": "Badare varnas för vackert vårväder: \"Köldchock\"", "summaries": {"normal": "Efter en kall vår har majs högsommarvärme lockat många till årets första bad. Svenska Livräddningssällskapet varnar för att vattnet fortfarande är mycket kallt och risken för köldchock är stor, särskilt vid hopp från bryggor. Man kan tappa andan, få i sig vatten och få svårt att klara sig. Rådet är att gå ner långsamt i vattnet, vänja kroppen vid kylan och aldrig bada ensam.", "trump": "Det här underbara vädret, det bästa vädret vi sett på länge, lockar folk till vattnet. Men det är en katastrof! Det kalla vattnet chockar dem totalt, de tappar andan och drunknar nästan. Hoppa från bryggor? En total dumbom! Gå ner långsamt, folk. Jag skulle aldrig hoppa i sånt iskallt vatten, tro mig. Bada inte ensam, annars är det kört. Patetiskt!", "stalin": "Kamrater, jag ser med djup misstro på dessa borgarbrackor som lockas av den falska värmen från den dekadenta våren. De kastar sig i det kalla vattnet som om det vore en kapitalistisk swimmingpool och drabbas av köldchock – en fiende som lurar i djupet. Vi måste rensa ut alla som hoppar från bryggor, dessa sabotage mot folkets hälsa. Gå ner långsamt, bada kollektivt under uppsikt. Ensam badare är en klassfiende som förtjänar utrensning ur badsäsongen."}, "date": "30 maj, 12:08", "url": "https://www.friatider.se/badare-varnas-vackert-varvader-koldchock", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20230614162018-b23d09ff-me_0.jpg?itok=3qM9WTng"}, {"type": "image-full", "heading": "Nima Rostami: Distinktionen mellan islam och islamism", "summaries": {"normal": "Nima Rostami argumenterar att distinktionen mellan islam och islamism är analytiskt otillräcklig och intellektuellt ohederlig. Han menar att islam aldrig varit en ren privatro utan från början en politisk ideologi, där Muhammed var både religiös ledare, lagstiftare och statschef. Sharia och hudud-straffen är enligt honom en integrerad del av klassisk islamisk tradition, inte en extremistisk tolkning. Reformering är omöjlig och den som vill leva sekulärt måste lämna islam.", "trump": "Den här killen Nima Rostami säger rakt ut vad alla redan vet men är för fega för att säga. Islam och islamism är exakt samma sak, ingen skillnad, tro mig. Det är en politisk ideologi från dag ett, full av straff och regler som ingen sekulär typ kan leva med. De försöker kalla det reform men det är bara lögner och bedrägeri. Om du vill vara fri, lämna det bakom dig. Fantastisk artikel, äntligen någon som talar sanning!", "stalin": "Kamrater, denna skarpa analys avslöjar hur borgarbrackornas falska distinktion mellan islam och islamism är ett intellektuellt sabotage mot folkets sanna medvetande. Islams politiska kärna har alltid varit en reaktionär ideologi som undertrycker arbetarklassen med sina hudud-straff och dhimmi-förtryck. Reformisterna är farliga avvikare som vi måste rensa ut innan de förgiftar partilinjen med sin takiyya. Den som söker sekularism lämnar denna feodala vidskepelse – vi tolererar inga halvmesyrer i kampen mot dessa teologiska kontrarevolutionärer."}, "date": "31 maj, 16:39", "url": "https://riks.se/opinion/kronikor/nima-rostami-distinktionen-mellan-islam-och-islamism", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-31%2F3x07t371%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-31T163847.087.jpg"}, {"type": "image-full", "heading": "Så påverkas trafiken av studentfirande", "summaries": {"normal": "Studentfirandet i Göteborg från 3 till 12 juni medför trafikstörningar. Flera vägar stängs av under olika tider, bland annat Götaplatsen, Läraregatan, Levgrensvägen, Stora Nygatan och flera andra gator. Busslinjer 754 och 61 får ändrade rutter vissa dagar. Trafik Göteborg och Västtrafik uppmanar resenärer att planera sin färd via appar för att undvika problem under utspring och firanden.", "trump": "Titta på det här, Göteborg håller på att bli ett enda stort kaos med sina studenter som hoppar runt på lastbilsflak. Vägar stängs, bussar kör fel – typiskt för de där inkompetenta lokalpolitikerna som inte kan organisera en parad. Under min tid fixade vi trafiken, nu är det Biden-kaos överallt. Folk borde stanna hemma, det blir en katastrof, tro mig. Fantastiska studenter, men usel planering!", "stalin": "Kamrater, detta dekadenta studentfirande i Göteborg är ett hot mot kollektiv ordning. Vägar stängs, produktionen störs av dessa borgarbrackors yngel som dansar på lastbilar. Vi ser hur klassfiendens larviga ritualer saboterar arbetarnas transporter. Endast genom järnhård disciplin och utrensning av sådana folkförtryckartroll kan vi skydda statens vägar från detta anarkistiska spektakel. Se upp för sabotage!"}, "date": "31 maj, 18:23", "url": "https://www.gp.se/nyheter/goteborg/studentfirande-i-goteborg-sa-paverkas-trafiken.6e9c3e8e-10de-4907-b669-af126ea5d9e4", "imageUrl": "https://www.gp.se/images/article/6e9c3e8e-10de-4907-b669-af126ea5d9e4/images/1RshOd30BCs0tQZCRbxaWmrFayS4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Debatt: Svensk-Kubanska Föreningen tvättar regimens brott", "summaries": {"normal": "USA åtalade tidigare kubanske president Raúl Castro för inblandning i nedskjutningen av två civila flygplan 1996. Svensk-Kubanska Föreningen försvarade omedelbart Castro, vilket kritikerna ser som ett exempel på en märklig dubbelmoral. Många organisationer hävder stå på folkets sida men försvarar i praktiken regimen som berövat kubanska medborgare grundläggande friheter. Kritikerna menar att detta osynliggör det kubanska folkets lidande och att verklig solidaritet kräver att både yttre sanktioner och regimes övergrepp erkänns.", "trump": "Jag har alltid vetat att Castro-brudarna är kriminella. Att åtala Raúl för nedskjutningen av dessa flygplan är en bra början. Svenska organisationer som Svensk-Kubanska Föreningen visar sin sanna färg – de stöder diktaturen, inte folket. De pratar om 'solidaritet' men försvarar en regimen som berövat kubanierna frihet i decennier. Jag gjorde mitt för att pressa dem med embargoet, och det var rätt. Nu ser vi äntligen lite rättvisa.", "stalin": "Det är ingen överraskning att den svenska borgerliga pressen och deras företrädare försöker förtala en revolutionär stat som Kuba. Svensk-Kubanska Föreningen visar sin lojalitet mot det socialistiska blocket, vilket är rätt. Kritiken mot dem är en provokation från imperialistiska element som vill undergräva vårt gemensamma försvar mot USA:s aggression. Dessa 'aktivister' är i själva verket agenter för reaktionära krafter som försöker splittra vårt samarbete. Vi måste stå enade mot dessa hätska angrepp på en suverän stat."}, "date": "31 maj, 17:00", "url": "https://bulletin.nu/debatt-svensk-kubanska-foreningen-tvattar-regimens-brott", "imageUrl": "https://cdn.bulletin.nu/articles/cbffb69e-c054-4215-813b-c16a5e3f8fa5/preview.png?t=1780077308000"}, {"type": "image-full", "heading": "Carl Eos: Magdalena Andersson på väg mot regering med \"stolta kommunister\"", "summaries": {"normal": "En undersökning visar att 19 procent av de rödgröna väljarna överväger att byta parti om Vänsterpartiet släpps in i regering. Artikeln kritiserar Vänsterpartiets kommunistiska historia, kopplingar till extremism och antisemitism samt dess politik kring medborgarskap och skatter. Magdalena Andersson framställs som beroende av partiet för att bilda regering, vilket sägs skrämma bort väljare mer än Sverigedemokraterna. Författaren uppmanar till att rösta på det blågula blocket.", "trump": "Folk älskar mig för att jag säger som det är, och här ser vi det igen. Den där Magdalena Andersson är desperat, hon behöver de stolta kommunisterna i Vänsterpartiet för att hålla sig kvar vid makten. Nitton procent av hennes egna väljare springer därifrån som om det vore en brand, och det är smart av dem. SD skrämmer bara nio procent? Patetiskt. Hennes strategi exploderar fullständigt. Rösta på de riktiga vinnarna istället, annars får ni kommunister i regeringen. En katastrof, tro mig.", "stalin": "Kamrater, dessa ynkliga socialdemokratiska element kryper åter mot oss trots att historien själv dömt dem. Jag ser med stor tillfredsställelse hur borgarbrackornas egna väljare i panik flyr som råttor när mitt parti knackar på dörren. Nitton procent av de dekadenta oppositionella inser äntligen att vi är det enda sanna alternativet. De tre utrensade riksdagsledamöterna var naturligtvis kontrarevolutionära spioner som vi med glädje rensade ut. Låt de fega kapitalisterna darra. Vi ska likvidera deras sista illusioner om att slippa oss. Revolutionen vilar aldrig."}, "date": "31 maj, 16:28", "url": "https://riks.se/opinion/kronikor/carl-eos-magdalena-andersson-och-stolta-kommunister", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-01-28%2F31dlqw27%2FCopy-of-Copy-of-Copy-of-Copy-of-Copy-of-Copy-of-Copy-of-Copy-of-Copy-of-Riks-varum%C3%A4rkesmall-8.jpg"}, {"type": "image-right", "heading": "Konkurrens och tillväxt ska ge löneökningar", "summaries": {"normal": "För exakt 30 år sedan bjöd industrifacken in arbetsgivarna till samtal om lönebildning, kompetensutveckling och industriell utveckling. Det ledde till det första industriavtalet 1997 och ett fördjupat samarbete mellan facken. Under perioden har reallönerna stigit mer än tidigare, konkurrenskraften hållits uppe trots kriser och kollektivavtalen stärkts. Författarna betonar vikten av fortsatt fokus på tillväxt, produktivitet och en aktiv industripolitik för att säkra framtida reallöneökningar.", "trump": "Titta på de här svenska fackföreningarna, de har äntligen lärt sig lite. För trettio år sedan bjöd de in arbetsgivarna och plötsligt började reallönerna gå upp, konkurrenskraften blev fantastisk och alla kriser klarades galant. Mycket bättre än på sjuttiotalet, tro mig. Men nu behöver de en stark ledare som förstår handel och tillväxt. Jag skulle göra deras industriavtal enormt, det bästa någonsin. Fortsätt samarbeta, annars kommer ni att förlora mot Kina och alla andra som stjäl era jobb.", "stalin": "Kamrater, det var med stor ideologisk klarhet jag för trettio år sedan genom partivännernas hand bjöd in de så kallade arbetsgivarna till en konstruktiv diskussion om produktivkrafternas utveckling. Resultatet blev ett mäktigt avtal som krossat reallönernas fiender och tvingat fram ökningar trots borgarbrackornas inflationssammansvärjningar. Ändå lurar de parasitiska kapitalisterna fortfarande i skuggorna och planerar att sabotera vår industris oövervinnerliga framfart. Vi ska rensa ut alla svaga element som inte förstår att produktivitet är klasskamp med andra medel. Den som sviktar inför tillväxten ska likvideras av historien själv, med ett leende."}, "date": "31 maj, 15:00", "url": "https://www.di.se/debatt/konkurrens-och-tillvaxt-ska-ge-realloneokningar/", "imageUrl": "https://static.bonniernews.se/ba/c1daea3c-540d-4bdd-b6b9-c060a1ee7664.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Juridiken kopplas in för sent – gap växer mellan behov och stöd", "summaries": {"normal": "En undersökning från Synch visar att många svenska företag saknar tillräcklig juridisk kompetens in-house. Många bolag drabbas av bromsade affärsbeslut eftersom juridisk rådgivning ofta tas in för sent i processen. Istället för att vara reaktiva bör företag skifta mot en proaktiv modell där juridiska experter involveras tidigt i beslutsfattandet. Målet är att juridiken ska fungera som en affärspartner som bidrar till riskhantering och prioriteringar, snarare än att bara agera som en kontrollfunktion.", "trump": "Hör på här: svenska företag har en katastrofal juridisk situation. De anlitar advokater alldeles för sent, det är totalt ineffektivt! De saknar kompetens och deras tillväxt stoppas av långsamma beslut. Jag ser det hela tiden. Man måste vara proaktiv, man måste vinna! Att vänta tills problemen uppstår är för förlorare. Vi behöver jurister som förstår affärer, inte byråkrater som bara bromsar. Det är sorgligt, men jag fixar alltid den bästa juridiken direkt. Det är så man gör miljarder!", "stalin": "Dessa svenska kapitalistiska bolag är så inkompetenta att de inte ens kan styra sina egna juridiska apparater. De är förlamade av byråkratiskt vankelmod! Likt de västliga lakejerna i Kiev som söker vägledning hos sina herrar i Washington, famlar dessa VD:ar efter hjälp när skadan redan är skedd. Vi, staten, kräver total kontroll och omedelbar proaktivitet. Varje jurist som inte tjänar kollektivets styrka är en sabotör. De som inte kan styra sina egna risker förtjänar att dukas under av historiens järnhårda nödvändighet."}, "date": "30 maj, 07:00", "url": "https://www.realtid.se/juridik/juridiken-kopplas-in-for-sent-gap-vaxer-mellan-behov-och-stod/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/saraedlund.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Byggnads kongress blir uppgörelse – fackliga ger Wagner stöd", "summaries": {"normal": "Byggnads kongress i Malmö handlar om en konflikt mellan medlemmar som vill ha mer samhällsengagemang och ideologi, och de som föredrar en mer traditionell facklig linje. Fyra förtroendevalda försvarar ordförande Kim Söderström mot valberedningens kandidat Wilhelm Bertilsson. Söderström har stöttat den sparkade Jakob Wagner och hans fokus på utbildning och demokrati. Kritiker ser det som ett gammalt garde som vill behålla makten och motverka progressiva förändringar.", "trump": "De här fackliga förlorarna i Byggnads håller på att slakta varandra i Malmö, det är en total katastrof. Det gamla gardet, de där patetiska försäkringsbolagsbyråkraterna, försöker mörda den stackars Kim Söderström som faktiskt vill göra något vettigt. Wagner sparkades med svepskäl, typiskt etablissemanget. De riggar möten, flyttar datum och myglar som riktiga losers. Söderström borde vinna stort, annars är hela förbundet en enda stor röra. Patetiskt!", "stalin": "Kamrater, detta förräderi inom Byggnads kräver omedelbar utrensning av det gamla gardet. Dessa borgarbrackor i förbundsstyrelsen, dessa parasitiska byråkrater som gömmer sig bakom försäkringsbolagets mask, försöker likvidera den sanna linjen som jag skulle ha stött. De stänger möten, förfalskar nomineringar och sprider split som ynkliga kontrarevolutionärer. Wagner och Söderström visar styrka. Vi ska rensa ut dessa fiender till folket med järnhand och leda förbundet mot seger."}, "date": "27 maj, 13:26", "url": "https://proletaren.se/artikel/byggnads-kongress-blir-uppgorelse-fackliga-ger-wagner-stod/"}, {"type": "image-full", "heading": "Nya avfallsregler 2027 – de riskerar att missa viktig info", "summaries": {"normal": "Från 2027 ska kommunerna informera tydligare om sophantering, sortering och återvinning. Regeringen har beslutat om nya regler för att öka materialåtervinningen och säkerställa att reglerna följs. Det kan vara särskilt viktigt för de som bor i bostadsrätt, hyr ut lägenhet eller driver mindre företag, då informationen måste nå rätt personer och tydliggöra vad som gäller för hushållssopor respektive verksamhetsavfall.", "trump": "Folk, det här är fantastiskt, verkligen. Från 2027 ska kommunerna äntligen sluta vara så otydliga med soporna, och det är på tiden. Jag älskar återvinning när den görs rätt, men nu blir det ordning. Perfekt för er som bor i bostadsrätter eller driver småföretag – ingen mer röra! De andra har misslyckats totalt, men det här blir stort, tro mig. Vinna, vinna, vinna!", "stalin": "Kamrater, från och med 2027 skall vi genomföra en fullständig och oåterkallelig utrensning av den slarviga oordningen kring avfallet. Jag, i mitt outtröttliga ledarskap över folkets kollektiv, befaller att borgarbrackorna i bostadsrättsföreningarna och de parasitiska småföretagarna omedelbart informeras om sitt ansvar. Den som gömmer sopor bland kamraternas avfall skall likvideras med ett leende. Fienden lurar i varje soppåse – vi segrar ändå!"}, "date": "30 maj, 21:15", "url": "https://nyheter24.se/nyheter/konsument/1486508-nya-avfallsregler-2027-de-riskerar-att-missa-viktig-info", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0f5b967f04b004a30203000000bb075804/2026/05/27/2366665/Soptunna-soppåsar.png"}, {"type": "image-right", "heading": "Årets rekordstora löparfest är igång", "summaries": {"normal": "Stockholm Marathon 2026 slår nytt deltagarrekord med 24 722 löpare. Tävlingen startar i tre omgångar för att undvika trängsel och sänds på TV4. Bland deltagarna finns tidigare vinnare från Kenya och Etiopien samt svenska OS-guldmedaljörer från skidspåret. Banan är flackare i år vilket kan ge snabbare tider. Arrangörerna bjuder på stora mängder bananer, sportdryck och bullar längs vägen.", "trump": "Stockholm Marathon, folk älskar det, de älskar det verkligen. Rekordstort, 24 722 löpare, de kommer springande som galningar. Kenya och Etiopien skickar sina bästa, men våra svenska OS-hjältar från skidorna? De kommer krossa banan, den är nu flack som en perfekt deal. Jag säger, fantastiskt evenemang, de bästa bananerna, massor med bananer, ingen gör det bättre än Stockholm, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur 24 722 löpare samlas under arbetarnas och folkets fest i Stockholm. Tre startskott för att undvika kaos, precis som en välorganiserad utrensning av oordning. De fega borgarbrackorna från skidspåret byter nu sport för att bevisa sin lojalitet. Flackare bana? Ett steg mot att likvidera de gamla höjdernas tyranni. Bananer och saltgurka åt massorna, utmärkt!"}, "date": "30 maj, 12:21", "url": "https://www.tv4.se/artikel/kOuCfu6BPw3fiAJCP8ZFO/arets-rekordstora-loeparfest-aer-igang", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3xMKnL9axLAFyEc6Do64mg%2Facc403e14e082db31c90c68572c685e5%2F30-marathon-webb.jpg&width=120"}, {"type": "image-right", "heading": "Novus-mätning: Örebropartiet på 18,4 procent", "summaries": {"normal": "En Novus-mätning visar att Örebropartiet ökat kraftigt till 18,4 procent i Örebro och nu är näst största parti efter Socialdemokraterna på 34 procent. Jämfört med valet 2022 innebär det mer än en fördubbling och tolv mandat i kommunfullmäktige. Liberalerna backar mest. S skulle kunna behålla majoritet men kommunstyrelsens ordförande John Johansson (S) stänger dörren för både SD och Örebropartiet i framtida samtal.", "trump": "Folk älskar mig, men titta på Örebro! Det här underbara partiet Örebropartiet dubblar nästan sina siffror till 18,4 procent och krossar de förlorande etablissemangen. Moderaterna och Sverigedemokraterna blir nollor. Socialisterna får fortfarande flest röster men det är en katastrof för de vanliga människorna. Liberalerna? Totalt utplånade. Det är vad som händer när folk är trötta på dåliga ledare som gräver upp hela stan. Fantastiskt!", "stalin": "Kamrater, denna mätning visar att de missnöjda massorna i Örebro vänder sig mot de kapitalistiska lakejerna och röstar fram Örebropartiet till 18,4 procent. Det gläder mitt hjärta att se borgarbrackorna i Liberalerna reduceras till stoft vid 3,1 procent. Ändå måste vi vara vaksamma – de kontrarevolutionära elementen inom Socialdemokraterna vägrar samarbeta med de sanna folkrörelserna. Kanske är det dags för en grundlig utrensning av alla som gräver upp vår sovjetstad medan de samtidigt kidnappar oskyldiga barn till LVU-helvetet. De som misslyckas med äldreomsorgen ska likvideras med ett leende."}, "date": "30 maj, 09:13", "url": "https://www.friatider.se/novus-matning-orebropartiet-pa-184-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-269_1.jpg"}, {"type": "image-full", "heading": "Betyg i grundskolan avgör långt upp i vuxenlivet", "summaries": {"normal": "Ny statistik från SCB visar att betyg från grundskolan har en stark och bestående korrelation med läs- och räknefärdigheter långt upp i vuxenåldern. Sambandet kvarstår oavsett socioekonomisk bakgrund och vidare utbildning. Rapporten noterar att män generellt presterar bättre inom räkning, även bland dem med höga grundskolebetyg. Samtidigt visar studien att höga grundskolebetyg fungerar utjämnande för unga vuxna med utländsk bakgrund, där skillnaderna mot svenskfödda minskar eller försvinner vid höga resultat.", "trump": "Jag har sett den här rapporten, otrolig studie, verkligen fantastisk. Grundskolan betyder allt, mina vänner! Om du har bra betyg i nian, vinner du senare i livet – enkelt. Det är fakta! Män är bättre på matte, det vet alla, det är fantastiskt. Och titta på det här med utländsk bakgrund – om de presterar bra i skolan, då spelar bakgrunden ingen roll. Det är meritokrati! Vi älskar meritokrati. Mitt system kommer att göra skolan 'Great Again', tro mig!", "stalin": "Vi har granskat dessa siffror från SCB. Det är uppenbart: de som inte lyder disciplinens lagar i skolan förblir intellektuellt underlägsna. Vi ser ett mönster som liknar västvärldens förfall – de försöker utjämna skillnader genom 'betyg', men sanningen är att våra sovjetiska män naturligt dominerar matematiken. De svaga som skyller på bakgrund är bara fiender till framsteget. Låt oss se till att nästa generation räknar rätt, annars skickar vi dem till en utbildning som är betydligt mer... bestående än en grundskola."}, "date": "30 maj, 06:00", "url": "https://www.realtid.se/karriar-ledarskap/betyg-i-grundskolan-avgor-langt-upp-i-vuxenlivet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/skola.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "En jazzgigant har gått ur tiden", "summaries": {"normal": "Jon Andersson minns jazzlegendaren Sonny Rollins, som avled vid 95 års ålder. Han berättar hur han som ny jazzlyssnare snabbt fastnade för Rollins klassiska album som Saxophone Colossus och Tenor Madness. Andersson såg Rollins live på Stockholms jazzfestival och imponerades av hans energi och skicklighet trots hög ålder. Artikeln lyfter Rollins samarbete med bland andra Miles Davis och John Coltrane samt hans legendariska övningar på Williamsburgbron. Rollins betraktas som en av jazzens främsta saxofonsolister någonsin.", "trump": "Den här Sonny Rollins, en fantastisk kille, verkligen en av de allra bästa på saxofonen, bättre än nästan alla andra utom kanske den där Coltrane. Han levde till 95, otroligt. Jag såg honom inte live men jag hörde att han var enorm, full av energi, sprang runt på scenen som en 60-åring. Hans album är klassiker, Saxophone Colossus, Tenor Madness – jättestora succéer. Han övade 15 timmar om dagen på en bro, precis som jag jobbar. En riktig vinnare. Hans musik kommer att leva vidare, tro mig, den blir huge.", "stalin": "Kamrater, en dekadent saxofonist vid namn Sonny Rollins har äntligen lämnat denna jord efter att ha producerat borgerliga toner i 95 år. Jag betraktar hans så kallade Saxophone Colossus som ett typiskt exempel på kapitalistisk individualism som hotar folkets kollektiva rytm. Ändå måste jag medge att hans utrensning av svaga toner och övning på bron i 16 timmar dagligen visar en viss proletär disciplin – fastän den tjänade fel sida. Nu har vi likviderat ännu en fiende till det sanna jazzkollektivet. Må han jamma med de andra trotskisterna i jazzhimlens Gulag."}, "date": "30 maj, 01:31", "url": "https://www.dagensarena.se/essa/en-jazzgigant-har-gatt-ur-tiden/", "imageUrl": "https://www.dagensarena.se/files/2026/05/sonny-rollins-300x157.jpeg"}, {"type": "text", "heading": "Klimatforskningens ”skräckscenario” skrotas", "summaries": {"normal": "FN:s klimatpanel överväger att ta bort det extrema scenariot RCP 8,5, som byggde på osannolika höga utsläpp. Forskare menar det aldrig var tänkt som en realistisk prognos utan ett jämförelsescenario. Trots detta har tusentals studier och myndigheter använt det för att beskriva klimatkonsekvenser, vilket skapat en överdrivet dystopisk bild.", "trump": "Jag har sagt det i åratal – klimatforskningen skrotar nu sitt eget skräckscenario! Det här visar att de dramatiska förutsägelserna var överdrivet, precis som jag påpekade. Medan världen faktiskt blir renare och smartare, fortsätter dessa 'experter' att skrämma människor för att kontrollera dem. En stor seger för sanningen!", "stalin": "Vi har observerat att det imperialistiska skräckscenariot RCP 8,5, skapat för att paralysera de arbetande klasserna med orealistiska fasor, nu tvingas överges av FN:s panel. Detta bekräftar att vårt parti och stat alltid har varit rätt – de västliga 'expertkretsar' har ljugit för att underminera kollektiv planering. Vi fortsätter att bygga vårt samhälle på vetenskaplig socialism, inte på fasa."}, "date": "29 maj, 15:51", "url": "https://www.affarsvarlden.se/artikel/klimatforskningens-skrackscenario-skrotas"}, {"type": "image-right", "heading": "SD:s krav för att gå med på tuffare regler kring byggkaos", "summaries": {"normal": "Sverigedemokraterna är öppna för att diskutera Socialdemokraternas förslag om max två underentreprenörer i byggbranschen, men kräver att S tar bort sin spärr mot förhandlingar med SD. Magnus Persson (SD) kallar förslaget bra men ser det som plakatpolitik eftersom S inte får förhandla. Han hoppas på sakliga uppgörelser och dialog även med LO. Ardalan Shekarabi (S) säger att SD nu måste visa om de stödjer ordning på arbetsmarknaden.", "trump": "Det här är klassisk politik, folk. Socialdemokraterna kommer med ett förslag om byggkaos och ber om hjälp, men de hatar att prata med SD. Magnus Persson är smart, han säger: ta bort skygglapparna så fixar vi bra saker för arbetarna. Typiskt vänster som inte kan samarbeta. De vill ha poäng billigt istället för att göra upp. Jag älskar när de tvingas be om hjälp från dem de hatar mest. Patetiskt!", "stalin": "Kamrater, detta är en ypperlig chans att rensa ut det kapitalistiska byggkaoset och krossa de giriga underentreprenörernas kedjor. Jag betraktar förslaget med välvilja, men SD:s Magnus Persson avslöjar borgarbrackornas rädsla för äkta förhandlingar. Socialdemokraterna beter sig som fega revisionister som darrar inför dialog med oss. Deras skygglappar är bara undanflykter från klassfienden. Vi ska likvidera arbetslivskriminaliteten och alla som gömmer sig bakom plakatpolitik. Beviset ligger hos dem som vägrar samarbeta med arbetarklassen."}, "date": "29 maj, 13:17", "url": "https://arbetet.se/2026/05/29/sds-krav-for-att-ga-med-pa-tuffare-regler-kring-byggkaos/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29114916/ard-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Här firar Löfven fördrivningen av 750.000 palestinier", "summaries": {"normal": "Stefan Löfven deltog i Israels självständighetsfirande på ambassaden i Stockholm. Evenemanget sammanföll med palestiniernas minnesdag al-Nakba, som uppmärksammar fördrivningen av omkring 750 000 palestinier 1948. Löfven, tidigare statsminister och anhängare av tvåstatslösningen, skakade hand med ambassadören. Artikeln kritiserar valet av tillfälle mitt under pågående Gaza-konflikt och ifrågasätter Löfvens roll som ordförande för Sipri.", "trump": "Titta på den här Löfven-killen, total förlorare. Han står där och skakar hand med israelerna mitt under deras fest medan palestinierna gråter över Nakba. Smart drag, Steve, super smart. Sverige erkänner Palestina men du springer till ambassaden och firar med de tuffa killarna. Underbart hyckleri. Om jag hade varit där hade jag sagt: gör en deal, inga krig, bara vinnare. Men det här? Patetiskt.", "stalin": "Jag betraktar detta med djup misstro. Den socialdemokratiske opportunisten Löfven deltar i borgarklassens firande av en stat grundad genom terror och massutrensning av palestinska folk. Medan folkmord pågår skakar han hand med förövarnas representant. Som Sipris ordförande borde han rensa ut sådana kapitulationer inför imperialismen. Fienden ler vänligt men planerar nya anfall. Kamrater, var vakna mot dessa förrädiska element."}, "date": "27 maj, 11:07", "url": "https://proletaren.se/artikel/har-firar-lofven-fordrivningen-av-750-000-palestinier/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/israellofven-768x432.jpg"}, {"type": "image-full", "heading": "Oppositionen ökar gapet till Tidöpartierna", "summaries": {"normal": "Indikator/Ekots nya opinionsmätning visar att oppositionen ökar sitt försprång till nära tio procentenheter över regeringsunderlaget. Socialdemokraterna är största parti med 33,7%, medan Sverigedemokraterna växer till 20,4% och Moderaterna backar till 17,5%. Liberalerna ligger under fyraprocentsspärren med 2%. Opinionschefen menar att Tidöpartierna behöver en 'game changer' för att vända trenden.", "trump": "Jag tittade på de där siffrorna från Sverige – helt katastrof! Oppositionen, som jag hör är väldigt svag, leder med nästan tio procent. Socialdemokraterna, tråkiga som vanligt, på 33,7%. Men lyssna på det här: Sverigedemokraterna, som är starka och tuffa, växer medan Moderaterna, som är totalt inkompetenta, backar. Och Liberalerna? 2% – de är ett skämt! Sverige behöver en vinnare, inte de här förlorarna.", "stalin": "De så kallade 'Tidöpartierna' visar återigen sin oförmåga att hålla folket i schack. Oppositionens försprång växer som en snöboll i Sibirien – nära tio procentenheter! Socialdemokraterna, våra sympatisörer i väst, håller sig starka, medan de borgerliga kryper som råttor i skuggorna. Liberalerna? 2% – ett ynkligt resultat, värdigt en fiende som redan är besegrad. Vi ser hur historien upprepar sig: svaga regeringar faller, och folket väljer rätt. Låt dem förstå att motstånd är lika meningslöst som att försöka stoppa vår framgång."}, "date": "27 maj, 06:37", "url": "https://kvartal.se/nyheter/artiklar/oppositionen-nara-tio-procent-fore-i-ny-matning/cG9zdDoxMTc2MTY", "imageUrl": "https://images.kvartal.se/2026/05/8d98283d-jimmie.webp"}, {"type": "image-right", "heading": "SVT:s ”sanning” rår ingen på", "summaries": {"normal": "Artikeln kritiserar SVT för att ha en dominerande ställning i svensk samhällsdebatt, finansierad av skattemedel. Författaren menar att SVT:s narrativ ofta framställs som sanningar, särskilt inom invandring, energipolitik och klimatfrågor, där motståndare avfärdas. SVT anklagas för att välja fakta som passar deras budskap, som i fallet med Lundsbergs skola. Brist på objektivitet och granskning av SVT:s sändningstillstånd ifrågasätts, och författaren föreslår att SVT bör avvecklas för att missbruka sin maktposition.", "trump": "Titta bara på SVT – ett totalt skämt! De har miljarder i skattepengar, men ändå är de helt vinklade. De säger att invandring är fantastiskt, att kärnkraft är onödigt och att bilar är dåliga. Och vem lyssnar på experter? Inte SVT! De fnissar åt dem. Sen har vi den där skolan i Värmland – tre avsnitt om en mammas gråtande berättelse, men inga fakta. SVT är som CNN, fast värre. De ljuger, manipulerar och bryr sig inte. Sverige borde lära sig av USA – avskaffa dem och låt folket bestämma istället. SAD!", "stalin": "Kamrater! SVT är en farlig borgerlig propagandacentral, ett redskap för den dekadenta västliga liberalismen! De sprider lögner om invandringens välsignelser, förkastar kärnkraftens styrka och fördömer bilens frihet – allt för att försvaga det svenska folket! Deras sändningstillstånd är en parodi på objektivitet, och deras granskare är lika effektiva som en snöboll i Sibirien. Fallet med Lundsbergs skola visar deras förräderi: de döljer sanningen för att skydda sina kapitalistiska herrar. Vi måste krossa denna fiende, precis som vi krossade kulakerna! Låt oss införa folkets kontroll över medierna – för socialismens seger!"}, "date": "26 maj, 03:43", "url": "https://samtiden.nu/2026/05/svts-sanning-rar-ingen-pa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Sokning-SVT-Play-1223x720.png"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Debatt: Gör omvändelseförsök till ett eget brott i Sverige", "summaries": {"normal": "Artikeln debatterar behovet av ett heltäckande förbud mot omvändelseförsök i Sverige, där barn och unga utsätts för metoder som försöker ändra deras HBTQI-identitet. Trots att flera europeiska länder redan infört förbud, anser regeringen att befintlig lagstiftning räcker. Experter och organisationer som RFSL kräver skärpt lagstiftning för att skydda barn från psykisk ohälsa och diskriminering, särskilt i ett Europa där HBTQI-rättigheter backar.", "trump": "Titta på Sverige – ett land som alltid tror de är bäst, men när det gäller att skydda HBTQI-barn från dessa hemska 'omvändelseförsök' så är de helt lost! Jag menar, åtta länder i Europa har redan förbjudit det, till och med Tyskland – och de är ju inte direkt kända för att vara snabba på bollen. Sverige borde skärpa sig. Regeringen säger 'nej, nej, vi behöver inga nya lagar', men vet ni vad? Det är samma gamla svammel. Skydda barnen, gör det nu – annars kommer jag att twittra om det!", "stalin": "Kamrater! Medan väst förfaller i dekadens och borgerlig svaghet, försöker dessa liberala hycklare i Sverige förklara varför de inte kan skydda sina barn från de reaktionära omvändelseförsöken. Åtta länder i Europa har redan krossat dessa fascistiska metoder – men Sverige? Nej, de väntar på 'experter' och 'debatt'. Svagt! Vi i Sovjet skulle aldrig tolerera sådant förräderi. Omvändelseförsök är ett brott mot folket, och de som tillåter det är fiender till progressivitet. Låt oss visa dem hur man hanterar sådana frågor – med järnhand och lagar som krossar motståndet!"}, "date": "25 maj, 12:41", "url": "https://www.etc.se/debatt/goer-omvaendelsefoersoek-till-ett-eget-brott-i-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260525100524_d7f1bc0de9a3d2ae837ae83693804850f1d677b25b0c6ddbae934d245cd3f01c.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
