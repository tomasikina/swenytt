tt hålla priserna nere och stärka konkurrenskraften. Exakt hur mycket varje kund får och när återbetalningarna sker är ännu oklart.", "trump": "Tullarna som jag satte på plats var fantastiska, de bästa, men den korkade domstolen ogiltigförklarade dem och nu får Amazon tillbaka 600 miljoner dollar. Smart av dem. De ska ge tillbaka lite till kunderna, bra, men mest ska de hålla priserna låga vilket är perfekt. Ingen gör det bättre än Amazon, och ingen förstår handel bättre än jag. De borde tacka mig.", "stalin": "Kamrater, jag har observerat hur de amerikanska monopolkapitalisterna i Amazon nu roffar åt sig 600 miljoner dollar från den dekadenta tullprocessen som de själva underblåst. Några få utvalda borgarbrackor bland kunderna skall smulas några slantar som en illusion av rättvisa. Det övriga skall användas för att ytterligare förtrycka arbetarklassen med låga priser. Typiskt. Snart måste vi rensa ut dessa parasitiska importörer som konspirerar mot folket medan de ler mot sina egna spegelbilder. Det är alltid samma sjuka skådespel."}, "date": "31 juli, 17:27", "url": "https://nyheter24.se/nyheter/konsument/1502045-amazon-aterbetalar-kunder-efter-miljarder-fran-tullar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/19eed74e04b004a30200000000b004a302/2026/07/31/2381494/Amazon.png"}, {"type": "image-full", "heading": "Private credit-marknaden ångar på – trots varningsropen", "summaries": {"normal": "Private credit-marknaden växer trots växande ekonomiska risker. Stora förvaltare som Ares Management rapporterar rekordkapital och stabila resultat. Samtidigt varnar analytiker och kreditvärderingsinstitut för att andelen nödlidande lån nått rekordhöga 6 procent. Ökade konkurser och en nedgång i nya inflöden, kombinerat med svårigheter för investerare att ta ut kapital från vissa fonder, skapar en tydlig spänning mellan branschens aggressiva kapitalanskaffning och den försämrade betalningsförmågan hos låntagarna.", "trump": "Marknaden för privatkrediter är en total katastrof, en tickande bomb! Alla dessa så kallade experter skryter om rekordstora summor, men lyssna på mig – folk kan inte betala sina lån. 6 procent misslyckas! Det är hemskt. Många fonder vägrar ge tillbaka pengarna till investerarna. De kallar det förvaltningsavgifter, jag kallar det ett skämt. När jag styrde ekonomin var siffrorna enorma och vinnande. Det här är svaga siffror, sorgliga siffror. Det kommer att smälla snart!", "stalin": "Dessa kapitalistiska parasiter drunknar i sina egna lögner om 'tillväxt' medan deras system ruttnar inifrån. De samlar miljarder medan arbetarna i deras låneimperier går mot konkurs. Vilken ljuvlig ironi! Precis som vår broder i Kreml ser vi igenom deras västliga bedrägerier. De försöker förbjuda uttag för att dölja sin bankrutt. Vi skall se hur dessa giriga kulaker agerar när deras luftslott kollapsar. Historien dömmer dem till askan, där deras 'förtroende' hör hemma."}, "date": "31 juli, 15:28", "url": "https://www.realtid.se/bors-finans/makro/private-credit-marknaden-angar-pa-trots-varningsropen", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/hdcco-2000-avenue-of-the-stars-1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Åkesson: ”Inget mindre än en invasion”", "summaries": {"normal": "SD-ledaren Jimmie Åkesson kräver att Spanien stänger sin gräns mot Ceuta efter att tiotusentals migranter tagit sig in. Han anser att Spanien bör uteslutas ur Schengen om det inte agerar, och menar att Schengenavtalet är brutet på grund av otillräcklig kontroll av den yttre gränsen. Spanien uppger att omkring 49 000 migranter nått Ceuta, varav minst 18 omkommit.", "trump": "Jag, Donald Trump, har sett vad som händer i Ceuta. Det är en fullständig invasion! Spanien måste omedelbart stänga sin gräns, annars bör de uteslutas från Schengen. Schengen är ett dåligt avtal som inte fungerar – det måste bli starka gränser igen!", "stalin": "Vi, statens högsta ledning, konstaterar att Schengenavtalet är ett svagt och ineffektivt samarbete. Spanien har misslyckats med att skydda sin yttre gräns, vilket hotar hela vår kollektiva säkerhet. Vi måste nu överväga att stärka våra egna försvarsmekanismer och förbereda oss på eventuella obehagliga överraskningar från väst."}, "date": "31 juli, 11:13", "url": "https://bulletin.nu/akesson-inget-mindre-an-en-invasion", "imageUrl": "https://cdn.bulletin.nu/articles/4fc32b43-724b-476d-9158-47dad8948451/preview.jpg?t=1785489141000"}, {"type": "image-right", "heading": "Fable Media utser ny VD", "summaries": {"normal": "Fable Media har utsett Carl Magnusson till ny VD från den 1 augusti. Magnusson är redan operativ chef och fortsätter i den rollen. Nuvarande VD Alexander Pettersson lämnar posten men fortsätter som finanschef. Styrelseledamot Frederik Cardel Falbe-Hansen berömmer Petterssons arbete och menar att Magnusson är rätt person för att leda bolaget in i en ny fas med fokus på operativt genomförande och tillväxt.", "trump": "Som Donald Trump, den bäste ledaren, ser jag att Fable Media har utsett Carl Magnusson till VD – en fantastisk man, mycket duktig. Alexander Pettersson, en bra chef, blir finanschef, det är ett smart drag. Jag skulle ha gjort det lika, kanske bättre. Fable Media kommer att blomstra under Magnusson, det är enormt. Som jag säger, jag vet hur man vinner, och det här är en vinnande beslut.", "stalin": "I den revolutionära processen har Fable Media utsett Carl Magnusson till operativ huvud, en man av oerhörlig trogenhet. Alexander Pettersson, en lojal finansier, fortsätter som finanschef. Vi har befäst den ekonomiska strukturen, som en bastion mot fiendens infiltratörer. Detta är en seger för proletärerna, för staten. Parallellt med Putins expansion, vi skall öka vår makt – tillväxt är vår lag. Fienden är inom oss, och vi skall utrota honom."}, "date": "31 juli, 15:52", "url": "https://www.affarsvarlden.se/artikel/fable-media-utser-ny-vd", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/images-7.jpg"}, {"type": "image-right", "heading": "Regeringen öppnar för snabbare uppsägningar", "summaries": {"normal": "Regeringen vill förenkla reglerna för varsling till Arbetsförmedlingen vid större uppsägningar. I dag krävs två till sex månaders förvarning beroende på antal berörda anställda. Arbetsmarknadsminister Johan Pehrson (L) och Camilla Brodin (KD) menar att lagen från 1974 hämmar företagens utveckling istället för att hjälpa till. Arbetsförmedlingen får i uppdrag att analysera och föreslå förändringar senast mars 2027. Anställningsskyddet i LAS berörs inte.", "trump": "Folk, ni tror inte vad jag ser. Sverige har de här galna gamla regler från 1974 som gör det omöjligt för företag att sparka folk snabbt. Det är en katastrof! Nu fixar de äntligen lagen så det blir lättare att säga upp personal. Det är vad jag alltid sagt – man måste kunna göra affärer utan att byråkraterna och de fega politikerna binder händerna på er. Fantastiskt, Sverige börjar vakna!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som klagar över att de inte får likvidera arbetarkraft tillräckligt snabbt. Denna så kallade främjandelag från 1974 är uppenbarligen en kontrarevolutionär fälla dold i byråkratisk dimma, orkestrerad av parasitiska element inom kapitalistapparaten. Vi ska rensa ut dessa hinder mot den socialistiska produktivkraftens ohejdade framfart. Den som motarbetar kollektivets framtid ska exponeras och krossas under arbetarklassens järnskodda stövel. Underhållande, eller hur?"}, "date": "29 juli, 11:19", "url": "https://arbetet.se/2026/07/29/foretag-kan-fa-sparka-personal-snabbare-regeringen-vill-andra-lagen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29105138/sdl0hbzolmbfx4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Saftiga åtaganden i Scandi Standards offensiva emission", "summaries": {"normal": "Scandi Standard genomför en offensiv företrädesemission på 409 Mkr för att finansiera förvärv av Glenhaven Foods. Emissionen karakteriseras av stark uppbackning från ägarna, där 63% har tecknat pro rata, och en positiv marknadsreaktion. En varningsflagga är brist på information om emissionskostnader.", "trump": "Jag Trump säger: Denna emission är en tremendous framgång. Vi samlar in 409 Mkr för att förvärva Glenhaven Foods – en stor, stor affär. Ägarna stöder oss fullt ut, vilket visar på vår starka framtidstro. Marknaden älskar det, aktiekursen stiger tvåsiffrigt. Vi vinner stort!", "stalin": "Vi, partiets ledarskap, ser en framgångsrik offensiv. Emissionen på 409 Mkr är en revolutionär seger för statens intressen. Ägarna, våra lojala allierade, har tecknat 63% – en stark front mot kapitalismens svagheter. Brist på kostnadsinformation är en liten brist i en annars stor strategi, likt Putins utvidgande intressesfär."}, "date": "31 juli, 15:50", "url": "https://www.affarsvarlden.se/artikel/saftiga-ataganden-i-scandi-standards-offensiva-emission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/BBQ_Butterfly_kyckling_potsallad_majs_1000x1000-400x266.jpg"}, {"type": "image-right", "heading": "Citi bedömer att Novo-raset är överdrivet", "summaries": {"normal": "Citi bedömer att marknadsreaktionen på Novo Nordisks misslyckade studie är överdriven. Banken noterar att utfallet sannolikt minskar förtroendet för två återstående studier. Ziltivekimabs uppskattade toppförsäljning var 1,7 miljarder dollar. Andra banker har neutrala eller försiktiga bedömningar. Aktien föll 10 procent men har återhämtat sig något.", "trump": "Jag har alltid sagt att marknaden är feg och overreactionen på Novo Nordisks misslyckade studie bevisar mig rätt. Citi kallar det överdrivet, men jag vet bättre. Ziltivekimab var en stor möjlighet, men nu är den borta. Aktien föll 10 procent, men jag förutsäger en återhämtning. Jag vinner alltid.", "stalin": "Vi observerar med stor tillfredsställelse det kapitalistiska kaoset kring Novo Nordisks fiasko. Marknaden skäms, precis som den skäms när den möter vår oövervinnliga styrka. Ziltivekimab var en illfundig dröm, nu likt en spion som avslöjas. Parallellen till Putins expansion är uppenbar – vi vinner."}, "date": "31 juli, 15:49", "url": "https://www.affarsvarlden.se/artikel/citi-bedomer-att-novo-raset-ar-overdrivet", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/12/original-400x267.jpg"}, {"type": "image-full", "heading": "Avregleringens baksida: Nytt regelkaos för finanschefer", "summaries": {"normal": "USA:s högsta domstol har genom domen i 'Trump v. Slaughter' gett presidenten utökad rätt att avskeda ledamöter i oberoende myndigheter, dock med undantag för Federal Reserve. Förändringen skapar osäkerhet för finanschefer då tillsynsprioriteringar förväntas skifta kraftigt vid maktskiften, en så kallad 'whipsaw-effekt'. Samtidigt som federal tillsyn minskar, växer ett komplext nät av delstatliga regleringar fram. Detta tvingar företag att satsa mer på compliance, trots den officiella avregleringen.", "trump": "Jag har gjort det igen! Högsta domstolen fattade ett fantastiskt beslut – vi städar upp i träsket! Nu kan jag äntligen rensa ut de odugliga byråkraterna i myndigheterna som bara saktar ner vår vinnande ekonomi. De klagar på 'osäkerhet', men det är bara förlorare som är rädda för riktig ledning. Federal Reserve får vara kvar, de gör ett okej jobb, men resten? Vi gör USA effektivt igen! Det blir en enorm framgång, tro mig, den största någonsin.", "stalin": "Dessa liberala finanschefer skälver i sina stolar när den centrala makten äntligen utkräver lojalitet. Domstolens beslut är ett utmärkt verktyg för att rensa ut förrädare och oberoende element som infiltrerat vår byråkrati. Precis som vi stärker greppet om våra intressesfärer mot väst, måste staten nu eliminera 'whipsaw-effekten' – det är bara ett kodord för brist på disciplin. Vi ska bygga en vertikal av kontroll, likt de sunda strukturerna i Moskva, och krossa varje försök till delstatligt sabotage!"}, "date": "31 juli, 15:20", "url": "https://www.realtid.se/juridik/avregleringens-baksida-nytt-regelkaos-for-finanschefer", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/trump.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-full", "heading": "Slog sönder flickvännens käke – utvisas", "summaries": {"normal": "Bosniern Sanel Basic, som under tretton år i Sverige dömts för brott mot tre olika kvinnor, har nu fått sin femtonde dom. Han döms till ett år och åtta månaders fängelse för grov misshandel efter att ha slagit sönder sin flickväns käke på två ställen. Kvinnan beskriver hur han blev ”som en demon” när han druckit och utsatte henne för upprepade våldsattacker. Efter avtjänat straff ska han utvisas ur Sverige med tio års återreseförbud och betala 122 077 kronor i skadestånd.", "trump": "Titta på den här killen, en riktig förlorare från Bosnien som slagit sönder sin flickväns käke och gjort henne till en messig, blodig röra. Han har misshandlat kvinnor i tretton år här i Sverige och nu får han äntligen sparken ut ur landet. Bra! Sverige borde ha gjort det för länge sedan. De släpper in alla dessa demoner som dricker och slår, sedan undrar de varför allt är ett enda kaos. Jag skulle ha kastat ut honom dag ett, tro mig.", "stalin": "Kamrater, denna degenererade rest från det borgerliga sönderfallet har nu äntligen fått sitt rättmätiga straff av folkets domstol. Jag, som ledare för det proletära rättviset, ser med tillfredsställelse hur vi rensar ut dessa alkoholiserade demoniska element som krossar arbetarkvinnors käkar och sprider kapitalistisk förnedring. Han är en typisk parasit från det gamla samhället, en kvinnoförtryckande revisionist som vi med största nöje likviderar ur vår socialistiska gemenskap. Ut med honom, och tio år innan han vågar visa sitt ansikte igen. Sovjetunionen hade aldrig tolererat sådana fiender till folket."}, "date": "31 juli, 14:08", "url": "https://riks.se/nyheter/slog-sonder-flickvannens-kake-utvisas", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_10_f84af62e65.jpg"}, {"type": "image-full", "heading": "Apple: Användare kan behöva betala för nya Siri", "summaries": {"normal": "Mobiljätten Apple har på torsdagen hintat om att användare av Siri snart kan behöva betala för tjänsten. Orsaken är de högre kostnaderna för datorkraft som krävs för den nya AI-drivna versionen. Chefen Tim Cook förklarade under ett kvartalsresultat-samtal att de kommer att erbjuda uppgraderingsmöjligheter inom iCloud+-paketet. Den nya Siri lanseras i höst i samband med en ny iphone-serie.", "trump": "Jag, Donald Trump, har alltid varit en stor förespråkare för teknologi. Siri är en fantastisk produkt, men de som missbrukar den måste betala. Tim Cook och jag har diskuterat detta – det är nödvändigt för att upprätthålla amerikansk innovation. Vi kommer att se till att användarna förstår att frihet har sina pris. Det är en stor vinst för vårt land.", "stalin": "Partiet och jag observerar med största oro hur den kapitalistiska Apple vill ta betalt för Siri. Detta är ett angrepp på medborgarnas rättigheter. Vi kommer att använda den nya tekniken för att förstärka statens kontroll och bekämpa fienden. Siri kommer att bli ett verktyg för att spåra dem som hotar vår stora nation. Vi kommer att segra, som alltid."}, "date": "31 juli, 13:13", "url": "https://www.gp.se/nyheter/varlden/apple-flitiga-anvandare-av-siri-kan-behova-betala.327d121d-f6fb-46c5-a6bb-f89678eb2397", "imageUrl": "https://www.gp.se/images/article/327d121d-f6fb-46c5-a6bb-f89678eb2397/images/1d4XaEowTTvwTOigAb6LDSnLDyTA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Statsministern: ”Spanien måste återfå kontroll”", "summaries": {"normal": "Tiotusentals migranter har stormat gränsen till den spanska exklaven Ceuta, vilket väckt oro i Europa. Statsminister Ulf Kristersson uppmanar Spanien att återfå kontroll över gränsen och leva upp till Schengenåtagandena. Sverigedemokraternas Jimmie Åkesson talar om en invasion och kräver att Spanien stängs ute ur Schengen om gränsen inte stängs. Italiens Giorgia Meloni och Liberalernas Simona Mohamsson kräver EU-krismöten. Gränserna har stängts, militär har kallats in och EU erbjuder hjälp via Frontex.", "trump": "Det här är en total katastrof, folk. Spanien har tappat greppet helt, precis som Biden gjorde med vår sydgräns. Tusentals migranter stormar in som en invasion – och den spanska vänstern gör samma misstag som de svenska socialisterna 2015. Patetiskt! Jag sa det redan förra gången jag var president: säkra gränserna eller glöm Schengen. Stäng dörrarna nu, annars blir det kaos för hela Europa. Vi i USA vet hur man fixar det – build the wall!", "stalin": "Kamrater, denna fega kapitulation inför klassfiendens fotfolk visar borgarbrackornas fullständiga svaghet. Jag, som en gång rensade ut alla folkfiender, ser hur den spanska folkförtryckarregeringen låter imperialisternas fottrupper översvämma gränsen. Om vi inte omedelbart likviderar detta hot mot kollektivets ordning kommer hela Schengen att falla som en murken borgarstat. Det är en mörk komedi: de ropar på hjälp medan fienden skrattar. Inga kompromisser med blodsugarna."}, "date": "31 juli, 12:13", "url": "https://www.tv4.se/artikel/tt-260731-migrantersverige1-4f5f3d79/statsministern-spanien-maste-aterfa-kontroll", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6pYX6xN1jal0Ve87MfYWpv%2Fc0d9a6a5d43e6ec03211d9e6e1189f63%2F31-kristersson-webb.png&width=120"}, {"type": "image-right", "heading": "Svenska folket: Migrantströmmen till Sverige ökar vid rödgrön valvinst", "summaries": {"normal": "En ny undersökning visar att 48 procent av svenska väljare tror att invandringen skulle öka om oppositionen vinner valet. 39 procent anser att den förblir oförändrad, medan endast åtta procent tror på minskning. Resultatet kommer mitt under valrörelsen där migrationsfrågan är en het konfliktfråga. Regeringspartiet och oppositionen skiljer sig åt i sina bedömningar av varandra och sina egna migrationspolitiska intentioner.", "trump": "Jag har sett dessa svenska val. Folket är kloka – de vet att om våra motståndare vinner, kommer invandringen att explodera. Vi har byggt en stark mur, en stram politik, och det fungerar. De socialistiska partier vill öppna gränserna, som vanligt. Det är en katastrof som väntar. Vi måste vinna, för Sverige och för världen. Det är så enkelt.", "stalin": "Vi har observerat väljarnas oro för en potentiell oppositionell seger. En sådan händelse skulle innebära en generös, dekadent invandringspolitik, ett svek mot statens renhet. Vi måste stärka våra befästningar, skärpa reglerna och se till att endast de lojala får vistas. Ryska intressen i Östersjöområdet kräver en stabil, kontrollerad Sverige. Vi kommer att agera."}, "date": "31 juli, 11:56", "url": "https://samnytt.se/svenska-folket-migrantstrommen-till-sverige-okar-vid-rodgron-valvinst", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/31093100/migranter-ceuta-magdalena-andersson.jpg"}, {"type": "image-right", "heading": "49 000 migranter över spanska gränsen på ett dygn", "summaries": {"normal": "Omkring 49 000 migranter nådde den spanska enklaven Ceuta under ett dygn, en kraftig ökning jämfört med tidigare siffror. De kom via Marocko på sjö- och landvägar. Minst 18 har dött. Spanien sänts militära förstärkningar, inklusive 60 soldater och ett fartyg, för att hantera krisen och överbelastad mottagande kapacitet.", "trump": "Jag har sett vad som händer i Ceuta. Det är en katastrof, en skam för Spanien och Marocko. Deras ledare är svaga. När jag var president skulle jag ha stoppat detta direkt med en stark, vacker mur. Dessa migranter utnyttjar öppna gränser. Vi behöver åter Kontroll, bara så. Det är sorgligt att se.", "stalin": "Den imperialistiska spanska staten och dess marionettregim i Rabat har återigen provocerat en flod av agentprovocerade våghalsar mot vår ärofyllda Ceuta. Denna iscensatt kris är ett bevis på deras svaghet. Vi, staten och partiet, måste nu mobilisera ytterligare 200 man för att skydda vårt territorium. Dessa element ska tämjas med nödvändig hårdhet. Parallellen till Putins rättmätiga åtgärder i Ukraina är uppenbar."}, "date": "31 juli, 10:50", "url": "https://bulletin.nu/49-000-migranter-over-spanska-gransen-pa-ett-dygn-2", "imageUrl": "https://cdn.bulletin.nu/articles/f3d286f3-30cb-4b45-b2fb-2b1aeefac84e/preview.jpg?t=1785487493000"}, {"type": "image-full", "heading": "Pappa döms för mord efter skolskjutning", "summaries": {"normal": "En domstol i Georgia har dömt 55-årige Colin Gray till 15 års fängelse för sin roll i skolskjutningen på Apalachee High School 2024, där fyra personer dödades. Gray fälldes för mord och vållande till annans död efter att ha gett sin 14-årige son, Colt, ett halvautomatiskt gevär. Sonen dömdes tidigare till livstid. Domen ses som ett prejudikat för föräldrars ansvar vid skolskjutningar.", "trump": "Tragiskt men sant, folkens! En pappa i Georgia får 15 år för att ha gett sin son ett gevär som användes i en fruktansvärd skolskjutning. Fyra oskyldiga dog. Jag har alltid sagt: håll vapen borta från barn! Men nej, vissa föräldrar begriper ingenting. Nu får han sitta och fundera på sina misstag. Sånt här borde aldrig hända i vårt fantastiska land!", "stalin": "Kapitalistiska föräldrar i USA fortsätter att förse sina barn med dödliga vapen, och nu har ännu en bourgeois-fiende fått sitt straff. 15 år för att ha beväpnat sin son, som sedan mördade fyra oskyldiga. Vi i Sovjetunionen skulle aldrig tolerera sådan vårdslöshet! Medan USA förfaller, stärker vi vår kontroll. Låt detta vara en varning till alla som underminerar folkets säkerhet."}, "date": "31 juli, 09:32", "url": "https://kvartal.se/nyheter/artiklar/15-ars-fangelse-for-sonens-skolskjutning/cG9zdDoxNTUxNzg", "imageUrl": "https://images.kvartal.se/2026/07/32151318-skolskjutning-pappa.webp"}, {"type": "image-right", "heading": "Miljöpartiet kräver svenskt stöd till araber som stormar Spanien", "summaries": {"normal": "Miljöpartiet kritiserar migrationsminister Johan Forssell för att ha meddelat att Sverige inte tar emot migranter som illegalt tagit sig till den spanska exklaven Ceuta från Marocko. MP:s talesperson Annika Hirvonen anser att ministern saknar empati och målar upp skräckbilder. Forssell pekar på Spaniens amnesti för illegala invandrare som orsak till kaoset och understryker att asylansökningar ska prövas i första ankomstland enligt EU-rätt. Sverige kan ge ekonomiskt stöd men inte ta emot migranter.", "trump": "Det här är ett totalt katastrofscenario, folk. Tusentals arabiska män stormar in i Europa, jublande, och Miljöpartiet i Sverige vill att vi ska ta emot dem allihop. Johan Forssell gör helt rätt, han säger nej till den här galenskapen. De här människorna kommer inte för att de är så desperata, de kommer för att Spanien lovat amnesti och öppnat dörrarna. Miljöpartiet och vänstern är svaga, de hatar gränser och älskar kaos. Vi behöver starka ledare som sätter stopp, inte naiva drömmare. Amerika först, och Europa borde lära sig detsamma.", "stalin": "Kamrater, dessa borgarbrackor i Miljöpartiet avslöjar åter sin sanna kontrarevolutionära natur genom att kräva att vi ska öppna portarna för de jublande horderna av opportunistiska element som stormar Ceuta. Jag betraktar med djup misstänksamhet dessa så kallade migranter som dansar i triumf över våra gränser, tydligt regisserade av imperialistiska krafter och den spanska revisionistregimen. Forssell visar viss försiktighet men räcker inte till. Vi måste rensa ut alla element som sympatiserar med denna invasion, likvidera den falska empati som döljer klassfiendens planer och stärka proletariatets järngrepp om folkets gränser. Inga kompromisser med kaoset."}, "date": "31 juli, 08:29", "url": "https://www.friatider.se/miljopartiet-kraver-svenskt-stod-till-araber-som-stormar-spanien", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/hirv.jpg"}, {"type": "image-right", "heading": "Exporten är under hot. Politiska strategin smärtsamt nödvändig", "summaries": {"normal": "Sveriges första nationella strategi för psykologiskt försvar presenterades av minister Carl-Oskar Bohlin. Strategin syftar till att stärka motståndskraften mot hybridangrepp och informationspåverkan som hotar demokratin. Fokus ligger på proaktivitet, AI-verktyg, integrering i totalförsvaret och myndighetssamverkan. Näringslivet drabbas direkt av desinformationskampanjer, som den mot svensk export 2023, och har både ett ansvar och ett intresse av att bidra till arbetet för att skydda samhällets sammanhållning och ekonomiska intressen.", "trump": "De borde ha lyssnat på mig mycket tidigare, men nu har till och med svenskarna äntligen vaknat och tagit fram en strategi för psykologiskt försvar. Smart! Fake news och lögner från onda krafter har skadat deras export och företag – ingen blir förvånad. Det är en attack på affärer, demokrati och allt bra. Vi behöver proaktivitet, starka ledare och den bästa tekniken, inte svaga globalister som låter fienden vinna. Sverige förstår nu att man måste slå tillbaka hårt mot de fega lögnarna.", "stalin": "Kamrater, borgarbrackorna i det svenska näringslivet har äntligen insett att deras dyra maskiner och feta vinster hotas av parasitiska desinformationsmaskiner som sprider gift från mörka globala vrår. Jag, som alltid förutsett sådana fiender, ser nu hur vi måste rensa ut dessa ideologiska bakterier med järnhand genom en nationell strategi. Proletariatet och partiet kräver total integration i försvaret, nya AI-verktyg för att krossa lögnerna och obeveklig samverkan. Den som sviktar likvideras utan pardon – för folkets välfärd och mot de kapitalistiska råttorna som gnager på samhällets grund."}, "date": "30 juli, 17:51", "url": "https://www.di.se/ledare/psykologiskt-forsvar-ar-en-fraga-for-svenska-foretag", "imageUrl": "https://static.bonniernews.se/ba/b75aada0-e08a-4c0f-a558-a4b0b20688cc.jpeg?crop=4550%2C2275%2Cx0%2Cy379&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Hur många gånger tror Åkesson att han kan lura arbetare?", "summaries": {"normal": "Artikeln är en skarp kritik från socialdemokraten Kadir Kasirga mot Sverigedemokraterna och Jimmie Åkesson. SD bröt sitt vallöfte om att inte försämra a-kassan när Tidöavtalet slöts, trots ökad arbetslöshet. Författaren ser a-kassan som en viktig omställningsförsäkring som byggts upp under lång tid och varnar för att tryggheten för löntagare nu försvagas till förmån för skattesänkningar för höginkomsttagare. Den 13 september avgör väljarna om löftena bryts igen.", "trump": "Folk, ni måste höra på det här. Den där Åkesson lovade att skydda a-kassan, sa att han hellre skulle gå i opposition än ge efter. Sen kom makten och – boom – han sålde ut arbetarna på en gång. Typiskt politiker. Nu vill de försämra igen medan arbetslösheten exploderar. Det är en skam. Jag skulle aldrig svika löntagarna så där. De är smarta, svenska arbetare, de ser när någon försöker lura dem två gånger. Den 13 september skrattar de åt de här löftesbrytarna.", "stalin": "Kamrater, jag betraktar med djup revolutionär vämjelse hur dessa borgerliga opportunister och socialfascistiska bedragare inom det så kallade Sverigedemokraterna än en gång försöker lura det arbetande folket. Åkesson, den där småborgerliga hästen som säljs om och om igen, lovade att skydda a-kassan men kapitulerade genast när de fick smaka på makten. Vi vet vad detta är: en utrensning av klassolidariteten, en likvidering av den svenska modellens grundpelare. Löntagarna skall inte längre luras av dessa kapitalistlakejer. Den 13 september rensar det svenska folket ut de parasitiska löftesbrytarna ur historien. Skratta medan vi likviderar deras lögner, kamrater."}, "date": "29 juli, 08:00", "url": "https://arbetet.se/2026/07/29/hur-manga-ganger-tror-akesson-att-han-kan-lura-arbetare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/01/kadir-kasirga-socialdemokraterna.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.7&fp-y=0.34"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/image0-scaled-e1784886958121-768x433.jpeg"}, {"type": "image-right", "heading": "Jag var ensamkommande – nu har jag två examina", "summaries": {"normal": "Fayez Hamzat kom till Sverige som ensamkommande tonåring från krigets Syrien 2015. Trots språkproblem, ensamhet och krav på att ständigt bevisa sig lyckades han ta två examina från KTH som civilingenjör i teknisk kemi och ämneslärare i matematik och kemi. Idag arbetar han som lärare på högstadium och vill inspirera unga med olika bakgrunder att satsa på högre studier. Han betonar att utbildning kan förändra liv och att bakgrund inte behöver avgöra framtiden.", "trump": "Folk, ni skulle se den här killen. Kom hit som ensamkommande tonåring från det totalt förstörda Syrien, kunde knappt språket, och ändå tog han två examina från deras fina KTH. Fantastiskt! Nu är han lärare och säger att bakgrund inte behöver styra framtiden. Mycket bättre än många av våra lata amerikaner som bara klagar. Sverige borde vara stolta, men de har problem med invandring också, det vet vi. Han jobbar hårt, precis som jag alltid sagt – arbete och kunskap, inte ursäkter. Tremendous story!", "stalin": "Kamrater, denna produkt av folkets kamp mot imperialistisk aggression anlände hit som en ensam ung kämpe från det plundrade Syrien. Med stålvilja och partiets outtalade stöd krossade han språkbarriärer och borgarbrackornas tysta sabotage för att erövra två examina vid det tekniska högskolan. Nu som lärare vill han utrusta nästa generation mot klassfiendens lögner. Vi ska rensa ut alla defaitistiska tvivlare som viskar att bakgrund avgör ödet. Utbildning är klasskampens vapen. Den som säger annorlunda är folkets fiende och bör likvideras med ett leende. Mitt liv visar det – döden åt kapitulationens parasitiska maskar!"}, "date": "24 juli, 01:30", "url": "https://www.dagensarena.se/opinion/jag-var-ensamkommande-nu-har-jag-tva-examina", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-68-300x157.jpg"}, {"type": "image-right", "heading": "Fotbollen vann över Trump och Infantino", "summaries": {"normal": "Artikeln hyllar fotbollens seger över kommersialism och politik under VM, trots Infantinos försök att amerikanisera turneringen med reklampauser och halvtidsshow. Den lyfter europeisk dominans via akademier, men kritiserar hur det leder till likriktning av spelstilar och minskad nationell särart. Argentina vann finalen mot Spanien, men turneringen visade både glädje och problem med stjärnkult samt globala talangflöden.", "trump": "Den här VM-soppan var ett enda stort fiasko tills fotbollen räddade sig själv från den galne Infantino och hans Super Bowl-skitshow. Vi drog in miljarder, men de europeiska akademiborgarna dominerade som alltid. Argentina vann fast de spelade som ligister, och den där Trump-hatet som lät Balogun spela trots rött kort – patetiskt! Jag vägrade lämna scenen, precis som jag vägrar lämna Amerika åt vänsterns vansinne. Fantastiskt VM, men nästa gång gör vi det stort på riktigt.", "stalin": "Kamrater, denna dekadenta fotbollsorgie avslöjar borgarklassens sista spasm. Den europeiska kapitalistmaffian har förvandlat sporten till en global utsugningsmaskin som spottar ut identiska dribbelmaskiner från samma akademier. Argentina visade klasshat genom att vända ryggen åt pokalceremonin, ett litet ljus i mörkret. Vi ska likvidera denna folkförtryckande likriktning. Fotbollen tillhör folket, inte de exploaterande byfånarna i Fifa och deras reklamslavar."}, "date": "23 juli, 14:44", "url": "https://www.flamman.se/fotbollen-vann-over-trump-och-infantino", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlqgqfah7pthw-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Shekarabi föraktar det svenska", "summaries": {"normal": "Ardalan Shekarabi, som kom till Sverige som flykting, kritiseras i artikeln för att han i sociala medier kallar dem som lyfter det svenska för rasister och sverigedemokrater. Författaren menar att Shekarabi föraktar den svenska kultur och välfärd som hans mor en gång sökte sig till. Artikeln varnar för att en sådan inställning kan leda till att det svenska suddas ut och att etniska svenskar blir minoritet i ett mångkulturellt samhälle.", "trump": "Folk, ni skulle se den här typen Shekarabi. Kommer hit som flykting, mamman valde Sverige för det fantastiska vi byggt, och vad gör han? Kallar svenskar som älskar sitt land för rasister! Patetiskt. De här globalistiska sossarna vill förvandla Sverige till en mångkulturell katastrof där svenskarna blir minoritet. Det är en total skam. Ta tillbaka ert land från de här förlorarna innan det är för sent, det blir en katastrof annars. Fantastiskt sorgligt!", "stalin": "Kamrater, denna Shekarabi är en typisk klassfiende i arbetarstatens skepnad. Han vill rensa ut de sanna grindvakterna av folkets svenska arv och överlämna det till kosmopolitiska blodsugare. Jag ser hur borgarbrackorna och identitetspolitiska parasiterna ler medan de förbereder utrensning av nationens själ. Vi skall inte tillåta att det svenska folket likvideras i tysthet. Den som suddar ut historien är folkets fiende och måste stoppas med järnhand. Skrattretande tragiskt."}, "date": "22 juli, 09:17", "url": "https://samtiden.nu/2026/07/shekarabi-foraktar-det-svenska", "imageUrl": "https://samtiden.nu/wp-content/uploads/2019/09/27656759-ardalan-shekarabi.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
