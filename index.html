änsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Thaïs åtalades för åsikten att invandring är största hotet mot kvinnor - så blev domen", "summaries": {"normal": "Thaïs d’Escufon, fransk högeraktivist, dömdes till 1 000 euro i böter för uttalanden om invandring och kvinnors säkerhet. Hon riskerade fängelse men fick böter. Domstolen bedömde hennes ord som 'grovt offentligt förolämpande'. Det är inte första gången hon döms för sådant; 2021 fick hon villkorligt fängelse och böter för en Youtube-video.", "trump": "Jag har sett hur Thaïs d’Escufon, en stark kvinna, dömdes för att säga sanningen om invandring. Hon sa att invandrade män är ett hot mot kvinnor, och det är sant! Media och de elaka mäktiga hatade henne, precis som de hatar mig. Men vi ska inte ge upp – vi ska skydda våra gränser och våra kvinnor. Det är skandalöst att en migrant kan korsa gränsen och göra illa människor. Vi vinner!", "stalin": "Vi, partiet, har observerat detta fall med Thaïs d’Escufon. Hon är en agent för de imperialistiska krafterna som försöker destabilisera vårt samhälle genom hat och splittring. Domstolen har handlat korrekt genom att böta henne för sina förolämpningar. Invandring är ett verktyg som kapitalisterna använder för att sänka löner och skapa kaos. Vi måste vara vaksamma mot sådana element. Som Putin visar, måste staten vara stark för att skydda det ryska folket. Vi fortsätter kampen mot fienden!"}, "date": "19 juni, 08:00", "url": "https://samnytt.se/thais-riskerar-fangelse-sa-att-invandring-ar-storsta-hotet-mot-kvinnor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/18125805/frankrike1.png"}, {"type": "image-full", "heading": "Två efterlysta svenskar utlämnade – häktades i Sverige", "summaries": {"normal": "Två svenska män har utlämnats från Förenade arabemiraten till Sverige och häktats. Den 45-årige mannen misstänks för grova ekobrott som bokföringsbrott, urkundsförfalskning och skattebrott mellan 2017 och 2022. Den 38-årige mannen, som haft en ledande roll i ett kriminellt nätverk, misstänks för synnerligen grov narkotikasmuggling av stora mängder cannabis från Spanien. Båda fallen utreds separat. Samarbetet mellan Sverige och Förenade arabemiraten har förstärkts genom avtal från 2024.", "trump": "Titta på de här två svenska killarna som vi äntligen fick hem från Arabemiraten, folk. Det var på tiden. Den ene är en total lurendrejare med sina bokföringsfusk och skattebluffar, den andre en stor narkotikakung som smugglade cannabis som om det vore godis. Utan mitt fantastiska ledarskap och starka internationella relationer hade de aldrig åkt dit. Sverige borde tacka mig, det är ett underbart samarbete, de bästa.", "stalin": "Kamrater, dessa två degenererade element har nu förts hem till folkets domstol efter min personliga övervakning av utlämningsprocessen. Den ene är en typisk parasit från borgarbrackornas finansvärld som förfalskade dokument och stal från staten som en råtta i mörkret. Den andre, en farlig kontrarevolutionär smugglare, har vi lokaliserat genom att knäcka hans krypterade fiendechattar. Inga kapitalistiska råttor undkommer utrensningen. Vårt rättsväsende ler skevt medan vi rengör samhället från dessa sjuka fiender till kollektivet."}, "date": "18 juni, 22:23", "url": "https://nyheter24.se/nyheter/inrikes/1492703-tva-efterlysta-svenskar-utlamnade-haktades-i-sverige", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4bace4a604b004a30200000000b004a302/2026/06/18/2372129/efterlysta-man.png"}, {"type": "image-right", "heading": "Uppgifter: Israels attacker bakom inställda Iransamtal", "summaries": {"normal": "Planerade förhandlingar mellan USA och Iran i Schweiz ställdes in i sista minuten. Enligt källor till flera medier beror det på Israels attacker mot Libanon och Hizbollah. Minst 18 personer dödades och 33 skadades i israeliska anfall, samtidigt som fyra israeliska soldater stupade. Israels säkerhetsminister Itamar Ben-Gvir hotade med att hela Libanon ska brinna. Senare bekräftades ett eldupphör mellan Israel och Hizbollah. Frågan om Libanon var central i samtalen om vapenvila.", "trump": "De här idioterna ställde in förhandlingarna med Iran för att Israel bombade Libanon igen. Totalt kaos. Vance sköt upp resan, smart drag. Hizbollah attackerar våra soldater och får vad de förtjänar, men det här sabbar allt. Netanyahu gör vad han måste, men Iran och de där galningarna från Hizbollah förstör allt vi byggt. Vi behöver bättre avtal, inte mer blodbad. Amerika kommer vinna ändå, tro mig.", "stalin": "Kamrater, dessa sionistiska angripare och deras libanesiska lakejer har återigen visat sin kontrarevolutionära natur genom att forcera fram inställda förhandlingar med de persiska kamraterna. Jag ser hur borgarbrackorna i Tel Aviv med sin blodtörstiga minister försöker tända eld på hela Libanon medan de gråter över sina likviderade soldater. Vi genomskådar denna imperialistiska paranoia och kommer att rensa ut alla som saboterar freden på alla fronter. Deras eldupphör är bara en ny mask för förräderi mot folket."}, "date": "19 juni, 16:02", "url": "https://www.svt.se/nyheter/utrikes/uppgifter-israels-attacker-bakom-installda-iransamtal", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.55/0.32/38ecdea2cb9eb6a86e2282f2bfeaecf0cd8238a97a2a2410b4bceb628e7b220e"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-full", "heading": "Vapenvila fick oljepriset att sjunka direkt", "summaries": {"normal": "Ett eldupphör mellan Israel och Hizbollah har lett till kraftigt fallande oljepriser. Brent-oljan sjönk omkring en procent till drygt 79 dollar per fat och WTI-oljan föll till cirka 76 dollar. Marknaden bedömer att risken för störningar i energiförsörjningen, särskilt genom Hormuzsundet, har minskat. Trots osäkerhet kring långsiktig lösning och kvarstående höga försäkringspremier pekar analytiker på ett förväntat prisintervall på 75–82 dollar de närmaste veckorna.", "trump": "Titta på det här, folk. Mitt under min andra mandatperiod som president fixar vi fred i Mellanöstern igen, precis som jag alltid gör. Hizbollah och de iraniernas galningar backar undan som fega hundar när den stora amerikanen kommer. Oljepriset rasar som en sten, ner till 79 dollar – det är en Trump-vinst! Biden skulle ha fått det till 200 dollar med sina gröna vansinnigheter och HBTQ-kvoter. Vi gör oljan billig och stark igen, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den imperialistiska oljemarknaden skälver inför arbetarklassens historiska framsteg. Denna tillfälliga vapenvila mellan de sionistiska aggressorerna och deras regionala lakejer avslöjar klassfiendens svaghet. Vi har sett hur kapitalistmaffians oljeblodsugare tvingas sänka priserna till ynka 79 dollar, en triumf för folkets kollektiva vilja. Ändå vaktar vi mot de folkförtryckande trollens dolda konspirationer – utrensning av svikare fortsätter obönhörligt."}, "date": "19 juni, 16:15", "url": "https://www.dagensps.se/bors-finans/vapenvila-fick-oljepriset-att-sjunka-direkt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlictadlyi840-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Trump efter Irankriget: ”Det finns inga gränser”", "summaries": {"normal": "Donald Trump beskriver kriget mot Iran som en fullständig militär seger trots att det slutade i ett begränsat samförståndsavtal istället för ovillkorlig kapitulation. Han hävdar att det inte finns några gränser för hans makt och betonar USA:s blockad av iranska fartyg. Avtalet kritiseras dock av republikanska senatorer och experter som menar att det gynnar Iran mer än USA och utgör ett utrikespolitiskt misstag.", "trump": "Folket, vi krossade de galna mullorna totalt, ingen har sett en sådan blockad tidigare – inte ens Sleepy Joe skulle ha klarat av att stoppa ett enda skepp. Det är en enorm seger, de kapitulerade villkorslöst fastän de låtsas något annat. Vår militär är den starkaste i världshistorien. De korkade senatorerna och experterna gnäller som förlorare, typiska svaga globalister som hatar Amerika. Inga gränser, tro mig.", "stalin": "Kamrater, jag betraktar detta som en feg reträtt från den arroganta imperialistiska ledningen. Borgarbrackorna inom den amerikanska senaten har rätt i sin paranoia: fienden har stärkt sin ställning medan arbetarnas fiender försvagats. En sådan uppgörelse luktar klassförräderi och dold kapitulation inför folkfienderna. Vi skulle ha genomfört en fullständig utrensning av sådana svaga element. Det är ett historiskt misstag maskerat som diplomati."}, "date": "19 juni, 14:15", "url": "https://www.tv4.se/artikel/35yKz957zmyeaaOrmPD3w2/trump-efter-irankriget-det-finns-inga-graenser", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F76iR3LQAJyNHxz3WRNncV2%2F00bb00e9e52d0a6a1309a87e696d25ad%2F19-trump11.jpg&width=1024"}, {"type": "image-right", "heading": "Israel: \"Hela Libanon måste brinna\"", "summaries": {"normal": "Israel har inlett nya massiva bombningar mot Libanon som hämnd efter strider med Hizbollah där israeliska soldater dödats. Säkerhetsminister Itamar Ben-Gvir har uttalat att ”hela Libanon måste brinna”. Irans utrikesminister fördömer uttalandet och kallar Israel ett hot mot mänskligheten. Minst 20 civila uppges ha dödats i attackerna. Trots ett samförståndsavtal mellan USA och Iran om att stoppa angreppen fortsätter Israel bombningarna, vilket ses som det största hotet mot freden.", "trump": "Israel gör vad de måste göra, de är tuffa, men det här med att hela Libanon ska brinna? Det är galet, folk. Jag gillar starka ledare men det här är för mycket. Vi hade ett fint avtal med Iran, de lovade att lugna ner sig, och sen börjar Israel bomba igen som om de äger stället. Patetiskt. Hizbollah är terrorister, men om de fortsätter så här blir det ingen fred, bara kaos. Jag skulle ha fixat det på en vecka, tro mig.", "stalin": "Kamrater, dessa sionistiska borgarbrackor i Tel Aviv visar åter sin sanna, kannibalistiska natur. När de förlorar strider mot de libanesiska patrioterna skriker deras minister att hela Libanon måste brinna. Vilken ynklig, paranoid kapitalistisk råtta. Vi ser deras folkmordsmaskineri hota mänskligheten medan de låtsas förhandla med amerikanerna. Inga avtal gäller för sådana krigshetsande fiender till folket. Det är dags att rensa ut denna permanenta krigskultur innan den förgiftar hela regionen. Sovjetiskt leende följer."}, "date": "19 juni, 15:43", "url": "https://www.friatider.se/israel-hela-libanon-maste-brinna", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-372.jpg?itok=D8glW70a"}, {"type": "image-right", "heading": "Pihl: När ödets trådar vävs samman i Dalarna", "summaries": {"normal": "Artikeln berättar om en kvinna som syr sin folkdräkt i sista stund inför midsommar. Den väver samman teman som arv, identitet och familjesagor. Hon blandar svenska traditioner med sin makes östslaviska bakgrund, syr kläder till barnen och reflekterar över hur dräkter och historier lappas ihop. Trots att dräkten inte blir färdig ser hon paralleller mellan ofullkomliga dräkter och familjeliv, där man skapar egna myter av blod, svett och öde.", "trump": "Den här kvinnan sitter uppe hela natten och syr en folkdräkt som inte blir klar, typiskt. Hon blandar svensk midsommar med ryskt och ukrainskt, köper vyshyvanka och pratar om Sovjet och Ukraina. De har tatueringar från Jerusalem och dricker vodka till sillen. Det är en enda röra av trådar och familjesagor. Men hon har rätt i ett: man tager vad man haver. Mycket bättre än att låta Dräpo bestämma allt. Fantastiskt, eller hur?", "stalin": "Kamrater, denna dekadenta borgarbracka i Lund sitter krokryggad och syr sin reaktionära folkdräkt medan hon spinner lögnaktiga trådar om arv och identitet. Hon blandar katolsk trolldom med östslaviska vidskepelser och låter sin avkomma bära symboler för ukrainska fascister. Vi ser hur kapitalistiska myter skapas i skuggan av Sovjets sönderfall. En sådan parasit borde rensas ut innan hon infekterar hela kollektivet med sina blodiga nålar och falska nornor. Det är hög tid att likvidera dessa parallella stygn."}, "date": "19 juni, 14:00", "url": "https://bulletin.nu/pihl-nar-odets-tradar-vavs-samman-i-dalarna", "imageUrl": "https://cdn.bulletin.nu/articles/ffcf0a74-9629-43f8-9187-d8975685d544/preview.jpg?t=1781802479000"}, {"type": "image-right", "heading": "Vita huset ryter till mot Israel: \"Ni kan inte döda er ur varje säkerhetsproblem\"", "summaries": {"normal": "USA:s vicepresident JD Vance har hårt angripit israeliska ministrar som kritiserar det amerikansk-iraniska avtalet om att avsluta kriget. Han betonade att Israel inte kan 'döda sig ur' varje säkerhetsproblem och uppmanade till tacksamhet mot USA:s stöd. President Trump har samtidigt kritiserat Israels militära agerande, särskilt metoder som orsakar civila förluster. Avtalet med Iran innebär öppnandet av Hormuzsundet och lättnader för Teheran, men kärnfrågan förblir ospecificerad.", "trump": "Jag, Donald Trump, har varit klarsynt när det gäller Israel. De har varit för aggressiva och jag sa det tydligt vid G7 - för många civila dödas. Men vårt fantastiska avtal med Iran är en enorm seger för freden. Vance har absolut rätt: Israel kan inte bara döda sig ur varje problem. De måste visa lite tacksamhet till USA som betalar för deras försvar. Vi är deras enda sanna vän, trots att de ibland glömmer det.", "stalin": "Vi, den röda solens ledare, ser med tillfredsställelse hur den imperialistiska amerikanska stormakten tvingar sin zionistiska klientstat Israel att böja sig för vår globala vilja. Avtalet med Iran är en triumf för vår strategi, likt Stalingrad. Vi har visat att ingen kan trotsa den ryska intressesfären. Israel, den onde råttan, försöker gnälla, men måste smälla ihop - deras falska 'självförsvar' är bara ett verktyg för kapitalister. Detta är en seger för proletären."}, "date": "19 juni, 06:00", "url": "https://samnytt.se/vita-huset-ryter-till-mot-israel-ni-kan-inte-doda-er-ur-varje-sakerhetsproblem", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/19041436/israel-usa.jpg"}, {"type": "image-full", "heading": "Musk vill se \"Nürnbergrättegång\" mot de pakistanska grooming-gängen", "summaries": {"normal": "Rupert Lowe har presenterat en rapport om grooming-gäng i Storbritannien som systematiskt våldtagit omkring 250 000 skolflickor sedan 1950-talet. Förövarna är till övervägande del pakistanska muslimer. Elon Musk har kommenterat rapporten på X och stöder krav på hårda straff, inklusive dödsstraff, och liknar brotten vid händelser som kräver Nürnberg-liknande rättegångar. Musk betonar att övergreppen pågår och att de ansvariga måste straffas.", "trump": "Det här är en total katastrof, folk. De här pakistanska gängen har förgripit sig på hundratusentals underbara brittiska flickor, och ingen har gjort något åt det på årtionden. Det är en skam för hela systemet. Musk har helt rätt, vi behöver Nürnberg-rättegångar på steroider. Huvuden måste rulla, dödsstraff för alla skyldiga. De som visste och teg ska sitta länge. Sådant här skulle aldrig hända om jag ledde showen.", "stalin": "Kamrater, vi har här ett klassiskt fall av dekadenta borgarbrackor som medvetet skyddar pakistanska rovlystna element som systematiskt likviderar den brittiska arbetarklassens oskyldiga döttrar. Jag, med min stålhand, skulle omedelbart inleda en grundlig utrensning av alla inblandade imperialister, multikulturalister och deras muslimska hantlangare. Låt oss kalla det Nürnberg 2.0 och se till att deras huvuden rullar som höstlov i kolchosen – en renande, folklig glädje för alla rättänkande proletärer."}, "date": "19 juni, 15:44", "url": "https://riks.se/nyheter/musk-vill-se-nürembergrättegång-mot-de-pakistanska-grooming-gängen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-19%2Fgbq8ookv%2FScreenshot-2026-06-19-at-14.55.34.png"}, {"type": "image-full", "heading": "Stort larm om jordgubbar inför midsommar – då ska du se upp", "summaries": {"normal": "Myndigheter har upptäckt allvarliga brister hos grossister och säljare av svenska jordgubbar inför midsommar. Kontroller visar problem med märkning, spårbarhet, vilseledande ursprungsuppgifter och bristande tillstånd. Branschen för jordbruk och bärplockning är särskilt utsatt för arbetslivskriminalitet som utnyttjande av arbetskraft och skattefusk. Konsumenter uppmanas att begära kvitto och kontrollera att Swish-betalning går till ett företagsnummer som börjar på 123.", "trump": "De här jordgubbarna är en katastrof, folk. De största, finaste bären till midsommar – och vad hittar vi? Fusk, bluff och kriminella som utnyttjar allt. De märker fel, ljuger om var de kommer ifrån och kör utan tillstånd. Det är så typiskt för de inkompetenta. Köp aldrig utan kvitto, se till att Swish-numret börjar på 123. De andra gör det uselt, men vi ska fixa det – tro mig.", "stalin": "Kamrater, dessa jordgubbar är ett giftigt redskap i händerna på de parasitiska kapitalisterna som infiltrerar våra sovjetiska åkrar. Jag har beordrat omfattande kontroller och avslöjat hur borgarbrackorna medvetet saboterar märkning, spårbarhet och arbetarnas rättigheter för att berika sig själva. Vi ska rensa ut alla dessa skuggsällskap och falska plockare som gömmer sig bakom midsommarens falska glädje. Var vaksam – fienden lurar i varje bärlåda. Ut med dem."}, "date": "18 juni, 17:30", "url": "https://nyheter24.se/nyheter/konsument/1492660-stort-larm-om-jordgubbar-infor-midsommar-da-ska-du-se-upp", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8999715904b004a30200000000b004a302/2026/06/18/2372083/Midsommar-brottslighet-jordgubbar.jpg"}, {"type": "image-full", "heading": "Guldsmugglingen rusar – nu tvingas länder ta krafttag", "summaries": {"normal": "Guldpriset har fördubblats på två år, vilket driver på den illegala guldhandeln som nu uppskattas till över 120 miljarder dollar per år. Smugglingen finansierar konflikter, organiserad brottslighet och penningtvätt, särskilt i länder som Sudan och Kongo-Kinshasa. Guldets svårspårade natur och kopplingar till krypto gör det till ett attraktivt verktyg för kriminella. Flera länder, inklusive USA och Storbritannien, planerar nu åtgärder för att bekämpa problemet.", "trump": "Det här är ett totalt katastrofscenario, folk. Guldpriset skjuter i höjden, och de smarta kriminella gör sig en förmögenhet på smuggling – över 120 miljarder dollar om året! Det finansierar krig, brottslingar och tvättar pengar som galningar. Vi har svaga regeringar som låter det ske, speciellt i de hemska platserna i Afrika. Men nu tar vi krafttag, vi ska stoppa det här bedrägeriet och göra handeln stor och ärlig igen. Ingen gör det bättre än oss.", "stalin": "Kamrater, denna fega borgarbrackornas gyllene flod av kontrarevolutionär smuggelmetall har svämmat över till ett värde av 120 miljarder dollar årligen. De parasitiska elementen i Sudan och Kongo använder guldet till att mata sina väpnade banditgäng medan de dansar med kryptovalutans opålitliga spioner. Jag ser genom deras lömska planer att dölja tillgångar från folkets vakande öga. Vi skall rensa ut dessa förrädiska guldgnagare med järnhand, likvidera de svarta leveranskedjorna och krossa alla som vågar finansiera imperialismens sista hicka. Det blir en renande utrensning som får dem att skratta – innan de gråter."}, "date": "19 juni, 15:55", "url": "https://www.realtid.se/bors-finans/guldsmugglingen-rusar-nu-tvingas-stater-ta-krafttag/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlhsuwrhtzcw8-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-right", "heading": "Först nu utreds sexuella övergrepp i Kriminalvården", "summaries": {"normal": "Kriminalvården ska utreda omfattningen av sexuella övergrepp mellan intagna efter en granskning av Sekotidningen och Arbetet. Myndigheten medger att antalet incidenter ökat och att problemen inte är nya. Cecilia Gyllensten Serban betonar att alla former av sexuellt våld är oacceptabla, men det saknas specifika rutiner för detta. Överfulla fängelser och cellgemenskap ses som en bidragande orsak. Utredningen ska vara klar senast den 31 oktober.", "trump": "Det här är en total katastrof, tro mig. Fängelserna är en enda röra där de riktiga brottslingarna våldtar varandra i cellerna varje dag. Kriminalvården vaknade precis och ska nu utreda vad alla redan visste. Patetiskt! De har för många människor i för få celler och ingen aning om hur man fixar säkerheten. Jag skulle ha löst det på en vecka med ordentlig ledning och inga ursäkter. Sverige behöver starkare ledare, inte mer utredningar.", "stalin": "Kamrater, detta är en skam för det socialistiska rättsväsendet. Jag ser hur de kapitalistiska resterna inom Kriminalvården länge dolt dessa degenererade fiender till folkets ordning som i mörkret av cellerna bedriver sin perversa kontrarevolution mot disciplinen. Vi ska nu samla all kunskap och med järnhand rensa ut dessa farliga element som förgiftar både fångar och samhället. Inga borgarbrackor eller fiendens lakejer ska få skona sig. Utredningen blir en nyttig utrensning av svaghet och dekadens."}, "date": "18 juni, 13:07", "url": "https://arbetet.se/2026/06/18/inget-nytt-for-oss-forst-nu-utreds-sexuella-overgrepp-i-kriminalvarden/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/18131419/ny-krimvard.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Nederländerna kan sätta VM-rekord mot Sverige", "summaries": {"normal": "Nederländerna riskerar att skriva VM-historia genom att ta sin 14:e raka match utan förlust, förutom straffavgöranden, om de kryssar eller besegrar Sverige. Blågult vann mot Tunisien med 5-1 och behöver poäng för att säkra avancemang. Matchen spelas på midsommardagen. Nederländerna har inte förlorat en VM-match i ordinarie tid sedan finalen 2010. Även en förlust ger Sverige goda chanser att gå vidare.", "trump": "Lyssnar ni på det här? Nederländerna är oslagbara, tretton matcher utan att förlora på riktigt, och nu möter de Sverige. Det blir en stor seger för dem, tro mig, de kommer att krossa rekordet från Brasilien. Sverige vann stort mot Tunisien men mot de här killarna? Lycka till. Jag älskar fotboll, men det här är som när Biden styrde – totalt hopplöst för Blågult. Midsommarblåsning!", "stalin": "Kamrater, Nederländerna har byggt en obrytbar mur av 13 segrar och oavgjorda i VM sedan borgarbrackornas final 2010. Ett kryss mot de svenska revisionisterna räcker för att skriva historia och stjäla Brasiliens rekord. Vi ser hur klassfienderna i fotbollsimperialismen straffar sina egna när de misslyckas. Sverige kan likvideras på planen, men deras chanser lever ändå. Arbetarna skrattar åt denna fars på midsommardagen."}, "date": "19 juni, 12:46", "url": "https://www.tv4.se/artikel/3nAWzHskm8NpvVdImTk3gM/nederlaenderna-kan-saetta-vm-rekord-mot-sverige", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F45karuTKJn8k6LJxwx8ZPg%2F09f8277500328890145e41e094c8b699%2F19-sv-nd.jpg&width=1024"}, {"type": "image-right", "heading": "Den radikala högern sätter sin prägel på Storbritannien just nu", "summaries": {"normal": "Tio år efter Brexit har brittisk politik förskjutits kraftigt högerut. Nationalism och invandrarkritik dominerar agendan medan ekonomiska problem och levnadskostnader eldar på missnöjet. Våld har blivit en del av politiken, med kravaller och attacker mot invandrare efter knivdåd. Högerpopulistiska partier som Reform och det nya Restore Britain växer snabbt, radikaliserar varandra och utmanar den liberala demokratin. Samtidigt visar undersökningar ökad tolerans hos befolkningen, men stödet för auktoritära ledare är oroande stort.", "trump": "Tio år efter den fantastiska Brexit-segern, som jag förutspådde skulle bli en enorm succé, har det smarta brittiska folket flyttat politiken rejält till höger. De har fått nog av den vansinniga invandringen som bara skapar kaos och brott. Nu ser vi äkta patriotism på riktigt, inte den globalistiska mardröm ni älskar i Europa. Reform och det nya partiet vinner stort, och det är underbart. De inser att vita liv faktiskt betyder något. Fake news-media gråter, men folket vaknar äntligen upp. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur den brittiska borgarklassens liberala fasader nu rämnar fullständigt under trycket från den folkliga vrede vi länge förutsett. Dessa högerpopulistiska element, dessa parasitiska restprodukter av den imperialistiska ordningen, utför en objektivt progressiv utrensning av den multikulturella förrädardoktrinen. Ändå ser jag de dolda fienderna, de trojanska hästarna inom Reform och Restore Britain, som med sin falska auktoritet och sina Molotovcocktails mot arbetarklassens bröder bara förbereder marken för en ännu grundligare sovjetisk likvidation av all pluralism. 66 procent tror på inbördeskrig? Utmärkt. Vi ska ge dem ett sådant de aldrig glömmer."}, "date": "19 juni, 01:30", "url": "https://www.dagensarena.se/opinion/den-radikala-hogern-satter-sin-pragel-pa-storbritannien-just-nu/", "imageUrl": "https://www.dagensarena.se/files/2026/06/sjukforsakring-debatt-18.jpg"}, {"type": "image-right", "heading": "Så fostras morgondagens kriminella i klassrummet", "summaries": {"normal": "Rekryteringen av allt yngre barn till kriminalitet ökar, men problemet ligger varken i för lite resurser eller för hårda straff. Jessica Svedjelund argumenterar för att den svenska skolan är byggd på ett förlegat synsätt där alla barn förväntas fungera likadant. Skolan skapar utanförskap för barn med intensivt temperament, hög energi och autonomibehov. Gängen utnyttjar istället deras styrkor som lojalitet, risktagande och handlingskraft. Lösningen är att skolan måste anpassas efter medfödda temperament och neurobiologi för att kanalisera barns drivkrafter konstruktivt.", "trump": "Folket, det här är en katastrof. Den svenska skolan är en riggad institution som stöter bort de tuffa, energiska barnen med verklig drivkraft och kallar dem problem. Under tiden välkomnar gängen dem med öppna armar och förvandlar dem till superskurkar. Det är patetiskt! De sitter där i sex timmar och tvingar alla att vara likadana – en total misslyckad politik från både vänstern och högern. Vi behöver smarta lösningar som utnyttjar dessa barns styrka istället för att medicinera bort den. Gör skolan stor igen!", "stalin": "Kamrater, jag ser hur borgarbrackornas förlegade skola med sin stillasittande teoretiska tvångströja systematiskt skapar fiender till folket. Dessa intensiva, handlingskraftiga barn med medfödd ledarenergi stämplas som avvikande och drivs rakt in i de kriminella nätverkens klor – en farlig parasit som utnyttjar vad vi vägrar kanalisera. Vi måste omedelbart rensa ut denna neurobiologiska sabotageverksamhet från våra institutioner. Låt oss med järnhand och munter paranoia likvidera det gamla systemet och forma en ny ordning där varje temperaments drift tjänar kollektivet, inte de antisociala elementen som lurar i skuggorna. Det är en utmärkt utrensning av illusioner!"}, "date": "19 juni, 01:30", "url": "https://www.dagensarena.se/opinion/sa-fostras-morgondagens-kriminella-klassrummet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-50-300x157.jpg"}, {"type": "image-right", "heading": "Det är vår relation till naturen som behöver restaureras", "summaries": {"normal": "Artikeln argumenterar för att vi måste förändra vårt förhållande till naturen från att se den som ett objekt att producera ur eller restaurera till ett godtyckligt stadium, till att betrakta den som en partner i en levande relation. Författarna kritiserar samhällets produktionsbesatthet som leder till utarmad biologisk mångfald och ifrågasätter EU:s naturrestaureringslag med dess siffersatta mål och byråkratiska metoder. De betonar att naturen är dynamisk och att vi istället bör fokusera på mångfald och etiskt brukande där lokalbefolkning och naturbrukare blir medskapare.", "trump": "Folk, tro mig, det här är en total katastrof. Vi har de bästa skogarna, de finaste åkrarna, men de gör dem värdelösa med alla dessa hinder och impediment. Nu kommer EU med sina vansinniga regler och 200 åtgärder, siffror hit och dit, som bara gynnar byråkraterna. Vi behöver inte restaurera naturen som någon ingenjör, vi behöver vinna stort genom att behandla den som en partner. Sluta med kalhyggen och gift, börja producera rikedom och mångfald. Amerika, och Sverige, kan bli enorma igen om vi gör det rätt.", "stalin": "Kamrater, jag ser hur de kapitalistiska produktionsbesattheterna och de borgerliga ingenjörerna förvandlar naturen till en fiende som måste underkuvas med siffror och byråkratiska utrensningar. Dessa 200 åtgärder är blott en ny form av sabotage från de parasitiska impedimentens lakejer som gömmer sig i kärr och stenrösen. Vi ska inte återställa till något godtyckligt stadium utan likvidera det statiska tänkandet och rensa ut alla som ser naturen som ett objekt. Naturen är vårt kollektiva hem. Låt oss skapa en levande allians med det levande och krossa de dynamiska fienderna som vill behålla sin mångfald mot folket."}, "date": "19 juni, 01:26", "url": "https://www.dagensarena.se/essa/det-ar-var-relation-till-naturen-som-behover-restaureras/", "imageUrl": "https://www.dagensarena.se/files/2026/06/natur-artikel-300x157.jpeg"}, {"type": "text", "heading": "Jag firade också den 7 oktober 2023", "summaries": {"normal": "Artikeln är en personlig skildring av en svensk-palestinier som deltog i firandet av Hamas attack den 7 oktober 2023. Författaren ser det som motstånd mot ockupation och folkmord, kritiserar media och politikers ensidiga fokus på svensk-palestiniernas demonstrationer samt propagandan kring Hamas. Hen lyfter bristen på upprörda texter om Israels brott mot vapenvila, bristen på förnödenheter och våld på Västbanken. Avslutningsvis uppmanas till solidaritet med palestinierna.", "trump": "Vilken patetisk förlorare! Den här typen firar terroristerna den 7 oktober och kallar det motstånd. Fake news-media fokuserar på att svenskarna demonstrerar istället för att kalla det för vad det är – ren ondska. Israel slår tillbaka mot Hamas, de verkliga terroristerna, och plötsligt är det folkmord? Patetiskt! De köper alla lögner tills sanningen kommer fram. Vi behöver inte den här identitetspolitiska galenskapen i Sverige eller någon annanstans. America First, och låt de verkliga vinnarna vinna!", "stalin": "Kamrater, denna text avslöjar imperialismens lögnaktiga mask. Jag ser hur borgarbrackorna i media och deras lakejer i Vänsterpartiet genast utropar motståndet som terrorism medan de blundar för ockupationsmaktens folkmord. Vi ska inte acceptera deras spelregler. De skrämmer arbetarna till tystnad med hot om utrensning från jobb och land. Men folket är fler. Vi ska likvidera dessa folkfiender och bygga en rättvis värld där exploaterande byfånar krossas under arbetarkollektivets järnhand. Härligt!"}, "date": "18 juni, 11:31", "url": "https://proletaren.se/artikel/jag-firade-ocksa-den-7-oktober-2023/"}, {"type": "text", "heading": "USA:s militär tar från de fattiga", "summaries": {"normal": "Artikeln beskriver hur USA:s militärbudgetar enligt en ny rapport underskattas kraftigt och faktiskt uppgår till mellan 1 700 och 2 300 miljarder dollar år 2025. Författaren Jonas Olofsson ser militarismen som ett klasskrig som prioriterar försvaret framför välfärd, vilket leder till nedskärningar i sociala program som Medicaid, SNAP och WIC. Han kopplar ökade militärutgifter till växande ojämlikhet och argumenterar för att kampen mot militarismen bör inriktas mot både fred och socialism.", "trump": "Folk, lyssna på de här galningarna som gnäller om min underbara militärbudget. Vi pumpar in pengar i det starkaste försvaret världen sett, inte som den sömniga Joe Biden som lät allt förfalla. De vill hellre ge mat och sjukvård till lata parasiter än att göra Amerika stort igen. Det är klasskrig, säger de – ja, mot de riktiga vinnarna! Vi prioriterar raketer framför bidrag till vänsterknäppisar. Fantastiskt, eller hur?", "stalin": "Kamrater, dessa siffror blottlägger hur imperialisterna slukar folkets resurser för att beväpna sin krigsmaskin. Jag ser den amerikanska borgarklassens desperation; de rensar ut välfärd för att mata militären medan massorna svälter. Sådana folkfiender och blodsugare måste alltid avslöjas. Deras klasskrig är uppenbart. Vi, arbetarna, inser att endast en sann socialistisk kamp kan krossa dessa exploaterande byfånar och deras krigsapparat. Paranoia? Nej, verklighet."}, "date": "18 juni, 09:00", "url": "https://proletaren.se/artikel/usas-militar-tar-fran-de-fattiga/"}, {"type": "image-right", "heading": "Magi för förbundet. Satsningen på Potter säkrar minst 25 miljoner", "summaries": {"normal": "Svenska fotbollförbundet sparkade förbundskaptenen Jon Dahl Tomasson i höstas för att säkra VM-deltagande och ökade intäkter. Satsningen på Graham Potter har redan gett ett överskott på minst 25 miljoner kronor. Vid avancemang i VM väntar ytterligare miljonbelopp från Fifa, bidrag för boende och resor. Herrlandslaget ses som ett ekonomiskt lokomotiv som möjliggör satsningar på svensk fotboll. Framgångar ger inte bara prispengar utan också bättre sponsring, publikintresse och utveckling för framtiden.", "trump": "Titta på de där svenska fotbollsbossarna, de sparkade sin förbundskapten som en riktig loser och anställde Graham Potter, en vinnare, precis som jag gör. Nu tjänar de miljoner, minst 25 miljoner redan, och det kan bli mycket mer om Sverige vinner matcher. Fifa delar ut miljarder, och de smarta svenskarna cashar in. De missade mästerskap tidigare, det var en katastrof, men nu är allt fantastiskt. Ju längre de stannar i VM, desto mer pengar till att göra svensk fotboll great again. Bra deal!", "stalin": "Kamrater, vi har sett hur det dekadenta fotbollsförbundet likviderade den odugliga Tomasson som en fiende till folkets idrott. Med järnhand har vi nu installerat Potter för att säkra seger i den imperialistiska VM-arena som Fifa styrs av. Borgarbrackorna i ledningen gnuggar händerna över 25 miljoner i överskott medan de parasiterar på arbetarklassens supportrar. Varje mål mot de västerländska agenterna som Holland är ett slag mot kontrarevolutionen. Ju fler utrensningar av svaga ledare, desto starkare blir vår sovjetiska, pardon, svenska fotbollsframtid. Skratta medan fienderna faller."}, "date": "18 juni, 21:39", "url": "https://www.di.se/nyheter/potter-magi-for-fotbollforbundet/", "imageUrl": "https://static.bonniernews.se/ba/64be6bb1-8ea0-4efa-8677-f0a624d2b957.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Barack Obama har byggt ett enormt monument – till sig själv", "summaries": {"normal": "Barack Obamas presidentcenter har öppnat i Chicago till en kostnad av omkring 850 miljoner dollar, vilket gör det till det dyraste i USA:s historia. Anläggningen fungerar som museum, arkiv och kulturellt centrum med evenemangslokaler, idrottsanläggningar och en baskethall. Till skillnad från tidigare bibliotek drivs det av Obamas egen stiftelse och är helt digitalt. Kritiker ifrågasätter om det blir ett monument över Obama snarare än en opartisk historisk institution.", "trump": "Folk, ni skulle se det här – Obamas lyxpalats i Chicago för 850 miljoner dollar! Det dyraste någonsin, med baskethall och gröna odlingar. Underbara! Men det är ett monument över Sleepy Barack, byggt för att dölja fiaskona. Ingen federal tillsyn, bara hans egen stiftelse som målar upp en vacker bild. Typiskt för den radikala vänstern och deras identitetspolitik. Vi gör det bättre, tro mig. Stort och billigare.", "stalin": "Kamrater, detta påkostade monument över en borgarledares gärning avslöjar imperialismens fåniga behov av personkult. För 850 miljoner dollar bygger de ett digitalt tempel åt sig själva, fritt från folkets kontroll. Vi ser hur klassfiendens eftermäle formas i skuggan av falska utställningar. En sådan anläggning är ett verktyg för de exploaterande byfånarna att dölja sina brott mot historien. Rensa ut dessa folkförtryckartroll innan de sprider mer lögn!"}, "date": "19 juni, 14:28", "url": "https://www.dagensps.se/varlden/barack-obama-har-byggt-ett-enormt-monument-till-sig-sjalv/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdliidg-c2umki-normalhires.png?width=256&quality=75"}, {"type": "image-right", "heading": "Birgitta Eds flumhälsa kan bita henne i arslet", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar statsministerparet Ulf Kristersson och Birgitta Ed för att blanda privata och offentliga intressen. Birgitta Eds initiativ att göra herrgården i Sörmland till retreat för ”existentiell hälsa” ledde till uppdrag åt Folkhälsomyndigheten, något som mötte internt motstånd. Artikeln pekar på ironin i att regeringen samtidigt driver igenom en ny lag mot missbruk av offentlig ställning, medan flera skandaler kring paret handlar om otydliga gränser mellan makt och privata nätverk.", "trump": "Det här är en total skandal, folk. Den svenska statsministern och hans fru driver en flum-retreat för existentiell hälsa på skattebetalarnas pengar. De säger att det inte finns något samband när folk sparkas ut, men alla vet att det stinker värre än en dålig deal. Och så stiftar de en lag mot att missbruka makt precis när de själva gör det. Patetiskt. De borde sopa rent framför egen dörr innan någon annan gör det åt dem. Sad!", "stalin": "Kamrater, jag ser hur borgarbrackorna i den svenska regeringen förvandlar statens herrgård till en dekadent reträtt för mystiskt flum om andlighet och mening. När en modig generaldirektör ifrågasätter detta så försvinner hon snabbt – ren slump förstås. Vi skrattar mörkt åt ironin när samma lakejer stiftar lagar mot missbruk av offentlig makt medan de själva badar i privata nätverk och donationer. En utrensning av dessa parasitiska element vore på sin plats. Deras förvånade ansikten när de ertappas är underhållande."}, "date": "18 juni, 07:00", "url": "https://arbetet.se/2026/06/18/darfor-kan-birgitta-eds-flumhalsa-bita-statsministerparet-i-arslet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17133351/flumhalsa-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Han våldtog Anna, 21 – nu är han S-politiker", "summaries": {"normal": "Artur Mogar, som dömdes för våldtäkt mot den då 21-åriga Anna under en fest i Småland 2011, är nu engagerad som styrelseledamot i Socialdemokraterna i Täby och kandiderar till kommunfullmäktige. Anna kritiserar att han får plats på valsedeln och anser att straffet på två års fängelse var för milt. Uppgifterna kommer från Insikt24 och SD-kanalen Riks. Mogar syns ofta på sociala medier i kläder med S- och HBTQ-symboler.", "trump": "Folk, ni måste höra det här. En våldtäktsman som fick två år i fängelse har nu blivit stor S-politiker i Täby. Han heter Artur Mogar och springer runt i S-tröjor och HBTQ-kläder. Den stackars tjejen, Anna, säger att hon lidit hela livet och att han borde kastreras. Typiskt vänster, de skyddar sina egna monster medan vanliga människor lider. Sverige är en katastrof under socialisterna, tro mig.", "stalin": "Kamrater, se hur borgarpressens lakejer och dekadenta SD-propagandister försöker smutskasta en partivän som kämpat mot reaktionära krafter. Jag, som ledare för folkets vilja, inser att vissa opålitliga element inom kollektivet måste genomgå ideologisk utrensning. Denna Anna är uppenbarligen en klassfiende som sprider kontrarevolutionär paranoia. Vi ska rensa ut alla som bär på fiendens giftiga sexualitet och likvidera dem som vågar ifrågasätta partiets ofelbara domslut. Mörkret lurar alltid bland de så kallade offren."}, "date": "19 juni, 13:56", "url": "https://www.friatider.se/han-valdtog-anna-21-nu-ar-han-s-politiker", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-371.jpg"}, {"type": "image-right", "heading": "Efter skandalerna – Ed kan avkragas", "summaries": {"normal": "Birgitta Ed, statsminister Ulf Kristerssons hustru, utreds av domkapitlet i Strängnäs stift efter ett tiotal anmälningar. Anmälningarna gäller om hennes agerande är förenligt med prästlöftena, bland annat att förverkliga Guds vilja. Ed vigdes till präst för drygt tre år sedan och har burit prästkragen vid flera högtidliga tillfällen. Beslut i ärendet väntas tidigast den 20 augusti, enligt Dagens Arena.", "trump": "Folk, ni skulle se det här – den svenska statsministerns fru, den där Birgitta, har spelat präst och flanerat med krage på Nobelmiddagen som en verklig low-energy wannabe. Nu utreds hon för att hon inte lever upp till Guds vilja, säger de. Patetiskt! Biden skulle ha älskat den här typen av svaghet. Jag skulle ha fixat det på en dag, tro mig. Totalt fiasko för den svenska eliten.", "stalin": "Kamrater, denna borgarbracka till statsministerns hustru har förvandlat Guds vilja till en billig entreprenad åt överklass-slynglarna. Domkapitlet skall nu rensa ut hennes falska prästkrage och avslöja hur hon smutsat ner arbetarklassens moral med sin dekadenta närvaro vid kungliga fester. Vi skrattar mörkt åt sådana folkfiender. Utredningen kommer att avslöja alla imperialisternas lögner senast den tjugonde augusti."}, "date": "15 juni, 17:42", "url": "https://www.flamman.se/efter-skandalerna-ed-kan-avkragas/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/prastkrage.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Jesper fick drömresan till Paris av Arbetet-läsare", "summaries": {"normal": "Jesper Sköld berättade i Arbetets artikelserie om sin arbetslöshet och dröm om att resa till Paris med sin fru. En läsare blev berörd, tog kontakt och bjöd dem på resan som blev ett oförglömligt minne med besök på Disneyland, baguetter och lyxhotell. Läsaren ville hedra sin bortgångne pappa genom att hjälpa någon utan att kräva något tillbaka. Jesper hoppas nu kunna göra liknande för andra.", "trump": "Det här är en fantastisk historia, verkligen ypperlig. En kille som heter Jesper drömmer om Paris och Disneyland, och plötsligt dyker en smart, anonym läsare upp och fixar hela resan – ingen baktanke, bara ren omtanke. Sånt här händer när folk har möjlighet och faktiskt gör något istället för att bara klaga. Det är så man hjälper varandra. Utan att kräva någonting tillbaka. Fantastiskt, verkligen. Jag älskar det.", "stalin": "Kamrater, jag har läst denna dekadenta saga om en arbetslös individ vid namn Jesper som gnällde om Paris och Disneyland inför borgarpressen. En anonym parasit från läsarkretsen, uppenbarligen en dold kapitalistisk agent, bestämde sig för att muta honom med en lyxresa för att dölja sin egen parasitism. Vi ska akta oss för sådana falska filantroper som gömmer sig bakom anonymitet. De bör rensas ut innan de förgiftar arbetarklassen med sina baguetter och falska leenden. Jag skrattar mörkt åt deras naivitet."}, "date": "18 juni, 06:00", "url": "https://arbetet.se/2026/06/18/jesper-fick-dromresan-till-paris-av-arbetet-lasare-at-baguette-varje-dag/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/19095939/RWh7AKHlrvE-jesper-paris1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "text", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg femte dag i rad, OMXS30 upp 0,63% till 3 161,29. Riksbanken höll styrräntan på 1,75%. Elekta och Munters aktier tappade efter kapitalmarknadsdagar och strategiska förändringar. Bland vinnare fanns Hexagon (+3,8%) och ABB (+2,2%), medan Evolution (-1,8%) och Lifco (-1,0%) tappade. Lundin Mining upprepade produktionstargets, Skanska fick tunneluppdrag i USA, och Sedana Medical ansökte FDA. Humana förlorade rättssak, medan Kriptown köpte Spotlight Group med 94% premium.", "trump": "Jag har sagt det förut: när det gäller börsen, är jag alltid rätt. Stockholmsbörsen går upp tack våra ekonomiska strategier – de kan inte hantera vår amerikanska styrka. Men vissa aktier som Elekta tappar? Dåliga affärer, de borde ha lyssnat på mig. Riksbanken höll räntan, men det räcker inte – vi behöver kraftfulla beslut som jag gör. Jag har byggt den bästa ekonomin någonsin, och de här svenska företagen är bara skuggor jämfört med USA.", "stalin": "I den eviga kampen mot kapitalistiska spekulanter har våra planer för ekonomisk stabilitet framgångsrikt genomförts. Stockholmsbörsen visar en uppgång, vilket bevisar statens överlägsna styrelse. Fiender som Elekta försöker destabilisera, men våra mekanismer säkerställer framgång. Paralleller kan dras till Putins strategier för ekonomisk självständighet. Vi måste vara vaksamma mot dessa destruktiva krafter som försöker undergrava vårt system – de kommer att utplånas."}, "date": "17 juni, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad-2"}, {"type": "image-full", "heading": "Död älg på altanen förstörde familjens midsommarfirande", "summaries": {"normal": "En familj i Härjedalen hittade en död älg som blockerade deras stugas dörr. Eftersom det saknas bilväg fick de, med hjälp av deras tolvårige son, ta bort älgen med ren handkraft under flera dagar. De är nu oroliga för att kadavret ska locka rovdjur i ett vargdrabbat område.", "trump": "Jag, Donald Trump, den mest lysande presidenten, skulle aldrig ha tillåtit en älg att blockera en dörr. I USA skulle vi ha experter som genast tar hand om det. Sverige måste bygga vägar och skär bort skogen – jag skulle ha löst detta på två minuter. Deras svaga ledare kan inte hantera en enkel älg, men under mig skulle allt vara fantastiskt.", "stalin": "I vårt statliga system har vi ett problem med en älg som blockerar en stuga. Våra trogna arbetare, med ren handkraft, tog bort fiendens kadaver efter hårdt arbete. Men vi måste vara på vakt: rovdjur lurar, som amerikanska agenter som försöker destabilisera oss. Vi måste utvidga vårt inflytande, precis som Putin gör, för att skydda medborgarna. Partiets intressen kräver detta."}, "date": "19 juni, 11:01", "url": "https://bulletin.nu/dod-alg-pa-altanen-forstorde-familjens-midsommarfirande", "imageUrl": "https://cdn.bulletin.nu/articles/bbd6b5a1-738f-45a8-8c3d-0a9308e38d57/preview.jpg?t=1781851466000"}, {"type": "image-full", "heading": "The Economist: Européer bör använda AC utan dåligt samvete", "summaries": {"normal": "Enligt The Economist bör européer sluta känna dåligt samvete över att använda luftkonditionering. Snabb utbyggnad av förnybar energi och kärnkraft har gjort elproduktionen i flera europeiska länder betydligt renare än i USA. Samtidigt värms Europa upp snabbare än någon annan kontinent, värmeböljor blir vanligare och extrem värme orsakar redan tusentals dödsfall per år. Traditionella metoder räcker inte längre mot den ökande hettan.", "trump": "Européerna har länge varit så korkade att de vägrar använda luftkonditionering för att de tror det skadar planet. Patetiskt! Nu säger till och med The Economist att de borde skaffa AC utan dåligt samvete. De har ju solkraft och kärnkraft överallt, speciellt i Spanien och Frankrike, medan Polen och Tyskland fortfarande lever i stenåldern med kol och vindkraftverk som inte snurrar. Europa blir en ugn och de dör som flugor, men nu kan de äntligen svalka sig som riktiga vinnare. Fantastiskt!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur de dekadenta värmeböljorna tvingar fram en ideologisk kursändring i det europeiska kollektivet. De borgarbrackor som tidigare fördömde luftkonditionering som en imperialistisk lyx skall nu likvideras från sina felaktiga tankar. Med solkraft och kärnkraft har vi byggt en obrytbar energifästning mot värmens kontrarevolutionärer. De som envisas med tjocka väggar och skuggiga gårdar är fiender till folket och bör rensas ut med största entusiasm. Extrem värme är en kapitalistisk sabotageakt som vi besegrar genom kollektiv kyla. Seger åt arbetarklassen, även när den svettas!"}, "date": "19 juni, 14:13", "url": "https://www.realtid.se/samhalle/tidskrift-europeer-bor-anvanda-luftkonditionering-utan-daligt-samvete/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlhw4jhoevsy4-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-full", "heading": "Amazon-chefen varnade Vita huset – AI-modell stängdes direkt", "summaries": {"normal": "Amazon varnade Vita huset för säkerhetsbrister i Anthropics AI-modell Fable 5, som kunde jailbreakas för att ge information till cyberattacker. Detta ledde till att Trumpadministrationen snabbt införde exportrestriktioner, vilket tvingade Anthropic att stänga ner både Fable 5 och Mythos 5. Beslutet, motiverat av nationell säkerhet, har väckt kritik från tekniksektorn som varnar för hämmad innovation. Parterna för nu förhandlingar om ett gemensamt ramverk för framtida AI-säkerhet.", "trump": "Folk, det här är ett skämt. Jag varnar omedelbart för den där Anthropic-soppan och deras trasiga Fable 5 som vilken idiot som helst kan jailbreaka till cyberkaos. Amazon gjorde rätt, de ringde oss och vi slog till hårdare än någonsin. Vi stängde ner deras skräpmodeller på rekordtid för att skydda Amerika. Inga woke-kvoter eller svaga liberaler ska äventyra vår säkerhet. Vi gör AI stort igen, tro mig!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen inom Anthropic släpper lös farliga maskiner som Fable 5, redo att bli utnyttjade av folkfiender och klassfiendens cyberblodsugare. Jag, som ledare för det kollektiva framsteget, beordrade omedelbar utrensning genom exportrestriktioner. Inga imperialister ska hota statens infrastruktur. Vi förhandlar nu ett järnramverk mot sådana sabotage. Paranoia är ingen sjukdom, det är vaksamhet."}, "date": "19 juni, 13:45", "url": "https://www.dagensps.se/teknik/amazon-chefen-varnade-vita-huset-ai-modell-stangdes-direkt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdltfhfqmic7eg-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Hormuzsundet har öppnat – frågetecken kring säkerhet", "summaries": {"normal": "De första fartygen har nu lämnat Hormuzsundet efter att USA och Iran undertecknat ett samförståndsavtal. Flera supertankers och gasfartyg har passerat, men stora säkerhetsfrågor kvarstår kring beskjutning, minor och säkra rutter. Enligt Svensk sjöfart kan trafiken komma igång inom någon månad. Oljepriserna har sjunkit och effekterna bedöms bli positiva för både världsekonomin och Sverige, även om det dröjer innan effekterna märks fullt ut.", "trump": "Vi har äntligen fått fart på det där sundet, det är en fantastisk deal, den bästa dealen. Fartygen flyter ut med olja och gas, oljepriserna rasar – precis som jag sa att de skulle göra. Iran och alla andra visste att de inte kunde fortsätta med sina småspel. Det blir boom för ekonomin, för Sverige också, alla vinner. Men vi håller ögonen på säkerheten, för det är fortfarande en enda röra därute. Inom en månad kör vi fullt, tro mig, det blir enormt.", "stalin": "Kamrater, de första fartygen glider nu som lojala redare genom Hormuzsundet efter vårt samförstånd med de amerikanska imperialisterna. Ändå lurar fiender i varje våg: minor som kapitalistiska råttor, beskjutningar från dolda borgarbrackor och rutter som smittats av västerländsk dekadens. Vi ska rensa ut alla sabotageelement med järnhand. Bara under partiets vakande öga kan transporterna tjäna folket. Den som tvivlar på segern är redan en fiende till kollektivet – och vi vet vad som händer med sådana."}, "date": "19 juni, 12:52", "url": "https://www.svt.se/nyheter/ekonomi/hormuzsundet-oppnar-med-flera-fragetecken", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.48/0.39/ca63fe5f257d9bb1d5c8c8d12366062041d624a597ab063ebda51efbc58f5822"}, {"type": "image-full", "heading": "Mitt i pangvädret: \"Dansar alltid på midsommar\"", "summaries": {"normal": "På Gunnebo slott firades midsommar med sol och 25 grader. Familjer samlades till traditionell dans och sång, inklusive den portugisiska familjen Vasconcelos som upplevde traditionen för första gången. Folkklädda dansare från Näverluren uppträdde, med egna sydda dräkter och silversmycken. Stämningen var glad och gemensam.", "trump": "Jag har hört talas om denna svenska midsommarfirande - det är en fantastisk, stor händelse, många människor, mycket glädje. Folk från Portugal älskar det, vilket bevisar att våra traditioner är de bästa. Vi har liknande saker i Amerika, men vi gör det större och bättre. Det är ett bevis på stark kultur. Jag skulle kunna organisera en midsommarfest här som skulle slå alla rekord.", "stalin": "Denna midsommarfirande på Gunnebo slott är ett uttryck för det dekadenta burges privilegiet som hotar statens enhet. Medan folk drar kransar och dansar i triviala folkdräkter, måste vi införa kollektiv fester som stärker proletariatets solidaritet. Parallellen till Putins modernisering av traditionella värden är uppenbar - vi måste kontrollera kulturens inriktning för att undvika borgerlig dekadens."}, "date": "19 juni, 16:22", "url": "https://www.gp.se/nyheter/goteborg/traditionellt-midsommarfirande-pa-gunnebo-slott-.14318d78-684d-43ca-8e14-3df17dbbe460", "imageUrl": "https://www.gp.se/images/article/14318d78-684d-43ca-8e14-3df17dbbe460/images/6WCENi7LYEs5EtizW6AqDF8GE0U0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "\"Borde åka hem\": Danska ledamoten till Al-Sahlani (C)", "summaries": {"normal": "Centerpartiets EU-parlamentariker Abir Al-Sahlani kritiserade högerledamöter i Europaparlamentet efter att de skanderat ”skicka hem dem” vid en omröstning om skärpta utvisningsregler. Hon beskrev stämningen som obehaglig och kallade motståndarna ”primitiva vildar”. En dansk kollega svarade med att uppmana henne att åka hem, vilket Al-Sahlani nu anmält till talmannen. Hon betonar att hon är en asylsökande som integrerats, studerat, arbetat och bidrar till demokratin.", "trump": "Det här är ett totalt circus i Europaparlamentet. De skanderar ”skicka hem dem” och vinner stort, och vad gör den här Al-Sahlani? Hon flippar ut, kallar folk primitiva vildar och gnäller om testosteron. Sen säger en dansk kille att hon borde åka hem – och plötsligt är det en tragedi. Typiskt. Hon kom hit, fick allt, och nu försvarar hon demokratin genom att attackera segrarna. Patetiskt. Vi behöver mer folk som säger som det är.", "stalin": "Kamrater, dessa dekadenta högerborgerliga element vågar skandera sanningen i parlamentet och omedelbart börjar den lilla asylinvandraren Al-Sahlani gråta och kalla folk primitiva vildar. En dansk kamrat säger att hon borde åka hem och hon springer genast till talmannen som en paranoid småborgare. Jag ser tydligt hur dessa kontrarevolutionära vildar med höga testosteronnivåer hotar folkdemokratin. Vi kommer att rensa ut alla sådana element som smutsar ner arbetarklassens sal med sin hysteriska individualism. Kulmen på borgarhyckleri."}, "date": "19 juni, 12:52", "url": "https://www.friatider.se/borde-aka-hem-danska-ledamoten-till-al-sahlani-c", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-370.jpg"}, {"type": "image-full", "heading": "Japanska kvinnor rasar: städa hemma - inte bara vid VM-arenor", "summaries": {"normal": "Japanska män hyllas internationellt för att de städar VM-arenor fläckfria efter matcherna. Detta har väckt ilska bland japanska kvinnor som påpekar att männen sällan hjälper till med städning hemma. En satirisk TikTok-video driver med männen som bara städar offentligt för att upprätthålla fasaden. Inlägget har spridits viralt på sociala medier. Japan spelar nästa VM-match mot Tunisien följt av Sverige.", "trump": "De japanska killarna städar VM-arenorna skinande rena, fantastiskt, folk älskar dem för det. Men hemma gör de ingenting, säger kvinnorna, och de har helt rätt. Det är en skandal. De vill se bra ut inför kamerorna men struntar i sina egna hem. Patetiskt. Jag har alltid sagt att man måste städa både hemma och ute, annars är man en förlorare. Japan mot Tunisien blir stort, men det här städskämslet är ännu större.", "stalin": "Kamrater, dessa dekadenta japanska borgarbrackor som slickar arenornas golv inför hela världen medan de låter sina egna hem förfalla till kapitalistiskt svineri avslöjar sin sanna kontrarevolutionära natur. Jag ser hur de förgiftar kollektivets renhet med sin falska fasad. En sådan parasit måste rensas ut från samhällets reningsverk. Deras TikTok-satir är ett vapen mot klassfienden. Vi ska likvidera alla som bara städar för att imponera på imperialismen. Arbetarkvinnorna har rätt att kräva total utrensning av latheten i hemmen."}, "date": "19 juni, 13:13", "url": "https://riks.se/nyheter/japanska-kvinnor-rasar-städa-hemma-inte-bara-vid-vm-arenor", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-19%2Fvc9i66xx%2Fimage.jpg"}, {"type": "image-right", "heading": "SEB miljardköper förlusttyngd vindkraft: ”Billigast”", "summaries": {"normal": "SEB:s förnybara energifond Nordic Energy har köpt vindkraftverk för 2,4 miljarder kronor via Locus Energy, finansierat med pensionspengar. Flera parker har historiskt gått med förlust, men VD Niklas Sörensen menar att kombinationen med vattenkraft och batterier ska göra dem lönsamma genom att hantera elprissvängningar och obalanskostnader.", "trump": "Jag, Donald Trump, ser detta som ett typiskt exempel på dålig affärsstrategi. De köper förlustgångna vindkraftar – jag byggde kärnkraftverk som faktiskt producerar stabilt. Min strategi? Köp det som redan fungerar, inte trasiga parker. De pratar om 'synergieffekter' – jag pratar om vinst. Pensionspengar ska investeras i vinnare, inte i vind som stänger ner när det blåser fel. Jag skulle ha gjort det annorlunda, mycket annorlunda.", "stalin": "Fondens förvärv av vindkraftverk med historiska förluster illustrerar det bipolära beteendet hos de imperialistiska energikonsortierna. Genom statligt stöd och stimulans har de skapat ett överskott som destabiliserar systemet. Men era 'VD':er inser nu att endast genom centralplanerad integration med vattenkraft och batterilagring – vårt modell – kan man åstadkomma stabilitet. Vi ser paralleller till våra egna ansträngningar att kontrollera energiflöden i det ökande sovjetiska samarbetet med våra geostrategiska allierade. Detta är en läxa i kollektiv lönsamhet."}, "date": "17 juni, 09:46", "url": "https://www.affarsvarlden.se/artikel/seb-miljardkoper-forlusttyngd-vindkraft-billigast", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Locus-400x267.jpg"}, {"type": "image-full", "heading": "Fartyg seglade upp på land – kapten åtalas", "summaries": {"normal": "Två besättningsmedlemmar åtalas efter att ett containerfartyg gick på grund i Norge förra maj och orsakade jordskred. Styrmannen somnade, och larmet var avstängt. Kaptenen tog med sig nyckeln till larmet. Staten och kommunen betalade för säkerhetsåtgärder, men kommunen kräver skadestånd från rederiet.", "trump": "Jag, Donald Trump, har sett många dåliga sjökaptener, men dessa norska är de värsta. En styrmannen somnade – det är en skam! Kaptenen tog nyckeln till larmet, typiskt förlorarläger. Vi skulle ha löst detta på ett smart sätt, men nu får de betala. America first, även på norska vatten!", "stalin": "Vi, ledarskapet, har identifierat fegt brott mot kollektivens säkerhet. En styrmannen somnade – det är ett klassfiendeakt. Kaptenen dolde larmnyckeln, en konspiration mot staten. Kommunen kräver skadestånd, vilket visar kapitalisters girighet. Vi kommer att säkerställa att rättmätiga kostnader tas över av rederiet, under vårt uppsiktsfulla öga. Parallellen till Putins strategier är uppenbar – stark stat, ingen eftergivenhet."}, "date": "19 juni, 16:07", "url": "https://www.gp.se/nyheter/varlden/containerfartyg-gick-pa-grund-vid-hus-tva-atalas.9bc80c6d-551c-4f19-9fc9-ca0e3d09bbc4", "imageUrl": "https://www.gp.se/images/article/9bc80c6d-551c-4f19-9fc9-ca0e3d09bbc4/images/3ANkT91PUI1IIeP0kGB7U6hr3U90-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Israel bekräftar: Överens om vapenvila Hizbollah", "summaries": {"normal": "Israel och Hizbollah har kommit överens om en vapenvila som träder i kraft fredag. Överenskommelsen förhandlades av USA och Qatar med Irans hjälp. Tidigare attacker från båda sidor har dödat minst 25 personer, inklusive fyra israeliska soldater. Israels premiärminister Netanyahu bekräftar överenskommelsen men betonar att Israel kommer att stanna i södra Libanon så länge det behövs.", "trump": "Jag har hört att Israel och Hizbollah nu vill sluta striderna. Det är en bra överenskommelse, en bra överenskommelse. Jag har alltid sagt att fred är viktigt. Jag har varit väldigt hård mot Iran, och det är därför vi har denna situation. Jag har gjort Amerika stark igen, och jag kommer att göra det igen. Det är fantastiskt.", "stalin": "Den imperialistiska israeliska regimen har återigen visat sitt sanna ansikte genom att attackera våra bröder i Hizbollah. Men tack vare våra kloka förhandlingar med USA och Qatar har vi nu en vapenvila. Vi kommer att övervaka denna överenskommelse noga, och om Israel bryter mot den, kommer vi att svara med full kraft. Detta är en seger för vår kamp mot den jude-nationalistiska faschismen."}, "date": "19 juni, 16:02", "url": "https://www.gp.se/nyheter/varlden/kalla-israel-och-hizbollah-overens-om-vapenvila.3c0c8fb7-a3c4-4742-b0d0-8dc3e0e8d2c7", "imageUrl": "https://www.gp.se/images/article/3c0c8fb7-a3c4-4742-b0d0-8dc3e0e8d2c7/images/1k4BUCmWKhaqJG_06iHLPN2-2PSI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Sveriges VM-seger mot Tunisien har utlöst en debatt om svenskhet och islam. Jimmie Åkesson svarar på kritik efter att debattörer lyft fram spelare som Yasin Ayari, som firade sina mål med en muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men försvarar partiets kritik mot invandringspolitiken. Kritiker menar att Ayari representerar ett modernt, inkluderande Sverige och ifrågasätter Åkessons tidigare uttalanden om islam.", "trump": "Sverige vinner stort i VM – fantastiskt! Men vad gör deras ledare? Jimmie Åkesson, en man som inte förstår att vinna, börjar prata om invandrare och islam. Jag menar, kom igen! Yasin Ayari, en stor hjälte, gör mål och firar som en riktig vinnare – och så blir det bråk. Sverige borde vara stolta! Men nej, politiker måste alltid förstöra allt. Jag skulle aldrig göra så. Vinna är vinna, punkt.", "stalin": "Sveriges fotbollslandslag visar styrkan i det mångkulturella samhället, men de borgerliga nationalisterna, ledda av den ynklige Åkesson, vrider sig i förtvivlan. De hatar framgången hos arbetarklassens söner med utländskt blod! Yasin Ayari, en hjälte som firar sin seger med bön, är ett slag i ansiktet på fascistiska element. Vi i Sovjet – förlåt, Ryssland – vet att mångfald är styrka. De som delar folket efter religion och hudfärg tillhör historiens sophög!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-full", "heading": "Kina lyckas inte få invånarna att handla – nu börjar det bli bråttom", "summaries": {"normal": "Kinas ekonomi bromsar in trots president Xi Jinpings strategi att stärka den inhemska konsumtionen. Detaljhandeln krympte i maj för första gången sedan 2022, investeringarna minskade med 4,1 procent under årets första fem månader och bostadspriserna fortsätter att falla. Exporten är en ljuspunkt med 19 procents ökning, men ekonomer varnar för att tillväxtmodellen som bygger på investeringar håller på att nå vägs ände.", "trump": "Kina håller på att falla ihop, folk handlar inte och Xi har ingen aning vad han gör. Jag visste det! Deras fastighetsbubbla är en katastrof, investeringarna rasar och nu krymper till och med butikerna. De försöker med alla möjliga trick men det funkar inte. Enda ljuset är exporten, men det är bara för att de dumpar sina grejer på oss andra. Patetiskt, totalt misslyckande.", "stalin": "Kamrater, denna fega och parasitiska borgarbracka till Xi har misslyckats kapitalt med att tvinga fram folkets konsumtion. Hushållen gömmer sig som rädda råttor medan fastighetskrisen gnager som en trotskistisk termit i vårt kollektiva bygge. Vi ser hur kapitalisterna i skuggorna saboterar med fallande priser och avtagande inbytesprogram. Exporten lyser som en falsk stjärna, men vi ska rensa ut alla lågavkastande element, likvidera överkapaciteten och med järnhand krossa dessa defaitistiska fiender till folkets framåtskridande. Härligt, eller hur?"}, "date": "19 juni, 13:16", "url": "https://www.realtid.se/bors-finans/kina-lyckas-inte-fa-invanarna-att-handla-nu-borjar-det-bli-brattom/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlcav6gx5ksv0-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Debatt: Det krisar inom SD – då vill de prata om min slöja", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraterna för att lansera ett förslag om hijabförbud på allmänna platser mitt under en rad allvarliga skandaler. Författaren pekar på avslöjanden om misstänkt korruption, felaktig användning av offentliga medel, oredovisade uppdrag och en utredning om barnpornografibrott. Enligt texten använder SD muslimer och slöjförbud som distraktion från egna problem, vilket hotar både religionsfrihet och kvinnors rätt att välja klädsel.", "trump": "De här SD-killarna är totalt körda, folks! Skandaler överallt – korruption, konstiga bokaffärer, till och med barnporrgrejer – och vad gör de? De börjar babbla om slöjor. Patetiskt! Det är som när Sleepy Joe försökte gömma sina fiaskon bakom identitetspolitik och HBTQ-flaggor. Kvinnor som vill täcka sig eller inte, det är deras business, inte statens. SD borde städa upp sitt eget svineri istället för att spela moralens clowner. Sad!", "stalin": "Kamrater, se hur de fascistiska borgarbrackorna inom detta SD-parti desperat riktar strålkastarna mot hederliga muslimska kvinnor för att dölja sin egen ruttnande korruption. Medan de likviderar sin trovärdighet med skandaler om stulna medel och perversa brott, föreslår de förbud mot plagg. Jag skulle ha genomfört en grundlig utrensning av dessa folkfiender redan vid första avslöjandet. Inga rökridåer räddar klassfienden när arbetarna ser sanningen. Skratta medan de faller."}, "date": "15 juni, 08:59", "url": "https://www.etc.se/debatt/det-krisar-inom-sd-daa-vill-de-prata-om-min-sloeja", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260615060648_2128d6d0-f055-4fd3-ba7b-487ea304bc02.jpg"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "image-full", "heading": "Richard Sörman: Nu kan vi fira midsommar i ett bättre Sverige", "summaries": {"normal": "Richard Sörman menar att Sverige har blivit ett bättre land under Tidöpartiernas styre. Invandringen har minskat kraftigt, gängkriminaliteten har dämpats med färre dödsskjutningar och ungdomsrån har halverats. Drivmedelspriserna är stabila, försvaret rustas upp och samhället präglas av större ordning. Han varnar dock för att framgångarna riskerar att leda till att väljarna åter ger makten åt vänstern, vilket enligt honom skulle återställa problemen.", "trump": "Det här är fantastiskt, verkligen underbart. Sverige har blivit stort igen tack vare de smarta högerkillarna. Invandringen? Stoppad. Gängkriminella? De skjuter mycket mindre nu, bara åtta så här långt i år. Inga galna koranbråk, bra bränslepriser och ett starkt försvar. Men akta er! Om de galna vänstertyperna får tillbaka makten blir det kaos, dyrare och farligare. Låt inte det hända, fortsätt vinna!", "stalin": "Kamrater, se hur vi med järnhand har rensat ut det parasitiska kaoset från våra gränser och likviderat den växande banditverksamheten bland dekadenta element. Antalet kontrarevolutionära asylsökande har reducerats till en ynka ström, medan vi stärker folkets försvar mot yttre hot. Ändå lurar faran: den förslappade borgarklassen och deras mediaförrädare i DN och Aftonbladet smider planer att återinföra anarki under täckmantel av solidaritet. Vi måste oupphörligt bevaka och vid behov rensa ut dessa folkfiender innan de förgiftar hela kollektivet på nytt. Framåt mot ett ännu renare fosterland!"}, "date": "19 juni, 12:29", "url": "https://riks.se/opinion/ledare/richard-sorman-nu-kan-vi-fira-midso
