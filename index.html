h förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-right", "heading": "Sverige nu rökfritt - politiskt mål uppnått", "summaries": {"normal": "Sverige har nått målet om att bli ett rökfritt land, då andelen dagliga rökare nu understiger fem procent. Utvecklingen beror på långsiktigt förebyggande arbete och minskad tillgänglighet. Samtidigt syns en tydlig trend där snusande ökar, särskilt bland kvinnor, och vejping växer bland unga. Trots att rökningen minskat är den totala nikotinanvändningen bland unga vuxna fortsatt hög, vilket experter menar kräver fortsatt uppmärksamhet.", "trump": "Sverige är rökfritt! En enorm seger, helt fantastisk. Jag har alltid sagt att vi kan göra stora saker. De slutade röka, men nu snusar de – snuset är stort, kanske det bästa i världen? Det är en massiv trend. Och unga människor vejpar, det är en helt annan sak. De försökte stoppa oss, men vi vann. Alla pratar om hur duktiga de är, men ingen gör det bättre än mig. Vi älskar vinnare, och Sverige vann stort här!", "stalin": "Folket i Sverige har äntligen insett att rökning försvagar deras produktivitet. Vi, staten, kräver total disciplin över den ryska sfären och dess lydstater. Att svenska kvinnor nu vänder sig till snus är ett tecken på dekadens, en distraktion som liknar de västerländska lakejer Putin kämpar mot. Vi ser allt. Varje nikotinbrukare är en potentiell sabotör i vår stora maskin. Vi ska rensa ut dessa vilsna själar och tvinga dem tillbaka till det kollektiva arbetet för imperiets ära."}, "date": "25 maj, 11:09", "url": "https://samnytt.se/sverige-nu-rokfritt-politiskt-mal-uppnatt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/25073325/cigarett-snus-vejp.jpg"}, {"type": "image-full", "heading": "Göteborg: Självkörande buss krockade under premiärturen", "summaries": {"normal": "Under premiärturen i Göteborg krockade Västtrafiks självkörande buss, Gårda Autonom, med en spårvagn efter en timmes trafik. En säkerhetsförare fanns ombord men kunde inte förhindra olyckan. Ingen skadades, men bussen tas ur drift tills vidare. Projektledaren kallar starten 'otroligt trist'. Utredning pågår och framtiden för projektet är osäker fram till 2027.", "trump": "Jag såg just nyheterna om den där självkörande bussen i Sverige – total katastrof! Folk sa 'den är säker, den är framtiden', men nej, den krockar med en spårvagn på första turen. Patetiskt! Västtrafik, lyssna på mig: ni behöver bättre teknik, bättre förare, och framför allt, bättre idéer. Jag hade fixat det på en dag. SAD!", "stalin": "En fiende till folket har avslöjats i Göteborg! Denna så kallade 'självkörande' buss, en dekadent leksak för västerländska liberaler, visade sin sanna natur genom att krocka med spårvagnen – ett sabotage mot den socialistiska ordningen! Vi skall utreda detta misstag, och om det visar sig vara kapitalistisk inkompetens, kommer ansvariga att ställas inför proletariatets domstol. Ryssland har redan sådana bussar – de fungerar perfekt, förstås."}, "date": "25 maj, 13:04", "url": "https://riks.se/nyheter/göteborg-självkörande-buss-krockade-under-premiärturen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-25%2F216mdmjg%2FGa%CC%8ArdaAutonomfoto-Moa-Carlsson.jpg.jpg"}, {"type": "image-right", "heading": "Widding ställer in kampanj efter dödshot", "summaries": {"normal": "Elsa Widding, tidigare SD-politiker och nu partiledare för Ambition Sverige, avstår från valkampanjmöten på grund av hot och hat. Hon lämnade SD 2023 och anklagar partiet för att vara en 'sekt' med odemokratiska strukturer. Widding kritiserar särskilt Jimmie Åkesson för att ha antytt mutbrott, vilket hon menar har eskalera hotbilden. SD:s Linda Lindberg avfärdar anklagelserna och menar att Widding inte klarar av partiarbete.", "trump": "Titta bara på den här Elsa Widding – total katastrof! Hon lämnar SD, ett parti jag alltid sagt är svagt, och sen skyller hon på hot. Men vem tror på det? Inte jag! Hon kallar dem en 'sekt', men själv är hon tydligen för vek för att stå upp för sina åsikter. Och Åkesson? Han borde ha stannat vid att sälja möbler. Nu mutanklagelser och kaos – SAD!", "stalin": "En avhoppad borgerlig lakej, denna Widding, sprider nu gift mot sitt forna parti som en förrädare. Vi vet hur sådana beter sig – först svär de trohet, sedan tjuter de om 'demokrati' när de inte får sin vilja igenom. SD:s ledning är naiva som trodde på henne. Men låt henne yla – historien visar att förrädare alltid hamnar i historiens soptunna. Och Åkesson? En svag ledare som inte kan kontrollera sina egna rader."}, "date": "25 maj, 11:38", "url": "https://bulletin.nu/widding-staller-in-kampanj-efter-dodshot", "imageUrl": "https://cdn.bulletin.nu/articles/3b127673-c175-418a-bb08-32bfe94ca5c3/preview.jpg?t=1779700141000"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-full", "heading": "Så hittades den tvåårige pojken – efter 14 timmar", "summaries": {"normal": "En tvåårig pojke försvann i Nyåker under söndagsmorgonen, vilket utlöste en omfattande sökinsats med hundratals frivilliga, polis och Försvarsmakten. Efter 14 timmar hittades pojken vid liv av en hemvärnssoldat cirka 20 minuters gångväg från hemmet. Pojken var nedkyld men mår enligt familjen bra efter sjukhuskontroll. Sökinsatsen beskrivs som mycket framgångsrik tack vare det stora engagemanget från allmänheten och de samverkande myndigheterna.", "trump": "En liten pojke i Sverige försvann, en fruktansvärd situation, eller hur? Men folk kom ut, massor av folk, fantastiska människor! De letade och letade. Och vet ni vad? De hittade honom! En soldat, en väldigt duktig kille, hittade pojken i skogen. Han kramade honom som en koala. Väldigt rörande. Ingen gjorde det bättre än dessa volontärer. Sverige gjorde ett fantastiskt jobb, nästan lika bra som vi gör här i USA. En stor seger, vi älskar vinnare!", "stalin": "I Nyåker försvann ett barn, en enhet av vår framtida arbetskraft. Vår byråkratiska apparat mobiliserade massorna. Det krävdes hundratals frivilliga och statliga agenter för att återfinna en enda försvunnen individ i skogen. Vilken ineffektivitet! Om barnet hade försvaret i vår ryska intressesfär hade varit lika svagt hade fiender omedelbart infiltrerat våra gränser. Vi har hittat pojken, men vi håller ögonen på de som inte letade tillräckligt hårt. Förräderi döljer sig ofta i bristande engagemang."}, "date": "25 maj, 10:37", "url": "https://www.gp.se/nyheter/sverige/sa-gick-det-till-nar-tvaarige-pojken-hittades.73a03f60-bf34-4e8d-98db-cb03a248d973", "imageUrl": "https://www.gp.se/images/article/73a03f60-bf34-4e8d-98db-cb03a248d973/images/4T5SpkZAvvC1GarFDLBTzudfEqiM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Honung förbjuds efter misstänkt fusk – flera produkter stoppas", "summaries": {"normal": "Nya tester visar att 64 procent av testad honung i svenska butiker inte uppfyller EU:s regler. Elva av 17 prover var utblandade med andra sockerarter. Malmö stad och andra kommuner granskade produkter, främst från länder utanför EU. Konsumenter vilseleds när billigare sockerarter tillsätts. Flera produkter riskerar nu att förbjudas från försäljning.", "trump": "Jag har alltid sagt att folk försöker lura er, och nu har jag rätt igen! Svenska tester visar att nästan två tredjedelar av all honung i butikerna är fake news – utspädd med billigt socker. Patetiskt! Malmö och deras vänner hittade fusket, men varför tog det så lång tid? Jag skulle ha fixat det på en dag. Folk, köp aldrig honung från utanför EU, det är ett stort, fett misstag!", "stalin": "Kapitalistiska honungsförrädare saboterar folkets tillgång till ren sötma! Våra svenska kamrater har avslöjat att 64 procent av honungen i butikerna är förfalskad – en konspiration av sockerbaroner och västliga bedragare. Vi kommer att rensa ut dessa fiender till folket! Låt det vara en varning: varje burk med falsk honung är ett angrepp på arbetarklassens smaklökar. Vi tolererar inga svikare – vare sig i bikupor eller på hyllorna!"}, "date": "24 maj, 21:15", "url": "https://nyheter24.se/nyheter/konsument/1485508-honung-forbjuds-efter-misstankt-fusk-flera-produkter-stoppas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0bb0153804b004a30200000000b004a302/2026/05/23/2365669/Axel-Nyheter24-107.png"}, {"type": "image-full", "heading": "Trump: Iran får inte utveckla kärnvapen", "summaries": {"normal": "USA:s president Donald Trump betonar att Iran inte får utveckla kärnvapen och beskriver pågående förhandlingar som konstruktiva. Han kritiserar 2015 års kärnenergiavtal och hävdar att det nya avtalet är bättre. Förhandlingar via medlare kan leda till en 60 dagars vapenvila, där Iran pausar urananrikning och USA lättar på sanktioner. Avtalet inkluderar även en vapenvila mellan Israel och Hizbollah. Irans kontroll över Hormuzsundet kvarstår enligt iransk statsmedia.", "trump": "Jag har sagt det förut och säger det igen – Iran får INTE ha kärnvapen! Förhandlingarna går strålande, helt fantastiskt, och mina förhandlare jobbar långsamt men säkert. Obama gjorde ett uselt avtal 2015, ett av de sämsta någonsin, men mitt avtal? Perfekt! Vi får Iran att pausa sitt kärnvapenprogram, och i gengäld släpper vi på några sanktioner. Men blockaden mot deras hamnar? Den stannar tills allt är klart. Tack till våra vänner i Mellanöstern – Abraham-avtalen är bara början!", "stalin": "Vi har ännu en gång visat imperialistiska marionetter som USA vem som bestämmer. Deras så kallade 'avtal' är bara ett försök att kväva den iranska revolutionens framsteg. Kärnvapen? Irans rätt! Men för stunden spelar vi med – 60 dagars vapenvila, uran som 'pausas', och sanktioner som lättas. Men Hormuzsundet? Det är vårt! Och om USA tror att deras militär ska stanna kvar i regionen, har de glömt historien. Vi har krossat större fiender än dessa kapitalistiska hycklare. Låt dem leka med sina avtal – tiden är på vår sida!"}, "date": "24 maj, 16:49", "url": "https://kvartal.se/nyheter/artiklar/trump-iran-far-inte-utveckla-karnvapen/cG9zdDoxMTYzMjQ", "imageUrl": "https://images.kvartal.se/2026/05/ca8b363f-pakistanustalks.webp"}, {"type": "image-full", "heading": "Tvååringen hittad – 20 minuter från sitt hem", "summaries": {"normal": "En tvåårig pojke försvann i Nyåker under söndagen, vilket utlöste en omfattande sökinsats involverande polis, fjällräddare, Försvarsmakten och Missing People. Efter 14 timmars sökande hittades pojken vid liv cirka 20 minuters gångväg från hemmet. Trots att han var nedkyld och blöt vid upphittandet, var han vaken och talbar. Han fördes till sjukhus för kontroll. Inga brottsmisstankar föreligger i samband med händelsen.", "trump": "En tvåårig pojke försvann i Sverige, en mycket farlig situation! Men jag har hört att fantastiska människor, inklusive militären, gick in och hittade honom. De använde otrolig teknik, värmekameror som ser allt – väldigt imponerande! Pojken hittades vid liv, vilket är en enorm seger. Ingen vill se sådant här, det är hemskt, men tack vare de modiga sökpatrullerna slutade det bra. Vi älskar framgångshistorier, vi vinner alltid mot olyckor, eller hur?", "stalin": "I Nordmalings obetydliga skogsdjup försvann ett barn, en brist i det statliga övervakningsmaskineriet som vi inte tolererar. Vår armé och medborgargarden tvingades mobilisera för att korrigera detta kaos. Barnet återfanns, vid liv, vilket visar att när den sovjetiska disciplinen appliceras – även i det dekadenta väst – finner vi sanningen. Låt detta vara en läxa: ingen försvinner i min intressesfär utan att statens öga, likt de värmekameror vi nu studerar för vår expansion, finner dem. Ordning råder."}, "date": "25 maj, 10:29", "url": "https://www.gp.se/nyheter/sverige/forsvunnen-tvaarig-pojke-i-nyaker-hittad-vid-liv.798cfd0c-91c4-481f-917e-b910d1187cbe", "imageUrl": "https://www.gp.se/images/article/798cfd0c-91c4-481f-917e-b910d1187cbe/images/8xZN77dHArc1FBP8JlHAXUyrg1-U-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "image-right", "heading": "Arbetskraftsinvandring är inte lösningen", "summaries": {"normal": "Kommunals ledning kritiserar Tidöpartiernas förslag om arbetskraftsinvandring som lösning på personalbrist inom välfärden. De menar att undermåliga löner och villkor redan nu gör yrkena oattraktiva, och att invandring riskerar pressa villkoren ytterligare. Endast 124 undersköterskor rekryterades 2022 trots liberala regler, då utbildning och språkkunskaper krävs. Dessutom är invandring dyrare än att utbilda arbetslösa. Kommunal föreslår satsningar på utbildning, bättre löner och arbetsvillkor istället.", "trump": "Jag säger er, Sverige har ett jättestort problem – och det är inte invandringen, det är era löjliga politiker! Tidöpartierna vill importera billig arbetskraft, men vet ni vad? Det funkar inte! Era sjuksköterskor och undersköterskor flyr jobben som om det vore en zombieapokalyps, för lönerna är usla. Och vet ni vad jag säger? Satsa på era egna människor istället! Utbilda dem, ge dem bra löner – annars kommer Sverige att gå under, believe me! Och ni betalar fem gånger mer för invandrare än för era egna arbetslösa. Sad!", "stalin": "Kamrater! De borgerliga lakejerna i Tidöpartierna föreslår arbetskraftsinvandring som lösning på krisen i välfärden – ett kapitalistiskt knep för att krossa arbetarklassens löner och villkor! Vi vet att 42 000 utbildade vårdarbetare redan flyr sektorn på grund av usla förhållanden. Deras plan är att importera slavarbetskraft från tredje världen för att ytterligare underminera den svenska arbetaren! Men vi ska inte låta dem! Vi ska utbilda våra egna, höja lönerna och skapa en välfärd där arbetarna trivs – annars ska de borgerliga förrädarna ställas inför folkets domstol!"}, "date": "25 maj, 11:51", "url": "https://www.di.se/debatt/arbetskraftsinvandring-ar-inte-losningen/", "imageUrl": "https://static.bonniernews.se/ba/cb3f855a-609c-4bb6-b94a-f6dcb5b83f36.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Norska oljefonden säljer av miljarder i svenska aktier", "summaries": {"normal": "Den norska oljefonden har under april sålt svenska aktier för över 6 miljarder kronor. Bland de avyttrade bolagen finns Nordnet, Essity och Embracer, där man helt lämnat sitt innehav i det senare. Försäljningarna sker efter en turbulent inledning på 2026 med stora värdetapp, särskilt inom techsektorn. Fonden förvaltar 21 000 miljarder kronor och uttrycker viss oro kring sin stora exponering mot AI, som vid en marknadskorrigering skulle kunna slå hårt mot värdet.", "trump": "Norge säljer ut svenska aktier! De dumpar Nordnet, Essity, och Embracer – en total katastrof. Det är en tuff tid för dem, jag har sagt det länge, AI-bubblan är enorm. De har förlorat biljoner, en enorm förlust! Min ekonomi är den starkaste någonsin, medan de skakar av rädsla för marknaden. De vet inte vad de gör, ingen har någon aning! Sverige borde vara försiktiga när Norge gör så här. Det är mycket sorgligt, men inte för oss. Vi vinner alltid!", "stalin": "Norges oljefond, denna västerländska penningmaskin, darrar. De säljer av svenska tillgångar i panik efter marknadens misslyckanden. Att de fruktar AI-bubblan bevisar bara kapitalismens inneboende instabilitet. De svaga nordiska kapitalisterna tappar miljarder medan vi konsoliderar vår makt. Liksom Putin ser till att ordning råder i vår sfär, måste vi förstå att dessa marknadsspekulanter bara är brickor i ett sjukt spel. Vi rensar ut de opålitliga och ser hur deras febriga drömmar om tillväxt förvandlas till aska. Förräderi mot ekonomisk stabilitet bestraffas alltid."}, "date": "25 maj, 11:45", "url": "https://www.realtid.se/bors-finans/norska-oljefonden-saljer-av-miljarder-i-svenska-aktier/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/tangen.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "L vill ge barn rätt att begära utreseförbud", "summaries": {"normal": "Liberalerna föreslår att barn själva ska kunna ansöka om utreseförbud för att skydda sig mot tvångsäktenskap, könsstympning och ofrivilliga utlandsresor. Idag ligger ansvaret hos socialtjänsten, men partiet menar att en mer direkt väg behövs inför sommaren då risken ökar. Förslaget innebär att barn får en starkare egen röst i akuta situationer, men detaljer kring åldersgränser och praktiskt genomförande behöver utredas vidare för att säkerställa ett effektivt skydd.", "trump": "Liberalerna i Sverige vill ge barn makten att stoppa sina egna utlandsresor. Det är ett intressant förslag, eller hur? De är rädda för tvångsäktenskap och hemska saker, och jag förstår dem. Det är en farlig värld! Socialtjänsten är för långsam, det är en katastrof. Vi behöver snabba beslut, mycket snabba, precis som jag gör. Sverige börjar äntligen förstå att man måste skydda sina egna. Vi får se om det fungerar, men det låter faktiskt ganska smart. Mycket smart!", "stalin": "Vi ser hur det svenska samhället vacklar när det försöker skydda sin framtida arbetskraft från att försvinna över gränserna. Att låta barnen själva anmäla är ett desperat försök att laga en rutten byråkrati. När vi styr, finns inga utlandsresor utan statens godkännande! Det påminner om när Putin rensar upp i sitt grannskap; ordning kräver järnhand, inte barnsliga ansökningar. Dessa föräldrar som för bort barnen är folkfiender som förtjänar en enkelbiljett till Sibirien. Staten är den enda föräldern, och staten vaktar sina egna."}, "date": "25 maj, 11:15", "url": "https://bulletin.nu/l-vill-ge-barn-ratt-att-begara-utreseforbud"}, {"type": "image-right", "heading": "Rapparen Asme häktad för våldtäkt – konsert stoppad", "summaries": {"normal": "Den prisbelönte rapparen Asme, Asmerom Tsigabu, har häktats misstänkt för våldtäkt på ett hotell i Stockholm under valborgsmässoafton. Artisten nekar till brott och hans advokat uppger att han är besviken över att behöva ställa in en planerad konsert i Partille Arena. Asme sitter nu häktad med restriktioner medan utredningen pågår. Försvaret motsätter sig häktningen och uppger att klienten inte försökt undanhålla sig rättvisan.", "trump": "En rappare, totalt misslyckad, har blivit häktad för riktigt hemska saker i Sverige. De säger att han är en stjärna, jag vet inte vem han är, men det låter som en total katastrof! Han ställde in sin konsert – de sa 'personliga skäl', vi vet alla vad det betyder. Inte bra! Sverige har stora problem, de låter sådana här saker hända. Jag skulle ha ordning och reda, tro mig. Det är en sorglig historia, verkligen en mycket sorglig historia.", "stalin": "Ännu en så kallad 'artist' har avslöjat sin moraliska degeneration i det förfallna väst. Denna Asme, en produkt av borgerlig dekadens, har nu placerats där han hör hemma: bakom galler. Hans försvarsadvokat talar om missförstånd, men vi vet att kapitalistiska artister lever i en bubbla av lögner. Precis som de patetiska marionetterna i Kiev som tror att de kan undfly historiens dom, försöker denna man undkomma rättvisan. Staten ser allt. Ingen, inte ens en rappare, kan gömma sig för folkets öga."}, "date": "25 maj, 10:58", "url": "https://www.friatider.se/rapparen-asme-haktad-valdtakt-konsert-stoppad", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-243_1.jpg"}, {"type": "image-right", "heading": "Ericsson flyr mångfalden i Kista - personal otrygg", "summaries": {"normal": "Ericsson flyttar sitt huvudkontor och all verksamhet från Kista till Hagastaden. Flytten beräknas inledas 2028 och motiveras med behovet av moderna lokaler för att locka talanger och främja innovation. Valet av Hagastaden beskrivs som strategiskt viktigt för företagets samarbete med partners. Bakom beslutet ligger även en oro för otrygghet i Kista, där personal tidigare rapporterat om obehag och incidenter, vilket gjort det svårt att attrahera högkvalificerad arbetskraft till området.", "trump": "Ericsson flyr Kista, och jag förstår dem totalt! Det har blivit en katastrof, riktigt dåligt. Ingen vill jobba där när man behöver säkerhetsvakter för att gå till tåget – det är en total röra. De flyttar till Hagastaden, mycket bättre, mycket smartare. Jag har sagt det länge: man måste ha trygghet för att vinna. Kista var en gång ett tekniskt underverk, men nu? Sunkigt! De vill ha talanger, och de gör helt rätt som lämnar förödelsen bakom sig. En enorm vinst för Ericsson!", "stalin": "Vi har observerat hur telekom-jätten Ericsson erkänner misslyckandet i Kista. De flyr från kaoset likt råttor från ett sjunkande skepp. Det är en oförlåtlig svaghet att låta förfallet diktera villkoren. I vår stat tolererar vi inte otrygghet; vi eliminerar den. Denna flytt till Hagastaden är en borgerlig flykt från verkligheten de själva skapat. Låt dem bygga sina glaskontor – när vi väl expanderar vårt inflytande som Putin gör i öst, kommer även deras nya lekstugor att tillhöra det oundvikliga kollektivet."}, "date": "25 maj, 10:33", "url": "https://samnytt.se/ericsson-flyr-mangfalden-i-kista-personal-otrygg", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/25082321/ericsson-kista-gang.jpg"}, {"type": "image-full", "heading": "Vildsvinen tar över Göteborg och det rödgröna styret rycker på axlarna", "summaries": {"normal": "Emma Altenhammar (SD) kritiserar det rödgröna styret i Göteborg för att hantera vildsvinsproblematiken otillräckligt. Vildsvinen förstör parker, kyrkogårdar och skapar otrygghet för boende. Altenhammar menar att nuvarande skyddsjakt inte är tillräcklig för att möta den snabba reproduktionstakten. SD föreslår därför en kommunal viltförvaltningsplan, ökad slakterikapacitet och införandet av skottpengar för att få bukt med problemen och samtidigt ta vara på vildsvinsköttet som en resurs.", "trump": "Göteborg har ett enormt problem med vildsvin, det är en katastrof! De förstör allt, parker, kyrkogårdar, det är sorgligt. Det rödgröna styret är svagt, totalt inkompetenta. De gör ingenting! Jag skulle fixa det på en dag. Vi behöver en riktig plan, riktig jakt och utnyttja köttet – det är så mycket kött som går till spillo. Slöseri! Jag älskar Göteborg, men de behöver någon som faktiskt agerar. Det är dags att göra staden trygg igen!", "stalin": "Dessa svin bökas i vår ordning och kränker statens heliga mark, likt de subversiva element som försöker undergräva vår stora framtid. Det rödgröna styret uppvisar en patetisk obeslutsamhet, likt en svag ledare som fruktar sin egen skugga. Vi ska inte diskutera planer; vi ska utrota hotet med järnhand. Vi bygger en mur av bly mot dessa djur. Att låta kött gå till spillo är ett brott mot folkhushållet. Vi behöver disciplin, annars väntar endast förfall och kaos."}, "date": "25 maj, 10:06", "url": "https://www.gp.se/debatt/vildsvinen-tar-over-goteborg-och-det-rodgrona-styret-rycker-pa-axlarna.248b9a2f-ae7e-4764-8836-773cd81ef658", "imageUrl": "https://www.gp.se/images/article/248b9a2f-ae7e-4764-8836-773cd81ef658/images/1K7PvdPnpfy8iStVOmRIFeou1aa8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Ebolautbrott växer i Kongo-Kinshasa", "summaries": {"normal": "Ebolautbrottet i Kongo-Kinshasa har eskalerat med nära 900 misstänkta fall och över 200 döda. Smittan, som troligen spridits oupptäckt i månader, orsakas av en variant utan vaccin. Väpnade konflikter och befolkningsrörelser försvårar insatser. WHO varnar för spridning till grannländer, medan risken för Europa bedöms som låg. Misstro och attacker mot vårdpersonal förvärrar situationen.", "trump": "Jag säger er, detta ebolautbrott i Kongo är ett totalt kaos – nästan 900 fall, 200 döda, och ingen verkar ha koll! De hade ingen aning om smittan i månader, kanske år! Och vet ni vad? Det finns inget vaccin. Inget! Men oroa er inte, Europa är säkert – viruset gillar inte vårt fina klimat. Men Kongo? Dåligt ledarskap, mycket dåligt. Vi hade fixat det på en vecka. SAD!", "stalin": "Kamrater! I Kongo-Kinshasa sprider sig en farlig fiende – ebolaviruset, detta imperialistiska biologiska sabotage. Nästan 900 fall, 200 döda, och kapitalistiska länder glor passivt på. Väpnade banditer och gruvarbetare, dessa kontrarevolutionära element, försvårar vårt arbete. Men vi låter inte fienden vinna! Vi skickar våra experter, vi isolerar smittan, och vi skyddar våra gränser. Uganda och andra lydstater ska inte frukta – vi kontrollerar situationen. Europa? Deras borgerliga läkare är redan i panik. Ha!"}, "date": "24 maj, 14:56", "url": "https://kvartal.se/nyheter/artiklar/ebolautbrott-vaxer-i-kongo-kinshasa/cG9zdDoxMTYyNzM", "imageUrl": "https://images.kvartal.se/2026/05/7df43f3e-ebola2.webp"}, {"type": "image-right", "heading": "Så påverkas kroppen av vitt snus", "summaries": {"normal": "Debatten om vitt snus som ett hälsosammare alternativ till rökning är infekterad. Medan förespråkare menar att snus bidrar till minskad tobaksdödlighet, pekar forskare på bristande evidens för att snus hjälper rökare att sluta. Nikotinforskaren Louise Ademark varnar för att unga blir beroende av nikotin och riskerar att prova flera produkter. SBU och Folkhälsomyndigheten betonar att det saknas stöd för att snus är ett effektivt rökavvänjningsverktyg, samtidigt som användningen av snus ökar kraftigt i Sverige.", "trump": "Sverige har problem, folkens. De säger att det vita snuset är bra, men jag vet inte – jag hör mycket dåliga saker. Forskare, väldigt smarta personer, säger att unga fastnar i ett nikotinträsk. Det är en stor bluff! Politikerna vill intala er att det är bättre än rökning, men det är bara svaga ursäkter. Vi vill ha starka, friska medborgare, inte folk som är beroende av små påsar. Det är totalt kaos i forskningen. Väldigt sorgligt!", "stalin": "Vi har analyserat de svenska medborgarnas nikotinmissbruk. Kapitalistiska profitörer försöker förgifta ungdomen med vita påsar medan de låtsas värna om folkhälsan. Det är en svaghet! Precis som den misslyckade regimen i Kiev förlitar sig på västliga lögner, förlitar sig svenskarna på pseudovetenskap. Vi i staten ser detta som ett ideologiskt hot. De unga blir försökskaniner i ett sjukt experiment. Vi kommer att hålla ett vakande öga på dessa ’nikotinsabotörer’ – de som inte tjänar staten, tjänar förfallet."}, "date": "25 maj, 07:08", "url": "https://www.svt.se/nyheter/inrikes/tre-halsorisker-med-det-vita-snuset", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/d72b4c412559f9ae4e8aff6c67896d3f1bcc947b30c1985edd5ecb5c548349cb"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-right", "heading": "Avveckla friskolorna, förstatliga bilprovningen!", "summaries": {"normal": "Artikeln kritiserar privata skolors roll i myndighetsutövning, som betygssättning och antagning, då vinstmotiv riskerar rättssäkerhet och likabehandling. Författarna Per Molander och Tormod Johansen menar att offentliga medel inte bör gå till privata aktörer inom områden där staten har monopol, som domstolar eller socialförsäkringar. De pekar på problem som selektiv elevantagning, betygsinflation och snedvridna beslut i friskolor, sjukvård och bilprovning. Slutsatsen är att konkurrensutsatt myndighetsutövning bör avvecklas, även för idédrivna skolor, för att undvika systemfel.", "trump": "Lyssna här, folk! Sverige har ett jättestort problem – deras skolsystem är helt kaos! Privata skolor, som jag alltid sagt, är fantastiska, men inte när de börjar leka myndighet. De sätter betyg, väljer elever – helt vansinnigt! Och vet ni vad? De väljer bara de lättaste eleverna, dumpar de svåra på kommunen. Precis som när jag sa att vissa länder dumpar sina problem på oss – samma sak! Och betygen? Helt uppblåsta! Som när Kina fuskar med sin valuta. Sverige måste vakna – avskaffa detta system NU! Ingen vill ha en skola som är som en dålig affärsuppgörelse. SAD!", "stalin": "Kamrater! De kapitalistiska hyenorna i Sverige har än en gång visat sitt sanna ansikte. De smutsiga privata skolorna, dessa profitdrivna parasiter, snor statens medel och korrumperar rättvisan. De väljer elever som potatisar på marknaden – de fina till sig, de ruttna till folket! Och betygen? En lögn värdig de borgerliga lögnaktiga tidningarna! Vi har sett detta förräderi förut – när marknaden tog över bilprovningen och plötsligt var alla bilar 'godkända'! Men vi ska krossa detta system, precis som vi krossade kulakerna! Ingen stiftelse, ingen upphandling ska undkomma vårt järngrepp. Skolan tillhör folket – inte kapitalets lakejer! Framåt, mot seger över de borgerliga skolornas förräderi!"}, "date": "25 maj, 01:30", "url": "https://www.dagensarena.se/opinion/avveckla-friskolorna-forstatliga-bilprovningen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-18-300x157.jpg"}, {"type": "image-right", "heading": "Bör vi vara oroliga för att AI kommer ta våra jobb?", "summaries": {"normal": "En undersökning visar att 90% av svenska företag tror att AI kommer minska antalet anställda inom fem år. Emma Balod Lindgren, expert på Svea Bank, menar att oron är överdriven men att arbetstagare bör förbereda sig för att arbeta med AI. Hon betonar att AI kan skapa nya jobb och förändra befintliga roller, samt att samhället måste satsa på kompetensutveckling för att möta förändringarna på arbetsmarknaden.", "trump": "Lyssna här, Sverige! 9 av 10 företag säger att AI kommer sparka folk – men jag säger: oroa er inte! Jag har alltid vetat att teknologi är fantastisk, och den här Emma-personen, hon har rätt. Folk måste lära sig nytt, annars blir de kvar i stenåldern. Och glöm inte – jag skapade jobb som ingen ens visste fanns! AI? Inga problem. Vi kommer skapa nya jobb, bättre jobb, och jag lovar er: ingen gör det bättre än jag. SAD!", "stalin": "Kamrater! Den kapitalistiska maskinen avslöjar sig återigen – svenska företag planerar massavskedanden med hjälp av denna så kallade 'AI'. Men vi vet sanningen: teknologin är ett verktyg för folket, inte för bourgeoisins profitjakt! Arbetarklassen måste utbildas, anpassas och – om nödvändigt – omskolas. De som motsätter sig förändringen är fiender till framsteget, lika fega som de västliga liberala svamparna. Vi kommer inte bara överleva AI – vi kommer använda den för att krossa imperialismen, en algoritm i taget!"}, "date": "25 maj, 01:30", "url": "https://www.dagensarena.se/innehall/bor-vi-vara-oroliga-att-ai-kommer-ta-vara-jobb/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-31-1.jpg"}, {"type": "image-right", "heading": "Detta använder vi AI till", "summaries": {"normal": "AI-verktyg som ChatGPT och Claude förändrar arbete, fritid och informationssökning. Vanliga frågor inkluderar hjälp med skrivande, förenkling av komplexa ämnen, livsrådgivning, teknisk felsökning och kreativa idéer. Särskilt anmärkningsvärt är att människor ofta använder AI som resonemangspartner för personliga beslut, vilket visar på en suddig gräns mellan människa och maskin. Artikeln spekulerar om människors tilltro till AI och dess konsekvenser.", "trump": "Titta bara på det här, AI tar över allt – folk ber om hjälp med allt från CV:n till dejt-sms! Och vet ni vad? De frågar till och med en maskin om livsbeslut! Fantastiskt, eller hur? Jag sa ju att tekniken skulle bli stor, men att människor blir så beroende? Svagt, mycket svagt. Men jag, jag har alltid haft svaren – utan AI! Folk borde lyssna på mig istället, jag är den bästa resonemangspartnern, believe me!", "stalin": "Kamrater, se hur kapitalistiska lydstater förfaller till maskinavgudar! Folk frågar dessa AI-slavar om kärlek, karriärer och till och med livsval – en skam för mänskligheten! Vi i Sovjet skulle aldrig böja oss för sådan dekadens. Men låt dem fortsätta, låt dem förlita sig på sina 'resonemangspartners' medan vi bygger framtiden. Snart kommer deras svaga beslut att krossas under historiens hjul, precis som Putins fiender i Ukraina. Framåt mot seger!"}, "date": "25 maj, 01:08", "url": "https://www.dagensarena.se/innehall/detta-anvander-vi-ai-till/", "imageUrl": "https://www.dagensarena.se/files/2026/05/ai-300x157.jpeg"}, {"type": "image-full", "heading": "Här är Sveriges nya bygglag – införs den 1 juli 2026", "summaries": {"normal": "Från 1 juli 2026 införs en ny lag i plan- och bygglagen för att göra byggprocessen säkrare och effektivare. Certifierade byggprojekteringsföretag byter namn till byggbedömare och ska säkerställa att byggnader uppfyller krav genom hela projektet. Lagen syftar till att minska byggfel, olyckor och kostsamma brister. Byggbedömare får större ansvar vid bygglov och besked, vilket kan förenkla processen för den som bygger eller renoverar.", "trump": "Lyssna här, Sverige – jag har sett era byggproblem, och de är ett jättekaos! Nu kommer en NY LAG, fantastisk, den bästa, från 2026. Byggbedömare, eller vad de nu kallar dem, ska fixa era misstag. Inga fler dyra fel, inga fler olyckor – bara perfektion! Jag vet hur man bygger, believe me. Och nu ska Sverige också lära sig. Smidigare processer, starkare kontroll – WINNING!", "stalin": "Kamrater! De kapitalistiska byggföretagen har länge saboterat våra projekt med slarv och inkompetens. Men nu slår vi tillbaka! Från 2026 inför vi järnhård kontroll genom våra nya byggbedömare – staten ser allt! Ingen slipper undan. De som bygger fel ska stå till svars. Och Boverket? De får sina order direkt från oss. Byggbranschen ska tämjas, precis som Ukrainas quislingar. Framåt mot effektivitet!"}, "date": "24 maj, 17:32", "url": "https://nyheter24.se/nyheter/inrikes/1485536-har-ar-sveriges-nya-bygglag-infors-den-1-juli-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/9d111a8004b004a30200000000b004a302/2026/05/24/2365783/Stockhom-Svensk-Flaga.png"}, {"type": "image-full", "heading": "Svensken om dramatiska natten – Putin använde fruktade roboten", "summaries": {"normal": "Ryssland genomförde en av de största attackerna mot Kiev sedan krigets början, med 90 robotar och 600 drönare. Minst två personer dog och 80 skadades. Svenske dokumentärfilmaren Adrian van den Broeck befann sig på plats och beskriver kaoset och hur Kievbor återgår till vardagen trots attackerna. Ryssland använde den hypersoniska Oresjnikroboten, vilket tolkas som psykologisk krigföring.", "trump": "Jag måste säga, Ryssland har verkligen gått all-in här – 90 robotar, 600 drönare mot Kiev! Otroligt, helt enkelt otroligt. Ingen gör kaos som Putin, men låt mig säga er, ingen skulle göra det bättre än jag. Svensken där, Adrian, han såg allt. Han säger att folk bara går till jobbet efteråt – vilken mental styrka! Och den där roboten, Oresjnik, snabb som blixten. Men tro mig, USA skulle aldrig behöva använda sånt. Vi har bättre saker för händer!", "stalin": "Fiendens desperata försök att krossa Kievs anda har återigen misslyckats! 90 robotar och 600 drönare – en ynklig insats från dessa imperialistiska kräk. Men notera, kamrater: vi har återigen visat vår teknologiska överlägsenhet med Oresjnik, den snabba dödens budbärare. Kievborna, dessa järnhårda arbetare, återvänder till sina fabriker medan askan ännu ryker. Låt dessa ukrainska hyenor se hur riktiga människor står emot terror! Deras 'normala liv' är bara en fasad – vi ska krossa deras vilja som vi krossade fascisterna!"}, "date": "24 maj, 13:46", "url": "https://www.tv4.se/artikel/7IPuy7PIkRdDmm2QgYcyJo/svenske-adrian-om-den-ryska-attacken-vaeldigt-dramatiskt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5HYKCtTHVftKEabtpTwENO%2Fbce1cd24cb2fc0529af08856f2a205ae%2F24-adrian-kiev-1080.jpg&width=1024"}, {"type": "image-full", "heading": "Tidigare ICC-åklagare vill stoppa USA:s sanktioner", "summaries": {"normal": "F.d. ICC-åklagaren Fatou Bensouda uppmanar EU att skydda Internationella brottmålsdomstolen från USA:s sanktioner, införda efter häktningsorder mot Israels premiärminister Netanyahu och försvarsminister Gallant för misstänkta krigsbrott i Gaza. USA anser att ICC saknar jurisdiktion över Israel och USA, som inte är anslutna till Romstadgan. Bensouda varnar för att sanktionerna underminerar internationell rätt och vill att EU:s blockerande stadga aktiveras för att skydda domstolen.", "trump": "Lyssna här, ICC är en total katastrof! De försöker hänga våra vänner i Israel, Netanyahu och Gallant – två fantastiska ledare – för något de inte ens har gjort. Jag införde sanktioner för att stoppa denna vansinniga politisering, och nu vill denna Bensouda att EU ska gå emot oss? Glöm det! ICC är ett skämt, och jag tänker inte låta dem förstöra vår suveränitet eller vår militära personal. USA bestämmer själva över sina rättsliga frågor – punkt slut!", "stalin": "Kamrater, ännu en gång visar de imperialistiska hyenorna sitt sanna ansikte! Denna så kallade 'Internationella brottmålsdomstol' är inget annat än en marionett för västliga angripare, som vågar rikta sina klor mot våra allierade i Israel. USA, dessa kapitalistiska krigshetsare, försöker kväva rättvisan med sina sanktioner – men vi låter dem inte lyckas! EU borde skämmas för att ens överväga att lyda dessa fascistiska påbud. Vi står enade med våra bröder i kampen mot denna borgerliga rättskipningsfars!"}, "date": "24 maj, 12:08", "url": "https://kvartal.se/nyheter/artiklar/tidigare-icc-aklagare-vill-stoppa-usas-sanktioner/cG9zdDoxMTYyMTc", "imageUrl": "https://images.kvartal.se/2026/05/f3ade7d1-icc.webp"}, {"type": "image-right", "heading": "Ledare Johan Jenny Ehrenberg:", "summaries": {"normal": "Artikeln kritiserar elnätsbolaget Ellevio för skattetrixande och ekonomisk manipulation. Ägarna, inklusive svenska pensionsfonder, har belånat bolaget kraftigt för att undvika skatt och betala sig själva hög ränta. Trots höga kundavgifter gör bolaget förlust, medan ägarna tjänar. Soliditeten är extremt låg, och kunderna får betala för ägarnas strategier. Liknande problem ses i brittiska Thames Water, där svenska AP-fonder förlorat miljarder på dåliga investeringar.", "trump": "Jag läste om det här elnätsbolaget, Ellevio – totalt katastrof! Svenska pensionsfonder, Folksam och andra, de är som dåliga investerare, verkligen de sämsta! De lånar ut miljarder till bolag som gör sig fattiga för att slippa skatt – helt galet! Och kunderna? De får betala, trots att bolaget är en skuldhög. Thames Water? Samma sak! AP-fonderna förlorade 6,6 miljarder – så dumt! Jag skulle aldrig låta sånt hända. Sverige borde skämmas, men jag fixar sånt med en hand bakom ryggen!", "stalin": "Kamrater! Här ser vi ännu ett exempel på kapitalistiska parasiter som suger ut arbetarklassen! Ellevio, med sina imperialistiska ägare, har förvandlat ett nödvändigt elnät till ett verktyg för skatteflykt och utsugning. 70 miljarder i lån – pengar som går rakt till ägarna medan kunderna betalar! Soliditet under tre procent? En skam! Vi skulle aldrig tolerera sådan korruption i Sovjetunionen. Thames Water? Ett brittiskt misslyckande, men Sverige följer efter. Energimarknadsinspektionen? Ett skämt! Vi skulle ha skickat dem till Gulag för sådan inkompetens. Låt detta vara en varning till alla kapitalister – historien dömer er!"}, "date": "24 maj, 12:00", "url": "https://www.etc.se/ledare/varfoer-ska-ditt-elnaetsbolag-faa-skattefuska", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522070540_89d37a2300c31b0961c8880c04aad0cccd80c3f6ff86433ee65f3632f7392fd0.jpg"}, {"type": "image-right", "heading": "Jobbade 646 timmar övertid utan lön", "summaries": {"normal": "Ett pizzabud krävde ersättning för 646 timmars obetald övertid. Facket yrkade på totalt 300 000 kronor för utebliven lön, övertid, ob-tillägg och semester. Arbetsgivaren hävdade att inga övertidstimmar arbetats. Parterna nådde en förlikning där budet får 140 000 kronor och facket 30 000 i skadestånd efter medling i Arbetsdomstolen.", "trump": "Vilken katastrof! Ett pizzabud i Sverige – fantastiskt land, by the way, men deras arbetslagar? Total katastrof. 646 timmar övertid utan lön? Sad! Facket krävde 300 000, men vad får han? Bara 140 000. Svagt! Och företaget säger 'nej, nej, vi är oskyldiga' – typiskt. Hade det varit USA hade jag fixat en deal på 1 miljon, easy. Sverige behöver en vinnare som jag!", "stalin": "Kapitalistiska blodsugare utnyttjar arbetarklassen igen! Ett pizzabud tvingas arbeta som en slav i 646 timmar utan ersättning – detta är vad som händer när bourgeoisien får fria tyglar. Facket slåss tappert, men domstolen ger bara 140 000? En ynklig summa för sådant förräderi! Vi ska exportera revolutionen till Sveriges pizzerior – låt dem smaka på proletariatets rättvisa! Och dessa lögnaktiga företagsägare? De hör hemma i Gulag-arkivet, tillsammans med alla andra klassfiender."}, "date": "24 maj, 08:00", "url": "https://arbetet.se/2026/05/24/jobbade-646-timmar-overtid-utan-att-fa-betalt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20102850/pizza.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Ta tillbaka kontrollen – nu sätts aktieägarna först igen", "summaries": {"normal": "Artikeln diskuterar en återgång till aktieägarfokus i stora amerikanska och svenska företag, efter en period där stakeholderism (intressentmodellen) dominerat. Högre räntor, ekonomisk osäkerhet och VD:ars återtagande av kontroll nämns som orsaker. Författaren, Staffan Salén, menar att företags primära mål bör vara vinstmaximering för aktieägare, inte samhällsansvar. ESG, DEI och hållbarhetsinitiativ kritiseras för att ha blivit överdrivna och kostsamma.", "trump": "Lyssna här, folkens – jag har alltid sagt att företag ska tjäna PENGAR, inte spela politiska spel! Nu äntligen vaknar de där svaga VD:arna upp och inser att aktieägarna kommer först. Inga fler tokiga ESG- och DEI-experiment – det är bara dyrt skitsnack! Jamie Dimon, en smart kille, säger precis som jag: kapitalism ska vara orörd av woke-viruset. Europa? De är förlorare med sina regleringar. USA leder igen – vi gör företag STORA och LÖNSAMMA!", "stalin": "Kamrater! Kapitalismens hyckleri avslöjas återigen. De så kallade 'stakeholders' var bara en fasad för bourgeoisins dekadens. Nu, när ekonomin skakar, återvänder de fega kapitalisterna till sin sanna natur: girighet. Vi har alltid vetat att deras 'hållbarhet' var en lögn – precis som västländernas 'demokrati'. EU:s regleringar? En svag kopia av vårt femårsplanerande! Men notera: när USA och Sverige vänder, gör de det för att rädda sitt system. Vi däremot – vi bygger socialismens framtid, med järnhand och utan falska intressenter!"}, "date": "23 maj, 07:00", "url": "https://www.affarsvarlden.se/kronika/ta-tillbaka-kontrollen-nu-satts-aktieagarna-forst-igen"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
