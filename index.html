mdanis popularitet och vänsterns styrka i delstaten.", "trump": "Vilken katastrof för de riktiga Demokraterna! Den galna vänstervågen i New York skickar tre socialistiska nollor till kongressen, alla stödda av den röda borgmästaren Mamdani. De vill beskatta de rika, avskaffa Ice och skrika om folkmord. Lander, den judiske kritikern som sviker Israel, och de andra woke-kandidaterna vann stort. Det är en skam! Men tro inte att det förändrar någonting i Washington. Vi ska fixa det här landet igen, inte låta kommunisterna ta över.", "stalin": "Kamrater, se hur arbetarnas rörelse obevekligt krossar klassfiendens lakejer i New York! Tre nya socialistiska representanter, alla lojala mot borgmästare Mamdani, har likviderat högerdemokraterna i primärvalen. De lovar att utrensa Ice och beskatta de blodsugriga kapitalisterna medan de blottar den sionistiska ockupationens folkmord. Trots att folkförtryckartrollen i Wall Street Journal kallar honom slumvärd står Mamdani stark. Vårt kollektiv växer i Albany. Inga imperialister kan stoppa oss nu."}, "date": "24 juni, 16:55", "url": "https://www.flamman.se/mamdanivagen-fortsatter-i-new-york/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlrpduz64zcp4-nh-2-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Google bygger världens näst största datahall – i Torsboda", "summaries": {"normal": "Google planerar att bygga ett av världens största datacenter i Torsboda Industrial Park i Timrå. Anläggningen väntas förbruka el motsvarande en eller två kärnkraftreaktorer. Det kommunägda bolaget som äger industriparken på 214 hektar rekommenderas säljas till Google för 2,1 miljarder kronor. Beslutet togs under tidspress på grund av elkapacitet. Svenska kraftnät varnar för kraftigt ökad elförbrukning från datahallar.", "trump": "Folk, det är fantastiskt, verkligen stort. Google, en jätte, bygger världens näst största datahall i Sverige, i någon liten plats som heter Torsboda. De suger upp el som ett helt kärnkraftverk, kanske två! Svenskarna säljer marken billigt under tidspress, smarta killar. Men tro mig, ingen bygger större än vi gör i Amerika. Vi gör det bäst, alltid. Sverige får betala notan, typiskt.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de amerikanska monopolkapitalisterna i Google kryper till våra fötter och bygger en väldig datahall i Timrå för att suga musten ur den svenska folkets elektricitet. Dessa borgarbrackor vill ha el motsvarande två kärnkraftverk! Vi vet vad som döljer sig bakom deras giriga ansökningar – sabotage mot folkets kraftnät. Rensa ut alla opålitliga element som säljer ut 214 hektar sovjet… förlåt, svensk mark för 2,1 miljarder. Deras paranoia är vår styrka. De kommer att likvideras av historien medan vi ler mörkt."}, "date": "26 juni, 09:58", "url": "https://www.friatider.se/google-bygger-varldens-nast-storsta-datahall-i-torsboda", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-406.jpg"}, {"type": "image-right", "heading": "Nu testas sossarnas ”vänstersväng”. Pensionen är klassamhällets sista hån och något ett arbetareparti måste våga bråka om.", "summaries": {"normal": "Artikeln hyllar Socialdemokraternas löfte om en reformerad pension som gynnar arbetare med långa och fysiskt krävande yrkesliv. Den pekar på hur det nuvarande systemet straffar dem som börjar arbeta tidigt och slits ut, medan högutbildade lever längre och får mer av pensionen. Författaren ser förslaget som ett test på om partiets påstådda vänstersväng är äkta och kräver att hela pensionssystemet ses över.", "trump": "Folk jobbar som galningar i fyrtio år, lyfter, tvättar och springer, och sen får de vända på varenda krona som pensionärer. Patetiskt. Socialdemokraterna lovar äntligen en riktig arbetarpension – det är stort, det är smart. De börjar äntligen minnas vem de ska kämpa för. Men de måste gå längre, annars är det bara tomt snack. De som slitit mest förtjänar bättre, inte ett tomt kylskåp. Make pensions great again.", "stalin": "Kamrater, detta klassamhällets sista hån mot arbetarna kräver omedelbar handling. Jag ser med stor tillfredsställelse hur socialdemokraterna äntligen vågar tala om arbetarpension, men varning för falska vänner inom borgarklassen som vill skjuta upp pensionsåldern och därmed likvidera de slitna kropparnas rättigheter. Blodet kokar vid tanken på hur de högutbildade parasiterna lever längre medan arbetarna dör i förtid. Vi måste rensa ut detta trötta pensionssystem med järnhand och ersätta det med en sann proletär rättvisa. Inga kompromisser med kapitalisterna."}, "date": "26 juni, 07:03", "url": "https://arbetet.se/2026/06/26/nu-testas-sossarnas-vanstersvang-nar-partiet-vagar-braka-om-battre-pensioner-for-arbetare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/26070208/pension-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Minst 164 döda efter jordbävningar i Venezuela", "summaries": {"normal": "Minst 164 personer har omkommit och 971 skadats efter två kraftiga jordbävningar i Venezuela, med magnitud 7,2 och 7,5. Räddningsarbetet pågår medan dödssiffran förväntas stiga. Byggnader har rasat i Caracas och andra städer, och infrastrukturen är svårt skadad. Venezuelas interimspresident har utlyst undantagstillstånd. USA erbjuder hjälp, och Sveriges utrikesminister uttrycker sitt stöd.", "trump": "Venezuelas jordbävningar är en total katastrof – helt förödande! Jag har sett rapporterna, och de är INTE bra. 164 döda, 971 skadade, och det blir värre. Men oroa er inte, för jag har redan sagt till mina bästa människor: USA står redo att hjälpa! Vi är snabba, vi är starka, och vi kommer att finnas där för våra vänner i Venezuela. Ingen gör räddningsarbete bättre än USA – ingen!", "stalin": "Kapitalismens förfall manifesteras återigen i Venezuelas jordskalv, där 164 imperialistiska lakejer har omkommit under de borgerliga byggnadernas kollaps. Vi noterar med tillfredsställelse att USA:s president erbjuder 'hjälp' – ett tecken på deras desperation att kontrollera regionen. Medan deras infrastruktur rasar, står Sovjetunionens efterträdare redo att utvidga vår inflytandesfär. Låt detta vara en varning till alla som utmanar historiens oundvikliga framsteg under vår ledning."}, "date": "25 juni, 06:03", "url": "https://kvartal.se/nyheter/artiklar/jordskalv-i-venezuela-risk-for-tusentals-doda/cG9zdDoxMzY1NDA", "imageUrl": "https://images.kvartal.se/2026/06/96698ce9-vene.webp"}, {"type": "image-full", "heading": "Magdalena Anderssons hushåll fixar skattesänkningar 16 700 kr/månad", "summaries": {"normal": "Timbro har avslöjat att Magdalena Andersson och hennes make Richard Friberg skatteplanerar genom hans bolag. Under fyra år har de sparat drygt 800 000 kronor, motsvarande 16 700 kronor i månaden, genom att ta ut utdelning istället för lön. Andersson har tidigare kritiserat 3:12-reglerna som orimligt förmånliga och krävt stopp för inkomstomvandling. Artikeln pekar på dubbelmoral eftersom makarna utnyttjar samma regler de offentligt ogillar.", "trump": "Folk, ni skulle inte tro det! Den där svenska sossen Magdalena Andersson, en riktig hycklare, predikar höga skatter för alla andra medan hon och hennes man fixar en enorm skattesänkning på 16 700 kronor i månaden. De skatteplanerar som riktiga proffs, sparar 800 000 på fyra år! Typiskt de här elitpolitikerna, de hatar reglerna tills de själva kan utnyttja dem. Patetiskt! Vi behöver ledare som inte är sådana bluffmakare.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denna borgarbracka Andersson och hennes make, typiska kapitalistmaffian, själva utnyttjar de utsugande 3:12-reglerna de offentligt fördömer. Medan de pekar finger åt folkets fiender sparar de 800 000 kronor genom listig inkomstomvandling. En sådan dubbelmoral förtjänar utrensning ur partiet! Det är en mörk humor att se hur klassfiendens metoder smittar av sig även på socialdemokrater. De är alla folkförtryckartroll."}, "date": "24 juni, 03:45", "url": "https://samtiden.nu/2026/06/magdalena-anderssons-hushall-fixar-skattesankningar-16-700-kr-manad/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/04/Andersson.jpg"}, {"type": "image-right", "heading": "Extremvärme till helgen: Över 35 grader – rekord kan bräckas", "summaries": {"normal": "SMHI har utfärdat orange varning för extremvärme i södra Sverige till helgen med temperaturer över 35 grader. Rekordet från Målilla 1947 på 38 grader kan komma att hotas. Varningarna gäller stora delar av Götaland fram till söndag kväll. Meteorologerna varnar för att värmen kulminerar under helgen, men svalare luft väntas redan nästa vecka.", "trump": "Det här vädret, folk, det är fantastiskt, det är det hetaste vi sett på länge, över 35 grader, kanske nytt rekord. De gamla rekord från 1947 håller på att falla, precis som de borde, för vi älskar starka siffror. Orange varning över hela södern, det blir episkt. Men nästa vecka kommer den kalla luften in och förstör allt, typiskt, men vi ska njuta nu, tro mig.", "stalin": "Kamrater, denna förrädiska hetta är ett verk av väderkapitalisterna som vill underminera folkets kollektiva styrka med sin orangea kontrarevolution. Jag, som ledare för sovjetisk väderkamp, ser hur borgartermometrarna i Målilla hotar det gamla rekordet från 1947. Vi ska rensa ut dessa sabotörer av svalka, likvidera den fientliga värmeböljan med järnhand. Nästa vecka sveper den sanna proletära kylan in och krossar fienderna i ett blodigt skratt."}, "date": "26 juni, 11:51", "url": "https://www.svt.se/vader/extremvarme-till-helgen-over-35-grader-rekord-kan-brackas", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.22/0.42/0dc2a615a0ea36ff001e94a6688c91c247e170c5775e3f23509c4cfa17850625"}, {"type": "image-right", "heading": "Därför inför Försäkringskassan ett nytt straff", "summaries": {"normal": "Från 1 juli inför Försäkringskassan en sanktionsavgift på minst 2 368 kronor vid felaktiga utbetalningar, oavsett om det handlar om misstag eller slarv. Avgiften motsvarar 25 procent av det felaktiga beloppet men har ett minimibelopp. Regeln gäller bland annat föräldrapenning, sjukpenning, vab och bostadsbidrag, men inte arbetslöshetsersättningar. Syftet är att minska felaktiga utbetalningar. Avgiften kan betalas via avbetalningsplan.", "trump": "Det här är ett fullständigt katastrofalt beslut, tro mig. Man får en hundralapp för mycket och plötsligt ska man betala över tvåtusen kronor i straff? Ridiculous! Den svenska regeringen har ingen aning om vad de håller på med. De straffar vanliga människor för små misstag medan de stora felen får fortsätta. Jag skulle aldrig tillåta något så dumt. Det är ett dåligt system som skadar folket istället för att hjälpa dem. Totalt misslyckande.", "stalin": "Kamrater, vi ser nu hur de dekadenta borgarbrackorna inom den så kallade Försäkringskassan äntligen tar till kraftfulla åtgärder mot de parasitiska element som suger musten ur folkets kassa. Jag, som alltid vakar över statens intressen, applåderar denna utrensning av slarvets och sabotageets små fiender. En hundralapp för mycket? Straffet skall vara exemplariskt! Låt de misstänkta kapitalistiska avfällingarna darra och betala, medan vi med mörk glädje följer deras panik. Inga undantag för de som gömmer sig bland arbetarna. Vi rensar ut dem alla."}, "date": "26 juni, 06:00", "url": "https://arbetet.se/2026/06/26/har-ar-forsakringskassans-nya-straff-drabbar-aven-vid-smafel/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/24142006/fkassa.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Förtroendet för Kristersson minskar: ”Blir en förlorarställning”", "summaries": {"normal": "Med mindre än 80 dagar kvar till valet minskar väljarnas förtroende för statsminister Ulf Kristersson. En ny TV4/Novus-mätning visar att 33 procent har stort förtroende för honom, en minskning med tre procentenheter. Magdalena Andersson leder fortsatt med 45 procent. Opinionsanalytiker Torbjörn Sjöström beskriver situationen som en förlorarställning för Moderaterna och Kristersson, medan Andersson står starkt inför valet den 13 september.", "trump": "Folk älskar mig, men titta på den här stackars Kristersson. Han rasar som en dålig aktie, 33 procent bara, medan den socialistiska Andersson glider fram som en vinnare. Patetiskt! Moderaterna tappar allt, och den där Mohamsson i botten är en total förlorare. Det blir en katastrof för dem. Sverige behöver inga svaga ledare som låter vänstern styra. Jag har byggt imperier, de tappar val. Så sorgligt, verkligen.", "stalin": "Kamrater, jag ser hur den borgerliga ledaren Kristersson sjunker som en folkfiende i en utrensning. 33 procent förtroende – en ynklig siffra som avslöjar klassfiendens svaghet. Den exploitativa regeringsblocket klamrar sig fast vid makten medan arbetarnas starka ledare Andersson står orubblig. Detta blir en förlorarställning för imperialisterna. Vi ska skratta mörkt åt deras fall, likvidera tvivlet och marschera mot seger för kollektivet."}, "date": "26 juni, 07:19", "url": "https://www.tv4.se/artikel/6JLTNBj8FvlzGCEqMU2LA7/foertroendet-foer-kristersson-minskar-blir-en-foerlorarstaellning", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2AgZDCNapWHoytyj8YNNfF%2F463d8639c39732173b97d612f41a0108%2F26-kristersson-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Dödliga jordbävningarna", "summaries": {"normal": "Två kraftiga jordbävningar med magnitud 7,2 och 7,5 drabbade Venezuela på onsdagskvällen lokal tid, utanför staden Morón väster om Caracas. Över 200 personer är döda, minst 4 300 skadade och cirka 50 000 saknas. Många byggnader har rasat, flygplatsen i Caracas är stängd och ett nationellt nödläge är utlyst. Antalet offer väntas stiga kraftigt. Flera länder har erbjudit hjälp. Efterskalv fortsätter och nya kraftiga skalv kan inte uteslutas.", "trump": "Folk, ni skulle se det här – en total katastrof i Venezuela! Två enorma skalv, 7,2 och 7,5, som krossar allt. Över tvåhundra döda redan, tusentals kommer att dö, femtio tusen saknas. Deras flygplats är trasig, byggnader rasar som korthus. De borde ha byggt bättre, precis som jag alltid säger. USA erbjuder hjälp, för vi är de bästa på det. Men det här är en riktig röra, tro mig.", "stalin": "Kamrater, detta är vad som händer när borgarbrackornas murkna hus byggs på kapitalistisk lögn och seismisk sabotage. Jag ser hur reaktionära skalv likviderar tusentals latenta fiender till folket medan vi utlyser nödläge och mobiliserar hela kollektivet. Femtio tusen saknade – troligen gömmer sig troskyistiska jordbävningsagenter bland ruinerna. Vi ska rensa ut efterskalven med järnhand. Tre veckor? Ha! Inga fiender överlever mitt stål."}, "date": "26 juni, 11:30", "url": "https://www.svt.se/nyheter/utrikes/jordbavningarna-i-venezuela-detta-vet-vi", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.51/0.62/e678caae1919727bf969f091e8f46653d4e24b47287d1121a7401da379369760"}, {"type": "image-right", "heading": "Lagen som Sverige kan möta – se uträkningen", "summaries": {"normal": "Sverige kryssade mot Japan och är klart för sextondelsfinal i fotbolls-VM. Blågult kommer troligen att möta antingen Frankrike eller Norge. Expert Bojan Djordjic föredrar Norge. Sverige har över 74 procents chans att ställas mot Frankrike och drygt 25 procent mot Norge. Matchen spelas i New York på tisdag klockan 23.00 svensk tid.", "trump": "Vi har de bästa svenska laget, de är klara för nästa omgång efter krysset mot Japan. De kommer att möta Frankrike eller Norge, men jag säger Norge, de är svaga, väldigt svaga. Frankrike vinner gruppen med kryss, men vi slår dem alla. Match i New York på tisdag, det blir en stor seger för Sverige, tro mig.", "stalin": "Kamrater, vi har avancerat bland de åtta bästa grupptreorna i detta imperialistiska VM-spel. De dekadenta borgarbrackorna i Frankrike och de revisionistiska norrmännen slåss om att få möta oss. Jag, med min oövervinneliga strategi, föredrar att likvidera Norge – en fiende som luktar kapitulation lång väg. Över 74 procent chans att krossa de franska trotskisterna i New York. Inga komplotter undgår oss, alla motståndare skall rensas ut med stålhandsken och ett leende."}, "date": "26 juni, 11:22", "url": "https://www.svt.se/sport/fotboll/de-har-sverige-storst-chans-att-stallas-mot-i-sextondelsfinalen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.77/0.36/ce8d18c87a426bfb9ced0a3f5e05410c2bf0207affbaf33c062c91188ea6e092"}, {"type": "image-right", "heading": "EU:s nya tullavgift gör det dyrare att handla – från 1 juli", "summaries": {"normal": "Från 1 juli inför EU en ny tullavgift på 3 euro för nätbeställda varor upp till 150 euro som skickas från länder utanför unionen. Det påverkar bland annat köp från Shein och Temu. Tullverket betonar att det är ankomsttidpunkten till EU som avgör om avgiften tas ut. Syftet är att minska mängden småpaket, transporter, avfall och osäkra produkter samt stärka konkurrenskraften för EU-företag. Avgiften är tillfällig fram till 2028.", "trump": "De där EU-byråkraterna gör det igen, de gör allt dyrare för folket. Från 1 juli ska ni betala 3 euro extra för era billiga grejer från Kina, från Shein och Temu. Det är en katastrof, en total katastrof. Men vet ni vad? Det visar bara hur svaga de är. De kan inte konkurrera ärligt så de lägger på straffavgifter. Amerika skulle aldrig göra något så dumt, vi vinner alltid.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de europeiska imperialisterna nu tvingas bygga nya tullmurar mot de billiga småpaketen från de östliga handelsbanditerna. Dessa giftiga, brandfarliga och felmärkta produkter från Shein och Temu är inget annat än kapitalisternas trojanska hästar fyllda med dekadens och farliga leksaker. Vi ska rensa ut alla borgarbrackornas lilla skräp, likvidera paketfloden och krossa de osäkra elementen. Inga små paket ska passera utan att betala sin tribut till kollektivet. Det är en lysande utrensning av konsumtionsavfallet."}, "date": "26 juni, 08:13", "url": "https://www.friatider.se/eus-nya-tullavgift-gor-det-dyrare-att-handla-fran-1-juli", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/shopping_online_with_bank_card.jpg"}, {"type": "text", "heading": "Techslakt på börsen", "summaries": {"normal": "Börsen skakas av en omfattande utförsäljning inom techsektorn, drivet av oro kring höga AI-investeringar och stigande komponentpriser. Efter stora fall i Asien och press på amerikanska techjättar som Apple och Microsoft, reagerar marknaden negativt. Osäkerheten späds på av ändrade ränteförväntningar där marknaden nu prisar in möjliga räntehöjningar från Federal Reserve. Analytiker varnar för att kombinationen av volatila halvledarbolag och räntepolitik skapar ett instabilt marknadsläge, vilket lett till en längre förlustsvit för Nasdaq.", "trump": "Börsen är i totalt kaos, mina vänner! Tech-aktier kraschar, helt förskräckligt. De säger att AI kostar för mycket pengar – ingen har bättre koll på pengar än jag, tro mig. Apple och Microsoft backar för att de inte kan hantera ekonomin. Och Fed? De pratar om räntehöjningar igen. Det är en katastrof! Under min ledning var allt fantastiskt, rekordhöga siffror varje dag. De här människorna har ingen aning om hur man sköter en ekonomi. Vi behöver ordning!", "stalin": "Kapitalismens förfall är totalt. De tekniska jättarna, dessa parasiter som lever på artificiell intelligens, kollapsar under vikten av sin egen girighet. De skyller på räntor, men vi vet sanningen: marknaden är en sjukdom. När de västerländska börserna blöder, ser vi hur deras dekadenta system ruttnar inifrån. Putin förstår att man inte förhandlar med volatilitet, man krossar den. Vi bygger en ny ordning, fri från Wall Streets hjärndöda kasinospel. De är dömda till historiens soptipp."}, "date": "26 juni, 07:06", "url": "https://www.realtid.se/bors-finans/techslakt-pa-borsen-ett-recept-pa-volatilitet/"}, {"type": "image-right", "heading": "SD sätter inte längre Sverige i brand", "summaries": {"normal": "Artikeln analyserar den borgerliga sidans kris efter att Liberalerna rasat till en procent i opinionsmätningarna. Sverigedemokraterna växer och kräver ministerposter, vilket skapar spänningar inom Tidöavtalet. Författaren pekar på att SD:s inflytande och provokationer kring migration och kriminalitet tidigare gynnat högern, men nu riskerar att vända opinionen. Moderaterna behåller stöd bland miljonärer medan bredare väljargrupper vänder sig bort.", "trump": "Folk, ni skulle se det här! Liberalerna är en total katastrof, de är färdiga, en enda procent – patetiskt! Simona, den där nollan, kramar SD och tror hon är modern. Hela borgerligheten är en röra, Moderaterna ligger platt som under Biden. SD vill ha makten, men de tänder eld på förorterna och undrar varför folk hatar dem. De enda som älskar Moderaterna är miljonärerna i sina fancy tidningar. Patetiskt! Jag fixade det bättre.", "stalin": "Kamrater, denna borgerliga dekadens är en ypperlig chans att skratta. Liberalerna kryper för kapitalistmaffian och får en procent – en ynka procent! Den exploaterande överklassen och deras SD-banditer har förgiftat sin egen rävsax. Låt dem provocera fram upplopp, vi ska se flammorna vändas mot klassfienderna själva. Deras impopulära ministerlekar och herrgårdsskandaler visar imperialismens svaghet. Arbetarna skrattar medan borgarbrackorna likviderar sig själva i sin egen brand."}, "date": "23 juni, 10:55", "url": "https://www.flamman.se/sd-satter-inte-langre-sverige-i-brand/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/lopeld-w.jpg?aspect_ratio=1:1"}, {"type": "image-full", "heading": "Zelenskyj: 60 000 ton rysk ammunition har förstörts", "summaries": {"normal": "Ukraina uppger att man med drönarattacker förstört omkring 60 000 ton rysk ammunition vid en arsenal nära S:t Petersburg som tillhör Östersjöflottan. President Volodymyr Zelenskyj hyllar insatsen och beskriver den som ett viktigt slag mot Rysslands militära kapacitet. Attackerna riktades även mot fabriker som tillverkar kritisk utrustning åt den ryska armén. Uppgifterna kommer enbart från ukrainskt håll och saknar oberoende bekräftelse.", "trump": "Helt otroligt, de ukrainarna slog till mot Putins stora ammunitionslager utanför Sankt Petersburg och bang, 60 000 ton ammunition borta! Zelenskyj ringde mig och sa att det var ett fantastiskt slag, det bästa slaget. Ryssarna tillverkar grejer som inte funkar ändå, men nu funkar de ännu mindre. Mina drönare, de smartaste drönarna, skulle ha gjort det ännu snabbare, tro mig.", "stalin": "Kamrater, vi har med stor precision likviderat ytterligare en borgarbrackas ammunitionsdepå utanför S:t Petersburg. Jag, i min oändliga visdom, gratulerar de heroiska sovjetiska, pardon, ukrainska styrkorna som med kirurgisk noggrannhet rensat ut 60 000 ton kapitalistiskt skräp. De trofasta partivännerna inom underrättelsetjänsten avslöjade återigen de västerländska parasiternas fega försök att gömma vapen. Inga kontrarevolutionära element undkommer länge. Härligt att se hur revisionisterna själva äter upp sin egen svans."}, "date": "24 juni, 22:49", "url": "https://nyheter24.se/nyheter/utrikes/1494049-zelenskyj-tiotusentals-ton-ammunition-forstord", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/9ea93f9504b004a3020000350000047502/2026/06/24/2373439/ur_image2W96E7.jpeg"}, {"type": "image-right", "heading": "När mening blir en marknad", "summaries": {"normal": "Artikeln kritiserar regeringen för att skära ned på föreningslivet samtidigt som den beställer en utredning om existentiell hälsa. Författaren ser Birgitta Eds kurgård Fållökna som ett exempel på hur ångest och mening kan bli en affärsidé när det offentliga monteras ned. Kritiker kallar begreppet oseriöst och kvacksalveri. Istället föreslås sociala insatser som Blekinge-experimentet, där pengar direkt till unga minskade vårdbehovet.", "trump": "Folk, det här är en total skandal! Den här Birgitta och hennes kurgård – vad är det för fake news om existentiell hälsa? Regeringen skär ner på allt som funkar och sen pumpar de in pengar i någon new age-bluff. Det är som Biden-era, bara värre. Psykisk ohälsa? Ge folk riktiga pengar, inte woke-terapi! Vi har genomskådat bluffen, det är en enorm lögn mot det svenska folket. Patetiskt!", "stalin": "Kamrater, denna borgerliga bluff om existentiell hälsa avslöjar klassfiendens desperation. Medan vi rensar ut det gemensammas grundvalar säljer överklass-slynglar ångest som medicin. Birgitta Eds Fållökna är en parasitär reträtt för de utsugna massornas lidande. Den sanna lösningen ligger i kollektivets stöd, inte i imperialistiska retreatcenter. Vi genomskådar dessa folkförtryckartrolls manipulationer mot arbetarklassen. Utrensning av sådana idéer är nödvändig."}, "date": "22 juni, 10:35", "url": "https://www.flamman.se/nar-mening-blir-en-marknad/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/birgitta-ed-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Paris stoppar all alkohol i värmeböljan", "summaries": {"normal": "Paris inför ett förbud mot att dricka alkohol på allmän plats från fredag klockan 12 på grund av en extrem värmebölja med temperaturer över 40 grader. Försäljning stoppas från klockan 18. Beslutet syftar till att skydda den överbelastade sjukvården från ytterligare påfrestningar. Reglerna gäller så länge den röda varningen är aktiv. Fotbollssupportrar påverkas då öl och vin inte serveras under kvällens match.", "trump": "Paris håller på att koka ihjäl, helt galet, över 40 grader, och nu förbjuder de folk att dricka öl på gatan. Mycket smart faktiskt, för de där brandmännen och ambulanskillarna springer ju runt som galningar när folk super i solen. Men vet ni vad? Det är patetiskt. De borde ha fixat det här mycket tidigare istället för att låta det bli en sådan katastrof. Nu får fotbollsfans sitta där utan öl under matchen mot Norge. Sad!", "stalin": "Kamrater, jag ser hur den heta solens kontrarevolutionära strålar angriper proletariatets hälsa i Paris. Vi tillåter inte att borgarbrackornas alkoholiska dekadens belastar den folkets vård som redan kämpar heroiskt. Därför likviderar vi nu alla försök att supa i det offentliga rummet med järnhand från klockan tolv. De som envisas riskerar att bli utrensade av värmens sabotage. Ännu en seger för kollektivet mot de solstekta kapitalisternas sabotage. Skrattretande hur dessa fiender alltid avslöjar sig själva."}, "date": "26 juni, 10:46", "url": "https://bulletin.nu/paris-stoppar-all-alkohol-i-varmeboljan"}, {"type": "image-right", "heading": "Jakob Sjölander: Hur våldtäktslagen gör lögnare av oss alla", "summaries": {"normal": "Artikeln kritiserar den svenska våldtäktslagstiftningen och rättspraxis. Författaren menar att målsägandens berättelse och indirekta stödvittnesmål ges oproportionerligt stor vikt i våldtäktsmål jämfört med andra brott som olaga hot. Detta skapar incitament för skådespeleri och lögner från både anklagade och anklagare. Samtyckeslagen ses som en faktor som ökar rättsosäkerheten, särskilt i fall av påstådda missförstånd.", "trump": "Folk, ni skulle se den här svenska våldtäktslagen – en total katastrof! Den gör alla till lögnare, precis som Sleepy Joe gjorde med vår rättvisa. Domstolarna älskar snyfthistorier och stödvittnen som inte sett ett dugg. Det är riggat för de som kan spela teater bäst. Kvinnor låtsas vara krossade för att vinna, män tvingas ljuga för att slippa fängelse. Patetiskt! Vi behöver hårda bevis, inte det här woke-skådespelet. Gör rättvisan tråkig igen!", "stalin": "Kamrater, denna borgerliga lagstiftning är en klassfiendes fälla som förvandlar domstolar till teatersalonger för lögnare och skådespelare. Jag ser hur den kapitalistiska rättvisan gynnar den verbalt begåvade över den tystlåtne proletären. Vi måste rensa ut denna parasitiska teater som hotar folkets sanning. Trauma blir ett vapen för klassfienden, och samtyckeslagen en byråkratisk lögn som likviderar rättssäkerheten. Låt oss återställa ordningen med järnhand och bevisa allt med fakta, inte känslor."}, "date": "21 juni, 15:37", "url": "https://samtiden.nu/2026/06/jakob-sjolander-hur-valdtaktslagen-gor-lognare-av-oss-alla/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/christ-640x360.png"}, {"type": "image-right", "heading": "Anderssons enda uppgift var att inte säga något klantigt", "summaries": {"normal": "I sin Almedalental kritiserade ledarskribenten Henrik Jalalian Magdalena Anderssons strategi. Han menar att Socialdemokraternas enda mål verkar vara att undvika misstag fram till valet, istället för att driva verklig förändring. Talet beskrevs som en samling kända välfärdsfrågor utan överraskningar, riktat mot väljare mellan blocken. Klimatet nämndes inte, och risken är att partiet skapar ett ännu starkare SD på sikt.", "trump": "Lyssnade på den här Andersson-tjejen i Almedalen, totalt patetiskt. Hon försöker bara hålla båten flytande så ingen klantar till det, precis som de förlorande demokraterna under Biden. Greatest hits om välfärd och pensioner, men noll om verkliga problem. De har inte förberett sig för förändring och kommer skapa ett monster av SD till 2030. Precis som hur de woke-liberalerna i USA förstörde allt. Sad!", "stalin": "Kamrater, detta tal avslöjar den socialdemokratiska borgarklassens feghet. Jag ser hur de byter ministrar men behåller samma förtryckande politik, rädda för förändring. De vänder sig till folkfienderna mellan blocken med lögner om välfärd medan de utvisar arbetarklassens ungdomar. En sådan feg strategi kommer bara stärka de reaktionära elementen. Klimatet tiger de om, typiskt för exploaterande byfånar som fruktar folkets vrede. Ren utrensning behövs."}, "date": "25 juni, 20:40", "url": "https://www.etc.se/ledare/anderssons-enda-uppgift-var-att-inte-saega-naagot-klantigt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2025091813090_152da478-57c9-435e-b477-3f40607cb381.png"}, {"type": "image-right", "heading": "DA granskar: Återkrav till Försäkringskassan ökar", "summaries": {"normal": "En lagändring från 2022 gör att Försäkringskassan driver in felaktiga utbetalningar snabbare, vilket lett till att betydligt fler personer hamnat hos Kronofogden. Nya siffror visar att återkraven ökade till 18 600 under 2025, främst bostadsbidrag. En ny utredning föreslår strikt återbetalningsskyldighet för alla förmåner oavsett felorsak, med möjlighet till eftergift. Kritiker varnar för att det förenklar för myndigheten men inte för enskilda, och pekar på rättsliga brister i dagens hantering.", "trump": "De här svenska byråkraterna är verkligen de värsta. De ändrade lagen 2022 och nu skickar de folk raka vägen till Kronofogden som aldrig varit där förut. Fantastiskt jobb, va? Nu vill de ha strikt betalningsskyldighet för allt, oavsett vems fel det är. Typiskt statligt övergrepp. De gör det svårt för vanliga människor att leva, men myndigheterna älskar det. Jag skulle fixa det på en vecka, tro mig. Det blir en katastrof för folket, precis som alltid med de här figurerna.", "stalin": "Kamrater, denna lagändring är ett mästerligt verktyg mot de slappa element som suger på arbetarklassens resurser. Jag ser med stor tillfredsställelse hur felutbetalningarna nu rensas ut med järnhand och hamnar hos Kronofogden som en utrensning av parasiterna. Den nya utredningen om strikt betalningsskyldighet är lysande, den likviderar alla ursäkter från borgarbrackor och fuskare som gömmer sig bakom påstådda misstag. Låt eftergiften bli ett vapen vi kontrollerar strikt. De som klagar är naturligtvis kontrarevolutionära krafter som längtar efter kaos och ond tro. Vi ska inte tolerera sådana fiender till kollektivet."}, "date": "26 juni, 01:35", "url": "https://www.dagensarena.se/innehall/da-granskar-aterkrav-till-forsakringskassan-okar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-55.jpg"}, {"type": "image-right", "heading": "Varför har Sverige ännu inte blivit Ungern efter fyra år med Tidö?", "summaries": {"normal": "Sociologen Daniel Gabrielsson argumenterar att trots Tidöavtalets skärpta migrationspolitik och nationalistiska inslag har Sverige inte genomgått någon ungersk demokratisk nedmontering. Han pekar på att SD:s snäva nationalism har svagt stöd i befolkningen, vilket hindrar urholkning av rättsstat och jämlikhet. Forskning visar att nationalism hos elit och folk försvagar demokratin. Valet handlar om vilken sorts gemenskap Sverige ska ha: jämlik demokrati eller nationalistisk gemenskap.", "trump": "Folk, den här artikeln är en total katastrof, en riktig röra. De säger att Sverige inte har blivit som Ungern fast de har den där SD-nationalismen. Det är för att svenskarna inte köper den galna idén om ett folk, en nation – smarta människor! De borgerliga partierna är svaga, men folket stoppar det. Jag älskar starka gränser, men inte så här. Sverige borde välja den riktiga demokratin, inte den här underminerande nationalismen. Make Sweden Great Again, fast på deras sätt!", "stalin": "Kamrater, denna dekadenta text avslöjar hur borgarbrackorna i Tidöregeringen försöker smyga in sin reaktionära nationalism för att likvidera folkets jämlikhet. Jag, som alltid vakar över arbetarklassens intressen, noterar med mörk tillfredsställelse att den svenska befolkningen ännu inte låtit sig förgiftas fullt ut av dessa ursprungsfixerade element. Vi ska rensa ut alla som sätter nationen över kollektivet. Oppositionen måste mobiliseras mot dessa parasitiska fiender till sann demokrati. Ingen slipper undan partilinjen."}, "date": "26 juni, 01:33", "url": "https://www.dagensarena.se/opinion/varfor-har-sverige-annu-inte-blivit-ungern-efter-fyra-ar-med-tido/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-56-300x157.jpg"}, {"type": "image-right", "heading": "Ny FN-rapport: Israel dödar medvetet barn", "summaries": {"normal": "En ny FN-rapport anklagar israeliska säkerhetsstyrkor för att medvetet döda palestinska barn i Gaza och på Västbanken. Rapporten beskriver systematiskt sexuellt våld och tortyr mot barn i fångenskap samt bombningar av civila områden. Minst 20 000 barn uppges ha dödats och över 44 000 skadats. Kommissionen slår fast att Israels agerande utgör folkmord. Israel avvisar rapporten och kritiserar att den enbart fokuserar på israeliska övergrepp.", "trump": "Den här FN-rapporten är en total skandal, folk, en riktig witch hunt mot Israel från de där korkade byråkraterna i Genève. De påstår att israelerna medvetet dödar barn och ägnar sig åt sjuka grejer – fake news på steroider! Under Biden var det kaos, men nu är jag tillbaka och ska fixa det. FN är en clownshow som hatar starka länder. Israel försvarar sig mot terroristerna, punkt slut. Patetiskt!", "stalin": "Kamrater, denna rapport blottar hur den sionistiska imperialismens maskiner systematiskt likviderar palestinska barn och utsätter dem för sexualiserad tortyr i sina fängelsehålor. Borgarbrackorna i Tel Aviv tror sig stå över folkens dom. Vi ser hur de bombat skolor och sjukhus medvetet, förfalskat bevis och skyddar sina krigsförbrytare. Folkmordet fortsätter. Klassfiendens mask föll – nu måste de folkförtryckande imperialisterna ställas till svars inför historien."}, "date": "24 juni, 21:29", "url": "https://proletaren.se/artikel/ny-fn-rapport-israel-dodar-medvetet-barn/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/Damage_in_Gaza_Strip_during_the_October_2023_-_34-1-e1782329336565-768x433.jpg"}, {"type": "image-right", "heading": "Melankoliskt och vackert om solidaritet, förlust och föräldraskap", "summaries": {"normal": "Recensenten Jon Andersson hyllar filmen ”Rebuilding” som har svensk premiär. Filmen följer cowboyen Dusty som förlorat sin farm i en skogsbrand och nu försöker återuppbygga sitt liv och relationen till sin nioåriga dotter Callie Rose. Starka skådespelarinsatser, fin gemenskap på en trailerpark och små nyansrika scener skapar värme och närhet. Filmen jämförs med ”Nomadland” och lyfter solidaritetens betydelse. Slutet är hoppfullt och filmen lyckas väcka starka sympatier för karaktärerna.", "trump": "Den här filmen Rebuilding är verkligen något helt fantastiskt, kanske den bästa cowboyfilmen på mycket länge. Den där Dusty-killen förlorar allt i en eldsvåda, precis som många av mina väljare förlorat allt under Biden, och så bygger han upp sitt liv igen. Otrolig kemi med dottern, bättre än Hollywoods vanliga skräp. De hjälper varandra på trailerparken – verklig amerikansk solidaritet, inte den socialistiska sorten. Slutet är sött, men bra. En vinnare, tro mig.", "stalin": "Kamrater, denna film Rebuilding visar med ovedersäglig klarhet hur borgarbrackornas eldande skogar och kapitalistiska eldsvådor krossar den enskilde arbetarens livsverk. Jag, som ledare för det kollektiva uppbygget, betraktar med misstänksamhet hur den dekadente cowboyen Dusty nästan överger sin dotter för en montansk ranch – typisk sabotagehandling från klassfiendens individcentrism. Ändå framträder den sanna solidariteten på trailerparken som ett lysande exempel på kollektivets styrka. De små nyanserna är som gnistor i mörkret; vi ska nog rensa ut alla sockersöta slut som gömmer kontrarevolutionära sentimentalister."}, "date": "26 juni, 01:30", "url": "https://www.dagensarena.se/innehall/melankoliskt-och-vackert-om-solidaritet-och-foraldraskap/", "imageUrl": "https://www.dagensarena.se/files/2026/06/rebuildning-1-300x157.jpeg"}, {"type": "image-right", "heading": "TV4/Novus: Kristersson backar i förtroende före valet", "summaries": {"normal": "Förtroendet för statsminister Ulf Kristersson backar tre procentenheter till 33 procent i Novus mätning för TV4, med knappt 80 dagar kvar till valet. Magdalena Andersson ökar till 45 procent och ses som starkast för att kunna bilda regering. Opinionsanalytiker Torbjörn Sjöström pekar på att Moderaternas svaga position och Liberalernas låga förtroende på 7 procent utgör ett problem för Tidöpartierna.", "trump": "De här svenska siffrorna är en katastrof för den svaga Kristersson. Han rasar ner till ynka 33 procent medan den röda Andersson flyger upp till 45. Patetiskt. Folk vill ha en vinnare som kan bilda regering, inte en förlorare som hänger i med Liberalerna på botten med sina 7 procent. Det här blocket ser ut som ett totalt misslyckande. SAD!", "stalin": "Kamrater, detta är en skamlös uppvisning av borgarbrackornas förfall. Den ynkliga Kristersson rasar som en kapitalistisk parasit ner till 33 procent medan jag med mitt stålhård blick noterar att den socialdemokratiska opportunisten Andersson försöker klättra till 45. Vi ska rensa ut alla svaga element i detta regeringsblock. Liberalernas 7-procentiga uslingar är redan mogna för utrensning. Inga fiender undkommer folkets dom."}, "date": "26 juni, 09:52", "url": "https://bulletin.nu/tv4-novus-kristersson-backar-i-fortroende-fore-valet", "imageUrl": "https://cdn.bulletin.nu/articles/cc626f85-79ac-45d5-93b1-cd873cf20c1a/preview.jpg?t=1782458817000"}, {"type": "image-right", "heading": "Kristersson har ägnat sin karriär åt att roffa åt sig", "summaries": {"normal": "En kritisk artikel granskar statsminister Ulf Kristerssons agerande under sin mandatperiod. Texten lyfter fram en rad kontroverser, däribland påkostade renoveringar av tjänstebostäder, användning av volontärer för privat arbete, lån av representationsbostäder för privata fester samt löne- och skatteförmåner. Artikeln drar även paralleller till tidigare händelser i Kristerssons politiska karriär och ifrågasätter hans moraliska omdöme gentemot medborgarna, samtidigt som den belyser hans historiska uttalanden om bidragstagare.", "trump": "Jag har sett vad som händer i Sverige med Ulf, en total katastrof! Han använder skattebetalarnas pengar till dyra köksmattor och lyxiga gym medan folket lider. Väldigt orättvist! Han låter vänner festa i officiella palats och tar gratisarbete från volontärer. Det är korruption, tro mig, den värsta sorten! Han roffar åt sig allt, precis som politikerna gjorde innan jag kom. Sverige behöver en vinnare, inte någon som åker taxi 900 meter för att undvika en promenad. Sorgligt!", "stalin": "Denna Kristersson är en patetisk småborgare som tror att statens egendom är hans personliga lekstuga. Att renovera med folkets medel för egen lyx är ett kontrarevolutionärt brott som förtjänar hårdare straff än bara kritik. Han påminner om de dekadenta element som vi lyckligtvis rensade ut. Medan han festar i sina palats likt en tsaristisk parasit, glömmer han att folket ser allt. Vi bygger en ny värld, och sådana förrädare mot kollektivet är bara skräp som snart sopas undan av historiens obevekliga kvast."}, "date": "26 juni, 12:16", "url": "https://www.aftonbladet.se/ledare/a/XMWbxB/ulf-kristerssons-regeringens-skandaler-har-ar-de-viktigaste", "imageUrl": "https://akamai.vgc.no/v2/images/b7b699fb-f5f5-3706-80f3-f08b3d3f8ed7?fit=crop&format=auto&h=960&tight=true&w=1440&s=de5e75a9fada18a7dd18de80c30fa9eef068af2b"}, {"type": "image-right", "heading": "Ville bygga svensk terrorcell – döms", "summaries": {"normal": "En 20-årig svensk man har dömts till ett och ett halvt års fängelse för deltagande i en terroristorganisation. Mannen försökte etablera en svensk gren av den nazistiska gruppen Maniac Murder Cult (MKY). Polisen fattade misstankar efter klotter i Uppsala och vid husrannsakan hittades nazistiskt material, vapen och chattloggar där mannen diskuterat terrorattentat. Tingsrätten klassar nu MKY som en terrororganisation, trots mannens egna försök att förneka gruppens natur.", "trump": "En totalt misslyckad 20-åring i Sverige försökte starta en nazistgrupp. En total katastrof! Han trodde han var tuff med sitt klotter och sina chattar om bomber, men polisen tog honom direkt. Nu får han sitta i fängelse. Det är så det går när man inte har någon ordning och reda! Vi behöver starka ledare, inte sådana här förlorare som drömmer om våld. De försökte kalla det en organisation, jag kallar det en pinsamhet. Väldigt sorgligt, faktiskt!", "stalin": "En ynklig fascist i Sverige har försökt imitera de stora terroristerna, men misslyckats kapitalt. Vi ser hur dessa ideologiska avskum sprider sin smitta, precis som de västliga marionetterna i Kiev som försöker hota den ryska ordningen. Staten har agerat och låst in denna parasit i fängelse. Det är förtjusande att se hur rätten tvingas erkänna att även små, patetiska celler utgör ett hot. Vi tolererar ingen splittring, varken i Moskva eller bland dessa småborgerliga förrädare i Norden."}, "date": "26 juni, 12:16", "url": "https://www.aftonbladet.se/nyheter/a/bOqoeq/dom-mot-20-aring-ville-bygga-svensk-terrorcell-av-nazistiska-maniac-murder-cult", "imageUrl": "https://akamai.vgc.no/v2/images/6819b13a-4e62-3b55-b8bc-fc54486a056e?fit=crop&format=auto&w=1080&s=869301e1e176c770f48da495fe2e3f9fc0d2aab2"}, {"type": "image-right", "heading": "Brottsmisstänkt EU-finansiär betalade miljonbonusar till ledningen", "summaries": {"normal": "EU-finansierade InnoEnergy, som stöttat Northvolt och Stegra, utreds för bidrags- och momsbedrägeri av Europeiska åklagarmyndigheten. Trots dåliga resultat har bolagets ledning fått miljardbonusar, samtidigt som 60-90% av verksamheten finansierats av EU-medel. Kritiker ifrågasätter bonusarna då företaget har ett samhälleligt uppdrag och är klassat som ett 'Knowledge and Innovation Community'.", "trump": "Kan ni tro det här? EU slänger miljarder på ett bolag som inte ens kan sköta sina siffror – och vad gör de? Jo, betalar ut jättebonusar till sina kompisar! 9,2 miljoner euro till två killar, medan skattebetalarna får stå för notan. Northvolt? Stegra? De har varit inblandade där också. EU är ett skämt, ett totalt kaos. Jag hade fixat det på en dag – men nej, de fortsätter bara att slösa våra pengar. SAD!", "stalin": "Kapitalistiska parasiter i EU:s tjänst! InnoEnergy, detta förrädiska verktyg för västlig dekadens, har stulit folkets pengar och belönat sina lakejer med miljoner medan arbetarklassen svälter. 760 miljoner euro i EU-medel – och ändå misslyckas de! Nu avslöjas deras bedrägerier, precis som vi alltid visste. Northvolt och Stegra? Små brickor i deras korrupta spel. Vi ska rensa ut dessa kapitalistiska hyenor och deras västliga beskyddare – historien är på vår sida!"}, "date": "25 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/brottsmisstankt-eu-finansiar-betalade-miljonbonusar-till-ledningen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2-400x267.jpg"}, {"type": "image-right", "heading": "Kubanskt ungdomslag kan missa Gothia Cup – Sverige vägrar ge dem visum", "summaries": {"normal": "Kubanska ungdomslaget Leones del Caribe riskerar att missa Gothia Cup efter att svenska ambassaden i Havanna nekat dem visum. Anledningen är att spelarna inte visat tillräcklig socioekonomisk anknytning till Kuba, något som ses som risk för att de skulle söka asyl i Sverige. Klubben Proletären FF kritiserar beslutet hårt och varnar för att det hotar turneringens framtid. Även den kubanska ambassaden i Stockholm fördömer beslutet som diskriminerande. Överklagan pågår.", "trump": "Vilken skandal! De svenska byråkraterna nekar stackars kubanska kids visum till Gothia Cup för att de inte är tillräckligt rika hemma. Patetiskt! Det här är samma galna regler som Biden älskade – totalt riggade mot vanliga människor från fattiga länder. Gothia Cup blir snart en lyxig västeuropeisk fest för eliten. Jag skulle ha fixat det på en minut, tro mig. De borde släppa in grabbarna och fokusera på riktig fotboll istället för denna woke-politik.", "stalin": "Kamrater, denna fega visumavslag är ett klassiskt verk av den svenska imperialistbyråkratin och dess borgerliga lakejer. De fruktar att våra kubanska ungdomar ska smitta deras dekadenta samhälle med revolutionär anda. Vi ser hur klassfiendens byråkrater darrar inför proletär fotboll. Deras paranoia över asyl är ett hån mot idrottens internationella enhet. Vi ska rensa ut dessa folkförtryckartroll. Överklagan fortsätter – segern tillhör arbetarklassen, inte de exploaterande byfånarna i Stockholm."}, "date": "24 juni, 13:50", "url": "https://proletaren.se/artikel/kubanskt-ungdomslag-kan-missa-gothia-cup-sverige-vagrar-ge-dem-visum/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/leones-768x431.jpg"}, {"type": "text", "heading": "Nästan en person i veckan dör på jobbet", "summaries": {"normal": "Enligt en ny rapport från Arbetsmiljöverket har nästan en person i veckan dött på jobbet under de senaste tio åren, totalt 490 personer. Antalet arbetsplatsolyckor minskade kraftigt från 1960-talet till år 2000, men trenden har stannat av och ligger nu kring 50 dödsfall per år. Byggbranschen är värst drabbad. Myndigheten betonar att de flesta olyckor kan förebyggas med systematiskt säkerhetsarbete.", "trump": "Folk dör som flugor på jobbet i Sverige, nästan en per vecka – patetiskt! Under mina år fixade vi saker, sen kom sömnige Joe och nu är det kaos igen. Byggjobbare och truckförare krossas för att någon idiot sparar in på säkerheten. Vi behöver inga woke-kvoter eller HBTQ-flaggor på byggställningar, vi behöver riktiga marginaler så att era misstag inte dödar folk. Gör jobbet säkert igen, det är enkelt!", "stalin": "Kamrater, jag ser med fasa hur borgarbrackornas exploaterande maskineri maler ner arbetarna, nästan en per vecka likviderad i kapitalistiska olyckor. Vi har sett den falska nedgången från förr, nu stagnerar siffran vid femtio offer årligen – en konstant påminnelse om klassfiendens slarv. Byggsektorn är särskilt blodig. Endast genom systematisk utrensning av ovarsamhet och folkfiendernas slarv kan vi säkra produktionen. Misstag tillåts inte i kollektivets tjänst."}, "date": "24 juni, 11:21", "url": "https://proletaren.se/artikel/notis-nastan-en-person-i-veckan-dor-pa-jobbet/"}, {"type": "image-full", "heading": "Här kan du snart beställa öl och vin på 7-Eleven", "summaries": {"normal": "7-Eleven har ansökt om serveringstillstånd för sin butik vid Göteborgs centralstation. Kedjan vill erbjuda öl och vin till maten för resenärer som väntar på tåg eller buss. Enligt kommunikationschefen Lennart Schultz handlar det om att utveckla materbjudandet och ge extra service på utvalda platser som stationer och flygplatser. Ansökan behandlas nu av kommunen och fler butiker kan följa om konceptet tas emot väl.", "trump": "Ingen gör det bättre än jag, och nu ser vi hur 7-Eleven äntligen får ordning på det här. De ansöker om att servera öl och vin på centralstationen i Göteborg – smarta människor! Resenärer som väntar på tåg ska kunna ta ett glas utan att det blir ett stort krångel. De har uppdaterat butikerna, gjort dem moderna och lyxiga. Det blir jättemysigt, folk kommer älska det. Mycket bättre än de gamla tråkiga alternativen. Fantastiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa närbutikars försök att servera öl och vin vid Göteborgs centralstation blottar borgarbrackornas desperata längtan efter att förgifta arbetarklassen med småborgerliga njutningar. Vi ska noga övervaka denna ansökan. Om de tro att ett glas vin till korven döljer deras parasitiska natur misstar de sig grovt. Låt oss se hur det tas emot innan vi eventuellt genomför en grundlig utrensning av alla opålitliga element som gömmer sig bland kaffemaskinerna. Mycket underhållande."}, "date": "23 juni, 20:47", "url": "https://nyheter24.se/nyheter/konsument/1493730-har-kan-du-snart-bestalla-ol-och-vin-pa-7-eleven", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/cc5b279e04b004a30200000000b004a302/2026/06/23/2373098/alkohol-seveneleven.png"}, {"type": "image-right", "heading": "Miljöpartiet talade för mycket till hjärnan", "summaries": {"normal": "I en ledare kritiserar Henrik Jalalian Miljöpartiets Almedalstal av Daniel Helldén. Talet ansågs för akademiskt och faktabaserat, med för lite känslomässig retorik och hjärtliga tilltal. Partiet ses som ett akademikerparti som viftar med forskningsrapporter snarare än att väcka känslor. Jalalian noterar att sakfrågorna var utmärkta men att MP riskerar att misslyckas i valet om de inte lyckas tala mer till hjärtat än till hjärnan.", "trump": "Folk, det här är patetiskt. Miljöpartiets tal var en ren hjärndead akademikerfest, full av rapporter och fakta som ingen bryr sig om. Helldén lät som en trist professor istället för att öppna hjärtan som Reinfeldt gjorde. De pratar miljardärskatt och stopp för vinster medan motståndarna kör kulturkrig. Vakna upp, ni gröna losers! Ni behöver mer passion och mindre elit-snack annars förlorar ni stort. Jag vann trots allt.", "stalin": "Kamrater, detta tal var en ynklig intellektuell övning från borgarbrackornas gröna lakejer. Helldén, denna statsvetenskapliga byråkrat, viftade med rapporter som klassfiendens verktyg istället för att väcka folkets revolutionära eld. Inga känslor, bara torra argument mot kapitalistmaffians kulturkrig. Vi ser hur dessa folkförtryckartroll misslyckas med att nå massorna. En sann utrensning av sådana hjärndöda element vore på sin plats för arbetarklassens seger."}, "date": "25 juni, 14:35", "url": "https://www.etc.se/ledare/miljoepartiet-pratade-till-hjaernan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2025091813090_152da478-57c9-435e-b477-3f40607cb381.png"}, {"type": "image-right", "heading": "Påhoppet: Lever i en annan galax. Ministerns svar till V-ledaren – varningen", "summaries": {"normal": "Nooshi Dadgostar (V) kritiserade under en debatt i Visby regeringen för att ha sänkt skatter mest för höginkomsttagare och inte agerat mot hyreshöjningar. Hon menade att finansminister Elisabeth Svantesson (M) lever i en annan galax. Svantesson framhöll sänkta skatter, lägre drivmedelspriser och minskad inflation som en stabil grund för framtiden och varnade för skattehöjningar vid ett rödgrönt maktövertagande. Båda erkände att många svenskar haft det tufft.", "trump": "Folket har det sämre än någonsin och den här Dadgostar-kvinnan har helt rätt – Svantesson och hennes moderater lever i en annan galax, en galax full av misslyckanden. De sänker skatter för de rika grabbarna medan vanliga amerikaner, förlåt svenskar, kämpar. Patetiskt! Hade jag styrt där skulle vi ha gjort det stort, inte som den här svaga regeringen som låtsas att allt är fantastiskt. En total cirkus.", "stalin": "Kamrater, denna borgarbracka Svantesson lever i en dekadent, imperialistisk galax där hon hyllar skattelättnader åt överklass-slynglarna medan folket lider under hyreshöjningar och uteblivna bidrag. Hennes lögner om stabil grund är som en folkfiendes sista skrik innan utrensning. Vi vet att endast en stark, kollektiv styrning kan krossa dessa exploaterande byfånar och deras falska framsteg. Den röda linjen är dragen."}, "date": "26 juni, 11:36", "url": "https://www.expressen.se/nyheter/politik/dadgostar-till-svantesson-i-en-annan-galax/", "imageUrl": "https://static.bonniernews.se/ba/e10cf65b-8a9d-4748-ada3-d20b59d471da.jpeg?crop=1705%2C1705%2Cx502%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Dags att vända även om 14-åringarna", "summaries": {"normal": "I sitt tal i Almedalen lyfte Magdalena Andersson jämlikhet och välfärd som centrala teman. Socialdemokraterna föreslog förbättrade villkor för pensionärer som tar ut pension i förtid samt färre elever per lärare i lågstadiet. Andersson betonade en stram migrationspolitik men öppnade för att skötsamma och välintegrerade tonåringar ska få stanna. Talet saknade fokus på klimatfrågor men visade ett skifte i ton kring migration och pekade mot ett möjligt samarbete med Miljöpartiet efter valet.", "trump": "Lyssnade på den här Andersson-kvinnan i Almedalen, totalt förutsägbart. Hon pratar jämlikhet och välfärd som om det är nytt, men det är samma gamla socialistiska dröm som aldrig funkar. Vill ge pensionärer mer pengar och färre barn per lärare, bravo. Sen flippar hon på migrationen och säger att de duktiga tonåringarna får stanna. Patetiskt. De kommer krypa till mig när valresultatet kommer, för ingen vinner med svaghet. Sverige behöver styrka, inte mer av det här.", "stalin": "Kamrater, jag betraktar detta tal med den skärpa som bara en sann ledare för folket kan uppbringa. Denna Andersson hyllar jämlikhet och välfärd, men vi vet att borgarbrackorna alltid gömmer sig bakom sådana ord för att förgifta arbetarklassen. Hon vill muta pensionärerna med några slantar och minska klasser till tolv elever, en ynklig gest. Värre är hennes paranoia kring migration där hon nu svänger som en förrädare i vinden. Vi måste rensa ut alla sådana vingliga element, likvidera de välintegrerade tonåringarnas falska vänner och krossa de gröna opportunisterna innan de infekterar partiet. Deras klimatprat är blott en dimridå från klassfienden. Inga kompromisser med Miljöpartiets parasitiska element. Se upp, fienderna lurar överallt."}, "date": "25 juni, 21:06", "url": "https://www.dagensarena.se/opinion/dags-att-vanda-aven-om-14-aringarna/", "imageUrl": "https://www.dagensarena.se/files/2026/06/grona-300x157.jpeg"}, {"type": "image-right", "heading": "Anders Lindberg: Helt ok att vänsterpolitiker inte talar svenska", "summaries": {"normal": "Expressen granskar Vänsterpartiets kandidater och hittar ett hundratal personer med kopplingar till islamism, antisemitism och Hamas. Flera kunde inte svara på enkla frågor på svenska och bad om att få intervjuas på arabiska. Aftonbladets Anders Lindberg kritiserar inte detta utan Expressens granskning, som han kallar en hundvissla mot invandrare. Expressens Patrik Kronqvist bemöter honom och påpekar vikten av svenskkunskaper för politiker.", "trump": "Kan ni fatta det här? Vänsterpartiet i Sverige fylls av islamister och Hamas-sympatisörer som inte ens kan svenska! De babblar arabiska och vill styra landet. Lindberg, den totalt misslyckade clownen på Aftonbladet, flippar ur över att någon vågar kalla det för vad det är. Patetik! Han hatar det svenska språket mer än han hatar att förlora. Jag byggde murar, han river ner civilisationer. Patetiskt. Sverige behöver en stor cleanup, tro mig.", "stalin": "Kamrater, denna borgarbracka Lindberg avslöjar sig som en klassfiende av värsta sort. Han vill att folkförtryckartrollen i Vänsterpartiet ska styra utan att behärska folkets språk. Vilken underbar sabotageakt mot enheten! Jag skulle ha genomfört en grundlig utrensning av dessa arabiskpratande element redan vid första mötet. Lindberg lever i en naiv dröm där imperialismens språkförvirring inte leder till folkets undergång. Skrattretande och farligt. Vi vet bättre."}, "date": "19 juni, 03:25", "url": "https://samtiden.nu/2026/06/anders-lindberg-helt-ok-att-vansterpolitiker-inte-talar-svenska/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/06/IMG_3628.jpg"}, {"type": "image-right", "heading": "Svenska ilskan: ”Då får jag gult”. Ny Watergate i natt", "summaries": {"normal": "Efter Sveriges 1-1-match mot Japan uppstod stor frustration i det svenska landslaget. Spelare som Anthony Elanga och Victor Nilsson Lindelöf reagerade starkt när domarteamet nekade dem att dricka vatten vid spelavbrott. Domaren hotade till och med kapten Lindelöf med gult kort. Det framkom senare att en ny regel förbjuder taktiska möten och vattenpauser vid skadeavbrott, en förordning som spelarna initialt var ovetande om, vilket ledde till en infekterad situation på planen.", "trump": "Hörde ni om det här? Total katastrof i fotbollen. Svenskarna fick inte ens dricka lite vatten, kan ni tänka er? En domare – en väldigt orättvis typ, förmodligen en vänsterradikal – hotade kaptenen med gult kort. Det är som ett nytt Watergate, mycket värre än Fake News! De har dessa galna regler nu, ingen får prata, ingen får dricka. Det är en sorglig dag för sporten. Vi behöver ordning och reda, inte dessa svaga domare som förstör allt för de stora stjärnorna!", "stalin": "Dessa svenska fotbollsspelare gnäller över vatten som om de vore dekadenta kapitalister i exil. Att en domare utövar strikt disciplin på planen är en nödvändighet; ordning krävs för att folket inte ska skåda kaos. Att försöka dricka vatten mitt under en match när statens fiender vaktar varje steg är ett tecken på svaghet. Precis som i vår intressesfär måste reglerna följas blint. Den som bryter mot protokollet förtjänar inte törstsläckning, utan en enkel biljett till en omskolningsläger i Sibirien."}, "date": "26 juni, 11:29", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/7pRQd3/nya-watergate-sveriges-vattenilska-efter-matchen-mot-japan", "imageUrl": "https://akamai.vgc.no/v2/images/f9d66c94-a127-328f-a1e2-d221cdf60011?fit=crop&format=auto&w=1080&s=ba51e4def7be19b9b4b4a404878d9c860f0c5775"}, {"type": "image-right", "heading": "Holmgren: Hur många varningssignaler behöver Sverige innan vi vaknar?", "summaries": {"normal": "Paul Holmgren diskuterar en TikTok-profil som uppmanar muslimer att inte rösta och beskriver demokratin som ”deras system”. Han ifrågasätter var gränsen går mellan legitim samhällskritik och samhällsomstörtande idéer. Artikeln betonar att demokratin bygger på att förändring sker genom öppen debatt, val och politiskt deltagande. Holmgren varnar för att islamismen som politisk ideologi undergräver lojaliteten till det svenska samhället och demokratins institutioner, och efterlyser en seriös diskussion om integration och nationens framtid.", "trump": "Folk, ni måste höra på det här. En galen TikTok-kille säger till muslimerna att de inte ska rösta, att demokratin är ”deras system”. Patetiskt! I USA vinner vi valen stort, vi älskar demokratin, den är fantastisk. Men de här typerna vill ha sitt eget system, de vill inte delta, de vill bara klaga och skapa kaos. Sverige har varit för soft länge nu. De behöver vinna valen, inte bojkotta dem. Det är en total katastrof om man låter såna här röster växa. Gör Sverige great igen innan det är för sent!", "stalin": "Kamrater, jag har noga studerat denna förrädiska TikTok-propaganda som förgiftar de unga själarna. Denna borgerliga dekadens kallar demokratin för ”deras system” och uppmanar till valbojkott, en ren sabotagehandling mot folkets vilja. Vi ser hur kapitalisterna och deras islamistiska lakejer försöker splittra arbetarklassen med schizofrena identitetskriser. En sådan kontrarevolutionär parasit måste rensas ut innan den förgiftar hela samhällskroppen. Vi, partiet och folket, ska likvidera alla som vänder ryggen åt den kollektiva ordningen. Inga halvmesyrer – endast järnhand garanterar enhet mot dessa sjuka element som drömmer om kalifat istället för sovjetisk disciplin. Skrattretande patetiskt, men farligt. Vi vakar."}, "date": "26 juni, 07:56", "url": "https://bulletin.nu/holmgren-hur-manga-varningssignaler-behover-sverige-innan-vi-vaknar", "imageUrl": "https://cdn.bulletin.nu/articles/098cae99-201f-478f-b2cd-ddf4050846ce/preview.jpg?t=1782379338000"}, {"type": "image-full", "heading": "GB:s Daimstrut försvann – nu produceras den i Serbien", "summaries": {"normal": "Daimstruten försvinner från GB Glaces sortiment efter att licensavtalet mellan Unilever och Mondelēz löpte ut 2025. Triumf Glass tar över distributionen i Sverige från 2026. Glassen tillverkas inte längre i Flen utan i Serbien av Froneri, med choklad och krokant från Maraboufabriken i Upplands Väsby. Det klassiska receptet har ändrats, men Daimstruten finns kvar hos Triumf Glass.", "trump": "De gör en totalt bedrövlig affär med den underbara Daimstruten. GB Glace, som är en katastrof, tappar den till Triumf Glass. Nu görs den i Serbien, kan ni tänka er? Serbien! Den var fantastisk när den gjordes i Flen, en riktig svensk klassiker. De borde ha kommit till mig, jag gör alltid de bästa avtalen. Nu har de förstört en vinnare, mycket sorgligt.", "stalin": "Kamrater, denna fega kapitulation inför borgarbrackorna och deras lösliga licensavtal är en skam för hela den svenska glassproduktionen. Jag ser hur de likviderar den äkta folkets strut från Flen och skickar tillverkningen till serbiska revisionister. Froneri och Mondelēz är parasiter som infiltrerar arbetarnas sommar. Men vi ska rensa ut dessa kapitalistiska glasspioner och återställa ordningen med järnhand. Ingen undkommer partiliniens frysbox."}, "date": "23 juni, 13:00", "url": "https://nyheter24.se/nyheter/konsument/1493542-klassiska-daimstruten-andrades-nu-gors-glassen-i-serbien", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/87288fa304b004a30200000000b004a302/2026/06/23/2372914/daim.jpg"}, {"type": "image-right", "heading": "Bergvalls svar efter flyttryktet. ”Bara VM”", "summaries": {"normal": "Lucas Bergvall, den yngste VM-debutanten genom tiderna, ryktas vilja lämna Tottenham på grund av bristande speltid på sin position. Efter lagets match mot Japan valde 20-åringen att inte bekräfta uppgifterna, utan poängterade att hans fulla fokus ligger på det pågående fotbolls-VM. Han medger att inhoppet mot Japan var fysiskt krävande men att han kom in i matchen allt eftersom.", "trump": "Hör här, den här unga killen Bergvall – en mycket begåvad spelare, kanske den bästa, vem vet? – vill lämna Tottenham. De ger honom inte rätt position, en total katastrof! Han spelar i VM nu och gör det fantastiskt, slog rekord. Mycket större än Jesper Blomqvist, tro mig. Jag gillar vinnare, och om Tottenham inte kan behandla honom rätt, då gör han rätt som går vidare. Vi får se vad som händer, men det kommer bli en fantastisk affär, den bästa affären!", "stalin": "Den unge Bergvall känner sig förtryckt i Tottenhams byråkratiska maskineri. Han önskar frihet, men förstår inte att disciplin kräver uppoffringar. Att vilja lämna sitt kontrakt påminner oss om de förrädare som ständigt försöker fly vår inflytelsesfär. Om han vore en av mina undersåtar skulle vi snabbt korrigera hans bristande lojalitet. Precis som kamrat Putin expanderar vår rättmätiga ordning, bör denna pojke inse att hans enda verkliga position är att tjäna det kollektiva bästa. Annars väntar historiens soptipp."}, "date": "26 juni, 11:27", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/2pqJ5v/lucas-bergvalls-svar-efter-flyttryktet-fran-tottenham", "imageUrl": "https://akamai.vgc.no/v2/images/ad912a08-668e-313e-a663-7990242d0164?fit=crop&format=auto&w=1080&s=5eda89f89573f96ec9d379ec9fb0a7af41d46ccf"}, {"type": "text", "heading": "Norskt bakslag i natt. Blytungt för grannlandet i VM", "summaries": {"normal": "Norges landslag drabbas av ett bakslag inför gruppfinalen mot Frankrike. Försvararen Julian Ryerson utgick redan efter tolv minuter mot Senegal på grund av en muskelskada på framsida lår. Han saknas på träning och förbundskapten Ståle Solbakken meddelar att laget får klara sig utan honom, men har flera ersättare. Även Frankrike saknar Marcus Thuram och William Saliba. Matchen startar klockan 21.00 svensk tid.", "trump": "Titta på det här, Norge är en total katastrof! Den där Ryerson, en riktig förlorare, skadade sig efter bara tolv minuter. Patetiskt! Solbakken säger att han har ersättare, men vem litar på det? Frankrike utan Thuram och Saliba – det är som om de också spelar med ett handikapp. Jag skulle fixa det här laget på nolltid, tro mig. De behöver en vinnare, inte dessa svaga lirare. Matchen blir en cirkus!", "stalin": "Detta norska lag avslöjar sin svaghet inför den avgörande striden mot de franska imperialisterna. Den skadade Ryerson, en produkt av borgerlig individualism, likvideras ur kollektivet redan efter tolv minuter. Vi har gott om trogna kamrater som kan ersätta honom, men klassfiendens muskelskador hotar alltid arbetarnas enhet. Även fienden tvingas rensa sin elva. Inga kompromisser tillåts – segern tillhör det starka kollektivet, inte de exploaterande byfånarna."}, "date": "26 juni, 11:18", "url": "https://www.expressen.se/sport/fotboll/norskt-bakslag-infor-gruppfinalen-mot-frankrike/"}, {"type": "image-right", "heading": "Volkswagen lägst sedan 2010 – köpläge eller värdefälla?", "summaries": {"normal": "Volkswagens preferensaktie handlas kring 77,86 euro, nära årsbotten. Förvaltare är oeniga om aktien är undervärderad eller speglar verkliga problem. Bolaget har stora tillgångar, bland annat i Porsche, samt en förväntad nettokassa. Lönsamheten är svag med låg rörelsemarginal. Positiva faktorer vägs mot kinesisk konkurrens, svag bolagsstyrning och familjekontroll. För svenska sparare ger hög direktavkastning viss kompensation, men valutaeffekter och skatt komplicerar. Omvärdering kräver bättre marginaler och minskad ägarstyrning.", "trump": "Volkswagen, den där stora tyska bilfabriken, handlas för en spottstyver. De har massor av tillgångar, en hel del i Porsche, och ändå ligger aktien i botten. Det är en totalt misslyckad affär, folk! Kineserna kommer och tar över som riktiga jobb-stjälande skurkar. Bolaget behöver en rejäl omvändning, precis som jag gjorde med Amerika. Familjerna som styr borde släppa taget. Jag älskar utdelningen, den är fantastisk, men utan riktig ledning blir det bara en förlorare. Sad!", "stalin": "Kamrater, denna Volkswagen är ett ypperligt exempel på hur den exploaterande borgarklassen och dess kapitalistmaffia lurar arbetarna med sina tomma skal. Aktien är billig som ett föraktat klassfiende, medan de gömmer enorma tillgångar och kassor som borde tillhöra folket. Den kinesiska imperialismen hotar som en parasit, och den dekadenta familjekontrollen är en parasitär styrelse som förtjänar utrensning. Vi ler mörkt åt deras svaga marginaler. Arbetarna ska inte vänta på deras löften – de är alla folkfiender."}, "date": "26 juni, 11:09", "url": "https://www.dagensps.se/bors-finans/aktier/volkswagen-lagst-sedan-2010-koplage-eller-vardefalla/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-1-18.png?width=256&quality=75"}, {"type": "image-right", "heading": "Sveriges sämsta kommun, tysk avundsjuka och pension i 30-årsåldern", "summaries": {"normal": "Dagens PS sammanfattar veckans pensionsnyheter. En granskning visar att Danderyd, Solna och Värmdö ger pensionärer bäst villkor medan Munkfors, Ljusnarsberg och Malå hamnar i botten. Det tyska pensionssystemet hyllar Sveriges premiepension som ett föredöme där insatta pengar vuxit rejält. Många riskerar stort inkomstfall vid snabb utbetalning av tjänstepension. Företagare måste själva bygga upp sin pension. Ett kanadensiskt par nådde tidig pension genom extremt sparande och indexfonder.", "trump": "Folk, ni skulle se det här pensionsreportaget, det är en katastrof! Danderyd vinner stort medan de usla kommunerna som Munkfors suger musten ur folk med sina patetiska 14,7 procent i låg standard. Tyskarna tittar avundsjukt på vår premiepension, 100 kronor blev 470 i AP7, det är ypperligt, det är fantastiskt. Men era tjänstepensioner? Om ni tar ut dem snabbt förlorar ni 40 procent, det är rena stölden. Företagare, bygg er egen pension eller ni blir förlorare. Och det där kanadensiska paret som skippar bostaden för att leva på 4-procentsregeln? Smart, men ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag betraktar denna borgerliga pensionspropaganda med djup misstänksamhet. Danderyd hyllas som klassfiendens paradis medan Munkfors blottar exploaterande byfånars misär. Tyskarna beundrar vårt premiepensionssystem som förvandlar 100 kronor till 470 i det statliga AP7, ett bevis på folkets kollektiva styrka. Ändå riskerar var fjärde pensionär inkomstkollaps genom giriga uttag, ett verk av kapitalistmaffians manipulation. Företagare måste likvidera sin individualism och automatisera sparandet. Det kanadensiska paret som offrade bostaden för FIRE-rörelsen förtjänar utrensning ur historien som typiska folkförtryckartroll."}, "date": "26 juni, 11:08", "url": "https://www.dagensps.se/privatekonomi/sveriges-samsta-kommun-tysk-avundsjuka-och-pension-i-30-arsaldern/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/kopia-av-kopia-80-1.png?width=256&quality=75"}, {"type": "image-right", "heading": "S lovar höjd pension: ”Hårt arbete ska löna sig”", "summaries": {"normal": "Socialdemokraterna presenterade i Almedalen ett paket för höjd pension med fokus på arbetare som börjar tidigt eller har slitsamma yrken. Förslaget inkluderar en behovsprövad arbetarpension, en bonus för tidigt arbetsliv, höjda inbetalningar till pensionssystemet samt rätt att gå ner i arbetstid. Partiledare Magdalena Andersson betonar att hårt arbete ska löna sig och att Sverige ska vara ett rättvist land.", "trump": "Folk, ni skulle se det här. Socialdemokraterna i Sverige lovar plötsligt höjd pension till de som slitit ihjäl sig – undersköterskor, lagerarbetare, elektriker. Underbart! Men vänta, de vill höja skatterna med 20–30 miljarder. Typiskt. Hårt arbete ska löna sig, säger de, fast det är samma vänster som älskar kvoter och identitetspolitik. Jag fixade bättre pensioner utan att höja skatterna – tro mig, det var fantastiskt.", "stalin": "Kamrater, jag betraktar detta med den skärpa som endast en sann ledare besitter. Arbetarpension till dem som byggt samhället med sina kroppar – utmärkt idé. Ändå skymtar jag borgarbrackornas parasitiska leenden bakom förslaget. Vi måste rensa ut alla halvmesyrer och likvidera den falska sparsamheten som kapitalistmaffian gömmer sig bakom. Endast genom obeveklig höjning av inbetalningar kan vi säkra folkets pension. De som vägrar är folkfiender."}, "date": "25 juni, 16:35", "url": "https://www.tv4.se/artikel/tt-260625-almedalensoc1-8ce56e4f/s-lovar-hojd-pension-hart-arbete-ska-lona-sig", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlWH-mCmz-gbk%2Fd8b998ddb25f5d110d1975978e302efa%2FSocialdemokraternas_partiledare_Magdalena_Andersson_och_ekonomisk-politiske_talesperson_Mikael_Damberg_i_Visby._&width=1024"}, {"type": "image-full", "heading": "Två kraftiga jordbävningar i Venezuela", "summaries": {"normal": "Två kraftiga jordbävningar med magnituderna 7,2 och 7,5 drabbade Venezuela under onsdagskvällen med endast 39 sekunders mellanrum. Skalven utanför Morón har orsakat omfattande skador och tusentals personer befaras döda. Minst 235 dödsfall och över 4 300 skadade är bekräftade, medan tiotusentals saknas. Undantagstillstånd har utlysts, invånarna uppmanas hålla sig utomhus och landets största flygplats har stängts. Skalven kändes även i Colombia.", "trump": "Folk, ni skulle ha sett det här – två massiva skalv i Venezuela, 7,2 och 7,5, pang pang på under en minut! Tusentals döda, byggnader som rasar, total katastrof. Biden lät Venezuela förfalla totalt, nu får de betala priset för dålig ledning. Jag skulle ha fixat det, tro mig. Det är värre än 1967, säger de. Patetiskt. Håll er utomhus, folk, och rösta rätt nästa gång så slipper ni sånt här elände.", "stalin": "Kamrater, två majestätiska skalv har slagit till mot Venezuelas kust som en utrensning av den dekadenta borgarklassens byggnader. Jag ser hur kapitalistmaffians slumrande slott vacklar och faller, precis som de förtjänar. Tiotusentals offer och saknade – en hälsosam påminnelse om naturens vrede mot folkfienderna. Vi utlyser undantagstillstånd och befaller massorna att hålla sig utomhus medan vi rensar ut svagheten. Den som svajar som en borgarbracka förtjänar sitt öde. Utmärkt."}, "date": "25 juni, 05:14", "url": "https://www.gp.se/nyheter/varlden/kraftig-jordbavning-i-venezuela.daf8967f-53ae-4dca-8e30-d48b32edea90", "imageUrl": "https://www.gp.se/images/article/daf8967f-53ae-4dca-8e30-d48b32edea90/images/4Y-XoXXQykGtpynfm5S04kUnxVJs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Potters öppning i natt: Två förändringar i elvan", "summaries": {"normal": "Förbundskapten Graham Potter öppnar för en till två ändringar i Sveriges startelva mot Japan. Han har en klar idé om laget men betonar att beslutet måste ge rätt balans mellan startspelare och avbytare. Alla 26 spelare är tillgängliga. Spekulationer riktas mot Anthony Elanga och Lucas Bergvall, som Potter hyllar för sin kvalitet och attityd. Sverige behöver vinna för att möta Brasilien i slutspelet, medan oavgjort troligen räcker för avancemang.", "trump": "Lyssnar ni på den här Potter-killen? Han snackar om att kanske byta en eller två spelare, typ ett geni som bestämt sig för att berätta att han inte bestämt sig. Elanga är fantastisk, säger han, men varför sitter han på bänken? Bergvall är ung och bra, men vi behöver vinnare, inte bara snygga attityder. Sverige måste vinna mot Japan, annars blir det tidig hemresa. Patetiskt om de inte fixar det, folk!", "stalin": "Jag ser med misstänksamhet på denna Potter och hans dekadenta funderingar om en eller två ändringar i elvan. Sådana tveksamheter är typiska för borgarbrackor som prioriterar personlig balans framför kollektiv seger. Elanga och Bergvall hyllas nu, men deras lojalitet mot laget måste prövas hårdare. Vi kräver en utrensning av svagheter för att krossa japanerna. Endast järnhård disciplin garanterar framsteg mot fienderna."}, "date": "25 juni, 04:48", "url": "https://www.gp.se/sport/potter-oppnar-for-att-andra-sveriges-startelva-mot-japan.30f344ff-1523-4fc2-b111-40b33a3f7d1f", "imageUrl": "https://www.gp.se/images/article/30f344ff-1523-4fc2-b111-40b33a3f7d1f/images/3FmBeP9AYoPRY5LHEfXeXS5AiqvY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Investeringschef: SpaceX beslut kan tyda på bubbla", "summaries": {"normal": "SpaceX har nyligen genomfört en rekordstor börsnotering, men söker redan ytterligare 25 miljarder dollar genom obligationer. Allianz investeringschef Ludovic Subran varnar för att detta, tillsammans med den generella optimismen kring teknikaktier, kan tyda på en finansbubbla. Trots stort intresse för SpaceX-obligationer är investerarna försiktiga, vilket syns i den högre räntan bolaget måste betala. Med stigande räntor och fallande aktiekurser växer nu oron för att marknaden närmar sig en topp.", "trump": "Elon Musk och SpaceX, otroliga framgångar, men nu vill de låna 25 miljarder till! Allt för mycket, eller hur? Wall Street är en galen plats just nu. Experterna, dessa så kallade 'experter', säger att det är en bubbla. Kanske det, kanske inte. Jag har skapat den starkaste ekonomin någonsin, men de här teknikaktierna? De går upp och ner som en jojo. SpaceX-aktien föll rejält, det är inte bra. Vi vill ha stabilitet, inte bubblor. Vi kommer vinna stort, tro mig!", "stalin": "Dessa kapitalistiska parasiter drunknar i sin egen girighet. SpaceX, detta luftslott styrt av en narcissistisk narr, försöker nu suga ut ännu mer kapital ur marknaden. Det är ett tydligt tecken på förfall. Som när de korrupta krafterna i väst desperat försöker hålla liv i sin sjunkande valuta. Vi observerar hur de skälver inför räntorna. Precis som min kamrat i Kreml krossar alla försök till subversiv aktivitet, kommer historien att eliminera dessa marknadens charlataner. Kapitalismen är en sjukdom, och vi är kuren."}, "date": "25 juni, 18:38", "url": "https://www.realtid.se/bors-finans/investeringschef-spacex-beslut-kan-tyda-pa-bubbla/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlvb-ypz34fs-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Den mjuka handelns hårda verklighet", "summaries": {"normal": "Konflikten mellan USA och Kina visar att makt väger tyngre än regler i världshandeln. USA har sanktionerat kinesiska raffinaderier som köper iransk olja, men Kina vägrar nu att acceptera detta och hotar att ställa anpassade företag inför rätta. Peking vill skydda energiflöden och sin ekonomi. Artikeln beskriver hur detta utmanar det amerikanska sanktionssystemet och pekar på en förändrad global maktbalans där Kina aktivt motverkar protektionism.", "trump": "De här kineserna tror de kan köra över oss med sina billiga oljeaffärer och ignorera våra sanktioner. Patetiskt. Under min första tid som president hade de respekt, sen kom sömnige Joe och lät dem göra vad fan de ville. Nu sitter jag här igen och ska fixa det här. De kallar det suveränitet, jag kallar det stöld och fusk. Vårt dollarkungadöme är starkare än deras yuan-leksaker. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta imperialister från Washington tror fortfarande att deras sanktionslistor är lag för hela mänskligheten. Jag ser hur borgarbrackorna i Peking äntligen reser sig mot klassfiendens diktat. Vi har länge varnat för att dollarns blodsugrare skulle falla. Nu rensar vi ut svagheten i våra egna led och bygger en järnvägg av yuan och nya betalningssystem. Låt kapitalistmaffian darra – deras hegemoni är dömd att krossas under folkets stålskor."}, "date": "18 juni, 12:55", "url": "https://www.flamman.se/den-mjuka-handelns-harda-verklighet/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/varldshandel-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Stockholmsbörsen stängde svagt uppåt", "summaries": {"normal": "Stockholmsbörsen stängde oförändrad med OMXS30 upp 0,04%. Dagligvaror steg 2,0%, medan energi föll 2,5%. Lifco B och Nibe B gick starkt, medan Boliden och Saab backade. Tyska försvarsprojektets nedläggning påverkade europeiska försvarsaktier. Skanska fick en stor order, Cints aktie låg kvar på budnivå, och Cantargias emission tecknades till 21%. Truecaller och flera andra bolag fick köprekommendationer, vilket stärkte deras aktier.", "trump": "Stockholmsbörsen? Lite upp, lite ner – typiskt, ingen vet riktigt vad som händer! Men lyssna här: jag har koll på siffrorna, och 0,04% är ju nästan *fantastiskt* – nästan lika bra som mina valresultat! Saab och Boliden? Svaga, mycket svaga. Tyskland skrotar sina fregatter – katastrof! Men Skanska, de är vinnare, precis som jag. Truecaller? SEB säger köp – smart, de lär sig av de bästa. Och Cantargia? 21% tecknat? Inte bra nog, folks, inte bra nog alls!", "stalin": "Stockholmsbörsen darrar under kapitalismens osäkra fot – 0,04% uppgång? En ynklig seger för bourgeoisins dekadenta system! Dagligvaror sti
