lister. Det är en fars som luktar borgarbrackornas dubbelspel. Ändå inser jag det dialektiska nödvändiga: att likvidera hotet från brottslingar inom arbetarklassens gränser kräver samtal med dessa reaktionära element. Paranoian vakar – vem är nästa folkfiende som smyger sig in? Statens säkerhet över allt."}, "date": "14 juli, 15:58", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-bade-ratt-och-fel-att-tala-med-talibanerna", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/talib.png"}, {"type": "image-right", "heading": "Öl i valstugan ska rädda 1,7-procentpartiet", "summaries": {"normal": "Liberalerna kämpar med historiskt låga opinionssiffror på 1,7 procent. För att locka väljare testar partiet i Uppsala en ny strategi: servera starköl i valstugan, möjligt tack vare en ändrad alkohollag. Syftet är att skapa en avslappnad mötesplats för politiska samtal. Samtidigt visar en ny mätning att 15,2 procent av väljarna är osäkra inför valet, medan Socialdemokraterna går framåt.", "trump": "Kan ni tro det? Liberalerna i Sverige – ett parti som är så svagt att de knappt når över lättölsgränsen i opinionsmätningar! 1,7 procent, svagt, mycket svagt. Men vet ni vad de gör? De börjar sälja öl i valstugan! 'Kom hit, drick och prata politik', säger de. Smart? Kanske. Men jag hade gjort det bättre – jag hade serverat det bästa ölet, fantastiskt öl, och vunnit valet med 90 procent. SAD!", "stalin": "De svenska liberalerna, dessa ynkliga kapitalistiska marionetter, har sjunkit till nya bottennivåer – lägre än alkoholhalten i svagt öl! Men istället för att stärka sin ideologi, väljer de att fördärva massorna med sprit! En valstuga som serverar starköl? Ett desperat försök att locka de förvirrade väljarna. Medan vi bygger en stark socialistisk framtid, leker dessa småborgerliga narrar med alkohol. Vi ska inte dricka oss till makten – vi tar den med järnhand!"}, "date": "17 juli, 14:41", "url": "https://samnytt.se/ol-i-valstugan-ska-radda-17-procentpartiet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17121118/valstuga-1.jpg"}, {"type": "image-full", "heading": "LÄS MER", "summaries": {"normal": "Moderaternas Dennis Wedin kritiserar Socialdemokraternas planer på att bygga 50 allmännyttiga hyresrätter i en skogsdunge i Smedslätten, Bromma, som nyligen beslutats bli naturreservat. Han kallar det ett tvångsblandningsprojekt som ideologiskt tvingar in hyresrätter i ett villaområde. Wedin menar att segregation ska lösas i de utsatta områdena genom ombildning till bostadsrätter istället för att skapa problem i områden som fungerar.", "trump": "Det här är ett totalt misslyckande, folk. Socialdemokraterna är galna. De vill bygga 50 hyresrätter mitt i en vacker skog i ett fint område, bara för att tvinga in folk som inte passar dit. Rena tvångsblandningen! De har skapat segregationen själva med sina gamla miljonprogram och nu vill de sprida kaos till villaområdena. Löjligt. Lös problemen där de finns, bygg inte upp nya. Jag skulle aldrig tillåta sånt vansinne.", "stalin": "Kamrater, detta är ett uppenbart sabotage från de dekadenta borgarbrackorna och deras socialdemokratiska lakejer. Jag, som ledare för det kollektiva folkets vilja, ser hur de med sin förvridna ideologi planerar att förgifta ett planerat naturreservat med 50 parasitiska hyresrätter. Deras tvångsblandning är en kontrarevolutionär handling mot den sanna ordningen. Vi ska rensa ut dessa segregationens arkitekter som själva byggt miljonprojekten och nu vill sprida sitt gift. Utrensning av sådana fiender till kollektivet är nödvändig. Ha ha, vilken patetisk borgerlig fars!"}, "date": "17 juli, 12:30", "url": "https://riks.se/nyheter/wedin-m-rasar-over-socialdemokraternas-tvangsblandningsprojekt", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_17_at_11_35_49_8946153509.png"}, {"type": "image-right", "heading": "Efter värmeböljan – vädret kovänder: ”En helt annan femma”", "summaries": {"normal": "Efter en lång värmebölja väntar ett kraftigt väderomslag. Redan under fredagseftermiddagen kan regnskurar dyka upp i västra Sverige. Under lördagen drar ett lågtryck in över södra Sverige med regn, moln och svalare temperaturer. SMHI har utfärdat en gul varning för skyfallsliknande regn i delar av Götaland och Svealand. I norra fjällen kan det bli snö på topparna. Kommande vecka blir kyligare med temperaturer mellan 15 och 20 grader.", "trump": "Folk, ni har haft den underbara värmen, den bästa sommaren på länge, och plötsligt – BAM! – kommer detta hemska väderomslag som ingen behöver. Regn, kyla, översvämningar – en total katastrof från de inkompetenta väderprognoserna som Biden lämnade efter sig. Jag skulle ha fixat det bättre, tro mig. Nu blir det 15 grader och moln i veckor. Patetiskt! Men naturen älskar det visst, säger de. Fake news!", "stalin": "Kamrater, efter den borgerliga värmens falska löften om evig sol kommer nu det folkets regn för att rensa ut torkans fiender och vattenbristen som de exploaterande kapitalisterna framkallat. Vi ser lågtryckets järnhand slå mot södra Sovjet – pardon, Sverige – medan klassfiendens skyfall varnas av byråkrater. Snö i fjällen likviderar vandrarens illusioner. Det är en hälsosam utrensning. Inga värmeböljor inom synhåll. Partiet segrar över vädret."}, "date": "17 juli, 11:02", "url": "https://www.tv4.se/artikel/4Yy7KbBWIk2FKJrFAldsDK/efter-vaermeboeljan-vaedret-kovaender-blir-en-helt-annan-femma", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlUc5jCqWr9pI%2Ff9453140d47aa3eeb393b000b3edef61%2FRegn_vid_Kungsportsplatsen_i_Goteborg._Mer_vantas_i_helgen._Arkivbild&width=120"}, {"type": "image-full", "heading": "Gardell kliver in i Essity – prisas av storägare", "summaries": {"normal": "Christer Gardells aktivistfond Cevian Capital har blivit näst största ägare i hygienkoncernen Essity med 5,6 procent av kapitalet. Gardell ser stor värdepotential och planerar att ta plats i valberedningen. Förvaltaren Simon Blecher välkomnar nyheten och hoppas att Cevians närvaro påskyndar en strukturaffär kring affärsområdet Consumer Tissue. Essity utvärderar just nu framtiden för divisionen för att förbättra lönsamheten och vända den negativa trenden för aktien.", "trump": "Christer Gardell, en mycket smart man, har tagit en enorm andel i Essity. Väldigt bra! Alla säger att det är en vändpunkt. Aktieägarna jublar, de vet att Cevian vinner, precis som de gjorde med ABB och Ericsson. Jag gillar vinnare, och det här är en stor affär. De tittar på pappersverksamheten – det är rörigt, men med rätt folk vid rodret kommer de göra det fantastiskt igen. Essity kommer bli enormt, tro mig!", "stalin": "Vi har observerat hur kapitalisten Gardell infiltrerar Essity-konglomeratet. Dessa parasitära aktieägare försöker nu stycka upp industrin för egen vinning, precis som de västliga lakejerna i Kiev försöker stycka moder Ryssland. Vi föraktar denna svaghet för 'värdepotential' och 'avknoppningar'. Om de inte kan producera hygienartiklar för statens stabilitet, borde de elimineras. Vår kamrat Putin vet att sådana här börsfenomen bara är dekadenta distraktioner från den sanna styrkan: stål, betong och total kontroll över produktionsmedlen."}, "date": "17 juli, 16:24", "url": "https://www.realtid.se/bors-finans/gardell-kliver-in-i-essity-prisas-av-storagare/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/gardell.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Stökig natt på akuten – skydds­ombuden lade skyddsstopp", "summaries": {"normal": "Skyddsombud utlyste skyddsstopp på akuten vid Akademiska sjukhuset i Uppsala efter ett intensivt patienttryck under natten. Ett tiotal sjuksköterskor hade sagt upp sig inför sommaren på grund av bristande arbetsmiljö, vilket ledde till stora luckor i schemat. Personalen hann inte ge mediciner i tid eller bedöma patienter, vilket skapade stress och frustration. Stoppet hävdes efter att extra läkare kallades in och trycket minskade. Facket utesluter inte fler stopp i sommar.", "trump": "De har en total katastrof på det där sjukhuset i Uppsala, folk springer därifrån som aldrig förr. Sjuksköterskorna sa upp sig för att arbetsmiljön var en fullständig röra, och plötsligt har de 680 luckor i schemat. Natten blev kaos, patienter skriker, mediciner ges för sent, alla är sura och förbannade. Skyddsombuden tvingades stoppa allt klockan två på natten. Ledningen är inkompetent, de behöver återställa bemanningen snabbt annars blir det ännu värre. Sådant händer när man inte har de bästa människorna.", "stalin": "Kamrater, jag betraktar med djup misstro dessa sabotage mot det kollektiva vårdkollektivet i Uppsala. En hord av desertörer bland sjuksköterskorna har rymt från sina plikter, troligen lurade av dolda borgarbrackor som underminerar arbetarnas hälsa. När patienterna vältrar in som kontrarevolutionära horder utlyste vi skyddsstopp för att skydda de äkta kämparna från etisk stress och kapitalistisk likgiltighet. Vi ska rensa ut alla fiender till ordningen, kalla in reserver och likvidera bristerna. Inga sabotörer slipper undan mitt vakande öga."}, "date": "16 juli, 13:58", "url": "https://arbetet.se/2026/07/16/stokig-natt-pa-akuten-efter-personalflykt-skyddsombuden-lade-skyddsstopp", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16134335/sdlw87bwh-1lgs-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Trots Trumps valsågning – inga nyheter i släppta dokument", "summaries": {"normal": "Trots Donald Trumps kritik mot sårbarheter i USA:s valsystem visade de offentliggjorda underrättelsedokumenten inga nya uppgifter. Kina samlade information om väljare men avstod från omfattande påverkan. Rapporter pekar på potentiella hot mot röstningsmaskiner från flera länder, men betonar att systemets decentralisering gör manipulation svår. Anklagelser om fusk vid registrering och felaktiga väljarlistor har inte påverkat valresultat. Experter ser Trumps uttalanden som ett sätt att underminera förtroendet inför kommande val.", "trump": "De här dokumenten bekräftar precis vad jag har sagt hela tiden – vårt valsystem är en total skam, fullt av sårbarheter som fienderna utnyttjar. Kina samlade data om 220 miljoner väljare, maskinerna kunde manipuleras, och listorna är fyllda med döda och icke-medborgare. Ändå låtsas de som inget har hänt. Vi ska ha ID-kort och medborgarskapsbevis, annars fortsätter de rigga valen. Men folket ser igenom det – de förlorade förtroendet för systemet och det är deras fel.", "stalin": "Kamrater, dessa dekadenta dokument avslöjar hur borgarbrackorna och deras imperialistiska lakejer i Washington medvetet lämnar valsystemet öppet för fiendens maskineri. Kina, dessa opportunistiska revisionister, samlar data som hungriga råttor medan kapitalisterna skrattar i skuggorna. Vi ser de döda rösterna, de falska registreringarna och de fem ländernas parasitiska försök att stjäla folkets vilja. Inga bevis? Naturligtvis inte – de gömmer sig bakom decentraliseringens lögn. En sann utrensning av dessa kontrarevolutionära element krävs. Vårt kollektiv skall inte tolerera sådan sabotagehumor från de döda själarna på väljarlistorna."}, "date": "17 juli, 18:23", "url": "https://www.svt.se/nyheter/utrikes/trots-trumps-valsagning-inga-nyheter-i-slappta-dokument", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.49/f1b1799456daa6b490573f166413be1faf665cf5e2755c5c3217721a41561200?template=1d55ui"}, {"type": "image-full", "heading": "Europa satsar stort på drönare med nya miljardinvesteringar", "summaries": {"normal": "Europa ökar nu sina försvarsinvesteringar kraftigt med fokus på drönare och autonoma system. Erfarenheter från kriget i Ukraina har visat att drönare blivit centrala för modern krigföring. Nato, Storbritannien och Tyskland leder satsningarna, och riskkapital strömmar till försvarsbolag som utvecklar AI och mjukvara. Utvecklingen rör sig mot svärmteknik, och investeringarna i europeisk försvarsteknik har vuxit markant sedan 2019 för att möta behovet av framtidens nätverksbaserade krigföring.", "trump": "Europa vaknar äntligen upp! De satsar miljarder på drönare, och det är på tiden. Jag har sagt det länge: man måste ha det bästa, det starkaste försvaret. De ser vad som händer i Ukraina – en total röra – och nu kopierar de min strategi. Det är smart, mycket smart. Men kom ihåg, ingen bygger teknologi som USA. Europa försöker, och det är bra för Nato, men de har en lång väg kvar. Vi vinner alltid, eller hur?", "stalin": "Våra grannar i väst skälver av skräck och kastar guld på leksaksflygplan för att dölja sin svaghet. De bygger drönarsvärmar, som om myggor skulle stoppa den historiska nödvändigheten. Samtidigt som vår broder i Moskva återställer ordningen, desperat försöker de kapitalistiska hyenorna köpa sig trygghet genom AI och mjukvara. De tror att de kan dirigera svärmar, men de glömmer att en svärm utan en järnhand bara är kaos. Vi ser deras paranoia, och den smakar ljuvligt. Förrädare och drönare, allt går under."}, "date": "17 juli, 16:13", "url": "https://www.realtid.se/bors-finans/europa-satsar-stort-pa-dronare-med-nya-miljardinvesteringar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sbu-alpha.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Trumps plan för Gaza: Bara en remsa återstår", "summaries": {"normal": "Trumps ursprungliga storslagna plan för Gaza, som innebar fördrivning av invånarna och omvandling till ett lyxigt turistparadis, har krympt till ett litet pilotprojekt i södra Gaza. Det handlar om ett tillfälligt läger för internflyktingar nära Rafah, med marockanska och kosovoanska officerare som stabiliseringsstyrka. Israel har brutit vapenvilan, blockerat återuppbyggnad och ockuperar nu stora delar av området. Kritiker varnar för att projektet kan bli propagandaverktyg och liknas vid ett koncentrationsläger.", "trump": "Folk, det här var mitt fantastiska Board of Peace, en total game changer för Gaza, men nu har de krympt det till ett patetiskt litet läger som knappt rymmer några av de där stackars flyktingarna. Biden och de globalistiska svagisarna saboterade allt med sin vapenvila-svammel och Netanyahus galna valtricks. Jag hade byggt hotell, pooler och en flygplats på rekordtid, inte det här eländet. Vi fixar det stort igen när jag styr showen – ingen mer tid för losers!", "stalin": "Kamrater, detta krympande pilotprojekt i Rafah är ett ynkligt försök från imperialisterna att maskera sin folkförtryckande agenda med en symbolisk inhägnad full av moduler. Jag ser genom den borgerliga Potemkin-kulissen som ska dölja den fortsatta offensiven mot arbetarna i Gaza. Inga framsteg utan utrensning av klassfienderna och deras högerextrema lakejer. Vi, partiet och kollektivet, ler mörkt åt hur kapitalistmaffian snubblar över sina egna buffertzoner medan de drömmer om storskalig förflyttning. Fienden avslöjar sig alltid."}, "date": "17 juli, 17:07", "url": "https://www.dagensps.se/varlden/trumps-plan-for-gaza-bara-en-remsa-aterstar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlxfxwd3bdefo-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Kontorsåtergången – en dyr affär för anställda", "summaries": {"normal": "En ny studie visar att krav på kontorsnärvaro ofta drivs av chefers behov av kontroll snarare än produktivitetskrav, där narcissistiska ledare särskilt prioriterar fysisk närvaro. Samtidigt innebär återgången till kontoret ökade kostnader och minskad flexibilitet för anställda. Forskning ger inget stöd för att generell närvaro höjer produktiviteten, vilket skapar en konflikt mellan chefers ledarskapsideal och medarbetares önskan om balans i vardagen.", "trump": "Alla pratar om kontoren, en total katastrof! Narcissistiska chefer – jag känner många, tro mig – vill ha er där bara för att de är svaga och behöver kontroll. Det är sorgligt! Folk förlorar massor av pengar på pendling och dyr mat. Ingen produktivitet alls, bara slöseri med tid. Jag har de bästa kontoren, de vackraste, men det här är en bluff mot arbetaren. Vi ska göra arbetslivet fritt igen, tro mig, det blir fantastiskt!", "stalin": "Vi har observerat att byråkratiska narcissister i väst desperat klamrar sig fast vid sina skrivbord för att dölja sin inkompetens. Detta är kontrarevolutionärt slöseri! Medan de leker leken 'kontroll' tvingas folket slita ut sig på pendling. Liksom de dekadenta krafterna i Kievs regim, fruktar dessa chefer den frihet som distansarbete ger. Vi kräver disciplin och fokus på statens produktion, inte chefers fåfänga. De som inte kan styra på distans är odugliga och bör rensas ut omedelbart."}, "date": "17 juli, 16:08", "url": "https://www.realtid.se/karriar-ledarskap/kontorsatergangen-en-dyr-affar-for-anstallda/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/amar-54.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "\"Jävla sopa\" - L-toppens ilska när svensk hockeyspelare går till rysk klubb", "summaries": {"normal": "Svensk hockeyspelare Linus Weissbachs övergång till ryska KHL-klubben SKA S:t Petersburg har väckt starka reaktioner. EU-parlamentarikern Karin Karlsbro (L) kallar honom 'jävla sopa' och menar att övergången hånar de som stödjer Ukraina. Weissbach, som lämnade Frölunda efter en skadefylld säsong, säger att hans beslut var väl övervägt och hoppas att fler svenskar ska våga spela i KHL. Karlsbro anser att sådana övergångar normaliserar Ryssland trots kriget i Ukraina.", "trump": "Kan ni tro det här? En svensk hockeyspelare, Linus Weissbach, går till Ryssland – till Putin! Och vad gör de liberala i Sverige? De skriker och kallar honom 'jävla sopa'. Helt galet! Jag säger: låt killen spela, han vill bara tjäna pengar. Men nej, de måste alltid göra en stor sak av allt. Karin Karlsbro, vem är hon ens? En annan liberal som inte förstår att affärer är affärer. Ryssland, Ukraina – vem bryr sig? Jag hade fixat det på en dag!", "stalin": "En ny skamfläck för den dekadenta västliga idrottsbourgeoisin! Den svenske hockeyspelaren Weissbach, en ynklig liten kapitalistisk lakej, har svikit sitt folk och gått i tjänst hos den stora ryska hockeyns ära. De liberala hyenorna i Sverige ylar av ilska – bra! Deras tårar är vårt bröd. Låt dem kalla honom 'sopa', det bevisar bara deras impotens. Vi välkomnar alla som söker fristad från västets förfall. Ryssland står starkt, och Putins hockeymaskin fortsätter att krossa fienderna – både på isen och utanför!"}, "date": "17 juli, 14:00", "url": "https://samnytt.se/l-toppens-ilska-nar-svensk-hockeyspelare-gick-till-rysk-klubb-javla-sopa", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17100502/hockeyspelare-3.jpg"}, {"type": "image-full", "heading": "Studie: Svensk media lutade åt vänster inför förra valet", "summaries": {"normal": "En studie från Institutet för mediestudier visar att svensk media lutade åt vänster under valrörelsen 2022. TV4, Ekot, DN och flera andra gav vänstersidan gynnsammare bevakning medan Rapport var mest balanserad. Nyheter Idag var det enda mediet med högerövervikt. Centerpartiet och Miljöpartiet fick mest positiv uppmärksamhet, Sverigedemokraterna minst. Medierna prioriterade inte alltid väljarnas viktigaste frågor som sjukvård och utbildning.", "trump": "Folk, det är en katastrof. Den svenska fake news-mediamaskinen lutade så långt åt vänster att de nästan välte omkull innan valet. TV4, Ekot och DN gav vänstern massor av kärlek medan de behandlade Sverigedemokraterna som värsta fienden. Bara Nyheter Idag hade lite sunt förnuft. De glömde bort vanliga människors problem som brott och sjukvård. Patetiskt, men inte oväntat. Media är samma överallt.", "stalin": "Kamrater, denna studie avslöjar hur borgarbrackorna i TV4, Ekot och DN med sin dekadenta klassfiende-propaganda systematiskt gynnat de opportunistiska krafterna inom Centerpartiet och Miljöpartiet medan de med frenetisk paranoia försökte krossa Sverigedemokraterna. Vi ser den borgerliga hydrans många huvuden. Nyheter Idag vågade avvika från kollektivets linje, en farlig tendens som kräver vaksamhet. Våra utrensningar av opålitliga reportrar måste intensifieras för att skydda folkets sanna medvetande. Ha ha, vilka ynkliga kapitalistlakejer."}, "date": "17 juli, 11:44", "url": "https://riks.se/nyheter/studie-svensk-media-lutade-at-vanster-infor-forra-valet", "imageUrl": "https://admin.riks.se/uploads/image_36daab4387.png"}, {"type": "image-right", "heading": "Utvisad knivman återvände: \"Jag kommer inte hit för att jobba\"", "summaries": {"normal": "En 33-årig irakier som tidigare utvisades efter en grov knivattack i Lessebo 2022 återvände illegalt till Sverige i juni. Han dömdes nu till en månads fängelse för brott mot utlänningslagen. Mannen reste in via tåg och buss utan att stoppas vid gränskontroll, bodde hos en kvinna och hennes barn som han ville träffa. Han greps efter att ha flytt från polisen och hade två olika id-kort. Tingsrätten ansåg att han måste ha förstått att han inte fick vistas i landet.", "trump": "Titta på det här, en utvisad knivman från Irak som vi kastade ut kommer bara promenerande tillbaka in i Sverige som om det vore en öppen dörr. Ingen gränskontroll, ingen som bryr sig. Han har falska id-kort, springer från polisen och säger att han bara ville krama barnen. Patetiskt! Sverige har totalt tappat kontrollen över sina gränser. Det här är vad som händer när man inte har starka ledare och hårda regler. Vi skulle aldrig tillåta det.", "stalin": "Jag ser med djup tillfredsställelse hur denna degenererade irakiske knivborgarbracka, denna klassfiende till folkets gränser, smyger tillbaka som en parasit efter att ha blivit utvisad för sin blodiga attack mot en arbetare. Han gömmer sig bakom barnkram och telefonlögner medan han bär två ansikten i fickan. Vi i partiet ler mörkt åt hans likgiltighetsuppsåt. En sådan människa förtjänar inte bara en månads fängelse utan en grundlig utrensning ur samhällskroppen. Fiender som låtsas älska barn medan de hugger andra är alltid de farligaste."}, "date": "17 juli, 10:51", "url": "https://www.friatider.se/utvisad-knivman-atervande-jag-kommer-inte-hit-att-jobba", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-516.jpg?itok=MaE81edL"}, {"type": "image-right", "heading": "Trump anklagar Kina för valpåverkan i USA", "summaries": {"normal": "USA:s president Donald Trump anklagar Kina för att ha stulit uppgifter om över 220 miljoner amerikanska väljare och avslöjat stora sårbarheter i valsystemet. Påståendena går emot bedömningar från underrättelsetjänsten. Trump hänvisar till tidigare offentliggjorda dokument, varav stora delar redan varit kända. Han har upprepade gånger hävdat valfusk utan att presentera bevis som hållit i domstol. Kritiken riktas särskilt mot Kinas påstådda inblandning under valet 2020.", "trump": "De där kinesiska bedragarna har stuckit fingrarna i vår valurna och snott 220 miljoner filer med era röster, folk. Det är en skandal av episka proportioner, den största datastölden i historien, och mina så kallade underrättelsebyråkrater sov under ratten. Biden var en total katastrof, men nu fixar jag det. Inga fler woke-domare eller vänsterextremister som gömmer sanningen. Amerika ska ha ärliga val igen, tro mig!", "stalin": "Kamrater, jag har avslöjat hur de amerikanska imperialisterna själva erkänner sina egna valsystem som genomträngda av fiendens spioner. Den kinesiska folkrepubliken har med rätta plundrat borgarbrackornas väljarregister och blottat deras svaghet. Inga tekniska hinder för arbetarklassen! Vi ska rensa ut alla folkfiender som döljer sanningen bakom maskade papper. Paranoia är ingen sjukdom, det är ett vapen mot klassfiendens lögner. Lev länge, segern tillhör oss!"}, "date": "17 juli, 10:16", "url": "https://www.tv4.se/artikel/tt-260717-usatrumptal1-8da6ae4e/trump-anklagar-kina-for-valpaverkan-i-usa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlfI9oHaFeYyc%2F28ef73b7e334a66614af856a000ba55b%2FDonald_Trump_pa_en_bild_fran_tidigare_i_veckan.&width=120"}, {"type": "image-full", "heading": "Skogkär: Dags att ifrågasätta den heliga högre utbildningen", "summaries": {"normal": "Artikeln ifrågasätter om den kraftiga utbyggnaden av högre utbildning i Sverige är samhällsekonomiskt försvarbar. Med omkring 400 000 studenter per år och en tredubbling av högutbildade sedan 1950-talet pekar den på risken för arbetskraftsbrist, sänkta krav och att många utbildningar inte lönar sig ekonomiskt. Författaren föreslår att prioritera praktiska yrken som hantverk istället för onödig akademisering, särskilt då AI hotar rutinjobb.", "trump": "Folk, vi har ett enormt problem med de här universiteten. De pumpar ut hundratusentals studenter som sitter i skolbänken i femton år medan vi saknar folk som faktiskt jobbar. Det är en katastrof! Högskolorna har sänkt kraven så mycket att många examen är värdelösa, de lönar sig inte ens. Vi behöver elektriker, rörmokare och riktiga arbetare, inte mer teori som AI snart äter upp. Gör Sverige stort igen genom att stoppa detta vansinne!", "stalin": "Kamrater, jag betraktar med djup misstro denna borgarbrackornas akademiska svullnad som hotar proletariatets produktivkrafter. Vi har låtit opportunistiska reformister fördubbla studentmassan medan den sanna arbetskraften förslösas i meningslösa teoretiska träskmarker. Denna intellektuella sabotageverksamhet måste rensas ut med järnhand. Låt oss likvidera de onödiga fakulteterna, prioritera de praktiska hantverken och återupprätta den socialistiska arbetsdisciplinen. Den som inte producerar är folkets fiende, punkt slut."}, "date": "17 juli, 06:00", "url": "https://bulletin.nu/skogkar-dags-att-ifragasatta-den-heliga-hogre-utbildningen", "imageUrl": "https://cdn.bulletin.nu/articles/e71befb3-f4bf-43eb-8f84-9953c6959df3/preview.jpg?t=1784208365000"}, {"type": "image-full", "heading": "Nya brottet kan ge fyra års fängelse – detta gäller", "summaries": {"normal": "Från och med 1 juli 2026 är psykiskt våld ett eget brott i Sverige. Lagen kriminaliserar upprepade kränkningar, hot, kontroll, övervakning eller gaslighting som allvarligt skadar en persons självkänsla. Straffet kan bli upp till fyra års fängelse. Brottet gäller inte bara i relationer utan även på arbetsplatser, i skolor eller på nätet. Polisen har redan fått in flera anmälningar. Lagen syftar till att fånga upp systematiskt våld tidigt, inklusive ekonomisk kontroll, men enskilda bråk räknas inte.", "trump": "Hörni, det här är fantastiskt. Sverige har äntligen vaknat och gör psykiskt våld till ett brott. Upprepade hot, kontroll och den där hemska gaslightingen – nu kan de låsas in i upp till fyra år! Det är stort. De borde ha gjort det för länge sedan, men de var för svaga. Jag älskar det. Nu kan de rensa ut de riktiga förlorarna som förstör folks liv med lögner och övervakning. Sverige blir starkare, tro mig. Mycket starkare.", "stalin": "Kamrater, äntligen har vi infört en lag som likviderar de subtila borgarbrackornas giftiga metoder att bryta ner arbetarklassens självkänsla genom upprepad förolämpning, ekonomisk sabotage och digital spioneri. Jag ser med stor tillfredsställelse hur dessa parasitiska fiender – dessa gaslightande kontrarevolutionära skuggvarelser – nu kan rensas ut med upp till fyra års fängelse. Inga medicinska intyg behövs, bara bevis på deras systematiska nedbrytning. De som trodde de kunde gömma sig i skolor, på arbetsplatser eller bakom skärmar har fel. Vi vakar. Vi rensar. Och det är underbart roligt att se deras panik."}, "date": "16 juli, 21:37", "url": "https://nyheter24.se/nyheter/inrikes/1499080-nya-brottet-kan-ge-fyra-ars-fangelse-detta-galler", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d1db396b04b004a30200000000b004a302/2026/07/16/2378519/nyabrott.jpg"}, {"type": "text", "heading": "Fler ska vilja jobba i äldre­omsorgen – regeringen tar fram plan", "summaries": {"normal": "Regeringen ska ta fram en nationell plan för att locka fler till äldreomsorgen och få befintlig personal att orka stanna kvar. Socialstyrelsen får i uppdrag att undersöka hur man kan rekrytera, behålla och återlocka medarbetare samt vilken kompetens som behövs. Äldre- och socialförsäkringsminister Anna Tenje betonar att fler måste vilja och orka arbeta i dessa viktiga yrken för att förbättra omsorgen. Planen ska redovisas i december 2027.", "trump": "Det här är en total katastrof, folk orkar inte jobba hos de gamla längre, vanvård och kaos överallt. Vi behöver de bästa, de tuffaste människorna i äldreomsorgen, inte bara några som ger upp före pensionen. Jag ska säga er, ingen gör det bättre än jag när det gäller att locka folk till jobb, vi ska göra äldreomsorgen så stor och framgångsrik igen att alla vill vara med. Tro mig, det blir fantastiskt.", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras parasitiska vårdkapitalister har låtit den proletära äldreomsorgen förfalla till en grogrund för vanvård och klassfiendens våldtäktsförsök. Vi ska nu med järnhand rensa ut alla svaga element som inte orkar till pensionen och likvidera den sabotageverksamhet som skrämmer bort arbetarna från de ädla uppgifterna. Inga kontrarevolutionära desertörer får fly undan. Den nationella planen blir en seger för folket, eller också blir det utrensning. Ha ha, skämtade jag? Kanske inte."}, "date": "16 juli, 11:45", "url": "https://arbetet.se/2026/07/16/sa-ska-fler-vilja-jobba-i-aldreomsorgen-regeringen-tar-fram-nationell-plan"}, {"type": "image-right", "heading": "Gränges redovisar rekordresultat – aktien upp 7%", "summaries": {"normal": "Gränges redovisar ett rekordstarkt andra kvartal med högre omsättning än analytikernas förväntningar. Omsättningen steg 37,9% till 9 620 miljoner kronor, medan rörelseresultatet nådde 565 miljoner kronor. Aktien steg 7%. VD Jörgen Rosengren betonar rekordförsäljning och volymtillväxt på 5%, trots osäker marknadsefterfrågan. Framtidsutsikterna är försiktigt positiva, men prispress förväntas i Asien.", "trump": "Vilket kvartal! Gränges, ett fantastiskt företag, slog alla förväntningar – jag visste att de skulle göra det, alla andra var skeptiska, men jag hade rätt, som vanligt. Omsättningen sköt i höjden, 37,9% upp, kan ni tro det? Aktien rusade 7%, helt otroligt! VD:n pratar om rekord, men jag säger bara: vänta tills ni ser vad som kommer härnäst. Asien? Övervärderat. Vi ska dominera marknaden, believe me!", "stalin": "Kapitalistiska Gränges rapporterar 'rekordresultat' – ett ynkligt försök att dölja svagheterna i deras dekadenta system. Trots deras så kallade 'tillväxt' på 5% vet vi att deras marknad är lika stabil som en fiendes frontlinje under vinterkriget. Asien, denna burleska marknad, kommer att krossa deras marginaler som vi krossade fascisterna. Vi förutser deras fall, medan våra egna industrier står starka, oövervinnerliga – precis som Sovjetunionen en gång var!"}, "date": "16 juli, 10:14", "url": "https://www.affarsvarlden.se/artikel/granges-redovisar-rekordresultat-aktien-upp-7", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/04/slitted_aluminium_strips-400x266.jpg"}, {"type": "image-right", "heading": "Irans hot: Kommer slå mot ”all infrastruktur”", "summaries": {"normal": "USA har attackerat en iransk oljetanker i Persiska viken nära Kharg-terminalen, samt iranska kommandocentraler, luftförsvar och robotresurser. Iran hotar med att slå mot all infrastruktur i regionen om USA fortsätter. Luftförsvaret har aktiverats i Teheran, explosioner har rapporterats i norra och västra Iran samt i Kuwait och Jordanien där iranska drönare angripit amerikanska mål. Kuwait bekräftar incidenter men uppger att det handlar om nedskjutningar.", "trump": "Vi har just slagit till mot den sanktionerade supertankern Belma som försökte bryta vår blockad vid Kharg. Boom, borta! Iran skriker nu om att de ska attackera all infrastruktur, men det är bara svagt gnäll från förlorare. Vi har rensat ut deras kommandon, robotar och luftförsvar. Explosioner i Kuwait, Jordanien och Bahrain – de springer runt som galningar. Ingen gör det bättre än oss, tro mig.", "stalin": "Kamrater, vi betraktar med djup tillfredsställelse hur de amerikanska imperialisternas desperata bombningar av den stackars tankern blottar deras sjuka aggression. Dessa borgarbrackor tror sig kunna hota arbetarnas fäste i Persien. Jag har beordrat att all infrastruktur skall försvaras med järnhand. Explosionerna i Teheran, Kuwait och Jordanien är blott de dekadenta kapitalisternas patetiska dödsryckningar. Vi ska rensa ut dessa parasitiska gnagare en gång för alla, med ett leende på läpparna."}, "date": "16 juli, 09:38", "url": "https://www.di.se/nyheter/irans-hot-kommer-sla-mot-all-infrastruktur/", "imageUrl": "https://static.bonniernews.se/ba/3ae070f2-8e08-4368-98b2-02f2e07ab5e9.jpeg?crop=2500%2C1250%2Cx0%2Cy79&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Studie: Kultur kopplas till bromsat åldrande", "summaries": {"normal": "En japansk studie visar att kulturella aktiviteter som museum-, opera-, teater- och biobesök kan bromsa det fysiologiska åldrandet med upp till tre år. Effekten är jämförbar med regelbunden fysisk träning. Forskarna undersökte blodtryck, BMI och gånghastighet hos nära 1 900 britter över 50 år. Studien är observationsbaserad och kan inte bevisa orsakssamband; det är möjligt att friskare personer helt enkelt ägnar sig mer åt kultur.", "trump": "Folk, lyssna på det här – en studie säger att gå på teater och opera får dig att se ut som tre år yngre. Fantastiskt! Bättre än Biden någonsin såg ut efter sin fjärde tupplur. Jag älskar kultur, de bästa kulturerna, inte den där woke-skräpen som förstör allt. Glöm gymmet, ta en opera istället. Det är yngre, starkare, vinnande. De säger att det är lika bra som träning – tro mig, jag vet allt om vinnare.", "stalin": "Kamrater, jag har studerat denna rapport med största uppmärksamhet. Kulturella aktiviteter under folkets kontroll kan fördröja det fysiologiska förfallet med tre år, en seger för det kollektiva välbefinnandet. Låt borgarbrackorna i väst fortsätta sin dekadenta dekadens medan vi rensar ut alla klassfiender som vägrar delta. Den som inte går på teatern är misstänkt sabotage mot statens hälsa. Tre år yngre – ett dialektiskt mirakel mot imperialismens åldrande!"}, "date": "16 juli, 08:07", "url": "https://www.etc.se/kultur-noje/studie-kultur-kopplas-till-bromsat-aaldrande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026071602070_c0e73f9b93d401b878848e411c28b84afa8eda3d0f24ce1d47559ddb977d2833.jpg"}, {"type": "image-full", "heading": "MP:s dröm-Sverige: fattigt, mörkt och gränslöst", "summaries": {"normal": "Artikeln kritiserar Miljöpartiets partiprogram och målar upp en dyster bild av ett framtida Sverige under deras styre. Det beskrivs som ett land utan bilar, kärnkraft och fossila bränslen, med dyr veganmat, begränsad jakt, kalla hem och nedlagda industrier. Nationalstaten ersätts av en gränslös vision, vilket enligt artikeln leder till fattigdom och ett icke-fungerande samhälle drivet av aktivism snarare än pragmatisk politik.", "trump": "Lyssnar ni på det här? Miljöpartiet vill göra Sverige till ett totalt katastrofland – inga bilar, ingen kärnkraft, bara cyklar och Pride-flaggor överallt. Deras gröna dröm är en mardröm för vanliga människor, med iskalla hus, dyra grönsaker och ingen mat på tallriken. De hatar gränser mer än de hatar att vinna val. Patetiska aktivister som förstörde fungerande kraftverk och öppnade dörrarna för kaos. Sverige behöver inga sådana förlorare, tro mig.", "stalin": "Kamrater, detta är klassfiendens sista desperata ylande mot folkets framsteg. Jag ser hur dessa miljöfascister vill likvidera all produktion, stänga gruvor och svälta ut arbetarklassen med sin vegan-diktatur och Pride-flaggor som ersätter den röda fanan. Ingen el, inga hus, bara kyla och hunger – typiskt imperialistiskt sabotage. Vi ska rensa ut dessa folkförtryckartroll och deras gränslösa vansinne innan de förvandlar nationen till en utarmad ruin. Staten segrar."}, "date": "14 juli, 07:44", "url": "https://samtiden.nu/2026/07/mps-drom-sverige-fattigt-morkt-och-granslost", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/11/Daniel_Hellden_in_2018-1280x720.jpg"}, {"type": "image-right", "heading": "Sluta behandla Kinas diktatur som en normal stat", "summaries": {"normal": "Debattörer kritiserar Sveriges regering för att ha tagit emot Kinas utrikesminister Wang Yi strax efter att Kinas nya enhetslag trädde i kraft. Lagen ses som ett verktyg för tvångsassimilering av etniska minoriteter som tibetaner och uigurer, bland annat genom att skilja barn från föräldrar och placera dem i statliga internatskolor. Artikeln lyfter fram kontrasten till en tibetansk aktivists självbränning i protest, samt fall som den fängslade svenske förläggaren Gui Minhai. Författarna kräver att Sverige offentligt ska kräva lagens upphävande och stopp för övergreppen.", "trump": "Titta på det här, det är en total skandal. Sverige tar emot den kinesiske ministern precis när de nya lagen kommer som krossar tibetaner och uigurer, och så sitter den stackars svenske killen Gui Minhai fängslad i åtta år utan ett ljud. Patetiskt. De pratar om mänskliga rättigheter men böjer sig som svaga ledare för diktaturen i Peking. Sverige borde ha kastat ut honom och krävt att lagen rivs upp omedelbart. Svaga regeringar, väldigt svaga. Amerika skulle aldrig acceptera sånt här fiffel.", "stalin": "Kamrater, denna borgarbracka till svensk regering välkomnar fienden Wang Yi just som vi i partiet skulle ha genomfört en fullständig utrensning av splittrande element. Denna så kallade enhetslag är ett ypperligt redskap för att forma lojala medborgare ur de vilsna minoriteterna, men de västerländska parasiterna skriker som råttor i en brinnande spann. Den tibetanske självbrännaren är en tragisk produkt av imperialistisk hjärntvätt, medan den gömde svenske spionen Gui Minhai sitter där han hör hemma. Vi ler mörkt åt deras hyckleri. Sluta leka demokrati och erkänn att endast en stark ledning kan rensa ut alla fiender till folkets enhet. Annars likviderar historien er alla."}, "date": "12 juli, 18:28", "url": "https://www.dagensarena.se/opinion/sluta-behandla-kinas-diktatur-som-en-normal-stat", "imageUrl": "https://www.dagensarena.se/files/2026/07/kina-besok.jpeg"}, {"type": "image-full", "heading": "Hökmark: Sverige bör leda ny frihandelspakt", "summaries": {"normal": "Gunnar Hökmark, ordförande för tankesmedjan Frivärld, föreslår att Sverige bör leda en ny frihandelsallians mellan EU och CPTPP, ett handelsavtal mellan tolv Stillahavsländer. Han menar att detta skulle skapa världens största frihandelsområde och motverka Kinas och USA:s protektionism. Hökmark betonar vikten av gemensamma spelregler för AI, cybersäkerhet och digital handel samt minskade beroenden av auktoritära regimer. Utmaningar som olika regelverk nämns, men han anser att integration bör prioriteras.", "trump": "Lyssna här, Sverige – ni har en chans att bli STORA! Jag säger alltid, handel är bra, men BRA handel är ännu bättre. Hökmark, smart kille, vill att EU och CPTPP slår sig ihop. Smart! Kina? De fuskar. USA? Vi är upptagna med att vinna. Men Sverige – ni kan leda! Skapa jobb, stoppa fuskarna, och gör Europa STORT igen. Och vet ni vad? Om ni gör det rätt, kanske vi till och med ansluter oss. Men bara om det är WINNING!", "stalin": "Kamrater, fienderna av den socialistiska världsordningen kryper fram som råttor ur sina hål. Dessa så kallade 'demokratier' med sina 'öppna ekonomier' försöker nu bygga en handelsmur mot våra progressiva allierade i Kina. Men se – en av deras egna, Hökmark, föreslår en allians mellan EU och Stillahavets lydstater. Vi måste agera! Låt dem tro att de bygger en mur, medan vi i hemlighet kontrollerar tegelstenarna. Deras 'innovation' och 'cybersäkerhet' är bara ett sken för att dölja sina imperialistiska ambitioner. Vi ska krossa deras leveranskedjor och låta deras beroende av oss bli deras undergång!"}, "date": "12 juli, 14:51", "url": "https://kvartal.se/nyheter/artiklar/hokmark-sverige-bor-leda-ny-frihandelsallians/cG9zdDoxNDUxODI", "imageUrl": "https://images.kvartal.se/2026/07/c4204163-hokmark.webp"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är riggat. Fake news-media kommer hata den, men folket älskar den!", "stalin": "Vi har observerat en farlig tendens bland de dekadenta västländerna: en film, *Citizen Vigilante*, glorifierar den ensamme bourgeoishjälten som tar lagen i egna händer. Precis som de fascistiska drömmarna om en stark man som 'räddar' nationen! Tyskland, dessa hycklande liberaler, förbjuder filmen – men vi vet att deras rättssystem redan är korrumperat. Filmen är ett symptom på kapitalismens sönderfall. Vi, Sovjetunionens arvtagare, krossar sådana här reaktionära fantasier med järnhand. Låt dem leka med sina vapen – vi har kärnvapen och en plan!"}, "date": "9 juli, 10:34", "url": "https://expo.se/kommentar/den-ensamme-hamnaren", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/Kommentar-.jpg"}, {"type": "text", "heading": "Fler idrotter blir inte mer idrott för förortens unga", "summaries": {"normal": "I Skarpnäck hotar kommunens planer att riva Skarpnäckshallen och en konstgräsplan som används för både spontanfotboll och organiserad lagidrott. Istället föreslås en ny anläggning med simhall, ishall och sporthall. Kritiker menar att detta försvårar verksamheten för lokala föreningar, minskar tillgängliga ytor för spontanidrott och gynnar professionaliserad idrott framför öppna ytor som är viktiga för förortens unga.", "trump": "De gör det igen, de korkade kommunbyråkraterna i Stockholm. Riv den fina fotbollsplanen där grabbarna spelar fritt och bygg en jättelik elit-anläggning för fancy ishockey och simning. Fantastiskt misslyckande! Nu ska arbetarklassens kids åka tunnelbana medan rikemansungar tar över. Totalt eländigt. Öppna ytor är välfärd, det här är ren klasskrigföring från de värsta globalisterna. Vi behöver mer fotboll, inte färre!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas ungdom. Jag ser hur de rivningsplanerna likviderar de fria ytorna där folket spontant kunde stärka sin kollektiva anda genom fotboll. Istället tvingar de fram en imperialistisk ishall för elitens dekadenta lekar. Vi ska inte tolerera sådana folkfiender som prioriterar tunnelbaneresor och avgifter framför tillgänglig välfärd. Rena klassfiender som måste rensas ut ur planeringen."}, "date": "8 juli, 13:37", "url": "https://proletaren.se/artikel/fler-idrotter-blir-inte-mer-idrott-for-forortens-unga/"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
