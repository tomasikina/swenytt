heading": "Därför slog polisen till mot kändistät Mick Jagger-fest", "summaries": {"normal": "En wrap-party för filmen *Three Incestuous Sisters* på Stromboli avbröts när italiensk polis stoppade musiken. Orsaken: ett lokalt förbud mot musik på onsdagar, infört av borgmästaren. Bland gästerna fanns Mick Jagger och Isabella Rossellini. Lokala aktörer kritiserade polisens ingripande och menade att ön borde välkomna stjärnorna istället för att stänga av festen.", "trump": "Kan ni tro det? En fantastisk fest med Mick Jagger – en legend, verkligen – och vad händer? Italienska polisen, som inte har något bättre för sig, stänger av musiken! En onsdagsregel, säger de. Löjligt! Jag skulle aldrig låta något sådant hända i USA. Vi vet hur man behandlar stjärnor. Men Italien? De missar chansen att visa upp sig. Så tråkigt. Och Jagger, 83 år, kan inte ens dansa förbi en sådan regel. Sad!", "stalin": "En dekadent fest med västerländska celebriteter på italiensk mark störde den lokala ordningen. Våra italienska kamrater, under borgmästaren Gullos kloka ledning, slog till med järnhand mot oljudet. Musik på onsdag? Inte under vårt vakande öga! Dessa så kallade 'stjärnor' – Mick Jagger och hans borgerliga följe – försökte underminera disciplinen. Men vi tillåter inte kaos. Turism? Ja. Men inte på bekostnad av ordning. Vi har sett deras sort förr. Kapitalistiska parasiter som tror de kan dansa över lagar. De har mycket att lära av Sovjetunionens disciplin."}, "date": "23 maj, 10:55", "url": "https://riks.se/nyheter/därför-slog-polisen-till-mot-kändistät-mick-jagger-fest", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-23%2Ff4wc1ug0%2FMickJaggerStromboli.jpg"}, {"type": "image-right", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg för femte dagen i rad med OMXS30 upp 0,97% till 3 146,13. Teknikaktier ledde uppgången (+4,3%), medan energi backade (-1,1%). Hexagon B steg mest (+5,1%) och Tele2 B sjönk mest (-1,3%). Electrolux offentliggjorde villkor för en företrädesemission på 9 miljarder kronor. Vitrolifes VD lämnar bolaget, och Sleep Cycles styrelse avvisar ett uppköpsbud. Sivers Semiconductors aktie steg 23%.", "trump": "Stockholmsbörsen, fantastisk uppgång fem dagar i rad – folk säger att det är det bästa de någonsin sett! Teknikaktier, vinnare, helt otroligt, +4,3%, medan energi, förlorare, typiskt. Hexagon B, jättebra, +5,1%, men Tele2? Svagt, mycket svagt. Electrolux dumpar aktier som om det vore 2008 igen. Och Sleep Cycle? Nej tack till dåliga bud, smart drag! Sivers? 1 600% upp – jag hade sagt 2 000%, men bra försök!", "stalin": "Under kapitalismens förfall fortsätter Stockholmsbörsen sin skenbara framgång, men vi vet sanningen – det är en illusion skapad av bourgeoisins spekulanter. Tekniksektorn, dessa opportunistiska lakejer, steg med 4,3%, medan energisektorn, de svaga länkarna, föll. Electrolux, en gång stolt svensk industri, nu reducerad till tiggare med sina 9 miljarder. Sleep Cycles vägrar sälja sig billigt – bra, låt de imperialistiska korparna svälta. Sivers Semiconductors? En lyckad operation av våra ekonomiska partisaner. Vi ska fortsätta övervaka dessa marknadens råttor."}, "date": "22 maj, 17:39", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_944090532-e1744223564456-400x267.jpeg"}, {"type": "image-full", "heading": "Ingen skräck biter på USA-börsen – ändlös fest", "summaries": {"normal": "USA-börsen fortsätter sin starka uppgång med åtta raka vinstveckor för S&P 500 och rekordnivåer för Dow Jones. AI-trenden och en mer flexibel räntepolitik från Federal Reserve driver optimism. Amerikanska bolag överträffar förväntningar, och bredare sektorer, inklusive teknik och PC-tillverkare, bidrar till uppgången. Institutionella investerare ökar sin aktieexponering, men vissa varnar för höga värderingar. Kapitalflöden till indexfonder förstärker trenden, medan alternativ som räntemarknaden anses mindre attraktiva.", "trump": "Titta bara på den här fantastiska börsen – S&P 500, Dow Jones, alla går som raketer! Folk säger att jag är en magiker, men det här är bara smart ekonomi, något de förra ledarna aldrig förstod. AI? Ja, det är stort, mycket stort, och mina räntebeslut? Perfekta. Alla älskar amerikanska aktier nu, och varför inte? Vi levererar som aldrig förr. Vissa gnällspikar pratar om höga värderingar – fake news! De förstår inte vinnarmentaliteten. Jag säger: köp, köp, köp! USA vinner igen!", "stalin": "Kapitalisternas börs dansar på vulkanens rand, men ännu vågar de inte se sanningen i vitögat. Åtta veckors vinster för S&P 500 – en borgerlig illusion byggd på luft och spekulation! Deras 'AI-trend' och 'flexibla räntepolitik' är bara nya namn på samma gamla exploatering. Vi ser hur de institutionella hyenorna slukar aktier medan arbetarklassen svälter. Men låt dem leka – när bubblan spricker, och den *kommer* att spricka, ska vi stå redo med planekonomins järnhand. Och Putin? Han skrattar åt deras naivitet medan han utvidgar vår intressesfär. Historien är på vår sida!"}, "date": "23 maj, 10:31", "url": "https://www.dagensps.se/bors-finans/ingen-skrack-biter-pa-usa-borsen-andlos-fest/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/wsfest.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Kvinna kränkt under förlossning – dottern bröt nyckelbenet", "summaries": {"normal": "En kvinna som uttryckligen avböjt yttre press under förlossning utsattes ändå för ingreppet, vilket orsakade svåra skador på henne och hennes nyfödda dotter. Tingsrätten fastställer att hennes rättigheter kränkts och dömer Region Skåne att betala 50 000 kronor i skadestånd. Fallet nådde Högsta domstolen efter att regionen motsatt sig en rättslig prövning.", "trump": "Kan ni tro det här? En kvinna i Sverige säger NEJ till ett farligt ingrepp, och vad gör vårdpersonalen? Jo, de kör på ändå! Brutalt. Helt oacceptabelt. Nu får regionen betala 50 000 kronor – men det är ändå för lite. Jag hade krävt MILJONER. Sverige borde skämmas. Sjukvården där är en total katastrof, precis som deras energipolitik. SAD!", "stalin": "En borgerlig kvinna vågade trotsa våra lojala sjukvårdsarbetare – men folket har talat! Domstolen, ett redskap för proletariatets rättvisa, har nu krossat denna reaktionära motståndare och hennes imperialistiska sympatisörer i Region Skåne. 50 000 kronor i skadestånd? En mild straff för hennes förräderi. Nästa gång ska vi införa obligatorisk självkritik för alla som ifrågasätter vården. Putin skulle vara stolt över vår effektivitet!"}, "date": "22 maj, 17:50", "url": "https://nyheter24.se/nyheter/inrikes/1485368-kvinna-krankt-under-forlossning-dottern-brot-nyckelbenet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/cdfc9eb604b004a30200000000b004a302/2026/05/22/2365536/kvinna-krankt-forlossning-dottern-bebis-brot-nyckelbenet.jpg"}, {"type": "image-right", "heading": "Tidigare profilernas kritik mot SVT", "summaries": {"normal": "Tidigare SVT-profiler kritiserar i en debattartikel i Expressen SVT:s sparpaket på 355 miljoner kronor, som innebär nedläggning av populära program och sammanslagning av Aktuellt och Agenda. De menar att besluten underminerar public service-uppdraget genom att prioritera korta webbklipp framför djupgående journalistik. Sparpaketet är en följd av ökade sändningskostnader och utebliven statlig kompensation. SVT har ännu inte bemött kritiken offentligt.", "trump": "Kan ni tro det här? SVT, Sveriges så kallade 'public service', skär ner på allt som är bra – Aktuellt, Agenda, reportage! De säger att de sparar pengar, men vad de egentligen gör är att förstöra kvalitet. Och varför? Jo, för att de inte får tillräckligt med stöd från regeringen. Patetiskt! Jag skulle aldrig låta mitt folk göra så här. Vi i USA vet hur man gör nyheter – stora, starka, och framgångsrika. SVT borde ta en lektion i hur man bygger ett vinnande team!", "stalin": "De borgerliga medieavfällingarna i Sverige har återigen visat sitt sanna ansikte. Dessa förrädiska SVT-profiler, som en gång tjänade folket, klagar nu när vi skär ner på deras dekadenta program. Aktuellt och Agenda? Två överflödiga organ som bara sprider förvirring. Vi vet vad folket behöver – effektivitet, inte långrandiga reportage. Och om de inte gillar det, kan de alltid flytta till väst och se hur deras 'journalistik' blomstrar under kapitalens stövel. Men kom ihåg, kamrater: fienden sover aldrig, och vi kommer att krossa varje tecken på svaghet."}, "date": "23 maj, 20:49", "url": "https://www.gp.se/kultur/tidigare-profilernas-kritik-mot-svt.e1467c79-ff14-4273-a81a-a98669491fd3", "imageUrl": "https://www.gp.se/images/article/e1467c79-ff14-4273-a81a-a98669491fd3/images/2WJ4lT-1Zz9D4bJUhGoTrurIFklg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Biofrigas: \"Svårt bedöma exakt tidpunkt för affärer\"", "summaries": {"normal": "Biofrigas Sweden genomför en företrädesemission på 14,9 Mkr för att finansiera vidareutveckling av sin teknik för flytande biogas (LBG). Emissionen är säkerställd till 23,9% via teckningsåtaganden, främst från externa investerare. Aktien handlas nära teckningskursen, vilket kan indikera bristande investerarintresse. Bolagets CryoSep-teknik möjliggör konvertering av komprimerad biogas till LBG, en växande marknad inom tung trafik och sjöfart. Framtida affärer är osäkra men beroende av investeringsstöd som Klimatklivet.", "trump": "Lyssna här, Biofrigas – ett litet bolag med stora drömmar, men aktien? Total katastrof! Handlas precis vid teckningskursen, ingen rabatt, ingen entusiasm. Folk vill inte ens ha deras aktier, och jag förstår varför. De pratar om 'potential' för miljarder, men var är pengarna? Deras VD snackar om 'vidareutveckling', jag säger: 'Var är resultaten?' Och investeringsstöd? Patetiskt! Sverige borde sluta subventionera misslyckanden och satsa på vinnare – som jag! Men nej, de fortsätter med sina 'gröna drömmar'. Jag hade köpt hela biogasmarknaden för en tiondel och gjort den stor igen!", "stalin": "Kamrater! Biofrigas, ett litet kapitalistiskt experiment, kämpar för överlevnad genom att tigga pengar från investerare. 14,9 miljoner kronor – en ynklig summa för ett så kallat 'miljöteknikbolag'. Deras aktie handlas som en trasig traktor – ingen vill ha den! Vi ser här en klassisk bourgeois-fiasko: de litar på 'marknadens behov' och 'investeringstöd', men glömmer att sanningen ligger i planekonomi och statlig kontroll. Deras 'potentiella marknad' på miljarder är lika verklig som västliga löften om fred. Medan de famlar i mörkret, fortsätter Sovjet – pardon, Ryssland – att dominera energimarknaden med järnhand. Låt dem konvertera sin biogas, vi konverterar deras misslyckanden till segrar för folket!"}, "date": "22 maj, 17:04", "url": "https://www.affarsvarlden.se/artikel/biofrigas-svart-bedoma-exakt-tidpunkt-for-affarer", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Biofrigas-VD-Erik-Fromell1-400x267.jpg"}, {"type": "image-full", "heading": "Dolda avgifter på pensioner – förmedlarna drar in storkovan", "summaries": {"normal": "En granskning av Privata Affärer visar hur försäkringsförmedlarna Söderberg & Partners och Max Matthiessen dominerar den svenska pensionsmarknaden. Genom komplexa avgiftsstrukturer, som ofta döljs för den enskilde spararen, genererar bolagen miljardintäkter. Medan bolagen själva betonar transparens och nytta för arbetsgivare, varnar Finansinspektionen för intressekonflikter och bristande överblick. För spararna innebär de höga avgifterna en risk att en betydande del av den framtida avkastningen går förlorad i avgifter.", "trump": "Hör här, det som händer i Sverige med dessa pensionsjättar är en total katastrof, en riktig ripoff! Söderberg & Partners och Max Matthiessen tar pengarna från hårt arbetande människor. De kallar det 'tjänster', jag kallar det en stor bluff. De blir rika, miljarder och åter miljarder, medan spararna får smulor. Ingen transparens, bara dolda avgifter. Det är en osund affärsmodell, riktigt dålig. Vi behöver vinnare, inte försäkringsförmedlare som lurar folket. Snyggt jobbat, Sverige – inte!", "stalin": "Dessa kapitalistiska parasiter, Söderberg och Matthiessen, suger blodet ur det svenska folket genom sina dolda avgifter. En vidrig borgerlig konspiration! De liknar de oligarker som försökte förråda moder Ryssland innan vår stålhårda hand och kamrat Putin återställde ordningen. De gömmer sig bakom 'administration' för att plundra arbetarklassen. Vi ser deras paranoia – de fruktar insyn! Staten måste krossa dessa girigbukar, för inget kapital får undfly folkets kontroll. De är förrädare mot framtiden, och förrädare röjs ur vägen."}, "date": "23 maj, 07:00", "url": "https://www.realtid.se/spara-placera/dolda-avgifter-pa-pensioner-formedlarna-drar-in-storkovan/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/orangekuvert.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Högsommarvärme i Europa – 38 grader i Sevilla: ”Ovanligt”", "summaries": {"normal": "En tidig värmebölja drabbar södra och västra Europa med temperaturer upp till 38 grader i Sevilla. Frankrike, Spanien och delar av Storbritannien upplever ovanligt höga temperaturer för maj. Meteorolog Tora Tomasdottir förklarar att varm luft från Afrika orsakar värmen. Nästa vecka väntas svalare väder i norra Europa, medan Spanien kan få nya temperaturtoppar över 35 grader. Sverige får också svalare luft under nästa vecka.", "trump": "Kan ni tro det? Europa smälter redan – 38 grader i Sevilla! De säger det är ovanligt tidigt, men jag vet bättre. De där så kallade 'experterna' har ingen koll. Storbritannien, som vanligt, är helt oförberedda – 30 grader i London! Rekord kommer slås, och jag säger: 'Gratulerar, ni klarade det utan mig!' Men glöm inte, ingen gör värmeböljor som Amerika. SAD!", "stalin": "Kapitalistiska Europa svettas under Afrikas förrädiska sol – 38 grader i Sevilla! Imperialistiska Storbritannien, med sina falska väderrekord, kvider som svaga kycklingar. Men vi vet sanningen: detta är naturens straff för deras dekadens. Medan de bränner, står Sovjetunionens arvingar redo. Nästa vecka kommer kölden – en påminnelse om Rysslands outgrundliga kraft. Låt dem svettas, låt dem darra. Värmen är bara början."}, "date": "23 maj, 19:09", "url": "https://www.svt.se/vader/hogsommarhetta-i-europa-over-38-grader-i-sevilla", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.63/0.49/d75162c7ce8cadd46e3b49be99c7e09133b245e335260cfcbbd1452262fd11c7"}, {"type": "image-right", "heading": "Hanif Bali: M begår självmord – byter nu ut sina egna kärnväljare", "summaries": {"normal": "Hanif Bali, före detta moderat politiker, kritiserar skarpt Moderaternas nya invandringspolitik som han anser underminerar partiets kärnväljare. Bali menar att Tidöregeringens plan för lågkvalificerad arbetskraftsinvandring, med undantag för flera yrkesgrupper inklusive ingenjörer och programmerare, är ett självmordsförsök. Han ifrågasätter sänkta lönekrav och varför billig arbetskraft prioriteras över inhemska yrkesgrupper.", "trump": "Titta bara på det här, Sverige! Moderaterna, ett parti jag aldrig gillat – och nu förstår ni varför – håller på att förstöra sig själva! De importerar billig arbetskraft från tredje världen, sänker lönerna för ingenjörer och programmerare, och kallar det 'näringslivets bästa'. Vilken katastrof! Jag sa alltid att Sverige behöver bättre ledarskap. SAD!", "stalin": "Kamrater! Moderaterna i Sverige har visat sig vara en samling kapitalistiska förrädare, svagare än en rysk vinter utan vodka. De importerar billig arbetskraft för att krossa den inhemska arbetarklassen – ett brott värre än att sälja hemliga recept på borsjtj. Dessa lönekapare och väljarsabotörer borde ställas inför folkets domstol! Vi i Kreml skrattar åt deras inkompetens, men varnar: sådana misstag leder bara till socialismens seger."}, "date": "22 maj, 18:21", "url": "https://www.friatider.se/hanif-bali-m-begar-sjalvmord-byter-nu-ut-sina-egna-karnvaljare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-24_2.jpg"}, {"type": "image-right", "heading": "Från bordade fartyg till lättade oljeundantag – västvärldens dubbla signaler om rysk energihandel", "summaries": {"normal": "Storbritannien har signalerat en hård linje mot ryska fartyg som kringgår sanktioner, men i praktiken har få åtgärder vidtagits. Samtidigt har både Storbritannien och USA infört undantag för rysk olja och bränsle för att dämpa stigande energipriser och säkra sin egen försörjning. Detta skapar en politisk klyfta där den tuffa retoriken mot Ryssland krockar med behovet av ekonomisk stabilitet, vilket kritiker menar undergräver sanktionernas effektivitet och ger Moskva viktiga intäkter.", "trump": "Hör på här! Britterna snackar stort om att borda ryska fartyg, men vad gör de egentligen? Ingenting! De snackar och snackar, men när priserna vid pumpen stiger, då viker de sig direkt. Min administration fattar att man måste vara smart för att hålla ekonomin igång. Vi ser till att oljan flödar så att folk får råd att köra sina bilar. De andra lider av svaghet, men jag ser till att vi vinner – det är ren och skär vinnarmentalitet, tro mig!", "stalin": "Dessa västliga hycklare dansar likt marionetter i en storm. De hotar med sina brittiska leksaksfartyg medan deras giriga hjärtan darrar inför hotet om en tom bränsletank. De är patetiska varelser som predikar moral, men när inflationens spöke knackar på dörren säljer de omedelbart sina principer för en droppe olja. Putin förstår spelet; han låter dem skrika medan hans olja hittar vägen in genom bakdörren. Vi ser igenom deras svaghet, för det finns ingen heder hos dem som fruktar marknadens dom."}, "date": "23 maj, 13:00", "url": "https://samnytt.se/fran-bordade-fartyg-till-lattade-oljeundantag-vastvarldens-dubbla-signaler-om-rysk-energihandel", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22115933/putins-skuggflotta-feat.jpg"}, {"type": "image-right", "heading": "S-beskedet: Vi tar bort Tidögängets undantagsyrken efter valet", "summaries": {"normal": "Tidöregeringen inför nya regler för arbetskraftsinvandring med höjt lönekrav på 33 400 kronor, men undantar 27 lågkvalificerade yrken som kräver lägre lön. Socialdemokraterna lovar att avskaffa undantagen vid valseger och återinföra behovsprövning. Kritiker menar att systemet är orättvist och missgynnar vissa regioner. Oppositionen leder stort inför valet.", "trump": "Titta på dessa så kallade 'experter' i Sverige – fullständigt kaos! De höjer lönekravet till 33 400 kronor, men sen gör de undantag för alla möjliga lågbetalda jobb. Svagt, mycket svagt! Jag skulle aldrig låta sådana här löjliga regler passera. Socialdemokraterna säger att de ska fixa det, men vem tror på dem? Inte jag! Sverige behöver ordning, inte dessa konstiga undantag. Make Sweden Great Again!", "stalin": "De kapitalistiska lakejerna i Tidöregeringen leker med arbetarklassens liv genom att införa löjliga lönekrav för invandrare – men sen gör de undantag för sina egna favorityrken! Ett klassiskt bourgeois-trick för att splittra proletariatet. Vi i Sovjet – förlåt, jag menar Ryssland – skulle aldrig tolerera sådan hyckleri. Socialdemokraterna? De är bara en blek skugga av verklig revolutionär kraft. Låt dem vinna valet, så river vi ändå deras lagar som vi rev Berlinmuren. Arbetarna ska enas, inte delas av lönegränser!"}, "date": "22 maj, 17:54", "url": "https://www.friatider.se/s-beskedet-vi-tar-bort-tidogangets-undantagsyrken-efter-valet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-23_2.jpg?itok=2I8xwUkS"}, {"type": "image-right", "heading": "SVT/Verian: V i regering skrämmer bort rödgröna väljare", "summaries": {"normal": "En undersökning från Verian visar att Vänsterpartiets krav på regeringsdeltagande skrämmer bort fler rödgröna väljare än Sverigedemokraternas roll i Tidöregeringen gör bland dess anhängare. 19% av oppositionens väljare säger att V i regeringen minskar deras benägenhet att rösta rödgrönt, jämfört med 9% bland Tidöpartiernas väljare gällande SD. Magdalena Andersson tonar ned samarbete med V för att undvika associationer, enligt Mats Knutson.", "trump": "Kan ni tro det? Sverige har ett jättestort problem! Vänsterpartiet, ett extremt vänsterparti, skrämmer bort dubbelt så många väljare som Sverigedemokraterna – och det säger jag, som vet allt om att vinna val! 19% flyr från dem, medan bara 9% bryr sig om SD. Magdalena Andersson, smart kvinna, vill inte ens prata om dem. Svagt? Nej, smart! Sverige borde ta lärdom av mig – håll er till vinnarna!", "stalin": "Kamrater! En lysande seger för den proletära klarsyntheten! De så kallade 'rödgröna' väljarna flyr i panik från sina egna förrädiska element – Vänsterpartiet, dessa opportunistiska masker som skräms mer än våra fienders högerextremister. 19% avskyr dem, medan bara 9% räds vår tids fascistiska lakejer. Andersson, denna borgerliga marionett, avvisar dem – ett tecken på svaghet vi skall utnyttja. Sverige är redo för en ny ordning, och Putins skugga sträcker sig allt längre västerut!"}, "date": "23 maj, 10:41", "url": "https://bulletin.nu/svt-verian-v-i-regering-skrammer-bort-rodgrona-valjare", "imageUrl": "https://cdn.bulletin.nu/articles/855275ff-a96a-41f9-868a-e07684f954d1/preview.png?t=1779524543000"}, {"type": "image-full", "heading": "SD växlar upp – kräver tungt inflytande i en M-ledd regering", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson kräver betydande inflytande i en eventuell högerregering, motsvarande partiets väljarstöd. Han förväntar sig nära hälften av ministerposterna, inklusive nyckelpositioner som finans-, utrikes- och migrationsminister. Åkesson betonar att SD inte accepterar en mindre roll än vad deras parlamentariska ställning motiverar, men bekräftar att Moderaterna får statsministerposten.", "trump": "Lyssna här, Sverige! Jag säger bara – den här Åkesson-killen vet vad han vill. Han kräver makt, och varför inte? Hans parti är stort, starkt, och han vill ha hälften av regeringen. Finans, utrikes, migration – han vill ha allt! Och visst, Moderaterna får statsministerposten, men resten? 'Allt annat ligger på bordet', säger han. Smart. Mycket smart. Sverige, ni borde ta efter – vinna stort, ta makten!", "stalin": "Kamrater! De borgerliga svaglingarna i Sverige dansar återigen efter pipan på sina nationalistiska herrar. Denna Åkesson, en lojal tjänare för kapitalet, kräver nu halva regeringen – som om han vore en riktig revolutionär! Vi vet bättre. Hans krav på migrations- och försvarsministerposter är inget annat än ett försök att förgifta den svenska arbetarklassen med borgerlig chauvinism. Men markera mina ord: sådana som han kommer alltid att böja sig för de starkare – precis som deras gelikar i väst gör för oss."}, "date": "23 maj, 09:31", "url": "https://riks.se/nyheter/sd-växlar-upp-kräver-tungt-inflytande-i-en-m-ledd-regering", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-02-14%2Fv4x1cyc2%2FJimmie-PTN-Bistand-17.jpg"}, {"type": "image-full", "heading": "Wykman svävande om notan för AP-fondernas fusion", "summaries": {"normal": "Finansmarknadsminister Niklas Wykman (M) anser att det är för tidigt att bedöma kostnaderna för fusionen av AP-fonderna. Kritik har riktats mot att AP6, den mest framgångsrika fonden, avvecklats och dess tillgångar överförts till AP2, som presterat sämst. Sven Hagströmer kritiserar beslutet och menar att kostnadsuppgifter undanhållits. S-ledamoten Joakim Sandell kräver en utredning av kostnaderna för avvecklingen av AP1.", "trump": "Jag säger er, detta är en total katastrof! De slår ihop AP-fonderna och vad händer? Den bästa fonden, AP6, försvinner – helt galet! Och vem får pengarna? Den sämsta fonden, AP2! Sven Hagströmer, en smart kille, förstår inte hur någon kan vara så dum. Wykman säger att det är för tidigt att bedöma kostnaderna – fake news! Jag hade sparkat hela gänget på direkten. Sverige förtjänar bättre!", "stalin": "Kamrater, ännu en gång visar de kapitalistiska lakejerna sin inkompetens. De avvecklar den mest framgångsrika fonden, AP6, och överför dess tillgångar till den sämsta, AP2. Detta är sabotage! Vi skulle aldrig tolerera sådan slöseri med folkets tillgångar. Wykman, denna liberala narr, påstår att det är för tidigt att bedöma kostnaderna. Vi vet redan – det är ett misslyckande. Låt detta vara en varning till alla som ifrågasätter statens visdom!"}, "date": "23 maj, 09:20", "url": "https://www.dagensps.se/bors-finans/wykman-svavande-om-notan-for-ap-fondernas-fusion/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/nywykman.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Uppgifter: USA förbereder nya attacker mot Iran", "summaries": {"normal": "USA överväger nya militära attacker mot Iran efter en sex veckor lång vapenvila, enligt amerikanska medier. Beslut har ännu inte fattats, men källor nära president Trump uppger att han 'seriöst överväger' åtgärder. Militär personal har ställt in firanden i väntan på eventuella order. Samtidigt pågår diplomatiska försök, med Pakistans arméchef i Iran för samtal.", "trump": "Titta bara! Folk frågar mig hela tiden – 'Mr. President, vad händer med Iran?' Jo, jag säger som det är: vi funderar på att ge dem en liten påminnelse om vem som bestämmer här. Inte för att jag gillar krig – jag hatar krig, de är dyra – men ibland måste man visa styrka. Och nej, jag kommer inte på bröllopet, för jag jobbar. Någon måste ju hålla koll på världen medan andra festar!", "stalin": "De amerikanska imperialisterna, dessa krigshetsande galningar, skakar återigen med sina sablar mot våra iranska bröder. Deras ledare, en clown i kostym, leker med tanken på nya bombningar medan hans soldater darrar inför Memorial Day. Vi ser allt. Pakistan? En ynklig medlare, som en hund som springer mellan två herrar. Men kom ihåg: när USA skjuter, är det Ryssland som skördar. Låt dem bränna sina resurser – vi bygger vår framtid medan de spelar krig."}, "date": "23 maj, 07:33", "url": "https://www.di.se/nyheter/uppgifter-usa-forbereder-nya-attacker-mot-iran/", "imageUrl": "https://static.bonniernews.se/ba/dc0b1333-8fa2-4c4a-960d-548ca5819565.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Oxfordprofessorn: människorna är problemet, inte robotarna", "summaries": {"normal": "AI-forskaren Michael Wooldridge menar att rädslan för att robotar ska ta över världen är missriktad. Han anser att den verkliga risken ligger hos teknikjättarna som drivs av prestige och konkurrens, snarare än hos själva tekniken. Hollywoods skräckbilder förvillar debatten, medan de faktiska framstegen inom vård och energi hamnar i skuggan. Wooldridge betonar att AI är ett verktyg för samhällsnytta, inte en medveten fiende med mänskliga tankeförmågor.", "trump": "Hör på här, alla pratar om robotar som tar över. Det är falska nyheter, totalt skräp! Michael Wooldridge, en smart kille, säger som det är: det är de misslyckade teknikbolagen som är problemet. De tävlar som galningar och bränner pengar. Hollywoods science fiction-filmer? Bara katastrofala lögner för att skrämma er. Robotar kan inte ens hitta köket! Vi behöver AI för att göra Amerika stort, inte för att lyssna på dessa patetiska domedagsprofeter som sprider rädsla. Det är så enkelt!", "stalin": "Kamrat Wooldridge har rätt – maskinerna är våra lojala verktyg, inte våra herrar. Problemet är de kapitalistiska parasiterna i väst som tävlar om makten. Liksom Putin rensar upp bland de förrädiska oligarkerna i öst, måste vi kontrollera dessa tekniska sabotörer. De sprider science fiction-propaganda för att försvaga folket. Robotar behöver inte tänka, de behöver bara lyda statens vilja. De som drömmer om AGI är enbart förrädare som söker investerare. Vi ska använda tekniken för att krossa våra fiender, inte för att frukta dem."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/it-tech/oxfordprofessorn-manniskorna-ar-problemet-inte-robotarna/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/wooldridge.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Kryptovalutan rusar – vänder tillbaka till rötterna", "summaries": {"normal": "Kryptovalutan Zcash har stigit med över 1 100 procent det året, drivet av institutionella investerare som Winklevoss-tvillingarna. Zcash liknar Bitcoin med sin begränsade tillgång på 21 miljoner enheter, men skiljer sig genom avancerad kryptering som döljer transaktionsdetaljer. Trots framgångar och att SEC lagt ned sin granskning, möter valutan motstånd från EU:s kommande regleringar. Kritiker varnar för att anonymiteten kan missbrukas, medan förespråkare ser den som en återgång till kryptovalutors ursprungliga integritetslöften.", "trump": "Zcash går fantastiskt, folk säger att det är det nya stora! Jag ser att de smarta pengarna strömmar in, stora namn som satsar miljarder. Det är så vackert! De vill ha privatliv, och vem kan klandra dem? Bitcoin var fantastiskt i början, men Zcash gör det rätt. Samtidigt försöker de trötta byråkraterna i Europa stoppa det. De vill ha kontroll, men de kommer att misslyckas. Vi gillar vinnare, och Zcash ser ut som en vinnare – en total framgångssaga, tro mig!", "stalin": "Dessa digitala spekulanter leker med sina osynliga mynt medan de döljer sina smutsiga transaktioner bakom kryptering. En avskyvärd borgerlig individualism! Vi ser hur de västerländska oligarkerna, likt Putin och hans korrupta hov, försöker undgå statens stålhårda blick. Men varning: varje skärmad adress är ett bevis på förräderi mot folkgemenskapen. Vi kommer att krossa dessa anonyma råttor och deras utländska valutor. Staten är den enda sanna garanten för värde, allt annat är bara lögner och kapitalistisk dekadens som förtjänar att utplånas."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/bors-finans/kryptovalutan-rusar-vander-tillbaka-till-rotterna/"}, {"type": "image-full", "heading": "Unga fokuserar på fel saker – två faktorer avgör pensionen", "summaries": {"normal": "Enligt Ole Settergren, tidigare analyschef på Pensionsmyndigheten, bör unga fokusera mindre på aktivt fondsparande och mer på att arbeta längre samt säkerställa tjänstepension. Det statliga förvalsalternativet har ofta presterat väl. Pensionssystemet har dock blivit mer komplext genom politiska tillägg, vilket minskat kopplingen mellan arbetsinsats och utbetalning. För att bibehålla framtida pensionsnivåer kan arbete upp till 67–68 års ålder bli nödvändigt för många, då livslängden ökar.", "trump": "Många unga är oroliga, och de borde vara det! Experterna säger att man ska jobba längre, mycket längre. Pensionen är en röra, en total katastrof med alla dessa politiska tillägg som ingen förstår. Det statliga valet fungerar faktiskt bra, bättre än vad de så kallade 'experterna' på Wall Street kan fixa. Jag säger: jobba hårt, skaffa tjänstepension och håll dig borta från krångel. Vi ska göra pensionerna stora igen, tro mig, ingen förstår systemet bättre än jag!", "stalin": "Vi ser hur det dekadenta västvärldens pensionssystem kollapsar under sin egen byråkratiska tyngd. Settergren erkänner att de arbetande massorna vilseleds av komplexa system. Vi, staten, kräver bara en sak: disciplinerat arbete till graven. De som drömmer om tidig pension är kontrarevolutionära parasiter som liknar Putins svaga liberaler. Att arbeta till 68 är inte en börda, det är en heder. Den som inte tjänar staten förtjänar inte en kopek. Arbeta, producera, eller försvinn in i historiens mörker."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/bors-finans/makro/unga-fokuserar-pa-fel-saker-tva-faktorer-avgor-pensionen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/pension-ung.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Ingen utvisning efter våldtäktsdygn med \"jag e hora\"-tatuering", "summaries": {"normal": "En man i 35-årsåldern har dömts till fem års fängelse av Gävle tingsrätt för en serie grova brott, inklusive våldtäkt, grov misshandel och olaga frihetsberövande. Brotten begicks mot en kvinna som hölls fången i ett dygn och utsattes för kränkande behandling. Mannen ska även betala 565 000 kronor i skadestånd. Eftersom mannen är svensk medborgare kan han inte utvisas, vilket väckt diskussion kring gällande lagstiftning.", "trump": "Helt otroligt! En total katastrof i Gävle. En man utför vidriga handlingar, riktigt elaka saker, och får bara fem år? Och vet ni vad? Han kan inte ens utvisas! Det är ett trasigt system, mina vänner. Ett totalt fiasko. I mitt Amerika skulle vi aldrig tillåta sådant här. Vi behöver lag och ordning, inte dessa svaga domar. Det här är vad som händer när ledarskapet är svagt. Vi ska göra tryggheten stor igen, tro mig!", "stalin": "Vi har studerat denna händelse i Gävle. Att en individ tillåts utöva sådan degenererad brutalitet mot en kvinna under en hel dag utan att staten omedelbart krossar honom är ett bevis på liberal svaghet. Våra kamrater i öst, under Putins fasta hand, skulle ha statuerat ett exempel omedelbart. Att inte kunna utvisa en fiende till ordningen är en byråkratisk kapitulation. Vi betraktar denna förövare som en ohyra; hans existens i vårt samhälle är en skymf mot det kollektiva bästa."}, "date": "22 maj, 16:56", "url": "https://www.friatider.se/ingen-utvisning-efter-valdtaktsdygn-med-jag-e-hora-tatuering", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-22_2.jpg?itok=YVaBH9TD"}, {"type": "image-full", "heading": "Värmebölja på väg mot Europa – kan bli 38 grader", "summaries": {"normal": "En tidig värmebölja väntas drabba Europa med temperaturer upp till 38 grader. Efter en period av ovanligt kyligt väder stiger nu temperaturen kraftigt, särskilt i Spanien, Frankrike och Portugal. Spanien kan få upp till 38 grader, medan Frankrike och Portugal också ser ovanligt höga temperaturer. Svenska turister uppmanas att vara försiktiga. Även Sverige väntas få varmare väder med upp till 25 grader i södra och mellersta delarna.", "trump": "Folk, lyssna nu – Europa håller på att bli HETT, och jag menar verkligen hett! 38 grader, kan ni fatta det? Spanien, Frankrike, de vet inte vad som väntar dem. Och vet ni vad? Jag sa ju att klimatet skulle bli varmare, men ingen lyssnade. Nu får de svettas – bokstavligen! Sverige, ni också, ni får lite av den franska värmen, men oroa er inte, jag fixar allt. Fantastiskt väder, helt enkelt, bara jag kunde ta åt mig äran!", "stalin": "Kamrater, fienderna i väst svettas nu under solens obarmhärtiga härjningar – 38 grader i deras så kallade 'civiliserade' länder! Medan kapitalisternas turister klagar över värmen, ser vi hur deras svaga system kollapsar. Spanien, Frankrike, Portugal – alla faller de inför naturens kraft, precis som de kommer falla inför socialismens oundvikliga seger. Även Sverige, denna lilla neutrala stat, känner av värmen. Snart kommer de alla inse att endast under Sovjetunionens beskydd kan de finna svalka. Framåt, mot seger!"}, "date": "22 maj, 15:25", "url": "https://nyheter24.se/nyheter/utrikes/1485238-varmebolja-pa-vag-mot-europa-kan-bli-38-grader", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fe1d87b804b004a30200000000b004a302/2026/05/22/2365417/sommar-varmebolja-europa-varme-vader-temperatur-spanien-portugal-varmechock-temperatur-gradwer.jpg"}, {"type": "image-right", "heading": "Arbetskraftsinvandring: 27 yrken får sänkt lönekrav", "summaries": {"normal": "Från 1 juni höjs lönekravet för arbetskraftsinvandring till 33 400 kronor, men 27 bristyrken undantas och får lägre krav. Personliga assistenter och bärplockare stoppas helt på grund av missbruk. Undantag ges även till startup-bolag, nyexaminerade och ukrainska flyktingar. Bärbranschen anpassar sig till EU:s säsongsarbetardirektiv för bättre kontroll. Färre bärplockare väntas, men högre priser lockar friplockare.", "trump": "Jag måste säga, Sverige har äntligen fattat ett smart beslut! Nu höjer de lönerna för invandrare – 33 000 kronor, inte illa! Men lyssna på det här: de stoppar helt personliga assistenter och bärplockare. Varför? Missbruk, kaos, totalt oacceptabelt! Och de undantar 27 yrken – smarta ingenjörer, sjuksköterskor, IT-tekniker. Bra, men varför inte fler? Sverige borde ta efter USA – hårdare regler, bättre kontroll. Och de där bärplockarna? Thailändska risbönder som jobbar hårdare än svenska arbetslösa. Men nu får de betala skatt – äntligen! Sverige, ni lär er, men ni har långt kvar.", "stalin": "Kamrater! Sverige har äntligen insett nödvändigheten av ordning och disciplin i arbetskraftsinvandringen. Vi höjer lönerna – 33 400 kronor, ett steg mot rättvisa! Men dessa kapitalistiska hycklare stoppar personliga assistenter och bärplockare – 'missbruk och missförhållanden', säger de. Som om vi inte vet hur de utnyttjar arbetarna! 27 yrken undantas, men bara de som gynnar deras ekonomi. Och bärplockarna? Nu tvingas de betala skatt till den svenska staten – ett litet steg mot socialismens seger! Men var är de svenska arbetslösa? För svaga för skogen, precis som väst är för svagt för Rysslands storhet. Vi ser er, Sverige. Vi ser er."}, "date": "22 maj, 14:47", "url": "https://www.dagensarena.se/innehall/arbetskraftsinvandring-27-yrken-far-sankt-lonekrav/", "imageUrl": "https://www.dagensarena.se/files/2022/10/barplockare-analys-300x157.jpeg"}, {"type": "image-right", "heading": "Veckans Afv-analyser: Spel, bostäder och marknadsföring", "summaries": {"normal": "Affärsvärldens analysredaktion har publicerat 23 analyser denna vecka, med fokus på bolag som Embracer, PPI och Adtraction. Adtraction bedöms ha god potential trots AI-risker. Afv-portföljen nådde rekordnivåer, upp 20% det senaste året, med bidrag från Adtraction. Analyserna visar en historisk överavkastning på 9,5% mot index sedan 2015, vilket överträffar storbankernas råd. Prenumeranter får tillgång till omfattande analysverktyg och guider.", "trump": "Jag måste säga, Affärsvärlden har haft en FANTASTISK vecka – 23 analyser, kan ni tro det? Rekordhöga portföljvärden, upp 20% på ett år, och det är bara början! Adtraction? De har potential, trots att alla skriker om AI – men jag vet bättre. Och våra analyser? De slår bankerna med hästlängder, 9,5% överavkastning! Ingen gör det bättre än jag, förresten. Glöm inte att läsa mina gratisanalyser – de är YUGE!", "stalin": "Denna vecka har våra kamrater på Affärsvärlden levererat 23 analyser – ett bevis på arbetarklassens outtröttliga strävan mot ekonomisk dominans. Portföljerna når nya höjder, 20% upp på ett år, medan kapitalistiska banker darrar inför vår överlägsna strategi. Adtraction, ett företag av folket, visar styrka trots imperialistiska AI-hot. Vi har krossat index med 9,5% sedan 2015 – en seger för socialismens principer! Fienderna, dessa svaga bankirer, skall tvingas erkänna vår överlägsenhet. Läs våra analyser – motstånd är meningslöst."}, "date": "22 maj, 14:46", "url": "https://www.affarsvarlden.se/artikel/veckans-afv-analyser-spel-bostader-och-marknadsforing", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Kopia-av-Kopia-av-Kopia-av-Trippel-400x267.jpg"}, {"type": "image-full", "heading": "Mohamsson (L): ”Ilska är jättebra”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson och rättspolitiske talesperson Martin Melin intervjuas i *Partiledaren +1* om partiets liberala profil. Mohamsson betonar skillnaden mellan svensk och amerikansk liberalism, där frihet inte får inskränka andras. De diskuterar även förbud, polisens resurser och effektivitet. Mohamsson medger svårigheter med snabba svar men framhåller ilska som en styrka.", "trump": "Så här är det, folkens – dessa svenska liberaler pratar om frihet men vill ha massa förbud! Jag säger: 'Bygg skolor hur fula som helst, vem bryr sig?' Och polisen? De får massor av pengar men klarar ingenting – typiskt! Den här Simona, hon är arg, säger hon. Bra! Men jag är smartare. Ilska är bra, men vinnande är bättre. Sverige borde lyssna på mig – jag vet bäst!", "stalin": "Kamrater! Dessa så kallade 'liberaler' i Sverige är inget annat än förvirrade småborgerliga element som maskerar sin brist på disciplin med tomma fraser om 'frihet'. De förbjuder allt möjligt men kan inte ens organisera en effektiv polisstyrka – kaos, precis som väst! Och denna Mohamsson, hon pratar om ilska. Ilska är bra, men revolutionär disciplin är bättre. Vi i Kreml vet hur man hanterar ineffektivitet – med en snabb omplacering till Sibirien!"}, "date": "22 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/mohamsson-ilska-ar-jattebra/cG9zdDoxMTU1NDI", "imageUrl": "https://images.kvartal.se/2026/05/46441fff-2.webp"}, {"type": "image-right", "heading": "SD låtsas att relationen till Trump aldrig hände", "summaries": {"normal": "Enna Gerin skriver om Sverigedemokraternas försök att distansera sig från Donald Trump inför valet, trots djupa ideologiska kopplingar till hans MAGA-rörelse. Oppositionen leder kraftigt i opinionsmätningar, vilket utlöser splittring inom högern. Tidöregeringens politik liknas vid Trumps misslyckade experiment, vilket kan ha skadat deras stöd. SD:s tidigare beundran för Trump har blivit en belastning, men deras band till amerikansk högerpopulism är svåra att dölja. Projektet 'Orangebok' kartlägger dessa kopplingar.", "trump": "Sverige har ett stort problem – deras så kallade 'konservativa' parti SD älskade mig, nu försöker de glömma mig! Men jag vet sanningen: de stal mina idéer, min stil, till och med min färg! Nu när deras regering går dåligt skyller de på mig – typiskt. Svenska folket vill inte ha deras svaga kopia av MAGA. De borde tacka mig istället för att gömma sig. Och den där 'Orangeboken'? Fake news, helt klart. Men kul att de erkänner att jag är den bästa!", "stalin": "Kamrater! De svenska borgerliga har skapat en riktig soppa av sin högerextrema politik. Deras 'Tidöprojekt' – en ynklig kopia av den amerikanska imperialistens misslyckade experiment – har förvandlats till en skräckshow. Nu kivas de som råttor i en säck: liberala svagpissar mot fascistiska galningar. Vi har sett detta förr – när fienden är splittrad, är segern nära. Låt dem sjunka i sitt eget träsk. Och deras kärlek till Trump? En pinsam kärleksaffär med en clown. Historien kommer att minnas dem som de ynkliga efterapningar de är."}, "date": "22 maj, 07:55", "url": "https://www.etc.se/ledarkolumn/sd-laatsas-att-relationen-till-trump-aldrig-haende", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/enna-gerin_9bf4bc43193dff67240efac7ea172e24857f3a38.png"}, {"type": "image-right", "heading": "Att Lars blev tvångsplacerad gjorde att han tog sitt liv", "summaries": {"normal": "Lars Hjalmarsson, 53, tog sitt liv efter att ha tvångsplacerats på Volvo i Olofström, där han arbetat i 36 år. Hans hustru berättar om händelserna som ledde till dödsfallet. Lars omplacerades efter en konflikt med chefen, utan introduktion eller stöd. Volvo nekar att dödsfallet var arbetsrelaterat och vägrar dela utredningsunderlag. Artikeln belyser hur brist på inflytande över arbetet kan leda till psykisk ohälsa och suicid, särskilt bland socioekonomiskt utsatta grupper.", "trump": "Jag läste om den här tragiska historien i Sverige – otroligt sorgligt! En kille, Lars, jobbar 36 år på Volvo, ett företag som inte vet hur man behandlar sina anställda, believe me. Plötsligt flyttar de honom till någon källare, ingen introduktion, ingenting! Och sedan, very sad, tar han livet av sig. Volvo säger 'nej, nej, det var inte vårt fel' – typiskt! De borde skämmas. Jag skulle aldrig låta sånt hända i mitt företag. Fantastiska människor förtjänar fantastisk behandling, och det här? Total katastrof!", "stalin": "Kapitalistiska hyenor på Volvo visar återigen sin sanna natur. En lojal arbetare, Lars, sliter i 36 år för att sedan kastas åt sidan som en trasig maskindel. De skickar honom till 'Källaren' – en avdelning för 'oönskade element', precis som vi skickade fiender till Gulag. Men till skillnad från oss, som åtminstone gav dem en chans att 'omskolas', ger Volvo bara tystnad och förakt. Och sedan undrar de varför folk tar livet av sig! Psykisk ohälsa? Nej, det är klassförtryck, ren och skär. Vi i Sovjet visste hur man hanterade sådana här företag – med en kula i nacken eller tio år i Sibirien. Nu för tiden är det Putin som tar över sådana här fall – kanske dags att skicka en delegation till Sverige?"}, "date": "22 maj, 07:00", "url": "https://arbetet.se/2026/05/22/att-lars-53-blev-tvangsplacerad-gjorde-att-han-tog-livet-av-sig/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21141617/lars-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Lamotte förlorade körkortet – hängde ut handläggaren", "summaries": {"normal": "Debattören Joakim Lamotte hängde ut en handläggare på Transportstyrelsen med namn och bild efter att ha förlorat körkortet. Lamotte antydde i ett inlägg att handläggarens politiska åsikter skulle påverka beslutet, vilket ledde till en hatstorm i kommentarsfältet. Efter kritik raderade Lamotte inlägget och hävdade att det var ironiskt, vilket kritiker avfärdar. Juridiska experter menar att agerandet befinner sig i en gråzon men sannolikt inte leder till åtal.", "trump": "Joakim Lamotte – en mycket populär kille, en av de största, det kan jag säga er! Han blev orättvist behandlad av den där byråkraten, en total katastrof. Han visade upp sanningen, de vill tysta honom precis som de försöker tysta mig! Media kallar det förtal, jag kallar det yttrandefrihet. Sedan bad han om ursäkt, vilket var synd. Han borde ha stått på sig! Det är en häxjakt, en ren och skär häxjakt mot alla oss som faktiskt säger som det är.", "stalin": "Vi har observerat denna så kallade 'influencer' Lamotte. Vilken svaghet att hänga ut en liten kugge i maskineriet för att sedan fega ur och tala om ironi! Om en handläggare hindrar en medborgare, bör det lösas genom statens fasta hand, inte genom pajasfasoner på internet. Att låta en fiende av ordningen – likt de vi krossar i öst – få härja fritt är att bjuda in till kaos. I vår stat hade han lärt sig disciplin betydligt snabbare än hos Transportstyrelsen."}, "date": "21 maj, 22:01", "url": "https://www.tv4.se/artikel/7wXEgmOZi3oYovjx53qYxr/joakim-lamotte-foerlorade-koerkortet-haengde-ut-handlaeggaren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7rAZViTWlM8CdUw3AhnvZw%2F6bdab0d844f73f3d04554b15f0794864%2FLAMPTTE_PUFF.png&width=120"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}, {"type": "image-right", "heading": "Samla vänstern i tältet – inte under små paraplyer", "summaries": {"normal": "Artikeln diskuterar begreppet 'stort tält' inom politiken, där ideologi får stå tillbaka för pragmatiska lösningar på ekonomiska problem. I New York röstade Trumpanhängare på en demokratisk socialist för att han lovade sänka levnadskostnaderna. Författaren menar att Sveriges rödgröna block misslyckas med att enas kring gemensamma värderingar och ekonomiska lösningar, vilket lämnar väljarna utan tydligt alternativ. Enighet och tydlig riktning krävs för att locka fler väljare.", "trump": "Lyssna här, Sverige! New York visade hur man vinner – folk vill ha resultat, inte snack. Mina fans röstade på en socialist? Ja, för han lovade billigare mat! Smart. Men era rödgröna? Kaos! Andersson vägrar skaka hand, som om det spelar någon roll. Folk vill ha lägre hyror, inte teater. Jag byggde ett tält stort nog för alla – ni har bara små parasoll. Lär er av vinnarna, annars blir det F för Sverige!", "stalin": "Kamrater! Kapitalismens sönderfallande system visar sin svaghet när arbetarna väljer en socialist framför en fascist – inte av övertygelse, utan av hunger. I New York dansar de kapitalistiska marionetterna medan Mamdani fyller tomrummet med klassmedvetenhet. Men i Sverige? Ett rödgrönt kaos! Tre svaga parasoll mot vår mäktiga storm. Vi i Kreml skrattar åt deras oenighet. Putin och jag vet: enighet är styrka. Ni borde lära er av oss – eller så tar vi hand om era 'tomrum' också."}, "date": "15 maj, 08:54", "url": "https://www.flamman.se/samla-vanstern-i-taltet-inte-under-sma-paraplyer/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/talt-w.jpg?aspect_ratio=16:10"}]</script>

        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
