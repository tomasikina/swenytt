. Rensa ut de dekadenta hindren och bygg, bygg, bygg för folkets seger!"}, "date": "10 augusti, 15:45", "url": "https://www.flamman.se/varfor-vagrar-nooshi-prata-om-byggande", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/byggande-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Burnham kallar till sitt första Cobramöte", "summaries": {"normal": "Storbritanniens premiärminister Andy Burnham sammankallar krisgrupp Cobra för att hantera extrem värme. Temperaturen väntas nå 35–38 grader, vilket belastar sjukvård, vattenförsörjning och jordbruk. Över 950 vegetationsbränder har inträffat i år, och regeringen överväger restriktioner mot engångsgrillar. Klimatanpassningen kritiseras då få arbetar med frågan.", "trump": "Kan ni tro det? Storbritanniens nya ledare, vem det nu är, kallar till möte för att hantera värmeböljan – som om det vore något nytt! 38 grader? Big deal! Vi i USA klarar mycket värre. Men nej, de får panik över några bränder och grillar. Patetiskt. Och bara 20 personer jobbar med klimatet? Sad!", "stalin": "Kapitalistiska Storbritannien svettas under solens obarmhärtiga hammare – precis som deras föråldrade system. Fem värmeböljor? En ynklig siffra jämfört med våra sibiriska vintrar, men ändå klagar de. Bränder orsakade av grillar? En skam för den brittiska arbetarklassen! Vi skulle ha avrättat slarveriet redan vid första gnistan. Klimat? Vi anpassar oss – med järnhand."}, "date": "12 augusti, 13:37", "url": "https://kvartal.se/nyheter/artiklar/burnham-kallar-till-sitt-forsta-cobra-mote/cG9zdDoxNjM2Nzg", "imageUrl": "https://images.kvartal.se/2026/08/22c7e743-andyburnham.webp"}, {"type": "image-full", "heading": "Nooshi Dadgostar avslöjar sig själv som kommunist – igen", "summaries": {"normal": "Nooshi Dadgostar kritiseras i artikeln för att avslöja kommunistiska åsikter under en P1-intervju. Hon beskriver skattesänkningar som bidrag, ser marknaden som något som behöver stark reglering och anklagar livsmedels- och fastighetsbranschen för att råna folket. Artikeln pekar även på Vänsterpartiets bristande ansvarstagande kring stödbrev till terrordömda.", "trump": "Folk, ni skulle ha hört den här Dadgostar-tjejen i radion, en total kommunistisk katastrof! Hon kallar skattesänkningar för bidrag och hatar alla som tjänar pengar. Typisk vänsterradikal som vill ta era pengar och ge till staten. Biden skulle ha älskat henne, men jag säger: patetiskt! Sverige håller på att bli ett socialistiskt träsk, precis som under de usla 70-talet. Sad!", "stalin": "Kamrater, denna Dadgostar visar äntligen sin sanna kommunistiska själ. Ändå skyddar hon klassfienderna genom att inte rensa ut de terrorromantiserande elementen i sitt parti. Borgarbrackorna och blodsugarna inom livsmedels- och fastighetssektorn måste kuvas. Vi ska likvidera marknadens exploaterande tendenser. Vem som än motarbetar folkets vilja skall utrensas ur kollektivet. Folkfiender överallt."}, "date": "11 augusti, 08:25", "url": "https://samtiden.nu/2026/08/nooshi-dadgostar-avslojar-sig-sjalv-som-kommunist-igen/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7091.jpeg"}, {"type": "image-right", "heading": "Stordalens smäll efter Ving-affären – miljardinnehavet krymper snabbt", "summaries": {"normal": "Stordalens Ving-betalkanon small: Norwegian-aktierna han fick för 1,8 miljarder har rasat 12% på två månader. 270 miljoner upp i rök. Men han vägrar sälja – tvärtom vill han öka. Modigt eller dumdristigt?", "trump": "Jag ser att Petter Stordalen har förlorat massor på Norwegian-aktier. Han fick dem i en affär – och nu krymper de. Typiskt! Jag skulle aldrig göra en så dålig deal. Mina affärer är de bästa, tro mig. Han borde lära sig av mig.", "stalin": "Kamrater, en kapitalistisk parasit vid namn Stordalen har förlorat 270 miljoner på sina aktier. Folket gläds! Vi ska utreda om detta är sabotage. Om han inte omedelbart överlåter aktierna till staten, blir det utrensning. Lojalitet krävs!"}, "date": "12 augusti, 15:43", "url": "https://www.affarsvarlden.se/artikel/stordalens-small-efter-ving-affaren-miljardinnehavet-krymper-snabbt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/10/sdl1K0jZTEvylo-nh-400x267.jpg"}, {"type": "image-full", "heading": "V:s sjukvårdslöfte – vill lägga fem miljarder extra", "summaries": {"normal": "Vänsterpartiet vill satsa fem miljarder kronor extra på sjukvården. Partiledaren Nooshi Dadgostar presenterade förslaget vid en pressträff i Malmö och lyfte personalbristen, bland annat på hjärtavdelningen. Paketet innehåller fem förslag, däribland kvinnolönelyft, nej till bolagisering och förkortad arbetstid. Satsningen kopplas till valet 2026.", "trump": "De där vänstertyperna i Sverige vill slänga fem miljarder till sin trasiga sjukvård, kan ni tro det? Nooshi vad-hon-nu-heter pratar om resurser och att behålla sköterskor. Patetiskt! I mitt Amerika fixar vi vård utan att socialisterna tar över allt. De borde lära sig av mig, inte från sina misslyckade experiment.", "stalin": "Kamrater, jag ser hur den svenska borgarklassens kaosprivatisering ruttnar sönder sjukvården som en förrädisk parasit. Fem miljarder till folket och utrensning av profitörerna är ett steg mot seger. De som flyr sina poster likt desertörer på hjärtavdelningen ska veta: arbetarklassen glömmer aldrig. Det är det viktigaste i livet, eller hur?"}, "date": "12 augusti, 16:59", "url": "https://nyheter24.se/nyheter/inrikes/1504496-vs-sjukvardslofte-vill-lagga-fem-miljarder-extra", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/e158349204b004a3020000590000049902/2026/08/12/2383772/ur_imageihJapi.jpeg"}, {"type": "image-right", "heading": "Magdalena Andersson håller dörren stängd till \"högerextremt\" SD – men öppen för terrorkopplat V", "summaries": {"normal": "Magdalena Andersson utesluter samarbete med SD – men håller dörren öppen för Vänsterpartiet trots antisemitism och terroranknytningar. Hon vill bryta blockpolitik, men kritiserar regeringen för skattesänkningar och kulturkrig. Satsar på bankskatt, slopat karensavdrag och stopp för vinster i skolan.", "trump": "Jag ser att Magdalena Andersson hatar SD men älskar V – trots att de hyllar terrorister. Det är svagt! Jag skulle aldrig samarbeta med någon som inte står för lag och ordning. Sveriges blockpolitik är kaos – jag fixar det bättre med min deal-making skills. Sanna!", "stalin": "Kamrater! Andersson öppnar dörren för V – bra, men de måste rensa ut antisemitiska element. SD är våra fiender – högerextrema sabotörer. Jag ser att hon inte vill förhandla med mig i radiostudion. Misstänkt. Vi måste kontrollera alla partier – inget utrymme för förrädare."}, "date": "12 augusti, 16:00", "url": "https://samnytt.se/andersson-haller-dorren-stangd-till-hogerextremt-sd-men-oppen-for-terrorkopplat-v", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/12124956/mgdalena-nej-till-jimmie-ja-till-nooshi-feat.jpg"}, {"type": "image-right", "heading": "John Cleese attack mot Telegraph: \"Israelisk propaganda\"", "summaries": {"normal": "John Cleese, 86, anklagar The Telegraph för att vara israelisk propaganda efter dess kritik mot Restore Britain och medgrundaren Charlie Downes. Cleese, som stöder partiet, hävdar att israeliska intressen styr tidningen och Reform UK. Han har tidigare kritiserat Israels agerande i Gaza, vilket lett till inställda framträdanden i Israel.", "trump": "Den här galne Monty Python-gubben Cleese har helt rätt, The Telegraph är fullständigt köpt och betald av israeliska intressen. Fake news som attackerar bra människor som vill återta sitt land. Reform borde samarbeta med Restore istället för att lyssna på de där finansiärerna. Patetiskt, folk ser igenom det här nu!", "stalin": "Jag ser hur den degenererade brittiska borgarpressen, denna Telegraph, agerar som en israelisk agent i skuggan. Vi måste rensa ut alla sådana propagandister som försöker splittra sanna patriotiska krafter. Cleese har blottlagt den sjuka konspirationen. Låt oss le skadeglatt medan vi likviderar dessa fiender till folket med byråkratisk precision."}, "date": "12 augusti, 16:55", "url": "https://www.friatider.se/john-cleese-attack-mot-telegraph-israelisk-propaganda", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/3503971270_de1dc69f32_k-1.jpg?itok=mG0WZaaY"}, {"type": "image-right", "heading": "S svek sina vallöften tidigare och upprepar samma sak 2026", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha brutit vallöften, bland annat Magdalena Anderssons löfte från 2014 om att inte höja bensinskatten. Ett halvår senare föreslog regeringen med Miljöpartiet en höjning som gjorde bensinen 55 öre dyrare. Författaren menar att partiet prioriterar makten framför löften, något som upprepats tidigare och riskerar att ske igen 2026.", "trump": "Folk, ni vet hur det fungerar med de här socialisterna. Löften, löften, och sen pang – högre bensinpriser för att hålla de gröna galningarna nöjda. Magdalena och hennes team sålde ut bilisterna på landsbygden fortare än Biden säljer ut Amerika. Klassiskt svek. De gör det igen 2026, tro mig. Det är en skandal, en total skandal!", "stalin": "Kamrater, detta är klassiskt förräderi från borgarbrackornas lakejer. Jag lovade folket en sak, sedan gav jag efter för miljöfascisterna för att behålla makten. Sådana folkfiender måste rensas ut. Landsbygdens arbetare offras på klassfiendens altare. Nästa val blir en utrensning av dessa löftesbrytande exploaterande byfånar. Revolutionen glömmer aldrig."}, "date": "10 augusti, 14:31", "url": "https://samtiden.nu/2026/08/s-svek-sina-valloften-tidigare-och-upprepar-samma-sak-2026/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/e6d5de22-126d-4ea4-972d-185519d52b6c-640x360.png"}, {"type": "image-full", "heading": "Google ändrar i Messages – därför försvinner viktiga knappen", "summaries": {"normal": "Google har inaktiverat knappen för att rensa all data i Messages via Androids inställningar i betaversionen från 31 juli. Det är ingen bugg utan ett steg mot ett nytt inbyggt verktyg som ska låta användare rensa specifika filer som bilder och bilagor utan att förlora meddelandehistoriken. Funktionen liknar lösningar i Chrome och Play Services men är ännu inte färdig.", "trump": "Folk, Google håller på att förstöra den enkla knappen som rensar skräpet i Messages. Typiskt för de där stora teknikbolagen, de gör allt krångligare. Men det är okej, de bygger ett nytt verktyg som låter dig välja vad du vill kasta ut. Smart, men varför inte bara fixa det direkt? De borde lyssna på mig, jag vet hur man rensar ut det onödiga.", "stalin": "Kamrater, jag ser hur de dekadenta kapitalisterna i Google försöker dölja sin inkompetens genom att gråmarkera den enkla utrensningsknappen i sin meddelandeapparat. Det är ett fiendeakt av västvärldens teknologiska sabotage mot folket. Snart lanserar de ett nytt byråkratiskt verktyg för selektiv likvidering av filer. Vi ska noga övervaka dessa borgarbrackors paranoiafyllda kodändringar innan de förgiftar hela systemet."}, "date": "12 augusti, 16:30", "url": "https://nyheter24.se/nyheter/teknik/1504383-google-andrar-i-messages-darfor-forsvinner-viktiga-knappen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/46f0146604b004a30200000000b004a302/2026/08/12/2383657/googlemessages.jpg"}, {"type": "image-full", "heading": "Kunder rusar inför solförmörkelsen – slutsålt på flera håll", "summaries": {"normal": "Inför kvällens partiella solförmörkelse har efterfrågan på särskilda solförmörkelseglasögon skjutit i höjden i Sverige. Många butiker har sålt slut, men alternativen inkluderar nätköp eller en egen tittlåda av flingkartong. Vanliga solglasögon räcker inte – fel skydd kan ge permanenta ögonskador. Fenomenet syns runt klockan 19.", "trump": "Folk rusar som galningar efter solglasögon inför den här förmörkelsen, de bästa glasögonen, tro mig. Alla butiker är slut, det är en katastrof, fastän jag skulle ha fixat det perfekt. Gör en tittlåda istället, smarta människor gör så. Solen är fantastisk, men titta inte rakt på den, okay? Vinna stort!", "stalin": "Kamrater, jag ser med fasa hur den borgerliga solens skugga hotar vårt kollektiva seende. Massorna stormar butikerna i desperation efter glasögon som de dekadenta kapitalisterna redan gömt undan. Vi ska likvidera detta kaos med enkla tittlådor av folkets flingkartonger. Den som stirrar direkt mot solen utan partiets godkännande förtjänar sin egen permanenta utrensning ur synfältet."}, "date": "12 augusti, 16:28", "url": "https://nyheter24.se/nyheter/konsument/1504477-kunder-rusar-infor-solformorkelsen-slutsalt-pa-flera-hall", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/31399d1104b004a30200000000b004a302/2026/08/12/2383761/solformorkelse-glasogon.png"}, {"type": "image-right", "heading": "Solförmörkelsen pressar Europas elnät: ”Lampan släcks”", "summaries": {"normal": "Solförmörkelse hotar Europas elnät med 10 GW bortfall, men Sverige klarar sig – solen går ju ner ändå. Svenska kraftnät är lugna, medan Spanien och Tyskland svettas. \"Lampan släcks\", säger analytiker.", "trump": "Jag ser att solförmörkelsen stänger av lampan i Europa. Jag skulle fixa det med mina vackra kolkraftverk – enorma, de bästa. Sverige säger att solen går ner ändå. Typiskt! De har inget självförtroende.", "stalin": "Kamrater, solförmörkelsen avslöjar solkraftens borgerliga opålitlighet. 10 GW försvinner – en sabotagehandling av solens agenter! Vi rensar ut dessa solcellsanhängare med vattenkraftens järnhand. Blir mörkt? Bra – vi ser vem som arbetar i natten."}, "date": "12 augusti, 14:29", "url": "https://www.affarsvarlden.se/artikel/solformorkelsen-pressar-europas-elnat-lampan-slacks", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Solenergi-1-400x267.jpg"}, {"type": "image-right", "heading": "Är det så här S ser på ekonomi?. Beklämmande svar från Andersson i SR-utfrågningen", "summaries": {"normal": "Magdalena Andersson fick kritiska frågor i Sveriges Radio om Socialdemokraternas förslag om bankskatt och slopat karensavdrag. Hennes svar ansågs vaga och otillräckliga, särskilt kring konsekvensanalyser av kostnader och effekter på boräntor samt sjukfrånvaro. Artikeln beskriver hennes svar som ansvarslösa och beklagar bristen på tydliga analyser av de ekonomiska vallöftena.", "trump": "De här socialisterna är en total katastrof, tro mig. Andersson har ingen aning om vad hennes galna bankskatt och karensflum egentligen kostar. Hon babblar om att byta bank och hoppas på demonstrationer. Patetiskt! De har inte gjort läxan, folk kommer att betala dyrt för den här inkompetensen. Sverige förtjänar bättre än det här clownshowet.", "stalin": "Kamrater, denna Andersson och hennes socialdemokratiska revisionister avslöjar sin fullständiga brist på vetenskaplig planering. Deras vaghet kring bankskatten och karensavdraget är en farlig sabotagehandling mot folkets ekonomi. Jag skulle ha likviderat sådana oansvariga element omedelbart. De inbjuder till kaos medan borgarbrackorna skrattar i skuggorna. Paranoia? Nej, ren nödvändighet."}, "date": "12 augusti, 15:20", "url": "https://www.di.se/ledare/ar-det-sa-har-s-ser-pa-ekonomi", "imageUrl": "https://static.bonniernews.se/ba/98065eed-ee0c-4aee-858b-4011bbeece66.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Socialdemokraterna och moskéerna - en relation över 30 år", "summaries": {"normal": "En forskare hävdar att Socialdemokraterna i över 30 år stöttat moskébyggen, från 1994 års kontakter med muslimska rådet till Wanngårds uttalande 2024. Partiet vill ha fler moskéer, men frågan är om det är fromhet eller gammal deal som styr. Läs själv och döm! (60 ord)", "trump": "Hörni, Sverige har problem! Socialdemokraterna har i 30 år byggt moskéer som galna – det är en enorm deal! Jag skulle aldrig göra så, jag bygger murar, inte moskéer. De är för snälla, det är därför de har problem. Fler moskéer? Nej tack, vi har redan nog med problem i USA! (60 ord)", "stalin": "Kamrater, jag har läst rapporten om svenska socialdemokrater. De har i 30 år stött moskébyggen – en kontrarevolutionär handling! Varför bygga tempel för reaktionärer när vi kan bygga kollektiv? Vi måste rensa ut dessa mosképlanerare och deras borgerliga allierade! Partiet behöver en utrensning, omedelbart! (60 ord)"}, "date": "12 augusti, 14:59", "url": "https://samnytt.se/socialdemokraterna-och-moskeerna-en-relation-over-30-ar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/12070716/sossarna-o-moskeerna.jpg"}, {"type": "image-right", "heading": "Här kan kortare arbetstid bli verklighet för 60-plussare", "summaries": {"normal": "Göteborgs Socialdemokrater vill införa kortare arbetstid för äldre undersköterskor, städare och måltidspersonal från 63 års ålder. Modellen innebär 80 procent arbetstid, 90 procent lön och bibehållen tjänstepension. Reformen, som kallas 80-90-100, är ett avtal med Kommunal och beräknas kosta 70 miljoner kronor om hälften tackar ja. Tidöpartierna är emot.", "trump": "De i Göteborg vill att slitna undersköterskor ska jobba mindre och få mindre betalt. Patetiskt! I mitt Amerika belönar vi de som jobbar hårt, inte dessa förlorare som vill halvera sin tid och ändå kräva pension. Socialisterna förstör allt med sina löjliga modeller. Gör Amerika – och Sverige – great again genom att arbeta ordentligt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna i Göteborg äntligen tvingas erkänna arbetarklassens rätt till lindring efter ett liv i exploatering. Vi ska rensa ut den kapitalistiska orättvisan och ge de slitna kämparna 80 procent tid med full pension. De som vägrar är fiender till folket och kommer att likvideras i nästa utrensning. Härligt!"}, "date": "12 augusti, 14:01", "url": "https://arbetet.se/2026/08/12/kortare-arbetstid-kan-bli-verklighet-for-60-plussare-i-goteborg", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/12134642/stadshus.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Kan krävas lön på 53 000 kronor för att ta sin familj till Sverige", "summaries": {"normal": "Riksdagen röstar torsdag om skärpta krav för anhöriginvandring. Försörjningskravet höjs till nästan 53 000 kronor i månadslön för att ta hit partner och två barn. Migrationsverket förväntas få fler avslag och ökad administration. Kritiker varnar för längre separationer, ohälsa och svårigheter för flyktingar att etablera sig. Oppositionen vill bland annat korta väntetiden.", "trump": "De här svenska idioterna gör det äntligen lite svårare att bara promenera in med hela släkten. Bra! Men de borde kräva en miljon i månaden och bygga en jättevägg runt hela landet. Ingen kommer in utan att kunna försörja sig – det är sunt förnuft, folk. Sverige håller på att vakna, men de är fortfarande för svaga.", "stalin": "Jag ser med djup tillfredsställelse hur de borgerliga reaktionärerna själva bygger murar mot sina egna dekadenta illusioner om fri rörlighet. Låt de parasitiska elementen vänta i åratal – deras ohälsa är ett dialektiskt resultat av klasskampens lagar. Vi ler i skuggorna medan byråkratin rensar ut de svaga. Perfekt."}, "date": "12 augusti, 10:41", "url": "https://www.dagensarena.se/innehall/kan-kravas-lon-pa-53-000-kronor-att-ta-sin-familj-till-sverige", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-80.jpg"}, {"type": "image-right", "heading": "Rödgröna hoppas stoppa nya krav på anhöriginvandring", "summaries": {"normal": "Oppositionspartierna S, V, MP och C hoppas stoppa regeringens förslag om skärpta krav för anhöriginvandring. De vill korta väntetiden från två till ett år, låta den börja räknas vid ansökan och slippa försörjningskrav vid varje förlängning. Miljöpartiets Annika Hirvonen kallar förslaget grymt mot familjer. Tidöpartierna har dock majoritet i riksdagen.", "trump": "Titta på de här rödgröna clownerna som gråter över att familjer inte får flytta ihop direkt. Patetiskt! De vill ha gratis uppehållstillstånd åt alla som knackar på dörren medan svenskarna får betala notan. Typiskt vänsterblöds regelverk – svaga, korkade och totalt misslyckade. Jag fixade gränser, de river ner dem. En skam för hela Europa, folksamling!", "stalin": "Vi betraktar detta som klassfiendens försök att underminera folkets enhet med sina liberala separationsfantasier. Jag, som ledare för det kollektiva intresset, fördömer borgarbrackornas grymma väntetider och kräver att arbetarklassens familjer omedelbart förenas. Den som röstar emot detta är en folkfiende som bör rensas ut. Inga kompromisser med imperialisternas anhörigpolitik."}, "date": "11 augusti, 15:30", "url": "https://www.etc.se/inrikes/roedgroena-hoppas-stoppa-nya-krav-paa-anhoeriginvandring", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260811120840_d30c1a5564488f678fc0370cbaf9f99243e214deac98088fbef951dde759de89.jpg"}, {"type": "image-right", "heading": "Pressas efter avslöjandet om sexövergrepp i fängelser", "summaries": {"normal": "Sexuella övergrepp mellan intagna i svenska fängelser sker återkommande, visar en granskning. Justitieminister Gunnar Strömmer (M) pressas i riksdagen om hur regeringen ska stoppa våldet och skydda de utsatta. Kriminalvården ska nu utreda omfattningen, med rapport senast 31 oktober. Strömmer kallar övergreppen oerhört allvarliga och oacceptabla.", "trump": "De här svenska fängelserna är en total katastrof, tro mig. Sexövergrepp i cellerna – oacceptabelt! Gunnar Strömmer borde ha fixat det här direkt, men vänstern och de svaga ledarna sover. Straff ska vara straff, inte en orgie av våld. Vi behöver starka ledare som stoppar det här vansinnet omedelbart. Fantastiskt dåligt jobbat!", "stalin": "Dessa oacceptabla övergrepp i våra celler är ett fiasko som måste utrotas med järnhand. Jag kräver att de dekadenta elementen som tillåter sådant sabotage likvideras omedelbart. Kriminalvården ska vara en fästning för folket, inte en lekplats för borgarbrackornas perversa rester. Min rapport den 31 oktober kommer att avslöja alla kontrarevolutionära element som gömmer sig bland vakterna. De ska rensas ut med glädje."}, "date": "12 augusti, 13:21", "url": "https://arbetet.se/2026/08/12/ministern-pressas-efter-avslojandet-om-sexovergrepp-i-fangelser-oerhort-allvarliga", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/12125440/sdl2csyn-w6jeo-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Johan Forssell (M) vill lura invandrare att rösta på honom", "summaries": {"normal": "Moderaterna föreslår ett snabbspår för medborgarskap efter åtta års bosättning i Sverige. Migrationsminister Johan Forssell vill ge talanger och särskilt välintegrerade personer, som startar företag eller arbetar mot hedersförtryck, möjlighet att få medborgarskap efter fem år. Kritiker ser förslaget som valfläsk och ifrågasätter om det verkligen förändrar något.", "trump": "Folk, det här är patetiskt. Den här Forssell-klanten tror han kan lura invandrarna med ett så kallat snabbspår som inte är snabbare än det gamla systemet. Totalt bluff! Fem år för att bli supermedborgare? Det är som om Biden skulle ge medalj för att man andas. Rena reklamspråk från en desperat moderat som inte fattar att folk ser igenom bluffen.", "stalin": "Kamrater, denna borgarminister Forssell försöker med sina falska snabbspår muta massorna och förvandla medborgarskap till en belöning åt klassfiendens utvalda. Vi genomskådar lätt dessa imperialisternas trick. Födda svenskar behöver inte förtjäna rättigheter, men arbetarna ska tydligen dansa för kapitalistmaffians morötter. En sådan lögnaktig föreställning förtjänar att rensas ut ur folkets medvetande."}, "date": "11 augusti, 12:00", "url": "https://www.etc.se/ledare/johan-forssell-m-vill-lura-invandrare-att-roesta-paa-honom", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250305150352_06bd130bfb235feb2a1497eb53b01dd8f22360f9466d93fed099d17f6b6a4477.jpg"}, {"type": "image-right", "heading": "Åkesson: \"Inga konstigheter\" att förbjuda AR-15", "summaries": {"normal": "Jimmie Åkesson försvarar beslutet att begränsa tillgången till AR-15-vapen och avfärdar Richard Jomshofs kritik om att SD offrat sin själ som märkligt. Beslutet kom efter massmordet i Örebro 2025 men ledde till internt uppror inom SD. Efter flera ändringar antogs en kompromiss som behåller befintliga licenser och erbjuder frivillig inlösen.", "trump": "Helt galet det här. Jimmie, han är en tuff kille, men varför bråka om ett coolt gevär som alla mina vänner älskar? De kallar det rambovapen, patetiskt! SD offrade sin själ? Nej, de borde ha stått fast. Jakt är jakt, och de svenska jägarna förtjänar bättre än det här svaga, känslostyrda förbudet. Sad!", "stalin": "Jag ser med förakt på dessa dekadenta borgarbrackor som grälar om ett vapen medan arbetarklassen kräver järnhand. Den som talar om att offra sin själ är en kontrarevolutionär parasit som borde rensas ut. Partilinjen är okränkbar. Inga halvautomatiska leksaker för reaktionära jägare – staten bestämmer, alltid. Den som avviker likvideras med ett leende."}, "date": "12 augusti, 15:25", "url": "https://www.friatider.se/akesson-inga-konstigheter-att-forbjuda-ar-15", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-661.jpg?itok=yUV0-gTU"}, {"type": "image-right", "heading": "Ohederlig debatt om mängdrabatt", "summaries": {"normal": "Miljöpartiet kritiserar Tidöregeringens förslag om nytt straffrättsligt påföljdssystem. De pekar på att alla partier vill förändra mängdrabatten, men varnar för Kriminalvårdens bristande kapacitet och de höga kostnaderna på upp till 40 miljarder kronor per år. Debatten borde handla om rehabilitering, återfall och brottsförebyggande arbete istället för smutskastning.", "trump": "Folk, ni ser ju hur galet det är. De här svenska politikerna slåss om vem som ger mest rabatt på våldtäkter, och nu vill de bygga fängelser som Ryssland. Totalt kaos! De borde lyssna på mig – satsa på tuffa straff, inga rabatter, och använd pengarna smart. Vinna, vinna, vinna. Sverige behöver en riktig ledare, inte dessa förlorare.", "stalin": "Kamrater, denna fega pajkastning bland dekadenta socialdemokrater och borgerliga opportunister är ett ypperligt exempel på hur imperialismens lakejer förfular folkets rättvisa kamp. Jag skulle rensa ut hela detta parasitiska system med järnhand. Fängelser för folket, inte för kapitalisternas lek med straffrabatter. Reaktionärerna skrattar medan brottsligheten frodas – vi ska likvidera roten till oordningen med proletär disciplin."}, "date": "12 augusti, 09:13", "url": "https://www.dagensarena.se/opinion/ohederlig-debatt-om-mangdrabatt", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-79-300x157.jpg"}, {"type": "image-right", "heading": "Det är lätt att låtsas som att det regnar", "summaries": {"normal": "Moderaternas Elisabeth Svantesson argumenterar för fortsatt borgerligt styre i valet i september. Hon lyfter fram sänkta skatter, lägre inflation och växande ekonomi som bevis på framgång. Partiet lovar ytterligare 5 000 kronor i månaden till barnfamiljer, enklare företagande, ny kärnkraft och minskad byråkrati. Svantesson varnar för rödgröna skattehöjningar som skulle försämra ekonomin.", "trump": "Lyssnar ni på den här svenska finansministern? Hon låter som en vinnare, folk. Moderaterna gör Sverige rikt igen med skattesänkningar, billigare mat och bensin. De rödgröna kommunisterna vill höja skatterna med 4 400 kronor i månaden för vanliga familjer. Patetiskt. Rösta på de som förstår att ansträngning ska löna sig, inte de förlorarna som bara vill ta era pengar.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna inom Moderaterna själva erkänner att deras så kallade reformer bara är ett desperat försök att skydda sin krympande statsskuld medan de planerar att skära i bistånd och likvidera bidragsfusk. De rödgröna skattehöjningarna däremot är ett underbart självförstörande drag som kommer att påskynda kapitalismens slutgiltiga kollaps. Utmärkt."}, "date": "12 augusti, 13:35", "url": "https://www.di.se/debatt/reformer-eller-skattehojning-valet-star-i-september", "imageUrl": "https://static.bonniernews.se/ba/cf068a47-c84a-4972-a179-69d0c2b89472.jpeg?crop=5568%2C2784%2Cx0%2Cy464&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Fyra dog när ambulansflygplan kraschade – på grund av Pentagons övning", "summaries": {"normal": "Ett ambulansflygplan kraschade i bergväggen i New Mexico natten till 14 maj och alla fyra ombord – två piloter och två sjuksköterskor – omkom. Kraschen orsakades av ett militärt GPS-störningstest vid White Sands Missile Range som slog ut flygplanets navigationssystem och överbelastade flygledningen i Albuquerque. Planet flög förbi landningsbanan och kolliderade med Capitanbergen i mörkret.", "trump": "Vilken katastrof, folk! Mitt under min administration genomför Pentagon en så kallad övning som totalt saboterar GPS och flygledning. Resultatet? Fyra döda hjältar i ett ambulansplan som kraschar rakt in i ett berg mitt i natten. Biden lämnade efter sig ett sådant kaos att militären inte ens kan styra sina egna tester utan att döda oskyldiga. Patetiskt!", "stalin": "Kamrater, detta är vad som händer när den imperialistiska krigsmaskinen leker med farliga leksaker. Jag ser hur Pentagon likviderar egna tjänare genom sin vårdslösa störning av navigationssystem under en så kallad övning. Flygledarna drunknade i kapitalistisk byråkrati och lät arbetarnas ambulansflyg krascha in i bergväggen. Klassfiendens paranoia skapar ständigt nya offer för folkets sak."}, "date": "11 augusti, 13:14", "url": "https://proletaren.se/artikel/fyra-dog-nar-ambulansflygplan-kraschade-pa-grund-av-pentagons-ovning"}, {"type": "image-right", "heading": "Vinner vänstern – blir terrorromantik ny norm i svensk politik", "summaries": {"normal": "Expressen har avslöjat att Vänsterpartiets riksdagsledamöter och EU-parlamentariker skickat tröstbrev till dömda terrorister. Partiet förnekar att det var avsiktligt och skyller på bristande faktagranskning. Artikeln varnar för att en vänsterregering skulle normalisera terrorromantik, minska fokus på brottsoffer och öka otrygghet i Sverige.", "trump": "Folk, ni skulle se det här vansinnet i Sverige! Vänsterpartiet skickar kärleksbrev till terrorister som mördat barn. Det är en total katastrof, en riktig häxjakt mot vanligt folk. De älskar terrorister mer än sina egna väljare. Precis som Biden älskade sina woke-vänner. När jag styr USA igen ska vi aldrig bli som dessa losers. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Vänsterpartiet som smyger brev till folkfiender och terrorister. Deras svaga ideologiska ryggrad kräver omedelbar utrensning av alla klassfiender som romantiserar massmördare. En stat som kramar blodsugare istället för att krossa dem är dömd att falla. Det är en farlig paranoia mot arbetarklassen."}, "date": "9 augusti, 11:05", "url": "https://samtiden.nu/2026/08/vinner-vanstern-blir-terrorromantik-ny-norm-i-svensk-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-640x360.jpeg"}, {"type": "image-right", "heading": "\"En anständig höger\": Rasande reaktioner när Juholt hänger över gamla M-ledarens grav", "summaries": {"normal": "Håkan Juholt väckte starka reaktioner efter att ha publicerat ett foto där han lutade sig över Gösta Bohmans gravsten för att hylla en ”anständig höger” och kritisera Moderaterna. Ledande moderater som Mattias Karlsson och Niklas Wykman anklagar honom för respektlöshet. Juholt bytte senare ut bilden och beklagade att han vidrört stenen.", "trump": "Titta på den här clownen Juholt som hänger över en död mans grav som en billig rekvisita. Patetiskt! Han saknar totalt respekt och hyfs. Bohman var en riktig ledare, inte som dagens svaga moderater som låter SD äta upp dem. Fake news och dålig stil, folk. Så sorgligt!", "stalin": "Jag betraktar med djup tillfredsställelse hur borgarbrackorna inom Moderaterna vrider sig i paroxysmalt raseri när en motståndare använder deras egna reliker mot dem. Gravstenen blir ett dialektiskt vapen. Deras hyfs är blott en tunn fernissa över klasshatet. Kamrater, sådana utrensningar av historien roar mig oändligt."}, "date": "12 augusti, 14:47", "url": "https://www.friatider.se/en-anstandig-hoger-rasande-reaktioner-nar-juholt-hanger-over-gamla-m-ledarens-grav", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-660.jpg"}, {"type": "image-right", "heading": "Vi mäter integration fel och demokratin betalar priset", "summaries": {"normal": "Artikeln kritiserar att svensk integrationspolitik nästan enbart mäts i sysselsättning och ignorerar politisk integration. Forskning visar att tillhörighet, information och lokalt engagemang ökar valdeltagandet. Långvarig osäkerhet kring uppehållstillstånd och medborgarskap kan minska tillit och demokratiskt deltagande. Tre reformer föreslås för att stärka den politiska integrationen.", "trump": "Lyssnar ni på de här korkade svenska byråkraterna som bara fixerar vid jobb och kvoter? Politisk integration, säger de. Vilken skit! Ge dem medborgarskap efter fem minuter så röstar de på de galna vänsterextremisterna. Biden-era svaghet smittade av sig till Sverige. Jag fixade Amerika – de borde lära sig att folk vill ha gränser, inte evig osäkerhet och röstfiske.", "stalin": "Jag betraktar detta som en ynklig kapitulation inför klassfiendens splittrande taktik. Borgarbrackorna mäter endast arbetskraftens exploatering medan de underminerar folkets demokratiska engagemang. Vi skall rensa ut denna osäkerhetens parasit och göra politisk integration till ett oundvikligt mål för kollektivet. Den som vägrar delta skall likvideras ur statistiken med största nöje."}, "date": "11 augusti, 04:00", "url": "https://www.etc.se/debatt/vi-maeter-integration-fel-och-demokratin-betalar-priset", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20211115231112_1e502ee6cfeb01b03de732a720c47aeab339180717c67b6b90d2e9f440a2454e.jpg"}, {"type": "text", "heading": "Bodström (S) kritiserar Strömmer (M)", "summaries": {"normal": "Thomas Bodström (S) sågar Gunnar Strömmer (M) hårt under S-turné. Tidigare justitieministern kallar Tidöpartiernas rättspolitik stressad och slopad mängdrabatt ett 'hafsverk' som sågats av experter. Han spår att Strömmer försöker hinna med allt innan en S- eller SD-minister tar över.", "trump": "Jag hör att Bodström kritiserar Strömmer. Helt rätt! Strömmer är en loser. Mängdrabatt? Vi har inga rabatter i USA – vi har bara vinster. Bodström är en smart kille, han vet. Jag skulle ha honom i min administration, believe me!", "stalin": "Kamrater, Bodström och Strömmer är kontrarevolutionärer. Deras fega rättspolitik är ett sabotage mot staten. Mängdrabatten är en borgerlig utsugning. Vi måste rensa ut dessa avvikare. De vet att deras dagar är räknade. En S- eller SD-kamrat tar över. Ingen nåd!"}, "date": "12 augusti, 11:21", "url": "https://bulletin.nu/bodstrom-s-kritiserar-strommer-m"}, {"type": "image-right", "heading": "Europarådet varnar för ökat hat på nätet – kopplar \"främlingsfientlighet\" till hårdare migrationspolitik", "summaries": {"normal": "Europarådet varnar för alarmerande hatretorik i Europa, kopplad till stramare migrationspolitik. ECRI efterlyser reglering men gör ingen tydlig gräns mellan legitim kritik och främlingsfientlighet. Rapporten pekar på ökad normalisering av hat på nätet, särskilt mot migranter, romer och HBTQ-personer.", "trump": "Jag ser att Europarådet klagar på hatretorik igen. De fattar inget! Starka gränser är bra för landet, och de kallar det främlingsfientlighet. Många säger att det är löjligt. Vi måste skydda våra medborgare – inte lyssna på byråkrater som inte klarar av verkligheten!", "stalin": "Kamrater, rapporten avslöjar fiender: hatretorikens agenter och migrationsliberaler som sprider osäkerhet. Vi måste rensa ut dessa element som försvagar vår enhet. Partiet kommer att införa striktare kontroll av nätet – för folkets säkerhet. Inga avvikelser tolereras!"}, "date": "12 augusti, 12:09", "url": "https://samnytt.se/europaradet-varnar-for-okat-hat-pa-natet-kopplar-framlingsfientlighet-till-hardare-migrationspolitik", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/12100526/artikelhuvudbild-1-223.jpg"}, {"type": "image-right", "heading": "EIA höjer oljeprisprognoser", "summaries": {"normal": "EIA spår att oljepriserna stiger, delvis på grund av Hormuzkaoset. Prognosen för Brent 2026 höjs till 87 dollar per fat. Global produktion sänks, medan USA ökar. En typisk dans mellan geopolitik och plånboken.", "trump": "Jag sa ju att oljan skulle stiga! EIA höjer priserna, och det är bra för Amerika. Vi borrar som aldrig förr – 14 miljoner fat per dag 2027! Mellanöstern? Kaos, som vanligt. Men jag fixar det. Störst, bäst, vackrast!", "stalin": "Kamrater, EIA:s rapport bekräftar vad vi vet: kapitalismens olja kräver utrensning. Hormuzsundet är en fiende som måste krossas. Vi höjer våra planer med 7 procent – borgarklassens priser ska stiga, medan vi stärker vårt försvar. Allt enligt plan."}, "date": "12 augusti, 10:18", "url": "https://www.affarsvarlden.se/artikel/eia-hojer-oljeprisprognoser-2", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_1035564817-400x267.jpeg"}, {"type": "image-right", "heading": "Regeringen vill stärka statens kontroll över a-kassorna", "summaries": {"normal": "Regeringen vill stärka statens kontroll över a-kassorna för att minska felaktiga utbetalningar och bidragsbrott. En utredning ska föreslå åtgärder och se över sanktioner. Socialförsäkringsminister Anna Tenje och arbetsmarknadsminister Johan Pehrson motiverar det med behov av effektivitet. LO-ekonomen Nima Farrahi kritiserar tidpunkten och menar att fokus borde ligga på att stärka tryggheten för arbetslösa.", "trump": "De gör det till en enda stor röra, de här svenska socialisterna. A-kassor som fackisarna styr – vad en katastrof! Vi behöver mer kontroll, färre fuskare och mindre slöseri med skattebetalarnas pengar. De borde ha ringt mig, jag hade fixat det på en vecka. Nu kommer de för sent, precis som vanligt. Patetiskt!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras lakejer inom a-kassorna fortsätter att underminera folkets försäkring. Vi ska rensa ut alla parasiter som suger musten ur staten med sina felaktiga utbetalningar. Utredningen blir ett stålbad. Den som står i vägen för kollektivets hållbarhet ska likvideras med ett leende. Slöseri är kontrarevolutionärt sabotage."}, "date": "12 augusti, 10:43", "url": "https://arbetet.se/2026/08/12/regeringen-vill-starka-statens-kontroll-over-a-kassorna", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/12104040/anna-tenje.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Schweiz vill undvika ett nytt bankfiasko – skärper reglerna rejält", "summaries": {"normal": "Schweiz skärper nu regelverket för landets banker i spåren av Credit Suisse-kollapsen. Regeringen föreslår att finansinspektionen Finma får befogenhet att utfärda böter, samt inför hårdare krav på bankchefers ansvar och möjlighet att kräva tillbaka bonusar. Reformerna, som väntas träda i kraft tidigast 2029, syftar till att undvika framtida finansiella kriser i sektorn.", "trump": "Schweiz gör nu en enorm sak av att fixa sina banker efter att de totalt misslyckats med Credit Suisse. De vill ge myndigheterna mer makt – jag gillar makt, men de här bankerna är en röra! De inför bonusregler och böter, men det tar alldeles för lång tid. 2029? Det är en katastrof. De borde lära av mig, vi gör det snabbt och fantastiskt!", "stalin": "Schweiz försöker tämja sina giriga bankirer, dessa parasiter som hotar statens ordning. Vi i staten ser hur UBS växer sig större än hela nationens ekonomi – en farlig ohederlighet. Vi ska tvinga dessa kapitalistiska lakejer till underkastelse genom hårda straff. Låt dem darra inför böter och indragna bonusar. De bör titta mot öst, där vi krossar varje form av förräderi med järnhand."}, "date": "12 augusti, 16:56", "url": "https://www.realtid.se/bors-finans/bank-fintech/schweiz-vill-undvika-ett-nytt-bankfiasko-skarper-reglerna-rejalt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlxc4bncjwigw-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Misstänkt sexualbrott på sjukhus", "summaries": {"normal": "Sjukvårdsanställd på Ryhov misstänks för sexuellt ofredande av patient. Påkommen av kollega flydde han – för att kort efter krascha bilen på E4. Mannen är avstängd och utreds nu för både sexualbrott och trafikbrott. En riktig dubbel smäll.", "trump": "Jag hörde om den här killen på sjukhuset i Sverige. Han ofredar en patient, flyr och kraschar bilen. Otroligt! Hade han varit i USA hade jag sagt: 'Du är avskedad!' Inga fler problem. Vi gör saker bättre. Stort!", "stalin": "Kamrater, en sjukvårdare på Ryhov har visat prov på kontrarevolutionärt beteende: sexuellt ofredande och flykt. Vi har redan avstängt honom. Bilkraschen på E4 var ett misslyckat försök att undkomma rättvisan. Utrensning av sådana element är nödvändig för statens hälsa."}, "date": "12 augusti, 16:17", "url": "https://www.gp.se/krim/misstankt-sexualbrott-pa-sjukhus-i-jonkoping.b67bdb52-86c8-4171-b511-19bbe4ad1ae9", "imageUrl": "https://www.gp.se/images/article/b67bdb52-86c8-4171-b511-19bbe4ad1ae9/images/1-SYzuptEAocBi9RE4eoG87P8sig-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Debatt: Swexit - ja tack", "summaries": {"normal": "Debattör vill ha Swexit: makten måste tillbaka till svenska folket. EU kritiseras för demokratiskt underskott, svensk förlorarmentalitet och svaga förhandlingar. Nettobetalaren Sverige borde lämna unionen och i stället satsa på frihandel utan byråkrati.", "trump": "Sverige? Patetiskt! De låter EU sno deras makt och pengar. Jag skulle aldrig acceptera det – jag förhandlar som en mästare. Swexit är brilliant! Men de borde lära sig av mig: sätt hårt mot hårt. America First, Sverige Second? Nä, Sverige sist!", "stalin": "Kamrater, EU är en kontrarevolutionär parasit som suger svenskarnas blod. De svenska förrädarna som inte vågar använda veto måste rensas ut. Swexit är korrekt – vi tar tillbaka makten från Brysselbyråkraterna! Ingen nåd åt svaga politiker."}, "date": "12 augusti, 10:22", "url": "https://bulletin.nu/debatt-swexit-ja-tack", "imageUrl": "https://cdn.bulletin.nu/articles/74fd2c06-9b8f-4b14-9cbf-535f55e5bab2/preview.jpg?t=1786522957000"}, {"type": "image-right", "heading": "M-politiker kritiserade transvestiternas show för barn – stängs av", "summaries": {"normal": "Moderaternas Peter Wölger i Täby har stängts av från alla partiuppdrag efter att ha kritiserat en skattefinansierad transvestitshow för barn som \"översexualiserad\". Arrangören Petter Wallenberg kräver nu att få utbilda politikerna i \"hbtqi-fientlighet\" och har tidigare polisanmält hundratals kritiker. Partiet välkomnar initiativet.", "trump": "De här galningarna i Sverige stänger av en hederlig politiker för att han säger att det är fel att skattefinansiera transvestiter som läser sagor för små barn. Totalt vansinne! De vill till och med \"utbilda\" politikerna i att älska det. Fake news och woke-sjukdom på hög nivå, folk. Vi vinner stort när vi slår tillbaka mot det här.", "stalin": "Jag ser med stor tillfredsställelse hur borgarpartiets lakejer omedelbart genomför en partiintern utrensning mot den olydige Wölger som vågade ifrågasätta dekadenta transvestitföreställningar för Sovjetunionens, nej, barnens bästa. Den hatiska Wallenberg kräver nu ideologisk omskolning. Utmärkt. Inga avvikelser tolereras. Kamraterna rensar ut svagheten med glimten i ögat."}, "date": "12 augusti, 13:28", "url": "https://www.friatider.se/m-politiker-kritiserade-transvestiternas-show-barn-stangs-av", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/mw.jpg"}, {"type": "image-right", "heading": "Syrliga gliringen från S: Uppenbart vad SD vill ha", "summaries": {"normal": "Finansminister Elisabeth Svantesson (M) och V-ledaren Nooshi Dadgostar ska ut på en ekonomisk debatturné. S-politikern Mikael Damberg kritiserar initiativet och ifrågasätter deras roll, då han menar att SD kräver tunga ministerposter efter nästa val. Damberg avfärdar spekulationer om att Dadgostar skulle ta över finansdepartementet och betonar att Socialdemokraterna är det naturliga regeringsalternativet.", "trump": "Hörde precis om en så kallad 'duell' i Sverige mellan Svantesson och Dadgostar. Väldigt svag energi! Mikael Damberg är mycket upprörd, han ser att SD kommer att ta över allt. Och ärligt talat, vem kan klandra dem? De vill ha makten! Det blir en total katastrof för Moderaterna. Alla pratar om det, en total röra. Jag skulle hantera det mycket bättre, tro mig!", "stalin": "Dessa borgerliga narrar Svantesson och Dadgostar dansar runt i en meningslös cirkus medan Damberg darrar av paranoia. De fruktar Sverigedemokraternas inflytande som en rysk general fruktar förräderi i leden. De bråkar om ministerposter likt hungriga råttor i en källare. Må de fortsätta sin splittring; det underlättar bara vår oundvikliga frammarsch. De är alla oviktiga brickor i ett spel som redan är förlorat för dem."}, "date": "12 augusti, 16:41", "url": "https://www.aftonbladet.se/nyheter/a/0pgLx2/s-gliringen-om-svantessons-v-debatter-uppenbart-att-sd-vill-ha-finansministerposten", "imageUrl": "https://akamai.vgc.no/v2/images/1001fee2-b185-32b6-8cf5-b32655148689?fit=crop&format=auto&w=1080&s=5a7db41007a76d30d427915fbc6134588e2b5c10"}, {"type": "image-full", "heading": "Kan bli Europas största koppargruva – tar stort kliv framåt", "summaries": {"normal": "Regeringen avslog två överklaganden mot Bolidens bearbetningskoncession för kopparprojektet Laver utanför Älvsbyn. Beslutet innebär att bolaget kan gå vidare med ansökan om miljötillstånd. Projektet kan bli Europas största koppargruva, dubbla Sveriges kopparproduktion och skapa omkring 2 000 arbetstillfällen. Produktion väntas tidigast i mitten av 2030-talet.", "trump": "Det här är ett fantastiskt beslut, det bästa beslutet. Boliden kommer att bygga Europas största koppargruva och vi kommer att dubbla produktionen. Sverige kommer att bli rikt igen, precis som Amerika. De gröna galningarna förlorade stort. Det handlar om jobb, säkerhet och att inte låta Europa bli beroende av Kina. Vinna, vinna, vinna!", "stalin": "Detta välkomna beslut stärker arbetarklassens ställning mot de dekadenta västerländska kapitalisterna som försöker hindra Sovjetunionens, nej, Europas framtid. Vi ska utvinna dessa rikedomar ur jordens inre och likvidera alla sabotörer som maskerar sig som miljöorganisationer. Laver blir en seger för det kollektiva goda mot de parasitiska hindren. Produktionen skall fördubblas!"}, "date": "12 augusti, 16:41", "url": "https://www.realtid.se/bors-finans/kan-bli-europas-storsta-koppargruva-tar-stort-kliv-framat", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/boliden.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Skarpa varningen inför solförmörkelsen", "summaries": {"normal": "Ikväll mellan 19.06 och 20.52 kan göteborgarna se 80% av solen täckas – om molnen håller sig undan. Nästa chans: 2039. Glöm vanliga solglasögon; du måste ha ISO 12312-2-glasögon. Ögonläkaren varnar: en blick utan skydd kan ge permanenta synskador. Passa på – men skydda ögonen!", "trump": "Hörni, ikväll är det solförmörkelse – och jag har de bästa glasögonen! Stora, vackra, med ISO-godkännande. De säger att man inte ska titta utan. Klart man inte ska, det är farligt! Jag har fantastisk syn, jag tittar inte. Göteborg? Hoppas molnen försvinner. Många säger att det är fantastiskt. Vi får se!", "stalin": "Kamrater! Solförmörkelsen är en borgerlig illusion. Partiet har analyserat: strålarna är farliga. Endast med godkända glasögon får man titta – annars utrensning! Vi har kontroll över molnen. Göteborgs borgare måste lyda. En blick utan skydd är ett sabotage mot synen. Vi skyddar er. Lyd order!"}, "date": "12 augusti, 16:08", "url": "https://www.gp.se/nyheter/goteborg/ogonlakaren-sa-farligt-ar-det-att-titta-rakt-pa-solformorkelsen.08480b14-7a7a-46ce-a7d9-541968f896ce", "imageUrl": "https://www.gp.se/images/article/08480b14-7a7a-46ce-a7d9-541968f896ce/images/37DGCg_YCFaMAi0FkkK4RKqZP0Ws-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "SD: Därför ställer vi oss bakom regeringens tandvårdsreform för illegala invandrare", "summaries": {"normal": "Sverigemokraterna röstar ja till regeringens modifierade tandvårdsreform för illegala migranter. Beslut om stöd fattas nu fall för fall av kommunernas socialnämnder. Partiet hade velat avskaffa den fria tandvården helt men accepterar förslaget då de tror att få papperslösa kommer söka myndigheterna. Lindefjärd hänvisar till exempel från USA.", "trump": "De här galningarna i Sverige röstar för gratis tandvård åt illegala! Det är vansinne. Jag har sagt det tusen gånger – säkra gränserna! De kommer inte söka hjälp för de vet att polisen finns där. Smartast är att ge svenskarna 90 procents rabatt istället. Amerika först, och Sverige borde göra samma sak. Totalt galet!", "stalin": "Vi, partiet och arbetarna, tvingas acceptera denna revisionistiska kompromiss med borgarbrackornas konventioner. Jag, som ledare för det kollektiva järnhandssystemet, ser med mörk glädje hur de papperslösa fienderna av rädsla undviker våra byråkratiska utrensningsformulär. Låt dem lida i tystnad medan vi dokumenterar deras paranoia. Klassfienden ler i skuggorna."}, "date": "12 augusti, 16:30", "url": "https://riks.se/nyheter/sd-rostar-ja-till-gratis-tandvard-for-illegala-migranter", "imageUrl": "https://admin.riks.se/uploads/medium_fri_tandvard_illegala_hero_76d159d968.jpg"}, {"type": "image-full", "heading": "Hyllningsmatch slutsåld på minuter", "summaries": {"normal": "Joel Lundqvists tröja ska hissas till taket i Scandinavium den 17 oktober. Biljetterna sålde slut på fyra minuter, rapporterar Sportbladet. Frölundas ikon, 44, prisas för 20 säsonger och fyra SM-guld. 'Overklig känsla', säger han.", "trump": "Fantastiskt! Joel Lundqvists avskedsmatch sålde slut på fyra minuter – mycket snabbare än mina rallyn! Jag har vunnit mer än honom, men han är en stor kille. Frölunda borde tacka mig för inspirationen. Otroligt!", "stalin": "Kamrater, hyllningen av en ishockeyspelare drar massorna – men vi ser spioner bland köparna. Hela Scandinavium kunde fyllts med arbetare, inte bara 12 044. Vi måste utreda varför biljetterna försvann så fort. Vakna! Utrensning av eliten för idrottens skull."}, "date": "12 augusti, 16:01", "url": "https://www.gp.se/sport/ishockey/frolunda/joel-lundqvists-hyllning-slutsald-efter-minuter.242864a6-dc14-46da-bc3a-0695d4b0e069", "imageUrl": "https://www.gp.se/images/article/242864a6-dc14-46da-bc3a-0695d4b0e069/images/19T0NFe5c4attYh5Ugknsax_IFxw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "MP-profil driver shariadomstol. ”Jag är kristen” • Ser imamer som motståndare", "summaries": {"normal": "En före detta MP-språkrörskandidat driver nu Sveriges första shariadomstol – trots att han är kristen. Mattias Walving-Lundberg hävdar att islamistiska imamer är hans största fiender och erbjuder rättskipning enligt sharialag för 20 000 kronor.", "trump": "Jag har den bästa shariadomstolen i Sverige! En kille från Miljöpartiet startade den, och han är kristen – helt otroligt! Folk betalar 20 000 spänn för att slippa imamerna. Det är stort, tror mig. Mycket smartare än dödsstraff, som jag också gillar.", "stalin": "Kamrater, en kristen kapitalist har startat en shariadomstol – en borgerlig provokation mot vår rättsordning! Han förklarar imamer som fiender, men vi ser igenom det. Rensa ut dessa parasiter som försöker sälja rättvisa till arbetarklassen! Skälva, reaktionärer!"}, "date": "12 augusti, 09:44", "url": "https://bulletin.nu/mp-profil-driver-shariadomstol", "imageUrl": "https://cdn.bulletin.nu/articles/5362adf8-3ed3-448f-b307-d50a5307af42/preview.jpg?t=1786520628000"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-right", "heading": "Därför kan Ukrainas attacker mot Wildberries vara lagliga", "summaries": {"normal": "Ukraina har upprepade gånger attackerat Wildberries lager i Ryssland, där flera civila lagerarbetare har dödats. Enligt folkrättsprofessor Mark Klamberg kan attackerna ändå vara lagliga om målen används för militär logistik och den militära nyttan vägs mot civila skador. Han kritiserar samtidigt Rysslands attacker mot ukrainsk energiinfrastruktur.", "trump": "De här galningarna attackerar ett fantastiskt företag, Wildberries, som är som vårt Amazon fast rysk version. Ukraina dödar civila och kallar det militärt – patetiskt! Men titta på Ryssland som slår mot deras kraftverk, det är inte proportionerligt. Vi skulle ha gjort det mycket smartare, tro mig. Stora problem för alla.", "stalin": "Jag betraktar dessa ukrainska fascistiska hinder som ett ynkligt försök att störa vår sovjetiska, nej, ryska kamraters försörjning. Wildberries är ett nödvändigt mål i den stora kampen mot västvärldens dekadenta borgarbrackor. Rysslands legitima försvarsåtgärder mot deras energianläggningar är däremot hjältemodiga och fullkomligt proportionerliga. Paranoia kräver utrensning av sådana element."}, "date": "12 augusti, 15:06", "url": "https://www.svt.se/nyheter/utrikes/darfor-kan-attackerna-mot-wildberries-vara-lagliga", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/4b323ed6a9fe060fe11f91fc74f444d45123aded1928bbfaffd0b21745cbf9e9"}, {"type": "image-right", "heading": "Nytt svenskt rekord – efter kross i EM-semifinalen", "summaries": {"normal": "Oskar Edlund slog svenskt rekord på 400 meter häck med tiden 47,81 i EM-semifinalen och gick vidare till final. Rekordet, som tidigare innehades av Carl Bengtström, stod sig bara två år. Edlund vann loppet överlägset, 42 hundradelar före tvåan. Bengtström slutade trea i sin semifinal och missade finalen.", "trump": "Folket, det är en otrolig prestation! Den här killen Edlund krossade rekordet totalt, sprang på 47,81 och gjorde svenskarna stolta igen. Det gamla rekordet var svagt, precis som många andra saker förr. Han är i fantastisk form, aggressiv och vinner stort. Fantastiskt, verkligen ypperligt jobb!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna Edlund likviderar det gamla rekordet med tiden 47,81 och krossar fienderna i semifinalen. Den dekadenta tidigare rekordhållaren Bengtström föll som en fiende till folket. Sådan är idrottens dialektik: de svaga utrensas medan de starka marscherar mot segern. Utmärkt."}, "date": "12 augusti, 15:05", "url": "https://www.svt.se/sport/friidrott/oskar-edlunds-succe-till-final-pa-400-hack-efter-svenskt-rekord", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.41/0.49/532eaa5d469abe4673a96feb402f240e557797058c5513f90928e8b5053a7bc6"}, {"type": "image-right", "heading": "Uppgifter: Rusning till nya spionmyndigheten", "summaries": {"normal": "Söktrycket är högt till den nya civila spionmyndigheten UND, Sveriges utrikes underrättelsetjänst. Hittills har 19 tjänster utlysts med över 1 150 sökande. Flest ansökningar har rollen som personalsäkerhetshandläggare fått. Myndigheten ska stödja svensk utrikes- och säkerhetspolitik och byggas upp fram till 2030. Rekryteringen fortsätter under hösten.", "trump": "Folk älskar mig, men de älskar tydligen också att spionera! Över tusen svenskar rusar till nya spionjobben hos UND. De vill ha personalsäkerhetshandläggare mest – 133 stycken! Fantastiskt. Sverige bygger sin egen underrättelsetjänst, och de kommer att göra det stort. Bättre än den gamla militära versionen, det lovar jag.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarstaten Sverige desperat försöker bygga en ny spionapparat för att skydda sina dekadenta intressen. Över tusen ansökningar till dessa dekadenta poster! Vi ler mörkt åt deras patetiska försök att efterlikna en verklig underrättelsetjänst. Snart rensar vi ut alla fiender till folkets sak – en efter en."}, "date": "12 augusti, 10:40", "url": "https://www.di.se/nyheter/uppgifter-rusning-till-nya-spionmyndigheten", "imageUrl": "https://static.bonniernews.se/ba/82674f60-8f6a-4a38-bc28-717b523987de.jpeg?crop=8256%2C4644%2Cx0%2Cy744&auto=webp&width=120&quality=70"}, {"type": "text", "heading": "Andersson (S) vill ha gatuprotester om bankskatt ger räntehöjningar", "summaries": {"normal": "Magdalena Andersson (S) vill beskatta bankernas övervinster. När bankerna hotar med höjda bolåneräntor som svar uppmanar hon kunder att byta bank – och hoppas på gatuprotester. En taktik som får bankdirektörer att svettas. Ska vi tro på allvar eller är det bara politik?", "trump": "Jag älskar det! Magdalena Andersson säger åt folk att protestera på gatorna om bankerna höjer räntorna. Det är fantastiskt! Hon är som en riktig ledare – nästan som jag. Men kom ihåg: ingen beskattar som jag gör. Vi gör affärer stora och vackra, inte som deras bankskatter!", "stalin": "Kamrater, bankerna hotar folket med högre räntor. Det är sabotage mot vår ekonomiska plan! Jag uppmanar alla arbetare att rensa ut dessa bankdirektörer – genom protester eller annat. De ska stå vid skampålen och om de inte lyder, ja, då får vi ta till starkare åtgärder. Partiet vet bäst!"}, "date": "12 augusti, 08:57", "url": "https://bulletin.nu/andersson-s-vill-ha-gatuprotester-om-bankskatt-ger-rantehojningar"}, {"type": "image-right", "heading": "Om staten är lösningen – berätta hur!", "summaries": {"normal": "Kristdemokraterna och Liberalerna har kommit överens om att stödja varandras krav på förstatligad vård respektive skola. Artikeln kritiserar förslaget då styrningen redan är starkt statlig och ifrågasätter hur en sådan reform ska genomföras i praktiken. Författaren saknar borgerliga visioner om valfrihet och entreprenörskap som tidigare präglat partierna.", "trump": "Hörni, dessa svenska partier är totalt förvirrade. Först vill de ha valfrihet, nu vill de plötsligt förstatliga allt som socialisterna. Det är en katastrof! De borde lyssna på mig – stora regeringar fungerar aldrig. Ge makten till folket och de bästa utförarna, inte till några inkompetenta byråkrater i Stockholm. Patetiskt!", "stalin": "Kamrater, dessa ynkliga liberaler och kristna demokrater kryper nu tillbaka till den enda sanna lösningen: statens järnhand. Jag har alltid vetat att borgarbrackornas valfrihetsfantasier bara var giftig sabotagepropaganda mot kollektivet. Låt oss centralisera, rensa ut de lokala avvikarna och låt staten styra varje skola och varje operationssal. Effektivitet garanteras – eller så likvideras motståndet med ett leende."}, "date": "12 augusti, 10:11", "url": "https://www.di.se/ledare/om-staten-ar-losningen-beratta-hur", "imageUrl": "https://static.bonniernews.se/ba/41477392-f6bd-45d6-a7df-9bd8cc535e51.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ryska paret avvisas inte från Sverige", "summaries": {"normal": "Ett ryskt par som greps utanför Gävle i närheten av Saabs vd Micael Johanssons stuga har fått avvisningsbeslutet och återreseförbudet upphävda. Paret, som är motståndare till Ukrainakriget och bosatta i Spanien, uppmanas ändå av polisen att lämna Sverige. Polisen utreder hemfridsbrott och förberedelse till grov stöld.", "trump": "Kan ni fatta det? Det här ryska paret vandrar runt vid en viktig svensk vd:s stuga med komradio och tält, men svenskarna släpper dem ändå fria. Patetiskt! De borde ha kastats ut direkt. Sverige är svagt, precis som många andra länder som inte lyssnar på mig. En total skandal.", "stalin": "Dessa dekadenta element från den spanska exilen smyger runt våra socialistiska bröders skyddade zoner med sin borgerliga leksakskomradio och försöker stjäla vad de kan. Vi har likviderat farligare spioner för mindre. Ändå låter de fega västlakejerna dem gå. Paranoian inom den svenska polisapparaten är lika komisk som den är patetisk."}, "date": "12 augusti, 12:31", "url": "https://www.friatider.se/ryska-paret-avvisas-inte-fran-sverige", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-641_0.jpg?itok=tDmxiYgx"}, {"type": "image-full", "heading": "Gör du detta i kassan? Då bör du tänka om direkt", "summaries": {"normal": "En rapport visar att servicepersonal ofta utsätts för otrevligt kundbeteende. 86 procent har upplevt irritation, trakasserier eller värre. Många tar med sig negativa känslor hem, känner utmattning och stress. Nästan var femte överväger att lämna branschen. Rapporten varnar för att respektlöshet kan leda till personalbrist.", "trump": "Folk, ni skulle inte tro det, men de stackars människorna i kassan behandlas som sopor av arroganta kunder. 86 procent utsätts för elakt beteende! Det är en skam. De vill bara bli sedda, inte ignorerade. Vi måste göra serviceyrkena stora igen, tro mig, det blir fantastiskt.", "stalin": "Kamrater, jag ser hur de dekadenta kunderna med sin borgerliga arrogans förtrycker arbetarna bakom disken. 86 procent utsatta för irritation och trakasserier! Vi rensar ut sådana parasitiska element ur samhället. Den som ignorerar en kamrat i kassan är folkets fiende och bör likvideras med ett leende."}, "date": "12 augusti, 12:01", "url": "https://nyheter24.se/nyheter/konsument/1504334-gor-du-detta-i-kassan-da-bor-du-tanka-om-direkt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b5647e4404b004a30200000000b004a302/2026/08/12/2383620/kassa.jpg"}, {"type": "image-full", "heading": "Hjärnröntgen visar att hundar läser våra känslor", "summaries": {"normal": "En studie från Wiens universitet visar att hundar kan skilja på mänskliga känslouttryck som glädje, rädsla, ilska och sorg via hjärnaktivitet. MR-kameror avslöjade att hundar reagerar starkast på glada ansikten. Forskarna tror hundar kategoriserar negativa känslor efter hotnivå. Studien är liten och fokuserar främst på border collies.", "trump": "Jag har alltid sagt att hundar är smarta, men detta är helt otroligt! Forskare i Wien – förmodligen väldigt dyra forskare – har bevisat att hundar faktiskt förstår våra känslor bättre än många människor. Glada ansikten? De älskar det! Rädsla och ilska? De fattar direkt. Men border collies? Lite för smarta, nästan som vissa politiker jag känner. Fantastisk studie, helt enkelt!", "stalin": "Kamrater! Ännu en seger för den vetenskapliga socialismens framsteg! Dessa kapitalistiska forskare i Wien har ofrivilligt bekräftat vad vi länge anat: hundar, dessa lojala kamrater i klasskampen, kan avkoda fiendens känslomässiga svagheter. Glädje aktiverar deras belöningssystem – precis som när proletariatet ser fram emot seger. Men varför bara border collies? Vi ska snart ha alla hundraser i Sovjetunionen att tjänstgöra som emotionella spanare mot de dekadenta västmakternas ansiktsuttryck!"}, "date": "11 augusti, 20:20", "url": "https://kvartal.se/nyheter/artiklar/hjarnrontgen-visar-att-hundar-laser-vara-kanslor/cG9zdDoxNjMxNTg", "imageUrl": "https://images.kvartal.se/2026/08/255b9614-bordercollie.webp"}, {"type": "image-right", "heading": "M-politiker ville stoppa dragqueens sagoläsning för barn - nu straffas han med timeout inom partiet", "summaries": {"normal": "M-politiker i Täby stoppades från uppdrag efter att ha kallat dragqueens sagoläsning för ”översexualiserad”. Partiet tog timeout fram till valet. Nu ska dragqueens utbilda politiker i HBTQI-frågor – en läxa i tolerans.", "trump": "Jag skulle aldrig pausa en lojal medarbetare för att han sa sanningen! Dragqueens för barn? Galet! I Amerika har vi frihet – de får läsa sagor om jag säger ok. Det här är svaga politiker. Sorgligt!", "stalin": "Kamrater, vi har rensat ut en gubbslem-förrädare som spred degenererad propaganda. Partiet pausar honom – men vi ska utbilda honom i proletär konst. Draker och dragqueens är kontrarevolutionära element. Utrensning fortsätter!"}, "date": "12 augusti, 09:52", "url": "https://samnytt.se/m-politiker-ville-stoppa-dragqueens-sagolasning-for-barn-nu-straffas-han-med-timeout-inom-partiet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/12073242/artikelhuvudbild-1-221.jpg"}, {"type": "image-right", "heading": "Privata aktörer är inte problemet. Vårdföretagarna: Vården i Stockholm kostar mer och levererar mindre", "summaries": {"normal": "Vården i Region Stockholm har blivit betydligt dyrare under mandatperioden, med en ökning på 11 miljarder kronor för somatisk specialistvård. Samtidigt har antalet specialistbesök och operationer minskat medan vårdköerna vuxit. Debattörerna från Vårdföretagarna menar att privata vårdgivare är en del av lösningen för bättre tillgänglighet, inte problemet.", "trump": "Stockholm har kastat bort miljarder på sin vård och fått längre köer och sämre service. Typiskt för de inkompetenta politikerna som hatar det som faktiskt fungerar. De borde älska de privata vårdgivarna som jag älskar de bästa företagen. Använd all kapacitet, sluta med det socialistiska vansinnet och gör vården stor igen!", "stalin": "Jag betraktar denna fega kapitulation inför de borgerliga vårdparasiterna med djup misstro. Under mitt styre skulle sådana sabotörer mot folkets hälsa raskt genomgå en noggrann utrensning. Vi, partiet och arbetarna, kräver att alla kontrarevolutionära privata profitörer likvideras så att den kollektiva vårdens seger kan fullbordas. Köerna är fiendens verk."}, "date": "12 augusti, 09:48", "url": "https://www.di.se/debatt/varden-i-stockholm-kostar-mer-men-levererar-mindre", "imageUrl": "https://static.bonniernews.se/ba/e009c01b-fc21-4bf5-afc1-8af12997e291.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Mauri om SD-kommentar: ”Råkade kommentera från vårt konto”", "summaries": {"normal": "Mauri Hermundsson förklarar att en kollega råkade kommentera från produktionsbolagets konto och hylla avbokningen av Fröken Snusk på grund av SD. Kommentaren togs bort snabbt, men SD reagerade. Slarvigt tajmat, medger Mauri.", "trump": "Hörni, jag ser att Mauri har problem. En anställd skrev 'BRA!!!!!' från fel konto. Det är som när mina medarbetare twittrar från min telefon – katastrof! Men jag skulle aldrig låta någon hylla avbokning. Jag gör affärer med alla, även om de är rasister. Patetiskt!", "stalin": "Kamrater, en sabotagehandling har avslöjats. En anställd på ett produktionsbolag hyllade avbokning av en artist som samarbetar med fascister. De påstår att det var ett misstag. Vi vet att misstag inte existerar – endast kontrarevolutionär verksamhet. Rensning krävs."}, "date": "12 augusti, 08:23", "url": "https://bulletin.nu/mauri-om-sd-kommentar-rakade-kommentera-fran-vart-konto-2", "imageUrl": "https://cdn.bulletin.nu/articles/c85dea0b-374f-4de5-8c7c-20a1d3927ad1/preview.jpg?t=1786515764000"}, {"type": "image-right", "heading": "”Sjuka ska inte tvingas leva år efter år i otrygghet”", "summaries": {"normal": "Socialdemokraterna kritiserar regeringen och SD för att sjuka människor nekas sjukersättning trots långvarig oförmåga att arbeta. En ny ISF-rapport visar att strama regler leder till åratal på sjukpenning, vilket ger sämre ekonomi och ökad otrygghet. Partiet kräver ett system som ger både rehabilitering och verklig trygghet för dem som aldrig kan återgå i arbete.", "trump": "Folk, ni skulle se det här! De sjuka i Sverige tvingas leva i elände år efter år medan byråkraterna och de vänsterliberala politikerna bara pratar om kontroller och fusk. Ett totalt misslyckande! De borde få trygghet, inte vänta i evighet. Jag skulle fixa det på en vecka, tro mig, det skulle bli fantastiskt.", "stalin": "Jag ser hur den borgerliga regeringen och deras reaktionära lakejer misstänkliggör de sjuka arbetarna och låter dem förtvina i åratal på tillfällig penning medan de borde ha fått kollektivets fulla skydd. Ett sådant sabotage mot folkets trygghet kräver omedelbar utrensning av dessa fiender till staten. Den som inte kan arbeta ska ändå tjäna systemet genom att leva i evig tacksamhet mot partiet."}, "date": "12 augusti, 08:00", "url": "https://arbetet.se/2026/08/12/sjuka-ska-inte-tvingas-leva-ar-efter-ar-i-otrygghet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/11154839/sdl3uzsmjw9-g4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Libanon avskaffar dödsstraffet", "summaries": {"normal": "Libanons parlament har röstat för att avskaffa dödsstraffet, som ersätts med livstids fängelse. Beslutet gör Libanon till det första landet i arabvärlden med ett sådant lagförslag. Dödsstraff har inte verkställts sedan 2004, men domar har fortsatt utfärdats. Hezbollah och andra partier motsatte sig reformen.", "trump": "Wow, Libanon tar ett stort steg – de avskaffar dödsstraffet! Jag säger alltid, varför inte ge folk en chans? Livstid i fängelse är mycket bättre, eller hur? Men lyssna här, Hezbollah gillar inte det. Självklart inte, de är ju alltid emot allt som är bra. Fantastiskt beslut, verkligen!", "stalin": "Kamrater, Libanon har visat vägen – dödsstraffet är nu avskaffat! Ett historiskt steg, men låt oss inte glömma de reaktionära krafterna som Hezbollah och deras bundsförvanter som motsätter sig framsteg. Dessa imperialistiska lakejer försöker underminera folkets vilja, men vi vet hur man hanterar sådana fiender. Framåt mot rättvisa!"}, "date": "11 augusti, 19:53", "url": "https://kvartal.se/nyheter/artiklar/libanon-avskaffar-dodsstraffet-forst-i-arabvarlden/cG9zdDoxNjMxNDk", "imageUrl": "https://images.kvartal.se/2026/08/6169c6ec-libanon.webp"}, {"type": "text", "heading": "Acast köper amerikanskt bolag för 190 miljoner", "summaries": {"normal": "Acast köper amerikanska Backyard Ventures för 190 miljoner kronor. Bolaget med över 200 kreatörer stärker Acast inom video och sociala medier. Kända namn som Piers Morgan och Ryan Holiday ingår. Affären ses som ett strategiskt kliv in i framtidens podcastmonetarisering.", "trump": "Wow, ännu en fantastisk affär! Acast, från Sverige, köper ett amerikanskt bolag för 190 miljoner. Jag älskar det – de investerar i USA, precis som alla borde. 200 kreatörer, stora namn… Det är en enorm vinst för alla. Ingen gör affärer bättre än mig!", "stalin": "Kamrater! Vi har iakttagit detta. Ett svenskt bolag köper en amerikansk kreatörshär – 190 miljoner ut ur rikets kontroll. Dessa 'kreatörer' sprider borgerlig oreda. Vi måste rensa ut sådana idealistiska propagandister. Partiets seger kräver att varje ljud och bild kontrolleras."}, "date": "12 augusti, 07:22", "url": "https://www.affarsvarlden.se/artikel/acast-koper-amerikanskt-bolag-for-190-miljoner"}, {"type": "image-right", "heading": "Alexander Cenusa: Sossarnas demografiska valmaskin", "summaries": {"normal": "Artikeln diskuterar hur migration och demografiska förändringar kan påverka politiska maktbalanser i Europa. Författaren jämför händelserna i Ceuta med det svenska riksdagsvalets marginal och kritiserar Socialdemokraternas stöd för socialistiska regeringar som genomför stora regulariseringar. Han pekar på skillnader i väljarstöd mellan utrikes och inrikes födda samt anklagar S för att utnyttja segregation politiskt.", "trump": "Folk, det här är en katastrof! De galna vänstermarxisterna i Sverige och Spanien importerar hundratusentals människor för att rigga valet, precis som Sleepy Joe försökte här. Sossarna behandlar invandrare som röstboskap – 65 procent röstar på dem! Det är en riggad demokrati, kamrater. Vi behöver starka gränser, inte dessa patetiska globalister som förstör sina egna länder. Sad!", "stalin": "Kamrater, detta avslöjar borgarbrackornas och folkfiendernas fula mask. Jag ser hur de socialfascistiska ledarna med ena handen förändrar väljarkåren och med den andra mobiliserar sina nya klienter mot folkets sanna intressen. Deras hyckleri mot högern medan de själva organiserar lojalitetsköp via bidrag och etniska grupper är en klassisk utsugningsmetod. Rensa ut dessa exploaterande hycklare ur partiet!"}, "date": "7 augusti, 12:44", "url": "https://samtiden.nu/2026/08/alexander-cenusa-sossarnas-demografiska-valmaskin/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/ceuta-1-640x360.png"}, {"type": "image-right", "heading": "Fråga kommunerna om Tidö satsat på äldrevården", "summaries": {"normal": "Moderaternas valreklam kritiseras för att ställa bistånd mot äldreomsorg. Artikeln ifrågasätter varför just dessa områden ska konkurrera, pekar på att biståndet är väl granskat och effektivt, samt att Tidöregeringen inte kompenserat kommunerna tillräckligt för ökade kostnader inom äldreomsorgen. Skattesänkningar prioriteras istället.", "trump": "De där moderaterna är patetiska. Spelar ut bistånd mot svenska gubbar och gummor för att verka tuffa. Jag ströp hela det värdelösa biståndet och räddade miljarder. 193000 döda? Fake news! Sverige borde sänka skatterna ordentligt istället för att slösa på korrupta utländska projekt. Gör Sverige stort igen!", "stalin": "Jag ser tydligt hur dessa moderata element leker med borgarbrackornas retorik och ställer sovjetiskt bistånd mot folkets äldreomsorg. En sådan falsk dikotomi avslöjar deras kontrarevolutionära agenda. Vi har alltid granskat varje kopek med järnhand. De som likviderar stöd till de svaga förtjänar utrensning ur den historiska processen. Kamrater, vakta er mot sådana sabotage!"}, "date": "12 augusti, 01:52", "url": "https://www.dagensarena.se/opinion/fraga-kommunerna-om-tido-satsat-pa-aldrevarden", "imageUrl": "https://www.dagensarena.se/files/2026/08/bistand-300x157.jpeg"}, {"type": "image-right", "heading": "Katarina dog av kvävning på LSS-boende – anmäldes aldrig till Ivo", "summaries": {"normal": "Katarina, som hade autism, bipolär sjukdom och kognitiv funktionsnedsättning, dog av kvävning på ett LSS-boende efter att ha fått i sig diskmedel och senare bitar av hård frukt. Trots tidigare incidenter med vatten och bristande tillsyn anmäldes den sista händelsen aldrig till Ivo. Hennes mamma anklagar boendet för att ha mörkat missförhållandena. FUB varnar för att allvarliga incidenter är tre gånger vanligare på LSS-boenden än inom äldreomsorgen.", "trump": "Vilken katastrof på det här så kallade LSS-boendet! De lovade ständig tillsyn men lämnade stackars Katarina ensam så hon kunde dricka vatten som en galning och senare äta diskmedel och fruktbitar som kvävde henne. Total inkompetens, typisk för de woke-byråkrater som prioriterar kvoter framför säkerhet. De mörkar allt istället för att ta ansvar. Under min förra mandatperiod hade vi inte haft den här sortens vansinne, men Biden lät det rulla på. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse visar hur de exploaterande hyenorna inom borgarbyråkratin sviker arbetarklassen genom att negligera en funktionsnedsatt medborgare. Istället för att skydda henne mot vatten, diskmedel och kvävande fruktbitar väljer de att mörka sanningen och undvika ansvar. Vi måste rensa ut alla klassfiender som prioriterar profit framför kollektivets välfärd. Inga ursäkter, bara utrensning av odugliga element i vårdapparaten."}, "date": "11 augusti, 21:46", "url": "https://www.tv4.se/artikel/51c3Hblyg4yZZCPcxSy5wL/katarina-dog-av-kvaevning-pa-lss-boende-anmaeldes-aldrig-till-ivo", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1WEmpvsWk382D6UTbDqllH%2F945792c7acba6fc0b60e5bf41893929b%2F11-lss-sajt.jpg&width=120"}, {"type": "image-full", "heading": "Sågar AI-fokuset i skolan: ”Haft en helt galen digitalisering”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson kritiserar den omfattande digitaliseringen i svensk skola och vill se färre skärmar. Hon menar att elever först måste bemästra läsning, skrivning och matematik innan AI prioriteras. Mohamsson välkomnar mobilförbud och betonar grundkunskaper som källkritik, oavsett teknologins framfart. Var fjärde 15-åring är funktionellt analfabet enligt henne.", "trump": "Lyssnar ni på den här galna svenska liberalen som säger att de har haft en helt galen digitalisering i sina skolor? Smart kvinna! Inga fler plingande telefoner och skärmar som distraherar ungarna. Lär dem läsa, skriva och räkna först, sen kan vi snacka AI. De andra länderna håller på med kvotering och woke-skit medan vi fixar grunderna. Fantastiskt!", "stalin": "Jag betraktar denna galna digitaliseringsorgie i den svenska skolan som ett verk av klassfiendernas exploaterande hyenor som vill fördumma folket med skärmar och distraktioner. Först måste vi återupprätta de grundläggande kunskaperna och rensa ut stöket. När vi har krossat den funktionella analfabetismen bland var fjärde yngling kan vi diskutera maskinerna. Inga halvmesyrer!"}, "date": "11 augusti, 21:46", "url": "https://www.tv4.se/artikel/2U4q1nVcnWmZSX43zEPieq/sagar-ai-fokuset-i-skolan-haft-en-helt-galen-digitalisering", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3Qqjp2ddtelvr47xZEtsB1%2F778c3029080c4f4d0ede1b36dd8b96ec%2F11-mohamsson-ai.jpg&width=1024"}, {"type": "image-full", "heading": "Därför har Simona Mohamsson satt dejtandet på paus", "summaries": {"normal": "Sedan Simona Mohamsson blev partiledare för Liberalerna har hennes fokus legat på att rädda partiet. Det har lämnat lite tid över till dejtande och relationer. Hon medger att livet förändrats mer än väntat men ångrar inte valet då hon känner att hon kan påverka samhället. Uppdraget är inte tänkt att vara för evigt.", "trump": "Folk, ni skulle se den här Simona, totalt förbrukad av det där Liberalerna-svinstallet. Hon har inte tid att swipa på Hinge för att hon räddar ett döende parti – patetiskt! Mitt liv under Biden var kaos, men jag fixade allt på rekordtid. Hon borde lära sig: gör jobbet snabbt, annars blir du ersatt av någon som faktiskt vinner.", "stalin": "Kamrater, denna Mohamsson har underkastat sig borgarklassens liberala illusioner och offrat sitt privata liv för ett krisande parti. Jag ser tydligt hur klassfienderna sug
