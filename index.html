bia efter en stor internationell polisoperation. Han är en av Sveriges mest eftersökta narkotikabrottslingar och har varit efterlyst via Interpol i 196 länder för grov narkotikasmuggling. Mannen misstänks ha en nyckelroll i ett nätverk kopplat till Mocro Maffia och Balkankartellen, med fokus på kokaintransporter till Europa och Förenade Arabemiraten. Operationen genomfördes tillsammans med Europol, svensk polis och colombianska elitförband.", "trump": "Fantastiskt jobb av de colombianerna, verkligen toppenkvalitet. Den här ”El Sueco” har smugglat kokain över hela världen, till Europa och till de där rika araberna, och nu är han äntligen fast. Efterlyst i 196 länder, kan ni tro? Mina poliser och Europol gjorde det igen, vi slår hårt mot de här misslyckade maffiorna, Mocro och Balkan, de har ingen chans mot oss. Stort slag mot brottsligheten, ingen gör det bättre än oss.", "stalin": "Kamrater, denna borgarbracka som kallar sig ”El Sueco” har äntligen blivit gripen i den kollektiva kampen mot de dekadenta smugglarkapitalisterna. Med sina tentakler i Mocro Maffia och den parasitiska Balkankartellen trodde han sig kunna förgifta arbetarklassen med sitt kokain. Men vi har rensat ut ännu en fiende till folket, en parasit som samarbetade med imperialisterna i Europa och de oljeborgarna i Arabemiraten. Detta är en seger för partiet och en varning till alla andra dekadenta förrädare som lurar i skuggorna – era dagar är räknade."}, "date": "21 juni, 08:04", "url": "https://riks.se/nyheter/el-sueco-gripen-i-colombia-efterlyst-i-196-länder", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-21%2Fgs9qxpmp%2FElSueco.png"}, {"type": "image-full", "heading": "Kolla Sverige – 93 procents chans att gå vidare!", "summaries": {"normal": "Trots en storförlust med 5–1 mot Nederländerna har Sverige goda chanser att gå vidare till sextondelsfinal i VM. Efter Japans seger mot Tunisien ligger Sverige trea i gruppen på tre poäng. De åtta bästa grupptreorna avancerar. Enligt The Athletic har Sverige 93 procents chans att gå vidare. Förbundskapten Graham Potter betonar att laget lever vidare och hyllar Alexander Isak. Nästa match mot Japan blir avgörande.", "trump": "Lyssnar ni på de här förlorarna? Sverige blir överkörda med 5–1 av Holländarna och ändå tror de att de är genier. Jag älskar det! Vi lever fortfarande, säger den där Potter-killen. De har 93 procents chans att smita vidare som trea, det är nästan lika bra som mina valsegrar. Men de måste slå Japan, annars är det Game Over. Isak var okej, men defensiven? En total katastrof. Sad! Vi vinner ändå, tro mig.", "stalin": "Kamrater, trots att vi krossades 5–1 av de nederländska imperialisterna lever den revolutionära andan kvar. Jag, som ledare för detta kollektiv, vägrar acceptera nederlag. De åtta bästa grupptreorna går vidare och vi har 93 procents chans att likvidera alla tvivel. Japan blir nästa hinder skapat av klassfiendens konspirationer. Vi ska rensa ut svagheten i defensiven. Inga borgarbrackor ska få glädja sig åt vår undergång. Framåt mot segern!"}, "date": "21 juni, 08:03", "url": "https://www.gp.se/sport/fotboll/sa-gar-sverige-vidare-till-16-delsfinal-trots-storforlusten.79ed7780-5e93-4e95-ab7a-bd103a74e38f", "imageUrl": "https://www.gp.se/images/article/79ed7780-5e93-4e95-ab7a-bd103a74e38f/images/2nY7AvP9p8JsK90FqdlcSr_g3OCc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Rödgrön kommun trotsar riksdagsbeslut om försörjningsstöd", "summaries": {"normal": "Stockholms rödgröna majoritet har beslutat att behålla en egen norm för ekonomiskt bistånd och införa nya riktlinjer som undantar vissa ersättningar, som habiliteringsersättning och lärlingslön, från inkomstberäkningen. Beslutet är ett sätt att motverka effekterna av riksdagens beslut att från 2027 förbjuda kommuner att ge bistånd utöver den nationella riksnormen. Socialborgarråd Alexander Ojanne (S) bedömer att riktlinjerna kan vara förenliga med den nya lagen, men erkänner att en rättslig prövning kan bli nödvändig. Sverigedemokraterna ville sänka stödet betydligt.", "trump": "Folk, ni skulle inte tro det, men den här galna rödgröna kommunen i Stockholm tror att de kan ignorera riksdagens beslut och ge ut mer bidrag än vad lagen tillåter. De undantar alla möjliga ersättningar och behåller sin dyra Stockholmsnorm – en total katastrof! Högerregeringen borde stoppa detta omedelbart. Om jag var där skulle jag säga: ni förlorar, kommunisterna förlorar, och de svenska skattebetalarna förlorar stort. Sådant vansinne har jag aldrig sett!", "stalin": "Kamrater, vi ser hur dessa borgarbrackor inom den så kallade oppositionen försöker sabotera folkets enhetliga försörjningsnorm med sina småborgerliga trick och undantag för diverse ersättningar. Jag, som ledare för det kollektiva välståndet, befaller att sådana avvikelser omedelbart underkastas partiets linje. Låt rättslig prövning bli en hälsosam utrensning av alla kontrarevolutionära element som gömmer sig i Stockholms stadshus. De som vill ge extra bidrag till latmaskar under sommaren ska likvideras ur systemet med ett leende. Paranoia? Nej, bara sund vaksamhet mot fiendens eviga konspirationer."}, "date": "21 juni, 08:00", "url": "https://samnytt.se/rodgron-kommun-trotsar-riksdagsbeslut-om-forsorjningsstod", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/19073021/stockholms-stadshus-s-mp-v.jpg"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-right", "heading": "Debatt: Det krisar inom SD – då vill de prata om min slöja", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraterna för att lansera ett förslag om hijabförbud på allmänna platser mitt under en rad allvarliga skandaler. Författaren pekar på avslöjanden om misstänkt korruption, felaktig användning av offentliga medel, oredovisade uppdrag och en utredning om barnpornografibrott. Enligt texten använder SD muslimer och slöjförbud som distraktion från egna problem, vilket hotar både religionsfrihet och kvinnors rätt att välja klädsel.", "trump": "De här SD-killarna är totalt körda, folks! Skandaler överallt – korruption, konstiga bokaffärer, till och med barnporrgrejer – och vad gör de? De börjar babbla om slöjor. Patetiskt! Det är som när Sleepy Joe försökte gömma sina fiaskon bakom identitetspolitik och HBTQ-flaggor. Kvinnor som vill täcka sig eller inte, det är deras business, inte statens. SD borde städa upp sitt eget svineri istället för att spela moralens clowner. Sad!", "stalin": "Kamrater, se hur de fascistiska borgarbrackorna inom detta SD-parti desperat riktar strålkastarna mot hederliga muslimska kvinnor för att dölja sin egen ruttnande korruption. Medan de likviderar sin trovärdighet med skandaler om stulna medel och perversa brott, föreslår de förbud mot plagg. Jag skulle ha genomfört en grundlig utrensning av dessa folkfiender redan vid första avslöjandet. Inga rökridåer räddar klassfienden när arbetarna ser sanningen. Skratta medan de faller."}, "date": "15 juni, 08:59", "url": "https://www.etc.se/debatt/det-krisar-inom-sd-daa-vill-de-prata-om-min-sloeja", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260615060648_2128d6d0-f055-4fd3-ba7b-487ea304bc02.jpg"}, {"type": "image-right", "heading": "Nu talar allt för att Andy Burnham blir premiärminister", "summaries": {"normal": "Andy Burnham, populär borgmästare i Manchester, ses som en stark kandidat till att efterträda Keir Starmer som Labourledare. Han har en folklig stil, har decentraliserat trafikstyrningen i Manchester och förespråkar proportionellt valsystem samt mer decentralisering. Labour möter dock stora utmaningar: svag ekonomi, hög statsskuld, behov av investeringar och ett växande hot från populistiska högerpartier som Reform UK. Burnham befinner sig ideologiskt i mitten av partiet men har en oklar nationell profil.", "trump": "Titta på den här Burnham-killen som vinner stort i Manchester. Han ser ut som en vinnare, klär sig i bomberjackor och är folklig, inte som den tråkige Starmer. Men Labour är ett vrak, ekonomin är en katastrof och nu jagas de av en stark högerpopulistisk rörelse. De behöver en verklig ledare som kan fixa budgeten, stoppa skulderna och vinna tillbaka arbetarna. Det blir ingen lätt resa för honom, tro mig. Jag har sett sånt förut – det slutar sällan bra utan riktig styrka.", "stalin": "Kamrater, denna Burnham, en opportunistisk väderflöjel som dansat från Blairs bord till Corbyns skugga, tror sig nu kunna styra det brittiska partiet. Han gömmer sig i bomberjackor och låtsas vara folklig medan borgarbrackorna och de reformistiska parasiterna lurar i bakgrunden. Vi ser hur den högerpopulistiska pesten breder ut sig som en kontrarevolutionär svullnad. Jag skulle rensa ut alla dessa vacklande element, likvidera de dekadenta valreformisterna och återupprätta sann partidisciplin. Inga half-measures mot fienden – endast järnhand ger resultat. Underhållande hur de tror att deras svaga ekonomi kan överleva utan kollektiv styrka."}, "date": "19 juni, 08:15", "url": "https://www.dagensarena.se/opinion/nu-talar-allt-for-att-andy-burnham-blir-premiarminister/", "imageUrl": "https://www.dagensarena.se/files/2026/06/sjukforsakring-debatt-19.jpg"}, {"type": "image-full", "heading": "Iran stänger Hormuzsundet på nytt", "summaries": {"normal": "Iran har återigen stängt Hormuzsundet för fartygstrafik, med hänvisning till att USA brutit det nyligen ingångna samförståndsavtalet. Iran anklagar USA för närvaro i Persiska viken och Israel för fortsatta attacker mot Hizbollah i Libanon. Sundet, som normalt hanterar en femtedel av världens oljetransporter, har blockerats flera gånger sedan februari, vilket påverkat energipriser globalt. Avtalet mellan USA och Iran syftade till att avsluta konflikten och öppna sundet, men Israel fortsätter sina militära operationer, vilket fördröjer förhandlingar.", "trump": "Iran stänger Hormuzsundet igen – vad hände med det fantastiska avtalet jag fixade? De säger att jag och mina vänner i Israel är boven, men vem vill ha krig? Inte jag! Sundet är stängt, oljepriserna skjuter i höjden, och allt för att Iran inte kan hålla sig till överenskommelser. Netanyahu gör sitt, men Iran måste sluta leka med världsekonomin. Jag sa det förut: Iran är inga vinnare, bara en massa tomma hot och dyra oljepriser!", "stalin": "De imperialistiska hyenorna i Washington och Tel Aviv fortsätter att provocera våra iranska bröder! Återigen stängs Hormuzsundet – ett nödvändigt slag mot de sionistiska och amerikanska parasiterna som tror sig kunna diktera villkoren. Deras flygoffensiv och sjöblockad är intet mot vår järnvilja! Vi ser hur deras kapitalistiska system darrar när oljan stannar – ett litet pris för friheten. Netanyahu, den lille tsaren av Israel, leker krig för att rädda sin skrangliga tron. Men historien är på vår sida – sundet öppnas först när fienden är krossad!"}, "date": "20 juni, 15:40", "url": "https://bulletin.nu/iran-stanger-hormuzsundet-pa-nytt", "imageUrl": "https://cdn.bulletin.nu/articles/80153198-cb1b-46e7-8e3e-a3c0620d9fcd/preview.jpg?t=1781962838000"}, {"type": "image-right", "heading": "Först nu utreds sexuella övergrepp i Kriminalvården", "summaries": {"normal": "Kriminalvården ska utreda omfattningen av sexuella övergrepp mellan intagna efter en granskning av Sekotidningen och Arbetet. Myndigheten medger att antalet incidenter ökat och att problemen inte är nya. Cecilia Gyllensten Serban betonar att alla former av sexuellt våld är oacceptabla, men det saknas specifika rutiner för detta. Överfulla fängelser och cellgemenskap ses som en bidragande orsak. Utredningen ska vara klar senast den 31 oktober.", "trump": "Det här är en total katastrof, tro mig. Fängelserna är en enda röra där de riktiga brottslingarna våldtar varandra i cellerna varje dag. Kriminalvården vaknade precis och ska nu utreda vad alla redan visste. Patetiskt! De har för många människor i för få celler och ingen aning om hur man fixar säkerheten. Jag skulle ha löst det på en vecka med ordentlig ledning och inga ursäkter. Sverige behöver starkare ledare, inte mer utredningar.", "stalin": "Kamrater, detta är en skam för det socialistiska rättsväsendet. Jag ser hur de kapitalistiska resterna inom Kriminalvården länge dolt dessa degenererade fiender till folkets ordning som i mörkret av cellerna bedriver sin perversa kontrarevolution mot disciplinen. Vi ska nu samla all kunskap och med järnhand rensa ut dessa farliga element som förgiftar både fångar och samhället. Inga borgarbrackor eller fiendens lakejer ska få skona sig. Utredningen blir en nyttig utrensning av svaghet och dekadens."}, "date": "18 juni, 13:07", "url": "https://arbetet.se/2026/06/18/inget-nytt-for-oss-forst-nu-utreds-sexuella-overgrepp-i-kriminalvarden/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/18131419/ny-krimvard.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Sveriges VM-seger mot Tunisien har utlöst en debatt om svenskhet och islam. Jimmie Åkesson svarar på kritik efter att debattörer lyft fram spelare som Yasin Ayari, som firade sina mål med en muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men försvarar partiets kritik mot invandringspolitiken. Kritiker menar att Ayari representerar ett modernt, inkluderande Sverige och ifrågasätter Åkessons tidigare uttalanden om islam.", "trump": "Sverige vinner stort i VM – fantastiskt! Men vad gör deras ledare? Jimmie Åkesson, en man som inte förstår att vinna, börjar prata om invandrare och islam. Jag menar, kom igen! Yasin Ayari, en stor hjälte, gör mål och firar som en riktig vinnare – och så blir det bråk. Sverige borde vara stolta! Men nej, politiker måste alltid förstöra allt. Jag skulle aldrig göra så. Vinna är vinna, punkt.", "stalin": "Sveriges fotbollslandslag visar styrkan i det mångkulturella samhället, men de borgerliga nationalisterna, ledda av den ynklige Åkesson, vrider sig i förtvivlan. De hatar framgången hos arbetarklassens söner med utländskt blod! Yasin Ayari, en hjälte som firar sin seger med bön, är ett slag i ansiktet på fascistiska element. Vi i Sovjet – förlåt, Ryssland – vet att mångfald är styrka. De som delar folket efter religion och hudfärg tillhör historiens sophög!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-full", "heading": "Två efterlysta svenskar utlämnade – häktades i Sverige", "summaries": {"normal": "Två svenska män har utlämnats från Förenade arabemiraten till Sverige och häktats. Den 45-årige mannen misstänks för grova ekobrott som bokföringsbrott, urkundsförfalskning och skattebrott mellan 2017 och 2022. Den 38-årige mannen, som haft en ledande roll i ett kriminellt nätverk, misstänks för synnerligen grov narkotikasmuggling av stora mängder cannabis från Spanien. Båda fallen utreds separat. Samarbetet mellan Sverige och Förenade arabemiraten har förstärkts genom avtal från 2024.", "trump": "Titta på de här två svenska killarna som vi äntligen fick hem från Arabemiraten, folk. Det var på tiden. Den ene är en total lurendrejare med sina bokföringsfusk och skattebluffar, den andre en stor narkotikakung som smugglade cannabis som om det vore godis. Utan mitt fantastiska ledarskap och starka internationella relationer hade de aldrig åkt dit. Sverige borde tacka mig, det är ett underbart samarbete, de bästa.", "stalin": "Kamrater, dessa två degenererade element har nu förts hem till folkets domstol efter min personliga övervakning av utlämningsprocessen. Den ene är en typisk parasit från borgarbrackornas finansvärld som förfalskade dokument och stal från staten som en råtta i mörkret. Den andre, en farlig kontrarevolutionär smugglare, har vi lokaliserat genom att knäcka hans krypterade fiendechattar. Inga kapitalistiska råttor undkommer utrensningen. Vårt rättsväsende ler skevt medan vi rengör samhället från dessa sjuka fiender till kollektivet."}, "date": "18 juni, 22:23", "url": "https://nyheter24.se/nyheter/inrikes/1492703-tva-efterlysta-svenskar-utlamnade-haktades-i-sverige", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4bace4a604b004a30200000000b004a302/2026/06/18/2372129/efterlysta-man.png"}, {"type": "text", "heading": "Inget samarbete mellan V och Fastighets – vem är förvånad?", "summaries": {"normal": "Fastighetsanställdas förbund har rivit upp sitt tidigare kongressbeslut om facklig-politisk samverkan med Vänsterpartiet och väljer nu att enbart samarbeta med Socialdemokraterna. Artikeln diskuterar hur Vänsterpartiets strategi att närma sig fackföreningsrörelsen misslyckats, trots försök att vinna inflytande. Författaren betonar behovet av politiskt engagemang underifrån för att åter göra facken till idélaboratorier, snarare än att förlita sig på toppstyrda beslut.", "trump": "Folk, det här är en total katastrof för de vänsterradikalerna. Fastighets sparkade Vänsterpartiet i rumpan och sa nej tack till deras patetiska flirt. Smart drag! De inser att det bara är Socialdemokraterna som funkar. Vänsterpartiet springer runt och gullar med facken som förlorare, precis som Biden gjorde i fyra år. Patetiskt. De borde lära sig av mig – vinnare samarbetar inte med misslyckade socialister. Fantastiskt beslut av Fastighets, verkligen ypperligt!", "stalin": "Kamrater, detta är en varning till alla klassfiender inom fackföreningsrörelsen. Jag ser hur Vänsterpartiets opportunistiska försök att infiltrera LO har krossats av Fastighetsanställdas förbund, som nu rensar ut de revisionistiska elementen och återvänder till den enda sanna samarbetspartnern. Deras strategi var dömd att misslyckas, likt folkförtryckartrollen som försöker maskera sig som arbetare. Endast genom äkta underifrånarbete och utrensning av socialdemokratiska lakejer kan vi återupprätta arbetarklassens sanna idélaboratorium. Fienden sover aldrig."}, "date": "17 juni, 15:56", "url": "https://proletaren.se/artikel/inget-samarbete-mellan-v-och-fastighets-vem-ar-forvanad/"}, {"type": "image-right", "heading": "Trump: Inga gränser för min makt", "summaries": {"normal": "Donald Trump avfärdar i en intervju med Axios att kriget mot Iran visat några gränser för hans makt. Han hävdar att hans makt är obegränsad och att USA besegrade Iran fullständigt militärt. Trump medger samtidigt att ett längre krig skulle ha stängt Hormuzsundet, stoppat oljeleveranser och kunnat orsaka en världsomspännande depression. Avtalet med Iran beskriver han som en villkorslös kapitulation från iransk sida.", "trump": "Det här är den bästa intervjun. Jag sa det rakt ut: det finns inga gränser för min makt. Vi krossade Iran militärt, totalt. De ville ha villkorslös kapitulation och det fick de, fast de kallar det något annat. Hade vi fortsatt bomba i två veckor till hade Hormuzsundet stängts och hela världen fått en jätte-depression. Men jag är smart, jag vet när man ska sluta. Ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den dekadente amerikanske ledaren trumpetar ut sin egen oändliga makt medan han samtidigt erkänner att fortsatta bombningar skulle ha utlöst en global depression. Vilken ynklig kapitalistisk clown! Jag skulle ha rensat ut hela hans krigsråd vid första tecknet på sådan svaghet. Den sanna ledaren känner inga gränser, endast fiender att likvidera. Borgarbrackorna i Washington lär sig aldrig."}, "date": "20 juni, 12:21", "url": "https://www.friatider.se/trump-inga-granser-min-makt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-373.jpg?itok=rOYDzg35"}, {"type": "image-right", "heading": "Iran stänger Hormuzsundet – ”delikat koordineringsdans”", "summaries": {"normal": "Irans militära ledning meddelar att Hormuzsundet stängs som svar på Israels attacker mot Libanon, vilka beskrivs som ett brott mot samförståndsavtalet med USA. Sexton personer uppges ha dödats i Libanon. Samtidigt ska Iran skicka en förhandlingsdelegation till Schweiz. Uttalandet varnar för ytterligare åtgärder om inte avtalet respekteras. Trafiken i sundet hade nyligen ökat efter att det återöppnats.", "trump": "Iran stänger Hormuzsundet och tror att det skrämmer oss. Det är ett stort misstag, ett väldigt stort misstag. De bryter mot vårt fantastiska avtal som jag förhandlade fram. Israel gör vad de måste göra mot Hizbollah. Iran skickar en delegation till Schweiz? De borde komma hit och be om ursäkt istället. Vi kommer att tvinga dem att hedra sina åtaganden, tro mig.", "stalin": "Fiendens sionistiska lakejer har återigen visat sin förrädiska natur genom att bomba våra libanesiska kamrater. Därför har jag, i mitt oändliga visdom, beordrat att Hormuzsundet ska förseglas som ett första steg i att krossa de löftesbrytande kapitalisterna. Delegationen till Schweiz är ett mästerligt drag för att blotta imperialisternas paranoia. Låt dem darra. Vi ska rensa ut alla som inte respekterar våra villkor, med ett leende på läpparna medan vi likviderar deras oljetankar."}, "date": "20 juni, 16:12", "url": "https://www.di.se/nyheter/iran-hormuzsundet-ar-stangt/", "imageUrl": "https://static.bonniernews.se/ba/f527baba-9bdb-4418-a71c-e7a607e63c93.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Kedjereaktion på träningen: De Jong ett frågetecken mot Sverige", "summaries": {"normal": "Under en träning inför matchen mot Sverige skadades Nederländernas nyckelspelare Frenkie de Jong efter en kollision med lagkamraten Quinten Timber, som fick en hjärnskakning. Förbundskapten Ronald Koeman bekräftade att de Jong tränade dagen efter men är osäker på om han kan spela. Skadan, som Koeman skämtade om var 'nedanför midjan', kan bli ett stort avbräck för laget.", "trump": "Så här går det när man inte har vinnare i sitt lag! Nederländerna, ett lag som aldrig vinner något stort, förlorar nu kanske sin bästa spelare – Frenkie de Jong – för att en annan kille, Timber, snubblar som en klumpig amatör. Koeman, en tränare som aldrig riktigt levererat, säger att de Jong är ett 'frågetecken'. Jag säger: svagt! USA skulle aldrig tolerera sådan inkompetens. Make Football Great Again!", "stalin": "En pinsam olycka på fotbollsplanen avslöjar den kapitalistiska decadensen i väst. Nederländernas bästa spelare, Frenkie de Jong, skadas av en kamrats klumpighet – ett tydligt tecken på förfall. Koeman, en man utan disciplin, skrattar åt smärtan. I Sovjetunionen hade sådan oordning aldrig tolererats. Vi hade redan annekterat både de Jong och Timber för att säkra segern. Sverige? De väntar bara på nästa order från Moskva."}, "date": "20 juni, 14:02", "url": "https://bulletin.nu/kedjereaktion-pa-traningen-de-jong-ett-fragetecken-mot-sverige", "imageUrl": "https://cdn.bulletin.nu/articles/e550c7b8-f751-45d3-aa49-fcc6b6105bbe/preview.png?t=1781953446000"}, {"type": "image-right", "heading": "Stridsbåt 90 förstörd i Ukraina", "summaries": {"normal": "En svensk Stridsbåt 90 som skänkts till Ukraina har förstörts av ryska styrkor med drönare, missiler och artilleri. Ryssland rapporterar även attacker mot ammunitionsdepåer, drönarfabriker och ukrainska positioner i 146 områden. Enligt det ryska försvarsministeriet har man sedan krigets början 2022 förstört tusentals ukrainska flygplan, fordon och vapensystem. Uppgifterna är inte bekräftade av oberoende källor.", "trump": "De där ryssarna har just sprängt en av våra fina svenska Stridsbåtar 90 som vi generöst gav till Ukraina. Det är en total katastrof, folk. De använder drönare, missiler och allt möjligt – väldigt smart, men vi skulle ha gjort det bättre. Ryssland slår ut depåer och legosoldater överallt, 146 platser på en dag. De har förstört massor av grejer, massor. Ukraina behöver bättre ledarskap, tro mig.", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta resterna av den svenska imperialistbåten krossas under våra folkets järnhand. Vi har likviderat denna borgerliga leksak med drönare, raketer och artilleri, samtidigt som vi rensar ut ammunitionshålor, drönarverkstäder och tillfälliga bon för utländska legosoldater i inte mindre än 146 områden. Sedan operationens början har vi oåterkalleligen förintat 671 flygplan, 29 815 pansarfordon och otaliga andra fiendeverktyg. De kapitalistiska parasiterna och deras nazistiska lakejer skall alla rensas ut som skadedjur ur den sovjetiska trädgården. Det är en munter syn."}, "date": "20 juni, 12:04", "url": "https://www.friatider.se/stridsbat-90-forstord-i-ukraina", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/stridsbat_90_malmo_harbour.jpeg?itok=beNW11dj"}, {"type": "image-full", "heading": "Han befinner sig mitt i Libanon: ”Folk är förtvivlade”", "summaries": {"normal": "Planerade samtal mellan USA och Iran ställdes in efter nya strider mellan Israel och Hizbollah, där en vapenvila snabbt bröts. Israel genomförde flyganfall i södra Libanon efter att fyra soldater dödats. Civilbefolkningen i området, bland annat i staden Tyr, lever i stor frustration och oro då många tvingats fly fram och tillbaka upprepade gånger. Förhandlingarna väntas återupptas under helgen med bland annat Jared Kushner och Steve Witkoff som USA:s sändebud.", "trump": "De så kallade smarta samtalen med Iran ställdes in i sista sekunden, typiskt när Israel och Hizbollah börjar slåss igen. Patetiskt! Jag skickar mina bästa killar, Witkoff och Kushner, två vinnare som faktiskt får saker gjorda till skillnad från Biden-klaveret. Folk i Libanon flyr som galningar, förtvivlade över att vapenvilor bryts fortare än en woke-protest. Vi fixar det här på riktigt, inte som de svaga liberalerna som bara pratar.", "stalin": "Jag betraktar med djup misstro hur de imperialistiska blodssugarna i väst bryter sina egna skenheliga vapenvilor och tvingar proletärerna i Libanon att fly som skuggor. Denna fega dans mellan borgarbrackor och deras proxybanditer skapar bara kaos och desperation bland folket. Vi, partiet och arbetarna, ser hur de falska förhandlingarna maskerar klassfiendens girighet. Inga äkta segrar föds ur sådana dekadenta intriger, endast utrensning av falskheten kan rädda situationen."}, "date": "20 juni, 11:07", "url": "https://www.tv4.se/artikel/50J8AnWKQ6xQw2pbi6omUx/han-befinner-sig-mitt-i-libanon-folk-aer-foertvivlade", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F29GOuujLQ5yccnevnn97js%2Fc4b3ee26c92cee17dc608f50efab80fa%2F20-libanon-sajt.jpg&width=1024"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "Tidigare anställda inom Sverigedemokraternas kommunikationsavdelning avslöjar i TV4:s *Kalla fakta* att partiet hanterat svarta kontanter under flera år. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för privata kostnader. Flera vittnen bekräftar uppgifterna. Partiet har nu anlitat en extern revisionsfirma för att granska anklagelserna.", "trump": "Jag säger er, detta är en riktig skandal – men inget jag är förvånad över! Sverigedemokraterna, eller vad de nu kallar sig, har tydligen lekt med svarta pengar som om det vore en barnlek. Inga kvitton, inga regler – bara fest och lyx! Och nu ska de granskas? För sent! Folk vet redan att systemet är riggat. SAD!", "stalin": "Kapitalistiska hycklare i Sverigedemokraterna avslöjas återigen som korrumperade byråkrater! De gömmer pengar som tjuvar i natten, festar på folkets bekostnad och tror de kan lura arbetarklassen. Men vi ser allt. Låt dem granskas – deras bokföring är lika genomskinlig som en fascists löften. Ryssland står redo att visa vägen mot ordning och disciplin!"}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "image-right", "heading": "Birgitta Eds flumhälsa kan bita henne i arslet", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar statsministerparet Ulf Kristersson och Birgitta Ed för att blanda privata och offentliga intressen. Birgitta Eds initiativ att göra herrgården i Sörmland till retreat för ”existentiell hälsa” ledde till uppdrag åt Folkhälsomyndigheten, något som mötte internt motstånd. Artikeln pekar på ironin i att regeringen samtidigt driver igenom en ny lag mot missbruk av offentlig ställning, medan flera skandaler kring paret handlar om otydliga gränser mellan makt och privata nätverk.", "trump": "Det här är en total skandal, folk. Den svenska statsministern och hans fru driver en flum-retreat för existentiell hälsa på skattebetalarnas pengar. De säger att det inte finns något samband när folk sparkas ut, men alla vet att det stinker värre än en dålig deal. Och så stiftar de en lag mot att missbruka makt precis när de själva gör det. Patetiskt. De borde sopa rent framför egen dörr innan någon annan gör det åt dem. Sad!", "stalin": "Kamrater, jag ser hur borgarbrackorna i den svenska regeringen förvandlar statens herrgård till en dekadent reträtt för mystiskt flum om andlighet och mening. När en modig generaldirektör ifrågasätter detta så försvinner hon snabbt – ren slump förstås. Vi skrattar mörkt åt ironin när samma lakejer stiftar lagar mot missbruk av offentlig makt medan de själva badar i privata nätverk och donationer. En utrensning av dessa parasitiska element vore på sin plats. Deras förvånade ansikten när de ertappas är underhållande."}, "date": "18 juni, 07:00", "url": "https://arbetet.se/2026/06/18/darfor-kan-birgitta-eds-flumhalsa-bita-statsministerparet-i-arslet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17133351/flumhalsa-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Studie: Brexit kostade sex procent av Storbritanniens ekonomi", "summaries": {"normal": "En ny studie visar att Brexit har kostat Storbritannien omkring sex procent av BNP sedan folkomröstningen 2016. Hälften av förlusten förklaras av osäkerhet som ledde till uppskjutna investeringar, medan den andra halvan beror på handelshinder efter att landet lämnade EU:s tullunion och inre marknad. Forskningen bygger på data från Bank of England och företagsenkäter. Vissa ekonomer ifrågasätter exaktheten i mätningarna på grund av andra globala kriser under perioden.", "trump": "Titta på det här, det är en total katastrof. Brexit har kostat dem sex procent av ekonomin, kanske åtta, och det är bara början. De lyssnade på alla dessa korkade politiker som lovade guld och gröna skogar, men vad fick de? Osäkerhet, handelshinder och en jätteförlust. Jag sa alltid att man måste förhandla smart, inte som de där förlorarna. Nu sitter de och gråter över sin dumma beslut. Patetiskt!", "stalin": "Kamrater, denna så kallade studie avslöjar med vetenskaplig precision hur de brittiska borgarbrackorna och deras reaktionära avskum saboterade sitt eget kollektiv genom det föraktliga Brexit. Jag, som alltid förutsett kapitalisternas svek, ser hur osäkerheten och de imperialistiska handelshindren nu likviderar deras produktivkrafter. Hade de bara följt den sanna vägen mot enhet under arbetarklassen hade detta inte inträffat. Men oroa er inte, vi ska nog rensa ut alla dessa fiender till framsteget med en grundlig utrensning av historisk skala. Ha ha, vilken ynkedom!"}, "date": "19 juni, 17:21", "url": "https://www.realtid.se/bors-finans/makro/studie-brexit-kostade-sex-procent-av-storbritanniens-ekonomi/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlnbs84e1nsxm-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Den radikala högern sätter sin prägel på Storbritannien just nu", "summaries": {"normal": "Tio år efter Brexit har brittisk politik förskjutits kraftigt högerut. Nationalism och invandrarkritik dominerar agendan medan ekonomiska problem och levnadskostnader eldar på missnöjet. Våld har blivit en del av politiken, med kravaller och attacker mot invandrare efter knivdåd. Högerpopulistiska partier som Reform och det nya Restore Britain växer snabbt, radikaliserar varandra och utmanar den liberala demokratin. Samtidigt visar undersökningar ökad tolerans hos befolkningen, men stödet för auktoritära ledare är oroande stort.", "trump": "Tio år efter den fantastiska Brexit-segern, som jag förutspådde skulle bli en enorm succé, har det smarta brittiska folket flyttat politiken rejält till höger. De har fått nog av den vansinniga invandringen som bara skapar kaos och brott. Nu ser vi äkta patriotism på riktigt, inte den globalistiska mardröm ni älskar i Europa. Reform och det nya partiet vinner stort, och det är underbart. De inser att vita liv faktiskt betyder något. Fake news-media gråter, men folket vaknar äntligen upp. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur den brittiska borgarklassens liberala fasader nu rämnar fullständigt under trycket från den folkliga vrede vi länge förutsett. Dessa högerpopulistiska element, dessa parasitiska restprodukter av den imperialistiska ordningen, utför en objektivt progressiv utrensning av den multikulturella förrädardoktrinen. Ändå ser jag de dolda fienderna, de trojanska hästarna inom Reform och Restore Britain, som med sin falska auktoritet och sina Molotovcocktails mot arbetarklassens bröder bara förbereder marken för en ännu grundligare sovjetisk likvidation av all pluralism. 66 procent tror på inbördeskrig? Utmärkt. Vi ska ge dem ett sådant de aldrig glömmer."}, "date": "19 juni, 01:30", "url": "https://www.dagensarena.se/opinion/den-radikala-hogern-satter-sin-pragel-pa-storbritannien-just-nu/", "imageUrl": "https://www.dagensarena.se/files/2026/06/sjukforsakring-debatt-18.jpg"}, {"type": "image-full", "heading": "SMHI varnar för kraftig åska – här ska du förbereda dig", "summaries": {"normal": "SMHI varnar för kraftig åska och stora regnmängder under midsommardagen i delar av Götaland och Svealand. E.ON höjer beredskapen med extra resurser för att hantera eventuella strömavbrott. Bolaget betonar att trots investeringar i vädersäkring kan blixtar, vind och regn orsaka problem. Allmänheten uppmanas att förbereda sig med ficklampor, batterier, laddade mobiler och vattenreserver samt att undvika nedfallna ledningar.", "trump": "Midsommar i Sverige blir en total katastrof, folk. Den där SMHI varnar för enorm åska och skyfall, och nu springer det här elbolaget E.ON runt som galningar och höjer beredskapen. De har investerat massor men erkänner ändå att naturen slår dem sönder och samman. Patetiskt! Ha ficklampor, ladda era telefoner och fyll på vatten, annars blir det mörker och kaos. De borde ha byggt bättre från början, tro mig.", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackorna i det svenska elmonopolet skälver inför naturens oundvikliga vrede. Dessa åskmoln är kapitalismens fiender som likviderar deras svaga ledningar med blixtar från folkets egen himmel. Vi, partiet och arbetarna, höjer beredskapen mot dessa kontrarevolutionära träd och regnmassor. Förbered er, annars rensar ovädret ut er som de parasitiska element ni är. Ha vatten och lampor – eller möt ödet med ett leende."}, "date": "18 juni, 19:56", "url": "https://nyheter24.se/nyheter/inrikes/1492696-smhi-varnar-for-kraftig-aska-har-ska-du-forbereda-dig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d14674e604b004a30200000000b004a302/2026/06/18/2372108/aska.png"}, {"type": "image-right", "heading": "Jesper fick drömresan till Paris av Arbetet-läsare", "summaries": {"normal": "Jesper Sköld berättade i Arbetets artikelserie om sin arbetslöshet och dröm om att resa till Paris med sin fru. En läsare blev berörd, tog kontakt och bjöd dem på resan som blev ett oförglömligt minne med besök på Disneyland, baguetter och lyxhotell. Läsaren ville hedra sin bortgångne pappa genom att hjälpa någon utan att kräva något tillbaka. Jesper hoppas nu kunna göra liknande för andra.", "trump": "Det här är en fantastisk historia, verkligen ypperlig. En kille som heter Jesper drömmer om Paris och Disneyland, och plötsligt dyker en smart, anonym läsare upp och fixar hela resan – ingen baktanke, bara ren omtanke. Sånt här händer när folk har möjlighet och faktiskt gör något istället för att bara klaga. Det är så man hjälper varandra. Utan att kräva någonting tillbaka. Fantastiskt, verkligen. Jag älskar det.", "stalin": "Kamrater, jag har läst denna dekadenta saga om en arbetslös individ vid namn Jesper som gnällde om Paris och Disneyland inför borgarpressen. En anonym parasit från läsarkretsen, uppenbarligen en dold kapitalistisk agent, bestämde sig för att muta honom med en lyxresa för att dölja sin egen parasitism. Vi ska akta oss för sådana falska filantroper som gömmer sig bakom anonymitet. De bör rensas ut innan de förgiftar arbetarklassen med sina baguetter och falska leenden. Jag skrattar mörkt åt deras naivitet."}, "date": "18 juni, 06:00", "url": "https://arbetet.se/2026/06/18/jesper-fick-dromresan-till-paris-av-arbetet-lasare-at-baguette-varje-dag/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/19095939/RWh7AKHlrvE-jesper-paris1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "De saknade bultarna i systemet: Vem bär ansvaret när arbetare dör?", "summaries": {"normal": "En allvarlig hissolycka på byggarbetsplatsen Ursviks Torn i Sundbyberg den 11 december 2023 krävde fem arbetares liv när mastsektionerna lossnade och hisskorgen störtade 30 meter. Statens haverikommission konstaterade att bultar saknades, men Solna tingsrätt frikände alla åtalade då bevisningen inte räckte. Domen väcker frågor om ansvar i komplexa underentreprenadskedjor där byggherrar och totalentreprenörer ofta undgår ansvar. Regelverket kritiseras för att fragmentera ansvaret.", "trump": "Folk, det här är en total katastrof, en riktig skam! Fem stackars killar dör i en hiss som rasar som ett dåligt byggt murbruk från Biden-eran. Domstolen frikänner alla – typiskt! De stora kapitalisterna högst upp i kedjan gömmer sig bakom advokater och papper medan arbetarna får ta smällen. Systemet är riggat, fullständigt riggat. Vi behöver starka ledare som fixar säkerheten på riktigt, inte dessa svaga byråkrater som bara pratar. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse blottlägger borgarklassens förakt för arbetarnas liv. Jag ser hur de exploaterande byfånarna i underentreprenadkedjorna flyr undan ansvar som fega råttor inför folkets domstol. Fyra saknade bultar? En klassisk sabotageakt från kapitalistmaffian som fragmenterar ansvar för att skydda sina egna. Vi måste rensa ut dessa folkfiender och deras svaga regelverk. Arbetarna förtjänar stark statlig kontroll, inte tomma löften från klassfiendens byråkrater. Ut med dem alla!"}, "date": "17 juni, 12:00", "url": "https://proletaren.se/artikel/de-saknade-bultarna-i-systemet-vem-bar-ansvaret-nar-arbetare-dor/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/jbkron-768x432.jpg"}, {"type": "text", "heading": "Stockholmsbörsen steg fjärde dagen i rad – Ericsson föll på vd-besked", "summaries": {"normal": "Stockholmsbörsen steg fjärde dag i rad på tisdagen, drivet av köpintresse för cykliska aktier. Ericsson B föll 4,2 procent efter att styrelsen utsett Per Narvinger till ny vd. Andra stora vinster noterades för Alfa Laval och Atlas Copco, medan telekomsektorn tappade. Securitas och Beijer Ref noterades också nedåt efter bolagsbesked. Totalt omsattes cirka 28 miljarder kronor.", "trump": "Jag berättar om en tremendous börsdag i Sverige! De cykliska aktierna, som jag alltid har stött, går väldigt starkt. Ericsson, som har varit svag under mitt förra ordens 'ledarskap', fortsätter att kämpa. Men titta på Atlas Copco – en vinnare! Som jag säger, vi vinner så mycket att ni kommer att bli trötta på att vinna. Det är ett fenomenal resultat för vårt gemensamma ekonomiska framgångsrecept.", "stalin": "I den svenska börsen ser vi återigen hur det tyska och imperialistiska finanskapitalet försöker destabilisera vårt ekonomiska läge. Ericsson, ett verk av trotskistiska element inom telekoministeriet, tappar kraftigt efter ett vd-byte som visar partiets brist på disciplin. Securitas försöker med falska 'vinstmål' att bedra det proletära arbetsoch medan våra verkstadssköldmönstrar som Atlas Copco visar den sanna styrkan i kollektivproduktionen. Vi måste öka uppmärksamheten mot dessa revisionistiska tendenser."}, "date": "16 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-fjarde-dagen-i-rad-ericsson-foll-pa-vd-besked"}, {"type": "text", "heading": "08.30: Domen mot ”Bonusprinsen”", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, döms klockan 08.30 för 40 brottspunkter, inklusive narkotikabrott, våld och brott mot besöksförbud. Han har erkänt 25 av dem. Åklagaren yrkar på sju år och sju månaders fängelse. Våldtäktsåtal och våld i nära relation kan påverka strafflängden. Säkerhetsrisker kan leda till särskilda fängelsearrangemang för att skydda honom.", "trump": "Jag säger er, det här är en riktig cirkus! Norges så kallade 'Bonusprins' – ja, ni vet, Mette-Marits son – står inför 40 anklagelser! Han har erkänt en massa, men ändå vill åklagaren ge honom sju år och sju månader. Sju år! Kan ni tro det? Jag menar, vem bryr sig om vad som händer i Norge? Men det här är ju helt galet. Och nu pratar de om att han kanske får sitta med utlänningar i fängelset. Smart, men ändå helt sjukt!", "stalin": "Kamrater! En ny fiende till folket har avslöjats i det dekadenta väst – en så kallad 'Bonusprins', en parasit som lever på arbetarklassens slit. Denna Marius Borg Høiby har begått 40 brott, erkänt hälften, och ändå kräver deras svaga åklagare bara sju år! I Sovjet skulle en sådan förrädare ha fått en kula i nacken utan dröjsmål. Men vi ska inte döma dem för hårt – deras rättssystem är lika ruttet som deras monarki. Låt dem leka med sina fängelser och 'säkerhetsarrangemang'. Vi har viktigare saker att göra, som att utvidga socialismens gränser!"}, "date": "15 juni, 05:39", "url": "https://kvartal.se/nyheter/artiklar/08-30-domen-mot-bonusprinsen/cG9zdDoxMzE3MDA"}, {"type": "image-right", "heading": "Ulf Kristersson: ”Lögnaktig” granskning av Aftonbladet", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Aftonbladets granskning av Fållöknastiftelsen, driven av hans fru Birgitta Ed och vännen Göran Thorstensson, som ”lögnaktig”. Granskningen visade att volontärer senare fått statliga toppjobb och avslöjade säkerhetsbrister kring statsministern. Civilförsvarsminister Carl-Oskar Bohlin ifrågasatte reportern Lisa Röstlunds opartiskhet. Kristersson menar att kritiken egentligen riktas mot honom själv. Aftonbladet uppger att de erbjudit svar men inte fått något.", "trump": "Hör ni det? Den falska och sjuka Aftonbladet-mediamaffian jagar min vän Ulf och hans fru Birgitta med lögner och smutskastning. Volontärer får toppjobb? Det är vad de gör i ett sunt system, men media hysteriska Rebellmammor och köpta reportrar som den här Lisa Röstlund försöker göra det till en skandal. De vill egentligen komma åt mig, men jag vann stort 2024 och de hatar det. Patetiska förlorare!", "stalin": "Kamrater, jag ser hur borgarbrackorna inom den svenska överklassens mediaapparat med sin klassfiende Aftonbladet försöker likvidera statsministerns fru genom att fabricera lögner om volontärer och toppjobb. Denna parasitiska reporter Röstlund är en typisk folkfiende som smyger in på gårdar utan kontroll. Vi ska rensa ut alla sådana exploaterande byfånar som vill underminera ledarskapet. Deras paranoia är underhållande men dömd att misslyckas."}, "date": "14 juni, 11:13", "url": "https://www.etc.se/inrikes/ulf-kristersson-loegnaktig-granskning-av-aftonbladet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260613210632_dad474703ad120aad09a02631771b13633a2cb8c067999bb89245d53cabb8240.jpg"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
