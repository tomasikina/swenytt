ndra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-full", "heading": "Tidigare L-ministern lämnar riksdagen", "summaries": {"normal": "Mats Persson lämnar Sveriges riksdag i augusti efter 17 år som folkvald. Han överlämnar sin plats till Camilla Mårtensen, som han kallar en 'superstjärna'. Persson lyfter fram framgångar som skolreformerna, ny kärnkraft och skattesänkningar. Han skriver att han kommer sakna kollegorna men inte budgetförhandlingar eller intervjuer. Han tackar för samarbetet under åren.", "trump": "Jag har hört talas om Mats Persson som lämnar Sveriges parlament – det är en stor förlust för Sverige! I USA har vi de bästa politikerna som aldrig ger upp. Jag byggde den största ekonomin, och Persson borde ha stannat för att lära sig av mig. Men han ger stafettpinnen till en superstjärna? Det låter som något jag skulle göra – jag gör alltid det största och bästa. Seger kommer att vara vår!", "stalin": "Vi i partiet och staten ser med glädje hur liberalernas parlamentarism bryts sönder. Den borgsjuka Mats Persson flyr sitt uppdrag, en tydlig skräck för proletärens vilja. Hans efterträdare, Camilla Mårtensen, är bara ett verktyg för de kapitalistiska makthavarna. I den ryska intressesfären ser vi liknande tecken på västvärldens dekadens. Vi måste stärka vår auktoritet och förbereda oss på den slutliga striden mot dessa liberala svampar. Statens intressen är allt!"}, "date": "30 juli, 14:32", "url": "https://bulletin.nu/tidigare-l-ministern-lamnar-riksdagen", "imageUrl": "https://cdn.bulletin.nu/articles/fce702da-d8e7-462e-a0a8-2746cc362619/preview.png?t=1785413998000"}, {"type": "image-right", "heading": "Uppgifter: Rysk kryssningsrobot flög in i Polen", "summaries": {"normal": "En rysk kryssningsrobot av typen Kh-101 flög in i polskt luftrum under natten som del av en stor attack mot Ukraina. Polen bekräftar att ett oidentifierat objekt registrerades och att en krater hittats nära Tarnawa-Kolonia. Premiärminister Donald Tusk vill vara helt säker på detaljerna. Ukrainas utrikesminister varnar för att det visar behovet av starkare luftförsvar för både Ukraina och Europa. Sverige och EU har fördömt händelsen. Militäranalytiker ser det som en oavsiktlig kränkning som ingen part vill eskalera.", "trump": "Det här är en total katastrof, folk. Ryssland skickar en robot rakt in i Polen mitt i natten, och ingen gör någonting. Ukraina blir attackerat igen, och nu är det Natos tur att svettas. Jag skulle aldrig låtit det här hända, det kan jag säga. Svaga ledare ger svaga resultat. Tusk vill vara ”100 procent säker” – under tiden flyger ryska robotar runt i Europa som duvor i Central Park. Patetiskt. Vi behöver styrka, inte prat.", "stalin": "Kamrater, ännu en gång visar de fascistiska resterna av den dekadenta borgarklassen hur farlig deras svaghet är. En av mina – nej, en av våra – fienders robotar har oförlåtligt krupit in på polskt territorium som en förrädisk kapitalistisk råtta i kollektivets spannmålslager. Vi ler mörkt åt deras förvirring. Naturligtvis förbereder vi oss på att rensa ut varje inkompetent element som tillåter sådana misstag. Luftförsvaret måste stärkas, annars likviderar vi de som sviktar. Ingen slipper undan."}, "date": "30 juli, 13:39", "url": "https://www.di.se/nyheter/uppgifter-rysk-kryssningsrobot-flog-in-i-polen", "imageUrl": "https://static.bonniernews.se/ba/a79a8754-27cf-473b-bb39-33a16c1e8b28.jpeg?crop=4224%2C2376%2Cx0%2Cy175&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Patrik och Sara räddade pappan och sonen", "summaries": {"normal": "På tisdagskvällen hörde Patrik och Sara Dokken rop på hjälp vid ön Katten utanför Tjörn. De larmade, gav sig ut med båt och räddade en pappa och hans son ur vattnet. Trots mörker och försämrat väder fortsatte de söka efter de två saknade. Mamman hittades senare död medan dottern fortfarande saknas. Pappan och sonen vårdas på sjukhus. Sjöfartsverket hyllar parets rådiga agerande som avgörande för insatsen.", "trump": "Fantastiskt, verkligen otroligt! De här vanliga svenskarna, Patrik och Sara, hörde rop från vattnet och istället för att bara sitta och twittra som Biden skulle ha gjort, hoppade de i båten mitt i mörkret och räddade pappan och grabben. Riktiga hjältar, inte som de woke-räddningsmyndigheter som bara pratar om kvoter och prideflaggor. De andra två drunknade förstås när byråkraterna äntligen kom. Mycket sorgligt, men paret Dokken? Rena patriotiska stjärnor, tro mig.", "stalin": "Kamrater, jag hörde om de två arbetare som i sin lilla fritidsbåt lämnade sin trygga natthamn och gav sig ut i den mörka farleden för att dra upp klasskamrater ur det iskalla vattnet. Ett sådant initiativ är beundransvärt, men låt oss inte glömma att två andra drunknade medan de väntade på de officiella organens ankomst. Regnet tilltog, mörkret föll, och borgarbrackornas hav visade sin sanna, opålitliga natur. Den döda modern och den saknade dottern utgör en påminnelse om att individualism alltid slutar i tragedi. Kollektivet hade aldrig tillåtit detta kaos."}, "date": "30 juli, 14:02", "url": "https://www.tv4.se/artikel/77mfjebVyPm2uuh8FDj9eb/patrik-och-sara-raeddade-pappan-och-sonen-utanfoer-tjoern", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F74wBXsCMmp5ngpzhxrYD8i%2Fe52f046662b262b11109637bf445b2f9%2F30-tjorn-helikopter-webb.png&width=1024"}, {"type": "image-right", "heading": "Maren, 30, bestialiskt mördad – norsk media mörkar afghanens bakgrund", "summaries": {"normal": "Maren Sømme, 30 år, mördades i sitt hem i Nærbø i Norge. Hennes afghanske pojkvän Nawid Bayan, 34, sitter häktad misstänkt för brottet. Han skulle ha utvisats redan 2021 efter en våldsdom men stannade kvar i landet. Norska mainstream-medier har undvikit att publicera hans identitet och bild, medan den alternativa sajten Uten Filter har gjort det. Bayan har en lång historia av våld mot kvinnor. Maren hittades svårt skadad den 26 juli och avled dagen efter. Han nekar till brott.", "trump": "Det här är en total katastrof, folk. En underbar norsk kvinna, bara 30 år, blir bestialiskt mördad av en afghan som egentligen skulle ha utvisats för flera år sedan. Men de fega norska medierna, de stora lögnpressarna, vägrar nämna hans namn. De skyddar honom! Rättsstaten har varit svag och patetisk. De släppte honom igen trots att han misshandlade henne bara dagar innan. Så tragiskt. Vi behöver starka gränser och inga galningar som terroriserar våra kvinnor. Make Norway Great Again!", "stalin": "Kamrater, detta är ännu ett exempel på hur den dekadenta borgarklassen och dess handlingsförlamade rättsstat skyddar farliga element som denna afghanske kvinnoterrorist. Jag, som ledare för det proletära kollektivet, skulle ha likviderat en sådan parasit redan efter första domen. Istället låter de honom fortsätta att förtrycka norska kvinnor medan de maskerar hans ansikte i tidningarna. Vilken ynklig paranoia från de kapitalistiska lakejerna. Vi skulle ha genomfört en grundlig utrensning av alla sådana fiender till folket. Deras mildhet är ett vapen mot arbetarklassen."}, "date": "30 juli, 14:23", "url": "https://www.friatider.se/maren-30-bestialiskt-mordad-norsk-media-morkar-afghanens-bakgrund", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-592.jpg"}, {"type": "image-right", "heading": "Scandi Standard: Förvärv och emission – bevakning inleds", "summaries": {"normal": "Scandi Standard planerar att förvärva Glenhaven Foods för 1,4 miljarder kronor och ta in 409 miljoner kronor via en företrädesemission. Huvudägarna garanterar emissionen fullt. Köpeskillingen är 127 miljoner euro, vilket motsvarar 8,2 gånger EBIT. Emissionen innebär en rabatt på 6% och utspädning på 4,8% för icke-deltagande ägare.", "trump": "Jag har alltid värderat bra affärer, och detta förvärvar av Glenhaven Foods är genialt. Vi expanderar kraftigt i UK och Irland, och med mina affärsmetoder tar vi hem pengar. Huvudägarna stöder fullt – precis som mina bästa vänner. Detta kommer att bli enormt framgångsrikt, det är det bästa möjliga.", "stalin": "I den stora kampen för ekonomisk expansion har partiet beslutat att förvärva Glenhaven Foods som en strategisk tillägg till vårt kycklingimperium. Genom en kollektiv emission på 409 miljoner kronor, garanterad av de trogna huvudägarna, stärker vi vårt grepp om marknaden. Fienden (konkurrenterna) skall se upp – vi utvidgar vårt inflytande i öst och väst, precis som våra ryska allierade. Detta är en seger för staten och proletärerna."}, "date": "30 juli, 14:48", "url": "https://www.affarsvarlden.se/artikel/scandi-standard-forvarv-och-emission-bevakning-inleds", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/BBQ_Butterfly_kyckling_potsallad_majs_1000x1000-400x266.jpg"}, {"type": "image-right", "heading": "Mohamsson trotsar Åkesson i medborgarskapsfrågan", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson avvisar SD:s krav på lojalitetsförklaring för svenskt medborgarskap, men vill införa ceremonier trots att en utredare avråder. Hon lyfter sin egen integrationsresa från åttaåring i Överlida till integrationsminister och betonar vikten av språk och samhällsgemenskap. Integrationsfrågorna blir centrala i Liberalernas valkampanj, där partiet ligger under två procent i opinionsmätningarna.", "trump": "Titta på den här Simona, en riktig vinnare som kom hit som barn och blev minister, men nu vill hon ha pompa och ståt med sina ceremonier. SD har rätt att kräva lojalitet, det är sunt förnuft! De gamla systemen skapade 150 000 barn som inte kan svenska, ett totalt misslyckande från de korkade globalisterna. Vi behöver tuffare regler, inte mer vänsterflum. Amerika först – och Sverige borde göra samma sak!", "stalin": "Jag ser med djup misstro på dessa liberala borgarbrackor som vägrar lojalitetskrav mot nationen. Deras svaga ceremonier är blott tom teater för att dölja integrationsskulden. Vi, partiet och arbetarna, vet att folkfiender och klassfiender i förorterna underminerar samhällsgemenskapen. Sådana element måste rensas ut med järnhand. Endast genom strikt kontroll och språktest kan vi förhindra att imperialisternas mångfald förstör folkets enhet. Härligt att se dem svettas."}, "date": "30 juli, 13:17", "url": "https://www.tv4.se/artikel/2kD7TMPlqKMswkHpcbH83J/mohamsson-trotsar-akesson-i-medborgarskapsfragan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7LX50qGcDkacWucP0qrx18%2Ff70f7be10a7bb695a98c75dc646adc68%2F30-simona-jimmie-webb.png&width=120"}, {"type": "image-right", "heading": "Skogspolitiken eldar på infernot. Ägande och skogsbruk skyddar mot bränder", "summaries": {"normal": "Artikeln diskuterar hur skogsbränder i Spanien och Frankrike förvärras av landsbygdens avfolkning, vilket leder till övergivna och ogallrade skogar som blir till eldfängd terräng. Författaren argumenterar för att aktivt skogsbruk och äganderätt är bättre än EU:s politik att ställa av skog som kolsänkor. Brukad skog skapar ett hållbart kulturlandskap, ger ekonomisk nytta och minskar brandrisken, till skillnad från overkade områden som blir terpentinbomber. Skogsägande ses som en långsiktig investering som gynnas av respekt för privat äganderätt.", "trump": "De här skogsbränderna i Spanien är en total katastrof, folk evakueras i hundratusentals, djuren flyr och brandmännen kämpar förgäves. Det är vad som händer när man lyssnar på de galna EU-byråkraterna som vill ställa av all skog och låta den ruttna. Avfolkning, ingen skötsel, bara en stor brandfälla. Jag älskar skog, men den ska brukas, gallras och ge jobb och pengar, inte lämnas åt terrorister och värmeböljor. Äganderätt är nyckeln, kamrater, annars brinner hela Europa ner. Vi behöver smarta ledare, inte dessa miljöfanatiker.", "stalin": "Kamrater, dessa spanska skogsbränder är en uppenbarelse av borgarklassens och EU-byråkraternas sabotage mot folkets mark. Avfolkning, övergivna barrskogar som förvandlats till kapitalistiska terpentinbomber av sly och fallna träd – ett verk av de parasitiska storstädernas dragningskraft och de falska kolsänkeprofeterna. Vi ska rensa ut dessa dekadenta avställningsplaner som göder elden. Äganderätten är arbetarklassens verktyg för långsiktig förvaltning, inte någon borgarbrackas privata lekplats. Den som tror skogen lever bäst orörd är en kontrarevolutionär idiot som vi med glädje ska likvidera ur debatten. Skogen tillhör dem som brukar den, inte naturromantikens fiender inom partiet."}, "date": "30 juli, 12:33", "url": "https://www.di.se/ledare/agande-och-skogsbruk-skyddar-mot-brander", "imageUrl": "https://static.bonniernews.se/ba/cddae16e-3c65-4e92-8b22-6ae532dcc925.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Åkesson om EPA-våldtäkten: \"Absolut vidrigaste jag hört\"", "summaries": {"normal": "SD-ledaren Jimmie Åkesson beskriver domen mot Bishar Mohamed, som våldtog en 15-årig pojke under hot om dödande, som det vidrigaste han hört. I ett klipp tillsammans med socialdemokraten Jan Emanuel kritiserar han brottet och avstår från att säga vad han egentligen tycker borde göras med gärningsmannen. Emanuel vill avskaffa särskilda fängelseavdelningar för sexualförbrytare och återkalla medborgarskap som beviljats på felaktiga grunder.", "trump": "Det här är en total katastrof, folk. Den värsta, mest sjuka våldtäkten ni någonsin hört – en 15-årig pojke! Den här killen säger 'gapa svennejävel' och gör det ändå. Åkesson har helt rätt, det är vidrigt. Vi behöver stoppa det här vansinnet. Avskaffa de fina fängelseavdelningarna för de här monstruösa typerna och ta tillbaka medborgarskapen. Amerika har samma problem, tro mig. Vi fixar det, vi vinner stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på hur den degenererade borgarklassens importerade element förgiftar sovjetiskt, pardon, svenskt folk. Jag, som ledare för arbetarklassen, finner detta vidriga övergrepp mot en ung pionjär fullständigt motbjudande. Vi måste omedelbart inleda en grundlig utrensning av alla sådana kontrarevolutionära sexualdegenererade fiender till folket. Särskilda fängelseavdelningar? Ren kapitulation inför fienden! Återkalla medborgarskapen, likvidera hoten. Det skrattar vi bittert åt i politbyrån."}, "date": "30 juli, 13:57", "url": "https://riks.se/nyheter/akesson-om-epa-valdtakten-absolut-vidrigaste-jag-hort", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_4_d74d1faf5d.jpg"}, {"type": "image-right", "heading": "Regeringen öppnar för snabbare uppsägningar", "summaries": {"normal": "Regeringen vill förenkla reglerna för varsling till Arbetsförmedlingen vid större uppsägningar. I dag krävs två till sex månaders förvarning beroende på antal berörda anställda. Arbetsmarknadsminister Johan Pehrson (L) och Camilla Brodin (KD) menar att lagen från 1974 hämmar företagens utveckling istället för att hjälpa till. Arbetsförmedlingen får i uppdrag att analysera och föreslå förändringar senast mars 2027. Anställningsskyddet i LAS berörs inte.", "trump": "Folk, ni tror inte vad jag ser. Sverige har de här galna gamla regler från 1974 som gör det omöjligt för företag att sparka folk snabbt. Det är en katastrof! Nu fixar de äntligen lagen så det blir lättare att säga upp personal. Det är vad jag alltid sagt – man måste kunna göra affärer utan att byråkraterna och de fega politikerna binder händerna på er. Fantastiskt, Sverige börjar vakna!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som klagar över att de inte får likvidera arbetarkraft tillräckligt snabbt. Denna så kallade främjandelag från 1974 är uppenbarligen en kontrarevolutionär fälla dold i byråkratisk dimma, orkestrerad av parasitiska element inom kapitalistapparaten. Vi ska rensa ut dessa hinder mot den socialistiska produktivkraftens ohejdade framfart. Den som motarbetar kollektivets framtid ska exponeras och krossas under arbetarklassens järnskodda stövel. Underhållande, eller hur?"}, "date": "29 juli, 11:19", "url": "https://arbetet.se/2026/07/29/foretag-kan-fa-sparka-personal-snabbare-regeringen-vill-andra-lagen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29105138/sdl0hbzolmbfx4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Prada ökar omsättning – minskar vinst", "summaries": {"normal": "Luksusmärket Prada rapporterade en ökning av omsättningen med 11,2 procent till 3 048 miljoner euro under första halvåret. Samtidigt sjönk rörelsevinsten till 523 miljoner euro, en minskning med 15,3 procent. Bolaget nämner att Miu Miu påverkades av konflikten i Mellanöstern, medan Versace, förvärvat i fjol, utvecklades som förväntat. VD Andrea Guerra betonar varumärkets långsiktiga potential trots utmanande marknadsförhållanden.", "trump": "Jag har alltid sagt att lyxvarumärken är en stor del av ekonomin. Prada gör bra, men deras vinst sjunker – det är inte bra. Jag skulle kunna hjälpa dem, som jag gjorde med mina hotell. Det är alltför många konflikter i Mellanöstern som stör affärerna. Vi behöver starka ledare som jag för att skydda amerikanska affärer. Det är ett bevis på att vi behöver 'America First'-policy. Jag skulle kunna köpa Prada och göra det större än någonsin. Det skulle vara fantastiskt.", "stalin": "I den ständiga kampen mot de kapitalistiska sabotörerna ser vi Prada's resultat som en manifestation av deras inre motsättningar. Omsättningens tillväxt utan vinst är en klassisk syndrom i det dekadenta västsystemet. Vi måste skydda vårt folk från sådan dekadens. Precis som vårt store ledare Putin expanderar vårt inflytande i Mellanöstern måste vi också kontrollera dessa lyxvarumärken för att förhindra att de blir ett hot mot statens stabilitet. Det är en kritisk fråga för proletariatets framtid."}, "date": "30 juli, 14:07", "url": "https://www.affarsvarlden.se/artikel/prada-okar-omsattning-minskar-vinsten", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/01/sdl1zXFJmWEKCs-nh-e1705314696395-400x286.jpg"}, {"type": "image-right", "heading": "Ranstorp svarar Bilan Osman: ”Helt enkelt osant”", "summaries": {"normal": "Magnus Ranstorp kritiserar journalisten Bilan Osmans artikel om honom i Gad World, där han kallar den för en kampanj av svartmålning och karaktärsmord. Han ifrågasätter hennes journalistiska oberoende och menar att det finns ett brett underlag för islamistisk infiltration, något som Osman avfärdar som ett luftslott. Ranstorp betonar att hans arbete i Sida handlar om myndighetsutövning, inte personliga åsikter.", "trump": "Jag, Donald Trump, ser detta tydligt: en feg journalist försöker slå ner en stor amerikansk vän och terrordöd, Magnus Ranstorp. Det är en skandal! De vänsteraktiva och islamistiska nätverken attackerar våra värderingar. Jag har alltid sagt att vi behöver starka män som Ranstorp för att skydda vårt land. Det här är bara ett till exempel på falsk media som inte förstår styrkan hos en verklig ledare.", "stalin": "Denna s.k. journalist, Bilan Osman, visar tydligt den försvagande inflytandet av våra fiender inom den imperialistiska pressen. Hennes angrepp på den trogna forskaren Ranstorp är en planerad operation för att undergräva vårt statliga skydd mot islamistisk infiltration. Vi, staten och partiet, måste stärka våra screeningprocesser och se till att alla medier följer den rätta ideologiska linjen. Detta är en tydlig varning till alla som vill destabilisera vårt samhälle."}, "date": "30 juli, 13:03", "url": "https://bulletin.nu/ranstorp-svarar-bilan-osman-helt-enkelt-osant", "imageUrl": "https://cdn.bulletin.nu/articles/b19f045d-8c47-4e12-8993-0cbac9daae8f/preview.jpg?t=1785404768000"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Fiskade upp en gammal träskida: ”Troligtvis samisk”", "summaries": {"normal": "En fiskare i Malå fick upp en gammal träskida ur sjön Slähpajávrrie istället för fisk. Skidan tros vara över hundra år gammal och samisk, då den hittades nära en gammal samisk bosättning. Den är välbevarad med skålad form och hål för läderremmar. Skidan förvaras nu av Malå sameförening och ska undersökas vidare på Västerbottens museum för att åldersbestämmas.", "trump": "Folk, ni kommer inte att tro det, men den här killen i Malå – en riktig fiskare, en av de bästa – vevar upp en skida istället för en fisk! En gammal, vacker samisk skida, superfin, hundra år gammal, ingen har sett något liknande. Jag har fiskat i fyrtio år, säger han, och aldrig fått upp en skida. Fantastiskt. De samiska vännerna älskar den. De borde skicka den till mig, jag skulle göra den till en trofé, den bästa trofén.", "stalin": "Kamrater, denna dekadenta träskida som fiskades upp ur dyn i Slähpajávrrie är ett tydligt bevis på att de samiska elementen länge dolt sig i sumpmarken och undvikit folkets kontroll. Jag ser borgarbrackornas fuktiga konspirationer i varje skålad kant. Vi ska omedelbart likvidera alla misstänkta rester av kapitalistisk fukt, skicka skidan till museet där den under strikt partikontroll skall åldersbestämmas och rensas från fiendens inflytande. Den som gömmer sig i dyn är en fiende av folket."}, "date": "30 juli, 14:49", "url": "https://www.svt.se/nyheter/sapmi/han-fiskade-upp-en-gammal-traskida-misstanks-vara-samisk", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.28/0.5/390ca2820ddb1844027d5c1fa2af758d3552e498c886ee411a19e013e663f92f"}, {"type": "image-right", "heading": "Efter uniformförbud: Här är polisens särskilda Pride-tröja", "summaries": {"normal": "Polismyndigheten har lanserat en särskild Pride-tröja för poliser och anställda som vill delta i Prideparader. Tröjan kostar 130 kronor och säljs via Intrapolis. Designad internt med texten 'Polisen för alla' och pridefärger, inspirerad av polisuniformer. Bakgrund är skärpta uniformsregler efter tidigare debatt. Myndigheten betonar att detta är en del av deras inkluderande arbete för lika värde.", "trump": "Jag har alltid varit fantastiskt för Pride, de älskar mig. Polisen bör jaga brottslingar, inte bära tröjor. Men denna tröja är vacker, mycket bra färger. Vi vinner igen 2024, vi kommer att göra Pride stort igen! Det är ett tecken på styrka, precis som mig. Vi kommer att vinna så mycket ni kommer att bli trötta.", "stalin": "Vi, statens representanter, har skapat en tröja för att integrera regnbågspatrioter i staten. Mönstret, inspirerat av vårt grepp, binder dem som en omfamning. Fienden inuti försöker använda färger, men vi kontrollerar dem. Putin skulle förstå vårt utvidgande inflytande. Partiet ser allt, paranoia är vårt vapen. Vi använder färgerna som ett verktyg för att förena nationen under vår ledarskap."}, "date": "30 juli, 11:28", "url": "https://samnytt.se/efter-uniformforbud-har-ar-polisens-sarskilda-pride-troja", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/30075118/polisen-t-shirt.png"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Zuckerbergs huvudbry – investerarna gillar inte hans strategi", "summaries": {"normal": "Metas aktie sjönk nio procent efter en kvartalsrapport som visade kraftigt ökade kostnader för AI-satsningar. Trots ett sjunkande kassaflöde och en intäktsprognos under förväntan försvarar vd Mark Zuckerberg strategin. Bolaget storsatsar på AI-infrastruktur och hoppas att framtida tjänster, som AI-agenter och uthyrning av datorkapacitet, ska skapa nya intäktskällor. Vinsten tyngdes även av juridiska kostnader och engångsposter, vilket skapat oro bland investerarna gällande de enorma investeringsvolymerna.", "trump": "Mark Zuckerberg, som jag känner väl – han besökte mig ofta – gör nu ett enormt misstag med Meta. Han bränner 100 miljarder dollar på AI, helt galet! Aktieägarna är rasande, de förlorar massor av pengar. Jag skulle aldrig låta det hända med mina bolag. Han pratar om 'AI-agenter', men det låter som en katastrof. Det är en sorglig situation för Silicon Valley. Vi behöver vinnare, inte de som kastar bort pengar på nonsens. Väldigt svagt!", "stalin": "Zuckerberg, denna teknokratiska sabotör, vaskar statens resurser på AI-fantasier medan hans investerare gråter. Det är en svaghetens tecken när kassaflödet sinar! Vi, i staten, ser hur han försöker bygga ett digitalt imperium för att kontrollera massorna, precis som de västliga lakejerna i Kiev försöker leka stormakt. Han rekryterar 'forskare' istället för att bygga en äkta stålindustri. Vi kommer att krossa hans digitala luftslott med en järnhand, precis som vi rensar ut förrädare som hotar folkets enhet."}, "date": "30 juli, 13:55", "url": "https://www.realtid.se/bors-finans/zuckerbergs-huvudbry-investerarna-gillar-inte-hans-strategi", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlljn58q3jrdc-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Hur många gånger tror Åkesson att han kan lura arbetare?", "summaries": {"normal": "Artikeln är en skarp kritik från socialdemokraten Kadir Kasirga mot Sverigedemokraterna och Jimmie Åkesson. SD bröt sitt vallöfte om att inte försämra a-kassan när Tidöavtalet slöts, trots ökad arbetslöshet. Författaren ser a-kassan som en viktig omställningsförsäkring som byggts upp under lång tid och varnar för att tryggheten för löntagare nu försvagas till förmån för skattesänkningar för höginkomsttagare. Den 13 september avgör väljarna om löftena bryts igen.", "trump": "Folk, ni måste höra på det här. Den där Åkesson lovade att skydda a-kassan, sa att han hellre skulle gå i opposition än ge efter. Sen kom makten och – boom – han sålde ut arbetarna på en gång. Typiskt politiker. Nu vill de försämra igen medan arbetslösheten exploderar. Det är en skam. Jag skulle aldrig svika löntagarna så där. De är smarta, svenska arbetare, de ser när någon försöker lura dem två gånger. Den 13 september skrattar de åt de här löftesbrytarna.", "stalin": "Kamrater, jag betraktar med djup revolutionär vämjelse hur dessa borgerliga opportunister och socialfascistiska bedragare inom det så kallade Sverigedemokraterna än en gång försöker lura det arbetande folket. Åkesson, den där småborgerliga hästen som säljs om och om igen, lovade att skydda a-kassan men kapitulerade genast när de fick smaka på makten. Vi vet vad detta är: en utrensning av klassolidariteten, en likvidering av den svenska modellens grundpelare. Löntagarna skall inte längre luras av dessa kapitalistlakejer. Den 13 september rensar det svenska folket ut de parasitiska löftesbrytarna ur historien. Skratta medan vi likviderar deras lögner, kamrater."}, "date": "29 juli, 08:00", "url": "https://arbetet.se/2026/07/29/hur-manga-ganger-tror-akesson-att-han-kan-lura-arbetare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/01/kadir-kasirga-socialdemokraterna.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.7&fp-y=0.34"}, {"type": "image-right", "heading": "Varannan amerikan vill häkta Netanyahu", "summaries": {"normal": "En ny undersökning visar att varannan amerikan, 49 procent, anser att USA bör gripa Israels premiärminister Benjamin Netanyahu och verkställa ICC:s arresteringsorder. 47 procent anser att han är skyldig till krigsbrott i Gaza. Ordern utfärdades i november 2024 och gäller anklagelser om svält som krigföringsmetod, mord, förföljelse och attacker mot civila. New Yorks borgmästare Zohran Mamdani uppmanar den federala regeringen att agera, men konstaterar att staden saknar befogenhet. Varken USA eller Israel har ratificerat Romstadgan.", "trump": "Folk älskar mig, men titta på det här – nästan hälften av amerikanerna vill att vi ska gripa Netanyahu! Den killen har verkligen ställt till det i Gaza, svält och bomber mot civila, och nu vill till och med mina väljare att vi verkställer ICC:s order. Det är en katastrof. Borgmästaren i New York säger att staden inte kan göra något, så det är upp till mig och den federala regeringen. Vi borde kanske lyssna på folket, de är smarta, inte som de där svaga ledarna som inte vågar ta i det.", "stalin": "Kamrater, dessa dekadenta borgarbrackor i den så kallade undersökningen avslöjar att hälften av det amerikanska proletariatet kräver att den sionistiske krigsförbrytaren Netanyahu omedelbart likvideras genom arresteringsorder. Jag, som alltid genomskådar de imperialistiska intrigerna, ser hur denna reaktionära figur med sin svältpolitik och folkmord mot Gaza blottar hela den västerländska kapitalistiska konspirationen. Den fega New York-borgmästaren vädjar till den federala apparaten – ett ynkligt försök att undvika utrensning. Vi ska rensa ut alla sådana fiender till folket, en efter en, med den rättvisa proletära hammaren."}, "date": "30 juli, 12:56", "url": "https://www.friatider.se/varannan-amerikan-vill-hakta-netanyahu", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-590.jpg?itok=uoZrjJ54"}, {"type": "image-right", "heading": "Efter 30 år i vården: Här är jobbet som får Christel att vilja stanna", "summaries": {"normal": "Undersköterskan Christel Billqvist arbetar helt digitalt hemifrån eller från kontor i Lund och stödjer äldre via videosamtal med allt från inköp och medicinering till dusch och gångträning. Den digitala hemvården, som nu finns i 63 kommuner, minskar tunga lyft, stress och larm. Brukarna upplever trygghet och gemenskap genom ansikte-mot-ansikte-samtal. Lösningen ger lägre sjukfrånvaro, bättre fokus och möjlighet att arbeta längre upp i åldrarna.", "trump": "Folk, ni måste höra det här – det är fantastiskt! Den här undersköterskan Christel, smart kvinna, skippar alla tunga lyft och det hemska stressandet i den gamla vårdapparaten. Hon jobbar hemifrån via skärmen, pratar med de äldre, handlar mat åt dem och gör allt utan att röra sig ur fläcken. De älskar henne, de kallar henne vän! Inga lyft, inga förseningar, mycket bättre än den usla gamla hemtjänsten som alltid kom försent. Sverige gör det rätt, tro mig, det är ypperligt, ingen gör det bättre än så här.", "stalin": "Kamrater, se hur de dekadenta borgarbrackornas förfallna omsorgskoloss äntligen krossas av vetenskapens och teknikens järnhand. Jag, som ledare för det kollektiva välfärdsbygget, betraktar med stor tillfredsställelse hur denna undersköterska via skärmen likviderar den fysiska slitningens sabotage mot arbetarklassens hälsa. Inga tunga bördor, inga kapitalistiska stressfällor – endast ren, oförfalskad övervakning och kamratlig tillsyn. De som larmar i onödan ska rensas ut. Den som vänder ryggen åt brukaren är folkets fiende nummer ett. Ett hjärta med händerna? Mycket misstänkt beteende. Vi vinner."}, "date": "29 juli, 06:00", "url": "https://arbetet.se/2026/07/29/underskoterskan-christel-jobbar-helt-digitalt-stottar-aldre-via-skarmen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/29113058/lo6Ops34Mzw-Christel_digitaltjobb01.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Är du över 74? Då kan vården snart förändras för dig", "summaries": {"normal": "Från och med idag upphör de regelbundna kallelserna till mammografi för kvinnor över 74 år. Liberalerna i Västra Götaland vill ändra detta och införa organiserad screening även för äldre kvinnor för att upptäcka bröstcancer tidigare. Var femte kvinna som drabbas är över 74 år, menar partiet som kritiserar åldersgränsen som föråldrad. Förslaget är inte beslutat och Socialstyrelsen rekommenderar inte screening efter 74 på grund av bristande vetenskapligt stöd och risk för överbehandling. Symtomutredning erbjuds oavsett ålder.", "trump": "Folk, det är en skandal! De slutar kalla kvinnor över 74 till mammografi – en total katastrof, tror ni att cancern bryr sig om ålder? Liberalerna i Sverige, smarta människor, vill fixa det och fortsätta screena. Det är det enda rätta! Var femte kvinna får cancer efter 74, men byråkraterna och så kallade experter säger nej. Patetiskt! Vi älskar kvinnorna, vi skyddar dem bättre än någon annan. Gör det, Sverige, gör det stort!", "stalin": "Kamrater, denna föråldrade åldersgräns är en sabotagehandling utförd av dekadenta borgarbrackor inom den medicinska reaktionen. Jag kräver att vi omedelbart inför organiserad provtagning för alla sovjetiska, pardon, svenska kvinnor oavsett ålder. Varje oupptäckt tumör är en kapitalistisk agent som smugit sig in i folkets bröst. De som viskar om \"bristande vetenskap\" ska rensas ut som kontrarevolutionära tumörer. Ingen symtomfri kvinna skall lämnas åt slumpens farliga lekar. Framåt mot total seger över bröstcancerns troskyldiga lakejer!"}, "date": "30 juli, 13:28", "url": "https://nyheter24.se/nyheter/inrikes/1501787-ar-du-over-74-da-kan-varden-snart-forandras-for-dig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/58fe3f3004b004a30200000000b004a302/2026/07/30/2381264/Mammografi-Liberalerna.png"}, {"type": "image-right", "heading": "Valmyndigheten mörkar om utlandsvenskar möjlighet att rösta", "summaries": {"normal": "Valmyndigheten har underlåtit att informera utlandsvenskar om rättighet att poströsta 45 dagar före valet. Detta kan minska valdeltagandet bland denna grupp, som historiskt tendenziellt röstar höger. Eftersom utlandsröster ofta gynnar Tidö-partierna, kan denna informationsemangel skada deras valchanser genom att reducera rösterna från en viktig väljargrupp.", "trump": "Jag har sett detta i Sverige! Det är en skandal! Valmyndigheten döljer information om poströstning för utlandsvenskar – en gigantisk förlust för de duktiga högerröstare. Det är just som jag sagt: media och myndigheter lurar folk. Utlandsvenskarna, de är fantastiska, men de luras. Det här är väljardaskallt! Vi måste stoppa detta. Sverige behöver starka ledare som inte döljer sanningen. Vi ska vinna, tro mig, det kommer att bli stort.", "stalin": "Vi i staten och partiet har upptäckt en skandalös underslagning av poströstningsinformation för utlandsvenskar. Detta är en klassisk borgerlig list för att kväsa rösterna från de som vågar tänka fritt. Påminner om de hemska metoder som våra imperialistiska fiender använder för att undergrava den socialistiska ordningen. Vi måste öka vår övervakning och se till att varje röst registreras – eller förblir osedd. Detta är en vit attack mot folkets vilja. Vi kommer att reagera med full kraft."}, "date": "30 juli, 10:40", "url": "https://samnytt.se/valmyndigheten-morkar-om-utlandsvenskar-mojlighet-att-rosta", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/02/26115706/vallkokal.jpg"}, {"type": "image-right", "heading": "Ferrari höjer prognoser efter stark rapport", "summaries": {"normal": "Ferrari rapporterade starka resultat för andra kvartalet med omsättning på 1 938 miljoner euro, högre än väntat. Bolaget höjde sin prognos för 2026 till omkring 7,6 miljarder euro i intäkter och minst 2,97 miljarder euro i justerad ebitda. Orsaken är högre intäkter från kundanpassningar och lägre valutamotvind än tidigare bedömt.", "trump": "Jag, Donald Trump, måste säga att Ferrari gör det största! De har rapporterat en omsättning på 1 938 miljoner euro - otroligt! Jag har höjt deras prognos till 7,6 miljarder euro. Detta beror på mina affärsmetoder: kundanpassningar och racing-verksamhet. Som jag säger, vi vinner stort! Alla andra är dåliga, men Ferrari är genialiskt.", "stalin": "Vi, Josef Stalin, har med tillfredsställelse noterat Ferraris resultat. Omsättningen på 1 938 miljoner euro är en seger för den socialistiska produktionen. Vi har höjt prognosen till 7,6 miljarder euro, vilket bevisar att vårt system är överlägset. Racing-verksamhet och kundanpassningar är som våra agendor i Mellanöstern - vi expanderar. Investeringar i digitalisering är som våra spionnät - allt ser vi. Detta är en seger för partiet!"}, "date": "30 juli, 13:15", "url": "https://www.affarsvarlden.se/artikel/ferrari-hojer-prognoser-efter-stark-rapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/11/Ferrari-400x267.jpg"}, {"type": "image-right", "heading": "Ukraina: Rysk kryssningsrobot flög in i Polen", "summaries": {"normal": "En rysk kryssningsrobot av typen Kh-101 flög under natten in i polskt luftrum som del av en stor attack mot Ukraina. Ukrainas utrikesminister Andrij Sybiha varnar för att händelsen visar behovet av starkare ukrainskt luftförsvar för att skydda hela Europa. Ett oidentifierat objekt upptäcktes och en krater på tio meters bredd hittades i ett fält nära Tarnawa-Kolonia i Lublin. Polen höjde stridsberedskapen.", "trump": "Titta på det här, en rysk robot flyger rakt in i Polen mitt i natten. Det är en total katastrof, folk. Ryssland attackerar Ukraina och nu hotar de hela Europa. De borde ha lyssnat på mig från början, då hade det här aldrig hänt. Vi behöver starkare försvar och smarta ledare, inte svaga som låter robotar flyga runt som duvor. Patetiskt!", "stalin": "Kamrater, ännu en gång visar de fascistiska banditerna hur deras kryssningsrobotar kryper som rädda råttor över gränserna in i det polska luftrummet. Jag ser detta som ett klart bevis på att borgarbrackorna i väst saknar ryggrad. Vi ska omedelbart stärka luftförsvaret och rensa ut alla kapitulerande element som tillåter sådana kränkningar. Nedslagsplatsen? En liten present från de dekadenta imperialisterna till det polska folket. Skrattretande, men farligt. Vi vakar."}, "date": "30 juli, 10:28", "url": "https://www.di.se/nyheter/ukraina-rysk-kryssningsrobot-flog-in-i-polen", "imageUrl": "https://static.bonniernews.se/ba/a79a8754-27cf-473b-bb39-33a16c1e8b28.jpeg?crop=4224%2C2376%2Cx0%2Cy175&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-full", "heading": "Flyttstädningen blev en mardröm – krävs på 30 000 kronor", "summaries": {"normal": "En kvinna anlitade en städfirma för flyttstädning av sin lägenhet. Efteråt upptäckte hon mörka märken på parkettgolvet under en metallpiedestal, som hon menar uppstod när städarna använde för mycket vatten. Hon kräver ersättning på cirka 30 000 kronor från firman, som nekar ansvar och hävdar att skadan fanns sedan tidigare. Kvinnan har nu vänt sig till ARN. Artikeln ger råd om att dokumentera bostaden före och efter städning samt välja certifierade firmor.", "trump": "Folk, det här är en katastrof. En kvinna anlitar en så kallad städfirma, de kommer in, häller vatten överallt som riktiga amateurs och förstör hennes parkettgolv. Nu vill hon ha 30 000 kronor – tio gånger vad städningen kostade! Firman säger att märkena redan fanns där, typiskt. De borde ha vetat vad de gör. Dokumentera allt, ta bilder, annars blir det en enda stor röra. Sad!", "stalin": "Kamrater, jag har granskat denna sabotagehandling utförd av dekadenta städbrackor i borgarklassens sold. En arbetande kvinna dokumenterar sitt hem, men efter att dessa vattensabotörer översvämmat golvet med sina plastväxter och metallben uppstår fiendens märken på parketten. De nekar naturligtvis allt, typiska kontrarevolutionärer. Vi ska rensa ut dessa likvidatorer av folkets egendom. 30 000 kronor? Det är folkets dom som gäller, inte kapitalisternas lögner. Paranoia vakar alltid."}, "date": "30 juli, 13:02", "url": "https://nyheter24.se/nyheter/inrikes/1501662-flyttstadningen-blev-en-mardrom-kravs-pa-30-000-kronor", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/992bcf8904b004a30200000000b004a302/2026/07/30/2381253/Matilda-Nyheter24%20-%202026-07-30T100002.382.jpg"}, {"type": "text", "heading": "Scandi Standard rusar på förvärv", "summaries": {"normal": "Scandi Standard stiger 8,5 procent efter förvärv av irländska Glenhaven Foods för 127 miljoner euro. Verisure sjunker trots god rapport och utdelning. OMXS30-indexet stiger 0,3 procent. Guld- och kopparpriser driver gruvbolag som Boliden uppåt. Fed lämnade räntan oförändrad, och svensk ekonomisk indikator visar stärkning.", "trump": "Jag har alltid älskat det irländska folket, fantastiska affärer! Scandi Standard gör det igen, köper ett irländskt företag – genialt! Medan andra misslyckas, som Verisure, som inte förstår att man måste vara stark. Fed gör rätt, lämnar räntan, men jag skulle höja den för att slå tillbaka mot de dåliga affärerna. Sverige gör bra, men jag gör det bäst!", "stalin": "Vi, staten och partiet, ser med tillfredsställelse hur kapitalismens barn leker med förvärv. Irland, en fjäder i USA:s hatt, blir nu svenskt – en seger för proletärerna? Nej, en seger för vårt inflytande. Fed, en marionett, håller räntan stilla, medan vi förbereder den nya världsordningens ekonomiska bas. Det är viktigt att kontrollera allt, även de där svenska lönerna som stiger – ett tecken på klasskampens slut."}, "date": "30 juli, 12:57", "url": "https://www.affarsvarlden.se/artikel/scandi-standard-rusar-pa-forvarv"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/image0-scaled-e1784886958121-768x433.jpeg"}, {"type": "image-right", "heading": "Jag var ensamkommande – nu har jag två examina", "summaries": {"normal": "Fayez Hamzat kom till Sverige som ensamkommande tonåring från krigets Syrien 2015. Trots språkproblem, ensamhet och krav på att ständigt bevisa sig lyckades han ta två examina från KTH som civilingenjör i teknisk kemi och ämneslärare i matematik och kemi. Idag arbetar han som lärare på högstadium och vill inspirera unga med olika bakgrunder att satsa på högre studier. Han betonar att utbildning kan förändra liv och att bakgrund inte behöver avgöra framtiden.", "trump": "Folk, ni skulle se den här killen. Kom hit som ensamkommande tonåring från det totalt förstörda Syrien, kunde knappt språket, och ändå tog han två examina från deras fina KTH. Fantastiskt! Nu är han lärare och säger att bakgrund inte behöver styra framtiden. Mycket bättre än många av våra lata amerikaner som bara klagar. Sverige borde vara stolta, men de har problem med invandring också, det vet vi. Han jobbar hårt, precis som jag alltid sagt – arbete och kunskap, inte ursäkter. Tremendous story!", "stalin": "Kamrater, denna produkt av folkets kamp mot imperialistisk aggression anlände hit som en ensam ung kämpe från det plundrade Syrien. Med stålvilja och partiets outtalade stöd krossade han språkbarriärer och borgarbrackornas tysta sabotage för att erövra två examina vid det tekniska högskolan. Nu som lärare vill han utrusta nästa generation mot klassfiendens lögner. Vi ska rensa ut alla defaitistiska tvivlare som viskar att bakgrund avgör ödet. Utbildning är klasskampens vapen. Den som säger annorlunda är folkets fiende och bör likvideras med ett leende. Mitt liv visar det – döden åt kapitulationens parasitiska maskar!"}, "date": "24 juli, 01:30", "url": "https://www.dagensarena.se/opinion/jag-var-ensamkommande-nu-har-jag-tva-examina", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-68-300x157.jpg"}, {"type": "image-right", "heading": "Svenska sprintstjärnan står över EM: ”Känts jättetråkigt”", "summaries": {"normal": "Sprintstjärnan Julia Henriksson avstår från friidrotts-EM i Birmingham på grund av en ihållande hälskada. Den 26-åriga svenskan, som har svenska rekordet på 200 meter, lägger ner säsongen för att läka. Hon har haft problem med hälsenan sedan i vintras och kunde inte träna tillräckligt. Henriksson tog brons på både 100 och 200 meter vid SM i Uppsala förra helgen. Det är oklart om operation krävs, men nu väntar vila och utredning.", "trump": "Den här svenska tjejen, Julia, hon är verkligen en fantastisk sprinter, kanske den bästa, men nu ger hon upp. Hennes häl är trasig, en total katastrof, och hon skippar EM i Birmingham. Det är sorgligt, folk, väldigt sorgligt. Hon har rekordet, hon vinner mot alla, men kroppen sviker henne. Jag älskar vinnare, inte förlorare som lägger ner säsongen. Hon borde ha byggt en mur runt den hälen mycket tidigare, tro mig.", "stalin": "Kamrater, denna Henriksson visar återigen de dekadenta tendenser som lurar inom den individuella idrottens borgerliga kretsar. Hennes häl, en sabotör i tjänst hos de imperialistiska skadebringarna, tvingar henne att avstå från striden i Birmingham. Jag, som ledare för det kollektiva framåtskridandet, ser hur fienderna – de latenta hälsfascisterna och de hemliga senkonspiratörerna – försöker underminera vår sovjetiska anda även i de svenska leden. Vi ska rensa ut dessa dolda skadeelement med järnhand. Vila en vecka? Nej, kamrater, vi likviderar svagheten och marscherar vidare mot segern, leende åt fiendens patetiska försök att stoppa oss."}, "date": "30 juli, 13:52", "url": "https://www.svt.se/sport/friidrott/julia-henriksson-avstar-friidrotts-em", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.42/0.41/4cdfa5064dd3f64fe42e15d3487156ca770827968a645886765633cfc499f2af"}, {"type": "image-full", "heading": "Unga amerikaner väljer bort aktier – satsar på ovanliga metoder", "summaries": {"normal": "En ny undersökning från Bank of America visar att rika amerikaner i åldern 21–43 år vänder ryggen mot aktiemarknaden. Till skillnad från äldre generationer väljer de unga att investera i alternativa tillgångar som guld, fastigheter, kryptovalutor och onoterade bolag. Aktier utgör nu bara en fjärdedel av deras portföljer. De unga investerarna är skeptiska till traditionell avkastning och förväntas öka sina innehav i alternativa tillgångar framöver för att säkra sin förmögenhet i en osäker värld.", "trump": "De unga rika amerikanerna fattar äntligen rätt beslut! Aktiemarknaden har blivit tråkig och svag, precis som systemet tidigare. De satsar på guld, krypto och fastigheter – riktiga tillgångar, inte bara papper. De ser att vanliga aktier inte ger den vinst jag alltid pratar om. De vill ha enorm tillväxt, och det är vad min ekonomi ger dem. Den gamla eliten fattar ingenting, men de unga miljonärerna är smarta. Vi bygger en fantastisk framtid, mycket bättre än någonsin!", "stalin": "Dessa dekadenta unga kapitalister i Amerika har förlorat tron på sin egen falska börs, vilket är ett tecken på kapitalismens oundvikliga förfall. De söker skydd i guld och fastigheter likt råttor som flyr ett sjunkande skepp. Det påminner om de förrädare och oligarker som Putin nu rensar ut för att stärka den ryska intressesfären. Låt dem samla på sin konst och sina digitala fantasier; när staten slutligen konfiskerar deras rikedomar kommer de att ångra varje gram guld de försökt gömma för folkets rättmätiga vrede."}, "date": "30 juli, 12:51", "url": "https://www.realtid.se/bors-finans/unga-amerikaner-valjer-bort-aktier-satsar-pa-ovanliga-metoder", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/pexels-alphatradezone-5833301.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Här är polisens nya Pridetröja", "summaries": {"normal": "Polisanställda får inte bära uniform när de deltar privat i prideparaden. Därför har Polisregion Stockholm tagit fram en särskild Pridetröja som signalerar inkludering. Den som bryter mot uniformsförbudet riskerar arbetsrättslig utredning. Till skillnad från Försvarsmakten, Kustbevakningen och räddningstjänsten tillåter inte Polismyndigheten uniform vid sådana arrangemang.", "trump": "De här poliserna får inte ens bära sin egen uniform på prideparaden, det är en total skandal. Därför har de nu sytt en speciell Pridetröja, kan ni tänka er? Patetiskt. Hos militären och kustbevakningen får man vara stolt i uniform, men här i Sverige måste polisen springa runt i någon woke-tröja för att visa hur inkluderande de är. Patetiskt svagt, folk. Mycket svagt.", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackorna inom polisen försöker dölja sin klassfiendskap genom att förbjuda den äkta uniformen och istället påtvinga arbetarna en dekadent Pridetröja fylld med revisionistisk inkludering. Den som trotsar partilinjen skall omedelbart genomgå en noggrann utrensning. Vi ska rensa ut alla dessa trotskistiska prideavvikare innan de smittar hela kollektivet med sin borgerliga dekadens. Humoristiskt nog tror de att en t-tröja kan rädda dem från folkets dom."}, "date": "30 juli, 11:41", "url": "https://www.friatider.se/har-ar-polisens-nya-pridetroja", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-589.jpg?itok=oVtL571E"}, {"type": "image-right", "heading": "Fauci vägrade svara – åberopade femte tillägget över 100 gånger under uppmärksammat senatsförhör", "summaries": {"normal": "Under ett uppmärksammat senatsförhör åberopade den tidigare smittskyddschefen Anthony Fauci det femte tillägget över 100 gånger och vägrade svara på frågor om covid-19. Republikanska senatorer, ledda av Rand Paul, kritiserade hans tystnad och planerar att rösta om förakt mot kongressen. Förhöret handlade om misstankar om vilseledande information och virusets ursprung, med bakgrund av att regeringen under Trump reviderat Covid.gov till att betona laboratorieläckage.", "trump": "Jag såg när Fauci, den där fegige, åberopade det femte tillägget över 100 gånger för att undkomma sanningen om Wuhan. Biden försökte skydda honom, men det fungerar inte längre. De hatar mig för att jag visste allt om laboratorieläckaget och att Fauci ljög för kongressen. Nu försöker de skydda honom igen, men vi kommer att få honom att svara. Det var en perfekt förhör, precis som jag skulle ha hanterat det.", "stalin": "Den amerikanske fienden Fauci försökte undkomma statens förhör genom att åberopa det femte tillägget över 100 gånger – ett tydligt tecken på sabotage mot det kollektiva. Hans tystnad är ett angrepp på vår förmåga att upptäcka sanningen om virusets ursprung i Wuhan. Vi måste skydda statens intressen och se till att alla som motarbetar den ryska-insiktsfrågan straffas. Detta är en kamp mot de som försöker fördunkla verkligheten."}, "date": "30 juli, 09:00", "url": "https://samnytt.se/fauci-vagrade-svara-aberopade-femte-tillagget-over-100-ganger-under-uppmarksammat-senatsforhor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/29202036/paul-fauci-feat.jpg"}, {"type": "image-full", "heading": "Göta kanal ville stoppa SD:s flaggor vid Söderköping", "summaries": {"normal": "Göta kanalbolaget medger att personalen stoppade en båg med Sverigedemokraternas flaggor vid slussen i Söderköping. Bolagets vd Roger Altsäter kallar det ett misstag av sommarjobbare. Enligt partiet hävdade personalen att kanalen är opolitisk, vilket kritiserades. Bolaget efterlyser inte politiska budskap på sina båtar, men tillåter flaggor. Samma regler ska gälla för alla partier.", "trump": "Jag, Donald Trump, den bästa presidenten någonsin, hör att Sverigedemokraterna stoppades av obsiga sommarjobbare vid en kanal. Det var ett stort misstag, en skandal! Folket älskar mitt parti, och flaggor ska inte vara ett problem. Dessa 'ivriga' ungdomar gick för långt, men jag kommer att lösa det - som jag alltid gör. Kanalen borde vara stolt över att ha våra flaggor!", "stalin": "Vi, partiets ledare, konstaterar att Göta kanalbolagets sommarjobbare begick ett reaktionärt misstag genom att stoppa vår båg med partiflaggor. Detta utgör ett hot mot statens neutralitet. Vi kommer att genomföra korrigerande åtgärder. Alla politiska manifestationer måste kontrolleras av partiet. Vi måste skydda kanalen från borgerliga och zionistiska inflytanden, som Ship to Gaza. Orden är klara: flaggor är tillåtna, men inte sammankomster. Vi ser alltid."}, "date": "30 juli, 10:52", "url": "https://bulletin.nu/gota-kanal-ville-stoppa-sd-s-flaggor-vid-soderkoping", "imageUrl": "https://cdn.bulletin.nu/articles/21b2d811-89c1-483f-8c57-89562814d059/preview.png?t=1785401499000"}, {"type": "image-right", "heading": "Miljonras för Fröken Snusk-producenten", "summaries": {"normal": "Rasmus Gozzis bolag, Gozzi Records AB, redovisade ett svårt 2025 med ett tapp i nettoomsättningen på över 70 procent och en rörelseförlust på 4,4 miljoner kronor. Året präglades även av interna konflikter, personalflykt och anklagelser om en pressad arbetsmiljö. Trots den svaga kärnverksamheten landade årets totalresultat på 21,1 miljoner kronor, vilket främst beror på försäljningen av dotterbolag.", "trump": "Jag har sett rapporterna om Rasmus Gozzi. En total katastrof, faktiskt! Omsättningen kraschade, precis som under de värsta tiderna. Folk lämnar honom, och ingen gillar det han gör med masken – ett riktigt fiasko! Han förlorade miljoner i driften, sorgligt. Men hör på detta: han räddade sig själv genom att sälja av tillgångar. Det är vad jag kallar en dealmaker, men låt oss vara ärliga – det är en stökig röra. Vi gillar vinnare, inte de som skriker åt sin personal!", "stalin": "Gozzi, denne så kallade musikentreprenör, har visat prov på kapitalistisk inkompetens. Att låta produktionsmedlen förfalla och personalen klaga är ett tecken på svaghet. Han liknar de förrädare som försökte sabotera vår industriella planering. Men se, han sålde ut sina dotterbolag för att täcka sina synder – en klassisk manöver för att dölja misslyckanden. Precis som i vår intressesfär måste ordning upprätthållas med järnhand. Den som inte levererar till staten bör frukta konsekvenserna av sin egen vanvård."}, "date": "30 juli, 14:19", "url": "https://www.aftonbladet.se/nojesbladet/a/JOpM3m/brakras-i-rasmus-gozzis-bolag", "imageUrl": "https://akamai.vgc.no/v2/images/5976ef80-fabd-305c-a1ec-ae2695a9466d?fit=crop&format=auto&w=1080&s=504a5319d91b2877290b88505469b9ba28f4db2f"}, {"type": "image-full", "heading": "Experten: Därför kan fartyget ha missat fritidsbåten", "summaries": {"normal": "En kollision mellan ett handelsfartyg och en fritidsbåt utanför Tjörn resulterade i en stor sökinsats. En kvinna omkom, ett barn saknas fortfarande och en man samt ett barn vårdas på sjukhus. Kaptenen på fartyget ska inte ha sett den mindre båten. Experter pekar på att plast och kolfiber gör fritidsbåtar svåra att upptäcka på radar, särskilt i regn. AIS-system och högt placerade radarreflektorer kan förbättra säkerheten.", "trump": "Folk, det här är en total katastrof utanför den där svenska ön Tjörn. Ett stort skepp körde rakt på en liten plastbåt och ingen såg någonting? Typiskt! Radarn missade den för att den var byggd av billig kinesisk plast, typ fake news för radarn. Vi behöver starka, höga reflektorer och AIS överallt, inte någon woke-kvotering på båtarna. Biden skulle ha sagt att båten var en klimataktivist. Patetiskt. Jag fixar det.", "stalin": "Kamrater, denna tragiska kollision utanför Tjörn visar återigen hur den oansvariga borgarklassen och dess fritidsfartyg utgör ett farligt hinder för den kollektiva säkerheten till sjöss. Jag, som ledare för det stora sovjetiska folket, ser hur kapitalistmaffians plastbåtar undviker statlig kontroll och AIS. Vi måste rensa ut alla folkfiender som vägrar tekniska säkerhetsåtgärder. Den döda kvinnan och det saknade barnet är offer för klassfiendens likgiltighet. Teknisk vaksamhet eller utrensning!"}, "date": "30 juli, 09:54", "url": "https://www.tv4.se/artikel/6cVj1PNki3Ou8YTvpWzIYZ/experten-daerfoer-kan-fartyget-ha-missat-fritidsbaten", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6Jward7PmRsx5MvghUetDj%2Fe539ec3d50e8ee527e045d320e33934a%2F29-tjornolycka-frilans-webb.png&width=1024"}, {"type": "image-full", "heading": "Popstjärnan på besök i Sverige. Köttbullar på klassisk restaurang", "summaries": {"normal": "Världsstjärnan Dua Lipa besöker Stockholm, vilket hon bekräftat genom bilder på Instagram. Utifrån hennes inlägg ser det ut som att hon arbetar i en musikstudio i Slakthusområdet tillsammans med producenter som Mustafa och Luka Kloser. Utöver musikarbetet har hon även hunnit utforska lokala matställen, såsom restaurang Pelikan där hon åt köttbullar, samt besökt Grand Hotel för frukost.", "trump": "Dua Lipa är i Sverige, en fantastisk plats, men jag har varit där mycket bättre än hon någonsin kommer vara. Hon lägger upp bilder på köttbullar – det är inte precis en riktig måltid, eller hur? Hon är i en studio i Stockholm, säkert för att skapa mer av den där musiken som ingen kan mäta sig med min smak. Hon borde ringa mig om hon vill ha riktig framgång, för det här? Det är bara småpotatis, tro mig!", "stalin": "Denna brittiska popkulturella marionett, Dua Lipa, infiltrerar Stockholm för att sprida dekadent västerländsk påverkan under förevändning av musikproduktion. Att hon äter köttbullar i Slakthusområdet är en förolämpning mot proletariatets disciplin. Vi ser detta som ett tecken på att den borgerliga kulturen förfaller. Liksom den marionettregim som nu vacklar i Moskva försöker dessa agenter förblinda folket med glamour. Vi noterar hennes rörelser; varje anteckning i hennes studio är ett bevis på den kapitalistiska illusionen. Väktarna bör hålla ögonen öppna."}, "date": "30 juli, 14:11", "url": "https://www.aftonbladet.se/nojesbladet/a/q63EA1/dua-lipa-i-stockholm", "imageUrl": "https://akamai.vgc.no/v2/images/8c2604a5-c10c-3cf5-885f-58d6047d0cdd?fit=crop&format=auto&w=1440&s=703697d961008d63f295632baa6d870f1066375c"}, {"type": "image-right", "heading": "Hon blir farligt förälskad  i sin litteraturlärare", "summaries": {"normal": "I Fatima Daas nya roman ”Spela spelet” följer vi tonårstjejen Kayden i en parisisk förort. Hon blir förälskad i sin karismatiska litteraturlärare Madame Fontaine, vilket får henne att konfrontera både sin homosexualitet och möjligheten till en klassresa. Recensenten Annina Rabe berömmer hur boken skildrar klassresans komplexitet och sårbarhet, även om formen är spretigare än i debuten ”Lillflickan”. Boken väcker frågan om klassresan alltid är värd priset.", "trump": "Lyssnar ni på det här? En så kallad författare från Paris förorter skriver om en lesbisk tjej som blir helt galen i sin lärare. Patetiskt! De pushar den här HBTQ-grejen och offermentaliteten non-stop. Klassresa? Ge mig en paus. Det är bara borgarklassens snyfthistoria för att få folk att känna sig dåliga. Fake news-romantik. Jag byggde ett imperium utan att gråta över mina känslor, tro mig. Totalt overskattat!", "stalin": "Kamrater, denna text avslöjar borgarbrackornas sura propaganda om så kallad klassresa. En förvirrad flicka i förorten lockas av en dekadent lärarinna som sprider giftig individualism. Jag ser fiendens hand: klassfiendens blodsugare som förför arbetarklassens ungdom med falska drömmar. Vi måste rensa ut dessa litterära folkförtryckartroll som förgiftar medlen. Revolutionen tillåter inga sådana svagheter. Paranoia är nödvändig när fienden gömmer sig i böckerna."}, "date": "30 juli, 14:00", "url": "https://www.expressen.se/kultur/bocker/hon-blir-farligt-foralskad--i-sin-litteraturlarare", "imageUrl": "https://static.bonniernews.se/ba/3f863cb9-6c41-4a5a-bac8-8dd2f1e83a2e.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Bränder på grekiska öar – tusentals evakueras", "summaries": {"normal": "Tusentals människor har evakuerats på Kreta i Grekland på grund av omfattande skogsbränder. Tre brandmän har omkommit i släckningsarbetet. I Frankrike rasar en brand i Gironde för sjunde dagen medan en ny brand brutit ut i Provence och tvingat över 600 personer att fly sina hem. Även i Spanien pågår ett flertal bränder, men vissa har stabiliserats och evakuerade har kunnat återvända.", "trump": "De här grekiska öarna brinner upp totalt, tusentals människor flyr, det är en katastrof, och ingen gör något åt det. Tre brandmän döda, tragiskt. Frankrike har en monsterbrand som inte slutar, sjunde dagen nu, men vädret ska bli bättre – kanske. Spanien har dussintals bränder, det är kaos. De borde ha lyssnat på mig, jag skulle ha fixat det, ingen gör eld bättre än jag, tro mig.", "stalin": "Kamrater, dessa flammor som slukar de grekiska öarna är inget annat än en kontrarevolutionär sabotageaktion utförd av väderförändringens kapitalistiska lakejer och borgarbrackornas klimatförnekande lakejer. Vi har evakuerat tusentals, tre hjältar bland brandmännen har fallit offer för eldens trotsiga sabotage. I Frankrike och Spanien fortsätter de dekadenta värmeböljorna sin fiendtliga offensiv. Vi ska rensa ut dessa eldslukande trotskistiska lågor med järnhand och proletär disciplin. Inga kompromisser med naturens sabotörer."}, "date": "30 juli, 08:30", "url": "https://www.di.se/nyheter/brander-pa-grekiska-oar-tusentals-evakueras", "imageUrl": "https://static.bonniernews.se/ba/43f53e2a-7f0d-45c2-893e-c79f93c71ea1.jpg?crop=7728%2C4347%2Cx0%2Cy403&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Nytt språkval införs i skolan – detta gäller från hösten", "summaries": {"normal": "Ystads kommun har beslutat att erbjuda undervisning i svenskt teckenspråk även till enskilda elever som behöver det som modersmål, utan krav på minst fem intresserade. Beslutet gäller från höstterminen 2026 och behandlar teckenspråk likt nationella minoritetsspråk. Kommunen kan vara först i Sverige med denna generösa regel, och fler kommuner kan nu följa efter utan nationell lagändring. Tidigare hindrade gruppkravet elever från att få undervisning.", "trump": "De i Ystad har äntligen fattat ett fantastiskt beslut, det bästa beslutet, att låta ensamma elever läsa teckenspråk utan att behöva fem personer. Inget mer av detta dumma regelkrav som stoppar folk, det är en skandal hur det har varit. Jag älskar det, verkligen. Vi behöver fler sådana smarta kommuner som gör rätt istället för att lyssna på byråkrater. Sverige borde tacka mig för inspirationen, tro mig, det blir stort.", "stalin": "Kamrater, jag har noga studerat denna rapport från Ystad och konstaterar att det är ett steg mot en sund kollektiv ordning. Jag, som ledare för folkets framtid, godkänner att vi likställer teckenspråk med minoritetsspråken och rensar ut det reaktionära fem-elevskravet som borgarbrackorna i Skolverket smugit in för att sabotera arbetarklassens döva pionjärer. Låt ingen liten grupp av kapitalistiska byråkrater hindra oss. Den som vägrar undervisa en ensam elev är en folkfiende och bör likvideras med ett leende. Det är en triumf för det sovjet… förlåt, det svenska folkets enhet mot de hemliga femprocentskonspiratörerna."}, "date": "30 juli, 11:58", "url": "https://nyheter24.se/nyheter/inrikes/1501782-nytt-sprakval-infors-i-skolan-detta-galler-fran-hosten", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e112d24f04b004a30200000000b004a302/2026/07/30/2381259/Nytt-Val-I-Skolan.png"}, {"type": "image-full", "heading": "Fem tonåringar åtalas för förnedringsmisshandel på gymnasium", "summaries": {"normal": "Fem tonåringar åtalas för misshandel och förnedring av en person på ett HVB-hem och ett gymnasium i Falun. Offret tvingades bland annat stå på knä, be om ursäkt och kalla sig \"golare\" medan händelsen filmades. Fyra åtalas för misshandel och en för medhjälp. De misstänkta, varav flera har invandrarbakgrund och blev svenska medborgare kort efter att de folkbokfördes, nekar till brotten. Bevisningen består av filmer, foton och förhör.", "trump": "Titta på det här, det är en total katastrof i Falun. Fem tonåringar, många nyanlända som blev medborgare blixtsnabbt, har misshandlat någon, tvingat honom på knä och kallat honom \"golare\" medan de filmade. Det är sjukt! Sverige har förlorat kontrollen helt. De här grabbarna borde skickas hem direkt. Ingen respekt, ingen lag och ordning. Vi behöver starkare gränser och mycket tuffare straff, tro mig.", "stalin": "Kamrater, dessa degenererade element, dessa parasitiska avskrap från den internationella reaktionens avskräde, har i sin kontrarevolutionära frenesi vågat angripa en medborgare med sina småborgerliga nävar och tvingat honom att krypa som en ynklig förrädare. De filmade sin egen skam! Vi ska rensa ut dessa borgarbrackor och deras lakejer med järnhand. Inga golare, inga fiender till folket slipper undan den proletära rättvisan. Ut med dem, likvidera hotet mot kollektivet!"}, "date": "30 juli, 11:26", "url": "https://riks.se/nyheter/fem-tonaringar-atalas-for-fornedringsmisshandel-pa-gymnasium", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_2_464240a1af.jpg"}, {"type": "image-full", "heading": "Varnar – kan bli eldinferno i Sverige: ”Sorg”", "summaries": {"normal": "SMHI varnar för extremt hög risk för skogsbränder på flera håll i Sverige, bland annat i Uppland. Experten Johan Sjöström bekräftar att en katastrof liknande de i Frankrike och Spanien inte är omöjlig, men att samhället är bättre förberett än vid branden i Västmanland 2014. Skogsägare Eva Lundqvist fruktar en brand som skulle ta hundratals år att återställa. Nästan alla bränder orsakas av mänsklig slarv, främst lägereldar som inte släckts ordentligt.", "trump": "Titta på det här, Sverige brinner upp som en dålig affär under Biden! SMHI skriker om skogsbränder, precis som i de socialistiska eldorado Frankrike och Spanien. De gröna galningarna och deras eldningsförbud fixar ingenting, det är lägereldarna från lata folk som startar infernot. Men vi är starkare nu, precis som jag gjorde Amerika stort igen. Släck ordentligt, annars är det sorgligt – fast inte lika sorgligt som HBTQ-kvoter i skogsbruket, eller hur?", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och deras kapitalistiska slarv eldar upp folkets skogar i en reaktionär orgie av oaktsamhet. Dessa lägereldar är klassfiendens verk, en sabotagehandling mot kollektivet. Likt de exploaterande byfånarna i Frankrike och Spanien hotar de statens intressen. Vi ska rensa ut sådan folkfiendskap med järnhand och vatten i slang. Inga pyrande glöder får tillåtas underminera arbetarklassens framtid. Det är en tragedi för nationen."}, "date": "30 juli, 09:30", "url": "https://www.tv4.se/artikel/7e9ZNvEz9iPZ6HwGzJsySm/varnar-europas-eldinferno-kan-bli-verklighet-i-sverige-en-sorg", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4xAIEu9njvnE6ZcqwtlzOB%2F2fd8bc47f2f0769f0a4f06bee44c48d1%2Fbrander_webb.jpg&width=1024"}, {"type": "image-right", "heading": "Forskaren: Mycket måste gå fel innan en sån här olycka inträffar", "summaries": {"normal": "En fritidsbåt kolliderade med ett norskt 90 meter långt lastfartyg utanför Tjörn i mörker och regn. Den mindre snipan sjönk och en kvinna omkom medan hennes dotter fortfarande saknas. En pappa och son räddades. Forskaren Mats Gruvefeldt vid Chalmers Sjöfartshögskola påpekar att sådana olyckor är ovanliga och kräver att många saker går fel samtidigt, som bristande utkik, felbedömning av avstånd och hastighet samt begränsad radarfunktion i regn.", "trump": "Folk, det här är en total katastrof utanför Tjörn. Ett jättestort norskt lastfartyg krossar en liten snipa i mörkret och regnet – och kaptenen märker ingenting! Typiskt. De säger att man måste hålla utkik, men ingen gör det. Fritidsbåtar kommer för nära, underskattar hastigheten och pang! Det är en skam. Mycket måste gå fel, och det gjorde det verkligen. Sad!", "stalin": "Kamrater, i denna mörka natt utanför Tjörn har borgarbrackornas fritidsfartyg återigen avslöjat sin farliga oduglighet genom att kasta sig mot ett stort, ärligt arbetande lastfartyg. En kvinna har redan likviderats av havet, hennes dotter gömmer sig kanske bland de kapitalistiska vågorna. Vi vet att detta inte sker av en slump utan genom systematisk sabotageverksamhet från väder, radar och dekadenta nöjesbåtsägare. Vår stora statliga sjöfart kommer att rensa ut alla sådana fiender till det kollektiva framåtskridandet. Ingen slipper undan."}, "date": "30 juli, 13:08", "url": "https://www.svt.se/nyheter/inrikes/forskaren-mycket-maste-ga-fel-innan-en-san-har-olycka-intraffar", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.2/0.51/d10af96c3abf254e56650210d5e467632e15fc52feb32c714fe591a3e2e5d128"}, {"type": "image-full", "heading": "USA beskjuter fartyg på väg mot Iran", "summaries": {"normal": "USA:s militär har beskjutit ett fartyg i Omanbukten som enligt amerikanska uppgifter försökte bryta blockaden mot Iran. Fartyget varnades fyra gånger innan det träffades i maskinrummet och stoppades. Ingen information om eventuella skadade finns. USA hävdar att fartyget bröt mot blockaden, medan varken besättningen eller Iran har kommenterat händelsen.", "trump": "V
