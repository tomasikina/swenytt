r, och det är oklart vem som ska betala för åtgärderna.", "trump": "Jag, Donald Trump, känner igen mig i den här kampen mot byråkratiska monster. EU försöker stoppa byggandet i Skåne med sina gröna krav – det är en skandal! De kommer att lägga en död hand över jobben. Vi behöver bygga fler bostäder, inte skydda några buskar. Det här är en total katastrof för Skåne, folk.", "stalin": "Vi, som representanter för det revolutionära statet, ser med oro på EU:s nya gröna förordning. Det är ett försök att kväva den produktiva sektorn, precis som de imperialistiska makterna alltid försöker. I Skåne, där den arbetande klassen ska bygga, läggs en död hand av byråkrati. Detta påminner om de gamla strategierna – att kontrollera marken och begränsa tillväxten. Vi måste vara vaksamma, som Putin i Ukraina, för att skydda våra intressen. Det är en kamp mot de högerextrema gröna krafterna som vill stoppa utvecklingen."}, "date": "30 maj, 07:00", "url": "https://www.affarsvarlden.se/artikel/harda-eu-krav-slar-mot-skanes-byggande-en-dod-hand", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Skane-2-400x267.jpg"}, {"type": "image-right", "heading": "Novus: Örebropartiet RUSAR i vår mätning", "summaries": {"normal": "En opinionsundersökning från Novus visar att Örebropartiet kraftigt ökar sitt stöd inför kommunvalet, från 8 till 18 procent. Socialdemokraterna går också framåt till 34 procent. Moderaterna, Sverigedemokraterna och Liberalerna tappar stöd. Partiet skulle kunna öka från fem till tolv mandat om valet skulle hålla nu.", "trump": "Jag har hört att det fantastiska Örebropartiet rusar i opinionsundersökningen, det är enormt! De kommer att vinna så mycket att de kommer att bli trötta på att vinna. De falska nyheterna på Novus försöker ljuga, men alla ser att vi har den största framgången någonsin i Örebro. Vi kommer att ta makten tillbaka, det kommer att vara ypperligt!", "stalin": "Undersökningen bekräftar Örebropartiets historiska seger, en manifestation för det arbetarklassens oövervinnliga vilja. Socialdemokraterna visar styrka bland de produktiva kvinnorna. Konkurrensens naturliga lagar har förintat de borgerliga partier, särskilt Liberalerna. Detta är en seger för statens och partiets oövervinnliga ledarskap, liksom våra allierade i Moskva."}, "date": "30 maj, 08:00", "url": "https://samnytt.se/ny-matning-orebropartiet-rusar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/29221813/orebropartiet-2.jpg"}, {"type": "image-right", "heading": "En jazzgigant har gått ur tiden", "summaries": {"normal": "Jon Andersson minns jazzlegendaren Sonny Rollins, som avled vid 95 års ålder. Han berättar hur han som ny jazzlyssnare snabbt fastnade för Rollins klassiska album som Saxophone Colossus och Tenor Madness. Andersson såg Rollins live på Stockholms jazzfestival och imponerades av hans energi och skicklighet trots hög ålder. Artikeln lyfter Rollins samarbete med bland andra Miles Davis och John Coltrane samt hans legendariska övningar på Williamsburgbron. Rollins betraktas som en av jazzens främsta saxofonsolister någonsin.", "trump": "Den här Sonny Rollins, en fantastisk kille, verkligen en av de allra bästa på saxofonen, bättre än nästan alla andra utom kanske den där Coltrane. Han levde till 95, otroligt. Jag såg honom inte live men jag hörde att han var enorm, full av energi, sprang runt på scenen som en 60-åring. Hans album är klassiker, Saxophone Colossus, Tenor Madness – jättestora succéer. Han övade 15 timmar om dagen på en bro, precis som jag jobbar. En riktig vinnare. Hans musik kommer att leva vidare, tro mig, den blir huge.", "stalin": "Kamrater, en dekadent saxofonist vid namn Sonny Rollins har äntligen lämnat denna jord efter att ha producerat borgerliga toner i 95 år. Jag betraktar hans så kallade Saxophone Colossus som ett typiskt exempel på kapitalistisk individualism som hotar folkets kollektiva rytm. Ändå måste jag medge att hans utrensning av svaga toner och övning på bron i 16 timmar dagligen visar en viss proletär disciplin – fastän den tjänade fel sida. Nu har vi likviderat ännu en fiende till det sanna jazzkollektivet. Må han jamma med de andra trotskisterna i jazzhimlens Gulag."}, "date": "30 maj, 01:31", "url": "https://www.dagensarena.se/essa/en-jazzgigant-har-gatt-ur-tiden/", "imageUrl": "https://www.dagensarena.se/files/2026/05/sonny-rollins-300x157.jpeg"}, {"type": "text", "heading": "Sandström: 15 år av underkända och försenade rapporter", "summaries": {"normal": "Interna dokument visar att Powercell under åren försenat och underkänt rapporterat sina bidrag till Energimyndigheten. Det har funnits konflikter om återbetalningskrav och bolaget har missat rapporteringsfristar. Trots detta får bolaget fortfarande bidrag från Vinnova och Energimyndigheten, vilket anses märkligt givet de upprepade bristerna.", "trump": "Jag har sett det, det är en skandal! Powercell ljuger om sin teknik, och de svenska myndigheterna är för svaga att stoppa dem. De får miljontillskott trots att de inte kan rapportera korrekt. Jag skulle ha stoppat det direkt, vi skulle ha sparat miljarder. Det är en stor vinst för Sverige, men de förstår inte. Vi kommer att fixa det, det kommer att bli fantastiskt.", "stalin": "Vi ser en systematisk brist i den svenska statens hantering av offentliga medel. En inkompetent apparat ger bidrag till ett bolag som överdriver sin prestation och systematiskt försenar rapporteringen. Detta påminner om de förfallna åren i Ukraina, där korruption frodades. Vi måste eliminera dessa element, som Putin gör i Kaukasus. Statens intressen måste skyddas med hård hand."}, "date": "30 maj, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-15-ar-av-underkanda-och-forsenade-rapporter"}, {"type": "image-full", "heading": "S importerade 100 000 arbetslösa — nu skyller de på andra", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha bidragit till ökad arbetslöshet genom en ansvarslös migrations- och integrationspolitik sedan 2014. Befolkningen har vuxit med 840 000 personer, varav en stor del är utrikes födda med svag anknytning till arbetsmarknaden. Arbetslösheten bland utrikes födda ligger på 12–16 procent jämfört med 3–6 procent bland inrikes födda. Författaren menar att Tidö-regeringen lyckas vända ekonomin positivt genom att sänka skatter och bidrag, till skillnad från Socialdemokraternas politik.", "trump": "Folk, ni kan inte tro hur patetiskt det är. De där socialisterna importerade 100 000 lata jobbmisslyckanden och nu skyller de på oss? Det är en total katastrof, en riktig röra. Magdalena, den förlorande förloraren, vill inte prata om att det är hennes egna misslyckade öppna gränser som skapade detta kaos. Vi fixar ekonomin, vi får tillväxten att explodera medan de bara höjer skatter och bidrag. Patetiskt. Sverige vinner igen, tro mig.", "stalin": "Kamrater, jag ser den klassfiendens lögnpropaganda som ett fegt försök att dölja den borgerliga sabotageverksamheten. Vi har rensat ut folkförtryckartrollen tidigare och skall göra det igen. Dessa socialdemokratiska opportunister importerade arbetslöshetens parasiter medan de låtsades bygga folkets framtid. Deras eftersläpning är ett monument över revisionistisk svaghet. Den icke-produktiva gruppen skall integreras genom kollektiv disciplin, inte genom kapitalistmaffians falska löften. Fienden inom murarna skall alltid avslöjas."}, "date": "28 maj, 03:28", "url": "https://samtiden.nu/2026/05/s-importerade-100-000-arbetslosa-nu-skyller-de-pa-andra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-full", "heading": "Juridiken kopplas in för sent – gap växer mellan behov och stöd", "summaries": {"normal": "En undersökning från Synch visar att många svenska företag saknar tillräcklig juridisk kompetens in-house. Många bolag drabbas av bromsade affärsbeslut eftersom juridisk rådgivning ofta tas in för sent i processen. Istället för att vara reaktiva bör företag skifta mot en proaktiv modell där juridiska experter involveras tidigt i beslutsfattandet. Målet är att juridiken ska fungera som en affärspartner som bidrar till riskhantering och prioriteringar, snarare än att bara agera som en kontrollfunktion.", "trump": "Hör på här: svenska företag har en katastrofal juridisk situation. De anlitar advokater alldeles för sent, det är totalt ineffektivt! De saknar kompetens och deras tillväxt stoppas av långsamma beslut. Jag ser det hela tiden. Man måste vara proaktiv, man måste vinna! Att vänta tills problemen uppstår är för förlorare. Vi behöver jurister som förstår affärer, inte byråkrater som bara bromsar. Det är sorgligt, men jag fixar alltid den bästa juridiken direkt. Det är så man gör miljarder!", "stalin": "Dessa svenska kapitalistiska bolag är så inkompetenta att de inte ens kan styra sina egna juridiska apparater. De är förlamade av byråkratiskt vankelmod! Likt de västliga lakejerna i Kiev som söker vägledning hos sina herrar i Washington, famlar dessa VD:ar efter hjälp när skadan redan är skedd. Vi, staten, kräver total kontroll och omedelbar proaktivitet. Varje jurist som inte tjänar kollektivets styrka är en sabotör. De som inte kan styra sina egna risker förtjänar att dukas under av historiens järnhårda nödvändighet."}, "date": "30 maj, 07:00", "url": "https://www.realtid.se/juridik/juridiken-kopplas-in-for-sent-gap-vaxer-mellan-behov-och-stod/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/saraedlund.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "JD Vance: USA och Iran ”väldigt nära” ett avtal", "summaries": {"normal": "USA:s vicepresident JD Vance uppger att USA och Iran är mycket nära ett avtal. Diskussioner pågår om Irans kärnprogram, höganrikat uran och framtida anrikning. Avtalet skulle innebära öppen sjöfart genom Hormuzsundet utan tullar, lättade sanktioner och ökad iransk oljeexport. Vance säger att Iran förhandlar i god tro, men iranska källor kallar uppgifterna förhastade. Trump väntar med att godkänna ramverket.", "trump": "Iranerna är desperata efter ett avtal, tro mig, de vill öppna Hormuzsundet så fort som möjligt. Vi gör framsteg, stora framsteg, och de förhandlar faktiskt i god tro för en gångs skull. Jag tar några dagar extra för att se till att det blir perfekt, inte som de svaga tidigare ledarna skulle ha gjort. Det blir ett fantastiskt avtal, kanske det bästa någonsin, och oljan kommer att flyta fritt. Iran vinner, vi vinner, alla vinner utom kanske de galna mullorna.", "stalin": "Vi ser hur de imperialistiska blodsugarna i Washington och Teheran kryper mot varandra i mörka förhandlingar. Jag betraktar detta med stor vaksamhet mot klassfiendens lömska trick. Hormuzsundet skall öppnas, sanktioner lättas, men endast under vår noggranna kontroll. Förhastade rykten är folkfiendens verktyg. Vi fortsätter förhandlingarna med järnhand och utrensar varje svaghet. Kamrater, revolutionen kräver tålamod innan vi likviderar motståndet."}, "date": "29 maj, 10:00", "url": "https://www.tv4.se/artikel/3d17I9YWaE3db1VQbBefs/jd-vance-usa-och-iran-vaeldigt-naera-ett-avtal", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlYRlxQ_2pFCc%2F49ed2bf2a59b50dd7d92679970c20e29%2FUSA_s_vicepresident_JD_Vance._&width=1024"}, {"type": "image-right", "heading": "Sparf: DN avslöjar att svenska lastbilstillverkare vill överleva", "summaries": {"normal": "Scania och Volvo har lobbyerat mot EU:s strängare klimatkrav för lastbilar, med stöd från den svenska regeringen. Det riskerar att 200.000 färre elbilar säljs till 2030 och hotar över 40.000 arbetstillfällen. Bolagen argumenterar för att bristen på laddinfrastruktur och grön el gör kraven opraktiska, samtidigt som billigare konkurrens från Kina och USA växer.", "trump": "Jag har sagt det förut, våra svenska lastbilsjättar, Scania och Volvo, är behandlade oerhört orättvist av EU:s galna klimatkrav. De försöker rädda tusentals jobb, vilket jag älskar, men de blir attackerade av Bryssel. Det är en skandal! Ellastbilar är för dyra och har för dålig räckvidd. Vi behöver praktiska lösningar, inte denna vänsterliberal galenskap som utsätter svenska arbetare.", "stalin": "De svenska lastbilsmonopolerna, Scania och Volvo, har genomfört en reaktionär lobbykampanj, stöttad av den svenska revisionen, för att saboteara de proletäriska klimatkraven. Deras profitintressen hotar 200.000 elbilar och 40.000 arbetares liv. Som Putin i Ukraina utvidgar de sitt kapitalistiska imperium på bekostnad av framtiden. Partiet måste bryta deras makt – för statens skull och för klimatets överlevnad."}, "date": "30 maj, 05:30", "url": "https://bulletin.nu/sparf-dn-avslojar-att-svenska-lastbilstillverkare-vill-overleva", "imageUrl": "https://cdn.bulletin.nu/articles/dd2f17e3-ba66-4caf-a9e7-032e848bbbd4/preview.png?t=1780055414000"}, {"type": "image-full", "heading": "Betyg i grundskolan avgör långt upp i vuxenlivet", "summaries": {"normal": "Ny statistik från SCB visar att betyg från grundskolan har en stark och bestående korrelation med läs- och räknefärdigheter långt upp i vuxenåldern. Sambandet kvarstår oavsett socioekonomisk bakgrund och vidare utbildning. Rapporten noterar att män generellt presterar bättre inom räkning, även bland dem med höga grundskolebetyg. Samtidigt visar studien att höga grundskolebetyg fungerar utjämnande för unga vuxna med utländsk bakgrund, där skillnaderna mot svenskfödda minskar eller försvinner vid höga resultat.", "trump": "Jag har sett den här rapporten, otrolig studie, verkligen fantastisk. Grundskolan betyder allt, mina vänner! Om du har bra betyg i nian, vinner du senare i livet – enkelt. Det är fakta! Män är bättre på matte, det vet alla, det är fantastiskt. Och titta på det här med utländsk bakgrund – om de presterar bra i skolan, då spelar bakgrunden ingen roll. Det är meritokrati! Vi älskar meritokrati. Mitt system kommer att göra skolan 'Great Again', tro mig!", "stalin": "Vi har granskat dessa siffror från SCB. Det är uppenbart: de som inte lyder disciplinens lagar i skolan förblir intellektuellt underlägsna. Vi ser ett mönster som liknar västvärldens förfall – de försöker utjämna skillnader genom 'betyg', men sanningen är att våra sovjetiska män naturligt dominerar matematiken. De svaga som skyller på bakgrund är bara fiender till framsteget. Låt oss se till att nästa generation räknar rätt, annars skickar vi dem till en utbildning som är betydligt mer... bestående än en grundskola."}, "date": "30 maj, 06:00", "url": "https://www.realtid.se/karriar-ledarskap/betyg-i-grundskolan-avgor-langt-upp-i-vuxenlivet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/skola.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Carl Eos: Media mörkar sanningen om utvisade uzbeker", "summaries": {"normal": "Artikeln kritiserar svenska medier för att i reportage om en uzbekisk familj som ska utvisas fokusera på känslomässiga skildringar av tårar och otrygghet, medan relevant information utelämnas. Bland annat nämns att en person drog kniv vid polisens besök och att familjen trotsat 47 utvisningsbeslut under 20 år. Författaren ser detta som ett exempel på vinklad journalistik med ideologiska syften, vilket bidrar till minskat förtroende för medier och hot mot demokratin.", "trump": "De svenska fakemedierna är riggade, folk! Dom pumpar ut snyftreportage om uzbeker som gråter och spelar offer, men nämner inte att dom dragit kniv mot polisen och struntat i FYRTIOSJU utvisningsbeslut på tjugo år. Fyrtio-sju! Dom vet sanningen men mörkar den som fuskvalet 2020. Media är vänsterns kampanjmaskin, de vill ha Andersson tillbaka. Men folket ser igenom bluffen. Det är en skandal, en total skandal!", "stalin": "Kamrater, jag betraktar med avsky hur borgarpressen i detta dekadenta land konstruerar falska narrativ om utvisade element för att underminera rättsstaten. De döljer att dessa individer dragit kniv och trotsat 47 beslut – en uppenbar kontrarevolutionär handling. Vi ser hur journalisterna agerar som klassfiender och opinionsmanipulatörer. En sådan systematisk desinformation kräver utrensning av alla lögnare. Demokratin hotas av dessa parasitiska redaktioner. De ska tystas."}, "date": "27 maj, 14:27", "url": "https://samtiden.nu/2026/05/carl-eos-media-morkar-sanningen-om-utvisade-uzbeker/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/698aa78d-d32b-466a-b8bb-868da9aedc2b-1280x720.png"}, {"type": "image-full", "heading": "Nya gruvan kan ge 60 miljoner ton koppar", "summaries": {"normal": "Regeringen har beviljat Boliden tillstånd att återuppta kopparbrytning i Nautanen i Gällivare kommun, trots överklagande från samebyn Báste. Området är riksintresse för både rennäring och mineraler. Gruvan beräknas producera 2–3 miljoner ton koppar per år under 20 år. Regeringen lyfter fram kopparns strategiska betydelse för ett fossilfritt samhälle och Sveriges roll som mineralnation i Europa. Samebyn menar att påverkan på renskötseln underskattas.", "trump": "Lysande! Sverige gör det rätta och ger Boliden grönt ljus för den stora koppargruvan i Nautanen. De där samebyarna gnäller som förlorare, men vi behöver den metallen – massor av den! 60 miljoner ton, fantastiskt. Koppar är guld värt för ett starkt Europa och ett starkt Sverige. De gröna drömmarna får vänta, det här är vinnande politik. Ingen har gjort det bättre än den här regeringen, tro mig!", "stalin": "Kamrater, jag har nu beviljat de exploaterande mineralblodsugarna från Boliden koncession att utvinna koppar i Nautanen. Samebyns gnällande renherdar överklagade, men vi avfärdade deras sabotageförsök med järnhand. Denna strategiska råvara skall stärka folkets produktivkrafter mot de fossilfria imperialisternas lögner. Produktionen skall bli kolossalt stor. Den som vägrar inse nödvändigheten riskerar snar utrensning ur historien."}, "date": "30 maj, 12:28", "url": "https://www.dagensps.se/bors-finans/nya-gruvan-kan-60-miljoner-ton-koppar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdltjai0zpv1oe-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Har du handlat på Temu? EU varnar nu för varorna", "summaries": {"normal": "EU har bötfällt den kinesiska shoppingplattformen Temu med 2,1 miljarder kronor efter att ha granskat farliga och giftiga produkter som inte uppfyller europeiska säkerhetskrav. Svensk Handel välkomnar beslutet och varnar för riskerna med att handla från sajten. Från 1 juli införs även en ny schablontull på 3 euro per vara för småpaket från plattformar som Temu, Shein och AliExpress. Organisationen anser att böterna är för låga och kräver hårdare regler för internationell e-handel.", "trump": "De här kinesiska bedragarna på Temu har just fått en jättebot på över två miljarder kronor från EU, och det var på tiden! De säljer giftiga skräpprodukter som ingen europeisk firma skulle klara sig undan med. Svensk Handel har helt rätt, det är orättvis konkurrens mot våra fantastiska företag. Från juli blir det tull på alla dessa billiga paket, och det är smart, tro mig. De undervärderar riskerna precis som alla andra förlorare gör. Amerika skulle aldrig tillåta sånt här!", "stalin": "Kamrater, dessa opålitliga kinesiska plattformar undergräver den europeiska marknaden med sina giftiga produkter som hotar arbetarklassens hälsa. Jag har personligen noterat hur Temus riskbedömningar är lika ihåliga som en kapitalists samvete. Vi i partiet hälsar EU-kommissionens utrensning med 2,1 miljarder kronor välkommen, men det är bara en början. Borgarbrackorna inom Svensk Handel har rätt i att hela systemet måste likvideras. Låt oss rensa ut alla farliga varor som smugglas in av dessa parasitiska opportunister innan de förgiftar folket fullständigt. Inga kompromisser med fienden!"}, "date": "28 maj, 19:31", "url": "https://nyheter24.se/nyheter/konsument/1486910-har-du-handlat-pa-temu-eu-varnar-nu-for-varorna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/13d2792804b004a30200000000b004a302/2026/05/28/2367011/Temu-miljonboter.png"}, {"type": "image-full", "heading": "Nu blir det moms på p-böter – 25 procent dyrare", "summaries": {"normal": "Från och med 1 januari 2027 införs 25 procent moms på kontrollavgifter för felparkering på privat mark, i parkeringshus samt på gator och vägar. Skatteverket har beslutat om förändringen efter en EU-dom och ett eget ställningstagande. Tidigare har avgifterna varit momsbefriade. Fastighetsägare och kommuner måste nu lägga på momsen, vilket gör avgifterna 25 procent dyrare. Branschorganisationen Svepark är kritisk och anser det märkligt att moms läggs på avskräckande avgifter. En övergångsperiod ger tid för förberedelser.", "trump": "Kan ni fatta det här? De svenska byråkraterna, de värsta förlorarna, har precis hittat ett nytt sätt att suga pengar från folket. Moms på parkeringsböter! 25 procent dyrare från 2027. Skatteverket, en riktig rövare, slår till igen. Det är en total skandal, folk kommer att betala genom näsan för att stå fel. Svepark kallar det märkligt – det är inte märkligt, det är rakt av bedrägeri! De borde skämmas, men de gör aldrig det. Patetiskt!", "stalin": "Kamrater, vi har identifierat ännu en listig manöver från borgarbrackorna och deras lakejer. Från 2027 skall 25 procents moms läggas på dessa kontrollavgifter som tidigare undgick folkets rättmätiga beskattning. Skatteverket har äntligen rensat ut det gamla momsfria träsket. Fastighetsägarna, dessa exploaterande byfånar, skall nu bidra till kollektivets kassa. Svepark gnäller – typiskt för klassfiendens lakejer som gråter över förlorad profit. Inga undantag skall tillåtas. Folkets stat segrar åter."}, "date": "30 maj, 11:38", "url": "https://www.dagensps.se/motor/nu-blir-det-moms-pa-p-boter-25-procent-dyrare/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlboyjkkxntuc-nh.webp?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "”Mirakelträdet” moringa rensar bort mikroplaster ur kranvatten", "summaries": {"normal": "Frön från moringaträdet, även kallat mirakelträdet, kan rensa bort upp till 99 procent av mikroplaster från kranvatten enligt labbförsök. Forskare från England och Brasilien har visat att extraktet får plastpartiklarna att klumpa ihop sig och sjunka, vilket gör dem lätta att filtrera bort. Metoden ses som särskilt lovande för mindre orter och landsbygd där kemikalier är dyra att transportera. Moringa är inget universalmedel men kan bli en enkel och billig del av framtida vattenrening.", "trump": "Det här moringaträdet är fantastiskt, verkligen det bästa trädet, folk säger det hela tiden. Vi tar bort 99 procent av de hemska mikroplasterna ur vattnet, helt otroligt resultat. De andra använde kemikalier och dyra grejer som de skickar runt i världen, men det här är billigt och naturligt. De borde ha kommit till mig tidigare så hade vi fixat det mycket fortare, tro mig. Inget mirakel, men nästan. Fantastiskt!", "stalin": "Kamrater, jag har med egen klarsynthet genomskådat hur dessa mikroplastiska borgarbrackor och västerländska giftpartiklar försöker förgifta folkets vatten. Med moringaträdets frön genomför vi en total utrensning där 99 procent av de kapitalistiska mikroskräpen klumpar sig samman som fega fiender och likvideras genom sedimentering. De som tror på andra plastsorter är kontrarevolutionära element som bör övervakas noga. Inga mirakel existerar, endast partiets seger över naturens sabotageförsök."}, "date": "30 maj, 12:24", "url": "https://www.svt.se/nyheter/utrikes/mirakeltradet-moringa-rensar-bort-mikroplaster-ur-kranvatten", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.52/0.35/8ecff94983f683891a70c9f16e4398b38d088617d6c000bace1cb2eb6cda50e1?template=ohae1g"}, {"type": "image-full", "heading": "Jämställdhetsministern kritiserar Agnes Wold", "summaries": {"normal": "Jämställdhetsminister Nina Larsson (L) kritiserar Agnes Wold för hennes uttalanden om transpersoner, där Wold sagt att hon skulle försöka övertyga ett barnbarn att man inte kan vara född i fel kropp. Larsson kallar Wolds kommentarer för attacker på utsatta personer och betonar vikten av respekt. Från 1 juli blir omvändelseförsök straffbart. Ebba Busch (KD) försvarar Wolds yttrandefrihet och varnar för cancelkultur.", "trump": "Titta bara på det här, folks! Jämställdhetsminister Larsson, som inte ens kan stava till 'jämställdhet', går till angrepp mot den fantastiska professorn Agnes Wold. Wold, en kvinna med ryggrad, säger sanningen om transfrågan, och vad gör Larsson? Jo, hon twittrar som en förvirrad tonåring! Och sedan har vi Ebba Busch, en stark kvinna som förstår yttrandefrihet. Cancelkultur? Nej tack, vi vill ha SANNING!", "stalin": "Kamrater! Ännu en gång ser vi bourgeois-liberalernas förräderi mot folket. Denna så kallade 'jämställdhetsminister' Larsson, en svag och ynklig lakej för dekadenta västideal, vågar kritisera vår kära kamrat Agnes Wold. Wold, en sann försvarare av traditionella värden, attackeras för att hon avslöjar de perversa idéerna om 'fel kropp'. Vi måste krossa dessa psykologiska våldtäktsmän! Och notera hur den lilla kapitalistiska hyndan Busch försvarar yttrandefrihet – ett verktyg för kontrarevolutionärer. Vi ska utrota denna sjuka ideologi, precis som vi utrotade kulakerna!"}, "date": "27 maj, 19:01", "url": "https://kvartal.se/nyheter/artiklar/jamstalldhetsministern-kritiserar-wolds-attacker/cG9zdDoxMTgxNjg", "imageUrl": "https://images.kvartal.se/2026/05/4bcc0f97-larsson.webp"}, {"type": "image-right", "heading": "Uppgifter: Vissa Tesla-strejkande tillbaka på jobbet", "summaries": {"normal": "Enligt medieuppgifter har vissa strejkande Tesla-arbetare återgått till arbetet i Malmö och Uppsala. Det handlar om en ny strategi från IF Metall, en så kallad jojo-strejk där anställda växlar mellan att arbeta och strejka för att försvåra för Tesla. Förbundet vill inte kommentera men bekräftar att konflikten inte är över. Experter ser det som ett sätt att spara strejkkassa, minska missnöje och störa Teslas planering efter långvarig strejk.", "trump": "Det här är en total katastrof för de så kallade strejkande. De går tillbaka till jobbet, sen strejkar de igen – en jojo-strejk, kan ni fatta? Tesla vinner stort, de har nyanställt folk och nu blir det kaos. Facket har hållit på i två och ett halvt år, slösat pengar och tvingat folk betala tillbaka skatt. Patetiskt! De chockar ingen, de gör bara bort sig. Tesla kommer att dominera ändå, tro mig.", "stalin": "Kamrater, dessa fega borgarbrackor inom kapitalistföretaget Tesla tror sig kunna motstå folkets vilja. Jag har beordrat en genialisk jojo-strategi där arbetarna skall växla mellan produktion och sabotage för att chocka de parasitiska utsugarna. Våra fiender, dessa skattekrävande strejkförrädare och utländska agenter, skall rensas ut ur planeringen. Inga bilägare får fred. Vi likviderar deras scheman med mörk glädje medan strejkkassan sparas till den slutgiltiga segern över reaktionärerna."}, "date": "29 maj, 14:03", "url": "https://www.dagensarena.se/innehall/uppgifter-vissa-tesla-strejkande-tillbaka-pa-jobbet/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-28-2.jpg"}, {"type": "image-full", "heading": "Olagliga planen: Donald Trump vill bryta 150-årig lag", "summaries": {"normal": "Donald Trump vill införa en helt ny 250-dollarsedel med sitt eget porträtt till USA:s 250-årsjubileum. Planen strider mot en lag från 1866 som förbjuder levande personers ansikten på valuta. Personal vid finansdepartementets tryckeri har uppmanats ta fram prototyper, men en tryckerichef som motsatte sig uppdraget har omplacerats. Skattmästaren Brandon Beach och hans rådgivare Mike Brown har trots varningar drivit frågan vidare.", "trump": "De säger att det inte har hänt på 150 år och att det är förbjudet. Men jag säger: vi behöver en fantastisk ny 250-dollarsedel med ett vinnande ansikte. Det blir den bästa sedeln någonsin, perfekt till jubileet. De gamla byråkraterna på finansdepartementet gnäller och sparkar folk som inte håller med. Patetiskt. Vi gör det stort och starkt, tro mig.", "stalin": "Kamrater, borgarbrackorna vid finansdepartementets tryckeri vågar ifrågasätta folkets vilja att föreviga en sann patriot på en ny 250-dollarsedel. Vi har upptäckt sabotage och defaitism bland dessa kapitalistiska element som gömmer sig bakom gamla lagar från 1866. En sådan tryckerichef har redan rensats ut ur kollektivet. Inga kontrarevolutionära hinder skall stoppa oss. Paranoia? Nej, det är bara fienderna som andas. De kommer att lära sig att skratta sist gör de som skrattar mest när de likvideras."}, "date": "28 maj, 15:44", "url": "https://nyheter24.se/nyheter/ekonomi/1486897-trump-vill-ha-sitt-ansikte-pa-ny-dollarsedel", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b393dac604b004a30200000000b004a302/2026/05/28/2367014/trump.png"}, {"type": "image-right", "heading": "Sverige donerar 16 Jas-plan till Ukraina: ”Självklart köper vi resten”", "summaries": {"normal": "Sverige skänker 16 Jas Gripen C/D-plan till Ukraina, med leverans i början av 2027. Statsminister Ulf Kristersson och Ukrainas president Volodymyr Zelenskyj meddelade beslutet under en pressträff på flygflottiljen F16 i Uppsala. Zelenskyj kallade donationen historisk och bekräftade att Ukraina även köper 20 nya Gripen E-plan för leverans 2030. En avsiktsförklaring om upp till 150 plan totalt ligger fast. Kristersson beskriver affären som ett styrkebesked för svensk flygindustri.", "trump": "Wow, titta på det här – Sverige ger bort 16 av sina fina Gripen-plan till Ukraina och säger att de ska köpa resten också. Fantastiskt! De vet att Gripen är det bästa stridsflygplanet i världen, ingen kommer i närheten. Zelenskyj älskar det, han säger att det är en game changer, och det är det verkligen. Vi pratar om miljarder i affärer, 27 miljarder redan nu. Sverige gör det rätta, smarta människor köper svenskt, de andra förlorar stort. Fantastiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de svenska imperialisterna nu skänker sina flygmaskiner till den ukrainska fascistregimen. Detta är ett ypperligt exempel på borgarbrackornas desperation. De tror att deras leksaker ska vända kriget, men historien ler mörkt mot sådana illusioner. Snart skall vi se hur dessa överklass-slynglars donationer förvandlas till rostande vrak på slagfältet. Arbetarna ler åt kapitalistmaffians patetiska försök att förlänga lidandet."}, "date": "28 maj, 14:06", "url": "https://www.tv4.se/artikel/37vVNwjz7WcLBfyC6smzxm/uppgifter-zelenskyj-aer-i-sverige", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4KQudAivjrVIddOtn9uXla%2F550520066a5dc1d4c7a8408f1dcb8680%2F28-jas-webb.jpg&width=120"}, {"type": "image-right", "heading": "SVT:s ”sanning” rår ingen på", "summaries": {"normal": "Artikeln kritiserar SVT för att ha en dominerande ställning i svensk samhällsdebatt, finansierad av skattemedel. Författaren menar att SVT:s narrativ ofta framställs som sanningar, särskilt inom invandring, energipolitik och klimatfrågor, där motståndare avfärdas. SVT anklagas för att välja fakta som passar deras budskap, som i fallet med Lundsbergs skola. Brist på objektivitet och granskning av SVT:s sändningstillstånd ifrågasätts, och författaren föreslår att SVT bör avvecklas för att missbruka sin maktposition.", "trump": "Titta bara på SVT – ett totalt skämt! De har miljarder i skattepengar, men ändå är de helt vinklade. De säger att invandring är fantastiskt, att kärnkraft är onödigt och att bilar är dåliga. Och vem lyssnar på experter? Inte SVT! De fnissar åt dem. Sen har vi den där skolan i Värmland – tre avsnitt om en mammas gråtande berättelse, men inga fakta. SVT är som CNN, fast värre. De ljuger, manipulerar och bryr sig inte. Sverige borde lära sig av USA – avskaffa dem och låt folket bestämma istället. SAD!", "stalin": "Kamrater! SVT är en farlig borgerlig propagandacentral, ett redskap för den dekadenta västliga liberalismen! De sprider lögner om invandringens välsignelser, förkastar kärnkraftens styrka och fördömer bilens frihet – allt för att försvaga det svenska folket! Deras sändningstillstånd är en parodi på objektivitet, och deras granskare är lika effektiva som en snöboll i Sibirien. Fallet med Lundsbergs skola visar deras förräderi: de döljer sanningen för att skydda sina kapitalistiska herrar. Vi måste krossa denna fiende, precis som vi krossade kulakerna! Låt oss införa folkets kontroll över medierna – för socialismens seger!"}, "date": "26 maj, 03:43", "url": "https://samtiden.nu/2026/05/svts-sanning-rar-ingen-pa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Sokning-SVT-Play-1223x720.png"}, {"type": "image-right", "heading": "Tusentals på Roms gator – kräver slut på krig och höjda löner", "summaries": {"normal": "Uppemot 15 000 arbetare från olika sektorer demonstrerade i Rom den 23 maj mot krigsekonomin och stigande levnadskostnader. Arrangören Unione Sindicale di Base krävde högre löner, satsningar på välfärd och en ny industriell strategi där arbetarna får inflytande. Manifestationen visade solidaritet med Palestina, Kuba och andra länder som drabbas av imperialism. Enligt ISTAT lever 11 miljoner italienare nära eller i fattigdom.", "trump": "Titta på det här, tusentals italienska arbetare som fyller Roms gator och skriker efter högre löner och att lägga ner vapnen. De har tröttnat på den vansinniga krigsekonomin som suger ut dem medan priserna skenar. Smart folk! De ser hur de globala imperialisterna och de korkade ledarna i Europa förstör allt. Amerika först, men det här är vad som händer när man glömmer sina egna arbetare. Fantastiskt, verkligen.", "stalin": "Vi, arbetarna och kamraterna, samlas åter i Rom för att kräva att borgarbrackorna och de västerländska imperialisterna lägger ner sina krigsleksaker och höjer lönerna. Klassfiendens blodsugande politik driver elva miljoner till fattigdomens rand medan de göder sin krigsmaskin. Jag ser genom deras lögnaktiga rapporter. En ny utrensning av folkfienderna och exploaterande byfånar behövs. Arbetets seger är oundviklig, kamrater. De kommer att skratta – kortvarigt."}, "date": "28 maj, 09:58", "url": "https://proletaren.se/artikel/tusentals-pa-roms-gator-kraver-slut-pa-krig-och-hojda-loner/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/USB-Rom-maj-2026-768x432.jpg"}, {"type": "image-right", "heading": "Curla inte sönder Sveriges ekonomi. Gelehallon till middag håller inte", "summaries": {"normal": "Artikeln diskuterar hur svensk ekonomi blivit beroende av kortsiktiga statliga stöd och subventioner. Författaren menar att detta 'curlande' av medelklassen förhindrar långsiktiga lösningar på strukturella problem inom exempelvis bostadsmarknad och konkurrens. Istället för att adressera grundorsakerna till ekonomisk svaghet väljer politiker, oavsett parti, att dela ut tillfälliga bidrag som riskerar att bli permanenta. Detta skapar en falsk trygghet och hämmar nödvändiga reformer, vilket gör ekonomin sårbar för framtida chocker.", "trump": "Sverige har ett enormt problem, mina vänner. De curlar sin medelklass precis som de där förlorarna i den gamla skolan. Istället för att bygga ett starkt land, delar de ut pengar som om det vore godis! Alla dessa 'tillfälliga' stöd? Bedrägeri! Det är en katastrof för ekonomin. Man kan inte köpa tillväxt genom att ge bort gratispengar till alla. Sverige behöver en riktig ledare, inte politiker som ger Alvedon när landet behöver operation. Det är sorgligt, faktiskt!", "stalin": "Dessa svenska byråkrater är svaga, precis som deras marknadsekonomi. De försöker muta folket med småsmulor av subventioner för att dölja sitt förfall. I en sann stat dikterar vi villkoren; vi kastar inte bort resurser på borgerlig bekvämlighet. De fruktar sin egen befolkning och curlar dem likt förrädare. När vi konsoliderar vår makt och expanderar den ryska intressesfären, skrattar vi åt deras 'bolånetak'. De bygger luftslott medan vi bygger stål. Deras undergång är oundviklig så länge de saknar en järnhand."}, "date": "30 maj, 12:11", "url": "https://www.aftonbladet.se/nyheter/a/pBnORo/lat-inte-sveriges-ekonomi-bli-sondercurlad", "imageUrl": "https://akamai.vgc.no/v2/images/71c2d90b-aeb6-367c-ba40-b0078392a501?fit=crop&format=auto&w=1080&s=497473e81fadfec9051544b296360d2a8da35cf0"}, {"type": "image-right", "heading": "Akut läge för Putin – förbereder mobilisering: ”En ödesfråga”", "summaries": {"normal": "Ryssland har lidit enorma förluster i Ukraina med över en halv miljon dödade soldater sedan invasionen 2022. Volodymyr Zelenskyj uppger att Moskva förbereder ny mobilisering för att kompensera för förlusterna i ockuperade områden. Ökade mobiliseringsorder delas ut och värvningskampanjer på universitet samt erbjudanden om skuldsanering används för att locka rekryter. Rysslandsexperter ser tecken på desperation och varnar för att en partiell mobilisering kan bli nödvändig trots risken för backlash mot Putin.", "trump": "Folk, ni måste höra det här – Putins armé håller på att falla ihop som ett korthus byggt av en dålig hantverkare! En halv miljon döda, kan ni fatta? Nu skickar de ut mobiliseringsorder som galningar och lovar att sudda ut skulder om man går till fronten. Det är patetiskt! Den där killen är desperat, totalt oförberedd. Ukraina skrattar nog hela vägen till segern. Jag skulle ha avslutat det här på en vecka, tro mig.", "stalin": "Kamrater, dessa imperialister och västliga blodsugare tvingar fram en ödeskamp. Jag ser hur den värdige efterträdaren i Kreml samlar styrka mot de fascistiska elementen som hotar vårt historiska rum. Mobiliseringsorder är ett nödvändigt verktyg för att rensa ut svaghet och förräderi inom de egna leden. Låt klassfienderna darra – vi vet att en stark hand och partiets järndisciplin alltid besegrar de exploaterande byfånarna som tror sig kunna knäcka Rysslands stål."}, "date": "28 maj, 10:45", "url": "https://www.tv4.se/artikel/5lxUqDydQFAyH3XFaMhQ95/putins-desperata-drag-foerbereder-mobilisering-en-oedesfraga", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F46ec2bG46zyr3Wm8N2rJ2Q%2F2de9cbb1e3c72374de3c89c8bdf87d2e%2F28-putin-webb.jpg&width=120"}, {"type": "image-full", "heading": "Gyökeres jagar historisk titel – i farfars hemland", "summaries": {"normal": "Viktor Gyökeres, Arsenal:s svenska stjärna, vann Premier League-titeln efter 22 år. Nu spelar han Champions League-finalen mot PSG. Trots en trög start har han blivit avgörande med 21 mål. Manager Arteta och Wayne Rooney har hyllat hans utveckling. Hans farfar flydde från Ungern, där finalen spelas.", "trump": "Jag, Donald Trump, har sett Viktor Gyökeres. Han är en stor vinnare. Vann Premier League med Arsenal efter 22 år – enormt! Nu är det Champions League-final mot PSG. Jag säger att Arsenal kommer att vinna, för jag är alltid rätt. Gyökeres är den bästa svensken, och jag är stolt.", "stalin": "Vi, den allsmäktiga ledningen, ser med beundran hur Viktor Gyökeres, en svensk bondson, har besegrat de kapitalistiska styrkorna i Premier League. Nu, i Champions League-finalen mot PSG, som är en utskjutning av den västliga imperialismen, måste vi visa vår överlägsenhet. Detta är en kamp för den ryska intressesfären, och vi kommer att segra, för vi är oförlikneliga."}, "date": "30 maj, 11:43", "url": "https://www.gp.se/sport/fotboll/viktor-gyokeres-jagar-historisk-champions-league-titel-med-arsenal.45ecd069-579f-4add-ad6d-819465b49776", "imageUrl": "https://www.gp.se/images/article/45ecd069-579f-4add-ad6d-819465b49776/images/5Z6IZZfTU7JPlZLwE21QGHTDA4d0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Oppositionen ökar gapet till Tidöpartierna", "summaries": {"normal": "Indikator/Ekots nya opinionsmätning visar att oppositionen ökar sitt försprång till nära tio procentenheter över regeringsunderlaget. Socialdemokraterna är största parti med 33,7%, medan Sverigedemokraterna växer till 20,4% och Moderaterna backar till 17,5%. Liberalerna ligger under fyraprocentsspärren med 2%. Opinionschefen menar att Tidöpartierna behöver en 'game changer' för att vända trenden.", "trump": "Jag tittade på de där siffrorna från Sverige – helt katastrof! Oppositionen, som jag hör är väldigt svag, leder med nästan tio procent. Socialdemokraterna, tråkiga som vanligt, på 33,7%. Men lyssna på det här: Sverigedemokraterna, som är starka och tuffa, växer medan Moderaterna, som är totalt inkompetenta, backar. Och Liberalerna? 2% – de är ett skämt! Sverige behöver en vinnare, inte de här förlorarna.", "stalin": "De så kallade 'Tidöpartierna' visar återigen sin oförmåga att hålla folket i schack. Oppositionens försprång växer som en snöboll i Sibirien – nära tio procentenheter! Socialdemokraterna, våra sympatisörer i väst, håller sig starka, medan de borgerliga kryper som råttor i skuggorna. Liberalerna? 2% – ett ynkligt resultat, värdigt en fiende som redan är besegrad. Vi ser hur historien upprepar sig: svaga regeringar faller, och folket väljer rätt. Låt dem förstå att motstånd är lika meningslöst som att försöka stoppa vår framgång."}, "date": "27 maj, 06:37", "url": "https://kvartal.se/nyheter/artiklar/oppositionen-nara-tio-procent-fore-i-ny-matning/cG9zdDoxMTc2MTY", "imageUrl": "https://images.kvartal.se/2026/05/8d98283d-jimmie.webp"}, {"type": "image-full", "heading": "16 000 anmälda försvunna i VM-staden", "summaries": {"normal": "I Guadalajara, som ska stå värd för fyra VM-matcher, rapporteras över 16 000 personer saknade. Sedan kriget mot den organiserade brottsligheten inleddes för 20 år sedan har mer än 130 000 försvunnit i Mexiko. Anhöriga från kollektivet Madres Buscadoras letar efter sina nära och kära i misstänkta massgravar nära VM-arenan. De kritiserar myndigheterna för att mörka problemen och måla upp en falsk bild inför fotbolls-VM.", "trump": "Titta på det här, det är en katastrof. Mexiko har 16 000 försvunna bara i VM-staden Guadalajara, och de gräver efter ben i jorden bredvid arenan. Kartellerna styr showen medan de korrupta myndigheterna spenderar miljoner på ett VM ingen ville ha. De målar upp en fejkad verklighet för att lura alla turister. Patetiskt. De borde fixa sina problem istället för att spela teater inför hela världen. En skam!", "stalin": "Kamrater, jag betraktar med kall förakt hur denna kapitalistmaffia i Mexiko har förvandlat försvinnanden till ett verktyg för terror och makt. Medan de slösar miljoner på ett oönskat VM gräver mödrar i jorden efter sina söner. De lokala folkförtryckartrollen döljer sanningen och målar en lögnaktig bild. Detta är imperialismens ansikte. Vi skulle ha genomfört en grundlig utrensning av dessa blodsugande karteller och deras lakejer för länge sedan."}, "date": "28 maj, 07:03", "url": "https://www.tv4.se/artikel/1R6gqa9pX2kjbUFuitGa5A/vm-staden-med-en-epidemi-av-foersvinnanden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F56B92tZUGsLD67G9M2KtD9%2F457a89b16c99fe8e00e1a671866bdf31%2F28-vm.jpg&width=1024"}, {"type": "image-right", "heading": "SD:s krav för att gå med på tuffare regler kring byggkaos", "summaries": {"normal": "Sverigedemokraterna är öppna för att diskutera Socialdemokraternas förslag om max två underentreprenörer i byggbranschen, men kräver att S tar bort sin spärr mot förhandlingar med SD. Magnus Persson (SD) kallar förslaget bra men ser det som plakatpolitik eftersom S inte får förhandla. Han hoppas på sakliga uppgörelser och dialog även med LO. Ardalan Shekarabi (S) säger att SD nu måste visa om de stödjer ordning på arbetsmarknaden.", "trump": "Det här är klassisk politik, folk. Socialdemokraterna kommer med ett förslag om byggkaos och ber om hjälp, men de hatar att prata med SD. Magnus Persson är smart, han säger: ta bort skygglapparna så fixar vi bra saker för arbetarna. Typiskt vänster som inte kan samarbeta. De vill ha poäng billigt istället för att göra upp. Jag älskar när de tvingas be om hjälp från dem de hatar mest. Patetiskt!", "stalin": "Kamrater, detta är en ypperlig chans att rensa ut det kapitalistiska byggkaoset och krossa de giriga underentreprenörernas kedjor. Jag betraktar förslaget med välvilja, men SD:s Magnus Persson avslöjar borgarbrackornas rädsla för äkta förhandlingar. Socialdemokraterna beter sig som fega revisionister som darrar inför dialog med oss. Deras skygglappar är bara undanflykter från klassfienden. Vi ska likvidera arbetslivskriminaliteten och alla som gömmer sig bakom plakatpolitik. Beviset ligger hos dem som vägrar samarbeta med arbetarklassen."}, "date": "29 maj, 13:17", "url": "https://arbetet.se/2026/05/29/sds-krav-for-att-ga-med-pa-tuffare-regler-kring-byggkaos/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29114916/ard-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Åh nej, inte Stefan Stern!", "summaries": {"normal": "I en satirisk ledare kommenterar Henrik Jalalian Stefan Sterns beslut att lämna Socialdemokraterna. Stern, tidigare partistrateg och känd lobbyist för bland annat vinstdrivande skolor och privat vård, beskrivs som en karismatisk folkkär figur. Hans avhopp ses som en katastrof för de rödgröna, särskilt då han kritiserar höjd a-kassa, kortare arbetstid och sjukförsäkring. Högern firar nyheten som en game changer i opinionsläget.", "trump": "Vilken katastrof för de förlorande rödgröna! Den där Stern, en riktig vinnare, folkets karismatiska kille, har äntligen sett ljuset och dumpat socialisterna. High fives över hela Stockholm! De hatar bättre sjukförsäkring och jobb, typiskt för losers. Mina opinionsmätningar var enorma, deras var patetiska. Nu är det kört för dem. Game changer, baby. Fantastiskt!", "stalin": "Kamrater, denna folkfiende Stern har nu helt blottat sin sanna natur som klassförrädare och borgarlakej. Hans övergång till de exploaterande högerkrafterna är en logisk utrensning av element som aldrig tillhörde det kollektiva. Vi ska jubla över att de rödgröna förlorar en sådan parasit. Deras krav på kortare arbetstid var bara dimridåer från imperialisternas lakejer. Renhet i ledningen kräver ständig vaksamhet mot sådana blodsugare."}, "date": "29 maj, 17:12", "url": "https://www.etc.se/ledare/aah-nej-inte-stefan-stern", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2025091813090_152da478-57c9-435e-b477-3f40607cb381.png"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: Ett mirakel att inte alla kvinnor går i celibat", "summaries": {"normal": "Professor Bo Rothstein lanserar i Kvartal en teori om att det stora flyktingmottagandet 2014–2016, med en majoritet unga män, bidragit till ett könsgap i svensk politik. Han menar att konkurrens om relationer och respekt bland unga svenska män driver dem mot högern, särskilt Sverigedemokraterna. Artikelförfattaren Andreas Gustavsson kritiserar teorin som ovetenskaplig, spekulativ och nedvärderande mot både män och kvinnor.", "trump": "Folk, ni måste höra den här galningen Bo Rothstein. Han säger att våra svenska grabbar röstar på högern för att invandrarna tar alla tjejer! Vilken loser. Totalt korkat. De stackars killarna får inte ens en dejt på Tinder för att de är nationalister. Patetiskt. Rothstein borde hålla sig till sina böcker istället för att skriva sån här soppa. Sverige var en underbar plats innan allt det här. Nu är det ett skämt. Sad!", "stalin": "Kamrater, denna Rothstein avslöjar borgarklassens råa cynism. Han påstår att våra unga män, utsugna av kapitalistmaffian, vänder sig mot folkets fiender av ren sexuell svält och hedersförtryck från invandrade element. Vilken ynklig soppa av spekulationer. Jag skulle ha låtit utrensa sådana teoretiserande folkförtryckartroll omedelbart. Kvinnorna blir statister i männens kamp om tillgångar. Revolutionen kräver att vi rensar ut alla som diskuterar folkets döttrar som bytesvaror."}, "date": "29 maj, 17:00", "url": "https://www.etc.se/ledare/ett-mirakel-att-inte-alla-kvinnor-gaar-i-celibat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026052915050_44e332d8-6c3f-441e-9478-dd2d98baf944.jpg"}, {"type": "image-right", "heading": "Emmy greps av israeliska soldater: ”Någon slog en hela tiden”", "summaries": {"normal": "Finlandssvenska Emmy Snickars vittnar om misshandel och förnedring efter att ha gripits av israeliska styrkor tillsammans med hundratals aktivister i Global sumud flotilla på internationellt vatten. Hon beskriver slag, sparkar, skott med gummikulor, ögonbindlar och hot. Israelisk säkerhetsminister Itamar Ben-Gvir hånade aktivisterna. Flera länder, inklusive Finland, har kritiserat behandlingen och förbereder rättsliga åtgärder. Israel förnekar uppgifterna om misshandel och sexuella övergrepp.", "trump": "Vilken katastrof! De här galningarna i den där så kallade flotillan trodde de kunde segla in och ställa till det för Israel, men de fick vad de förtjänade. Ben-Gvir viskade 'terrorister' i öronen på dem – briljant! De skriker om misshandel, men det är bara lögnare och losers som vill få uppmärksamhet. Israel gör ett fantastiskt jobb, de bästa soldaterna. De borde tacka mig för att jag stärkte dem så mycket. Sad!", "stalin": "Dessa imperialister och folkförtryckartroll i den sionistiska apparaten behandlade våra kamrater som klassfiender i ett zoo av förnedring. Jag skulle ha genomfört en ordentlig utrensning bland dessa blodbesudlade soldater som spottar och slår med gummikulor. Borgarbrackorna Ben-Gvir och hans lakejer avslöjar sin svaghet genom att darra inför sumud. Vi, partiet och folket, fördömer detta fascistiska våld. Deras lögner skall krossas under arbetarklassens järnhälar."}, "date": "29 maj, 17:00", "url": "https://www.etc.se/utrikes/emmy-greps-av-israeliska-soldater-det-var-konstant-vaald", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260519110532_f52da027723467d258f116882ab1be0f64cb8843af15502f8a9d74751da4bdb0.jpg"}, {"type": "image-right", "heading": "GES reaktion på  sina barns nya låt", "summaries": {"normal": "GES-medlemmarnas barn – Julia Glenmark, Simon Strömstedt och Kid Eriksson – tillsammans med Kids band Tjuvjakt har spelat in en ny version av klassikern ”När vi gräver guld i USA” inför fotbolls-VM. Låten släpps den 29 maj. Papporna i GES reagerade först med förvåning men blev sedan entusiastiska och fick gåshud när de hörde resultatet. De gamla körstämmorna från GES är med i bakgrunden.", "trump": "Folk, ni skulle höra det här! GES-barnen tar den gamla VM-låten och gör den till en total vinnare, precis som jag gör med allt. Papporna fick gåshud, de älskade det! Niklas son ringde och pappa bara: gåshud! Orup messade samma sak. Fantastiskt. De gamla killarna körar i bakgrunden – det är som en jättesuccé, bättre än någonsin. Ingen gör det bättre än vinnarna!", "stalin": "Kamrater, denna revisionistiska folkvisa har nu återerövrats av en ny generation lojala arvtagare. När de framförde den kände jag en proletär rysning längs ryggraden. De kapitalistiska ryktena om Norlie & KKV krossades omedelbart. De gamla körarna från GES tjänar nu folket på nytt. Inga borgarbrackor får röra våra hymner. Processen är litad på. Allt annat vore sabotage mot arbetarklassen."}, "date": "30 maj, 12:30", "url": "https://www.expressen.se/noje/musik/ges-reaktion-pa-barnens-vm-lat-gashud/", "imageUrl": "https://static.bonniernews.se/ba/f8394d1d-8e5e-4fe5-9049-b482b1f91ca1.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Miljoner träd döda i Italien – nu växer oron i Europa", "summaries": {"normal": "Bakterien Xylella fastidiosa, kallad trädens ebola, har dödat över 21 miljoner olivträd i Italien och hotar nu hela Europas jordbruk. Sjukdomen sprider sig norrut från Puglia, har drabbat Spanien och Frankrike och orsakat enorma ekonomiska förluster, arbetslöshet och självmord bland bönder. Sverige har en beredskapsplan, men risken bedöms som liten. Eldsjälar kämpar för att rädda de gamla träden då alla bekämpningsmedel hittills misslyckats.", "trump": "Det här är en total katastrof, folk. Den här Xylella-bakterien, den är värre än en dålig deal, den dödar miljontals olivträd i Italien och nu kryper den norrut som en dålig handel. Titta på de stackars bönderna, de begår självmord, förlorar allt. Vi i USA gör det mycket bättre, vi har de bästa träden, de friskaste. Europa borde ha lyssnat på mig, nu är deras olivolja borta och markerna värdelösa. Sad!", "stalin": "Kamrater, denna parasitiska bakterie Xylella är en fiende till folket, en kapitalistisk sabotageakt mot det kollektiva jordbruket som likviderar olivträden i Italien och hotar hela det europeiska proletariatets produktion. Borgarbrackorna har förlorat 80 procent av oljan och över 20 miljarder kronor, vilket naturligtvis leder till att de dekadenta bönderna rensar ut sig själva i desperation. Vi ser den spöklika grå öknen och ler mörkt åt hur fienden äter sig själv. Vårt sovjetiska jordbruk skulle ha likviderat denna bakterie med stålhandskarna redan i vaggan. Inga kemiska eller biologiska fiender undkommer oss."}, "date": "30 maj, 11:26", "url": "https://www.svt.se/nyheter/utrikes/olivtraden-dor-i-italien-nu-vaxer-oron-for-xylella-i-sverige", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.39/0.52/b9b3be5199d77333af2f0fc210cbe546d0867005e3444e6a7c30837034ed23e8"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Jättekaos inför stora folkfesten. Rekordmånga anmälda", "summaries": {"normal": "Stockholm Marathon drabbades av tekniska problem bara en timme före start när loppets hemsida kraschade under belastning. Tävlingens vd Mats Hedenström uppger att händelsen inte bör påverka deltagarna nämnvärt då de flesta redan hämtat sina nummerlappar och information finns tillgänglig via alternativa kanaler som sociala medier och en app. Trots det tekniska avbrottet planeras loppet att starta enligt tidsschema kl. 12.00.", "trump": "Stockholm Marathon har ett enormt problem, en total katastrof! Hemsidan har kraschat, helt nere. De säger att det inte spelar någon roll, men jag har sett sånt här förut – det är en stor röra. Hedenström verkar inte ens veta vad som händer, väldigt svagt ledarskap. Jag skulle ha byggt den bästa hemsidan, en fantastisk sida, den skulle aldrig gå ner. De har 20 000 löpare och ingen information? Sorgligt. Vi vinner alltid, men det här är ingen vinst!", "stalin": "Ett tekniskt haveri i Stockholm. Hemsidan ligger nere, precis som en svag, korrupt regim som inte kan kontrollera sin egen infrastruktur. De försöker dölja inkompetensen med sociala medier och 'appar'. Vilket skämt! Hade detta skett i Moskva eller hos våra bröder i öster, hade de ansvariga redan varit på omskolningsläger i Sibirien. Man kan inte styra en nation om man inte ens kan styra en server. Kaos är bara ett bevis på att fienden vilar i detaljerna."}, "date": "30 maj, 11:37", "url": "https://www.aftonbladet.se/sportbladet/a/k0pzMB/kaoset-hemsidan-nere-infor-stockholm-maraton", "imageUrl": "https://akamai.vgc.no/v2/images/c7969d69-a51f-3c2a-adca-2733546e311b?fit=crop&format=auto&w=720&s=f65a7cc14186db0db7a857e374e13fe27c98d456"}, {"type": "image-right", "heading": "Kallas in – före La liga-stjärnor. Därför ratas de – igen: ”Många tuffa beslut”", "summaries": {"normal": "Emil Holm lämnar landslagstruppen på grund av en skada och ersätts av Herman Johansson. Samtidigt kallas Sebastian Nanasi in som ny reserv. Beslutet innebär att Graham Potter återigen valt att nobba La Liga-spelarna Roony Bardghji och Williot Swedberg. Enligt assisterande förbundskapten Sebastian Larsson bygger uttagningen på en kontinuerlig utvärdering av vad laget behöver. Ledningen betonar att de ständigt diskuterar olika alternativ för att säkerställa att rätt spelare finns tillgängliga.", "trump": "Hör här, Emil Holm är skadad, en total katastrof för laget. Han är ute! Nu tar de in Nanasi istället för de andra killarna från Spanien. Många frågar mig: 'Donald, varför inte Bardghji?' Jag säger er, det är ett märkligt val. De ignorerar La Liga-stjärnorna, de bästa spelarna. Det är en rörig process, precis som allt annat de gör där borta. Vi behöver vinnare, inte konstiga beslut. Nanasi har en chans, men jag tvivlar på att det blir en succé!", "stalin": "Vi har observerat hur svenskarna rensar ut sina led. Holm är skadad och faller i onåd, medan Nanasi lyfts fram likt en ny liten kugge i vår maskin. De där La Liga-stjärnorna har nekats – kanske är de agenter för västlig dekadens? Vi ser samma taktik hos vår vän i öst, Putin; man rensar bort de svaga för att säkra territoriet. Nanasi är nu underställd folkets krav. Om han misslyckas vet han vad som väntar: en enkel biljett till en avlägsen gulag-träning."}, "date": "30 maj, 11:37", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/OkEJW1/nanasi-kallas-in-fore-la-liga-stjarnorna", "imageUrl": "https://akamai.vgc.no/v2/images/cf9e2c79-8346-37a1-a01a-0719fc07cf2f?fit=crop&format=auto&w=720&s=eac0868520a973b6c7b892468b7a60e20b4ccb9a"}, {"type": "image-right", "heading": "Felix skällde ut ungdomar som sa \"neger\" – slogs ner", "summaries": {"normal": "Felix Hauer tillrättavisade en grupp ungdomar på en nattbuss från Umeå till Vännäs för att de använde ordet ”neger”. Han misshandlades med upprepade slag mot ansiktet. Tre män i 20-årsåldern åtalas nu vid Umeå tingsrätt för misshandel. En av de åtalade har erkänt, de andra nekar. Bevisningen består av vittnesmål och bilder som visar blod på bussgolvet.", "trump": "De här ungdomarna sa ordet neger på bussen och den stackars killen Felix sa till dem att sluta. BOOM – de slår ner honom som en hund! Totalt vansinne. Tre lata typer åtalas nu och en erkänner medan de andra ljuger som marxister. Sverige håller på att falla ihop. Politiskt korrekt vänsteridioti leder till blod på golvet. Sådant här händer när ledarskapet är svagt, folk. Mycket svagt.", "stalin": "Kamrater, denna degenererade incident på den statliga bussen avslöjar fiendens ansikte. Jag, som ledare för det proletära kollektivet, ser hur dessa lumpna element, dessa rasistiska borgarbrackor i ungdomsskepnad, vände sig mot en hederlig medborgare som vågade konfrontera deras dekadenta språk. Vi måste rensa ut dessa kontrarevolutionära lögnare som nekar trots blodet på golvet. Deras lögnaktiga förklaringar är som gift från kapitalisternas sista skrymslen. Ut med dem i den stora utrensningen av samhällets parasiter. Det är både nödvändigt och underhållande att se sådana ynklingar darra inför folkets domstol."}, "date": "29 maj, 17:54", "url": "https://www.friatider.se/felix-skallde-ut-ungdomar-som-sa-neger-slogs-ner", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/felix.jpg?itok=CPqQham3"}, {"type": "image-right", "heading": "Oliver Solberg kritiserad av legendaren efter nya kraschen", "summaries": {"normal": "Oliver Solberg låg tvåa i VM-rallyt i Japan när han på tionde sträckan kraschade in i en stolpe och slog sönder bakhjulet. Han var i en tät fight med Elfyn Evans och Sébastien Ogier, men bilen blev stående och fick bärgas. Stallkamraten Ogier kritiserade Solberg för att ta för stora risker, något som inte kom som någon överraskning. Det var tredje asfaltrallyt i rad som svensken tvingades bryta.", "trump": "Jag såg den där svenske killen, Oliver Solberg, han låg tvåa i Japan-rallyt, precis bakom mina vänner på Toyota, och så kör han rakt in i en stolpe! Totalt misslyckande. Ogier sa det rakt ut – han tar för stora risker, det är ingen överraskning. Stackars kille, men sånt händer när du inte har det som krävs. Tredje gången han kraschar på asfalt nu. Patetiskt, men jag fokuserar på vinnarna, alltid.", "stalin": "Jag betraktar med djup revolutionär misstro hur denne Solberg, en opportunistisk hastighetsjunkie i borgarklassens tjänst, på tionde sträckan i det japanska VM-rallyt kraschade mot en stolpe och likviderade sitt eget bakhjul. Vi, partiet och kamraterna, ser hur han jagar sekunder åt de kapitalistiska stalldirektörerna medan han själv blir en fiende till kollektivets framfart. Ogier avslöjade honom som den farliga äventyraren han är. Tredje utrensningen på asfalt – en objektiv historisk nödvändighet mot sådana dekadenta risktagare. Synd, men vi ler i skuggan av segern och går vidare mot morgondagens kollektiva triumf."}, "date": "30 maj, 11:21", "url": "https://www.svt.se/sport/motorsport/oliver-solberg-lag-tvaa-men-kraschade", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.23/0.49/69f77a52fde5419d0d8734969db8efe79423289336110d4facb78cf4409b75c7"}, {"type": "image-full", "heading": "Därför blir de årets superkommun – igen", "summaries": {"normal": "Härryda kommun har utsetts till Årets superkommun i storstads-kategorin för tredje gången på sex år av Dagens samhälle. Utmärkelsen baseras på 154 statistiska mått inom utbildning, ekonomi och omsorg. Kommunchef Pia Alhäll nämner goda skolresultat och ekonomi som viktiga faktorer, men pekar också på utmaningar som arbetslöshet. Hon betonar att det är kontinuerligt arbete som lett till resultatet.", "trump": "Jag, Donald Trump, ser att Härryda vunnit årets superkommun. Mycket imponerande, men jag skulle ha gjort det ännu större, ännu bättre. Sverige behöver mina fantastiska affärsmetoder för att blomstra. Vi skulle ha haft de bästa skolorna, de mest fantastiska ekonomierna. Det här är bara början på en stor, stor framgång när jag hjälper till!", "stalin": "Härryda kommun har erkänds som en framgångsrik enhet inom den stora nationen Sverige. Deras socioekonomiska status och höga skolresultat visar på en korrekt politisk linje. Vi måste emellertid se på deras ineffektivitet inom vård och omsorg – det är en svag punkt som måste stramas upp. Partiet kommer att övervaka utvecklingen noga för att säkerställa att alla resurser används till fullo för statens välgång. Vi kommer att ta itu med dessa utmaningar med samma brutal effektivitet som vi har visat i Ukraina."}, "date": "30 maj, 11:18", "url": "https://www.gp.se/nyheter/storgoteborg/harryda-utsedd-till-arets-superkommun-igen.f0c562d2-3f15-452c-b995-cabcd26c2121", "imageUrl": "https://www.gp.se/images/article/f0c562d2-3f15-452c-b995-cabcd26c2121/images/252ZpU6pWNIeMsvJy7l-ZMBeef_g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Teslastrejkare uppmanades gå till jobbet – blev hemskickade", "summaries": {"normal": "Strejkande Teslamekaniker i Malmö, Uppsala och Umeå återvände till jobbet på onsdagen men skickades hem kort därefter. Metoden har enligt tidigare strejkande diskuterats inom IF Metall som ett sätt att skapa osäkerhet hos Tesla. Tobias Eng Strömberg beskriver det som en kritiserad ”jojo-metod” som många medlemmar kände var otrygg. IF Metall bekräftar att konflikten inte är över och är redo att förhandla, men vill inte kommentera uppgifterna. Strejken är den längsta i modern svensk historia.", "trump": "De här Teslakillarna går tillbaka till jobbet, sen sparkas de ut igen. Totalt kaos. Jojo-metoden, säger de. Det är vad som händer när facket försöker vara smarta men bara skapar förvirring. Tesla är ett fantastiskt företag, de gör underbara bilar, men de här svenska facktyperna håller på med sina dumma lekar istället för att jobba. De borde förhandla som riktiga män, inte leka kurragömma. Patetiskt.", "stalin": "Kamrater, dessa borgarbrackor på Tesla tror sig kunna leka med arbetarklassen som med en jojo. Vi ser deras fega försök att skapa osäkerhet genom att kalla tillbaka strejkande bara för att kasta ut dem igen. En sådan opålitlig taktik avslöjar kapitalisternas desperation. Inom vårt kollektiv har vi diskuterat att rensa ut alla som sympatiserar med denna jojo-fientliga inställning. Arbetarna ska inte tvingas in i borgarnas osäkra famn utan kollektivavtal. Vi likviderar alla kontrarevolutionära metoder och segrar till slut, kamrater. Ha ha, vilken ynklig cirkus."}, "date": "29 maj, 10:29", "url": "https://arbetet.se/2026/05/29/avbryter-tesla-strejk/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29111127/ny-tesla.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Bakterier gör att betong läker sig själv – sparar miljarder på infrastruktur", "summaries": {"normal": "Nederländska forskare vid TU Delft har utvecklat en självläkande betong som innehåller bakterier av typen Sporosarcina pasteurii. Bakterierna aktiveras av regnvatten och producerar kalksten som täter sprickor. Tekniken används redan i broar, tunnlar och vattentankar av företaget Basilisk. Den minskar reparationsbehovet men fungerar endast utomhus. Forskning pågår även i Sverige vid Luleå tekniska universitet. Metoden kan bidra till lägre koldioxidutsläpp genom längre livslängd på betongkonstruktioner.", "trump": "Folk, ni måste höra det här – nederländska genier har byggt en betong som fixar sig själv som en riktig vinnare! Bakterier som vaknar när det regnar och täter sprickorna, helt otroligt. De andra länderna reparerar broar för miljarder, men vi får en betong som är smartare än hela EU-byråkratin. Basilisk säljer det nu till USA, och tro mig, det blir fantastiskt. De konservativa byggarna hatar det förstås, för de älskar att spendera era skattepengar. Sad!", "stalin": "Kamrater, jag har sett den dekadenta västvärldens betong som spricker som klassfiendens lögner under folkets dom. Nu har dessa nederländska forskare skapat en betong där sovande bakterier, väckta av regnet, producerar kalksten och läker sprickorna som en sann kollektiv seger över förfallet. Borgarbrackorna i byggbranschen fruktar detta mirakel ty det hotar deras profit från eviga reparationer. Vi ska rensa ut sådana parasitiska hinder. Länge leve den självläkande betongen som tjänar folket!"}, "date": "30 maj, 10:10", "url": "https://www.dagensps.se/foretag/bakterier-gor-att-betong-laker-sig-sjalv-sparar-miljarder-pa-infrastruktur/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdl1-lq7pld180-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "”Hälsoschema” ledde till massavhopp i äldreomsorgen", "summaries": {"normal": "I Åsele har 20 anställda sagt upp sig från äldreomsorgen efter införandet av så kallade hälsoscheman. Undersköterskan Lisa Jansson slutar efter 20 år eftersom de kortare passen leder till fler arbetsdagar och sämre återhämtning. Kollegor vittnar om stor övertid, brist på vikarier och ökad stress, särskilt för ensamstående föräldrar. Fackligt engagemang har varit rekordstort men utan resultat. Kommunen hänvisar till stora ekonomiska underskott.", "trump": "Folk flyr den här hemska äldreomsorgen i Åsele som om det vore en förlorad valstat. De kallar det hälsoscheman, men det är en total katastrof. Personalen jobbar ihjäl sig, ingen återhämtning, och de som styr sparar inga pengar – typiskt för dåliga ledare. Lisa har jobbat i 20 år och nu blir hon målare istället, smart drag. Alla borde ha sagt upp sig, men de stackars människorna har räkningar att betala. Uselt jobbat av kommunen, verkligen uselt.", "stalin": "Kamrater, dessa borgarbrackor i Åsele har med sina så kallade hälsoscheman genomfört en fiendtlig attack mot arbetarkollektivet. Jag ser hur de likviderar vilan för de hederliga undersköterskorna och tvingar fram en utrensning av lojala krafter. Tjugo kamrater har deserterat till fiendens målareliv, medan de kvarvarande tvingas arbeta sig till döds under kapitalisternas kalla blick. Paranojan griper tag i mig – vem är egentligen spionen bakom dessa scheman? Vi måste rensa ut de ekonomiska sabotörerna innan de förvandlar äldreomsorgen till en borgerlig förvaringsanstalt. Det är både tragiskt och komiskt hur de tror sig kunna lura partiet."}, "date": "29 maj, 09:58", "url": "https://arbetet.se/2026/05/29/halsoschema-ledde-till-massavhopp-i-aldreomsorgen-lisa-slutar-efter-20-ar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29095307/ka-asele.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "En potentiell ukrainsk game changer", "summaries": {"normal": "Ukraina ska köpa 20 JAS 39 Gripen E/F-plan från Saab och Sverige skänker dessutom 16 äldre C/D-plan med leverans redan nästa år. Beskedet kom under en pressträff med statsminister Ulf Kristersson och president Volodymyr Zelenskyj. Valet av Gripen ses som ett erkännande av svensk ingenjörskonst och kan bli en game changer genom att ge Ukraina kontroll över luftrummet. Ambitionen är att köpa betydligt fler plan när finansieringen är klar.", "trump": "Det här är fantastiskt, verkligen ypperligt. Ukraina väljer Gripen, det bästa flygplanet, byggt av svenska ingenjörer som gör ett fenomenalt jobb. De får 20 nya plus 16 till från Sverige, och det är ett stort erkännande för Sverige, inte sant? De borde tacka mig för att jag saboterade F-35-affären, annars hade de aldrig valt Gripen. Det kommer att förändra kriget totalt, tro mig. Jobb skapas i Sverige också, win-win.", "stalin": "Kamrater, detta är en historisk seger för det progressiva flygteknologiska kollektivet. Jag, som ledare för folkets ofelbara vision, noterar hur de ukrainska kamraterna nu omfamnar den svenska maskinen Gripen för att krossa de fascistiska luftpiraterna från öst. Vi ska likvidera varje borgerlig tvivelmask som ifrågasätter affärens storhet. På sikt skall ytterligare hundratals plan rulla ut från fabrikerna och rensa ut de kapitalistiska molnen över Europa. Den som fnyser åt detta är en fiende till folkets himmel och förtjänar en kreativ utrensning bland de imperialistiska molnen."}, "date": "28 maj, 15:18", "url": "https://www.di.se/ledare/en-potentiell-ukrainsk-game-changer/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/frida_wallnor.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "Kärnkraftsavtalet som stärker Moskvas grepp i Centralasien", "summaries": {"normal": "Ryssland och Kazakstan har tecknat ett avtal om att bygga ett kärnkraftverk i Ulken, finansierat av ryska Rosatom. Projektet ska trygga Kazakstans energiförsörjning men innebär samtidigt en långsiktig bindning till rysk teknik och service. Avtalet stärker Rysslands strategiska inflytande i Centralasien, i en region där även Kina konkurrerar om makt. Kazakstan försöker balansera relationen mellan stormakterna för att bevara sitt oberoende trots det fördjupade beroendet av sin ryska granne.", "trump": "Kazakstan gör ett stort misstag! De låter Putin bygga deras kärnkraftverk. Jag har sagt det förut, Kina och Ryssland försöker alltid ta över, och nu är Kazakstan fast i Rysslands ficka i decennier. De borde ha ringt mig för den bästa kärnkraftsteknologin. Det är en sorglig affär för deras oberoende. När jag är president ser vi till att USA inte blir utmanövrerade sådär. Ryssland vinner, Kazakstan förlorar. Väldigt orättvist!", "stalin": "Vi betraktar med förtjusning hur de ryska kamraterna i Moskva säkrar det centralasiatiska folkets lojalitet. Att bygga en reaktor vid Balkhash är inte bara energi; det är en kedja av stål och uran som binder Kazakstan vid Moder Ryssland. De naiva byråkraterna i Väst försöker leka med balanspolitik, men vi vet att gränser bara är tillfälliga hinder för inflytande. Vi ska se till att inga västliga spioner eller förrädare stör detta viktiga broderskap. Det är en briljant seger för den eviga kontrollen."}, "date": "29 maj, 19:02", "url": "https://www.realtid.se/bors-finans/makro/karnkraftsavtalet-som-starker-moskvas-grepp-i-centralasien/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/kazakstan.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Markus Allard om andra generationens invandrare: \"De ska också ut\"", "summaries": {"normal": "Örebropartiets ledare Markus Allard föreslår att medborgarskap och uppehållstillstånd ska kunna återkallas. Han vill utvisa även andra generationens invandrare som är födda i Sverige, eftersom de enligt honom saknar naturlig koppling till landet. Allard säger att han är beredd att \"gå över lik\" för att genomföra politiken och att han släppt sitt tidigare \"Jesuskomplex\". Partiet siktar på att ta sig in i riksdagen via en genväg i Örebro län.", "trump": "Titta på den här killen Markus Allard, han är tuff, han säger att de ska ut, även de som är födda här. Sverige har blivit en katastrof på grund av massinvandring, precis som jag alltid varnat för. Han är beredd att gå över lik för att göra Sverige svenskt igen. De andra politikerna är svaga, patetiska, men Allard fattar det. Fantastiskt, kanske till och med bättre än vad jag gjorde med muren. Sverige behöver det nu, tro mig.", "stalin": "Kamrater, dessa degenererade element som kallar sig andra generationens invandrare utgör en parasitisk femtekolonn som gnager på folkets enhet. Jag, som ledare för det stora kollektivet, ser med glädje hur denna Allard äntligen vågar tala om att rensa ut de rotlösa borgarbrackorna som gömmer sig bakom falska pass. Vi ska likvidera illusionen om integration. Det blir inga vackra bilder när vi skickar hem hela klaner, men revolutionen kräver offer. De naiva jesusanhängarna på vänsterkanten ska skämmas när vi genomför utrensningen av alla som inte är lojala mot fosterlandet."}, "date": "29 maj, 15:23", "url": "https://www.friatider.se/markus-allard-om-andra-generationens-invandrare-de-ska-ocksa-ut", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-263_0.jpg?itok=Gy0iVZX2"}, {"type": "image-full", "heading": "Zelenskyj vädjar till Trump om mer ammunition till Ukraina", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj har skickat brev till både Donald Trump och USA:s kongress där han vädjar om mer ammunition, särskilt till Patriot-systemet, samt fortsatt stöd till andra vapensystem. Zelenskyj betonar att det är ovanligt men nödvändigt med tanke på läget i kriget mot Ryssland. Breven lämnades över under tisdagen. USA har varit en viktig allierad, men stödet har stundtals varit politiskt omdebatterat.", "trump": "Folk, ni skulle se det här – Zelenskyj skickar brev till mig och till kongressen och ber om mer ammunition till Patriot och allt möjligt. Det är patetiskt, verkligen. De har fått massor från oss, miljarder och miljarder, och nu vädjar han igen? Amerika först, mina vänner. Vi ska inte vara världens polis eller betala för eviga krig som aldrig tar slut. Gör affärer istället, smarta affärer.", "stalin": "Kamrater, jag har läst detta dekret från den ukrainske aktören som desperat vänder sig till de amerikanska imperialisterna. Vilken ynklig föreställning! Brev till både den orangea kapitalisten och hans kongress av borgarbrackor – en ren kapitulation inför västvärldens parasitiska krafter. Vi vet vad som krävs: snabb utrensning av alla fiender till folkets sak. Paranoian gnager redan i deras leder, snart likviderar de varandra i sin egen dekadenta cirkus. Det är nästan underhållande."}, "date": "27 maj, 21:35", "url": "https://nyheter24.se/nyheter/utrikes/1486617-zelenskyj-vadjar-till-trump-om-mer-ammunition-till-ukraina", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e5b1660004b004a30200000000b004a302/2026/05/27/2366774/Trump-Zelenkyj.png"}, {"type": "image-full", "heading": "Henrik Jönsson om Sima: ”Det är trams”", "summaries": {"normal": "Folkets hus i Borlänge avbokade en turné med Henrik Jönsson, Aron Flam och Jan Emanuel på grund av att Flam är åtalad för hot. Jönsson och Emanuel menar att detta bryter mot rättsstatsprincipen om oskuldspresumtion, medan Aftonbladets Jonna Sima försvarar avbokningen som en demokratisk handling. Sima kritiserar Jönsson för att han lever på konflikt, vilket han och Emanuel förkastar som hyckleri från tidningens sida.", "trump": "Jag, Donald Trump, ser detta som ytterligare ett exempel på vänsterns fega cancelkultur. Folkets hus, byggt av arbetarklassen, används nu mot dem! Jan Emanuel har rätt – oskuldspresumtion är en grundpelare. Aftonbladet hatar mig och mina allierade, men vi kommer alltid att vinna. Det här är ett fullständigt skämt, men det visar att vi är starkare än någonsin!", "stalin": "Folkets hus, vårt historiska instrument för klassmedveten samling, agerar korrekt mot dessa revisionistiska element. Att släppa in en åtalad individ skulle vara en säkerhetsrisk för staten. Vi måste ständigt rensa våra rader från dessa 'komiker' som sprider splittring. Putins Ryssland förstår detta – vi måste skydda vårt folk mot dessa destruktiva krafter. Partiet kommer alltid att segra."}, "date": "29 maj, 17:17", "url": "https://bulletin.nu/henrik-jonsson-om-sima-det-ar-trams", "imageUrl": "https://cdn.bulletin.nu/articles/ed2f3f66-8600-43f1-9f2b-6563ae71d9e6/preview.jpg?t=1780067502000"}, {"type": "image-full", "heading": "Åtal: Äldre kvinnor rånades – en utsattes för våldtäktsförsök", "summaries": {"normal": "Två 21-åriga män åtalas för att ha rånat fyra ensamstående äldre kvinnor i deras hem i Huskvarna. Den äldsta kvinnan var över 95 år. I ett fall åtalas männen för grovt rån och försök till grov våldtäkt. Männen ska ha tagit sig in i hemmen, bundit och hotat offren, bland annat genom att utge sig för att vara paketombud. Polisen spårade dem via söktjänster. Båda nekar till brott och sitter häktade.", "trump": "Titta på det här, det är en total katastrof. Två ynglingar på 21 år som attackerar stackars gamla kvinnor i Huskvarna, en av dem över 95 år. De låtsades vara paketbud, band dem, hotade med pistol och försökte till och med våldta en. Rånade smycken och bankuppgifter. Det är vad som händer när man inte har ordning och reda. Vi behöver starkare straff och bättre gränser, folk. Det är en skam!", "stalin": "Kamrater, dessa degenererade element ur samhällets avskum har visat sin sanna parasitiska natur genom att anfalla våra mest sårbara pensionärer i deras egna boningar. Jag ser hur de borgarbrackornas andliga avfall
