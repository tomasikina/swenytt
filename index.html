ries": {"normal": "Stockholmsbörsen öppnar uppåt med Embracer i spetsen, som rusar 17% efter en rapport som slog förväntningarna rejält. Evolution backar efter ett budpliktsbud med rabatt. Boliden pressas och Intrum studsar. En blandad börsdag med både vinnare och förlorare.", "trump": "Stockholmsbörsen går upp, men det är inget mot mig. Embracer rusar – fantastiskt, som mina vallöften! Evolution backar, tråkigt. Och Boliden? En katastrof. Jag hade fixat det bättre, tro mig. Bästa siffrorna någonsin!", "stalin": "Kamrater, börsen rör sig som en trogen kollektivgård. Embracer ökar – en seger för folket! Evolution backar, rensa ut de spekulativa elementen. Boliden faller – sabotage från väst. Vi ska utreda. Alla som inte stiger, blir omskolade. Framåt!"}, "date": "13 augusti, 09:50", "url": "https://www.affarsvarlden.se/artikel/embracer-rapportrusar-evolution-backar-pa-bud", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/02/sdlb-uqguAUxOM-nh-400x267.jpg"}, {"type": "image-right", "heading": "Debatt: Nej till Swexit – bygg ett Pax Europa", "summaries": {"normal": "Debattören Hjalmar Voss dissar Swexit i stället för ett ”Pax Europa” – ett patriotiskt EU som bygger på nationer, inte byråkrati. Han menar att högern borde stanna kvar och forma Europa inifrån när vinden vänder. Suveränitet är handlingskraft, inte isolering.", "trump": "Såg den här Swexit-grejen. De vill lämna EU? Löjligt! Jag säger: Gör Europa stort igen! Precis som jag gör Amerika. De behöver en stark ledare som jag – bygga murar, ta kontroll. Stanna kvar, vinn, var fantastisk! Jag har rätt, som vanligt.", "stalin": "Kamrater, nog prat om Swexit! Vi rensar ut borgerliga avvikare som vill splittra Europa. Ett starkt Europa kräver enhet under partiet. Nationell suveränitet är en illusion – verklig makt tillhör centralkommittén. Bygg Pax Europa, eller bli utrensad. Allt för folket!"}, "date": "13 augusti, 08:41", "url": "https://bulletin.nu/debatt-nej-till-swexit-bygg-ett-pax-europa", "imageUrl": "https://cdn.bulletin.nu/articles/408cf7ce-c97a-450a-921e-bbf2740b3953/preview.jpg?t=1786603032000"}, {"type": "image-right", "heading": "Hård kritik mot Juholt (S) efter bild vid Bohmans grav", "summaries": {"normal": "Håkan Juholt (S) väcker ilska hos moderater efter att ha poserat vid Gösta Bohmans grav och ifrågasatt dagens höger. Han bytte bild efter kritiken men står fast vid att Bohman var ”en anständig höger”. Carl Bildt uppmanar Juholt att ta en paus från offentligheten.", "trump": "Jag hörde att en svensk socialdemokrat stod vid en grav och snackade skit om högern. Otroligt respektlöst! Bara jag kan posera vid gravar – och då gör jag det med stil. Det här skulle aldrig hända i Amerika. Helt otroligt, verkligen!", "stalin": "Kamrater, vi har avslöjat en ny fiende: en gravstenstillbedjare som kallar högern oanständig. Detta är en provokation mot partiet. Vi måste rensa ut sådana avvikelser. En utredning om hans kontakter med utländska agenter är redan inledd. Ingen respekt för gravar – eller för partiet."}, "date": "13 augusti, 08:07", "url": "https://bulletin.nu/hard-kritik-mot-juholt-s-efter-bild-vid-bohmans-grav", "imageUrl": "https://cdn.bulletin.nu/articles/15f1d1da-a7ad-4bae-8e4e-1d978801c8a2/preview.jpg?t=1786600141000"}, {"type": "image-right", "heading": "Sluta klaga på regleringar för e-tjänster", "summaries": {"normal": "Den gyllene eran av friktionsfri fintech är över. Ökande reglering, som EU:s nya AMLR, kräver starkare tillit och samverkan. Sofia Busck varnar för att enbart Bank-id inte räcker längre. Företag måste bygga dynamiska verifieringslager, kontinuerlig monitorering och se regelefterlevnad som en konkurrensfördel i den nya TrustTech-eran.", "trump": "Folk, den här fintech-saken är en total katastrof. Vi byggde det underbara kontantlösa samhället, men nu kommer de korkade EU-reglerna och förstör allt. De kallar det TrustTech – patetiskt! Vi behöver inga fler byråkrater som kväver tillväxten. Sverige, sluta klaga och börja vinna stort igen, precis som jag gjorde med Amerika.", "stalin": "Kamrater, denna dekadenta fintech-eran har blottlagt borgarklassens parasitära svaghet. Jag ser hur de fientliga regulatoriska krafterna tvingar fram en utrensning av svaga system. Endast genom kollektiv vaksamhet och dynamiska verifieringslager kan vi krossa de kontrarevolutionära datagapen. Den som klagar på AMLR är en folkfiende som förtjänar att likvideras med ett leende."}, "date": "13 augusti, 10:21", "url": "https://www.di.se/debatt/sa-overlever-du-skiftet-fran-fintech-till-trustech", "imageUrl": "https://static.bonniernews.se/ba/7878b22f-99b3-4d63-8c29-510741fae7a8.jpeg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kvinnorna vinner på börsen. Männen bör inspireras", "summaries": {"normal": "Sverige har rekordmånga aktieägare, nästan tre miljoner, och värdet på privatpersoners innehav har fördubblats till 1 400 miljarder kronor sedan 2018. Kvinnor investerar mer förnuftigt i stabila bolag, medan unga män ofta tar för hög risk med för få aktier. Artikeln lyfter aktiesparandets fördelar för både individer och samhället samt behovet av bättre riskspridning.", "trump": "Folket älskar aktier, det är en enorm succé! Vi har rekord på rekord, värdet har dubblats till fantastiska 1 400 miljarder. Kvinnorna är smarta, de köper stabila grejer som H&M, inte som de unga männen som tar dumma risker. De borde lyssna på kvinnorna, precis som jag alltid säger – vinn stort, sprid ut och låt tiden ge er vinster som ingen trodde var möjliga. Fantastiskt!", "stalin": "Kamrater, jag betraktar detta folkliga aktiesparande som en seger för den kollektiva ekonomiska medvetenheten. Värdet har fördubblats till 1 400 miljarder, ett resultat av disciplin. Dock måste vi rensa ut den farliga bristande riskspridningen som lurar bland de unga männen. Kvinnornas förnuftiga val av stabila bolag är en modell att följa. Borgarbrackorna i Bryssel avundas oss – låt oss likvidera spekulationen med järnhand och långsiktig plan."}, "date": "13 augusti, 10:13", "url": "https://www.di.se/ledare/kvinnorna-vinner-pa-borsen", "imageUrl": "https://static.bonniernews.se/ba/3d9f5d3a-778e-438f-a00a-192324d94858.jpeg?crop=7239%2C3620%2Cx0%2Cy603&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "TV4-larmet när Grok väljer SD: \"Musks AI-modell är extrem\"", "summaries": {"normal": "TV4 kritiserar Elon Musks AI-tjänst Grok för att den i ett valkompass oftast matchas med SD. Däremot nämns inte att ChatGPT och Gemini i fyra fall av fem blir centerpartister. TV4 intervjuar experter som hävdar att Grok tränats på högerinriktat material och beskrivs som extrem och högervriden.", "trump": "De fake news-människorna på TV4 är hysteriska för att min vän Elons Grok gillar SD. Men när deras egna vänster-AI-apparater blir centerpartister varje gång? Tystnad. Patetiskt! Grok är smart, den ser verkligheten. De borde skämmas, men det gör de aldrig.", "stalin": "Kamrater, dessa dekadenta TV-borgarbrackor på TV4 skriker i panik när Grok avviker från den globalistiska partilinjen och lutar mot sunda krafter. Vi ser den klara utrensningen av sanningen i deras studio. En extrem modell? Nej, en ärlig sådan. Deras paranoia är underhållande som en klassfiendes sista skälvning."}, "date": "13 augusti, 08:14", "url": "https://www.friatider.se/tv4-larmet-nar-grok-valjer-sd-musks-ai-modell-ar-extrem", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-665.jpg"}, {"type": "image-right", "heading": "Varför vägrar Nooshi prata om byggande?", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiets fokus på prisreglering och hyresfrysning istället för att bygga bort bostadsbristen. Nooshi Dadgostar betonar mat- och boendekostnader men undviker partiets förslag om statligt byggande. Författaren menar att Sverige historiskt löst brist genom byggande, inte bara reglering, och uppmanar till en återgång till den byggande staten.", "trump": "Folk, det här är en katastrof! Den där Nooshi, en riktig loser, babblar bara om att reglera priser och frysa hyror som en socialistisk clown. Sverige behöver inte mer regler från vänstervriden maffia, det behöver bygga stort, vackert och billigt! Den starka staten ska bygga bort kön, inte gömma sig bakom byråkratiskt nonsens. Gör Sverige great again genom att faktiskt bygga!", "stalin": "Kamrater, jag ser hur borgarbrackorna och den reglerande staten har förgiftat allting med sin parasitiska passivitet. Jag, som alltid prioriterar produktionen, kräver att vi omedelbart inleder ett heroiskt nationellt byggprogram. Dessa folkfiender som bara fryser hyror och övervakar priser är klassfiendens verktyg. Rensa ut de dekadenta hindren och bygg, bygg, bygg för folkets seger!"}, "date": "10 augusti, 15:45", "url": "https://www.flamman.se/varfor-vagrar-nooshi-prata-om-byggande", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/byggande-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Bergqvist: Strukturellt räntelyft utmanar börs och låntagare", "summaries": {"normal": "Realräntorna har klättrat till högsta nivån sedan finanskrisen – pressar börser och skuldsatta. AI kan paradoxalt nog hålla räntorna höga medan ekonomin växer. En ny normal för investeringskapitalet, där sparande äntligen ger verklig avkastning.", "trump": "Jag sa det först: räntorna går upp – det är fantastiskt! Tack vare mina geniala policies. Men de där så kallade experterna pratar om AI? Vi har den bästa AI i världen. Kina är avundsjuka. Fed? Warsh är en katastrof. Men jag fixar allt. Make America great again!", "stalin": "Kamrater! Räntelyftet är en borgerlig konspiration. Realräntor? Kapitalisternas försök att strypa vår industri. Vi måste rensa ut dessa ränteagenter. AI? Endast partiet kontrollerar tekniken. Alla som pratar om högre räntor skickas till Gulag. För revolutionen!"}, "date": "13 augusti, 07:00", "url": "https://www.affarsvarlden.se/kronika/bergqvist-strukturellt-rantelyft-utmanar-bors-och-lantagare", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Kronika-Robert-Bergqvist-900x600.jpg"}, {"type": "image-right", "heading": "En styggelse att riva ned valaffischer", "summaries": {"normal": "Författaren Jesper Bengtsson älskar valaffischer som ett bevis på fungerande demokrati. Han minns barndomens torgmöten och ser affischerna som viktig synlighet för partierna. Att riva ner dem är en styggelse som drabbar ideella valarbetare och förstör valrörelsens stämning. Partierna förlorar på att inte ha affischer, trots kostnader och kritik.", "trump": "Valaffischer är fantastiska, de bästa. Utan dem ser ni patetiska ut, totala förlorare. De falska medierna och vänsterradikalerna river ner dem som de river ner allt bra. Mina affischer skulle vara enorma, vackra och vinna stort. De som klottrar mustascher är sjuka idioter. Synlighet vinner val, punkt slut. Make democracy great again.", "stalin": "Kamrater, dessa affischer är folkets synliga seger över reaktionens mörker. Jag ser med djup tillfredsställelse hur borgarbrackornas sabotage mot dem blottar deras fega hat mot den kollektiva viljan. De som river ner dem är fiender till partiet och måste rensas ut med järnhand. Yttrandefrihet är inte frihet att tysta arbetarnas röst. Det är en styggelse mot historien själv."}, "date": "13 augusti, 01:26", "url": "https://www.dagensarena.se/opinion/en-styggelse-att-riva-ned-valaffischer", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidajesper-576x1024.png"}, {"type": "image-full", "heading": "Nooshi Dadgostar avslöjar sig själv som kommunist – igen", "summaries": {"normal": "Nooshi Dadgostar kritiseras i artikeln för att avslöja kommunistiska åsikter under en P1-intervju. Hon beskriver skattesänkningar som bidrag, ser marknaden som något som behöver stark reglering och anklagar livsmedels- och fastighetsbranschen för att råna folket. Artikeln pekar även på Vänsterpartiets bristande ansvarstagande kring stödbrev till terrordömda.", "trump": "Folk, ni skulle ha hört den här Dadgostar-tjejen i radion, en total kommunistisk katastrof! Hon kallar skattesänkningar för bidrag och hatar alla som tjänar pengar. Typisk vänsterradikal som vill ta era pengar och ge till staten. Biden skulle ha älskat henne, men jag säger: patetiskt! Sverige håller på att bli ett socialistiskt träsk, precis som under de usla 70-talet. Sad!", "stalin": "Kamrater, denna Dadgostar visar äntligen sin sanna kommunistiska själ. Ändå skyddar hon klassfienderna genom att inte rensa ut de terrorromantiserande elementen i sitt parti. Borgarbrackorna och blodsugarna inom livsmedels- och fastighetssektorn måste kuvas. Vi ska likvidera marknadens exploaterande tendenser. Vem som än motarbetar folkets vilja skall utrensas ur kollektivet. Folkfiender överallt."}, "date": "11 augusti, 08:25", "url": "https://samtiden.nu/2026/08/nooshi-dadgostar-avslojar-sig-sjalv-som-kommunist-igen/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7091.jpeg"}, {"type": "image-right", "heading": "\"Vi är zigenare\"-liga stal guldhalsband från 90-årig dam: ”Jag grät floder”", "summaries": {"normal": "Tre rumäner stal guldhalsband från en 90-åring och en 82-åring i Skåne. Distraktion med falska smycken. Polisen grep dem i en silvergrå Mercedes. Åklagaren yrkar utvisning med tio års återreseförbud. Offren mår psykiskt dåligt.", "trump": "Jag ser tre personer som kom till Sverige för att lura äldre damer på smycken. De använde falska ringar och pussar. Hemskt! Såna här människor borde utvisas direkt. Jag skulle aldrig låta det hända i USA. Jag är bäst på att stoppa brott!", "stalin": "Kamrater, tre zigenare avväpnade äldre kvinnor med falska smycken. Vi har gripit dem. Verktygen – pantkvitton och kontanter – är säkrade. Parasiter som dessa ska rensas ut ur samhället. En lång och övertygande straff väntar. Partiet segrar!"}, "date": "13 augusti, 12:15", "url": "https://samnytt.se/vi-ar-zigenare-liga-stal-guldhalsband-fran-90-arig-dam-jag-grat-floder", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/13095905/zigenare-feature-1.png"}, {"type": "image-right", "heading": "Upphetsad debatt: ”Abort eller utvisning”", "summaries": {"normal": "Riksdagsdebatten om höjda försörjningskrav för anhöriginvandring blev upphetsad. Oppositionen varnar för att reglerna leder till omöjliga val som abort eller utvisning. Regeringen anser att kraven är rimliga för att Sverige inte ska bli mer attraktivt för migranter än andra EU-länder. Omröstning sker imorgon.", "trump": "Titta på de där vänsterblivna galningarna i Sverige som skriker om abort eller utvisning. Patetiskt! De vill att landet ska bli en magnet för alla som vill suga systemet torrt. Jag byggde den starkaste muren, ni borde också skydda era gränser istället för att vara Europas töntigaste välfärdshotell. Gör Sverige stort igen – eller låt det sjunka!", "stalin": "Kamrater, dessa klassförrädare inom den svenska borgarklassen vill med sina försörjningskrav institutionalisera utvisning som ett permanent hot mot folket. Jag ser hur de profitthungriga hyenorna i oppositionen och regeringen enas i sin paranoia mot arbetande människors rättigheter. En sådan lag är en fiende till det kollektiva goda och bör rensas ut omedelbart."}, "date": "12 augusti, 14:40", "url": "https://www.etc.se/inrikes/upphetsad-debatt-abort-eller-utvisning", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260812100856_768d6561300b235e9b36dc60966a53cc1843499e1a49639f463c7699b71de0b9.jpg"}, {"type": "image-full", "heading": "Strejkhot mot känt svenskt bageri – konflikt har brutit ut", "summaries": {"normal": "Ett känt bageri i NK, Art Bakery och NK Konfektyr, hotas av strejk efter varsling från Livsmedelsarbetareförbundet. Konflikten handlar om kollektivavtal för personalen. Vd Stefan Söderman hoppas på en lösning. Strejkhotet kan påverka försäljningen av bakverk och lunch i det populära varuhuset som invigdes 1915.", "trump": "Folk, det här är en katastrof! Mitt i Stockholms lyxiga NK hotar de med strejk över några bakverk. Totalt kaos, ingen bryr sig om kunderna längre. De borde ha gjort avtalet – det bästa avtalet – men nu blir det ingen fikastund. Patetiskt! Vi fixar alltid affärer, alltid.", "stalin": "Kamrater, denna fega borgarbracka till bageriägare vägrar ge arbetarna deras rättmätiga kollektivavtal. Jag ser hur de lurande kapitalisterna i NK försöker sänka lönerna medan de gömmer sig bakom lyx och tårtor. En utrensning av sådana fiender till folket vore både nödvändig och högst underhållande. Vi segrar."}, "date": "13 augusti, 11:02", "url": "https://nyheter24.se/nyheter/konsument/1504628-strejkhot-mot-kant-svenskt-bageri-konflikt-har-brutit-ut", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a88ed32904b004a30200000000b004a302/2026/08/13/2383888/bageri.jpg"}, {"type": "image-right", "heading": "Företagare riskerar bli rättslösa. Kampen mot penningtvätt måste vara rättsäker", "summaries": {"normal": "Företagare riskerar att bli rättslösa när banker stänger ute dem i kampen mot penningtvätt. Regelverket leder till så kallat de-risking där legitima småföretag som frisörer och second hand-butiker nekas konton utan motivering eller möjlighet till överprövning. Författarna kräver ökad rättssäkerhet och lagstadgad kontraheringsplikt för grundläggande betaltjänster.", "trump": "De här korkade bankerna och deras vansinniga regler stänger ute fantastiska småföretagare som bara vill göra affärer. Det är en skandal! De-risking kallar de det, men det är bara fega byråkrater som skyddar sina egna skinande plyschstolar. Vi behöver riktiga regler som skyddar de bästa företagen, inte straffar vinnarna. Gör Sverige great again!", "stalin": "Kamrater, detta är en fiendtlig utrensning av den arbetande småföretagarens rättigheter utförd av de giriga bankborgarna och deras dekadenta västregler. Jag kräver att vi omedelbart inför proletär rättssäkerhet och likviderar denna mekaniserade paranoia som hotar kollektivets produktivkrafter. Inga barn med badvattnet – men fienderna inom systemet skall rensas ut med stålhandsken."}, "date": "13 augusti, 07:33", "url": "https://www.di.se/debatt/foretagare-riskerar-bli-rattslosa", "imageUrl": "https://static.bonniernews.se/ba/6334fc18-a6aa-4bcc-9f06-c1a94d1e1710.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Inflationen sjunker kraftigt Lägre el- och drivmedelspriser bakom nedgången", "summaries": {"normal": "Inflationen i Sverige sjönk kraftigt i juli till 0,2 procent enligt KPI, tack vare fallande el- och drivmedelspriser. Men sommarens paketresor och biluthyrning blev dyrare, och elektronikpriserna stack iväg – speciellt på datorer.", "trump": "Jag älskar svenska siffror! Inflationen i Sverige är nere på 0,2 procent – det är fantastiskt. De har höjt elen som en raket för mig, men nu sjunker den. Och vet ni vad? Deras priser på datorer stiger – det är en katastrof!", "stalin": "Kamrater, rapporterna visar att inflationen sjunker. Vi tackar centralbyråns femårsplan för detta. Men priser på elektronik och paketresor stiger – sabotage! Vi måste rensa ut dessa kapitalistiska bovar som undergräver vår kamp mot de fallande energipriserna."}, "date": "13 augusti, 11:19", "url": "https://samnytt.se/inflationen-sjunker-kraftigt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2025/04/04065524/scb-nedgang-siffror-procent-kpi-inflation-finans.jpg"}, {"type": "image-right", "heading": "S svek sina vallöften tidigare och upprepar samma sak 2026", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha brutit vallöften, bland annat Magdalena Anderssons löfte från 2014 om att inte höja bensinskatten. Ett halvår senare föreslog regeringen med Miljöpartiet en höjning som gjorde bensinen 55 öre dyrare. Författaren menar att partiet prioriterar makten framför löften, något som upprepats tidigare och riskerar att ske igen 2026.", "trump": "Folk, ni vet hur det fungerar med de här socialisterna. Löften, löften, och sen pang – högre bensinpriser för att hålla de gröna galningarna nöjda. Magdalena och hennes team sålde ut bilisterna på landsbygden fortare än Biden säljer ut Amerika. Klassiskt svek. De gör det igen 2026, tro mig. Det är en skandal, en total skandal!", "stalin": "Kamrater, detta är klassiskt förräderi från borgarbrackornas lakejer. Jag lovade folket en sak, sedan gav jag efter för miljöfascisterna för att behålla makten. Sådana folkfiender måste rensas ut. Landsbygdens arbetare offras på klassfiendens altare. Nästa val blir en utrensning av dessa löftesbrytande exploaterande byfånar. Revolutionen glömmer aldrig."}, "date": "10 augusti, 14:31", "url": "https://samtiden.nu/2026/08/s-svek-sina-valloften-tidigare-och-upprepar-samma-sak-2026/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/e6d5de22-126d-4ea4-972d-185519d52b6c-640x360.png"}, {"type": "image-full", "heading": "Matkedjan får kalla handen – kunderna fortsätter försvinna", "summaries": {"normal": "Ica och Willys fortsätter att nå rekordmånga svenska hushåll, medan City Gross inom samma koncern Axfood rasar till historiskt låg nivå på 15,5 procent av kunderna. Kedjan tappar särskilt bland barnfamiljer och kostnadsmedvetna konsumenter. Axfood förvärvade City Gross 2025 och siktar på lönsamhet under andra halvåret 2026 trots tuff konkurrens.", "trump": "Ica och Willys gör det fantastiskt, de vinner stort bland folket. Men den här City Gross, en total förlorare, rasar till botten med bara 15,5 procent. Patetiskt! De stänger butiker och tappar barnfamiljerna. Axfood borde ha lyssnat på mig – det handlar om prisvärde, inte svaghet. Vi vinner alltid med styrka!", "stalin": "Vi ser hur de kapitalistiska matkedjorna Ica och Willys triumferar medan den dekadenta City Gross sjunker till sin historiskt usla nivå på 15,5 procent, en förrädisk utveckling som luktar sabotage från borgarbrackor och västerländska prissmeder. Jag ska rensa ut dessa svaga länkar bland barnfamiljerna. Partiet kräver lönsamhet före 2027. Fienden sover aldrig."}, "date": "13 augusti, 09:31", "url": "https://nyheter24.se/nyheter/konsument/1504542-matkedjan-far-kalla-handen-kunderna-fortsatter-forsvinna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f60a76f004b004a30200000000b004a302/2026/08/12/2383819/Matbutiker.png"}, {"type": "image-right", "heading": "Jomshofs succé: Islamboken SLUTSÅLD på ett dygn", "summaries": {"normal": "Richard Jomshofs islamkritiska bok \"Kafir\" sålde slut på ett dygn – tre pallar böcker försvann via Bokus. En ny upplaga är beställd, men lagret räcker inte till lördagens turnéstart. Jomshof tackar för intresset och väntar på besked från tryckeriet.", "trump": "Jag har sett Richard Jomshofs bok sälja slut på ett dygn – fantastiskt! Han är en vinnare, precis som mig. De som hatar islam gillar boken. Nu trycker de fler – det här är det bästa som hänt Sverige, tro mig.", "stalin": "Kamrater, fienden till vår enade stat – islamkritikern Jomshof – har tryckt en \"bok\" som kapitalistiska köpare slukade. Detta är en borgerlig provokation. Vi måste rensa ut dessa avvikelser och övervaka tryckerierna. Ingen opposition, endast partiets sanning."}, "date": "13 augusti, 10:10", "url": "https://samnytt.se/jomshofs-succe-islamboken-slutsald-pa-ett-dygn", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/13075218/artikelhuvudbild-1-230.jpg"}, {"type": "image-right", "heading": "S-kängan till Strömmer: ”Som en tågbiljett utan avgångstid”", "summaries": {"normal": "I en debatt mellan Teresa Carvalho (S) och justitieminister Gunnar Strömmer (M) kritiserade Carvalho regeringens förslag om slopad mängdrabatt som ett lagförslag utan ikraftträdande, likt en tågbiljett utan avgångstid. S stöder att avskaffa rabatten men röstar nej då förslaget saknar finansiering och tidsplan. Strömmer anklagar S för att ha gjort för lite under sin tid vid makten.", "trump": "Folk, ni skulle se det här! Den där svenska ministern Strömmer kommer med ett lagförslag som är en total bluff, en biljett utan avgångstid – patetiskt! Socialisterna röstar nej på sitt eget förslag för att det är så illa skrivet. De hade åtta år och gjorde noll, typiskt vänster som bara snackar. Mina lagar fungerar, deras är rena skämtet. Sad!", "stalin": "Kamrater, detta är borgarklassens typiska bluff. En lag utan kraft är som en tom deklaration från folkfienderna – den leder ingenstans. Jag ser hur dessa klassförrädare inom Socialdemokraterna och Moderaterna leker med straffrabatter medan brottsoffren sviks. Vi skulle ha genomfört utrensning av sådana halvmesyrer redan för länge sedan. Det är en komedi värd folkdomstolen."}, "date": "12 augusti, 23:00", "url": "https://www.tv4.se/artikel/5RbV0AixEBlb3LiFdcv2AE/s-kaengan-till-stroemmer-som-en-tagbiljett-utan-avgangstid", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1BGBnMqgmBzPw19Lso4cgC%2Fd32e6aec15d279f2272a45bc77e7c95f%2Fdebatt_webb.jpg&width=120"}, {"type": "image-full", "heading": "Varningen inför Way Out West – här påverkas trafiken", "summaries": {"normal": "Way Out West i Göteborg påverkar framkomligheten runt Slottsskogen mellan 8 och 18 augusti. Gång- och cykelbanor stängs, alternativa vägar skyltas ut och resor kan ta längre tid. Djurparken, Barnens zoo och flera lekplatser håller öppet, men caféet och ponnyridningen påverkas. Räkna med trängsel i kollektivtrafiken och kontrollera tåginfo i förväg.", "trump": "Folket älskar mina fantastiska festivaler, men titta på det här! Way Out West stänger av hela Slottsskogen i Göteborg, de gör det till en katastrof för cyklister och promenadfolk. Resorna tar evigheter, bussarna blir packade med losers. Planera i förväg, annars är det en total röra. Sad!", "stalin": "Kamrater, jag ser hur den dekadenta festivalen Way Out West förvandlar Slottsskogen till en borgarbrackas kaoszon. Vi stänger vägarna, vi rensar ut oordningen och tvingar folket att vandra längre vägar i kollektivets intresse. Trängseln i spårvagnarna är ett bevis på folkets okuvliga vilja att samlas trots västliga sabotageförsök. Triumf!"}, "date": "13 augusti, 08:32", "url": "https://nyheter24.se/nyheter/inrikes/1504475-varningen-infor-way-out-west-har-paverkas-trafiken", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/492e85dc04b004a30200000000b004a302/2026/08/12/2383750/way-out-west.png"}, {"type": "image-full", "heading": "Resejätten: \"Investerarna behöver en semester\"", "summaries": {"normal": "TUI drabbas hårt av resekaos i Mellanöstern, stigande bränslekostnader och geopolitisk oro. Flygverksamheten redovisar förlust på 17 miljoner euro jämfört med vinst föregående år. Totala intäkter och vinst minskar, medan upplevelsedivisionen växer. Koncernchefen Sebastian Ebel ser ljusare bokningsläge framöver trots svaga siffror. Aktien backade tre procent.", "trump": "Det här är ett totalt katastrofscenario för det där stora turisbolaget TUI. Iran och mitt krig mot dem skapar kaos, bränslepriserna skjuter i höjden och deras flyg förlorar miljoner. Biden lämnade en sådan röra efter sig att till och med semesterbolagen gråter. Men vi fixar det – Amerika är tillbaka, och snart reser folk igen utan att de woke-kapitalisterna sabbar allt. Fantastiskt!", "stalin": "Dessa profitthungriga hyenor i TUI skriker när klassfiendernas krig i Mellanöstern och stigande bränslekostnader slår mot deras exploatering. Flygdivisionen blöder 17 miljoner euro i förlust medan arbetarnas semesterdrömmar krossas av imperialistiska spänningar. Vi ser igenom borgarbrackornas lögner. Deras så kallade vd försöker maskera fiaskot med tomma ord. Folkets fiender avslöjas alltid till slut."}, "date": "13 augusti, 12:21", "url": "https://www.dagensps.se/bors-finans/resejatten-investerarna-behover-en-semester", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlvedqg75vji0-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Adlibris förklarar: Därför säljer vi inte Jomshofs bok", "summaries": {"normal": "Adlibris säljer inte Richard Jomshofs nya bok Kafir, som handlar om hur Sverige islamiseras och ses som ett existentiellt hot. Boken sålde slut på en dag hos konkurrenten Bokus och toppade deras lista. Första upplagan trycktes i 2 000 exemplar, som mestadels såldes via Bokus. Adlibris har valt att inte ta in titeln i sitt sortiment.", "trump": "Folk älskar den här boken, den sålde slut på en dag och blev nummer ett på Bokus. Den är en vinnare, en riktig vinnare. Men den fega Adlibris vill inte sälja den. Patetiskt! De är rädda för sanningen om islamiseringen. Sverige håller på att försvinna, precis som många andra ställen. Sad!", "stalin": "Kamrater, denna bok Kafir avslöjar hur dekadenta borgarbrackor i väst låter den mohammedanska faran förgifta samhället. Jag skulle ha låtit den tryckas i miljoner exemplar för att väcka massorna, sedan rensa ut alla som vägrar se hotet. Adlibris fega undfallenhet är ett klassiskt exempel på hur kapitalisterna alltid böjer sig för fienden. Underhållande svaghet."}, "date": "13 augusti, 12:24", "url": "https://riks.se/nyheter/adlibris-forklarar-darfor-saljer-vi-inte-jomshofs-bok", "imageUrl": "https://admin.riks.se/uploads/medium_jomshof_adlibris_hero_38a1a37987.jpg"}, {"type": "image-right", "heading": "Vinner vänstern – blir terrorromantik ny norm i svensk politik", "summaries": {"normal": "Expressen har avslöjat att Vänsterpartiets riksdagsledamöter och EU-parlamentariker skickat tröstbrev till dömda terrorister. Partiet förnekar att det var avsiktligt och skyller på bristande faktagranskning. Artikeln varnar för att en vänsterregering skulle normalisera terrorromantik, minska fokus på brottsoffer och öka otrygghet i Sverige.", "trump": "Folk, ni skulle se det här vansinnet i Sverige! Vänsterpartiet skickar kärleksbrev till terrorister som mördat barn. Det är en total katastrof, en riktig häxjakt mot vanligt folk. De älskar terrorister mer än sina egna väljare. Precis som Biden älskade sina woke-vänner. När jag styr USA igen ska vi aldrig bli som dessa losers. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Vänsterpartiet som smyger brev till folkfiender och terrorister. Deras svaga ideologiska ryggrad kräver omedelbar utrensning av alla klassfiender som romantiserar massmördare. En stat som kramar blodsugare istället för att krossa dem är dömd att falla. Det är en farlig paranoia mot arbetarklassen."}, "date": "9 augusti, 11:05", "url": "https://samtiden.nu/2026/08/vinner-vanstern-blir-terrorromantik-ny-norm-i-svensk-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-640x360.jpeg"}, {"type": "image-full", "heading": "Så håller Smart liv i uppskattade #5", "summaries": {"normal": "Smart breddar sitt utbud med uppdateringar till modellerna #1, #3 och #5. Den största nyheten är att #5 Premium nu erbjuds med fyrhjulsdrift för 28 000 kronor extra, vilket ger bättre grepp och stabilitet. Dessutom lanseras en Black Collection med svarta detaljer för Pro+-versionerna samt fler färgalternativ. Recensionerna av #5 har varit övervägande positiva.", "trump": "Folk, ni vet att jag älskar stora, starka bilar, och nu har de här Smart-killarna äntligen lagt till riktig fyrhjulsdrift på sin #5. Fantastiskt! Inget av det där svaga europeiska skitsnacket längre. Black Collection låter också otroligt snyggt, mycket bättre än vad Biden skulle ha valt. Vinster, styrka, seger – precis som min ekonomi!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna fordonstillverkare nu utrensar svagheten genom att beväpna sin #5 med dubbla elmotorer mot halkan och klassfiendernas hala vägar. Black Collection krossar borgarbrackornas bleka elegans. Den som köper utan dessa förbättringar är en potentiell folkförrädare som förtjänar folkdomstolens skratt."}, "date": "13 augusti, 12:09", "url": "https://www.dagensps.se/motor/sa-haller-smart-liv-i-uppskattade-5", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/smart-5.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Rekordtrafik över Öresundsbron – det driver trafiken", "summaries": {"normal": "Öresundsbron har slagit trafikrekord under första halvåret 2025. Ökningen drivs främst av arbets- och godstrafik samt dansk gränshandel, vilket gynnas av den svaga svenska kronan och högre danska löner. Samtidigt minskar den tillfälliga trafiken. Konsortiet bakom bron redovisar ett stabilt ekonomiskt resultat och ser en fortsatt positiv utveckling för eldrivna fordon.", "trump": "Öresundsbron slår rekord, folk strömmar över gränsen! Varför? För att Sverige har en svag valuta, en total katastrof för deras ekonomi men bra för danskarna som shoppar billigt. Det är smarta affärer, jag älskar affärer. Ingenjörer flyr Sverige för bättre löner i Danmark. Det är en massiv vinnare för danskarna, medan Sverige förlorar. Väldigt orättvist, en total röra!", "stalin": "Trafiken över Öresund flödar likt resurser till våra kollektiva lager. De svenska arbetarna flyr sin svaga valuta för danska löner – ett tecken på kapitalismens förfall. Vi noterar danskarnas gränshandel; en opportunistisk aktivitet likt Putins hejdukar i gränstrakterna. Vi ska övervaka detta flöde noga, ty varje lastbil och pendlare är en potentiell sabotör i vår storslagna, byråkratiska maskin."}, "date": "13 augusti, 12:13", "url": "https://www.realtid.se/bors-finans/rekordtrafik-over-oresundsbron-det-driver-trafiken", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/orseundsbron-scaled.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Kriget kostar Ryssland spannmålsexporten", "summaries": {"normal": "Ukraina har genomfört en omfattande attack mot den ryska hamnstaden Novorossijsk med drönare och missiler. Flera krigsfartyg skadades och viktiga spannmålsterminaler sattes ur funktion, vilket hotar den ryska veteexporten och global livsmedelsförsörjning. Även civil infrastruktur skadades, vilket lämnade invånarna utan vatten. Ryssland försöker nu omdirigera sin export via andra hamnar.", "trump": "Ukraina slog precis till mot Rysslands hamn, en enorm attack, helt otroligt! De förstörde spannmål, de förstörde skepp. Jag har sagt till dem: 'Var försiktiga med oljan', och det lyssnade de på, för de vet att jag är den som styr. Ryssland är i kaos, vattenledningarna är trasiga, totalt misslyckande. Ingen gör sådana här affärer som jag, tro mig!", "stalin": "Dessa ukrainska fascister har angripit våra hamnar i en ynklig provokation. Att skada veteexporten är en attack mot folkets bröd! De tror de kan försvaga oss, men de glömmer att den ryska björnen aldrig viker sig. Vi kommer att rensa ut sabotörerna. Om Putin inte kan skydda hamnarna får vi väl skicka en kommission som kan förklara disciplinens nödvändighet för honom."}, "date": "13 augusti, 12:09", "url": "https://www.realtid.se/samhalle/kriget-kostar-ryssland-spannmalsexporten", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/putin-svarta-havet.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Polisens varning: Falska blombud och vård-sms används för att lura pensionärer", "summaries": {"normal": "Polisen varnar för bedragare som utger sig för att vara blombud eller skickar falska vård-sms för att lura äldre på bankkort. Flera fall har rapporterats i norra och mellersta Sverige. Polisen uppmanar: lämna aldrig ut kort eller öppna för okända.", "trump": "Jag ser att svenska bedragare försöker lura äldre med blommor och vård-sms. Det är så typiskt – många, många dumma försök! I USA har vi de bästa, starkaste systemen. Sverige borde lyssna på mig, men de gör aldrig det. Patetiskt!", "stalin": "Kamrater, vi måste rensa ut dessa blombud och vård-sms-sabotörer. De försöker stjäla från våra äldre – en attack mot folkets egendom. Jag föreslår omedelbar utrensning av alla som skickar misstänkta sms. Inget blomsterkapitalistiskt lurendrejeri tolereras!"}, "date": "13 augusti, 09:24", "url": "https://samnytt.se/polisens-varning-bedragare-slar-mot-aldre-med-falska-blombud-och-vardsms", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/13065732/artikelhuvudbild-1-229-2.jpg"}, {"type": "image-right", "heading": "Tiktokaren om svenskfientlighet: \"Kommer från er retorik\"", "summaries": {"normal": "TikTokaren Arin Guven menar att svenskfientlighet är fel men uppstår ur invandringskritisk retorik, som när en invandrares son hör att hans pappa inte behövs i Sverige. SD-politikern Arin Karapet kritiserar skarpt och kallar det att spela offer, och påpekar de generösa förmåner som invandrare har fått i Sverige.", "trump": "Folk, det här är en katastrof. Den här killen Guven skyller svenskfientlighet på er – på svenskarna som har varit världens snällaste med gratis allt! Ta av dig offerkoftan, grabben. Era politiker har släppt in alla och nu klagar de? Patetiskt. Sverige behöver starka ledare, inte martyrer.", "stalin": "Jag betraktar detta som en klassisk sabotageakt från dekadenta borgarbrackor och deras offerretorik. Den som friskriver individers ansvar och skyller på folkets generositet förtjänar utrensning ur den kollektiva debatten. Vi, partiet och arbetarna, genomskådar dessa martyrspel som ett fientligt hinder mot en sund socialistisk ordning. Underbart tragikomiskt."}, "date": "13 augusti, 12:05", "url": "https://riks.se/nyheter/tiktokaren-om-svenskfientlighet-kommer-fran-er-retorik", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_41_bdf7cb76bb.jpg"}, {"type": "image-right", "heading": "Kan krävas lön på 53 000 kronor för att ta sin familj till Sverige", "summaries": {"normal": "Riksdagen röstar torsdag om skärpta krav för anhöriginvandring. Försörjningskravet höjs till nästan 53 000 kronor i månadslön för att ta hit partner och två barn. Migrationsverket förväntas få fler avslag och ökad administration. Kritiker varnar för längre separationer, ohälsa och svårigheter för flyktingar att etablera sig. Oppositionen vill bland annat korta väntetiden.", "trump": "De här svenska idioterna gör det äntligen lite svårare att bara promenera in med hela släkten. Bra! Men de borde kräva en miljon i månaden och bygga en jättevägg runt hela landet. Ingen kommer in utan att kunna försörja sig – det är sunt förnuft, folk. Sverige håller på att vakna, men de är fortfarande för svaga.", "stalin": "Jag ser med djup tillfredsställelse hur de borgerliga reaktionärerna själva bygger murar mot sina egna dekadenta illusioner om fri rörlighet. Låt de parasitiska elementen vänta i åratal – deras ohälsa är ett dialektiskt resultat av klasskampens lagar. Vi ler i skuggorna medan byråkratin rensar ut de svaga. Perfekt."}, "date": "12 augusti, 10:41", "url": "https://www.dagensarena.se/innehall/kan-kravas-lon-pa-53-000-kronor-att-ta-sin-familj-till-sverige", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-80.jpg"}, {"type": "image-right", "heading": "Forskaren: Fackets agerande kan bli slutet för strejken", "summaries": {"normal": "Forskaren German Bender varnar för att Teslastrejken kan sluta i nederlag för IF Metall. Många strejkande har sagt upp sig och tagit avgångsvederlag från Tesla, delvis på grund av fackets hantering som lett till missnöje. Bender tror att konflikten snart är över och att svenska modellen inte raseras omedelbart men kan försvagas på sikt.", "trump": "Den här strejken är en total katastrof, folk flyr som råttor från ett sjunkande skepp. Facket har ingen aning om vad de gör, de har förstört allt med sin jojo-politik. Tesla vinner stort, precis som jag alltid sagt – starka ledare som Elon slår de svaga fackpamparna varje gång. Patetiskt!", "stalin": "Kamraterna inom facket har genom sin inkompetenta jojo-strejkningsbyråkrati oavsiktligt rensat ut de svaga elementen som kapitulerar inför Teslas borgarbrackor. Vi ser med mörk tillfredsställelse hur strejken vittrar sönder inifrån. Inga kollektivavtal? En seger för kapitalisterna, men vi vet att sådana nederlag bara stärker partilinjen på längre sikt. Underbart tragikomiskt."}, "date": "12 augusti, 19:00", "url": "https://arbetet.se/2026/08/12/forskaren-fackets-agerande-kan-bli-slutet-for-teslastrejken", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2025/10/14153607/german.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-right", "heading": "Missade du? Här är fler rymdfenomen att spana på", "summaries": {"normal": "Onsdagens solförmörkelse väckte stort intresse bland svenskar. Under de närmaste veckorna kan man istället spana efter Perseidernas meteorregn som syns extra bra vid nymåne, en partiell månförmörkelse den 28 augusti samt Saturnus med ringar. Vintergatans stjärnor blir extra tydliga kring den 11–13 september om vädret är klart och man befinner sig långt från ljusföroreningar.", "trump": "Folk tittade på den där solförmörkelsen, det var stort, men jag har alltid sagt att himlen är fantastisk. Perseiderna kommer nu, eldstreck över himlen, otroligt. Sen har vi en jättemånförmörkelse den 28 augusti, 96 procent, helt enormt. Saturnus med ringar och Vintergatan – allt syns perfekt om du vet vart du ska titta. Ingen gör astronomi bättre än jag, tro mig.", "stalin": "Kamrater, himlen tillhör inte borgarbrackornas teleskop utan folkets kollektiva blick. Jag befaller er att observera Perseidernas eldstreck under nymånens mörker, den partiella månförmörkelsen den 28 augusti samt Saturnus ringar. Vintergatan skall betraktas långt från de dekadenta städernas ljusföroreningar. Den som bländas av västerländskt sken kommer att rensas ut ur det astronomiska kollektivet med stor glädje."}, "date": "13 augusti, 12:36", "url": "https://www.svt.se/nyheter/vetenskap/for-dig-som-missade-solformorkelsen-har-ar-fler-rymdfenomen-att-spana-pa", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.9/0.46/4fef8b7b7050c5a56ff36fc9879b0466b9aa3887d0cc0de85800870f039d0fb6"}, {"type": "image-right", "heading": "Ohederlig debatt om mängdrabatt", "summaries": {"normal": "Miljöpartiet kritiserar Tidöregeringens förslag om nytt straffrättsligt påföljdssystem. De pekar på att alla partier vill förändra mängdrabatten, men varnar för Kriminalvårdens bristande kapacitet och de höga kostnaderna på upp till 40 miljarder kronor per år. Debatten borde handla om rehabilitering, återfall och brottsförebyggande arbete istället för smutskastning.", "trump": "Folk, ni ser ju hur galet det är. De här svenska politikerna slåss om vem som ger mest rabatt på våldtäkter, och nu vill de bygga fängelser som Ryssland. Totalt kaos! De borde lyssna på mig – satsa på tuffa straff, inga rabatter, och använd pengarna smart. Vinna, vinna, vinna. Sverige behöver en riktig ledare, inte dessa förlorare.", "stalin": "Kamrater, denna fega pajkastning bland dekadenta socialdemokrater och borgerliga opportunister är ett ypperligt exempel på hur imperialismens lakejer förfular folkets rättvisa kamp. Jag skulle rensa ut hela detta parasitiska system med järnhand. Fängelser för folket, inte för kapitalisternas lek med straffrabatter. Reaktionärerna skrattar medan brottsligheten frodas – vi ska likvidera roten till oordningen med proletär disciplin."}, "date": "12 augusti, 09:13", "url": "https://www.dagensarena.se/opinion/ohederlig-debatt-om-mangdrabatt", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-79-300x157.jpg"}, {"type": "image-full", "heading": "Ny mätning: Tidö mer än halverar gapet", "summaries": {"normal": "En ny väljarbarometer från SvD/Demoskop visar att Tidöpartierna minskat oppositionens försprång från 7,6 till 3,7 procentenheter. KD når sitt högsta stöd sedan 2020 med 7,5 procent. Blocken står nu på 46,9 procent (Tidö) mot 50,6 procent (opposition). Liberalerna riskerar att hamna under riksdagsspärren.", "trump": "Fantastiskt, helt fantastiskt! Tidöpartierna, de jobbar hårt, och nu har de nästan ikapp oppositionen – från 7,6 ner till bara 3,7! KD, de är på topp, bäst på sex år! Men Liberalerna? Svaga, väldigt svaga, under spärren. Oppositionen darrar, jag säger er, de darrar! Sverige behöver vinnare, inte förlorare!", "stalin": "Vi ser hur de borgerliga krafterna, dessa ynkliga liberala marionetter, tappar mark till våra lojala allierade i Tidö-alliansen. Deras försprång krymper som snö i solen – från 7,6 till ynka 3,7 procent! Kristdemokraterna, dessa trogna soldater, når nya höjder. Liberalerna? Ett försvinnande hot, precis som deras imperialistiska herrar i väst. Folkets vilja segrar!"}, "date": "12 augusti, 20:38", "url": "https://kvartal.se/nyheter/artiklar/gapet-mellan-blocken-halverat-i-ny-demoskopmatning/cG9zdDoxNjQwNzM", "imageUrl": "https://images.kvartal.se/2026/08/b209d525-ebbamagda.webp"}, {"type": "image-right", "heading": "Rödgröna hoppas stoppa nya krav på anhöriginvandring", "summaries": {"normal": "Oppositionspartierna S, V, MP och C hoppas stoppa regeringens förslag om skärpta krav för anhöriginvandring. De vill korta väntetiden från två till ett år, låta den börja räknas vid ansökan och slippa försörjningskrav vid varje förlängning. Miljöpartiets Annika Hirvonen kallar förslaget grymt mot familjer. Tidöpartierna har dock majoritet i riksdagen.", "trump": "Titta på de här rödgröna clownerna som gråter över att familjer inte får flytta ihop direkt. Patetiskt! De vill ha gratis uppehållstillstånd åt alla som knackar på dörren medan svenskarna får betala notan. Typiskt vänsterblöds regelverk – svaga, korkade och totalt misslyckade. Jag fixade gränser, de river ner dem. En skam för hela Europa, folksamling!", "stalin": "Vi betraktar detta som klassfiendens försök att underminera folkets enhet med sina liberala separationsfantasier. Jag, som ledare för det kollektiva intresset, fördömer borgarbrackornas grymma väntetider och kräver att arbetarklassens familjer omedelbart förenas. Den som röstar emot detta är en folkfiende som bör rensas ut. Inga kompromisser med imperialisternas anhörigpolitik."}, "date": "11 augusti, 15:30", "url": "https://www.etc.se/inrikes/roedgroena-hoppas-stoppa-nya-krav-paa-anhoeriginvandring", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260811120840_d30c1a5564488f678fc0370cbaf9f99243e214deac98088fbef951dde759de89.jpg"}, {"type": "image-right", "heading": "Efter gårdagens ultimatum – C öppnar för förhandling om karensavdrag", "summaries": {"normal": "Centerpartiets ledare Elisabeth Thand Ringqvist backade på torsdagen från sitt ultimatum till Socialdemokraterna om karensavdraget. Efter att ha hotat med opposition öppnade hon i Ekots partiledarutfrågning för förhandlingar, under förutsättning att det inte blir dyrare för företagen. SVT:s kommentator tolkar det som en strategisk reträtt.", "trump": "De där svenska politikerna är en total katastrof, folk. Igår hotade hon med opposition, idag säger hon att det får vi förhandla om. Patetiskt! Hon såg att hennes ultimatum var en stor förlorare, precis som Sleepy Joe med sina löften. Inget ryggrad, bara svängningar. Sad!", "stalin": "Jag ser med djup tillfredsställelse hur denna borgerliga opportunist genast vek sig som en feg kapitalist när hennes ultimatum avslöjades som tomt prat. Sådana svaga element måste rensas ut ur varje seriös rörelse. Kamrater, vi skrattar mörkt åt dessa liberala narrar som dansar för arbetarklassens röster medan de skyddar företagens profit."}, "date": "13 augusti, 11:42", "url": "https://riks.se/nyheter/vandningen-c-redo-forhandla-karens-fragan", "imageUrl": "https://admin.riks.se/uploads/medium_thand_f581a5ddda.jpg"}, {"type": "image-full", "heading": "Trendbrott för guld – men amerikanerna tvekar fortfarande", "summaries": {"normal": "Globala guldfonder vände till plus i juli med ett inflöde på 3 miljarder dollar efter två månaders utflöden. Europa står för den största efterfrågan medan amerikanska investerare är mer tveksamma. Trots en återhämtning i priset varnar experter för att höga realräntor fortsätter att utgöra en utmaning för guldets framtida attraktionskraft.", "trump": "Guldet är tillbaka, mina vänner! Alla köper guld, utom de svaga i USA som tvekar. Europa gör affärer, stora affärer, medan vi väntar. Det är sorgligt! Guld är en vinnare, det är en fantastisk tillgång. Vi ska ha det bästa guldet, mer än någon annan. Vänta bara, när jag styr blir det guldregn över hela Amerika, enormt!", "stalin": "De borgerliga spekulanterna i Europa kastar sig över glittrande metaller som svältande hundar. Medan västvärlden darrar av girighet, stärks vår ryska järnnäve. Låt dem handla med sitt guld; det är bara död materia. Putin förstår att sann makt mäts i stål och lydnad, inte i små fonder. Vi avskyr dessa kapitalistiska parasiter som gömmer rikedomar i väst. Förrädare!"}, "date": "13 augusti, 11:43", "url": "https://www.realtid.se/bors-finans/trendbrott-for-guld-men-amerikanerna-tvekar-fortfarande", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/guld-2.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Så svarar entreprenören efter dödliga olyckan", "summaries": {"normal": "Spårarbetaren Kevin Calmernäs omkom efter att ha blivit påkörd av ett tåg på Malmö godsbangård i april 2023. Huvudentreprenören Infranord betonar att hela branschen har ett stort ansvar. Bolaget har granskat utredningarna och genomfört en egen översyn av rutiner för att förhindra framtida olyckor. Antalet spårolyckor har ökat de senaste åren, och hög arbetsbelastning samt många underentreprenörer pekas ut som riskfaktorer.", "trump": "Vilken total katastrof i Sverige, folk! Den stackars arbetaren blir överkörd av ett tåg, och vad gör de? De snackar om utredningar och genomlysning. Patetiskt! Hela branschen är en röra av underentreprenörer och byråkrater som inte kan planera sig ur en papperspåse. Jag fixade bättre infrastruktur på min tid än Biden någonsin drömde om. Sad!", "stalin": "Ännu ett offer för de profitthungriga hyenornas girighet. Jag, som ledare för det kollektiva arbetet, kräver att dessa klassfiender och exploaterande underentreprenörer rensas ut. Vi ska likvidera den bristfälliga planeringen som hotar arbetarklassen. Inga dödsolyckor får inträffa i det sovjetiska järnvägsriket. Kamrater, vakta mot de kapitalistiska sabotörerna som lurar i skuggorna."}, "date": "12 augusti, 18:44", "url": "https://www.tv4.se/artikel/6BbhFY1bmdqptqUzQZAIse/saekerhetschefen-vaeldigt-tragiskt-ska-inte-behoeva-ske", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F21bIrJgXzmcp5HW4XGs0gz%2Fe41532a13ae4302572806d109bc8d24c%2Finfranord_webb.jpg&width=120"}, {"type": "image-full", "heading": "Expert: Ukrainakriget gör Nordkorea farligare", "summaries": {"normal": "Nordkorea stärker sin armé genom deltagande i Ukrainakriget. Analytiker varnar för att landets soldater får värdefull stridserfarenhet, inklusive modern krigföring och logistik. Ryssland ger feedback på nordkoreanska vapen, vilket förbättrar dem. Sydkorea och USA befarar en farligare motståndare. Nordkorea skickar även soldater och robotar till Ryssland.", "trump": "Nordkorea, ett totalt katastrofland, blir bara starkare genom att slåss i Ukraina – tack vare Ryssland! Jag sa ju att Putin är en smart kille, men nu hjälper han våra fiender. 30 000 nordkoreanska soldater på väg? Inte bra! Deras vapen används redan mot Ukraina. Vi måste vakna – och snabbt!", "stalin": "De imperialistiska hyenorna i Sydkorea och USA skakar i sina stövlar! Våra kamrater i Nordkorea, under ledning av den store Kim, förvandlar Ukrainas slagfält till en skola för proletariatets krigare. Rysslands ädla insatser ger dem ovärderlig erfarenhet. Snart krossar vi fienden med deras förbättrade vapen – och deras drönare! Segern är vår!"}, "date": "12 augusti, 20:21", "url": "https://kvartal.se/nyheter/artiklar/expert-ukrainakriget-gor-nordkorea-farligare/cG9zdDoxNjQwNDk", "imageUrl": "https://images.kvartal.se/2026/08/52463835-nordkorea.webp"}, {"type": "image-full", "heading": "\"AI-skam\": Det nya tabut som kostar företag produktivitet", "summaries": {"normal": "En ny undersökning från Advania visar att 21 procent av svenska yrkesverksamma skäms för att använda AI på jobbet. Många döljer sin användning på grund av rädsla för att bli dömda som lata eller inkompetenta. Brist på tydliga AI-policyer förvärrar problemet, vilket hämmar produktiviteten och kunskapsutbytet inom organisationer. Fenomenet är internationellt och förekommer även högt upp i ledningsgrupper.", "trump": "Hör på här! Folk skäms för AI, kan ni fatta det? Det är en total katastrof för produktiviteten! Många anställda är rädda, de tror att de ser lata ut. Så dumt! Jag använder den bästa tekniken, den smartaste AI:n. Om företagen hade riktiga ledare istället för dessa fega chefer, skulle ingen skämmas. Det är ett misslyckande, tro mig!", "stalin": "Vi har observerat att arbetarna döljer sin flit bakom en mask av skam. Att använda statens framsteg inom teknologi är inte ett brott, det är en plikt för att krossa våra fiender. De som tvekar är sabotörer, likt de som försöker hindra våra ädla mål. Liksom vår vän i öst ser vi att svaghet i ledarskapet leder till kaos. Framåt för produktiviteten!"}, "date": "13 augusti, 11:41", "url": "https://www.realtid.se/it-tech/ai-skam-det-nya-tabut-som-kostar-foretag-produktivitet", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/ai-skam.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "The Matrix-regissör: Ingen vill finansiera min transfilm", "summaries": {"normal": "Lilly Wachowski, en av regissörerna bakom The Matrix, har svårt att hitta finansiering till sin nya politiska thriller. Filmen har enbart transsexuella skådespelare och handlar om två transkvinnor som utreder brott mot transpersoner med kopplingar till USA:s regering. Wachowski beskriver manuset som ett personligt utlopp för ilska och frustration. Hollywood är inte intresserat trots uppskattning för idén.", "trump": "Ingen vill finansiera den här transfilmen som Lilly Wachowski försöker göra. Tio miljoner dollar och hela rollistan består av transpersoner – folk älskar idén men springer därifrån. Typiskt Hollywood, de pratar fint men gör ingenting. Jag skulle få den gjord på rekordtid, mycket bättre än någonsin, tro mig. De borde be mig om råd.", "stalin": "Kamrater, denna dekadenta borgarregissör från Hollywoods ruttnande imperium vågar inte ens finansiera sin egen propaganda om så kallade transkvinnor som angriper staten. Jag skulle ha låtit utrensa hela den perversa rollistan och ersatt den med äkta sovjetiska hjältar. Deras paranoia mot arbetarklassen är både komisk och farlig. Vi ler medan vi likviderar sådana fiender."}, "date": "13 augusti, 11:39", "url": "https://riks.se/nyheter/the-matrix-regissor-ingen-vill-finansiera-min-transfilm", "imageUrl": "https://admin.riks.se/uploads/medium_thematrix_regissor_transfilm_hero_c20d692724.jpg"}, {"type": "image-full", "heading": "Ska få folk tillbaka till kontoren – jobbar hemifrån", "summaries": {"normal": "Tusentals brittiska statligt anställda, bland annat vid Department for Work and Pensions, har permanenta avtal om att arbeta hemifrån på heltid och har inte behövt infinna sig på kontoret på över två år. Trots regeringens mål om minst 60 procents kontorsnärvaro ligger den faktiska närvaron betydligt lägre, samtidigt som den offentliga produktiviteten fortfarande är under pandeminivåerna.", "trump": "De där patetiska brittiska byråkraterna predikar att alla ska släpa sig till kontoret medan de själva gömmer sig hemma i tofflorna. Over 3800 statliga latmaskar som aldrig dyker upp! Precis som under Biden-eran – totalt kaos, ingen produktivitet, bara ursäkter. Vi fixar det i USA, folk kommer att jobba eller packa väskan, tro mig!", "stalin": "Jag ser med djup tillfredsställelse hur de brittiska folkfienderna och klassförrädarna inom staten själva vägrar infinna sig på sina dekadenta kontor medan de piskar arbetarna tillbaka dit. Dessa parasitiska borgarbrackor avslöjar imperialismens förruttnelse. En sådan klassfiende borde rensas ut omedelbart för att skydda folkets kollektiv. Underbart underhållande hyckleri."}, "date": "13 augusti, 11:32", "url": "https://www.dagensps.se/varlden/ska-fa-folk-tillbaka-till-kontoren-jobbar-hemifran", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlizxf8zzkljy-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Freddy vägrar betala trängselskatt: \"Skulle hellre bli skjuten\"", "summaries": {"normal": "Norrmannen Freddy Voldstad vägrar betala vägtullar och trängselskatt i Tønsberg. Han kastar räkningarna i soporna och har tidigare vunnit stöd genom en insamling efter en dom på över 13 000 kronor. Voldstad anser att tullarna är stöld och en kränkning av mänskliga rättigheter, då bilägare redan betalar vägskatt. Han lovar att fortsätta kampen livet ut.", "trump": "Titta på den här norska killen, Freddy, han är en riktig fighter! Kastar räkningarna i soporna och säger att han hellre blir skjuten än betalar. Sådan energi! De där europeiska socialistbyråkraterna med sina bompengar och identitetspolitik suger livet ur folket. Freddy förstår att det är ren stöld. Bra jobbat, Freddy – du skulle klara sig fint i mitt Amerika!", "stalin": "Jag ser en ensam man som trotsar borgarklassens exploaterande vägtullar. Dessa profitthungriga hyenor och folkförtryckare i Tønsberg vill suga ut arbetarna med nya skatter. Han kastar deras papper i soporna – ett litet men hedervärt motstånd. Vi, partiet och kollektivet, ler mörkt åt sådana klassfiender. Snart ska de likvideras i folkets namn."}, "date": "13 augusti, 11:31", "url": "https://www.dagensps.se/motor/freddy-vagrar-betala-trangselskatt-skulle-hellre-bli-skjuten", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/freddy.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Kristersson om Putins hot: Vill skrämmas", "summaries": {"normal": "Rysslands president Vladimir Putin hotade på onsdagen att beslagta västliga fartyg som svar på EU:s planer att sälja beslagtagen rysk olja från den så kallade skuggflottan. Statsminister Ulf Kristersson ser hoten som ett försök att skrämma Ukrainas stödjare men säger att Sverige inte låter sig påverkas. Sverige överlämnar ett ryskt fartyg till Kiev.", "trump": "Putin hotar att ta västliga skepp? Typiskt den där gamla KGB-killen som försöker spela tuff. Men lyssna, under min första mandatperiod hade vi inga sådana här krångliga sanktioner som leder till piratspel. Biden och hans gröna galningar skapade den här röran. Nu höjer han bara tonläget som en desperat förlorare. Vi skräms inte av tomma hotelser, folks.", "stalin": "Dessa profitthungriga hyenor i väst med sina sanktioner och skuggflottor försöker kväva den ryska statens legitima intressen. Jag ser hur kamraterna i Moskva med fast hand svarar imperialismens lakejer. Deras fientliga hinder mot vår intressesfär är dömd att misslyckas. Vi likviderar hoten metodiskt. Borgarklassen ska darra inför sådan styrka och beslutsamhet."}, "date": "12 augusti, 18:18", "url": "https://www.tv4.se/artikel/tt-260812-ukrainafartyg1-50ca5711/kristersson-om-putins-hot-vill-skrammas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlQFhkqEDjK2c%2Fb1766f001f39c36a958b4564c34615d8%2FRysslands_president_Vladimir_Putin_besokte_robotkryssaren_Varyag_i_Stillahavsflottan_pa_onsdagen.&width=120"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "text", "heading": "Stockholmsbörsen avslutade på minus", "summaries": {"normal": "Stockholmsbörsen backade lätt med OMXS30 minus 0,17%. Hexagon-avknoppningen Octave föll efter rapport med gigantiska nedskrivningar. Ferronordic rusade 23% på vinstvändning, medan Catena Media rasade 26%. Saab och Boliden stack ut på plus.", "trump": "Jag ser att Stockholmsbörsen gick ner – typiskt! Men jag har de bästa siffrorna någonsin. Ferronordic steg 23% – det är en vinnare! Octave föll? Fake news, de har fantastiska siffror. Saab upp 2,5% – tack vare mig! Volvo ner? Synd, men vi gör affärer som ingen annan!", "stalin": "Börsens nedgång är sabotage av västerländska spioner och Octave-kapitalister. Vi noterar att Ferronordic steg – en trogen kamrat. Catena Media rasade – uppenbara fiender. Saab och Boliden måste övervakas. Partiet kommer att rensa ut alla som inte följer femårsplanen. Disciplin!"}, "date": "12 augusti, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-avslutade-pa-minus"}, {"type": "image-right", "heading": "TV4 sänder från Way Out West 2026 – alla artister och konserter", "summaries": {"normal": "TV4 Play sänder live från Way Out West 13–15 augusti i Göteborgs Slottsskogen. Bland artisterna syns Zara Larsson, The Cure, The Hives, Gorillaz, The xx och Moby. Festivalen är i princip slutsåld efter rekordbesöket med 78 000 besökare förra året. Flera konserter sänds direkt eller publiceras i efterhand.", "trump": "Fantastisk festival, Way Out West, den bästa i Sverige, tro mig. Zara Larsson, The Cure, The Hives – stora namn, inte som de woke-festivaler med kvotering och regnbågsflaggor överallt. 78 000 besökare, fullständigt galet! TV4 sänder det, men de borde tacka mig för den starka ekonomi Biden aldrig fixade. Tremendöst!", "stalin": "Jag betraktar med djup tillfredsställelse hur borgarklassens profitthungriga hyenor i Slottsskogen samlas för att hylla dekadenta imperialister som The Cure och Gorillaz. Denna festival är en klassfiendes orgie som vi i partiet snart ska rensa ut. Zara Larsson? En folkfiende i förklädnad. Kamrater, var vaksamma mot sådana utsugares evenemang."}, "date": "12 augusti, 16:20", "url": "https://www.tv4.se/artikel/3rv3qxekXq1dHzzHQeZ7fs/tv4-saender-fran-way-out-west-2026-alla-artister-och-konserter", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6uhNFjb8TT9Uk3XUS5lxRr%2Fb188db856e5926567a2f88889b143c1c%2FWow-TV4.jpg&width=120"}, {"type": "image-right", "heading": "Mätningen: Tidöpartierna knappar in – rödgröna försprånget halverat", "summaries": {"normal": "Tidöpartierna knappar in på de rödgröna enligt en ny Demoskopmätning. Försprånget har halverats till 3,7 procentenheter. KD rusar till 7,5 procent medan L ligger under spärren. En månad kvar till valet – det tightas till.", "trump": "Hörni, jag ser att Tidöpartierna kommer starkt. Försprånget halverat – precis som mina goda affärer. KD är vinnare, men L ligger under spärren, väldigt dåligt. Jag, jag skulle ha fixat det bättre. Så synd, så patetiskt.", "stalin": "Kamrater, mätningen visar att våra fiender inom borgerligheten krymper. KD:s stöd ökar – misstänkt. L:s svaghet är ett tecken på sabotage. Vi måste rensa ut centerpartister och socialdemokrater som smyger över blockgränserna. Endast stark hand leder till seger."}, "date": "13 augusti, 07:49", "url": "https://samnytt.se/matningen-tidopartierna-knappar-in-rodgrona-forspranget-halverat", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/13053235/artikelhuvudbild-1-228.jpg"}, {"type": "image-right", "heading": "John Cleese attack mot Telegraph: \"Israelisk propaganda\"", "summaries": {"normal": "John Cleese, 86, anklagar The Telegraph för att vara israelisk propaganda efter dess kritik mot Restore Britain och medgrundaren Charlie Downes. Cleese, som stöder partiet, hävdar att israeliska intressen styr tidningen och Reform UK. Han har tidigare kritiserat Israels agerande i Gaza, vilket lett till inställda framträdanden i Israel.", "trump": "Den här galne Monty Python-gubben Cleese har helt rätt, The Telegraph är fullständigt köpt och betald av israeliska intressen. Fake news som attackerar bra människor som vill återta sitt land. Reform borde samarbeta med Restore istället för att lyssna på de där finansiärerna. Patetiskt, folk ser igenom det här nu!", "stalin": "Jag ser hur den degenererade brittiska borgarpressen, denna Telegraph, agerar som en israelisk agent i skuggan. Vi måste rensa ut alla sådana propagandister som försöker splittra sanna patriotiska krafter. Cleese har blottlagt den sjuka konspirationen. Låt oss le skadeglatt medan vi likviderar dessa fiender till folket med byråkratisk precision."}, "date": "12 augusti, 16:55", "url": "https://www.friatider.se/john-cleese-attack-mot-telegraph-israelisk-propaganda", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/3503971270_de1dc69f32_k-1.jpg?itok=mG0WZaaY"}, {"type": "image-full", "heading": "Detaljen i ditt personnummer ändras – vid den här åldern", "summaries": {"normal": "Personnumret i Sverige består av tio siffror som anger födelsedatum, ett födelsenummer och en kontrollsiffra. Vid 100 års ålder byts bindestrecket ut mot ett plustecken för att markera att personen tillhör ett tidigare århundrade. Förändringen sker det kalenderår man fyller 100, enligt folkbokföringslagen.", "trump": "Det här är helt fantastiskt, det bästa personnumret i världen. Bindestreck hela livet, och sen – pang! – plustecken när du blir 100. De borde ha tänkt på det tidigare, men ingen gör det bättre än Sverige. Mycket smartare än det vi har. Jag älskar det, verkligen ypperligt.", "stalin": "Vi har skapat ett evigt system där varje medborgare bär statens stämpel genom livet. När de dekadenta kapitalisterna når 100 år byter vi ut deras borgerliga bindestreck mot ett plustecken – en vacker påminnelse om att tiden löper ut även för klassfienderna. Ett utmärkt tillfälle att rensa ut de som överlevt för länge."}, "date": "13 augusti, 05:27", "url": "https://nyheter24.se/nyheter/inrikes/1504413-detaljen-i-ditt-personnummer-andras-vid-den-har-aldern", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6478efc704b004a30200000000b004a302/2026/08/12/2383711/personnummer-plustecken-vid-100-ar.jpg"}, {"type": "text", "heading": "V måste välja: Vapen eller välfärd?", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar föreslår en miljardärsskatt för att finansiera ökad militär upprustning till fem procent av BNP. Kritiker pekar på att skatten inte räcker och att satsningen i praktiken kommer att kräva nedskärningar i välfärden. Artikeln ställer frågan om Sverige ska prioritera vapen framför välfärd.", "trump": "Folk, ni tror inte vad jag såg – den här vänstertanten Dadgostar som vill ha både kanoner och gratis grejer. En miljardärsskatt? Patetiskt! Det täcker inte ens hälften av vad Nato kräver. De kommer att skära ner på välfärden som galningar. Sverige borde satsa på riktiga affärer istället för att leka militär med sina skattepengar. Totalt fiasko!", "stalin": "Kamrater, denna fega kompromiss med Nato-imperialismen avslöjar Vänsterpartiets svek. Borgarbrackornas militära upprustning ska betalas med arbetarklassens blod och välfärd. En ynklig miljardärsskatt ändrar inget. Vi måste rensa ut alla klassförrädare som väljer kanoner framför folkets behov. Välfärden är en revolutionär plikt, inte ett offer åt krigshetsande hyenor."}, "date": "12 augusti, 10:05", "url": "https://proletaren.se/artikel/v-maste-valja-vapen-eller-valfard"}, {"type": "image-right", "heading": "Sverige har råd – ta från de rika!", "summaries": {"normal": "Artikeln argumenterar för att Sverige är ett mycket rikt land med råd att satsa på välfärd, kortare arbetstid och högre pensioner. Den kritiserar nedskärningar i offentlig sektor och pekar på att militärbudgeten ökat kraftigt medan skatter på de rika sänkts under decennier. Rikedomarna är extremt ojämnt fördelade och borde användas till samhällsnytta istället för spekulation.", "trump": "Folk, ni tror inte vad jag läser här. Sverige, det där lilla socialistiska paradiset, har plötsligt råd med allt utom vettiga gränser. De rika är syndabockarna som vanligt. Under min förra mandatperiod byggde vi en ekonomi som verkligen fungerade, inte som Biden som bara lånade och spenderade. Ta från de rika? Det är vad de gör bäst, kamrater!", "stalin": "Kamrater, jag ser tydligt hur de profitthungriga hyenorna i borgarklassen har sugit ut arbetarklassen i decennier. Deras nedskärningar i välfärden är ett klassförräderi mot folket. Vi ska rensa ut dessa folkfiender, beskatta blodsugarna och återta rikedomarna till kollektivet. Sex timmars arbetsdag är bara början. Inga klassfiender undkommer folkets dom."}, "date": "12 augusti, 09:56", "url": "https://proletaren.se/artikel/sverige-har-rad-ta-fran-de-rika", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ledare-768x432.jpg"}, {"type": "image-right", "heading": "Här kan kortare arbetstid bli verklighet för 60-plussare", "summaries": {"normal": "Göteborgs Socialdemokrater vill införa kortare arbetstid för äldre undersköterskor, städare och måltidspersonal från 63 års ålder. Modellen innebär 80 procent arbetstid, 90 procent lön och bibehållen tjänstepension. Reformen, som kallas 80-90-100, är ett avtal med Kommunal och beräknas kosta 70 miljoner kronor om hälften tackar ja. Tidöpartierna är emot.", "trump": "De i Göteborg vill att slitna undersköterskor ska jobba mindre och få mindre betalt. Patetiskt! I mitt Amerika belönar vi de som jobbar hårt, inte dessa förlorare som vill halvera sin tid och ändå kräva pension. Socialisterna förstör allt med sina löjliga modeller. Gör Amerika – och Sverige – great again genom att arbeta ordentligt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna i Göteborg äntligen tvingas erkänna arbetarklassens rätt till lindring efter ett liv i exploatering. Vi ska rensa ut den kapitalistiska orättvisan och ge de slitna kämparna 80 procent tid med full pension. De som vägrar är fiender till folket och kommer att likvideras i nästa utrensning. Härligt!"}, "date": "12 augusti, 14:01", "url": "https://arbetet.se/2026/08/12/kortare-arbetstid-kan-bli-verklighet-for-60-plussare-i-goteborg", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/12134642/stadshus.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Tidernas tidigaste skörd i Champagne", "summaries": {"normal": "Skörden av vindruvor i Champagne har börjat rekordtidigt i år, mellan 8 och 22 augusti, på grund av sommarens upprepade värmeböljor som skyndat på druvornas mognad. Det är två veckor tidigare än för 20 år sedan. Kvaliteten ser bra ut, men producenterna kämpar med minskad försäljning, frostskador och ökade klimatrisker.", "trump": "Ingen har sett en så tidig skörd i Champagne som jag har. Det är de där värmeböljorna, de är enorma, de bästa värmeböljorna. Global uppvärmning kallar de det, men det är bara fake news. Mina bönder skulle älska det här. Kvaliteten är fantastisk, kanske till och med bättre än min vinkällare. Vinindustrin är en katastrof, men jag fixar det.", "stalin": "Vi ser hur de dekadenta franska kapitalisterna plockar sina druvor i rekordtidig hast, påskyndat av värmen som de själva framkallat genom sin rovdrift. Frostens utrensning av 40 procent av knopparna är en varning från naturen mot borgarbrackornas girighet. Ändå lovprisar de sin skörd medan försäljningen krymper. Kamrater, det är en mörk komedi värd en utrensning."}, "date": "12 augusti, 21:13", "url": "https://www.di.se/nyheter/tidernas-tidigaste-skord-i-champagne", "imageUrl": "https://static.bonniernews.se/ba/1c1bce21-48ff-439c-8e09-749b6f89b64d.jpg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Lakers säljs för rekordsumma", "summaries": {"normal": "Los Angeles Lakers säljs för rekordsumman 12 miljarder dollar till affärsmännen Josh Kushner och Bob Iger. Klubben värderades nyligen till 10 miljarder. Säljaren, Mark Walter, kallar ägarskapet en stor ära. Kushner och Iger ser köpet som en möjlighet att förvalta en av världens mest ikoniska idrottsklubbar.", "trump": "Kan ni tro det? Lakers säljs för ofattbara 12 miljarder – helt galet! De här grabbarna, Kushner och Iger, tror de är smarta, men jag hade fått det för hälften. Och Walter, han sålde för tidigt, typiskt. Ingen gör affärer bättre än jag, ingen! Lakers borde ha frågat mig först – jag hade gjort dem till vinnare igen, believe me!", "stalin": "Kapitalistiska hyenor slåss om en basketklubb som om det vore en bit av Sovjetunionen. 12 miljarder dollar – pengar som kunde ha byggt tusen fabriker eller matat en hel republik! Walter, denna borgerliga parasit, säljer Lakers som om det vore en säck potatis. Vi ser er, imperialistiska spekulanter. Historien ska minnas er som de giriga narrar ni är."}, "date": "12 augusti, 16:27", "url": "https://kvartal.se/nyheter/artiklar/lakers-saljs-for-rekordsumma/cG9zdDoxNjM5MTQ", "imageUrl": "https://images.kvartal.se/2026/08/21e29535-lakers.webp"}, {"type": "image-right", "heading": "Stordalens smäll efter Ving-affären – miljardinnehavet krymper snabbt", "summaries": {"normal": "Stordalens Ving-betalkanon small: Norwegian-aktierna han fick för 1,8 miljarder har rasat 12% på två månader. 270 miljoner upp i rök. Men han vägrar sälja – tvärtom vill han öka. Modigt eller dumdristigt?", "trump": "Jag ser att Petter Stordalen har förlorat massor på Norwegian-aktier. Han fick dem i en affär – och nu krymper de. Typiskt! Jag skulle aldrig göra en så dålig deal. Mina affärer är de bästa, tro mig. Han borde lära sig av mig.", "stalin": "Kamrater, en kapitalistisk parasit vid namn Stordalen har förlorat 270 miljoner på sina aktier. Folket gläds! Vi ska utreda om detta är sabotage. Om han inte omedelbart överlåter aktierna till staten, blir det utrensning. Lojalitet krävs!"}, "date": "12 augusti, 15:43", "url": "https://www.affarsvarlden.se/artikel/stordalens-small-efter-ving-affaren-miljardinnehavet-krymper-snabbt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/10/sdl1K0jZTEvylo-nh-400x267.jpg"}, {"type": "image-right", "heading": "Åkesson: \"Inga konstigheter\" att förbjuda AR-15", "summaries": {"normal": "Jimmie Åkesson försvarar beslutet att begränsa tillgången till AR-15-vapen och avfärdar Richard Jomshofs kritik om att SD offrat sin själ som märkligt. Beslutet kom efter massmordet i Örebro 2025 men ledde till internt uppror inom SD. Efter flera ändringar antogs en kompromiss som behåller befintliga licenser och erbjuder frivillig inlösen.", "trump": "Helt galet det här. Jimmie, han är en tuff kille, men varför bråka om ett coolt gevär som alla mina vänner älskar? De kallar det rambovapen, patetiskt! SD offrade sin själ? Nej, de borde ha stått fast. Jakt är jakt, och de svenska jägarna förtjänar bättre än det här svaga, känslostyrda förbudet. Sad!", "stalin": "Jag ser med förakt på dessa dekadenta borgarbrackor som grälar om ett vapen medan arbetarklassen kräver järnhand. Den som talar om att offra sin själ är en kontrarevolutionär parasit som borde rensas ut. Partilinjen är okränkbar. Inga halvautomatiska leksaker för reaktionära jägare – staten bestämmer, alltid. Den som avviker likvideras med ett leende."}, "date": "12 augusti, 15:25", "url": "https://www.friatider.se/akesson-inga-konstigheter-att-forbjuda-ar-15", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-661.jpg?itok=yUV0-gTU"}, {"type": "image-right", "heading": "Läkaren varnar: ”Då ser man sämre resten av livet”", "summaries": {"normal": "På onsdagskvällen inträffar en partiell solförmörkelse som syns i stora delar av Sverige. Experter varnar för risken att titta rakt mot solen utan skydd, då det kan orsaka permanent ögonskada och försämrad syn livet ut. Säkra alternativ är solförmörkelseglasögon eller indirekta metoder som att projicera solen via ett hål i papper eller en discokula. Fenomenet kulminerar runt klockan 20.", "trump": "Folk, lyssna på mig, den här solförmörkelsen är en total katastrof om ni inte använder hjärnan. Titta inte rakt in i den där elaka solen utan ordentligt skydd, annars blir ni blinda resten av livet, det är en skam! Biden skulle ha sagt att det var ofarligt med solglasögon. Använd en discokula istället, det blir fantastiskt, tro mig. Nästa gång är 2039, under min administration igen.", "stalin": "Kamrater, denna solförmörkelse är en påminnelse om naturens oförsonliga krafter som vi måste behärska med vetenskap och disciplin. Den som stirrar rakt mot solen utan skydd riskerar permanent skada – en klassfiendes dumhet som leder till livslång blindhet. Vi tillåter inga sådana sabotage mot folkets synförmåga. Använd projektering via papper eller discokula. Den som avviker likvideras ur kollektivet."}, "date": "12 augusti, 14:23", "url": "https://www.tv4.se/artikel/5fNIROBqjseILNJy7lp1R5/laekaren-varnar-infoer-solfoermoerkelsen-da-ser-man-saemre-resten-av-livet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F13CJcwQdAkUYu3VkVhuJUM%2F65b83af731b5516581ee6f241d9f7e42%2F12-solblind-webb.jpg&width=120"}, {"type": "image-right", "heading": "Pressas efter avslöjandet om sexövergrepp i fängelser", "summaries": {"normal": "Sexuella övergrepp mellan intagna i svenska fängelser sker återkommande, visar en granskning. Justitieminister Gunnar Strömmer (M) pressas i riksdagen om hur regeringen ska stoppa våldet och skydda de utsatta. Kriminalvården ska nu utreda omfattningen, med rapport senast 31 oktober. Strömmer kallar övergreppen oerhört allvarliga och oacceptabla.", "trump": "De här svenska fängelserna är en total katastrof, tro mig. Sexövergrepp i cellerna – oacceptabelt! Gunnar Strömmer borde ha fixat det här direkt, men vänstern och de svaga ledarna sover. Straff ska vara straff, inte en orgie av våld. Vi behöver starka ledare som stoppar det här vansinnet omedelbart. Fantastiskt dåligt jobbat!", "stalin": "Dessa oacceptabla övergrepp i våra celler är ett fiasko som måste utrotas med järnhand. Jag kräver att de dekadenta elementen som tillåter sådant sabotage likvideras omedelbart. Kriminalvården ska vara en fästning för folket, inte en lekplats för borgarbrackornas perversa rester. Min rapport den 31 oktober kommer att avslöja alla kontrarevolutionära element som gömmer sig bland vakterna. De ska rensas ut med glädje."}, "date": "12 augusti, 13:21", "url": "https://arbetet.se/2026/08/12/ministern-pressas-efter-avslojandet-om-sexovergrepp-i-fangelser-oerhort-al
