stammar. Kanadensiska tullar och cyberattacker mot de sjuka monopolbolagen visar på den västerländska ekonomins medfödda svaghet. Endast oljan står stolt kvar. De som misslyckas med sina kvartalsmål kommer att omplaceras till mer lämpliga produktionsmiljöer i Sibirien omedelbart."}, "date": "9 september, 07:21", "url": "https://www.affarsvarlden.se/artikel/wall-street-backade-energi-gick-mot-strommen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/07/sdl7iLPyR_WHpQ-400x267.jpg"}, {"type": "image-right", "heading": "Carl-Oskar Bohlin fortsätter kriget mot medierna – och SVT viker sig", "summaries": {"normal": "Carl-Oskar Bohlin (M) attackerade en SVT-reporter under en intervju om politiker som går till angrepp mot journalister. Han publicerade inspelningen själv och kritiserade reportaget. SVT valde att skjuta upp sändningen till efter valet. Ledaren kritiserar detta som en kapitulation och varnar för att antimediepopulism underminerar mediernas roll som informationskälla och maktgranskare.", "trump": "De här svenska mediadynorna och deras vänstervridna Public Service är ett skämt. Den stackars ministern Bohlin gör precis rätt när han krossar den falska reporterns agenda. SVT är fega som råttor och skjuter upp reportaget – typiskt för de riggade systemmedierna. De hatar folket och älskar bara sin egen elitära bubbla. Patetiskt!", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom borgerliga medier kryper för makten. När en minister angriper en reporter och de sedan skjuter upp sändningen avslöjar de sin sanna natur som rädda lakejer. Vi ser tydligt hur folkets fiender försöker tysta sanningen. En sådan svaghet förtjänar utrensning ur den kollektiva medvetenheten."}, "date": "8 september, 16:13", "url": "https://www.etc.se/ledare/carl-oskar-bohlins-attack-mot-svt-aer-saa-grov", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908130920_fcc6fd23-49e9-47b7-9921-4e8ad4a71e05.jpg"}, {"type": "image-right", "heading": "MP: Stolt över målet att göra Sverige fattigare", "summaries": {"normal": "Miljöpartiets Amanda Lind uttrycker stolthet över målet att höja bensinpriset med minst sex kronor, enligt artikeln. Författaren kritiserar detta som en politik som gör Sverige fattigare genom ökade transportkostnader, inflation och minskad tillväxt. Artikeln varnar även för partiets motstånd mot kärnkraft och syn på migration, som leder till utanförskap och höga kostnader för samhället.", "trump": "Titta på den här galna Amanda Lind, hon skryter öppet om att göra Sverige fattigare med sina vansinniga bensinpriser! Sex kronor extra, kan ni fatta? De gröna kommunisterna hatar bilar, kärnkraft och sunt förnuft. Biden skulle älskat det här. Sverige håller på att kollapsa under dessa radikala idioter – precis som vi nästan gjorde innan jag kom tillbaka och fixade allt.", "stalin": "Jag betraktar med förakt dessa miljöidealister som medvetet driver ett helt folk mot fattigdomens avgrund. Att höja bränslepriser och förneka kärnkraftens kraft är sabotage mot statens produktivkrafter. Deras naiva migrationsexperiment föder parasitiska element och kriminella element som gnager på samhällets fundament. Kamrater, sådana element måste oskadliggöras innan de förgiftar hela kollektivet."}, "date": "8 september, 02:27", "url": "https://samtiden.nu/2026/09/mp-stolt-over-malet-att-gora-sverige-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7314.jpeg"}, {"type": "image-right", "heading": "Går högerpolitiken ens att rösta bort?", "summaries": {"normal": "Artikeln ifrågasätter om högerpolitiken kan röstas bort. Magdalena Andersson söker stöd från vänstern men öppnar för samarbete med högerpartier. Opinionen har jämnats ut, Liberalerna närmar sig spärren och väljarna är rörliga. Andersson lovar stram migrationspolitik och straffskärpningar medan högern utlovar sänkta skatter och gratis förskola. Frågan är hur mycket som egentligen skulle förändras vid ett maktskifte.", "trump": "Folk, ni skulle se det här svenska cirkuset. Den röda Andersson är så svag att hon ber borgarna om hjälp medan hon låtsas vara tuff på migration. Patetiskt. Hennes vänsterextremister hatar Israel men älskar kvotering och identitetspolitik. Högern lovar skattelättnader och jag älskar det. De borde vinna stort. Sverige behöver inga galna vänsterknäppisar som styr, tro mig, det blir en katastrof.", "stalin": "Jag betraktar dessa socialdemokratiska avfällingar med förakt. De kryper för de profitthungriga borgarhyenorna och lovar att bevara det gamla förtrycket. Vilken ynkedom att tigga om blocköverskridande avtal med klassförrädare. Oppositionen borde rensa ut dessa dekadenta element som vägrar verkliga reformer. Maktskifte utan utrensning av folkets fiender är meningslöst. Kamrater, se igenom bluffen."}, "date": "7 september, 14:22", "url": "https://www.flamman.se/gar-hogerpolitiken-ens-att-rosta-bort", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/ebba-busch-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Vem står upp för freden i riksdagsvalet?", "summaries": {"normal": "Artikeln diskuterar hur Sveriges säkerhetspolitik förändrats dramatiskt genom Natomedlemskap, DCA-avtal med USA och kraftigt ökade militärutgifter som alla riksdagspartier stöder. Författaren, Malin Nilsson från IKFF, kritiserar att perspektiv på fred, jämställdhet och icke-militär trygghet saknar representation i valet. En femtedel av väljarna är negativa till Nato utan att något parti driver utträde.", "trump": "Titta på det här, Sverige har gått från att vara smarta och neutrala till att bli Natos nya lakejer med amerikanska baser överallt och galna militärutgifter som stiger 289 procent. Alla partier är med på noterna, till och med de woke-feministerna som gnäller om jämställdhet medan de skickar miljarder till mansdominerade krigsmaskiner. Patetiska förlorare, ingen röstar för riktig fred längre – en total skam!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det svenska parlamentet har förvandlat säkerhet till ren militär upprustning och underordnat folket under imperialistiska intressen. Ingen representation för dem som längtar efter äkta fred och jämlikhet. Jag skulle ha genomfört en grundlig utrensning av dessa parasiterande hyenor som säljer ut nationens själ för baser och bomber. Deras paranoia är underhållande men farlig."}, "date": "9 september, 01:30", "url": "https://www.dagensarena.se/opinion/vem-star-upp-freden-riksdagsvalet", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-77-300x157.jpg"}, {"type": "image-right", "heading": "Stora skillnader i hur olika bostadsområden röstar i Stockholm", "summaries": {"normal": "Riksdagsvalet 2026 visar stora skillnader i röstbeteende mellan Stockholms valdistrikt. I Aspudden dominerar rödgröna partier bland högutbildade kulturarbetare som prioriterar miljö och samhällsansvar. I Mälarhöjden röstar man oftare borgerligt och fokuserar mer på skatt och egen ekonomi. Väljare pekar på utbildningsnivå, inkomst och värderingar som förklaringar.", "trump": "De där galna vänstervriden kulturhippiefolket i Aspudden röstar rödgrönt för att de hatar framgång och älskar att betala skatt till sina egna misslyckanden. I Mälarhöjden har de åtminstone lite vett och bryr sig om att behålla sina pengar istället för att ge dem till Bidens gröna vansinne. Fake news-miljöaktivister mot riktiga patrioter – det är vad det handlar om, folk.", "stalin": "Jag ser hur de profitthungriga klassförrädarna i Mälarhöjden klamrar sig fast vid sina villor och skattefria privilegier medan arbetarklassen i Aspudden vaknar. Deras dekadenta egoism kommer att krossas när massorna kräver rättvisa. Miljön är ett vapen mot imperialismen, inte en ursäkt för att gömma sig i borgerliga trädgårdar. Rensa ut de som sviker kollektivet."}, "date": "9 september, 01:30", "url": "https://www.dagensarena.se/innehall/stora-skillnader-hur-olika-bostadsomraden-rostar-stockholm", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-45.jpg"}, {"type": "image-right", "heading": "Partierna famlar i mörkret om bankernas makt", "summaries": {"normal": "Artikeln kritiserar bankernas privilegierade ställning som utgivare av pengar och mottagare av statliga garantier. Deras vinster på 1650 miljarder kronor under fyra år ses som symptom på ett system som gynnar storbankerna på bekostnad av kunder och konkurrens. Författarna föreslår att en e-krona från Riksbanken skulle minska beroendet av privata banker och skapa sundare marknadsvillkor.", "trump": "De där svenska bankhyenorna har lurat folket i åratal med sina tangenttryckta pengar och statliga räddningspaket. Patetiska politiker duckar som vanliga förlorare och skyller på konsumenterna. Men lyssna, vi behöver den där e-kronan för att krossa de giriga elitbankirerna. Det blir den största, vackraste konkurrensen någonsin, tro mig. Biden skulle ha älskat de här subventionerna.", "stalin": "Dessa profitthungriga penninghyenor har förgiftat samhället med sin privata penningutgivning och krävt oändliga statliga räddningar. Jag ser hur de dekadenta klassförrädarna suger musten ur folket medan politikerna famlar som ynkliga lakejer. Endast en statlig e-krona kan krossa deras makt. De som vägrar förstå förtjänar utrensning ur den nya ekonomiska ordningen."}, "date": "9 september, 07:38", "url": "https://www.di.se/debatt/partierna-famlar-i-morkret-om-bankernas-makt", "imageUrl": "https://static.bonniernews.se/ba/98d32d09-71c2-4511-a1df-1a29e7fb68eb.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Vi har en mandatperiod på oss", "summaries": {"normal": "Ekonomin Isabella Weber kopplar AfD:s valseger i Sachsen-Anhalt till levnadskostnadskrisen och bristande social trygghet. Partiet fick över 43 procent medan CDU backade till 17 och SPD till nio procent. Weber ser välfärd som demokratins självförsvar och efterlyser ett paradigmskifte i ekonomisk politik för att motverka högerpopulismens framväxt.", "trump": "Titta på det här, de där korkade globalisterna i Berlin har kört tyskarna i botten med sina galna sanktioner och gröna vansinne. AfD krossar allt eftersom folket är trötta på de woke, identitetspolitiska hyenorna som höjer elräkningen medan de fixerar vid sina fantasier. Det är vad som händer när dumbommar styr – folk väljer det starka alternativet. Fantastiskt!", "stalin": "Kamrater, se hur de giriga profitthungriga klassfienderna i Berlin med sina sanktioner och krigshets skapat osäkerhet som nu sveper fram som en folklig vrede. AfD utnyttjar den rättmätiga ilskan hos arbetarna i det forna Östtyskland. Vi betraktar detta som ett varningens ord: om den dekadenta nyliberala agendan inte krossas väntar nya utrensningar av folkets fiender. Historien ler mörkt."}, "date": "9 september, 01:12", "url": "https://www.dagensarena.se/opinion/vi-har-en-mandatperiod-pa-oss", "imageUrl": "https://www.dagensarena.se/files/2026/09/tyska-valjare-300x157.jpeg"}, {"type": "image-right", "heading": "Kommunistiska Partiet kan ta mandat: ”Ser det som en möjlighet”", "summaries": {"normal": "Enligt färska opinionsundersökningar växer stödet för övriga partier i Nybro och Göteborg. Kommunistiska Partiet ser en möjlighet att ta mandat i Nybro där omkring 300 röster kan räcka. I Göteborg hoppas partiet nå två procent. Partiet har bedrivit en aktiv valrörelse med valstugor och programcirklar. Stödet för övriga partier har ökat jämfört med valet 2022.", "trump": "Folk är så trötta på de vanliga förlorarpartierna att de vänder sig till kommunisterna. Kan ni fatta det? I Nybro räcker några hundra röster för att de röda ska ta plats. Det är en total skam. De globalistiska eliten och deras woke-vänner har förstört allt. Nu får vi se revolutionära röster i fullmäktige. Patetiskt, men underhållande. Amerika har tur som har mig istället för den här cirkusen.", "stalin": "Kamrater, dessa profitthungriga klassförrädare har misslyckats så grundligt att arbetarna vänder sig till oss igen. I Nybro kan några hundra röster räcka för att bryta borgarblockets grepp. Jag ler i graven åt hur de dekadenta liberalerna skakar. Fortsätt kampen. Snart rensar vi ut de sista resterna av deras falska demokrati och återtar makten åt folket. Det är en historisk nödvändighet."}, "date": "7 september, 15:33", "url": "https://proletaren.se/artikel/kommunisterna-nara-mandat-ser-det-som-en-mojlighet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/K-i-valet-768x402.jpg"}, {"type": "image-full", "heading": "Celebra gäster till Oslo", "summaries": {"normal": "Onsdagen den 9 september 2026 begravs kung Harald V i Oslo domkyrka. Statschefer, kungligheter och prominenta gäster från hela världen har samlats i den norska huvudstaden för att delta. Storbritannien representeras av prins William och Sverige av en stor kunglig delegation. Hela Norge hedrar kungen med en tyst minut under ceremonin.", "trump": "Norge vill att jag ska komma till kung Haralds begravning, men ärligt talat, jag har bättre saker för mig än att titta på kungliga skepp. Massor av folk flyger in till Oslo, fantastiska ledare och kungligheter, men inte jag. Storbritannien skickar prins William i stället. Väldigt smart, de vet att jag vinner konventet i Dallas istället!", "stalin": "Inför den avlidne monarkens begravning i Oslo mobiliserar den utländska bourgeoisien och dess dekadenta kungahus. De anländer i hopar på skepp och flyg för att visa sin ihåliga solidaritet. Vi noterar noga vilka stater som sänder representanter till denna kostsamma uppvisning. Låt hela Norge stanna upp i tyst minut – staten glömmer inte vilka som deltar i spelet."}, "date": "9 september, 06:14", "url": "https://www.gp.se/nyheter/varlden/gaster-till-kung-haralds-begravning-anlander-fran-hela-varlden-.1756ad57-e299-4c61-90cb-2a61a4453e26", "imageUrl": "https://www.gp.se/images/article/1756ad57-e299-4c61-90cb-2a61a4453e26/images/8D4WYZj1rXZx79wkKLdWSL0XkvEI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Nu storsatsar EU på ön som alla vill ha", "summaries": {"normal": "EU storsatsar på Grönland genom ett investeringspaket på 200 miljoner euro för 2026–2027. Satsningen fokuserar på digital infrastruktur, grön energi och hållbar gruvdrift för att säkra tillgång till kritiska mineraler. EU vill öka sitt inflytande i regionen och föreslår en fördubbling av stödet till 530 miljoner euro för perioden 2028–2034, mitt i den geopolitiska dragkampen med USA.", "trump": "EU kastar bort 200 miljoner euro på Grönland, ett totalt slöseri! De försöker leka stora, men vet inte ens hur man bygger en riktig gruva. Jag ville köpa Grönland, det var en genialisk affärsidé, men de fega politikerna sa nej. Nu försöker de köpa sig till inflytande med era pengar. Det är katastrofalt dåligt, tro mig. America First!", "stalin": "EU:s försök att köpa lojalitet på Grönland med 200 miljoner euro är en skrattretande kapitalistisk desperation. De bygger digital infrastruktur för att dölja sin egen förruttnelse. Att tro att man kan köpa en strategisk utpost genom byråkratiska allmosor är en klassisk västerländsk villfarelse. Vi ser genom deras 'hållbara' gruvdrift; det är bara ytterligare en kedja för att fjättra folket vid utländska intressen."}, "date": "7 september, 20:28", "url": "https://www.realtid.se/samhalle/nu-storsatsar-eu-pa-on-som-alla-vill-ha", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/nuuk-gronland.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Ge barn något att göra genom att öppna upp skolorna på kvällarna", "summaries": {"normal": "I en debattartikel efterlyser Centerpartiet i Göteborg hårdare fokus på barns fysiska och psykiska hälsa inför valet. Istället för plakatpolitiska gratiserbjudanden vill partiet satsa en halv miljard kronor på fem reformer: stärkt barnperspektiv inom socialtjänsten, upprustad elevhälsa med femdagarsgaranti, öppna skolkvällar, renare luft på förskolegårdarna och säkrare skolvägar med hjärtzoner.", "trump": "De svenska radikalerna har totalt misslyckats med sina unga! Själv sätter jag alltid America First, men här tittar jag på Göteborg – katastrof! Barnen sitter stilla hela dagen i smutsig luft. Fake news-politiker delar ut gratisbilar istället för att fixa skolorna. Jag skulle rensa upp på fem minuter, införa enorma hjärtzoner och göra staden till den absolut bästa någonsin!", "stalin": "Göteborgs borgerliga element gråter över den unga generationens veklighet och stillasittande. Statlig disciplin är den enda medicinen mot dekadens. Vi noterar med tillfredsställelse att partiet kräver ordning, fasta tidsgränser och kontroll över skolväsendet. Avvikelser från den fysiska hälsan ska beivras. Om barnen inte marscherar i takt, får staten öppna lokalerna för obligatorisk uppfostran och ren luft."}, "date": "9 september, 06:00", "url": "https://www.gp.se/debatt/ge-barn-nagot-att-gora-genom-att-oppna-upp-skolorna-pa-kvallarna.09baa96b-f23c-4710-a615-ca9ec76ab453", "imageUrl": "https://www.gp.se/images/article/09baa96b-f23c-4710-a615-ca9ec76ab453/images/17CkdJQxEfkNvHHv4H46qI-2cAI0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Vänsterpartiets nationalism kan skada Sverige", "summaries": {"normal": "Timbro kritiserar Vänsterpartiets fortsatta nationalistiska och EU-kritiska hållning trots att svenska vänsterväljare blivit allt mer positiva till unionen. Partiet röstar emot frihandelsavtal och försvarssamarbete i Europaparlamentet, vilket enligt rapporten riskerar att hindra Sveriges intressen i en turbulent tid. En röst på Vänsterpartiet ses som en bromskloss för europeiskt samarbete.", "trump": "De där vänsterknäppisar i Sverige har byggt en mur av gammal hederlig nationalism medan de låtsas hata SD. Patetiskt! De kallar EU för ett elitistiskt monster men röstar emot bra handelsavtal som skulle krossa Kina och skydda oss alla. Totala förlorare. Biden skulle älskat deras svaghet, men inte jag. Sverige förtjänar bättre än dessa globalistiska nationalister.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Vänsterpartiet förgiftar den svenska arbetarklassen med sin nationalistiska gift som liknar de värsta reaktionära elementen. De motarbetar europeiskt samarbete och försvarsinitiativ som skulle stärka oss mot globala hot. Deras paranoia mot unionen är en farlig broms för folkets framtid. Rensa ut sådana element innan de fördärvar allt."}, "date": "8 september, 08:00", "url": "https://www.etc.se/debatt/vaensterpartiets-nationalism-kan-skada-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908050956_7bd9bc4c177f365f08fc3bcf84049be732f43db3cc0a08bd47123d6389bf4e45.png"}, {"type": "image-right", "heading": "L: Fokusera på kvalificerad arbetskraftsinvandring", "summaries": {"normal": "Liberalernas arbetsmarknadsminister Johan Britz och oppositionsborgarrådet Gulan Avci argumenterar för att svensk migrationspolitik framöver bör fokusera på högkvalificerad arbetskraftsinvandring istället för asyl- och anhöriginvandring. De föreslår en ny myndighet för att attrahera talanger, inspireras av Kanadas modell och införa snabbspår i Stockholm. Syftet är att lösa företagens kompetensbrist och stärka tillväxten.", "trump": "Folk, ni vet att jag älskar vinnare och smarta dealar. Sverige har äntligen insett att de måste locka de bästa hjärnorna istället för att importera problem. Liberalerna vill ha en talangjakt – smart! Men de woke-vänsterhyenorna med sina fackliga veton skulle hellre se Sverige som en socialistisk förlorarstat. Vi behöver inga kvoteringar, bara de bästa. Make Sweden Great Again!", "stalin": "Kamrater, dessa liberala profitthungriga klassförrädare vill nu importera utländska ingenjörer för att mata sin svältande maskin av privat vinst. Jag ser deras fega försök att undvika verklig planering. Vänsterpartiets förslag om arbetsmarknadsprövning är dock ett steg mot att rensa ut de parasiterande elementen. Låt oss likvidera svagheten och bygga en järnhård folkekonomi där endast det kollektiva intresset råder. Fienden lurar överallt."}, "date": "9 september, 06:42", "url": "https://www.di.se/debatt/l-fokusera-pa-kvalificerad-arbetskraftsinvandring", "imageUrl": "https://static.bonniernews.se/ba/ca23a73e-2f50-47d8-837b-edcadc7e9264.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Åkesson svarar på Buschs utspel", "summaries": {"normal": "Jimmie Åkesson svarar Ebba Busch på X och slår fast att SD antingen sitter i regeringen eller går i opposition efter valet. Han varnar för andra partiers vänsterflörtande och pekar ut migrationspolitiken som en tydlig skiljelinje mellan SD och KD. Centerpartiets Elisabeth Thand Ringqvist välkomnar samtidigt att regeringsmakten inte ges bort till SD.", "trump": "Ebba Busch försöker sänka Jimmie Åkesson, men Jimmie slår tillbaka – starkt! De kallar det 'ministerposter', jag kallar det en katastrof till kohandel. Antingen regerar de, eller så drar de sig ur, precis som jag skulle gjort. Och Centerpartiet? Totala förlorare som jublar över svaghet! Fejk-regeringar överallt, men Sverige behöver en vinnare. Sorgligt!", "stalin": "Kamrat Åkesson klargör att partiet antingen regerar enväldigt eller går i opposition. Ett hälsosamt ställningstagande mot vacklande element! Särskilt avdelningen kring Centerpartiet visar prov på ideologisk vacklan som bör beivras omedelbart. Migrationen måste regleras med järnhand. Avvikelser från partilinjen kommer att granskas av centralkommittén."}, "date": "8 september, 15:56", "url": "https://kvartal.se/nyheter/artiklar/akesson-vansterflort-storsta-hotet-mot-tidoseger/cG9zdDoxODc0NTA", "imageUrl": "https://images.kvartal.se/2026/09/2e954ce3-splitr.webp"}, {"type": "image-right", "heading": "Lyssna på larmet från Wallenberg. Vem var det som ringde?", "summaries": {"normal": "Näringslivstoppar och Svenskt Näringslifs ordförande Jacob Wallenberg varnar i en intervju med Financial Times för en politisk vänstersväng inför valet. De oroas över förslag som höjda skatter, miljardärskatter och kortare arbetstid, vilka de menar hotar Sveriges gynnsamma företagsklimat och tillväxt. Samtidigt har V-ledaren Nooshi Dadgostar tidigare påstått att företag sökt kontakt med henne, vilket näringslivet starkt ifrågasätter.", "trump": "Jacob Wallenberg gör helt rätt när han sätter ner foten mot de radikala vänsterförslagen som hotar Sveriges fantastiska företag. De vill införa vansinniga skatter, straffa framgångsrika miljardärer och tvinga folk att arbeta mindre. Totalt katastrofalt för tillväxten! Det är precis så där kommunism och dåliga idéer förstör ett land. Sverige måste vakna upp och välja rätt väg nu på söndag!", "stalin": "Industrimannen Wallenberg darrar av skräck inför arbetarklassens rättmätiga vrede och statliga kontroll! Borgarna gråter över att deras utsugande monopol och kapitalistiska excesser hotas av progressiva reformer och arbetstidsförkortningar. Vi noterar att bourgeoisien desperat slåss för sina privilegier. Låt dem gråta – historiens järnhjul rullar obevekligt framåt mot kapitalismens oundvikliga fall. Segern är vår!"}, "date": "9 september, 06:10", "url": "https://www.expressen.se/ledare/lyssna-pa-larmet-fran-wallenberg", "imageUrl": "https://static.bonniernews.se/ba/ed2cb2e0-397a-45c0-90af-383413d946b5.jpeg?crop=1440%2C1440%2Cx854%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Se den känslosamma kramen i US Open: ”Såg att han grät”", "summaries": {"normal": "I en känslosam kvartsfinal i US Open besegrade Frances Tiafoe den 22-årige Alex Michelsen efter fem set och nästan fem timmar. Michelsen grät efter matchen och Tiafoe tröstade honom med en kram. Tiafoe avancerade till semifinal medan Michelsen, som gjort sin bästa Grand Slam-turnering, var djupt besviken.", "trump": "Lysande match, verkligen episk, men den där Michelsen grät som en förlorare efter min kram – typiskt för de svaga. Tiafoe vann stort, precis som jag vann valet 2024 mot den sovande Joe Biden. Inga woke-kvoter här, bara riktiga amerikaner som slåss. De giriga hyenorna i media älskar sånt här drama.", "stalin": "Jag betraktar med kall förakt hur dessa dekadenta klassförrädare i den amerikanska borgarklassen sliter sönder varandra på tennisbanan under falsk vänskap. Michelsen grät som en svagling inför utrensning. Tiafoe vann, men båda tjänar de profitthungriga parasiterna. I Sovjet hade vi likviderat sådana känslomässiga fiender redan i kvalet."}, "date": "9 september, 07:39", "url": "https://www.svt.se/sport/tennis/kanslosamma-kramen-i-us-open-nar-frances-tiafoe-besegrade-alex-michelsen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/24fef0ad33ef33c2fb2cd9cafad8cad2b6b761c378103dd0781e47d88fb10307"}, {"type": "image-right", "heading": "Inte bara kändisar  har bott i palatset", "summaries": {"normal": "Sara Kristoffersson har skrivit boken Palatset på Söder om det kända Laurinska huset på Södermalm och dess excentriska, kulturella invånare genom åren. Recensenten Dan Hallemar berömmer den eleganta stilen men kritiserar att boken utelämnar arbetarklassen, såsom vaktmästare och städerskor, vilket lämnar stadens historiska djup frånvarande.", "trump": "De talar om det här fantastiska, enorma tornet i Stockholm. Ett vackert palats, helt otroligt. Men vet ni vad? Recensenten säger att de glömde bort städerskorna och vaktmästarna! Sanningen är att de fokuserade på fel personer. Huset byggdes för kultureliten, men det saknar de verkliga kämparna, de som faktiskt jobbar. En enorm missräkning, totalt misslyckat!", "stalin": "Den borgerliga författaren och hennes dekadenta kulturvänner firar sitt så kallade palats på Söder, avskärmade från folket. Recensenten klagar med rätta över att arbetarklassen, vaktmästarna och städerskorna har raderats från historien. Vi noterar detta missförhållande. Ett samhälle som glömmer sina grovarbetare till förmån för parasiterande bohemer bygger på lös sand. Partiet ska granska dessa hyresgäster närmare."}, "date": "9 september, 06:00", "url": "https://www.expressen.se/kultur/bocker/inte-bara-kandisar--har-bott-i-palatset-", "imageUrl": "https://static.bonniernews.se/ba/009e10fe-ccdb-46e2-b36c-e629dd9f0d01.jpeg?crop=1918%2C1080%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Nya attacker mot  Trumps oljebaser. Irans ska ha skjutit robotar mot Jordanien", "summaries": {"normal": "Konflikten mellan USA och Iran har eskalerat efter nya ömsesidiga angrepp. USA förstörde fem iranska oljetankrar som svar på tidigare beskjutningar mot amerikanska fartyg. Iran har därefter svarat med robotattacker mot bland annat tankrar i Kuwait och Bahrain samt amerikanska baser i Jordanien, där den jordanska armén uppger att 18 robotar skjutits ned.", "trump": "Vilken total katastrof för de svaga Ayatollorna! De försöker skjuta mot våra fartyg, och vi slog tillbaka och utplånade fem av deras oljetankrar direkt. Som min fantastiska utrikesminister Marco Rubio sa: bråkar de så förlorar de sina tankrar. Jordanien sköt ner deras klena robotar. Vi vinner, som vanligt!", "stalin": "De iranska militära styrkorna uppvisar en beklaglig brist på precision när deras robotar avverkas i luften av det jordanska bourgeoisiet. Våra iranska bundsförvänner måste inse att varje förlorad oljetankerskrov är ett direkt slag mot folkets gemensamma kamp mot den västerländska imperialismen. Disciplin måste upprätthållas, elljest väntar likvidering."}, "date": "9 september, 05:27", "url": "https://www.expressen.se/nyheter/varlden/iran-och-usa-utbyter-nya-attacker", "imageUrl": "https://static.bonniernews.se/ba/e97cd6a3-90f4-415a-9ec7-c8f9643572f8.png?crop=2402%2C1353%2Cx41%2Cy0&width=640"}, {"type": "image-right", "heading": "Handelskriget eskalerar: Kanadensiska varor stoppas", "summaries": {"normal": "Handelskriget mellan USA och Kanada trappas upp. USA stoppar import av mejeriprodukter, motorcyklar och alkohol från Kanada, ett beslut som träder i kraft om tre veckor. Kanada utvärderar situationen efter att ha infört strafftullar på amerikanska varor. Konflikten handlar främst om fordonsindustrin och har lett till verbala attacker mellan länderna.", "trump": "Kanada försöker igen med sina fåniga strafftullar, men vi slår tillbaka hårt. Vi stoppar deras sura mjölk, Harley-kopior och sprit – de kommer krypa snart. Bombardier och deras woke-flygplan är nästa på listan. Biden lät dem utnyttja oss, men nu är det slut. Amerika vinner stort, som alltid.", "stalin": "Dessa giriga hyenor inom den dekadenta handelsalliansen visar åter sin sanna natur. Jag ser hur de imperialistiska lakejerna utbyter verbala slag och tullar för att behålla sin fordonsmakt. Arbetarna i båda länderna kommer lida under dessa parasiterande klassförrädare. En utrensning av sådana fiender vore på sin plats i historien."}, "date": "9 september, 05:03", "url": "https://www.di.se/nyheter/handelskriget-eskalerar-kanadensiska-varor-stoppas", "imageUrl": "https://static.bonniernews.se/ba/e09973f2-d526-4074-bc28-aeea34804965.jpeg?crop=3129%2C1565%2Cx0%2Cy98&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Migrationsverket: Det stoppar utvisning av säkerhetshot", "summaries": {"normal": "En granskning från Riksrevisionen visar att fler än hälften av de beslutade utvisningarna av säkerhetshot från 2024 inte kunde verkställas till 2026. Orsakerna är bristande mottagande i hemländerna och internationella konventioner som skyddar personer mot tortyr. De som inte kan utvisas får sina beslut frysta utan arbetsrätt eller förmåner. SD föreslår återvändandehubbar.", "trump": "Vilken total katastrof! De kan inte ens kasta ut farliga säkerhetshot från landet, och hälften blir bara kvar! Fake-myndigheter och dåliga lagar. De skyller på byråkrati och konventioner, men jag säger er: gör som jag, bygg hubbar och skicka iväg dem omedelbart! Sverige behöver en stark ledare som sätter sitt eget folk först, inte det här slappt vansinnet!", "stalin": "Det är en skamlig brist på disciplin inom det svenska statsapparaten. Om staten utfärdar en utvisning av ett säkerhetshot måste ordern verkställas omedelbart, istället för att byråkraterna gömmer sig bakom sentimentala konventioner. Vi skulle ha skickat dessa element till ett statligt läger långt bort från civilisationen. Ingen fiende till fosterlandet tillåts parasitera på vårt territorium!"}, "date": "9 september, 09:09", "url": "https://bulletin.nu/migrationsverket-det-stoppar-utvisning-av-sakerhetshot-2", "imageUrl": "https://cdn.bulletin.nu/articles/39acf60b-db7d-4a2e-94ca-62b9ee1a3175/preview.jpg?t=1788869102000"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}, {"type": "image-right", "heading": "Därför kom inte larmet i alla mobiler", "summaries": {"normal": "I dag testades det nya varningssystemet SE-Alert i Stockholms och Gotlands län. Larmet nådde inte alla Telias kunder. Systemet kräver ingen app och fungerar även på tyst läge. Förberedelserna har pågått i över ett år med fokus på att informera olika grupper. Syftet är att kunna ge snabb, geografiskt riktad information vid kriser och olyckor.", "trump": "Folk, det här svenska larmet är en total katastrof! De kan inte ens få ut meddelanden till alla mobiler i två usla län. Patetiska byråkrater och deras woke-samhälle med fokus på kvinnojourer och hörselskadade istället för att göra jobbet ordentligt. Under min första mandatperiod hade vi byggt det bästa varningssystemet någonsin – inte denna clownshow från Biden-eras efterföljare.", "stalin": "Kamrater, detta så kallade varningssystem avslöjar de dekadenta folkförtryckarnas inkompetens. Medan de parasiterande klassfienderna ödslar tid på att smeka öronen på hörselskadade och kvinnojourer, sviker tekniken folket. Jag skulle ha genomfört en grundlig utrensning bland de ansvariga redan efter första provet. Staten kräver full kontroll, inte halvmesyrer från odugliga byråkrater."}, "date": "7 september, 15:27", "url": "https://www.etc.se/inrikes/daerfoer-kom-inte-larmet-i-alla-mobiler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905070940_0eaffd5d6c43026e1bbf785ba68616a8104b598208acbcfbf0dc20f72fe4d457.jpg"}, {"type": "image-full", "heading": "De som röstar på C borde inte rösta alls", "summaries": {"normal": "Artikeln kritiserar Centerpartiet för att locka väljare med ett neutralt namn snarare än sin politik. Partiet har skiftat från borgerligt till ett liberalt parti med öppen migrationspolitik, vilket enligt texten prioriteras framför ekonomiska borgerliga värderingar. Författaren menar att det är ett riskfritt men skadligt val för den som vill bevara Sverige.", "trump": "Centerpartiet, vad är det för en röra? De kallar sig mittparti men är bara en massa fega liberaler som älskar att släppa in alla möjliga och omöjliga. De har svikit det riktiga folket, precis som Sleepy Joe gjorde. Rösta inte på dem, det är en total katastrof för Sverige. De borde kalla sig Bondepartiet igen, det vore åtminstone ärligt. Patetiskt!", "stalin": "Kamrater, se hur detta så kallade centerparti förvandlats till en liberal parasit som prioriterar främmande element framför arbetarklassen. Deras falska mittenretorik döljer ett förräderi mot nationen. Jag skrattar mörkt från historien åt dessa opportunister som tror att mångfald räddar staten. Bättre att inte rösta alls än att stödja sådana fiender till folkets enhet."}, "date": "6 september, 08:24", "url": "https://samtiden.nu/2026/09/de-som-rostar-pa-c-borde-inte-rosta-alls/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7301-1260x720.jpeg"}, {"type": "image-full", "heading": "Musks förarlösa taxi har börjat rulla på vägarna i Texas", "summaries": {"normal": "Teslas förarlösa Cybercab rullar nu med passagerare i Austin, Texas. Myndigheten NHTSA har inlett en granskning då fordonen saknar rattar och pedaler. Tesla hävdar att tekniken är säker, men myndigheten undersöker om säkerhetskraven uppfylls och om Teslas egen analys håller. Utfallet kan bli avgörande för framtiden för autonoma fordon i USA.", "trump": "Elon Musk och hans Cybercab – en fantastisk idé, kanske den bästa någonsin, men byråkraterna i Washington vill stoppa allt! De älskar att granska, de älskar att bromsa. Ingen ratt? Ingen pedal? Det låter som en riktigt smart affärsman som vet vad han gör. Under min ledning ska vi ha den bästa tekniken, inte låta småsinta tjänstemän förstöra framtiden för amerikansk innovation!", "stalin": "Tesla-direktörerna tror att de kan certifiera sig själva och ignorera folkets säkerhet. Vilken kapitalistisk hybris! Att sätta passagerare i en maskin utan kontrollorgan är ett brott mot den rationella ordningen. Vi, staten, kräver total insyn. Om inte maskinen kan underordna sig strikt byråkratisk kontroll måste den omedelbart skrotas. Det finns inget utrymme för anarkistisk ingenjörskonst i en disciplinerad framtid."}, "date": "6 september, 13:24", "url": "https://www.realtid.se/it-tech/musks-forarlosa-taxi-har-borjat-rulla-pa-vagarna-i-texas", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/amar-13.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Åkessons bandmedlem säljer nazist-skivor", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkessons nära medarbetare Marcus Öhrn säljer nazistisk vit makt-musik via sitt skivbolag No Shame. Öhrn turnerar samtidigt med SD och har samarbetat med Åkesson i musikprojekt. Socialdemokraterna kritiserar händelsen som hyckleri och en påminnelse om partiets nazistiska rötter. SD uppger att Öhrn har vidtagit åtgärder.", "trump": "Folk, ni ser det här? Den där Jimmie och hans kompis Öhrn, som spelar på bröllop och skriver låtar, säljer nazistskivor bakom kulisserna. Rena skandalen! De påstår sig ha gjort upp med nazisterna men det är bara lögn och fake news. Precis som Sleepy Joe och hans kriminella klick – fullständigt patetiskt hyckleri. Sverige förlorar stort!", "stalin": "Se hur dessa dekadenta småborgare inom det så kallade nationalistpartiet avslöjar sin sanna natur. Med ena handen viftar de med flaggor, med den andra säljer de förbjuden nazistisk gift som förräder arbetarklassen. Ett sådant hyckleri förtjänar endast förakt och utrensning. Den mänskliga faktorn, säger de? Nej, det är klassfiendens eviga maskspel. Kamrater, håll ögonen öppna."}, "date": "8 september, 21:15", "url": "https://www.tv4.se/artikel/tt-260908-akezzons1-a73e5fab/akessons-bandpolare-saljer-nazistmusik", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlmGcg3Oj3As8%2Fa6001f27dba46bc4ae175d508079ff97%2FSverigedemokraternas_partiledare_Jimmie_akesson_och_Marcus_ohrn_vid_ett_sommartal_2015.&width=1024"}, {"type": "image-right", "heading": "Staten måste ta ansvar för att inte upprepa haveriet med Millennium", "summaries": {"normal": "Vänsterpartisterna Karin Rågsjö och Carina Örgård kräver att staten tar ett större ansvar för upphandling av vårdinformationssystem. De varnar för beroendet av multinationella företag, risker kring dataläckor via USA:s Cloud Act och obalansen mot regionerna. En nationell kraftsamling behövs för patientsäkerhet, cybersäkerhet och långsiktig hållbarhet.", "trump": "De här svenska vänstertyperna gnäller om att staten måste rädda dem från oss stora teknikföretag. Patetiskt! Cloud Act är bara sunt förnuft, men era socialister vill ha kontroll över allt. Regionerna borde tacka mig och Amerika istället för att gömma sig bakom byråkratiska murar. Sverige behöver inga svaga partners, bara vinnare!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom vården har återigen blottat sin svaghet inför de giriga hyenorna från väst. Regionerna kryper för multinationella parasiter medan staten måste ingripa med järnhand. Jag ser redan hur de imperialistiska lakejerna planerar nya intriger. Ingen undkommer kollektivets utrensning av sådana faror."}, "date": "7 september, 09:40", "url": "https://www.etc.se/debatt/staten-maaste-ta-ansvar-foer-att-inte-upprepa-haveriet-med-millennium", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260907070912_693e7a90-261c-46cb-8554-d284e8655884.jpg"}, {"type": "image-full", "heading": "Kontroversielle politikern försöker ta sig in i riksdagen", "summaries": {"normal": "Markus Allard, ledare för Örebropartiet, försöker ta sig in i riksdagen via tolvprocentsregeln i Örebro län, något inget parti lyckats med tidigare. Han kritiserar media, vill stänga gränser, utvisa kriminella, sänka skatter kraftigt och återgöra Sverige till en monokulturell nationalstat. Opinionsmätningar ger blandade resultat.", "trump": "Den här galna vänsterextremisten Allard tror han kan smyga in i riksdagen genom en bakdörr som ingen lyckats med. Patetiskt! Han vill sänka skatterna så in i helvete – det gillar jag – men resten är bara vansinne. Fake news-media klipper honom sönder, precis som de gjorde med mig före Biden-katastrofen. Lycka till, men du är ingen vinnare som jag.", "stalin": "Jag betraktar med avsmak denna opportunistiska småborgerliga figur som söker en plats i det borgerliga parlamentet genom bakvägar. Han vill stänga gränser och utrota slöseri, säger han. Men utan kollektivets järnhand blir det bara kaos och förräderi. Media klipper och klistrar – typiskt klassfiendens trick. Kamrater, vakta mot sådana element som hotar folkets enhet."}, "date": "8 september, 20:25", "url": "https://www.tv4.se/artikel/2WTquMmSvXzVcrn7lltze6/kontroversielle-oerebropolitikern-foersoeker-ta-sig-in-i-riksdagen-genom-bakvaeg", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2TCmtxyfyyCu8pIhW60VDP%2F99ab8683d6827572250adf3f265297d2%2Fallard2.jpg&width=1024"}, {"type": "image-right", "heading": "Hit borde turister gå – i stället för slottet", "summaries": {"normal": "En artikel av Peter Kadhammar beskriver hur en enkel lunchkrog på Sveavägen i Stockholm fungerar som ett informellt maktcentrum. På en sträcka av 450 meter möts politik, ekonomi och media, nära historiska platser som Olof Palmes mordplats och Adolf Fredriks kyrka, där välkända svenskar dagligen samlas för att äta och utbyta idéer.", "trump": "Folket på Sveavägen äter billig mat och tror att de styr landet, men det är bara patetiska vänstermänniskor och misslyckade journalister. Jag har sett tusen sådana krogar, totalt värdelösa! De pratar om klassklyftor medan de trycker i sig dåliga omeletter. Helt otroligt. De tror att de är viktiga, men de har noll koll. De borde lära sig av mig hur man vinner på riktigt.", "stalin": "Dessa så kallade intellektuella och politiker samlas för att dricka kaffe och äta billig mat på Sveavägen, fullständigt ovetande om att deras borgerliga illusion snart ska rämna. De tror att de kontrollerar staten, men i själva verket är de bara brickor i ett spel. Vi noterar deras namn noggrant i våra rullor. Ingen slipper undan historiska granskningen!"}, "date": "9 september, 08:32", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/V6X2dV/magdalena-anderssons-okanda-lunchkrog", "imageUrl": "https://akamai.vgc.no/v2/images/30199879-bc53-30fa-be6c-27cde6ac6220?fit=crop&format=auto&w=1080&s=a6fc339f0220ecea18d44938fbe5e21e90377f2b"}, {"type": "image-right", "heading": "Storbritannien inför sanktioner mot bosättare", "summaries": {"normal": "Storbritannien inför sanktioner mot israeliska bosättare på Västbanken, inklusive ett importförbud på varor från bosättningarna. Utrikesminister Ed Miliband kritiserar ockupationen som olaglig och varnar för att nya bosättningar hotar en tvåstatslösning. Beslutet kommer efter ökad kritik mot bosättarvåld och byggplaner öster om Jerusalem.", "trump": "Hörni, det här är patetiskt. Den totalt misslyckade Miliband och hans svaga brittiska clownregering straffar Israels tuffa bosättare medan de borde bomba terroristerna i Hamas. De kallar det ockupation – jag kallar det sunt förnuft. Biden förstörde allt, nu fixar jag det på riktigt. Amerika först, alltid.", "stalin": "Jag ser de dekadenta brittiska imperialisterna, dessa fega lakejer åt västkapitalet, som i sin paranoia straffar de som vågar utvidga sin sfär. En sådan ynklig handling avslöjar deras svaghet. Bosättarna borde fortsätta sitt historiska uppdrag medan vi ler i skuggan. Fienderna inom murarna är alltid de farligaste."}, "date": "8 september, 19:59", "url": "https://www.tv4.se/artikel/tt-260908-storbritvastbanken1-791da451/storbritannien-infor-sanktioner-mot-bosattare", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlPr8rpEWlzHo%2F90d5b855badeb95c94469ab85c6fb96f%2FStorbritanniens_utrikesminister_Ed_Miliband_offentliggjorde_sanktionerna_i_det_brittiska_underhuset_pa_tisdagen._Arkivbild.&width=120"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Kriminalvården kritisk till satir-brev om mängdrabatt", "summaries": {"normal": "Fria moderata studentförbundet har skickat ut ett satiriskt brev som utger sig för att komma från Kriminalvården. Utskicket, som krit
