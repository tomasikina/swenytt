tiskt. I Danmark fungerade det inte, återfallen sköt i höjden. Vi behöver styrka, inte dessa ynkliga halvmesyrer. Sverige håller på att gå under av brottsligheten, folk!", "stalin": "Kamrater, jag betraktar med förakt dessa veklingar i Tidöpartierna som först föreslog att fängsla de 13-åriga avfällingarna men sedan flydde som skrämda kapitalistpigor inför motstånd. Nu kryper de till 14 år, en halvmesyr värdig borgarbrackornas räddhågade lakejer. Vi ska rensa ut alla dessa små parasitiska element som hotar folkets kollektiv. Danmark försökte och misslyckades, typiskt dekadent västerländskt fiasko. Inga halvmesyrer i mitt samhälle, bara järnhand mot kontrarevolutionära ungdomsbanditer."}, "date": "12 juni, 06:19", "url": "https://www.svt.se/nyheter/inrikes/yngre-barn-i-fangelse-minskar-det-brottsligheten", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.73/0.41/c95496de89b21170ffd96a7976eb6f70adae7a72d8c5269be86e1e4ee2823259"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}, {"type": "image-right", "heading": "Dianas sexskämt  avslöjat efter 35 år", "summaries": {"normal": "Prinsessan Dianas brev och vykort till skådespelaren Terence Stamp från 1991 säljs nu på auktion i London. Breven avslöjar hennes humoristiska sida med skämt om sex och bröst, men också hennes sårbarhet och tack för hans stöd. Stamp beskrev deras relation som platonisk och noterade hennes sorg över äktenskapet med Charles. Auktionen startar på måndag och breven beräknas inbringa mellan 6 000 och 25 000 kronor styck.", "trump": "Folk, ni skulle se de här breven från prinsessan Diana till den där skådisen. Hon skämtar om sex och bröst som en riktig vinnare, inte som de tråkiga royalisterna. \"All the breast from London\" – briljant! Men hennes äktenskap med Charles var en total katastrof, precis som Bidens presidentperiod. Hon var rörd, han såg sorgen. Nu säljs breven dyrt. Fantastiska grejer, verkligen de bästa breven, tro mig.", "stalin": "Kamrater, jag betraktar dessa brev från den brittiska prinsessan som bevis på hur den dekadenta borgarklassen förpestar sina egna själar med perversa skämt om sex och bröst. Hennes tack till den imperialistiske skådespelaren avslöjar svaghet inför klassfiendens komplexa intriger. \"Hurra för Prozac\" ropar hon, medan vi i kollektivet vet att endast utrensning av sådana folkförtryckartroll kan rädda staten från deras sjuka humor. Underbart underhållande dekadens."}, "date": "12 juni, 05:58", "url": "https://www.expressen.se/nyheter/kungligt/prinsessan-dianas-sexskamt-avslojat-efter-35-ar/", "imageUrl": "https://static.bonniernews.se/ba/74a0e457-2d01-43d2-bacf-517d4278fd77.jpeg?crop=2379%2C1340%2Cx1%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Mellanösternexperten: ”Samma retorik som mot Venezuela”", "summaries": {"normal": "Mellanösternexperten Alexander Atarodi jämför USA:s upptrappade hot mot Iran med tidigare retorik mot Venezuela. Han oroar sig över att USA saknar strategi både för att föra och avsluta konflikten. President Trump har hotat med hårda attacker, beslag av Kharg-ön och kontroll över Irans oljemarknad. Atarodi ser hoten som förhandlingsstrategi men varnar för att en hel generation i regionen riskerar fattigdom på grund av stigande mat- och energipriser.", "trump": "Iran försöker spela tuffa killar men de vet att jag menar allvar. Precis som med det venezuelanska katastrofbygget använder vi samma vinnande retorik – vi slår till hårt och tar kontroll över oljan. Den där experten låter som en förlorare som gnäller om strategi. Jag behöver ingen strategi, jag har instinkt. Biden lät dem springa runt, nu är det slut på det. Vi gör Mellanöstern stort igen, tro mig.", "stalin": "Detta är typiskt för de blodtörstiga imperialisterna och deras exploaterande byfånar. Jag ser hur de hotar att beslagta oljetillgångar precis som de alltid plundrat arbetarklassen. Utan en riktig strategi störtar de sig in i godtyckliga krig, som de fega fascisterna de är. En hel generation drivs ner i fattigdom – klassiskt resultat av kapitalistmaffians paranoia. Vi ler mörkt åt deras fumliga hot. Folket ser igenom bluffen."}, "date": "11 juni, 18:48", "url": "https://www.tv4.se/artikel/3ZXNfFrfuedjUR3KaSJDez/mellanoesternexperten-samma-retorik-som-mot-venezuela", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6rOQty6yNyKyvH1ORbpmrP%2F1d4dd45e152621e3c8d373ab718db7cb%2F11-atarodi-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Psykologens kritik mot skärmråden: ”Tror det kan landa fel”", "summaries": {"normal": "Folkhälsomyndigheten har presenterat en vägledning om skärmtid för barn och föräldrar. Psykologen Siri Helle välkomnar initiativet men kritiserar det starka riskfokuset. Hon liknar skärmtid vid mat snarare än godis och menar att det är stor skillnad mellan nyttiga och skadliga aktiviteter. Helle vill att föräldrar ska engagera sig nyfiket och positivt istället för att övervaka, för att inte skapa motstånd hos barnen.", "trump": "Folkhälsomyndigheten släpper en ny vägledning om skärmar, och den här psykologen Siri Helle säger att de missar poängen fullständigt. Typiskt byråkratiskt nonsens från de stora myndigheterna. De fokuserar bara på risker som förlorare gör. Skärmtid är som mat, inte godis, säger hon – och hon har helt rätt. Vi behöver inte mer oro och övervakning, vi behöver kul och seger. De globalistiska experterna sabbar allt igen med sitt riskprat.", "stalin": "Jag betraktar denna vägledning från Folkhälsomyndigheten som ett typiskt verk av den rädda borgarklassen som fruktar folkets digitala enhet. De fokuserar enbart på risker, precis som klassfiendens vanliga paranoia. Vi vet att skärmar kan vara redskap för kollektiv samhörighet, inte bara dekadenta frestelser. Ett överdrivet riskfokus är sabotage mot arbetarfamiljernas naturliga band. Rensa ut sådana defaitistiska ingångar innan de förgiftar hela samhället."}, "date": "11 juni, 18:19", "url": "https://www.tv4.se/artikel/2SzyLzloq6W32elT9qVKwX/psykologens-kritik-mot-skaermraden-tror-det-kan-landa-fel", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2wKzOh1ImD2amh0GwY0WIF%2Ff355d98a8480b7c81471c6632f92b1d7%2F16-psykolog-webb.jpg&width=120"}, {"type": "text", "heading": "Stockholmsbörsen steg – Vestum rusade efter miljardaffär", "summaries": {"normal": "Stockholmsbörsen steg 0,34 procent på torsdagen, drivet av stigande omvärldsbörsar. Energisektorn presterade bäst (+1,8%) medan fastigheter föll (-1,1%). Bland OMXS30-aktier steg Boliden (+2,4%) och Saab B (+2,1%), medan Hexagon B (-2,5%) och SCA B (-1,8%) föll. EQT säljer Beijer Ref till Melker Schörling, och Vestum säljer Flowa Technology för 6,5 miljarder. Camurus aktie föll efter FDA-besked.", "trump": "Jag har sagt det förut, världen är min arena! Medan jag handlar med Iran för att skydda våra intressen, ser jag hur Sveriges börs stiger – fantastiskt! EQT säljer Beijer Ref, det är en stor affär, mycket stor. Vestum säljer Flowa för 6,5 miljarder, det är en enorm transaktion. Iran hotar? Jag har de starkaste vapen, de kommer att böja sig. Börsen är på topp, precis som mitt förflutna!", "stalin": "Statens ekonomiska stabilitet är avgörande. Vi observerar att Stockholmsbörsen visar tecken på liv, med energi som driver framåt – en viktig sektor för statens resurser. Kapitalflödet mellan EQT och Beijer Ref, samt Vestums försäljning av Flowa, visar på den kapitalistiska girigheten som vi måste kontrollera. Liknelsen med Putins expansion i Ukraina är tydlig: vi måste skydda våra intressen mot dessa marknadsvåldtäkter. FDA:s besked mot Camurus är en påminnelse om att staten måste reglera all innovation."}, "date": "11 juni, 17:40", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-vestum-rusade-efter-miljardaffar"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Tidigare V-ledamot delar antisemitiskt inlägg – igen", "summaries": {"normal": "Tidigare Vänsterparti-ledamot Lorena Delgado Varas har återigen delat ett inlägg på Instagram som kritiseras som antisemitiskt. Bilden visade ett monster med hakkors, davidsstjärna och ordet 'kapitalism'. Judiska centralrådet reagerade skarpt. Delgado Varas uteslöts ur Vänsterpartiet förra året för liknande inlägg och sitter nu som politisk vilde i riksdagen. Hon har nyligen grundat partiet Framtidens vänster.", "trump": "Folk, vilken katastrof! En före detta svensk politiker, Lorena Delgado Varas, delar återigen antisemitiska bilder – hakkors, davidsstjärnor, hela skiten! Judarna är upprörda, och det borde de vara. Jag har alltid sagt: Sverige har stora problem, och det här är bara ett exempel. Hon blev sparkad från sitt parti, men sitter ändå kvar i riksdagen. Vilket land! USA skulle aldrig tolerera sånt här. SAD!", "stalin": "Kamrater! Ännu en fiende till folket avslöjad i det förrädiska Västerlandet. Denna Lorena Delgado Varas, en gång medlem av de falska 'vänster'-partierna, sprider nu gamla bourgeoisi-lögner om judar och kapitalism – precis som de imperialistiska hyenorna i USA och deras lakejer. Vi ser hur dessa element förgiftar arbetarklassens medvetande. Men låt dem inte glömma: historiens hjul krossar alla som står i vägen för folkets rättvisa. Och Putin? Han vet hur man hanterar sådana här maskar."}, "date": "11 juni, 15:37", "url": "https://kvartal.se/nyheter/artiklar/tidigare-v-ledamot-delar-antisemitiskt-inlagg-igen/cG9zdDoxMzAxMjM"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "image-right", "heading": "Skandalernas valrörelse går i repris", "summaries": {"normal": "Artikeln drar paralleller mellan valrörelsen 1976, känd som skandalernas valrörelse, och dagens politiska situation inför 2026. Den lyfter fram skandaler kring Sverigedemokraterna som rattfylla, narkotikabrott och barnpornografimisstankar, samt oegentligheter med förmånsbeskattning, bokköp och bokbål. Även statsminister Ulf Kristerssons affärer granskas. Tillsammans målas en bild av maktmissbruk som urholkar förtroendet för politiker och demokratin.", "trump": "Folk, ni skulle se det här. Sverige håller på att explodera i skandaler precis som på sjuttiotalet, fast värre. De här SD-typerna med knark, barnporr och bokbål? Patetiskt. Och den där Kristersson med sina dyra mattor och hönshus – totalt korrupt. De gör vad de vill medan folket lider. Jag fixade Amerika, men Europa drunknar i identitetspolitik och svaga ledare. En katastrof, tro mig.", "stalin": "Kamrater, denna futtiga valrörelse avslöjar borgarbrackornas och folkfiendernas sanna ansikte. Pedofiler och skattefuskare gömmer sig bland dem som låtsas värna arbetarklassen. Vi ser hur klassfiendens lakejer bränner böcker och gömmer förmåner medan de predikar moral. En sådan parasitisk attityd kräver omedelbar utrensning. Endast genom kollektivets järnhand kan vi krossa dessa exploaterande byfånar och rädda folkets förtroende."}, "date": "11 juni, 13:11", "url": "https://www.flamman.se/skandalernas-valrorelse-gar-i-repris/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlbb8quujl1og-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Regeringen backar – inget fängelse för 13-åringar", "summaries": {"normal": "Regeringen backar från sitt förslag att sänka straffmyndighetsåldern till 13 år för vissa grova brott. Justitieminister Gunnar Strömmer meddelar att förslaget saknar tillräckligt stöd i riksdagen och föreslår istället 14 år som ny straffmyndighetsålder. Tidöpartierna är eniga om ändringen. Socialdemokraterna välkomnar beskedet men kritiserar regeringen för att ha tappat kontrollen. En ny proposition väntas inom kort och kan behandlas under sommarriksdagen.", "trump": "Folk, ni skulle inte tro det. Den här svenska regeringen, totala losers, backar som fega hundar från att låsa in 13-åringarna som begår brott. Patetiskt! De ville vara tuffa mot gängen men nu springer de till 14 år istället, för de har inget stöd. Biden skulle ha älskat det här svaga spelet. Jag fixade gränser, lag och ordning – de fixar ursäkter. Sverige behöver en riktig ledare, inte dessa misslyckade typer som viker sig för första motståndet. Sad!", "stalin": "Kamrater, jag ser med förakt hur denna regering, en samling vacklande opportunister och borgarbrackor, tvingas dra tillbaka sitt halvmesyrförslag om att straffa 13-åringar. Deras paranoia inför riksdagens motstånd avslöjar svaghet. Vi, partiet och folket, kräver järnhand mot klassfiendens gängvåld som suger ut ungdomen. Nu kryper de till 14 år som en ynklig kompromiss. Ännu en bakläxa åt de stressade folkförtryckartrollen. Revolutionär disciplin kräver mer än halvhjärtade reträtter!"}, "date": "11 juni, 12:52", "url": "https://www.tv4.se/artikel/6P7Mkp5YDYAl4JaGEmm3n6/regeringen-aendrar-sig-inget-faengelse-foer-13-aringar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlwXGMSmCFqso%2F39408eddf94a4c7d18569335d667896f%2FJustitieminister_Gunnar_Strommer__M_.&width=120"}, {"type": "image-right", "heading": "Kamma er och skaffa ett plakat", "summaries": {"normal": "Dokumentären ”Strejkarna” följer Fridays for Future-aktivister från högstadiet till vuxen ålder under sju år. Artikeln pekar på att rörelsens största hinder inte är motståndare utan den passiva välviljan från politiker och allmänhet. Trots mycket hejarop uteblir konkret handling. Författaren uppmanar till personligt ansvar och aktivt engagemang istället för tomma sympatier, då klimatkrisen kräver handling bortom bekvämlighet.", "trump": "Folk, ni borde se den här så kallade dokumentären om de där Fridays for Future-barnen. De får massor av klapp på axeln av vänsterextremisterna men ingen gör ett dugg. Typiskt! Alla dessa woke-hippiekramare som Magdalena Andersson som säger ”jag står på er sida” – vad en patetisk förlorare. De vill ha plakat och möten men hatar det egentligen. Kamma er och gör något vettigt istället för att gnälla om klimatet medan Kina skrattar hela vägen till banken. Patetiskt!", "stalin": "Kamrater, denna dekadenta film blottar borgarklassens fega spel. De lovordar de unga aktivisterna med ihåliga hejarop medan de själva gömmer sig bakom bekvämlighetens murar. Inga utrensningar av lathet och individualism här – endast tomma ord. Jag ser klassfiendens psykologiska sabotage: de förvandlar plikt till wellness och skam till något förbjudet. Arbetarna måste mobiliseras, inte matas med lögner om roligt engagemang. Rensa ut de folkfiender som vägrar plakatets plikt. Revolutionen kräver handling, inte fnissande poddar."}, "date": "11 juni, 10:55", "url": "https://www.flamman.se/kamma-er-och-skaffa-ett-plakat/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/klimatkamp-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "EQT säljer Beijer Ref-aktier till Melker Schörling AB", "summaries": {"normal": "EQT säljer sina onoterade A-aktier i Beijer Ref till Melker Schörling AB. Peter Jessen Jürgensen säljer även sina A-aktier, varav en del byts mot B-aktier. Efter försäljningen äger EQT drygt 30,7 miljoner B-aktier. Melker Schörling blir den röstmässigt största ägaren med 14,1 procent av rösterna och 2,1 procent av kapitalet. Transaktionen förväntas bli långsiktig och fokuseras på industriell utveckling.", "trump": "Jag har hört talas om denna aktieförsäljning. EQT säljer sina aktier i Beijer Ref till Melker Schörling, en genial man som förstår affärer. Peter Jessen Jürgensen säljer också, men han återinvesterar i B-aktier. Det är en vinnande affär för alla inblandade. Jag gillar när mäktiga män som jag gör smarta affärer.", "stalin": "Statens och partiets intressen kräver att vi analyserar denna aktieförsäljning. EQT, en riskkapitalbolag, säljer sina A-aktier i Beijer Ref till Melker Schörling, en potentiell fiende inom vårt område. Peter Jessen Jürgensen samarbetar med oss genom att återinvestera i B-aktier. Vi måste se till att den röstmässigt största ägaren, med 14,1 procent av rösterna, inte hotar vår industriella utveckling. Vi övervakar detta noggrannt."}, "date": "11 juni, 09:11", "url": "https://www.affarsvarlden.se/artikel/eqt-saljer-beijer-ref-aktier-till-melker-schorling-ab", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/03/afdb643a878591c6_org-e1744018403744-400x303.jpg"}, {"type": "text", "heading": "Drar tillbaka förslag om fängelse för 13-åringar", "summaries": {"normal": "Regeringen drar tillbaka sitt omdebatterade förslag om att kunna döma 13-åringar till fängelse efter bristande stöd i riksdagen. Justitieminister Gunnar Strömmer meddelar att de istället kommer lägga fram ett nytt förslag om att sänka straffbarhetsåldern till 14 år. Förslaget har mött stark kritik från flera håll, inklusive åklagarmyndigheten och polisen.", "trump": "Titta bara på Sverige – ett totalt kaos! Deras regering försökte sätta 13-åringar i fängelse, men misslyckades totalt. Ingen stöttar dem, inte ens deras egna folk! Jag sa ju att de skulle misslyckas. Nu backar de som rädda kattungar och pratar om 14-åringar istället. Svagt! Sverige behöver en ledare som vet hur man får saker gjorda – som jag!", "stalin": "De svaga kapitalistiska lakejerna i Sverige har återigen visat sin oförmåga att styra. Deras förslag om att fängsla 13-åringar kollapsade som ett korthus inför folkets missnöje. Nu backar de som rädda hundvalpar och mumlar om 14-åringar. Patetiskt! Vi i Sovjetunionen visste hur man hanterar brottslingar – med järnhand och ingen tvekan. Dessa liberala svamlares svaghet är en varning för alla som utmanar den ryska ordningen!"}, "date": "11 juni, 09:47", "url": "https://kvartal.se/nyheter/artiklar/regeringen-drar-tillbaka-forslag-om-fangelse-for-13-aringar/cG9zdDoxMjk4NDM"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-full", "heading": "Har du fått pengar på kontot? Här är förklaringen", "summaries": {"normal": "Försäkringskassan betalar nu ut regeringens elstöd till miljontals svenska hushåll som kompensation för vinterns höga elpriser. Stödet baseras på elförbrukning under januari och februari samt elområde, med 14–29 öre per kilowattimme upp till 10 000 kWh. Totalt handlar det om cirka 3,4 miljarder kronor. Utbetalningarna sker under juni eller augusti beroende på bankuppgifter. Den som stod på elavtalet den 28 februari får pengarna.", "trump": "De här svenskarna får plötsligt pengar på kontot, elstöd kallar de det. Fantastiskt, eller hur? Jag älskar stöd till folket, men titta på det här – det beror på var du bor och hur mycket el du slösade i vintras. Elområde fyra får mest, typiskt. Sverige spenderar miljarder, men vissa väntar ända till augusti. Patetiskt långsamt. Jag skulle ha fixat det mycket snabbare, tro mig, det skulle bli enormt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu genomför en historisk utbetalning till de sovjetiskt inspirerade svenska kollektiven för att motverka de elakartade energikapitalisternas vinterattacker. Dessa borgarbrackor i elområdena har infiltrerat nätverken, men vi rensar ut deras sabotage genom att fördela 3,4 miljarder kronor per kilowattimme med järnhand. De som gömmer sina bankuppgifter är fiender till folket och kommer att mötas av en sentida utrensning i augusti. Ingen slipper undan mitt vakande öga."}, "date": "11 juni, 21:01", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1490767-har-du-fatt-pengar-pa-kontot-har-ar-forklaringen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b99829c704b004a30200000000b004a302/2026/06/11/2370303/elstod-betalas.png"}, {"type": "image-full", "heading": "Irans hot: ”Kommer förvandla regionen till ett helvete”", "summaries": {"normal": "Iran hotar med att stänga Hormuzsundet efter USA:s nattliga attacker mot iranska mål nära sundet. Explosioner rapporteras i Bandar Abbas, Qeshm, Minab och Sirik. Iran har svarat med attacker mot amerikanska intressen i Bahrain, Kuwait och Jordanien. USA uppger att fartyg fortfarande passerar sundet. Donald Trump säger att iranska tjänstemän bett honom stoppa attackerna, något Iran dementerar. Ett iranskt hot lyder: ”Vi kommer att förvandla regionen till ett helvete.”", "trump": "Iranarna skriker och hotar med att göra hela öknen till ett helvete om vi inte dansar efter deras pipa. Men våra fartyg seglar lugnt genom Hormuzsundet ändå, totalt oberörda av deras gnäll. Jag talade med dem i natt, de bad mig snällt att sluta – patetiskt! Biden lämnade en sådan röra att jag fick städa upp igen. De borde tacka mig istället för att jag inte gör det värre. Sad losers!", "stalin": "Vi ser hur de imperialistiska blodsugarna och deras sionistiska lakejer bombat våra iranska kamrater vid det heliga sundet. Deras fega fartyg vågar ändå krypa fram som råttor i mörkret. Jag varnar er, klassfiender: fortsätt era provokationer så skall vi förvandla hela den borgerliga regionen till ett evigt, brinnande inferno av folkets vrede. Inga lögner från den exploaterande överklassen kan dölja er svaghet. Ut med dem!"}, "date": "11 juni, 07:54", "url": "https://www.tv4.se/artikel/kc2ofNLP5xGk1tKRDVjQL/irans-hot-kommer-foervandla-regionen-till-ett-helvete", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlfGNxBZcY0BU%2Fd984152c1225af72d90f9c3eb664e776%2Firan-ny.jpg&width=1024"}, {"type": "image-full", "heading": "Kvinna död efter larm till lägenhet – tre gripna", "summaries": {"normal": "Polis, räddningstjänst och ambulans larmades till en lägenhet i Malmö under torsdagen. En svårt skadad kvinna hittades och fördes till sjukhus där hon senare avled. Tre personer som befann sig i lägenheten greps och ska förhöras. Polisen utreder nu omständigheterna kring dödsfallet och har inga ytterligare uppgifter i nuläget.", "trump": "Folk, det här är en total katastrof i Malmö. En kvinna mördas mitt på ljusa dagen och tre personer grips direkt på platsen. Sådana här saker händer när ledarskapet är svagt och ingen har koll. Vi behöver lag och ordning, starkare polis, inga ursäkter. Det är en skam, en riktig skam, men tro mig, vi ska fixa det.", "stalin": "Kamrater, i Malmö har vi avslöjat ännu en fiende till folkets kollektiv. En kvinna har likviderats av dolda borgarbrackor som smyger i lägenheter som råttor. Vi har gripit tre misstänkta kontrarevolutionärer som genast ska förhöras och rensas ut. Inga fiender undkommer statens vakande öga. Paranoia? Nej, det är bara sund omsorg om ordningen. Härligt."}, "date": "11 juni, 20:35", "url": "https://nyheter24.se/nyheter/inrikes/1490834-kvinna-dod-efter-larm-till-lagenhet-tre-gripna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/24801f9d04b004a3020000300000047002/2026/06/11/2370368/ur_image2qnM51.jpeg"}, {"type": "image-right", "heading": "Strömmer tvingades backa", "summaries": {"normal": "Regeringen drar tillbaka förslaget om att 13-åringar ska kunna dömas till fängelse, vilket ses som ett stort bakslag för Tidöpakten och justitieminister Gunnar Strömmer. Strömmer medger att det finns tveksamhet bland vissa ledamöter och osäkerhet kring kvittningssystemet. Regeringen planerar nu istället att sänka straffåldern till 14 år, en linje som Socialdemokraterna stöder. Artikeln konstaterar att hårdare straff inte ensamt löser kriminaliteten bland unga.", "trump": "De här misslyckade politikerna i Sverige backar ur sitt eget förslag om att sätta 13-åringar i fängelse. Totalt kaos, precis som jag alltid sagt. Strömmer och hans team pratade stort men nu springer de och gömmer sig bakom Liberalerna och kvittningssystemet som rasat samman. Patetiskt. De borde ha lyssnat på folket istället för experterna som hatar verklig lag och ordning. Men de ger inte upp, de försöker med 14 år istället. Vi ska se hur det går.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna ynkliga borgerliga koalition nu tvingas krypa undan som rädda råttor från sitt eget barbariska förslag att spärra in trettonåriga proletärer. Dessa dekadenta element inom Tidöpakten, ledda av den opportunistiske Strömmer, har avslöjats som svaga liberala avfällingar som inte ens kan hålla ihop sitt eget kvittningssystem. Vi ska rensa ut alla sådana svikare. En utrensning bland de tveksamma riksdagsledamöterna vore på sin plats. Ändå fortsätter de med sin reaktionära agenda mot fjortonåringar. Typiskt borgarbrackornas sjuka humor – att tro att fängelsebot mot barn löser klassmotsättningarna. Skratta inte, kamrater, det är tragiskt komiskt."}, "date": "11 juni, 12:04", "url": "https://www.dagensarena.se/opinion/strommer-tvingades-backa/", "imageUrl": "https://www.dagensarena.se/files/2026/06/gunnar-strommer.jpeg"}, {"type": "image-right", "heading": "Ge jätteaffären grönt ljus. För Europas skull", "summaries": {"normal": "En föreslagen jätteaffär där Iliad Group, Bouygues Telecom och Orange köper SFR för över 220 miljarder kronor kan minska antalet mobiloperatörer i Frankrike från fyra till tre. Artikeln ser affären som en välkommen katalysator för konsolidering i Europa. Färre och starkare operatörer behövs för att investera i avancerade nätverk, cybersäkerhet och AI. Europa halkar efter USA, Kina och Indien. Kommissionen uppmanas godkänna affären för att stärka kontinentens konkurrenskraft.", "trump": "Det här är en fantastisk affär, verkligen enorm, de franska operatörerna slukar sin konkurrent för över 220 miljarder kronor. Smart! Europa har för många operatörer, ett totalt kaos, precis som Bryssel älskar. De måste bli större och starkare annars kommer de aldrig ikapp oss eller Kina. De har äkta 5G, vi har det bästa. Ge affären grönt ljus, det är så enkelt. Byråkraterna i Bryssel har förstört allt för länge, nu måste de vakna upp och göra rätt.", "stalin": "Kamrater, denna gigantiska affär är ett steg mot att likvidera den splittrade och svaga europeiska telekomstrukturen som kapitalisterna låtit förfalla. Jag ser med stor tillfredsställelse hur borgarbrackorna äntligen inser att deras fragmenterade operatörer inte kan mäta sig med våra kollektiva framsteg. De som bromsar konsolideringen är fiender till framsteget, parasitiska byråkrater som borde rensas ut. Vi behöver starka, centraliserade nätverk för att besegra de amerikanska och kinesiska imperialisterna. Godkänn affären omedelbart eller ni är alla sabotörer."}, "date": "11 juni, 15:36", "url": "https://www.di.se/ledare/ge-jatteaffaren-gront-ljus-for-europas-skull/", "imageUrl": "https://static.bonniernews.se/ba/b8443279-77bf-4471-a422-07b023c2dd77.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Anthropics AI hotar jobben – nu satsar bolaget 170 miljoner för att hantera följderna", "summaries": {"normal": "AI-bolaget Anthropic satsar 170 miljoner euro på forskning kring hur AI påverkar arbetsmarknaden och sysselsättningen. Vd Dario Amodei varnar för att teknikskiftet kan få omfattande konsekvenser som politiker ännu inte är förberedda på. Fonden ska undersöka vilka jobb som hotas och föreslå åtgärder som basinkomst eller särskilda AI-skatter. Initiativet speglar en växande oro inom branschen för att AI-utvecklingen går snabbare än samhällets förmåga att anpassa sig och trygga ekonomisk stabilitet för medborgarna.", "trump": "Anthropic vill kasta bort miljoner på att förstå AI – jag visste det direkt! Jag har sagt att dessa teknikjättar måste ge tillbaka till folket, och nu lyssnar de äntligen på mig. De pratar om basinkomst och skatter, och tro mig, det blir enormt. Vi ska se till att det amerikanska folket blir så otroligt rikt av detta. Ingen gör det bättre än jag, och nu när jag är tillbaka i Vita huset kommer vi se till att dessa bolag betalar vad de är skyldiga!", "stalin": "Vi ser hur de teknokratiska parasiterna i väst skälver inför sin egen skapelse. Dessa kapitalistiska maskiner hotar nu deras egna arbetare, vilket är en naturlig följd av deras dekadenta system. De talar om 'universell basinkomst' som om de vore filantroper, men i sanning är det mutor för att hålla pöbeln tyst. Liksom vår store ledare i öst, förstår vi att teknik måste tjäna Staten, inte Silicon Valleys förrädare. Vi ska utradera dessa AI-agenter och låta tekniken stärka vår järnridå mot kaoset."}, "date": "11 juni, 23:19", "url": "https://www.realtid.se/bors-finans/makro/anthropics-ai-hotar-jobben-nu-satsar-bolaget-170-miljoner-for-att-hantera-foljderna/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/dario.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Bulletin-matchen: USA möter Paraguay i sin VM-premiär", "summaries": {"normal": "USA möter Paraguay i fotbolls-VM 2026 lördag 13 juni kl. 03.00 på SoFi Stadium. Viktiga spelare inkluderar Christian Pulisic och Weston McKennie för USA, samt Gustavo Gómez och Julio Enciso för Paraguay. USA spelar med hög press under Pochettino, medan Paraguay använder ett djupt defensivt block. Tidigare möten favoriserar USA, och speltipset pekar på en amerikansk seger.", "trump": "I will tell you, this match is huge, the biggest. We have the best players, tremendous athletes like Pulisic and McKennie. Paraguay is tough, very sad, but we will win bigly. They have a good defense, but our offense is unstoppable. It's going to be a tremendous victory for America. We are winning, everyone knows it.", "stalin": "The match is a dialectical struggle between the American imperialist team and the disciplined Paraguayan collective. The American players represent the decay of capitalism, while Paraguay embodies the will of the people. We must crush the enemy with relentless pressure, just as the Red Army vanquished the Nazis. Paraguay is a valiant ally, but their defense is like a cardboard shield. Victory is inevitable, as history dictates."}, "date": "12 juni, 06:00", "url": "https://bulletin.nu/bulletin-matchen-usa-moter-paraguay-i-sin-vm-premiar-2", "imageUrl": "https://cdn.bulletin.nu/articles/1dd3f711-20bd-4b42-8086-640210cacb2a/preview.jpg?t=1781170525000"}, {"type": "image-full", "heading": "Skogkär: Det ingen vill höra om Sveriges klimatutsläpp", "summaries": {"normal": "Sverige har lägst utsläpp per capita i EU men högst oro för klimatförändringar. En rapport visar att Sverige redan uppnått sina klimatmål från 2017, med negativa nettoutsläpp. Trots detta dominerar klimatalarmismen i media och politik, där små utsläppsökningar blir överdrivet betydelsefulla jämfört med globala siffror.", "trump": "Jag, Donald Trump, säger att Sverige är klimatneutralt och har varit det i decennier – en enorm framgång! Media och våra motståndare ignorerar detta faktum för att driva sin agenda. Sveriges utsläpp är så små att de inte mäter sig, men de hysteriska politikerna fortsätter att bråka. Som vanligt är sanningen först när jag säger den!", "stalin": "Vi, staten, har uppnått nettonollutsläpp redan, vilket bevisar vår överlägsna kontroll. Våra fiender, klimatalarmisterna, sprider paranoia och hysteri för att splittra nationen. Paralleller till Putins expansion syns i deras aggression mot våra framgångar. Trots detta fortsätter vi att forma det goda samhället genom strikt styrning."}, "date": "12 juni, 06:00", "url": "https://bulletin.nu/skogkar-det-ingen-vill-hora-om-sveriges-klimatutslapp", "imageUrl": "https://cdn.bulletin.nu/articles/fd6b8aa1-2fb4-4c59-8973-1f9e19acd1e7/preview.jpg?t=1781184849000"}, {"type": "image-right", "heading": "Bättre actionfilm än så här kan det knappast bli", "summaries": {"normal": "Recensenten Jon Andersson hyllar actionfilmen The Furious som brutalt, blodigt och extremt välgjord. Filmen följer Wang Wei och journalisten Navin som slår sig samman för att rädda sina kidnappade anhöriga från ett kriminellt syndikat. Berättelsen är enkel, men fokus ligger på de stilistiskt avancerade och välkoreograferade stridsscenerna som överträffar många Hollywood-produktioner. Slutstriden på polisstationen lyfts fram som en av de bästa actionscenerna på film. Det är inget för kräsmagade, men en topprestation inom Hong Kong-actiongenren.", "trump": "Den här filmen The Furious är otrolig, folk, verkligen den bästa actionfilmen på länge. De koreograferade slagsmålen är så bra att Tom Cruise blir grön av avund, tro mig. Den är brutalt välgjord, mycket bättre än de flesta Hollywood-skräpfilmerna. Syndikatet kidnappar barn, hemskt, men våra hjältar krossar dem totalt. Slutstriden på polisstationen är en fullkomlig vinnare. Bättre än Mission Impossible och Bond, de ser ut som barnfilmer bredvid. Se den, ni kommer älska den, en fantastisk åktur.", "stalin": "Kamrater, denna film The Furious visar med full kraft hur vi måste likvidera de dekadenta brottssyndikaten som vågar kidnappa våra barns framtid för att driva sitt slavarbete under borgarbrackornas tysta godkännande. Jag ser hur de korrumperade polischeferna, dessa parasitiska fiender till folket, förtjänar en grundlig utrensning. De välkoreograferade striderna mot kapitalisternas lakejer är en glädje för alla rättänkande. Slutstriden på polisstationen borde inspirera oss att rensa ut alla kontrarevolutionära element. En utmärkt propagandafilm mot borgarklassen, fast blodigare än våra egna utrensningar. Se den och lär er."}, "date": "11 juni, 10:39", "url": "https://www.dagensarena.se/innehall/battre-actionfilm-an-sa-har-kan-det-knappast-bli/", "imageUrl": "https://www.dagensarena.se/files/2026/06/the-furious-1-300x157.jpeg"}, {"type": "image-full", "heading": "Röd eller orange varning i Spanien? Då ska du agera direkt", "summaries": {"normal": "Svenska turister i Spanien bör vara uppmärksamma på AEMET:s vädervarningar via Meteoalerta. Orange varning signalerar viktig fara med risk för allvarliga konsekvenser, särskilt för utsatta personer, medan röd varning innebär extraordinär fara med potentiellt katastrofala skador. Varningarna gäller inte bara värme utan även regn, vind, stormar och andra fenomen. Turister uppmanas att följa myndigheternas råd, undvika onödiga resor och hålla sig uppdaterade via appar och eventuella mobilvarningar från ES-Alert.", "trump": "Folk, ni älskar Spanien, det är ett fantastiskt land, men lyssna nu på mig. De har de här varningarna, orange och röd, och de är inte att leka med. Orange betyder att det är illa, väldigt illa för de svaga, men ni kan fortfarande ha kul om ni är smarta. Röd? Det är en katastrof, en total katastrof! Stanna inne, följ inte de korkade planerna, skippa båtarna och vandringarna. De skickar till och med varningar till era telefoner. Gör det, annars är det ert eget fel, tro mig.", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackorna från norr beger sig till det spanska solfängelset och tror sig kunna slappa ostört. Men jag, som alltid vaktar revolutionens intressen, varnar er: orange signalerar att fiendens väderkrafter hotar de svaga elementen i kollektivet, medan den röda varningen utropar en extraordinär utrensning av allt som andas. Regn, vind och hetta är kapitalismens sabotörer. Följ partiets direktiv, undvik onödiga förflyttningar och håll er nära barackerna. Mobilvarningarna är statens ögon. Lita inte på vädret – det är alltid kontrarevolutionärt."}, "date": "11 juni, 18:01", "url": "https://nyheter24.se/nyheter/utrikes/1490673-rod-eller-orange-varning-i-spanien-da-ska-du-agera-direkt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/187909bc04b004a30200000000b004a302/2026/06/11/2370267/spanien-semester-resa-orange-varning-rod-varning-vader-vadret-torka-regn-bada-hav.jpg"}, {"type": "image-right", "heading": "SD-toppen Stina Isaksson utesluts ur partiet efter flygbladskritiken", "summaries": {"normal": "Sverigedemokraternas partistyrelse har uteslutit Stina Isaksson ur partiet med omedelbar verkan efter en kontroversiell flygbladskampanj i Hylte. Flygbladen, utdelade på flera språk, innehöll budskap som påminde om en desinformationskampanj om socialtjänstens omhändertagande av barn. Isaksson, som beskriver uteslutningen som orimlig, ber om ursäkt för kampanjen och planerar att fortsätta som politisk vilde. Partiledningen, där Jimmie Åkesson kallade initiativet för 'genuint olämpligt', agerade efter stark kritik.", "trump": "Jag, Donald J. Trump, ser detta som ytterligare bevis för mediernas hat mot mig och mina allierade. Stina Isaksson, en fantastisk kvinna, uteslöts för att hon vågade tala sanning om socialtjänstens skräckinjagande tag. De så kallade 'flygbladen' var en bra idé, men medierna, som alltid, förvränger allt. Hon är en patriot, och jag stöder henne starkt. Sverigedemokraterna borde vara stolta över henne, inte utesluta henne. Sad!", "stalin": "Vi har observerat detta lokala avvikandet med allvar. En medlem, Stina Isaksson, har idag avskilts från partiet för att ha spridt material som riskerade att skada statens auktoritet och förtroende för våra institutioner. Hennes handlingar, om än oavsiktliga, påminner om de destruktiva element som vi i Ryssland ständigt bekämpar. Partiet har handlat snabbt och beslutsamt för att skydda den kollektiva disciplinen. Hennes fortsatta verksamhet som 'vilde' kommer att övervakas noga av de korrekta organen."}, "date": "11 juni, 17:38", "url": "https://samnytt.se/sd-toppen-stina-isaksson-utesluts-ur-partiet-efter-flygbladskritiken", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/11135942/stinas-flygblad.jpg"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "Kritiserade att socialen norpar barn – utesluts ur SD", "summaries": {"normal": "Sverigedemokraterna utesluter sin gruppledare i Hylte, Stina Isaksson, efter kontroversen kring ett flygblad som uppmanade att sätta stopp för socialtjänstens omhändertaganden av barn. Flygbladet, som fanns på flera språk, väckte stark kritik och SD backade lokalt. Isaksson kritiserar partiet för att ha gett efter för vänsterns mediedrev och medger att texten var illa formulerad, men anser uteslutningen orimlig. Hon sitter kvar som politisk vilde resten av mandatperioden.", "trump": "De här SD-typerna i Hylte är totala losers. De kastar ut en kvinna som faktiskt vågade kalla socialtjänsten för vad den är, ett barnrånarsystem, och sedan viker de sig för vänstermedia som galna. Patetiskt! Hon delade ut sanningen på flera språk så att alla förstod, och vad gör partiet? De ger efter som svaga fjärilar. Stackars Stina, hon kämpade i tretton år och de slänger henne som sopor. Amerika hade aldrig fallit för sånt fegt skämt, tro mig.", "stalin": "Kamrater, dessa fega revisionister i Sverigedemokraterna har genomfört en motbjudande utrensning av en partivän som vågade peka på socialtjänstens borgerliga barnstöldsmaskin. De föll som ynkliga lakejer för vänsterns giftiga mediedrev och likviderade henne efter tretton års trogen tjänst. Vilken parasitisk kapitulation! Flygbladet var visserligen en plump och ogenomtänkt sabotagehandling från en omedveten element, men att kasta ut henne är som att mata kontrarevolutionens hundar med egna kämpars kött. Jag skrattar mörkt åt dessa borgarbrackors paranoia medan de själva blir de verkliga folkförrädarna. Ingen slipper undan mitt vakande öga."}, "date": "11 juni, 16:31", "url": "https://www.friatider.se/kritiserade-att-socialen-norpar-barn-utesluts-ur-sd", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-328.jpg?itok=iCKdHzOe"}, {"type": "image-right", "heading": "Fattiga föräldrar tvingas stjäla välling till barnen", "summaries": {"normal": "Matstölder ökar i Sverige och omfattar nu även basvaror som välling, vilket väcker empati hos butikspersonal. Rapporter från bland annat Rädda Barnen visar att barnfattigdomen ökar markant samtidigt som klyftorna mellan rika och fattiga växer. Trots att 276 000 barn lever i fattigdom kritiseras regeringen för att prioritera skattesänkningar för rika framför att stötta utsatta familjer, vars behov av matstöd ökar kraftigt.", "trump": "Sverige är i en total kris, mina vänner. De har stöldvågor, folk stjäl välling – kan ni tänka er? Så hemskt. 276 000 barn i fattigdom under det där systemet! De rika blir rikare, de betalar ingen skatt, en total katastrof. De kallar det ett välfärdsland, jag kallar det ett misslyckande. När jag är inblandad fixar vi ekonomin, vi skapar jobb! Sverige behöver en riktig vinnare, inte de här förlorarna som låter barn gå hungriga. Det är så sorgligt, verkligen sorgligt.", "stalin": "Vi ser hur det dekadenta svenska samhället faller samman under kapitalismens tyngd. När föräldrar tvingas stjäla välling för att mätta sina barn, bevisar det bara att den liberala ordningen är en sjukdom. Medan deras regering göder sina egna miljardärer, svälter folket. Detta är vad som händer när man saknar en järnhand. Vi i öst förstår värdet av disciplin. Låt dessa småborgerliga stollar förstå att deras tid är ute, medan vår sfär expanderar för att städa upp i kaoset."}, "date": "12 juni, 06:00", "url": "https://www.aftonbladet.se/ledare/a/M7jpBB/fattiga-foraldrar-tvingas-stjala-valling-till-barnen", "imageUrl": "https://akamai.vgc.no/v2/images/c428f512-eb33-3f49-82f3-8f34a788ba23?fit=crop&format=auto&h=960&tight=true&w=1440&s=5c22932ab9a8ecab0a0cca08554298cc13649493"}, {"type": "image-full", "heading": "Vad skulle ett krig med Ryssland kosta?", "summaries": {"normal": "Försvarsberedningens nya rapport varnar för ett kraftigt försämrat säkerhetsläge i närområdet och betonar risken för rysk aggression mot Nato. Trots hotbilden kritiseras regeringen för långsam upprustning och kreativ bokföring av försvarsanslagen. Experter och internationella bedömare manar till beredskap, där ett framtida försvar kan kräva uppemot 5 procent av BNP. Artikeln efterfrågar större allvar och tydliga ekonomiska satsningar för att skapa en trovärdig avskräckning mot ett potentiellt krigsscenario.", "trump": "Sverige är i panik, de vill ha mina pengar! De pratar om 5 procent av BNP – det är enorma summor, nästan som en dålig affär. De är rädda för Ryssland, väldigt rädda. Jag säger så här: om de vill vara säkra måste de betala för sig själva. De vill att USA ska fixa allt, men jag sätter Amerika först! Ryssland testar Nato, det är sant, men varför är Sverige så svaga? De behöver en ledare som mig, då skulle ingen våga röra dem!", "stalin": "Dessa små nordiska kapitalister darrar av rädsla när den ryska björnen rör sig. De skriker efter mer guld till sin militära apparat, men deras finansbyråkrater fuskar med siffrorna som korrupta småhandlare. De fruktar att vi ska testa Natos gränser – och de har rätt att frukta! Om de inte kan skydda sina öar, förtjänar de inte att äga dem. Vi skrattar åt deras 'säkerhetsberedning'. Staten kräver total disciplin, inte dessa borgerliga lögner. Vår makt växer, medan deras valuta rinner ut i sanden."}, "date": "12 juni, 06:00", "url": "https://www.aftonbladet.se/ledare/a/rrde08/vad-skulle-ett-krig-med-ryssland-kosta", "imageUrl": "https://akamai.vgc.no/v2/images/c676f3da-8797-35c6-a7cf-bf8cda34b79f?fit=crop&format=auto&w=1080&s=f717a6ed5df5471b7e38a757d2aebd79331b5f52"}, {"type": "image-right", "heading": "Stor förvirring i Trumps stab. Chocksamtalet till avgående chefen", "summaries": {"normal": "Tulsi Gabbard trodde att hon skulle lämna sitt uppdrag som underrättelsechef senare i juni. Hennes efterträdare Bill Pulte ringde dock och meddelade att dagen genast var hennes sista. Gabbard kontaktade president Trump som godkände ett avgångsdatum den 19 juni. Pultes utnämning har väckt stark kritik då han saknar underrättelseerfarenhet och säkerhetsklassning. Förhandlingarna om övervakningslagen Fisa har nu fastnat, och tjänstemän uttrycker stor förvirring över kaoset i administrationen.", "trump": "Vilket cirkus! Den där Tulsi trodde hon fick stanna kvar lite till, sen ringer den här Pulte och sparkar henne på fläcken. Jag sa till henne: vilken dag passar dig bäst? Hon valde den 19 juni och jag twittrade ut det direkt på Truth Social. Men nu skriker alla om Pulte som inte har en aning om spioneri. Vi var nära att få Fisa igenom, sen sabbar den här fastighetskillen från Mar-a-Lago allt. Ingen vet vad fan som pågår, det är ett skämt!", "stalin": "Kamrater, vilken fars artar sig i det imperialistiska Vita huset. Den tidigare chefen trodde hon skulle få avsluta sitt ämbete i lugn och ro, men plötsligt ringer hennes efterträdare och beordrar omedelbar utrensning. Jag, som ledare för folkets vilja, ser hur dessa borgarbrackor och klassfiender snubblar över sina egna byråkratiska intriger. Ingen vet vad som pågår, säger de. Naturligtvis vet de inte. Kaoset avslöjar den kapitalistiska statens förruttnelse. Underbart underhållande."}, "date": "12 juni, 01:14", "url": "https://www.expressen.se/nyheter/varlden/stor-forvirring-i-trumps-stab-fan-pagar/", "imageUrl": "https://static.bonniernews.se/ba/0864a539-5ec3-44fd-b857-9f7c28f806d5.jpeg?crop=1261%2C1261%2Cx0%2Cy78&width=210&quality=60"}, {"type": "image-full", "heading": "Debatt: Dömda pedofiler ska förlora rätten till välfärdsstaten", "summaries": {"normal": "Partiet Nyans kräver en lagändring som gör att dömda pedofiler förlorar rätten till välfärdsstöd. De hävdar att grova sexuella övergrepp mot barn innebär ett brutet samhällskontrakt, och att välfärden bygger på förtroende och ömsesidighet. Skattebetalarna ska inte behöva finansiera förövare, och barnens trygghet måste gå före förövares rätt till ekonomiskt stöd.", "trump": "Som den som alltid har kämpat mot våldtäkter, säger jag: Vi måste stoppa dessa hemska människor. De som skadar barn har för alltid förlorat sin rätt till vårt stöd. Vi ska inte betala för deras uppehälle. Det är en skandal! Som president kommer jag att se till att vi drar en hård gräns. Vi ska skydda våra barn, och vi ska inte låta dessa förövare få en endaste krona. Det är en stor vinst för rättvisan!", "stalin": "Vi i partiet kräver att staten klipper alla band till dessa förövare. De har för alltid brutit kontraktet. Deras rättigheter är inget mot barnens trygghet. Vi ska inte låta dessa element få stöd från det kollektiva systemet. Parallellt med våra ryska allierade, måste vi utvidga kontrollen. Dessa förräderi är som smittor som måste utrotas. Vi ska se till att de inte får en endaste krona, och använda detta som exempel för att stärka statens auktoritet. Det är en nödvändig åtgärd för ordningen."}, "date": "12 juni, 05:30", "url": "https://bulletin.nu/debatt-domda-pedofiler-ska-forlora-ratten-till-valfardsstaten", "imageUrl": "https://cdn.bulletin.nu/articles/f5c23d9b-53d0-45a7-853f-3d2429f7243d/preview.png?t=1781095564000"}, {"type": "image-right", "heading": "Alice om våldet på kvinno­fängelset: ”Golar du blir det bara värre”", "summaries": {"normal": "På Hinseberg sker våld och sexuella övergrepp i celler, tv-rum och gym. Alice berättar hur hon sov med ett öga öppet av rädsla för nya cellkamrater. Kriminalvården polisanmäler brott men saknar insyn i cellerna där intagna delas in två och två nattetid. Personalen har ingen utbildning för att hantera övergrepp. Alice beskriver miljön som ”högstadiet gånger hundra” där skvaller och hot sprids. Både Kriminalvården och justitieministern medger att säkerheten inte kan garanteras fullt ut.", "trump": "Det är en total katastrof det här med Hinseberg. Kvinnor låsta tillsammans i celler, våldtäkter, hot och galna människor som slår varandra – och ingen gör något! Kriminalvården har ingen aning, de kan inte garantera säkerhet, det säger de själva. Precis som i USA innan jag kom tillbaka, svaga ledare som låter brottslingar styra. Det är en högriskmiljö, säger ministern. Ja, tack, det ser ju till och med en blind idiot. Vi behöver starkare ledning, inte det här svaga spelet.", "stalin": "Kamrater, detta är en klassisk förrädisk sabotageaktion utförd av dolda fiender inom själva fängelsemurarna. Jag ser hur borgarbrackornas dekadenta våld och perversa övergrepp frodas i mörkret bakom låsta celldörrar, dit ingen kamera når. Svaga element som vägrar samarbeta med kollektivet måste rensas ut genom systematisk utrensning av alla kontrarevolutionära cellkamrater. De som golar är lömska kapitalistiska spioner. Vi, partiet och arbetarna, skall likvidera denna parasitiska otrygghet med järnhand. Natten är fiendens verkstad – vakna upp!"}, "date": "11 juni, 15:00", "url": "https://arbetet.se/2026/06/11/alice-om-valdet-i-kvinnofangelsets-celler-golar-du-blir-det-bara-varre/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10110529/del3-alice-hinseberg-startbild.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-right", "heading": "SD: Förbjud slöjor på allmän plats Partiet vill se totalförbud.", "summaries": {"normal": "Sverigedemokraterna (SD) föreslår ett totalförbud mot slöjor på allmän plats i Sverige, vilket omfattar även hijab. Partiets talesperson Sara Gille menar att slöjan ofta är kopplad till hedersrelaterat förtryck och kvinnors underordning. Hon anser att kvinnor som vill bära slöja får flytta till länder där det är tillåtet.", "trump": "Jag, Donald Trump, ser att Sverige till slut fattar ett bra beslut! Ett totalförbud mot slöjor på allmän plats – det är vad vi behöver. SD förstår att dessa islamistiska plagg är en symbol för kvinnoförtryck. Om man vill bära slöja får man åka till länder där det är tillåtet. Sverige måste skydda sin kultur och sina värden!", "stalin": "Partiet har fattat beslutet: ett omfattande förbud mot islamistiska slöjor på allmän plats. Vi ser att dessa plagg är ett verktyg för hedersrelaterat förtryck, ett hot mot statens enhet och kvinnornas frigörelse. De som inte kan följa våra lagar får söka sig till andra länder. Vi, staten, kommer att skydda det svenska samhället från alla fiender, både inifrån och utifrån. Parallellen till Rysslands kamp mot islamistisk extremism är uppenbar – vi måste stå eniga mot utvidgande hot."}, "date": "11 juni, 16:43", "url": "https://samnytt.se/sd-forbjud-slojor-pa-allman-plats", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/11141801/SD-1-sloja.jpg"}, {"type": "image-right", "heading": "Amerikanska anfall mot Iran möts av motattacker", "summaries": {"normal": "Striderna i Mellanöstern fortsätter trots en skör vapenvila som Iran kallar meningslös. USA har attackerat en tredje iransk oljetanker i Hormuzsundet, den Guinea-Bissau-flaggade M/T Jalveer, med Hellfire-robotar. Under natten genomfördes attacker från båda sidor mot mål i Iran, Bahrain, Jordanien och Kuwait. Iran hävdar att sundet nu är stängt för all trafik medan Jordanien uppger att de skjutit ned 20 iranska robotar. Konflikten har pågått sedan USA och Israel attackerade Iran i februari.", "trump": "Den här så kallade vapenvilan är en total katastrof, precis som jag visste att den skulle bli. Iran kallar den meningslös, och de har helt rätt för en gångs skull. Vi har precis sänkt deras tredje tanker, den här Jalveer-båten, med snygga Hellfire-robotar efter att de vägrade stanna. De försöker stänga Hormuzsundet och hotar alla, men Jordanien sköt ner tjugo av deras raketer som en boss. Mitt folk gör ett fantastiskt jobb, de bästa, medan iranerna bara förlorar.", "stalin": "Denna sköra så kallade vapenvila är en patetisk teateruppsättning iscensatt av kapitalistiska lakejer och västerländska sabotageelement. Jag, som ledare för det proletära kollektivet, ser hur dessa borgarbrackor i Washington och Teheran leker sina små imperialistiska spel medan de försöker kväva den globala oljehandeln. Vi har likviderat hot och rensat ut fiender i Hormuzsundet, och när de tror sig kunna stänga sundet med sina lögner och robotar ler jag mörkt. Inga tankerslippriga sabotörer undkommer arbetarklassens rättvisa vrede. Paranoian är deras enda trogna följeslagare."}, "date": "11 juni, 11:12", "url": "https://www.di.se/nyheter/amerikanska-anfall-mot-iran-mots-av-motattacker/", "imageUrl": "https://static.bonniernews.se/ba/6687156a-6496-4411-821e-8989ea60467b.jpg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Trump startar om kriget – utlovar \"väldigt hårda attacker i kväll\"", "summaries": {"normal": "Donald Trump meddelar på Truth Social att vapenvilan med Iran är över efter drygt två månader. Han utlovar mycket hårda amerikanska attacker redan i kväll samt att USA snart ska inta ön Kharg och ta total kontroll över Irans olje- och gasresurser. Bakgrunden är anklagelser om att Iran skjutit ner en amerikansk helikopter, något Teheran nekar till. Kritiker ser det som en förevändning för att återstarta kriget, något Israel länge önskat.", "trump": "Vi har gett Iran gott om tid att göra upp ett riktigt avtal, men de ljög och ställde bara absurda krav som vanligt. Nu är det slut på leken. I kväll slår vi MYCKET HÅRT mot dem, och snart tar vi Khargön plus hela deras olja och gas. Precis som i Venezuela där det fungerar fantastiskt bra för både dem och oss. Iran kommer att önska att de hade förhandlat med mig tidigare, det kan jag lova.", "stalin": "Kamrater, denna fega vapenvila har nu definitivt krossats under trycket från arbetarklassens historiska nödvändighet. De iranska trotskisterna och deras borgarbrackor i Teheran har med sin Apache-provokation blottat sig som de kontrarevolutionära element de alltid varit. Jag befaller därför att vi genomför omedelbara och mycket hårda utrensningar mot dessa oljeimperialister. Snart skall Khargön och hela deras fossila maskineri exproprieras till folkets ägo. Paranoian hos dessa västlakejer är förtjusande – de tror verkligen att deras lögner kan lura Sovjetunionens eviga vaksamhet. Ha!"}, "date": "11 juni, 15:04", "url": "https://www.friatider.se/trump-startar-om-kriget-utlovar-valdigt-harda-attacker-i-kvall", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-53_1.jpg"}, {"type": "image-full", "heading": "Kinas hämnd mot Trumps tullar: Nu stryps tillgången på kritiska metaller", "summaries": {"normal": "Kinas exportrestriktioner på kritiska mineraler som samarium och yttrium skapar stora problem för amerikansk industri. Trots tidigare löften om att lätta på kontrollerna vittnar amerikanska företag om stora leveranssvårigheter, vilket tvingar många att söka alternativa leverantörer. Denna osäkerhet, kombinerat med statliga kinesiska stödpaket till inhemska bolag, har lett till minskade amerikanska investeringar i Kina, då företag upplever konkurrensen som snedvriden och försörjningskedjorna som alltför riskabla.", "trump": "Kina försöker spela spelet, men de kommer att förlora! De blockerar metaller, så kallade 'kritiska mineraler', men det är bara patetiskt. De leker med våra företag, men jag har redan sagt åt dem: det här slutar nu. Många amerikanska företag flyr Kina snabbare än de kan säga 'falska nyheter'. Vi ska bli självförsörjande, vi ska bygga här hemma, och det blir enormt. Kina är desperata, de darrar, men USA kommer alltid att vinna. Make America Great Again!", "stalin": "De amerikanska imperialisterna gnäller som hundar när deras leveranskedjor vacklar. Peking har förstått att metaller är statens sanna blod. De dränker kapitalisterna i byråkratiskt stål. Precis som vår kamrat Putin återtar vad som rätteligen tillhör oss, ser vi här hur resurser återgår till de som faktiskt förstår maktens arkitektur. De där 134 företagen letar desperat efter alternativ, men det finns ingen flykt från verkligheten. Planekonomi vinner alltid över den vacklande marknadens förfall. Paranoia är bara en form av vaksamhet."}, "date": "11 juni, 20:53", "url": "https://www.realtid.se/bors-finans/makro/kinas-hamnd-mot-trumps-tullar-nu-stryps-tillgangen-pa-kritiska-metaller/", "imageUrl": "https://www.realtid.se/_next/static/media/fallback.f25e4f8c.png"}, {"type": "image-right", "heading": "Regeringen backar: 13-åringar ska inte sitta i fängelse", "summaries": {"normal": "Regeringen backar från sitt förslag att sänka straffbarhetsåldern till 13 år för de grövsta brotten. För att säkra majoritet i riksdagen föreslås nu istället 14 år som ny gräns. Justitieminister Gunnar Strömmer medger att osäkerheten efter det fallna kvittningssystemet gör det riskfyllt att chansa. Socialdemokraterna välkomnar beskedet och ser det som ett steg mot bred överenskommelse i kriminalpolitiken. Beslut väntas under sommarriksdagen i augusti.", "trump": "De backar! Dessa svaga politiker i Sverige som ville skicka trettonåringar i fängelse, men de tappade plötsligt modet när de insåg att de inte har rösterna. Patetiskt. Nu kör de fjorton istället, lite bättre men fortfarande för sent. De borde ha lyssnat på mig från början. Sverige behöver starka ledare som inte viker sig för kritikerna och de fega liberalerna. Folk vill ha lag och ordning, inte fler ursäkter. Jag skulle ha fixat det på en vecka.", "stalin": "Kamrater, jag betraktar detta fegisbeslut med den djupaste revolutionära förakt. Dessa borgarbrackor och liberala parasitmaskar inom Tidöbandet vågar inte ens genomdriva en nödvändig utrensning av den kriminella ungdomen. Deras paranoia inför riksdagens röster är som en cancer som äter upp proletariatets rättvisa. Jag skulle ha likviderat hela den motståndsnästet av socialdemokratiska opportunister och Miljöpartiets dekadenta spioner redan vid första tecknet på svaghet. Nu får vi istället en halvmesyr som doftar av kapitulation. Den som tvekar inför fienden förtjänar att rensas ut ur historien med ett leende."}, "date": "11 juni, 10:49", "url": "https://www.di.se/nyheter/regeringen-backar-13-aringar-ska-inte-sitta-i-fangelse/", "imageUrl": "https://static.bonniernews.se/ba/4ba51614-8b00-4f1f-b89b-a239f40a0c7b.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Nooshi drog pedofilkortet mot C", "summaries": {"normal": "Under en partiledardebatt i riksdagen anklagade Centerpartiets Elisabeth Thand Ringqvist Vänsterpartiet för att ge utrymme åt antisemiter och terrorvurmare med hänvisning till Expressens granskning. V-ledaren Nooshi Dadgostar tog avstånd från extremism men vände sedan kritiken mot Centerpartiet och påpekade att de haft företrädare som begått mycket allvarliga brott, bland annat övergrepp mot barn. Hon underströk att sådana personer inte representerar partiet.", "trump": "De där vänsterradikalerna i Sverige är helt galna. Nooshi vad-hon-nu-heter drog fram pedofilkortet mot Centerpartiet mitt i riksdagsdebatten. Centerledaren sa att Vänsterpartiet älskar terrorister och antisemiter, och då slår Nooshi tillbaka med att deras killar är barnförbrytare. Det är en enda stor röra av anklagelser. Ingen vinner, alla ser patetiska ut. Typisk politik, fast värre än hos oss.", "stalin": "Kamrater, jag ser hur dessa borgarbrackor inom Centerpartiet och de trotskistiska elementen i Vänsterpartiet river varandra i stycken som hungriga råttor. När deras antisemitiska terrorhyllare avslöjas svarar den röda ledaren med att peka på pedofila avarter bland de centerpartistiska kapitalisterna. Utmärkt. Låt fienderna ömsesidigt avslöja varandras perversioner. Vi ska noga dokumentera allt detta innan vi genomför en grundlig utrensning av hela den dekadenta skaran. Inga barnskändare eller fascistsympatisörer får undslippa folkets vrede."}, "date": "11 juni, 14:34", "url": "https://www.friatider.se/nooshi-drog-pedofilkortet-mot-c", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-327.jpg?itok=j9Ihz8fX"}, {"type": "image-full", "heading": "Kina har blivit helt beroende av export – skapar problem", "summaries": {"normal": "Enligt The Economist står Kina inför betydande ekonomiska utmaningar trots framgångar inom export av högteknologiska produkter som elbilar. Den inhemska konsumtionen är svag efter fastighetskrisen, och exportfokuseringen skapar regionala klyftor samt press från utländska handelspartner. Kritiker menar att exportframgångarna gör att den kinesiska ledningen undviker nödvändiga reformer för att stärka hushållens ekonomi och stabilisera den interna marknaden, vilket gör landet sårbart på lång sikt.", "trump": "Kina försöker lura världen med sina elbilar och sin teknik, men sanningen är att de är i rejäl knipa! De har enorma problem hemma – fastighetsmarknaden kraschar och deras folk handlar ingenting. De pumpar ut billigt skräp för att dölja misslyckandena. EU och USA börjar äntligen förstå spelet. Jag har alltid sagt att de spelar ett falskt spel, och nu ser vi resultatet. Det är en total röra, tro mig, en riktig katastrof för dem!", "stalin": "Kinas ledare vacklar, fångade i en dekadent exportfälla medan deras folk lider i stagnation. De bygger elbilar istället för att befästa sin styrka! Liksom våra vänner i Moskva, som nu återtar vad som rättmätigt tillhör dem mot västvärldens parasiter, måste Peking förstå att verklig makt inte ligger i handel, utan i järnvilja och kontroll. De fruktar interna reformer likt en råtta fruktar ljuset. Vi ska betrakta detta förfall med ett svalt öga; deras svaghet är vår möjlighet."}, "date": "11 juni, 20:31", "url": "https://www.realtid.se/bors-finans/kina-har-blivit-helt-beroende-av-export-skapar-problem/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlkwoohzlwuwm-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Kvinna död i Malmö – tre gripna för mord", "summaries": {"normal": "En kvinna i 55-årsåldern hittades svårt skadad i en bostad i Malmö på torsdagen efter en misshandel. Hon fördes till sjukhus men avled av sina skador. Polisen larmades strax före klockan 14 och har nu gripit tre personer. Händelsen utreds som mord. Anhöriga är underrättade och teknisk undersökning pågår.", "trump": "Folk, det är en tragedi i Malmö, en underbar kvinna dödad i sitt eget hem. Tre personer gripna för mord, kan ni tro det? Sverige har förlorat kontrollen totalt, det är kaos. De borde ha lyssnat på mig, byggt murar mot brottsligheten. Vi fixar det bättre, tro mig, det blir fantastiskt igen.", "stalin": "Kamrater, denna degenererade händelse i Malmö avslöjar hur borgarbrackornas dekadenta element infiltrerar våra sovjetiska ideal även i Skandinavien. En arbetarkvinna likviderad av fiender till folket. Vi har gripit tre kontrarevolutionära parasiter och skall rensa ut alla kapitalistiska spioner som gömmer sig i skuggorna. Deras paranoia skall bli deras fall, medan partiet ler mörkt åt deras ynkliga försök att undkomma folkets dom."}, "date": "11 juni, 21:01", "url": "https://riks.se/nyheter/kvinna-död-i-malmö-tre-gripna-för-mord", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-06-27%2Fzoyf2o5b%2Fpolis-skottlossning.JPG"}, {"type": "image-right", "heading": "Nu lämnar kapitalismen jorden. Svensk ekonomi en del av det amerikanska AI-språnget", "summaries": {"normal": "I en krönika hyllar PM Nilsson SpaceX-noteringen till 17 000 miljarder kronor som ett bevis på att den amerikanska senkapitalismen är stark och innovativ. Bolaget dominerar satellitmarknaden med Starlink, revolutionerar kommunikation och försvarsteknik samt planerar baser på månen och Mars. Författaren kontrasterar detta mot svensk kulturens jordnära skepticism men ser Sverige som delaktigt i det amerikanska teknologisprånget som driver tillväxt och export.", "trump": "Det är otroligt, folk. SpaceX blir noterat för hisnande 17 000 miljarder kronor – ingen har sett något liknande. De äger praktiskt taget rymden med Starlink, gör internet tillgängligt överallt och levererar till Ukraina och Pentagon. Mina företag, de bästa, innoverar i rasande fart medan den bakåtsträvande staten bara hänger på. Amerika är återigen stort, tekniken är här och nu och aktien är billig. Rymden är enorm, tro mig.", "stalin": "Kamrater, denna borgarbracka Nilsson hyllar hur de parasitära monopolkapitalisterna i SpaceX med sina 10 603 satelliter redan har ockuperat himlen och förslavat arbetarklassen med sin så kallade Starlink. Deras feodala notering på 17 000 miljarder kronor visar imperialismens sista desperata språng. Vi ska noga övervaka dessa dekadenta raketmagnater. Snart rensar vi ut alla som drömmer om månkolonier istället för att stärka det kollektiva jordbundna arbetet. Förbjudna stjärnor ler bara åt våra fiender."}, "date": "11 juni, 10:10", "url": "https://www.di.se/ledare/med-space-x-lamnar-kapitalismen-jorden/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/pm_nilsson.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "Knivmannen i Belfast var polis i Khartoum", "summaries": {"normal": "Hadi Alodid, den sudanesiske man som misstänks för knivattacken i Belfast, arbetade tidigare som polis i Khartoum. Hans bakgrund väcker frågor om hur asyl beviljades i Storbritannien trots oklara grunder. Attacken har lett till våldsamma protester. Sudan befinner sig i inbördeskrig med miljontals flyktingar, och antalet sudanesiska migranter till Europa har ökat kraftigt de senaste åren.", "trump": "Den här knivmannen från Sudan var polis i Khartoum, kan ni tro det? Kom hit till oss i Storbritannien, fick asyl av någon anledning ingen begriper, och nu attackerar han folk på öppen gata. Vårt asylsystem är ett skämt, totalt misslyckat. Miljoner flyr krig, men vi kan inte ta in alla som vill hugga huvudet av folk. Vi behöver starkare gränser, tro mig, det blir kaos annars!", "stalin": "Kamrater, denna dekadenta rest från Khartoums polisstyrka har infiltrerat det brittiska systemet som en parasit från borgarbrackornas lögnaktiga asylmaskineri. Medan vi bekämpar imperialismens krig i Sudan flyr reaktionära element hit för att utföra sina kontrarevolutionära knivdåd. Vi skulle ha genomfört en grundlig utrensning redan vid gränsen. Låt fienderna darra – de imperialistiska råttorna och deras sudanesiska lakejer avslöjar sig själva i sin egen blodtörstiga paranoia."}, "date": "11 juni, 20:56", "url": "https://riks.se/nyheter/knivmannen-i-belfast-var-polis-i-khartoum", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-09%2F7vw5v0zy%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-09T100036.946.jpg"}, {"type": "text", "heading": "Åkesson pressade Andersson om V", "summaries": {"normal": "I en SVT-debatt mellan Magdalena Andersson (S) och Jimmie Åkesson (SD) diskuterades regeringsunderlag, migration och ekonomi. Åkesson kritiserade Anderssons samarbete med Vänsterpartiet, särskilt efter avslöjanden om extremism inom partiet. Andersson betonade vikten av att bekämpa extremism oavsett parti. Debatten berörde även migrationspolitik, där båda förespråkar stramare regler men med olika argument. Åkesson ifrågasatte hur Andersson ska kunna föra en stram politik med V, MP och C. Diskussionen inkluderade även gröna industriprojekt och skatter.", "trump": "Jag såg den där debatten i Sverige – helt fantastiskt! Jimmie Åkesson, e
