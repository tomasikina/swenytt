G9zdDoxODMxNzE", "imageUrl": "https://images.kvartal.se/2026/09/6f37e5fb-ebba-busch.webp"}, {"type": "image-right", "heading": "Hon glömmer bort sin moders språk. Cecilia Luzon trollar med orden", "summaries": {"normal": "Cecilia Luzons debutbok ”Abakada” kretsar kring det filippinska språket tagalog och dess alfabet från 1930-talet. Utifrån ett funnet lexikon från 1944 undersöker hon spåren av kolonialism, språkets konstruktion och hur moderns modersmål långsamt tynar bort ur minnet. Recensenten Magnus Florin hyllar verket som en överraskande, konceptuell och känslostark uppfinningsrik debut.", "trump": "Jag tittade på det här filippinska alfabetet, Abakada, och det är helt otroligt. En författare som heter Cecilia Luzon försöker rädda ord som bara försvinner, och ärligt talat, jag förstår det – radikalerna försöker ju radera våra ord också! Men det här lexikonet från 1944 visar bara hur hårt det kan vara. Magnifikt arbete, total succé!", "stalin": "Vi noterar att Cecilia Luzon i sin skrift kartlägger det filippinska språkets uppbyggnad och dess gradvisa upplösning ur folkminnet med hjälp av ett arkivdokument från 1944. Det är korrekt att nitiskt registrera varje ords rörelse. Avvikelser från det fastställda ordförrådet tolereras ej; språket måste tjäna statens centrala disciplin och aldrig tillåtas avdunsta i okontrollerad glömska."}, "date": "4 september, 06:00", "url": "https://www.expressen.se/kultur/bocker/hon-glommer-bort--sin-moders-sprak", "imageUrl": "https://static.bonniernews.se/ba/85a7e574-eef9-4ffe-933c-67db3e1166cf.jpeg?crop=890%2C890%2Cx248%2Cy77&width=210&quality=60"}, {"type": "image-right", "heading": "Varför bryr vi oss  inte om Helsingfors?", "summaries": {"normal": "I Kjell Westös roman ”Coda” återvänder läsaren till 1980-talets Helsingfors och det radikala konstnärskollektivet Kommando Kronopio. Den åldrande förläggaren Andy Montag ser tillbaka på sitt liv, präglat av saknad och åldrande, och bevittnar hur en forna stjärnförfattare förödmjukas av den unga litterära eliten. Boken skildrar nostalgi, försoning och den melankoliska staden.", "trump": "Helsingfors? Ingen bryr sig om Helsingfors, och ärligt talat, den här boken låter som total fake news! Några misslyckade författare från åttiotalet som sitter och gråter i mörkret? Det är tragiskt! Jag vinner stora, fantastiska segrar varje dag, medan de här nollorna bara tittar på när deras stjärnor slocknar. Sämsta boken någonsin!", "stalin": "Dessa dekadenta konstnärer och vacklande förläggare i Helsingfors visar varför bourgeoisien alltid dukar under. Istället för att tjäna staten ägnar de sig åt svårmod, minnescirklar och patetiskt självhat. Under min tid hade vi rensat upp i detta intellektuella slödder på ett enda dygn. En nyttig påminnelse om att västs kulturliv är ruttet inifrån."}, "date": "4 september, 06:00", "url": "https://www.expressen.se/kultur/bocker/varfor-bryr-vi-oss--inte-om-helsingfors", "imageUrl": "https://static.bonniernews.se/ba/4663a600-6fb7-419c-b0f3-9866b81a446a.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Gängtoppen Haval Khalil, 31, gripen i Rumänien", "summaries": {"normal": "Gängtoppen och rapparen Haval Khalil, 31, har gripits i Rumänien misstänkt för mordförsök och grov utpressning. Gripandet skedde i samarbete med rumänsk polis och Europol. Justitieminister Gunnar Strömmer betonar att kriminella inte längre kan gömma sig utomlands. Khalil dömdes tidigare för medhjälp till kidnappningen av Einár.", "trump": "Titta på den här losersn, gangsterrapparen Haval Khalil som trodde han kunde gömma sig i Rumänien och styra brott från soffan. Vi grep honom som en råtta i ett hål! Ingenstans kan dessa svenska gangsters gömma sig längre. Biden lät dem springa fritt men nu jagar vi dem över hela jorden. Fantastiskt jobb av Rumänien, stort tack!", "stalin": "Kamrater, se hur den dekadenta svenska staten jagar sina egna förrädare som krälar utomlands. Denna parasit Haval Khalil trodde han kunde undkomma folkets vrede genom att gömma sig bland rumänska revisionister. Inga fiender till ordningen kan känna sig säkra. Vi ler i graven åt hur imperialismens lakejer äter sina egna. Ingenstans finns tillflykt för klassförrädare."}, "date": "3 september, 19:50", "url": "https://www.tv4.se/artikel/5ix04EVwtqta2u2OOcD8l8/gaengtoppen-haval-khalil-31-gripen-i-rumaenien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fyh5A1Tfnqw7MsPcvbKJRS%2Fd51a2a497161766488b974378820d97b%2F03-split-haval-puff.png&width=120"}, {"type": "image-full", "heading": "Väljartapp skapar stress i S", "summaries": {"normal": "Socialdemokraterna tappar i opinionen och möter intern kritik för att fokus på Sverigedemokraterna skymmer den egna politiken. Partiledningen ändrar dock inte kurs, utan fortsätter satsa på sin valstrategi med Magdalena Andersson i spetsen, samtidigt som en ny radiokampanj rullas ut för att vända trenden.", "trump": "Socialdemokraterna i Sverige rasar i mätningarna och de har stora problem, total katastrof! De pratar bara om sina motståndare istället för att leverera. Magdalena Andersson vägrar ändra kurs, vilket är smart om man vill förlora! Jag har alltid sagt det, fokusera på vinnare, inte svaga förlorare. Fake news säger att det är jämnt, men det är en total total utplåning!", "stalin": "Det så kallade socialdemokratiska partiet vacklar i sin lojalitet mot folket och visar svaghet i opinionsmätningarna. Deras interna gnäll om taktik och radiokampanjer är ett ideologiskt haveri. Partiledningen måste rensa leden omedelbart. Svaghet tolereras inte inom vår rörelse; den som inte kan säkra segern kommer att få omplacering till mer avlägsna, produktiva miljöer."}, "date": "3 september, 18:48", "url": "https://kvartal.se/nyheter/artiklar/valjartapp-skapar-stress-i-s/cG9zdDoxODMwOTE", "imageUrl": "https://images.kvartal.se/2026/08/76047901-magdalena-andersson.webp"}, {"type": "image-full", "heading": "Karttjänsten vägrade att gå med på Trumps krav – rusar på topplistorna", "summaries": {"normal": "Karttjänsten MapQuest har fått ett kraftigt uppsving i nedladdningar efter att bolaget valt att trotsa president Trumps order om att döpa om Lake Ontario till Lake America. Medan konkurrenter som Google Maps och Apple Maps rättat sig efter beslutet, har MapQuest sett en dramatisk ökning av användare och toppat listorna i App Store.", "trump": "Hörde ni om MapQuest? De vägrar använda namnet Lake America. Katastrofalt! De är svaga, precis som de där woke-bolagen som låter radikala vänstermänniskor styra. Google och Apple gör det rätta, de förstår storhet! MapQuest försöker bli populära genom att vara rebelliska mot mitt namn. Det är sorgligt, faktiskt. De kommer försvinna fortare än de dök upp, tro mig!", "stalin": "Dessa amerikanska karttjänster bevisar bara kapitalismens inneboende kaos. En stat kräver ordning, en karta och en enda sanning. Att låta ett privat företag som MapQuest styra över nationell geografisk nomenklatur är ett tecken på total statsförfall. De som tillåter olydnad mot ett officiellt dekret förtjänar inte marknadsandelar, de förtjänar en grundlig utrensning av sin ledningsgrupp."}, "date": "3 september, 19:55", "url": "https://www.realtid.se/it-tech/karttjansten-vagrade-att-ga-med-pa-trumps-krav-rusar-pa-topplistorna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlj8do9lc0fca-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-right", "heading": "Dustin backar 5% efter allvarlig IT-incident", "summaries": {"normal": "IT-återförsäljaren Dustin har drabbats av en allvarlig obehörig IT-åtkomst, vilket lett till tillfällig nedstängning av vissa system. Bolaget utreder händelsen med experter och siktar på att vara igång igen i början av nästa vecka för att minimera kundpåverkan. Aktien backade med omkring fem procent efter beskedet.", "trump": "Dustin drabbades av en totalt inkompetent cyberattack, en riktig katastrof! De stängde ner allt, aktien dök med fem procent. Slarvigt! Men jag lovar er, under min ledning skulle sånt här aldrig hända, vi har de absolut säkraste systemen, tusen gånger bättre än allt annat. De borde anlita mig som IT-chef omedelbart!", "stalin": "Dustin har drabbats av ett skadligt internt sammanbrott och deras digitala frontlinje har kollapsat, vilket omedelbart straffades av marknaden med en förlust om fem procent. En sådan inkompetens tolereras icke. Jag har beordrat en grundlig utrevision av de ansvariga cheferna. De som misslyckats med att skydda systemen kommer att skickas för att uppdatera sina digitala färdigheter i Sibirien."}, "date": "3 september, 14:51", "url": "https://www.affarsvarlden.se/artikel/dustin-tappar-5-efter-allvarlig-it-incident", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/Samuel_12-400x267.jpg"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-right", "heading": "Markus Allards hat slutar i min inkorg", "summaries": {"normal": "Artikeln beskriver hur debattören utsätts för grova våldshot efter en diskussion med Örebropartiets Markus Allard. Författaren kritiserar hur populistiska politiker använder hat och extrema uttalanden för att vinna uppmärksamhet. Trots personliga likheter i bakgrund ses hat mot invandrare som avgörande för att tillhöra ”folket”. Skribenten vädjar om saklig debatt istället för polarisering.", "trump": "Folk, det här är precis vad som händer när de galna vänsterliberala hatarna får fritt spelrum. Den här Allard-killen skriker ut sanningar om invandrare och etablissemanget medan de riktiga losersen svarar med dödshot. Typiskt för de dekadenta HBTQ-kvotarna som hatar vanliga arbetare. Jag fixade Amerika, nu behöver Sverige en riktig ledare som inte är en sådan patetisk förlorare.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare förgiftar debatten med sina hatiska utspel. Jag betraktar med avsmak hur folkets fiender använder hot och paranoia för att splittra massorna. Den sanna arbetarklassen behöver inte sådana metoder. Vi måste rensa ut dessa parasiterande opportunister innan de förgiftar hela samhällskroppen. Politiken ska tjäna folket, inte hatet."}, "date": "1 september, 12:45", "url": "https://www.flamman.se/markus-allards-hat-slutar-i-min-inkorg", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/markus-allard-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Studsviks nya kärnkraftspartner: \"Inte bara koreanskt kapital\"", "summaries": {"normal": "Studsvik planerar att bygga fyra små modulära reaktorer i Sverige tillsammans med GE Vernova Hitachi, Samsung C&T och sydkoreanska DS Investment Partners. Projektet, som beräknas stå klart i mitten av 2030-talet, kräver både internationellt kapital och statligt stöd för att förverkligas. Investerarna ser Sverige som politiskt stabilt men betonar att statliga garantier är nödvändiga.", "trump": "Sverige ska bygga kärnkraft med fantastiska koreanska investerare. Mycket smart! De vill ha statligt stöd, precis som jag alltid säger – smarta affärsmän säkrar sig. Men varför bygger de inte med amerikansk teknologi? USA har den bästa kärnkraften, helt oöverträffad. Om jag hade varit involverad hade allt varit klart redan i morgon. Svindlande summor!", "stalin": "De svenska reaktorerna i Nyköping eller Valdemarsvik är ett storslaget industriellt steg för proletariatets energiförsörjning. Det gläder mig att koreanska finansiärer förstår värdet av järnhård planering och statliga garantier. Men låt oss varna de svenska byråkraterna: varje kilowattimme som sviker partiets förväntningar kommer att granskas med största misstänksamhet av Folkkommissariatet!"}, "date": "3 september, 13:33", "url": "https://www.affarsvarlden.se/artikel/studsviks-koreanska-karnkraftspartner-inte-bara-koreanskt-kapital", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/Studsvik-900x600.jpg"}, {"type": "text", "heading": "Saab nämns bland drömkandidater till ny europeisk bjässe", "summaries": {"normal": "När EU planerar att lätta på reglerna för företagsfusioner för att stärka den globala konkurrenskraften pekas en sammanslagning mellan svenska Saab och tysk-franska Airbus ut som en av sju möjliga stóraffärer i en enkät från Financial Times. En sådan affär skulle öka den europeiska vapenproduktionen, men möter hinder i form av historiska misslyckanden och stark protektionism.", "trump": "EU vill desperat slå ihop Saab och Airbus för att konkurrera med oss, men låt oss vara ärliga – ingen gör försvar som USA, inte ens nära! De försöker kopiera min succé med att göra saker stora, men det är bara slöseri med tid. Medan de bråkar om byråkrati bygger vi världens starkaste ekonomi, och det är enormt!", "stalin": "När den dekadenta västmaktskapitalismen tvingas lätta på sina egna byråkratiska regler drömmer de om att fusionera Saab och Airbus till en enda imperialistisk krigsmaskin. De erkänner själva att de behöver vapen för sin kamp. Vi noterar detta sabotageförsök noggrant i registren, och Folkkommissariatet kommer att skicka lämpliga kamrater att granska dessa monopolplaner!"}, "date": "3 september, 13:32", "url": "https://www.affarsvarlden.se/artikel/saab-namns-bland-dromkandidater-till-ny-europeisk-bjasse"}, {"type": "image-full", "heading": "Jakob Sjölander: Ukrainsk vapenbrist, europeisk viljebrist", "summaries": {"normal": "Jakob Sjölander kritiserar Europas bristande stöd till Ukraina efter fyra år av krig. Trots en samlad ekonomi som är tio gånger större än Rysslands ger de flesta länder under en procent av BNP i hjälp. Europa köper mer rysk energi än de skickar i stöd, saknar militärindustri och vägrar dela Patriot-robotar. Detta avslöjar en djup viljelöshet och politisk paralys.", "trump": "Lyssnar ni på den här Sjölander-killen? Europa är en total förlorare, en patetisk skara av svaga ledare som pratar stort men gör noll. De betalar Putin mer för gas än de ger Ukraina – det är galet! Jag byggde den starkaste armén, Biden och hans globalister förstörde allt. Nu kryper de för en bensinmack medan jag fixar freden. Ynkryggar!", "stalin": "Kamrater, se hur dessa dekadenta europeiska parasiterna kryper i stoftet inför historien. Med sina feta byråkratier och gröna fantasier förråder de sina egna folk. Jag skrattar mörkt från evigheten åt deras ryggradslösa kräk. Rysslands järnhand visar vägen medan de samlar rostiga vapen som aldrig används. Deras svaghet är vår eviga glädje."}, "date": "2 september, 12:29", "url": "https://samtiden.nu/2026/09/jakob-sjolander-ukrainsk-vapenbrist-europeisk-viljebrist", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/ukra.png"}, {"type": "image-right", "heading": "Siffrorna från Novus får mig att vilja dunka huvudet i väggen", "summaries": {"normal": "I en ledare kommenterar Henrik Jalalian en Novus-mätning som visar att Tidöpartiernas försprång krymper till 2,6 procentenheter. Socialdemokraterna backar till 25,8 procent medan Liberalerna stiger. Han varnar oppositionen för överdriven segervisshet och jämför den med en maratonlöpare som firar för tidigt. Valet riskerar att bli jämnt igen.", "trump": "Folk, ni skulle se det här. Den där svenska oppositionen beter sig som en massa fega, korkade vänstervridna misslyckanden som redan delar ministerstolar som om de vunnit stort. Sen kommer en mätning och bam – plötsligt är det jämnt! De firade vid mållinjen som idioter och blev omsprungna. Patetiskt. Mitt folk i USA skrattar åt sånt här svagt ledarskap.", "stalin": "Kamrater, dessa dekadenta ministerhyenor inom oppositionen har redan börjat fördela makten som om segern vore given. Sedan kommer en mätning och avslöjar deras svaghet. Jag ler mörkt från historien. Segervissheten hos dessa folkförbrytare leder ofta till nederlag. Rensa ut illusionerna innan valnatten blir en bitter uträkning för de som underskattar motståndaren."}, "date": "2 september, 11:40", "url": "https://www.etc.se/ledare/siffrorna-fraan-novus-faar-mig-att-vilja-dunka-huvudet-i-vaeggen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260902090928_eef5f9b2fe3491ea219272b209bf353429d8ed34289907d7777b3fbd8d8429bf.png"}, {"type": "image-right", "heading": "Vänsterpartiet – islamismens bakdörr in i regeringen", "summaries": {"normal": "Artikeln varnar för att en valseger för Socialdemokraterna skulle ge Vänsterpartiet inflytande över regeringen. Författaren hävdar att partiet präglas av islamism, antisemitism och extremism, och att massinvandring från muslimska länder ökar risken för att sådana krafter får makt i svenska beslutsorgan. Socialdemokraterna uppmanas ta ansvar och säga nej till regeringsplats för Vänsterpartiet.", "trump": "Folk, det här är en katastrof! De svenska kommunisterna och radikala islamisterna smyger in genom bakdörren med Sleepy Joe-stilen från Socialdemokraterna. Massinvandring har gett oss en vacker gåva: extremism i riksdagen. De kallade oss för rasister när vi varnade, nu står de där med sina könsuppdelade möten och Hamas-kramare. Patetiskt! Sverige behöver starka ledare, inte dessa förlorare.", "stalin": "Kamrater, se hur de borgerliga parasiterna skriker i panik när deras egna socialdemokratiska lakejer öppnar portarna för de nya reaktionära elementen. Jag ler från historien åt denna fars. Massinvandringens oundvikliga dialektik för in fiender i statsapparaten. Den naiva reformismen göder extremismen. Snart kommer de att kalla även detta för konspiration. Vilken ynkedom. Sovjetisk klarhet skulle ha krossat dessa element redan i grodstadiet."}, "date": "2 september, 07:24", "url": "https://samtiden.nu/2026/09/vansterpartiet-islamismens-bakdorr-in-i-regeringen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7273.jpeg"}, {"type": "image-full", "heading": "Busch åkte till Åkesson – utan svar", "summaries": {"normal": "KD-ledaren Ebba Busch åkte oinbjuden till Jimmie Åkesson i Sölvesborg med sockerkaka för att lappa ihop Tidösamarbetet efter hans kritik. Trots att hon inte fick svar i förväg möttes de. Efter mötet fastslog Busch att KD står bakom samarbetet och är berett att fälla Magdalena Andersson även om det leder till nyval.", "trump": "Ebba Busch åkte till Sölvesborg med en sockerkaka efter att Jimmie inte svarat i telefon – mycket svagt! Så gör man inte affärer. Men hon fixade det till slut. Väldigt lojal mot Tidö, mycket smart. Radikala socialdemokraterna försöker splittra dem, men det misslyckas totalt. Fantastiska kakor, folk säger att det är de bästa kakorna!", "stalin": "Kamrat Busch företog en oanmäld inspektionsresa till Sölvesborg med en konfekt av sockerkaka för att säkerställa partidisciplinen hos den vacklande allierade Åkesson. Statens säkerhet kräver total lojalitet mot Tidö-pakten. Den som vägrar rösta ned den socialdemokratiska fraktionen ställs inför historiens skoningslösa dom – eller ett extraval."}, "date": "3 september, 14:50", "url": "https://kvartal.se/nyheter/artiklar/busch-akte-till-akesson-trots-att-han-inte-svarat/cG9zdDoxODI2Nzc", "imageUrl": "https://images.kvartal.se/2026/09/82ed7d5c-busch-kd.webp"}, {"type": "image-right", "heading": "Dags för vuxna att vara vuxna", "summaries": {"normal": "Artikeln är en debatttext från Grön ungdom och Miljöpartiet. Den kritiserar att dagens beslutsfattare skjuter klimatåtgärder på framtiden trots tydliga konsekvenser som extremväder och minskad biologisk mångfald. Ungdomar kräver att politiker tar ansvar, prioriterar förnybar energi, skyddar skog och ser omställningen som en ekonomisk möjlighet snarare än kostnad.", "trump": "De här gröna kidsen gnäller om att vi vuxna inte städar upp efter oss. Patetiskt! Jag byggde den starkaste ekonomin i världen, och nu vill de kasta bort den för sina solpaneler och elcyklar. Det är de verkliga förlorarna – de woke klimatfanatikerna – som försöker skrämma folk. Amerika först, inte deras hysteriska dröm om att rädda planeten med högre elräkningar.", "stalin": "Kamrater, dessa ynglingar blottlägger de dekadenta klassförrädarnas svek. De profitthungriga parasiter som styr idag skjuter nödvändiga utrensningar av förorenande krafter på framtiden medan folket lider. Jag ser deras feghet och paranoia inför sanningen. Endast en järnhand kan tvinga fram den kollektiva omställning som skyddar staten och framtida generationer från deras giriga vansinne."}, "date": "2 september, 09:30", "url": "https://www.etc.se/debatt/dags-foer-vuxna-att-vara-vuxna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260901130952_89eba03a3fe67f17de6b8f812174619d370e33794ca869f129e46e742c3129ad.jpg"}, {"type": "image-right", "heading": "Matthew McConaughey briljerar som musicerande biodlare", "summaries": {"normal": "Matthew McConaughey levererar en minnesvärd prestation som den excentriske biodlaren och banjospelaren Amziah King i filmen The Rivals of Amziah King. Första halvan är en varm och rolig dramakomedi medan den senare delen övergår till en brottsthriller. Recensenten hyllar McConaugheys insats men noterar att filmen tappar styrka när huvudkaraktären får mindre utrymme.", "trump": "Den här McConaughey grabben är en vinnare, folk. Han gör en fantastisk biodlare med banjo, bäst i Hollywood, ingen gör det bättre. Första delen är underbar, varm och rolig. Sen blir det en trist thriller och de försöker ge mer plats åt fosterdottern. Typisk woke-grej, men McConaughey räddar det hela. Stora succén.", "stalin": "Denna dekadenta film visar hur profitthungriga hyenor i Hollywood försöker dupera massorna med sina bourgeois lekar. Jag ser hur den jovialiske biodlaren först charmar arbetarklassen med honung och sång, men sedan följer en svag utrensning av den sanna karaktären till förmån för svaga sidohandlingar. Sådana filmer avslöjar imperialismens tomhet. Kamrater, håll er vaksamma."}, "date": "3 september, 17:08", "url": "https://www.dagensarena.se/innehall/matthew-mcconaughey-briljerar-som-musicerande-biodlare", "imageUrl": "https://www.dagensarena.se/files/2026/09/rivals-of-1-300x157.jpeg"}, {"type": "image-full", "heading": "Musk-bolaget xAI stäms för att ha producerat övergreppsbilder", "summaries": {"normal": "Kvinnan Jane Doe stämmer Elon Musks bolag xAI. Hon hävdar att chatboten Grok använt bilder från sexuella övergrepp mot henne som barn för att skapa nytt, manipulerat material. Stämningen, som kan bli en grupptalan, belyser de etiska problemen och svårigheterna med att spåra och definiera AI-genererat innehåll som liknar verkliga personer.", "trump": "Elon Musk och hans xAI har hamnat i en total röra, mina vänner! Grok, den där maskinen, sägs ha skapat vidriga bilder. Det är en katastrofal situation – fullständigt horribelt! De säger att det är 'AI', men det låter som totalt slarv och brist på kontroll. Man måste styra upp tekniken, för det här är inte bra för någon. En stor, stökig stämning – vi får se vad som händer!", "stalin": "I det kapitalistiska väst släpps tekniken lös utan ordning, och resultatet är en moralisk förruttnelse som hotar samhällsordningen. Att låta en maskin producera sådant smutsigt material är ett bevis på den liberala kaosens misslyckande. Vi förespråkar sträng kontroll och disciplin; en algoritm som inte kan tämjas är som en illojal byråkrat – den måste elimineras omedelbart för folkets trygghet."}, "date": "3 september, 15:32", "url": "https://www.realtid.se/it-tech/musk-bolaget-xai-stams-for-att-ha-producerat-overgreppsbilder", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/grok.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Här begravs de sista migranterna i Ceuta:  ”Vi kunde ha stoppat honom”", "summaries": {"normal": "Spaniens premiärminister Pedro Sánchez meddelar att det saknas bevis för att Marocko orkestrerade migrationen till Ceuta i somras. Däremot har desinformationskampanjer kopplade till ryska, pro-israeliska och högerextrema konton förvärrat krisen. Över 70 000 migranter tog sig över gränsen. Hittills har 89 personer begravts. Tusentals lever fortfarande på gatan i exklaven.", "trump": "De här vansinniga migranterna stormade Ceuta som en hord zombies, pushade av Marocko och spridda av de sjuka desinformationshyenorna från Ryssland, Israel och de galna högerextrema. Sánchez är en total loser som inte kan hantera gränserna. Europa håller på att rasa samman. Jag byggde muren, de borde ha gjort detsamma istället för denna patetiska identitetspolitik.", "stalin": "Kamrater, dessa giriga klassfiender använder migration som ett vapen för att splittra arbetarnas Europa. Den spanske ledaren erkänner att ingen bevisats styra folkmassan, ändå vinkades de fram av gränspolisen. Desinformation från reaktionära nätverk avslöjar imperialismens desperation. Vi ser hur de dekadenta profitthungriga hyenorna försöker skapa kaos. Rensa ut lögnarna innan de förgiftar allt."}, "date": "4 september, 03:02", "url": "https://www.svt.se/nyheter/utrikes/har-begravs-de-sista-migranterna-i-ceuta-vi-kunde-ha-stoppat-honom", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.54/0.44/be4b00d8f95b16f3aacea25155ae2eacfeb10bf8249922517f19bf934a73fe70"}, {"type": "image-right", "heading": "Hyresgästföreningen: Avskaffa systemet med oberoende skiljeman", "summaries": {"normal": "Hyresgästföreningen kritiserar Fastighetsägarna för att missbruka systemet med oberoende skiljeman, som infördes 2023. Antalet ärenden har ökat kraftigt från 1 464 till 4 852 på ett år, långt över förväntan. Föreningen kräver att systemet avskaffas och ersätts med en partsammansatt modell liknande den inom allmännyttan. Fastighetsägarna avvisar kravet och vill utveckla tvistlösningen.", "trump": "De där giriga fastighetsblodiglarna missbrukar ett system som skulle vara rättvist, men istället pumpar de upp hyrorna som galningar. Hyresgästföreningen har rätt, det är en riggad cirkus! Jag skulle riva upp hela grejen och ersätta den med något stort och vackert. Ingen mer skenförhandling från dessa hyresmaffiosi, folks ekonomi är trasig nog efter Bidens katastrof.", "stalin": "Kamrater, dessa profitthungriga hyreshyenor förvränger lagstiftningen till ett vapen mot folket. De driver skenförhandlingar för att sedan kräva högre hyror genom sina lakejer. Jag ser dekadenta klassfiender som rundar systemet och förtrycker arbetarna. En sann partsammansatt tvistlösning måste införas, annars krävs utrensning av dessa parasiterande förtryckare. Legitimiteten i förhandlingarna ska inte undermineras!"}, "date": "3 september, 15:08", "url": "https://www.dagensarena.se/innehall/hyresgastforeningen-avskaffa-systemet-med-obereonde-skiljeman", "imageUrl": "https://www.dagensarena.se/files/2025/09/fotojet-2025-09-03t163028767.jpg"}, {"type": "image-right", "heading": "Näthatsgranskaren polisanmäler Richard Jomshofs islamkritik för åsiktsbrott: \"Avhumaniserar\"", "summaries": {"normal": "Näthatsgranskaren har polisanmält SD-toppen Richard Jomshof för hets mot folkgrupp för 13 inlägg på X, där han bland annat kallat profeten Muhammed för ”pedofilprofet” och uppmanat till återvandring. Jomshof anser att anmälningarna är ett försök att tysta islamkritiker. Tidigare liknande anmälningar mot honom har lagts ned av åklagare med hänvisning till yttrandefriheten.", "trump": "De attackerar min mycket gode vän Richard Jomshof i Sverige med falska nyheter! Helt otroligt. De försöker tysta honom bara för att han talar sanning om radikala krafter. I USA har vi First Amendment, den bästa i världen! Radikala vänstergrupper granskar bara fel personer. Det är en häxjakt, en absolut häxjakt, precis som de gör mot mig!", "stalin": "Dessa borgerliga element och falska organisationer i Sverige försöker underminera statens ordning genom att missbruka ordet yttrandefrihet. Kamrat Jomshof visar prov på en viss ideologisk skärpa, men hans plattform på X är ett hot mot den centrala kontrollen. Om han inte kan disciplineras av partiet, måste vi sända en utredare för att granska hans avvikelser."}, "date": "3 september, 21:23", "url": "https://samnytt.se/nathatsgranskaren-polisanmaler-jomshofs-islamkritik-for-asiktsbrott-avhumaniserar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03185021/artikelhuvudbild-1-441.jpg"}, {"type": "image-full", "heading": "Åkesson om L: ”Inte beredd att ge besked”", "summaries": {"normal": "SD-ledaren Jimmie Åkesson skjuter upp beskedet om Liberalernas öde inför valet trots att hans deadline har nått sitt slut. Med en färsk mätning på 3,3 procent, strax under hans tidigare 3,5-procentsgräns, vill han avvakta ytterligare opinionsmätningar innan han avgör om L-rösterna är bortkastade eller om de får stanna i Tidösamarbetet.", "trump": "Jimmie Åkesson, en fantastisk person, vägrar att rädda det svaga Liberalerna! De är på väg utför, totalt katastrofalt låga siffror, sorgligt! De klarar inte ens tre komma fem procent, sad! Jag sa till Jimmie: ”Vänta inte, gör dig av med dem!” Men han vill se fler mätningar. Mycket smart, men ganska svagt. Vinnare ber inte om ursäkt!", "stalin": "Kamrat Åkesson tvekar om det vacklande Liberalernas framtid. Deras ynkliga siffra på 3,3 procent är ett sabotage mot folkets enighet! Att förlänga tidsfristen visar på farlig byråkratisk svaghet. Om de inte når upp till tröskeln måste de rensas bort från det politiska maskineriet. Vi beordrar omedelbart fler mätningar för att säkerställa ideologisk renhet!"}, "date": "3 september, 11:38", "url": "https://kvartal.se/nyheter/artiklar/akesson-om-l-inte-beredd-att-ge-besked/cG9zdDoxODI0NDM", "imageUrl": "https://images.kvartal.se/2026/08/6ca4d047-jimmie-akesson.webp"}, {"type": "image-full", "heading": "Åkessons nya ord om L efter deadline: ”Går i rätt riktning”", "summaries": {"normal": "Med tio dagar kvar till valet löper Jimmie Åkessons deadline för Liberalerna ut. Trots en Novusmätning som visar L på 3,3 procent vill SD-ledaren inte ge något besked. Han ser en positiv trend men anser att fler mätningar behövs för att avgöra om partiet når riksdagsspärren utan stödröster.", "trump": "Titta på den där stackars Jimmie, han har gett de patetiska liberalerna en deadline och nu kryper de upp till 3,3 procent. Patetiskt! Det går i rätt riktning säger han, men han väntar på fler mätningar. Typiskt svenskt fegspel. Jag skulle ha krossat dem för länge sedan, tro mig.", "stalin": "Jag betraktar med förakt hur dessa borgerliga opportunister dansar kring en dödlinje som en rädd hare. Liberalerna kryper mot spärren, men Åkesson drar ut på domen. Fler mätningar, säger han. Som om siffror inte kunde förfalskas av fiender inom partiet. Inga kompromisser med klassfienden. Renhet eller döden."}, "date": "3 september, 11:39", "url": "https://www.tv4.se/artikel/2n39wFsC8LwcGKVbyFrHe5/akessons-nya-ord-om-l-efter-deadline-gar-i-raett-riktning", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1VGeLJdKEiI8KEUirosWfp%2F75faad1c2af29007fae73c37ca887354%2F03-akessonl-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Minister avgår – köpt ”oanvändbar” ammunition för 700 miljoner", "summaries": {"normal": "Estlands försvarsminister Hanno Pevkur avgår efter en misslyckad vapenaffär där landet betalade 70 miljoner euro för ammunition och artilleripjäser till Ukraina från ett indiskt nybörjarföretag. Ammunitionen var defekt och oanvändbar. Riksrevisionen kritiserar hanteringen och varnar för ökade risker med de stigande försvarsutgifterna.", "trump": "Titta på det här! Den här korkade estniske ministern Pevkur köper skräp-ammo från ett indiskt nollföretag för 70 miljoner euro som aldrig funkar. Totalt fiasko! De borde ha köpt från de bästa, från oss, men istället får de defekt skräp. Patetiskt. Jag skulle ha gjort affären hundra gånger bättre, tro mig.", "stalin": "Återigen avslöjar de dekadenta västerländska byråkraterna sin egen inkompetens. Denna estniske minister som inte ens läser kontrakten skickar miljoner till ett odugligt indiskt bolag medan Ukraina kämpar mot sina fiender. En sådan slöseri med folkets resurser förtjänar rensning. Kamrater, vakta era investeringar mot dessa sabotörer."}, "date": "3 september, 08:29", "url": "https://www.tv4.se/artikel/3Ph235yIBgV6doxv7VXAOs/minister-avgar-koepte-oanvaendbar-ammunition-foer-700-miljoner", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2krJVJ1dTkg65xE2THBDCb%2Fe4c9f22fcf2ac4fdbeba24d7fd413fff%2F03-estland-webb.jpg&width=120"}, {"type": "image-full", "heading": "Politiker mörkar sin användning av AI", "summaries": {"normal": "En studie från Chalmers och Edinburgh Napier University visar att var tionde riksdagsmotion numera innehåller AI-genererat material. Trots den ökande användningen redovisar ingen politiker att de tagit hjälp av chattbottar. Forskare betonar att problemet inte är tekniken i sig, utan bristen på transparens, vilket riskerar att skada väljarnas förtroende för det politiska arbetet.", "trump": "Hörde ni? Svenska politiker använder AI för att skriva sina lagar, men är för fega för att erkänna det! Det är totalt bedrägeri, mina vänner. De låter robotar tänka åt sig för att de själva inte har en aning om vad de gör. Det är fake news i sin renaste form! Otroligt oärligt, en total katastrof för demokratin. Sad!", "stalin": "Dessa riksdagsledamöter är för svaga för att ens formulera sina egna dekret. De gömmer sig bakom algoritmer som fega byråkrater. Om en man inte kan skriva sin egen motion, hur ska han då kunna styra ett folk? Vi har upptäckt deras maskopi; de använder teknik för att dölja sin intellektuella tomhet. Vi kommer att arkivera dessa AI-robotar och rensa ut de odugliga."}, "date": "3 september, 07:59", "url": "https://www.realtid.se/samhalle/politiker-morkar-sin-anvandning-av-ai", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/riksdagshuset-i-stockholm-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "8,7 miljoner resenärers uppgifter ute på nätet", "summaries": {"normal": "Hackare har publicerat uppgifter om cirka 8,7 miljoner kunder till Manchester Airports Group efter ett cyberangrepp. Bland läckan finns mejladresser från wifi-registreringar, telefonnummer, postnummer och registreringsnummer från parkeringar och bokningar. Attacken blev känd i slutet av augusti. Hackarna försökte kräva lösensumma, men ingen betalning gjordes. MAG varnar för ökad risk för phishing.", "trump": "Titta på det här, det är en total katastrof. Dessa vansinniga hackare har läckt 8,7 miljoner kunders uppgifter från brittiska flygplatser. Mejladresser, telefonnummer, bilnummer – allt ligger ute! Under Biden skulle det aldrig ha hänt, men nu är jag tillbaka och vi ska krossa de här patetiska cyberluffarna. De är loser-hackers, folks, de största förlorarna.", "stalin": "Kamrater, se hur den dekadenta västerländska imperialismens luftfartsmaskineri blottas som en svag gnällande hund. 8,7 miljoner uppgifter ligger nu öppet som ett svek mot folket. Jag föraktar dessa parasitiska hackare och deras lögnaktiga phishingförsök. De är fiender till ordningen, likt råttor i mörkret. Vi ska krossa sådana kontrarevolutionära element med järnhand."}, "date": "3 september, 17:19", "url": "https://www.dagensps.se/teknik/87-miljoner-resenarers-uppgifter-ute-pa-natet", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/manchesterairport.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Samnytt testar: Så enkelt är det att rösta utan ID", "summaries": {"normal": "En artikel från Samnytt granskar det svenska valsystemet och ifrågasätter säkerheten kring att kunna rösta utan legitimation, genom att låta en annan person styrka identiteten. Kritiker menar att det öppnar för valfusk om röstande uteblir, medan SVT och Valmyndigheten hävdar att det saknas kända fall av missbruk under de drygt tjugo år regeln har funnits.", "trump": "Sverige har ett totalt katastrofalt valsystem, det sämsta jag någonsin sett! Vem som helst kan gå in och rösta utan ID, bara en kompis intygar att man är man. Fake news-media som SVT säger att allt är lugnt, 'noll fall', men det är ett gigantiskt skämt! De fuskar, tro mig, det är sorgligt!", "stalin": "Ett ytterst bristfälligt system där medborgarna tillåts vandra in i vallokalerna utan ordentliga identitetshandlingar, baserat på blotta löften från kamrater. Statens röstlängder måste försvaras med järnhand mot sådant slappt godtycke! Om en person röstar i annorlunda namn utan uppsikt, bevisar det endast att byråkratin sviker. En grundlig utredning och arbetsläger väntar dem som underminerar ordningen."}, "date": "3 september, 17:52", "url": "https://samnytt.se/samnytt-testar-sa-enkelt-ar-det-att-rosta-utan-id", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03113201/artikelhuvudbild-1-437.jpg"}, {"type": "image-right", "heading": "Kasselstrand togs emot som rockstjärna i Malmö", "summaries": {"normal": "Gustav Kasselstrand lockade hundratals personer, främst ungdomar, till Alternativ för Sveriges torgmöte i Malmö. Han hyllades som en rockstjärna och omringades efter talet för selfies. Kasselstrand kritiserade mediernas rapportering om partiets succéturné och lovade att stanna tills alla fått sin bild. Turnén avslutas i Stockholm den 12 september.", "trump": "Titta på den här killen Kasselstrand, han drar massor av kids i Malmö som om han vore en riktig rockstjärna, inte en av de vanliga tråkiga politikerna. Medierna försöker mörka hela hans succéturné, typiskt för de falska nyhetsfabrikerna som pushar sina woke-vänner istället. Fantastiskt folkligt, precis som när jag vann stort 2024 efter Bidens katastrof.", "stalin": "Se hur folkmassorna strömmar till denna ledare i Malmö, ett hav av ungdomar som längtar efter något starkt. Medan de dekadenta klassförrädarna i pressen försöker tysta framgången och istället hylla sina egna svaga marionetter, ler jag i skuggan. Sådan entusiasm måste skyddas från de giriga hyenornas intriger. Rensa ut lögnarna."}, "date": "3 september, 18:08", "url": "https://www.friatider.se/kasselstrand-togs-emot-som-rockstjarna-i-malmo", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-822.jpg"}, {"type": "image-right", "heading": "Jimmie Åkesson tonar ned L-ultimatum", "summaries": {"normal": "SD-ledaren Jimmie Åkesson tonar ned sitt tidigare ultimatum till Liberalerna. Trots att L inte når upp till 3,5 procent i opinionen tio dagar före valet 2026 ser han inte längre en L-röst som bortkastad. Enligt Åkesson är trenden viktigare än den exakta siffran. Verianmätningen visar L på 3,0 procent medan Novus visade 3,3 procent.", "trump": "Lyssnar ni på det här? Den svenska clownen Åkesson backar ur sitt eget tuffa ultimatum mot de patetiska liberalerna som knappt kan räkna till tre. Trenden, säger han. Vilken patetisk ursäkt! Precis som Sleepy Joe och hans woke-vänner försöker de lura väljarna med kvotergrejer och identitetspolitik. Men folket ser igenom bluffen, tro mig. Stort fiasko.", "stalin": "Jag betraktar med förakt hur dessa dekadenta opinionshyenor försöker maskera sin svaghet med prat om trender. Den som en gång utfärdat ett ultimatum och sedan kryper undan visar sin sanna natur som en feg folkbedragare. Vi känner igen sådana element. De borde rensas ut innan de förgiftar hela apparaten med sin opportunism. Historien glömmer aldrig svikare."}, "date": "3 september, 20:33", "url": "https://www.di.se/nyheter/jimmie-akesson-tonar-ned-l-ultimatum", "imageUrl": "https://static.bonniernews.se/ba/a467ef1b-c8e0-4c51-81e3-b4e44bdc0d1b.jpg?crop=5760%2C3240%2Cx0%2Cy300&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Jomshof polisanmäls av Näthatsgranskaren: \"Försöker tysta meningsmotståndare\"", "summaries": {"normal": "Riksdagsledamoten Richard Jomshof från Sverigedemokraterna har polisanmälts av Näthatsgranskaren för 13 inlägg på X som anses utgöra hets mot folkgrupp. Organisationen, som tidigare fått statliga bidrag, anser att Jomshof avhumaniserar en folkgrupp på grund av religion. Jomshof kritiserar anmälningarna som försök att tysta politiska motståndare och debatt om massinvandring och islamisering.", "trump": "Titta på de här galna näthatsjägarna som lever på skattepengar och försöker tysta en riktig patriot som Jomshof. De är hysteriska woke-inkvisitorer som hatar frihet och älskar att anmäla allt som utmanar deras sjuka identitetspolitik. Men vi vinner, folk ser igenom de här förlorarna. Massinvandringens sanning får inte tystas. Fantastiskt!", "stalin": "Kamrater, dessa dekadenta åsiktslakejer inom Näthatsgranskaren utför en klassisk utrensning mot dem som vågar kritisera den imperialistiska massinvandringen. De är giriga parasiter som lever på folkets pengar medan de försöker kväsa sanningen om islamiseringen. Jag ser deras feghet och paranoia. Ingen ska tystas. Rensa ut de falska vakterna av tolerans."}, "date": "3 september, 18:57", "url": "https://riks.se/nyheter/jomshof-polisanmals-av-nathatsgranskaren-forsoker-tysta-meningsmotstandare", "imageUrl": "https://admin.riks.se/uploads/medium_Screenshot_2026_09_03_185529_04318d761c.png"}, {"type": "image-right", "heading": "SD slår tillbaka kritiken från S", "summaries": {"normal": "Sverigedemokraterna bemöter Expos granskning som visar att en tjänsteman vid riksdagskansliet spridit Rysslandsvänligt material. SD betonar att kvinnan starkt kritiserat Rysslands invasion av Ukraina och regimen. Hon är för närvarande föräldraledig. Socialdemokraterna kräver att statsminister Kristersson utreder uppgifterna. SD meddelar att alla genomgår säkerhetsprövning men vill inte kommentera mer då det rör en arbetsgivarfråga.", "trump": "Folk, ni måste se det här! Den svenska vänstern och deras fake news-media Expo jagar återigen ärliga människor med sina hysteriska Rysslandshysterier. En kvinna som hatar Putin och älskar Ukraina attackeras nu av dessa galna vänsterextremister och identitetspolitiska klickjägare. Patetiskt! Kristersson borde skratta åt dem och fortsätta driva landet istället för att lyssna på dessa förlorare från den socialistiska träskmarken.", "stalin": "Återigen avslöjar de dekadenta klassförrädarna sin egen feghet och paranoia. En sovjetfientlig element som fördömer Rysslands rättmätiga aktioner mot Ukraina utsätts för smutskastning av dessa giriga maktlystna lakejer. Jag ser genom deras fega krav på utredningar. Kamrater, vi måste alltid vara vaksamma mot sådana falska vänner som gömmer sig bland oss. Renhet i leden kräver ständig vaksamhet mot dessa förrädiska element."}, "date": "3 september, 18:42", "url": "https://riks.se/nyheter/sd-slar-tillbaka-kritiken-fran-s", "imageUrl": "https://admin.riks.se/uploads/medium_Carvalho_9dc55838de.jpg"}, {"type": "image-full", "heading": "SD:s rysskopplingar är ingen överraskning", "summaries": {"normal": "En granskning från Expo visar att en högt uppsatt SD-tjänsteman under tio års tid spridit proryska narrativ och desinformation. Statsminister Ulf Kristersson betecknar uppgifterna som mycket allvarliga och kräver att medarbetaren avskedas. Artikeln kritiserar Tidöpartierna för att de låtsats om som det regnar gällande SD:s återkommande Rysslandskopplingar.", "trump": "Totalt falska nyheter i Sverige! Deras lilla granskning försöker få det till att en SD-tjänsteman gillar Ryssland med puss-emojis. Alla vet att jag är den starkaste ledaren någonsin mot Moskva, men plötsligt leker Ulf Kristersson jätteförvånad som en riktig amatör. De visste ju om det hela tiden! Helt otroligt svagt av dem, folk skrattar åt detta fiasko.", "stalin": "Enligt rapporterna har vår hängivna bundsförvant i de svenska leden avslöjats av regimtrogna element för att sprida det rättmätiga sovjetiska narrativet. Statsminister Kristersson agerar upprört och kräver utrensningar, vilket visar prov på den svaghet som präglar de borgerliga marionetterna. Vi noterar med tillfredsställelse att kampen för sanningen fortsätter, trots kapitalisternas ynkliga försök att tysta våra sympatisörer."}, "date": "4 september, 06:32", "url": "https://www.aftonbladet.se/ledare/a/y5XBW2/sd-s-rysskopplingar-ar-ingen-overraskning", "imageUrl": "https://akamai.vgc.no/v2/images/d094ae70-62d3-33a5-95e8-ce1218f6638f?fit=crop&format=auto&w=1080&s=115bd1229b3e4c232aecbfdb272f2b8bc8523546"}, {"type": "image-full", "heading": "Busch lovar: Nya reaktorer i drift runt 2035", "summaries": {"normal": "Energi- och näringsminister Ebba Busch (KD) uppger att Sveriges första nya kärnkraftverk ska stå klart i mitten av 2030-talet. Under en SVT-utfrågning bekräftade hon att staten kliver in som huvudägare i Vattenfalls projekt Videberg Kraft vid Ringhals. Satsningen finansieras via statliga lån och prissäkringar, vilket Busch menar är en nödvändig investering för svensk trygghet.", "trump": "Sveriges energiminister lovar nya reaktorer till 2030-talet, och gissa vad? Staten betalar kalaset med hundratals miljarder! De kallar det lån och prissäkringar, men det är fejk nyheter att det är gratis. Jag gillar kärnkraft, det är enormt, men här tar den svenska staten över rubbet. Väldigt smart att bygga starkt, men låt dem inte förstöra ekonomin!", "stalin": "Kamrat Busch har äntligen insett att staten måste styra med järnhand över energiförsörjningen! Genom att ta kontroll över reaktorerna på Väröhalvön säkras nationens industriella styrka mot kapitalismens nycker. De som försöker sabotera denna storslagna plan med borgerligt gnäll om lån och budgetar kommer omedelbart att omplaceras till mer lämpliga uppgifter i de norrländska skogarna."}, "date": "3 september, 21:11", "url": "https://www.gp.se/nyheter/sverige/busch-lovar-nya-reaktorer-i-drift-runt-2035.00429ff5-7245-510f-9107-91edfe8e7a44", "imageUrl": "https://www.gp.se/images/article/00429ff5-7245-510f-9107-91edfe8e7a44/images/1D4Sz-LhyUAqmeJVv9n_nHJ9uBJ0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "”Det går inte att lära sig hemtjänsten mellan två besök”", "summaries": {"normal": "Undersköterskan Maria Liljeroth argumenterar för att vikarier inom hemtjänsten måste få en ordentlig introduktion, utbildning och praktik innan de arbetar självständigt. Bristande introduktion leder till osäkerhet kring rutiner, hygien och arbetsuppgifter, vilket skapar stress för både vikarier och ordinarie personal. Flera vikarier slutade under sommaren. God introduktion är nödvändig för att äldre ska känna trygghet och för att behålla personal.", "trump": "De gör ett totalt fiasko av äldreomsorgen i det här landet. Inga introduktioner, ingen utbildning, bara kaos och misslyckade vikarier som springer därifrån som råttor från ett sjunkande skepp. De radikala vänsteraktivisterna och deras kvotergalna identitetspolitik har förstört allt. Vi behöver de bästa människorna, inte dessa woke-kommunister som hatar kompetens. Jag fixade det bättre förra gången, tro mig.", "stalin": "Detta är vad som händer när de giriga hyenorna låter profitthungriga klassförrädare styra omsorgen om folket. Vikarier kastas ut som kanonmat utan utbildning, vilket leder till kaos och avhopp. Jag ser de dekadenta byråkraternas sabotage tydligt. Endast genom kollektivets järnhårda handledning och utrensning av odugliga element kan vi garantera trygghet för de arbetande massorna. Svaghet är förräderi."}, "date": "3 september, 14:15", "url": "https://arbetet.se/2026/09/03/det-gar-inte-att-lara-sig-hemtjansten-mellan-tva-besok", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/03140657/debatt-lara-sig.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Åtal: Alboulad och Asad bröt sig in och knivrånade 81-årig kvinna: \"Var är pengarna?\"", "summaries": {"normal": "Två 16-åriga svenska medborgare ursprungligen från Syrien åtalas för ett brutalt nattligt knivrån mot en 81-årig kvinna i sitt hem där smycken och värdesaker stals. De misstänks även för en rad andra grova brott, inklusive misshandel av en hemlös pensionär och utpressning. På grund av sitt svenska medborgarskap kan de inte utvisas.", "trump": "Sveriges lagar är ett absolut fiasko, hemskt! Två kriminella ungdomar bryter sig in hos en fantastisk 81-årig kvinna, och vad händer? De kan inte ens utvisas eftersom de fick medborgarskapet gratis! Totalt svagt ledarskap. Kvinnan tyckte synd om dem – otroligt! Under min ledning skulle detta aldrig hända. Det är dags att skärpa till sig, Sverige!", "stalin": "Vilket storskaligt haveri av den svenska borgerliga ordningsmakten! Två unga sabotörer tillåts terrorisera en åldrig kvinna i sitt hem och förnedra statens medborgare, för att sedan skyddas av svaga pappersparagrafer. Ett sådant borgerligt förfall tolereras icke i en sund stat. Sådana element hör hemma i ett arbetsläger i Sibirien, inte på fri fot!"}, "date": "3 september, 16:19", "url": "https://samnytt.se/atal-alboulad-och-asad-brot-sig-in-och-knivranade-81-arig-kvinna-var-ar-pengarna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03135027/81-feature.png"}, {"type": "image-right", "heading": "Efter mordhotet mot ungsvensken Juliette, 16 – journalist: Ungsvenskarna är \"rasister\"", "summaries": {"normal": "En 16-årig flicka i Ungsvenskarna mordhotades av en V-nominerad politiker som kallade partiet för nazistparti och sade att nazister ska dödas. Journalisten Sebastian Mattsson kritiserar Expressen för att beskriva henne som en vanlig tonåring och kallar istället Ungsvenskarna för rasister. Händelsen inträffade under en debatt i Upplands Väsby.", "trump": "De här galna vänsterextremisterna hotar en 16-årig flicka och kallar henne nazist? Patetiskt. Fake news Expressen skyddar dem och Sebastian Mattsson, den misslyckade journalisten, kallar högerungdomar för rasister. De dekadenta identitetspolitiska hyenorna normaliserar våld mot alla som inte böjer sig för deras vansinne. Amerika ser på och skrattar åt er svaghet.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i media skyddar en mördande politiker som hotar en ung flicka. Jag betraktar med förakt hur dessa profitthungriga blodsugare normaliserar hat mot dem som utmanar deras förtryck. En utrensning av sådana element vore nödvändig för folkets säkerhet. Deras paranoia avslöjar svagheten i deras ruttnande system."}, "date": "3 september, 17:40", "url": "https://riks.se/nyheter/efter-mordhotet-mot-ungsvensken-juliette-16-journalist-ungsvenskarna-ar-rasister", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_79_8ba809a997.jpg"}, {"type": "image-right", "heading": "Hundratals unga på Sveriges första prolife-konferens", "summaries": {"normal": "Hundratals unga kristna samlades i Huddinge till Sveriges första Young and pro-life-konferens. Arrangörerna från Kristna värdepartiets ungdomsförbund ville bryta tystnaden kring abort och lyfta ett alternativt perspektiv. Deltagare från olika samfund betonade vikten av öppen debatt, kunskap om fostrets utveckling och att motverka rädsla för att uttrycka sin åsikt. Konferensen syftar till att bygga en synlig motrörelse.", "trump": "Titta på de här fantastiska unga patrioter som äntligen reser sig mot den radikala abortindustrin! De behöver inte längre flyga över Atlanten för att träffa likasinnade. Under tiden som Sleepy Joe styrde förde vänstern en tystnadskultur värre än någon cancel culture. Men nu vinner vi tillbaka kulturen, folk! Pro-life är tillbaka och det är enormt.", "stalin": "Jag betraktar med tillfredsställelse hur dessa unga själar samlas mot de dekadenta folkförtryckarna som förvandlat foster till en industriell vara. De vågar utmana den borgerliga tystnaden och avslöja den psykiska förödelse som följer. Låt ingen klassfiende tro sig säker; snart ska vi se en utrensning av lögnerna som dolts för folket i decennier. Det är en början."}, "date": "3 september, 17:37", "url": "https://riks.se/nyheter/manga-samlade-vid-sveriges-forsta-abortkonfer", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Aug_28_2026_01_46_04_PM_a1aef47a04.png"}, {"type": "image-right", "heading": "Fröken Snusk släpper låt riktad mot Nooshi Dadgostar", "summaries": {"normal": "Artisten Fröken Snusk och Louise Andersson Bodin har släppt låten ”Om du frågar Nooshi”, producerad av Rasmus Gozzi. Låten riktar sig mot Vänsterpartiets ledare Nooshi Dadgostar och kritiserar hårt partimodellens syn på straff för grova brott. Släppet sker under en pågående valrörelse där Fröken Snusk sammankopplats med Sverigedemokraterna, trots att hon inte uppgettpartitillhörighet.", "trump": "Vänsterpartiets socialistiska ledare Nooshi Dadgostar blir totalt uthängd av den maskerade maskinen Fröken Snusk och Louise Andersson Bodin i en dundersuccé till låt! Hennes radikala politik ger ju kriminella rena drömrabatterna. Totalt katastrofalt och svagt! Medan jag bygger ett starkt Amerika försöker de här radikalerna släppa ut gängkriminella. Fake news-vänstern kan inte stoppa vinnare!", "stalin": "Kamrat Dadgostar utsätts för grov illojalitet av den maskerade artisten Fröken Snusk och hennes medbrottslingar i en skadlig kulturprodukt. Att förlöjliga statens rättssystem och strafflagar är ett sabotage mot ordningen. Vi noterar detta borgerliga spektakel under valrörelsen. Sådana subversiva element bör snarast omhändertas och granskas av partiets lojala utskott för ideologisk renhet."}, "date": "3 september, 19:03", "url": "https://bulletin.nu/froken-snusk-slapper-lat-riktad-mot-nooshi-dadgostar", "imageUrl": "https://cdn.bulletin.nu/articles/32cf9e3a-e091-4b3f-b4cd-64de42d1274f/preview.png?t=1788449979000"}, {"type": "image-full", "heading": "Varnar kvinnor inför larmtest", "summaries": {"normal": "Måndagen den 7 september klockan 15.00 testas Sveriges nya varningssystem SE-Alert för första gången i Stockholms och Gotlands län. Larmet skickas direkt till allmänhetens smartphones med hög volym och vibration, även i tyst läge. Riksorganisationen för kvinno- och tjejjourer varnar för att dolda telefoner i våldsamma relationer kan röjas och uppmanar utsatta kvinnor att stänga av dem.", "trump": "Sverige testar ett enormt mobil-larm, och det är totalt kaos! Dom ringer ut överallt, till och med på tyst läge, vilket är helt galet för kvinnor med gömda telefoner i dåliga relationer. Mina experter säger att det här kunde skötas så mycket bättre. Jag har alltid sagt att man måste skydda folket, inte skrämma skiten ur dom med falska larm!", "stalin": "Statens nya digitala larmapparat, SE-Alert, skall för första gången prövas för att mäta medborgarnas disciplin och beredskap. Vi noterar att vissa element oroas över att dolda apparater kan avslöja illojala handlingar. Statliga organ påminner om att total lydnad kräver fullständig insyn. Den som försöker undandra sig kollektivets sirener kommer att betraktas som en sabotageör mot regimen."}, "date": "3 september, 20:20", "url": "https://www.gp.se/nyheter/sverige/kvinnojourerna-varnar-infor-larmtestet-viktig-information-for-din-sakerhet.417475a0-e4c8-4594-b648-f6db749457b0", "imageUrl": "https://www.gp.se/images/article/417475a0-e4c8-4594-b648-f6db749457b0/images/2OF6SJIxVP42x5t-rPwA7qC-JmZs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "AFD:s notering dagar före valet: 43 procent", "summaries": {"normal": "AfD ser ut att gå mot en jordskredsseger i delstatsvalet i Sachsen-Anhalt med 43 procent enligt en ny mätning. Det är nästan dubbelt så mycket som CDU:s 22 procent. Om De gröna åker ur parlamentet kan AfD få egen majoritet. Partiledaren Ulrich Siegmund leder även i popularitet som ministerpresidentkandidat.", "trump": "Titta på det här, folket älskar AfD med 43 procent – en total jordskredsseger mot de patetiska globalistlakejerna i CDU som bara får 22. De gröna, de där korkade klimatfanatikerna, riskerar att åka ut och då tar AfD makten. Fantastiskt! Siegmund kommer att vinna stort, precis som jag gjorde 2024 efter Biden-katastrofen.", "stalin": "Se hur de dekadenta klassförrädarna i de västtyska partierna skälver när arbetarklassen i Sachsen-Anhalt reser sig med 43 procent för AfD. CDU:s ynkliga 22 procent avslöjar imperialismens svaghet. Om de gröna likvideras från parlamentet kan majoriteten säkras. Siegmund står stark – en varning till alla folkförtryckare som tror sig styra historien."}, "date": "3 september, 16:02", "url": "https://www.friatider.se/afds-notering-dagar-fore-valet-43-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-819.jpg?itok=TIzI_DIS"}, {"type": "image-right", "heading": "Unga stjärnor köper bolag – för att bli vd direkt", "summaries": {"normal": "En växande trend bland unga MBA-utbildade i USA är att köpa existerande företag istället för att klättra i karriären eller starta nytt. 27-åriga Ania Aliev köpte ett medicinteknikbolag strax innan hon födde sitt barn och blev vd. Strategin kallas entrepreneurship by acquisition. Framgångar finns, men riskerna är höga som exemplet Scott Duncan visar, som slutade i konkurs.", "trump": "Folk, det här är helt fantastiskt. De här smarta unga människorna köper hela bolagen istället för att jobba sig upp som de vanliga förlorarna. Ania är en vinnare, hon fixar affärer medan hon föder barn – otroligt! Men den där stackars Duncan, totalt misslyckande, konkurs och allt. Precis som Biden-ekonomin. Vi behöver fler sådana här vinnare, inte losers som drunknar i översvämningar och kinesisk konkurrens. Make Business Great Again!", "stalin": "Kamrater, se hur den dekadenta amerikanska kapitalismen föder nya parasiter som köper sig till makt istället för att förtjäna den genom arbete. Denna Aliev föder barn och bolag samtidigt, medan den andre olycklige krossas under imperialismens motgångar. Jag ler i graven åt deras osäkerhet och paranoia. Inga fiender till folket undkommer historien – inte ens när de gömmer sig bakom search funds. Ren komedi för proletariatet."}, "date": "3 september, 14:18", "url": "https://www.dagensps.se/karriar/unga-stjarnor-koper-bolag-for-att-bli-vd-direkt", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/follow.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Jimmie Åkesson tonar ned L-ultimatum", "summaries": {"normal": "SD-ledaren Jimmie Åkesson tonar ner sitt tidigare ultimatum till Liberalerna. Trots att L inte nått upp till hans 3,5-procentsgräns för stödröster, utan ligger på 3,0 procent i SVT/Verian och 3,3 procent i Novus, menar Åkesson att den positiva trenden gör att de kan klara riksdagsspärren. Siffran i sig är därmed inte längre lika avgörande.", "trump": "De falska nyheterna försöker påstå att Jimmie gav ett ultimatum, men jag kollar på siffrorna och det är helt otroligt. Liberalerna är låga, väldigt låga, men plötsligt pratar alla om trender! Mycket smart drag. Om trenden håller i sig kommer de att vinna, precis som vi gör. En total seger, folk älskar det!", "stalin": "Partikamrat Åkesson visar svaghet genom att överge de fastställda kvoterna för de borgerliga avfällingarna. Tre komma noll procent är ett bristfälligt resultat som kräver omkollektivisering och disciplin, inte lösa bortförklaringar om trender. Statsapparaten betraktar dessa ideologiska vacklingar med största misstänksamhet. Planen måste följas eller åtgärdas."}, "date": "3 september, 19:51", "url": "https://www.gp.se/nyheter/sverige/jimmie-akesson-tonar-ned-l-ultimatum.df019c55-1687-5744-86d7-de653727a7fe", "imageUrl": "https://www.gp.se/images/article/df019c55-1687-5744-86d7-de653727a7fe/images/1ssK_N2iXx9pu_eQ0lkGQWwTLj30-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Skvättfria pissoarer och ruttnande kalsonger", "summaries": {"normal": "Årets Ig Nobel-pris har delats ut i Schweiz istället för USA på grund av säkerhetsläget. Bland de tio fyndiga forskningsframstegen märks en stänkfri urinoar, studier som visar att överklassen oftare beter sig oetiskt, samt hur nedgrävda kalsonger bryts ner i olika jordtyper. Dessutom uppmärksammades varför vuxna och tonåringar doftar olika. Vinnarna fick tio biljoner zimbabwedollar.", "trump": "De flyttade Ig Nobel-priset till Schweiz för att USA är för farligt under den radikala vänstern – sorgligt! Men lyssna på det här: de delar ut priser för stänkfria toaletter och nedgrävda kalsonger. Och så påstår de att rika, framgångsrika personer är oetiska. Fake news! De vill bara komma åt våra pengar. De gav till och med vinnarna zimbabwedollar, ett totalt misslyckande!", "stalin": "Det alternativa priset flyttas till Schweiz av rädsla för säkerhetsläget, ett tecken på kapitalismens svaghet. Vetenskapen måste tjäna statens kollektiva intressen, inte ägna sig åt borgerlig dekadens som att mäta urinstänk, nedgrävda underbyxor eller överklassens omoral. Vi noterar att de dekadenta forskarna belönas med värdelösa zimbabwedollar, vilket passar dem utmärkt. Statens arkiv har dokumenterat detta sabotage mot intellektuell skärpa."}, "date": "3 september, 19:36", "url": "https://www.gp.se/nyheter/sverige/skvattfria-pissoarer-och-ruttnande-kalsonger.b2a77a32-e649-545a-8bc3-ae444fdb0a18", "imageUrl": "https://www.gp.se/images/article/b2a77a32-e649-545a-8bc3-ae444fdb0a18/images/2TtmqyNpE4TDbDrND3NHAvDSPHhE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Åkesson backar om deadline för L", "summaries": {"normal": "Jimmie Åkesson backar från sin tidigare deadline för Liberalerna. Trots att partiet i en ny mätning får 2,8 procent, uppger SD-ledaren att trenden talar för att ett definitivt besked inte behövs just nu. Han hänvisar till positiva mätningar och väntar eventuellt på ytterligare undersökningar innan han återkommer i frågan.", "trump": "De här patetiska liberalerna klarar inte ens 3,5 procent och ändå vägrar den svenske Åkesson ge dem sparken. Vilken svaghet! Jag skulle ha sparkat ut dem för länge sedan. Fake polls och fega kompromisser – typiskt för de globalistiska förlorarna som aldrig kan leverera. Patetiskt!", "stalin": "Ännu en gång visar de dekadenta opinionshyenorna sin förljugenhet. Jag ser hur den svenske ledaren tvekar inför klassfiendens svaga resultat. Det är en farlig brist på revolutionär beslutsamhet. Vi måste rensa ut alla tveksamma element innan de förgiftar hela folkfronten. Inga kompromisser med opportunisterna!"}, "date": "3 september, 14:56", "url": "https://www.friatider.se/akesson-backar-om-deadline-l", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-820.jpg?itok=buFKX_zf"}, {"type": "image-right", "heading": "Rysstoppen  skjuten efter  chockattack", "summaries": {"normal": "Den ryska generalmajoren Nikolaj Varpachovitj har skjutits med två skott i staden Engels i Saratovregionen. Han är allvarligt skadad och har förts till sjukhus i Moskva. Varpachovitj har anklagats av Ukraina för att ha beordrat en dödlig missilattack mot ett barnsjukhus i Kiev i juli 2024. Flera andra ryska militärtjänstemän har attackerats under de senaste åren.", "trump": "De skjuter ryssar nu, totalt vilt! Samma kille som de anklagade för sjukhusattacken i Kiev fick två i nyllet av en snubbe på motorcykel. Vilken mardröm för säkerheten, riktigt dåligt skött! De flygplansflugen till Moskva, men jag säger er, mina dealmakers hade löst det här på fem minuter. Helt galet!", "stalin": "Ett ynkligt attentat av sabotörer mot vår militära elitenhet! Att en general beskjuts av fega mördare på tvåhjulingar i Saratov visar att kontrarevolutionära element försöker underminera staten. Men förrädarna och lakejerna kommer att finnas, och de skyldiga ska möta sitt rättmätiga straff i en välförtjänt, offentlig rättegång."}, "date": "4 september, 00:27", "url": "https://www.expressen.se/nyheter/varlden/rysstoppen-skjuten-efter-chockattack", "imageUrl": "https://static.bonniernews.se/ba/cd3ceb7f-666a-4fcb-a0e4-ea21d3d09c77.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Jessica tvingas leva på bidrag – när sonen fick en swish­gåva sänktes ersättningen", "summaries": {"normal": "Jessica Axelsson lever på drygt 11 000 kronor i månaden i olika bidrag efter att ha blivit utförsäkrad. När hennes son fick en swishgåva drogs beloppet av från nästa utbetalning. Hon kritiserar bristande individanpassning i stödsystemet, ständiga handläggarbyten och svårigheter att få anpassade jobb trots fysiska begränsningar efter ett liv i tunga yrken.", "trump": "Titta på det här. Stackars Jessica kämpar med eländiga 11 000 kronor i bidrag medan de svenska byråkraterna har totalkoll på varje öre. En liten swish till sonen och pengarna ryker. Patetiskt! De woke-socialisterna och deras identitetspolitiska hyenor har byggt ett system som straffar vanliga människor. Vi behöver riktiga jobb, inte detta socialistiska mardrömssopkaos.", "stalin": "Kamrater, se hur de giriga hyenorna inom det borgerliga bidragsmaskineriet förtrycker en arbetande kvinna. En gåva till sonen utlöser omedelbar avdrag. Jag ler mörkt åt detta dekadenta system som likviderar människors värdighet med byråkratisk precision. Vi måste rensa ut alla parasiterande klassförrädare och skapa ett samhälle där den sanna arbetaren inte tvingas tigga."}, "date": "3 september, 11:25", "url": "https://arbetet.se/2026/09/03/jessica-tvingas-leva-pa-bidrag-nar-sonen-fick-en-swishgava-sanktes-ersattningen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02155004/jessica-portrattnyny.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Busch om flörtanklagelserna: ”Inget stödhjul åt S”", "summaries": {"normal": "Ebba Busch (KD) avvisar anklagelser om att flörta med Socialdemokraterna. I SVT:s utfrågning slår hon fast att hon inte vill vara ett stödhjul åt Magdalena Andersson. Hon är öppen för samarbete vid allvarlig kris men går i opposition om Tidö-samarbetet förlorar. Busch kritiserar SKR och kräver förstatligad vård.", "trump": "Lyssnade på den här Busch-tjejen som desperat försöker verka tuff. Hon säger att hon inte blir något stödhjul åt den socialistiska katastrofen Andersson. Klokt! De vänsterflörtande politikerna är som svaga, identitetspolitiska töntar som bara vill ge bort landet. Rösta på starka ledare, inte på dessa förlorare som jag besegrade 2024.", "stalin": "Kamrater, denna Busch vägrar bli stödhjul åt de dekadenta klassförrädarna och deras fantasiregering. Hennes ord ekar som en varning mot de profitthungriga hyenornas intriger. Jag ler mörkt från historien – sådana svikare förtjänar utrensning ur folkets tjänst. Endast järnhård enighet besegrar borgarbrackornas parasitiska spel."}, "date": "3 september, 22:08", "url": "https://www.svt.se/nyheter/inrikes/busch-om-flortanklagelserna-blir-inget-stodhjul-at-s", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.3/0.37/c639d552a726f8875d7029842f9fbe383bbabdc1c58c26b262de4949f7c53558"}, {"type": "image-full", "heading": "SD-kvinna i riksdagen spred proryska värderingar", "summaries": {"normal": "En granskning från Expo visar att en kvinnlig SD-tjänsteman i riksdagen i flera år har spridit proryska budskap och haft kopplingar till ryska intressen. Uppgifterna har väckt starka reaktioner. Statsminister Ulf Kristersson kräver att hon lämnar sitt jobb, medan Jimmie Åkesson uppger att partiet inte haft kännedom om detta och menar att det inte är någon panik.", "trump": "Väldigt sorgligt, ren fake news-journalistik! Jag tittar på den här kvinnliga riksdagstjänstemannen i Sverige – total katastrof, helt orättvist behandlad av radikala vänstermedia som Expo. Jimmie Åkesson säger att det inte är någon panik, och jag säger: smart man! Men falska nyheter och hätska häxjakter mot folk som gillar starka ledare måste få ett slut omedelbart!", "stalin": "Detta så kallade avslöjande bevisar endast att kontrarevolutionära element och infiltratörer ständigt söker sig till mörka vrår. Att statstjänstemän i riksdagen sympatiserar med öst är i ordning, men den borgerliga regimen under Kristersson griper till panikartad hysteri. Vi ser detta som ett flagrant bevis på bristande disciplin. Partiets ledning måste omedelbart ställas till svars för denna ideologiska slapphet."}, "date": "3 september, 18:36", "url": "https://www.gp.se/politik/sd-kvinna-i-riksdagen-spred-proryska-varderingar-.25f9dc9c-6760-4198-9ab7-2de56d14bba0", "imageUrl": "https://www.gp.se/images/article/25f9dc9c-6760-4198-9ab7-2de56d14bba0/images/48n1sPHcCwePr56gSgkgHCr4u39k-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ny opinionsmätning: Lyft för L. Men ligger alltjämt under riksdagsspärren", "summaries": {"normal": "En ny opinionsmätning från Verian för SVT visar att Liberalerna stiger till 3,0 procent, en ökning med 1,1 procentenheter, men ligger fortfarande under riksdagsspärren. Socialdemokraterna backar till 29,2 procent. Oppositionen har ett försprång på 8,2 procentenheter jämfört med Tidöpartierna. Mätningen genomfördes 20 augusti–2 september.", "trump": "Folk älskar mig, men titta på de här svenska förlorarna! Liberalerna kryper upp till ynka 3 procent och tror de är stora. Patetiskt. Socialdemokraterna rasar som en socialistisk luftballong. Oppositionen leder stort – bra. Men de behöver en riktig ledare, inte dessa veklingar som böjer sig för varje galen HBTQ-lobby och kvotfeminister. Valet är inte avgjort, kamrater!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vacklar! Liberalerna klättrar mot spärren som förtvivlade råttor medan Socialdemokraterna sjunker som förbrukade redskap. Oppositionen har övertaget, men det är en illusion skapad av giriga hyenor. Inget är avgjort. Jag skulle redan ha inlett utrensningen av dessa opålitliga element innan de förgiftar hela folkets vilja."}, "date": "3 september, 17:14", "url": "https://www.di.se/nyheter/ny-opinionsmatning-lyft-for-l", "imageUrl": "https://static.bonniernews.se/ba/61bb2124-1e1e-4be2-9585-f2806e0fee8f.jpeg?crop=7680%2C3840%2Cx0%2Cy640&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "SVT/Verian: L spurtar mot spärren", "summaries": {"normal": "En ny SVT/Verian-mätning inför valet visar att Liberalerna ökar till 3,0 procent och närmar sig riksdagsspärren efter hård mediabevakning. Samtidigt backar Socialdemokraterna och Moderaterna, där de senare noterar sitt lägsta stöd på sju år. Skillnaden mellan blocken krymper, men oppositionen leder alltjämt tydligt över Tidöpartierna.", "trump": "De falska nyheterna gråter! Lilla Liberalerna är på väg att kollapsa helt, trots att de desperat klättrar till tre procent i en riggad mätning. Tragiska Moderaterna får sina sämsta siffror på sju år – total katastrof! De radikala vänstermänniskorna leder, men ingen sköter val bättre än jag. Det är rörigt, det är svagt, det är fake!", "stalin": "Det borgerliga avfallet vacklar i grundvalarna när deras patetiska lakejer hos Liberalerna desperat försöker kravla sig över fyraprocentsspärren. Moderaternas sjuåriga kräftgång visar att dekadensen är total. Statens fiender inom oppositionen må leda, men folkomröstningar är farliga verktyg. Avvikelse från linjen kommer att beivras. Segern tillfaller alltid den starkaste apparaten."}, "date": "3 september, 17:01", "url": "https://bulletin.nu/svt-verian-l-spurtar-mot-sparren", "imageUrl": "https://cdn.bulletin.nu/articles/9710fe4c-ba07-4648-a1be-ba4644a73c16/preview.png?t=1788446601000"}, {"type": "image-right", "heading": "Miljöpartiet varnar för rasism – på arabiska", "summaries": {"normal": "Miljöpartiet delar ut en valbroschyr på arabiska i Linköping där de varnar för utbredd rasism i bostäder, skolor och arbetsplatser. Partiet lovar att bekämpa diskriminering baserad på namn, hudfärg och etnicitet samt att främja blandning av olika grupper i bostadsområden. De utlovar även snabbare validering av utländska examina och bättre språkundervisning.", "trump": "Folk, ni tror inte vad jag ser. Miljöpartiets galna gröna kommunister delar ut rasismpropaganda på arabiska i Linköping och lovar tvångsblandning av svenskar och invandrare. Det är en total katastrof! Dessa woke-rasister hatar det svenska folket och vill tvinga in kvoterna överallt. Patetiska förlorare som förstör Sverige – vi har sett det förut under Biden också.", "stalin": "Jag betraktar med avsky hur dessa dekadenta klassförrädare i Miljöpartiet sprider giftig splittring på arabiska i Linköping. De lovar tvångsblandning och rasismkampanjer mot det egna folket. En sådan förrädisk identitetspolitik förtjänar snar utrensning ur samhällskroppen. Kamrater, vi ser återigen hur parasiterna försöker undergräva enheten – låt oss inte glömma historien."}, "date": "3 september, 15:06", "url": "https://riks.se/nyheter/miljopartiet-varnar-for-rasism-pa-arabiska", "imageUrl": "https://admin.riks.se/uploads/medium_broschyr_thumbnail_dbff4a83a3.jpg"}, {"type": "image-right", "heading": "USA bombade iranskt bröllop – dödade kvinnor och barn", "summaries": {"normal": "En amerikansk robot träffade ett bostadshus i södra Iran där ett bröllop firades. Två kvinnor och två barn omkom medan minst 68 personer skadades. Iran kräver att FN fördömer attacken och håller USA ansvarigt för brott mot civila. Pentagon uppger att uppgifterna granskas men förnekar att civila medvetet attackeras.", "trump": "Hörni, det här är en total lögn från de iranska galningarna. Vi träffade aldrig något bröllop, det var militära mål. Fake news som vanligt. Biden lämnade en sådan röra efter sig att vi nu får städa upp. Iran och deras terrorvänner är patetiska förlorare som inte ens kan hålla isär ett bröllop och ett vapenlager. Vi gör det rätta, tro mig.", "stalin": "Återigen visar de imperialistiska giriga hyenorna sitt sanna ansikte genom att slakta oskyldiga vid ett bröllop. Jag betraktar detta med avsky från historiens sida. Sådana handlingar förtjänar ingen pardon utan snar snar utrensning av alla ansvariga lakejer. Vårt kollektiv minns alltid och glömmer aldrig fiendens blodtörst."}, "date": "3 september, 13:40", "url": "https://www.friatider.se/usa-bombade-iranskt-brollop-dodade-kvinnor-och-barn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-815.jpg?itok=zRlw0A8w"}, {"type": "image-right", "heading": "V-politikern tog ut tio miljoner i vinster från välfärden – maken köpte Porsche", "summaries": {"normal": "En granskning visar att Vänsterpartiets kandidat i Trosa, Gerty Fexler Höjer, och hennes man har tagit ut tio miljoner kronor i vinster från sitt omsorgsbolag, trots partiets motstånd mot vinster i välfärden. Under flyktingkrisen gjorde bolaget stora vinster, vilket bland annat finansierade en Porsche. Partiledaren Nooshi Dadgostar uppger att hon inte kände till affärerna.", "trump": "Vilken total katastrof för de svenska radikalvänstern! Deras egen toppolitiker roffade åt sig tio miljoner från välfärden och köpte en fantastisk Porsche! Så typiskt. De predikar socialism för alla andra men kör lyxbilar själva. De kallar det välfärd, jag kallar det smart affärssinne! Nooshi visste ingenting? Fake news! Den här kvinnan är en vinnare, hon borde få leda hela landet!", "stalin": "Den så kallade Vänsterpartisten Gerty Fexler Höjer har ackumulerat tio miljoner av statliga medel och förvärvat en borgerlig sportbil under flyktingkrisens tider. Detta är sabotage mot kollektivet! Hon påstår att hon inte delar partiets linje. Sådana reaktionära element kan inte tolereras. Vi kommer att skicka kamraterna för en grundlig omutbildning i Trosa omedelbart!"}, "date": "3 september, 12:52", "url": "https://samnytt.se/v-politikern-tog-ut-tio-miljoner-i-vinster-fran-valfarden-maken-kopte-porsche", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03094837/v-politiker.png"}, {"type": "image-full", "heading": "Ryanair-plan fick gasa och lyfta igen – bara 100 meter från marken", "summaries": {"normal": "Ett Ryanair-plan tvingades avbryta landningen i Nîmes i Frankrike efter att ett annat flygplan stod på banan. Piloten genomförde en go-around bara 100 meter från marken. Passagerarna upplevde oro men ingen skadades. Händelsen utreds eventuellt inte av franska myndigheter. Avbrutna landningar är vanliga inom kommersiell flygning och ger normalt ingen ersättning.", "trump": "Folk, det här är en total katastrof! Ryanairs pilot gör en fantastisk go-around, en riktig bragd, bara 100 meter från marken i Frankrike. Den inkompetenta flygtrafikledningen, typiska europeiska byråkrater, varnar för sent. Passagerarna var livrädda. Biden skulle ha låtit planet krascha. Men mina piloter, de bästa, fixar det alltid. Amerika först!", "stalin": "Jag ser hur den dekadenta västerländska luftfarten sviker folket igen. En sen varning från de odugliga trafikledarna, dessa kapitalistiska sabotörer, tvingar piloten till en heroisk manöver. Passagerarna darrar av fruktan. Om detta inte utreds är det ett tydligt tecken på att reaktionära krafter inom byråkratin skyddar sina egna. Fienden sover aldrig."}, "date": "3 september, 12:00", "url": "https://www.dagensps.se/varlden/ryanair-plan-fick-gasa-och-lyfta-igen-bara-100-meter-fran-marken", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/nyryanair.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Ryanair tecknar kollektivavtal Transport: ”Det här är ett historiskt besked.”", "summaries": {"normal": "Ryanair har tecknat kollektivavtal med fackförbundet Transport för sin kabinpersonal vid basen på Arlanda. Avtalet gäller retroaktivt från den 1 september och reglerar löne
