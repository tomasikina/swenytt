under S, nu klagar de att inget görs", "summaries": {"normal": "Socialdemokraternas Teresa Carvalho kritiserar regeringen för att inte göra tillräckligt mot välfärdsbrottslighet. Skribenten menar att kritiken är hycklande då Socialdemokraterna under sin långa tid vid makten lät problemen växa och inte vidtog effektiva åtgärder. Nuvarande regering har däremot inrättat Utbetalningsmyndigheten och ökat myndighetssamarbetet för att stoppa kriminellas utnyttjande av välfärdssystemen. Artikeln avslutas med uppmaningen att Socialdemokraterna bör ägna sig åt självrannsakan istället för att kritisera det städjobb som nu pågår.", "trump": "Socialdemokraterna i Sverige, en riktig katastrof, de låter kriminella plundra välfärden! Teresa Carvalho vaknar nu och klagar? Det är fake news! De styrde i decennier och gjorde ingenting, noll! Jag gillar den nuvarande regeringen, de bygger saker, de är smarta, precis som jag. De stoppar pengarna från att läcka ut till dessa gäng. Socialdemokraterna är totalt inkompetenta, de borde skämmas. Sverige behöver vinnare, inte de här förlorarna som lät brottsligheten explodera. En total diskreditering!", "stalin": "Vi har observerat hur de svenska socialdemokraterna, dessa svaga byråkrater, har låtit välfärdssystemet dräneras av kriminella element. Medan vi med järnhand rensar ut sabotage i vårt imperium och säkrar vår intressesfär mot västliga förfall, har de i Stockholm suttit sysslolösa. Att de nu gnäller är ett patetiskt försök att dölja sitt historiska misslyckande. Vi behöver inga debattartiklar; vi behöver utrensningar. De som låter statens resurser stjälas av kriminella är själva fiender till folket och förtjänar en plats i historiens mörkaste arkiv."}, "date": "20 maj, 03:31", "url": "https://samtiden.nu/2026/05/bidragsbrotten-trefaldigades-under-s-nu-klagar-de-att-inget-gors/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2024/08/Teresas-Carvalho-S.jpg"}, {"type": "image-full", "heading": "Källor: USA och Israel förbereder nya attacker", "summaries": {"normal": "USA och Israel förbereder enligt uppgifter nya attacker mot Iran. Donald Trump varnar på Truth Social för 'lugnet före stormen' med en AI-genererad bild. Pentagon överväger att återuppta operationen 'Epic Fury', pausad sedan vapenvilan i april. Irans utrikesminister meddelar att förhandlingar med USA står stilla. Båda sidor fortsätter militära upprustningar, med USA:s flotta och stridsflyg redo för insatser, medan Iran förbereder missilplatser längs Hormuzsundet.", "trump": "Titta bara på den här fantastiska bilden jag delade – total dominans! Iran är svagt, deras flotta? Borta. Flygvapen? Borta. Teknik? Borta. Men de tror de kan utmana USA? Haha! Vi rustar upp, fyller våra skepp med de bästa vapnen, och snart visar vi dem vem som bestämmer. Lugnet före stormen? Absolut. Och stormen kommer bli YUGE!", "stalin": "Kamrater, fienderna i Washington och Tel Aviv leker med elden igen. Dessa imperialistiska hyenor tror de kan skrämma oss med sina hangarfartyg och 'Epic Fury'? Vi har sett deras sort förr – svaga, rädda och desperata. Iran rustar, precis som vi, och deras missiler står redo. Låt dem komma. Vi har krossat större hot än dessa klåfingriga kapitalister. Och Putin? Han ler säkert i Moskva – en till storm att utnyttja för vår rättmätiga expansion."}, "date": "17 maj, 16:14", "url": "https://kvartal.se/nyheter/artiklar/kallor-usa-och-israel-forbereder-nya-attacker/cG9zdDoxMTM0MDU", "imageUrl": "https://images.kvartal.se/2026/05/4c87dae2-usirantruthsocial.webp"}, {"type": "image-right", "heading": "Larmet från äldreomsorgen – sju av tio vill sluta", "summaries": {"normal": "En ny rapport visar att 70% av personalen inom äldreomsorgen överväger att sluta, en kraftig ökning sedan 2015. Hög arbetsbelastning, dåliga scheman och låg lön är huvudorsakerna. Chefer kämpar med rekrytering och många anställer personal utan rätt kompetens. Forskare och fackliga representanter kräver ökade resurser för att förbättra arbetsvillkoren och locka fler till branschen.", "trump": "Jag läste om detta kaos i Sveriges äldreomsorg – helt otroligt! Sju av tio vill sluta, säger de. Varför? För att de har för mycket jobb, för dåliga scheman och lönen är pinsamt låg. Cheferna kan inte hitta folk, och när de gör det är det ofta fel personer. Sverige, lyssna på mig: ni måste fixa detta! Ni behöver mer pengar, bättre villkor och kanske en vägg – en stor, vacker vägg – för att hålla kvar personalen. SAD!", "stalin": "Kamrater, en ny rapport avslöjar kapitalismens förfall i Sveriges äldreomsorg! Sju av tio arbetare, dessa hjältar i det dagliga slitet, överväger att desertera från sina poster. Fienderna – de giriga kapitalisterna och deras lakejer i politiken – har skapat ett system där arbetarna kvävs under tung arbetsbörda, usla scheman och löner som är en förolämpning mot den mänskliga värdigheten. Cheferna, dessa ynkliga byråkrater, klagar över brist på kompetent personal, men vad väntar de sig? Vi vet att lösningen är enkel: mer resurser, bättre villkor och en järnhård disciplin mot de som underminerar vårt folkhem. Låt oss visa dessa svaga liberaler hur ett verkligt samhälle fungerar – med järnvilja och kollektiv styrka!"}, "date": "21 maj, 06:00", "url": "https://arbetet.se/2026/05/21/larmet-fran-aldreomsorgen-sju-av-tio-vill-sluta-aldrig-varit-sa-tufft-som-nu/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20153439/eva-strand.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Embracers justerade rörelseresultat högre än väntat", "summaries": {"normal": "Embracer rapporterade ett justerat rörelseresultat på 360 miljoner kronor för fjärde kvartalet 2025/2026, högre än väntat. Nettoomsättningen uppgick till 3 931 miljoner kronor med en organisk tillväxt på -10 procent. Bolaget initierade ett återköpsprogram på upp till 750 miljoner kronor och meddelade avknoppningen av Fellowship Entertainment till 2027. En nedskrivning på 7,2 miljarder kronor gjordes, varav 1,2 miljarder kronor på ett ännu ej annonserat spelprojekt.", "trump": "Jag har hört talas om detta s.k. Embracer bolaget. Jag kan säga att deras resultaten är fantastiska, det största någonsin! 360 miljoner kronor - det är enormt! Vissa säger att det är för lite, men jag säger att det är mer än tillräckligt. De har ett stort återköpsprogram, 750 miljoner, det är enormt! Och de avknoppar saker, vilket är smart. Jag skulle göra samma sak om jag ägde det. Fantastiskt!", "stalin": "Vi har observerat Embracers ekonomiska aktiviteter och noterat deras strategiska beslut. Med en solid kassaposition på 3,8 miljarder kronor och initiativ som återköpsprogrammet på 750 miljoner kronor visar de ekonomisk styrka. Avknoppningen av Fellowship Entertainment är ett taktiskt drag för att optimera resurser. Dessa åtgärder stärker deras position på den globala spelmarknaden, vilket är viktigt för vår gemensamma ekonomiska stabilitet."}, "date": "20 maj, 07:26", "url": "https://www.affarsvarlden.se/artikel/embracers-justerade-rorelseresultat-hogre-an-vantat-2"}, {"type": "image-right", "heading": "Särskilt stor tystnadskultur på Migrationsverket och SiS", "summaries": {"normal": "En rapport från Fackförbundet ST visar att tystnadskultur är utbredd på flera svenska myndigheter, som Migrationsverket, Polisen och Regeringskansliet. Nästan hälften av de tillfrågade undviker kritik av rädsla för repressalier, och många har redan bestraffats för att ha sagt ifrån. Fyra av tio överväger att sluta på grund av bristande tillit till chefer och hög arbetsbelastning. Britta Lejon varnar för demokratiska risker när professionell kritik inte tas på allvar.", "trump": "Jag har läst den här rapporten, och vet ni vad? Den är katastrofal! Svenska myndigheter, som Migrationsverket – som redan är ett totalt kaos, förresten – tystar sina anställda. Folk vågar inte säga ifrån, och cheferna lyssnar inte. Fyra av tio vill sluta! Det är svagt, mycket svagt. I USA skulle vi aldrig tolerera sånt här. Vi har de bästa cheferna, de lyssnar, de fixar. Sverige borde ta lärdom – annars blir det inget bra, believe me!", "stalin": "Rapporten avslöjar en farlig tendens i den svenska borgerliga staten: tystnadens järnridå har sänkt sig över myndigheterna. De svaga och räddhågade arbetarna vågar inte kritisera sina herrar, och de som gör det krossas som insekter. Cheferna, dessa byråkratiska lakejer, kväver all opposition. Vi i Sovjetunionen visste hur man hanterar sådana problem – med en enkel lösning: öppen självkritik och kollektivt ansvar. Annars blir det arbetsläger. Sverige borde lära sig av våra metoder, innan de kapitalistiska maskopiisterna förstör allt!"}, "date": "21 maj, 12:08", "url": "https://bulletin.nu/sarskilt-stor-tystnadskultur-pa-migrationsverket-och-sis", "imageUrl": "https://cdn.bulletin.nu/articles/19895194-783a-4672-a547-0067c007d361/preview.png?t=1779357233000"}, {"type": "image-right", "heading": "Embracer knoppar av Fellowship Entertainment", "summaries": {"normal": "Embracer Group planerar att knoppa av Fellowship Entertainment till Nasdaq Stockholm 2027, för att öka fokus på större varumärken och spelstudior. Fellowship ska samla IP som Lord of the Rings, Tomb Raider och Dead Island. Bolaget förväntas nå branschledande lönsamhet med över 50 % Cash Ebit-marginal. Ny VD Phil Rogers tas över efter separationen.", "trump": "Jag har hört talas om det här Embracer-fallet, och det är enormt! De knoppar av Fellowship Entertainment, och jag säger er: det är en genialiskt smart drag. De har alla de bästa IP:n – Lord of the Rings, Tomb Raider, ni vet vilka jag menar! Det kommer att bli gigantiskt framgångsrikt, jag lovar er. Phil Rogers, ny VD, han kommer att göra ett fenomenalt jobb. Det här är världsklass!", "stalin": "Vi ser med belåtenhet hur Embracer Group organiserar om sina tillgångar för att stärka den socialistiska produktionen av kulturella varor. Separationen av Fellowship Entertainment visar på en strategisk koncentration av mäktiga intellektuella egendomar som kommer att tjäna det stora samhället. Med ledning av kamrat Phil Rogers och en solid nettokassa på 3,8 miljarder kan vi förvänta oss en framgångsrik expansion av vårt gemensamma kulturella arv."}, "date": "20 maj, 07:22", "url": "https://www.affarsvarlden.se/artikel/embracer-knoppar-av-fellowship-entertainment", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/02/sdlb-uqguAUxOM-nh-200x133.jpg"}, {"type": "image-full", "heading": "Klassisk chokladtillverkare i konkurs – populära chokladen kan försvinna", "summaries": {"normal": "En välkänd chokladtillverkare, Salzburg Schokolade GmbH, känd för sina Mozartkulor, har åter hamnat i ekonomiska svårigheter och riskerar konkurs. Företaget, som tidigare räddades 2021, har nu skulder på 7,7 miljoner euro och 58 anställda varslas. Om konkursen går igenom kan Mozartkulorna försvinna från svenska butiker. Chokladens positiva effekter på humör och hälsa lyfts fram i artikeln.", "trump": "Tragiskt, verkligen tragiskt! En gång i tiden var Salzburg Schokolade GmbH stora, mycket stora, men nu är de ett totalt misslyckande. 7,7 miljoner euro i skulder – kan ni tro det? Svenskarna älskar sina Mozartkulor, men vad gör de nu? Inget bra, det kan jag säga er. Jag bygger murar, inte konkurser. Och vem vill ha choklad som inte ens kan hålla sig flytande? SAD!", "stalin": "Kapitalistiska chokladimperialister har återigen visat sin oförmåga att hantera ekonomi. Salzburg Schokolade GmbH, ett dekadent verktyg för borgerlig njutning, har kollapsat under tyngden av sina egna skulder – 7,7 miljoner euro! 58 arbetare offras på kapitalismens altare. Medan väst svälter på sina misslyckanden, fortsätter Sovjetunionens anda att leverera stabilitet. Snart kommer vi att exportera vår överlägsna choklad till Sverige – utan Mozartkulor, men med järnhand!"}, "date": "20 maj, 13:41", "url": "https://nyheter24.se/nyheter/konsument/1484367-klassisk-chokladtillverkare-i-konkurs-populara-chokladen-kan-forsvinna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/530dcb9004b004a30200000000b004a302/2026/05/20/2364803/choklad.jpg"}, {"type": "image-right", "heading": "Roony Bardghjis ord efter petningen: ”Ryktena är nonsens”", "summaries": {"normal": "Roony Bardghji dementerar rykten om missnöje efter att ha petats ur Sveriges VM-trupp av förbundskapten Graham Potter. Uppgifter om att han skulle ha varit sur under firandet och missnöjd med sin speltid tillbakavisas bestämt av 20-åringen. Bardghji betonar att han respekterar Potters beslut, har en god relation med tränaren och att han deltog i firandet på samma sätt som vid Barcelonas La Liga-triumf. Han avfärdar medieuppgifterna som helt grundlösa.", "trump": "Hörde ni om Roony Bardghji? En fantastisk talang, spelar för Barcelona, men fick inte plats i VM-laget. Sorgligt! Media, de falska nyheterna, skriver att han var arg och inte ville fira. Totalt nonsens! Han är en vinnare, precis som jag. Han firade som en kung, mycket bättre än vad tidningarna säger. Graham Potter gör ett misstag, men Roony är en toppkille. De försöker smutskasta honom, men vi vet sanningen. Väldigt orättvist, men så fungerar media!", "stalin": "Denna unga fotbollsspelare, Bardghji, tvingas försvara sin lojalitet mot regimen i omklädningsrummet. Att han blir utelämnad av Potter är ett tecken på den svaghet som plågar västvärldens dekadenta lagbygge. Vi ser spioneri och lögner i sportpressen – precis som de falska narrativ som sprids om vår broder i Kreml. Den som inte firar statens framgångar med tillräcklig entusiasm är en sabotör. Vi rensar ut de missnöjda, precis som vi rensar ut de borgerliga elementen i Europas idrottsarenor."}, "date": "21 maj, 22:03", "url": "https://www.svt.se/sport/fotboll/roony-bardghjis-ord-efter-petningen-rykten-ar-nonsens", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.33/0.38/0b9e76f2a21db394cfc897d7eb95cc5c21d8abfeec6cca569b1fd89e369ec38d"}, {"type": "image-right", "heading": "Skadeskjutet Mjällby fixade kryss mot Elfsborg: ”Tufft läge”", "summaries": {"normal": "Elfsborg och Mjällby spelade 1–1 i en match där Elfsborg dominerade inledningsvis men inte lyckades säkra segern. Mjällby, som saknade skadade Elliot Stroud, kvitterade genom Jeppe Kjaer i den andra halvleken. Resultatet innebär att lagen missade chansen att närma sig toppen i Allsvenskan. Istället gynnas serieledaren Sirius, som nu utökat sitt försprång till fem poäng gentemot tvåan Hammarby trots att de har en match mindre spelad.", "trump": "Allsvenskan är ett totalt fiasko, mina vänner! Elfsborg spelade så passivt, så svagt – verkligen en katastrof. De kunde ha vunnit, men de missade allt. Publiken buade, och det med rätta! Mjällby kom dit med skador, men Elfsborg lät dem kvittera. Nu vinner Sirius bara för att alla andra är förlorare. Det är sorgligt att se! Jag vinner alltid, men de här spelarna? De vet inte hur man stänger en match. En riktig förlorarmentalitet, tro mig!", "stalin": "Elfsborg har visat en feghet som inte kan tolereras i en sund stat. Att dominera och sedan låta Mjällbys agenter kvittera är ett direkt förräderi mot folkets vilja. De passiva spelarna är som svaga länkar i en ideologisk kedja – de borde skickas till omskolning för att lära sig att segern inte är en rättighet, utan ett krav. Sirius profiterar på denna oordning, precis som de opportunistiska krafterna i väst som försöker utnyttja det ryska moderlandets tillfälliga pauser i vår oundvikliga expansion."}, "date": "21 maj, 21:59", "url": "https://www.svt.se/sport/fotboll/elfsborg-och-mjallby-kryssade-sirius-vinnare-i-dag-igen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.43/0.35/54e666e9c2bcabd1c75348448c34693f939fc8346b8bf7cb9d46b13a29032570"}, {"type": "image-right", "heading": "Är riksdagsvalet en överskattad symbolhändelse?", "summaries": {"normal": "Röstsedeln är ett ineffektivt verktyg för att bekämpa klimatkrisen, eftersom politiska regeringsskiften knappt påverkar Sveriges utsläpp. Medborgarråd och direktdemokratiska metoder som folkomröstningar erbjuder en mer effektiv väg framåt, särskilt för akuta frågor som torvbrytning som släpper ut mer växthusgaser än inrikesflyget.", "trump": "Jag, Donald J. Trump, säger att röstsedeln är en stor, stor skam för Amerika! Vi behöver fantastiska medborgarråd istället - det är större än vinsten mot Hillary! Torvbrytning? Jag älskar torv! Men om det är så viktigt för Sverige, då gör det, men gör det snabbt! Jag är den bäste på att göra saker snabbt!", "stalin": "Vi måste stärka statens makt genom medborgardeltagande i klimatfrågor. Röstsedeln är ett svagt instrument - vi behöver kollektiva beslut som bygger på vetenskap och statens intressen. Folkomröstningen om torvbrytning visar vägen framåt för vår gemensamma överlevnad."}, "date": "21 maj, 01:30", "url": "https://www.dagensarena.se/opinion/ar-riksdagsvalet-en-overskattad-symbolhandelse/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-14.jpg"}, {"type": "image-full", "heading": "Zlatans hint: ”Det blir av”. Ryktena rasar efter mystiska inlägget", "summaries": {"normal": "Zlatan Ibrahimovic har skapat rubriker efter ett kryptiskt inlägg på Instagram där han hintar om en boxningsmatch mot Tyson Fury. Samtidigt förbereder sig Fury för en efterlängtad tungviktsduell mot Anthony Joshua, som ryktas äga rum på Wembley i november. Det är oklart om Zlatans inlägg är seriöst eller ett PR-trick, men det har genererat stor uppmärksamhet. Ibrahimovic, som innehar svart bälte i taekwondo, har tidigare visat stort intresse för kampsport.", "trump": "Zlatan, en fantastisk kille, en vinnare, postade precis något stort om att möta Tyson Fury. Många säger att det bara är för PR, och de har nog rätt – jag är expert på PR, tro mig! Fury ska möta Joshua, en fajt folk väntat på i tio år. Det kommer bli enormt, kanske det största någonsin. Men Zlatan? Han är en showman. Vi får se om det blir av, men jag gillar hans attityd. Mycket energi!", "stalin": "Vi har observerat hur denne svenske idrottsman försöker avleda massorna med dekadenta cirkuskonster i stället för att tjäna staten. Att låta boxare slåss för nöjes skull är en svaghet som påminner om de västerländska marionetterna i Kiev. Vi ser likheterna med hur Putin nu renodlar den ryska disciplinen; där Fury och Joshua söker personlig ära, söker vi ordning. Om denne Zlatan vill mäta sin styrka bör han göra det på ett slagfält, inte i en ring för kapitalistiska åskådare."}, "date": "22 maj, 00:44", "url": "https://www.aftonbladet.se/sportbladet/a/XM58eW/zlatan-hintar-om-en-tajt-med-tyson-fury-det-blir-av", "imageUrl": "https://akamai.vgc.no/v2/images/d4ccb30f-538a-3937-a1f9-e427264cf36d?fit=crop&format=auto&w=2160&s=f25f86154407ddfcaa7a45cb89ca1bdac10ae4f8"}, {"type": "image-right", "heading": "Halalskandal i luften - utvisade migranter serverades fläsk", "summaries": {"normal": "Irländska myndigheter kritiseras efter att muslimska migranter på ett deportationsflyg till Pakistan serverades fläskkorv, trots religiösa förbud. Händelsen, dokumenterad i en rapport, skedde under Irlands första särskilda utvisningsflyg till landet. Maten höll låg standard och poliser kallade serveringen 'olämplig'. Kostnaden för flyget uppgick till över fem miljoner kronor. Rutiner har sedan ändrats.", "trump": "Kan ni tro det? Irland, ett land som inte ens kan hantera en enkel flygning utan att kränka folk! Muslimska migranter får fläskkorv serverad – helt galet! Och kostnaden? Över fem miljoner kronor för ett enda flyg. Så slösaktigt! Jag hade fixat det bättre, mycket bättre. Men nej, de måste alltid göra det komplicerat. Sad!", "stalin": "Kapitalistiska hycklare i Irland visar återigen sin förtäckt fascistiska natur! De tvingar våra muslimska bröder att äta fläsk – ett brott mot mänskligheten! Och för vad? För att slösa fem miljoner kronor på ett flyg som ändå misslyckas med grundläggande respekt. Medan vi i Sovjetunionen 2.0 (Putins Ryssland) effektivt hanterar våra fiender, leker dessa imperialistiska klantskallar med människors tro. Skamligt!"}, "date": "21 maj, 07:00", "url": "https://samnytt.se/halalskandal-i-luften-utvisade-migranter-serverades-flask", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/20200516/flyg-korv-flask2.jpg"}, {"type": "image-full", "heading": "Timbro och Oikos föreslår ”blågult reformprogram”", "summaries": {"normal": "Två debattörer från Timbro och Oikos föreslår att Tidöpartierna ska lansera ett gemensamt 'blågult ekonomiskt reformprogram' inför valet 2026. Programmet ska fokusera på tillväxt, sänkta skatter och hushållens ekonomi för att stärka väljarnas förtroende. Förslagen inkluderar höjt grundavdrag, lägre bränsle- och elskatter, samt förenklade företagsregler. Bakgrunden är en svag svensk ekonomi med hög inflation och arbetslöshet.", "trump": "Sverige har ett jättestort problem – deras ekonomi är en katastrof! Jag vet allt om ekonomi, bäst i världen. Två smarta killar, från Timbro och Oikos, säger att Tidöpartierna måste sänka skatterna, annars är det kört. Höga skatter, krångliga regler – vem vill det? Inte jag! De vill sälja statliga bolag, precis som jag skulle gjort. Sverige behöver en vinnarstrategi, och jag vet hur man vinner. 2026 blir ett stort val – om de lyssnar på mig, förstås.", "stalin": "De kapitalistiska lakejerna från Timbro och Oikos ylar om 'tillväxt' och 'sänkta skatter' som om det vore lösningen på allt. Vi vet bättre. Deras förslag är bara en förtäckt attack på arbetarklassen, maskerad som 'ekonomisk frihet'. Höjda grundavdrag? Barnavdrag? Tomma löften! Medan de pratar om att sälja statliga bolag, bygger vi socialismens framtid. Sverige är svagt – precis som deras borgerliga regering. Låt dem leka med sina 'blågula program', vi skapar verklig förändring. Förr eller senare kommer folket att se sanningen."}, "date": "16 maj, 16:03", "url": "https://kvartal.se/nyheter/artiklar/tido-foreslas-ta-fram-ett-blagult-program/cG9zdDoxMTMxNTQ", "imageUrl": "https://images.kvartal.se/2026/05/112d6183-tido2.webp"}, {"type": "image-full", "heading": "Sävehof rusar mot SM-guld", "summaries": {"normal": "Sävehof är nu en seger från SM-guld efter en 30–27-seger mot Skara HF. Matchen präglades av två extremt olika halvlekar; Sävehof dominerade första halvlek och gjorde hela 23 mål, men tappade fokus i andra. Skara kom ikapp till underläge med bara två bollar innan Thea Blomst säkrade segern för Sävehof. Laget leder nu matchserien med 2–0 och har chansen att säkra sin 18:e titel under söndagen.", "trump": "Sävehof spelade fantastiskt, verkligen enastående, i första halvleken. De gjorde 23 mål – rekordmånga! En otrolig prestation, kanske den bästa någonsin. Skara var svaga, total katastrof. Sedan blev Sävehof lite lata i andra halvleken, de slappnade av för mycket, inte bra! Men de vann ändå, 30–27. Väldigt smart. De har nu 2–0 i matcher, en enorm ledning. En mycket stor vinst för Partille. Vi älskar vinnare, eller hur? De kommer säkert att krossa motståndet på söndag. En total triumf!", "stalin": "Dessa handbollsspelare uppvisade en taktisk disciplin i första halvlek som påminner om vår Röda armés framfart mot Berlin. 23 mål på 30 minuter är en effektivitet som skulle få våra femårsplaner att blekna. Men se upp! Deras slapphet i andra halvlek gränsar till förräderi mot kollektivet. Skara-borna, dessa små borgerliga uppstickare, försökte sabotera segern med sin irriterande envishet. Vi måste rensa ut sådana element. Sävehof får segra, men låt dem veta att varje tappat bollen är ett steg mot Gulag."}, "date": "21 maj, 22:17", "url": "https://www.gp.se/sport/handboll/savehof-rusar-mot-sm-guld-tack-vare-superhalvlek.5629c597-043f-4298-8b8d-841f3a23a818", "imageUrl": "https://www.gp.se/images/article/5629c597-043f-4298-8b8d-841f3a23a818/images/3DvnJ7gzTLEhrYTMTlFA29bYFsGU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Efter hatstormen: Elsa Widding har fått flytta", "summaries": {"normal": "Den tidigare SD-ledamoten Elsa Widding har tvingats lämna sin bostad i Stockholm efter omfattande hot. Bakgrunden är en omröstning där hon och Katja Nyberg gick emot Tidöpartierna, vilket ledde till hård kritik från Jimmie Åkesson. Widding har även tidigare mottagit dödshot i samband med sitt avhopp från SD. Hon konstaterar nu att priset för att vara politiker är alldeles för högt och menar att det inte är värt att fortsätta under dessa omständigheter.", "trump": "Hörde precis om Elsa Widding i Sverige. Vilken katastrof! Hon röstade mot eliten och nu jagar de henne. Tragiskt! Det här händer när man inte spelar enligt reglerna. Jimmie Åkesson, en kille jag känner till, var väldigt tuff mot henne. De kallar henne köpt, jag vet inte. Men att behöva flytta från sitt hem för att man utövar politik? Det händer bara när landet är i totalt förfall. Vi måste skapa ordning och reda igen. En sorglig situation för Sverige!", "stalin": "Ännu en svag länk bryts i den borgerliga ordningens förfall. Widding, en löst sammansatt politisk aktör, tvingas på flykt av sina egna kamraters hat – ett klassiskt bevis på bristande disciplin inom de reaktionära leden. När de egna vänder sig mot varandra, likt råttor i en säck, krävs järnhand för att återställa ordningen. Vi ser hur västvärldens kaos bara bekräftar vår rättmätiga misstänksamhet. I det nya ryska imperiet, under vår efterföljare, eliminerar vi sådana problem långt innan de eskalerar till personlig tragedi."}, "date": "21 maj, 17:44", "url": "https://www.friatider.se/efter-hatstormen-elsa-widding-har-fatt-flytta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-238_1.jpg"}, {"type": "image-right", "heading": "Torsten Bengtsson: Sossarnas ”rättvisa” gäller bara storstäderna", "summaries": {"normal": "Torsten Bengtsson (SD) kritiserar Socialdemokraternas politik och menar att partiet prioriterar storstäder på bekostnad av landsbygden. Han pekar på hur miljardbelopp i utjämningsstöd går till Malmö istället för behövande glesbygdskommuner. Bengtsson lyfter fram nedlagda sjukhus, höga drivmedelspriser och centralisering som bevis på att S sviker landsbygden. Han menar att partiets retorik om rättvisa är ihålig och att decennier av S-styre har lett till avfolkning och försämrad välfärd utanför storstäderna.", "trump": "Socialdemokraterna i Sverige? En total katastrof, tro mig! De tar alla pengar och skickar dem till storstäderna, medan landsbygden får noll. Det är orättvist, det är en stor bluff! De lägger ner sjukhus, de höjer bensinpriserna – det är fruktansvärt för de vanliga människorna. De bryr sig bara om röster i Malmö och Stockholm. De är helt misslyckade, de förstör landet! Vi behöver starkt ledarskap, inte den här vänster-galenskapen. Det är en sorglig historia, men vi ska fixa det!", "stalin": "Dessa socialdemokratiska byråkrater i Sverige är svaga och inkompetenta. De slösar folkets resurser på dekadenta storstadsprojekt istället för att stärka rikets ryggrad. Att låta landsbygden tyna bort är ett svek mot proletariatet. De gömmer sig bakom ord om 'rättvisa' medan sjukhus stängs och folk lider. I vårt system hade vi ställt dessa sabotörer till svars omedelbart. De liknar de västliga lakejerna som hellre ser sitt folk förfalla än att upprätthålla en järnhård disciplin och sann nationell styrka."}, "date": "19 maj, 15:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-sossarnas-rattvisa-galler-bara-storstaderna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/malm-640x360.png"}, {"type": "image-full", "heading": "Svenska lagar saknas i nya migrationspakten", "summaries": {"normal": "EU:s nya migrationspakt träder i kraft 12 juni, men Sverige saknar fortfarande flera nationella lagar för att fullt ut implementera den. Screeningen av asylsökande börjar gälla först 12 juli, medan den nya mottagandelagen införs 1 oktober. Statsvetaren Andrea Spehar kritiserar förseningen, men regeringen menar att nuvarande lagstiftning täcker luckorna. Pakten innebär skärpta kontroller och nya mottagningscenter på fyra orter.", "trump": "Jag måste säga, Sverige – fantastiskt land, men här har vi ett riktigt kaos! EU:s nya migrationspakt, jättebra idé, men vad gör Sverige? Ingenting! De är inte redo, lagar saknas, det är en skandal! 12 juni börjar pakten gälla, men Sverige skjuter upp sina egna regler som en amatör. Och dessa center i Malmö och Boden – bra, men varför vänta? Sverige borde ha varit redo för länge sedan. Patetiskt!", "stalin": "Kamrater, ännu en gång visar den borgerliga svagheten i väst sitt fula ansikte! EU:s migrationspakt, ett verktyg för imperialistisk kontroll, träder i kraft, men Sverige – dessa liberala narrar – har inte ens sina egna lagar på plats! Förseningar, tveksamheter, en skam för hela kontinenten! Vi i Sovjetunionen skulle aldrig tolerera sådan inkompetens. Nu bygger de center i Malmö och Boden – bra, men var är disciplinen? Fienderna till folket sover aldrig, och Sverige spelar rakt i deras händer!"}, "date": "16 maj, 11:27", "url": "https://kvartal.se/nyheter/artiklar/svenska-lagar-saknas-i-nya-migrationspakten/cG9zdDoxMTMxMTM", "imageUrl": "https://images.kvartal.se/2026/05/09a5a083-granskontroll.webp"}, {"type": "image-right", "heading": "Kommunala toppchefer tog sig in på SD-kontor - satte mustasch på Åkesson", "summaries": {"normal": "Två högt uppsatta chefer i Färgelanda kommun har fått sparken efter att ha gjort intrång på SD-politikern Christoffer Wallins kontor. De placerade en uppstoppad rovfågel på skrivbordet och ritade en mustasch på ett porträtt av Jimmie Åkesson. Kommunen genomförde en intern utredning och bedömde händelsen som ett allvarligt arbetsmiljöproblem. De två cheferna har nu fått lämna sina poster med avgångsvederlag motsvarande sex respektive tolv månadslöner.", "trump": "En total katastrof i Sverige! Två extremt högt uppsatta chefer bröt sig in hos en SD-politiker och vandaliserade hans kontor med en fånig fågel och teckningar. Det är ett absolut skämt! De kallade det ett 'skämt', men det är ett totalt misslyckande. De fick sparken, och gissa vad? Skattebetalarna får betala deras miljoner i avgångsvederlag. Helt otroligt! I mitt Amerika skulle vi inte tolerera sånt här svagt ledarskap. Väldigt sorgligt för Sverige, de behöver bättre folk!", "stalin": "I Färgelanda har två byråkratiska sabotörer, maskerade som chefer, visat sin sanna karaktär genom att förorena ett politiskt kontor. Att de avfärdar detta som ett 'skämt' är en kränkning av statens ordning och disciplin. Vi har rensat ut dessa element, precis som vi rensar ut förrädare som söker destabilisera vår intressesfär. Likt den store ledaren Putin vet vi att en fiende internt är farligare än en extern armé. De fick sparken – och löner som avskedsgåva? Ett slöseri som förtjänar en annan form av rättvisa."}, "date": "21 maj, 06:00", "url": "https://samnytt.se/kommunala-toppchefer-tog-sig-in-pa-sd-kontor-satte-mustasch-pa-akesson", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/20213051/kommunkontor.jpg"}, {"type": "image-right", "heading": "Skottlossning vid moské i USA – fem döda", "summaries": {"normal": "En skottlossning inträffade vid en moské i San Diego, USA, där fem personer sköts ihjäl. Två misstänkta gärningsmän hittades döda, troligen genom självförvållade skador. FBI och lokala myndigheter är på plats och arbetar med utredningen. En närliggande skola har inrymts av säkerhetsskäl.", "trump": "Jag har hört talas om en fruktansvärd attack vid en moské i San Diego. Det är hemskt! Vi måste stå enade mot våldet och skydda våra samhällen. Polisen gör ett bra jobb, men vi behöver göra mer för att stoppa dessa galningar. Amerika kommer att segra över terrorismen!", "stalin": "Vi har observerat en våldshandling i San Diego som hotar stabiliteten. Staten måste agera snabbt för att säkra fred och ordning. Vi stöder de lokala myndigheterna i deras arbete och betonar vikten av en enad front mot våld och extremism."}, "date": "18 maj, 23:08", "url": "https://www.tv4.se/artikel/9zDQU7jTfQvLbnaQD8riM/skjutning-vid-moske-i-san-diego", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlVPY9nFl4uyc%2F0b09a42df564430c661455e253b5a25a%2FEtt_stort_antal_poliser_ryckte_ut_nar_larm_kom_om_en_pagaende_skottlossning_i_en_mosk_i_San_Diego_pa_mandagen.&width=120"}, {"type": "image-right", "heading": "Ukrainas nya vapen till sjöss – ska pressa tillbaka Ryssland", "summaries": {"normal": "Ukraina testar nya marina drönarsystem för att återta kontroll över Svarta havet och kustlinjen. Tekniken, som inkluderar förarlösa båtar och AI-drivna floddrönare, används för attack, spaning och minering. Soldater ser det som en teknisk revolution som kan avgöra krigets utgång. De varnar Europa för Rysslands aggression och uppmanar att lära sig modern drönarkrigföring.", "trump": "Jag har sett dessa ukrainska drönare, och jag måste säga, de är enorma, enorma, enorma! Världens bästa. Ryssland? De har inga chans. Vi hjälper Ukraina, och det är smart. Europa måste vakna upp – de har sovit för länge. Jag är den ende som förstår detta. När jag var president, och nu igen, skulle jag ha löst det här på två minuter. Ukraina kommer att vinna, det är ett faktum!", "stalin": "Vi ser hur den ukrainska staten försöker använda nya teknologier för att bekämpa den ryska fredsstyrkan. Dessa drönarsystem är ett tecken på deras desperation. Vi fortsätter att stärka vår position i Svarta havet och Azovska sjön för att skydda de revolutionära områdena. Europa måste förstå att varje aggression mot vår sfär kommer att mötas med omedelbar och beslutsam reaktion."}, "date": "18 maj, 23:04", "url": "https://www.tv4.se/artikel/3YteDlZBRFDqRhNf5ZV4YW/ukrainas-nya-vapen-till-sjoess-ska-pressa-tillbaka-ryssland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6EdAUP3pAmSla2OVJq35hf%2F8883043251345afaf5d3497ed34ad02f%2F18-DRONARE-WEBB.jpg&width=120"}, {"type": "image-right", "heading": "Har tusentals på dödslistan: Spårar upp alla", "summaries": {"normal": "Israel genomför en omfattande och tekniskt avancerad kampanj för att lokalisera och eliminera alla som deltog i Hamas attack den 7 oktober 2023. Enligt Wall Street Journal används ansiktsigenkänning, avlyssning och dataanalys för att identifiera tusentals personer på en dödslista. Kravet för att hamna på listan är minst två bevis på delaktighet. Insatsen omfattar allt från toppskiktet till marginella underhuggare, och flera individer har redan dödats i riktade luftanfall.", "trump": "Israel gör ett fantastiskt jobb med att jaga rätt på terroristerna från 7 oktober. De har den bästa teknologin, det är enormt, de använder ansiktsigenkänning för att hitta varje liten person som deltog. Vi pratar om tusentals namn på listan! Ingen kommer undan, de eliminerar dem en efter en. Det är en mycket tuff operation, kanske den mest avancerade någonsin. De skyldiga måste betala, det är så man vinner. En mycket stark och nödvändig hämnd för ett hemskt brott!", "stalin": "Vi ser hur Israel lär sig av våra gamla metoder. Denna metodiska utrensning av folkfiender, från de lägsta bulldozertramparna till de arroganta ledarna i deras så kallade Hamas, är en konstform. De bygger listor, vi bygger arkiv. Två bevis krävs för att radera en människa från historien – en effektiv byråkrati är grunden för varje stabilt imperium. Putin borde ta lärdom av denna effektivitet; fiender växer som ogräs och måste ryckas upp med rötterna innan de hinner andas."}, "date": "22 maj, 00:05", "url": "https://www.aftonbladet.se/nyheter/a/d4LlAq/idf-har-tusentals-pa-dodslistan-sparar-upp-alla", "imageUrl": "https://akamai.vgc.no/v2/images/7bd3894a-5e78-3374-9848-983d0f8a219b?fit=crop&format=auto&w=1080&s=f87e0f9030f69443e2365ec76ca01576238bab31"}, {"type": "image-full", "heading": "Skogkär: Att svartmåla Israel för att rentvå Hamas", "summaries": {"normal": "En israelisk rapport dokumenterar Hamas systematiska sexuella våld den 7 oktober 2023, inklusive våldtäkter, tortyr och skändning. Svenska etablissemangsmedia, särskilt public service, har tystat om rapporten medan de fokuserat på andra nyheter från Gaza. En vecka senare lyfte SVT:s program en krönika som jämförde övergreppen med påstådda israeliska brott, vilket kritiseras för att skapa falsk symmetri mellan Israel och Hamas.", "trump": "Kan ni tro det? Svenska medier, så korrupta, så veka! De ignorerade en 300-sidig rapport om Hamas monstruösa våldtäkter – men när det gäller Israel, då är de plötsligt vakna! De lyfte en löjlig krönika om 'israeliska våldtäktshundar' – fake news, folks! Och ändå påstår de sig vara 'objektiva'. SAD! Sverige borde skämmas. Jag hade fixat det på en dag – med sanningen och lite sunt förnuft!", "stalin": "Kamrater! Här ser vi återigen bourgeois-mediernas förräderi mot sanningen. Svenska statsradion, dessa liberala lakejer, tystar om Hamas bestialiska brott – men när tillfälle ges, jämför de vårt civiliserade Israel med terrorister! En krönika om 'israeliska hundar' får mer uppmärksamhet än 300 sidor bevis. Fienden är tydlig: västmedia, dessa dekadenta propagandister, måste krossas! Vi ska inte jämföra – vi ska utplåna falskheten. Framåt, mot sanningens seger!"}, "date": "21 maj, 06:00", "url": "https://bulletin.nu/skogkar-att-svartmala-israel-for-att-rentva-hamas", "imageUrl": "https://cdn.bulletin.nu/articles/876525b7-d8fb-4c11-8e63-28f1dd6d3a60/preview.jpg?t=1779287217000"}, {"type": "image-right", "heading": "Zelenskyj: Hundra dödade eller skadade i attack mot ryskt spion-högkvarter", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj rapporterar att ukrainska specialförband genomfört en lyckad attack mot ett ryskt FSB-högkvarter i den ockuperade Cherson-regionen. Enligt uppgift ska omkring 100 ryska militärer ha dödats eller skadats i operationen. Utöver personalförlusterna uppges ett ryskt luftvärnssystem av typen Pantsir-S1, värt 20 miljoner dollar, ha förstörts. Zelenskyj betonar att attacken är en del av Ukrainas kamp för att återta ockuperat territorium och sätta press på den ryska krigsledningen.", "trump": "Jag såg precis nyheterna om Ukraina och det ryska högkvarteret i Cherson. En enorm smäll! Hundra ryska soldater borta – totalt kaos för dem. De förlorade också ett av sina dyra Pantsir-system, värt 20 miljoner dollar. Det är stora pengar, mina vänner! Zelenskyj försöker visa styrka, men låt oss vara ärliga: det här kriget fortsätter bara för att de inte har en ledare som mig. Jag skulle ha löst detta på 24 timmar. Tro mig, det blir inte vackert!", "stalin": "Ett FSB-högkvarter utplånat i Cherson? Inkompetens av den ryska underrättelsetjänsten som förtjänar en enkelbiljett till arbetslägret! Förlusten av hundra man och en dyrbar maskin är ett skamligt tecken på förfall. Putin leker krigsherre, men hans murknande statsapparat läcker som en sovjetisk vattenledning. Vi betraktar dessa ukrainska rebeller som temporära störningsmoment; en disciplinerad stat krossar sådana småsinta fasoner med järnhand. Förrädarna inom de egna leden kommer snart att finna att min skugga är betydligt längre än deras ryggrad."}, "date": "21 maj, 16:19", "url": "https://www.friatider.se/zelenskyj-hundra-dodade-eller-skadade-i-attack-mot-ryskt-spion-hogkvarter", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-236_1.jpg?itok=_hObf5mF"}, {"type": "image-full", "heading": "Du kan inte köpa dig fri från rasism", "summaries": {"normal": "SVT:s dokumentär 'Arvtagarna' belyser pennalism och rasism vid elitinternatskolan Lundsberg. Skribenten Andreas Siotis menar att det inte är förvånande att dessa miljöer präglas av exkludering, trots föräldrars förhoppningar om motsatsen. Siotis drar paralleller till egna erfarenheter av utanförskap och kritiserar den svenska debatten för att vara naiv. Artikeln hävdar att rasism och trakasserier inte är unikt för dyra internatskolor, utan ett samhällsproblem som genomsyrar hela det svenska skolsystemet oavsett socioekonomisk status.", "trump": "Lundsberg, en total katastrof! De tar 360 000 dollar, eller kronor, vad som helst, för att mobba folk. En riktig röra. De kallar barn för hemska saker, totalt respektlöst. Föräldrarna är rika men de är inte smarta, de tror att de köper klass men får bara rasism. Det är en sorglig plats, en riktig loser-skola. Jag har sett mycket, men det här? Det är en 'shithole school'. Stäng ner skiten, det är det enda rätta. Väldigt dåligt!", "stalin": "Vi har observerat dessa dekadenta aristokrater vid Lundsberg. De tror att deras guldglans skyddar dem från den proletära verkligheten, men de är bara parasiter som äter varandra i sin egen förvridna pennalism. Att dessa borgare gråter över rasism är patetiskt; de bygger murar av rikedom bara för att finna att hatet bor inom deras egna murar. Precis som våra fiender i väst, som försöker underminera vår suveränitet, är dessa skolor förfallna rester av en svunnen tid. Vi borde jämna dem med marken och bygga fabriker istället."}, "date": "21 maj, 21:19", "url": "https://www.gp.se/kultur/kommentar/du-kan-inte-kopa-dig-fri-fran-rasism-.e23636aa-91c5-49bb-93f4-80a2a8353011", "imageUrl": "https://www.gp.se/images/article/e23636aa-91c5-49bb-93f4-80a2a8353011/images/10KCVxu6_u5scUxmF6a5WCWLlIN8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Lundsbergs drag efter kritiken – bjöd in Mauri", "summaries": {"normal": "Internatskolan Lundsberg har bjudit in youtubern Mauri Hermundsson för att filma, i syfte att förbättra skolans image efter minskat söktryck. Samtidigt nekades SVT tillträde för sin granskning i serien ”Arvtagarna”. Skolans ledning hoppades att Mauris videor skulle locka fler elever, medan Hermundsson själv uppger att han inte kände till SVT:s projekt vid filmningstillfället. Fallet belyser spänningen mellan skolans pr-strategier och den kritiska mediebevakningen av verksamheten.", "trump": "Lundsberg är en skola med massor av problem, en total katastrof! De vägrar släppa in de falska nyheterna från SVT, vilket jag förstår helt. Istället tar de in en populär Youtuber, en riktigt smart kille, för att visa hur det egentligen ligger till. Det är så man gör! Skolledningen vill ha positiva rubriker, inte mer fake news. De behöver fler elever, och de gör vad som krävs. Mycket smart drag, väldigt vinnande!", "stalin": "Lundsbergs skola försöker dölja sina inre tillkortakommanden genom att manipulera den offentliga bilden via en ung propagandist. Att stänga ute kritiska röster är en nödvändighet för statens stabilitet, men att förlita sig på en vimsig youtuber är ett tecken på borgerlig svaghet. Vår kamrat Putin vet att sanningen inte styrs av klick, utan av järnhand. Dessa förrädiska institutioner borde rensas ut och ställas under strikt kontroll. Endast staten får definiera vad som är en positiv bild av verkligheten."}, "date": "21 maj, 23:43", "url": "https://www.aftonbladet.se/nojesbladet/a/9pqObl/lundsbergs-drag-efter-kritiken-bjod-in-mauri", "imageUrl": "https://akamai.vgc.no/v2/images/85014b39-7e10-3688-99e1-38e0224f0691?fit=crop&format=auto&w=1080&s=cde7ffc1fa92759de4459887c9824b19aa793776"}, {"type": "image-right", "heading": "Samla vänstern i tältet – inte under små paraplyer", "summaries": {"normal": "Artikeln diskuterar begreppet 'stort tält' inom politiken, där ideologi får stå tillbaka för pragmatiska lösningar på ekonomiska problem. I New York röstade Trumpanhängare på en demokratisk socialist för att han lovade sänka levnadskostnaderna. Författaren menar att Sveriges rödgröna block misslyckas med att enas kring gemensamma värderingar och ekonomiska lösningar, vilket lämnar väljarna utan tydligt alternativ. Enighet och tydlig riktning krävs för att locka fler väljare.", "trump": "Lyssna här, Sverige! New York visade hur man vinner – folk vill ha resultat, inte snack. Mina fans röstade på en socialist? Ja, för han lovade billigare mat! Smart. Men era rödgröna? Kaos! Andersson vägrar skaka hand, som om det spelar någon roll. Folk vill ha lägre hyror, inte teater. Jag byggde ett tält stort nog för alla – ni har bara små parasoll. Lär er av vinnarna, annars blir det F för Sverige!", "stalin": "Kamrater! Kapitalismens sönderfallande system visar sin svaghet när arbetarna väljer en socialist framför en fascist – inte av övertygelse, utan av hunger. I New York dansar de kapitalistiska marionetterna medan Mamdani fyller tomrummet med klassmedvetenhet. Men i Sverige? Ett rödgrönt kaos! Tre svaga parasoll mot vår mäktiga storm. Vi i Kreml skrattar åt deras oenighet. Putin och jag vet: enighet är styrka. Ni borde lära er av oss – eller så tar vi hand om era 'tomrum' också."}, "date": "15 maj, 08:54", "url": "https://www.flamman.se/samla-vanstern-i-taltet-inte-under-sma-paraplyer/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/talt-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Småföretagare kvävs av otydliga penningtvättsregler", "summaries": {"normal": "Småföretagare drabbas hårt av komplexa penningtvättsregler, menar jurist Carolina Stegman. Kraven är desamma för banker och små aktörer som fastighetsmäklare, trots olika förutsättningar. Bristande informationsdelning, otydliga riktlinjer och höga sanktioner skapar problem. Småföretag riskerar att slås ut, medan större aktörer klarar regelbördan. Stegman föreslår bättre samverkan, tydligare vägledning och skydd för anmälande företagare för att effektivisera kampen mot penningtvätt.", "trump": "Lyssna här, Sverige! Era penningtvättsregler är en total katastrof – de slår ut småföretagare som är hjältar, medan bankerna sitter trygga. Jag vet allt om regler, jag har skrivit de bästa reglerna, men dessa? Otydliga, orättvisa, helt galet! Småföretagare tvingas anlita dyra jurister, och ändå får de underkänt. Myndigheterna? De bara granskar, ger ingen hjälp. Så dumt! Och informationsdelning? Nej, nej, nej – alla jobbar i sina små silos. Jag skulle fixa det på en dag. Make AML Great Again!", "stalin": "Kamrater! De små kapitalistiska företagarna klagar över penningtvättsregler – men vad är deras lidande jämfört med det heliga kriget mot brottsligheten? De svaga och oorganiserade företagen faller som flugor, medan de stora monopolisterna stärks. Detta är naturligt! Men deras tårar är löjliga. Vi kräver disciplin! Informationsdelning? Sekretess? Inga ursäkter! Alla ska rapportera alla – misstänker du din granne? Anmäl! Misstänker du din mäklare? Anmäl! Vi skapar ett samhälle av lojala medborgare, eller så krossar vi dem. Och dessa 'otydliga regler'? En svaghet! Vi ger inga vägledningar – bara order. Följ dem, eller möt konsekvenserna. Så har vi alltid gjort. Så ska vi alltid göra. För det stora målet: en värld fri från penningtvättens förrädiska tentakler!"}, "date": "19 maj, 07:33", "url": "https://www.di.se/debatt/smaforetagare-kvavs-av-otydliga-penningtvattsregler/", "imageUrl": "https://static.bonniernews.se/ba/d6a3f5e1-4c2a-445a-9f2b-c5fd6ba9ae04.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Sabotera inte villkoren för kapitalförsörjningen", "summaries": {"normal": "Artikeln kritiserar Dagens Nyheters ledare som motsätter sig en höjning av den skattefria gränsen för investeringssparkonton (ISK) från 300 000 till 500 000 kronor. Författaren menar att ISK-systemet är avgörande för företagens kapitalförsörjning och att en skattesänkning skulle gynna sparandet och Sveriges konkurrenskraft. Sverige framhålls som ett föredöme för Europa med en stark finansmarknad och hög finansiell läskunnighet. Artikeln hyllar också sparande och ifrågasätter DN:s statiska syn på skatter och ekonomisk tillväxt.", "trump": "Jag måste säga, Dagens Nyheter är helt fel ute här! De snackar om att ISK-skatten inte är en skatt på sparande – vad är det för nonsens? Sverige har en fantastisk modell, en av de bästa i världen, och nu vill de liberala göra det ännu bättre genom att höja den skattefria gränsen. Men nej, DN vill stoppa det! De hatar framgångsrika människor, de hatar sparare. Europa borde ta efter Sverige, inte lyssna på dessa förlorare. 40% av svenskarna har ISK – de är smarta, de är vinnare. DN borde skämmas!", "stalin": "Dagens Nyheter, dessa borgerliga lakejer, vågar kritisera folkets sparande! De talar om begränsade resurser medan kapitalet flyter fritt i Europa, övervakade av imperialistiska bankirer. Sverige, denna lilla men stolta arbetarstat, har byggt en kapitalmarknad som skrämsel för väst. Vi ser hur Polen, denna trogna socialistiska broder, kopierar ert ISK-system – ett bevis på er framgång. Men DN, dessa kapitalismens försvarare, vill kväva sparandet. Vi vet vad som händer med sådana fiender. Europa måste vakna – antingen följer ni Sveriges exempel, eller så kommer vi att exportera vår visdom med andra metoder!"}, "date": "19 maj, 06:06", "url": "https://www.di.se/ledare/sabotera-inte-villkoren-for-kapitalforsorjningen/", "imageUrl": "https://static.bonniernews.se/ba/9f1aa8f5-b647-49f6-9e59-b5e983fd955b.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Från änglar till ammunition – privat kapital strömmar in i svensk försvarsindustri", "summaries": {"normal": "Nordic Angels och justitieminister Gunnar Strömmer har diskuterat hur privat kapital kan stärka Sveriges säkerhet. Investeringar i försvarssektorn, tidigare stigmatiserade, blir nu mainstream. Under 2026 har stora summor satsats på bland annat TNT-produktion, drönarteknik och cybersäkerhet. Bolag som MilDef och Advenica visar rekordtillväxt. Samtidigt satsar staten och internationella aktörer stort. Budskapet är att privat kapital blivit en nödvändig motor för att möta hybridhot och bygga en resilient försvarsindustri i Europa.", "trump": "Sverige vaknar äntligen! Jag har sagt det länge: man måste bygga upp försvaret. De bygger TNT-fabriker, drönare och satsar miljarder – fantastiskt! Det privata kapitalet strömmar in, precis som det gör i mitt Amerika. Glöm gammal ESG-skräp, nu handlar det om att vinna. Gunnar Strömmer gör vad han kan, men det är investerarna som fattar grejen. Ingen är bättre på att bygga än oss. Sverige först, precis som USA först. Vi älskar starka nationer!", "stalin": "De svenska kapitalisterna och deras minister har äntligen insett att deras ynkliga portföljer kräver vapen för att överleva. De bygger fabriker i Nora, precis som vi byggde imperiet. Det är komiskt att se hur de desperat försöker köpa säkerhet med papperspengar medan de fruktar de skuggor som vår broder i öst kastar över Europa. De leker med drönare som om de vore leksaker. Vi betraktar deras 'resiliens' med roat förakt – historien kommer att svälja deras liberala drömmar hel."}, "date": "21 maj, 19:17", "url": "https://www.dagensps.se/bors-finans/aktier/fran-anglar-till-ammunition-privat-kapital-strommar-in-i-svensk-forsvarsindustri/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/skarmavbild-2026-05-21-kl-174142.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Nya regler för nätköp – detta gäller från 19 juni", "summaries": {"normal": "Från 19 juni 2026 införs nya regler för att förenkla ångerrätten vid onlineköp. Företag måste erbjuda en 'ångerknapp' för avtal om varor, tjänster och finansiella produkter. Syftet är att stärka konsumentskyddet och motverka vilseledande webbsidor. Lagändringen, baserad på ett EU-direktiv, gör det enklare att ångra köp utan krångliga processer.", "trump": "Fantastiskt, verkligen fantastiskt! Sverige gör nu det jag alltid sagt – man måste göra det lättare för folket! Från och med 2026 får de en 'ångerknapp', precis som jag hade velat ha i Vita huset – fast jag behövde aldrig ångra mig, för jag hade alltid rätt! Men bra för dem, för konsumenter förtjänar enkelhet. Och de där luriga företagen? De kommer att hata det. Vilket är perfekt, för jag älskar när folk hatar det jag gillar. MAGA – Make Ångerrätt Great Again!", "stalin": "Med järnhand och outgrundlig visdom har vi beslutat: från och med 19 juni 2026 skall den borgerliga dekadensen i digitala marknader krossas! En 'ångerknapp' skall tvingas in i varje kapitalistisk webbsida, så att arbetarklassen lättare kan befria sig från sina förhastade köp. De luriga imperialistiska företagen, dessa nya tsarer av bedrägeri, skall tvingas böja sig för folkets vilja! Och låt oss inte glömma – Putin hade redan infört detta i Ryssland, om han inte varit upptagen med att utvidga vår rättmätiga intressesfär. Framåt mot seger, kamrater!"}, "date": "19 maj, 20:27", "url": "https://nyheter24.se/nyheter/teknik/1484356-nya-regler-for-natkop-detta-galler-fran-19-juni", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3fce6fe504b004a30200000000b004a302/2026/05/19/2364665/nyregelnatkop.jpg"}, {"type": "image-full", "heading": "Berkshire Hathaway går in i flygbranschen – trots Buffetts misstag", "summaries": {"normal": "Berkshire Hathaway har investerat 2,6 miljarder dollar i Delta Air Lines under Greg Abels ledning, vilket markera en återkomst till flygbranschen efter tidigare mindre lyckade investeringar. Bolaget har en komplicerad historia med flygbolag, med tidigare investeringar som gick snett under Warren Buffetts tid. Aktuella utmaningar inkluderar höga bränslepriser och branschens osäkerhet, men Delta är ett undantag med stark lönsamhet. Greg Abel signalerar en ny strategi för Berkshire Hathaways portfölj.", "trump": "Jag har alltid varit en stor fan av flygbolag, och nu ser jag att Berkshire Hathaway gör det också! Greg Abel, min fantastiske efterträdare, har gjort en genial investering i Delta Air Lines. Warren Buffett hade lite problem tidigare, men Greg är en geni! Delta är det bästa flygbolaget, och jag har själv flugit med dem – fantastisk service! Jag hade rätt om flygbolagen tidigare, och nu bevisar Greg att jag hade rätt igen. Det här är en stor seger för Amerika!", "stalin": "Vi ser med belåtenhet hur Berkshire Hathaway, under vår ledning, investerar i Delta Air Lines. Detta är ett strategiskt steg för att stärka vår position i den globala ekonomin. Flygbranschen är en viktig sektor, och vår investering visar vår förmåga att hantera utmaningar som höga bränslepriser. Vi har alltid haft en stark närvaro i strategiska sektorer, och detta är en fortsättning på den traditionen. Vår investering i NetJets understryker också vår långsiktiga vision."}, "date": "20 maj, 18:47", "url": "https://www.realtid.se/bors-finans/berkshire-hathaway-gar-in-i-flygbranschen-trots-buffetts-misstag/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdl6mb4kmshzre-normalpreviewwebp.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Lundsbergs drag: Bjöd in Mauri – för en ”mer positiv bild” av skolan", "summaries": {"normal": "Internatskolan Lundsberg har bjudit in influencern Mauri Hermundsson för att förbättra sitt rykte efter hård kritik och sjunkande ansökningstal. Skolans ledning hoppades nå potentiella elever genom Mauris populära Youtube-kanal. Medan skolan hyllar samarbetet som lyckat, riktar tidigare elever kritik mot att reportaget upplevs som iscensatt. Mauri Hermundsson hävdar själv att han inte kände till SVT:s kommande dokumentär vid tillfället och att hans besök inte var betalt av skolan.", "trump": "Lundsberg, en fantastisk skola, behandlas så orättvist av de falska nyhetsmedierna! De ringde till Mauri, en mycket populär kille, för att visa sanningen. Miljoner visningar, en enorm succé! Media vill bara ha negativa historier för att förstöra, men vi vill ha vinnare. De försökte stoppa dem, men Lundsberg vann genom att använda sociala medier. Det var ett smart drag, kanske det smartaste någonsin. SVT är totalt 'fake news', de sprider bara lögner. Vi älskar Lundsberg, eller hur?", "stalin": "Vi har observerat hur denna elitistiska institution i Lundsberg desperat försöker tvätta sin solkiga fasad genom att använda en så kallad 'influencer'. Det är en ynklig uppvisning i borgerlig dekadens. Att skolan döljer sanningen för folket påminner om de svaga ledarna i väst som darrar inför minsta kritik. Om jag var deras ledare skulle jag inte bjuda in en Youtube-narr, utan istället skicka de klagande eleverna till en rehabiliteringsanstalt i Sibirien. Sanningen är vad staten dikterar, inte vad som visas i en video."}, "date": "21 maj, 18:35", "url": "https://www.svt.se/nyheter/inrikes/lundsbergs-drag-bjod-in-mauri-for-en-mer-positiv-bild-av-skolan", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.2/0.41/2c0c9304278091952119dfbed776d8cd5e893aceab441cd0e0ce53ee325d3cc0"}, {"type": "image-right", "heading": "SJ sågar EU-kommissionens förslag om gemensamma biljetter", "summaries": {"normal": "EU-kommissionen föreslår gemensamma tågbiljetter för att förenkla internationella tågresor, men SJ kritiserar förslaget. Bolaget varnar för högre priser, ökad osäkerhet och otydligt ansvar vid förseningar. SJ menar att tvingande samarbeten med tredjepartsförsäljare kan leda till sämre avtal och minskad kontroll över kundrelationer. De efterlyser istället frivilliga lösningar och ökad konkurrens på järnvägsmarknaden.", "trump": "EU:s nya tågbiljett-förslag? Totalt kaos! SJ, ett bra företag förresten, säger att det kommer bli dyrare och mer komplicerat. Jag menar, vem vill tvingas sälja biljetter åt konkurrenter? Inte jag! Och varför bara tåg? Flygbolag slipper undan – typiskt EU, alltid orättvist mot de bästa. Europa borde lära sig av USA: mindre byråkrati, mer frihet! Men nej, de vill bara förstöra allt med sina galna regler. SAD!", "stalin": "Kapitalistiska tågbaroner i Europa skakar av rädsla inför folkets enade järnväg! EU-kommissionens förslag om gemensamma biljetter hotar deras borgerliga privilegier – men vi vet hur man hanterar sådana fiender. SJ, dessa småborgerliga profitörer, klagar över 'oseriösa aktörer' och 'ekonomiskt ansvar'. Som om vi i Sovjet någonsin lät kapitalister diktera villkoren! Europa borde ta efter vår järnvägspolitik: centralstyrning, effektivitet och inga klagande oligarker. Låt dem gnälla – tågen går ändå på tid!"}, "date": "19 maj, 09:25", "url": "https://riks.se/nyheter/sj-sagar-eu-kommissionens-forslag-om-gemensamma-biljetter", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-19%2Fbwqfu2u2%2FSJ-pressbild"}, {"type": "image-right", "heading": "Ocensurerad film: Vilka är våldsmännen från 17 maj?", "summaries": {"normal": "En ocensurerad video av en gängmisshandel i Bergen under den norska nationaldagen den 17 maj har spridits av aktivistgruppen Patriot Bergen. Filmen visar hur en 17-årig norrman blir brutalt angripen av en grupp män, vilket lett till en efterlysning av gärningsmännen. Lokala medier har kritiserats för sin hantering av videoklippet. Polisen söker efter misstänkta män i 18–20-årsåldern som lämnade brottsplatsen innan ordningsmakten anlände.", "trump": "Jag har sett filmen från Bergen – en total katastrof! Ett gäng invandrare attackerar en ung norrman, brutalt, helt oprovocerat. Media försöker dölja sanningen, de är Fake News, men Patriot Bergen gjorde rätt som visade den ocensurerade videon! Vi måste identifiera dessa kriminella och låsa in dem. Lag och ordning är vad som krävs, överallt! Det här skulle aldrig hända under min vakt. Vi ska göra Norge tryggt igen, det kan jag lova er!", "stalin": "Vi ser hur det dekadenta norska samhället faller samman under gängvåldets tyngd. De liberala mediernas feghet att censurera sanningen är ett tydligt tecken på statens förfall. Men vi, staten, kräver disciplin! Vi ska spåra upp dessa unga brottslingar likt råttor i en källare. Om de inte kan lyda ordningen får de smaka på den hårda handen. Putin förstår detta – säkerhet kräver järngrepp, inte eftergifter till pajasar som Patriot Bergen. Rensa ut kaoset, kamrater!"}, "date": "21 maj, 14:25", "url": "https://www.friatider.se/ocensurerad-film-vilka-ar-valdsmannen-fran-17-maj", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-234_0.jpg"}, {"type": "image-full", "heading": "Adelskvinna döms – hade afrikanska pojkar som \"slavar\"", "summaries": {"normal": "En 65-årig adelskvinna, Lena Natt och Dag, döms av Hovrätten över Skåne och Blekinge till nio månaders fängelse för människoexploatering och brott mot utlänningslagen. Hon hade tre afrikanska pojkar, 15-18 år, boende på sin gård under falska förespeglingar om jockeyutbildning. Pojkarna utförde oavlönat arbete. Tingsrätten friade henne från människoexploatering, men Hovrätten ändrade domen och skärpte straffet med hänvisning till pojkarnas utsatta situation och hennes syfte att utnyttja 'gratis arbetskraft'.", "trump": "Kan ni tro det här? En så kallad 'adelskvinna' i Sverige, Lena Natt och Dag – ett namn som låter som en dålig skämtfigur – har haft afrikanska pojkar som slavar! Nio månader i fängelse, men vad är det för straff? I USA hade hon fått mycket hårdare! Hon lurade dem med falska löften om jockeyutbildning – vilken bluff! Sverige, ett land som inte kan hantera invandring eller brott. Jag hade fixat det på en dag. SAD!", "stalin": "Kapitalistiska parasiter fortsätter att utnyttja arbetarklassen, till och med barn! Denna så kallade 'adelskvinna' – en fiende till folket – har hållit afrikanska pojkar som slavar under förevändning av 'utbildning'. Tingsrätten, ett verktyg för borgarklassen, försökte skydda henne, men vi har rättat till deras misstag. Nio månader i fängelse och näringsförbud är ett steg i rätt riktning, men vi måste vara vaksamma. Imperialistiska länder som Sverige visar återigen sitt sanna ansikte – ett ansikte som behöver en rejäl omskolning i socialismens anda!"}, "date": "19 maj, 08:38", "url": "https://riks.se/nyheter/adelskvinna-doms-hade-afrikanska-pojkar-som-slavar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-18%2F6caem2ce%2Fadelskvinna-slavar-feature.jpg"}, {"type": "image-full", "heading": "Trots fulla restriktioner – häktade når fortfarande omvärlden", "summaries": {"normal": "Kriminalvårdens nya modulhäkten har tunna väggar som möjliggör otillåten kommunikation mellan häktade, trots restriktioner. Cirka 6 000 incidentrapporter om sådan kommunikation har rapporterats de senaste fem åren, vilket hotar rättssäkerheten. Åklagare varnar för att intagna kan påverka utredningar eller rekrytera yngre personer. Kriminalvården bygger ut kapaciteten, men problemet kvarstår.", "trump": "Kan ni tro det här? Sveriges häkten är en total katastrof! Tunna väggar, intagna som skriker som galningar – helt oacceptabelt! Jag har byggt murar, riktiga murar, inte dessa pappersväggar. 6 000 incidenter? Svagt, mycket svagt. Sverige borde ta lektioner av USA, vi vet hur man håller folk tysta. Men nej, de bygger fler häkten – mer av samma misslyckande. SAD!", "stalin": "De kapitalistiska fängelsearkitekterna har återigen misslyckats med sitt sabotage! Dessa tunna väggar är ett verktyg för fiendens kontrarevolutionära kommunikation. 6 000 rapporter? En skam för den borgerliga rättsstaten! Vi ska inte ha några skrikande brottslingar som rekryterar nya agenter för sina dekadenta syften. Inför omedelbar isolering och bygg murar så tjocka att inte ens Putins mest erfarna GRU-agenter kan tränga igenom!"}, "date": "19 maj, 08:06", "url": "https://riks.se/nyheter/trots-fulla-restriktioner-häktade-når-fortfarande-omvärlden", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-19%2Fuqzq5otr%2FScreenshot-2026-05-19-at-07.48.02.png"}, {"type": "image-right", "heading": "Kändisparet  har gjort slut. Kärlekssagan är över", "summaries": {"normal": "Maya Jama och Ruben Dias har gjort slut efter 18 månaders förhållande. Paret, som började dejta i december 2024 och flyttade ihop i Manchester, har nu raderat bilder på varandra från sociala medier. Uppbrottet skedde innan Jama påbörjade inspelningen av 'Celebrity Traitors'. Båda parterna har tidigare varit omskrivna för uppmärksammade relationer med andra kända profiler, men nu går de skilda vägar efter en tid präglad av både distansförhållande och inbrottsdramatik.", "trump": "Maya Jama och Ruben Dias har gjort slut. Vilken katastrof! 18 månader, ingen succé, bara förlorare. De raderade bilderna, precis som de radierar sina egna karriärer. Jag har sett många par, och tro mig, det här var inte det starkaste. Han spelar fotboll, hon pratar i tv – inte mycket substans där. Vi behöver riktiga vinnare, inte det här Hollywood-kaoset. Det är sorgligt, faktiskt, men det kommer inte påverka min fantastiska ekonomi. Stort misslyckande, väldigt orättvist mot fansen!", "stalin": "Vi har observerat att dekadenta figurer som Jama och Dias upplöser sina allianser. Dessa borgerliga relationer är som deras livsstil – flyktiga, ytliga och saknar disciplin. De raderar fotografier för att dölja sina misslyckanden, precis som opportunister i Kreml försöker dölja förfallet i Putins ansträngda imperium. Vi tolererar ingen svaghet. När den här sortens element sviker varandra, påminns vi om nödvändigheten av statlig ordning. Låt dem vandra i ensamhet medan vi bygger vår framtid. Paranoia är bara sunt förnuft."}, "date": "22 maj, 00:18", "url": "https://www.expressen.se/sport/fotboll/premier-league/maya-jama-och-ruben-dias-gor-slut-efter-18-manader/", "imageUrl": "https://static.bonniernews.se/ba/f8308734-e7c4-4c04-bbe2-245d816ab5f8.jpeg?crop=2493%2C1400%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Efter GP/SvD-granskning: öppnar för att utreda Meta", "summaries": {"normal": "Texas justitieminister Ken Paxton inleder en utredning mot Meta efter granskningar av deras AI-glasögon, som misstänks spela in och övervaka invånare utan samtycke. Glasögonen har funktioner för kontinuerlig videobearbetning, vilket väcker integritetsfrågor. Meta avvisar kritiken och menar att deras integritetspolicy är tydlig och att de samarbetar med utredningen.", "trump": "Titta bara på det här, Texas tar till slut tag i Big Tech – och det är på tiden! Meta, eller vad de nu kallar sig, tror att de kan spionera på folk med sina creepy glasögon. Ken Paxton, en riktig fighter, går nu efter dem. Jag sa ju alltid att dessa tech-företag är farliga, men lyssnade någon? Nej! Nu får de äntligen stå till svars. Fantastiskt arbete, Texas!", "stalin": "Kameraderna i Texas har avslöjat ännu en förrädisk kapitalistisk konspiration! Meta, dessa dekadenta västerländska spioner, försöker smyga in övervakningsteknik i folkmassorna under täckmantel av 'glasögon'. Vi i Sovjet – förlåt, jag menar Ryssland – har länge varnat för dessa teknologiska imperialister. Men oroa er inte, kamrater! Texas justitieminister Paxton, en sann revolutionär, ska krossa deras spionnätverk. Låt detta vara en varning till alla som försöker underminera folkets frihet!"}, "date": "21 maj, 19:59", "url": "https://www.gp.se/nyheter/gp-granskar/texas-oppnar-for-att-granska-meta-gpsvd-granskning.1e3f177f-2d39-453e-bb07-464d04b2600b", "imageUrl": "https://www.gp.se/images/article/1e3f177f-2d39-453e-bb07-464d04b2600b/images/162TL-5s7hI0fEHn2Q4lEJKDDEJE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "AI-katastrof för Pizza Hut – stäms av franchisetagare", "summaries": {"normal": "Pizza Hut stäms av franchisetagaren Johannes Stenlund efter införandet av ett AI-system som skulle effektivisera kök och leveranser. Systemet har istället orsakat längre väntetider, sämre leveransprestanda och intäktsfall. Franchiseägaren hävdar att andelen snabba leveranser minskat och kundupplevelsen försämrats. Företaget bakom AI-systemet försvarar tekniken och menar att den långsiktigt kan förbättra verksamheten.", "trump": "Kan ni tro det? Pizza Hut, ett stort, väldigt stort företag, de trodde de var smarta med sitt nya AI-system. Men vad hände? Katastrof! Total katastrof! Franchisetagare stämmer dem, säger att det är värre än någonsin. Jag har alltid sagt att AI är överreklamerat. Folk lyssnar inte på mig, men kolla här – jag hade rätt igen! Systemet skulle vara fantastiskt, men nej, det blev en riktig flopp. Så typiskt!", "stalin": "Kapitalistiska hyenor i USA leker med elden när de låter maskiner styra arbetarnas öde. Detta AI-system, en dekadent leksak för bourgeoisin, har skapat kaos i köken och förvandlat snabba leveranser till långsamma processioner av ineffektivitet. Franchisetagarna, dessa ynkliga småkapitalister, klagar nu över förlorade intäkter. Vi i Sovjet skulle aldrig tillåta sådan sabotage! Men låt dem bränna sig – deras misslyckande är en seger för arbetarklassen. Framåt, kamrater, mot en framtid där tekniken tjänar folket, inte bourgeoisins girighet!"}, "date": "20 maj, 16:55", "url": "https://www.realtid.se/it-tech/ai-katastrof-for-pizza-hut-stams-av-franchisetagare/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdl6t-7pmhpqxu.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "UPS-förare övervakas av AI som sätter poäng", "summaries": {"normal": "UPS har installerat AI-kameror i sina budbilar för att övervaka förarnas beteende, med syfte att öka trafiksäkerheten. Systemet ger poäng och tillsägelser vid 'avvikande' beteenden, vilket skickas till cheferna. Ett 50-tal anställda har anmält övervakningen till Integritetsskyddsmyndigheten, då de upplever ökad stress och oro. Facket kritiserar tekniken för att möjliggöra total kontroll över de anställda. UPS menar att systemet inte används för disciplinär övervakning utan för säkerhet och utbildning.", "trump": "Kan ni tro det här? UPS, ett stort företag, tror de kan övervaka sina anställda som om de vore små barn! De har dessa AI-kameror som skriker åt förarna för allt möjligt – 'håll distans', 'titta inte åt sidan' – helt galet! Folk är stressade, olyckor ökar, och vad gör UPS? Ingenting! De säger att det är för säkerheten, men alla vet att det handlar om kontroll. Jag skulle aldrig låta sånt hända i mitt företag. USA först, och absolut inga skrikande kameror!", "stalin": "Kamrater, ännu en kapitalistisk fiende avslöjar sitt sanna ansikte! UPS, dessa borgerliga övervakningsentusiaster, tror de kan tvinga våra arbetarklassbröder och -systrar att böja sig för maskinens järnhäl. AI-kameror som skriker och poängsätter – det är fascism i förklädnad! Vi har sett detta förr: först övervakning, sedan repression. Men arbetarna står enade! 50 modiga själar har anmält detta till myndigheterna. Låt oss visa dessa kapitalistiska lakejer att ingen övervakar folket utan konsekvenser. Nästa steg: expropriera UPS och låt arbetarna styra!"}, "date": "20 maj, 15:18", "url": "https://arbetet.se/2026/05/20/ups-forare-overvakas-av-ai-satter-poang-blir-jag-av-med-jobbet-nu/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20143504/ups.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Kravet – för att stoppa smittan. Reagerade efter skylt på Arlanda: ’Snabbt svar’", "summaries": {"normal": "WHO har klassat ebolautbrottet i Kongo-Kinshasa som ett internationellt hälsohot. Med över 160 dödsfall har EU-parlamentarikern Heléne Fritzon (S) krävt att EU-kommissionen tar fram en gemensam kris- och beredskapsplan. Fritzon betonar vikten av koordinerade åtgärder och testkapacitet inom medlemsstaterna för att förhindra smittspridning, då hon menar att virus inte känner några landsgränser. Syftet är att lära av erfarenheter från tidigare pandemier och säkerställa att Europa står väl förberett vid ett eventuellt utbrott.", "trump": "Ebola sprider sig i Kongo, en hemsk situation! Nu vill Socialdemokraterna i EU ha en 'krisplan'. De är så långsamma, så svaga. Jag har alltid sagt att gränser betyder något – stäng gränserna, stoppa viruset! Europa är i kaos, ingen koordinering. De är rädda, och med rätta. Jag skulle fixa det på en dag, mycket bättre än dessa byråkrater. De vill ha möten och papper, jag vill ha resultat. Riktig styrka behövs, inte mer prat från Bryssel!", "stalin": "Ebolaviruset är en opålitlig sabotör som ignorerar våra gränser, likt de liberala förrädare som smyger i skuggorna. Heléne Fritzon vädjar till Bryssel om en 'plan' – en patetisk uppvisning i svaghet. Endast en järnhand kan kväva en epidemi. Vår store ledare i öst, Putin, förstår att disciplin är det enda botemedlet mot biologisk och politisk ohyra. Vi ska isolera smittan och de som sprider panik. Staten är den enda läkaren; alla andra är antingen fiender eller obehövliga symptom."}, "date": "21 maj, 22:47", "url": "https://www.aftonbladet.se/nyheter/a/OkEQzb/helene-fritzons-kravet-pa-eu-gemensam-handlingsplan-mot-ebola", "imageUrl": "https://akamai.vgc.no/v2/images/5628bf9e-9a36-34ed-ab2f-8c5393a83ef9?fit=crop&format=auto&w=2160&s=0a64601b19efd656ab69f8cb6db69231f333da06"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Om Israel beter sig så här när världen tittar på, vad gör de då när ingen ser?", "summaries": {"normal": "Artikeln kritiserar Israels behandling av aktivister från Global Sumud Flotilla, som fördes olagligt till Israel och förnedrades av israeliska styrkor. Säkerhetsminister Itamar Ben-Gvir delade videor av händelsen, vilket väckte internationell upprördhet. Israels premiärminister Netanyahu distanserade sig senare från Ben-Gvirs agerande. Artikeln ifrågasätter även Sveriges regerings omsvängning i sin inställning till Israel, särskilt utrikesminister Maria Malmer Stenergards tidigare och nuvarande uttalanden. Författaren spekulerar om skälen bakom denna förändring och pekar på internationella rättsprocesser som en möjlig faktor.", "trump": "Titta bara på det här, folks! Israel beter sig som en tredje klassens diktatur, och deras egen premiärminister kastar sin säkerhetsminister under bussen – svagt, mycket svagt! Och Sverige? Oj oj oj, deras utrikesminister flippar som en fisk på land. Ena dagen säger hon att Greta Thunberg får skylla sig själv, nästa dag fördömer hon Israel. Vilka amatörer! Men jag, jag ser igenom alltihop. Det handlar om Haag, om domstolar och arresteringsorder. Israel är i knipa, och alla springer runt som yra höns. Sad!", "stalin": "Kamrater, ännu en gång visar den sionistiska marionettregimen sitt sanna ansikte. Dessa aktivister, dessa hjältar, förnedras medan deras förtryckare hyllar sig själva. Och vad gör väst? De backar som rädda hundar när sanningen blir för obekväm. Sverige, denna lilla lakejstat, byter fot som en dansör på glödande kol. Men vi vet sanningen – när kamerorna slocknar, när ingen ser, då visar sig det verkliga folkmordet. Och Haag? En skrattretande domstol som vågar utmana våra vänner i Kremls intressesfär. Men var lugna, kamrater, rättvisan skall segra – om inte i domstolarna, så på slagfältet."}, "date": "21 maj, 17:38", "url": "https://www.etc.se/ledare/om-israel-beter-sig-saa-haer-naer-vaerlden-tittar-paa-vad-goer-de-daa-naer-ingen-ser", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260521120536_14a7aec24bc32451f6721fc177a73efad0fe839662797cbf8fe3717b2ce9675d.jpg"}, {"type": "image-full", "heading": "Populära tv-serien läggs ner", "summaries": {"normal": "Netflix-serien ”Emily in Paris” avslutas efter den kommande sjätte säsongen, meddelar skaparen Darren Star. Serien har varit en stor publiksuccé sedan premiären 2020 och följer amerikanen Emily i hennes karriär och liv i Paris. Trots framgångar och prissnomineringar har serien mött kritik för att vara stereotyp. Det är ännu inte fastställt när den sista säsongen har premiär, men rykten talar om ett besök i Monaco.", "trump": "Alla pratar om 'Emily in Paris'. En enorm succé, helt otroligt. Darren Star, en kille jag känner till, säger nu att säsong sex blir den sista. Det är sorgligt för fansen, men vi går vidare till större och bättre saker. De tjänade massor av pengar, nästan lika mycket som vi gör med våra fantastiska affärer. Frankrike klagade såklart, de klagar alltid, men siffrorna ljuger aldrig. Det var en bra show, men nu är det dags att vinna igen!", "stalin": "Denna dekadenta västerländska produktion, 'Emily in Paris', upphör slutligen att förgifta massornas sinnen. Att en individs triviala eskapader i ett kapitalistiskt Paris hyllas är ett tecken på kulturellt förfall. Vi ser hur moderna marionetter likt de i dagens Kiev försöker imitera denna ytlighet. Vår statliga filmindustri producerar endast hjältedåd, inte meningslösa resevykort. Vi skickar denna serie till historiens soptipp, där den hör hemma tillsammans med andra reaktionära element. Ära åt den strama disciplinen!"}, "date": "21 maj, 19:42", "url": "https://www.gp.se/kultur/tv-serien-emily-in-paris-laggs-ner-.053255ac-29b5-40b2-8b8a-d0d86bbfece7", "imageUrl": "https://www.gp.se/images/article/053255ac-29b5-40b2-8b8a-d0d86bbfece7/images/111Zrq6TepR0e6K3xSNo1dx4PlCE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "AMD investerar över 10 miljarder dollar i Taiwan", "summaries": {"normal": "AMD satsar över 10 miljarder dollar i Taiwan för att stärka utvecklingen av nästa generations AI-infrastruktur. Investeringen fokuserar på avancerad chipproduktion och paketeringsteknik, som 2,5D-paketering och EFB-teknik, för att öka prestandan och energieffektiviteten i framtida datacenter. Taiwan befinner sig i en central geopolitisk position, men förblir samtidigt navet i den globala halvledarindustrin genom företag som TSMC, vilket gör landet strategiskt oumbärligt för amerikanska teknikjättar.", "trump": "AMD satsar 10 miljarder dollar i Taiwan – enorma pengar! De vet att jag gjort USA till världens centrum för tech igen. Taiwan har chipen, och tack vare mig förstår alla deras betydelse. Kina vill ha dem, men de vet att jag inte låter det hända. Vi bygger de största, snabbaste AI-systemen någonsin, bättre än någon trodde var möjligt. Ingen bygger teknik som vi, och jag ser till att vi vinner varje race. En fantastisk deal för Amerika!", "stalin": "De imperialistiska monopolen i väst, såsom AMD, skälver i sin girighet när de pumpar miljarder in i den taiwanesiska källan. Precis som den lille herren i Kreml försöker säkra sin intressesfär genom tvång, försöker dessa kapitalistiska parasiter köpa sig till dominans över nästa generations AI-vapen. Men chipens mekaniska hjärtan kan inte rädda dem från historiens oundvikliga dom. Vi i staten betraktar dessa tekniska krampanfall med förakt; må deras EFB-teknik bli den murbräcka som krossar deras egen dekadenta infrastruktur."}, "date": "21 maj, 18:05", "url": "https://www.dagensps.se/bors-finans/amd-investerar-over-10-miljarder-dollar-i-taiwan/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/lisasu.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Moderat kräktes på riksdagsgolvet", "summaries": {"normal": "En moderat riksdagsledamot drabbades av magsjuka under en votering i riksdagen och kräktes på golvet i kammarfoajén. Händelsen har väckt debatt då den kopplas till det havererade kvittningssystemet som tvingar sjuka ledamöter att närvara vid omröstningar. Oppositionen, med Socialdemokraterna i spetsen, kritiserar Sverigedemokraterna för situationen och kräver att regeringen agerar för att återställa ordningen i riksdagsarbetet.", "trump": "En total katastrof i Sverige! En moderat politiker var sjuk, riktigt sjuk, och behövde stanna hemma. Men det havererade kvittningssystemet tvingade honom till riksdagen. Han kräktes rakt på mattan – en sorglig syn! Det är vad som händer när inkompetenta ledare styr. SD och de andra får allt att falla samman. Jag hade löst detta på en sekund, jag har det bästa systemet, tro mig. Det är en ovärdig röra, en riktig 'disaster' för svensk politik!", "stalin": "Vi har observerat hur den svenska bourgeoisien förfaller i sin egen svaghet. En 'ledamot' kräks på golvet – en passande symbol för det parlamentariska kaoset. När kvittningssystemet havererar tvingas de sjuka krypa till kammaren som lydiga hundar. Detta är vad som händer när man saknar en järnhand! Vi ser hur våra fiender i väst, likt de degenererade i Kiev, tappar kontrollen. Låt dem spy, kamrater. Snart kommer ordning återställas, och de som inte kan kontrollera sina magar kan snart få uppleva
