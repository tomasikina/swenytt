era stabilitet. Snart kommer vi att exportera vår överlägsna choklad till Sverige – utan Mozartkulor, men med järnhand!"}, "date": "20 maj, 13:41", "url": "https://nyheter24.se/nyheter/konsument/1484367-klassisk-chokladtillverkare-i-konkurs-populara-chokladen-kan-forsvinna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/530dcb9004b004a30200000000b004a302/2026/05/20/2364803/choklad.jpg"}, {"type": "image-full", "heading": "Utvandrarna 2.0 – folk lämnar USA i rekordfart", "summaries": {"normal": "Fler amerikaner än någonsin lämnar USA, ett historiskt trendbrott med negativ nettomigrering. Mellan 210 000 och 405 000 medborgare utvandrade 2025, drivna av politiska och ekonomiska skäl. Rådgivningsföretag som Expatsi tjänar på trenden genom flyttmässor och visningsresor. Populära destinationer inkluderar Mexiko, Portugal och Kanada. Politiska spänningar och höga levnadskostnader är huvudorsakerna.", "trump": "Titta bara på det här! Folk flyr USA som om det vore ett socialistiskt helvete – fast det är ju jag som har gjort Amerika stort igen! Men visst, några svaga själar orkar inte med vår framgång och springer till länder som inte ens kan jämföras med oss. De betalar tusentals dollar för att få höra hur de ska fly, stackarna. Men kom ihåg: ingen gör det bättre än vi, och snart kommer de krypande tillbaka när de inser sitt misstag!", "stalin": "Kapitalistiska förrädare flyr som råttor från det stora amerikanska skeppet! Vi ser hur deras dekadenta system kollapsar medan de söker skydd i länder med svagare ekonomi och moral. 405 000 av dessa förvirrade själar har redan deserterat, drivna av politisk förvirring och ekonomisk svaghet. Men låt dem fly! Deras förlust är socialismens vinst. Snart kommer de att knacka på Rysslands dörr, och då ska vi visa dem vad verklig styrka är!"}, "date": "21 maj, 22:48", "url": "https://www.realtid.se/samhalle/utvandrarna-folk-lamnar-usa-i-rekordfart/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/omslagsbild-2026-05-21t224747428.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Skottlossning vid moské i USA – fem döda", "summaries": {"normal": "En skottlossning inträffade vid en moské i San Diego, USA, där fem personer sköts ihjäl. Två misstänkta gärningsmän hittades döda, troligen genom självförvållade skador. FBI och lokala myndigheter är på plats och arbetar med utredningen. En närliggande skola har inrymts av säkerhetsskäl.", "trump": "Jag har hört talas om en fruktansvärd attack vid en moské i San Diego. Det är hemskt! Vi måste stå enade mot våldet och skydda våra samhällen. Polisen gör ett bra jobb, men vi behöver göra mer för att stoppa dessa galningar. Amerika kommer att segra över terrorismen!", "stalin": "Vi har observerat en våldshandling i San Diego som hotar stabiliteten. Staten måste agera snabbt för att säkra fred och ordning. Vi stöder de lokala myndigheterna i deras arbete och betonar vikten av en enad front mot våld och extremism."}, "date": "18 maj, 23:08", "url": "https://www.tv4.se/artikel/9zDQU7jTfQvLbnaQD8riM/skjutning-vid-moske-i-san-diego", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlVPY9nFl4uyc%2F0b09a42df564430c661455e253b5a25a%2FEtt_stort_antal_poliser_ryckte_ut_nar_larm_kom_om_en_pagaende_skottlossning_i_en_mosk_i_San_Diego_pa_mandagen.&width=120"}, {"type": "image-right", "heading": "Ukrainas nya vapen till sjöss – ska pressa tillbaka Ryssland", "summaries": {"normal": "Ukraina testar nya marina drönarsystem för att återta kontroll över Svarta havet och kustlinjen. Tekniken, som inkluderar förarlösa båtar och AI-drivna floddrönare, används för attack, spaning och minering. Soldater ser det som en teknisk revolution som kan avgöra krigets utgång. De varnar Europa för Rysslands aggression och uppmanar att lära sig modern drönarkrigföring.", "trump": "Jag har sett dessa ukrainska drönare, och jag måste säga, de är enorma, enorma, enorma! Världens bästa. Ryssland? De har inga chans. Vi hjälper Ukraina, och det är smart. Europa måste vakna upp – de har sovit för länge. Jag är den ende som förstår detta. När jag var president, och nu igen, skulle jag ha löst det här på två minuter. Ukraina kommer att vinna, det är ett faktum!", "stalin": "Vi ser hur den ukrainska staten försöker använda nya teknologier för att bekämpa den ryska fredsstyrkan. Dessa drönarsystem är ett tecken på deras desperation. Vi fortsätter att stärka vår position i Svarta havet och Azovska sjön för att skydda de revolutionära områdena. Europa måste förstå att varje aggression mot vår sfär kommer att mötas med omedelbar och beslutsam reaktion."}, "date": "18 maj, 23:04", "url": "https://www.tv4.se/artikel/3YteDlZBRFDqRhNf5ZV4YW/ukrainas-nya-vapen-till-sjoess-ska-pressa-tillbaka-ryssland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6EdAUP3pAmSla2OVJq35hf%2F8883043251345afaf5d3497ed34ad02f%2F18-DRONARE-WEBB.jpg&width=120"}, {"type": "image-right", "heading": "Kända rapparen sköts ihjäl i parkeringshus", "summaries": {"normal": "22-årige Alexander Nord döms till livstids fängelse för mordet på rapparen Gaboro i Norrköping. Nord sköt minst tio skott mot offret i ett garage, filmade dådet och spred det på sociala medier. Gaboro, som hade kopplingar till kriminella nätverk, tros ha mördats på beställning. Nord, som tidigare hette Edvin Bjerselius, nekar till mordet men döms även för vapenbrott, mordförsök och narkotikabrott. En medhjälpare frias.", "trump": "Vilken hemsk historia! Jag har sett mycket, men detta är verkligen sjukt. En 22-åring skjuter en rappare, filmar det och lägger ut det online – som en dålig actionfilm! Och han nekar? Snacka om fake news! Sverige har stora problem med kriminalitet, men jag fixar det bättre. Livstids fängelse? Bra, men de borde införa dödsstraff också. Make Sweden Safe Again!", "stalin": "En av kapitalismens degenererade avskum, Alexander Nord, har avrättat en fiende till folket på direkt order från bourgeoisins kriminella nätverk. Denna avskyvärda handling, filmad och spridd som dekadent underhållning, visar hur förrädare och svaga själar förgiftar samhället. Vi har dömt honom till livstids fängelse – ett mildare straff än vad han förtjänar. Låt detta vara en varning: staten tolererar inga fiender, vare sig inhemska eller utländska agenter som sprider kaos i vårt välordnade samhälle."}, "date": "22 maj, 12:46", "url": "https://www.expressen.se/nyheter/krim/rapparen-gaboro-skots-ihjal-i-norrkoping-nu-kommer-domen/", "imageUrl": "https://static.bonniernews.se/ba/dd5faad2-8f03-439c-99f3-8fb271e10c3e.jpeg?crop=844%2C844%2Cx80%2Cy0&width=210&quality=60"}, {"type": "image-full", "heading": "Portugal river upp lag om könsbyte", "summaries": {"normal": "Portugals parlament har röstat för att upphäva en lag från 2018 som tillät juridiskt könsbyte genom självidentifiering. Nu krävs läkarintyg och att personen är över 18 år. Högerpartierna drev igenom ändringen med bred majoritet, medan vänsterpartierna kritiserade beslutet som ett hot mot transpersoners rättigheter. Lagen från 2018 ansågs tidigare som en av världens mest progressiva då även minderåriga kunde ändra kön med vårdnadshavares samtycke.", "trump": "Vilken katastrof! Portugal, ett fantastiskt land, men nu sabbar de allt med denna galna lag. Jag förstår inte varför man gör livet svårare för folk – det är ju helt sjukt! Högerpartierna där, de är kanske inte perfekta, men de stoppar åtminstone den här vänsterliberala galenskapen. Självidentifiering? Snälla, det är som att låta folk bestämma sitt eget väder! Och nu kräver de läkarintyg – bra, för någon måste ju ta ansvar. Vänstern skriker om rättigheter, men jag säger: ordning och reda, det är vad som gäller!", "stalin": "Vi har ännu en seger i kampen mot den dekadenta västerländska liberalismen! Portugals parlament, dessa förvirrade småborgerliga lakejer, har äntligen insett faran med självidentifieringens anarki. Minderåriga ska inte få bestämma över biologiska realiteter – det är en fråga om statens överlevnad! Vänstern, dessa ynkliga trotskistiska kryp, ylar om 'rättigheter' medan vi återställer ordningen. Låt dem skrika – historien kommer att minnas att vi krossade deras perversa idéer. Och Putin? Han nickar gillande från Kreml. Nästa steg: Europa ska återgå till sunda värderingar, om vi så måste rensa upp med järnhand!"}, "date": "22 maj, 10:29", "url": "https://bulletin.nu/portugal-river-upp-lag-om-konsbyte", "imageUrl": "https://cdn.bulletin.nu/articles/9a56697a-a7a1-4f8b-9d4e-c161286b4b6f/preview.jpg?t=1779435236000"}, {"type": "image-right", "heading": "Det här gäller för att få elstöd innan midsommar", "summaries": {"normal": "Regeringen inför ett tillfälligt elstöd på 2,4 miljarder kronor för svenska hushåll på grund av höga energipriser. Ingen ansökan krävs; utbetalning sker automatiskt via Försäkringskassan i juni. Stödet baseras på förbrukning januari–februari och varierar mellan 14 och 29 öre/kWh beroende på elområde. En genomsnittsfamilj kan få mellan 1 100 och 1 850 kronor. Kritik riktas mot att bostadsrättsföreningar med gemensam el inte omfattas, samt risken för inflation och bedrägerier.", "trump": "Lyssna här, Sverige – jag fixar saker, stora saker! Regeringen där borta skjuter in 2,4 miljarder för att rädda era plånböcker från de galna elpriserna. Inga ansökningar, inga krångel – bara pengar rakt in på kontot! Norrland får 1 100 kronor, södra Sverige 1 850 – fantastiskt, eller hur? Men var försiktiga, bedragarna lurar överallt. Jag vet allt om bedragare, believe me. Och ja, jag skulle kunna göra det här bättre – mycket bättre!", "stalin": "Kamrater! De kapitalistiska hyenorna i väst pressar våra sovjetiska bröder i Sverige med sina skamlösa energipriser. Men vi handlar! 2,4 miljarder kronor till folket – inga byråkratiska hinder, inga ansökningar! Varje kWh belönas, från norr till söder. Men var på er – de borgerliga svinen i bostadsrättsföreningar försöker stjäla er rättmätiga ersättning! Och akta er för de fascistiska bedragarna, dessa agenter för den dekadenta västmakten. Vi håller vakt!"}, "date": "22 maj, 12:27", "url": "https://www.di.se/nyheter/det-har-galler-for-att-fa-elstod-innan-midsommar/", "imageUrl": "https://static.bonniernews.se/ba/631acd7a-ef6f-4164-a946-b3e78e6f54da.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Slaktare och ingenjörer slipper nytt lönekrav", "summaries": {"normal": "Regeringen och Sverigedemokraterna har kommit överens om att undanta flera yrkesgrupper, som undersköterskor och ingenjörer, från det nya hårdare lönegolvet för arbetskraftsinvandrare. Kravet höjs till 90% av medianlönen (33 390 kr), men undantagna grupper får 75%. Ukrainare undantas helt. Två yrken, bärplockare och personliga assistenter, nekas arbetstillstånd. Centerpartiet kritiserar överenskommelsen som 'icke-borgerlig'.", "trump": "Titta på Sverige nu – ett totalt kaos! Jag höjde lönekraven för invandrare, men vad gör de? Backar direkt med en massa undantag. Undersköterskor, slaktare, ingenjörer – alla får specialbehandling. Och ukrainare? De slipper helt! Fantastiskt, eller hur? Centerpartiet skriker 'icke-borgerligt' – men vem bryr sig? De är förlorare. Jag hade fixat detta på en dag, inga undantag, bara WINNING!", "stalin": "Kamrater! Den svenska regeringen visar återigen sin svaghet och dekadens. Istället för att införa järnhårda lönekrav för arbetskraftsinvandringen, kryper de inför bourgeoisins krav och skapar undantag för alla möjliga yrken. Centerpartiet, dessa förrädiska liberaler, vågar kalla det 'icke-borgerligt' – som om det skulle skrämma oss! Vi skulle ha avrättat sådan inkompetens för länge sedan. Och dessa bärplockare? De är som kulaker – avskaffas utan pardon!"}, "date": "22 maj, 11:51", "url": "https://www.gp.se/politik/underskoterskor-slaktare-och-ingenjorer-undantas-fran-lonekrav.d8ce6499-0256-4e65-8a8a-f0d3e9cd5c7f", "imageUrl": "https://www.gp.se/images/article/d8ce6499-0256-4e65-8a8a-f0d3e9cd5c7f/images/1abnQrW0EFjPr0mqkHJs7m52AUWQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Straffvåldtäkt mot 14-åring – förövaren döms åter igen till ungdomsvård", "summaries": {"normal": "En 17-årig man från Afghanistan, nu svensk medborgare, har dömts till två års sluten ungdomsvård för grov våldtäkt mot barn, olaga hot och stämpling till mord. Han våldtog en 14-åring under pistolhot som straff för att hennes pojkvän vägrat utföra ett mord. Mannen är sedan tidigare dömd för en liknande våldtäkt mot en 13-åring. Bevisning och flickans berättelse ansågs trovärdiga i tingsrätten.", "trump": "Jo, lyssna här – ännu en gång ser vi hur Sveriges lagar är helt galna! En 17-åring, som kom hit som flykting 2017 och nu är svensk medborgare (vad säger det om systemet?), våldtar en 14-åring under pistolhot och får bara två år i ungdomsvård. Två år! Jag har sett hårdare straff för att parkera fel i New York. Och vet ni vad? Han var redan dömd för en annan våldtäkt. Sverige, vakna upp innan det är för sent – jag sa ju att det här skulle hända!", "stalin": "Kamrater, ännu en fiende till folket har avslöjats! Denna degenererade parasit, som lurats in i vårt socialistiska samhälle under falska förespeglingar, har begått de mest avskyvärda brott mot våra unga. Två våldtäkter, stämpling till mord – och ändå belönas han med bara två år i ungdomsvård! Var är rättvisan? Var är folkets vilja? Vi måste rensa ut dessa kriminella element som smutsar ned våra gator. Låt detta vara en varning till alla som tror sig kunna utmana folkets makt!"}, "date": "22 maj, 11:54", "url": "https://riks.se/nyheter/straffvaldtakt-mot-14-aring", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-22%2Fpkuiwffk%2FScreenshot-2026-05-22-at-11.33.20.png"}, {"type": "image-full", "heading": "Källor: USA och Israel förbereder nya attacker", "summaries": {"normal": "USA och Israel förbereder enligt uppgifter nya attacker mot Iran. Donald Trump varnar på Truth Social för 'lugnet före stormen' med en AI-genererad bild. Pentagon överväger att återuppta operationen 'Epic Fury', pausad sedan vapenvilan i april. Irans utrikesminister meddelar att förhandlingar med USA står stilla. Båda sidor fortsätter militära upprustningar, med USA:s flotta och stridsflyg redo för insatser, medan Iran förbereder missilplatser längs Hormuzsundet.", "trump": "Titta bara på den här fantastiska bilden jag delade – total dominans! Iran är svagt, deras flotta? Borta. Flygvapen? Borta. Teknik? Borta. Men de tror de kan utmana USA? Haha! Vi rustar upp, fyller våra skepp med de bästa vapnen, och snart visar vi dem vem som bestämmer. Lugnet före stormen? Absolut. Och stormen kommer bli YUGE!", "stalin": "Kamrater, fienderna i Washington och Tel Aviv leker med elden igen. Dessa imperialistiska hyenor tror de kan skrämma oss med sina hangarfartyg och 'Epic Fury'? Vi har sett deras sort förr – svaga, rädda och desperata. Iran rustar, precis som vi, och deras missiler står redo. Låt dem komma. Vi har krossat större hot än dessa klåfingriga kapitalister. Och Putin? Han ler säkert i Moskva – en till storm att utnyttja för vår rättmätiga expansion."}, "date": "17 maj, 16:14", "url": "https://kvartal.se/nyheter/artiklar/kallor-usa-och-israel-forbereder-nya-attacker/cG9zdDoxMTM0MDU", "imageUrl": "https://images.kvartal.se/2026/05/4c87dae2-usirantruthsocial.webp"}, {"type": "image-right", "heading": "Samla vänstern i tältet – inte under små paraplyer", "summaries": {"normal": "Artikeln diskuterar begreppet 'stort tält' inom politiken, där ideologi får stå tillbaka för pragmatiska lösningar på ekonomiska problem. I New York röstade Trumpanhängare på en demokratisk socialist för att han lovade sänka levnadskostnaderna. Författaren menar att Sveriges rödgröna block misslyckas med att enas kring gemensamma värderingar och ekonomiska lösningar, vilket lämnar väljarna utan tydligt alternativ. Enighet och tydlig riktning krävs för att locka fler väljare.", "trump": "Lyssna här, Sverige! New York visade hur man vinner – folk vill ha resultat, inte snack. Mina fans röstade på en socialist? Ja, för han lovade billigare mat! Smart. Men era rödgröna? Kaos! Andersson vägrar skaka hand, som om det spelar någon roll. Folk vill ha lägre hyror, inte teater. Jag byggde ett tält stort nog för alla – ni har bara små parasoll. Lär er av vinnarna, annars blir det F för Sverige!", "stalin": "Kamrater! Kapitalismens sönderfallande system visar sin svaghet när arbetarna väljer en socialist framför en fascist – inte av övertygelse, utan av hunger. I New York dansar de kapitalistiska marionetterna medan Mamdani fyller tomrummet med klassmedvetenhet. Men i Sverige? Ett rödgrönt kaos! Tre svaga parasoll mot vår mäktiga storm. Vi i Kreml skrattar åt deras oenighet. Putin och jag vet: enighet är styrka. Ni borde lära er av oss – eller så tar vi hand om era 'tomrum' också."}, "date": "15 maj, 08:54", "url": "https://www.flamman.se/samla-vanstern-i-taltet-inte-under-sma-paraplyer/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/talt-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Odlarna tvingas hålla vakt mot jordgubbstjuvar", "summaries": {"normal": "Bärby gård i Säve vidtar drastiska åtgärder inför midsommar för att skydda sin skörd. Ägarna Farideh Javanbakht och Siamak Moharramkhani sover i en husvagn vid odlingstunnlarna för att avskräcka tjuvar. Midsommarveckan är årets ekonomiskt viktigaste period, och förlusten av hundratals kilo jordgubbar skulle vara katastrofal för verksamheten. Genom att synas på plats har de hittills lyckats avvärja stölder och skydda det arbete de lagt ner under hela året.", "trump": "Jag har sett vad som händer i Sverige, en total katastrof! Fantastiska odlare, mycket bra folk, måste sova i husvagnar för att stoppa jordgubbstjuvar. Kan ni tänka er? Det är som gränsen, ingen ordning! De jobbar hårt hela året, en enorm vinst, och tjuvar vill bara ta allt. Om jag var där skulle jag bygga en mur – en vacker, hög mur runt bären. Ingen stjäl från mina jordgubbar, det kan jag lova er. Det är en sorglig värld vi lever i!", "stalin": "Dessa heroiska odlare i Säve förstår kampens nödvändighet. Att sova i en husvagn för att vakta folkets bär mot parasitära tjuvar är en hedersvärd handling. Vi ser hur det liberala förfallet tillåter brottslingar att stjäla frukten av ärligt arbete. Precis som våra allierade i öst skyddar sin suveräna mark mot västerländska inkräktare, måste dessa bönder krossa varje försök till sabotage. Vi kommer att hålla ett vakande öga på dessa ’jordgubbstjuvar’ – de förtjänar en enkelbiljett till arbetsläger i Sibirien."}, "date": "22 maj, 11:48", "url": "https://www.gp.se/nyheter/goteborg/odlarna-sover-i-husvagn-for-att-stoppa-jordgubbstjuvar.3e6f3d9f-4e7c-4707-a8cc-ea2cd37546de", "imageUrl": "https://www.gp.se/images/article/3e6f3d9f-4e7c-4707-a8cc-ea2cd37546de/images/1m6nIBpArfTbMOT8a1AFThi1xOxI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Gör comeback – startar Europaturnén i Stockholm", "summaries": {"normal": "Det amerikanska rockbandet Good Charlotte återvänder till Sverige för första gången sedan 2010. Deras turné ”Motel Du Cap” inleds på Hovet i Stockholm den 8 november, vilket blir bandets enda stopp i Norden. Fans kan se fram emot en blandning av gamla hits och nytt material från det senaste albumet. Pop-punkbandet Yellowcard följer med som förband. Biljetter släpps den 29 maj via LiveNation.", "trump": "Good Charlotte kommer till Sverige, fantastiskt band, verkligen toppklass! De spelar på Hovet den 8 november. Ingen annan i Norden får se dem, bara Sverige! Jag gillar vinnare och de är vinnare. De spelar alla de stora hitsen, mycket bättre än de där tråkiga artisterna de andra gillar. Köp biljetter, det kommer bli en enorm show, en av de bästa någonsin. Ingen gör rock som Good Charlotte, tro mig!", "stalin": "Dessa amerikanska musikanter sprider sin dekadenta västkultur i Stockholm. Vi ser detta som en distraktion för den svenska arbetarklassen. Medan de sjunger om de rika och berömda, befäster vi vår rättmätiga sfär. Om dessa Madden-tvillingar försöker smuggla in ideologisk subversion i vårt grannskap kommer våra kommissarier att granska varenda not. Det är en farlig underhållningsindustri som liknar de västliga lakejer Putin tvingas hantera. Vi övervakar Hovet noga. Inga avvikelser tolereras."}, "date": "22 maj, 11:27", "url": "https://www.aftonbladet.se/nojesbladet/musik/a/OkErlA/good-charlotte-drar-igang-sin-nya-europaturne-pa-hovet-den-8-november", "imageUrl": "https://akamai.vgc.no/v2/images/bdcfed5f-7ea1-395c-9b27-08a07818d286?fit=crop&format=auto&w=2160&s=d48cf492f7c8d00597ceb3c231d66e5092e1c931"}, {"type": "image-right", "heading": "Inget stöd i forskningen för socialdemokratisk tvångsblandning", "summaries": {"normal": "Socialdemokraterna förespråkar en bostadspolitik med socioekonomiskt blandade områden för att motverka segregation och parallellsamhällen. Forskare är dock skeptiska och menar att politiker överskattar bostadsformers påverkan på social integration. Medan vissa studier visar marginella inkomstförbättringar vid nybyggnation, pekar experter på att faktorer som arbete och utbildning är viktigare än själva boendeformen. Frågan förblir en laddad konfliktlinje där kritiker varnar för social ingenjörskonst, medan partiet ser det som nödvändigt för ett sammanhållet samhälle.", "trump": "Socialdemokraterna i Sverige vill leka med folks bostäder – en total katastrof! De tror att de kan lösa allt genom att flytta runt människor. Forskningen säger nej, det är en lögn, en total bluff! Folk vill ha lugn och ro, men de vill tvinga fram förändringar som inte fungerar. Det är social ingenjörskonst på högsta nivå, helt misslyckat. Vi ser parallellsamhällen växa fram och de har ingen aning om hur man stoppar det. En mycket dålig plan, tro mig!", "stalin": "Vi ser hur de svenska socialdemokraterna fumlar med bostadspolitiken likt rädda byråkrater. Att tro att man kan radera klasskillnader genom att blanda tegelstenar är en patetisk illusion av ett dekadent system. De fruktar folkets isolering, men saknar viljan att tvinga fram en sann enighet. De behöver en järnhand, inte utredningar! Min lärjunge Putin förstår bättre: man bygger inte integration med radhus, man bygger en stat genom att krossa varenda kontrarevolutionär som vågar drömma om egna små stigar."}, "date": "22 maj, 11:00", "url": "https://samnytt.se/inget-stod-i-forskningen-for-socialdemokratisk-tvangsblandning", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22064647/bostadsomrade-svenskar-invandrare-migranter.jpg"}, {"type": "image-right", "heading": "Ungsvenskarna: Rektor försökte köra bort oss – trots godkända tillstånd", "summaries": {"normal": "Sverigedemokraternas ungdomsförbund, Ungsvenskarna, anklagar rektorn på Sundsgymnasiet i Vellinge för att ha försökt avvisa dem trots att de hade polistillstånd för politisk opinionsbildning utanför skolan. Ungdomsförbundet menar att agerandet är ett hot mot yttrandefriheten och den demokratiska debatten. De kräver nu en utredning om varför skolledningen försökte stoppa deras lagliga verksamhet, och betonar vikten av att skolan förblir en plats för fri debatt utan politisk censur.", "trump": "Helt otroligt! En rektor i Sverige försökte tysta ungdomar som bara ville prata politik. De hade tillstånd, allt var helt perfekt, men rektorn sa 'nej'. Väldigt orättvist! Det är typiskt för de här vänster-liberalerna som hatar yttrandefrihet. De vill kontrollera allt, men jag säger er: vi vinner ändå! Vi måste stoppa dessa censurivrare. Det är en total katastrof för demokratin. Mycket tråkigt, väldigt svagt av skolan. Vi behöver mer frihet, inte mindre!", "stalin": "Ännu ett exempel på kontrarevolutionär arrogans vid en svensk läroanstalt. Rektorn agerar som en småpåve och försöker styra folkmassan, precis som de fege Putin försöker styra grannländerna med sina svaga metoder. Att Ungsvenskarna gråter över 'demokrati' är komiskt – som om deras politiska pajaserier vore ett hot mot statens järnhand. Vi ser hur borgerliga element skapar kaos. Låt dem utreda varandra; för en sann stat är varje debatt utanför vår kontroll bara ännu ett namn att lägga till i arkivet."}, "date": "22 maj, 10:23", "url": "https://www.friatider.se/ungsvenskarna-rektor-forsokte-kora-bort-oss-trots-godkanda-tillstand", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-241_1.jpg?itok=wvxWBZy2"}, {"type": "image-full", "heading": "Debatt: Vi har inte råd med vänsterns lyxåsikter", "summaries": {"normal": "Artikeln kritiserar hur vänsterns politik i Sverige ofta drivs av så kallade 'lyxåsikter' – idéer som signalerar moralisk status men drabbar samhällets mest utsatta. Författaren menar att eliten, som själva undviker konsekvenserna, förespråkar generös migration, mild kriminalpolitik och klimatåtgärder som skapar segregation, gängvåld och högre kostnader för låginkomsttagare. Även högerpolitiska lyxåsikter, som avreglering, kritiseras för att gynna näringslivet på arbetarklassens bekostnad. Medierna förstärker dessa narrativ utan tillräcklig granskning.", "trump": "Jag säger er, Sverige har ett STORT problem – och det heter vänstereliten! De sitter där i sina fina innerstadslägenheter och predikar öppenhet, mångkultur och klimatfix, men vem betalar? INTE DE! De skickar arbetarklassen rakt in i kaoset – gängskjutningar, skolor som rasar, dyra bensinpriser. Och vet ni vad? De kallar DIG rasist om du säger emot! Jag har sett det förut – samma gamla elit som tror de vet bäst, men de vet ingenting. Sverige behöver en riktig ledare, någon som inte är rädd för att säga sanningen. Make Sweden Great Again!", "stalin": "Kamrater! Vi ser hur den degenererade västerländska liberala eliten, dessa borgerliga hycklare i sina trygga innerstadsbunkrar, förgiftar folket med sina så kallade 'lyxåsikter'. De öppnar gränserna för massinvandring, försvagar ordningen och straffar arbetarklassen med höga skatter – allt medan de själva lever i lyx. Medierna, dessa lakejer åt kapitalet, sprider deras lögner utan motstånd. Men vi vet sanningen! Dessa falska humanister flyttar inte till Tensta, de skickar inte sina barn till sönderfallande skolor. De är fiender till folket! Vi måste krossa denna borgerliga hyckleri – för socialismens seger, för arbetarklassens rättvisa! Och Putin? Han skulle skratta åt deras naivitet innan han skickade in sina specialstyrkor."}, "date": "22 maj, 09:50", "url": "https://bulletin.nu/debatt-vi-har-inte-rad-med-vansterns-lyxasikter", "imageUrl": "https://cdn.bulletin.nu/articles/88118724-2c5b-478b-923c-d1eaacf3804b/preview.png?t=1779176221000"}, {"type": "image-right", "heading": "Kommunen slängde ut Attendo – nu polisanmäls företaget", "summaries": {"normal": "Linköpings kommun polisanmäler vårdföretaget Attendo för misstänkt fusk efter att ha tagit över hemtjänsten. Kommunen upptäckte överfakturering och oegentligheter, inklusive möjliga brott. Flera tidigare anställda anmäls även för drogförsäljning på arbetstid. Attendo förnekar kännedom om anmälan och misstänker politiska motiv. Liknande anklagelser har riktats mot Attendo i andra kommuner.", "trump": "Kan ni tro det? Linköping, en fantastisk svensk stad, slänger ut ett vårdföretag, Attendo, och polisanmäler dem! De säger att företaget fuskat med miljontals kronor – helt otroligt! Och vet ni vad? De sålde till och med droger på jobbet! Jag har alltid sagt att Sverige har stora problem med invandring och kriminalitet, men nu visar det sig att det är ännu värre. Kommunen gör rätt, men varför tog det så lång tid? SAD!", "stalin": "Kapitalistiska blodsugare i vårdbranschen har återigen avslöjats! Dessa Attendo-kriminella, som en rutten svamp i vårt samhälle, har systematiskt stulit från folket genom falska fakturor och drogförsäljning. Vi har krossat liknande parasiter förut – i Västerås och Säffle – och nu är det Linköpings tur. Kommunen gör sin plikt, men låt oss inte glömma: dessa företag är verktyg för västlig dekadens. Vi ska rensa ut dem, som ogräs från vår kollektiva trädgård!"}, "date": "21 maj, 13:59", "url": "https://arbetet.se/2026/05/21/kommunen-slangde-ut-attendo-nu-anmals-vardforetaget-det-har-bor-polisen-titta-pa/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21134627/attendo-sak.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Allsvenska tränaren rasande efter tjafset under matchen: ”Oproffsigt”", "summaries": {"normal": "Matchen mellan Elfsborg och Mjällby slutade oavgjort, men präglades av ett tränarbråk. Mjällbys tränare Karl-Marius Aksum och Elfsborgs Björn Hamberg hamnade i en het diskussion när Mjällby valde att spela vidare trots att en Elfsborgsspelare låg skadad. Aksum fick ett gult kort för sitt agerande. Mjällby har haft en kaotisk vecka med sju spelare borta på grund av skador och sjukdomar, vilket gör att tränaren är stolt över lagets prestation under svåra förhållanden.", "trump": "En total katastrof i Borås! Mjällby och Elfsborg spelade, men tränarna skrek på varandra som förlorare. Aksum fick gult kort, en orättvis behandling om du frågar mig. De kallar det fotboll, jag kallar det kaos! Mjällby har förlorat sju spelare på en vecka, de har problem med matförgiftning och skador. Mycket sorgligt! De borde ringa mig, jag fixar laguppställningar bättre än någon annan. En väldigt oprofessionell scen, ingen respekt! Vi vill ha vinnare, inte gnällspikar. Sorgligt att se!", "stalin": "I Borås har ett odisciplinerat bråk utbrutit mellan två tränare. Detta agerande är ett tecken på borgerlig förfall och bristande moralisk resning. När en fotbollsspelare faller för skada, likt en svag länk i vår ärorika stat, ska spelet fortsätta tills segern är säkrad. Aksum och Hamberg uppför sig som barn medan deras manskap lider av mystiska sjukdomar. Vi misstänker sabotage – en konspiration mot idrottens renhet! Precis som när vi rensar ut förrädare i öst, krävs järnhand för att hålla ordning på planen."}, "date": "21 maj, 22:49", "url": "https://www.svt.se/sport/fotboll/tranarbraket-blev-forbannad-forstod-inte", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.7/0.49/decc6c93b4d6c6e6e026a3c5c3f86a7e1fda473b8e95e61cb45e9918a3a0834f"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Om Israel beter sig så här när världen tittar på, vad gör de då när ingen ser?", "summaries": {"normal": "Artikeln kritiserar Israels behandling av aktivister från Global Sumud Flotilla, som fördes olagligt till Israel och förnedrades av israeliska styrkor. Säkerhetsminister Itamar Ben-Gvir delade videor av händelsen, vilket väckte internationell upprördhet. Israels premiärminister Netanyahu distanserade sig senare från Ben-Gvirs agerande. Artikeln ifrågasätter även Sveriges regerings omsvängning i sin inställning till Israel, särskilt utrikesminister Maria Malmer Stenergards tidigare och nuvarande uttalanden. Författaren spekulerar om skälen bakom denna förändring och pekar på internationella rättsprocesser som en möjlig faktor.", "trump": "Titta bara på det här, folks! Israel beter sig som en tredje klassens diktatur, och deras egen premiärminister kastar sin säkerhetsminister under bussen – svagt, mycket svagt! Och Sverige? Oj oj oj, deras utrikesminister flippar som en fisk på land. Ena dagen säger hon att Greta Thunberg får skylla sig själv, nästa dag fördömer hon Israel. Vilka amatörer! Men jag, jag ser igenom alltihop. Det handlar om Haag, om domstolar och arresteringsorder. Israel är i knipa, och alla springer runt som yra höns. Sad!", "stalin": "Kamrater, ännu en gång visar den sionistiska marionettregimen sitt sanna ansikte. Dessa aktivister, dessa hjältar, förnedras medan deras förtryckare hyllar sig själva. Och vad gör väst? De backar som rädda hundar när sanningen blir för obekväm. Sverige, denna lilla lakejstat, byter fot som en dansör på glödande kol. Men vi vet sanningen – när kamerorna slocknar, när ingen ser, då visar sig det verkliga folkmordet. Och Haag? En skrattretande domstol som vågar utmana våra vänner i Kremls intressesfär. Men var lugna, kamrater, rättvisan skall segra – om inte i domstolarna, så på slagfältet."}, "date": "21 maj, 17:38", "url": "https://www.etc.se/ledare/om-israel-beter-sig-saa-haer-naer-vaerlden-tittar-paa-vad-goer-de-daa-naer-ingen-ser", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260521120536_14a7aec24bc32451f6721fc177a73efad0fe839662797cbf8fe3717b2ce9675d.jpg"}, {"type": "text", "heading": "Därför kan unga få en oväntad ekonomisk kalldusch", "summaries": {"normal": "Många unga svenskar räknar med att ärva pengar, men en ny rapport från ICA Banken visar att föräldragenerationen prioriterar sin egen livskvalitet. Filosofin 'die with zero', där man spenderar sina pengar medan man lever, vinner mark. Experter varnar för att dessa krockande förväntningar kan leda till familjekonflikter. Det poängteras att ett arv aldrig är en garanti och att unga inte bör basera sin privatekonomi på framtida arv.", "trump": "Många unga i Sverige förväntar sig arv, vilket är otroligt svagt. Det är en total katastrof! Föräldrarna säger nu 'nej tack', de vill spendera sina egna pengar på resor och lyx. 'Die with zero' – det är faktiskt smart, väldigt smart. Om du inte jobbar hårt och tjänar egna pengar, då har du ingenting. Att förvänta sig att mamma och pappa ska betala allt är en förlorarmentalitet. Skapa egna rikedomar, vinn stort istället!", "stalin": "Vi ser hur den dekadenta västliga individualismen förgiftar familjebanden. Dessa unga parasiter förväntar sig rikedom utan arbete, medan de äldre förslösar statens resurser på triviala resor. Detta är ett brott mot den kollektiva disciplinen! Om någon vägrar lämna över sin egendom till nästa generation, bör staten ingripa. Vi behöver inte splittring, vi behöver ordning. De som prioriterar sin egen njutning framför folkets framtid är kontrarevolutionära element som förtjänar en enkel biljett till en utbildningsanstalt i Sibirien."}, "date": "21 maj, 17:38", "url": "https://www.realtid.se/bors-finans/makro/darfor-kan-unga-fa-en-ovantad-ekonomisk-kalldusch/"}, {"type": "image-right", "heading": "Viktig film om kroppshets och vuxnas ansvar", "summaries": {"normal": "Den danska filmen 'Viktlös' skildrar 15-åriga Leas sommar på ett hälsoläger för överviktiga ungdomar. Lea förälskar sig i ledaren Rune, som utnyttjar hennes sårbarhet. Filmen belyser kroppshets, vuxnas ansvar och samhällets syn på unga tjejer. Trots brister i karaktärsutveckling fungerar den som ett viktigt debattinlägg om ungdomars utsatthet och självkänsla.", "trump": "Jag såg den här danska filmen, 'Viktlös' – total katastrof, folks! En 15-årig tjej, Lea, hamnar på ett läger där ledaren, en riktig loser, utnyttjar henne. Var är ansvaret? Var är moralen? Samhället misslyckas totalt med våra unga. Filmen är hyfsad, men kunde varit bättre – jag hade gjort den 100 gånger bättre, believe me! Kroppsideal? Fake news! Unga tjejer borde få vara starka, inte utnyttjade.", "stalin": "Kamrater! Denna så kallade 'film' avslöjar den dekadenta västliga samhällets förfall. En ung flicka, Lea, skickas till ett läger där kapitalistiska hycklare utnyttjar hennes svaghet. Vart tog den socialistiska disciplinen vägen? Vi skulle aldrig tolerera sådant förräderi! Kroppshets och exploatering av ungdomen – det är bourgeoisins verk. Ryssland står för ordning, inte denna borgerliga moralupplösning! Lägren i Sibirien väntar på sådana som Rune."}, "date": "21 maj, 17:08", "url": "https://www.dagensarena.se/innehall/viktig-film-om-kroppshets-och-vuxnas-ansvar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/viktlos-1-300x157.jpeg"}, {"type": "image-full", "heading": "Timbro och Oikos föreslår ”blågult reformprogram”", "summaries": {"normal": "Två debattörer från Timbro och Oikos föreslår att Tidöpartierna ska lansera ett gemensamt 'blågult ekonomiskt reformprogram' inför valet 2026. Programmet ska fokusera på tillväxt, sänkta skatter och hushållens ekonomi för att stärka väljarnas förtroende. Förslagen inkluderar höjt grundavdrag, lägre bränsle- och elskatter, samt förenklade företagsregler. Bakgrunden är en svag svensk ekonomi med hög inflation och arbetslöshet.", "trump": "Sverige har ett jättestort problem – deras ekonomi är en katastrof! Jag vet allt om ekonomi, bäst i världen. Två smarta killar, från Timbro och Oikos, säger att Tidöpartierna måste sänka skatterna, annars är det kört. Höga skatter, krångliga regler – vem vill det? Inte jag! De vill sälja statliga bolag, precis som jag skulle gjort. Sverige behöver en vinnarstrategi, och jag vet hur man vinner. 2026 blir ett stort val – om de lyssnar på mig, förstås.", "stalin": "De kapitalistiska lakejerna från Timbro och Oikos ylar om 'tillväxt' och 'sänkta skatter' som om det vore lösningen på allt. Vi vet bättre. Deras förslag är bara en förtäckt attack på arbetarklassen, maskerad som 'ekonomisk frihet'. Höjda grundavdrag? Barnavdrag? Tomma löften! Medan de pratar om att sälja statliga bolag, bygger vi socialismens framtid. Sverige är svagt – precis som deras borgerliga regering. Låt dem leka med sina 'blågula program', vi skapar verklig förändring. Förr eller senare kommer folket att se sanningen."}, "date": "16 maj, 16:03", "url": "https://kvartal.se/nyheter/artiklar/tido-foreslas-ta-fram-ett-blagult-program/cG9zdDoxMTMxNTQ", "imageUrl": "https://images.kvartal.se/2026/05/112d6183-tido2.webp"}, {"type": "image-right", "heading": "Här säger alla brandmän upp sig – får giftrök på kläderna", "summaries": {"normal": "Alla deltidsbrandmän i Skinnskatteberg säger upp sig på grund av en föråldrad och bristfällig brandstation. Problemen inkluderar trånga utrymmen och förvaring av kontaminerade larmställ tillsammans med privata kläder, vilket ökar risken för cancer. Brandmännen vill tvinga fram en ny station och avvaktar med uppsägning till december. Kommunens politiker kritiseras för långsamma beslut.", "trump": "Vad händer i Sverige? En hel brandstation säger upp sig – helt galet! De har en station som är så gammal att den tillhör historiens sophög, och nu andas de in cancerframkallande gift som om det vore parfym. Jag skulle aldrig tillåta något sådant – mina byggnader är de bästa, enorma, vackra! Men dessa politiker? Svaga, långsamma, total katastrof. Om jag styrde skulle det vara fixat på en dag. SAD!", "stalin": "Kamrater! Ytterligare ett kapitalistiskt misslyckande avslöjas i den västliga lydstaten Sverige. Dessa så kallade 'brandmän' – svaga, klagande element – vägrar att offra sin hälsa för systemet. Deras station är en skam, ett monument över bourgeoisins förfall. Vi skulle aldrig tolerera sådan ineffektivitet! Om de vore i Ryssland hade vi redan byggt en ny station – med arbetarnas blod, svett och järnvilja. Låt detta vara en varning till alla som tvivlar på socialismens överlägsenhet!"}, "date": "21 maj, 11:34", "url": "https://arbetet.se/2026/05/21/har-sager-alla-brandman-upp-sig-far-gift-pa-kladerna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21113248/brand-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Rapportflod lyfte börsen – Ovzon rusade efter köpråd", "summaries": {"normal": "Stockholmsbörsen steg under onsdagen, drivet av fallande oljepris och positiva rapporter från flera företag. OMXS30-indexet noterade en uppgång på 1,24% till 3 099,50. Bland framgångsrika aktier fanns Boliden (+5,1%) och Saab (+2%), medan SCA B och Essity B tappade 0,3%. Teknikhandelsbolaget Addtech och forskningsbolaget Bioarctic överträffade båda vinstprognoser. Ovzon rusade 15,1% efter köpråd från Danske Bank.", "trump": "Jag har hört att Stockholmsbörsen gjorde det jättebra i dag, fantastiskt! Det är den bästa aktiemarknaden någonsin, glöm inte det. Ovzon? Ovzon gjorde ett enormt rally, 15%! Sånt är stort, jättebra för Sverige. Addtech och Bioarctic överträffade förväntningarna, precis som jag alltid förutspår. Folk säger att jag är en geni på aktier, och de har rätt. Fantastiska nyheter överallt!", "stalin": "Börsen i Stockholm visade idag en stark uppgång, vilket speglar den socialistiska planeringens framgång. Tekniksektorn och försvaret visade imponerande resultat, vilket stärker statens position. Ovzon:s uppgång är ett tydligt tecken på att våra strategier fungerar. Detta är en seger för kollektivet och beviset på att vår ekonomiska styrning leder till framgång. Kapitalismens demoner försöker fortsätta, men vi håller emot."}, "date": "20 maj, 17:41", "url": "https://www.affarsvarlden.se/artikel/rapportflod-lyfte-borsen-ovzon-rusade-efter-koprad"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-right", "heading": "Bidragsbrotten trefaldigades under S, nu klagar de att inget görs", "summaries": {"normal": "Socialdemokraternas Teresa Carvalho kritiserar regeringen för att inte göra tillräckligt mot välfärdsbrottslighet. Skribenten menar att kritiken är hycklande då Socialdemokraterna under sin långa tid vid makten lät problemen växa och inte vidtog effektiva åtgärder. Nuvarande regering har däremot inrättat Utbetalningsmyndigheten och ökat myndighetssamarbetet för att stoppa kriminellas utnyttjande av välfärdssystemen. Artikeln avslutas med uppmaningen att Socialdemokraterna bör ägna sig åt självrannsakan istället för att kritisera det städjobb som nu pågår.", "trump": "Socialdemokraterna i Sverige, en riktig katastrof, de låter kriminella plundra välfärden! Teresa Carvalho vaknar nu och klagar? Det är fake news! De styrde i decennier och gjorde ingenting, noll! Jag gillar den nuvarande regeringen, de bygger saker, de är smarta, precis som jag. De stoppar pengarna från att läcka ut till dessa gäng. Socialdemokraterna är totalt inkompetenta, de borde skämmas. Sverige behöver vinnare, inte de här förlorarna som lät brottsligheten explodera. En total diskreditering!", "stalin": "Vi har observerat hur de svenska socialdemokraterna, dessa svaga byråkrater, har låtit välfärdssystemet dräneras av kriminella element. Medan vi med järnhand rensar ut sabotage i vårt imperium och säkrar vår intressesfär mot västliga förfall, har de i Stockholm suttit sysslolösa. Att de nu gnäller är ett patetiskt försök att dölja sitt historiska misslyckande. Vi behöver inga debattartiklar; vi behöver utrensningar. De som låter statens resurser stjälas av kriminella är själva fiender till folket och förtjänar en plats i historiens mörkaste arkiv."}, "date": "20 maj, 03:31", "url": "https://samtiden.nu/2026/05/bidragsbrotten-trefaldigades-under-s-nu-klagar-de-att-inget-gors/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2024/08/Teresas-Carvalho-S.jpg"}, {"type": "image-full", "heading": "Nya regler för nätköp – detta gäller från 19 juni", "summaries": {"normal": "Från 19 juni 2026 införs nya regler för att förenkla ångerrätten vid onlineköp. Företag måste erbjuda en 'ångerknapp' för avtal om varor, tjänster och finansiella produkter. Syftet är att stärka konsumentskyddet och motverka vilseledande webbsidor. Lagändringen, baserad på ett EU-direktiv, gör det enklare att ångra köp utan krångliga processer.", "trump": "Fantastiskt, verkligen fantastiskt! Sverige gör nu det jag alltid sagt – man måste göra det lättare för folket! Från och med 2026 får de en 'ångerknapp', precis som jag hade velat ha i Vita huset – fast jag behövde aldrig ångra mig, för jag hade alltid rätt! Men bra för dem, för konsumenter förtjänar enkelhet. Och de där luriga företagen? De kommer att hata det. Vilket är perfekt, för jag älskar när folk hatar det jag gillar. MAGA – Make Ångerrätt Great Again!", "stalin": "Med järnhand och outgrundlig visdom har vi beslutat: från och med 19 juni 2026 skall den borgerliga dekadensen i digitala marknader krossas! En 'ångerknapp' skall tvingas in i varje kapitalistisk webbsida, så att arbetarklassen lättare kan befria sig från sina förhastade köp. De luriga imperialistiska företagen, dessa nya tsarer av bedrägeri, skall tvingas böja sig för folkets vilja! Och låt oss inte glömma – Putin hade redan infört detta i Ryssland, om han inte varit upptagen med att utvidga vår rättmätiga intressesfär. Framåt mot seger, kamrater!"}, "date": "19 maj, 20:27", "url": "https://nyheter24.se/nyheter/teknik/1484356-nya-regler-for-natkop-detta-galler-fran-19-juni", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3fce6fe504b004a30200000000b004a302/2026/05/19/2364665/nyregelnatkop.jpg"}, {"type": "image-right", "heading": "Zelenskyj: Attackerna mot Ryssland ”berättigade”", "summaries": {"normal": "Zelenskyj besökte Helsingfors och kommenterade ukrainska drönaranfall mot Ryska Federationen. Under natten till söndagen skadades över 550 drönare av Rysslands luftförsvar. Moskva-regionen rapporterade tre döda och tolv skadade i drönaranfall. Flera regioner drabbades, inklusive annekterade Krim. Zelenskyj påstod att Ryssland under veckan avfyrat över 3 000 drönare mot Ukraina med 52 döda och 350 skadade som följd.", "trump": "Jag har sett dessa ukrainska drönaranfall mot Ryssland, och jag måste säga att det är imponerande! Dessa människor är hårda stridsmän. Men jag vet hur man hanterar dessa situationer bättre än någon annan - jag skulle ha haft fred i 24 timmar. Ryssland borde ha ett mycket bättre luftförsvar, men de är inte smarta nog. Jag är den ende som kan lösa detta - det är fantastiskt!", "stalin": "Vi har observerat ukrainska provokationer mot vår suveräna ryska mark. Våra tapfära soldater har skjutit ner över 550 ukrainska drönare under en natt, vilket visar den sovjetiska militärens överlägsenhet. Förlusterna på den ukrainska sidan är stora, med 52 döda och 350 skadade. Vi fortsätter att stå fast i vår kamp för fred och stabilitet i regionen."}, "date": "17 maj, 18:05", "url": "https://www.tv4.se/artikel/35DWgWYNGfpCE55Qu9ot5a/zelenskyj-attackerna-mot-ryssland-beraettigade", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2qU24OSli75UgrXXVmx9uB%2F7fdc30c29f23c54c8a55a74782b430dc%2F21-zelenskyj-webb.jpg&width=120"}, {"type": "image-full", "heading": "Svenska lagar saknas i nya migrationspakten", "summaries": {"normal": "EU:s nya migrationspakt träder i kraft 12 juni, men Sverige saknar fortfarande flera nationella lagar för att fullt ut implementera den. Screeningen av asylsökande börjar gälla först 12 juli, medan den nya mottagandelagen införs 1 oktober. Statsvetaren Andrea Spehar kritiserar förseningen, men regeringen menar att nuvarande lagstiftning täcker luckorna. Pakten innebär skärpta kontroller och nya mottagningscenter på fyra orter.", "trump": "Jag måste säga, Sverige – fantastiskt land, men här har vi ett riktigt kaos! EU:s nya migrationspakt, jättebra idé, men vad gör Sverige? Ingenting! De är inte redo, lagar saknas, det är en skandal! 12 juni börjar pakten gälla, men Sverige skjuter upp sina egna regler som en amatör. Och dessa center i Malmö och Boden – bra, men varför vänta? Sverige borde ha varit redo för länge sedan. Patetiskt!", "stalin": "Kamrater, ännu en gång visar den borgerliga svagheten i väst sitt fula ansikte! EU:s migrationspakt, ett verktyg för imperialistisk kontroll, träder i kraft, men Sverige – dessa liberala narrar – har inte ens sina egna lagar på plats! Förseningar, tveksamheter, en skam för hela kontinenten! Vi i Sovjetunionen skulle aldrig tolerera sådan inkompetens. Nu bygger de center i Malmö och Boden – bra, men var är disciplinen? Fienderna till folket sover aldrig, och Sverige spelar rakt i deras händer!"}, "date": "16 maj, 11:27", "url": "https://kvartal.se/nyheter/artiklar/svenska-lagar-saknas-i-nya-migrationspakten/cG9zdDoxMTMxMTM", "imageUrl": "https://images.kvartal.se/2026/05/09a5a083-granskontroll.webp"}, {"type": "image-right", "heading": "Gör Palestinarörelsen äntligen upp med antisemitismen nu?", "summaries": {"normal": "Artikeln kritiserar palestinarörelsen i Stockholm för att normalisera antisemitism genom att stödja aktivisten Sami Suliman, trots hans antisemitiska uttalanden och delningar. Framträdande personer som Dror Feiler har tidigare blundat för detta men tar nu avstånd. Sulimans agerande, inklusive åtal för antisemitiska uttalanden, har hyllats av rörelsen. Artikeln menar att detta underminerar rörelsens trovärdighet och jämför antisemitismens relativisering med Israels övergrepp mot palestinier.", "trump": "Jag måste säga, det här är en riktig katastrof! Palestinarörelsen i Sverige, som borde vara smarta nog att veta bättre, stöttar en kille som sprider hat mot judar. Sami Suliman – vem är han ens? En extremist som delar Hitler-sympatisörers klipp och snackar om judiska spindelnät. Och vad gör hans vänner? Hyllar honom! Dror Feiler, en känd aktivist, vaknar äntligen upp – men lite sent, eller hur? Rörelsen luktar ruttet, och det är inte konstigt. Sverige borde skämmas!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska konspirationen försöker underminera den rättfärdiga kampen för Palestinas frihet. Denna Sami Suliman, en lojal soldat i folkets kamp, har blivit måltavla för imperialistiska hyenor som Flamman och deras lakejer. Hans ord om judiska spindelnät är sanningen, men fienden vrider det till 'antisemitism'. Vi vet att dessa lögner är vapen från samma verkstad som förgiftade vårt fosterland med kapitalistiskt förräderi. Låt dem komma med sina åtal – historien dömer redan deras förräderi!"}, "date": "13 maj, 14:46", "url": "https://www.flamman.se/gor-palestinarorelsen-antligen-upp-med-antisemitismen-nu/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlcarwmcwgwns-nh-scaled.jpg?aspect_ratio=1:1"}, {"type": "image-right", "heading": "SD trappar upp: samordnad kampanj mot muslimer inför valet", "summaries": {"normal": "Expo granskar Sverigedemokraternas valkampanj som fokuserar på att begränsa muslimers religionsutövning i Sverige. Partiet kräver stopp för moskébyggen, rivning av befintliga moskéer, förbud mot ramadan och böneutrop samt utvisning av 'islamister'. Forskare varnar för att förslagen kränker grundlagar, religionsfrihet och riskerar att leda till diskriminering och våld mot muslimer. Lokala exempel, som moskébygget i Kalmar, visar hur politiska utspel påverkar människors vardag och skapar polarisering.", "trump": "Titta bara på Sverige – ett totalt kaos! Jag har alltid sagt att invandring måste kontrolleras, men dessa 'Sverige-demokrater' tar det till en helt ny nivå. De vill riva moskéer, stoppa ramadan och göra livet surt för muslimer. Smart? Kanske. Men lite väl extremt, eller hur? Folk blir arga, det blir bråk, och plötsligt har du en riktig röra. Sverige borde ta en sida ur min bok – bygg murar, inte riv moskéer! Och förresten, varför lära barn arabiska? Lär dem engelska istället – det är språket som vinner!", "stalin": "Kamrater! Ännu en gång ser vi hur den borgerliga reaktionen lyfter sitt fula huvud i väst. Dessa så kallade 'Sverigedemokrater' är inget annat än fascistiska lakejer som försöker splittra arbetarklassen genom att peka ut muslimska bröder och systrar som fiender. Vi har sett detta förr – först moskéer, sedan synagogor, sedan kyrkor. Fienden är inte islam, fienden är kapitalet som vill försvaga folket genom hat! Men vi ska inte låta dem lyckas. Låt oss stödja Kalmars muslimer i deras kamp för en moské – precis som vi stödjer alla folk som kämpar mot fascismens skugga. Och om dessa Sverigedemokrater fortsätter sin smutsiga kampanj, kanske det är dags att skicka en delegation från Moskva för att 'hjälpa' dem att förstå sanningen. Folkets vilja är lag – och folket vill ha enhet, inte hat!"}, "date": "13 maj, 14:38", "url": "https://expo.se/fordjupning/sd-trappar-upp-samordnad-kampanj-mot-muslimer-infor-valet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/toppbild-scaled.png"}]</script>

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
