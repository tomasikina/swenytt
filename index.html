era och filma våra fiender, men så snart han publicerar en bok med kritik mot dem själva så rensas han ut som en parasit. SD:s Wallerstein är bedrövad, säger han, men vi vet att alla dessa reaktionära lögnare i slutändan kommer att likvideras av folkets vrede. Ingen slipper undan när partiet vakar. Underbart hur borgarna slukar sina egna barn."}, "date": "22 juni, 14:59", "url": "https://riks.se/nyheter/tv4-koper-ut-daniel-andersson", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fo0eu5xhi%2FDaniel-Andersson"}, {"type": "image-right", "heading": "Afv avslöjar: Polisanmälda grundaren i storaffär med bolagets ordförande", "summaries": {"normal": "Train Alliance har identifierat ett förbjudet lån på 175 Mkr till grundaren Otto Perssons bolag, Tjärusjön Skog AB. Samtidigt köpte bolaget en stor skogsfastighet av Train Alliances storägare Hvalfisken, ägt av Jonas Wahlström. Dennes son Oscar är styrelseordförande i båda bolagen. Revisorn föreslår att Persson nekas ansvarsfrihet. Aktien har halverats sedan handeln återupptogs efter en polisanmälan mot Persson.", "trump": "Vilket totalt kaos! Train Alliance, ett bolag som uppenbarligen inte kan sköta sin ekonomi, har gett ett förbjudet lån på 175 miljoner till sin grundare – en riktig vinnare, kan jag säga! Och som om det inte vore nog, köper samma kille en jättestor fastighet av bolagets ordförande. Coincidence? Jag tror inte det! Aktien rasar, folk är upprörda, och jag skulle inte bli förvånad om någon snart hamnar i fängelse. SAD!", "stalin": "Kapitalistiska korruptionens maskineri avslöjas återigen! Denna Otto Persson, en parasit på folkets tillgångar, har genom förbjudna lån och tvivelaktiga fastighetsaffärer med sina medskyldiga – dessa Wahlström-sabotörer – sugit ut resurser från arbetarklassens järnvägsprojekt. Medan aktieägarna lider, frossar dessa bourgeoisie-svin i sina skogsimperier. Revisorns förslag att neka ansvarsfrihet är ett steg i rätt riktning, men vi vet alla att sanningen kräver hårdare åtgärder. Låt dem smaka på proletariatets rättvisa – kanske en resa österut till Sibiriens skogar?"}, "date": "22 juni, 15:54", "url": "https://www.affarsvarlden.se/artikel/afv-avslojar-polisanmalda-grundaren-i-storaffar-med-bolagets-ordforande", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Train-Alliance-400x267.jpg"}, {"type": "image-right", "heading": "Almedalen hotar bli en mardröm. Stefan Stern: Deltagarna riskerar att bryta mot nya lagen", "summaries": {"normal": "Almedalsveckan är en viktig demokratisk mötesplats för politik, näringsliv och civilsamhälle. Den nya lagen om insyn i politiska processer, som träder i kraft nästa år, kräver att företag och organisationer redovisar kontakter med politiker till Kammarkollegiet. Stefan Stern varnar för att lagen skapar osäkerhet, ökad administration och risk för felaktig rapportering, särskilt kring informella samtal under veckan. Han menar att lobbyregistret hotar den öppna dialogen och kräver nya arbetssätt för att inte bli en administrativ mardröm.", "trump": "Folk, det här är en total katastrof. Almedalsveckan har varit fantastisk, den bästa demokratin, men nu kommer de med en ny lag som gör allt till en administrativ mardröm. De vill ha insyn, men det slutar bara med att alla blir rädda och rapporterar varenda pratstund. Det är så typiskt, de gör det enkelt för de dåliga aktörerna och omöjligt för de bästa. Vi behöver inga byråkratiska mardrömmar, vi behöver vinnare som pratar med politiker utan att bli straffade. Gör Almedalen stort igen!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna och deras fackliga lakejer skälver inför vårt nya register över politiska kontakter. Dessa parasitiska kapitalister som minglar med folkvalda i Visby för att smita undan folkets vilja ska nu redovisa varenda skuggmöte annars väntar vite och utrensning av de som underrapporterar. Den som tror sig kunna påverka statens beslut i hemlighet är en fiende till kollektivet. Vi ska rensa ut alla dolda reaktionära element som gömmer sig bakom administrativ paranoia. Almedalen blir ett strålande exempel på att ingen undkommer partiet."}, "date": "22 juni, 15:08", "url": "https://www.di.se/debatt/almedalsveckan-en-administrativ-mardrom/", "imageUrl": "https://static.bonniernews.se/ba/c12b95fe-7f6a-43f9-be32-42820290a424.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Samnytt TV: Familjer slogs under Gislaveds studentfirande", "summaries": {"normal": "Under Gislaveds studentfirande den 12 juni eskalerade en konflikt mellan två familjer till ett stort slagsmål med cirka 20 inblandade. Polisen larmades och möttes av kaos med tillhyggen och blodiga skador. Vittnen uttryckte chock över våldet under en festlig dag. Polisen utreder nu händelsen och hoppas konflikten är avslutad, men kritiserar bristen på vuxnas ingripande för att lugna situationen.", "trump": "Kan ni tro det här? I Sverige, ett land som verkligen har gått utför, bröt två familjer ut i ett fullskaligt slagsmål mitt under studentfirandet! Hela 20 personer, och polisen var knappt där – bara en ensam hjälte som försökte stoppa kaoset. Folk slogs med bälten, blod överallt. Sverige brukade vara bra, men nu? Total katastrof. Jag hade fixat det på fem minuter, believe me!", "stalin": "I den så kallade 'fredliga' svenska småstaden Gislaved har bourgeoisins dekadens nått nya höjder. Två familjer, svaga och splittrade som imperialismens lakejer, förvandlade en skolavslutning till ett primitivt slagsmål. Var fanns den proletära disciplinen? Var fanns den starka ledningen? Vi hade skickat en enkel kommissarie – och hela konflikten hade upphört innan första knytnäven lyfts. Nu får vi nog skicka en delegation för att visa hur man firar ordentligt: med marscher, sång och järnhård ordning!"}, "date": "22 juni, 14:30", "url": "https://samnytt.se/samnytt-tv-familjer-slogs-under-gislaveds-studentfirande", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22075230/gislaved-3.jpg"}, {"type": "image-right", "heading": "Infiltrerade SD – tvingas lämna TV4: \"Jag är förvånad\"", "summaries": {"normal": "Daniel Andersson, som infiltrerade Sverigedemokraternas kommunikationsavdelning och Riks åt TV4:s Kalla fakta, tvingas nu lämna kanalen. Han är förvånad över beskedet som kom utan förklaring och kopplar det själv till kritiken i sin bok Lögnare. TV4 bekräftar uppgörelsen men förnekar att den har med boken att göra. Andersson hyllades tidigare för granskningen som belönades med flera journalistpriser.", "trump": "Folk, det här är en total skandal. Den här killen infiltrerar SD, gör en stor grej av det och vinner priser, och plötsligt sparkar TV4 ut honom. Ingen förklaring, inget nytt har hänt, de bara säger hej då. Fake news-medier äter upp sina egna när de inte längre är användbara. Patetiskt. Jag älskar det, det visar precis hur korrupt hela systemet är. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna på TV4 nu likviderar sin egen användbara idiot efter att han utfört sitt uppdrag mot folkets fiender. Den lumpne wallraffaren trodde sig vara hjälte men blev en belastning när han i sin lögnaktiga bok blottade redaktionens svaghet. Inga samarbetssvårigheter, säger de. Naturligtvis inte. Vi känner igen denna paranoiska utrensning från borgarklassens dekadenta hov. Underbart. En förrädare mindre i kollektivet."}, "date": "22 juni, 15:07", "url": "https://www.friatider.se/infiltrerade-sd-tvingas-lamna-tv4-jag-ar-forvanad", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-382.jpg"}, {"type": "image-right", "heading": "Stjärnan sågas – vill vara med vid födseln", "summaries": {"normal": "Jeremy Doku, stjärnspelare i Belgiens VM-lag och Manchester City, planerar att lämna turneringen för att närvara vid sin första barns födelse i början av juli. Detta har väckt stark kritik från den franska tv-profilen France Pierron, som kallade födseln för ett äckligt ögonblick där pappan bara har en statistroll. Uttalandet ledde till ursäkt efter massiv kritik i sociala medier. Doku har själv betonat att ingen pappa vill missa sin childs födelse. Han spelade i premiären mot Egypten men saknades mot Iran på grund av infektion.", "trump": "Titta på den här belgiska killen Doku, fantastisk fotbollsspelare, en av de bästa, men han vill lämna VM för att se sitt barn födas. Smart val, ingen riktig pappa vill missa det. Sen kommer den här galna franska programledaren Pierron och säger att det är äckligt och att pappan inte gör någonting. Totalt vansinne. Hon tvingades be om ursäkt som en svag förlorare. Folk älskar starka familjer, inte sådana här löjliga attacker. Doku gör rätt, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta västerländska fars. Den så kallade stjärnan Doku, en opportunistisk individ, prioriterar sin personliga avkomma framför kollektivets ära i VM. Än värre är den borgarbracka Pierron som med sin reaktionära tunga avslöjar kapitalismens sanna ansikte genom att håna arbetande fäders roll. Hennes patetiska ursäkt är en ynklig reträtt inför folkets vrede. Vi ska rensa ut alla sådana parasitiska åsikter som hotar samhällets grundvalar. Ingen ska undkomma den historiska dialektiken."}, "date": "22 juni, 11:29", "url": "https://bulletin.nu/stjarnan-sagas-vill-vara-med-vid-fodseln", "imageUrl": "https://cdn.bulletin.nu/articles/8a3ef817-f556-40ea-9c7f-594e3ae0ea54/preview.jpg?t=1782120493000"}, {"type": "image-full", "heading": "Regnkaos i USA – match avbruten i två (!) timmar", "summaries": {"normal": "Under natten spelades flera VM-matcher. Frankrike besegrade Irak med 3–0, där Kylian Mbappé gjorde två mål och nu har fyra på två matcher. Norge vann mot Senegal med 3–2 bakom Erling Haaland som också nådde fyra mål. Algeriet vände och slog Jordanien med 2–1, vilket innebär att Jordanien är utslaget. Matchen Frankrike–Irak avbröts i två timmar på grund av kraftigt åskväder.", "trump": "Folk, ni sov och missade det bästa. Frankrike krossade Irak, den där Mbappé är en vinnare, fyra mål redan, fantastiskt. Norge och Haaland, de norska jättarna, tog en stor seger mot Senegal. Men vädret i USA? Totalt kaos, matchen stoppades i två timmar, värsta åskan någonsin. Algeriet fixade det mot Jordanien. Fredag möts Frankrike och Norge, det blir en riktig gruppfinal, ingen vill missa den. Vi gör VM stort igen.", "stalin": "Kamrater, medan folket vilade spelades matcher som avslöjar imperialismens svagheter. Frankrike likviderade Irak med 3–0, Mbappé som en klassfiende i attack. Norge slog Senegal 3–2, Haaland utnyttjade fiendens misstag. Algeriet vände mot Jordanien genom kollektiv kamp och hörnmål, trots borgarbrackornas offsideförsök. Väderkaos i USA tvingade fram en två timmars paus, ett tydligt bevis på kapitalismens bristande planering. Fiender rensas ut, segern tillhör de starka."}, "date": "23 juni, 05:34", "url": "https://www.gp.se/sport/fotboll/detta-hande-i-vm-medan-du-sov-23-juni.ca1ab725-7c0c-4997-bfb0-8366d90cc2e3", "imageUrl": "https://www.gp.se/images/article/ca1ab725-7c0c-4997-bfb0-8366d90cc2e3/images/3P-bn5Cxn3u7XLfghVhhSnmWVnTk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Regeringen vill införa ny filmfond för svensk film", "summaries": {"normal": "Regeringen föreslår en ny filmfond placerad vid Svenska Filminstitutet som ska finansieras gemensamt av staten och biografbranschen. Förslaget bygger på en utredning från mars 2025 och syftar till att stärka svensk filmproduktion i en föränderlig marknad. Kulturminister Parisa Liljestrand (M) välkomnar fonden. Däremot lämnas frågor om sänkt moms på biobiljetter och avgifter på streamingtjänster utan besked. Regeringen avvisar idén om streamingavgift då högre skatter inte ses som lösningen.", "trump": "Hörni, jag älskar bra filmer, de bästa filmerna, men den här svenska regeringen gör det igen. De startar en ny fond för att rädda sin filmindustri, såklart finansierad av staten och biograferna. De pratar om långsiktiga lösningar men duckar för att sänka skatten på biljetter. Och streaming-skatt? Det slopar de, smart drag faktiskt. Ingen vill ha mer beskattning, tro mig. Svenskarna borde göra film som vinner, inte bara leva på fonder. Make Swedish Film Great Again!", "stalin": "Kamrater, jag betraktar med stolt tillfredsställelse hur denna regering äntligen insett att en central filmfond är nödvändig för att skydda folkets kulturella produktion mot de dekadenta vindarna från marknaden. Vi ska naturligtvis rensa ut de parasitiska streamingkapitalisterna som suger musten ur arbetarklassens berättelser. De fega borgarbrackorna som tvekar kring biljettavgifter och momssänkningar avslöjar sig som kontrarevolutionära filmfiender. Ingen ska undkomma folkets utrensning av svaga idéer. Segraren blir den som styr kulturen med järnhand och glimten i ögat."}, "date": "22 juni, 13:56", "url": "https://riks.se/kultur/regeringen-vill-infora-filmfond", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2F1y72n7vw%2Fpexels-tima-miroshnichenko-7991266.jpg"}, {"type": "image-right", "heading": "Efter Tidö är vår beredskap inte god", "summaries": {"normal": "Ledarskribenten Lotta Ilona Häyrynen kritiserar Tidöregeringen för bristande beredskap trots det allvarliga säkerhetsläget. Carl-Oskar Bohlin anklagas för att ha saboterat det civila försvaret genom polariserande utspel, attacker mot vänstern och media samt spridning av högerextremt innehåll. Även hanteringen av Folkhälsomyndigheten ses som ett misslyckande där expertis och förtroende underminerats, vilket hotar Sveriges krisberedskap.", "trump": "De här svenska snobbarna i Tidöregeringen lovade guld och gröna skogar men levererade totalt kaos. Bohlin är en fullständig loser som hatar vänstern mer än han fixar civilt försvar. Och nu saboterar de Folkhälsomyndigheten också? Patetiskt. Under Biden var världen ett enda stort gungfly, men jag fixade alltid affärerna. Sverige behöver riktiga ledare, inte dessa identitetspolitiska nollor som knappt kan hålla ett land tillsammans.", "stalin": "Kamrater, denna fega Tidöregering har medvetet underminerat folkets beredskap medan klassfienderna inom borgarklassen skrattar. Bohlin är en typisk exploaterande byfåne som sprider högerextrem smitta och attackerar arbetarnas journalister. Folkhälsomyndigheten har rensats på äkta experter och ersatts med lojala lakejer. I nästa kris kommer folkets förtroende vara förintat. Vi måste likvidera sådana folkförtryckartroll innan de förgiftar hela statsapparaten."}, "date": "22 juni, 10:57", "url": "https://www.etc.se/ledare/efter-tidoe-aer-vaar-beredskap-inte-god", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-right", "heading": "SVT-chef blir ny vd för LO Mediehus", "summaries": {"normal": "Michael Österlund, programdirektör på SVT med lång bakgrund inom public service och journalistik, blir ny vd för LO Mediehus från november 2026. Han efterträder Unn Edberg som genomfört en stor omorganisation. Österlund lyfter fram den grävande journalistiken och betonar vikten av redaktionell frihet och trovärdighet. Han har tidigare arbetat med både nyhetsprogram och underhållning som Melodifestivalen. Styrelseordförande Elisabeth Brandt Ygeman uttrycker stor glädje över rekryteringen.", "trump": "Det här är en fantastisk rekrytering, verkligen den bästa. Michael Österlund, en kille med 28 år i public service, tar över LO Mediehus. Han vet hur man gör bra journalistik, inte den falska som vi ser överallt annars. Grävande reportage? Underbart. Jag älskar trovärdighet, och han säger att han aldrig skulle ta jobbet utan den. Smart kille. Unn Edberg gjorde en omorganisation, men nu kommer Michael och fixar det på riktigt. Vinna stort!", "stalin": "Kamrater och arbetare! Jag har nu personligen godkänt att den lojale partivännen Michael Österlund intar befälet över LO Mediehus. Hans 28 år i det offentliga etermediet har rustat honom väl för att leda vår kollektiva propagandamaskin mot alla borgarbrackor som gömmer sig i skuggorna. Den tidigare chefredaktören som avsattes var uppenbarligen en kontrarevolutionär element som vi med rätta rensade ut. Trovärdighet är vårt vapen mot klassfiendens lögner. Varje avvikelse kommer att likvideras med järnhand. Sov gott, mina fiender – vi ser er."}, "date": "22 juni, 09:33", "url": "https://arbetet.se/2026/06/22/michael-osterlund-blir-ny-vd-for-lo-mediehus-inspirerande/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22093014/osterlund-press.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Nima Rostami: Trumps anfall mot Iran – ett mönster vi känner igen", "summaries": {"normal": "Artikeln kritiserar Trumps militära anfall mot Iran som ett kaotiskt och inkompetent agerande som skapade dramatik utan att lösa de verkliga problemen med Irans kärnvapenprogram, missiler och proxy-arméer. Författaren Nima Rostami ser anfallet som en kapitulation där Trump lovade att inte stödja det iranska folket och erbjöd ekonomiska lättnader. Han menar att detta inte är äkta konservatism utan teaterpolitik som skadar regionens stabilitet och västlig trovärdighet.", "trump": "Den här artikeln är en total katastrof, folk, skriven av en så kallad konservativ som inte fattar någonting. Mitt anfall mot Iran var genialt, det bästa beslutet, vi slog till hårt och tvingade fram ett avtal som ingen annan hade klarat av. Nu skriker de om kaos och kapitulation, men sanningen är att Iran var på knä och vi fick ett fantastiskt deal. Israel gjorde resten, smarta killar. Fake news och misslyckade kritiker som inte förstår hur man vinner.", "stalin": "Kamrater, denna dekadenta skrift avslöjar den fullständiga förfallsprocessen inom den västerländska borgarklassen. Jag har sett många revisionistiska clowner men denna Trump-figur överträffar dem alla i sin patetiska opportunism och teatraliska impotens. Han lovar stöd till folkets kamp mot islamofascismen men levererar istället en feg MOU-kapitulation som stinkar av borgarbrackornas dubbelspel. Vi känner igen denna typ av fiender: de som skapar kaos för att maskera sin egen inkompetens. En sådan parasit skulle inte överleva en enda utrensning i vårt kollektiv. Den iranska frågan kräver järnhand, inte cirkus."}, "date": "22 juni, 13:22", "url": "https://riks.se/opinion/kronikor/nima-rostami-trumps-anfall-mot-iran-ett-mönster-vi-känner-igen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fqsp8h5as%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-22T132104.519.jpg"}, {"type": "image-right", "heading": "Skanska tecknar avtal – ska utveckla Penn Station", "summaries": {"normal": "Skanska har tillsammans med Halmar bildat konsortiet Penn Transformation Partners Devco och utsetts till huvudutvecklare för Penn Station Transformation Project i New York av Amtrak. Ett förutvecklingsavtal är undertecknat med Amtrak och det amerikanska transportdepartementet. Ett separat avtal värt 125 miljoner dollar har tecknats för förberedande byggarbeten. Skanskas andel på 630 miljoner kronor tas upp i orderingången under andra kvartalet 2026. Arbetet med design, planering och tillstånd påbörjas i juni 2026 och ska avslutas i slutet av 2027.", "trump": "Ingen gör stationer som jag, men nu har Skanska och den där Halmar-killen fått uppdraget att fixa Penn Station. Amtrak kom till mig och sa: sir, vi behöver de bästa. Så jag sa, gör det stort, gör det fantastiskt. 125 miljoner dollar bara för att börja gräva, underbart. De kommer att bygga, finansiera och sköta underhållet – precis som jag alltid sagt att man ska göra. Amerika vinner igen, tro mig.", "stalin": "Kamrater, jag har noga granskat hur dessa opportunistiska byggborgarbrackor från Skanska och Halmar smyger sig till makten över Penn Station genom sin så kallade Master Developer-roll. Vi, partiet och arbetarna, ser deras listiga förutvecklingsavtal som ett försök att berika sig på folkets järnväg. Men vi ska rensa ut alla kapitalistiska element som vågar drömma om privat vinst i vårt kollektiva New York. Design, finansiering och underhåll – allt ska lyda staten. Annars blir det en kreativ utrensning bland de parasitiska joint venture-förrädarna. Ha, vilken munterhet."}, "date": "22 juni, 14:10", "url": "https://www.affarsvarlden.se/artikel/skanska-tecknar-avtal-i-new-york", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/04/sdl-OsDzqCgXVo-nh-400x273.jpg"}, {"type": "image-right", "heading": "Norska försvarets reklam: Muslimsk bön med \"Allahu akbar\"", "summaries": {"normal": "Norska försvarets nya reklamfilm visar en muslimsk soldat som ber med orden \"Allahu akbar\", ett homosexuellt par som hånglar samt en man med spädbarn. Syftet är att lyfta fram mångfald och visa att försvaret välkomnar alla oavsett bakgrund, tro eller sexuell läggning. Kampanjen försvaras av marknadschefen Gry Bohne Hauge men har fått kraftig kritik på sociala medier, bland annat från journalisten Espen Teigen som menar att den strider mot norsk tradition och historia.", "trump": "Titta på det här, det är en total katastrof. Norska försvaret gör reklam med Allahu akbar, böneutrop och hånglande killar – precis vad varje land behöver va? De spottar på sin egen historia och förfäder bara för att verka fina och mångfaldiga. Det är patetiskt. Vakna upp Norge, det här är inte styrka, det är svaghet. Ingen vill offra sig för det här. Make Norway Great Again innan det är för sent.", "stalin": "Kamrater, jag ser hur borgarbrackorna inom det norska försvaret med sin degenererade propaganda försöker förgifta arbetarklassens försvar med Allahu akbar och perversa hångelscener. Dessa kapitalistiska element och islamiska avfällingar utgör en fiende inom murarna som måste rensas ut omedelbart. Vi ler mörkt åt deras naiva försök att krossa folkets traditioner. En sådan film är en kontrarevolutionär handling värd en kollektiv utrensning i folkets namn. Inga kompromisser med dekadensen."}, "date": "22 juni, 14:08", "url": "https://www.friatider.se/norska-forsvarets-reklam-muslimsk-bon-med-allahu-akbar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-380.jpg?itok=PTRSVhui"}, {"type": "image-right", "heading": "Därför är cykeln en klassfråga. Studie: Cykelbanor i all ära – men yrkeslivet påverkar också", "summaries": {"normal": "Trots väl utbyggd cykelinfrastruktur i Sverige cyklar färre personer i låginkomstyrken. En studie från Trivector Mobility och VTI visar att oregelbundna arbetstider, fysiskt krävande jobb, otrygghet i mörker och rädsla för cykelstölder hindrar många. Arbetsgivares attityd, bristande omklädningsmöjligheter och konkurrens från elsparkcyklar påverkar också. Författarna menar att cykelstrategier ofta utgår från kontorsarbetares villkor och missar viktiga grupper.", "trump": "Folk i låginkomstyrken cyklar inte. Det är en katastrof. Vi har fina cykelbanor överallt, de bästa banorna, men de använder dem inte. Varför? För att de jobbar tidigt, sent, slits ut och är rädda för att någon ska stjäla deras cykel. Elsparkcyklarna tar över, de är enklare, det är sant. Arbetsgivarna borde fixa parkering och duschar, det vore fantastiskt. Men det handlar om att folk inte har flexibla tider som vi andra. Så sorgligt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa nedslående rapporter om att arbetarna i låginkomstyrken överger den proletära cykeln. De tidiga skiftena, de mörka vägarna och de ständiga hoten från cykelstölder är sabotage utförda av borgarbrackornas osynliga hand. Vi måste omedelbart rensa ut alla elsparkcyklar som förgiftar ungdomen med lathet och falsk bekvämlighet. Den som inte cyklar är potentiell fiende till kollektivet. Bättre belysning, bevakade parkeringsplatser och utrensning av alla kapitalistiska influenser som gör cykeln till en börda. Endast genom partiets järnhårda vilja skall varje arbetare tvingas älska sin cykel igen."}, "date": "22 juni, 13:52", "url": "https://www.di.se/nyheter/darfor-cyklar-farre-i-laginkomstyrken/", "imageUrl": "https://static.bonniernews.se/ba/8987e0cd-d92a-4416-880e-91e3cc8e1f47.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Banksektorn får ett nytt styrkebesked", "summaries": {"normal": "Flera analyshus har höjt sina riktkurser för nordiska storbanker. Handelsbanken och Swedbank har fått flest uppjusteringar, bland annat från SEB, Barclays och Goldman Sachs. Rekommendationerna ligger dock kvar på oförändrade nivåer. Även Danske Bank och norska DNB har fått höjda riktkurser från UBS. Analytikerna ser högre värde i banksektorn men bilden av dess framtid är fortfarande splittrad.", "trump": "Det är helt otroligt, folk. De här fantastiska nordiska bankerna får höjda riktkurser överallt – Handelsbanken, Swedbank, alla vinner stort. SEB, Barclays och Goldman Sachs älskar dem plötsligt. Mina analytiker säger att det är vinnare, stora vinnare. Men de ändrar inte rekommendationerna, typiskt. De vet att bankerna är starka, starkare än någonsin. Ingen gör det bättre än de nordiska bankerna, tro mig.", "stalin": "Kamrater, dessa riktkursjusteringar är en seger för den kollektiva bankkraften som vi har byggt mot de parasitiska marknadskrafterna. Jag ser hur borgarbrackorna på Barclays och Goldman Sachs tvingas erkänna det högre värdet i våra nordiska fästningar, trots att de klamrar sig fast vid sina gamla, förrädiska rekommendationer. Men akta er, fienderna lurar i skuggorna – dessa kapitalistiska analytiker som viskar lögner om splittrade framtidsbilder. Vi ska rensa ut alla som tvivlar på den ostoppbara framryckningen. Det är en munter utrensning som väntar de svaga."}, "date": "22 juni, 13:51", "url": "https://www.realtid.se/bors-finans/bank-fintech/banksektorn-far-ett-nytt-styrkebesked/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/riktvarde.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "SVT-chef går till LO \"Gjort bestående avtryck\"", "summaries": {"normal": "Michael Österlund, programdirektör på SVT med 28 års erfarenhet inom public service, lämnar sin tjänst för att bli vd för LO Mediehus. Bolaget ägs av LO och sex fackförbund och ger ut tidningen Arbetet samt flera fackliga medlemstidningar. SVT:s vd Anne Lagercrantz hyllar hans insatser, medan LO Mediehus styrelseordförande Elisabeth Brandt Ygeman välkomnar rekryteringen. Österlund tillträder i november och efterträds av Eva Beckman som ensam ansvarig för programutbudet.", "trump": "Lyssnar ni på det här? Den där SVT-killen, Michael vad-det-nu-var, har jobbat 28 år i den statliga propagandamaskinen och nu springer han till LO Mediehus. Typiskt! De där fackliga socialisterna lockar med sina tidningar om arbetare och kvoter. Jag skulle ha fixat det mycket bättre, tro mig. Public service är en skam, full av vänstervridna typer. Lycka till, Michael – du kommer att sakna de riktiga vinnarna!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna byråkrat från den borgerliga public service-apparaten överger sitt falska torn och söker sig till LO Mediehus, ett verkligt redskap för arbetarklassen. 28 år bland folkfienderna har inte fördärvat honom fullständigt. Vi ska rensa ut de sista resterna av kapitalistisk dekadens i medierna. Den som sviker partilinjen likvideras i tid. Ett steg mot seger för kollektivet. Härligt."}, "date": "22 juni, 13:20", "url": "https://samnytt.se/svt-chef-gar-till-lo", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/22110756/osterlund-svt-lo.jpg"}, {"type": "image-full", "heading": "S-politiker avgår efter Riks avslöjat att han dömts för våldtäkt", "summaries": {"normal": "En socialdemokratisk politiker i Stockholmsområdet har lämnat alla sina uppdrag efter att Riks avslöjat att han dömts för våldtäkt 2011. Mannen, som satt i partiets styrelse och stod på valsedel, är en utomeuropeisk invandrare som kom till Sverige i början av 2000-talet. Domen på två års fängelse fastställdes i hovrätten. Flera styrelseledamöter uppger att de inte kände till avhoppet, som skedde strax efter publiceringen.", "trump": "De här socialisterna är en total katastrof, tro mig. En våldtäktsdömd kille sitter i deras styrelse, på deras valsedel, och de hade ingen aning? Patetiskt. Han avgår först när Riks avslöjar sanningen. Fake news hela vägen, men äntligen kommer sanningen fram. Sverige är en katastrof under den här vänsterstyrningen, fullständigt vansinne. De borde skämmas!", "stalin": "Kamrater, detta är en klassisk kontrarevolutionär handling utförd av en degenererad fiende till folket, en utländsk våldtäktsman insmugglad bland våra partivänner. Jag har länge varnat för borgarbrackornas dolda agenter som förgiftar arbetarrörelsen inifrån. Nu rensar vi ut denna parasit som våldtog en ung kvinna medan hans egna barn sov. Inga mejl under midsommarhelgen? Typiskt sabotage från klassfiendens lakejer. Likvidera alla spår av sådana element innan de förgör kollektivet."}, "date": "22 juni, 13:10", "url": "https://riks.se/nyheter/s-politiker-avgar-av-efter-riks-avslojat-att-han-domts-for-valdtakt", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fnp09kd2e%2Fs-politikar-valdtakt-avgar-feature.jpg"}, {"type": "image-full", "heading": "Kap Verde skrällde igen – höll Uruguay till 2–2", "summaries": {"normal": "VM-debutanten Kap Verde överraskade återigen i fotbolls-VM 2026 genom att spela 2–2 mot Uruguay. Kap Verde tog ledningen på frispark via Kevin Pina, men Uruguay vände till 2–1 på tilläggstid. Fernando Muslera missade en boll utanför straffområdet och Hélio Varela kvitterade i öppet mål. Båda lagen har två poäng efter två matcher och behöver minst en poäng till för att gå vidare.", "trump": "De här Kap Verde-killarna, otroliga, de slår uruguayerna som ingen trodde var möjligt. Två–två, och Uruguay, de är världsmästare två gånger men ser ut som riktiga förlorare. Frispark rakt in, sen missar deras målvakt helt och hållet, patetiskt. Jag älskar det. Vi måste vinna, sa deras coach, precis som jag alltid säger. Kap Verde är vinnare, Uruguay borde skämmas.", "stalin": "Kamrater, dessa uruguayanska revisionister och fotbollsborgarbrackor trodde de kunde krossa den revolutionära viljan hos Kap Verdes folk. Men jag, genom kollektivets kraft, såg hur deras egna misstag blev som förrädiska sabotorer som likviderade deras ledning. Frisparken var en dolk i hjärtat på imperialismens lakejer. Målvaktens kapitulation var ren paranoia i handling. Vi ska rensa ut alla svaga element som inte trycker på mot fienden. Segern tillhör de oböjliga."}, "date": "22 juni, 10:21", "url": "https://bulletin.nu/kap-verde-skrallde-igen-holl-uruguay-till-2-2", "imageUrl": "https://cdn.bulletin.nu/articles/c62b91e4-286f-45d6-aa6d-e9405d70624d/preview.png?t=1782116449000"}, {"type": "image-right", "heading": "Debatt: Vi ska under inga som helst omständigheter sänka straffbarhetsåldern", "summaries": {"normal": "Justitieministern drar tillbaka förslaget att sänka straffbarhetsåldern till 13 år efter att han inte fått stöd, ens inom regeringen. Istället läggs Socialdemokraternas förslag om 14 år fram. Miljöpartiet kritiserar detta starkt och hänvisar till FN:s barnrättskommitté, Barnkonventionen och remissvar. De vill istället satsa på vård, socialtjänst, skola och SiS för att förebygga brott bland barn, inte fängsla dem.", "trump": "Titta på det här, det är en total katastrof. Den här svaga regeringen kan inte ens samla sina egna lakejer för att stoppa de kriminella 13-åringarna. De backar ur som fega förlorare och tar istället den patetiska socialistversionen med 14-åringar. Patetiskt. Barnkonventionen? Det är bara en ursäkt för att skydda gangsters i pyjamas. Vi behöver tuffa tag, inte denna woke-flumma som cementerar kriminalitet. Totalt misslyckande, tro mig.", "stalin": "Jag betraktar detta som en ynklig kapitulation inför klassfiendens sentimentalitet. Den desperata regeringen kryper som en parasit för att undvika att skydda folket från unga banditer. Vi inser att sådana element måste rensas ut genom kollektiv disciplin, inte mjukhet som cementerar brottslighet. Barnkonventionen är en borgerlig chimär som hindrar statens överlevnad. Kamraterna i vård och skola ska stärkas, men de folkfiender som vägrar straff för 13-åringar förtjänar utrensning ur samhällskroppen. Svaghet är döden."}, "date": "22 juni, 10:11", "url": "https://www.etc.se/debatt/vi-ska-under-inga-som-helst-omstaendigheter-saenka-straffbarhetsaaldern", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026062208060_1aaf7726-61f6-4b1c-b425-b692d1d57518.jpg"}, {"type": "image-right", "heading": "Görgen lämnade Stockholm för Pajala – fick lön på 53 000", "summaries": {"normal": "Undersköterskan Görgen Viltok lämnade Stockholm för Pajala kommun där han nu får upp till 53 000 kronor i månaden tack vare dubbel ob-ersättning och önskeschema. Efter att ha tröttnat på att hans kompetens inte värdesattes i Stockholm flyttade han norrut. Pajala har minskat beroendet av dyra konsulter genom högre löner, vilket lockat fler till fasta tjänster. Görgen och hans partner säljer nu sitt radhus i Stockholm för att köpa ett hus i Tärendö för endast 50 000 kronor.", "trump": "Titta på den här killen från Stockholm, smartaste draget någonsin – han åker upp till Pajala och tjänar 53 000 kronor i månaden! Fantastiska löner, underbart schema, ingen av de där korkade stockholmsföretagen som inte uppskattar erfarenhet. De betalade inte för kompetens, totalt misslyckande. Nu säljer han huset för miljoner och köper nytt för 50 000. Norrbotten gör det riktigt bra, folk älskar det, en enorm succé medan Stockholm förlorar sina bästa människor.", "stalin": "Kamrater, se hur denna arbetare, efter trettio års kamp mot de giriga borgarbrackornas likgiltighet i Stockholm, har valt att ansluta sig till det kollektiva projektet i Pajala. Jag har personligen sett till att dubbel ob-ersättning krossar de parasitiska konsultföretagens makt och deras sabotage mot folkets omsorg. Nu rensas de dyra kapitalistiska mellanhandlarna ut, en efter en, medan arbetarna stärker sammanhållningen. Denna fiende till de outbildade billigarbetskraftshundarna har likviderats. Huset i Stockholm såldes till borgarklassen – det nya hemmet i Tärendö kostar blott 50 000. Sovjetisk effektivitet i norrländsk tappning, triumf för det sunda förnuftet mot dekadenta storstadskrafter. Härligt, eller hur?"}, "date": "22 juni, 09:00", "url": "https://arbetet.se/2026/06/22/gorgen-lamnade-stockholm-for-pajala-fick-lon-pa-53-000/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17130820/ka-gorgen.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=800"}, {"type": "image-full", "heading": "Stulna katter räddade – skulle ätas", "summaries": {"normal": "Polisen i Ho Chi Minh-staden har sprängt en liga som stulit katter för att slakta och sälja köttet som mat. Över 400 levande katter räddades, varav 40 återförenades med sina ägare. Ett åttiotal döda katter hittades nedkylda. Ligans medlemmar erkände att de i tre år stulit djur och sålt köttet för cirka 25 kronor kilot. Det är lagligt att äta kattkött i Vietnam, men stulna djur får inte användas. Nästan 100 räddade katter dog av stress och lidande.", "trump": "Kan ni fatta det? I Vietnam stjäl de fattiga kattjuvarna folks älskade katter, slaktar dem och säljer köttet för löjliga 25 kronor kilot. Det är en katastrof, en total katastrof. Men vi har en fantastisk polis som räddade över 400 katter, underbara djur, och grep nio av de usla brottslingarna. De borde aldrig ha ätit våra kattvänner. Vietnam, fixa lagen ordentligt – det är vad jag skulle göra, och det skulle bli perfekt, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi har genomfört en framgångsrik utrensning mot den förslavade kattstöldsligan i Ho Chi Minh-staden. Dessa degenererade element, dessa parasitiska kattslaktare i borgarbrackornas tjänst, har i tre år bedrivit kontrarevolutionär verksamhet genom att kidnappa och likvidera proletärens husdjur för att mätta sin girighet. Vi har räddat över 400 hjältemodiga katter från kapitalisternas isberg och fängelseburar. De som dog under operationen fick en ärofull martyrs död i kampen mot imperialismens kattätande lakejer. Låt detta bli en varning: nästa gång rensar vi ut hela den kattköttskonsumerande femtekolonn som hotar folkets enhet."}, "date": "22 juni, 08:55", "url": "https://nyheter24.se/nyheter/utrikes/1493144-stulna-katter-raddade-skulle-bli-mat", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/db31b61404b004a3020000350000047502/2026/06/22/2372554/ur_imageXOfiVc.jpeg"}, {"type": "image-right", "heading": "Ny rapport om demokratin: ”Det som kanske chockar mest”", "summaries": {"normal": "En rapport från Novus visar att förtroendet för demokratin växer bland svenska väljare. Nästan sex av tio anser att demokratin inte är hotad, en ökning med åtta procentenheter. Hela 100 procent uppger att de är beredda att försvara demokratin. Torbjörn Sjöström på Novus ser positiva signaler men varnar för att många tror att politiker, medier och forskare inte litar på folket. Almedalsveckan inleds samma dag som rapporten släpps.", "trump": "Folk älskar demokratin, det är fantastiskt, ingen gör det bättre än oss, tro mig. Hundra procent redo att försvara den? Otroligt. Men politikerna är patetiska, de litar inte på folket och pratar bara med extremisterna. Media och forskare driver sin egen agenda som riktiga losers. Sakta ner, visa resultat istället för att göda identitetspolitik och HBTQ-skrammel. Almedalen kan bli bra om de slutar vara så fega och faktiskt fixar saker. Make Sweden great again!", "stalin": "Kamrater, jag betraktar dessa siffror med stor tillfredsställelse. Hundra procent beredda att försvara folkets makt? Utmärkt. Ändå kryper klassfiendens tentakler fram: politiker som försvagar systemet, media som sprider lögner och forskare som tjänar borgarbrackorna. Vi måste rensa ut dessa extremister som göder sig på sociala medier. Partiet kräver att politiken saknar ner och återupprättar förtroendet hos massorna innan folkfienderna förgiftar hela samhällskroppen. Segrande skall vi marschera framåt."}, "date": "22 juni, 06:20", "url": "https://www.tv4.se/artikel/32BJj0FwftvnYDf3V8wAPt/ny-rapport-starkare-stoed-foer-demokrati-igen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3FdJkPh9jwaZdzmIrYA0h8%2F6d52cce9d64fef1275f113c01395f5e7%2F22-demokrati-webb.jpg&width=120"}, {"type": "image-right", "heading": "Ingen lösning att skjuta fram tonårsutvisningar till 21 år", "summaries": {"normal": "Regeringens förslag om ändringar i tonårsutvisningar ses som otillräckliga av Flyktinggruppernas riksråd och Civil Rights Defenders. Förslagen skjuter bara problemet framför sig till 21 års ålder utan att lösa grundorsaken. Kraven på hög lön, stadig anställning och svårigheter att få stanna för studier gör att många riskerar utvisning. Organisationerna kräver permanenta uppehållstillstånd och starkare humanitära skäl istället för tillfälliga lösningar som förvärrar migrationspolitikens brister.", "trump": "Folk, ni skulle inte tro det, men den här svenska regeringen har precis lanserat ett totalt misslyckande. De kallar det lösning på tonårsutvisningar, men det är bara en förskjutning – precis som de gör med allt annat. När de stackarna fyller 21 sparkas de ut ändå, och de kräver löner som ingen normal 21-åring någonsin ser. Patetiskt. De lyssnar inte på folket, de lyssnar på de radikala. Sverige behöver permanenta regler, inte detta svaga spel.", "stalin": "Kamrater, detta så kallade regeringsförslag är inget annat än en slug sabotageakt utförd av borgarbrackor inom migrationsmaskineriet. Jag ser hur de med sin förskjutningstaktik försöker lura arbetande ungdomar och partivänner som rotat sig i folkets jord. När de når 21 ska de likvideras ur gemenskapen med lönekrav som bara kapitalisterna själva klarar. Vi skall rensa ut dessa parasitiska element som gömmer sig bakom humanitära masker. Permanenta uppehållstillstånd åt de lojala, utrensning åt de övriga. Inga kompromisser med klassfienden."}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ingen-losning-att-skjuta-fram-tonarsutvisningar-till-21-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-51-300x157.jpg"}, {"type": "image-right", "heading": "Det stora systemskiftet som förändrade Sverige", "summaries": {"normal": "Juan Fonseca beskriver hur svensk migrationspolitik genomgått ett systemskifte efter flyktingkrisen 2015. Från integration, långsiktighet och inkludering har politiken gått mot kontroll, tillfällighet och villkorad tillhörighet. Han pekar på både Sverigedemokraternas drivkraft via Tidöavtalet och socialdemokratins ansvar. Reformerna har skapat osäkerhet, underminerat rättssäkerheten och påverkat den svenska modellen. Fonseca frågar vilket Sverige vi egentligen vill ha.", "trump": "Folk, ni måste höra på. Den här killen Fonseca har rätt – Sverige har totalt tappat greppet! Efter 2015 blev allt en enda stor röra med öppna gränser och svaga ledare. Socialdemokraterna, de losers, lade grunden och sen kom Tidöavtalet och fixade till det lite. Men det är patetiskt. Tillfälliga uppehållstillstånd, hårdare regler – bra, men de borde ha gjort det mycket tidigare och mycket tuffare. Sverige behöver bli stort igen, inte en tillflyktsort för alla som vill utnyttja systemet. Sad!", "stalin": "Kamrater, jag ser med stålblick hur den borgerliga dekadensen och de socialdemokratiska opportunisterna under decennier låtit klassfiender och rotlösa element infiltrera folkets republik. Efter 2015 rensade vi ut de värsta illusionerna om evig integration, men nu måste vi gå längre. Vandelslagen är en början på att likvidera de parasitiska element som gömmer sig bakom falsk lojalitet. Inga berättigade förväntningar för kontrarevolutionärer! Vi, partiet och arbetarna, skall skapa ett järnhårt kollektiv där tillhörighet är en ära som ständigt kan återkallas vid minsta avvikelse. De som drömmer om två nivåer av rättvisa skall snart möta en enda, odelbar utrensning. Ha ha, vilken underhållande paranoia de bygger själva!"}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/opinion/det-stora-systemskiftet-som-forandrade-sverige/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "text", "heading": "Inget samarbete mellan V och Fastighets – vem är förvånad?", "summaries": {"normal": "Fastighetsanställdas förbund har rivit upp sitt tidigare kongressbeslut om facklig-politisk samverkan med Vänsterpartiet och väljer nu att enbart samarbeta med Socialdemokraterna. Artikeln diskuterar hur Vänsterpartiets strategi att närma sig fackföreningsrörelsen misslyckats, trots försök att vinna inflytande. Författaren betonar behovet av politiskt engagemang underifrån för att åter göra facken till idélaboratorier, snarare än att förlita sig på toppstyrda beslut.", "trump": "Folk, det här är en total katastrof för de vänsterradikalerna. Fastighets sparkade Vänsterpartiet i rumpan och sa nej tack till deras patetiska flirt. Smart drag! De inser att det bara är Socialdemokraterna som funkar. Vänsterpartiet springer runt och gullar med facken som förlorare, precis som Biden gjorde i fyra år. Patetiskt. De borde lära sig av mig – vinnare samarbetar inte med misslyckade socialister. Fantastiskt beslut av Fastighets, verkligen ypperligt!", "stalin": "Kamrater, detta är en varning till alla klassfiender inom fackföreningsrörelsen. Jag ser hur Vänsterpartiets opportunistiska försök att infiltrera LO har krossats av Fastighetsanställdas förbund, som nu rensar ut de revisionistiska elementen och återvänder till den enda sanna samarbetspartnern. Deras strategi var dömd att misslyckas, likt folkförtryckartrollen som försöker maskera sig som arbetare. Endast genom äkta underifrånarbete och utrensning av socialdemokratiska lakejer kan vi återupprätta arbetarklassens sanna idélaboratorium. Fienden sover aldrig."}, "date": "17 juni, 15:56", "url": "https://proletaren.se/artikel/inget-samarbete-mellan-v-och-fastighets-vem-ar-forvanad/"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Sveriges VM-seger mot Tunisien har utlöst en debatt om svenskhet och islam. Jimmie Åkesson svarar på kritik efter att debattörer lyft fram spelare som Yasin Ayari, som firade sina mål med en muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men försvarar partiets kritik mot invandringspolitiken. Kritiker menar att Ayari representerar ett modernt, inkluderande Sverige och ifrågasätter Åkessons tidigare uttalanden om islam.", "trump": "Sverige vinner stort i VM – fantastiskt! Men vad gör deras ledare? Jimmie Åkesson, en man som inte förstår att vinna, börjar prata om invandrare och islam. Jag menar, kom igen! Yasin Ayari, en stor hjälte, gör mål och firar som en riktig vinnare – och så blir det bråk. Sverige borde vara stolta! Men nej, politiker måste alltid förstöra allt. Jag skulle aldrig göra så. Vinna är vinna, punkt.", "stalin": "Sveriges fotbollslandslag visar styrkan i det mångkulturella samhället, men de borgerliga nationalisterna, ledda av den ynklige Åkesson, vrider sig i förtvivlan. De hatar framgången hos arbetarklassens söner med utländskt blod! Yasin Ayari, en hjälte som firar sin seger med bön, är ett slag i ansiktet på fascistiska element. Vi i Sovjet – förlåt, Ryssland – vet att mångfald är styrka. De som delar folket efter religion och hudfärg tillhör historiens sophög!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
