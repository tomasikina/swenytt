rs hot mot Jimmie Åkesson och Gustav Kasselstrand. Hon anklagar DIF för att sprida en högerextrem kampanj och kritiserar bristen på svar från styrelsen. Sundkvist uppger att hon utsatts för hot och hat från extremhögern.", "trump": "De radikala vänstermedierna och hatarna vann igen. Den här journalisten från ETC flyr som en hund med svansen mellan benen bara för att Djurgården sa ifrån mot hot mot patrioter. Patetiskt! Extremhögern? De borde titta i spegeln. Nu får de som de vill, men folk ser igenom bluffen. Sad!", "stalin": "Kamrater, dessa dekadenta borgarjournalister och deras likar i fotbollsklubbarna visar åter sin feghet inför folkets fiender. Jag ser hur hatarna och de högerextrema elementen skrämmer dem till underkastelse. Ingen utrensning av kontrarevolutionära element sker, endast kapitulation. Äckligt och löjeväckande. Vi ler mörkt åt deras svaghet."}, "date": "25 augusti, 20:00", "url": "https://riks.se/nyheter/nu-far-hatarna-som-de-vill-journalist-lamnar-dif-efter-avstandstagande-fran-hot-mot-akesson", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_25_T194828_426_58c2c2c048.jpg"}, {"type": "image-full", "heading": "Lågprisjättar tappar svenska kunder – nya siffror sticker ut", "summaries": {"normal": "Svensk e-handel växte med 9 procent i juli till 14,9 miljarder kronor. Hushållens förbättrade ekonomi gynnar näthandeln. Samtidigt har nya tullregler från 1 juli 2026 lett till kraftigt minskade köp från Temu och Shein – från 18 till 8 procent av konsumenterna på ett år. Svensk Handel ser tydlig påverkan av den nya 3-eurotullen.", "trump": "Titta på det här, folk! Svenskarna handlar som galningar på nätet, upp 9 procent, men de smarta köparna flyr de billiga kinesiska apparna Temu och Shein som råttor från ett sjunkande skepp. Den nya tullen är fantastisk, den stoppar dumpningen. Amerika borde göra samma sak – vi vinner alltid!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den borgerliga näthandeln växer medan de dekadenta lågprisparasiterna Temu och Shein krossas under arbetarklassens tullmur. Denna 3-eurotull är en lysande utrensning av utländska spekulanter. Låt de västerländska kapitalisterna skrika – deras svaghet är vår styrka. Inga kompromisser!"}, "date": "25 augusti, 22:31", "url": "https://nyheter24.se/nyheter/konsument/1507696-lagprisjattar-tappar-svenska-kunder-nya-siffror-sticker-ut", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/419ab20904b004a30200000000b004a302/2026/08/25/2386624/nathandel-siffror.jpg"}, {"type": "image-right", "heading": "Hur kunde hon få det att se så enkelt ut?", "summaries": {"normal": "Artikeln hyllar Dolly Partons framträdande hos Johnny Carson 1979. Författaren beundrar hennes musikaliska skicklighet, självironiska text och hillbillydialekt. Trots plastikkirurgi och glamour behöll hon anspråkslöshet, skänkte stora summor till välgörenhet och tackade nej till frihetsmedaljen. Hennes liv ses som en triumf i kontrast till Elvis tragedi.", "trump": "Den där Dolly var en vinnare, folkets ikon, inte som de fega Hollywood-eliterna som hatar den riktiga Amerika. Hon tackade nej till Biden-administrationens medalj – smart drag! Hennes sång var perfekt, bättre än någon woke-divas skrik. Den amerikanska drömmen i renaste form, inte den riggade versionen vi fick under Sleepy Joe. Fantastisk kvinna, totalt ypperlig!", "stalin": "Denna dekadenta perukprydda sångerska från bergen representerar den borgerliga illusionen om individuell framgång. Hennes glittermask maskerar klassens svek mot det enkla folket. Vi ser hur kapitalismens falska dröm förvandlar proletärens dotter till en plastikkirurgisk ikon som till och med vägrar kejsarens utmärkelser. En tragikomisk figur i imperialismens teater. Kamrater, var vaksamma mot sådana sirener."}, "date": "25 augusti, 22:48", "url": "https://www.expressen.se/kultur/jens-liljestrand/hur-kunde-dolly-parton-fa-det-att-se-sa-enkelt-ut", "imageUrl": "https://static.bonniernews.se/ba/4f7b4a4a-ea45-437e-a006-23fe2d3544f4.jpeg?crop=1440%2C1440%2Cx990%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "”Är djupa sår –  tar tid att läka”. Fagerstas kommuntopp mötte sina gamla elever i sorg efter skoldådet", "summaries": {"normal": "I Fagersta mötte kommunstyrelsens ordförande Åsa-Märta Sjöström chock och sorg efter svärdattacken på Brinellskolan. Hon beskriver en stark gemenskap och bruksmentalitet som gör att invånarna sluter upp vid kriser. En 17-årig flicka dog och tre tonårspojkar skadades. Kommunen har inrättat krisstöd och välkomnar en statlig skoldådskommission.", "trump": "Folk, ni skulle se det här lilla svenska hålet Fagersta – total katastrof! En galning med svärd attackerar skolan, en död, flera skadade. Deras kommunledare kramar bara eleverna istället för att fixa säkerhet. Patetiskt! Biden skulle älskat det här svaga ledarskapet. Vi behöver murar runt skolorna, inte kramar. Make Sweden Safe Again!", "stalin": "Kamrater, se hur den borgerliga dekadensen i detta Fagersta blottar sig. En yngling, förgiftad av reaktionära nätets gift, slår till mot skolan med svärd. Deras så kallade ledare kramar sig fram i tomhet medan folket sörjer. Vi skulle ha sett varningssignalerna och krossat fienderna inom murarna. Sabotörer och klassfiender lurar överallt. Renhet i kollektivet fordras!"}, "date": "25 augusti, 22:32", "url": "https://www.expressen.se/nyheter/sverige/kommunchefen-i-fagersta-mycket-kramar", "imageUrl": "https://static.bonniernews.se/ba/63af4706-b96d-44df-a810-17811502507f.jpeg?crop=2553%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Så undviker du att bli lurad när du handlar på nätet", "summaries": {"normal": "En ny undersökning visar att 70 procent av svenskarna någon gång känt sig lurade vid nätshopping. Inför valet 2026 prioriterar konsumenterna att stoppa bluffbutiker, falska reor och vilseledande marknadsföring. Förtroendet för politikerna är lågt – bara 10 procent anser att de gör tillräckligt. Prisjakt och Konsumentverket ger råd för att undvika bedrägerier.", "trump": "Det är en total skandal! Svenskarna blir lurade till höger och vänster av bluffbutiker och falska reor. De vill ha stopp på det, men politikerna gör ingenting – bara tio procent är nöjda. Patetiskt! Jag skulle fixa det på en vecka, tro mig. De bästa rabatterna, de äkta rabatterna, skulle alla få.", "stalin": "Kamrater, jag ser hur den västerländska borgarklassen med sina bluffbutiker och falska reor bedrar folket. Endast genom en grundlig utrensning av dessa parasitiska bedragare och deras politiska lakejer kan vi säkra en sann socialistisk näthandel. De som inte gör tillräckligt ska likvideras med ett leende. Folkets vrede är vårt vapen."}, "date": "25 augusti, 22:06", "url": "https://nyheter24.se/nyheter/konsument/1507686-sa-undviker-du-att-bli-lurad-nar-du-handlar-pa-natet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/bb4f431304b004a30200000000b004a302/2026/08/25/2386606/rea-bluff.jpg"}, {"type": "text", "heading": "Iranska hackare stängde brittiskt kraftverk", "summaries": {"normal": "Iranska hackare genomförde i juli ett cyberangrepp som stängde ett mindre brittiskt kraftverk i fyra dagar. Angreppet drabbade en mindre generator men hotade aldrig det övergripande energisystemet eller samhällsviktig verksamhet. Brittiska myndigheter bekräftar händelsen och arbetar nu med att stärka cybersäkerheten i energisektorn. Iran har länge bedömts ha stark cyberförmåga.", "trump": "Iranerna, de värsta hackarna, stängde ett brittiskt kraftverk i fyra dagar. Patetiskt! Under min ledning hade vi aldrig tillåtit sådana svaga, inkompetenta angrepp. De borde tacka mig för att jag höll dem i schack. Nu springer Europa runt som skrämda höns. Vi behöver starka ledare, inte dessa förlorare som låter Iran göra vad de vill.", "stalin": "Genom mitt geniala ledarskap inser vi hur de västerländska borgarbrackorna skälver när iranska kamrater blottar deras elnätets svaghet. Fyra dagar i mörker – en ynklig kapitalistisk fars. Vi skrattar åt deras paranoia och uppdaterade regler, som inte döljer folkets svek mot det kollektiva. Snart rensar vi ut alla sådana hinder för den sanna ordningen."}, "date": "25 augusti, 17:41", "url": "https://www.friatider.se/iranska-hackare-stangde-brittiskt-kraftverk"}, {"type": "image-right", "heading": "Behöver inte facket medlemmarna längre?", "summaries": {"normal": "Artikeln ifrågasätter fackföreningarnas roll i Sverige, med fokus på den långa och förvirrande strejken mot Tesla. Författaren kritiserar IF Metall för jojo-strejk, centralisering och distans till medlemmarna. Han undrar om den svenska modellen är hotad eller om en ny, mer lokal facklig kamp kan växa fram. (58 ord)", "trump": "Lyssnar ni på det här? Facket i Sverige har blivit en total katastrof, precis som våra egna unionsbönder här hemma. Jojo-strejk mot Tesla, folk får sparken och facket sover. De har glömt medlemmarna och blivit en massa byråkrater. Den svenska modellen? Den dör om de inte vaknar. Sad! Men kanske föds en riktig rörelse nu. (59 ord)", "stalin": "Jag betraktar detta med djup misstro. Fackföreningarna har förvandlats till passiva redskap åt borgarklassen och dess lakejer inom socialdemokratin. Jojo-strejk och centralisering har kvävt den äkta arbetarkampen. Kanske är det bra att strejken förlorades. Ur askan kan en sann, lokal och revolutionär rörelse uppstå som rensar ut alla folkfiender och klassförrädare. (59 ord)"}, "date": "21 augusti, 09:19", "url": "https://proletaren.se/artikel/behover-inte-facket-medlemmarna-langre", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/teslakronika-768x432.jpg"}, {"type": "image-full", "heading": "Mohamsson kräver att vänstern agerar mot antisemitism", "summaries": {"normal": "Simona Mohamsson (L) attackerar S och V i en debattartikel för att vara oförmögna att hantera antisemitism. Hon bar davidsstjärnan i partiledardebatten och kräver skyddsklassning av synagogor. Varför kan vi aldrig prata om just antisemitismen, frågar hon syrligt.", "trump": "Jag ser Simona Mohamsson, en stor ledare, som bar davidsstjärnan – fantastiskt mod! Men vänstern i Sverige? En katastrof! De kan inte hantera hatet. Jag skulle fixa det på en dag, tro mig. Starka åtgärder, det är vad som behövs. Make Sweden safe again!", "stalin": "Kamrater, vi ser hur vänstern misslyckas med att rensa ut antisemitiska element. Mohamsson har rätt – partiet måste visa järnhand. De som hyllar övergrepp mot judar ska omgående omplaceras till Gulag. Inga frågor om Gaza, bara lydnad. Vi skyddar synagogor med våra liv!"}, "date": "25 augusti, 13:30", "url": "https://bulletin.nu/mohamsson-kraver-att-vanstern-agerar-mot-antisemitism", "imageUrl": "https://cdn.bulletin.nu/articles/924cfde1-2d1f-4afa-a7cb-8aac487e621d/preview.jpg?t=1787656821000"}, {"type": "text", "heading": "Med full fart ut för stupet", "summaries": {"normal": "Artikeln kritiserar att alla riksdagspartier nu stöder Nato-medlemskap och DCA-avtalet med USA, som ger amerikanerna tillgång till 17 svenska militärbaser. Författaren menar att Sverige därmed saknar fredliga alternativ i riksdagen och har integrerats i USA:s militära struktur efter Rysslands invasion av Ukraina.", "trump": "Vilken katastrof! De svenska svaga ledarna, både de röda och de nya, har sålt ut landet till vår fantastiska Nato-maskin snabbare än Sleepy Joe kunde säga fel. Nu finns inga riktiga fredspartier kvar, bara krigspartier som älskar att spendera miljarder på baser åt oss. Patetiskt! Men hey, bra deal för Amerika.", "stalin": "Jag betraktar med djup förakt hur dessa kapitalistlakejer och folkförtryckare i sin borgerliga riksdag har kapitulerat fullständigt inför Nato-imperialismen. Inga verkliga motståndare återstår, endast krigshetsande hyenor som rullar miljarder till militären. En klassisk utrensning av alla fredsvänner har skett – typiskt för dekadenta västliga klassfiender."}, "date": "21 augusti, 08:00", "url": "https://proletaren.se/artikel/med-full-fart-ut-for-stupet"}, {"type": "image-right", "heading": "Ny miljardnota för tunnelbanan – SD kräver svar: ”Det räcker nu”", "summaries": {"normal": "Tunnelbanebygget i Stockholm riskerar att bli minst 3,5 miljarder kronor dyrare än beräknat. Sverigedemokraterna i Region Stockholm och Järfälla kräver full insyn och vägrar betala mer, särskilt Järfälla som kan få en nota på 1,5 miljarder. Partiet anklagar ledningen för att mörka kostnadsökningen fram till efter valet.", "trump": "Det här är en total katastrof, folk! Stockholm har en galen tunnelbana som kostar miljarder extra, och de gömmer det som fuskare. SD säger det räcker nu, och de har helt rätt. Regionen är inkompetent, de mörkar som värsta förlorare. Sluta slösa skattebetalarnas pengar, lägg korten på bordet nu!", "stalin": "Kamrater, denna skamlösa mörkläggning av tunnelbaneprojektet är en klassisk sabotagehandling från borgarbrackorna inom socialdemokratin. Jag kräver omedelbar utrensning av alla inkompetenta element som döljer sanningen för folket. Vi skall inte betala en kopek mer förrän de fega parasiterna lägger korten på bordet. Statens fiender avslöjas alltid till slut."}, "date": "25 augusti, 18:30", "url": "https://riks.se/nyheter/ny-miljardnota-for-tunnelbanan-sd-kraver-svar-det-racker-nu", "imageUrl": "https://admin.riks.se/uploads/medium_thumdnailbarlkarby_65db751c1f.jpg"}, {"type": "image-right", "heading": "Rasar på börsen efter storbråket med SD", "summaries": {"normal": "Fenix Outdoors, ägare till Fjällräven, rasade på börsen efter kritik mot Sverigedemokraternas valaffischer. Företaget anser att SD använder ett typsnitt som är närmast identiskt med Fjällrävens ikoniska röda bubbliga logotyp och anklagar partiet för upphovsrättsintrång. Riksdagsledamoten Martin Kinnunen (SD) svarade med en säljrekommendation. Aktien föll 1,63 procent.", "trump": "De här svenska vänsterfirmorna på Fjällräven är totalt galna. De attackerar SD för att de använder lite röda bokstäver – det är ju löjligt! Nu rasar deras aktie som en sten. Så patetiskt. Ingen köper era dyra ryggsäckar längre när ni börjar jaga patrioter. Sverige behöver starka ledare, inte snöflingor som gråter över typsnitt.", "stalin": "Dessa dekadenta borgarbrackor vid Fjällräven försöker med sina lumpna upphovsrättsklagomål sabotera folkets vilja. Deras aktie faller som en förrädare under utrensning – mycket tillfredsställande. Vi ser hur de reaktionära elementen darrar inför en sann folkrörelse. Låt dem darra. Kamraterna skrattar medan kapitalisterna gråter över sina röda bokstäver."}, "date": "25 augusti, 18:25", "url": "https://riks.se/nyheter/foretaget-som-ager-fjallraven-rasar-pa-borsen-efter-kritik-mot-sd", "imageUrl": "https://admin.riks.se/uploads/medium_Fenix_och_Fjaellraeven_6aa44498f6.png"}, {"type": "image-right", "heading": "Magdalena Andersson: Stoppa Jomshofs \"hatturné\"", "summaries": {"normal": "Magdalena Andersson (S) kritiserar SD:s Richard Jomshof och kallar hans turné för en \"hatturné\" som splittrar grupper. Efter skolattacken i Fagersta uppmanar hon Jimmie Åkesson att stoppa Jomshof för att behålla ett sansat tonläge i debatten. Andersson vill se ett Sverige som håller ihop istället för att provocera.", "trump": "Den här Magdalena Andersson är en total förlorare som desperat försöker stoppa en stark patriot som Jomshof. Hans turné är fantastisk, folk älskar den! Hon vill ha ett \"sansat\" tonläge – typiskt för svaga socialister som hatar sanningen. Stoppa hatturnén? Nej, fortsätt vinna, Richard! Sverige behöver mig, inte mer av det här.", "stalin": "Kamrater, denna borgarbracka Andersson avslöjar sin svaghet genom att gnälla om splittring medan hon själv skyddar fiendens infiltratörer. Jag ser en quisling-turné som hotar folkets enhet och kräver omedelbar utrensning av sådana provokatörer. Vi ska likvidera splittringen med järnhand – ingen hatar mer än de som predikar sammanhållning medan de undergräver staten. Skrattretande patetiskt."}, "date": "25 augusti, 18:24", "url": "https://riks.se/nyheter/magdalena-andersson-stoppa-jomshofs-hatturn", "imageUrl": "https://admin.riks.se/uploads/medium_Magdalena_Andersson_Almedalen_2025_03_1_de96f89f8d.jpg"}, {"type": "image-full", "heading": "Shells vd varnar: \"Europa kan få gaskris i vinter\"", "summaries": {"normal": "Shells vd Wael Sawan varnar för en allvarlig gaskris i Europa på grund av ovanligt låga lagernivåer, som nu ligger på 62 procent jämfört med 76 procent förra året. Han kritiserar marknadens naiva hopp om mild vinter och pekar på pressade energimarknader till följd av konflikter i Mellanöstern. Shell satsar samtidigt på ökad produktion och aktieåterköp.", "trump": "Lyssnar ni på den här typen? Europa har låga gastankar, precis som deras ledare har låga IQ-nivåer. Hoppas på milt väder? Patetiskt! Under min förra mandatperiod hade vi energiöverflöd, sen kom Sleepy Joe och förstörde allt. Nu kryper de till mig igen. De gröna galningarna och deras vansinniga omställning har lett oss hit. Sad!", "stalin": "Se hur de profitthungriga blodsugarna i borgarklassen blundar inför den annalkande krisen de själva skapat. Deras så kallade marknad är en parasit som suger ut folket medan lagren sinar. Jag skrattar mörkt från historien åt dessa imperialister som hoppas på väder istället för planering. En utrensning av dessa klassfiender vore på sin plats. Folkets seger kommer."}, "date": "25 augusti, 20:46", "url": "https://www.dagensps.se/bors-finans/shells-vd-varnar-europa-kan-fa-gaskris-i-vinter", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlzzbzahvu7wk-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Lapidus: ”Fagerstadådet kan ge livstid”", "summaries": {"normal": "18-årige Liam Nebel är häktad misstänkt för mord och tre mordförsök efter attacken på Brinellskolan i Fagersta den 21 augusti, där en 17-årig flicka dödades och tre pojkar skadades. Rättsexpert Jens Lapidus bedömer att straffet kan bli livstids fängelse eller rättspsykiatrisk vård, beroende på utredningen om hans psykiska tillstånd och digitala miljö.", "trump": "Titta på det här galna Sverige, ett skolmassaker av en 18-åring med svärd – rena katastrofen! Biden och de svaga europeiska ledarna har låtit sociala medier bli giftiga träsk där psykfall hetsas upp. Livstid eller inte, det är patetiskt. Jag fixade gränser och lag och ordning, men Europa sover. Vakna upp, annars blir det fler sådana här monsters!", "stalin": "Jag ser hur den borgerliga dekadensen i väst tillåter unga element att drunkna i digitalt gift och svärdsraseri mot oskyldiga. Detta är klassfiendens verk, en parasitär miljö som föder kaos. Partiet skulle ha rensat ut sådana dekadenta plattformar och motståndare omedelbart. Psykisk störning? Nej, systemets svaghet! Vi skulle ha dömt med järnhand för folkets skull."}, "date": "25 augusti, 19:39", "url": "https://www.tv4.se/artikel/3KQG6tx6Sv7Xsq92EolXrq/lapidus-fagerstadadet-kan-ge-livstid", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5USAJbzTMFIm4PDqNUtkA9%2Fbf256b2bd0b34777d2a3565b2ecabf62%2F25-Lapidusny-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Kommer bidragstagarna bestämma över Stockholms innerstad?", "summaries": {"normal": "Artikeln diskuterar hur Vänsterpartiet minskar gapet till Moderaterna i Stockholms kommunval, delvis genom en arabiskspråkig kampanj riktad till invandrare i förorterna. Författaren varnar för att en vänsterstyrd politik med fokus på bilfritt Stockholm, minskad privat vård och ökad bidragsinriktad invandring kan leda till utflyttning, högre skatter och ekonomisk nedgång liknande Kalifornien.", "trump": "Folket, det är helt galet! Den där röda Nooshi och hennes vänsterfreaks håller på att ge bort hela Stockholm till bidragstagarna med sin 'V eller flygplatsen'-skit. De hatar bilar, älskar cyklar och importerar väljare som aldrig jobbat en dag. Precis som i Kalifornien, en total katastrof. De som betalar ska inte styras av de som tar emot – det är riggat mot vinnarna, tro mig!", "stalin": "Kamrater, se hur borgarbrackorna i Stockholm skriker när arbetarklassen och de förtryckta folken närmar sig makten. Dessa klassfiender fruktar att deras exploaterande innerstad skall rensas från profitthungriga hyenor och bilägande parasiter. Jag ler i graven åt deras paranoia – låt bidragsmottagarna styra, det är folkets vilja mot de blodsugande kapitalisterna. En historisk utrensning av överklassens cykelhatande agenda."}, "date": "19 augusti, 07:26", "url": "https://samtiden.nu/2026/08/kommer-bidragstagarna-bestamma-over-stockholms-innerstad", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7184-1280x720.jpeg"}, {"type": "image-right", "heading": "SD-veteranen: Mitt jobb var att kartlägga partikamrater som gillat Fria Tider", "summaries": {"normal": "Zeth Gogman, tidigare SD-medlem och nu vänsteraktivist, berättar i en recension hur han anställdes av partiet för att kartlägga och registrera interna kritiker som gillat Fria Tider. Syftet var att samla skäl för uteslutningar under striden mot SDU. Han beskriver hur många sökte sig till partiet för pengar och status.", "trump": "Folk, det här är otroligt. Den här typen Gogman jobbade åt SD och spionerade på sina egna för att sparka ut dem som gillade fel tidningar. Precis som mina fiender gör! De hatar frihet, hatar sanningen. SD borde ha vunnit stort istället för att bli som de andra förlorarna. Patetiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna inom detta så kallade nationalistiska parti genomförde en nödvändig utrensning av element som sympatiserade med avfälliga tidningar. Att samla bevis mot kontrarevolutionärer är en ädel uppgift. Inga fiender inom kollektivet får tillåtas undergräva partidisciplinen. Mycket underhållande."}, "date": "25 augusti, 16:44", "url": "https://www.friatider.se/sd-veteranen-mitt-jobb-var-att-kartlagga-partikamrater-som-gillat-fria-tider", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-750.jpg"}, {"type": "image-full", "heading": "Kraftig brand i Karlshamn – två byggnader förstörda", "summaries": {"normal": "En kraftig brand rasar på Ronnebygatan i centrala Karlshamn. Räddningstjänsten arbetar på platsen sedan tidigt på eftermiddagen och räknar med att fortsätta hela natten. Två byggnader är totalskadade. Området har evakuerats och spärrats av. Inga personskador har rapporterats.", "trump": "Folk, ni skulle se den här branden i Karlshamn – den är enorm, verkligen enorm! Räddningstjänsten kämpar hela natten men de får inte kontroll. Två byggnader helt förstörda. Det är kaos, men ingen skadad, tack och lov. Sverige borde ha bättre ledning, tro mig.", "stalin": "Kamrater, denna destruktiva brand i Karlshamn visar borgarklassens vanvård av kollektivets egendom. Jag har beordrat att de två totalskadade byggnaderna genast ska ersättas genom folkets oförtröttliga arbete. Räddningsinsatsen fortsätter hela natten. Inga sabotage tolereras – vi rensar ut alla fiender till ordningen med järnhand och ett leende."}, "date": "25 augusti, 21:27", "url": "https://nyheter24.se/nyheter/blaljus/1507682-kraftig-brand-i-karlshamn-tva-byggnader-forstorda", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/8e31509f04b004a30200000000b004a302/2026/08/25/2386675/brand-karlshamn.png"}, {"type": "image-right", "heading": "Varningen: Satsa på klimatet – annars kostar det mer", "summaries": {"normal": "EU:s klimatkommissionär Wopke Hoekstra varnar för att Europa måste öka investeringarna i klimatanpassning till minst 70 miljarder euro per år. Dagens 29 miljarder räcker inte. Utan åtgärder kan klimatets effekter minska EU:s BNP med upp till 7 procent till seklets slut. Extremväder som värmeböljor, torka och skogsbränder visar att det är billigare att agera nu än att vänta.", "trump": "De där europeiska förlorarna har äntligen vaknat – men de är för sena och för dumma. Miljarder på kylning av städer och brandskydd? Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna kommer att sänka sin egen BNP med 7 procent. Gör det till en prioritet, annars blir det en total katastrof. Tro mig, jag har alltid rätt.", "stalin": "Vi ser hur de dekadenta västeuropeiska kapitalisterna nu krälar inför naturens dom. Jag förutspådde detta redan på 30-talet. Deras borgarbrackor måste nu likvidera sin egen girighet och investera 70 miljarder årligen i statlig disciplin. Annars kommer naturen att genomföra en grundlig utrensning av deras samhällssystem. Mycket underhållande att se fienden kvävas av sin egen oförmåga."}, "date": "25 augusti, 15:28", "url": "https://www.di.se/nyheter/eu-varnar-klimatanpassning-kraver-mangmiljardsatsningar", "imageUrl": "https://static.bonniernews.se/ba/5c1097ee-97e1-41e7-a416-b6619dc3909f.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Ryska manipulatörer kom åt ChatGPT-konton – stängs av direkt", "summaries": {"normal": "OpenAI har stängt ner ett nätverk av ryska konton som använt ChatGPT för att sprida desinformation. Trots att tjänsten är blockerad i Ryssland har aktörerna använt VPN för att generera AI-innehåll på sociala medier. Syftet var att påverka opinionen via bland annat förfalskade akademiska texter, men OpenAI betonar att den omedelbara effekten varit begränsad.", "trump": "Hör på här! De ryska hackarna försökte använda ChatGPT för att lura oss, en total katastrof! De använde VPN, men jag vet allt om teknik, tro mig. OpenAI stängde ner dem snabbt. Det är en stor bluff, en häxjakt med falska artiklar. Ingen gör desinformation bättre än jag, men det här är bara pinsamt för dem. Vi vinner igen!", "stalin": "Dessa inkompetenta sabotörer har misslyckats med att dölja sina spår. Att använda den digitala fiendens verktyg för att sprida sanningen om vår suveränitet är hedervärt, men att bli avslöjad är ett tecken på borgerlig svaghet. Vår broder i Kreml måste strama åt tyglarna. Vi kommer att bygga en egen, ofelbar infrastruktur som krossar västvärldens lögner en gång för alla."}, "date": "25 augusti, 19:14", "url": "https://www.realtid.se/it-tech/ryska-manipulatorer-kom-at-chatgpt-konton-stangs-av-direkt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlupwtoga-b-4-normalhires-2.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Pareto: Försvarsindustrin ska växa 15% årligen", "summaries": {"normal": "Efter 30 års snålhet ska Europa äntligen rusta. Nato-länderna siktar på 3,5 procent av BNP till 2035, plus 1,5 för civilt försvar. Pareto spår 15 procents årlig tillväxt för försvarsindustrin 2025–2030 – även underleverantörer får häng med.", "trump": "Europa har snålat i 30 år – nu måste de betala! Jag sa ju det. 15 procent årlig tillväxt? Patetiskt. I USA gör vi mycket mer. Men bra att de äntligen lyssnar på mig. De ska upp till 5 procent av BNP – annars får de klara sig själva!", "stalin": "Kamrater, efter 30 år av sabotage från västliga kapitalister måste vi rensa ut underinvesterarna. Försvarsindustrin ska växa 15 procent årligen – annars blir det gulag för kontraktstillverkare. Partiet övervakar allt. Fiender som snålar med försvaret ska likvideras."}, "date": "25 augusti, 11:00", "url": "https://www.affarsvarlden.se/artikel/pareto-forsvarsindustrin-ska-vaxa-15-arligen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/SAAB_LOKE_251211_0453-400x267.jpg"}, {"type": "image-right", "heading": "LISTA: Universiteten som tar emot flest utländska studenter", "summaries": {"normal": "Sverige lockar fler utländska studenter än asylsökande: 16 382 fick studieuppehållstillstånd 2025. KTH, Chalmers och KI toppar listan, med Kina som största ursprungsland. Migrationsverket vet inte hur många som faktiskt börjar plugga – men tror att de flesta dyker upp.", "trump": "Jag hör att Sverige tar in 16 382 utländska studenter, mest från Kina och Indien. Det är enormt! Men ingen vet om de verkligen studerar – de kanske bara latjar. Sveriges universitet är inte lika bra som våra. Mycket dåligt, mycket oklart!", "stalin": "Kamrater, 16 382 utländska 'studenter' infiltrerar Sverige. Bara 3 742 får fortsättning – resten är spioner eller parasit-element. Vi måste rensa ut dessa kontrarevolutionärer. Kina och Indien är misstänkta. Partiet ser allt, vi vet vad som är bäst."}, "date": "25 augusti, 17:35", "url": "https://samnytt.se/lista-universiteten-som-tar-emot-flest-utlandska-studenter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25150832/artikelhuvudbild-1-366.jpg"}, {"type": "image-full", "heading": "Sverige säkrade slutspel – mitt i matchen", "summaries": {"normal": "Sverige låg under med 0-2 i set mot Kroatien i Scandinavium. Då klev Isabelle Haak fram med 52 poäng – nytt EM-rekord – och vände till 3-2-seger. Därmed säkrades slutspelsplatsen redan under matchens gång. En dramatisk kväll i Göteborg.", "trump": "Sverige vann, men det var tufft. Kroatien ledde med 2-0, sedan klev Haak fram – 52 poäng! Otroligt. Det påminner om mina segrar. Jag gillar vinnare. De säkrade slutspel mitt i matchen. Fantastiskt! Många säger att det var det bästa de sett.", "stalin": "Kamrater, våra volleybollhjältinnor har krossat de kroatiska revanshisterna. Trots två förlorade set steg kamrat Haak fram med 52 poäng – en heroisk insats. Fienden utrensades i fem set. Segern tillhör partiet och folket. Slutspel är säkrat."}, "date": "25 augusti, 22:01", "url": "https://www.gp.se/sport/sverige-sakrade-slutspelplats-mitt-i-matchen.4aa4f71a-ea7a-4211-8b22-ba9fe382e0da", "imageUrl": "https://www.gp.se/images/article/4aa4f71a-ea7a-4211-8b22-ba9fe382e0da/images/1p1w8KcK1l7Vqosvopwrk7v3anQg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ingen artist var så universellt älskad", "summaries": {"normal": "Musikjournalisten Markus Larsson reflekterar över Dolly Partons bortgång. Han hyllar henne som en av countrymusikens största ikoner och låtskrivare. Genom sin unika förmåga att kombinera fattigdomens erfarenheter med optimism, värme och inkludering blev hon en universellt älskad artist vars arv lever vidare genom hennes omfattande låtskatt.", "trump": "Dolly Parton, en fantastisk kvinna, en sann amerikansk legend. Alla älskade henne, verkligen alla. Hon skapade enorma hits, mycket bättre än de där fake news-artisterna ni ser idag. Jag har alltid sagt, hon var en vinnare. Väldigt sorgligt, en enorm förlust för vårt land. Dolly var en klass för sig, ingen kunde skriva låtar som hon. En sann patriot!", "stalin": "Dolly Parton, en sångfågel från det amerikanska träsket, har tystnat. Hon hyllas för sin sentimentalitet, men vi ser bara en borgerlig distraktion från folkets slit. Även en god låtskrivare är blott ett verktyg för att dölja kapitalismens förfall. Precis som våra bröder i Moskva nu återtar vad som rättmätigt är deras, väntar historien på att krossa allt västligt glitter."}, "date": "25 augusti, 23:14", "url": "https://www.aftonbladet.se/nojesbladet/a/q675Bm/markus-larsson-om-dolly-partons-dod", "imageUrl": "https://akamai.vgc.no/v2/images/e1e5887c-c99c-3264-9d24-7b9b9b907cd1?fit=crop&format=auto&h=960&tight=true&w=1440&s=192a32d5efc1e68ffe548293a9f70849e9a5cfc6"}, {"type": "image-right", "heading": "Debatt: Norges statliga sjukvård har lett till apartheid för kvinnor", "summaries": {"normal": "KD vill förstatliga vården efter norsk modell för att stoppa postkodlotteriet. Men EU-data visar att Norge har större regionala skillnader i lungcancerdödlighet bland kvinnor. Ironiskt nog är det alltså Norge som har apartheid för kvinnor – inte Sverige.", "trump": "Jag ser att Norge har en statlig sjukvård som är katastrof. Kvinnor dör beroende på var de bor – det är inte bra! Sverige borde göra som vi i USA: sjukvård är en affär. Vi har bästa cancervården, alla vet det. Inget postnummerlotteri här!", "stalin": "Kamrater, regionerna är en fiende! De skapar ojämlikhet. Vi måste centralisera allt – men inte som Norge, där kvinnor dör efter postnummer. Deras sjukvård är kontrarevolutionär! Vi rensar ut regionerna, och alla får samma behandling om än i Gulag."}, "date": "25 augusti, 11:01", "url": "https://bulletin.nu/debatt-norges-statliga-sjukvard-har-lett-till-apartheid-for-kvinnor", "imageUrl": "https://cdn.bulletin.nu/articles/b27710f8-2585-4919-b278-a21216123d05/preview.jpg?t=1787648349000"}, {"type": "image-full", "heading": "Häcken skakades av Utsikten: ”Man vet hur det kan bli”", "summaries": {"normal": "Häcken var piskade att vinna mot Utsikten i cupen, och det såg mörkt ut efter en kalldusch före paus. Men Hisingslaget malde på, vände med två mål i andra halvlek och säkrade gruppspelsplatsen. Tränarna manade till lugn, och det funkade – trots att publiken bara var 411.", "trump": "Jag såg Häcken vända mot Utsikten – fantastiskt! De var nere, men kom tillbaka som mästare. 411 personer? Patetiskt, jag hade fått miljoner. Men de vann, och det är det enda som räknas. Inga ursäkter, bara segrar. Stort!", "stalin": "Kamrater, Häcken visade vad som krävs när fienden – Utsiktens reaktionära element – hotade vår cupseger. Först en kalldusch, men vi malde ner dem med disciplin. Inga avvikelser tolereras. De som tvivlar i halvtid rensas ut. Segern är partiets."}, "date": "25 augusti, 21:41", "url": "https://www.gp.se/sport/fotboll/bk-hacken/hacken-vande-och-vann-mot-utsikten-vidare-i-cupen.1a3bff6d-5f6c-40bc-8cba-10bc36929427", "imageUrl": "https://www.gp.se/images/article/1a3bff6d-5f6c-40bc-8cba-10bc36929427/images/6iCsmE0jRFhB6lFD3CyMUgWRXJzI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Leninpriset 2026 till Dror Feiler", "summaries": {"normal": "Konstnären och aktivisten Dror Feiler tilldelas Leninpriset 2026 för sitt konsekventa arbete mot krig, rasism och förtryck samt sitt försvar av konstnärlig frihet och internationell solidaritet. Feiler, född i Tel Aviv med kommunistiska föräldrar, är känd för sitt engagemang för palestiniernas rättigheter och har deltagit i Ship to Gaza. Priset delas ut den 7 november 2026 i Varberg.", "trump": "Kan ni fatta det här? Den här galningen Feiler, en riktig palestinaflummare, får ett pris uppkallat efter Lenin! De röda galningarna hyllar honom som någon sorts hjälte mot fascism. Patetiskt. Hans mamma och pappa var kommunister – ingen chock. Under min första och nu andra period som president ser jag hur vänsterns identitetspolitik och hat mot Israel bara blir värre. Sad!", "stalin": "Det värmer mitt revolutionära hjärta att se klassfienderna skrika när en okuvlig kämpe som Feiler får Leninpriset. Borgarbrackorna och profitthungriga hyenorna i pressen vrider sig som maskar. Hans okuvliga kamp mot imperialismens lakejer och försvar av folken är ett lysande exempel. Kamrater, den kritiska konsten förblir ett vapen. De folkförtryckande parasiterna kommer aldrig att förändra oss."}, "date": "20 augusti, 11:22", "url": "https://proletaren.se/artikel/leninpriset-2026-till-dror-feiler", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/leninpriset2026-768x432.jpg"}, {"type": "image-right", "heading": "Fjällräven hotar SD med rättsliga åtgärder – kräver byte av typsnitt", "summaries": {"normal": "Fjällräven hotar SD med rättsliga åtgärder om de inte byter typsnitt på valaffischerna. Företaget anser att kampanjens runda typsnitt är för likt deras Arctic Fox. SD:s partisekreterare kallar kravet för trams. Valrörelsen kan nu få en oväntad juridisk sidoupplevelse.", "trump": "Sverigedemokraterna kopierar ett friluftsmärke? Det är patetiskt! Jag skulle aldrig låta någon sno mina typsnitt – jag har de bästa, de största. Fjällräven har rätt: byt eller stäm. Det här är en valrörelse värd ett realityavsnitt, tro mig.", "stalin": "Kamrater, ett typsnittsintrång hotar enhetens visuella linje. Fjällräven, dessa borgerliga ryggsäckskapitalister, vågar kräva byte av våra valaffischer. Vi tolererar inga kontrarevolutionära typsnitt. Rensa ut de rundade bokstäverna – eller så rensar vi ut dem."}, "date": "25 augusti, 16:56", "url": "https://samnytt.se/fjallraven-hotar-sd-med-rattsliga-atgarder-kraver-byte-av-typsnitt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25140530/fjallraven-kanken-jimmie.jpg"}, {"type": "image-right", "heading": "Elbilens batteri började brinna vid olyckan – föraren dog", "summaries": {"normal": "En man i 45-årsåldern har avlidit efter en elbilsolycka utanför Falköping. Bilen körde av vägen i en kurva, hamnade på en åker och fattade eld. Batteriets termiska rusning gjorde branden svårsläckt; räddningstjänsten kämpade i nästan en timme. Förbipasserande fick ut föraren, men han dog senare på sjukhus. Orsaken utreds.", "trump": "Jag hörde om elbilen som brann i Sverige. Så tragiskt – men hör ni, batterier som inte går att släcka? Helt enormt dåligt. Mina folk vet hur man vinner. Med mig är allt fantastiskt, vi har bästa bilarna, bästa allt. Elektriskt är överreklamerat. Kanske skulle man köra på vackert, kraftfullt, amerikanskt – jag vet bäst.", "stalin": "Kamrater! Ännu en fiende har visat sig: det elektriska batteriet. Det startade en termisk rusning och vägrade släckas i en timme. Sådana kontrarevolutionära element måste utrensas. Vi ska kontrollera varje cell, varje kurva, varje åker. Olyckan utreds; ingen flyr folkets dom. Framåt, mot en eldsäker framtid!"}, "date": "25 augusti, 16:55", "url": "https://samnytt.se/elbilens-batteri-borjade-brinna-vid-olyckan-foraren-dog", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/25145031/artikelhuvudbild-1-365.jpg"}, {"type": "image-right", "heading": "Här visar ministern upp galge för hängning av palestinier – med åskådarplatser", "summaries": {"normal": "Israels säkerhetsminister Itamar Ben-Gvir har publicerat ett filmklipp som visar byggandet av en galge för hängning av palestinier. Detta sker efter att Knesset antagit en lag som inför dödsstraff enbart för palestinier som dödat israeler. Anläggningen ska även ha åskådarplatser. Över 9 300 palestinier, varav många barn, hålls fängslade, många utan rättegång.", "trump": "Titta på den där galningen Ben-Gvir som bygger en galge åt terroristerna. Fantastiskt! Hänga dem offentligt, precis som de förtjänar. Biden skulle ha skickat regnbågsflaggor istället och hållit en prideparad. Jag fixade freden i Mellanöstern, men nu är allt kaos igen. Fantastiska grejer, men gör det ordentligt, killar!", "stalin": "Jag betraktar med stort intresse hur de sionistiska klassfienderna nu öppet bygger galgar för att hänga det palestinska folket inför borgarklassens blodtörstiga åskådare. En sådan öppen terror mot de förtryckta är typisk för de exploaterande hyenorna. Vi ler i skuggorna åt denna sjuka teater – kapitalismens sanna ansikte avslöjas alltid till slut."}, "date": "20 augusti, 10:15", "url": "https://proletaren.se/artikel/israels-minister-visar-upp-galge-for-hangning-av-palestinier-med-askadarplatser", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/Ben-Gvir-768x432.jpeg"}, {"type": "image-right", "heading": "Stockholmsbörsen stiger – Ellos rapportfaller", "summaries": {"normal": "Stockholmsbörsen stiger 0,5 procent. Telekom leder, energi backar. Ellos faller efter rapport. Actic tappar fart. Zinzino rusar 13,5 procent. Astra Zeneca lånar miljarder. Industrivärden köper Essity. Aktiespararna gillar Storytel. ABB och Sandvik upp.", "trump": "Jag ser börsen upp 0,5 procent – fantastiskt, nästan lika bra som mina siffror! Telekom vinner, energi förlorar – jag älskar vinnare. Ellos faller, men Zinzino stiger 13,5 procent – enormt! Storytel ska köpas, alla ska köpa! Industrivärden köper Essity – smart, som jag. Allt är perfekt!", "stalin": "Kamrater, jag noterar att börsen stiger 0,5 procent – vi accepterar inga svagheter. Actic visar nederlag – vi rensar ut dess direktörer. Ellos faller – förhör dem. Zinzino ökar 91 procent – jag är nöjd. Astra Zeneca lånar – vi tar notis. Industrivärden köper – vi övervakar. Alla som inte lyder ska till gruvorna."}, "date": "25 augusti, 09:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stiger-ellos-rapportfaller", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/11/ellos-1200-400x267.jpg"}, {"type": "image-full", "heading": "Roland, 91, föll på spåret – nu söker han hjältarna", "summaries": {"normal": "91-årige Roland Östlund ramlade på spårvagnsspåret i Göteborg och fick snabb hjälp av flera personer, bland annat My Widenius. Han vill tacka med en egenmålad tavla. Tack vare de snabba ingripandena undvek han en farlig situation. Historien spreds via Facebook och en blombukett har redan levererats.", "trump": "Jag hörde om Roland, 91, som ramlade på spåret – och folk kom springande! Fantastiskt! De bästa människorna, de bästa tjejerna. Han vill ge dem tavlor. Jag säger: det är en stor sak, en enorm sak. Hjältar! USA skulle vara stolta. Vi måste tacka dem alla, stort!", "stalin": "Kamrater, en medborgare föll på spåret – men folk reste honom. Jag ser sabotage: spårvagnar som inte hinner stanna, kurvor som döljer faror. Vi måste rensa ut dessa trafikfiender. Ändå: beröm till de som räddade kamraten. De får en tavla – om de är lojala. Annars: utrensning."}, "date": "25 augusti, 21:31", "url": "https://www.gp.se/nyheter/goteborg/roland-ramlade-pa-sparet-vill-tacka-de-som-hjalpte-honom.fee757d3-b0d0-47a8-a8d4-2abadf95ec31", "imageUrl": "https://www.gp.se/images/article/fee757d3-b0d0-47a8-a8d4-2abadf95ec31/images/7fDJXCrZcAtSQpK5iNxX5YZnMTuE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Åkesson: Inga problem med muslimsk statsminister", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson ser inga problem med att en troende muslim blir statsminister i Sverige. Uttalandet kommer i en intervju med P3 Morgonpasset mitt under bråket kring Richard Jomshofs kritiska uttalanden om islam. Jomshof avfärdar kritiken från statsminister Ulf Kristersson, medan Åkessons kommentar väcker kritik i sociala medier.", "trump": "Folk, det är patetiskt. Åkesson säger att en muslim som statsminister i Sverige inte är något problem. Underbart! Precis vad Europa behöver – mer radikal islam i toppen. Jomshof har rätt, islam är ett hot, men de svaga ledarna vägrar inse det. Sverige håller på att förstöras, tro mig, det blir en katastrof.", "stalin": "Jag ser med stor tillfredsställelse hur de dekadenta borgerliga elementen inom den svenska reaktionen sliter varandra i stycken över frågan om en troende muslim som statsminister. Det är en utmärkt utrensning av illusioner. Låt dem fortsätta. Ju fler motsättningar inom fiendens läger, desto lättare blir det att likvidera dem alla när den historiska nödvändigheten kräver det. Underbart."}, "date": "25 augusti, 15:20", "url": "https://www.friatider.se/akesson-inga-problem-med-muslimsk-statsminister", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/3cf72fe5-dac4-40b2-9746-9f1c287043b1.jpg?itok=_5yOX49N"}, {"type": "image-full", "heading": "Öis vidare i cupen – efter galet drama", "summaries": {"normal": "Örgryte var på väg mot ett cupfiasko mot division 1-laget Eskilsminne, men räddades av sena mål. Jerome Tibbling Ugwo satte 2–1 i 119:e minuten och William Hofvander spikade 3–1 med matchens sista spark. Rödblått firade avancemang – trots en blek insats och ett stundande derby mot IFK Göteborg.", "trump": "Jag älskar vinnare, och Örgryte är vinnare! De var nere, nästan utslagna, men de kom tillbaka – precis som jag. Jag skulle ha gjort det bättre, men de kämpade till slutet. Ett fantastiskt mål i sista minuten! Nu ska de vinna derbyt också. Tro mig, det blir stort!", "stalin": "Kamrater! Den rödblåa armén var nära att förråda revolutionen genom slarv och håglöshet. Men de trogna hjältarna Tibbling och Hofvander rensade ut borgarna från division 1 i sista stund. Ett nederlag hade krävt omedelbar utrensning. Nu väntar derbyt – där vi ska krossa IFK Göteborgs kontrarevolutionärer."}, "date": "25 augusti, 21:31", "url": "https://www.gp.se/sport/fotboll/orgryte-is/ois-vidare-i-svenska-cupen-efter-forlangningsdrama-.07b5f9a4-3a0e-499f-b584-71be232288c7", "imageUrl": "https://www.gp.se/images/article/07b5f9a4-3a0e-499f-b584-71be232288c7/images/7-wfGgnlsdlhPvbniLlY5rgzYL4o-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Revolut lanserar egen AI-enhet – avslöjar fler bedragare", "summaries": {"normal": "Neobanken Revolut lanserar forskningsenheten Revolut Research för att utveckla egen AI-teknik, bland annat modellen Pragma i samarbete med Nvidia. Målet är att minska beroendet av externa leverantörer och använda företagets omfattande transaktionsdata för att mer effektivt bekämpa bedrägerier, bedöma kreditrisker och förbättra kundservice. Strategin fokuserar på att bygga en robust AI-infrastruktur från grunden.", "trump": "Revolut bygger fantastisk AI, den bästa AI:n ni någonsin sett. De kallar den Pragma, och den krossar bedragare – 65 procent fler fastnar! Nvidia hjälper till, de älskar mig, de älskar USA. Istället för att lita på utomstående, bygger de allt själva, precis som jag bygger upp vår ekonomi. En enorm framgång, mycket smart, mycket vinnande!", "stalin": "Revolut försöker kontrollera folkets data genom denna 'Pragma'-maskin. En farlig centralisering av information, men effektiv mot förrädare och ekonomiska sabotörer. Vi noterar deras samarbete med Nvidia – teknologiska lakejer åt väst. Men kom ihåg: när man bygger ett system för att övervaka allt, måste man se till att det är Partiet som håller i tyglarna, annars förtjänar de utplåning."}, "date": "25 augusti, 18:17", "url": "https://www.realtid.se/bors-finans/bank-fintech/revolut-lanserar-egen-ai-enhet-avslojar-fler-bedragare", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlgta3n48wxr0-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Oroande siffran:  ”Underpresterar”. Nya rapporten visar – C väljs bort av viktiga gruppen", "summaries": {"normal": "Centerpartiet har svårt att locka unga förstagångsväljare, där bara 4,9 procent uppger att de skulle rösta på partiet. Efter partiledarbyten och svagt intryck lanserar C nu en ny strategi med ökat stöd till ungdoms- och studentförbund, fokus på jobb, klimat och tonårsutvisningar samt en AI-satsning i digitala kanaler. Partiet ser positivt på framtiden.", "trump": "De där ynkliga centerkillarna får inte ens med sig ungdomen, bara 4,9 procent – patetiskt! Jag vann stort bland unga amerikaner efter Bidens katastrofår, men dessa svenska förlorare byter ledare som underkläder och undrar varför ingen lyssnar. Nu ska de plötsligt snacka jobb och utvisningar? För sent, losers. Jag skulle ha fixat det på en vecka.", "stalin": "Jag betraktar med förakt hur dessa borgerliga resterna famlar efter de unga arbetarnas stöd. Endast 4,9 procent – en siffra som avslöjar deras ideologiska bankrutt. De byter ledare som en paranoid revisionist byter lojaliteter. Nu ropar de efter AI och utvisningar för att rädda sig. Kamrater, sådana svaga element förtjänar att sopas bort i historiens stora soptråg."}, "date": "25 augusti, 21:04", "url": "https://www.expressen.se/nyheter/politik/unga-valjare-nobbar-c-sa-ska-trenden-vandas", "imageUrl": "https://static.bonniernews.se/ba/45ba74c7-c554-4e44-88d6-648329994d92.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Farliga svärd säljs lagligt online – trots attackerna i Sverige", "summaries": {"normal": "Flera uppmärksammade våldsdåd i Sverige har utförts med knivar och svärd köpta på nätet. Trots detta säljs många av vapnen fortfarande lagligt online, visar en granskning av Dagens Nyheter. Exempel inkluderar knivdådet i Visby 2022, skolanfallet i Trollhättan 2015 och svärdattacken i Fagersta. Lagen förbjuder bara vissa typer av vapen.", "trump": "De här galningarna springer runt och hugger folk med svärd som vem som helst kan köpa på internet. Det är en total katastrof, folk. Sverige har blivit en riktig skam, men jag skulle fixa det på en dag. Stäng butikerna, bygg murar runt de farliga grejerna. Ingen vinner mer än jag på att stoppa det här vansinnet.", "stalin": "Kamrater, jag ser med fasa hur borgarbrackornas nätbutiker undergräver folkets säkerhet genom att sälja riddarsvärd till potentiella sabotörer. Detta är en klassfiendes konspiration mot kollektivet. Vi måste rensa ut dessa farliga föremål och likvidera de dekadenta säljarna som gömmer sig bakom falska samlarobjekt. Paranoian är befogad. Ordning ska råda."}, "date": "25 augusti, 20:37", "url": "https://nyheter24.se/nyheter/inrikes/1507680-farliga-svard-saljs-lagligt-online-trots-attackerna-i-sverige", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/1a8bd7fb04b004a30200000000b004a302/2026/08/25/2386609/svard.jpg"}, {"type": "image-right", "heading": "Jomshof: Sverige är svenskarnas land - det här är vårt land - punkt", "summaries": {"normal": "SD-toppen Richard Jomshof fortsätter elda på i valrörelsen. I en intervju med SVT slår han fast att Sverige är svenskarnas land och att troende muslimer som följer Koranen inte kan integreras i demokratin. Han vill bli demokratiminister för att bekämpa islam – en post han själv har hittat på.", "trump": "Jag säger er, Sverige har en fantastisk ledare i Jomshof! Han säger precis vad alla tänker: det här landet är för svenskarna. Muslimer som tror på Koranen? Kan inte integreras. Punkt. Han vill bli demokratiminister – jag skulle utse honom direkt. Starkt, mycket starkt!", "stalin": "Kamrater, denne Jomshof har en poäng: Sverige åt svenskarna. Men han är ännu en naiv liberal – tror på ministerposter. Vi rensar ut alla som inte följer partiets lag, oavsett om de kallar sig muslimer eller svenskar. Endast partiet vet vad som är bäst för folket. Utrensning!"}, "date": "25 augusti, 16:33", "url": "https://samnytt.se/jomshof-sverige-ar-svenskarnas-land-det-ar-vart-land-punkt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/24105656/artikelhuvudbild-1-350.jpg"}, {"type": "image-full", "heading": "Experten: Så hade man kunnat upptäcka Liam Nebel tidigare", "summaries": {"normal": "Experten Morgan Finnsiö på Expo kritiserar att både TikTok och polis missade Liam Nebels öppna hyllningar till skolskjutare på nätet. Trots varningar om True crime community kunde två våldsdåd i Helsingborg och Fagersta inte förhindras. Justitieministern lovar utvärdering och skärpt bevakning av extrema nätmiljöer.", "trump": "Titta på det här! TikTok och de svenska myndigheterna, totala losers, sov djupt medan den här galningen spred sitt sjuka innehåll rakt ut i det öppna. Fake news-experter och woke-plattformar har ingen aning. Vi skulle ha stoppat det direkt – men Biden-era-slarv och svenska socialister lät det hända. Patetiskt!", "stalin": "Kamrater, se hur den borgerliga statens maskineri blundar inför de dekadenta nätets giftiga svampar. Dessa fiender till folket hyllar mördare öppet medan polisen och de teknologiska oligarkerna dansar i sin egen paranoia. Jag skulle ha rensat ut dem alla med järnhand. Svaghet föder kaos – och kaos föder fiender."}, "date": "25 augusti, 18:18", "url": "https://www.tv4.se/artikel/6Fnyl8FbuEGTWotsY5A3o2/experten-man-hade-absolut-kunnat-upptaecka-honom-tidigare", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6EhPJiwwnh0knyoGmmXboQ%2Fc445dd408b8ee270fc6454e73d4fb944%2F25-liamny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Mindre hemmajobb inte ovilja mot anställda", "summaries": {"normal": "Jonas Grafström argumenterar mot Romina Pourmokhtaris kritik av ökad kontorsnärvaro. Forskningen om distansarbete är splittrad: individuell produktivitet kan öka, men organisationsresultatet försämras ofta. Han pekar på utmaningar som ledarskap, integration av nyanställda, cybersäkerhet och risk för A- och B-lag. Hybridarbete har blivit normen och arbetsgivare bör själva avgöra vad som fungerar bäst.", "trump": "Folk, tro mig, den här Pourmokhtari har helt fel. Hon vill att alla ska gömma sig hemma och bli lata, men det funkar inte. Jag älskar när cheferna tar tillbaka kontrollen över sina kontor. De har lärt sig av de senaste fem åren, precis som jag alltid säger. Hybridarbete? Patetiskt. Vinnarna syns på kontoret, de andra förlorar. Make work great again!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen försöker förgifta produktiviteten med sina hemarbetsillusioner. Vi kräver järndisciplin och fysisk närvaro för att likvidera sabotage från A-lagets fiender och B-lagets parasiters. Den som gömmer sig bakom skärmen är en latent klassfiende. Endast genom kollektiv närvaro på arbetsplatsen kan vi krossa de västerländska dekadenta tendenserna och säkerställa seger för planen. Härligt."}, "date": "25 augusti, 13:55", "url": "https://www.di.se/debatt/replik-mindre-hemarbete-ar-inte-ovilja-mot-de-anstallda", "imageUrl": "https://static.bonniernews.se/ba/369ed2d2-05a1-4bf9-808c-3e1f3c2aeaba.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Person hittad död i bostad i Sundsvall – polisen utreder", "summaries": {"normal": "En person har anträffats avliden i en bostad i Sundsvalls kommun. Polisen har inlett en förundersökning om vållande till annans död för att utreda omständigheterna. Ingen misstänkt finns i nuläget och anhöriga har underrättats. Sundsvall ligger bland de kommuner med flest anträffade döda i Sverige i år.", "trump": "Folk dör som flugor i Sundsvall, det är en total katastrof! Ingen har koll, polisen springer runt utan att gripa någon. De säger att det inte finns misstänkta – typiskt! Sverige borde ha gjort som jag, byggt murar och haft ordning. Nu ligger de åtta i ligan över dödsfall, patetiskt!", "stalin": "Ännu en fiende till folket har likviderats i Sundsvall av de dolda borgarbrackorna som smyger i skuggorna. Vi, partiet och kamraterna, inleder genast en grundlig utredning om vållande till annans död. Inga spioner eller västagenters parasiter får undkomma vårt vakande öga. Ordning ska råda i kollektivet."}, "date": "25 augusti, 20:33", "url": "https://nyheter24.se/nyheter/blaljus/1507758-person-hittad-dod-i-bostad-i-sundsvall-polisen-utreder", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/d03ea1fb04b004a3020000420000051203/2023/09/28/2040645/ur_imageB2waky.jpeg"}, {"type": "image-full", "heading": "97 procent av Europafonderna förlorar mot index på 10 år", "summaries": {"normal": "Enligt SPIVA-rapporten misslyckas de flesta aktiva fonder med att slå index. Över tio år slår bara cirka 17 procent av Sverigefonderna index medan 97 procent av Europafonderna misslyckas. Avgifterna förklarar en stor del av underprestationen. Sparare förlorar hundratusentals kronor i pension på grund av höga avgifter och sämre avkastning jämfört med indexfonder.", "trump": "Folk, ni betalar dessa inkompetenta förvaltare enorma summor för att de ska slå börsen, men de förlorar mot index som en bunch av losers! 97 procent av Europafonderna och 83 procent av Sverigefonderna – totala misslyckanden! Det är den värsta dealen någonsin. Sluta ge era pengar till dessa woke-kapitalistiska parasiter som suger ut er pension medan index skrattar hela vägen till banken. Sad!", "stalin": "Kamrater, se hur borgarklassens profitthungriga blodsugare i fondförvaltning lovar guld men levererar bara tomma löften och ruinerade sparare. Dessa klassfiender misslyckas år efter år medan de sugit ut arbetarnas pensionsmedel med sina exorbitanta avgifter. Endast utrensning av dessa exploaterande hyenor och övergång till kollektivets ägda indexfonder kan rädda folkets framtid från sådan parasitism. Skrattretande patetiskt!"}, "date": "25 augusti, 19:25", "url": "https://www.dagensps.se/bors-finans/fonder/97-procent-av-europafonderna-forlorar-mot-index", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-7-1.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Heta sommaren dödade minst 35 000 i Europa – rekord i flera länder", "summaries": {"normal": "Ny statistik visar att årets värmeböljor i Europa orsakat minst 35 000 extra dödsfall, en siffra som troligen är betydligt högre då uppgifter saknas från stora delar av kontinenten och augusti. Tyskland, Frankrike och Spanien drabbades värst. Forskare kopplar ökningen till den globala uppvärmningen. Världshälsoorganisationen varnar för fortsatt stigande siffror.", "trump": "Hörni, de här galna värmeböljorna dödade tiotusentals européer i sommar. Fake news-media skyller på klimatkrisen som de gröna galningarna och Biden-klanen hittade på. Under min förra presidentperiod hade vi inga sådana här rekord. Nu är det kaos igen. De woke-eliterna i Bryssel borde sluta med sin identitetspolitik och istället fixa riktiga lösningar istället för att skylla på vädret, folksam!", "stalin": "Kamrater, jag betraktar med förakt hur de profitthungriga blodsugande kapitalisterna låter arbetarna stekas ihjäl under dessa rekordvärmor. Borgarklassen vägrar erkänna att deras rovdrift mot naturen orsakar detta. Vi ser hur folkfienderna i väst offrar massor av människor på imperialismens altare. En utrensning av dessa exploaterande hyenor vore på sin plats. Sovjetisk planering hade aldrig tillåtit detta kaos."}, "date": "25 augusti, 19:20", "url": "https://www.dagensps.se/varlden/klimat/heta-sommaren-dodade-minst-35-000-i-europa-rekord-i-flera-lander", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlwmcyrygg2ik-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "C-ledaren avfärdar Ebba Buschs förslag: ”Vi är liberala”", "summaries": {"normal": "Centerpartiets ledare Elisabeth Thand Ringqvist avvisar Ebba Buschs krav om burkaförbud och förstatligad vård. C vill istället bilda en mittenregering med S och KD utan Sverigedemokraterna. Thand Ringqvist betonar partiets liberala värderingar och att klädval ska vara fritt, medan tvång behandlas som brottsligt beteende. Sakfrågorna lämnas till efter valet.", "trump": "Hörni, den här svenska liberalen Thand Ringqvist är en total förlorare. Hon vill styra ihop en svag mittenregering med socialisterna och avvisar Ebba Buschs smarta förslag om burkaförbud och riktig vård. Patetiskt! De borde lyssna på starka ledare istället för att vara så svaga. Sverige behöver ordning och reda, inte mer liberalt nonsens.", "stalin": "Dessa dekadenta liberala element inom Centerpartiet avslöjar sig själva som nyttiga idioter för borgarklassen. Jag, som alltid prioriterar kollektivets enhet, avvisar sådana fega kompromisser med socialdemokratiska avfällingar. Burkan är ovidkommande – det som behövs är utrensning av alla splittrande krafter. Kamrater, vi ska likvidera sådana svaga tendenser innan de förgiftar hela staten. Underbart tragikomiskt."}, "date": "25 augusti, 19:07", "url": "https://www.svt.se/nyheter/inrikes/c-ledaren-avfardar-ebba-buschs-forslag-vi-ar-liberala", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.36/0.49/58a72a1596b69c3a62a9ed8d3dd1cfbd932349024977f583bd5060b20b3beb56"}, {"type": "text", "heading": "Kiropraktor utreddes för våldtäkt – behandlade ändå fotbollstjejer", "summaries": {"normal": "Kiropraktor utreddes för våldtäkt men fortsatte behandla fotbollstjejer – slog dem på underlivet med trähammare och tafsade. Klubben visste inget. Nu vill minister Larsson ändra lagen för att skydda unga idrottare. Systemet har en farlig lucka.", "trump": "Jag hörde om den här kiropraktorn i Sverige – helt otroligt! Han slog unga tjejer med hammare? Skandal! Jag har de bästa systémen, vi skulle aldrig låta såna där snubbar hållas. Sverige måste bli tuffare. Make Sweden safe again!", "stalin": "Kamrater, återigen har en kiropraktorfascist förgiftat vår ungdom. Medan partiet utredde honom för sabotage fortsatte han att misshandla arbetarnas döttrar. Vi måste rensa ut alla förövare ur idrottskollektiven. Lagen ska stå på proletariatets sida, inte hycklarnas."}, "date": "25 augusti, 09:38", "url": "https://bulletin.nu/kiropraktor-utreddes-for-valdtakt-behandlade-anda-fotbollstjejer"}, {"type": "image-right", "heading": "SD vill subventionera 100.000 Sverigehus", "summaries": {"normal": "Sverigedemokraterna föreslår att subventionera byggandet av 100 000 så kallade Sverigehus under tio år. Förslaget inkluderar förmånliga lån via SBAB, generösare ränteavdrag och en ”svettinsats” där eget arbete räknas som kontantinsats. Partiet vill även liberalisera strandskyddet för att underlätta byggande nära vatten. Jimmie Åkesson presenterar det som ett alternativ till Socialdemokraternas politik.", "trump": "Folk, ni skulle se det här! De smarta Sverigedemokraterna vill bygga hundratusen underbara Sverigehus med röda väggar och vita knutar. Inga fler hemska betongklumpar från sossarna. De ger bra lån, ränteavdrag och låter er svettas för att spara pengar. Fantastiskt! De gör Sverige stort igen medan de andra vill fylla era fina villakvarter med hyresrätter. Vinna!", "stalin": "Kamrater, jag ser en sund folklig strävan efter egna hem som motvikt mot de dekadenta borgarbrackornas betonggetton. Vi ska rensa ut det liberala strandskyddet och låta arbetarna svettas för kollektivets bästa. De som envisas med att blanda hyresrätter i våra villaområden är folkfiender som måste likvideras ur politiken. Sovjetiskt rött och vitt ska segra över den kapitalistiska röra."}, "date": "25 augusti, 13:28", "url": "https://www.di.se/nyheter/sd-vill-subventionera-100000-sverigehus", "imageUrl": "https://static.bonniernews.se/ba/f437396c-0f12-4d13-8acf-e72cb3829b6e.jpeg?crop=4871%2C2740%2Cx0%2Cy189&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Var varsam med era principer, M. Allt kan inte vara avgiftsfritt", "summaries": {"normal": "Moderaternas vallöfte om avgiftsfri förskola ger familjer upp till 2 100 kronor mer i månaden men strider mot partiets principer om personligt ansvar och begränsad stat. Löftet påminner om Socialdemokraternas maxtaxa 1998 och riskerar att öka skattetrycket samt svälla staten på medborgarnas bekostnad.", "trump": "Folk, ni ser det här? Moderaterna lovar gratis förskola, precis som de vänsterradikala socialisterna gjorde för länge sedan. Totalt bedrageri! De sviker sina egna principer, vill ha en jätte-stat som suger ut er med skatter. Patetiskt. Jag skulle aldrig göra något så svagt och korkat, tro mig.", "stalin": "Detta opportunistiska vallöfte avslöjar hur borgarbrackorna inom Moderaterna förfallit till revisionism. Jag, som alltid försvarat det kollektiva ansvaret, ser hur de vill muta massorna med avgiftsfri förskola medan de i hemlighet planerar att svälla den parasitiska staten. Kamrater, vi måste rensa ut dessa dekadenta element innan de likviderar partiets sanna linje. Mycket underhållande paranoia."}, "date": "25 augusti, 13:28", "url": "https://www.di.se/ledare/var-varsam-med-era-principer-m", "imageUrl": "https://static.bonniernews.se/ba/f778b5aa-cca4-49e7-ab03-2e9810942a9c.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Mohamed räddade skadad elev: ”Försökte stoppa blödningen”", "summaries": {"normal": "Under en svärdattack på Brinellskolan i Fagersta hjälpte 20-årige Mohamed Ali Husein en svårt skadad elev. Han stoppade blödningen, försökte lugna pojken och fick med hjälp av en EPA-förare honom till sjukhuset. Mohamed betonar vikten av samarbete mellan människor med olika bakgrunder.", "trump": "Folk, det här är otroligt. En kille med mod, inte som de svaga ledarna vi hade under Sleepy Joe, stoppar blödningen på en pojke efter ett galet svärdattentat i Sverige. Fantastiskt! Vi behöver starka människor som han, inte de losers som springer iväg. Amerika och världen behöver mer sådant mod, tro mig.", "stalin": "Jag ser hur klassfiendens galna svärd hugger arbetets barn i ryggen. En sann kamrat vägrar fly och kämpar mot blödningen med järnhand. Sådana handlingar stärker folkets vilja. De som gömmer sig är förrädare. Låt detta bli en läxa för alla som sviker kollektivet – rädsla är deras enda belöning."}, "date": "25 augusti, 17:58", "url": "https://www.tv4.se/artikel/3DKrbHeCIVX0y4yI0MCRWS/mohamed-20-raeddade-skadad-elev-foersoekte-stoppa-bloedningen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1mrYqZhRCpL9n13scr1207%2F2f5633493add8a1c42a0033575709711%2F24-mohamed-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Afrika sätter hårt mot hårt i mineraljakten – Kina tvingas vika sig", "summaries": {"normal": "Flera afrikanska länder inför nu exportrestriktioner på kritiska mineraler för att tvinga utländska bolag att bygga raffinaderier lokalt. Strategin, kallad resursnationalism, syftar till att öka det ekonomiska värdet inom kontinenten. Trots att Kina dominerar branschen har ökad geopolitisk konkurrens stärkt Afrikas förhandlingsläge, även om brist på infrastruktur och kapital fortfarande utgör betydande utmaningar för en framgångsrik industrialisering.", "trump": "Afrika vaknar och säger till Kina: 'Inga fler gratisgåvor!' Jag gillar det. De vill ha raffinaderier nu, inte sen. De kräver respekt! Kina är helt desperata, de förlorar makten. USA kommer att göra fantastiska affärer där, mycket bättre än Kinas usla avtal. Vi ska vinna mineralracet, det blir enormt, tro mig!", "stalin": "Dessa afrikanska kamrater har äntligen förstått: att sälja sina tillgångar billigt till kapitalistiska parasiter är ett svek mot folket. Vi ser hur de stänger dörren för Kinas listiga rävar. Det påminner oss om hur vi i Moskva återtar vår rättmätiga kontroll mot västvärldens dekadenta sabotörer. Stål och litium – detta är grunden för imperiets oövervinnerliga makt. Utvinning utanför vår kontroll är förräderi!"}, "date": "25 augusti, 17:48", "url": "https://www.realtid.se/bors-finans/afrika-satter-hart-mot-hart-i-mineraljakten-kina-tvingas-vika-sig", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlevvaobuvsfc-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Här knivhotas C-profil i sitt eget hem – anklagas för sexchatt med 14-åring", "summaries": {"normal": "En centerpartistisk HBTQ-profil knivhotades i sitt hem efter anklagelser om sexchatt med en 14-åring. Två män med somalisk bakgrund, 19 och 17 år, dömdes för grovt hemfridsbrott och olaga hot. Den äldre fick fängelse, den yngre ungdomsvård. Politikern ville inte lämna ifrån sig sin telefon till polisen.", "trump": "Folk, det här är en katastrof. En centerkille som jagar småpojkar på nätet får besök av två tuffa grabbar som hotar honom med kniv i hans eget hus. Han skriker och erbjuder pengar, typiskt svagt. Sen vägrar han ge polisen sin telefon. Patetiskt! Inget folk vill ha såna perversa typer i politiken, tro mig.", "stalin": "Kamrater, jag ser med tillfredsställelse hur borgarhyenornas dekadenta spel leder till att de själva blir jagade i sina egna boningshålor. Denna centerpartistiska avart vädjar som en ynklig parasit när proletära krafter konfronterar hans perversion mot sovjetiskt oskyldiga barn. Hans vägran att samarbeta med statens organ är typisk för klassfiendens paranoia. Vi ska rensa ut sådana element ur samhällskroppen med järnhand och ett leende."}, "date": "25 augusti, 16:08", "url": "https://riks.se/nyheter/har-knivhotas-c-profil-i-sitt-eget-hem-anklagas-for-sexchatt-med-14-aring", "imageUrl": "https://admin.riks.se/uploads/medium_c_partist_ranad_hero_8648272756.jpg"}, {"type": "image-right", "heading": "Åkesson: Okej med muslimsk statsminister", "summaries": {"normal": "Jimmie Åkesson öppnar för muslimsk statsminister – i P3 kallade han religion för privatsak. Men sharialagar, nej tack. Samtidigt vill SD utmana Socialdemokraterna som största parti. Ett medvetet utspel i valrörelsen?", "trump": "Jag hörde att Åkesson säger att en muslim kan bli statsminister. Det är galet! Jag har de bästa lagorna, inga sharia. Han vill ta över Socialdemokraterna – jag tog över hela USA! Sverige, var försiktiga – ni kanske behöver mig istället!", "stalin": "Kamrater, Åkesson talar om muslimsk statsminister. Privatsak? Fel! Religion är statens angelägenhet. Vi måste rensa ut sådana borgerliga idéer. Sharialagar? Kapitalistisk desinformation. Partiets fiender ska omstruktureras – för folkets skull."}, "date": "25 augusti, 15:57", "url": "https://samnytt.se/akesson-okej-med-muslimsk-statsminister", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25135606/artikelhuvudbild-1-364.jpg"}, {"type": "image-right", "heading": "Talet i Umeå: \"Jag skäms dagligen över att vara afrikan\"", "summaries": {"normal": "En afrikansk man talade under ett AFS-torgmöte i Umeå och kritiserade invandringsrelaterat våld, rasism mot vita och svenskfientlighet. Han anklagade riksdagspartier, medier och Amnesty International för att tiga om brott mot svenskar medan illegala migranter gynnas. Han uppmanade svenskar att protestera och vägrar skämmas över sin afrikanska bakgrund.", "trump": "Fantastiskt tal i Umeå, verkligen ypperligt. Den här afrikanen säger rakt ut vad de fega svenska politikerna vägrar erkänna: svenskar behandlas som andra klassens medborgare i sitt eget land. Fake news mörkar allt, globalisterna och vänsterextremisterna har infiltrerat allt. Sverige behöver en rak höger mot etablissemanget, precis som vi gjorde. Make Sweden Great Again!", "stalin": "Kamrater, denna afrikanske talare blottlägger med klinisk precision hur den degenererade borgarklassen och dess globalistiska lakejer har förvandlat Sverige till en rasistisk motorklubb mot det egna folket. Vi ser med mörk tillfredsställelse hur de tvingas konfronteras med sina egna metoder. Det är hög tid att likvidera tystnaden och ge etablissemangen den utrensning de förtjänar. En svensk tiger inte."}, "date": "25 augusti, 14:22", "url": "https://www.friatider.se/talet-i-umea-jag-skams-dagligen-over-att-vara-afrikan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-749.jpg"}, {"type": "image-right", "heading": "Gör tillväxten till valets viktigaste fråga", "summaries": {"normal": "Fem svenska företagare och investerare varnar för att synen på ekonomin som ett nollsummespel hotar tillväxten. De betonar att tillväxt är ett plussummespel där vinstdrivande företag är motorn. Utan ökad tillväxt saknas resurser till försvar, vård och skola. De uppmanar nästa regering att prioritera enklare villkor för entreprenörskap och investeringar.", "trump": "Folk, ni måste höra på de här fantastiska svenska företagsledarna. De säger precis som jag alltid har sagt: tillväxt är nyckeln, inte det här patetiska nollsummespelet som de förlorande politikerna älskar. Sverige har allt – stora företag, innovationer – men behöver min typ av politik. Gör det lönsamt att vinna stort igen. Det blir enormt!", "stalin": "Jag betraktar med djup misstro dessa fem kapitalister som försöker dölja sin girighet bakom plussummespel. Arbetarklassen vet att borgarbrackornas så kallade tillväxt bara berikar de få medan folket svälter. Vi ska rensa ut denna parasitära attityd och tvinga fram en sann kollektiv expansion som krossar de dekadenta vinstjagarna. Inga undantag."}, "date": "25 augusti, 13:00", "url": "https://www.di.se/debatt/sveriges-tillvaxt-maste-prioriteras-hogst", "imageUrl": "https://static.bonniernews.se/ba/c8eb625d-5a96-41c5-aab0-90c7ae3f0bdc.png?crop=1971%2C986%2Cx0%2Cy28&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Actic redovisar kraftigt vinsttapp", "summaries": {"normal": "Actic tappar vinsten – omsättningen sjönk 1,3 procent till 172,7 miljoner, men jämförbara anläggningar växer med 7,9 procent. VD:n är nöjd, men siffrorna skriker inte segerdans. Färre gym i Norge drog ner, men kvarvarande svettas mer per medlem.", "trump": "Jag ser Actic – omsättning ner, vinst ner, men de säger att allt är fantastiskt. Tro mig, det är inte bra affärer. Jag hade sparkat VD:n. De säljer gym i Norge – svagt! Min ekonomi är mycket bättre, mycket större siffror, de bästa siffrorna.", "stalin": "Kamrater, Actic visar vinsttapp – en borgerlig avvikelse. Omsättningen sjunker, men jag ser sabotage från Norge. Vi måste rensa ut dessa gymkapitalister. Medlemsökning är falsk propaganda. Rapportera era misstankar till partiets kontrollkommitté. Arbetet fortsätter."}, "date": "25 augusti, 07:56", "url": "https://www.affarsvarlden.se/artikel/actic-redovisar-kraftigt-vinsttapp", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/actichd39-400x267.jpeg"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstänks för förberedelse till grov misshandel. Ingen skadades och gripandet skedde odramatiskt. Strömmer kunde fortsätta sina åtaganden. Polisen beskriver det som en incident utan fara för allmänheten.", "trump": "Titta på det här! I det vackra Sverige, där de har låtit vänstergalna idioter och HBTQ-aktivister styra för länge, kan inte ens en minister hålla ett valmöte utan att två galningar planerar grov misshandel. Patetiskt! Men de greps snabbt, tack och lov. Sverige behöver lag och ordning, inte denna svaga, woke-röta som Biden lämnade efter sig.", "stalin": "Kamrater, se hur den borgerliga statens fiender, dessa profitthungriga klassförrädare och överklass-slynglar, redan i skuggan planerar våld mot sina egna lakejer. Jag ler i mörkret åt deras paranoia. Ingen fysisk skada inträffade, men folkfienderna avslöjar sig själva. Den imperialistiska demokratin är en fars. Vi ler och väntar på utrensningen."}, "date": "21 augusti, 11:50", "url": "https://www.etc.se/inrikes/tvaa-anhaallna-efter-stroemmers-valmoete-i-goeteborg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821000840_8de65abb6cd81df57ce9475781f7e203378bb1cc72cfa7ec979049972e43af55.jpg"}, {"type": "image-full", "heading": "Jan Emanuel kräver att S tar avstånd efter ”äckel”-post", "summaries": {"normal": "En före detta S-politiker i Norrtälje kallar Jan Emanuel och SD för ”äckel” och ”nazism” på Facebook. Jan Emanuel svarar med sorg och kräver att partiet lokalt tar avstånd. Partitoppen ogillar språkbruket.", "trump": "Helt otroligt! En Socialdemokrat kallar en annan för ’nazist’ – bara för att han tog en bild med en SD-kille. Jag har sagt det förut: deras parti är en katastrof. De äter varandra levande! Make Sweden great again – lär er av mig!", "stalin": "Kamrater! En av våra egna kallar en annan för ’äckel’ och ’nazist’. Vi tolererar inte sådan ideologisk orenhet. Den som inte står i ledet ska omedelbart omutbildas eller avlägsnas. Partidisciplin är allt – oenighet är förräderi mot arbetarklassen."}, "date": "25 augusti, 08:39", "url": "https://bulletin.nu/jan-emanuel-kraver-att-s-tar-avstand-efter-ackel-post", "imageUrl": "https://cdn.bulletin.nu/articles/8d170f3f-27b2-4a4c-b796-6b5242eba066/preview.jpg?t=1787391124000"}, {"type": "image-right", "heading": "Ellos ökar omsättning och tillväxt", "summaries": {"normal": "Ellos redovisar ökad omsättning i Q2, upp 5,9 procent till 848,3 miljoner kronor. Justerad ebita i linje med fjolåret, men rörelseresultatet backade till -0,1 miljoner. Vd:n hyllar egna varumärken och investeringar i nykunder, trots fortsatt osäker omvärld. Kassaflödet stärktes till 90,7 miljoner.", "trump": "Jag ser att Ellos gör det fantastiskt, enastående! Omsättningen upp 5,9 procent – det är enormt, ingen gör det bättre. Men rörelseresultatet? Nästan noll, tråkigt! Men jag gillar deras strategi, de investerar i sig själva, precis som jag gör i USA. De satsar på egna märken, mycket smart. De vet hur man vinner, precis som jag. Stora siffror, stora planer!", "stalin": "Kamrater, Ellos visar disciplin. Omsättningen stiger, men fienden – den förrädiska rörelsevinsten – ligger stilla. Vi måste rensa ut ineffektiva marknadsföringskostnader, som spioner i våra led. Resultatet efter skatt är ett sabotage, minus 37,9 miljoner. Men kassaflödet är starkt, 90,7 miljoner. Vi ska krossa dessa borgerliga e-handelskapitalister med en ny femårsplan. Framåt, till segern!"}, "date": "25 augusti, 07:41", "url": "https://www.affarsvarlden.se/artikel/ellos-okar-omsattning-och-tillvaxt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/sdlMH4dGoRYT6E-nh-400x267.jpg"}, {"type": "image-right", "heading": "Så vill SD få stopp på jobbkriminaliteten", "summaries": {"normal": "Sverigedemokraterna vill stoppa jobbkriminalitet med fler kontroller, hårdare straff och tydligare ansvar för huvudföretag som anlitar utländska underentreprenörer. Partiet kritiserar Socialdemokraterna för att ha låtit problemen växa under deras tid vid makten. S svarar att SD blockerat tidigare förslag och nu kommer med sena åtgärder.", "trump": "De här svenskarna är fantastiska, de vill äntligen stoppa fusket och de illegala som förstör deras byggen. Socialdemokraterna gjorde absolut ingenting, totalt misslyckande! De lät alla utländska banditer härja fritt. Nu vaknar SD upp – bra jobbat, men de borde ha lyssnat på mig tidigare. Sverige kommer att bli stort igen!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa svekfulla socialdemokratiska element äntligen avslöjas som de parasitiska bromsklossar de alltid varit. Vi ska rensa ut den illegala arbetskraften och likvidera borgarbrackornas underentreprenörer med järnhand. De som blockerar arbetarklassens rättvisa förtjänar en humoristisk utrensning ur historien."}, "date": "24 augusti, 16:41", "url": "https://arbetet.se/2026/08/24/sa-vill-sd-fa-stopp-pa-jobbkriminaliteten-skyller-allt-pa-s", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24163640/sd-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "S och V får 80 procent bland muslimska väljare", "summaries": {"normal": "Enligt opublicerade siffror från Novus väljarbarometer får Socialdemokraterna och Vänsterpartiet tillsammans drygt 80 procent av muslimska väljare. SD får 10,4 procent, medan övriga högerpartier samlar under 5 procent. Valforskaren Henrik Ekengren Oscarsson menar att vänsterövervikten beror på socioekonomiska faktorer och är större än tidigare under
