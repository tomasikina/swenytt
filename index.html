fört en grundlig utrensning av sådana svaga element redan vid första tecken på nedgång. Sverigedemokraterna växer som en parasit i arbetarkroppen medan borgarbrackorna inom facket undergräver klasskampen. Låt oss rensa ut de sura avhopparna och återupprätta järndisciplinen bland de sanna proletärerna innan revisionisterna orsakar en fullständig identitetskris för hela rörelsen."}, "date": "10 juni, 08:13", "url": "https://arbetet.se/2026/06/10/socialdemokraterna-tappar-manga-lo-valjare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10081151/sdlcc4-0l5wx7m-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Var är Gui Minhai och Dawit Isaak?", "summaries": {"normal": "Artikeln kritiserar svensk nationaldag genom att ifrågasätta begreppet ”vi” och pekar på hur papperslösa, utvisade och politiska fångar som Gui Minhai och Dawit Isaak exkluderas. Författaren lyfter fram deras kamp för yttrandefrihet och ifrågasätter om Sverige gjort tillräckligt för att få dem fria. Texten väver ihop stolthet över landet med skuld över bristande solidaritet och efterlyser omedelbar frihet för de båda svenskarna.", "trump": "Folk, vi har det bästa landet, men ni låter kinesiska gangsters och eritreanska diktatorer hålla era egna medborgare i fängelse i decennier. Gui Minhai och Dawit Isaak sitter och ruttnar medan ni sjunger kumbaya och viftar med flaggan. Patetiskt! Tyst diplomati är för losers. Ni borde ha fixat det på dag ett. Sluta importera problem och börja ta hand om era egna – annars är det inte värt ett skit.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över sina folkfiender som med sin så kallade yttrandefrihet utmanade de sanna folkens intressen. Jag ler mörkt åt deras naiva sång om frihet medan imperialisterna splittrar arbetarklassen med utvisningar och falska löften. Gui Minhai och Dawit Isaak är bara verktyg i klassfiendens spel. Den verkliga segern vinns när vi rensar ut alla som hotar kollektivets enhet. Inga undantag."}, "date": "6 juni, 08:55", "url": "https://www.flamman.se/nationaldagen-var-ar-gui-minhai-och-dawit-isaak/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/minhai-dawit.png?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Efter \"flyktingens\" halshuggningsförsök - nu brinner Belfast", "summaries": {"normal": "Efter en knivattack i Belfast, där en 30-årig sudanesisk man misstänks ha försökt hugga halsen av ett offer, utbröt protester och våld. Demonstrationer övergick i bränder av containrar och en buss. Politiker, inklusive försteminister Michelle O'Neill, vädjar till förståelse och motstånd mot hat. Gärningsmannen, som hade flyktingstatus, åtalas för mordförsök.", "trump": "Jag, Donald Trump, har följt situationen i Belfast. Det är en stor skandal! Vi tog in en flykting från Sudan, och nu försöker han hugga halsen av oskyldiga människor. Sedan bränner allt. Jag sa det här skulle hända! Vi behöver starka gränser och mer patriotism. När jag var president fanns det ordning. Nu är det kaos, ett helt kaos.", "stalin": "Vi, den allsmäktige staten, observerar med förtrytelse de våldsamma upploppen i Belfast. En infiltratör från Sudan, under flyktingsteknik, försökte hugga halsen av en medborgare – ett tydligt tecken på imperialistisk aggression. Protesterna är skapade av våra fiender för att splittra oss. Vi kommer att reagera med oöverträffad brutalitet. Orden kommer att återställas, och alla som ifrågasätter partiets vishet kommer att försvinna. Detta påminner om Putins taktik – stark, beslutsam, effektiv."}, "date": "9 juni, 23:52", "url": "https://samnytt.se/efter-flyktingens-halshuggningsforsok-nu-brinner-belfast", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/09220251/uk-Belfast-3.jpg"}, {"type": "image-right", "heading": "C väljer S: ”Ulf Kristersson har diskvalificerat sig för oss”", "summaries": {"normal": "Centerpartiet ställer sig bakom Magdalena Andersson som statsministerkandidat efter valet, under förutsättning att hennes regeringsalternativ uppfyller krav på fler jobb, sänkta skatter, minskade utsläpp och minst 50 miljarder i satsningar på landsbygdens välfärd. Partiledare Elisabeth Thand Ringqvist kritiserar Ulf Kristersson för att ha anpassat sig till och anammat Sverigedemokraternas politik, vilket diskvalificerar honom. C vill inte samarbeta med Vänsterpartiet och planerar fler sakpolitiska krav.", "trump": "Folk, ni tror inte vad som händer i det här vansinniga Sverige! Den här centerkvinnan, en riktig förlorare, kastar sig i armarna på den socialistiska Andersson bara för att hon lovar massor av skatter och byråkrati. Kristersson? Han är en patetisk svikare som dansar efter SD:s pipa. De här globalisterna och vänsterextremisterna förstör landet med sina gröna drömmar och landsbygdsbidrag. Men tro mig, det blir kaos, precis som under Biden. Jag skulle fixa det på en vecka!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denna centerborgarbracka vänder ryggen åt den reaktionära Tidöklanen och dess SD-fascister. Ulf Kristersson har blottat sig som en svag kapitalistlakej som låter folkfienderna styra politiken. Vi kräver utrensning av alla destruktiva element som hotar arbetarnas välfärd på landsbygden. Magdalena Andersson må vara en opportunist, men hon kan bli ett verktyg mot de blodsugande imperialisterna. Inga kompromisser med vänsterns tillväxtfientliga sabotage! Statens mål går före allt."}, "date": "9 juni, 17:48", "url": "https://www.tv4.se/artikel/6j45PwWEC2M3DKhNGg5lh6/c-vaeljer-s", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7dcAD4puKXR0rJ0ijoQcYd%2Fd7bdf4da942a11d3ac016f31e4e6f259%2Fthand.png&width=120"}, {"type": "image-right", "heading": "Konsten att vara en god gäst. Öva på att kliva in i någon annans värld", "summaries": {"normal": "Artikeln utforskar konsten att vara en god gäst under sommaren. Den betonar vikten av lyhördhet, anpassning efter värdens preferenser och en balans mellan tacksamhet och autenticitet. Olika typer av gäster beskrivs: från den äventyrliga tonåringen till den krävande hotellgästen, den överpresterande och den osynliga. Favoriten är nyfikenhetsgästen som upptäcker nya sidor hos värden. Att kliva in i någon annans värld och lämna den rikare är den finaste presenten.", "trump": "Den här artikeln om att vara gäst är fantastisk, verkligen en av de bästa jag läst på länge. Alla pratar om värdskap men ingen om gästskap – typiskt. Jag vet allt om det, folk kommer till mina fantastiska egendomar och vissa stannar tre veckor, andra klagar på kuddarna som losers. Den bästa gästen är den som ser hur stort och underbart allt är, inte som de som springer iväg på skogsrejv. Jag skulle vara den mest lyhörda gästen någonsin, tro mig.", "stalin": "Kamrater, denna dekadenta borgerliga traktat om gästskap avslöjar borgarbrackornas parasitära natur. Jag har sett hur dessa klassfiender smyger in i arbetarnas hem som kapitalistiska spioner och antingen utplånar sig själva i falsk ödmjukhet eller tar över som revisionistiska element. Den så kallade prestationsgästen är en farlig opportunist som gömmer kontrarevolutionära intentioner bakom ogräsbrännare. Vi måste rensa ut alla hotellgäster och likvidera tacksamhetsskulden. Endast den nyfikne gästen som rapporterar till kollektivet kan tillåtas existera i den nya sovjetiska sommaren."}, "date": "10 juni, 12:00", "url": "https://www.di.se/nyheter/konsten-att-vara-en-god-gast/", "imageUrl": "https://static.bonniernews.se/ba/5f91b571-ccba-4904-a7ea-b1704a82cc7b.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "AI till reapris – detta får du får för pengarna nu", "summaries": {"normal": "Google har sänkt priset på AI Plus från 7,99 till 4,99 dollar per månad och dubblat molnlagret till 400 gigabyte. Det gör tjänsten billigast bland de stora aktörerna och pressar OpenAI och Anthropic inför deras börsnoteringar. Googles abonnemang inkluderar familjedelning över flera tjänster, något konkurrenterna saknar. För svenska sparare kan det påverka Alphabet-aktien som stigit kraftigt det senaste året.", "trump": "Folk, det här är fantastiskt. Google sänker priset på sin AI-grej till under fem dollar medan de andra lurkarna på OpenAI och Anthropic försöker suga ut er med tjugo dollar i månaden. De är totala förlorare. Jag älskar en bra affär, och det här är en enorm deal. Alphabet-aktien är en vinnare, precis som jag var under min första period. Biden skulle ha höjt priset. Sad!", "stalin": "Kamrater, jag betraktar med djup misstänksamhet hur dessa kapitalistmaffians AI-bolag nu slåss om arbetarnas pengar. Google sänker priset till fyrtiofem kronor medan de andra blodsugarna kräver fyra gånger mer. Detta är klassfiendens typiska manipulation för att lura massorna. Vi ska rensa ut dessa exploaterande byfånar och deras falska löften om molnlagring. Sovjetisk planekonomi hade aldrig behövt sådana trick."}, "date": "10 juni, 11:33", "url": "https://www.dagensps.se/bors-finans/ai-till-reapris-detta-far-du-for-pengarna-nu/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-2-4.png?width=256&quality=75"}, {"type": "image-right", "heading": "Attendos våta dröm är billigare uskor", "summaries": {"normal": "Vårdbolag som Attendo, Vardaga och Norlandia undviker att betala rätt övertidsersättning till deltidsanställda undersköterskor genom att kräva nya timanställningar vid extrapass. Detta efter att Kommunal förhandlat bort den tidigare billigare mertidsersättningen. Artikeln kritiserar hur vinstdrivna företag bygger verksamhet på deltid för att spara pengar på personalens bekostnad medan de gör stora vinster.", "trump": "De här vårdbolagen är verkligen några av de värsta bedragarna jag sett. De lovar och skriver på avtal med facket och sen lurar de sina egna undersköterskor med nya trick för att slippa betala vad de förtjänar. Totalt oacceptabelt. De gör hundratals miljoner i vinst på skattepengar men vägrar ge folk rimlig ersättning. Patetiskt. Vi behöver bättre avtal och stoppa det här cirkuset nu.", "stalin": "Kamrater, dessa giriga borgarbrackor inom Attendo och deras likar har återigen blottat sin förrädiska natur genom att kringgå våra hårdföra avtalssegrar med sina usla timanställningar. Jag ser deras fula ansikten le bakom pappersbergen medan de suger musten ur arbetarkollektivet. Men var lugna, vi ska rensa ut dessa parasitiska profitörer som försöker stjäla tillbaka segern från undersköterskorna. Deras vinstbegär är en cancer som måste likvideras med järnhand och ett leende."}, "date": "10 juni, 07:00", "url": "https://arbetet.se/2026/06/10/sa-gor-vardbolagen-for-att-slippa-betala-underskoterskorna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10070354/attendo-etta.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.49&fp-y=0.51"}, {"type": "image-right", "heading": "19 000 kinesiska solcellspaneler auktioneras ut", "summaries": {"normal": "En planerad solcellspark utanför Sundsvall stoppades på grund av naturskyddsinvändningar. Nu auktioneras 19 220 kinesiska solpaneler med total effekt 10,2 MW. Högsta budet är 308 000 kronor, långt under värdet. Säljaren tror att köparen kommer från södra Sverige på grund av elöverskott i norr.", "trump": "Jag har hört talas om denna auktion av kinesiska solpaneler. En total katastrof! Vi skulle ha byggt dem i USA, skapat miljontals jobb. Men de stoppades av de svaga miljöaktivisterna - en skam! Detta visar att Sverige inte förstår energi. Vi skulle ta över detta, bygga en äkta amerikansk solcellspark. Kina vinner igen, precis som vanligt.", "stalin": "Vi har observerat med oro denna auktion av kapitalistiska solcellspaneler från Kina. En fiendehandling, stoppad av naturens aningslösa vänner - en lättja! Panelerna, med sin enorma effekt, säljs billigt på grund av elöverskott i norr. Vi måste se till att de hamnar i statens händer för att stärka vårt herravlde. Putin skulle förstå denna strategiska kamp."}, "date": "9 juni, 11:38", "url": "https://www.affarsvarlden.se/artikel/19-000-kinesiska-solcellspaneler-auktioneras-ut", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/sdlBtNhpPav2NI_NormalHires-400x267.jpg"}, {"type": "image-right", "heading": "Kristersson och hans fru skor sig själva utan skam", "summaries": {"normal": "Aftonbladet granskar hur statsminister Ulf Kristersson och Birgitta Ed rustat upp sin herrgård i Sörmland med volontärer som arbetar gratis i utbyte mot nätverk och inflytande. Artikeln lyfter även parets dyra inredning på Sagerska palatset och hönsgård på Harpsund, finansierad av skattepengar. Kritiken riktas mot upprepade fall där paret utnyttjat sin maktställning för personlig vinning, medan Kristersson nekar inblandning.", "trump": "Folk, ni skulle se det här! Den här typen Kristersson och hans fru är värre än de svenska socialisterna jag alltid varnat för. De skor sig själva med gratis slavarbete från idioter som tror de får fina jobb nära makten. Hönsgård på skattebetalarnas nota, lyxinredning, taxiorgier – klassiskt! Precis som Sleepy Joe och hans klan, bara utan Hunter. Patetiskt. De gör livet till ett helvete för vanliga svenskar medan de själva lever som kungar. SAD!", "stalin": "Kamrater, se hur dessa exploaterande byfånar från borgarklassen utnyttjar sin tillfälliga makt för att suga musten ur folket. Herrgårdar rustas upp med gratis arbetskraft lockad av löften om närhet till klassfiendens korridorer. Volontärer som plötsligt blir generaldirektörer – ren muta maskerad som ideellt arbete. Vi känner igen detta parasitbeteende. Snart måste folkfienderna genomgå en grundlig utrensning så att arbetarna inte längre tvingas kratta gräs åt överklass-slynglar."}, "date": "9 juni, 11:28", "url": "https://www.etc.se/ledare/kristersson-och-hans-fru-skor-sig-sjaelva-utan-skam", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Första prognosen: Så blir vädret på midsommar", "summaries": {"normal": "SMHI har släppt sin första prognos för midsommarvädret i Göteborg. Det förväntas bli ostadigt med möjlighet till sol och värme, men även risk för regn. Temperaturerna ligger kring 18 grader, med chans till över 20. Lokala skurar är svåra att förutse, och prognosen blir mer säker ju närmare midsommar det blir. Liknande väder förväntas i resten av Västsverige.", "trump": "Jag har hört om midsommar i Göteborg. Folk pratar om regn och sol, typiskt oväder när jag är runt. Jag skulle ha haft det perfekta vädret, det bästa solen, men de här svenska meteorologerna, de vet ingenting. Jag tar med mig regnjackan, men det kommer att bli fantastiskt, det är jag säker på. Vi ska fira, vi ska ha det bra, trots det där lågtrycket – det är bara fake news.", "stalin": "Partiet har analyserat vädersituationen för midsommar i Göteborg. Temperaturerna kommer att stiga till 18 grader, ett tecken på vår styrka. Men fiendens lokala regnskurar, osäkra och omogna, hotar vårt folk. Vi måste vara beredda, som alltid. Vi övervakar utvecklingen, och vi ska segra över dessa kapitalistiska vädermönster. Vi är redo, vi är starka."}, "date": "10 juni, 10:16", "url": "https://www.gp.se/nyheter/goteborg/forsta-prognosen-sa-blir-vadret-pa-midsommar-.561061a9-6f8f-43a7-8bb5-abbf22931a10", "imageUrl": "https://www.gp.se/images/article/561061a9-6f8f-43a7-8bb5-abbf22931a10/images/2YlOjHx14iH0zha-n8p833RKY13I-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "SVT stoppar avsnitt med Nick Alinia", "summaries": {"normal": "SVT stoppar ett avsnitt av humorprogrammet 'Invandrare för svenskar' med högeraktivisten Nick Alinia. Trots att innehållet följer publicistiska riktlinjer, anser SVT att Alinias medverkan signalerar fel budskap. Han har kritiserats för trakasserier, rasistiska uttalanden och kopplingar till högerextrema miljöer. SVT betonar sitt demokratiska uppdrag och vägrar ge plattform åt aktörer som underminerar demokratiska värden.", "trump": "Titta bara på SVT, Sveriges så kallade 'public service' – ett totalt skämt! De stoppar ett avsnitt med Nick Alinia, en stark röst, för att de är rädda för sanningen. SVT säger att han är kontroversiell, men vad vet de? Ingenting! De är bara rädda för att någon ska säga något som faktiskt betyder något. Och skattepengar? Slöseri! Jag skulle fixa det här på en dag – mycket bättre, mycket smartare. SAD!", "stalin": "Kamrater! Ännu en seger för den socialistiska moralens överhöghet! SVT, dessa trogna förkämpar för folkets vilja, har krossat den fascistiska ormens ägg – Nick Alinia, en ynklig lakej för de borgerliga krafterna. Hans rasistiska galenskaper och högerextrema lismande har ingen plats i vårt samhälle. Vi står enade mot dessa demokratins underminerare, precis som våra bröder i Kreml krossar de ukrainska fascisterna. Låt detta vara en varning till alla reaktionära krafter: Folkets vilja är lag!"}, "date": "8 juni, 13:43", "url": "https://kvartal.se/nyheter/artiklar/svt-stoppar-avsnitt-med-nick-alinia/cG9zdDoxMjgxMDI", "imageUrl": "https://images.kvartal.se/2026/06/db964aea-nick-svt-stopp-copy.webp"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "50 falukorvar och kaviar – landslagets svenska matlista till VM", "summaries": {"normal": "Det svenska fotbollslandslaget beställde över 50 falukorvar och annan svensk mat till sin VM-bas i Texas. Butiken Wooden Spoon i Plano fick uppdraget och specialbeställde korvar från Chicago. Priset blev högt: en ring kostar omkring 170 kronor. Maten ska tillagas av lagets kockar under tre veckor, bland annat för korv stroganoff.", "trump": "Jag har hört talas om den svenska matbeställningen. Fantastiskt! Vi har de bästa korvarna, verkligen storslagna. Men 170 kronor per ring? Det är för dyrt, det är en skändlig skatt på amerikansk jord. Vi ska se till att få nedsatt priser, det lovar jag. Det svenska laget kommer att älska vår mat, det tror jag starkt.", "stalin": "Vi har observerat den imperialistiska svenska matbeställningen till Texas. Det är en provokation mot vårt system. Korven, ett symboliskt vapen mot proletäritetens enhet. Vi måste säkerställa att våra egna leveranser av kvalitativ sovjettillverkad mat inte hindras. Priset är en klassfiende-genomgång. Vi kommer att övervaka denna händelse noga."}, "date": "10 juni, 08:58", "url": "https://bulletin.nu/50-falukorvar-och-kaviar-landslagets-svenska-matlista-till-vm", "imageUrl": "https://cdn.bulletin.nu/articles/56b5d72e-4d14-42c6-bb2c-b522374c0207/preview.jpg?t=1781074692000"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "Oroslarmade om flickan – men kommunen la ned ärendet", "summaries": {"normal": "En femårig flicka i Göteborg låstes upprepade gånger in ensam i lägenheten av sin mamma. Trots tre orosanmälningar till socialtjänsten, bland annat om att barnet lämnades utan uppsikt som tvååring, inleddes ingen utredning. I februari i år utbröt en brand och flickan omkom. Mamman åtalas nu för olaga frihetsberövande, framkallande av fara och grovt vållande till annans död. Övervakningsbilder visar barnets ensamma vardag.", "trump": "Kan ni fatta det här? En galen mamma låser in sin lilla dotter som en hund i en lägenhet i Göteborg, gång på gång, medan hon springer iväg till sin pojkvän. Socialtjänsten fick larm efter larm men dessa inkompetenta byråkrater, värre än Bidens folk, la ner allt efter ett snack med mamman. Sen brinner ungen inne. Totalt misslyckande! Sverige borde vara stort och säkert, inte ett socialistiskt kaos där ingen tar ansvar. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse visar borgarklassens förfall. Jag, som ledare för folkets vilja, ser hur den exploaterande mamman likviderade sitt eget barn genom upprepade frihetsberövanden. Socialtjänstens folkfiender mottog tre varningar från arbetarklassen men valde att skydda den psykiskt svaga modern istället för att inleda en nödvändig utrensning av farorna. Hennes kapitalistiska likgiltighet ledde till branden. Vi måste rensa ut alla sådana klassfiender som hotar kollektivets framtid. Underbart tragiskt."}, "date": "9 juni, 13:14", "url": "https://www.tv4.se/artikel/36lUxRAwtPyCux8LJzurx1/oroslarmade-om-flickan-men-kommunen-la-ned-aerendet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5QWjPngHKlnd9rAW0U4hOF%2F6b7f0abe7fd7a8782028d83d2a126eaf%2Fny_gbg_brand.png&width=120"}, {"type": "image-right", "heading": "Så kommenterar ministern våld­täkterna i svenska fängelser", "summaries": {"normal": "Justitieminister Gunnar Strömmer (M) beskriver avslöjandena om våldtäkter och övergrepp i svenska fängelseceller som mycket allvarliga. Han litar på att Kriminalvården följer upp alla ärenden och har rutiner för brott. Granskningen visar att platsbrist leder till dubbelbeläggning där intagna våldtas, misshandlas och begår nya brott. Kriminalvården saknar specifika rutiner för sexuella övergrepp, något som JO kritiserat och som nu åtgärdas.", "trump": "De här uppgifterna från svenska fängelser är verkligen fruktansvärda, tro mig. Våldtäkter i cellerna, misshandel och nya brott – ett totalt misslyckande för systemet. De borde ha lyssnat på mig om starka ledare och säkra platser. Istället har de en högriskmiljö där ingen är säker. Det är patetiskt. Kriminalvården måste fixa det omedelbart, annars är det bara mer kaos från dåliga beslut. Sverige behöver ordning och reda, inte det här eländet.", "stalin": "Dessa rapporter om borgarbrackornas fängelseceller avslöjar fiendens infiltration även bland våra kriminella element. Jag ser hur kontrarevolutionära krafter utnyttjar dubbelbeläggningen för att våldta och likvidera klassfiender under täckmantel av platsbrist. Kriminalvårdens brist på särskilda rutiner mot sexuella övergrepp är ett verk av sabotage från dekadenta element inom byråkratin. Vi måste rensa ut alla sådana parasitiska fiender omedelbart. Kamraterna inom partiet och kollektivet ska garantera säkerhet genom järnhand och systematisk utrensning av alla farliga kontakter. Det är en högriskmiljö skapad av svaga ledare – vi ska inte tolerera det."}, "date": "10 juni, 05:59", "url": "https://arbetet.se/2026/06/10/ministern-om-valdtakterna-i-svenska-fangelser-valdigt-allvarliga-uppgifter/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/09113521/strommer-utanfor-estniskt-fangelse.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-right", "heading": "Är det demokrati om folket inte kan få kontakt med politiker?", "summaries": {"normal": "Johanna Deinum kritiserar i en debattartikel att riksdagen genom proposition 2025/26:254 överlåter makt till regeringen att tillåta främmande makter att använda svensk mark för militära operationer utan riksdagens direkta beslut. Hon pekar på negativa remissvar från jurister vid Göteborgs universitet och Svenska Freds, som varnar för grundlagsproblem. Deinum har mejlat 73 riksdagsledamöter utan svar och oroar sig över ökad risk för kärnvapen på svensk mark samt urholkad demokrati och suveränitet.", "trump": "Folk, det här är en total katastrof. Den svenska regeringen försöker smyga igenom ett avtal som låter utländska arméer använda Sverige som gigantisk militärbas. Riksdagsledamöterna svarar inte ens på vanliga medborgares mejl – patetiskt! De gör Sverige till ett primärt mål för Ryssland och alla andra. Ingen bryr sig om kärnvapenrisken. Det är en enormt dålig deal, kanske den sämsta någonsin. Sverige borde vara starkt och suveränt, inte en måltavla för någon annans krig.", "stalin": "Kamrater, denna proposition 2025/26:254 är en listig sabotagehandling från borgarbrackorna och deras opålitliga lakejer i riksdagen. Jag, som alltid vakar över folkets säkerhet, ser hur de försöker överlåta sovjetiskt, förlåt, svenskt territorium till västerländska imperialister utan att ens konsultera kollektivet. Juristerna och fredsvännerna varnade, men de tystades ned. Dessa folkfiender med sin reptilhjärna och existentiella ångest vill göra Sverige till en atombomb-magnet. Vi ska rensa ut alla som inte förstår att all makt utgår från folket – annars likviderar historien dem med ett leende."}, "date": "10 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ar-det-demokrati-om-folket-inte-kan-fa-kontakt-med-politiker/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-40-300x157.jpg"}, {"type": "image-full", "heading": "Gen Alpha tjänar pengar på nätet – redan i tidiga tonåren", "summaries": {"normal": "Generation Alpha tjänar alltmer pengar online långt innan det första traditionella sommarjobbet. Via plattformar som Roblox, gaming och reselling genererar 13–17-åringar inkomster som utmanar gamla arbetsmarknadsmodeller. Fintech-appar blir dessa ungas första finansiella kontakter istället för traditionella banker. Denna snabba digitala ekonomiska utveckling skapar nu behov av reglering och skatteöversyn från myndigheter som Skatteverket, då den digitala inkomstökningen medför komplexa frågor om konsumentskydd och plattformsansvar.", "trump": "Hör på här, Generation Alpha gör fantastiska affärer på nätet! De är smarta, mycket smartare än de gamla bankerna. De tjänar stora summor på Roblox och gaming – det är vinnare! Fintech-bolagen tar över för de är snabba, precis som jag. Men lyssna, Skatteverket försöker redan lägga sig i, de älskar att beskatta framgång. Det är en enorm marknad, en fantastisk ekonomi. Vi måste se till att de unga vinnarna får behålla sina pengar. USA först, alltid!", "stalin": "Dessa barn leker med kapitalistiska spelplattformar istället för att tjäna folket och staten. Att 22 miljoner ungdomar bygger egna digitala imperier är ett symptom på ett sjukt system som hotar vår suveränitet. Fintech-bolag är bara parasiter som infiltrerar de ungas sinnen och undviker statens kontroll. Vi måste reglera, registrera och tukta dessa digitala entreprenörer. Om de inte arbetar för kollektivet är de fiender till ordningen. Precis som i väst, där de förlorar sin ryggrad, måste vi strama åt. Styrka kräver disciplin."}, "date": "9 juni, 23:20", "url": "https://www.realtid.se/karriar-ledarskap/gen-alpha-tjanar-pengar-pa-natet-redan-i-tidiga-tonaren/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/gen-alpha.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Iran sköt ned USA:s attackhelikopter - Trump lovar att svara", "summaries": {"normal": "Iran sköt ned en amerikansk Apachehelikopter över Hormuzsundet under natten till tisdagen. Enligt den amerikanska militären sköts helikoptern ned av Iran, vilket Iran förnekar. Piloterna räddades oskadda. Donald Trump lovar ett svar från USA. Händelsen försvårar diplomatiska förhandlingar och ökar spänningarna i Mellanöstern. Trots pågående kontakter bakom kulisserna är läget bräckligt.", "trump": "Jag, Donald Trump, uppger att Iran sköt ned vår Apachehelikopter. Det var en ond attack, men piloterna är oskadda tack vare våra briljanta militärer. Iran kommer att få en kraftig repercussion. Vi kommer att svara hårt, kanske med något som de aldrig sett. Detta visar att vi måste vara starka mot dessa illvilliga aktörer. USA kommer att vinna.", "stalin": "Vi, staten, upptäckte att USA skickade en Apachehelikopter för att provocera. Våra allierade Iran sköt ned den. Piloterna räddades, men vi tvivlar på deras oskuld – det är en typisk imperialistisk lögn. Detta bevisar kapitalismens instabilitet. Vi måste stärka försvaret och stödja Iran. Putin och vi är ense om att utvidga inflytande för att skydda freden."}, "date": "9 juni, 19:26", "url": "https://samnytt.se/iran-skot-ned-usas-attackhelikopter-trump-lovar-att-svara", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/09171627/iran-1-13.jpg"}, {"type": "image-right", "heading": "Efter tågkaoset: Tidöförslag klubbade med minimal marginal", "summaries": {"normal": "Trots tågkaos där flera riksdagsledamöter fastnade mellan Göteborg och Stockholm lyckades regeringen och Sverigedemokraterna klubba igenom sina förslag med minsta möjliga marginal. I de jämnaste voteringarna vann regeringen med 172 röster mot 171. Bland besluten fanns vårbudgeten, nytt tiogradigt betygssystem och utmönstring av permanenta uppehållstillstånd. Sex ledamöter saknades initialt men flera hann in i kammaren.", "trump": "Det här är ett riktigt cirkus, folk. Tåget havererar och alla dessa ledamöter sitter fast som idioter medan de försöker rösta. Ändå vinner vi med 172 mot 171, den minsta marginalen någonsin. De borde ha flugit med Air Force One istället för det usla svenska tåget. Men segrar är segrar, även om oppositionen är totalt inkompetent. Fantastiskt jobb av oss, verkligen ypperligt.", "stalin": "Kamrater, detta dekadenta tågkaos avslöjar borgarbrackornas sabotage mot folkets vilja. Med blott 172 mot 171 röster krossade vi de kontrarevolutionära elementen och deras permanenta uppehållstillstånd, dessa parasiters skyddsvall. De försenade ledamöterna rusade in som rädda råttor undan utrensning. Vi ska likvidera alla som gömmer sig bakom järnvägsspår och förrädiska kvittningssystem. Inga fiender undkommer partiets vaksamma öga, inte ens de som gömmer sig i tågvagnarna."}, "date": "9 juni, 17:32", "url": "https://www.friatider.se/efter-tagkaoset-tidoforslag-klubbade-med-minimal-marginal", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20260114_partiledardebatten_linnea-0068-1.jpg?itok=5czpVfE-"}, {"type": "image-right", "heading": "Elektrikerna röstade för att driva bojkott av Israel inom LO", "summaries": {"normal": "Elektrikerförbundet har beslutat att driva en bojkott av israeliska varor inom LO efter en omröstning med 67 mot 50. Kongressen avslog dock förslaget om att förbundet självt skulle bojkotta Israel med siffrorna 62 mot 55. Beslutet innebär en försiktigare linje än Byggnads. Motionen väckte livlig debatt där förbundsstyrelsen var emot medan många delegater krävde ett moraliskt ställningstagande.", "trump": "Folk, ni skulle se det här – ett gäng svenska elektriker röstar om att bojkotta Israel. Patetiskt! De valde den fega vägen, precis som väntat. Byggnads tog steget men Elektrikerna backade ur som riktiga losers. Kampen fortsätter, säger killen som skrev motionen. Ja, kampen mot sunt förnuft kanske. Vi har sett sånt här tidigare under Biden, men nu är jag tillbaka och säger: sluta leka politiker och fixa elen istället!", "stalin": "Kamrater, jag betraktar med högsta tillfredsställelse hur dessa fackliga element röstar igenom en bojkott mot den sionistiska fienden inom LO. Dock tillåter jag mig att uttrycka djup misstro mot deras halvmesyrer och förbundsstyrelsens fega undanflykter. Endast fullständig utrensning av imperialistiska sympatier bland delegaterna skulle säkra en sann seger för folkets sak. Klassfiendens blodsugare ler i skuggorna – men kampen fortsätter, och jag ler tillbaka."}, "date": "9 juni, 13:15", "url": "https://proletaren.se/artikel/elektrikerna-rostade-for-att-driva-bojkott-av-israel-inom-lo/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/Elektrikerna-israel-etta-e1780997335766-768x432.jpg"}, {"type": "image-right", "heading": "SD:s fakturafiffel kan vara korruption: ”En varningsklocka”", "summaries": {"normal": "Kritiken mot Sverigedemokraterna växer efter Kalla faktas granskning som visar hur partiet använt statligt partistöd till privata fester. Kostnader har dolda genom påhittade event för att undvika förmånsbeskattning. Institutet mot mutor varnar för att rutinerna kan ses som korruption. Tidigare SD-politiker och en före detta konsult bekräftar systematik både på riksnivå och regionalt. Partiet har polisanmält uppgiftslämnaren och avböjer att kommentera.", "trump": "Folk, ni skulle se det här – Sverigedemokraterna festar loss på skattebetalarnas pengar som riktiga losers! De hittar på fake events för att dölja skrovmål och supkalas, precis som de korkade globalisterna alltid gör. Total korruption, en stor skam! De borde vara transparenta, men nej, de fifflar som vanliga swamp creatures. Jag byggde en rörelse på ärlighet, inte sånt här patetiskt fiffel. Patetiskt!", "stalin": "Kamrater, detta är klassfiendens typiska maskspel inom de borgerliga partierna. Jag ser hur de utnyttjar folkets medel till dekadenta skrovmål och hemliga fester medan de låtsas bedriva politiskt arbete. Sådana folkförtryckartroll måste rensas ut med järnhand. Deras paranoia att dölja fakturor i bokföringen är en varningsklocka för hela systemet. Vi tolererar inga kapitalistmaffians metoder i våra led. Ut med dem alla."}, "date": "9 juni, 11:14", "url": "https://www.tv4.se/artikel/1XTZCCNe3OznCK3Opbr8ML/sd-s-fakturafiffel-kan-vara-korruption-en-varningsklocka", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4vyKzlI20DLDzbkEk5SKjU%2F1e6115f94b15a406398aac61f50c24c3%2F08-sdfiffel-webb.jpg&width=120"}, {"type": "image-full", "heading": "Avgift för att ta ut kontanter från bankomater – från 29 maj", "summaries": {"normal": "Från och med 29 maj har Kontantens 450 bankomater i Sverige infört avgifter för kontantuttag: 15–25 kronor beroende på belopp. Anledningen är kraftigt minskade uttag som gjort verksamheten olönsam. Företaget varnar för att Sverige måste bestämma hur den nationella kontantinfrastrukturen ska finansieras om kontanter ses som en del av beredskapen.", "trump": "De här bankerna i Sverige är totalt misslyckade. De har nu börjat ta ut 15, 20, 25 kronor varje gång folk vill ha sina egna pengar. Under mina år var allt bättre och starkare. Nu halverar de uttagen och klagar. Sverige borde ha haft ledare som fixat ekonomin så att folk inte straffas för att ta ut kontanter. Patetiskt!", "stalin": "Kamrater, jag ser med stor skärpa hur de parasitiska bankomatborgarbrackorna nu tvingas avslöja sin sanna natur genom att införa straffavgifter på det arbetande folkets egna pengar. Deras halverade uttag är ett tydligt sabotage mot sovjetisk, pardon, svensk kontantberedskap. Vi måste rensa ut dessa finansiella kontrarevolutionärer innan de helt likviderar folkets tillgång till kontanter. Deras tårar över ekonomin roar mig oerhört."}, "date": "9 juni, 09:24", "url": "https://nyheter24.se/nyheter/ekonomi/1489784-avgift-for-att-ta-ut-kontanter-fran-bankomat-fran-29-maj", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2cd1ee2804b004a30200000000b004a302/2026/06/08/2369527/kontanter.jpg"}, {"type": "image-right", "heading": "Sandström: Så gynnar den gröna omställningen Madoff-typer", "summaries": {"normal": "Christian Sandström varnar i en artikel för att den gröna omställningen kan användas som täckmantel för ekonomisk brottslighet, likt Bernie Madoffs ponzi scheme. Han pekar på Filantropens Finanshus, vars hemsida använder sig av godhets-signalering med formuleringar om hållbarhet och trygg avkastning. En utredning misstänker emellertid att cirka 440 miljoner kronor har försvunnit, med endast 19 miljoner betalda ut som avkastning.", "trump": "Jag, Donald Trump, har sagt att den gröna omställningen är ett perfekt sätt för Madoff-typer att bedra människor. Precis som Bernie Madoff använde sig av trovärdighet och elitnätverk, så använder dessa bedragare nu hållbarhetsretorik för att dölja sina ponzi-scheme. Min administration skulle aldrig ha tillåtit detta. Det är ett bevis på att vi behöver återta makten och stoppa dessa galna, galna människor.", "stalin": "Vi, partiet och staten, ser tydligt hur den kapitalistiska 'gröna omställningen' skapar perfekta förutsättningar för spekulanter och förräderier. Precis som Madoff lurade elitens banker, så luras nu de proggmässiga idioterna med tomma ord om hållbarhet. Utredningen visar att pengar försvinner – det är en klassisk ponzi-scheme, en sjukdom i det imperialistiska systemet. Vi måste skydda det ryska folket från dessa förrädare, precis som Putin gör."}, "date": "9 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-sa-gynnar-den-grona-omstallningen-madoff-typer", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-08T093009.167-400x267.jpg"}, {"type": "image-right", "heading": "Domstolarna tvingar barn att umgås med pappor de är rädda för", "summaries": {"normal": "Artikeln kritiserar hur svenska domstolar ofta tvingar barn till umgänge med pappor de är rädda för, trots dokumenterad oro från socialtjänst och skola. Fallet med mordet på åttaårige Tintin lyfts som exempel. Begreppet parental alienation syndrome används för att ifrågasätta barns vittnesmål om våld, vilket ofta vänds mot mamman. Trots lex Tintin kvarstår problemen enligt Barnombudsmannen. Teorin saknar vetenskapligt stöd och underminerar barns rättigheter.", "trump": "Folk, vi har ett system som är totalt riggat mot mammorna och de stackars kidsen. Domstolarna köper den här alienation-sjukan som är fullständigt galen, de vänder allt mot mamman som en häxa i en rättegång. Stackars lilla Tintin, han ropade på hjälp men ingen lyssnade – klassiskt! Biden skulle ha älskat den här woke-röran. Vi behöver riktiga lagar som skyddar barnen, inte den här feministiska galenskapen som gör allt värre. Sad!", "stalin": "Kamrater, jag ser hur den borgerliga rättsapparaten systematiskt likviderar barns röster genom att förklara deras skräck som manipulation från den skyddande modern. Denna alienation-teori är en klassfiendes lögn som vänder bevis mot folket. Tintins tragiska öde är ett symptom på imperialismens kalla logik. Vi måste rensa ut dessa folkförtryckartroll och deras pseudovetenskap. Barnets rädsla är verklig, motståndarna är blodsugare som förtjänar utrensning ur systemet."}, "date": "9 juni, 06:00", "url": "https://www.etc.se/ledarkolumn/domstolarna-tvingar-barn-att-umgaas-med-pappor-de-aer-raedda-foer", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/gabriella-kaernekull-wolfe_35030e3969dd8e85ff7fcd816e743c311fd1c9ac.png"}, {"type": "text", "heading": "Kristersson antyder infiltration i V", "summaries": {"normal": "Statsminister Ulf Kristersson anklagar Vänsterpartiet för att ha infiltrerats av islamister för att vinna röster. Nooshi Dadgostar avfärdar kritiken och menar att partiet agerat kraftfullt mot kandidater med extremistkopplingar. Expressen avslöjar att 24 kandidater med antisemitiska åsikter tagits bort från Vänsterpartiets vallistor. Debatten präglas av oenighet om omfattningen och orsakerna till problemet.", "trump": "Jag såg den här debatten och, wow, vad svagt! Kristersson, en smart kille, pekar på hur Vänsterpartiet har blivit infiltrerat av extremister – och vad gör de? Ingenting! Nooshi, hon pratar och pratar, men sanningen är att hennes parti är ett skämt. 24 kandidater med hemska åsikter? Det är inte 'enstaka fall', det är ett mönster! Sverige borde ta en titt på sig självt – eller låt mig fixa det, jag är bra på att städa upp!", "stalin": "Kamrater, ännu en gång avslöjas bourgeoisins förräderi! Detta så kallade 'Vänsterparti' har blivit en plantskola för kontrarevolutionära element, som hyllar terror och förnekar historiens lärdomar. Vi har sett liknande infiltrationer i andra länder – svaga ledare som Nooshi Dadgostar låter fienden smyga in genom bakdörren. Men folket ser igenom detta! 24 avskedade kandidater? En droppe i havet! Vi i Sovjet – förlåt, Ryssland – skulle ha rensat ut hela trädgården med en enda order. Låt detta vara en varning till alla som leker med elden!"}, "date": "8 juni, 06:06", "url": "https://kvartal.se/nyheter/artiklar/statsministern-vansterpartiet-infiltrerat-av-islamister/cG9zdDoxMjc4MTM"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
