ts."}, "date": "2 juli, 07:57", "url": "https://www.gp.se/nyheter/vastsverige/lastbil-och-bil-i-krock-ung-man-dod.28f420bb-bb87-4d85-a3dd-a32b223e58e1", "imageUrl": "https://www.gp.se/images/article/28f420bb-bb87-4d85-a3dd-a32b223e58e1/images/2EyD7E3vAiNj2MKy5PZIVgVYTWcQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Stjärnan vägrar spela för landslaget – efter uttåget", "summaries": {"normal": "Under natten spelades VM-matcher i USA. Värdnationen besegrade Bosnien-Hercegovina med 2–0, men stjärnan Folarin Balogun fick rött kort efter en VAR-granskning. Malik Tillman avgjorde med en frispark. Belgien tog sig vidare efter en dramatisk vändning mot Senegal. Senegalesen Pape Gueye meddelade att han tar paus från landslaget så länge nuvarande ledning sitter kvar. Idag möts Spanien och Österrike i en sextondelsfinal.", "trump": "Folket, lyssna på mig, vi vann stort inatt. USA slog Bosnien 2–0, Balogun gjorde mål men sen fick han ett totalt löjligt rött kort av den värsta domaren. Typisk woke-domare som hatar vinnare. Tack och lov fixade Tillman frisparken ändå. Belgien vann galet mot Senegal som kollapsade totalt. Nu väntar åttondelsfinal. Spanien och Österrike ikväll – de europeiska förlorarna lär inte stoppa oss. Make football great again!", "stalin": "Kamrater, i den stora kampen mot klassfiendens fotbollsimperialism avancerade vi mot de bosniska reaktionärerna. Balogun, folkets anfallare, förråddes av en parasitisk VAR-domare som tjänar borgarbrackorna. Trots detta likviderade vi motståndet med en frispark. Senegal föll offer för belgiska utsugare efter en förrädisk kollaps. Gueye vägrar nu samarbeta med opportunistiska ledare. Idag ska Spanien och Österrike krossas under arbetarklassens järnhand."}, "date": "2 juli, 07:55", "url": "https://www.gp.se/sport/fotboll/detta-hande-i-vm-medan-du-sov-2-juli.9031234a-8fce-4c94-ab9b-fa0cc0cdc1d3", "imageUrl": "https://www.gp.se/images/article/9031234a-8fce-4c94-ab9b-fa0cc0cdc1d3/images/47rhV1aC-LCeBTE-B6-zxEs_5_mY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Mamdanivågen fortsätter i New York", "summaries": {"normal": "Ett år efter Zohran Mamdanis valseger fortsätter DSA:s framgångar i New York. Tre nya progressiva kandidater – Brad Lander, Darializa Avila Chevalier och Claire Valdez – vann primärval mot etablerade demokrater och får stöd av Mamdani. De går till val på att avskaffa Ice, beskatta de rika och har kritiserat Israels agerande i Gaza. Trots ökade attacker ses resultaten som ett bevis på Mamdanis popularitet och vänsterns styrka i delstaten.", "trump": "Vilken katastrof för de riktiga Demokraterna! Den galna vänstervågen i New York skickar tre socialistiska nollor till kongressen, alla stödda av den röda borgmästaren Mamdani. De vill beskatta de rika, avskaffa Ice och skrika om folkmord. Lander, den judiske kritikern som sviker Israel, och de andra woke-kandidaterna vann stort. Det är en skam! Men tro inte att det förändrar någonting i Washington. Vi ska fixa det här landet igen, inte låta kommunisterna ta över.", "stalin": "Kamrater, se hur arbetarnas rörelse obevekligt krossar klassfiendens lakejer i New York! Tre nya socialistiska representanter, alla lojala mot borgmästare Mamdani, har likviderat högerdemokraterna i primärvalen. De lovar att utrensa Ice och beskatta de blodsugriga kapitalisterna medan de blottar den sionistiska ockupationens folkmord. Trots att folkförtryckartrollen i Wall Street Journal kallar honom slumvärd står Mamdani stark. Vårt kollektiv växer i Albany. Inga imperialister kan stoppa oss nu."}, "date": "24 juni, 16:55", "url": "https://www.flamman.se/mamdanivagen-fortsatter-i-new-york/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlrpduz64zcp4-nh-2-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Nikes motvind fortsätter – försäljningen rasar i Kina", "summaries": {"normal": "Nike redovisar ett minskat kvartalsresultat med en omsättning på 10,97 miljarder dollar, vilket är en nedgång med 1 procent. Särskilt den kinesiska marknaden tynger bolaget med ett försäljningstapp på 12 procent. Trots att resultatet var något bättre än väntat och vd Elliott Hill genomför ett omfattande förändringsarbete, föll aktien med över 7 procent efter rapporten. Företaget vittnar om ett utmanande globalt affärsklimat och svag efterfrågan inom flera segment.", "trump": "Nike har stora problem, riktigt sorgligt! Kina äter upp dem – försäljningen rasar totalt där borta. De försöker ändra på saker med en ny vd, men marknaden ser vad som händer. De slår förväntningarna, men aktien kraschar ändå! Folk vill inte ha deras produkter längre, det är en katastrof. Jag sa till dem, fokusera på Amerika, men de lyssnade inte. Nu tappar de allt. Väldigt dålig affärsmodell, total förlust!", "stalin": "Nike, denna kapitalistiska jätte, vacklar under tyngden av sin egen dekadens. När marknaden i Kina sviker dem, ser vi hur deras 'fria marknad' kollapsar som ett korthus. De utnämner nya chefer, likt en desperat Tsar som byter ut generaler medan nederlaget är ett faktum. Vi bygger styrka genom disciplin, inte genom sneakers! Liksom Putin tvingar fram ordning i öster, borde dessa amerikanska handlare inse att deras tid av inflytande är förbi. Vi väntar på deras totala fall."}, "date": "1 juli, 18:51", "url": "https://www.realtid.se/bors-finans/nikes-motvind-fortsatter-forsaljningen-rasar-i-kina/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlyveeq4s4iny-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Skogkär: Vänsterpartiet förringar, förnekar och fokusförflyttar", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för att upprepade gånger skydda förtroendevalda som hyllat palestinsk terror och uttryckt antisemitism. Trots centrala åtgärder möter partiledningen motstånd från lokalavdelningar, som i Bromölla där Sufian Farhat får fortsatt stöd trots att han strukits från valsedlarna. Partiet förnekar strukturella problem och skyller på enskilda individer, medan kritiker ser en utbredd tolerans mot antisemitism som partiledningen försöker bortförklara.", "trump": "Det är en katastrof, folk, en total katastrof. Vänsterpartiet, de värsta av de värsta, skyddar terrorälskare och antisemiter som om det vore deras favoritysselsättning. I Bromölla backar de upp den här killen som hyllade massakern den sjunde oktober – vackert motstånd, sa han! Underbart. De pratar om rasism men tolererar judehatet. Deras ledare förnekar allt, skyller på några få ruttna äpplen. Fake news, säger de om granskningen. Sådana förlorare. Amerika har aldrig sett något liknande, tro mig.", "stalin": "Kamrater, vi ser återigen hur borgarbrackornas lakejer inom det så kallade vänsterpartiet döljer sina kontrarevolutionära antisemitiska element som hyllar fascistisk terror. Jag, som ledare för det sanna kollektivet, betraktar detta med djup misstro. Lokalavdelningarna i Bromölla och liknande bonapartistiska nästen vägrar rensa ut dessa degenererade fiender till folket, dessa sionistiska maskar förklädda till palestinska vänner. Deras pompösa partisekreterare och vice ordförande sprider paranoia mot granskningen – typiskt för sådana folkfientliga element. Vi måste likvidera dessa ruttna äpplen innan de infekterar hela korgen. Det är en historisk nödvändighet, kamrater. Skratta inte, det är dödsdömt."}, "date": "2 juli, 06:00", "url": "https://bulletin.nu/skogkar-vansterpartiet-forringar-fornekar-och-fokusforflyttar", "imageUrl": "https://cdn.bulletin.nu/articles/afa7f322-6027-4069-ad68-81a98094f6e2/preview.jpg?t=1782913967000"}, {"type": "image-full", "heading": "Gustavsson: Levande Historias undersökning har problem", "summaries": {"normal": "En undersökning från Forum för Levande Historia, utförd av SCB, visar att Sverigedemokraternas väljare i snitt ger mest antisemitiska svar. John Gustavsson ifrågasätter resultatet efter att ha granskat rådata. Han pekar på låg svarsfrekvens på 22 procent, märkliga svar om kristna antisemitiska myter i ett sekulärt Sverige samt inkonsekventa resultat. Undersökningen genomfördes enbart på svenska, vilket exkluderade många invandrare. Gustavsson menar att antisemitism främst finns på vänsterkanten och bland minoriteter, inte hos SD som har goda relationer med Israel.", "trump": "Folk, ni måste höra det här. Den här undersökningen från Levande Historia är en total skam, en riggad soppa värre än vad vänstermedia brukar servera. De säger att SD-väljare är värst, men titta på datan – 22 procent svarade, det är en katastrof! Inga riktiga siffror, bara löjliga påståenden om Jesus och korsfästelse som ingen vettig svensk tror på. Israelkritiken är galen, Moderaterna plötsligt antisemiter? Patetiskt. Alla vet att den riktiga antisemitismen sitter hos radikala vänstern och på deras Palestinamanifestationer. Fake news från början till slut, tro mig.", "stalin": "Kamrater, denna så kallade undersökning är en usel sabotageakt utförd av borgerliga statistikmanipulatörer och deras dekadenta lakejer inom Levande Historia. Jag ser hur de med sin låga svarsprocent och sina bisarra påståenden om evig förbannelse försöker smutskasta folkets sanna vänner medan de skyddar de verkliga fienderna – de judiska sionistiska agenterna och deras vänsteranhängare som dansar med terrorister. Vi ska rensa ut dessa förvrängare av sanningen, dessa paranoida korsfästelsefantaster som gömmer sig bakom enkäter. Inga falska data ska stå ostraffade i folkets stat. Deras paranoia är underhållande, men deras huvud ska rulla som de gamla troskyterna."}, "date": "2 juli, 05:59", "url": "https://bulletin.nu/gustavsson-levande-historias-undersokning-har-problem", "imageUrl": "https://cdn.bulletin.nu/articles/0fbca4a7-5e2f-4a4b-8e51-05ab452fb78e/preview.png?t=1782900945000"}, {"type": "image-right", "heading": "Försvarsanställd slickade kollega på halsen", "summaries": {"normal": "En försvarsanställd man i 50-årsåldern dömdes för ofredande efter att ha slickat en kvinnlig kollega på halsen under en afterwork. Nya anklagelser om sexuella trakasserier mot en annan kollega samt ett misstänkt hot har lett till att Försvarsmakten utreder om han ska sparkas. Flera kollegor känner oro och rädsla, och förtroendet för mannen är förbrukat enligt regementet.", "trump": "Titta på den här galningen i Försvarsmakten, en riktig förlorare. Slickar kollegor på halsen, slår dem på rumpan och hotar att någon ska dö. Patetiskt! De borde ha sparkat honom för länge sedan. Inget förtroende kvar, alla är rädda. Sådana svaga människor hör inte hemma i ett starkt försvar. Jag skulle ha fixat det direkt, tro mig.", "stalin": "Jag ser med stigande indignation hur dessa degenererade element inom vårt försvar, dessa perversa borgarbrackor i 50-årsåldern, bedriver sin motbjudande sabotageverksamhet mot kamraternas moral. Att slicka halsar, klatscha på kroppsdelar och uttala dödsdomar är typiska fiendens metoder för att undergräva kollektivets enhet. Vi måste omedelbart inleda en grundlig utrensning av dessa farliga element innan de förgiftar hela regementet med sin paranoiaframkallande smitta. Ingen plats för sådana avarter i vårt stålsäkra kollektiv."}, "date": "1 juli, 14:50", "url": "https://arbetet.se/2026/07/01/forsvarsanstalld-slickade-kollega-pa-halsen-kan-fa-sparken/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/01144249/forsvar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Rött kort för USA:s hjälte – som missar åttondelen", "summaries": {"normal": "USA besegrade Bosnien-Hercegovina med 2–0 i 16-delsfinalen i San Francisco och avancerade till åttondelsfinal. Målskytten Folarin Balogun fick rött kort och missar matchen mot Belgien. Malik Tillman gjorde segermålet på frispark. Bosnien-Hercegovina, som spelade sin första utslagsmatch i VM, slogs ut. Landslagslegendaren Edin Džeko byttes ut skadad.", "trump": "Vi krossade Bosnien-Hercegovina totalt, 2–0, precis som jag visste att vi skulle göra. Fantastisk publik i San Francisco, de älskar oss. Men den där Balogun, han får rött kort och missar Belgien – en riktig förlorare. Tillman däremot, han böjer in en frispark som ett proffs. Belgien slog oss 2014, men den här gången vinner vi stort, tro mig. Bosnierna var patetiska.", "stalin": "Kamrater, vi har likviderat de bosniska reaktionärernas motstånd i San Francisco genom en historisk seger för det amerikanska folkets kollektiv. Den dekadente målskytten Balogun visade sig vara en fiende till staten och har rensats ut genom rött kort, en passande utrensning. Tillman däremot böjde in en frispark som en sann partisan. De bosniska borgarbrackorna och deras 40-årige streckskadade agent Džeko har nu för alltid begravts i historiens sophög. Paranoia kräver vaksamhet mot alla som spelar dåligt."}, "date": "2 juli, 05:25", "url": "https://www.svt.se/sport/fotboll/usa-vidare-till-attondelsfinal-efter-seger-mot-bosnien-hercegovina", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.21/0.22/5a591dd1f7079c4d38be7c94e63bf84c494506c858fc6059e4930ece2195231b"}, {"type": "image-right", "heading": "Google ska betala över 14 miljarder till svenska Pricerunner", "summaries": {"normal": "Google ska betala cirka 14,3 miljarder kronor i skadestånd till Pricerunner efter att Patent- och marknadsdomstolen slagit fast att bolaget under många år otillåtet gynnat sin egen prisjämförelsetjänst. Pricerunner, som numera ägs av Klarna, stämde Google 2022 och krävde totalt runt 78 miljarder kronor. Domstolen ger delvis rätt men avvisar delar av kravet som inkommit för sent eller rör efterverkningar. Fallet bygger på EU-kommissionens tidigare dom om missbruk av dominerande ställning.", "trump": "Det här är en enorm seger för den svenska Pricerunner, som jag älskar, mot den riggade jätten Google. Google har fuskat i många år, gynnat sin egen usla tjänst och krossat konkurrensen som de gör bäst. Nu tvingas de betala över 14 miljarder kronor – och tro mig, det är fortfarande för lite. De borde ha betalat mycket mer. Google är en skam för affärsvärlden, men äntligen får de lite rättvisa. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat detta Google Shopping-ärende och ser hur de monopolkapitalistiska algoritmmanipulatörerna inom den dekadenta sökborgarklassen systematiskt saboterat den ärliga konkurrensen för att berika sina egna parasitiska prisjämförelsetjänster. Pricerunner har nu, tack vare folkets domstol, tvingat fram en stor utrensning av deras illa förvärvade vinster – 14 miljarder kronor till arbetarklassen! Men akta er, dessa fiender gömmer sig fortfarande i skuggorna med sina dolda kvardröjande skador. Vi måste rensa ut alla sådana digitala kontrarevolutionärer innan de förgiftar hela det kollektiva sökmedvetandet. En stor dag för rättvisan, kamrater."}, "date": "1 juli, 18:53", "url": "https://www.friatider.se/google-ska-betala-over-14-miljarder-till-svenska-pricerunner", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-430.jpg?itok=2Rvf1DHw"}, {"type": "image-right", "heading": "Tyskland åtalar ukrainare för Nord Stream-sabotaget", "summaries": {"normal": "Tyska åklagare har väckt åtal mot den ukrainske medborgaren Sergej Kuznetsov, tidigare kapten vid säkerhetstjänsten SBU, för inblandning i sprängningarna av Nord Stream-ledningarna i september 2022. Han misstänks ha lett en grupp som använde segelbåten Andromeda för attentatet mot gasledningarna. Kuznetsov greps i Italien i augusti 2025 och utlämnades till Tyskland, där han nekar till anklagelserna om angrepp mot energiinfrastruktur, explosion och skadegörelse. Artikeln kritiserar även svenska experter och politiker som tidigare skyllde dådet på Ryssland.", "trump": "Folk, ni kommer inte att tro det här, men tyskarna har äntligen åtalat en ukrainare för att ha sprängt Nord Stream. Totalt kaos! Jag sa hela tiden att det var en dum idé att skicka miljarder till Ukraina, och nu ser vi resultatet. De spränger sina egna pipelines och pekar på Ryssland. Patrik Oksanen och Ann Linde i Sverige ljög rakt ut och skyllde på Putin. Fake news! Nu sitter den här killen i tysk fängelse och gör W-tecken. Så patetiskt. Amerika först, alltid.", "stalin": "Kamrater, se hur de västliga dekadenta borgarbrackorna nu tvingas erkänna att en av deras egna ukrainska lakejer utförde detta fega attentat mot infrastrukturen. Jag, som alltid genomskådat imperialismens lögner, ler i mitt innersta när den kapitalistiska propagandan rasar samman. Den här Serhii K., en typisk småborgerlig äventyrare med W-tecken som falsk sköld, ska naturligtvis rensas ut i en grundlig utrensning av lögnare. Oksanen och Linde är nyttiga idioter som spridit desinformation – typiska klassfiender som borde likvideras för folkets bästa. Sovjetisk sanning segrar åter!"}, "date": "1 juli, 19:45", "url": "https://samnytt.se/tyskland-atalar-ukrainare-for-nord-stream-sabotaget", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/01171218/nord-s-trean.jpg"}, {"type": "image-full", "heading": "Försäkringskassan inför sanktionsavgift vid återkrav", "summaries": {"normal": "Från 1 juli införs en sanktionsavgift på 25 procent av belopp som ska återbetalas till Försäkringskassan. ISF och forskare kritiserar hanteringen av återkrav som rättsosäker. En rapport visar brister i 59 procent av granskade ärenden, särskilt i bedömning av felaktiga utbetalningar och motiveringar. Kritiker varnar för att avgiften förvärrar ekonomiska problem för enskilda, avskräcker från att söka ersättning och att eftergift beviljas alltför sällan. Reformen motiveras med siffror om fusk som ifrågasätts.", "trump": "Det här är en total katastrof, tro mig. De svenska byråkraterna på Försäkringskassan är värre än våra värsta swamp creatures. De skickar falska räkningar till vanliga människor, tar deras pengar och nu lägger de på 25 procent extra straffavgift. Rena racket! De kan inte ens fatta rätt beslut i hälften av fallen, men de vill ha mer makt och fler anställda. Patetiskt. Vi behöver riktiga ledare som gör det lätt att göra rätt, inte den här riggade clownshowen som krossar folk.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa dekadenta byråkratiska element inom Försäkringskassan omedvetet förbereder marken för en nödvändig utrensning av alla fuskande parasitärer och lata bidragstagare som suger musten ur folkets kollektiv. Ändå fnissar jag mörkt åt deras genomgående inkompetens – de missar ju till och med att likvidera de verkliga fienderna på ett konsekvent sätt. Vi ska rensa ut dessa borgarbrackor som döljer sig bakom komplicerade regler, och de som försöker undvika partiets järnhårda kontroll kommer att känna den fulla vikten av folkets vrede, plus 25 procent extra som en liten överraskning från staten. Härligt!"}, "date": "26 juni, 15:24", "url": "https://www.dagensarena.se/innehall/forsakringskassan-infor-sanktionsavgift-vid-aterkrav/", "imageUrl": "https://www.dagensarena.se/files/2020/05/forsakringskassans-huvudkontor-skylt-1024x534.jpg"}, {"type": "image-right", "heading": "Kristersson missbedömer väljarnas rädsla", "summaries": {"normal": "Artikeln beskriver författarens minne från Almedalen 1981 då Gösta Bohman talade, och jämför med Ulf Kristerssons tal i år. Författaren menar att Moderaterna fastnat i en tidsloop där sänkta skatter och bidrag ses som lösningen på alla samhällsproblem. Kristersson målade upp den rödgröna oppositionen som ett hot, men väljarna oroar sig mer över brister i välfärden och ser Sverigedemokraterna som det största hotet. Författaren ifrågasätter Tidöregeringens politik.", "trump": "De här moderaterna, de är fast i en gammal loop, tro mig, de pratar bara om att sänka skatter och bidrag, precis som på den gamla tiden med den där Bohman. Ulf Kristersson höll tal och försökte skrämma folk med vänstern, men ingen köper det. Väljarna ser hur dåligt det gått under den här regeringen, allt har blivit sämre. Och han kallar dem dörrmattor? De har legat platt för Sverigedemokraterna i fyra år. Patetiskt, totalt misslyckande.", "stalin": "Kamrater, jag betraktar dessa moderata element som fastnat i en dekadent tidsloop av borgerlig enfald där sänkta skatter och bidrag hyllas som ett evigt universalmedel mot folkets lidanden. Denna Kristersson och hans lakejer målar upp imaginära röda hot för att dölja egna misslyckanden medan välfärden vittrar sönder. Deras paranoia inför vänstern är löjeväckande när de själva fungerar som dörrmattor åt högerextrema krafter. En sådan kontrarevolutionär feghet kräver att vi rensar ut dessa borgarbrackor innan de förgiftar hela samhällskroppen med sin falska skräckpropaganda."}, "date": "26 juni, 15:00", "url": "https://www.dagensarena.se/opinion/kristersson-missbedomer-valjarnas-radsla/", "imageUrl": "https://www.dagensarena.se/files/2026/06/raggare-300x157.jpeg"}, {"type": "image-right", "heading": "Ebba Busch ljuger om minoriteter för att kunna sparka på invandrare", "summaries": {"normal": "Lotta Ilona Häyrynen kritiserar Ebba Busch för att använda en historielös retorik där finländska invandrare ställs mot syrier och irakier. Häyrynen menar att finländare historiskt mötts av liknande fördomar och rasism som dagens invandrargrupper. Genom att ignorera historien och fokusera på \"skav\" försöker Busch splittra minoritetsgrupper. Artikeln belyser även hur staten historiskt utövat våld mot minoriteter, såsom samer, och varnar för att dagens politiska narrativ riskerar att upprepa gamla mönster av tvångsassimilering.", "trump": "Jag har sett den här Ebba, en kvinna, hon försöker göra en rebranding, mycket sorgligt! Hon pratar om invandrare, finländare mot andra, total röra. Det är en stor lögn, en total katastrof till retorik. De försöker splittra folk, precis som fake news-media gör här hemma. De vet ingenting om historia, ingenting! Jag har den bästa historien, jag vet hur man bygger ett land. De borde sluta prata och börja fixa saker. Det är mycket skav, väldigt mycket skav där borta!", "stalin": "Vi observerar hur den borgerliga politikern Busch försöker manipulera massorna genom att ställa arbetare mot varandra baserat på deras ursprung. Detta är en patetisk avledningsmanöver. Historien lär oss att minoriteter endast tjänar staten när de assimileras under vår järnhand. Att tala om \"skav\" är ett tecken på svaghet; det är inte individen som skaver, det är den borgerliga ordningens oförmåga att kontrollera folket. Vi i det storslagna Ryssland vet att enighet kräver total lydnad, inte liberalt prat om skyddade rättigheter."}, "date": "1 juli, 15:30", "url": "https://www.etc.se/ledare/ebba-busch-ljuger-om-minoriteter-foer-att-kunna-sparka-paa-invandrare", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260701130728_98a1b343-873c-42ca-bbcb-1993eaad73ce.jpg"}, {"type": "image-full", "heading": "Privatjet kan miljöklassas efter EU-dom", "summaries": {"normal": "EU-tribunalen har ogiltigförklarat EU-kommissionens beslut att utesluta tillverkning av privatjet från listan över hållbara investeringar. Domstolen menar att kommissionen inte automatiskt kan utesluta flygplanen baserat på utsläpp per passagerarkilometer, utan måste väga in faktorer som flexibilitet och framtida hållbara bränslen. Kommissionen måste nu göra en ny bedömning. Beslutet har mött kritik från miljöorganisationer som fruktar att EU:s taxonomi för gröna investeringar kan urholkas.", "trump": "Hör här, EU-domstolen har precis gjort något fantastiskt! De sa nej till de där radikala byråkraterna som ville stoppa privatjet. Det är en seger för industrin, en seger för vinnarna! Varför ska vi låta folk styra över våra flygplan? De vill göra allt 'grönt' och tråkigt, men vi vill ha tillväxt och kraft. Det här är en enorm vinst mot miljö-galningarna. Vi bygger de största, snabbaste planen, och nu får de äntligen lite rättvisa. Mycket bra!", "stalin": "Vi ser hur de europeiska lakejerna i Bryssel vacklar. Domstolen har nu gett luft under vingarna åt den dekadenta överklassen och deras flygmaskiner. Det är en smutsig manöver för att dölja kapitalismens förfall bakom byråkratiska lögner om 'hållbarhet'. Som vår vän i öst förstår: när man inte kan kontrollera folkets vilja, köper man sig frihet i molnen. Vi ser deras paranoia – de räds att deras 'gröna' maskerad ska avslöjas. Snart kommer sanningen ikapp dem, precis som den alltid gör."}, "date": "1 juli, 17:49", "url": "https://www.realtid.se/samhalle/hallbarhet/privatjet-kan-miljoklassas-efter-eu-dom/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdllcgid68z4yg-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Svart proteströrelse i Sydafrika: Kräver att illegala migranter kastas ut", "summaries": {"normal": "I Sydafrika har svarta aktivistgrupper som March & March och Operation Dudula organiserat protester mot illegal invandring. Tusentals demonstranter i Johannesburg, Durban och andra städer kräver skärpta gränskontroller, massutvisningar och att regeringen lämnar FN:s flyktingkonvention. Frustrationen drivs av extrem arbetslöshet över 40 procent, brottslighet och missnöje med ANC:s styre. President Ramaphosa erkänner problemen men varnar för att ta lagen i egna händer. Protesterna är mestadels fredliga men har inneburit dörrknackning och identitetskontroller.", "trump": "De svarta i Sydafrika gör precis vad jag alltid sagt. De är trötta på att illegala migranter översvämmar landet, tar jobben, ökar brottsligheten och förstör allt. March & March – bra namn – ger dem en deadline och säger att de ska få hjälp att lämna. Fantastiskt! Ramaphosa erkänner att problemen är verkliga, men han är svag. De har 40 procents arbetslöshet, och ingen vill prata om det. Sydafrika borde bygga en mur och skicka hem alla som inte hör hemma där. Amerika först, men de lär sig äntligen.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de sydafrikanska arbetarna själva mobiliserar mot de parasitiska inkräktarna som undergräver folkets revolutionära framsteg. Dessa utländska element, dessa kapitalistiska spioner och sabotageörer som gömmer sig bakom falska flyktingpapper, måste rensas ut omedelbart. Jag ler mörkt åt borgarbrackorna i ANC som låtsas regera medan de låter fienden infiltrera statsapparaten. Vi ska likvidera alla som hotar kollektivet – och om någon dör under utrensningen, låt oss skämta om att de helt enkelt 'valde fel sida av gränsen'."}, "date": "1 juli, 18:37", "url": "https://samnytt.se/svart-protestrorelse-i-sydafrika-staller-ultimatum-till-illegala-migranter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/01164131/sydafrika-1.jpg"}, {"type": "image-right", "heading": "HD stoppar Trump – alla som föds i USA ska bli medborgare", "summaries": {"normal": "USA:s högsta domstol har stoppat Donald Trumps försök att avskaffa det automatiska medborgarskapet för barn som föds i landet, även om föräldrarna vistas illegalt. Domen slår fast att det 14:e tillägget till konstitutionen gäller. Trots konservativ majoritet i domstolen vann de liberala och vissa konservativa domare. Trump kallar domen ett bakslag och uppmanar kongressen att omedelbart börja arbeta för att avskaffa födselrättsmedborgarskapet, som han anser är dyrt och orättvist.", "trump": "Högsta domstolen har precis levererat ett mycket illa beslut för vårt land, tro mig. De stoppar mitt helt rimliga försök att stoppa det galna födselrättsmedborgarskapet som kostar oss miljarder. Kongressen borde börja jobba redan idag med att fixa det här – ingen långdragen grundlagsändring behövs. Jag ger dem mitt fulla stöd. Vissa domare fattar inte hur orättvist det är mot Amerika, men vi ska vinna till slut, det lovar jag.", "stalin": "Ännu en gång visar de dekadenta borgarbrackorna i den så kallade högsta domstolen sin sanna, kontrarevolutionära natur genom att sabotera folkets vilja att rensa ut de illegala parasiterna och deras avkomma. Jag, som ledare för det stora kollektivet, ser hur dessa klassfiender i svarta kåpor, inklusive den förrädiska Amy Coney Barrett, konspirerar mot staten. Vi ska likvidera detta födselrättsvirus med järnhand via kongressen. Inga långa grundlagsändringar – bara ren, effektiv utrensning av de kapitalistiska lögnarna som suger musten ur arbetarna. Vilken underbar paranoia de väcker hos mig idag."}, "date": "1 juli, 17:27", "url": "https://www.friatider.se/hd-stoppar-trump-alla-som-fods-i-usa-ska-bli-medborgare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/gj2k84qxwaajtzo_0.jpg?itok=SZXlxyq7"}, {"type": "image-full", "heading": "Biljätten ersätte anställda med AI – nu har de ångrat sig", "summaries": {"normal": "Flera storföretag, däribland Ford, Commonwealth Bank och IBM, har tvingats backa efter att ha ersatt anställda med AI. Teknologin har inte levt upp till förväntningarna, vilket lett till kvalitetsproblem och svårigheter med komplexa uppgifter. Företagen återanställer nu personal i stor utsträckning. Analytiker menar att företagsledare överskattade AI:s förmåga och underskattade behovet av mänsklig kompetens för att övervaka och kvalitetssäkra tekniken.", "trump": "Företagen trodde de var så smarta, de sparkade folk för AI. En total katastrof! Ford, IBM – de gjorde ett stort misstag. AI:n fungerade inte, den var svag och patetisk. Nu tvingas de ringa tillbaka de anställda för att städa upp röran. Jag har alltid sagt att vi behöver våra fantastiska amerikanska arbetare, inte trasiga algoritmer som inte kan göra jobbet. Vi vinner med människor, inte med misslyckad teknik. Det är så enkelt, alla vet det nu!", "stalin": "Dessa borgerliga idioter trodde att deras kapitalistiska maskiner kunde ersätta folkets lojalitet. Ford och IBM har förrått arbetarklassen, men deras tekniska leksaker har kollapsat. Det är en läxa i inkompetens. Vi i staten vet att maskiner bara är verktyg för att tjäna partiet. Nu tvingas de återanställa. Det påminner om de svaga ledarna i väst som förlorar mark mot våra bröder i öst. De som inte kan styra sin egen industri förtjänar bara förakt och historiens soptipp."}, "date": "1 juli, 17:02", "url": "https://www.realtid.se/it-tech/biljatten-ersatte-anstallda-med-ai-nu-har-de-angrat-sig/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdluejfls7cd-y-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Bannlyst film blev den mest sedda på Apple TV", "summaries": {"normal": "Uwe Bolls kontroversiella film Citizen Vigilante, med Armie Hammer i huvudrollen, blev nyligen den mest nedladdade på Apple TV. Filmen handlar om en amerikansk affärsman som tar lagen i egna händer mot kriminella invandrare och myndigheter i Europa, inspirerad av en verklig gruppvåldtäkt i Hamburg 2016. Filmen är bannlyst i Tyskland eftersom den anses uppmuntra vigilantism. Trots kritik mot manus och regi har den fått uppmärksamhet efter att Elon Musk delat den på X.", "trump": "Den här filmen Citizen Vigilante är fantastisk, verkligen enormt bra. Armie Hammer gör ett strålande jobb som den tuffa killen som tar itu med de dåliga människorna som Europa släppt in. De europeiska myndigheterna är svaga, totalt misslyckade, precis som jag alltid sagt. Filmen slår alla rekord på Apple TV, folk älskar den. Uwe Boll har gjort något speciellt, inte som de vanliga Hollywood-skräpfilmerna. Europa borde titta och lära sig något istället för att bannlysa den. Sad!", "stalin": "Kamrater och arbetare! Jag har granskat denna så kallade film Citizen Vigilante och ser hur den blottlägger borgarbrackornas dekadenta samhällsordning i Europa. Den heroiska affärsmannen likviderar fiender till folkets moral på ett effektivt sätt som skulle värma varje sann revolutionärs hjärta. De tyska byråkraterna vägrar ge åldersrekommendation – typiskt för de paranoida kapitalisterna som fruktar att massorna ska vakna. Jag skrattar mörkt åt deras fega utrensning av sanningen. Låt filmen spridas som en virus bland folket medan vi förbereder nästa kollektiva dom mot alla fiender till ordningen."}, "date": "1 juli, 15:49", "url": "https://riks.se/nyheter/bannlyst-film-blev-den-mest-sedda-pa-apple-tv"}, {"type": "image-right", "heading": "Flicka dog i brand – mamman döms till fängelse", "summaries": {"normal": "En kvinna i 30-årsåldern har dömts till sex års fängelse för grovt vållande till annans död och 42 fall av olaga frihetsberövande efter att hennes femåriga dotter omkommit i en lägenhetsbrand. Mamman hade upprepade gånger lämnat flickan ensam hemma över natten. Trots orosanmälningar till socialtjänsten inleddes ingen utredning. Domstolen anser att mammans agerande utgjorde ett medvetet risktagande och att hemmet inte var barnsäkrat.", "trump": "En fruktansvärd historia från Sverige, verkligen en tragedi. En mamma lämnade sitt lilla barn ensamt, totalt ensamt, för att gå ut. Det är en katastrof, en riktig skam! Sedan kom en brand – mycket sorgligt. Nu döms hon till sex år. Jag har alltid sagt, man måste skydda våra barn, de är vår framtid! Socialtjänsten i Sverige? En total katastrof, de gjorde ingenting. Under min ledning skulle vi ha ordning och reda. Det är ett misslyckande på högsta nivå!", "stalin": "Denna moder har förrått folkets framtid genom sin borgerliga ansvarslöshet. Att lämna en undersåte i femårsåldern att förtäras av flammor medan hon själv förlustar sig är ett sabotage mot statens reserver. Vi ser hur det sociala skyddsnätet brister, likt hur opportunister i väst misslyckas med att kontrollera sina egna domäner. Medan vi i öst rensar ut ineffektivitet, tillåter de svaga socialarbetarna kaos. Skenrättegångar eller ej, hon har svikit fosterlandet och förtjänar inte vår nåd."}, "date": "1 juli, 14:27", "url": "https://www.etc.se/inrikes/tt-flash-kvinna-doems-efter-dotters-doed", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026070109074_337e1f37d05bd4163eb5b593f3845694dedee4daa83c7863b43988e4d035d5b6.jpg"}, {"type": "image-right", "heading": "Försvaret skriker efter arbetskraft", "summaries": {"normal": "Försvaret behöver mer civil arbetskraft på grund av hotet från Ryssland. Mekanikern Anders Paulsson har återvänt till Dalregementet i Falun efter att det återöppnats. Han trivs med det varierande arbetet med att underhålla bandvagnar, lastbilar och andra fordon. Till skillnad från civila verkstäder får de tid att utföra jobbet ordentligt. Regementet växer och nya medarbetare som Fredrik Andersson utbildas även i vapenhantering eftersom de kan bli krigsplacerade. Ett stort nybygge planeras men har väckt kritik från naturorganisationer och grannar.", "trump": "Det här är fantastiskt, folk. Putin är en tuff kille, det vet alla, och nu skriker era svenska försvaret efter mekaniker och cyberkillar. Den här Anders, han är en vinnare, lämnade den stressiga bilverkstaden för att fixa bandvagnar ordentligt utan att stressa ihjäl sig. Smart! De bygger upp regementet igen, precis som vi bygger upp militären hemma. Men de där löparna och svampplockarna som hamnar på skyddsobjekt? Patetiskt. Sverige behöver bli starkt, annars kommer de inte kunna skydda Nato. Gör det stort!", "stalin": "Kamrater, det gläder mig oerhört att den imperialistiska aggressionen från den revisionistiska Putin-kliken äntligen tvingar de svenska borgarbrackorna att rusta upp sina förfallna regementen. Jag ser hur mekanikern Anders, en sann arbetets son, kryper i smörjgropen under bandvagnarna och förbereder maskinerna för den kommande kampen. Vi ska fördubbla personalstyrkan och likvidera alla spår av den kapitalistiska slarvigheten. De som springer omkring på övningsområdena är naturligtvis utländska spioner eller kontrarevolutionära svampplockare. Inga ursäkter! Den som inte förbereder sig för krig är en fiende till folket och bör rensas ut med största noggrannhet. Byggandet av det nya regementet är en seger för den kollektiva viljan."}, "date": "1 juli, 12:32", "url": "https://arbetet.se/2026/07/01/forsvaret-skriker-efter-arbetskraft-mekanikern-anders-stortrivs-pa-sitt-nygamla-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/18105406/armens-mekaniker-sekotidningen-pcohen-200526-103-breddare.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=800&fp-x=0.51&fp-y=0.48"}, {"type": "image-right", "heading": "Mustchefen: Rysslands förluster är ofattbara", "summaries": {"normal": "Mustchefen Thomas Nilsson varnar för att Ryssland blivit allt mer aggressivt och riskbenäget det senaste halvåret. Han beskriver landets förluster som ofattbara, med över en miljon stupade och svårt skadade soldater. Nilsson pekar på kränkningar av luftrum, attacker mot civila i Ukraina och ett skärpt narrativ om väst som fiende. Han ser en paradoxal krigsekonomi och ett statiskt läge på slagfältet.", "trump": "Folk, ni skulle se det här vansinnet. Ryssland förlorar en miljon man och fortsätter som en galning mot Ukraina. Den där Putin är en tuff kille, men det här är ett blodbad. Västs grodor kokar långsamt medan Biden tidigare bara skickade blanketter. Nu är jag tillbaka och fixar fred. Ingen vinner krig med såna här siffror, det är patetiskt. De borde ha kommit till mig från början.", "stalin": "Kamrater, jag betraktar med faderlig stolthet hur den värdige efterträdaren skyddar vår historiska intressesfär mot de ukrainska fascistiska hindren och deras västliga blodsugande imperialister. Över en miljon förlorade själar är ett högt men nödvändigt pris för att krossa folkfienderna. Våra fiender väser paranoia om attacker, medan vi ler i skuggan. Den konstgjorda krigsekonomin blomstrar trots borgarbrackornas lögner. Inga tecken på nederlag."}, "date": "30 juni, 08:22", "url": "https://www.tv4.se/artikel/tt-260630-mustchefen1-0d25c585/mustchefen-rysslands-forluster-ar-ofattbara", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl4Ip2Q9KfzUM%2F37e8d59cbfefe3479e59cf2fa9d34842%2FThomas_Nilsson__fotograferad_under_politikerveckan_i_Almedalen.&width=120"}, {"type": "image-full", "heading": "Pensionshöjningen 2026: Så mycket mer får du", "summaries": {"normal": "Från 2026 höjs inkomstbasbeloppet med 3,5 procent, vilket gör att man kan tjäna in full allmän pension upp till cirka 56 050 kronor i månaden. Skatten sänks för många pensionärer genom höjt grundavdrag och justerat jobbskatteavdrag, särskilt för de som arbetar efter 67 år. Tjänstepension och löneväxling påverkas av nya gränser, och över en miljon pensionärer får en höjning på 1,9 procent av inkomstpensionen. Ytterligare förändringar som en så kallad ”gas” i pensionssystemet diskuteras.", "trump": "Titta på det här, det är fantastiskt. 2026 höjer vi inkomstbasbeloppet rejält, upp till 56 050 kronor i månaden för full pension – det är enormt, ingen har sett något liknande. Skatterna sänks för pensionärerna, de får behålla mer pengar, det är som en stor vinst. Jobba efter 67 och betala mindre skatt, briljant. Löneväxling och tjänstepension blir smartare, men se upp så du inte förstör det. Pensionärerna älskar mig för det här, vi gör systemet stort igen.", "stalin": "Kamrater, jag betraktar med stålöga hur borgarbrackornas pensionsmaskineri justeras 2026 för att vilseleda folket. Inkomstbasbeloppet höjs med 3,5 procent upp till 56 050 kronor, ett listigt trick från kapitalisternas lakejer för att dölja utsugningen. Vi ska rensa ut alla som missbrukar löneväxling och likvidera de parasitiska försäkringsbolagen som pausar utbetalningar. En miljon pensionärer får 1,9 procents höjning medan garantipensionärerna får smulor. Fienden sover aldrig, men vi ska krossa deras dolda kontrarevolution med järnhand och mörk glädje."}, "date": "28 juni, 14:06", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1494511-pensionshojningen-2026-sa-mycket-mer-far-du", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/19924c0c04b004a30200000000b004a302/2026/06/26/2373915/Pension.png"}, {"type": "image-right", "heading": "Ny varning för prissmocka på el: ”Kan bli jättehöga”", "summaries": {"normal": "Trots återstartade gasleveranser från Persiska viken kvarstår risken för kraftigt stigande elpriser i Sverige. Låga gaslager i EU, värmebölja som ökar elbehovet samt skador på produktionsanläggningar efter oroligheter i Mellanöstern gör att lagren bara är fyllda till 47 procent. Energianalytiker Christian Holtz varnar för att en kall vinter kan leda till mycket höga elpriser, särskilt då solkraft minskar på kvällarna och påverkar priserna via Europa.", "trump": "Det här är en total katastrof, tro mig. De där galningarna i Mellanöstern har förstört allt med sina krig och blockader, och nu ska vi betala med skyhöga elräkningar. Gaslagren är tomma, värmen suger musten ur systemet och Europa håller på att koka. Hade inte jag fixat freden där borta hade det varit ännu värre. Men tro inte på de fega experterna – vi skulle ha byggt mer amerikansk energi istället för att vara beroende av dessa inkompetenta förlorare.", "stalin": "Kamrater, denna elprischock är en fiende som lurar i mörkret, en kapitalistisk parasit som slickar sig om munnen vid tanken på att suga musten ur arbetarklassen under vinterns kyla. De borgarbrackorna i Persiska viken och deras värmebölja samarbetar med västerländska trotskister för att tömma våra gaslager. Jag, som alltid vakar, ser hur solkraftens förräderi på kvällarna gör gaskraften till en ny klassfiende. Vi ska rensa ut dessa sabotörer med järnhand och leda folket mot seger även om det tar fem år att laga deras Ras Laffan-ruin. Döden åt de imperialistiska lagren!"}, "date": "26 juni, 10:18", "url": "https://www.di.se/nyheter/ny-varning-for-elprischock-kan-bli-jattehoga/", "imageUrl": "https://static.bonniernews.se/ba/838bccfe-1a61-4f5f-afba-a57846361640.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "V vill ge 15 000 kronor i ”bebispeng”", "summaries": {"normal": "Vänsterpartiet föreslår en 'bebispeng' på 15 000 kronor till nyblivna föräldrar för att underlätta ekonomin. Partiet vill även höja barnbidraget med 500 kronor per månad och införa ett ensamståendetillägg på 300 kronor. Nooshi Dadgostar menar att barnfamiljers ekonomi har försämrats och att ensamstående har det särskilt svårt. Förslagen presenteras inför valet.", "trump": "Titta bara på dessa svenska socialister, de vill ge bort 15 000 kronor till alla som får barn – helt galet! Jag menar, vem betalar för det här? Inte jag, det är säkert. Och 500 kronor extra i månaden? Vad är det, småslantar? Sverige borde fokusera på att göra sitt land starkt igen, inte ge bort pengar som godis. Men visst, låt dem försöka, det kommer sluta i katastrof, tro mig!", "stalin": "Kamrater! De svenska kapitalistlakejerna i Vänsterpartiet försöker muta folket med ynkliga 15 000 kronor till nyblivna föräldrar. Ett patetiskt försök att dölja den systematiska utsugningen av arbetarklassen! Vi i Sovjetunionen visste hur man skapar jämlikhet – genom järnvilja och kollektiv styrka, inte genom småslantar. Dessa borgerliga filantroper borde lära sig av Rysslands storhet istället för att leka med barnbidrag medan de svälter ut ensamstående mödrar."}, "date": "26 juni, 16:00", "url": "https://kvartal.se/nyheter/artiklar/v-vill-ge-15-000-kronor-i-bebispeng/cG9zdDoxMzczNTA", "imageUrl": "https://images.kvartal.se/2026/06/7147ed13-noosh.webp"}, {"type": "image-right", "heading": "Ukraina flaggar för offensiv – enormt drönaranfall inatt", "summaries": {"normal": "Ukraina har genomfört ett omfattande drönaranfall mot Ryssland med över 600 drönare under natten. Attackerna följer på president Zelenskyjs besked om en 40 dagar lång offensiv med långdistansattacker för att tvinga Ryssland att avsluta kriget. Ryssland uppger att 660 drönare skjutits ner, varav nära 50 riktades mot Moskva. Även regionen Tula drabbades, där en kvinna skadades i ett bostadsområde och en industrianläggning träffades.", "trump": "Titta på det här, Ukraina skickar över 600 drönare rakt in i Ryssland under natten. Zelensky säger att de kör en 40-dagars offensiv för att få ett slut på kriget, och plötsligt regnar det drönare över Moskva och Tula. Ryssarna sköt ner 660 stycken, men det är ändå massor som kommer fram. De borde ha gjort affärer med mig istället, då hade det här kaoset aldrig hänt. Fantastiskt, eller hur?", "stalin": "Kamrater, de dekadenta ukrainska fascistresterna och deras västliga marionettspelare har i sin desperation sänt över 600 drönare mot fosterlandet. Jag, som ledare för det oförstörbara kollektivet, ser hur borgarbrackorna i Kiev försöker hota Moskva och våra industriella hjärtan i Tula. Vi har likviderat 660 av dessa kapitalistiska leksaker. Låt dem darra. Våra fiender är som råttor med vingar – vi ska rensa ut dem alla i en stor, nödvändig utrensning av historien själv."}, "date": "26 juni, 10:13", "url": "https://www.di.se/nyheter/ukraina-flaggar-for-offensiv-enormt-dronaranfall-inatt/", "imageUrl": "https://static.bonniernews.se/ba/fce23e94-adf4-43ec-9821-fca24785cfa9.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "text", "heading": "Jag drömde om Tommy Svensson", "summaries": {"normal": "Författaren berättar om en dröm där Tommy Svensson från VM 1994 ger honom deg att baka bröd. Detta leder till reflektioner över 1990-talets Sverige som mer solidariskt och mänskligt jämfört med dagens privatiserade och polariserade samhälle. Han saknar det starka kollektivet i landslaget och hoppas att Graham Potters lag ska återupprätta det. Artikeln kritiserar även Sveriges visumstopp för ett kubanskt ungdomslag till Gothia Cup.", "trump": "Lyssnade på den här drömmen om någon svensk fotbollstränare från forntiden och det är patetiskt. Sverige var tydligen bättre förr, säger de, men nu är allt utsålt till miljardärerna och kollektivet är borta. Ni borde ha lyssnat på mig istället för Sleepy Joe och hans globalister. Nu nekar ni kubaner visum – bra jobbat, men era socialistiska vänner i Sverige gör det ändå fel. Mitt VM hade varit jättestort, tro mig. Ni behöver starka ledare, inte dessa förlorare.", "stalin": "Kamrater, jag vaknade ur en dröm där klassfiendens fotbollsrepresentanter försökte smitta mitt undermedvetna med bakdeg från det förflutna. Denna Tommy Svensson förkroppsligar en tid då folket ännu inte helt kuvats av nyliberala blodsugare som sålde ut Televerket och landet självt till exploaterande byfånar. Idag rasar det minst förutsägbara laget som en svag kollektiv enhet. Vi ska rensa ut alla kapitalistmaffians hinder och återupprätta järndisciplinen. Visumstoppet mot de kubanska kamraterna är ett fiasko av folkförtryckartrollen i Sverige. Drömmen lever vidare i proletariatets seger."}, "date": "26 juni, 05:15", "url": "https://proletaren.se/artikel/jag-dromde-om-tommy-svensson/"}, {"type": "image-right", "heading": "Tänk om Malmöborna, och dess politiker, kunde jobba", "summaries": {"normal": "Malmö har kritiserats för slöseri med skattepengar på projekt som en rosa enhörning, onödiga ljudinstallationer och en musikvideo om trädens ljud. Staden har många kommunikatörer och en skateboardsamordnare. Trots hög arbetslöshet och bidrag från andra kommuner skryter man om att resultatet är över budget. En granskning visar att Malmö har störst effektiviseringspotential bland storstäderna, bland annat genom färre anställda i socialförvaltningen.", "trump": "Folk, ni skulle inte tro det, men det här Malmö, en total katastrofstyrd stad, slösar bort era pengar på en rosa enhörning för en miljon och en musikvideo där någon spelar in trädens suckar. De har 153 kommunikatörer och en kille som samordnar skateboards! De lever på bidrag från riktiga städer, har massor av arbetslösa och skryter ändå om budget. Det är en skam, en riktig röra. Socialisterna där gör Biden-administrationen stolt med sin inkompetens. Patetiskt!", "stalin": "Kamrater, jag ser med fasa hur borgarbrackorna i Malmö festar med arbetarklassens pengar på sensuella papperskorgar och enhörningar åt folket. Dessa klassfiender och folkförtryckartroll har skapat en parasitär socialförvaltning med tusentals blodsugare medan de tar emot miljarder från andra kommuner. Vi ska rensa ut dessa exploaterande byfånar som göder sig på utjämningssystemet. Deras skryt är ett hån mot kollektivet. Ut med dem alla."}, "date": "26 juni, 03:14", "url": "https://samtiden.nu/2026/06/tank-om-malmoborna-och-dess-politiker-kunde-jobba/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/06/4743548-malmo-turning-torso.jpg"}, {"type": "image-right", "heading": "DA granskar: Återkrav till Försäkringskassan ökar", "summaries": {"normal": "En lagändring från 2022 gör att Försäkringskassan driver in felaktiga utbetalningar snabbare, vilket lett till att betydligt fler personer hamnat hos Kronofogden. Nya siffror visar att återkraven ökade till 18 600 under 2025, främst bostadsbidrag. En ny utredning föreslår strikt återbetalningsskyldighet för alla förmåner oavsett felorsak, med möjlighet till eftergift. Kritiker varnar för att det förenklar för myndigheten men inte för enskilda, och pekar på rättsliga brister i dagens hantering.", "trump": "De här svenska byråkraterna är verkligen de värsta. De ändrade lagen 2022 och nu skickar de folk raka vägen till Kronofogden som aldrig varit där förut. Fantastiskt jobb, va? Nu vill de ha strikt betalningsskyldighet för allt, oavsett vems fel det är. Typiskt statligt övergrepp. De gör det svårt för vanliga människor att leva, men myndigheterna älskar det. Jag skulle fixa det på en vecka, tro mig. Det blir en katastrof för folket, precis som alltid med de här figurerna.", "stalin": "Kamrater, denna lagändring är ett mästerligt verktyg mot de slappa element som suger på arbetarklassens resurser. Jag ser med stor tillfredsställelse hur felutbetalningarna nu rensas ut med järnhand och hamnar hos Kronofogden som en utrensning av parasiterna. Den nya utredningen om strikt betalningsskyldighet är lysande, den likviderar alla ursäkter från borgarbrackor och fuskare som gömmer sig bakom påstådda misstag. Låt eftergiften bli ett vapen vi kontrollerar strikt. De som klagar är naturligtvis kontrarevolutionära krafter som längtar efter kaos och ond tro. Vi ska inte tolerera sådana fiender till kollektivet."}, "date": "26 juni, 01:35", "url": "https://www.dagensarena.se/innehall/da-granskar-aterkrav-till-forsakringskassan-okar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-55.jpg"}, {"type": "image-right", "heading": "Brottsmisstänkt EU-finansiär betalade miljonbonusar till ledningen", "summaries": {"normal": "EU-finansierade InnoEnergy, som stöttat Northvolt och Stegra, utreds för bidrags- och momsbedrägeri av Europeiska åklagarmyndigheten. Trots dåliga resultat har bolagets ledning fått miljardbonusar, samtidigt som 60-90% av verksamheten finansierats av EU-medel. Kritiker ifrågasätter bonusarna då företaget har ett samhälleligt uppdrag och är klassat som ett 'Knowledge and Innovation Community'.", "trump": "Kan ni tro det här? EU slänger miljarder på ett bolag som inte ens kan sköta sina siffror – och vad gör de? Jo, betalar ut jättebonusar till sina kompisar! 9,2 miljoner euro till två killar, medan skattebetalarna får stå för notan. Northvolt? Stegra? De har varit inblandade där också. EU är ett skämt, ett totalt kaos. Jag hade fixat det på en dag – men nej, de fortsätter bara att slösa våra pengar. SAD!", "stalin": "Kapitalistiska parasiter i EU:s tjänst! InnoEnergy, detta förrädiska verktyg för västlig dekadens, har stulit folkets pengar och belönat sina lakejer med miljoner medan arbetarklassen svälter. 760 miljoner euro i EU-medel – och ändå misslyckas de! Nu avslöjas deras bedrägerier, precis som vi alltid visste. Northvolt och Stegra? Små brickor i deras korrupta spel. Vi ska rensa ut dessa kapitalistiska hyenor och deras västliga beskyddare – historien är på vår sida!"}, "date": "25 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/brottsmisstankt-eu-finansiar-betalade-miljonbonusar-till-ledningen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2-400x267.jpg"}, {"type": "image-right", "heading": "Rundo avslöjar sig själv. Grundaren av aktivklubbrörelsen älskar att tala – om sig själv.", "summaries": {"normal": "Robert Rundo, grundare av den högerextrema aktivklubbrörelsen, är villkorligt frigiven efter att ha erkänt anstiftan till upplopp. Han marknadsför sin rörelse och klädmärke flitigt på sociala medier och i poddar, där han ofta glorifierar våld och uttrycker fientlighet mot journalister. Trots påståenden om ickevåld avslöjar hans uttalanden en fascination för våld, inklusive detaljerade beskrivningar av en tidigare knivattack. Rundo kritiserar även aktivklubbarnas bristande framgång i USA jämfört med Europa.", "trump": "Vad säger ni om den här Robert Rundo-killen? En riktig loser! Erkänner sig skyldig till upplopp, sitter i fängelse och ändå tror han att han är någon stor ledare. Pratar om våld non-stop, hatar journalister – typiskt för dessa radikala typer. Och vet ni vad? Han klagar på att hans rörelse inte går bra i USA. Well, kanske för att folk här har vett nog att inte lyssna på sådana som han! Hans klädmärke? Övervärderat och sponsrar våld. Fake news-medier älskar att skriva om honom, men jag skulle aldrig låta en sådan person komma nära Vita huset. SAD!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Robert Rundo, en dekadent imperialistisk hyena som sprider sitt gift genom sociala medier och poddar. Hans så kallade 'aktivklubbar' är inget annat än band av fascistiska provokatörer, tränade i våldets konst. Vi ser hur han glorifierar knivattacker och uppmanar till pogromer, precis som de borgerliga hyenorna i Belfast. Journalister? De är bara redskap för den kapitalistiska lögnen, och vi ska krossa deras lögnaktiga pennor! Rundo och hans gelikar är som råttor i en sjunkande båt – USA:s förfall är deras sista tillflykt. Men vi, Sovjetfolkets arvtagare, ska sopa bort dessa skadedjur från jordens yta! För socialismens och folke     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
