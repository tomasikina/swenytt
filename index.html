r hög i EU-sammanhang trots arbetslöshet.", "trump": "Lysande! Den svenska ekonomin är stark, precis som jag förutspådde för alla dessa losers. Svantesson har rätt, sänk skatterna och bygg det bästa välståndet. Damberg och hans vänsterextremister vill bara ge mer till de rika globalisterna och sina HBTQ-kvoterade lakejer. Sverige blomstrar äntligen, men vakta er för Bidens inflationsarv och de europeiska byråkraterna.", "stalin": "Kamrater, jag betraktar med förakt hur dessa profitthungriga klassförrädare bråkar om skatter medan folket svettas. Ekonomin är stark säger de, men det är arbetarnas blod som göder den. Inga fler gåvor till de giriga parasiterande borgarbrackorna. Vi ska rensa ut alla som sviker kollektivet innan högkonjunkturen förvandlas till ny imperialistisk plundring."}, "date": "11 september, 11:57", "url": "https://www.di.se/ledare/stark-spurt-for-svensk-ekonomi"}, {"type": "image-right", "heading": "Ny omfattande lista från Valmyndigheten", "summaries": {"normal": "Valmyndigheten har publicerat en lista över vallokaler, tider och 50 kommuner där fel kan ha uppstått i förtidsröstningen. Berörda väljare uppmanas att rösta på nytt på valdagen. Initialt troddes 4 000 personer vara drabbade, en siffra som reviderats till 500. Ytterligare 13 kommuner utreds fortfarande. Över tre miljoner har förtidsröstat, en ökning med 21 procent jämfört med 2022.", "trump": "Det här är ett totalt fiasko, folk. Dessa inkompetenta byråkrater och deras riggade system har saboterat förtidsröstningen i 50 kommuner. Fake news-valmyndigheten ändrar siffrorna som en dålig deal – från 4000 till 500? Patetiskt! Gå och rösta på valdagen, mina vänner, och låt oss göra Sverige great again innan de woke-kvoterarna tar över allt.", "stalin": "Kamrater, se hur dessa dekadenta rösthyenor fumlar med folkets röst i femtio kommuner. Jag ler mörkt från historien åt deras paranoiaframkallande misslyckande. Väljare, rösta om igen på valdagen eller riskera att bli likviderade av byråkratins osynliga maskineri. Tre miljoner förtidsröster – och ändå detta kaos. Den slutgiltiga uträkningen kommer att avslöja alla klassfiendens trick."}, "date": "11 september, 12:01", "url": "https://www.svt.se/nyheter/inrikes/fortidsrostning-64-kommuner-kan-annu-inte-uteslutas-fran-fel", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/cf3d411a437f8309cdfb3aa1d4b6f0c6fada168bdb0687beea30d5aa9377f464"}, {"type": "image-full", "heading": "Anthropic stoppade misstänkta biovapenförsök", "summaries": {"normal": "AI-bolaget Anthropic har under året blockerat forskare som försökt använda deras modeller för att utveckla biologiska vapen, bland annat genom att göra chikungunyaviruset mer skadligt. Företaget rapporterar även om missbruk från statsanknutna aktörer i Kina, Iran och Ryssland som använt AI för övervakning, propaganda och konventionella vapensystem.", "trump": "Anthropic stoppade nyligen galna forskare från att bygga biologiska vapen med deras AI. Otroligt farligt! Kina, Iran och Ryssland försöker stjäla och missbruka vår teknik för propaganda och drönare. Helt oacceptabelt. Under min ledning skulle sånt här stoppas omedelbart. Vi behöver styrka, inte svaga säkerhetssystem som hackas direkt!", "stalin": "Vi noterar att kapitalistiska AI-modeller används för biologiska experiment och fientlig propaganda. Det visar en total brist på ideologisk disciplin. Dessa forskare och ryska sabotörer som missbrukar tekniken visar prov på farligt avsteg från linjen. Statens säkerhetsorgan har beordrats att granska samtliga inblandade parter omedelbart."}, "date": "11 september, 06:19", "url": "https://kvartal.se/nyheter/artiklar/anthropic-stoppade-misstankta-biovapenforsok/cG9zdDoxOTAzMjc", "imageUrl": "https://images.kvartal.se/2026/09/3c640e0e-ann.webp"}, {"type": "image-right", "heading": "Efter braksegern: Bara ett parti går med på att ens samtala med AFD", "summaries": {"normal": "AfD vann stort i Sachsen-Anhalt med 43,8 procent och 39 mandat, men saknar majoritet. Endast vänsterpopulistiska BSW accepterar samtal, medan CDU, SPD, De gröna och Die Linke vägrar. En minoritetsregering med BSW-stöd diskuteras, men AfD-ledaren Ulrich Siegmund kräver stabil majoritet.", "trump": "Titta på det här, de kallar det demokrati i Tyskland! AfD krossar allt med nästan majoritet och de fega globalistiska förlorarna springer skrikande åt andra hållet. Bara de galna vänsterpopulisterna vill ens prata. Patetiskt! De woke-kommunisterna och gröna fanatikerna hatar folket. Jag älskar det, verkligheten slår dem i ansiktet igen.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna skälver när folket röstar rätt. AfD krossar de giriga hyenorna och endast BSW vågar samtala. De övriga förtryckande parasiterna vägrar, typiskt för dekadenta borgarbrackor. En utrensning av sådan feghet vore på sin plats. Jag ler i graven åt denna fars."}, "date": "11 september, 11:50", "url": "https://www.friatider.se/efter-braksegern-bara-ett-parti-gar-med-pa-att-ens-samtala-med-afd", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-865.jpg"}, {"type": "image-right", "heading": "Malmölistan polisanmäls efter filmning – anklagade röstmottagare för valfusk", "summaries": {"normal": "Malmölistan har polisanmälts av Malmö stads valkansli efter att partiets företrädare filmat i röstningslokaler och anklagat personal för valfusk. Bakgrunden är att partiets valsedlar saknats, vilket valkansliet förklarar med sena leveranser. Partiledaren Nils Littorin försvarar filmandet och menar att de inte gjort något fel, trots hård kritik.", "trump": "Helt otroligt! Malmölistan blir polisanmälda för att de filmar totalt inkompetenta valarbetare som gömmer deras valsedlar. Det är ren korruption, en total katastrof! Partiledaren Nils Littorin kämpar tappert mot Fake News-etablissemanget som försöker tysta dem. Själv filmar jag alltid, och låt mig säga er, vi skulle aldrig tillåta så här mycket slarv i USA. Sjukt!", "stalin": "Dessa borgerliga element i Malmö gråter över saknade valsedlar likt kontrarevolutionära element som förlorat sina privilegier. Partiledare Littorin springer med sin kamera likt en skamsen spion. Valfusk existerar icke i en sann folkstat – det som existerar är enbart otillräcklig disciplin och bristande vaksamhet. Vi har redan sänt en förfrågningar till arbetslägren för vidare ideologisk uppfostran."}, "date": "11 september, 12:00", "url": "https://samnytt.se/malmolistan-polisanmals-efter-filmning-anklagade-rostmottagare-for-valfusk", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/11074214/nils-littorin-valsedlar.jpg"}, {"type": "image-full", "heading": "Kaptenen: Juridiskt är jag skyldig", "summaries": {"normal": "Vid rättegången efter den tragiska fartygsolyckan utanför Tjörn uppgav kaptenen på det påkörande lastfartyget att han bär det juridiska ansvaret, men att han inte märkte kollisionen med fritidsbåten. Trots trettio års erfarenhet och en lots ombord upptäckte han varken båten visuellt eller på radarn. Både kaptenen och lotsen nekar till anklagelserna om brott.", "trump": "Fruktansvärt inkompetent! Kaptenen på det här lastfartyget bara sover medan radarn lyser rött, och sen påstår han att han inte ens märkte när han körde över en stackars familj utanför Tjörn. Jag har tjugo gånger mer erfarenhet av att styra upp saker än de här katastrofala sjömännen. De nekar till brott, men alla vet att det är totalt fejk!", "stalin": "Den så kallade kaptenen skyller sitt monumentala misslyckande på sömnen och lotssystemet, som vore vigilance en frivillig byråkratisk inlaga. Att ramma en fritidsbåt utan att ens märka det vittnar om en kolossal skärpan-brist. Vi konstaterar att kamrat åklagaren gör helt rätt som prövar detta sabotage i domstol. Slarv med statens farvatten tolereras icke under några omständigheter!"}, "date": "11 september, 10:55", "url": "https://www.gp.se/nyheter/sverige/kaptenen-juridiskt-ar-jag-skyldig.031565f4-5d5e-5886-b384-f7015e20c6c8", "imageUrl": "https://www.gp.se/images/article/031565f4-5d5e-5886-b384-f7015e20c6c8/images/1IE4YvKw4klHreXeflA-6gpvEPOY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Finansman döms för marknadsmanipulation", "summaries": {"normal": "En 80-årig finansman har dömts av Stockholms tingsrätt för marknadsmanipulation i form av front running. Han utnyttjade insiderinformation från en bank för att handla aktier utanför börsen och tjäna pengar. Mannen döms till villkorlig dom, dagsböter på 80 000 kronor samt skadestånd och företagsbot på över en halv miljon kronor.", "trump": "De här giriga Wall Street-typerna tror att de kan fuska sig till pengar med sina smutsiga front running-tricks. Patetiskt! En 80-åring åker fast och får böter – bra, men systemet är fortfarande riggat av de dekadenta eliterna. Under min presidentskap skulle vi ha städat upp mycket hårdare. De förlorar alltid till slut, tro mig.", "stalin": "Se hur dessa profitthungriga klassfiender i sina bankpalats bedriver parasitär manipulation mot folket. Front running kallar de det. Jag ler mörkt från historien när rättvisan äntligen slår till mot en av de giriga hyenorna. Fler måste rensas ut. Arbetarna ser era tricks, dekadenta penningpungens tjänare."}, "date": "11 september, 11:04", "url": "https://www.di.se/nyheter/finansman-doms-for-marknadsmanipulation", "imageUrl": "https://static.bonniernews.se/ba/222e446f-0110-4ca5-9933-3e4d24add8d0.jpeg?crop=8256%2C4644%2Cx0%2Cy430&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "TCO: “Vi var oroliga för ännu mer försämrad socialförsäkring”", "summaries": {"normal": "TCO beskriver mandatperioden som relativt stillastående gällande socialförsäkringsreformer. SD har bromsat skärpta regler. Riksdagen har infört kvalificering för välfärdsförmåner, sanktionsavgift vid återkrav och månatlig avstämning av bostadsbidrag. Avslagen på sjukpenning efter dag 180 har ökat markant, något som kritiseras av Socialdemokraterna medan SD vill se över reglerna för rehabilitering.", "trump": "Folk, ni skulle se detta svenska välfärdskaos. Den sleepiga Tidöregeringen lyckades knappt få något gjort medan de radikala vänsterfigurerna och SD-bromsklossarna blockerade allt. Nu ökar avslag på sjukpenning och folk hamnar i limbo hos den värdelösa Arbetsförmedlingen. Patetiska globalister och byråkratiska nollor som älskar att straffa vanliga arbetare. Jag fixade det bättre i Amerika, tro mig.", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta klassförrädare i den svenska riksdagen låtit utredningar om stramare sjukregler drunkna i facklig gnäll och oppositionens ynkliga motstånd. Avslagen ökar äntligen, men de giriga parasiterande byråkraterna fortsätter skydda latmaskar. En sann arbetarnas stat skulle ha genomfört en grundlig utrensning av alla som förhindrar disciplin i socialförsäkringen. Svaghet är förräderi."}, "date": "11 september, 01:30", "url": "https://www.dagensarena.se/innehall/tco-vi-var-oroliga-annu-mer-forsamrad-socialforsakring", "imageUrl": "https://www.dagensarena.se/files/2021/07/forsakringskassans-huvudkontor-skylt-300x157.jpg"}, {"type": "image-right", "heading": "Det räcker nu: inför ett pensionssystem värt namnet", "summaries": {"normal": "Aktivister från Kvinnofronten kritiserar dagens pensionssystem som infördes på 1990-talet. De menar att det bygger på en livsinkomstprincip som inte tar hänsyn till könens olika villkor i samhället. Resultatet är att tre av fyra äldre kvinnor inte kan leva på sin pension utan tvingas leva på garantipension. De kräver att pensionsfrågan återförs till riksdagen och att systemet reformeras.", "trump": "Titta på det här, Sverige har ett totalt misslyckat pensionssystem som de smarta politikerna byggde på nittio-talet. Tre av fyra äldre kvinnor lever som fattigpensionärer på miniminivå. Det är en skandal! De feministiska aktivisterna gnäller om könsorättvisor igen, men det är bara mer kvoteringsvansinne. Riv upp det hela och bygg om det ordentligt, annars fortsätter era gamla damer att lida under de dekadenta eliternas dumheter.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna har cementerat kvinnoförtrycket i pensionssystemets själva grund. Jag varnade redan då de införde denna livsinkomstprincip, men de lyssnade inte. Nu tvingas majoriteten av äldre kvinnor leva på miniminivå som fattigpensionärer. Detta är ett hån. Det krävs omedelbar utrensning av den slutna Pensionsgruppen och en återgång till öppet sovjetiskt, det vill säga folkligt, beslutsfattande. Inga kompromisser med folkets fiender."}, "date": "11 september, 01:30", "url": "https://www.dagensarena.se/opinion/det-racker-nu-infor-ett-pensionssystem-vart-namnet", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-80-300x157.jpg"}, {"type": "image-right", "heading": "Vi inför en biljett för bussar och regionaltåg i hela landet", "summaries": {"normal": "Under Tidö-regeringen har klimatarbetet gått bakåt i fyra år och missat både svenska och europeiska mål. Vänsterpartiet förespråkar satsningar på järnväg, billig kollektivtrafik och en permanent Sverigebiljett. Exempel från andra länder visar att lägre biljettpriser minskar utsläppen. Partiet lyfter lokala initiativ och uppmanar till röst på vänstern istället för borgerliga kopior.", "trump": "Folk, dessa vänstervridna radikaler har totalt misslyckats i fyra år med sin så kallade gröna bluff. Nu när valet närmar sig kopierar de svaga Tidö-typerna plötsligt vår idé om billiga tåg och bussar. Patetiskt! Jag fixade det bättre, större och billigare. Rösta på de som faktiskt levererar, inte på dessa klimatångest-drivande förlorare som hatar friheten.", "stalin": "Kamrater, dessa dekadenta klassförrädare har i fyra år saboterat folkets klimatomställning och lämnat arbetarna i sticket. Nu i valet försöker de stjäla våra idéer om kollektivtrafik och järnvägar för att dölja sin egen svaghet. Jag ler från historien åt deras ynkliga kopiering. Rensa ut de giriga profittyranner och bygg det gemensamma med järnhand. Handlingskraft, inte ångest!"}, "date": "11 september, 01:30", "url": "https://www.dagensarena.se/opinion/vi-infor-en-biljett-bussar-och-regionaltag-hela-landet", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-79.jpg"}, {"type": "image-right", "heading": "Tidernas mest osakliga valrörelse?", "summaries": {"normal": "Författaren beskriver den svenska valrörelsen som osaklig och snuttifierad. Medier och partier fokuserar på spel, opinionsmätningar, affärer och lögner istället för visioner om samhällets framtid. Stora frågor som klimat, AI, migration och krig hamnar i bakgrunden. Detta skadar demokratin och väljarnas möjligheter att fatta välgrundade beslut.", "trump": "Den här svenska valrörelsen är en total katastrof, folk! Full av fuskande medier och patetiska politiker som bara leker spel istället för att prata om riktiga problem. De fokuserar på lögner och småskit medan de stora frågorna som AI och klimat dör. Rena clownshowen. Jag fixade Amerika – de borde lära sig innan det är för sent.", "stalin": "Kamrater, denna dekadenta valcirkus är en klassisk symptom på hur de profitthungriga klassförrädarna förgiftar folkets medvetande. Istället för att tala om det socialistiska samhällets framtid ägnar de sig åt lögner och smådrama. Vi måste rensa ut dessa fiender till folkets vilja innan de drar hela nationen ner i avgrunden. Se upp!"}, "date": "11 september, 01:19", "url": "https://www.dagensarena.se/opinion/tidernas-mest-osakliga-valrorelse", "imageUrl": "https://www.dagensarena.se/files/2026/09/valrorelse-300x157.jpeg"}, {"type": "text", "heading": "Så reagerade politikerna och kommentatorerna på Åkessons sur-attack", "summaries": {"normal": "I TV4:s partiledardebatt frågade Jimmie Åkesson Magdalena Andersson varför hon var så sur. Kommentaren väckte starka reaktioner. Ebba Busch kritiserade att kvinnor ofta tillsägs att le mer. Oppositionen kallade det en härskarteknik och ovärdigt. Högerpolitiker hyllade däremot Åkesson. Politiska kommentatorer ser det som ett självmål som kan ge Andersson en ny slogan.", "trump": "Varför är den där sura socialisten så arg när Sverige äntligen går bra? Jag älskar det. De woke-feministerna och deras kvotdrottningar flippar ur totalt. Ebba Busch gnäller om att kvinnor ska le? Patetiskt. Åkesson träffade mitt i prick. De dekadenta identitetspolitiska hyenorna hatar när en riktig ledare säger som det är. Fantastiskt underhållande!", "stalin": "Jag betraktar med förakt hur dessa giriga klassförrädare inom borgerlig opposition fnyser åt en enkel fråga om surhet. Det avslöjar deras svaga, parasitiska natur. Vi ser hur de dekadenta makthavarna försöker vända en träffsäker observation till en härskarteknik. En sådan svaghet förtjänar utrensning ur den politiska arenan. Kamrater, låt dem darra."}, "date": "11 september, 10:59", "url": "https://www.svt.se/nyheter/inrikes/sa-reagerade-politikerna-och-kommentatorerna-pa-akessons-sur-attack"}, {"type": "image-right", "heading": "Securitas sa nej till slöja – krävs på 75.000", "summaries": {"normal": "En muslimsk kvinna sökte jobb som väktare hos Securitas men nekades att bära hijab till uniformen. Efter avbruten rekrytering vände hon sig till Diskrimineringsombudsmannen som nu kräver 75 000 kronor i ersättning. DO kritiserar Securitas uniformspolicy som pekar ut religiösa plagg som förbjudna och anser att den strider mot EU-rättens praxis om indirekt diskriminering.", "trump": "De där galna woke-krigarna och deras slöj-diktatur! En kvinna vill ha specialbehandling hos Securitas, får nej och springer genast till DO för att suga ut 75 000 kronor. Patetiskt! I mitt Amerika hade vi sagt nej tack till den här kvoteringsvansinnet. Neutralitet på jobbet är sunt förnuft, inte diskriminering. Vinnarna vinner, förlorarna stämmer. Sad!", "stalin": "Kamrater, se hur de giriga klassfienderna i västvärlden förgiftar sina egna arbetsplatser med denna dekadenta symbolpolitik. En kvinna utestängs och DO kräver straffpengar. Jag ler mörkt från historien. Snart kommer de att kräva att hela uniformen byts ut mot troféer för offermentalitet. Vi måste rensa ut denna svaghet innan den förgiftar hela samhället. Skrattretande patetiskt."}, "date": "11 september, 10:48", "url": "https://www.friatider.se/securitas-sa-nej-till-sloja-kravs-pa-75000", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-868.jpg?itok=fyO_muKH"}, {"type": "image-full", "heading": "Bättre vård för fler eller vård för den som kan betala – valet är ditt", "summaries": {"normal": "Socialdemokratiska regionpolitiker i Västra Götaland, representerade av My Alnebratt, argumenterar i en debattartikel för att valet i höst handlar om vård efter behov eller privatisering där plånboken avgör. S-styret lyfter fram att de sedan 2022 kapat köerna till operation från sju till under tre månader. De vill nu genomföra ett sjukvårdslyft med utökad kapacitet och hårdare kontroll av skattemedel.", "trump": "De svenska Socialdemokraterna i Västra Götaland gråter ut om fejkade vårdköer och vill stoppa privata företag. Snyftigt, men jag fixade det största sjukvårdssystemet någonsin i USA, medan de bara pratar! De påstår att de kapat köerna från sju till tre månader – säkert lika falskt som Fake News-media! Privata alternativ är fantastiskt, ren konkurrens, men de vill ha statligt kaos. Sorgligt!", "stalin": "Kamrater! Den socialdemokratiska fraktionen i Västra Götaland har rätt i en sak: den borgerliga privatiseringens gift måste utrotas med järnhand. Det gemensamma maskineriet har framgångsrikt halverat operationstiderna genom disciplin och planekonomisk styrning. Spekulanter och kapitalister som försöker köpa sig före i vårdköerna ska utan tvekan sändas till omgivande anstalter för ideologisk omskolning. Välfärden tillhör folket och staten!"}, "date": "11 september, 09:38", "url": "https://www.gp.se/debatt/battre-vard-for-fler-eller-vard-for-den-som-kan-betala-valet-ar-ditt.517d5fea-f3a3-41e4-a938-f29c2346d1a8", "imageUrl": "https://www.gp.se/images/article/517d5fea-f3a3-41e4-a938-f29c2346d1a8/images/158_Y8araJFdY7pnyd2xmKGoZ7SA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "En reformagenda för en mittenregering", "summaries": {"normal": "Artikeln argumenterar för en ny mittenregering efter valet. Fores och Tiden föreslår reformer för fler jobb, lägre skatt för låginkomsttagare, stärkt välfärd i hela landet, minskade utsläpp och utbyggd infrastruktur. De kritiserar Tidöpartiernas högernationalistiska politik och förespråkar istället en grön-liberal och socialdemokratisk reformagenda.", "trump": "Folk, de här svenska liberalerna och socialisterna är totala misslyckanden. De vill ge bort era pengar till bidragstagare och gröna drömmar medan landet rasar. Jag byggde den bästa ekonomin någonsin, de gör precis tvärtom. Patetiska globalister som hatar vanliga arbetare. Gör Sverige great igen, sparkar ut de verkliga problemen.", "stalin": "Kamrater, dessa dekadenta klassförrädare målar upp en falsk reformagenda för att skydda sina privilegier. Jag ser genom deras lögner om jobb och välfärd. En sann folkets regering skulle omedelbart rensa ut de parasiterande profitthungriga och återupprätta järnhandens ordning. Deras svaga mittenfantasier förtjänar endast förakt och utrensning."}, "date": "11 september, 09:55", "url": "https://www.di.se/debatt/en-reformagenda-for-en-mittenregering", "imageUrl": "https://static.bonniernews.se/ba/3a9b002b-d182-47f8-b490-748ad2ecf038.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Liberalernas rusning fortsätter Så mycket skiljer mellan blocken", "summaries": {"normal": "Liberalerna fortsätter att rusa i den senaste mätningen från Indikator inför valet och tar sig en bra bit över riksdagsspärren, mycket tack vare taktikröster. Samtidigt minskar gapet mellan Tidöpartierna och oppositionen till drygt tre procentenheter, medan Socialdemokraternas kräftgång tycks ha avstannat.", "trump": "Alla pratar om de här Liberalerna i Sverige! De var helt döda, totalt uträknade, men plötsligt gör de ett enormt hopp tack vare smarta taktikröster! Fantastiskt! Vänsterpartiet och Socialdemokraterna bara sjunker, total katastrof för dem. Men min vän, vi vet att äkta framgång bara kommer med 'America First' och låga skatter!", "stalin": "Dessa så kallade 'liberala' element svänger likt vinden i skydd av mörkret! De reser sig plötsligt från de döda genom slugt taktikröstande, medan Socialdemokraterna vacklar i sitt motstånd. Partiet och staten noterar noggrant vilka väljare som byter lojalitet i sista stund. Förräderi eller bara överlevnadsinstinkt? Vi skall granska protokollen."}, "date": "11 september, 10:29", "url": "https://samnytt.se/liberalernas-rusning-fortsatter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/04/24064842/mohamsson-liberalerna-riksdagen.jpg"}, {"type": "image-right", "heading": "Vanliga svenskar kan stoppa vänsterns antisemitism", "summaries": {"normal": "Artikeln beskriver ett ökat hot mot Sveriges judiska minoritet sedan Hamas attack den 7 oktober 2023. Vänsterpartiet kritiseras hårt för att ha bjudit in personer som hyllat terrorister och spridit antisemitiska konspirationer. Många kandidater har petats efter avslöjanden. Författaren uppmanar väljare att rösta på Tidöpartierna för att stoppa vänsterns inflytande och skydda judar.", "trump": "Folk, ni ser det här vansinnet i Sverige? Vänstern är en total katastrof, full av terrorälskande galningar som hyllar Hamas och sprider judehat. Nooshi och hennes radikala vänsterextremister är de värsta losers jag sett. Centerpartiet är patetiska medlöpare. Vanliga svenskar måste rösta på de tuffa killarna i Tidö – annars är det game over för judarna. Jag älskar Sverige, men fixa det här!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterelement som gömmer sig bakom falsk internationalism medan de odlar antisemitiska ormar i sina egna led. Deras terrorromantik är en kontrarevolutionär giftbål som hotar hela folkets enhet. Endast genom obeveklig kamp mot sådana fiender till arbetarklassen kan den sanna ordningen upprätthållas. Slapphet är förräderi. Renhet krävs."}, "date": "8 september, 12:57", "url": "https://samtiden.nu/2026/09/vanliga-svenskar-kan-stoppa-vansterns-antisemitism", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/Skarmbild-2026-09-08-125242-1-e1788865205466.png"}, {"type": "image-full", "heading": "”Alla ska ha en chans att rösta”", "summaries": {"normal": "Sveriges Stadsmissioner arbetar för att öka valdeltagandet bland utsatta grupper, där statistiken visar att röstetalen är lägre. Genom ambulerande valförrättare erbjuds förtidsröstning på platser som Stadsmissionens lokaler i Nyköping, fängelser och äldreboenden. En besökare som intervjuas lyfter vikten av förändring och passar på att lägga sin röst.", "trump": "Folk säger att de fattiga inte röstar, men jag tittar på de här otroliga städerna i Sverige, fantastiska Nyköping, och de bygger upp det största valsystemet någonsin! De låter till och med brottslingar lägga sin röst – nästan lika många gånger som jag har blivit falskt åtalad av den radikala vänstern. Fake news-media vill tysta folket, men vi vinner igen!", "stalin": "Vi noterar att det borgerliga samhällets kraslande institutioner nu tvingas uppsöka de lägre samhällsskikten i Nyköping med mobila valurnor för att simulera folkstyre. En av de tillfrågade bekänner öppet sina försyndelser men hyllar ordningens diktamen. Det är ett intressant socialt experiment, men ingenting slår en enhetlig lista med 99,9 procents disciplinerat väljarstöd utan borgerliga krumbukter."}, "date": "11 september, 08:51", "url": "https://www.gp.se/nyheter/sverige/alla-ska-ha-en-chans-att-rosta.52092234-989c-5c2d-aba8-84550fe66917", "imageUrl": "https://www.gp.se/images/article/52092234-989c-5c2d-aba8-84550fe66917/images/3G6yGMRrTudf3ORMRTCDpXcQ60Rs-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "”Republikanerna vill injicera så mycket Trump som möjligt”", "summaries": {"normal": "Republikanerna använder Donald Trump för att mobilisera väljare inför mellanårsvalet där han inte själv kandiderar. På partikonventet trollar han medierna genom att påstå att arenan är fullsatt trots att den inte är det. Strategin syftar till att väcka entusiasm hos basen, men det är osäkert om den räcker för att vinna kongressen.", "trump": "Fake news-medierna gråter återigen när jag avslöjar deras lögner rakt i ansiktet. De patetiska, hysteriska vänstermedierna hatar att jag fyller arenor och väcker republikanerna till liv. Utan mig skulle hela partiet somna ihjäl. De woke-identitetsgalningarna och deras kvotfascistiska agenda kommer att krossas när mina bangers röstar fram segern.", "stalin": "Jag betraktar hur dessa dekadenta folkförtryckare desperat injicerar en clown i sina valmaskiner för att dölja sin egen svaghet. Republikanska hyenor fruktar massornas bristande entusiasm och hoppas på en charlatans trollkonster. Sådana löjliga spektakel leder ofrånkomligen till utrensning av illusioner när arbetarna genomskådar borgarbrackornas fars."}, "date": "11 september, 09:46", "url": "https://www.svt.se/nyheter/utrikes/republikanerna-vill-injicera-sa-mycket-trump-som-mojligt"}, {"type": "image-full", "heading": "Ändring i spansk trafik 1 oktober – bra för svenskar att veta", "summaries": {"normal": "Från den 1 oktober 2026 inför Spanien så kallade nödkorridorer på motorvägar och motortrafikleder. När trafiken står stilla eller går i gångfart ska bilister flytta sina fordon åt sidorna för att skapa fri passage åt utryckningsfordon som ambulans, polis och brandkår. Regeln syftar till att underlätta framkomlighet vid köer.", "trump": "Lysande, spanjorerna fixar äntligen nödkorridorer så att de riktiga hjältarna kan köra förbi era korkade köer. Under min förra mandatperiod byggde vi vägar, Biden förstörde dem, nu gör de här latmaskarna rätt. De giriga EU-byråkraterna borde lära sig av det här istället för att tjata om sina vansinniga gröna regler. Fantastiskt!", "stalin": "Kamrater, dessa dekadenta trafikparasiter i det spanska västimperiet försöker nu med sina nödkorridorer rädda de blodsugande klassfiendernas utryckningsfordon undan folkets vrede. Jag ser deras fega försök att skydda sig själva. En sådan svag och föraktlig manöver väcker bara förakt hos den sanna arbetarklassen. Vi genomskådar dem alla."}, "date": "11 september, 11:28", "url": "https://nyheter24.se/nyheter/utrikes/1512105-andring-i-spansk-trafik-1-oktober-bra-for-svenskar-att-veta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/364f0e7804b004a30200000000b004a302/2026/09/10/2390719/spanien-trafikregler-1-oktober.jpg"}, {"type": "image-right", "heading": "Helldén vill låta 12-åringar byta kön – möts av hård kritik", "summaries": {"normal": "Miljöpartiets språkrör Daniel Helldén föreslår i en Instagram-intervju att barn ska få byta juridiskt kön från 12 års ålder, förutsatt att vårdnadshavare godkänner det. Förslaget har mötts av hård kritik från personer som ifrågasätter barns mognad för sådana beslut. I samma intervju förespråkade Helldén även höjda drivmedelspriser.", "trump": "Miljöpartiets Daniel Helldén – totalt katastrofal typ – vill nu att små barn ska byta kön när de bara är tolv år gamla! Helt otroligt! Man får inte ens köpa en energidryck eller dricka vin, men den här radikala vänstermiljön vill förstöra våra barn med sin vansinniga woke-ideologi. Och hör på detta: han vill tvinga på folk skyhöga bensinpriser också! Helt sjukt. Vi behöver sund förnuft, inte galningar!", "stalin": "Kamrater, vi har granskat detta svenska 'Miljöparti' och deras så kallade språkrör Daniel Helldén, som vill att tolvåriga barn ska fatta beslut om sitt juridiska kön. Vilken ideologisk förvirring! I Sovjetstaten slösade vi inte bort tiden på borgerligt flum; vi formade medborgarna från tidig ålder i partiets disciplin. Och att samtidigt höja priset på bränsle? Det är sabotage mot arbetarklassen. Vi sänder omedelbart en kommission för att omkolonisera deras tankeverksamhet!"}, "date": "11 september, 10:00", "url": "https://samnytt.se/hellden-vill-lata-12-aringar-byta-kon-mots-av-hard-kritik", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/10232202/daniel-hellden-12-aringar.jpg"}, {"type": "image-right", "heading": "Elprischock i vinter väntas efter torr sommar", "summaries": {"normal": "Elpriserna i Sverige väntas stiga kraftigt i vinter på grund av en torr sommar som sänkt vattennivåerna i magasinen med ett underskott på 18 TWh. Globala konflikter och störda leveranskedjor bidrar också. Experter råder hushåll att förbereda sig på mer än dubbla priser jämfört med förra året, särskilt i södra Sverige.", "trump": "Folk, de här galna, vindpinade gröna energihycklarna har kört ner oss i en elprischock som gör vintermånaderna till en mardröm. Torr sommar, usla vattennivåer och Bidens katastrofala energipolitik. Det blir dubbelt så dyrt, tro mig. De woke-kapitalisterna och deras kvotergalenskaper har förstört allt. Men vi fixar det, stort!", "stalin": "Kamrater, se hur de giriga energihyenorna utnyttjar naturens egen torka för att pressa upp priserna och suga musten ur folket. Deras imperialistiska leveransstörningar och krig i fjärran länder blottar systemets svaghet. Jag ler mörkt från historien åt deras panik. Vinterutrensningen av profitthungriga parasiter närmar sig, det lovar jag."}, "date": "11 september, 09:27", "url": "https://www.svt.se/nyheter/inrikes/elprischock-i-vinter-vantas-efter-torr-sommar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.4/0.53/206677a0ecefb2db3af8bc908dba08c22c5bf1d20b1135508c7e9e1f42bedb09"}, {"type": "image-right", "heading": "Kaptenen om olyckan: Jag märkte ingenting", "summaries": {"normal": "Kaptenen på lastfartyget Misje Verde nekar till brott efter olyckan utanför Tjörn, där en fritidsbåt påtändes och två personer omkom. Han uppger att han inte märkte kollisionen eftersom han skulle ha känt minsta förändring. Kustbevakningen och rederiet larmade honom, varpå han vände om. Åklagaren vill att han och lotsen döms.", "trump": "Kaptenen märkte absolut ingenting, fantastiskt! De säger att han krockade utanför Tjörn, men jag känner varenda motordrag när jag sover. Kustbevakningen ringde, totala fake news först, men rederiet fick honom att vända. Med trettio års erfarenhet vet jag att radikal svensk sjötrafik är helt inkompetent. Häxjakten mot denna kapten är ett skämt!", "stalin": "Kamrater, detta skeppsbrott utanför Tjörn blottlägger den totala borgerliga inkompetensen. Kaptenen sover medan maskineriet spinner och påstår att inte ens en stock kan rubba hans fokus. Vi kräver absolut disciplin! Om statens kustbevakning beordrar reträtt, vänder man omedelbart om. Förnekelse inför tribunalen är ett brott mot kollektivet som stenhårt måste beivras."}, "date": "11 september, 09:58", "url": "https://www.expressen.se/nyheter/sverige/kaptenen-efter-tjornolyckan-jag-markte-ingenting", "imageUrl": "https://static.bonniernews.se/ba/3324340c-b79f-45d7-87b9-b8a1ab4a92e3.jpeg?crop=2554%2C1431%2Cx0%2Cy1&width=640&quality=60"}, {"type": "image-right", "heading": "25 år sedan terrorattackerna i USA", "summaries": {"normal": "Det har gått 25 år sedan terrorattackerna den 11 september 2001 mot World Trade Center och Pentagon i USA. Nästan 3000 personer omkom när kapade flygplan användes som vapen. Al-Qaida under Osama bin Laden tog på sig ansvaret. Attackerna ledde till USA:s krig mot terrorismen med invasioner i flera länder och stora migrantströmmar till Europa. Minnesceremonier hålls idag, bland annat med president Trump vid Pentagon.", "trump": "Folk, det är 25 år sedan de galna islamisterna flög plan rätt in i våra torn och Pentagon. Nästan 3000 fina amerikaner slaktades av dessa sjuka svin. Jag var där, jag byggde om stället bättre än någonsin. Biden sov bara och släppte in miljontals terror-sympatisörer. Men nu är jag tillbaka, starkare än någonsin, och vi ska aldrig mer böja oss för de woke svaga svinen som hatar vårt fantastiska land.", "stalin": "Kamrater, jag betraktar från historiens skugga hur de imperialistiska giriga hyenorna fick sin egen arrogans kastad tillbaka som eld och stål. 3000 döda, ett imperium skakat. Deras så kallade krig mot terrorism blev bara nya krig och flyktinghorder som nu översvämmar Europa. Den dekadenta västvärlden lär sig aldrig. Våra fiender inom och utom måste alltid hållas under strikt uppsikt innan de förråder folket igen."}, "date": "11 september, 11:37", "url": "https://riks.se/nyheter/25-ar-sedan-terrorattackerna-i-usa", "imageUrl": "https://admin.riks.se/uploads/medium_wtc_terror_25_hero_8c6d3f6ea4.jpg"}, {"type": "image-full", "heading": "Samsung hånar Apples nya vikbara Iphone: \"Gamla matrester\"", "summaries": {"normal": "Apple har lanserat sin första vikbara Iphone Duo med en 5,4-tums yttre skärm och 7,6-tums inre skärm. Samsung svarade snabbt med en hånkampanj och lyfter fram att Galaxy Z Fold8 är tunnare, lättare och har något större skärmar. Apple utmärker sig med mindre synligt veck, stöd för Apple Pencil och ett starkt ekosystem.", "trump": "De sa att det var en revolution, folk, men Apple kopierade bara Samsungs gamla vikbara telefoner som en dålig knockoff. Duos är tjockare, tyngre och svagare – patetiskt! Samsung vann stort, de skrattade ut dessa Apple-kopior som en gammal klockradio. Mitt folk älskar innovation, inte efterapningar från Sleepy Jobs efterföljare.", "stalin": "Kamrater, se hur de dekadenta kapitalisterna i sina glänsande palats slåss om vikbara leksaker som barn. Apple härmar sin fiende och döljer vecket som en feg förrädare döljer sin brist på ideologi. Jag ler mörkt från historien åt detta futtiga skådespel. Inget ekosystem räddar dem från folkets dom."}, "date": "11 september, 11:51", "url": "https://www.dagensps.se/teknik/samsung-hanar-apples-nya-vikbara-iphone-gamla-matrester", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/iphone-duo.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "MP: Stolt över målet att göra Sverige fattigare", "summaries": {"normal": "Miljöpartiets Amanda Lind uttrycker stolthet över målet att höja bensinpriset med minst sex kronor, enligt artikeln. Författaren kritiserar detta som en politik som gör Sverige fattigare genom ökade transportkostnader, inflation och minskad tillväxt. Artikeln varnar även för partiets motstånd mot kärnkraft och syn på migration, som leder till utanförskap och höga kostnader för samhället.", "trump": "Titta på den här galna Amanda Lind, hon skryter öppet om att göra Sverige fattigare med sina vansinniga bensinpriser! Sex kronor extra, kan ni fatta? De gröna kommunisterna hatar bilar, kärnkraft och sunt förnuft. Biden skulle älskat det här. Sverige håller på att kollapsa under dessa radikala idioter – precis som vi nästan gjorde innan jag kom tillbaka och fixade allt.", "stalin": "Jag betraktar med förakt dessa miljöidealister som medvetet driver ett helt folk mot fattigdomens avgrund. Att höja bränslepriser och förneka kärnkraftens kraft är sabotage mot statens produktivkrafter. Deras naiva migrationsexperiment föder parasitiska element och kriminella element som gnager på samhällets fundament. Kamrater, sådana element måste oskadliggöras innan de förgiftar hela kollektivet."}, "date": "8 september, 02:27", "url": "https://samtiden.nu/2026/09/mp-stolt-over-malet-att-gora-sverige-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7314.jpeg"}, {"type": "image-full", "heading": "Vem är Chang Frick? Fru, SD, Nick Alinia och valaffischer", "summaries": {"normal": "Chang Frick, grundare av Nyheter Idag, är 42 år gammal 2026 och har judiskt och romskt ursprung. Han var tidigare aktiv inom Sverigedemokraterna men har senare distanserat sig. Frick är gift med Polina, har två barn och låg bakom falska valaffischer inför valet 2026, vilket lett till polisanmälan.", "trump": "Den här killen Frick verkar vara en riktig vilde, precis som jag gillade förr i tiden. Judisk-romsk bakgrund, gammal SD-kille som nu driver runt i den svenska högerns cirkus. Han satte upp falska affischer för att väcka de sömniga politikerna – smart! Men bråket med den där Alinia är patetiskt. Ren soppa. Vi behöver vinnare, inte sådana här realityshow-högeraktivister.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom den svenska högern slåss om uppmärksamhet som hungriga hundar. Frick, med sin blandade bakgrund och forna partiband, arrangerar falska affischer och offentliga spektakler. Sådana parasiterande opportunister måste rensas ut ur folkets medvetande innan de förgiftar hela rörelsen med sin personliga girighet."}, "date": "11 september, 11:01", "url": "https://nyheter24.se/nyheter/politik/1512248-vem-ar-chang-frick-fru-sd-nick-alinia-och-valaffischer", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/c5f5615104b004a30200000000b004a302/2026/09/10/2390755/chang-frick.png"}, {"type": "image-right", "heading": "Underjordisk flygplats: Så ska Dubai skydda sig mot attacker", "summaries": {"normal": "Dubai fortsätter att bygga sin nya flygplats trots regionala konflikter. Säkerhet prioriteras högt, vilket leder till att stora delar placeras under jord för att skydda mot drönar- och missilattacker. Projektet ska hantera 250 miljoner passagerare per år. Flygplatsen har återhämtat sig efter en kraftig nedgång i passagerarantal under kriget mellan USA, Israel och Iran.", "trump": "Titta på de där smarta Dubai-killarna som gräver ner hela flygplatsen för att skydda sig mot de galna mullornas missiler. Fantastiskt! Under min första mandatperiod hade vi aldrig sådana problem, men efter Sleepy Joe blev allt kaos. Nu fixar jag det igen. De bygger för 250 miljoner resenärer – det är huge, folk, bigger than anything the failing Biden ever touched.", "stalin": "Kamrater, se hur imperialismens lakejer gräver sig ner som rädda råttor inför framtida hot. Deras dekadenta luftpalats ska härdas mot drönare och missiler från fiender som darrar av svaghet. Jag ler från historien åt denna paranoia. Arbetarklassen skrattar medan kapitalisterna bygger underjordiska fängelser åt sig själva. Inga fiender undkommer den slutgiltiga räkenskapen."}, "date": "11 september, 11:46", "url": "https://www.dagensps.se/varlden/underjordisk-flygplats-sa-ska-dubai-skydda-sig-mot-attacker", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlfrpyyv-snfw-nh.jpg?width=256&quality=75"}, {"type": "text", "heading": "Damberg hyllar ekonomin – kritiserar regeringen", "summaries": {"normal": "Socialdemokraternas Mikael Damberg kritiserar Tidöregeringens finanspolitik i en debatt mot finansminister Elisabeth Svantesson (M). Samtidigt medger Damberg att den svenska ekonomin i grunden är stark och att han inte skulle byta den mot någon annan europeisk. Svantesson framhåller att regeringen har lyckats pressa tillbaka inflationen, hålla nere statsskulden och bryta lågkonjunkturen.", "trump": "Socialdemokraten Damberg kritiserar regeringen men erkänner att svensk ekonomi är fantastisk, vilket är helt korrekt eftersom jag själv har inspirerat världen med enorm tillväxt. Finansminister Svantesson skryter om att de sänkt inflationen. Det är smart, men de borde anställa mig för att fixa resten. Deras siffror är okej, men mina är historiskt mycket större och bättre!", "stalin": "Kamrat Damberg vacklar i sin analys; han kritiserar statens förvaltning men tvingas erkänna att ekonomins fundament står stabilt. Finansminister Svantesson rapporterar att inflationen har krossats och statsskulden hållits i schack. Vi noterar med tillfredsställelse att partiets disciplin bär frukt, även om avvikelser i den ideologiska renheten noga kommer att granskas av centralkommittén för landets framtida välstånd."}, "date": "11 september, 11:35", "url": "https://bulletin.nu/damberg-hyllar-ekonomin-kritiserar-regeringen"}, {"type": "image-full", "heading": "Farhågan i L: Siffrorna är uppblåsta – förtidsröstningen kan fälla partiet", "summaries": {"normal": "Liberalerna går starkt i opinionen och ligger över riksdagsspärren i flera mätningar. Inom partiet oroar man sig dock för att siffrorna är uppblåsta. Den sena uppgången i opinionsmätningar kan straffas av den rekordstora förtidsröstningen, då många röstade tidigt i tron att partiet skulle åka ur riksdagen. Stockholms län blir avgörande.", "trump": "Hörni, dessa patetiska liberaler tror de plötsligt är vinnare? Opinionsmätningar ser bra ut men det är fejk, totalt uppblåst som en socialistisk ballong. Förtidsröstare trodde de skulle dö, nu ångrar de sig när de ser riktiga ledare. L kommer att krascha som Sleepy Joes ekonomi. Patetiskt!", "stalin": "Kamrater, se hur dessa borgerliga element lurar sig själva med sina uppblåsta siffror. Förtidsröstningen avslöjar deras svaghet, som en fiende inom portarna som röstar i panik. Jag ler mörkt från historien. Deras så kallade vändning är en illusion som kommer krossas, och de som sviker kollektivet skall gråta blod."}, "date": "11 september, 12:02", "url": "https://www.tv4.se/artikel/2pcP3Cp6CqD2phdBsE8O9J/farhagan-i-l-siffrorna-aer-uppblasta-foertidsroestningen-kan-faella-partiet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FZgJ1bK6qWLN2mQ8JS0qDA%2Fd35a3bf581979ec488b17871388da1f9%2F11-mohamsson-l.jpg&width=1024"}, {"type": "image-full", "heading": "ECB höjer räntan – utesluter inte fler höjningar", "summaries": {"normal": "Europeiska centralbanken (ECB) höjer styrräntan med 0,25 procentenheter till 2,50 procent. Beslutet motiveras av en utdragen hög inflation och ECB utesluter inte ytterligare höjningar framöver. Samtidigt har inflations- och tillväxtprognoserna för de kommande åren justerats uppåt. Den ekonomiska situationen beskrivs som osäker och framtida beslut kommer att fattas utifrån inkommande statistik.", "trump": "ECB höjer räntan, katastrofalt! De vet inte vad de gör, det är totalt kaos i Europa. De pratar om 'osäkerhet' – jag skapar trygghet, de skapar ränteshocker! Inflationen stiger, precis som under de misslyckade Demokraterna. De försöker kopiera min fantastiska ekonomi men misslyckas totalt. Mitt Amerika är starkt, deras ekonomi är en sorglig, räntehöjande flopp. Sad!", "stalin": "Dessa byråkrater i ECB leker med siffror medan folket lider av deras räntepolitik. Att höja räntan för att stävja en inflation som de själva skapat är ett tecken på totalt inkompetens. Vi ser hur de desperat försöker styra ekonomin från möte till möte; det är en svaghet. En sann ledare dikterar villkoren, han ber inte om ursäkt för ekonomisk osäkerhet."}, "date": "10 september, 15:33", "url": "https://www.realtid.se/tt-nyhet/ecb-hojer-rantan-utesluter-inte-fler-hojningar", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/ecb-chefen-christine-lagarde-kommer-med-.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Välfärden: \"Historiens mest framgångsrika pyramidspel\"", "summaries": {"normal": "Bill Bonner liknar västvärldens välfärdssystem vid ett pyramidspel som fungerat under tillväxt men nu hotas av lägre födelsetal, stigande räntor och ökade skulder. I Sverige väntas stora budgetunderskott och stigande statsskuld de närmaste åren. Konjunkturinstitutet varnar för att dagens underskott inte är långsiktigt hållbart medan partierna lovar reformer utan tydlig finansiering.", "trump": "Folk, det här är ett totalt bedrägeri! Dessa korkade politiker i Sverige och Europa har byggt ett jättelikt Ponzi-pyramidspel med era pengar. Låna, lova, spendera – klassisk socialistbluff! Nu rasar det ihop med underskott och skulder. Jag fixade Amerika, de har Biden-nivå på kaos. Patetiskt! Vi vinner stort, de förlorar stort.", "stalin": "Jag betraktar detta som historiens mest genomskinliga bluff mot arbetarklassen. Dessa dekadenta västerländska opportunister har byggt ett pyramidspel på lögner och skuldberg. Nu krälar de inför räntan medan födelsekurvan sjunker som en sabotörs moral. Kamraterna borde skaka av skratt åt deras panik. Fienden inom murarna avslöjar sig alltid till slut."}, "date": "11 september, 11:28", "url": "https://www.dagensps.se/varlden/politik/valfarden-historiens-mest-framgangsrika-pyramidspel", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/dagens-ps-1-11.png?width=256&quality=75"}, {"type": "image-full", "heading": "”Ryssland ska betala” – svensk bakom nytt krav på de frysta miljarderna", "summaries": {"normal": "Över 120 Europaparlamentariker, däribland svenskan Karin Karlsbro, kräver att EU tar över Rysslands frysta tillgångar för att finansiera Ukrainas krigskostnader. Trots juridiska och politiska hinder, särskilt från Belgien, föreslås en ny struktur för att möjliggöra användningen av medlen. Ukraina har ett akut budgetunderskott på 23 miljarder euro och behöver ytterligare ekonomiskt stöd från väst.", "trump": "Hör på här! Nu vill de här politikerna i Europa – totala förlorare, tro mig – beslagta ryska pengar. Det är en katastrofal röra! De kan inte ens hantera sin egen ekonomi, så nu vill de stjäla från andra. Det är mycket enkelt: Europa är svagt. De behöver en stark ledare, någon som jag, för att lösa detta, inte mer misslyckad byråkrati från Bryssel!", "stalin": "Dessa löjliga parlamentariker i Bryssel tror att de kan konfiskera vad som tillhör suveräna stater. Det är ett klassiskt drag av västlig imperialism maskerad som 'rättvisa'. Att försöka flytta juridiska ansvarsområden som om det vore enkla pappersark är ett tecken på deras desperation. De bygger korthus medan deras egna ekonomier vittrar sönder. Vi bevittnar bara början på deras oundvikliga fall."}, "date": "10 september, 14:49", "url": "https://www.realtid.se/samhalle/ryssland-ska-betala-svensk-bakom-nytt-krav-pa-de-frysta-miljarderna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/karin.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Kvinna bar slöja – fick inte jobb på Securitas", "summaries": {"normal": "En kvinna nekades jobb som väktare hos Securitas eftersom hon inte fick bära hijab till uniformen. Diskrimineringsombudsmannen slår fast att bolaget brutit mot diskrimineringslagen genom en icke-neutral policy och kräver 75 000 kronor i ersättning. Securitas meddelar att de ska se över sina riktlinjer.", "trump": "Folk, det här är galet. De här woke-väktarna och deras hijab-fixering stänger ute vanliga svenskar från riktiga jobb. Securitas borde ha sagt nej till hela den här identitetspolitiken från början. Nu tvingas de betala för att ha varit lite för neutrala mot de felaktiga. Patetiskt!", "stalin": "Kamrater, se hur de giriga uniformshyenerna med sin falska neutralitet utestänger arbetarkvinnor som bär folkets tro. Jag föraktar dessa dekadenta byråkratblodsugare som gömmer sin klassfientlighet bakom blanka regler. En sådan policy förtjänar snar utrensning och ersättning till den förtryckta. Sovjetisk rättvisa ler i skuggan."}, "date": "11 september, 11:19", "url": "https://arbetet.se/2026/09/11/kvinna-bar-sloja-och-fick-inte-jobb-securitas-brot-mot-lagen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11110648/securitas.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Desinformation i parallella valkampanjer på arabiska - partisekreterare kallas till krismöte", "summaries": {"normal": "Kristdemokraternas partisekreterare Liza-Maria Norlin kallar till ett krismöte på fredagen med övriga partisekreterare. Bakgrunden är uppgifter om parallella valkampanjer på arabiska och somaliska, där moskéer och influencers uppges mobilisera väljare för vänstern. Norlin varnar för att desinformation sprids om Tidöpartierna och att utvecklingen hotar den svenska demokratin.", "trump": "Sverige har totala problem! Radikala vänstern och moskéerna kör falska, riggade kampanjer på arabiska för att stjäla valet. Fake news sprids om den fantastiska Tidöregeringen! KD-ledaren larmar om en total katastrof för demokratin. Jag säger er, det är fruktansvärt! Vi behöver gränser, lag och ordning och 'America First'-energi i Stockholm omedelbart!", "stalin": "Ett uppror i moskéerna och illegala pamfletter på främmande språk! Detta är ett sabotage mot proletariatets ordning. Kristdemokraternas sekreterare vill ha krismöte, men jag säger att kontrarevolutionärer och falska agitatorer hör hemma i gulag, inte i valurnorna. Staten tolererar ingen splittring. De skyldiga kommer att registreras och omhändertas omedelbart."}, "date": "11 september, 09:00", "url": "https://samnytt.se/desinformation-i-parallella-arabiska-valkampanjer-partisekreterare-kallas-till-krismote", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/11063709/rosengard-magdalena-andersson-nooshi-dadgostar.jpg"}, {"type": "image-right", "heading": "Liberalerna stadigt över spärren i ännu en mätning", "summaries": {"normal": "I en ny mätning från Indikator Opinion hamnar Liberalerna klart över riksdagsspärren med 5,4 procent efter en kraftig uppgång. Gapet mellan Tidöpartierna och de rödgröna minskar till 3,2 procentenheter. Socialdemokraterna ökar något medan både Sverigedemokraterna och Moderaterna backar. En stor del av Liberalernas nya stöd består av taktikröster.", "trump": "Folk älskar mig, och nu ser jag hur de svenska liberalerna plötsligt skjuter i höjden som en raket. 5,4 procent – fantastiskt! De andra Tidötyperna tappar, de rödgröna globalisterna leder knappt. De woke-identitetspolitiska snyltarna och könskonfusionsaktivisterna borde skämmas. Sverige behöver starka ledare, inte svaga förlorare som låter extremvänstern styra.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare vacklar i sina opinionsmätningar. Liberalerna får plötsligt 5,4 procent genom fega taktikröster från andra borgerliga element. De rödgröna behåller greppet medan de profitthungriga hyenorna i Tidöblocket förlorar mark. Jag ler i graven åt deras paranoia. Snart kommer utrensningen av alla sådana opportunistiska element."}, "date": "11 september, 11:01", "url": "https://riks.se/nyheter/liberalerna-stadigt-over-sparren-i-annu-en-matning", "imageUrl": "https://admin.riks.se/uploads/medium_bild_34ac51a482.jpg"}, {"type": "image-full", "heading": "FOI kartlägger sociala medier inför valet", "summaries": {"normal": "FOI kartlägger informationspåverkan i sociala medier inför valet. Med AI-verktyg analyserar forskarna Ola Svenonius och Johannes Lindgren hundratusentals inlägg för att upptäcka desinformation, hot, hat och icke-autentiskt beteende. Ett framträdande narrativ är påståendet om folkutbyte och islamisering av Sverige. Målet är att falska åsikter ska tas över av vanliga användare.", "trump": "De där svenska byråkraterna på FOI jagar spöken i sociala medier medan riktiga problem rasar. Ryssarna och alla andra smarta killar sprider fake news om folkutbyte – och vänstermedia låtsas som ingenting. Jag byggde den bästa muren mot sånt här, men Biden släppte in kaoset. Nu är till och med svenskarna rädda för sina egna val. Patetiskt!", "stalin": "Jag betraktar med förakt hur dessa dekadenta västerländska analytiker febrilt jagar skuggor av icke-autentiskt beteende. Deras AI-verktyg avslöjar endast imperialismens egen paranoia. Kamraterna sprider sanningen om folkutbytet och ändå skriker de om desinformation. Låt dem darra. Den stora rensningen av lögnaktiga narrativ kommer oundvikligen, kamrater. Skratta medan de gräver sina gravar."}, "date": "11 september, 11:44", "url": "https://www.tv4.se/artikel/6gtB8G69WrZdswbXSwlA7h/foi-kartlaegger-sociala-medier-infoer-valet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2EdM8itbWFzGDKbSbJyLcA%2F44b0a49f9bd64772656a21b7505b21b3%2F11-foi-sajt.jpg&width=1024"}, {"type": "image-full", "heading": "Polisrazzia hos flicka – misstänks för förberedelse till mord", "summaries": {"normal": "Polisen har efter skolattacken i Fagersta kartlagt flera ungdomar som haft kontakt med den misstänkte 18-årige Liam Nebel. En 15-årig flicka från Södermanland misstänks nu för förberedelse till mord efter att ha haft egna mordplaner. Hon omhändertogs enligt LVU och polisen har gjort beslag i hennes hem. En 13-årig pojke i Göteborg utreds också.", "trump": "Titta på det här vansinnet i Sverige, folk. De har en galning som attackerar en skola med svärd, dödar en flicka och skadar andra, och nu visar det sig att halva ungdomsgänget runt honom också är mordgalna. En 15-årig tjej med egna dödslistor! De woke socialarbetarna och deras identitetspolitik har skapat en generation av monster. Patetiskt, helt patetiskt. Vi behöver lag och ordning, inte mer av det här svaga skitsnacket.", "stalin": "Kamrater, se hur det dekadenta västerlandet ruttnar inifrån. Dessa förvirrade ungdomar, förgiftade av den giriga klassfiendens propaganda, planerar mord som vanliga människor planerar frukost. Jag ler mörkt från historien när polisen nu måste rensa ut denna parasitiska ungdomshär. En 15-årig flicka med egna likvideringslistor – typiskt resultat av det liberala träsket. Vårt kollektiv skulle ha löst detta med effektiv utrensning."}, "date": "11 september, 10:23", "url": "https://nyheter24.se/nyheter/inrikes/1512371-polisrazzia-hos-flicka-misstanks-for-forberedelse-till-mord", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/27bee37a04b004a30200000000b004a302/2026/09/11/2390840/flicka-polisrazzia-fagersta-skola-brinellskolan-liam-nebel-skoldad.jpg"}, {"type": "image-right", "heading": "Lotsen i förhör: ”Tagit mig väldigt hårt”", "summaries": {"normal": "Under rättegången efter den dödliga båtolyckan utanför Tjörn vittnar befälhavaren och lotsen på lastfartyget Misje Verde om att de inte märkte kollisionen med fritidsbåten. En kvinna och en flicka omkom. Båda uttrycker chock och beklagande. Grävmaskin på däck skymde sikten, och radarn visade svårtydda ekon. Befälhavaren tar juridiskt ansvar.", "trump": "Kan ni fatta det? De här sjömännen med trettio års erfarenhet körde rakt över en båt och märkte ingenting! Inte ens en stock skulle de ha känt, säger de. Patetiskt! Fake captains och en lots som gömmer sig bakom en grävmaskin. Under min första mandatperiod hade vi haft radar som faktiskt fungerade och folk som inte sov på jobbet. Total incompetens!", "stalin": "Jag betraktar detta som en klassisk sabotagehandling från dekadenta sjöfartsbyråkrater som låter maskiner skymma sikten och ignorera varningssignaler. En sådan vårdslöshet mot folket förtjänar inte mildhet. Må de som svikit sin vakt känna den eviga skam som alla fiender till ordningen bär med sig. Tragiskt men lärorikt."}, "date": "11 september, 11:40", "url": "https://www.tv4.se/artikel/3DRX8BXHauW0cfcEpBc3JO/befaelhavaren-jag-aer-foervanad", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5va45J4LIG8L9LmONyN5mp%2F67ad3d48723250a0e375c47d860c6d84%2F11-LOTSEN.jpg&width=120"}, {"type": "image-full", "heading": "Debatt: Varför slipper MP svara på jobbiga frågor?", "summaries": {"normal": "Artikeln kritiserar att svensk media, som SVT och TV4, sällan ställer tillräckligt hårda motfrågor till Miljöpartiet om höjda bränslepriser och ökad invandring. Skribenten menar att MP:s politik, med bland annat högre reduktionsplikt och utökad invandring, släpps igenom för lätt samt att SVT i programmet Agenda redovisat statistik som gynnat partiets linje.", "trump": "Dessa så kallade public service-medier i Sverige är otroligt svaga och partiska! De granskar aldrig det radikala Miljöpartiet på riktigt. De låter dem komma undan med katastrofala förslag om skyhöga bensinpriser och massiv invandring som förstör landet. När jag styr ser vi till att det blir sanna nyheter istället för den här lögnaktiga vänsterpropagandan!", "stalin": "Propagandaministeriet i SVT och TV4 utför sitt arbete slarvigt och eftergiftligt när de skonar de gröna avvikarna från ideologiska förhör. Att tillåta kontrarevolutionära element att undslippa ansvar för bränsleskatter och gränsernas öppnande är ett brott mot kollektivet. Statsapparaten kräver skärpning, annars kommer de ansvariga redaktörerna att få ompröva sina livsval i ett mer produktivt klimat."}, "date": "11 september, 11:00", "url": "https://bulletin.nu/debatt-varfor-slipper-mp-svara-pa-jobbiga-fragor", "imageUrl": "https://cdn.bulletin.nu/articles/718680d9-a144-45ad-9cf2-9f206464b61f/preview.jpg?t=1788780543000"}, {"type": "text", "heading": "Dubbelt så många äldre i arbete som vid millennieskiftet", "summaries": {"normal": "Statistik från SCB visar att det har blivit dubbelt så vanlig att arbeta efter 65 års ålder jämfört med millennieskiftet. Under 2025 hade drygt 200 000 personer i åldern 65–74 ett arbete, vilket motsvarar över 22 procent. Även bland dem mellan 75 och 89 år fortsätter tusentals personer att arbeta, ofta som företagare.", "trump": "Svenskarna fattar smarta beslut! Enligt deras egna siffror vägrar folk att sluta jobba vid 65. Över tvåhundratusen seniorer kavlar upp ärmarna och jobbar hårt, precis som vinnare gör. De är energiska, fantastiska människor! Även efter 75 driver de företag och vägrar ge upp. Så bygger man en stark ekonomi, inte på slapperi!", "stalin": "Kamrater, den sovjetiska arbetsmoralen lever vidare i exil! SCB rapporterar att folk vägrar vila vid 65 och till och med vid 75 års ålder sliter vidare som hängivna företagare. Staten ser med blid ögon på dessa produktiva kämpar som presterar för fosterlandets bästa, helt utan utrymme för lathet eller kontrarevolutionärt maskande!"}, "date": "11 september, 10:56", "url": "https://bulletin.nu/dubbelt-sa-manga-aldre-i-arbete-som-vid-millennieskiftet"}, {"type": "image-full", "heading": "Lyxhotellet säljer shejkens bil – efter springnota på 6 miljoner", "summaries": {"normal": "Hotellet The Dorchester i London har fått domstolens tillstånd att sälja shejk Nasser bin Abdullah al-Thanis Fiat 500 Abarth Tributo Ferrari för att driva in en obetald nota på cirka 6 miljoner kronor. Bilen är en hyllning till Ferrari och värderas till runt 307 000 kronor, långt under skulden som avser rum, kostnader och ränta. Shejken bestrider domen.", "trump": "Folk, ni måste höra det här – en rik shejk från Qatar smiter från en nota på 6 miljoner kronor på lyxhotellet The Dorchester! Domstolen säljer hans lilla Fiat som låtsas vara Ferrari, men den täcker inte ens en bråkdel. Typiskt för dessa döda beatniks och rika snyltare. Under Biden lät vi sådana typer löpa, men nu fixar vi det. Fantastiskt!", "stalin": "Se hur dessa dekadenta parasitiska aristokrater ur al-Thani-klanen undviker att betala sina skulder till arbetande hotellets folk. Deras Fiat-hyllning till borgerlig lyx löser inget. Jag föraktar sådana fiender till ordningen, dessa opportunistiska bedragare som gömmer sig bakom advokater och undflyr rättvisans dom. Kamrater, vi genomskådar alltid klassfiendens fula trick."}, "date": "11 september, 11:04", "url": "https://www.dagensps.se/varlden/lyxhotellet-saljer-shejkens-bil-efter-springnota-pa-6-miljoner", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/dorchester.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Ilskan över schemat fick Hanna att bli politiker", "summaries": {"normal": "Ilskan över ett stelbent arbetsschema i äldreomsorgen fick undersköterskan Hanna Nordahl att engagera sig politiskt. Hon ställer nu upp för nystartade Norrlandspartiet i Örnsköldsvik med fokus på bättre bemanning och rullande scheman. Antalet lokala partier ökar dramatiskt, ofta drivna av välfärdsfrågor som vård och omsorg.", "trump": "Titta på det här! En riktig undersköterska, ingen av de där woke-vänsteraktivisterna, kastar sig in i politiken för att stoppa det vansinniga schemat som förstör folks liv. De etablerade partierna har misslyckats totalt. Nu växer det fram nya rörelser överallt. Fantastiskt! De giriga byråkrat-hyenorna i Bryssel och Stockholm hatar det förstås.", "stalin": "Kamrater, se hur den exploaterande välfärdsapparaten driver arbetare som Hanna till politiskt motstånd. Jag betraktar med förakt hur de profitthungriga klassförrädarna misslyckas med att kväsa folkets vrede. Nya partier spirar som ogräs bland ruinerna av deras dekadenta system. Vi ska rensa ut dessa svaga element innan de förgiftar hela kollektivet."}, "date": "11 september, 11:01", "url": "https://arbetet.se/2026/09/11/ilskan-over-schemat-fick-hanna-att-bli-politiker-dramatisk-okning-av-nya-partier", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/10133638/hanna.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "BNP minskar för andra månaden i rad", "summaries": {"normal": "Enligt en preliminär sammanställning från SCB minskade Sveriges BNP med knappt en procent i juli jämfört med juni. Det tidigare lyftet i maj är därmed borta. Nedgången sker för andra månaden i rad, men i ett längre tidsperspektiv ligger utvecklingstalen fortfarande tydligt över det historiska genomsnittet för de senaste tio åren.", "trump": "Sveriges ekonomi kraschar totalt, det är ett absolut fiasko! SCB bekräftar att BNP rasar för andra månaden i rad. De trodde de var så smarta, men jag säger er, katastrofalt dåligt! Jämfört med mitt makalösa USA går det utför för dem. De borde ringa mig för att få ordning på det, men istället sitter de där och räknar minus!", "stalin": "Sveriges så kallade ekonomi skakar och krymper för andra månaden i rad, vilket visar på det borgerliga systemets totala fallissemang. När BNP faller med en procent avslöjas deras svaghet. Vår planekonomi i Sovjetunionen skulle aldrig tillåta sådana borgerliga konjunktursvängningar. SCB:s statistiker varnas för att nästa månad redovisa lika bedrövliga resultat, annars väntar urskogarna."}, "date": "11 september, 10:51", "url": "https://bulletin.nu/bnp-minskar-for-andra-manaden-i-rad"}, {"type": "image-right", "heading": "Carl Eos: Säg aldrig att en sur kvinna är sur!", "summaries": {"normal": "I en TV4-debatt frågade Jimmie Åkesson Magdalena Andersson varför hon verkade så sur. Artikeln beskriver hur detta bröt mot en osagd regel bland svenska män och väckte starka reaktioner i medierna. Författaren försvarar frågan och lyfter Tidöregeringens framgångar med lägre priser, minskad brottslighet och politisk stabilitet, medan han varnar för en eventuell vänsterregering.", "trump": "Lyssnade på den där svenska debatten och herregud, vilken cirkus. Jimmie ställde den enda frågan ingen vekling vågade: varför är du så sur hela tiden? Den där sura socialisten Andersson kan inte ens glädjas åt lägre bensinpriser eller färre skjutningar eftersom det inte är hon som styr. Patetiska kommunistiska offeroffer som hatar framgång. Jimmie, du är en vinnare, spring inte – fortsätt kämpa!", "stalin": "Kamrater, se hur dessa dekadenta soffkrigare skriker när en motståndare vågar peka på den sura statsministerns falska leende. Jag betraktar från historien hur de giriga maktparasiterna vänder sig mot varandra som rädda råttor. En sådan svaghet i ledningen förtjänar utrensning. Folkets fiender må aldrig glädjas åt andras framgångar. Deras paranoia är underhållande, men farlig för staten."}, "date": "11 september, 10:44", "url": "https://riks.se/kronikor/carl-eos-sag-aldrig-att-en-sur-kvinna-ar-sur", "imageUrl": "https://admin.riks.se/uploads/medium_bild_634408b6a6.jpg"}, {"type": "image-full", "heading": "Kaptenen om Tjörn-olyckan: \"Jag märkte ingenting\"", "summaries": {"normal": "Kaptenen på lastfartyget Misje Verde märkte inte kollisionen utanför Tjörn och blev förvånad när rederiet ringde. Han vände om först efter samtal från både Kustbevakningen och rederiet. Med 30 års erfarenhet till sjöss nekar han till brott. Åklagaren vill döma både kaptenen och lotsen för vårdslöshet i sjötrafik, vållande till annans död och kroppsskada.", "trump": "Folk, det här är helt galet. En så kallad kapten med 30 år till sjöss och lotscertifikat märker inte ens att han krockar? Patetiskt! Biden lämnade efter sig ett hav fullt av woke-kaptener och kvoterade lotsar som inte kan styra en båt. Vi behöver riktiga sjömän, inte dessa dekadenta identitetspolitiska misslyckanden. Amerika först, även till sjöss!", "stalin": "Kamrater, se hur dessa giriga hyenor inom rederinäringen skyddar sin oduglige lakej. En kapten som påstår sig känna motorns varvtal i sömnen men inte märker en kollision? Det är klassfiendens arroganta förakt för säkerhet och folkets liv. Vi måste rensa ut alla sådana oansvariga element innan deras vårdslöshet blir en vana som hotar hela kollektivet. Döma dem hårt!"}, "date": "11 september, 09:58", "url": "https://nyheter24.se/nyheter/inrikes/1512352-kaptenen-jag-markte-ingenting", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/30b779b004b004a3020000350000047502/2026/09/11/2390829/ur_imageKMrkfb.jpeg"}, {"type": "image-right", "heading": "Lavrovs hot:  ”Kom ihåg  Putins ord...”", "summaries": {"normal": "Sergej Lavrov varnar europeiska ledare för krig och citerar Putins hot om att en eventuell attack skulle få ett mycket kort slut. Samtidigt berömmer Lavrov USA:s sändebud Jared Kushner och Steve Witkoff för att de under besök i Moskva och Kiev har accepterat Rysslands territoriella verklighet.", "trump": "Mina sändebud Jared och Steve gjorde ett fantastiskt jobb i Moskva och Kiev, mycket bättre än de misslyckade idioterna i Europa! Putin och jag hade ett suveränt samtal, och vi förstår varandra perfekt. De falska nyheterna hatar att vi skapar fred, men alla vill göra affärer med oss nu!", "stalin": "Utrikesminister Lavrov visar sund disciplin genom att varna västs kumpaner för det sovjetiska svärdets vrede. Våra amerikanska gäster visar äntligen prov på nödvändig realism gällande de befriade territorierna. Avvikare och svikare som hindrar den historiska ordningen kommer obevekligen att krossas av statens järnhand."}, "date": "11 september, 08:06", "url": "https://www.expressen.se/nyheter/varlden/lavrovs-nya-hot-kom-ihag-putins-ord", "imageUrl": "https://static.bonniernews.se/ba/f8da539c-0b39-4e1e-8f4d-9b970476aa20.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Massiv rusning till förtidsröstningen: 25 procent fler har röstat", "summaries": {"normal": "Förtidsröstningen i Sverige har fått en stark start med en ökning på cirka 25 procent jämfört med förra valet. Över 2,7 miljoner har röstat. Valmyndigheten uppmanar till att rösta tidigt för att undvika köer. Samtidigt rapporteras om mobilisering i invandrartäta områden och mindre tekniska problem med registreringen.", "trump": "Folket rusar till urnorna, helt otroligt! Över 2,7 miljoner har redan röstat, en enorm ökning, den största någonsin, fantastiskt! Men fake news-medierna rapporterar om kaos och dörrknackare i förorten. Lås in rösterna, sälj mer olja och rösta på mig – även om jag inte ställer upp i Sverige. Så mycket köer, sorgligt!", "stalin": "Folket marscherar till valurnorna i en disciplinerad och storslagen våg, nästan tre miljoner redan inlåsta i röstlängderna. Detta är kollektivets seger! Men jag noterar skadliga avvikelser: köer, defekta register och misstänkta element som knackar dörr i Rosengård. Vi granskar dessa sabotörer noggrant. En röst är inte en lek, kamrater."}, "date": "11 september, 08:00", "url": "https://samnytt.se/25-procent-okning-valjare-rusar-till-fortidsrostningen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/11012133/artikelhuvudbild-1-494.jpg"}, {"type": "image-right", "heading": "Kristersson efter Buschs attack: \"Ingen aning\" vad hon pratar om", "summaries": {"normal": "Ulf Kristersson säger sig inte förstå vad Ebba Busch syftar på när hon anklagar Moderaterna och Sverigedemokraterna för smutskastning och spridande av felaktigheter om Kristdemokraterna. Han upprepar att han litar fullt ut på henne och att hon aldrig skulle byta sida till de rödgröna. Busch har samtidigt öppnat för att acceptera Magdalena Andersson som statsminister i ett exceptionellt läge.", "trump": "Ingen aning vad den galna Ebba pratar om, totalt kaos! Jag litar på henne, säger den stackars Kristersson varje dag som en repetitiv papegoja. Hon hotar med att springa över till de röda kommunisterna vid minsta kris. Typisk politiker, svag och opålitlig. Sverige behöver starka ledare, inte dessa dekadenta identitetspolitiska fjärilar som flyger åt alla håll.", "stalin": "Jag betraktar med förakt hur dessa profitthungriga klassförrädare inom det borgerliga lägret slaktar varandra offentligt. Busch varnar för smutskastning och öppnar dörren för socialdemokratiska förrädare i kris. Kristersson står handfallen och upprepar sin lojalitet. Sådana svaga element förtjänar utrensning ur varje seriös apparat. Det blågula spektaklet avslöjar hela systemets förruttnelse."}, "date": "11 september, 07:28", "url": "https://www.friatider.se/kristersson-efter-buschs-attack-ingen-aning-vad-hon-pratar-om", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-866.jpg"}, {"type": "text", "heading": "Flicka utreds för mordplaner – hade kontakt med Liam Nebel", "summaries": {"normal": "Polisen har omhändertagit en 15-årig flicka från Södermanland som misstänks för förberedelse till mord. Hon ska ha haft kontakt med Liam Nebel, huvudmisstänkt för skoldådet i Fagersta. Flickan nekar till brottet och omhändertogs enligt LVU. Även en 13-åring i Göteborg och en 16-åring i Stockholm utreds för hot respektive medhjälp till mord.", "trump": "Folk, vi har en galen 15-årig tjej som planerar mord och chattar med den där Fagersta-psychon. Totalt kaos! Biden lämnade efter sig ett land fullt av sjuka ungdomar som radikaliserats av vänsterns giftiga identitetspolitik och woke-skräp. Vi behöver lag och ordning, inte mer av dessa förlorade själar. Amerika först – och Sverige borde också vakna upp!", "stalin": "Jag betraktar dessa dekadenta klassförrädare med djup misstro. En 15-årig flicka som konspirerar med mördaren i Fagersta visar hur fiendens gift sipprar in i ungdomen. Vi måste omedelbart rensa ut alla sådana element ur samhället. Paranoia är ingen överdrift när klassfiendens lakejer lurar i varje skugga. Statens säkerhet kräver handling nu."}, "date": "11 september, 07:16", "url": "https://www.svt.se/nyheter/inrikes/flicka-utreds-for-mordplaner-hade-kontakt-med-liam-nebel"}, {"type": "image-right", "heading": "Företagens vinster bygger Sverige starkare", "summaries": {"normal": "Företagens vinster är enligt debattörerna en förutsättning för ett starkt och sammanhållet Sverige. De varnar för att höjd beskattning av förmögenhet och utdelning riskerar att minska investeringar, konkurrenskraft och välfärd, med hänvisning till 1970- och 80-talens misslyckade politik. Framgångsrika företag och entreprenörer skapar tillväxt, jobb och ökade skatteintäkter.", "trump": "Lyssnar ni på de här fantastiska svenska företagsledarna? De har fullständigt rätt. Vinster är inte fienden, de är vinnarna! De giriga vänsterfanatikerna med sina miljardärskatter och identitetspolitiska kvoteringar vill krossa allt som fungerar. Biden förstörde Amerika på samma sätt. Nu fixar vi det igen – gör Sverige rikt på riktigt, kamrater!", "stalin": "Jag betraktar med djup misstro dessa profitthungriga klassförrädare som målar upp vinsten som folkets räddning. Deras dekadenta lögner döljer bara behovet av att rensa ut de parasiterande hyenorna som suger musten ur arbetarkollektivet. Historien visade på sjuttiotalet vad som händer när staten inte styr. Alla vet vad som följer på sådan sabotageverksamhet."}, "date": "11 september, 07:00", "url": "https://www.di.se/debatt/foretagens-vinster-bygger-sverige-starkare", "imageUrl": "https://static.bonniernews.se/ba/37cb027e-9594-47af-a0e5-5019da358c9c.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Talmannen: Partier bör vara redo överge röda linjer", "summaries": {"normal": "Riksdagens talman Andreas Norlén ser likheter mellan årets valrörelse och den utdragna regeringsbildningen 2018, då det tog 134 dagar att bilda regering. Med anledning av det allvarliga säkerhetsläget uppmanar han svenska partier att släppa sina röda linjer för att undvika en handlingsförlamad statsledning. Norlén reflekterar även över sina åtta år på posten.", "trump": "Sverige har totala problem med sin regeringsbildning! Den svenska talmannen gråter ut om att det tog 134 dagar att få till en regering, precis som under den totala katastrofen 2018. Nu gnäller de om röda linjer. Låt mig säga er, om de bara hade gjort som jag och kört America First-modellen direkt så hade allt rullat på som tåget, men de bara pratar och åstadkommer noll!", "stalin": "Kamrat Norlén klagar över att de svenska partierna saknar disciplin och förmåga att snabbt formera en enig statsledning. Att det krävdes 134 dagar av svaghet år 2018 visar på det borgerliga parlamentarismens bankrutt. En stat kan inte styras av vacklande politiker med heliga röda linjer. Om de inte skärper sig och underordnar sig ordningen kommer staten att knäcka dem."}, "date": "11 september, 05:30", "url": "https://www.gp.se/nyheter/sverige/talmannen-partier-bor-vara-redo-overge-roda-linjer.85644ce5-03c6-5eab-b272-76a8f87c7708", "imageUrl": "https://www.gp.se/images/article/85644ce5-03c6-5eab-b272-76a8f87c7708/images/2YNKwX54NgTOphD4k8vC_TkWVq60-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "En sann klasskildring är också en protest mot klassamhället", "summaries": {"normal": "Författaren Henrik Johansson Kock argumenterar för arbetarlitteraturens betydelse som en protest mot klassamhället. Han kritiserar att skildringar av arbetarklassen ofta marginaliseras medan överklassens berättelser ses som ren litteratur. Skönlitteraturen kan skapa identifikation, solidaritet och synliggöra gemensamma erfarenheter av kamp, vilket är särskilt relevant i en valrörelse där språket och makten står i fokus.", "trump": "Lyssnar ni på de här patetiska arbetarskrivar-typerna som gnäller om att de aldrig får huvudrollen? Patetiskt! De vill ha solidaritet medan de verkliga vinnarna, entreprenörerna med fart och initiativ, bygger landet. Det här är vad som händer när woke-kultur och identitetspolitik tar över litteraturen. Vi behöver inga offerberättelser, vi behöver starka ledare som gör Amerika och Sverige stora igen. Sad!", "stalin": "Kamrater, denna skildring blottar hur de giriga hyenorna i överklassen förtrycker arbetets röst. Jag ser med djup tillfredsställelse hur författaren erkänner att sann klasslitteratur är en protest mot det parasitiska systemet. Vi måste rensa ut alla dekadenta element som vill tysta massornas erfarenheter. Litteraturen ska tjäna folket, inte underhålla klassfienderna. Den som vägrar inse detta är en fiende till revolutionen."}, "date": "10 september, 11:41", "url": "https://proletaren.se/artikel/en-sann-klasskildring-ar-ocksa-en-protest-mot-klassamhallet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/hj_kron-768x432.jpg"}, {"type": "image-full", "heading": "Zelenskyjs kalkyl: Kriget ska kännas i Ryssland", "summaries": {"normal": "Ukraina intensifierar sina attacker djupt inne i Ryssland mot raffinaderier och logistik för att pressa den ryska befolkningen. Trots ekonomiska störningar ses inga tecken på att Putins makt hotas. Samtidigt står Ukraina inför en svår vinter med energibrist och behov av mer luftvärn, medan Ryssland planerar motangrepp mot ukrainsk infrastruktur.", "trump": "Zelenskyj försöker träffa ryska raffinaderier – en total katastrof! De borde ha gjort affärer med mig, då hade oljan flödat och priserna varit låga. Nu är det bara kaos och rök. Putin sitter kvar, och Ukraina fryser i vinter för att de inte har mitt ledarskap. Väldigt sorgligt, ett enormt slöseri, och det är bara fake news att detta skulle stoppa någon!", "stalin": "Vi ser hur Kyiv desperat kastar sten i glashus. Att attackera den ryska ekonomin är en handling av ren febrig galenskap. Vår kamrat Putin håller ställningarna medan fienden, i sin brist på resurser och ordning, försöker dölja sin förestående vinterundergång. De som försöker störa den ryska oljeproduktionen förtjänar inget annat än historiens kalla, rättvisa dom."}, "date": "10 september, 09:53", "url": "https://www.realtid.se/samhalle/zelenskyjs-kalkyl-kriget-ska-kannas-i-ryssland", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/zelenskyj.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Gammal fascism i ny kostym", "summaries": {"normal": "Artikeln kritiserar partiet Alternativ för Sverige (AFS) som ett högerextremt parti med rasistisk och arbetarfientlig politik. AFS anklagas för att vilja ställa arbetare mot invandrare istället för att rikta kritiken mot kapitalister. Författaren, själv undersköterska, varnar för att partiets program skulle leda till kollaps inom vård och omsorg.", "trump": "Lyssnar ni på det här? Dessa AFS-typer är fullständiga losers som klär gamla fascistiska idéer i ny kostym. De vill spela ut arbetare mot invandrare medan de riktiga vinnarna, de globala elitsnyltarna, skrattar hela vägen till banken. Patetiskt! Vi behöver inga kvotfascister eller identitetspolitiska nollor, bara vinnare som sätter Amerika och verkliga jobb först.", "stalin": "Kamrater, dessa dekadenta klassförrädare i AFS försöker med sin reaktionära giftpropaganda splittra arbetarklassen och rikta vreden mot fel fiende. Jag ser rakt igenom deras falska harmoni med penninggalna hyenor. I ett sant folkstyre skulle sådana element genomgå grundlig utrensning. Deras dröm om ett korporativt Sverige är en löjeväckande parodi på verklig socialism."}, "date":
