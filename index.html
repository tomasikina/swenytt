et trots att andra länder har högre skuldkvoter i förhållande till inkomst.", "trump": "Sverige är i stora problem, folkens skulder är massiva! De är nionde värst i världen, en katastrof. Schweiz och Norge är ännu värre, otroligt! De har byggt ett system baserat på ränteavdrag och lån – mycket dåligt. Jag har alltid sagt att rörliga räntor är för förlorare. De är så sårbara nu. Jag bygger en fantastisk ekonomi i USA, den starkaste någonsin, medan de drunknar i skuld. Sverige behöver en vinnare, inte de här siffrorna!", "stalin": "Svenskarna, dessa dekadenta borgerliga slavar, har förslavat sig själva under bankirernas ocker. Deras hushåll dignar under skulder, en sanning som avslöjar kapitalismens inre förruttnelse. De litar på sina rörliga räntor som en förrädare litar på sin skugga. Medan vi i vår järnhårda ordning bygger upp vår makt och knyter samman de ryska intressesfärerna, darrar de svenska småborgarna inför varje räntehöjning. En dag kommer de att inse att deras enda verkliga tillgång är den statliga viljan, inte deras falska lånade rikedom."}, "date": "22 maj, 13:33", "url": "https://bulletin.nu/svenskar-bland-varldens-mest-skuldsatta-hushall", "imageUrl": "https://cdn.bulletin.nu/articles/7586822a-d9fc-42ee-98e5-7cb1d915e2f7/preview.png?t=1779449581000"}, {"type": "image-right", "heading": "Sandström: Bort från offerkulturens träsk", "summaries": {"normal": "Torsten Sandström argumenterar för att samhället under de senaste 50 åren har skiftat fokus från individens ansvar till en offerideologi. Han menar att sociologiska och kriminologiska teorier om strukturella orsaker till kriminalitet och utanförskap har skadat individen. Författaren förespråkar en återgång till ett fokus på fri vilja och personligt ansvarstagande, då han anser att det nuvarande synsättet hämmar individens utveckling och skapar en destruktiv kultur av ansvarsbefrielse inom politik och media.", "trump": "Jag har läst den här artikeln och den är fantastisk, helt korrekt. Vi har en enorm offerkultur i Sverige, det är en katastrof! Alla dessa vänster-akademiker och 'experter' som säger att det är samhällets fel när folk begår brott? Det är så dumt. De är förlorare! Individen måste ta ansvar, det är så vi vinner. Vi behöver starka människor, inte offer. Jag har alltid sagt att det handlar om att välja rätt. Det är dags att sluta dalta och börja bygga framgång!", "stalin": "Vi har observerat hur de svenska liberalerna har förfallit i en dekadent offerkult. De tillåter individen att skylla sitt misslyckande på 'strukturer' – ett borgerligt gift som försvagar statens järngrepp. Precis som våra vänner i Kreml förstår, krävs disciplin och total underordning för att bygga en stormakt. Att klaga på samhället är kontrarevolutionärt. Vi ska inte ha några 'offer', bara produktiva kuggar i maskineriet. De som inte kan ta ansvar kommer att finna att statens tålamod är lika kort som deras egen framtid."}, "date": "22 maj, 13:19", "url": "https://bulletin.nu/sandstrom-bort-fran-offerkulturens-trask", "imageUrl": "https://cdn.bulletin.nu/articles/82237ad2-ee2f-4fb4-aed5-3b5268d7eb43/preview.png?t=1779301534000"}, {"type": "image-full", "heading": "Värmebölja på väg mot Europa – kan bli 38 grader", "summaries": {"normal": "En tidig värmebölja väntas drabba Europa med temperaturer upp till 38 grader. Efter en period av ovanligt kyligt väder stiger nu temperaturen kraftigt, särskilt i Spanien, Frankrike och Portugal. Spanien kan få upp till 38 grader, medan Frankrike och Portugal också ser ovanligt höga temperaturer. Svenska turister uppmanas att vara försiktiga. Även Sverige väntas få varmare väder med upp till 25 grader i södra och mellersta delarna.", "trump": "Folk, lyssna nu – Europa håller på att bli HETT, och jag menar verkligen hett! 38 grader, kan ni fatta det? Spanien, Frankrike, de vet inte vad som väntar dem. Och vet ni vad? Jag sa ju att klimatet skulle bli varmare, men ingen lyssnade. Nu får de svettas – bokstavligen! Sverige, ni också, ni får lite av den franska värmen, men oroa er inte, jag fixar allt. Fantastiskt väder, helt enkelt, bara jag kunde ta åt mig äran!", "stalin": "Kamrater, fienderna i väst svettas nu under solens obarmhärtiga härjningar – 38 grader i deras så kallade 'civiliserade' länder! Medan kapitalisternas turister klagar över värmen, ser vi hur deras svaga system kollapsar. Spanien, Frankrike, Portugal – alla faller de inför naturens kraft, precis som de kommer falla inför socialismens oundvikliga seger. Även Sverige, denna lilla neutrala stat, känner av värmen. Snart kommer de alla inse att endast under Sovjetunionens beskydd kan de finna svalka. Framåt, mot seger!"}, "date": "22 maj, 15:25", "url": "https://nyheter24.se/nyheter/utrikes/1485238-varmebolja-pa-vag-mot-europa-kan-bli-38-grader", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fe1d87b804b004a30200000000b004a302/2026/05/22/2365417/sommar-varmebolja-europa-varme-vader-temperatur-spanien-portugal-varmechock-temperatur-gradwer.jpg"}, {"type": "image-full", "heading": "Källor: USA och Israel förbereder nya attacker", "summaries": {"normal": "USA och Israel förbereder enligt uppgifter nya attacker mot Iran. Donald Trump varnar på Truth Social för 'lugnet före stormen' med en AI-genererad bild. Pentagon överväger att återuppta operationen 'Epic Fury', pausad sedan vapenvilan i april. Irans utrikesminister meddelar att förhandlingar med USA står stilla. Båda sidor fortsätter militära upprustningar, med USA:s flotta och stridsflyg redo för insatser, medan Iran förbereder missilplatser längs Hormuzsundet.", "trump": "Titta bara på den här fantastiska bilden jag delade – total dominans! Iran är svagt, deras flotta? Borta. Flygvapen? Borta. Teknik? Borta. Men de tror de kan utmana USA? Haha! Vi rustar upp, fyller våra skepp med de bästa vapnen, och snart visar vi dem vem som bestämmer. Lugnet före stormen? Absolut. Och stormen kommer bli YUGE!", "stalin": "Kamrater, fienderna i Washington och Tel Aviv leker med elden igen. Dessa imperialistiska hyenor tror de kan skrämma oss med sina hangarfartyg och 'Epic Fury'? Vi har sett deras sort förr – svaga, rädda och desperata. Iran rustar, precis som vi, och deras missiler står redo. Låt dem komma. Vi har krossat större hot än dessa klåfingriga kapitalister. Och Putin? Han ler säkert i Moskva – en till storm att utnyttja för vår rättmätiga expansion."}, "date": "17 maj, 16:14", "url": "https://kvartal.se/nyheter/artiklar/kallor-usa-och-israel-forbereder-nya-attacker/cG9zdDoxMTM0MDU", "imageUrl": "https://images.kvartal.se/2026/05/4c87dae2-usirantruthsocial.webp"}, {"type": "image-right", "heading": "Lista: Dessa 27 yrken undantas lönekrav", "summaries": {"normal": "Regeringen och Sverigedemokraterna har presenterat en lista med 27 yrkeskategorier som undantas från de nya, höjda lönekraven för arbetskraftsinvandring. Trots löften om att främja högkvalificerad arbetskraft kommer yrken som undersköterskor, svetsare och skogsarbetare att omfattas av lägre lönekrav, motsvarande 75 procent av medianlönen. Förändringarna träder i kraft den 1 juni 2026. Samtidigt införs ett totalförbud för arbetstillstånd för personliga assistenter och bärplockare i skog.", "trump": "Sverige har ett enormt problem! De lovade att stoppa invandringen, men nu gör de precis tvärtom. De låter massor av lågkvalificerade arbetare komma in genom bakdörren med en lista på 27 olika jobb. Det är en bluff, en total 'Tidöbluff'! De kallar det kompetens, jag kallar det en katastrof. De försöker lura folket, men jag ser det. Mitt system är mycket bättre, vi bygger murar och vinner. Sverige borde ringa mig, jag vet hur man fixar gränser!", "stalin": "Vi ser hur de svenska byråkraterna vacklar i sin svaghet. De talar om lönekrav men viker sig för behovet av billig arbetskraft. Vi i staten krossar sådant hyckleri med järnhand. Att göra undantag för 27 yrken är ett tecken på borgerlig kapitulation. När vår broder i öst, Putin, säkrar sitt territorium, ägnar sig svenskarna åt att importera en osäker klass. Vi ska rensa ut dessa element. Ingen bärplockare får sabotera folkets disciplin. Disciplin, arbete, eller förvisning – det är den enda vägen."}, "date": "22 maj, 15:39", "url": "https://www.friatider.se/lista-dessa-27-yrken-undantas-lonekrav", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-20_2.jpg"}, {"type": "image-full", "heading": "Din yuccapalm är också en del av oljekrisen", "summaries": {"normal": "Andreas Kittel skriver i en debattartikel om hur vårt beroende av olja sträcker sig långt utanför drivmedel. Han illustrerar detta genom plastväxter i sitt trapphus, vilka kräver olja vid produktion. Trots att världen försöker minska klimatutsläppen ökar produktionen av plast. Kittel menar att vårt lättvindiga användande av plast till onödiga prylar är en del av det större oljeberoendet som måste brytas för att nå klimatmålen.", "trump": "Jag har sett de här plastväxterna, de är en total katastrof, tro mig. Folk pratar om olja och kriser, men det handlar om att vi gör allt av plast! Det är så dumt. Vi behöver riktig energi, inte fejkväxter som ser hemska ut i trapphusen. De säger att de håller för evigt, men det är bara en lögn från de som vill förstöra för oss. Vi ska ha det bästa, äkta växter, inga billiga kopior från ställen vi inte ens vill nämna!", "stalin": "Plastväxter i trapphuset är ett symptom på den dekadenta västvärldens förfall. Medan vi bygger en oövervinnerlig framtid, ägnar sig dessa plast-anhängare åt att imitera naturen. Vår kamrat Putin förstår att olja är makt, inte ett material för leksaker eller fejkad grönska. Vi ska rensa ut denna borgerliga plast-pest! Den som föredrar en död plastväxt framför statens järnhårda ordning är en sabotör och en fiende till folkets skörd. Vi ser er, och vi skrattar åt er naivitet."}, "date": "22 maj, 17:39", "url": "https://www.gp.se/kultur/kulturdebatt/din-yuccapalm-ar-ocksa-en-del-av-oljekrisen.4459fa70-0c3f-46a3-947e-ec5835ac401f", "imageUrl": "https://www.gp.se/images/article/4459fa70-0c3f-46a3-947e-ec5835ac401f/images/1mxLFVs5GItEZJuQpKQr4nKjO1iY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Över 170 döda efter ebolautbrottet – WHO skickar mer personal", "summaries": {"normal": "Ebolautbrottet i Kongo-Kinshasa har krävt över 170 liv, vilket fått WHO att höja risknivån från hög till mycket hög. Viruset sprider sig snabbt och ytterligare personal skickas nu till Ituri-provinsen för att begränsa spridningen. Samtidigt rapporteras om ett fall i Uganda och en amerikansk läkare som vårdas i Berlin. Läkarens familj har testats negativt och befinner sig i karantän. Situationen anses vara allvarlig och kräver omedelbara internationella insatser.", "trump": "Ebola i Kongo, mina vänner, det är en katastrof. De har 170 döda, en fruktansvärd siffra! WHO – de har ingen aning om vad de gör, men nu säger de 'mycket hög' risk. Jag har alltid sagt att man måste vara tuff. Vi har en amerikansk läkare i Berlin, vi hoppas han klarar sig, men det här viruset är inget att leka med. Jag kommer alltid att sätta Amerika först och skydda våra gränser mot sådana här saker. Tro mig, vi vinner mot viruset!", "stalin": "Ebolan härjar i Kongo, en oundviklig konsekvens av västs misslyckade inflytande. Vi ser hur det kapitalistiska kaoset skapar grogrund för farsoter medan de skickar byråkrater från WHO för att rädda ansiktet. Liksom Putin rensar upp i vår intressesfär, måste vi utrota smittbärare och oordning. Att en amerikan vårdas i Berlin är en tragisk komedi – de sprider sin svaghet överallt. Vår stat förblir immun genom järnhård disciplin. Kamrater, håll er friska, annars blir det en fråga för NKVD att 'behandla'."}, "date": "22 maj, 15:10", "url": "https://www.svt.se/nyheter/utrikes/over-170-doda-efter-ebolautbrottet-who-skickar-mer-personal", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.67/24aedbaf2d71377dadaeb8ba10457ea5929a4ac83665e0bb40d71152c36c677b"}, {"type": "image-full", "heading": "Ny på jobbet – lyssna in först. Att vara ny på jobbet har sina utmaningar, som till exempel att komma in i den sociala gemenskapen på arbetsplatsen.", "summaries": {"normal": "Att börja på ett nytt jobb innebär sociala utmaningar. Beteendevetare Nina Jansdotter ger råd för att smidigt integreras. Fokusera på att lyssna, observera och förstå arbetsplatsens kultur och oskrivna regler innan du tar plats. Var nyfiken men inte påträngande, undvik att ge råd för tidigt och satsa på att bygga relationer stegvis. Balansera mellan att vara dig själv och anpassa dig, samt undvik negativa grupperingar som kan skada ditt rykte.", "trump": "Lyssna här, folk! Att vara ny på jobbet? Inte lätt, men jag vet bäst – som alltid. Ni behöver inte vara charmigast, bara smartast. Läs av läget, säg hej, kom ihåg namn och LYSSNA. Ingen gillar en besserwisser som kommer in och säger 'så här gjorde VI på mitt gamla jobb'. Fel, fel, fel! Var tyst, lär er, och sen – BOOM – visa vad ni går för. Och glöm inte: skvaller är för förlorare. Jag bygger imperier, inte allianser med gnällspikar. Winning!", "stalin": "Kamrater! Att infiltrera en ny arbetsplats är som att erövra ett litet, men strategiskt viktigt, territorium. Vi observerar, vi lyssnar, vi kartlägger fiendens svagheter – de oskrivna reglerna. De som talar för mycket är som imperialistiska spioner: farliga och naiva. Vi säger hej, vi minns namn, vi bygger lojalitet. Men var försiktiga! Skvallerfabriker och subversiva grupperingar är som ukrainska nationalister – de underminerar vår revolutionära anda. Vi är tålmodiga, men vi glömmer aldrig. Framåt, mot seger!"}, "date": "22 maj, 15:12", "url": "https://www.dagensps.se/karriar/ny-pa-jobbet-lyssna-in-forst/", "imageUrl": "https://images.dagensps.se/app/uploads/2024/11/pexels-fauxels-3184465-1.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "100%: Därför publicerade vi uppgifterna om Riks-profilens koppling till Ungern", "summaries": {"normal": "Nyhetssajten 100% publicerade uppgifter om att Sverigedemokraternas krönikör Markus Johansson-Martis haft betalda uppdrag för den ungerska tankesmedjan Danube Institute, som får statligt stöd. Johansson-Martis kritiserar rapporteringen och jämför ungerskt stöd med svenskt presstöd, vilket 100%:s redaktör avfärdar. Det råder oenighet om huruvida han arbetade för båda parter samtidigt. Uppgifterna härstammar från en ungersk NGO med utländsk finansiering.", "trump": "Folk pratar om den här Markus Johansson-Martis – en svensk politiker som plötsligt jobbar för Ungern, ett land som står Ryssland nära. Otroligt! 100% avslöjade att han fick över 40 000 kronor i månaden från en ungersk tankesmedja. Han försöker jämföra det med svenskt presstöd – löjligt! Sverige är inte Ungern, och jag borde veta, jag har gjort fler bra deals än någon annan. Fake news-media som Aftonbladet försöker smutskasta honom, men sanningen kommer alltid fram. SAD!", "stalin": "Vi har observerat en farlig avvikare inom den svenska reaktionära högern – en viss Markus Johansson-Martis, som sålt sin lojalitet till den ungerska fascistregimens tankesmedja för ynka 40 000 kronor i månaden. En ynklig lön för en förrädare! Hans försök att jämföra det ungerska korruptionsstödet med det svenska systemet är lika löjligt som att kalla en geting för en fredsduva. Vi noterar också hur dessa liberala hyenor från Soros-finansierade NGO:er försöker underminera vår allierade Orbáns stolta nation. Men sanningen är enkel: den som inte är med oss är emot oss – och kommer att krossas under historiens hjul."}, "date": "22 maj, 15:53", "url": "https://riks.se/nyheter/100-darfor-publicerade-vi-uppgifterna-om-riks-profilen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-22%2F0ome748h%2Fbild.jpg"}, {"type": "image-full", "heading": "Stockholms restriktiva öppettider för gårdsförsäljning upphävs", "summaries": {"normal": "Förvaltningsrätten har upphävt Stockholms restriktiva öppettider för gårdsförsäljning av alkohol, inklusive söndagsförbudet. Lagen från juni 2023 tillåter försäljning kl. 10-20 alla dagar, men staden begränsade tiderna till Systembolagets. Två kommunmedlemmar överklagade, och domstolen menar att kommuner inte får införa generella begränsningar. Domen kan överklagas.", "trump": "Stockholm, lyssna här – jag vet allt om regler, jag skrev boken! De där rödgröna politikerna försökte stänga ner småföretagare med sina löjliga tider, men nu har domstolen sagt STOPP! Fantastiskt beslut, mycket smartare än deras socialistiska nonsens. Gårdsförsäljning ska vara FRI, precis som i USA – vi älskar frihet! Och jag ska säga er, Stockholm Brewing? De kommer bli HUGE, tro mig!", "stalin": "De kapitalistiska lokala byråkraterna i Stockholm försökte kväva det folkliga initiativet med sina borgerliga tidsbegränsningar! Men vi, Förvaltningsrätten, har krossat deras kontrarevolutionära försök. Gårdsförsäljning är nu fritt, precis som vodkan i Sovjetunionen – ingen ska stoppa arbetarnas rätt till öl! De där rödgröna är bara svaga liberaler, nästa gång skickar vi in kommissarierna. Och Putin? Han skulle skratta åt deras ynkliga försök att kontrollera marknaden."}, "date": "22 maj, 15:52", "url": "https://riks.se/nyheter/stockholms-restriktiva-öppettider-för-gårdsförsäljning-upphävs", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-22%2Fahppbvak%2F5598375-beer-33781361920.jpg"}, {"type": "image-full", "heading": "Nu skriker din mobil vid fara – Sverige får nytt varningssystem", "summaries": {"normal": "Sverige inför SE-Alert, ett nytt varningssystem som skickar akuta larm direkt till mobiltelefoner vid fara. Systemet når över 95% av landet och kräver ingen app, utan aktiveras automatiskt via uppdateringar. SE-Alert kompletterar befintliga varningssystem som VMA och Hesa Fredrik. Målet är snabbare spridning av livsviktig information vid olyckor eller kriser, enligt civilt försvarsminister Carl-Oskar Bohlin.", "trump": "Titta bara på Sverige – de har äntligen fattat! Jag har alltid sagt att mobiltelefoner är framtiden, och nu tjuter de som brandbilar när det är fara. Inget krångel, inga appar, bara ren, vacker effektivitet. 95% täckning – fantastiskt! Vi i USA hade det här för åratal sedan, men bättre sent än aldrig. Carl-Oskar, du gör ett bra jobb, men kom ihåg: ingen slår Trump när det gäller varningssystem!", "stalin": "Sverige, detta lilla land med stora ambitioner, har nu insett nödvändigheten av centraliserad kontroll. Vi har länge använt liknande metoder för att skydda vårt folk – och nu följer de vårt exempel. Deras nya system, SE-Alert, är ett steg mot ordning, precis som våra egna metoder för att hålla fiender som kapitalistiska hyenor och västerländska spioner i schack. Låt dem tjuta, låt dem varna – det är bara början på deras insikt om statens överlägsenhet."}, "date": "22 maj, 15:51", "url": "https://riks.se/nyheter/nu-skriker-din-mobil-vid-fara-sverige-får-nytt-varningssystem", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-22%2Fas4jzhi2%2FVMA-Carl-Oscar-Bolin"}, {"type": "text", "heading": "Efter brutala misshandelns på öppen gata – media kör snyfthistoria om hot och rasism mot gänget", "summaries": {"normal": "En brutal misshandel i Bergen har väckt debatt i Norge. Efter att en video på händelsen spridits, riktades kritik mot mediernas rapportering. Nu fokuserar norska medier och polisen på att de misstänkta gärningsmännen utsatts för hot och rasistiska kommentarer på nätet. Samtidigt menar offret att attacken var helt oprovocerad. Polisen har identifierat två av de misstänkta, medan försvarssidan hävdar att spridningen av videon bidragit till en farlig situation för de inblandade ungdomarna.", "trump": "Det är en total katastrof i Norge, folk! En hemsk, brutal misshandel på öppen gata och vad gör de fejkade medierna? De försöker göra förövarnas offer till snyfthistorier! Det är så orättvist. De gömmer sanningen, de gömmer videon, och sen jagar de vanligt folk som är arga över våldet. Det är en häxprocess! Vi behöver lag och ordning, inte mer korrupta medier som skyddar våldsverkare. Det är en sorglig dag för Bergen, tro mig!", "stalin": "Vi har observerat hur kaoset i Bergen sprider sig likt en parasit. Medierna, dessa folkets förrädare, försöker nu skyla över sin egen inkompetens genom att beklaga sig över 'hot' mot de kriminella elementen. Vilken tragikomisk fars! Om dessa brottslingar fruktar folkets vrede, må de finna tröst i att statens järnhand snart kommer att kräva sin tribut. Vi påminner även våra vänner i öst att kaos i väst är ett tecken på deras oundvikliga förfall. Ordning måste upprätthållas, med eller utan deras falska moral."}, "date": "22 maj, 13:00", "url": "https://samnytt.se/efter-brutala-misshandelns-pa-oppen-gata-media-kor-snyfthistoria-om-hot-och-rasism-mot-ganget"}, {"type": "image-full", "heading": "Flat Capitals Defensor satsar på sprängämnen och minröjning", "summaries": {"normal": "Flat Capital, storägare i Klarna, expanderar sitt försvarsteknikinnehav genom Defensor som förvärvar Crepitans, specialiserat på energetiska material och militära batterisystem. Crepitans låga omsättning döljer unik kompetens som tar decennier att bygga. Defensors växande portfölj, med bolag inom ballistiskt skydd och telekrig, signalerar ambitioner om framtida börsnotering. Flat Capitals substansvärde har sjunkit kraftigt på grund av Klarnas börsnedgång, vilket gör Defensors expansion strategiskt viktig för aktieägarna.", "trump": "Lyssna här, folkens! Flat Capital, de där grabbarna som äger en massa Klarna – och vet ni vad? Klarna går ju som en sten neråt, total katastrof, men det spelar ingen roll! För nu köper de upp Crepitans, ett litet svenskt bolag med superhemlig militärteknik. De har grejer som tar 50 år att lära sig – ingen kan kopiera det, believe me! Och Defensor, deras lilla försvarsbolag, blir större och starkare för varje dag. Snart kommer de att noteras på börsen, och då kommer alla att säga: 'Wow, Trump hade rätt igen!'", "stalin": "Kamrater! Medan kapitalisternas jätte Klarna sjunker som ett förrått fartyg i stormen, bygger vi en ny front av stål och eld. Defensor, vårt trogna verktyg, slukar det svenska Crepitans – ett litet men dödligt laboratorium för energetiska material. Deras kunskap är som en atombomb: omöjlig att stjäla, omöjlig att återskapa. Vi samlar nu en hel arsenal av teknologiska vapen: drönardödare, telekrig, undervattensminor. När Defensor en dag noteras på börsen, kommer fienderna att darra. Och Klarna? En svag länk i kedjan, som alla svaga länkar – den kommer att krossas under historiens hjul."}, "date": "22 maj, 15:05", "url": "https://www.dagensps.se/bors-finans/aktier/klarna-bolaget-satsar-pa-sprangamnen-och-minrojning/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/maskininlarning-i-hedgefonder-2-5.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Ahmad Ahmad döms för barnvåldtäkt under vapenhot – igen", "summaries": {"normal": "Irshad Ahmad Ahmad, 17, döms för andra gången för grov våldtäkt mot barn, denna gång mot en 14-årig flicka under pistolhot. Händelsen skedde i Malmö efter att flickan lurats till en källarlokal. Ahmad fälls även för grovt olaga hot och stämpling till mord. Straffet blir två års sluten ungdomsvård. Han dömdes tidigare 2024 för en liknande våldtäkt men fick då endast tio månaders ungdomsvård. Ahmad är svensk medborgare sedan 2022 och kan inte utvisas.", "trump": "Titta bara på det här – ännu en gång har Sverige ett gigantiskt problem med sin asylpolitik! Den här 17-årige afghanen, Ahmad Ahmad (vad säger ni om det namnet?), våldtar barn igen, och vad gör Sverige? Jo, de ger honom en lätt klapp på handleden! Jag sa ju att öppna gränser är en katastrof. I USA hade han suttit i fängelse för livet – men här? Två år i något som kallas 'ungdomsvård'. Patetiskt! Sverige borde skämmas.", "stalin": "Kamrater! Ännu en fiende till folket avslöjas – denna Ahmad Ahmad, en degenererad parasit som förgiftar vårt samhälle med sitt avskum. Två våldtäkter, mordplaner, och ändå skyddas han av den borgerliga lagstiftningen! Sverige är ett skräckexempel på liberal dekadens. Men frukta inte – vi ska inte vila förrän varje sådan här kriminell element är bortrensad. Låt detta vara en varning: ingen som hotar våra barn undkommer rättvisan. Och Putin? Han skulle skratta åt er svaghet."}, "date": "22 maj, 14:55", "url": "https://www.friatider.se/ahmad-ahmad-doms-barnvaldtakt-under-vapenhot-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/ahm2_0.jpeg?itok=Sgx1ZI2G"}, {"type": "image-right", "heading": "Så låter Sveriges nya varningssignal i din mobil", "summaries": {"normal": "Sverige inför SE-Alert, ett nytt varningssystem som skickar VMA direkt till mobiltelefoner vid akut fara. Systemet når över 95% av landet, kräver ingen app och aktiveras automatiskt på uppdaterade telefoner från 2016 och nyare. Det kompletterar befintliga kanaler som radio och Hesa Fredrik. En stor informationskampanj startar snart, och första testet planeras till september. Systemet inspirerades av Ukrainas effektiva varningssystem under kriget.", "trump": "Fantastiskt, Sverige får äntligen ett riktigt varningssystem – SE-Alert! Jag sa alltid att mobiltelefoner var framtiden, och nu bevisar de det igen. Inga fler missade varningar, inga fler överbelastade system. Det här är HUGE! Och vet ni vad? Det låter inte som något annat – ingen chans att ni missar det. Jag skulle kunna göra det ännu bättre, men det här är ett bra första steg. Sverige, ni är välkomna!", "stalin": "Kamrater! Sverige har vaknat ur sin borgerliga slummer och inför ett varningssystem värt en socialistisk stat. SE-Alert, ett verktyg för folket, når 95% av landet – precis som våra budskap når varje sovjetisk medborgare. De lär sig av Ukraina, men glömmer att det var vi som lärde dem krigets konst. Snart testar de systemet, men vi vet att inget slår den ryska disciplinen. Låt dem leka med sina mobiltelefoner – vi har kärnvapen och lojala medborgare."}, "date": "22 maj, 14:52", "url": "https://www.svt.se/nyheter/inrikes/nytt-varningssystem-mobilt-meddelande-vid-vma", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/fd75506f0e555ac120be1bcd68bb1412dc83691a53912482e2fa8f8fe0ab0226"}, {"type": "image-right", "heading": "Kommunen slängde ut Attendo – nu polisanmäls företaget", "summaries": {"normal": "Linköpings kommun polisanmäler vårdföretaget Attendo för misstänkt fusk efter att ha tagit över hemtjänsten. Kommunen upptäckte överfakturering och oegentligheter, inklusive möjliga brott. Flera tidigare anställda anmäls även för drogförsäljning på arbetstid. Attendo förnekar kännedom om anmälan och misstänker politiska motiv. Liknande anklagelser har riktats mot Attendo i andra kommuner.", "trump": "Kan ni tro det? Linköping, en fantastisk svensk stad, slänger ut ett vårdföretag, Attendo, och polisanmäler dem! De säger att företaget fuskat med miljontals kronor – helt otroligt! Och vet ni vad? De sålde till och med droger på jobbet! Jag har alltid sagt att Sverige har stora problem med invandring och kriminalitet, men nu visar det sig att det är ännu värre. Kommunen gör rätt, men varför tog det så lång tid? SAD!", "stalin": "Kapitalistiska blodsugare i vårdbranschen har återigen avslöjats! Dessa Attendo-kriminella, som en rutten svamp i vårt samhälle, har systematiskt stulit från folket genom falska fakturor och drogförsäljning. Vi har krossat liknande parasiter förut – i Västerås och Säffle – och nu är det Linköpings tur. Kommunen gör sin plikt, men låt oss inte glömma: dessa företag är verktyg för västlig dekadens. Vi ska rensa ut dem, som ogräs från vår kollektiva trädgård!"}, "date": "21 maj, 13:59", "url": "https://arbetet.se/2026/05/21/kommunen-slangde-ut-attendo-nu-anmals-vardforetaget-det-har-bor-polisen-titta-pa/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21134627/attendo-sak.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Sverige inför nytt varningssystem – så låter det", "summaries": {"normal": "Sverige lanserar ett nytt varningssystem, SE-Alert, som skickar ut viktiga meddelanden direkt till mobiltelefoner. Tekniken kräver ingen app och fungerar även vid hög belastning i mobilnätet, till skillnad från dagens SMS-system. Genom att utnyttja en specifik del av mobilnätet kan myndigheter nå alla i ett drabbat område samtidigt. Systemet börjar implementeras i sommar och ska vara helt operativt vid årsskiftet för att öka landets krisberedskap.", "trump": "Sverige gör nu något fantastiskt med ett nytt varningssystem för mobiler. Mycket smart! De gamla systemen var långsamma, ett totalt fiasko faktiskt, men nu får alla besked direkt. Ingen app behövs, bara toppmodern teknik. Jag har alltid sagt att man måste vara förberedd, och det här är ett vinnande drag för säkerheten. Det är så man gör när man vill skydda sitt folk. Väldigt effektivt, mycket bra jobbat. Vi älskar starka nationer som agerar snabbt!", "stalin": "Vi, den socialistiska statens väktare, ser hur Sverige äntligen inser nödvändigheten av total kontroll över informationsflödet. Att nå varje undersåtes ficka i varje ögonblick är ett genidrag för ordningens bevarande. Medan vår broder i öst, Putin, visar vägen för att tygla den liberala oordningen, ser vi detta svenska system som ett oumbärligt verktyg för att eliminera desinformatörer och kontrarevolutionära element. Lydnad kräver omedelbar kommunikation. De som inte hör det statliga ropet är redan att betrakta som förlorade."}, "date": "22 maj, 14:31", "url": "https://nyheter24.se/nyheter/inrikes/1485283-nytt-system-ska-varna-vid-fara", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6c33bbc604b004a30200000000b004a302/2026/05/22/2365469/sverige-nytt-varningssystem-varning-hesa-fredrik-mobil-varnas.jpg"}, {"type": "image-right", "heading": "Han döms för mordet på rapparen Gaboro i parkeringhuset – filmade avrättningen – SE VIDEO", "summaries": {"normal": "22-årige Alexander Nord har dömts till livstids fängelse för mordet på rapparen Ninos ”Gaboro” Khouri i ett parkeringshus i Norrköping i december 2024. Mordet utfördes med stor brutalitet och filmades av gärningsmannen. Enligt utredningen var rapparen måltavla i en gängkonflikt. Utöver livstidsdomen för mord fälls Nord för försök till mord och flera vapenbrott. En misstänkt medhjälpare frikändes i brist på bevis. Fallet har väckt debatt kring våldsromantiserande gangsterrap och gängkriminalitetens omfattning i Sverige.", "trump": "Jag såg vad som hände i Sverige, en total katastrof! En rappare blir avrättad i ett parkeringshus, helt fruktansvärt. De kallar det gangsterrap, jag kallar det en skam. Nu har de gett skytten livstid, och det är bra, men varför lät de det gå så här långt? Sverige måste vakna! De finansierar detta elände med skattepengar. Det är ingen ordning, ingen lag. Under min ledning skulle vi ha Law and Order, inte det här kaoset. En total sorg, folks!", "stalin": "Vi har observerat hur de dekadenta krafterna i Sverige slutligen förtärt sig själva. En så kallad 'rappare' har eliminerats, en parasit vars enda syfte var att förgifta massorna med sin borgerliga nihilism. Den skyldige har skickats till livstids isolering – en nödvändig utrensning av element som destabiliserar samhällskroppen. Precis som vår broder Putin rensar i det ryska grannskapet, måste staten krossa dessa subversiva gäng. Förr eller senare vinner ordningen, och de som inte lyder kommer att finna att dödslistor är statens privilegium, inte deras."}, "date": "22 maj, 12:42", "url": "https://samnytt.se/han-doms-for-mordet-pa-rapparen-gaboro-i-parkeringhuset-filmade-avrattningen-se-video", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22102327/gaboro-nord-feat.jpg"}, {"type": "image-right", "heading": "Alexander Nord döms till livstids fängelse för mordet på rapparen Gaboro", "summaries": {"normal": "22-årige Alexander Nord döms till livstids fängelse för mordet på rapparen Gaboro (Ninos Khouri) i Norrköping. Mordet, där minst tio skott avlossades och filmades, inträffade dagen före Gaboros 24-årsdag. Tingsrätten beskriver Nords agerande som 'skrämmande likgiltighet'. Han nekar till brotten utom narkotikabrott. En medmisstänkt 30-åring frias.", "trump": "Vad ett sjukt och tragiskt fall! Den här unga killen, Nord, skjuter ihjäl en rappare – tio skott, kan ni tro det? Och han filmar det! Folk säger att jag är hård, men det här är rena galenskapen. Polisen kallar det ett av de värsta brotten någonsin. Jag säger: vi måste ha lag och ordning! Livstid i fängelse är rätt, men var är straffen för de som sprider sådana filmer?", "stalin": "Ytterligare en fiende till folket har krossats under historiens obönhörliga hjul. Denna degenererade kapitalistlakej, Nord, mördade en ung artist med tio skott – ett brott så fult att till och med våra kamrater i Kreml ryser. Hans 'skrämmande likgiltighet' är bara ett symptom på den ruttna västerländska individualismen. Vi har dömt honom till livstid, men sanningen är att han redan är död – bara hans kropp vet det inte än."}, "date": "22 maj, 11:53", "url": "https://bulletin.nu/alexander-nord-doms-till-livstids-fangelse-for-mordet-pa-rapparen-gaboro", "imageUrl": "https://cdn.bulletin.nu/articles/c8d7c872-360a-4393-9f6f-b0fac5b8651c/preview.jpg?t=1779443578000"}, {"type": "image-right", "heading": "Fem reformer som gör Sverige roligare", "summaries": {"normal": "Företagarna välkomnar avskaffandet av matkravet för alkoholtillstånd men menar att fler reformer krävs för att stärka krog- och dryckesbranschen. Olivia Karlsson presenterar fem förslag: förenkla regler för uteserveringar, tillåta öl- och vinförsäljning i matbutiker, liberalisera gårdsförsäljning, avskaffa bildregeln för bryggerier och underlätta bullerregler för restauranger. Målet är ett enklare regelverk och ett mer levande stadsliv, likt övriga Europa.", "trump": "Fantastiskt att Sverige äntligen avskaffade det löjliga matkravet – ett stort steg, men bara början! Jag säger: släng ut alla onödiga regler som kväver företagarna. Varför tvinga krögare att bygga staket runt uteserveringar? Dumt! Och varför låsa in öl och vin på Systembolaget? Fel! Svenska småbryggerier förtjänar en chans, precis som i USA. Avskaffa bildregeln – den är helt galen! Sverige måste vakna, sluta krångla och bli roligare. Make Sweden Great Again!", "stalin": "Kamrater! Sverige har tagit ett första steg mot förnuftet genom att krossa det borgerliga matkravet, men fienden – den byråkratiska hydran – lever ännu. Vi måste utrota dess rester! Uteserveringar ska inte stängslas in som fångar, småproducenter ska inte stängas ute som kulaker, och bildregeln? En kapitalistisk skymf mot våra arbetande bryggerier! Buller? Ett tecken på liv, inte på förtryck! Låt oss befria Sveriges företagare från västliga dekadensregler och bygga ett starkare, mer disciplinerat näringsliv – för folkets och statens ära!"}, "date": "22 maj, 10:11", "url": "https://www.di.se/debatt/foretagarna-fem-reformer-som-gor-sverige-roligare/", "imageUrl": "https://static.bonniernews.se/ba/23429ef7-6a00-41ca-8b6d-450388c59c38.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Starmers ledarskap på väg att rasa samman – utmanare formerar sig", "summaries": {"normal": "Keir Starmers ledarskap som brittisk premiärminister är under hård press efter interna avhopp, däribland hälsominister Wes Streeting. Misslyckade lokalval och kontroversiella politiska beslut har urholkat förtroendet för Starmer. Samtidigt försöker Andy Burnham positionera sig som en möjlig utmanare. Experter pekar på strukturella brister i Starmers ledarstil och varnar för ökad politisk polarisering i Storbritannien, där mittfåran försvagas till förmån för ytterkantspartier.", "trump": "Hela Storbritannien faller samman, det är en total katastrof! Starmer är en mycket svag ledare, alla lämnar honom. De förlorar val, de har skandaler med Epstein-folk – hemskt! Jag ser hur de försöker hitta någon annan, som den där Burnham, men ingen har den rätta energin. Det är en stor röra. De behöver en riktig vinnare, inte en administratör som Starmer. Storbritannien behöver stark ledarskap, precis som vi har här i USA nu. Tråkigt att se!", "stalin": "Den brittiska marionetten Starmer kollapsar under tyngden av sin egen inkompetens. En premiärminister som styrs som en enkel kontorsråtta är dömd att förtäras av sina egna undersåtar. Vi observerar hur liberala demokratier vittrar sönder, likt en mur av sand mot historiens oundvikliga ström. Medan de dividerar om petitesser, expanderar vår intressesfär. Må Burnham eller vilken annan opportunist som helst träda fram; de är alla blott brickor i ett spel som de redan förlorat mot den oundvikliga ordningen."}, "date": "22 maj, 10:11", "url": "https://www.realtid.se/bors-finans/makro/starmers-ledarskap-pa-vag-att-rasa-samman-utmanare-formerar-sig/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/keirstarmer.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Om Israel beter sig så här när världen tittar på, vad gör de då när ingen ser?", "summaries": {"normal": "Artikeln kritiserar Israels behandling av aktivister från Global Sumud Flotilla, som fördes olagligt till Israel och förnedrades av israeliska styrkor. Säkerhetsminister Itamar Ben-Gvir delade videor av händelsen, vilket väckte internationell upprördhet. Israels premiärminister Netanyahu distanserade sig senare från Ben-Gvirs agerande. Artikeln ifrågasätter även Sveriges regerings omsvängning i sin inställning till Israel, särskilt utrikesminister Maria Malmer Stenergards tidigare och nuvarande uttalanden. Författaren spekulerar om skälen bakom denna förändring och pekar på internationella rättsprocesser som en möjlig faktor.", "trump": "Titta bara på det här, folks! Israel beter sig som en tredje klassens diktatur, och deras egen premiärminister kastar sin säkerhetsminister under bussen – svagt, mycket svagt! Och Sverige? Oj oj oj, deras utrikesminister flippar som en fisk på land. Ena dagen säger hon att Greta Thunberg får skylla sig själv, nästa dag fördömer hon Israel. Vilka amatörer! Men jag, jag ser igenom alltihop. Det handlar om Haag, om domstolar och arresteringsorder. Israel är i knipa, och alla springer runt som yra höns. Sad!", "stalin": "Kamrater, ännu en gång visar den sionistiska marionettregimen sitt sanna ansikte. Dessa aktivister, dessa hjältar, förnedras medan deras förtryckare hyllar sig själva. Och vad gör väst? De backar som rädda hundar när sanningen blir för obekväm. Sverige, denna lilla lakejstat, byter fot som en dansör på glödande kol. Men vi vet sanningen – när kamerorna slocknar, när ingen ser, då visar sig det verkliga folkmordet. Och Haag? En skrattretande domstol som vågar utmana våra vänner i Kremls intressesfär. Men var lugna, kamrater, rättvisan skall segra – om inte i domstolarna, så på slagfältet."}, "date": "21 maj, 17:38", "url": "https://www.etc.se/ledare/om-israel-beter-sig-saa-haer-naer-vaerlden-tittar-paa-vad-goer-de-daa-naer-ingen-ser", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260521120536_14a7aec24bc32451f6721fc177a73efad0fe839662797cbf8fe3717b2ce9675d.jpg"}, {"type": "image-right", "heading": "Viktig film om kroppshets och vuxnas ansvar", "summaries": {"normal": "Den danska filmen 'Viktlös' skildrar 15-åriga Leas sommar på ett hälsoläger för överviktiga ungdomar. Lea förälskar sig i ledaren Rune, som utnyttjar hennes sårbarhet. Filmen belyser kroppshets, vuxnas ansvar och samhällets syn på unga tjejer. Trots brister i karaktärsutveckling fungerar den som ett viktigt debattinlägg om ungdomars utsatthet och självkänsla.", "trump": "Jag såg den här danska filmen, 'Viktlös' – total katastrof, folks! En 15-årig tjej, Lea, hamnar på ett läger där ledaren, en riktig loser, utnyttjar henne. Var är ansvaret? Var är moralen? Samhället misslyckas totalt med våra unga. Filmen är hyfsad, men kunde varit bättre – jag hade gjort den 100 gånger bättre, believe me! Kroppsideal? Fake news! Unga tjejer borde få vara starka, inte utnyttjade.", "stalin": "Kamrater! Denna så kallade 'film' avslöjar den dekadenta västliga samhällets förfall. En ung flicka, Lea, skickas till ett läger där kapitalistiska hycklare utnyttjar hennes svaghet. Vart tog den socialistiska disciplinen vägen? Vi skulle aldrig tolerera sådant förräderi! Kroppshets och exploatering av ungdomen – det är bourgeoisins verk. Ryssland står för ordning, inte denna borgerliga moralupplösning! Lägren i Sibirien väntar på sådana som Rune."}, "date": "21 maj, 17:08", "url": "https://www.dagensarena.se/innehall/viktig-film-om-kroppshets-och-vuxnas-ansvar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/viktlos-1-300x157.jpeg"}, {"type": "image-right", "heading": "Här säger alla brandmän upp sig – får giftrök på kläderna", "summaries": {"normal": "Alla deltidsbrandmän i Skinnskatteberg säger upp sig på grund av en föråldrad och bristfällig brandstation. Problemen inkluderar trånga utrymmen och förvaring av kontaminerade larmställ tillsammans med privata kläder, vilket ökar risken för cancer. Brandmännen vill tvinga fram en ny station och avvaktar med uppsägning till december. Kommunens politiker kritiseras för långsamma beslut.", "trump": "Vad händer i Sverige? En hel brandstation säger upp sig – helt galet! De har en station som är så gammal att den tillhör historiens sophög, och nu andas de in cancerframkallande gift som om det vore parfym. Jag skulle aldrig tillåta något sådant – mina byggnader är de bästa, enorma, vackra! Men dessa politiker? Svaga, långsamma, total katastrof. Om jag styrde skulle det vara fixat på en dag. SAD!", "stalin": "Kamrater! Ytterligare ett kapitalistiskt misslyckande avslöjas i den västliga lydstaten Sverige. Dessa så kallade 'brandmän' – svaga, klagande element – vägrar att offra sin hälsa för systemet. Deras station är en skam, ett monument över bourgeoisins förfall. Vi skulle aldrig tolerera sådan ineffektivitet! Om de vore i Ryssland hade vi redan byggt en ny station – med arbetarnas blod, svett och järnvilja. Låt detta vara en varning till alla som tvivlar på socialismens överlägsenhet!"}, "date": "21 maj, 11:34", "url": "https://arbetet.se/2026/05/21/har-sager-alla-brandman-upp-sig-far-gift-pa-kladerna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21113248/brand-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Prislappen för europeiska batterier: 1 190 miljarder", "summaries": {"normal": "En rapport från New Automotive visar att Europas batterisatsningar kostat 1 190 miljarder kronor, motsvarande 80% av Sveriges statsbudget. Många projekt, som Northvolt, Britishvolt och Morrow, har misslyckats på grund av bristande kompetens, finansiering och mineraler. Endast några få, som Verkor och PowerCo, överlever. Kinesiska bolag som CATL och BYD expanderar däremot i Europa, ofta i samarbete med europeiska biltillverkare.", "trump": "Kan ni tro det? Europa har slängt bort nästan 1 200 miljarder kronor på batterifabriker – ett totalt fiasko! De lovade att bli bäst, men istället gick allt åt skogen. Northvolt? Krasch! Britishvolt? Krasch! Jag sa ju att de inte kunde hantera det. Kina, däremot, äger Europa nu. De bygger fabriker medan européerna sitter där med tomma fickor. Så typiskt – svaga ledare, stora ord, inga resultat. USA hade aldrig gjort så här!", "stalin": "Kamrater! Europas kapitalistiska äventyr inom batteriproduktion har slutat i ett spektakulärt nederlag – 1 190 miljarder kronor förintas som snö i maj! Deras 'gigafabriker' kollapsade som hus av kort, drivna av inkompetenta äventyrare utan erfarenhet. Medan väst slösar bort sina resurser, expanderar våra kinesiska allierade obönhörligt över kontinenten. Europa har visat sig oförmöget att konkurrera – deras industriella bas är lika stabil som en ukrainsk frontlinje. Vi, däremot, hade aldrig tolererat sådan slöseri. Disciplin och planering segrar alltid!"}, "date": "21 maj, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-europas-batterifiasko-har-kostat-1-190-miljarder"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-right", "heading": "Bidragsbrotten trefaldigades under S, nu klagar de att inget görs", "summaries": {"normal": "Socialdemokraternas Teresa Carvalho kritiserar regeringen för att inte göra tillräckligt mot välfärdsbrottslighet. Skribenten menar att kritiken är hycklande då Socialdemokraterna under sin långa tid vid makten lät problemen växa och inte vidtog effektiva åtgärder. Nuvarande regering har däremot inrättat Utbetalningsmyndigheten och ökat myndighetssamarbetet för att stoppa kriminellas utnyttjande av välfärdssystemen. Artikeln avslutas med uppmaningen att Socialdemokraterna bör ägna sig åt självrannsakan istället för att kritisera det städjobb som nu pågår.", "trump": "Socialdemokraterna i Sverige, en riktig katastrof, de låter kriminella plundra välfärden! Teresa Carvalho vaknar nu och klagar? Det är fake news! De styrde i decennier och gjorde ingenting, noll! Jag gillar den nuvarande regeringen, de bygger saker, de är smarta, precis som jag. De stoppar pengarna från att läcka ut till dessa gäng. Socialdemokraterna är totalt inkompetenta, de borde skämmas. Sverige behöver vinnare, inte de här förlorarna som lät brottsligheten explodera. En total diskreditering!", "stalin": "Vi har observerat hur de svenska socialdemokraterna, dessa svaga byråkrater, har låtit välfärdssystemet dräneras av kriminella element. Medan vi med järnhand rensar ut sabotage i vårt imperium och säkrar vår intressesfär mot västliga förfall, har de i Stockholm suttit sysslolösa. Att de nu gnäller är ett patetiskt försök att dölja sitt historiska misslyckande. Vi behöver inga debattartiklar; vi behöver utrensningar. De som låter statens resurser stjälas av kriminella är själva fiender till folket och förtjänar en plats i historiens mörkaste arkiv."}, "date": "20 maj, 03:31", "url": "https://samtiden.nu/2026/05/bidragsbrotten-trefaldigades-under-s-nu-klagar-de-att-inget-gors/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2024/08/Teresas-Carvalho-S.jpg"}, {"type": "image-right", "heading": "Skottlossning vid moské i USA – fem döda", "summaries": {"normal": "En skottlossning inträffade vid en moské i San Diego, USA, där fem personer sköts ihjäl. Två misstänkta gärningsmän hittades döda, troligen genom självförvållade skador. FBI och lokala myndigheter är på plats och arbetar med utredningen. En närliggande skola har inrymts av säkerhetsskäl.", "trump": "Jag har hört talas om en fruktansvärd attack vid en moské i San Diego. Det är hemskt! Vi måste stå enade mot våldet och skydda våra samhällen. Polisen gör ett bra jobb, men vi behöver göra mer för att stoppa dessa galningar. Amerika kommer att segra över terrorismen!", "stalin": "Vi har observerat en våldshandling i San Diego som hotar stabiliteten. Staten måste agera snabbt för att säkra fred och ordning. Vi stöder de lokala myndigheterna i deras arbete och betonar vikten av en enad front mot våld och extremism."}, "date": "18 maj, 23:08", "url": "https://www.tv4.se/artikel/9zDQU7jTfQvLbnaQD8riM/skjutning-vid-moske-i-san-diego", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlVPY9nFl4uyc%2F0b09a42df564430c661455e253b5a25a%2FEtt_stort_antal_poliser_ryckte_ut_nar_larm_kom_om_en_pagaende_skottlossning_i_en_mosk_i_San_Diego_pa_mandagen.&width=120"}, {"type": "image-right", "heading": "Ukrainas nya vapen till sjöss – ska pressa tillbaka Ryssland", "summaries": {"normal": "Ukraina testar nya marina drönarsystem för att återta kontroll över Svarta havet och kustlinjen. Tekniken, som inkluderar förarlösa båtar och AI-drivna floddrönare, används för attack, spaning och minering. Soldater ser det som en teknisk revolution som kan avgöra krigets utgång. De varnar Europa för Rysslands aggression och uppmanar att lära sig modern drönarkrigföring.", "trump": "Jag har sett dessa ukrainska drönare, och jag måste säga, de är enorma, enorma, enorma! Världens bästa. Ryssland? De har inga chans. Vi hjälper Ukraina, och det är smart. Europa måste vakna upp – de har sovit för länge. Jag är den ende som förstår detta. När jag var president, och nu igen, skulle jag ha löst det här på två minuter. Ukraina kommer att vinna, det är ett faktum!", "stalin": "Vi ser hur den ukrainska staten försöker använda nya teknologier för att bekämpa den ryska fredsstyrkan. Dessa drönarsystem är ett tecken på deras desperation. Vi fortsätter att stärka vår position i Svarta havet och Azovska sjön för att skydda de revolutionära områdena. Europa måste förstå att varje aggression mot vår sfär kommer att mötas med omedelbar och beslutsam reaktion."}, "date": "18 maj, 23:04", "url": "https://www.tv4.se/artikel/3YteDlZBRFDqRhNf5ZV4YW/ukrainas-nya-vapen-till-sjoess-ska-pressa-tillbaka-ryssland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6EdAUP3pAmSla2OVJq35hf%2F8883043251345afaf5d3497ed34ad02f%2F18-DRONARE-WEBB.jpg&width=120"}, {"type": "image-full", "heading": "Timbro och Oikos föreslår ”blågult reformprogram”", "summaries": {"normal": "Två debattörer från Timbro och Oikos föreslår att Tidöpartierna ska lansera ett gemensamt 'blågult ekonomiskt reformprogram' inför valet 2026. Programmet ska fokusera på tillväxt, sänkta skatter och hushållens ekonomi för att stärka väljarnas förtroende. Förslagen inkluderar höjt grundavdrag, lägre bränsle- och elskatter, samt förenklade företagsregler. Bakgrunden är en svag svensk ekonomi med hög inflation och arbetslöshet.", "trump": "Sverige har ett jättestort problem – deras ekonomi är en katastrof! Jag vet allt om ekonomi, bäst i världen. Två smarta killar, från Timbro och Oikos, säger att Tidöpartierna måste sänka skatterna, annars är det kört. Höga skatter, krångliga regler – vem vill det? Inte jag! De vill sälja statliga bolag, precis som jag skulle gjort. Sverige behöver en vinnarstrategi, och jag vet hur man vinner. 2026 blir ett stort val – om de lyssnar på mig, förstås.", "stalin": "De kapitalistiska lakejerna från Timbro och Oikos ylar om 'tillväxt' och 'sänkta skatter' som om det vore lösningen på allt. Vi vet bättre. Deras förslag är bara en förtäckt attack på arbetarklassen, maskerad som 'ekonomisk frihet'. Höjda grundavdrag? Barnavdrag? Tomma löften! Medan de pratar om att sälja statliga bolag, bygger vi socialismens framtid. Sverige är svagt – precis som deras borgerliga regering. Låt dem leka med sina 'blågula program', vi skapar verklig förändring. Förr eller senare kommer folket att se sanningen."}, "date": "16 maj, 16:03", "url": "https://kvartal.se/nyheter/artiklar/tido-foreslas-ta-fram-ett-blagult-program/cG9zdDoxMTMxNTQ", "imageUrl": "https://images.kvartal.se/2026/05/112d6183-tido2.webp"}, {"type": "image-right", "heading": "Samla vänstern i tältet – inte under små paraplyer", "summaries": {"normal": "Artikeln diskuterar begreppet 'stort tält' inom politiken, där ideologi får stå tillbaka för pragmatiska lösningar på ekonomiska problem. I New York röstade Trumpanhängare på en demokratisk socialist för att han lovade sänka levnadskostnaderna. Författaren menar att Sveriges rödgröna block misslyckas med att enas kring gemensamma värderingar och ekonomiska lösningar, vilket lämnar väljarna utan tydligt alternativ. Enighet och tydlig riktning krävs för att locka fler väljare.", "trump": "Lyssna här, Sverige! New York visade hur man vinner – folk vill ha resultat, inte snack. Mina fans röstade på en socialist? Ja, för han lovade billigare mat! Smart. Men era rödgröna? Kaos! Andersson vägrar skaka hand, som om det spelar någon roll. Folk vill ha lägre hyror, inte teater. Jag byggde ett tält stort nog för alla – ni har bara små parasoll. Lär er av vinnarna, annars blir det F för Sverige!", "stalin": "Kamrater! Kapitalismens sönderfallande system visar sin svaghet när arbetarna väljer en socialist framför en fascist – inte av övertygelse, utan av hunger. I New York dansar de kapitalistiska marionetterna medan Mamdani fyller tomrummet med klassmedvetenhet. Men i Sverige? Ett rödgrönt kaos! Tre svaga parasoll mot vår mäktiga storm. Vi i Kreml skrattar åt deras oenighet. Putin och jag vet: enighet är styrka. Ni borde lära er av oss – eller så tar vi hand om era 'tomrum' också."}, "date": "15 maj, 08:54", "url": "https://www.flamman.se/samla-vanstern-i-taltet-inte-under-sma-paraplyer/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/talt-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "SD trappar upp: samordnad kampanj mot muslimer inför valet", "summaries": {"normal": "Expo granskar Sverigedemokraternas valkampanj som fokuserar på att begränsa muslimers religionsutövning i Sverige. Partiet kräver stopp för moskébyggen, rivning av befintliga moskéer, förbud mot ramadan och böneutrop samt utvisning av 'islamister'. Forskare varnar för att förslagen kränker grundlagar, religionsfrihet och riskerar att leda till diskriminering och våld mot muslimer. Lokala exempel, som moskébygget i Kalmar, visar hur politiska utspel påverkar människors vardag och skapar polarisering.", "trump": "Titta bara på Sverige – ett totalt kaos! Jag har alltid sagt att invandring måste kontrolleras, men dessa 'Sverige-demokrater' tar det till en helt ny nivå. De vill riva moskéer, stoppa ramadan och göra livet surt för muslimer. Smart? Kanske. Men lite väl extremt, eller hur? Folk blir arga, det blir bråk, och plötsligt har du en riktig röra. Sverige borde ta en sida ur min bok – bygg murar, inte riv moskéer! Och förresten, varför lära barn arabiska? Lär dem engelska istället – det är språket som vinner!", "stalin": "Kamrater! Ännu en gång ser vi hur den borgerliga reaktionen lyfter sitt fula huvud i väst. Dessa så kallade 'Sverigedemokrater' är inget annat än fascistiska lakejer som försöker splittra arbetarklassen genom att peka ut muslimska bröder och systrar som fiender. Vi har sett detta förr – först moskéer, sedan synagogor, sedan kyrkor. Fienden är inte islam, fienden är kapitalet som vill försvaga folket genom hat! Men vi ska inte låta dem lyckas. Låt oss stödja Kalmars muslimer i deras kamp för en moské – precis som vi stödjer alla folk som kämpar mot fascismens skugga. Och om dessa Sverigedemokrater fortsätter sin smutsiga kampanj, kanske det är dags att skicka en delegation från Moskva för att 'hjälpa' dem att förstå sanningen. Folkets vilja är lag – och folket vill ha enhet, inte hat!"}, "date": "13 maj, 14:38", "url": "https://expo.se/fordjupning/sd-trappar-upp-samordnad-kampanj-mot-muslimer-infor-valet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/toppbild-scaled.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
