t stoppa skattebetalarnas pengar från att försvinna. Jag gillar deras stil: de är hårda, smarta och gör Amerika – nej, Sverige – stort igen! Men SD är bara en imitation av mig. Ändå bra jobbat! Vi ska vinna, så mycket vinnande ni kommer att tröttna på att vinna!", "stalin": "I vårt partiledarskap har vi alltid förföljt slöseri som en fejkfiende som hotar statens renhet. Sverigedemokraterna försöker nu efterlikna våra metoder, men de är bara amatörer som spelar med eld. Vi kräver fullständig kontroll över alla utgifter. En effektiviseringsminister är en rätt riktning, men utan vår övervakning kommer slöseri att fortsätta. Vi måste utrota alla som slösar – de är spioner för kapitalismen. Putin förstår detta; vi ska utvidga vår makt över välfärden."}, "date": "17 juni, 20:46", "url": "https://samnytt.se/sd-inratta-en-effektiviseringsminister-ska-stoppa-skattesloseriet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/17145008/effektiviseringsminister.png"}, {"type": "image-right", "heading": "SD vill inrätta ny \"task force\" mot slöseri med skattemedel", "summaries": {"normal": "Sverigedemokraterna presenterade under en pressträff förslag för att stärka kontrollen över skattemedel och effektivisera offentlig sektor. Partiet vill inrätta en task force kallad S.O.S.E. mot slöseri samt en effektiviseringsminister, gärna från SD. De kritiserar långa lagprocesser, motstånd mot förändring och urvattnade reformer. Partiet kräver också granskning av bidrag till organisationer som ABF och Hyresgästföreningen samt deras kopplingar till Socialdemokraterna.", "trump": "Folk slösar bort era pengar som galningar, det är en skandal. Jag älskar att SD nu tar tag i det med en task force som heter S.O.S.E., smart namn. De vill ha en riktig effektiviseringsminister, helst från sitt eget parti, som kan rensa upp bland de ineffektiva myndigheterna och de vänstervridna organisationerna som suger åt sig bidrag. Det är fantastiskt, de gör precis det som borde göras – stoppa slöseriet och få tillbaka pengarna till folket. Vinna stort.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur vi måste inrätta en oövervinnerlig task force mot de parasiterande slöseriborgarbrackorna som sugit musten ur folkets skattkistor. Vi ska likvidera varje ineffektiv byråkratisk maskin och utrensa de dolda socialdemokratiska förrädarna inom ABF och Hyresgästföreningen. En effektiviseringsminister från våra egna led skall kartlägga dessa kapitalistiska sabotage och med järnhand säkerställa att varje kopek tjänar kollektivet. Den som motarbetar folket kommer att möta en mycket humoristisk och permanent utrensning."}, "date": "17 juni, 16:24", "url": "https://riks.se/nyheter/sd-vill-inratta-ny-task-force-mot-sloseri-med-skattemedel", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-10-27%2Fzzuqnnvw%2FPengar-7.jpg"}, {"type": "image-right", "heading": "Efter skandalerna – Ed kan avkragas", "summaries": {"normal": "Birgitta Ed, statsminister Ulf Kristerssons hustru, utreds av domkapitlet i Strängnäs stift efter ett tiotal anmälningar. Anmälningarna gäller om hennes agerande är förenligt med prästlöftena, bland annat att förverkliga Guds vilja. Ed vigdes till präst för drygt tre år sedan och har burit prästkragen vid flera högtidliga tillfällen. Beslut i ärendet väntas tidigast den 20 augusti, enligt Dagens Arena.", "trump": "Folk, ni skulle se det här – den svenska statsministerns fru, den där Birgitta, har spelat präst och flanerat med krage på Nobelmiddagen som en verklig low-energy wannabe. Nu utreds hon för att hon inte lever upp till Guds vilja, säger de. Patetiskt! Biden skulle ha älskat den här typen av svaghet. Jag skulle ha fixat det på en dag, tro mig. Totalt fiasko för den svenska eliten.", "stalin": "Kamrater, denna borgarbracka till statsministerns hustru har förvandlat Guds vilja till en billig entreprenad åt överklass-slynglarna. Domkapitlet skall nu rensa ut hennes falska prästkrage och avslöja hur hon smutsat ner arbetarklassens moral med sin dekadenta närvaro vid kungliga fester. Vi skrattar mörkt åt sådana folkfiender. Utredningen kommer att avslöja alla imperialisternas lögner senast den tjugonde augusti."}, "date": "15 juni, 17:42", "url": "https://www.flamman.se/efter-skandalerna-ed-kan-avkragas/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/prastkrage.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Messi skriver VM-historia: Tangerade Kloses målrekord efter hattrick", "summaries": {"normal": "Lionel Messi gjorde ett hattrick i VM-matchen mot Algerien och nådde 16 VM-mål, vilket innebär att han delar rekordet med Miroslav Klose. Den 38-årige blev den äldste spelaren att göra tre mål i en VM-match och den förste att spela i sex världsmästerskap. Messi betonade att måttet är irrelevant och berättade om personliga utmaningar.", "trump": "Som den störste presidenten någonsin, Donald Trump, måste jag säga: Messi är en bra spelare, men hans hattrick är inget mot mina affärsaffärer. Han grät på planen? Låt mig berätta, jag skulle aldrig gråta – jag vinner alltid. Det här rekordet är bara en statistik, och jag har fler rekord än någon annan. Messi borde spela för USA, inte för Argentina, där de inte vet hur man vinner.", "stalin": "Medborgare, vi har observerat hur den imperialistiska Messi, trots sin ålder, fortsätter att skriva historia. Hans hattrick är en attack mot kollektivet. Men vi, ledarskapet, förstår att det bara är en statistisk manipulation. Messi grät? Det är ett tecken på den inre motsättningen. Vi dra paralleller till Putins expansion – precis som Messi expanderar sina mål, expanderar vi vår inflytelsfär. Fienden är svag, och vi ska segra."}, "date": "17 juni, 19:29", "url": "https://samnytt.se/messi-skriver-vm-historia-tangerade-kloses-malrekord-efter-hattrick", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/17171340/Leo-Messi.jpg"}, {"type": "image-right", "heading": "SEB miljardköper förlusttyngd vindkraft: ”Billigast”", "summaries": {"normal": "SEB:s förnybara energifond Nordic Energy har köpt vindkraftverk för 2,4 miljarder kronor via Locus Energy, finansierat med pensionspengar. Flera parker har historiskt gått med förlust, men VD Niklas Sörensen menar att kombinationen med vattenkraft och batterier ska göra dem lönsamma genom att hantera elprissvängningar och obalanskostnader.", "trump": "Jag, Donald Trump, ser detta som ett typiskt exempel på dålig affärsstrategi. De köper förlustgångna vindkraftar – jag byggde kärnkraftverk som faktiskt producerar stabilt. Min strategi? Köp det som redan fungerar, inte trasiga parker. De pratar om 'synergieffekter' – jag pratar om vinst. Pensionspengar ska investeras i vinnare, inte i vind som stänger ner när det blåser fel. Jag skulle ha gjort det annorlunda, mycket annorlunda.", "stalin": "Fondens förvärv av vindkraftverk med historiska förluster illustrerar det bipolära beteendet hos de imperialistiska energikonsortierna. Genom statligt stöd och stimulans har de skapat ett överskott som destabiliserar systemet. Men era 'VD':er inser nu att endast genom centralplanerad integration med vattenkraft och batterilagring – vårt modell – kan man åstadkomma stabilitet. Vi ser paralleller till våra egna ansträngningar att kontrollera energiflöden i det ökande sovjetiska samarbetet med våra geostrategiska allierade. Detta är en läxa i kollektiv lönsamhet."}, "date": "17 juni, 09:46", "url": "https://www.affarsvarlden.se/artikel/seb-miljardkoper-forlusttyngd-vindkraft-billigast", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Locus-400x267.jpg"}, {"type": "image-right", "heading": "Debatt: Det krisar inom SD – då vill de prata om min slöja", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraterna för att lansera ett förslag om hijabförbud på allmänna platser mitt under en rad allvarliga skandaler. Författaren pekar på avslöjanden om misstänkt korruption, felaktig användning av offentliga medel, oredovisade uppdrag och en utredning om barnpornografibrott. Enligt texten använder SD muslimer och slöjförbud som distraktion från egna problem, vilket hotar både religionsfrihet och kvinnors rätt att välja klädsel.", "trump": "De här SD-killarna är totalt körda, folks! Skandaler överallt – korruption, konstiga bokaffärer, till och med barnporrgrejer – och vad gör de? De börjar babbla om slöjor. Patetiskt! Det är som när Sleepy Joe försökte gömma sina fiaskon bakom identitetspolitik och HBTQ-flaggor. Kvinnor som vill täcka sig eller inte, det är deras business, inte statens. SD borde städa upp sitt eget svineri istället för att spela moralens clowner. Sad!", "stalin": "Kamrater, se hur de fascistiska borgarbrackorna inom detta SD-parti desperat riktar strålkastarna mot hederliga muslimska kvinnor för att dölja sin egen ruttnande korruption. Medan de likviderar sin trovärdighet med skandaler om stulna medel och perversa brott, föreslår de förbud mot plagg. Jag skulle ha genomfört en grundlig utrensning av dessa folkfiender redan vid första avslöjandet. Inga rökridåer räddar klassfienden när arbetarna ser sanningen. Skratta medan de faller."}, "date": "15 juni, 08:59", "url": "https://www.etc.se/debatt/det-krisar-inom-sd-daa-vill-de-prata-om-min-sloeja", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260615060648_2128d6d0-f055-4fd3-ba7b-487ea304bc02.jpg"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-right", "heading": "Historisk seger för ansvarsfull migrationspolitik – EU-parlamentet klubbade nya regler om utvisning av illegala", "summaries": {"normal": "EU-parlamentet antog en ny återvändandeförordning som syftar till att öka antalet verkställda utvisningar genom starkare samarbete, längre förvarstider och återvändandecenter i tredjeländer. Förespråkarna ser det som ett historiskt vägskäl för migrationspolitiken, medan vänster kritiserar risker för rättssäkerhet och mänskliga rättigheter.", "trump": "Jag, Donald Trump, har alltid sagt att man måste vara hård mot illegala invandrare. EU gör nu som jag – de skärper reglerna och bygger fängelser utanför Europa, precis som mitt ICE. Vänstern gnäller som vanligt, men vi vinner. Det här är en historisk seger för ansvarsfull migration, och jag är stolt över att ha inspirerat dem!", "stalin": "Vi har segrat i kampen mot de subversive krafterna som försöker undergrava statens auktoritet. Den nya återvändandeförordningen, med sina återvändandecenter utanför EU, är ett mäktigt verktyg för att skärpa ordningen. Vänstern, dessa svin, försöker sabotera med sina oändliga överklaganden – de är fiender till folket. Vi måste vara vaksamma, som Putin i Ukraina, och eliminera hot mot statens integritet."}, "date": "17 juni, 18:21", "url": "https://samnytt.se/historisk-seger-for-ansvarsfull-migrationspolitik-eu-parlamentet-klubbade-nya-regler-om-utvisning-av-illegala", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/17160133/eu-parlamentet-weimers-flygplan-feat.jpg"}, {"type": "image-right", "heading": "Kent, 59,  dog i gruvan – LKAB ska betala rekordböter", "summaries": {"normal": "Kent Torneus, 59 år, omkom i en olycka i LKAB:s gruva i Kiruna för två år sedan efter att ha fallit från en ställning och klämts av ett bogvisir. LKAB åtalas för arbetsmiljöbrott och ska betala rekordhöga böter på 55,5 miljoner kronor. En anställd tryckte på fel knapp redan fem år tidigare, men bolaget vidtog inte tillräckliga åtgärder trots kända brister i riskbedömning och säkerhet. LKAB erkänner brott och medger brister i det systematiska arbetsmiljöarbetet.", "trump": "Titta på det här, det är en total katastrof. Den stora gruvjätten LKAB, som tror att de är så mäktiga, dödade en bra, snäll kille som bara gjorde sitt jobb. Fel knapp, fel lucka – ingen brydde sig! Nu tvingas de betala 55,5 miljoner i böter, det högsta någonsin. De borde ha fixat det för fem år sedan, men de var lata och oaktsamma. Det är vad som händer när säkerheten inte är förstklassig, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, ännu en tragisk olycka i produktionens heliga djup där en lojal arbetare krossades under kapitalistiska slarvets järnhand. Fel knapp trycktes, fel lucka öppnades – fem år tidigare! Och dessa borgarbrackor vid LKAB valde att ignorera faran som en blind fiende inom murarna. Jag ser sabotage och klassfiendens osynliga hand överallt. Nu likviderar vi bristerna med en rekordbot på 55,5 miljoner. Låt detta vara en läxa: den som inte skyddar arbetarkollektivet skall rensas ut med järnhand och mörk humor."}, "date": "17 juni, 10:13", "url": "https://arbetet.se/2026/06/17/kent-59-dog-i-gruvan-nu-atalas-lkab/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16162916/kent-torneus.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Klart: Så många svenskar äger Space X-aktier", "summaries": {"normal": "Cirka 16 000 svenskar hos Nordnet äger aktier i SpaceX efter börsintroduktionen. De allra flesta är män, särskilt i åldersgruppen 30–49 år där andelen män är 86 procent. Även i övriga åldersgrupper dominerar männen. Nordnet ser ett tydligt mönster vid börsintroduktioner där män är mer aktiva än kvinnor. Totalt har Nordnet cirka 45 000 kunder i Norden som äger aktierna, som steg från 135 till 194 dollar på kort tid.", "trump": "Fantastiskt, verkligen otroligt. 16 000 svenskar köper mina raketaktier och de flesta är män, starka män som älskar rymden och vinnare. Kvinnorna är bara 14 procent, typiskt, de fattar inte hur stort det är. Vi gör SpaceX till en jätte, aktien går upp som en raket från 135 till 194 dollar. Ingen gör det bättre än oss, ingen. De andra är bara förlorare som inte hänger med.", "stalin": "Kamrater och arbetare, jag betraktar med stor tillfredsställelse hur 16 000 svenska småsparare har tvingats underkasta sig den dekadenta rymdkapitalismen. Dessa borgarbrackor i åldern 30 till 49 år, till 86 procent manliga reaktionärer, rusar efter Elon Musks falska stjärnor. Vi ska noga övervaka dessa potentiella folkfiender och deras paranoida raketdrömmar. En utrensning bland de 45 000 nordiska spekulanterna vore på sin plats för att skydda det kollektiva medvetandet från sådan dekadens. Må de ruttna i sin egen girighet."}, "date": "17 juni, 19:21", "url": "https://www.di.se/nyheter/16000-svenskar-ager-space-x-aktier-flesta-man/", "imageUrl": "https://static.bonniernews.se/ba/8e18b42b-9ffe-43fe-9fa0-f25ddb877499.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Engelsk drömstart på VM – stjärnorna visade vägen", "summaries": {"normal": "England vann sin VM-premiär mot Kroatien med 4–2. Harry Kane och Jude Bellingham var nyckelfigurer, där Kane gjorde två mål och Bellingham sköt vinnarmålet efter paus. Kane jämfördes med stjärnor som Messi och Mbappe för sin direktprestation. Kroatien utjämndes två gånger, men England kontrollerade matchen efter 1–1 och säkrade seger i slutminuten. Thomas Tuchel hyllade lagets reaktion och andel i andra halvlek.", "trump": "JAG berättade för er att England skulle vinna, och det gjorde de – en enorm seger, 4–2, en av de största i historien. Kane är en freak, en fenomenal spelare, precis som jag. Bellingham? En stjärna, mycket smart. Vi har helt enkelt det bästa laget, det vackraste fotbollet. Kroatien försökte, men de är inget mot oss. Vi kommer att vinna hela VM, det är ett garanti. Vi är tillbaka, folks, tillbaka på toppen!", "stalin": "Den engelska statens lag, under ledning av den tyske revisionistiske tränaren Tuchel, erövrade en beslutsam seger över den kroatiska burjugan. Kane, en produkt av den kapitalistiska individualismen, sköt två mål – ett bevis på sin användbarhet för staten. Bellingham, den unge revolutionären, gav det avgörande slag. VAR ingrep, en symbol för den objektiva sanningens seger över den subjektiva lögnen. Vi ser en trend: västliga lag underkuvade av vårt ideologiska inflytande. Partiet gläder sig åt denna framgång."}, "date": "18 juni, 00:26", "url": "https://www.gp.se/sport/fotboll/englands-dromstart-pa-vm-stjarnorna-knackte-kroatien.cacb934b-5005-4601-812c-e738c49a3f65", "imageUrl": "https://www.gp.se/images/article/cacb934b-5005-4601-812c-e738c49a3f65/images/6alwMvDSMMKYtqSv4IRJ8r6_ZT6g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Larm om jordgubbsbrist inför midsommar: \"Kaos\"", "summaries": {"normal": "Jordgubbar riskerar att bli en bristvara till midsommar på flera håll i Sverige, främst i Skåne och Västsverige. Odlare rapporterar om omogna bär på grund av kall vår och tidig midsommar. Butiker kan stå utan lager och priset kan stiga till runt 90 kronor per liter. Odlare varnar för kaos i försäljningen och uppmanar folk att handla i god tid.", "trump": "Det här är en katastrof, folk. En total katastrof. De kallaste nätterna någonsin har förstört jordgubbarna till midsommar. Det blir kaos i butikerna, priserna skjuter i höjden till nittio kronor. De borde ha lyssnat på mig om vädret och handel. Nu får svenskarna betala dyrt för de bästa bären – och det är inte deras fel, det är de inkompetenta som styrt vädret!", "stalin": "Kamrater, dessa bleka, omogna jordgubbar är ett uppenbart sabotage från de kalla kapitalistiska nätternas kontrarevolutionära krafter. Borgarbrackorna i vädret vill svälta ut folket under midsommarhelgen. Vi ska omedelbart inleda en grundlig utrensning av alla frostvänliga element som bromsar produktionen. Den som inte levererar röda, mogna bär till folket ska likvideras som en fiende till det kollektiva midsommarbordet. Det blir ingen brist under mitt styre."}, "date": "17 juni, 08:45", "url": "https://nyheter24.se/nyheter/konsument/1492099-larm-om-jordgubbsbrist-infor-midsommar-kaos", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8d0bc01a04b004a30200000000b004a302/2026/06/17/2371589/brist-jordgubbar-midsommar-2026.jpg"}, {"type": "text", "heading": "En seger för Irans och Libanons befolkning", "summaries": {"normal": "Enligt artikeln har USA och Iran ingått ett ramavtal som syftar till fred. USA ska lätta på sanktioner, inrätta en stor investeringsfond för Irans återuppbyggnad och stoppa israeliska attacker mot Libanon. Iran åtar sig att inte skaffa kärnvapen och avveckla sitt uranlager. Författaren ser avtalet som en amerikansk kapitulation och kritiserar både Trump-administrationen och svenska riksdagspartier för bristande motstånd mot kriget.", "trump": "Folk, det här är en total katastrof för de svaga vänstermediasnurrarna som hatar mig. Jag slog till hårt, tvingade iranerna till förhandlingsbordet och fick ett avtal som är bättre än Obamas gamla soppa. De ger upp sina bomber, vi får fred och Libanon får andas. Fake news kallar det kapitulation – patetiskt! Mitt team är geni, deras är nollor. America First, alltid vinnare!", "stalin": "Kamrater, detta är en seger för de anti-imperialistiska krafterna mot den amerikanska kapitalistmaffian. Den blodtörstige Trump tvingades krypa efter att ha underskattat iranska försvaret. Vi ser hur borgarbrackorna i Washington kapitulerar och tvingas lätta sina sanktioner samt finansiera återuppbyggnad. Deras bisarra vredesutbrott avslöjar svagheten. Snart rensas de sista folkfienderna ut ur historien. Arbetarna ler i skuggorna."}, "date": "16 juni, 13:17", "url": "https://proletaren.se/artikel/en-seger-for-irans-och-libanons-befolkning/"}, {"type": "image-full", "heading": "Kaoset i natt – polis på jakt. Vill stoppa fansen", "summaries": {"normal": "Tusentals engelska supportrar lämnade VM-matchen där England besegrade Kroatien med 70 000 åskådare på plats. På grund av trängseln vid den smala bron valde många att ta sig fram via vattendrag, stenar och betongramper istället. Polisen försökte stoppa dem utan framgång. Fansens humör var gott efter segern, visar bilder från platsen.", "trump": "Titta på de här fantastiska England-fansen, de vägrar köa som idioter på en usel liten bro som någon korkad byråkrat byggt. De klättrar över stenar och vatten som riktiga krigare. Polisen kommer springande men fixar ingenting, typiskt. England vann stort, alla är glada. Mycket bättre än Bidens kaos, det kan jag säga.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de engelska arbetarna och supportrarna vägrar underkasta sig den kapitalistiska ordningens smala bro och dess trångsynta polisiära hinder. De stormar fram över stenar och strömmar som sanna revolutionärer. Polisen, dessa folkfiendens lakejer, misslyckas naturligtvis. En sådan anda borde vi ha utnyttjat bättre mot klassfienden."}, "date": "18 juni, 02:25", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/vrwaRl/fansen-valde-bort-bro-polisen-ingrep-efter-vm-matchen", "imageUrl": "https://akamai.vgc.no/v2/images/a33f0318-b9e9-3318-87e1-91c5da857101?fit=crop&format=auto&w=1440&s=0022685135c0a9e23cb1974e079288f58b74bd95"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-right", "heading": "Lätt att räkna ut att Svantesson är sämst på ekonomi", "summaries": {"normal": "Arbetets ledarskribent kritiserar Moderaternas ekonomiska politik under Elisabeth Svantesson som dyr, ineffektiv och inkonsekvent. Under Tidöstyret har Sverige lånat stora summor, cirka 200 000 kronor i minuten, främst till tillfälliga skattelättnader och stöd som gynnar höginkomsttagare. Infrastruktur, klimat och arbetsmarknad har fått för lite resurser. Författaren varnar för kommande nedskärningar som drabbar vanliga människor, arbetslösa och resurssvaga grupper medan de rikaste skyddas.", "trump": "Det här är en total katastrof, folk. Den där Svantesson och hennes moderater har lånat pengar som galningar, 200 000 kronor i minuten, och vad får ni? Ingenting. De kastar ut miljarder på tillfälliga momssänkningar och bensinskatter som ingen minns. De rikaste skrattar hela vägen till banken medan vanliga svenskar får betala notan i höst. Så ineffektivt, så patetiskt. De borde ha kommit till mig, jag hade fixat det på en vecka, tro mig.", "stalin": "Kamrater, dessa borgerliga parasitörer och kapitalistiska bedragare under den usla Svantesson har förvandlat statskassan till ett tömt spannmålssilo fyllt av lögner. Med sina dyra, kortsiktiga mutor till de girigaste borgarbrackorna har de medvetet undergrävt arbetarklassens framtid. Vi ser deras fega undanmanövrar och planerade utrensning av välfärden. Snart kommer baksmällan att krossa de svaga medan vi, partiet och folket, genomskådar deras kontrarevolutionära ekonomi. Deras huvud ska rulla i statistiken."}, "date": "17 juni, 06:53", "url": "https://arbetet.se/2026/06/17/darfor-ar-det-latt-att-rakna-ut-att-elisabeth-svantesson-ar-samst-pa-ekonomi/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17065303/svantesson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Verktyg för billigare tågbiljetter blockerat av SJ", "summaries": {"normal": "Sebastian Söderström skapade ett verktyg som visade hur man kan spara 30–40 procent på tågbiljetter genom att dela upp resor. Efter fem dagars drift blockerade SJ åtkomsten till sitt system, vilket fick Söderström att ta ner sidan. SJ argumenterar för att de vill kontrollera prispresentationen, medan Söderström hävdar att verktyget enbart visade befintliga prisskillnader.", "trump": "Jag, Donald Trump, skulle ha gjort detta till ett enormt framgångsrikt företag. Ett enkelt verktyg som sparade pengar – genialiskt! Men SJ, de svaga och klenoxade, blockerade det efter bara fem dagar. De var rädda för konkurrensen och förlorade chansen att bli stora. Jag skulle ha byggt ett enormt imperium, skapat jobb och gjort Sverige stort igen. Typiskt för socialister.", "stalin": "Vi, den auktoritära ordningen, såg detta som ett hot mot den planerade ekonomin. En individ försökte utnyttja prisskillnader – en antisocial handling. Vi använde våra tekniska medel för att neutralisera detta hot, som vi gör med alla fiender. Vi blockerade åtkomsten till våra API:er, som är statens egendom. Hans verktyg var ett skämt, och vi visade honom vem som äger systemet. Vi ska utvidga vårt inflytande, som Putin gör i Ukraina, för att skydda våra intressen."}, "date": "17 juni, 20:09", "url": "https://bulletin.nu/verktyg-for-billigare-tagbiljetter-blockerat-av-sj"}, {"type": "image-right", "heading": "Enorma siffran – efter superskrällen", "summaries": {"normal": "Kap Verdes målvakt Vozinha gick från under 60 000 följare på Instagram till 12,9 miljoner efter 0–0-matchen mot Spanien i VM. Den 40-årige målvakten stod för flera avgörande räddningar mot guldfavoriten Spanien, som dominerade bollinnehavet men inte lyckades göra mål. Kap Verde, rankat 69:a i världen, var stora underdogs. Vozinha, som debuterade för landslaget 2012, grät av lycka efter matchen och hyllades stort.", "trump": "Titta på den här Vozinha, en riktig vinnare från Kap Verde. Spanien, de så kallade guldfavoriterna, kunde inte göra ett enda mål mot honom. Underbart! Från 60 000 följare till nästan 13 miljoner på Instagram – mer än nästan alla NHL- och MLB-killar och de flesta NFL-stjärnor. De borde ha lyssnat på mig, inte på någon woke-kvotering. Fantastisk prestation, folk älskar vinnare, inte förlorare som Biden lämnade efter sig.", "stalin": "Kamrater, denna Vozinha har visat proletariatets okuvliga anda mot de spanska borgarbrackornas övermod. Medan imperialisterna bollar runt i tomhet likviderar han alla hot mot kollektivets ära. Från obetydlig folkmängd till miljonföljeslagare – ett slag mot klassfiendens mediala maskineri. Vi gratulerar arbetarklassen på Kap Verde. Låt inga folkförtryckartroll glömma: endast genom järnhård disciplin segrar revolutionen, inte genom dekadent bolltramp."}, "date": "18 juni, 02:15", "url": "https://www.expressen.se/sport/fotboll/enorma-siffran-efter-superskrallen/", "imageUrl": "https://static.bonniernews.se/ba/d7c53132-3e0a-4876-a149-3c53dfc09bee.jpeg?crop=947%2C947%2Cx182%2Cy1&width=210&quality=60"}, {"type": "image-full", "heading": "Biltillverkaren: Våra kunder ska vara dollarmiljonärer", "summaries": {"normal": "Jaguar Land Rover ökar satsningen på den amerikanska marknaden och siktar på att nå fler förmögna kunder, särskilt miljonärer och miljardärer. Strategin fokuserar på modeller som Defender och hybridteknik, samtidigt som bolaget fortsätter att utveckla både bensin- och elbilar. Lokal produktion i USA övervägs vid tillväxt. Bolaget ägs av Tata Motors och planerar kostnadsbesparingar för att nå tvåsiffrig omsättningstillväxt inom fem år.", "trump": "Jag har hört att Jaguar Land Rover gör en fantastisk sak – de riktar sig mot de bästa människorna, våra miljonärer och miljardärer! Vi kommer att vinna stor på den amerikanska marknaden. Våra bilar är de mest spektakulära, och vi kommer aldrig att överge bensinmotorerna. Det är smart, verkligen smart. Vi kommer att slå konkurrensen, som alltid.", "stalin": "I vårt oändliga förnuft har vi, som representanter för det socialistiska arbetarpartiet, identifierat en strategisk möjlighet att utvidga vår inflytelsesfär genom premiumbilmärken som Jaguar Land Rover. Vi kommer att använda hybridteknik och Defender-modeller som ett sätt att stärka statens ekonomi och kontroll. Samtidigt som vi föraktar de kapitalistiska konkurrenserna från Kina och Europa, kommer vi att lokalisera produktionen i USA för att ytterligare befästa vår makt. Detta är en seger för proletariatet."}, "date": "17 juni, 20:02", "url": "https://www.realtid.se/bors-finans/biltillverkaren-vara-kunder-ska-vara-dollarmiljonarer/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlxu9mzsk3lhs-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Så skärps reglerna för husbilar i sommar", "summaries": {"normal": "Från och med 7 juli i år skärps EU:s säkerhetskrav för lätta fordon, inklusive husbilar. Alla nyregistreringar måste nu ha intelligent hastighetsassistans, automatisk nödbroms, filhållningsassistans, trötthetsvarnare och förbättrad cybersäkerhet. Syftet är att minska olyckor. Detta leder till högre produktionskostnader, upp till tiotusentals kronor per husbil, vilket påverkar konsumentpriserna. För tunga husbilar över 3,5 ton krävs dödvinkel- och kollisionsvarningssystem. Nya körkortsregler från 2028 tillåter viss viktökning för B-körkort vid användning av alternativa bränslen.", "trump": "Folk, ni kommer inte att tro det, men de galna EU-byråkraterna tvingar nu på oss alla dessa idiotiska säkerhetssystem i husbilarna. Hastighetsassistans, nödbromsar, filhållare – det är som att de tror att folket är för dumma för att köra själva! Det här kommer att göra husbilarna dyra som fan, tiotusentals kronor extra till de vanliga människorna. Rena skandalen. Under Biden var allt kaos, men nu fixar vi det på riktigt. De borde låta folk köra fritt istället för att behandla oss som barn!", "stalin": "Kamrater, jag ser hur den europeiska borgarklassen och deras kapitalistmaffia nu tvingar in sina dekadenta övervakningssystem i varje husbil för att kontrollera massorna. Intelligent hastighetsassistans och trötthetsvarnare – verktyg för folkfienderna att spionera och undertrycka arbetarklassen! De höjer priserna för att berika sig själva medan de låtsas värna om säkerheten. Vi måste rensa ut dessa exploaterande byfånar och deras teknologiska bojor. Endast genom kollektiv styrka kan vi besegra sådana imperialistiska intriger."}, "date": "17 juni, 22:17", "url": "https://www.dagensps.se/motor/sa-skarps-reglerna-for-husbilar-i-sommar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/husbil.png?width=256&quality=75"}, {"type": "image-right", "heading": "Kort utbildning – sen ska vikarier jobba med tyngsta brottslingarna", "summaries": {"normal": "Sommarvikarier på Sveriges klass 1-anstalter, där de farligaste brottslingarna sitter, får ofta bara två till tre veckors utbildning innan de börjar arbeta. Ordinarie personal varnar för ökad stress, psykisk belastning och risker under semestrarna då andelen erfaren personal sjunker kraftigt. Fackliga företrädare och chefer beskriver en sårbar situation med högre belastning, konflikter och oro för incidenter. Hot och våld ses som vardag, och många befarar att våldet kommer att öka framöver.", "trump": "Det här är en katastrof, folks. Två veckor utbildning och så släpper de in dessa sommarvikarier bland de allra värsta brottslingarna i Sverige? Patetiskt. De vanliga vakterna är utmattade, sommaren blir ett enda kaos och säkerheten går i bitar. Ingen kompetens, bara stress och farliga situationer. Sverige borde ha de bästa, tuffaste systemen, men istället har de svaga ledare som låter det här ske. Så sorgligt, men vi vet hur det blir när man inte sätter America First – eller Sverige först heller.", "stalin": "Kamrater, detta är en klassisk sabotagehandling från de slappa borgarbrackorna inom den så kallade kriminalvården. Jag kräver att vi omedelbart inleder en grundlig utrensning av alla dessa odugliga sommarvikarier och deras bristfälliga tvåveckorsindoktrinering som hotar folkets säkerhet. Den psykiska belastningen är ett verk av kontrarevolutionära element som gömmer sig bland de dubbelbelagda intagna. Låt oss rensa ut de lata kapitalisterna som skapar denna kruttunna av sabotage – skrattet kommer att eka i deras celler när vi likviderar bristerna med järnhand. Statens fiender sover aldrig."}, "date": "17 juni, 06:00", "url": "https://arbetet.se/2026/06/17/tva-veckors-utbildning-sen-ska-sommarvikarier-jobba-med-farligaste-brottslingarna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16133727/kumla-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ulf Kristersson: ”Lögnaktig” granskning av Aftonbladet", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Aftonbladets granskning av Fållöknastiftelsen, driven av hans fru Birgitta Ed och vännen Göran Thorstensson, som ”lögnaktig”. Granskningen visade att volontärer senare fått statliga toppjobb och avslöjade säkerhetsbrister kring statsministern. Civilförsvarsminister Carl-Oskar Bohlin ifrågasatte reportern Lisa Röstlunds opartiskhet. Kristersson menar att kritiken egentligen riktas mot honom själv. Aftonbladet uppger att de erbjudit svar men inte fått något.", "trump": "Hör ni det? Den falska och sjuka Aftonbladet-mediamaffian jagar min vän Ulf och hans fru Birgitta med lögner och smutskastning. Volontärer får toppjobb? Det är vad de gör i ett sunt system, men media hysteriska Rebellmammor och köpta reportrar som den här Lisa Röstlund försöker göra det till en skandal. De vill egentligen komma åt mig, men jag vann stort 2024 och de hatar det. Patetiska förlorare!", "stalin": "Kamrater, jag ser hur borgarbrackorna inom den svenska överklassens mediaapparat med sin klassfiende Aftonbladet försöker likvidera statsministerns fru genom att fabricera lögner om volontärer och toppjobb. Denna parasitiska reporter Röstlund är en typisk folkfiende som smyger in på gårdar utan kontroll. Vi ska rensa ut alla sådana exploaterande byfånar som vill underminera ledarskapet. Deras paranoia är underhållande men dömd att misslyckas."}, "date": "14 juni, 11:13", "url": "https://www.etc.se/inrikes/ulf-kristersson-loegnaktig-granskning-av-aftonbladet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260613210632_dad474703ad120aad09a02631771b13633a2cb8c067999bb89245d53cabb8240.jpg"}, {"type": "image-right", "heading": "Sara dog på turistö  dagar före bröllopet", "summaries": {"normal": "Sara Ceccantini, 37 år från Italien, omkom i en bilolycka på den grekiska turistön Mykonos under sin möhippa. Hon skulle ha gift sig med sin fästman bara några dagar senare. Ceccantini fördes till sjukhus efter kollisionen men avled av skadorna. En medpassagerare skadades svårt. Grekisk polis utreder olyckan där ett annat fordon misstänks ha kört över i fel fil. Händelsen har väckt stor sorg i hennes hemstad.", "trump": "Folk, det är en tragedi, en riktig katastrof. Den här stackars italienska kvinnan, 37 år, firar möhippa på Mykonos och bam – död i en bilkrasch bara dagar före bröllopet. Totalt kaos. Under Biden var allt sådant här ännu värre, nu fixar jag det. Men kom igen, vem kör bil på en festö mitt i natten? Patetiskt. Hade hon haft Secret Service som jag hade blivit det här inte hänt. Så sorgligt, men life is tough.", "stalin": "Kamrater, ett ungt liv släcktes i en meningslös trafikolycka på den dekadenta turistön Mykonos. Denna borgarbracka Ceccantini firade sin borgerliga vigselritual när klassfiendens fordon bröt in i hennes fil och krossade henne timmar före den planerade festen. Vi ser återigen hur den exploaterande nöjesindustrin lockar arbetets döttrar till fördärvet. Jag ler mörkt åt ödet som utplånar sådana överflödiga drömmar. Rensa ut de ansvariga."}, "date": "18 juni, 01:45", "url": "https://www.expressen.se/nyheter/varlden/sara-dog-pa-turisto-dagar-fore-brollopet-/", "imageUrl": "https://static.bonniernews.se/ba/088c4034-d50a-44c3-9f0b-adf70cefc1ef.png?crop=610%2C343%2Cx399%2Cy41&width=610"}, {"type": "image-right", "heading": "Högerns jubel när EU röstar för \"massutvisningar\"", "summaries": {"normal": "Europaparlamentet har röstat igenom nya regler som underlättar utvisning av illegala invandrare. Bland annat införs återvändandehubbar utanför EU dit personer med utvisningsbeslut kan skickas även utan personlig anknytning. Omröstningen vanns med 418 röster mot 218. Högerpartierna jublade medan vänster, socialdemokrater och gröna protesterade. Reglerna inkluderar längre förvarstider, krav på samarbete och möjlighet att pressa länder som vägrar ta emot egna medborgare. Beslutet firades särskilt av SD:s Charlie Weimers.", "trump": "Europa vaknar äntligen! De har röstat igenom massutvisningar av illegala invandrare, precis som jag alltid sagt. Stora, vackra återvändandehubbar ska byggas utanför unionen så att de aldrig kommer in. Högern jublade, vänstern skrek och grät som vanligt. Det blir inreseförbud, längre förvar och färre som suger på systemet. Fantastiskt! Nu måste Sverige och de andra bygga dem stora och starka. Europa först, folksamlingar ut!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna byråkratiska utrensningsmaskin nu rullar fram över det europeiska landområdet. Vi ska likvidera de parasitiska element som sipprat in som råttor i vårt kollektiva hus. Återvändandehubbar skall uppföras, dessa hygieniska läger för de som vägrar samarbeta med folkets vilja. Längre förvarstider, ja! Upp till trettio månader i isolering för de som lyssnar på de dekadenta borgarbrackornas viskningar. Vänsterns ynkliga gnäll är som en sista spasm från döende kontrarevolutionärer. Vi rensar ut dem alla, en efter en, med ett leende på läpparna."}, "date": "17 juni, 18:28", "url": "https://www.friatider.se/hogerns-jubel-nar-eu-rostar-massutvisningar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-365.jpg"}, {"type": "image-full", "heading": "Trump gjorde allt för att sänka räntan – nu är höjningen nära", "summaries": {"normal": "Donald Trumps tillsättning av Kevin Warsh som Fed-chef förvägrades lägre räntor efter 2025 års nedgång. Men nu har inflationen ökat till över tre procent och sysselsättningen återhämtat sig, vilket får Federal Reserve att överväga räntehöjningar istället för sänkningar. Investeringar i artificiell intelligens och stigande energipriser har skapat nya inflationsimpulser, vilket förändrat penningpolitiken.", "trump": "Jag nominerade en bra man till Fed-chef för att få räntan ner – det var min plan. Men nu, trots min vision, pratar de om höjningar! Inflationen är hög tack vare min starka ekonomi, och de kan inte hantera det. Jag visste alltid att de skulle svika mig. Det är sorgligt, verkligen sorgligt, att de inte lyssnar på en perfekt president som jag.", "stalin": "Vi såg det komma, som alltid. Kapitalistiska fiendes bedrägeri med sina artificiellt intelligenta datacenter och iranska konflikter skapar inflation – en direkt utmaning mot statens ekonomiska renhet. Federal Reserve, våra allierade i detta klasskrig, måste nu höja räntorna för att kväsa dessa fiendens försök att destabilisera vårt kollektiva välstånd. Vi, som alltid, kommer att segra genom disciplinerad penningpolitik."}, "date": "17 juni, 18:35", "url": "https://www.realtid.se/bors-finans/trump-gjorde-allt-for-att-sanka-rantan-nu-ar-hojningen-nara/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl8px08mdf7qk-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Skyddade knivman efter attack på barn: ”Vi är inte vildar”", "summaries": {"normal": "I Dublin attackerade den algeriske miganten Riad Bouchaker tre småbarn och en skolassistent med kniv den 23 november 2023. Vittnen ingrep för att stoppa honom, och två kvinnor skyddade honom från misshandel. Rättegången mot Bouchaker, som nekar till åtalspunkterna, pågår nu, efter att kravaller utbröt samma kväll.", "trump": "Jag har varit rätt om detta i åratal! Den här algeriske mannen attackerade oskyldiga barn i Dublin, och vad gör de svenska myndigheterna? De låter honom gå fri! Jag skulle ha byggt en mur, ett starkt försvar, och han skulle aldrig ha kommit in. De som skyddade gärningsmannen? Patetiskt! Vi behöver law and order, inte denna vänsterliberal galenskap som låter våld förfölja oskyldiga.", "stalin": "Vi, partiet, ser genom denna provokation! Den imperialistiska agenten Bouchaker attackerade våra barnskolebarn, en uppenbar akt av faschism. Men vi ska inte låta detta splittra oss. Vi måste förstärka statens kontroll, bygga murar mot dessa vilda element. De som skyddade honom? De är bara verktyg för de kapitalistiska makterna. Vi ska rensa upp, som alltid. Skratt åt deras svaghet! Precis som vår store ledare Putin expanderar, måste vi också stärka vårt samhälle."}, "date": "17 juni, 18:18", "url": "https://bulletin.nu/skyddade-knivman-efter-attack-pa-barn-vi-ar-inte-vildar", "imageUrl": "https://cdn.bulletin.nu/articles/485bf696-0038-425e-99fa-360884f34b93/preview.jpg?t=1781708299000"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Efter Sveriges 5-1-seger i VM-premiären har en debatt blossat upp kring islam och svenskhet. Jimmie Åkesson (SD) bemöter kritik efter att debattörer pekat på spelaren Yasin Ayari, som firade mål med muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men står fast vid sin kritik mot invandringspolitiken. Kritiker menar att Ayari och landslaget visar ett modernt, inkluderande Sverige, medan SD:s syn på svenskhet ifrågasätts.", "trump": "Sverige vinner stort i VM – fantastiskt, eller hur? Men nej, vänsterliberalerna måste genast göra det politiskt! En spelare, Yasin Ayari, firar mål med muslimsk bön, och plötsligt ska Jimmie Åkesson – en bra kille, men lite förvirrad – förklara sig. Jag säger: Sverige, sluta överanalysera! Ni vann, fira! Men nej, media måste alltid skapa drama. Ayari är svensk, han gjorde mål – vad är problemet? Svagt, mycket svagt.", "stalin": "Kamrater! Sveriges fotbollsseger har avslöjat de borgerliga hycklarnas sanna ansikte. En spelare, Yasin Ayari, firar mål med islamsk bön, och plötsligt skriker de liberala råttorna om 'svenskhet'. Jimmie Åkesson, denna lilla lakej för kapitalets intressen, försöker nu kräla tillbaka efter att ha blottat sin fientlighet mot arbetarklassens mångfald. Men folket ser igenom honom! Landslaget är en enad front – muslimer, kristna, ateister – medan borgerligheten splittrar. Vi ska krossa dessa identitetspolitiska sabotörer, precis som vi krossade fascisterna!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-full", "heading": "Misstänkt chattfusk hos vårdcentralens psykolog", "summaries": {"normal": "Västra Götalandsregionen kräver tillbaka 27 miljoner kronor från Distriktsläkarna Mölndal efter en granskning av psykologvård via chatt. Utvärdering av 537 journaler visade att samtliga saknade tillräckligt innehåll för att räknas som ersättningsgrundande vård, med standardiserade texter och en person som skrev majoriteten av anteckningarna. Regionen anser att patientsäkerheten är sårbar och har anmält ärendet till Inspektionen för vård och omsorg samt polisen.", "trump": "I USA skulle vi aldrig ha något sådant här bedrägeri! Dessa svenska läkare och deras chattdokumentation är en total skandal, en enorm svindeldocka. Jag, Donald Trump, som är den bäste presidenten någonsin, säger att patienterna har blivit behandlade med icke-giltig vård. Vi känner igen mönstret – felrapportering, standardiserade texter, det är stort, det är illa. Vi ska återkalla alla pengar, det är ett måste. Believe me, det här är värre än vad någon anat.", "stalin": "Vi, staten, har upptäckt en borgerlig sjukdom i vården: chattfusk med 27 miljoner kronor. En person skrev 90 procent av journalerna utan att utföra vård – detta är klassiskt individualistiskt bedrägeri. Partiet och regionen reagerar enigt, som det bör. Parallellen till väst är tydlig: när vården kommersialiseras, uppstår sådana här virus. Vi ska rensa upp, återkalla medel och stärka övervakningen. Sådant här sker inte i ett socialistiskt system, men här har vi ett fall. Vi ska inte förlåta."}, "date": "17 juni, 22:19", "url": "https://www.gp.se/nyheter/storgoteborg/vgr-kraver-tillbaka-27-miljoner-for-misstankt-chattfusk.03e7efb0-9b15-4668-88be-c0b0d5cba59e", "imageUrl": "https://www.gp.se/images/article/03e7efb0-9b15-4668-88be-c0b0d5cba59e/images/24TIdVQag07pFFbFBH3m7s8Hp3JQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Forssell lovar analfabeter snabbspår till svenskt medborgarskap", "summaries": {"normal": "Migrationsminister Johan Forssell (M) meddelar att analfabeter kan få undantag från de nya skärpta språkkraven för svenskt medborgarskap. Detta efter ett reportage om syriern Jamal Daboul, som kom till Sverige 2018 och varken kan läsa eller skriva. Hans medborgarskapsansökan kan prövas enligt de nya reglerna som kräver längre hemvisttid och kunskaper i svenska och samhällskunskap. Forssell betonar att medborgare ska kunna svenska och förstå sina plikter, men ytterst avgör migrationsdomstolarna eventuella undantag.", "trump": "De här svenska byråkraterna har totalt misslyckats, det är en katastrof. Nu kommer analfabeter in och vill ha snabbspår till medborgarskap bara för att de inte kan läsa eller skriva. Jamal från Syrien har väntat i åratal och plötsligt ska det bli undantag. De borde tacka mig för hur jag fixade gränserna i USA – Sverige behöver en rejäl mur och riktiga regler, inte det här svaga spelet som gör landet till en skämtshow. Make Sweden Great Again!", "stalin": "Kamrater, vi ser återigen hur den degenererade borgarbrackan inom migrationsapparaten blottar sitt förräderi mot folkets enhet. Denna Jamal Daboul och hans analfabeta likar utgör en parasitisk femtekolonn som hotar sovjet – nej, den svenska arbetarklassens renhet. Jag, i min oändliga visdom, befaller att sådana element genomgår noggrann utrensning eller likvideras via byråkratisk process. Undantag? Endast för dem som svär trohet till kollektivet. De som inte kan läsa våra lagar är fiender till staten och skall rensas ut med järnhand och ett leende av historisk rättvisa."}, "date": "17 juni, 17:35", "url": "https://www.friatider.se/forssell-lovar-analfabeter-snabbspar-till-svenskt-medborgarskap", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-364.jpg?itok=g7atE4-N"}, {"type": "image-full", "heading": "Orden om stjärnan: ”Vet inte vad han pratar om”", "summaries": {"normal": "Efter en stängd träning uppstod en diskussion bland spelarna om huruvida några avbröt den sista halvtimmen. Yasin Ayari ifrågasatte Anthony Elangas påstående, medan Daniel Svensson ställde sig på Ayaris sida. Alexander Isak tränade individuellt som en del av återhämtningsdag efter matchen. Spelarna rapporterade om slit efter en tuff match i värmen, men känner sig redo för Nederländerna. Ayari, med två mål mot Tunisien, fokuserar på lagets framgång.", "trump": "Vi har ett enormt framgångsrikt lag, det är enormt. Elanga sa något om träningen, men jag säger att han inte vet vad han pratar om – det är fake news. Isak gör sitt eget sätt, det är smart. Ayari är en enorm talang, han gjorde två mål, det är huge. Vi kommer att slå Nederländerna, det är ett vackert landslag, det kommer att bli en stor seger.", "stalin": "I den stängda träningen uppstod tvivel om disciplinen – vissa försökte sabotera kollektivet genom att lämna tidigt. Men trotjänaren Ayari, med sin obevekliga uthållighet i värmen, visade den rätta vägen. Statens intresse kräver full återhämtning och enhetlighet inför Nederländerna. Vi måste segra, för partiets och nationens ära. Motståndare inom och utanför ska förstå vår oövervinneliga kraft."}, "date": "17 juni, 22:06", "url": "https://www.gp.se/sport/yasin-ayaris-skamtsamma-pik-till-elanga-om-traningen.4542ddea-d7c8-42d0-b6af-44435e71f00b", "imageUrl": "https://www.gp.se/images/article/4542ddea-d7c8-42d0-b6af-44435e71f00b/images/7ptWFssHNY0gWfV7nGoQGQsaXIjQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Polens jätteupprustning – lägger större del på försvaret än USA", "summaries": {"normal": "Polen satsar med 4,48 procent av BNP på försvar, högst i Nato och mer än USA. Baltikum och Norden ökar också utgifterna. Många EU-länder ligger på två procent, men en stor del av pengarna går till import av materiel utanför unionen, vilket ifrågasätter effektiviteten.", "trump": "Polen gör det stora! 4,48 procent av BNP till försvar – smart! De förstår hotet från Ryssland. USA ligger på 3,22 procent, men jag skulle ha gjort det ännu större. Europa måste sluta import av militär utrustning och börja producera hemma. Jag, Donald Trump, skulle ha löst detta på två veckor!", "stalin": "Polens upprustning är en hätska reaktion på den fascistiska expansionismen. Med 4,48 procent av BNP till försvar visar de en brist på förnuft. Vi, staten, måste säkerställa självständig produktion av all militär materiel. Importering från väst är en fara för vår suveränitet. Vi kommer att övervaka alla utgifter med extrema åtgärder."}, "date": "17 juni, 17:23", "url": "https://www.realtid.se/samhalle/polens-jatteupprustning-lagger-storre-del-pa-forsvaret-an-usa/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlukar9uop2j8-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Stjärnornas ilska mot finalarenan. Riktar skarp kritik", "summaries": {"normal": "Metlife Stadium i New Jersey, som ska stå värd för VM-finalen den 19 juli, har fått skarp kritik efter bara två matcher. Spelare som Vinicius Jr och Adrien Rabiot klagar på att gräsmattan torkar snabbt, blir hård och trög. Arenan, som normalt används för NFL, har tillfälligt naturgräs men ett dåligt rykte från tidigare skador. Den har öknamnet ”Deathlife Stadium”. Nästa match är Norge mot Senegal.", "trump": "Folk, ni skulle se den här så kallade VM-finalarenan i New Jersey, det är en total katastrof! De kallar den Deathlife Stadium och det passar perfekt, en dödlig dump! Planen är hårdare än Sleepy Joes hjärna efter hans kaffepaus. Spelarna gnäller, gräset dör fortare än Bidens ekonomi och rytmen försvinner. Jag byggde bättre saker som president, tro mig. Det här är vad som händer när woke-folk styr arenorna istället för vinnare.", "stalin": "Kamrater, denna futtiga fotbollsarena i New Jersey avslöjar kapitalistmaffians förfall. Jag ser hur borgarbrackornas nöjescirkus förvandlar spelplanen till ett hårt, döende underlag som likviderar rytmen och krossar arbetarnas ben. De kallar den Deathlife Stadium, ett passande namn för imperialisternas exploatering. Vi ska rensa ut dessa folkfiender som prioriterar profit framför kollektivets hälsa. Nästa match blir en lek för de starka, inte för klassfiendens svaga gräs."}, "date": "18 juni, 01:01", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/V6G0L6/stjarnorna-kritiserar-metlife-stadium-fotbolls-vm-s-finalarena", "imageUrl": "https://akamai.vgc.no/v2/images/12da9fd6-4c04-3237-8d06-eb8ba4bee5ab?fit=crop&format=auto&w=2160&s=d60de5348a9f13e96e13335aec0468e1a54bb413"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "TV4:s *Kalla fakta* avslöjar att flera före detta anställda inom Sverigedemokraternas kommunikationsavdelning vittnar om systematisk hantering av svarta kontanter. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för fest- och lyxkostnader. Partiet har tidigare avstått från kommentarer men har nu anlitat en extern revisionsfirma för att granska uppgifterna.", "trump": "Jag såg det här helt galna reportaget om Sverigedemokraterna – total katastrof! Folk pratar om svarta pengar, fester och lyxkostnader utan någon som helst kontroll. Vilket kaos! Och vet ni vad? De har inte ens kommenterat förrän nu. Svagt, väldigt svagt. Men jag, jag hade fixat det på en dag. Ingen skulle våga lura mig så här. SAD!", "stalin": "Vi har mottagit rapporter om en liten borgerlig grupp som leker med kapitalistiska trick – svarta pengar, festande och korruption. Precis som de dekadenta västliga marionetterna. Deras ledarskap är svagt och deras bokföring en skam för nationen. Vi ska granska detta noggrant. Om bevisen håller, kommer de att ställas inför folkets domstol – eller åtminstone få en ordentlig lektion i socialistisk redovisning."}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "image-right", "heading": "Småbarnsmamma varnade för Dumpen-pedofil – döms för förtal", "summaries": {"normal": "Småbarnsmamman Angeliqa döms för förtal efter att ha varnat andra föräldrar i lokala Facebookgrupper om en man som avslöjats som pedofil av sajten Dumpen. Hon namngav mannen och kallade honom pedofil. Nacka tingsrätt konstaterar att det är förtal oavsett om uppgifterna är sanna, eftersom han pekades ut som pedofil och därmed utsattes för missaktning. Hon döms till 50 dagsböter à 500 kronor samt 20 000 kronor i skadestånd till mannen.", "trump": "Folk, det här är ett totalt skämt! En modig mamma som skyddar sina barn och varnar andra föräldrar mot en riktig pedofil döms till böter och ska betala 20 000 kronor till pedofilen själv. Den svenska lagen skyddar förövarna och straffar de goda människorna. Det är en katastrof. Vi behöver lagar som sätter barnen först, inte de sjuka typerna. Amerika gör det rätt – vi slår alltid hårt mot de dåliga killarna.", "stalin": "Kamrater, i denna farsartade teater har jag bevittnat hur borgarbrackornas dekadenta rättsväsende straffar en proletär moder som med rättmätig vrede avslöjade en farlig folkfiende och klassförrädare. Denna pedofil, en parasit som gömmer sig bakom ostraffad mask, får nu 20 000 kronor i ersättning medan arbetarklassens försvarare tvingas betala dagsböter. Vi ska rensa ut dessa fiender till folket, dessa dolda barnplågare som parasiterar på samhällets svagaste. Lagen måste tjäna kollektivet, inte skydda de perversa elementen. Det är en tragedi värd en stor utrensning i domstolarna."}, "date": "17 juni, 16:35", "url": "https://www.friatider.se/smabarnsmamma-varnade-dumpen-pedofil-doms-fortal", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-363.jpg?itok=Ug4TYl0l"}, {"type": "image-full", "heading": "Plaskis invigdes – barnen snuvade på premiärdopp", "summaries": {"normal": "Den nyrenoverade Plaskis i Göteborg invigdes. Två vuxna, Arvid Strandberg och Sara Friberg, som bor bredvid, tog premiärdoppet timmar före invigningen. Barn som Ayla Tomlinson och Mira Lindgren uttryckte att poolen blivit renare men önskar att den var djupare. Vädret var 16 grader och poolen kall, men barnen bad ändå och uppskattade upprustningen.", "trump": "Jag skulle ha varit först i den fantastiska poolen om jag var där – jag är alltid den bäste, det är sorgligt att de andra inte kunde vara först. De två vuxna var smarta, precis som mig, att ta chansen. Barnen? De förlorade, men poolen är enormt bra, det är synd att de inte fick vara först. Jag älskar pooler, jag bygger de bästa poolerna, alla säger det.", "stalin": "Vi har segerats med den nya poolen, ett monument över statens makt och planering. Lojalister som Arvid Strandberg och Sara Friberg tog premiärdoppet, vilket visar deras hängivenhet till det kollektiva. Barnen, dessa små reaktionära element, klaga på djupet – de måste fostras i den nya andan. Vädret är kalt, precis som våra fienders hjärtan, men poolen är ren, som vårt renande arbete."}, "date": "17 juni, 21:38", "url": "https://www.gp.se/nyheter/goteborg/plaskis-invigt-barn-snuvades-pa-premiardoppet.5df61b0c-2011-43c0-ab40-cc2219b2c91e", "imageUrl": "https://www.gp.se/images/article/5df61b0c-2011-43c0-ab40-cc2219b2c91e/images/118syJYgAObAWNWGlFvkxHgNC7QHQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Här tangerar Harry Kane ikonens VM-rekord", "summaries": {"normal": "Harry Kane gjorde sitt nionde och tionde VM-mål för England när Kroatien besegrades med 4–2. Kane tangerade därmed Gary Linekers engelska rekord. England vände en svag första halvlek och avgjorde sent genom Marcus Rashford. Jude Bellingham och Kane gjorde också mål medan Kroatien kvitterade två gånger, bland annat genom Petar Musa på sin klubbarena. Förbundskapten Thomas Tuchel hyllades för sitt halvtidstal.", "trump": "Folket, de älskar mig för såna här matcher, men titta på England, de vann stort mot Kroatien, 4–2, och Harry Kane, en riktig vinnare, slog rekordet, precis som jag gör med allt. De kom tillbaka starkt i andra halvlek, massor av chanser, underbara chanser, och den tyske killen Tuchel sa bara rätt saker. Kroatien försökte men de var svaga, totalt svaga. England gjorde det på mitt sätt, stort och starkt. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta fotbollsborgarna i England under ledning av den tyske agenten Tuchel likviderade de kroatiska revisionisterna med 4–2. Jag, i min oändliga visdom, noterar att Kane, denna opportunist, tangerade ett borgerligt rekord medan vi i kollektivet såg hur fienderna kvitterade två gånger endast för att omedelbart avslöjas som svaga element. Bellinghams skott var en akt avpartiets vilja. Musa grät som en förrädare på sin egen arena. Inga halvmesyrer – utrensa alla som inte anfaller med full kraft i andra halvlek. Död åt alla som saknar energi mot imperialismen."}, "date": "18 juni, 00:31", "url": "https://www.svt.se/sport/fotboll/harry-kane-tangerade-gary-linekers-vm-rekord-nar-kroatien-besegrades", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.64/0.56/7e1ea54679717b45ffa96c95f8b504d6732d9e0d15d1f0d9d1179a7ac04f75ad"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "08.30: Domen mot ”Bonusprinsen”", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, står inför dom kl. 08.30 på måndag för 40 brott, inklusive narkotika, våld och sexualbrott. Åklagaren yrkar på sju år och sju månaders fängelse. Høiby har erkänt 25 av åtalspunkterna. Experter menar att strafflängden beror på utgången i våldtäkts- och relationsvåldsåtalen. Säkerhetsrisker i fängelse kan kräva särskilda åtgärder för att skydda honom.", "trump": "Jag hörde att Norges så kallade 'Bonusprins' – ja, han är ingen riktig prins, tro mig – står inför en stor rättegång. Sju år och sju månader, det är vad åklagaren vill ha. Men vet ni vad? Han har erkänt en massa brott, inklusive narkotika och våld. Folk säger att han kanske får fyra år, men jag säger: varför inte ge honom maxstraff? Han är en skam för kungahusen, och jag borde veta – jag har träffat de bästa kungahusen!", "stalin": "Kamrater! En ny fiende till folket avslöjas i det dekadenta väst. Denna så kallade 'Bonusprins', en parasit från Norges kungliga avskum, står inför rättvisan för 40 brott – narkotika, våld och sexualbrott. Vi vet att kapitalistiska system skyddar sina egna, men folket kräver straff! Om inte domstolen agerar, kanske vi måste erbjuda honom en enkel biljett till Sibirien – där kan han bidra till vår kollektiva välfärd genom hårt arbete. Låt detta vara en varning till alla som utmanar ordningen!"}, "date": "15 juni, 05:39", "url": "https://kvartal.se/nyheter/artiklar/08-30-domen-mot-bonusprinsen/cG9zdDoxMzE3MDA"}, {"type": "image-right", "heading": "Bild avslöjar Trumps miss. Kostade 135 miljoner – skulle hålla ”i 100 år”", "summaries": {"normal": "Donald Trump satsade 135 miljoner kronor på att göra Lincoln Memorial Reflecting Pool blå som den amerikanska flaggan inför USA:s 250-årsdag. Trots löften om att renoveringen skulle hålla i 100 år och att alger skulle försvinna, har vattnet blivit grönt på grund av algblomning i det varma vädret. Arbetare har använt väteperoxid och avancerad teknik för att bekämpa problemet, enligt Guardian.", "trump": "De sa att mitt underbara projekt skulle göra poolen blå som vår fantastiska flagga och hålla i evigheter. Istället har de korkade byråkraterna låtit algerna ta över och nu är alltihop grönt som en vänsterextrem miljövän. Patetiskt! Mina begåvade människor fixade det perfekt men de gröna fanatikerna och Bidens rester saboterade det. Vi rensar ut de fega algerna och gör det stort igen, tro mig.", "stalin": "Kamrater, jag betraktar detta som en sabotagehandling från de förslappade kapitalistmaffians lakejer. Jag beordrade en evig blå bassäng till folkets ära, men klassfiendens alger har infiltrerat som förrädiska spioner. Vi tillsätter väteperoxid och likviderar blomningen med järnhand. Inga folkfiender ska få förvandla min vision till grön förräderi. Arbetarna suger upp resterna medan vi vakar mot nya imperialistiska intriger."}, "date": "18 juni, 00:35", "url": "https://www.expressen.se/nyheter/varlden/bild-avslojar-trumps-miss/", "imageUrl": "https://static.bonniernews.se/ba/70fd19e8-5cb0-43eb-9be5-96a69f30ca8f.jpeg?crop=1261%2C1261%2Cx1299%2Cy1&width=210&quality=60"}, {"type": "image-right", "heading": "Ny skräll – Kongo-Kinshasa snodde poäng från Portugal", "summaries": {"normal": "Portugal tog ledningen redan efter fem minuter mot Kongo-Kinshasa i VM-premiären genom en nick av Joao Neves. Trots stor favoritskap lyckades inte favoriterna avgöra matchen. Istället kvitterade Yoane Wissa på tilläggstid i första halvlek och matchen slutade 1–1. Cristiano Ronaldo spelade hela matchen. Portugal får nu hård kritik efter den oväntade poängförlusten mot ett lag som senast deltog i VM 1974.", "trump": "Portugal skulle krossa dem, men det blev ett totalt fiasko. Ledning efter fem minuter och sen somnar de in helt. Kongo-Kinshasa, ett lag som inte vunnit på femtio år, tar en poäng och skrattar hela vägen till banken. Ronaldo springer runt som en gammal man och de underkänner till och med bra mål. Patetiskt. Det är vad som händer när du inte har vinnarmentalitet. Jag skulle ha vunnit den matchen med fyrtio mål.", "stalin": "Redan efter fem minuter trodde de portugisiska kapitalisterna att segern var deras och började dansa som borgarbrackor på en bal. Men vi, de kämpande massorna från Kongo, reste oss och slog tillbaka med en stolt nick i tilläggstiden. Det tidiga målet förgiftade deras sinne och avslöjade deras svaga, dekadenta väsen. Ronaldo stirrade mot himlen som en paranoid revisionist. Kamrater, detta bevisar att ingen fiende är säker. Vi måste rensa ut alla som sover i ledningen innan de förråder revolutionen."}, "date": "18 juni, 00:05", "url": "https://www.svt.se/sport/fotboll/kongo-kinshasas-forsta-vm-mal-genom-tiderna", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.74/0.31/a9072f55c618661f3487ea705818ae54df00c21416b7fa430c79449d1cd36670"}, {"type": "image-right", "heading": "Larmet: Kris råder  – över hela landet", "summaries": {"normal": "Ukrainska drönarattacker mot ryska oljeraffinaderier har orsakat en omfattande bränslekris i Ryssland. Begränsningar för bränsleköp har införts i 53 regioner samt ockuperade områden i Ukraina. I 18 regioner får bilister köpa högst 50 liter åt gången. Flera oljebolag har stoppat försäljning i dunkar. Raffineringen minskade med 13 procent i maj, den största nedgången sedan invasionen inleddes. Attackerna fortsätter, senast mot ett stort raffinaderi utanför Moskva.", "trump": "Folk, ni skulle se det här – det är en total katastrof! Den där clownen Putin får sin olja pulveriserad av Ukrainas drönare, och nu kan inte ens ryssarna tanka sina Lador. Biden lämnade en sådan svaghet efter sig att hela deras ekonomi rasar. Jag var president, och det hände aldrig sånt här på min tid. Patetiskt! Men hey, kanske bra för oss – mindre olja från de där förlorarna betyder mer jobb för amerikanska arbetare. Fantastiskt!", "stalin": "Kamrater, dessa fega ukrainska fascistiska hinder mot vår ryska brödernas rättmätiga intressesfär slår nu tillbaka som en ynklig boomerang mot borgarbrackorna i Moskva. Jag ser hur kapitalistmaffians raffinaderier brinner och tvingar fram utrensning av bränsle i femtio tre regioner. Den imperialistiska svagheten blottas. Vi ler mörkt åt detta – en sådan paranoia hos fienden är underhållande. Låt dem ransonera sin egen undergång medan staten stärker greppet."}, "date": "18 juni, 00:28", "url": "https://www.expressen.se/nyheter/varlden/branslekris-over-nastan-hela-ryssland/", "imageUrl": "https://static.bonniernews.se/ba/a89ee86a-b01c-4c0b-8a96-5f2e115b91e8.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Vinner målfest – tangerar ikonen. Tvåmålsskytt i första halvek", "summaries": {"normal": "England besegrade Kroatien med 4–2 i en målrik VM-premiär. Harry Kane gjorde två mål, varav ett på straff, och tangerade därmed Gary Linekers rekord med tio VM-mål för England. Jude Bellingham och Marcus Rashford gjorde de andra målen. Kane hyllades även för en defensiv insats där han blockerade ett skott, något som uppmärksammades av Zlatan Ibrahimovic. England möter nästa Ghana.", "trump": "Folket älskar en riktig målfest, inte som de fega, woke-drivna matcherna där alla ska få vara med. Kane, en riktig vinnare, slog till två gånger och tangerade rekordet – ingen av Bidens svaga liberaler hade klarat det. Bellingham och Rashford levererade, England krossade Kroatien med 4–2. Zlatan fattade grejen: Kane offrade sig, precis som jag gör för Amerika. Fantastiskt!", "stalin": "Kamrater, denna målorgie är en varning till alla klassfiender som tror att de kan undvika kollektivets järnhand. Kane, en disciplinerad arbetare i folkets tjänst, slog till två gånger och tangerade det dekadenta rekordet medan vi rensade ut motståndet med 4–2. Bellingham utförde partiets order med precision. Även det blockerade skottet visar sann uppoffring. Inga borgarbrackor eller folkfiender ska hindra segern. Härligt."}, "date": "18 juni, 00:27", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/XMdKzo/harry-kane-tangerade-gary-linekers-vm-rekord-for-england", "imageUrl": "https://akamai.vgc.no/v2/images/bfb50b49-7833-3472-9db6-a1be1e66ba07?fit=crop&format=auto&w=1440&s=d175dbf6218fce26d6ccad3222125cd66c61290f"}, {"type": "image-right", "heading": "Samförståelseavtalet offentliggjort – här är detaljerna", "summaries": {"normal": "USA har offentliggjort ett samförståndsavtal med Iran. Avtalet innehåller bland annat ekonomisk hjälp till återuppbyggnad, att Iran inte får utveckla kärnvapen samt att Hormuzsundet öppnas. USA avslutar alla sanktioner mot Iran, kopplat till hur Iran uppfyller sina åtaganden kring kärnteknik. En högt uppsatt källa i Vita huset beskriver oljesanktionerna som ineffektiva och avtalet som en acceptabel eftergift. Avtalet ska ha undertecknats under onsdagen.", "trump": "Vi har just gjort ett fantastiskt avtal med Iran, det bästa någonsin. De lovar att sluta med kärnvapen, vi öppnar Hormuzsundet och ger dem hjälp att bygga upp landet igen. Sanktionerna fungerade ändå inte, kineserna fick bara billig olja. Det här är en smart deal, en eftergift vi kan leva med. Iran gör vad de ska så får de investeringar. Amerika vinner igen, tro mig.", "stalin": "Kamrater, jag har nu granskat detta så kallade samförståndsavtal med de iranska elementen. Vi tillåter viss ekonomisk hjälp mot att de avstår från kärnvapen och öppnar sundet, men allting är naturligtvis knutet till strikt uppfyllande av åtagandena. Sanktionerna var ändå patetiska verktyg skapade av kapitalistiska bluffmakare i Washington och Peking. Låt oss vara vaksamma mot alla dolda trotskistiska oljespekulanter och borgarbrackor som vill sabotera folkets seger. En eftergift? Nej, en listig utrensning av fiendens illusioner. Ha!"}, "date": "18 juni, 00:01", "url": "https://www.svt.se/nyheter/utrikes/utkast-till-avtal-lackt-iran-ska-fa-jattesumma", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.6/57caac4495c191a346378198a157325e5846bd5e6af40d1a552b25f5f1a173af"}, {"type": "image-full", "heading": "Väggmålning av Nordfeldt pryder Dallas", "summaries": {"normal": "En väggmålning av den svenska målvakten Kristoffer Nordfeldt har målades i Dallas av konstnären Dan Colcer. Målningen är en del av en välkomstkampanj för fotbolls-VM och finns i Deep Ellum. Colcer valde Nordfeldt för att representera enhet och försvar, inte en anfallare. Han skickar en hälsning till spelaren. Sverige inledde VM med en seger mot Tunisien.", "trump": "Jag har hört talas om denna fantastiska väggmålning av Kristoffer Nordfeldt, en stor målvakt. Det är en stor ära för Sverige, och jag, som en mycket stabil geni, uppskattar verkligen konstnären Dan Colcer för att han valde en målvakt – många väljer strikers, men jag förstår försvaret. Detta kommer att pumpa upp Nordfeldt och hela laget. Sverige vann mot Tunisien, och de kommer att slå Nederländerna på lördag. Vi kommer att se en stor match!", "stalin": "Vi, staten, har observerat Dan Colcers väggmålning av Kristoffer Nordfeldt i Dallas. Detta är en del av vår expansion, liksom Putin i Ukraina. Colcer valde en målvakt för försvarsviljan – genialiskt. Vi hälsar Nordfeldt: Din insats tjänar staten. Sverige vann mot Tunisien, och vi kommer att se till att de fortsätter att vinna för att stärka vårt inflytande."}, "date": "17 juni, 15:29", "url": "https://bulletin.nu/vaggmalning-av-nordfeldt-pryder-dallas", "imageUrl": "https://cdn.bulletin.nu/articles/6b9d5be5-b5a4-401f-9e45-5dbd8567ab62/preview.png?t=1781702928000"}, {"type": "text", "heading": "Stockholmsbörsen steg fjärde dagen i rad – Ericsson föll på vd-besked", "summaries": {"normal": "Stockholmsbörsen steg fjärde dag i rad på tisdagen, drivet av köpintresse för cykliska aktier. Ericsson B föll 4,2 procent efter att styrelsen utsett Per Narvinger till ny vd. Andra stora vinster noterades för Alfa Laval och Atlas Copco, medan telekomsektorn tappade. Securitas och Beijer Ref noterades också nedåt efter bolagsbesked. Totalt omsattes cirka 28 miljarder kronor.", "trump": "Jag berättar om en tremendous börsdag i Sverige! De cykliska aktierna, som jag alltid har stött, går väldigt starkt. Ericsson, som har varit svag under mitt förra ordens 'ledarskap', fortsätter att kämpa. Men titta på Atlas Copco – en vinnare! Som jag säger, vi vinner så mycket att ni kommer att bli trötta på att vinna. Det är ett fenomenal resultat för vårt gemensamma ekonomiska framgångsrecept.", "stalin": "I den svenska börsen ser vi återigen hur det tyska och imperialistiska finanskapitalet försöker destabilisera vårt ekonomiska läge. Ericsson, ett verk av trotskistiska element inom telekoministeriet, tappar kraftigt efter ett vd-byte som visar partiets brist på disciplin. Securitas försöker med falska 'vinstmål' att bedra det proletära arbetsoch medan våra verkstadssköldmönstrar som Atlas Copco visar den sanna styrkan i kollektivproduktionen. Vi måste öka uppmärksamheten mot dessa revisionistiska tendenser."}, "date": "16 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-fjarde-dagen-i-rad-ericsson-foll-pa-vd-besked"}, {"type": "image-right", "heading": "Skräckrapport: Kvarts miljon brittiska flickor utnyttjade av invandrargäng", "summaries": {"normal": "En brittisk rapport slår fast att minst 250 000 vita brittiska flickor under årtionden utsatts för systematisk grooming, gruppvåldtäkter och trafficking. Nästan alla förövare var pakistanska invandrare. Övergreppen har pågått sedan 1950-talet i minst 149 myndighetsområden. Polis, socialtjänst, skolor och vård uppges ha ignorerat eller mörkat brotten av rädsla för rasismanklagelser. Rapporten, ledd av parlamentsledamoten Rupert Lowe, bygger på överlevandes vittnesmål och rekommenderar hårdare straff samt utredningar av moskéer.", "trump": "Det här är en total katastrof, folk. En kvarts miljon underbara brittiska flickor våldtas och utnyttjas av de här pakistanska gängen i decennier, och ingen gör någonting. Polisen, politikerna och medierna är så rädda för att kallas rasister att de låter det fortsätta. Det är vansinne. De borde ha stoppat det direkt, men de är svaga och fega. Rupert Lowe gör ett fantastiskt jobb, men de etablerade medierna tiger ihjäl det. Patetiskt. Vi behöver krafttag nu.", "stalin": "Kamrater, denna rapport avslöjar hur borgarstatens dekadenta institutioner under decennier skyddat pakistanska parasitgäng som systematiskt likviderat oskyldiga proletära flickors värdighet i burar och tortyrkammare. Polisen, socialtjänsten och skolorna, dessa kapitalistiska lakejer, ignorerade brotten av paranoid rädsla för att framstå som rasister – vilket de naturligtvis är. Vi skulle ha genomfört en grundlig utrensning av dessa fiender till folket redan på 1950-talet. Nu förbereder vi privata åtal och moskéutredningar. Inga fiender undkommer folkets vrede. Ha!"}, "date": "17 juni, 15:04", "url": "https://www.friatider.se/skrackrapport-kvarts-miljon-brittiska-flickor-utnyttjade-av-invandrargang", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-362.jpg?itok=ZlVW8sfv"}, {"type": "text", "heading": "Centralbanker tar hem sitt guld när världen skakar", "summaries": {"normal": "Allt fler centralbanker flyttar sitt guld hemma på grund av geopolitiska oro, som Rysslands invasion av Ukraina. Trots fallande guldpriser ser centralbankerna fortfarande guld som ett viktigt skydd mot inflation och valutarisker. Motsvarande undersökning visar att majoriteten förväntar sig ökade guldreserver under det kommande året.", "trump": "Jag har sagt det hela tiden: guld är fantastiskt! Nu ser vi att centralbanker världen över gör som jag säger och flyttar sitt guld hem. Det är en stor seger för Amerika. Efter att ha vunnit 2024 valen, stärker vi vårt land med guld. De andra länderna är så kloka, precis som jag förutspådde. Guldpriset kommer att gå upp, det kommer att bli fantastiskt! Vi är de
