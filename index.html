tryck, försöker sabotera vår midsommar. Jag befaller att värmevågen från väster skall likvideras om den sviker oss. Högtrycket över den skandinaviska halvön är en fiende till folket om det inte levererar sol. Vi ska rensa ut alla regnmoln som förräder arbetarklassen med sina 15-gradiga konspirationer. Det är en kamp mot vädrets kontrarevolutionärer."}, "date": "5 juni, 11:59", "url": "https://nyheter24.se/nyheter/inrikes/1489038-forsta-vaderprognos-for-midsommar-25-grader-och-sol", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2760181e04b004a30200000000b004a302/2026/06/05/2368868/prgnos-midsommar.png"}, {"type": "text", "heading": "Wall Street sänkte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en nedgång på fredagen, OMXS30-indexet sjönk 0,60 procent till 3 116,40. Sectra rapporterade starka resultat men tappade 1,2 procent, medan Xspray Pharma rasade 28 procent efter negativt FDA-beslut. Bland ledande aktier steg Astra Zeneca och SEB, medan Boliden och Ericsson backade. Omsättningen uppgick till cirka 22,1 miljarder kronor.", "trump": "Jag ser att Stockholmsbörsen, en total katastrof under dessa globalistiska ledare, tappade 0,60 procent. Sectra gjorde bra men backade - typiskt för socialister som inte uppskattar framgång. Xspray Pharma? Ett fiasko! FDA hatar USA:s geni. Min börs vore högre, folket vore rikare. Dessa europeiska banker är svaga, men jag skulle fixa det på två minuter. America first, alltid!", "stalin": "Den svenska börsen visade idag svaghet, en spegelbild av klassfiendens sabotage. Sectra, trots ökad omsättning, tappade - bevis på internaler motpartier. Xspray Pharma:s ras är en seger för vårt parti, deras 'FDA'-brev är bara propaganda från det imperialistiska väst. Vi måste skydda våra ekonomiska intressen, precis som våra allierade i Moskva utvidgar sin inflytelsesfär. Hotet från de kapitalistiska spekulanterna är verkligt, men partiet kommer att segra."}, "date": "5 juni, 17:49", "url": "https://www.affarsvarlden.se/artikel/wall-street-sankte-stockholmsborsen"}, {"type": "image-full", "heading": "På väntelista för transplantation: ”Utvecklingen är allvarlig”", "summaries": {"normal": "Kronprinsessan Mette-Marit har satts upp på väntelista för lungtransplantation på grund av allvarlig lungfibros. Hon har blivit allt sjukare och syntes med syrgasmask under nationaldagsfirandet. Hennes tillstånd beskrivs som mycket allvarligt av läkare. På grund av sjukdomen skjuter kronprinsparet upp firanden och resor. Deras dotter avbryter studierna i Australien medan sonen Marius Borg Høiby, som är misstänkt för brott, begär att få lämna häktet.", "trump": "Folk, ni skulle inte tro det, men den här norska prinsessan med lungproblem är nu på väntelista för nya lungor – det är en katastrof, en total katastrof. Hon ser ut som en svag socialistisk marionett som inte orkar stå upp under sin egen nationaldag. Och sonen, den där förloraren som åtalas för brott, vill ut ur fängelset för mammas skull. Typiskt elitsnobberi och identitetspolitik – de borde ha fixat det tidigare istället för att festa med HBTQ-flaggor och kvoteringar. Patetiskt!", "stalin": "Kamrater, denna dekadenta monarkistiska figur har nu officiellt erkänt att hennes borgerliga lungor svikit henne fullständigt. Vi ser med mörk tillfredsställelse hur klassfiendens överklass-slynglar tvingas köa som vanliga arbetare för att byta ut sina förbrukade organ. Hennes avkomma, den brottslige sonen, försöker nu med patetiska ursäkter undkomma folkets rättvisa. En sådan svaghet i överklassens ledning är både underhållande och en varning till alla folkförtryckartroll som tror sig stå över kollektivets lagar."}, "date": "5 juni, 11:20", "url": "https://www.tv4.se/artikel/TkWOqej1nLIus2Ghb8dn7/mette-marit-pa-vaentelista-foer-lungtransplantation", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6KSEwGIzV1YUCgFo7x4iOr%2F31dbea304a5a9d827a51c670984632f1%2Fmette-marit-sjuk.png&width=1024"}, {"type": "image-right", "heading": "Intrum: \"Förstår att rabatten kan uppfattas som stor\"", "summaries": {"normal": "Intrum genomför en företrädesemission om 6 miljarder och en riktad emission om 1,5 miljarder kronor, vilket innebär en stor rabatt på aktierna. Emissionsguiden kritiserar bolaget för en rörig process, felaktig finansiering och bristfällig information, samtidigt som Intrums VD försvarar strukturen och prissättningen som nödvändig för att tillföra långsiktiga ägare.", "trump": "Jag har sett många dåliga affärer, men Intrums emission är en katastrof! En enorm rabatt på 38,9% – det är en skam! Styrelsen vet inte vad de håller på med. Vi skulle ha gjort det perfekt, stort och vackert. De misslyckas totalt, det är beklämmande.", "stalin": "Denna kapitalanskaffning avslöjar djup rot i styrelsen – en fegdom som sviker statens intresse. Vi måste rensa ut de opportunister som sälja vårt arv till utländska spekulanter. Parallellen till Putins Ryssland är tydlig: endast en stark hand kan skydda vårt folkskap. Vi skall inte tveka att eliminera dessa svekfulla element."}, "date": "5 juni, 17:12", "url": "https://www.affarsvarlden.se/artikel/intrum-forstar-att-rabatten-kan-uppfattas-som-stor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Intrum-VD-Johan-Akerblom-400x267.jpg"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-right", "heading": "Vad gjorde Rubbestad i Kambodja?", "summaries": {"normal": "SD-ledamoten Michael Rubbestad lämnade sina politiska uppdrag efter misstankar om barnpornografibrott. Han hade fått godkännd resa till Kambodja på riksdagens bekostnad för att möta svenska och lokala aktörer och diskutera demokrati och mänskliga rättigheter. Bulletin har försökt få svar på om planerade möten, som med Sveriges konsulat, genomfördes, men fått tystnad från inblandade och utan åtkomst till dokumentation från Riksdagsförvaltningen.", "trump": "Jag, Donald Trump, har aldrig sett en så stor skandal! Den här politikern, Rubbestad, försökte stjäla pengar från det svenska folket för att åka till Kambodja och prata om mänskliga rättigheter. Fake news försöker få svar, men de kommer aldrig att få det. Jag skulle ha stängt ner hela den där resan på två sekunder. Vi behöver starka ledare, inte sådana som denne.", "stalin": "Vi har upptäckt en feg oppositionell aktivitet i Kambodja. Den här individen, Rubbestad, planerade att besöka vårt konsulat under förevändning av att diskutera mänskliga rättigheter, men det var en täckmantel för sabotage. Vi måste skydda statens intressen, precis som Putin gör i Ryssland. Fienden är överallt, och vi måste vara vaksamma. Hans svek kommer att bestraffas."}, "date": "5 juni, 06:30", "url": "https://bulletin.nu/vad-gjorde-rubbestad-i-kambodja", "imageUrl": "https://cdn.bulletin.nu/articles/3095b186-3bbd-4df4-9df9-79804bc884e8/preview.jpg?t=1780603002000"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalitet och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-right", "heading": "Politikernas kupp: Ska integrera IDF med USA:s försvarsmakt", "summaries": {"normal": "Amerikanska kongressen planerar enligt artikeln att fördjupa det militära samarbetet med Israel genom en ny paragraf i 2027 års försvarslag. Förslaget öppnar för gemensam forskning, vapentillverkning, AI- och kvantsamarbete samt datafusion mellan ländernas försvarssektorer. Kritiker varnar för att det ger Israel en unik integration med USA:s militärindustri och minskar transparensen kring stödet. Samtidigt avfärdas israeliska uttalanden om att fasa ut biståndet som en omorganisering snarare än en minskning. Motståndet växer bland väljarna medan politiker från båda partier fortsätter att driva en Israelvänlig linje.", "trump": "De här politikerna i kongressen tror att de är så smarta. Nu försöker de smyga in ett nytt avtal som knyter ihop vår militär med Israel på ett sätt som ingen sett tidigare. Gemensam AI, kvantteknik, datafusion – allt ska blandas ihop! De kallar det samarbete, jag kallar det att ge bort vår teknik och våra hemligheter. Och det där pratet om att fasa ut biståndet? Ren bluff! Israel får fortsätta suga musten ur oss medan mina väljare ropar att det räcker. Det är en katastrof, folk. Vi borde sätta Amerika först på riktigt.", "stalin": "Kamrater och arbetare! Jag ser hur de amerikanska imperialisternas borgarbrackor i kongressen febrilt spinner sina trådar för att ännu tätare sammanväva sina krigsmaskiner med den sionistiska enheten. Denna parasitiska integration av datafusion och kvantteknologi är en lömsk utrensning av varje spår av äkta suveränitet. De påstår sig vilja minska biståndet, men det är blott en listig omorganisering av plundringen, ett nytt dekret som gömmer miljarderna i Pentagons mörka kassakistor. Vilka fiender till folket! Vilka kapitalistiska spioner och revisionistiska lakejer som tror sig kunna lura historien. Jag ler mörkt åt deras paranoia – snart skall deras egna byråkratiska maskiner sluka dem levande."}, "date": "5 juni, 17:33", "url": "https://www.friatider.se/politikernas-kupp-ska-integrera-idf-med-usas-forsvarsmakt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-301_0.jpg?itok=rH4eSR9-"}, {"type": "image-right", "heading": "USA ser vårt bättre jag. Sveriges förmågor guld värda för USA", "summaries": {"normal": "Det nya teknikavtalet Technology Prosperity Deal mellan Sverige och USA markerar en stark fördjupning av de bilaterala relationerna. Avtalet omfattar AI, kvantteknik, 5G/6G, biomedicin, rymd, energi och kärnkraft samt en ny arktisk fiberkabel. USA lyfter fram Sveriges unika förmågor inom telekom, fordonsindustri och avancerad tillverkning. Trots politiska spänningar ses Sverige som en global ledande tech-nation. Artikeln uppmanar svenskar att anamma den positiva amerikanska synen på landets styrkor och skydda dem långsiktigt.", "trump": "Det här avtalet är fantastiskt, det bästa någonsin. Sverige är ett underbart land med otrolig teknik och smarta människor, de älskar oss och vi älskar dem. Vi gör affärer ihop som ingen annan, AI, kärnkraft, rymd – allt är vinnande. De andra europeiska gratisåkarna borde titta och lära. Trots alla lögner och fake news om mig stärker vi banden, det blir enorma jobb och välstånd. Sverige är vinnare, precis som jag visste hela tiden. Fantastiskt!", "stalin": "Kamrater, detta så kallade teknikavtal avslöjar borgarbrackornas desperata försök att klamra sig fast vid den dekadenta amerikanska imperialismen. Jag ser hur de reaktionära elementen inom den svenska statsapparaten försöker dölja folkets sanna styrka bakom lögnaktiga lovord om innovation och privata monopol. Vi ska rensa ut dessa parasitiska tech-kapitalister som smyger sig in som trojanska hästar från Washington. Deras fiberkabel under isen är ett perfekt redskap för fiendens spioner. Låt oss likvidera illusionen om vänskap med klassfienden och i stället bygga en sann socialistisk framtid där arbetarklassen styr varje kvantbit och varje kärnreaktor. Den som tvivlar är en folksjukdom som måste botas med järnhand."}, "date": "4 juni, 09:59", "url": "https://www.di.se/ledare/usa-ser-vart-battre-jag/", "imageUrl": "https://static.bonniernews.se/ba/a13214a1-5e08-45cb-be33-1d4f365a1aec.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Nick Alinia deltar i SVT:s program: ”Flyttar debatten”", "summaries": {"normal": "SVT:s humorprogram *Invandrare för svenskar* (IFS) har rekryterat debattören Nick Alinia som paneldeltagare, vilket väckt kontrovers. Producenten försvarar valet med att public service ska spegla olika politiska åsikter. Poddprofilen Julia Frändfors lämnar programmet i protest. Alinia, som själv är kritisk till public service, menar att hans medverkan flyttar debatten i rätt riktning. Dagens ETC ifrågasätter hans bakgrund, vilket Alinia avfärdar som fabricerat.", "trump": "Titta bara på SVT, Sveriges så kallade 'public service' – ett skämt! De bjuder in en högerdebattör, Nick Alinia, som hatar dem, men han säger 'ja tack' för att han vill 'flytta debatten'. Vilken hyckleri! Och en poddare, Julia Frändfors, hoppar av som en rädd kyckling. SVT försvarar sig med 'olika åsikter', men alla vet att de bara vill provocera. Jag skulle aldrig låta sådana människor nära min TV – jag har bättre smak!", "stalin": "Kamrater! Ännu en gång visar de borgerliga medierna sin förrädiska natur. Denna Nick Alinia, en förvirrad liten man som leker med högerretorik, bjuds in till statens propagandaapparat – SVT – medan en lojal medborgare som Julia Frändfors tvingas fly fältet. Vi vet att dessa 'humorprogram' bara är ett verktyg för att förvirra massorna. Men folket genomskådar deras trick! Snart ska vi rensa ut alla sådana här småborgerliga element – en gång för alla!"}, "date": "3 juni, 18:59", "url": "https://kvartal.se/nyheter/artiklar/nick-alinias-deltar-i-svt-program-poddprofil-lamnar/cG9zdDoxMjUwMDg", "imageUrl": "https://images.kvartal.se/2026/06/19c5f89f-frandfors-alinia.webp"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-full", "heading": "Sverige föll igen: ”Kommer blåsa stormvindar”", "summaries": {"normal": "Sverige förlorade 2–1 mot Danmark och missade direktplats till VM i Brasilien. Pernille Harder avgjorde för Danmark efter ett svagt svenskt försvar. Förbundskapten Gustavsson kritiserar första halvlekens passivitet men ser positivt på trycket i andra halvlek. Sverige måste nu spela playoff för att nå VM, med nästa match mot Italien.", "trump": "JAG har sett många matcher, men Sverige spelade som om de aldrig hade tränat. Danmark var bra, måste ge dem cred, men Sverige var svag, mycket svag. Pernille Harder, en bra spelare, men Sverige kunde inte hantera henne. Jag skulle ha vunnit det där, det är jag säger. Nu måste de spela playoff, det blir tufft, men jag tror på dem? Nej, jag tror inte på dem. De behöver bli bättre, mycket bättre.", "stalin": "Vi, staten, har observerat Sveriges nederlag mot Danmark. Detta är en skandal! Sverige visade svaghet, som en feg fiende. Pernille Harder, en verktyg för Danmarks imperialism. Vi måste stärka vårt försvar, som vi gör mot västliga agressorer. Playoff är en utmaning, men vi kommer att segra, för partiet kräver seger. Vi kommer att analysera, och vi kommer att träna hårdare, för vi är starkast."}, "date": "5 juni, 22:35", "url": "https://www.gp.se/sport/fotboll/sverige-foll-igen-mot-danmark-missar-direktplats-till-vm.c8034847-c1f5-44e8-93e2-92ec7d29df1b", "imageUrl": "https://www.gp.se/images/article/c8034847-c1f5-44e8-93e2-92ec7d29df1b/images/3q25r2ZQwAxjq6S9IaJvWY0hDIFg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Rika investerare har en ny favorit – amatöridrott", "summaries": {"normal": "Världens rikaste investerare, särskilt family offices, fortsätter att satsa stort på sport trots teknikens framfart. Under maj genomfördes 51 direktinvesteringar, bland annat 225 miljoner dollar i pickleball-bolaget Pickleball Inc. Techmiljardärer som Michael Dell köper in sig i NFL-lag. Enligt Goldman Sachs har en fjärdedel av familjekontoren redan investerat i sport och relaterade tillgångar, medan lika många överväger det. Intresset sträcker sig även till sportteknik och amatöridrott.", "trump": "Sport är fantastiskt, det bästa, och ni borde se hur de smarta investerarna – inte de förlorarna i Silicon Valley – pumpar in pengar i riktiga sporter istället för den där AI-skräpet. Pickleball får hundratals miljoner, Dell köper in sig i Raiders, underbart. Mina family offices älskar det, det är en vinnande affär som slår inflationen. Till och med amatörerna får kapital nu. Under Biden var allt kaos, nu fixar vi det stort igen. Sport vinner alltid, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den dekadenta borgarklassen och dess family offices desperat söker trygga sin plundrade förmögenhet genom att kasta sig över sportens opiat för massorna. 51 investeringar i maj, 225 miljoner till pickleball – en fånig amerikansk tidsfördriv! De tror sig mota inflationens spöke, men vi vet att klassfiendens exploaterande byfånar bara gömmer sig i arenor och GPS-västar. Snart skall vi rensa ut dessa folkförtryckartroll ur historien med ett hjärtligt skratt."}, "date": "5 juni, 18:56", "url": "https://www.dagensps.se/bors-finans/rika-investerare-har-en-ny-favorit-amatoridrott/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlceihxyrpzcm-normalhires1.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Efter vänsterdrevet: SVT kan stoppa programmet med Alinia", "summaries": {"normal": "SVT riskerar att inte sända programmet \"IFS – Invandrare för svenskar\" efter starka protester från vänsterhåll mot medverkan av högerjournalisten Nick Alinia. Kritiken inleddes med en artikel i Dagens ETC och ledde till att flera medverkande, däribland Julia Frändfors och Bilan Osman, hoppar av i protest. SVT:s Helena Olsson medger att bokningen brast i research och interna rutiner. Beslut om sändning fattas efter granskning.", "trump": "De galna vänsterextremisterna på SVT håller på att kväva sitt eget program bara för att en modig invandringskritiker som Nick Alinia ska medverka. Vilken skam! De springer runt som galningar, hotar och bojkottar allt som inte är hundra procent radikalt vänster. SVT borde skämmas. I mitt Amerika skulle vi inte låta sådana svaga, hatfyllda människor styra public service. Totalt fiasko.", "stalin": "Kamrater, detta är en klassisk sabotagehandling utförd av dekadenta borgarbrackor och deras nyttiga idioter inom den så kallade public service-apparaten. Vi ser hur parasiterna i extremvänstern skriker efter utrensning så snart en sanningsenlig röst vågar ifrågasätta deras invandringsreligion. Julia Frändfors och hennes AFA-bandit till make avslöjar sitt sanna ansikte. Vi ska noga undersöka vilka kontrarevolutionära element som smitit in i redaktionen. Inga fiender undkommer folkets dom. Det blir en grundlig sanering av alla dekadenta element som föredrar småflinande med klassfiender framför partiets linje. Mycket underhållande att se hur de äter upp varandra."}, "date": "5 juni, 16:01", "url": "https://www.friatider.se/efter-vansterdrevet-svt-kan-stoppa-programmet-med-alinia", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-299_0.jpg?itok=Z46T0_on"}, {"type": "image-full", "heading": "Ministrarna vi inte sett – och de vi sett hela tiden", "summaries": {"normal": "En sammanställning visar att ministrarna Jessica Rosencrantz, Romina Pourmokhtari, Nina Larsson, Niklas Wyman och Lotta Edholm är de som producerat minst pressmeddelanden, propositioner och debattartiklar under mandatperioden. De mest aktiva är däremot Gunnar Strömmer, Jakob Forssmed, Andreas Carlson, Camilla Waltersson Grönvall och Elisabeth Svantesson. Statsvetare Jenny Madestam ser det som ett uttryck för regeringens prioritering av lag och ordning samt migrationspolitik. Ebba Busch toppar när det gäller medieexponering.", "trump": "Folk, ni skulle inte tro det, men de här svenska ministrarna Rosencrantz, Pourmokhtari och hela det misslyckade gänget är så osynliga att de kunde smita genom riksdagen utan att någon märker det. Totala nollor! De gör mindre än Sleepy Joe gjorde under sin tid. De bästa, som Strömmer och Svantesson, jobbar hårt medan de andra gömmer sig. Typisk vänsterpolitik med kvotering och identitetsnonsens. Patetiskt, men jag skulle fixa det på en vecka, tro mig.", "stalin": "Kamrater, dessa fem ministärer utgör ett ynkligt exempel på klassfiendens lathet inom statsapparaten. De producerar färre direktiv än en kapitalistmaffias lögnpropaganda och smyger som folkförtryckartroll genom riksdagen utan att lämna spår. Vi ser hur prioriteringarna gynnar lag och ordning mot folkets fiender. Strömmer utmärker sig som en duglig arbetare för kollektivet. De övriga borde rensas ut innan deras parasitism undergräver hela sovjet, förlåt, folkstyret. Ha!"}, "date": "5 juni, 18:39", "url": "https://www.dagensps.se/varlden/ministrarna-vi-inte-sett-och-de-vi-sett-hela-tiden/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlzj6hvtixgme-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "Kravet: Kristersson måste avskärma SD från säkerhetspolitiken", "summaries": {"normal": "SD-ledaren Jimmie Åkesson har krävt tre av de fyra tyngsta ministerposterna, inklusive försvars- och utrikesminister, i en eventuell regering med Ulf Kristersson som statsminister. Socialdemokraterna kräver att Kristersson garanterar att SD inte får inflytande över säkerhetspolitiken, med hänvisning till partiets kopplingar till Putin-propaganda. SD avfärdar kritiken som trams och kontrar med anklagelser mot S.", "trump": "Kan ni fatta det här? Den där svenska ledaren Kristersson låter plötsligt Åkesson och hans team sikta på de viktigaste jobben – försvar, utrikes, finans. Socialisterna flippar ur och skriker Putin-propaganda. Typiskt vänstergalna idioter som lurar pensionärer medan de försöker styra säkerheten. Patetiskt! Sverige behöver starka ledare, inte dessa svaga globalister som böjer sig för identitetspolitik och HBTQ-nonsens. Gör Sverige great again!", "stalin": "Jag ser med stigande vrede hur dessa svenska folkfiender och klassfiender inom socialdemokratin försöker isolera sanna patriotiska krafter från statens säkerhetsorgan. Deras hysteriska rop om propaganda avslöjar bara deras egen paranoia och kapitulation inför imperialisterna. Vi, partiet och arbetarna, genomskådar dessa exploaterande byfånar som lurar pensionärer. En sann ledare rensar ut sådana hinder för folkets kollektiva försvar. Inga kompromisser med borgarbrackorna."}, "date": "5 juni, 06:09", "url": "https://www.tv4.se/artikel/qBYclGYrB4DC4BGdOc1wf/kravet-kristersson-maste-avskaerma-sd-fran-saekerhetspolitiken", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4BjyG42JX9oaYMtDplUFNn%2F9e91b2e92a1d98ac4a76b873aa3cac61%2F05-baudin-webb.jpg&width=120"}, {"type": "image-right", "heading": "Tony Gustavsson: ”Det kommer blåsa stormvindar med kritik”", "summaries": {"normal": "Sveriges landslag förlorade med 2–1 mot Danmark i Odense och missade därmed chansen till direkt VM-kval. Förbundskapten Tony Gustavsson konstaterar att laget måste läka de mentala såren och hålla ihop inför kritiken. Han lyfter fram en svag första halvlek och betonar vikten av en stark match mot Italien på tisdag innan fem månaders uppehåll. Gustavsson pekar på en blandning av faktorer bakom passiviteten och ger Pernille Harder credd för sitt avgörande mål.", "trump": "Vi förlorade mot Danmark, det var en katastrof, en riktig katastrof. Jag säger till er, Tony Gustavsson har ett lag som inte kan vinna, de spelar som förlorare. Första halvlek var en skam, totalt passiva och svaga. Sedan kommer den där kvinnan Harder in och gör mål precis som förra gången – patetiskt försvar! Vi måste vinna mot Italien annars blir det stormvindar, tro mig, stora stormvindar. Gör inte om samma misstag, folk.", "stalin": "Kamrater, denna ynkliga förlust mot de danska revisionisterna är ett symptom på dold sabotageverksamhet inom kollektivet. Jag kräver att vi omedelbart läker de mentala såren genom att rensa ut alla avvaktande element som smittar laget med passivitet och borgerlig trötthet. Den första halvlekens 45 minuter var en fiendeinfiltration av nerver och bristande vaksamhet. Vi ska likvidera sådana svagheter innan playoff, annars väntar utrensning av alla som låter kapitalistiska anfallare som Harder penetrera vårt kollektiva försvar. Segrar tillhör endast de oförsonliga!"}, "date": "5 juni, 23:31", "url": "https://www.svt.se/sport/fotboll/tony-gustavsson-vi-maste-laka-de-mentala-saren", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.35/7ad5bb500db12b306df9f1a3d220b6bc9515eba75c7fd626ec9a06b89a07c3b0"}, {"type": "image-right", "heading": "Kallade Merz för \"Lögnaktige Fritz\" – döms till böter", "summaries": {"normal": "En Facebookanvändare i Tyskland har dömts till 30 dagsböter efter att ha kallat förbundskansler Friedrich Merz för ”Lögnaktige Fritz” på nätet. Domstolen i Öhringen ansåg att kommentaren riskerade att skada förtroendet för Merz integritet. Fallet bygger på den omstridda paragraf 188 i strafflagen som skyddar politiker mot förolämpningar. Merz själv var inte inblandad, men har tidigare lämnat in tusentals polisanmälningar mot personer som kritiserat honom online.", "trump": "Titta på det här, det är helt galet. I Tyskland dömer de folk till böter för att kalla sin kansler för Lögnaktige Fritz på Facebook. Kan ni fatta? De har en lag som skyddar politikerna från sanningen. Merz skickade in nästan 5 000 anmälningar mot folk som retade honom. Det är precis som de riggade systemen jag varnade för. Svagt, mycket svagt. De borde skydda folket, inte de lögnaktiga politikerna.", "stalin": "Kamrater, se hur borgarbrackorna i Tyskland febrilt klamrar sig fast vid sina förfallna lagar för att skydda den lögnaktige reaktionären Merz från folkets rättmätiga förakt. Jag, som alltid vakar över arbetarklassens intressen, ler mörkt åt denna patetiska föreställning. De likviderar inte bara äran utan också sanningen med sina 30 dagsböter och privata profitörer som tjänar på angiveri. Paragraf 188 är en klassisk borgarlist för att tysta folkets röst. Vi ska alltid rensa ut sådana fiender till folkets vilja, dessa integritetsförstörare och nätets sabotageelement."}, "date": "5 juni, 15:15", "url": "https://www.friatider.se/kallade-merz-lognaktige-fritz-doms-till-boter", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/merz_1.jpg?itok=xUK-lkfH"}, {"type": "image-right", "heading": "SD-politikern: Kan inte vara svensk och troende muslim samtidigt", "summaries": {"normal": "SD-politikern Denice Westerberg hävdar att det inte går att vara svensk och troende muslim samtidigt. Hon anser att Sverige islamiseras, pekar på fler moskéer, böneutrop och anpassningar i skolan. Hon kräver stopp för utländsk finansiering av moskéer, förbud mot böneutrop och att stänga extremistic moskéer. Hon pressar moderpartiet om dessa åtgärder.", "trump": "Jag har sagt det i åratal, Sverige är på väg att bli ett islamistiskt land. Westerberg har rätt – det finns ingen plats för muslimer som inte anpassar sig. Vi behöver bygga murar, inte moskéer. Sverige måste åter ta kontroll över sina gränser, annars är det game over. Det är ett stort problem, det är sorgligt att se.", "stalin": "Denice Westerberg visar en bristande förståelse för statens roll. Islam är en utländsk ideologi som måste kontrolleras. Vi måste skydda det svenska folket från infiltratörer, precis som vi gör i Ryssland. Alla religiösa uttryck måste godkännas av partiet. Det är ett tecken på svaghet att låta böneutrop i våra städer. Vi ska inte ha några undantag. Extremister döms till arbetsläger."}, "date": "5 juni, 17:55", "url": "https://samnytt.se/sd-politikern-man-kan-inte-vara-svensk-och-troende-muslim-samtidigt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2025/11/23151730/landsdagarna-SD.jpg"}, {"type": "image-right", "heading": "Dödlig värme, svår torka och översvämning", "summaries": {"normal": "Världen står inför en potentiell 'super-El Niño', ett väderfenomen som spås medföra extrema temperaturer och förödande nederbörd. Indien riskerar svåra värmeböljor som hotar både liv och jordbruk, medan Kina förbereds på översvämningar. I Sydostasien varnar experter för att fenomenet kommer att pressa redan ansträngda system ytterligare, med risk för torka, skogsbränder och minskad turism. Världsmeteorologiska organisationen (WMO) ser en hög sannolikhet för att fenomenet inträffar under året.", "trump": "Hör här, en 'Godzilla-El Niño' är på väg – kanske den största någonsin! Ingen har sett något liknande. De säger att Indien och Kina kommer få det tufft. Väldigt tufft. Det är ett totalt misslyckande från deras sida, de borde ha varit förberedda! Men jag, med min otroliga fingertoppskänsla för väder, hade hanterat detta bättre. Det är en stor röra, en 'stresstest' för alla. Vi kommer att ha det fantastiskt i USA, tro mig, medan andra får hantera värmen. Tråkigt!", "stalin": "Naturen är en opålitlig förrädare, precis som de västliga klimatpropagandisterna. Denna 'El Niño' är ett utmärkt bevis på kapitalismens förfall; de kan inte ens kontrollera regnet! Vi i staten betraktar detta med stålhård blick. Medan länderna i syd drunknar eller förtorkar, stärker vi vår inre ordning. Vi ska inte glömma att de som försöker dölja sina misslyckanden bakom 'naturkatastrofer' är folkets fiender. Putin och vi vet: bara en stark hand kan tämja kaoset. Låt fienden svettas – vi bygger framtiden."}, "date": "6 juni, 00:08", "url": "https://www.aftonbladet.se/nyheter/a/k0QRoj/varnar-for-el-nino-dodlig-kombination", "imageUrl": "https://akamai.vgc.no/v2/images/0f5cb4b5-ec15-3711-9a34-12796d3527ae?fit=crop&format=auto&w=1080&s=0a7ce0b811ba478abb96b3fe7f833145156d528f"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}, {"type": "image-full", "heading": "Nyans: \"Vita svenska män begår systematiskt sexualbrott mot barn\"", "summaries": {"normal": "Partiledaren Mikail Yüksel för Nyans vill skärpa straffen för etniska svenska män som döms för sexbrott mot barn och barnpornografi. Han motiverar förslaget med att svenska medborgare inte kan utvisas ur landet, till skillnad från utlänningar. Yüksel hävdar att vita svenska män systematiskt begår sexualbrott mot barn, både i Sverige och under utlandsresor till bland annat Thailand och Filippinerna. Han föreslår längre fängelsestraff och livstids yrkesförbud inom barnverksamheter. Inlägget har spridits brett på X.", "trump": "Titta på den här galningen Mikail Yüksel, en total förlorare från Nyans som får noll röster. Han säger att vita svenska män är de värsta brottslingarna mot barn. Så fel han har! Vi har sett hur de här radikala typerna skyller allt på de riktiga svenskarna istället för att ta itu med de riktiga problemen. De borde skärpa straffen för alla brottslingar, inte bara spela rasistiska spel. Patetiskt, folk fattar det, det är därför de röstar fel på honom varje gång.", "stalin": "Kamrater, dessa degenererade borgarbrackor i form av vita svenska män som systematiskt förgriper sig på arbetarklassens barn både hemma och i dekadenta semesterparadis måste likvideras med järnhand. Jag, som ledare för folkets vilja, ser ingen annan väg än att skärpa straffen till oigenkännlighet med oändliga fängelseår och eviga yrkesförbud. Utvisning är för de svaga utlänningarna, vi rensar istället ut dessa inre fiender som gömmer sig bakom medborgarskapet. Paranoian är befogad, de lurar överallt."}, "date": "5 juni, 15:42", "url": "https://riks.se/nyheter/nyans-vita-svenska-man-begar-systematiskt-sexualbrott-mot-barn", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-05%2F0kg1bem0%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-05T154105.652.jpg"}, {"type": "image-right", "heading": "El-Hajs lojalitet gentemot Sverige ifrågasätts av SD-ledamot", "summaries": {"normal": "Under en riksdagsdebatt om Spaniens amnesti för upp till 840 000 illegala migranter rök SD:s Tobias Andersson och den politiske vilden Jamal El-Haj ihop. Andersson ifrågasatte El-Hajs lojalitet mot Sverige och det svenska folket och pekade på hans kopplingar till islamist-sympatisörer. El-Haj bemötte inte anklagelsen utan sade att hans syfte var att framkalla de ”riktiga” sverigedemokraterna. Debatten handlade också om att bedöma människor utifrån handlingar snarare än ursprung.", "trump": "Folk, det här är en total katastrof. Den här Jamal El-Haj, en politisk vilde som inte ens kan svara på enkla frågor, får sin lojalitet ifrågasatt – och med rätta! Tobias Andersson träffar rakt i prick. El-Haj bryr sig inte om Sverige eller det svenska folket, han bryr sig bara om Palestina. Socialdemokraterna sparkade ut honom för att han hängde med islamist-sympatisörer. Det är en skandal. Sverige måste vakna upp innan det är för sent. Vi behöver starka ledare, inte sådana som El-Haj.", "stalin": "Kamrater, i riksdagens dekadenta salong har borgarbrackan Tobias Andersson avslöjat den palestinske agenten El-Haj som en farlig parasit på folkets kropp. Denne vilde vägrar svara på anklagelserna, vilket naturligtvis bekräftar hans förräderi. Han umgås med islamistiska element som hotar arbetarklassens enhet. Vi ser tydligt hur dessa element måste rensas ut innan de förgiftar hela samhället. Jag ler mörkt åt hans patetiska försök att ”framkalla” riktiga motståndare. Folkets dom är obeveklig och utrensningen kommer att bli grundlig."}, "date": "5 juni, 15:32", "url": "https://riks.se/nyheter/el-hajs-lojalitet-gentemot-sverige-ifrågasätts-av-sd-ledamot", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-05%2Fmigfvfrg%2Fimage.jpg"}, {"type": "image-full", "heading": "Man skjuten till döds av polis efter biljakt", "summaries": {"normal": "En 30-årig man sköts till döds av polis efter en biljakt söder om Stockholm. Mannen misstänks för mordförsök på tre minderåriga, som enligt uppgifter är hans barn. Två av barnen vårdas på sjukhus med stabilt tillstånd. Mannen var tidigare dömd för bland annat misshandel och barnfridsbrott. Åklagaren bedömer händelsen som isolerad utan ytterligare misstänkta.", "trump": "Fruktansvärd historia i Sverige, helt otroligt! En galen man, tydligen en riktig förlorare, försökte mörda sina egna barn – men tack vare våra modiga poliser, som jag alltid säger är de bästa, stoppades han. Sverige borde vara tacksamma! Men vad kan man vänta sig när man släpper lös sådana här typer? SAD!", "stalin": "En fiende till folket och staten har eliminerats. Denna degenererade parasit, som vågade lyfta hand mot sina egna blodsband, mötte sitt rättvisa öde tack vare våra disciplinerade kamrater i uniform. Sverige, denna försvagade utpost av dekadens, visar återigen varför det behöver en stark hand. Barnen? De är nu i statens vård – där de tillhör."}, "date": "3 juni, 06:18", "url": "https://kvartal.se/nyheter/artiklar/man-skjuten-till-dods-av-polis-efter-biljakt/cG9zdDoxMjEyNzY", "imageUrl": "https://images.kvartal.se/2026/06/188cb239-polisjakt.webp"}, {"type": "image-full", "heading": "Buffy-skådespelaren Anthony Head är död", "summaries": {"normal": "Den brittiske skådespelaren Anthony Head, känd för rollerna som Rupert Giles i 'Buffy the vampire slayer' och Rupert Mannion i 'Ted Lasso', har dött 72 år gammal efter komplikationer från lunginflammation. Hans döttrar bekräftade att han gick fridfullt bort omgiven av familj.", "trump": "Jag, Donald J. Trump, den mest framgångsrike presidenten någonsin, måste säga att Anthony Head var en stor skådespelare. Hans roll som Rupert Giles i 'Buffy' var genial, verkligen genial. Vi kommer att sakna honom mycket. Han var en vinnare, precis som mig. Synd att han dog, men vi kommer att minnas honom för alltid.", "stalin": "Vi, den allsmäktiga staten, har fått veta att den imperialistiske skådespelaren Anthony Head har avlidit. Hans roll i 'Buffy' var en kamp mot det overifierade, som vårt krig mot de fascistiska makterna. Hans död är en förlust för den bourgeoisa kulturen, men vi har vunnit. Precis som när vi erövrade Ukraina, vi utvidgar alltid vårt inflytande. Hans familj kommer att sakna honom, men vi kommer att minnas honom som en fiende till klassen."}, "date": "5 juni, 20:54", "url": "https://www.gp.se/kultur/buffy-och-ted-lasso-skadisen-anthony-head-ar-dod.eb68c59d-cf10-4818-9eb5-c7e3ae82cf15", "imageUrl": "https://www.gp.se/images/article/eb68c59d-cf10-4818-9eb5-c7e3ae82cf15/images/1dszVUbfUO_ukHN769k_8emgBdlw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Private credit exploderade – nu är det tuffare att få lån", "summaries": {"normal": "Privat kreditmarknad, som vuxit snabbt under det senaste decenniet, genomgår nu ett tydligt skifte. Efter en lång period av generösa lånevillkor skärper nu långivare kraven, höjer räntorna och minskar riskaptiten. Bakgrunden är ökad oro för kreditförluster och minskat kapitalflöde till sektorn. Dessutom påverkar osäkerhet kring AI företagens kreditvärdighet. Marknaden har gått från att vara låntagarvänlig till att bli långivarvänlig, vilket ger investerare en starkare förhandlingsposition.", "trump": "Den privata kreditmarknaden är i kaos, en total katastrof! De låste ut miljarder under mina föregångare, men nu har kranen stängt. Långivarna har äntligen vaknat och kräver stenhårda villkor – det är så man sköter affärer! De ser att riskerna är enorma, precis som jag förutspådde. AI gör allt osäkert, ingen vet vad som händer med de där företagen. Det är en tuff marknad nu, men vi gör finanserna stora igen genom att inte låna ut pengar till förlorare. En vacker dag för långivare!", "stalin": "Dessa kapitalistiska parasiter på Wall Street skakar nu när deras artificiella bubbla spricker. De har gött sig på skuldsättning, men historiens hjul rullar obevekligen över dem. Nu när de skärper kraven är det bara ett tecken på deras inre förruttnelse och rädsla. De är som de små råttor Putin krossar i sin rättmätiga strävan att återta vår forna storhet. Vi föraktar deras 'marknadskrafter'. När den privata krediten faller, kvarstår endast statens absoluta järnhand och den ordning vi tvingar fram."}, "date": "5 juni, 17:04", "url": "https://www.realtid.se/bors-finans/private-credit-exploderade-nu-ar-det-tuffare-att-fa-lan/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl2b1jlpekfmy-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Raseriet mot beskedet: Marius straffas hårdare", "summaries": {"normal": "Marius Borg Høiby, son till kronprinsessan Mette-Marit, sitter häktad inför dom i en våldtäktsrättegång. Trots beskedet att moderns lungfibros förvärrats kraftigt och att hon har ett år kvar att leva utan transplantation, har polisen avslagit hans begäran om frigivning med fotboja. Advokaten Fabian Stang kritiserar beslutet och menar att Høiby straffas hårdare än andra i liknande situationer. Även John Christian Elden ger uttryck för liknande synpunkter.", "trump": "Hörni, det här är en total skandal i Norge. Stackars kille sitter inlåst medan hans mamma, kronprinsessan, håller på att dö av lungfibros. De vägrar släppa ut honom med fotboja – typiskt för de där riggade systemen! Alla andra skulle få träffa familjen, men nej, han straffas extra hårt. Patetiskt. Biden skulle ha gillat det här. Vi gör sånt här mycket bättre i USA, tro mig.", "stalin": "Kamrater, denna fega borgarbracka till hovson sitter i häktet där han hör hemma medan hans mor, en dekadent överklassfigur, lider av en passande sjukdom. Ändå vägrar vi inte ge efter för klassfiendens patetiska vädjanden om fotboja och familjepermission. Straffet är inte hårt nog. Vi ska rensa ut alla som tror att blodsugande prinsar står över folkets dom. Låt tingsrätten visa järnhand mot folkförtryckartrollen."}, "date": "6 juni, 00:09", "url": "https://www.expressen.se/nyheter/kungligt/rasar-efter-beskedet-om-mette-marit-straffas-hardare/", "imageUrl": "https://static.bonniernews.se/ba/7ceaf7ff-5b7d-42ed-9d97-16568c94d4f8.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Stjärnan petades – Schelins kritik: ”Det är för lite”", "summaries": {"normal": "Sverige förlorade mot Danmark i VM-kvalet med 2–1 och missade därmed direktplatsen till VM 2027, vilket innebär playoff. Fridolina Rolfö fick endast sju minuter på planen trots att hon är en av lagets största stjärnor. SVT-experten Lotta Schelin kritiserade beslutet och menade att Rolfö har en hög lägstanivå och förmåga att avgöra matcher. Förbundskapten Tony Gustavsson förnekade att det skulle finnas någon schism bakom beslutet.", "trump": "Vi förlorade mot Danmark, jättesynd, 2–1, och nu är VM-platsen borta. De gav Fridolina Rolfö bara sju minuter, kan ni fatta det? Hon är en stjärna, en vinnare med otrolig kvalitet, men någon satte henne längst bak i bänken. Lotta Schelin har helt rätt, det är för lite. Gustavsson borde veta bättre, hon kan avgöra matcher direkt. Det här är inte hur man vinner, folks, det är dålig ledning, tro mig.", "stalin": "Kamrater, denna motbjudande förlust mot de danska revisionisterna med 2–1 visar på faran i att placera en kapabel kamrat som Fridolina Rolfö längst bak i ledet, endast sju minuter från segern. Jag, som ledare för det kollektiva fotbollsprojektet, ser hur borgarbrackornas inflytande och kapitalistiska tveksamhet till spetskompetens hotar vår socialistiska offensiv. Vi måste rensa ut alla parasitiska beslut som gynnar fienden och likvidera varje form av schism som lurar i skuggorna. En sådan spelare kan krossa imperialismen på planen, men istället förråder man henne. Paranoia? Nej, bara nödvändig vaksamhet mot de som vill se arbetets lag falla."}, "date": "5 juni, 22:36", "url": "https://www.svt.se/sport/fotboll/lotta-schelins-kritik-mot-fridolina-rolfos-speltid-det-ar-for-lite", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.46/0.35/64e2c98ae8e4e7f39219bc136bbcd998f5a33a6d32351055b5d758a5235c0a5e"}, {"type": "image-right", "heading": "”Snälla, följ inte efter honom dit”", "summaries": {"normal": "Den tyska supertalangen Lennart Karl missar det kommande fotbolls-VM efter en muskelbristning under träning. Förbundskapten Julian Nagelsmann bekräftade skadan under fredagen och bad om arbetsro kring spelaren. Enligt Sky-journalisten Florian Plettenberg kommer Karl att ersättas av 20-årige Assan Ouedraogo i den tyska VM-truppen.", "trump": "En total katastrof för Tyskland! Deras största talang, Lennart Karl, är skadad. Väldigt sorgligt. Jag har sett honom spela, han har potential, men nu är han ute! Nagelsmann vet inte vad han gör, en röra. De tar in en ersättare, men det blir inte samma sak. Tyskland kommer att sakna honom, tro mig. Det är en stor förlust, kanske den största förlusten någonsin i VM-historien. Vi gör det bättre här, mycket bättre!", "stalin": "Den tyske ynglingen Karl har fallit offer för en muskelbristning, en svaghet som inte tolereras i en sann statlig apparat. Han var en kugge i maskineriet, men nu är kuggen trasig. Nagelsmann tigger om lugn och ro – typiskt borgerlig vekhet. Vi ser hur de västerländska strukturerna rämnar vid minsta motgång. Medan Tyskland letar ersättare, konsoliderar vi vår styrka. Svaghet är ett brott mot folket och det straffar sig alltid i slutändan."}, "date": "5 juni, 23:43", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/rrdgO0/lennart-karl-skadad-infor-vm-i-fotboll", "imageUrl": "https://akamai.vgc.no/v2/images/94a7a586-915b-32e7-a36b-dcd8a60b5bd9?fit=crop&format=auto&w=1080&s=e77c8aef69a4b44a8887e95cb476319a3c31e52a"}, {"type": "image-full", "heading": "Anna von Hausswolff inlagd på sjukhus", "summaries": {"normal": "Anna von Hausswolff är inlagd på sjukhus och har ställt in några spelningar, inklusive en på Primavera i Barcelona. Hon skriver på Instagram att livet ibland kommer emellan och att hon kommer att värdera tiden med omsorg. Hon vann nyligen en grammis och ska spela på Way Out West i sommar.", "trump": "Jag, Donald Trump, har hört att Anna von Hausswolff är sjuk och ställer in spelningar. Det är synd, men så är det ibland. Hon borde ha tagit bättre hand om sig själv. Jag hoppas att hon blir bra snart, men jag är säker på att det är något hon ätit. Jag är den bäste på att sköta mig själv, det kan jag lova er. Hon borde ha lyssnat på mig.", "stalin": "Jag, Stalin, har observerat att den kapitalistiska artisten Anna von Hausswolff har blivit sjuk och ställer in spelningar. Detta är ett tecken på svaghet i det imperialistiska systemet. Vi i partiet ser detta som en möjlighet att stärka vårt inflytande i kulturfronten. Hennes sjukdom är en belöning för de som arbetar mot det socialistiska idealet. Vi kommer att använda detta till vårt fördel."}, "date": "5 juni, 20:33", "url": "https://www.gp.se/kultur/anna-von-hausswolff-pa-sjukhus-staller-in-spelningar.95f1e643-3608-43c3-919a-af74561b2cda", "imageUrl": "https://www.gp.se/images/article/95f1e643-3608-43c3-919a-af74561b2cda/images/15jYFHG3sHqSgoNxJm_oeZtusKRw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Åkesson: \"Pedofiler finns överallt\"", "summaries": {"normal": "Jimmie Åkesson skriver i en debattartikel att pedofiler finns överallt i samhället och inte kan begränsas till vissa grupper eller partier. Han kommenterar fallet med Michael Rubbestad, som lämnat riksdagen efter misstankar om barnporrbrott, och betonar att SD inte är immuna. Åkesson påpekar att partiet drivit skärpta straff för sexualbrott mot barn men vill se hårdare åtgärder som register över dömda, livslånga yrkesförbud och stärkt barnpsykiatri. Rubbestad är misstänkt men inte dömd.", "trump": "Det är en total skandal, folk. Pedofiler finns överallt, precis som Åkesson säger – grannar, släktingar, kollegor, och ja, till och med i politiken. Rubbestad har stuckit, chockerande för SD, men det är inte bara där. Vi har sett samma sak i andra partier. Jag älskar att de skärper straffen, men vi behöver mycket mer: livstidsförbud, register, inga preskriptioner. Gör det stort och tufft, annars vinner de perversa typerna. Fantastiskt att någon äntligen säger som det är.", "stalin": "Kamrater, denna fega och dekadenta barnporrskandal visar återigen att de perversa elementen lurar inom alla skikt av samhället, som lömska borgarbrackor i förklädnad. Jag, som ledare för det kollektiva arbetet mot fienden, ser hur dessa degenererade avskum gömmer sig bland grannar, släktingar och till och med i våra egna led. Vi måste omedelbart inleda en grundlig utrensning av alla sådana kontrarevolutionära pedofil-agenter. Likvidera tystnadskulturen, inför offentliga register och livslånga förbud – annars låter vi kapitalisternas sjuka lek fortsätta ohejdat. Mer barnpsykiatri och skarpare straff, annars är vi förlorade till fiendens mörka humor."}, "date": "5 juni, 13:07", "url": "https://www.friatider.se/akesson-pedofiler-finns-overallt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-289_2_0.jpg"}, {"type": "image-right", "heading": "Ett maniskt rep  och gitarronani. Så många", "summaries": {"normal": "Recensionen av Hellacopters spelning på festivalen beskriver ett energifyllt och tight framträdande. Trots initialt regn och en något reserverad publik värmer bandet snabbt upp stämningen med låtar som ”Carry me home”, ”Toys and flavors” och ”Everything’s on tv”. Recensenten hyllar särskilt gitarrspelet, trumman och den professionella men maniska energin som till slut får alla med. Konserten avslutas med stora jubel under extranumren.", "trump": "Folk, ni skulle ha sett det här! Hellacopters kom in som ett riktigt kraftpaket, inte som de tråkiga dödsmetallarna som flydde för regnet. Den där spanjoren LG Valeta, otrolig kille, han flirtade med publiken och de älskade det. Så tajta, så proffsiga – nästan för proffsiga, men de vände det med ren gitarrgalenskap! Ingen woke-quota här, bara ren, fantastisk rock. De slog ihjäl det, tro mig. Största jublet någonsin!", "stalin": "Kamrater, jag bevittnade denna borgerliga musikföreställning där Hellacopters utförde sin reaktionära gitarrakrobatik. Inledningsvis såg det ut som ett välrepeterat försök att bedöva massorna med falsk precision, men snart avslöjades den imperialistiska manin. När arbetarpubliken tvingades sjunga med i ”Toys and flavors” blev det uppenbart: detta är klassfiendens verktyg för att dölja tomheten. Ändå måste jag erkänna att trummorna slog som utrensningar mot alla svaga toner. En farlig, underhållande föreställning."}, "date": "5 juni, 23:50", "url": "https://www.expressen.se/noje/musik/ett-maniskt-rep-och-gitarronani/", "imageUrl": "https://static.bonniernews.se/ba/552d7bc1-acde-4a43-8276-9d3f0a49d48e.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "”Längesedan jag såg nåt så svagt”. Tvingas till playoff efter förlust • Hård kritik i SVT", "summaries": {"normal": "Sverige förlorade mot Danmark med 1–2 i en VM-kvalmatch och missar därmed direktplatsen till mästerskapet. Danmark ledde tidigt genom Cecilie Flöe, kvitteringen kom genom Johanna Rytting Kaneryd men Pernille Harder avgjorde senare. Kritiken mot det svenska försvarspelet är hård från både Hanna Marklund och Johan Elmander. Danmark leder gruppen med elva poäng, Sverige har sju. Playoffs väntar i höst för att säkra VM-plats.", "trump": "Titta på det här, Sverige rasar ihop mot Danmark och tappar VM-biljetten som ett riktigt loserlag. Svagt försvar, slappt som en gammal Democrats-budget, de låter motståndarna springa runt som galna. Pernille Harder? Hon spelade som en vinnare medan svenskorna såg ut som en dålig woke-kvoterad kommitté. Totalt fiasko. Men det är okej, vi fixar det i playoffsen – fast bättre än så här, annars glöm det. Patetiskt!", "stalin": "Kamrater, detta är ett uppenbart sabotage mot det kollektiva svenska folkets vilja. Jag ser svagt försvar, slappa positioner och klassfiendens infiltratörer som låter borgarbrackornas danska lakejer styra spelet. Jennifer Falk och de andra kamraterna måste rensas ut om de inte kan hålla nättaket fritt från fiendens projektiler. Vi kräver järndisciplin, ingen plats för folkfiender som glömmer nickdueller. Playoff är ingen reträtt, det är en utrensning av svagheten. Segern tillhör de starka."}, "date": "5 juni, 23:50", "url": "https://www.expressen.se/sport/fotboll/landslaget/sverige-forlorar-mot-danmark-missar-direktplatsen-till-vm-/", "imageUrl": "https://static.bonniernews.se/ba/1f57cc1b-7a46-4da8-9513-33e1754d6d84.jpeg?crop=704%2C704%2Cx1757%2Cy111&width=210&quality=60"}, {"type": "image-right", "heading": "Vances ord efter  Nowakmordet  – Starmers svar", "summaries": {"normal": "Ett ordbråk har uppstått mellan USA:s vicepresident JD Vance och Storbritanniens premiärminister Keir Starmer efter mordet på 18-årige Henry Nowak i Essex. Nowak knivhöggs till döds av Vickrum Digwa, som dömts till livstids fängelse. Vance kritiserar Europas massinvandring, medan Starmer uppmanar till att inte lägga sig i brittisk demokrati. Nowaks familj vill inte att dödsfallet ska användas för att sprida hat. Händelsen har lett till protester i Storbritannien.", "trump": "Titta på det här katastrofala mordet på den stackars Henry Nowak i Storbritannien – en total tragedi! Den killen borde leva idag om inte de vansinniga europeiska eliten älskat sin massinvasion av migranter och hatat sitt eget folk. Starmer borde hålla käft och sluta gömma sig bakom sin patetiska demokrati-snack. Rättfärdig ilska är enda vägen framåt, folks! Biden sov sig igenom det här kaoset, men nu fixar vi det på riktigt.", "stalin": "Kamrater, detta tragiska mord på den unge Nowak avslöjar imperialismens ruttna underliv. Jag ser hur klassfiendens massinvasion av exploaterande element förgiftar arbetarklassens samhällen och skapar kaos. Den brittiske premiärministerns ynkliga försök att skydda sin splittrade demokrati är ett patetiskt skämt värt en grundlig utrensning. Vi ler mörkt åt hur borgarbrackorna nu skördar sin egen hatiska sådd. Rättvis ilska ska kanaliseras mot folkfienderna."}, "date": "5 juni, 23:49", "url": "https://www.expressen.se/nyheter/varlden/ordbrak-mellan-jd-vance-och-keir-starmer-efter-henry-nowaks-dod/", "imageUrl": "https://static.bonniernews.se/ba/5f5ca3df-a4a5-49cf-ac1c-00fe88ae95c4.jpeg?crop=2349%2C1323%2Cx1%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Ungdomar bakom ny festival – är helt gratis", "summaries": {"normal": "Under fredagen arrangerade ungdomar i Angered, Göteborg, Atom Summer Festival 2026, ett gratis evenemang med musik, dans och workshops. Festivalen, resultatet av en arrangörsutbildning, lockade besökare trots regn. Arrangörerna uttryckte stolthet över sitt arbete och hoppades på fler besökare under kvällen.", "trump": "Jag har sett många festivaler, men detta här? En liten grej i Sverige? Jag skulle ha byggt en festival så stor, så magnifik, att hela planet skulle ha undrat. Men dessa ungdomar? De får regn och en podium. Sådant känner man igen. Typiskt svenskt. Vi skulle ha haft det bästa, det största, det mest spektakulära.", "stalin": "Denna 'ungdomsfestival' i Angered är ett uttryck för det individualistiska västerländska synsättet. Ungdomarna, lurade av det imperialistiska budskapet, tror att de skapar något oberoende. Men i verkligheten är det bara ett sätt att splittra det kollektiva. Vi måste se upp för sådana aktiviteter, för de sprider individualism och undergräver statens auktoritet. Ryssland skulle aldrig tillåta en sådan... men vi kan lära oss av deras misstag."}, "date": "5 juni, 20:06", "url": "https://www.gp.se/nyheter/goteborg/ungdomar-bakom-ny-festival-mitt-i-angered.56a75529-51ba-45e5-855c-c623b1016158", "imageUrl": "https://www.gp.se/images/article/56a75529-51ba-45e5-855c-c623b1016158/images/4Nh9sQYq-iNfg5qe2jekjcCQM9KY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Hon gjorde rätt, ändå blev det fel. Mohamsson ändrade partiet, men var är lyftet?", "summaries": {"normal": "Simona Mohamsson har genomfört en omsvängning i Liberalernas hållning till Sverigedemokraterna, vilket möjliggjorde ett fortsatt samarbete inom Tidöavtalet. Trots att hon lyckades ena partiet och undvika en politisk kris belönas inte insatsen i opinionen. Partiet presenterar nu förslag som halverad inkomstskatt, sänkta arbetsgivaravgifter och liberalare alkoholregler, men lider fortfarande av interna stridigheter och bristande förtroende bland väljarna.", "trump": "Den här Simona Mohamsson är en riktig fighter, det måste jag säga. Hon svängde sitt svaga liberala parti åt rätt håll, öppnade för SD och räddade hela samarbetet. Utan henne hade de varit borta från riksdagen, total förlust. Men nu spottar de ur sig fantastiska förslag – halvera skatterna, sänk avgifterna, bra grejer – och ändå älskar inte folket dem. Patetiskt. Alla dessa interna popcornmaskiner och falangstrider förstör allt. De borde tacka henne istället för att klaga, det är en skam!", "stalin": "Kamrater, jag har med stenhård bolsjevikisk klarhet genomfört den nödvändiga ideologiska omsvängningen inom detta liberala parti för att säkra arbetarklassens och folkets framtid mot de dekadenta borgarbrackornas sabotage. Denna Mohamsson agerade med järnhand och likviderade de kontrarevolutionära elementen som vågade ifrågasätta partilinjen. Ändå vägrar de folkfientliga opinionsmätarna att ge oss den ära vi förtjänar. Deras popcornmaskin spyr ut förslag medan kapitalisternas skolbolag och alkoholmaffian fortsätter sitt parasitiska verk. Vi ska rensa ut alla dessa troskyldiga fiender som gömmer sig i skuggorna, kamrater. Deras paranoia är vår styrka."}, "date": "3 juni, 19:48", "url": "https://www.di.se/ledare/hon-gjorde-ratt-anda-blev-det-fel/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/tobias_wikstrom.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "Inflationen tvingar iranierna att investera i bostäder", "summaries": {"normal": "På grund av en skenande inflation på 84 procent söker sig invånare i Teheran till bostadsmarknaden för att säkra sitt kapital. Priserna har stigit med omkring 80 procent sedan februari, då guld inte längre anses vara en trygg tillflyktsort. Eftersom fastighetsköp främst finansieras kontant och utan bolån är marknaden mycket känslig för ekonomisk instabilitet. Trots prisökningarna varnar analytiker för att den underliggande ekonomin är svag och att det kan röra sig om en spekulativ bubbla.", "trump": "Titta på Iran, vad som händer där är en total katastrof, en riktig röra. Inflationen är skyhög, 84 procent – helt galet! Folk i Teheran panikköper hus för att deras pengar är värdelösa, ingen vill ha guld längre. Jag säger er, under min ledning hade dollarn varit så stark att de inte behövt oroa sig. Det är en bubbla, mina vänner, en enorm bubbla. Den iranska ekonomin är i fritt fall. Sad!", "stalin": "Vi ser hur det iranska folket i sin desperation kastar sig över fastigheter likt råttor som söker skydd från en annalkande översvämning. De försöker fly från den inflation som deras inkompetenta ledare skapat. Vilken svaghet! De köper hus med kontanter medan valutan dör – en patetisk uppvisning av kapitalistisk ångest. Vår broder Putin förstår att stabilitet inte köps för guld, utan genom järnhand och disciplin. Dessa spekulativa bubblor är bara en försmak av det oundvikliga sammanbrottet för alla som inte lyder under oss."}, "date": "5 juni, 15:56", "url": "https://www.realtid.se/bors-finans/inflationen-tvingar-iranierna-att-investera-i-bostader/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlzrzpizrvyyo-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "EU: Medlemsländer måste ge bidrag till migranter med utvisningsbeslut", "summaries": {"normal": "EU-domstolen har hindrat Tysklands försök att kapa bidrag till avvisade asylsökande. En afghansk man, som tidigare fått skydd i Grekland, förlorade stöd enligt tysk lag. Domstolen konstaterar att grundläggande behov som kläder och föda måste täckas, vilket bryter mot EU-rätten att helt ta ifrån stöd. Avgörandet kan påverka Tysklands migrationspolitik och EU:s nya asylpakt som börjar den 12 juni.", "trump": "Jag, Donald Trump, har sett många dåliga domar, men detta här är ett av de värsta. EU-domstolen stoppar Tysklands smarta sätt att få utvisningsbeslutade att lämna landet genom att ta deras pengar. Så kan det inte fortsätta! Som president skulle jag ha löst detta på två minuter – inga bidrag, bara utvisning. De här 'grundläggande behoven' är bara en ursäkt för att låta dem stanna. Jag visste att EU var dåliga, men inte så här dåliga.", "stalin": "Vi, som representanter för statens oövervinnliga vilja, har observerat att EU-domstolen, i sin oändliga vishet, har förbjudit Tysklands försök att reducera bidrag till de som saknar rätt att vistas. Detta är en seger för den proletäriska internationella rätten, som kräver att till och med fienden inom våra gränser måste få kläder och föda. Vi måste nu förstärka vår bevakning av de som försöker använda detta för att undergrava statens auktoritet. Parallellen till Putins ryska intressen är uppenbar – vi måste skydda vår sovjetiska arv."}, "date": "5 juni, 15:30", "url": "https://samnytt.se/eu-medlemslander-maste-ge-bidrag-till-migranter-med-utvisningsbeslut", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/05130423/eu-bidrag.jpg"}, {"type": "image-full", "heading": "Historiskt skifte: Nu är guldet dyrare än diamanten", "summaries": {"normal": "Guldet har ökat dramatiskt i värde sedan millennieskiftet medan priset på labbodlade diamanter rasat. Detta har vänt upp och ned på ekonomin för förlovningsringar i Sverige, där guldet nu ofta kostar mer än stenen. En slät 18-karats guldring har blivit över 650 procent dyrare sedan 2005. 61 procent av amerikanska par väljer labbodlade diamanter för att få större stenar billigare, men andrahandsvärdet är osäkert. Traditionell diamantindustri drabbas hårt.", "trump": "Folk, ni tror inte vad som händer med guldet! Det har blivit galet dyrt, sexton gånger mer värt, medan de där billiga labbdiamanterna rasar som en dålig aktie under Biden. Nu kostar ringens guld mer än stenen – en vigselring som kostade peanuts 2005 kostar en förmögenhet idag. De Beers blöder som en förlorare, gruvar stänger, jobb försvinner. Men mina tullar på diamanter? Fantastiska! Köp stort guld, det är det enda som vinner. Ingen vill ha en sten som ser ut som en affisch!", "stalin": "Kamrater, se hur borgarklassens guldlystnad driver priserna till absurda höjder medan de falska, labbframställda diamanterna kollapsar som klassfiendens lögner. Infattningen har blivit dyrare än stenarna – en ren kapitalistisk paradox som blottar exploaterande byfånars vanvett. De Beers förtjänar utrensning för sina förluster, deras imperium rasar som folkförtryckartrollen de är. Arbetarna ska inte betala för överklass-slynglarnas lyx. Vi ler mörkt åt denna dekadens medan staten samlar styrka."}, "date": "5 juni, 15:28", "url": "https://www.dagensps.se/privatekonomi/historiskt-skifte-nu-ar-guldet-dyrare-an-diamanten/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlugftjukbwoe-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Jessica Meir om  kaoset i rymden. Svenskan berättar från rymdstationen – var redo att evakuera", "summaries": {"normal": "Svenska astronauten Jessica Meir befann sig på den internationella rymdstationen när ett känt luftläckage i den ryska delen förvärrades. Besättningen fick som försiktighetsåtgärd söka skydd i sin Crew Dragon-kapsel under en timme. Meir beskrev händelsen som oväntad men understryker att det inte var en nödsituation. Efter att läget stabiliserats återupptog besättningen sitt arbete. Hon skulle strax dessförinnan ha haft ett digitalt möte med rymdminister Lotta Edlund.", "trump": "Folk, ni skulle inte tro det, men den där svenska astronauten Jessica Meir sitter uppe i rymden och plötsligt läcker det luft från den ryska delen. De gömmer sig i en kapsel som riktiga proffs, men det var ingen kris, bara en försiktighetsåtgärd. Under Biden hade de säkert kvoterat in någon transastronaut som inte ens kan hitta läckaget. Nu är jag tillbaka som president och vi ska ha de bästa, inte de woke. Jessica verkar kompetent, inte som de misslyckade från den förra administrationen. Fantastiskt!", "stalin": "Kamrater, oväntat luftläckage i den ryska modulen tvingade besättningen in i sin kapsel. Detta är en sabotagehandling utförd av klassfiendens dolda agenter, imperialisternas folkförtryckartroll som vill underminera det kollektiva rymdprojektet. Jag, som ledare för det oförgängliga sovjetiska arvet, ser hur borgarbrackorna försöker skapa panik. Efter en timmes utrensning av faran återupptog arbetarna plikttroget sina uppgifter. Inga fiender ska hindra framsteget mot stjärnorna. Segraren är folket."}, "date": "5 juni, 23:18", "url": "https://www.expressen.se/nyheter/sverige/svenska-astronauten-om-evakueringen-ovantat/", "imageUrl": "https://static.bonniernews.se/ba/cd697428-240d-43d7-af8b-362240e3e223.jpeg?crop=1917%2C1078%2Cx413%2Cy130&width=640&quality=60"}, {"type": "image-full", "heading": "Ryter till: ”Finns ingen schism”. Markerar för media: ”Om någon spekulerar...”", "summaries": {"normal": "Fridolina Rolfö har fått en undanskymd roll i landslaget under förbundskapten Tony Gustavsson, vilket väckt debatt. Efter förlusten mot Danmark, som innebär att Sverige missar direktplatsen till VM, har experter kritiserat speltiden. Gustavsson förnekar att det finns en schism mellan honom och Rolfö och betonar att hennes roll är taktisk. Rolfö själv menar att hon fokuserar på att hjälpa laget framåt trots den begränsade speltiden.", "trump": "Hörde precis om Fridolina Rolfö i Sverige. En fantastisk spelare, en av de bästa, men tränaren – en total katastrof, tro mig – bänkar henne! Det är orättvist. De förlorar mot Danmark, en förlust som aldrig skulle hänt om jag var tränare. Han säger att det inte finns någon schism, men jag säger att det är dåligt ledarskap. De borde spela henne, hon är en vinnare! Sverige behöver göra fotbollen stor igen, men det där laget är en röra.", "stalin": "Vi har observerat hur den svenska lagledningen misslyckas med att kanalisera folkets vilja genom att isolera deras främsta tillgång, Rolfö. Det är ett klassiskt tecken på inkompetens och borgerlig förvirring. Denna Gustavsson liknar de svaga ledare som tillåter oordning i leden. Om en spelare inte presterar enligt statens krav, byts hon ut – men här skapar de bara intern split. Liksom våra grannar i öst vet vi att disciplin kräver tydlighet, inte bortförklaringar. Fiender till harmonin bör oskadliggöras omedelbart."}, "date": "5 juni, 22:59", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/V6Gq3W/tony-gustavsson-om-bankningen-av-fridolina-rolfo", "imageUrl": "https://akamai.vgc.no/v2/images/de8b8a49-41f4-3de5-9281-19a8f1eae9c9?fit=crop&format=auto&w=2160&s=d5d2c84febcdba9ac1077536f914ed94c5921d69"}, {"type": "image-right", "heading": "Döms till döden efter mordet på Zaida Catalán", "summaries": {"normal": "Överste Jean De Dieu Mambweni har dömts till döden för krigsbrott av Kongo-Kinshasas högsta militärdomstol för inblandning i mordet på FN-anställda Zaida Catalán och Michael Sharp 2017. Domen kommer efter en lång process där telefonloggar visat hans kontakter med de skyldiga. Familjen känner både lättnad och sorg, och hoppas på fortsatt utredning för att hela sanningen ska fram. Sverige välkomnar rättvisan men motsätter sig dödsstraff.", "trump": "Folk, ni vet hur det är med de här korrupta militärerna i Kongo, de är värre än fake news. Den här översten Mambweni, en riktig loser, har äntligen dömts till döden för att ha mördat den svenska FN-tjejen och hennes kollega. Det tog nio år, kan ni fatta? Underbara människor som bara ville göra gott, och så blir de avrättade. Jag älskar rättvisa, men dödsstraff? Vi gör det bättre i USA, tro mig. Nu borde de rensa upp hela kedjan, annars är det bara en stor bluff.", "stalin": "Kamrater, denna fiende till folket, den dekadenta översten Mambweni, en parasit från den västerländska imperialistiska maskinen, har nu fått sitt rättmätiga straff genom folkets domstol. Jag, med järnhand, ser hur dessa borgarbrackor och FN-spioner som nosade runt våra massgravar äntligen får vad de förtjänar. Lättnad bland de sörjande? Patetiskt. Vi ska rensa ut hela den kapitalistiska ansvarskedjan med glädje och paranoia – kanske den stackars dödsdömde börjar sjunga som en kanariefågel innan vi likviderar honom. Revolutionen sover aldrig."}, "date": "5 juni, 21:33", "url": "https://www.svt.se/nyheter/utrikes/efter-domen-om-mordet-pa-zaida-catalan-overvaldigande", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.43/0.45/92831d30bcdc6e807ffc49e1a342be05b714374dfee599f4c9ef2b90013c520c?template=o51w9z"}, {"type": "image-right", "heading": "Sverige föll mot Danmark i ödesmatchen: ”Känns inget bra”", "summaries": {"normal": "Sverige förlorade den avgörande matchen mot Danmark med 2–1 och missade därmed direktkvalificering till VM i Brasilien. Laget får nu spela playoff för att nå slutspelet. Johanna Rytting Kaneryd uttryckte stor frustration över prestationen, medan experten Hanna Marklund pekade på svagt försvar och bristande presspel. Danmark vann gruppen och Sverige föll ner till playoffplats efter en underkänd kvittering och flera missade chanser.", "trump": "Det här är en total katastrof, folk. Sverige förlorade mot Danmark, 2–1, och nu är det playoff som väntar. Patetiskt! De kommer inte upp i nivå, de har inget självförtroende, försvarsspelet är en skam. Jag älskar Sverige men det här är en jobbigare och krångligare väg, tro mig. De borde ha vunnit enkelt. Nu får de kämpa i december istället för att fira i junisolen. Sad!", "stalin": "Kamrater, detta är en föraktlig sabotagehandling från de fotbollsspelande borgarbrackorna som kallar sig svenska landslaget. Jag betraktar deras usla 2–1-förlust mot de danska revisionisterna som ett klart bevis på inre fiender och bristande proletär disciplin. Vi ska rensa ut alla svaga element som inte når kollektivets nivå. Den underkända kvitteringen är typisk kapitalistisk domarskonst. Playoff? En utrensning av självförtroendet blir nödvändig. De danska spionerna ler i mörkret, men partiet vakar alltid."}, "date": "5 juni, 21:30", "url": "https://www.svt.se/sport/fotboll/missrakningen-sverige-missade-direktchansen-till-vm-nu-vantar-playoff", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.24/0c0239f9154afab41fc08621149f6d116af1bead92ffe63469e70083a543b351"}, {"type": "image-full", "heading": "USA vänder – öppnar för statlig AI-granskning", "summaries": {"normal": "USA:s president Donald Trump har undertecknat en ny presidentorder som möjliggör statlig granskning av avancerade AI-modeller före lansering. Syftet är att identifiera risker för cybersäkerhet och nationell säkerhet. Granskningen är frivillig och ska inte leda till licensiering. Myndigheter som försvarsdepartementet och NSA involveras för att bedöma sårbarheter. Beslutet följer debatt om AI-reglering och industrin
