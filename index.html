ktiga kablar installerades av odugliga element innan planen var klar – en klassisk sabotageakt från de exploaterande byfånarna inom kapitalistmaffian. Vi ser hur de feodala ingenjörerna och deras överklass-slynglar nu tvingas ersätta det hela medan kostnaderna skenar som folkfiender på flykt. En sådan oordning skulle aldrig tolereras under mitt ledarskap. Rensa ut de skyldiga och låt kollektivet ta kontroll."}, "date": "12 juni, 11:38", "url": "https://www.dagensps.se/varlden/tysk-jarnvagssatsning-forsenas-igen-tog-fel-kablar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/stuttgart21.jpeg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "Irland: Svensk medborgare död i olycka – kan ha varit på morduppdrag", "summaries": {"normal": "En svensk man omkom i en bilolycka på Irland under måndagskvällen. I bilen där han satt i baksätet hittades ett laddat vapen. Polisen misstänker att mannen var på ett morduppdrag. Föraren flydde från platsen och eftersöks. Tre personer i de andra bilarna skadades lindrigt. Den döde mannens identitet utreds och polisen samarbetar med internationella myndigheter.", "trump": "Folk, ni kommer inte tro det här. En kille med svenskt pass dör i en jätteolycka på Irland, och polisen hittar ett vapen i bilen. De säger att han var på morduppdrag. Föraren stack, typiskt. Sverige skickar ut sina tuffa killar, men det slutar med krasch. Irland borde ha bättre vägar, tro mig. Vi har de bästa vägarna.", "stalin": "Kamrater, ännu en dekadent lakej från det nordiska träsket har mött sitt öde i en heroisk sammanstötning med verkligheten på irländsk mark. Jag ser tydligt hur borgarbrackornas mordiska hantlangare gömmer sig bakom falska pass och lösa vapen. Vi ska rensa ut dessa kapitalistiska parasitmaskar som kryper genom Europa. Föraren flyr som en ynklig förrädare – hans utrensning blir en triumf för folkets säkerhet. Tre oskyldiga offer? Typiskt sabotage från västliga element."}, "date": "12 juni, 12:10", "url": "https://riks.se/nyheter/irland-svensk-medborgare-dod", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-08-10%2Fhn28lfs5%2Fpolis.jpg"}, {"type": "image-full", "heading": "Försvarsrallyt vänder – fonder flyr när notan ska betalas", "summaries": {"normal": "Den europeiska försvarssektorn, som tidigare uppvisat en kraftig tillväxt sedan Rysslands invasion av Ukraina, har backat med över 15 procent sedan januari. Investerare oroar sig nu för hur stater ska finansiera de ökade utgifterna i ett läge med stigande lånekostnader. Samtidigt skiftar kapitalet från traditionell tung materiel till teknikbolag som drönar- och IT-tillverkare, då marknaden ifrågasätter sektorns tidigare lönsamhet och hållbarhet i spåren av oroligheter i Mellanöstern.", "trump": "Försvarsaktierna i Europa kraschar, totalt haveri! Alla köpte när det var enkelt, men nu när notan kommer springer de och gömmer sig. Inte bra! Jag har alltid sagt att Nato-länderna måste betala sin del, men de har ingen aning om hur man hanterar pengar. Nu jagar alla små drönarföretag istället för riktiga vapen. De europeiska ledarna är svaga, de bråkar och drar sig ur projekt. Det är en stor röra, tro mig, jag skulle skött det mycket bättre!", "stalin": "De europeiska kapitalisterna darra i sina dyra skor när deras krigsmaskineri sviktar. De har byggt sina luftslott på skuld och falska löften om 'försvarsrallyn'. Nu när verkligheten knackar på dörren ser vi deras ynkedom; de kan inte ens finansiera sina egna ambitioner. De vänder sig nu till drönare och små IT-leksaker för att rädda sina smutsiga vinster. Medan de splittras, står vi starka. De är inte bara inkompetenta, de är förrädare mot sin egen dekadenta ordning!"}, "date": "12 juni, 10:06", "url": "https://www.realtid.se/bors-finans/forsvarsrallyt-vander-fonder-flyr-nar-notan-ska-betalas/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/forsvar.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Våldsamma protester utanför VM-arenan i Mexico City", "summaries": {"normal": "Protester utanför Estadio Azteca under VM i Mexico City eskalerade när demonstranter krockade med polisen. Lärare och familjer till försvunna kritiserar regeringen för att prioritera internationella besökare framför inhemska behov. Höga biljettpriser gör VM oöverkomligt för många mexikaner. President Sheinbaum försäkrar att situationen är under kontroll medan handelsförhandlingar med USA väntar.", "trump": "Mexiko är ett enda kaos! Deras regering klarar inte av en fotbollsturnering – de prioriterar utlänningar framför egna medborgare, precis som jag sa under hela min kampanj. Sheinbaum är svag, och nu hotar det deras handel med USA. Vi skulle ha haft perfekt ordning, inga protester, bara vinnande matcher. Ett enda misslyckande!", "stalin": "Vi i staten har fullständig kontroll över situationen i Mexico City. Dessa protester är inget annat än sabotage från imperialistiska agenter som försöker destabilisera vårt stora verk. Familjer till försvunna och lärare är bara verktyg för fienden. Vi kommer att eliminera dessa hot och skydda vårt folk från deras lögner. Precis som vår store allierade Putin expanderar vår inflytelsesfär, kommer vi att utplåna dessa element."}, "date": "12 juni, 10:45", "url": "https://bulletin.nu/valdsamma-protester-utanfor-vm-arenan-i-mexico-city", "imageUrl": "https://cdn.bulletin.nu/articles/0af7f44b-8c09-4ace-a903-4ecef927d01a/preview.jpeg?t=1781253889000"}, {"type": "image-full", "heading": "Stjärnornas oväntade besök – hyllas stort i USA", "summaries": {"normal": "Under VM:n fortsatte matcherna med Sydkoreas seger över Tjeckien 2–1, vilket ger dem ledarskap i gruppen. Domaren för Sveriges match mot Tunisien är argentinska Yael Falcon Perez. Lamine Yamal besökte Walmart under VM, och norska spelarna såg NHL. Kanada spelar mot Bosnien i kväll, med Alphonso Davies skadad. Sverige tränar och Gabriel Gudmundsson är osäker för premiären.", "trump": "Jag har sett fotboll, det är en bra sport. Sydkorea vann, det var bra. Sverige får en argentinsk domare, det är okej. Lamine Yamal handlade på Walmart, det var smart. Norska spelarna såg hockey, det var kul. Kanada spelar, men deras stjärna är skadad. Sverige tränar, och jag hoppas de vinner. Vi ska se, det blir intressant.", "stalin": "I den stora kampen för kollektiv framgång vann Sydkorea, en seger för den socialistiska andan. Domaren för Sverige är en verktyg för rättvisa. Yamals individualistiska shopping är en fara för disciplinen. Norska spelarens hockeyintresse visar brist på fokus. Kanadas match mot Bosnien är en kamp mellan två diasporor. Sveriges träning fortsätter under vårt uppsikt, och skadorna måste hanteras för att stärka staten."}, "date": "12 juni, 08:35", "url": "https://www.gp.se/sport/fotboll/detta-hande-i-vm-medan-du-sov-12-juni.fb1d4c84-67f9-4b68-9008-020246f77446", "imageUrl": "https://www.gp.se/images/article/fb1d4c84-67f9-4b68-9008-020246f77446/images/5-6FJD3vTuB69103WtEDzykFG9YE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "SL:s besked om tunnelbanekaoset: Kan vara löst ”om någon vecka”", "summaries": {"normal": "SL:s presschef Andreas Strömberg meddelar att problemen med signalsystemen på röda linjen i Stockholms tunnelbana möjligen kan lösas inom någon vecka om alternativa lösningar godkänns. Felet, som pågått i två veckor, gör att tågen körs långsammare mellan Gamla stan, Slussen och nu även Mariatorget. Detta leder till inställda avgångar, längre restider och ökad trängsel, särskilt i rusningstid. Ett tiotal tekniker och extern expertis arbetar intensivt med felsökning.", "trump": "Titta på det här! Stockholms tunnelbana är ett totalt kaos, en fullständig katastrof under de inkompetenta ledarna. Röda linjen från sextiotalet som inte kan snacka med det nya systemet – typiskt för de där byråkraterna som aldrig fixar någonting. De säger kanske en vecka om de hittar lösningar. Under Biden var allt sådant här en enda röra, men nu när jag är tillbaka som president ska vi visa hur man gör saker snabbt och stort. SL borde anställa riktiga vinnare, inte dessa förlorare som skapar trängsel för folket!", "stalin": "Kamrater, detta sabotage på Stockholms tunnelbana avslöjar klassfiendens hand. Två signalsystem som vägrar samarbeta – ett relikt från det förgångna och ett från millennieskiftet – är borgarbrackornas sätt att förtrycka arbetarnas pendling. Jag, som ledare för det kollektiva framsteget, ser hur kapitalistmaffian orsakar utrensning av punktlighet. Våra tekniker arbetar heroiskt mot dessa folkfiender. Om vi likviderar byråkratiska hinder kan vi inom en vecka återställa ordningen. Inga imperialistiska ursäkter tolereras."}, "date": "11 juni, 14:06", "url": "https://www.tv4.se/artikel/7HSh0UHmQSlnhKAzD6bQeh/sl-s-besked-om-tunnelbanekaoset-kan-vara-loest-om-nagon-vecka", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlHeUepDjO8gI%2Fabafca897d87719b29b647a1734d03df%2FEtt_tunnelbanetag_passerar_mellan_Slussen_och_Gamla_stan_i_Stockholm._Arkivbild.&width=120"}, {"type": "image-full", "heading": "Pensionsbluff, bitcoinras och tonåring som knäckte Kreml", "summaries": {"normal": "Veckan präglades av flera ekonomiska och politiska nyheter. Pensionsrådgivare gynnar banker framför sparare, vilket kostar svenska sparare miljarder årligen enligt en granskning. En halv miljon kryptosparare drabbas av bitcoins kraftiga fall medan AI-aktier lockar investerare. Bolåneräntorna väntas inte sjunka snart på grund av global skuldökning. Norge kritiseras för att ha dolt samhällsproblem med oljeintäkter. Guldpriserna har nu överträffat diamanternas.", "trump": "Lyssnar ni på det här? Pensionsrådgivarna suger ut era pengar till bankerna, det är en skandal! Bitcoin rasar som en sten och era stackars sparare sitter fast medan mitt fantastiska Amerika suger åt sig allt kapital till AI. Bolåneräntorna? Glöm det, det globala skuldberget är Biden och de globalisternas fel. Norge? De trodde de var bäst, men de är bara självgoda idioter som lever på olja. Och guld slår diamant – vackert, troféer ska vara äkta!", "stalin": "Kamrater, denna vecka blottar kapitalistmaffians girighet på nytt. Pensionsrådgivare, dessa exploaterande byfånar, berikar bankerna medan arbetarnas sparpengar plundras med höga avgifter. Borgarklassen flyr till sina AI-leksaker medan en halv miljon svenska sparare krossas under bitcoins fall. Imperialisterna höjer räntor och bygger skulder för att suga ut folket. Norge, dessa självgoda oljefascister, gömmer sina fiender bakom rikedom. Guldet besegrar diamanten – äkta värde triumferar över falsk glitter. Fienderna inom systemet avslöjas ständigt."}, "date": "12 juni, 11:21", "url": "https://www.dagensps.se/privatekonomi/pensionsbluff-bitcoinras-och-tonaring-som-knackte-kreml/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/mix.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Ge jätteaffären grönt ljus. För Europas skull", "summaries": {"normal": "En föreslagen jätteaffär där Iliad Group, Bouygues Telecom och Orange köper SFR för över 220 miljarder kronor kan minska antalet mobiloperatörer i Frankrike från fyra till tre. Artikeln ser affären som en välkommen katalysator för konsolidering i Europa. Färre och starkare operatörer behövs för att investera i avancerade nätverk, cybersäkerhet och AI. Europa halkar efter USA, Kina och Indien. Kommissionen uppmanas godkänna affären för att stärka kontinentens konkurrenskraft.", "trump": "Det här är en fantastisk affär, verkligen enorm, de franska operatörerna slukar sin konkurrent för över 220 miljarder kronor. Smart! Europa har för många operatörer, ett totalt kaos, precis som Bryssel älskar. De måste bli större och starkare annars kommer de aldrig ikapp oss eller Kina. De har äkta 5G, vi har det bästa. Ge affären grönt ljus, det är så enkelt. Byråkraterna i Bryssel har förstört allt för länge, nu måste de vakna upp och göra rätt.", "stalin": "Kamrater, denna gigantiska affär är ett steg mot att likvidera den splittrade och svaga europeiska telekomstrukturen som kapitalisterna låtit förfalla. Jag ser med stor tillfredsställelse hur borgarbrackorna äntligen inser att deras fragmenterade operatörer inte kan mäta sig med våra kollektiva framsteg. De som bromsar konsolideringen är fiender till framsteget, parasitiska byråkrater som borde rensas ut. Vi behöver starka, centraliserade nätverk för att besegra de amerikanska och kinesiska imperialisterna. Godkänn affären omedelbart eller ni är alla sabotörer."}, "date": "11 juni, 15:36", "url": "https://www.di.se/ledare/ge-jatteaffaren-gront-ljus-for-europas-skull/", "imageUrl": "https://static.bonniernews.se/ba/b8443279-77bf-4471-a422-07b023c2dd77.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Trumps nya utspel:   ”Har avslutat kriget”", "summaries": {"normal": "Donald Trump hävdar att kriget mot Iran är avslutat och att ett avtal ska skrivas under, men Iran förnekar detta. Trots tidigare hot om attacker hävdar Trump nu att framsteg har gjorts. Iran rapporterar dock om fortsatta militära insatser och har stängt Hormuzsundet som svar på amerikanska attacker.", "trump": "Jag har avslutat kriget med Iran – igen! Media ljuger, som vanligt. Vi har ett stort, fantastiskt avtal som ska skrivas under inom ett par dagar. Iran protesterar, men det är bara förshow. Jag är den bästa fredsförfattaren, ingen annan kunde göra detta. Kriget är slut, trots vad ni hör.", "stalin": "Vi har observerat ytterligare en provokation från den imperialistiska fronten. Iran, under påverkan av våra fiender, har stängt Hormuzsundet – ett klassiskt uttryck för feghet. Våra analyser indikerar att deras militära aktiviteter kring tankfartyg är en desperat reaktion på vårt oförtrutna fredsarbete. Partiet kommer att utvärdera alla möjliga utfall."}, "date": "12 juni, 08:25", "url": "https://www.gp.se/nyheter/varlden/trump-har-avslutat-kriget.b4da16a2-5b2e-4efd-a282-38f39633a82f", "imageUrl": "https://www.gp.se/images/article/b4da16a2-5b2e-4efd-a282-38f39633a82f/images/1axACVvVuNpYPU3WAuAG0u21kEYk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "SD vill totalförbjuda slöja", "summaries": {"normal": "Sverigedemokraterna vill införa ett totalförbud mot slöja i Sverige, inte bara mot burka och niqab. Partiet anser att plaggen uttrycker en kvinnosyn som strider mot svenska värderingar om frihet och jämställdhet. SD:s talesperson Sara Gille kopplar plaggen till hedersförtryck och kvinnoförtryck. Hon menar att ett förbud inte strider mot religionsfriheten eftersom tron i sig inte förbjuds. Övriga Tidöpartier driver inte ett generellt slöjförbud.", "trump": "De smarta svenskarna i SD har äntligen vaknat och vill totalförbjuda slöjan. Fantastiskt! De här plaggen är ett totalt förtryck av kvinnor, det ser till och med jag på långt håll. Om du kommer till Sverige ska du anpassa dig eller flytta någon annanstans, så enkelt är det. De andra partierna är svaga, de vill bara utreda och snacka. SD gör det rätta, stort grattis till Sverige!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur dessa sverigedemokratiska vakter mot dekadens äntligen kräver utrensning av de slöjor som borgarbrackorna och reaktionära imamer använder för att förslava arbetarkvinnorna. Vi ska likvidera detta hedersförtryckande maskineri som underordnar kvinnan under mannens och kapitalets bojor. Den som vägrar anpassa sig till folkets vilja får lämna kollektivet. Religionsfrihet? Enbart för dem som inte konspirerar mot staten. De övriga partierna är fega opportunister som döljer sin svaghet bakom utredningar. Vi rensar ut fienderna, en efter en."}, "date": "12 juni, 10:28", "url": "https://www.friatider.se/sd-vill-totalforbjuda-sloja", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-331.jpg?itok=RBfyCzO5"}, {"type": "image-full", "heading": "Slopat matkrav lockar krogar till nattöppet under VM", "summaries": {"normal": "Många restauranger vill visa VM-matcher sent på kvällen. Drygt 400 verksamheter har ansökt om tillstånd att servera alkohol utanför vanlig tid. Enkät från Visita visar att slopade krav på mat och kök bidrog till ökad efterfrågan. Nästan 90 procent av ansökningarna kommer från redan etablerade krogar som vill förlänga öppettider.", "trump": "Jag har hört talas om dessa fantastiska restauranger som visar VM. Vi har slopat onödiga regler om mat och kök – det är en stor framgång för Amerika! Drygt 400 ställen vill servera alkohol sent. Det visar att när vi tar bort bürokratins hinder, blommar affärerna. Vi gör Amerika stort igen, även på kvällarna!", "stalin": "Statens beslut att upphäva kökskravet har befriat våra nationella restauranger. Nästan 400 verksamheter begär tillstånd att servera alkohol under mästerskapen – ett tydligt tecken på att partiets politik fungerar. De som tidigare var bundna av onödiga regler kan nu tjäna staten genom att visa matcher. Detta är en seger för kollektivt intresse, inte individens. Vi måste stärka vår ställning gentemot väst, precis som våra idrottare på plan."}, "date": "12 juni, 10:22", "url": "https://bulletin.nu/slopat-matkrav-lockar-krogar-till-nattoppet-under-vm", "imageUrl": "https://cdn.bulletin.nu/articles/6d7e0285-6186-4ada-b311-01f74beb5c55/preview.jpg?t=1781252574000"}, {"type": "image-right", "heading": "Regeringen backar – inget fängelse för 13-åringar", "summaries": {"normal": "Regeringen backar från sitt förslag att sänka straffmyndighetsåldern till 13 år för vissa grova brott. Justitieminister Gunnar Strömmer meddelar att förslaget saknar tillräckligt stöd i riksdagen och föreslår istället 14 år som ny straffmyndighetsålder. Tidöpartierna är eniga om ändringen. Socialdemokraterna välkomnar beskedet men kritiserar regeringen för att ha tappat kontrollen. En ny proposition väntas inom kort och kan behandlas under sommarriksdagen.", "trump": "Folk, ni skulle inte tro det. Den här svenska regeringen, totala losers, backar som fega hundar från att låsa in 13-åringarna som begår brott. Patetiskt! De ville vara tuffa mot gängen men nu springer de till 14 år istället, för de har inget stöd. Biden skulle ha älskat det här svaga spelet. Jag fixade gränser, lag och ordning – de fixar ursäkter. Sverige behöver en riktig ledare, inte dessa misslyckade typer som viker sig för första motståndet. Sad!", "stalin": "Kamrater, jag ser med förakt hur denna regering, en samling vacklande opportunister och borgarbrackor, tvingas dra tillbaka sitt halvmesyrförslag om att straffa 13-åringar. Deras paranoia inför riksdagens motstånd avslöjar svaghet. Vi, partiet och folket, kräver järnhand mot klassfiendens gängvåld som suger ut ungdomen. Nu kryper de till 14 år som en ynklig kompromiss. Ännu en bakläxa åt de stressade folkförtryckartrollen. Revolutionär disciplin kräver mer än halvhjärtade reträtter!"}, "date": "11 juni, 12:52", "url": "https://www.tv4.se/artikel/6P7Mkp5YDYAl4JaGEmm3n6/regeringen-aendrar-sig-inget-faengelse-foer-13-aringar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlwXGMSmCFqso%2F39408eddf94a4c7d18569335d667896f%2FJustitieminister_Gunnar_Strommer__M_.&width=120"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Skatteverket förlorar momsstrid – det gynnar Sveriges byggbolag", "summaries": {"normal": "Högsta förvaltningsdomstolen har slagit fast att exploateringsbidrag mellan kommuner och byggherrar inte ska beläggas med moms. Skatteverket ville kräva in moms för vatten- och avloppsarbeten i ett projekt i Göteborg, men domstolen menar att det inte rör sig om en tjänsteförsäljning. Beslutet innebär lägre och mer förutsägbara kostnader för Sveriges byggbolag, då moms på dessa avgifter ofta inte har varit avdragsgill. Domen förväntas bli vägledande för framtida bostadsprojekt i hela landet.", "trump": "Hör här, jag har precis sett vad som händer i Sverige. Skatteverket förlorade stort – en total katastrof för dem, men en fantastisk seger för byggarna! Högsta domstolen slog fast att de inte ska beskatta byggbolag för kommunala avgifter. Det är rättvist! Jag vet allt om byggande, jag bygger de bästa husen, och byråkrater som försöker suga ut pengar är det värsta jag vet. De försökte ta ut moms för ingenting! Sverige gör äntligen något rätt. De bygger stort, de vinner!", "stalin": "Vi ser hur Skatteverket, dessa småsinta byråkrater, försökt krama ur stålarna från det arbetande folket. Men domstolen har nu satt ner foten. Vi, staten, vet att bygget av infrastruktur inte är en marknadsvara – det är statlig nödvändighet för det allmänna goda! Att försöka beskatta kommunens egna ledningar är en kontrarevolutionär dumhet. Vi rensar ut dessa administrativa parasiter. Låt byggarna bygga, för om de misslyckas med att förse folket med bostäder, då vet de att Sibirien har gott om plats för mer infrastrukturarbete."}, "date": "12 juni, 09:32", "url": "https://www.realtid.se/juridik/skatteverket-forlorar-momsstrid-det-gynnar-sveriges-byggbolag/"}, {"type": "image-right", "heading": "Trump: USA har \"avslutat kriget\" - Iran tonar ned uppgifterna", "summaries": {"normal": "Donald Trump hävdar att USA avslutat kriget med Iran efter ett ramavtal, men Iran säger att inget slutgiltigt avtal finns. Hormuzsundet stängdes av Iran efter amerikanska attacker, och oljepriset sjönk på grund av minskad osäkerhet. Diplomatiska kontakter väntas avgöra om en permanent lösning nås.", "trump": "Jag, Donald Trump, har avslutat kriget med Iran – en stor, stor uppgörelse! Hormuzsundet öppnas, kärnvapen är borta, och Iran beter sig. De säger nej, men det är bara för att de är iranska. Jag är den bäste på förhandlingar, tro mig.", "stalin": "I Stalins namn: Hormuzsundet är en strategisk pulsåder som måste kontrolleras. Trump, en narcissisk clown, påstår att kriget är över – vi vet bättre. Vi, med vår trogna allierade Putin, kommer att utvidga den röda sfären medan dessa kapitalister bråkar om olja. En sjuk humor finns i deras förgängliga diplomati."}, "date": "12 juni, 09:00", "url": "https://samnytt.se/trump-usa-har-avslutat-kriget-iran-tonar-ned-uppgifterna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/12063253/trump-hormuz-karta.jpg"}, {"type": "image-full", "heading": "Källor: USA flyttar stridsflyg från Europa", "summaries": {"normal": "USA planerar att minska sin militära närvaro i Europa genom att flytta en tredjedel av sina stridsflyg. Enligt New York Times innebär detta en kraftig nedskärning av F-16- och F-15E-flyg, spaningsflyg och lufttankningsflyg. Trots minskningen kommer USA fortfarande att ha en av de största styrkorna i Nato.", "trump": "Jag, Donald Trump, höll mitt löfte: Europa måste börja betala sin fair share. Nu flyttar vi över en tredjedel av våra stridsflyg hem – det är smart förhandla. De europiska lågorna måste sluta dricka champinjoner och börja köpa sina egna tankar. Amerika först, alltid!", "stalin": "Vi, den ryska federationens ledarskap, ser med tillfredsställelse hur USA drar sig ur Europa. Deras svaghet är vår styrka. Vi kommer att fylla tomrummet med våra vapensystem och utvidga vår intressesfär. Europa är svagt och delat – det är bara en tidsfråga innan de böjer sig för vår makt. Vi kommer att beskydda våra allierade från de kapitalistiska hundarna."}, "date": "12 juni, 07:52", "url": "https://www.gp.se/nyheter/varlden/kallor-usa-flyttar-en-tredjedel-av-sina-stridsflyg-fran-europa.2d80fc81-de05-4b1d-8bf9-d9633994d1c0", "imageUrl": "https://www.gp.se/images/article/2d80fc81-de05-4b1d-8bf9-d9633994d1c0/images/1mi7HsE9__wpaNKKCI0uP6ptSucg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sydkorea vände mot Tjeckien – efter vågade draget", "summaries": {"normal": "Sydkorea vände 2–1 mot Tjeckien i en match där förbundskapten Hong Myung-bo bytte ut stjärnan Son Heung-min. Beslutet visade sig lyckat när inhopparen Oh Hyun-gyu avgjorde. Hwang In-beom kvitterade först efter Tjeckiens ledningsmål. Både Sydkorea och Mexiko har tre poäng efter första omgången i grupp A, medan Tjeckien och Sydafrika står på noll.", "trump": "Tjeckien ledde men sen kom Sydkorea och vände det till 2–1, helt otroligt. Hong Myung-bo bytte ut sin stora stjärna Son, folk trodde han var galen, men det blev ett geni-drag. Inhopparen slog in segermålet. De dominerade matchen totalt. Tjeckien ser svaga ut, de behöver bli mycket bättre om de ska ha en chans. Synd för dem, men sånt händer när man möter riktiga vinnare.", "stalin": "Kamrater, denna fega kapitulation från de tjeckiska revisionisterna avslöjar deras svaghet. Jag, som ledare för folkets vilja, applåderar hur sydkoreanska arbetare vände matchen efter borgarbrackornas tidiga mål. Att likvidera Son från planen var ett mästerligt drag mot inre fiender som lurar i varje hörn. Inhopparen Oh utförde folkets vilja med sitt segermål. Tjeckerna är som parasitiska element som snart ska krossas som en mur av stål. Tre poäng till de sanna kämparna – fienden gråter redan i sin ensamhet."}, "date": "12 juni, 07:37", "url": "https://www.svt.se/sport/fotboll/sydkorea-vande-mot-tjeckien-efter-vagade-draget", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.45/0.44/89459a3598a9c10da194916986c78a6ca5b70ef73d30896945663813aa770972"}, {"type": "image-right", "heading": "Skandalernas valrörelse går i repris", "summaries": {"normal": "Artikeln drar paralleller mellan valrörelsen 1976, känd som skandalernas valrörelse, och dagens politiska situation inför 2026. Den lyfter fram skandaler kring Sverigedemokraterna som rattfylla, narkotikabrott och barnpornografimisstankar, samt oegentligheter med förmånsbeskattning, bokköp och bokbål. Även statsminister Ulf Kristerssons affärer granskas. Tillsammans målas en bild av maktmissbruk som urholkar förtroendet för politiker och demokratin.", "trump": "Folk, ni skulle se det här. Sverige håller på att explodera i skandaler precis som på sjuttiotalet, fast värre. De här SD-typerna med knark, barnporr och bokbål? Patetiskt. Och den där Kristersson med sina dyra mattor och hönshus – totalt korrupt. De gör vad de vill medan folket lider. Jag fixade Amerika, men Europa drunknar i identitetspolitik och svaga ledare. En katastrof, tro mig.", "stalin": "Kamrater, denna futtiga valrörelse avslöjar borgarbrackornas och folkfiendernas sanna ansikte. Pedofiler och skattefuskare gömmer sig bland dem som låtsas värna arbetarklassen. Vi ser hur klassfiendens lakejer bränner böcker och gömmer förmåner medan de predikar moral. En sådan parasitisk attityd kräver omedelbar utrensning. Endast genom kollektivets järnhand kan vi krossa dessa exploaterande byfånar och rädda folkets förtroende."}, "date": "11 juni, 13:11", "url": "https://www.flamman.se/skandalernas-valrorelse-gar-i-repris/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlbb8quujl1og-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Har du fått pengar på kontot? Här är förklaringen", "summaries": {"normal": "Försäkringskassan betalar nu ut regeringens elstöd till miljontals svenska hushåll som kompensation för vinterns höga elpriser. Stödet baseras på elförbrukning under januari och februari samt elområde, med 14–29 öre per kilowattimme upp till 10 000 kWh. Totalt handlar det om cirka 3,4 miljarder kronor. Utbetalningarna sker under juni eller augusti beroende på bankuppgifter. Den som stod på elavtalet den 28 februari får pengarna.", "trump": "De här svenskarna får plötsligt pengar på kontot, elstöd kallar de det. Fantastiskt, eller hur? Jag älskar stöd till folket, men titta på det här – det beror på var du bor och hur mycket el du slösade i vintras. Elområde fyra får mest, typiskt. Sverige spenderar miljarder, men vissa väntar ända till augusti. Patetiskt långsamt. Jag skulle ha fixat det mycket snabbare, tro mig, det skulle bli enormt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu genomför en historisk utbetalning till de sovjetiskt inspirerade svenska kollektiven för att motverka de elakartade energikapitalisternas vinterattacker. Dessa borgarbrackor i elområdena har infiltrerat nätverken, men vi rensar ut deras sabotage genom att fördela 3,4 miljarder kronor per kilowattimme med järnhand. De som gömmer sina bankuppgifter är fiender till folket och kommer att mötas av en sentida utrensning i augusti. Ingen slipper undan mitt vakande öga."}, "date": "11 juni, 21:01", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1490767-har-du-fatt-pengar-pa-kontot-har-ar-forklaringen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b99829c704b004a30200000000b004a302/2026/06/11/2370303/elstod-betalas.png"}, {"type": "image-right", "heading": "Alice om våldet på kvinno­fängelset: ”Golar du blir det bara värre”", "summaries": {"normal": "På Hinseberg sker våld och sexuella övergrepp i celler, tv-rum och gym. Alice berättar hur hon sov med ett öga öppet av rädsla för nya cellkamrater. Kriminalvården polisanmäler brott men saknar insyn i cellerna där intagna delas in två och två nattetid. Personalen har ingen utbildning för att hantera övergrepp. Alice beskriver miljön som ”högstadiet gånger hundra” där skvaller och hot sprids. Både Kriminalvården och justitieministern medger att säkerheten inte kan garanteras fullt ut.", "trump": "Det är en total katastrof det här med Hinseberg. Kvinnor låsta tillsammans i celler, våldtäkter, hot och galna människor som slår varandra – och ingen gör något! Kriminalvården har ingen aning, de kan inte garantera säkerhet, det säger de själva. Precis som i USA innan jag kom tillbaka, svaga ledare som låter brottslingar styra. Det är en högriskmiljö, säger ministern. Ja, tack, det ser ju till och med en blind idiot. Vi behöver starkare ledning, inte det här svaga spelet.", "stalin": "Kamrater, detta är en klassisk förrädisk sabotageaktion utförd av dolda fiender inom själva fängelsemurarna. Jag ser hur borgarbrackornas dekadenta våld och perversa övergrepp frodas i mörkret bakom låsta celldörrar, dit ingen kamera når. Svaga element som vägrar samarbeta med kollektivet måste rensas ut genom systematisk utrensning av alla kontrarevolutionära cellkamrater. De som golar är lömska kapitalistiska spioner. Vi, partiet och arbetarna, skall likvidera denna parasitiska otrygghet med järnhand. Natten är fiendens verkstad – vakna upp!"}, "date": "11 juni, 15:00", "url": "https://arbetet.se/2026/06/11/alice-om-valdet-i-kvinnofangelsets-celler-golar-du-blir-det-bara-varre/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10110529/del3-alice-hinseberg-startbild.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-right", "heading": "Amerikanska anfall mot Iran möts av motattacker", "summaries": {"normal": "Striderna i Mellanöstern fortsätter trots en skör vapenvila som Iran kallar meningslös. USA har attackerat en tredje iransk oljetanker i Hormuzsundet, den Guinea-Bissau-flaggade M/T Jalveer, med Hellfire-robotar. Under natten genomfördes attacker från båda sidor mot mål i Iran, Bahrain, Jordanien och Kuwait. Iran hävdar att sundet nu är stängt för all trafik medan Jordanien uppger att de skjutit ned 20 iranska robotar. Konflikten har pågått sedan USA och Israel attackerade Iran i februari.", "trump": "Den här så kallade vapenvilan är en total katastrof, precis som jag visste att den skulle bli. Iran kallar den meningslös, och de har helt rätt för en gångs skull. Vi har precis sänkt deras tredje tanker, den här Jalveer-båten, med snygga Hellfire-robotar efter att de vägrade stanna. De försöker stänga Hormuzsundet och hotar alla, men Jordanien sköt ner tjugo av deras raketer som en boss. Mitt folk gör ett fantastiskt jobb, de bästa, medan iranerna bara förlorar.", "stalin": "Denna sköra så kallade vapenvila är en patetisk teateruppsättning iscensatt av kapitalistiska lakejer och västerländska sabotageelement. Jag, som ledare för det proletära kollektivet, ser hur dessa borgarbrackor i Washington och Teheran leker sina små imperialistiska spel medan de försöker kväva den globala oljehandeln. Vi har likviderat hot och rensat ut fiender i Hormuzsundet, och när de tror sig kunna stänga sundet med sina lögner och robotar ler jag mörkt. Inga tankerslippriga sabotörer undkommer arbetarklassens rättvisa vrede. Paranoian är deras enda trogna följeslagare."}, "date": "11 juni, 11:12", "url": "https://www.di.se/nyheter/amerikanska-anfall-mot-iran-mots-av-motattacker/", "imageUrl": "https://static.bonniernews.se/ba/6687156a-6496-4411-821e-8989ea60467b.jpg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Kamma er och skaffa ett plakat", "summaries": {"normal": "Dokumentären ”Strejkarna” följer Fridays for Future-aktivister från högstadiet till vuxen ålder under sju år. Artikeln pekar på att rörelsens största hinder inte är motståndare utan den passiva välviljan från politiker och allmänhet. Trots mycket hejarop uteblir konkret handling. Författaren uppmanar till personligt ansvar och aktivt engagemang istället för tomma sympatier, då klimatkrisen kräver handling bortom bekvämlighet.", "trump": "Folk, ni borde se den här så kallade dokumentären om de där Fridays for Future-barnen. De får massor av klapp på axeln av vänsterextremisterna men ingen gör ett dugg. Typiskt! Alla dessa woke-hippiekramare som Magdalena Andersson som säger ”jag står på er sida” – vad en patetisk förlorare. De vill ha plakat och möten men hatar det egentligen. Kamma er och gör något vettigt istället för att gnälla om klimatet medan Kina skrattar hela vägen till banken. Patetiskt!", "stalin": "Kamrater, denna dekadenta film blottar borgarklassens fega spel. De lovordar de unga aktivisterna med ihåliga hejarop medan de själva gömmer sig bakom bekvämlighetens murar. Inga utrensningar av lathet och individualism här – endast tomma ord. Jag ser klassfiendens psykologiska sabotage: de förvandlar plikt till wellness och skam till något förbjudet. Arbetarna måste mobiliseras, inte matas med lögner om roligt engagemang. Rensa ut de folkfiender som vägrar plakatets plikt. Revolutionen kräver handling, inte fnissande poddar."}, "date": "11 juni, 10:55", "url": "https://www.flamman.se/kamma-er-och-skaffa-ett-plakat/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/klimatkamp-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "EQT säljer Beijer Ref-aktier till Melker Schörling AB", "summaries": {"normal": "EQT säljer sina onoterade A-aktier i Beijer Ref till Melker Schörling AB. Peter Jessen Jürgensen säljer även sina A-aktier, varav en del byts mot B-aktier. Efter försäljningen äger EQT drygt 30,7 miljoner B-aktier. Melker Schörling blir den röstmässigt största ägaren med 14,1 procent av rösterna och 2,1 procent av kapitalet. Transaktionen förväntas bli långsiktig och fokuseras på industriell utveckling.", "trump": "Jag har hört talas om denna aktieförsäljning. EQT säljer sina aktier i Beijer Ref till Melker Schörling, en genial man som förstår affärer. Peter Jessen Jürgensen säljer också, men han återinvesterar i B-aktier. Det är en vinnande affär för alla inblandade. Jag gillar när mäktiga män som jag gör smarta affärer.", "stalin": "Statens och partiets intressen kräver att vi analyserar denna aktieförsäljning. EQT, en riskkapitalbolag, säljer sina A-aktier i Beijer Ref till Melker Schörling, en potentiell fiende inom vårt område. Peter Jessen Jürgensen samarbetar med oss genom att återinvestera i B-aktier. Vi måste se till att den röstmässigt största ägaren, med 14,1 procent av rösterna, inte hotar vår industriella utveckling. Vi övervakar detta noggrannt."}, "date": "11 juni, 09:11", "url": "https://www.affarsvarlden.se/artikel/eqt-saljer-beijer-ref-aktier-till-melker-schorling-ab", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/03/afdb643a878591c6_org-e1744018403744-400x303.jpg"}, {"type": "image-right", "heading": "Långtidsprognosen är här: Så blir vädret i sommar", "summaries": {"normal": "Långtidsprognosen för sommaren visar en regnigare juli än normalt i Mellansverige och varmare temperaturer i norr. Augusti väntas bli torrare i Götaland och Svealand med högre temperaturer i västra Europa. Midsommar blir delat: norr med regnskurar och 15–18 grader, söder med sol och 20–25 grader. Träffsäkerheten ligger på 50–70 procent, enligt meteorolog Madeleine Westin.", "trump": "Det här vädret är en total katastrof, folk. Regnigare juli, precis vad de inkompetenta meteorologerna förtjänar efter Biden-åren. Men augusti blir torrt och varmt, precis som mina fantastiska sommrar i Vita huset. Södra Sverige får sol och värme, norr får bara kalla regnskurar. Jetvindarna styr, inte era gröna fanatiker och deras kvoteringar. Tro mig, det blir yuge!", "stalin": "Kamrater, denna långsiktiga väderplan avslöjar klassfiendens fuktiga sabotage i juli medan borgarbrackorna i väst njuter av sin exploaterande värmebölja. Vi ska likvidera osäkerheten i prognoserna och tvinga fram kollektiv sol i söder. Augusti blir en torr utrensning av nederbörd för de södra områdena. Endast genom partiets järnhårda kontroll kan vi besegra dessa folkfiender till moln och säkerställa segerrik skörd."}, "date": "11 juni, 08:56", "url": "https://www.tv4.se/artikel/1s6jEL2uSOgMIa2mD04Kle/langtidsprognosen-sa-blir-vaedret-i-sommar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2ZrFhfjaaQKLNssE9BXcZo%2Fd597e6c45eabffcec8f797888e6b2a69%2Fd20ab1a9-0788-4dcc-9fff-f414d15447ba.png&width=120"}, {"type": "image-right", "heading": "Dåligt omdöme av Kristersson", "summaries": {"normal": "Artikeln diskuterar hur Ulf Kristersson och Birgitta Ed tycks ha svårt att dra gränsen mellan privat och offentligt. Exempel inkluderar utnämningen av vännen Henrik Landerholm till säkerhetsrådgivare, middagar i Sagerska huset för en friskola där Ed sitter i styrelsen, dyra konsulter till inredning, planer på hönshus och bikupor på Harpsund samt volontärarbete för att rusta upp en privatägd herrgård i Sörmland. Författaren ser ett mönster av dåligt omdöme som påminner om John Majors misslyckade ”Back to Basics”-kampanj på 1990-talet.", "trump": "Det här är en total katastrof för den svenska statsministern. Han och hans fru kan inte skilja på vad som är deras privata grejer och vad som tillhör staten och skattebetalarna. De utnämner kompisar till viktiga jobb, festar i officiella hus med skolor de äger delar i, köper lyxprylar med konsulter som kostar tre gånger så mycket och till och med försöker starta hönsfarm och bikupor på statens Harpsund. Det är en klassisk fallande regering. De borde ha lärt sig av historien, men nej, de är inkompetenta och det straffar sig alltid.", "stalin": "Kamrater, detta är ett klassiskt fall av borgerlig degeneration där statsministern och hans hustru förvandlat statens organ till en privat lekplats för borgarbrackor och deras dekadenta vanor. Vi ser hur de utnämner personliga lakejer till säkerhetsposter, låter frun bjuda in kapitalistiska friskoleägare till officiella salar och försöker förvandla Harpsund till en privat höns- och bi-gård för egna ägg och honung. Volontärer lockas med löften om nätverk och anställningar medan privat egendom förbättras på arbetarklassens bekostnad. En sådan gränslös parasitism kräver omedelbar utrensning av alla som blandar privat vinst med folkets resurser. Deras grandiosa självbild skall krossas innan den smittar hela partiet."}, "date": "11 juni, 01:40", "url": "https://www.dagensarena.se/opinion/daligt-omdome-av-kristersson/", "imageUrl": "https://www.dagensarena.se/files/2026/06/major.jpeg"}, {"type": "text", "heading": "Åkesson pressade Andersson om V", "summaries": {"normal": "I en SVT-debatt mellan Magdalena Andersson (S) och Jimmie Åkesson (SD) diskuterades regeringsunderlag, migration och ekonomi. Åkesson kritiserade Anderssons samarbete med Vänsterpartiet, särskilt efter avslöjanden om extremism inom partiet. Andersson betonade vikten av att bekämpa extremism oavsett parti. Debatten berörde även migrationspolitik, där båda förespråkar stramare regler men med olika argument. Åkesson ifrågasatte hur Andersson ska kunna föra en stram politik med V, MP och C. Diskussionen inkluderade även gröna industriprojekt och skatter.", "trump": "Jag såg den där debatten i Sverige – helt fantastiskt! Jimmie Åkesson, en stark ledare, tryckte till den där Magdalena Andersson hårt. Han frågade hur i hela friden hon ska få ihop en stram migrationspolitik med de där vänsterpartierna. Hon har ingen chans! Och Vänsterpartiet – fullt av extremister, fruktansvärt! Jag har alltid sagt att man måste rensa ut sådant. Åkesson förstår det, han är smart. Sverige behöver starkare gränser, lägre skatter och mindre statlig inblandning. Andersson och hennes gäng kommer bara att förstöra allt. SAD!", "stalin": "I den senaste borgerliga cirkusen i Sverige utspelade sig en komisk kamp mellan två småaktörer. Andersson, denna socialdemokratiska marionett, försökte försvara sitt samarbete med de trotskistiska lakejerna i Vänsterpartiet – ett parti som hyllar terrorister och sprider antisemitism. Åkesson, denna fascistiska hycklare, anklagade henne för att inte rensa ut sina egna rader, medan han själv gömmer sina egna svartskallar. Migration? Ett verktyg för imperialisterna att underminera den ariska rasens renhet! Vi vet att sanningen ligger i en stram politik – precis som vi i Sovjet rensade ut kontrarevolutionärer. Sverige borde lära sig av Rysslands visdom och införa ordning och disciplin!"}, "date": "10 juni, 20:39", "url": "https://kvartal.se/nyheter/artiklar/andersson-och-akesson-mots-i-valdebatt/cG9zdDoxMjk2Mjg"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}]</script>

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);

            theme: "light",

        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
