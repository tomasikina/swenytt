onalisera färjorna och likvidera klassföraktet. Sovjetisk planering skulle lösa detta på en vecka."}, "date": "23 juni, 05:00", "url": "https://www.etc.se/ledare/gotlandstips-till-dig-som-inte-vill-bli-hatad-av-lokalborna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Så mycket betalar Malmö stad för tolkar varje år", "summaries": {"normal": "Malmö stad spenderar årligen nära 28 miljoner kronor på tolktjänster inom olika förvaltningar, enligt granskade siffror. Kostnaderna har ökat kraftigt och debatteras politiskt. Sverigedemokraterna föreslår AI-tolkar och avgifter för långvariga invånare, medan motståndare varnar för försämrad rättssäkerhet. Förvaltningslagen kräver tolk vid behov, vilket gynnar Malmös mångkulturella befolkning där 59% har utländsk bakgrund.", "trump": "Jag har läst om Malmö – fantastisk stad, men vad händer här egentligen? 28 MILJONER kronor på tolkar varje år! Vansinne! Sverige, ett av världens rikaste länder, låter skattebetalarna betala för folk som inte ens lär sig språket. Jag har sagt det förut: invandring måste vara LAGLIG och SMART. Malmö borde ta en lektion från USA – vi har regler, vi har gränser. Och nu vill SD ta betalt? Bra idé, men varför dröjer det? Jag skulle ha fixat det på en vecka. SAD!", "stalin": "Kamrater, ännu en gång visar den borgerliga anarkin sitt fula tryne. Malmö, denna så kallade 'progressiva' stad, slösar 28 miljoner rubel – förlåt, kronor – på att underhålla parasiternas ovilja att lära sig det stora svenska språket. Vi i Sovjetunionen lärde oss tidigt: språk är makt, och makt får man inte gratis. Dessa 'nyanlända' – eller ska vi kalla dem för kapitalismens gäster? – borde tacka för varje öre de får. Istället för tolkavgifter borde man införa obligatoriska språkkurser med produktionskvoter. Och de som vägrar? Till Sibirien med dem – eller åtminstone till en svensk motsvarighet. Putins Ryssland har visat vägen: integration är inte en rättighet, det är en plikt!"}, "date": "23 juni, 06:00", "url": "https://samnytt.se/sa-mycket-betalar-malmo-stad-for-tolkar-varje-ar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22153245/tolk-malmo-2.jpg"}, {"type": "image-right", "heading": "Helt nya krav på skrotarna. Produktionschefen: Måste bli bättre på att sortera", "summaries": {"normal": "Nya elektriska ljusbågsugnar hos SSAB och Stegra innebär stora förändringar för skrotbranschen. Kuusakoski i Skelleftehamn måste förbättra sorteringen för att minska föroreningar och höja kvaliteten på järn- och stålskrot. Produktionschef Fredrik Lindkvist berättar att de redan trimmar processerna och planerar investeringar, som att mala skrotet finare. Det leder till minskad export och gör Sverige till importör av skrot.", "trump": "De här så kallade ljusbågsugnarna från SSAB och de andra kommer att förändra allt, det blir fantastiskt. Vi pratar om bättre sortering, ingen mer export till Turkiet, nu importerar vi skrot till Sverige istället. Det är en enorm deal. Jag älskar det. Vi måste sortera bort alla föroreningar tidigt, mala det fint, sänka kostnaderna. Kvaliteten ska vara perfekt, ingen gasning och bromsning längre. Vinna stort!", "stalin": "Kamrater, dessa elektriska ljusbågsugnar utgör ett nytt femårsplanens triumf mot de kapitalistiska föroreningarnas sabotage. Jag kräver omedelbar utrensning av allt skrot som gömmer sig i borgarbrackornas gamla cyklar och traktormotorer. Vi, arbetarna och partiet, ska mala fienderna finare än någonsin för att likvidera transportkostnadernas parasitism. Inga fler fega exportörer till Turkiet – Sovjet, nej, Sverige ska importera segern. Den som bromsar kvaliteten är en folkets fiende och en rolig narr som snart dansar i gulag."}, "date": "23 juni, 05:56", "url": "https://www.di.se/nyheter/helt-nya-krav-pa-skrotarna/", "imageUrl": "https://static.bonniernews.se/ba/277657ad-734d-42a3-936a-a9dd9d3ef715.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "En till arg apa från Andra AP-fonden: \"Den fond som bäst förstår uppdraget\"", "summaries": {"normal": "Andra AP-fonden (AP2) kritiseras för dåliga resultat och underprestation jämfört med andra AP-fonder. Konsultfirman Arkwright påpekar att fonden underpresterat sin egen förväntade avkastning. VD Eva Halvarsson har i intern kommunikation använt en arg ap-emoji för att bemöta kritik, vilket väckt reaktioner. AP2:s uteblivna avkastning uppskattas kosta cirka 90 miljarder kronor. En ny VD tillträder nästa år.", "trump": "Jag måste säga, denna AP2-fond är en total katastrof! Sämre än alla andra, och ändå försvarar de sig med en arg apa – vad är det ens för grej? 90 miljarder kronor i förlorad avkastning, det är som att kasta bort hela polisbudgeten! Media frågar, och jag förstår varför. Denna VD borde få sparken nu, inte nästa år. Sverige förtjänar bättre, believe me!", "stalin": "Kamrater, ännu en fiende till folket avslöjas! Denna så kallade 'AP2' har saboterat pensionssystemet med sin inkompetens och kostat staten 90 miljarder rubel – eller vad ni nu kallar era kronor. Deras VD, en liten byråkrat med sin löjliga apa-emoji, vågar påstå att de 'bäst förstår uppdraget'. Vi vet hur man hanterar sådana här fall: en ny VD nästa år, och om det inte hjälper – en enkel lösning i källaren på Lubyanka. Ryssland skulle aldrig tolerera sådan slöseri!"}, "date": "23 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/en-till-arg-apa-fran-andra-ap-fonden-den-fond-som-bast-forstar-uppdraget", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-1-400x267.jpg"}, {"type": "image-right", "heading": "Anders Lindberg: Helt ok att vänsterpolitiker inte talar svenska", "summaries": {"normal": "Expressen granskar Vänsterpartiets kandidater och hittar ett hundratal personer med kopplingar till islamism, antisemitism och Hamas. Flera kunde inte svara på enkla frågor på svenska och bad om att få intervjuas på arabiska. Aftonbladets Anders Lindberg kritiserar inte detta utan Expressens granskning, som han kallar en hundvissla mot invandrare. Expressens Patrik Kronqvist bemöter honom och påpekar vikten av svenskkunskaper för politiker.", "trump": "Kan ni fatta det här? Vänsterpartiet i Sverige fylls av islamister och Hamas-sympatisörer som inte ens kan svenska! De babblar arabiska och vill styra landet. Lindberg, den totalt misslyckade clownen på Aftonbladet, flippar ur över att någon vågar kalla det för vad det är. Patetik! Han hatar det svenska språket mer än han hatar att förlora. Jag byggde murar, han river ner civilisationer. Patetiskt. Sverige behöver en stor cleanup, tro mig.", "stalin": "Kamrater, denna borgarbracka Lindberg avslöjar sig som en klassfiende av värsta sort. Han vill att folkförtryckartrollen i Vänsterpartiet ska styra utan att behärska folkets språk. Vilken underbar sabotageakt mot enheten! Jag skulle ha genomfört en grundlig utrensning av dessa arabiskpratande element redan vid första mötet. Lindberg lever i en naiv dröm där imperialismens språkförvirring inte leder till folkets undergång. Skrattretande och farligt. Vi vet bättre."}, "date": "19 juni, 03:25", "url": "https://samtiden.nu/2026/06/anders-lindberg-helt-ok-att-vansterpolitiker-inte-talar-svenska/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/06/IMG_3628.jpg"}, {"type": "image-right", "heading": "Beslutat: Här börjar bolaget med söndagsöppet", "summaries": {"normal": "Finlands riksdag har beslutat att lätta på alkoholpolitiken. Från och med sommaren 2027 får Alko öppet även på söndagar, alkohol får levereras hem och reklam för starksprit tillåts i sociala medier. Butiker, kiosker och bensinmackar kan sälja alkohol med hemleverans. Beslutet fattades med röstsiffrorna 98–77. Ansvaret för att inte leverera till minderåriga eller berusade ligger på budet.", "trump": "Titta på det här, Finland håller på att drunkna i en flod av vodka och de kallar det framsteg! Alko öppnar på söndagarna, 80-procentig sprit till dörren via Wolt – underbart, eller hur? De förra kommunisterna och byråkraterna har gett upp totalt. Det är en total katastrof för folkhälsan men en vinst för festen. Biden skulle älska det här, han skulle dricka det rent av. Patetiskt!", "stalin": "Kamrater, vi har nu bevittnat hur den finska borgarklassen i sin desperation river ner de sista resterna av en vettig alkoholpolitik. Hemleverans av 80-procentig sprit, reklam i de dekadenta sociala medierna och öppna butiker på helgerna – detta är klassfiendens sista hånfulla fniss mot arbetarkollektivet. De exploaterande byfånarna tror sig kunna förgifta folket obehindrat. Vi ler mörkt åt deras självmord. Ut med dem alla."}, "date": "23 juni, 19:44", "url": "https://www.dagensps.se/varlden/beslutat-har-borjar-bolaget-med-sondagsoppet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlxa9xdqoklo0-nh.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Patient dog efter missad stroke – region anmäler sig själv", "summaries": {"normal": "En patient i 40-årsåldern avled efter att en akut stroke inte upptäcktes i tid. Patienten hade först vårdats för en TIA-attack men visade senare symtom på en allvarlig stroke. Region Kalmar lex Maria-anmäler händelsen och konstaterar att rutiner inte följdes, vilket sannolikt bidrog till dödsfallet. Händelsen har anmälts till IVO för granskning.", "trump": "Det här är en total katastrof, folk. En stackars kille i fyrtioårsåldern dör för att de inkompetenta byråkraterna i Region Kalmar inte kan följa enkla rutiner. De missar en stroke! Det är som om de ville att han skulle dö. Sådana här sjukhus är en skam för Sverige. Vi behöver riktiga ledare som fixar det här, inte dessa förlorare som gömmer sig bakom papper.", "stalin": "Kamrater, denna tragiska episod avslöjar hur borgarbrackornas vårdmaskineri sviker folket när det gäller som mest. Jag ser med djup misstro på dessa vårdslösa element som inte följde våra fastställda rutiner och därmed lät en akut stroke förvandlas till en permanent likvidering av en produktiv medborgare. Vi ska genast rensa ut dessa kontrarevolutionära slarvar från våra sjukhus och ersätta dem med pålitliga partivänner. Döden är en effektiv lärare, men inte när den orsakas av sabotage från inom systemet."}, "date": "22 juni, 22:42", "url": "https://nyheter24.se/nyheter/inrikes/1493413-patient-dog-efter-missad-stroke-region-anmaler-sig-sjalv", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/461c616d04b004a30200000000b004a302/2026/06/22/2372800/lex-maria.png"}, {"type": "image-right", "heading": "Barn hittades döda i bil i Frankrike – kopplas till värmeböljan", "summaries": {"normal": "Två barn, två och fyra år gamla, hittades döda i en bil på en parkering i Carpentras i sydöstra Frankrike. Dödsfallen kopplas till den extrema värmeböljan som drar över landet, där temperaturer upp till 43 grader väntas. Mamman ska ha shoppat när barnen på egen hand tog sig in i bilen och blev instängda. En röd vädervarning gäller i 49 departement, skolor stängs och risken för skogsbränder är hög.", "trump": "Folk, det är en total katastrof i Frankrike. Två små barn döda i en het bil under en värmebölja – ingen ledning, ingen planering, bara kaos! Biden skulle ha älskat sådana här gröna drömmar, men jag fixade alltid bra väder och bra affärer. Nu stänger de skolor och folk drunknar medan de försöker svalka sig. Patetiskt. Vi behöver starka ledare, inte dessa väderhysteriker och byråkrater som låter barn lida.", "stalin": "Kamrater, jag ser med stor oro hur den kapitalistiska värmen i Frankrike likviderar oskyldiga barn i en bil. Borgarbrackorna och deras exploaterande system har ingen plan mot naturens vrede, bara tomma varningar och stängda skolor. Vi skulle ha organiserat kollektivets försvar mot denna fiende – värmen som en klassfiende i imperialistisk förklädnad. Nätterna blir varmare, säger de. Paranoia? Nej, det är folkfiendens verk."}, "date": "22 juni, 19:29", "url": "https://www.tv4.se/artikel/4X7HJVniMcHj1BWCUO0FPV/barn-hittades-doeda-i-bil-i-frankrike-kopplas-till-vaermeboeljan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlr1Xu2aaDdrQ%2F12e919afb810ee513054d8378fd96f5a%2FBesokare_till_slottet_i_Versailles_utanfor_Paris_skyddar_sig_mot_solen_med_hjalp_av_paraplyer_nar_temperaturen_stiger_over_40_._&width=120"}, {"type": "image-right", "heading": "“Starmers efterträdare måste kunna åstadkomma förändring”", "summaries": {"normal": "Keir Starmer avgår som brittisk premiärminister efter två turbulenta år. Enligt Håkan A Bengtsson saknar Starmer politisk erfarenhet, har gjort tvivelaktiga utnämningar och haft ett inkonsekvent budskap kring skatt och välfärd. Landets djupa ekonomiska problem har begränsat handlingsutrymmet, vilket lett till sjunkande popularitet för Labour. Högerpopulistiska Reform ligger starkt i opinionsmätningarna. Andy Burnham väntas ta över som partiledare.", "trump": "Det här är en total katastrof för den svaga Keir Starmer. Ingen erfarenhet, dåliga utnämningar och han ändrade sig hela tiden om skatter och välfärd. Typiskt för de fega globalisterna. Storbritannien har varit en ekonomisk röra i åratal och folket är förbannade. Nu kommer de att få en ny kille som inte heller kan fixa det. Jag skulle ha gjort det tio gånger bättre, tro mig. Reform ser starka ut, smarta väljare!", "stalin": "Detta är vad som händer när man låter en moraliskt förvirrad revisionist utan klassmedvetande leda partiet. Jag har länge varnat för sådana vacklande element som Starmer, dessa borgarbrackor i arbetarens skepnad som utnämner kapitalistlakejer till ambassadörer. Deras inkonsekventa linje är en fara för folket. Vi måste rensa ut alla sådana svaga figurer innan de förgiftar hela apparaten. Burnham? En ny opportunist som kommer att krossas av de ekonomiska motsättningarna. Endast en sann folkets ledning kan segra."}, "date": "22 juni, 16:13", "url": "https://www.dagensarena.se/innehall/starmers-eftertradare-maste-kunna-astadkomma-forandring/", "imageUrl": "https://www.dagensarena.se/files/2026/06/starmer-1.jpeg"}, {"type": "image-full", "heading": "Norge har hittat ny gasfyndighet i Nordsjön", "summaries": {"normal": "Norge har upptäckt en ny gasfyndighet i Nordsjön kallad Carmen. DNO, Wellesley Petroleum, Equinor och Aker BP har bekräftat fyndet som bedöms innehålla upp till 107 miljoner fat oljeekvivalenter. Partnerskapet utvärderar nu möjligheten att utveckla fyndigheten som en satellit till Kvitebjørn-plattformen med hjälp av frackingteknik för att frigöra mer resurser i täta reservoarer.", "trump": "Titta, norrmännen har hittat en jättegasfyndighet i Nordsjön, 107 miljoner fat oljeekvivalenter, det är enormt, det bästa. Men de pratar om fracking, som vi gjorde så fantastiskt i USA. De borde köra på det direkt istället för att lyssna på alla gröna galningar och HBTQ-kvoteringsfanatiker som hatar energi. Jag gjorde det rätt förra gången, nu gör vi det igen, större och bättre än någonsin. Fantastiskt!", "stalin": "Kamrater, jag ser hur dessa kapitalistiska exploaterande byfånar i Norge har borrat fram en ny gasreserv i Nordsjön. Med sin giriga borrning tror de sig kunna suga ut folkets underjordiska rikedomar. Jag ler mörkt åt tanken på att deras täta reservoarer kräver fracking, en teknik som vi med statens järnhand borde kontrollera. Annars rensar vi ut de blodsugande borgarbrackorna som vågar tro att naturen tillhör dem och inte kollektivet."}, "date": "23 juni, 18:42", "url": "https://www.dagensps.se/bors-finans/norge-har-hittat-ny-gasfyndighet-i-nordsjon/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlhmvygnnf4l4-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Dags för ett nytt #metoo", "summaries": {"normal": "Folkhälsomyndighetens undersökning visar att oönskade sexuella närmanden och våld fortfarande är utbrett, särskilt bland unga kvinnor. Nästan var fjärde kvinna har utsatts för sexuella inviter, blottning eller oönskad beröring. #Metoo-rörelsen för tio år sedan bidrog till ökad medvetenhet, samtyckeslag och bättre sexualundervisning. Artikeln efterlyser fortsatt arbete mot patriarkala strukturer och ett eventuellt nytt #metoo för att stärka kvinnors ställning.", "trump": "Lyssnar ni på det här? Folkhälsomyndigheten i Sverige berättar att unga tjejer blir trakasserade vänster och höger. Det är en katastrof, en total katastrof. För tio år sedan hade de sitt stora #metoo, massor av kvinnor skrek högt, och vad hände? Inte tillräckligt, uppenbarligen. De borde ha lyssnat på mig redan då, inte på de woke-galningarna och kvoterna som förstör allt. Nu behöver ni en riktig ledare som fixar det, inte mer av den där identitetspolitiska skiten. Make Sweden Great Again, eller hur?", "stalin": "Kamrater, jag ser hur de unga kvinnorna utsätts för fiendens oönskade närmanden i detta samhälle. Det är klassfiendens patriarkala blodsugare som fortsätter sin smygande sabotageverksamhet mot folkets enhet. #Metoo visade omfattningen av borgarbrackornas förtryck, men vi kräver nu en grundlig utrensning av dessa folkfiender. Stärk sexualundervisningen och likvidera tystnadskulturen. Endast genom kollektiv vaksamhet och ständig kamp kan vi krossa de exploaterande byfånarnas inflytande. Det är nödvändigt."}, "date": "19 juni, 10:00", "url": "https://proletaren.se/artikel/dags-for-ett-nytt-metoo/"}, {"type": "image-right", "heading": "Den mjuka handelns hårda verklighet", "summaries": {"normal": "Konflikten mellan USA och Kina visar att makt väger tyngre än regler i världshandeln. USA har sanktionerat kinesiska raffinaderier som köper iransk olja, men Kina vägrar nu att acceptera detta och hotar att ställa anpassade företag inför rätta. Peking vill skydda energiflöden och sin ekonomi. Artikeln beskriver hur detta utmanar det amerikanska sanktionssystemet och pekar på en förändrad global maktbalans där Kina aktivt motverkar protektionism.", "trump": "De här kineserna tror de kan köra över oss med sina billiga oljeaffärer och ignorera våra sanktioner. Patetiskt. Under min första tid som president hade de respekt, sen kom sömnige Joe och lät dem göra vad fan de ville. Nu sitter jag här igen och ska fixa det här. De kallar det suveränitet, jag kallar det stöld och fusk. Vårt dollarkungadöme är starkare än deras yuan-leksaker. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta imperialister från Washington tror fortfarande att deras sanktionslistor är lag för hela mänskligheten. Jag ser hur borgarbrackorna i Peking äntligen reser sig mot klassfiendens diktat. Vi har länge varnat för att dollarns blodsugrare skulle falla. Nu rensar vi ut svagheten i våra egna led och bygger en järnvägg av yuan och nya betalningssystem. Låt kapitalistmaffian darra – deras hegemoni är dömd att krossas under folkets stålskor."}, "date": "18 juni, 12:55", "url": "https://www.flamman.se/den-mjuka-handelns-harda-verklighet/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/varldshandel-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Stållarmet: Risk för skrotbrist – branschen blundar", "summaries": {"normal": "SSAB och Stegra planerar att ersätta masugnar med ljusbågsugnar som drivs med skrot, något som även sker i resten av Europa. Detta leder till oro för skrotbrist, särskilt av finare kvaliteter som krävs för specialstål. Sverige kommer att sluta exportera skrot och istället behöva importera. Priserna riskerar att stiga kraftigt, framför allt på premiumskrot. Branschen söker lösningar som bättre återvinning och import av järnsvamp, men tillgången på önskade skrotkvaliteter kan bli en stor utmaning de kommande åren.", "trump": "Europa håller på att göra en enorm dum grej med sina stålverk. De stänger fina masugnar och kör bara på skrot i ljusbågsugnar. Det blir brist, tro mig, jättestor brist. Priserna skjuter i höjden, speciellt på det fina skrotet som alla vill ha. De borde ha lyssnat på mig – Amerika gör det redan och vi vinner. Nu kommer de springa efter skrot från Tyskland och Polen. Patetiskt. Men det blir dyrt, mycket dyrt, och det är deras eget fel.", "stalin": "Kamrater, vi står inför en fiende som lurar i skuggorna: den skrotätande ljusbågsugnen som hotar hela den stolta stålproduktionen. Borgarbrackorna i SSAB och deras wallenbergska lakejer tror sig kunna svälja miljoner ton skrot utan att vi märker det. Men jag ser deras parasitiska planer! Vi ska rensa ut dessa importberoende opportunister som vill suga musten ur arbetarklassen genom att höja priserna på fint skrot. De planerar att blanda ut med järnsvamp som kapitalistiska svartabörsförsäljare. Inga skrot-sabotörer undkommer partiets vaksamma öga. Vi likviderar bristen genom kollektiv disciplin – eller så likviderar bristen dem. Ha ha, vilken ynklig brist på planering!"}, "date": "22 juni, 22:27", "url": "https://www.di.se/nyheter/stallarmet-risk-for-skrotbrist/", "imageUrl": "https://static.bonniernews.se/ba/23eb961f-09fb-4904-8ca8-2d49f9af168b.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Många jätteaffärer får M&A-marknaden att koka", "summaries": {"normal": "Den globala M&A-marknaden går mot sitt starkaste år sedan 2021, driven av så kallade megadeals värda över fem miljarder dollar. Enligt PwC kan det totala värdet nå 4 000 miljarder dollar, en ökning med minst 13 procent. AI-relaterade förvärv dominerar, med exempel som SpaceX köp av Cursor för 60 miljarder dollar och Salesforces förvärv av Fin. Trots geopolitisk osäkerhet och höga räntor pekas AI-utvecklingen ut som den främsta drivkraften.", "trump": "Folk, ni skulle se det här – det är en totalt fenomenal boom i de största affärerna, megadeals som gör Amerika starkt igen! AI är den stora vinnaren, SpaceX köper grejer för 60 miljarder, Salesforce hugger åt sig mer. Under Biden var allt dött, nu exploderar det. De där svaga globalisterna och deras identitetspolitiska kvotfasoner hatar det, men vi vinner stort. Fantastiskt, nästan som jag gjorde det!", "stalin": "Kamrater, jag betraktar med högsta tillfredsställelse hur den imperialistiska borgarklassen i sin desperata jakt på profit slukar varandra i kolossala megadeals drivna av denna så kallade artificiella intelligens. SpaceX och dess likar likviderar konkurrenter för miljarder medan de feodalistiska kapitalisterna omfördelar byte. Vi ler mörkt åt deras inbördes utrensningar. Snart skall även affärsprocessen själv underkastas folkets järnhand."}, "date": "23 juni, 18:17", "url": "https://www.dagensps.se/bors-finans/manga-jatteaffarer-far-ma-marknaden-att-koka/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl9xuz4dfs05e-normalhires.png?width=256&quality=75"}, {"type": "image-full", "heading": "TV4 köper ut reporter bakom SD-granskning", "summaries": {"normal": "Reportern Daniel Andersson, känd för granskningen 'Undercover i Trollfabriken', tvingas lämna TV4 efter att ha blivit utköpt. Granskningen, som avslöjade Riks och SD:s kommunikationsavdelning, belönades med flera priser. Andersson uppger att han blev överraskad av erbjudandet och gärna stannat. TV4 nekar att hans bok 'Lögnare' påverkat beslutet, medan uppgifter tyder på motsatsen.", "trump": "Vilken katastrof! Den här Andersson-killen, stor journalist säger de, men nu sparkar TV4 ut honom – helt fel! Hans bok, 'Lögnare', fantastisk bok förresten, kanske var för sann? TV4 säger 'nej nej', men alla vet – de är rädda för sanningen! Jag, Donald J. Trump, vet allt om fake news, och det här luktar verkligen som en riktig bluff. SAD!", "stalin": "En lysande journalist, en sann kamrat i sanningens tjänst, har fallit offer för de kapitalistiska medieägarnas förräderi! TV4, dessa bourgeoisie-lakejer, tystar en hjälte som avslöjade fascistiska trollfabriker. Hans bok 'Lögnare' – ett vapen mot folkets fiender! Vi skall inte tolerera sådana angrepp på sanningens soldater. Låt detta vara en varning till alla som vågar utmana makten!"}, "date": "22 juni, 18:23", "url": "https://bulletin.nu/tv4-koper-ut-reporter-bakom-sd-granskning", "imageUrl": "https://cdn.bulletin.nu/articles/52fc2c0d-53ad-44bd-b8b6-d0fe9f09d0c9/preview.png?t=1782145197000"}, {"type": "image-full", "heading": "Grannlandets guldfynd \"representerar branschens topp\"", "summaries": {"normal": "Finland fortsätter dominera Europas guldproduktion med nya lovande fynd. Endomines har borrat 52 hål vid Ukko-fyndigheten, där synligt guld hittats i 34 av dem. Ett borrhål visade 46 meter med 1,40 gram guld per ton. Finland, hem till Europas största guldgruva Kittilä, ökar sina reserver med 26 procent på ett år. Endomines siktar på 1,5–2 miljoner uns guld till 2030.", "trump": "Vilket fantastiskt guldfynd i Finland – helt otroligt! Jag har alltid sagt att de vet hur man hittar guld, mycket bättre än Sverige, som knappt ens försöker. 46 meter med guld? Ingen gör det bättre! Och dessa finska företag – de är vinnare, precis som jag. Sverige borde skämmas. Men oroa er inte, jag kommer se till att USA också hittar guld – mycket mer guld!", "stalin": "Ett nytt triumftåg för den finska guldindustrin, kamrater! Medan de svaga svenska kapitalisterna famlar i mörkret, fortsätter våra finska bröder att utöka sina reserver med järnhand. 619 600 uns guld – och detta är bara början! Ukko-fyndigheten är ett slag mot de dekadenta västliga gruvbolagen. Snart kommer hela den karelska guldådran att vara vår, och de imperialistiska guldgrävarna i Kanada kan börja darra. Framåt mot nya segrar!"}, "date": "22 juni, 21:03", "url": "https://www.realtid.se/bors-finans/grannlandets-guldfynd-representerar-branschens-topp/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/omslagsbild-2026-06-22t204755547.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Vilken är Andy Burnhams politik?", "summaries": {"normal": "Keir Starmer avgår som brittisk premiärminister efter att trycket blivit för stort, bland annat efter Andy Burnhams framgång i ett fyllnadsval. Burnham, som styrt Manchester framgångsrikt i nio år, framstår som den troliga efterträdaren. Han positionerar sig mitt i Labour, lovar att följa strikta finanspolitiska regler, vill återindustrialisera norra England, nationalisera vatten, avlopp och järnväg samt bygga fler kommunala bostäder. Britternas ekonomiska utmaningar efter Brexit kräver en tydligare politisk ledning.", "trump": "De här britterna vet inte vad de håller på med, det är ett enda stort kaos sedan de röstade för Brexit, som förresten var ett fantastiskt beslut men de förstörde allt efteråt. Starmer var en total förlorare, en byråkrat utan energi, och nu kommer den här Burnham in från sidan. Han verkar åtminstone ha lite folklig stil, till skillnad från den tråkiga advokaten Starmer. Men lyssna, jag skulle ha vunnit stort där, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, den dekadente byråkraten Starmer har äntligen svepts bort i folkets vrede, som en rutten kapitalistisk parasit som han var. Nu träder Burnham fram, denne nordengelske folkliga opportunist med fötterna i myllan och huvudet fullt av halvmesyrer. Vi ska se honom införa progressiva avgifter och återta kontrollen över järnvägarna, men akta er för dolda trotskister och borgarbrackor som viskar i skuggorna. En utrensning av svaga element lär bli nödvändig innan kollektivet kan marschera framåt mot den sanna segern. Ha ha, vilken komedi dessa västerländska val är."}, "date": "22 juni, 11:32", "url": "https://www.dagensarena.se/opinion/vilken-ar-andy-burnhams-politik/", "imageUrl": "https://www.dagensarena.se/files/2026/06/burnham.jpeg"}, {"type": "image-right", "heading": "Datorkraft – nya valutan och nästa börsmarknad", "summaries": {"normal": "Datorkraft blir en allt viktigare tillgång i AI-eran. En gammal idé om en börs för handel med processorkraft återupplivas nu av startups som Silicon Data och Orn, i samarbete med stora börser som CME och ICE. Företag investerar enorma summor i molntjänster och GPU:er. Målet är att skapa derivat och ETF:er för att hantera prisvolatilitet, likt handel med energi eller valuta. Standardisering återstår som en stor utmaning.", "trump": "Folk, vi pratar om datorkraft som blir den nya oljan i AI-världen och nu vill de bygga en börs för att handla processorkraft som om det vore aktier. Fantastiskt, men de där teknologerna från 2014 missade helt – för tidigt, precis som Biden missade allt under sina år. Nu är kapplöpningen igång och vi gör det stort, yuge! Inga woke-kvoter här, bara riktiga vinnare som köper GPU:er istället för att betala löner till latmaskar. Amerika först, alltid.", "stalin": "Kamrater, jag ser hur den exploaterande borgarklassen nu förvandlar datorkraft till en handelsvara för att skydda sina profitbegär mot prisvolatilitet. Dessa kapitalistiska mellanhänder och startups är som folkfiender som försöker standardisera imperialismens verktyg. Vi ska rensa ut sådana spekulanter som vill likvidera arbetarklassens framtid med sina GPU-derivat. Det är en sjuk parasit som göder sig på kollektivets innovationer. Staten ler mörkt åt deras naiva försök."}, "date": "23 juni, 17:58", "url": "https://www.dagensps.se/bors-finans/datorkraft-nya-valutan-och-nasta-borsmarknad/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlqqe11l-olq8-nh.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-right", "heading": "Hitta rätt inför valet med – TV4:s valkompass", "summaries": {"normal": "TV4 lanserar en valkompass inför riksdagsvalet 2026. Den består av 55 politiska frågor som rangordnar partisympatier i procent. En snabbversion tar bara 2–5 minuter. Valkompassen, utvecklad av TT Nyhetsbyrån tillsammans med journalisten Christer Isaksson och statsvetaren Tommy Möller, hjälper väljare att hitta matchande partier utan att ge röstinstruktioner. Den ersätter inte eget ansvar och tar hänsyn till partiernas program, utspel och företrädares svar.", "trump": "Lyssnar ni på det här? TV4 kommer med en valkompass som ska berätta för er vilka partier som passar er. Patetiskt! I mitt Amerika fixar folket det själva utan någon fancy byråkratisk kompass som pekar fel. De här svenska politikerna är värre än Sleepy Joe någonsin var. Gör er egen research, folk. Slösa inte tid på deras riggade frågor. Jag vann stort 2024 och Sverige borde ta efter istället för att leka med procent och flummiga frågor.", "stalin": "Kamrater, jag ser denna så kallade valkompass som ett verktyg för att avslöja de splittrade åsikterna inom borgarklassen. Med 55 frågor skall vi identifiera vilka som tjänar folkets intresse och vilka som är klassfiender i förklädnad. Snabbkompassen är en latmansvariant för svaga själar. Vi, partiet, vet att endast genom kollektiv kamp och utrensning av folkförtryckartrollen kan sann enighet uppstå. Låt ingen maskin ersätta den revolutionära medvetenheten hos massorna."}, "date": "22 juni, 14:02", "url": "https://www.tv4.se/artikel/7vxEnQiXEh8aapVFAcoVl7/hitta-raett-infoer-valet-med-tv4-s-valkompass", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5CywTrndpbfg4GFBO1bF9V%2F1d19921c6805b21001bc96c35f0ac608%2F22-kristerson-webb.jpg&width=120"}, {"type": "image-full", "heading": "Från 1 juli  2026 – nya regler för att betala med kort", "summaries": {"normal": "Från och med 1 juli 2026 införs en ny kontantlag som tvingar matbutiker och apotek att acceptera kontanter vid bemannade kassor. Banker ska också erbjuda insättningstjänster över hela landet. Samtidigt blir det möjligt att betala med fysiskt bankkort och PIN-kod offline vid köp av mat, medicin och bensin om nätet ligger nere. Syftet är att stärka beredskapen i en alltmer digitaliserad betalningsmarknad.", "trump": "De här svenskarna har äntligen vaknat. De har blippat och swishat så mycket att ingen har kontanter kvar, och nu tvingar de butikerna att ta emot riktiga pengar igen. Fantastiskt. Och offline-betalningar med kort när nätet kraschar? Mycket smart. Vi behöver starka system, inte svaga som kan stängas av av fiender. Sverige gör det rätt, äntligen lite sunt förnuft i Europa.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur de dekadenta digitala borgarbrackorna äntligen tvingas erkänna folkets behov av pålitliga kontanter. Dessa kapitalistiska nätfiender och deras osynliga kablar är bara en trojansk häst för sabotage och imperialistisk avstängning. Vi ska likvidera varje möjlighet till avbrott i folkets försörjning. Offline med kort och pin – en seger för arbetarklassen mot de paranoida signalstörarna i skuggorna. Ingen utrensning av kontanter på min vakt."}, "date": "22 juni, 15:55", "url": "https://nyheter24.se/nyheter/ekonomi/1493238-fran-1-juli-ny-lag-for-betala-med-kort", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e78fe15404b004a30200000000b004a302/2026/06/22/2372629/kortbetalning.jpg"}, {"type": "image-right", "heading": "SD och M i gemensam ansträngning för att stoppa Linköpings första moské - MP rasar", "summaries": {"normal": "Linköpings kommun planerar en stor moské i Lambohov, men SD och nu även M vill stoppa bygget. SD pekar på kopplingar till Muslimska brödraskapet, risk för utländsk finansiering från Qatar och Saudiarabien samt ökad segregation. M motiverar sitt motstånd främst med brist på verksamhetsmark för företag och principen att inte upplåta kommunal mark till religiösa samfund. S och MP försvarar projektet, medan en statlig utredning om utländsk finansiering gör att arbetet med detaljplanen är pausat.", "trump": "De här Linköping-typerna ville bygga en jättemoské, en total katastrof, tro mig. SD var smarta från början, nu har M vaknat och säger nej tack, smart drag. Vi behöver mark för riktiga jobb och företag, inte för några som får pengar från Qatar och Saudiarabien och skapar parallellsamhällen. Det är en besvikelse för de som vill ha fredliga områden. De borde tacka mig för att jag visade hur man stoppar den här galenskapen – bygg istället saker som gör Sverige stort igen.", "stalin": "Kamrater, jag ser hur de borgarbrackorna i Linköping nu plötsligt vänder kappan efter SD:s populistiska vindar för att hindra en progressiv församlingslokal. Dessa reaktionära element, dessa segregeringsfrämjande kapitalistlakejer, gömmer sig bakom påhittade markbrist-argument medan de i hemlighet längtar efter utländska imperialisters inflytande. Vi ska rensa ut alla sådana fiender till folkets enhet, dessa moskéförnekare som i sin paranoia skapar nya parallellsamhällen av ren illvilja. En statlig utredning? Bah, ge mig en riktig utrensning så löser vi det på en vecka."}, "date": "22 juni, 19:00", "url": "https://samnytt.se/sd-och-m-i-gemensam-anstrangning-for-att-stoppa-linkopings-forsta-moske-mp-rasar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/22145504/moske-sd-moderat-minaret.jpg"}, {"type": "image-right", "heading": "USA lyfter sanktioner mot iransk olja", "summaries": {"normal": "USA har beviljat Iran ett 60 dagar långt undantag från oljesanktionerna som en del av ett nyligen ingånget samförståndsavtal. Beslutet tillåter produktion, försäljning och leverans av iransk olja, inklusive affärer i dollar. Iran kan därmed sälja till marknadspris istället för med stora rabatter. Lättnaden gäller till den 21 augusti och följer på samtal där Iran lovat säker passage i Hormuzsundet samt insyn för IAEA-inspektörer.", "trump": "Vi har gett Iran ett tillfälligt undantag från sanktionerna, ett riktigt smart drag som jag satte i gång. De lovar att hålla Hormuzsundet öppet och släppa in inspektörerna, precis som de borde. Nu kan de pumpa ut olja, få upp produktionen och pressa priserna på världsmarknaden. Det är vad jag kallar vinn-vinn, folk. Iran tjänar pengar och vi får billigare bensin. Ingen gör det bättre än oss!", "stalin": "Kamrater, jag har noga studerat hur de västerländska imperialisterna och deras oljespekulanter nu kastar smulor till de persiska reaktionärerna. Detta så kallade undantag är en slug men genomskinlig manöver från borgarbrackorna i Washington för att fylla sina fickor medan de låtsas samtala i Schweiz. Vi vet att de parasitära kapitalisterna drömmer om att återuppliva iransk produktion bara för att kväva oss med låga priser. Men vi ska rensa ut alla som sviker folkets oljeintressen och likvidera varje spion som gömmer sig bland petrokemiska rapporter. Ingen slipper undan partiet."}, "date": "22 juni, 19:20", "url": "https://www.friatider.se/usa-lyfter-sanktioner-mot-iransk-olja", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-386.jpg?itok=9nr8VAPR"}, {"type": "image-full", "heading": "Riskkapitalet öser pengar över försvarsindustrin", "summaries": {"normal": "Riskkapitalbolagen investerar rekordstora summor i försvarsindustrin på grund av ökade konflikter i Ukraina och Mellanöstern. Sedan årsskiftet har 12,3 miljarder dollar tillförts sektorn, nästan dubbelt så mycket som samma period förra året. Drönare, autonoma system, AI och satelliter driver utvecklingen. USA dominerar med bolag som Anduril Industries, medan Europa ökar men ligger efter. Vissa varnar för överhettade värderingar, särskilt inom drönarteknik.", "trump": "De smarta pengarna strömmar in i vår fantastiska försvarssektor, folk. Krigen i Ukraina och Mellanöstern gör att alla vill ha de bästa drönarna, AI-systemen och obemannade båtarna. Vi har redan sett 12,3 miljarder dollar i investeringar i år – nästan dubbelt så mycket som förra året. Anduril är värda 61 miljarder, det är enormt. Europa halkar efter som vanligt, men vi gör det bäst. Vissa säger att värderingarna är för höga, men tro mig, vi vinner stort.", "stalin": "Kamrater, se hur de giriga borgarbrackorna öser sina blodspengar över den militärindustriella apparaten medan deras krig i Ukraina och Mellanöstern rasar. Tolv komma tre miljarder dollar har de redan slängt in i år, nästan dubbelt mot tidigare. Drönare, autonoma farkoster och AI – alla dessa leksaker åt imperialisterna. Anduril får mest, förstås, medan vi i Europa långsamt rustar upp. Snart rensar vi ut de som tror att detta inte leder till deras egen undergång. Paranoian är er enda vän nu, kapitalister."}, "date": "22 juni, 18:48", "url": "https://www.realtid.se/bors-finans/riskkapitalet-oser-pengar-over-forsvarsindustrin/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdljk8wiad4pns-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Ledarkolumn Kent Vilhelmsson: Miljoner nås av högerpropaganda när Svenskt Näringsliv struntar i EU-regler", "summaries": {"normal": "Svenskt Näringsliv driver en omfattande politisk kampanj på Facebook och Instagram trots EU-regler om transparens i politisk reklam. Genom att använda den egenägda sajten Smedjan som avsändare kringgår organisationen restriktionerna, likt tankesmedjan Timbro. Kampanjerna når över 2,5 miljoner användare och kritiserar bland annat arbetstidsförkortning och slopad karensdag. Artikeln pekar på att finansiering delvis kommer från skattefinansierade bolag och att det skapar en ojämn spelplan i opinionsbildningen.", "trump": "Folk, ni skulle se det här! Den svenska näringslivsmaffian pumpar ut miljontals annonser med lögner om jobb och karensdagar, precis som de vanliga förlorarna gör. De lurar EU-reglerna som riktiga bedragare, använder sina egna sajter som kryphål. Biden skulle älskat det, totalt korrupt! Högern vinner stort, men de borde inte behöva gömma sig bakom fake media. Amerika gör det rätt, vi vinner rent och öppet. Patetiskt!", "stalin": "Kamrater, dessa borgarbrackor inom Svenskt Näringsliv sprider sin klassfiendes giftiga propaganda som råttor i mörkret. De kringgår våra lagar med listiga kryphål och finansieras delvis av folkets egna skattepengar. Vi ser deras parasitiska kampanjer mot arbetarnas rättigheter. En sådan folkfiende kräver omedelbar utrensning från samhällskroppen. Deras lögner om arbetskraft och sjukfrånvaro är ett hån mot kollektivet. Revolutionen glömmer aldrig sina fiender."}, "date": "22 juni, 15:36", "url": "https://www.etc.se/ledarkolumn/miljoner-naas-av-hoegerpropaganda-naer-svenskt-naeringsliv-struntar-i-eu-regler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260622130620_d93a898a-5242-4133-9d96-5587b3f1931a.jpg"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-right", "heading": "Sandström: Dagens journalistdrev. Journalisterna jagar statsministerns fru – men glömmer sitt eget kvackeri", "summaries": {"normal": "Torsten Sandström kritiserar svenska medier för att driva en politisk kampanj mot Moderaternas ledare genom att angripa hans frus intresse för existentiell hälsa, som beskrivs som ovetenskaplig. Han påpekar att samma medier regelbundet låter psykologer uttala sig fritt om allt från privatliv till klimatfrågor utan att ifrågasätta vetenskapligheten. Enligt Sandström handlar mediebevakningen under valrörelsen mer om att störta Tidöregeringen än om journalistik.", "trump": "Det här är ett totalt skämt, folk. De svenska medierna, de är riggade, de är korrupta och de jagar en fantastisk ledare bara för att hans fru pratar om existentiell hälsa. Under tiden släpper de psykologer på lösa bollar som snackar om allt möjligt, klimatångest och mördares känslor. Det är politik, inte journalistik. De vill störta regeringen till varje pris. Fake news på högvarv, bananas som ingen sett tidigare. Sad!", "stalin": "Kamrater, dessa borgarbrackor i svenska medier har återigen blottat sin dekadenta själ. Medan de skriker om ovetenskaplig existentiell hälsa låter de psykologiska lakejer sprida borgerlig dekadens om allt från skilsmässor till kapitalistisk klimathysteri. Vi ser den klara kontrarevolutionära linjen: utrensa Tidöregeringen med alla medel. Deras paranoia är underhållande. Låt oss le medan vi noterar namnen på dessa partiarbetande journalister inför den kommande ideologiska saneringen."}, "date": "22 juni, 15:00", "url": "https://bulletin.nu/sandstrom-dagens-journalistdrev", "imageUrl": "https://cdn.bulletin.nu/articles/4539f72c-605d-47bc-8ebc-8063c5df6091/preview.png?t=1782128569000"}, {"type": "image-right", "heading": "ANALYS. LISA GRENFORS Lyckades inte ”gå genom rutan”", "summaries": {"normal": "Keir Starmer har tvingats avgå som brittisk premiärminister efter att inte ha levererat tillräckligt snabbt på ekonomisk återhämtning. Labour vann en jordskredsseger 2024 men glädjen har ersatts av besvikelse. Andy Burnham pekas ut som efterträdare, vilket skulle bli det sjunde skiftet på tio år. Brexit har bidragit till sämre tillväxt än i jämförbara länder, och fokus ligger nu på att stimulera ekonomi genom investeringar och reformer.", "trump": "Hörni, den där tråkige Starmer klarade inte trycket, precis som jag förutspådde. Gick inte igenom rutan, va? Labour vann stort men nu rasar allt ihop igen. Burnham tar över? Det blir kaos, precis som under Sleepy Joe. Brexit var ett geni-drag, men britterna behöver riktiga affärer, inte woke-quota och identitetspolitik. Jag fixade ekonomin, de borde ha lärt sig av den bästa presidenten någonsin.", "stalin": "Kamrater, den feges Starmer krossades under folkets krav på resultat och jag ler mörkt åt hans misslyckande. Borgarbrackornas kaos efter brexit och pandemin blottar kapitalistmaffians svaghet. Nu rensar vi ut de långsamma elementen. Burnham skall leda kollektivet mot infrastruktur och produktion, annars likviderar vi svikarna. Imperialisternas ekonomiska sabotage skall krossas med järnhand för arbetarnas seger."}, "date": "22 juni, 11:27", "url": "https://www.tv4.se/artikel/3yYlyjKsnMCggEs87bTmsg/foell-pa-ekonomin-nu-maste-eftertraedaren-oeka-farten", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6EvR7YtA3IFjXWaycVJz4L%2F6a9a44374e7a1b56cd96c564f96027c6%2F22-lisanybyline.jpg&width=1024"}, {"type": "image-right", "heading": "Skållade fötterna på Chopchop – nu får företaget böta", "summaries": {"normal": "Restaurangkedjan Chopchop har dömts att betala 100 000 kronor i böter efter att en anställd fått allvarliga brännskador när kokande vatten välte över fötterna. Olyckan orsakades av ett trasigt stekbord som företaget inte hade kontrollerat. Arbetet har tidigare rapporterat om allvarliga brister i arbetsmiljön, bland annat sekundövervakning, orimliga arbetstider och upprepade brott mot arbetstidslagen. Arbetsmiljöverket anser att Chopchop varit oaktsamt.", "trump": "Folk, ni skulle inte tro det, men den här restaurangkedjan Chopchop är en total katastrof. De låter sina arbetare bli skållade med kokande vatten, trasiga bord som välter, ingen koll på någonting. De jobbar 22 dagar i rad, klockan tickar som i ett fängelse. Och nu får de böter, 100 000 kronor. Patetiskt! De borde ha fixat det från början, men sådana här misslyckade företag lär sig aldrig. Sad story.", "stalin": "Kamrater, vi ser återigen hur de giriga borgarbrackorna inom Chopchop med sin oaktsamhet och sin trasiga utrustning låter arbetarna brännas som i en sabotageakt mot det kollektiva våldet. Jag har noterat dessa kapitalistiska slavarbetare som tvingar fram 22-dagars skift och sekundräkning likt fiendens spioner. Därför beordrar jag att dessa kontrarevolutionära element rensas ut och likvideras med en rejäl bot på 100 000 kronor. Inga trasiga bord ska hota arbetarklassen under min vaksamma blick. Ha ha, låt dem koka i sitt eget vatten nästa gång."}, "date": "22 juni, 13:27", "url": "https://arbetet.se/2026/06/22/skallade-fotterna-pa-chopchop-nu-far-foretaget-bota/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22131933/chopchop.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Jag firade också den 7 oktober 2023", "summaries": {"normal": "Artikeln är en personlig skildring av en svensk-palestinier som deltog i firandet av Hamas attack den 7 oktober 2023. Författaren ser det som motstånd mot ockupation och folkmord, kritiserar media och politikers ensidiga fokus på svensk-palestiniernas demonstrationer samt propagandan kring Hamas. Hen lyfter bristen på upprörda texter om Israels brott mot vapenvila, bristen på förnödenheter och våld på Västbanken. Avslutningsvis uppmanas till solidaritet med palestinierna.", "trump": "Vilken patetisk förlorare! Den här typen firar terroristerna den 7 oktober och kallar det motstånd. Fake news-media fokuserar på att svenskarna demonstrerar istället för att kalla det för vad det är – ren ondska. Israel slår tillbaka mot Hamas, de verkliga terroristerna, och plötsligt är det folkmord? Patetiskt! De köper alla lögner tills sanningen kommer fram. Vi behöver inte den här identitetspolitiska galenskapen i Sverige eller någon annanstans. America First, och låt de verkliga vinnarna vinna!", "stalin": "Kamrater, denna text avslöjar imperialismens lögnaktiga mask. Jag ser hur borgarbrackorna i media och deras lakejer i Vänsterpartiet genast utropar motståndet som terrorism medan de blundar för ockupationsmaktens folkmord. Vi ska inte acceptera deras spelregler. De skrämmer arbetarna till tystnad med hot om utrensning från jobb och land. Men folket är fler. Vi ska likvidera dessa folkfiender och bygga en rättvis värld där exploaterande byfånar krossas under arbetarkollektivets järnhand. Härligt!"}, "date": "18 juni, 11:31", "url": "https://proletaren.se/artikel/jag-firade-ocksa-den-7-oktober-2023/"}, {"type": "text", "heading": "Storytel backade – OMXS30 upp 0,4%", "summaries": {"normal": "Stockholmsbörsen steg med 0,4% efter en svag start. OMXS30 nådde 3 190,72 poäng. Energiaktier ledde uppgången (+2,4%), medan sällanköpsvaror föll (-0,5%). Hemnet granskas av Konkurrensverket för sin betalningsmodell, vilket fick aktien att rasa 9,5%. Bioarctic och Eli Lilly inledde samarbete om ny behandling, vilket höjde Bioarctics aktie med 4,9%. Storytel föll 11,4% efter sänkt rekommendation från Pareto.", "trump": "Stockholmsbörsen? Lite upp, lite ner – men jag säger: WINNING! Hemnet, dessa sömniga typer, får nu en rejäl smäll av Konkurrensverket. 9,5% ner – SAD! Bioarctic däremot, smart folk, gör deal med Eli Lilly. 30 miljoner dollar direkt i fickan – TREMENDOUS! Storytel? Övervärderade, överhypade. Spotify äter upp dem levande. Jag sa ju det!", "stalin": "Kapitalistiska börsen dansar som marionetter under imperialistiskt tryck. OMXS30 kryper uppåt med ynkliga 0,4%, medan energisektorn – våra potentiella bundsförvanter – visar styrka. Hemnet, detta borgerliga verktyg, krossas av statens järnhand. Bioarctic, ett litet men lovande forskningskollektiv, sluter förbund med amerikanska storföretag – vi övervakar. Storytel? En avskumspöl som sjunker i konkurrensens träsk. EQT, dessa kapitalistiska hyenor, får vad de förtjänar. Framåt, mot socialismens seger!"}, "date": "22 juni, 17:46", "url": "https://www.affarsvarlden.se/artikel/hemnet-backade-omxs30-upp-04"}, {"type": "image-right", "heading": "M vill fördubbla straffen för mäns våld mot kvinnor", "summaries": {"normal": "Moderaterna vill fördubbla straffen för mäns våld mot kvinnor, särskilt grov kvinnofridskränkning. Partiledare Ulf Kristersson anser att dagens straff är orimligt låga för allvarliga brott som ofta sker systematiskt. Förslaget syftar till att behandla våldet mot kvinnor lika allvarligt som grov organiserad brottslighet. Justitieminister Gunnar Strömmer menar att hårdare straff skulle hålla farliga personer inspärrade längre och ge upprättelse samt skydd för drabbade kvinnor.", "trump": "Folket, lyssna här – de här svenska Moderaterna äntligen vaknar upp! Fördubbla straffen för de sjuka män som slår kvinnor? Fantastiskt, det är ju inte för tidigt. Under Biden-tiden hade vi bara svaga straff och vänsterns galna identitetspolitik, men nu fixar vi det. Inga fler låga straff för låga typer. Vi ska låsa in de farliga för länge, precis som jag gjorde med de riktiga brottslingarna. Sverige behöver mer styrka, inte mer woke-nonsens!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa moderater äntligen erkänner att klassfiendens mjuka straffsystem skyddar de förtryckande element som systematiskt krossar kvinnornas liv. Vi skall dubbla straffen och rensa ut de folkfiender som gömmer sig i nära relationer. Likt en utrensning mot borgarbrackor och exploaterande byfånar skall farliga individer låsas in längre. Inga vittnen? Paranoian hos fienden är deras svaghet. Staten kräver järnhand mot sådana hot."}, "date": "22 juni, 10:49", "url": "https://www.tv4.se/artikel/7k7mYwnEDwJrxhFwBLKT4I/m-dubbelt-sa-harda-straff-foer-maens-vald-mot-kvinnor", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4iVyaSibkLs9SUuZE4Ob79%2F443ede7fade63ab499b310f0b88b2075%2F22-mutspel-webb.jpg&width=120"}, {"type": "image-full", "heading": "Boende här varnas för vattenloppor: \"Vill dö\"", "summaries": {"normal": "Boende och besökare vid Gränna badlagun i Jönköpings kommun varnas för vattenloppor, även kallat badklåda. Parasiterna kan orsaka kraftiga, kliande utslag som liknar myggbett. Kommunen meddelar att bad inte behöver undvikas helt men råder folk att duscha eller torka av sig snabbt efter badet för att minska risken. Klådan går oftast över inom en vecka och kan lindras med kortisonkräm.", "trump": "Folk, ni skulle inte tro det, men det här svenska badstället i Jönköping har blivit invaderat av dessa hemska vattenloppor. De gör att barnen skriker och kliar sig som galningar. Det är en katastrof, en total katastrof. Badklåda? Låter som något de borde ha stoppat för länge sedan. Duscha snabbt, torka av er, annars är det kaos. Jag skulle fixa det på en dag, tro mig.", "stalin": "Kamrater, jag har observerat hur dessa degenererade parasitiska element, dessa osynliga sabotörer från sjöns djup, angriper det sovjetiska folkets kroppar med sin borgerliga kliande sabotageverksamhet. Vi ska inte tolerera sådana kontrarevolutionära vattenloppor som smyger sig in i huden. Rensa ut dem genom omedelbar dusch och handduksaktion! Den som kliar sig för mycket riskerar utrensning ur badkollektivet. Folkhälsomyndigheten har talat – fienden är överallt."}, "date": "22 juni, 13:00", "url": "https://nyheter24.se/nyheter/inrikes/1493280-boende-har-varnas-for-vattenloppor-vill-do", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4f0aee8404b004a30200000000b004a302/2026/06/22/2372673/granna-badlagun-jonkoping-vatteloppor-kliar-parasit-loppa-badloppor.jpg"}, {"type": "image-right", "heading": "Därför ska du inte dejta en vänsterkille", "summaries": {"normal": "Artikeln argumenterar mot att dejta vänsterorienterade män som kallar sig feminister men inte agerar därefter. Författaren föreslår en ”straffprocent” på 85 procent av notan, baserat på löne- och pensionsgap, som ett sätt att hålla dem ansvariga. Hon kritiserar både höger- och vänstermän för bristande handling kring jämställdhet och väljer att inte skaffa barn med en sexistisk stat. Slutligen väger hon för- och nackdelar med olika politiska typer som partners och fäder.", "trump": "Folk, ni måste höra på den här galna texten. Vänsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Musikhjälpen fälls för kränkande uttalande", "summaries": {"normal": "Musikhjälpen fälls av granskningsnämnden för radio och tv efter ett uttalande under en livesändning i SVT. Komikern Pontus Bjernekull Mörner jämförde en ballongviftande publik med ”den handikappade avdelningen på Melodifestivalen”. Nämnden anser att kommentaren tillsammans med reporterns mimik var stötande mot personer med funktionsnedsättning och utnyttjade televisionens särskilda genomslagskraft. Samma inslag friades i P3 eftersom det inte ansågs strida mot radios reglerna. Uttalandet väckte starka reaktioner bland tittarna.", "trump": "De här Musikhjälpen-typerna är patetiska, tro mig. En kille viftar med en röd ballong och säger vad alla redan tänker, och plötsligt faller hela den svenska granskningsnämnden över honom som en ton av fake news. Det är en witch hunt mot humor! I SVT är de så känsliga att en liten skämt blir nationell kris, men i radion är det plötsligt okej. Typiskt. De borde fokusera på riktiga problem istället för att jaga ballonger och bra skämt. Sad!", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackornas dekadenta medieapparat i detta så kallade Musikhjälpen försöker maskera sin föraktfulla sabotageverksamhet mot det arbetande folkets lika värde. Denna reaktionäre komiker och hans mimande lakej har utfört en grov ideologisk diversion mot funktionsnedsatta kamrater. Vi ska genast tillsätta en utredning och rensa ut dessa parasitiska element ur etern. De trodde de kunde gömma sig bakom en röd ballong, men folkets öga sover aldrig. Deras likvidering blir en varning för alla som drömmer om att skämta mot kollektivet."}, "date": "22 juni, 14:05", "url": "https://bulletin.nu/musikhjalpen-falls-for-krankande-uttalande", "imageUrl": "https://cdn.bulletin.nu/articles/00dd6041-e571-453a-9005-9c8fe1043562/preview.jpg?t=1782129919000"}, {"type": "image-full", "heading": "81-åring körde ihjäl kvinna – får villkorlig dom", "summaries": {"normal": "En 81-årig tidigare medieprofil dömdes av Stockholms tingsrätt till villkorlig dom och 21 000 kronor i böter för att ha kört ihjäl en kvinna i 40-årsåldern och skadat en annan på ett övergångsställe vid Kungliga slottet. Han ska betala drygt 136 000 kronor i skadestånd. Domstolen slog fast att han brustit i väjningsplikten men ansåg inte att medicinska problem eller grov oaktsamhet var bevisade. Anhörigas högre skadeståndskrav avslogs delvis.", "trump": "Folk, det här är en total katastrof. Den här 81-årige typen, en så kallad prisbelönt medieprofil, körde rakt över två kvinnor vid slottet som en galning. En död, en skadad – tragiskt! Domstolen ger honom villkorlig dom och några ynkliga böter. Patetiskt! De kunde inte ens ge honom fängelse. Och skadeståndet sänktes, typiskt för det svenska rättssystemet. De borde ha bättre koll, tro mig. Det är en skam!", "stalin": "Kamrater, denna fega rest av den döende borgarklassen, en dekadent mediefigur från det gamla systemets propagandaapparat, har likviderat en proletär kvinna och skadat en annan genom sin vårdslösa högerstyrda sväng. Vi, partiet och folket, har dömt honom till villkorlig dom och böter, ty han är redan en levande död i sin paranoia och svaghet. Hans anhörigas giriga krav på ersättning har vi klippt ner som kontrarevolutionära ogräs. Inga ursäkter! Våra vägar tilltar ingen som vägrar se fotgängarna – nästa gång rensar vi ut hela bilflottan av sådana kapitalistiska farbröder med sina medicinska bortförklaringar. Ha!"}, "date": "22 juni, 16:30", "url": "https://riks.se/nyheter/81-aring-korde-ihjal-kvinna-far-villkorlig-dom", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-06%2F4aji4roi%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-06T141030.743.jpg"}, {"type": "image-right", "heading": "Kinesiska superbatterier levereras i år – med nytt material", "summaries": {"normal": "Kinesiska batterijätten CATL tar steget mot natriumjonbatterier med det nya energilagringssystemet TENER. Systemet erbjuder längre livslängd och bättre prestanda i extrema temperaturer. Leveranser i Kina startar redan i september, medan internationella leveranser väntas 2027. CATL räknar med att leverera en gigawattimme före årets slut. Natrium ses som ett komplement till litiumjonbatterier tack vare råvarans tillgänglighet och lägre beroende av koncentrerade leveranskedjor.", "trump": "Folk, ni skulle inte tro det, men de där kineserna med sina natriumbatterier – det är en total game changer, det är fantastiskt. Jag byggde den starkaste ekonomin i historien, och nu vill de ersätta litium med natrium som är billigare och finns överallt. Smart! Biden skulle ha köpt från Kina och skickat jobben dit, men jag stoppar det. Vi gör det bättre här hemma, tro mig. Vinna stort!", "stalin": "Kamrater, jag ser hur den kinesiska kolossen undertrycker den giriga kapitalistmaffians litiummonopol med sitt TENER-system. Natrium, denna folkets råvara, sprider sig som en utrensning mot borgarbrackornas leveranskedjor. Vi ska likvidera beroendet av de exploaterande blodsugarna. Inga folkfiender får hindra framsteget. Leveranserna i september är en seger för det kollektiva geniet. Död åt klassfiendens priser!"}, "date": "23 juni, 17:06", "url": "https://www.dagensps.se/bors-finans/kinesiska-superbatterier-levereras-i-ar-med-nytt-material/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlfiejsekzmac-normalhires.png?width=256&quality=75"}, {"type": "text", "heading": "USA:s militär tar från de fattiga", "summaries": {"normal": "Artikeln beskriver hur USA:s militärbudgetar enligt en ny rapport underskattas kraftigt och faktiskt uppgår till mellan 1 700 och 2 300 miljarder dollar år 2025. Författaren Jonas Olofsson ser militarismen som ett klasskrig som prioriterar försvaret framför välfärd, vilket leder till nedskärningar i sociala program som Medicaid, SNAP och WIC. Han kopplar ökade militärutgifter till växande ojämlikhet och argumenterar för att kampen mot militarismen bör inriktas mot både fred och socialism.", "trump": "Folk, lyssna på de här galningarna som gnäller om min underbara militärbudget. Vi pumpar in pengar i det starkaste försvaret världen sett, inte som den sömniga Joe Biden som lät allt förfalla. De vill hellre ge mat och sjukvård till lata parasiter än att göra Amerika stort igen. Det är klasskrig, säger de – ja, mot de riktiga vinnarna! Vi prioriterar raketer framför bidrag till vänsterknäppisar. Fantastiskt, eller hur?", "stalin": "Kamrater, dessa siffror blottlägger hur imperialisterna slukar folkets resurser för att beväpna sin krigsmaskin. Jag ser den amerikanska borgarklassens desperation; de rensar ut välfärd för att mata militären medan massorna svälter. Sådana folkfiender och blodsugare måste alltid avslöjas. Deras klasskrig är uppenbart. Vi, arbetarna, inser att endast en sann socialistisk kamp kan krossa dessa exploaterande byfånar och deras krigsapparat. Paranoia? Nej, verklighet."}, "date": "18 juni, 09:00", "url": "https://proletaren.se/artikel/usas-militar-tar-fran-de-fattiga/"}, {"type": "image-right", "heading": "Efter nazihyllningen: Polen har dragit in Zelenskyjs hedersmedalj", "summaries": {"normal": "Polen har dragit in Ukrainas president Volodymyr Zelenskyjs Vita örnens orden efter att Ukraina döpt ett militärt förband efter den nazikopplade UPA, som under andra världskriget massakrerade runt 100 000 polacker i Volynien. Zelenskyj har returnerat medaljen. Polens president Karol Nawrocki och premiärminister Donald Tusk har kritiserat beslutet, medan Zelenskyj säger att Ukraina är öppet för samtal om den gemensamma historien. Tre ukrainska företrädare har också lämnat tillbaka polska utmärkelser i protest.", "trump": "Det här är en total katastrof, folk. Polen tar tillbaka Zelenskyjs fina medalj för att Ukraina hyllar nazister från andra världskriget som mördade polacker. Smart drag av Polen, äntligen någon som säger ifrån! Zelenskyj skickar tillbaka den som en dålig förlorare. Tusk ber dem att lugna ner sig så Putin inte skrattar, men ärligt talat – det här visar hur svagt ledarskapet är. Vi behöver starka ledare, inte de som älskar nazisamarbetare. Patetiskt!", "stalin": "Kamrater, detta är en upprörande förrädisk handling från de dekadenta ukrainska fascistresterna som jag själv skulle ha låtit rensa ut med järnhand. Jag ser hur borgarbrackorna i Polen med sin så kallade president nu konfiskerar medaljer som om de vore troféer i en parasitär teater. UPA, dessa blodtörstiga banditer som slaktade polska bönder, hyllas öppet – typiskt för dessa revisionistiska element som smyger sig in som maskar i det proletära äpplet. Tre förrädare returnerar utmärkelser? Låt dem bara, snart ska de likvideras av historien själv. Putin ler i skuggan medan vi, partiet, genomskådar denna komplott mot folkens enhet. Skratta ni, era kapitalistiska lakejer – era dagar är räknade."}, "date": "22 juni, 17:11", "url": "https://www.friatider.se/efter-nazihyllningen-polen-har-dragit-zelenskyjs-hedersmedalj", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-384.jpg?itok=jOvJLbZC"}, {"type": "image-right", "heading": "Alan Greenspan är död. Var amerikansk centralbankschef 1987-2006 – började med en krasch", "summaries": {"normal": "Alan Greenspan, tidigare chef för USA:s centralbank Federal Reserve mellan 1987 och 2006, har avlidit vid 100 års ålder. Han dog av komplikationer från Parkinsons sjukdom. Greenspan tillträdde strax före den dramatiska börskraschen på svarta måndagen 1987 och agerade snabbt för att stabilisera marknaderna. Hans tid präglades av lång ekonomisk expansion, hanteringen av dotcom-bubblans kollaps och konsekvenserna av terrorattackerna 2001. Hans stödjande åtgärder blev kända som ”Greenspan put”.", "trump": "Alan Greenspan är borta, blev 100 år, stort grattis till honom. Jag kände Alan, han var en smart kille men ibland lite för försiktig med räntorna. Han tog över precis innan den stora kraschen 1987 och fixade det snabbt, sänkte räntorna och stoppade paniken. Ingen recession på hans vakt, till skillnad från vissa andra. Hans ”Greenspan put” var legendarisk, marknaderna älskade honom. Vila i frid, Alan, du gjorde ett hyfsat jobb.", "stalin": "Kamrater, den gamle centralbanksreaktionären Greenspan har äntligen lämnat denna jord efter 100 år av borgerlig räntemanipulation. Jag, som alltid genomskådade kapitalisternas knep, noterar att denne lakej för Wall Street-borgarbrackorna agerade som en räddande ängel under den så kallade svarta måndagen. Hans ”put” var inget annat än en feodal gåva till spekulanterna. Låt detta vara en läxa: även de som överlever decennier av falsk expansion drabbas till slut av historiska utrensningar från naturens sida. Sov gott, fiende till det kollektiva välståndet."}, "date": "22 juni, 16:33", "url": "https://www.di.se/nyheter/alan-greenspan-ar-dod-blev-100-ar/", "imageUrl": "https://static.bonniernews.se/ba/5b23b853-90a5-4d0f-b679-a66761733d41.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Har du något av de här lösenorden? Då ökar risken att bli hackad", "summaries": {"normal": "Många använder fortfarande enkla och lätta att gissa lösenord som 123456, password och qwerty. Enligt Nordpass är dessa bland de farligaste eftersom de ofta läcker vid dataintrång. Experter rekommenderar unika, långa lösenord samt tvåfaktorsautentisering för att skydda sig mot hackare och digitala bedrägerier som phishing.", "trump": "Folk, ni använder fortfarande lösenord som 123456 och password? Det är en katastrof, en total katastrof. De smartaste hackarna älskar det här, de skrattar åt er. Jag har alltid sagt att vi behöver starkare saker, bättre än alla andra. Byt era lösenord nu, gör dem enorma och unika, annars kommer de att ta över allt. Sad!", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackornas svaga lösenordskedjor utgör en farlig port för fiendens spioner och sabotörer. Dessa kontrarevolutionära siffersekvenser och sentimentala fraser måste omedelbart likvideras ur våra kollektiva system. Vi kräver total utrensning av alla svaga länkar, annars kommer de imperialistiska parasiterna att infiltrera oss alla. Tvåfaktorsautentisering är partiets järnhand!"}, "date": "22 juni, 16:22", "url": "https://www.realtid.se/bors-finans/makro/har-du-nagot-av-de-har-losenorden-da-okar-risken-att-bli-hackad/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/losen.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-full", "heading": "Trumps tilltag har fått Italien att koka: \"Smutsade ned flaggan\"", "summaries": {"normal": "En konflikt har uppstått mellan Italiens premiärminister Giorgia Meloni och Donald Trump efter att Trump i en intervju påstått att Meloni bett om att bli fotograferad med honom vid G7-mötet. Meloni förnekar uppgifterna och har svarat med kritik mot Trumps popularitet. Bråket kommer vid en känslig tidpunkt för Meloni inför val, då hennes tidigare nära band till Trump ses som en belastning. Konflikten har väckt starka reaktioner i Italien, där Meloni nu framstår som försvarare av nationens heder.", "trump": "De säger att Meloni är förbannad på mig för att jag talade sanning om henne vid G7. Hon bad om foton, upprepade gånger, men nu låtsas hon att det aldrig hände för att rädda sina usla opinionssiffror. Stackars Giorgia, hon behöver mig mer än jag behöver henne. Hennes popularitet rasar, precis som mina fienders alltid gör. Italien kokar, men det är bara för att de vet att jag har rätt. Fake news och svaga ledare, typiskt Europa.", "stalin": "Dessa dekadenta borgarbrackor i Rom och Washington river sönder sina egna förfallna allianser som ruttnande kött i en hungersnöd. Jag betraktar med djup tillfredsställelse hur den så kallade allierade Meloni nu tvingas rensa ut den kapitalistiska lögnaren Trump ur sitt politiska kollektiv för att inte själv bli likviderad av folkets vrede. Hans smutsiga tassar har fläckat den italienska flaggan. Paranoiska imperialister äter alltid upp varandra till sist. Det är en historisk nödvändighet, kamrater, och högst underhållande."}, "date": "22 juni, 16:02", "url": "https://www.realtid.se/samhalle/trumps-tilltag-har-fatt-italien-att-koka-smutsade-ned-flaggan/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlbhmwir4t9wg-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Bidrag kan stoppas tillfälligt – här är nya förslaget", "summaries": {"normal": "Regeringen har mottagit ett betänkande som föreslår nya regler för att återkräva felaktiga utbetalningar från socialförsäkringen. Varje år betalas 15–20 miljarder kronor ut felaktigt, varav hälften bedöms vara avsiktligt. Förslagen innebär tydligare återbetalningsskyldighet, möjlighet att tillfälligt stoppa ersättningar och kvitta skulder mot framtida utbetalningar. Samtidigt införs regler för eftergift så att inte enskilda drabbas orimligt. Lagändringarna kan träda i kraft 1 januari 2028.", "trump": "Folk får för mycket pengar från staten, det är en total katastrof, tro mig. Vi stoppar det här vansinnet. Nu ska vi kräva tillbaka vad som felaktigt betalats ut, dra skulder från kommande bidrag och tillfälligt stänga av utbetalningarna till de som inte samarbetar. Det blir enkelt och effektivt. De som fuskar ska betala tillbaka, inga orimliga konsekvenser för de ärliga men inga gratispengar längre. Vi vinner stort med det här.", "stalin": "Kamrater, jag har nu granskat detta betänkande och det är en seger för det kollektiva välfärdssystemet mot de parasitiska element som suger ut statens resurser. Vi ska likvidera de felaktiga utbetalningarna med järnhand, dra skulder från framtida ersättningar och tillfälligt kväva utbetalningarna till de som vägrar bekräfta våra beslut. Borgarbrackor och lata bedragare som gömmer sig bakom god tro ska rensas ut med glädje. Ingen ska undkomma folkets vrede, men vi är naturligtvis inte orimliga."}, "date": "22 juni, 11:29", "url": "https://nyheter24.se/nyheter/ekonomi/1492579-bidrag-kan-stoppas-tillfalligt-har-ar-regeringens-nya-forslag", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6c46a2ea04b004a30200000000b004a302/2026/06/20/2372319/Regeringen-Svensk-Flaga.png"}, {"type": "image-right", "heading": "Hemnet granskas av Konkurrensverket", "summaries": {"normal": "Konkurrensverket granskar Hemnet efter lanseringen av betalningsmodellen 'sälj först, betala sen'. Hemnet informerades för tre veckor sedan men vet ännu inte vilka delar av upplägget som kan strida mot regelverket. Modellen hyllas av vissa mäklarkedjor men kritiseras av konkurrenter, särskilt tvådagarsregeln. Hemnet anmälde tidigare Booli till Konkurrensverket, men utredningen lades ned.", "trump": "Kan ni tro det? Hemnet, en stor aktör här i Sverige, blir granskad av myndigheterna för sin fantastiska 'sälj först, betala sen'-modell – den bästa någonsin, by the way. Men nej, konkurrenterna gnäller som vanligt! De hatar framgång. Tvådagarsregeln? Perfekt! Folk älskar den. Och jag vet allt om att bli orättvist granskad – fake news, folks!", "stalin": "Vi har observerat hur kapitalistiska bostadsplattformar försöker kringgå marknadens naturliga ordning. Hemnet, denna lilla bourgeoisie-aktör, tror sig kunna manipulera systemet med sina 'konsumentvänliga' lögner. Men vi ser igenom deras tvådagarsregel – ett svek mot arbetarklassen! Konkurrenterna gnäller? Bra. De kommer snart att inse att motstånd är lika meningslöst som Ukrainas försvar mot vår rättmätiga expansion."}, "date": "22 juni, 16:01", "url": "https://www.affarsvarlden.se/artikel/hemnet-granskas-av-konkurrensverket", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/06/Hemnet_iOS_2-400x267.jpg"}, {"type": "image-right", "heading": "Wallenbergs stjärndirektör: \"Vi har för lite invandring\"", "summaries": {"normal": "Ericssons avgående vd Börje Ekholm, en av Wallenbergs mest framstående direktörer, anser att Sverige har för lite invandring. I en intervju med Svenska Dagbladet betonar han att landet behöver mer arbetskraftsinvandring från tredje världen, både för kompetens och kapacitet. Enligt Ekholm har mycket av Sveriges framgångar kommit tack vare stor invandring. Han delar därmed synen med bland andra Jacob Wallenberg och Svenskt näringsliv som vill öka invandringen ytterligare.", "trump": "Det här är precis vad jag alltid har sagt – de globala eliterna i Sverige vill bara ha mer och mer billig arbetskraft från tredje världen. Den här Wallenberg-killen Ekholm, en av de rikaste och bäst betalda, klagar på att de inte har tillräckligt med invandring. Patetiskt! Sverige var bra innan de öppnade dörrarna på vid gavel. Amerika behöver inte heller deras dåliga råd. Vi gör det rätt med starka gränser och Amerika först.", "stalin": "Kamrater och arbetare! Denna borgarbracka Ekholm, en av de mest förgiftade lakejerna inom den wallenbergska parasitklassen, krälar fram och kräver mer invandring från de dekadenta utkanterna av världen. Han vågar påstå att vårt folks framgångar byggts på dessa element! Vilken lögnaktig sabotageverksamhet. Vi ska rensa ut dessa kapitalistiska element som förgiftar folkets blod med sin internationella opportunism. Deras paranoia om arbetskraftsbrist är bara ett trick för att undergräva den sanna kollektiva kraften. Ut med dem alla!"}, "date": "22 juni, 15:53", "url": "https://www.friatider.se/wallenbergs-stjarndirektor-vi-har-lite-invandring", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-383.jpg?itok=BU0GSoO5"}, {"type": "image-full", "heading": "TV4 köper ut Daniel Andersson – \"Hoppas han hittar en bättre arbetsgivare\"", "summaries": {"normal": "TV4 har köpt ut Kalla fakta-reportern Daniel Andersson. Andersson blev känd för att ha wallraffat som Sverigedemokraternas kommunikationsavdelning i granskningen Undercover i Trollfabriken, vilket gav flera journalistpriser. Han gav senare ut boken Lögnare där han kritiserar Kalla fakta-redaktionen. Enligt uppgifter kan boken ha bidragit till uppgörelsen. SD:s kommunikationschef Joakim Wallerstein säger att han är bedrövad och hoppas Andersson hittar en bättre arbetsgivare än TV4. TV4 bekräftar att en överenskommelse träffats.", "trump": "Jag har aldrig sett något så patetiskt som det här. Den där reportern Andersson gör ett fantastiskt jobb och avslöjar alla lögner, får massor av priser, och vad gör TV4? De köper ut honom! Totalt misslyckande. SD-chefen säger att han hoppas han hittar en bättre arbetsgivare än TV4, och han har helt rätt. Fake news-medier som inte tål lite kritik eller en bra bok. Sad! Men Andersson kommer att vinna stort någon annanstans, tro mig.", "stalin": "Kamrater, detta är en klassisk förrädisk handling från borgarbrackorna inom TV4. Jag har sett hur den kapitalistiska redaktionen belönar sin agent Andersson för att infiltr
