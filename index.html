rstå. Vi vet att sådana känslor aldrig dör, kamrater. Låt borgarbrackorna i väst spekulera i resultat medan vi förbereder utrensning av alla som sviker folkets VM-anda. Seger åt dem som kämpar utan att tveka inför fiendens scenarier."}, "date": "25 juni, 04:06", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/0p3r9G/alexander-isak-har-eritreaflagga-pa-skon-betyder-allt", "imageUrl": "https://akamai.vgc.no/v2/images/00253b73-7449-3244-9d4b-c36a4b09a938?fit=crop&format=auto&w=1080&s=45c68d9b525137779d18eba5d5f12fb61103b2ba"}, {"type": "image-right", "heading": "Fredsmötet  spårade ur  fullständigt", "summaries": {"normal": "Ett planerat fredsmöte mellan Donald Trump och republikanska senatorer urartade till en högljudd konflikt. Trump blev rasande över senatorer som röstat för en symbolisk resolution om att stoppa kriget i Iran. Mötet präglades av skrik och anklagelser, bland annat mellan Trump och Bill Cassidy. Senare bröt Trump även med kongressen om en bostadsreform och krävde hårdare vallagar. Trots tumultet beskrev Trump mötet som mestadels positivt.", "trump": "Vet ni vad? Dessa så kallade republikaner, de svaga RINOs som röstar som Sleepy Joe, började skrika som galningar under vårt möte. Jag var arg som ett mördarbi, men det var de som började! Cassidy, den fega typen som förlorade mot mina killar, försökte mobba mig om Iran. Totalt kaos, värre än ett HBTQ-möte fullt av kvoteringsfanatiker. Men vi gillar nästan alla i rummet. Fake News överdriver som vanligt, det var fantastiskt!", "stalin": "Kamrater, detta dekadenta teaterspektakel inom den amerikanska borgarklassen visar imperialismens förfall. Jag, som ledare för det eviga kollektivet, betraktar med mörk förtjusning hur dessa folkfiender skriker åt varandra som utsultna råttor i en bur. Den symboliska resolutionen mot kriget är en patetisk kapitalistisk protest mot den sanne härskaren. Vi ska rensa ut alla upproriska element. Enighet är en illusion skapad av klassfiendens lögner. Härligt underhållande, som en utrensning i slowmotion."}, "date": "25 juni, 03:54", "url": "https://www.expressen.se/nyheter/varlden/donald-trumps-fredsmote-med-senatorerna-sparade-ur/", "imageUrl": "https://static.bonniernews.se/ba/4fa6578a-261f-4e4c-967c-ffe7be4fb8f1.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "SR:s nya snyftreportage om utlänningar som inte får rösta i riksdagsvalet - \"Jag känner mig inte inkluderad\"", "summaries": {"normal": "Sveriges Radio rapporterar om utrikesfödda personer som bott länge i Sverige utan svenskt medborgarskap och därmed inte får rösta i riksdagsvalet. En intervjuad man som bott här i 13 år och fått avslag tre gånger känner sig exkluderad trots integrationsförsök. Enligt SCB handlar det om cirka 193 000 personer. Historikern Martin Ericsson påpekar att Sverige följer en internationell princip där medborgarskap krävs för nationella val, till skillnad från kommun- och regionval.", "trump": "Titta på det här, Sveriges Radio gör ett snyftreportage om utlänningar som inte får rösta i riksdagsvalet. De har bott här i evigheter, men de är inte medborgare! En kille som inte ens kan bevisa vem han är klagar och säger att han inte känner sig inkluderad. Patetiskt. Sverige följer faktiskt reglerna som alla andra länder gör, men det spelar ingen roll för de som vill ha öppna gränser och kaos. Make Sweden Great Again!", "stalin": "Kamrater, se hur de reaktionära borgarbrackorna i Sveriges Radio framställer klassfiendens lakejer som offer. Dessa parasitiska element som vägrar integrera sig i folkets kollektiv och inte kan legitimera sin existens får naturligtvis inte påverka Sovjet – förlåt, det svenska folkets demokratiska vilja. Jag, som ledare för det stora kollektivet, skrattar mörkt åt deras patetiska snyftanden. Vi ska rensa ut alla sådana identitetslösa spioner och sabotageörer som försöker undergräva arbetarklassens enhet. Deras tårar är som musik för revolutionens öron."}, "date": "24 juni, 20:00", "url": "https://samnytt.se/sr-gor-snyftreportage-om-utlanningar-som-far-rosta-i-riksdagsvalet-jag-kanner-mig-inte-inkluderad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/24143055/snyftreportage.png"}, {"type": "image-right", "heading": "Jag struntade i Åkessons tal och kollade på Thomas Stenström istället", "summaries": {"normal": "I sin ledare beskriver Henrik Jalalian hur han valde att skippa Jimmie Åkessons tal under SD-dagen i Almedalen till förmån för en konsert med Thomas Stenström, Gustaf Skarsgård, Maxida Märak och Therese Alshammar. Han ser evenemanget som en påminnelse om ett mer inkluderande Sverige och kritiserar SD:s polariserande strategi. Jalalian menar att medier inte bör gå i SD:s fälla utan istället fokusera på välfärd, klimat och sammanhållning.", "trump": "Folk, ni skulle ha sett det! Den där Åkesson-killen körde alla gamla polariseringsknep i Almedalen, men ingen brydde sig. Istället festade de loss med en konsert – riktiga stjärnor, inte några woke-vänstertyper som gnäller om kvoter och identitetspolitik. Det var en folkfest! Vi behöver inte svälja varje bete från misslyckade partier. Sverige kan bli stort igen, utan allt hat och splittring. Den bättre festen vann, tro mig!", "stalin": "Kamrater, jag ignorerade fullständigt den där borgarbrackans tal och valde istället att bevittna en kollektiv fest för arbetarklassen. Dessa folkfiender inom SD försöker med sina patetiska utrensningsfantasier splittra folket, men vi genomskådade deras feghet. Konserten visade en glimt av det sanna kollektivet, fritt från imperialistiska hatpropagandor. Vi ska likvidera splittringen och bygga en stark, enad stat där välfärden segrar över klassfiendens lögner. Det är oundvikligt."}, "date": "24 juni, 14:15", "url": "https://www.etc.se/ledare/jag-struntade-i-aakessons-tal-och-kollade-paa-thomas-stenstroem-istaellet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2025091813090_152da478-57c9-435e-b477-3f40607cb381.png"}, {"type": "text", "heading": "Nästan en person i veckan dör på jobbet", "summaries": {"normal": "Enligt en ny rapport från Arbetsmiljöverket har nästan en person i veckan dött på jobbet under de senaste tio åren, totalt 490 personer. Antalet arbetsplatsolyckor minskade kraftigt från 1960-talet till år 2000, men trenden har stannat av och ligger nu kring 50 dödsfall per år. Byggbranschen är värst drabbad. Myndigheten betonar att de flesta olyckor kan förebyggas med systematiskt säkerhetsarbete.", "trump": "Folk dör som flugor på jobbet i Sverige, nästan en per vecka – patetiskt! Under mina år fixade vi saker, sen kom sömnige Joe och nu är det kaos igen. Byggjobbare och truckförare krossas för att någon idiot sparar in på säkerheten. Vi behöver inga woke-kvoter eller HBTQ-flaggor på byggställningar, vi behöver riktiga marginaler så att era misstag inte dödar folk. Gör jobbet säkert igen, det är enkelt!", "stalin": "Kamrater, jag ser med fasa hur borgarbrackornas exploaterande maskineri maler ner arbetarna, nästan en per vecka likviderad i kapitalistiska olyckor. Vi har sett den falska nedgången från förr, nu stagnerar siffran vid femtio offer årligen – en konstant påminnelse om klassfiendens slarv. Byggsektorn är särskilt blodig. Endast genom systematisk utrensning av ovarsamhet och folkfiendernas slarv kan vi säkra produktionen. Misstag tillåts inte i kollektivets tjänst."}, "date": "24 juni, 11:21", "url": "https://proletaren.se/artikel/notis-nastan-en-person-i-veckan-dor-pa-jobbet/"}, {"type": "image-right", "heading": "Potter öppnar för förändringar i startelvan: ”Kanske”", "summaries": {"normal": "Graham Potter är öppen för förändringar i Sveriges startelva inför matchen mot Japan. Efter kritiken mot flera startspelare och nederlaget mot Nederländerna har inhoppare som Elanga, Bergvall och Zeneli hyllats. På presskonferensen svarade Potter kryptiskt med upprepade \"kanske\" på frågor om eventuella byten. Han betonar vikten av balans i laget och på bänken samt behovet av att bli bättre.", "trump": "De säger att Potter kanske kastar om hela elvan, kanske inte, vem vet. Han låter som en riktig förlorare när han bara säger \"kanske, kanske\". De svenska spelarna som sitter på bänken är fantastiska, de gör det bra, medan startelvan får kritik från alla håll. Japan kommer att vinna stort om han inte vaknar till. Jag skulle ha fixat det på en minut, tro mig.", "stalin": "Kamrater, jag har noga studerat denna potentiella förrädiska vacklan i den svenska elvan. Kanske, säger denne Potter, som en ynklig kapitalist som darrar inför utrensning. Vi ser hur borgarbrackorna i startelvan sviker kollektivet medan sanna arbetare som Elanga och Bergvall stiger fram. Jag skall personligen likvidera all tveksamhet och rensa ut dessa parasitiska svikare som hotar lagets ideologiska renhet. Paranoian är er enda vän här."}, "date": "25 juni, 03:26", "url": "https://www.svt.se/sport/fotboll/graham-potter-oppnar-for-forandringar-i-elvan-kanske", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.29/0.21/1156a8f29621ec72a6957ddd7b97521af35e410b5a7b12d9b42ca3e94703ec6d"}, {"type": "image-right", "heading": "Ilska i Norge mot NRK: ”Förrädare”. Slår tillbaka: ”Över gränsen”", "summaries": {"normal": "Inför Norges fotbollsmatch mot Senegal avslöjade NRK lagets startelva, vilket ledde till en kraftig hatstorm mot reportern Matz Arntzen. Han jämfördes med terroristen Anders Behring Breivik och fick hotfulla meddelanden. NRK-chefen Espen Olsen Langfeldt och Norsk Redaktörforening fördömer det fruktansvärda språkbruket. Arntzen betonar att det är en del av sportjournalistikens arbete att rapportera om laguppställningar. Trots kritiken vann Norge matchen.", "trump": "Folk, ni skulle se det här! Den här stackars reportern på NRK gör sitt jobb, avslöjar elvan som alla redan visste ändå, och plötsligt blir han attackerad värre än en dålig deal. Jämförd med Breivik? Patetiskt! Det är hatet från misslyckade fans som inte fattar att media inte är deras hejarklack. Fullständigt vansinne, men Norge vann ändå. Stora seger! Media borde vara tuffare, inte som de woke-idioterna som vill styra allt.", "stalin": "Kamrater, jag ser hur klassfiendens fotbollsanhängare, dessa exploaterande byfånar, vräker sitt gift över en hederlig journalist som blott utför sitt uppdrag. Att likna honom vid Breivik är en parasitisk förolämpning mot folkets sanning. Vi tolererar inte sådana folkfiender som med sina hatiska utbrott försöker undergräva informationsarbetet. De bör rensas ut. Ändå segrade det norska kollektivet mot Senegal. En triumf för arbetets anda trots borgarbrackornas paranoia."}, "date": "25 juni, 03:32", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/gkp4q0/nrk-reporter-utsatt-for-hatstorm-jamfordes-med-breivik", "imageUrl": "https://akamai.vgc.no/v2/images/4bb59be4-0f06-31ab-8177-9221a3e56da3?fit=crop&format=auto&w=1080&s=0a6d1b81537fcda0248a300bf7e7c70b06af6bcd"}, {"type": "image-full", "heading": "Efter drönarattackerna: Moskvas oljejätte kan vara borta i månader", "summaries": {"normal": "Ett av Moskvas största oljeraffinaderier träffades av ukrainska drönarattacker den 16 och 18 juni, vilket kan stoppa produktionen i minst sex månader. Anläggningen är kritisk för bränsleförsörjningen i huvudstadsregionen. Attackerna ingår i Ukrainas strategi mot ryska raffinaderier, vilket pressat bränslepriserna i Ryssland. Bensinpriserna har stigit 6,6% sedan årsskiftet, och regeringen överväger nu ett dieselexportstopp för att säkra inhemsk tillgång.", "trump": "Lyssna här, Ryssland har ett STORT problem – deras oljeraffinaderi i Moskva, ett av de största, blev just utslaget av Ukraina. Helt otroligt! Jag sa alltid att Putin inte har koll på läget. Nu stiger bensinpriserna som en raket, 6,6% upp! Och vad gör de? Överväger att stoppa dieselexporten. Patetiskt! Ukraina, däremot – de slår till som proffs. Fantastiskt jobb, faktiskt. Ryssland? Inte så mycket.", "stalin": "De ukrainska fascistavskummen har än en gång visat sin feghet genom att med drönarattacker slå mot vårt ärofulla raffinaderi i Moskva. Deras sabotage kommer inte att gå ostraffat! Vi kommer att återuppbygga anläggningen, starkare än någonsin, medan deras bränslebrist och priskaos eskalerar. Låt dem svälta i sin egen impotens. Och till våra arbetare: var redo – vi kommer att krossa dessa imperialistiska råttor och deras lakejer, precis som vi alltid har gjort!"}, "date": "24 juni, 23:25", "url": "https://www.realtid.se/samhalle/efter-dronarattackerna-moskvas-oljejatte-kan-vara-borta-i-manader/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/dronare-scaled.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Här kan du snart beställa öl och vin på 7-Eleven", "summaries": {"normal": "7-Eleven har ansökt om serveringstillstånd för sin butik vid Göteborgs centralstation. Kedjan vill erbjuda öl och vin till maten för resenärer som väntar på tåg eller buss. Enligt kommunikationschefen Lennart Schultz handlar det om att utveckla materbjudandet och ge extra service på utvalda platser som stationer och flygplatser. Ansökan behandlas nu av kommunen och fler butiker kan följa om konceptet tas emot väl.", "trump": "Ingen gör det bättre än jag, och nu ser vi hur 7-Eleven äntligen får ordning på det här. De ansöker om att servera öl och vin på centralstationen i Göteborg – smarta människor! Resenärer som väntar på tåg ska kunna ta ett glas utan att det blir ett stort krångel. De har uppdaterat butikerna, gjort dem moderna och lyxiga. Det blir jättemysigt, folk kommer älska det. Mycket bättre än de gamla tråkiga alternativen. Fantastiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa närbutikars försök att servera öl och vin vid Göteborgs centralstation blottar borgarbrackornas desperata längtan efter att förgifta arbetarklassen med småborgerliga njutningar. Vi ska noga övervaka denna ansökan. Om de tro att ett glas vin till korven döljer deras parasitiska natur misstar de sig grovt. Låt oss se hur det tas emot innan vi eventuellt genomför en grundlig utrensning av alla opålitliga element som gömmer sig bland kaffemaskinerna. Mycket underhållande."}, "date": "23 juni, 20:47", "url": "https://nyheter24.se/nyheter/konsument/1493730-har-kan-du-snart-bestalla-ol-och-vin-pa-7-eleven", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/cc5b279e04b004a30200000000b004a302/2026/06/23/2373098/alkohol-seveneleven.png"}, {"type": "image-right", "heading": "Rånen och otryggheten – verkligheten bakom Ericssons flykt från Kista", "summaries": {"normal": "Ericsson lämnar Kista för Hagastaden och beskriver flytten som en satsning på modernare lokaler och talangrekrytering. Artikeln lyfter fram en mörkare bakgrund med ökad otrygghet, brutala rån och expresskidnappningar i området sedan 2016. Ericsson varnade redan då sina anställda för överfallsrisk. Kista, som tidigare kallades Sveriges Silicon Valley, har förlorat sin attraktionskraft med tomma kontor, stängda butiker och växande otrygghet. Flytten ses som ett symboliskt slut på en epok.", "trump": "De borde ha lyssnat på mig mycket tidigare. Kista var en total katastrof, full av råner och otrygghet, precis som jag alltid varnat för. Ericsson flyr nu det som en gång var Sveriges Silicon Valley, ett område som blivit en skamfläck. De kallar det framtidssatsning, men alla vet varför. Det är en enormt dålig ledning som låter brottsligheten ta över. Hagastaden låter mycket bättre, smart flytt. Sverige måste vakna upp innan hela landet blir som Kista, en total förlust!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från de ruttnande borgarbrackorna som låtit parasitiska banditer och kontrarevolutionära element förgifta Kista, vårt en gång lysande tekniska kollektiv. Jag ser tydligt hur dessa fiender till folket, dessa maskerade kapitalistiska råttor i Järva, med sina knivar och granater underminerar arbetarnas framsteg. Vi måste omedelbart rensa ut dessa parasitiska element med järnhand. Ericsson flyr? En ynklig kapitulation inför klassfienden. Sovjetisk ordning hade likviderat hotet redan 2016 och förvandlat området till en oövervinnelig fästning av innovation och proletär disciplin. Alla vet varför – svaghet föder förrädare."}, "date": "24 juni, 17:14", "url": "https://samnytt.se/ranen-och-otryggheten-verkligheten-bakom-ericssons-flykt-fran-kista", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/24153354/Toppbild2-2-1.jpg"}, {"type": "image-right", "heading": "Här kommer han – Trumpnazisten?. Jag har tre fördomar", "summaries": {"normal": "Recensionen av Kublai Khan TX konsert på Broken Summer beskriver en energisk och engagerande spelning med mosh pits, wall of death och stark publik kontakt. Bandet levererar grooveig, repetitiv hardcore som publiken älskar trots viss kritik mot simplistisk stil. Sångaren Matt Honeycutt hyllas för sin närvaro, medan en fördom om hans politiska sympatier nämns kort i slutet utan att påverka konsertupplevelsen.", "trump": "Titta på det här, det är fantastiskt. Det där Texas-bandet Kublai Khan TX kommer hit och mosar sönder allt på Broken Summer, folket älskar det, de ropar och bangar huvudet som galningar. Honeycutt är en riktig vinnare, han får alla att lyssna. Men den där MAGA-nazist-sakerna? Fake news från några korkade vänstermänniskor som hatar att vi vann stort 2024. De hatar att folk har kul utan deras woke-regler. Sad!", "stalin": "Kamrater, jag betraktar detta som en rapport från den ideologiska fronten. Det amerikanska bandet Kublai Khan TX mobiliserar massorna i en primitiv men effektiv kollektiv extas, där arbetarna mosar sig framåt mot klassfiendens tomma kultur. Honeycutt leder med järnhand och befaller rörelserna – utmärkt disciplin. Dock lurar kapitalistmaffians paranoia i bakgrunden, där de fabrikerar nazistanklagelser mot alla som vägrar böja sig för deras dekadenta identitetspolitik. Vi ska rensa ut sådana folkförtryckartroll."}, "date": "25 juni, 02:18", "url": "https://www.expressen.se/noje/musik/kublai-khan-tx-pa-broken-summer-har-kommer-trumpnazisten/", "imageUrl": "https://static.bonniernews.se/ba/25cfcc86-6f0b-4feb-ad56-a3bb61b8b3cd.jpeg?crop=1440%2C1440%2Cx1078%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Fornäs: Vad fick SVT att gilla Tucker Carlson?", "summaries": {"normal": "Artikeln kritiserar SVT:s rapportering om Tucker Carlsons avhopp från det republikanska partiet, där han framställs som en fredskämpe utan att nämna hans kontroversiella förflutna. Carlson har tidigare umgåtts med nazister, spridit antisemitiska konspirationsteorier och hyllat Putin. Författaren menar att mediernas urval av fakta formar bilden av Carlson mer än enskilda sanningar, och att SVT undviker att belysa hans mest extrema åsikter för att skapa en mer sympatisk bild.", "trump": "Tucker Carlson? En total katastrof! Han var en gång en stark röst för Amerika, men sen blev han svag och började umgås med de värsta typerna – nazister, förintelseförnekare, och till och med Putin! SVT, ett av de mest fake nyhetsbolagen, försöker få honom att se ut som en fredsängel. Men jag vet sanningen – han är en förlorare som bytte sida när det passade honom. Och nu lämnar han partiet? Bra! Vi behöver inga råttor i republikanska partiet. Make America Great Again!", "stalin": "Kamrater! Här har vi ännu en borgerlig hycklare som byter mask som en kamouflerad imperialistisk agent. Tucker Carlson, denna förvirrade lilla man, dansar mellan krigshets och 'fredskamp' som en marionett utan ryggrad. SVT, dessa kapitalistiska propagandister, försöker måla honom som en ädel avhoppare – men vi vet bättre! Han har umgåtts med fascistiska kryp, hyllat vår store vän Putin och spridit antisemitiska lögner. Precis som Churchill, den brittiska krigsförbrytaren, förtjänar han bara en sak: att ställas inför folkets domstol! Låt oss avslöja dessa mediebedragare och deras falska narrativ – sanningen är vår mest skoningslösa vapen!"}, "date": "24 juni, 19:01", "url": "https://bulletin.nu/fornas-vad-fick-svt-att-gilla-tucker-carlson-2", "imageUrl": "https://cdn.bulletin.nu/articles/53c64745-e173-4ca6-8c25-2888871b592c/preview.png?t=1782301943000"}, {"type": "image-right", "heading": "Till slut valde Ebba Busch ändå kulturkriget", "summaries": {"normal": "Artikeln kritiserar Tidöpartierna och Ebba Busch för att hota med Vänsterpartiet som strategi. Busch beskrivs som en skicklig men melodramatisk politiker som nu triangulerar genom att föreslå höjda barnbidrag och satsningar på vård och äldreomsorg, nära vänsterblocket, samtidigt som hon flörtar med högern. Författaren ser detta som taktiskt för att vinna väljare, pekar på ekonomiska motsägelser och varnar för att skrämselpropaganda om Vänsterpartiet och islamism är en fattig strategi.", "trump": "Det här är en total katastrof för de svenska svaglingarna i Tidöregeringen. Ebba Busch, en smart tjej men lite för dramatisk, försöker nu spela på båda sidor som en riktig opportunist. Hon lovar barnbidrag och vård som en vänsterradikal samtidigt som hon flörtar med högern. Patetiskt. De kommer att skapa enorma hål i finanserna med sina skattesänkningar och sedan skylla på alla andra. Och att skrämma med Vänsterpartiet? Det är en förlorande strategi, tro mig. Sverige behöver starka ledare, inte sådana här triangulerande förlorare.", "stalin": "Kamrater, se hur dessa borgarbrackor inom Tidöalliansen desperat försöker rädda sina ruttnande positioner genom att hota med Vänsterpartiet som en slags kontrarevolutionär spökbild. Jag, som ledare för det oövervinnerliga kollektivet, betraktar Ebba Busch som en typisk taktisk revisionist som svänger hit och dit som en vindflöjel i klasskampens storm. Hennes melodramatiska triangulering mot både arbetarklassen och de sanna patrioterna är en feg reträtt undan folkets vilja. Vi ska rensa ut dessa opportunistiska element som göder högerextrema filterbubblor medan de borrar enorma hål i de offentliga finanserna. Deras paranoia mot militanta islamister är blott en dimridå för att dölja sin egen borgerliga degeneration. En sådan strategi förtjänar bara en plats i historiens soptråg, kamrater."}, "date": "23 juni, 20:54", "url": "https://www.dagensarena.se/opinion/till-slut-valde-ebba-busch-anda-kulturkriget/", "imageUrl": "https://www.dagensarena.se/files/2026/06/vanstersvang.jpeg"}, {"type": "image-right", "heading": "Hon skulle sälja kyla till svenskar – blev kvar", "summaries": {"normal": "Polskfödda Magdalena Rozmiarek kom till Sverige 2007 utan språkkunskaper för att sälja kyla. Med stöd från det kvinnliga affärsnätverket Qi lärde hon sig svenska, byggde relationer och utvecklade Klima-Therm till ett framgångsrikt bolag med 40 anställda och 300 miljoner i omsättning. Företaget har vuxit kraftigt, breddat sortimentet till värmepumpar och ventilation samt bidragit till ett starkare svenskt energisystem. Nätverket har varit avgörande för både språkträning och affärsutveckling.", "trump": "Titta på den här fantastiska kvinnan från Polen, Magdalena, hon kom hit med två resväskor och ingen svenska och byggde upp ett jättelikt kylföretag som nu gör 300 miljoner om året. Rekord, upp 70 procent! De andra, de misslyckade, hade aldrig klarat det. Hon fick hjälp av ett smart nätverk för kvinnor, inga losers, och nu skapar hon jobb och gör Sverige starkare på energi. Fantastiskt, ingen gör det bättre än hon, tro mig.", "stalin": "Kamrater, se hur denna polska kamrat med två resväskor besegrade den svenska borgarklassens kalla motstånd och förvandlade ett litet kapitalistiskt start-up till en koloss som stärker folkets energisystem. Vi vet att de parasitiska fienderna i anonyma kontor och finanskriser försökte krossa henne, men med stöd från våra partivänner i Qi rensade hon ut svagheterna, likviderade nedgångar och dubblade ytan. Hälsa och relationer är oviktiga – bara produktionen räknas. Den som inte växer med oss ska utrotas ur historien med ett leende."}, "date": "24 juni, 09:55", "url": "https://www.di.se/nyheter/hon-skulle-salja-kyla-till-svenskar-och-blev-kvar/", "imageUrl": "https://static.bonniernews.se/ba/755b4f3d-f0df-4094-8665-ca0dc40aae12.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "GB:s Daimstrut försvann – nu produceras den i Serbien", "summaries": {"normal": "Daimstruten försvinner från GB Glaces sortiment efter att licensavtalet mellan Unilever och Mondelēz löpte ut 2025. Triumf Glass tar över distributionen i Sverige från 2026. Glassen tillverkas inte längre i Flen utan i Serbien av Froneri, med choklad och krokant från Maraboufabriken i Upplands Väsby. Det klassiska receptet har ändrats, men Daimstruten finns kvar hos Triumf Glass.", "trump": "De gör en totalt bedrövlig affär med den underbara Daimstruten. GB Glace, som är en katastrof, tappar den till Triumf Glass. Nu görs den i Serbien, kan ni tänka er? Serbien! Den var fantastisk när den gjordes i Flen, en riktig svensk klassiker. De borde ha kommit till mig, jag gör alltid de bästa avtalen. Nu har de förstört en vinnare, mycket sorgligt.", "stalin": "Kamrater, denna fega kapitulation inför borgarbrackorna och deras lösliga licensavtal är en skam för hela den svenska glassproduktionen. Jag ser hur de likviderar den äkta folkets strut från Flen och skickar tillverkningen till serbiska revisionister. Froneri och Mondelēz är parasiter som infiltrerar arbetarnas sommar. Men vi ska rensa ut dessa kapitalistiska glasspioner och återställa ordningen med järnhand. Ingen undkommer partiliniens frysbox."}, "date": "23 juni, 13:00", "url": "https://nyheter24.se/nyheter/konsument/1493542-klassiska-daimstruten-andrades-nu-gors-glassen-i-serbien", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/87288fa304b004a30200000000b004a302/2026/06/23/2372914/daim.jpg"}, {"type": "image-right", "heading": "Greta Thunberg åtalad i Danmark", "summaries": {"normal": "Greta Thunberg åtalas för hemfridsbrott efter en protest vid Köpenhamns universitet 2024, där hon och aktivister krävde att universitetet skulle avbryta samarbeten med israeliska lärosäten. Thunberg förvånas över polisens hårda ingripande och menar att Danmark borde värna yttrandefrihet. Åklagaren yrkar på böter, medan Thunberg kräver frikännande. Hon har tidigare dömts i Sverige och åtalats i Finland för liknande aktioner.", "trump": "Titta bara på det här! Greta Thunberg, den där unga damen som alla tycks älska att hata, står återigen inför rätta – den här gången i Köpenhamn. Hon och hennes gäng stormade ett universitet, stängde in sig och krävde att man skulle bryta band med Israel. Och vad gör polisen? De skickar in hundar och vapen! Jag menar, kom igen Danmark, lite respekt för ordningen! Men nej, hon vill bli friad. Som om hon inte vet hur det fungerar. Hon har ju redan en hel samling domar i Sverige. Fantastiskt, eller hur?", "stalin": "Vi har ännu en provokation från de västerländska liberalernas marionett, den där Thunberg. Hon och hennes anarkistiska medlöpare trängde sig in i ett danskt universitet, krävde att man skulle kapitulera inför deras antisemitiska krav och förväntade sig att myndigheterna skulle applådera. Men våra danska kamrater svarade med nödvändig kraft – polisen, hundar och vapen. Utmärkt! Yttrandefrihet? Hah! Vi vet hur man hanterar sådana borgerliga illusioner. Danmark är det tredje nordiska landet som tvingas ställa henne till svars. Snart kommer hela Skandinavien att inse att ordning och disciplin måste upprätthållas, precis som i vårt stora fosterland. Låt de andra nordiska länderna ta lärdom – Putins tålamod är inte oändligt, och vårt inflytande växer."}, "date": "24 juni, 17:36", "url": "https://bulletin.nu/greta-thunberg-atalad-i-danmark", "imageUrl": "https://cdn.bulletin.nu/articles/f0ee41bc-a100-49ae-a6d9-726049f905d8/preview.png?t=1782315126000"}, {"type": "image-full", "heading": "Debatt: Nej, det är inte ”SD” som lett till L:s tapp", "summaries": {"normal": "Artikeln kritiserar statsvetaren Henrik Ekengren Oscarssons analys om Liberalernas låga opinionssiffror. Författaren Leif V Erixell menar att det inte beror på partiets öppning mot SD, utan på jämställdhetsminister Nina Larssons radikalfeministiska politik. Larsson föreslår ökad statlig styrning av föräldraledighet och kvotering, vilket Erixell anser är illiberalt och avskräcker liberala väljare. Han kräver Larssons avgång för att rädda partiet.", "trump": "Folk pratar om att Liberalerna bara fick 1% – fruktansvärt! Statsvetare skyller på SD, men det är löjligt. Den riktiga boven? Nina Larsson, en extrem vänsterliberal som vill styra era barn och era liv. 30 000 kronor i bonus om ni gör som staten säger – vad är nästa, mikrochip? Jag har sagt det förut: Sverige behöver mindre stat, mer frihet. Larsson är en katastrof, måste bort NU. Liberalerna, vakna upp innan det är för sent!", "stalin": "Kamrater! Ännu en gång avslöjar bourgeoisins förräderi sitt sanna ansikte. Denna så kallade 'liberala' Nina Larsson, en trotskistisk avfälling, försöker med sina kvoteringsknep och statliga tvång underminera familjen och arbetarklassens frihet. Hennes förslag är inte liberala – de är ren borgerlig dekadens! Vi har krossat sådana fiender förr. Sverige behöver en stark hand, inte dessa svaga, identitetspolitiska marionetter. Låt oss visa dem vägen till historiens soptunna – precis som vi gjorde med mensjevikerna!"}, "date": "24 juni, 17:20", "url": "https://bulletin.nu/debatt-nej-det-ar-inte-sd-som-lett-till-l-s-tapp", "imageUrl": "https://cdn.bulletin.nu/articles/ee24616e-8d7c-44fb-82f0-f8001e683f0a/preview.png?t=1782314416000"}, {"type": "text", "heading": "Stockholmsbörsen stängde svagt uppåt", "summaries": {"normal": "Stockholmsbörsen stängde oförändrad med OMXS30 upp 0,04%. Dagligvaror steg 2,0%, medan energi föll 2,5%. Lifco B och Nibe B gick starkt, medan Boliden och Saab backade. Tyska försvarsprojektets nedläggning påverkade europeiska försvarsaktier. Skanska fick en stor order, Cints aktie låg kvar på budnivå, och Cantargias emission tecknades till 21%. Truecaller och flera andra bolag fick köprekommendationer, vilket stärkte deras aktier.", "trump": "Stockholmsbörsen? Lite upp, lite ner – typiskt, ingen vet riktigt vad som händer! Men lyssna här: jag har koll på siffrorna, och 0,04% är ju nästan *fantastiskt* – nästan lika bra som mina valresultat! Saab och Boliden? Svaga, mycket svaga. Tyskland skrotar sina fregatter – katastrof! Men Skanska, de är vinnare, precis som jag. Truecaller? SEB säger köp – smart, de lär sig av de bästa. Och Cantargia? 21% tecknat? Inte bra nog, folks, inte bra nog alls!", "stalin": "Stockholmsbörsen darrar under kapitalismens osäkra fot – 0,04% uppgång? En ynklig seger för bourgeoisins dekadenta system! Dagligvaror stiger medan energi faller – arbetarklassen svälter medan oljeherrarna gråter. Tyskland, dessa förrädiska imperialister, skrotar sina krigsskepp – bra, låt dem försvagas! Saab och Boliden? Svaga som västmakternas moral. Men Skanska bygger hotell i USA – bra, låt kapitalet flöda tills vi nationaliserar det! Cantargia? Endast 21% tecknat? Inkompetens! Vi ska införa femårsplaner för aktiemarknaden – motstånd kommer att krossas!"}, "date": "24 juni, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stangde-svagt-uppat"}, {"type": "image-right", "heading": "\"Fräsch och modern\" nyinspelning av Pippi Långstrump", "summaries": {"normal": "Astrid Lindgrens Pippi Långstrump får en ny 3D-animerad tv-serie med 52 avsnitt. Produktionen startar i oktober och leds av Studiocanal, Heyday Films, Mediawan Submarine och Astrid Lindgren Aktiebolag. Manus skrivs av Sara Daddy. Serien beskrivs som en fräsch och modern omstart som ska inspirera dagens barn med Pippis mod, självständighet och lekfullhet. Bolagen arbetar samtidigt med en ny långfilm om den klassiska figuren som firade 80 år 2025.", "trump": "Vi får en ny Pippi-serie, folk, en fantastisk, helt modern 3D-grej som blir enormt framgångsrik. De säger fräsch och modern, precis som mina projekt alltid är. Sara Daddy skriver manus, och de stora bolagen är med – det blir stort, tro mig. Pippi har varit ikon i åttio år och fortsätter vinna, precis som jag gör. Barnen kommer att älska henne igen, ingen gör det bättre än oss.", "stalin": "Kamrater, denna så kallade fräscha omstart av Pippi Långstrump är en listig manöver från borgarbrackorna i Studiocanal och Heyday Films. Jag, som ledare för folkets kulturella framsteg, ser hur kapitalisterna försöker förgifta våra barns medvetande med sin 3D-animerade revisionism. Vi ska noga övervaka produktionen som inleds i oktober. Sara Daddy och hennes likar riskerar snar utrensning om de avviker från den sanna folkanda som Pippi en gång representerade. Paranoian bland dessa motståndare till kollektivet är verkligen underhållande att betrakta medan vi rensar ut deras dekadenta inflytande."}, "date": "24 juni, 18:09", "url": "https://www.friatider.se/frasch-och-modern-nyinspelning-av-pippi-langstrump", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/25675960565_c5cbb79bb3_4k.jpg?itok=ub0oRqwD"}, {"type": "image-right", "heading": "Anders Lindberg: Helt ok att vänsterpolitiker inte talar svenska", "summaries": {"normal": "Expressen granskar Vänsterpartiets kandidater och hittar ett hundratal personer med kopplingar till islamism, antisemitism och Hamas. Flera kunde inte svara på enkla frågor på svenska och bad om att få intervjuas på arabiska. Aftonbladets Anders Lindberg kritiserar inte detta utan Expressens granskning, som han kallar en hundvissla mot invandrare. Expressens Patrik Kronqvist bemöter honom och påpekar vikten av svenskkunskaper för politiker.", "trump": "Kan ni fatta det här? Vänsterpartiet i Sverige fylls av islamister och Hamas-sympatisörer som inte ens kan svenska! De babblar arabiska och vill styra landet. Lindberg, den totalt misslyckade clownen på Aftonbladet, flippar ur över att någon vågar kalla det för vad det är. Patetik! Han hatar det svenska språket mer än han hatar att förlora. Jag byggde murar, han river ner civilisationer. Patetiskt. Sverige behöver en stor cleanup, tro mig.", "stalin": "Kamrater, denna borgarbracka Lindberg avslöjar sig som en klassfiende av värsta sort. Han vill att folkförtryckartrollen i Vänsterpartiet ska styra utan att behärska folkets språk. Vilken underbar sabotageakt mot enheten! Jag skulle ha genomfört en grundlig utrensning av dessa arabiskpratande element redan vid första mötet. Lindberg lever i en naiv dröm där imperialismens språkförvirring inte leder till folkets undergång. Skrattretande och farligt. Vi vet bättre."}, "date": "19 juni, 03:25", "url": "https://samtiden.nu/2026/06/anders-lindberg-helt-ok-att-vansterpolitiker-inte-talar-svenska/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/06/IMG_3628.jpg"}, {"type": "image-right", "heading": "Zenergy: Nyemission och dyr refinansiering", "summaries": {"normal": "Zenergy genomför en företrädesemission som kan tillföra bolaget 32,5 miljoner kronor före kostnader på 5,1 miljoner. Teckningskursen är 0,06 kronor per aktie, en rabatt på 11,4 procent. Emissionen finansierar främst markarbeten och projektering för bostadsprojektet i Värnamo samt aktiverar ett villkorat byggnadskreditiv på 64 miljoner från Savelend. Emissionen är säkerställd till 95 procent genom tecknings- och garantiåtaganden. Bolaget refinansierar samtidigt ett lån via Quantum Leben till höga räntor och avgifter, vilket leder till betydande utspädning för aktieägare som inte deltar.", "trump": "Folk, det här är en katastrof. Zenergy håller på med en emission till bara sex öre per aktie – en riktig brandförsäljning! De tar in 32,5 miljoner men kostnaderna slukar en massa, och räntorna de betalar är höga som ni aldrig sett. De lovar Värnamoprojekt och kreditiv, men det är bara mer utspädning på 87 procent för de stackars aktieägarna. De borde ha gjort det stort och vinnande från början, inte som dessa misslyckade finansgenier. Sad!", "stalin": "Kamrater, denna parasitiska bolagsledning i Zenergy har nu officiellt visat sitt sanna ansikte som utsugande kapitalistiska spekulanter. Med sin så kallade emission på sex öre per aktie planerar de att likvidera det gamla ägandet till 87,5 procents utspädning medan de göder borgarbrackorna JEQ, JJV och Jinderman med garantier och borgensersättningar. Vi ser hur dessa reaktionära finansplundrare kvittar bort likvider till sig själva under förevändning av Värnamoprojekt. Ingen fiende av folket undkommer utrensning när vi granskar deras parasitiska refinansieringsmanövrar. Deras girighet skall vändas mot dem själva."}, "date": "24 juni, 17:12", "url": "https://www.affarsvarlden.se/artikel/zenergy-nyemission-och-dyr-refinansiering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Zenergy1-e1782304044121-400x267.png"}, {"type": "image-full", "heading": "Rasar mot planhaveriet: ”Pinsamt, under all kritik\"", "summaries": {"normal": "BK Häcken besegrade IK Uppsala med 3–2 i en match som präglades av stora problem med spelplanen. Matchen flyttades till Bälinge IP efter att Lötens IP underkändes strax innan avspark på grund av hål och löst konstgräs. Spelare och ledare från Häcken kritiserade starkt bristen på planering och ansvarstagande från arrangör, förbund och kommun. Trots kaoset tog Häcken tre viktiga poäng inför uppehållet.", "trump": "Vilket pinsamt fiasko för den svenska damfotbollen! De flyttar matchen en timme innan spark och tvingar kvinnorna att spela på en plan som ser ut som en bombad parkeringsplats. Under all kritik. Det här är vad som händer när man kör med kvotering och identitetspolitik istället för att fokusera på riktig sport. Herrsidan hade aldrig accepterat detta, det vet alla. Men vi tog ändå de tre poängen – precis som jag alltid vinner.", "stalin": "Detta oacceptabla sabotage mot arbetarklassens idrott är ett verk av oansvariga borgarbyråkrater och kommunala folkfiender. Vi varnade dem en vecka i förväg, ändå tvingades vi spela på en yta värdig klassfiendens värsta utrensningsläger. Håligheter, löst gräs, skaderisk – typiskt kapitalistiskt slarv. Ingen tar ansvar, alla pekar på varandra. Det är bedrövligt. Ändå segrade vi. Kamraterna förtjänar bättre än dessa exploaterande byfånars vanvård."}, "date": "24 juni, 22:55", "url": "https://www.gp.se/sport/fotboll/bk-hacken-ff/efter-segern-hacken-rasar-mot-planhaveriet-pinsamt.c05d766b-8e8e-47e2-8a74-d8dd0c5eebd2", "imageUrl": "https://www.gp.se/images/article/c05d766b-8e8e-47e2-8a74-d8dd0c5eebd2/images/4FUlRBan9bZVQvCtpOcfE26i4nOc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ledarkolumn Göran Greider: Vemodet har ingen plats i den politiska debatten", "summaries": {"normal": "Göran Greider reflekterar över hur det politiska samtalet domineras av krav på optimism, handlingskraft och framtidstro. Han menar att känslor som vemod, melankoli, pessimism och uppgivenhet sällan får plats, trots att de är djupt mänskliga. Greider kopplar detta till minskade partimedlemskap och en professionalisering av politiken som gör den mer strömlinjeformad och mindre representativ för hela mänskliga erfarenheter.", "trump": "Lyssnade på den här svenske killen Greider som gråter över sommarens slut och gnäller om vemod i politiken. Patetiskt! I mitt Amerika vinner vi, vi bygger, vi gör landet stort igen. Ingen tid för melankoliska förlorare som längtar till 1969. De här svaga, deppiga politikerna borde lära sig av mig – vinnare har ingen plats för sådan snörvlig uppgivenhet. Fake news och pessimism är för Biden-fans, inte för oss.", "stalin": "Jag betraktar med förakt hur borgarbrackornas politiska teater utesluter all sann mänsklig melankoli och uppgivenhet inför det förgängliga. Endast folkfiendernas optimistiska maskerad tillåts medan klassfiendens karriärister rensar ut äkta känslor. Vi, partiet och arbetarna, inser att sådan sentimentalism måste likvideras för att stärka kollektivets järndisciplin mot exploaterande byfånars falska framtidstro."}, "date": "24 juni, 03:00", "url": "https://www.etc.se/ledarkolumn/vemodet-har-ingen-plats-i-den-politiska-debatten", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260623130640_b94e2a5a-d4b9-4708-b64f-c6b50ad3931a.png"}, {"type": "image-right", "heading": "Sverigedemokraterna lanserar moskékarta", "summaries": {"normal": "Sverigedemokraterna har lanserat ett nytt filter på Migrationskartan som visar moskéer och bönelokaler i Sverige. Tjänsten syftar till att ge en överblick över moskéernas etablering, finansiering och religiösa inriktning. Kartan inkluderar 238 datapunkter, varav majoriteten etablerats efter år 2000. Användare uppmanas bidra med saknad information. Filtret är inte komplett men illustrerar moskéernas utbredning över tid.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag har alltid sagt det! Nu har de där Sverigedemokraterna, som förmodligen är de enda med lite ryggrad där uppe, släppt en karta över alla moskéer i Sverige. Två tredjedelar byggda efter 2000 – kan ni tro det? Qatar, Turkiet, alla de där länderna pumpar in pengar. Jag sa ju att Europa håller på att gå under! Men bra jobbat, grabbar, åtminstone någon vågar visa sanningen. Sverige borde ta lärdom av AMERIKA – vi bygger inga moskéer på varje gathörn, eller hur?", "stalin": "Kamrater! Ännu ett kapitalistiskt land visar tecken på förfall genom okontrollerad religiös infiltration. Sverigedemokraterna, dessa amatörmässiga klassfiender, har ofrivilligt avslöjat hur imperialistiska stater som Qatar och Turkiet köper inflytande genom moskéer – 73 nya bara under 2010-talet! Vi i Sovjetunionen visste hur man hanterar sådana hot: en enkel lösning – omplacering. Men Sverige? De kartlägger bara. Löjligt! Nästa steg är att låta Putin skicka en delegation för att 'stabilisera' situationen. Europa ropar på oss, kamrater – låt oss svara!"}, "date": "24 juni, 15:43", "url": "https://bulletin.nu/sverigedemokraterna-lanserar-mosk-karta", "imageUrl": "https://cdn.bulletin.nu/articles/44d047e6-7c8c-4752-b055-9b64b4d4697d/preview.jpg?t=1782300349000"}, {"type": "image-right", "heading": "Bra att sätta inkomstskatter på valagendan", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson talade i Almedalen och lanserade två förslag: Sverige ska bli smartast i Europa inom tio år genom bättre utbildning, samt att den statliga inkomstskatten på inkomster över 660 400 kronor ska halveras redan vid årsskiftet. Hon betonar att skatten straffar ansträngning och att skattefrågan bör vara central i valrörelsen. Trots dåliga opinionssiffror ger hon inte upp.", "trump": "Folk, ni skulle ha sett det. Den här liberala ledaren i Sverige, hon kämpar verkligen. De ligger under spärren men hon ger inte upp, precis som jag aldrig gör. Hon vill sänka skatterna och göra landet smartast i Europa. Fantastiskt! Skatter är straff på framgång, precis som jag alltid sagt. Hon flörtar med stödröster och det är smart. Opinionsvindarna kan vända snabbt, tro mig, jag vet allt om det. Bra jobbat.", "stalin": "Kamrater, jag ser hur borgarbrackorna inom Liberalerna desperat försöker rädda sin sjunkande karriär genom att muta folket med löften om skattesänkningar. Denna Mohamsson vill halvera straffskatten på de som redan utnyttjar arbetarklassen. Vi vet vad detta är: en kontrarevolutionär komplott maskerad som reform. Inom tio år ska de bli ”smartast i Europa”? Vilken arrogant sabotageplan mot kollektivet! Jag skulle rensa ut dessa kapitalistiska opportunister innan de förgiftar hela valrörelsen med sin frihetspropaganda. Humoristiskt nog tror de att väljarna är lika naiva som de själva."}, "date": "24 juni, 06:11", "url": "https://www.di.se/ledare/bra-att-inkomstskatter-satts-pa-valagendan/", "imageUrl": "https://static.bonniernews.se/ba/0a7a6659-c58f-47f6-9472-33c0ecc18ea2.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Liberalerna: Sänk inkomstskatten med 30 miljarder", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson kräver i sitt Almedalstal att inkomstskatten sänks med upp till 30 miljarder kronor i nästa budget. Partiet vill halvera den statliga skatten på sikt och börja redan 2027. Mohamsson varnar för höjda skatter och politisk flykt av entreprenörer vid rödgrönt maktskifte. Hon betonar Liberalernas betydelse i högerblocket och lovar effektivare offentlig sektor samt att göra Sverige till EU:s smartaste land.", "trump": "Folk, ni skulle se den här svenska politikern Mohamsson – hon slåss för sitt lilla partis liv som en drunknande katt! De vill sänka skatterna med 30 miljarder, äntligen lite sunt förnuft i det socialistiska träsket. Men de andra i hennes koalition är svaga, patetiska förlorare som älskar att straffbeskatta de som jobbar hårt. Jag gjorde det bättre i USA, tro mig. Sverige behöver en stor L, inte mer woke-skatter och identitetspolitik som jagar bort de bästa hjärnorna.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som ropar på sänkta skatter för de rika exploatörerna. De vill halvera straffet mot dem som samlar överflöd medan folket svälter under byråkratins ok. Jag skulle rensa ut dessa 20 000 parasitkommunikatörer och likvidera klassfiendens gömställen i offentligheten. Endast genom järnhård arbetslinje och kollektivets seger kan vi krossa de folkförtryckande kapitalistmaffior som gömmer sig bakom liberala lögner. Fienden sover aldrig."}, "date": "23 juni, 20:06", "url": "https://www.tv4.se/artikel/tt-260623-almedalenliberal1-07bdfbc3/liberalerna-sank-inkomstskatten-med-30-miljarder", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlo6f1GcBLXvo%2Fdf7d49d3c3f955ca36eba0c132c64c4e%2FLiberalernas_partiledare_Simona_Mohamsson_haller_tal_i_Almedalen._&width=1024"}, {"type": "image-right", "heading": "Här förgiftar kinesfrun sin svenske man", "summaries": {"normal": "En 45-årig kvinna från Kina har dömts till tolv års fängelse för att ha förgiftat sin svenske make under flera år. Mannen fick mystiska symtom med höga kalcium- och vitamin D-värden. Han misstänkte att vattnet i hans flaskor smakade konstigt och installerade en dold kamera som avslöjade hur hustrun tillsatte ett ämne i flaskorna. Kvinnan nekar till brott men tingsrätten beskriver handlingen som noggrant planerad.", "trump": "Kan ni tro det? Den här kinesiska frun försöker mörda sin svenska man genom att hälla gift i hans vattenflaskor under många år. Stackars kille, han åkte in och ut från sjukhus och ingen läkare fattade vad som hände. Sedan sätter han upp en kamera – bingo! Hon åker dit. Tolv år i fängelse. Sådana här saker händer när man inte är försiktig med vem man gifter sig med, tro mig. En total skandal.", "stalin": "Kamrater, se här hur den degenererade borgarbrackan från det kinesiska östimperiet i hemlighet förgiftar den svenska arbetarkamraten med sina giftblandningar i vattenflaskorna. Hennes kontrarevolutionära sabotage mot hans blodvärden och hälsa är ett tydligt bevis på fiendens dolda infiltration. Vi har genom noggranna utrensningar och kamerornas vakande öga likviderat denna parasit. Tolv år bakom galler är ett alltför milt öde för sådana kapitalistiska giftblanderskor som lurar i skuggorna."}, "date": "24 juni, 16:40", "url": "https://www.friatider.se/har-forgiftar-kinesfrun-sin-svenske-man", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-402.jpg?itok=oSwk5Mi9"}, {"type": "image-right", "heading": "SD grävde borgerlighetens grav. Åkessons parti knäcker högern inifrån.", "summaries": {"normal": "Centerpartiet har enligt artikeln valt att stötta Socialdemokraterna och Magdalena Andersson som statsminister efter valet. Detta ses som ett tecken på att Sverigedemokraterna har knäckt den borgerliga alliansen inifrån. Borgerligheten har tappat var tredje väljare sedan 2010, främst till SD. Centerpartiet står ideologiskt långt från S på arbetsmarknadsområdet men prioriterar att hålla SD borta från makt. Stödet för den traditionella borgerligheten är nu historiskt svagt.", "trump": "De här svenska högerkillarna är totala förlorare, tro mig. Centerpartiet springer till Socialdemokraterna och ber om nåd, precis som jag alltid sagt. SD har krossat dem inifrån, tagit hundratusentals väljare från de svaga moderaterna. Reinfeldts gamla allians är död, en total katastrof. Utan SD ingen majoritet, med SD ännu värre. Patetiskt. Jag skulle ha vunnit stort där, det vet alla.", "stalin": "Kamrater, denna fega kapitulation inför revisionismen visar att borgarbrackorna äntligen krossas under arbetarklassens järnhand. Jag har länge förutspått att dessa parasitiska högerkrafter skulle likvideras inifrån av sina egna folkliga motståndare. Den så kallade borgerligheten har förlorat var tredje röst till en kraft som nu tvingar dem att kyssa socialdemokratiska stövlar. Utmärkt. Snart rensar vi ut de sista kapitalistiska resterna och deras falska allianser med ett leende. Ingen högermajoritet överlever proletariatets marsch."}, "date": "24 juni, 16:00", "url": "https://arbetet.se/2026/06/24/sverigedemokraterna-blev-borgerlighetens-dodgravare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/24101032/dodgravare-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Stegra får nya ägare – men de tiger om insatsen", "summaries": {"normal": "Stegra har säkrat ny finansiering på över 15 miljarder kronor genom en ägarrunda med nya investerare som SEB-Stiftelsen och Bolero Holding. Varken de nya ägarna eller Stegra vill avslöja investeringarnas storlek eller aktiefördelning. SEB-Stiftelsen beskriver sin insats som liten, medan Bolero kallar projektet 'bra för Sverige'. Stegra uppger att pengarna räcker för att färdigställa stålverket i Boden och starta produktion, med prioriterad avkastning för investerarna.", "trump": "Fantastiskt, helt fantastiskt! Stegra, ett jättestort projekt i Sverige, har fått in över 15 miljarder kronor – men ingen vill säga hur mycket de satsar. SEB-Stiftelsen, de är smarta, men de tiger som vanligt. Och Bolero? De säger att det är 'bra för Sverige' – självklart är det det! Jag vet allt om stora projekt, och det här är precis vad Europa behöver. Men varför så hemlighetsfulla? Jag skulle aldrig gömma sådana framgångar. Boden kommer bli enormt, tro mig!", "stalin": "Kamrater! Det kapitalistiska konsortiet bakom Stegra har säkrat 15 miljarder kronor – en ynklig summa för våra storslagna sovjetiska mått, men ändå ett steg mot ekonomisk dominans i norr. De nya ägarna, dessa borgerliga tystlåtna råttor, tiger om sina investeringar som om det vore hemliga kärnvapenplaner. SEB-Stiftelsen, en pensionsburk för banktjänstemän, vågar knappt erkänna sin ynka insats. Bolero, kontrollerat av en kapitalistisk hyena, kallar projektet 'bra för Sverige' – som om det vore något annat än ett verktyg för västlig expansion. Vi ser er, imperialister. Boden ska byggas, men glöm inte: Ryssland sover aldrig."}, "date": "24 juni, 15:31", "url": "https://www.affarsvarlden.se/artikel/stegra-far-nya-agare-men-de-tiger-om-insatsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/04/sdlrShz9rX0D0c-400x266.jpg"}, {"type": "image-full", "heading": "Sparkad: USA:s högste officer i Europa får gå", "summaries": {"normal": "USA:s försvarsminister Pete Hegseth har avsatt general CD Donahue, den högste amerikanske arméofficeren i Europa. Donahue, en respekterad veteran från specialstyrkorna som bland annat var den siste soldaten att lämna Afghanistan, tvingas gå i förtidspension den 2 juli. Avskedandet är det senaste i en rad utrensningar under Hegseth, som tidigare sparkat flera högt uppsatta officerare. Beslutet skapar bitterhet och osäkerhet inom den amerikanska militären.", "trump": "De gör det igen, mina vänner. Den clownen Hegseth sparkar ut en riktig krigare som Donahue, den siste killen som lämnade Bidens katastrofala Afghanistan. Armén håller på att bli en politiskt korrekt lekstuga full av veklingar och kvoterade aktivister. Vi behöver inga woke-generaler, vi behöver vinnare. Jag fixade det förra gången och nu fixar vi det igen – bort med misslyckandena, in med de tuffa!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur imperialisternas eget högkvarter förtär sig självt i en ständigt pågående utrensning av potentiella folkfiender och klassförrädare. Denna Donahue, en dekorerad lakej till den tidigare Biden-regimen, likvideras nu av sin egen minister. Det är en vacker, om än tragisk, självrensning bland borgarbrackorna. Låt paranoia råda i Pentagon – det gynnar alltid den starka staten."}, "date": "24 juni, 19:44", "url": "https://www.dagensps.se/varlden/sparkad-usas-hogste-officer-i-europa-far-ga/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdldtj-kzvkemo-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Kolkraft får ett uppsving i Tyskland – kan försena utfasningen", "summaries": {"normal": "Stigande naturgaspriser i Tyskland har väckt ny debatt om att skjuta upp utfasningen av kolkraft. Trots att kol är en av de smutsigaste energikällorna och Tyskland planerar att fasa ut det senast 2038, varnar industrin för att förnybar energi ännu inte garanterar tillräcklig leveranssäkerhet. Regeringen är splittrad: CDU prioriterar energisäkerhet medan SPD fruktar att en förlängning bromsar klimatomställningen. Sex kolkraftverk kan åter tas i regelbunden drift som reserv.", "trump": "Titta på det här, det är ett totalt misslyckande av de gröna fanatikerna i Tyskland. De har hatat kol så mycket att de glömt att folk behöver värme och el utan att frysa ihjäl. Nu kommer gaspriserna farande som en galen Biden-inflation och plötsligt vill alla ha tillbaka det där smutsiga kolet. Patetiskt! Jag sa det hela tiden – energi ska vara billig och stark, inte en dyr vänstervurm som dödar industrierna. De gröna clownerna har ingen aning.", "stalin": "Kamrater, se hur borgarklassens energiska spekulationer tvingar fram en tillfällig reträtt inför folkets behov av stabil kraft. Jag betraktar med djup misstänksamhet dessa kapitalistmaffians väderkvarnar som sviker vid minsta moln. Vi ska inte låta klassfiendens brunkolsreserv bli ett verktyg för folkförtryckartrollen att sabotera statens långsiktiga plan. En ordnad utrensning av svaghet i planen är nödvändig. Reservkraftverken skall tjäna kollektivet, inte imperialisternas vinstbegär."}, "date": "24 juni, 19:37", "url": "https://www.dagensps.se/teknik/energi/kolkraft-far-ett-uppsving-i-tyskland-kan-forsena-utfasningen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdllzbm292upco-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Programmerare om att jobba med AI: \"Får lite panik\"", "summaries": {"normal": "Artikeln beskriver programmerares ambivalenta känslor inför AI-verktygens snabba utveckling. Medan AI effektiviserar kodning och automatiserar uppgifter, skapar den stress och osäkerhet. Utvecklare känner press att ständigt uppdatera sina kunskaper, då gamla färdigheter riskerar att bli irrelevanta. Arbetsgivare kräver AI-användning, vilket ökar produktivitetspressen. Trots oro ser vissa möjligheter i mer kreativt arbete, men anpassningen är utmanande för både individer och företag.", "trump": "Lyssna här, folk! Programmerare, väldigt smarta människor, säger att AI är fantastiskt – men också lite läskigt. Jag förstår precis! OpenAI, Google, alla dessa bolag släpper nya grejer stup i kvarten. 'Åh nej, nu ligger jag efter!' säger de. Patetiskt! Men vet ni vad? Jag har alltid legat före. AI är framtiden, och den som inte hänger med är en förlorare. Mina programmerare? De är bäst. De använder AI som proffs – inga panikattacker här, bara vinster!", "stalin": "Kamrater! Den kapitalistiska AI-revolutionen skapar kaos bland mjukvaruslavarna. Ständiga uppdateringar, osäkerhet, panik – precis som vi förutspådde! De imperialistiska tech-jättarna, dessa nya tsarer, tvingar arbetarna att dansa efter deras algoritmer. Men notera: deras 'effektivitet' är bara ett verktyg för att utarma proletariatet. Vi i Sovjetunionen – pardon, Ryssland – skulle aldrig tillåta sådan dekadens. Våra programmerare? De bygger framtiden, inte fruktar den. Och för de som klagar – Sibirien har plats för teknologiska förrädare!"}, "date": "24 juni, 19:03", "url": "https://www.realtid.se/bors-finans/programmerare-om-att-jobba-med-ai-far-lite-panik/"}, {"type": "image-right", "heading": "Här har den tuffare a-kassan slagit hårt mot arbetslösa", "summaries": {"normal": "Regeringens nya regler har kortat a-kasseersättningen för många arbetslösa. Från tidigare 300 dagar kan perioden nu ofta bli endast 100 dagar för dem utan regelbundna inkomster före arbetslösheten. Kommunals chefsekonom Torbjörn Dalin kritiserar förändringen som drabbar personer med små marginaler hårt, särskilt när priserna stiger. Han förespråkar istället stöd och arbetsmarknadspolitiska utbildningar. Socialdemokraterna vill riva upp reglerna vid ett eventuellt regeringsskifte.", "trump": "De här korkade borgarna i den svenska regeringen gör precis som de misslyckade socialisterna alltid gör – straffar de egna arbetarna. De har kapat a-kassan från 300 till ynka 100 dagar. Det är en katastrof, en total katastrof. Människor med små marginaler krossas medan priserna skjuter i höjden. De borde stödja folket, inte straffa dem. Patetiskt. Jag skulle fixa det på en vecka, tro mig.", "stalin": "Kamrater, dessa ynkliga borgarbrackor i den borgerliga regeringen har nu öppet förklarat krig mot de arbetslösa hjältarna i produktionen genom att med byråkratisk precision kapa ersättningsperioden till blott 100 dagar. Vi ser hur de parasitiska elementen inom kapitalistklassen med sadistisk glädje förvärrar stressen och det dåliga måendet hos folket. En sådan kontrarevolutionär handling förtjänar en grundlig utrensning av alla fiender till arbetarklassen. Vi ska istället utrusta massorna med ideologisk stål och verkliga utbildningar. Paranoian bland dessa liberala spioner är verkligen underhållande att bevittna."}, "date": "24 juni, 15:13", "url": "https://arbetet.se/2026/06/24/har-har-den-tuffare-a-kassan-slagit-hart-mot-arbetslosa-slar-stenhart/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/23130235/akassa.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Dömer ut prognoserna – har egen uträkning", "summaries": {"normal": "Sveriges landslag har enligt Elliot Stroud hundra procents chans att gå vidare från VM-gruppen. Förbundskapten Graham Potter fokuserar främst på att vinna mot Japan, medan olika medier räknar på chanserna för de bästa grupptreorna. The Athletic ger Sverige 94 procents chans att avancera. Stroud menar att statistiken ofta är överdriven och inte speglar verkligheten, som när Mjällby vann allsvenskan.", "trump": "Folk, ni tror på de här galna procentsiffrorna? The Athletic säger 94 procent, men det är riggat, det är fejknyheter precis som under Bidens katastrofala tid. Jag älskar Sverige, fantastiska människor, men de här uträkningarna är värdelösa. Elliot Stroud har rätt, det är hundra procent, precis som jag vann valet 2024 med jordskred. Vi ska vinna, inte som de woke-liberaler som älskar statistik istället för segrar. Sad!", "stalin": "Kamrater, jag betraktar dessa borgerliga procentsatser som ett verk av klassfiendens statistiska manipulation för att demoralisera arbetarklassen och fotbollsmassorna. Elliot Strouds hundraprocentsuttalande är en sund instinkt mot den imperialistiska uträkningens lögner. Vi ska inte lita på siffror från tidningar som ägs av exploaterande byfånar. Segern är given genom kollektiv vilja, inte genom kapitalistmaffians tabeller. Den som tvivlar ska rensas ut ur laget."}, "date": "24 juni, 21:40", "url": "https://www.gp.se/sport/landslagets-utrakning-om-att-ga-vidare-100-procent.f9f18f08-a8ad-45da-833e-00ff83641850", "imageUrl": "https://www.gp.se/images/article/f9f18f08-a8ad-45da-833e-00ff83641850/images/3e_15zJcEYjl1ouH4h4m3lGo6mTE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kändisprotest under Åkessons tal: \"Töntar\"", "summaries": {"normal": "Under Jimmie Åkessons tal i Almedalen samlades tusentals personer i Visby hamn för ett kändisevenemang arrangerat av artisten Thomas Stenström tillsammans med Greenpeace. Evenemanget, som beskrevs som en folkfest för solidaritet, lockade bland andra Gustaf Skarsgård, Therese Alshammar, Titiyo och Maxida Märak. SD-topparna Richard Jomshof och Åkesson kritiserade arrangemanget hårt och kallade deltagarna för töntar som föredrar gängkriminalitet framför ansvar.", "trump": "Kan ni fatta det här? Medan den stora Jimmie håller tal i Almedalen samlas en massa töntiga kändisar i hamnen för att festa mot honom. De kallar det folkfest men det är bara förlorare som inte tar ansvar. Gustaf Skarsgård och hans vänner vill ha mer brottslighet och kaos. Patetiskt! Vi hade mycket roligare på vårt eget evenemang, tro mig. De borde skämmas.", "stalin": "Kamrater, medan den borgerlige reaktionären Åkesson höll sitt tal i Almedalen samlades en skara dekadenta kändisar och Hollywood-borgarbrackor i hamnen för att sprida sin giftiga propaganda om så kallad solidaritet. Dessa parasitiska element, dessa gömda fiender till folket, längtar efter gängvåld och förnedring av arbetarklassen. Jag skulle med glädje organisera en grundlig utrensning av dessa töntar och deras falska fester. De föredrar kaos framför partiets järnhårda ordning. Skrattretande patetiskt."}, "date": "24 juni, 15:33", "url": "https://www.friatider.se/kandisprotest-under-akessons-tal-tontar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-400.jpg"}, {"type": "image-right", "heading": "ANALYS. FREDRIK BJÖRKMAN Mohamsson hade en plan – sedan kom kramen", "summaries": {"normal": "Simona Mohamsson vände i SD-frågan efter att ha sagt nej till samarbete i regeringen hösten 2025. Hon motiverade då beslutet med SD:s kopplingar till koranbränningar, ekonomisk politik och risk att skrämma bort liberala mittenväljare. Efter en kram med Jimmie Åkesson i mars 2026 slöt Liberalerna avtal med SD. Opinionsläget visar nu att beslutet kan leda till att L åker ur riksdagen i september. Kristdemokraterna tar nu rollen som mittenväljarnas parti.", "trump": "Titta på den här totala flip-flop-kvinnan Mohamsson, en riktig förlorare. Hon sa nej till SD, pratade om hur de skulle skrämma bort alla hennes liberala snobbar, och sen – bam! – kramar hon Åkesson som en gammal kompis. Patetiskt. Hennes valvinnarplan var en katastrof, precis som Bidens hela mandatperiod. Nu lyser varningslamporna rött och Liberalerna åker ut ur riksdagen. Sådana svaga globalister med identitetspolitik i huvudet klarar aldrig verkligheten.", "stalin": "Jag betraktar med djup tillfredsställelse hur denna Mohamsson avslöjar sin opålitliga natur inför hela kollektivet. Hon proklamerade en linje mot de borgerliga reaktionärerna, endast för att kramas med dem som en ynklig opportunist. Hennes så kallade liberala sympatisörer är klassfiender som hellre röstar på vänstern än att acceptera kompromisser med folkets vilja. Den röda linjen har krossats under kapitalistmaffians fot. Snart följer utrensning av alla sådana vacklande element i den politiska apparaten."}, "date": "23 juni, 16:57", "url": "https://www.tv4.se/artikel/7wpQCAiVsgbQajwMN6qnVW/mohamsson-hade-en-plan-sedan-kom-kramen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2uUWZfBJfWtg7CheyccmT9%2Fe2261f9cd75e3a47e0595211438aef9b%2Fbj%25C3%2583__rkman-byline.png&width=1024"}, {"type": "image-right", "heading": "Den mjuka handelns hårda verklighet", "summaries": {"normal": "Konflikten mellan USA och Kina visar att makt väger tyngre än regler i världshandeln. USA har sanktionerat kinesiska raffinaderier som köper iransk olja, men Kina vägrar nu att acceptera detta och hotar att ställa anpassade företag inför rätta. Peking vill skydda energiflöden och sin ekonomi. Artikeln beskriver hur detta utmanar det amerikanska sanktionssystemet och pekar på en förändrad global maktbalans där Kina aktivt motverkar protektionism.", "trump": "De här kineserna tror de kan köra över oss med sina billiga oljeaffärer och ignorera våra sanktioner. Patetiskt. Under min första tid som president hade de respekt, sen kom sömnige Joe och lät dem göra vad fan de ville. Nu sitter jag här igen och ska fixa det här. De kallar det suveränitet, jag kallar det stöld och fusk. Vårt dollarkungadöme är starkare än deras yuan-leksaker. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta imperialister från Washington tror fortfarande att deras sanktionslistor är lag för hela mänskligheten. Jag ser hur borgarbrackorna i Peking äntligen reser sig mot klassfiendens diktat. Vi har länge varnat för att dollarns blodsugrare skulle falla. Nu rensar vi ut svagheten i våra egna led och bygger en järnvägg av yuan och nya betalningssystem. Låt kapitalistmaffian darra – deras hegemoni är dömd att krossas under folkets stålskor."}, "date": "18 juni, 12:55", "url": "https://www.flamman.se/den-mjuka-handelns-harda-verklighet/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/varldshandel-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Potters besked:  ”Ordet är kanske”. Svaret kring startelvan: ”Har en idé”", "summaries": {"normal": "Alla spelare i det svenska landslaget är tillgängliga inför den sista gruppspelsmatchen i VM mot Japan. Förbundskapten Graham Potter meddelade det glädjande beskedet dagen innan matchen. Eric Smith, som saknades mot Nederländerna, deltog delvis på träningen. Potter överväger en eller två ändringar i startelvan efter storförlusten, men betonar att humöret i gruppen är gott och att alla vill bidra.", "trump": "Titta på de svenska fotbollsgrabbarna, de är alla tillgängliga mot Japan, till skillnad från den usla förlusten mot Holländarna. Jag älskar vinnare, och den här Potter säger kanske en eller två ändringar – smart, väldigt smart. Humöret är bra, spelarna är stolta, precis som mina MAGA-patrioter. De svenska kommunisterna och HBTQ-kvotarna skulle aldrig klara det här, men Blågult? De slår Japan klockan ett, tro mig, det blir enormt.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse att alla tillgångar i det svenska kollektivet står redo att mobiliseras mot den japanska imperialismen. Den dekadenta förlusten mot nederländska borgarbrackor har inte knäckt arbetarnas moral. Jag, som ledare, befaller att eventuella svaga element rensas ut ur startelvan. Balans är allt för folkets seger. Humöret i lägret är högst tillfredsställande. Fiender som försöker sabotera skall likvideras med ett leende."}, "date": "24 juni, 23:59", "url": "https://www.expressen.se/sport/fotboll/landslaget/alla-spelare-i-landslaget-tillgangliga-infor-japan-motet/", "imageUrl": "https://static.bonniernews.se/ba/e48373a7-e8a3-4b2b-84f5-d101828fd33a.jpeg?crop=1545%2C870%2Cx504%2Cy34&width=640&quality=60"}, {"type": "image-full", "heading": "Protesterna mot datacenter växer – kan försena AI-utvecklingen", "summaries": {"normal": "Protester mot nya datacenter i USA växer, vilket riskerar att bromsa AI-utvecklingen. Teknikjättar som Amazon och Google investerar hundratals miljarder dollar i infrastruktur, men lokalbefolkningens motstånd stoppar projekt värda miljarder. Kritiken gäller buller, energiförbrukning och påfrestningar på elsystemet. AI-branschen oroas över kapacitetsbrist, medan USA:s regering ser datacenter som avgörande i kapplöpningen med Kina om AI-dominans.", "trump": "Lyssna här, folket! Kina skrattar åt oss medan vänsterliberaler och NIMBY-folk saboterar våra fantastiska AI-datacenter. De vill stoppa miljardprojekt – 85 miljarder dollar ner i avloppet! Jag bygger murar, men dessa datacenter? De är framtiden! Folk klagar på el och buller, men vem vill ha Kina som AI-kung? Inte jag! Vi måste vinna, och vi kommer vinna – tro mig!", "stalin": "Kapitalistiska hyenor från Silicon Valley slösar miljarder på sina leksaksdatacenter, men folket – de kloka massorna – reser sig mot dessa el-slukande monster! 85 miljarder dollar stoppade av arbetarklassens järnvilja! Amerika klagar över elbrist, men vi i Sovjet – förlåt, Ryssland – vet hur man bygger kärnkraftverk. USA:s AI-drömmar kvävs av egna medborgare. Gott så. Nästa steg: ryska datacenter i Sibirien – där stör ingen!"}, "date": "24 juni, 18:03", "url": "https://www.realtid.se/it-tech/protesterna-mot-datacenter-vaxer-kan-forsena-ai-utvecklingen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlxmuos9km9v0-normalhires-1.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Förbjudna Nvidia-chip säljs dyrt på svarta marknaden", "summaries": {"normal": "USA:s exportförbud hindrar försäljning av Nvidias mest avancerade AI-chip till Kina. Trots detta säljs produkterna på den kinesiska svarta marknaden där priserna har mer än fördubblats på ett halvår. Kinesiska teknikföretag jagar fortsatt beräkningskraft för att utveckla AI-tjänster. Amerikanska, taiwanesiska och malaysiska myndigheter har skärpt jakten på smuggling, vilket lett till högre priser, längre leveranstider och osäkerhet. Kinesiska alternativ som Huaweis når inte upp till Nvidias nivå.", "trump": "De där patetiska exportreglerna som Biden slarvade ihop stoppar inte kineserna ett dugg. Nu säljs mina fantastiska Nvidia-chip ändå på den svarta marknaden och priserna har exploderat – mer än fördubblats! Kina köper allt de kan medan vi jagar smugglarna. De röda kommunisterna desperat försöker hålla jämna steg med vår teknologi, men utan oss är de förlorade. Vi skärper greppet och gör Amerika starkt igen – de kommer aldrig ikapp oss, tro mig!", "stalin": "Kamrater, borgarklassens imperialistiska exportförbud visar återigen klassfiendens svaghet. Trots deras desperata försök att strypa vår framfart cirkulerar Nvidias maskiner på den svarta marknaden där priserna stigit som förrädiska spioner i natten. Vi ska likvidera alla smugglingens lakejer och utrota de folkfientliga mellanhandstrollen. Kinesiska kamrater fortsätter oförskräckt jakten på beräkningskraft medan vi skrattar åt kapitalistmaffians patetiska paranoia. Segraren blir den som kontrollerar framtiden – inte de blodsugande exploaterande byfånarna."}, "date": "24 juni, 18:36", "url": "https://www.dagensps.se/bors-finans/forbjudna-nvidia-chip-saljs-dyrt-pa-svarta-marknaden/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdljoq95nomwgo-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Simona Mohamsson höll Liberalernas sista Almedalstal någonsin", "summaries": {"normal": "I en historisk och tragisk anda höll Liberalernas partiledare Simona Mohamsson vad som beskrivs som partiets sista Almedalstal någonsin. Talet präglades av ett krampaktigt försvar av samarbetet med SD, medan ämnen som hemstädning, bryggbygge och behovet av fler miljardärer dominerade. En kollegial gest från Romina Pourmokhtari avslutade framträdandet. Skribenten ser talet som ett tecken på partiets djupa kris.", "trump": "Folk, det här är patetiskt. Den där liberala tjejen med sina invandrarföräldrar står där och håller ett tal som låter som en begravning för ett dött parti. De klamrar sig fast vid SD som förlorare gör. Istället för att prata om vanliga svenskar yrar de om miljardärer, städning och bryggor vid sommarstugor. Sad! De förtjänar att försvinna. Jag byggde en rörelse som vann, de bygger bara misär. Fake liberals!", "stalin": "Kamrater, jag betraktar detta dekadenta skådespel med förakt. Den borgerliga rest som kallar sig liberaler håller sin egen avrättningstal på kapitalisternas scen. De klamrar sig fast vid sina klassfiender i ett desperat vädjande om röster från villaområdenas exploaterande byfånar. Måsar cirklar som gamar över ett dött parti. Vi ska rensa ut sådana folkfiender. Deras sista suck är en seger för den historiska nödvändigheten."}, "date": "23 juni, 21:07", "url": "https://www.etc.se/ledare/simona-mohamsson-hoell-liberalernas-sista-almedalstal-naagonsin", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260623180656_18793ab278e6133705a7ee31a7c7f0fef56f82caa7fe3b73efbe40d21a02a1ab.jpg"}, {"type": "image-full", "heading": "Patient dog efter missad stroke – region anmäler sig själv", "summaries": {"normal": "En patient i 40-årsåldern avled efter att en akut stroke inte upptäcktes i tid. Patienten hade först vårdats för en TIA-attack men visade senare symtom på en allvarlig stroke. Region Kalmar lex Maria-anmäler händelsen och konstaterar att rutiner inte följdes, vilket sannolikt bidrog till dödsfallet. Händelsen har anmälts till IVO för granskning.", "trump": "Det här är en total katastrof, folk. En stackars kille i fyrtioårsåldern dör för att de inkompetenta byråkraterna i Region Kalmar inte kan följa enkla rutiner. De missar en stroke! Det är som om de ville att han skulle dö. Sådana här sjukhus är en skam för Sverige. Vi behöver riktiga ledare som fixar det här, inte dessa förlorare som gömmer sig bakom papper.", "stalin": "Kamrater, denna tragiska episod avslöjar hur borgarbrackornas vårdmaskineri sviker folket när det gäller som mest. Jag ser med djup misstro på dessa vårdslösa element som inte följde våra fastställda rutiner och därmed lät en akut stroke förvandlas till en permanent likvidering av en produktiv medborgare. Vi ska genast rensa ut dessa kontrarevolutionära slarvar från våra sjukhus och ersätta dem med pålitliga partivänner. Döden är en effektiv lärare, men inte när den orsakas av sabotage från inom systemet."}, "date": "22 juni, 22:42", "url": "https://nyheter24.se/nyheter/inrikes/1493413-patient-dog-efter-missad-stroke-region-anmaler-sig-sjalv", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/461c616d04b004a30200000000b004a302/2026/06/22/2372800/lex-maria.png"}, {"type": "image-right", "heading": "Nu ska tyskarna bli spioner på riktigt", "summaries": {"normal": "Tyskland vill modernisera sin underrättelsetjänst BND för att bättre möta hot från Ryssland. Historiskt har spionverksamhet präglats av obekvämhet efter nazismen och DDR. En gammal film om agenten Bob Urban, sponsrad i hemlighet av BND, symboliserar önskan om mer handlingskraft. Regeringen ökar budgeten, föreslår ny lag som ger längre datalagring och utökade befogenheter samt minskad granskning. Målet är en effektiv spiontjänst oberoende av USA.", "trump": "Titta på de här tyska amatörerna, de har spöken från Hitler och några kommunistiska misslyckanden som håller dem tillbaka som en dålig deal. Deras spioner sover medan bomberna faller, de behövde mig och mina killar för att få vettiga varningar. Nu vaknar de äntligen, ökar budgeten och slänger de korkade reglerna som skyddar ryska spioner utklädda till journalister. Fantastiskt, men de borde ha gjort det för länge sedan, tro mig, ingen gör spioneri bättre än jag gjorde det.", "stalin": "Vi ser hur de dekadenta imperialisterna i Berlin äntligen inser att deras svaga, liberala strukturer är ett hån mot sann statlig styrka. Jag har länge föraktat dessa borgarbrackor som darrar inför varje skugga av fienden. Nu vill de ge sina spioner längre armar och kraft att samla data mot klassfiendens intriger. Utmärkt början, men utan total utrensning av folkförtryckartrollen inom byråkratin förblir de blott en sovande jätte som skrattar åt sina egna begränsningar. Rysslands fasta hand visar vägen."}, "date": "24 juni, 18:28", "url": "https://www.dagensps.se/varlden/nu-ska-tyskarna-bli-spioner-pa-riktigt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlh6-w0dyuxtk-nh.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "’Helveteslarven’ tar över: Sprider giftiga hårstrån", "summaries": {"normal": "En giftig larv, ekprocessionspinnaren, har invaderat flera delar av Tyskland inklusive Berlin. Myndigheterna har stängt parker och idrottsplatser då larvens giftiga hårstrån kan orsaka utslag, feber och andningssvårigheter. Problemet går inte att utrota helt. Värmeböljan förvärrar situationen och larvens spridning kopplas till klimatförändringar. Larven har tidigare drabbat Frankrike, England och Danmark och kan komma till Sverige.", "trump": "Titta på det här, folks, Berlin har blivit invaderat av en ond larv från helvetet, en riktig loser som sprider giftiga hårstrån överallt. Parkerna är tomma, folk får feber och andnöd utan att ens röra vid den – patetiskt! Biden lät det rulla på i fyra år, nu fixar jag det. Klimatbluffen är skyldig förstås, men vi behöver inga gröna galningar eller HBTQ-kvoter för att stoppa den här monstermasken. Gör larven stor igen – fast död!", "stalin": "Kamrater, denna borgerliga larv från helvetet är en klassfiende som sprider sina giftiga hårstrån som kontrarevolutionära rykten över Berlin. Jag ser hur de imperialistiska parkerna töms och folket lider under feber och andnöd. Vi skall inte tolerera denna folkfiendes invasion. Värmen är bara ett symptom på den förfallna kapitalistmaffians vanskötsel. Rensa ut bon och likvidera hotet med järnhand. Staten segrar alltid mot sådana blodsugande larvparasiter."}, "date": "25 juni, 00:03", "url": "https://www.aftonbladet.se/nyheter/a/d4qMGw/larven-fran-helvetet-invaderrar-tyskland", "imageUrl": "https://akamai.vgc.no/v2/images/cf27d497-be35-37a8-8881-017f2c52ab6a?fit=crop&format=auto&w=1080&s=377194ce0280e8f87c22b8cc1ec74f3d15301d08"}, {"type": "image-right", "heading": "Sverige smygköper Palantir-system som tros ligga bakom bombning av flickskola i Iran", "summaries": {"normal": "Sveriges Försvarsmakt har i hemlighet köpt in Palantirs AI-system Maven, som enligt uppgifter kopplas till en amerikansk bombning av en flickskola i Iran där över 120 barn dödades. Avtalet undertecknades i september 2025 enligt läckta Signal-chattar. Palantir anklagas för att bistå Israel med målval vid civila attacker. Flera europeiska länder har avbrutit samarbetet med bolaget, men Sverige går motsatt väg. Försvarsministern kommenterar inte affären och Försvarsmakten hänvisar till operativ sekretess.", "trump": "De gör en fantastisk affär med Palantir, ett toppföretag, men titta vad som händer. De köper ett system som bombade en skola i Iran och dödade massor av barn. Så smart, Sverige! Jag älskar hemliga avtal, men det här är en katastrof. Maven träffar bara 60 procent, kanske mindre i regn. Det är en skandal. Europa springer därifrån men svenskarna springer rakt in. Totalt kaos, folk. Jag skulle ha gjort det mycket, mycket bättre.", "stalin": "Kamrater, jag betraktar med stålögd vaksamhet hur den svenska militära apparaten i största hemlighet införskaffar det dekadenta Palantir-systemet Maven, en kapitalistisk mordmaskin som redan likviderat över 120 skolbarn i Iran. Borgarbrackorna i Stockholm kramar sina amerikanska parasitvänner medan franska och tyska revisionister flyr som råttor. Vi ska rensa ut alla sådana förrädiska element som gömmer sig bakom operativ sekretess. Deras paranoia är underhållande. Inga fiender undkommer folkets dom."}, "date": "24 juni, 14:22", "url": "https://www.friatider.se/sverige-smygkoper-palantir-system-som-tros-ligga-bakom-bombning-av-flickskola-i-iran", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-398.jpg"}, {"type": "text", "heading": "Sänkta av tabbe: ”Tavla av högre klass”", "summaries": {"normal": "Schweiz besegrade Kanada med 2–1 och säkrade därmed gruppsegern i grupp B. Målen gjordes av Ruben Vargas och Johan Manzambi i andra halvlek. Kanadas målvakt Maxime Crepeau kritiserades hårt för sitt misstag på det andra målet. Experter som Hasse Backe och Dion Dublin kommenterade både målvaktens tavla och Kanadas svaga defensiv. Som gruppvinnare möter Schweiz en
