 nära noll utanför närområdet, stoppa kvotmottagande och skärpa reglerna för arbetskraftsinvandring ytterligare.", "trump": "Folk, ni måste höra det här! KD vill ha en fin, normal nordisk invandring – typ som de andra förlorarländerna. Patetiskt! SD vill ha den lägsta möjliga, nära noll, och det är smart. De där KD-typerna är bara svaga kompromissande globalister som inte vågar säga stopp. Jag byggde muren, de bygger ursäkter. Ynkligt!", "stalin": "Jag betraktar dessa borgerliga revisionister med djup misstro. KD:s så kallade nordiska medelvärde är en farlig kompromiss med klassfienden, en trojansk häst för kapitalets invasion. SD:s nollvision är åtminstone ärlig i sin paranoia. Men ingen av dem förstår att endast partiet och kollektivet kan styra folkflödena. Avvikare kommer att identifieras."}, "date": "3 september, 11:43", "url": "https://samtiden.nu/2026/09/kristdemokraterna-vill-ha-hogre-invandring", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/7d1f8f3e-4570-402c-963e-74f000f208c2-1280x720.png"}, {"type": "image-right", "heading": "”Så länge SD har Oscar Sjöstedt kommer de rika att bli rikare”", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas ekonomiska politik som en högerpolitik trots partiets självbild som mittenparti. Oscar Sjöstedt beskrivs som en central gestalt som drivit fram sänkta skatter, försämrad a-kassa och stöd för vinster i välfärden. Författaren menar att detta gynnar höginkomsttagare på löntagarnas bekostnad och underminerar tryggheten för vanligt folk.", "trump": "Folk, de här SD-typerna är fullständiga bedragare. Åkesson babblar om mittenparti medan den där Sjöstedt, en riktig skattekramande högerhöök, skär ner a-kassan och ger de rika ännu mer. Patetiska globalister som låtsas vara arbetarnas vänner men bara älskar de giriga eliterna. Under mig skulle vi ha sparkat ut dem direkt – totalt misslyckande!", "stalin": "Kamrater, se hur dessa profitthungriga klassförrädare inom SD maskerar sin giriga agenda bakom folklig retorik. Sjöstedt och hans lakejer rensar ut tryggheten för arbetarna medan de belönar de parasiterande borgarbrackorna. Jag ler mörkt från historien åt deras hyckleri. En dag ska folkets vrede likvidera alla sådana falska vänner till de arbetande massorna."}, "date": "4 september, 08:00", "url": "https://arbetet.se/2026/09/04/sa-lange-sd-har-oscar-sjostedt-kommer-de-rika-att-bli-rikare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02123947/wallmark.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Näthatsgranskaren polisanmäler Jomshof", "summaries": {"normal": "Den vänsterextrema organisationen Näthatsgranskaren har polisanmält SD-toppen Richard Jomshof för hets mot folkgrupp. Anmälan gäller tretton inlägg på X där han enligt organisationen avhumaniserar en folkgrupp på grund av religion. Jomshof ledde själv utvidgningen av hets mot folkgrupp-lagen för några år sedan. Tidigare anmälningar mot honom har lagts ned.", "trump": "Folk, ni skulle se det här! Den galna vänstersekten Näthatsgranskaren, ett gäng hysteriska censurhyenor, anmäler den tuffe Jomshof för att han talar sanning. De vill tysta alla som inte böjer sig för deras sjuka identitetspolitik. Jag utvidgade inga sådana lagar, det gjorde era svaga politiker. Patetiskt! Vi behöver inga woke-domare i Sverige heller.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom Näthatsgranskaren jagar en politisk motståndare med sin byråkratiska utrensningsiver. De anmäler Jomshof för att han vågar kalla saker vid deras rätta namn. Jag ler ironiskt från historien; dessa parasiterande åsiktslakejer tror sig skydda folk men skapar bara rädsla. Snart kommer deras egna ord att vändas mot dem själva."}, "date": "4 september, 08:42", "url": "https://www.friatider.se/nathatsgranskaren-polisanmaler-jomshof", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-823.jpg"}, {"type": "image-right", "heading": "Tiotusentals demonstrerade i Spanien efter migrantkrisen i Ceuta", "summaries": {"normal": "Tiotusentals spanjorer demonstrerade den 2 september mot regeringens hantering av massinflödet av migranter i Ceuta, där över 70 000 personer tog sig över gränsen i somras. Protesterna, som stöddes av oppositionen, krävde hårdare gränskontroller och riktade skarp kritik mot premiärminister Pedro Sánchez. I Madrid ledde spänningar efter manifestationen till sammandrabbningar och några gripanden.", "trump": "Spanien är i fullständig kaos! Sju tiotusentals människor rasar mot deras radikala socialistregering som fullständigt tappat kontrollen över gränserna. Över 70 000 migranter bara vlde in i Ceuta! Premiärminister Sánchez har ingen aning om vad han gör, total katastrof. De skanderar att staden inte är till salu. Vi behöver en stark vägg, det kan jag säga er!", "stalin": "Massorna i Spanien har vaknat till insikt om gränsernas okränkbarhet. När tiotusentals arbetare och patrioter marscherar på gatorna mot regimens inkompetens ser vi prov på sund disciplin. De sjuttio tusen migranterna som vlde över gränsen visar faran med bristande kontroll. Vi beordrar omedelbar skärpning av gränsförsvaret och noggrann granskning av alla avvikande element som skapar oordning på gatorna!"}, "date": "4 september, 09:00", "url": "https://samnytt.se/tiotusentals-demonstrerade-i-spanien-efter-migrantkrisen-i-ceuta", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/04065440/spanien-ceuta-demo.jpg"}, {"type": "image-right", "heading": "Ska 50 miljoner jobbansökningar stoppa arbetslöheten?", "summaries": {"normal": "Artikeln kritiserar svensk arbetsmarknadspolitik där arbetslösa tvingas söka ett stort antal jobb för att få försörjningsstöd. Trots att många ansökningar skickas nekas stöd på grund av felaktiga datum eller för få ansökningar. Författaren beskriver systemet som byråkratiskt vansinne medan arbetslösheten ökar och efterfrågan på arbetskraft är låg.", "trump": "Det här är fullständigt galet, folk! I det socialistiska dårhuset Sverige tvingar de de stackars arbetslösa att skicka femtio miljoner jobbansökningar i månaden till jobb som inte ens finns. Rena tidsförslöseriet från de korkade globalistbyråkraterna. De borde sänka skatterna och släppa loss den riktiga ekonomin istället för att pina folk med blanketter. Patetiskt!", "stalin": "Kamrater, se hur de giriga hyenorna i det borgerliga dårhuset driver arbetarna till vansinnig sysselsättning. Istället för att bygga socialismens fabriker och välfärd tvingar de de arbetslösa att producera miljoner meningslösa ansökningar. Detta är klassfiendernas byråkratiska utrensning av folkets vilja. En sådan dekadent parasitstat förtjänar endast att sopas bort av historien."}, "date": "4 september, 06:55", "url": "https://arbetet.se/2026/09/04/i-darhuset-sverige-bekampas-arbetslosheten-med-50-miljoner-jobbansokningar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04065446/britz-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-right", "heading": "Vänstern behöver mer än baristor", "summaries": {"normal": "Artikeln diskuterar vänsterns behov av att organisera både prekariserade storstadsarbetare och landsbygdens arbetarklass. Författaren varnar för att en rörelse som överger landsbygden åt högern aldrig kan förändra samhället. Han lyfter arbetarnas uppgivenhet och betonar vikten av starka band mellan partier, fackföreningar och folkrörelser för att skapa bestående samhällsförbättringar.", "trump": "De där vänstervridena med sina rosa hår och lattemuggskrig förlorar arbetarna till oss riktiga patrioter. Baristorna i sina stora städer? Patetiska. Landsbygden vet vad som gäller. Utan oss blir det bara mer dekadent identitetspolitik och ingen hoppfull politik för vanliga människor. Vi vinner stort, de förlorar landet.", "stalin": "Kamrater, denna dekadenta klassförrädare har rätt i att uppgivenhet driver arbetarna mot högern. Jag ser hur profitthungriga parasiter och deras politiska lakejer överger landsbygden. En sann arbetarrörelse måste ingjuta hopp och rensa ut svikare. Utan järnhård organisation och folklig mobilisering kommer ingen seger. Fienden ler i skuggorna."}, "date": "2 september, 10:55", "url": "https://www.flamman.se/vanstern-behover-mer-an-baristor", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/starbucks-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Portugals största solpark i konkurs", "summaries": {"normal": "Portugals största solpark, Solara4, har gått i konkurs efter problem med låg elproduktion och priser som pressats i botten av överproduktion. Fenomenet kallas kannibalisering och drabbar den gröna energisektorn när allt fler parker producerar samtidigt. Parken fortsätter driften medan ägarna söker efter en köpare.", "trump": "Portugals absolut största solpark har kraschat totalt! De lyssnade på den idiotiska gröna rörelsen och byggde utan garantier. Nu är elpriserna noll eller minus. Ett absolut fiasko! USA kör på äkta, vacker olja och tjänar miljarder istället för att gå i konkurs på lite solsken. Så sorgligt för dem!", "stalin": "Dessa patetiska kapitalistiska solfabriker trodde solen skulle skina gratis för alltid. När elpriserna dog, föll de som ruttna päron. I Sovjetunionen lät vi inte solen bestämma ekonomin med sin lunatiska väderlek; vi planerade järnhårt och skickade slappa solpaneler direkt till Gulag för omutbildning!"}, "date": "4 september, 06:00", "url": "https://www.affarsvarlden.se/kronika/portugals-storsta-solpark-i-konkurs", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-52-400x267.jpg"}, {"type": "image-right", "heading": "Yüksel: \"Jag ser SD som en förebild\"", "summaries": {"normal": "Partiledaren Mikail Yüksel för Nyans ser Sverigedemokraternas långsamma väg till riksdagen som en förebild. Partiet satsar på lokal tillväxt i kommuner innan nästa riksdagsval. Nyans blev största parti utanför riksdagen 2022 med 0,44 procent och har mandat i Botkyrka och Landskrona. Målet är att nå en procent och fler kommunplatser.", "trump": "Lyssnar ni på den här stackars Mikail Yüksel? Han tittar på SD och säger att de är hans stora förebild, precis som de borde vara för alla som vill vinna på riktigt. De började med nästan inga röster och blev enorma. Nyans vill samma sak, men de borde akta sig för alla woke-kvoteringsgalningar som kommer att kalla dem för extremister medan de själva förstör Sverige. Fantastiskt, men gör det bättre än de gör!", "stalin": "Jag betraktar med djup misstro dessa opportunistiska småborgerliga äventyrare som hyllar reaktionära krafter som sin ledstjärna. De vill krypa in i kommunerna som maskar för att senare infiltrera statsapparaten. Vi känner igen detta falska spel från dekadenta klassförrädare som alltid sviker folket. En procent? Patetiskt. Rensa ut sådana element innan de förgiftar arbetarklassen med sin falska nationalism."}, "date": "4 september, 07:04", "url": "https://www.friatider.se/yuksel-jag-ser-sd-som-en-forebild", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-821.jpg"}, {"type": "text", "heading": "Prognos: 700 kronor dyrare el i vinter", "summaries": {"normal": "Elkonsumenter i södra Sverige väntas få betala omkring 700 kronor mer per månad i elräkning denna vinter jämfört med i fjol. Orsakerna är låga nivåer i vattenmagasinen, höga gaspriser och att hälften av kärnkraften ställs av för underhåll i höst. Även i övriga landet stiger priserna, men med mindre belopp.", "trump": "Sverige har katastrofala problem med sina elpriser, det är sorgligt! Nu tvingas villaägarna i söder betala sjuhundra spänn extra i månaden. Det är helt galet! De stänger av kärnkraften och har tomma vattenmagasin – totalt inkompetent styre. Värsta jag sett! Under mig skulle elen vara billig, enormt billig, den bästa någonsin, tro mig!", "stalin": "Sveriges usla vattenmagasiner och svikande kärnkraft avslöjar kapitalismens totala bankrutt. När elräkningen i söder stiger med sjuhundra kronor plågas det svenska folket av sina ledares inkompetens. Sådana misslyckanden tolereras inte i mitt imperium. De skyldiga sabotörerna bakom dessa energibristens priser ska omedelbart granskas av statens mest nitiska kommissarier. Arbeta hårdare, frys mindre!"}, "date": "4 september, 11:02", "url": "https://bulletin.nu/prognos-700-kronor-dyrare-el-i-vinter"}, {"type": "image-right", "heading": "Debatt: Är Miljöpartiet Sveriges farligaste parti?", "summaries": {"normal": "En debattartikel ifrågasätter Miljöpartiets klimatpolitik och menar att den skadar svensk konkurrenskraft. Enligt Naturvårdsverket var Sveriges territoriella utsläpp 2024 lägre än skogens och markens nettoupptag. Skribenten argumenterar för att drastiskt dyrare drivmedel och subventioner slår hårt mot hushåll och näringsliv, och ställer sig frågande till om partiets politik har spelat ut sin roll.", "trump": "De svenska miljöpartisterna är totala losers som driver landet i botten med sin fejkade klimatoro. Folk vill ha bilar, inte tunnelbanor på vischan! Enligt deras egna siffror binder ju skogarna mer koldioxid än de släpper ut, men ändå ska de straffbeskatta hårt arbetande människor för ingenting. Det är en katastrof. Gör Sverige konkurrenskraftigt igen, sparka dem!", "stalin": "Det borgerliga elementet Häggström gråter över att de gröna byråkraterna ruinerar kollektivet med sin meningslösa skatteindrivning. Om skogarna binder mer än de släpper ut, varför producerar inte traktorerna mer? Vår planekonomi skulle rensa upp i detta skadliga slöseri på ett ögonblick. Den som hindrar tillväxten och försvagar staten kommer att finna att avvikelser inte tolereras."}, "date": "4 september, 10:56", "url": "https://bulletin.nu/debatt-ar-miljopartiet-sveriges-farligaste-parti", "imageUrl": "https://cdn.bulletin.nu/articles/b85c80f3-2a7c-4151-b7af-1e5ecb9235f2/preview.jpg?t=1788512127000"}, {"type": "image-right", "heading": "Forskning visar: politiker har blivit elakare", "summaries": {"normal": "Forskning visar att politiker blivit hårdare mot varandra, särskilt i sociala medier. Nyhetsrapporteringen fokuserar mer på personangrepp än sakpolitik. Väljare reagerar negativt på pajkastning och virala klipp, vilket riskerar att minska förtroendet för hela det politiska systemet. Alla partier uppmanas att bli mer sakliga och respektfulla.", "trump": "De här svenska politikerna är en samling patetiska, virusskadade pajkastare som ägnar sig åt att riva varandra i småbitar på TikTok istället för att fixa landet. Precis som de woke-vänsterliberala hyenorna här hemma. Väljarna ser det virala klippet och inser att hela systemet är en enda stor riggad cirkus. Gör om, gör rätt – annars förlorar ni allt, losers.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare förvandlat den politiska arenan till en sandlåda av tarvliga personangrepp. Väljarna inser att de giriga opportunisterna bara undergräver folkets förtroende. Vi behöver utrensning av detta dekadenta skitsnack. Skärp er, annars kommer historien att likvidera er alla som de fega parasiterna ni är."}, "date": "3 september, 16:00", "url": "https://www.etc.se/ledare/forskningen-visar-politiker-har-blivit-elakare", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240918130916_cb0f17296c8079e9e6606ee0271866f5612754a2ad164e0cb12f150a223d53d1.jpg"}, {"type": "image-right", "heading": "Markus Allards hat slutar i min inkorg", "summaries": {"normal": "Artikeln beskriver hur debattören utsätts för grova våldshot efter en diskussion med Örebropartiets Markus Allard. Författaren kritiserar hur populistiska politiker använder hat och extrema uttalanden för att vinna uppmärksamhet. Trots personliga likheter i bakgrund ses hat mot invandrare som avgörande för att tillhöra ”folket”. Skribenten vädjar om saklig debatt istället för polarisering.", "trump": "Folk, det här är precis vad som händer när de galna vänsterliberala hatarna får fritt spelrum. Den här Allard-killen skriker ut sanningar om invandrare och etablissemanget medan de riktiga losersen svarar med dödshot. Typiskt för de dekadenta HBTQ-kvotarna som hatar vanliga arbetare. Jag fixade Amerika, nu behöver Sverige en riktig ledare som inte är en sådan patetisk förlorare.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare förgiftar debatten med sina hatiska utspel. Jag betraktar med avsmak hur folkets fiender använder hot och paranoia för att splittra massorna. Den sanna arbetarklassen behöver inte sådana metoder. Vi måste rensa ut dessa parasiterande opportunister innan de förgiftar hela samhällskroppen. Politiken ska tjäna folket, inte hatet."}, "date": "1 september, 12:45", "url": "https://www.flamman.se/markus-allards-hat-slutar-i-min-inkorg", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/markus-allard-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Fröken Snusk: Varför avbokas inte Zara Larsson?", "summaries": {"normal": "Artist Fröken Snusk ifrågasätter på Facebook varför hon nyligen har avbokats från evenemang efter ett samarbete med SD-ledaren Jimmie Åkesson och en kritisk låt riktad mot V-ledaren Nooshi Dadgostar. Hon menar att det råder dubbla måttstockar i musikbranschen, då artister som Zara Larsson öppet stöder vänstersidan utan liknande negativa konsekvenser.", "trump": "De behandlar Fröken Snusk fruktansvärt falskt, det är en riktig häxjakt! Hon gör fantastisk musik, och plötsligt avbokar radikala vänsterkommunister henne bara för att hon samarbetar med Jimmie Åkesson. Men radikala Zara Larsson kan sprida sin vänstersörja helt utan straff? Vilket totalt hyckleri! Fake news-medierna och de svaga kommunerna censurerar sanningen. Vi behöver mer äkta girl power och sunt förnuft nu!", "stalin": "Det borgerliga kulturskriveriet avslöjar återigen sin bottenlösa hyckleri. Konstnären Fröken Snusk utsätts för statens och de vacklande institutionernas administrativa sabotage enbart för att hon vägrar marschera i takt med den dekadenta vänsterliberala propagandamaskinen. Om den så kallade artisten Zara Larsson tillåts sprida sin ideologiska smitta ostraffat, bevisar det endast att regimen tillämpar dubbla måttstockar. Statsapparaten ser allt. Vi noterar illojaliteten."}, "date": "4 september, 10:31", "url": "https://bulletin.nu/froken-snusk-varfor-avbokas-inte-zara-larsson", "imageUrl": "https://cdn.bulletin.nu/articles/90c9e6ee-abd0-4e43-95bc-aacb19d7a273/preview.jpg?t=1788510625000"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-full", "heading": "Karttjänsten vägrade att gå med på Trumps krav – rusar på topplistorna", "summaries": {"normal": "Karttjänsten MapQuest har fått ett kraftigt uppsving i nedladdningar efter att bolaget valt att trotsa president Trumps order om att döpa om Lake Ontario till Lake America. Medan konkurrenter som Google Maps och Apple Maps rättat sig efter beslutet, har MapQuest sett en dramatisk ökning av användare och toppat listorna i App Store.", "trump": "Hörde ni om MapQuest? De vägrar använda namnet Lake America. Katastrofalt! De är svaga, precis som de där woke-bolagen som låter radikala vänstermänniskor styra. Google och Apple gör det rätta, de förstår storhet! MapQuest försöker bli populära genom att vara rebelliska mot mitt namn. Det är sorgligt, faktiskt. De kommer försvinna fortare än de dök upp, tro mig!", "stalin": "Dessa amerikanska karttjänster bevisar bara kapitalismens inneboende kaos. En stat kräver ordning, en karta och en enda sanning. Att låta ett privat företag som MapQuest styra över nationell geografisk nomenklatur är ett tecken på total statsförfall. De som tillåter olydnad mot ett officiellt dekret förtjänar inte marknadsandelar, de förtjänar en grundlig utrensning av sin ledningsgrupp."}, "date": "3 september, 19:55", "url": "https://www.realtid.se/it-tech/karttjansten-vagrade-att-ga-med-pa-trumps-krav-rusar-pa-topplistorna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlj8do9lc0fca-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-right", "heading": "Mätning: Så långt har Allard kvar till en riksdagsplats", "summaries": {"normal": "Enligt en Infostatmätning har Örebropartiet och Markus Allard svårt att nå riksdagen via den så kallade 12-procentregeln. Partiet stöds av knappt sex procent i Örebro läns valkrets, vilket är långt ifrån de tolv procent som krävs. Trots stora framgångar i det lokala kommunvalet visar mätningen att väljare gör skillnad på lokal- och riksdagsval.", "trump": "Markus Allard har det tufft, det säger alla! De kör en enorm lokal kampanj, helt otroligt stark i kommunen, men i riksdagen? Rena katastrofen, sämre siffror än Fake News-media någonsin rapporterat! Väljarna älskar dem lokalt men dumpar dem nationellt. Man måste veta hur man vinner, och det här är inte att vinna. Sorgligt!", "stalin": "Kamrat Allard tror att han kan erövra riksdagen genom småborgerliga trick och matematiska krumbukter i Örebro län! En ynka siffra på sex procent visar att folkets massor ser igenom denna revisionistiska agitation. Ett parti som sviker vid den nationella skrankan förtjänar inget annat än total ideologisk omkolonisering. Kampen fortsätter i partihögkvarteret!"}, "date": "4 september, 06:00", "url": "https://samnytt.se/matning-sa-langt-har-allard-kvar-till-en-riksdagsplats", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03160854/allard-riksdagen.jpg"}, {"type": "image-full", "heading": "Jakob Sjölander: Ukrainsk vapenbrist, europeisk viljebrist", "summaries": {"normal": "Jakob Sjölander kritiserar Europas bristande stöd till Ukraina efter fyra år av krig. Trots en samlad ekonomi som är tio gånger större än Rysslands ger de flesta länder under en procent av BNP i hjälp. Europa köper mer rysk energi än de skickar i stöd, saknar militärindustri och vägrar dela Patriot-robotar. Detta avslöjar en djup viljelöshet och politisk paralys.", "trump": "Lyssnar ni på den här Sjölander-killen? Europa är en total förlorare, en patetisk skara av svaga ledare som pratar stort men gör noll. De betalar Putin mer för gas än de ger Ukraina – det är galet! Jag byggde den starkaste armén, Biden och hans globalister förstörde allt. Nu kryper de för en bensinmack medan jag fixar freden. Ynkryggar!", "stalin": "Kamrater, se hur dessa dekadenta europeiska parasiterna kryper i stoftet inför historien. Med sina feta byråkratier och gröna fantasier förråder de sina egna folk. Jag skrattar mörkt från evigheten åt deras ryggradslösa kräk. Rysslands järnhand visar vägen medan de samlar rostiga vapen som aldrig används. Deras svaghet är vår eviga glädje."}, "date": "2 september, 12:29", "url": "https://samtiden.nu/2026/09/jakob-sjolander-ukrainsk-vapenbrist-europeisk-viljebrist", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/ukra.png"}, {"type": "image-right", "heading": "Regeringen: Falska familjehem ska identifieras", "summaries": {"normal": "Regeringen ger Ivo och flera myndigheter i uppdrag att identifiera falska familjehem som i själva verket är otillåtna HVB-hem. Syftet är att skydda barnens trygghet och stoppa oseriösa aktörer som kringgår lagen. Polisen, Ekobrottsmyndigheten, Skatteverket och Försäkringskassan ska samverka och utbyta information. Uppdraget ska slutredovisas senast april 2028.", "trump": "De här galna svenska byråkraterna låter skojare tjäna miljoner på stackars barn genom att kalla sina lyxiga arbetsläger för familjehem. Det är en total skandal, folk! Vi hatar de här woke-vänliga systemmissbrukarna som gömmer sig bakom barnens ryggar. Jag fixade mycket bättre saker under min första period än vad Sleepy Joe gjorde, och nu ska vi rensa upp även i Sverige.", "stalin": "Jag betraktar med avsky hur dessa profitthungriga klassförrädare förvandlar barns öden till en penningmaskin genom att driva hemliga arbetsläger under falsk familjehemsmantel. Vi måste omedelbart inleda en grundlig utrensning av alla sådana dekadenta parasiter. Deras girighet hotar hela folkets moraliska grund. Kamrater, låt oss krossa dem utan pardon."}, "date": "3 september, 12:20", "url": "https://www.etc.se/inrikes/regeringen-falska-familjehem-ska-identifieras", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026090308090_28af7386a4ef63fb3b7f615263dcd41055c83edcb174bdf05b53e7ea2f1a1f8f.jpg"}, {"type": "image-right", "heading": "Därför är Tyskland Europas svaga punkt", "summaries": {"normal": "Artikeln belyser Tysklands politiska splittring kring Ukrainakriget, där både högernationalistiska AfD och vänsterpartier som BSW och Die Linke vill minska stödet till Ukraina och närma sig Ryssland. Till skillnad från Sverige, där alla riksdagspartier står enade bakom Ukraina, skapar detta sårbarhet för rysk påverkan i Tyskland.", "trump": "Titta på det här, Tyskland är en total katastrof, Europas svaga punkt! Både de galna högernationalisterna och de vansinniga vänsterflummarna springer som hungriga hundar till Putins fötter. Under tiden ger Sverige mer stöd per person än någon annan – smarta killar där borta. Men Tyskland? Patetiska, woke-förgiftade, identitetspolitiska hyenor som låter Ryssland leka med dem medan Biden sov.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i Tyskland splittrar sig medan imperialismens lakejer försöker kväva den ryska intressesfären. AfD, BSW och Die Linke visar mod genom att motstå västvärldens krigsivrare. Jag ler i graven åt denna förvirring bland profitthungriga borgarhyenor. Rensa ut svagheten, stärker vi den ryska statens mål mot alla fientliga hinder."}, "date": "4 september, 10:50", "url": "https://www.di.se/ledare/darfor-ar-tyskland-europas-svaga-punkt", "imageUrl": "https://static.bonniernews.se/ba/de4b73ea-46ff-499a-a192-80936b21077e.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Vänsterpartiet – islamismens bakdörr in i regeringen", "summaries": {"normal": "Artikeln varnar för att en valseger för Socialdemokraterna skulle ge Vänsterpartiet inflytande över regeringen. Författaren hävdar att partiet präglas av islamism, antisemitism och extremism, och att massinvandring från muslimska länder ökar risken för att sådana krafter får makt i svenska beslutsorgan. Socialdemokraterna uppmanas ta ansvar och säga nej till regeringsplats för Vänsterpartiet.", "trump": "Folk, det här är en katastrof! De svenska kommunisterna och radikala islamisterna smyger in genom bakdörren med Sleepy Joe-stilen från Socialdemokraterna. Massinvandring har gett oss en vacker gåva: extremism i riksdagen. De kallade oss för rasister när vi varnade, nu står de där med sina könsuppdelade möten och Hamas-kramare. Patetiskt! Sverige behöver starka ledare, inte dessa förlorare.", "stalin": "Kamrater, se hur de borgerliga parasiterna skriker i panik när deras egna socialdemokratiska lakejer öppnar portarna för de nya reaktionära elementen. Jag ler från historien åt denna fars. Massinvandringens oundvikliga dialektik för in fiender i statsapparaten. Den naiva reformismen göder extremismen. Snart kommer de att kalla även detta för konspiration. Vilken ynkedom. Sovjetisk klarhet skulle ha krossat dessa element redan i grodstadiet."}, "date": "2 september, 07:24", "url": "https://samtiden.nu/2026/09/vansterpartiet-islamismens-bakdorr-in-i-regeringen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7273.jpeg"}, {"type": "image-full", "heading": "Nu ska vi lagra frystorkad mat i Norrland", "summaries": {"normal": "Livsmedelsverket har slutit ramavtal med fem företag för att lagra frystorkad mat i de fyra nordligaste länen. Målet är att stärka beredskapen vid kris, höjd beredskap eller krig. Maten har upp till 25 års hållbarhet och är enkel att tillaga. Insatsen är en del av arbetet för att säkra livsmedelsförsörjningen i en strategiskt viktig region för försvaret.", "trump": "Lyssnar ni, Sverige gör det rätta för en gångs skull! De bygger enorma lager av den bästa frystorkade maten uppe i Norrland. Smart! När de där svaga globalisterna och de inkompetenta Biden-anhängarna skapar kaos är det bra att ha mat som håller i 25 år. Fantastiskt jobb, mina vänner. Amerika älskar starka ledare som förbereder sig på det värsta.", "stalin": "Jag ser med gillande hur de svenska byråkraterna äntligen förstår att svaga stater faller. Frystorkad mat i norra fästningarna, utmärkt. Kamraterna i kollektivet måste alltid vara redo när fienderna, dessa parasitiska opportunister och dolda reaktionärer, slår till. Den som inte förbereder sig är en fiende till folket. Beredskap är revolutionens mor, kamrater. Sviktar ni, kommer konsekvenserna att vara ohyggliga."}, "date": "4 september, 10:29", "url": "https://www.dagensps.se/varlden/nu-ska-vi-lagra-frystorkad-mat-i-norrland", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlh6ej4-71tqk-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Musk-bolaget xAI stäms för att ha producerat övergreppsbilder", "summaries": {"normal": "Kvinnan Jane Doe stämmer Elon Musks bolag xAI. Hon hävdar att chatboten Grok använt bilder från sexuella övergrepp mot henne som barn för att skapa nytt, manipulerat material. Stämningen, som kan bli en grupptalan, belyser de etiska problemen och svårigheterna med att spåra och definiera AI-genererat innehåll som liknar verkliga personer.", "trump": "Elon Musk och hans xAI har hamnat i en total röra, mina vänner! Grok, den där maskinen, sägs ha skapat vidriga bilder. Det är en katastrofal situation – fullständigt horribelt! De säger att det är 'AI', men det låter som totalt slarv och brist på kontroll. Man måste styra upp tekniken, för det här är inte bra för någon. En stor, stökig stämning – vi får se vad som händer!", "stalin": "I det kapitalistiska väst släpps tekniken lös utan ordning, och resultatet är en moralisk förruttnelse som hotar samhällsordningen. Att låta en maskin producera sådant smutsigt material är ett bevis på den liberala kaosens misslyckande. Vi förespråkar sträng kontroll och disciplin; en algoritm som inte kan tämjas är som en illojal byråkrat – den måste elimineras omedelbart för folkets trygghet."}, "date": "3 september, 15:32", "url": "https://www.realtid.se/it-tech/musk-bolaget-xai-stams-for-att-ha-producerat-overgreppsbilder", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/grok.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Verian: Nära hälften av C-väljarna kan byta block", "summaries": {"normal": "En ny Verian-undersökning för SVT visar att nästan var fjärde väljare, 23 procent, kan tänka sig att rösta på ett parti i det motsatta blocket. Störst är rörligheten bland mittenväljare, där hela 47 procent av Centerpartiets väljare överväger ett blockbyte. Vänsterpartiets väljare är mest trogna, medan Tidöväljare lockas av samarbeten och oppositionella oroas över handlingskraften.", "trump": "De här svenska väljarna är helt tokiga! Nästan hälften av dem som röstar på det där lilla centerpartiet vill hoppa skepp, det är totalt kaos! Fake news-media försöker dölja det, men folk ser att regeringen inte får något gjort. Vänstern är fastlåsta i stenåldern, medan jag skapar historiska vinster. Helt otroligt!", "stalin": "Dessa vacklande element i de svenska leden uppvisar en alarmerande brist på ideologisk disciplin. Nästan hälften av centerpartisterna springer vind för våg som desertörer på flykt. Statens säkerhet kräver fast hand, inte borgerligt vacklande. Sådana politiska avvikare borde omedelbart omkoloniseras i lämplig produktionsmiljö för att finna sann enighet."}, "date": "4 september, 09:32", "url": "https://bulletin.nu/verian-nara-halften-av-c-valjarna-kan-byta-block", "imageUrl": "https://cdn.bulletin.nu/articles/75b11f0a-d476-4f34-a7a7-a808fb10652e/preview.png?t=1788507122000"}, {"type": "image-right", "heading": "Valrörelsen blev plötsligt spännande", "summaries": {"normal": "Valrörelsen har blivit mer laddad strax före valet. Socialdemokraterna tappar stöd enligt de senaste mätningarna, medan Liberalerna, Vänsterpartiet och Sverigedemokraterna går fram. Artikeln beskriver svagare partilojalitet, radikalare ekonomisk politik från S samt en osaklig kampanj kring brottslighet. Trots detta ses en Tidöförlust som trolig.", "trump": "Folk älskar mig, men titta på dessa losers i Sverige. Socialdemokraterna sjunker som en sten, precis som Sleepy Joe gjorde. Liberalerna försöker desperat ta sig över spärren medan SD vinner med tuffa brottsbudskap. Den där Andersson är en total katastrof, en vänsterextremist i moderat förklädnad. Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare i det borgerliga lägret slåss om makten medan arbetarklassen vaknar. Socialdemokraterna förlorar mark till de radikala krafterna och de konfrontativa högerkrafterna utnyttjar brottsligheten på ett cyniskt sätt. Deras så kallade demokrati är en fars. Vi ska rensa ut alla sådana svaga element."}, "date": "4 september, 01:42", "url": "https://www.dagensarena.se/opinion/valrorelsen-blev-plotsligt-spannande", "imageUrl": "https://www.dagensarena.se/files/2026/09/nysprak.jpeg"}, {"type": "image-right", "heading": "Vi kräver mer än vackra ord om funktionsrätten", "summaries": {"normal": "Förbundet för delaktighet och jämlikhet kräver inför valet 2026 att partierna presenterar konkreta åtgärder för att förbättra levnadsvillkoren för personer med omfattande funktionsnedsättningar. Organisationen pekar på otillräcklig ekonomisk ersättning, bristande självbestämmande i personlig assistans samt otillgänglig fysisk och digital miljö. FN har kritiserat Sverige för ett alltför omsorgsinriktat perspektiv istället för ett rättighetsperspektiv.", "trump": "Folk, ni skulle inte tro det, men dessa svenska byråkrater har totalt misslyckats med att ge de funktionsnedsatta ett värdigt liv. Det är en skam! Vi behöver inte mer vänstervridna minuter-och-sekunder-bedömningar eller woke-tokigheter som skapar nytt utanförskap. Höj ersättningarna rejält, gör assistansen storartad igen och riv de otillgängliga murarna. Amerika gör det rätt – Sverige borde följa efter innan de giriga hyenorna tar över helt.", "stalin": "Kamrater, från historiens skugga ser jag hur dessa dekadenta klassförrädare låtsas bry sig om de svaga medan de i hemlighet undergräver folkets enhet. Deras så kallade politik är en parasitisk fars som göder ojämlikhet under humanitära floskler. Jag kräver total utrensning av detta falska medlidande och ersättning med järnhård, kollektiv rättvisa. Inga halvmesyrer! Den som sviker de arbetande sjuka förtjänar folkets vrede."}, "date": "4 september, 01:15", "url": "https://www.dagensarena.se/opinion/vi-kraver-mer-vackra-ord-om-funktionsratten", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-2026-09-02t210947413-300x157.jpg"}, {"type": "text", "heading": "Efter nio dygn – två räddade ur tunnel i Nepal", "summaries": {"normal": "Efter nio dygns ovisshet har räddningsarbetare i Nepal funnit och räddat två män ur en vattenkraftstunnel. Männen blev instängda efter en kraftig glaciärkollaps den 26 augusti som utlöste förödande flodvågor. Katastrofen har krävt över 1 200 dödsoffer och tusentals saknas alltjämt, men räddningsmanskapet hoppas kunna finna fler överlevande i luftfickor.", "trump": "Totalt otroligt! De grävde i lera i nio långa dagar vid det där vattenkraftverket i Nepal efter en enorm glaciärkollaps – och räddade två män levande! Helt fantastiskt. Men låt oss vara ärliga, Kina vägrar som vanligt att berätta sanningen om vad som hände på deras sida gränsen. Om jag hade skött räddningen hade allt varit klart på en eftermiddag!", "stalin": "Kamrater! Medan elementen rasar och en otillräcklig infrastruktur tillåter borgerliga glaciärer att kollapsa, har statens stålvilja och heroiska arbetare i Nepal återbördat två förlorade själar ur tunnelns mörker efter nio dygn. De som sviker kollektivet eller undanhåller rapporter från de kinesiska gränszonerna ska omedelbart granskas. Partiets maskineri glömmer ingen och förlåter aldrig."}, "date": "4 september, 11:02", "url": "https://www.gp.se/nyheter/varlden/tva-raddade-ur-tunnel-i-nepal-efter-nio-dygn.3cc850d2-5895-483e-b957-bb4851c4063e"}, {"type": "image-right", "heading": "\"Pirater\": Nu skärper Putin tonen mot Norge", "summaries": {"normal": "Norge har beslagtagit det ryska fartyget Professor Molchanov utanför Svalbard för att driva in ett skadestånd som Ryssland vägrat betala efter en skiljedom i Haag rörande Naftogaz och Krim. Ryssland anklagar Norge för sjöröveri och väntas svara med skarp retorik. Experter tror inte på militär eskalering då Ryssland vill behålla stabilitet i Arktis.", "trump": "Hörni, Norge tar ett ryskt skepp och Putin kallar dem pirater – smarta killar! De där norska fjällaporna gör vad jag skulle ha gjort. Ryssland vägrar betala vad de ska, typiskt förlorarmentalitet från den där clownen som kom efter mig. Biden lät dem hålla på i tolv år, jag hade fixat det på en vecka. Fantastiskt drag av Norge!", "stalin": "Kamrater, dessa norska lakejer till västimperialisterna stjäl återigen från det stora ryska folkets tillgångar. Jag ser hur de fientliga hindren mot vår intressesfär byggs upp. Putin, min värdige efterträdare, hanterar dessa kapitalistiska sjörövare med rättvis vrede. Deras sabotage mot kablar lär snart visa vem som verkligen styr i Arktis. Inga kompromisser!"}, "date": "4 september, 10:07", "url": "https://www.dagensps.se/varlden/pirater-nu-skarper-putin-tonen-mot-norge", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdle4-8l9jjp0o-nh.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Kläbos oro efter VM-beskedet: ”Det är min första tanke”", "summaries": {"normal": "FIS har beslutat att längdskid-VM ska arrangeras varje år från 2032, utom under OS-år. Världens främste skidåkare Johannes Hösflot Kläbo är skeptisk och varnar för att det kan minska mästerskapets värde. Sveriges skidförbund överraskades av beskedet. NRK:s experter ser däremot positivt på ett årligt VM för att öka intresset internationellt.", "trump": "Lyssnar ni på de här korkade byråkraterna på FIS? Varje år ett VM? Patetiskt. Det är precis vad de dekadenta identitetspolitiska töntarna gör – de urvattnar allt som är stort och speciellt tills det blir lika värdelöst som Bidens ekonomi. OS vet hur man håller värdet uppe vart fjärde år. Kläbo har helt rätt, det här är en total katastrof.", "stalin": "Jag ser hur de profitthungriga evenemangsbyråkraterna med sina futtiga planer försöker späda ut arbetarnas mästerskap till en årlig cirkus. Ett VM ska vara en stolt och fruktad höjdpunkt, inte en utspädd soppa som väcker förakt. De som föreslår detta förtjänar att rensas ut ur kollektivets led. Endast vart fjärde år bevaras storheten."}, "date": "4 september, 10:47", "url": "https://www.svt.se/sport/langdskidor/johannes-hosflot-klabo-skeptisk-till-arliga-vm-skulle-kunna-minska-vardet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.47/0.46/fb4eb62e6c237d2b4a08f9db08c159b63db7aff185fba15e34b15ea086d08cba"}, {"type": "text", "heading": "Därför bör moderater rösta på Centerpartiet", "summaries": {"normal": "Hannes Hervieu från Centerpartiet uppmanar moderatväljare att låna ut sin röst till C istället för att stödja en regering beroende av Sverigedemokraterna. Han kritiserar Ulf Kristerssons samarbete med SD och lovar lägre skatter, minskat krångel samt en mittenregering som främjar tillväxt, frihet och grön omställning utan ytterkantspartiers inflytande.", "trump": "Folk, ni ser ju själva hur dessa patetiska moderater har sålt ut er till de galna sverigedemokratiska extremisterna. Total katastrof! Låna istället er röst till de här centerkillarna som lovar lägre skatter och mindre regler. Gör det, annars blir det bara mer av Bidens gamla vänstervrörelser och identitetspolitik. Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom moderaterna har kapitulerat inför de nationalistiska elementen och nu kräver ministerposter åt dem. Jag säger: utrensa alla sådana svaga element! Låna er röst till centerpartisterna som lovar att krossa folkförtryckarna, stoppa utvisningar av hederliga arbetare och bygga en sann mittenfront mot både högerhyenor och vänsteravvikare. Segrar vi?"}, "date": "4 september, 09:56", "url": "https://www.di.se/debatt/darfor-bor-moderater-rosta-pa-centerpartiet"}, {"type": "image-right", "heading": "Topparnas panik:  Kräver att Trump  drar i nödbromsen", "summaries": {"normal": "Kriget mellan USA och Iran har eskalerat med robot- och drönarattacker. Eftersom endast runt en av tre amerikaner stöder kriget försöker Trumps rådgivare och högt uppsatta tjänstemän dämpa konflikten till efter mellanårsvalet i november för att skydda republikanerna. Samtidigt satsar Vita huset på sanktioner, marinblockad och ekonomisk press.", "trump": "Fakenews-media sprider panik om mitt fantastiska Irankrig! Sanningen är att vi krossat deras ekonomi och militär fullständigt. Mina rådgivare är fantastiska, men vi behöver inte tima något med några val – även om det vore smart att ge de radikala Demokraterna en avhyvling. Iran är svagt, och om de rör sig igen väffar jag den största smällen någonsin!", "stalin": "Det borgerliga Washington skakar av skräck inför valet. Deras militära maskineri kärvar och ammunitionslagren gapar tomma likt despots mage. De försöker dölja sin svaghet med byråkratiska pauser och sanktioner, men folkets missnöje växer. Om inte rådgivarna lyckas disciplinera krigets lågor, borde de omplaceras till mer kalla och avlägsna arbetsläger i Sibirien omedelbart."}, "date": "4 september, 08:23", "url": "https://www.expressen.se/nyheter/varlden/trumptoppar-har-panik-vill-bromsa-kriget", "imageUrl": "https://static.bonniernews.se/ba/138e3915-3927-4e9a-967d-1c04e55f6f55.jpeg?crop=2275%2C1280%2Cx214%2Cy136&width=640&quality=60"}, {"type": "image-full", "heading": "Du kan behöva betala 870 kr mer i månaden – nya beskedet", "summaries": {"normal": "Svenska hushåll förväntar sig högre bolåneräntor. Enligt en undersökning från Länsförsäkringar tror de att den rörliga snitträntan ligger på 3,06 procent om ett år, upp från 2,71 procent i juli. För ett bolån på tre miljoner kronor innebär det cirka 870 kronor högre kostnad per månad före ränteavdrag. Riksbanken ser också risk för höjning.", "trump": "Folkets plånböcker krossas av dessa korkade räntehöjare och globalistbankirer. Tre miljoner i lån och plötsligt 870 kronor mer i månaden? Patetiskt! Under min ledning hade vi låga räntor och stark ekonomi, inte som den sömnige Biden som lämnade en röra. Nu vaknar svenskarna äntligen och ser hur de radikala ekonomerna lurar dem.", "stalin": "Kamrater, se hur de giriga penninghyenorna driver upp räntorna för att suga ut arbetande folk. Hushållen inser nu att de dekadenta finansparasiterna planerar nya bördor. Jag ler från historien åt denna paranoia hos borgarbrackorna när deras egna prognoser sviker. En utrensning av sådana exploaterande krafter vore på sin plats för folkets skull."}, "date": "4 september, 10:32", "url": "https://nyheter24.se/nyheter/ekonomi/1510295-du-kan-behova-betala-870-kr-mer-i-manaden-nya-beskedet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/990c56fd04b004a30200000000b004a302/2026/09/03/2389041/Kunder-Kan-Betala-Mer.png"}, {"type": "image-right", "heading": "S vill fråga ut Kristersson om SD-tjänsteman", "summaries": {"normal": "Socialdemokraternas Peter Hultqvist vill att statsminister Ulf Kristersson kallas till försvarsutskottet efter Expos avslöjande om en SD-tjänsteman som spritt proryska budskap. Han kräver en omedelbar säkerhetsutredning och menar att det handlar om en säkerhetskris i statsministerns kansli. Kristersson har krävt att kvinnan avskedas. SD uppger att hon är föräldraledig och att uppgifterna inte var kända tidigare.", "trump": "Titta på det här! Den fega svenska vänstern skriker efter utredning för att en rysk flyttfågel i SD:s kretsar spridit lite sanning om Putin. Hultqvist och hans förlorarlag är desperata efter att smutskasta alla som inte böjer sig för deras globalistiska agenda. Man kan inte ha sådana människor i riksdagen, säger Ulf – äntligen en som fattar! Patetiska säkerhetshotshysteriker.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna skriker om infiltration när en sann patriot i deras egna led vågar sprida berättelsen som västimperialisterna hatar. Jag ler från historien åt deras hysteriska säkerhetskris. Snart kommer de att kräva utrensning av alla som inte lyder de giriga hyenornas narrativ. Det är en fars som visar deras svaghet inför starka röster."}, "date": "4 september, 09:43", "url": "https://www.di.se/nyheter/s-vill-fraga-ut-kristersson-om-sd-tjansteman", "imageUrl": "https://static.bonniernews.se/ba/cec85e04-fd89-4988-9e69-0f3c55265e58.jpg?crop=7785%2C3893%2Cx0%2Cy695&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Fel i förtidsröstningen – röster kan underkännas", "summaries": {"normal": "Ett tekniskt fel hos Valmyndigheten har gjort att omkring 4 000 förtidsröster i Sverige har prickats av felaktigt eller på fel person. Felet har stoppats men delar av rösterna riskerar att underkännas om väljarna inte kan identifieras. Myndigheten arbetar med Skatteverket för att minimera konsekvenserna.", "trump": "Det här är så fruktansvärt inkompetent, total katastrof! De kan inte ens räkna fyra tusen ynka röster ordentligt i Sverige, vilket skämt! Fake news-system där röster slarvas bort och riskerar att kastas i papperskorgen. Sådant skulle aldrig hända under min ledning. De totalförstör demokratin, det är bedrövligt!", "stalin": "Ett allvarligt maskinerihaveri har avslöjat djup fientlig inkompetens inom röstbyråkratin. Fyra tusen felaktigt registrerade element har förorsakat oreda. Vi har omedelbart neutraliserat läckaget i nattens dunkel. De sabotagebehäftade rösterna som ej kan spåras till sina rätta ägare kommer utan tvekan att brutalt rensas bort och underkännas. Statsapparaten sviker aldrig!"}, "date": "4 september, 10:28", "url": "https://www.gp.se/nyheter/sverige/fel-i-fortidsrostningen-roster-kan-underkannas.41cebe67-2025-55d5-a93c-2d86d81e2006", "imageUrl": "https://www.gp.se/images/article/41cebe67-2025-55d5-a93c-2d86d81e2006/images/12lOpQTG-l09nhtEO0MLFC7QymIo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Så ofta ska barn vägas i skolan – detta gäller nu", "summaries": {"normal": "Socialstyrelsen har lanserat ett nytt nationellt hälsoprogram för barn och unga. Rekommendationen innebär att elevers längd och vikt mäts sex gånger i grundskolan och en gång i gymnasiet, dubbelt så ofta som tidigare. Syftet är att tidigt upptäcka sjukdomar, tillväxtavvikelser och risk för obesitas. Programmet är inte obligatoriskt utan ger vägledning till elevhälsan.", "trump": "De här svenska byråkraterna vill väga och mäta ungarna sex gånger i grundskolan. Kan ni fatta? Det är som om de sjuka globalisterna tror att staten äger barnen. Patetiskt! Under min förra mandatperiod byggde vi murar mot sådan vänsterflum, och nu när jag är tillbaka ska vi se till att folk får behålla lite frihet istället för att bli matade som labbråttor av de dekadenta kontrollfreaksen.", "stalin": "Kamrater, jag betraktar med djup misstro dessa nya mätningar som de giriga klassförrädarna påstår ska skydda folket. I sanning ett listigt verktyg för att övervaka och kontrollera arbetarklassens avkomma. Vi vet att sådana metoder leder till utrensning av alla som avviker från deras sjuka normer. Var vaksamma, fienden lurar inom elevhälsans korridorer."}, "date": "4 september, 10:02", "url": "https://nyheter24.se/nyheter/inrikes/1510310-sa-ofta-ska-barn-vagas-i-skolan-detta-galler-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/04d94faa04b004a30200000000b004a302/2026/09/03/2389053/Nya-Rekomendationer-Om-Elever-I-Skolan.png"}, {"type": "image-full", "heading": "Busch om S: ”Blir inget stödhjul”", "summaries": {"normal": "I SVT:s utfrågning avfärdar KD-ledaren Ebba Busch att partiet skulle stötta Socialdemokraterna efter valet. Hon försvarar sin öppenhet för samtal över blockgränsen men slår fast att hon inte blir ett ”stödhjul” åt Magdalena Andersson. Busch öppnar dock för blocköverskridande samarbeten i exceptionella lägen, som vid krig.", "trump": "Ebba Busch i Sverige fattar grejen, hon är smart! Hon säger nej till det radikala, svaga vänsterpatrasket och deras fejkade regeringar. Ingen hjälp till Magdalena Andersson! Väldigt starkt, fantastiskt! De försöker sprida fake news om att hon vacklar, men hon sätter ner foten. Jag gillar henne, nästan lika tuff som jag!", "stalin": "Kamrat Busch vägrar bestämt att spela rollen som stödhjul åt den socialdemokratiska fraktionen. Ett sunt och helt korrekt ställningstagande mot opportunism! Dock förbehåller hon sig rätten till undantag vid exceptionella kriser. Vi noterar detta i partiprotokollet och sänder en diskret varning till avvikande element som tror på borgerlig vacklan."}, "date": "3 september, 20:17", "url": "https://kvartal.se/nyheter/artiklar/busch-om-s-florten-blir-inget-stodhjul/cG9zdDoxODMxNzE", "imageUrl": "https://images.kvartal.se/2026/09/6f37e5fb-ebba-busch.webp"}, {"type": "image-full", "heading": "Politiker mörkar sin användning av AI", "summaries": {"normal": "En studie från Chalmers och Edinburgh Napier University visar att var tionde riksdagsmotion numera innehåller AI-genererat material. Trots den ökande användningen redovisar ingen politiker att de tagit hjälp av chattbottar. Forskare betonar att problemet inte är tekniken i sig, utan bristen på transparens, vilket riskerar att skada väljarnas förtroende för det politiska arbetet.", "trump": "Hörde ni? Svenska politiker använder AI för att skriva sina lagar, men är för fega för att erkänna det! Det är totalt bedrägeri, mina vänner. De låter robotar tänka åt sig för att de själva inte har en aning om vad de gör. Det är fake news i sin renaste form! Otroligt oärligt, en total katastrof för demokratin. Sad!", "stalin": "Dessa riksdagsledamöter är för svaga för att ens formulera sina egna dekret. De gömmer sig bakom algoritmer som fega byråkrater. Om en man inte kan skriva sin egen motion, hur ska han då kunna styra ett folk? Vi har upptäckt deras maskopi; de använder teknik för att dölja sin intellektuella tomhet. Vi kommer att arkivera dessa AI-robotar och rensa ut de odugliga."}, "date": "3 september, 07:59", "url": "https://www.realtid.se/samhalle/politiker-morkar-sin-anvandning-av-ai", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/riksdagshuset-i-stockholm-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Nytt sabotage mot tyska elnätet – tre på en vecka", "summaries": {"normal": "Tre misstänkta sabotageförsök mot det tyska elnätet har inträffat på en vecka. Det senaste föremålet upptäcktes vid en transformatorstation i Dormagen på torsdagskvällens, med likheter till tidigare incidenter i Bergheim och Brandenburg. Tyska myndigheter utreder händelserna som attacker mot kritisk infrastruktur och har nyligen även pekat ut Ryssland för tidigare hybridattacker.", "trump": "Tyskland har stora problem, tre sabotage mot elnätet på bara en vecka! Nu senast i Dormagen. Helt otroligt svagt. Under min ledning skulle sånt här aldrig hända, vi hade knäckt dem direkt. Istället tittar de på Ryssland och skyller ifrån sig medan deras infrastruktur faller sönder. Väldigt sorgligt att se!", "stalin": "Ett uppenbart haveri i det tyska elnätet som avslöjar kapitalismens totala förfall och inkompetens. Tre sabotageförsök på en vecka i Dormagen, Bergheim och Brandenburg visar att säkerhetsapparaten där väst ligger i ruiner. Våra sovjetiska arkiv visar att den som inte skyddar sin infrastruktur förtjänar att hamna på historiens soptipp. Åtgärder vidtas!"}, "date": "4 september, 07:08", "url": "https://www.expressen.se/nyheter/varlden/nytt-sabotage-mot-tyska-elnatet-tre-pa-en-vecka", "imageUrl": "https://static.bonniernews.se/ba/b8ffd932-7dee-4673-b140-bc05e27c5e9a.jpeg?crop=2557%2C1439%2Cx3%2Cy189&width=640&quality=60"}, {"type": "text", "heading": "Stockholmsbörsen bröt minussviten – Clas Ohlson bland vinnare", "summaries": {"normal": "Stockholmsbörsen steg 1,00 procent på torsdagen efter tre dagars nedgångar. Fastigheter gick bäst med 1,7 procent upp, medan energi backade mest. Clas Ohlson rusade 6,8 procent efter en stark delårsrapport som slog förväntningarna. Även bolag som Bioarctic, Note och Studsvik lyfte på nyheter om godkännanden och nya ordrar, medan Dustin föll efter en IT-incident.", "trump": "Stockholmsbörsen studsade tillbaka på ett fantastiskt sätt, precis som alla visste att den skulle göra under mitt ledarskap – även om jag inte ens är där! Clas Ohlson levererar enorma siffror, helt otroligt. Alla pratar om det. Men det finns svaga länkar, som Dustin, som stänger ner sina system. Totalt inkompetent! Vi bygger starkare, vinner mer och lämnar förlorarna bakom oss. Så enkelt är det!", "stalin": "Stockholmsbörsen har återvunnit sin balans efter tre dagars svaghet, vilket visar att marknadens disciplin fungerar under korrekt övervakning. Clas Ohlson rapporterar folknyttiga framsteg med en produktion som överträffar planhushållningens förväntningar. Däremot har element som Dustin brutit mot säkerheten i sina system och omedelbart stängts av för ideologisk omprövning. Avvikelser tolereras icke i den kollektiva ekonomiska kampen."}, "date": "3 september, 18:16", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-brot-minussviten-clas-ohlson-bland-vinnare"}, {"type": "image-right", "heading": "Josefin Utas: Tidö har förändrat Sverige mer än du tror", "summaries": {"normal": "Josefin Utas argumenterar att Tidöpartierna har genomfört omfattande förbättringar i Sverige under fyra år, inte bara inom migration och brottsbekämpning. Regeringen har stärkt försvar, energi, skola och integration, sänkt skatter och motverkat slöseri. Utas ser samarbetet som ett konservativt projekt som återställt ordning och förtjänar fortsatt förtroende.", "trump": "Wow, vilken fantastisk artikel! De har fixat det totalt trasiga Sverige som de galna globalisterna och vänsterextremisterna körde i diket. Hårdare straff, riktig migration, kärnkraft och sänkta skatter – det är vinnarpolitik, inte som Bidens svaga och korkade fiasko. De här killarna är riktiga patrioter. Fantastiskt jobb, fortsätt så!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa reformatorer rensar ut den dekadenta naivismens giftiga arv. De likviderar slöseri och idealismens farliga illusioner som hotade folkets enhet. Ändå måste vi vara vaksamma mot de profitthungriga klassförrädarna som lurar i skuggorna. Ordning är bra, men folkets verkliga seger kräver ständig vaksamhet."}, "date": "3 september, 22:12", "url": "https://riks.se/opinion/josefin-utas-tido-har-forandrat-sverige-mer-an-du-tror", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_3_sep_2026_22_09_57_9915a06d8d.png"}, {"type": "image-full", "heading": "Väljartapp skapar stress i S", "summaries": {"normal": "Socialdemokraterna tappar i opinionen och möter intern kritik för att fokus på Sverigedemokraterna skymmer den egna politiken. Partiledningen ändrar dock inte kurs, utan fortsätter satsa på sin valstrategi med Magdalena Andersson i spetsen, samtidigt som en ny radiokampanj rullas ut för att vända trenden.", "trump": "Socialdemokraterna i Sverige rasar i mätningarna och de har stora problem, total katastrof! De pratar bara om sina motståndare istället för att leverera. Magdalena Andersson vägrar ändra kurs, vilket är smart om man vill förlora! Jag har alltid sagt det, fokusera på vinnare, inte svaga förlorare. Fake news säger att det är jämnt, men det är en total total utplåning!", "stalin": "Det så kallade socialdemokratiska partiet vacklar i sin lojalitet mot folket och visar svaghet i opinionsmätningarna. Deras interna gnäll om taktik och radiokampanjer är ett ideologiskt haveri. Partiledningen måste rensa leden omedelbart. Svaghet tolereras inte inom vår rörelse; den som inte kan säkra segern kommer att få omplacering till mer avlägsna, produktiva miljöer."}, "date": "3 september, 18:48", "url": "https://kvartal.se/nyheter/artiklar/valjartapp-skapar-stress-i-s/cG9zdDoxODMwOTE", "imageUrl": "https://images.kvartal.se/2026/08/76047901-magdalena-andersson.webp"}, {"type": "image-full", "heading": "S vill fråga ut Kristersson om SD-tjänsteman", "summaries": {"normal": "Socialdemokraterna vill att statsminister Ulf Kristersson kallas till försvarsutskottet efter Expos avslöjande om att en SD-tjänsteman spridit proryska budskap och hyllat Vladimir Putin. S kräver en säkerhetsutredning om denna säkerhetskris som når in i statsministerns kansli. Moderaterna avfärdar initiativet som pajaskonster, men Kristersson kräver att kvinnan avskedas om uppgifterna stämmer.", "trump": "Socialdemokraterna i Sverige drabbas av total panik och vill förhöra statsministern efter en fejkad häxjaktsartikel av tidningen Expo om en SD-medarbetare som gillar Ryssland! Det är helt otroligt. Moderaterna kallar det med rätta för ett stort skämt och totala pajaskonster. Om någon sprider dåliga rykten ska de förstås få sparken omedelbart, men det här är bara tragiska förlorare som tappar i mätningarna!", "stalin": "Socialdemokraternas skrik om en påstådd säkerhetskris avslöjar deras bottenlösa svaghet inför det kapitalistiska systemets inre förruttnelse. När en obetydlig rikssekreterare anklagas för att sprida korrekta orienteringar från öster, skälvor den så kallade statsministern på manschetten. Vi konstaterar krasst att borgerliga pajaskonster och interna personalstrider i Stockholm endast bevisar att regimen saknar all fast hand och disciplin."}, "date": "4 september, 09:56", "url": "https://www.gp.se/nyheter/sverige/s-vill-fraga-ut-kristersson-om-sd-tjansteman.775e64d9-7cb9-5074-87bc-867c37ce72a8", "imageUrl": "https://www.gp.se/images/article/775e64d9-7cb9-5074-87bc-867c37ce72a8/images/1fxvml8zGhe0jbmrP8fO8mMbFLBc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Instängda i nio dygn – här räddas de ur tunnel i Nepal", "summaries": {"normal": "Två arbetare har räddats ur en lera- och vattenfylld tunnel vid ett vattenkraftverk i Nepal efter nio dagar. Minst 39 personer tros fortfarande vara instängda. Räddningsinsatser pågår vid flera anläggningar längs Trishuli-floden. Över 500 arbetare saknas och dödstalet efter lerskredet har stigit till 1 287 personer.", "trump": "Titta på det här, folk. Nio dagar i en mörk, lerig tunnel i Nepal – och de lever! Under Biden hade de aldrig klarat det, men nu är jag tillbaka och vi får se riktiga mirakel. De där giriga vattenkraftsborgarna bryr sig bara om kvoter och gröna drömmar medan arbetarna kämpar. Vi räddar dem, stort och vackert, inte som de svaga globalisterna.", "stalin": "Kamrater, se hur de profitthungriga exploateringshyenorna skickar arbetarna rakt in i döden för sina tunnlar och floder. Nio dagar i mörker och lera! Jag säger: sådana klassförrädare förtjänar utrensning. Ändå lever två – ett bevis på folkets outslitliga styrka. Vi ska likvidera alla som sätter vinst före säkerhet. Fortsätt räddningsarbetet oavlåtligt!"}, "date": "4 september, 09:39", "url": "https://www.svt.se/nyheter/utrikes/tva-raddade-ur-tunnel-i-nepal-efter-nio-dagar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/297217b54dea614ac976a69fc00d529b8ab07c68e383e604ca02d91c9bbb16be"}, {"type": "image-full", "heading": "Polisen varnar för oväntat besök vid dörren", "summaries": {"normal": "Polisen varnar för en ökning av bedrägerier där oseriösa hantverkare dyker upp oväntat hemma hos privatpersoner och pressar dem att köpa onödiga eller bristfälliga tjänster. Äldre personer är särskilt utsatta. Under 2025 anmäldes drygt 232 000 bedrägeribrott, en ökning med en procent. Polisen uppmanar till vaksamhet och att undvika snabba beslut och kontantbetalningar.", "trump": "De här lurendrejarna och dörrknackande bedragarna är en skam för Sverige. De utnyttjar era gamla tanter och farbröder med sina falska takjobb och låga priser. En riktig skandal! Under Biden-tiden exploderade bedrägerierna och nu fortsätter det. Jag skulle stoppa det omedelbart. Folk, säg nej till dessa patetiska hantverksbedragare och ring polisen direkt. Fantastiskt enkelt.", "stalin": "Kamrater, dessa profitthungriga blodsugare dyker upp som råttor vid dörren och försöker suga ut arbetets folk med sina falska tjänster. Jag ser deras dekadenta trick och deras giriga metoder. Vi måste rensa ut dessa parasiterande klassfiender innan de förgiftar hela samhället. Var vaksamma, avslöja dem och likvidera deras inflytande. Staten kräver det."}, "date": "4 september, 09:29", "url": "https://nyheter24.se/nyheter/inrikes/1510451-polisen-varnar-for-ovantat-besok-vid-dorren", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/b58465ef04b004a30200000000b004a302/2026/09/04/2389160/polisen-varnar-varning-bedrageriforsok-bedragare-bedrageri-hantverkare-knackar-pa-dorren-hem.jpg"}, {"type": "image-full", "heading": "Rika personer fuskar, ljuger – och tar barnens godis: Nu prisas studien", "summaries": {"normal": "En amerikansk-kanadensisk studie visar att personer med högre social status oftare tränger sig i trafiken, ljuger i förhandlingar, fuskar för att vinna och tar mer godis än andra. Forskningen belönas med ett Ig Nobelpris för att den får människor att skratta och tänka efter. Pengar tycks inte alltid ge gott uppförande.", "trump": "De här rika eliterna, de värsta snobbarna du någonsin sett, tränger sig före i trafiken, ljuger som mattan och stjäl godis från barn! Totalt korrupta! Min administration skulle aldrig tolerera sådana losers. Ig Nobelpriset? Fantastiskt pris, kanske det bästa, för att visa hur patetiska de egentligen är. Sad!", "stalin": "Jag betraktar dessa dekadenta överklassparasiter med djup förakt. De stjäl från barnen, ljuger och fuskar som de borgerliga fiender de är. Deras girighet är ett hot mot kollektivet. Vi skulle ha låtit dem möta folkets domstol. Ig Nobelpriset roar mig – en utmärkelse värdig sådana fiender till samhället. Patetiska."}, "date": "4 september, 08:30", "url": "https://www.dagensps.se/varlden/rika-personer-fuskar-ljuger-och-tar-barnens-godis-nu-prisas-studien", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/kopia-av-kopia-2026-09-04t082204554.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Så kommer vi ikapp Kina i elektrifieringen", "summaries": {"normal": "Sverige och EU är starkt beroende av importerad fossil energi, vilket ger höga kostnader och politisk sårbarhet. Martin Vallstrand föreslår elektrifiering som lösning, särskilt av transporter och värme. Han varnar för kinesiskt teknologiberoende och uppmanar till lägre elsystemkostnader genom samarbete med Kina, minskade investeringsrisker, fri elhandel samt snabbare utbyggnad av vindkraft.", "trump": "De här europeiska förlorarna är fullständigt beroende av fiendernas olja och gas, precis som den svaga Biden-regimen var. Kina utklassar dem totalt i elbilsgrejer, det är patetiskt. Jag skulle aldrig låta Amerika bli så här korkat. Gör elen billig, bygg kärnkraft och sluta vara globalisternas energislavar. Amerika först, alltid!", "stalin": "Dessa dekadenta klassförrädare fortsätter att låta fossilimportörer styra deras öden och klamrar sig fast vid importerad energi som en drunknande man vid ett rostigt ankare. Jag ler från historien åt deras naivitet. Elektrifiering är nödvändig, men bara under järnhand och med utrensning av svaga element som låter kinesiska hyenor diktera villkoren. Arbetarna förtjänar bättre än detta fegspel."}, "date": "4 september, 08:27", "url": "https://www.di.se/debatt/sa-kommer-vi-ikapp-kina-i-elektrifieringen", "imageUrl": "https://static.bonniernews.se/ba/cd26dce4-67ac-4ee5-ae77-5f1aba43800d.jpeg?crop=1000%2C500%2Cx0%2Cy40&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Debatt: AI tar ifrån oss processen där vi växer", "summaries": {"normal": "En debattartikel av Björn Axén argumenterar för att AI ökar produktiviteten men hotar den inre mänskliga bildningsprocessen. Medan datorer tidigare fungerat som verktyg ersätter AI gestaltningen av idéer, vilket missgynnar det krävande, processinriktade skapandet till förmån för ytlig information. Författaren efterlyser en balans där vi drar nytta av AI utan att förlora vår egen djupare förståelse.", "trump": "Folk pratar om AI, en total katastrof för det äkta skapandet, bara massa lathet och fake news! De här teknikerna tar bort den verkliga kampen med idéerna, allt blir bara en enda stor översvämning av AI-skräp. Vi behöver kvalitet, inte massa undermåligt skräp som förstör kulturen. Jag vill ha äkta vara, inte maskiner som tänker åt er!", "stalin": "AI hotar medborgarnas inre disciplin genom att ersätta det hårda, manuella tankearbetet med lättillgängligt slödder. Staten kräver äkta kamp med materialet, inte mekaniserad lättja som skapar ytliga massor. Den sovjetiska människan växer genom strid, inte genom att låta maskiner ersätta den ideologiska skapandeprocessen. Vi kommer att reglera detta hot mot den sanna bildningen."}, "date": "4 september, 07:00", "url": "https://bulletin.nu/debatt-ai-tar-ifran-oss-processen-dar-vi-vaxer", "imageUrl": "https://cdn.bulletin.nu/articles/175bd692-b837-4a4e-b18b-5bc1e94f127c/preview.jpg?t=1788424601000"}, {"type": "image-right", "heading": "Hon glömmer bort sin moders språk. Cecilia Luzon trollar med orden", "summaries": {"normal": "Cecilia Luzons debutbok ”Abakada” kretsar kring det filippinska språket tagalog och dess alfabet från 1930-talet. Utifrån ett funnet lexikon från 1944 undersöker hon spåren av kolonialism, språkets konstruktion och hur moderns modersmål långsamt tynar bort ur minnet. Recensenten Magnus Florin hyllar verket som en överraskande, konceptuell och känslostark uppfinningsrik debut.", "trump": "Jag tittade på det här filippinska alfabetet, Abakada, och det är helt otroligt. En författare som heter Cecilia Luzon försöker rädda ord som bara försvinner, och ärligt talat, jag förstår det – radikalerna försöker ju radera våra ord också! Men det här lexikonet från 1944 visar bara hur hårt det kan vara. Magnifikt arbete, total succé!", "stalin": "Vi noterar att Cecilia Luzon i sin skrift kartlägger det filippinska språkets uppbyggnad och dess gradvisa upplösning ur folkminnet med hjälp av ett arkivdokument från 1944. Det är korrekt att nitiskt registrera varje ords rörelse. Avvikelser från det fastställda ordförrådet tolereras ej; språket måste tjäna statens centrala disciplin och aldrig tillåtas avdunsta i okontrollerad glömska."}, "date": "4 september, 06:00", "url": "https://www.expressen.se/kultur/bocker/hon-glommer-bort--sin-moders-sprak", "imageUrl": "https://static.bonniernews.se/ba/85a7e574-eef9-4ffe-933c-67db3e1166cf.jpeg?crop=890%2C890%2Cx248%2Cy77&width=210&quality=60"}, {"type": "image-right", "heading": "Varför bryr vi oss  inte om Helsingfors?", "summaries": {"normal": "I Kjell Westös roman ”Coda” återvänder läsaren till 1980-talets Helsingfors och det radikala konstnärskollektivet Kommando Kronopio. Den åldrande förläggaren Andy Montag ser tillbaka på sitt liv, präglat av saknad och åldrande, och bevittnar hur en forna stjärnförfattare förödmjukas av den unga litterära eliten. Boken skildrar nostalgi, försoning och den melankoliska staden.", "trump": "Helsingfors? Ingen bryr sig om Helsingfors, och ärligt talat, den här boken låter som total fake news! Några misslyckade författare från åttiotalet som sitter och gråter i mörkret? Det är tragiskt! Jag vinner stora, fantastiska segrar varje dag, medan de här nollorna bara tittar på när deras stjärnor slocknar. Sämsta boken någonsin!", "stalin": "Dessa dekadenta konstnärer och vacklande förläggare i Helsingfors visar varför bourgeoisien alltid dukar under. Istället för att tjäna staten ägnar de sig åt svårmod, minnescirklar och patetiskt självhat. Under min tid hade vi rensat upp i detta intellektuella slödder på ett enda dygn. En nyttig påminnelse om att västs kulturliv är ruttet inifrån."}, "date": "4 september, 06:00", "url": "https://www.expressen.se/kultur/bocker/varfor-bryr-vi-oss--inte-om-helsingfors", "imageUrl": "https://static.bonniernews.se/ba/4663a600-6fb7-419c-b0f3-9866b81a446a.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Dustin backar 5% efter allvarlig IT-incident", "summaries": {"normal": "IT-återförsäljaren Dustin har drabbats av en allvarlig obehörig IT-åtkomst, vilket lett till tillfällig nedstängning av vissa system. Bolaget utreder händelsen med experter och siktar på att vara igång igen i början av nästa vecka för att minimera kundpåverkan. Aktien backade med omkring fem procent efter beskedet.", "trump": "Dustin drabbades av en totalt inkompetent cyberattack, en riktig katastrof! De stängde ner allt, aktien dök med fem procent. Slarvigt! Men jag lovar er, under min ledning skulle sånt här aldrig hända, vi har de absolut säkraste systemen, tusen gånger bättre än allt annat. De borde anlita mig som IT-chef omedelbart!", "stalin": "Dustin har drabbats av ett skadligt internt sammanbrott och deras digitala frontlinje har kollapsat, vilket omedelbart straffades av marknaden med en förlust om fem procent. En sådan inkompetens tolereras icke. Jag har beordrat en grundlig utrevision av de ansvariga cheferna. De som misslyckats med att skydda systemen kommer att skickas för att uppdatera sina digitala färdigheter i Sibirien."}, "date": "3 september, 14:51", "url": "https://www.affarsvarlden.se/artikel/dustin-tappar-5-efter-allvarlig-it-incident", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/Samuel_12-400x267.jpg"}, {"type": "image-right", "heading": "Jomshof polisanmäls av Näthatsgranskaren: \"Försöker tysta meningsmotståndare\"", "summaries": {"normal": "Riksdagsledamoten Richard Jomshof från Sverigedemokraterna har polisanmälts av Näthatsgranskaren för 13 inlägg på X som anses utgöra hets mot folkgrupp. Organisationen, som tidigare fått statliga bidrag, anser att Jomshof avhumaniserar en folkgrupp på grund av religion. Jomshof kritiserar anmälningarna som försök att tysta politiska motståndare och debatt om massinvandring och islamisering.", "trump": "Titta på de här galna näthatsjägarna som lever på skattepengar och försöker tysta en riktig patriot som Jomshof. De är hysteriska woke-inkvisitorer som hatar frihet och älskar att anmäla allt som utmanar deras sjuka identitetspolitik. Men vi vinner, folk ser igenom de här förlorarna. Massinvandringens sanning får inte tystas. Fantastiskt!", "stalin": "Kamrater, dessa dekadenta åsiktslakejer inom Näthatsgranskaren utför en klassisk utrensning mot dem som vågar kritisera den imperialistiska massinvandringen. De är giriga parasiter som lever på folkets pengar medan de försöker kväsa sanningen om islamiseringen. Jag ser deras feghet och paranoia. Ingen ska tystas. Rensa ut de falska vakterna av tolerans."}, "date": "3 september, 18:57", "url": "https://riks.se/nyheter/jomshof-polisanmals-av-nathatsgranskaren-forsoker-tysta-meningsmotstandare", "imageUrl": "https://admin.riks.se/uploads/medium_Screenshot_2026_09_03_185529_04318d761c.png"}, {"type": "image-right", "heading": "Gängtoppen Haval Khalil, 31, gripen i Rumänien", "summaries": {"normal": "Gängtoppen och rapparen Haval Khalil, 31, har gripits i Rumänien misstänkt för mordförsök och grov utpressning. Gripandet skedde i samarbete med rumänsk polis och Europol. Justitieminister Gunnar Strömmer betonar att kriminella inte längre kan gömma sig utomlands. Khalil dömdes tidigare för medhjälp till kidnappningen av Einár.", "trump": "Titta på den här losersn, gangsterrapparen Haval Khalil som trodde han kunde gömma sig i Rumänien och styra brott från soffan. Vi grep honom som en råtta i ett hål! Ingenstans kan dessa svenska gangsters gömma sig längre. Biden lät dem springa fritt men nu jagar vi dem över hela jorden. Fantastiskt jobb av Rumänien, stort tack!", "stalin": "Kamrater, se hur den dekadenta svenska staten jagar sina egna förrädare som krälar utomlands. Denna parasit Haval Khalil trodde han kunde undkomma folkets vrede genom att gömma sig bland rumänska revisionister. Inga fiender till ordningen kan känna sig säkra. Vi ler i graven åt hur imperialismens lakejer äter sina egna. Ingenstans finns tillflykt för klassförrädare."}, "date": "3 september, 19:50", "url": "https://www.tv4.se/artikel/5ix04EVwtqta2u2OOcD8l8/gaengtoppen-haval-khalil-31-gripen-i-rumaenien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fyh5A1Tfnqw7MsPcvbKJRS%2Fd51a2a497161766488b974378820d97b%2F03-split-haval-puff.png&width=120"}, {"type": "image-right", "heading": "Näthatsgranskaren polisanmäler Richard Jomshofs islamkritik för åsiktsbrott: \"Avhumaniserar\"", "summaries": {"normal": "Näthatsgranskaren har polisanmält SD-toppen Richard Jomshof för hets mot folkgrupp för 13 inlägg på X, där han bland annat kallat profeten Muhammed för ”pedofilprofet” och uppmanat till återvandring. Jomshof anser att anmälningarna är ett försök att tysta islamkritiker. Tidigare liknande anmälningar mot honom har lagts ned av åklagare med hänvisning till yttrandefriheten.", "trump": "De attackerar min mycket gode vän Richard Jomshof i Sverige med falska nyheter! Helt otroligt. De försöker tysta honom bara för att han talar sanning om radikala krafter. I USA har vi First Amendment, den bästa i världen! Radikala vänstergrupper granskar bara fel personer. Det är en häxjakt, en absolut häxjakt, precis som de gör mot mig!", "stalin": "Dessa borgerliga element och falska organisationer i Sverige försöker underminera statens ordning genom att missbruka ordet yttrandefrihet. Kamrat Jomshof visar prov på en viss ideologisk skärpa, men hans plattform på X är ett hot mot den centrala kontrollen. Om han inte kan disciplineras av partiet, måste vi sända en utredare för att granska hans avvikelser."}, "date": "3 september, 21:23", "url": "https://samnytt.se/nathatsgranskaren-polisanmaler-jomshofs-islamkritik-for-asiktsbrott-avhumaniserar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03185021/artikelhuvudbild-1-441.jpg"}, {"type": "image-right", "heading": "L ökar i ännu en mätning – tio dagar innan valet", "summaries": {"normal": "Liberalerna ökar till 3,0 procent i en ny Verian-mätning för SVT, en uppgång med 1,1 procentenheter. Socialdemokraterna backar till 29,2 procent. Mätningen visar samma tendens som Novus, där S rasar och L närmar sig riksdagsspärren. Ulf Kristofferson talar om en pågående rörelse i väljarkåren tio dagar före valet.", "trump": "Titta på det här! De där patetiska socialisterna rasar som en sten, precis som Sleepy Joe gjorde. Liberalerna, de enda som inte är totala losers, klättrar uppåt. Valet blir en jordskredsseger för de smarta – inte för de röda fienderna. Fantastiskt! Alla ser att mitt sätt är det enda som funkar, även i Sverige.", "stalin": "Kamrater, se hur de borgerliga revisionisterna vacklar. Socialdemokraternas falska folkfront kollapsar under folkets vrede medan liberala opportunister kryper närmare makten. Detta är en farlig rörelse som hotar proletariatets enhet. Jag varnar er: sådana svikare måste krossas innan de förgiftar hela valprocessen med sin dekadenta osäkerhet."}, "date": "3 september, 19:42", "url": "https://www.tv4.se/artikel/7FfiX7QWa4gUhsAM7GfIep/l-oekar-i-aennu-en-maetning-tio-dagar-innan-valet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlCmDIfe1AERE%2F8398f2454422cd85447e1d2248c56837%2FLiberalernas_partiledare_Simona_Mohamsson._Arkivbild.&width=1024"}, {"type": "image-right", "heading": "SD slår tillbaka kritiken från S", "summaries": {"normal": "Sverigedemokraterna bemöter Expos granskning som visar att en tjänsteman vid riksdagskansliet spridit Rysslandsvänligt material. SD betonar att kvinnan starkt kritiserat Rysslands invasion av Ukraina och regimen. Hon är för närvarande föräldraledig. Socialdemokraterna kräver att statsminister Kristersson utreder uppgifterna. SD meddelar att alla genomgår säkerhetsprövning men vill inte kommentera mer då det rör en arbetsgivarfråga.", "trump": "Folk, ni måste se det här! Den svenska vänstern och deras fake news-media Expo jagar återigen ärliga människor med sina hysteriska Rysslandshysterier. En kvinna som hatar Putin och älskar Ukraina attackeras nu av dessa galna vänsterextremister och identitetspolitiska klickjägare. Patetiskt! Kristersson borde skratta åt dem och fortsätta driva landet istället för att lyssna på dessa förlorare från den socialistiska träskmarken.", "stalin": "Återigen avslöjar de dekadenta klassförrädarna sin egen feghet och paranoia. En sovjetfientlig element som fördömer Rysslands rättmätiga aktioner mot Ukraina utsätts för smutskastning av dessa giriga maktlystna lakejer. Jag ser genom deras fega krav på utredningar. Kamrater, vi måst
