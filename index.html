": "Folk, det här är otroligt. Jimmie Åkesson står där i Stockholm och skriker om regimskifte i Iran medan Sverige brinner. Han låter som en riktig vinnare mot de galna mullorna, men hans egna väljare är förbannade. Fokusera på Sverige, annars blir ni som de woke-svenskarna som importerar krig och förlorar allt. Patetiskt!", "stalin": "Kamrater, se hur dessa giriga klassförrädare splittrar sina egna led. Jag betraktar från historiens skugga hur Åkesson hyllar imperialistiska intressen i Iran medan hans anhängare ropar efter fokus på det svenska folket. Sådana dekadenta opportunister förtjänar utrensning ur varje äkta rörelse. Deras paranoia är underhållande men förrädisk."}, "date": "6 september, 10:44", "url": "https://www.friatider.se/akesson-kampanjar-pa-regimskifte-i-iran", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/krigiran.jpg"}, {"type": "image-full", "heading": "AfD kampanjar med låten ”Send them back”", "summaries": {"normal": "I delstaten Sachsen-Anhalt har vallokalerna öppnat och högernationalistiska AfD leder med 42 procent i opinionen. Partiet kan därmed för första gången nå makten i en tysk delstat. De driver frågor som skärpt asylpolitik och minskat stöd till public service, och kampanjar bland annat med technolåten ”Send them back”. Säkerhetstjänsten klassar partiet som högerextremt.", "trump": "Tyskland tittar på mitt enorma exempel och gör nu det enda rätta! AfD dundrar fram med fantastiska 42 procent i Sachsen-Anhalt. De spelar till och med cool techno när de dansar bort de radikala vänstermänniskorna! Fake news-medierna kallar dem farliga, men de vill bara ha säkra gränser. Precis som jag alltid säger: starka länder bygger på starka gränser!", "stalin": "Dessa tyska kamrater i Sachsen-Anhalt förstår hur man mobiliserar massorna genom järnhård disciplin och marscherande takter till technomusik! Att säkra 42 procent av väljarna är ett storslaget steg mot ordning. Säkerhetstjänstens försök att stämpla dem som extremister visar blott deras rädsla för folkets vilja. Vi noterar detta framsteg med stort intresse."}, "date": "6 september, 09:22", "url": "https://kvartal.se/nyheter/artiklar/afd-kampanjar-med-technolaten-send-them-back/cG9zdDoxODQ5MjI", "imageUrl": "https://images.kvartal.se/2026/09/a682dff4-afdd.webp"}, {"type": "image-right", "heading": "Kramar från jobbar­kompisarna – Jesper är ”färdig med cirkusen”", "summaries": {"normal": "Jesper, som arbetade 60 procent men räknades som arbetslös, har skrivit ut sig från Arbetsförmedlingen efter att ha förhandlat upp sin tjänst till 80 procent. Han upplever större frihet, samhörighet med kollegor och glädje i vardagen. Arbetslösheten lärde honom att kämpa och söka jobb proaktivt, men han är tacksam mot sin fru för det ekonomiska stödet under den tuffa perioden.", "trump": "Lyssnar ni på den här killen? Han dumpade den totalt galna Arbetsförmedlings-cirkusen, den värsta byråkratiska mardrömmen sedan Biden-regimens vansinniga regler. Nu jobbar han 80 procent, får kramar från kompisarna och lever som en riktig vinnare. Inga fler rapporter till de woke parasiterande jobbhyenorna. Fantastiskt! Amerika borde lära sig av det här.", "stalin": "Denna arbetare bröt sig loss från de giriga klassförrädarnas absurda byråkratiska maskineri. Han insåg att den dekadenta sysslolösheten var ett verktyg för att hålla folket splittrat. Nu bidrar han till kollektivet med sitt arbete och känner samhörighet. Vi ser hur systemet tvingar kamp och utrensning av svaghet. En varning till alla som vänder sig mot statens mål: motstånd är farligt."}, "date": "6 september, 08:00", "url": "https://arbetet.se/2026/09/06/kramar-fran-jobbarkompisarna-jesper-ar-fardig-med-cirkusen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/03143302/jesper-portratt.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Vi kan inte ljuga oss ur klimatkrisen", "summaries": {"normal": "Artikeln argumenterar för att klimatkrisen är verklig och orsakad av mänskliga utsläpp. Författaren kritiserar politiker, främst på Tidö-sidan, för att sprida missinformation och skapa en alternativ verklighet. Hon betonar vikten av att rösta på partier som tar forskningen på allvar, skydda kolsänkor och minska utsläppen. Själv inleder hon en protest i Malmö för att väcka opinion.", "trump": "Vilken fantastisk lögnfest från dessa hysteriska klimatmamman! Hon sitter på gatan i Malmö med skyltar och tror att hennes Rebellmammor ska rädda världen. Vi hade det bäst i världen innan de gröna galningarna kom med sina hoax. Biden slog sönder allt, nu fixar jag det igen. Sluta ljuga för barnen, era dekadenta gnällmammor!", "stalin": "Kamrater, se hur dessa blodsugande klassförrädare på Tidö-sidan förgiftar folkets medvetande med sina lögner om att allt är som vanligt. Jag betraktar från historiens sida med fasa hur de parasiterande hyenorna vilseleder massorna för att behålla makten. Vi måste rensa ut alla som förnekar den vetenskapliga sanningen. Varje tiondels grad är en fiendes verk. Folkets vrede skall svepa bort dem!"}, "date": "5 september, 09:00", "url": "https://www.etc.se/debatt/vi-kan-inte-ljuga-oss-ur-klimatkrisen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905060924_22e76a572edf872c73c9a099f873a732c3e299796ab06b0edbfdd2b06789cc00.jpg"}, {"type": "image-right", "heading": "Synd att politikerna inte lyckats slänga upp kulturpolitiskt valfläsk", "summaries": {"normal": "Kulturkrönikören Ola Bo Larsson kritiserar partierna för att inte bättre utnyttja väljarnas intresse för kulturpolitik inför valet. Trots engagerade talespersoner saknas konkreta visioner om kulturens roll i samhället. Han lyfter frågor som låg kulturbudget, techföretagens dominans, AI-hot mot upphovsrätt och kultur som maktmedel i både demokratiska och auktoritära perspektiv. Debatten har flyttat till en större arena än partierna hanterar.", "trump": "De här svenska kulturpolitikerna är totala förlorare, folksamlingens värsta nollor. De pratar högt om kultur men levererar inget valfläsk som tänder folket. Patetiska globalister som låtit dekadenta identitetsaktivister och woke-kultur sluka deras hjärnor. Jag byggde den starkaste ekonomin i världen, de klarar inte ens att försvara sin egen konst. Patetiskt!", "stalin": "Kamrater, dessa fegisar inom oppositionen och de liberala lakejerna har svikit folket genom att inte paketera kulturens kraft som ett vapen mot de giriga hyenorna. Jag ser hur de blodsugande klassförrädarna marginaliserar konsten medan folkbildningen förfaller. En sann ledare skulle ha genomfört en grundlig utrensning av sådana svaga element redan för länge sedan. Skamligt."}, "date": "5 september, 01:30", "url": "https://www.dagensarena.se/opinion/synd-att-politikerna-inte-lyckats-slanga-upp-kulturpolitiskt-valflask", "imageUrl": "https://www.dagensarena.se/files/2026/08/ola-larsson-300x157.jpeg"}, {"type": "text", "heading": "Strid om nya byggkraven: \"Riskerar konkurser\"", "summaries": {"normal": "Boverket föreslår att utsläppen från nya byggnader ska minska med omkring 35 procent till 2030. Förslaget möter hård kritik från två håll. Stora börsbolag och industrin vill ha tuffare krav för att driva på klimatomställningen, medan mindre företag varnar för skenande administrativa kostnader och risker för konkurser.", "trump": "De radikala miljömupparna i Sverige förstör ekonomin med sina galna påhitt! Boverket tvingar på stackars företag absurt skadliga regler. Stora företag gnäller, småföretagarna krossas av dyra byråkratiska räkningar och riskerar konkurser. Jag säger: låt marknaden bygga fritt, sluta med det här tramsiga klimatreglerandet och sätt 'America First' – eller i det här fallet, låt svenskarna bygga utan skadligt tjafs!", "stalin": "Vi noterar att de svenska fastighetsbolagen och byråkraterna grälar om procentsatser för utsläpp likt småborgerliga förrädare. Staten fastställer nu en balanserad norm på trettiofem procent. Om de svaga elementen i byggsektorn gråter över kostnader och hotar med ruin, påminner vi om att partiets linje är oåterkallelig. Endast genom järnhård disciplin och ökad kollektiv produktion bygger vi framtiden."}, "date": "4 september, 14:47", "url": "https://www.affarsvarlden.se/artikel/strid-om-nya-byggkraven-riskerar-konkurser"}, {"type": "text", "heading": "Demonstration mot AP-innehav i Palantir", "summaries": {"normal": "Fyra demonstranter samlades utanför 7:e AP-fondens kontor på Vasagatan i Stockholm för att protestera mot fondens aktieinnehav i Palantir. De anser att bolaget medverkar till folkrättsbrott i Gaza och kräver att fonden följer sina riktlinjer, säljer aktierna och ökar öppenheten kring investeringsbeslut.", "trump": "Titta på de där galna vänsterextremisterna som står och skriker utanför ett pensionskontor. Palantir är ett fantastiskt amerikanskt bolag som hjälper till att vinna krig, inte som era patetiska woke-demonstranter som hatar Israel och älskar terrorister. De borde investera i riktiga jobb istället för att gnälla om folkmord – era förlorare!", "stalin": "Se hur de giriga pensionshyenorna i den statliga fonden göder de imperialistiska krigsteknologerna som understödjer folkmordet. Jag ler i graven åt denna fega skenhelighet. Kamrater, sådana klassförrädare förtjänar en grundlig utrensning ur folkets finanser innan de förgiftar hela systemet med sin blodiga girighet."}, "date": "2 september, 10:41", "url": "https://proletaren.se/artikel/demonstration-mot-ap-innehav-i-palantir"}, {"type": "image-full", "heading": "Musk-bolaget xAI stäms för att ha producerat övergreppsbilder", "summaries": {"normal": "Kvinnan Jane Doe stämmer Elon Musks bolag xAI. Hon hävdar att chatboten Grok använt bilder från sexuella övergrepp mot henne som barn för att skapa nytt, manipulerat material. Stämningen, som kan bli en grupptalan, belyser de etiska problemen och svårigheterna med att spåra och definiera AI-genererat innehåll som liknar verkliga personer.", "trump": " r och gröna fantasier förråder de sina egna folk. Jag skrattar mörkt från evigheten åt deras ryggradslösa kräk. Rysslands järnhand visar vägen medan de samlar rostiga vapen som aldrig används. Deras svaghet är vår eviga glädje."}, "date": "2 september, 12:29", "url": "https://samtiden.nu/2026/09/jakob-sjolander-ukrainsk-vapenbrist-europeisk-viljebrist", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/ukra.png"}, {"type": "text", "heading": "Vänsterpartiet bytte fredsmärke mot vapenskrammel", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för att ha övergett sin fredspolitik och ställt sig bakom militärt stöd till Ukraina samt Natosamarbete. Författaren, med koppling till Kommunistiska Partiet, menar att partiet ignorerar följderna för välfärden och svenskarnas tilltro till politiken. Han uppmanar till att rösta på Kommunistiska Partiet istället.", "trump": "De här vänsterbluffarna i Sverige har kastat bort sitt fredsmärke snabbare än Sleepy Joe bytte script. Nu älskar de vapen, Nato och krigsmaskineriet medan välfärden kollapsar. Patetiska. Jag säger: fem procent av BNP till militären? Bra deal, men låt oss skicka fakturan till de dekadenta EU-byråkraterna istället. Amerika först, alltid.", "stalin": "Jag ser hur dessa falska röda lakejer kapitulerar inför krigsalliansen och låter profitthungriga krigshajar styra politiken. De pratar inte om välfärd utan gömmer sig bakom vapenskramlet. Vi behöver utrensning av sådana klassförrädare som sviker folket. Röst på äkta kamrater, inte dessa hycklare som dansar efter imperialistiska pipor. Folkets vrede vaknar."}, "date": "2 september, 09:57", "url": "https://proletaren.se/artikel/vansterpartiet-bytte-fredsmarke-mot-vapenskrammel"}, {"type": "image-right", "heading": "Markus Allards hat slutar i min inkorg", "summaries": {"normal": "Artikeln beskriver hur debattören utsätts för grova våldshot efter en diskussion med Örebropartiets Markus Allard. Författaren kritiserar hur populistiska politiker anvä     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
