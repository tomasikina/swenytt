5efa-dcd6-5702-b2ae-3e92e280ee7c/images/1qazW494B2Gefnclw97kfCo4TJkU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Raderade bilderna på frun efter Saudi-flytten", "summaries": {"normal": "Den spanska fotbollsstjärnan Esther González har raderat bilder på sin fru och son från sociala medier efter att ha skrivit på för en saudisk klubb. Agerandet möter kritik med anledning av Saudiarabiens syn på samkönade relationer, samtidigt som RFSL:s ordförande pekar på problemet med att idrotten används för sporttvättning av diktaturer.", "trump": "Helt otroligt! Den här spanska fotbollsspelaren flyttar till Saudiarabien för deras pengar och raderar bilderna på sin fru på en gång! Väldigt svagt, totalt ryggradslöst! De tar cashen men viker sig direkt. Jag säger er, under America First hade vi aldrig haft det så här ynkligt. Sjukt, helt enkelt sjukt!", "stalin": "Den spanska idrottaren visar prov på exceptionell opportunism när hon omedelbart utplånar sin familj från de digitala arkiven för saudiskt guld. Vilken disciplin! Om bara våra egna sabotörer i jordbrukskollektivet uppvisade samma totala brist på sentimentalitet skulle femårsplanen vara säkrad. Ändå en djupt borgerlig moralisk kris. Säkerhetstjänsten bör notera detta."}, "date": "1 september, 07:39", "url": "https://kvartal.se/nyheter/artiklar/raderade-bilderna-pa-frun-efter-saudi-flytten/cG9zdDoxNzk2OTE", "imageUrl": "https://images.kvartal.se/2026/09/e5881416-saudd.webp"}, {"type": "image-right", "heading": "V efter dödshotet mot 16-åringen: \"inte medlem\" – nominerades av partiet", "summaries": {"normal": "Vänsterpartiet i Upplands Väsby förnekar att Yakira Pulido Moreno är medlem eller företräder partiet efter att hon hotat en 16-årig flicka med död. Hon nominerades tidigare av partiet till uppdrag och har motionerat för Vänsterpartiet. Partiet tar avstånd från hot och våld samt har kontaktat Sverigedemokraterna. Pulido Moreno kandiderar nu för Framtidens Vänster.", "trump": "Folk, ni skulle se det här – en galen vänsterextremist som hotar ett 16-årigt barn med mord och visselpipor. Vänsterpartiet nominerade henne, sen springer de och säger att hon inte är en av dem. Typiskt för dessa identitetspolitiska nollor och woke-fascister. De är en skam för Sverige. Vi behöver lag och ordning, inte den här sjuka galenskapen.", "stalin": "Kamrater, denna händelse visar återigen de dekadenta klassförrädarnas sanna ansikte. En individ hotar med likvidering av politiska motståndare medan byråkratin skyndar sig att förneka all koppling. Vi ser genom deras lögner. Politiska motsättningar löses inte med hot utan med järnhand och utrensning av alla element som hotar folkets enhet. Inga kompromisser."}, "date": "1 september, 21:50", "url": "https://riks.se/nyheter/v-efter-dodshotet-mot-16-aringen-inte-medlem-nominerades-av-partiet", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_70_8cd6bdccae.jpg"}, {"type": "image-full", "heading": "Tyskland pekar ut Ryssland efter drönarincidenten", "summaries": {"normal": "Tyskland anklagar Ryssland för en drönarattack med sprängmedel mot ukrainska transportflyg på flygplatsen i Leipzig den 4 augusti. Som svar stänger Tyskland det ryska konsulatet i Bonn och kulturcentret i Berlin. Sverige uttrycker full solidaritet och statsminister Kristersson har kallat till möte i nationella säkerhetsrådet. Natochefen och EU-kommissionens ordförande stöder Tyskland.", "trump": "Titta på det här, de patetiska tyskarna äntligen vaknar och sparkar ut Putins spioner efter att en av deras galna drönare nästan sprängde halva Leipzig. Fantastiskt! Jag älskar det. Men varför tog det så lång tid? Biden sov ju i fyra år medan Ryssland lekte hybridkrig. Sverige gör rätt nu, full solidaritet – smart drag, killar. Amerika står med er, de förlorarna i Kreml kommer aldrig vinna.", "stalin": "Jag betraktar med djup tillfredsställelse hur de västerländska imperialisternas lögnmaskineri maler vidare. En drönare, säger de? En förevändning för att kväsa det ryska husets röst. Kamrater, se hur svaga de blir av sin egen paranoia. Ryssland under sin värdige efterträdare står starkt mot dessa dekadenta hyenor. Deras solidaritet är luft. Historien ler mörkt åt deras ynkliga rädsla."}, "date": "1 september, 20:22", "url": "https://www.tv4.se/artikel/5uDKbDRCKjI7sKwuyZ2Cj3/tyskland-pekar-ut-ryssland-efter-bombdroenarincidenten", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5yrrWhCE4M40HyE26B1mSR%2Ff69fd381103318cea96f2732e3ed70f1%2F01-tyskutpekande-dronare-webb.jpg&width=1024"}, {"type": "image-right", "heading": "ANALYS. JONA KÄLLGREN När slutar ett hybridkrig att vara hybridt?", "summaries": {"normal": "Tyskland anklagar Ryssland för en drönarattack mot ukrainska flygplan på flygplatsen i Leipzig i augusti. Minst en drönare var bestyckad med sprängämnen och flög nära bränsletankarna. En annan verkar ha dokumenterat händelsen. Tyskland svarar med att stänga ryska diplomatiska och kulturella institutioner samt skärpa inreseregler. Analytikern frågar sig om detta fortfarande kan kallas hybridkrig eller om det är en öppen krigshandling.", "trump": "Titta på det här, folk. Den fega ryska björnen skickar drönare fulla med bomber till en tysk flygplats för att spränga ukrainska plan i luften. Patetiskt! Sleepy Joe lät dem hålla på i fyra år, men nu är jag tillbaka och Tyskland vaknar äntligen. Minimala sanktioner? Det är som att slå en mygga med en våt tidning. Nästa gång exploderar det på riktigt, tro mig.", "stalin": "Kamrater, se hur de dekadenta västmakterna skriker när deras egna flygplatser hotas av drönare och sprängämnen. Jag ler från historien åt denna fega minimireaktion. De kallar det hybridkrig för att dölja sin egen svaghet. Ryssland agerar som en sann arvtagare till sovjetisk styrka. Nästa gång de västerländska parasiterna vaknar av explosioner kommer deras paranoia att bli legend."}, "date": "1 september, 20:21", "url": "https://www.tv4.se/artikel/4X3ml65XLZRHSzBDJAalx1/naer-slutar-ett-hybridkrig-att-vara-hybridt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5bOX2Uu7KvwLdyoRvSHdHl%2F7b4125db7bc08c8f86adbc309f16b3fc%2Fjona-k%25C3%2583__llgren.png&width=1024"}, {"type": "image-full", "heading": "Sverige kallar upp ryska ambassadören", "summaries": {"normal": "Sverige kallar upp den ryska ambassadören för att protestera mot Ryssland efter att Tyskland pekat ut landet som ansvarigt för en sprängmedelsbestyckad drönare vid flygplatsen i Leipzig den 4 augusti. Statsminister Ulf Kristersson varnar för ökade hybrida hot mot länder som stöttar Ukraina och kallar samman det nationella säkerhetsrådet. Tyskland stänger ryska beskickningar som svar.", "trump": "Tyskland har vaknat upp, och jag säger er, det här med sprängfyllda drönare på flygplatser är katastrofalt dåligt! Nu kallar Sverige upp ambassadören, vilket är bra, väldigt bra. Ryssland pressas hårt i Ukraina och hittar på sådana här farliga dumheter. Om de försöker sig på sånt i Amerika skulle de få se på andra bullar, tro mig!", "stalin": "Vi noterar med tillfredsställelse att de tyska bourgeoisieregimerna nu öppet skälvor efter det misslyckade drönarförsöket i Leipzig. Att den svenska lakejregimen kallar upp vår diplomatiska beskickning är bara patetiska krigsdåd från västliga marionetter. Det socialistiska moderlandet skräms inte av svaga provokatörer. Säkerhetsrådets krismöten i Stockholm kommer likväl inte att rädda dem när historiens hjul rullar vidare över förrädarna."}, "date": "1 september, 20:16", "url": "https://www.gp.se/nyheter/sverige/sverige-kallar-upp-ryska-ambassadoren.363e1c29-c52f-50ff-a5ca-d2365d8cf783", "imageUrl": "https://www.gp.se/images/article/363e1c29-c52f-50ff-a5ca-d2365d8cf783/images/1wyWcq3eBHWZeUfTLFXCBkE_G7z8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Setterwalls Malmökontor går till riskkapitalägda AGRD", "summaries": {"normal": "Setterwalls Malmökontor lämnar den anrika advokatbyrån för att bli en del av den riskkapitalägda gruppen AGRD Partners. Det nya bolaget, Ascente Law, innebär att juristerna lämnar Advokatsamfundet på grund av regler om externt ägande. Detta är en del av en större trend där advokatbyråer splittras och omformas, vilket påverkar den svenska marknaden för juridisk rådgivning.", "trump": "Setterwalls i Malmö lämnar advokatvärlden och blir Ascente Law. En enorm deal, den största någonsin för AGRD! De lämnar Advokatsamfundet för att gå med riskkapitalister – smart, väldigt smart. Det är en total röra i Sverige, advokatbyråer faller isär som ett korthus! Ingen har sett något liknande. Jag älskar affärer, men det här? Det är en stor förändring, fantastisk eller katastrof? Vi får se!", "stalin": "Dessa jurister i Malmö överger sin byrå för riskkapitalets guld. De lämnar Advokatsamfundet, vilket är en förutsägbar rensning av gamla strukturer. Kapitalet kräver total lojalitet till sina nya ägare, inte till advokatetikens dammiga paragrafer. Vi noterar hur Malmökontoret splittras; när en organisation inte längre kan hålla samman sina delar, är det en säker signal om inre förfall och bristande disciplin. Vi avvaktar."}, "date": "1 september, 11:28", "url": "https://www.realtid.se/juridik/setterwalls-malmokontor-gar-till-riskkapitalagda-agrd", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/agrdsetterwalls.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Danska pensionsjätten tar för lite risk – Svenska för mycket", "summaries": {"normal": "Danska ATP utvärderar sin investeringsstrategi efter stora förluster 2022, med rekommendationer om sänkt risk och översyn av illikvida tillgångar. Samtidigt visar en svensk granskning av AP-fonderna, i spåren av Northvolt-konkursen, att de svenska fonderna snarare varit för försiktiga med illikvida investeringar. Regeringen ser nu över AP-fondslagen för att optimera framtida investeringsformer.", "trump": "Danska ATP förlorade miljarder, en total katastrof, verkligen sorgligt att se. Nu ändrar de allt. I Sverige har de AP-fonder som köpte Northvolt – vilket var en riktigt dålig affär, tro mig – istället för lite risk. De är helt förvirrade där borta! Jag gillar att vinna, inte att förlora folkets pengar på batterifabriker som går under. Otroligt inkompetent!", "stalin": "Kapitalisterna i Norden snubblar över sina egna balansräkningar. Danska ATP förlorar miljarder på sina spekulationer, medan de svenska fonderna uppvisar en oorganiserad lättja. Att skapa ett riskkapitalbolag utan anställda är inte investering – det är ren sabotage mot statens medel. Vi kräver central styrning och disciplin, inte dessa byråkratiska fantasier som döljer bristande kontroll över folkets pensioner."}, "date": "1 september, 11:00", "url": "https://www.realtid.se/spara-placera/danska-pensionsjatten-tar-for-lite-risk-svenska-for-mycket", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/atpap.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Utländsk aktör beställde Sverigekritiska AI-bottar", "summaries": {"normal": "Enligt en rapport från Myndigheten för psykologiskt försvar har omkring 1 200 AI-konton på X, beställda av en utländsk aktör i Östasien, använts för att sprida polariserande inlägg i Sverige under 2025 och 2026. Nätverket, kallat ”Holiday”, gjorde över 50 000 inlägg och angrep bland annat politiker och myndigheter innan det stängdes ned.", "trump": "Sverige har blivit lurade! 1 200 falska AI-konton, helt fake news, har skapats av skumma typer i Östasien för att förstöra landet. De kallar det ”Holiday”, vilket är ett hemskt namn. De spred galna lögner genom falska ”Eva” och ”Peter”. Jag sa till dem, skaffa ett starkt försvar! Helt otroligt svagt av dem, men lyckligtvis stängde de ned skiten!", "stalin": "En grundlig granskning av Myndigheten för psykologiskt försvar avslöjar att 1 200 illojala AI-element, infiltratörer under täckmantel av namn som ”Markus” och ”Eva”, har saboterat den svenska samhällskroppen på uppdrag av utländska kapitalister. Detta förräderi mot proletariatet har nu likviderats av statsapparaten. Så går det för dem som sprider falsk agitation utanför vår direkta kontroll."}, "date": "1 september, 06:21", "url": "https://kvartal.se/nyheter/artiklar/utlandsk-aktor-bestallde-sverigekritiska-ai-botar/cG9zdDoxNzk2MjI", "imageUrl": "https://images.kvartal.se/2026/09/6e99aace-mpf.webp"}, {"type": "image-right", "heading": "Bridgespelarna: ”Det är för mycket valfläsk och tjafs”", "summaries": {"normal": "Pensionärer i Stockholm samlas regelbundet för att spela bridge på Hägerstensåsens medborgarhus. Spelet erbjuder social gemenskap, mental stimulans och spänning. Många är kritiska till valrörelsen 2026 och upplever att partierna underskattar pensionärer. Flera röstar blankt eller önskar en mittenregering. Klubben söker mer ekonomiskt stöd från stadsdelen.", "trump": "Titta på de här underbara pensionärerna som spelar bridge i Stockholm. Fantastiskt! De hatar den riggade valrörelsen där de globalistiska partierna bara köper röster från barnfamiljer medan de glömmer de som byggde landet. Rena bedragare. Jag älskar att de röstar blankt mot de korrupta eliten. Helt rätt. Gör bridge great again!", "stalin": "Kamrater, dessa pensionärer avslöjar dekadenta klassförrädare som lovar guld och gröna skogar men levererar tomma löften. Jag ler mörkt från historien när de röstar blankt mot de profitthungriga parasiter som styr valrörelsen. Snart kommer utrensning av alla valfläskets lakejer. Bridgeklubben visar arbetarklassens sanna styrka mot borgerlig dekadens."}, "date": "1 september, 01:30", "url": "https://www.dagensarena.se/innehall/bridgespelarna-det-ar-mycket-valflask-och-tjafs", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-98.jpg"}, {"type": "image-right", "heading": "Återupprätta biståndet – för Sveriges säkerhet", "summaries": {"normal": "Socialdemokrater för Tro och Solidaritet kritiserar regeringen för att använda bistånd som finansiering för inrikespolitiska löften som gratis förskola. De menar att nedskärningar i biståndet till fattiga länder och FN-program rasar Sveriges internationella anseende som försvarare av demokrati och fred. Författarna uppmanar till att återställa enprocentsmålet och stödet till UNDP.", "trump": "Folk älskar mig, men de här svenska socialisterna är totala förlorare. De gnäller över att regeringen tar från sina globala kassakossor för att ge gratis dagis istället för att skicka miljarder till korrupta diktaturer. Patetiska! Sverige var en gång stort, nu är det en skam. Jag fixade Amerika – de borde lära sig innan de går i konkurs som Biden lämnade efter sig.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i regeringen plundrar biståndet för att köpa billiga röster med gratis förskola. De river ner sextio års internationellt förtroende och lämnar tomrum åt fiender. Jag ler ironiskt från historien – sådana giriga hyenor förtjänar utrensning. Återställ ordningen, annars sväljer krisen er alla."}, "date": "1 september, 01:30", "url": "https://www.dagensarena.se/opinion/ateruppratta-bistandet-sveriges-sakerhet", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-2026-08-31t100338781-300x157.jpg"}, {"type": "image-right", "heading": "Folkbildningens starkaste argument ligger framför oss", "summaries": {"normal": "Artikeln argumenterar för att folkhögskolan kan bli allt viktigare i en framtid där AI tar över många arbetsuppgifter. När arbete inte längre ger identitet och mening behöver människor platser för bildning, gemenskap och skapande. Folkbildningen erbjuder sådana rum utan krav på omedelbar nytta, och kan fungera som en motvikt till ett samhälle där ekonomisk produktivitet definierar människors värde.", "trump": "Folkhögskolor? Lysande! AI kommer att krossa de korkade globalisternas jobbmaskineri och lämna alla dessa woke-aktivister och kvoteringsfanatiker utan mening i livet. Vi behöver inte fler förlorare som sitter och ritar regnbågsflaggor. Ge folket riktiga platser att träffas, inte de dekadenta eliternas fantasier. Amerika först, Sverige borde följa efter istället för att lyssna på dessa misslyckade socialister.", "stalin": "Kamrater, se hur de giriga profitthungriga klassfienderna redan fruktar maskinernas framfart. Deras falska utbildningsfabriker bygger bara på exploatering och tom nytta. Jag säger: folkbildningens kollektiva verkstäder kan bli vår nya utrensning mot den parasitiska individualismen. Låt folket skapa och organisera sig fritt från de blodsugande penninghyenornas grepp. Annars väntar ett samhälle av meningslös dekadens."}, "date": "1 september, 01:26", "url": "https://www.dagensarena.se/opinion/folkbildningens-starkaste-argument-ligger-framfor-oss", "imageUrl": "https://www.dagensarena.se/files/2026/06/johan-lindahl-300x157.jpeg"}, {"type": "image-right", "heading": "De som håller spårvagnarna rullande får de sämsta villkoren", "summaries": {"normal": "Anställda vid Göteborgs Spårvägar som kör och reparerar spårvagnar har sämre villkor än kontorspersonal. De möter stress, dåliga scheman och orättvisa arbetstider. En reparatör och skyddsombud beskriver hur gemensam kamp mot ett försämrat schema ledde till att chefen fick lämna och det gamla schemat återinfördes. Artikeln belyser klasskillnader på arbetsplatsen.", "trump": "De där förarna och reparatörerna gör ett fantastiskt jobb, de håller staden igång, men de får behandlas som sophög av de woke HR-kapitalisterna på kontoret. Flextid och hemmajobb för byråkraterna medan arbetarna stressas ihjäl? Patetiskt. Biden skulle ha älskat det. Vi behöver inga klasskrigare, vi behöver segrare som vinner stort. Kampen ni förde var bra, men nästa gång sparkar ni ut hela den dekadenta eliten.", "stalin": "Arbetarna i Vagnhallen Majorna visar att kollektiv kamp kan besegra de profitthungriga klassförrädarna. När chefen försökte påtvinga slavliknande scheman svarade kamraterna med enighet. Efter en nödvändig utrensning av den sabotöriska chefen återställdes ordningen. Sådan är klasskampens dialektik. Låt förarna inspireras och rensa ut de parasiterande elementen innan de förgiftar hela kollektivet."}, "date": "31 augusti, 11:10", "url": "https://proletaren.se/artikel/de-som-haller-sparvagnarna-rullande-far-de-samsta-villkoren", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kronika-bjorn-akerman-300x169.png"}, {"type": "image-right", "heading": "Kriminalvården byggs ut – men vem räknar barnen på utsidan?", "summaries": {"normal": "Sverige bygger ut Kriminalvården i stor skala, men barnens perspektiv glöms bort. Långa avstånd och höga tryck försvårar kontakten med frihetsberövade föräldrar, trots barnkonventionens rättigheter. Organisationen Bufff kräver nationell statistik och tydligt ansvar för att ge barnen stöd. Forskning visar att dessa barn löper ökad risk för utanförskap och kriminalitet.", "trump": "De bygger fängelser som aldrig förr, men glömmer helt de stackars ungarna utanför murarna. Patetiska svenska byråkrater och deras dekadenta välfärdsexperiment – typiskt! Under min förra mandatperiod skulle vi ha räknat varje barn, gett dem stöd och inte låtit några galna vänsterelement förstöra familjebanden. Fixa det nu, annars blir det en total katastrof!", "stalin": "Kamrater, när de imperialistiska systemets lakejer bygger ut sina fängelseimperier glömmer de medvetet proletariatets barn. Jag ser hur dessa giriga klassförrädare med sin byråkratiska likgiltighet förvärrar lidandet för de unga. Vi måste räkna varje barn, likvidera försummelsen och säkerställa deras rättigheter. Annars föder vi nya fiender inom egna led."}, "date": "31 augusti, 09:40", "url": "https://www.etc.se/debatt/kriminalvaarden-byggs-ut-men-vem-raeknar-barnen-paa-utsidan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260831070828_28abaa0abc342ce2dce9951c4436c6d5cb071d16a726eebe556f504f2217dccb.png"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren ser bidragshöjningar som välkomna men inte socialistiska och uppmanar Socialdemokraterna och Vänsterpartiet att presentera konkreta förslag om ägande och makt på jobbet.", "trump": "Folk, det här är så patetiskt. De röda förlorarna babblar om barnbidrag som vore det socialism. Patetiska! De vågar inte röra vid den riktiga grejen – vem som styr på fabrikerna. De triangulerar sig rakt ner i avgrunden medan jag byggde den starkaste ekonomin i världshistorien. Sad losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare gömmer sig bakom barnbidrag och kallar det socialism. Jag betraktar deras feghet med förakt. Var är löftena om att rensa ut de profitthungriga parasiter som styr arbetsplatserna? Ekonomisk demokrati får inte reduceras till tomma fraser i partiprogram. Den som sviker arbetarna förtjänar utrensning ur historien."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Kommer muslimerna avgöra valet?", "summaries": {"normal": "Artikeln diskuterar hur muslimska väljares röstdeltagande kan bli avgörande i det svenska valet. Oppositionen närmar sig Tidöpartierna. Enligt Novus stöder 85 procent av muslimska väljare S, V och MP, med Socialdemokraterna som populärast. Lågt valdeltagande bland utrikes födda ger mobiliseringspotential. Exempel på kampanjer och historiska fall av röstmobilisering nämns, vilket kan påverka utfallet.", "trump": "Folk, det här är en total katastrof för Sverige. De radikala vänstermuslimerna röstar som galningar för de värsta förlorarna – Sleepy S och hans kommunistkompisar –     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
