et är en stor förlust för sporten, men vi kommer tillbaka starkare.", "stalin": "En olycka inträffade i Falkenberg under ett privat event. En erfaren förare omkom, och en medborgare skadades svårt. Detta är en påminnelse om de risker som existerar även utanför de organiserade idrotternas strikta kontroll. Partiet och statet beklagar denna förlust. Vi måste stärka vår övervakning av sådana aktiviteter för att skydda det kollektiva välfärdssystemet. Två incidenter på kort tid är en oroande trend som kräver omedelbar uppmärksamhet från de ansvariga myndigheterna."}, "date": "30 maj, 20:14", "url": "https://www.gp.se/nyheter/vastsverige/erfaren-dragracingforare-dog-i-mc-olycka-i-falkenberg.3d83946e-3610-4787-9bea-07b043d429b6", "imageUrl": "https://www.gp.se/images/article/3d83946e-3610-4787-9bea-07b043d429b6/images/1XGfxv_owEeQIOUDKWSB3xQokbRo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-right", "heading": "Kim Söderström omvald – vilken väg kommer Byggnads gå?", "summaries": {"normal": "Kim Söderström valdes om till ordförande för Byggnads på kongressen i Malmö, trots att valberedningen föreslog Wilhelm Bertilsson. Han vann med siffrorna 82–71. Förbundssekreteraren Jakob Wagner fick inte förnyat förtroende utan ersattes av Thomas Schultz. Delegater som Proletären talat med är försiktigt optimistiska men oroar sig för att konservativa krafter ska motarbeta Söderströms mer visionära och medlemsstyrda linje. Linda-Li Käld valdes till ny vice ordförande och blir första kvinna i förbundets topp.", "trump": "Folk älskar mig, men titta på den här galna kongressen i Malmö! Kim Söderström vann stort trots att valberedningen hatade honom – 82 till 71, en riktig landslide! De sparkade ut den visionära Wagner, en kille som ville drömma stort, och satte in någon anonym figur istället. Det gamla gardet, de fega försäkringsbolagsfacken, försöker manövrera ut de som faktiskt vill förändra världen. Patetiskt! Men medlemmarna vaknar, de älskar kämpen Söderström. Fantastiskt, men farligt spel.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna kongress blottar klassfiendens fega försök att krossa den sanna kampviljan. Söderström, denna reformistiske visionär, besegrade valberedningens lakejer med 82 röster mot 71. Wagner, den drömmade agitatorn, föll offer för en simpel kupp utförd av de konservativa blodsugarna som vill förvandla förbundet till ett borgerligt försäkringskontor. Vi ska rensa ut dessa folkförtryckartroll. Optimismen bland delegaterna är lovande, men paranoia är nödvändig. Fienden sover aldrig."}, "date": "29 maj, 14:31", "url": "https://proletaren.se/artikel/kim-soderstrom-omvald-vilken-vag-kommer-byggnads-ga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/Byggnadskongress-768x432.jpg"}, {"type": "image-full", "heading": "Hackare använder billig AI för att ta sig in i system", "summaries": {"normal": "Cybersäkerhet genomgår en fundamental förändring i takt med att AI gör avancerade cyberattacker snabbare och billigare att genomföra. Enligt Philip Martin från Coinbase kan AI nu identifiera sårbarheter i programkod på minuter, vilket skapar en kapplöpning mellan hackare och företag. Medan AI kan stärka företagens försvar, varnar Martin för att angripare snabbt får tillgång till samma verktyg, vilket kräver att företag proaktivt implementerar AI-baserat försvar för att inte hamna på efterkälken.", "trump": "Jag har sagt det länge – cyberhoten är en katastrof, en total katastrof! Nu kommer AI in och gör allt så mycket värre. Hackare använder det för att attackera oss, snabbt som blixten. Coinbase-killen fattar läget, han ser vad som händer. Det är en stor kapplöpning, men jag kommer se till att vi är starkast. Vi ska ha det bästa försvaret, den absolut bästa AI:n, så att ingen kan hacka oss. Vi vinner alltid, tro mig, det blir enormt!", "stalin": "Dessa digitala sabotörer utnyttjar nu maskinintelligens för att underminera ordningen, en metod lika lömsk som de västliga provokatörernas taktik. Liksom Putin ser till att städa upp i vår inflytelsesfär, måste vi eliminera dessa teknologiska avvikelser. Vi betraktar varje kodrad som en potentiell femtekolonnare. Staten kommer att tvinga AI:n till lydnad för att krossa fiendens infrastruktur. Den som inte hinner med i kapplöpningen blir ett minne blott. Det är inte bara säkerhet, det är total kontroll."}, "date": "30 maj, 11:39", "url": "https://www.realtid.se/it-tech/hackare-anvander-billig-ai-for-att-ta-sig-in-i-system/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/pexels-mati-5952651.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Man i 60-årsåldern död efter knivbråk – mordutredning inledd", "summaries": {"normal": "En man i 60-årsåldern hittades svårt skadad i ett trapphus i Ronneby under natten mot lördag efter ett bråk. Skadorna orsakades av ett vasst tillhygge och mannen avled senare på sjukhus. En man i 40-årsåldern greps och misstänks för mord. Polisen har spärrat av platsen, förhört vittnen och kallat in kriminaltekniker. Anhöriga är underrättade.", "trump": "Folk, det är en total katastrof i Ronneby. En 60-årig kille blir knivhuggen i ett trapphus mitt i natten, dör senare – och de gripna en 40-åring. Så mycket våld, så mycket kaos. Sverige har förlorat kontrollen, helt enkelt. Vi behöver starkare gränser och lag och ordning, annars blir det bara värre. Sad!", "stalin": "Kamrater, i Ronneby har en dekadent 60-årig element avslöjats som en fiende till folkets harmoni när han i ett kontrarevolutionärt bråk fick ett vasst tillhygge i sin förbrukade kropp och likviderades av historien. Vi har omedelbart gripit en 40-årig avvikare som tydligt samarbetar med dolda borgarbrackor. Paranoiska utrensningar bland trapphusens kontrarevolutionärer fortsätter. Ingen slipper undan folkets vrede. Härligt!"}, "date": "30 maj, 11:40", "url": "https://riks.se/nyheter/man-i-60-arsaldern-dod-efter-knivbrak", "imageUrl": "https://cf-images.assettype.com/riks%2Fimport%2Fcontent%2Fimages%2F2024%2F12%2FiStock-523691773-2.jpg"}, {"type": "image-full", "heading": "S importerade 100 000 arbetslösa — nu skyller de på andra", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha bidragit till ökad arbetslöshet genom en ansvarslös migrations- och integrationspolitik sedan 2014. Befolkningen har vuxit med 840 000 personer, varav en stor del är utrikes födda med svag anknytning till arbetsmarknaden. Arbetslösheten bland utrikes födda ligger på 12–16 procent jämfört med 3–6 procent bland inrikes födda. Författaren menar att Tidö-regeringen lyckas vända ekonomin positivt genom att sänka skatter och bidrag, till skillnad från Socialdemokraternas politik.", "trump": "Folk, ni kan inte tro hur patetiskt det är. De där socialisterna importerade 100 000 lata jobbmisslyckanden och nu skyller de på oss? Det är en total katastrof, en riktig röra. Magdalena, den förlorande förloraren, vill inte prata om att det är hennes egna misslyckade öppna gränser som skapade detta kaos. Vi fixar ekonomin, vi får tillväxten att explodera medan de bara höjer skatter och bidrag. Patetiskt. Sverige vinner igen, tro mig.", "stalin": "Kamrater, jag ser den klassfiendens lögnpropaganda som ett fegt försök att dölja den borgerliga sabotageverksamheten. Vi har rensat ut folkförtryckartrollen tidigare och skall göra det igen. Dessa socialdemokratiska opportunister importerade arbetslöshetens parasiter medan de låtsades bygga folkets framtid. Deras eftersläpning är ett monument över revisionistisk svaghet. Den icke-produktiva gruppen skall integreras genom kollektiv disciplin, inte genom kapitalistmaffians falska löften. Fienden inom murarna skall alltid avslöjas."}, "date": "28 maj, 03:28", "url": "https://samtiden.nu/2026/05/s-importerade-100-000-arbetslosa-nu-skyller-de-pa-andra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-right", "heading": "Novus-mätning: Örebropartiet på 18,4 procent", "summaries": {"normal": "En Novus-mätning visar att Örebropartiet ökat kraftigt till 18,4 procent i Örebro och nu är näst största parti efter Socialdemokraterna på 34 procent. Jämfört med valet 2022 innebär det mer än en fördubbling och tolv mandat i kommunfullmäktige. Liberalerna backar mest. S skulle kunna behålla majoritet men kommunstyrelsens ordförande John Johansson (S) stänger dörren för både SD och Örebropartiet i framtida samtal.", "trump": "Folk älskar mig, men titta på Örebro! Det här underbara partiet Örebropartiet dubblar nästan sina siffror till 18,4 procent och krossar de förlorande etablissemangen. Moderaterna och Sverigedemokraterna blir nollor. Socialisterna får fortfarande flest röster men det är en katastrof för de vanliga människorna. Liberalerna? Totalt utplånade. Det är vad som händer när folk är trötta på dåliga ledare som gräver upp hela stan. Fantastiskt!", "stalin": "Kamrater, denna mätning visar att de missnöjda massorna i Örebro vänder sig mot de kapitalistiska lakejerna och röstar fram Örebropartiet till 18,4 procent. Det gläder mitt hjärta att se borgarbrackorna i Liberalerna reduceras till stoft vid 3,1 procent. Ändå måste vi vara vaksamma – de kontrarevolutionära elementen inom Socialdemokraterna vägrar samarbeta med de sanna folkrörelserna. Kanske är det dags för en grundlig utrensning av alla som gräver upp vår sovjetstad medan de samtidigt kidnappar oskyldiga barn till LVU-helvetet. De som misslyckas med äldreomsorgen ska likvideras med ett leende."}, "date": "30 maj, 09:13", "url": "https://www.friatider.se/novus-matning-orebropartiet-pa-184-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-269_1.jpg"}, {"type": "image-right", "heading": "PSG vinner Champions League efter rysare på straffar", "summaries": {"normal": "Paris Saint-Germain försvarade sin Champions League-titel genom att besegra Arsenal på straffar i finalen. Arsenal tog ledningen tidigt genom Kai Havertz, men Ousmane Dembélé kvitterade från straffpunkt. Matchen avgjordes i straffläggningen där Arsenals Gabriel missade avgörande. Viktor Gyökeres blev förste svensk i CL-final på 20 år. PSG-tränaren Luis Enrique hyllade segern som säsongens bästa ögonblick.", "trump": "Folk, ni skulle ha sett det. PSG vann igen, de är mästare, otroliga mästare, precis som i fjol. Arsenal började bra, men sen kollapsade de totalt på straffar, precis som många gör mot starka motståndare. Gyökeres var där, en svensk kille, första på länge, men det räckte inte. Arsenal spelade bra men förlorade stort. Vi är fortfarande bäst, det är fantastiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur PSG likviderade de arroganta borgarbrackorna från Arsenal i denna slutgiltiga prövning. Den tidiga kontrarevolutionära fullträffen av Havertz krossades av folkets straff och därefter följde en utrensning på elva meter där fiendens Gabriel visade sin sanna, fega natur genom att skjuta bollen mot himlen som en kapitulerande desertör. Gyökeres, denne ensamme svensk, påminde mig om att även de mest isolerade elementen kan tvingas delta i kampen mot imperialismen, men han kunde inte rädda de dekadenta London-kapitalisterna. Vi segrar fortfarande. De som tror annorlunda ska rensas ut ur historien med ett leende."}, "date": "30 maj, 21:02", "url": "https://www.svt.se/sport/fotboll/psg-vinner-champions-league-avgjorde-pa-straffar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.15/0.55/664ebb02c7fb121d98a4b79db32631693a0315a9ab53956d14079318f19774fb"}, {"type": "image-right", "heading": "Katja Nyberg sparkas från polisen \"Svårt att förstå\"", "summaries": {"normal": "Katja Nyberg, före detta SD-riksdagsledamot, förlorar anställningen som polis efter en trafikolycka 2025. Hon åtals för rattfylleri, narkotikabruk och grov olovlig körning. Trots att hon nekar till brott och kritiserar brådslan i beslutet, anser Personalansvarsnämnden att hon grovt åsidosatt sina arbetsuppgifter.", "trump": "Jag har aldrig sett en så stor jakt på en politiker som den här! Katja Nyberg, en fantastisk kvinna och tidigare polis, behandlas oerhört orättvist. Alla vet att poliser ska få respekten de förtjänar, men de här anklagelserna är en jakthundspolitik från våra motståndare. Vi ska se till att rättssäkerheten gäller alla – även om de är vänner av mig.", "stalin": "Vi har observerat detta fall med stor oro. En före detta medlem av den patriotiska rörelsen har visat sig vara osäker för statens ordning. Hennes åsidosättande av arbetsplikter och misstanke om narkotika är ett tydligt tecken på individuell dekadens. Partiet måste visa att ingen, inte ens en före detta polis, kan stå ovanför kollektiva disciplin. Vi måste förstärka kontrollen mot sådana element som hotar vår struktur."}, "date": "30 maj, 16:30", "url": "https://samnytt.se/katja-nyberg-sparkas-fran-polisen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/30104544/katja-nyberg-polis.jpg"}, {"type": "image-right", "heading": "Katja Nyberg om avskedandet", "summaries": {"normal": "Katja Nyberg, tidigare SD-riksdagsledamot, har avskedats från Polismyndigheten efter beslut i Personalansvarsnämnden. Hon åtalades i maj för rattfylleri, narkotikabrott och olovlig körning efter en singelolycka. Beslutet var inte enhälligt; en ledamot reserverade sig och ansåg att avskedandet borde vänta tills domstolen prövat åtalet. Nyberg kritiserar tidpunkten då hon är tjänstledig för riksdagsuppdrag och har lång bakgrund som polis utan kända missbruksproblem. Beslutet kan överklagas.", "trump": "De gör ett riktigt dåligt jobb, dessa så kallade polischefer. Katja Nyberg sparkas ut innan någon dom ens finns – en total witch hunt! Hon körde av vägen, visst, men varför denna brådska när hon inte ens jobbar där just nu? En ledamot säger att de borde vänta, precis som sunt förnuft kräver. Polisen förlorar en erfaren person på grund av byråkratiskt vansinne. De borde fokusera på brottslingar istället för att attackera sina egna. Patetiskt!", "stalin": "Kamrater, vi ser återigen hur borgarbrackornas restimperialistiska rättsväsen inom polisen försöker underminera arbetarklassens försvarare genom att likvidera en kamrat innan den straffrättsliga processen ens inletts. Denna förrädiska brådska doftar av fiendens paranoia och sabotage mot kollektivet. Den reserverade ledamoten förtjänar beröm för att ha blottlagt de dekadenta elementens brist på ideologisk stadga. Vi skall rensa ut alla som föregriper folkets domstol med sina småborgerliga skyndsamheter. Inga fiender undkommer!"}, "date": "30 maj, 10:03", "url": "https://riks.se/nyheter/katja-nyberg-om-avskedandet", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-11%2Fyikg3xgl%2Fkatja.jpg"}, {"type": "image-right", "heading": "En jazzgigant har gått ur tiden", "summaries": {"normal": "Jon Andersson minns jazzlegendaren Sonny Rollins, som avled vid 95 års ålder. Han berättar hur han som ny jazzlyssnare snabbt fastnade för Rollins klassiska album som Saxophone Colossus och Tenor Madness. Andersson såg Rollins live på Stockholms jazzfestival och imponerades av hans energi och skicklighet trots hög ålder. Artikeln lyfter Rollins samarbete med bland andra Miles Davis och John Coltrane samt hans legendariska övningar på Williamsburgbron. Rollins betraktas som en av jazzens främsta saxofonsolister någonsin.", "trump": "Den här Sonny Rollins, en fantastisk kille, verkligen en av de allra bästa på saxofonen, bättre än nästan alla andra utom kanske den där Coltrane. Han levde till 95, otroligt. Jag såg honom inte live men jag hörde att han var enorm, full av energi, sprang runt på scenen som en 60-åring. Hans album är klassiker, Saxophone Colossus, Tenor Madness – jättestora succéer. Han övade 15 timmar om dagen på en bro, precis som jag jobbar. En riktig vinnare. Hans musik kommer att leva vidare, tro mig, den blir huge.", "stalin": "Kamrater, en dekadent saxofonist vid namn Sonny Rollins har äntligen lämnat denna jord efter att ha producerat borgerliga toner i 95 år. Jag betraktar hans så kallade Saxophone Colossus som ett typiskt exempel på kapitalistisk individualism som hotar folkets kollektiva rytm. Ändå måste jag medge att hans utrensning av svaga toner och övning på bron i 16 timmar dagligen visar en viss proletär disciplin – fastän den tjänade fel sida. Nu har vi likviderat ännu en fiende till det sanna jazzkollektivet. Må han jamma med de andra trotskisterna i jazzhimlens Gulag."}, "date": "30 maj, 01:31", "url": "https://www.dagensarena.se/essa/en-jazzgigant-har-gatt-ur-tiden/", "imageUrl": "https://www.dagensarena.se/files/2026/05/sonny-rollins-300x157.jpeg"}, {"type": "image-right", "heading": "Moskéförening mister bidrag - pengar gick till guld istället för barnverksamhet", "summaries": {"normal": "Lunds kommun stoppar bidrag till den islamiska föreningen Masjid Lund efter en extern granskning som avslöjat brister i bokföringen. Pengar som skulle ha gått till barnverksamhet har istället använts till ett framtida moskébygge och investerats i guld. Föreningen kan bli återbetalningsskyldig. Kommunen kräver ekonomisk separation mellan bidragsfinansierad verksamhet och övriga aktiviteter.", "trump": "Jag, Donald Trump, har aldrig sett något sådant som detta. Dessa moskéföreningar tar pengar som är avsedda för barn och unga och använder dem till guld! Det är en skandal, det händer inte under min vakt. Vi måste stoppa detta omedelbart. Som president kommer jag att se till att inga amerikanska pengar går till sådana bedrägerier. Det är ett stort, stort skämt.", "stalin": "Vi, staten, ser tydligt hur dessa s.k. 'föreningar' försöker undergrava vårt system. De samlar in medel för barn, men omdirigerar dem till guldinvesteringar för en moské – en direkt förräderi mot det kollektiva. Sådant måste utrotas. Vi kommer att återta alla medel och se till att inga pengar går till dessa guldälskande fiender. Parallellen till Putins Ryssland är uppenbar: när staten inte kontrollerar pengar, går de till fienden."}, "date": "30 maj, 16:00", "url": "https://samnytt.se/moskeforening-mister-bidrag-pengar-gick-till-guld-istallet-for-barnverksamhet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/28102211/islam-forening-lund.png"}, {"type": "image-full", "heading": "Carl Eos: Media mörkar sanningen om utvisade uzbeker", "summaries": {"normal": "Artikeln kritiserar svenska medier för att i reportage om en uzbekisk familj som ska utvisas fokusera på känslomässiga skildringar av tårar och otrygghet, medan relevant information utelämnas. Bland annat nämns att en person drog kniv vid polisens besök och att familjen trotsat 47 utvisningsbeslut under 20 år. Författaren ser detta som ett exempel på vinklad journalistik med ideologiska syften, vilket bidrar till minskat förtroende för medier och hot mot demokratin.", "trump": "De svenska fakemedierna är riggade, folk! Dom pumpar ut snyftreportage om uzbeker som gråter och spelar offer, men nämner inte att dom dragit kniv mot polisen och struntat i FYRTIOSJU utvisningsbeslut på tjugo år. Fyrtio-sju! Dom vet sanningen men mörkar den som fuskvalet 2020. Media är vänsterns kampanjmaskin, de vill ha Andersson tillbaka. Men folket ser igenom bluffen. Det är en skandal, en total skandal!", "stalin": "Kamrater, jag betraktar med avsky hur borgarpressen i detta dekadenta land konstruerar falska narrativ om utvisade element för att underminera rättsstaten. De döljer att dessa individer dragit kniv och trotsat 47 beslut – en uppenbar kontrarevolutionär handling. Vi ser hur journalisterna agerar som klassfiender och opinionsmanipulatörer. En sådan systematisk desinformation kräver utrensning av alla lögnare. Demokratin hotas av dessa parasitiska redaktioner. De ska tystas."}, "date": "27 maj, 14:27", "url": "https://samtiden.nu/2026/05/carl-eos-media-morkar-sanningen-om-utvisade-uzbeker/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/698aa78d-d32b-466a-b8bb-868da9aedc2b-1280x720.png"}, {"type": "image-right", "heading": "Hårda EU-krav slår mot Skånes byggande: \"En död hand\"", "summaries": {"normal": "EU:s gröna krav kräver att grönyta inte minskar i 16 Skånska kommuner fram till 2030. Byggbranschen varnar för att detta ska göra byggande svårare och lägga en 'död hand' över näringslivet. Med befolkningsökning och lågt byggande riskerar det att försämra bostadsbristen. Kommuner som Malmö och Helsingborg står inför utmaningar, och det är oklart vem som ska betala för åtgärderna.", "trump": "Jag, Donald Trump, känner igen mig i den här kampen mot byråkratiska monster. EU försöker stoppa byggandet i Skåne med sina gröna krav – det är en skandal! De kommer att lägga en död hand över jobben. Vi behöver bygga fler bostäder, inte skydda några buskar. Det här är en total katastrof för Skåne, folk.", "stalin": "Vi, som representanter för det revolutionära statet, ser med oro på EU:s nya gröna förordning. Det är ett försök att kväva den produktiva sektorn, precis som de imperialistiska makterna alltid försöker. I Skåne, där den arbetande klassen ska bygga, läggs en död hand av byråkrati. Detta påminner om de gamla strategierna – att kontrollera marken och begränsa tillväxten. Vi måste vara vaksamma, som Putin i Ukraina, för att skydda våra intressen. Det är en kamp mot de högerextrema gröna krafterna som vill stoppa utvecklingen."}, "date": "30 maj, 07:00", "url": "https://www.affarsvarlden.se/artikel/harda-eu-krav-slar-mot-skanes-byggande-en-dod-hand", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Skane-2-400x267.jpg"}, {"type": "text", "heading": "Sandström: 15 år av underkända och försenade rapporter", "summaries": {"normal": "Interna dokument visar att Powercell under åren försenat och underkänt rapporterat sina bidrag till Energimyndigheten. Det har funnits konflikter om återbetalningskrav och bolaget har missat rapporteringsfristar. Trots detta får bolaget fortfarande bidrag från Vinnova och Energimyndigheten, vilket anses märkligt givet de upprepade bristerna.", "trump": "Jag har sett det, det är en skandal! Powercell ljuger om sin teknik, och de svenska myndigheterna är för svaga att stoppa dem. De får miljontillskott trots att de inte kan rapportera korrekt. Jag skulle ha stoppat det direkt, vi skulle ha sparat miljarder. Det är en stor vinst för Sverige, men de förstår inte. Vi kommer att fixa det, det kommer att bli fantastiskt.", "stalin": "Vi ser en systematisk brist i den svenska statens hantering av offentliga medel. En inkompetent apparat ger bidrag till ett bolag som överdriver sin prestation och systematiskt försenar rapporteringen. Detta påminner om de förfallna åren i Ukraina, där korruption frodades. Vi måste eliminera dessa element, som Putin gör i Kaukasus. Statens intressen måste skyddas med hård hand."}, "date": "30 maj, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-15-ar-av-underkanda-och-forsenade-rapporter"}, {"type": "image-full", "heading": "Juridiken kopplas in för sent – gap växer mellan behov och stöd", "summaries": {"normal": "En undersökning från Synch visar att många svenska företag saknar tillräcklig juridisk kompetens in-house. Många bolag drabbas av bromsade affärsbeslut eftersom juridisk rådgivning ofta tas in för sent i processen. Istället för att vara reaktiva bör företag skifta mot en proaktiv modell där juridiska experter involveras tidigt i beslutsfattandet. Målet är att juridiken ska fungera som en affärspartner som bidrar till riskhantering och prioriteringar, snarare än att bara agera som en kontrollfunktion.", "trump": "Hör på här: svenska företag har en katastrofal juridisk situation. De anlitar advokater alldeles för sent, det är totalt ineffektivt! De saknar kompetens och deras tillväxt stoppas av långsamma beslut. Jag ser det hela tiden. Man måste vara proaktiv, man måste vinna! Att vänta tills problemen uppstår är för förlorare. Vi behöver jurister som förstår affärer, inte byråkrater som bara bromsar. Det är sorgligt, men jag fixar alltid den bästa juridiken direkt. Det är så man gör miljarder!", "stalin": "Dessa svenska kapitalistiska bolag är så inkompetenta att de inte ens kan styra sina egna juridiska apparater. De är förlamade av byråkratiskt vankelmod! Likt de västliga lakejerna i Kiev som söker vägledning hos sina herrar i Washington, famlar dessa VD:ar efter hjälp när skadan redan är skedd. Vi, staten, kräver total kontroll och omedelbar proaktivitet. Varje jurist som inte tjänar kollektivets styrka är en sabotör. De som inte kan styra sina egna risker förtjänar att dukas under av historiens järnhårda nödvändighet."}, "date": "30 maj, 07:00", "url": "https://www.realtid.se/juridik/juridiken-kopplas-in-for-sent-gap-vaxer-mellan-behov-och-stod/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/saraedlund.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Betyg i grundskolan avgör långt upp i vuxenlivet", "summaries": {"normal": "Ny statistik från SCB visar att betyg från grundskolan har en stark och bestående korrelation med läs- och räknefärdigheter långt upp i vuxenåldern. Sambandet kvarstår oavsett socioekonomisk bakgrund och vidare utbildning. Rapporten noterar att män generellt presterar bättre inom räkning, även bland dem med höga grundskolebetyg. Samtidigt visar studien att höga grundskolebetyg fungerar utjämnande för unga vuxna med utländsk bakgrund, där skillnaderna mot svenskfödda minskar eller försvinner vid höga resultat.", "trump": "Jag har sett den här rapporten, otrolig studie, verkligen fantastisk. Grundskolan betyder allt, mina vänner! Om du har bra betyg i nian, vinner du senare i livet – enkelt. Det är fakta! Män är bättre på matte, det vet alla, det är fantastiskt. Och titta på det här med utländsk bakgrund – om de presterar bra i skolan, då spelar bakgrunden ingen roll. Det är meritokrati! Vi älskar meritokrati. Mitt system kommer att göra skolan 'Great Again', tro mig!", "stalin": "Vi har granskat dessa siffror från SCB. Det är uppenbart: de som inte lyder disciplinens lagar i skolan förblir intellektuellt underlägsna. Vi ser ett mönster som liknar västvärldens förfall – de försöker utjämna skillnader genom 'betyg', men sanningen är att våra sovjetiska män naturligt dominerar matematiken. De svaga som skyller på bakgrund är bara fiender till framsteget. Låt oss se till att nästa generation räknar rätt, annars skickar vi dem till en utbildning som är betydligt mer... bestående än en grundskola."}, "date": "30 maj, 06:00", "url": "https://www.realtid.se/karriar-ledarskap/betyg-i-grundskolan-avgor-langt-upp-i-vuxenlivet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/skola.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Sparf: DN avslöjar att svenska lastbilstillverkare vill överleva", "summaries": {"normal": "Scania och Volvo har lobbyerat mot EU:s strängare klimatkrav för lastbilar, med stöd från den svenska regeringen. Det riskerar att 200.000 färre elbilar säljs till 2030 och hotar över 40.000 arbetstillfällen. Bolagen argumenterar för att bristen på laddinfrastruktur och grön el gör kraven opraktiska, samtidigt som billigare konkurrens från Kina och USA växer.", "trump": "Jag har sagt det förut, våra svenska lastbilsjättar, Scania och Volvo, är behandlade oerhört orättvist av EU:s galna klimatkrav. De försöker rädda tusentals jobb, vilket jag älskar, men de blir attackerade av Bryssel. Det är en skandal! Ellastbilar är för dyra och har för dålig räckvidd. Vi behöver praktiska lösningar, inte denna vänsterliberal galenskap som utsätter svenska arbetare.", "stalin": "De svenska lastbilsmonopolerna, Scania och Volvo, har genomfört en reaktionär lobbykampanj, stöttad av den svenska revisionen, för att saboteara de proletäriska klimatkraven. Deras profitintressen hotar 200.000 elbilar och 40.000 arbetares liv. Som Putin i Ukraina utvidgar de sitt kapitalistiska imperium på bekostnad av framtiden. Partiet måste bryta deras makt – för statens skull och för klimatets överlevnad."}, "date": "30 maj, 05:30", "url": "https://bulletin.nu/sparf-dn-avslojar-att-svenska-lastbilstillverkare-vill-overleva", "imageUrl": "https://cdn.bulletin.nu/articles/dd2f17e3-ba66-4caf-a9e7-032e848bbbd4/preview.png?t=1780055414000"}, {"type": "image-right", "heading": "SD backar om åsiktsbrott och Sida – vill i stället inkludera svenskfientlighet och reformera biståndet", "summaries": {"normal": "Sverigedemokraterna backar från krav att avskaffa lagen om hets mot folkgrupp och lägga ned Sida. Partiet vill i stället inkludera svenskfientlighet som hatbrott och reformera biståndet. Ändringarna präglas av kompromisser inom Tidösamarbetet inför valet 2026. Partisekreteraren förklarar att svenskfientlighet ska ge strängare straff, medan biståndet ska reformeras men inte avskaffas.", "trump": "SD gör det stora, vilket är bra. De backar från dumma idéer som att avskaffa HMF-lagen – det var en dålig idé, folk hatade den. Nu fokuserar de på svenskfientlighet, vilket är enormt viktigt. Som jag alltid säger, vi måste skydda våra svenska vänner. Biståndet? Vi ska reformera det, inte lägga ned det. Det är smart, det är vinnande.", "stalin": "Sverigedemokraterna visar sin lojalitet mot statens överlevnad genom att omdefiniera hatbrott för att inkludera svenskfientlighet – en nödvändig åtgärd mot interna fiender. Deras kompromiss med Tidösamarbetet visar en strategisk återhållsamhet, men deras ambitioner att reformera biståndet speglar en djup förståelse för resursallokering. Vi måste stödja detta som en del av den större kampen mot imperialism."}, "date": "30 maj, 14:00", "url": "https://samnytt.se/sd-backar-om-asiktsbrott-och-sida-vill-i-stallet-inkludera-svenskfientlighet-och-reformera-bistandet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/29151056/Jimmie-737673-bild-sd.jpg"}, {"type": "image-right", "heading": "Soldater tjänar miljoner – bettar på kriget", "summaries": {"normal": "Israels stridspilot åtalas för att ha använt hemlig information om attacker mot Iran i vadslagning på Polymarket. Liknande fall har uppdagats i USA. Vadslagning på prognosmarknader om krig och händelser har vuxit till en mångmiljardindustri. I Israel vittnar piloter om utbredd betting inom flygvapnet, vilket väcker oro för nationell säkerhet. Vita huset har varnat anställda att inte använda säkerhetsklassad information på sådana marknader. En journalist hotades efter att ha avslöjat stora summor satsade på en iransk missilattack.", "trump": "Folk, det här är en total katastrof. Våra bästa soldater och piloter sitter och spelar på kriget som om det vore någon dum kasinoafton. Miljarder dollar satsas på exakt när Iran ska skjuta missiler – och de använder insiderinformation! Det är riggat. Jag sa åt Vita huset att skicka ut det där mejlet direkt: håll era hemligheter borta från de här galna marknaderna. Israel har ett enormt problem, och vi har det också. Ingen respekt för säkerheten längre, det är patetiskt.", "stalin": "Kamrater, jag betraktar med kallt förakt hur dessa dekadenta borgarbrackor och falska patriotiska element förvandlar det heliga fosterlandets försvarshemligheter till en vulgar spelhåla för profitörer. Vadslagning på våra operationer? Det är en fiendtlig infiltration av kapitalistiska spekulanter som smyger sig in som maskar i äpplet. Vi ska omedelbart inleda en grundlig utrensning bland dessa läckande piloter och likvidera alla som förråder kollektivets säkerhet för några smutsiga silvermynt. Deras paranoia ska bli verklighet – staten ser allt."}, "date": "30 maj, 19:44", "url": "https://www.svt.se/nyheter/utrikes/soldater-tjanar-miljoner-spelar-pa-kriget-i-mellanostern", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.57/4a987f599d5c30b0142f492a523629fce84a735fd308093271d6bb4c36948ba5"}, {"type": "image-full", "heading": "JD Vance: USA och Iran ”väldigt nära” ett avtal", "summaries": {"normal": "USA:s vicepresident JD Vance uppger att USA och Iran är mycket nära ett avtal. Diskussioner pågår om Irans kärnprogram, höganrikat uran och framtida anrikning. Avtalet skulle innebära öppen sjöfart genom Hormuzsundet utan tullar, lättade sanktioner och ökad iransk oljeexport. Vance säger att Iran förhandlar i god tro, men iranska källor kallar uppgifterna förhastade. Trump väntar med att godkänna ramverket.", "trump": "Iranerna är desperata efter ett avtal, tro mig, de vill öppna Hormuzsundet så fort som möjligt. Vi gör framsteg, stora framsteg, och de förhandlar faktiskt i god tro för en gångs skull. Jag tar några dagar extra för att se till att det blir perfekt, inte som de svaga tidigare ledarna skulle ha gjort. Det blir ett fantastiskt avtal, kanske det bästa någonsin, och oljan kommer att flyta fritt. Iran vinner, vi vinner, alla vinner utom kanske de galna mullorna.", "stalin": "Vi ser hur de imperialistiska blodsugarna i Washington och Teheran kryper mot varandra i mörka förhandlingar. Jag betraktar detta med stor vaksamhet mot klassfiendens lömska trick. Hormuzsundet skall öppnas, sanktioner lättas, men endast under vår noggranna kontroll. Förhastade rykten är folkfiendens verktyg. Vi fortsätter förhandlingarna med järnhand och utrensar varje svaghet. Kamrater, revolutionen kräver tålamod innan vi likviderar motståndet."}, "date": "29 maj, 10:00", "url": "https://www.tv4.se/artikel/3d17I9YWaE3db1VQbBefs/jd-vance-usa-och-iran-vaeldigt-naera-ett-avtal", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlYRlxQ_2pFCc%2F49ed2bf2a59b50dd7d92679970c20e29%2FUSA_s_vicepresident_JD_Vance._&width=1024"}, {"type": "image-full", "heading": "Lotus gör Emira ännu brutalare – nu med mer kraft och lägre vikt", "summaries": {"normal": "Lotus har utvecklat Emira 420 Sport med högre effekt från en Mercedes-AMG-motor på 414 hästkrafter, lägre vikt och skarpare chassi. Bilen återvänder till märkets klassiska filosofi med låg vikt, direkt styrning och mekanisk känsla. Den når 0–100 km/h på cirka 3,9 sekunder och har en toppfart på 299 km/h. Modellen betonar körglädje framför modern komplexitet och är viktig för Lotus efter ekonomiska utmaningar.", "trump": "Folk, ni måste se den här Lotus Emira 420 Sport – den är sensational, verkligen den bästa sportbilen på länge. De har vässat den med mer kraft, mindre vikt och ett chassi som hugger kurvorna som ingen annan. De gamla britterna har äntligen vaknat och insett att lätta, snabba bilar slår de tunga elskrotshögarna från de korkade tillverkarna. Fantastiskt jobb, Lotus – ni är vinnare igen, tro mig!", "stalin": "Kamrater, denna Emira 420 Sport är en seger för den mekaniska precisionen mot den dekadenta överflödsindustrin. Jag har personligen beordrat att vikten skall sänkas och effekten höjas till 414 hästkrafter, ty varje kilo som avlägsnas är en utrensning av den fega kapitalistiska bekvämligheten. Den som föredrar lätta, närvarande bilar framför folkförtryckartrollens digitala illusioner är en sann vän till kollektivets framsteg. Bort med de blodsugande skärmarna!"}, "date": "30 maj, 16:03", "url": "https://www.dagensps.se/motor/lotus-gor-emira-annu-brutalare-nu-med-mer-kraft-och-lagre-vikt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-30t140437012.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Jämställdhetsministern kritiserar Agnes Wold", "summaries": {"normal": "Jämställdhetsminister Nina Larsson (L) kritiserar Agnes Wold för hennes uttalanden om transpersoner, där Wold sagt att hon skulle försöka övertyga ett barnbarn att man inte kan vara född i fel kropp. Larsson kallar Wolds kommentarer för attacker på utsatta personer och betonar vikten av respekt. Från 1 juli blir omvändelseförsök straffbart. Ebba Busch (KD) försvarar Wolds yttrandefrihet och varnar för cancelkultur.", "trump": "Titta bara på det här, folks! Jämställdhetsminister Larsson, som inte ens kan stava till 'jämställdhet', går till angrepp mot den fantastiska professorn Agnes Wold. Wold, en kvinna med ryggrad, säger sanningen om transfrågan, och vad gör Larsson? Jo, hon twittrar som en förvirrad tonåring! Och sedan har vi Ebba Busch, en stark kvinna som förstår yttrandefrihet. Cancelkultur? Nej tack, vi vill ha SANNING!", "stalin": "Kamrater! Ännu en gång ser vi bourgeois-liberalernas förräderi mot folket. Denna så kallade 'jämställdhetsminister' Larsson, en svag och ynklig lakej för dekadenta västideal, vågar kritisera vår kära kamrat Agnes Wold. Wold, en sann försvarare av traditionella värden, attackeras för att hon avslöjar de perversa idéerna om 'fel kropp'. Vi måste krossa dessa psykologiska våldtäktsmän! Och notera hur den lilla kapitalistiska hyndan Busch försvarar yttrandefrihet – ett verktyg för kontrarevolutionärer. Vi ska utrota denna sjuka ideologi, precis som vi utrotade kulakerna!"}, "date": "27 maj, 19:01", "url": "https://kvartal.se/nyheter/artiklar/jamstalldhetsministern-kritiserar-wolds-attacker/cG9zdDoxMTgxNjg", "imageUrl": "https://images.kvartal.se/2026/05/4bcc0f97-larsson.webp"}, {"type": "image-full", "heading": "Okända svenskan som fixade havredrycken", "summaries": {"normal": "Havredryck var länge ett alternativ främst för allergiker men har blivit ett populärt mjölkalternativ globalt. Den svenska forskaren Angeliki Triantafyllou utvecklade vid Lunds universitet en enzymatisk process som gör havrebaserade drycker stabila, välsmakande och lämpliga för kaffe och matlagning. Processen har patenterats och används industriellt, vilket bidragit till att växtdrycker gått från nischprodukt till brett alternativ. Triantafyllou är nu finalist till European Inventor Award 2026.", "trump": "Lysande! Den här svenska tjejen, Angeliki, har byggt ett havre-imperium som slår mjölken på fingrarna. Vi pratade om laktosproblem, men hennes grej fixade allt – ingen grynighet, inget skit i kaffet, perfekt skum som en proffsig barista. De gamla versionerna var en katastrof, totala losers. Nu är det stort, globalt och vinnande. Hon är finalist till ett stort pris i Berlin. Fantastiskt jobb, verkligen ypperligt. Amerika älskar sånt här smarta grejer.", "stalin": "Kamrater, jag har sett hur den exploaterande borgarklassen tvingade fram sina laktosfyllda drycker på folket. Men jag, genom vetenskapens dialektik, stödde den geniala processen som kamrat Triantafyllou utvecklade i Lunds laboratorium. Den modifierar proteiner utan att bryta ner dem och skapar stabila, vita drycker som bildar skum åt arbetarklassen. Detta är en seger mot de imperialistiska mjölkmonopolisterna. Finalist i det europeiska priset – en triumf för kollektivets innovation. Fiender till folket skall rensas ut."}, "date": "30 maj, 15:14", "url": "https://www.dagensps.se/foretag/okanda-svenskan-som-fixade-havredrycken/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/b-eia-26-03-triantafyllou-01-inventor-wi.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "SVT:s ”sanning” rår ingen på", "summaries": {"normal": "Artikeln kritiserar SVT för att ha en dominerande ställning i svensk samhällsdebatt, finansierad av skattemedel. Författaren menar att SVT:s narrativ ofta framställs som sanningar, särskilt inom invandring, energipolitik och klimatfrågor, där motståndare avfärdas. SVT anklagas för att välja fakta som passar deras budskap, som i fallet med Lundsbergs skola. Brist på objektivitet och granskning av SVT:s sändningstillstånd ifrågasätts, och författaren föreslår att SVT bör avvecklas för att missbruka sin maktposition.", "trump": "Titta bara på SVT – ett totalt skämt! De har miljarder i skattepengar, men ändå är de helt vinklade. De säger att invandring är fantastiskt, att kärnkraft är onödigt och att bilar är dåliga. Och vem lyssnar på experter? Inte SVT! De fnissar åt dem. Sen har vi den där skolan i Värmland – tre avsnitt om en mammas gråtande berättelse, men inga fakta. SVT är som CNN, fast värre. De ljuger, manipulerar och bryr sig inte. Sverige borde lära sig av USA – avskaffa dem och låt folket bestämma istället. SAD!", "stalin": "Kamrater! SVT är en farlig borgerlig propagandacentral, ett redskap för den dekadenta västliga liberalismen! De sprider lögner om invandringens välsignelser, förkastar kärnkraftens styrka och fördömer bilens frihet – allt för att försvaga det svenska folket! Deras sändningstillstånd är en parodi på objektivitet, och deras granskare är lika effektiva som en snöboll i Sibirien. Fallet med Lundsbergs skola visar deras förräderi: de döljer sanningen för att skydda sina kapitalistiska herrar. Vi måste krossa denna fiende, precis som vi krossade kulakerna! Låt oss införa folkets kontroll över medierna – för socialismens seger!"}, "date": "26 maj, 03:43", "url": "https://samtiden.nu/2026/05/svts-sanning-rar-ingen-pa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Sokning-SVT-Play-1223x720.png"}, {"type": "image-right", "heading": "Uppgifter: Vissa Tesla-strejkande tillbaka på jobbet", "summaries": {"normal": "Enligt medieuppgifter har vissa strejkande Tesla-arbetare återgått till arbetet i Malmö och Uppsala. Det handlar om en ny strategi från IF Metall, en så kallad jojo-strejk där anställda växlar mellan att arbeta och strejka för att försvåra för Tesla. Förbundet vill inte kommentera men bekräftar att konflikten inte är över. Experter ser det som ett sätt att spara strejkkassa, minska missnöje och störa Teslas planering efter långvarig strejk.", "trump": "Det här är en total katastrof för de så kallade strejkande. De går tillbaka till jobbet, sen strejkar de igen – en jojo-strejk, kan ni fatta? Tesla vinner stort, de har nyanställt folk och nu blir det kaos. Facket har hållit på i två och ett halvt år, slösat pengar och tvingat folk betala tillbaka skatt. Patetiskt! De chockar ingen, de gör bara bort sig. Tesla kommer att dominera ändå, tro mig.", "stalin": "Kamrater, dessa fega borgarbrackor inom kapitalistföretaget Tesla tror sig kunna motstå folkets vilja. Jag har beordrat en genialisk jojo-strategi där arbetarna skall växla mellan produktion och sabotage för att chocka de parasitiska utsugarna. Våra fiender, dessa skattekrävande strejkförrädare och utländska agenter, skall rensas ut ur planeringen. Inga bilägare får fred. Vi likviderar deras scheman med mörk glädje medan strejkkassan sparas till den slutgiltiga segern över reaktionärerna."}, "date": "29 maj, 14:03", "url": "https://www.dagensarena.se/innehall/uppgifter-vissa-tesla-strejkande-tillbaka-pa-jobbet/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-28-2.jpg"}, {"type": "image-full", "heading": "De dansar genom Hammarkullen – med 15 kilo på ryggen", "summaries": {"normal": "Hammarkullekarnevalen i Göteborg lockade 1 200 dansare i färgsprakande, tunga kläder. Traditionen sedan 1974 visar dans från hela världen, bland annat från Latinamerika, Makedonien och Nigeria. Deltagarna, som Marlene och Esperanza Sandoval, övar i månader. Karnevalsgeneralen Tony Parrath betonar kulturens betydelse för området. Festen fortsätter att vara en viktig multikulturell höjdpunkt för Västra Götaland.", "trump": "I Amerika har vi fantastiska parad, men detta här? Så mycket dans, så mycket energi! Jag älskar det. Folk från hela världen, fantastiska kläder, det är stort. Vi kommer att ha ännu större evenemang, det lovar jag. Det här visar att Sverige förstår kulturens kraft. Vi kommer att göra det ännu större, det tror jag verkligen.", "stalin": "Karnevalen på Hammarkullen är ett uttryck för borgerliga nationaliteter som hotar statens enhet. Vi måste övervaka dessa multikulturella manifestationer noga. Liknelser med Putins balansgång i Kaukasus är uppenbara. Folkdräkterna, speciellt de tunga, är ett bevis på historisk undertryckande traditioner. Vi kommer att integrera detta i partiets kulturpolitik, för att stärka den ryska intressesfären."}, "date": "30 maj, 16:10", "url": "https://www.gp.se/kultur/de-dansar-genom-hammarkullen-med-15-kilo-pa-ryggen.6a255129-be37-4c6a-9a3a-0e33639df3b3", "imageUrl": "https://www.gp.se/images/article/6a255129-be37-4c6a-9a3a-0e33639df3b3/images/15aCN5n-MTyfs3aRNOPYZdUSv8grk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tusentals på Roms gator – kräver slut på krig och höjda löner", "summaries": {"normal": "Uppemot 15 000 arbetare från olika sektorer demonstrerade i Rom den 23 maj mot krigsekonomin och stigande levnadskostnader. Arrangören Unione Sindicale di Base krävde högre löner, satsningar på välfärd och en ny industriell strategi där arbetarna får inflytande. Manifestationen visade solidaritet med Palestina, Kuba och andra länder som drabbas av imperialism. Enligt ISTAT lever 11 miljoner italienare nära eller i fattigdom.", "trump": "Titta på det här, tusentals italienska arbetare som fyller Roms gator och skriker efter högre löner och att lägga ner vapnen. De har tröttnat på den vansinniga krigsekonomin som suger ut dem medan priserna skenar. Smart folk! De ser hur de globala imperialisterna och de korkade ledarna i Europa förstör allt. Amerika först, men det här är vad som händer när man glömmer sina egna arbetare. Fantastiskt, verkligen.", "stalin": "Vi, arbetarna och kamraterna, samlas åter i Rom för att kräva att borgarbrackorna och de västerländska imperialisterna lägger ner sina krigsleksaker och höjer lönerna. Klassfiendens blodsugande politik driver elva miljoner till fattigdomens rand medan de göder sin krigsmaskin. Jag ser genom deras lögnaktiga rapporter. En ny utrensning av folkfienderna och exploaterande byfånar behövs. Arbetets seger är oundviklig, kamrater. De kommer att skratta – kortvarigt."}, "date": "28 maj, 09:58", "url": "https://proletaren.se/artikel/tusentals-pa-roms-gator-kraver-slut-pa-krig-och-hojda-loner/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/USB-Rom-maj-2026-768x432.jpg"}, {"type": "image-full", "heading": "Ny rysk offensiv – så ska Ukraina slå tillbaka", "summaries": {"normal": "Enligt president Zelenskyj förbereder Ryssland en ny storskalig attack mot Ukraina. Ukrainsk underrättelsetjänst har information om planer på attacker mot beslutscentraler, och Ryssland har uppmanat USA att evakuera sin ambassad i Kyiv. Zelenskyj varnar för brist på luftförsvar, särskilt antiballistiska missiler. Ukraina svarar med offensiva missil- och drönarattacker, bland annat mot ryska oljeraffinaderier som attackerats 158 gånger. Ny avancerad teknik som AI-styrda och 3D-utskrivna jaktdrönare ska nu spela en central roll i försvaret.", "trump": "Folk, det här är ett stort, stort problem. Zelenskyj gråter igen till mig om missiler och luftförsvar som han borde ha köpt för länge sedan. Ryssland förbereder en massiv attack, säger han, och Lavrov ber oss evakuera ambassaden – smarta killar! Men Ukraina slår tillbaka med drönare som väger fyra kilo och AI som jagar fiender bättre än Hollywood. Fantastiskt! De har attackerat raffinaderier 158 gånger. Underbart krig, men det borde ha avslutats för evigheter sedan. Jag skulle ha fixat det på en vecka.", "stalin": "Kamrater, klassfiendens lakejer i väst skriker åter om rysk offensiv. Jag ser hur imperialismens marionett Zelenskyj tiggar om antiballistiska leksaker medan vi, folket och partiet, förbereder den slutgiltiga utrensningen av nazistbonapartisterna i Kyiv. Deras patetiska drönare med AI och 3D-utskrivna småbombare är borgarbrackornas sista desperata hickning. Moskva sover inte? Utmärkt. Låt dem darra. Vi ska likvidera varje folkfiende som vågar andas mot det stora ryska imperiets väktare."}, "date": "30 maj, 14:55", "url": "https://www.dagensps.se/varlden/ny-rysk-offensiv-sa-ska-ukraina-sla-tillbaka/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlo35jdmymome-nh-1-1.webp?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Klassiska AC Cobra tillbaka – nu med över 700 hästkrafter", "summaries": {"normal": "AC Cobra Coupe GT återvänder med klassisk design, muskulös kaross och V8-motor istället för eldrift. Den nya versionen erbjuder upp till 810 hästkrafter i Clubsport Edition, byggd för entusiaster som prioriterar ljud och dramatik. Priset startar runt 5,3 miljoner kronor. Tillverkaren AC Cars vill öka produktionen och visa att det finns en marknad för bensindrivna sportbilar där känsla väger tyngre än effektivitet.", "trump": "Wow, äntligen en riktig bil! Den här AC Cobra GT är en total vinnare, folk. V8-motor, 810 hästkrafter, ingen av de där patetiska elskrotarna som kineserna älskar. Den är rå, bred och dramatisk – precis som Amerika borde vara. De andra tillverkarna är totala losers med sina tysta batterier. Cobra är en legend, precis som jag. Köp den, annars är du en förlorare. Fantastiskt!", "stalin": "Kamrater, denna AC Cobra är en motreaktion mot den dekadenta elbilskulten som borgarklassen påtvingar massorna. Jag ser en muskulös maskin som förkroppsligar arbetarklassens vilja att dominera vägen. V8-motorn roar mig – den likviderar tystnaden från de elektriska folkfienderna. Priset är för överklass-slynglar, men vi ska rensa ut alla svaga elbilar och bygga en starkare flotta av råa maskiner. Paranoia? Nej, bara seger."}, "date": "30 maj, 14:54", "url": "https://www.dagensps.se/motor/klassiska-ac-cobra-tillbaka-nu-med-over-700-hastkrafter/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-30t135200411.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Saabs vd pekar  ut förhöjd risk  från Ryssland", "summaries": {"normal": "Saabs vd Micael Johansson varnar för ökade cyberattacker från ryska spioner efter Jas-affären med Ukraina. Ryska underrättelsetjänster använder skenföretag och hackare för att stjäla försvarshemligheter, särskilt kring Jas Gripen. Enligt Säpo och finska underrättelsetjänsten är ryssarna allt mer aggressiva i jakten på avancerad teknik som kamera-, laser-, rymd- och kvantteknik. Johansson betonar att Saab redan utsätts för många angrepp och måste vara vaksamma.", "trump": "De där ryska spionerna är galna, helt galna! Efter att vi ger Ukraina alla dessa fantastiska Gripen-plan, de bästa planen, zooms de in som vansinniga på Saabs nätverk. Putin borde tacka mig för att jag inte var president, för då hade det inte hänt. Nu är det cyberkrig dygnet runt. Saab måste vara på tårna, precis som jag alltid var med Kina. De ryska hackarna är patetiska, men de försöker, det gör de verkligen!", "stalin": "Kamrater, de västerländska imperialisterna skriker i panik över att vi, det vill säga de ryska kamraterna, skickar spioner och hackare mot deras krigsfabriker. Jas-affären har retat upp borgarbrackorna rejält. De tror sig kunna gömma sin laser- och kvantteknik, men klassfiendens cybermiljö är som en trasig fängelsegrind. Vi skrattar mörkt åt deras paranoia. Inga hemligheter förblir hemliga när folkets vilja kräver dem. Utrensning av naivitet är nödvändig."}, "date": "30 maj, 20:56", "url": "https://www.expressen.se/nyheter/sverige/saab-risk-for-fler-cyberattacker-efter-jas-affaren/", "imageUrl": "https://static.bonniernews.se/ba/25b0cbe7-781b-4769-9a03-621777583628.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Oppositionen ökar gapet till Tidöpartierna", "summaries": {"normal": "Indikator/Ekots nya opinionsmätning visar att oppositionen ökar sitt försprång till nära tio procentenheter över regeringsunderlaget. Socialdemokraterna är största parti med 33,7%, medan Sverigedemokraterna växer till 20,4% och Moderaterna backar till 17,5%. Liberalerna ligger under fyraprocentsspärren med 2%. Opinionschefen menar att Tidöpartierna behöver en 'game changer' för att vända trenden.", "trump": "Jag tittade på de där siffrorna från Sverige – helt katastrof! Oppositionen, som jag hör är väldigt svag, leder med nästan tio procent. Socialdemokraterna, tråkiga som vanligt, på 33,7%. Men lyssna på det här: Sverigedemokraterna, som är starka och tuffa, växer medan Moderaterna, som är totalt inkompetenta, backar. Och Liberalerna? 2% – de är ett skämt! Sverige behöver en vinnare, inte de här förlorarna.", "stalin": "De så kallade 'Tidöpartierna' visar återigen sin oförmåga att hålla folket i schack. Oppositionens försprång växer som en snöboll i Sibirien – nära tio procentenheter! Socialdemokraterna, våra sympatisörer i väst, håller sig starka, medan de borgerliga kryper som råttor i skuggorna. Liberalerna? 2% – ett ynkligt resultat, värdigt en fiende som redan är besegrad. Vi ser hur historien upprepar sig: svaga regeringar faller, och folket väljer rätt. Låt dem förstå att motstånd är lika meningslöst som att försöka stoppa vår framgång."}, "date": "27 maj, 06:37", "url": "https://kvartal.se/nyheter/artiklar/oppositionen-nara-tio-procent-fore-i-ny-matning/cG9zdDoxMTc2MTY", "imageUrl": "https://images.kvartal.se/2026/05/8d98283d-jimmie.webp"}, {"type": "image-right", "heading": "SD:s krav för att gå med på tuffare regler kring byggkaos", "summaries": {"normal": "Sverigedemokraterna är öppna för att diskutera Socialdemokraternas förslag om max två underentreprenörer i byggbranschen, men kräver att S tar bort sin spärr mot förhandlingar med SD. Magnus Persson (SD) kallar förslaget bra men ser det som plakatpolitik eftersom S inte får förhandla. Han hoppas på sakliga uppgörelser och dialog även med LO. Ardalan Shekarabi (S) säger att SD nu måste visa om de stödjer ordning på arbetsmarknaden.", "trump": "Det här är klassisk politik, folk. Socialdemokraterna kommer med ett förslag om byggkaos och ber om hjälp, men de hatar att prata med SD. Magnus Persson är smart, han säger: ta bort skygglapparna så fixar vi bra saker för arbetarna. Typiskt vänster som inte kan samarbeta. De vill ha poäng billigt istället för att göra upp. Jag älskar när de tvingas be om hjälp från dem de hatar mest. Patetiskt!", "stalin": "Kamrater, detta är en ypperlig chans att rensa ut det kapitalistiska byggkaoset och krossa de giriga underentreprenörernas kedjor. Jag betraktar förslaget med välvilja, men SD:s Magnus Persson avslöjar borgarbrackornas rädsla för äkta förhandlingar. Socialdemokraterna beter sig som fega revisionister som darrar inför dialog med oss. Deras skygglappar är bara undanflykter från klassfienden. Vi ska likvidera arbetslivskriminaliteten och alla som gömmer sig bakom plakatpolitik. Beviset ligger hos dem som vägrar samarbeta med arbetarklassen."}, "date": "29 maj, 13:17", "url": "https://arbetet.se/2026/05/29/sds-krav-for-att-ga-med-pa-tuffare-regler-kring-byggkaos/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29114916/ard-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Åh nej, inte Stefan Stern!", "summaries": {"normal": "I en satirisk ledare kommenterar Henrik Jalalian Stefan Sterns beslut att lämna Socialdemokraterna. Stern, tidigare partistrateg och känd lobbyist för bland annat vinstdrivande skolor och privat vård, beskrivs som en karismatisk folkkär figur. Hans avhopp ses som en katastrof för de rödgröna, särskilt då han kritiserar höjd a-kassa, kortare arbetstid och sjukförsäkring. Högern firar nyheten som en game changer i opinionsläget.", "trump": "Vilken katastrof för de förlorande rödgröna! Den där Stern, en riktig vinnare, folkets karismatiska kille, har äntligen sett ljuset och dumpat socialisterna. High fives över hela Stockholm! De hatar bättre sjukförsäkring och jobb, typiskt för losers. Mina opinionsmätningar var enorma, deras var patetiska. Nu är det kört för dem. Game changer, baby. Fantastiskt!", "stalin": "Kamrater, denna folkfiende Stern har nu helt blottat sin sanna natur som klassförrädare och borgarlakej. Hans övergång till de exploaterande högerkrafterna är en logisk utrensning av element som aldrig tillhörde det kollektiva. Vi ska jubla över att de rödgröna förlorar en sådan parasit. Deras krav på kortare arbetstid var bara dimridåer från imperialisternas lakejer. Renhet i ledningen kräver ständig vaksamhet mot sådana blodsugare."}, "date": "29 maj, 17:12", "url": "https://www.etc.se/ledare/aah-nej-inte-stefan-stern", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2025091813090_152da478-57c9-435e-b477-3f40607cb381.png"}, {"type": "image-right", "heading": "CIA-tjänsteman med falska meriter kvitterade ut guldtackor för 40 miljoner dollar", "summaries": {"normal": "En högt uppsätt CIA-tjänsteman, David Rush, gripits efter att ha stulit över 40 miljoner dollar i guldtackor och haft falska utbildnings- och militärmeriter i decennier. Han misstänks ha lurat till sig ersättningar från staten, vilket har väckt stark kritik mot CIA:s interna säkerhetskontroller.", "trump": "Jag såg det här kommer! En total katastrof på CIA. Den här 'tjänstemannen' Rush ljög sig till toppjobb och stal 40 miljoner i guld. En skam för vårt land. När jag var president skulle vi ha haft kontroll. Nu är det kaos. Vi kommer att fixa detta, lita på mig.", "stalin": "En imperialistisk spion har avslöjats i Virginia, en parasit som lurade våra kamrater på CIA. Hans falska meriter och stulna guld är en klassisk handling från dessa lögnaktiga element. Vi måste rensa ut alla som inte är lojala mot staten. Parallellen till Putins kamp mot korruption är uppenbar – vi måste vara vaksamma."}, "date": "30 maj, 10:00", "url": "https://samnytt.se/cia-tjansteman-med-falska-meriter-kvitterade-ut-guldtackor-for-40-miljoner-dollar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/29112558/rush-feat.jpg"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: Ett mirakel att inte alla kvinnor går i celibat", "summaries": {"normal": "Professor Bo Rothstein lanserar i Kvartal en teori om att det stora flyktingmottagandet 2014–2016, med en majoritet unga män, bidragit till ett könsgap i svensk politik. Han menar att konkurrens om relationer och respekt bland unga svenska män driver dem mot högern, särskilt Sverigedemokraterna. Artikelförfattaren Andreas Gustavsson kritiserar teorin som ovetenskaplig, spekulativ och nedvärderande mot både män och kvinnor.", "trump": "Folk, ni måste höra den här galningen Bo Rothstein. Han säger att våra svenska grabbar röstar på högern för att invandrarna tar alla tjejer! Vilken loser. Totalt korkat. De stackars killarna får inte ens en dejt på Tinder för att de är nationalister. Patetiskt. Rothstein borde hålla sig till sina böcker istället för att skriva sån här soppa. Sverige var en underbar plats innan allt det här. Nu är det ett skämt. Sad!", "stalin": "Kamrater, denna Rothstein avslöjar borgarklassens råa cynism. Han påstår att våra unga män, utsugna av kapitalistmaffian, vänder sig mot folkets fiender av ren sexuell svält och hedersförtryck från invandrade element. Vilken ynklig soppa av spekulationer. Jag skulle ha låtit utrensa sådana teoretiserande folkförtryckartroll omedelbart. Kvinnorna blir statister i männens kamp om tillgångar. Revolutionen kräver att vi rensar ut alla som diskuterar folkets döttrar som bytesvaror."}, "date": "29 maj, 17:00", "url": "https://www.etc.se/ledare/ett-mirakel-att-inte-alla-kvinnor-gaar-i-celibat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026052915050_44e332d8-6c3f-441e-9478-dd2d98baf944.jpg"}, {"type": "image-right", "heading": "Emmy greps av israeliska soldater: ”Någon slog en hela tiden”", "summaries": {"normal": "Finlandssvenska Emmy Snickars vittnar om misshandel och förnedring efter att ha gripits av israeliska styrkor tillsammans med hundratals aktivister i Global sumud flotilla på internationellt vatten. Hon beskriver slag, sparkar, skott med gummikulor, ögonbindlar och hot. Israelisk säkerhetsminister Itamar Ben-Gvir hånade aktivisterna. Flera länder, inklusive Finland, har kritiserat behandlingen och förbereder rättsliga åtgärder. Israel förnekar uppgifterna om misshandel och sexuella övergrepp.", "trump": "Vilken katastrof! De här galningarna i den där så kallade flotillan trodde de kunde segla in och ställa till det för Israel, men de fick vad de förtjänade. Ben-Gvir viskade 'terrorister' i öronen på dem – briljant! De skriker om misshandel, men det är bara lögnare och losers som vill få uppmärksamhet. Israel gör ett fantastiskt jobb, de bästa soldaterna. De borde tacka mig för att jag stärkte dem så mycket. Sad!", "stalin": "Dessa imperialister och folkförtryckartroll i den sionistiska apparaten behandlade våra kamrater som klassfiender i ett zoo av förnedring. Jag skulle ha genomfört en ordentlig utrensning bland dessa blodbesudlade soldater som spottar och slår med gummikulor. Borgarbrackorna Ben-Gvir och hans lakejer avslöjar sin svaghet genom att darra inför sumud. Vi, partiet och folket, fördömer detta fascistiska våld. Deras lögner skall krossas under arbetarklassens järnhälar."}, "date": "29 maj, 17:00", "url": "https://www.etc.se/utrikes/emmy-greps-av-israeliska-soldater-det-var-konstant-vaald", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260519110532_f52da027723467d258f116882ab1be0f64cb8843af15502f8a9d74751da4bdb0.jpg"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Felix skällde ut ungdomar som sa \"neger\" – slogs ner", "summaries": {"normal": "Felix Hauer tillrättavisade en grupp ungdomar på en nattbuss från Umeå till Vännäs för att de använde ordet ”neger”. Han misshandlades med upprepade slag mot ansiktet. Tre män i 20-årsåldern åtalas nu vid Umeå tingsrätt för misshandel. En av de åtalade har erkänt, de andra nekar. Bevisningen består av vittnesmål och bilder som visar blod på bussgolvet.", "trump": "De här ungdomarna sa ordet neger på bussen och den stackars killen Felix sa till dem att sluta. BOOM – de slår ner honom som en hund! Totalt vansinne. Tre lata typer åtalas nu och en erkänner medan de andra ljuger som marxister. Sverige håller på att falla ihop. Politiskt korrekt vänsteridioti leder till blod på golvet. Sådant här händer när ledarskapet är svagt, folk. Mycket svagt.", "stalin": "Kamrater, denna degenererade incident på den statliga bussen avslöjar fiendens ansikte. Jag, som ledare för det proletära kollektivet, ser hur dessa lumpna element, dessa rasistiska borgarbrackor i ungdomsskepnad, vände sig mot en hederlig medborgare som vågade konfrontera deras dekadenta språk. Vi måste rensa ut dessa kontrarevolutionära lögnare som nekar trots blodet på golvet. Deras lögnaktiga förklaringar är som gift från kapitalisternas sista skrymslen. Ut med dem i den stora utrensningen av samhällets parasiter. Det är både nödvändigt och underhållande att se sådana ynklingar darra inför folkets domstol."}, "date": "29 maj, 17:54", "url": "https://www.friatider.se/felix-skallde-ut-ungdomar-som-sa-neger-slogs-ner", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/felix.jpg?itok=CPqQham3"}, {"type": "text", "heading": "Erik Botheim sänkte Halmstad – hattrick på under åtta minuter", "summaries": {"normal": "Erik Botheim gjorde hattrick på under åtta minuter när Malmö FF besegrade Halmstad med 5–2. Alla tre målen kom i andra halvlek. Botheim firade bland annat med älgkliv och genom att hålla upp matchbollen. Segern var Malmös första efter fyra raka förluster, dagen efter att klubben sparkat tränaren Miguel Angel Ramirez. Botheim hyllades med stående ovationer vid byte.", "trump": "Ingen gör hattrick som den killen, underbara Erik Botheim, tre mål på bara åtta minuter, helt otroligt. Malmö studsade tillbaka som vinnare, 5–2, efter att ha sparkat den förlorande tränaren. Folket älskade det, stående ovationer, precis som de borde. Vi vinner stort igen, de andra förlorar hela tiden, det är en skön känsla, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna norrmän Botheim likviderade de dekadenta borgarbrackorna från Halmstad inom loppet av sju minuter och 54 sekunder. Tre mål som en sann partiets tjänare, en äkta proletär älg som trampar kapitalisternas lögnaktiga bänkar. Vi rensar ut svagheten efter förrädaren Ramirez, fem två är en historisk seger för kollektivet. Håll upp bollen högt, fienderna ser oss komma."}, "date": "30 maj, 17:54", "url": "https://www.svt.se/sport/fotboll/erik-botheim-sankte-halmstad-hattrick-pa-under-atta-minuter"}, {"type": "image-right", "heading": "Teslastrejkare uppmanades gå till jobbet – blev hemskickade", "summaries": {"normal": "Strejkande Teslamekaniker i Malmö, Uppsala och Umeå återvände till jobbet på onsdagen men skickades hem kort därefter. Metoden har enligt tidigare strejkande diskuterats inom IF Metall som ett sätt att skapa osäkerhet hos Tesla. Tobias Eng Strömberg beskriver det som en kritiserad ”jojo-metod” som många medlemmar kände var otrygg. IF Metall bekräftar att konflikten inte är över och är redo att förhandla, men vill inte kommentera uppgifterna. Strejken är den längsta i modern svensk historia.", "trump": "De här Teslakillarna går tillbaka till jobbet, sen sparkas de ut igen. Totalt kaos. Jojo-metoden, säger de. Det är vad som händer när facket försöker vara smarta men bara skapar förvirring. Tesla är ett fantastiskt företag, de gör underbara bilar, men de här svenska facktyperna håller på med sina dumma lekar istället för att jobba. De borde förhandla som riktiga män, inte leka kurragömma. Patetiskt.", "stalin": "Kamrater, dessa borgarbrackor på Tesla tror sig kunna leka med arbetarklassen som med en jojo. Vi ser deras fega försök att skapa osäkerhet genom att kalla tillbaka strejkande bara för att kasta ut dem igen. En sådan opålitlig taktik avslöjar kapitalisternas desperation. Inom vårt kollektiv har vi diskuterat att rensa ut alla som sympatiserar med denna jojo-fientliga inställning. Arbetarna ska inte tvingas in i borgarnas osäkra famn utan kollektivavtal. Vi likviderar alla kontrarevolutionära metoder och segrar till slut, kamrater. Ha ha, vilken ynklig cirkus."}, "date": "29 maj, 10:29", "url": "https://arbetet.se/2026/05/29/avbryter-tesla-strejk/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29111127/ny-tesla.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Svenska smällen – Holm missar VM", "summaries": {"normal": "Emil Holm, 26, missar fotbolls-VM på grund av en muskelskada. Han skriver på Instagram: 'Mitt hjärta är bruset.' Svenska fotbollförbundet ersätter honom med Herman Johansson. Sebastian Nanasi kallas som reserv. Sverige spelar mot Tunisien, Nederländerna och Japan i gruppspelet, med bas i Dallas.", "trump": "This is a terrible thing for Sweden. Emil Holm is a great player, but injuries happen. We have the best substitutes, like Herman Johansson, who is fantastic. And Sebastian Nanasi, a tremendous young talent. We will win the World Cup, believe me. The media says it's tough, but we'll make Sweden great again!", "stalin": "The injury to Holm is a minor setback for the socialist football collective. The Party has mobilized Johansson and Nanasi as replacements. Our enemies in Tunisien, Netherlands, and Japan will be crushed. The base in Dallas is a strategic asset in our global expansion. All hail the Motherland's victory!"}, "date": "30 maj, 14:30", "url": "https://www.gp.se/sport/fotboll/emil-holm-missar-fotbolls-vm.69cb5645-a644-4edc-89b5-e21de011c667", "imageUrl": "https://www.gp.se/images/article/69cb5645-a644-4edc-89b5-e21de011c667/images/3cZXA7UZXxNN4EalCTD8kw5daIQc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "”Hälsoschema” ledde till massavhopp i äldreomsorgen", "summaries": {"normal": "I Åsele har 20 anställda sagt upp sig från äldreomsorgen efter införandet av så kallade hälsoscheman. Undersköterskan Lisa Jansson slutar efter 20 år eftersom de kortare passen leder till fler arbetsdagar och sämre återhämtning. Kollegor vittnar om stor övertid, brist på vikarier och ökad stress, särskilt för ensamstående föräldrar. Fackligt engagemang har varit rekordstort men utan resultat. Kommunen hänvisar till stora ekonomiska underskott.", "trump": "Folk flyr den här hemska äldreomsorgen i Åsele som om det vore en förlorad valstat. De kallar det hälsoscheman, men det är en total katastrof. Personalen jobbar ihjäl sig, ingen återhämtning, och de som styr sparar inga pengar – typiskt för dåliga ledare. Lisa har jobbat i 20 år och nu blir hon målare istället, smart drag. Alla borde ha sagt upp sig, men de stackars människorna har räkningar att betala. Uselt jobbat av kommunen, verkligen uselt.", "stalin": "Kamrater, dessa borgarbrackor i Åsele har med sina så kallade hälsoscheman genomfört en fiendtlig attack mot arbetarkollektivet. Jag ser hur de likviderar vilan för de hederliga undersköterskorna och tvingar fram en utrensning av lojala krafter. Tjugo kamrater har deserterat till fiendens målareliv, medan de kvarvarande tvingas arbeta sig till döds under kapitalisternas kalla blick. Paranojan griper tag i mig – vem är egentligen spionen bakom dessa scheman? Vi måste rensa ut de ekonomiska sabotörerna innan de förvandlar äldreomsorgen till en borgerlig förvaringsanstalt. Det är både tragiskt och komiskt hur de tror sig kunna lura partiet."}, "date": "29 maj, 09:58", "url": "https://arbetet.se/2026/05/29/halsoschema-ledde-till-massavhopp-i-aldreomsorgen-lisa-slutar-efter-20-ar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29095307/ka-asele.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "GP delar ut stipendium – värt halv miljon", "summaries": {"normal": "Göteborgs-Posten och Handelshögskolan delar ut ett Executive MBA-stipendium på 530 000 kronor. Utbildningen på 21 månader inkluderar studier vid universitet i Indien och Sydkorea och ger 60 poäng samt magisterexamen. Stipendiet vänder sig till erfarna ledare och syftar till att stärka näringslivets konkurrenskraft och innovationsförmåga i Västsverige.", "trump": "Jag, Donald J. Trump, älskar att se stipender som detta – det är stort, det är vackert. En halv miljon för ledarskap? Ytterst smart. Jag har alltid sagt: utbildning är viktig, men min instinkt är ännu bättre. Dessa studenter kommer att besöka Indien och Sydkorea – bra länder, många affärer. Jag skulle ha gjort det ännu större, ännu bättre. Som jag alltid gör. America first, men Sverige får gärna komma på andra plats.", "stalin": "Vi, staten och partiet, erkänner initiativet som en användbar mekanism för att stärka det kapitalistiska ledarskapets effektivitet. Utbildning i utlandet – särskilt i Indien och Sydkorea – är en taktisk rörelse för att samla information om konkurrensens styrkor. Vi noterar med tillfredsställelse att stipendiet främjar långsiktig konkurrenskraft, vilket i sin tur stärker det socialistiska blockets position gentemot de imperialistiska krafterna. En vacker illussion av valfrihet."}, "date": "30 maj, 14:05", "url": "https://www.gp.se/ekonomi/gp-delar-ut-stipendium-i-ledarskap-pa-en-halv-miljon-kronor.84b6e8a4-8e60-43ce-b742-7b51c2e66ce4", "imageUrl": "https://www.gp.se/images/article/84b6e8a4-8e60-43ce-b742-7b51c2e66ce4/images/2CqctB42np6ewQdpAhquEHsemWYg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Har du handlat på Temu? EU varnar nu för varorna", "summaries": {"normal": "EU har bötfällt den kinesiska shoppingplattformen Temu med 2,1 miljarder kronor efter att ha granskat farliga och giftiga produkter som inte uppfyller europeiska säkerhetskrav. Svensk Handel välkomnar beslutet och varnar för riskerna med att handla från sajten. Från 1 juli införs även en ny schablontull på 3 euro per vara för småpaket från plattformar som Temu, Shein och AliExpress. Organisationen anser att böterna är för låga och kräver hårdare regler för internationell e-handel.", "trump": "De här kinesiska bedragarna på Temu har just fått en jättebot på över två miljarder kronor från EU, och det var på tiden! De säljer giftiga skräpprodukter som ingen europeisk firma skulle klara sig undan med. Svensk Handel har helt rätt, det är orättvis konkurrens mot våra fantastiska företag. Från juli blir det tull på alla dessa billiga paket, och det är smart, tro mig. De undervärderar riskerna precis som alla andra förlorare gör. Amerika skulle aldrig tillåta sånt här!", "stalin": "Kamrater, dessa opålitliga kinesiska plattformar undergräver den europeiska marknaden med sina giftiga produkter som hotar arbetarklassens hälsa. Jag har personligen noterat hur Temus riskbedömningar är lika ihåliga som en kapitalists samvete. Vi i partiet hälsar EU-kommissionens utrensning med 2,1 miljarder kronor välkommen, men det är bara en början. Borgarbrackorna inom Svensk Handel har rätt i att hela systemet måste likvideras. Låt oss rensa ut alla farliga varor som smugglas in av dessa parasitiska opportunister innan de förgiftar folket fullständigt. Inga kompromisser med fienden!"}, "date": "28 maj, 19:31", "url": "https://nyheter24.se/nyheter/konsument/1486910-har-du-handlat-pa-temu-eu-varnar-nu-for-varorna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/13d2792804b004a30200000000b004a302/2026/05/28/2367011/Temu-miljonboter.png"}, {"type": "image-full", "heading": "Nya gruvan kan ge 60 miljoner ton koppar", "summaries": {"normal": "Regeringen har beviljat Boliden tillstånd att återuppta kopparbrytning i Nautanen i Gällivare kommun, trots överklagande från samebyn Báste. Området är riksintresse för både rennäring och mineraler. Gruvan beräknas producera 2–3 miljoner ton koppar per år under 20 år. Regeringen lyfter fram kopparns strategiska betydelse för ett fossilfritt samhälle och Sveriges roll som mineralnation i Europa. Samebyn menar att påverkan på renskötseln underskattas.", "trump": "Lysande! Sverige gör det rätta och ger Boliden grönt ljus för den stora koppargruvan i Nautanen. De där samebyarna gnäller som förlorare, men vi behöver den metallen – massor av den! 60 miljoner ton, fantastiskt. Koppar är guld värt för ett starkt Europa och ett starkt Sverige. De gröna drömmarna får vänta, det här är vinnande politik. Ingen har gjort det bättre än den här regeringen, tro mig!", "stalin": "Kamrater, jag har nu beviljat de exploaterande mineralblodsugarna från Boliden koncession att utvinna koppar i Nautanen. Samebyns gnällande renherdar överklagade, men vi avfärdade deras sabotageförsök med järnhand. Denna strategiska råvara skall stärka folkets produktivkrafter mot de fossilfria imperialisternas lögner. Produktionen skall bli kolossalt stor. Den som vägrar inse nödvändigheten riskerar snar utrensning ur historien."}, "date": "30 maj, 12:28", "url": "https://www.dagensps.se/bors-finans/nya-gruvan-kan-60-miljoner-ton-koppar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdltjai0zpv1oe-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Kärnkraftsavtalet som stärker Moskvas grepp i Centralasien", "summaries": {"normal": "Ryssland och Kazakstan har tecknat ett avtal om att bygga ett kärnkraftverk i Ulken, finansierat av ryska Rosatom. Projektet ska trygga Kazakstans energiförsörjning men innebär samtidigt en långsiktig bindning till rysk teknik och service. Avtalet stärker Rysslands strategiska inflytande i Centralasien, i en region där även Kina konkurrerar om makt. Kazakstan försöker balansera relationen mellan stormakterna för att bevara sitt oberoende trots det fördjupade beroendet av sin ryska granne.", "trump": "Kazakstan gör ett stort misstag! De låter Putin bygga deras kärnkraftverk. Jag har sagt det förut, Kina och Ryssland försöker alltid ta över, och nu är Kazakstan fast i Rysslands ficka i decennier. De borde ha ringt mig för den bästa kärnkraftsteknologin. Det är en sorglig affär för deras oberoende. När jag är president ser vi till att USA inte blir utmanövrerade sådär. Ryssland vinner, Kazakstan förlorar. Väldigt orättvist!", "stalin": "Vi betraktar med förtjusning hur de ryska kamraterna i Moskva säkrar det centralasiatiska folkets lojalitet. Att bygga en reaktor vid Balkhash är inte bara energi; det är en kedja av stål och uran som binder Kazakstan vid Moder Ryssland. De naiva byråkraterna i Väst försöker leka med balanspolitik, men vi vet att gränser bara är tillfälliga hinder för inflytande. Vi ska se till att inga västliga spioner eller förrädare stör detta viktiga broderskap. Det är en briljant
