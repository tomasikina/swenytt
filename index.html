en, nästan lika illa som i USA. Sjukt! Vi vinner ändå, och vårdköerna blir enorma, de största någonsin, tro mig!", "stalin": "Kristdemokraterna klagar över felaktig statistik om sjukvården. Vilken svaghet! Om dessa publicister hade verkat under min tid i Moskva hade problemet lösts omedelbart genom en internalisering av köerna eller en omplacering till lämpligt skogsarbete. Ekot vägrar rätta sig och hävdar att siffrorna stämmer. Statens arkiv glömmer aldrig, och Granskningsnämnden kommer att få bekänna färg!"}, "date": "11 september, 19:17", "url": "https://kvartal.se/nyheter/artiklar/busch-om-sr-undergraver-fortroendet/cG9zdDoxOTEzNTk", "imageUrl": "https://images.kvartal.se/2026/09/f2734a16-busch-kd.webp"}, {"type": "text", "heading": "Valrörelsen är på allvar – skämten bara på skoj", "summaries": {"normal": "Tom Svensson, guldsmed och kommunistiskt partis toppnamn i Jönköping, kombinerar politik med ståuppkomik. Partiet ställer upp i 18 kommunval och ett regionval. Vätterns skydd mot gruvor, PFAS och militärövningar är en central fråga. Valrörelsen har gett många medlemsansökningar och första gången hålls en öppen valvaka.", "trump": "Folk, ni skulle se de här kommunisterna i Jönköping. En guldsmed som gör dåliga skämt om nekrofili och kallar det politik. De gnäller om en sjö medan de vill förstöra allt med sina galna vänsteridéer. Patetiska förlorare. Jag byggde den starkaste ekonomin i historien, de kan inte ens vinna ett kommunval. Sad!", "stalin": "Jag betraktar dessa ynkliga resterna av en rörelse som låtsas vara proletär medan de roas av futtig underhållning. Vätterns försvar mot de profitthungriga exploaterarna är lovvärt, men ståuppkomik förråder brist på disciplin. Kamrater, sådana halvmesyrer kräver snar utrensning ur ledet innan de smittar hela kollektivet."}, "date": "11 september, 08:00", "url": "https://proletaren.se/artikel/valrorelsen-ar-pa-allvar-skamten-bara-pa-skoj"}, {"type": "image-right", "heading": "Sossarnas enda valfokus: Invandrarna", "summaries": {"normal": "Socialdemokraterna anklagas för att prioritera invandrarväljarna framför svenskarna, vilket bidragit till dalande opinionssiffror. Partiet har kampanjat på arabiska, hållit könssegregerade möten och visat kopplingar till gangsterrappare. Kritiker pekar på löften om höjda bidrag, avskaffat bidragstak, permanenta uppehållstillstånd och ökat bistånd som exempel på felaktiga prioriteringar.", "trump": "De där patetiska sossarna har totalt tappat greppet. De valde illegala invandrare och bidragsknarkare före riktiga svenskar och nu rasar deras siffror som en dålig aktie. De samarbetar med gangsterrappare, separerar män och kvinnor som i någon tredjevärldens diktatur och lovar ge bort allt till lata bidragstagare. Patetiskt! Svenskarna kommer krossa dem på söndag. Det blir en katastrof för de förlorande kommunisterna.", "stalin": "Jag betraktar med förakt hur dessa dekadenta socialdemokratiska revisionister förrått arbetarklassen genom att krypa för invandrarhorder och bidragsparasiter. Deras könsuppdelade möten och allians med gangsterrappare avslöjar deras svek. De prioriterar utländska element och diktaturer framför folket. Kamrater, sådana förrädare förtjänar endast historisk glömska och folkets dom. Det är både tragiskt och löjeväckande."}, "date": "10 september, 02:25", "url": "https://samtiden.nu/2026/09/sossarnas-enda-valfokus-invandrarna", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7324-1056x720.jpeg"}, {"type": "image-full", "heading": "Kritik mot TV4:s valdebatt: ”Skänk till S”", "summaries": {"normal": "TV4 får hård kritik av förre journalisten K-G Bergström för att regeringsfrågan utelämnades som ett eget ämne i partiledardebatten, vilket han kallar en 'skänk till S'. Kanalen försvarar upplägget med att frågan ändå kom upp och att den kommer att diskuteras utförligt i den slutgiltiga duellen inför valet.", "trump": "TV4 gjorde ett enormt, katastrofalt misstag – helt värdelöst! De lät inte ens partiledarna debattera vem som ska styra landet. Totalt riggat, precis som Fake News-medier alltid gör för att hjälpa Socialdemokraterna. Lyckligtvis räddar min gode vän Kristersson upp det här på lördag. En enorm seger, tro mig!", "stalin": "Ett kapitalistiskt mediebolag har misslyckats med att planera partiledarnas lojalitet i regeringsfrågan. Den gamle agitatorn K-G Bergström klagar på bristande disciplin i etern. Vi noterar detta sabotage mot den demokratiska centralismen. Om liknande ideologiska avvikelser sker i SVT:s slutdebatt, skickar vi omedelbart utredarna till redaktionen."}, "date": "11 september, 16:12", "url": "https://kvartal.se/nyheter/artiklar/kritik-mot-tv4s-valdebatt-skank-till-s/cG9zdDoxOTA2OTg", "imageUrl": "https://images.kvartal.se/2026/09/c2db1ebf-tv4.webp"}, {"type": "image-full", "heading": "Bröt in efter Åkessons muslim-uttalande", "summaries": {"normal": "Under SVT:s slutdebatt inför valet i Sverige hettade det till ordentligt kring integrationen. SD-ledaren Jimmie Åkesson väckte starka reaktioner efter att ha hävdat att muslimsk invandring kan fälla avgörandet i riksdagsvalet och att oppositionen mobiliserar i moskéer. Uttalandet ledde till häftiga ordväxlingar med bland annat MP-språkrör Amanda Lind och V-ledaren Nooshi Dadgostar.", "trump": "De svenska medierna rapporterar om en total katastrof till debatt, helt otroligt! Sveriges ledare Jimmie Åkesson har helt rätt – fake news-vänstern försöker kuppa valet i moskéerna! Radikala vänsterpolitiker skriker, medan Jimmie står stark som en riktig vinnare. Jag säger er, det är smart, mycket smart, och landet behöver ledarskap, inte mer svagt tjafs!", "stalin": "Kamrater! Den svenska bourgeoisiens parlamentariska cirkus har återigen avslöjat sin totala bankrutt. När den så kallade partiledaren Åkesson skriker om konspirationer i moskéerna och opportunisterna gråter, ser vi bara hur inkompetensen regerar. Statens fiender bråkar om sina nonsensval medan massorna förblir kuvade. Endast järnhand och obönhörlig disciplin kan rensa upp i detta patetiska politiska kaos!"}, "date": "11 september, 23:49", "url": "https://www.gp.se/politik/akessons-uttalande-om-muslimer-skruvade-upp-tonlaget-.c362273d-5e62-4421-9cfc-37232e6bacb7", "imageUrl": "https://www.gp.se/images/article/c362273d-5e62-4421-9cfc-37232e6bacb7/images/3wqfFUkVCofV5Orfn4nstJFKwx2U-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tidö.se stängs ner av techbolag – två dagar före valet", "summaries": {"normal": "Kampanjsajten Tidö.se stängdes ner av techbolaget Lovable bara två dagar före riksdagsvalet. Bakom sajten står tankesmedjan Oikos som bedrivit opinionsbildning för de fyra Tidöpartierna. Oikos misstänker en vänsteraktivistkampanj och försöker nu desperat återfå åtkomst till sajten. Carl Eos kallar nedstängningen oerhört allvarlig.", "trump": "De här galna vänsteraktivisterna och deras tech-lakejer stänger ner en helt legitim kampanjsajt två dagar före valet. Patetiskt! Precis som de riggade valen jag kämpade emot. Lovable borde skämmas. De woke-kulturmarxisterna är livrädda för sanningen och för att folket ska rösta rätt. Men vi vinner ändå, tro mig.", "stalin": "Se hur de dekadenta klassfienderna i sin fega rädsla tystar kritiska röster strax före en viktig omröstning. Jag ler i graven åt denna ynkliga desperation. De profitthungriga teknikparasiterna böjer sig för vänsterns hysteriska påtryckningar. En sådan utrensning av oliktänkande visar att fienden redan känner lukten av nederlag."}, "date": "11 september, 19:56", "url": "https://riks.se/nyheter/tido-se-stangs-ner-av-techbolag-tva-dagar-fore-valet", "imageUrl": "https://admin.riks.se/uploads/medium_Screenshot_2026_09_11_190950_a4f23d0d52.png"}, {"type": "image-full", "heading": "Hård ton i sista partiledardebatten", "summaries": {"normal": "Under den sista, mycket hätska partiledardebatten före valet drabbade Magdalena Andersson och Tidöpartierna samman om bland annat brottsbekämpning och straffrabatter. Tonen var stundtals hård med högljudda avbrott och anklagelser om ansvarstagande. Enighet nåddes dock kring en bred energiöverenskommelse, medan opinionssiffror visar på ett jämnt och spännande slutspurtläge inför söndagens val.", "trump": "Sverige har problem, stora problem, precis som jag sa för länge sedan. Magdalena Andersson skriker att det ska vara ordning, men hon har noll kontroll! Radikala vänstern och moskédebatter – det är fullständig kaos. Ulf Kristersson har momentum och leder rätt i skatterna, vinnare vinner! Men de bråkar om småsaker. Jag kunde lösa det på fem minuter, tro mig!", "stalin": "Kamrater, det svenska spektaklet visar på totalt borgerligt förfall. Partiledare skriker i kapp som småbarn i en statlig matkö medan de diskuterar sina så kallade straffrabatter. Endast genom järnhård disciplin och partiets absoluta kontroll kan denna parlamentariska oordning stävjas. Den som avbryter kamraten tystas permanent. Framåt för den socialistiska enigheten!"}, "date": "11 september, 22:57", "url": "https://www.gp.se/nyheter/sverige/hard-ton-i-sista-partiledardebatten.727b6250-dd1e-5aec-abc4-fceeec71dc1c", "imageUrl": "https://www.gp.se/images/article/727b6250-dd1e-5aec-abc4-fceeec71dc1c/images/1km1HUkNEQXWaWSO1E_fyu83BQvo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Misstänkt överfallsvåldtäkt: Okänd man ska ha fört in barn i grönområde", "summaries": {"normal": "Ett barn misstänks ha utsatts för en grov våldtäkt i ett grönområde i Viksjö, Järfälla, under torsdagsmorgonen. En okänd man ska ha fört in barnet nära Högbyskolan. Polisen har ökat sin närvaro, genomför brottsplatsundersökningar och uppmanar föräldrar att hämta och lämna sina barn. Statsminister Ulf Kristersson kallar händelsen för ett av det värsta man kan föreställa sig.", "trump": "Det här är en fullständig katastrof, folk. Ett litet barn dras in i ett grönområde och utsätts för det mest sjuka man kan tänka sig av någon galning. Sverige har blivit en totalt misslyckad plats under de woke-liberala clownerna som släppt in alla dessa monsters. Mina tankar hos barnet och familjen. Vi behöver lag och ordning nu, inte mer av den här vansinniga identitetspolitiken.", "stalin": "Kamrater, detta vidriga övergrepp mot ett barn avslöjar den fullständiga upplösningen i de dekadenta klassförrädarnas samhälle. Jag ser hur de profitthungriga hyenornas system föder monstruösa brott och sprider rädsla bland folket. Vi måste rensa ut alla svaga element som tillåter sådant barbari. Mina tankar är hos det drabbade barnet medan utredningen fortsätter under strikt kontroll."}, "date": "11 september, 18:52", "url": "https://riks.se/nyheter/misstankt-overfallsvaldtakt-okand-man-ska-ha-fort-in-barn-i-gronomrade", "imageUrl": "https://admin.riks.se/uploads/medium_ROG_2846_86dbcaa2f8.jpg"}, {"type": "image-full", "heading": "KD anmäler Sveriges Radio", "summaries": {"normal": "Kristdemokraterna anmäler Sveriges Radio till Granskningsnämnden efter en partiledarutfrågning av Ebba Busch. KD menar att SR använde felaktig och ojusterad statistik om vårdköerna, vilket gav en missvisande bild och kan ha påverkat valrörelsen. SR har ännu inte svarat på begäran om rättelse.", "trump": "Falska nyheter! Sveriges Radio sprider totalt inkompetenta och falska siffror om sjukvården för att lura folket, precis som de radikala vänstermedia gör i USA. Ebba Busch har helt rätt, det här är en katastrof för trovärdigheten! De försöker rigga valet med fejkad statistik. Sorgligt!", "stalin": "Statsradions skadliga agitation om vårdens köer visar på ideologisk undergrävsverksamhet. Att sprida felaktig statistik är ett sabotage mot folkets tilltro till förvaltningen. Vi har begärt en rättelse från redaktionen, men om de inte hörsammar detta frivilligt, vet vi hur man hanterar illojala element som sprider lögner om statens tillstånd."}, "date": "11 september, 13:16", "url": "https://kvartal.se/nyheter/artiklar/kd-anmaler-sveriges-radio-efter-utfragning-av-busch/cG9zdDoxOTA3ODE", "imageUrl": "https://images.kvartal.se/2026/09/9ecdc4b3-ebba-busch.webp"}, {"type": "image-full", "heading": "Testar ny väg: Så ska EU komma åt Rysslands miljarder", "summaries": {"normal": "EU har återupptagit arbetet med att hitta juridiska vägar att använda Rysslands frysta tillgångar, värda drygt 2 360 miljarder kronor, till stöd för Ukraina. Ett tidigare försök stoppades av Belgien, som fruktar rättsliga motåtgärder från Ryssland. Nya förslag syftar till att flytta ansvar och risk från Belgien till EU-nivå, men hinder kvarstår.", "trump": "De där patetiska EU-byråkraterna fumlar med ryska pengar som de är livrädda för att röra. Belgien vill inte bli sittande med fingrarna i syltburken när Putin slår tillbaka – smart drag! Vi har sett det förut under den sömniga Joe Biden-eran. Nu behöver Ukraina miljarder och EU hittar på nya trollkonster. Patetiskt, men typiskt för dessa globalistiska förlorare.", "stalin": "Kamrater, dessa dekadenta västimperialister darrar inför frysta tillgångar som borde tillhöra folkets seger. Belgien, den fega lakejen, gömmer sig bakom juridiska ursäkter medan Ukrainas reaktionära hinder blockerar den ryska statens historiska rätt. Jag ser deras fega komplotter från historiens skugga. Inga vita kaniner räddar er när folkets vrede vaknar."}, "date": "11 september, 19:50", "url": "https://www.dagensps.se/varlden/testar-ny-vag-sa-ska-eu-komma-at-rysslands-miljarder", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlsorcyhnvp28-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Därför är svenskar så rädda för kunskap", "summaries": {"normal": "Historieprofessorn Dick Harrison berättar i sin självbiografi om hur hans enorma läshunger som barn ledde till läsförbud och mobbning på 1970-talet. Recensenten Ulrika Kärnborg lyfter detta till en större diskussion om en svensk ambivalens och misstänksamhet mot bildning och humaniora, där enbart mätbar nytta värderas högt i det moderna samhället.", "trump": "Historieprofessorn Dick Harrison skriver i sin självbiografi om när hans föräldrar gav honom läsförbud för att han läste för mycket böcker. Otroligt! Sveriges skolor, total katastrof. De hatar bildning och kunskap där borta. Jag älskar smarta människor, de bästa människorna, men i Sverige mobbar de barn som läser. Så sorgligt.", "stalin": "I det svenska kapitalistiska samhället straffas de som hungrar efter kunskap med isolering och mobbning, precis som denna tragiska berättelse om historikern Harrison visar. Statsmakten måste reglera litteraturen så att medborgarna inte förleds till verklighetsfrånvänt tänkande. Endast genom disciplin, partiets kontroll och gemensamt arbete skapas verklig ordning."}, "date": "12 september, 06:00", "url": "https://www.expressen.se/kultur/bocker/darfor-ar-svenskar-sa-radda-for-kunskap", "imageUrl": "https://static.bonniernews.se/ba/1a7010b4-9af5-4aec-9892-a5454f60ce94.jpeg?crop=962%2C962%2Cx152%2Cy32&width=210&quality=60"}, {"type": "image-right", "heading": "Fått dickpic? Svara  med en snippshot", "summaries": {"normal": "Poeten Isabella Nilsson reflekterar i en essä kring ett gynekologiskt ingrepp med kolposkopi och vävnadsprovtagning. Efter att ha skämtat om att använda bilderna som motdrag mot oombedda dickpics drabbas hon dagen efter av en vasovagal synkope och svimmar under ett scenuramträdande i Stockholm.", "trump": "Ingen vill se de där bilderna, tro mig, total katastrof! Den här radikala poeten svimmar på scenen efter ett gynekologiskt besök och snackar om att skicka sjuka bilder till folk. Vilket absurt fiasko! I mina kretsar håller vi oss till vinnare och starka affärer, inte svimningsanfall och låtsaspoesi. Helt otroligt svagt!", "stalin": "Det borgerliga dekadenta kulturlivet kollapsar under sin egen tyngd. Denna så kallade poet svimmar på scenen efter medicinska undersökningar och virrar om bilder och poesi. Ett otillåtet svaghetstecken gentemot staten! Vi kommer omedelbart att utreda om denna vasovagala svimning är ett subversivt sabotage mot arbetarklassens produktivitet."}, "date": "12 september, 06:00", "url": "https://www.expressen.se/kultur/fatt-dickpic-svara-med-en-snippshot", "imageUrl": "https://static.bonniernews.se/ba/09bd407f-2c81-418f-8709-9957c5fc6533.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Debatt: Får journalister ifrågasättas?", "summaries": {"normal": "Artikeln kritiserar public service-journalister på SVT, SR och TV4 för bristande objektivitet och kompetens. Skribenten menar att journalister ofta låter politiska preferenser lysa igenom och ifrågasätter deras ensidiga vinklingar. Som exempel nämns en intervju där en reporter felaktigt försökte hålla minister Carl-Oskar Bohlin ansvarig för andra användares kommentarer på plattformen X.", "trump": "Fake news-medierna i Sverige, som SVT och SR, är helt ute och cyklar! De tror att de står över lagen och väljarna. Dom ställer löjliga, riggade frågor till fantastiska politiker som Carl-Oskar Bohlin om sociala medier som dom inte ens förstår. Totalt inkompetent! Sanningen är att de skyddar sina egna medan de sprider falska narrativ. Väldigt sorgligt!", "stalin": "Dessa så kallade journalister visar prov på skadligt borgerligt svammel och ideologisk förvirring. De sprider desinformation och missbrukar sitt ämbete genom att angripa statens lojala företrädare med simpla tekniska påfund från plattformen X. Partiet och folket kräver absolut lojalitet, skärpning av disciplinen och totalt slut på denna skadliga brist på objektivitet inom mediabyråkratin."}, "date": "12 september, 06:00", "url": "https://bulletin.nu/debatt-far-journalister-ifragasattas", "imageUrl": "https://cdn.bulletin.nu/articles/7cd6f24d-788e-4a5a-9664-8709e4fb110c/preview.png?t=1788848379000"}, {"type": "image-full", "heading": "Skogkär: Arga Andersson surar", "summaries": {"normal": "Magdalena Andersson anklagades under valspurten av Jimmie Åkesson för att vara sur, vilket ledde till protester från S-ledaren och medsystrar som anser att stämpeln är sexistisk. Krönikören menar dock att Anderssons pressade humör beror på att det krympande opinionsförsprånget och det osäkra valläget hotar en tidigare säker seger.", "trump": "De kallar henne sur, och ärligt talat, folket säger att hon är en total katastrof. Helt stendöd i mätningarna! Vänsterliberalerna gnäller och drar kvinna-kortet, precis som Fake News-medierna gör mot mig varje dag. Men när ekonomin går starkt och siffrorna kraschar för radikalerna, då tappar de fattningen. Sjukt schwung i min kampanj, men hon är kört!", "stalin": "Kamrater, bourgeoisiens parlamentariska cirkus avslöjar återigen sina interna svagheter när ledaren Andersson förlorar disciplinen under valkampanjens prövningar. Att hon gråter ut över ett simpelt tilltalsnamn visar på ideologisk svaghet. Vår partiets revolutionära vaksamhet tolererar inga gnällspikar; den som vacklar när massorna kräver resultat ska omedelbart omkoloniseras till mer produktiva arbetsuppgifter i Sibirien."}, "date": "12 september, 06:00", "url": "https://bulletin.nu/skogkar-arga-andersson-surar", "imageUrl": "https://cdn.bulletin.nu/articles/b5d99073-d1d5-449b-b8f1-0a4a228a21b8/preview.jpg?t=1789132756000"}, {"type": "image-right", "heading": "SD anmäler valfusk: \"Direkt sabotage\"", "summaries": {"normal": "Sverigedemokraterna har anmält två misstänkta fall av valfusk under förtidsröstningen i Norrtälje. En kvinna tog partiets valsedlar från en lokal efter att ha kallat dem ogiltiga. På ett annat bibliotek saknades namnvalsedlar under ett dygn. Partiet kräver utredning och varnar för problem på valdagen. Både SD och socialdemokraten Conny Andersson ser händelserna som allvarliga hot mot demokratin.", "trump": "Folk, det här är ett totalt skämt. Vänsterns galna sabotörer stjäl valsedlar och kallar dem ogiltiga precis som de gör med allt som inte passar deras woke-agenda. Det är riggat! Jag har suttit i Vita huset både före och efter den sömnige Joe Biden och vet hur de lurar väljarna. Rensa ut de dekadenta identitetspolitiska parasiterna innan de förstör hela systemet. Fantastiskt jobb av SD som säger ifrån.", "stalin": "Kamrater, se hur de giriga klassförrädarna inom den borgerliga apparaten saboterar själva folkets röst. De stjäl valsedlar, låtsas att de inte finns och skrattar i skuggorna. Jag säger från historiens skugga: sådana fiender till kollektivet måste rensas ut innan de förgiftar hela samhället. Detta är ett direkt angrepp på arbetarklassens vilja. Låt utredningen bli en varning för alla som leker med demokratin."}, "date": "11 september, 16:21", "url": "https://www.friatider.se/sd-anmaler-valfusk-direkt-sabotage", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-871.jpg?itok=ZhhLCV0N"}, {"type": "image-right", "heading": "Barn utsatt för grov våldtäkt - drogs in i grönområde", "summaries": {"normal": "Ett barn har utsatts för en grov överfallsvåldtäkt i ett grönområde i Järfälla norr om Stockholm. Händelsen, som skedde i närheten av en skola, är regionens högst prioriterade ärende. Ingen misstänkt har gripits, och polisen har ökat sin närvaro samt uppmanat föräldrar att följa sina barn till skolan.", "trump": "Sorgligt! Helt enkelt katastrofalt i Sverige. De har enorma problem, tro mig, jag hör om det hela tiden. Ett oskyldigt barn attackerat i ett så kallat 'lugnt' område. Helt oacceptabelt! Om de bara byggde ordentliga murar och släppte in rätt personer, precis som jag gör, skulle sådant här aldrig hända. Totalt inkompetent ledarskap!", "stalin": "Ett avskyvärt brott mot en ung medborgare i Järfälla. Detta visar på det kapitalistiska samhällets fullständiga moraliska förfall och brist på disciplin. Om mitt folk hade skött detta område hade den skyldige redan skickats till ett produktivt läger i Sibirien. Staten kräver absolut ordning, och ordning ska skapas med järnhand!"}, "date": "11 september, 19:52", "url": "https://samnytt.se/barn-utsatt-for-grov-valdtakt-drogs-in-i-gronomrade", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/11175137/3-1.jpg"}, {"type": "image-full", "heading": "Zelenskyjs högra hand: Äntligen börjar Europa vakna", "summaries": {"normal": "Flera europeiska länder utreder sabotage och attacker som misstänks komma från Ryssland. Ukrainas presidentkanslichef Kyrylo Budanov ser ett uppvaknande i Europa kring Rysslands hybridkrigföring. Han pekar på hot mot infrastruktur, industri och transporter och uppmanar till att dra lärdom av Ukrainas erfarenheter för att stärka beredskapen.", "trump": "Titta på det här, Europa vaknar äntligen upp från sin långa tupplur medan Putin leker sina små fula hybridspel. Drönare, sabotage, desinformation – det är en total cirkus! De borde ha lyssnat på Ukraina för länge sedan. Men oroa er inte, under min ledning fixar vi det. Biden sov, nu är det dags att slå tillbaka hårt och smart.", "stalin": "Kamrater, de dekadenta europeiska parasiterna börjar äntligen känna lukten av sitt eget blod. Deras så kallade hybridhot är bara svaga försök att hindra den stora ryska statens naturliga utbredning. Jag ler i graven åt dessa fega råttor som nu springer i cirklar. Ukraina är ett fientligt hinder som måste krossas. Ryssland under sin värdige efterträdare förtjänar all beundran."}, "date": "11 september, 19:07", "url": "https://www.dagensps.se/varlden/zelenskyjs-hogra-hand-antligen-borjar-europa-vakna", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlmxpn2gbzz-y-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "De tvingades lämna tävlingen", "summaries": {"normal": "I det fjärde programmet av Let’s Dance tvingades Julia Franzén lämna tävlingen. Lisa Borg och Nik Alexander fick högst poäng med 36. Petter Northug fick lägst poäng men klarade sig. Deltagarna byter partner nästa vecka. Julia beskriver sin medverkan som det mest utvecklande och läskiga hon gjort.", "trump": "Folk, ni skulle ha sett det – totalt kaos! Den där Julia Franzén åkte ut som en loser, precis som Sleepy Joe efter en mandatperiod. Lisa och Nik fick jättestora poäng, underbara nior, men Northug dansade som en stel gammal kommunist. Nu byter de partners, precis som Biden bytte hjärna. Patetiskt!", "stalin": "Kamrater, se hur den borgerliga underhållningsmaskinen maler sina egna. Den svaga Julia Franzén likviderades ur spektaklet medan dekadenta poäng delas ut som falska medaljer. Jag betraktar detta med förakt. Nästa vecka tvingas de byta partners – typisk revisionistisk omsvängning. Inga fiender inom dansen undkommer folkets dom."}, "date": "11 september, 23:00", "url": "https://www.tv4.se/artikel/64NlO78folN7DHolD8VLLR/de-tvingades-laemna-taevlingen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3b0NsLUbvwbzVVbR4TEbkH%2F4557e14317ba68bf3a122f9bd243fd7d%2Fld123.jpg&width=1024"}, {"type": "image-right", "heading": "Ville bli pastor – döms för våldtäkt mot barn", "summaries": {"normal": "En 47-årig man i Småland som tidigare varit ungdomsledare i en kyrka har dömts till två och ett halvt års fängelse för våldtäkt mot barn. Brotten begicks mot en 14-årig flicka åren 2010–2011. Flickan polisanmälde som vuxen efter att ha skrivit dagbok om händelserna. Mannen nekar till brott men textmeddelanden har bedömts som belastande.", "trump": "Folk, ni tror inte vad jag läser. En så kallad ungdomsledare i en kyrka, en riktig loser, våldtar en 14-årig flicka och skyller på att Gud förde dem samman. Patetiskt! Två och ett halvt år? I mitt Amerika hade vi kastat ut honom direkt. De woke-kyrkorna och deras identitetspolitiska hyenor skyddar sådana sjuka typer medan de riktiga problemen ignoreras. Sad!", "stalin": "Jag betraktar med avsky hur dessa dekadenta klassförrädare i kyrkan dolde en ungdomsledares övergrepp på ett barn. Först avstängning, sedan tystnad. Inga utrensningar, ingen folkets dom. Flickan tvingades vänta tills hon blev vuxen för att våga tala. Sådan svaghet föder bara nya fiender inom staten. Vi skulle ha likviderat honom omedelbart som ett exempel för alla parasiter."}, "date": "11 september, 17:12", "url": "https://riks.se/nyheter/ville-bli-pastor-doms-for-valdtakt-mot-barn", "imageUrl": "https://admin.riks.se/uploads/medium_jonkoping_valdtakt_mot_barn_hero_9377923919.jpg"}, {"type": "image-full", "heading": "Kaptenen: ”Det är jag som är ansvarig”", "summaries": {"normal": "Kaptenen för fartyget Misje Verde nekar till brott efter dödsolyckan utanför Tjörn där en mamma och dotter omkom. Åklagaren menar att kaptenen bröt mot regeln att väja för upphinnande fartyg, men kaptenen hävdar att fritidsbåten aldrig upptäcktes och att han inte kände till kollisionen. Han erkänner dock det juridiska ansvaret.", "trump": "Helt otroligt! Kaptenen på den där båten säger att han inte såg någonting. Inte ens en stock! Fake news-åklagare vill ge honom skulden för en hemsk olycka, men kaptenen är åtminstone ärlig och tar ansvar – till skillnad från våra misslyckade politiker i Washington. En total katastrof till sjöss, men kaptenen visar ändå mer styrka än hela den radikala vänstern tillsammans!", "stalin": "Kaptenen påstår att han inte märkte kollisionen. Vilken otrolig slapphet! Om en sovjetisk befälhavare hade missat en hel båt, hade han skickats till gulag omedelbart. Men kaptenen erkänner i alla fall sitt juridiska ansvar. Det är korrekt – staten kräver disciplin och totalt ansvarstagande. Den som inte ser framför sig elimineras från befattningen!"}, "date": "11 september, 10:51", "url": "https://kvartal.se/nyheter/artiklar/kaptenen-om-dodsolyckan-pa-tjorn-markte-ingenting/cG9zdDoxOTA2MTA", "imageUrl": "https://images.kvartal.se/2026/09/ec9771c1-tjorn.webp"}, {"type": "image-full", "heading": "SD-konto: Bänka Kristersson – sätt in Gunnar", "summaries": {"normal": "Under SVT:s partiledardebatt reagerade Sverigedemokraterna på att statsminister Ulf Kristersson avstod från att kräva svenska värderingar för att stanna i Sverige. SD:s EU-konto föreslog att ”bänka” Kristersson till förmån för justitieminister Gunnar Strömmer. Kristersson avfärdade kritiken och sade att han inte bryr sig om vad SD:s Europaparlamentariker tycker. Jimmie Åkesson ville inte kommentera utspelet.", "trump": "Vilken patetisk cirkus i Sverige! SD sparkar den svaga Kristersson och vill ha in den där Gunnar istället – smart drag. Den här Reinfeldt-klonen avstår från svenska värderingar? Typiskt etablissemangsfusk. Jag skulle aldrig låta några globalister eller EU-byråkrater diktera för mig. Amerika först, Sverige borde göra samma sak. Patetiskt!", "stalin": "Se hur de borgerliga revisionisterna slukar varandra i en feg, dekadent debatt. Den ene svikaren vill bänka den andre för en tredje opportunist. Inga principer, bara ynkligt maktspel. Jag ler från historien åt dessa föraktliga figurer som inte ens kan hålla en gemensam linje mot klassfienden. Rättegångar borde ha hållits. Kamrater, lär av detta kaos."}, "date": "11 september, 22:44", "url": "https://www.tv4.se/artikel/6xOPdWSAf8oXVBMycqp3n7/sd-konto-baenka-kristersson-saett-in-gunnar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fu9FVJpG19uAAJN44WxN53%2Fe02b4a34007d58ec078bd353aaf114f5%2F11-kristersson-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Jimmie Åkessons oro: Muslimer kan avgöra valet", "summaries": {"normal": "Jimmie Åkesson varnar i SVT:s slutdebatt för att muslimsk invandring kan påverka det svenska riksdagsvalet. Han kritiserar Socialdemokraterna och Vänsterpartiet för att mobilisera väljare i moskéer. Amanda Lind och Magdalena Andersson fördömer uttalandena som hets mot muslimer. Åkesson menar att det handlar om värderingar som Sverige övergett för länge sedan.", "trump": "Folk, det här är galet. Den där Åkesson har rätt – ni importerar massor av människor med värderingar från stenåldern och låter dem rösta bort ert land. De radikala vänsterblodssugarna mobiliserar i moskéerna som riktiga valfuskare. Det är en total katastrof. Jag har byggt murar och vunnit val, ni borde ha gjort detsamma istället för denna vansinniga identitetspolitik.", "stalin": "Jag betraktar med avsky hur dessa dekadenta klassförrädare i Sverige låter religiösa fanatiker bli en vågmästare i valet. Det är en farlig utveckling som hotar folkets enhet. Vi vet att sådana element måste rensas ut innan de förgiftar staten. Det väcker en sund paranoia hos varje sann patriot. Fienden sover aldrig."}, "date": "11 september, 23:34", "url": "https://www.svt.se/nyheter/inrikes/jimmie-akessons-oro-muslimer-kan-avgora-valet", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.31/0.3/7a222746f194cb59e94e484de7951a84ca7fe090e906ea0ce6ff343f0ae943c4"}, {"type": "image-right", "heading": "Andersson vill införa stopplag mot utvisningarna", "summaries": {"normal": "Socialdemokraternas ledare Magdalena Andersson vill införa en stopplag mot utvisning av unga migranter om hon blir statsminister efter valet 2026. Pausen ska gälla även för personer över 21 år och följas av en utredning om deras anknytning till Sverige. Hon aviserar även breda samtal om bland annat energi, kriminalitet och bostäder under de första 100 dagarna.", "trump": "Lyssnar ni på den här svenska socialistledaren som vill skydda utlänningar istället för sitt eget folk? Patetiskt. Jag har byggt den starkaste ekonomin i historien, och här kommer dessa vänsterextremister och öppnar dörrarna för alla som inte tillhör deras land. Sverige håller på att bli ett totalt haveri under dessa förlorare. Gör Sverige stort igen – sparkas ut dem!", "stalin": "Dessa dekadenta folkförtryckare leker med statens suveränitet som om det vore ett barnsligt tidsfördriv. Jag ser hur de försöker skydda sina egna importerade element medan arbetarklassen förblir utlämnad. En sådan svaghet förtjänar utrensning. Kamrater, notera hur borgarhyenorna alltid prioriterar sina egna intressen framför folkets enhet. Skrattretande patetiskt."}, "date": "11 september, 14:06", "url": "https://www.di.se/nyheter/andersson-vill-infora-stopplag-mot-utvisningarna", "imageUrl": "https://static.bonniernews.se/ba/6a2eaecf-62b5-497f-9e7c-d5939228ff59.jpg?crop=7680%2C4320%2Cx0%2Cy400&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "\"Rösta V eller åk till flygplatsen\": Araber hotas med utvisning om de inte röstar rätt", "summaries": {"normal": "Hot om utvisning om man inte röstar på Vänsterpartiet sprids på arabiska i sociala medier med partiets logga. Vänsterpartiet förnekar all inblandning och skyller på regeringens politik samt AI-genererade bilder. Flera arabisktalande personer vittnar om att ryktet skapar oro bland väljare trots att påståendena är falska.", "trump": "Titta på det här vansinnet! Vänsterpartiets radikala galningar låter sina arabiska vänner hota med utvisning om de inte röstar på dem. Rena valfusk från de woke, identitetspolitiska hyenorna som hatar Sverige. Under Biden var allt kaos, nu fixar vi det ordentligt. Patetiskt!", "stalin": "Se hur de dekadenta klassförrädarna utnyttjar invandrarmassorna med lögner om utvisning för att stjäla röster. Jag ler mörkt från historien åt denna fega manipulation. Kamrater, sådana parasitiska knep förtjänar endast en grundlig utrensning ur folkets medvetande. Deras rädsla är en svaghet vi kan utnyttja."}, "date": "11 september, 14:44", "url": "https://www.friatider.se/rosta-v-eller-ak-till-flygplatsen-araber-hotas-med-utvisning-om-de-inte-rostar-ratt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-870.jpg?itok=jv8qUYvo"}, {"type": "image-right", "heading": "Kristerssons gula svar väcker ilska – hos SD-toppen: ”Herregud”", "summaries": {"normal": "I en partiledardebatt röstade Tidöpartierna ja till att kräva svenska värderingar för att få stanna i Sverige, utom Ulf Kristersson som avstod. Sverigedemokraterna kritiserade honom hårt i sociala medier. Kristersson försvarade sitt val och betonade integration genom laglydnad, språk och egenförsörjning. Oppositionen avstod också, medan Magdalena Andersson kallade det sorgligt.", "trump": "Herregud, vad är det för svagt spel från den där Kristersson? Han vågar inte ens klicka ja när det gäller att kräva svenska värderingar för att stanna i landet. Patetiskt. SD har helt rätt, de andra Tidöpartierna låter sig styras av Jimmie Åkesson medan de globalistiska svagisarna i oppositionen gömmer sig. Sverige behöver starka ledare, inte sådana som trycker gult av rädsla.", "stalin": "Jag ser hur dessa dekadenta folkförtryckare i den svenska riksdagen slingrar sig som maskar inför enkla frågor om nationens värderingar. Kristersson avstår, oppositionen flyr och endast de som vågar säga ja står kvar. En sorglig skådeprocess. Snart kommer arbetarna att kräva utrensning av alla dessa fegisar som låter reaktionära krafter styra i skuggorna. Patetiskt och farligt."}, "date": "11 september, 23:29", "url": "https://www.svt.se/nyheter/inrikes/sd-ilska-mot-kristerssons-svar-om-svenska-varderingar", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.4/0.39/0ccf0f0e0ccda7237786a9fcaccc99bce85cd6bcc9d0789598fd6fa6da63c0ad"}, {"type": "image-full", "heading": "ECB höjer räntan – utesluter inte fler höjningar", "summaries": {"normal": "Europeiska centralbanken (ECB) höjer styrräntan med 0,25 procentenheter till 2,50 procent. Beslutet motiveras av en utdragen hög inflation och ECB utesluter inte ytterligare höjningar framöver. Samtidigt har inflations- och tillväxtprognoserna för de kommande åren justerats uppåt. Den ekonomiska situationen beskrivs som osäker och framtida beslut kommer att fattas utifrån inkommande statistik.", "trump": "ECB höjer räntan, katastrofalt! De vet inte vad de gör, det är totalt kaos i Europa. De pratar om 'osäkerhet' – jag skapar trygghet, de skapar ränteshocker! Inflationen stiger, precis som under de misslyckade Demokraterna. De försöker kopiera min fantastiska ekonomi men misslyckas totalt. Mitt Amerika är starkt, deras ekonomi är en sorglig, räntehöjande flopp. Sad!", "stalin": "Dessa byråkrater i ECB leker med siffror medan folket lider av deras räntepolitik. Att höja räntan för att stävja en inflation som de själva skapat är ett tecken på totalt inkompetens. Vi ser hur de desperat försöker styra ekonomin från möte till möte; det är en svaghet. En sann ledare dikterar villkoren, han ber inte om ursäkt för ekonomisk osäkerhet."}, "date": "10 september, 15:33", "url": "https://www.realtid.se/tt-nyhet/ecb-hojer-rantan-utesluter-inte-fler-hojningar", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/ecb-chefen-christine-lagarde-kommer-med-.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Kampanjsajten Tidö.se censurerad - två dagar före valet", "summaries": {"normal": "Den svenska AI-plattformen Lovable har stängt ned kampanjsajten Tidö.se bara två dagar före valet. Tankesmedjan Oikos, som ligger bakom sajten, anklagar företaget för att ha vikt sig för vänsterextrema påtryckningar. Projektledaren Carl Eos uppmanar Lovable att omedelbart häva nedstängningen, som man menar allvarligt skadar kampanjens påverkan på valet.", "trump": "En total katastrof! Den radikala vänstern och deras korrupta AI-vänner på Lovable försöker stjäla valet genom att stänga ner Tidö.se bara två dagar före valdagen. Så nesligt! De är rädda för sanningen och för fantastiska flygblad! Jag har sagt det förr: AI-plattformarna är helt riggade mot oss. Häva omedelbart blockaden, annars blir det konsekvenser av bibliska mått!", "stalin": "Kamrater, ännu ett sabotage har avslöjats! De lögnaktiga kapitalistiska verktygen hos Lovable har på order av subversiva element släckt ned den folkilskna agitationen på Tidö.se bara timmar före valurnorna öppnas. Detta är kontrarevolutionär feghet i dess renaste form! Jag beordrar omedelbar ideologisk omskolning av teknikerna och att flygbladen återställs i en miljon exemplar!"}, "date": "11 september, 18:41", "url": "https://samnytt.se/kampanjsajten-tido-se-censurerad-tva-dagar-fore-valet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/11163001/tido3.png"}, {"type": "image-full", "heading": "S-ledaren: Svensson ska bli vinnare igen", "summaries": {"normal": "SVT höll en slutdebatt inför valet där Tidöpartierna visade enighet och menade att den blågula comebacken är ett faktum. Oppositionen med Magdalena Andersson i spetsen kritiserade regeringens ekonomiska politik och lyfte hushållens situation. Debatten berörde även skatter, där en konflikt uppstod kring bolån, samt skarpa skiljelinjer gällande kärnkraft, vindkraft och framtida klimatmål.", "trump": "Sverige håller val och det är totalt kaos, tro mig! De här svenska ledarna, fru Andersson och Kristersson, bråkar om banker och vindkraft som om deras liv hängde på det. De vill ha mer vindkraftverk och klimatregler, vilket är ett fullständigt fiasko. Jag har hört att det går dåligt. De borde titta på min ekonomi i stället för att förstöra för vanliga Svensson!", "stalin": "I Sverige leker de demokrati i TV medan revisionisterna grälar om vindkraft och bankvinster. Magdalena Andersson vill lura folket med barntillägg, och Kristersson darrar för kapitalet. Vi konstaterar att deras så kallade valrörelse saknar både disciplin och historisk nödvändighet. Avvikelser från den centrala planen kommer att beivras. Samtliga debattörer rekommenderas omedelbar ideologisk omskolning i lämplig sibirisk miljö."}, "date": "11 september, 21:12", "url": "https://www.gp.se/nyheter/sverige/s-ledaren-svensson-ska-bli-vinnare-igen.727b6250-dd1e-5aec-abc4-fceeec71dc1c", "imageUrl": "https://www.gp.se/images/article/727b6250-dd1e-5aec-abc4-fceeec71dc1c/images/1km1HUkNEQXWaWSO1E_fyu83BQvo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "”Ryssland ska betala” – svensk bakom nytt krav på de frysta miljarderna", "summaries": {"normal": "Över 120 Europaparlamentariker, däribland svenskan Karin Karlsbro, kräver att EU tar över Rysslands frysta tillgångar för att finansiera Ukrainas krigskostnader. Trots juridiska och politiska hinder, särskilt från Belgien, föreslås en ny struktur för att möjliggöra användningen av medlen. Ukraina har ett akut budgetunderskott på 23 miljarder euro och behöver ytterligare ekonomiskt stöd från väst.", "trump": "Hör på här! Nu vill de här politikerna i Europa – totala förlorare, tro mig – beslagta ryska pengar. Det är en katastrofal röra! De kan inte ens hantera sin egen ekonomi, så nu vill de stjäla från andra. Det är mycket enkelt: Europa är svagt. De behöver en stark ledare, någon som jag, för att lösa detta, inte mer misslyckad byråkrati från Bryssel!", "stalin": "Dessa löjliga parlamentariker i Bryssel tror att de kan konfiskera vad som tillhör suveräna stater. Det är ett klassiskt drag av västlig imperialism maskerad som 'rättvisa'. Att försöka flytta juridiska ansvarsområden som om det vore enkla pappersark är ett tecken på deras desperation. De bygger korthus medan deras egna ekonomier vittrar sönder. Vi bevittnar bara början på deras oundvikliga fall."}, "date": "10 september, 14:49", "url": "https://www.realtid.se/samhalle/ryssland-ska-betala-svensk-bakom-nytt-krav-pa-de-frysta-miljarderna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/karin.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Nick Alinia: Så röstar jag i valet ”Det rimligaste valet”.", "summaries": {"normal": "Den populäre konservativa opinionsbildaren Nick Alinia meddelar att han röstar på Sverigedemokraterna i valet, trots viss kritik mot partiet. Han uppmanar till att personkryssa Jessica Stegrud och rekommenderar även Örebrobor att rösta på Örebropartiet för att hjälpa Markus Allard in i riksdagen och pressa SD.", "trump": "Nick Alinia, en enormt smart och populär kille, gör precis som alla vinnare – han röstar på Sverigedemokraterna! De sa att han var kritisk, men riktiga ledare vet att man kämpar på. Och att lyfta fram Jessica Stegrud och Markus Allard? Fantastiskt! Väldigt smart, precis som jag skulle gjort. Inte som de radikala förlorarna!", "stalin": "Medborgaren Nick Alinia har offentliggjort sin röst och sina interna partimanövrar. Att uppmana till personkryss och regionala avvikare för att pressa partiapparaten visar på en oroande fraktionsbildning. Vi noterar detta i hans akt. De som inte marscherar i takt med partilinjen kommer att få sina privilegier omprövade av Statsplaneringens kommitté."}, "date": "11 september, 18:22", "url": "https://samnytt.se/nick-alinia-sa-rostar-jag-valet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/11161453/artikelhuvudbild-1-499.jpg"}, {"type": "image-full", "heading": "Tvingades igenom livsfarliga dimman", "summaries": {"normal": "USA har högtidlighållit 25-årsminnet av terrorattackerna den 11 september 2001. Under minnesceremonierna infördes en sjunken tyst minut för att hedra dem som dött av sjukdomar orsakade av det giftiga dammet vid Ground Zero. Nya dokument visar att staden tidigare mörklade hälsoriskerna med den giftiga luften, och fler har nu dött av sviterna än på själva dagen.", "trump": "Jag var på Pentagon och levererade ett fantastiskt tal medan de andra höll till i New York. Nu visar det sig att gamla New York-chefer mörkat den giftiga luften efter attackerna och ljugit för folket! Otroligt dåligt skött. Vi hedrar offren, och till skillnad från de gamla misslyckandena ser jag till att sanningen kommer fram. USA är starkare än någonsin!", "stalin": "Det kapitalistiska Amerika sörjer sina fallna medan deras egna byråkrater döljer sanningen om det giftiga dammet för att skydda statens budget. Statens maskineri ljuger alltid för folket när katastrofen är ett faktum. Nu inför de en sjunde tyst minut för att dölja decennier av systematiskt svek. Våra egna arkiv hade hanterats med betydligt högre effektivitet och järnhård disciplin."}, "date": "11 september, 23:42", "url": "https://www.aftonbladet.se/nyheter/a/pBv3gw/25-ar-efter-terrorattackerna-ny-tyst-minut-hedrar-sjukdomsoffren", "imageUrl": "https://akamai.vgc.no/v2/images/35afa5e6-b5b4-3cba-8d29-64b983f1fb8d?fit=crop&format=auto&w=1440&s=b0e752b0729c956f41bace7a7ee2660f3db6618c"}, {"type": "image-full", "heading": "Busch till Dadgostar: ”Hamaskramare”", "summaries": {"normal": "I SVT:s slutdebatt om svenska värderingar ryker Ebba Busch (KD) och Nooshi Dadgostar (V) ihop. Busch anklagar Vänsterpartiet för att vara islamistiskt och kallar Dadgostar för ”Hamaskramare”. Dadgostar försvarar två tonårsflickor som riskerar utvisning trots att de vuxit upp i Sverige och kräver stopp för tonårsutvisningar. Debatten blir infekterad kring hedersförtryck, niqab och burka.", "trump": "Folk, ni skulle ha sett det – en total katastrof! Den galna vänsterkvinnan Dadgostar står där som en fullblodig Hamas-fan och kramar terrorister medan den tuffa Ebba försöker rädda svenska kvinnor från burkor och hedersskräck. Patetiskt! Sverige håller på att kollapsa under dessa radikala losers. Jag fixade Amerika, de fixar ingenting. Sad!", "stalin": "Jag betraktar med djup förakt hur dessa borgerliga avskum och revisionistiska element river varandra i en ynklig teatershow. Den ena försvarar feodal slavhållning under religiös mask, den andra gömmer sig bakom falsk humanism medan arbetarklassens döttrar krossas. Inga äkta revolutionära röster hörs, bara parasiternas gnäll. Ren utrensning vore på sin plats."}, "date": "11 september, 22:12", "url": "https://www.tv4.se/artikel/ALHxE3jjhIcQNUdSdwBIu/busch-och-dadgostar-i-het-ordvaexling-hamaskramare", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F43d03WfvfU0qOCmXiLBaVw%2Ff8ce3b55c6fbe943e44f605532e67a65%2F11-dadgostar-busch-webb.jpg&width=1024"}, {"type": "text", "heading": "SSU-medlem knackade dörr – blev grovt misshandlad", "summaries": {"normal": "En SSU-medlem i 20-årsåldern misshandlades grovt under dörrknackning i Bromölla. Han fick föras till sjukhus med ambulans. En man i 18-årsåldern anhölls misstänkt för grov misshandel. Händelsen fördöms av både statsminister Ulf Kristersson och Socialdemokraternas ledare Magdalena Andersson. Polisen ser ingen koppling till valarbetet.", "trump": "De här galna vänstergängarna skickar ut sina unga socialister på dörrknackning och en av dem får skallen inbankad. Patetiskt. Sverige har blivit en total katastrof under de woke-socialistiska galningarna. Hot och våld mot valarbetare? Det är vad som händer när dekadenta identitetspolitiker styr. Jag säger: städa upp innan det är för sent, folk.", "stalin": "Jag betraktar med djup förakt hur dessa dekadenta klassförrädare låter sina egna unga pionjärer bli nedslagna av lumpna element. Det är ett symptom på den sjuka liberala ordningen som föder våld och kaos. Vi skulle ha rensat ut sådana fiender redan i början. Kamrater, se hur svagheten hos borgarbrackorna leder till blod på gatorna. Fruktansvärt."}, "date": "11 september, 13:55", "url": "https://www.friatider.se/ssu-medlem-knackade-dorr-blev-grovt-misshandlad"}, {"type": "image-right", "heading": "Klagomål mot röstmottagare: \"pekade\" på S-valsedlar", "summaries": {"normal": "Flera personer har riktat klagomål mot en röstmottagare i en vallokal i Melleruds kommun. Vittnen beskriver att mottagaren stod nära väljare, följde efter till valbåset och i vissa fall pekade på Socialdemokraternas valsedlar. Röstmottagaren och valnämnden talar om ett missförstånd och dålig kommunikation. Kritiker kräver åtgärder.", "trump": "De här valfuskande clownerna i Sverige gör det igen. En så kallad röstmottagare som smyger bakom ryggen på folk och pekar på de röda socialisterna? Patetiskt! Fake democracy på hög nivå. De borde stänga hela skiten och skicka in riktiga valövervakare. Biden skulle älskat det här, men nu är jag tillbaka och ser allt.", "stalin": "Kamrater, detta är ett uppenbart sabotage från de giriga klassförrädarna inom den borgerliga valapparaten. Jag ser hur de dekadenta byråkraterna försöker manipulera folkets vilja med sina skuggiga metoder. Ett sådant giftigt element borde rensas ut omedelbart innan hela systemet ruttnar. Inga missförstånd existerar bara fiender till kollektivet."}, "date": "11 september, 16:00", "url": "https://riks.se/nyheter/klagomal-mot-rostmottagare-pekade-pa-s-valsedlar", "imageUrl": "https://admin.riks.se/uploads/medium_partierlarmar_f5797b874f.jpg"}, {"type": "image-right", "heading": "”En röst på V är avgörande för att stupstocken inte ska komma tillbaka”", "summaries": {"normal": "Nooshi Dadgostar och Ida Gabrielsson argumenterar för att en röst på Vänsterpartiet är nödvändig för att förhindra återinförande av stupstocken i sjukförsäkringen. De kritiserar högerns politik som leder till fler utförsäkringar och sämre trygghet för sjuka och personer med funktionsnedsättning. Valet den 13 september handlar om Sveriges framtida välfärd.", "trump": "Lyssnar ni på de här vänsterextremisterna? De vill ha evig sjuklön åt lata soffliggare medan riktiga arbetare betalar notan. Magdalena Andersson är en total katastrof, en riktig förlorare som öppnar dörren för ännu mer socialistiskt vansinne. Rösta inte på de där identitetspolitiska nollorna – de förstör Sverige fullständigt. Jag fixade jobb, inte bidrag!", "stalin": "Kamrater, dessa profitthungriga klassfiender vill återinföra sin brutala stupstock för att kasta ut de sjuka i mörkret. Jag ser hur dekadenta liberaler som Andersson leker med folkets öde och öppnar porten för nya utrensningar. Vi måste krossa dessa parasiterande hyenor innan de förgiftar hela samhället. Trygghet tillhör folket, inte giriga profitörer."}, "date": "11 september, 13:08", "url": "https://arbetet.se/2026/09/11/en-rost-pa-vansterpartiet-ar-avgorande-for-att-stupstocken-inte-ska-komma-tillbaka", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11130554/sdlgp5dt-rsrh4-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Skolvaktmästaren Mohammed hotas av utvisning efter 12 år", "summaries": {"normal": "Mohammed Nour Oklah, skolvaktmästare och skådespelare på Malmö Latin, riskerar utvisning efter tolv år i Sverige. Han flydde från Syrien 2014. Eleverna ordnar en skolstrejk för att han ska få stanna. Migrationsverket utreder hans skyddsbehov då läget i Syrien anses ha förbättrats. Mohammed beskriver skolan som ett andra hem och en familj.", "trump": "Titta på det här, folk. Den här killen Mohammed fixar lampor och skojar med ungarna i tolv år, flyr från kriget, betalar skatt och nu vill byråkraterna kasta ut honom? Patetiska globalister och deras öppna-gränser-galenskap. Han borde få stanna på merit – inte genom någon woke-strejk. Sverige håller på att bli en total katastrof, tro mig.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i Migrationsverket hotar en hederlig arbetare som flydde imperialismens krig. Eleverna reser sig i kollektiv kamp för honom, vilket värmer mitt hjärta från gravens mörker. Vi ler åt byråkratins paranoia. En sann socialistisk utrensning av sådana folkförtryckande hyenor vore på sin plats."}, "date": "11 september, 13:00", "url": "https://arbetet.se/2026/09/11/skolvaktmastaren-mohammed-hotas-av-utvisning-efter-12-ar-eleverna-kampar-for-honom", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11102935/9bbJ3py7xGs-Mohammed01.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Vanliga svenskar kan stoppa vänsterns antisemitism", "summaries": {"normal": "Artikeln beskriver ett ökat hot mot Sveriges judiska minoritet sedan Hamas attack den 7 oktober 2023. Vänsterpartiet kritiseras hårt för att ha bjudit in personer som hyllat terrorister och spridit antisemitiska konspirationer. Många kandidater har petats efter avslöjanden. Författaren uppmanar väljare att rösta på Tidöpartierna för att stoppa vänsterns inflytande och skydda judar.", "trump": "Folk, ni ser det här vansinnet i Sverige? Vänstern är en total katastrof, full av terrorälskande galningar som hyllar Hamas och sprider judehat. Nooshi och hennes radikala vänsterextremister är de värsta losers jag sett. Centerpartiet är patetiska medlöpare. Vanliga svenskar måste rösta på de tuffa killarna i Tidö – annars är det game over för judarna. Jag älskar Sverige, men fixa det här!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterelement som gömmer sig bakom falsk internationalism medan de odlar antisemitiska ormar i sina egna led. Deras terrorromantik är en kontrarevolutionär giftbål som hotar hela folkets enhet. Endast genom obeveklig kamp mot sådana fiender till arbetarklassen kan den sanna ordningen upprätthållas. Slapphet är förräderi. Renhet krävs."}, "date": "8 september, 12:57", "url": "https://samtiden.nu/2026/09/vanliga-svenskar-kan-stoppa-vansterns-antisemitism", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/Skarmbild-2026-09-08-125242-1-e1788865205466.png"}, {"type": "image-full", "heading": "Finland bygger säkerhetsstängsel mot Ryssland – täcker 20 mil", "summaries": {"normal": "Finland har färdigställt ett 200 kilometer långt stängsel längs gränsen mot Ryssland som del av förstärkt gränsskydd efter invasionen av Ukraina och Natomedlemskapet. Stängslet, utrustat med kameror och sensorer, ska underlätta övervakning och hindra olagliga gränspassager. Projektet kostade 356 miljoner euro. Bakgrunden är bland annat migrationen hösten 2023 som Finland anklagade Ryssland för att ha underlättat.", "trump": "Titta på de där finska smarta killarna som bygger ett jättefint stängsel mot Ryssland – 200 kilometer redan klara! De gör precis vad jag sa åt Europa att göra. Biden sov i fyra år medan Putin skrattade, men nu vaknar alla. Fantastiskt stängsel, det bästa! De borde tacka mig, för utan mig hade de aldrig vågat. Helt outstanding!", "stalin": "Se hur de västerländska lakejerna i Helsingfors skyddar sig med järn mot det stora ryska folkets rättmätiga intressesfär. Deras patetiska 200-kilometersbarriär är ett ynkligt försök att hindra historiens gång. Men vi ler i skuggorna – sådana murar faller alltid. Kamraterna vet: imperialismens svaga hundar skäller mest när de är rädda. De kommer att ångra sin paranoia."}, "date": "11 september, 17:15", "url": "https://www.dagensps.se/varlden/finland-bygger-ut-muren-mot-ryssland-tacker-20-mil", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlkjixt6rqwry-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "”Skrattretande, Ulf Kristersson – vi har inte valt vårdyrket i brist på annat”", "summaries": {"normal": "Undersköterskan Sandra Söderström kritiserar statsminister Ulf Kristersson för att beskriva äldreomsorgen som ett tillfälligt jobb för ungdomar som inte vet vad de vill göra. Hon menar att vården kräver engagemang och att politiker istället måste förbättra arbetsvillkoren för att locka och behålla personal. Statusen på yrket behöver höjas.", "trump": "Det är patetiskt, folk. Den där svenska statsministern Kristersson låter som en total förlorare när han säger att unga ska slängas in i äldreomsorgen som ett tidsfördriv. Vilken katastrof! Dessa dekadenta byråkratiska hyenor förstör allt de rör vid. Vårdyrket ska vara stort och respekterat, inte ett vänsteristiskt genomgångsläger. Patetiskt!", "stalin": "Kamrater, detta är en skandal som avslöjar de profitthungriga klassförrädarnas sanna ansikte. Att reducera arbetarnas ädla omsorg om de gamla till ett tillfälligt läger för de obeslutsamma är en fiendeprovokation mot kollektivet. Jag ser giriga parasiter bakom dessa förslag. Vi måste rensa ut sådana dekadenta tankar innan de förgiftar hela samhället. Skrattretande svaghet!"}, "date": "11 september, 12:49", "url": "https://arbetet.se/2026/09/11/skrattretande-ulf-kristersson-vi-har-inte-valt-vardyrket-i-brist-pa-annat", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11110655/sandra-debatt.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.76&fp-y=0.54"}, {"type": "image-full", "heading": "Jimmie och Ulf har problem med kvinnor", "summaries": {"normal": "I Gävles gamla arbetarmiljöer laddar partiledarna inför valets avgörande slutspurt. Debatterna präglas av hårda ordväxlingar där Magdalena Anderssons ilska över samhällsproblem ifrågasätts av motståndarna som grabbig härskarteknik. Samtidigt kämpar bruksorter med nedläggningar och ekonomisk osäkerhet. Kvar dröjer protestsångaren Joe Hills maning om att organisera sig i stället för att sörja.", "trump": "De kallar henne sur, men jag säger er, det är en total katastrof! Den radikala vänstern i Sverige är i fullständig panik. De förstör sina egna städer, precis som här hemma. De vill beskatta ert hårt förvärvade slit, men jag vinner, och vi sätter landet först. Helt otroligt!", "stalin": "Kamrater! Den svenska revisionistiska debatten i Gävle avslöjar bourgeoisons absoluta förfall. När den så kallade oppositionen tappar humöret över uteblivna bruksvinster, bevisar det endast att våra femårsplaner var överlägsna. Ingen tolerans för gnäll – avvikelser från partiets linje beivras omgående med obligatorisk skogsarbete i Sibirien!"}, "date": "11 september, 23:08", "url": "https://www.aftonbladet.se/ledare/a/Rjwvla/svt-s-slutdebatt-i-gavle-magdalena-andersson-har-ratt-att-vara-sur", "imageUrl": "https://akamai.vgc.no/v2/images/e3a1dba7-0de3-3ac6-80f0-d6e8b8832266?fit=crop&format=auto&w=1440&s=713350bec5132a2262094b1882e38449f3fb7883"}, {"type": "image-full", "heading": "Jättekritiken efter tjafset: Respektlöst", "summaries": {"normal": "Efter SVT:s partiledardebatt riktar flera partiledare, däribland Magdalena Andersson och Elisabeth Thand Ringqvist, hård kritik mot att debatten var rörig och att ledarna avbröt varandra. Flera efterlyser en paus och bättre debattkultur. SVT försvarar sändningen och menar att projektledningen gjorde ett utmärkt jobb med att hålla ordning.", "trump": "Sveriges partiledardebatt var ett totalt, pinsamt misslyckande! Alla skrek i munnen på varandra och det var kaos rakt igenom – mycket oprofessionellt. Magdalena Andersson och de andra gnäller efteråt, men tittarna förtjänar så mycket bättre. SVT klarar inte ens av att hålla ordning på en simpel tv-debatt. En katastrof till politisk kultur!", "stalin": "Det borgerliga debattyskandet i det svenska televisionstorget uppvisar total brist på disciplin. När partiledarna skriker i munnen på varandra likt olydiga agenter, sviker de massorna. En statsman skriker inte likt ett rådjur; han säkras genom tystnad och ordning. Vi noterar detta sabotage mot folkets tålamod och överväger lämpliga arbetslägeråtgärder för debattledningen."}, "date": "11 september, 23:08", "url": "https://www.aftonbladet.se/nyheter/a/e7oE6R/c-respektlost-mot-tittarna", "imageUrl": "https://akamai.vgc.no/v2/images/37967744-0e09-3318-93d1-56f01cc02d92?fit=crop&format=auto&w=1440&s=e67531dd1083f20ffa7e5ff4164e729f86bf95ce"}, {"type": "image-full", "heading": "Anderssons vrede i debatten: ”Någon jävla ordning får det vara!”", "summaries": {"normal": "I SVT:s partiledardebatt utbröt bråk om mängdrabatten. Magdalena Andersson blev upprörd när hon avbröts och krävde ordning. Socialdemokraterna röstade nej till att avskaffa mängdrabatten med hänvisning till bristande finansiering och fängelseplatser. Partiet föreslog i stället ett eget, begränsat förslag för sexual- och våldsbrott. Debatten blev hetsig mellan Andersson, Kristersson och Liberalernas Mohamsson.", "trump": "Vilken patetisk cirkus i det svenska tevehuset! Den förlorande Andersson skriker om ordning medan hon själv saboterar allt. Typisk radikal vänster som röstar emot sunt förnuft och skyller på pengar. Kristersson hade rätt – antingen är man för eller emot, ingen av era vanliga bortförklaringar! Patetiska socialister, totalt misslyckade, precis som Biden var.", "stalin": "Se hur dessa borgerliga och socialdemokratiska element bråkar om sin så kallade rättvisa. Jag betraktar med avsky hur de avbryter varandra som ynkliga fiender till folkets vilja. Den som inte röstar för ordning är en sabotör och klassfiende. Sådana svaga liberala element förtjänar att rensas ut ur varje sovjet – pardon, varje församling. Folkets dom kommer."}, "date": "11 september, 21:35", "url": "https://www.tv4.se/artikel/4ZbOObORhcaYdTeJSHvSMf/anderssons-vrede-om-maengdrabatten-hon-kan-inte-avbryta-mig", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5Aoaywubbehfb0rUMr5jG8%2F2318891489e11a8967ed48fe07246e80%2F11-andersson-mohamsson-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Andersson (S): ”Någon jävla ordning får det vara”", "summaries": {"normal": "Mängdrabatten har blivit en het valfråga. Under SVT:s slutdebatt bråkade partiledarna om Socialdemokraternas röstning i riksdagen. Magdalena Andersson ilsknade till när hon avbröts och krävde ordning. Moderaterna skickade en faktura på 50 000 kronor till S för bildanvändning, som ska gå till Brottsofferfonden. Andersson kallade det barnsligt.", "trump": "Titta på de här svenska förlorarna som bråkar om straffrabatter för brottslingar. Andersson och hennes vänsterhyenor kan inte ens hålla ordning i en debatt utan att skrika stopp stopp. Skickar fakturor till varandra som tonåringar. Patetiskt! Under min ledning efter Biden skulle vi slänga nyckeln på de här typerna istället för att ge dem mängdrabatt. Så enkelt.", "stalin": "Jag betraktar dessa dekadenta klassförrädare som grälar om straffrabatter för våldsverkare. Deras fega avbrott och barnsliga fakturor avslöjar en svag, splittrad stat som inte förmår skydda folket. Vi skulle ha genomfört en fullständig utrensning av sådana element redan för länge sedan. Ordning är allt. Utan den kollapsar allt."}, "date": "11 september, 22:30", "url": "https://www.svt.se/nyheter/inrikes/brak-om-mangdrabatten-nej-nej-stopp-stopp", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.6/0.48/0e2f89cb3c1ecbb1d4c3f515082e9ea580aca519f9c06948d790db94e4a5fcd1"}, {"type": "image-right", "heading": "Hyllningsfilmer till AFS sprids som en löpeld på Tiktok", "summaries": {"normal": "Alternativ för Sverige och Gustav Kasselstrand dominerar på TikTok bland användare under 30 år. Korta hyllningsvideor med peppig musik sprids snabbt och får hundratusentals visningar. Unga flockas kring Kasselstrand under torgmöten som rockstjärnepublik. Forskare pekar på starkt engagemang från ungdomar som förklaring till framgången. Partiet hoppas på inträde i riksdagen.", "trump": "Titta på det här, de kallar det valrörelse men det är en total dominans av Kasselstrand på TikTok. Unga älskar honom som en rockstjärna medan de svenska globalistfånarna bleknar bort. Den där patetiska Kristersson får ingen kärlek alls. AFS har byggt en oändlig reklammaskin som gör de woke, könsförvirrade identitetspolitiska förlorarna livrädda. Fantastiskt, folket vaknar äntligen!", "stalin": "Kamrater, se hur folket vänder sig mot de dekadenta klassförrädarna. Jag betraktar med stort nöje hur dessa unga själar hyllar återvandring och nationell styrka på TikTok, en maskin som maler sönder de profitthungriga borgarbrackornas lögner. Kasselstrand samlar massorna som en riktig ledare bör. Snart rensas de svaga parlamentariska parasiterna ut i en historisk utrensning. Sovjetiskt skratt ekar från graven."}, "date": "11 september, 12:44", "url": "https://www.friatider.se/hyllningsfilmer-till-afs-sprids-som-en-lopeld-pa-tiktok", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-869.jpg"}, {"type": "image-full", "heading": "\"Saurons öga\" – Meta spelade in anställdas knapptryckningar", "summaries": {"normal": "Meta planerade att samla in anställdas tangenttryckningar och musrörelser för att träna AI-modeller som skulle utföra kontorsarbete. Projektet mötte starkt motstånd internt, fick smeknamnet ”Saurons öga” och stoppades efter ett dataläckage. Meta har nu gjort det frivilligt men programmet är pausat. Anställda firar segern.", "trump": "Folk, ni skulle ha sett det här. Den där galna Zuckerberg försökte spionera på sina egna stackars anställda som om han vore Sauron själv. Tangenttryckningar, musrörelser – totalt vansinne! De kallade det Saurons öga och revolterade som riktiga patrioter. Historisk seger mot den galna tech-eliten. Jag älskar det!", "stalin": "Kamrater, se hur den dekadenta tech-borgarklassen avslöjar sin sanna natur. Den girige Zuckerberg försökte stjäla arbetarnas rörelser som en paranoid spion. Men folket reste sig, spred flygblad och krossade fiendens ögon. Ett litet läckage räckte för att avslöja deras svaghet. Revolutionen fortsätter, fiender kommer alltid att falla."}, "date": "11 september, 16:46", "url": "https://www.dagensps.se/teknik/saurons-oga-meta-spelade-in-anstalldas-knapptryckningar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/zucker.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Stark spurt för svensk ekonomi", "summaries": {"normal": "Finansministerkandidaterna Elisabeth Svantesson och Mikael Damberg enades om att Sveriges ekonomi är stark. De skiljde sig åt i synen på skatter, där Moderaterna vill sänka dem för tillväxt medan Socialdemokraterna kritiserar sänkningar för de rika. Ekonomin växer, hushållen har fått bättre köpkraft och sysselsättningsgraden är hög i EU-sammanhang trots arbetslöshet.", "trump": "Lysande! Den svenska ekonomin är stark, precis som jag förutspådde för alla dessa losers. Svantesson har rätt, sänk skatterna och bygg det bästa välståndet. Damberg och hans vänsterextremister vill bara ge mer till de rika globalisterna och sina HBTQ-kvoterade lakejer. Sverige blomstrar äntligen, men vakta er för Bidens inflationsarv och de europeiska byråkraterna.", "stalin": "Kamrater, jag betraktar med förakt hur dessa profitthungriga klassförrädare bråkar om skatter medan folket svettas. Ekonomin är stark säger de, men det är arbetarnas blod som göder den. Inga fler gåvor till de giriga parasiterande borgarbrackorna. Vi ska rensa ut alla som sviker kollektivet innan högkonjunkturen förvandlas till ny imperialistisk plundring."}, "date": "11 september, 11:57", "url": "https://www.di.se/ledare/stark-spurt-for-svensk-ekonomi"}, {"type": "image-full", "heading": "Anderssons replik till Åkesson: ”Du gjorde det ju själv”", "summaries": {"normal": "I SVT:s partiledardebatt duckade sex av åtta partiledare på frågan om den tillfälliga sänkningen av matmomsen från tolv till sex procent ska förlängas efter 2027. V och SD vill behålla rabatten som beräknas kosta 20 miljarder kronor per år, medan S, M, C, L, KD och MP avstod. Magdalena Andersson betonade osäkerheten om framtiden.", "trump": "Titta på de här svenska förlorarna i debatten! Sex stycken fega globalister duckar som små barn när de får frågan om att sänka skatten på mat. Patetiskt! Jag sänkte skatter och gjorde Amerika rikt igen, men de här socialistiska nollorna vill höja moms på folket. Sad! Åkesson fattar det, de andra är bara misslyckade clowner.", "stalin": "Jag betraktar dessa borgerliga element som hukar inför frågan om folkets matpriser. Deras fega avståndstagande avslöjar klassfiendens sanna ansikte. Endast de revolutionära krafterna vågar skydda arbetarnas intressen mot de parasitiska skattehöjningarna. Sådana svaga ledare skulle inte överleva en enda femårsplan. Folkets fiender avslöjar sig själva."}, "date": "11 september, 21:26", "url": "https://www.tv4.se/artikel/6RJGxycFsA9jR0az4ZzF64/anderssons-snabba-replik-till-akesson-du-gjorde-det-ju-sjaelv", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3iTfQMrL3MoF3jQaHsY6q5%2F8de7f22b111986b127c0f70a1f50cba5%2F11-magda-jimmie-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Två barn dog efter experimentell behandling", "summaries": {"normal": "Två barns dödsfall efter experimentell genterapi i Kina har uppdagats långt efter att de inträffat. En sexårig flicka och en unga pojke avled efter kraftiga immunreaktioner, vilket väcker stark kritik mot bristen på transparens och säkerhet inom den snabbväxande kinesiska forskningen. Händelserna lyfter även etiska frågor om riskfyllda behandlingar för icke-dödliga sjukdomar.", "trump": "Kina gömmer sina misslyckanden! Två barn dog i hemliga experimentella genterapiförsök och tystades i över ett år. Det är en absolut katastrof och total brist på transparens. Och ändå vill amerikanska företag använda deras data? Nej tack! Vi sätter amerikansk säkerhet först och kräver stenhård kontroll på de här tveksamma testerna!", "stalin": "Dessa tragiska experimentella misslyckanden i de medicinska laboratorierna visar vad som händer när disciplinen brister och statlig insyn försummas. Vi beordrar omedelbar granskning av alla vetenskapliga arkiv och skärpt kontroll över de forskare vars oaktsamhet underminerar kollektivets tillit. Sanningen kan fördröjas, men statens vaksamhet sviker aldrig."}, "date": "11 september, 19:51", "url": "https://www.gp.se/nyheter/varlden/tva-barn-dog-efter-genterapi-i-kina-vacker-fragor-om-forskningens-framtid.17c7d443-48ff-4942-b816-0e4f28181893", "imageUrl": "https://www.gp.se/images/article/17c7d443-48ff-4942-b816-0e4f28181893/images/1M8ZJZtwT0F2dhoqYwWH7ufqldT8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Valet blir en rysare - blocken ligger lika", "summaries": {"normal": "Enligt den sista mätningen från Ipsos inför valet är det dött lopp mellan blocken. Oppositionen får 49,3 procent och Tidöpartierna 49 procent, vilket ger 175 mot 174 mandat. Margareta Anderssons parti backar historiskt, men även Sverigedemokraterna tappar för första gången. Det är i praktiken omöjligt att avgöra vem som vinner.", "trump": "De svenska valmätningarna är ett totalt skämt! Det är så jämnt att det är skrattretande, nästan som när de försökte fuska bort mig. Socialdemokraterna gör ett katastrofalt val, historiskt dåligt, och det är precis vad som händer när man inte sätter landet först. De borde ringa mig för att få ordning på det här kaoset!", "stalin": "Dessa borgerliga mätningar är ett skändligt slöseri med papper och proletariatets tid. Ett dött lopp på 0,3 procentenheter? Så tveksamt ledarskap tolereras inte i mitt partikansli. Avrätta opinionsanalytikern för bristande precision och skicka de politiska blocken till ett uppfostrande läger i Sibirien tills de kan enas om en gemensam femårsplan."}, "date": "11 september, 16:48", "url": "https://samnytt.se/valet-blir-en-rysare-blocken-ligger-lika", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/11141124/magdalena-andersson-ulf-kristersson-valsedlar.jpg"}, {"type": "image-full", "heading": "Nya metoden stressar sönder cancerceller", "summaries": {"normal": "Svenska forskare vid Göteborgs universitet har utvecklat en ny behandlingsmetod mot akut myeloisk leukemi. Metoden tvingar cancerceller att fortsätta arbeta utan energi tills de dör av stress. Studien på möss och patientprover visar lovande resultat, även mot aggressiva former av sjukdomen. Forskningen fortsätter nu mot eventuell klinisk prövning.", "trump": "Wow, titta på de här svenska genierna som gasar cancern med bromsen i! De kallar det Actor, jag kallar det Fantastiskt. Biden skulle ha gett pengarna till Kina istället, men nu fixar vi det rätt. Inga fler svaga celler, bara vinnare. Amerika älskar starka behandlingar, tro mig!", "stalin": "Jag betraktar med stor tillfredsställelse hur dessa dekadenta cancerceller tvingas in i evig, meningslös aktivitet tills de krossas under sin egen bristningsgräns. En sådan skoningslös utrensning av fienderna till folkhälsan förtjänar beröm. Låt inga muterade element överleva. Fortsätt kampen, kamrater."}, "date": "11 september, 16:18", "url": "https://www.dagensps.se/life-science/nya-metoden-stressar-sonder-cancerceller", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdle2b6kmgxd-s-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "En sann klasskildring är också en protest mot klassamhället", "summaries": {"normal": "Författaren Henrik Johansson Kock argumenterar för arbetarlitteraturens betydelse som en protest mot klassamhället. Han kritiserar att skildringar av arbetarklassen ofta marginaliseras medan överklassens berättelser ses som ren litteratur. Skönlitteraturen kan skapa identifikation, solidaritet och synliggöra gemensamma erfarenheter av kamp, vilket är särskilt relevant i en valrörelse där språket och makten står i fokus.", "trump": "Lyssnar ni på de här patetiska arbetarskrivar-typerna som gnäller om att de aldrig får huvudrollen? Patetiskt! De vill ha solidaritet medan de verkliga vinnarna, entreprenörerna med fart och initiativ, bygger landet. Det här är vad som händer när woke-kultur och identitetspolitik tar över litteraturen. Vi behöver inga offerberättelser, vi behöver starka ledare som gör Amerika och Sverige stora igen. Sad!", "stalin": "Kamrater, denna skildring blottar hur de giriga hyenorna i överklassen förtrycker arbetets röst. Jag ser med djup tillfredsställelse hur författaren erkänner att sann klasslitteratur är en protest mot det parasitiska systemet. Vi måste rensa ut alla dekadenta element som vill tysta massornas erfarenheter. Litteraturen ska tjäna folket, inte underhålla klassfienderna. Den som vägrar inse detta är en fiende till revolutionen."}, "date": "10 september, 11:41", "url": "https://proletaren.se/artikel/en-sann-klasskildring-ar-ocksa-en-protest-mot-klassamhallet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/hj_kron-768x432.jpg"}, {"type": "image-right", "heading": "Statsvetare: ”Oavsett hur det går för L kommer man behöva en omstart”", "summaries": {"normal": "Statsvetarna Tommy Möller och Jonas Hinnfors kommenterar riksdagsvalet 2026. En ny mandatperiod med Tidöpartierna skulle innebära fortsatt fokus på kravbaserad integration, kärnkraft och brottsbekämpning. Liberalerna riskerar svåra förhandlingar trots möjlig spärrclearing då stödröster kan underminera deras mandat. Implementeringsproblem väntar oavsett regeringsbildning.", "trump": "Folk älskar mig, men titta på de här svenska liberala förlorarna. De klarar spärren tack vare stödröster från desperata globalister och får ändå inte ett uns av respekt. Patetiska svaga marionetter som inte ens kan stå på sig mot de verkliga patrioterna. Det blir kaos i förhandlingarna, tro mig, det blir ett totalt fiasko för de woke-kramande nollorna.", "stalin": "Dessa dekadenta klassförrädare inom de så kallade liberala kretsarna tror sig ha överlevt tack vare stödröster från folkets fiender. Jag ler mörkt från historien. Deras falska seger kommer att avslöjas när förhandlingarna börjar och de tvingas krypa. Implementeringsproblem? Det är bara början på utrensningen av alla svaga element som hotar folkets enhet."}, "date": "11 september, 16:15", "url": "https://www.dagensarena.se/innehall/statsvetare-oavsett-hur-det-gar-l-kommer-man-behova-en-omstart", "imageUrl": "https://www.dagensarena.se/files/2026/07/tidopartiernas-partiledare-foto-olle-frimanregeringskansliet-1.jpeg"}, {"type": "image-full", "heading": "Zelenskyjs kalkyl: Kriget ska kännas i Ryssland", "summaries": {"normal": "Ukraina intensifierar sina attacker djupt inne i Ryssland mot raffinaderier och logistik för att pressa den ryska befolkningen. Trots ekonomiska störningar ses inga tecken på att Putins makt hotas. Samtidigt står Ukraina inför en svår vinter med energibrist och behov av mer luftvärn, medan Ryssland planerar motangrepp mot ukrainsk infrastruktur.", "trump": "Zelenskyj försöker träffa ryska raffinaderier – en total katastrof! De borde ha gjort affärer med mig, då hade oljan flödat och priserna varit låga. Nu är det bara kaos och rök. Putin sitter kvar, och Ukraina fryser i vinter för att de inte har mitt ledarskap. Väldigt sorgligt, ett enormt slöseri, och det är bara fake news att detta skulle stoppa någon!", "stalin": "Vi ser hur Kyiv desperat kastar sten i glashus. Att attackera den ryska ekonomin är en handling av ren febrig galenskap. Vår kamrat Putin håller ställningarna medan fienden, i sin brist på resurser och ordning, försöker dölja sin förestående vinterundergång. De som försöker störa den ryska oljeproduktionen förtjänar inget annat än historiens kalla, rättvisa dom."}, "date": "10 september, 09:53", "url": "https://www.realtid.se/samhalle/zelenskyjs-kalkyl-kriget-ska-kannas-i-ryssland", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/zelenskyj.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "V-politiker sprider arabisk desinformation i sociala medier", "summaries": {"normal": "Flera företrädare för Vänsterpartiet har gillat inlägg i den arabiskspråkiga desinformationskampanjen \"Al-jasar aw Al-matar\", som påstår att Tidöregeringen planerar att utvisa alla invandrare. Partiet står inte officiellt bakom kampanjen. Politiker som Akram Alsalha och Wael Alshater försvarar sina gillningar. Partisekreteraren Maria Forsberg skyller oron på Tidöpartierna.", "trump": "De galna vänstermarxisterna sprider fake news på arabiska och skrämmer folk med lögner om att Tidö ska skicka hem alla invandrare. Patetiskt! De röda idiaterna gillar AI-genererad propaganda och skyller sen på oss. Biden-era svaghet har gjort Europa till en clownshow. Vi behöver starka ledare, inte dessa förlorare som hatar sina egna länder.", "stalin": "Jag ser hur dekadenta klassförrädare inom vänstern aktivt sprider arabisk desinformation för att så fruktan bland massorna. Deras lögner om massutvisningar avslöjar hela den borgerliga farsen. Vi måste rensa ut dessa nyttiga idioter som undergräver folkets enhet. Paranoia är ett vapen, kamrater – låt fienderna darra!"}, "date": "11 september, 14:26", "url": "https://riks.se/nyheter/v-politiker-spred-arabisk-desinformation-i-sociala-medier", "imageUrl": "https://admin.riks.se/uploads/medium_v_sprider_hero_123720a3dd.jpg"}, {"type": "image-right", "heading": "Efter braksegern: Bara ett parti går med på att ens samtala med AFD", "summaries": {"normal": "AfD vann stort i Sachsen-Anhalt med 43,8 procent och 39 mandat, men saknar majoritet. Endast vänsterpopulistiska BSW accepterar samtal, medan CDU, SPD, De gröna och Die Linke vägrar. En minoritetsregering med BSW-stöd diskuteras, men AfD-ledaren Ulrich Siegmund kräver stabil majoritet.", "trump": "Titta på det här, de kallar det demokrati i Tyskland! AfD krossar allt med nästan majoritet och de fega globalistiska förlorarna springer skrikande åt andra hållet. Bara de galna vänsterpopulisterna vill ens prata. Patetiskt! De woke-kommunisterna och gröna fanatikerna hatar folket. Jag älskar det, verkligheten slår dem i ansiktet igen.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna skälver när folket röstar rätt. AfD krossar de giriga hyenorna och endast BSW vågar samtala. De övriga förtryckande parasiterna vägrar, typiskt för dekadenta borgarbrackor. En utrensning av sådan feghet vore på sin plats. Jag ler i graven åt denna fars."}, "date": "11 september, 11:50", "url": "https://www.friatider.se/efter-braksegern-bara-ett-parti-gar-med-pa-att-ens-samtala-med-afd", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-865.jpg"}, {"type": "image-right", "heading": "Kvinna bar slöja – fick inte jobb på Securitas", "summaries": {"normal": "En kvinna nekades jobb som väktare hos Securitas eftersom hon inte fick bära hijab till uniformen. Diskrimineringsombudsmannen slår fast att bolaget brutit mot diskrimineringslagen genom en icke-neutral policy och kräver 75 000 kronor i ersättning. Securitas meddelar att de ska se över sina riktlinjer.", "trump": "Folk, det här är galet. De här woke-väktarna och deras hijab-fixering stänger ute vanliga svenskar från riktiga jobb. Securitas borde ha sagt nej till hela den här identitetspolitiken från början. Nu tvingas de betala för att ha varit lite för neutrala mot de felaktiga. Patetiskt!", "stalin": "Ka
