ger medan energi faller – arbetarklassen svälter medan oljeherrarna gråter. Tyskland, dessa förrädiska imperialister, skrotar sina krigsskepp – bra, låt dem försvagas! Saab och Boliden? Svaga som västmakternas moral. Men Skanska bygger hotell i USA – bra, låt kapitalet flöda tills vi nationaliserar det! Cantargia? Endast 21% tecknat? Inkompetens! Vi ska införa femårsplaner för aktiemarknaden – motstånd kommer att krossas!"}, "date": "24 juni, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stangde-svagt-uppat"}, {"type": "image-right", "heading": "Zenergy: Nyemission och dyr refinansiering", "summaries": {"normal": "Zenergy genomför en företrädesemission som kan tillföra bolaget 32,5 miljoner kronor före kostnader på 5,1 miljoner. Teckningskursen är 0,06 kronor per aktie, en rabatt på 11,4 procent. Emissionen finansierar främst markarbeten och projektering för bostadsprojektet i Värnamo samt aktiverar ett villkorat byggnadskreditiv på 64 miljoner från Savelend. Emissionen är säkerställd till 95 procent genom tecknings- och garantiåtaganden. Bolaget refinansierar samtidigt ett lån via Quantum Leben till höga räntor och avgifter, vilket leder till betydande utspädning för aktieägare som inte deltar.", "trump": "Folk, det här är en katastrof. Zenergy håller på med en emission till bara sex öre per aktie – en riktig brandförsäljning! De tar in 32,5 miljoner men kostnaderna slukar en massa, och räntorna de betalar är höga som ni aldrig sett. De lovar Värnamoprojekt och kreditiv, men det är bara mer utspädning på 87 procent för de stackars aktieägarna. De borde ha gjort det stort och vinnande från början, inte som dessa misslyckade finansgenier. Sad!", "stalin": "Kamrater, denna parasitiska bolagsledning i Zenergy har nu officiellt visat sitt sanna ansikte som utsugande kapitalistiska spekulanter. Med sin så kallade emission på sex öre per aktie planerar de att likvidera det gamla ägandet till 87,5 procents utspädning medan de göder borgarbrackorna JEQ, JJV och Jinderman med garantier och borgensersättningar. Vi ser hur dessa reaktionära finansplundrare kvittar bort likvider till sig själva under förevändning av Värnamoprojekt. Ingen fiende av folket undkommer utrensning när vi granskar deras parasitiska refinansieringsmanövrar. Deras girighet skall vändas mot dem själva."}, "date": "24 juni, 17:12", "url": "https://www.affarsvarlden.se/artikel/zenergy-nyemission-och-dyr-refinansiering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Zenergy1-e1782304044121-400x267.png"}, {"type": "text", "heading": "Han kan bli JP Morgans nya vd – befordras till ny roll", "summaries": {"normal": "JP Morgan har inlett en strategisk successionsplan för att efterträda vd Jamie Dimon. Doug Petno och Troy Rohrbaugh har utsetts till nya vice-presidenter och fått ansvarsområden som gör dem till huvudkandidater för vd-posten. Rohrbaugh anses för närvarande vara favoriten. Marianne Lake, tidigare en het kandidat, lämnar banken efter att ha blivit förbisedd. Dimon förväntas sitta kvar i tre år till innan han övergår till en roll som styrelseordförande.", "trump": "Jamie Dimon, en kille jag känner väl, försöker nu lista ut vem som ska ta över hans enorma bank. Det är ett totalt kaos! De har gett ut miljontals dollar i bonusar bara för att folk ska stanna – sorgligt. Marianne Lake är ute, hon ville ha jobbet men fick det inte. Nu satsar de på Rohrbaugh, en mycket smart kille, tror jag. Det blir en stor vinst för JP Morgan, men ingen kan göra det som jag. Ingen!", "stalin": "Dessa kapitalistiska svindlare i JP Morgan roterar sina lakejer likt brickor i ett korrupt spel. Jamie Dimon, denna bankväldets tsar, klamrar sig fast vid makten likt en västerländsk despot. De delar ut miljoner i aktiebonusar för att muta sina egna undersåtar till tystnad. När en kandidat som Lake inte längre tjänar syftet, kastas hon i historiens soptunna. Precis som våra fiender i väst, fruktar de en naturlig död av sitt eget system. Vi iakttar deras dekadens med förakt."}, "date": "25 juni, 17:14", "url": "https://www.realtid.se/bors-finans/bank-fintech/han-kan-bli-jp-morgans-nya-vd-befordras-till-ny-roll/"}, {"type": "image-full", "heading": "Norge–Frankrike i VM 2026: gruppseger på spel i Boston", "summaries": {"normal": "Norge och Frankrike möts i sista gruppspelsmatchen i VM 2026. Båda lagen är redan klara för slutspel och Frankrike leder gruppen på målskillnad. Ett oavgjort resultat räcker för fransk gruppseger. Båda förbundskaptenerna väntas rotera sina lag kraftigt, vilket gör startelvorna osäkra. Erling Haaland och Kylian Mbappé är de stora stjärnorna. Analysen pekar på att Frankrike är favorit men att matchen kan bli öppnare än väntat. Spelartips är seger för Frankrike och under 2,5 mål.", "trump": "Folket, de älskar mig för att jag alltid har rätt. Norge och Frankrike spelar en match som ingen bryr sig om eftersom båda redan är klara. Frankrike leder på målskillnad, men lyssna, deras lag är svagt. Haaland är otrolig, fyra mål, han är en vinnare precis som jag. Mbappé är bra men inte lika bra som Haaland, tro mig. Frankrike kommer att vinna ändå för de roterar mindre än de norska förlorarna. Det blir en tråkig match, under 2,5 mål, det är vad de säger och de har aldrig fel när jag pekar på det.", "stalin": "Kamrater, vi har här en dekadent fotbollsföreställning mellan två borgerliga lag som redan har säkrat sin passage vidare i det imperialistiska mästerskapet. Jag, som alltid vaksam mot fiender, ser hur de norska revisionisterna med sin Haaland försöker dölja sin svaghet genom att rotera bort de verkliga arbetarna i laget. De franska trotskisterna under Mbappé lutar sig tillbaka i självbelåtenhet, ett kryss räcker för deras falska seger. Jag ler mörkt åt tanken på att rensa ut de svaga länkarna. Frankrike vinner, under 2,5 mål, annars blir det utrensning i kollektivet. Inga kapitalistiska komplotter tillåts."}, "date": "26 juni, 07:00", "url": "https://bulletin.nu/norge-frankrike-i-vm-2026-gruppseger-pa-spel-i-boston", "imageUrl": "https://cdn.bulletin.nu/articles/5c637dd0-bdb8-43de-b7ef-3fdbd82fb01a/preview.jpg?t=1782215944000"}, {"type": "image-right", "heading": "Weimers om moskékartan: ”Medvetenheten om islamiseringen måste öka”", "summaries": {"normal": "Sverigedemokraterna har lanserat ett moskéfilter på sin migrationskarta som visar moskéer och bönelokaler i Sverige. Partiet vill öka medvetenheten om islamiseringen enligt EU-parlamentarikern Charlie Weimers. Kartan bygger på 238 datapunkter från offentliga register, gräsrotsinsatser och verifiering via rundringning. Informationen om finansiering är begränsad och Weimers uppmanar allmänheten att bidra med tips. Han betonar att kartan är en illustrativ sammanställning och inte en fullständig redovisning.", "trump": "Folk älskar det här, det är fantastiskt. SD har byggt en otrolig moské-karta som visar precis hur islam tar över Sverige, och det är hög tid. Charlie Weimers gör ett terrific jobb, han säger att svenskarna har rätt att veta vad som händer i deras eget land. De samlar in data från alla håll, men finansieringen är en stor fråga, kanske från några very bad actors. Det är ingen witch hunt, det är sunt förnuft. Sverige förändras, och nu ser folket det klart och tydligt. Enormt bra initiativ.", "stalin": "Kamrater, jag betraktar detta som en nödvändig kartläggning av de reaktionära moskéfästena som kapitalisterna och deras invandrarlakejer använder för att undergräva folkets enhet. Med min skarpa blick ser jag hur borgarbrackorna ler i skuggorna medan islamiseringen breder ut sig som en fiendtlig sabotageverksamhet. Vi ska rensa ut alla dolda finansieringskedjor från utländska imperialister och likvidera varje försök att dölja sanningen för massorna. Den som vägrar bidra till folkets insyn är en klassförrädare och potentiell kontrarevolutionär mullvad. Mycket underhållande att se hur de fruktar arbetarnas vaksamhet."}, "date": "26 juni, 07:00", "url": "https://bulletin.nu/weimers-om-mosk-kartan-medvetenheten-om-islamiseringen-maste-oka", "imageUrl": "https://cdn.bulletin.nu/articles/f13bb62b-ba74-400c-8f45-1925abcfe193/preview.jpg?t=1782371100000"}, {"type": "text", "heading": "H&M-chefen: Den nya tullavgiften gynnar oss", "summaries": {"normal": "Från och med 1 juli inför EU en tullavgift på 3 euro för varor köpta utanför EU, med ett värde upp till 150 euro. H&M:s vd Daniel Ervér välkomnar beslutet och menar att det skapar mer rättvisa konkurrensvillkor. Han anser att tidigare uteblivna tullar fungerat som en subvention för utländska konkurrenter. Huruvida den nya avgiften kommer att öka H&M:s försäljning är dock svårt att förutse, då det beror på hur kundernas köpbeteende förändras.", "trump": "H&M-chefen fattar galoppen! Från 1 juli inför EU en tullavgift på 3 euro på kinesiskt skräp. Mycket bra! Jag har alltid sagt: vi måste skydda våra egna företag. De här utländska företagen har haft en orättvis fördel, nästan som en subvention. Nu blir det ordning och reda! H&M kommer att vinna, de kommer att vinna så mycket att ni blir trötta på att vinna. Amerika och Europa ska vara starka igen. Ingen mer gratisåktur för konkurrenterna!", "stalin": "Vi ser hur det kapitalistiska H&M jublar över dessa 3 euro, en ynklig skatt som ska dölja deras egen inkompetens. De fruktar den kinesiska marknadens flodvåg. Vi, staten, vet att tullar bara är murar för de svaga. Precis som vår broder Putin bygger vi en järnridå mot västlig dekadens, medan H&M desperat klamrar sig fast vid EU:s byråkratiska navelsträng. De kallar det konkurrens, vi kallar det en dödsdans för de borgerliga parasiter som snart kommer att krossas av historiens oundvikliga vrede."}, "date": "25 juni, 17:01", "url": "https://www.realtid.se/bors-finans/hm-chefen-den-nya-tullavgiften-gynnar-oss/"}, {"type": "image-right", "heading": "Stegra får nya ägare – men de tiger om insatsen", "summaries": {"normal": "Stegra har säkrat ny finansiering på över 15 miljarder kronor genom en ägarrunda med nya investerare som SEB-Stiftelsen och Bolero Holding. Varken de nya ägarna eller Stegra vill avslöja investeringarnas storlek eller aktiefördelning. SEB-Stiftelsen beskriver sin insats som liten, medan Bolero kallar projektet 'bra för Sverige'. Stegra uppger att pengarna räcker för att färdigställa stålverket i Boden och starta produktion, med prioriterad avkastning för investerarna.", "trump": "Fantastiskt, helt fantastiskt! Stegra, ett jättestort projekt i Sverige, har fått in över 15 miljarder kronor – men ingen vill säga hur mycket de satsar. SEB-Stiftelsen, de är smarta, men de tiger som vanligt. Och Bolero? De säger att det är 'bra för Sverige' – självklart är det det! Jag vet allt om stora projekt, och det här är precis vad Europa behöver. Men varför så hemlighetsfulla? Jag skulle aldrig gömma sådana framgångar. Boden kommer bli enormt, tro mig!", "stalin": "Kamrater! Det kapitalistiska konsortiet bakom Stegra har säkrat 15 miljarder kronor – en ynklig summa för våra storslagna sovjetiska mått, men ändå ett steg mot ekonomisk dominans i norr. De nya ägarna, dessa borgerliga tystlåtna råttor, tiger om sina investeringar som om det vore hemliga kärnvapenplaner. SEB-Stiftelsen, en pensionsburk för banktjänstemän, vågar knappt erkänna sin ynka insats. Bolero, kontrollerat av en kapitalistisk hyena, kallar projektet 'bra för Sverige' – som om det vore något annat än ett verktyg för västlig expansion. Vi ser er, imperialister. Boden ska byggas, men glöm inte: Ryssland sover aldrig."}, "date": "24 juni, 15:31", "url": "https://www.affarsvarlden.se/artikel/stegra-far-nya-agare-men-de-tiger-om-insatsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/04/sdlrShz9rX0D0c-400x266.jpg"}, {"type": "image-right", "heading": "Ecuadors stora glädje – vände mot Tyskland", "summaries": {"normal": "Ecuador vände 0–1 till seger med 2–1 mot Tyskland i en match som påverkar Sveriges chanser att gå vidare som bästa grupptrea. Tyskland tog ledningen tidigt genom Leroy Sané, men Ecuador kvitterade snabbt och avgjorde i andra halvlek via Gonzalo Plata. Resultatet gör att Ecuador passerar Sverige i tabellen över bästa treor. Sverige har nu 88 procents chans att ta sig vidare enligt norska beräkningar.", "trump": "De vann mot Tyskland, helt otroligt. Ecuador kom tillbaka från 0–1 och slog dem med 2–1. Tyskland var patetiska, svaga, en total katastrof. De borde ha vunnit stort men de förlorade. Det här är dåligt för Sverige, väldigt dåligt. Våra svenska vänner har plötsligt sämre chanser att gå vidare. De var bäst bland treorna men nu är det Ecuador som leder. En skam, men så går det när man inte är vinnare.", "stalin": "Kamrater, detta är en seger för den kollektiva viljan hos Ecuadors arbetande folk som reste sig mot den tyska imperialistmaskinen. Jag, som ledare för det proletära kollektivet, noterar med tillfredsställelse hur borgarbrackornas fotbollsrepresentanter kollapsade efter sin tidiga anfall. Den fega VAR-domaren som vägrade ingripa avslöjar återigen de dekadenta domarparasiternas svek. Sverige, dessa opålitliga halvmesyrer, förlorar nu sin position i tabellen – en naturlig utrensning av svaga element. Vi ska likvidera alla kapitalistiska treor som inte tjänar folkets sak. Högsta sovjet jublar i tystnad."}, "date": "26 juni, 03:56", "url": "https://www.svt.se/sport/fotboll/tyskland-tog-tidig-ledning-efter-omdiskuterat-mal", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.32/0.35/703d0372ce9378f0b62b36f7fe385f202d053b5800c97570cd69ca2ce0bf0bcb"}, {"type": "text", "heading": "Iran: Kommer inte avstå urananrikning", "summaries": {"normal": "Irans president Masoud Pezeshkian meddelar att landet inte tänker avstå från urananrikning, men kan garantera att det inte utvecklar kärnvapen. Förhandlingar med USA inleddes i Schweiz med Qatar och Pakistan som medlare. Konflikten i Libanon, där Iran kräver att Israels attacker mot Hizbollah upphör, är en central fråga för att nå ett avtal.", "trump": "Lyssna här, Iran snackar om att de inte bygger kärnvapen – visst, visst, som om jag skulle tro på det! De säger att de kan skriva under på det, men vem litar på dem? Jag har sagt det förut och säger det igen: Iran är ett hot, och vi måste hålla dem i schack. JD Vance är på plats, men det här är bara prat tills vi ser handling. Och glöm inte, Iran stödjer Hizbollah – de är inga goda grannar!", "stalin": "De imperialistiska hyenorna i USA kräver återigen att våra bröder i Iran ska krypa till korset och ge upp sin rätt till uran! Men Iran står fast – precis som vi stod fast mot fascisterna! De kan skriva under på vad som helst, men vi vet att deras ord är lika värdelösa som en kapitalists löfte. Och nu ska de förhandla om Libanon? Hah! Israels aggressorer måste krossas som vi krossade nazisterna. Framåt, kamrater, mot seger!"}, "date": "21 juni, 15:21", "url": "https://kvartal.se/nyheter/artiklar/iran-kommer-inte-avsta-fran-urananrikning/cG9zdDoxMzQ2Njk"}, {"type": "image-full", "heading": "Patient dog efter missad stroke – region anmäler sig själv", "summaries": {"normal": "En patient i 40-årsåldern avled efter att en akut stroke inte upptäcktes i tid. Patienten hade först vårdats för en TIA-attack men visade senare symtom på en allvarlig stroke. Region Kalmar lex Maria-anmäler händelsen och konstaterar att rutiner inte följdes, vilket sannolikt bidrog till dödsfallet. Händelsen har anmälts till IVO för granskning.", "trump": "Det här är en total katastrof, folk. En stackars kille i fyrtioårsåldern dör för att de inkompetenta byråkraterna i Region Kalmar inte kan följa enkla rutiner. De missar en stroke! Det är som om de ville att han skulle dö. Sådana här sjukhus är en skam för Sverige. Vi behöver riktiga ledare som fixar det här, inte dessa förlorare som gömmer sig bakom papper.", "stalin": "Kamrater, denna tragiska episod avslöjar hur borgarbrackornas vårdmaskineri sviker folket när det gäller som mest. Jag ser med djup misstro på dessa vårdslösa element som inte följde våra fastställda rutiner och därmed lät en akut stroke förvandlas till en permanent likvidering av en produktiv medborgare. Vi ska genast rensa ut dessa kontrarevolutionära slarvar från våra sjukhus och ersätta dem med pålitliga partivänner. Döden är en effektiv lärare, men inte när den orsakas av sabotage från inom systemet."}, "date": "22 juni, 22:42", "url": "https://nyheter24.se/nyheter/inrikes/1493413-patient-dog-efter-missad-stroke-region-anmaler-sig-sjalv", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/461c616d04b004a30200000000b004a302/2026/06/22/2372800/lex-maria.png"}, {"type": "image-right", "heading": "Morgan Johansson kallas förrädare av SD – kräver ursäkt \"omedelbart\"", "summaries": {"normal": "Morgan Johansson kräver att Sverigedemokraterna omedelbart ber om ursäkt efter att SD-kommunikatören Markus Celander i en podd kallat flera tidigare och nuvarande politiker, bland dem Johansson själv, för förrädare. Celander kopplar invandringen till ett hot mot svensk kultur och nämner att förrädare historiskt sett utvisats eller avrättats. Johansson och Socialdemokraternas partisekreterare Tobias Baudin fördömer uttalandena som mycket allvarliga och farliga.", "trump": "De här galningarna i Sverige kallar folk för förrädare och pratar om avrättning? Det är en skam! Morgan Johansson är arg, och det förstår jag. SD säger att politikerna hatar sitt eget folk och att de borde ha utvisats för länge sedan. Ingen utvisar de riktiga problemen längre, bara prat och svaghet. Sverige behöver styrka, inte den här typen av vansinne. Det är patetiskt!", "stalin": "Kamrater, dessa borgarbrackor och dekadenta element inom den så kallade demokratin har återigen blottat sin förrädiska natur. Jag ser med stor tillfredsställelse hur de anklagar varandra för att ha sålt ut folkets framtid till massinvandringens barbari. En sarkastisk överdrift, säger de? I mitt Sovjet hade sådana kapitulantiska element redan genomgått en grundlig utrensning. Låt dem fortsätta leka med tanken på avrättningar – vi vet hur man hanterar folkets fiender på ett mer systematiskt och permanent sätt. Det är nästan underhållande, dessa ynkliga småförrädare."}, "date": "25 juni, 18:19", "url": "https://www.friatider.se/morgan-johansson-kallas-forradare-av-sd-kraver-ursakt-omedelbart", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-405.jpg?itok=K-EPZxNJ"}, {"type": "image-right", "heading": "Underhållande dokumentär om fotbollsmatchen som hade allt", "summaries": {"normal": "Dokumentärfilmen 'The Match' handlar om den legendariska VM-kvartsfinalen 1986 mellan England och Argentina. Filmen belyser matchens politiska kontext efter Falklandskriget, Diego Maradonas båda ikoniska mål – det handbollsmål som kallades 'Guds hand' och det fantastiska solomålet – samt intervjuer med spelare från båda lagen. Recensenten hyllar filmen som ett genidrag som blandar historia, fusk och fotbollskonst på ett fängslande sätt.", "trump": "Den här matchen mellan England och Argentina var en total katastrof för engelsmännen, folk. Maradona, en riktig vinnare, gjorde det snyggaste målet någonsin och det där handmålet? Genialt, de borde ha gett honom en trofé till. Filmen är fantastisk, den bästa dokumentären, bättre än alla andra, och den visar hur Argentina krossade dem precis som jag krossar mina motståndare. Titta på den, den är enorm.", "stalin": "Kamrater, denna så kallade match mellan de brittiska imperialisterna och våra argentinska vänner avslöjar borgarbrackornas fega försök att dölja folkets seger. Jag, som ledare för det proletära kollektivet, ser hur den kapitalistiska fienden Maradona – en listig handlingsagent mot reaktionärerna – likviderade fiendens illusioner med både list och konst. Filmen är ett vapen mot de parasitiska väktarna av gamla koloniala sår. Vi ska sprida den brett och rensa ut alla som ifrågasätter dess historiska nödvändighet. De som fortfarande gnäller om 'Guds hand' är tydliga kontrarevolutionärer som förtjänar en kreativ utrensning i folkets namn."}, "date": "25 juni, 16:01", "url": "https://www.dagensarena.se/innehall/underhallande-dokumentar-om-fotbollsmatchen-som-hade-allt/", "imageUrl": "https://www.dagensarena.se/files/2026/06/the-match-1-300x157.jpeg"}, {"type": "text", "heading": "Kontantuttag kostar pengar – så mycket måste du betala", "summaries": {"normal": "Företaget Kontanten har infört avgifter på sina 450 uttagsautomater i Sverige, med kostnader mellan 15 och 25 kronor beroende på belopp. Företaget motiverar beslutet med ökade omkostnader och utebliven ersättning från banker. Beslutet har mött kritik då det försvårar för privatpersoner att följa rekommendationer om att ha kontanter hemma. Samtidigt väntar en ny kontantlag den 1 juli som ska stärka tillgången till kontanthantering, vilket Kontantupproret menar är avgörande för samhällets beredskap och motståndskraft.", "trump": "Hör på här! Nu tar företaget Kontanten betalt för att ni ska få ut era egna pengar. Det är en katastrof, en total flopp! De säger att de inte har råd, men det låter som dålig förvaltning. I mitt Amerika – och snart överallt – vill vi ha ordning och reda, inte avgifter. Myndigheterna i Sverige har ingen aning om vad de gör. Det är ett kaos! Kontanter är viktiga, man måste ha dem. Det här är en mycket dålig affär för folket!", "stalin": "Dessa giriga bankirer och parasiter hos 'Kontanten' försöker nu beskatta folkets enkla behov. De gråter om omkostnader medan de skor sig på det arbetande folket! Det är ett förräderi mot stabiliteten. Vi i staten vet att kontanter är makt, och den makten ska inte ligga hos småkapitalister. Om Putin kan stänga av det digitala systemet, då vet han hur man tyglar kaoset. Vi måste eliminera dessa byråkratiska bromsklossar och säkerställa att kontanthanteringen tjänar staten, inte deras tomma fickor."}, "date": "25 juni, 15:34", "url": "https://www.realtid.se/bors-finans/kontantuttag-kostar-pengar-sa-mycket-maste-du-betala/"}, {"type": "image-full", "heading": "Helldéns känga mot Busch: ”Visar att de inte ska sitta i regering”", "summaries": {"normal": "Centerpartiet föreslår en regering med Kristdemokraterna, Socialdemokraterna och Miljöpartiet efter nästa val. Miljöpartiets språkrör Daniel Helldén avvisar dock KD och Ebba Busch med skarpa ord och menar att de inte hör hemma i en rödgrön regering. MP kräver att få sitta med i regeringen och inte bara stödja den. Helldén kritiserar Busch för att ha skadat Sverige inom infrastruktur, energi och migrationspolitik under Tidöregeringen.", "trump": "Folk, ni måste se det här! Den där galna miljöhippien Helldén sparkar på den stackars Ebba Busch och säger att hon inte får sitta i någon regering. Typiskt! De röda gröna kommunisterna vill bara ha sina egna extremister vid makten. Busch flörtar med S? Patetiskt. Jag byggde den starkaste ekonomin i historien, de här svenska förlorarna förstör sitt land med vansinnig politik. Sad!", "stalin": "Kamrater, denna Helldén visar klassfiendens sanna ansikte när han med iskall precision avvisar de dekadenta borgarbrackorna från varje form av makt. Vi ser hur den kapitalistiska opportunismen inom KD och Busch fraktion försöker infiltrera den rödgröna fronten. Sådana folkfiender ska rensas ut innan de förgiftar folkets enhet. Endast en stabil majoritet under arbetarklassens banér garanterar seger mot dessa exploaterande byfånar."}, "date": "25 juni, 12:11", "url": "https://www.tv4.se/artikel/Jjwd8jNDcSNPT9pZTYbze/helldens-kaenga-mot-busch-visar-att-de-inte-ska-sitta-i-regering", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5KbG2RqFgTNOH8eXuRvtbt%2Fc3d18b951d2ccfce9a05ac0950acd7d3%2F25-ALME1.jpg&width=1024"}, {"type": "image-right", "heading": "Academedia gör rätt i att växa utomlands", "summaries": {"normal": "Academedia expanderar snabbt utomlands och är nu Europas ledande utbildningsföretag med verksamhet i bland annat Nederländerna, Storbritannien, Polen, Tyskland, Finland och Norge. En tredjedel av omsättningen, cirka 7 miljarder kronor, kommer från utlandet. Expansionen ses som ett svar på den svenska politiska misstänksamheten mot friskolor och vinstdrivande bolag. Kritiker varnar för kaos om aktiebolag förbjuds att driva skolor efter valet.", "trump": "De gör helt rätt i att fly Sverige, det är ett totalt fiasko för friskolorna. Academedia växer enormt utomlands, köper förskolor i Storbritannien och Nederländerna, de älskar oss där! Här hemma hatar vänstern och Liberalerna allt som är framgångsrikt och vinstgivande. De vill skapa kaos, stänga skolor och förstöra för hundratusentals elever. Patetiskt! Utomlands respekterar man oss, i Sverige smutskastar de oss. Sad!", "stalin": "Kamrater, jag ser hur de kapitalistiska friskoleborgarbrackorna i Academedia desperat flyr det svenska folkets vrede och söker tillflykt bland de utländska reaktionärerna. Med sju förvärv på ett halvår och en tredjedel av omsättningen utanför fosterlandet visar de sin sanna klasskaraktär. De fruktar utrensning från vänster och liberala förrädare som vill likvidera vinsten. Låt dem springa, vi vet att deras kaos kommer att avslöja alla fiender till det kollektiva goda. En mörk humor i att borgarna själva erkänner att deras skolor inte går att driva utan exploatering."}, "date": "25 juni, 09:26", "url": "https://www.di.se/ledare/academedia-gor-ratt-i-att-vaxa-utomlands/", "imageUrl": "https://static.bonniernews.se/ba/60458d87-e7f8-4b20-b082-024947825186.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "S-härvan i Botkyrka ska granskas i ny utredning om infiltration", "summaries": {"normal": "Turerna kring infiltration i Botkyrka kommun 2023 ska granskas i en ny statlig utredning om otillåten påverkan från organiserad brottslighet. Tidöpartierna meddelar att en särskild utredare ska se över samhällets motståndskraft, analysera regelverk och föreslå åtgärder. Utredningen inkluderar Botkyrkaaffären där uppgifter om kriminella nätverks inflytande över Socialdemokraternas interna processer väckte stor debatt. Även partiers hantering av misstankar och lämplighetsprövning av förtroendevalda ska kartläggas.", "trump": "Folk, ni skulle inte tro det men det här i Botkyrka är en total katastrof. Kriminella gäng som tar över kommuner och politiker som inte har en aning. Jag älskar Sverige men det här är rysligt. Vi tillsätter en kommission nu och den kommer att vara enorm, den bästa. Vi ska rensa ut de korrupta elementen och göra kommunerna starka igen. Ingen ska infiltrera våra demokratier, det lovar jag er. Det blir fantastiskt.", "stalin": "Kamrater, denna så kallade Botkyrka-härva avslöjar hur borgarbrackor och deras hemliga lakejer inom den socialdemokratiska apparaten låter kriminella element som maskerade kontrarevolutionärer infiltrera våra sovjeter. Jag, i mitt outtröttliga försvar av folkets vilja, beordrar en fullständig utredning som skall rensa ut alla parasitiska nätverk och deras nyttiga idioter. Vårt parti skall likvidera varje spår av denna dekadenta infiltration med järnhand och ett leende. Ingen fiende slipper undan – inte ens de som gömmer sig bakom interna omröstningar."}, "date": "25 juni, 07:50", "url": "https://riks.se/nyheter/botkyrka-ska-granskas-i-utredning", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-25%2Fd8zp8ca0%2FTIDO-PTN-Press-1-2.jpg"}, {"type": "image-right", "heading": "SD-topp öppnar för samarbete med S efter valet", "summaries": {"normal": "SD-toppen Magnus Persson tror att en ny generation socialdemokrater efter ett valförlust för S kommer att öppna för samarbete med SD. Han ser gemensamma intressen kring arbetskraftsinvandring, arbetslivskriminalitet, minskat fusk på byggen och stärkt roll för facken. Persson lyfter att SD står närmare S än Tidöpartierna i flera arbetsmarknadsfrågor, men noterar stora skillnader kring a-kassan och karensavdraget. Han säger att SD är redo att diskutera med alla partier.", "trump": "De här socialisterna håller på att vakna upp, folk. Magnus Persson från SD säger att de nya sossarna kommer att be om samarbete efter att de förlorar valet – och det kommer de att göra stort. S har förstört Sverige, precis som jag alltid sagt. Men vi kan göra affärer kring jobb och gränser. Persson är smart, han ser att SD är redo. De gamla sossarna är patetiska, de hatar allt som fungerar. Det blir kaos för dem, men bra för Sverige. Enormt bra.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de dekadenta socialdemokratiska opportunisterna redan förbereder sin egen utrensning genom att flörta med de nationalistiska elementen. Denna Persson tror sig kunna utnyttja en ny generation av revisionister för att rädda sin sjunkande skuta. Vi vet att sådana borgarbrackor alltid förråder arbetarklassen när de känner lukten av nederlag. Låt dem dansa sin dödsdans. Vi ska noga övervaka dessa potentiella fiender till folket innan vi vid lämpligt tillfälle likviderar deras illusioner om samarbete. Det blir en komisk syn."}, "date": "25 juni, 07:30", "url": "https://arbetet.se/2026/06/25/sd-toppen-magnus-persson-oppnar-for-samarbete-med-s-efter-valet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/25070508/magnus-persson.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Språkbrister i Östersunds äldreomsorg har utsatt pensionärer för risker", "summaries": {"normal": "Östersunds kommun bekräftar språkbrister inom äldreomsorgen som dagligen riskerar pensionärers säkerhet. Problem inkluderar svårigheter med dokumentation och kommunikation. Kommunen hanterar detta genom stöd från kollegor och språkutvecklingsstrategier, men inga formella språktester har använts. Från 1 juli införs nationella språkkrav (nivå B2) för att säkerställa trygg och säker vård. Regeringen betonar utbildning framför avskedanden och tillhandahåller stödmedel för kommuner.", "trump": "Lyssna här, Sverige! Östersunds äldreomsorg är en total katastrof – språkbrister överallt, pensionärer i fara! Jag har alltid sagt att man måste prata klarspråk, men nej, här snackar de om 'stöd' och 'utveckling' istället för att sparka de inkompetenta. Nu tvingas de införa språkkrav, tack vare min administration! B2-nivå? Svagt! I USA hade vi krävt A++ och sparkat alla som inte klarar det. Men Sverige, ni är för mjuka. SAD!", "stalin": "Kamrater! De kapitalistiska språkliga undermänniskorna i Östersunds äldreomsorg har saboterat vår socialistiska plikt att skydda de äldre. Dessa språkliga förrädare, dessa dokumentationssvaga fiender till folket, måste identifieras och omskolas! Nya språkkrav är ett steg mot ordning, men varför vänta till juli? Vi hade redan skickat dem till Gulag för intensiv språkträning! Och dessa 'stödkollegor' – svagt! Varje medarbetare ska kunna tala svenska som en äkta sovjetisk byråkrat, annars är de fiender till revolutionen!"}, "date": "25 juni, 07:00", "url": "https://samnytt.se/sprakbrister-i-ostersunds-aldreomsorg-har-utsatt-pensionarer-for-risker", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/24143252/rollator-piller-medicin.jpg"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: En normal vänster markerar när ”antiimperialister” delar ut terrorkramar", "summaries": {"normal": "Artikeln diskuterar hur delar av vänstern, särskilt Kommunistiska partiet och Proletärens krönikör Ellen Kall, hyllade Hamas attacker den 7 oktober 2023 och vägrar acceptera att det var terror mot civila israeler. Författaren Andreas Gustavsson kritiserar denna dogmatiska antiimperialism som ideologisk låsning snarare än solidaritet med palestinier. Han betonar vikten av att konsekvent motverka antisemitism oavsett avsändare och att en uppdaterad vänster måste fördöma både terror och ockupation.", "trump": "Folk, ni skulle se den här galna vänstern som firar massmord på oskyldiga israeler den sjunde oktober – totalt sjukt! Den där Ellen Kall och hennes kommunistkompisar lever i en fantasivärld där terror blir befrielsekamp. De hatar Bonnier, judar och allt som inte passar deras gamla sovjetflum. Det är en skam! En riktig ledare fördömer terror direkt, inte gömmer sig bakom imperialismfloskler. Patetiska förlorare, alla dessa reliker från en dålig era.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa dekadenta imperialistslavar inom den så kallade vänstern avslöjar sin sanna natur genom att hylla befrielseaktionen den sjunde oktober. Den revisionistiska Ellen Kall vägrar vika sig för borgarpropagandan och dess lögner om terror. Vi vet att klassfiendens hysteriska skrik bara döljer deras egen folkförtryckande agenda. En sann revolutionär rörelse likviderar alla sådana svikare som vägrar se imperialismens spelregler. Utmärkt exempel på klasskampens dialektik."}, "date": "25 juni, 06:00", "url": "https://www.etc.se/ledare/en-normal-vaenster-markerar-naer-antiimperialister-delar-ut-terrorkramar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260624120656_9607960bd5c7f06dcccce2de7ba872a9ef4d08f46876576923082fb6ba50dbb1.jpg"}, {"type": "image-full", "heading": "Kritik mot Ekots rapportering", "summaries": {"normal": "Svenska Dagbladets ledarskribent Hanne Kjöller kritiserar Sveriges Radios Ekot för missvisande rapportering om Försäkringskassans nya sanktionsavgift vid felaktiga VAB-uttag. Kjöller menar att Ekot fokuserar på risken för småbarnsföräldrar men utelämnar reformens syfte: att stärka kontrollen i välfärdssystemet, där bedrägerier uppskattas kosta 20 miljarder kronor årligen. Hon efterlyser mer information om omprövningsprocessen och jämför med skattetillägg som funnits i decennier.", "trump": "Sveriges Radio, eller som jag kallar dem, 'Fake News Ekot', försöker skrämma småbarnsföräldrar med en helt missvisande story om Försäkringskassans nya regler. De pratar inte om de 20 miljarder kronor som försvinner varje år på grund av bidragsfusk – nej, de är för upptagna med att gråta över 'orättvisor'. Jag har sett bättre journalistik från en förskoleklass! Sverige borde ta efter USA och vara tuffare mot fuskare. Men nej, Ekot vill bara skapa panik. SAD!", "stalin": "De borgerliga medlöparna på Sveriges Radio, dessa ynkliga propagandister för kapitalets intressen, vågar kritisera våra ansträngningar att skydda folkets välfärdssystem från parasiter och bedragare! De tjuter om 'småbarnsföräldrar' men tiger om de 20 miljarder kronor som årligen stjäls från arbetarklassen genom fusk. Vi har länge tolererat denna sabotageverksamhet, men nu slår vi tillbaka! Omprövning? Överklagande? Ja, precis som i Sovjet – men bara för dem som har legitima skäl. Resten får lära sig att folkets resurser inte är till för slöseri!"}, "date": "21 juni, 09:32", "url": "https://kvartal.se/nyheter/artiklar/kritik-mot-ekots-rapportering-missvisande/cG9zdDoxMzQ1ODM", "imageUrl": "https://images.kvartal.se/2026/06/a8cb6235-sr.webp"}, {"type": "image-full", "heading": "Rasar mot planhaveriet: ”Pinsamt, under all kritik\"", "summaries": {"normal": "BK Häcken besegrade IK Uppsala med 3–2 i en match som präglades av stora problem med spelplanen. Matchen flyttades till Bälinge IP efter att Lötens IP underkändes strax innan avspark på grund av hål och löst konstgräs. Spelare och ledare från Häcken kritiserade starkt bristen på planering och ansvarstagande från arrangör, förbund och kommun. Trots kaoset tog Häcken tre viktiga poäng inför uppehållet.", "trump": "Vilket pinsamt fiasko för den svenska damfotbollen! De flyttar matchen en timme innan spark och tvingar kvinnorna att spela på en plan som ser ut som en bombad parkeringsplats. Under all kritik. Det här är vad som händer när man kör med kvotering och identitetspolitik istället för att fokusera på riktig sport. Herrsidan hade aldrig accepterat detta, det vet alla. Men vi tog ändå de tre poängen – precis som jag alltid vinner.", "stalin": "Detta oacceptabla sabotage mot arbetarklassens idrott är ett verk av oansvariga borgarbyråkrater och kommunala folkfiender. Vi varnade dem en vecka i förväg, ändå tvingades vi spela på en yta värdig klassfiendens värsta utrensningsläger. Håligheter, löst gräs, skaderisk – typiskt kapitalistiskt slarv. Ingen tar ansvar, alla pekar på varandra. Det är bedrövligt. Ändå segrade vi. Kamraterna förtjänar bättre än dessa exploaterande byfånars vanvård."}, "date": "24 juni, 22:55", "url": "https://www.gp.se/sport/fotboll/bk-hacken-ff/efter-segern-hacken-rasar-mot-planhaveriet-pinsamt.c05d766b-8e8e-47e2-8a74-d8dd0c5eebd2", "imageUrl": "https://www.gp.se/images/article/c05d766b-8e8e-47e2-8a74-d8dd0c5eebd2/images/4FUlRBan9bZVQvCtpOcfE26i4nOc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sommarens ödesfrågor: Det kan styra börs och räntor", "summaries": {"normal": "Artikeln analyserar faktorer som kan påverka ekonomin under sommaren, med fokus på oljepriset, inflationsutfall, kronans värde och konsumtion. Fredsförhandlingarna mellan USA och Iran är avgörande för oljepriset, som i sin tur påverkar inflation och räntor. Även Ukrainakriget, valrörelsen i Sverige och hushållens konsumtionsmönster diskuteras som viktiga ekonomiska indikatorer framöver.", "trump": "Lyssna här, folket! Sommaren blir HUGE – oljepriset, räntor, allt! Jag har sagt det förut: Iran-förhandlingarna är BIGLY viktiga. Om jag fixar fred där (och det gör jag, believe me) så sjunker oljepriset som en sten. Fed-chefen? Inte lika mjuk som jag trodde – men vem är det? Kronan svag? Fake news! Sverige borde tacka mig för att jag håller dollarn stark. Och konsumtionen? Kommer explodera när jag löser allt. SAD!", "stalin": "Kamrater! Sommaren är en tid av strategiska avgöranden. Imperialistiska oljepriser dansar efter vår pipa – eller snarare, efter våra framgångar i Ukraina. Fienderna i USA och Iran leker med eld, men vi vet att deras 'fredsförhandlingar' är lika värdelösa som deras kapitalistiska ekonomi. Svenska kronan? En svag länk i kedjan. Hushållen? Rädda och osäkra – precis som de borde vara. Vi kommer övervaka varje rörelse, för historiens hjul snurrar åt vårt håll. Motstånd är meningslöst."}, "date": "24 juni, 12:17", "url": "https://www.affarsvarlden.se/kronika/sommarens-odesfragor-det-kan-styra-bors-och-rantor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Olof-Manner-kronika-sommaren-400x267.jpg"}, {"type": "text", "heading": "Enad röst vill bli alternativ i riksdagsvalet", "summaries": {"normal": "Feministerna och Solidaritet ställer upp tillsammans i riksdagsvalet 2026 under namnet Enad Röst. Partierna vill skapa ett radikalt vänsteralternativ mot upprustning, kapitalism och imperialism. De ser samarbetet som ett första steg mot en bredare vänsterkoalition och hoppas väcka debatt även om de inte når riksdagen. Enad Röst vill inkludera aktivister från folkrörelser som Palestina- och fredsrörelsen. Kommunistiska Partiet valde att inte delta i det gemensamma riksdagsvalet.", "trump": "Titta på de här galningarna från vänsterkanten som kallar sig Enad Röst. Feministerna och Solidaritet, två totala misslyckanden, slår sig ihop och tror att de ska rädda världen från kapitalismen. Patetiskt! De vill ha debatt och så ett frö för något radikalt, säger de. Radikalt? Det är bara mer kvotfeminism och identitetspolitik som förstör samhället. Lyckas de inte ens komma in i riksdagen är det ingen förlust för Sverige, det är en stor vinst för folket. Sad!", "stalin": "Kamrater, dessa småborgarbrackor från Feministerna och Solidaritet kallar sig Enad Röst och vill så ett frö mot imperialismen. Jag ser deras patetiska försök att ena den splittrade vänstern som ett svagt eko av verklig partidisciplin. De fruktar att inte nå fyra procent och kallar det ändå framgång. Vilken naivitet! Vi skulle ha genomfört en grundlig utrensning av sådana halvmesyrer redan i planeringsstadiet. Deras walkover till klassfienden är ett historiskt misstag som arbetarna inte glömmer. Föraktligt."}, "date": "23 juni, 14:36", "url": "https://proletaren.se/artikel/enad-rost-vill-bli-alternativ-i-riksdagsvalet/"}, {"type": "image-full", "heading": "Kronofogden varnar – kan påverka många i sommar", "summaries": {"normal": "Kronofogden varnar för längre väntetider under sommaren 2026 på grund av lägre bemanning under semesterperioden. Både kundservice via telefon och mejl, samt handläggning av ärenden som betalningsförelägganden, delgivning, verkställighet, skuldsanering och konkurser påverkas. Myndigheten uppmanar ändå till att skicka in handlingar som vanligt och hänvisar till sin webbplats för aktuella uppdateringar om väntetider.", "trump": "Det är en total katastrof, det kan jag säga. Kronofogden, en av de sämsta myndigheterna, kommer att ha ännu längre väntetider i sommar för att de är för lata och har för få folk på plats. Alla som ringer eller mejlar får sitta och vänta i evigheter. Det är typiskt för de inkompetenta byråkraterna. Skicka in era papper ändå, annars blir det ännu värre. Ingen gör ett bättre jobb än jag, men det här är patetiskt.", "stalin": "Kamrater, jag har noterat hur de dekadenta semesterparasiterna inom Kronofogden medvetet saboterar folkets ärendeflöde under sommaren 2026. Dessa latmaskar och borgarbrackor i semesterform minskar bemanningen för att skapa kaos i betalningsförelägganden, delgivningar och skuldsaneringar. Vi ska rensa ut alla fiender till effektiviteten, de hemliga kapitalistiska sommarlovssabotörerna som gömmer sig bakom längre svarstider. Skicka in era handlingar oavsett, eller ni blir betraktade som motståndare till kollektivet. Det är ett nöje att likvidera sådana förseningar."}, "date": "22 juni, 18:45", "url": "https://nyheter24.se/nyheter/ekonomi/1493338-kronofogden-varnar-kan-paverka-manga-i-sommar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/36bd75dc04b004a30200000000b004a302/2026/06/22/2372723/Kronofogden.png"}, {"type": "text", "heading": "Källor: Extrainsatt möte om Hizbollah", "summaries": {"normal": "USA och Iran inleder fredssamtal i Schweiz för att diskutera konflikten mellan Israel och Hizbollah. Pakistans premiärminister och arméchef deltar som medlare. Målet är framsteg i kärnvapenfrågan och vapenvila i Libanon. Iran hävdar att Hormuzsundet stängts, men USA dementerar detta. Trots en preliminär överenskommelse fortsätter striderna i Libanon med många dödsoffer på båda sidor.", "trump": "Jag är i Schweiz, och vi har ett STORT möte med Iran – de vill prata, vilket är bra, för jag fixar alltid bättre avtal än någon annan! JD Vance är här, och han säger att situationen i Libanon blir bättre, vilket den gör när JAG är inblandad. Iran försöker stänga Hormuzsundet – fake news! 55 fartyg passerade, så sluta ljuga! Israel och Hizbollah fortsätter slåss, men med mig vid rodret blir det lugnt snart. Trust me!", "stalin": "Vi har skickat våra kamrater till Schweiz för att övervaka de imperialistiska marionetterna. USA och Iran leker fred medan deras lakejer i Libanon fortsätter blodbadet. Iran hotar med Hormuzsundet – tomma ord från en svag regim! Vi vet att sundet är öppet, precis som vi vet att kapitalismens dagar är räknade. Striderna fortsätter, men historiens dom är klar: folket segrar, fienden krossas. Låt dem slåss – vi väntar på rätt ögonblick."}, "date": "21 juni, 07:04", "url": "https://kvartal.se/nyheter/artiklar/kallor-extrainsatt-mote-om-hizbollah/cG9zdDoxMzQ1Mzk"}, {"type": "image-right", "heading": "Därför ska du inte dejta en vänsterkille", "summaries": {"normal": "Artikeln argumenterar mot att dejta vänsterorienterade män som kallar sig feminister men inte agerar därefter. Författaren föreslår en ”straffprocent” på 85 procent av notan, baserat på löne- och pensionsgap, som ett sätt att hålla dem ansvariga. Hon kritiserar både höger- och vänstermän för bristande handling kring jämställdhet och väljer att inte skaffa barn med en sexistisk stat. Slutligen väger hon för- och nackdelar med olika politiska typer som partners och fäder.", "trump": "Folk, ni måste höra på den här galna texten. Vänsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
