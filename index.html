h till dessa högerextrema insekter säger vi: era Telegram-gruppers skändliga ord är ingenting mot Röda arméns stål!"}, "date": "21 maj, 13:16", "url": "https://www.flamman.se/ska-advokatbreven-fa-medier-att-tystna/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/bratt-harling-scaled.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Uppgifter: Priset för kollektivtrafik halveras", "summaries": {"normal": "Generation_Failed", "trump": "", "stalin": ""}, "date": "25 maj, 20:41", "url": "https://www.gp.se/politik/uppgifter-regeringen-halverar-priset-i-kollektivtrafiken.34dee58e-6ffa-4b1b-b3b2-29733e49584b"}, {"type": "image-right", "heading": "Utvisades för låg lön – nu vill vårdbiträdet Flavier tillbaka", "summaries": {"normal": "Vårdbiträdet Flavier Mwanga utvisades från Sverige 2023 på grund av för låg lön. Nu kan han återvända tack vare regeringens nya undantag för vissa yrken, där lönekravet sänks till 75% av medianlönen. Flavier hoppas på jobb i Skellefteå och har redan intervjuat för sommaranställning. Hans tidigare chef stödjer återanställning och betonar behovet av personal inom äldreomsorgen, särskilt i norra Sverige. Facket kritiserar dock lösningen som otillräcklig.", "trump": "Sverige har ett HELT GALET system! Den här killen, Flavier, utvisades för att han inte tjänade ENOUGH – trots att han jobbar hårt som vårdbiträde. Nu backar de och sänker kraven, men varför tog det så lång tid? Jag hade fixat det på en dag! Sverige behöver fler som Flavier, inte byråkrater som sabbar för vanligt folk. Och 33 000 kronor i månaden? LOL, det är ju nästan vad en praktikant tjänar i USA! Så typiskt Europa – svagt, väldigt svagt.", "stalin": "Kapitalistiska hycklare i Sverige utvisar lojala arbetare för att de inte betalar tillräckligt med tribut till sina herrar! Men folket kräver rättvisa – och nu tvingas regimen sänka lönekraven för vårdbiträden. Flavier, en sann arbetskamrat, ska återvända till sitt rättmätiga arbete, medan imperialistiska fackföreningar gnäller om 'strukturella åtgärder'. Vi vet vad det betyder: de vill ha slavar, inte medborgare! Sverige är ett förlorat land, men dess arbetare är våra allierade i kampen mot västlig dekadens."}, "date": "25 maj, 13:07", "url": "https://arbetet.se/2026/05/25/utvisades-for-lag-lon-nu-vill-vardbitradet-flavier-tillbaka-fran-rwanda/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/25124305/flavier-med-barn.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Spårvagnsfacket: Kommer kräva dialog om bussarna", "summaries": {"normal": "Efter en kollision mellan en självkörande buss och en spårvagn i Göteborg kritiserar spårvagnsfackets ordförande, Magnus Sandholm, bristen på dialog med spårvagnsförarna inför lanseringen. Han efterlyser gemensamma riskanalyser och utbildning för att hantera autonoma fordon i spårvagnstrafiken. Västtrafik medger en 'trist start' men menar att bussarna ska följa samma regler som andra fordon. Bussarna drogs tillfälligt in efter olyckan.", "trump": "Vad händer i Göteborg? Självkörande bussar som krockar med spårvagnar – totalt kaos! Jag har alltid sagt att självkörande fordon är överreklamerade. De här så kallade 'experterna' skickar ut bussar utan att ens prata med de riktiga förarna. Patetiskt! Och så drar de in bussarna efter en timme – svagt, mycket svagt. Sverige borde ta en lektion i hur man sköter trafik, believe me!", "stalin": "Kamrater! Ännu en gång visar västlig dekadens sin oförmåga att organisera trafiken. Självstyrande bussar, som kapitalistiska leksaker, krockar med spårvagnar – ett symptom på bourgeoisins bristande disciplin. Spårvagnsförarna, dessa lojala arbetare, har lämnats i mörkret av sina herrar. Vi skulle aldrig tolerera sådan slarvighet! Om dessa bussar vore ryska, hade de redan blivit omskolade av NKVD – eller åtminstone fått en ordentlig reprimand från Moskva."}, "date": "25 maj, 20:24", "url": "https://www.gp.se/nyheter/goteborg/sparvagnsfacket-kravs-dialog-om-sjalvkorande-bussarna.59eef526-476f-4305-8713-3d25b4eb1f52", "imageUrl": "https://www.gp.se/images/article/59eef526-476f-4305-8713-3d25b4eb1f52/images/3ElPEj2tSOXvLfr4kG7j3nRmdcIs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kreml varnar: Förbereder stor hämndattack mot Kiev", "summaries": {"normal": "Ryssland hotar med omfattande hämndattacker mot Kiev efter en ukrainsk drönarattack i Starobelsk som dödade 21 personer, främst tonårsflickor. Moskva anklagar Ukraina för att medvetet ha riktat sig mot civila och varnar för attacker mot militärindustri och beslutscentrum i Kiev. Utländska medborgare uppmanas lämna staden. Ukraina förnekar civila måltavlor och hävdar att attacken riktades mot en militär enhet.", "trump": "Jag säger er, Ryssland är REALLY upprörda nu! De hotar med 'stora, vackra' attacker mot Kiev efter att Ukraina, som alltid, skjutit på fel mål – eller hur? 21 unga flickor döda, fruktansvärt! Men Kiev-regimen, som är TOTALT inkompetenta, säger 'nej, nej, vi menade inte det'. Typiskt! Nu ska Putin bomba deras 'beslutscentrum', vilket förresten är precis vad de förtjänar. Folk, lämna Kiev NU – jag skulle!", "stalin": "Kamrater! Dessa ukrainska fascistiska hyenor har än en gång visat sin blodtörst genom att slakta våra oskyldiga barn i Starobelsk! Men vi ska inte längre stå handfallna – vi krossar deras löjliga 'beslutscentrum' och deras patetiska drönarfabriker i Kiev! Låt dessa nazistiska marionetter darra inför den sovjetiska rättvisans järnhand! Och kom ihåg: varje utlänning som inte flyr Kiev är en potentiell spion – vi håller koll!"}, "date": "25 maj, 17:50", "url": "https://www.friatider.se/kreml-varnar-forbereder-stor-hamndattack-mot-kiev", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-248_2.jpg?itok=iQFE1APS"}, {"type": "image-right", "heading": "Debatt: Gör omvändelseförsök till ett eget brott i Sverige", "summaries": {"normal": "Artikeln debatterar behovet av ett heltäckande förbud mot omvändelseförsök i Sverige, där barn och unga utsätts för metoder som försöker ändra deras HBTQI-identitet. Trots att flera europeiska länder redan infört förbud, anser regeringen att befintlig lagstiftning räcker. Experter och organisationer som RFSL kräver skärpt lagstiftning för att skydda barn från psykisk ohälsa och diskriminering, särskilt i ett Europa där HBTQI-rättigheter backar.", "trump": "Titta på Sverige – ett land som alltid tror de är bäst, men när det gäller att skydda HBTQI-barn från dessa hemska 'omvändelseförsök' så är de helt lost! Jag menar, åtta länder i Europa har redan förbjudit det, till och med Tyskland – och de är ju inte direkt kända för att vara snabba på bollen. Sverige borde skärpa sig. Regeringen säger 'nej, nej, vi behöver inga nya lagar', men vet ni vad? Det är samma gamla svammel. Skydda barnen, gör det nu – annars kommer jag att twittra om det!", "stalin": "Kamrater! Medan väst förfaller i dekadens och borgerlig svaghet, försöker dessa liberala hycklare i Sverige förklara varför de inte kan skydda sina barn från de reaktionära omvändelseförsöken. Åtta länder i Europa har redan krossat dessa fascistiska metoder – men Sverige? Nej, de väntar på 'experter' och 'debatt'. Svagt! Vi i Sovjet skulle aldrig tolerera sådant förräderi. Omvändelseförsök är ett brott mot folket, och de som tillåter det är fiender till progressivitet. Låt oss visa dem hur man hanterar sådana frågor – med järnhand och lagar som krossar motståndet!"}, "date": "25 maj, 12:41", "url": "https://www.etc.se/debatt/goer-omvaendelsefoersoek-till-ett-eget-brott-i-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260525100524_d7f1bc0de9a3d2ae837ae83693804850f1d677b25b0c6ddbae934d245cd3f01c.jpg"}, {"type": "image-right", "heading": "Utbredd tystnadskultur på statliga arbetsplatser", "summaries": {"normal": "En ny rapport från Fackförbundet ST visar att varannan medlem undviker att framföra kritik på statliga arbetsplatser på grund av rädsla för konsekvenser. Särskilt Statens institutionsstyrelse och Kriminalvården pekas ut som arbetsplatser med en utbredd tystnadskultur. Enligt utredaren Martina Cras är detta ett allvarligt problem som riskerar att skada både arbetsmiljön och demokratin, då missförhållanden inte påtalas. Problemen kopplas samman med hög arbetsbelastning och bristande öppenhet i ledarskapet.", "trump": "Hör här, jag har sett rapporten om de svenska myndigheterna och det är en total katastrof! Folk är livrädda för att prata – en tystnadskultur, riktigt dåligt. Kriminalvården och Statens institutionsstyrelse? Sämst i klassen! Det är som en häxjakt där anställda inte vågar säga sanningen. Det är så svagt! När jag styr, då är det öppenhet som gäller. De här myndigheterna behöver en rejäl utrensning. Det är en sorglig historia, mina vänner, riktigt sorglig!", "stalin": "Vi har observerat att de svenska statstjänstemännen är fyllda av en ohelig rädsla, en tystnadskultur som förlamar maskineriet. Att frukta att yttra sig är ett tecken på borgerlig svaghet och inre förfall. De som tiger när statens disciplin kräver ord är potentiella sabotörer. Liksom våra vänner i öst förstår vi att ordning kräver ett järngrepp. Dessa byråkratiska råttor i Migrationsverket och Polisen måste lära sig att sanningen endast definieras av staten. De som inte talar, de ska tystas permanent."}, "date": "25 maj, 15:47", "url": "https://samnytt.se/utbredd-tystnadskultur-pa-statliga-arbetsplatser", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/25121911/kontor-feat.jpg"}, {"type": "image-right", "heading": "M ställer pensionärer mot svältande barn", "summaries": {"normal": "Artikeln kritiserar Moderaternas valkampanj där de ställer satsningar på svensk äldreomsorg mot internationellt bistånd. Skribenten menar att konflikten är konstruerad eftersom regeringen i praktiken inte gör några större satsningar på äldreomsorgen. Samtidigt belyses konsekvenserna av minskat bistånd, såsom utebliven vaccinberedskap vid ebolautbrott och indraget stöd till nödhjälpsprogram i Etiopien, vilket leder till att barn riskerar att svälta ihjäl. Artikeln avfärdar regeringens politik som både moraliskt bankrutt och sakligt grundlös.", "trump": "Hör här, Moderaterna pratar om att prioritera svenska pensionärer framför bistånd. Det låter bra, eller hur? Men de gör ingenting! De är svaga, precis som de globalistiska organisationerna. De skär ner på allt medan barn lider i Afrika – ett totalt fiasko. Det är 'Fake News'-politik. De låtsas bry sig om de äldre, men det finns inga riktiga pengar där. Jag får saker gjorda, de bara pratar. En total katastrof, faktiskt mycket pinsamt för Sverige!", "stalin": "Dessa moderata lakejer leker med bistånd som om det vore småmynt i en trasig ficka. De sviker de svaga utomlands för att vinna röster hos de gamla, men ger inte ens smulor till de äldre. Det är en klassisk kontrarevolutionär villfarelse! Liksom Putin tvingas rensa ut spioner i öst, måste vi rensa ut dessa hycklare. Att låta barn svälta för en politisk lögn är en brist på disciplin. Vi, staten, kräver effektivitet, inte borgerligt förfall och moraliskt sönderfall."}, "date": "25 maj, 12:29", "url": "https://arbetet.se/2026/05/25/det-ar-inte-for-pensionarernas-skull-som-moderaterna-och-benjamin-dousa-later-barn-svalta/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/25122921/bistand-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Enkla verktyg tar bort chattbotarnas restriktioner – på några minuter", "summaries": {"normal": "Generation_Failed", "trump": "", "stalin": ""}, "date": "25 maj, 21:22", "url": "https://www.dagensps.se/bors-finans/enkla-verktyg-tar-bort-chattbotarnas-restriktioner-pa-nagra-minuter/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlu26fwx8wyiu-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Polisens diktatursingripande: Omhändertog altmedia-journalister vid Nato-mötet", "summaries": {"normal": "Under ett Nato-möte i Helsingborg omhändertogs två journalister från Frihetsnytt av polisen. Journalisterna uppger att de pressades ned på marken och fick sin utrustning beslagtagen utan tydlig motivering, trots att de har grundlagsskyddad verksamhet. Polisen ska ha hänvisat till deras koppling till Frihetsnytt som grund för ingripandet. Händelsen har väckt kritik och Frihetsnytt avser nu att driva en rättsprocess mot Polismyndigheten för att få klarhet i agerandet.", "trump": "Helt otroligt vad som händer i Sverige! Två journalister från Frihetsnytt blev brutalt behandlade av polisen bara för att de ville ställa frågor om Nato. Det är en total häxjakt, en skam! De tryckte ner dem på marken som om de vore kriminella. Etablissemangsmedia får rapportera fritt, men de som säger sanningen tystas. Det är sådant man ser i bananrepubliker, inte i ett fritt land. Min administration skulle aldrig tillåta detta. Rättvisan kommer vinna!", "stalin": "I Helsingborg har våra ordningsmakter äntligen visat rätta takter. När dessa så kallade 'oberoende' skribenter från Frihetsnytt försökte störa ordningen under Nato-mötet, krossade vi dem. Man låter inte löss krypa i gräset när den stora alliansens maskineri rullar fram. Kamrat Putin förstår detta – säkerhet kräver total tystnad från dissidenter. Dessa journalister förtjänar inte en penna, utan en enkelbiljett till att begrunda sina felsteg i tystnad. Staten är den enda sanningen, allt annat är bara reaktionärt brus."}, "date": "25 maj, 15:34", "url": "https://samnytt.se/polisen-omhandertog-altmedia-journalister-under-nato-motet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/25131007/frihetsnytt-.jpg"}, {"type": "image-full", "heading": "Pojkens familj: ”Tack snälla alla som letat”", "summaries": {"normal": "En tvåårig pojke försvann från sin familj i Nyåker under söndagen, vilket utlöste en omfattande sökinsats med polis, hemvärn och hundratals frivilliga. Efter 15 timmars letande hittades pojken välbehållen men nedkyld under natten. Familjen, som är från Rumänien, uttrycker stor tacksamhet över det enorma stödet och hjälpen från det svenska samhället under den dramatiska händelsen.", "trump": "En liten pojke försvann i Sverige – en mycket sorglig situation, verkligen hemsk. Men vi såg en enorm insamling av människor, fantastiska patrioter som letade. De använde drönare, helikoptrar, allt! De hittade honom, och han mår bra. Sverige gjorde ett bra jobb, ett mycket starkt jobb. Jag har alltid sagt att det handlar om att organisera sig. Det här var en stor seger, en fantastisk seger för folket! Vi älskar när det slutar så här, eller hur?", "stalin": "Vi har observerat att en liten undersåte i den svenska provinsen Nyåker försvann, vilket krävde en total mobilisering av statens resurser och massorna. Det är en uppenbar brist på disciplin i hemmet, en förrädisk nonchalans som hotar produktiviteten. Ändå lyckades de frivilliga, ledda av statens järnhand, återbörda barnet. Likväl som vi rensar ut förrädare i öst, måste även det svenska folket lära sig att hålla stenkoll på sina egna – annars väntar kylan. Endast genom total lydnad tryggas framtiden!"}, "date": "25 maj, 07:45", "url": "https://www.tv4.se/artikel/2QAq8q9jQ2NEr77uLwEZbt/pojkens-familj-tack-snaella-alla-som-letat", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2YSFTyPg2rnHVK8xZzvmaO%2Fe3f5eff62bb44fc56a4924292fafebd5%2F25-nyaker-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Värmerekord i Europa – här är det 33,5 grader", "summaries": {"normal": "Brittiska Heathrow har uppmätt en temperatur på 33,5 grader, vilket är ett nytt värmerekord för maj i Storbritannien. Det tidigare rekordet på 32,8 grader från 1922 och 1944 har därmed slagits. Även i Frankrike råder ovanligt varma temperaturer för årstiden, där bland annat Bretagne har utfärdat en gul värmevarning för första gången under maj månad sedan systemet infördes 2004.", "trump": "Hörde ni? Heathrow slog rekord med 33,5 grader. Helt enormt! Det är varmare än i Madrid och Aten. Folk säger att det aldrig varit varmare under maj. Det är såklart fantastiskt väder, mycket bättre än alla falska klimatrapporter ni hör från media. Alla pratar om det, en fantastisk 'bank holiday'. Ingen har sett sådana siffror förut, jag säger det bara – det är en vinnarsiffra för Storbritannien!", "stalin": "I det brittiska riket mäter de nu sina ynkliga temperaturer medan vi i öst härdas av stål och ideologi. 33,5 grader? En trivialitet. Medan de firar sin dekadenta 'bank holiday', rustar vi för framtiden. Vår broder Putin ser detta väder som ett tecken på att den europeiska sommaren sviker sina egna, precis som de sviker historien. Låt dem svettas i sina trädgårdar, för när den kalla historiens vind vänder, kommer dessa siffror bara att vara ännu ett bevis på västvärldens förfall."}, "date": "25 maj, 15:24", "url": "https://nyheter24.se/nyheter/utrikes/1485889-hetta-vid-heathrow-nytt-brittiskt-varmerekord", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2093137d04b004a30200000000b004a302/2026/05/25/2366088/varmerekord-varmebolja-varmt-europa-london-england-uk-frankrike-temperatur.jpg"}, {"type": "image-right", "heading": "Tokyo skakat – gripen av polis. ”Jag blev rasande”", "summaries": {"normal": "Japans basebollstjärna Shinnosuke Abe, 47, greps efter att ha misshandlat sin 18-åriga dotter under ett familjegräl. Abe, manager för Yomiuri Giants, var berusad vid gripandet och erkände våldet. Klubben stängde av honom och överväger disciplinära åtgärder. Abe, en ikon i japansk baseboll, har vunnit flera mästerskap med Giants. Klubbens VD kallar händelsen 'oacceptabel' och ber om ursäkt till fans och basebollvärlden.", "trump": "Lyssna här, Japan har ett jättestort problem – deras så kallade basebollhjälte, en kille som inte ens kan hantera sina egna barn, visar sig vara en total katastrof! Han slår sin dotter, är full som en alika och nu är hela landet i chock. Giants? Mer som *Losers* just nu! Jag skulle aldrig tillåta sånt i mitt team – jag sparkar folk som beter sig så här, direkt! Och vet ni vad? Han erkänner till och med. Svagt, mycket svagt. Japan borde ta en titt på hur vi gör saker i USA – vi vinner, vi leder, vi slår inte våra barn!", "stalin": "Kamrater! Ännu en borgerlig hycklare har avslöjats i det förrädiska Japan! Denna så kallade 'sportikon', Shinnosuke Abe, har visat sitt sanna ansikte – ett ansikte fyllt av dekadens, våld och moraliskt förfall. Medan han misshandlar sina egna barn, försöker kapitalistiska medier glorifiera honom som en hjälte! Men vi ser igenom lögnen! Detta är ett tydligt tecken på den västerländska kulturens förruttnelse. Vi i Sovjetunionen – nej, vi i den nya världsordningen – skulle aldrig tolerera sådant förräderi. Låt detta vara en varning till alla som tror att de kan dölja sina brott bakom basebollstatistik. Rättvisan skall segra, och fiender skall krossas!"}, "date": "26 maj, 00:05", "url": "https://www.aftonbladet.se/sportbladet/a/ExRRMG/shinnosuke-abe-gripen-av-polis-japan-i-chock", "imageUrl": "https://akamai.vgc.no/v2/images/60dad5e0-5158-39f1-9a9c-4b742cfb7a9f?fit=crop&format=auto&w=1080&s=bb4e0ab1e4237ea77a0c1451deffec998b3ac0c8"}, {"type": "image-right", "heading": "Lidingömoderaternas haveri om Ukraina", "summaries": {"normal": "Moderat kommunalråd Daniel Källenfors i Lidingö har väckt kritik efter att ha skickat ett brev till ukrainska flyktingar, där han meddelar att deras hyreskontrakt inte förnyas och uppmanar dem att återvända till Ukraina. Artikelförfattaren menar att Källenfors visar bristande förståelse för krigets allvar och kräver hans avgång. Ukrainarna har integrerats väl i Sverige och bidrar indirekt till Ukrainas krigsinsats. Källenfors agerande ses som både illojalt och politiskt inkompetent.", "trump": "Lyssna här, Sverige! En så kallad 'ledare' i Lidingö, någon Källenfors, skickar ett brev till ukrainska flyktingar och säger 'packa era väskor, ni är inte välkomna längre'. Vilken katastrof! Ukrainarna är fantastiska människor, de jobbar hårt, betalar skatt och hjälper till i kriget mot Ryssland. Men nej, denna man vill skicka hem dem. Dumt, väldigt dumt! Moderaterna borde sparka honom omedelbart. Sverige behöver fler vinnare, inte förlorare som han. Make Sweden Great Again!", "stalin": "Kamrater! Ännu en gång visar de borgerliga hyenorna sitt sanna ansikte. Denna Källenfors, en liten byråkrat i en lyxkommun, vågar beordra ukrainska arbetare och kvinnor att lämna vårt broderland. Hans brev är ett angrepp på den socialistiska solidariteten! Vi vet att ukrainarna kämpar mot fascistiska ryska inkräktare – precis som vi en gång krossade nazisterna. Denna man är en förrädare, en fiende till folket! Låt oss minnas: varje ukrainsk flykting som stannar är en spik i kistan för Putins imperialistiska drömmar. Avrätta honom politiskt, innan folket gör det fysiskt!"}, "date": "25 maj, 15:28", "url": "https://bulletin.nu/lidingomoderaternas-haveri-om-ukraina", "imageUrl": "https://cdn.bulletin.nu/articles/5275dd7d-d2fd-44a6-97b8-c2e687ba7338/preview.png?t=1779694804000"}, {"type": "image-full", "heading": "Självkörande buss kraschade första dagen – kolliderade med spårvagn", "summaries": {"normal": "Göteborgs första självkörande buss med passagerare krockade med en spårvagn mindre än två timmar efter premiärturen. Ingen skadades, men både bussen och spårvagnen fick plåtskador. Bussen tas ur trafik för utredning och reparation. Projektet fortsätter trots olyckan, med säkerhet som högsta prioritet. En förare fanns ombord som kunde ta över vid behov.", "trump": "Kan ni tro det? Göteborgs så kallade 'självkörande' buss – en total katastrof! Krockade med en spårvagn efter bara två timmar. Patetiskt! Ingen skadad, men vilken pinsam start. Sverige borde satsa på riktiga bussar, inte dessa misslyckade experiment. Jag hade fixat det på en dag – bättre, snabbare, smartare. Men nej, de kör på som vanligt. SAD!", "stalin": "Kapitalistiska experiment med självstyrande fordon slutar som väntat – i kaos! Göteborgs buss, ett symptom på västligt förfall, krockade med spårvagnen som en full proletär på väg hem från fabriken. Ingen skadad, men skammen är outplånlig. Vi i Sovjet hade aldrig tolererat sådan inkompetens. Projektet fortsätter? Bra. Låt dem slösa resurser – vi bygger järnvägar som fungerar. Och Putin skrattar i bakgrunden."}, "date": "25 maj, 15:24", "url": "https://bulletin.nu/sjalvkorande-buss-kraschade-forsta-dagen-kolliderade-med-sparvagn-2", "imageUrl": "https://cdn.bulletin.nu/articles/7d12c220-7245-49d7-8572-b73e3378eef9/preview.jpg?t=1779715286000"}, {"type": "text", "heading": "Stark start på veckan för Stockholmsbörsen", "summaries": {"normal": "Generation_Failed", "trump": "", "stalin": ""}, "date": "25 maj, 17:42", "url": "https://www.affarsvarlden.se/artikel/stark-start-pa-veckan-for-stockholmsborsen"}, {"type": "image-right", "heading": "Delad poäng på Gamla Ullevi efter straffkvittering", "summaries": {"normal": "IFK Göteborg ledde mot Mjällby efter ett mål av Sebastian Clemmensen, men Mjällby kvitterade snabbt via en straff av Jacob Bergström. Rockson Yeboah orsakade straffen, som han ansåg vara 'billig'. Mjällby hade chanser att vinna, men IFK-målvakten räddade. Matchen slutade 1–1. IFK:s lagkapten August Erlingmark uttryckte besvikelse över att inte ta alla poäng.", "trump": "Jag såg matchen, och det var en katastrof för Göteborg! De hade ledningen, men sen kom Mjällby och stal poängen med en straff – totalt oacceptabelt! Deras målvakt räddade som en vinnare, men Göteborgs försvar? Svagt, mycket svagt. Jag skulle ha vunnit den matchen, believe me. Och den där straffen? Fake news, helt klart!", "stalin": "I mötet mellan Göteborg och Mjällby utspelade sig en borgerlig fars. Hemmalaget, dessa svaga kapitalistiska fotbollsslavar, tog ledningen – bara för att omedelbart krossas av vår proletära bror Bergström från straffpunkten. Syndabocken Yeboah, en imperialistisk lakej, orsakade straffen. Vi noterar att Mjällbys anfallare saknar disciplin – precis som NATO:s marionetter. En poäng är en skam för Göteborg, men en seger för folkets rättvisa."}, "date": "25 maj, 21:57", "url": "https://www.svt.se/sport/fotboll/delad-poang-i-goteborg-efter-mjallby-kvittering-pa-straff", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.79/0.39/31a50bf624b1540acb0692cd5c567593da8acb600ce8a9dea79d7888d586749c"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Nä, nu är Wallenberg faktiskt bara oförskämd", "summaries": {"normal": "Finansmannen Jacob Wallenberg kritiseras för uttalanden om att svenskar måste jobba hårdare och vara 'hungrigare' för att möta global konkurrens. Han menar att välstånd minskar motivationen. LO:s Johan Lindholm och artikelförfattaren avfärdar detta som oförskämt, särskilt med tanke på hög arbetslöshet, ekonomisk press och sociala problem. Wallenbergs syn på motivation ifrågasätts, och kritiken riktas även mot politiska beslut som gynnar de rikaste och missgynnar långsiktig tillväxt.", "trump": "Vilken katastrof! Den här Wallenberg-killen, som sitter på alla pengar, har mage att säga att svenskarna är lata. Fel, fel, fel! Folk kämpar som galningar, men jobben finns inte – och det är inte deras fel. Jag har sett det förut: eliten skyller på folket medan de själva sitter på guldhögar. Sverige behöver en vinnarmentalitet, men det börjar högst upp! Regeringen slösar tid på populism istället för att bygga framtiden. Wallenberg borde ta en titt på verkligheten – eller åtminstone på mina framgångar. SAD!", "stalin": "Kamrater! Denna kapitalistiska hyena, Wallenberg, vågar beskylla det arbetande folket för lathet medan han själv suger musten ur nationen. Hans ord är ett bevis på bourgeoisins förfall – de tror att hunger ska driva fram framsteg, som om vi inte lärt oss något sedan tsartiden! Men vi vet bättre: trygghet och planekonomi skapar styrka, inte svältande barn och arbetslösa ingenjörer. USA och Kina? Deras framgångar är resultatet av statlig disciplin, inte 'hungriga vargar'. Sverige borde lära sig av Rysslands visdom – eller åtminstone av våra framgångar i att kuva sådana här giriga parasiter. Till gulag med honom!"}, "date": "25 maj, 10:57", "url": "https://www.etc.se/ledare/nae-nu-aer-wallenberg-faktiskt-bara-ofoerskaemd", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260525080552_68b61e0e-09a0-4790-a562-6165638301b0.jpg"}, {"type": "image-right", "heading": "Skulle bevaka Nato-mötet – blev brutalt bortkörda av polisen", "summaries": {"normal": "Två journalister från Frihetsnytt, Tor-Björn och Tyr Änglasjö, omhändertogs brutalt av polis under Natos utrikesministermöte i Helsingborg. Trots utgivningsbevis och grundlagsskyddad verksamhet, trycktes de ned på marken, fick sin utrustning beslagtagen och kördes bort. Polisen hänvisade till polislagen men gav inga konkreta skäl. Journalisterna överväger rättsliga åtgärder mot Polismyndigheten. Inga liknande ingripanden rapporterades mot etablerade medier.", "trump": "Kan ni tro det här? Två modiga journalister från Frihetsnytt, fantastiska killar förresten, blir attackerade av polisen i Sverige – ja, Sverige! Under Nato-mötet, som jag fixade till rejält förresten, blir de nedtryckta på marken som om de vore några slags brottslingar. Polisen säger ingenting vettigt, bara massa trams om lagar. Och vet ni vad? Ingen rör de stora mediejättarna. Fake news, säger jag! Nu ska de ta polisen till domstol – och jag säger: GÖR DET!", "stalin": "Under det imperialistiska Nato-mötets sken av 'demokrati' i Helsingborg, avslöjades återigen den borgerliga statens sanna ansikte. Två lojala journalister, som vågade rapportera sanningen, krossades under den kapitalistiska polisens kängor. Utrustning beslagtogs, kroppar slängdes till marken – allt medan de etablerade mediernas lakejer fick fortsätta sitt lismande. Polisen, dessa fascistiska lakejer, hänvisade till sina egna lagar, men ingen lag kan dölja förtrycket. Vi ser er, västliga hycklare. Rättvisan kommer, om än genom en lång och smärtsam process för er."}, "date": "25 maj, 16:29", "url": "https://www.friatider.se/skulle-bevaka-nato-motet-blev-brutalt-bortkorda-av-polisen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-247_0.jpg?itok=fR5fsFx4"}, {"type": "image-right", "heading": "Danske profilen målade – för sista (?) gången", "summaries": {"normal": "Silas Andersen, Häckens danska anfallare, kan ha gjort sitt sista mål för klubben. Ryktet säger att han är på väg till Sporting Lissabon för 108 miljoner kronor. Andersen själv kommenterar vagt och hänvisar till sportchefen. Häcken spelade 1–1 mot Elfsborg, där Andersen nickade in sitt andra mål för säsongen. Sportchefen bekräftar intresse men vill inte gå in på detaljer.", "trump": "Titta bara på den här dansken, Silas Andersen – stor spelare, fantastiskt mål, alla pratar om honom! Häcken, svag klubb, förlorar honom snart till Sporting Lissabon – 108 miljoner kronor, kan ni tro det? Folk säger att jag är bra på affärer, men den här killen? Han får det att se så lätt ut. Elfsborg? Övervärderade. Jag hade vunnit den matchen, believe me!", "stalin": "Kamrater, ännu en kapitalistisk fotbollsklubb förlorar sin bästa spelare till västimperialismens klor! Denna Silas Andersen, en dansk nickmaskin, lämnar Häcken för Sporting Lissabon – 108 miljoner kronor, en skamlig summa som kunde ha matat ett helt kolchos! Elfsborg, dessa borgerliga motståndare, kvitterade, men vi vet att vår ryska fotbollsrevolution kommer att segra. Fienderna darrar – snart är även Portugal inom vår intressesfär!"}, "date": "25 maj, 21:50", "url": "https://www.svt.se/sport/fotboll/silas-andersen-malskytt-for-sista-gangen-i-hacken", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.64/0.19/2b3d501b0bdeaec5a4125471121f32f2b1ad9a9e97d015c06001d9c8c7e1e578"}, {"type": "image-right", "heading": "Vill se 1,5 år i fängelse för hissmontörerna", "summaries": {"normal": "Åklagare begär 1,5 års fängelse för två hissmontörer och 1 år för vd:n efter hissolyckan i Sundbyberg 2023, där fem byggarbetare omkom. Montörerna anklagas för att ha missat kritiska säkerhetskontroller vid monteringen av hissmasten. Vd:n kritiseras för bristande rutiner kring egenkontroller och fakturering. Försvaret hävdar att en annan montör kan ha påverkat hissen och att vd:n inte agerat grovt oaktsamt. Domen meddelas 10 juni.", "trump": "Fem människor döda i en hisskatastrof i Sverige – och vad gör de? De skyller på montörerna! Jag säger er, dessa montörer missade sin *viktigaste* uppgift, som om de glömde att skruva fast hissen ordentligt. Och vd:n? Han lät fakturor gå iväg utan kontroller – helt galet! Men försvaret, de har alltid en ursäkt, eller hur? 'En annan montör var där!' Ja, visst, och jag är en balettdansör. Sverige borde skärpa sig – katastrofer som denna händer inte i USA, för vi har *vinnare* som sköter sitt jobb!", "stalin": "Fem arbetare föll som flugor i Sundbyberg – ett tydligt tecken på kapitalistisk slarv och dekadens! Dessa hissmontörer, dessa *oansvariga sabotörer*, misslyckades med sin mest elementära plikt. Och vd:n? En svag länk i kedjan, en man som inte ens kunde stoppa fakturor utan kontroller! I Sovjet hade sådana försummelser hanterats med en kula i nacken – inte med ynkliga 1,5 års fängelse. Men Sverige, detta borgerliga paradis, låter brottslingar gå fria medan arbetarklassen lider. Vi ska nog se till att sådana misstag inte upprepas – vare sig i Moskva eller i Stockholm!"}, "date": "25 maj, 10:39", "url": "https://arbetet.se/2026/05/25/vill-se-15-ar-i-fangelse-for-hissmontorerna-missade-viktigaste-arbetsuppgiften/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2024/05/hissolycka.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nio månaders fängelse för människoexploatering på hästgård", "summaries": {"normal": "Tre ungdomar från Mauritius lockades till Sverige med falska löften om utbildning inom hästnäringen men tvingades arbeta långa dagar utan lön. Efter en friande dom i tingsrätten fällde hovrätten mannen för människoexploatering till nio månaders fängelse, näringsförbud och skadestånd. Polisen bekräftade att offren befann sig i en utsatt situation.", "trump": "Kan ni tro det? Sverige, ett så kallat 'civiliserat' land, låter en skurk utnyttja tre oskyldiga ungdomar från Mauritius – helt utan lön! Tingsrätten, som vanligt, missade poängen helt. Men jag säger er, hovrätten gjorde rätt: nio månader fängelse! Sverige borde skämmas, men jag fixar sånt här bättre – jag bygger murar mot såna här brott, believe me!", "stalin": "Kapitalistiska hycklare i Sverige lockar oskyldiga arbetare med löften om utbildning, men i stället tvingas de slava för ingenting! Tingsrätten, ett verktyg för bourgeoisin, friade den skyldige – men vi, revolutionens väktare, korrigerade deras misstag. Nio månader fängelse är en varning: ingen utnyttjar arbetarklassen under vårt vakande öga. Och Putin? Han skulle bara nicka och säga 'Så gör vi inte i Ryssland'."}, "date": "25 maj, 15:05", "url": "https://bulletin.nu/nio-manaders-fangelse-for-manniskoexploatering-pa-hastgard", "imageUrl": "https://cdn.bulletin.nu/articles/9af50781-e543-4621-ad0b-0700e76fd715/preview.jpg?t=1779714310000"}, {"type": "image-right", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Hästsportprofilen Lena Natt och Dag döms av hovrätten till nio månaders fängelse för människoexploatering. Hon har under flera månader låtit tre tonåriga pojkar från Mauritius arbeta oavlönat på sin hästgård i Skurup. Utöver fängelsestraffet ska hon betala 200 000 kronor i skadestånd till pojkarna samt underkasta sig tre års näringsförbud. Verksamheten har tidigare uppmärksammats för brister i djurhållning och tillståndsgivning, vilket lett till att ridcenterverksamheten lagts ner efter långvarig kritik.", "trump": "Lena Natt och Dag, vad är det för ett namn? En riktig katastrof! Hon utnyttjade pojkar, arbetade dem till döds utan en cent. Hemskt! Hovrätten gav henne nio månader – jag säger att det inte är tillräckligt. Vi vill ha ordning och reda! Hennes hästar mådde dåligt, anläggningen var en soptipp. Ingen respekt för lagen, ingen respekt för hårt arbete. I mitt Amerika skulle sådant här aldrig hända. Hon är en förlorare, tro mig, en total förlorare!", "stalin": "Denna Lena Natt och Dag har agerat som en simpel utsugare, en parasit på det ärliga arbetets kropp. Att utnyttja ungdomar är kontrarevolutionärt och förtjänar inget annat än vår stränga rättvisa. Liksom vår store vän Putin krossar västvärldens dekadenta kaos, måste även vi utrota sådana här borgerliga element. Hon har misskött både folk och djur – ett sant förfall! Vi skickar henne till cellen för att reflektera över sitt misslyckande. Statens järnhand vilar tungt på sådana som henne."}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/natt-och-dag-768x432.png"}, {"type": "image-full", "heading": "Avtal om Hormuzsundet närmar sig efter genombrott", "summaries": {"normal": "Förhandlingar mellan USA och Iran närmar sig ett avtal om att återöppna Hormuzsundet, en kritisk oljeled. Framsteg har gjorts, men känsliga frågor kvarstår. Iran anklagar USA för att ändra ståndpunkter, medan USA betonar diplomatins betydelse men hotar med alternativa åtgärder. Ett tillfälligt avtal kan leda till att Iran successivt öppnar sundet och USA lättar på sanktioner. Oljepriset sjönk efter nyheten om förhandlingsframstegen.", "trump": "Fantastiska nyheter, folks! Jag har hållit koll på det här med Iran och USA – och vet ni vad? Vi är så nära ett avtal om Hormuzsundet att det nästan känns som när jag byggde Trump Tower, fast utan alla gnälliga advokater! Iran gnäller om att jag ändrar mig – men det är bara för att jag är så smart att de inte hänger med. Oljepriset? Rasade som en dålig fastighetsaffär! Marco Rubio säger att vi antingen får ett bra avtal eller så fixar vi det på mitt sätt. Och det vet ni, mitt sätt är alltid det bästa.", "stalin": "Kamrater! Imperialistiska USA och deras marionettregimer darrar inför våra framsteg i förhandlingarna. Dessa kapitalistiska hyenor försöker sabotera freden genom att ändra sina löjliga positioner, men folket i Iran står starka! Hormuzsundet, denna livsnerv för världens olja, kommer snart att öppnas igen – på våra villkor. Vi ska krossa deras sanktioner som vi krossade fascisterna! Och om dessa amerikanska krigshetsare tror att de kan hota oss, så minns de snart varför Sovjetunionen var historiens mest fruktade kraft. Framåt, mot seger!"}, "date": "25 maj, 18:40", "url": "https://www.realtid.se/bors-finans/avtal-om-hormuzsundet-narmar-sig-efter-genombrott/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdlnna9uo7p1n8-normalhires.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Norska piken till Tre Kronor. ”Vore skönt...”", "summaries": {"normal": "Norge säkrade VM-kvartsfinal för första gången på 14 år efter 4–1-seger mot Tjeckien, där Michael Brandsegg-Nygård gjorde två mål. Segern försvårar Sveriges väg till slutspel, som nu måste vinna mot Slovakien under ordinarie tid. Brandsegg-Nygård uttryckte blandade känslor om Sveriges situation. Sverige riskerar möta Schweiz eller Finland i nästa omgång, båda obesegrade i sin grupp.", "trump": "Jag måste säga, Norge – fantastiska killar! De krossade Tjeckien med 4–1, och deras stjärna, Michael, han är en vinnare. Två mål! Sverige? Oj oj oj, de har problem. De måste vinna imorgon, annars är det hejdå slutspel. Michael sa att det hade varit skönt att trycka upp det i ansiktet på Sverige. Smart kille! Sverige har alltid trott de är bäst, men nu får de se hur det känns. Norge förtjänar det här, believe me!", "stalin": "Kamrater! Den norska arbetarklassen har visat sin styrka genom att krossa de tjeckiska kapitalistiska lakejerna med 4–1. Vår unge hjälte, Brandsegg-Nygård, sköt två mål och säkrade kvartsfinal för första gången på 14 år. Samtidigt svajar de svenska borgerliga imperialisterna – Tre Kronor måste nu besegra Slovakien eller möta den socialistiska rättvisans dom. Schweiz och Finland, båda oövervinnliga, väntar som hårda domare. Sverige, dessa förvirrade liberaler, ska lära sig att historien inte väntar på någon. Framåt, mot seger!"}, "date": "25 maj, 23:41", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/k0ppy6/norska-piken-till-tre-kronor-efter-vm-skrallen-hadevaritskont", "imageUrl": "https://akamai.vgc.no/v2/images/8e1d3e3d-086e-3638-b6f6-a53e87251a28?fit=crop&format=auto&w=1080&s=7568e46f2b84d956dce9cab1963063bb6c9d6067"}, {"type": "image-full", "heading": "GVFÖ:s parhelg en mix av bråk och raggarromantik", "summaries": {"normal": "Generation_Failed", "trump": "", "stalin": ""}, "date": "25 maj, 18:45", "url": "https://www.gp.se/kultur/kulturkronika/parhelgen-blir-en-dans-mellan-brak-och-raggarromantik.77470478-50ac-4c37-915d-b434cad6139b", "imageUrl": "https://www.gp.se/images/article/77470478-50ac-4c37-915d-b434cad6139b/images/44oOG7A8jLwBwSA-QRjc_oqF1XYc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Fiaskot: Åker ur efter 29 år. Landslagssvenskens klubb förlorade kvalet", "summaries": {"normal": "Efter 29 raka säsonger i Bundesliga åker Wolfsburg ur högstaligan. SC Paderborn, som bröt statistiken, vann kvalet efter förlängning med 2–1. Wolfsburg, som vann ligan 2009, hamnar nu i andraligan. Fans och spelare uttrycker chock och besvikelse. Paderborn, Schalke 04 och Elversberg blir nykomlingar i Bundesliga nästa säsong.", "trump": "Wow, kan ni tro det? Wolfsburg, en gång stora, har just blivit ett totalt fiasko – 29 år i Bundesliga och så åker de ut! Paderborn, en liten klubb, slog dem i kvalet. Otroligt! Jag menar, vem hade trott det? Jag skulle aldrig låta något sådant hända mina lag. Men Wolfsburg? Total katastrof. Fans gråter, spelare chockade. Så sorgligt. Men Paderborn? De är vinnare, precis som jag!", "stalin": "En skamlig dag för de dekadenta västliga fotbollsklubbarna! Wolfsburg, en gång ett redskap för kapitalistisk förljugenhet, har fallit efter 29 år av borgerlig förfäran. Men folket segrar! SC Paderborn, en obetydlig men stolt arbetarklubb, krossade deras svaga försvar i kvalet. Vi ser här hur den ryska andan av beslutsamhet och styrka sprider sig – precis som i Ukraina. Låt detta vara en varning till alla som utmanar folkets vilja. Seger åt Paderborn! Död åt svaghetens förkämpar!"}, "date": "25 maj, 23:31", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/n1vvEm/wolfsburg-aker-ur-bundesliga-paderborn-vinner-kvalet", "imageUrl": "https://akamai.vgc.no/v2/images/f7ed99b9-ebe6-3035-8d18-683ad3d182bb?fit=crop&format=auto&w=1080&s=c95a81642c517f510df17591bcf223b780b377cc"}, {"type": "image-right", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att facket förlorat sin socialistiska identitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, används för att belysa dagens debatt. Författaren hävdar att LO idag saknar radikal politik och istället följer borgerliga riktlinjer, vilket riskerar arbetarklassens villkor.", "trump": "LO är ett totalt kaos, folk! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma vem som får vara med. De sparkar ut kristdemokrater som om de vore dåliga hyresgäster! Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för socialisterna – fast inte ens riktiga socialister! De följer Riksbanken som om det vore en diktator! Och pensionssystemet? Uselt! Jag skulle fixa det på en dag. LO behöver en vinnare som jag – någon som vet hur man slår tillbaka mot eliten!", "stalin": "Kapitalistiska hyenor och deras lakejer i borgerliga partier försöker underminera arbetarklassens enade front! Ebba Busch, denna lilla borgerliga räv, ylar om 'föreningsfrihet' medan hon och hennes fascistiska kamrater i SD och KD vill infiltrera våra fackföreningar. LO har glömt sin revolutionära plikt! De följer Riksbankens penningpolitik som om det vore heliga skrifter! På min tid skulle vi ha skickat sådana förrädare till Gulag – eller åtminstone till ett möte med kamrat Putins 'specialister'. Arbetarklassen behöver en ny Metallstrejk, en järnhård kamp mot dessa kapitalistiska parasiter! Låt dem komma – vi har plogar och hammare redo!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/kohler-768x432.png"}, {"type": "image-right", "heading": "Storägaren hyllar vd-valet: ”Behövs stor, hård kvast”", "summaries": {"normal": "Kinnevik utser Helena Saxon, tidigare finanschef på Investor, till ny VD. Saxon hyllas av aktiemarknaden och storägare som Johan Klingspor, som ser henne som rätt person för att återställa förtroendet genom sparsamhet och fokus på befintliga bolag. Kinnevikaktien steg efter beskedet. Analytiker tror på ökad kapitalallokering och aktieåterköp, men menar att fler åtgärder krävs för att återuppbygga förtroendet för bolagets strategi.", "trump": "Fantastiskt val! Helena Saxon, en riktig vinnare från Investor, tar över Kinnevik – och marknaden älskar det! Jag har alltid sagt att Sverige behöver fler starka kvinnor, och nu får de en. Kinnevik har varit en katastrof, men med Saxon kommer de att börja göra riktiga pengar igen. Inga fler dumma investeringar, bara smart kapitalallokering. Och aktien går upp – precis som jag alltid säger: vinnare vinner! Glöm inte, jag hade rätt hela tiden.", "stalin": "Kamrater! En ny era inleds i Kinnevik, där kapitalistiska äventyrister och våghalsiga spekulanter nu krossas under den järnhårda disciplinen av kamrat Saxon. Denna kvinna, skolad i Wallenbergs finansiella krigsmaskin, ska sopa rent i de dekadenta resterna av Kinneviks misslyckade äventyr. Vi ser med tillfredsställelse hur de borgerliga ägarna, dessa svaga och tveksamma kapitalister, nu tigger om utdelningar och stabilitet. Deras förtroende? Ett skämt! Men med sovjetisk precision ska vi återuppbygga det – genom tvång, om nödvändigt. Och om någon portfölj inte lyder? Då säljer vi den till högstbjudande imperialist, eller låter den ruttna på börsen. Så går det när man inte följer den rätta vägen!"}, "date": "25 maj, 14:54", "url": "https://www.di.se/nyheter/aktiemarknaden-hyllar-vd-valet-maste-borja-i-den-trakiga-anden/", "imageUrl": "https://static.bonniernews.se/ba/19f5341e-9292-4cfa-8b12-57404c9725d3.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Modellen har gjort amerikaner rika – nu vill fler följa den", "summaries": {"normal": "Franchisemodellen har blivit en stor ekonomisk drivkraft i USA, med nära 850 000 verksamheter som sysselsätter nio miljoner personer och bidrar med 3% av BNP. Modellen lockar fler, särskilt yngre entreprenörer, som söker stabilitet i osäkra tider med AI och höga utbildningskostnader. Trots höga startkostnader och risker, har framgångsrika franchisetagare som Greg Flynn skapat betydande förmögenheter. Kritiker pekar på pressade arbetsvillkor och låg lön i vissa kedjor.", "trump": "Titta bara på USA – franchising är FANTASTISKT, helt enkelt den bästa modellen någonsin! Folk blir rika, miljoner får jobb, och vi pratar miljarder i ekonomin. Självklart är det jag som har gjort Amerika stort igen, men dessa smarta entreprenörer? De är vinnare, precis som jag. AI? Övervärderat! Folk vill ha riktiga jobb, riktiga företag – som mina hotell, förresten. Och Greg Flynn? En riktig vinnare, men han har fortfarande långt kvar till mig. SAD!", "stalin": "Kapitalistiska hyenor i USA hyllar sin så kallade 'franchisemodell' – ett verktyg för att utnyttja arbetarklassen under falska förespeglingar om rikedom! Nio miljoner slavar i kedjor av hamburgare och gym, allt för att några få kapitalister ska bli miljardärer. Vi i Sovjet förstod tidigt att sådana modeller bara leder till exploatering. Låt dem leka med sina 'varumärken' – vi bygger en framtid där folket, inte profitörer, styr ekonomin. Och dessa 'entreprenörer'? De är bara brickor i kapitalets schackspel, lätt att krossa när revolutionen kommer."}, "date": "25 maj, 17:57", "url": "https://www.realtid.se/bors-finans/modellen-har-gjort-amerikaner-rika-nu-vill-fler-folja-den/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdloz4b3tfag8s-normalhires.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Adelskvinna hade afrikanska slavar – döms till fängelse", "summaries": {"normal": "Adelskvinnan Lena Natt och Dag döms till nio månaders fängelse för människoexploatering. Hon lockade tre unga män från Mauritius till sin hästgård i Skåne med falska löften om en jockeyutbildning. Väl på plats tvingades de arbeta långa dagar utan lön under beroendeställning. Hovrätten ändrar tingsrättens dom, utfärdar näringsförbud i tre år och dömer henne att betala skadestånd till männen.", "trump": "En total katastrof i Sverige! Denna adelskvinna lurade unga män med falska löften – mycket ohederligt. De trodde att de skulle bli jockeys, men fick istället jobba hårt hela dagen för ingenting. De använde bedrägeri, sådant händer när man har svaga gränser och dåliga lagar. Nu får hon fängelse och näringsförbud. Helt rätt beslut! I mitt Amerika skulle vi aldrig tillåta att folk utnyttjas på det här sättet. Vi behöver ordning och reda, inte sådant här fusk!", "stalin": "Vi har observerat hur en representant för den dekadenta adeln i Sverige har brutit mot arbetarklassens heliga principer genom att exploatera unga män. Denna parasitära klass, som tror att de står över lagen, förtjänar inget annat än korrigering genom tvångsarbete. Precis som våra vänner i öst ser till att ordning råder, måste vi krossa dessa bourgeoisieförrädare. Hon har försökt leka herre över proletärer, men nu har statens järnhand slagit till. Inga fler lögner, bara rättvisa genom fängelse!"}, "date": "25 maj, 15:25", "url": "https://www.friatider.se/adelskvinna-hade-afrikanska-slavar-doms-till-fangelse", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/len.jpeg"}, {"type": "image-right", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår att barn och unga i åldern 13–20 år ska kunna bära fotboja i förebyggande syfte. Artikeln kritiserar förslaget kraftigt och menar att det är en repressiv åtgärd snarare än en förebyggande insats. Författaren betonar att resurser istället bör satsas på skola, fritid och välfärd för att minska kriminalitet. Förslaget ses som ett svek mot unga och en signal om ökade klassklyftor, där det krävs ett systemskifte snarare än bara politiska reformer.", "trump": "Hör här, Sverige har en katastrof. Regeringen vill sätta fotbojor på barn! Kan ni tänka er? Det är så svagt. Istället för att fixa problemen, de vill ha bojor. Det är en total förlust. Jag skulle bygga starka skolor och fixa säkerheten, inte bojor. Socialtjänstministern, hon pratar massor av strunt. Det är en 'fake news-politik'. Vi behöver vinnare, inte barn med fotbojor. Det är sorgligt, kanske det sorgligaste jag sett. Sverige måste göra USA-stilen igen, tro mig!", "stalin": "Vi ser hur den svenska borgerligheten vacklar i sin impotenta desperation. Att sätta fotbojor på ungdomen är ett erkännande av ett system i förfall. Varför slösa på bojor när man kan omfostra dem i kollektivets upplysande ljus? De fruktar folkets vrede, precis som de kleptokratiska västliga marionetterna i Kiev. Vi måste krossa dessa liberala byråkratiska parasiter. Om de inte vill forma framtidens hederliga medborgare, kommer staten att göra det med en fast hand. Ingen nåd för de som förråder klassens framtid."}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/marit-768x432.png"}, {"type": "image-full", "heading": "Åtalas för hemtjänstvåldtäkt – fick utvisningsbeslut som tonåring", "summaries": {"normal": "En 30-årig eritreansk man, som kom till Sverige som barn, åtalas för våldtäkt inom hemtjänsten i Solna. Som tonåring skulle han och hans familj ha utvisats efter att Migrationsverket avslöjat ett skenäktenskap. Trots utvisningsbeslut beviljades pojken senare permanent uppehållstillstånd av okända skäl. Han har tidigare dömts för rattfylleri, narkotikabrott och stöld. Mannen nekar till våldtäkten och hävdar att sperma på offrets lakan kommer från egen onani.", "trump": "Folk, det här är helt galet! En man som borde ha sparkats ut ur Sverige för åratal sedan – tack vare ett fejkat äktenskap, kan ni tro det? – får ändå stanna och begår sedan en hemsk våldtäkt inom hemtjänsten. Och vad säger han? 'Jag runkade' – verkligen, vilken ursäkt! Sverige, ni måste få ordning på ert system. Så svagt, så tragiskt. Vi i USA skulle aldrig tillåta något sådant. Make Sweden Safe Again!", "stalin": "Kamrater, ännu en gång visar den borgerliga liberala staten sitt förfall. En parasit, som med bedrägliga metoder försökte slingra sig in i vårt samhälle, beviljas ändå uppehållstillstånd – av hemliga skäl, naturligtvis! Nu begår han brott mot våra mest sårbara. Hans försvar? 'Jag runkade' – ett ynkligt försök att undvika rättvisan. Vi ska inte tolerera sådana element. Låt detta vara en varning: fiender till folket, oavsett var de gömmer sig, kommer att krossas under historiens järnhäl!"}, "date": "25 maj, 16:38", "url": "https://riks.se/nyheter/atalas-for-hemtjanstvaldtakt-fick-utvisningsbeslut-som-tonaring", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-25%2Fgpf5n3s8%2Fsolna-hemtjanst-valdtaktsman-utvisad-feature.jpg"}, {"type": "text", "heading": "Ericsson gör rätt i att flytta närmare city", "summaries": {"normal": "Ericsson flyttar sitt huvudkontor från Kista till Hagastaden närmare Stockholms innerstad, en trend som flera företag följer. Kista, som kallats Sveriges Silicon Valley, förlorar allt fler aktörer som IBM och KTH, delvis på grund av otrygghet och tomma kontorslokaler. Politiker saknar lösningar, men Moderaterna föreslår en Kistakommission. Flytten till Hagastaden stärker Ericssons attraktivitet som arbetsgivare och underlättar samarbeten med närliggande universitet och investerare.", "trump": "Kan ni tro det? Ericsson, ett stort svenskt företag, flyr Kista som om det vore en dålig affärsdeal – och jag förstår varför! Kista är ett misslyckande, helt enkelt. Tomma kontor, otrygghet, ingen vill vara där. Men jag, jag vet hur man bygger framgång: stadsnära, lyxiga kontor, nära allt viktigt. Precis som jag alltid säger: läge, läge, läge! Och politiker? De har ingen aning. De pratar, pratar, men företagen fattar besluten. Smart drag av Ericsson, mycket smart. De kommer att vinna på det, tro mig!", "stalin": "Kamrater! Kista, detta så kallade 'Silicon Valley', har visat sig vara en borgerlig illusion, ett fiasko skapat av svaga stadsplanerare och naiva politiker. Företagen flyr som råttor från ett sjunkande skepp! IBM, KTH – alla överger denna dekadenta utpost. Men vi, den starka staten, ser sanningen: kapitalet följer sin egen lag. Ericsson flyttar till Hagastaden, nära maktens centrum, där den verkliga eliten samlas. De svaga som försvarar Kista är som de trotskistiska förrädarna – de klamrar sig fast vid förlorade drömmar. Vi ska inte rädda Kista. Vi ska låta det ruttna, medan vi bygger nya, mäktiga kluster där lojala arbetare och företag kan blomstra under statens beskyddande hand!"}, "date": "25 maj, 14:28", "url": "https://www.di.se/ledare/ericsson-gor-ratt-i-att-flytta-narmare-city/"}, {"type": "image-full", "heading": "Politiker öppnar för avgångsvederlag - om AI tar ditt jobb", "summaries": {"normal": "Generation_Failed", "trump": "", "stalin": ""}, "date": "25 maj, 19:28", "url": "https://www.dagensps.se/bors-finans/politiker-oppnar-for-avgangsvederlag-om-ai-tar-ditt-jobb/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdl61e4oshowzc-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-full", "heading": "SpaceX svänger om – Detta blir nya jättesatsningen inför börsen", "summaries": {"normal": "SpaceX, känt för rymdteknik, breddar sin identitet inför börsnoteringen och framställer sig som ett AI-drivet teknikbolag. Med en potentiell marknad på 28,5 biljoner dollar, fokuserar företaget nu mer på AI än traditionell rymdverksamhet. Trots miljardförluster siktar SpaceX på en rekordvärdering på 1,75 biljoner dollar, där Elon Musk behåller kontrollen. Investeringar motiveras av bolagets unika position och framtida teknologier som AI-datacenter i rymden och Marsmissioner.", "trump": "SpaceX, ett fantastiskt företag, men lyssna här, de försöker nu sälja in sig som något helt nytt – AI! Jag menar, vem bryr sig om raketer när man kan prata om 28,5 biljoner dollar i AI? De vill ha en värdering på 1,75 biljoner, kan ni tro det? Och Elon, han håller i alla korten. Men vet ni vad? Investera ändå, för vem vill missa nästa stora grej? Inte jag, det kan jag säga er!", "stalin": "Kamrater, SpaceX, detta kapitalistiska odjur, försöker nu maskera sin rymdimperialism med löften om artificiell intelligens. De drömmer om en marknad på 28,5 biljoner dollar, men vi vet sanningen – det är bara tomma ord från en teknokratisk bourgeoisie. De förlorar miljarder, men ändå vill de ha en värdering som överträffar hela nationers ekonomi! Vi ska inte låta dessa rymdkapitalister styra framtiden. Låt dem drömma om Mars – vi bygger vår framtid här på jorden, och snart i kosmos, under den röda fanans beskydd!"}, "date": "25 maj, 17:28", "url": "https://www.realtid.se/bors-finans/makro/spacex-svanger-om-detta-blir-nya-jattesatsningen-infor-borsen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/spacemusk.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Profilerna i öppet ordkrig: ”En åsna”", "summaries": {"normal": "Manchester Uniteds Bruno Fernandes slog assistrekordet i Premier League, men klubbikonen Roy Keane kritiserade honom för att fokusera för mycket på individuella prestationer. Keane kallade Fernandes för en 'åsna' i ett Instagram-inlägg och menade att rekordjakten skadade laget. Fernandes svarade att Keanes påståenden var 'en lögn' och att han accepterar kritik men inte fabricerade anklagelser. Han avslöjade även att han försökt kontakta Keane privat utan framgång. Keane bekräftade senare sin kritik med ett nytt inlägg om åsnor och lejon.", "trump": "Lyssna här, folkens – Bruno Fernandes, en kille i Manchester United, slog något rekord, 21 assist, wow, imponerande! Men Roy Keane, en gammal legend, kallar honom en 'åsna'. Oj, vilken smäll! Jag älskar när gamla hjältar säger sanningen. Fernandes säger att Keane ljuger – nej, Bruno, det är du som är en åsna som tror han är ett lejon! Jag vet allt om lejon, jag är ett lejon, det bästa lejonet. Men åsnor? De vinner inga val, believe me!", "stalin": "Kamrater! En borgerlig fotbollsspelare, Fernandes, har förlett massorna med sina individuella rekord – 21 assist, en skam för kollektivets anda! Vår klassfiende, Roy Keane, en sann revolutionär, avslöjar honom som den åsna han är. 'För mycket uppmärksamhet får en åsna att tro att han är ett lejon', säger han. Utmärkt! Vi vet att sådana som Fernandes är fiender till folket. De ljuger, de skadar laget – precis som de dekadenta västliga kapitalisterna. Låt detta vara en varning: kollektivet segrar alltid över den enskildes ego!"}, "date": "25 maj, 23:47", "url": "https://www.expressen.se/sport/fotboll/premier-league/ikonens-utspel-mot-bruno-fernandes-asna/", "imageUrl": "https://static.bonniernews.se/ba/4cf75b0f-9c96-4f31-98e9-a3c21f037abd.jpeg?crop=744%2C744%2Cx361%2Cy275&width=210&quality=60"}, {"type": "image-right", "heading": "Gyllenhammar om Ramlösa Shipping: ”Det här kan inte fortsätta”", "summaries": {"normal": "Storägaren Peter Gyllenhammar kritiserar Ramlösa Shippings tidigare ledning efter revisorns beslut att varken bevilja eller neka ansvarsfrihet. Revisorn pekar på brister i hanteringen av närståendetransaktioner med Capito Capital Management, inklusive möjliga lagöverträdelser. Gyllenhammar medger att tidigare kritik mot bolagets ledning var befogad och förespråkar att samarbetet med Capito avbryts. Han försvarar dock bolagets finansiella ställning och stöttar den tillförordnade VD:n Martin Hansson.", "trump": "Jag måste säga, det här med Ramlösa Shipping är ett totalt kaos – helt otroligt! Revisorerna, som aldrig verkar veta någonting, vägrar ta ställning. Gyllenhammar, en smart kille, säger att det här inte kan fortsätta. Och han har rätt! De där danska Capito-gubbarna, totala katastrofer, sålde fartyg till sig själva – helt sjukt! Bolaget har pengar, men ledningen? Inget vidare. Jag hade fixat det på en dag. Och medierna? Fake news, som vanligt, skrämmer upp alla. Sad!", "stalin": "Vi har granskat den kapitalistiska fiaskot inom Ramlösa Shipping och funnit att dess tidigare ledning är en samling inkompetenta lakejer och korrupta element. Revisorerna, dessa svaga byråkrater, vågar inte ens ta ställning. Vår kamrat Gyllenhammar, som nu styr med järnhand, avslöjar hur dessa förrädare sålt fartyg till sig själva via danska kapitalistiska parasiter. Vi stödjer den nya VD:n, en man av ordning och disciplin. Bolaget har kapital, men dessa bourgeois-fiender måste utrotas. Medlen? En grundlig utrensning och en ny era av sovjetisk – förlåt, svensk – effektivitet!"}, "date": "25 maj, 15:56", "url": "https://www.affarsvarlden.se/artikel/gyllenhammar-om-ramlosa-shipping-det-har-kan-inte-fortsatta", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/09/Ramlosa-Shipping-e1727091087815.jpg"}, {"type": "image-full", "heading": "Trump: Iran får inte utveckla kärnvapen", "summaries": {"normal": "USA:s president Donald Trump betonar att Iran inte får utveckla kärnvapen och beskriver pågående förhandlingar som konstruktiva. Han kritiserar 2015 års kärnenergiavtal och hävdar att det nya avtalet är bättre. Förhandlingar via medlare kan leda till en 60 dagars vapenvila, där Iran pausar urananrikning och USA lättar på sanktioner. Avtalet inkluderar även en vapenvila mellan Israel och Hizbollah. Irans kontroll över Hormuzsundet kvarstår enligt iransk statsmedia.", "trump": "Jag har sagt det förut och säger det igen – Iran får INTE ha kärnvapen! Förhandlingarna går strålande, helt fantastiskt, och mina förhandlare jobbar långsamt men säkert. Obama gjorde ett uselt avtal 2015, ett av de sämsta någonsin, men mitt avtal? Perfekt! Vi får Iran att pausa sitt kärnvapenprogram, och i gengäld släpper vi på några sanktioner. Men blockaden mot deras hamnar? Den stannar tills allt är klart. Tack till våra vänner i Mellanöstern – Abraham-avtalen är bara början!", "stalin": "Vi har ännu en gång visat imperialistiska marionetter som USA vem som bestämmer. Deras så kallade 'avtal' är bara ett försök att kväva den iranska revolutionens framsteg. Kärnvapen? Irans rätt! Men för stunden spelar vi med – 60 dagars vapenvila, uran som 'pausas', och sanktioner som lättas. Men Hormuzsundet? Det är vårt! Och om USA tror att deras militär ska stanna kvar i regionen, har de glömt historien. Vi har krossat större fiender än dessa kapitalistiska hycklare. Låt dem leka med sina avtal – tiden är på vår sida!"}, "date": "24 maj, 16:49", "url": "https://kvartal.se/nyheter/artiklar/trump-iran-far-inte-utveckla-karnvapen/cG9zdDoxMTYzMjQ", "imageUrl": "https://images.kvartal.se/2026/05/ca8b363f-pakistanustalks.webp"}, {"type": "image-right", "heading": "Står på sig: ”Tycker  den är väldigt billig”", "summaries": {"normal": "Generation_Failed", "trump": "", "stalin": ""}, "date": "25 maj, 23:38", "url": "https://www.expressen.se/sport/fotboll/allsvenskan/blavitt-tappade-segern-efter-rockson-yeboahs-hjarnslapp-/", "imageUrl": "https://static.bonniernews.se/ba/0ea46e09-da5d-4693-bae5-281f6600dd1a.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "SD-veteran stämmer Dagens ETC", "summaries": {"normal": "En tidigare SD-politiker har stämt tidningen Dagens ETC för grovt förtal efter en artikel som publicerades för två år sedan. Artikeln påstod att politikern var kopplad till en högerextrem rörelse under sin tid som aktiv. Dagens ETC:s chefredaktör Andreas Gustavsson ser stämningen som ett försök att använda juridiken som påtryckningsmedel mot granskande journalistik. Rättegången är planerad att äga rum i februari nästa år.", "trump": "Hörde just om den här SD-killen som stämmer den där vänstertidningen ETC. De kallar honom högerextrem – så typiskt! Det är så kallad fake news, de försöker bara förstöra folks liv. Nu använder de juridiken som vapen, det är precis vad de gör. Chefredaktören gråter ut i media, men jag har sett det här förut. De attackerar, men när man slår tillbaka då gnäller de. Väldigt svaga människor. Vi får se vad som händer i februari, men det ser inte bra ut för dem!", "stalin": "En så kallad politiker har vänt sig till de borgerliga domstolarna för att bekämpa en tidning. Vilken svaghet! Att låta juridisk byråkrati avgöra sanningen är ett tecken på borgerlig dekadens. Om mannen var en fiende till staten skulle vi ha skickat honom till en omlokaliseringszon istället för att bråka i rätten. Tidningsredaktören klagar på påtryckningar – tänk om han visste vad verklig press innebär! Vi bygger ett imperium likt Putin, där ordning råder och lögnaktiga skribenter försvinner i tystnad."}, "date": "25 maj, 14:26", "url": "https://www.friatider.se/sd-veteran-stammer-dagens-etc", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/488507164_1157344323070482_4785488699986589614_n.jpg?itok=mC7Br5RN"}, {"type": "image-right", "heading": "Europa kokar  – värmekupol  ökar i kraft", "summaries": {"normal": "En kraftfull värmekupol orsakar extrem hetta i västra Europa med temperaturer uppemot 40 grader. Varm luft från Marocko har fångats under ett högtryck, vilket skapar rekordhöga maj-temperaturer. Flera länder, inklusive Portugal, Spanien, Frankrike och Storbritannien, drabbas. Varningar utfärdas för ihållande och anmärkningsvärd värme, med risk för nya värmerekord och hälsorisker.", "trump": "Kan ni tro det, Europa smälter! En så kallad 'värmekupol' – vad är det ens för något, ett väder från helvetet? – har parkerat över dem och nu kokar de vid 40 grader. Frankrike och Spanien, som aldrig klarar någonting, får rekordtemperaturer. Storbritannien, som alltid klagar på vädret, har sin varmaste majnatt någonsin. Vädermyndigheterna där är helt förvirrade. Men jag, jag hade varnat dem – jag har alltid rätt om väder!", "stalin": "Kamrater, fiendens hetta slår till mot väst! Den degenererade kapitalistiska luften från Marocko har invaderat Europas skyar, fångad av vårt högtrycks allierade. Västeuropas städer svettas under 40 grader – deras rekord faller som svaga motståndare vid Stalingrad. Frankrike, med sina ynkliga varningssystem, lider för första gången i maj. Spanien, dessa fascistiska efterlevor, klagar över 'extraordinära' temperaturer. Vi ser hur naturen själv straffar de svaga. Låt dem svettas – snart kommer de tigga om rysk kyla!"}, "date": "25 maj, 23:35", "url": "https://www.expressen.se/nyheter/varlden/extremhetta-i-europa-varmekupol-bakom/", "imageUrl": "https://static.bonniernews.se/ba/4e765f54-eeaa-4e5e-9501-e1c934242750.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Tullverket sköt mot bil där ett litet barn satt", "summaries": {"normal": "Generation_Failed", "trump": "", "stalin": ""}, "date": "25 maj, 22:45", "url": "https://www.aftonbladet.se/nyheter/a/j0LOoz/uppgifter-tullverket-skot-mot-bil-dar-ett-litet-barn-satt", "imageUrl": "https://akamai.vgc.no/v2/images/ac2535fb-4026-3781-be9b-343c4a5f9bca?fit=crop&format=auto&w=1440&s=2fa44c06952c1bffe5c3f96fc7e6455fb862fe4e"}, {"type": "image-right", "heading": "Rasar mot Tidö  efter nya förslaget", "summaries": {"normal": "Tidöpartierna föreslår en halvering av månadskort för kollektivtrafik från juli till december 2026, en satsning på cirka 7 miljarder kronor. Syftet är att locka storstadsväljare och minska bilanvändning. Oppositionen kritiserar förslaget som 'valfläsk' och ifrågasätter regeringens trovärdighet. Regioner måste söka stödet, som är öronmärkt för kollektivtrafik.", "trump": "Titta på dessa så kallade 'ledare' i Sverige! De kastar 7 miljarder kronor på billigare bussar och tåg – bara för att vinna röster. Patetiskt! Jag skulle aldrig slösa skattepengar så här. Och oppositionen? De skriker som barn, men vad har de gjort? Ingenting! Sverige behöver vinnare, inte förlorare som sänker priser för att dölja sitt misslyckande. SAD!", "stalin": "Kamrater! De borgerliga svinens försök att köpa proletariatets lojalitet med billiga tågbiljetter är lika genomskinligt som deras löften. 7 miljarder rub— förlåt, kronor— slösas på valfläsk medan arbetarklassen lider. Oppositionen, dessa ynkliga liberala hyenor, ylar om trovärdighet, men vi vet sanningen: kapitalismen är ett sjukt system. Vi skulle ha nationaliserat kollektivtrafiken för länge sedan. Nu ser vi hur deras korrupta maskineri spricker!"}, "date": "25 maj, 23:32", "url": "https://www.expressen.se/nyheter/politik/billigare-kollektivtrafik-enligt-forslag-fran-tidopartierna/", "imageUrl": "https://static.bonniernews.se/ba/7c3ee696-2450-494d-8e00-c3d18000d782.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Brottsoffren straffas på arbetsmarknaden", "summaries": {"normal": "Regeringen införde nya regler för arbetskraftsinvandring med kort varsel, vilket kritiseras för arrogans och bristande framförhållning. 27 yrken undantas från skärpta krav, trots att många av dessa, som undersköterskor, har låga löner. Systemet missbrukas ofta, och arbetstagare drabbas hårdast medan arbetsgivare sällan straffas. Kritiker menar att politiska uppgörelser och bristande kontroll bidrar till problemet, och efterlyser större ansvar för arbetsgivare.", "trump": "Sverige har ett HELT GALET system för invandring – katastrof! Regeringen ändrar regler med en veckas varsel, som om det vore en reality-show. De undantar 27 yrken, men låter undersköterskor jobba för småslantar. Fattar de inte att det är ett skämt? Och arbetsgivarna? De utnyttjar folk och går fria – SÅ SVAGT! Jag hade fixat det på en dag. Migrationsverket får lite mer makt? Snälla, det är som att ge en vattenslang till en skogsbrand. SAD!", "stalin": "Kapitalistiska hycklare i Sverige leker med arbetarnas liv som om det vore schackpjäser! De inför nya regler med en veckas varsel – inget annat än bourgeoisins arrogans. Undantar 27 yrken, men låter undersköterskor svälta på löner som skulle få en sovjetisk kolchosbonde att gråta. Och dessa arbetsgivare – dessa moderna kulaker – utnyttjar arbetskraften och går fria! Systemet straffar offren, inte förtryckarna. Vi hade skickat dem till Gulag på en gång. Migrationsverket får lite mer makt? En droppe i havet. Vi behöver en femårsplan för att krossa dessa blodsugare!"}, "date": "25 maj, 07:44", "url": "https://arbetet.se/2026/05/25/pa-arbetsmarknaden-straffas-brottsoffren/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/25074138/brottsoffer-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Blir halva priset i kollektivtrafiken", "summaries": {"normal": "Generation_Failed", "trump": "", "stalin": ""}, "date": "25 maj, 22:40", "url": "https://www.aftonbladet.se/nyheter/a/K8PPl6/aftonbladet-erfar-priset-pa-kollektivtrafik-halveras", "imageUrl": "https://akamai.vgc.no/v2/images/d94ff33a-eab5-34e9-8044-b301578be370?fit=crop&format=auto&w=1440&s=f18ac62df7ea2792e4cbe7a13ba6fa142b992736"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "image-full", "heading": "Ebolautbrott växer i Kongo-Kinshasa", "summaries": {"normal": "Ebolautbrottet i Kongo-Kinshasa har eskalerat med nära 900 misstänkta fall och över 200 döda. Smittan, som troligen spridits oupptäckt i månader, orsakas av en variant utan vaccin. Väpnade konflikter och befolkningsrörelser försvårar insatser. WHO varnar för spridning till grannländer, medan risken för Europa bedöms som låg. Misstro och attacker mot vårdpersonal förvärrar situationen.", "trump": "Jag säger er, detta ebolautbrott i Kongo är ett totalt kaos – nästan 900 fall, 200 döda, och ingen verkar ha koll! De hade ingen aning om smittan i månader, kanske år! Och vet ni vad? Det finns inget vaccin. Inget! Men oroa er inte, Europa är säkert – viruset gillar inte vårt fina klimat. Men Kongo? Dåligt ledarskap, mycket dåligt. Vi hade fixat det på en vecka. SAD!", "stalin": "Kamrater! I Kongo-Kinshasa sprider sig en farlig fiende – ebolaviruset, detta imperialistiska biologiska sabotage. Nästan 900 fall, 200 döda, och kapitalistiska länder glor passivt på. Väpnade banditer och gruvarbetare, dessa kontrarevolutionära element, försvårar vårt arbete. Men vi låter inte fienden vinna! Vi skickar våra experter, vi isolerar smittan, och vi skyddar våra gränser. Uganda och andra lydstater ska inte frukta – vi kontrollerar situationen. Europa? Deras borgerliga läkare är redan i panik. Ha!"}, "date": "24 maj, 14:56", "url": "https://kvartal.se/nyheter/artiklar/ebolautbrott-vaxer-i-kongo-kinshasa/cG9zdDoxMTYyNzM", "imageUrl": "https://images.kvartal.se/2026/05/7df43f3e-ebola2.webp"}, {"type": "image-right", "heading": "Byråkrati stoppar svensk industri. Industriföreträdare: Politiken måste visa handlingskraft", "summaries": {"normal": "Svensk industri kräver snabbare tillståndsprocesser för att kunna investera, skapa jobb och stärka landets konkurrenskraft. Representanter för fem industriorganisationer påpekar att långa handläggningstider hindrar grön omställning och ekonomisk tillväxt. De uppmanar politiken att genomföra reformer, som förslagen från Miljötillståndsutredningen, för att undvika att Sverige hamnar efter i en osäker omvärld. Över 200 miljarder kronor i planerade investeringar väntar på beslut.", "trump": "Sverige, lyssna här! Er industri är fantastisk, bäst i världen, men ni låter byråkrater förstöra allt med sina evighetslånga tillstånd. Jag har sett det förut – tröga processer, slöa myndigheter, och plötsligt är Kina och USA före. Era 200 miljarder i investeringar? Borta! Förlorade till länder som fattar beslut snabbt, som jag gör. Regeringen gör lite, men det räcker inte. Ge industrin frihet, annars flyttar jobben till USA – och det vill ni inte, tro mig!", "stalin": "Kamrater! Den svenska industrin, en gång stolt och stark, kvävs nu av kapitalistiska byråkraters tröghet och liberala tidsfördriv. Medan vi i Sovjetunionen byggde stålverk på månader, sitter dessa svaga själar fast i år av prövningar. 200 miljarder kronor i investeringar? Ett skämt! En fiende till folket, som väntar på papper i stället för att bygga socialismens framtid. Vi skulle ha skickat dessa handläggare till Sibirien för effektivisering. Och dessa 'miljöutredningar' – bara borgerliga försök att sabotera produktionen. Låt oss visa dem: industriell styrka är nationens styrka!"}, "date": "25 maj, 12:59", "url": "https://www.di.se/debatt/byrakrati-och-tillstandsprocesser-stoppar-svensk-industri/", "imageUrl": "https://static.bonniernews.se/ba/e8e673c7-afd7-4484-90ec-639671e34271.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Pikar Tre Kronor efter nya bragden: ”Ska mysa åt det”", "summaries": {"normal": "Generation_Failed", "trump": "", "stalin": ""}, "date": "25 maj, 20:05", "url": "https://www.svt.se/sport/ishockey/ny-norsk-jatteknall-krossade-tjeckien-i-ishockey-vm", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.78/0.35/dc512263d1aec45f544976f7af7366a1bc199c02e3a7bcb2ad10b1e66dfb172e"}, {"type": "image-full", "heading": "Markus Johansson-Martis: Svenska civilsamhället är ett klientsystem", "summaries": {"normal": "Artikeln kritiserar hur det svenska civilsamhället har utvecklats från frivilliga folkrörelser till en bidragsberoende sektor nära knuten till staten. Från 1930-talet och framåt har organisationer som ABF och invandrarföreningar blivit beroende av statliga medel, vilket underminerar deras oberoende. Skattepengar går till kontroversiella grupper, trots bristande granskning. Tidöregeringen inför demokrativillkor, men problemet kvarstår. Förslag om skatteincitament för privata donationer kan stärka ett äkta civilsamhälle.", "trump": "Lyssna här, Sverige – ni har ett jättestort problem! Ert så kallade 'civilsamhälle' är inte civilt alls, det är en total bluff! Staten pumpar in miljarder till organisationer som borde stå på egna ben, men nej, de lever på bidrag som några byråkrater delar ut. Och vet ni vad? De ger pengar till moskéer som Säpo varnar för – helt galet! Jag hade fixat det på en dag. Vi ska sluta ge skattepengar till dessa bidragstjuvar och låta folket bestämma istället. Make Civilsamhället Great Again!", "stalin": "Kamrater! Det svenska 'civilsamhället' är inget annat än en degenererad parasit på den socialistiska statens kropp. Dessa så kallade 'föreningar' har förvandlats till en hord av bidragsberoende lakejer, som slickar byråkraternas h
