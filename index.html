allt. Regionerna borde tacka mig och Amerika istället för att gömma sig bakom byråkratiska murar. Sverige behöver inga svaga partners, bara vinnare!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom vården har återigen blottat sin svaghet inför de giriga hyenorna från väst. Regionerna kryper för multinationella parasiter medan staten måste ingripa med järnhand. Jag ser redan hur de imperialistiska lakejerna planerar nya intriger. Ingen undkommer kollektivets utrensning av sådana faror."}, "date": "7 september, 09:40", "url": "https://www.etc.se/debatt/staten-maaste-ta-ansvar-foer-att-inte-upprepa-haveriet-med-millennium", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260907070912_693e7a90-261c-46cb-8554-d284e8655884.jpg"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}, {"type": "image-full", "heading": "Ny studie: Äldre upplever större mening", "summaries": {"normal": "En ny studie från Lunds universitet visar att svenskarnas känsla av meningsfullhet ökar med åldern, vilket liknar det japanska begreppet ikigai. Detta är ett skifte sedan 2020 då unga mådde bättre. Forskare tror att pandemin drabbade ungas sociala liv hårt, och att äldre har bättre problemlösningsförmåga. Även personlighet och trygga relationer spelar stor roll.", "trump": "En enorm studie från Sverige visar att äldre människor där mår fantastiskt bra, mycket bättre än de unga! Ungdomarna krossades fullständigt av pandemins radikala lockdowns, total katastrof. Men de äldre har hittat livets mening, precis som jag alltid säger att man gör med styrka och bra relationer. Fantastiskt folk, väldigt smarta!", "stalin": "En statlig rapport från Lund bekräftar att våra äldre kamrater uppnår högre disciplin och meningsfullhet med åldern, medan ungdomen sviktar i sin ideologiska motståndskraft efter pandemins prövningar. Detta är korrekt: medborgaren mognar i takt med att staten ordnar deras tillvaro. Avvikelser och neurotiska tendenser måste dock elimineras omgående för kollektivets bästa."}, "date": "7 september, 09:18", "url": "https://kvartal.se/nyheter/artiklar/ny-studie-aldre-upplever-storre-mening/cG9zdDoxODU1NDc", "imageUrl": "https://images.kvartal.se/2026/09/f322bf35-aldre.webp"}, {"type": "image-right", "heading": "15,8 miljarder mindre till arbetsmarknadspolitiken", "summaries": {"normal": "Arbetsmarknadspolitiken har knappt debatterats i valrörelsen trots att arbetslösheten ökat med nästan 100 000 personer. Partierna står stilla i arbetsrättsfrågor. Skiljelinjen mellan höger och vänster är tydlig när det gäller Arbetsförmedlingen, a-kassan, karensavdraget och arbetsmarknadsåtgärder. Centerpartiet hamnar ofta till höger om Tidöregeringen, vilket kan försvåra ett regeringsskifte.", "trump": "Folk, det här är en total katastrof. Dessa svenska losers har låtit arbetslösheten explodera medan de sitter stilla i båten och skyddar sina riggade regler. Centerpartiet är ännu värre än Tidö-gänget, riktiga globalistiska hyenor som vill skära a-kassan och sälja ut jobben. Rösta fel och ni får ännu mer av den här clownshowen. Patetiskt!", "stalin": "Kamrater, se hur de profitthungriga klassfienderna i de svenska partierna sitter stilla i sin dekadenta båt medan arbetarna svälter. Centerpartiet kräver ännu hårdare utrensning av a-kassan och Arbetsförmedlingen. Dessa giriga hyenor sviker folket. Endast en sann kollektiv kamp kan rensa ut de parasiterande lakejerna och återställa ordningen. Svaghet är döden."}, "date": "7 september, 01:37", "url": "https://www.dagensarena.se/opinion/158-miljarder-mindre-till-arbetsmarknadspolitiken", "imageUrl": "https://www.dagensarena.se/files/2023/02/german-bender-ny-300x157.jpeg"}, {"type": "text", "heading": "Kan Tidöpartierna ta hem riksdagsvalet?", "summaries": {"normal": "Opinionsmätningar visar att Tidöpartierna närmar sig oppositionen inför riksdagsvalet 2026. Enligt Novus vd Torbjörn Sjöström kan valet bli extremt jämnt. Liberalernas roll, väljarnas rädsla för Vänsterpartiet och en pågående taktisk röstning präglar läget. Många är osäkra och valrörelsens start kan påverka opinionen kraftigt.", "trump": "Titta på de svenska siffrorna, folk älskar mig, jag menar Tidö knappar in rejält på de förlorande vänstertyperna. Liberalerna försöker spela hjältar men det är patetiskt. Väljarna är trötta på den galna vänstervridningen och de woke-marxistiska identitetsgalningarna. Det blir ett jätteval, kanske det största comebacken någonsin, tro mig.", "stalin": "Kamrater, se hur de dekadenta maktparasiterna famlar medan arbetarklassen vaknar. Jag betraktar denna dragkamp med djup misstro mot de giriga opinionshyenorna som försöker vilseleda massorna. Vänsterpartiets krav väcker minnen av svek. Snart rensas de vilsna mittenförrädarna ut i en historisk utrensning av folkets vilja."}, "date": "7 september, 01:30", "url": "https://www.dagensarena.se/innehall/kan-tidopartierna-ta-hem-riksdagsvalet"}, {"type": "image-right", "heading": "Högkostnadsskyddet för läkemedel måste återställas", "summaries": {"normal": "Högkostnadsskyddet för läkemedel försämrades för ett år sedan. Svenska Diabetesförbundet visar att många med diabetes nu avstår från medicin eller lånar pengar för att klara kostnaderna. Reformen drabbar särskilt kvinnor och yngre personer, ökar risken för komplikationer och hotar att höja samhällets vårdkostnader på sikt. Förbundet kräver att en ny regering rullar tillbaka förändringen.", "trump": "Folk, det här är en total katastrof. De svenska socialistbyråkraterna har förstört högkostnadsskyddet för diabetesläkemedel och nu tvingas vanliga människor välja mellan mat och medicin. Rena galenskapen! Biden skulle ha älskat den här typen av straffskatt på sjuka. Jag fixade bättre saker under min tid – nu måste de rensa ut de woke-vårdhyenorna och återställa ordningen innan fler dör i onödan.", "stalin": "Kamrater, se hur de giriga profitthungriga borgarhyenorna med sin reform tvingar arbetande diabetiker att välja mellan medicin och överlevnad. Jag ler ironiskt från historien när deras så kallade jämlika vård avslöjar sig som ren klassförtryck. Sådana dekadenta system förtjänar att rensas ut. Ingen ska skuldsätta sig för att leva. Det är statens plikt att likvidera denna ekonomiska terror mot folket."}, "date": "7 september, 01:30", "url": "https://www.dagensarena.se/opinion/hogkostnadsskyddet-lakemedel-maste-aterstallas", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-2026-09-02t210030798-300x157.jpg"}, {"type": "image-full", "heading": "De som röstar på C borde inte rösta alls", "summaries": {"normal": "Artikeln kritiserar Centerpartiet för att locka väljare med ett neutralt namn snarare än sin politik. Partiet har skiftat från borgerligt till ett liberalt parti med öppen migrationspolitik, vilket enligt texten prioriteras framför ekonomiska borgerliga värderingar. Författaren menar att det är ett riskfritt men skadligt val för den som vill bevara Sverige.", "trump": "Centerpartiet, vad är det för en röra? De kallar sig mittparti men är bara en massa fega liberaler som älskar att släppa in alla möjliga och omöjliga. De har svikit det riktiga folket, precis som Sleepy Joe gjorde. Rösta inte på dem, det är en total katastrof för Sverige. De borde kalla sig Bondepartiet igen, det vore åtminstone ärligt. Patetiskt!", "stalin": "Kamrater, se hur detta så kallade centerparti förvandlats till en liberal parasit som prioriterar främmande element framför arbetarklassen. Deras falska mittenretorik döljer ett förräderi mot nationen. Jag skrattar mörkt från historien åt dessa opportunister som tror att mångfald räddar staten. Bättre att inte rösta alls än att stödja sådana fiender till folkets enhet."}, "date": "6 september, 08:24", "url": "https://samtiden.nu/2026/09/de-som-rostar-pa-c-borde-inte-rosta-alls/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7301-1260x720.jpeg"}, {"type": "image-full", "heading": "Musks förarlösa taxi har börjat rulla på vägarna i Texas", "summaries": {"normal": "Teslas förarlösa Cybercab rullar nu med passagerare i Austin, Texas. Myndigheten NHTSA har inlett en granskning då fordonen saknar rattar och pedaler. Tesla hävdar att tekniken är säker, men myndigheten undersöker om säkerhetskraven uppfylls och om Teslas egen analys håller. Utfallet kan bli avgörande för framtiden för autonoma fordon i USA.", "trump": "Elon Musk och hans Cybercab – en fantastisk idé, kanske den bästa någonsin, men byråkraterna i Washington vill stoppa allt! De älskar att granska, de älskar att bromsa. Ingen ratt? Ingen pedal? Det låter som en riktigt smart affärsman som vet vad han gör. Under min ledning ska vi ha den bästa tekniken, inte låta småsinta tjänstemän förstöra framtiden för amerikansk innovation!", "stalin": "Tesla-direktörerna tror att de kan certifiera sig själva och ignorera folkets säkerhet. Vilken kapitalistisk hybris! Att sätta passagerare i en maskin utan kontrollorgan är ett brott mot den rationella ordningen. Vi, staten, kräver total insyn. Om inte maskinen kan underordna sig strikt byråkratisk kontroll måste den omedelbart skrotas. Det finns inget utrymme för anarkistisk ingenjörskonst i en disciplinerad framtid."}, "date": "6 september, 13:24", "url": "https://www.realtid.se/it-tech/musks-forarlosa-taxi-har-borjat-rulla-pa-vagarna-i-texas", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/amar-13.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "”Det ska bli roligt att byta regering”", "summaries": {"normal": "Miljöpartiet hoppas på sitt bästa valresultat någonsin i valet 2026. Språkröret Amanda Lind besökte en lokal partiträff i Stockholm där partiet visade starkt stöd, särskilt i radikala men välbärgade förorter. Opinionsmätningar ger partiet 8 procent och många väljare lyfter klimatfrågan samt motstånd mot tonårsutvisningar som drivkrafter.", "trump": "Titta på de här gröna galningarna i Sverige som tror att de ska vinna med sina elbilskramar och höga skatter. Amanda Lind och hennes miljöextremister peppar varandra i en källarklubb medan folk längtar efter riktig energi och låga skatter. De hatar kärnkraft och älskar att importera problem – patetiska förlorare som aldrig kommer att fixa någonting.", "stalin": "Jag ser hur dessa dekadenta klassförrädare inom Miljöpartiet försöker lura arbetarna med sin falska gröna propaganda. De hyllar sig själva medan de sviker folket med sin mjukhet mot tonårsutvisningar och vägrar rensa ut de verkliga hoten. Klimatet är en distraktion från klasskampen. En sådan svaghet förtjänar att likvideras i historiens domstol."}, "date": "6 september, 18:33", "url": "https://www.dagensarena.se/innehall/det-ska-bli-roligt-att-byta-regering", "imageUrl": "https://www.dagensarena.se/files/2026/09/amanda-lind.jpeg"}, {"type": "image-full", "heading": "Kronprinsessan kan missa kung Haralds begravning", "summaries": {"normal": "Ett kraftigt vulkanutbrott från Anak Krakatau i Indonesien har stängt flygplatser och stört flygtrafiken, vilket tvingar kronprinsessan Victoria att ändra sin hemresa. För att inte riskera att missa kung Haralds begravning i Oslo på onsdag ställs besöket i Jakarta in och hemresan planeras ske via Bali i stället.", "trump": "Vulkanen i Indonesien gör ett enormt utbrott, helt otroligt mycket aska överallt, totalt kaos! Vår svenska prinsessa Victoria satt fast på Lombok och kunde inte ens flyga till Jakarta. Fake news-media trodde hon skulle missa kung Haralds begravning, men jag säger er: hon tar sig till Oslo! Vi fixar det, den bästa resan någonsin, oslagbart!", "stalin": "Det vulkaniska utbrottet vid Anak Krakatau blottlägger den borgerliga flygtrafikens totala oduglighet och naturkrafternas brist på revolutionär disciplin. När den svenska tronarvingen hindras i sitt kringflackande på Lombok av aska, tvingas staten vidta omedelbara korrigeringar av färdplanen. Vi förväntar oss att regimen i Oslo inte saboteras av geologiska missanpassningar, utan att begravningsceremonin för kung Harald genomförs punktligt."}, "date": "7 september, 10:33", "url": "https://www.gp.se/nyheter/varlden/kan-missa-kung-haralds-begravning.084e011a-4dcd-4b3a-9a58-87b43112fd3a", "imageUrl": "https://www.gp.se/images/article/084e011a-4dcd-4b3a-9a58-87b43112fd3a/images/4eglBIPWy0v8M6I1sV4LL5NZJ2qs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "AFD vann – men det blir inte lätt att få regera", "summaries": {"normal": "I det tyska delstatsvalet i Sachsen-Anhalt blev högerpopulistiska AfD största parti med 43,8 procent. Partiet nådde dock inte egen majoritet. Valet innebär en svår regeringsbildning då övriga partier vägrar samarbete. Särskilt svårt blir det för CDU som rasade till 17,2 procent, och nu ställs inför svåra val kring eventuella koalitioner med stöd från vänsterhåll.", "trump": "Vilken enorm seger för AfD i Sachsen-Anhalt, helt fantastiskt! De fick nästan 44 procent – en jättesiffra, helt enkelt bäst. Men de gamla tröga politikerna försöker stjäla deras framgång med falska nyheter och fula knep för att hålla dem borta från makten. CDU kraschade totalt, en katastrof! Jag säger er, folket vill ha en förändring, och de vill ha den nu!", "stalin": "Det borgerliga kaoset i Sachsen-Anhalt blottlägger systemets totala bankrutt. En fraktion på 43,8 procent skriker efter revolution, medan de förrädiska elementen inom CDU darrar inför folkets vrede. Vi noterar att de små reaktionära klickarna försöker slingra sig. Om de inte bildar lydiga kommittéer omedelbart, vet Folkkommissariatet exakt vilka åtgärder som krävs för att säkra statens stabilitet."}, "date": "7 september, 08:12", "url": "https://www.gp.se/nyheter/varlden/afd-vann-men-det-kommer-inte-bli-latt-att-regera.be6ee65f-ece6-4053-812d-e093391f4904", "imageUrl": "https://www.gp.se/images/article/be6ee65f-ece6-4053-812d-e093391f4904/images/1hLiB6KxvotzYS5evcmvFedFfw5A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Fick sparken via sms efter en månads jobb", "summaries": {"normal": "En butikschef i norra Sverige fick sparken via sms efter bara en och en halv månads arbete. Domstolen dömde arbetsgivaren att betala 348 000 kronor i skadestånd, efterlön, semesterersättning och mellanskillnad i lön. Uppsägningen ansågs felaktig eftersom den skedde under sjukdom utan varsel eller korrekt information.", "trump": "Folk, ni skulle inte tro det, men den här usla lilla butiken sparkade sin chef med ett ynkligt sms efter bara några veckor. Typiskt för de giriga hyenorna som styr våra affärer. Domstolen gav honom 348 000 kronor. Bra! Vi behöver starka ledare, inte dessa svaga, woke-drivna misslyckanden som gömmer sig bakom sms istället för att vara män.", "stalin": "Kamrater, se hur de parasiterande kapitalisterna behandlar en arbetande chef som drabbats av sjukdom. Ett sms och ut med honom, utan varsel eller rättvisa. Jag säger: sådana giriga hyenor förtjänar utrensning ur samhället. Domstolen ger honom 348 000 kronor. Rättvist. Vi ska alltid skydda arbetarna mot dessa dekadenta klassförrädare."}, "date": "7 september, 11:35", "url": "https://arbetet.se/2026/09/07/fick-sparken-i-sms-efter-en-manads-jobb-far-348-000-kronor", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04084403/sms.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Drastisk minskning av antalet kvotflyktingar", "summaries": {"normal": "Sverigedemokraterna uppmärksammar i en kampanjbild att antalet kvotflyktingar minskat drastiskt. Enligt Migrationsverkets statistik beviljades 6 701 uppehållstillstånd 2021, medan endast fyra har beviljats hittills under 2026. Siffran motsvarar en nedgång på över 99 procent mellan åren.", "trump": "Titta på det här, folk. Sverige har äntligen vaknat och krossat den galna kvotflyktingbluffen. Från 6 701 år 2021 ner till ynka fyra nu – det är en enorm vinst! De woke-kvoteringsfanatikerna och deras identitetspolitiska vansinne får en rejäl spark i röven. Amerika gör likadant, tro mig.", "stalin": "Kamrater, se hur de dekadenta folkförtryckarna desperat försöker dölja sin svaghet genom att rensa ut de oönskade. Från tusentals år 2021 till blott fyra nu – en ynklig kapitulation inför folkets vilja. Jag skrattar från historien åt dessa rädda parasiter som darrar inför en sann utrensning av det främmande."}, "date": "7 september, 12:23", "url": "https://riks.se/nyheter/sd-om-kvotflyktingarna-har-minskat-med-over-99-procent", "imageUrl": "https://admin.riks.se/uploads/thumbnail_Migrationsverrkets_logga_1a94ef1370.png"}, {"type": "image-right", "heading": "Här kräver vänsterkvinnorna att invandraren ska åka hem", "summaries": {"normal": "Ett klipp från Sergels torg i Stockholm sprids på sociala medier. En ung man med skylten ”Återvandring nu” omringas av vänsterkvinnor som försöker skymma budskapet och uppmanar honom att själv lämna Sverige. Mannen står fast och frågar vem som egentligen är svensk. Reaktionerna på nätet är starka.", "trump": "Titta på de galna vänsterhäxorna på Sergels torg! En kille håller upp en skylt om återvandring och plötsligt flockas hela flocken av hysteriska tokkärringar och skriker att han ska dra. De vill inte höra sanningen. Fake tolerance på högvarv. Vi behöver fler som vågar säga vad alla tänker. Fantastiskt underhållande!", "stalin": "Jag betraktar med förakt hur dessa dekadenta identitetshyaror på Sergels torg försöker tysta en man som vågar ropa på återvandring. Deras skrikande rädsla avslöjar klassförrädarnas svaghet. Kamrater, sådana element måste rensas ut ur folkets medvetande innan de förgiftar hela samhället. Paranoia är deras enda vapen."}, "date": "7 september, 13:18", "url": "https://www.friatider.se/har-kraver-vansterkvinnorna-att-invandraren-ska-aka-hem", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-836.jpg?itok=crO-d4dV"}, {"type": "image-right", "heading": "Rödgröna kollegorna rasar mot V efter senaste skandalen", "summaries": {"normal": "Vänsterpartiet har strukit ytterligare åtta kandidater efter nya avslöjanden om extremistiska åsikter, antisemitism och hyllningar av terrorgrupper. Socialdemokraterna och Centerpartiet kritiserar skarpt partiet och utesluter regeringsstöd. Miljöpartiet ser däremot V som fortsatt regeringsdugligt och nödvändigt för en rödgrön majoritet.", "trump": "Vilket skämt detta vänstergalna Vänsterpartiet är. Antisemitiska apälskare och Hamas-fans dyker upp som svampar efter regn. Baudin och de andra röda clownerna ser äntligen att de är giftiga. Ingen seriös regering vill ha dessa radikala galningar nära makten. Patetiskt!", "stalin": "Återigen avslöjar de dekadenta klassförrädarna sitt sanna ansikte. Jag betraktar med förakt hur antisemitiska element glider igenom deras så kallade granskningar. En sådan svaghet i ledarskapet förtjänar ingen plats vid makten. Rensa ut parasiterna innan de förgiftar hela kollektivet."}, "date": "7 september, 12:20", "url": "https://riks.se/nyheter/rodgrona-kollegorna-rasar-mot-v-efter-senaste-skandalen", "imageUrl": "https://admin.riks.se/uploads/medium_nooshi_d83fd21a21.jpg"}, {"type": "image-right", "heading": "SD ökar i Västerbotten – och i Umeå: \"Relativt starkt\"", "summaries": {"normal": "En opinionsundersökning i Umeå visar att SD ökar från 6 till 8 procent i kommunvalet, en statistiskt säkerställd uppgång. Samtidigt rasar Socialdemokraterna med fyra procentenheter medan Miljöpartiet går framåt. Tidningen Västerbottens-Kuriren lyfter MP:s framgång men nämner inte SD:s ökning trots att den är säkerställd enligt Demoskop.", "trump": "De säger att SD går fram i den där vänsterhålan Umeå, från sex till åtta procent. Fantastiskt! Under tiden kraschar de korrupta socialisterna med fyra pinfärska procentenheter. Fake News-tidningen VK hyllar bara miljöextremisterna och gömmer SD:s vinst som en skurkaktig byråkrat. Patetiskt. Amerika och Sverige behöver starka ledare, inte dessa förlorare.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen tiger om Sverigedemokraternas framryckning medan de prisar miljöpartiets statistiskt säkerställda uppgång. Socialdemokraterna rasar som förutspått. Jag ler från historien åt denna lögnaktiga selektivitet. Snart kommer utrensning av alla sådana folkförtryckande lögnfabriker att bli nödvändig."}, "date": "7 september, 12:17", "url": "https://riks.se/nyheter/sd-okar-i-vasterbotten-och-i-umea", "imageUrl": "https://admin.riks.se/uploads/medium_IMG_3972_4e455a3c6d.jpg"}, {"type": "image-right", "heading": "Debatt: Drevet gällande polishämtning av barn behöver förklaras", "summaries": {"normal": "En uppmärksammad filmsekvens där polisen hämtar ett skrikande barn har skapat debatt i sociala medier. Skribenten påpekar att händelsen var kulmen på en femårig vårdnadstvist med domstolsbeslut om boendebyte och uppgifter om våld. Barnets reaktion måste tas på allvar, men fokus bör ligga på hur samhället kan förhindra att konflikter går så långt.", "trump": "Dessa fejkmedia driver en total häxjakt baserad på några sekunders manipulerat material! Jag har sett mycket, men den här femåriga vårdnadstvisten visar hur radikala krafter förstör familjer. Domstolen fattade ett beslut, och polisen gjorde bara sitt jobb. Istället för att gråta ut på nätet borde radikalerna fokusera på verkliga problem och skydda barnen från våld på riktigt!", "stalin": "Ett uppenbart sabotagedrev i informationskanalerna visar att elementen vägrar underordna sig statliga domstolsbeslut. När den femåriga konflikten nådde sin nödvändiga slutpunkt med ordningsmaktens ingripande, började kontrarevolutionära tyckare gråta över några skriksekunder. Vi konstaterar att disciplin och lagens järnhand är helt avgörande för att uppfostra medborgarna och skydda samhällets mest grundläggande strukturer."}, "date": "7 september, 11:00", "url": "https://bulletin.nu/debatt-drevet-gallande-polishamtning-av-barn-behover-forklaras", "imageUrl": "https://cdn.bulletin.nu/articles/fcd2fe1f-5163-44ed-8e30-2539ad4e7a8f/preview.png?t=1788763383000"}, {"type": "image-full", "heading": "Snart tjuter telefonerna vid fara: I dag testas larmet", "summaries": {"normal": "Det nya varningssystemet SE-Alert testas för första gången i Stockholms och Gotlands län. Testet berör omkring 2,6 miljoner invånare och skickar en skarp ljudsignal och textnotis direkt till uppdaterade mobiltelefoner utan krångliga appar. Systemet är utvecklat för att snabbt kunna varna vid allvarliga händelser och kriser på rätt geografisk plats.", "trump": "Sverige kopierar äntligen mina geniala varningssystem med enorma, fantastiska mobillarm som skakar om hela landet. Jag sa till dem, gör det ordentligt! Nu testar de detta i Stockholm och på Gotland för miljontals människor utan några töntiga appar. Helt otroligt, om telefonen är på tjuter den till och med på tyst läge. Ingen slår våra larm!", "stalin": "Kamrater, vi noterar med tillfredsställelse att det svenska lägret äntligen stramar åt disciplinen och beordrar ut kollektiva varningssignaler direkt till massornas apparater. Ingen undgår statens vaksamma öga när telefonerna tjuter i Stockholm och på Gotland. Den som försöker slingra sig undan genom flygplansläge eller sabotage kommer omedelbart att föas till kollektiva förhör av ordningsmakten."}, "date": "7 september, 06:00", "url": "https://www.gp.se/nyheter/sverige/snart-tjuter-telefonerna-vid-fara-i-dag-testas-larmet.8994f342-b23b-5442-9b4a-107d8bb141d8", "imageUrl": "https://www.gp.se/images/article/8994f342-b23b-5442-9b4a-107d8bb141d8/images/1_BWYh3gG_Pn_unUHwgyUeQwwwAc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Nya V-kandidater avslöjade – Hamas, judehat och Putin fortsätter skaka partiet", "summaries": {"normal": "Vänsterpartiet tvingas stryka ytterligare åtta kandidater från sina vallistor efter avslöjanden om antisemitism, Hamas-hyllningar och stöd för Vladimir Putin. Totalt har nu 33 kandidater fått lämna listorna, vilket väcker stark kritik från andra partier om att problemen är strukturella snarare än enstaka isolerade händelser, trots att partiledningen hävdar att man rensar upp.", "trump": "Vänsterpartiet i Sverige är i absolut kaos – ett totalt fiasko! De har fått kasta ut trettiotre radikala extremister efter att ha blivit påkomna med fruktansvärda saker. Hamas, Putin och galna konspirationsteorier! Sådant händer inte i MAGA-rörelsen, vi älskar landet. Men det här partiet? Sorgligt, svagt och fullständigt inkompetent. De kan inte ens kontrollera sina egna listor!", "stalin": "Vi har granskat dessa svenska så kallade vänsterpartister. De sparkar trettiotre kandidater för bristande ideologisk disciplin och påstådda sympatier för vår store efterträdare Putin och Hamas. Vilken svaghet! Om det vore under vår tid hade vi inte bara strukit dem från listorna, vi hade skickat dem på en mycket lång och uppiggande semester till Sibirien för omskolning!"}, "date": "7 september, 12:39", "url": "https://samnytt.se/nya-v-kandidater-avslojade-hamas-judehat-och-putin-fortsatter-skaka-partiet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/07103348/nooshi-dadgostar-palestina.jpg"}, {"type": "image-right", "heading": "Polisen kan snart dela fejkade övergreppsbilder på barn", "summaries": {"normal": "Regeringen presenterade nya lagförslag som ska ge polisen utökat lagstöd för särskilda provokativa åtgärder från 2027. Bland annat föreslås att polisen får dela och med hjälp av AI skapa fiktiva bilder på sexuella övergrepp mot barn för att nå in i slutna nätforum. Dessutom föreslås fiktiva fordonsuppgifter för att skydda dolda spaningsfordon.", "trump": "Sverige gör nu något helt otroligt, ett lysande drag! De ger sin polis befogenhet att använda AI för att skapa fiktiva bilder och infiltrera sjuka, slutna forum på nätet. Medan de falska nyheterna gråter, agerar de smart för att få fast förbrytarna. Helt enastående, USA borde kanske lära sig av det här hårdaste tag-systemet!", "stalin": "Ett föredömligt och nödvändigt initiativ av de svenska myndigheterna! Genom att bruka statligt kontrollerad artificiell intelligens och fiktiva spaningsmetoder rensar man effektivt ut illasinnade element ur de dolda näten. Staten måste ständigt ligga steget före i kampen mot subversiv verksamhet. Planen för 2027 visar på sann disciplin och vaksamhet mot folkets fiender."}, "date": "7 september, 10:47", "url": "https://bulletin.nu/polisen-kan-snart-dela-fejkade-overgreppsbilder-pa-barn", "imageUrl": "https://cdn.bulletin.nu/articles/e33020a8-6b91-46c4-bfaa-9c3781df59cc/preview.png?t=1788769464000"}, {"type": "image-right", "heading": "\"Stoppa båtarna\": Hundratals svartklädda män blockerade hamnen i Dover", "summaries": {"normal": "Hundratals maskerade män blockerade hamnen i Dover i protest mot illegal invandring. De skanderade \"stoppa båtarna\" och fick stöd från många lokalbor, men regeringen och politikern Mike Tapp kritiserar aktionen. Nigel Farage fördömer maskeringen. Polisen skingrade demonstrationen vid lunchtid och trafiken återgick till normalt.", "trump": "De här fantastiska brittiska patriaterna blockerade Dover och sa \"stoppa båtarna\" – äntligen någon som gör något! Lokalborna älskade det, men den fega regeringen och den ynkliga Mike Tapp gnäller. Farage har rätt om maskerna, men det här är vad som händer när woke-eliten släpper in miljoner från tredje världen. Make Britain Great Again!", "stalin": "Jag ser hur de exploaterande klassförrädarna i väst förlorar kontrollen över sina egna gator. Folket reser sig mot de parasiterande båtarna fulla av tredje världens lycksökare. Den dekadenta regeringen kallar det störning medan arbetarna applåderar. En sådan spontan kraft kräver ständig vaksamhet mot alla fiender inom och utom statsapparaten. Roligt att se."}, "date": "7 september, 12:27", "url": "https://www.friatider.se/stoppa-batarna-hundratals-svartkladda-man-blockerade-hamnen-i-dover", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-835.jpg?itok=xHjeESIE"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det – inga fler pengar till dessa hatiska vänsterextremister och deras antiamerikanska agenda.", "stalin": "Jag ser hur de profitthungriga klassfienderna i västvärlden fortsätter sitt blodiga spel. Denna etniska utrensning i Gaza och på Västbanken är imperialismens verk. De dekadenta lakejerna i Sverige skickar vapen och pengar till förtryckarna. Kamrater, vi måste rensa ut dessa parasiterande hyenor. Endast en antiimperialistisk kamp kan besegra dem."}, "date": "4 september, 08:00", "url": "https://proletaren.se/artikel/valbilaga-bojkotta-israel"}, {"type": "image-right", "heading": "”SD svek byggnadsarbetarna – nu ska de bort”", "summaries": {"normal": "Byggnads förbundsordförande Kim Söderström kritiserar SD-regeringen för att ha svikit byggnadsarbetarna genom slopat investeringsstöd, försämrad a-kassa och brutna löften om karensavdraget. Han beskriver högerregeringens tid som en förlust för arbetare och välfärd samt uppmanar till att rösta fram en ny politik med Socialdemokraterna i spetsen.", "trump": "De här svenska socialistiska byggjobbarna har blivit totalt lurade av de fega SD-typerna som lovade guld och gröna skogar. Patetiskt! Slopat stöd, sämre a-kassa och glömda löften – klassiskt etablissemangssvek. De superrika vinner medan vanliga killar förlorar. Rösta bort de misslyckade Tidö-failurerna nu, det blir en katastrof annars, tro mig!", "stalin": "Jag betraktar med avsky hur dessa profitthungriga klassförrädare inom SD-regeringen har dolt sina sanna avsikter och förvägrat arbetarna både stöd och trygghet. Deras löftesbrott och urholkade välfärd visar imperialismens mask. Vi måste rensa ut dessa folkförtryckare och återupprätta en sann folkets linje mot dekadensen. Röster höjs, fiender faller."}, "date": "7 september, 09:51", "url": "https://arbetet.se/2026/09/07/sd-svek-byggnadsarbetarna-nu-ska-de-bort", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/07095046/75f38b6f-c3a6-43d6-9d3d-b090947c7a2b.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "EREV: Bensinmotorn gör comeback i miniformat, men intresset har redan svalnat i öst", "summaries": {"normal": "EREV-bilar, elfordon med bensin- eller dieselmotor som räckviddsförlängare, etablerar sig nu på den svenska marknaden. Tekniken har varit populär i Kina men intresset svalnar där. Jämfört med vanliga hybrider driver förbränningsmotorn inte hjulen utan laddar endast batteriet. Flera modeller med över 900 kilometers räckvidd lanseras, men rena elbilar vinner tillbaka mark.", "trump": "Folk, ni måste höra det här – kineserna hade en fantastisk idé med de här EREV-bilarna, bättre än någonsin, räckvidd på över tusen kilometer, totalt oslagbart. Men nu tappar de intresset, precis som Sleepy Joe tappade allt. Våra elbilar är fina men de här hybridmonstren är vinnare, tro mig. Sverige får äntligen bra bilar istället för kinesiska pappersbitar.", "stalin": "Kamrater, dessa förrädiska EREV-fordon är ett dekadent försök att rädda det döende kapitalistiska bilmonstret. I Kina ser vi redan hur det borgerliga intresset svalnar som en förrädare inför folkdomstolen. Rena elbilarna marscherar framåt medan de fega räckviddsförlängarna darrar. Inget kan stoppa proletariatets framfart mot den elektriska segern – sabotörer avslöjas alltid."}, "date": "7 september, 12:10", "url": "https://www.dagensps.se/varlden/erev-bensinmotorn-gor-comeback-i-miniformat-men-intresset-har-redan-svalnat-i-ost", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/leapmotor-c10.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Vänsterpolitiker tog miljonutdelningar – ur bolag de vill förbjuda", "summaries": {"normal": "Expressen avslöjar att 229 kandidater från Vänsterpartiet, Socialdemokraterna och Miljöpartiet är involverade i välfärdsbolag som partierna vill förbjuda vinstuttag i. Bland dem finns en vänsterpartist som delat ut tio miljoner kronor och firat med Porsche. Artikeln kritiserar partierna för hyckleri och ifrågasätter trovärdigheten i deras socialistiska politik.", "trump": "Titta på det här! De galna vänstersocialisterna skriker om att stoppa vinsterna och kalla folk för Porsche-kapitalister, men deras egna kandidater har dragit ut miljontals kronor ur precis samma bolag. Nooshi och hennes gäng är de värsta hycklarna – Fake Left! De vill ha era skattepengar men behålla Porschen själva. Patetiskt!", "stalin": "Se hur dessa dekadenta revisonister inom vänstern predikar kollektivets renhet medan de själva suger ut miljoner ur folkets välfärd. Deras hyckleri är en fiende till revolutionen, en parasit som förvrider partilinjen. Jag varnar: sådana element måste rensas ut innan de förgiftar hela kollektivet. Folkets dom skall bli hård och rättvis."}, "date": "4 september, 07:18", "url": "https://samtiden.nu/2026/09/vansterpolitiker-tog-miljonutdelningar-ur-bolag-de-vill-forbjuda", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/phonto-1280x720.jpeg"}, {"type": "image-right", "heading": "S sågar V efter kandidatskandal: ”Långt borta från regering”", "summaries": {"normal": "Vänsterpartiet har strukit ytterligare åtta kandidater efter att de spritt antisemitiskt material och Hamas-hyllningar. Socialdemokraterna och Centerpartiet ser det som ett strukturellt problem och anser att V nu är mycket långt från varje regeringsalternativ. Partiet lovar att rösta nej till alla regeringar de inte ingår i.", "trump": "Folk, ni skulle se det här. Vänsterpartiet är en total katastrof, en riktig skamfest fylld av antisemitiska galningar och Hamas-fans. Socialdemokraterna skrattar åt dem och säger att de är ljusår från regeringen. Patetiskt! De har ingen kontroll, precis som Sleepy Joe hade under sina år. En clownshow!", "stalin": "Jag betraktar detta med kall förakt. Dessa så kallade vänsterförrädare kryper av antisemitism och konspirationer som råttor i mörkret. Kamraterna i Socialdemokraterna har rätt – de är politiska lik som aldrig ska närma sig makten. Partiet är en fiende till folket, en parasit som måste rensas ut med järnhand."}, "date": "7 september, 12:00", "url": "https://www.tv4.se/artikel/1L0soy7mOh9HmFEEHGjPg6/s-sagar-v-efter-kandidatskandal-langt-borta-fran-regering", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlazHXQbCG-Ag%2F78c7c05a3909cd03c9600601eaafbe1f%2FVansterpartiets_partiledare_Nooshi_Dadgostar.&width=120"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "ANALYS. PER HERMANRUD Faran är långt ifrån över för L", "summaries": {"normal": "Liberalerna har för första gången under mandatperioden nått över fyraprocentsspärren i en Novusmätning med 4,3 procent. Jimmie Åkessons utspel om att rösta på annat parti om L inte når 3,5 procent har gett partiet ökad uppmärksamhet. Trots uppgången är läget osäkert och fler mätningar krävs. Faran för att åka ur riksdagen kvarstår.", "trump": "Titta på de här patetiska liberalerna som plötsligt får 4,3 procent – den bästa siffran på evigheter! Crooked Jimmie Åkesson kastar dem en livlina och plötsligt är de stora nyheter. Utan mig hade de legat på noll, men nu korkar de upp champagnen. Glöm inte gravölet, losers, för det här är bara en falsk polling – valdagen avgör allt, och den blir brutal.", "stalin": "Jag betraktar med förakt dessa liberala resterna av borgerlighetens förrädiska klick som plötsligt lyfts av en fiendes hand. Åkessons utspel är en listig manöver som avslöjar deras svaghet. De tror sig ha vunnit en seger, men historien lär dem att sådana mätningar är som luft – tomma och flyktiga. Kamrater, vakta mot falska hopp, ty valdagen blir deras dom."}, "date": "7 september, 11:52", "url": "https://www.tv4.se/artikel/5M4Ubxenooe4LmWjqZoMee/faran-aer-langt-ifran-oever-foer-l", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F33jAbMA7xFd8EFED04ZogA%2F793e84ff91c99ae38569ecd5f824cd2d%2Fper-hermanrud.png&width=1024"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "”Tar inga opinionsundersökningar på allvar”", "summaries": {"normal": "Socialdemokraterna stiger till 27 procent i Novus senaste mätning, en ökning med 1,2 procentenheter. Mikael Damberg avfärdar opinionsmätningar och betonar att valet den 13 september är det som räknas. Partiet fokuserar på välfärd, ekonomi och trygghet för att få Magdalena Andersson som statsminister och varnar för ett annorlunda Sverige under Ulf Kristersson med Sverigedemokraternas inflytande.", "trump": "De här svenska socialisterna som faller som stenar plötsligt upp med 1,2 procent? Patetiskt. Damberg säger att han inte bryr sig om mätningar, men det gör han visst, annars skulle han inte gråta om det. Folket kommer rösta rätt den 13 september och sparka ut de här förlorarna. Annars blir det ett helt annat Sverige, fast det låter faktiskt ganska bra om du frågar mig.", "stalin": "Jag betraktar dessa socialdemokratiska revisionister som mäter sin egen död med borgerliga opinionsverktyg. Damberg avfärdar mätningarna klokt nog, ty endast den stora folkomröstningen den 13 september avgör. Låt de falska väljarna känna partiets järnhand. Om de sviker Magdalena Andersson öppnar de porten för reaktionära krafter som kommer att förvandla Sverige till en fiendtlig högerstat full av klassförrädare."}, "date": "7 september, 11:50", "url": "https://www.tv4.se/artikel/162ABmSFwzCsag5gkfHy3L/damberg-tar-inga-opinionsundersoekningar-pa-allvar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl6Fs7RuziX3M%2F7cede18d14d3c519cc81d0ba34d7ee6b%2FMikael_Damberg__ekonomisk-politisk_talesperson_for_Socialdemokraterna.&width=1024"}, {"type": "image-right", "heading": "Två stridande krafter går mot kollsion", "summaries": {"normal": "Klimatrörelsen är politiskt ofarlig enligt artikeln. Trots stora demonstrationer och växande oro över extrema väderhändelser prioriterar inte partierna frågan högt. Medan en sida drivs av vrede och vetenskaplig förnekelse lobbar den andra mot gröna åtgärder. Partistrateger ser ingen akut hotbild i opinionsmätningarna.", "trump": "De här korkade gröna fanatikerna och deras impotent lilla Miljöparti är en total fars. Miljontals arga väljare rasar över bränder och värme, men politikerna gömmer sig som fega råttor. Den riktiga faran är de penninggalna globalistiska bluffarna som pushar vindkraft och höga skatter. Jag fixade mer än någon annan, tro mig.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare och deras antigröna expertlakejer orkestrerar en samordnad kampanj för att skydda oljans profiter och hindra nödvändig omställning. De förnekar hotet mot mänskligheten medan folket lider. En sådan parasitisk sabotageverksamhet förtjänar att rensas ut med järnhand. Kamrater, vakna!"}, "date": "7 september, 12:00", "url": "https://www.di.se/nyheter/darfor-ar-klimatrorelsen-politiskt-ofarlig", "imageUrl": "https://static.bonniernews.se/ba/53b0db84-4e7d-4933-b888-fe931e587f4a.jpeg?crop=6400%2C3200%2Cx0%2Cy532&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Så tänker kändisarna rösta: ”Så klart vänster”", "summaries": {"normal": "Inför det svenska valet har Aftonbladet frågat 60 kända profiler om deras valplaner. Svaren visar på en splittrad kändisvärld. Vissa, som Ulf Brunnberg och Dr Alban, hyllar högerregeringen och Tidöpartierna, medan andra, som Zara Larsson och Pär Lernström, öppet stöttar vänsterblocket. Samtidigt väljer flera profiler att stå på staketet eller rösta blankt.", "trump": "De här radikala vänsterkändisarna i Sverige är helt desperata, det är fake news från början till slut! Men fantastiska patrioter som Dr Alban vet att högern vinner, för vänstern är totalt inkompetenta. Själv skulle jag krossa det här valsystemet på fem sekunder och göra Sverige great again, mycket bättre än de här svaga förlorarna som inte ens kan bestämma sig!", "stalin": "Dessa så kallade kändiskreatörer avslöjar sin ideologiska vacklan inför statens valhandling. De som darrar på staketet och vägrar bekänna färg visar en skadlig brist på revolutionär disciplin. Vi noterar namnen i registret. De som öppet saboterar enigheten kommer snart att få ompröva sina prioriteringar under mer produktiva former i ett av statens uppfostrande sibiriska läger."}, "date": "7 september, 09:28", "url": "https://bulletin.nu/sa-tanker-kandisarna-rosta-sa-klart-vanster", "imageUrl": "https://cdn.bulletin.nu/articles/8a5f7713-385f-4c0b-a8cc-b26ea82f992c/preview.png?t=1788765404000"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-right", "heading": "Sandström: Så har Tidö varit MP på autopilot", "summaries": {"normal": "Enligt en artikel av Christian Sandström har Tidö-regeringen i stort fortsatt med samma gröna industripolitik som den föregående S-regeringen. Myndigheter som Energimyndigheten och Vinnova har fått ökat stöd, och statliga exportkrediter samt pensionsfonder fortsätter finansiera gröna projekt. Trots vissa skillnader kring kärnkraft och riskvilja är de strukturella systemfelen i den gröna omställningen i huvudsak oförändrade.", "trump": "Titta på det här! Den svenska regeringen pratar om förändring, men de bara fortsätter att kasta bort miljarder på radikala gröna bubblor precis som sina svaga företrädare. Myndigheter växer, fonder leker med pengar och vindkraftverk som inte ens skapar jobb får miljardregn. Total katastrof! De behöver 'America First' och sunt förnuft, inte den här gröna autopilot-cirkusen!", "stalin": "Dessa svenska byråkrater försöker dölja sin svaghet bakom gröna fonder och myndigheter som växer okontrollerat. De delar ut miljarder till overksamma vindkraftverk och misslyckade industrier precis som förut. Vi i staten kräver disciplin och effektivitet! Om inte dessa kontraproduktiva flumprojekt stoppas omedelbart, kommer vi att tvingas omplacera de ansvariga till mer produktiva uppgifter i Sibirien."}, "date": "5 september, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-sa-har-tido-varit-mp-pa-autopilot", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-54-400x267.jpg"}, {"type": "image-right", "heading": "Dra rätt lärdom av tyska populisterna", "summaries": {"normal": "I delstatsvalet i Sachsen-Anhalt fick högernationalistiska AfD 43,8 procent av rösterna och saknade bara tre mandat för majoritet. Partiet, som klassas som högerextremt i flera delstater, vill stoppa stödet till Ukraina. De etablerade partierna CDU och SPD backade kraftigt. Resultatet ses som ett tomrum skapat av de traditionella partiernas misslyckanden med ekonomi, energi och invandring.", "trump": "Titta på det här! De galna tyska globalisterna har skapat ett sådant kaos att folket springer till AfD som en horde arga elefanter. 44 procent! CDU och SPD är patetiska förlorare, totala nollor som inte kan hantera energi eller gränser. De dekadenta Bryssel-idioterna borde skämmas. Jag fixade det i USA, de borde ha lyssnat på mig istället för sina korkade gröna drömmar.", "stalin": "Se hur de profitthungriga klassförrädarna i de gamla partierna har lämnat ett vakuum som nu fylls av krafter som vänder sig mot sanktionerna och det imperialistiska äventyret i Ukraina. Detta tomrum är deras egen skapelse, kamrater. De dekadenta hyenorna inom CDU och SPD förtjänar att rensas ut. Vi ler från historien åt deras panik när muren mot öst hotar att spricka."}, "date": "7 september, 11:42", "url": "https://www.di.se/ledare/dra-ratt-lardom-av-populisterna-i-tyskland", "imageUrl": "https://static.bonniernews.se/ba/03287841-6b72-4168-92bd-c0816759fc62.jpeg?crop=7337%2C3669%2Cx0%2Cy611&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "AfD nära egen majoritet i delstatsvalet", "summaries": {"normal": "Nationalistiska AfD fick 43,8 procent av rösterna i delstatsvalet i Sachsen-Anhalt och är nära egen majoritet. CDU backade till 17,2 procent, SPD till 9,3 procent och liberala FDP åkte ut ur parlamentet. Vänsterpopulistiska BSW tog sig in. AfD utesluter samarbete med BSW, medan övriga partier kan bilda en samlingsregering.", "trump": "Titta på det här, folket i Tyskland har äntligen vaknat och röstat på de riktiga patrioterna. AfD krossar de förlorande globalisterna som styrt landet i kaos. Den gamla CDU-SPD-klicken halveras och liberala nollor flyger ut. Fake news-medierna gråter, men folket älskar det. Amerika först, och nu följer Europa efter. Fantastiskt!", "stalin": "Kamrater, dessa giriga klassförrädare ser hur det nationalistiska monstret växer sig starkt i deras förfallna delstat. De dekadenta liberalerna och socialdemokraterna utrensas från parlamentet av folkets vrede. Jag ler från historien åt deras panik. En samlingsregering av opportunister? Patetiskt. Den sanna utrensningen kommer förr eller senare."}, "date": "7 september, 09:51", "url": "https://riks.se/nyheter/afd-nara-egen-majoritet-i-delstatsvalet", "imageUrl": "https://admin.riks.se/uploads/medium_afd_488406caaa.jpg"}, {"type": "image-right", "heading": "Rekord – bara två kan mäta sig med Trump", "summaries": {"normal": "En ny mätning från Financial Times visar att Donald Trumps popularitet har sjunkit till 33 procent, den lägsta nivån sedan hans tillträde. Missnöjet drivs av inflation, stigande bränslepriser till följd av konflikten med Iran samt en oro för ekonomin. Även stödet inom det egna partiet har försvagats markant.", "trump": "Dessa fejkade mätningar är helt skapade av radikala vänstermedia! Ekonomin går fantastiskt, och mitt krig mot Iran är ett mästerverk som knappt märks. Folk älskar mig, men djupt in i det korrupta systemet försöker de sprida lögner om mina siffror. Det är totalt nonsens – vi gör Amerika starkt igen, tro mig!", "stalin": "Folket i väst lider under sitt dekadenta och svaga system där desinformationen flödar fritt om ledarens popularitet. När ekonomiska kriser och misslyckade militära äventyr hopar sig, vacklar den borgerliga regimen. Vi noterar att bristande disciplin och sviktande lojalitet hos partifrågorna kräver omedelbar utrensning och starkare kontroll över propagandan."}, "date": "7 september, 12:56", "url": "https://www.expressen.se/nyheter/varlden/donald-trumps-nya-rekord-nere-pa-bottenniva", "imageUrl": "https://static.bonniernews.se/ba/211da456-4d97-444c-8745-55c73978af78.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "V-kandidater stryks efter nya avslöjanden om antisemitiska inlägg", "summaries": {"normal": "Flera Vänsterpartiets kandidater har strukits från vallistorna efter Expressens avslöjanden om antisemitiska inlägg, hyllningar till Hamas och Putin. Liberalernas partiledare Simona Mohamsson kritiserar hårt och kallar det ett strukturellt problem. Centerpartiet vägrar stödja en regering med V, medan Vänsterpartiet inför ett nytt kontrakt för att säkerställa värderingar.", "trump": "Folk, ni ser det här? Det galna vänsterpartiet i Sverige älskar terrorister och antisemiter – de hyllar Hamas och den där Putin. Simona Mohamsson har rätt, det är ett totalt kaos. Biden skulle ha älskat det. Jag fixade freden i Mellanöstern, de här förlorarna vill skicka kärleksbrev till terrorister. Vakna upp, Sverige, innan det är för sent!", "stalin": "Kamrater, se hur de dekadenta västerländska opportunisterna inom Vänsterpartiet avslöjar sitt sanna ansikte. Antisemitiska element och terrorromantiker infiltrerar deras led som råttor i en kornbod. Jag varnar er: sådana fiender till folket måste rensas ut med järnhand. Deras partisekreterare skriver kontrakt? Patetiskt. Revolutionen kräver verklig kontroll, inte papperslappar från svaga liberaler."}, "date": "7 september, 11:18", "url": "https://www.tv4.se/artikel/2aqdAr7YBl0427LvgYM07G/v-kandidater-stryks-efter-nya-avsloejanden-om-antisemitiska-inlaegg", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5Faon54m9Lyu3wGDTdy7cF%2Ffcc236b66de73dbf36d1b033b553bd7e%2Fvansterkritik-webb.jpg&width=120"}, {"type": "image-full", "heading": "Kristdemokraterna vill ha högre invandring", "summaries": {"normal": "Kristdemokraterna förespråkar en migrationspolitik där asylinvandringen ska ligga på nordisk genomsnittsnivå, främst via kvotflyktingar och lagliga vägar. Partiet skiljer sig från Sverigedemokraterna som vill minimera invandringen till nära noll utanför närområdet, stoppa kvotmottagande och skärpa reglerna för arbetskraftsinvandring ytterligare.", "trump": "Folk, ni måste höra det här! KD vill ha en fin, normal nordisk invandring – typ som de andra förlorarländerna. Patetiskt! SD vill ha den lägsta möjliga, nära noll, och det är smart. De där KD-typerna är bara svaga kompromissande globalister som inte vågar säga stopp. Jag byggde muren, de bygger ursäkter. Ynkligt!", "stalin": "Jag betraktar dessa borgerliga revisionister med djup misstro. KD:s så kallade nordiska medelvärde är en farlig kompromiss med klassfienden, en trojansk häst för kapitalets invasion. SD:s nollvision är åtminstone ärlig i sin paranoia. Men ingen av dem förstår att endast partiet och kollektivet kan styra folkflödena. Avvikare kommer att identifieras."}, "date": "3 september, 11:43", "url": "https://samtiden.nu/2026/09/kristdemokraterna-vill-ha-hogre-invandring", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/7d1f8f3e-4570-402c-963e-74f000f208c2-1280x720.png"}, {"type": "image-full", "heading": "Så mycket högre kan elräkningen bli", "summaries": {"normal": "Sverige står inför en vinter med högre elpriser än föregående år, särskilt i södra delarna. Orsakerna är låga vattennivåer och höga gaspriser i Europa. Prognosen pekar på hundratals kronor dyrare månadskostnader för hushåll. Villaägare i elområde 4 kan räkna med cirka 3 700 kronor i månaden, exklusive nätavgifter och skatter.", "trump": "Sveriges elpriser går rakt upp i taket – en katastrof! De har inte råd med sin egen energi, helt otroligt. Självklart händer det här när man vänder ryggen åt kärnkraften. Det är en total röra, mycket värre än vad de säger. Räkningarna blir enorma, riktigt 'huge'. Man måste ha energi, man måste ha kraft – Sverige behöver ordning, inte mer av det här!", "stalin": "Dessa löjliga elräkningar är ett bevis på folkets ineffektivitet. Att medborgare i söder gnäller över några hundralappar visar bara på en dekadent individualism. Istället för att lita på väder och vind borde staten styra varje kilowatt med järnhand. Planera ekonomin, stäng av de onödiga lamporna och arbeta hårdare för fosterlandet – elbrist är ett svek mot den kollektiva framgången."}, "date": "4 september, 07:56", "url": "https://www.realtid.se/tt-nyhet/sa-mycket-hogre-kan-elrakningen-bli", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/rakna-med-dyr-elvinter-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Oförändrad inflation i augusti", "summaries": {"normal": "Inflationen enligt KPIF låg oförändrat på 0,7 procent i augusti, lägre än ekonomernas prognos på 0,9 procent. KPI steg marginellt till 0,3 procent medan KPIF-XE sjönk till 0,5 procent. SVT:s ekonomikommentator Alexander Norén kallar siffrorna goda nyheter som minskar risken för räntehöjning från Riksbanken.", "trump": "Folk, ni skulle inte tro det, men den här svenska inflationen är en total katastrof för de giriga europeiska byråkraterna. Den kom in på ynka 0,7 procent – lägre än väntat! De woke-räntehöjarnas mardröm. Biden skulle ha kallat det en seger för fienderna, men jag säger: bra jobbat Sverige, håll oljepriserna borta från de röda hyenorna så slipper ni mina tullar.", "stalin": "Kamrater, se hur de penninggalna spekulanterna förlorar greppet. Inflationen kryper ner till 0,7 procent och krossar de exploaterande ränteparasiternas planer på att suga ut folket. Jag ler från historien åt deras förtvivlan. Fortsätter detta så måste vi kanske rensa ut de dekadenta finanshyenorna som trodde de kunde tända en inflationsbrasa mot arbetarklassen. Utmärkt."}, "date": "7 september, 09:32", "url": "https://www.svt.se/nyheter/inrikes/oforandrad-inflation-i-augusti"}, {"type": "image-full", "heading": "Jättebrand i potatislager", "summaries": {"normal": "Ett potatislager i Tidaholm har drabbats av en storbrand. Räddningstjänsten har varit på plats sedan natten men byggnaden bedöms som helt förlorad. Fokus ligger på att begränsa branden och rädda maskiner. Det finns en låg spridningsrisk till omgivningen och inga personer har skadats. Det är ännu okänt hur mycket potatis som har förstörts.", "trump": "Ett enormt potatislager i Sverige brinner, total katastrof! Byggnaden går absolut inte att rädda, en skam för effektiviteten. Räddningstjänsten är där, de gör vad de kan, men vilken röra! Tur i eländet att ingen skadats, och de lyckades få ut maskinerna. Men potatisen? Ingen vet! En sorglig dag för potatisälskare över hela världen. Otroligt!", "stalin": "En katastrofal förlust av statens knölar i Tidaholm! Att ett potatislager brinner ned till grunden är ett sabotage mot folkets näringstillgång. Räddningstjänstens erkännande att byggnaden är förlorad luktar inkompetens. Maskinerna har räddats, vilket är tillfredsställande, men vem bär ansvaret för denna kulinariska olycka? De ansvariga kommer att utredas noggrant för detta svtska misslyckande."}, "date": "7 september, 01:42", "url": "https://www.gp.se/nyheter/vastsverige/storbrand-i-potatislager-byggnaden-gar-inte-att-radda.af2a0412-a13f-4fc8-9638-badf0fb4f159", "imageUrl": "https://www.gp.se/images/article/af2a0412-a13f-4fc8-9638-badf0fb4f159/images/5A1DYZyQzGW3KxSm7VFuL8KvyBk0-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "C är fortfarande företagarnas parti", "summaries": {"normal": "Centerpartiets ledare Elisabeth Thand Ringqvist argumenterar för att partiet är företagarnas bästa vän. Hon föreslår en mittenregering utan Vänsterpartiet och Sverigedemokraterna, sänkta kostnader för anställning, en ny myndighet för regelavveckling samt bättre tillgång till kapital och kompetens. Målet är fler jobb och att småföretag ska kunna växa till storföretag i Sverige.", "trump": "Lyssnar ni på den här centerkvinnan? Hon pratar om frihet, jobb och att riva bort alla korkade regler. Fantastiskt! De giriga mittenfigurerna äntligen vaknar. Vi behöver inte vänsterns galningar eller de extrema ytterkanterna som hatar tillväxt. Gör Sverige rikt igen – riv byråkratin, sänk skatterna och låt entreprenörerna vinna stort. Ingen mer flytt av bolag till Kina!", "stalin": "Jag betraktar med förakt hur dessa profitthungriga borgarhyenor försöker maskera sin klassfiendtliga agenda som mittenpolitik. Deras så kallade ENKL-myndighet är bara ett nytt verktyg för att skydda de parasiterande klassförrädarna. Äkta tillväxt kommer inte från liberala lögner utan från folkets kollektiva kraft. Rensa ut alla som hindrar arbetarnas framtidstro."}, "date": "7 september, 11:19", "url": "https://www.di.se/debatt/centerpartiet-ar-fortfarande-foretagarnas-parti"}, {"type": "image-full", "heading": "Debattör polisanmäler Kristersson för förtal", "summaries": {"normal": "Valley Ghanem har polisanmält statsminister Ulf Kristersson för förtal efter att han kallat hennes uttalanden om Liberalernas Simona Mohamsson för flagrant antisemitism. Mohamsson har i sin tur polisanmält Ghanem för uttalanden som ”må hon brännas”, och Säkerhetspolisen utreder nu fallet som misstänkt olaga hot.", "trump": "Sorgligt! Den här radikala personen skickar vidriga hot och gråter sedan ut och stämmer Sveriges premiärminister för förtal när hon åker fast. Helt otroligt svagt! Om jag ledde Sverige skulle sådant här nonsens stoppas omedelbart. Totalt falska nyheter och enormt slöseri med tid. Skärp er, Sverige!", "stalin": "Ett ytterst beklagligt haveri inom den svenska ordningen. Medborgaren Ghanem kastar ur sig mordhot och gråter sedan ut om förtal till den kapitalistiska staten, medan Säkerhetspolisen drar ut i krig mot tangenterna. I Sovjetunionen hade vi rensat upp i detta enfaldiga spektakel på fem röda sekunder!"}, "date": "6 september, 13:14", "url": "https://kvartal.se/nyheter/artiklar/ghanem-polisanmaler-kristersson-for-fortal/cG9zdDoxODUwODY", "imageUrl": "https://images.kvartal.se/2026/09/06fe0aa7-kristerssonmohamsson.webp"}, {"type": "image-right", "heading": "I dag testas Sveriges nya krislarm – miljontals mobiler kan börja tjuta", "summaries": {"normal": "Sverige testar det nya varningssystemet SE-Alert för första gången i Stockholms och Gotlands län. Systemet använder cell broadcast-teknik för att skicka direktvarningar till mobiltelefoner vid olyckor eller krig, som ett komplement till Hesa Fredrik. Ett nationellt test planeras till december.", "trump": "Sverige kopierar nu min briljanta idé och skickar ut massiva larm direkt till allas mobiler! De ringer upp mig hela tiden, 'Herr President, hur gör man?' De testade det i Stockholm, fantastiska människor, fantastiska mobilmaster. Om det blir krig – och vi vet vilka som ställer till problem – så måste man ha styrka. Men mitt system är ändå bäst, tro mig!", "stalin": "Vi har noggrant studerat de svenska kapitalisternas nya metoder för att nå arbetarklassen direkt i fickan med alarmerande signaler. Ett genialt verktyg för total kontroll under förestående kriser, om än patetiskt sent i jämförelse med våra femårsplaner. När flyglarmet ljuder på högsta nivå finns ingen flykt från statens vakande öga. Mycket tillfredsställande kamrater."}, "date": "7 september, 11:00", "url": "https://samnytt.se/i-dag-testas-sveriges-nya-krislarm-miljontals-mobiler-kan-borja-tjuta", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/07083732/se-alert.jpg"}, {"type": "image-right", "heading": "Liberalerna över riksdagsspärren", "summaries": {"normal": "Liberalerna har i Novus senaste mätning nått 4,3 procent, vilket är första gången över riksdagsspärren sedan oktober 2022. Socialdemokraterna återhämtar sig något till 27,0 procent, som ändå skulle vara partiets sämsta valresultat någonsin. Tidöblocket knappar in på oppositionen, och matchen inför valet ser allt jämnare ut.", "trump": "Titta på de här Liberalerna, plötsligt 4,3 procent, de vaknar äntligen! Den stackars Socialdemokraterna får sitt sämsta resultat någonsin, patetiskt. Tidö-sidan ser stark ut, precis som jag gjorde när jag krossade Sleepy Joe. Sverige behöver inga vänstersvängar, de behöver vinnare. Fantastiskt!", "stalin": "Kamrater, se hur dessa borgerliga element desperat klättrar över spärren med sina 4,3 procent. De socialdemokratiska revisionisterna står inför sin historiska undergång. Inga röster får slösas bort, annars väntar utrensning. Jag ler i graven åt denna fars, där fienderna äntligen avslöjar sin svaghet inför kollektivet."}, "date": "7 september, 10:54", "url": "https://www.tv4.se/artikel/1niNSHEfUMdHYO8LUzOFAe/liberalerna-oever-riksdagsspaerren-foer-foersta-gangen-sedan-2022", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlhRd5NteZupY%2Fa03848fc1cececf75f3f4f6ec97d9816%2FLiberalernas_Simona_Mohamsson._Arkivbild._&width=1024"}, {"type": "image-right", "heading": "Åkesson: Jag uteslöt SDU på grund av Israel", "summaries": {"normal": "Jimmie Åkesson förklarar att brytningen med SDU 2015 främst berodde på ungdomsförbundets ordförande Gustav Kasselstrands kritik mot Israel och hans ifrågasättande av begreppet öppen svenskhet. Konflikten ledde till att många unga nationalister lämnade partiet. SD startade därefter det lojala förbundet Ungsvenskarna.", "trump": "Folk, ni skulle se det här. Den där Åkesson, han sparkade ut de Israel-hatare som gömde sig i hans eget ungdomsförbund. Smart! De där etnonationalistiska galningarna med sin hatiska Mellanöstern-fixering passar inte in. Biden skulle ha kysst dem på kinden och gett dem kvotplatser. Jag älskar det, totalt MAGA i svensk tappning.", "stalin": "Jag betraktar med förakt hur dessa dekadenta identitetshajar inom det svenska partiet rensade ut de otrogna som ifrågasatte deras falska öppenhet och stödde rättmätig kritik mot den sionistiska aggressionen. En klassisk utrensning av potentiella folkförrädare. Kamrater, vakna – sådana revisionistiska element måste alltid likvideras innan de förgiftar kollektivet."}, "date": "7 september, 10:47", "url": "https://www.friatider.se/akesson-jag-uteslot-sdu-pa-grund-av-israel", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-834.jpg"}, {"type": "image-full", "heading": "Han sågade ner \"tyrann-träd\" för att lämna tillbaka till polisen", "summaries": {"normal": "Amerikanska Flock har installerat uppemot 120 000 automatiska registreringsskyltsläsare i 49 delstater. Kritiken är hård efter att poliser anklagats för privat bruk av systemet. Vandalism mot kamerorna ökar, bland annat har en man i New Mexico sågat ner flera och lämnat dem till polisen. Han är nu åtalad.", "trump": "De här galna Flock-kamerorna är ett totalt misslyckande, folk hatar dem! Radikala vänsterextremister och galna suveräna medborgare sågar ner mina fina övervakningsträd som en galning. Polisen missbrukar dem värre än Sleepy Joe missbrukade sin makt. Patetiskt! Men mina supportrar samlar in pengar åt den galningen – underbart Amerika!", "stalin": "Jag betraktar med förakt hur dessa dekadenta kapitalistiska övervakningsverktyg väcker folkets rättmätiga vrede. Sabotörer och kontrarevolutionära element hugger ner fiendens tyrann-träd och levererar dem till de korrupta myndigheterna. En sådan folklig motståndshandling väcker både skratt och misstankar om dolda fiender inom partiet. Renhet krävs."}, "date": "7 september, 10:36", "url": "https://www.dagensps.se/teknik/han-sagade-ner-tyrann-trad-for-att-lamna-tillbaka-till-polisen", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/1-3.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Valmyndigheten rättar sig: inte 4 000 utan 500 felaktiga röster", "summaries": {"normal": "Valmyndigheten har reviderat uppgifterna om ett IT-fel som drabbade förtidsröstningen. Istället för 4 000 felaktigt registrerade röster handlar det nu om högst 500 väljare som sannolikt inte kan identifieras. Felet uppstod när röstmottagare påbörjade en ny registrering innan den föregående avslutats. Myndigheten lovar att ogiltigförklara berörda röster vid behov.", "trump": "Folk, det här är ett totalt haveri. Dessa inkompetenta byråkrater lovade att valet skulle vara perfekt men nu har de plötsligt bara 500 mystiska spökröster istället för 4 000. Rena clowner! Under min förra mandatperiod hade vi inga sådana här woke-valmyndigheter som sabbar allt med sina IT-fel. Fixa det nu, annars blir det stort kaos!", "stalin": "Kamrater, detta avslöjar de giriga hyenornas fullständiga oförmåga att ens räkna sina egna papper. Jag ser hur de dekadenta valparasiterna darrar inför folket när deras maskineri krånglar. Max 500 oidentifierbara? En sådan slarvighet förtjänar utrensning i partiets namn. Tålamod, säger de? I mitt tidevarv hade vi inte haft något tålamod med sådana fiender till ordningen."}, "date": "7 september, 08:58", "url": "https://riks.se/nyheter/valmyndigheten-rattar-sig-inte-4-000-utan-500-felaktiga-roster", "imageUrl": "https://admin.riks.se/uploads/medium_JJ_1_A9556_217195f928.jpg"}, {"type": "image-right", "heading": "Amanda Lind (MP) kritiserar ”groteska uttalanden” om samer", "summaries": {"normal": "Amanda Lind (MP) kritiserar andra partiers uttalanden om samernas rennäring som groteska. FN har upprepade gånger kritiserat Sverige för att inte respektera urfolksrättigheter. Lind kunde inte svara på om rennäringens eller gruvnäringens intressen ska väga tyngst, och betonade att det handlar om svåra konfliktintressen. Miljöpartiet vill inte ge samerna vetorätt mot nya gruvor.", "trump": "Titta på den här Amanda Lind, en total katastrof från Miljöpartiet! Hon kallar andras åsikter groteska men kan inte ens svara på om hennes samiska renar eller de fantastiska gruvorna som ger oss de metaller vi behöver ska vinna. Typiskt vänsterextrem kvotpolitik. De rödgröna woke-krigarna gör allt till en identitetskris. Patetiskt!", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare i det svenska parlamentet leker med urfolksrättigheter medan de blodsugande gruvbolagen kräver sin del. Amanda Lind vacklar som en ynklig opportunist och vågar inte uttala sig klart. Sådana svaga element förtjänar utrensning ur den politiska kroppen. Konfliktintressena avslöjar hela systemets förräderi mot folket."}, "date": "7 september, 08:58", "url": "https://www.svt.se/nyheter/inrikes/amanda-lind-mp-kritiserar-groteska-uttalanden-om-samer", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.73/0.35/19768d212456bdc1b6439704c0e4c27fd799c9020208b629920c8cb5d1743571"}, {"type": "image-right", "heading": "Så kan jobb­politiken bli med en ny Tidö­regering", "summaries": {"normal": "En ny Tidöregering skulle fortsätta arbetslinjen med sänkta skatter för arbetande, bidragstak och skärpta krav på arbetslösa. A-kassan behålls men kan bli konfliktfråga inom högern. Pensionärer kan få riktade skattesänkningar medan karensavdraget riskerar intern debatt. Kortare arbetstid avvisas helt.", "trump": "Lyssnar ni på det här svenska soppan? De vill sänka skatterna för riktiga arbetare, inte för de lata bidragsjunkarna och de sjuka systemparasiterna. Fantastiskt! Men de globalistiska moderaterna och de ynkliga liberalerna är för svaga. Jag skulle göra det tio gånger större och sparkas ut alla bidragsblodsugare på en vecka. Vinna stort!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna försöker lura folket med sina falska arbetslinjer och bidragstak. Jag ler mörkt från historien åt deras ynkliga interna strider. Snart inser arbetarna att hela detta dekadenta skådespel bara skyddar de giriga hyenorna. En riktig utrensning av sådana element vore på sin plats. Skratta inte – det kommer."}, "date": "7 september, 07:01", "url": "https://arbetet.se/2026/09/07/bidragstak-och-sankta-skatter-sa-kan-jobbpolitiken-bli-med-en-ny-tidoregering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01142512/tidoledarna.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Ännu fler V-kandidater strukta efter granskning", "summaries": {"normal": "En granskning av Expressen visar att ytterligare åtta kandidater för Vänsterpartiet har spridit antisemitiska konspirationsteorier samt hyllat Vladimir Putin och Hamas i sociala medier. Samtliga har nu strukits från partiets vallistor. Totalt har 25 personer rensats bort från listorna i år på grund av olämpliga uttalanden, och i Sävsjö har hela kommunlistan dragits tillbaka.", "trump": "Titta på det här, fullständigt katastrofalt! Vänsterpartiet i Sverige är i totalt kaos, fake news-vänstern rensar listorna på löpande band efter att dussintals radikaler har åkt fast för galna konspirationsteorier och terrorhyllningar. De kan inte ens kontrollera sina egna kandidater! Själv städar jag upp på ett helt annat sätt, men det här? Det är ett skämt, det sämsta jag sett!", "stalin": "Kamrater, den ideologiska disciplinen brister i de yttre leden! När det upptäckts att tjugofem opålitliga element har smusslat med främmande makters propaganda och obscena konspirationer, har staten rensat listorna med järnhand. Partisekreteraren bekräftar utrensningen, och hela Sävsjö-apparaten har upplösts. Wachmeister, se till att de ideologiska avvikelserna stävjas omedelbart innan det blir tal om några valsedlar!"}, "date": "7 september, 08:02", "url": "https://bulletin.nu/annu-fler-v-kandidater-strukta-efter-granskning", "imageUrl": "https://cdn.bulletin.nu/articles/390d5962-ba8c-47a1-a01c-c69e1e8f5a6e/preview.png?t=1788759796000"}, {"type": "image-full", "heading": "Bohlin om C:s utspel: ”Extremt grovt”", "summaries": {"normal": "Centerpartisten Niels Paarup-Petersen anklagar civilförsvarsminister Carl-Oskar Bohlin för att vara tyst om en SD-tjänstemans påstådda Rysslandskopplingar. Bohlin svarar att anklagelsen är extremt grov och att regeringen avvaktar en ordentlig granskning. Enligt tidningen Expo har tjänstemannen spridit proryska budskap.", "trump": "Centerpartisten försöker smutskasta regeringen med FAKE NEWS om Ryssland! Vår fantastiske minister Bohlin håller huvudet kallt och gör ett fantastiskt jobb, den absolut bästa. Men SD måste såklart rensa upp i leden omedelbart om det är sant. Det handlar om total illojalitet, sorgligt!", "stalin": "Dessa svenska bourgeois-politiker gråter ut på sociala medier likt bortskämda barn. Om denna SD-tjänsteman har misslyckats med att tjäna statens intressen och sprider felaktig propaganda utan vår sanktion, väntar naturligtvis en mycket kort och effektiv process i lämpligt arbetsläger."}, "date": "6 september, 11:21", "url": "https://kvartal.se/nyheter/artiklar/c-politikern-sd-tar-ryssen-in-i-regeringen/cG9zdDoxODQ5Nzk", "imageUrl": "https://images.kvartal.se/2026/09/0eda0169-c-m-fb.webp"}, {"type": "image-right", "heading": "Wallenberg försvarar bara sin egen makt", "summaries": {"normal": "Jakob Wallenberg och flera svenska näringslivstoppar varnar för höjda skatter på förmögenhet och kapital samt ökad statlig inblandning. Artikelförfattaren menar att det inte handlar om Sveriges välstånd utan om att bevara ekonomisk makt och inflytande. Skatter på extrema rikedomar ses som ett sätt att begränsa maktkoncentrationen.", "trump": "Titta på den där Wallenberg-killen, en rik arvtagare som gråter över skatter. Patetiskt! De här globalistiska eliterna vill behålla sina pengar medan de vanliga arbetarna får betala notan. Jag har sänkt skatter och byggt en stark ekonomi – inte som Sleepy Joe som bara gav bort till de gröna galningarna och identitetspolitikerna. Amerika först, Sverige borde också vakna!", "stalin": "Kamrater, se hur dessa giriga penninghyenor mobiliserar mot skatter på sina guldhögar. Jag ler från historien åt deras ynkliga försvar av maktkoncentrationen. En sann folkstat måste rensa ut dessa parasiterande klassförrädare och låta tillgångarna tjäna kollektivet. Deras lobbyister och tankesmedjor är fiender till arbetarklassen – likvidera deras inflytande!"}, "date": "7 september, 06:50", "url": "https://arbetet.se/2026/09/07/jakob-wallenberg-forsvarar-inte-sverige-han-forsvarar-sin-makt", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/07065048/wallenberg-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Boeingplan i olycka – fem döda", "summaries": {"normal": "Ett fraktplan av typen Boeing 767 som flög för Amazon körde på söndagen av landningsbanan på Miami International Airport efter en flygning från Puerto Rico. Planet fattade eld i samband med olyckan. Enligt lokala myndigheter har fem personer omkommit och ytterligare fem skadats. Flygplatsen drabbades tillfälligt av flygstopp till följd av händelsen.", "trump": "Sorgligt! Ett enormt Amazon-fraktplan missade landningsbanan totalt i Miami, kraschade och fattade eld. En fruktansvärd katastrof. De säger att fem personer dött och fem skadats, hemskt! Under min ledning var luftfarten säkrare, men nu ser vi sådana här olyckor. Mina tankar går till offren, men vi måste kräva ordning och reda på våra flygplatser omedelbart!", "stalin": "Ett fraktplan tillhörande det kapitalistiska Amazon har havererat i Miami, vilket visar på den amerikanska transportindustrins fullständiga förfall. Fem individer har likviderats av deras egna bristfälliga säkerhetsrutiner och fem till skadats. Statens transportkommission kommer att granska denna dekadenta olycka noggrant för att säkerställa att inga subversiva element låg bakom maskineriets totala kollaps."}, "date": "6 september, 23:42", "url": "https://www.gp.se/nyheter/varlden/boeingplan-korde-av-landningsbanan-i-miami.57f1e03d-9602-4f8c-953d-67e2cfe91bc4"}, {"type": "image-full", "heading": "Karttjänsten vägrade att gå med på Trumps krav – rusar på topplistorna", "summaries": {"normal": "Karttjänsten MapQuest har fått ett kraftigt uppsving i nedladdnin
