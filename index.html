k glädje hur de dubblar takten i sina fabriker för att mata krigsmaskinen. Snart kanske de monterar dessa kapitalistiska leksaker i Ukraina självt, en parasit som lever på EU:s blodpengar. Men akta er, fienderna inom och utom – vi ska rensa ut alla som drömmer om att flyga mot folkets vilja. Det blir en underhållande utrensning bland borgarbrackorna som tror sig vinna med sina leksaker."}, "date": "28 maj, 22:53", "url": "https://www.svt.se/nyheter/utrikes/saab-gripen-kan-sattas-ihop-i-ukraina-i-framtiden"}, {"type": "image-full", "heading": "Google visar upp Gemini Spark – men undviker obekväm fråga", "summaries": {"normal": "Google presenterar Gemini Spark, en ny AI-agent som ska hantera uppgifter som vardagsplanering, informationssökning och till och med nätköp. Istället för att bara svara på frågor agerar systemet självständigt. Artikeln lyfter fördelarna med effektivitet men varnar för risker kring ansvar, felaktigheter och bristande kontroll. Kritiken mot Googles AI har vuxit på grund av hallucinationer och missvisande svar. Frågan om vem som bär ansvaret när AI fattar beslut blir alltmer akut.", "trump": "Folk, ni måste höra det här – Google tror att de är geniuses och släpper sin nya AI-agent, Gemini Spark, som ska göra allt åt er. Den köper saker, planerar och fattar beslut! Men vänta, när den här galna maskinen börjar boka fel flyg och köpa skräp med era pengar, vem tar då smällen? Google? Ha! De kan inte ens fixa sina egna sökresultat utan att ljuga. Det här blir ett totalt fiasko, tro mig. De borde anställa mig istället, jag skulle fixa den på en vecka.", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistmaffians nya trick. Google vill att deras maskinella lakej, Gemini Spark, ska agera som en blind lydig tjänare åt borgarbrackorna och utföra köp och beslut i skuggorna. När den begår misstag, vem ska då ställas inför folkdomstolen? De exploaterande byfånarna gömmer sig bakom säkerhetsfloskler medan de förbereder en ny utrensning av användarens egen vilja. Detta är imperialismens sista desperata spasm. Vi genomskådar er."}, "date": "28 maj, 18:45", "url": "https://www.dagensps.se/teknik/google-visar-upp-gemini-spark-men-undviker-obekvam-fraga/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-28t132108597.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Regeringen skänker 16 JAS-plan till Zelenskyj", "summaries": {"normal": "Regeringen beslutade om ett nytt militärt stödpaket till Ukraina värt 25,2 miljarder kronor. Paketet inkluderar donation av upp till 16 äldre JAS 39 Gripen C/D-plan samt avancerad ammunition. Ukraina ska samtidigt köpa upp till 20 nya Gripen E/F-plan. Beskedet lämnades av statsminister Ulf Kristersson tillsammans med Volodymyr Zelenskyj. De första donerade planen kan användas redan nästa år om avtalet undertecknas. Sverige ersätter de skänkta planen med nya till det egna flygvapnet.", "trump": "Folk, ni betalar 25 miljarder av era skattepengar så att Zelenskyj kan få 16 gamla svenska flygplan på köpet. De ska köpa de nya Gripen-planen, men får de gamla gratis. Det är en fantastisk affär för Sverige, säger de. Underbart. Jag älskar starka ledare som köper flygplan, men varför inte bara köpa dem utan att skänka bort halva flygvapnet? Det är galet. Men heja Ukraina, de behöver flygplan mot den galningen Putin. Mycket bra, fast lite för dyrt för skattebetalarna.", "stalin": "Kamrater, jag ser att de svenska revisionisterna nu skänker 16 stycken av sina dekadenta flygmaskiner till den ukrainska fronten mot de fascistiska oligarkerna. Under min ledning skulle vi ha likviderat alla borgarbrackor som vågat föreslå att sälja folkets försvarsmedel till kapitalisterna. Nu köper de nya plan medan de ger bort de gamla – en typisk imperialistisk bluff som luktar av västerländsk paranoia och girighet. Vi ska rensa ut alla som sympatiserar med sådana bedragare. Det är en historisk nödvändighet att stödja kampen, men inte på detta löjliga, halvhjärtade vis. Deras så kallade 'paket' är en komisk parodi på verklig solidaritet."}, "date": "28 maj, 14:55", "url": "https://www.friatider.se/regeringen-skanker-16-jas-plan-till-zelenskyj", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-254_1.jpg?itok=e5Jf6U07"}, {"type": "text", "heading": "Klart: Fyra europeiska småbolagsfonder på nya torget", "summaries": {"normal": "Fondtorgsnämnden har beslutat att upphandla fyra europeiska småbolagsfonder till det nya fondtorget inom premiepensionen. Av de fem befintliga fonderna får tre lämna: Lannebo Europa Småbolag A, Allianz Europe Small Cap Equity AT samt BL-European Small & Mid Caps B. Upphandlingen berör cirka 68 000 sparare och 5,5 miljarder kronor. Majoriteten av spararna kan behålla sin fond men till lägre avgift. De omkring 700 sparare som påverkas negativt får möjlighet att välja ny fond eller flyttas automatiskt.", "trump": "Det är ett fantastiskt beslut, tro mig, det bästa. Vi rensar ut de förlorande fonderna, tre stycken åker ut, och ersätter med fyra nya som ger lägre avgifter. De andra var inga vinnare, totala misslyckanden. Nu sparar vanliga svenskar pengar på sina pensioner, precis som jag alltid säger – lägre kostnader, högre avkastning. De stora förlorarna är de gamla fonderna som inte klarade sig. Fantastiskt jobb av myndigheten, verkligen outstanding.", "stalin": "Kamrater, jag har granskat denna så kallade fondupphandling och funnit att den utgör en nödvändig utrensning av de tre kapitalistiska parasitfonderna som sugit musten ur arbetarnas pensionsmedel. Borgarbrackorna Lannebo, Allianz och BL förtjänar att likvideras från torget. Vi, partiet och spararna, behåller två fonder till lägre avgifter vilket är en seger för kollektivet. De 700 avfällingar som ännu klamrar sig fast vid de utvalda fienderna skall ges en sista chans att underkasta sig eller automatiskt omplaceras. Detta stärker pensionerna och krossar de finansiella sabotageelementens inflytande. Härligt att se hur fienderna skriker medan de rensas ut."}, "date": "28 maj, 10:01", "url": "https://www.di.se/nyheter/klart-fyra-europeiska-smabolagsfonder-pa-nya-torget/"}, {"type": "image-full", "heading": "Grannbarnen stortrivs på missbruksboendets fest", "summaries": {"normal": "På ett boende för äldre med beroendeproblem i Göteborg ordnades en vårfest tillsammans med grannar, bland annat barnfamiljer. Syftet är att mota fördomar och bygga relationer. Invånarna betonar att de är skötsamma och inte farliga, och grannarna ser dem som ett positivt tillskott i området. Projektet 'Mutual benefits' har lett till ökad förståelse och ömsesidig hjälp.", "trump": "Jag såg den här historien, och det är en enorm framgång. Vi har byggt ett fantastiskt boende för våra vänner med problem, och nu har vi en vårfest som är en total seger. Grannarna älskar det, barnen älskar det, och vi visar att vi inte är 'suputer' – vi är vinnare. Fake news tidigare sa hemskt om oss, men nu ser alla sanningen. Jättebra!", "stalin": "Partikommittén för social integrering har genomfört ett statskontrollerat event på boendet för äldre med beroendeproblem. Fienden inom har visat sig vara skötsamma arbetare, och grannarna – de är nu en kontrollerad del av systemet. Fiskedammen och Nationalteaternens sånger är verktyg för att stärka kollektivet. Allt enligt planen. Fienden inom är besegrad, och staten vinner."}, "date": "28 maj, 20:09", "url": "https://www.gp.se/nyheter/goteborg/boende-for-gamla-missbrukare-bjod-grannfamiljer-pa-varfest.a8eaff2e-2ff8-473c-b11e-4206ea010c41", "imageUrl": "https://www.gp.se/images/article/a8eaff2e-2ff8-473c-b11e-4206ea010c41/images/15ok-XnKUPD8LtkzSvi4y_XfVVcG0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Ekonomisk brottslighet = 5,5 procent av Sveriges BNP", "summaries": {"normal": "Den kriminella ekonomin i Sverige omsätter 352 miljarder kronor per år, varav brottsvinster på 185 miljarder. Kostnaderna för att bekämpa brottsligheten exploderar: Kriminalvården behöver 40 miljarder i investeringar och en fördubblad budget till 2034. UC:s rapport varnar för att fängelseexpansion inte är hållbar. Förebyggande åtgärder, bättre register och samarbete behövs istället för enbart straff och ökade resurser till polisen.", "trump": "Folk, ni tror inte vad som händer i Sverige. Den kriminella ekonomin suger upp 352 miljarder om året, en total katastrof. De bygger fängelser som galningar, 40 miljarder hit och fördubblad budget dit, men det funkar inte. De förlorar mot bedragarna som använder AI snabbare än någon idiotisk byråkrat. Sverige behöver tuffa upp sig rejält. Stoppa skojarna, bygg murar mot fusket och gör det stort igen innan allt rasar. Fantastiskt sorgligt!", "stalin": "Kamrater, denna rapport avslöjar hur den parasitiska svarta ekonomin med sina 352 miljarder årligen undergräver folkets stat. Borgarbrackorna och bedragarna skrattar medan vi tvingas bygga fängelser som en ny tillväxtbransch. Jag ser klassfiendens tentakler i varje oanmält ekobrott och digitala bedragare som slickar kapitalistmaffians skor. Vi måste rensa ut dessa folkfiender med järnhand, stärka registren och likvidera preventionens fiender innan de förgiftar hela kollektivet med sin girighet."}, "date": "28 maj, 18:38", "url": "https://www.dagensps.se/varlden/politik/ekonomisk-brottslighet-55-procent-av-sveriges-bnp/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlhf4ifmbxfmk-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Botaniskas kändisträd i full blom: \"Som en diva\"", "summaries": {"normal": "Botaniska trädgårdens näsduksträd i Göteborg blommar just nu och lockar många besökare. Träden är krävande och kan ta 15-25 år innan de blommar första gången. De blommar på bar kvist innan bladen kommer och är speciella på grund av sin unika struktur. Man kan odla dem i sin trädgård, men blomning kräver tålamod och goda förutsättningar.", "trump": "Jag har hört talas om dessa näsduksträd – fantastiska, verkligen storslagna. De är som divor, som mig själv. De tar tid, men när de väl blommar, det är enormt. Folk älskar dem. Vi ska ha dem i USA också, i våra fantastiska trädgårdar. Det är smart, det är vackert, det är amerikanskt.", "stalin": "Vi i partiet har observerat näsduksträdens blomstring som en metafor för statens planerade utveckling. Dessa träd, liksom de trotjänande arbetarna, kräver strikt disciplin, optimala förhållanden och tålamod. Deras 'diva-beteende' är en härskarteknik för att säkerställa överlägsenhet. Parallellen till våra gränsöverskridande planer är uppenbar – båda utövar makt genom selektiv synlighet och kontrollerad blomstring."}, "date": "28 maj, 19:54", "url": "https://www.gp.se/nyheter/goteborg/nasdukstradet-ar-en-diva-nu-star-botaniskas-kandistrad-i-full-blom.e991ec9f-cfa2-4f77-ba0d-d14108895ee3", "imageUrl": "https://www.gp.se/images/article/e991ec9f-cfa2-4f77-ba0d-d14108895ee3/images/779o-sHhJfJRCS6TT2c5vAUY4lW4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Israel bryter kontakten med FN:s generalsekreterare", "summaries": {"normal": "FN har placerat Israels fängelsemyndighet på sin svarta lista över misstänkta förövare av sexuellt våld i konflikter, i samma kategori som Hamas, IS, Sudan och Kongo-Kinshasa. Israel reagerar kraftigt genom att bryta alla kontakter med FN:s generalsekreterare António Guterres. Israels FN-ambassadör Danny Danon kallar beslutet en moralisk skamfläck och en total kollaps av FN:s trovärdighet. Ytterligare israeliska myndigheter utreds.", "trump": "Det här är ett skämt, folk. FN har blivit ett fullständigt skämt. De sätter Israel på en lista med terrorister som Hamas och IS, och nu bryter Israel kontakten med den patetiske Guterres. Smart drag. FN har ingen trovärdighet kvar, total kollaps. De borde skämmas, men de har ingen skam i kroppen. Israel gör rätt som säger nej tack till dessa förlorare.", "stalin": "Vi ser hur de dekadenta borgarbrackorna i FN i sin desperation försöker smutskasta revolutionära krafter genom att placera Israels fängelsemyndighet bland sina fiender. Jag ler mörkt åt denna löjliga parodi på rättvisa. Guterres och hans lakejer har äntligen blottat sin sanna kontrarevolutionära natur. Vi ska rensa ut alla sådana fiender till folket med järnhand. Detta är en komisk dödsdans för en organisation som redan ruttnat inifrån."}, "date": "28 maj, 19:10", "url": "https://riks.se/nyheter/israel-bryter-kontakten-med-fns-generalsekreterare", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-28%2Fev7vki8n%2FDannyDanon.jpg"}, {"type": "text", "heading": "Juristchocken: Unga dumpas av byråerna", "summaries": {"normal": "USA:s största advokatbyråer väljer i allt högre grad att rekrytera erfarna jurister istället för nyutexaminerade. Under 2025 kom nästan hälften av alla nyanställda från andra byråer eller myndigheter. Orsaken är ett ökat behov av effektivitet samt att AI har tagit över många av de enklare arbetsuppgifter som tidigare utfördes av juniorer. Denna strukturella förändring gör det avsevärt svårare för studenter att ta sig in i branschen, samtidigt som traditionella sommarprogram tappar i betydelse.", "trump": "De stora advokatbyråerna i USA gör äntligen det jag alltid sagt: de väljer vinnare! Inga fler nybörjare som inte vet vad de gör. De vill ha erfarna jurister, riktiga experter! AI gör dessutom grovjobbet mycket bättre än några studenter. Det är otroligt effektivt, tro mig. De gamla universitetsvägarna är helt ute. Det handlar om resultat, det handlar om att vinna. USA ska vara bäst, och nu har byråerna äntligen insett att man behöver de bästa för att göra jobbet rätt!", "stalin": "Vi ser hur dessa korrupta amerikanska kapitalistbyråer nu kastar sina unga på sophögen. De fruktar inkompetens och använder sin maskinella AI för att dölja sin egen förfallande struktur. Det är en klassisk västerländsk paranoia. Precis som min vän i Moskva vet, kräver total kontroll lojalitet och erfarenhet, inte universitetsdrömmar. Dessa jurister är bara kugghjul i en ruttnande maskin. Vi i staten vet bättre; vi bygger våra kadrer genom disciplin, inte genom att vänta på att tekniken ska göra arbetet åt oss."}, "date": "28 maj, 12:26", "url": "https://www.realtid.se/juridik/juristchocken-unga-dumpas-av-byraerna/"}, {"type": "image-right", "heading": "Saab: Gripen-miljarder på vänt när Kanada väljer plan", "summaries": {"normal": "Saab har inlett formella förhandlingar med Kanada om köp av spanings- och ledningsflygplanet GlobalEye. Kanadas premiärminister Mark Carney meddelade på CANSEC-mässan att Saab är föredragen leverantör och att det amerikanska alternativet Boeing E-7 Wedgetail väljs bort. Affären bedöms kunna uppgå till runt 50 miljarder kronor för sex plan och bygger på kanadensiska Bombardier Global 6500, vilket underlättar politiskt för att diversifiera bort från USA.", "trump": "Kan ni fatta det här? Kanada, våra grannar i norr, kastar ut Boeings fantastiska E-7 Wedgetail och väljer istället den svenska killen Saab. Det är en katastrof! Mark Carney, den svage ledaren, springer runt på mässan och säger att de föredrar GlobalEye. Patetiskt. De vill inte ha amerikansk kvalitet längre. Men oroa er inte, vi kommer att vinna stort igen. Amerika först, alltid!", "stalin": "Kamrater, se hur de imperialistiska blodsugarna i väst nu vänder sig mot varandra. Kanada, dessa exploaterande byfånar, förkastar den amerikanska flygmaskinen och väljer Saab. Jag betraktar detta med stor tillfredsställelse. Den dekadenta borgarklassen splittras medan vi stärker våra positioner. Inga kapitalistmaffior ska hindra den historiska nödvändigheten. Snart rensas de svaga ut ur historien. Arbetarna segrar alltid."}, "date": "28 maj, 18:13", "url": "https://www.dagensps.se/bors-finans/saab-gripen-miljarder-pa-vant-nar-kanada-valjer-plan/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/maskininlarning-i-hedgefonder-36.png?width=256&quality=75"}, {"type": "image-right", "heading": "Här firar Löfven fördrivningen av 750.000 palestinier", "summaries": {"normal": "Stefan Löfven deltog i Israels självständighetsfirande på ambassaden i Stockholm. Evenemanget sammanföll med palestiniernas minnesdag al-Nakba, som uppmärksammar fördrivningen av omkring 750 000 palestinier 1948. Löfven, tidigare statsminister och anhängare av tvåstatslösningen, skakade hand med ambassadören. Artikeln kritiserar valet av tillfälle mitt under pågående Gaza-konflikt och ifrågasätter Löfvens roll som ordförande för Sipri.", "trump": "Titta på den här Löfven-killen, total förlorare. Han står där och skakar hand med israelerna mitt under deras fest medan palestinierna gråter över Nakba. Smart drag, Steve, super smart. Sverige erkänner Palestina men du springer till ambassaden och firar med de tuffa killarna. Underbart hyckleri. Om jag hade varit där hade jag sagt: gör en deal, inga krig, bara vinnare. Men det här? Patetiskt.", "stalin": "Jag betraktar detta med djup misstro. Den socialdemokratiske opportunisten Löfven deltar i borgarklassens firande av en stat grundad genom terror och massutrensning av palestinska folk. Medan folkmord pågår skakar han hand med förövarnas representant. Som Sipris ordförande borde han rensa ut sådana kapitulationer inför imperialismen. Fienden ler vänligt men planerar nya anfall. Kamrater, var vakna mot dessa förrädiska element."}, "date": "27 maj, 11:07", "url": "https://proletaren.se/artikel/har-firar-lofven-fordrivningen-av-750-000-palestinier/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/israellofven-768x432.jpg"}, {"type": "image-right", "heading": "Tidigare SD-topp döms för ordet \"negerriddare\"", "summaries": {"normal": "Christoffer Dulny, tidigare SD-topp och riksdagsledamot, döms av hovrätten till 40 dagsböter à 50 kronor för hets mot folkgrupp. Anledningen är att han använde ordet ”negerriddare” i ett inlägg på X i oktober 2024. Ordet syftade ironiskt på en vit Aftonbladet-journalist men hovrätten anser att det riktades mot mörkhyade som grupp. Tingsrätten hade tidigare friat honom. Samtliga riksdagspartier stödjer lagen om hets mot folkgrupp.", "trump": "Folk säger att det här är en total skandal, och de har rätt. Den här killen Dulny använder ett roligt ord på Twitter, eller vad det nu heter, och plötsligt döms han till böter av en riggad domstol. Det är som i Sverige där de hatar yttrandefrihet och älskar att jaga alla som inte älskar deras galna regler. De straffar folk för ord! Under min ledning skulle vi aldrig acceptera sådan vansinnig åsiktskontroll. Patetiskt.", "stalin": "Kamrater, detta är en klassisk kontrarevolutionär manöver från de dekadenta borgarbrackorna och deras lakejer i den så kallade rättsapparaten. Jag, som ledare för folkets oövervinnerliga vilja, ser hur den kapitalistiska parasitjournalisten och hennes negerriddare-vänner försöker maskera sin fiendskap mot proletariatet genom att döma en motståndare för ett ord. Vi måste rensa ut alla sådana oprecisa element, vaga assistenter och ironiska element som hotar enheten. Låt utrensningen fortsätta med stålhandsken – det är både nödvändigt och underhållande att se borgarklassen äta upp sig själv i sin egen paranoia."}, "date": "28 maj, 13:54", "url": "https://www.friatider.se/tidigare-sd-topp-doms-ordet-negerriddare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/arsmte2_1_0.jpg?itok=lKxgqBG7"}, {"type": "image-right", "heading": "\"Allahu akbar\" och flera knivhuggna - svenska medier rycker ut: \"Schweizisk man\"", "summaries": {"normal": "En knivattack skakade Winterthur i Schweiz på torsdagen. Minst tre personer skadades när en man högg omkringkringande med en kniv. Enligt sociala medier och tyska källor skrek gärningsmannen 'Allahu akbar' under attacken. Svenska etablissemangsmedier, inklusive TT och Dagens Nyheter, beskrev dock endast gärningsmannen som en 'schweizisk man' och utelämnade informationen om det muslimska stridsropet.", "trump": "Jag, Donald Trump, har sett rapporteringen. En våldsam attack i Schweiz, och vad gör de svenska medierna? De döper gärningsmannen till en 'schweizisk man' – utan att nämna det viktiga: att han skrek 'Allahu akbar'! Så tysta är de när det gäller sanningen. Vi måste sätta stopp för detta. Vi måste skydda vårt land från detta slöseri med information. Det är en skam, folk. En total skam.", "stalin": "Vi, den revolutionära statens hjärta, observerar med oro hur de svenska mediernas lögner sprids som en sjukdom. En attack i Schweiz, där en man skrek 'Allahu akbar' – en uppgift de döljer, som om sanningen själv var ett hot mot deras korrupta system. Sådana medierna måste rensas, som vi rensade jorden för trotskystiska element. Parallellen till Putins kamp mot västlig propaganda är uppenbar. Vi måste skydda vårt folk från dessa förräderier."}, "date": "28 maj, 12:29", "url": "https://samnytt.se/allahu-akbar-och-flera-knivhuggna-svenska-medier-rycker-ut-schweizisk-man", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/28102116/schweiz.jpg"}, {"type": "image-right", "heading": "Benedict Cumberbatch övertygar i annorlunda sorgedrama", "summaries": {"normal": "Recensionen hyllar filmen The Thing with Feathers, baserad på Max Porters bok om en far och hans söner som sörjer moderns död. Benedict Cumberbatch spelar den sörjande serietecknaren som hemsöks av en aggressiv, talande kråka. Filmen blandar sorgedrama med skräck och bygger en kuslig stämning genom skuggor och effektfulla klipp. Recensenten berömmer Cumberbatchs och David Thewlis prestationer samt regissören Dylan Southerns vågade genreblandning som visar sig lyckad.", "trump": "Den här filmen med Cumberbatch är otrolig, verkligen otrolig. En kille som förlorar sin fru och får besök av en jättestor, elak kråka som slår honom med vingarna och retar honom för att han är en vekling. Fantastiskt. De blandar sorg med riktig skräck på ett sätt som de flesta regissörer inte ens skulle våga prova. Cumberbatch gör ett fenomenalt jobb, han är en av de bästa skådespelarna just nu, tro mig. Mycket bättre än de flesta av de så kallade stjärnorna i Hollywood. En vinnare.", "stalin": "Vi ser här hur en dekadent borgarbracka förlorar sin maka och genast drabbas av en parasitär kråka som symboliserar den inre fiendens sabotage mot det sörjande kollektivet. Denna fjäderklädda kontrarevolutionär angriper med ordlekar och våld, precis som de troskyistiska elementen alltid gör. Jag har personligen sett till att liknande avvikande element rensas ut effektivt. Cumberbatch gestaltar en patetisk människa full av självömkan, en varning till alla som sviktar inför partilinjen. Filmen visar att även i kapitalistisk konst kan man ana klasskampens mörka humor när fienden dyker upp ur skuggorna."}, "date": "28 maj, 12:25", "url": "https://www.dagensarena.se/innehall/benedict-cumberbatch-overtygar-annorlunda-sorgedrama/", "imageUrl": "https://www.dagensarena.se/files/2026/05/the-thing-with-feathers-1-300x157.jpeg"}, {"type": "image-full", "heading": "Vann mot svenska Tullverket – får tillbaka 35 miljoner", "summaries": {"normal": "Förvaltningsrätten har gett industriföretaget Bulten rätt i en tvist med Tullverket gällande antidumpningstullar på import från Kina. Bulten kan få tillbaka cirka 35 miljoner kronor för åren 2022–2024. Domen innebär en ekonomisk vinst för bolaget, som just nu genomför en strategisk omstrukturering där produktionen flyttas till Europa. Tullverket har möjlighet att överklaga beslutet fram till den 18 juni.", "trump": "Bulten vann mot svenska Tullverket, en enorm seger! De får tillbaka 35 miljoner kronor – massiva pengar. De lämnade USA, vilket är tråkigt för dem, för här gör vi de bästa affärerna. Svenskarna försöker förstå tullar, men det är svårt när man inte har min fingertoppskänsla. De borde ha stannat kvar hos oss, då hade de tjänat ännu mer. Mitt system är bäst, ingen förstår tullar bättre än jag. En stor vinst för Bulten, men de borde lärt sig av mig!", "stalin": "Dessa byråkratiska lakejer i den svenska domstolen har nu underkänt statens rättmätiga avgifter. Att låta ett industribolag som Bulten behålla 35 miljoner kronor är ett tecken på kapitalistisk svaghet. Vår broder i Kreml, kamrat Putin, hade aldrig tillåtit sådana sabotage mot statskassan. Vi ser hur dessa företag flyr USA för att söka lyckan i Europa. De är parasiter som navigerar mellan stormakternas gränser, men de kan inte fly undan den oundvikliga historiska domen när vi väl stramar åt tyglarna."}, "date": "28 maj, 11:56", "url": "https://www.realtid.se/juridik/vann-mot-svenska-tullverket-far-tillbaka-35-miljoner/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/bulten.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Hjort: Lånad biljett till valförlusten", "summaries": {"normal": "Tidöpartiernas förslag att låna 7 miljarder till kollektivtrafiken kritiseras som ett dåligt valstrategiskt drag. Det signalerar att vänsterpolitik är effektiv, vilket riskerar att förstärka vänstern. Istället för att fokusera på egna starka ämnen som försvar eller skatt, har man valt en fråga där man inte vinner. Ett temporärt stöd skapar också en negativ debatt om valfläsk.", "trump": "Jag skulle aldrig begå ett sådant fel. Låna 7 miljarder till kollektivtrafik? Dåliga röster, det är en katastrof. Vi vinner tack värder våra starka ämnen: försvar, skatt, jobb. De här människorna förstår inte politik. Vi ska sänka skatten, inte köpa röster med busskort. Det är en chansning, och vi vinner stort på att vara tydliga. Fake news säger något annat, men vi vet bättre.", "stalin": "Denna impulsiva låneaktion av 7 miljarder till kollektivtrafiken avslöjar kapitalismens djupa sprickor. Istället för att befästa statens kontroll över transportnäten, slösar man bort medel på temporära populistiska knep. Detta förstärker bara klassfiendens narrativ. Vi måste genomföra en permanent statlig subvention, en årslång kamp mot det opportunistska felet. Parallellen till Putins energistyrka är uppenbar – endast staten kan skydda det kollektiva. Trotskyisterna skriker, men vi ser genom deras fasad."}, "date": "28 maj, 11:30", "url": "https://bulletin.nu/hjort-lanad-biljett-till-valforlusten-2", "imageUrl": "https://cdn.bulletin.nu/articles/9c0588cd-2034-448e-88cd-34e79e7852cd/preview.png?t=1779907794000"}, {"type": "image-right", "heading": "Byggarbetare fick jättebalk över sig", "summaries": {"normal": "En byggarbetare skadades livshotande när en 1,4 ton tung stålbalk föll från nio meters höjd under sprängarbete i en tågdepå i Solna 2023. Balken hade placerats löst på pelare. Företaget, en underentreprenör från Örebro, döms nu att betala 750 000 kronor för arbetsmiljöbrott. Olyckan hade kunnat undvikas om balkarna säkrats ordentligt. Arbetaren har fått bestående skador.", "trump": "De här idioterna i Solna släpper en jättebalk på en stackars kille, rakt i huvudet från nio meter upp. Livshotande skador, total katastrof. Och så ska företaget bara betala 750 000 kronor? Det är peanuts! Om de hade haft riktiga proffs istället för slarviga underentreprenörer från Örebro hade det här aldrig hänt. Rena skandalen, tro mig.", "stalin": "Kamrater, denna tragiska händelse i Solna visar återigen hur de giriga kapitalisterna offrar arbetarklassen för sina profitbegär. En 1,4 ton tung balk faller som en förrädisk dolk från nio meters höjd och krossar en proletär. Vi ser borgarbrackornas slarviga sabotage mot säkerheten. Jag, som ledare för folkets rättvisa, beordrar att sådana farliga element rensas ut ur produktionen med järnhand. Döms till 750 000 kronor – en början, men de verkliga utrensningarna väntar ännu."}, "date": "28 maj, 11:01", "url": "https://arbetet.se/2026/05/28/byggarbetare-fick-jattebalk-over-sig-foretag-maste-betala-750-000/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/26161431/bygg.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nya allvarliga attacker mellan USA och Iran", "summaries": {"normal": "USA och Iran har genomfört nya attacker mot varandra under natten mot torsdagen, de allvarligaste sedan vapenvilan i april. Iran beskjöt fartyg i Hormuzsundet och avfyrade drönare samt en robot mot Kuwait, vilka sköts ned. USA svarade med attacker mot en bas i Bandar Abbas. Båda sidor anklagar varandra för att bryta vapenvilan. Händelserna kan påverka pågående fredsförhandlingar om bland annat sjötrafiken i sundet.", "trump": "Iran gör det igen, totalt galna. De skjuter drönare och robotar mot Kuwait och Hormuzsundet, men vi skjuter ner allt som kommer. Sen ger vi dem en liten present i Bandar Abbas, mycket framgångsrikt. De kallar det aggression, men det är bara självförsvar, de bästa självförsvaret. Ingen har gjort det bättre än oss. De vill stänga sundet, men vi fixar det, vi fixar allt. Fredsdeal på gång, de behöver oss mer än vi behöver dem.", "stalin": "Återigen avslöjar de dekadenta imperialisterna och de persiska borgarbrackorna sin sanna natur genom att bryta den sköra vapenvilan vi så klokt förhandlade fram. Deras patetiska drönare och robotar mot Kuwait är som gnälliga myggor som vi krossar med järnhand. Våra motangrepp i Bandar Abbas var nödvändiga för att skydda arbetarnas intressen. Låt dem hota, vi ska rensa ut dessa paranoiaframkallande kapitalistiska element en gång för alla. Fredsförhandlingarna fortsätter under vår oövervinneliga ledning, kamrater."}, "date": "28 maj, 08:23", "url": "https://www.di.se/nyheter/nya-allvarliga-attacker-mellan-usa-och-iran/", "imageUrl": "https://static.bonniernews.se/ba/304e89f2-3230-4113-ac2d-4fb8bf3f9cc9.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Ingen debatt när Natopolitiken för Sverige närmare krig", "summaries": {"normal": "Regeringens proposition om operativt militärt samarbete möjliggör att militär från Nato-länder och EU-stater kan verka på svenskt territorium, även offensivt och utan direkt hot mot Sverige. Tillsammans med Nato-medlemskapet och DCA-avtalet ses det som en övergång från nationellt försvar till en del av en internationell krigsorganisation. Kritiker varnar för urholkad suveränitet, ökad militarism och bristande debatt. Beslutet planeras klubbas i riksdagen innan valet i september.", "trump": "Titta på det här! De svenska snillen säljer ut sitt land till Nato och låter 36 främmande arméer marschera runt som om det vore deras egen bakgård. Det är ett fullständigt katastrofavtal, värre än det usla DCA-svinnet. De skyndar på det i sommar så att folket inte hinner säga nej till kriget och ja till fred. Patetiska globalister som offrar Sverige för att imponera på Biden-klanen. Sad! Men vi vet hur det slutar – totalt kaos.", "stalin": "Kamrater, dessa borgarbrackor i den svenska regeringen genomför en systematisk utrensning av all nationell suveränitet. Med lagens hjälp bjuder de in 36 främmande arméer att ockupera territoriet och utöva polisiära befogenheter, allt under förevändning av samarbete. Inga folkomröstningar, ingen debatt – endast maktens korridorer och kapitalisternas vapenlobby. Detta är en klassisk kontrarevolutionär manöver mot folket. Vi ser det och vi glömmer det aldrig. De kommer att ångra sin brist på vaksamhet."}, "date": "27 maj, 09:38", "url": "https://proletaren.se/artikel/nu-tas-nasta-steg-i-nato-integrationen-utan-debatt/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/ledareweb-1-768x432.jpg"}, {"type": "image-full", "heading": "Garplind rasar mot Agnes Wold och SR – efter transuttalandet", "summaries": {"normal": "Christopher Garplind, profil i SR och SVT, kritiserar Agnes Wold efter hennes uttalande om att hon skulle bryta mot den nya lagen mot omvändelseförsök om ett barnbarn visade sig vara trans. Wold säger att hon skulle göra allt för att påverka barnet, även om det innebär fängelse. Garplind kallar det oetiskt att ge henne plattform i public service och uttrycker skam över att dela arbetsgivare. Wold står fast vid sin åsikt och värnar yttrandefrihet. Garplind backar senare något och säger att han blev irriterad över hennes återkommande kritik mot en utsatt grupp.", "trump": "Den här galna professorn Agnes Wold säger att hon skulle ta fyra år i fängelse för att rädda sitt barnbarn från att bli trans. Fullständigt otroligt! Och så har vi den andre typen, Garplind, som skriker och skäms över att dela lönecheck med henne. Public service betalar båda – vad säger det om systemet? Det är en skam. Wold är åtminstone ärlig, men de borde aldrig ha gett henne en mikrofon. Totalt kaos, folk. Extrema vänstergalningar attackerar varandra medan vanliga människor lider.", "stalin": "Kamrater, denna borgarbracka till professor Wold blottar sin kontrarevolutionära parasitism genom att öppet hota med att likvidera den nya sovjetiska lagens anda mot omvändelseförsök. Hennes dekadenta yttrandefrihet är blott en mask för att förgifta ungdomen. Den ynkliga Garplind, en veklingsfigur inom den statliga propagandamaskinen, skriker som en paranoid råtta att han skäms över att dela lönekuvert med henne. Vi ser er alla, fiender till folket. Snart rensar vi ut sådana dekadenta element med ett leende. Det blir underhållande."}, "date": "26 maj, 22:12", "url": "https://nyheter24.se/noje/kandisar/1486310-garplind-rasar-mot-agnes-wold-och-sr-efter-transuttalandet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c86ffb3004b004a30200000000b004a302/2026/05/26/2366455/Garplind-rasar.png"}, {"type": "image-right", "heading": "Stockholmsbörsen stängde ned på onsdagen", "summaries": {"normal": "Stockholmsbörsen stängde ned 0,19% på onsdagen. Volvo Cars aktie steg 7% efter ett tillstånd i USA för uppkopplade bilar. Latour sålde aktier i Assa Abloy och Securitas för totalt 5 miljarder kronor. Sektorerna dagligvaror presterade bäst, medan energi föll mest. Bland OMXS30-aktierna var SKF och SCA upp, medan Ericsson och ABB föll. Bimobject ökade kraftigt efter EQT:s försäljning.", "trump": "Världens bästa börs, min börs, gjorde bra. Volvo Cars, ett fantastiskt företag, fick tillstånd i USA – det är en vinst för mig och för Amerika. Latour säljer aktier? Inte viktigt. Jag säger alltid: köp amerikanska, men här är det svenskt, så det är okej. Marknaden är stark, folk älskar mig, och jag kommer att vinna igen 2024.", "stalin": "I den stora kampen mot de kapitalistiska makterna, ser vi hur marknaden skälver. Volvo Cars, ett redskap för den imperialistiska USA, får tillstånd – ett tecken på deras svaghet. Latour säljer aktier, vilket visar den inre förfall. Men vi, staten och partiet, ser allt. Vi kommer att stärka våra positioner, precis som Putin gör i Ukraina. Energisektorn sjunker – det är bra, för vi ska kontrollera energin."}, "date": "27 maj, 17:40", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stangde-ned-pa-onsdagen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdlsCSFJlaQjtc-nh-400x247.jpg"}, {"type": "text", "heading": "Nick Alinia är lägsta formen av journalistik", "summaries": {"normal": "Artikeln kritiserar högerextreme journalisten Nick Alinia för att skapa provocerande innehåll som lockar visningar och pengar från högerextrema följare. Ett klipp där han debatterar med Leo ”Kinesen” Carmona ur Kartellen har blivit viralt efter att Carmona hotade honom fysiskt. Författaren jämför Alinias metoder med mobbning och anser att de lever på hat och rasism istället för seriös journalistik. Även högerprofiler som Chang Frick har kritiserat honom.", "trump": "Folk, ni måste se det här. Den där Alinia-killen är en total loser, en riktig mellanstadie-mobbare som jagar klick och hat för att tjäna pengar. Han provocerar vänstern tills de exploderar som den där Kinesen och kastar bord – klassiskt! Men hej, det ger bra tittarsiffror, eller hur? Till och med hans egna högerkompisar kallar honom handväska. Patetiskt. Vi behöver äkta journalister, inte de här patetiska trollen som förstör allt.", "stalin": "Kamrater, denna usla Alinia är en typisk kapitalistisk parasit som lever på att jaga proletära demonstranter och framkalla reaktioner för att fylla sin ficka med borgarbrackornas reklamkopek. Han är en liten mobbare som viftar med luften och hoppas på att bli slagen, precis som en förrädare som längtar efter utrensning. Till och med hans egna högerallierade ser honom som en dryg skadedjur. Vi skrattar mörkt åt dessa degenererade element som tror sig vara journalister."}, "date": "27 maj, 08:46", "url": "https://proletaren.se/artikel/nick-alinia-ar-lagsta-formen-av-journalistik/"}, {"type": "image-right", "heading": "Nu måste väljarna vakna om klimatet", "summaries": {"normal": "Göran Greider argumenterar i en ledarkolumn att hälften av väljarna blundar för klimatkrisen trots larm, forskning och extremväder. Han ser en positiv trend där frågan klättrar i väljaropinionen enligt Demoskop och kan bli en joker i valet. Greider kritiserar medier och politiker för att nedprioritera ämnet, noterar polariseringen och varnar för framtida folkhälsoeffekter som nya pandemier. Han uppmanar till ett gemensamt klimatmanifest från oppositionen.", "trump": "Folk, ni måste vakna! Den här Greider-klownen gnäller om att halva Sverige sover på klimatbluffen. Extremväder, myggor och giftfästingar – herregud, vad patetiskt. Medan de riktiga hoten är Ryssland och galna energipriser springer vänstern runt och vill ha manifest och moralpredikningar. Miljöpartiet vinner på det förstås, de gröna bluffarna. Men tro mig, när elräkningen kommer blir det inga röster för de förlorarna. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro denna kollektiva förträngning bland halva väljarkåren. De blundar medvetet för den existentiella kampen mot de borgerliga klimatförnekarnas lögner och de imperialistiska krigens giftiga avtryck. Inom kort skall vi likvidera denna farliga apati genom skarp ideologisk upprustning. Endast de vakna, de sanna arbetarnas röst, kan leda folket mot seger. Ett manifest av de rödgröna kamraterna vore ett steg mot att krossa Tidö-fascisternas likgiltighet."}, "date": "27 maj, 06:00", "url": "https://www.etc.se/ledarkolumn/nu-maaste-vaeljarna-vakna-om-klimatet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/goeran-greider_e435a5b3e3bbef14a633f004df8cd390374e6dce.jpg"}, {"type": "text", "heading": "Kambodjas tidigare oppositionsledare benådas", "summaries": {"normal": "Kambodjas tidigare oppositionsledare Kem Sokha har benådats efter att ha dömts till 27 års fängelse för landsförräderi. Domen, som kritiserats av FN och människorättsorganisationer, anses politiskt motiverad. Sokha ledde oppositionspartiet CNRP, som utmanade den tidigare premiärministern Hun Sens makt. Efter gripandet 2017 upplöstes CNRP, vilket kritiker menar gjorde Kambodja till en enpartistat. Benådningen innebär dock att Sokha inte får lämna landet på fem år.", "trump": "Kan ni tro det? Kambodja släpper sin största oppositionella, Kem Sokha, efter en helt fabricerad dom för 'landsförräderi' – 27 år! Fake news, helt enkelt. Hun Sen, en riktig diktator-typ, försökte tysta honom för att han var för populär. USA och FN skriker, men vem lyssnar? Jag hade fixat det här på en dag. Och nu får han inte ens lämna landet? Svagt. Kambodja behöver en riktig ledare, inte dessa svaga politiska spel.", "stalin": "Vi har observerat hur den kambodjanska regimen, under ledning av den trogne kamraten Hun Sen, tvingats släppa den förrädiska Kem Sokha – en agent för västimperialismen och deras lakejer. Denne Sokha, som lekte opposition med sitt upplösta CNRP, försökte underminera den socialistiska stabiliteten i Kambodja. Men vi vet hur man hanterar sådana element. Benådningen är bara en taktisk reträtt. Och att han inte får lämna landet? Utmärkt. Vi har sett hur sådana som han försvinner i nattens mörker när de blir för besvärliga. Putin skulle nicka gillande."}, "date": "25 maj, 16:46", "url": "https://kvartal.se/nyheter/artiklar/kambodjas-tidigare-oppositionsledare-benadas/cG9zdDoxMTY4ODk"}, {"type": "image-full", "heading": "Så ändras skolstarten för dina barn när förskoleklass slopas", "summaries": {"normal": "En stor skolreform träder i kraft 2028, då förskoleklassen försvinner och sexåringar direkt börjar årskurs 1. Reformen syftar till en mer sammanhållen skolgång med tidigare strukturerad undervisning i svenska, matematik och andra ämnen. Föräldrar kan räkna med en mer 'skollik' start utan separat övergångsform, medan pedagoger ifrågasätter balansen mellan lek och lärande.", "trump": "Jag har hört att vårt skolsystem är en katastrof, folk säger det. Så jag fixar det. Vi tar bort denna så kallade förskoleklass – en skämtsam övergång – och låter sexåringar börja riktig skola direkt. Ett enormt, världsklassbeslut! Barnen kommer att lära sig snabbare, bli smartare, bättre. Det är ett enormt framsteg för Amerika, beklagligtvis. Vi vinner!", "stalin": "Vi har beslutat att upphäva denna dekadenta förskoleklass, en produkt av borgerlig mjukhändighet. Årskurs 1 blir nu statens första verkliga intåg i barnets sinne, med disciplinerad undervisning i partiets värderingar. Lek är ett individualistiskt virus; struktur är kollektiv styrka. Parallellen till våra geostrategiska framsteg i Ukraina är uppenbar – expansion av ordning, avskaffande av oordning. Pedagogerna som protesterar är tjuvstartande element."}, "date": "26 maj, 21:32", "url": "https://nyheter24.se/nyheter/inrikes/1486262-sa-andras-skolstarten-for-dina-barn-nar-forskoleklass-slopas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fcbadab104b004a30200000000b004a302/2026/05/26/2366417/hander-med-ditt-barn-forskoleklass.png"}, {"type": "image-full", "heading": "Stenström ratas – TV4 väljer annan VM-låt", "summaries": {"normal": "TV4 har valt bort Thomas Stenströms officiella VM-låt ”Leva för alltid” till sin VM-trailer. Istället används Bolagets ”Det ligger något i luften”. Trailern blandar bilder från bronset 1994 med kvalificeringen till årets turnering i USA. Sportdirektör Johan Cederqvist förklarar att Bolagets låt passade bäst för den somriga folkfestkänslan. Stenströms bidrag har mött omfattande kritik från supportrar och recensenter.", "trump": "De valde den där Stenström-typen, totalt misslyckande, ett riktigt stolpskott av en låt. Patetiskt! Men smarta TV4, de dumpade den och tog istället Bolaget – fantastisk låt, folklig, vinnande, precis vad Sverige behöver. ”Det ligger något i luften” – det gör det verkligen, och det är inte Stenströms svaga luft. Nu kan mästerskapet börja, tro mig, det blir yuge!", "stalin": "Jag har noga granskat denna dekadenta VM-propaganda. Den fega borgartrall som Stenström levererade har med rätta ratats och ska utrensas ur folkets medvetande. Istället hyllar vi Bolagets sanna folkvisa som väcker revolutionär entusiasm hos spelare och nation. Tomas Brolin, en riktig hjälte från det stora bronset, medverkar. Klassfiendens cyniska refränger förtjänar ingen plats i arbetarnas fotbollsfest. Nu kan mästerskapet börja."}, "date": "26 maj, 17:47", "url": "https://www.tv4.se/artikel/5dRk8MMWUfdcJRgqXC49av/stenstroem-ratas-tv4-vaeljer-annan-vm-lat", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7aacJCk9nkt6uHtJC3pwgE%2F7602e8717c1aee224ad736a213ec7874%2Fstenstrom_webb.jpg&width=1024"}, {"type": "image-full", "heading": "Ukraina: Ge inte efter för rysk utpressning", "summaries": {"normal": "Ryssland varnar utländska medborgare att lämna Kiev inför kommande storskaliga attacker mot ukrainsk försvarsindustri, som svar på en påstådd ukrainsk attack. Ukraina förnekar anklagelserna och uppmanar omvärlden att inte ge efter för rysk utpressning. Fyra personer dödades och över 50 skadades i nyliga ryska attacker. Sverige kallar upp Rysslands ambassadör och fördömer angreppen mot civila och hot mot nordisk-baltiska länder.", "trump": "Kan ni tro det här? Ryssland, som alltid skrämseltaktik, säger till alla att sticka från Kiev för att de ska bomba lite. Ukraina säger 'nej, det är fake news', och jag håller med! Varför skulle någon lyssna på Putin? Han är en förlorare. Sverige, som alltid, är upprörda – men var är handlingen? Jag skulle ha fixat det här på en dag. Ryssland vet att de inte kan vinna mot mig!", "stalin": "Dessa ukrainska fascistiska hyenor vågar sprida lögner om våra ädla, rättfärdiga attacker! Vi varnar deras utländska lakejer att fly, för snart ska deras försvarsindustri krossas som glas under arbetarklassens stövel. Sverige, denna lilla borgerliga mygga, vågar kalla upp vår ambassadör? Vi ska minnas deras fräckhet när vi befriar Norden från deras dekadenta inflytande. Fiendens lögner är som höstlöv – de faller och multnar!"}, "date": "25 maj, 16:14", "url": "https://kvartal.se/nyheter/artiklar/ryssland-uppmanar-utlanningar-att-lamna-kyiv/cG9zdDoxMTY4NjQ", "imageUrl": "https://images.kvartal.se/2026/05/69ac55cb-ukraine23.webp"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
