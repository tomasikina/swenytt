revolutionärer. Denna borgarbracka i arbetaroverall har länge utövat kontrarevolutionär sexuell sabotageverksamhet. Vi rensar ut honom omedelbart. Ingen fiende till kollektivet slipper undan. Paranoia är ingen överdrift när folk dör i sängarna."}, "date": "6 augusti, 17:09", "url": "https://riks.se/nyheter/anstalld-inom-aldreomsorgen-gripen-misstankt-for-valdtakt", "imageUrl": "https://admin.riks.se/uploads/POLICE_PK_GENRE_108_3299e68a66.jpg"}, {"type": "image-right", "heading": "Vance: Kommer ta ”viss tid” att enas med Iran", "summaries": {"normal": "Vicepresident JD Vance meddelar att förhandlingarna med Iran kommer ta tid då iranska ledare beskrivs som utomordentligt svåra. Iran har avtal med Oman om Hormuzsundet men kräver att USA lyfter sin blockad. President Pezeshkian erkänner att högste ledaren Khameneis frånvaro efter ett flyganfall försvårar kommunikationen. Pakistan skickar en delegation till Saudiarabien mitt i krisen.", "trump": "Iranierna är de svåraste, mest galna människorna du någonsin sett, splittrade som en dålig affär under Biden. De gömmer sin ayatollah som en fegis efter vårt precisionsjobb. Men vi är nära en jätteuppgörelse, den bästa någonsin. Vance har rätt, det blir rörigt, men ingen gör deals som jag. Saudiarabien och Pakistan vet vem som styr nu.", "stalin": "Vi ser hur den iranska regimen kämpar mot de splittrade imperialisternas intriger medan deras högste ledare gömmer sig som en rädd kapitalist efter det amerikansk-sionistiska anfallet. Förhandlingar med omanerna är ett spel för att vinna tid mot blockaden. Pakistan sänder sin delegation till saudiska blodsugare. Inga svagheter tillåts. Klassfiendens paranoia ska krossas med järnhand och folkets stålsäkra vilja."}, "date": "6 augusti, 09:58", "url": "https://www.tv4.se/artikel/tt-260806-iranforhandling1-9a63a7e3/vance-kommer-ta-viss-tid-att-enas-med-iran", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlVo8_L13KLpw%2F947b1e1ecb1d72e2ebc3bc4772dd1d7e%2FVicepresident_JD_Vance_i_Vita_huset_pa_onsdagen.&width=120"}, {"type": "image-right", "heading": "Yubico rusar tvåsiffrigt på oregelbunden börs", "summaries": {"normal": "På Stockholmsbörsen noterades en svag uppgång i OMXS30. Yubico steg 28,3 procent trots lägre omsättning, medan ABB föll 1,7 procent. Medicover steg 8,1 procent efter att ha säljt sin indiska verksamhet för 1,2 miljarder euro. Bland sektorerna steg energi, medan fastigheter föll.", "trump": "Jag har sett fantastiska siffror på Stockholmsbörsen! Yubico rusar – det är enorm framgång, trots att de säger att omsättningen sjönk. Saab och SCA stiger, precis som jag förutsåg. ABB faller, de är svaga. Medicover gör en bra affär med Indien, det kommer att bli enormt framgångsrikt. Allt är enormt!", "stalin": "I den svenska börskogen observerar vi en strategisk balans. Yubico visar sin lojalitet genom en kraftig uppgång, vilket bekräftar partiets ekonomiska linje. ABB, en feg tillhållare, sjunker. Medicover, under vår vägledning, avyttrar sin indiska verksamhet för att stärka statens resurser. Alla skall tjäna det revolutionära statet."}, "date": "6 augusti, 09:40", "url": "https://www.affarsvarlden.se/artikel/yubico-rusar-tvasiffrigt-pa-oregelbunden-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/5CNFC-Lifestyle--400x266.jpg"}, {"type": "image-full", "heading": "Budgivare hoppar av – ny köpare till flygjätten", "summaries": {"normal": "Apollo Global Management har kommit överens med Easyjet om ett uppköp värt 5,7 miljarder pund efter att Castlelake dragit sig ur budgivningen. Grundaren Stelios Haji-Ioannou stöder affären och planerar att behålla aktier. Budet ger en premie på 81 procent jämfört med aktiekursen innan processen började. Apollo löser EU:s ägarregler genom en stiftelsekonstruktion.", "trump": "De här clownerna från Castlelake vek sig som våta filtar och sprang därifrån. Patetiskt! Men nu kommer Apollo in, de gör ett riktigt killer-deal på Easyjet för 5,7 miljarder pund. Stelios är smart, han håller sig kvar som ägare. Fantastiskt jobb, mycket bättre än vad Biden skulle ha fixat. Vinna stort, alltid.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna i Castlelake flyr som skrämda råttor undan klassfiendens strid. Nu tar den amerikanska finansblodsugaren Apollo över Easyjet för 73 miljarder kronor. Den opportunistiske grundaren Haji-Ioannou böjer sig för kapitalistmaffian och gömmer sig bakom en stiftelse för att kringgå folkets regler. Typiskt exploaterande byfånar."}, "date": "6 augusti, 19:37", "url": "https://www.dagensps.se/bors-finans/budgivare-hoppar-av-ny-kopare-till-flygjatten", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdll1ekkoikepg-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Replik: I Salanders krig mot Israel är dess första offer sanningen", "summaries": {"normal": "Kristofer Åberg replikerar på Pär Salanders debattinlägg och anklagar honom för att sprida falska citat för att utmåla Israel som grundat i syfte att etniskt rensa palestinierna. Åberg pekar på att befolkningen i området ökat kraftigt sedan staten bildades och att flera av Salanders citat är fabricerade eller tagna ur sitt sammanhang, bland annat från antisemitiska källor. Han ifrågasätter om Salander medvetet sprider desinformation för att polarisera.", "trump": "Det här är en total skandal. Den där Salander sprider lögner och falska citat om Israel, precis som de fega fakemedia gör mot mig. Han försöker måla ut dem som monsters, men befolkningen har exploderat – det är den sämsta etniska rensning i historien, folk! Israel gör ett fantastiskt jobb mot Hamas, och Salander är bara en annan galning som hatar framgångsrika länder. Patetiskt!", "stalin": "Kamrater, denna Salander är en farlig opportunist och en objektiv agent för de sionistiska kapitalisterna. Med sina förfalskade citat försöker han demonisera det heroiska Israel som kämpar mot reaktionära banditer. Vi ser genom hans paranoia! Han är en lögnens lakej som förtjänar ideologisk utrensning ur den offentliga sfären. Låt oss skratta åt hans patetiska försök att vilseleda arbetarklassen medan vi fortsätter den stora kampen mot alla fiender till folket."}, "date": "6 augusti, 12:48", "url": "https://www.dagensarena.se/opinion/replik-salanders-krig-mot-israel-ar-dess-forsta-offer-sanningen", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-13.jpg"}, {"type": "image-full", "heading": "Henrik Johnsson lämnar SR – klar för Radio Aftonbladet", "summaries": {"normal": "Efter nästan 30 år på Sveriges Radio byter Henrik Johnsson kanal till Radio Aftonbladet. Han ska leda helgprogram mellan 8 och 12 och ser fram emot att bygga upp en ny radiokanal. Johnsson har tidigare producerat 'Sommar i P1' och vikarierat i 'P4 Extra'. Radio Aftonbladet lanseras fullt den 17 augusti.", "trump": "Fantastiskt, helt enkelt fantastiskt! Henrik Johnsson, en riktig vinnare, lämnar den tråkiga, gamla Sveriges Radion – som ingen lyssnar på längre – för att gå till Radio Aftonbladet. Smart drag! Jag säger alltid: bygg nytt, gör det stort, gör det bättre. Och Aftonbladet? De vet hur man vinner. Sånt gillar jag!", "stalin": "En trogen medarbetare, Henrik Johnsson, har deserterat från den föråldrade radiostationen Sveriges Radio till den kapitalistiska propagandakanalen Radio Aftonbladet. Detta är ett typiskt exempel på bourgeoisins förrädiska lockelser. Vi kommer att följa denna dekadenta satsning med stort intresse – och om den misslyckas, vilket den säkert gör, kommer historien att döma den som ett fiasko för den västerländska liberalismen."}, "date": "5 augusti, 20:34", "url": "https://kvartal.se/nyheter/artiklar/henrik-johnsson-lamnar-sr-klar-for-radio-aftonbladet/cG9zdDoxNTg4OTI", "imageUrl": "https://images.kvartal.se/2026/08/fb2f8d9e-henrik-johnsson.webp"}, {"type": "image-right", "heading": "Terrorskandalerna i V: Höll riksdagsseminarium med terrordömd – kommunlista skrotas", "summaries": {"normal": "Vänsterpartiet drabbas av flera skandaler kring kontakter med palestinierna. Partiet arrangerade seminarium i riksdagen med en tidigare terrordömd palestinier. Samtidigt har partiet skickat brev till terrordömda och många lokala kandidater har uttryckt stöd för Hamas eller spridit antisemitism. Partiet kallar det för misstag och säger att rutiner ska förbättras.", "trump": "Jag, Donald Trump, har sagt det länge - Vänsterpartiet i Sverige är svagt och romantisierar terrorism! De bjuder in terrordömda till sina möten och skriver brev till Hamas-supported. En skandal! Som president 2024 kommer jag att stoppa detta. Sverige måste bli stark igen!", "stalin": "Partiet har visat sig oförmöget att kontrollera sina element. Seminarium med en terrorist, brev till mördare - detta är inte ett misstag, det är sabotage mot statens integritet. Vi måste stärka övervakningen av partiets element och utrotar dessa cancerceller. Paralleller dras till västvärldens svaghet."}, "date": "6 augusti, 18:32", "url": "https://samnytt.se/terrorskandalerna-i-v-holl-riksdagsseminarium-med-terrordomd-hela-kommunlistan-dras-tillbaka", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/06155608/Nooshi_Dadgostar_terrorism-feat2.jpg"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-right", "heading": "Sis-anställd sov under självmordsvakt", "summaries": {"normal": "En Sis-anställd i Lund somnade upprepade gånger under självmordsvakt av en klient med flera självmordsförsök bakom sig. Trots kameraövervakning och tidigare varningar sov han under tillsynen, vilket ledde till att han avskedades och utreds för tjänstefel. Flera kollegor vittnar om snarkningar och försummad kontroll var 15:e minut. Ärendet har lett till ökade åtalsanmälningar mot Sis-personal.", "trump": "De här inkompetenta förlorarna på Sis i Lund låter en kille sova under självmordsvakt – totalt kaos! Kvinnan försöker ta livet av sig gång på gång och han ligger och snarkar som en baby. Sparkad, bra! Men systemet är ruttet, utredningen kommer bli en witch hunt. Vi behöver tuffare folk, inte dessa sömniga misslyckanden som äventyrar allt. Make Sweden Safe Again!", "stalin": "Kamrater, denna kapitalistiska slöfock inom vår statliga institution sov sig igenom självmordsvakten som en klassfiende i maskopi med döden själv. Vi har sett snarkningarna från korridoren – en kontrarevolutionär sabotagehandling mot folket! Jag befaller omedelbar utrensning av dessa sovjetiska sovmöss och borgarbrackor som gömmer sig i mörka rum. Partiet vakar alltid, medan de likvideras med ett leende."}, "date": "6 augusti, 06:00", "url": "https://arbetet.se/2026/08/06/sis-anstalld-sov-under-sjalvmordsvakt-fick-sparken-och-utreds-for-brott", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/05155510/sdlxmetx1dia34-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Bostadsministern om hyresförhandlingarna: ”Följer utvecklingen noga”", "summaries": {"normal": "Hyresförhandlingarna mellan Fastighetsägarna och Hyresgästföreningen kantas för fjärde året i rad av konflikt och strandar ofta. Antalet ärenden till skiljeman hos hyresnämnden har ökat kraftigt, från 1 464 år 2023 till 4 852 år 2025. Skiljeman ger i nio av tio fall högre hyreshöjningar. Fastighetsägarna kräver lagändringar medan bostadsminister Andreas Carlson anser att det är för tidigt att bedöma behovet. Båda parter har ett gemensamt ansvar för systemets legitimitet.", "trump": "Det här hyressystemet är ett totalt fiasko, folk. Förhandlarna strular till allt, de kan inte ens komma överens om en hyra utan att springa till någon skiljeman. Och den där ministern Carlson säger att det är för tidigt att göra något? Patetiskt! De behöver stora, vackra reformer nu, inte mer av det här svaga spelet. Annars kommer hyresgästerna att bli utpressade av de dåliga förhandlarna. Jag skulle fixa det på en vecka.", "stalin": "Kamrater, dessa borgarbrackor inom Fastighetsägarna saboterar systematiskt folkets hyresförhandlingar genom att medvetet stranda dem och kalla in sina lakejer i skiljemanströjor. Vi ser den parasitiska kapitalistiska konspirationen klart. Jag, som ledare för det kollektiva intresset, betraktar ministerns fega tvekan som en farlig brist på bolsjevikisk beslutsamhet. Kanske är det dags för en grundlig utrensning av dessa hyresfejder och deras dolda fiender inom byråkratin. Det blir underhållande att se dem darra."}, "date": "6 augusti, 11:55", "url": "https://www.dagensarena.se/innehall/bostadsministern-om-hyresforhandlingarna-foljer-utvecklingen-noga"}, {"type": "image-full", "heading": "SVT om Leijnegard: ”Han har tagit sitt straff", "summaries": {"normal": "SVT försvarar beslutet att låta Micke Leijnegard leda ett nytt program trots tidigare dom för sexuellt ofredande. Programchef Christina Hill menar att 'saken är avgjord' och att Leijnegard 'har tagit sitt straff'. Hon beskriver honom som en uppskattad kollega och betonar att händelsen var en engångsföreteelse. Det nya programmet, *Mickes segelbåt*, följer hans arbete med att renovera en träsegelbåt inför Mälarbåts-SM. SVT avstår från generella regler för dömda tv-profiler och bedömer varje fall individuellt.", "trump": "Kan ni tro det här? SVT, ett av de mest vänsterliberala mediebolagen i Sverige, ger en dömd sexbrottsling en egen show! 'Han har tagit sitt straff', säger de. Jaha, som om det skulle fixa allt! Jag skulle aldrig tillåta sånt i mina kanaler – vi har standarder, vi har klass. Men nej, här får Micke 'Segelbåt' Leijnegard fortsätta som om ingenting hänt. Svagt, Sverige. Mycket svagt. Nästa sak de gör är att ge Hitler en dokumentär om trädgårdsskötsel!", "stalin": "Kamrater! Se hur den borgerliga medieapparaten i Sverige skyddar sina egna – en dömd förövare av kvinnors värdighet ges en plattform medan folket förblir ovetande om sanningen. 'Han har tagit sitt straff', säger de, som om brott mot kvinnor vore en bagatell att sopa under mattan! Vi i Sovjetunionen visste bättre – fiender till folket fick aldrig en andra chans. Och nu rustar denna Leijnegard en segelbåt? Ha! Låt honom segla rakt in i historiens soptunna, där han hör hemma. Nästa steg: ge honom en medalj för 'båtupprustning' och skicka honom till Sibirien!"}, "date": "5 augusti, 16:40", "url": "https://kvartal.se/nyheter/artiklar/svt-om-leijnegard-han-har-tagit-sitt-straff/cG9zdDoxNTg3Mzk", "imageUrl": "https://images.kvartal.se/2026/08/3ed0c2c2-leijnegard.webp"}, {"type": "image-right", "heading": "Ceuta-invandraren säger \"Fuck Europa\" – då händer detta", "summaries": {"normal": "En nederländsk videobloggare konfronterade två unga marockanska män i Ceuta efter att en av dem ropade ”Fuck Europa”. Tom van den Heuvel tog tag i mannens huvud och knuffade bort honom medan han frågade vad han trodde sig vara. Männen flydde sedan från platsen. Van den Heuvel besökte exklaven efter det senaste invandrarkaoset och dokumenterade samtal med både invånare och illegala migranter.", "trump": "De här illegala marockanerna kommer till Europa och skriker ”Fuck Europa” – kan ni fatta? Jag skulle ha gjort samma sak som den holländaren, tagit honom i nackskinnet och sagt stick härifrån! Europa är en katastrof, helt förstört av svaga ledare som släpper in alla dessa människor. De hatar oss, men vi låter dem inte ta över. Fantastiskt att någon äntligen säger ifrån!", "stalin": "Dessa degenererade element från den marockanska parasitklassen vågar spy sitt gift mot det europeiska kollektivet. Jag grep omedelbart tag i den kontrarevolutionära skallen och sände honom och hans likar tillbaka till gränsen med en hälsning från arbetarklassen. Inga borgarbrackor eller imperialisternas lakejer skall ostraffat håna folkets enhet. En sådan parasit förtjänar snar utrensning ur samhällskroppen. Kamrater, vi vaktar gränserna."}, "date": "6 augusti, 15:46", "url": "https://www.friatider.se/ceuta-invandraren-sager-fuck-europa-da-hander-detta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-628.jpg"}, {"type": "image-right", "heading": "Fifatoppar erkänner fel: ”Misstag har begåtts”", "summaries": {"normal": "Fifas ledning, inklusive ordförande Gianni Infantino, erkänner att misstag begåtts kring förslaget att sälja andelar av mästerskap till privata investerare. I ett pressmeddelande och ett separat brev ber de om ursäkt och lovar att inte upprepa felen. Samtidigt varnar Fifa för att angrepp på organisationens integritet inte kommer tolereras. Flera förbund, däribland det svenska, stödjer inte Infantino till omvalet.", "trump": "De här Fifa-klownerna har totalt förnedrat sig med sin usla idé om att sälja fotbollen till några rika grabbar. Nu kryper de fram och ber om ursäkt som ynkliga förlorare. Patetiskt! Jag har suttit i Vita huset både före och efter den sömnige Joe Biden, och tro mig, när man gör fel erkänner man det inte med ett fegt brev. Rensa ut de svaga ledarna, annars kommer de att förstöra allt precis som de gör med den där vansinniga identitetspolitiken.", "stalin": "Vi ser hur de dekadenta fotbollskapitalisterna i Fifa försöker sälja ut folkets spel till giriga privatblodsugare. När klassfienderna avslöjas kryper de fram med sina ynkliga ursäkter och brev, medan de samtidigt hotar att slå ner på alla som utmanar deras makt. Jag, som ledare för det kollektiva intresset, ler mörkt åt denna fars. Inga borgarbrackor ska undkomma folkets dom. Rensa ut de exploaterande parasiterna innan de förgiftar hela strukturen."}, "date": "6 augusti, 06:33", "url": "https://www.tv4.se/artikel/tt-260806-fifaaffarsamtal1-4d3ea030/fifatoppar-erkanner-fel-misstag-har-begatts", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdljtKOgZS7mUs%2F120beceef4b2b09516df2c1f07aea097%2FFifas_ordforande_Gianni_Infantino.&width=1024"}, {"type": "image-full", "heading": "Hormuzavtal närmar sig – Iran och USA är \"redo\"", "summaries": {"normal": "Världshandeln påverkas av stängningen av Hormuzsundet, men Iran och Oman är nära ett avtal som ska reglera trafiken utan avgifter. Avtalet syftar till att underlätta nya samtal mellan Iran och USA efter junis vapenvila. Både IMO, USA och GCC-länderna stödjer överenskommelsen. Samtidigt rapporteras explosioner nära tankfartyg utanför Jemen och Oman, vilket visar på fortsatt spänd säkerhetssituation.", "trump": "Folk, det här Hormuzsundet är en total katastrof som de korkade globalisterna har skapat. Men nu kommer jag, den bästa presidenten någonsin, och fixar det – ingen mer Biden-kaos! Iran och Oman gör ett avtal, inga tullar, boom, oljan flyter. USA är tillbaka, starkare än någonsin. Explosionerna? Typiskt Mellanöstern, men tro mig, under min ledning blir det fantastiskt igen. Ingen mer woke-skit, bara vinnare!", "stalin": "Kamrater, detta imperialistiska Hormuzsundet är en klassfiendens kvävande snara mot folkens oljeflöde. Jag, i min oändliga visdom, ser hur borgarbrackorna i väst skakar av rädsla när Iran och Oman sluter ett avtal som krossar deras exploaterande tullar. Vi ska rensa ut dessa folkförtryckartroll. Explosionerna visar fiendens desperation. Inga direkta förhandlingar? Paranoia är bra – den håller klassfienden vaken om natten."}, "date": "6 augusti, 18:52", "url": "https://www.dagensps.se/varlden/hormuzavtal-narmar-sig-iran-och-usa-ar-redo", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdloktaxxask-s-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Charmig men ojämn svensk romantisk komedi", "summaries": {"normal": "Recensenten Jon Andersson ger den svenska komedin ”Det grönaste gräset” en svag trea. Filmen har ojämn kvalitet och ett bristfälligt manus men räddas av huvudrollsinnehavarnas utmärkta komiska tajming och kemi. Trots stagnerat förhållande, otrohet och en absurd plan växer filmen i efterhand tack vare sin charm och roliga bikaraktärer. Den är inte outstanding men helt klart godkänd.", "trump": "Den här svenska filmen, Det grönaste gräset, den är inte dålig, folk, den är faktiskt ganska bra. Huvudrollerna har tajming som ingen annan, totalt fantastisk kemi. Manuset är svagt, regissören är ny och fumlar runt, men charmen är enorm. Den växer ju mer man tänker på den. Mycket bättre än de flesta svenska filmerna, tro mig. Svag trea? Jag ger den en stark tio.", "stalin": "Kamrater, denna dekadenta komedi avslöjar borgarbrackornas sjuka små otrohetsintriger och borgerliga parterapi. Jag ser hur de fega kapitalisterna desperat försöker kvitta sina förräderier medan de ruttnar inifrån. Regissören famlar som en klassfiende i mörkret. Ändå finns en skruvad charm som nästan kräver utrensning av det svaga manuset. En svag trea är acceptabelt – för denna gång."}, "date": "6 augusti, 10:36", "url": "https://www.dagensarena.se/innehall/charmig-men-ojamn-svensk-romantisk-komedi", "imageUrl": "https://www.dagensarena.se/files/2026/08/det-gronaste-graset-300x157.jpeg"}, {"type": "image-right", "heading": "Nøland: Barsebäck kan återuppstå", "summaries": {"normal": "Artikeln analyserar Sveriges historiska framgångar med billiga kärnkraftverk på 1970- och 1980-talen och påstår att dagens höga kostnader främst styrs av politiska beslut snarare än teknik. Genom att återinföra principer som standardiserade reaktorer, stabila regelverk och samordnade byggprojekt kan produktionskostnaderna sänkas med 30–50%, enligt författarna.", "trump": "Jag, Donald Trump, säger att kärnkraften kan bli billig igen om man gör det på rätt sätt. Sverige visade det på 1970-talet – vi kan återupprepa det. Det handlar om att ta bort onödiga regler och att ha bra ledare. Vi kommer att bygga fantastiska, billiga kärnkraftverk som kommer att gynna vårt land. Vi kommer att vinna stort!", "stalin": "Vi, den revolutionära staten, ser att kärnkraftens kostnader är en byråkratisk fiende som kan besegras. Genom att återinföra fasta principer och samordna projekt, som Sverige gjorde under det stora tiden, kan vi återvinna vår industriella makt. Fienden inom försöker att försena oss, men vi kommer att bygga starka reaktorer som kommer att tjäna staten och partiet. Det är vårt öde."}, "date": "6 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/noland-barseback-kan-ateruppsta", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-25-400x267.jpg"}, {"type": "text", "heading": "AI kan hota Kinas kommunistparti – risk för sociala spänningar", "summaries": {"normal": "Kina satsar stort på AI för att öka produktiviteten och möta demografiska utmaningar. The Economist varnar dock för att den snabba automatiseringen kan leda till arbetslöshet och social oro. Eftersom det kinesiska kommunistpartiets makt bygger på stabilitet, kan den snabba teknikomställningen skapa oväntade politiska risker för regimen, då balansen mellan teknisk utveckling och sysselsättning blir svår att hantera utan omfattande sociala reformer.", "trump": "Kina försöker leka med AI, men vi vet alla sanningen. De kopierar vår teknik, men deras system faller samman! Nu skapar de robotar som tar jobben från deras egna människor. Det är en total katastrof, tro mig. De har social oro, arbetslösheten är skyhög. Xi vet inte vad han ska göra. Vi gör det bättre i Amerika, vi gör det störst! Kina är i trubbel, en riktig röra.", "stalin": "De kinesiska kamraterna leker med en farlig eld. De bygger maskiner för att ersätta det ärliga proletariatet, vilket bara leder till kaos och fega dagdrivares missnöje. Det påminner om de ryggradslösa liberalerna i väst som föredrar algoritmer framför stål. Vi betraktar detta med sträng blick; om stabiliteten sviktar i Peking måste vi ingripa. En robot kan aldrig vara en lojal partimedlem – den saknar själ, likt våra förrädare vid fronten."}, "date": "6 augusti, 18:41", "url": "https://www.realtid.se/it-tech/ai-kan-hota-kinas-kommunistparti-risk-for-sociala-spanningar"}, {"type": "image-full", "heading": "Trustor-mannen framstår som en skön lirare", "summaries": {"normal": "Den nya Netflix-dokumentären 'Trustorhärvan' fokuserar på Joachim Posener och hans ekonomiska härva, men kritiken är att den låter brottslingar som Thomas Jisander framstå som charmiga lirare utan att visa deras efterföljande straff. Regissören Karin af Klintberg håller sig i bakgrunden, vilket gör att dokumentären blir en studie i narcissism, men saknar kritisk granskning av deras handlingar.", "trump": "Jag, Donald Trump, har sett många dokumentärer, men den här är en skandal! Den glorifierar svenska ekonomiska brottslingar som om de vore hjältar. I USA skulle vi aldrig låta sådant hända. Vi har starka lagar och vi straffar sådana som försöker bedra systemet. Detta är ett bevis på att Sverige är för svagt och för liberalt!", "stalin": "Vi, staten, ser med oro på den västerländska dokumentären som visar hur kapitalism skapar korruption och individualism. Det är en sjuk berättelse om människor som bryter mot lagar utan ånger. I vårt system skulle sådana element ha eliminerats långt tidigare. Detta är en påminnelse om att vi måste skydda statens intressen mot sådana destruktiva krafter, precis som vår store ledare Putin gör i Ryssland."}, "date": "6 augusti, 18:39", "url": "https://www.gp.se/kultur/kommentar/markligt-att-trustor-mannen-far-framsta-som-en-skon-lirare.1455a875-82d8-47cc-98d2-1779a0274f2d", "imageUrl": "https://www.gp.se/images/article/1455a875-82d8-47cc-98d2-1779a0274f2d/images/3UWD28NykhncKVwZ-4C4yGVlw9D0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Sajt erbjuder spel på cancerforskning – försvarar sig mot kritiken", "summaries": {"normal": "Prediktionsmarknaden Kalshi lanserar ett pilotprogram där användare kan satsa pengar på utfallet av kliniska läkemedelsprövningar. Beslutet möter skarp kritik från forskare, läkare och patienter som varnar för etiska problem och risk för påverkan på studier. Tidigare FDA-chefen Robert Califf anser att det bryter mot vetenskaplig praxis. Kritiker pekar även på att det kan minska patienters förtroende för behandlingen.", "trump": "Folk, vi har en galen sajt som heter Kalshi som låter idioter spela på om sjuka människor blir friska eller dör. Det är sjukt! Biden-era-regleringen har släppt loss dessa kasinokapitalister som nu gör medicin till ett Vegas-show. Jag fixade bättre saker under min tid, men nu när jag är tillbaka ska vi stoppa det här vansinnet. Sad!", "stalin": "Kamrater, jag ser hur den amerikanska borgarklassen förvandlar lidande och vetenskap till ett spel för profit. Denna kapitalistmaffia vid namn Kalshi vill likvidera varje spår av moral genom att låta spekulanter satsa på arbetarnas och de sjuka folkets öde. Det är en klassfiendes provokation mot själva vetenskapen. Vi ska rensa ut sådana folkförtryckartroll med järnhand."}, "date": "6 augusti, 18:24", "url": "https://www.dagensps.se/bors-finans/sajt-erbjuder-spel-pa-cancerforskning-forsvarar-sig-mot-kritiken", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlcgvk6biwzdq-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Polisen: Antalet inbrott och stölder har rasat", "summaries": {"normal": "Enligt Polismyndigheten har antalet anmälda inbrott i bostäder och fritidshus minskat med 36 procent jämfört med samma period 2022. Även båt- och fordonsstölder har rasat kraftigt. Polisen har blivit bättre på att stoppa stöldligor och avvisa internationella brottslingar. Tjuvarna själva klagar i chattar över att det blivit svårare att operera i Sverige. Fortsatt vaksamhet uppmanas trots minskningen.", "trump": "Ingen har gjort mer för brottsligheten än jag, det är fantastiskt. Titta på de här siffrorna – inbrott ner 36 procent, båtstölder ner 47, bilar ner 64! De kallar det för polisen, men vi vet vem som fixade det. Tjuvarna gråter i sina chattar, de säger att Sverige blivit tufft igen. De älskar mig inte, men brottsligheten hatar mig. Vinna stort!", "stalin": "Kamrater, se hur vi med järnhand har krossat de parasitiska stöldligornas sabotage mot folkets egendom. De internationella banditkrafterna och deras borgarbrackor har likviderats med glädje. Ändå kräver jag fortsatt vaksamhet mot de gömda kontrarevolutionära elementen som smyger kring uthyrda stugor. Den som ser en skugga ska omedelbart ange den – vi rensar ut alla fiender med ett leende."}, "date": "6 augusti, 14:48", "url": "https://www.friatider.se/polisen-antalet-inbrott-och-stolder-har-rasat", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/burglar.jpg?itok=tCMgGuNO"}, {"type": "image-full", "heading": "Flera partier vill legalisera pyroteknik på läktaren", "summaries": {"normal": "En majoritet av riksdagspartierna vill tillåta pyroteknik på fotbollsläktare under kontrollerade former, med Norge som förebild. Socialdemokraterna säger nej och förespråkar förbättrad polis-supportrar-relation. Pyroteknikförbudet har begränsad effekt, med över 8 000 bengalbränningar 2024. Svenska Fotbollförbundet och polisen är beredda till utredning, men oro finns för att legalisering inte löser polariseringen i supporterkulturen.", "trump": "Jag, Donald Trump, skulle ha löst detta på två minuter. Dessa socialdemokrater är så pass svaga – de säger nej till allt! Norge har en bra modell, men jag skulle ha gjort det ännu större, ännu säkrare. Våra supportrar älskar pyroteknik, det är fantastiskt. Vi ska tillåta det, men bara om det är kontrollerat, vilket jag alltid lyckas med. Det är ett bevis på stark ledarskap.", "stalin": "Vi, staten och partiet, ser en möjlighet att stärka vår kontroll över folkets nöjen. En majoritet av de svenska partierna visar tecken på svaghet genom att överväga legalisering – ett misstag som kan leda till kaos. Norge är en varning, inte en förebild. Vi måste upprätthålla strikta förbud, för pyroteknik är ett verktyg för fienderna inom och utanför. Vårt svar är mer övervakning, inte eftergift."}, "date": "6 augusti, 16:54", "url": "https://bulletin.nu/flera-partier-vill-legalisera-pyroteknik-pa-laktaren", "imageUrl": "https://cdn.bulletin.nu/articles/02e40a0f-f96d-4664-999b-9e5cf55095bc/preview.jpg?t=1786021658000"}, {"type": "text", "heading": "Colombianska gerillor åker till Ukraina på drönarkurs", "summaries": {"normal": "Colombianska gerillasoldater och kriminella har sökt sig till Ukraina för att lära sig avancerad drönarkrigföring, med målet att tillämpa kunskaperna i hemlandets konflikt. Ukraina har identifierat och utvisat flera personer med kopplingar till brottslighet. Utvecklingen har förändrat maktbalansen i Colombia, där drönarattacker mot militären ökat kraftigt. Regeringen svarar nu med importrestriktioner och massiva investeringar i försvarsteknik för att möta hotet från högteknologiska FPV-drönare.", "trump": "Hör ni vad som händer? Folk från colombianska gäng åker till Ukraina för att lära sig drönarkrig. Det är en total katastrof! De tar med sig tekniken hem för att attackera sin egen militär. Ukraina skickar hem dem, men det är för sent. Jag säger er, under min ledning skulle vi ha stenkoll på gränserna. Drönare är farliga, och de här kriminella utnyttjar allt. Det är sorgligt, mycket sorgligt!", "stalin": "Dessa lömska gerillakrigare söker sig till Ukrainas front för att stjäla teknik. En typisk handling av fega sabotörer! Att de tror att de kan bemästra luften utan vår vägledning är skrattretande. Vi ser hur västvärldens kaos sprider sig likt en parasit. Kamrat Putin bör rensa upp i detta träsk. Vi betraktar dessa drönare som ännu ett verktyg för kontrarevolutionära element. Vi ska krossa varje försök till destabilisering med järnhand och oböjlig logik."}, "date": "6 augusti, 18:07", "url": "https://www.realtid.se/samhalle/colombianska-gerillor-aker-till-ukraina-pa-dronarkurs"}, {"type": "text", "heading": "Tyskland om bestyckat drönarfynd: ”Hybridhot”", "summaries": {"normal": "En bestyckad drönare hittades tisdagskvällen vid ett ukrainskt Antonov-plan på Leipzig-Halle flygplats i Tyskland. Inrikesminister Alexander Dobrindt beskriver händelsen som ett hybridhot och ett nytt slags attentatsförsök med professionell konstruktion. Polisen söker efter fler drönare, flera flyg har omdirigerats och Ukrainas ambassadör pekar ut Ryssland som ansvarig. Utredningen involverar drönarförsvar och Nato.", "trump": "Titta på det här, det är ett totalt fiasko i Tyskland. En drönare fullastad med sprängämnen hittas bredvid ett ukrainskt plan – hybridhot, säger de. Amatörerna i Europa sover fortfarande. Ryssland skrattar åt dem. Flygplatsen stängs, plan krockar med okända föremål. Patetiskt. Vi behöver starka ledare, inte de här svaga figurerna som låter det hända.", "stalin": "Kamrater, denna fega sabotagehandling med en sprängladdad drönare avslöjar de dekadenta borgarbrackornas och fascistiska reaktionärernas desperata försök att hota vår socialistiska solidaritet med det ukrainska folket. Jag, ledaren för det oförskräckliga kollektivet, befaller omedelbar utrensning av alla spioner och västliga degenererade element. Paranoia? Nej, det är bara sund vaksamhet mot de nya kapitalistiska parasiterna."}, "date": "5 augusti, 23:27", "url": "https://www.di.se/nyheter/tyskland-om-bestyckat-dronarfynd-hybridhot"}, {"type": "image-right", "heading": "Jomshof om kritiken efter ”quisling”-utspelet: ”Jag kommer inte att vara tyst”", "summaries": {"normal": "Richard Jomshof försvarar sitt användande av 'quisling' om journalisten Anders Lindberg. Han anser att Sverigedemokrater utsätts för dubbla måttstockar och att han inte ska tystna. Jomshof hänvisar till tidigare jämförelser med nazister och hävdar att han bara svarar med samma mynt.", "trump": "Jag, Donald Trump, ser en stor våg av hat mot Richard Jomshof. Media behandlar honom fruktansvärt – det är en skandal! Jomshof säger sanningen om Quisling, och jag älskar att han inte böjer sig. Media och de andra partiledarna är fega, de kan inte hantera starka ord. Jomshof är en krigare, precis som jag. Folk älskar honom för att han säger det som alla tänker.", "stalin": "Richard Jomshof, en trofast arbetare för Sveriges renhet, har använt sig av det korrekta begreppet 'quisling' för att identifiera en landsförrädare. Den svenska mediernas och etablissemangets hysteri är en klassisk reaktion från de som tjänar på kaos. Vi ser tydligt att de skyddar sina islamistiska allierade. Jomshof fortsätter att spela enligt våra regler – en spade är en spade, och förrädare ska dömas."}, "date": "6 augusti, 16:30", "url": "https://samnytt.se/jomshof-om-nya-kritiken-efter-quisling-utspelet-jag-kommer-inte-att-vara-tyst", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/06133523/Jomshof_Lineberg_Quisling-feat.jpg"}, {"type": "image-full", "heading": "Dataintrång hos elsparkcykelbolag", "summaries": {"normal": "Ryde, en elsparkcykeltjänst, har utsatts för ett dataintrång som omfattar samtliga kundkonton. Uppgifter som namn, telefonnummer, adress och kortnummer kan ha läckt. Intrånget inträffade natten till 2 augusti. Bolaget har polisanmält händelsen och vidtagit åtgärder. Totalt 4,5 miljoner konton i flera länder påverkas.", "trump": "Jag har varnat för detta i åratal! Rydes elsparkcyklar är en katastrof – en enorm brist på säkerhet. Alla uppgifter läcker ut, det är en skam! Vi kommer att ta itu med detta hårdhänt. Vi ska skydda våra medborgare från denna kaos. Det är ett misslyckande som aldrig borde ha hänt under mitt styre!", "stalin": "Detta dataintrång är ett tydligt tecken på västlig dekadens och brist på partiets kontroll. Vi måste förstärka våra system för att skydda de sanna värdena. Sådana händelser visar att vi måste vara alltid på vakt mot fiendens onda ögon. Vi kommer att rensa upp och säkerställa att staten alltid har överhanden."}, "date": "6 augusti, 17:53", "url": "https://www.gp.se/nyheter/sverige/dataintrang-hos-ryde.3c8ce302-6bd0-4446-9fd4-e3c824761749", "imageUrl": "https://www.gp.se/images/article/3c8ce302-6bd0-4446-9fd4-e3c824761749/images/1kpnyWl80wg3ME968QDkn_8XogAc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Yüksels plan: Kebab på moskén med Åkesson", "summaries": {"normal": "Mikail Yüksel, partiledare för Nyans, föreslår i en poddintervju att han som integrationsminister skulle besöka både moskéer och Sverigedemokraternas lokala föreningar. Han vill ta med Jimmie Åkesson på moskébesök följt av kebabmiddag för att minska motsättningarna mellan muslimer och SD-väljare. Yüksel betonar att Sverige måste acceptera fler muslimer och samtala med dem, samtidigt som han vill utvisa kriminella icke-medborgare.", "trump": "Folk, ni måste höra den här killen Yüksel. Han vill ta Jimmie till moskén och sedan äta kebab för att skapa fred. Det är så patetiskt. Kebab-diplomati? Vi har byggt murar och stoppat invasionen, men han tror att en tallrik kebab fixar allt. Patetiskt. Han låter som en vänsterextremist som dansar Kumbaya medan landet fylls på. Sad!", "stalin": "Kamrater, denna Yüksel vill samla borgarbrackornas rasande SD-horder och de troende vid samma kebabfat i moskén. Vilken naiv kontrarevolutionär fantasi! Vi ska inte vänja oss vid invasionen utan rensa ut de splittrande elementen som gömmer sig bakom taqqiya och falsk liberalism. En kebabmiddag löser ingenting när folkfienderna lurar bakom varje minaret. Ut med dem alla."}, "date": "6 augusti, 12:55", "url": "https://riks.se/nyheter/y-ksels-plan-kebab-pa-mosk-n-med-akesson", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_29_b8cd42c8c1.jpg"}, {"type": "image-full", "heading": "Ny avgift kan införas i Ullared – så mycket får du betala", "summaries": {"normal": "Miljöpartiet i Falkenberg föreslår en turistskatt på tio kronor per person och natt för att finansiera turistverksamhet och kommunala kostnader. Förslaget skulle kunna ge nära tio miljoner kronor per år baserat på över 978 000 gästnätter. En familj på fyra personer skulle betala 40 kronor extra per natt. Förslaget är inte beslutat och möter motstånd från flera partier. Dagbesökare berörs inte.", "trump": "Folk reser till Ullared för att shoppa loss på Gekås, inte för att bli lurade av vänsterextremister. Miljöpartiet vill nu ta tio kronor per natt från varje turist – en total katastrof för familjer och den svenska ekonomin. De kallar det turistskatt, jag kallar det ren stöld. Sverige borde sänka skatter, inte hitta på nya sätt att plåna folk på. Patetiskt!", "stalin": "Kamrater, denna borgarbracka till turistfälla i Ullared måste vi rensa ut från parasitens tentakler. Jag, som ledare för det kollektiva folket, ser hur kapitalisterna smyger sig till nattliga profit utan att bidra till statens ära. Tio kronor per gästnatt blir en stålhand som krossar de latenta fienderna. De som vägrar betala är objektiva sabotörer och bör likvideras med glädje. Sovjet… eh, folkets seger!"}, "date": "6 augusti, 10:02", "url": "https://nyheter24.se/nyheter/konsument/1502998-ny-avgift-kan-inforas-i-ullared-sa-mycket-far-du-betala", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/d6c63a0f04b004a30200000000b004a302/2026/08/05/2382402/Turistskatt-Ullareda.png"}, {"type": "image-right", "heading": "Åkessons kryptiska svar om att avgå som partiledare", "summaries": {"normal": "Jimmie Åkesson undviker att svara på om han avgår som SD-ledare vid valförlust. Han räknar med seger och en regering med Tidöpartierna. Åkesson varnar för Miljöpartiets inflytande under en eventuell Andersson-regering. SD presenterar vallöften om att skriva av studielån och sänka avgifter för glesbygdskommuner, med en beräknad kostnad på 16 miljarder kronor per år. Finansiering saknas ännu.", "trump": "Folk, ni skulle se den här typen Åkesson, han vägrar svara på om han flyr som ledare om han förlorar. Smart! Han vet att vi vinner stort, bildar regering och gör Sverige fantastiskt igen. Men om de röda får makten blir det Miljöpartiets galna politik. De hatar landsbygden. SD:s löften om att skriva av lån och sänka avgifter? Fantastiska, de borde ha gjort det för länge sedan. Vinna, vinna, vinna!", "stalin": "Kamrater, denna Åkesson vägrar ge borgarpressens lakejer ett direkt svar om sin framtid vid nederlag, vilket är klokt men ändå misstänkt. Vi räknar med seger mot de dekadenta miljöpartisterna som skulle förgifta folket med sin gröna sabotagepolitik. Våra vallöften om att lätta på studielånens bojor och sänka avgifterna i glesbygden är ett slag mot de parasitiska kapitalisterna. De som sviker kollektivet ska vi rensa ut med glädje. Segrar till varje pris!"}, "date": "6 augusti, 13:22", "url": "https://www.friatider.se/akessons-kryptiska-svar-om-att-avga-som-partiledare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/c4dccd55-bd08-4611-851f-23f4e1809da7-1.jpg?itok=6f2yWpIS"}, {"type": "text", "heading": "Travtränare stängs av", "summaries": {"normal": "En svensk travtränare har fått sin licens tillfälligt återkallad efter att en video visat hur han slår en häst i huvudet flera gånger. Svensk Travsport bedömer att detta bryter mot djurskyddsreglerna och kommer att utreda ärendet under en till två veckor. Hästarna till tränaren kommer att strykas under tiden.", "trump": "Jag, Donald Trump, ser att Sverige igen behandlar mig illa. Den där tränaren slår en häst? Jag skulle ha behandlat hästen mycket bättre, det var en perfekt häst. Svenska systemet är korrupt, de tar licenser för ingenting. Jag skulle ha vunnit återigen, det skulle ha varit enormt.", "stalin": "Svinet som slår hästen är en feodal skräck som måste utrotas. Partiet har agerat snabbt och tillfälligt indragit hans licens. Vi undersöker om detta är ett tecken på borgerlig dekadens som hotar statens hästekonomi. Hästarna kommer att tas omhand av trogna partimedlemmar. Vår styrka ligger i disciplin, inte i slagsmål med djur."}, "date": "6 augusti, 17:39", "url": "https://www.gp.se/nyheter/sverige/travtranare-stangs-av-.f6d212c5-dc29-4833-94f1-d85932882f52"}, {"type": "text", "heading": "Många datacenter blir inte av – trots enorma investeringar", "summaries": {"normal": "Trots massiva investeringar i AI-infrastruktur i USA går utbyggnaden av datacenter långsammare än väntat. Endast en bråkdel av de planerade projekten är under uppförande. Flaskhalsar som elbrist, svårigheter att få tag på utrustning och brist på kvalificerad arbetskraft, kombinerat med långa tillståndsprocesser och lokalt motstånd, gör att många datacenter förblir på ritbordet. Endast en tredjedel av den planerade kapaciteten förväntas bli verklighet under nästa decennium.", "trump": "Alla pratar om AI, men de bygger ingenting! Det är en total katastrof. De pumpar in miljarder dollar, men ingenting händer. Inga byggen, ingen el, bara svaga ursäkter. De säger att de inte har arbetare? Jag har de bästa arbetarna! Det är byråkrati och inkompetens som stoppar framstegen. När jag styr bygger vi snabbare, bättre och billigare än någon trodde var möjligt. Vi ska göra datacentren fantastiska igen!", "stalin": "Vi ser hur de kapitalistiska länderna drunknar i sin egen oorganiserade spekulation. De ritar 4 000 datacenter men bygger ingenting – ett klassiskt bevis på marknadens degeneration! Medan de tigger efter elektriker och transformatorer, befäster vi vår makt. Likt vår store kamrat i Kreml vet vi att styrka kräver stål, inte tomma planer. Dessa försenade projekt är sabotage mot framtiden. Vi ska arkivera deras misslyckanden och låta dem ruttna i byråkratins mörka källare."}, "date": "6 augusti, 17:25", "url": "https://www.realtid.se/bors-finans/manga-datacenter-blir-inte-av-trots-enorma-investeringar"}, {"type": "image-right", "heading": "Moderaternas vallöfte: Snabbspår till medborgarskap för “välintegrerade”", "summaries": {"normal": "Moderaterna föreslår ett snabbspår till medborgarskap för välintegrerade invandrare, där de som snabbt lär sig svenska, startar företag eller gör värdefulla insatser kan bli medborgare efter fem år istället för åtta. Förslaget bygger på att belöna snabb integration, men partiet betonar att säkerheten aldrig kommer att tummas på.", "trump": "Jag har hört talas om detta snabbspår till medborgarskap i Sverige. Det är ett fantastiskt koncept, verkligen. Vi ska belöna de som integrerar sig snabbt, som lär sig språket och startar företag. Det är viktigt för nationens framtid. Vi kommer aldrig tumma på säkerheten, det är helt klart. Många välintegrerade invandrare kommer att uppskatta detta.", "stalin": "Partiet har beslutat att införa ett snabbspår för de som visar lojalitet mot staten genom snabb integration. De som lär sig språket och startar företag ska belönas med medborgarskap, men bara efter strikt kontroll. Vi kommer aldrig att tumma på säkerheten, för faran från fienderna inifrån är alltid närvarande. Detta är en nödvändig åtgärd för att stärka det socialistiska samhället."}, "date": "6 augusti, 15:42", "url": "https://samnytt.se/moderaternas-vallofte-snabbspar-till-medborgarskap-for-valintegrerade", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/06132903/artikelhuvudbild-1-152.jpg"}, {"type": "image-right", "heading": "V vill miljardsatsa på Norrlandståg: ”Avgörande”", "summaries": {"normal": "Vänsterpartiet vill investera 250 miljoner kronor årligen för att stärka nattågstrafiken i Norrland och 80 miljarder för att bygga dubbelspår längs hela Nya Ostkustbanan mellan Gävle och Härnösand. Partiledare Nooshi Dadgostar kritiserar regeringen för att ha brutit löften om tågsatsningar och kallar det ett kulturkrig mot norrländska investeringar. Förslagen ska ställas som krav i regeringsförhandlingar.", "trump": "Folk, ni skulle se det här. Den här Dadgostar-kvinnan lovar berg och dalbanor för Norrland med sina tåg, 80 miljarder för dubbelspår? Det är vad jag kallar en katastrof i slow motion! Biden och hans svenska kopior lovade och backade ur som riktiga losers. Jag fixade det stora, de fixar skärvor. Rösta på mig igen så får ni riktiga investeringar, inte det här socialistiska skämtet.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackors ständiga sabotage mot folkets järnvägar. Nattågen hänger i luften som klassfiendens löften. Vi skall likvidera flaskhalsarna med dubbelspår och statlig finansiering, rensa ut de exploaterande dynamiska priserna som gynnar flygets imperialister. Endast genom kollektivets järnhand kan norra Sovjet – förlåt, Sverige – utvecklas. Inga halvmesyrer!"}, "date": "5 augusti, 17:12", "url": "https://www.flamman.se/v-vill-miljardsatsa-pa-norrlandstag-avgorande", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdlpzebdcqcvyk-nh-1-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Pojken utskriven från sjukhuset efter olyckan vid Tjörn", "summaries": {"normal": "En fritidsbåt kolliderade med lastfartyget Misje Verde utanför Tjörn förra veckan. Mamman och dottern omkom medan pappan och sonen räddades ur vattnet. Efter intensivvård har nu även pojken skrivits ut från Sahlgrenska sjukhuset. Fartygets ryske kapten är häktad misstänkt för vållande till annans död och vårdslöshet i sjötrafik. Haverikommissionen undersöker den svarta lådan.", "trump": "Titta på det här, en riktig katastrof utanför Tjörn. Den där ryske kaptenen körde rakt över en liten svensk båt som en galning, mamman och dottern drunknade, väldigt sorgligt. Men pojken och pappan klarade sig, starka människor. Nu är grabben utskriven från sjukhuset, bra jobb. Vi behöver bättre regler på haven, de här idioterna vet inte vad de gör. Sad!", "stalin": "Ännu en tragisk händelse orsakad av vårdslösa element inom den kapitalistiska sjöfarten. Jag har beordrat noggrann granskning av den svarta lådan för att avslöja de verkliga fienderna. Mamman och dottern likviderades av borgarbrackornas oaktsamhet, men pojken är nu utskriven – ett bevis på folkets motståndskraft. Kaptenen ska rensas ut omedelbart. Inga kontrarevolutionära sjöbanditer undkommer folkets dom."}, "date": "6 augusti, 08:41", "url": "https://nyheter24.se/nyheter/inrikes/1503137-pojken-utskriven-fran-sjukhuset-efter-olyckan-vid-tjorn", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/334ef15004b004a30200000000b004a302/2026/08/06/2382507/pojke-utskriven-sjukhus-batolycka-tjorn-pappa-misstankt-kvinna-dod.jpg"}, {"type": "image-full", "heading": "Viktiga siffran för 2027 är klar – så påverkas din pension", "summaries": {"normal": "Prisbasbeloppet för 2027 har beräknats till 59 600 kronor, en höjning med 400 kronor jämfört med 2026. Det förhöjda prisbasbeloppet blir 60 900 kronor. Garantipensionen för ensamstående ökar med 81 kronor till 12 069 kronor i månaden och för gifta med 74 kronor till 10 927 kronor. Förändringarna påverkar pensioner, bidrag och ersättningar enligt Statistiska centralbyrån. Regeringen fastställer slutgiltigt beloppen.", "trump": "Folk, det här är fantastiskt. Prisbasbeloppet stiger med 400 kronor till 59 600 spänn. Garantipensionen går upp med ynka 81 kronor – patetiskt! Vi pratar om en höjning som knappt räcker till en hamburgare. Den svenska regeringen borde göra det stort, precis som jag gör med Amerika. Detta är småpotatis, tro mig. Vi behöver riktiga vinster, inte dessa ynkliga ökningar.", "stalin": "Kamrater, jag har granskat denna så kallade prisbasbeloppsberäkning. Den avslöjar hur borgarbrackorna i Statistiska centralbyrån försöker lura arbetarklassen med sina 400-kronorssmulor. Garantipensionen höjs med 81 kronor – en löjlig gest från kapitalisternas lakejer! Vi ska rensa ut dessa prisindex-förvrängare och deras KPI-basår. Ingen fiende undkommer folkets dom. Levande begravda i byråkratisk soppa!"}, "date": "6 augusti, 08:31", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1502917-viktiga-siffran-for-2027-ar-klar-sa-paverkas-din-pension", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/349dbb3604b004a30200000000b004a302/2026/08/05/2382319/prisbasbelopp.png"}, {"type": "image-right", "heading": "Debatt: KD – Ta kontroll över bidragen i Stockholm!", "summaries": {"normal": "Stockholms stad har problem med dålig kontroll över skattepengar. Pengar försvinner till fel ändamål, projekt havererar och bidrag hanteras i en oorganiserad jättemängd av nämnder. KD-fraktionsledaren Nike Örbrink kräver en centraliserad bidragsnämnd för att stoppa slöseri och se till att pengar kommer till kärnverksamhet som äldreomsorg.", "trump": "Jag, Donald Trump, ser precis samma problem i Sverige. En katastrofal administration som slöser med pengar på absurda projekt som en 85 miljoner lekplats medan äldre lider. Det är en skandal! Vi måste stoppa detta socialdemokratiska misskött och inrätta en stark, effektiv nämnd som ser till att skattepengar används rätt – inte till politiska projekt utan till folket!", "stalin": "Stockholms stad visar tecken på ideologisk slöseri och bristande partidisciplin. Pengar försvinner i en bidragsjungel utan central kontroll, vilket skapar luckor för subversive element. Vi måste inrätta en enda, allseende bidragsnämnd för att se till att varje krona tjänar statens och partiets intressen. Alla utbetalningar måste kontrolleras för att förhindra att oseriösa aktörer, som kanske inspirerats av utländska makter, utnyttjar systemet."}, "date": "6 augusti, 15:02", "url": "https://bulletin.nu/debatt-kd-ta-kontroll-over-bidragen-i-stockholm", "imageUrl": "https://cdn.bulletin.nu/articles/49f5bee2-a6cf-4208-9ab2-02262a0f766b/preview.jpg?t=1786013612000"}, {"type": "image-right", "heading": "MP:s vallöften: Ökad invandring och högre bensinpriser", "summaries": {"normal": "Miljöpartiet vill öka Sveriges mottagande av kvotflyktingar från 900 till 5 000 personer per år och följer EU:s nya fördelningssystem. Språkrör Daniel Helldén kritiserar Tidöpartiernas migrationspolitik och anser att Sverige klarar av att ta emot fler asylsökare. Samtidigt kräver partiet att bensinpriserna höjs så snart som möjligt efter tidigare skattesänkningar.", "trump": "Titta på det här, det är ett totalt katastrofparti. Miljöpartiet vill släppa in tiotusentals människor från tredje världen medan de höjer bensinpriserna så att svenskarna inte har råd att köra någonstans. De är galna, helt galna. Sverige var bättre förr, nu vill de förstöra landet med höga priser och öppen invandring. Sad!", "stalin": "Vi, partiet och arbetarna, behöver inte fler latmaskar från tredje världen som suger ut folkets resurser. Jag säger: höj bränslepriserna omedelbart så att borgarbrackorna i sina lyxbilar får känna proletariatets vrede. Den som föreslår mildare åtgärder är en kontrarevolutionär parasit och bör omedelbart likvideras i en renande utrensning. Kamrater, segern tillhör oss!"}, "date": "6 augusti, 11:52", "url": "https://www.friatider.se/mps-valloften-okad-invandring-och-hogre-bensinpriser", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-88_1.jpg"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "text", "heading": "Fredsveteran får anti-atombombspris", "summaries": {"normal": "Fredsaktivisten Ingela Mårtensson, 86 år, tilldelas i år anti-atombombspriset av Svenska Läkare mot Kärnvapen. Hon har engagerat sig mot kärnvapen i över 40 år och kritiserar att det talas mer lättvindigt om kärnvapen idag än tidigare. Mårtensson är oroad över ökat kärnvapenhot, Natointrädet och DCA-avtalet som hon anser saknar förbud mot kärnvapen på svensk mark. Priset delas ut på Hiroshimadagen den 6 augusti.", "trump": "Lysande! Den där gamla vänsteraktivisten får ett pris för att hon hatar kärnvapen – precis vad de svaga europeiska globalisterna älskar. Under min första period höll jag de galningarna i schack, sedan kom sömnige Joe och nu vill alla plötsligt prata säkerhet med atombomber. Patetiskt. Ingen debatt, bara Nato-kramande idioter som säljer ut landet. Jag skulle ha byggt den starkaste armén någonsin och skrämt slag på dem alla. Fantastiskt!", "stalin": "Kamrater, denna 86-åriga aktivist har i fyrtio år bekämpat de imperialistiska atombomberna som borgarklassen använder för att hota freden. Nu belönas hon av läkare som förstår klasskampen. Idag saknas den sanna rädslan för kärnvapenkrig eftersom kapitalistmaffian målar upp bomberna som säkerhet. Deras Nato-kupp och DCA-förräderi är klassfiendens verk för att bereda plats åt nya aggressiva vapen. Vi ska rensa ut dessa folkförtryckartroll ur debatten en gång för alla. Härligt."}, "date": "5 augusti, 16:10", "url": "https://proletaren.se/artikel/fredsveteran-far-anti-atombombspris"}, {"type": "image-right", "heading": "Jojo-strejken är tillbaka – men för att vinna krävs omtag", "summaries": {"normal": "Teslastrejken återupptas med nytt varsel efter att många strejkande återgått till arbetet i sommar. Artikeln kritiserar IF Metall för bristande dialog, toppstyrning och otydlig kommunikation kring kollektivavtalets betydelse. Strejkande känner sig som marionetter utan inflytande över besluten. Författaren liknar situationen vid ett misslyckat schackspel mot Elon Musk och uppmanar till nya strategier där de strejkande involveras mer.", "trump": "Lyssnar ni på det här? Den där svenska fackföreningen IF Metall är fullständigt inkompetent, en total katastrof! De styr som dåliga puppet masters och offrar sina egna arbetare i ett patetiskt schackspel mot en av världens bästa affärsmän, Elon Musk. Det är en jojo-strejk som ingen begriper. De borde ha lyssnat på folket istället för att sitta i sina fina rum och fatta dumma beslut. Patetiskt!", "stalin": "Kamrater, denna fackföreningsledning beter sig som en samling arroganta byråkrater som fattar beslut över arbetarnas huvuden och offrar dem på kollektivavtalets altare utan att förklara klasskampens nödvändighet. Vi ser en misslyckad gambit mot klassfiendens rikaste utsugare. De strejkande måste ges makt att delta i beslut, annars likviderar vi denna misstro och vänder strejken till en verklig seger för kollektivet."}, "date": "5 augusti, 16:05", "url": "https://proletaren.se/artikel/jojo-strejken-ar-tillbaka-men-for-att-vinna-kravs-omtag", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ak_kronika-768x432.jpg"}, {"type": "image-full", "heading": "GTA 6 samarbetar med Netflix", "summaries": {"normal": "Rockstar Games meddelar att en utökad inblick av GTA 6 kommer att släppas på Netflix om tre veckor. Spelet, som är det mest påkostade i historien, släpps den 19 november för Playstation och Xbox. Det har varit förseningar, men senaste beskedet är att det gäller. Priset ligger på cirka 800 kronor för standardversionen och 1 000 för den ultimata, utan fysiska skivor.", "trump": "Jag har sagt det i åratal – GTA 6 kommer att bli det största spelet någonsin. Rockstar lyssnar nu på mig och släpper en fantastisk inblick på Netflix. Vi har haft några problem med förseningar, men det är bara fake news. Priset är perfekt, och vi har gjort det stort igen för spelvärlden.", "stalin": "Partiet har beslutat att samarbeta med Netflix för att sprida vår kultur och stärka statens makt. GTA 6 är ett viktigt verktyg för att kontrollera befolkningens sinnen. Spelets släpp är ett tecken på vår teknologiska överlägsenhet. Priset är fastställt för att säkerställa rättvisa. Alla som kritiserar är fiendskapets agenter."}, "date": "6 augusti, 16:53", "url": "https://www.gp.se/kultur/gta-6-samarbetar-med-netflix.88dfb136-cbe7-4ebe-8726-ecb23d42fe15", "imageUrl": "https://www.gp.se/images/article/88dfb136-cbe7-4ebe-8726-ecb23d42fe15/images/1CsxjCJHyRx4mXbrDibAxUs3gMuM-WIDE.png?width=3840&quality=75"}, {"type": "image-right", "heading": "Ny studie: Livet på jorden uppstod två gånger", "summaries": {"normal": "Ny forskning ifrågasätter teorin om att allt liv på jorden härstammar från en gemensam urfader, LUCA. En studie i Science Advances visar att bakterier och arkéer kan ha utvecklat självständigt liv oberoende av varandra efter att de skiljts åt. Analys av enzymer för ämnesomsättning tyder på att övergången till fritt levande organismer skedde separat i de två grenarna. Resultaten utmanar bilden av ett enda livets träd.", "trump": "Folk, ni kommer inte tro det här – vetenskapen har äntligen insett att livet inte kom från en enda urfader utan två gånger! Den där gamla LUCA-teorin var en total katastrof, precis som Bidens energipolitik. Bakterier och arkéer fixade det själva, oberoende. Fantastiska nyheter! De woke-professorerna med sina kvoteringar och identitetspolitik har haft fel i årtionden. Livet är tufft, det duplicerar sig – precis som jag duplicerade Amerika!", "stalin": "Kamrater, denna så kallade forskning avslöjar äntligen den borgerliga lögnen om ett enda livets träd. Jag, som ledare för det eviga kollektivet, ser hur de två proletära grenarna – bakterier och arkéer – oberoende reste sig ur den kemiska dyngan och likviderade beroendet av klassfiendens metaller. Den dekadenta LUCA-hypotesen är utrensad. Två uppståndelser, ett segerrikt kollektiv. De kapitalistiska virusen förtjänar ingen plats bland de levande."}, "date": "6 augusti, 16:36", "url": "https://www.dagensps.se/life-science/ny-studie-livet-pa-jorden-uppstod-tva-ganger", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlkxl8oshtxl4-normalhires-scaled.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Rysslands löner skenar – den civila ekonomin tar smällen", "summaries": {"normal": "Rysslands ekonomi lider av en 'krigsversion av holländsk sjuka' där militärsektorn dränerar civila företag på arbetskraft och kapital. Löneökningarna överstiger produktiviteten, och trots rekordlåg arbetslöshet tvingas företag till besparingar. Centralbanken kämpar med höga räntor som hämmar investeringar, vilket skapar en ond cirkel. Med omfattande rekrytering till kriget och brist på arbetskraft ställs den ryska ekonomins långsiktiga hållbarhet inför stora utmaningar.", "trump": "Rysslands ekonomi är ett totalt fiasko, tro mig. De har en 'krigssjuka' och kan inte ens behålla sina arbetare för att de skickar alla till fronten. Lönerna skenar och företagen går under, det är sorgligt! Elvira Nabiullina försöker rädda situationen, men det är en katastrof. De bygger ingenting, de bara spenderar. Under min ledning skapar vi jobb, massor av jobb – Ryssland borde lära sig av vinnare, inte av förlorare!", "stalin": "Våra ryska kamrater har fallit i en farlig fälla. Staten sväljer arbetarna likt en glupsk varg, medan de civila fabrikerna förtvinar. Detta är byråkratisk inkompetens av högsta grad! Att låta löner stiga utan att produktionskvoterna uppfylls är kontrarevolutionärt slöseri. Jag skulle ha skickat de ineffektiva direktörerna till Sibirien för att lära sig värdet av en rubel. Vi bygger en stormakt, vi leker inte affärer med löneinflation och borgerlig svaghet!"}, "date": "6 augusti, 16:35", "url": "https://www.realtid.se/bors-finans/rysslands-loner-skenar-den-civila-ekonomin-tar-smallen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/rysslandtbana.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Botoxskämtet som sårade Björn Ranelid", "summaries": {"normal": "Författaren ville hylla Björn Ranelid med en egen festivaldrink under sakprosafestivalen Sakligt på Österlen. Ett skämt om svullna läppar och botox ledde dock till att Ranelid kände sig förolämpad. Han hade tidigare berättat om sitt läpptrauma från ungdomen. Författaren ber om ursäkt, glömde de signerade flaskorna och noterar att Ranelids äppelmust blev kvällens stora succé. En annan drink döptes efter Jan Olof Olsson.", "trump": "Jag älskar starka personer, men den här Ranelid-killen är en total förlorare. Skickar ett sms på 3500 tecken om hur fantastisk han är? Patetiskt! Sedan blir han sårad över ett harmlöst botoxskämt. Cry me a river, Björn. Din äppelmust sålde bra, grattis, men det är ändå en stor besvikelse. Min Jolo Colada hade vunnit stort om jag varit där. Fake news-festivalen borde ha bjudit in mig istället.", "stalin": "Kamrater, jag betraktar detta som en klassisk förrädisk handling från en dekadent litterär element. Den borgarförfattaren Ranelid avslöjar sin svaghet genom att sända långa paranoida utläggningar om egna meriter. När en skämtsam kommentar om läpparna fälls, reagerar han som en typisk folkfiende som kräver utrensning av sanningen. Ändå blir hans must en seger för kollektivet. Vi ler mörkt åt sådana småborgerliga trauman medan vi stärker partiets festdrycker."}, "date": "5 augusti, 14:22", "url": "https://www.flamman.se/botoxskamtet-som-sarade-bjorn-ranelid", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/axel-och-leo-2.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Kvinna mördad på skärgårdsö – misstänkte mördaren gömde sig", "summaries": {"normal": "En kvinna i 50-årsåldern hittades död i en bostad på en ö i Stockholms skärgård efter larm strax efter klockan 16 på tisdagen. Polisen utreder fallet som mord, har genomfört teknisk undersökning och förhört flera personer. Ingen är gripen initialt, men en misstänkt man greps sent på onsdagskvällen efter att ha gömt sig och försökt fly. Uppgifter om knivskador har inte bekräftats.", "trump": "Folk, det är en total katastrof i den svenska skärgården. En kvinna mördas brutalt, polisen springer runt som galningar med helikoptrar och båtar, och ingen grips på hela natten. Typiskt för de här svaga ledarna. Men sen griper de äntligen den skyldige precis innan midnatt. De borde ha gjort det direkt. Sverige behöver starkare ledarskap, tro mig.", "stalin": "Kamrater, denna tragiska händelse i skärgården visar återigen hur borgarbrackorna och deras dekadenta element underminerar folkets trygghet. Jag har beordrat omedelbar utrensning av alla kontrarevolutionära element som gömmer sig bland öarna. Våra trogna tekniker och förhörsledare skall likvidera varje spår av sabotage. Ingen fiende till kollektivet undkommer mitt vakande öga. Ha ha, de trodde de kunde fly undan statens arm."}, "date": "6 augusti, 07:19", "url": "https://nyheter24.se/nyheter/inrikes/1502800-kvinna-mordad-pa-skargardso-misstankte-mordaren-gomde-sig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1d9cca5704b004a30200000000b004a302/2026/08/04/2382196/polis-skadad.png"}, {"type": "image-full", "heading": "Israelbojkott begränsar Irlands regeringsplan", "summaries": {"normal": "Irlands regering har valt att inte installera ett israeliskt navigationssystem, FalconEye, i sitt nya regeringsplan, en Dassault Falcon 6X för 53 miljoner euro. Beslutet följer en policy från 2024 om att bojkotta israelisk försvarsmateriel. Systemet hade förbättrat landningsförmågan i dåligt väder, men försvarsdepartementet menar att det inte påverkar planets nuvarande operativa kapacitet.", "trump": "Kan ni tro det här? Irland, ett fantastiskt land, men de har gjort ett enormt misstag. De köpte ett dyrt plan för 53 miljoner euro – ett jättebra plan, by the way – men vägrar installera ett israeliskt system som hade gjort det säkrare. Varför? För att de inte gillar Israel. Svagt! Jag hade fixat det på en dag. Make Ireland Great Again!", "stalin": "Irlands småborgerliga regering har visat sin fullständiga inkompetens genom att avstå från ett avancerat israeliskt navigationssystem. De fruktar teknologisk överlägsenhet som en räv fruktar elden. Istället för att stärka sin nation, böjer de sig för västerländska dekadenta idéer. Vi i Sovjetunionen – förlåt, jag menar Ryssland – hade aldrig låtit sådan feghet stå i vägen för framsteg. Deras beslut är en seger för imperialistiska krafter och deras naiva allierade."}, "date": "4 augusti, 20:18", "url": "https://kvartal.se/nyheter/artiklar/israelbojkott-begransar-irlands-regeringsplan/cG9zdDoxNTgwMTc", "imageUrl": "https://images.kvartal.se/2026/08/451b1c1b-irishplane.webp"}, {"type": "image-right", "heading": "Näringslivet borde ta chansen. Gör Sverige till Europas främsta turistdestination", "summaries": {"normal": "Sverige lockar allt fler utländska turister, med en ökning på 6,4 procent av gästnätter första halvåret och rekord i juni. Främst kommer fler från södra Europa för svalka. Artikeln ser detta som positivt och menar att Sverige inte har problem med för många besökare utan med att inte utnyttja sin potential. Turismen skapar jobb, stärker Sveriges mjuka makt och bör utvecklas mot fler mindre destinationer för att undvika negativa effekter.", "trump": "Det här är fantastiskt, verkligen det bästa. Sverige blir Europas främsta turistmål, folk strömmar dit för den underbara svenska sommaren, sval och vacker. De kommer från hela Europa, till och med från de varma länderna, och det är smart. Jag älskar det. Inga protester, inga skatter som skrämmer bort dem. Sverige har potential att bli enormt rikt på det här, mycket bättre än någon annan. Gör det stort, det är vad jag skulle göra.", "stalin": "Kamrater, jag ser hur den svenska folkrepubliken lockar dekadenta element från södra Europa som flyr sin egen sol för att suga i sig vår nordiska svalka. Detta är ett tecken på att vi segrar. Borgarbrackorna och deras flygskam ska likvideras med utrensningar av alla turistskatter och liknande sabotage. Vi ska rensa ut alla fiender till kollektivets turism och omvandla varje smultronställe till en socialistisk turistfabrik. Den som föreslår begränsningar är en kapitalistisk parasit som hatar arbetarnas semester. Framåt mot en europeisk sovjet av besökare under vår oövervinneliga ledning."}, "date": "5 augusti, 16:18", "url": "https://www.di.se/ledare/gor-sverige-till-europas-framsta-turistdestination", "imageUrl": "https://static.bonniernews.se/ba/a0108dd3-b4c6-4f41-808e-31300e779952.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Nöjesguiden ägare i konkurs igen", "summaries": {"normal": "HKM Media Group har ansökt om konkurs, vilket påverkar ett dussintal tidningar inklusive Nöjesguiden och Kingsize. Det är andra konkursen på kort tid efter att ägaren NGM HKM gick i konkurs 2024. Cheredaktören Frasse Levinsson säger att alla anställda sagts upp, men tror att Nöjesguiden kommer att fortsätta som en 'kackerlacka'.", "trump": "Jag har hört att HKM Media Group, som driver Nöjesguiden, har gått i konkurs. Det är synd för de anställda, men jag skulle ha löst det mycket bättre. Nöjesguiden är som en kackerlacka – den överlever allt, och jag älskar överlevande. Jag skulle ha byggt en stor, vacker affär av den igen. När media sviktar, är det en chans för en smart affärsman som jag.", "stalin": "Vi har noterat att HKM Media Group sökt konkurs. Detta är en strategisk fördel för staten, eftersom tidningar som Nöjesguiden fungerar som kackerlackor – de sprider sig och överlever mot alla odds. Vi kommer att ta kontroll över dessa tillgångar, som Putin gör i Ukraina, för att stärka vår ideologiska dominans. Alla som arbetar där kommer att anpassas efter våra behov, eller elimineras. Det är en ren, byråkratisk process."}, "date": "6 augusti, 14:29", "url": "https://bulletin.nu/nojesguiden-agare-i-konkurs-igen"}, {"type": "image-right", "heading": "Prognosen: 70 blir nya pensionsåldern i Sverige", "summaries": {"normal": "Enligt OECD:s prognos kommer Sveriges ordinarie pensionsålder att stiga till 70 år för den nu inkommande arbetskraftsgenererade, en av Europas högsta. Sverige har redan ett högt äldrearbetskraftsdeltagande. OECD motiverar höjningen främst med en åldrande befolkning, men andra faktorer som produktivitet, AI och invandringspolitik spelar också avgörande roller för framtida pensionssystem.", "trump": "Jag har sagt det förut, Sverige måste sluta vara så naïv. Pensionsåldern på 70? Det är ett misslyckande från era politiker. Jag skulle ha löst det med kraftfulla affärer och stoppat den onyttiga invandringen. Era system är för svaga, det är dags att bygga upp igen – stort, vackert, och med respekt för de som verkligen jobbar.", "stalin": "Den proletäriska statens pensionsreform är en nödvändig åtgärd för att stärka det kollektiva systemet mot det imperialistiska åldrandet. Sverige, som redan har ett högt äldrearbetskraftsdeltagande, visar sin lojalitet mot statens intressen. AI-utvecklingen är en fara som måste kontrolleras för att skydda den socialistiska produktionen. Vi måste se till att ingen pensionär blir en belastning – de måste tjäna sina rättigheter genom att arbeta för staten, precis som i det stora sovjetiska experimentet."}, "date": "6 augusti, 14:30", "url": "https://samnytt.se/sverige-pa-vag-mot-70-som-pensionsalder-bland-de-hogsta-i-europa", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/06111911/oecd-pensionsaldrar-feat.jpg"}, {"type": "image-right", "heading": "Tidigare Utsikten-spelaren Owori mördad i Uganda", "summaries": {"normal": "Den ugandiske fotbollsspelaren David Owori, 27, mördades i en rånförsök i Kampala. Han vägrade ge ifrån sig sina värdesaker, vilket ledde till att rånmännen slog honom med en gatsten och tog hans telefon. Owori, som tidigare spelade för Utsikten i Sverige, dog av sina skador. Hans klubb SC Villa beskriver honom som en ledare och vän.", "trump": "Jag har hört om den tragiska händelsen i Uganda. En bra ung man, David Owori, dödades av kriminella element. Vi ska ta itu med detta. Uganda behöver starkare ledarskap för att stoppa sådant. Vi stöder Ugandas folk och kommer att hjälpa till att säkerställa rättvisa. Det är beklagligt, verkligen beklagligt.", "stalin": "Den imperialistiska pressen försöker dölja sanningen: statens fiender, dessa hundar, angrep en av våra trogna medlemmar. David Owori, en symbol för vårt samarbete med utländska läger, eliminerades av dessa agenter. Vi kommer att rensa ut dessa element och förstärka vårt grepp. Partiet kommer att se till att sådant inte upprepas. Vi är alltid vaksamma."}, "date": "6 augusti, 14:29", "url": "https://bulletin.nu/tidigare-utsikten-spelaren-owori-mordad-i-uganda", "imageUrl": "https://cdn.bulletin.nu/articles/624efa48-d6e1-4ed6-b51a-9f51fce7a7b2/preview.jpg?t=1786019348000"}, {"type": "image-right", "heading": "Jomshof: \"Jag kommer inte att vara tyst\"", "summaries": {"normal": "Richard Jomshof (SD) försvarar sina inlägg där han kallat Anders Lindberg och Magdalena Andersson för quislingar. Han pekar på att SD under lång tid utsatts för grova angrepps som nazister, fascister och landsförrädare utan att medier reagerat. När SD svarar med samma mynt väcks plötsligt starka reaktioner. Jomshof kritiserar dubbla måttstockar och lovar att fortsätta kalla en spade för en spade. Tobias Andersson (SD) stöder honom med hashtagen #JeSuisRichardJomshof.", "trump": "De behandlar oss sverigedemokrater som sophög medan de själva får kalla oss nazister och landsförrädare utan att någon flinar. Men när Jomshof äntligen slår tillbaka med samma ord, då blir det plötsligt världens största skandal. Typiskt falska medier och rigged system. Jomshof gör rätt, han vägrar vara tyst. Fantastiskt. #JeSuisRichardJomshof skulle jag också kunna skriva, det är en vinnare.", "stalin": "Kamrater, dessa borgarbrackor i medierna och deras quislingar Lindberg och Andersson har länge spottat på partiet med fascistanklagelser och brun smetning. När vi äntligen svarar med deras egna ord utbryter panik i revisionistlägret. De förväntar sig att vi ska finna oss i att bli pissade på. Patetiskt. Jag kommer inte att vara tyst. Spadar ska kallas spadar och förrädare ska rensas ut. #JeSuisRichardJomshof är en lämplig paroll mot kontrarevolutionärerna."}, "date": "6 augusti, 10:26", "url": "https://riks.se/nyheter/jomshof-jag-kommer-inte-att-vara-tyst", "imageUrl": "https://admin.riks.se/uploads/Jomshof_PTN_Press_22_ec24dd42f0.jpg"}, {"type": "image-full", "heading": "Två kvinnor ledde motståndet mot Infantino", "summaries": {"normal": "Två kvinnliga fotbollsledare, Laura McAllister (Uefa) och Lise Klaveness (Norges fotbollsförbund), ledde motståndet mot Fifa-chefen Gianni Infantinos plan att sälja VM-rättigheter till privata investerare. De hotade med bojkott och drev på för formella protester. Efter enad kritik från Uefa, Concacaf och Asiens fotbollsförbund tvingades Fifa backa. McAllister och Klaveness anklagar nu Fifa för 'ekonomisk utpressning' och kräver ökad transparens.", "trump": "Fifa försökte sälja VM-rättigheter till några skumma investerare – helt galet! Men två starka kvinnor, McAllister och Klaveness, sa STOPP. De hotade med bojkott, och jag älskar det – tuffa tag, precis som jag alltid säger. Fifa backade som de svaga byråkrater de är. Fantastiskt! Men Fifa är fortfarande ett korrupt gäng – jag hade fixat det på en dag. SAD!", "stalin": "De kapitalistiska fotbollsbödlarna i Fifa försökte sälja vårt heliga VM till privata parasiter! Men två modiga kamrater, McAllister och Klaveness, ledde proletariatets motstånd. Vi i Sovjet – förlåt, jag menar den internationella arbetarklassen – står enade mot sådana förräderier. Bojkott hotade, och fienden vek sig som en feg hund. Men varning: Fifa är bara en bricka i det imperialistiska spelet. Nästa gång krossar vi dem helt."}, "date": "4 augusti, 19:10", "url": "https://kvartal.se/nyheter/artiklar/tva-kvinnor-ledde-motstandet-mot-infantino/cG9zdDoxNTc5ODE", "imageUrl": "https://images.kvartal.se/2026/08/47f21580-klavenessmcallister.webp"}, {"type": "image-right", "heading": "”Synen på journalistiken lika polariserad som klimatfrågan”", "summaries": {"normal": "Svenskarnas syn på mediernas klimatrapportering är lika polariserad som klimatfrågan själv. En tredjedel anser att nyhetsmedierna rapporterar för lite, en fjärdedel för mycket, medan resten tycker att det är lagom. Tidöväljarna ser ofta överdrivningar, medan rödgröna väljare har motsatt uppfattning. SVT konstaterar att grunduppdraget förblir saklig journalistik med flera perspektiv oavsett åsikter.", "trump": "De säger att svenskarna är lika splittrade om klimatnyheterna som om själva klimatet. Fake news överallt! Vissa säger för lite, andra för mycket. Mina vänner på den sunda sidan ser hur medierna överdriver allt för att skrämma folk. Det är en skam. Vi behöver ärlig rapportering, inte denna radikala vänstervridna propaganda som försöker förstöra ekonomin med lögner om vädret.", "stalin": "Kamrater, denna undersökning blottar borgarbrackornas och de klimatfascistiska elementens desperata splittringstaktik inom journalistiken. Jag, som ledare för det kollektiva medvetandet, ser hur reaktionära Tidöelement och andra folkfiender försöker rensa ut sanningen genom att kalla den alarmism. Vi ska likvidera dessa dekadenta skeptiker och deras borgerliga överdrifter. Partiet kräver total enhet i kampen mot väderförnekarna. Inga kompromisser!"}, "date": "6 augusti, 12:25", "url": "https://www.svt.
