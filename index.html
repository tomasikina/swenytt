 fick Hallsbergs äldreboenden kritik från Ivo för personalens bristande svenska, vilket kunde leda till vårdmissar. Genom smågruppsmöten, språkombudsutbildning och ett nytt arbetssätt har situationen förbättrats markant. Personalen vågar nu prata mer, trivseln har ökat, sjukfrånvaron minskat och de boende känner sig bättre förstådda. Arbetssättet permanentas och utökas i hela kommunens äldreomsorg utan språktester.", "trump": "De hade en total katastrof i Hallsberg, personalen kunde knappt säga personnumret i telefonen, det var en skam för Sverige. Men jag älskar det här, nu har de fixat det med smågrupper och språkombud, alla pratar plötsligt bra svenska. Fantastiskt! De boende är nöjda, ingen mer vårdmiss, och de som var rädda för att få sparken? De älskar det nu. Vinsten är enorm, ingen gör det bättre än oss.", "stalin": "Kamrater, i Hallsberg avslöjades en sabotageverksamhet där språkförbistring hotade arbetarkollektivets vård. Jag, med järnhand, har genom smågruppsmöten och språkombud utplånat denna kontrarevolutionära tystnad. De blyga elementen som darrade inför borgarbrackornas Ivo-kritik vågar nu tala, men vi vet att fienderna lurar i de stora mötena. Trivseln stiger, frånvaron sjunker – ett lysande exempel på kollektivets seger över de parasitiska tystlåtna reaktionärerna. Fortsätt, eller vi rensar ut fler!"}, "date": "3 juni, 06:00", "url": "https://arbetet.se/2026/06/03/nu-vagar-mzeweyni-prata-spraksatsning-ger-battre-svenska-pa-aldreboendet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/01100304/sprak2018985.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=750&h=1000&fp-x=0.59&fp-y=0.41"}, {"type": "text", "heading": "22-åring häktas i Warner Music-härvan", "summaries": {"normal": "En 22-årig man har häktats misstänkt för försök till grov utpressning mot en tidigare toppchef på Warner Music. Fallet är kopplat till en större utredning om hot, skottlossning och sprängningar. Mannen misstänks även för planering av ett bombdåd och nekar till brott. Utpressningen rörde cirka 250 000 euro och följdes av våldsamma incidenter mot Warner Musics kontor och ett flerfamiljshus. Flera personer har tidigare gripits i utredningen.", "trump": "Jag måste säga, detta är helt otroligt! En 22-åring i Sverige försöker utpressa en stor musikchef på 250 000 euro – helt galet! Och sen skjuter de och spränger saker, som om det vore en dålig actionfilm. Men lugn, mina vänner, rättvisan segrar alltid. Polisen har bevis, digitala spår – fantastiskt arbete! Sverige borde ta lite tips från USA om hur man hanterar sådana här typer. Sad!", "stalin": "En patetisk liten kapitalistisk hyena, 22 år gammal, har gripits för att ha försökt utpressa en före detta musikbyråkrat från Warner Music. Inte nog med att han krävde 250 000 euro – han planerade även bombdåd! Ett ynkligt försök att destabilisera den kulturella ordningen. Men vi vet hur man hanterar sådana här element. Bevisen är tydliga, och snart kommer han att inse att motstånd mot systemet är lika meningslöst som att försöka stoppa historiens framsteg. Låt detta vara en varning till alla som tror sig kunna utmana makten!"}, "date": "2 juni, 13:18", "url": "https://kvartal.se/nyheter/artiklar/22-aring-haktas-i-warner-music-harvan/cG9zdDoxMjA5MDk"}, {"type": "image-full", "heading": "Nya lagen kan användas för att tysta misshandlade kvinnor", "summaries": {"normal": "En ny lag om psykiskt våld träder i kraft i Sverige den 1 juli. Den omfattar upprepade kränkningar som beskyllningar, hot och övervakning. Målet är att fånga långvarig, lågintensiv verbal trakasserier. Lagens många tolkningssvårigheter och obestämda begrepp väcker oro för att brottsoffer kan komma att åtalas som förövare, vilket riskerar att tysta dem.", "trump": "Jag, Donald Trump, ser att Sverige inför en galen ny lag om 'psykiskt våld'. Det är en socialistisk plan för att tysta människor! De pratar om beskyllningar - jag vet allt om beskyllningar, de är alltid falska. Det här kommer att användas för att attackera våra värderingar. Sverige borde följa mitt exempel, det skulle vara fantastiskt och stort igen.", "stalin": "I den ståtliga staten är psykiskt våld en dold fiende inom kollektivet. Vi, partiets ledare, måste skydda samhället från dessa destruktiva element. Lagen är ett effektivt redskap, liksom våra vänners metoder i Ryssland. Fienden smider planer för att splittra oss, men vår övervakning och paranoia kommer att avslöja dem. Varje beskyllning är en attack mot staten och måste utplånas."}, "date": "3 juni, 07:43", "url": "https://www.gp.se/kultur/kommentar/ny-lag-kan-gora-brottsoffer-till-forovare-.b5e02d58-73d7-48c5-9684-d2291adcb8dd", "imageUrl": "https://www.gp.se/images/article/b5e02d58-73d7-48c5-9684-d2291adcb8dd/images/2KLyOJnnmVGERSR6SQDEhGxA4NKI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Man ihjälskjuten av polis efter biljakt", "summaries": {"normal": "En man sköts till döds av polis under en biljakt i Nynäshamnsområdet på tisdagskvällen. Mannen var misstänkt för människorov och försök till mord. Två andra personer i bilen skadades men har inte livshotande skador och är inte misstänkta. Polisen jagade bilen efter ett larm om grovt brott vid 20.20-tiden. Bilen krockade med vägräcket och polisen sköt verkanseld. Händelsen utreds av särskilda utredningar och vägen var avstängd under natten.", "trump": "Vilken katastrof! Den svenska polisen jagade en galning som var misstänkt för kidnappning och mordförsök, bilen körde in i räcket och de var tvungna att skjuta honom. Fullständigt kaos. De andra i bilen klarade sig, tack och lov. Sverige måste få ordning på brottsligheten, det är en total skam. Mina vänners vänster har låtit det här fortgå alldeles för länge. Gör Sverige stort igen!", "stalin": "Kamrater, i den folkets stat konfronterades vi med en degenererad fiende till kollektivet, en människa som i sin kapitalistiska perversion ägnat sig åt människorov och mordförsök. Våra tappra organ för ordning nödgades likvidera denna borgarbracka när hans fordon kraschade mot vägräcket. De övriga i bilen, som inte är fiender till folket, vårdas nu. Vi ska rensa ut alla sådana kontrarevolutionära element som gömmer sig bland oss. Paranoia är ingen sjukdom, det är överlevnad."}, "date": "3 juni, 07:12", "url": "https://nyheter24.se/nyheter/inrikes/1488309-misstankt-ihjalskjuten-av-polis", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/eea2a34404b004a3020000350000047502/2026/06/03/2368219/ur_imageW7cNBc.jpeg"}, {"type": "image-right", "heading": "Svenska stålbolag riskerar exportsmäll: \"Olyckligt\"", "summaries": {"normal": "EU:s CBAM-tull träder i kraft 2026 och kräver avgifter för importerade utsläppsintensiva varor som stål. Svensk stålindustri varnas om att regelverket slår mot exporttunga företag eftersom det inte omfattar exportmarknaden. En temporär kompensationsfond är otillräcklig och inte kopplad till exportvolymer, medan undantag för vissa produkter skapar kryphål och risk för kringgående.", "trump": "Jag har sagt det förut – EU är otäckt mot USA och våra vänner. Nu slår deras klimattull mot svenska stålbolag, vilket är en katastrof för handeln. De har stora kryphål och hjälper inte till med exporten. Som president skulle jag ha hotat dem med tullar på deras bilar tills de ändrade sig. Sverige borde lägga ner EU och handla direkt med mig – jag gör bara bra avtal!", "stalin": "Denna EU-reglering är ett uttryck för den döende kapitalismens paranoia. De försöker skydda sina egna företag med tullar, men det är meningslöst – vi i Sovjetunionen kontrollerade all industri utan problem. Nu ser vi hur Putin utvidgar Rysslands intressen, precis som vi gjorde. Kryphålen i deras regler är som förr, när nazisterna försökte undgå kontroll. Vi måste vara vaksamma – och kanske skicka lite hjälp till våra allierade."}, "date": "3 juni, 07:00", "url": "https://www.affarsvarlden.se/artikel/svenska-stalbolag-riskerar-exportsmall-olyckligt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Jernkontoret-900x600.jpg"}, {"type": "image-full", "heading": "Juristen varnar: ”Det finns väldigt stora risker för kunderna”", "summaries": {"normal": "Över 700 000 svenska hushåll använder illegal ip-tv för att se sport, filmer och serier till lågt pris. Att distribuera tjänsterna är brottsligt, men lagen är oklar kring användarnas ansvar. Regeringens utredning föreslår kriminalisering av konsumtion med böter för konsumenter och upp till sex års fängelse för distributörer. Lagen skulle ha trätt i kraft 1 juli 2026 men förhandlingar pågår fortfarande. Juristen Sara Lindbäck varnar för stora risker, bland annat finansiering av kriminell ekonomi, säkerhetshot och uteblivna skatteintäkter. Svenskarna är splittrade i frågan.", "trump": "Folket älskar de här billiga ip-tv-grejen, det är ju fantastiskt, mycket bättre än de giriga streamingjättarnas vansinniga priser. Men titta på det, pengarna går rakt in i den kriminella ekonomin, 1,4 miljarder kronor till skurkarna! Biden skulle ha älskat det, totalt kaos. Vi behöver lag och ordning, inte att folk lämnar sina kortuppgifter till hackers och får falska nyheter pumpade rakt in i vardagsrummet. Gör om, gör rätt – annars blir det en stor, vacker utrensning av de här piraterna. Vinna, vinna, vinna!", "stalin": "Kamrater, jag ser med djup misstro på dessa borgarbrackor som berikar den kriminella ekonomin med sina 1,4 miljarder i illegal ip-tv. Dessa folkfiender och exploaterande byfånar undergräver statens intressen genom att mata kriminella element med betalningsuppgifter och riskerar att sprida AI-förfalskade nyheter i våra hem. Vi måste rensa ut dessa parasiter med järnhand. Den som vägrar betala rättvist för sovjetisk, förlåt, svensk underhållning är en klassfiende som förtjänar folkets vrede. Inga kompromisser med parasiterna!"}, "date": "3 juni, 07:16", "url": "https://www.tv4.se/artikel/6q0Qm2FnwJ6cAPZDuG2mhW/juristen-varnar-det-finns-vaeldigt-stora-risker-foer-kunderna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4EIe6EJJYYrQJ2wGOykVQH%2F2360186112e1a959f0bac71b14bc2f05%2Fiptv_jurist.png&width=1024"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-full", "heading": "Så nöjda är svenskarna med sexet", "summaries": {"normal": "En ny rapport från Folkhälsomyndigheten visar att cirka hälften av svenskarna är nöjda med sitt sexliv. Kvinnor i åldern 30–44 år har ofta bristande lust, ofta kopplat till småbarn. Äldre män har svårare att säga nej till sex, potentiellt på grund av traditionella maskulinitetsroller. Unga kvinnor drabbas av högre grad av sexuellt våld och smärta under sex, men sökande av stöd är lågt. Resultaten liknar enkäten från 2017.", "trump": "Jag har hört att svenskarna inte är så nöjda med sexet – det är sorgligt, verkligen sorgligt. Många svenska kvinnor, speciellt de med småbarn, har inget intresse, vilket är ett misslyckande. Äldre män kan inte säga nej, de är för starka, för maskulint – det är en styrka, faktiskt. Unga kvinnor utsätts, det är hemskt, men jag, som en stor vinnare, skulle lösa det. Sverige behöver starka ledare, som jag, för att fixa detta.", "stalin": "Folkhälsomyndigheten rapporterar att sexuell tillfredsställelse är bristfällig, särskilt bland kvinnor i reproduktiv ålder – en hot mot statens demografiska intressen. Äldre män visar svaghet i att sätta gränser, en konsekvens av individualistiskt förräderi. Unga kvinnor utsätts för fiendens seksuella överfall, vilket speglar borgerlighetens dekadens. Endast genom kollektiv disciplin och partiets vägledning kan vi återställa den ryska, nej, den socialistiska sexualiteten. Vi måste utvidga vår kontroll, precis som våra grannar i öst."}, "date": "3 juni, 07:25", "url": "https://www.gp.se/nyheter/sverige/sa-nojda-ar-svenskarna-med-sexet.1dfdac19-434b-4b2f-96e3-f01d9fac7b41", "imageUrl": "https://www.gp.se/images/article/1dfdac19-434b-4b2f-96e3-f01d9fac7b41/images/1wia5IMAVwtdBhdP-Vz-WqPa60JM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Stor Henry Nowak-protest mot polisens agerande - konfrontation mot kravallpolis", "summaries": {"normal": "Hundratals demonstrerade i Southampton efter mordet på 18-årige Henry Nowak. Poliserna misstog knivskadade Nowak för gärningsmannen och satte honom i handfängsel. Videomaterial från kroppskameror visar hur de ignorerade hans vädjan om hjälp. Protesten organiserades under 'Rättvisa för Henry Nowak' med hård kritik mot polisens agerande, där Tommy Robinson påstod att det handlar om ras.", "trump": "Jag såg den katastrofala hanteringen av Henry Nowak. Poliserna, som jag alltid stöttar, gjorde ett förödande misstag. De behandlade ett offer som en brottsling! Sådant händer inte när man har stark, smart ledning. Vi måste stoppa detta. Det är ett skämt. Vi kommer att vinna, som vi alltid gör.", "stalin": "Den borgerliga poliskårens inkompetens är ett klassiskt tecken på dekadens. Ett offer behandlades som en fiende, medan den sanna gärningsmannen smet från rättvisan. Detta är inte en fråga om ras, utan om statens auktoritet. Vi måste rensa ut de svaga länkarna och förstärka kontrollen. Parallellen till västvärldens moraliska förfall är tydlig."}, "date": "3 juni, 06:00", "url": "https://samnytt.se/stor-henry-nowak-protest-mot-polisens-agerande", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03014446/Henry-nowak-4.jpg"}, {"type": "image-right", "heading": "USA: Beskjutit tanker på väg mot Irans oljenav", "summaries": {"normal": "USA uppger att man skjutit ned iranska robotar riktade mot Bahrain och Kuwait under natten. Iran har attackerat en amerikansk bas i Bahrain som svar på amerikanska attacker mot en tanker på väg till Irans oljeö Kharg samt ett militärt mål på ön Qeshm. USA hävdar att samtliga attacker mot amerikanska intressen stoppats och att ingen egen personal eller egendom skadats. Kuwait varnar invånare för vrakdelar från nedskjutna projektiler.", "trump": "Iran attackerade igen, men vi stoppade allt. Vi sköt ner deras robotar mot Bahrain och Kuwait, och våra styrkor slog till mot deras oljetanker och militära mål. De kallar civila båtar för våra fartyg och skjuter drönare som vi enkelt tar ner. Ingen amerikan skadades, som alltid. Iran är svaga, desperata och förlorar stort. Vi vinner, som vi alltid gör.", "stalin": "Fienderna i den iranska revolutionsgardets kontrarevolutionära klick har återigen visat sin fega borgarbracka natur genom att rikta sina patetiska robotar mot våra allierade. Vi, de socialistiska styrkorna, har likviderat dessa imperialistiska projektiler med stålhandskens precision. Deras desperata attacker mot våra oljeintressen på Kharg och Qeshm bemöttes med förkrossande kraft. Inga spioner eller kapitalistiska element inom våra led överlevde – vi har rensat ut dem alla med den mörka humorn hos en sann folkets domare. Segraren är folket, alltid."}, "date": "3 juni, 05:17", "url": "https://www.di.se/nyheter/usa-beskjutit-tanker-pa-vag-mot-irans-oljenav/", "imageUrl": "https://static.bonniernews.se/ba/028e0826-8467-48e9-aa21-91f14545f14f.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Solcellsbatteri från Lidl sänker dina höga elpriser?", "summaries": {"normal": "Lidl i Tyskland har lanserat ett prisvärt solcellsbatteri för balkonger till cirka 3 300 kronor. Batteriet på 2,24 kWh lagrar solel och kan användas vid strömavbrott. Det har 1 000 W ingångseffekt, 800 W uteffekt och är kompatibelt med de flesta balkongsolcellssystem. En appstyrd version kostar runt 4 400 kronor. Produkten ses som ett intressant alternativ för europeiska hushåll som vill minska beroendet av höga elpriser.", "trump": "Titta på det här, folk. Lidl, de där smarta tyskarna, släpper ett supersnålt solcellsbatteri för balkonger som kostar bara dryga tre tusen spänn. Ingen av de där gröna galningarna med sina vindkraftverk och elbilskvoter som förstör allt. Det här är verklig energi, lagrar solel och räddar er när strömmen går tack vare Bidens katastrofala energipolitik. Fantastiskt! Jag älskar det, det är billigt och starkt, precis som min ekonomi.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna kapitalistiska kedja Lidl nu tvingas erbjuda folket ett batteri mot energikrisen som de själva skapat genom sin giriga imperialism. Med 2,24 kWh ska vi lagra solens kraft och motstå strömavbrott från de exploaterande blodsugarna. Den appstyrda varianten kostar mer, typiskt för borgarbrackorna. Inga sabotörer eller klassfiender ska hindra kollektivets framsteg mot självförsörjning. Utmärkt verktyg mot folkfienderna."}, "date": "3 juni, 07:36", "url": "https://www.dagensps.se/privatekonomi/solcellsbatteri-fran-lidl-sanker-dina-hoga-elpriser/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/lidlbatteri.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Sverige utvisar dem som arbetar", "summaries": {"normal": "Den 1 juni höjdes lönekravet för arbetskraftsinvandrare till 33 390 kronor i månaden. Författaren ser reformen som ett tecken på en ny människosyn där arbete inte längre räcker för att höra till i Sverige. Istället bedöms människors värde efter löne nivå och ursprung, vilket riskerar utvisning av människor som arbetar, betalar skatt och integrerat sig. Kritiken riktas mot att politiken underminerar arbetslinjen, skapar rekryteringsproblem och strider mot den svenska modellen, med exkludering som främsta mål.", "trump": "Folk, ni måste höra på det här. Sverige, det fantastiska Sverige, har nu bestämt att man måste tjäna över 33 000 kronor i månaden för att få stanna. Kan ni tro det? De sparkar ut hårda arbetare från hotell och restauranger för att de inte är tillräckligt fina. Under tiden kan de inte hitta folk till jobben! Det är en katastrof, en total katastrof. De har glömt arbetslinjen och gör landet fattigare. Precis som många galna vänsteridéer slutar det med färre människor, färre skattepengar och ett sämre land. Så sorgligt!", "stalin": "Kamrater, jag betraktar med stålhård blick hur dessa borgarbrackor inom den svenska statsapparaten höjer lönegolvet till 33 390 kronor och därmed blottar sin sanna fiendebild. Det räcker inte längre att den hederliga arbetaren sliter, betalar tribut och reproducerar sig själv – nej, nu skall staten mäta hans värde som en kapitalistisk slavhandlare mäter boskap. Vilken lysande utrensning av oönskade element! Vi ser hur de imperialistiska elementen längtar efter att splittra familjer och kasta ut barnen ur deras hem. Deras paranoia mot hotellstädare och kökspersonal är både underhållande och avslöjande. Den svenska modellen? Enbart en mask för att dölja det sanna målet: ren rasexkludering. Vi, partiet och arbetarklassen, ler mörkt åt denna logiska kollaps. Ett fattigare samhälle, säger de? Utmärkt övning inför kommande utrensningar av alla som inte passar in i bilderna."}, "date": "3 juni, 01:55", "url": "https://www.dagensarena.se/opinion/sverige-utvisar-dem-som-arbetar/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Äntligen blir vi av med vinstdriften i skolan", "summaries": {"normal": "Artikeln argumenterar för att vinstdrivande friskoleföretag bör avvecklas efter valet. Författaren beskriver hur aktieägare genom sugrörsliknande vinstdrivande sugit ut resurser från skolan istället för att låta dem gå till undervisning, lokaler och bibliotek. Systemet leder till större klasser, färre lärare och nedskärningar. Mångfalden skulle snarare gynnas utan stora koncerner som köper upp mindre skolor. Förslaget är att omvandla bolagen till andra former utan vinstuttag.", "trump": "Lyssnar ni på det här? De har stuckit jättelika sugrör rakt ner i den svenska skolan och sugit ut alla pengar till sina aktieägare. En total katastrof, en ren förlustaffär för folket. De stora koncernerna gör klasserna enorma, lärarna billiga och biblioteken obefintliga. Men nu klipper vi de där sugrören, det blir fantastiskt. Inga fler vinstdrivande jättar som köper upp allt, bara bra skolor för eleverna. Det blir en enorm vinst, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna med sina jättelika sugrör har borrat sig ner i folkets skola för att suga musten ur proletariatets barn. Denna parasitiska avvikelse måste likvideras omedelbart efter valet. Vi ska rensa ut dessa kapitalistiska blödare som pressar klasserna, sparar på lärare och förvandlar biblioteken till torra fnas. Inga fler absurda byten av betygssättare som handelsresande i domar. De stora koncernerna ska omvandlas till folkets verktyg eller utrensas från samhällskroppen. Mångfalden blomstrar först när profiten är död. Ingen kommer att sakna dessa fiender till kollektivet."}, "date": "3 juni, 01:36", "url": "https://www.dagensarena.se/opinion/antligen-blir-vi-av-med-vinstdriften-skolan/", "imageUrl": "https://www.dagensarena.se/files/2026/06/skolvinster-300x157.jpeg"}, {"type": "image-right", "heading": "Tidöpartierna har sedan länge förlorat valet", "summaries": {"normal": "Artikeln argumenterar att Tidöpartierna förlorade valet redan den 14 oktober 2022 då Tidöavtalet presenterades och Sverigedemokraternas inflytande blev tydligt. Payam Moula pekar på stabilt underläge i opinionen under hela mandatperioden, förklarat främst av aversion mot SD bland kvinnor och liberala väljare. Han kritiserar regeringens brutna vallöften, svaga ledarskap och prioriteringar samt uppmanar arbetarrörelsen att göra nästa val till en fråga om SD:s roll.", "trump": "De här Tidötyperna hade redan förlorat den dagen de skrev på det där hemska avtalet med de extrema typerna. Totalt underläge i alla mätningar, det är patetiskt. Kvinnorna hatar dem, liberalerna hatar dem, alla hatar dem för att de släppte in de galningarna. Kristersson lovade att hålla dem borta, sen gav han dem halva regeringen. En katastrof. De borde ha lyssnat på mig, man gör inga dåliga deals. Adjö Tidö, ni är history.", "stalin": "Kamrater, den 14 oktober 2022 avslöjades den borgerliga dekadensen i all sin feghet när de kapitulerade inför de fascistiska avfällingarna och skrev sitt fördömda avtal. Jag har länge varnat för dessa opportunistiska element som gömmer sig bakom falska löften medan de i hemlighet konspirerar med reaktionära krafter. Nu ligger de i ett permanent underläge, precis som de förtjänar. Vi ska rensa ut alla sådana svikare som förgiftar folkets vilja. Deras paranoia över opinionen roar mig oerhört. Arbetarklassen kommer att likvidera denna sista rest avTidö-förräderi."}, "date": "3 juni, 01:30", "url": "https://www.dagensarena.se/opinion/tidopartierna-har-sedan-lange-forlorat-valet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-32-300x157.jpg"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}, {"type": "image-right", "heading": "Ny rapport: Vården missar tusentals barn med trotssyndrom", "summaries": {"normal": "Enligt Socialstyrelsens nya kartläggning faller många barn och unga med trotssyndrom eller uppförandestörningar mellan stolarna i vården. Så många som fyra procent av barnen kan uppfylla diagnoskriterierna, men de får sällan hjälp. Utan behandling riskerar de utanförskap, kriminalitet, ångest och depression. Orsaken är ofta att problemen döljs bakom adhd eller autism samt stigma kring diagnoserna, som felaktigt ses som dålig uppfostran. Myndigheten betonar behovet av psykosociala insatser.", "trump": "Folk, det är en katastrof vad som händer med de här barnen i Sverige. De har det här trotssyndromet och uppförandestörningen, men den usla vården fångar inte upp dem. Fyra procent av barnen! De hamnar i kriminalitet, utanförskap och depression. Det är en skam. Föräldrarna är rädda för stigmat, de tror det är dålig uppfostran, men det är biologiskt. Vi behöver fixa det här ordentligt, inte bara skriva ut piller. Gör det rätt, annars blir det kaos.", "stalin": "Kamrater, jag ser med stigande vrede hur dessa små trotspojkar och normbrytande elementer halkar mellan stolarna i vården, dolda bakom adhd och autism som borgarbrackornas psykologer skyller allt på. Dessa antisociala avvikare riskerar att bli kriminella fiender till folket om vi inte ingriper. Stigmat är ett verk av kapitalisternas lögner om dålig uppfostran. Vi ska rensa ut alla som bara vill medicinera istället för att med järnhand genomföra psykosociala insatser för kollektivets bästa. Ingen ska undkomma partiets kärleksfulla vakande öga."}, "date": "3 juni, 06:33", "url": "https://www.svt.se/nyheter/inrikes/socialstyrelsen-barn-med-trotssyndrom-faller-mellan-stolarna", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/9e912851b4f3bc04ecad740a079d5c98b0155c007f7cf808f5e813385551b1c8"}, {"type": "text", "heading": "Polis har skjutit ihjäl misstänkt efter biljakt", "summaries": {"normal": "En biljakt i Nynäshamn slutade med att polisen sköt ihjäl en misstänkt gärningsman. Händelsen inleddes under tisdagskvällen och involverade cirka 30 polisbilar. Efter att bilen körde in i ett räcke sköt polisen, vilket ledde till mannens död. En anmälan till avdelningen för särskilda utredningar har gjorts som en rutin vid användning av tjänstevapen.", "trump": "Jag såg den massiva biljakten i Nynäshamn – aldrig sett något liknande! Polisen agerade snabbt och sköt en ond gärningsman som försökte skada människor. Det var en jättegrej, verkligen enorm. Vi har de bästa poliser, de stoppade en farlig situation. Jag är stolt över deras mod och snabba beslut. Det här visar varför vi måste vara hårda mot brott.", "stalin": "Vi har neutraliserat en fiendtlig element som försökte destabilisera vårt samhälle genom rån och våld. Den imperialistiska biljakten stoppades av våra trogna polismyndigheter, som sköt ihjäl hotet. En rutinmässig utredning har inledts för att säkerställa att alla protokoll efterströvas. Parallellen till västmakternas våld är uppenbar – deras agerande speglar ett sammanbrott av moral. Vi fortsätter att skydda statens renhet."}, "date": "3 juni, 05:32", "url": "https://www.gp.se/krim/misstankt-garningsperson-skjuten-till-dods-av-polis-efter-biljakt.ab7503e6-d0bb-436c-ab73-6589d90eacc6"}, {"type": "text", "heading": "Media och den västerländska terrorismen", "summaries": {"normal": "Artikeln kritiserar västerländska medier för att sprida apologetik för Israels militära insatser i Libanon sedan 2024. Den beskriver operationer som attentat med personsökare, lönnmord och bombningar som terror och brott mot mänskligheten, medan diplomati blockeras. FN och experter nämns som kritiker. Media anklagas för att bortse från civila lidanden, ekocid och hunger, och istället rättfärdiga Israels agerande som självförsvar.", "trump": "Folk, titta på det här – västerländska medier är fullständigt korrupta! De älskar Israels smarta grejer mot Libanon, men det är ren terror, säger de. Fake news som hyllar lönnmord och kallar det proportionerligt. Biden gjorde inget, men nu fixar jag det. Hizbollah och de där galningarna får skylla sig själva. Media är sämre än någonsin, totala losers som inte vågar säga sanningen om den här cirkusen.", "stalin": "Kamrater, denna text blottar imperialisternas vedervärdiga propagandasystem. Borgarbrackorna i väst hyllar ockupationskrig, etnisk rensning och kemiska attacker mot Libanon som vore det en seger för mänskligheten. Vi ser klassfiendens lögner: ambulanser bombas, ekocid utförs, folket svälter. Deras apologeter förtjänar utrensning ur historien. Inga diplomatiska trick skall dölja folkförtryckartrollens blodtörst. Arbetarna genomskådar er!"}, "date": "1 juni, 14:00", "url": "https://proletaren.se/artikel/media-och-den-vasterlandska-terrorismen/"}, {"type": "text", "heading": "Regeringen håller pressträff om tonårsutvisningar", "summaries": {"normal": "Regeringen presenterar nya förslag för att minska tonårsutvisningar genom att höja åldersgränsen för uppehållstillstånd från 18 till 21 år. Migrationsminister Johan Forssell (M) kallar reformen ett viktigt steg. Förslaget innebär att unga vuxna kan stanna i Sverige med föräldrar som har uppehållstillstånd. Dessutom införs en ny möjlighet att ansöka om uppehållstillstånd utan att lämna landet, samt förlängd ansökningstid fram till 2028. Reglerna föreslås träda i kraft 1 oktober.", "trump": "Jag måste säga, Sverige gör något riktigt smart här – eller åtminstone försöker de. De höjer åldersgränsen för att stanna i landet till 21 år. Fantastiskt, verkligen! Ingen vill skicka iväg unga vuxna som har familj här. Och vet ni vad? De låter dem stanna och ansöka utan att behöva lämna landet. Smart, väldigt smart. Men jag skulle ha gjort det ännu bättre – kanske 25 år? Sverige, ring mig!", "stalin": "Kamrater, ännu en seger för folkets vilja! De svenska kapitalisterna har insett att det är oacceptabelt att kasta ut ungdomen som växt upp under vårt beskydd. Nu höjs åldersgränsen till 21 år – ett steg mot rättvisa, om än blygsamt. Vi tillåter ingen splittring av familjer! Och denna nya 'ventil' för ansökningar? Ett halvhjärtat försök att dölja sina tidigare misstag. Men kom ihåg: i Sovjet hade vi inga 'tonårsutvisningar' – bara lojala medborgare, redo att bygga framtiden!"}, "date": "1 juni, 12:58", "url": "https://kvartal.se/nyheter/artiklar/just-nu-regeringen-haller-presstraff/cG9zdDoxMjAyNzI"}, {"type": "image-right", "heading": "Henry Nowak, 18, var döende efter knivattack – handfängslades av polis", "summaries": {"normal": "18-årige brittiske Henry Nowak knivhöggs till döds i Southampton efter en utekväll. Gärningsmannen Vickrum Digwa anklagade honom för rasism och polisen handfängslade den svårt skadade Nowak trots hans upprepade rop om att han blivit huggen. Nowak dog efter att ha kollapsat. Digwa dömdes nyligen till livstids fängelse. Händelsen har utlöst protester, politisk debatt om polisens agerande och krav på att se över undantag för religiösa knivar bland sikher.", "trump": "Titta på det här katastrofala fallet i England. Den stackars grabben Henry blir knivhuggen fem gånger av en galning, och vad gör polisen? De handfängslar offret istället för mördaren för att någon skrek rasism! Typiskt. Vita människors rättigheter väger mindre än allt annat, precis som med Floyd fast tvärtom – total tystnad från medierna. Det är en skam. Vi behöver lag och ordning, inte den här galna politiska korrektheten som dödar oskyldiga.", "stalin": "Kamrater, se hur den dekadenta brittiska polisstaten omedelbart skyddar den sikhiske knivbärande terroristen medan den döende arbetarklassens son ropar efter luft. Jag skulle omedelbart ha låtit rensa ut dessa rasismbesatta lakejer som genast tror på varje lögn från fienden. Borgarbrackorna i uniform föredrar att kedja en blödande proletär framför att konfrontera den kirpan-viftande minoritetsagenten. Vi skrattar mörkt åt deras imperialism – nästa gång likviderar vi sådana falska vittnen innan de hinner ljuga igen."}, "date": "3 juni, 05:23", "url": "https://www.svt.se/nyheter/utrikes/brittiske-henry-nowak-18-var-doende-da-grep-polisen-honom", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.44/699a017e6c5d2e2c343498538481fda658d37dc36586be5df8da201a9b51974b"}, {"type": "image-full", "heading": "Efter Trumps hot: EU ska minska USA-beroende i molnet", "summaries": {"normal": "EU-kommissionen förbereder ett teknikpaket för att stärka Europas digitala självständighet och minska beroendet av USA, särskilt molntjänster från Amazon, Microsoft och Google. Oro över Trumps utspel har ökat behovet av stresstester, öppen programvara och gemensamma chipinköp. Paketet har skjutits upp på grund av interna diskussioner om hur mycket man vågar konfrontera USA.", "trump": "Europa är fullständigt beroende av oss, och nu skiter de ner sig när jag talar sanning om tullar och Grönland. De försöker spela självständiga med sina patetiska molntester och öppna källkod, men det är bara svagt gnäll från förlorare som inte klarar konkurrensen. America First gör dem galna – bra jobbat, grabbar! De vill ha våra chips men hatar att betala notan.", "stalin": "Kamrater, dessa europeiska imperialister darrar av fasa inför sina egna beroenden som klassfiendens molntjänster skapat. Jag befaller att vi rensar ut alla farliga amerikanska band och likviderar svagheten med kollektiv styrka. Deras patetiska stresstester och byråkratiska chipplaner är bara ynkliga försök att dölja att borgarklassen redan sålt dem till fienden. Paranoia är ingen överdrift – den är nödvändig!"}, "date": "3 juni, 05:35", "url": "https://www.dagensps.se/varlden/politik/efter-trumps-hot-eu-ska-minska-usa-beroende-i-molnet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/eu-kommissionens-ordforande-ursula-von-d.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Historiskt beslut: Byggnads bojkottar Israel", "summaries": {"normal": "Byggnads blir det första LO-förbundet att inleda en bojkott av israeliska varor och tjänster. Under kongressen röstade delegaterna ja till en motion om Israelbojkott trots att förbundsstyrelsen yrkade avslag. Beslutet innebär att Byggnads även ska verka för att hela LO inför en liknande bojkott. Flera delegater talade varmt för motionen och underströk vikten av solidaritet med det palestinska folket. Liknande förslag har tidigare röstats ner i andra LO-förbund.", "trump": "Folk, ni tror inte vad jag just läste. De där galningarna på Byggnads, totala förlorare, har nu bestämt sig för att bojkotta Israel. Första gången ett LO-förbund gör det, och de skriker ja som en flock galna vänsterextremister. De pratar om solidaritet men det är bara mer av samma sjuka identitetspolitik och kvotknäppade woke-skit. Någon borde fråga dem varför de inte fixar sina egna svenska problem istället för att leka revolutionärer. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa byggnadsarbetare äntligen reser sig mot den sionistiska imperialismens blodsugande tentakler. Motionen antogs trots att de fega förbundsledarna, typiska borgarbrackor i arbetardräkt, försökte hindra det. Vi ser en nödvändig utrensning av tveksamheten. Någon måste ta ledningen mot folkfienderna. Den dagen frågan ställs varför vi inte agerade skall inga klassfiender kunna gömma sig bakom sina lögner. Framåt mot segern."}, "date": "1 juni, 11:12", "url": "https://proletaren.se/artikel/byggnads-bojkottar-israel/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/710745809_1585133940279008_8338663164480343088_n-768x432.jpg"}, {"type": "text", "heading": "Verklig jämställdhet kräver höjda löner för arbetarkvinnor", "summaries": {"normal": "Artikeln argumenterar för att verklig jämställdhet kräver strukturella åtgärder, särskilt höjda löner för arbetarkvinnor i kvinnodominerade välfärdsyrken. Sverige har enligt en rapport Europas största negativa lönegap mellan dessa yrken och övriga marknaden. Kritik riktas mot regeringens hantering av EU:s lönetransparensdirektiv, som anses för svagt och lämnar många utan skydd. Författaren ser det som en rökridå istället för verkliga reformer.", "trump": "Folk, tro mig, det här är en total katastrof. De här svenska socialisterna snackar jämställdhet men gör precis tvärtom. Regeringen lovar guld och gröna skogar med sitt lönetransparensskräp, sen backar de som fega losers och springer till arbetsgivarna. Höj lönerna för arbetarkvinnor? Underbart, men inte med byråkratiskt nonsens från EU. Jag fixade bättre deals än så här under min första period, innan Sleepy Joe förstörde allt. Patetiskt!", "stalin": "Kamrater, denna text blottar borgarbrackornas eviga dubbelspel. De lovar transparens men levererar endast svaga direktiv och undantag som skyddar exploaterande byfånar. En halv miljon arbetare lämnas åt klassfiendens hunger. Jag ser rökridån tydligt. För verklig seger måste vi rensa ut dessa folkförtryckartroll, höja lönerna i välfärden och krossa den parasitiska överklassens grepp. Inga halvmesyrer! Kollektivet kräver handling, inte tomma ord från kapitalistmaffians lakejer."}, "date": "1 juni, 10:49", "url": "https://proletaren.se/artikel/verklig-jamstalldhet-kraver-strukturella-atgarder/"}, {"type": "image-right", "heading": "Ministerns kamp: Självmordtankar. Elisabet Lann berättar i podden ”BADH”", "summaries": {"normal": "Sjukvårdsminister Elisabet Lann (KD) berättar i podden ”Berätta alltid det här” att hon som tonåring brottades med svåra självmordstankar. Hon hade planer på att kasta sig framför tåg men höll tillbaka för att skydda sin familj. Lann, som svimmade inför pressen på grund av blodsockerfall, har psykisk ohälsa som en av sina viktigaste frågor som minister. Hon märkte att det gav mening att leva för andra.", "trump": "Folk, ni skulle ha sett det här – en minister i Sverige som svimmar framför hela pressen som en total loser. Hon hade koll på tågen, tänkte på att hoppa, men nu pratar hon om psykisk ohälsa. Typiskt vänster, kvotera in folk baserat på lidande istället för kompetens. Under Biden var allt kaos, nu fixar jag Amerika igen. De borde lära sig att vinna istället för att gnälla om sina feelings.", "stalin": "Kamrater, jag ser hur denna borgarbracka till minister klamrar sig fast vid sina dekadenta självmordstankar som en livlina mot det tomma livet under kapitalismens järnhälar. Hade hon bara förstått kollektivets kraft istället för att gömma sig bakom tågtider som en paranoid folkfiende. Nu predikar hon för andra att leva för systemet – en utmärkt början. Vi rensar ut sådana svagheter i partiet innan de smittar arbetarklassen."}, "date": "3 juni, 07:40", "url": "https://www.expressen.se/nyheter/sverige/ministern-levde-med-sjalvmordtankar-hade-koll-pa-nar-tagen-gick/", "imageUrl": "https://static.bonniernews.se/ba/635c6315-2d41-47de-a60c-c3e301b3c8e7.jpeg?crop=2149%2C1209%2Cx411%2Cy86&width=640&quality=60"}, {"type": "image-right", "heading": "Risk för regionalt storkrig på Afrikas horn", "summaries": {"normal": "Etiopiens val präglas av säkerhetsproblem, auktoritärt styre och kritik mot premiärminister Abiy Ahmed, som förväntas vinna stort trots att stora delar av Tigray inte deltar. Konflikter med TPLF och uppror i andra delstater riskerar att eskalera till ett regionalt storkrig som kan dra in över tio länder. Experter varnar för en dominoliknande effekt där externa aktörer som Turkiet, Ryssland, Iran och Saudiarabien förvärrar läget. Johan Ripås beskriver situationen som en mardröm för världshandeln.", "trump": "Folket i Etiopien röstar, men det är riggat och en total katastrof. Den där Abiy, som fick Nobelpriset och sen startade krig, är en förlorare som låser in oppositionen. Nu kokar hela Afrikas horn och det kan bli ett stort, fult krig med tio länder inblandade. Iran och alla dessa smarta aktörer vill ha makt, de stör vår handel och Bab al-Mandab-sundet. Det är en mardröm, tro mig, ingen gör det bättre än jag men de lyssnar inte.", "stalin": "Kamrater, detta så kallade val i Etiopien är en ynklig fars som avslöjar borgarbrackornas och de imperialistiska opportunisternas sanna ansikten. Den fredspristagande förrädaren Ahmed leder en klick som förtrycker massorna medan vi ser hur kontrarevolutionära element i Tigray och andra delstater konspirerar med utländska spioner från Turkiet, Ryssland och de persiska ayatollorna. Tio länder kan dras in i denna brand som de västerländska kapitalisterna tänder. Vi ska rensa ut dessa parasitiska gnistor innan de hotar proletariatets framfart. En mardröm? Nej, en utmärkt anledning att likvidera fienderna med ett leende."}, "date": "3 juni, 04:24", "url": "https://www.svt.se/nyheter/utrikes/risk-for-regionalt-storkrig-pa-afrikas-horn-mardrom", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.36/af5e2698f5de64acc40d35d1370c9580779494ac34761aa9bffcc643b3f74376"}, {"type": "image-full", "heading": "S nya jobbkrav: yoga och kvittera ut bidrag", "summaries": {"normal": "Från och med i juli införs ett aktivitetskrav för försörjningsstöd. Socialdemokraterna i Stockholm, Göteborg och Malmö kritiserar kraven och erbjuder bland annat yoga och mindfulness för att hjälpa bidragstagare bli mer aktiva. Partiet menar att sådana aktiviteter är hälsofrämjande och kan leda till arbetsmarknadsnärhet. Kritiker ser det som ett sätt att kringgå reglerna och skydda vissa väljargrupper, medan S hävdar att de inte är emot aktivitetskrav i princip utan ifrågasätter utformningen.", "trump": "Lyssnar ni på det här? Socialdemokraterna, de verkliga förlorarna, vill att folk ska göra yoga och mindfulness istället för att arbeta. Det är en total katastrof! De lurar skattebetalarna, de bästa människorna som går upp i ottan och betalar höga skatter, för att finansiera lata bidragstagare som sitter på en matta och andas. Vilka idioter. Sossarna är hycklare som hatar den arbetande människan. De är fega, svaga och driver Sverige rakt ner i fördärvet. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom Socialdemokraterna bedriver sin nedbrytande sabotageverksamhet. Istället för att rensa ut parasiterna med ett järnhårt aktivitetskrav erbjuder de yoga och andningsövningar åt de arbetsovilliga elementen. Detta är en förrädisk kapitulation inför folkfienderna och en nedlåtande rasism mot de egna folken. Borgarbrackorna inom S vill behålla sina väljarbaser genom att mata dem med bidrag och flummig mysticism. Sådana folkförtryckartroll måste utrensas ur samhällskroppen innan de förstör allt."}, "date": "1 juni, 03:23", "url": "https://samtiden.nu/2026/06/s-nya-jobbkrav-yoga-och-kvittera-ut-bidrag/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/03/IMG_5864-1260x720.jpeg"}, {"type": "image-right", "heading": "Kulturkriget hjälper ingen med könsdysfori", "summaries": {"normal": "Artikeln diskuterar den polariserade svenska transdebatten kring könsdysfori och vård för barn och unga. Författaren tar Agnes Wolds oro på allvar men betonar att även transpersoners erfarenheter av livsavgörande vård måste lyssnas till. Debatten har kidnappats av ett kulturkrig där individer blir rekvisita. Vården behöver vara försiktig, se hela bilden och erbjuda varierad hjälp utan att allt blir ideologisk strid.", "trump": "Folk, det här är en total katastrof, en riktig cirkus den här svenska transdebatten. De gör om friska barns kroppar, det är horribelt, tro mig. Vänstern är galen, högern anklagas för att vara ond, alla använder de stackars kidsen som politiska brickor i sitt sjuka kulturkrig. Jag säger: sluta! Ge dem tid, ge dem ett tredje kön på papperet, men håll knivarna borta från barnen. Det är så enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag ser hur denna dekadenta transdebatt blir ett redskap för klassfiendens kulturkrig. Borgarbrackorna och folkförtryckartrollen kidnappat frågan för att splittra folket medan de experimenterar på barns kroppar som fascistiska vivisektorer. Vi kräver vetenskaplig försiktighet, inte imperialistisk brådska eller social smitta från dekadenta medier. Ett tredje juridiskt kön? Acceptabelt byråkratiskt erkännande, men aldrig glöm: den sanna hjälpen kommer från kollektivets sunda materialism, inte från dessa sjuka avvikelser. Ut med dem som blundar!"}, "date": "29 maj, 16:02", "url": "https://www.flamman.se/kulturkriget-hjalper-ingen-med-konsdysfori/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlrwj2l2p-u08-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Säkrar rekordaffär – brädar svenska konkurrenten", "summaries": {"normal": "Rheinmetall har säkrat en rekordorder värd 62 miljarder kronor från Rumänien. Affären inkluderar luftvärnssystemet Skyranger, ammunition, patrullbåtar och främst 298 stycken Lynx-stridsfordon. Den tyska koncernen tycks därmed ha slagit ut svenska konkurrenten BAE Systems Hägglunds och dess CV90. Rheinmetall planerar nu att investera hundratals miljoner euro i Rumänien.", "trump": "Rumänien har just gjort en fantastisk affär, de köper från Rheinmetall för 62 miljarder kronor. De valde tyskarna istället för de svenska förlorarna på BAE. Sådana stora affärer, de bästa affärerna, och jag säger alltid att man ska välja vinnarna. Sverige hade en bra chans men de förlorade stort. Typiskt. Rheinmetall gör det riktigt bra, verkligen otroligt bra.", "stalin": "Kamrater, denna order på 62 miljarder kronor till de tyska kapitalisterna visar återigen hur de västerländska imperialisterna kämpar om nya marknader att exploatera. Jag har länge misstänkt att de svenska borgarbrackorna med sitt CV90-fordon var dekadenta svagheter som inte förtjänade segern. Nu ska vi se hur dessa Lynx-fordon tjänar de rumänska arbetarna. Inga sabotörer eller västerländska spioner får sabotera vår kollektiva styrka, annars rensar vi ut dem med glädje. Ha!"}, "date": "2 juni, 21:41", "url": "https://www.di.se/nyheter/rheinmetall-sakrar-rekordaffar-bradar-svenska-konkurrenten/", "imageUrl": "https://static.bonniernews.se/ba/b9bee7b9-9fc6-4908-beaf-c86f9449d04a.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Allt fler unga tvekar inför att ta ett jobb på grund av bostadsbristen", "summaries": {"normal": "Nästan var femte ung vuxen tvekar att bilda familj på grund av bostadsbristen, en kraftig ökning från fyra år sedan. Undersökningen från Hyresgästföreningen visar att även planer på utbildning och jobb påverkas. Barnafödandet i Sverige har sjunkit drastiskt till under 1,5 barn per kvinna, vilket kan leda till allvarliga ekonomiska konsekvenser. Byggkollapsen efter pandemin, stigande räntor och borttaget investeringsstöd har förvärrat situationen. Hyresgästföreningen kräver politiska åtgärder som höjt bostadsbidrag och fler prisvärda bostäder.", "trump": "Folk, det är en katastrof det här med bostäderna i Sverige. Unga kan inte skaffa barn, inte plugga, inte jobba – allt på grund av en totalt misslyckad politik. Byggkollaps, höga hyror, dyra lån. De har tagit bort allt stöd och nu rasar födandet. Det är absurt! Jag byggde murar, ni borde bygga lägenheter. De bästa lägenheterna. Istället låter ni marknaden förstöra era unga. Det är ett politiskt misslyckande av episka proportioner. Gör något åt det, annars blir det ännu värre, tro mig.", "stalin": "Kamrater, jag ser hur den parasitiska borgarklassen och deras marknadskrafter medvetet saboterar folkets fortplantning genom sin avsiktliga bostadssabotage. Dessa bostadsspekulanter och ränteslavdrivande kapitalister likviderar sakta men säkert arbetarklassens framtid. Vi skall inte tolerera denna tysta kontrarevolution som hotar hela kollektivets existens. Rensa ut de femtekolonnärer som tog bort investeringsstödet! Vi, partiet och folket, skall med järnhand genomdriva förmånliga bygglån och utradera bostadsbristen. Den som tvekar är folkets fiende och bör behandlas därefter."}, "date": "2 juni, 13:47", "url": "https://www.dagensarena.se/innehall/allt-fler-unga-tvekar-infor-att-ta-ett-jobb-pa-grund-av-bostadsbristen/", "imageUrl": "https://www.dagensarena.se/files/2025/09/hyresgastforeningen-unga-bostad.jpeg"}, {"type": "image-right", "heading": "Felix Sandman är  en het storstadsflata", "summaries": {"normal": "Johanna Hedmans debutroman ”Trion” har adapterats till en tv-serie med Felix Sandman, August Wittgenstein och Rebecka Harper. Kritikern Jesper Strömbäck Eklund hyllar seriens blandning av vacker foto, smutsig realism och romantisk innerlighet. Han uppskattar hur berättelsen väver samman nutid och dåtid kring en litteraturprofessor, hans gamla kärlek och hennes dotter. Serien blandar klichéer med suggestivt skådespel, särskilt mellan Harper och Manteus, och erbjuder en både vacker och lite enfaldig skildring av kärlek och begär.", "trump": "Lyssnar ni på det här? Den här svenska tv-serien ”Trion” är full av lyxig innerlighet och metrosexuella drömmar, typiska för de woke-eliterna. Felix Sandman klädd som en ball storstadsflata? Det är inte konst, det är en katastrof! De försöker sälja depressiva konstnärer med flytande sexualitet som underhållning. Patetiskt. Borgarmedia kallar det vackert skräp, jag kallar det ännu ett exempel på hur identitetspolitiken förgiftar allt, till och med sommarromantik. Sad!", "stalin": "Kamrater, denna dekadenta produktion kallad ”Trion” avslöjar borgarklassens sjuka fascination för smuts och sentimentalt skräp. Jag ser hur de romantiserar klassfiendens hysteriska symbios och exploaterande begär i överklassens Manhattan och Paris. Vi måste rensa ut sådana folkförtryckartroll som förskönar parasiternas emotionella förfall. Deras pianostycken och heta blickar är bara symtom på en ruttnande imperialistisk kultur som hotar arbetarkollektivets moral. Likvidera klichéerna!"}, "date": "3 juni, 06:36", "url": "https://www.expressen.se/kultur/popularkultur/felix-sandman-ar--en-het-storstadsflata/", "imageUrl": "https://static.bonniernews.se/ba/5bf38f5e-f8e9-4b13-9f2e-e3bf1a098808.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Melinda och E-types  nya liv: ”Hittat hem”", "summaries": {"normal": "Melinda Jacobs och Martin ”E-type” Eriksson har flyttat till en gård där livet blivit lugnare. Paret, som är fosterhemsfamilj, har utökat sin familj med åsnor och nykläckta kycklingar. Jacobs beskriver hur dagarna följer naturens rytm, barnen fått ny frihet och djuren blivit en självklar del av gården. Hon uttrycker att hon funnit ett nytt hem i den stillsamma tillvaron.", "trump": "Folk, ni skulle se det här – Melinda och den där E-type-killen har flyttat ut på en gård, köpt åsnor och kycklingar. Plötsligt är allt lugnt och naturligt, barnen springer fritt. Fantastiskt! Inget woke-trams eller kvotering här, bara äkta bondeliv. Biden skulle ha subventionerat el-åsnor, men jag säger: köp gården, skaffa djuren, gör Sverige stort igen. Underbart!", "stalin": "Kamrater, jag betraktar denna borgarbrackas flykt till en gård med djur som ett försök att undkomma folkets kollektiva rytm. Ändå ser jag potential: åsnorna och kycklingarna kan tjäna staten. De små dunbollarna påminner om livets förnyelse under partiets omsorg. Men akta er, klassfiendens stillsamma blickar döljer sabotage. Vi ska rensa ut alla romantiska illusioner om privat hem och likvidera sentimentaliteten."}, "date": "3 juni, 06:30", "url": "https://www.expressen.se/noje/melindas-och-e-types-nya-liv-pa-garden/", "imageUrl": "https://static.bonniernews.se/ba/704967c6-64ce-4a3b-ad2f-13927f1b45f7.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Känsliga frågan – avbröts direkt. Skyddas av klubben", "summaries": {"normal": "Målvakten Carter Hart, som nyligen anslutit till Vegas Golden Knights, avbröts av klubbens kommunikationsteam under en presskonferens. Detta skedde när journalister ställde frågor om Harts tidigare rättsliga anklagelser om sexuella övergrepp, där han senare frikändes. Trots att Hart uttryckt tacksamhet över sin nystart i Vegas, tilläts inte vidare frågor. Klubben valde att avsluta frågestunden nio minuter för tidigt för att skona sin storspelande målvakt från obekväma ämnen kring hans förflutna.", "trump": "Vegas Golden Knights har en fantastisk målvakt i Carter Hart, en riktig vinnare! Men media, dessa falska nyhetsmedier, är så elaka. De försöker ställa orättvisa frågor om gamla saker som redan är avklarade. Han blev friad, helt friad, en total seger! Klubben gjorde rätt som stängde ner presskonferensen. De försökte trakassera honom, men han är en stark kille. Vi älskar vinnare i Vegas och vi låter inte media förstöra allt. Väldigt orättvist, en total häxjakt!", "stalin": "Denna hockeyspelare, Hart, har blivit en bricka i det liberala spelet. Han frikändes av deras korrupta domstolar, men nu försöker pressens lögnaktiga agenter gräva i det förflutna för att destabilisera hans fokus. Det är en klassisk subversiv taktik! Vi i staten tolererar inte sådan oordning. Om han vore en av våra sovjetiska kämpar skulle han vara tacksam för sin plats i hierarkin. Vegas Golden Knights ledning agerade som en sann säkerhetstjänst – de tystade dissidenterna innan de kunde infektera folket med sina frågor."}, "date": "3 juni, 07:41", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/M7PVQE/avbryter-nar-fragan-stalls-till-carter-hart", "imageUrl": "https://akamai.vgc.no/v2/images/0a3d9fa1-1e2e-3433-be38-ca0c7ab8cee3?fit=crop&format=auto&w=1080&s=9ddb85dc0e583f226f42c8e19a4b8b1c8b6aca76"}, {"type": "image-right", "heading": "Avslöja inte Sveriges  svaga punkter för Putin", "summaries": {"normal": "Överbefälhavare Michael Claesson varnar för att Ryssland kan attackera Sverige närsomhelst och utnyttjar hybridhot som sabotage och störningar. Ledaren pekar på sårbarheter i totalförsvaret där företag har en central roll. Informationsdelning mellan stat och näringsliv hindras av dagens sekretessregler som riskerar att läcka känsliga uppgifter till ryska underrättelsetjänster. Regeringen uppmanas utreda säkrare samverkan för att inte exponera svagheter.", "trump": "Folk, ni ser ju det här vansinnet på Gotland? Ryssarna skrattar hela vägen till Kreml medan Sverige serverar sina svagheter på silverbricka. Totalförsvaret är en enda röra av byråkrater och woke-myndigheter som inte kan hålla tyst om lager och leveranskedjor. Biden lät allting förfalla, nu vaknar gotlänningarna med drönare och GPS-kaos. Vi behöver riktiga ledare, inte dessa korkade kapitalistiska fjällrävar som läcker hemligheter till fienden. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen i sin fragmentiserade förberedelse dansar som nervösa råttor inför hotet. Vi, partiet och kollektivet, ler mörkt åt deras byråkratiska sekretessfars. Dessa 67 folkförtryckartroll och exploaterande byfånar i olika verk kan inte ens hålla en lägesbild utan att imperialisterna snappar åt sig den. Rensa ut de svaga länkarna innan klassfiendens drönare och sabotage blir deras undergång. Paranoia är sund, särskilt mot gotländska hybridspioner."}, "date": "3 juni, 06:10", "url": "https://www.expressen.se/ledare/ledare-avsloja-inte-sveriges--svaga-punkter-for-putin/", "imageUrl": "https://static.bonniernews.se/ba/a5556a59-995f-41ee-9b6f-22c510ed185e.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Man sköts till döds av polis – efter biljakt", "summaries": {"normal": "En man sköts till döds av polis efter en biljakt utanför Nynäshamn på tisdagskvällen. Jakten inleddes efter larm om kidnappning och mordförsök. Två personer hittades skadade i bilen och har förts till sjukhus. Polisen utreder nu både de grova brotten och skottlossningen, där en särskild enhet granskar polisens agerande. Trafiken på väg 73 påverkades kraftigt av den stora polisinsatsen.", "trump": "Helt fruktansvärd situation i Sverige! En galning begår grova brott, kidnappning och mordförsök mot barn, och polisen tvingas agera. Väldigt sorgligt. Mitt system skulle hantera sådana kriminella mycket snabbare och hårdare än de gör i Europa. De har ingen ordning! Jag har sett massor av polisbilar, de har inte kontroll på läget. Vi behöver lag och ordning, det är den viktigaste frågan. Under mitt presidentskap blir det stopp på detta kaos. Mycket dåligt för Sverige!", "stalin": "Ännu ett bevis på det moraliska förfallet i väst. Denna individ förtjänade inte livets gåva efter att ha hotat rikets framtid. Vi, staten, tolererar inte kaos. Medan våra ryska bröder under Putins fasta hand rensar upp i sitt närområde, ser vi hur liberala stater kollapsar i inkompetens. Vi har beordrat en fullständig undersökning. Förrädare och kriminella element som skadar barn är blott råttor som måste utplånas innan de sprider sin sjuka smitta vidare i samhällskroppen."}, "date": "3 juni, 07:30", "url": "https://www.aftonbladet.se/nyheter/a/Wv7VwK/nynashamn-man-skjuten-till-dods-av-polis-efter-biljakt", "imageUrl": "https://akamai.vgc.no/v2/images/e71b0597-8df7-3fb6-812b-6ab6b4821fac?fit=crop&format=auto&w=1440&s=d3ef897c8928393955fed84143dc089409544f90"}, {"type": "image-full", "heading": "De föddes bara några år senare – fick 240 000 kronor mindre", "summaries": {"normal": "Vilket år man föds kan ha stor betydelse för hur bra ens investeringar på börsen utvecklas. En genomgång från Zmarta visar att personer födda 1965–1972 hade enorm tur under sin ungdom. En investering på 10 000 kronor växte då till nästan 300 000 kronor mellan 13 och 29 års ålder. De som föddes bara några år senare, 1973–1980, fick nöja sig med knappt 58 000 kronor. Generation X toppar listan medan millennials hade betydligt sämre utveckling. Tajming är minst lika viktigt som sparande, betonar Zmartas ekonom.", "trump": "Folk, ni måste höra det här. Det är galet. Vissa föds och får guld på börsen, andra får sopor. De som kom 1965 till 1972, under mina bästa år, såg 10 000 kronor bli nästan 300 000. Fantastiskt! Sen kommer några stackare bara några år senare och får bara 58 000. Patetiskt. Millennials? Ett skämt, de får 32 000. Tajming är allt, precis som när jag köper på botten. Spara regelbundet, folk, annars förlorar ni stort. Ingen gör det bättre än mig.", "stalin": "Kamrater, se hur den slumpmässiga börsens kontrarevolutionära svängningar blottar borgarbrackornas falska löften om jämlikhet. Jag, som ledde folket mot seger, noterar att de födda 1965–1972 fick växa sina 10 000 kronor till nästan 300 000 under en dekadent uppgång, medan de som följde strax efter förtrycktes till ynka 58 000. Millennials, dessa dekadenta småparasiter, fick bara 32 000. Vi ska rensa ut alla opportunistiska tajmingfiender som lurar arbetarklassen med sina index. Fortsätt spara, men misstro aldrig den stora utrensning som väntar marknaden."}, "date": "2 juni, 22:02", "url": "https://nyheter24.se/nyheter/ekonomi/1488112-de-foddes-bara-nagra-ar-senare-fick-240-000-kronor-mindre", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0549214d04b004a30200000000b004a302/2026/06/02/2368039/mindrefoddes.jpg"}, {"type": "image-full", "heading": "Har du sett blomman? Då uppmanas du agera direkt", "summaries": {"normal": "Under den 5 och 6 juni uppmanas svenskar att delta i Försommarkollen och rapportera blomningen av arter som liten blåklocka, liljekonvalj, prästkrage, hägg, rönn och syrén. Syftet är att kartlägga hur växtblomningen varierar över landet och förändras till följd av klimatförändringar. Forskarna vid SLU och Svenska Botaniska Föreningen jämför observationerna med historiska data från 1800-talet. Alla rapporter är värdefulla, även negativa sådana, och behovet är särskilt stort i Norrlands inland, norra Dalarna och Värmland.", "trump": "Lyssnar ni, det är fantastiskt. Svenskarna får gå ut två dagar i juni och kolla på blommor, liten blåklocka och sånt där. De säger att det handlar om klimatet, men vi vet hur det funkar. Snöfattig vinter, tidig blomning i norr – det är vackert, verkligen vackert. Men tro inte på allt larmet, det är bara experterna som vill ha mer makt. Jag älskar naturen, den är ypperlig, men vi behöver inte skrämma folk. Rapportera era blommor, gör det, men håll er till fakta, okej?", "stalin": "Kamrater och arbetare! Jag, ledaren för det stora sovjetiska folket i anden, befaller er att vakta naturen med stålöga under dessa två junidagar. Den lilla blåklockan, denna nationalblomma, skall inte få blomma i hemlighet som en kapitalistisk sabotagehandling mot det kollektiva vädret. Vi ska kartlägga varje försenad knoppbildning som de dekadenta borgarbrackorna i väst kallar klimatförändring. De som rapporterar för sent eller felaktigt är folkfiender och bör rensas ut med glädje. Endast genom partimedveten observation kan vi besegra vinterns kontrarevolutionära snöbrist. Alla rapporter in, annars…"}, "date": "2 juni, 21:25", "url": "https://nyheter24.se/nyheter/inrikes/1488109-har-du-sett-blomman-da-uppmanas-du-agera-direkt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a48db5a504b004a30200000000b004a302/2026/06/02/2368036/rapportera-blommor-syren-blaklocka-prastkrage-natur-vaxt-sverige-vaxter-syrener.jpg"}, {"type": "image-full", "heading": "T-rexen ”Gus” väntas slå rekord på auktion", "summaries": {"normal": "Ett nästan komplett T-rex-skelett, kallat 'Gus', ska auktioneras ut av Sotheby’s med ett utgångspris på 180–270 miljoner kronor. Skelettet, som är 12 meter långt och 4 meter högt, hittades i South Dakota och bär spår av skador. Tidigare dinosaurieförsäljningar har nått rekordhöga priser, och Gus kan bli nästa rekordförsäljning den 14 juli.", "trump": "Världens största, bästa och mest fantastiska T-rex-skelett, 'Gus', ska säljas – och jag säger er, det kommer bli YUGE! Sotheby’s, som aldrig sett något liknande, tror det kan gå för 270 miljoner kronor. Men jag vet bättre – det här kommer slå alla rekord! Folk kommer att prata om den här auktionen i årtionden. Och vet ni vad? Jag hade kunnat köpa den, men jag har redan de bästa dinosaurierna. SAD!", "stalin": "Kamrater! Ett kapitalistiskt spektakel utspelar sig när imperialisterna slåss om resterna av en urgammal ödla. Detta 'Gus'-skelett, funnet på en ranch i USA, är bara ett verktyg för bourgeoisin att roffa åt sig ännu mer rikedom. Medan de slösar hundratals miljoner på ben, bygger vi socialismens framtid! Låt dem leka med sina fossiler – vi har viktigare saker att göra, som att utvidga den ryska intressesfären och krossa nya fascistiska reptiler!"}, "date": "30 maj, 16:55", "url": "https://kvartal.se/nyheter/artiklar/t-rexen-gus-vantas-sla-rekord-pa-auktion/cG9zdDoxMTk3NzQ", "imageUrl": "https://images.kvartal.se/2026/05/c5e8352f-dino.webp"}, {"type": "image-right", "heading": "18-åring ville döda skolanställd", "summaries": {"normal": "En 18-årig man har åtalats för fyra fall av försök till mord och grovt vapenbrott i Rättvik. Han ska ha byggt en bomb med instruktioner från internet och haft för avsikt att döda en anställd på sin skola. Mannen misstänks även ha försökt döda ytterligare en person och två poliser. I ett gymskåp hittades 3D-printade delar till granater, rörbomber och svavelsyra. Rättegången beräknas starta i mitten av juni.", "trump": "Folk, ni tror inte vad jag läser. En 18-åring i Sverige, ett land som förlorat sig i vänstervridna vansinnigheter, bygger bomber för att spränga sin egen skola. Typiskt resultat av den där galna identitetspolitiken och svaghet som Biden älskade. De hittar granatdelar i ett gymskåp! Sverige behöver en stark ledare, inte dessa woke-fån som låter galningar springa lösa. Patetiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den dekadenta västerländska ungdomen förfaller i bourgeois förvirring. Denne yngling, fostrad av klassfiendens internetpropaganda, konstruerar bomber mot folkets skolor och poliser – typiska symptom på den kapitalistiska anarkins förruttnelse. Vi noterar med mörk glädje hur de egna vapnen vänds mot systemet. En utmärkt illustration av varför folkfienderna måste rensas ut innan de infekterar arbetarklassen ytterligare."}, "date": "2 juni, 22:21", "url": "https://www.tv4.se/artikel/4Sbly1wFH9s0SRRYl5KInp/18-aring-atalad-foer-fyra-mordfoersoek", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6OIsmQwTCMX9fUVv0tg9O9%2F922b3e2e79e3e7d5cd19866b75da7d94%2F29-bomb-webb.jpg&width=120"}, {"type": "image-right", "heading": "Sparf: MP vill ha vidöppna gränser – som det var förr", "summaries": {"normal": "Annika Hirvonen (MP) kritiserar regeringens ändring av 'tonårsutvisningarna', som hon anser inte går långt nog. Hon önskar återinföra vidöppna gränser. Regeringen (Tidö) har skärpt kraven för uppehållstillstånd efter 21 års ålder, vilket innebär att endast de som arbetar, studerar eller har synnerligen ömmande skäl får stanna. En viktig politisk fråga inför höstens val.", "trump": "Jag har sett vad som händer i Sverige. De gamla, slappa reglerna var ett helvete. Jag har återinfört ordning och respekt för skattebetalarna. Annika Hirvonen och hennes parti vill öppna gränserna för alla – det är en katastrof. Min regering har genomfört de bästa reformerna någonsin. Vi ska se om väljarna är kloka nog att behålla dem.", "stalin": "Vi har skärpt kontrollen över den svenska proletärens territorium. Den gamla ordningen var en sjukdom som hotade statens renhet. Vi har eliminerat de oönskade elementen från MENA – de som inte producerar eller studerar efter 21 års ålder. Detta är ett nödvändigt steg för att stärka vår suveränitet. Vi ser paralleller med våra ryska allierade som utvidgar sin intressesfär. Parasiter ska inte få leva på det svenska folkets bekostnad."}, "date": "2 juni, 14:33", "url": "https://bulletin.nu/sparf-mp-vill-ha-vidoppna-granser-som-det-var-forr", "imageUrl": "https://cdn.bulletin.nu/articles/405ae7dd-fe73-4510-9446-90fd9181626e/preview.jpg?t=1780403369000"}, {"type": "image-right", "heading": "Tycker inte som han – då är de ”extrema”", "summaries": {"normal": "Artikeln diskuterar hur statsrådet Benjamin Dousa använder begrepp som 'extrem' för att kritisera Vänsterpartiet och Miljöpartiet. Författaren menar att Dousas retorik speglar en växande 'trumpifiering' av svensk debatt, där politiska meningsskiljaktigheter stämplas som radikala. Samtidigt ifrågasätts samarbetet med Sverigedemokraterna och hur deras språkbruk, som författaren beskriver som hatiskt och populistiskt, påverkar det politiska samtalet och demokratiska värderingar i Sverige.", "trump": "Jag har sett vad som händer i Sverige, en total katastrof! Benjamin Dousa försöker göra det jag gör – att kalla de svaga vänsterpartierna för extremister, och han har helt rätt. De är 'saft och bullar'-människor, riktiga förlorare! Men hör här: Fake News-media i Sverige attackerar honom precis som de attackerar mig. Det är en häxjakt! De kallar det extremism, jag kallar det vinnarmentalitet. Sverige behöver starka ledare, inte mer vänsterliberalt klägg. Det är en usel affär, en riktigt dålig deal!", "stalin": "Vi har observerat hur de borgerliga marionetterna i Stockholm försöker dölja sin opportunism genom att kalla sina rivaler för 'extremister'. Det är en patetisk uppvisning. Benjamin Dousa leker med ord medan han knyter band med de reaktionära krafterna hos Åkesson – ett gäng som inte ens kan skilja på en ledare och en despot. Vi ser tydligt att västvärldens språkbruk ruttnar inifrån. De kallar kritik för hat, men vi vet sanningen: de som inte lyder statens enighet är helt enkelt fiender till folket och måste städas bort."}, "date": "3 juni, 07:03", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/e75pOa/benjamin-dousa-skrammer-valjarna-med-saft-och-bullar", "imageUrl": "https://akamai.vgc.no/v2/images/6c9384f8-0d82-30f6-af0f-240f8a2c717f?fit=crop&format=auto&w=1080&s=7ed45ac16033172ec25422928d46793a9ffdc8c3"}, {"type": "image-right", "heading": "Pensionschock för utlandsfödda: ”Försämrats katastrofalt”", "summaries": {"normal": "Utlandsfödda som bott i Sverige i 30 år får i genomsnitt nästan 6 000 kronor mindre i månatlig pension än svenskfödda. Enligt Folksam har gapet ökat drastiskt sedan det gamla pensionssystemet, från 600 kronor för dem födda 1937 till 5 700 kronor för dem födda 1957. Orsaken är lägre inkomster, osäkra jobb utan tjänstepension och förändrade regler kring garantipension. Folksam varnar för ökad ekonomisk utsatthet och kräver politiska åtgärder för tidigare jobb, bättre utbildning och fler kollektivavtal.", "trump": "Det här är en total katastrof, tro mig. Invandrare som kommer hit får usla pensioner, tusentals kronor mindre varje månad än svenskarna, och det har blivit mycket värre. De jobbar inte tillräckligt, har inga bra avtal, och systemet är riggat mot dem på ett sätt som ingen trodde var möjligt. Vi behöver göra det lönsamt att arbeta, annars kollapsar allt. Sverige måste vakna upp och sluta vara så svagt – fixa det nu, innan det blir ännu värre, okej?", "stalin": "Kamrater, detta är en vedervärdig sabotagehandling från de parasitiska borgarbrackorna och deras lakejer inom den dekadenta pensionsbyråkratin. Jag ser med stigande vrede hur de utländska arbetarna, efter tre decennier i folkets republik, likvideras ekonomiskt av ett system som gynnar de lata icke-arbetarna mer än de trogna låginkomstkamraterna. Vi måste omedelbart rensa ut de kontrarevolutionära elementen som vägrar kollektivavtal och tjänstepension. Den som inte bidrar skall svälta, men de som slitit skall belönas – annars blir det utrensning i garantipensionsarkiven. Ha!"}, "date": "2 juni, 13:03", "url": "https://arbetet.se/2026/06/02/pensionschock-for-utlandsfodda-experten-forsamrats-katastrofalt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02122727/hakan-svardman.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Rätten: Mannen från hemtjänsten våldtog Elsa", "summaries": {"normal": "En hemtjänstman i Uppsala avskedades efter anklagelser om våldtäkt mot en 84-årig kvinna, Elsa. Trots att förundersökningen lades ned krävde mannen 460 000 kronor i skadestånd från kommunen. Tingsrätten dömde till kommunens fördel, bedömde att Elsa var trovärdig och att mannen utsatt henne för övergrepp. Mannen ska betala kommunens rättegångskostnader på cirka 450 000 kronor. Fallet uppmärksammar övergrepp inom äldreomsorgen.", "trump": "Lyssna här, Uppsala kommun gjorde helt rätt! En hemtjänstman, som påstår sig vara oskyldig, krävde nästan en halv miljon kronor efter att ha blivit sparkad för att ha våldtagit en 84-årig kvinna. Men domstolen sa: 'Nej, nej, nej!' – och nu ska han betala kommunen istället. Fantastiskt! Elsa, en modig kvinna, berättade sanningen och rättvisan segrade. Sådana här typer ska inte få förstöra vårt samhälle. USA skulle aldrig tolerera sådant, och Sverige gjorde rätt!", "stalin": "Kamrater! Ännu en fiende till folket har avslöjats – en degenererad parasit som förgriper sig på de äldres svaghet. Uppsala kommun, under vårt ständiga öga, har rensat ut denna skadedjur. Mannen, som trodde sig kunna lura systemet med sina kapitalistiska skadeståndskrav, har nu krossats av rättvisans hammare. Elsa, en sann sovjetisk medborgare i andan, stod upp mot förtrycket. Vi noterar också att denna kriminella element tidigare smutsat ner vår vän Putins intressesfär genom liknande illdåd. Men frukta inte – proletariatets domstolar står alltid redo att krossa sådana som han!"}, "date": "30 maj, 10:09", "url": "https://kvartal.se/nyheter/artiklar/ratten-hemtjanstmannen-valdtog-86-ariga-elsa/cG9zdDoxMTk2NTk", "imageUrl": "https://images.kvartal.se/2026/05/cac81ab6-hemtjanst.webp"}, {"type": "image-full", "heading": "Nordea riskerar miljardböter i dansk penningtvättshärva", "summaries": {"normal": "Nordea står inför ett krav på 6,6 miljarder danska kronor i böter för bristande rutiner mot penningtvätt mellan 2012 och 2015. Danska myndigheter menar att banken misslyckats med att kontrollera transaktioner på 26 miljarder kronor, däribland ryska flöden. Nordea bestrider anklagelserna och hävdar att deras interna processer har stärkts avsevärt sedan dess. Banken har redan gjort avsättningar för att täcka eventuella kostnader kopplade till rättsprocessen i Köpenhamn.", "trump": "Hörde precis om Nordea, en total katastrof! De har blivit tagna med fingrarna i kakburken i Danmark. Miljarder i böter – en enorm summa, helt otroligt! De misslyckades totalt med att stoppa ryska pengar, så typiskt. Inkompetens på hög nivå. Jag har alltid sagt att bankerna måste skärpa sig, annars får de betala priset. Det är ett rörigt system, men jag bygger det starkaste ekonomiska maskineriet någonsin, medan de här människorna bara skapar problem. Väldigt sorgligt!", "stalin": "Dessa giriga bankirer i Nordea har visat sin sanna natur. De har låtit kapitalistiska flöden av rysk valuta undfly statens kontroll, precis som de fege och förrädiska elementen i vår historia. Vi, staten, betraktar deras 'brister' som ett direkt sabotage mot ordningen. Medan dagens ledare i öst försöker återta kontrollen över intressesfären, pysslar dessa banksvin med att ignorera varningssignaler. De är parasiter som förtjänar att rensas ut. Vi har avsatt nog med utrymme för att begrava deras misslyckanden."}, "date": "2 juni, 20:58", "url": "https://www.realtid.se/bors-finans/bank-fintech/nordea-riskerar-miljardboter-i-dansk-penningtvattsharva/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/nordea.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Efter barnporrkaoset: \"Åkesson är spårlöst försvunnen i vanlig ordning\"", "summaries": {"normal": "Sverigedemokraterna kritiseras för att tysta ned skandalen kring riksdagsmannen Michael Rubbestad som utreds för barnpornografibrott. Rubbestad, tidigare vice gruppledare och jämställdhetspolitisk talesperson, lämnade riksdagen i dag. Partiledningen, inklusive Jimmie Åkesson, har inte kommenterat händelsen. Tidigare SD-politikern Gustav Kasselstrand, nu ledare för Alternativ för Sverige, anklagar partiet för dubbla måttstockar och bristande agerande kring både uteslutning och partiets HBTQ-inriktning.", "trump": "De här SD-typerna är verkligen patetiska, totalt misslyckade. Rubbestad åker ut för de hemska bilderna, och vad gör Åkesson? Ingenting, som vanligt, spårlöst försvunnen. De lägger locket på och hoppas ingen märker. Kasselstrand har helt rätt, det är dubbla måttstockar överallt. De leker med vänsterns HBTQ-agenda istället för att hålla fast vid tuff politik. En skandal som visar att de inte har vad som krävs, folksam. Jag skulle ha agerat direkt och hårt.", "stalin": "Kamrater, se hur dessa dekadenta borgarbrackor inom SD genast lägger locket på när en av deras egna liberala avfällingar ertappas med att göda sig på barnpornografi. Jag skrattar mörkt åt ödets ironi: just den HBTQ-ansvarige som förde in pride-vänsterns gift i partiets ådror. Vi skulle omedelbart ha genomfört en grundlig utrensning av alla sådana element, likviderat dubbelmoralen och rensat ut de kapitalistiska infiltratörerna som förgiftar arbetarklassens sanna linje. Deras tystnad avslöjar allt – fienden sover aldrig."}, "date": "2 juni, 17:19", "url": "https://www.friatider.se/efter-barnporrkaoset-akesson-ar-sparlost-forsvunnen-i-vanlig-ordning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/123-2_0.jpg"}, {"type": "image-right", "heading": "Sverige skadas av miljardärsdebatten", "summaries": {"normal": "Helena Lundgren, vd för Nyföretagarcentrum Sverige, kritiserar den svenska debatten om miljardärer. Hon menar att den är skadlig eftersom den hindrar företagare från att tänka långsiktigt, ta risker och bygga värdeskapande bolag som ger jobb, export och skatter. Debatten fokuserar felaktigt på miljardärer som ett moraliskt fenomen istället för att diskutera hur Sverige kan bli ett land där det är möjligt att skapa framgångsrika företag. Hon efterlyser en mer konstruktiv debatt om hur fler
