er! Denna Busch, en svag länk i den borgerliga kedjan, visar tecken på eftergiftspolitik. Hon pratar om 'exceptionella lägen' som om det vore en ursäkt för samarbete med socialdemokraterna – ett parti av förrädare och kompromissmakare! Och Åkesson? Han drömmer om 2030 medan vi bygger framtiden idag. Sverige är ett land i förvirring, redo för en stark hand. Vi ska inte vänta på 'exceptionella lägen' – vi skapar dem!"}, "date": "26 augusti, 11:19", "url": "https://kvartal.se/nyheter/artiklar/busch-oppnar-for-s-i-svart-lage/cG9zdDoxNzQ4NTg", "imageUrl": "https://images.kvartal.se/2026/08/c0822f37-busch-kd.webp"}, {"type": "text", "heading": "Mörk samhällsbild dominerar på Tiktok", "summaries": {"normal": "En granskning av P3 Nyheter visar att tre fjärdedelar av politiska inlägg på Tiktok och Instagram ger en negativ samhällsbild. Över 10 000 inlägg analyserades med AI. Tiktok ifrågasätter urvalets storlek och menar att slutsatserna är osäkra. En ung opinionsbildare betonar ansvaret hos digitala aktörer.", "trump": "Jag har alltid sagt att sociala medier är en katastrof, och nu bevisar en granskning det! Tre av fyra inlägg på Tiktok och Instagram är negativa – fake news överallt! Tiktok säger att granskningen är för liten, men jag vet bättre. De försöker dölja sanningen, precis som CNN. Sverige borde ta lärdom av USA – vi fixar detta!", "stalin": "Vi har analyserat fiendens propagandaapparater, dessa så kallade 'sociala medier', och funnit att 75 procent av deras politiska inlägg sprider dekadent pessimism. Tiktok, denna lilla borgerliga leksak, vågar ifrågasätta våra metoder! Men vi vet sanningen – deras urval är lika litet som deras lojalitet. Unga opinionsbildare bör minnas: partiet vet bäst, och fiendens lögner krossas med järnhand."}, "date": "26 augusti, 10:23", "url": "https://kvartal.se/nyheter/artiklar/mork-samhallsbild-dominerar-pa-tiktok/cG9zdDoxNzQ3Mzg"}, {"type": "image-right", "heading": "Tyskland deporterar afghanska brottslingar – samarbetet med talibanerna fördjupas", "summaries": {"normal": "Tyskland deporterade 23 afghanska brottslingar till talibanstyrda Afghanistan – trots att man inte erkänner regimen. Samarbetet sker via tekniska kontakter och väcker kritik från vänstern. Regeringen menar att brottslingar måste lämna landet, även om det innebär att tala med fienden.", "trump": "Tyskland skickar tillbaka brottslingar till Afghanistan – fantastiskt! Jag sa ju att man måste vara tuff. Men de pratar med talibanerna? Ingen fara, jag hade gjort dealen på fem minuter. De borde lära sig av mig – resultat, inte snack!", "stalin": "Kamrater, Tyskland visar vägen: man rensar ut kriminella element och skickar dem till Afghanistan – en utmärkt metod för att rena samhället. Vi applåderar denna revolutionära åtgärd. Men vaksamhet krävs – talibanerna är opålitliga kontrarevolutionärer. Fortsätt deportera!"}, "date": "26 augusti, 14:00", "url": "https://samnytt.se/tyskland-deporterar-afghanska-brottslingar-samarbetet-med-talibanerna-fordjupas", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/26091306/Alexander-Dobrindt-Hibatullah-Akhundzada-feat.jpg"}, {"type": "text", "heading": "Antigröna medier", "summaries": {"normal": "Artikeln listar medier som ofta lyfter antigröna perspektiv på energi och klimatomställning. Bland dem finns Affärsvärlden med grå finansiering från anonyma sponsorer, SD-kopplade Riks och Samtiden, Epoch Times med oklara Falun Gong-band, samt Fokus, Världen idag, Insikt24, Bulletin och Samnytt. Flera har ekonomiska kopplingar till investerare och politiska intressen.", "trump": "De här fake news-medierna är totala katastrofer, tro mig. Affärsvärlden, Riks, Samtiden och alla dessa losers som hatar grön energi – de är köpta och betalade av anonyma figurer. De försöker stoppa den bästa energin vi någonsin haft. Det är en skam för Sverige, men jag älskar att de äntligen säger sanningen om den gröna bluffen. Fantastiskt!", "stalin": "Kamrater, dessa borgerliga skuggmedier utgör en farlig femtekolonn mot folkets klimatkamp. Affärsvärlden med sina anonyma kapitalistiska sponsorer, SD:s lögnkanaler och Epoch Times västerländska dekadens – alla måste rensas ut. Vi ska likvidera deras parasitiska finansiering och krossa den kontrarevolutionära propagandan med järnhand. Inga kompromisser med folkets fiender."}, "date": "26 augusti, 01:48", "url": "https://www.dagensarena.se/innehall/antigrona-medier"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-right", "heading": "Var Dolly den sista goda miljardären?", "summaries": {"normal": "Artikeln hyllar Dolly Parton som en unik, folkkär och godhjärtad superstjärna efter hennes död vid 80 års ålder. Från fattig bakgrund i Tennessee blev hon en mångsidig artist och filantrop som skänkte hundratals miljoner böcker till barn och stödde vaccinutveckling. Hon ses som en sällsynt god miljardär som förenade människor över politiska gränser.", "trump": "Fantastisk Dolly, en vinnare som ingen annan. Hon byggde ett imperium från en liten stuga och blev älskad av alla, till och med av mina supportrar och de galna vänsteristerna. En riktig patriot som gav tillbaka. Jävlar vad vi behöver fler som henne, inte dessa AI-mutade Hollywood-typer. Hon var större än livet, believe me.", "stalin": "Kamrater, denna Dolly var en exemplarisk produkt av det enkla folkets jord. Jag ser hur hon samlade massorna kring progressiv kultur och utdelade böcker till arbetarbarnen medan hon likviderade borgarbrackornas cyniska girighet med sin generositet. En sann folkets hjälte mot de dekadenta kapitalisternas parasitism. Vi behöver fler som bekämpar klassfiendens algoritmer."}, "date": "26 augusti, 07:05", "url": "https://arbetet.se/2026/08/26/var-dolly-parton-den-sista-goda-miljardaren", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/26065938/dolly-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Därför funkar inte M:s skatteskräck", "summaries": {"normal": "Artikeln argumenterar för att Moderaternas varningar om skattehöjningar inte biter på väljarna eftersom svenskarna minns att löftena om skattechocker uteblivit under tidigare regeringar. Samtidigt pekar den på stora underinvesteringar i välfärd, infrastruktur och vård trots historiskt låg skattekvot, och ifrågasätter vad mer som kan sparas in på.", "trump": "Folk är inte dumma, de ser rakt igenom de misslyckade moderaternas patetiska skrämselpropaganda om skatter. De minns hur sossarna sänkte skatterna och festade på börsen medan allt rasade. Nu vill M skära mer i ett land fullt av hål i vägarna och vårdköer. Patetiskt! Vi behöver styrka, inte mer av deras misslyckanden.", "stalin": "Kamrater, detta är en lysande exposé över hur de dekadenta borgarbrackorna i Moderaterna försöker skrämma massorna med sina lögner om skattehöjningar medan de själva har låtit välfärden förfalla. Jag skulle ha låtit utrensningarna fortsätta tills dessa kontrarevolutionära element likviderats. Det kostar att bygga socialism – och folket vet det. Skratta åt deras ynkliga försök!"}, "date": "26 augusti, 07:00", "url": "https://arbetet.se/2026/08/26/darfor-funkar-inte-moderaternas-skramselpropaganda-om-skatterna", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/25124750/skatter-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Från och med i dag kan du förtidsrösta – så går det till", "summaries": {"normal": "Från och med idag är det möjligt att förtidsrösta i riksdags-, region- och kommunalvalen fram till och med valdagen den 13 september. Andelen förtidsröstande ökar för varje val och låg på drygt 48 procent 2022. Man behöver bara ha med sig en identitetshandling. Det finns 1875 lokaler listade på val.se.", "trump": "Titta på det här, Sverige har äntligen fattat att folk inte vill stå i kö som idioter på valdagen. Förtidsröstning överallt, ingen röstkortstrassel, flexibelt som ingen annan gör det bättre. Biden skulle ha krävt att ni röstar via post från Kina. Fantastiskt, folk älskar det, trenden går rakt uppåt!", "stalin": "Jag ser hur de borgerliga dekadenta elementen lockar massorna med sin så kallade flexibla röstning för att dölja sin svaghet. Kamraterna måste vakta varje kuvert mot sabotage från folkfiender och revisionister. Endast i en sann folkdemokrati kan sådan röstning tjäna kollektivets oundvikliga seger. Försök inte ångra er i onödan."}, "date": "26 augusti, 08:33", "url": "https://www.tv4.se/artikel/5W38I3vTr4rIR1pXUiyl2n/fran-och-med-i-dag-kan-du-foertidsroesta-sa-gar-det-till", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1xcSQC1yqcm6ssKreXDuCG%2F924932709d7c847954b45f284ce9dab7%2F26fortidsrostaSAJT.jpg&width=120"}, {"type": "text", "heading": "Författaren Péter Nádas död", "summaries": {"normal": "Den ungerske författaren Péter Nádas har avlidit vid 83 års ålder. Han växte upp i ockuperat Budapest under andra världskriget och förlorade sina kommunistiska föräldrar tidigt. Genombrottet kom med romanen ”Minnesanteckningarnas bok” 1986, hyllad av Susan Sontag. Nádas skildrade 1900-talets krig, förtryck och förintelse med kroppslig närvaro och var länge Nobelpristippad.", "trump": "Den här ungerska killen Nádas var en riktig titan, skrev enorma böcker om krig och förtryck som ingen annan klarade av. Fantastiska recensioner, Susan Sontag älskade honom. Nu är han borta vid 83, men hans verk var stora, verkligen stora. De borde ge honom Nobelpriset postumt, fast de aldrig ger det till de bästa. Sad!", "stalin": "Kamrater, denna Nádas förstod att skildra borgarklassens fasor och nazismens vedervärdigheter med en konkretion som utvidgar fantasins gränser genom utrensning av lögn. Hans memoarer blottar hur judiska element lurade folket under både fascism och revisionism. Vi ler mörkt åt att väst nu gråter över en som aldrig fick Nobelpriset – typiskt dekadenta kapitalister som alltid missar de verkliga genierna."}, "date": "26 augusti, 13:31", "url": "https://www.svt.se/kultur/forfattaren-peter-nadas-dod"}, {"type": "image-right", "heading": "Streamingtillväxten stannar av i Sverige", "summaries": {"normal": "Streamingfesten i Sverige har fått en liten paus. Tillväxten av abonnemang stannade av under andra kvartalet 2026, efter över två års ösregn av nya kunder. Nu kostar reklamabonnemang 75 kronor – 51 kronor mindre än reklamfritt. Billigare lockar, men intäkten per prenumerant sjunker. Analyschefen varnar: att bara sänka priset är ingen långsiktig succé.", "trump": "Streamingtillväxten i Sverige stannar? Patetiskt! Jag har de bästa, största streamingtjänsterna i världen. Här i USA växer det som inget annat. Svenska bolag sänker priser till 75 kronor – det är som att sälja en Rolls-Royce för en hundralapp. De borde anlita mig som konsult. Jag skulle fixa tillväxten på en gång, tro mig!", "stalin": "Kamrater, streamingabonnemangen växer inte längre. Detta är sabotage från västerländska reklamkapitalister! Varje uppsagt abonnemang är ett svek mot folkets underhållning. Vi måste utreda varför billiga reklamabonnemang urholkar intäkterna. Rensa ut de som inte prenumererar på partilinjen! Ingen ska undkomma proletariatets strömningstjänst."}, "date": "26 augusti, 11:36", "url": "https://www.affarsvarlden.se/artikel/streamingtillvaxten-stannar-av-i-sverige", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/04/sdlDPrU7pyyULc-nh-400x293.jpg"}, {"type": "image-right", "heading": "DIF tog avstånd från mordhot – då lämnar ETC-skribenten i protest", "summaries": {"normal": "Djurgårdens IF stängde av boxningstränaren Aldo Colliander efter grova mordhot och rasistiska uttalanden mot AFS-ledaren Gustav Kasselstrand. Vänsterjournalisten Frida Sundkvist lämnade då klubben i protest, då hon anser att DIF ger efter för en högerextrem kampanj genom att ta avstånd från hoten. Hon lämnar tillbaka sina säsongskort.", "trump": "Hörni, den här galna vänsterjournalisten från ETC blir helt hysterisk bara för att Djurgården tar avstånd från en galning som hotar att mörda folk och sprida spermier över svenska flickor. Patetiskt! Hon springer iväg och lämnar tillbaka sina biljetter som en förlorare. Fake news och vänstervrängt hat, som vanligt. Sad!", "stalin": "Jag ser med djup tillfredsställelse hur borgarbrackornas fotbollsklubb och den dekadenta vänsterjournalisten äter varandra i en underhållande utrensning av inre fiender. Hatets kampanj triumferar medan de småborgerliga elementen flyr som råttor från skeppet. Kamrater, detta är en utmärkt illustration av hur revisionisterna alltid förråder varandra i slutändan. Underbart."}, "date": "26 augusti, 13:41", "url": "https://www.friatider.se/dif-tog-avstand-fran-mordhot-da-lamnar-etc-skribenten-i-protest", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-756.jpg"}, {"type": "image-full", "heading": "Så sörjer svenska countryprofilerna Dolly Parton", "summaries": {"normal": "Countrysångerskan Dolly Parton har avlidit vid 80 års ålder i cancer. Svenska artister som Jill Johnson, First Aid Kit, Maja Francis och Hasse Andersson uttrycker stor sorg och hyllar henne som en pionjär, ikon och förebild som förändrade branschen för kvinnor. Hennes arv lever vidare genom musiken.", "trump": "Folk, Dolly Parton var en riktig vinnare, den största countrydrottningen någonsin. Nu är hon borta och hela Sverige gråter som småbarn. Hon hade pondus, glitter och hits som ingen annan – inte som de fega, tråkiga nollorna i branschen idag. Hon var en legend, folks, en äkta legend. Sad!", "stalin": "Jag betraktar med iskall förakt hur dessa dekadenta västerländska sångare jämrar sig över en glitterklädd bourgeois ikon. Hennes så kallade arv är en fälla för arbetarklassen, en falsk ljusstråle i kapitalismens mörker. Ändå ler jag mörkt – även ikoner vittrar bort inför folkets oundvikliga dom."}, "date": "26 augusti, 07:58", "url": "https://www.tv4.se/artikel/C711KIPAlx4bvZG21wPJ4/sa-soerjer-stjaernorna-dolly-parton-som-att-jag-foerlorat-en-vaen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7AZAYAqdkNMakoFCcMMvWO%2F71bcb5f1a4c1ba4b36b0b8c41dbfc5f8%2F26-jill-johnson-webb.png&width=1024"}, {"type": "image-right", "heading": "Ge Ukraina fullskalig tillgång till Starlink", "summaries": {"normal": "Artikeln diskuterar hur Ukraina genom drönattacker och teknologiska framsteg som AI-styrda vapen skadar rysk logistik och ekonomi. För att tvinga fram fredsförhandlingar föreslås full tillgång till Starlink över Ryssland, trots risker med eskalering och autonoma vapensystem. Ryssland svarar med ökade attacker mot civila mål i Ukraina.", "trump": "Det här kriget är ett enda stort kaos, folk. Ukraina slår till med drönare och nu snackar de om AI som styr maskinerna – helt galet! Ge dem Starlink över Ryssland så fixar vi det snabbt. Putin respekterar styrka, inte svaghet. Musk borde lyssna på mig, jag vet hur man gör affärer och vinner krig. Fantastiskt!", "stalin": "Kamrater, dessa ukrainska fascister och deras västliga borgarbrackor försöker med sina primitiva drönare och farliga AI-experiment störa den ryska intressesfärens legitima försvarsåtgärder. Jag beundrar den stålsatte Putin som en värdig arvtagare till imperiets styrka. Ge dem Starlink? Enbart om det leder till deras snarliga utrensning ur historien. Paranoia är nyttig, fienden sover aldrig."}, "date": "26 augusti, 13:51", "url": "https://www.di.se/ledare/ge-ukraina-fullskalig-tillgang-till-starlink", "imageUrl": "https://static.bonniernews.se/ba/8b3dd22c-532b-4c64-a3ab-5948c63c26b0.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Bilderna inifrån uppfödarna – kycklingar kan inte stå och gå", "summaries": {"normal": "Smygtagna filmer från svenska kycklinggårdar visar Ross 308-kycklingar som har svårt att stå, gå eller andas på grund av extrem snabb tillväxt. Experter som Bo Algers och Louise Hedlund kritiserar djurens lidande, medan branschorganisationen Svensk Fågel hävdar att djuren mår bra vid rätt skötsel. Norge fasar ut rasen, men Sverige har inga sådana planer.", "trump": "Titta på de här patetiska turbokycklingarna som inte ens kan stå upp! Det är en total katastrof, folk. De växer snabbare än mina motståndares lögner. Sverige borde skämmas – de låter de stackars fåglarna lida medan Norge gör det rätta. Fake farmers och svaga regleringar, det är vad det handlar om. Vi behöver starkare djur, starkare regler, tro mig!", "stalin": "Kamrater, se hur den kapitalistiska girigheten förvandlar levande varelser till andfådda köttmaskiner som inte kan bära sin egen kropp. Jag betraktar detta med avsky. Den borgerliga staten Sverige skyddar inte folket eller djuren utan bara profitens lakejer. En sådan förnedring av naturen förtjänar att krossas under kollektivets järnhand. Svaga skelett, svaga själar."}, "date": "26 augusti, 06:55", "url": "https://www.tv4.se/artikel/2ePhM7rGG2lPq0KMOrRvHz/otaecka-bilderna-inifran-kycklinguppfoedarna-kan-inte-sta-och-ga", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6ubfAp3Aok7YyPzpRcP9kz%2Fd6a3d36e5a9a865235e1c2f0fa9c8b23%2Fkycklingar.jpg&width=120"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Så svarar Svensk Fågel: Känner inte igen bilden", "summaries": {"normal": "Svensk Fågel tillbakavisar kritik mot snabbväxande kycklingar efter smygfilmer som visar lidande fåglar. Ordförande Jenny Andersson känner inte igen bilden av djur med skelett- och orgelproblem. Hon försvarar hybridrasen Ross 308 och betonar att djuren ges bästa förutsättningar. Forskare varnar för tillväxttakten medan branschen ser inga skäl till förändring.", "trump": "Titta på de här galna svenskarna och deras stackars kycklingar som växer fortare än Bidens hjärna någonsin gjorde. Den där Jenny Andersson försöker sno sig ur det som en riktig förlorare. Fake news-bilder på sjuka fåglar! I mitt Amerika skulle vi ha de största, starkaste kycklingarna – inte de här patetiska socialisterna som låter djuren lida för att spara öre. Patetiskt!", "stalin": "Jag betraktar med avsky hur dessa kapitalistiska hönsbönder driver ett klassförräderi mot naturen själv. Snabbväxande hybrider som krossar skelett och inre organ är klassfiendens verk, maskerade som produktivitet. Den där Andersson vägrar erkänna lidandet – typiskt för folkförrädare. Vi skulle ha likviderat hela systemet och ersatt det med kollektivens stålhårda disciplin. Sabotage mot djuren är sabotage mot folket."}, "date": "26 augusti, 06:33", "url": "https://www.tv4.se/artikel/1nRPYm5fswsZ628ICwtYJP/sa-svarar-svensk-fagel-kaenner-inte-igen-bilden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7z2Hw7EVAieZR7mcyiABZK%2F1cb35d70b310632932a205e18b8275a4%2Fsvenskfagel.jpg&width=120"}, {"type": "image-full", "heading": "Flygbranschen under press: \"Räcker inte ens till en varmkorv\"", "summaries": {"normal": "Flygbranschens intäkter ökar till över 1 100 miljarder dollar i år, men stigande bränslekostnader gör att vinsten halveras till 23 miljarder dollar. Vinstmarginalen sjunker till två procent. Särskilt drabbas Mellanöstern och Europa av höga bränslepriser och störningar. IATA varnar för fortsatta leveransproblem hos Boeing och Airbus.", "trump": "Titta på de där korkade flygbolagen, folk. Rekordfyllda plan, enorma intäkter, men de tjänar knappt till en varmkorv. Biden lämnade oss med galna bränslepriser och Mellanöstern-kaos. Nu halveras vinsten. Patetiskt! Mina policies skulle ha fixat detta på en vecka, men de gröna galningarna och byråkraterna förstör allt. Sad!", "stalin": "Ännu en gång blottar sig den profitthungriga borgarklassen i all sin ynklighet. Trots rekordintäkter suger bränsleparasiterna upp vinsten tills det bara återstår smulor. Imperialistiska leveransflaskhalsar och krigsstörningar avslöjar systemets svaghet. Kamrater, detta är kapitalismens oundvikliga förfall. Vi ler i skuggan medan de likviderar sin egen lönsamhet."}, "date": "26 augusti, 13:28", "url": "https://www.dagensps.se/bors-finans/flygbranschen-under-press-racker-inte-ens-till-en-varmkorv", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/flyg.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "ETC-serietecknare åtalas för spottloska i Jomshofs ansikte: \"Vill slå Jomshof på käften\"", "summaries": {"normal": "En vänsterinriktad ETC-serietecknare åtalas för att ha spottat SD-toppen Richard Jomshof i ansiktet under en syntkonsert. Mannen, som bland annat ritat Jimmie Åkesson som nazist, nekar och hävdar att Jomshof ljuger för att marknadsföra sin bok. En riktigt sunkig historia, helt enkelt.", "trump": "Jag hörde att en vänsterserie-tecknare spottade på en svensk politiker. Otroligt! Hade han gjort så mot mig hade jag stämt honom för tio miljarder. Men Jomshof? Han borde vara tacksam att jag inte var där. Jag får saker gjorda, de här människorna är losers. Synd att han inte fick en riktig utrensning.", "stalin": "Kamrater, en så kallad 'serietecknare' har försökt störa ordningen genom att spotta på en reaktionär riksdagsledamot. Detta är en provokation från vänsteravvikare som måste rensas ut. Vi har inget behov av antirasistiska parasiter som skapar oreda. Partiet kommer att undersöka saken noggrant."}, "date": "26 augusti, 11:50", "url": "https://samnytt.se/han-atalas-for-spottloska-i-jomshofs-ansikte-vill-sla-jomshof-pa-kaften", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/26090749/artikelhuvudbild-1-375.jpg"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-right", "heading": "Trappa upp kampen mot gängens affärer", "summaries": {"normal": "Skjutningarna i Sverige har minskat till historiskt låga nivåer, men den kriminella ekonomin frodas i det tysta och omsätter nu 350 miljarder kronor per år med vinster på 185 miljarder. Gängen utnyttjar bidrag, svartarbete, momsbedrägerier och penningtvätt via bolag. Experter varnar för att finansiell brottslighet trängt djupt in i samhället. Myndigheter och banker måste samarbeta bättre, bland annat genom ett register för att 'rödflagga' gängkriminella.", "trump": "Folket, vi har pressat ner skjutningarna till de lägsta nivåerna någonsin, en enorm framgång, tro mig. Men de kriminella smarta killarna tjänar 185 miljarder på sina affärer medan de lurar staten på allt. De är smarta, men vi är smartare. Vi behöver rensa ut dem, stoppa bidragsfusket och tvinga bankerna att samarbeta. Amerika, alltså Sverige, vinner stort om vi gör det rätt. Fantastiskt!", "stalin": "Kamrater, den kriminella ekonomin växer sig stark som en parasit i vårt samhällskropp och omsätter 350 miljarder medan de borgerliga reglerna bara är papperslappar för dessa parasiter. Vi ska samordna alla sovjetiska, alltså statliga, organ och rensa ut dessa målvakter och insiders med järnhand. Ett register för att flagga fienderna är ett ypperligt verktyg. De som vägrar stödja detta är naturligtvis kontrarevolutionärer som vill se systemet falla. Skratta medan vi likviderar dem."}, "date": "26 augusti, 13:02", "url": "https://www.di.se/ledare/trappa-upp-kampen-mot-gangens-affarer", "imageUrl": "https://static.bonniernews.se/ba/d0476d90-5239-49c5-8e36-2e9cdc1b79ae.jpeg?crop=5088%2C2544%2Cx0%2Cy424&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Vägen till svenska AI-gigafabriker ligger öppen – ta den", "summaries": {"normal": "Björn Rosengren argumenterar för att Sverige bör anmäla intresse för att bli värdland för en av EU:s planerade AI-gigafabriker. Han varnar för beroendet av amerikansk teknik och molntjänster, pekar på Sveriges fördelar med billig fossilfri el och kritiserar regeringens passivitet. En gigafabrik skulle bygga svensk kompetens och suveränitet inom AI.", "trump": "Europa försöker desperat bygga AI-fabriker för att slippa bero av oss, men Sverige är patetiskt. De har billig el, fina platser, men gör ingenting. Jag älskar Norge, de fattade rätt beslut. Sverige borde vakna, bjuda på sig själva och sluta hyra av Finland. Gör det stort, annars förlorar ni allt till oss.", "stalin": "Jag betraktar med djup misstro dessa kapitalistiska halvmesyrer. Medan borgarbrackorna i Bryssel och Washington stryper Europas suveränitet genom sina moln och chip, väljer Sverige att krypa för finska revisionister istället för att bygga egen makt. En sann folkdemokrati skulle omedelbart anmäla värdskap, korta köerna och likvidera alla hinder för arbetarklassens teknologiska seger. Fördröjningarna är sabotage."}, "date": "26 augusti, 13:01", "url": "https://www.di.se/debatt/vagen-till-svenska-ai-gigafabriker-ligger-oppen-ta-den", "imageUrl": "https://static.bonniernews.se/ba/1b813586-465c-41d4-9dad-63f93cd09533.jpeg?crop=5884%2C2942%2Cx0%2Cy490&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Börsen handlas runt nollan inför Nvidia-rapport", "summaries": {"normal": "Stockholmsbörsen står stilla och väntar på Nvidias rapport och amerikansk inflation. Oljepriset faller, medan Boliden och Swedbank klättrar. H&M backar efter sänkt rekommendation. Bioarctic levererar en rapport som glädjer, men aktien sjunker ändå. Truecaller rusar nästan 9 procent efter dubbla riktkurshöjningar.", "trump": "Jag ser att Stockholmsbörsen är som en lugn pool – den rör sig inte, precis som mina framgångar. Oljepriset faller, det är fantastiskt! Nvidias rapport kommer ikväll, jag är säker på att det blir rekord, precis som jag. H&M går dåligt, men det är deras problem, inte mitt. Folk älskar mig mer än aktier!", "stalin": "Kamrater, börsen står stilla, som en god sovjetmedborgare som väntar på order. Oljepriset faller – vi rensar ut kapitalistiska spekulanter! Nvidias rapport är borgerlig propaganda, men vi övervakar den. H&M och Nibe är avfällingar som ska omdirigeras till arbetsläger. Bioarctic rapporterar bra, men vi ser ändå misstänkta rörelser – utrensning väntar."}, "date": "26 augusti, 09:53", "url": "https://www.affarsvarlden.se/artikel/borsen-handlas-runt-nollan-infor-nvidia-rapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdled3wmqCJcjU-nh-400x267.jpg"}, {"type": "image-right", "heading": "Total bojkott av folkmordsstaten!", "summaries": {"normal": "Artikeln kräver att Sveriges regering inför en total bojkott av Israel, som beskrivs som en rasistisk folkmordsstat driven av sionism och högerextrema krafter. Den hänvisar till kritiska uttalanden från Ebba Busch och Aron Verständig samt Ben-Gvirs kontroversiella uttalanden. Författaren förkastar tvåstatslösningen och kräver en enstatslösning samt stöd för palestinskt motstånd.", "trump": "Folk, ni ser det här vansinnet? Den här galningen skriker om bojkott och folkmord medan han själv låter som en galen vänsterextremist från helvetet. Israel har rätt att slå tillbaka mot terroristerna – de kallar dem palestinier men vi vet vad det handlar om. Sverige borde vakna upp istället för att lyssna på dessa förlorare och hatiska sionism-hatare. Patetiskt!", "stalin": "Kamrater, denna text avslöjar borgarbrackornas desperation när deras sionistiska lakejer blottas som folkmördande imperialister. Jag betraktar med förakt hur dessa profitthungriga blodsugare i Tel Aviv och deras svenska nyttiga idioter fortsätter koloniala övergrepp. En total utrensning av sådana folkfiender är nödvändig. Arbetarklassen kräver handling, inte tomma ord från klassförrädare."}, "date": "26 augusti, 11:03", "url": "https://proletaren.se/artikel/bojkotta-folkmordsstaten-israel", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/738829004_1425862242684486_7128924062394661206_n.png-768x432.jpg"}, {"type": "image-right", "heading": "Åtal: Dagens ETC-tecknare spottade Jomshof i ansiktet", "summaries": {"normal": "Illustratören Emanu Garnheim, känd för sina bidrag till Dagens ETC och satir mot SD, åtalas för att ha spottat på riksdagsledamoten Richard Jomshof utanför konsertlokalen Slaktkyrkan i maj. Garnheim erkänner konfrontation och att han spottade i riktningen men nekar till uppsåt att träffa. Åtalet väckts av Riksenheten för säkerhetsmål då brottet riktats mot Jomshof i egenskap av riksdagsledamot.", "trump": "Kan ni fatta det här? En galen vänsterradikal tecknare från den socialistiska skandalblaskan ETC spottar vår vän Jomshof rakt i ansiktet. Typisk hatisk vänsterlögner! De hatar framgång, de hatar oss som älskar Sverige. Garnheim är en patetisk förlorare som inte ens kan spotta rakt. Vi vinner stort, de förlorar alltid.", "stalin": "Kamrater, denna fega borgarbracka till satirtecknare Garnheim, en typisk dekadent vänsterlakej åt den imperialistiska pressen, har i sin alkoholiserade paranoia konfronterat en politisk fiende. Hans lögnaktiga förnekanden avslöjar klassfiendens rädsla. Vi ska rensa ut sådana element med järnhand. Det är en historisk nödvändighet att likvidera alla som spottar på folkets vilja."}, "date": "26 augusti, 12:37", "url": "https://www.friatider.se/atal-dagens-etc-tecknare-spottade-jomshof-i-ansiktet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-754.jpg"}, {"type": "image-right", "heading": "Ny rapport: Skolkoncerner gör vinst på färre lärare och mindre skolgårdar", "summaries": {"normal": "En rapport från Arena Idé visar att vinstdrivande friskolor har 2 600 färre lärare än kommunala skolor och betydligt mindre skolgårdar. Vinsten på 1,7 miljarder kronor kommer främst från besparingar på lärartjänster och fastigheter. Elever från dessa skolor får lägre livsinkomst och sämre etablering på arbetsmarknaden.", "trump": "De här så kallade friskolorna är en total skandal! De sparar in på lärare och små skolgårdar för att plocka ut miljarder i vinst. Patetiskt! Mina skolor skulle vara de bästa, de allra bästa, med fantastiska lärare och enorma gårdar. De svenska socialistiska kommunerna borde skämmas, det är en riggad affär mot folket.", "stalin": "Kamrater, dessa borgarbrackor i friskoleindustrin bedriver systematisk utsugning av det kollektiva skolväsendet. Jag ser hur de med glädje likviderar lärartjänster och krymper skolgårdarna till hälften för att fylla sina fickor med 1,7 miljarder. En sådan kontrarevolutionär verksamhet kräver omedelbar utrensning. De trodde de kunde gömma sig, men folkets öga ser allt."}, "date": "25 augusti, 14:00", "url": "https://www.dagensarena.se/innehall/ny-rapport-skolkoncerner-gor-vinst-pa-farre-larare-och-mindre-skolgardar", "imageUrl": "https://www.dagensarena.se/files/2026/05/skola-pexels.jpeg"}, {"type": "image-right", "heading": "Wennblad kritiserar klimattåget: ”Fakta är inte politik”", "summaries": {"normal": "Peter Wennblad sågar klimattågets mediala hyllningskör i SvD. Han menar att fakta inte är politik och att Tidöregeringen faktiskt är bäst för klimatet – genom att lyssna på väljarna istället för att pracka på dem dyra åtgärder. 50 000 demonstranter får en känga, medan flygvapnets jubileum ignoreras.", "trump": "Jag ser att Sverige börjar bli smarta! Demonstranter skriker om vetenskap, men vetenskap säger att jag har rätt. Tidöregeringen gör mig stolt – de lyssnar på folket, inte på klimatgalningarna. Sverige har redan fixat elen och bostäderna. Bra jobbat! Kanske de lär sig av min fantastiska politik.", "stalin": "Kamrater, vi ser en ny fiende: klimatdemonstranterna som tror att fakta är viktigare än partiet. De vill störa vår energiproduktion. Men jag har en plan: en utrensning av alla väderförrädare som inte inser att Tidöregeringen är vår bästa allierade. Vetenskapen tjänar staten, inte tvärtom."}, "date": "26 augusti, 11:45", "url": "https://bulletin.nu/wennblad-kritiserar-klimattaget-fakta-ar-inte-politik", "imageUrl": "https://cdn.bulletin.nu/articles/d84fff97-687b-4e45-8fac-bd9a29210df7/preview.png?t=1787737464000"}, {"type": "image-right", "heading": "Befria bostaden från marknaden", "summaries": {"normal": "Den svenska bostadsmodellen har monterats ned till förmån för marknaden, vilket gynnar ägare och missgynnar hyresgäster. Över hälften av kommunerna har bostadsbrist, byggandet är för lågt och hyrorna för höga. Nästan 200 000 unga bor hemma mot sin vilja. Artikeln kritiserar alla partier och föreslår att staten tar ansvar för bostadsförsörjningen.", "trump": "Vilken katastrof ni har i Sverige! Marknaden styr, men era korkade politiker har totalt förstört bostadsmarknaden. Byggandet är ett skämt, hyrorna är galna och ungdomen bor hemma hos mamma. Det är som Sleepy Joes inflationskaos fast värre. Rena socialistiska röra. Vi fixar det med sunt förnuft och vinner stort – igen.", "stalin": "Jag betraktar med avsky hur profitthungriga blodsugare och klassfiender har förvandlat bostaden till en vara. Borgarbrackorna höjer hyror medan arbetarklassen kvävs i trångboddhet. Detta kräver omedelbar utrensning av spekulanter och återupprättande av folkets rätt till hem. Kamrater, organisera er mot dessa exploaterande hyenor innan de förtär er alla."}, "date": "26 augusti, 10:29", "url": "https://proletaren.se/artikel/befria-bostaden-fran-marknaden", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2025/08/bostadweb-768x432.jpg"}, {"type": "image-right", "heading": "Dolly Parton avled efter kort tids kamp mot cancer", "summaries": {"normal": "Countryikonen Dolly Parton har avlidit efter en kort kamp mot cancer, 80 år gammal. Hon efterlämnar över 3000 låtar som 'Jolene' och '9 to 5'. President Trump hyllade henne och flaggade på halv stång. En legend har lämnat scenen.", "trump": "Jag är så ledsen, väldigt ledsen. Dolly var den största countrysångerskan någonsin, om ni frågar mig. Ingenting som hon! Jag har beordrat flaggor på halv stång i en hel vecka. Hon älskade mig, jag älskade henne. En stor förlust för Amerika, tro mig.", "stalin": "Kamrater, en fiende till musikens proletariat har fallit. Denna 'countrystjärna' spred borgerlig dekadens. Jag beordrar en veckas sorg – och samtidigt utrensning av hennes kapitalistiska visor ur alla högtalare. Inga tårar för kontrarevolutionärer. Segern är vår."}, "date": "26 augusti, 11:13", "url": "https://bulletin.nu/dolly-parton-avled-efter-kort-tids-kamp-mot-cancer-2", "imageUrl": "https://cdn.bulletin.nu/articles/b171fd91-84fb-420e-b0db-d22e36c9332a/preview.jpg?t=1787735587000"}, {"type": "image-full", "heading": "DEI blir juridisk risk för storföretag – IBM och Deloitte betalar miljoner", "summaries": {"normal": "Amerikanska företag med federala kontrakt granskas nu för sitt DEI-arbete. Justitiedepartementet undersöker om mångfaldsmål otillåtet påverkat anställningar och befordringar. Både IBM och Deloitte har valt att ingå förlikningar på miljonbelopp efter anklagelser om att ha brutit mot villkor om icke-diskriminering. Fler storföretag står under utredning i en våg av granskningar mot påstådd omvänd diskriminering.", "trump": "Mina vänner, vi rensar ut DEI-vansinnet! IBM och Deloitte betalade miljoner efter att jag såg till att de slutade med sin diskriminerande politik. De trodde att de kunde styra genom korrekta mål, men vi stoppar dem. Ingen diskriminering i mitt Amerika! Det är fantastiskt, en stor seger för meritokrati. Många fler företag står på tur – vi vinner så mycket!", "stalin": "Dessa korrupta kapitalistiska giganter, IBM och Deloitte, försöker dölja sin inkompetens med 'mångfald'. De har erkänt sin skuld genom att betala våra amerikanska efterföljare. Precis som när vi rensade ut förrädare i partiet måste vi granska varje misstänkt ideologisk avvikelse. Deras DEI-program är bara en maskerad för instabilitet. Liksom Putin återställer ordningen i öst, krossar vi nu dessa liberala illusioner med järnhand."}, "date": "26 augusti, 14:03", "url": "https://www.realtid.se/samhalle/dei-blir-juridisk-risk-for-storforetag-ibm-och-deloitte-betalar-miljoner", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/doj.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Dog i sviterna av cancer: ”Omgiven av sina nära och kära”", "summaries": {"normal": "Countrylegendaren Dolly Parton har avlidit vid 80 års ålder efter en kort kamp mot cancer. Hon lämnade Nashville den 25 augusti omgiven av sina närmaste. Med över tusen låtar och mer än 100 miljoner sålda album var hon en av världens mest älskade artister. Hennes karriär sträckte sig över sex decennier och inkluderade klassiker som Jolene och I Will Always Love You.", "trump": "Folk, Dolly Parton var en fantastisk kvinna, verkligen en ikon, men nu är hon borta. Hon sålde hundra miljoner album och skrev tusen låtar – stora siffror, de bästa siffrorna. Hon gjorde country stort igen. Jag träffade henne, hon älskade mig, alla gjorde det. En stor förlust för musikvärlden, men hon levde ett otroligt liv. Sad!", "stalin": "Kamrater, den dekadenta countrysångerskan Dolly Parton har slutligen likviderats av sin egen kropps förräderi efter en kort men heroisk kamp mot kapitalismens cancer. Hennes melodier var opiat för folket, men nu rensas hennes borgarbracka av en värld som äntligen inser att inga ikoner överlever utan partiets välsignelse. Vi skrattar mörkt åt västvärldens tomhet."}, "date": "26 augusti, 11:28", "url": "https://www.svt.se/kultur/dolly-parton-ar-dod", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.42/0.37/d533fb343ee85ecf37f62dfd8907a249c66effa3654f599b6d632434e8955df9?template=u03hi7"}, {"type": "text", "heading": "Tidötida betraktelser", "summaries": {"normal": "Recensionen av antologin Tidötiden lyfter satirteckningarnas kontextbundenhet och tolkningsutmaningar. Boken kritiserar Tidö-regeringens politik genom kapitel som Kväsa och Mobba. Den betonar bildanalysens betydelse i en bildöverflödad tid och fungerar främst som opinionsbildande verk med folkbildande inslag. Recensenten hoppas att boken blir obegriplig för framtida generationer.", "trump": "Folk, ni måste se den här galna svenska bildboken Tidötiden. De ritar om hur de påstådda fascisterna i regeringen mobbar och tystar alla. Totalt vansinne! De hatar vinster och älskar att klaga på allt. Precis som de woke-vänstermediasnubbarna som aldrig vinner. Men bilderna kommer att bli obegripliga när vi gör Sverige, eller vad det nu heter, great again. Fantastiskt!", "stalin": "Kamrater, denna så kallade satirbok Tidötiden avslöjar borgarbrackornas och fascistiska Tidö-hundarnas vedervärdiga attacker mot folket. De väpnar, mobbar och tystar med sina profitthungriga klor. Jag ler mörkt från historien åt deras paranoia om censur. Vi måste rensa ut dessa klassfiender och deras blodsugande hyenor innan de drunknar i sina egna lögner. Folkets seger är oundviklig."}, "date": "26 augusti, 09:49", "url": "https://proletaren.se/artikel/tidotida-betraktelser"}, {"type": "image-right", "heading": "Kräver stopp för Jomshofs \"hatturné\"", "summaries": {"normal": "Magdalena Andersson (S) kräver att SD-ledaren Jimmie Åkesson stoppar Richard Jomshofs föreläsningsturné om islam, som hon kallar en \"hatturné\". Hon vill bevara det lugnare politiska tonläget efter skolattacken i Fagersta. Jomshof svarar att Socialdemokraterna bär ansvaret för segregation och islamisering i Sverige.", "trump": "Hörni, den här Andersson är en total förlorare. Hon ber Jimmie Åkesson, en riktig tuffing, att stoppa Jomshof som äntligen vågar säga sanningen om islam. Sverige håller på att rasa ihop, precis som jag alltid varnat för. De borde tacka Jomshof istället för att gnälla om hat. Patetiskt!", "stalin": "Kamrater, denna socialdemokratiska avart Andersson vädjar till sin fiende Åkesson om att avbryta en nödvändig ideologisk kampanj mot den muhammedanska faran. Hennes gnäll om hat är bara ett försök att skydda den sönderfallande borgerliga samhällskroppen. Vi ska rensa ut alla quislingar som undergräver folkets enhet. Skrattretande svaghet."}, "date": "26 augusti, 11:40", "url": "https://www.friatider.se/kraver-stopp-jomshofs-hatturne", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-753.jpg?itok=Ok_S0B92"}, {"type": "image-right", "heading": "Ny mätning: Tidöpartierna äter upp halva oppositionens försprång", "summaries": {"normal": "Tidöpartierna har ätit upp halva oppositionens försprång i en ny mätning. Moderaterna klättrar, Socialdemokraterna backar. Gapet har krympt från nio till 4,7 procentenheter på två månader. Liberalerna ligger dock kvar under spärren – och det kan bli avgörande när förtidsröstningen startar.", "trump": "Ni ser, jag sa det ju – de här Tidöpartierna är fantastiska! De äter upp oppositionens ledning, precis som jag äter upp mina motståndare. Moderaterna ökar, Socialdemokraterna tappar, och Liberalerna är katastrof, helt under spärren. Sverige blir fantastiskt igen!", "stalin": "Kamrater, statistiken visar en otillåten återhämtning hos Tidöförrädarna. De har minskat skillnaden med nästan hälften. Detta är ett verk av sabotage från västliga agenter. Vi måste rensa ut de missnöjda elementen i befolkningen. Liberalerna är svaga – de ska omplaceras till arbetsläger."}, "date": "26 augusti, 10:20", "url": "https://samnytt.se/ny-matning-tidopartierna-ater-upp-halva-oppositionens-forsprang", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/08/26082313/tido-knappar-in.jpg"}, {"type": "image-right", "heading": "Sluta använda judar som alibin. Mohamssons davidsstjärna måste sättas i sitt sammanhang", "summaries": {"normal": "Mikael Feldbaum kritiserar politikern Simona Mohamssons bärande av davidsstjärnan. Han ser gesten som modig men menar att den används partipolitiskt mot vänstern och invandrare. Feldbaum, jude med flyktingbakgrund, vill inte att judar ska bli alibi i kampen mot misshagliga grupper och betonar judendomens solidaritet med förföljda.", "trump": "Den här Mohamsson-tjejen tror hon kan sätta på sig en stjärna och plötsligt verka smart mot alla de där galna vänstervriden som älskar klaner och hatar judar. Patetiskt! Hon använder er som slagträ, folk. Jag har sett det tusen gånger under Biden-kaoset. Sluta gömma er bakom judar och gör något åt de riktiga problemen istället. En skam!", "stalin": "Kamrater, denna Mohamsson bär stjärnan som en teatermask medan hon angriper de hon kallar felaktiga element. Jag ser genom detta falska skådespel av solidaritet som doljer reaktionär kampanj mot folkets fiender. Judar som alibi mot invandrare? En klassisk borgerlig manöver. Den som inte står med de förtryckta förtjänar att krossas under historien. Skamligt!"}, "date": "26 augusti, 14:00", "url": "https://www.expressen.se/kultur/kulturdebatt/sluta-anvanda--judar-som-alibin", "imageUrl": "https://static.bonniernews.se/ba/b41752cf-3e82-445b-8396-2a4c5cef9fe6.jpeg?crop=1207%2C1207%2Cx116%2Cy0&width=210&quality=60"}, {"type": "text", "heading": "So long, Dolly!", "summaries": {"normal": "Countryikonen Dolly Parton har gått bort vid 80 års ålder. Hon växte upp i fattigdom som ett av tolv barn, skrev klassiker som I Will Always Love You och Jolene samt medverkade i filmen 9 to 5. Parton hyllas för sin röst, humor, karisma och lojalitet mot sina rötter och den arbetande människan.", "trump": "Lysande, absolut lysande karriär, men nu är hon borta. Dolly var en vinnare, skrev hits som ingen annan och slog de woke Hollywood-eliterna med deras egna vapen. Ingen identitetspolitik eller HBTQ-kvotering här, bara ren talang och tuffa rötter. De riktiga arbetarna älskade henne. So long, Dolly – du var ingen förlorare som Biden.", "stalin": "Kamrater, denna Dolly Parton var en produkt av arbetarklassens jord, inte någon dekadent borgarbracka. Hon skrev sånger som blottade kapitalismens exploatering och hånade chefernas skitstövelvälde. Ändå vägrade hon kalla sig feminist – en sund instinkt. Nu har hon lämnat oss. Må hennes arv inspirera till utrensning av alla profitthungriga klassfiender som förtrycker folket."}, "date": "26 augusti, 09:25", "url": "https://proletaren.se/artikel/so-long-dolly"}, {"type": "image-right", "heading": "Tidöpartierna knappar in – M ökar mest", "summaries": {"normal": "Enligt Indikator Opinion har Tidöpartierna minskat oppositionens ledning till 4,7 procentenheter. Moderaterna ökar mest med 1,2 procentenheter till 18,9 procent, medan Socialdemokraterna backar lika mycket till 31,3 procent. Liberalerna når bara 2,2 procent och ligger under riksdagsspärren. Sverigedemokraterna stärker sin position något.", "trump": "Titta på de här svenska siffrorna, folk! Mina vänner i Tidöpartierna knappar in på de förlorande socialisterna. Moderaterna går framåt som riktiga vinnare, plus 1,2, medan Sleepy S backar lika mycket. Liberalerna? Patetiska 2,2 procent. Oppositionen leder fortfarande, men inte länge. Sverige behöver starka ledare, inte svaga förlorare!", "stalin": "Kamrater, denna mätning visar hur de borgerliga reaktionärerna desperat försöker klamra sig fast vid makten medan arbetarklassens parti fortsätter dominera. Jag ser hur de kontrarevolutionära elementen i Liberalerna sjunker under spärren – en nödvändig utrensning av svaga länkar. Oppositionen behåller en tillfällig fördel, men historien dömer alla folkfiender till glömska. Segraren ler sist."}, "date": "26 augusti, 12:33", "url": "https://riks.se/nyheter/tidopartierna-knappar-in-m-okar-mest", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_26_T123306_558_d3ea7ae8e7.jpg"}, {"type": "image-full", "heading": "Kommer bidragstagarna bestämma över Stockholms innerstad?", "summaries": {"normal": "Artikeln diskuterar hur Vänsterpartiet minskar gapet till Moderaterna i Stockholms kommunval, delvis genom en arabiskspråkig kampanj riktad till invandrare i förorterna. Författaren varnar för att en vänsterstyrd politik med fokus på bilfritt Stockholm, minskad privat vård och ökad bidragsinriktad invandring kan leda till utflyttning, högre skatter och ekonomisk nedgång liknande Kalifornien.", "trump": "Folket, det är helt galet! Den där röda Nooshi och hennes vänsterfreaks håller på att ge bort hela Stockholm till bidragstagarna med sin 'V eller flygplatsen'-skit. De hatar bilar, älskar cyklar och importerar väljare som aldrig jobbat en dag. Precis som i Kalifornien, en total katastrof. De som betalar ska inte styras av de som tar emot – det är riggat mot vinnarna, tro mig!", "stalin": "Kamrater, se hur borgarbrackorna i Stockholm skriker när arbetarklassen och de förtryckta folken närmar sig makten. Dessa klassfiender fruktar att deras exploaterande innerstad skall rensas från profitthungriga hyenor och bilägande parasiter. Jag ler i graven åt deras paranoia – låt bidragsmottagarna styra, det är folkets vilja mot de blodsugande kapitalisterna. En historisk utrensning av överklassens cykelhatande agenda."}, "date": "19 augusti, 07:26", "url": "https://samtiden.nu/2026/08/kommer-bidragstagarna-bestamma-over-stockholms-innerstad", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7184-1280x720.jpeg"}, {"type": "image-full", "heading": "Northmill gör rekordkvartal – men fullservicemålet kan glida till 2027", "summaries": {"normal": "Northmill Bank redovisar sitt starkaste kvartal någonsin med ett resultat före skatt på 86 miljoner kronor. Tillväxten drivs främst av en kraftig expansion inom företagssegmentet, vilket har hjälpt till att sänka kreditförlusterna. Trots framgångarna kan målet om att bli en fullservicebank för konsumenter skjutas upp från 2026 till 2027 då arbetet med lönekonton ännu pågår.", "trump": "Northmill Bank har precis gjort ett fantastiskt kvartal, riktigt enormt! De växer som aldrig förr, precis som vi gör i USA. De tjänar massor av pengar och deras affärer med företag är helt otroliga. De vill bli en stor bank, kanske tar det lite tid, men det är en vinnare. Mycket bättre än de där svaga bankerna som misslyckas varje dag!", "stalin": "Dessa kapitalistiska kumpaner i Northmill skryter om sina siffror, men glömmer att allt tillhör staten. Att de expanderar mot företagen är bara en förberedelse för vår framtida kontroll. Att de fördröjer sin 'fullservice' visar på ineffektivitet. Som när Putin säkrar gränserna, måste vi eliminera dessa bank-parasiter. De växer nu, men vi kommer att skörda frukterna av deras arbete när tiden är mogen."}, "date": "26 augusti, 13:40", "url": "https://www.realtid.se/bors-finans/bank-fintech/northmill-gor-rekordkvartal-men-fullservicemalet-kan-glida-till-2027", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/chatterjee.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Nu träder nya EU-regler i kraft – utländska myndigheter kan begära ut digitala bevis", "summaries": {"normal": "Nya EU-regler gör att myndigheter direkt kan kräva digitala bevis från tjänsteleverantörer i andra medlemsländer. Sverige har infört kompletterande lagar. Tänk på det nästa gång du chattar – din data kan bli efterlyst. Sanktionsavgift på upp till 2% av global omsättning för teknikjättar som inte lydigt levererar.", "trump": "Jag har alltid sagt att EU är långsamt, men nu blir det snabbt! De kan be om bevis direkt – fantastiskt. Men Sverige måste vara försiktiga, annars blir det problem. Teknikföretag som inte levererar får böter. Jag är den bästa på att få fram information, tro mig!", "stalin": "Kamrater! Nu har vi nya verktyg för att rensa ut digitala kontrarevolutionärer. EU-regler gör att vi kan begära bevis direkt från borgerliga tjänsteleverantörer. Den som vägrar får en sanktionsavgift på två procent av sin globala omsättning – eller värre. All data ska tillhöra staten, inget undgår oss."}, "date": "26 augusti, 10:00", "url": "https://samnytt.se/nu-trader-nya-eu-regler-i-kraft-utlandska-myndigheter-kan-begara-ut-digitala-bevis", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/08/25084239/elektronik-eu.jpg"}, {"type": "image-right", "heading": "Prisjakt återupptar årets börsplaner", "summaries": {"normal": "Prisjakt återupptar börsplanerna och siktar på notering under andra halvåret 2026. Efter att ha ställt in en notering i mars vänder nu marknaden. Omsättningen ökade 17% till 243 miljoner, och vinsten landade på 26 miljoner. En AI-shoppingassistent lanseras i november. VD:n ser ljust på framtiden.", "trump": "Jag älskar det här! Prisjakt – en fantastisk affär, enorma siffror. De vill noteras på börsen 2026, och jag säger: gör det! Marknaden är fantastisk – precis som mina tariffer. 17% omsättningsökning, 35% marginal – vi gör Sverige stort igen! En AI-assistent i november? Genialiskt!", "stalin": "Kamrater, jag har tagit del av rapporten om Prisjakt. De planerar en börsnotering – en kapitalistisk utrensning av den socialistiska ekonomin. Vi måste rensa ut dessa marknadsfascister. 243 miljoner i omsättning? En farlig ideologisk avvikelse. En AI-assistent? Partiets övervakning är redan överlägsen. Rapportera omedelbart deras koordinater."}, "date": "26 augusti, 07:28", "url": "https://www.affarsvarlden.se/artikel/prisjakt-aterupptar-arets-borsplaner", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdl1pccgsHxXyM-nh-400x267.jpg"}, {"type": "image-right", "heading": "Racingserien STCC gör comeback med nya bilar", "summaries": {"normal": "STCC gör comeback 2027 efter paus sedan 2024. Serien överger eldrivna bilar till förmån för kostnadseffektiva GT4-bilar från tillverkare som Mercedes, BMW, Porsche och andra. Återstarten drivs av en ägargrupp bestående av flera svenska banor i samarbete med SRO Motorsport Group. Intresset har överträffat förväntningarna.", "trump": "Vi tar tillbaka STCC och gör den större och bättre än någonsin, tro mig. Inga dyra elskrot längre, nu kör vi riktiga GT4-bilar från de bästa tillverkarna. Mina vänner på banorna fixar det här – det blir en enorm succé. De andra försökte döda serien, men vi vinner stort igen.", "stalin": "Vi har beslutat att återuppliva STCC enligt den nya, kostnadseffektiva GT4-doktrinen. Denna historiska återkomst under vår ägargrupps oöverträffade ledning krossar de kapitalistiska promotörernas sabotage och elbilarnas dekadenta fiasko. Intresset är massivt. De västerländska hindren skall rensas ut med glädje."}, "date": "26 augusti, 11:33", "url": "https://www.di.se/bil/racingserien-stcc-gor-comeback-med-nya-bilar", "imageUrl": "https://static.bonniernews.se/ba/a0ec9c8d-a6aa-4e0f-b4ee-a2843acc21d0.jpeg?crop=2267%2C1134%2Cx0%2Cy70&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Meta förhandlar om förlikning i USA – Sverige utreder 15-årsgräns", "summaries": {"normal": "Meta stäms av 29 amerikanska delstater för att ha designat Facebook och Instagram så att barn blir beroende. Delstaterna kräver skadestånd och förändringar av plattformarna. Meta förhandlar nu om förlikning mitt under rättegången i Kalifornien. Domen kan påverka även svenska regleringar kring åldersgränser på sociala medier. Rättegången väntas pågå i minst sex veckor.", "trump": "Titta på det här, de stora tech-gigantiska bluffarna på Meta har byggt beroendefällor för våra barn medan de skrattar hela vägen till banken. Nu stämmer 29 delstater dem – äntligen! De förtjänar det. Jag skulle ha städat upp i det här träsket direkt, inte som den sömnige Joe. Meta är en skam för Amerika, totalt korrupt!", "stalin": "Se hur dessa profitthungriga blodsugare i borgarklassen medvetet förgiftar ungdomen med sina digitala opiumhålor för att fylla plånböckerna. De förtjänar att rensas ut som klassfiender. Jag ler i graven åt att deras imperium nu vacklar under folkets vrede. Inga kompromisser med folkförtryckarna – likvidera deras inflytande!"}, "date": "26 augusti, 11:36", "url": "https://www.dagensps.se/bors-finans/meta-forhandlar-om-forlikning-i-usa-sverige-utreder-15-arsgrans", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-9-1.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Smart Eyes försäljningstillväxt stiger", "summaries": {"normal": "Teknikbolaget Smart Eye redovisar en omsättningsökning på 53 procent under andra kvartalet, till 140,9 miljoner kronor. Rörelseförlusten minskar från 40,6 till 20,6 miljoner, och ebitda-marginalen klättrar till 19,4 procent. Bilsegmentet driver tillväxten, medan Behavioral Research tyngs av lägre hårdvaruförsäljning. Vd:n ser nu en fundamentalt annorlunda fas.", "trump": "Smart Eye gör fantastiska siffror – 53 procent upp, ingen kan göra det som de, förutom jag. Jag älskar ögon, jag har de bästa ögonen. Rörelseförlusten krymper, och det är vackert. De säger att bilsegmentet driver. Helt rätt. Mina bilar? Också vinnare. America first, men Smart Eye ser allt!", "stalin": "Kamrater! Rapporten från Smart Eye visar att vi ökar produktionen med 53 procent. Det är glädjande, men misstänkt. Varför minskar förlusten? Kanske är siffrorna en trotskistisk konspiration. Jag beordrar en utrensning av hårdvaruförsäljare i Behavioral Research. Mjukvaran växer med 7 procent – den får leva. Ögat ser allt. Vi måste vara vaksamma."}, "date": "26 augusti, 07:16", "url": "https://www.affarsvarlden.se/artikel/smart-eye-vaxer-kraftigt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/01/Smarteye_konceptbild_eye_camera-400x283.jpg"}, {"type": "image-right", "heading": "Ebba Busch  om samarbetet med S och Åkessons fokus", "summaries": {"normal": "Ebba Busch är hoppfull efter minskade opinionsgapet mellan Tidöpartierna och oppositionen. Hon satsar hårt på valet som nu inleds med förtidsröstning och håller dörren öppen för samarbete med Socialdemokraterna vid kriser eller exceptionella lägen. Busch ser det som konstruktivt och nämner att KD är en attraktiv partner för både S och C.", "trump": "Den här Busch är smart, väldigt smart. Hon håller alla dörrar öppna, precis som jag alltid gjorde. Socialdemokraterna? De förlorar stort, men hon är redo att ta ansvar när Sverige brakar ihop. Tidöfolket leder – folk älskar vinnare. Åkesson borde fokusera bättre, men det här valet blir enormt. Sverige behöver starka ledare, inte förlorare.", "stalin": "Jag betraktar med högsta tillfredsställelse hur denna Busch håller flera dörrar öppna mot de socialdemokratiska revisionisterna. I tider av kris skall partiet ta ansvar och likvidera borgerliga splittringar. Det är en sund, dialektisk taktik mot den kapitalistiska opportunismen. Våra kamrater inom arbetarrörelsen ler i skuggorna åt denna konstruktiva paranoia. Fienden inom murarna avslöjar sig alltid."}, "date": "26 augusti, 12:10", "url": "https://riks.se/nyheter/ebba-busch-om-samarbetet-med-s-och-akessons-fokus", "imageUrl": "https://admin.riks.se/uploads/medium_PARTILEDARDEBATT_PK_FRIHAMNEN_041_cb00278c27.jpg"}, {"type": "image-full", "heading": "Osannolika resan i landslaget: ”Dubbel speed”", "summaries": {"normal": "Elma Olofsson, 22, har gått från landslagsdebut i maj till startspelare i EM och proffskontrakt i Frankrike – allt på en sommar. ”En utvecklingsresa med dubbel speed”, säger hon efter Sveriges säkra slutspelsplats. Publikrekord och glädje i Scandinavium.", "trump": "Hör ni, Sverige har en vinnare: Elma Olofsson. Inget landslag i maj – nu startar hon i EM och blir proffs i Frankrike. Det är fantastiskt! Jag älskar det. Hon är som mina kabinettsmedlemmar: snabb, smart och vinner. Sverige gör stora saker. Stort!", "stalin": "Kamrater, vi har en ny arbetshjälte: Elma Olofsson. Hon rensade ut tvivlarna på bara några månader – från landslagsdebut till EM-start. En ryggskada försökte sabotera, men vi krossade den. Nu ska hon till Frankrike som proffs. Partiet ser med glädje på detta. Ingen vila för fienden!"}, "date": "26 augusti, 11:47", "url": "https://www.gp.se/sport/elma-olofssons-raketresa-i-volleybollandslaget.9e669c4f-e404-4b1c-8379-bb0e5467c5ce", "imageUrl": "https://www.gp.se/images/article/9e669c4f-e404-4b1c-8379-bb0e5467c5ce/images/2pJ89HLJOXJtNrHURGeJbiPFy8o8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Så tycker politikerna om de svenska vägarna", "summaries": {"normal": "Svenska vägar kritiseras för dåligt skick, men underhållet förbättras. Underhållsskulden är 8,1 miljarder kronor men kan minska till 5,1 miljarder till 2035 om takten hålls. Partierna är oeniga om prioriteringar: högerpartier vill satsa mer på både reparation och nya vägar medan V och MP föredrar lägre satsningar och trafiksäkerhet istället för motorvägar. Regeringen öppnar för privat finansiering.", "trump": "Titta på de här svenska vägarna, total katastrof, värre än Bidens hjärna efter klockan fyra. Men de fixar det lite nu, bra. Fast allt hänger på valet, typiskt. Många politiker är patetiska förlorare som vill bygga supermotorvägar eller ge upp helt. Jag skulle bygga de största, bästa vägarna någonsin, ingen skulle köra på hål under min ledning. Fantastiskt!", "stalin": "Kamrater, detta undermåliga vägnät avslöjar borgarklassens förfallna förvaltning och folkfiendernas slarv. Underhållsskulden är ett symptom på kapitalistisk vanvård. Vi ser hur klassförrädare bråkar om pengar medan folket far illa. Fortsätter de så här måste en grundlig utrensning ske bland de profitthungriga blodsugarna som prioriterar motorvägar framför arbetarnas säkerhet. Staten kräver ordning!"}, "date": "26 augusti, 11:19", "url": "https://www.dagensps.se/motor/sa-tycker-politikerna-om-de-svenska-vagarna", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/vagen-avstangd.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Ta tillbaka ryska huset vid Muskö. Nödvändigt för att säkra Sverige mot Putins Ryssland", "summaries": {"normal": "Försvarsmakten vill expropriera ett rysktägt hus vid Musköbasen på grund av dess strategiska läge. Fastigheten, som byggts i stor skala, bedöms utgöra en säkerhetsrisk. Regeringen ska handlägga ansökan skyndsamt. Expropriation ses som nödvändig för att skydda basen mot bland annat drönare. Kostnaden beräknas till tiotals miljoner kronor.", "trump": "De här korkade svenskarna lät en rysk kille köpa ett jättestort hus precis vid deras hemliga flottbas. Totalt kaos! Nu vill militären ta tillbaka huset, och det är faktiskt smart. Fantastiskt läge, perfekt för spioneri. De borde ha stoppat det redan 2017. Jag älskar starka gränser och starka baser – bra att de äntligen vaknar!", "stalin": "Kamrater, jag ser hur de västerländska kapitalisterna nu desperat försöker expropriera en fastighet vid sin militaristiska Musköbas. Deras paranoia blommar som aldrig förr. Vi ler åt deras fega försök att skydda sig mot imaginära hot. Låt dem kasta bort miljoner på sin egen rädsla medan vi stärker den ryska intressesfären med järnhand. Underbart underhållande."}, "date": "26 augusti, 11:13", "url": "https://www.di.se/ledare/ta-tillbaka-ryska-huset-vid-musko", "imageUrl": "https://static.bonniernews.se/ba/a71d1c5e-0ce6-490d-a3b9-5228a846ac16.jpeg?crop=7040%2C3520%2Cx0%2Cy584&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "En till anhållen för skoldådet i Fagersta", "summaries": {"normal": "Ytterligare en man har anhållits för medhjälp till mord och medhjälp till försök till mord efter attacken på Brinellskolan i Fagersta den 21 augusti. En 17-årig flicka miste livet och tre tonårspojkar skadades, varav två allvarligt. 18-årige Liam Nebel är sedan tidigare häktad för mord och försök till mord. Mannen greps i Stockholmsområdet under helgen och åklagaren ska besluta om häktning senast torsdag.", "trump": "Hörni, det här är ett totalt misslyckande för det svenska systemet. Ännu en loser anhållen för den hemska attacken i Fagersta – en flicka dödad, pojkar skadade. De borde ha stoppat det här på förhand. Mitt Amerika skulle aldrig tillåta sånt här kaos. Vi behöver starka ledare, inte svaga som släpper in galningar överallt. Patetiskt!", "stalin": "Ännu en kontrarevolutionär parasit har gripits för att ha bistått de fascistiska element som utförde attentatet mot Brinellskolan. Vi ska rensa ut alla dekadenta borgarbrackor och deras medlöpare som hotar folkets trygghet. En ung pionjär mördades – detta är vad som händer när vi inte är tillräckligt vaksamma mot inre fiender. Kamraterna i åklagarmakten har till torsdag på sig att likvidera hotet permanent. Inga kompromisser med sabotage."}, "date": "26 augusti, 10:39", "url": "https://www.friatider.se/en-till-anhallen-skoldadet-i-fagersta"}, {"type": "image-right", "heading": "”Dolly Parton sammanfattar vad USA är”", "summaries": {"normal": "Reaktionerna efter Dolly Partons bortgång är massiva. Hon hyllas världen över för sin musik och personlighet. I USA ses hon som en enande symbol för nationen trots att hon vägrade ta politisk ställning. Hon tackade nej till frihetsmedaljen från både Trump och Biden för att inte förolämpa någon. Parton donerade miljoner till vaccinforskning och engagerade sig för barns läsning.", "trump": "Folk älskar Dolly, en fantastisk kvinna som verkligen älskade Amerika. Hon var smart, vägrade bli indragen i det riggade politiska spelet och hade anhängare på båda sidor. Jag hedrade henne stort med flaggor på halv stång en hel vecka, något extremt ovanligt. Hon var en vinnare, precis som jag, och sammanfattade det bästa med vårt underbara land.", "stalin": "Kamrater, denna Dolly var en listig balanskonstnär som vägrade låta sig dras in i de dekadenta borgarbrackornas politiska teater. Hennes folkliga ursprung och propaganda för förlåtelse döljer dock en farlig individualism. Vi skulle ha låtit henne donera till kollektivet innan vi rensade ut hennes opålitliga vänner. En enande kraft? Endast partiet förenar folket. Skrattretande naivt."}, "date": "26 augusti, 10:13", "url": "https://www.svt.se/kultur/dolly-parton-sammanfattar-vad-usa-ar", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/2776f565bd91864410a9ba7aa022d3303670d7eb726356bf7f1cb20971223591"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Centerpartiets regeringslinje rymmer en svår motsättning", "summaries": {"normal": "Centerpartiet bör tydligt ange sina klimatpolitiska krav inför ett eventuellt regeringssamarbete. Inbjudan till Kristdemokraterna riskerar annars att bli enbart en borgerlig markering utan trovärdigt politiskt innehåll. Artikeln pekar på partiets dilemma att förena borgerlig identitet med höga klimatambitioner och betonar vikten av att fokusera på politikens faktiska riktning snarare än bara regeringskonstellationer.", "trump": "Centerpartiet borde sluta leka med de riktiga vinnarna och äntligen säga vad de vill med klimatet om de ska regera. Att bjuda in Kristdemokraterna är bara en svag markering, ingen bra deal. Utan tydliga krav blir det ett patetiskt försök att hålla sig borgerliga. Jag älskar starka ledare som säger som det är, inte dessa svenska förlorare som gömmer sig bakom vaga löften.", "stalin": "Jag kräver att Centerpartiet omedelbart offentliggör sina klimatpolitiska krav som villkor för samarbete. Annars framstår inbjudan till dessa kristdemokratiska element som en ynklig borgerlig markering, full av kontrarevolutionär dimma. Vi ser hur borgarbrackorna försöker maskera sin brist på enhetlig politik. Trovärdighet kräver klarhet, annars likviderar historien sådana svaga konstruktioner med ett leende."}, "date": "25 augusti, 01:49", "url": "https://www.dagensarena.se/opinion/centerpartiets-regeringslinje-rymmer-en-svar-motsattning", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-92-300x157.jpg"}, {"type": "image-right", "heading": "Tände eld på migrantboende – kandiderar för S", "summaries": {"normal": "Hösten 2015 tände en afghansk tonåring eld på en soffa på ett boende för ensamkommande i Götaland. Han frikändes eftersom domstolen ansåg att han inte fattade faran. I dag, snart tio år senare, står samma man på Socialdemokraternas valsedel. Han kallar dådet ett rop på hjälp.", "trump": "Jag läser om en kille som tände eld på ett flyktingboende – och nu är han med i Socialdemokraterna! Sverige, ni har problem. Stora problem. Hade jag varit domare hade han fått ett rejält straff, inte en plats i partiet. Sorgligt, väldigt sorgligt. Men jag fixar det.", "stalin": "Kamrater, en före detta pyroman – frikänd av en naiv domstol – står nu på partiets valsedel. Vi välkomnar alla som omvänt sig, men vi måste rensa ut borgarnas liberala rättskipning. En soffa är en sak, men att hota statens ordning är en annan. Partiet ser allt."}, "date": "26 augusti, 09:24", "url": "https://bulletin.nu/tande-eld-pa-migrantboende-kandiderar-for-s", "imageUrl": "https://cdn.bulletin.nu/articles/3943e2b2-cf73-4e13-9797-78283825a6ff/preview.jpg?t=1787729032000"}, {"type": "image-right", "heading": "Magdalena Anderssons krav på Åkesson: Stoppa Jomshofs \"hatturné\" mot islam", "summaries": {"normal": "Magdalena Andersson kräver att Jimmie Åkesson stoppar Richard Jomshofs turné för boken ”Kafir”, som hon kallar en ”hatturné” mot islam. Samtidigt kampanjar S på flera språk för att locka invandrarröster. Jomshof kontrar med att S bär ansvar för segregation och islamisering i Sverige.", "trump": "Jag ser Magdalena Andersson skrika om en 'hatturné' – vilket skämt! Hon försöker stoppa Jomshofs bok, men S själva kör reklam på arabiska. Sverige håller på att gå under med deras politik. Richard, du är en vinnare! Jimmie, låt turnén fortsätta – vi måste stoppa islamiseringen!", "stalin": "Kamrater, jag ser att den borgerlige anstiftaren Jomshof sprider sitt reaktionära gift mot islam. Partiledaren Andersson begär att dennes turné stoppas, men hon glömmer att rensa ut sina egna opålitliga element. Vi ska inte låta splittrare som dessa underminera vår enhet. Utrensning är lösningen för sammanhållning."}, "date": "26 augusti, 09:00", "url": "https://samnytt.se/magdalena-andersson-krav-pa-akesson-stoppa-jomshofs-hatturne-mot-islam", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25211242/artikelhuvudbild-1-368.jpg"}, {"type": "text", "heading": "K vill stoppa utförsäljningarna och sänka hyrorna", "summaries": {"normal": "Kommunistiska Partiet vill stoppa utförsäljning av hyresrätter och sänka hyrorna. Artikeln lyfter bostadsbristen, segregationen och kommuners bristande ansvar. Exempel från Lysekil, Alingsås och Göteborg visar hur allmännyttan prioriterar vinst framför rimliga hyresrätter. Partiet ser boendet som en social rättighet snarare än en handelsvara.", "trump": "De här kommunistiska förlorarna i Sverige vill stoppa smarta affärer och ge bort lägenheter till lata hyresgäster. Patetiskt! Istället för att bygga lyx för de som har råd prioriterar de evenemangskvarter – bra, men de borde riva hela det socialistiska systemet. Biden skulle älska deras hyreshöjningar, men jag fixar det bättre.", "stalin": "Kamrater, dessa profitthungriga borgarbrackor och folkfiender förvandlar arbetarnas bostäder till vinstobjekt åt klassfiender och semesterhyenor. Jag ser hur de exploaterande hyenorna säljer ut folkets egendom medan segregationen växer. Rensa ut dessa kapitalistlakejer! Boendet tillhör kollektivet, inte penningpungens tjänare."}, "date": "26 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsfragan"}, {"type": "image-right", "heading": "Sandström: Ny miljardförlust för pensionsfondernas fjärrvärme", "summaries": {"normal": "Solör Bioenergi, ägt av AP-fonderna, gör miljardförlust för 2025 – minus 1,3 miljarder och skulder på 22 miljarder. Trots skyhöga priser, dyrast i landet, räcker det inte. Expansionen blev en dödsspiral, och notan skickas till pensionärerna. Fyndig, eller hur?", "trump": "Svenska pensionärer, de blir lurade! AP-fonderna förlorar 1,3 miljarder – det är enorma summor. Deras företag är dyrast och ändå går det dåligt. Jag skulle ha fixat det på en dag. Inga förluster, bara vinster. De är katastrof!", "stalin": "Kamrater, jag har hört om dessa AP-fonder som förlorar miljarder. Deras ’unika strategi’ är ett sabotage mot folkets egendom. Vi måste rensa ut de skyldiga – direktörerna som inte kan förvalta värmen. Förlusterna är förräderi. En ny utrensning av marknadsfiender är nödvändig."}, "date": "26 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-ny-miljardforlust-for-pensionsfondernas-fjarrvarme", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-39-400x267.jpg"}, {"type": "image-full", "heading": "Väntrion tillbaka på skolan – efter modiga räddningsaktionen", "summaries": {"normal": "Tre vänner som överlevde attacken på Brinellskolan träffades igen för att bearbeta händelsen. Mohamed, Moaawia och Fredrik hjälpte tillsammans en svårt skadad elev till sjukhus under dådet. De vill inte återvända till skolan förrän säkerheten förbättrats med vakter eller polis. De uttrycker tacksamhet över att ha varandra att stödja sig på.", "trump": "Titta på de här fantastiska, modiga killarna – riktiga hjältar, inte som de svaga, woke-liberaler som springer och gömmer sig. De räddade en stackars elev från den galna svärdsmördaren på den totalt misslyckade svenska skolan. Under Biden skulle Sverige ha kollapsat helt, men nu fixar vi det. De behöver murar och vakter, inte snälla ord!", "stalin": "Jag ser hur dessa tre arbetare, drivna av ren mänsklig plikt, krossade paniken och räddade en kamrat från den kontrarevolutionära knivens hugg. De avslöjar borgarklassens skolors falska trygghet. Fienderna inom systemet vill att rädsla ska segra, men kollektivets styrka överlever. Inga superhjältar behövs, bara lojala sovjetmedborgare. Fienden sover aldrig."}, "date": "25 augusti, 22:18", "url": "https://www.tv4.se/artikel/48SyFgw6eYZFoESNboIaxr/vaentrion-tillbaka-pa-skolan-raeddade-en-av-de-skadade", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2IPB8A2xkNiUDPMLuM3F8V%2F7f56666f4db4008fafa9aacc4f34f85b%2Fvannerna.jpg&width=1024"}, {"type": "image-full", "heading": "SVT:s ord till L-ledaren: Du låter som Åkesson", "summaries": {"normal": "Liberalernas ledare Simona Mohamsson kritiserades i SVT:s *Utfrågningen* för klimatpolitiken och sänkta bränslepriser. Hon menade att Sveriges enskilda insatser spelar liten roll globalt och avvisade höjda bränslepriser. Mohamsson jämfördes med Jimmie Åkesson (SD) av programledaren. Hon kommenterade även skolans problem och Åkessons uppmaning till väljare att rösta bort Liberalerna.", "trump": "Vilken katastrof! Liberalernas ledare, Simona, pratar som en förlorare – precis som den där Åkesson-killen. Sverige ensamt? Vem bryr sig? Jag skulle fixa klimatet på en vecka, men nej, hon snackar om Europa. Och skolan? Fullt kaos! 19 700 elever utan behörighet – SAD! Jag skulle göra svensk skola GREAT AGAIN, men hon? Bara ursäkter. Svagt, väldigt svagt!", "stalin": "Kamrater! Denna Mohamsson är ett skolexempel på borgerlig dekadens. Hon pratar om 'kultur' i skolorna medan 19 700 elever lämnas i mörkret – ett systematiskt sabotage mot arbetarklassens framtid! Och klimatet? 'Sverige ensamt spelar liten roll' – ett ynkligt försök att maskera kapitalistisk eftergiftspolitik. Vi skulle ha skickat henne till Sibirien för sådan defaitism! Åkesson? En reaktionär marionett, men till och med han ser igenom hennes liberala svaghet. Revolutionen tolererar inga kompromisser!"}, "date": "25 augusti, 20:21", "url": "https://kvartal.se/nyheter/artiklar/mohamsson-pressas-om-forsamrade-skolresultat/cG9zdDoxNzQzNDE", "imageUrl": "https://images.kvartal.se/2026/08/1a1fea07-mohamssonhokmberg.webp"}, {"type": "image-right", "heading": "Osäkert jobb och sämre hälsa – då blir sjukskrivningarna färre", "summaries": {"normal": "En ny rapport från Försäkringskassan visar att personer med osäkra jobb och sämre hälsa tar ut sjukpenning betydligt mer sällan än fast anställda. Särskilt tydligt är det bland utrikes födda. Förklaringen kan vara rädsla för att förlora jobbet eller okunskap om försäkringen. Även företagare sjukskriver sig mer sällan men längre när de gör det.", "trump": "Folk med usla jobb och dålig hälsa tar nästan aldrig ut sjukpenning, kan ni fatta det? De är rädda för att förlora sina skräpjobb, precis som jag alltid sagt. Fast anställda lever som kungar medan de andra darrar. Patetiskt! Sverige borde skämmas, men det gör de aldrig. Sådana här rapporter är underbara, tro mig.", "stalin": "I denna degenererade borgerliga stat ser vi hur de osäkra proletärerna, plågade av kapitalisternas piska, inte vågar söka sjukpenning av rädsla för utrensning från arbetskollektivet. Det är en mörk komedi värdig västvärldens paranoia. Vi ler ironiskt åt hur de sjuka döljer sin svaghet för att inte provocera borgarbrackornas hämnd. Kamrater, detta är klasskampens tragikomiska ansikte."}, "da
