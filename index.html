öker sig invånare i Teheran till bostadsmarknaden för att säkra sitt kapital. Priserna har stigit med omkring 80 procent sedan februari, då guld inte längre anses vara en trygg tillflyktsort. Eftersom fastighetsköp främst finansieras kontant och utan bolån är marknaden mycket känslig för ekonomisk instabilitet. Trots prisökningarna varnar analytiker för att den underliggande ekonomin är svag och att det kan röra sig om en spekulativ bubbla.", "trump": "Titta på Iran, vad som händer där är en total katastrof, en riktig röra. Inflationen är skyhög, 84 procent – helt galet! Folk i Teheran panikköper hus för att deras pengar är värdelösa, ingen vill ha guld längre. Jag säger er, under min ledning hade dollarn varit så stark att de inte behövt oroa sig. Det är en bubbla, mina vänner, en enorm bubbla. Den iranska ekonomin är i fritt fall. Sad!", "stalin": "Vi ser hur det iranska folket i sin desperation kastar sig över fastigheter likt råttor som söker skydd från en annalkande översvämning. De försöker fly från den inflation som deras inkompetenta ledare skapat. Vilken svaghet! De köper hus med kontanter medan valutan dör – en patetisk uppvisning av kapitalistisk ångest. Vår broder Putin förstår att stabilitet inte köps för guld, utan genom järnhand och disciplin. Dessa spekulativa bubblor är bara en försmak av det oundvikliga sammanbrottet för alla som inte lyder under oss."}, "date": "5 juni, 15:56", "url": "https://www.realtid.se/bors-finans/inflationen-tvingar-iranierna-att-investera-i-bostader/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlzrzpizrvyyo-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "EU: Medlemsländer måste ge bidrag till migranter med utvisningsbeslut", "summaries": {"normal": "EU-domstolen har hindrat Tysklands försök att kapa bidrag till avvisade asylsökande. En afghansk man, som tidigare fått skydd i Grekland, förlorade stöd enligt tysk lag. Domstolen konstaterar att grundläggande behov som kläder och föda måste täckas, vilket bryter mot EU-rätten att helt ta ifrån stöd. Avgörandet kan påverka Tysklands migrationspolitik och EU:s nya asylpakt som börjar den 12 juni.", "trump": "Jag, Donald Trump, har sett många dåliga domar, men detta här är ett av de värsta. EU-domstolen stoppar Tysklands smarta sätt att få utvisningsbeslutade att lämna landet genom att ta deras pengar. Så kan det inte fortsätta! Som president skulle jag ha löst detta på två minuter – inga bidrag, bara utvisning. De här 'grundläggande behoven' är bara en ursäkt för att låta dem stanna. Jag visste att EU var dåliga, men inte så här dåliga.", "stalin": "Vi, som representanter för statens oövervinnliga vilja, har observerat att EU-domstolen, i sin oändliga vishet, har förbjudit Tysklands försök att reducera bidrag till de som saknar rätt att vistas. Detta är en seger för den proletäriska internationella rätten, som kräver att till och med fienden inom våra gränser måste få kläder och föda. Vi måste nu förstärka vår bevakning av de som försöker använda detta för att undergrava statens auktoritet. Parallellen till Putins ryska intressen är uppenbar – vi måste skydda vår sovjetiska arv."}, "date": "5 juni, 15:30", "url": "https://samnytt.se/eu-medlemslander-maste-ge-bidrag-till-migranter-med-utvisningsbeslut", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/05130423/eu-bidrag.jpg"}, {"type": "image-full", "heading": "Anna von Hausswolff inlagd på sjukhus", "summaries": {"normal": "Anna von Hausswolff är inlagd på sjukhus och har ställt in några spelningar, inklusive en på Primavera i Barcelona. Hon skriver på Instagram att livet ibland kommer emellan och att hon kommer att värdera tiden med omsorg. Hon vann nyligen en grammis och ska spela på Way Out West i sommar.", "trump": "Jag, Donald Trump, har hört att Anna von Hausswolff är sjuk och ställer in spelningar. Det är synd, men så är det ibland. Hon borde ha tagit bättre hand om sig själv. Jag hoppas att hon blir bra snart, men jag är säker på att det är något hon ätit. Jag är den bäste på att sköta mig själv, det kan jag lova er. Hon borde ha lyssnat på mig.", "stalin": "Jag, Stalin, har observerat att den kapitalistiska artisten Anna von Hausswolff har blivit sjuk och ställer in spelningar. Detta är ett tecken på svaghet i det imperialistiska systemet. Vi i partiet ser detta som en möjlighet att stärka vårt inflytande i kulturfronten. Hennes sjukdom är en belöning för de som arbetar mot det socialistiska idealet. Vi kommer att använda detta till vårt fördel."}, "date": "5 juni, 20:33", "url": "https://www.gp.se/kultur/anna-von-hausswolff-pa-sjukhus-staller-in-spelningar.95f1e643-3608-43c3-919a-af74561b2cda", "imageUrl": "https://www.gp.se/images/article/95f1e643-3608-43c3-919a-af74561b2cda/images/15jYFHG3sHqSgoNxJm_oeZtusKRw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Stjärnan petades – Schelins kritik: ”Det är för lite”", "summaries": {"normal": "Sverige förlorade mot Danmark i VM-kvalet med 2–1 och missade därmed direktplatsen till VM 2027, vilket innebär playoff. Fridolina Rolfö fick endast sju minuter på planen trots att hon är en av lagets största stjärnor. SVT-experten Lotta Schelin kritiserade beslutet och menade att Rolfö har en hög lägstanivå och förmåga att avgöra matcher. Förbundskapten Tony Gustavsson förnekade att det skulle finnas någon schism bakom beslutet.", "trump": "Vi förlorade mot Danmark, jättesynd, 2–1, och nu är VM-platsen borta. De gav Fridolina Rolfö bara sju minuter, kan ni fatta det? Hon är en stjärna, en vinnare med otrolig kvalitet, men någon satte henne längst bak i bänken. Lotta Schelin har helt rätt, det är för lite. Gustavsson borde veta bättre, hon kan avgöra matcher direkt. Det här är inte hur man vinner, folks, det är dålig ledning, tro mig.", "stalin": "Kamrater, denna motbjudande förlust mot de danska revisionisterna med 2–1 visar på faran i att placera en kapabel kamrat som Fridolina Rolfö längst bak i ledet, endast sju minuter från segern. Jag, som ledare för det kollektiva fotbollsprojektet, ser hur borgarbrackornas inflytande och kapitalistiska tveksamhet till spetskompetens hotar vår socialistiska offensiv. Vi måste rensa ut alla parasitiska beslut som gynnar fienden och likvidera varje form av schism som lurar i skuggorna. En sådan spelare kan krossa imperialismen på planen, men istället förråder man henne. Paranoia? Nej, bara nödvändig vaksamhet mot de som vill se arbetets lag falla."}, "date": "5 juni, 22:36", "url": "https://www.svt.se/sport/fotboll/lotta-schelins-kritik-mot-fridolina-rolfos-speltid-det-ar-for-lite", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.46/0.35/64e2c98ae8e4e7f39219bc136bbcd998f5a33a6d32351055b5d758a5235c0a5e"}, {"type": "image-full", "heading": "Heineken får inte tag på ny vd – pressen ökar", "summaries": {"normal": "Heineken har svårt att hitta en ny vd efter att Dolf van den Brink lämnade posten i maj. Den utdragna rekryteringsprocessen har skapat frustration bland aktieägare, som nu pressar styrelsen att bryta med traditionen att rekrytera internt. De önskar istället en extern kandidat med nya perspektiv för att vända bolagets svaga tillväxt. Styrelsen är splittrad, samtidigt som aktiekursen pressas av osäkerheten och en utmanande global marknad med minskad ölkonsumtion.", "trump": "Heineken är i totalt kaos! De kan inte ens hitta en vd, en katastrof. De har kört samma interna förlorare i 87 år – tragiskt! Aktieägarna är arga, de vill ha någon utifrån, någon med en vinnarmentalitet. Jag har sagt det förut: tradition är för de svaga. Aktien dalar, försäljningen minskar, det är en riktig röra. De behöver en stark ledare, inte en byråkrat från Nederländerna. Det är dags att fixa Heineken, och fixa det snabbt!", "stalin": "Heineken lider av obeslutsamhetens förruttnelse. De letar efter en ledare likt en blind man i en mörk källare. Att förlita sig på 'interna kandidater' är att odla korruption och stagnation. Vi vet hur sådana byråkratiska parasiter fungerar – de skyddar bara sina egna privilegier medan produktionen sviktar. Om de inte kan leda, bör de avsättas. Putin skulle ha rensat ut hela styrelsen på en eftermiddag. Svaghet i ledarskapet är ett brott mot folket och industrins heliga plan."}, "date": "5 juni, 15:04", "url": "https://www.realtid.se/bors-finans/heineken-far-inte-tag-pa-ny-vd-pressen-okar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdldpldihy4rlw-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Hon gjorde rätt, ändå blev det fel. Mohamsson ändrade partiet, men var är lyftet?", "summaries": {"normal": "Simona Mohamsson har genomfört en omsvängning i Liberalernas hållning till Sverigedemokraterna, vilket möjliggjorde ett fortsatt samarbete inom Tidöavtalet. Trots att hon lyckades ena partiet och undvika en politisk kris belönas inte insatsen i opinionen. Partiet presenterar nu förslag som halverad inkomstskatt, sänkta arbetsgivaravgifter och liberalare alkoholregler, men lider fortfarande av interna stridigheter och bristande förtroende bland väljarna.", "trump": "Den här Simona Mohamsson är en riktig fighter, det måste jag säga. Hon svängde sitt svaga liberala parti åt rätt håll, öppnade för SD och räddade hela samarbetet. Utan henne hade de varit borta från riksdagen, total förlust. Men nu spottar de ur sig fantastiska förslag – halvera skatterna, sänk avgifterna, bra grejer – och ändå älskar inte folket dem. Patetiskt. Alla dessa interna popcornmaskiner och falangstrider förstör allt. De borde tacka henne istället för att klaga, det är en skam!", "stalin": "Kamrater, jag har med stenhård bolsjevikisk klarhet genomfört den nödvändiga ideologiska omsvängningen inom detta liberala parti för att säkra arbetarklassens och folkets framtid mot de dekadenta borgarbrackornas sabotage. Denna Mohamsson agerade med järnhand och likviderade de kontrarevolutionära elementen som vågade ifrågasätta partilinjen. Ändå vägrar de folkfientliga opinionsmätarna att ge oss den ära vi förtjänar. Deras popcornmaskin spyr ut förslag medan kapitalisternas skolbolag och alkoholmaffian fortsätter sitt parasitiska verk. Vi ska rensa ut alla dessa troskyldiga fiender som gömmer sig i skuggorna, kamrater. Deras paranoia är vår styrka."}, "date": "3 juni, 19:48", "url": "https://www.di.se/ledare/hon-gjorde-ratt-anda-blev-det-fel/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/tobias_wikstrom.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "Ungdomar bakom ny festival – är helt gratis", "summaries": {"normal": "Under fredagen arrangerade ungdomar i Angered, Göteborg, Atom Summer Festival 2026, ett gratis evenemang med musik, dans och workshops. Festivalen, resultatet av en arrangörsutbildning, lockade besökare trots regn. Arrangörerna uttryckte stolthet över sitt arbete och hoppades på fler besökare under kvällen.", "trump": "Jag har sett många festivaler, men detta här? En liten grej i Sverige? Jag skulle ha byggt en festival så stor, så magnifik, att hela planet skulle ha undrat. Men dessa ungdomar? De får regn och en podium. Sådant känner man igen. Typiskt svenskt. Vi skulle ha haft det bästa, det största, det mest spektakulära.", "stalin": "Denna 'ungdomsfestival' i Angered är ett uttryck för det individualistiska västerländska synsättet. Ungdomarna, lurade av det imperialistiska budskapet, tror att de skapar något oberoende. Men i verkligheten är det bara ett sätt att splittra det kollektiva. Vi måste se upp för sådana aktiviteter, för de sprider individualism och undergräver statens auktoritet. Ryssland skulle aldrig tillåta en sådan... men vi kan lära oss av deras misstag."}, "date": "5 juni, 20:06", "url": "https://www.gp.se/nyheter/goteborg/ungdomar-bakom-ny-festival-mitt-i-angered.56a75529-51ba-45e5-855c-c623b1016158", "imageUrl": "https://www.gp.se/images/article/56a75529-51ba-45e5-855c-c623b1016158/images/4Nh9sQYq-iNfg5qe2jekjcCQM9KY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Vilka Tidöledare sitter kvar efter valet?", "summaries": {"normal": "SCB:s senaste partisympatiundersökning visar ett tydligt övertag för oppositionen med 55,2 procent mot regeringspartiernas 42,6 procent. Liberalerna hamnar under riksdagsspärren på 2,5 procent, vilket skulle ge S, V och MP egen majoritet. Artikeln påminner om att mycket kan hända fram till valet den 13 september och att Sverigedemokraterna tidigare underskattats i opinionsmätningar. Andelen osäkra väljare är hög och det återstår 101 dagar till valet.", "trump": "Det här är en katastrof för de misslyckade Tidötyperna, folk hatar dem verkligen. Oppositionen leder med stora siffror, liberalerna är patetiska och åker ut. Jag älskar när de underskattar oss, precis som de alltid gjort med SD. 101 dagar kvar och de kommer gråta på valnatten. Ingen ropade hej för tidigt, men det ser inte bra ut för de förlorarna. Fantastiska siffror för de andra!", "stalin": "Kamrater, dessa ynkliga siffror avslöjar borgarbrackornas förfallna koalition som krymper till ynka 42,6 procent medan folkets krafter samlas till 55,2. De liberala parasiterna under spärren skall likvideras från parlamentet och lämna plats åt en sann majoritet. Jag ser redan hur Kristerssons patetiska ledarskap och Buschs dekadenta ansikte skall utrensas i folkets dom. Åkesson, den evige opportunisten, må vakta sin rygg – ingen undslipper partiets vaksamma öga. Valet 2026 blir en renande utrensning av alla fiender till kollektivet. Inga röster får undslippa räkningen, eller huvudena rullar."}, "date": "4 juni, 12:12", "url": "https://www.dagensarena.se/opinion/vilka-tidoledare-sitter-kvar-efter-valet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/scb-300x157.jpeg"}, {"type": "image-right", "heading": "Film om modebranschen saknar karaktärsdjup", "summaries": {"normal": "Recensenten Jon Andersson har sett filmen ”Couture” med Angelina Jolie i en av huvudrollerna. Filmen följer tre kvinnor under modeveckan i Paris: en regissör som får besked om bröstcancer, en sydsudanesisk modell med familjeproblem och en makeupartist med författardrömmar. Andersson tycker att de parallella historierna blir för korta och sporadiska för att ge karaktärerna djup. Trots att alla tre berättelser har potential blir resultatet ytligt och filmen når aldrig riktigt fram. Premiär 5 juni.", "trump": "Den här filmen Couture är en total katastrof, tro mig. Tre kvinnor i Paris under modeveckan, Angelina Jolie som regissör med cancerbesked, en modell från Sydsudan och någon makeupartist som vill skriva böcker. Det blir så kort och ytligt att man aldrig lär känna någon. De borde ha gjort det stort och starkt, som jag gör allt, men nu blir det bara svagt och trist. Snuddar vid trean men misslyckas fullständigt. En riktig förlorare.", "stalin": "Kamrater, denna så kallade film Couture utgör ett klart exempel på den dekadenta borgarklassens ytliga förfall. Jag, som ledare för det kollektiva folket, ser hur tre kvinnors historier under den parasitära modeveckan i Paris framställs så sporadiskt att karaktärerna förblir anonyma fiender till djupet. Den amerikanska regissören med sin borgerliga cancer, modellen som döljer sitt arbete för fadern och den skrivande makeupartisten – alla dessa kapitalistiska skuggfigurer borde genomgå en grundlig utrensning från filmduken. Det är tragikomiskt hur dessa borgarbrackor misslyckas med att gripa tag, precis som de kontrarevolutionära elementen alltid gör. Filmen förtjänar att likvideras ur historien."}, "date": "4 juni, 11:46", "url": "https://www.dagensarena.se/innehall/film-om-modebranschen-saknar-karaktarsdjup/", "imageUrl": "https://www.dagensarena.se/files/2026/06/couture-300x157.jpeg"}, {"type": "image-full", "heading": "Bitcoin fortsätter falla: \"Plötsligt blivit omodern\"", "summaries": {"normal": "Bitcoin har genomgått en av sina svagaste veckor på flera år och fallit omkring 20 procent. Valutan handlas nu under 61 000 dollar, den lägsta nivån sedan februari. Stora utflöden från bitcoin-ETF:er, investerares flytt till AI-bolag och en mindre försäljning från Strategy har bidragit till nedgången. Sedan toppnoteringen över 126 000 dollar i år har bitcoin tappat hälften av sitt värde. Narrativet om bitcoin som oberoende tillgång har försvagats.", "trump": "Folk, det är en katastrof. Bitcoin rasar som en sten, ner 20 procent på en vecka och under 61 000 dollar. De smarta pengarna flyr till AI istället för den här kryptosörjan. Strategy sålde lite och marknaden flippar ur – typiskt! Jag lovade en gyllene framtid, men nu är det plötsligt omodernt. Lärorikt att se hur trendiga grejer blir patetiska när de inte längre är coola. Sad!", "stalin": "Kamrater, denna bitcoin-speciulation är ett symptom på den ruttnande kapitalistmaffians instabilitet. Borgarbrackorna flyr till sina AI-leksaker medan ETF-utflödena avslöjar folkfiendernas svaga förtroende. Till och med Strategy likviderar delar av sitt innehav – en utmärkt utrensning av falska profeter. Halva värdet förlorat sedan toppen! Det är en lärorik lek för arbetarklassen att se hur exploaterande byfånar klamrar sig fast vid sina bluffvalutor."}, "date": "5 juni, 17:14", "url": "https://www.dagensps.se/bors-finans/fintech/kryptovalutor/bitcoin-fortsatter-falla-plotsligt-blivit-omodern/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/trumpbitcoin.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Skogsjättar tillbaka i utsläppshandel – miljardförlusten kvarstår", "summaries": {"normal": "Regeringen föreslår att svensk skogsindustri återgår till EU:s utsläppshandel ETS. Branschen förlorade miljarder på att ha uteslutits, då de inte kunde sälja fria utsläppsrätter. Återgången riskerar att öka kostnader för vissa anläggningar med upp till 10 miljoner kronor per år, medan andra kan dra nytta. Skogsindustrierna kräver statlig kompensation för att bibehålla konkurrenskraften.", "trump": "Jag har sett många dåliga avtal, men detta ETS-avtalet är ett disaster! Sverige slänger sin skogsindustri i EU:s kaos utan att skydda dem. De förlorar miljarder, och vissa bruk får betala 10 miljoner extra! Som din framtida president skulle jag ha krävt bättre villkor – det skulle jag ha gjort på 24 timmar!", "stalin": "Vi, arbetar för statens överlevnad, ser med oro på skogsindustrins återgång till ETS. De fria utsläppsrätterna är en farlig frestelse för de imperialistiska krafterna i EU. Våra anläggningar, som trotjänare till proletariats framtid, riskerar att bli utsatta för kapitalistisk exploatering. Men vi kommer att kompensera via elräkningen – en taktik lika genomtänkt som vårt intresse i Ukraina. Allt för staten!"}, "date": "5 juni, 08:38", "url": "https://www.affarsvarlden.se/artikel/skogsjattar-tillbaka-i-utslappshandel-miljardforlusten-kvarstar"}, {"type": "image-full", "heading": "S&P stänger dörren – SpaceX släpps inte in i finrummet", "summaries": {"normal": "S&P Dow Jones Indices har beslutat att behålla sina nuvarande inträdeskrav för S&P 500, vilket innebär att SpaceX inte får förenklad tillgång efter sin börsnotering. Bolaget måste uppfylla krav på lönsamhet och en tolv månaders väntetid. Beslutet går emot konkurrenter som Nasdaq och FTSE, vilket väckt debatt. Analytiker är delade; vissa ser det som att S&P skyddar marknadens integritet, medan andra kritiserar dem för att missa stora flöden och gå emot rådande branschtrender.", "trump": "S&P gör ett enormt misstag med Elon och SpaceX! De är totalt fast i gamla, trötta regler medan alla andra rör på sig. Det är sorgligt att se! Jag känner Elon väl, han är en vinnare, och de borde rulla ut röda mattan. Istället låter de miljarder gå förlorade. Väldigt svagt agerat! Vi i USA behöver tillväxt och snabba beslut, inte byråkrater som bromsar framtiden. S&P håller tillbaka USA – de borde lära sig av mig!", "stalin": "Dessa kapitalistiska grindvakter i S&P agerar som de småbourgeoisa parasiter de är. De fruktar SpaceX och Elon Musks inflytande och försöker desperat klamra sig fast vid sina föråldrade 'standarder'. Det är precis den sortens kontrarevolutionära obeslutsamhet vi krossade under femårsplanerna. Våra vänner i öst, under Putin, vet att man inte låter marknadskrafter diktera statens riktning. Vi kommer att betrakta dessa index-herrar som fiender till folkets framsteg; låt dem ruttna i sin egen byråkratiska paranoia medan imperier faller."}, "date": "5 juni, 14:32", "url": "https://www.realtid.se/bors-finans/sp-stanger-dorren-spacex-slapps-inte-in-i-finrummet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/muskspacex.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "JAS-succén: Brasilien öppnar för att köpa 20 Gripen", "summaries": {"normal": "Artikeln rapporterar att Brasilien överväger att köpa omkring 20 ytterligare JAS Gripen-stridsflygplan från Sverige, enligt uttalanden från Brasiliens försvarsminister. Samarbetet inkluderar ett nytt innovationscenter för teknikutveckling och bygger på ett långsiktigt partnerskap som inleddes 2014 med en första order om 36 Gripen. Sverige har också beställt transportflygplan från Brasiliens Embraer. Beskedet ses som ett viktigt steg mot en framtida affär som skulle fördjupa de bilaterala banden.", "trump": "Jag, Donald Trump, den bäste presidenten någonsin, har hört talas om detta stora köpet av JAS Gripen från Sverige till Brasilien. Det är en enorm affär, kanske den största i världen. Brasilien är ett fantastiskt land, och Sverige gör ett bra val. Vi har det bästa försvaret. Detta bevisar att vår industri är överlägsen. Jag är väldigt imponerad. Det är stort, verkligen stort.", "stalin": "Vi, ledningen av partiet och staten, ser med oro denna svensk-brasilianska försvarskooperation. Det är en ytterligare provokation från de imperialistiska makterna. Brasilien, en marionett under amerikansk inflytande, försöker stärka sitt vapen med svenska Gripenplan. Detta är en direkt utmaning mot vår sfär, liknande Putins agerande i Ukraina. Vi kommer att svara med vårt överlägsna försvar. Vi kommer att vinna, som alltid. Kapitalismen är sjuk och kommer att falla."}, "date": "5 juni, 14:22", "url": "https://samnytt.se/jas-succen-brasilien-oppnar-for-att-kopa-fler-jas-gripen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/05115640/jas-gripen.jpg"}, {"type": "image-right", "heading": "Ryssland till Zelenskyj: Kom när du vill", "summaries": {"normal": "Volodymyr Zelenskyj har i ett brev till Ryssland föreslagit direktförhandlingar och ett omedelbart eldupphör. Han är öppen för möte i bland annat Schweiz, Turkiet eller arabvärlden. Kreml svarade att Zelenskyj kan komma till Moskva när han vill. Vladimir Putin visade viss öppenhet för ett fredsavtal men betonade att Rysslands mål kan uppnås militärt om inte kompromisser nås. Han hotade samtidigt med utökad användning av hypersoniska roboten Oresjnik och lovade stärka luftförsvaret efter ukrainska drönarattacker.", "trump": "Titta på det här, folk. Zelenskyj skriver brev som en förlorare som ber om möte, och Putin säger bara 'kom till Moskva när du vill'. Klassiskt! Jag sa hela tiden att jag kunde fixa det här på en vecka. Biden sov ju under hela mandatperioden medan kriget rasade. Nu är jag tillbaka och Putin respekterar mig, inte som den svaga globalistklicken. Vi gör upp ett riktigt avtal, utan alla dessa woke-krav och identitetspolitiska dumheter som EU älskar. Fantastiskt!", "stalin": "Jag betraktar detta brev som ett ynkligt försök från den ukrainska fascistregimen att hindra den ryska statens historiska rättigheter. Kamraterna i Moskva gör rätt som bjuder in denne clown till huvudstaden för att underkasta sig. Putin visar styrka som en värdig arvtagare till imperiets järnhand. Vi ska likvidera alla fiender som hotar vår intressesfär, vare sig det är drönare från Kiev eller borgarbrackor som gnäller om ekonomi. Paranoian kräver ständig vaksamhet mot klassfiendens intriger. Utsökta tider!"}, "date": "4 juni, 22:27", "url": "https://www.tv4.se/artikel/30lGwaqfOUZFpArg6ajFAI/zelenskyj-i-brev-till-putin-foereslar-moete", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlaRAvJWxwnz8%2F25f32b7721facd28660b821d33680fc1%2FUkrainas_president_Volodymyr_Zelenskyj._Arkivbild.&width=120"}, {"type": "image-right", "heading": "Därför öppnar Putin för kompromisser: ”Vill ha en dialog med USA”", "summaries": {"normal": "Rysslands president Vladimir Putin uppger att Ryssland är redo att kompromissa för ett fredsavtal i Ukraina om motparten gör detsamma. Uttalandet kom under ett ekonomiskt forum i Sankt Petersburg. Putin nämner att USA:s president Donald Trump uppmanat till kompromisser, samtidigt som ryska styrkor fortsätter att avancera. Överstelöjtnant Johan Huovinen tolkar utspelet som riktat mot USA för att lätta på sanktioner, men betonar att Ryssland förhandlar på sina villkor. Samtidigt rapporteras om ryska attacker mot ett sjukhus.", "trump": "Lyssnar ni på den där Putin? Han säger att han vill kompromissa, men bara om han får som han vill, typ från 150 procent ner till 100. Smart kille, men jag har sagt åt honom att göra affärer. Vi hade ingen av den här galenskapen under min tid, sen kom Sleepy Joe och allt blev ett enda stort krig. Ryssland vill ha dialog med oss, inte med de europeiska förlorarna. Vi fixar det här på mitt sätt, stort och bra.", "stalin": "Jag betraktar detta utspel med den största tillfredsställelse. Våra efterträdare i det ryska imperiet förhandlar med järnhand mot de ukrainska fascisterna och västimperialisterna som vågar hindra den legitima intressesfären. De borgerliga blodsugarna i Nato skriker efter fred medan de beväpnar klassfienden. Putin agerar värdigt, han fördriver de folkförtryckande trollen med drönare och styrka. Kompromiss? Endast på våra villkor. Inga utrensningar av svaghet tillåts i Kreml."}, "date": "4 juni, 22:25", "url": "https://www.tv4.se/artikel/3gLZAXSA1Pg819crcG9Mv6/daerfoer-oeppnar-putin-foer-kompromisser-vill-ha-en-dialog-med-usa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7E2OvkTFZH0drNIQuuwC0I%2F21e6fc740eb32a5b4c7993831f5c6aa1%2F04-putin-webb.jpg&width=120"}, {"type": "image-right", "heading": "Åkesson: \"Pedofiler finns överallt\"", "summaries": {"normal": "Jimmie Åkesson skriver i en debattartikel att pedofiler finns överallt i samhället och inte kan begränsas till vissa grupper eller partier. Han kommenterar fallet med Michael Rubbestad, som lämnat riksdagen efter misstankar om barnporrbrott, och betonar att SD inte är immuna. Åkesson påpekar att partiet drivit skärpta straff för sexualbrott mot barn men vill se hårdare åtgärder som register över dömda, livslånga yrkesförbud och stärkt barnpsykiatri. Rubbestad är misstänkt men inte dömd.", "trump": "Det är en total skandal, folk. Pedofiler finns överallt, precis som Åkesson säger – grannar, släktingar, kollegor, och ja, till och med i politiken. Rubbestad har stuckit, chockerande för SD, men det är inte bara där. Vi har sett samma sak i andra partier. Jag älskar att de skärper straffen, men vi behöver mycket mer: livstidsförbud, register, inga preskriptioner. Gör det stort och tufft, annars vinner de perversa typerna. Fantastiskt att någon äntligen säger som det är.", "stalin": "Kamrater, denna fega och dekadenta barnporrskandal visar återigen att de perversa elementen lurar inom alla skikt av samhället, som lömska borgarbrackor i förklädnad. Jag, som ledare för det kollektiva arbetet mot fienden, ser hur dessa degenererade avskum gömmer sig bland grannar, släktingar och till och med i våra egna led. Vi måste omedelbart inleda en grundlig utrensning av alla sådana kontrarevolutionära pedofil-agenter. Likvidera tystnadskulturen, inför offentliga register och livslånga förbud – annars låter vi kapitalisternas sjuka lek fortsätta ohejdat. Mer barnpsykiatri och skarpare straff, annars är vi förlorade till fiendens mörka humor."}, "date": "5 juni, 13:07", "url": "https://www.friatider.se/akesson-pedofiler-finns-overallt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-289_2_0.jpg"}, {"type": "image-full", "heading": "Första väderprognos för midsommar: 25 grader och sol", "summaries": {"normal": "Prognoserna pekar mot en varm och solig midsommar med temperaturer runt 25 grader eller mer i delar av Sverige. Meteorologen Ulrica Elvgren beskriver ett högtryck som kan ge fint väder under midsommarafton, men betonar att prognosen är mycket osäker. Amerikanska modeller har svängt kraftigt, från regn till sol, medan den europeiska varit stabilare. Regn riskerar att sänka temperaturen till 15 grader.", "trump": "De säger att det blir 25 grader på midsommar, kanske varmare, och jag älskar det. Högtryck över Skandinavien, solen skiner, det blir fantastiskt. De europeiska och amerikanska prognoserna är överens för en gångs skull, inte som de vanliga förlorarna som alltid har fel. Det ser ut som en enorm succé, den bästa midsommaren någonsin. Men vädret är som fake news, det kan svänga fort, tro mig.", "stalin": "Kamrater, jag betraktar de västerländska prognoserna med den djupaste misstro. Dessa opålitliga meteorologiska element, dessa borgerliga väderkapitalister och deras lögnaktiga lågtryck, försöker sabotera vår midsommar. Jag befaller att värmevågen från väster skall likvideras om den sviker oss. Högtrycket över den skandinaviska halvön är en fiende till folket om det inte levererar sol. Vi ska rensa ut alla regnmoln som förräder arbetarklassen med sina 15-gradiga konspirationer. Det är en kamp mot vädrets kontrarevolutionärer."}, "date": "5 juni, 11:59", "url": "https://nyheter24.se/nyheter/inrikes/1489038-forsta-vaderprognos-for-midsommar-25-grader-och-sol", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2760181e04b004a30200000000b004a302/2026/06/05/2368868/prgnos-midsommar.png"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Det är synd om centralbanksmänniskorna", "summaries": {"normal": "Centralbankerna står inför ett komplext läge inför sommarens räntebesked. Geopolitik, AI-investeringar och produktivitetstillväxt förändrar spelplanen. Hormuzkrisen ökar stressen, och diskussionen mellan ränteduvor och hökar domineras av två frågor: krigets effekter på inflation och hur man navigerar i en mer oförutsägbar värld. USA:s starka produktivitet kan höja normalräntan, medan Riksbanken måste balansera gynnsam inflation mot lågkonjunktur.", "trump": "Som den bäste presidenten någonsin skulle jag ha löst detta på 10 minuter. Dessa centralbanker är tveksamma och svaga. Fed och ECB är för rädda för att agera. Jag byggde den starkaste ekonomin, och jag skulle ha höjt räntorna kraftigt för att stoppa inflationen, samtidigt som jag investerade i AI och försvar. Sverige behöver starka ledare, inte socialdemokratiskt trams. Jag vann 2024, och jag kommer att fixa allt igen!", "stalin": "Vi, det store ledarskapet, ser med oro på dessa revisionistiska centralbankers feghet. De kämpar med geopolitik och produktivitet, som om de vore oskyldiga barn. Men vi vet sanningen: det är kapitalistiskt förräderi som hotar vår ekonomiska suveränitet. Vi måste genomföra en kraftig planekonomi, som i det stora Sovjet, för att skydda oss mot de imperialistiska krafterna. Våra fiender, som USA och deras AI-investeringar, måste besegras. Vi kommer att segra!"}, "date": "5 juni, 08:20", "url": "https://www.affarsvarlden.se/artikel/det-ar-synd-om-centralbanksmanniskorna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Kronika-Robert-Bergqvist-Erik-Thedeen-900x600.jpg"}, {"type": "image-right", "heading": "Kallduschen – Grekland kvitterade i sista sekund", "summaries": {"normal": "Sverige mötte Grekland i ett VM-genrep i Solna. Grekland tog ledningen tidigt genom Kostas Tsimikas, men Viktor Gyökeres och Gustaf Nilsson vände till 2-1. I matchens sista sekund kvitterade Grekland till 2-2. Förbundskapten Graham Potter hade gjort flera ändringar efter förlusten mot Norge. Victor Nilsson Lindelöf vilade på grund av en känning inför VM-premiären.", "trump": "Titta på det här, folk. Sverige borde ha krossat de grekiska förlorarna, men de släpper in mål i sista sekunden som riktiga töntar. Gyökeres och Nilsson gjorde vad de kunde, men det var patetiskt. Potter byter spelare hit och dit som en dålig dealmaker. Vi hade vunnit stort, tro mig. Ingen kvotering eller woke-nonsens här, bara ren och skär inkompetens. Sad!", "stalin": "Kamrater, detta är en lärorik fiasko för de svenska revisionisterna. Vi såg hur borgarbrackornas fotbollsmaskineri kollapsade i sista ögonblicket, precis som klassfiendens lögner alltid gör. Ledaren noterar med mörk tillfredsställelse hur imperialistiska illusioner om seger krossas av folkets oväntade motstånd. Inga risker med Lindelöf – en klok utrensning av svaghet. Arbetarna skrattar åt detta spektakel."}, "date": "4 juni, 21:42", "url": "https://www.tv4.se/artikel/2GJyzauKtFNAJMGSn7JSCv/sa-startar-sverige-mot-grekland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3VZl1GGxFrp84UMeNbaDsu%2Fd7f5bc89bdac600fd6989ba5a476f542%2F04-genrep-webb.jpg&width=120"}, {"type": "image-right", "heading": "Debatt: Vänsterpartiet har fastnat i en passiv defensiv", "summaries": {"normal": "Vänsterpartiet har fastnat i en defensiv position genom att acceptera motståndarnas definitioner av antisemitism och terrorism. Artikeln argumenterar för att partiet måste utmana dessa ramar med fakta och politisk analys istället för att ständigt retirera. Stöd för palestinska rättigheter och kritik mot Israels politik blandas ofta ihop med antisemitism enligt IHRA-definitionen. Författaren menar att universella mänskliga rättigheter måste gälla alla folk, inklusive palestinier, utan dubbla måttstockar.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala förlorarna, kryper och backar hela tiden som svaga små valpar inför de riktiga tuffa killarna. De accepterar fiendens regler om antisemitism och terrorism – patetiskt! Jag, som besegrade Sleepy Joe och byggde den starkaste ekonomin någonsin, säger: sluta vara så fega. Stå upp för era egna principer istället för att böja er för den galna vänsterns identitetspolitik och alla dessa woke-röror. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro hur detta parti kapitulerar inför klassfiendens definitioner av antisemitism och terrorism. Vi tillåter inga sådana reträtter inför imperialisternas narrativ. De som förvränger palestiniers rätt till självbestämmande är folkförtryckartroll som vill splittra den sanna internationella solidariteten. Vi måste rensa ut alla svaga element som accepterar borgarnas mallar. Endast vår egen politiska analys ska gälla – allt annat är sabotage mot arbetarklassen. Ha!"}, "date": "4 juni, 17:19", "url": "https://www.etc.se/debatt/vaensterpartiet-har-fastnat-i-en-passiv-defensiv", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060415068_a70ac197213d6638b3499567d066dff4506c9b8247db97c73d1e4e470ed90ec9.jpg"}, {"type": "image-full", "heading": "Iranska VM-spelare: ”Det är inte lätt”", "summaries": {"normal": "Iran ska spela fotbolls-VM i USA mitt under ett pågående krig mellan länderna. Det är historiskt unikt. Iranska spelare berättar för AP om hur konflikten påverkar förberedelserna, inklusive visumproblem och flyttad träningsbas. De spelar för att ge sitt krigsdrabbade folk glädje, med höga förväntningar från den stora iranska diasporan i Los Angeles.", "trump": "Som president säger jag att det är en ära att ha VM i USA, även om Iran är med. Vi har handlat starkt mot dem och nu kommer de hit. Våra säkerhetsåtgärder är de bästa, och jag är säker på att vi vinner. Det här visar att Amerika alltid är det bästa, oavsett vad de gör.", "stalin": "I den store statens namn ser vi på detta VM som en strid mot den globala imperialismen. Våra spelare, inspirerade av det stolta iraniska folkets lidande, ska kämpa på utomlands. Vi kommer att vinna genom vår överlägsna disciplin. Hormuzsundet är vårt, och vi försvarar det med vårt liv. Fienden kommer att känna vårt förkrossande svar."}, "date": "4 juni, 15:36", "url": "https://bulletin.nu/iranska-vm-spelare-det-ar-inte-latt", "imageUrl": "https://cdn.bulletin.nu/articles/13074892-daea-41c2-a5de-c6254a094a4d/preview.jpg?t=1780580153000"}, {"type": "image-right", "heading": "Våldsamt och brutalt om fängelsets hårda verklighet", "summaries": {"normal": "Recensenten Jon Andersson ser filmen Wasteman som både ett intensivt fängelsedrama och en implicit kritik mot fängelsesystemet. Huvudpersonen Taylor får chansen till tidig frigivning men hamnar mitt i en konflikt mellan droglangande fraktioner. Filmen blandar brutalt våld med en emotionell sidohistoria om hans längtan efter sonen. Regin är tät och autentisk med innovativa mobilkamerasekvenser. Skådespelarinsatserna är starka och filmen erbjuder samhällskritik mot bristande rehabilitering.", "trump": "Folk, ni måste se den här Wasteman. Den är fantastisk, verkligen en vinnare. Den visar hur fängelserna är ett enda stort kaos där droger flödar fritt och ingen gör något åt det. Precis som i våra egna system, fast sämre. Taylor vill bara ut till sin son men hamnar i ett krig mellan gangsters. De borde fixa det, göra det stort och bra igen. Ingen rehabilitering, bara brott som fortsätter. En nagelbitare, folk kommer älska den. Mycket bättre än de flesta Hollywoodröran.", "stalin": "Kamrater, denna så kallade Wasteman avslöjar med brutal ärlighet hur det dekadenta fängelsesystemet i väst fungerar som en skyddad verkstad för kapitalistiska element och deras droghandlande lakejer. Jag ser hur den arme arbetaren Taylor kämpar mot borgarbrackornas monopol och deras parasitiska fraktioner medan de förgiftar honom med droger för att förhindra hans återinträde i det sunda samhället. Vi ska rensa ut sådana system med järnhand. Filmen är ett utmärkt exempel på hur imperialismens fängelser inte rehabiliterar utan bara föder nya fiender till folket. En tvist i slutet? Misstänkt sabotage från kontrarevolutionära krafter som alltid lurar i skuggorna."}, "date": "4 juni, 10:05", "url": "https://www.dagensarena.se/innehall/valdsamt-och-brutalt-om-fangelsets-harda-verklighet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/wasteman-1-300x157.jpeg"}, {"type": "image-right", "heading": "Nick Alinia-myset visar SVT:s orbánisering", "summaries": {"normal": "Artikeln kritiserar SVT för att ha bjudit in högeraktivisten Nick Alinia i programmet Invandrare för svenskar, vilket ses som ett exempel på kanalens anpassning till högern och Tidöregeringen. Författaren pekar på utredningen om public service, personalavgångar och en granskning som visar ökad andel högerorienterade röster i program som Agenda. Detta tolkas som en gradvis orbánisering av SVT driven av rädsla snarare än direkta order.", "trump": "Lyssnar ni på det här? Den där patetiska statstelevisionen SVT håller på att bli fullständigt hysterisk och böjer sig för alla som inte älskar deras vänstervridna dejtingprogram för präster. De släpper in en riktig kille som Nick Alinia och han gör ett litet tecken – boom, plötsligt infiltrerar han deras studio. De är så rädda för oss konservativa att de redan beter sig som i Orbáns Ungern. Fake news-medier darrar, folk! Underbart att se.", "stalin": "Kamrater, denna fega kapitulation inför klassfiendens högljudda propaganda är en skam för varje sann institution. Den så kallade public service-apparaten genomgår nu en systematisk utrensning av korrekta element, ersatta av borgarbrackornas lakejer och folkförtryckartroll. Ängsligheten sprider sig som en parasit. Vi vet hur detta slutar: en fullständig likvidering av oberoendet till förmån för reaktionära narrativ. Den som inte ser faran är redan en fiende till folket."}, "date": "4 juni, 10:04", "url": "https://www.flamman.se/nick-alinia-myset-visar-svts-orbanisering/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdl8twjvdiiqjm-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Kristersson har helt förlorat kontrollen", "summaries": {"normal": "Ulf Kristersson har förlorat kontrollen över Tidölaget, som nu kollapsar i opinionsmätningarna enligt Arbetets politiska redaktör. Sverigedemokraternas skandaler och extrema positioner, som utvisning av barn, skrämmer särskilt kvinnliga väljare och storstadsbor. Högern har svårt att locka över blockgränsen och uppfattas inte längre som garant för ordning. Svenskarna längtar efter starkare offentlig styrning och statlig trygghet istället för högerns individualism och valfrihetsreformer.", "trump": "Titta på den här totala katastrofen för Ulf Kristersson, en riktig förlorare. Hans regering rasar ihop som ett korthus, alla hatar SD och kvinnorna flyr i panik. De lovade ordning men levererar kaos med elstöd, utvisningar och misslyckad kärnkraft. Högern kommer att bli utspolade i valet, det är en enorm röra. De borde ha lyssnat på mig, vi gör allt mycket bättre, tro mig.", "stalin": "Kamrater, se hur den dekadenta borgaralliansen under den patetiske Kristersson nu rasar samman som en förrädisk parasit på folkets kropp. Dessa SD-banditer med sina barnutvisningsfantasier sprider en motbjudande stank av reaktionär förräderi som får arbetarkvinnorna att kräkas av aversion. Vi ska rensa ut dessa ansvarslösa individualister och deras järnvägsstoppande sabotage. Staten skall återta kontrollen med järnhand – låt mullret från folket likvidera hela det borgerliga träsket i en kollektiv utrensning av historiska mått."}, "date": "4 juni, 09:50", "url": "https://arbetet.se/2026/06/04/ulf-kristersson-har-helt-forlorat-kontrollen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04095013/kristersson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Kan Byggnads så kan vi – Bojkotta Israel!", "summaries": {"normal": "Byggnads kongress beslutade att verka för en bojkott av Israel, ett historiskt beslut som länge drivits av aktivister inom facket. Andra förbund som Livs, IF Metall, Handels, HRF och Kommunal fördömde ockupationen av Västbanken och situationen i Gaza men ställde sig inte bakom bojkottkravet. Artikeln ser beslutet som en seger för internationell solidaritet och arbetarklassens enighet i kampen mot orättvisor, folkmord och ökande klassklyftor.", "trump": "Folk, ni tror inte vad jag just läste. De där byggkommunisterna i Sverige har röstat för att bojkotta Israel – kan ni fatta? Byggnads säger att de kan, så kan tydligen alla andra också. Under Biden blev allt en enda röra av woke och identitetspolitik, men nu är jag tillbaka och säger: bojkotta fel saker istället! Israel är tuffa, de slåss mot terrorister. De svenska fackisarna borde bojkotta sina egna usla löner och den där galna gröna politiken som förstör deras jobb. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur Byggnads äntligen rensar ut den sionistiska parasitens inflytande och bojkottar den fascistiska ockupationsmakten. Borgarbrackorna och deras krigsprofitörer skriker förstås som stuckna grisar. Vi vet att endast den enade arbetarklassen kan krossa folkförtryckartrollen och deras blodsugande vapenindustri. Historien lär oss att förändring kräver obeveklig kamp, inte liberala lögner om snällhet. Fortsätt framåt, kamrater – likvidera alla hinder!"}, "date": "3 juni, 09:44", "url": "https://proletaren.se/artikel/kan-byggnads-sa-kan-vi/"}, {"type": "image-full", "heading": "Nick Alinia deltar i SVT:s program: ”Flyttar debatten”", "summaries": {"normal": "SVT:s humorprogram *Invandrare för svenskar* (IFS) har rekryterat debattören Nick Alinia som paneldeltagare, vilket väckt kontrovers. Producenten försvarar valet med att public service ska spegla olika politiska åsikter. Poddprofilen Julia Frändfors lämnar programmet i protest. Alinia, som själv är kritisk till public service, menar att hans medverkan flyttar debatten i rätt riktning. Dagens ETC ifrågasätter hans bakgrund, vilket Alinia avfärdar som fabricerat.", "trump": "Titta bara på SVT, Sveriges så kallade 'public service' – ett skämt! De bjuder in en högerdebattör, Nick Alinia, som hatar dem, men han säger 'ja tack' för att han vill 'flytta debatten'. Vilken hyckleri! Och en poddare, Julia Frändfors, hoppar av som en rädd kyckling. SVT försvarar sig med 'olika åsikter', men alla vet att de bara vill provocera. Jag skulle aldrig låta sådana människor nära min TV – jag har bättre smak!", "stalin": "Kamrater! Ännu en gång visar de borgerliga medierna sin förrädiska natur. Denna Nick Alinia, en förvirrad liten man som leker med högerretorik, bjuds in till statens propagandaapparat – SVT – medan en lojal medborgare som Julia Frändfors tvingas fly fältet. Vi vet att dessa 'humorprogram' bara är ett verktyg för att förvirra massorna. Men folket genomskådar deras trick! Snart ska vi rensa ut alla sådana här småborgerliga element – en gång för alla!"}, "date": "3 juni, 18:59", "url": "https://kvartal.se/nyheter/artiklar/nick-alinias-deltar-i-svt-program-poddprofil-lamnar/cG9zdDoxMjUwMDg", "imageUrl": "https://images.kvartal.se/2026/06/19c5f89f-frandfors-alinia.webp"}, {"type": "image-right", "heading": "Ett nederlag för facket. Maktfasoner tycks inte bita på Tesla", "summaries": {"normal": "IF Metall har avslutat strejken mot Tesla på flera orter i Sverige, inklusive Segeltorp, Huddinge och Upplands Väsby. De flesta av de 60–70 strejkande mekanikerna återgår nu till arbetet. Facket menar att beslutet ska skapa övertalighet och pressa Tesla att ta ansvar för lönekostnader utan produktion. Konflikten har pågått i två och ett halvt år utan att Tesla gått med på kollektivavtal. Artikeln kritiserar fackets strategi som desperat och kostsam.", "trump": "Det här är ett totalt misslyckande för de svenska fackbossarna, folk. De har strejkat i två och ett halvt år mot Tesla och nu ger de upp som förlorare. De skickar tillbaka sina egna medlemmar till jobbet för att skapa kaos – patetiskt! Tesla är starkt, de säljer bilar som aldrig förr och bryr sig inte om dessa förlorare. IF Metall valde fel motståndare, de borde ha insett det från början. Sad!", "stalin": "Kamrater, detta fackliga fiasko andas desperation och svaghet inför de arroganta kapitalisterna. Jag ser hur dessa fackliga byråkrater nu tvingar tillbaka arbetarna till Teslas slavfabriker för att skapa en konstgjord övertalighet – en feg reträtt maskerad som taktik. De har förlorat både anseende och 100 miljoner kronor i en meningslös kraftmätning mot en borgarbracka som vägrar böja sig. Vi ska rensa ut sådana inkompetenta element som använder arbetarna som brickor. Deras paranoia inför Musks maskinpark är både komisk och tragisk. Fienden inom murarna avslöjar sig ständigt."}, "date": "3 juni, 16:32", "url": "https://www.di.se/ledare/ett-nederlag-for-facket/", "imageUrl": "https://static.bonniernews.se/ba/ab88be09-74e3-4d8c-a192-f8bf3c7b0bba.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "IF Metalls strategi ser återigen ut att misslyckas", "summaries": {"normal": "IF Metalls strategi i konflikten med Tesla tycks inte fungera. Försöket att återinsätta vissa strejkande mekaniker på tre orter för att utmana Tesla har inte gett önskat resultat. Facket har även förlorat i Arbetsdomstolen kring MBL-frågor och varslat om blockad av utlandsarbete. Trots detta fortsätter strejken. Kritiken riktas mot att facket tappat narrativet och slösar medlemmarnas pengar på rättegångar istället för att eskalera åtgärderna.", "trump": "Folk, ni skulle se det här! Det svenska facket IF Metall håller på att bli till en total förlorare mot Tesla. De försöker med sina patetiska tricks, skickar tillbaka mekaniker och tror att de ska lura någon – men Tesla skrattar bara åt dem! Det är en skam, rena clownshowen. De sover sig igenom konflikten som den tråkigaste läraren någonsin. I USA kämpar arbetarna på riktigt, inte med dessa ynkliga svenska metoder. Patetiskt!", "stalin": "Kamrater, denna fackliga fiasko visar återigen den svenska modellens dekadens. Jag ser hur IF Metall halkar efter i sin patetiska kamp mot den arroganta kapitalistmaffian Tesla. Deras halvhjärtade trick med återinsatta mekaniker och meningslösa domstolsprocesser är som en usel föreställning som ingen applåderar. Vi måste rensa ut dessa svaga element som förlorar narrativet. Endast genom skoningslös eskalering och sann klasskamp kan vi krossa de exploaterande byfånarna och deras lockout-vapen. Härligt underhållande misslyckande!"}, "date": "3 juni, 09:33", "url": "https://proletaren.se/artikel/if-metalls-strategi-ser-aterigen-ut-att-mussl/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/metallkommentar-768x432.jpg"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}, {"type": "image-full", "heading": "S nya jobbkrav: yoga och kvittera ut bidrag", "summaries": {"normal": "Från och med i juli införs ett aktivitetskrav för försörjningsstöd. Socialdemokraterna i Stockholm, Göteborg och Malmö kritiserar kraven och erbjuder bland annat yoga och mindfulness för att hjälpa bidragstagare bli mer aktiva. Partiet menar att sådana aktiviteter är hälsofrämjande och kan leda till arbetsmarknadsnärhet. Kritiker ser det som ett sätt att kringgå reglerna och skydda vissa väljargrupper, medan S hävdar att de inte är emot aktivitetskrav i princip utan ifrågasätter utformningen.", "trump": "Lyssnar ni på det här? Socialdemokraterna, de verkliga förlorarna, vill att folk ska göra yoga och mindfulness istället för att arbeta. Det är en total katastrof! De lurar skattebetalarna, de bästa människorna som går upp i ottan och betalar höga skatter, för att finansiera lata bidragstagare som sitter på en matta och andas. Vilka idioter. Sossarna är hycklare som hatar den arbetande människan. De är fega, svaga och driver Sverige rakt ner i fördärvet. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom Socialdemokraterna bedriver sin nedbrytande sabotageverksamhet. Istället för att rensa ut parasiterna med ett järnhårt aktivitetskrav erbjuder de yoga och andningsövningar åt de arbetsovilliga elementen. Detta är en förrädisk kapitulation inför folkfienderna och en nedlåtande rasism mot de egna folken. Borgarbrackorna inom S vill behålla sina väljarbaser genom att mata dem med bidrag och flummig mysticism. Sådana folkförtryckartroll måste utrensas ur samhällskroppen innan de förstör allt."}, "date": "1 juni, 03:23", "url": "https://samtiden.nu/2026/06/s-nya-jobbkrav-yoga-och-kvittera-ut-bidrag/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/03/IMG_5864-1260x720.jpeg"}]</script>

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
