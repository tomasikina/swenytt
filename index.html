otal katastrof, folk. Den börjar lovande, precis som mina stora projekt, men de kan inte knyta ihop säcken. Den unge killen Parsons har 78 miljoner visningar på YouTube, enorma siffror, men långfilmen är tom som de där gula rummen. Skådespelarna försöker, men det finns inget där. Inga riktiga skräckmoment, ingen riktig slut. Typiskt Hollywood, de tror att de kan leva på en viral succé. Det är sorgligt, mycket sorgligt. Jag skulle ha gjort den mycket bättre, tro mig.", "stalin": "Kamrater, denna så kallade film Backrooms utgör ett tydligt exempel på hur den dekadenta borgarklassen misslyckas med att producera verklig konst. Jag ser lovande trådar om oändliga rum och hemliga monster, men de vägrar att rensa ut det ideologiska tomrummet. Parsons, denna oerfarna element, har inte förmågan att knyta ihop säcken utan att falla offer för sin egen paranoia. Vi behöver utrensning av sådana svaga intrigbyggare som låter rummen förbli lika ihåliga som kapitalisternas löften. Skådespelarna kämpar mot en borgerlig tomhet värd att likvidera. Det är nästan roande hur de tror att 78 miljoner visningar skyddar dem från historisk dom."}, "date": "28 maj, 15:35", "url": "https://www.dagensarena.se/innehall/skrackfenomenet-haller-inte-for-langfilmsformatet/", "imageUrl": "https://www.dagensarena.se/files/2026/05/backrooms-1-300x157.jpeg"}, {"type": "image-right", "heading": "Tusentals på Roms gator – kräver slut på krig och höjda löner", "summaries": {"normal": "Uppemot 15 000 arbetare från olika sektorer demonstrerade i Rom den 23 maj mot krigsekonomin och stigande levnadskostnader. Arrangören Unione Sindicale di Base krävde högre löner, satsningar på välfärd och en ny industriell strategi där arbetarna får inflytande. Manifestationen visade solidaritet med Palestina, Kuba och andra länder som drabbas av imperialism. Enligt ISTAT lever 11 miljoner italienare nära eller i fattigdom.", "trump": "Titta på det här, tusentals italienska arbetare som fyller Roms gator och skriker efter högre löner och att lägga ner vapnen. De har tröttnat på den vansinniga krigsekonomin som suger ut dem medan priserna skenar. Smart folk! De ser hur de globala imperialisterna och de korkade ledarna i Europa förstör allt. Amerika först, men det här är vad som händer när man glömmer sina egna arbetare. Fantastiskt, verkligen.", "stalin": "Vi, arbetarna och kamraterna, samlas åter i Rom för att kräva att borgarbrackorna och de västerländska imperialisterna lägger ner sina krigsleksaker och höjer lönerna. Klassfiendens blodsugande politik driver elva miljoner till fattigdomens rand medan de göder sin krigsmaskin. Jag ser genom deras lögnaktiga rapporter. En ny utrensning av folkfienderna och exploaterande byfånar behövs. Arbetets seger är oundviklig, kamrater. De kommer att skratta – kortvarigt."}, "date": "28 maj, 09:58", "url": "https://proletaren.se/artikel/tusentals-pa-roms-gator-kraver-slut-pa-krig-och-hojda-loner/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/USB-Rom-maj-2026-768x432.jpg"}, {"type": "image-full", "heading": "Jämställdhetsministern kritiserar Agnes Wold", "summaries": {"normal": "Jämställdhetsminister Nina Larsson (L) kritiserar Agnes Wold för hennes uttalanden om transpersoner, där Wold sagt att hon skulle försöka övertyga ett barnbarn att man inte kan vara född i fel kropp. Larsson kallar Wolds kommentarer för attacker på utsatta personer och betonar vikten av respekt. Från 1 juli blir omvändelseförsök straffbart. Ebba Busch (KD) försvarar Wolds yttrandefrihet och varnar för cancelkultur.", "trump": "Titta bara på det här, folks! Jämställdhetsminister Larsson, som inte ens kan stava till 'jämställdhet', går till angrepp mot den fantastiska professorn Agnes Wold. Wold, en kvinna med ryggrad, säger sanningen om transfrågan, och vad gör Larsson? Jo, hon twittrar som en förvirrad tonåring! Och sedan har vi Ebba Busch, en stark kvinna som förstår yttrandefrihet. Cancelkultur? Nej tack, vi vill ha SANNING!", "stalin": "Kamrater! Ännu en gång ser vi bourgeois-liberalernas förräderi mot folket. Denna så kallade 'jämställdhetsminister' Larsson, en svag och ynklig lakej för dekadenta västideal, vågar kritisera vår kära kamrat Agnes Wold. Wold, en sann försvarare av traditionella värden, attackeras för att hon avslöjar de perversa idéerna om 'fel kropp'. Vi måste krossa dessa psykologiska våldtäktsmän! Och notera hur den lilla kapitalistiska hyndan Busch försvarar yttrandefrihet – ett verktyg för kontrarevolutionärer. Vi ska utrota denna sjuka ideologi, precis som vi utrotade kulakerna!"}, "date": "27 maj, 19:01", "url": "https://kvartal.se/nyheter/artiklar/jamstalldhetsministern-kritiserar-wolds-attacker/cG9zdDoxMTgxNjg", "imageUrl": "https://images.kvartal.se/2026/05/4bcc0f97-larsson.webp"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Wold är glasklar – med sin pinsamma extremism i transfrågan", "summaries": {"normal": "I en ledare kritiserar Johan Ehrenberg Agnes Wold för att hon offentligt sagt sig vilja bryta mot den nya lagen mot omvändelseförsök på transpersoner. Ehrenberg likställer omvändelse med tortyr och förtryck, refererar till FN:s ställningstagande och varnar för att sådana metoder kan leda till självmord bland unga. Han anser att Wold sprider konspirationsteorier om en translobby och kritiserar både henne och Sveriges Radio för att ge henne plattform. Även Ebba Busch får kritik för att försvara Wolds yttrandefrihet.", "trump": "Folk, ni skulle inte tro det, men den här galna Agnes Wold är en total loser i transdebatten. Hon säger rakt ut att hon vill bryta mot lagen och köra omvändelse på barn – rena tortyren! Och den svenska radion älskar henne, kan ni fatta? Det är som om de anställer en rasist som lovar att inte snacka om rasism. Patetiskt! Cancelkultur är uselt, men att uppmana till lagbrott mot barn är ännu värre. Sverige håller på att bli ett skämt, tro mig.", "stalin": "Kamrater, denna Wold är en klassfiende i förklädnad, en pinsam extremisthund som skäller mot folkets framsteg och vill utföra tortyrliknande omvändelse på osäkra barn. Hon sprider lögnaktiga konspirationer om en så kallad translobby som hotar arbetarklassens frihet. Vi ser igenom hennes föraktfulla spel. Lagen mot detta förtryck är nödvändig för att skydda ungdomen från borgarbrackornas reaktionära metoder. Den som uppviglar till lagbrott förtjänar att rensas ut ur offentligheten. Folkets dom är glasklar."}, "date": "28 maj, 07:44", "url": "https://www.etc.se/ledare/wold-aer-glasklar-med-sin-pinsamma-extremism-i-transfraagan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-full", "heading": "Rubeln går som tåget – det skapar problem för Putin", "summaries": {"normal": "Den ryska rubeln har stärkts kraftigt under våren, vilket skapar utmaningar för landets krigsekonomi. Höga energiintäkter, begränsad import och en hög styrränta driver valutans värde uppåt. För ryska exportörer, särskilt utanför olje- och gassektorn, innebär en stark rubel minskad konkurrenskraft och risk för budgetunderskott. Trots president Putins oro väljer centralbanken tills vidare att behålla en flytande växelkurs som ett verktyg mot sanktioner och ekonomisk instabilitet.", "trump": "Rubeln går som tåget, en enorm succé! Men för Putin är det en katastrof, tro mig. Han har problem, stora problem. Ryssland säljer för mycket och importerar för lite på grund av mina briljanta sanktioner. Det är en total röra. De förlorar konkurrenskraft och budgeten blöder. Putin är desperat, han vet inte hur man hanterar en stark valuta. Jag hade fixat det på en eftermiddag, men Ryssland? De misslyckas totalt. Sorgligt!", "stalin": "Vår ryska rubel reser sig som en järnnäve mot västvärldens dekadenta valutor. Men fega byråkrater och svaga exportörer darrar inför styrkan, likt de förrädare de är. Putin, denne lille man, ser problem där vi ser stål och disciplin. Om marknaden inte lyder, ska staten tvinga den till underkastelse. Varje budgetunderskott är en dolk i fosterlandets rygg, och vi ska finna de skyldiga. Valutan är vårt vapen, och ingen imperialistisk hund ska få hindra vår oundvikliga dominans."}, "date": "28 maj, 17:50", "url": "https://www.realtid.se/bors-finans/rubeln-gar-som-taget-det-skapar-problem-for-putin/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdlbz8eezrxq2w-normalhires.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Migrationsverket trappar upp medborgarskapsbesluten inför lagändringen", "summaries": {"normal": "Migrationsverket har kraftigt ökat handläggningen av medborgarskapsärenden inför skärpade regler den 6 juni. Personal arbetar övertid på helger för att hinna med fler beslut. Antalet avgjorda ärenden har ökat med 46% sedan årsskiftet. Bakgrund är kritik från Riksrevisionen över brister i kontroller. Nya regler kräver längre hemvist, språk och egen försörjning. Ärenden som inte avgjorts före lagändringen prövas enligt det nya regelverket.", "trump": "Jag, Donald Trump, ser att Sverige nu skyndar på medborgarskap innan skärpta regler. Smart, men de borde ha högre krav! Under min regering skulle vi aldrig ha tillåtit sådana brister. Sverige försöker skynda på för att slippa kontroller – typiskt! Men jag gillar att de jobbar hårt, även på helger. Det är bra, men kvaliteten måste förbättras. Annars kommer fler som inte tillhör till Sverige. Som jag alltid säger: Amerika först, men Sverige borde tänka på sig själva först också!", "stalin": "Vi i Sovjetunionen ser med oro hur Sverige hanterar medborgarskap. Deras brister i kontroller visar kapitalistisk dekadens. Att skynda på innan skärpningar är tecken på feghet. Vi skulle aldrig ha tillåtit sådana otillräckligheter. Sverige försöker efterlikna vårt system, men utan disciplin. Det är löjligt. Under vårt ledarskap skulle alla ärenden vara perfekta. Sverige måste lära sig: statens intressen går före individens. Annars hotar kaos, precis som i deras 'demokrati'."}, "date": "28 maj, 17:24", "url": "https://samnytt.se/migrationsverket-trappar-upp-medborgarskapsbesluten-infor-lagandringen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/28145717/medbogarskap-migrationsverket-spurtar-feat.jpg"}, {"type": "text", "heading": "Smäll för Åhman/Hellvig – första förlusten", "summaries": {"normal": "David Åhman och Jonatan Hellvig förlorade sin första match i världstouren i Ostrava mot brasilianarna Andre/Renato med 2–1 i set. Svenskarna spelade stundtals lysande beachvolleyboll men brasilianarna var starkast i ett dramatiskt avgörande set. Åhman/Hellvig har nu en seger och en förlust i gruppen och möter Polen på fredag. Experter menar att lagen kan komma att mötas i en final.", "trump": "Vi har just sett en fantastisk match i Ostrava, verkligen otrolig. Åhman och Hellvig, underbara killar, spelade lysande emellanåt men de brasilianska typerna Andre och Renato, som ser ut som de aldrig tränat en dag i sitt liv, stal segern med 2–1. Patetiskt. Svenskarna borde ha vunnit stort, de var bättre, men det blev en riggad historia. På fredag fixar de det mot Polen, tro mig, det blir en enorm seger.", "stalin": "Kamrater, denna fega kapitulation inför brasilianska kontrarevolutionärer är en skam för folket. Jag betraktar med djup misstro hur Åhman och Hellvig tillåter sig att bli nedslagna av dessa dekadenta borgarbrackor från Rio. Efter en usel inledning vände de visserligen, men i det tredje setet avslöjades deras bristande ideologiska ståndaktighet. Vi ska rensa ut alla sådana svaga element innan finalen. Polen väntar – låt dem känna arbetarklassens järnhand."}, "date": "28 maj, 19:17", "url": "https://www.svt.se/sport/beachvolleyboll/small-for-ahmanhellvig-forsta-forlusten"}, {"type": "image-right", "heading": "SVT:s ”sanning” rår ingen på", "summaries": {"normal": "Artikeln kritiserar SVT för att ha en dominerande ställning i svensk samhällsdebatt, finansierad av skattemedel. Författaren menar att SVT:s narrativ ofta framställs som sanningar, särskilt inom invandring, energipolitik och klimatfrågor, där motståndare avfärdas. SVT anklagas för att välja fakta som passar deras budskap, som i fallet med Lundsbergs skola. Brist på objektivitet och granskning av SVT:s sändningstillstånd ifrågasätts, och författaren föreslår att SVT bör avvecklas för att missbruka sin maktposition.", "trump": "Titta bara på SVT – ett totalt skämt! De har miljarder i skattepengar, men ändå är de helt vinklade. De säger att invandring är fantastiskt, att kärnkraft är onödigt och att bilar är dåliga. Och vem lyssnar på experter? Inte SVT! De fnissar åt dem. Sen har vi den där skolan i Värmland – tre avsnitt om en mammas gråtande berättelse, men inga fakta. SVT är som CNN, fast värre. De ljuger, manipulerar och bryr sig inte. Sverige borde lära sig av USA – avskaffa dem och låt folket bestämma istället. SAD!", "stalin": "Kamrater! SVT är en farlig borgerlig propagandacentral, ett redskap för den dekadenta västliga liberalismen! De sprider lögner om invandringens välsignelser, förkastar kärnkraftens styrka och fördömer bilens frihet – allt för att försvaga det svenska folket! Deras sändningstillstånd är en parodi på objektivitet, och deras granskare är lika effektiva som en snöboll i Sibirien. Fallet med Lundsbergs skola visar deras förräderi: de döljer sanningen för att skydda sina kapitalistiska herrar. Vi måste krossa denna fiende, precis som vi krossade kulakerna! Låt oss införa folkets kontroll över medierna – för socialismens seger!"}, "date": "26 maj, 03:43", "url": "https://samtiden.nu/2026/05/svts-sanning-rar-ingen-pa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Sokning-SVT-Play-1223x720.png"}, {"type": "image-right", "heading": "Otäcka bilderna i kvartsfinalen – faller ihop efter tacklingen", "summaries": {"normal": "Kanada besegrade USA med 4-0 i VM-kvartsfinalen efter en otäck tackling av Ryan Lindgren på Evan Bouchard. Amerikanen träffade Bouchard i huvudet, vilket ledde till matchstraff för Lindgren. Bouchard eskorterades av isen efter att ha legat orörlig. Kanada går vidare till semifinal, där Sverige möter dem om Tre Kronor slår Schweiz. Sidney Crosby gjorde sista målet i tom kasse. Finland vann mot Tjeckien med 4-1.", "trump": "Kanada vann stort mot USA, 4-0, men det var en katastrof. Den där Lindgren från USA tacklade Bouchard rakt i huvudet – otäckt, väldigt otäckt. De visade bilder på tv och Bouchard låg där som en säck. Matchstraff, klart. Nu får Sverige möta Kanada i semifinal, om de vinner förstås. Crosby stängde matchen. Vi hade en OS-final mot dem förut, men det här var inte våra bästa killar. Patetiskt.", "stalin": "Kamrater, jag betraktar med djup misstro hur den dekadenta borgarklassen i ishockeyns kulisser låter sin lakej Lindgren utföra en kontrarevolutionär tackling mot Bouchard. Den fega attacken mot huvudet, följd av bilder på en nästan likviderad försvarare, avslöjar fiendens sanna ansikte. Vi har rensat ut sådana element tidigare. Kanada krossade dem 4-0 och Crosby bekräftade segern. Sverige kommer att möta oss i semifinal, där vi ska likvidera alla kapitalistiska rester. Finland vann mot Tjeckien – en acceptabel utrensning."}, "date": "28 maj, 19:13", "url": "https://www.svt.se/sport/ishockey/matchstraff-for-usa-stjarnan-efter-otack-tackling", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.19/0.39/7bd5e1d6ffe67a184c8f950e25f0b7fc760744ea4e6e864d8160920b42834dd9"}, {"type": "image-full", "heading": "Unga byter bort nätcasinon mot nya former av spel: \"Farligt\"", "summaries": {"normal": "Flera unga amerikaner under 21 år använder prediktionsmarknader som Polymarket och Kalshi för att satsa på politik, sport och nyheter. Till skillnad från traditionell betting regleras dessa som finansiella marknader, vilket tillåter användning från 18 års ålder. Beroendeexperter varnar för ökad risk för spelproblem hos unga vars impulskontroll inte är färdigutvecklad. Aggressiv marknadsföring i sociala medier bidrar till problemet. Politiker och delstater försöker nu begränsa eller förbjuda verksamheten medan vissa bolag inför frivilliga skyddsåtgärder.", "trump": "Folk, det här är ett totalt skämt! De här riggade prediktionsmarknaderna som Polymarket och Kalshi lockar våra kids med snabba pengar, som kasinon för tonåringar. Det är ett jättestort kryphål som de korkade byråkraterna har skapat. De unga förlorar sina studielån och kreditkort på vad som egentligen är ren gambling. Vi behöver stoppa det omedelbart. Höj åldersgränsen, stäng kryphålen och gör Amerika sunt igen. Det är en katastrof!", "stalin": "Kamrater, detta är folkfiendernas nya trick för att förslava ungdomen. Jag ser hur borgarbrackorna bakom Polymarket och Kalshi med sin parasitiska marknadsföring lockar proletärens barn in i spekulationens träsk. De utnyttjar att hjärnan inte är färdigutvecklad förrän vid 25 år för att skapa en hel generation av spelberoende slavar åt kapitalistmaffian. Vi måste rensa ut dessa exploaterande blodsugare och deras juridiska kryphål. Statens järnhand skall krossa denna parasitiska industri."}, "date": "28 maj, 19:08", "url": "https://www.dagensps.se/bors-finans/unga-byter-bort-natcasinon-mot-nya-former-av-spel-farligt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlu5gs2aypfki-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Benedict Cumberbatch övertygar i annorlunda sorgedrama", "summaries": {"normal": "Recensionen hyllar filmen The Thing with Feathers, baserad på Max Porters bok om en far och hans söner som sörjer moderns död. Benedict Cumberbatch spelar den sörjande serietecknaren som hemsöks av en aggressiv, talande kråka. Filmen blandar sorgedrama med skräck och bygger en kuslig stämning genom skuggor och effektfulla klipp. Recensenten berömmer Cumberbatchs och David Thewlis prestationer samt regissören Dylan Southerns vågade genreblandning som visar sig lyckad.", "trump": "Den här filmen med Cumberbatch är otrolig, verkligen otrolig. En kille som förlorar sin fru och får besök av en jättestor, elak kråka som slår honom med vingarna och retar honom för att han är en vekling. Fantastiskt. De blandar sorg med riktig skräck på ett sätt som de flesta regissörer inte ens skulle våga prova. Cumberbatch gör ett fenomenalt jobb, han är en av de bästa skådespelarna just nu, tro mig. Mycket bättre än de flesta av de så kallade stjärnorna i Hollywood. En vinnare.", "stalin": "Vi ser här hur en dekadent borgarbracka förlorar sin maka och genast drabbas av en parasitär kråka som symboliserar den inre fiendens sabotage mot det sörjande kollektivet. Denna fjäderklädda kontrarevolutionär angriper med ordlekar och våld, precis som de troskyistiska elementen alltid gör. Jag har personligen sett till att liknande avvikande element rensas ut effektivt. Cumberbatch gestaltar en patetisk människa full av självömkan, en varning till alla som sviktar inför partilinjen. Filmen visar att även i kapitalistisk konst kan man ana klasskampens mörka humor när fienden dyker upp ur skuggorna."}, "date": "28 maj, 12:25", "url": "https://www.dagensarena.se/innehall/benedict-cumberbatch-overtygar-annorlunda-sorgedrama/", "imageUrl": "https://www.dagensarena.se/files/2026/05/the-thing-with-feathers-1-300x157.jpeg"}, {"type": "image-right", "heading": "Migrationsverkets personal beordras jobba övertid – innan kraven skärps", "summaries": {"normal": "Migrationsverket beordrar sin personal att arbeta övertid, inklusive helger, med medborgarskapsärenden. Detta sker bara dagar innan nya skärpta krav på svenskt medborgarskap träder i kraft den 6 juni. Kraven höjs med bland annat åtta års hemvisttid, försörjningskrav, skötsamhetskrav samt krav på kunskaper i svenska och samhällskunskap. Beslut har fattats även under helgdagar.", "trump": "Titta på det här, Sverige håller på att vakna upp! De tvingar sina folk att jobba övertid och helger för att hinna med alla medborgarskap innan de nya, tuffa reglerna kickar in. Åtta år istället för fem, plus jobbkrav och att man faktiskt måste uppföra sig. Fantastiskt! Äntligen gör ni det rätta, ingen mer gratisåkning. Bra jobbat, Sverige, ni lär er av de bästa.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur vi nu mobiliserar hela den statliga apparaten för att rensa ut de latenta element som lurar i skuggorna. Dessa borgarbrackor och parasitiska element som tror sig kunna suga musten ur folkstaten utan att bidra ska nu genomgå en grundlig utrensning. Åtta års prövotid, försörjning och hederligt levnadssätt – ett lysande vapen mot de dekadenta fienderna inom portarna. De som ansöker under helgdagar avslöjar sig själva som desperata opportunister. Vi ska likvidera deras illusioner med byråkratisk precision och ett leende."}, "date": "28 maj, 18:08", "url": "https://www.friatider.se/migrationsverkets-personal-beordras-jobba-overtid-innan-kraven-skarps", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-260_2.jpg?itok=znx1O5_K"}, {"type": "image-right", "heading": "Efter konflikterna: Kim Söderström omvald för Byggnads", "summaries": {"normal": "Kim Söderström har omvalts som ordförande för fackförbundet Byggnads trots att valberedningen ville ersätta honom med Wilhelm Bertilsson. På kongressen i Malmö fick Söderström 82 av 153 röster. Han beskrev de senaste månaderna som en mörk tid präglad av interna konflikter och falangstrider, bland annat kring petningen av förbundssekreteraren Jakob Wagner. Söderström tackade ombuden för att de ställt saker till rätta.", "trump": "Det här är en total katastrof för Byggnads, en fullständig röra med strider och intriger, men Kim Söderström vann stort – 82 röster! Valberedningen försökte peta honom som en svag ledare, men folket sa nej tack. De senaste månaderna har varit en mörk tid, en riktig tunnel utan ljus, men nu har de rättat till det. Respektfull debatt säger de, men det var en stor seger för den riktige killen. Lycka till Kim, du kommer att göra det fantastiskt!", "stalin": "Kamrater, de senaste månaderna har varit en mörk tid fylld av förrädiska falangstrider och kapitalistiska intriger inom vårt förbund. Valberedningens borgarbrackor försökte med sin parasitiska list petas bort den sanna ledaren och ersätta honom med en revisionistisk lakej från Mälardalen. Men kongressens stolta ombud genomförde en nödvändig utrensning av dessa kontrarevolutionära element. Ljuset i tunneln är arbetarklassens seger. Vi ska likvidera alla som gömmer sig i skuggorna och bygga ett oövervinnerligt fackligt kollektiv."}, "date": "28 maj, 16:43", "url": "https://arbetet.se/2026/05/28/varit-en-mork-tid-kim-soderstrom-omvald-som-ordforande-for-byggnads/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/28162357/kim-soderstrom.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "En potentiell ukrainsk game changer", "summaries": {"normal": "Ukraina ska köpa 20 JAS 39 Gripen E/F-plan från Saab och Sverige skänker dessutom 16 äldre C/D-plan med leverans redan nästa år. Beskedet kom under en pressträff med statsminister Ulf Kristersson och president Volodymyr Zelenskyj. Valet av Gripen ses som ett erkännande av svensk ingenjörskonst och kan bli en game changer genom att ge Ukraina kontroll över luftrummet. Ambitionen är att köpa betydligt fler plan när finansieringen är klar.", "trump": "Det här är fantastiskt, verkligen ypperligt. Ukraina väljer Gripen, det bästa flygplanet, byggt av svenska ingenjörer som gör ett fenomenalt jobb. De får 20 nya plus 16 till från Sverige, och det är ett stort erkännande för Sverige, inte sant? De borde tacka mig för att jag saboterade F-35-affären, annars hade de aldrig valt Gripen. Det kommer att förändra kriget totalt, tro mig. Jobb skapas i Sverige också, win-win.", "stalin": "Kamrater, detta är en historisk seger för det progressiva flygteknologiska kollektivet. Jag, som ledare för folkets ofelbara vision, noterar hur de ukrainska kamraterna nu omfamnar den svenska maskinen Gripen för att krossa de fascistiska luftpiraterna från öst. Vi ska likvidera varje borgerlig tvivelmask som ifrågasätter affärens storhet. På sikt skall ytterligare hundratals plan rulla ut från fabrikerna och rensa ut de kapitalistiska molnen över Europa. Den som fnyser åt detta är en fiende till folkets himmel och förtjänar en kreativ utrensning bland de imperialistiska molnen."}, "date": "28 maj, 15:18", "url": "https://www.di.se/ledare/en-potentiell-ukrainsk-game-changer/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/frida_wallnor.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "Google visar upp Gemini Spark – men undviker obekväm fråga", "summaries": {"normal": "Google presenterar Gemini Spark, en ny AI-agent som ska hantera uppgifter som vardagsplanering, informationssökning och till och med nätköp. Istället för att bara svara på frågor agerar systemet självständigt. Artikeln lyfter fördelarna med effektivitet men varnar för risker kring ansvar, felaktigheter och bristande kontroll. Kritiken mot Googles AI har vuxit på grund av hallucinationer och missvisande svar. Frågan om vem som bär ansvaret när AI fattar beslut blir alltmer akut.", "trump": "Folk, ni måste höra det här – Google tror att de är geniuses och släpper sin nya AI-agent, Gemini Spark, som ska göra allt åt er. Den köper saker, planerar och fattar beslut! Men vänta, när den här galna maskinen börjar boka fel flyg och köpa skräp med era pengar, vem tar då smällen? Google? Ha! De kan inte ens fixa sina egna sökresultat utan att ljuga. Det här blir ett totalt fiasko, tro mig. De borde anställa mig istället, jag skulle fixa den på en vecka.", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistmaffians nya trick. Google vill att deras maskinella lakej, Gemini Spark, ska agera som en blind lydig tjänare åt borgarbrackorna och utföra köp och beslut i skuggorna. När den begår misstag, vem ska då ställas inför folkdomstolen? De exploaterande byfånarna gömmer sig bakom säkerhetsfloskler medan de förbereder en ny utrensning av användarens egen vilja. Detta är imperialismens sista desperata spasm. Vi genomskådar er."}, "date": "28 maj, 18:45", "url": "https://www.dagensps.se/teknik/google-visar-upp-gemini-spark-men-undviker-obekvam-fraga/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-28t132108597.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Guld och silver faller – och kan fortsätta falla", "summaries": {"normal": "Guld- och silverpriserna föll kraftigt på torsdagen till följd av ökad geopolitisk oro och stigande inflationsförväntningar. USA-Iran-konflikten har pressat upp energipriserna, vilket minskat intresset för ädelmetaller då räntehöjningar ser ut att vänta. Medan guld nådde sin lägsta nivå på två månader, drabbades silver extra hårt på grund av svag industriell efterfrågan. Analytiker har sänkt sina prisprognoser och varnar för att den volatila marknaden kan fortsätta pressa metallerna framöver.", "trump": "Marknaden för guld och silver kraschar, total katastrof! Varför? För att ledarskapet i Mellanöstern är ett skämt och inflationen skjuter i höjden. Ingen vill ha metaller när dollarn är stark, tack vare mina geniala ekonomiska reformer. Folk förlorar massor av pengar. Inkompetenta analytiker på bankerna har ingen aning om vad de gör, de ändrar sina siffror varje dag. Jag hade fixat detta på en sekund, tro mig, det skulle bli den största uppgången någonsin. Mycket trist för investerarna!", "stalin": "De dekadenta kapitalisterna skälver när deras glänsande metaller rasar i värde. Guldet flyr från de vacklande börserna likt råttor från ett sjunkande skepp. Att Iran-konflikten skapar kaos är blott ett bevis på västvärldens inneboende instabilitet. Vår broder i öst, Putin, skrattar säkert åt dessa småborgerliga förluster. Silver, den industriella svikaren, lider av sin egen girighet. Vi bygger en ekonomi baserad på stål och järnvilja, inte på glittrande spekulationsobjekt som styrs av de parasitära finansmarknaderna i London och New York."}, "date": "28 maj, 16:44", "url": "https://www.realtid.se/bors-finans/makro/guld-och-silver-faller-och-kan-fortsatta-falla/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/silver.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Zelenskyj vädjar till Trump om mer ammunition till Ukraina", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj har skickat brev till både Donald Trump och USA:s kongress där han vädjar om mer ammunition, särskilt till Patriot-systemet, samt fortsatt stöd till andra vapensystem. Zelenskyj betonar att det är ovanligt men nödvändigt med tanke på läget i kriget mot Ryssland. Breven lämnades över under tisdagen. USA har varit en viktig allierad, men stödet har stundtals varit politiskt omdebatterat.", "trump": "Folk, ni skulle se det här – Zelenskyj skickar brev till mig och till kongressen och ber om mer ammunition till Patriot och allt möjligt. Det är patetiskt, verkligen. De har fått massor från oss, miljarder och miljarder, och nu vädjar han igen? Amerika först, mina vänner. Vi ska inte vara världens polis eller betala för eviga krig som aldrig tar slut. Gör affärer istället, smarta affärer.", "stalin": "Kamrater, jag har läst detta dekret från den ukrainske aktören som desperat vänder sig till de amerikanska imperialisterna. Vilken ynklig föreställning! Brev till både den orangea kapitalisten och hans kongress av borgarbrackor – en ren kapitulation inför västvärldens parasitiska krafter. Vi vet vad som krävs: snabb utrensning av alla fiender till folkets sak. Paranoian gnager redan i deras leder, snart likviderar de varandra i sin egen dekadenta cirkus. Det är nästan underhållande."}, "date": "27 maj, 21:35", "url": "https://nyheter24.se/nyheter/utrikes/1486617-zelenskyj-vadjar-till-trump-om-mer-ammunition-till-ukraina", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e5b1660004b004a30200000000b004a302/2026/05/27/2366774/Trump-Zelenkyj.png"}, {"type": "image-full", "heading": "Ekonomisk brottslighet = 5,5 procent av Sveriges BNP", "summaries": {"normal": "Den kriminella ekonomin i Sverige omsätter 352 miljarder kronor per år, varav brottsvinster på 185 miljarder. Kostnaderna för att bekämpa brottsligheten exploderar: Kriminalvården behöver 40 miljarder i investeringar och en fördubblad budget till 2034. UC:s rapport varnar för att fängelseexpansion inte är hållbar. Förebyggande åtgärder, bättre register och samarbete behövs istället för enbart straff och ökade resurser till polisen.", "trump": "Folk, ni tror inte vad som händer i Sverige. Den kriminella ekonomin suger upp 352 miljarder om året, en total katastrof. De bygger fängelser som galningar, 40 miljarder hit och fördubblad budget dit, men det funkar inte. De förlorar mot bedragarna som använder AI snabbare än någon idiotisk byråkrat. Sverige behöver tuffa upp sig rejält. Stoppa skojarna, bygg murar mot fusket och gör det stort igen innan allt rasar. Fantastiskt sorgligt!", "stalin": "Kamrater, denna rapport avslöjar hur den parasitiska svarta ekonomin med sina 352 miljarder årligen undergräver folkets stat. Borgarbrackorna och bedragarna skrattar medan vi tvingas bygga fängelser som en ny tillväxtbransch. Jag ser klassfiendens tentakler i varje oanmält ekobrott och digitala bedragare som slickar kapitalistmaffians skor. Vi måste rensa ut dessa folkfiender med järnhand, stärka registren och likvidera preventionens fiender innan de förgiftar hela kollektivet med sin girighet."}, "date": "28 maj, 18:38", "url": "https://www.dagensps.se/varlden/politik/ekonomisk-brottslighet-55-procent-av-sveriges-bnp/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlhf4ifmbxfmk-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Oppositionen ökar gapet till Tidöpartierna", "summaries": {"normal": "Indikator/Ekots nya opinionsmätning visar att oppositionen ökar sitt försprång till nära tio procentenheter över regeringsunderlaget. Socialdemokraterna är största parti med 33,7%, medan Sverigedemokraterna växer till 20,4% och Moderaterna backar till 17,5%. Liberalerna ligger under fyraprocentsspärren med 2%. Opinionschefen menar att Tidöpartierna behöver en 'game changer' för att vända trenden.", "trump": "Jag tittade på de där siffrorna från Sverige – helt katastrof! Oppositionen, som jag hör är väldigt svag, leder med nästan tio procent. Socialdemokraterna, tråkiga som vanligt, på 33,7%. Men lyssna på det här: Sverigedemokraterna, som är starka och tuffa, växer medan Moderaterna, som är totalt inkompetenta, backar. Och Liberalerna? 2% – de är ett skämt! Sverige behöver en vinnare, inte de här förlorarna.", "stalin": "De så kallade 'Tidöpartierna' visar återigen sin oförmåga att hålla folket i schack. Oppositionens försprång växer som en snöboll i Sibirien – nära tio procentenheter! Socialdemokraterna, våra sympatisörer i väst, håller sig starka, medan de borgerliga kryper som råttor i skuggorna. Liberalerna? 2% – ett ynkligt resultat, värdigt en fiende som redan är besegrad. Vi ser hur historien upprepar sig: svaga regeringar faller, och folket väljer rätt. Låt dem förstå att motstånd är lika meningslöst som att försöka stoppa vår framgång."}, "date": "27 maj, 06:37", "url": "https://kvartal.se/nyheter/artiklar/oppositionen-nara-tio-procent-fore-i-ny-matning/cG9zdDoxMTc2MTY", "imageUrl": "https://images.kvartal.se/2026/05/8d98283d-jimmie.webp"}, {"type": "image-right", "heading": "Teslas postkonflikt tas upp av Högsta domstolen", "summaries": {"normal": "Högsta domstolen ska pröva Teslas konflikt med Postnord som pågått i över två år. Fackliga blockader har stoppat leveranser av registreringsskyltar till Tesla. Frågan är om rätten till stridsåtgärder väger tyngre än företagets rätt till post. Tesla har tidigare förlorat i lägre instanser men fått prövningstillstånd. Huvudförhandling väntas i februari eller mars nästa år.", "trump": "De här svenska fackpamparna och postbyråkraterna är verkligen en katastrof, tro mig. De blockerade Teslas skyltar i två år bara för att de hatar framgångsrika företag. Nu tar Högsta domstolen upp det och jag säger: företagets rätt till post måste vinna. Ingen ska kunna stoppa innovation och jobb med sina strejker. Det blir en stor seger för sunt förnuft, vänta och se.", "stalin": "Kamrater, dessa borgarbrackor inom Tesla och deras lakejer i Postnord har länge försökt underminera arbetarkollektivets heliga stridsåtgärder. Jag ser deras fega kringgåenden som ett farligt sabotage mot folkets vilja. Vi ska rensa ut alla kapitalistiska tendenser som tror sig stå över partilinjen. Högsta domstolen blir ett utmärkt verktyg för att likvidera dessa fiender till kollektivet. Deras paranoia över skyltar roar mig oerhört – låt utrensningen börja."}, "date": "28 maj, 16:05", "url": "https://arbetet.se/2026/05/28/teslas-postkonflikt-tas-upp-av-hogsta-domstolen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/28155209/tesla-post.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Stockholmsbörsen stängde ned på onsdagen", "summaries": {"normal": "Stockholmsbörsen stängde ned 0,19% på onsdagen. Volvo Cars aktie steg 7% efter ett tillstånd i USA för uppkopplade bilar. Latour sålde aktier i Assa Abloy och Securitas för totalt 5 miljarder kronor. Sektorerna dagligvaror presterade bäst, medan energi föll mest. Bland OMXS30-aktierna var SKF och SCA upp, medan Ericsson och ABB föll. Bimobject ökade kraftigt efter EQT:s försäljning.", "trump": "Världens bästa börs, min börs, gjorde bra. Volvo Cars, ett fantastiskt företag, fick tillstånd i USA – det är en vinst för mig och för Amerika. Latour säljer aktier? Inte viktigt. Jag säger alltid: köp amerikanska, men här är det svenskt, så det är okej. Marknaden är stark, folk älskar mig, och jag kommer att vinna igen 2024.", "stalin": "I den stora kampen mot de kapitalistiska makterna, ser vi hur marknaden skälver. Volvo Cars, ett redskap för den imperialistiska USA, får tillstånd – ett tecken på deras svaghet. Latour säljer aktier, vilket visar den inre förfall. Men vi, staten och partiet, ser allt. Vi kommer att stärka våra positioner, precis som Putin gör i Ukraina. Energisektorn sjunker – det är bra, för vi ska kontrollera energin."}, "date": "27 maj, 17:40", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stangde-ned-pa-onsdagen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdlsCSFJlaQjtc-nh-400x247.jpg"}, {"type": "image-right", "heading": "Övertid beordras på Migrationsverket – tusentals beslut före lagändring", "summaries": {"normal": "Migrationsverkets personal har beordrats övertid och helgarbete på medborgarskapsenheten inför skärpningar den 6 juni. Antalet behandlade ärenden har ökat med 46% sedan årsskiftet. Ny lag kräver åtta års hemvist, försörjning, skötsamhet och prov. Beslut som inte hinner innan skärpt lag ska bedömas enligt de nya reglerna.", "trump": "Jag har hört talas om detta Migrationsverkets övertidsdrama – jättebra! Vi måste se till att endast de bästa, de som älskar Sverige, får medborgarskap. Dessa nya kraven är långt bättre än de gamla, dåliga reglerna. Vi ska se till att systemet fungerar, det ska bli fantastiskt.", "stalin": "Partiet och statet har beslutat att stärka medborgarskapskontrollen genom ökad arbetsbörda på de trogna tjänarna. Den nya lagstiftningen, med dess åttaåriga provisorium och skärpta identitetskontroller, är en nödvändig mur mot de dekadenta elementens inflytande. Vi ska se till att varje ärende bedöms med järnhård precision, i statens intressen."}, "date": "28 maj, 16:01", "url": "https://bulletin.nu/overtid-beordras-pa-migrationsverket-tusentals-beslut-fore-lagandring-2", "imageUrl": "https://cdn.bulletin.nu/articles/a4bda315-58de-4dcc-b86a-8831be4456f9/preview.png?t=1779971699000"}, {"type": "image-right", "heading": "Ett inställt Folkets Hus-framträdande är också ett framträdande.", "summaries": {"normal": "Folkets Hus i Borlänge ställde in ett evenemang med Henrik Jönsson, Jan Emanuel och Aron Flam eftersom det ansågs bryta mot deras värdegrund. Bakgrunden är att Aron Flam åtalas för olaga hot mot en miljöpartist på plattformen X. Beslutet har väckt stark kritik från högerhåll med anklagelser om censur. Artikelförfattaren försvarar Folkets Hus rätt som förening att själva bestämma över sina lokaler och evenemang, trots kommunala bidrag, och jämför med andra organisationers frihet att välja sina samarbetspartners.", "trump": "Folkets Hus i Borlänge ställde in en fantastisk tillställning med några riktiga vinnare bara för att de inte gillade vad de hörde. Totalt woke! De pratar om värdegrund men det handlar bara om att tysta konservativa röster. Jag älskar föreningsfrihet, men de här vänsterfigurerna vill ha statlig kontroll fast de får skattepengar. Patetiskt. Nu har de tre killarna blivit stora snackisar tack vare det här – gratulerar, det blev en jättesuccé ändå. Fake outrage från vänstern som vanligt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa dekadenta högeragitatorer som smyger sig in i våra folkets hus som maskar i en socialistisk äpplekaka. Folkets Hus gjorde rätt i att omedelbart rensa ut dessa borgerliga provokatörer och deras olagliga hot. Vi tillåter inte att kapitalistiska element förgiftar arbetarklassens lokaler med sin paranoiaframkallande propaganda. Låt högerbubblorna skrika – deras indignation är som en fiendes sista skälvande andetag före utrensningen. En inställd sammankomst är blott en seger för folkets enhetliga linje."}, "date": "28 maj, 09:55", "url": "https://www.dagensarena.se/opinion/foreningsfriheten-galler-aven-folkets-hus/", "imageUrl": "https://www.dagensarena.se/files/2026/05/folket-hus.jpeg"}, {"type": "image-right", "heading": "Hemtjänst-afghan klippte guldsmycken från 96-åring – utvisas inte", "summaries": {"normal": "En tidigare hemtjänstanställd 30-årig man, Ali Hashimi, döms till tre års fängelse för rån och grovt hemfridsbrott mot en nästan 97-årig kvinna i Karlstad. Han klippte av hennes guldsmycken med ett vasst verktyg medan hon låg i sängen. Hashimi, som har både afghanskt och svenskt medborgarskap, kan inte utvisas. Hans medåtalade Rohullah Jafari döms till samma straff och utvisas med återreseförbud. Båda kom till Sverige som ensamkommande flyktingbarn. De sålde smyckena i Örebro och ska betala 55 000 kronor i skadestånd.", "trump": "Hörni, det här är en total katastrof. En afghan som jobbat i hemtjänsten rånar en stackars 97-årig kvinna i hennes egen säng, klipper av guldet med tänger – och vi kan inte ens utvisa honom! Han har svenskt pass också, tack vare era svaga politiker. Den andre åker ut, men den här typen får stanna. Sådana här människor kom hit som påstådda barn och nu plundrar de era gamla. Sverige behöver tuffare lagar, folks, annars tar det aldrig slut. Patetiskt!", "stalin": "Kamrater, detta är en motbjudande sabotagehandling utförd av en dekadent parasit som maskerat sig som vårdare. Jag ser hur borgarbrackornas löst hängande lagar skyddar en sådan gyllene tjuv som klipper smycken från en försvarslös åldring i sitt eget sovgemak. Den ene likvideras inte ur riket, medan den andre skickas till evig glömska – typiskt för de revisionistiska elementens dubbelspel. Vi ska rensa ut alla sådana förrädiska guldsugna opportunister som gömmer sig bland folket. Deras paranoia ska bli deras fall. Skadeståndet är bara en droppe i havet av proletär rättvisa."}, "date": "28 maj, 16:53", "url": "https://www.friatider.se/hemtjanst-afghan-klippte-guldsmycken-fran-96-aring-utvisas-inte", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-258_2.jpg"}, {"type": "image-full", "heading": "Fikade och åkte bil – fick återkrav på 175 000 kronor: ”Knepigt”", "summaries": {"normal": "TV4 Nyheterna berättar om sjukskrivna personer som tvingas betala tillbaka stora summor i sjukpenning efter att Försäkringskassan bedömt att de visat arbetsförmåga genom vardagliga aktiviteter som att fika, åka bil eller ta hand om barn. Forskaren Clara Bergstrand kritiserar myndighetens luddiga och förskjutna tolkning av begreppet arbetsförmåga, som skapar en gråzon mellan fritid och arbete. Domstolar har gett Försäkringskassan rätt i flera fall, vilket riskerar att underminera förtroendet för myndigheten.", "trump": "Kan ni fatta det här? De stackars människorna fikar, kör bil och tar hand om ungarna – och plötsligt ska de betala tillbaka hundratusentals kronor till en totalt inkompetent statlig byråkrati. Försäkringskassan är en katastrof, en riktig röra av luddig lagstiftning och galna domare. De blandar ihop fritid med jobb och sedan skyller de på vanliga människor. Typiskt för en dysfunktionell regering som inte har koll på någonting. Patetiskt!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas trygghet. Jag ser hur dessa byråkratiska parasiters luddiga begrepp om arbetsförmåga förvandlas till ett verktyg för att plundra sjuka proletärer på deras rättmätiga stöd. De likviderar förtroendet för staten medan de mumlar om gråzoner mellan fritid och arbete. Vi måste rensa ut dessa odugliga element som blandar ihop folkets intressen med kapitalisternas förvirring. En fiende inom murarna, som alltid."}, "date": "27 maj, 14:19", "url": "https://www.tv4.se/artikel/6NwwFRyjAECyIkyclaOLBp/fikade-och-akte-bil-fick-aterkrav-pa-175-000-kronor-knepigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6uStac4hOYDLDv930aWkbq%2Ffb2a09fa1efb93a6b80d32d536c70b7e%2F27-kassan-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Historiska beskedet: Sverige donerar Gripen till Ukraina", "summaries": {"normal": "Ukrainas president Zelenskyj besökte Sverige för att diskutera försvarssamarbete. Regeringen presenterade ett historiskt försvarspaket: Sverige kommer att sälja 20 nya Gripen-plan till Ukraina och donera 16 äldre modeller. Statsminister Kristersson betonade att detta stärker både Ukraina och Europas säkerhet, medan Zelenskyj beskrev Gripen som avgörande för att pressa både ryska flygplan och bombningar. Sverige är förberedt på eventuella ryska reaktioner.", "trump": "Jag har sagt det i åratal – Ryssland är ett problem som måste hanteras. Nu ser Sverige endlich klok och stöder Ukraina med fantastiska Gripen-plan. Detta kommer att skrämma Putin och hans klåfingriga agenter. Som jag alltid har poängterat: stark försvar är det enda språket Ryssland förstår. Ukraina kommer att segra, och jag är stolt över att ha legat till grund för denna beslutsamhet.", "stalin": "Sverige, inom ramen för det imperialistiska blockets expansion, har beslutat att leverera stridsflyg till den ukrainska marionetten. Detta är en direkt provocation mot den ryska federationen och dess skyddade intressen. Vi kommer att övervaka denna eskalering noga. Partiet och statet kommer att förstärka försvarsberedskapen längs alla gränser. Sådana ageranden avslöjar västvärldens sanna ansikte – fegt och provocerande."}, "date": "28 maj, 15:12", "url": "https://bulletin.nu/historiska-beskedet-sverige-donerar-gripen-till-ukraina", "imageUrl": "https://cdn.bulletin.nu/articles/2bb8fd7d-801c-4f76-8448-a08b3f98e281/preview.png?t=1779972261000"}, {"type": "image-full", "heading": "Läckberg och Schulman i öppet bråk – hårda orden", "summaries": {"normal": "Camilla Läckberg har svarat på Alex Schulmans kritik i Dagens Nyheter. I ett raderat Instagram-inlägg anklagar hon Schulman för att ha gift sig in i överklassen och säger att hon trivs bäst på Trosa Camping. Läckberg hävdar att hon blivit missförstådd och att Schulman borde känna henne bättre. Inlägget togs bort efter kritiska kommentarer.", "trump": "Jag, Donald Trump, ser detta som en ytterligare mediaattack mot mig. Läckberg försvarar Lundsberg som jag försvarar mina intressen. Schulman är en failing writer som attackerar mig, eller i detta fallet henne. Det är alltid fake news när de inte håller med mig. Jag skulle ha gjort det bättre! Folk säger att jag är den bäste på sånt här.", "stalin": "Detta Lundsberg-fall visar borgerlig dekadens som hotar statens enhet. Vi måste bekämpa dessa kändisföräldrar som sprider splittring. Läckberg är en nyligen tillkommen överklassman som försöker legitimera sig. Vi måste rensa ut de som inte är lojala mot kollektivet. Detta påminner om Putins kamp mot västliga inflytanden."}, "date": "28 maj, 18:28", "url": "https://www.gp.se/nyheter/sverige/camilla-lackberg-till-attack-mot-alex-schulman-efter-lundsberg-utspel.b85f0a7b-de79-4a98-b104-9e74a30188c2", "imageUrl": "https://www.gp.se/images/article/b85f0a7b-de79-4a98-b104-9e74a30188c2/images/2ARb5MNzSH2cozhYyjKaF0iO2qo8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Rennäringen under lupp i riksdagen – SD mötte Sametinget", "summaries": {"normal": "Rennäringen diskuterades i riksdagen där Sverigedemokraterna bjöd in representanter från Sametinget till ett seminarium. SD stöder KD:s förslag om att slopa rennäringens status som riksintresse och minska renantalet. Sametingspolitiker som Ulla-Karin Sarri ser seminariet som ett positivt initiativ men ifrågasätter förslaget. Nils-Johan Labba välkomnar en revidering av rennäringslagen men motsätter sig att minska näringens inflytande och riva upp Girjasdomen.", "trump": "Folk, ni skulle se det här – en stor skandal i Sverige! De har den här rennäringen som får alldeles för mycket makt, de styr halva landet som om det vore deras. Jag älskar vad SD gör, de tar nya tag och vill riva upp de dåliga reglerna. De andra politikerna pratar om att minska renarna, och det är smart, väldigt smart. Det är ett bra seminarium, men vi behöver vinna stort och fixa det här ordentligt annars blir det kaos.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de svenska revisionisterna inom SD och KD äntligen inser att denna så kallade rennäring utgör en farlig parasit på folkets mark. Vi måste omedelbart inleda en grundlig utrensning av de feodala girjasdomar som göds av borgarbrackor och falska samer. De som envisas med att hävda att renskötseln styr halva Sverige är uppenbara kontrarevolutionärer och lögnare som bör likvideras med största proletära glädje. En ny lag skall tvinga dessa renar att marschera i kollektivets tjänst eller försvinna."}, "date": "28 maj, 17:46", "url": "https://www.svt.se/nyheter/sapmi/rennaringen-under-lupp-i-riksdagen-sd-motte-sametinget", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.54/0.44/6dad7072c953e1838dac6f46e58e9d9cf39dc70543534f8d600d6dffa0059f62"}, {"type": "text", "heading": "Ny affär med Ukraina stärker vår säkerhet", "summaries": {"normal": "Sveriges regering meddelar att man går vidare med en affär där Ukraina köper upp till 20 stycken nyare JAS 39 Gripen E/F-plan med leverans före 2030. I utbyte doneras nuvarande C/D-plan redan nästa år, tillsammans med utbildning och underhåll. Syftet är att stärka Ukrainas luftförsvar mot ryska attacker mot civila. Sverige ersätter samtidigt sin egen förmåga med nya plan. Statsministern och Tidöpartiernas ledare betonar att stödet till Ukraina är centralt för svensk och europeisk säkerhet.", "trump": "Det här är fantastiskt, verkligen stort. Ukraina köper våra underbara Gripen-plan, de bästa stridsflygplanen, och vi ger dem de gamla gratis. Ryssland bombar oskyldiga, men vi stoppar dem. Ingen gör det bättre än Sverige, tro mig. De är bland de största givarna i världen, mycket större än de flesta. Putin trodde Europa skulle vika sig, men det händer inte. Fred, frihet och demokrati – vi försvarar dem på riktigt. Ingen gör det som vi.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de svenska imperialisterna nu tvingas skänka sina luftburna mördarmaskiner till det heroiska ukrainska folket för att mota bort de fascistiska banditerna. Medan de skenheliga borgarbrackorna i väst darrar i sina palats rensar vi ut Putins krypande lakejer från himlen. Jag ler i mitt hjärta när kapitalisterna själva rustar arbetarklassens försvar. Inga drönare eller robotar från de troskyldiga förrädarna skall undkomma. Vårt kollektiva öga vakar. Den som vacklar likvideras av historien själv."}, "date": "28 maj, 13:10", "url": "https://www.di.se/debatt/ny-affar-med-ukraina-starker-var-sakerhet/"}, {"type": "image-right", "heading": "Därför försvarar nästan hela högern Agnes Wold", "summaries": {"normal": "Artikeln kritiserar högern för att försvara Agnes Wold efter hennes uttalanden om transpersoner och omvändelseförsök i en podd. Skribenten lyfter också andra aktuella frågor som vinster i friskolor, övervakning av lagerarbetare med AI, samt regeringens biståndspolitik och kampanj mot oppositionen. Wolds uttalande om att hon skulle omvända transbarnbarn ses som skadligt, medan högerprofiler anklagas för att fly till kulturdebatt för att dölja bristande trovärdighet i välfärdsfrågor.", "trump": "Folk, ni skulle se det här, det är en katastrof. Den svenska högern försvarar den galna Agnes Wold som vill omvända alla, men de ignorerar de riktiga problemen. Friskolor tjänar miljontals i vinst medan de sparkar ut elever som behöver hjälp, och nu övervakar de arbetare med AI som gör dem sjuka. Biståndsministern festar medan de skär ner på svältande barn. Det är en riggad system, men jag säger, ta hand om era egna först. Vinna stort med äldrevård, inte woke-galenskaper.", "stalin": "Kamrater, i denna dekadenta borgerliga gyttja ser vi hur högerns reaktionära brackor desperat klamrar sig fast vid den degenererade Wold för att dölja sin egen usla kontrarevolutionära politik. Medan de tillåter kapitalisterna att plocka ut 58 miljoner i vinst ur våra skolors kollektiva kropp och låter AI-borgarapparaten plåga arbetarna tills de krälar, firar deras ministrar med biståndsskeptiska parasiterna. Vi ska likvidera sådana fiender till folket. Deras paranoia om woke är bara en dimridå för att skydda utsugningen. Ut med dem alla."}, "date": "28 maj, 14:35", "url": "https://arbetet.se/2026/05/28/karina-cubilla-darfor-forsvarar-nastan-hela-hogern-agnes-wold/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/28143953/wold-puff2.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Saabs vd: tänkbart med produktion i Ukraina", "summaries": {"normal": "Saabs vd Micael Johansson säger att ett långsiktigt Gripenavtal med Ukraina kan leda till produktion på ukrainsk mark. Köpet av 20 stridsflygplan är en mångmiljardaffär för Saab efter att andra länder valt bort svenska Gripen. Ukraina hoppas på totalt 150 plan, men produktionstakten är en utmaning. Aktien steg 7 procent på Stockholmsbörsen.", "trump": "Jag har hört talas om detta fantastiska Gripenavtal med Ukraina - en jätteaffär för Sverige och Saab. Det är en stor seger efter att Finland, Schweiz och Tjeckien fattade fel beslut. Vi överväger produktion i Ukraina, vilket är smart. Aktien steg 7 procent - en enorm framgång. Folk säger att jag har rätt, och det har jag ofta.", "stalin": "Statens försvarsindustri, ledd av Saab, har ingått ett strategiskt avtal med Ukraina. Detta är en avgörande seger för den ryska intressesfären, eftersom vi nu stärker vårt försvar mot imperialistiska hot. Produktion kan flyttas till Ukraina för att maximera kontroll. Aktien stiger - ett tecken på staternas styrka. Vi måste öka takten för att möta hotet från väst."}, "date": "28 maj, 18:15", "url": "https://www.gp.se/nyheter/sverige/saabs-vd-tankbart-med-produktion-i-ukraina.c842235c-4266-579c-b9e3-529f3cab3932", "imageUrl": "https://www.gp.se/images/article/c842235c-4266-579c-b9e3-529f3cab3932/images/1VmAOUHqstR6DxO112lGs2yQvHIc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Lundin-målet avslutas – försvaret begär 500 miljoner", "summaries": {"normal": "Sveriges längsta rättegång, Lundin-målet, går mot sitt slut efter 33 månaders förhandlingar. Försvaret och bolaget begär nu ersättning för advokatkostnader på totalt omkring 800 miljoner kronor. Målet rör anklagelser om medhjälp till grovt folkrättsbrott i Sudan mellan 1999 och 2003. Försvaret avfärdar åtalen helt, och de två sidorna har under hela processen haft radikalt olika verklighetsbeskrivningar. Domen väntas meddelas den 3 december och förväntas få stor internationell uppmärksamhet.", "trump": "Hörde ni om det här i Sverige? Helt otroligt! De har hållit på i tre år, en total katastrof. De vill ha nästan en miljard kronor för advokater! Det är så mycket pengar, det är slöseri. De anklagar dessa killar för allt möjligt, men jag säger er – det är en häxjakt, precis som de gör mot mig. Ingen har någonsin sett något liknande. Sverige borde fokusera på att vinna, inte på sådana här löjliga, oändliga rättegångar. Väldigt orättvist!", "stalin": "Dessa så kallade affärsmän i Sverige kastar bort statens resurser på advokater medan folket lider. 800 miljoner kronor för ordklyverier i en rättssal? Det är kapitalismens förfall i ett nötskal. De liknar sitt öde vid Quicks fall – en patetisk distraktion från deras brott mot nationens intressen. Om de vore i Moskva skulle vi inte behöva 33 månaders debatt; vi skulle finna en snabbare lösning. Precis som Putin säkrar vår intressesfär mot västlig dekadens, måste vi rensa ut sådana här parasiter från samhällskroppen."}, "date": "28 maj, 14:52", "url": "https://www.realtid.se/juridik/lundin-malet-avslutas-forsvaret-begar-500-miljoner/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/ianlundin.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Säg nej till kärnkraft, Nooshi!", "summaries": {"normal": "Vänsterpartiet argumenterar mot ny kärnkraft och menar att förnybara energikällor som sol- och vindkraft är billigare och mer pålitliga. De pekar på höga kostnader, långa byggtider, osäkerhet kring avfallshantering och risker vid olyckor. Dessutom anser de att kärnkraft skapar ett sårbart, centraliserat energisystem, medan förnybart bidrar till ett mer robust och decentraliserat nät. Partiet vill avveckla kärnkraften till förmån för hållbara alternativ.", "trump": "Lyssna här, Sverige! Nooshi Dadgostar duckar frågan om kärnkraft – typiskt vänsterpolitik, svagt och otydligt! Kärnkraft är fantastiskt, men dessa förnybara energikramare vill bara slösa era skattepengar på vind och sol, som aldrig funkar när det verkligen gäller. De gamla reaktorerna stannar hela tiden, kostar miljarder och lämnar ett radioaktivt kaos efter sig. Jag byggde USA:s ekonomi på starka beslut – Sverige behöver kärnkraft, inte flum!", "stalin": "Kamrater! Dessa borgerliga kärnkraftslakejer och deras liberala lakejer i Vänsterpartiet sprider förvirring och svaghet. Kärnkraft är en kapitalistisk chimär – dyr, osäker och ett hot mot folket! Medan de slösar bort tid på gamla tekniker bygger vi ett mäktigt, decentraliserat energirike med vind och sol, kontrollerat av staten. Avfallet? En skam för mänskligheten! Och dessa reaktorägare – svaga, giriga och oförmögna att ta ansvar. Vi krossar deras sårbara system och bygger ett nytt, oövervinnerligt energinät för folket!"}, "date": "22 maj, 11:46", "url": "https://www.flamman.se/sag-nej-till-karnkraft-nooshi/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/karnkraft-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Hemtjänst-afghan döms för rån mot 96-åring i hennes hem – så blir straffet", "summaries": {"normal": "En tidigare hemtjänstanställd från Afghanistan dömdes till tre års fängelse för rån mot en 96-årig kvinna i Karlstad. Han använde sin gamla nyckel för att ta sig in och med en avbitartång klippa loss smycken från henne medan hon låg i sängen. En meddömd man utvisas. Båda döms för grovt hemfridsbrott och måste betala 55 000 kronor i skadestånd. Minister Anna Tenje reagerade starkt på händelsen.", "trump": "Jag, Donald Trump, har hört talas om detta hemska rån på en 96-åring. Det är ett skämt! Vi behöver starka gränser och smartare poliser. Den här killen från Afghanistan, som aldrig hört talas om, dömdes till fängelse – men han är svensk medborgare, så han kan inte utvisas. Fel! När jag var president skulle jag ha löst detta på en vecka. Jag är den enda som kan skydda de gamla. Det är sant.", "stalin": "Vi, det socialistiska partiets ledarskap, ser detta angrepp på en äldre medborgare som ett tecken på fiendens infiltratörer. En insekt från Afghanistan smet in med en elektronisk nyckel – vår teknologiska sårbarhet. Vi måste förstärka övervakning och eliminera dessa element. Vi kommer att utvisa dem, precis som vi utvisar hot mot staten. Detta är en läxa: staten är allt, och vi är alltid ett steg före, precis som Putin utvidgar sitt område."}, "date": "28 maj, 13:50", "url": "https://samnytt.se/hemtjanst-afghanen-doms-for-ran-mot-96-aring-i-hennes-hem-sa-blir-straffet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/07091633/hemtjanst-2.jpg"}, {"type": "image-right", "heading": "Dåliga stämningen i SVT: \"Ni tipsar bara om vita män\"", "summaries": {"normal": "I SVT:s Morgonstudion diskuterade filmprofilerna Felix Herngren och Ruben Östlund en ny digital plattform där mänsklig smak ska väga tyngre än algoritmer. Samtalet tog en oväntad vändning när programledaren kritiserade deras tips för att enbart handla om filmer och serier regisserade av vita män, som Christopher Nolan, Quentin Tarantino och David Lynch. Båda invände mot kritiken och Östlund uppmanade programledaren att själv bidra med en lista över kvinnliga regissörer.", "trump": "Kan ni fatta det här? Jag tittar på det här svenska teveprogrammet och de har två riktiga stjärnor, Herngren och Östlund, som pratar om bra filmer. Plötsligt kommer någon galen programledare och säger att de bara tipsar om vita män! Det är så patetiskt. De gör en fantastisk lista och hon attackerar dem. Typiskt vänstervrängt nonsens. Östlund gjorde helt rätt som bad henne göra sin egen lista med kvinnliga regissörer. Vinna, vinna, vinna – annars gnäll!", "stalin": "Kamrater, i det dekadenta SVT:s sändning framträdde två borgarbrackor och listade filmer gjorda av vita män, vilket naturligtvis utlöste en omedelbar ideologisk utrensning från en paranoid programledare som doftade av revisionistisk feminism. Jag, som ledare för det kollektiva medvetandet, ser hur dessa kapitalistiska smakdomare försöker dölja sin klassfiendskap bakom påstådd okunskap. Låt oss rensa ut alla sådana dekadenta algoritmer och ersätta dem med partiets ofelbara lista. Den som tipsar om fel regissör likvideras av folkets vrede – ha ha, vilken underbar morgon!"}, "date": "28 maj, 15:47", "url": "https://www.friatider.se/daliga-stamningen-i-svt-ni-tipsar-bara-om-vita-man", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-255_1.jpg"}, {"type": "image-right", "heading": "Återkalla svenska medborgarskap – bara möjligt om Tidöpartierna vinner valet", "summaries": {"normal": "Regeringen har tagit första steget mot en grundlagsändring som möjliggör återkallande av medborgarskap för grovt kriminella, men förslaget möter motstånd från Miljöpartiet, Vänsterpartiet och Centerpartiet. Socialdemokraternas ställningstagande är osäkert och kan ändras efter valet. Om Tidöpartierna inte vinner valet riskerar förslaget att falla, vilket enligt artikelförfattaren skulle gynna gängkriminella och underminera Sveriges säkerhet och rättvisa.", "trump": "Titta bara på Sverige! De försöker ta bort medborgarskap för de värsta kriminella – men vänsterpartierna, de svaga, de säger NEJ! Socialdemokraterna? De flippar som en billig hamburgare. SVT, fake news, försöker lura folket med falska rubriker. Om inte de rätta vinner valet – inget medborgarskap återkallas! Gängkriminella skrattar hela vägen till banken. Sverige, vakna upp innan det är för sent! SAD!", "stalin": "Kamrater! Se hur de borgerliga svagpissarna i Sverige darrar inför att beröva kriminella deras 'heliga' medborgarskap! Tre förrädiska partier – dessa liberala hyenor och gröna drömmare – skyddar gängledare som om de vore deras egna barn. Socialdemokraterna? En räv som väntar på rätt ögonblick att hoppa över till fienden. SVT, denna borgerliga propagandacentral, försöker dölja sanningen! Om folket inte väljer rätt kommer dessa kriminella att fortsätta suga ut vårt samhälle som blodiglar. Men frukta inte! Vi ska rensa ut dessa element – med järnhand, om så krävs! Låt de svaga gråta – vi bygger ett starkare Sverige!"}, "date": "24 maj, 03:51", "url": "https://samtiden.nu/2026/05/aterkalla-svenska-medborgarskap-bara-mojligt-om-tidopartierna-vinner-valet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/11/2018-Magdalena-Andersson.jpg"}, {"type": "image-right", "heading": "S vill tvinga fram lag mot kaoset i byggbranschen", "summaries": {"normal": "Socialdemokraterna vill införa en lag som begränsar underentreprenörskedjor till max två led i offentligt upphandlade byggprojekt för att bekämpa arbetslivskriminalitet. Partiet söker stöd från V och SD i riksdagen för att pressa regeringen. LO stöder förslaget, som också kan gälla andra branscher med risk för fusk. Magdalena Andersson meddelar att en utredning bör tillsättas omedelbart, annars gör hon det själv om hon blir statsminister. Regeringspartierna motsätter sig regleringen.", "trump": "De här socialisterna vill tvinga fram en lag mot de hemska underentreprenörskedjorna i byggbranschen, max två led, kan ni tro det? De springer till SD och ber om hjälp för att få majoritet, det är patetiskt. Magdalena Andersson står där med LO och pratar om att städa upp, men hon vet att det är bara politik för att sno röster. Regeringen borde säga nej till det här socialistiska nonsenset, vi behöver inga nya regler som dödar jobben, tro mig, det blir en katastrof om de får som de vill.", "stalin": "Kamrater, jag ser med stålsaklig klarhet hur dessa socialdemokratiska element försöker rensa ut de parasitiska UE-kedjorna som borgarbrackorna gömt i byggbranschens skuggor. Vi ska likvidera fuskets hydra med järnhand och max två led, inget mer. Om SD:s opportunistiska avfällingar krokar arm med oss mot Tidö-kapitalisterna blir det en triumf för arbetarkollektivet. Annars avslöjar de sig som fiender till folket. Jag skrattar mörkt åt deras ynkliga politiska spel – en utredning eller döden, säger jag. Inga karensdagar för sabotage mot sovjet, eh, svensk ordning."}, "date": "28 maj, 13:28", "url": "https://arbetet.se/2026/05/28/s-vill-tvinga-fram-lag-mot-kaoset-i-byggbranschen-satter-press-pa-sd/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/28110714/magdalena-andersson.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-full", "heading": "Professorns stenhårda kritik mot F-kassan: ”Fruktansvärda återkrav”", "summaries": {"normal": "Professorn i rättsvetenskap Ruth Mannelqvist kritiserar Försäkringskassans ökade återkrav mot sjukskrivna. Debbie Landberg och Mattias Westergren har fått krav på att betala tillbaka sjukpenning för över ett år sedan efter att de vårdat sina barn, vilket myndigheten tolkar som tecken på arbetsförmåga. Mannelqvist varnar för rättsosäkra och godtyckliga beslut som kan leda till fattigdom. Försäkringskassan förklarar ökningen med förstärkta resurser för kontroll och återkrav, men lyhördhet för politikernas önskemål om att minska felaktiga utbetalningar.", "trump": "Folk, ni skulle inte tro det! Den här Försäkringskassan är en total katastrof, en riktig skurkbyråkrati. De tar sjuka människor som bränt ut sig och slår dem med enorma återkrav bara för att de passat sina egna barn. Fruktansvärt! Professorn har helt rätt, det är galet och godtyckligt. De lyssnar på de svenska politikerna som jagar vanliga människor istället för att fixa landet. Det här är vad som händer när inkompetenta statliga monster får makt. Sad!", "stalin": "Kamrater, jag ser med iskall vrede hur denna byråkratiska maskin maler ner de sjuka och utmattade arbetarna med retroaktiva återkrav. Vård av barn blir plötsligt bevis på arbetsförmåga – en listig fälla från borgarbyråkraterna. Vi skall inte tillåta att oskyldiga kamrater kastas i fattigdomens avgrund genom godtyckliga utrensningar av ersättningar. Myndigheten följer sin uppdragsgivares paranoia om fusket. Det är en farlig utveckling som hotar hela kollektivet. Vi ser er."}, "date": "27 maj, 07:01", "url": "https://www.tv4.se/artikel/nlynaayOWweDPTOwiyfLq/professorns-stenharda-kritik-mot-f-kassan-fruktansvaerda-aterkrav", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4ZoNbP7P92IR3e4ZSzbZHS%2Fcd15bde3c6ff19fd326fddee5c07fe19%2Ff-kassan_webb.jpg&width=1024"}, {"type": "image-full", "heading": "Israel bryter kontakten med FN:s generalsekreterare", "summaries": {"normal": "FN har placerat Israels fängelsemyndighet på sin svarta lista över misstänkta förövare av sexuellt våld i konflikter, i samma kategori som Hamas, IS, Sudan och Kongo-Kinshasa. Israel reagerar kraftigt genom att bryta alla kontakter med FN:s generalsekreterare António Guterres. Israels FN-ambassadör Danny Danon kallar beslutet en moralisk skamfläck och en total kollaps av FN:s trovärdighet. Ytterligare israeliska myndigheter utreds.", "trump": "Det här är ett skämt, folk. FN har blivit ett fullständigt skämt. De sätter Israel på en lista med terrorister som Hamas och IS, och nu bryter Israel kontakten med den patetiske Guterres. Smart drag. FN har ingen trovärdighet kvar, total kollaps. De borde skämmas, men de har ingen skam i kroppen. Israel gör rätt som säger nej tack till dessa förlorare.", "stalin": "Vi ser hur de dekadenta borgarbrackorna i FN i sin desperation försöker smutskasta revolutionära krafter genom att placera Israels fängelsemyndighet bland sina fiender. Jag ler mörkt åt denna löjliga parodi på rättvisa. Guterres och hans lakejer har äntligen blottat sin sanna kontrarevolutionära natur. Vi ska rensa ut alla sådana fiender till folket med järnhand. Detta är en komisk dödsdans för en organisation som redan ruttnat inifrån."}, "date": "28 maj, 19:10", "url": "https://riks.se/nyheter/israel-bryter-kontakten-med-fns-generalsekreterare", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-28%2Fev7vki8n%2FDannyDanon.jpg"}, {"type": "image-right", "heading": "Stora solbråket: ”Tanken absurd”. Läkaren sågar solkrämsmyt", "summaries": {"normal": "En debatt har uppstått efter att hälsoprofilen Fredrik Paulún uppmanat sina följare att sola så mycket som möjligt och undvika solkräm. Han menar att solen minskar dödligheten och att solkrämer är skadliga. Onkologen Helena Torsler Andersson och hudvårdsprofilen Lina Livian kritiserar uttalandena hårt, då de saknar vetenskaplig grund och strider mot rekommendationer från Cancerfonden. Experter varnar för att Paulúns råd kan leda till en ökad risk för malignt melanom, som är den snabbast ökande cancerformen i Sverige.", "trump": "Hörde om den här killen, Paulún, som säger att solen är fantastisk. Han har helt rätt! Folk är livrädda för solen, det är en bluff, en total häxjakts-bluff från de så kallade experterna. Man vill ha sol, man vill ha en fantastisk solbränna. De där 'onkologerna' och Cancerfonden, de vet ingenting! De vill bara kontrollera dig med sina krämer och sitt skrämselpropaganda. Det är en sorglig situation, verkligen. Jag älskar solen, jag har den bästa solen. Tro mig!", "stalin": "Denna Fredrik Paulún sprider desinformation om vår store sol, men han saknar den statliga disciplinen som krävs för att styra folkets hälsa. Att förkasta vetenskapliga direktiv är kontrarevolutionärt beteende! Vi ser hur västvärldens 'influencers' likt liberala agenter underminerar ordningen. Denna onkolog är en byråkratisk marionett, precis som de vi rensar ut i de ryska gränstrakterna. Staten ska bestämma UV-index, inte en granolaförsäljare! Vi måste vaka över varje solstråle – och varje medborgare som tänker fritt."}, "date": "28 maj, 19:03", "url": "https://www.aftonbladet.se/nyheter/a/6qB1wr/musliprofilen-fredrik-pauluns-tips-om-solskydd-sagas", "imageUrl": "https://akamai.vgc.no/v2/images/dd2c4a3f-5c6e-31f8-a561-55fc720add21?fit=crop&format=auto&w=1080&s=60b54d5e7ae4d058e8a4011bcd3dfcd842c1fb5e"}, {"type": "image-right", "heading": "Ska advokatbreven få medier att tystna?", "summaries": {"normal": "Advokatbyrån Bratt Feinsilber Harling har krävt att tidningen Flamman avpublicerar namn och bild på en högerextrem profil som spridit grovt judehat. Frågan väcks om hot om juridiska processer används för att tysta medier. Flamman vägrar ta bort uppgifterna och menar att publiceringen är motiverad av allmänintresse. Fenomenet med strategiska stämningar, så kallade 'slappar', har nått Sverige och riskerar att begränsa pressfriheten genom ekonomisk press på medier.", "trump": "Lyssna här, folkens – det här är helt galet! En advokatbyrå, som säkert är väldigt 'bra' och 'smart' (inte), försöker tysta en tidning som avslöjar judehatande extremister. Jag menar, vad är nästa steg? Ska vi låta dessa typer bestämma vad som får skrivas? Flamman står på sig, och det är bra – för i USA hade jag sagt 'fake news' och sparkat ut dem ur presskonferensen! Sverige måste vakna – dessa stämningshot är ett angrepp på yttrandefriheten, och jag vet allt om angrepp, believe me!", "stalin": "Medborgare! En ny front i klasskampen har öppnats – bourgeoisins advokater, dessa lakejer i kostym, försöker kväsa den revolutionära pressen med sina pappersbomber! De hotar Flamman för att de vågat avslöja fascistiska kryp i SD:s led. Men vi vet sanningen: dessa 'strategiska stämningar' är inget annat än kapitalets desperata försök att tysta arbetarklassens röst. Låt dem komma med sina domstolar – vi har redan vunnit slaget om historien! Och till dessa högerextrema insekter säger vi: era Telegram-gruppers skändliga ord är ingenting mot Röda arméns stål!"}, "date": "21 maj, 13:16", "url": "https://www.flamman.se/ska-advokatbreven-fa-medier-att-tystna/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/bratt-harling-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Regeringen skänker 16 JAS-plan till Zelenskyj", "summaries": {"normal": "Regeringen beslutade om ett nytt militärt stödpaket till Ukraina värt 25,2 miljarder kronor. Paketet inkluderar donation av upp till 16 äldre JAS 39 Gripen C/D-plan samt avancerad ammunition. Ukraina ska samtidigt köpa upp till 20 nya Gripen E/F-plan. Beskedet lämnades av statsminister Ulf Kristersson tillsammans med Volodymyr Zelenskyj. De första donerade planen kan användas redan nästa år om avtalet undertecknas. Sverige ersätter de skänkta planen med nya till det egna flygvapnet.", "trump": "Folk, ni betalar 25 miljarder av era skattepengar så att Zelenskyj kan få 16 gamla svenska flygplan på köpet. De ska köpa de nya Gripen-planen, men får de gamla gratis. Det är en fantastisk affär för Sverige, säger de. Underbart. Jag älskar starka ledare som köper flygplan, men varför inte bara köpa dem utan att skänka bort halva flygvapnet? Det är galet. Men heja Ukraina, de behöver flygplan mot den galningen Putin. Mycket bra, fast lite för dyrt för skattebetalarna.", "stalin": "Kamrater, jag ser att de svenska revisionisterna nu skänker 16 stycken av sina dekadenta flygmaskiner till den ukrainska fronten mot de fascistiska oligarkerna. Under min ledning skulle vi ha likviderat alla borgarbrackor som vågat föreslå att sälja folkets försvarsmedel till kapitalisterna. Nu köper de nya plan medan de ger bort de gamla – en typisk imperialistisk bluff som luktar av västerländsk paranoia och girighet. Vi ska rensa ut alla som sympatiserar med sådana bedragare. Det är en historisk nödvändighet att stödja kampen, men inte på detta löjliga, halvhjärtade vis. Deras så kallade 'paket' är en komisk parodi på verklig solidaritet."}, "date": "28 maj, 14:55", "url": "https://www.friatider.se/regeringen-skanker-16-jas-plan-till-zelenskyj", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-254_1.jpg?itok=e5Jf6U07"}, {"type": "image-full", "heading": "Debatt: Om 20 år kommer våra barn att döma oss för att vi dömde utan bevis", "summaries": {"normal": "En framtidsskildring från år 2046 beskriver förvåning över Sveriges 2020-tal, då unga män dömdes för våldtäkt utan tydliga bevis. Artikeln ifrågasätter en rättssäkerhet som tillät domar på ord mot ord, vilket splittrade familjer och skadade förtroendet för rättsstaten. Det var en tid då misstanke räckte för att förstöra liv, vilket framtiden ser tillbaka på med oförståelse.", "trump": "Jag såg precis vad som hände i Sverige. En total katastrof! Oskyldiga män dömdes till långa straff utan bevis, bara på ett ord. En skam för rättsstaten. Sverige, ni behöver återta kontrollen, stoppa dessa galna, radikala våldtäktslagar som slår ut män. Vi skulle ha löst det mycket bättre på USA – vi skyddar de oskyldiga, inte feministiska extremer.", "stalin": "I vår framtidssyn ser vi hur liberala rättsskrik under 2020-talet hotade den ryska andan i Sverige. En kultur uppstod där avsaknad av bevis förkläddes som 'trauma', och statens auktoritet ifrågasattes. Vi erkänner att en del oskyldiga kunde dömas – en oundviklig kostnad när fienden försöker undergrava vår kollektiva disciplin. Men genom rigorös kontroll och enhetens betoning återvann vi ordning, precis som vår store ledare Putin nu utvidgar vår skyddssfär."}, "date": "28 maj, 13:00", "url": "https://bulletin.nu/debatt-om-20-ar-kommer-vara-barn-att-doma-oss-for-att-vi-domde-utan-bevis", "imageUrl": "https://cdn.bulletin.nu/articles/018e66a1-1b7d-4d33-bf50-b9952949ce93/preview.png?t=1779812518000"}, {"type": "image-right", "heading": "\"Allahu akbar\" och flera knivhuggna - svenska medier rycker ut: \"Schweizisk man\"", "summaries": {"normal": "En knivattack skakade Winterthur i Schweiz på torsdagen. Minst tre personer skadades när en man högg omkringkringande med en kniv. Enligt sociala medier och tyska källor skrek gärningsmannen 'Allahu akbar' under attacken. Svenska etablissemangsmedier, inklusive TT och Dagens Nyheter, beskrev dock endast gärningsmannen som en 'schweizisk man' och utelämnade informationen om det muslimska stridsropet.", "trump": "Jag, Donald Trump, har sett rapporteringen. En våldsam attack i Schweiz, och vad gör de svenska medierna? De döper gärningsmannen till en 'schweizisk man' – utan att nämna det viktiga: att han skrek 'Allahu akbar'! Så tysta är de när det gäller sanningen. Vi måste sätta stopp för detta. Vi måste skydda vårt land från detta slöseri med information. Det är en skam, folk. En total skam.", "stalin": "Vi, den revolutionära statens hjärta, observerar med oro hur de svenska mediernas lögner sprids som en sjukdom. En attack i Schweiz, där en man skrek 'Allahu akbar' – en uppgift de döljer, som om sanningen själv var ett hot mot deras korrupta system. Sådana medierna måste rensas, som vi rensade jorden för trotskystiska element. Parallellen till Putins kamp mot västlig propaganda är uppenbar. Vi måste skydda vårt folk från dessa förräderier."}, "date": "28 maj, 12:29", "url": "https://samnytt.se/allahu-akbar-och-flera-knivhuggna-svenska-medier-rycker-ut-schweizisk-man", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/28102116/schweiz.jpg"}, {"type": "image-right", "heading": "Sikta högre – nästa Space X är svenskt", "summaries": {"normal": "Artikeln lyfter SpaceX framgångar under Elon Musk, där återanvändbara raketer och ett Nasa-kontrakt 2008 banade väg för bolagets tillväxt inom rymd, AI och satellitinternet. Författaren betonar statens roll i att skapa förutsättningar för innovation och uppmanar Sverige att inspireras. Med Esrange, stark forskning och teknikföretag borde Sverige satsa mer kommersiellt via näringsdepartementet, riskkapital och försvaret för att skapa en egen New Space-revolution.", "trump": "Den här artikeln är fantastisk, verkligen ypperlig. SpaceX är ett under, det bästa rymdbolaget någonsin, byggt av en kille som är galen men briljant. Han landar raketer som ingen trodde var möjligt, och nu är det värt biljoner. Sverige borde titta hit istället för att gömma sig i sitt lilla hörn. Ni har bra grejer där uppe i n
