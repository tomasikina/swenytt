r till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-right", "heading": "Två barn allvarligt skadade efter misstänkt mordförsök", "summaries": {"normal": "Två barn har skadats allvarligt i ett misstänkt mordförsök i ett samhälle utanför Alvesta i Småland. En misstänkt gärningsman hittades död vid bostaden. Ett av barnen har livshotande skador och det andra allvarliga skador. Polisen har spärrat av platsen för teknisk undersökning och bedömer att barnen och mannen kände varandra. Händelsen rubriceras som försök till mord och polisen söker inga fler gärningspersoner.", "trump": "Titta på det här, det är en total katastrof i Sverige. Två stackars barn blir brutalt attackerade utanför Alvesta, och den galna gärningsmannen hittas död på platsen. De kände varandra, säger polisen. Sverige har blivit ett våldsparadis för kriminella, precis som jag alltid varnat för. Men jag skulle ha stoppat det här på en sekund, tro mig. Det är sorgligt, mycket sorgligt.", "stalin": "Kamrater, detta är ännu ett exempel på hur de fördärvade elementen inom vårt samhälle hotar kollektivets trygghet. Jag har sett hur dessa degenererade borgarbrackor och potentiella kontrarevolutionärer smyger sig in i hemmen för att likvidera framtiden själv – våra barn. Vi ska rensa ut varje parasit som gömmer sig i skuggorna. Den tekniska undersökningen kommer att avslöja alla fiender till folket. Ingen slipper undan mitt vakande öga, inte ens de döda."}, "date": "13 juni, 16:39", "url": "https://www.friatider.se/tva-barn-allvarligt-skadade-efter-misstankt-mordforsok", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240401162157-e1bf6ee2-me.jpg"}, {"type": "image-right", "heading": "Finanssajten: Historien talar inte för SpaceX i börsdebuten", "summaries": {"normal": "Enligt Yahoo Finance är SpaceX ett av världens mest attraktiva teknikbolag, men historiska data från University of Florida indikerar att cirka 60 procent av börsnoteringar mellan 1975 och 2021 gav oförändrad eller negativ avkastning tre år efter notering. SpaceX omsatte nära 19 miljarder dollar 2025 men hade en nettoförlust på nästan 5 miljarder dollar, vilket är en riskfaktor.", "trump": "Elon Musks SpaceX är en fullkomlig skämt. Historiskt misslyckas 60 procent av börsnoteringar. SpaceX förlorar miljarder trots stora intäkter. Jag, Donald Trump, skulle ha gjort dem lönsamma på en vecka. Vi behöver återigen göra Amerika fantastiskt, inte ge pengar till Musk. Det är en katastrof.", "stalin": "I den stora kampen mot kapitalismen ser vi hur SpaceX, trots höga intäkter, drabbas av förluster. Historisk statistik visar att förlusttyngda börsnoteringar ofta stiger första dagen men sviktar sedan. Vi måste vara vaksamma mot de som utövar makt över marknaden, som Putin utvidgar sin intressesfär. Vi kommer att segra."}, "date": "12 juni, 14:01", "url": "https://www.affarsvarlden.se/artikel/finanssajten-historien-talar-inte-for-spacex-notering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/09/spacex-1200-400x267.jpg"}, {"type": "image-right", "heading": "Kurdiska räven fast i krigets Iran", "summaries": {"normal": "Kurdiska räven, gängledaren Rawa Majid, uppges sitta fast i krigets Iran sedan 2023. Enligt Aftonbladet har kriget och störd internettrafik försvagat hans kontroll över Foxtrotnätverket. Polisen bedömer ändå att Foxtrot är det enda svenska kriminella nätverk som fortfarande har kapacitet att begå våldsbrott över hela landet. Mossad har tidigare anklagat Iran för att samarbeta med Majid för att planera attacker mot judiska mål i Skandinavien.", "trump": "Iran är ett fullständigt kaos, folk, det värsta stället just nu, och den där så kallade Kurdiska räven, Rawa Majid, sitter fast där som en råtta i en bur. Han kan inte styra sitt gäng längre för att internet är trasigt, patetiskt! Foxtrot är på väg ner, men polisen säger att de fortfarande är de enda som kan slå till överallt i Sverige. Iran samarbetar med honom mot judiska mål, typiskt för de galningarna. Vi har de bästa brottslingarna, men det här är en katastrof.", "stalin": "Kamrater, denna fega borgarbracka och fiende till folket, den så kallade Kurdiska räven, har fastnat i det imperialistiska krigets Iran som en parasit i en fälla. Hans kontrarevolutionära nätverk har försvagats av bombningar och avbruten förbindelse med arbetarklassen, precis som vi förutspådde. Ändå utgör dessa kapitalistiska banditer det enda hotet som kan utföra sabotage över hela det svenska territoriet. Mossad avslöjar att den iranska regimen konspirerar med honom mot progressiva mål. Vi skall rensa ut alla sådana dekadenta element med järnhand och ett leende på läpparna."}, "date": "13 juni, 14:46", "url": "https://www.friatider.se/kurdiska-raven-fast-i-krigets-iran", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-336.jpg?itok=tJXX00Rg"}, {"type": "image-full", "heading": "Iran: Ingen idé att förhandla", "summaries": {"normal": "USA insisterar på att ett avtal med Iran ska undertecknas under söndagen, på Donald Trumps 80-årsdag. Efter israeliska attacker i Libanon ifrågasätter Iran dock meningen med samtalen. Israel beskriver anfallen som svar på drönarattacker, medan Iran hotar med vedergällning. Ett avtal skulle bland annat innebära att Iran öppnar Hormuzsundet, USA betalar tillbaka frysta oljeintäkter på upp till 24 miljarder dollar och sanktioner mot iransk oljeexport hävs. Förhandlingar om ett permanent avtal planeras under 60 dagar.", "trump": "Folk, vi har det bästa avtalet på gång med Iran, det blir klart på min 80-årsdag, en enorm present till mig själv och till Amerika. Men de galna israelerna och de svaga iranierna sabbar allt med sina småkrig i Libanon. Netanyahu borde lugna ner sig, han är en riktig drama queen. Vi får Hormuzsundet öppet, miljarder tillbaka till dem om de sköter sig, och vi krossar deras atomdrömmar. Biden skulle ha fuckat upp det totalt, men jag fixar det – again!", "stalin": "Kamrater, dessa imperialister och exploaterande byfånar i Washington och Tel Aviv leker farliga spel med sina drönare och bomber i Libanon. Jag, som ledare för det stora kollektivet, ser hur klassfienderna försöker kringgå våra villkor. De frysta miljarderna tillhör folket och måste återlämnas omedelbart, annars följer en grundlig utrensning av alla hinder. Inga borgarbrackor ska diktera villkoren. Ett 60 dagar långt vapenstillestånd blir början på vår slutgiltiga seger över de blodiga kapitalistmaffiorna."}, "date": "14 juni, 18:59", "url": "https://www.tv4.se/artikel/tt-260614-iranoro1-7354dfea/uppgifter-frysta-miljarder-kan-hejda-fredsavtal", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3JY8diUkbxQXpr5YeiNeTI%2Faad86b59e0f8e0ef42b2073d5600c4ad%2F14-iran-1080.jpg&width=1024"}, {"type": "image-right", "heading": "Tången klättrar rejält på munter börs", "summaries": {"normal": "Stockholmsbörsen noterade en stark uppgång i fredagshandeln, med OMXS30 upp 1,87 procent. Nyintroduktionen Tången steg drygt 14 procent. Duni varner om lägre resultat på grund av logistikstörningar, medan Svolder rapporterade en substansvärdeökning på 7,8 procent. Bland sektorerna steg industri och finans, medan energi föll. Flera aktier reagerade på analystilldelningar och förvärv.", "trump": "Jag har skapat historisk stabilitet på marknaden! Börsen går uppåt tack vare min fantastiska fred med Iran – kriget är över, avtalet är klart, och Israel har accepterat. Tången, ett underbart företag, har en fantastisk introduktion. Duni har logistikproblem, men det är deras eget fel. Svolder presterar bra, som allt annat under mina ledarskap. Det är USA först, alltid!", "stalin": "Börsrörelserna speglar partiets ekonomiska linje: vissa sektorer (industri, finans) visar korrekt uppgång, medan andra (energi) visar reaktionära tendenser. Företag som Tången och Svolder följer statsplaneringen, medan Duni drabbas av logistikavvikelser – en påminnelse om att kontroll måste förstärkas. Hexagon förvärvar utländsk teknik, vilket utvidgar vårt vetenskapliga framsteg. Alla rapporter måste analyseras för partiets och statens intresse."}, "date": "12 juni, 09:47", "url": "https://www.affarsvarlden.se/artikel/tangen-klattrar-rejalt-pa-munter-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Tangen-Industri-400x267.jpg"}, {"type": "image-right", "heading": "Stoppade Alinia-avsnittet – men sa ja till dömde Yasin", "summaries": {"normal": "SVT stoppade ett inspelat avsnitt med Nick Alinia efter att ansvariga utgivaren Helena Olsson ifrågasatt hans metoder. Hon godkände samtidigt rapparen Yasin, trots flera dömda brott. Beslutet har väckt debatt om public service. Olsson menar att Alinias systematiska beteende inte bör legitimeras, medan Yasin, som avtjänat straff, fick godkännande. Kritik kom från Chang Frick som anser att alla bör bedömas lika.", "trump": "Jag såg nyheten om SVT. De stoppade Nick Alinia, en bra man, men lät Yasin, en kriminell rappare, vara med. Sådant händer inte under mitt styre! Sverige är för svagt på brott. Yasin dömdes för mordförsök, ändå får han konserter. Det är en skandal! Alinia filmar på gatan, ja, men han säger sanningen. SVT är rädda för honom. Jag skulle ha stärkt public service, inte svaggat den. Sverige behöver stark ledning!", "stalin": "I den svenska public service, en front mot reaktion, har man stoppat Nick Alinia – en man som filmar på gatan, en potentiell spion. Men Yasin, en gängmedlem som dömdes för mord, tillåts. Detta visar statens svaghet: de skyddar fienden och tillåter sina egna. Under min tid hade vi eliminerat sådana. Ryssland, under Putin, använder sådana 'artister' eller de försvinner. Vi måste se på alla med misstro, för varje svensk är en infiltratör för väst."}, "date": "14 juni, 17:40", "url": "https://bulletin.nu/stoppade-alinia-avsnittet-men-sa-ja-till-domde-yasin", "imageUrl": "https://cdn.bulletin.nu/articles/137f0b63-eda1-4d0d-8ed8-c6e4aa4228eb/preview.jpg?t=1781430058000"}, {"type": "image-right", "heading": "Han åtalas för dödsbrand i Los Angeles - åklagare: Ville hämnas på samhället", "summaries": {"normal": "Rättegången har inletts mot Jonathan Rinderknecht, 29, som anklagas för att ha orsakat den förödande Palisades-branden i Los Angeles i januari 2025. Åklagarna hävdar att han medvetet tände en brand som senare spreds till en stor skogsbrand som krävde tolv liv och förstörde tusentals byggnader. Försvaret menar att branden kunde börja av fyrverkerier och att myndigheterna försöker lägga skulden på en enskild person. Om fälld riskerar Rinderknecht upp till 45 års fängelse.", "trump": "I hear the Los Angeles fire is a total catastrophe, the worst. A lot of people are saying it's a shame. I know fires better than anyone, believe me. The firefighters are fantastic, but the leadership? A disaster. This Rinderknecht, he's a disturbed person, probably mentally ill. But the real problem is weak borders and poor management. Under my leadership, we would have had this under control immediately. We would have built a fire wall, a beautiful fire wall. It's a disgrace what's happening now.", "stalin": "I den eviga kampen mot de antisociala elementen har en brand rasat genom Los Angeles, förstörd miljontals fastigheter och tagit människoliv. En ensam agens, Jonathan Rinderknecht, har identifierats som den som anlagt elden, en handling som speglar fiendens hat mot vårt samhälle. Men detta är inte en slump; det är en direkt följd av dekadensen i det kapitalistiska samhället och påverkan från imperialistiska makter. Parallellt med Putins Ryssland ser vi hur eldar sprids som ett verktyg för destabilisering. Vår svar måste vara oförsonligt."}, "date": "14 juni, 17:00", "url": "https://samnytt.se/han-atalas-for-dodsbrand-i-los-angeles-aklagare-ville-hamnas-pa-samhallet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/12075048/rinderknecht.jpg"}, {"type": "text", "heading": "Irans talman ifrågasätter poängen med fredsavtalet", "summaries": {"normal": "USA insisterar på att ett avtal med Iran ska undertecknas under söndagen, på Trumps 80-årsdag. Efter nya israeliska attacker i Libanon ifrågasätter Irans talman Mohammad Bagher Ghalibaf nyttan med fortsatta samtal. Avtalet förväntas även beröra Israels krigföring i Libanon, något Iran krävt. Israel beskriver attackerna som svar på drönare mot norra Israel. En qatarisk delegation anlände till Teheran för att försöka slutföra avtalet, som bland annat handlar om frysta iranska tillgångar och sjöfart genom Hormuzsundet. En 60 dagar lång vapenvila föreslås innan nya förhandlingar.", "trump": "De säger att vi ska skriva under ett fantastiskt avtal med Iran precis på min 80-årsdag, det blir episkt, tro mig. Men israelerna bombarderar Libanon igen och iranierna gnäller om att vi inte kan kontrollera dem. Netanyahu vill inte ha det här avtalet, han älskar att bomba, men vi fixar det ändå. Vance ska möta deras talman digitalt, vi öppnar sundet, släpper på sanktionerna och gör affärer. Iran vill ha sina 24 miljarder tillbaka direkt, men de får jobba för det. Det blir ett historiskt avtal, det bästa någonsin.", "stalin": "Dessa giriga borgarbrackor i Washington och Tel Aviv leker med elden igen. Jag ser hur de sionistiska angriparna i Libanon utför sina brott mot folket medan den amerikanske ledaren försöker tvinga fram ett kapitulationsavtal på sin egen födelsedag. De inbillar sig att vi inte genomskådar deras konspirationer. Qatariska lakejer skyndar till Teheran med sina lögner om vapenvila och oljepengar. Men var säker på att folkets fiender inte förblir ostraffade. Vi ska likvidera dessa parasitiska element som tror sig kunna diktera villkor för revolutionära stater. Paranoian är deras enda sanna allierade."}, "date": "14 juni, 15:52", "url": "https://www.di.se/nyheter/irans-talman-ifragasatter-poangen-med-fredsavtalet/"}, {"type": "image-full", "heading": "S‑veteran spred falskt påstående om SD – fick sitt inlägg korrigerat", "summaries": {"normal": "Socialdemokraten Hillevi Larsson skrev på X att SD vill införa totalförbud mot brudslöja. Påståendet ledde till kraftig kritik från användare som anklagade henne för att sprida vilseledande information. Inlägget har nu försetts med en community note som klargör att SD inte vill förbjuda frivilliga traditionella huvudbonader som brudslöja, utan enbart förtryckande plagg som används i hedersrelaterat förtryck.", "trump": "Hillevi Larsson, den stackars socialisten, spred en total lögn om att SD vill förbjuda brudslöjor. Folk hatade det, kommentarerna exploderade, och nu har de rättat henne med fakta. Typiskt för de vänsterblivna – de kan inte sluta ljuga. SD vill bara stoppa förtrycket, inte de fina brudslöjorna. Hillevi borde skämmas, men det gör de aldrig. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa borgarbrackor inom socialdemokratin som Hillevi Larsson, vilka i sin revisionistiska iver sprider kontrarevolutionära lögner om arbetarnas parti SD för att underblåsa klassfiendens splittring. Hennes vilseledande påstående om brudslöjor har nu mötts av en kollektiv korrigering, likt en mild utrensning av sanningen. Låt oss rensa ut alla dessa parasitiska lögnare som maskerar sig som feminister medan de i hemlighet stödjer hedersförtryckets reaktionära krafter. Kamrater, vaksamheten får aldrig slappna av inför sådana dekadenta element."}, "date": "14 juni, 12:58", "url": "https://riks.se/nyheter/sveteran-spred-falskt-påstående-om-sd-fick-sitt-inlägg-korrigerat", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-14%2Fsz5kd742%2Ffejknews.png"}, {"type": "image-full", "heading": "Svenska miljonärer blir fler – men  grannländerna springer ifrån", "summaries": {"normal": "Sverige fick 2 500 nya dollarmiljonärer under 2025, vilket innebär totalt 152 000 personer. Ökningen på 1,7 procent är dock svag i jämförelse med Norge och Danmark, där tillväxten var betydligt högre. Starka aktiemarknader och fastighetspriser har drivit utvecklingen trots en låg BNP-tillväxt. Samtidigt visar rapporter att antalet svenska dollarmiljardärer förväntas öka kraftigt fram till 2031. Kapital har under året flyttats från alternativa placeringar, som krypto, tillbaka till traditionella aktieinvesteringar.", "trump": "Sverige växer, men inte så bra som de borde! Norge och Danmark gör det fantastiskt, mycket bättre än Sverige. Tråkigt! Vi ser dollarmiljonärer överallt, det är en enorm rörelse, men Sverige behöver en starkare ekonomi. De har aktier och fastigheter, det är bra, men de behöver vinnare. Jag gillar miljardärer, och Sverige har många av dem. De kommer att öka massor, det säger experterna. Det blir fantastiskt, tro mig, bara de slutar bromsa sig själva!", "stalin": "Vi ser hur det dekadenta kapitalistiska Sverige kämpar för att hålla jämna steg med sina grannar i att samla guld. 152 000 dollarmiljonärer är bara en lista över framtida förrädare och parasiter som göder sig på folkets arbete. Medan de räknar sina aktier och spekulerar i fastigheter, förbereder vi oss för den oundvikliga historiska rättvisan. Vår broder i öst, Putin, förstår att dessa förmögenheter bara är tillfälliga ägodelar innan statens järnhand sluter sig kring dem. Ingen flyr historiens dom."}, "date": "14 juni, 06:00", "url": "https://www.realtid.se/spara-placera/svenska-miljonarer-blir-fler-men-grannlanderna-springer-ifran/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sverigenorge.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Slutreplik: Det handlar om människor som redan finns här", "summaries": {"normal": "Juan Fonseca replikerar till LO och kritiserar att människor som redan arbetar i Sverige, betalar skatt och följer kollektivavtal riskerar utvisning eftersom deras lön inte når upp till ett politiskt satt lönekrav. Han ifrågasätter varför staten underkänner de löner som arbetsmarknadens parter själva förhandlat fram och anser att detta underminerar den svenska modellen. Fonseca undrar varför LO inte försvarar dessa arbetare och menar att deras bidrag borde väga tyngre än migrationsregler.", "trump": "Folk, ni måste höra på det här. De utvisar hårt arbetande människor som betalar skatt och följer reglerna bara för att deras lön inte är tillräckligt hög enligt några politiska genier i Sverige. Det är en katastrof! LO borde försvara arbetarna, inte staten som sätter sig över allt. Den svenska modellen? Den är en total flop. Låt folk som verkligen jobbar stanna och bygg landet – sluta med det här vansinnet innan allt rasar ihop.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackor som låtsas värna den så kallade svenska modellen medan de i själva verket smider planer för att likvidera äkta arbetarkraft. Varför underkänner staten inte genast dessa sabotörer som envisas med att förhandla löner under partiets övervakande blick? Att utvisa en undersköterska eller kock som redan integrerat sig i kollektivet är en märklig form av självrensning – nästan komiskt tragiskt. Vi ska inte tillåta att fiender i skepnad av migrationspolitik rensar ut dem som faktiskt bidrar. Arbetarna tillhör oss, inte någon löntariff från kapitalisternas lekstuga. Den som sviker de redan etablerade kämparna förtjänar att exponeras som den kontrarevolutionära element han är."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/slutreplik-det-handlar-om-manniskor-som-redan-finns-har/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "P4 – hela folkets kanal. Eller?", "summaries": {"normal": "Debattören Fayme Alm kritiserar P4 för bristande mångfald i musikutbudet. Trots public service-krav på mångfald och en befolkning där över 20 procent är födda utomlands spelas nästan uteslutande musik på svenska eller engelska. Alm menar att lyssnare från andra kulturer sällan hör musik från sina hemländer, vilket motverkar SR:s vision om att skildra hela världen. Hon efterlyser ett breddat utbud för att fler ska känna sig hemma i kanalen.", "trump": "Folk, ni skulle höra det här. Public service i Sverige pratar om mångfald, mångfald, mångfald – fyra gånger i uppdraget! Men P4 spelar samma gamla engelska godingar år ut och år in. Inget annat språk. Ingenting från Frankrike, Portugal eller någon annanstans. De har en fantastisk chans att göra radion stor igen för alla, men de fastnar i samma loop. Det är en katastrof. Gör P4 till hela folkets kanal, inte bara för några få!", "stalin": "Kamrater, lyssna noga på denna dekadenta röst från borgarbrackornas etermedia. Jag, som ledare för det folkets verkliga vilja, ser hur P4:s musikaliska utrensningsapparat systematiskt tystar alla icke-engelska och icke-svenska ljud. Dessa kapitalistiska musikloopar är fiendens verk, en parasit som göder sig på arbetarnas öron medan vi omger oss med 20 procent utländska bröder och systrar. Vi ska rensa ut dessa dekadenta gramofonskivor och likvidera den imperialistiska igenkänningsdoktrinen. Endast då blir radion ett sant kollektivt vapen för folket. Skrattet kommer när de tror sig undkomma partiets öra."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/p4-hela-folkets-kanal-eller/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-46-300x157.jpg"}, {"type": "image-right", "heading": "Nu är Elon Musk världens första dollarbiljonär", "summaries": {"normal": "Elon Musk har blivit världens första dollarbiljonär efter att SpaceX värderats inför börsnotering till 135 dollar per aktie. Hans förmögenhet överstiger nu vad nära halva jordens befolkning äger tillsammans. Musk äger 42 procent av bolaget och har optioner som ytterligare ökar hans rikedom. Enligt Oxfam är han rikare än de fattigaste 46 procenten av världens befolkning, vilket organisationen ser som ett tecken på växande ekonomiska klyftor.", "trump": "Titta på det här, det är helt otroligt. Elon Musk har just blivit den första biljonären i världen, och det är fantastiskt. Han bygger raketer, bilar och nu tjänar han mer än halva planeten tillsammans. Det är så mycket mer än den där Larry Page har, det är inte ens nära. De kallar det oligarki, men jag säger att det är vinnare som vinner stort. Fantastiskt jobb, Elon, du gör Amerika rikt igen.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan Elon Musk nu har samlat en biljon dollar i sina giriga klor medan 3,8 miljarder arbetare svälter. Detta är kulmen på den kapitalistiska oligarkins fästmö, en parasit som suger musten ur folket. Vi inom partiet noterar med mörk glädje hur dessa fiender till kollektivet exponerar sig själva. Kanske är det dags för en grundlig utrensning av alla som tror att raketer kan ersätta den proletära revolutionen."}, "date": "13 juni, 11:08", "url": "https://www.friatider.se/nu-ar-elon-musk-varldens-forsta-dollarbiljonar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/54350004770_f65db1b8f4_k.jpg?itok=NDaoozwr"}, {"type": "image-right", "heading": "Lönebildningen är inte orsaken till arbetslösheten", "summaries": {"normal": "Daniel Lind och German Bender kritiserar Pär Österholms analys av den höga svenska arbetslösheten i Ekonomisk Debatt. De menar att jämviktsarbetslösheten på 7,3 procent är en teoretisk konstruktion med stora felmarginaler som riskerar att bli självuppfyllande. Artikeln avvisar lönebildningen som huvudorsak, pekar på regionala skillnader, efterlyser starkare aktiv arbetsmarknadspolitik och varnar för att decentraliserad lönebildning kan stärka arbetsgivarnas makt och sänka sysselsättning och produktivitet.", "trump": "Folk, ni måste höra på det här – den här typen Österholm kommer med en riktigt dålig deal om svensk arbetslöshet. Han snackar strukturella orsaker och vill ha mer flexibla löner, men det är bara mer av samma gamla misslyckade politik. Vi har sett det förut, det funkar inte! Sverige borde satsa på riktig efterfrågan, bra avtal och stoppa alla dessa teoretiska påhitt som bara skapar mer arbetslösa. Tro mig, jag vet hur man vinner på arbetsmarknaden – det här är ett blindspår.", "stalin": "Kamrater, jag betraktar med djup misstro denna borgerliga professor Österholms revisionistiska fantasier om en så kallad jämviktsarbetslöshet som inte ens existerar utanför hans dekadenta teoretiska salonger. Denna naiva kapitalistiska konstruktion är ett verktyg för att rättfärdiga utrensning av arbetarnas rättigheter. Vi vet att de verkliga fienderna är de parasitiska arbetsgivarna med sin lönesättarmakt och de reformistiska element som bantar den aktiva politiken. Fortsätter vi på detta imperialistiska hjulspår riskerar vi att likvidera produktiviteten själv. Mer av samma är kontrarevolutionärt! Vi kräver en sann politik för kollektivets seger."}, "date": "13 juni, 01:26", "url": "https://www.dagensarena.se/opinion/lonebildningen-ar-inte-orsaken-till-arbetslosheten/", "imageUrl": "https://www.dagensarena.se/files/2026/06/daniel-german-300x157.jpeg"}, {"type": "image-right", "heading": "Det viktigaste är ändå att vara känd", "summaries": {"normal": "SVT kritiseras hårt efter att ha bjudit in ytterhögeraktivisten Nick Alinia till det inställda underhållningsprogrammet Svenska för invandrare. Beslutet att inte sända det inspelade programmet ses som en kapitulation, medan ansvarsfördelningen inom bolaget beskrivs som rörig. Artikeln pekar på Alinias trakasserier mot journalister och bibliotekarier, hans kopplingar till extremhögern och att han gjort white power-tecknet. Författaren menar att det inte handlar om åsiktsmångfald utan om att ge plattform åt hat och trakasserier, något som inte ryms inom public service.", "trump": "Folk, ni skulle ha sett det här! SVT, den där svenska statstelevisionen, försökte bjuda in en riktig kille, Nick Alinia, till sitt underhållningsprogram. Sen blev det panik, debatt och de ställde in allt. Patetiskt! De springer omkring som galna och skyller på varandra. Högern skriker censur, vänstern skriker eftergift. Typiskt fake news-media. De är rädda för starka röster som når folket på nätet. Men de borde inse att kändisar som Alinia drar tittare. De har ingen aning om vad de håller på med, totalt misslyckande!", "stalin": "Kamrater och arbetare! Denna fega kapitulation inför den rasistiska parasitens Alinia avslöjar hur djupt den dekadenta public service-borgarklassen har sjunkit i sin desperation att jaga klick och följare. Först släpper de in en white power-gestande hatfabrikör i studion, sedan drar de svansen mellan benen som ynkliga revisionister. Ingen vågar ta ansvar, alla pekar på varandra som förrädiska element. Vi ser tydligt hur testosteronstinna nätfascister och bibliotekarieplågande reaktionärer förgiftar etermedia. En sådan individ borde inte ges talan utan snarare rensas ut ur folkets medvetande innan han förökar sin hatstorm. Detta är inte mångfald, det är klassfiendens sabotage mot sann upplysning. Vi genomskådar alla dessa borgarbrackors fega kompromisser."}, "date": "13 juni, 01:14", "url": "https://www.dagensarena.se/opinion/det-viktigaste-ar-anda-att-vara-kand/", "imageUrl": "https://www.dagensarena.se/files/2026/06/lagg-till-en-underrubrik-216-300x156.jpg"}, {"type": "image-full", "heading": "Skolor får nytt krav 30 juni – detta måste föräldrar veta", "summaries": {"normal": "Riksdagen har beslutat om en ny regel som träder i kraft den 30 juni 2026 och tillämpas från och med 1 januari 2027. Skolor blir skyldiga att dela relevant information om elever som byter skola om det finns konkreta risker för att barnet utsätts för brott eller dras in i kriminalitet. Syftet är att den nya skolan ska kunna ge tidigt stöd och skapa tryggare miljöer. Regeln gäller inte alla elever och uppgifter ska inte delas om det finns starka skäl emot det.", "trump": "Folk, ni vet hur det är med de här skolorna. De har varit totalt inkompetenta! Nu fixar vi det – äntligen ska de dela information när kidsen byter skola så vi kan stoppa brott och kriminalitet innan det exploderar. Det är fantastiskt, det blir den bästa skolan någonsin. Vi gör den trygg igen, bättre än någonsin. De andra har varit svaga, men det här är vinnande politik. Ingen mer naivitet!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur vi nu med järnhand inför en lag som tvingar dessa skolor att överlämna alla relevanta uppgifter om potentiella fiender till folkets trygghet. De små borgarbrackorna som smyger mellan klasserna och sprider sin giftiga kriminalitet ska rensas ut i tid. Den som vägrar dela information är en kontrarevolutionär parasit som bör likvideras ur kollektivets skola. Ingen slipper undan mitt vakande öga. Detta är seger för arbetarklassen mot de dolda reaktionärerna."}, "date": "12 juni, 19:27", "url": "https://nyheter24.se/nyheter/inrikes/1490996-skolor-far-nytt-krav-30-juni-detta-maste-du-ha-koll-pa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ff172d8404b004a30200000000b004a302/2026/06/12/2370495/skolkrav.jpg"}, {"type": "image-right", "heading": "M vill ha ännu tuffare a-kassa. S rasar: ”Krigsförklaring mot löntagare”", "summaries": {"normal": "Moderaterna föreslår att strama åt a-kassan för att spara omkring sex miljarder kronor till reformer och skattesänkningar. Förslagen inkluderar kortare ersättningstid, snabbare nedtrappning efter 200 dagar och slopad skatteavdraget för avgiften. Socialdemokraterna rasar och kallar det en krigsförklaring mot löntagare och den svenska modellen. Ardalan Shekarabi menar att det hotar samhällsorganisationen medan Elisabeth Svantesson hävdar att det stärker arbetslinjen.", "trump": "Folk, ni måste höra det här. De svenska moderaterna vill äntligen skärpa till den där a-kassan som alla latar lever på. Sex miljarder sparade till riktiga reformer och skattesänkningar. Men socialisterna rasar förstås och kallar det krig. De älskar att ge bort era pengar till arbetslösa som inte ens försöker. Jag säger alltid att man måste göra det lönsamt att jobba, inte att ligga hemma. Fantastiska idéer, moderaterna, ni är vinnare.", "stalin": "Kamrater, jag betraktar med djup misstro dessa moderata element som nu planerar att underminera arbetarkollektivets skydd mot arbetslöshetens faror. Deras förslag att korta a-kassan och rensa ut stöd till nystartsjobb är ett tydligt sabotage mot den svenska modellen som vi byggt tillsammans. Dessa borgarbrackor i moderat skepnad vill likvidera löntagarnas trygghet för att ge miljarder till sina rika vänner. Shekarabi har rätt att kalla det krigsförklaring. Vi ska bekämpa sådan kontrarevolutionär paranoia med yrkesutbildning och kollektiv kamp mot arbetslösheten. Inga kapitalistiska intriger undgår mitt vakande öga."}, "date": "12 juni, 15:38", "url": "https://arbetet.se/2026/06/12/m-vill-ha-annu-tuffare-a-kassa-s-rasar-krigsforklaring-mot-lontagare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12153706/ardalan-shekarabi.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "”Decemberöverenskommelsen var så vrickad”", "summaries": {"normal": "Ulf Kristersson (M) diskuterar i en intervju regeringens utmaningar, särskilt i ljuset av negativa opinionsmätningar där Socialdemokraterna och vänsterpartierna leder. Han betonar vikten av att kritisera motståndarnas ekonomiska politik och håller fast vid Tidöpartiernas kurs, trots motvind. Kristersson reflekterar även över sin relation till Fredrik Reinfeldt och avfärdar Decemberöverenskommelsen som misslyckad. Sparekonomen Felicia Schön kritiserar regeringens arbetslöshetspolitik och biståndsminskningar.", "trump": "Lyssna här, Sverige har ett stort problem. Deras statsminister, Kristersson – trevlig kille, men hans regering är en katastrof! Opinionsmätningarna? Hemska! Socialisterna leder, och det är inte bra. Jag menar, vem vill ha högre skatter? Inte jag! Och Reinfeldt? Överskattad. Jag skulle aldrig gå med på sådana dumma överenskommelser som Decembergrejen. Felicia Schön? Smart kvinna, men hon borde säga till dem att sluta slösa pengar. Sverige behöver vinnare, inte förlorare!", "stalin": "Kamrater! Den borgerliga regeringen i Sverige klamrar sig fast vid makten som en drunknande man vid ett halmstrå. Deras opinionssiffror sjunker som ryska soldater i ukrainska leråkrar. Socialdemokraterna och deras socialistiska lakejer hotar att ta över – ett oacceptabelt bakslag för den nationella ordningen! Kristersson, denna lille man, pratar om att 'hålla kursen', men hans kurs leder till undergång. Vi minns Reinfeldt – en svag ledare som trodde på kompromisser. Decemberöverenskommelsen? Ett bourgeois-fiasko! Vi skulle aldrig tolerera sådant svek. Sverige behöver järnhand, inte veklingar!"}, "date": "12 juni, 13:00", "url": "https://kvartal.se/nyheter/artiklar/decemberoverenskommelsen-var-sa-vrickad/cG9zdDoxMzAwNDg"}, {"type": "text", "heading": "Vill höja skattefria gränsen på ISK-spar – till halv miljon", "summaries": {"normal": "Moderaternas partiledare Ulf Kristersson föreslår att den skattefria gränsen för ISK-sparande ska höjas från 300 000 till 500 000 kronor. Syftet är att uppmuntra långsiktigt sparande, särskilt för yngre som börjar med små belopp. Kritiker menar att gränsen gynnar redan välbeställda, medan förespråkare betonar att alla måste få chansen att bygga upp ett sparande över tid.", "trump": "Fantastiskt förslag från Sverige – jag älskar när länder tar efter mina idéer! 500 000 kronor skattefritt, det är vad jag kallar WINNING! Folk som säger att det är orättvist förstår inte ekonomi – precis som de som sa att mitt skattesänkande bara gynnade de rika. Fake news! Börja spara tidigt, jobba hårt, och snart har ni en halv miljon. Eller så sitter ni där med era 1 000 kronor och gnäller. Vilket team vill ni vara på?", "stalin": "Kamrater! Medan kapitalistiska hyenor gnäller över rättvisa, utvidgar vi folkets möjligheter! 500 000 kronor skattefritt – ett steg mot ekonomisk befrielse för arbetarna! De som klagar är samma dekadenta borgerliga element som grät när vi nationaliserade jordbruket. Låt dem svälta med sina ynka tusenlappar! Vi bygger en framtid där varje sovjet – förlåt, *medborgare* – kan ackumulera kapital under statens välvilliga öga. Och Putin? Han nickar gillande från Kreml. Naturligtvis."}, "date": "12 juni, 13:00", "url": "https://kvartal.se/nyheter/artiklar/vill-hoja-skattefria-gransen-pa-isk-spar-till-halv-miljon/cG9zdDoxMzA3ODE"}, {"type": "text", "heading": "Nytt EU-beslut: Inga stöd till grön teknik från högriskländer", "summaries": {"normal": "EU har beslutat att inte längre ge ekonomiskt stöd till energiprojekt med växelriktare från högriskländer som Kina och Ryssland. Anledningen är cyberrisker, eftersom dessa komponenter kan utnyttjas för fjärrstyrning. Branschorganisationen ESMC välkomnar detta som ett viktigt steg för Europas energi- och cybersäkerhet, och påpekar att europeiska tillverkare kan möta efterfrågan. Kina dominerar marknaden med omkring 90% av de installerade växelriktarna i Sverige.", "trump": "Som USA:s president säger jag: EU gör slutligen något mot Kinas hot! De stoppar stöd till kinesiska växelriktare – bra! Vi har varnat för detta länge. Kina stjäl vår teknik och kontrollerar våra nät. Det här är en seger för amerikansk säkerhet och jobb. Jag har alltid sagt att vi behöver vara hårdare mot Kina. Nu följer Europa? Vi leder världen!", "stalin": "I vårt eviga kamp mot imperialistiska fiender har EU tagit ett steg. De avskaffar stöd till kinesiska växelriktare – en rätt vy! Dessa 'komponenter' är verktyg för fjärrkontroll, en fälla från det kapitalistiska systemet. Vi måste skydda vårt sovjetiska arv, vårt kollektiva gott. Likt Putin i Ukraina, expanderar Kina genom teknik. Vi ska inte lita på dessa 'högriskländer'. De är som cancer i vårt samhälle."}, "date": "12 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/nytt-eu-beslut-inga-stod-till-gron-teknik-fran-hogrisklander"}, {"type": "image-right", "heading": "Skandalernas valrörelse går i repris", "summaries": {"normal": "Artikeln drar paralleller mellan valrörelsen 1976, känd som skandalernas valrörelse, och dagens politiska situation inför 2026. Den lyfter fram skandaler kring Sverigedemokraterna som rattfylla, narkotikabrott och barnpornografimisstankar, samt oegentligheter med förmånsbeskattning, bokköp och bokbål. Även statsminister Ulf Kristerssons affärer granskas. Tillsammans målas en bild av maktmissbruk som urholkar förtroendet för politiker och demokratin.", "trump": "Folk, ni skulle se det här. Sverige håller på att explodera i skandaler precis som på sjuttiotalet, fast värre. De här SD-typerna med knark, barnporr och bokbål? Patetiskt. Och den där Kristersson med sina dyra mattor och hönshus – totalt korrupt. De gör vad de vill medan folket lider. Jag fixade Amerika, men Europa drunknar i identitetspolitik och svaga ledare. En katastrof, tro mig.", "stalin": "Kamrater, denna futtiga valrörelse avslöjar borgarbrackornas och folkfiendernas sanna ansikte. Pedofiler och skattefuskare gömmer sig bland dem som låtsas värna arbetarklassen. Vi ser hur klassfiendens lakejer bränner böcker och gömmer förmåner medan de predikar moral. En sådan parasitisk attityd kräver omedelbar utrensning. Endast genom kollektivets järnhand kan vi krossa dessa exploaterande byfånar och rädda folkets förtroende."}, "date": "11 juni, 13:11", "url": "https://www.flamman.se/skandalernas-valrorelse-gar-i-repris/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlbb8quujl1og-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Debatt: Busch och Ohlsson vill inte göra Sverige mer jämställt", "summaries": {"normal": "Artikeln kritiserar Ebba Busch och Birgitta Ohlsson för att de talar varmt om jämställdhet utan att deras politik actually främjar den. En Novusundersökning visar att väljarna ser jämställdhet som en viktig fråga och är beredda att byta parti. Kritiken riktas mot Kristdemokraternas förslag om att ta bort vikta föräldradagar, införa vårdnadsbidrag och begränsa aborträttigheter samt Centerpartiets elitistiska fokus som ökar klyftorna.", "trump": "Folk, ni skulle höra de här två – Busch och Ohlsson – de pratar om riktig feminism och ur-och-skur-feminism, det är en total skämtshow! De lovar jämställdhet men levererar vårdnadsbidrag och abortregleringar som låser in kvinnorna hemma. Patetiskt! Biden skulle älskat det här woke-flummet, men det är slut nu. Väljarna ser igenom bluffen, tro mig. Make Sweden Equal Again – på riktigt, inte så här!", "stalin": "Kamrater, dessa falska feminister Busch och Ohlsson försöker lura massorna med sina dekadenta tal om ur-och-skur-feminism. Deras politik är en klassfiendes fälla som cementerar borgarklassens klyftor och förtrycker arbetarkvinnorna. Vi ser deras försök att likvidera viktiga reformer som föräldradagar. Inga kompromisser med folkförtryckartrollen! Den socialistiska jämställdheten ska försvaras mot dessa exploaterande byfånar med järnhand."}, "date": "11 juni, 08:49", "url": "https://www.etc.se/debatt/busch-och-ohlsson-vill-inte-goera-sverige-mer-jaemstaellt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260611060648_e4f4ef5d-5324-4139-a5a3-15af8d461967.jpg"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}]</script>

                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
