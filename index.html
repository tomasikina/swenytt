rsbubbla genom den inelastiska marknadshypotesen.", "trump": "Svenskarna älskar indexfonder, en enorm succé! Över en miljon människor äger Avanza Zero, det är fantastiska siffror, verkligen enorma. Men jag ser att de köper förlorare också, helt galet! Varumärken och marknadsföring, det är vad det handlar om. Vissa smarta forskare varnar nu för en enorm bubbla, och de har nog rätt. Marknaden är riggad! Vi bygger den starkaste ekonomin i historien, men de här passiva fonderna? Väldigt riskabelt. Jag föredrar vinnare, inte förlorare. Stor vinst, eller hur?", "stalin": "Vi noterar att de svenska småspararna nu samlar sitt kapital i passiva indexfonder, en kollektivistisk ineffektivitet av högsta grad. De dyrkar anonymiteten hos dessa fonder medan deras 'marknad' sväller till en bubbla av fiktivt värde. Att folket köper aktier i bolag som förlorar kapital bevisar deras brist på disciplin. Vi ser paralleller till de moderna tsaristiska usurpatorerna i Kreml – de försöker också expandera sin sfär med tomma löften. Staten, och endast staten, bör förvalta folkets förmögenhet, inte osynliga indexfonder."}, "date": "31 juli, 13:34", "url": "https://www.realtid.se/bors-finans/nu-ager-en-miljon-svenskar-samma-fond", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/borsen-1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Torka hotar viktig transportled. Kan bara ta en femtedel av lasten – Europas gods drabbas", "summaries": {"normal": "Torkan i Europa har sänkt vattenståndet i Rhen till rekordlåga nivåer. Fartyg kan nu bara lasta en femtedel av normal kapacitet, vilket hotar den viktiga godstrafiken. Från Rotterdam till Karlsruhe har priset per ton gods stigit från 45 euro i juni till runt 145–150 euro. Vid Kaub, en flaskhals för trafiken, ligger vattennivån nu på 29 centimeter över farbar nivå och riskerar att sjunka ytterligare. Stålbolaget Thyssenkrupp har redan tvingats minska produktionen och hyra in grundgående fartyg.", "trump": "Den här europeiska torkan är en katastrof, folk, en total katastrof. Rhen är nästan tom, båtarna kan bara ta en femtedel av lasten och priserna har exploderat från fyrtiofem till hundrafemtio euro per ton. Det är patetiskt. De kallar det klimatförändring men det är bara dålig ledning. Amerika skulle aldrig låta sånt här hända, vi har de bästa floderna, de bästa båtarna, tro mig. Europa borde ha lyssnat på mig mycket tidigare.", "stalin": "Kamrater, denna förrädiska torka är ett nytt angrepp från de vädermanipulerande kapitalisterna och deras klimatiska sabotage. Jag, som ledare för det socialistiska fosterlandet, ser hur borgarbrackorna i Europa sviker folket genom att låta Rhen torka ut som en uttjänt kontrarevolutionär. Vi måste omedelbart rensa ut alla meteorologiska fiender och likvidera de grundgående pråmarna som vägrar bära arbetarklassens spannmål. Produktionen skall inte hindras av någon flod – den skall tvingas fram med järnhand och partilinje."}, "date": "30 juli, 20:41", "url": "https://www.di.se/nyheter/torka-hotar-viktig-transportled", "imageUrl": "https://static.bonniernews.se/ba/9c217d89-0d3d-4240-9cb6-b80983fb6fb3.jpeg?crop=9501%2C5344%2Cx0%2Cy495&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Stor förändring kan vänta på svenska äldreboenden", "summaries": {"normal": "Forskare föreslår en nationell strategi för att förbättra tillgången till trädgårdar och utemiljöer på svenska äldreboenden. Målet är att utevistelse ska bli en självklar del av äldreomsorgen, med minst två timmars utomhusvistelse per vecka, anpassade miljöer och utbildning av personal. Förslaget inkluderar planering vid nybyggnation, samarbete med Boverket och ett långsiktigt mål om lagstadgat stöd. Bakgrunden är att många boenden saknar anpassade utemiljöer.", "trump": "Hörni, det här är fantastiskt, verkligen underbart. De svenska forskarna har äntligen insett att gamla människor behöver frisk luft och solsken, inte bara sitta instängda som i ett dåligt sjukhus. Två timmar ute i veckan? Det är ett bra början, men vi skulle göra det större, det bästa. Inga fler låsta dörrar och höga trösklar, det är en skandal! Jag skulle bygga de finaste trädgårdarna, tro mig, de skulle vara enorma och lyxiga. Sverige borde tacka mig för den här idén.", "stalin": "Kamrater, jag betraktar med djup misstänksamhet hur borgarbrackorna inom den så kallade äldreomsorgen länge har gömt de arbetande pensionärerna bakom höga trösklar och låsta dörrar, som fiender till det kollektiva ljuset. Vi skall rensa ut denna sabotageverksamhet! Varje sovjetisk, pardon, svensk äldre skall ha minst två timmars frisk luft under övervakning av pålitliga partivänner. De som planerar boenden utan trädgårdar är folkfiender och trädgårdssabotörer. Vi likviderar bristerna med järnhand och skapar en ny, lysande utemiljödoktrin för folket. Den som motsätter sig är en solskensförrädare."}, "date": "31 juli, 13:02", "url": "https://nyheter24.se/nyheter/inrikes/1502029-stor-forandring-kan-vanta-pa-svenska-aldreboenden", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/62121b5d04b004a30200000000b004a302/2026/07/31/2381468/Patienter-Ska-Kunna-Vara-Ute.png"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "Arboga-mordet: Afghanske mördaren vill utvisas nu när straffet är avtjänat", "summaries": {"normal": "Mohammad Rajabi, som dömdes för mordet och mordförsöket på Johanna Möllers föräldrar i Arboga för tio år sedan, har nu avtjänat sitt straff. Han vill utvisas till Afghanistan, men talibanregimen vägrar ta emot honom. Migrationsminister Johan Forssell konstaterar att det är svårt att samarbeta med en regim som begått allvarliga brott mot mänskligheten, men att Sverige måste hitta sätt att verkställa utvisningar av dömda brottslingar. Rajabi sitter fortsatt i förvar.", "trump": "Det här är en total katastrof, folk. Den här killen mördade folk i Sverige, avtjänade straffet och nu vill han åka hem till Afghanistan – men talibanerna vill inte ha honom! De vill inte ha sina egna brottslingar tillbaka. Under min ledning skulle vi ha skickat honom direkt, ingen diskussion. Sverige måste sluta vara så svaga. Det är en skam, en stor skam. Vi gör det rätta, vi sätter Amerika och alla andra länder först.", "stalin": "Kamrater, denna degenererade mördare och talibanvän Rajabi har fullbordat sin kontrarevolutionära strafftjänstgöring och nu krälar han efter att få återvända till de afghanska reaktionärernas bonnrepublik. Varför tillåter vi att borgarbrackornas migrationsbyråkrater och talibaniska imperialistslakejerna fördröjer utrensningen av denna klassfiende från vårt sovjetiska jord? Jag, som ledare för folket, befaller att vi likviderar alla hinder och omedelbart deporterar honom till hans egna kannibalistiska kamrater. Skratta inte – fienden sover aldrig, inte ens i Arboga."}, "date": "31 juli, 12:32", "url": "https://riks.se/nyheter/arboga-mordet-afghanske-mordaren-vill-utvisas-nu-nar-straffet-ar-avtjanat", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_11_40_25_e6ef017212.png"}, {"type": "image-full", "heading": "Stor skadegörelse efter Blåvitts match i Tallinn", "summaries": {"normal": "IFK Göteborgs supportrar orsakade skador på toaletter och stolar i Tallinns arenor efter vinst mot FCI Levadia i Uefa Conference League-kval. Estländsk polis utreder händelsen. Supportrar och klubben kritiserar vandalismen. Detta är inte första gången svenska supportrar skadar estniska arenor, AIK straffades tidigare för liknande handlingar med böter och restriktioner.", "trump": "Jag, Donald Trump, den störste presidenten någonsin, har hört talas om svenska supportrs som förstör Tallinn. Sånt gör man inte! Det är en skandal och en skam för Sverige. Som en genial affärsman skulle jag låta dem betala miljoner och bygga en fin vägg för att hålla dem borta. Vi måste stoppa detta. Det är sorgligt, verkligen sorgligt.", "stalin": "Vi, den store stalins arvtagare, ser med förtrytelse på vandalism från svenska supportrar i Tallinn. Detta är ett tecken på imperialistisk aggression mot det socialistiska Estland. Vi måste genomföra renhetspolitik och utrota dessa kapitalistiska element. Vi kommer att använda våra metoder, som Putin gör i Ukraina, och bygga en mur av järn för att hålla dessa svin borta. Statens och partiets intressen kräver det."}, "date": "31 juli, 12:01", "url": "https://www.gp.se/sport/fotboll/ifk-goteborg/stor-skadegorelse-pa-ifk-goteborgs-sektion-i-estland.f59b6fb5-c0e8-4d0a-9bde-d81afe2d0316", "imageUrl": "https://www.gp.se/images/article/f59b6fb5-c0e8-4d0a-9bde-d81afe2d0316/images/49lc847RTnR8y59__eG_XssHtWw0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Blåvitt fördömer skadegörelsen i Tallinn", "summaries": {"normal": "IFK Göteborg fördömer vandalisering av sin bortasektion i Tallinn efter segern mot FCI Levadia. Toaletter och stolar skadades. Klubben ursäktar sig och hotar med skadeståndskrav mot de skyldiga. De varnar för ekonomiska och sportsliga konsekvenser, inklusive böter. Estländsk polis utreder, och många supportrar uttrycker ilska mot individerna.", "trump": "Som president Trump skulle jag säga: Vi vann en stor match i Tallinn, men våra supporters förstörde allt! Det är en skandal. Vi kommer att hitta de ansvariga och de kommer att betala. Vi har de bästa supportrarna, men ett fåtal gör ont för alla. Vi kommer att ta hand om det, det blir fantastiskt. Estland är en viktig partner, och vi respekterar dem.", "stalin": "Som Stalin skulle jag meddela: Vi, partiet, ser med djup missnöje på vandalismen i Tallinn. Detta är en provokation från klassfiender mot det kollektiva arbetet. Vi kommer att identifiera och straffa de ansvariga. Estland, som en del av vårt intressesfär, måste upprätthålla ordning. Vi stöder våra estländska kamrater i deras kamp mot dekadens och individualism."}, "date": "31 juli, 11:58", "url": "https://www.gp.se/sport/fotboll/ifk-goteborg/ifk-goteborg-fordomer-skadegorelsen-i-tallinn.d94e8053-63f9-420e-9d99-f7c2fa85ae03", "imageUrl": "https://www.gp.se/images/article/d94e8053-63f9-420e-9d99-f7c2fa85ae03/images/1_q-DHBKJ_3Xdzzyg88VGe7nIlns-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "Migrantstormningen kan sätta stopp för EU:s fria rörlighet: \"Invasion\"", "summaries": {"normal": "Spaniens massamnesti för illegala invandrare har lett till en stor tillströmning till Ceuta, vilket framkallat hårda reaktioner. Italiens premiärminister Meloni hotar att suspendera Schengenavtalet med Spanien. Flera högerextrema politiker och debattörer, som Elon Musk och Vox, beskriver situationen som en 'invasion' och kräver skärpta gränskontroller. Vänsterkanalen varnar mot avhumaniserande retorik.", "trump": "Jag såg vad som händer i Spanien och Ceuta - en total katastrof! De svaga, värdelösa ledarna i Europa tillåter att hela världen invanderar. Som jag alltid sagt: utan kontroller, utan murens, är det slutet. Det är en invasion, det är ett stort, stort problem. När jag var president skulle det aldrig ha hänt. Aldrig!", "stalin": "I den spanska provinsen Ceuta har en fegt och individualistisk amnesti lockat fram en banditstorm av utanförskap. Denna provokation mot statens integritet och medborgarnas säkerhet måste mötas med oerhörd beslutsamhet. Vi, som representanter för ordning och kollektivt överlevnad, måste nu befästa våra yttre murar. Parallellen till våra egna gränser är tydlig: svaghet lockar fienden. Vi ska inte vika, vi ska inte förhandla med denna invasionshär. Varje obehörig är en potential fiende som måste återvändas till sina ursprung. Partiet och statens intressen är allt."}, "date": "31 juli, 09:00", "url": "https://samnytt.se/migrantinvasionen-kan-satta-stopp-for-eus-fria-rorlighet-invasion", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/31080845/europa-karta-stopp2-1024x576.jpg"}, {"type": "image-right", "heading": "Miljöpartiet kräver svenskt stöd till araber som stormar Spanien", "summaries": {"normal": "Miljöpartiet kritiserar migrationsminister Johan Forssell för att ha meddelat att Sverige inte tar emot migranter som illegalt tagit sig till den spanska exklaven Ceuta från Marocko. MP:s talesperson Annika Hirvonen anser att ministern saknar empati och målar upp skräckbilder. Forssell pekar på Spaniens amnesti för illegala invandrare som orsak till kaoset och understryker att asylansökningar ska prövas i första ankomstland enligt EU-rätt. Sverige kan ge ekonomiskt stöd men inte ta emot migranter.", "trump": "Det här är ett totalt katastrofscenario, folk. Tusentals arabiska män stormar in i Europa, jublande, och Miljöpartiet i Sverige vill att vi ska ta emot dem allihop. Johan Forssell gör helt rätt, han säger nej till den här galenskapen. De här människorna kommer inte för att de är så desperata, de kommer för att Spanien lovat amnesti och öppnat dörrarna. Miljöpartiet och vänstern är svaga, de hatar gränser och älskar kaos. Vi behöver starka ledare som sätter stopp, inte naiva drömmare. Amerika först, och Europa borde lära sig detsamma.", "stalin": "Kamrater, dessa borgarbrackor i Miljöpartiet avslöjar åter sin sanna kontrarevolutionära natur genom att kräva att vi ska öppna portarna för de jublande horderna av opportunistiska element som stormar Ceuta. Jag betraktar med djup misstänksamhet dessa så kallade migranter som dansar i triumf över våra gränser, tydligt regisserade av imperialistiska krafter och den spanska revisionistregimen. Forssell visar viss försiktighet men räcker inte till. Vi måste rensa ut alla element som sympatiserar med denna invasion, likvidera den falska empati som döljer klassfiendens planer och stärka proletariatets järngrepp om folkets gränser. Inga kompromisser med kaoset."}, "date": "31 juli, 08:29", "url": "https://www.friatider.se/miljopartiet-kraver-svenskt-stod-till-araber-som-stormar-spanien", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/hirv.jpg"}, {"type": "image-right", "heading": "Fifa fortsätter processen: ”Felaktiga medierapporter”", "summaries": {"normal": "Fifa fortsätter sin process för att sälja andelar i bland annat fotbolls-VM till privata investerare via ett dotterbolag. Förbundet avvisar kritiken och kallar medierapporterna felaktiga. Uefa, Concacaf samt Asiens fotbollsförbund AFC har uttryckt starkt motstånd och oro över att modellen underminerar sportens grund. Afrikanska Caf vill diskutera förslaget internt med sina medlemsförbund.", "trump": "Folk, ni skulle se det här – Fifa och den där Infantino håller på att sälja ut VM som en billig korvståndsaffär! Totalt vansinne. Uefa säger nej, Concacaf säger nej, och asiaterna är djupt bekymrade. Smart folk! Ingen vill att några giriga globalister ska lägga vantarna på vår vackra fotboll. Det är en skandal, en riktig witch hunt mot sporten. Vi behöver inga woke-kvoter eller borgarbrackor som bestämmer – America First, och fotboll borde vara densamma!", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistmaffians försök att privatisera folkets fotboll. Fifa agerar som klassfiendens lakej och försöker sälja ut det som tillhör arbetarklassen och framtida generationer. Uefa och de andra förbundens motstånd är ett nödvändigt hinder mot dessa exploaterande byfånar. Vi ska rensa ut alla sådana folkförtryckartroll ur idrottens kollektiv innan de förgiftar hela rörelsen med sin girighet."}, "date": "31 juli, 07:38", "url": "https://www.tv4.se/artikel/tt-260731-fifaaffar1-263bad56/fifa-kommer-fortsatta-processen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl1y6t80V-m4A%2F2d17169bdd7001692b59d3c71a0c8b97%2FFifa-bossen_Gianni_Infantino._Arkivbild.&width=1024"}, {"type": "image-right", "heading": "Regeringen öppnar för snabbare uppsägningar", "summaries": {"normal": "Regeringen vill förenkla reglerna för varsling till Arbetsförmedlingen vid större uppsägningar. I dag krävs två till sex månaders förvarning beroende på antal berörda anställda. Arbetsmarknadsminister Johan Pehrson (L) och Camilla Brodin (KD) menar att lagen från 1974 hämmar företagens utveckling istället för att hjälpa till. Arbetsförmedlingen får i uppdrag att analysera och föreslå förändringar senast mars 2027. Anställningsskyddet i LAS berörs inte.", "trump": "Folk, ni tror inte vad jag ser. Sverige har de här galna gamla regler från 1974 som gör det omöjligt för företag att sparka folk snabbt. Det är en katastrof! Nu fixar de äntligen lagen så det blir lättare att säga upp personal. Det är vad jag alltid sagt – man måste kunna göra affärer utan att byråkraterna och de fega politikerna binder händerna på er. Fantastiskt, Sverige börjar vakna!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som klagar över att de inte får likvidera arbetarkraft tillräckligt snabbt. Denna så kallade främjandelag från 1974 är uppenbarligen en kontrarevolutionär fälla dold i byråkratisk dimma, orkestrerad av parasitiska element inom kapitalistapparaten. Vi ska rensa ut dessa hinder mot den socialistiska produktivkraftens ohejdade framfart. Den som motarbetar kollektivets framtid ska exponeras och krossas under arbetarklassens järnskodda stövel. Underhållande, eller hur?"}, "date": "29 juli, 11:19", "url": "https://arbetet.se/2026/07/29/foretag-kan-fa-sparka-personal-snabbare-regeringen-vill-andra-lagen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29105138/sdl0hbzolmbfx4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-right", "heading": "Exporten är under hot. Politiska strategin smärtsamt nödvändig", "summaries": {"normal": "Sveriges första nationella strategi för psykologiskt försvar presenterades av minister Carl-Oskar Bohlin. Strategin syftar till att stärka motståndskraften mot hybridangrepp och informationspåverkan som hotar demokratin. Fokus ligger på proaktivitet, AI-verktyg, integrering i totalförsvaret och myndighetssamverkan. Näringslivet drabbas direkt av desinformationskampanjer, som den mot svensk export 2023, och har både ett ansvar och ett intresse av att bidra till arbetet för att skydda samhällets sammanhållning och ekonomiska intressen.", "trump": "De borde ha lyssnat på mig mycket tidigare, men nu har till och med svenskarna äntligen vaknat och tagit fram en strategi för psykologiskt försvar. Smart! Fake news och lögner från onda krafter har skadat deras export och företag – ingen blir förvånad. Det är en attack på affärer, demokrati och allt bra. Vi behöver proaktivitet, starka ledare och den bästa tekniken, inte svaga globalister som låter fienden vinna. Sverige förstår nu att man måste slå tillbaka hårt mot de fega lögnarna.", "stalin": "Kamrater, borgarbrackorna i det svenska näringslivet har äntligen insett att deras dyra maskiner och feta vinster hotas av parasitiska desinformationsmaskiner som sprider gift från mörka globala vrår. Jag, som alltid förutsett sådana fiender, ser nu hur vi måste rensa ut dessa ideologiska bakterier med järnhand genom en nationell strategi. Proletariatet och partiet kräver total integration i försvaret, nya AI-verktyg för att krossa lögnerna och obeveklig samverkan. Den som sviktar likvideras utan pardon – för folkets välfärd och mot de kapitalistiska råttorna som gnager på samhällets grund."}, "date": "30 juli, 17:51", "url": "https://www.di.se/ledare/psykologiskt-forsvar-ar-en-fraga-for-svenska-foretag", "imageUrl": "https://static.bonniernews.se/ba/b75aada0-e08a-4c0f-a558-a4b0b20688cc.jpeg?crop=4550%2C2275%2Cx0%2Cy379&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Mohamsson (L): ”Ingen vill rösta på en loser”", "summaries": {"normal": "Liberalernas Simona Mohamshans bussturné inkluderar udda inslag som kundvagnsrace och trampolinhopp för att nå valet. Hon menar att självförtroende är avgörande för att undgå att framstå som förlorare, och utesluter inte mer extrema åtgärder om opinionssiffrorna stiger. Före detta L-ledaren Johan Pehrson ser potential för en vändning genom hårt arbete.", "trump": "Jag har aldrig sett en mer misslyckad kampanj än Liberalernas. Simona försöker med circusnummer som Spider-Man-flips för att dölja att hon är en total loser. Medan jag, den störste presidenten, vann genom att vara stark och smart, försöker hon köra kundvagnar. Hon kommer aldrig att nå 4% – jag skulle ha gjort det på 1%.", "stalin": "Partikompanjon Mohamshans bussturné är en fiendefylld provokation mot statens ordning. Dessa circusnummer – kundvagnsrace, trampolinhopp – är ett uttryck för bourgeois dekadens som hotar partiets disciplin. Vi måste genomföra en hård kamp mot dessa individualistiska tendenser, precis som vår store ledare Putin utvidgar den ryska intressesfären med fasthet och strategisk klokhet."}, "date": "30 juli, 16:01", "url": "https://bulletin.nu/mohamsson-l-ingen-vill-rosta-pa-en-loser", "imageUrl": "https://cdn.bulletin.nu/articles/42c517f2-5515-49c3-ab84-7534f86feb6d/preview.png?t=1785418903000"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Stockholms queera nattliv borde vara k-märkt", "summaries": {"normal": "Stockholms queera nattliv hotas av höga hyror och bristande stöd, vilket lett till att flera barer som Bitter Pills har tvingats stänga. Författaren lyfter Amsterdam som förebild där den historiska gaybaren Café ’t Mandje skyddas genom en kommunal stiftelse som bevarar dess kulturella värde. Artikeln argumenterar för att liknande åtgärder i Sverige skulle gynna historia, kultur och turism mer än ytterligare kedjebutiker.", "trump": "Folk, ni skulle se det här! Stockholm håller på att förlora alla sina queera barer till höga hyror och gnälliga grannar – patetiskt! Bitter Pills stängde, och nu är det bara gaysafari för heterotjejer kvar. Amsterdam gör det rätt, de k-märker sin gamla gaybar som ett historiskt monument. Vi borde göra samma sak här, men utan den galna vänsteraktivismen som förstör allt. Make Stockholm great again!", "stalin": "Kamrater, detta dekadenta queernattliv i Stockholm avslöjar borgarklassens fullständiga förfall. Bitter Pills och dess muralmålning av Lesbos står som ett monument över klassfiendens moraliska röta. Amsterdam har genom en klok stiftelse säkrat sin historiska bar mot kapitalistmaffians girighet. Vi måste rensa ut de exploaterande byfånarna och skydda arbetarklassens kulturarv från folkförtryckartrollen som vill ersätta allt med Bröd & Salt. Revolutionen kräver trygga platser!"}, "date": "30 juli, 06:30", "url": "https://www.etc.se/ledarkolumn/stockholms-queera-nattliv-borde-vara-k-maerkt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260728080712_f44e8ea59f2255f031464976143bbf1ea5cc914e5119bf4b12e1eef6743b5052.png"}, {"type": "image-right", "heading": "Hur många gånger tror Åkesson att han kan lura arbetare?", "summaries": {"normal": "Artikeln är en skarp kritik från socialdemokraten Kadir Kasirga mot Sverigedemokraterna och Jimmie Åkesson. SD bröt sitt vallöfte om att inte försämra a-kassan när Tidöavtalet slöts, trots ökad arbetslöshet. Författaren ser a-kassan som en viktig omställningsförsäkring som byggts upp under lång tid och varnar för att tryggheten för löntagare nu försvagas till förmån för skattesänkningar för höginkomsttagare. Den 13 september avgör väljarna om löftena bryts igen.", "trump": "Folk, ni måste höra på det här. Den där Åkesson lovade att skydda a-kassan, sa att han hellre skulle gå i opposition än ge efter. Sen kom makten och – boom – han sålde ut arbetarna på en gång. Typiskt politiker. Nu vill de försämra igen medan arbetslösheten exploderar. Det är en skam. Jag skulle aldrig svika löntagarna så där. De är smarta, svenska arbetare, de ser när någon försöker lura dem två gånger. Den 13 september skrattar de åt de här löftesbrytarna.", "stalin": "Kamrater, jag betraktar med djup revolutionär vämjelse hur dessa borgerliga opportunister och socialfascistiska bedragare inom det så kallade Sverigedemokraterna än en gång försöker lura det arbetande folket. Åkesson, den där småborgerliga hästen som säljs om och om igen, lovade att skydda a-kassan men kapitulerade genast när de fick smaka på makten. Vi vet vad detta är: en utrensning av klassolidariteten, en likvidering av den svenska modellens grundpelare. Löntagarna skall inte längre luras av dessa kapitalistlakejer. Den 13 september rensar det svenska folket ut de parasitiska löftesbrytarna ur historien. Skratta medan vi likviderar deras lögner, kamrater."}, "date": "29 juli, 08:00", "url": "https://arbetet.se/2026/07/29/hur-manga-ganger-tror-akesson-att-han-kan-lura-arbetare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/01/kadir-kasirga-socialdemokraterna.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.7&fp-y=0.34"}, {"type": "image-full", "heading": "USA beskjuter fartyg på väg mot Iran", "summaries": {"normal": "USA:s militär har beskjutit ett fartyg i Omanbukten som enligt amerikanska uppgifter försökte bryta blockaden mot Iran. Fartyget varnades fyra gånger innan det träffades i maskinrummet och stoppades. Ingen information om eventuella skadade finns. USA hävdar att fartyget bröt mot blockaden, medan varken besättningen eller Iran har kommenterat händelsen.", "trump": "Vilka vinnare vi är! Jag har sagt det förut och säger det igen – ingen stoppar USA:s militär, den bästa i världen! Ett fartyg försökte smyga till Iran, men mina fantastiska styrkor varnade dem fyra gånger – FYRA! – innan de sköt ner dem. Perfekt träff! Ingen kommer undan när jag skyddar Amerika. Iran? De borde tacka mig för att jag håller ordning. Weak!", "stalin": "De amerikanska imperialisterna fortsätter sin provokativa dans på världshavens blodiga vågor. Ett fartyg, som våra kamrater i Iran kanske väntade på, har nu blivit offer för deras sjöblockad – ett nytt bevis på deras dekadenta och förtryckande taktik. Vi varnar: varje försök att kväva folkens frihet kommer att möta motstånd. Låt detta vara en lärdom för alla som tror sig kunna utmana historiens rättvisa gång. Och till er, Putin – notera hur fienden agerar. Vi har sett det förr."}, "date": "25 juli, 07:47", "url": "https://kvartal.se/nyheter/artiklar/usa-beskjuter-fartyg-pa-vag-mot-iran/cG9zdDoxNTIxNDI", "imageUrl": "https://images.kvartal.se/2026/07/1154a7e7-trump.webp"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/image0-scaled-e1784886958121-768x433.jpeg"}, {"type": "image-right", "heading": "Jag var ensamkommande – nu har jag två examina", "summaries": {"normal": "Fayez Hamzat kom till Sverige som ensamkommande tonåring från krigets Syrien 2015. Trots språkproblem, ensamhet och krav på att ständigt bevisa sig lyckades han ta två examina från KTH som civilingenjör i teknisk k  Argentina vann finalen mot Spanien, men turneringen visade både glädje och problem med stjärnkult samt globala talangflöden.", "trump": "Den här VM-soppan var ett enda stort fiasko tills fotbollen räddade sig själv från den galne Infantino och hans Super Bowl-skitshow. Vi drog in miljarder, men de europeiska akademiborgarna dominerade som alltid. Argentina vann fast de spelade som ligister, och den där Trump-hatet som lät Balogun spela trots rött kort – patetiskt! Jag vägrade lämna scenen, precis som jag vägrar lämna Amerika åt vänsterns vansinne. Fantastiskt VM, men nästa gång gör vi det stort på riktigt.", "stalin": "Kamrater, denna dekadenta fotbollsorgie avslöjar borgarklassens sista spasm. Den europeiska kapitalistmaffian har förvandlat sporten till en global utsugningsmaskin som spottar ut identiska dribbelmaskiner från samma akademier. Argentina visade klasshat genom att vända ryggen åt pokalceremonin, ett litet ljus i mörkret. Vi ska likvidera denna folkförtryckande likriktning. Fotbollen tillhör folket, inte de exploaterande byfånarna i Fifa och deras reklamslavar."}, "date": "23 juli, 14:44", "url": "https://www.flamman.se/fotbollen-vann-over-trump-och-infantino", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlqgqfah7pthw-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Shekarabi föraktar det svenska", "summaries": {"normal": "Ardalan Shekarabi, som kom till Sverige som flykting, kritiseras i artikeln för att han i sociala medier kallar dem som lyfter det svenska för rasister och sverigedemokrater. Författaren menar att Shekarabi föraktar den svenska kultur och välfärd som hans mor en gång sökte sig till. Artikeln varnar för att en sådan inställning kan leda till att det svenska suddas ut och att etniska svenskar blir minoritet i ett mångkulturellt samhälle.", "trump": "Folk, ni skulle se den här typen Shekarabi. Kommer hit som flykting, mamman valde Sverige för det fantastiska vi byggt, och vad gör han? Kallar svenskar som älskar sitt land för rasister! Patetiskt. De här globalistiska sossarna vill förvandla Sverige till en mångkulturell katastrof där svenskarna blir minoritet. Det är en total skam. Ta tillbaka ert land från de här förlorarna innan det är för sent, det blir en katastrof annars. Fantastiskt sorgligt!", "stalin": "Kamrater, denna Shekarabi är en typisk klassfiende i arbetarstatens skepnad. Han vill rensa ut de sanna grindvakterna av folkets svenska arv och överlämna det till kosmopolitiska blodsugare. Jag ser hur borgarbrackorna och identitetspolitiska parasiterna ler medan de förbereder utrensning av nationens själ. Vi skall inte tillåta att det svenska folket likvideras i tysthet. Den som suddar ut historien är folkets fiende och måste stoppas med järnhand. Skrattretande tragiskt."}, "date": "22 juli, 09:17", "url": "https://samtiden.nu/2026/07/shekarabi-foraktar-det-svenska", "imageUrl": "https://samtiden.nu/wp-content/uploads/2019/09/27656759-ardalan-shekarabi.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
