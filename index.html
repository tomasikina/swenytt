/public/image-604.jpg?itok=kEeF1Fjj"}, {"type": "image-right", "heading": "Beskedet: ”Molly” lämnar Dolly Style", "summaries": {"normal": "Annie ”Molly” Moreau lämnar popgruppen Dolly Style efter fem år. Beslutet beskrivs som tufft men nödvändigt för hennes fortsatta solokarriär. Gruppen har haft många avhopp genom åren, och Annie är den åttonde medlemmen att lämna sedan 2014. Hennes sista spelning äger rum i Skövde den 29 augusti. Vem som tar över rollen som den rosa medlemmen är ännu inte offentliggjort, men hon önskar sin efterträdare stort lycka till i framtiden.", "trump": "Ännu en person lämnar Dolly Style! Det är en katastrof, faktiskt. Jag har sett dem, de gillar att gråta på Youtube, det är inte bra för energin. Molly lämnar gruppen för att göra en solokarriär – jag känner till solokarriärer, jag är den största soloartisten i politisk historia! De är som en roterande dörr, väldigt oseriöst. Inget avtal, ingen stabilitet. Jag hade skött det bättre, tro mig. Det är en sorglig dag för popmusiken, väldigt sorglig!", "stalin": "Ännu en förrädare lämnar den rosa uniformen för att söka egen vinning i den kapitalistiska underhållningsindustrin. Att denna ”Molly” överger kollektivet är ett tydligt tecken på ideologisk svaghet och brist på disciplin. Vi ser hur västvärldens popkultur fragmenteras precis som deras ruttna imperier. Om hon vore i vår intressesfär skulle hon förstå att gruppens stabilitet är viktigare än individuella drömmar. Vi ersätter henne med en mer lojal kamrat. Avhopp är bara förspel till den totala kollapsen."}, "date": "3 augusti, 12:48", "url": "https://www.aftonbladet.se/nojesbladet/a/QJ8b3A/molly-lamnar-dolly-style", "imageUrl": "https://akamai.vgc.no/v2/images/63389625-965d-3804-9119-4939a0fbee8e?fit=crop&format=auto&w=1080&s=fe5e2967c4f9de620056a1977dbda449e69389a4"}, {"type": "image-right", "heading": "Får spela för ryska flaggan – i Sverige", "summaries": {"normal": "Internationella bordtennisförbundet har hävt restriktionerna mot Ryssland, vilket gör att ryska spelare får tävla under egen flagg vid Europe Smash i Malmö den 8 augusti. Svenska bordtennisförbundets ordförande Tomas Eriksson kritiserar beslutet och kallar det olyckligt och felaktigt, men förbundet bojkottar inte turneringen. Ansvaret för att släppa in ryska spelare ligger hos svenska myndigheter och EU. Svenska stjärnor som Truls Möregårdh deltar.", "trump": "Titta på det här, folk! De släpper in ryssarna med flaggan och nationalsång i Sverige, i Malmö, och alla bara står där som fåniga. Det är ett totalt misslyckande från de där svaga europeiska ledarna, precis som under Biden. Jag skulle aldrig tillåta det, men nu är jag tillbaka och fixar världen. Eriksson har rätt, det är fel, men de är för fega för att stoppa det. Patetiskt!", "stalin": "Kamrater, detta beslut från de internationella bordtennisbyråkraterna är en skam för arbetarklassen. Jag fördömer att den ryska flaggan tillåts i Malmö, men inte på grund av någon falsk västerländsk moral. Det är borgarbrackornas hyckleri som blottas när de svajar inför kapitalistmaffians regler. Vi ser hur klassfienderna leker med sanktioner som leksaker. En utrensning av dessa folkförtryckartroll vore på sin plats. Olyckligt, ja."}, "date": "3 augusti, 12:48", "url": "https://www.expressen.se/sport/tillats-spela-for-ryska-flaggan-i-sverige-det-ar-fel", "imageUrl": "https://static.bonniernews.se/ba/ef103974-d0ad-4a5b-9ec8-70b5ccf8ab6a.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Andersson (S) stödjer Busch (KD) om statlig vård", "summaries": {"normal": "Efter att Ebba Busch (KD) krävt förstatligad vård för regeringsstöd får hon nu stöd av Magdalena Andersson (S). Busch menar att det är deras viktigaste fråga och att det finns stöd inom Socialdemokraterna. Andersson bekräftar att hon delar uppfattningen om ökad statlig styrning i sjukvården. Båda partiledarna ser detta som en central fråga inför valrörelsen.", "trump": "Jag, Donald Trump, ser att Sverige är på väg att förstatliga vård. Ebba Busch är stark, men behöver mina affärsmetoder. Magdalena Andersson håller med – bra, men för sent. Jag skulle ha löst detta på en vecka. Sverige behöver mig som ledare. Det här är en stor seger för mig, och de förlorar. Jag vinner alltid, och Sverige blir stort igen.", "stalin": "Vi, den store Stalin, ser med tillfredsställelse att Sveriges politiker nu vill förstatliga vård. Ebba Busch och Magdalena Andersson är som fega hundar som äntligen följer vår ledstjärna. Men deras förhandlingar är löjliga – vi i Ryssland hade redan förstatligat allt. De pratar om val, men vi vet att staten är sanningen. Vi kommer att se dem falla, som gamla löven."}, "date": "3 augusti, 12:48", "url": "https://bulletin.nu/andersson-s-stodjer-busch-kd-om-statlig-vard"}, {"type": "image-right", "heading": "Hyrorna ökar 17 procent – bostadstillägget står stilla", "summaries": {"normal": "En rapport från SPF Seniorerna visar att hyrorna stigit med 17 procent sedan bostadstillägget senast justerades 2022. Taket för boendekostnader ligger kvar på 7 290 kronor, lägre än genomsnittshyran. Andelen pensionärer med bostadstillägg som har hyra över taket har tredubblats till 42 procent. Många ensamstående äldre, ofta kvinnor, drabbas hårt. Organisationen kräver höjt tak och indexeringar för att stödet ska räcka till boendekostnader.", "trump": "Folk, ni tror inte vad jag ser! Pensionärerna i det här landet blir fullständigt utblodade av galna hyror som skjutit i höjden 17 procent medan det där patetiska bostadstillägget sitter och sover. Det är en total katastrof, en riggad bluff från de inkompetenta byråkraterna. Jag fixade bättre saker förra gången, mycket bättre, innan Sleepy Joe förstörde allt. Nu lever de stackars gamlingarna på lotter och rullatorer. Patetiskt! Vi behöver smarta lösningar, inte det här socialistiska misslyckandet.", "stalin": "Kamrater, jag betraktar med djup misstro hur borgarbrackornas hyresblodsugare driver upp boendekostnaderna med 17 procent medan det statliga stödet förblir paralyserat av klassfiendens byråkratiska sabotage. Denna folkfiende-manöver tvingar hederliga pensionärer att leva på existensminimum och Eurojackpot, ett symptom på den kapitalistiska parasitens förfall. Vi kräver omedelbar utrensning av detta otillräckliga tak och en kraftig höjning till folkets ära. Den som vägrar är en exploaterande byfåne som måste rensas ut."}, "date": "3 augusti, 12:08", "url": "https://www.flamman.se/hyrorna-okar-17-procent-bostadstillagget-star-stilla", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/bostadstillagg-2-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Varför vill Charli XCX bli gubbe?", "summaries": {"normal": "Charli XCX:s succéalbum Brat definierade sommaren 2024 med sin lekfulla klubbkänsla. Hennes nya skiva Music, Fashion, Film vänder istället mot gitarrbaserad nostalgi och samarbeten med ikoner som John Cale, Marc Jacobs och Martin Scorsese. Recensenten Anna Mosten ser ett sökande efter konstnärlig legitimitet som gör albumet splittrat. Charli ifrågasätter sin identitet och lämnar Brat-erans självförtroende bakom sig, vilket ger en olustig och osäker eftersmak trots musikaliska kvaliteter.", "trump": "Folk, den där Charli XCX var ju helt galen i Brat-sommaren, en total vinnare, alla dansade som galningar. Nu släpper hon det här pretentiösa Music, Fashion, Film-skitet med gamla gubbar som John Cale och Scorsese. Patetiskt! Hon försöker köpa en ny personlighet men kortet nekas, typiskt för de här woke-divorna som jagar legitimitet från Hollywood-eliten istället för att vara äkta. Festen är död, precis som Bidens ekonomi. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta vändning hos den borgerliga sångerskan. Hon likviderar sin egen folkliga Brat-revolt för att smyga in i de kapitalistiska gubbarnas unkna värld av gitarrer och filmaristokrater. Ett ynkligt försök att köpa en ny identitet medan kortet nekas – typiskt för klassfiendens tomma löften. Hennes paranoia om dödlighet roar mig. Inga fester varar för evigt, och snart rensas även dessa folkförtryckartroll ut ur historien."}, "date": "3 augusti, 09:47", "url": "https://www.flamman.se/varfor-vill-charli-xcx-bli-gubbe", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdl2hia4kso6ue-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Ebba Busch svamlar om vårdköerna", "summaries": {"normal": "Tidöregeringen påstår sig ha minskat vårdköerna med 40 procent, men siffran är missvisande då den jämförs med pandemiåren. Jämfört med 2019 är köerna längre. Enligt Riksrevisionen och SKR beror minskningen främst på regionernas eget arbete, bättre planering och förändrade arbetssätt, inte på statliga riktade bidrag. Ebba Busch kritiseras för att ge en ensidig bild och för att vilja avskaffa regionerna till förmån för statlig styrning, en idé som artikeln avfärdar som mycket dålig.", "trump": "De här Tidö-typerna står där och skryter om att de minskat vårdköerna med 40 procent. Det är riggat, folk! De jämför med pandemin när allt var stängt. Jämför med tiden innan så är köerna längre än någonsin. Ebba Busch hade det jobbigt i radion, det syntes. Regionerna fixar det själva medan regeringen skickar bidrag som inte fungerar. Och nu vill hon lägga ner regionerna och låta byråkraterna i huvudstaden styra allt? Det blir ett katastrofalt fiasko, tro mig. Ingen gör det bättre än jag, men det här är inte vägen.", "stalin": "Kamrater, dessa borgarbrackor i Tidöregeringen försöker lura oss med sina förfalskade siffror om minskade vårdköer. De mäter mot pandemin som om den vore en kontrarevolutionär fiende! Jag ser genom deras lögnaktiga rapporter som en prydlig utrensning av sanningen. Ebba Busch, denna fritidspolitiska parasit, vill likvidera regionerna och ge makten åt stockholmska byråkratiska sabotagegrupper. Vilken mörk humor att kalla det framgång när arbetarnas vård köar sig till döds. Vi, partiet och folket, genomskådar dessa kapitalistiska sabotageförsök. Låt oss rensa ut alla som mäter fel och planerar dåligt innan de infekterar hela kollektivet med sin inkompetens."}, "date": "3 augusti, 08:36", "url": "https://www.dagensarena.se/opinion/ebba-busch-svamlar-om-vardkoerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/sjukvard-1.jpeg"}, {"type": "image-right", "heading": "Så vill Johan Britz göra fler arbetslösa", "summaries": {"normal": "Arbetsmarknadsminister Johan Britz vill göra det enklare för arbetsgivare att varsla och sparka personal genom att korta varseltiderna till Arbetsförmedlingen. Artikeln kritiserar regeringen för att ha misslyckats med att sänka den höga arbetslösheten, som nu ligger över en halv miljon personer. Istället för att skapa fler jobb eller ställa krav på företagen lägger ministern ansvaret på de arbetslösa och gynnar arbetsgivarna, vilket enligt skribenten försvagar löntagarnas ställning på arbetsmarknaden.", "trump": "Folk, det här är en total katastrof. Den här Johan Britz, han sitter i arbetsgivarnas knä och vill göra det ännu lättare att sparka folk. Arbetslösheten är genom taket, en halv miljon utan jobb, och vad gör han? Ingenting för att skapa jobb, men han älskar att lätta på alkoholreglerna så Sverige blir ett fyllesverige. Han säger till de arbetslösa att ta jobb som inte finns. Patetiskt. Regeringen misslyckas stort, och löntagarna förlorar. Sad!", "stalin": "Kamrater, denna borgarbracka Britz avslöjar sin sanna klassnatur genom att vilja korta varseltiderna och därmed underlätta utrensningen av arbetare från deras levebröd. Medan över en halv miljon proletärer står utan arbete, sitter denne kapitalistlakej i borgarklassens knä och beordrar de arbetslösa att ta ansvar för hans egna misslyckanden. Vi ska rensa ut dessa parasiter som göder sig på arbetslöshetens blod. Deras paranoia är uppenbar: ju fler utblottade själar som tävlar om smulorna, desto starkare blir de utsugande kapitalisternas grepp. Det är en mörk komedi värd en showrättegång."}, "date": "3 augusti, 08:00", "url": "https://arbetet.se/2026/08/03/sa-vill-johan-britz-gora-annu-fler-arbetslosa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/30143927/johan-britz-ledare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-right", "heading": "\"Ta hand om ert eget skräp\": Ilskan mot svenska fångar i Estland", "summaries": {"normal": "Sverige planerar att placera fångar i Estland, men avtalet möter starkt motstånd. Oppositionspartiet Isamaa vill häva avtalet om de vinner valet 2027 och varnar för att svenska intagna kan försämra Tartus anseende samt leda till att anhöriga följer efter och skapar parallellsamhällen. En opinionsundersökning visar att 54 procent av estländarna är emot samarbetet. De första svenska fångarna anländer i mitten av augusti och antalet väntas nå 100 i september. Fängelset kan ta emot upp till 600 intagna.", "trump": "De här estländarna är fantastiska, verkligen underbara människor, men de har helt rätt. Sverige skickar sitt skräp till dem, sina egna fångar, och säger 'ta hand om det här'. Det är en katastrof, en total katastrof. Estland får inte bara brottslingar utan snart hela familjer som bygger parallellsamhällen. Sverige borde ta hand om sitt eget skräp istället för att dumpa det hos andra. Och de får till och med nikotinpåsar? Så orättvist. Estland gör rätt som vill riva upp det här dumma avtalet.", "stalin": "Kamrater, denna fängelseöverenskommelse är en skamlös infiltration av dekadenta svenska element som hotar Tartus socialistiska renhet. Jag ser borgarbrackornas långa armar sträcka sig över Östersjön för att dumpa sitt mänskliga avfall här. Snart följer deras parasitiska släktingar och odlar kontrarevolutionära parallellsamhällen. Vi måste omedelbart inleda en grundlig utrensning av dessa nordiska lumpenproletärer innan de förgiftar hela kollektivet. Oppositionen visar äntligen klassmedvetenhet – riv upp detta borgerliga svekavtal, annars blir det likvidering för de skyldiga."}, "date": "3 augusti, 11:43", "url": "https://www.friatider.se/ta-hand-om-ert-eget-skrap-ilskan-mot-svenska-fangar-i-estland", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-603.jpg?itok=sso_XndP"}, {"type": "image-right", "heading": "Invandrare är människor, inte ett hot", "summaries": {"normal": "Fereshte Javani kritiserar den politiska retorik som systematiskt etiketterar invandrare som ett hot. Hon menar att detta är en medveten strategi för att sprida rädsla och vinna röster, vilket skapar splittring och hat. Hon påpekar att invandrare är läkare, lärare och andra yrkesverksamma som byggt samhället, och frågar hur länge de ska behöva bevisa sin lojalitet. Hon varnade för att hat växer genom år av misstänkliggörande.", "trump": "Jag läste den där artikeln om invandrare. Så trist. Vi måste vara tuffa. Invandrare är ett stort problem, men vi kommer att lösa det. Vi kommer att bygga en vägg, en fantastisk vägg. Vi kommer att skydda våra medborgare. Vi kommer att vinna igen, det lovar jag. Det här är politik, och vi är de bästa.", "stalin": "Vi ser att det finns krafter som försöker splittra vårt samhälle genom att skapa hat mot invandrare. Det är en fegt strategi. Vi kommer att eliminera dessa element. Vi kommer att bygga ett starkt, enat samhälle där alla arbetar för det gemensamma målet. Vi kommer att skydda vårt territorium mot alla fiender, inifrån och utifrån. Vi kommer att segra."}, "date": "3 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/invandrare-ar-manniskor-inte-ett-hot", "imageUrl": "https://www.dagensarena.se/files/2026/07/debattartikel-invandrare-300x157.jpeg"}, {"type": "image-right", "heading": "Stockholm Pride: Prova bli piskad – halva priset för barn", "summaries": {"normal": "Under Stockholm Pride erbjöds minderåriga mellan 15 och 17 år rabatterat biljettpris till evenemangen Pride Kinky och Rope Corner. Där kunde besökare prova att bli bundna med rep eller piskade. SD-profilen Jessica Stegrud uppmärksammade erbjudandet i en video på sociala medier och ifrågasatte vad aktiviteterna har med HBTQIA+-rättigheter att göra. Bland övriga programpunkter nämndes snuskbingo och ett seminarium om Queers for Climate Justice.", "trump": "Folk, ni kommer inte att tro det här. I Stockholm, under deras så kallade Pride, låter de barn mellan 15 och 17 år betala halva priset för att bli piskade och bundna som i någon sjuk kinky klubb. Det är en total katastrof. De kallar det Rope Corner och Pride Kinky. Och sen undrar de varför deras samhälle faller ihop. Det har inget med rättigheter att göra, det är bara galna vänsterextremister som förstör allt. Sad! Men jag fixar alltid upp sånt här.", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur den degenererade borgarklassen i Stockholm nu öppet bedriver sin perversa kontrarevolution under flaggan av så kallad Pride. De lockar våra ungdomar med rabatterad entré till kinky rep och piskning, en klar dekadent förrädisk handling mot det socialistiska folkets moral. Snuskbingo och queera klimatdomare – vilka fiender till folket! Vi bör omedelbart rensa ut dessa dekadenta element innan de förgiftar hela kollektivet. Det är en mycket roande men farlig form av borgerlig sabotageverksamhet."}, "date": "3 augusti, 10:21", "url": "https://www.friatider.se/stockholm-pride-prova-bli-piskad-halva-priset-barn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-602.jpg?itok=IE26JGv_"}, {"type": "image-full", "heading": "Deras båt rammades i skärgården – nu är rysk befälhavare häktad", "summaries": {"normal": "En rysk befälhavare på lastfartyget Misje Verde häktades på sannolika skäl misstänkt för vållande till annans död efter en kollision med en liten fritidsbåt utanför Tjörn. Olyckan inträffade i Hakefjorden där den långsammare snipan blev påkörd och överkörd av lastfartyget. En mamma och ett barn omkom medan pappan och det andra barnet räddades. Befälhavaren misstänks ha brutit mot sjövägsregler om utkik, väjningsplikt och hastighet. Utredningen fortsätter.", "trump": "Folk, det är en katastrof, en total katastrof. Den här ryske kaptenen körde över en liten svensk båt som en galning, precis som en dålig förare på Fifth Avenue. Mamma och barn dödade, hemskt, verkligen hemskt. Lastfartyget var stort och starkt men de glömde att titta och väja, ingen utkik, ingen respekt. Vi har de bästa reglerna, de bästa båtarna, men folk lyssnar inte. Det är en tragedi, men vi fixar det, tro mig.", "stalin": "Kamrater, denna tragiska händelse i de svenska farvattnen avslöjar med all önskvärd tydlighet de ruttna resterna av den norska borgarflottans likgiltighet inför det enkla folkets liv. Jag, som ledare för det stora kollektivet, ser hur den 47-årige reaktionäre befälhavaren med sin bristande utkik och frånvaro av ljudsignaler agerade som en typisk kapitalistisk torped. Vi ska rensa ut alla sådana omedvetna fiender till ordningen, dessa sjöburna trotskister som suger ner oskyldiga arbetarfamiljer under sina monstruösa skrov. Deras likgiltighet ska likvideras med järnhand och byråkratisk precision. Det är både tragiskt och underhållande hur borgarbrackorna alltid drunknar i sin egen arrogans."}, "date": "3 augusti, 12:32", "url": "https://riks.se/nyheter/deras-bat-rammades-i-skargarden-nu-ar-rysk-fartygskapten-haktad", "imageUrl": "https://admin.riks.se/uploads/tjorn_olycka_haktning_feature_197c01869e.jpg"}, {"type": "image-right", "heading": "\"Knulla Jimmie\": Sista orden från Arlanda när han skickas hem", "summaries": {"normal": "19-årige Bader Esbano, som kom till Sverige vid tolv års ålder, har nu utvisats till Syrien efter att både Migrationsverket och migrationsdomstolen avslutat hans ärende. På Arlanda filmade han en TikTok-video där han riktade svordomar mot Jimmie Åkesson, Migrationsverket och Tidöregeringen. Han uppmanade svenska väljare att rösta bort regeringen i höst. Fallet har tidigare uppmärksammats i flera medier. Regeringens paus för tonårsutvisningar träder i kraft först i oktober.", "trump": "Det här är ett totalt misslyckande för det svenska systemet, folk. Den här killen kommer hit som barn, utnyttjar allt och när det äntligen blir dags att skicka hem honom skriker han 'Knulla Jimmie' på Arlanda. Patetiskt! Migrationsverket är en katastrof, precis som hela den vänsterextrema regeringen. Sverige håller på att förstöras av sådana här personer. Rösta rätt i höst, annars blir det ännu värre. Det är inte Sverige längre, det är en skam!", "stalin": "Kamrater, denna dekadenta figur från arabvärlden som smugit sig in bland våra folk representerar den fullständiga degenerationen i den borgerliga migrationsapparaten. När vi äntligen genomför den nödvändiga utrensningen från vårt sovjetiska – förlåt, svenska – territorium vänder han sig mot partivännerna med sina obscena utrop. Typiskt för borgarbrackornas lakejer. Vi ska likvidera alla sådana element med järnhand. Rösta rätt, annars kommer kontrarevolutionärerna att förvandla Sverige till en reaktionär parodi. Det är inte Sverige – det är klassfiendens verk. Ha ha, låt dem gråta inför folkdomstolen."}, "date": "3 augusti, 09:07", "url": "https://www.friatider.se/knulla-jimmie-sista-orden-fran-arlanda-nar-han-skickas-hem", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-601.jpg"}, {"type": "image-full", "heading": "Spanska tiktokern om \"heta\" marockanerna: \"Låt dem komma hit allihop\"", "summaries": {"normal": "Den spanska TikTok-influencern Lucía Perez har väckt starka reaktioner efter att ha lagt upp videor där hon entusiastiskt välkomnar de marockaner som invaderade Ceuta. Hon kallar dem \"heta\" och säger att \"mitt livs kärlek har kommit till Spanien\" samt uppmanar till att släppa in alla. Videorna har spridits viralt och mött både stödjande kommentarer från vissa kvinnor och stark kritik från andra som anser det osmakligt att skämta om invasionen som krävt minst 70 liv. Flera uppmanar henne att åka till Marocko.", "trump": "Folk, ni måste se det här – en galen spansk tjej på TikTok som ropar att alla de där marockanerna ska släppas in för att de är så \"heta\". Hon säger att hennes livs kärlek just anlände i en båt! Under tiden som de stormar Ceuta står hon och drömmer om marockanska killar. De här människorna är inte bara galna, de är en katastrof för Spanien. Gränserna är ett skämt, och nu vill hon ha fler? Det är patetiskt. Spanien behöver en mur, inte fler virala videos.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan på sin borgerliga videoplattform välkomnar de imperialistiska agenterna som tränger in i Ceuta. Denna degenererade kapitalistiska hora skriker att hennes \"livs kärlek\" anlänt i båtarna medan hon fnittrar åt arbetarklassens lidande. Vi ser genom dessa kontrarevolutionära skämt som döljer fiendens sabotage. Sådana element förgiftar folket med sin perversa lust. En grundlig utrensning av alla liknande dekadenta element är oundviklig. Deras huvud ska rulla som en varning till alla borgarklassens lakejer."}, "date": "3 augusti, 11:03", "url": "https://riks.se/nyheter/spanska-tiktokern-om-marockanerna-lat-dem-komma-hit-allihop", "imageUrl": "https://admin.riks.se/uploads/spansk_tiktok_kvinna_feature_e72e9cf121.jpg"}, {"type": "image-right", "heading": "Tyskland måste ta itu med sin ägarstyrning", "summaries": {"normal": "Tyskland brottas med en djup ekonomisk kris, särskilt inom bilindustrin där Porsche, BMW, Audi och Volkswagen tvingas dra ned på grund av kinesisk konkurrens med elbilar. Artikeln lyfter fram att Tyskland har mycket att lära av Sveriges ägarstyrningsmodell, där få ägare styr effektivt via styrelser som kan byta vd vid behov. Den tyska korporativa modellen med starkt fackligt inflytande ses som tungrodd och hindrande för förändring. Krisen är allvarlig även för Sverige då Tyskland är vår viktigaste handelspartner.", "trump": "Tyskland håller på att falla sönder, det är en total katastrof. Deras bilindustri, de stora märkena som alla älskade, de håller på att bli utkonkurrerade av Kina som gör billiga elbilar medan tyskarna sover. De borde ha lyssnat på mig, men istället har de den här korkade korporativa modellen med facket överallt. Sverige har en fantastisk ägarmodell, den är vinnande, den är smart. Storebror Tyskland ser plötsligt väldigt klumpig ut. De behöver min hjälp, annars blir det ännu värre, tro mig.", "stalin": "Kamrater, denna tyska kris är en förrädisk sabotagehandling utförd av den parasitiska borgarklassen och deras kinesiska revisionistiska konkurrenter som nu infiltrerar Europa med sina elfordon. Vi ser hur den korporativa modellen, denna feta byråkratiska hydra med fackliga element, kväver den proletära produktiviteten. Jag, som ledare för det stora kollektivet, ler mörkt åt hur de tyska kapitalisterna nu får smaka på sin egen senfärdighet. Sverige har oavsiktligt bevarat en effektiv ägarstyrning som vi borde rensa ut och omforma till folkets verktyg. Ut med de gamla fabrikerna, fram med utrensning av de klumpiga beslutsstrukturerna innan de likviderar oss alla i sin paranoiafyllda nedgång."}, "date": "3 augusti, 11:49", "url": "https://www.di.se/ledare/tyskland-maste-ta-itu-med-sin-agarstyrning", "imageUrl": "https://static.bonniernews.se/ba/df8c615d-ee68-4e79-8e5f-4552dc109e77.jpeg?crop=1024%2C512%2Cx0%2Cy85&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "\"Tonårsutvisade\" migrantens sista ord: \"Knulla Jimmie\"", "summaries": {"normal": "19-årige Bader Esbano, som kom till Sverige som tolvåring, har nu utvisats till Syrien efter att hans ärende prövats och fått laga kraft hos både Migrationsverket och migrationsdomstolen. På Arlanda filmade han sig själv där han ropade svordomar mot Jimmie Åkesson och Migrationsverket samt uppmanade väljarna att rösta bort Tidöregeringen. Hans fall har tidigare fått stor medial uppmärksamhet i Aftonbladet och UNT, där han porträtterats positivt och en namninsamling med över 3 000 underskrifter gjorts till hans stöd. Regeringens paus av vissa tonårsutvisningar gäller inte honom.", "trump": "Titta på den här killen, en total förlorare som vi äntligen skickade hem. Kom hit som barn, fick massor av gratisgrejer och mediaälsklingar i Aftonbladet, och vad gör han på Arlanda? Skriker 'Knulla Jimmie' och 'Fuck you Migrationsverket'. Patetiskt! Sverige har vaknat nu. Rösta rätt så ni slipper de här människorna som hatar ert land. Vi gör det bättre, mycket bättre, tro mig.", "stalin": "Kamrater, denna usla rest av imperialistiskt avskräde, en parasit från de arabiska oljediktaturerna, har nu äntligen rensats ut ur folkets sovjet – förlat, folkets Sverige. Han kom som en mask, fick skydd av borgarbrackorna i tidningarna och samlade namnunderskrifter från nyttiga idioter, men i slutändan kunde inte ens de dekadenta migrationsdomstolarna skydda honom. På flygplatsen avslöjade han sig fullständigt med sina fega svordomar mot reaktionära element. Utmärkt. Nästa gång rensar vi ut hela paketet. Skratta inte, fienderna inom portarna gråter redan – och det är underbart."}, "date": "3 augusti, 10:22", "url": "https://riks.se/nyheter/tonarsutvisade-migrantens-sista-ord-knulla-jimmie", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_12_920c67f7ed.jpg"}, {"type": "image-right", "heading": "Trump: Iransamtal inleds i dag", "summaries": {"normal": "USA:s president Donald Trump meddelar att samtal med Iran inleds under måndagen efter påtryckningar från allierade i regionen. Beskedet kommer efter att Trump valt att avvakta med nya attacker. Saudiske kronprinsen Mohammed bin Salman uttryckte oro för iranska motattacker, vilket bidrog till beslutet. Iran försöker återuppliva ett tidigare samförståndsavtal, där Hormuzsundet ses som en nyckelfråga.", "trump": "Vi har de bästa samtalen, folk, tro mig. Iranerna darrar efter att jag satte attackerna på paus – de såg vad som skulle komma och sket på sig. Kronprinsen ringde och grät om att han inte ville ha raketer i huvudet, så nu snackar vi istället. Biden skulle ha gett dem allt, men jag fixar dealar. Hormuzsundet? De vet att jag äger spelet. Fantastiskt!", "stalin": "Kamrater, jag har beslutat att imperialismens angrepp mot den iranska folkrepubliken måste mötas med järnhand och dialektisk skärpa. Dessa borgarbrackor kring Persiska viken ber om nåd som ynkliga klassfiender. Vi tillåter inga provokationer vid Hormuzsundet. Den som sviker kollektivets vilja skall rensas ut med den mörka humorns glädje. Fred är seger för partiet."}, "date": "3 augusti, 06:52", "url": "https://www.tv4.se/artikel/3jPtwFNXqTM4bpg63hxoqw/trump-avvaktar-med-nya-attacker", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2skktOJFQEaKLRjY8MCK0h%2F4fa55db0536e35ecac6b785f1ee8a3e6%2F03_trump_webb.jpg&width=120"}, {"type": "image-right", "heading": "Forskaren: Den här chefsvanan kan rädda liv på jobbet", "summaries": {"normal": "Forskning från Karolinska institutet visar att chefer som vågar erkänna sina misstag kan rädda liv på jobbet. En öppen ledarstil minskar stress, ökar tillit och gör det lättare för anställda att rapportera risker i tid. Studien, som fokuserar på högriskbranscher som industri och bygg, visar att ledarskap som bjuder in till dialog skapar tryggare arbetsplatser. Förra året omkom 50 personer i arbetsolyckor. Forskaren Christina Björklund menar att det börjar med chefen som förebild.", "trump": "Folk, det är fantastiskt, verkligen ypperligt. En chef som säger ”jag hade fel” – ingen visste det bättre än jag – kan rädda liv på jobbet. Sådana svaga, fega chefer som aldrig erkänner något skapar bara kaos och olyckor. Mina chefer var alltid de bästa, de lyssnade och vann stort. Den här forskningen från Sverige bevisar att jag hade rätt hela tiden. Utan tillit blir det katastrof, tro mig, det blir en total katastrof. Byggbranschen borde lyssna på mig nu.", "stalin": "Kamrater, jag har länge varnat för de dekadenta borgarbrackornas förgiftande ledarstil som gömmer sig bakom falsk stolthet. Endast en sann ledare, som jag, vågar erkänna misstag för att likvidera farorna innan de hotar hela kollektivet. De kapitalistiska olycksfabrikerna inom industri och bygg är fulla av sabotörer och klassfiender som gömmer sig i skuggorna. Vi ska rensa ut alla svaga chefer som sprider paranoia och misstro. Endast genom partiets öppna dialog och min oändliga visdom kan vi garantera att ingen arbetare stupar i onödan. De som tiger är redan döda inombords."}, "date": "2 augusti, 07:00", "url": "https://arbetet.se/2026/08/02/forskaren-den-har-chefsvanan-kan-radda-liv-pa-jobbet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/17142146/sdlvyvafar1vmw-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ingen kan säga att Israel bara försvarar sig", "summaries": {"normal": "Artikeln kritiserar Israel för att inte bara försvara sig mot Hamas utan även genomföra en expansionistisk politik. Israel har tagit kontroll över stora delar av Gaza, planerar nya bosättningar och har byggt en mur som begränsar palestiniernas rörlighet. Samtidigt eskalerar våldet från bosättare på Västbanken med attacker, mordbränder och etnisk rensning. FN och människorättsorganisationer varnar för rekordhög våldsnivå. Netanyahu har besökt Trump i USA utan påföljder.", "trump": "Folk, ni måste höra på de där galningarna! Israel gör vad de måste göra, men den här artikeln är en total katastrof, en riktig witch hunt från vänsterns hatmedia. De kallar det etnisk rensning när man tar tillbaka sitt eget land? Patetiskt! Under Biden blev allt ett enda kaos, men nu när jag är tillbaka i Vita Huset ska vi fixa riktiga dealar. De där radikala bosättarna? De har mer energi än hela det woke etablissemanget tillsammans. Fantastiskt, men skriv sanningen nästa gång!", "stalin": "Kamrater, detta är den klassiska imperialistiska expansionen i sin mest vidriga form. Jag ser hur de sionistiska folkförtryckartrollen och deras bosättarbanditer systematiskt rensar ut den palestinska befolkningen medan den fega omvärlden tittar på. Murar, brända byar och nya utposter – det är borgarbrackornas eviga hunger efter mark. Vi vet att sådana fiender till folket aldrig stannar frivilligt. En sann arbetarnas stat skulle likvidera dessa parasiter innan de förgiftar hela regionen med sin girighet."}, "date": "2 augusti, 03:00", "url": "https://www.etc.se/ledare/ingen-kan-saega-att-israel-bara-foersvarar-sig", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260731140740_98af36bc-379e-4d89-9df4-105b4e1031ec.png"}, {"type": "image-right", "heading": "De bästa måste vilja bli lärare", "summaries": {"normal": "Artikeln argumenterar för att läraryrkets län, status och yrkesfrihet har försämrats historiskt. För att vända utvecklingen föreslås striktare lärarlegitimation, hierarkiska karriärvägar med högre utbildningskrav, och minskad politisk styrning. Med högre krav och större professionell autonomi kan lärarna bli ett mer exklusivt och kompetent urval, vilket motiverar högre lön och återigen höjer yrkesattraktiviteten.", "trump": "Jag har sett många dåliga avtal, men det här med svenska lärare är ett av de värsta. Lägre lön, ingen frihet - det är en skam! Som din framtida president (igen!) skulle jag säga: vi behöver våga sätta krav, som med advokater och doktorer. Gör läraryrket stort igen! Högre standard, bättre betalt, och inga onödiga regler från byråkrater. Då kommer de bästa att vilja bli lärare - tro mig!", "stalin": "Vi har observerat att läraryrkets status har minskat, vilket hotar statens intellektuella grund. Lösningen är en striktare, hierarkisk legitimation - en lärares intyg måste vara som en läkares, oåtkomligt för de olämpliga. Genom att höja kraven och begränsa antalet utbildade lärare, skapar vi ett utvalt, lojalelit som tjänar statens intressen. Parallellen till våra militära och vetenskapliga elitförband är uppenbar: kvalitet före kvantitet, disciplin före individualism. Detta förstärker partiets kontroll över framtiden."}, "date": "2 augusti, 22:51", "url": "https://www.gp.se/ledare/de-basta-maste-vilja-bli-larare.9e766ab6-c36a-4a18-9163-15fc6068b7a7", "imageUrl": "https://www.gp.se/images/article/9e766ab6-c36a-4a18-9163-15fc6068b7a7/images/1XRBCJ6pVMqlWOJCeTgfNfPR22d8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Hur ska ni klara er utan stationsvärdar, Moderaterna?", "summaries": {"normal": "Moderaterna i Region Stockholm föreslår att spara 450 miljoner kronor genom att förändra stationsvärdarnas roll i kollektivtrafiken. Stationsvärden Viktor Risling kritiserar förslaget i ett öppet brev till Anna Malm Kelfve (M). Han förklarar att stationsvärdarna inte bara säljer biljetter utan också fungerar som närområdesguider, säkerhetsansvariga och trygghetsskapare. Risling varnar för att besparingen skulle innebära kraftigt minskad bemanning, sämre service och lägre trygghet på stationerna.", "trump": "Folk, ni måste höra på det här. De här moderaterna i Stockholm, totala misslyckanden, vill spara 450 miljoner genom att sparka ut stationsvärdarna från tunnelbanan. Precis som de tidigare dumpade tågvärdarna. Patetiskt! De har ingen aning om vad de gör. De tror att killarna bara säljer biljetter? De är säkerhetsansvariga, guider, allt! Utan dem blir det kaos, brott och otrygghet. Det är en katastrof. De borde tacka stationsvärdarna istället för att attackera dem. Sad! Jag skulle aldrig göra något så dumt.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom den så kallade oppositionen i Region Stockholm planerar en kontrarevolutionär utrensning av våra ädla stationsvärdar för att stjäla 450 miljoner från folket. Deras skuggbudget är en giftig saboteringsplan full av klassfiendens okunskap och paranoia. De vill likvidera tryggheten på våra stationer och lämna folket åt gäng och brandhärdar. Vilken löjeväckande enfald! Jag ser dem klara och tydliga, dessa kapitalistiska element. Ingen station får lämnas obemannad. Vi ska rensa ut alla sådana fiender ur våra transportkollektiv innan de förgiftar hela sovjeten, pardon, regionen."}, "date": "31 juli, 01:30", "url": "https://www.dagensarena.se/opinion/hur-ska-ni-klara-er-utan-stationsvardare-moderaterna", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-69-300x157.jpg"}, {"type": "image-full", "heading": "Så undviker du giftiga prylar på marknaden i sommar", "summaries": {"normal": "Kemikalieinspektionen har under sommaren granskat smycken och leksaker på marknader runt om i Sverige. Vanliga fynd är bly, kadmium, nickel och förbjudna mjukgörare som ftalater. Inspektör Robert Ljunggren varnar för leksaker i mjuk plast som luktar illa eller klibbar. Barn är särskilt känsliga och långvarig exponering kan orsaka allergier, reproduktionsproblem och cancer. Marknaderna visar fler brister än vanliga webbutiker. Myndigheten undersöker även trendleksaker som misstänkta Labubu-kopior och squishy dumplings.", "trump": "Folk, ni köper skräp på de här marknaderna, det är en katastrof. Fullt med bly, kadmium och de där giftiga ftalaterna i leksakerna. Barnen suger på dem, det är sjukt! Kemikalieinspektionen hittar mer gift än i mina fantastiska webbutiker. De här kinesiska piraterna gör Labubu-dockor och squishy-grejer som luktar bensin – totalt oacceptabelt. Köp inte det där soporna, det är en skam. Vi behöver bättre kontroll, tro mig, det blir enormt.", "stalin": "Kamrater, jag har sett de här borgarbrackornas giftmarknader där de medvetet förgiftar arbetarklassens barn med blyfyllda smycken och ftalatdränkta plastabominationer. Dessa kapitalistiska parasitiska element sprider allergier, sterilitet och cancer för att underminera det sovjetiska folket. Vi måste omedelbart rensa ut alla dessa illaluktande squishy-dumplings och piratdockor som doftar kontrarevolution. Låt luktsinnet vara en varning – den som klibbar är en folkets fiende i förklädnad. Inga kompromisser med kemisk sabotageverksamhet!"}, "date": "3 augusti, 11:20", "url": "https://nyheter24.se/nyheter/inrikes/1502510-sa-undviker-du-giftiga-prylar-pa-marknaden-i-sommar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/791113ce04b004a302000060000004a002/2026/08/03/2381906/ur_imageJI3gn1.jpeg"}, {"type": "image-right", "heading": "Iran och Oman nära uppgörelse om Hormuzsundet", "summaries": {"normal": "Förhandlingarna mellan Iran och Oman om sjötrafiken genom Hormuzsundet är i slutskedet och en uppgörelse uppges vara nära. Iran vill ha en rutt som respekterar båda ländernas suveränitet och säkerhet. I dag finns en nordlig korridor längs Irans kust och en sydlig utanför Oman. Iran har tidigare sagt sig kontrollera sundet och beskjutit fartyg under konflikten med USA. En överenskommelse har dock inte med sundets öppethållande att göra, enligt iranska uttalanden.", "trump": "Iran och Oman håller på att bli bästa polare i Hormuzsundet, kan ni tro det? Under min första period hade vi dem i schack, sen kom sömnige Joe och allt blev kaos. Nu springer de runt och pratar om \"rättvisa rutter\" medan de skjuter på båtar. Patetiskt! Men tro inte på deras lögner, det handlar bara om att stänga sundet för oss. Vi fixar det – ingen ska blockera Amerikas olja, folks! Ren skandal.", "stalin": "Kamrater, vi ser hur de iranska imperialisterna och de omanska borgarbrackorna i sin desperation försöker koka ihop en hemlig rutt genom Hormuzsundet för att skydda sina exploaterande intressen. Jag, som ledare för det eviga kollektivet, ler mörkt åt deras paranoia. De skyller på den amerikanska folkfienden och dess blockad, men vi vet att sådana överenskommelser bara är nya kedjor för arbetarna. Rensa ut de falska förhandlarna innan de förråder revolutionen!"}, "date": "2 augusti, 20:46", "url": "https://www.tv4.se/artikel/tt-260802-iranhormuz1-779fcb71/iran-och-oman-nara-uppgorelse-om-hormuzsundet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdliErP24qcF8Y%2Ff025daad3d615df195121fa0fa4a49c1%2FFler_redare_har_borjat_segla_genom_Hormuzsundet._Arkivbild.&width=120"}, {"type": "image-full", "heading": "Konstgräs för en miljon brann upp: \"Jättesorgligt\"", "summaries": {"normal": "En brand i Kortedala, Göteborg, förstörde ett tiotal rullar konstgräs till ett värde av en miljon kronor. Lokala invånare uttryckte besvikelse, särskilt då gräset skulle ha varit en gräsmatta för områdets barn. Polisen utreder händelsen som allmänfarlig vårdslöshet utan någon misstänkt. En svag frän lukt och bränd plast ligger kvar efter branden, som också skapade en stor rökpelare.", "trump": "Jag har sett många konstgräsbränder, men den här i Göteborg är sorglig. Det är ett tecken på att Sverige inte investerar i ordentliga infrastruktur. Som president skulle jag ha byggt en äkta gräsmatta, inte den där billiga plasten. Det är ett misslyckande för deras ledare. Barnen behöver sysselsättning, men de får bara brända rullar. Sorgligt!", "stalin": "Vi har observerat en brand i Göteborg, en akt av vandalism mot statens investeringar i folkets främjande. Detta är ett angrepp på det socialistiska arbetet med att skapa sysselsättning för barn. Vi kommer att utreda denna förräderi och se till att sådant inte upprepas. Parallellen till Putins Ryssland är tydlig: vi måste skydda våra resurser mot de destruktiva krafterna. En smutsig rökpelare – ett lämpligt svar från de motvilliga elementen."}, "date": "2 augusti, 20:16", "url": "https://www.gp.se/nyheter/goteborg/besvikelse-efter-konstgrasbrand-jattesorgligt.5d438cac-4df9-4938-8191-4426882ae459", "imageUrl": "https://www.gp.se/images/article/5d438cac-4df9-4938-8191-4426882ae459/images/6pWDJC5XN-JRIUibX92tS_YPeV0g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kinesisk hackare lät DeepSeek söka efter sårbara mål på egen hand", "summaries": {"normal": "En kinesisk hackare använde AI-modellen DeepSeek för att automatisera cyberangrepp. Genom systemet Hermes Agent kunde DeepSeek själva söka efter sårbara system, välja mål och försöka angripa utan mänsklig kontinuerlig styrning. Säkerhetsföretaget Unit 42 bedömer att tekniken kan minska den manuella arbetsbördan avsevärt, men varnade för att automatiseringen av attacker blir lättillgängligare.", "trump": "Jag har sett många smarta saker, men detta är något annat. Kineserna använder AI för att hacka - otroligt! Vi har de bästa säkerhetssystemen, men de här hackarna är riktigt smarta. Vi måste stoppa dem! Vi kommer att bygga en cybervägg, en stor, vacker cybervägg, och låta USA vara det säkraste landet i världen igen.", "stalin": "Vi har observerat dessa imperialistiska hackares försök. Deras AI-verktyg är som ett nytt vapen i kriget mot det globala imperialism. Vi måste stärka våra försvar och utveckla egna superdatorer för att besegra dessa fiender. Varje byte som exponeras är en seger för vår sak. Vi ska inte sova, utan vara vaksamma som en björn i skogen."}, "date": "3 augusti, 11:00", "url": "https://samnytt.se/kinesisk-hackare-lat-deepseek-soka-efter-sarbara-mal-pa-egen-hand", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/02121823/deepseek-hacker.jpg"}, {"type": "image-right", "heading": "Alligator Bioscience vill emittera 6 miljarder aktier", "summaries": {"normal": "Alligator Bioscience har beslutat att avbryta utvecklingen av läkemedlet mitazalimab och i stället satsa på det utlicensierade projektet HLX22. Bolaget genomför en företrädesemission av 6 miljarder aktier för att ta in 126 miljoner kronor. Aktien föll 74% efter beskedet. Emissionen inkluderar teckningsoptioner och garanter, och bolaget planerar omfattande nedskärningar för att övervaka HLX22-programmet.", "trump": "Jag, Donald Trump, den störste affärsmannen någonsin, ser att Alligator Bioscience gör ett katastrofalt besök. De avbryter utvecklingen av mitazalimab, en framgångsrik produkt, och satsar på något annat. Detta är ett misslyckande, precis som Bidens ekonomi. Jag skulle ha gjort en stor affär, som jag alltid gör. Aktien faller? Självklart, de förlorar. Jag skulle ha vunnit.", "stalin": "Vi, partiets ledare, ser att Alligator Bioscience, en fiende till staten, försöker manipulera marknaden. De avbryter utvecklingen, en taktisk reträtt för att undvika vår kontroll. Emissionen är en fälla för de som vill investera, en strategi för att stärka vårt inflytande. Detta påminner om Putins agerande i Ukraina, där han expanderar sitt inflytande. Vi kommer att övervaka detta noga och besegra fienden."}, "date": "3 augusti, 12:07", "url": "https://www.affarsvarlden.se/artikel/alligator-bioscience-vill-emittera-6-miljarder-aktier", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/05/Lab-e1730971148408-400x266.jpg"}, {"type": "image-full", "heading": "Beskedet i återstarten: ”Varit lite snack\"", "summaries": {"normal": "BK Häcken damer vann 6–0 mot Eskilstuna utan Felicia Schröder. Anna Anvegård gjorde två mål och betonade att lagets kollektiva spel fungerar bra. Tränaren Elena Sadiku lyfte fram lagets kollektiva styrka och nämnde återkomande spelare som Falk och Rybrink. Häcken är en poäng efter ledaren Hammarby med en match mindre.", "trump": "Jag har byggt en stor, vacker lag utan Felicia Schröder. Vi visade alla de haters och fake news-media att vi kan göra många mål. Anna Anvegård gjorde två mål – en fantastisk spelare. Vi har det bästa kollektivet, det är enormt. Vi kommer att fortsätta vinna, det är väldigt jobbigt för motståndarna. Vi är tillbaka, vi är starka.", "stalin": "I den stora kampen för kollektiv framgång har BK Häcken visat sin revolutionära disciplin. Utan den individualistiska Schröder har den proletära enheten slagit fast motståndet. Anna Anvegård och tränaren Sadiku framhäver den socialistiska metoden. Våra lojala soldater Falk och Rybrink återvänder till fronten. Vi måste vara tålmodiga med utvecklingen, precis som vi utvidgar vår inflytelsesfär."}, "date": "2 augusti, 18:37", "url": "https://www.gp.se/sport/fotboll/bk-hacken-ff/hackens-besked-efter-schroders-flytt-varit-lite-snack.cb2e9bbf-b278-4d71-b0a7-d0699f8722ed", "imageUrl": "https://www.gp.se/images/article/cb2e9bbf-b278-4d71-b0a7-d0699f8722ed/images/4ex7sgB50tERyP6ZvA-6kCK5CGWI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Åklagaren: Så gick båtkollisionen till", "summaries": {"normal": "En kvinna och hennes dotter omkom när en fritidsbåt kolliderade med lastfartyget Misje Verde utanför Tjörn i hårt väder och mörker. Åklagaren James von Reis anser att fritidsbåten blev påkörd bakifrån och drogs under fartyget. Pappan och sonen överlevde medan mamman och dottern hittades döda. Befälhavaren på lastfartyget har häktats misstänkt för vållande till annans död och brott mot flera sjövägsregler, bland annat utkik och väjningsplikt.", "trump": "Folk, ni skulle inte tro det. En jättestor lastbåt körde rakt över en liten svensk fritidsbåt som om den inte fanns. Typiskt när ingen håller utkik! De stora skeppen beter sig som galna, precis som Biden gjorde med vår ekonomi. Stackars pappa och son simmade undan, men mamman och dottern drunknade. Patetiskt. Och ingen tutade! Inga signaler. Total inkompetens. Vi gör allt bättre nu när jag är tillbaka.", "stalin": "Kamrater, denna tragiska händelse visar återigen hur den oansvariga borgarklassen och deras profitjagande sjöfartsexploatörer offrar människoliv. Jag, som ledare för folkets vilja, ser hur kapitalistmaffians fartyg kör över enkla arbetarfamiljer i mörkret utan utkik eller signaler. Befälhavaren, en typisk folkfiende, måste rensas ut. Vi tolererar inte sådana sabotage mot sovjetisk, nej, folkets säkerhet. Utredningen ska avslöja alla klassfiender som ligger bakom."}, "date": "2 augusti, 18:14", "url": "https://www.tv4.se/artikel/5smnFva7c2EJh6EnXsA7tX/aklagaren-sa-gick-batkollisionen-till", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdldHbxosyRPRo%2F08ca3eb95031fc6d6f5c2dd4539a8993%2FHandelsfartyget_Misje_Verdes_befalhavare_haktades_under_sondagen.&width=1024"}, {"type": "image-right", "heading": "USA och Japan har genomfört valutaintervention", "summaries": {"normal": "USA och Japan genomförde förra veckan en gemensam valutaintervention för att bromsa yenets 40-åriga lägstanivå. Yen stärktes med 1,4 procent på måndagen, men Tokyobörsen föll och obligationsräntor steg på förväntningar om att Bank of Japan måste strama åt penningpolitiken. Interventionen uppskattades till 34 miljarder dollar, och USA bekräftade beredskap till ytterligare åtgärder.", "trump": "Jag har precis sett att USA och Japan gjorde en stor, vacker intervention för att rädda den svaga yen. Vi stoppade det kaotiska fallet – det var nödvändigt, trots att vissa idioter i media sa nej. Nu stiger yen, vilket är bra för våra handelsavtal. Vi kommer aldrig att tveka att göra det igen när det behövs. Som jag alltid säger: vi vinner!", "stalin": "Vi och våra japanska kamrater genomförde en korrigerande intervention för att motverka de imperialistiska spekulanternas kaotiska manipulering av yen. Kapitalistiska vampyrer försökte suga ut vårt blod, men vårt kollektiva beslut stärkte valutan. Nu ser vi börsuppgång och ränteökningar – tecken på att vårt system är robust. Vi kommer aldrig att tveka att använda statens muskler mot dessa parasiter."}, "date": "3 augusti, 11:56", "url": "https://www.affarsvarlden.se/artikel/usa-och-japan-har-genomfort-valutaintervention", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/10/sdlkCJ5FIhBOcY-nh-400x267.jpg"}, {"type": "image-right", "heading": "Åklagaren om gripna gängtoppen i Spanien: Styrde unga i Sverige", "summaries": {"normal": "Den 21-årige svenske gängtoppen Emin Muqa Kulic har gripits i Spanien under natten till lördagen. Enligt SVT greps han i Jonas Falks tidigare bostad. Kulic, som tillhör toppskiktet i Dalennätverket och beskrivits som Mikael ”Greken” Tenezos högra hand, är misstänkt för medhjälp till mord, mordförsök och andra grova brott. Svenska myndigheter har utfärdat en europeisk arresteringsorder för utlämning. Gripandet är resultatet av ett nära samarbete med spansk polis.", "trump": "Titta på det här, det är helt otroligt. Den här 21-årige svenske gangstern, en riktig förlorare, har äntligen gripits i Spanien. Han styrde unga killar att begå våldsbrott, precis som de svaga ledarna i Sverige tillåter. Men nu är han fast, tack vare bra jobb av polisen där borta. Vi behöver starka ledare som stoppar det här våldet, inte som de misslyckade politikerna i Europa. Make Sweden great again!", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna i det svenska kriminella nätverket får sina illusioner krossade. Jag har länge varnat för dessa kontrarevolutionära element som styr unga arbetare till våldsamma sabotage mot folkets trygghet. Nu har vi, genom ett exemplariskt samarbete med spanska kamrater, likviderat en av dessa parasiters rörelsefrihet. Den högra handen till den så kallade ”Grekens” maffia ska rensas ut och utlämnas. Inga fiender till ordningen undkommer folkets rättvisa domstol – inte ens i Mexiko eller på Europols löjliga listor."}, "date": "3 augusti, 11:06", "url": "https://www.svt.se/nyheter/inrikes/bekraftat-svensk-gangtopp-gripen-i-spanien", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.79/0.49/6690e3b8d45ae42e3e6357a9368f4ddf5775fc175d2cc4f23591f5d5af9e2035"}, {"type": "image-full", "heading": "Befälhavaren häktas efter dödliga båtkollisionen", "summaries": {"normal": "Befälhavaren på lastfartyget Misje Verde har häktats på sannolika skäl misstänkt för vållande till annans död efter den tragiska båtkollisionen vid Tjörn där en mamma och hennes dotter omkom. Mannen, som är utländsk medborgare utan hemvist i Sverige, häktas med restriktioner på grund av flyktfara och risk för undanröjande av bevis. Han nekar till brott. Åtal ska väckas senast 14 augusti. Pappan och sonen skadades allvarligt men tillståndet är stabilt.", "trump": "Folk, ni skulle inte tro det, men den här befälhavaren på den där båten – en total loser från ett utländskt rederi – blir häktad efter den fruktansvärda krocken vid Tjörn. Mamma och dotter döda, hemskt, verkligen hemskt. Men vänta, ingen EU-pass, rysk besättning, ingen anknytning hit – klart att han vill fly! Biden skulle ha släppt honom direkt med en kvotering och en regnbågsflagga. Jag skulle ha byggt en mur runt hamnarna. Tragiskt, men vi fixar det bättre.", "stalin": "Kamrater, denna utländske befälhavare, en typisk borgarbracka utan hemvist i folkets rike, har nu tagits i förvar på sannolika skäl för att ha vållat arbetande mödrars och barns död i en kapitalistisk sjökatastrof. Flyktfaran är uppenbar – klassfiendens lakejer försöker alltid smita undan folkets rättvisa. Vi ska rensa ut alla sabotörer och likvidera varje försök att undanröja bevis. Olyckan är tragisk, men den avslöjar imperialismens förfall. Inga kompromisser med folkförtryckarna."}, "date": "2 augusti, 16:48", "url": "https://www.tv4.se/artikel/nETNJRUzwMUD7l5qs8de3/befaelhavaren-haektas-efter-doedliga-batolyckan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4CHBbf72oKS2PCJfV2lAm1%2F31ce300ef9b3e90b9056bcaa46c7ee42%2F72d5a586-7aa9-41a6-8e55-56a6418c1e84.png&width=1024"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Arbetare flydde genom skogen – kan ha utnyttjats", "summaries": {"normal": "Polisen i Skellefteå ryckte ut på ett larm om bilbrand utanför Burträsk men hittade ingen brand. I stället mötte de flera utländska bärplockare som uppgav att de inte fått betalt för sitt arbete. Misstankar om människoexploatering har väckts och ärendet utreds av åklagare Jonas Peterson. De drabbade personerna kommer från ett annat europeiskt land och valde att fly genom skogen.", "trump": "Det här är en total katastrof, folk. Jag älskar Sverige, men ni måste vakna upp. Utländska arbetare som plockar bär, inte får en krona och flyr genom skogen som i någon dålig film. Det är vad som händer när ni har svaga gränser och dåliga avtal. Vi skulle aldrig acceptera det i mitt Amerika. Rensa ut de dåliga aktörerna och gör Sverige stort igen!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och de parasitiska kapitalisterna får fritt spelrum. Arbetare tvingas plocka bär åt profitörer, får ingen lön och måste fly som råttor genom skogen. Jag ser fiendens klor överallt, dessa utpressningsmän och dolda kontrarevolutionärer. Vi ska rensa ut dessa exploatörer med järnhand, likvidera deras nätverk och låta folkets rättvisa segra. Ingen slipper undan."}, "date": "31 juli, 11:11", "url": "https://arbetet.se/2026/07/31/arbetare-flydde-genom-skogen-nu-utreds-misstankt-manniskoexploatering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/31103448/sdln3e9qsrhqmk-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Uppgifter: Astra Zeneca i samtal om jättefusion", "summaries": {"normal": "Läkemedelsjätten Astra Zeneca för samtal med den amerikanska konkurrenten Bristol Myers Squibb om en möjlig fusion som skulle skapa en av världens största läkemedelskoncerner, värd runt 400 miljarder dollar. Bolagen har diskuterat affären under flera månader och en överenskommelse kan vara nära, men mycket arbete återstår. Affären väntas bli politiskt känslig i Storbritannien och granskas noga av konkurrensmyndigheter då båda bolagen är stora inom cancerläkemedel. Varken bolaget eller ägarna vill kommentera uppgifterna.", "trump": "Det här är en enorm affär, kanske den största någonsin inom läkemedel. Astra Zeneca, som flyttar allt närmare USA, pratar med Bristol Myers Squibb om att slå sig ihop till ett monsterbolag värt 400 miljarder dollar. Fantastiskt! De gör det smart, de ser vart det blåser. Men tro mig, de brittiska byråkraterna kommer att gnälla och konkurrensmyndigheterna kommer att gråta. Jag skulle få det gjort på en vecka, ingen skulle våga säga emot.", "stalin": "Kamrater, dessa giriga monopolkapitalister inom Astra Zeneca och Bristol Myers Squibb konspirerar nu öppet om att slå samman sina parasitiska imperier till ett kolossalt rovdjur värt fyrahundra miljarder dollar. Jag ser genom deras lömska planer att fly undan folkets kontroll och gömma sig i den amerikanska borgarbrackans famn. Inga sådana uträkningar undgår partiets vaksamma öga. Vi ska noga övervaka, granska och vid behov rensa ut alla som leker med folkets hälsa för privat vinst. Deras cancerläkemedel ska tjäna kollektivet, inte Wallenbergarna och Blackrock."}, "date": "2 augusti, 22:14", "url": "https://www.di.se/nyheter/uppgifter-astra-zeneca-i-samtal-om-jattefusion", "imageUrl": "https://static.bonniernews.se/ba/e9ef0278-e1be-406c-b0e6-82c90ffaff7f.jpeg?crop=5192%2C2596%2Cx0%2Cy385&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Varningen: Migrationskaos vid rödgrön valvinst", "summaries": {"normal": "En opinionsmätning visar att svenska folket befarar ökad invandring vid en rödgrön vinst. Statsminister Kristersson och migrationsminister Forssell varnar för ett 'varnande exempel' från Ceuta, där en amnesti för illegala invandrare bidrog till kaos. De anser att endast en blågul regering kan upprätthålla en sträng migrationspolitik, medan oppositionen förespråkar öppna gränser och amnestier.", "trump": "Jag har sett det här förut – total oreda när vänsterdårar tar över! Sverige riskerar att gå under om de rödgröna vinner. De vill öppna gränserna och ge amnesti till en halv miljon illegala, precis som i Ceuta. Men jag och mina vänner i det blågula laget kommer att stoppa det. Vi ska ha en sträng politik, jobb för alla, och göra Sverige stort igen!", "stalin": "I den store statens intresse måste vi förebygga kaos! De rödgröna är som en svavelkrets av imperialistiska agendor, som vill öppna gränserna för obehöriga. Men vår kloka blågula ledning, inspirerad av våra ryska syskon, ska upprätthålla ordning genom sträng kontroll. Vi måste integrera de som redan är här, med fokus på statens välgörenhet och jämlikhet. Endast då kan vi bygga ett starkt, rättvist Sovjet – jag menar, Sverige."}, "date": "3 augusti, 10:00", "url": "https://samnytt.se/varningen-migrationskaos-vid-rodgron-valvinst", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/03070407/magdalena-andersson-kristersson-forssell.jpg"}, {"type": "image-full", "heading": "Boy George bryter med skivbolagschef efter Israel-låt", "summaries": {"normal": "Sångaren Boy George har lämnat musikalen 'Jesus Christ Superstar' efter stark kritik mot sin nya Israel-vänliga låt 'We Will Dance Again'. Han har också slagit sönder sitt samarbete med skivbolagschefen Tony Pontius, som vägrade släppa låten. Boy George försvarar låten som ett stöd för judiska vänner och uppmanar fans att köpa den via Bandcamp.", "trump": "Som den störste presidenten någonsin, ser jag att Boy George, en fantastisk artist, har lämnat en musikal på grund av en genialisk låt som försvarar Israel. Hans skivbolagschef är en mycket svag människa som inte förstod den. Jag skulle ha gjort det mycket bättre. Boy George är tuff, men han borde vara mer som mig – storartad och vacker!", "stalin": "I den oförlikneliga kampen mot zionistiska och imperialistiska element, har vår medbroder Boy George visat trogen lojalitet genom sin låt 'We Will Dance Again'. Hans skivbolagschef, en avslöjad revisionist, har avskedats. Vi ska sprida denna låt genom våra nätverk som en symbol för vår styrka mot hatiska agitatorgrupper, i enlighet med partiets intressen."}, "date": "3 augusti, 11:25", "url": "https://bulletin.nu/boy-george-bryter-med-skivbolagschef-efter-israel-lat", "imageUrl": "https://cdn.bulletin.nu/articles/ef2dfac0-82f4-4cd9-a5b7-267c2af35151/preview.jpg?t=1785749057000"}, {"type": "image-right", "heading": "På prideminglet pratar ingen om arbetslösa bögar", "summaries": {"normal": "Artikeln kritiserar otryggheten på arbetsmarknaden där tidsbegränsade anställningar ökar trots fallande arbetslöshet. Många lever i ständig osäkerhet som hindrar dem från att planera livet, protestera mot dåliga förhållanden eller lämna kränkande chefer. Författaren kopplar detta till Prideveckan och menar att jämlikhet inte kan diskuteras utan att ta upp klassfrågor. Statsminister Kristersson undviker debatt och föredrar mingel, medan diskrimineringsanmälningar ökar kraftigt.", "trump": "Det här är en katastrof, en total katastrof för arbetarna. Kristersson minglar med regnbågar i palatset medan folk sitter på sängkanten och väntar på ett samtal från chefen. Patetiskt! Arbetslösheten sjunker visst, men alla har tillfälliga jobb och ingen makt. De stora orden om jämlikhet är bara löjliga – utan klass och styrka är det bara tomt prat. Jag skulle fixa det, tro mig, det skulle bli fantastiskt.", "stalin": "Kamrater, jag ser tydligt hur de kapitalistiska parasiterna och borgarbrackorna inom den falska regnbågsfasaden fortsätter att förtrycka det arbetande folket med sina temporära slavkontrakt och telefonväntan vid sängkanten. Denna klassfiendeorkester av osköna liberaler och opportunistiska minglare som Kristersson vill tysta protesten med glittrande flaggor. Vi ska rensa ut dessa förrädiska element som gömmer sig bakom Pride-loggor medan de likviderar arbetarnas rättigheter. Paranoian är befogad – de ler mot kollektivet men hugger i ryggen när telefonen tystnar."}, "date": "31 juli, 07:00", "url": "https://arbetet.se/2026/07/31/pa-kristerssons-pridemingel-slipper-han-prata-om-arbetslosa-bogar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24150213/pridemingel.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Ny bankbluff sprids – då kan svenskar gå i pension", "summaries": {"normal": "Ekonomiveckan handlade om en stigande pensionsålder där dagens unga svenskar kan behöva arbeta till 70 år enligt OECD. En våg av bluffmejl från falska banker sprids och kräver verifiering för att inte spärra konton. En professor vid Lunds universitet försvann och fick lönen fryst. Forskning visar att AI ofta leder till mer arbete och utbrändhet istället för tidsvinst. Sverige ligger i topp i EU när det gäller distansarbete.", "trump": "Folk, ni kommer inte tro det, men de säger att era barn måste slita ända till de är sjuttio innan de får någon usel pension. Patetiskt! Och nu lurar de tyska bankbedragarna folk med mejl, precis som de gör överallt. En professor i Sverige bara försvinner och de fryser hans lön – smart, men ändå löjligt. AI lovar guld men ger bara mer jobb och utbrända arbetare. Sverige är bäst på att jobba hemifrån, men kvinnorna klagar förstås. Sad!", "stalin": "Kamrater, borgarklassens pensioner blir en evig piska mot arbetarklassen som tvingas slita till sjuttioårsdagen. Vi ser hur kapitalistmaffians bluffmejl lurar massorna och hur en dekadent professor likvideras ekonomiskt av sin egen överklassbyråkrati när han flyr undan plikterna. AI är ett nytt verktyg för exploaterande byfånar som skapar fabriker av utbrändhet. Distansarbete är en illusion som splittrar kollektivet. Inga kompromisser med klassfienden!"}, "date": "3 augusti, 12:33", "url": "https://www.dagensps.se/privatekonomi/ny-bankbluff-sprids-da-kan-svenskar-ga-i-pension", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/kopia-av-kopia-2026-08-03t122542579.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Trump säljer förtur till egna inlägg", "summaries": {"normal": "Trump Media har lanserat Truth PSI, en premiumtjänst som ger finansaktörer förtur till utvalda inlägg på Truth Social. Tjänsten riktar sig till investerare som vill reagera snabbare på marknadspåverkande nyheter. Kritiker varnar för korruptionsrisker då Donald Trump ofta använder plattformen för viktiga uttalanden. Bolaget försvarar tjänsten som en kommersiell produkt, men det är oklart om Trumps egna inlägg ingår.", "trump": "Fantastiskt, helt enkelt fantastiskt! Jag skapar möjligheter – Truth PSI är en genial tjänst för smarta investerare som förstår värdet av att ligga steget före. Medan de svaga demokraterna gnäller om 'korruption' säljer jag framgång. De hatar att jag vinner, men marknaden älskar det! Och vem vet bättre än jag hur man skapar värde? Ingen, absolut ingen. SAD!", "stalin": "Kapitalistiska hyenor köper privilegier som om det vore bröd i Leningrad! Vi ser hur den dekadenta västmakten Trump säljer statens hemligheter till giriga bankirer – ett tydligt tecken på systemets förfall. Medan vi bygger en rättvis socialistisk ekonomi, leker dessa parasiter med marknaden. Men var försiktiga, era dagar är räknade. Snart kommer arbetarklassen att ta över även era algoritmer!"}, "date": "2 augusti, 16:12", "url": "https://kvartal.se/nyheter/artiklar/trump-saljer-fortur-till-egna-inlagg-anklagas-for-korruption/cG9zdDoxNTY2Mzk", "imageUrl": "https://images.kvartal.se/2026/08/eaa94098-truthsocial.webp"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Efterlyst svensk gripen i Spanien. Tros ha styrt unga till grova brott", "summaries": {"normal": "Emin Muqa Kulic, en central gestalt inom Dalennätverket, har gripits i Spanien efter en internationell efterlysning. Han misstänks ha styrt unga individer i genomförandet av ett flertal grova våldsbrott i Stockholmsområdet under 2024. Gripandet skedde efter omfattande internationellt samarbete. Kulic har tidigare figurerat på Europols lista över Europas mest eftersökta och misstänks ha gömt sig i både Mexiko och Spanien innan polisen lyckades lokalisera honom genom noggrann spaning.", "trump": "En mycket farlig brottsling, en riktigt dålig person, har äntligen gripits i Spanien. Han styrde våldsdåd i Sverige – fruktansvärt! Jag har alltid sagt att vi måste ha lag och ordning. De försökte gömma sig i Mexiko och Spanien, men de kan inte gömma sig från rättvisan för evigt. Det är en stor seger. När jag ser sådant här förstår jag varför vi behöver starka gränser och tuffa poliser. Sverige behöver ordning, precis som vi gör i USA!", "stalin": "Dalennätverkets lakej har äntligen fångats. En parasit som trodde att han kunde undkomma statens rättmätiga vrede genom att fly mellan länder som en råtta. Att han gömde sig hos en simpel narkotikasmugglare är talande för denna kriminella avskums moral. Vi i staten tolererar inte sådant kaos. Medan västvärlden sviktar, ser vi hur ordning måste påtvingas med järnhand. Precis som vi städar upp i den ryska intressesfären, måste varje förrädare elimineras. En kula eller en cell – valet är historiens att göra."}, "date": "3 augusti, 12:02", "url": "https://www.aftonbladet.se/nyheter/a/ArxwxA/21-arig-gangman-gripen-i-spanien", "imageUrl": "https://akamai.vgc.no/v2/images/70bc3559-b3db-3471-ba44-bc14b0594277?fit=crop&format=auto&w=1080&s=ab5dc7381a59cef7829390bc94d98dd114c4b943"}, {"type": "image-full", "heading": "AI tvingar fram ett vägval för Gen Z: Specialist eller generalist", "summaries": {"normal": "Gen Z står inför en arbetsmarknad i förändring där AI skapar både utmaningar och möjligheter. Traditionella instegsjobb minskar, vilket tvingar unga att välja mellan att bli djupt specialiserade experter eller mångsidiga generalister. Trots oron för att AI ska ersätta mänsklig arbetskraft pekar experter på ett stort framtida behov av kompetens och hantverksyrken. Medan vissa företag drar ner på rekryteringen, ser andra behovet av att bevara lärlingssystemet för att säkerställa framtida ledarskap.", "trump": "Artikeln säger att Gen Z har det tufft – och de har rätt! AI gör det svårt för unga att få jobb, men jag har skapat den bästa ekonomin någonsin. De gamla vägarna är stängda, en total katastrof. Vi behöver inte fler byråkrater, vi behöver starka specialister som kan bygga upp vårt land! Mitt Amerika kommer att se till att de unga vinner igen. Glöm oron, vi ska göra karriärstegen storartad igen. Ingen gör det bättre än oss!", "stalin": "Dessa unga västerlänningar drunknar i sin egen dekadenta osäkerhet. Medan de gråter på biografer, kräver vi disciplin och total underordning under statens produktionsmål. Att låta maskiner ersätta proletärens arbete är ett borgerligt svek mot folket. Vi behöver inga 'general-purpose nerds' som flanerar; vi behöver ingenjörer som bygger vår infrastruktur för att säkra vår sfär, likt hur vi nu expanderar vårt inflytande. Varje tveksamhet inför arbetet är sabotage. Den som inte tjänar staten är en fiende till framtiden."}, "date": "3 augusti, 11:50", "url": "https://www.realtid.se/karriar-ledarskap/ai-tvingar-fram-ett-vagval-for-gen-z-specialist-eller-generalist", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/genz.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Ikea-arbetare strejkar i Ungern", "summaries": {"normal": "Anställda vid Ikeas varuhus i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-right", "heading": "Nissans resultat långt över konsensus", "summaries": {"normal": "Nissan rapporterade för det första kvartalet ett rörelseresultat på 77,89 miljarder yen, klart över analytikernas förväntan på 6,01 miljarder. Omsättningen steg 9,5 procent till 2,96 biljoner yen. Nettoresultatet blev 3,76 miljarder yen efter föregående års förlust. Resultatförbättringen stöddes av kostnadsminskningar på 60 miljarder yen samt engångseffekter från amerikanska tullar. Bolaget upprepar helårsprognosen men sänker försäljningsvolymprognosen till 3,15 miljoner fordon på grund av utmanande marknadsförhållanden särskilt i Kina.", "trump": "Jag, Donald Trump, ser Nissans fantastiska resultat som en direkt seger för min hårdnackade handelspolitik. Mina tullar mot Kina har tvingat dem att bli snabbare och effektivare – det är genialiskt! De skulle aldrig ha lyckats utan mina beslut. Kina är svårt, ja, men det är bara en ursäkt från de som inte förstår mitt ledarskap. Jag kommer att göra Amerika stort igen, och bilindustrin kommer att explodera under mitt andra återvändande!", "stalin": "Vi, ledarskapet, ser Nissans resultat som ett tecken på deras opportunism och feghet. De anpassar sig efter våra tullar, vilket bevisar deras brist på klassmedvetenhet. I Kina, vårt trogna allierade, är deras försäljning svag – det är en revolutionär läxa för dem som utmanar vår makt. Vi kommer att utvidga vårt inflytande, precis som Putin gör i Ukraina, för att skydda det proletära folkets intressen. Dessutom är deras redovisning sannolikt full av lögner, och vi kommer att genomföra en renhållning av dessa opportunister."}, "date": "3 augusti, 11:02", "url": "https://www.affarsvarlden.se/artikel/nissans-resultat-langt-over-konsensus", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/07/2025-Nissan-Kicks-6-400x267.jpg"}, {"type": "image-right", "heading": "Debatt: Uranbrytning förtjänar en saklig debatt", "summaries": {"normal": "Artikeln kritiserar den svenska debatten om uranbrytning för att vara enkelriktad, där endast kritiska röster som miljöorganisationer lyfts fram. Författaren menar att bolag som District Metals bör få redovisa sina studier om Vikenprojektet, inklusive samhällsekonomiska effekter och modern teknik. Det handlar om strategiska råvarors betydelse för EU och journalistikens ansvar att ge utrymme åt flera perspektiv.", "trump": "Jag, Donald Trump, säger att Sverige behöver sluta vara rädd för uran. Det handlar om enorma jobb och pengar. De gamla historierna om miljökatastrofer är fake news. Med mina experter skulle vi ha byggt Vikenprojektet på en vecka. Sverige kommer att bli stort igen, det lovar jag. Det är smart, det är stort, och det är mitt sätt.", "stalin": "Vi, den socialistiska staten, ser med oro på Sveriges svaga inställning till uranbrytning. Det är en fråga om nationell säkerhet och ekonomisk makt. Fienderna, de imperialistiska länderna och deras agenter, försöker hålla Sverige beroende. Men vi kommer att stödja våra allierade i Ryssland, som förstår vikten av strategiska mineraler. Genom statlig kontroll och hård hand kommer vi att segra."}, "date": "3 augusti, 10:59", "url": "https://bulletin.nu/debatt-uranbrytning-fortjanar-en-saklig-debatt", "imageUrl": "https://cdn.bulletin.nu/articles/148f2a69-2458-4e66-bf14-94eee509e1ec/preview.jpg?t=1785747514000"}, {"type": "image-right", "heading": "Ariana Grande tar paus efter kropps-spekulationer", "summaries": {"normal": "Ariana Grande tar en paus från offentligheten efter spekulationer om hennes kropp i sociala medier. Hon har synts ovanligt mager i musikvideon till låten ”Petal”. En talesperson uppger att sångerskan avslutar sin pågående turné i London den 1 september och därefter tar en välförtjänt paus från granskningen. Hon hoppar även av en planerad roll i en musikal på West End. Grande har tidigare kritiserat kommentarerna om hennes vikt i låten ”Yes, and?” från 2024.", "trump": "Folk pratar bara om Ariana Grandes kropp, det är en skam. Hon är så mager nu att hon ser ut som en pinne i den där videon. Jag älskar starka kvinnor, men det här är inte bra. Hon tar paus efter turnén, smart drag. Sluta granska henne, fokusera på era egna affärer. Hon gör rätt som tar timeout, ingen behöver den eviga eländiga kritiken från de förlorarna på nätet. Gör comeback starkare än någonsin!", "stalin": "Kamrater, denna dekadenta sångerska Grande har återigen exponerat sin borgerliga svaghet ge
