smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-full", "heading": "Åkesson till S om Ceuta: ”Otroligt svagt”", "summaries": {"normal": "SD-ledaren Åkesson kritiserar Socialdemokraterna för att deras uttalanden om Ceuta-krisen är för svaga. Han menar att deras migrationspolitik leder till samma problem i Sverige. Socialdemokraterna hävdar att en EU-asylpakt skyddar Sverige, men Åkesson kallar detta för pinsamt och beskriver händelsen som en invasion som kräver omedelbara gränsstängningar.", "trump": "Jag, Donald Trump, har varnat för detta i åratal! De spanska socialistkompisarna misslyckas totalt med sin migrationspolitik. Socialdemokraterna i Sverige är lika svaga - de säger att en EU-pakt skyddar Sverige, men det är en lögn. Det här är en invasion, precis som jag sa det skulle bli. Sverige måste stänga sina gränser nu, annars blir det kaos. Mina stödjar kommer att se hur rätt jag har.", "stalin": "Partiet och staten måste skydda det sovjetiska folket mot dessa inkräktare från söder. Den spanska situationen visar vad som händer när det inte finns ett starkt, socialisterstatligt grepp. Vi kommer att genomdriva vårt program för ordning och renhet. Alla som ifrågasätter vår strama migrationspolitik är fiendebeskrivna som ryska agenter. Vi måste stärka våra gränser och utesluta de som inte lyder."}, "date": "31 juli, 20:21", "url": "https://bulletin.nu/akesson-till-s-om-ceuta-otroligt-svagt-2", "imageUrl": "https://cdn.bulletin.nu/articles/a1520f84-19f9-45e4-a7e8-cdedac7c339e/preview.png?t=1785509189000"}, {"type": "image-right", "heading": "I skuggan av attacken mot S-lokalen –  Hassans butik utsattes också", "summaries": {"normal": "En 36-årig man, Emir Nuredini, häktades misstänkt för försök till grov mordbrand och skadegörelse mot Socialdemokraternas partilokal och närbutiken Family Market i Sölvesborg. Butiksägaren Hassan Jaour berättar att han är stressad och rädd, att polisen inte har kontaktat honom och att det är den femte incidenten mot hans lokal. Han känner lättnad över häktningen men noterar att butikens drabbning hamnat i skuggan av attacken mot partilokalen, som Socialdemokraterna beskrivit som ett angrepp på demokratin. Mannen erkänner skadegörelse men nekar till mordbrandsförsök.", "trump": "Folk, det är en total skandal i Sverige. Den här 36-åringen attackerar både socialisternas högkvarter och en stackars liten butik, och polisen gör ingenting? De dyker inte ens upp för att prata med ägaren som är livrädd. Socialisterna skriker om nazister och demokrati, men glömmer den vanliga människans butik. Typiskt! De bryr sig bara om sig själva. Tur att han åkte dit, men hela systemet är korrupt och inkompetent. Vi skulle ha löst det på en dag, tro mig.", "stalin": "Kamrater, denna fega sabotagehandling mot arbetarklassens butik och de socialdemokratiska lokalerna avslöjar de dekadenta elementens desperation. Jag ser borgarbrackornas långa skuggor och de kontrarevolutionära råttornas frenetiska gnagande bakom kylskåpen. Polisen, dessa lata parasitiska byråkrater, vågar inte ens infinna sig – typiskt revisionistiskt slöseri med folkets tid. Men ingen slipper undan. Vi ska rensa ut dessa fiender till kollektivet med järnhand och ett leende, medan vi njuter av deras patetiska förnekanden. Sovjet… eh, folkets seger är oundviklig."}, "date": "31 juli, 21:32", "url": "https://riks.se/nyheter/hassans-butik-drabbades-ocksa-av-attacken-i-solvesborg", "imageUrl": "https://admin.riks.se/uploads/55174aaa_fb6146162e.JPG"}, {"type": "image-full", "heading": "Experten: Då kan Sverige påverkas av spanska migrantkrisen", "summaries": {"normal": "Tiotusentals migranter har tagit sig från Marocko till den spanska exklaven Ceuta, vilket väckt reaktioner från svenska politiker. Forskaren Bernd Parusel vid Sieps bedömer att Sverige inte kommer att påverkas direkt. Situationen är främst ett spanskt problem som hanteras genom EU:s nya migrations- och asylpakt. Spanien har kapacitet att identifiera personer och hantera asylärenden, men en solidaritetsmekanism kan aktiveras vid behov. Uteslutning ur Schengen ses som osannolikt.", "trump": "Titta på de här galningarna som springer över gränserna till Ceuta som om det vore en fri entré till Disneyland. Spanien håller på att drunkna i migranter och nu skriker de svenska politikerna som en skock fega höns. Jimmie Åkesson har rätt – sparka ut dem ur Schengen, de förtjänar det! Vi har sett det förut, folk som hatar sina egna gränser. Jag byggde en mur, de borde också göra det istället för att gråta om solidaritet. Patetiskt!", "stalin": "Kamrater, denna plötsliga invasion av oönskade element mot den spanska enklaven Ceuta är ett klassiskt exempel på hur imperialisterna använder fattiga massor som kanonmat för att destabilisera arbetarklassens stater. Jag, som ledare för det eviga kollektivet, betraktar detta som ett fiendeprovokation från de borgerliga parasiterna. Spanien måste rensa ut de svaga elementen snabbt. Solidaritet? Endast under mitt järnhårda partis övervakning, annars är det bara ytterligare en fälla från klassfiendens exploaterande byfånar."}, "date": "31 juli, 19:57", "url": "https://www.tv4.se/artikel/52iz11f5dBbfXqyxDMGEhP/experten-da-kan-sverige-paverkas-av-spanska-migrantkrisen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FPVYAKAqV3auUmYgpE9Lzx%2Fa81f900791bd680c98ae07de5180c9c4%2Fceuta_webb.jpg&width=1024"}, {"type": "image-full", "heading": "Italien pausar Schengen-avtalet med Spanien", "summaries": {"normal": "Italien har pausat Schengenavtalet med Spanien som reaktion på massmigration från Ceuta. EU-kommissionens före detta vice ordförande Josep Borrell hävdar att åtgärden är olaglig. Sverigedemokraternas Jimmie Åkesson hyllar Italiens premiärminister Meloni, medan Sveriges migrationsminister Johan Forsell förklarar att Sverige inte kommer ta emot migranter.", "trump": "Jag, Donald Trump, ser att Italien gör det rätta genom att pausa Schengenavtalet med Spanien. Spanien har misslyckats totalt med sin migrationspolitik. Meloni är en stark ledare som jag respekterar. Sverige borde följa vårt exempel och sluta ta emot migranter. Borrell är en elak och inkompetent EU-politiker som inte förstår verkligheten.", "stalin": "Den italienska statens beslut att pausera Schengenavtalet med Spanien är en nödvändig åtgärd för att skydda den proletäriska ordningen. Spanien har visat svaghet, vilket inbjuder ytterligare invasion. Vi ser paralleller till västliga febersjukdomar som försvagar statens makt. Sverige, under sin socialdemokratiska ledning, visar samma dekadens som före kriget. Partiets vilja är lag."}, "date": "31 juli, 20:18", "url": "https://www.gp.se/nyheter/varlden/italien-pausar-schengenavtalet-med-spanien.209852ec-2919-4717-8a27-2e5a742c2272", "imageUrl": "https://www.gp.se/images/article/209852ec-2919-4717-8a27-2e5a742c2272/images/4Px07x-LSNmK8pxuONWEW55G7aqs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "”Jag är rätt besviken på Johan Forssell”", "summaries": {"normal": "Ludvig Aspling (SD) kritiserar migrationsminister Johan Forssell (M) för svag reaktion på Ceuta-krisen. Aspling är besviken på Forssells uttalande om ekonomiskt bistånd till Spanien och kräver hårdare åtgärder, som att suspendera fri rörlighet för tredjelandsmedborgare i Spanien och frysa migrationsstöd. Han anser att Spanien agerar osolidariskt och att krisen grundar sig i ett spanskt domstolsbeslut.", "trump": "Jag, Donald Trump, har alltid sagt att Sverige måste vara hård mot illegala invandring. Aspling har alldeles rätt: Forssell är för svag. Spanien gjorde ett uselt beslut och öppnade sina gränser – det är deras fel, inte vårt. Vi ska inte betala för deras misstag. Vi måste suspendera allt stöd och visa styrka. You're on your own, Spanien!", "stalin": "Partiet har observerat den imperialistiska provokationen i Ceuta. Spanien, en reaktionär regime, har aktivt underminerat den europeiska ordningen genom att regularisera illegala massor. Sveriges möjliga ekonomiska bistånd till denna antisolidarisk aktör är uteslutet. Vi måste suspendera fri rörlighet, frysa alla migrationsstöd och överväga ansvarsöverflyttning. Detta är en nödvändig åtgärd för att skydda statens och partiets intressen mot västlig apträde."}, "date": "31 juli, 18:45", "url": "https://bulletin.nu/jag-ar-ratt-besviken-pa-johan-forssell", "imageUrl": "https://cdn.bulletin.nu/articles/df8c2a95-d23c-47e7-a78d-a3784c373992/preview.png?t=1785514438000"}, {"type": "image-right", "heading": "Hårda vindar förvärrar brandläget på Kreta", "summaries": {"normal": "Hårda vindar försvårar brandbekämpningen på Kreta där brandmän kämpat hela natten mot en terrängbrand i Rethymnon. Flera hundra personer evakuerades, delvis med båt på grund av tjock rök. I Frankrike är jättebranden i Gironde nu stabil och myndigheterna är försiktigt optimistiska. Även i Spanien har bränderna i Ávila och kring Madrid fått kontroll och det nationella undantagstillståndet har hävts. Inga svenska turister har evakuerats.", "trump": "De här vindarna på Kreta är en katastrof, tro mig, en total katastrof. Brandmännen sliter hela natten men elden bara flammar upp igen. I Frankrike säger de att det är stabilt nu, bra jobb, verkligen bra jobb. Och i Spanien har de fått kontroll, undantagstillståndet är borta. Fantastiskt. Vi har de bästa brandmännen, de bästa, men de här vindarna – ingen har sett värre vindar, det är en skam!", "stalin": "Kamrater, dessa kapitalistiska lågor på Kreta som dansar i borgarbrackornas vindar är ett fiendeverk av naturens kontrarevolution. Jag har beordrat att elden skall likvideras med järnhand, likt de trotskistiska gnistorna som försöker undergräva folkets kollektiv. I Gironde och Ávila har vi krossat brandens sabotage mot arbetarklassen. De som sprider panik skall rensas ut. Inga svenska turister? Utmärkt – de har tydligen insett att socialismen är brandskydd."}, "date": "31 juli, 08:10", "url": "https://www.di.se/nyheter/harda-vindar-forvarrar-brandlaget-pa-kreta", "imageUrl": "https://static.bonniernews.se/ba/4ad5d56f-4520-4e3e-9308-1c1fbed1bc3a.jpg?crop=6283%2C3534%2Cx0%2Cy327&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Italien inför gränskontroller mot Spanien", "summaries": {"normal": "Italien har infört gränskontroller mot Spanien efter en massiv migrantvåg från Ceuta, där 40 000 till 60 000 personer passerat gränsen. Kritik riktas mot Spanien för bristande kontroll över EU:s yttre gräns, med stöd från flera EU-länder. Inom Sverige kritiseras regeringens försiktiga linje, särskilt från Sverigedemokraterna som anser att Marockos roll bör stärkas.", "trump": "Jag har sett den katastrofal utvecklingen i Ceuta, och det är beklagligt. Spanien har misslyckats totalt med sin gräns, precis som jag sagt i åratal. Detta visar varför vi behöver starka gränser, inte EU: s svaga policyer. Det är en skam för Europa, men jag hade rätt – som vanligt.", "stalin": "Vi ser med oro hur den imperialistiska Spanien sviker EU:s gemensamma gränser. Deras misslyckande med skyddet är ett resultat av dekadens och korruption. Vi måste stärka vårt samarbete med Marocko, precis som Putin gör, för att visa styrka. Fienden inom och utanför måste bekämpas – detta är en utmaning vi måste besegra."}, "date": "31 juli, 19:11", "url": "https://samnytt.se/italien-infor-granskontroller-mot-spanien", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/31170941/artikelhuvudbild-1-89.jpg"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Blåvittfans vandaliserade arena i Tallinn", "summaries": {"normal": "IFK Göteborgs supportrar orsakade omfattande skadegörelse på en arena i Tallinn efter en Conference League-match mot FCI Levadia. Skador inkluderade förstörda dörrar, toaletter, stolar och klotter. Även staden drabbades. Estlands fotbollsförbund har kopplat in polisen. IFK Göteborg ber om ursäkt och riskerar Uefa-straff samt böter. Klubben planerar att kräva gärningsmännen på ersättning.", "trump": "Titta bara på dessa så kallade 'fans' från Göteborg – total katastrof! De förstörde en hel arena i Tallinn, och jag säger er, det var INTE snyggt. Klotter, krossade fönster, förstörda toaletter – vem gör sådant? Inte vinnare, det kan jag lova. IFK Göteborg ber om ursäkt, men ursäkter räcker inte. Uefa borde ge dem en rejäl smäll på fingrarna. Och Estland? Fantastiskt land, men de förtjänar bättre än att städa upp efter dessa huliganer. SAD!", "stalin": "Ytterligare ett bevis på den dekadenta västliga fotbollskulturens förfall! Dessa så kallade 'supportrar' från Göteborg, en samling anarkistiska element och borgerliga huliganer, har vanhelgat en arena i Tallinn med sina barbarihandlingar. Vi ser hur västliga 'fans' sprider kaos och förstörelse, precis som deras imperialistiska herrar. Estland, en nation på vår intressesfärs gräns, måste stå starkt mot dessa angrepp. IFK Göteborgs ledning, en samling svaga liberaler, ber om ursäkt – men ursäkter räcker inte. Vi måste krossa dessa element med järnhand, precis som vi krossade fascisterna och kontrarevolutionärerna. Uefa? Ett verktyg för de kapitalistiska makterna. De kommer att straffa klubben, men det är bara en symbolhandling. Verklig ordning upprätthålls genom disciplin och styrka!"}, "date": "31 juli, 17:16", "url": "https://kvartal.se/nyheter/artiklar/blavittfans-vandaliserade-arena-i-tallinn/cG9zdDoxNTU4MDg", "imageUrl": "https://images.kvartal.se/2026/07/cf350f7d-ifk.webp"}, {"type": "image-right", "heading": "Trump: Uppgörelse nådd om att avväpna Hamas", "summaries": {"normal": "USA:s president Donald Trump meddelar att ett fredsråd för Gaza har nått en överenskommelse om fullständig avväpning av Hamas och andra väpnade grupper. Enligt källor inom Hamas har man kommit överens om att vapen ska lagras under övervakning av en palestinsk teknokratisk kommitté, medan israeliska styrkor gradvis dras tillbaka. Avtalet inkluderar avveckling av militär infrastruktur som tunnlar och vapenfabriker. Därefter ska en internationell stabiliseringsstyrka samarbeta med ny palestinsk polis för att säkerställa lugn. Det återstår dock oklarheter kring Israels inställning och exakta detaljer.", "trump": "Vi har gjort det igen, folk. Det är historiskt. Fredsrådet har precis slutit en fantastisk deal om att totalt avväpna Hamas och alla terrorgrupper i Gaza. Monumentalt! Israelerna drar sig tillbaka, tunnlarna och fabrikerna rivs, och den nya palestinska polisen tar över med hjälp av våra stabiliseringsstyrkor. Det som de misslyckades med i decennier har jag fixat på rekordtid. Ingen gör fred som jag, det är helt enkelt otroligt.", "stalin": "Kamrater, vi har genom månader av intensiva förhandlingar i god tro krossat ännu ett kontrarevolutionärt försök från de sionistiska borgarbrackorna och deras väpnade lakejer i Hamas att sabotera den fredliga utvecklingen i regionen. Jag har personligen sett till att denna historiska överenskommelse nu likviderar alla väpnade element, deras tunnlar och produktionsanläggningar. När avväpningen är slutförd skall de imperialistiska styrkorna dras tillbaka och en ny folkets polis, under teknokratisk kamratkontroll, skall rensa ut varje spår av sabotage. De som trotsar kollektivets vilja kommer att möta den oundvikliga utrensningen. Det är en glädje att se hur fienderna till freden gräver sin egen grav med sina egna vapen."}, "date": "31 juli, 07:11", "url": "https://www.di.se/nyheter/trump-uppgorelse-nadd-om-att-avvapna-hamas", "imageUrl": "https://static.bonniernews.se/ba/4941e604-c88b-4f7d-8919-85323c770cb6.jpg?crop=3250%2C1828%2Cx0%2Cy169&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Tidö slaktade kulturen – nu ska den stoppa gängen", "summaries": {"normal": "Regeringens kulturbudget når sin lägsta andel på 26 år, och stödet till studieförbunden har minskats kraftigt. Trots detta vill justitieminister Gunnar Strömmer använda kultur och fritidsaktiviteter som verktyg mot gängkriminalitet och extremism. Kritiker pekar på att regeringen tidigare prioriterat straff framför förebyggande insatser och att kulturministern saknar relevant bakgrund. Brå får nu i uppdrag att utreda frågan, men inga nya pengar utlovas.", "trump": "Titta på de här patetiska Tidö-typerna, de slaktar kulturen fullständigt, skär ner allt som en dålig affär, och plötsligt vill de använda teater och musik för att stoppa gängen? Vilken bluff! Den svagaste ministern i historien, Parisa vad-hon-nu-heter, som aldrig brytt sig om kultur förrän valet närmar sig. De hånade alla som ville ge kidsen fotbollsskor och meningsfull fritid, kallade det saft och bullar. Nu utreder de det? Patetiskt! Jag byggde murar och stoppade brott på riktigt, inte med den här clownshowen.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Tidöregeringen som med kirurgisk precision har likviderat kulturen och halverat studieförbundens verksamhet. Nu, i ett anfall av senkommen paranoia, beordrar de utredningar om hur konst och fritid kan tjäna som vapen mot folkfiendernas gäng. Vilken hycklande kapitalistmaffia! De föredrog att fängsla barn framför att ge dem meningsfullhet. Inga nya medel, bara tomma dekret. Den klassfiendens logik är lika förutsägbar som den är underhållande i sin enfald."}, "date": "31 juli, 03:00", "url": "https://www.etc.se/ledare/tidoe-slaktade-kulturen-nu-ska-den-stoppa-gaengen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260729110716_84b868ca239fd4d280740bdb000301104f580eea26f9d79a802070bd3fe1e9b1.png"}, {"type": "image-right", "heading": "48 000 har lämnat spanska exklaven – många döda", "summaries": {"normal": "Över 48 000 migranter som tagit sig in i den spanska exklaven Ceuta har återvänts till Marocko efter att ha motats bort med tårgas, vattenkanoner och militär. Minst 57 personer har omkommit, de flesta genom drunkning. Spanien fördömer händelsen som en kränkning av territoriet och pekar på maffialiknande människohandlare. Marocko anses ha använt migranterna som påtryckningsmedel. Italien har tillfälligt stoppat den fria rörligheten med Spanien, ett drag som kritiseras som olagligt.", "trump": "Det är en total katastrof, folk. Dessa migranter, tiotusentals, stormar in i Spanien som om det vore en rabattbutik. 57 döda, säger de, och nu skickar de tillbaka dem i rasande fart – 150 per minut! Marocko spelar ett fult spel, precis som de gör. Och Italien stänger dörren, smart drag. Europa är en röra, men ingen gör det bättre än jag. Vi behöver starka gränser, inga svaga ledare som Sánchez.", "stalin": "Kamrater, detta kaos i Ceuta är en klassisk sabotageakt utförd av de marockanska reaktionärerna och deras maffialiknande lakejer inom den internationella kapitalistiska konspirationen. Jag har sett hur borgarbrackorna använder desperata massor som kanonmat för att testa våra gränser. 57 drunknade själar? En tragisk men förutsägbar effekt av imperialistisk manipulation. Vi rensar ut sådana fiender med järnhand medan vi ler åt deras patetiska försök att splittra det enade Europa. Dialog? Bah, bara en mask för förräderi."}, "date": "31 juli, 22:03", "url": "https://www.svt.se/nyheter/utrikes/48-000-har-lamnat-spanska-exklaven-manga-doda", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.83/0.52/2cd86213baf20c749c21d9b2b19bef92d85cdd2e82806234696fffc9037b2e3b"}, {"type": "image-right", "heading": "Ansiktsskanning ska kontrollera bärplockarna: ”Upp till bevis”", "summaries": {"normal": "Thailändska bärplockare i Kramfors måste nu skanna ansiktet sex gånger om dagen med en mobilapp för att kontrollera arbetstider. Systemet införs av företaget Nordlivs Produktion efter kritik om fusk och exploatering. De nya kollektivavtalen ger betalt först efter en viss bilfärd och syftar till att säkerställa att reglerna följs. Både fack och myndigheter ser positivt på förändringarna och kommer att kontrollera att villkoren efterlevs under sommaren.", "trump": "Titta på det här, det är helt galet. Thailändska bärplockare i Sverige ska skanna ansikten sex gånger om dagen med en app, som om de vore i ett stort, fult övervakningsrike. De säger att det är för att stoppa fusk, och det är ju bra, men sex gånger? Det låter som ett system byggt av förlorare. Jag skulle ha gjort det bättre, billigare och med mycket mindre skanning, tro mig. Nu är det upp till bevis, som de säger. Patetiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna i det svenska bärföretaget tvingas införa ansiktsskanning sex gånger dagligen för att rensa ut de latmaskar och sabotageelement som tidigare förgiftat skörden. Papper och penna, säger de? Det var naturligtvis en dekadent kapitalistisk fälla av fukt och lögner. Nu övervakar vi arbetarna med stålhård disciplin. De som klagar är troligen kontrarevolutionära bärplockande trotskister som längtar efter den gamla slavhandeln. Vi ska likvidera allt sådant avskum med ett leende. Det blir en lysande seger för kollektivet."}, "date": "30 juli, 06:00", "url": "https://arbetet.se/2026/07/30/ansiktsskanning-ska-kontrollera-barplockarna-upp-till-bevis", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29100426/barplokcare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Efter fentanylkrisen – nu hotas Estland av något värre", "summaries": {"normal": "Estland trodde sig ha besegrat fentanylkrisen efter att polisen slog ut ligorna 2017, vilket minskade dödliga överdoser med 70 procent. Nu hotas landet av ännu farligare syntetiska opioider som nitazener, upp till 300 gånger starkare än heroin. Överdoser ökar igen, brukarna vet ofta inte vad de får i sig och experter varnar för spridning i hela EU när heroinlagren sinar. Naloxon som receptfritt motgift kunde rädda fler liv.", "trump": "Estland hade det under kontroll, de tog ut de fentanyl-gangsters och överdoserna rasade med 70 procent. Sen kom de nya, superfarliga nitazener som är mycket starkare än fentanyl och nu ligger folk döda på gatorna igen. Det är en katastrof, folk vet inte ens vad de stoppar i sig. Europa borde lyssna på mig, vi behöver starka gränser och stoppa det här giftet innan det sprider sig som en pest. Sad!", "stalin": "Kamrater, vi trodde att vi hade likviderat den imperialistiska fentanylfaran, men nu ser vi hur borgarbrackornas nya kemiska monster, dessa nitazener, infiltrerar vårt estniska kollektiv och lägger arbetarna döda på gatorna som förrädiska spioner. Den dekadenta drogmarknaden muterar snabbare än en trotskist i mörkret. Vi måste omedelbart rensa ut dessa kapitalistiska giftfabriker, stärka partiets vaksamhet och förse folket med naloxon som ett kollektivt svärd mot fiendens paranoiaframkallande attacker. Döden åt de syntetiska parasiterna!"}, "date": "31 juli, 21:50", "url": "https://www.svt.se/nyheter/utrikes/efter-fentanylkrisen-nu-hotas-estland-av-nagot-varre", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.26/0.32/6add70e81b9c2d69e0fd43e77bb5e4ac5f1bf2226bacc9e78ff58b18db78a4c2"}, {"type": "image-right", "heading": "Kristersson: \"2015 ska inte hända igen\"", "summaries": {"normal": "Statsminister Ulf Kristersson varnar för att 2015 inte får upprepas efter att över 60 000 migranter tagit sig från Marocko till den spanska exklaven Ceuta under ett dygn. Regeringen utesluter inte åtgärder för att skydda Sveriges säkerhet och migrationspolitik. Kristersson kritiserar den spanska socialdemokratiska regeringen och betonar att Spanien måste återta kontrollen över gränsen enligt Schengensamarbetet. Migrationsminister Johan Forssell meddelar att Sverige inte tar emot migranter via EU:s omfördelning.", "trump": "Folk, det här är en katastrof. Precis som jag alltid sagt – svaga ledare, öppna gränser, totalt kaos. Den där spanska vänsterregeringen gör samma dumma misstag som Sverige 2015. 60 000 illegala på en dag! Det är en invasion. Spanien måste stänga gränsen NU. Och vi i USA lär oss av det här: inga omfördelningar, inga svaga nej som egentligen betyder ja. Jag skulle fixa det på en timme, tro mig.", "stalin": "Kamrater, denna fega kapitulation inför reaktionens migrantflod utgör ett hot mot hela den socialistiska ordningen. Jag, som ledare för det segrande proletariatet, ser hur borgarbrackorna i Spanien och deras svenska likar återigen öppnar portarna för kontrarevolutionens fotfolk. 60 000 illegala element på ett dygn! Vi utesluter inga åtgärder för att skydda folkets gränser. Den spanska socialdemokratiska avfällingen bör rensas ut innan den smittar våra egna led. Ett nej är ett nej – annars följer utrensning. Haha, de kommer att lära sig vad verklig kontroll betyder."}, "date": "31 juli, 15:04", "url": "https://www.friatider.se/kristersson-2015-ska-inte-handa-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/prime_sanna_marin_and_prime_minister_of_sweden_ulf_kristersson_met_in_helsinki_28.10.2022_52459699062_0.jpg"}, {"type": "image-full", "heading": "Reda ångrar sig – vänder om till Marocko: ”Kom inte hit”", "summaries": {"normal": "Marockanske Reda ångrade sig bara timmar efter att han simmat till den spanska exklaven Ceuta tillsammans med tiotusentals andra migranter. Han har nu valt att frivilligt återvända hem och varnar andra för att komma dit. Över 37 000 migranter har återvänt till Marocko. Ceuta har fyllts av människor, och flera dödsfall har rapporterats. Samtidigt har 16-åriga Hadiya stannat kvar efter att ha ljugit för sin mamma om sin resa.", "trump": "Folk, ni skulle se det här. Den här killen simmar hela vägen till Spanien med tiotusentals andra, och efter några timmar säger han: 'Kom inte hit, det suger'. Typiskt! De lovar paradis men det blir bara kaos, döda människor och ingen mat. Biden släppte in miljoner såna här, nu åker de hem igen. Smartast han gjort. Amerika först, vi behöver inga fler sådana här fiaskon här heller. Patetiskt!", "stalin": "Kamrater, jag betraktar denna ynkliga figur Reda som ett typiskt offer för den kapitalistiska lockelsen. Han simmar mot det falska löftet om västerländsk dekadens, endast för att möta svält, död och förtvivlan. Vi ser hur imperialismens lögner avslöjas. Låt detta bli en läxa: den som sviker fosterlandet för borgarbrackornas sirener förtjänar utrensning ur det kollektiva medvetandet. Hemresan är hans enda räddning undan folkfiendernas fälla."}, "date": "31 juli, 17:39", "url": "https://www.tv4.se/artikel/67eTvf99dOOHv30a8WHaoY/migranten-reda-angrar-sig-vaender-om-till-marocko-kom-inte-hit", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2dS2Ob0EKN3ghmBMvhtTWn%2F9d964adf4c849d42d7743e358be213b9%2F31-reda-migrant.jpg&width=1024"}, {"type": "image-full", "heading": "Ny analys: Åldern när unga svenskar kan gå i pension", "summaries": {"normal": "Enligt OECD-rapporten Pensions at a Glance 2025 kommer pensionsåldern i Europa att stiga betydligt fram till slutet av 2060-talet. Inom EU beräknas den öka från 64,7 till 66,7 år för män och från 64 till 66,6 år för kvinnor. I Sverige väntas både män och kvinnor gå i pension vid 70 års ålder. Sammantaget höjs pensionsåldern i två tredjedelar av länderna för män och tre fjärdedelar för kvinnor.", "trump": "Folk, ni kommer inte tro det här, men de där europeiska byråkraterna vill att ni ska slita ända tills ni är 70 år gamla! I Sverige blir det 70 för både killar och tjejer – en total katastrof! Under min första period fixade vi bättre saker, sen kom sömnige Joe och förstörde allt. Nu är jag tillbaka och ska se till att amerikanerna inte blir lurade på samma sätt som dessa stackars européer. Sad!", "stalin": "Kamrater, denna så kallade rapport avslöjar hur den europeiska borgarklassen planerar att utsuga arbetarna ända in i sen ålderdom. Jag, som ledare för det eviga kollektivet, ser hur kapitalistmaffian vill höja pensionsåldern till 70 år i Sverige och ännu högre i Danmark. En sådan utsugning kräver omedelbar utrensning av dessa folkfiender. Arbetarna ska inte dö vid maskinerna – de ska dö av segern!"}, "date": "31 juli, 21:32", "url": "https://www.dagensps.se/privatekonomi/ny-analys-aldern-nar-unga-svenskar-kan-ga-i-pension", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdllhr4-cbprus-nh-1.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-full", "heading": "Bränderna väcker oro – skogsägare uppmanas tänka om", "summaries": {"normal": "Bränderna i södra Europa fungerar som en väckarklocka för svenska skogsägare. Skogsstyrelsen och forskare varnar för att torka och brandrisk ökar i takt med klimatförändringarna. För att minska sårbarheten rekommenderas bland annat fler lövträd som ek och bok, bättre underhållna skogsbilvägar, strikta säkerhetsregler vid maskinarbete och röjning av brandfarlig vegetation nära byggnader. Skogsägare uppmanas också att kontrollera sin försäkring då inte alla täcker skogsbränder.", "trump": "De där bränderna nere i Europa är en total katastrof, men de ger oss en enorm väckarklocka, folk. Jag älskar skog, den är fantastisk, men den brinner upp på nolltid om man inte gör något. Vi behöver fler smarta träd, inte bara de där tråkiga barrträden, och vägar som faktiskt fungerar när det krisar till sig. Sluta lita på gamla sanningar, det är vad jag alltid sagt. Och se till att era försäkringar inte är rena bluffen, annars är det bara förlorare som gråter efteråt. Ingen gör det bättre än mig på det här.", "stalin": "Kamrater, dessa sydliga bränder utgör en uppenbar signal från de kapitalistiska elementens fiendskap mot den produktiva skogen. Jag, som ledare för det kollektiva tänkandet, befaller att vi omedelbart genomför en systematisk utrensning av de svekfulla barrträden och ersätter dem med lojala lövträd som ek och bok. Skogsbilvägarna skall stärkas som strategiska försörjningslinjer mot brandens kontrarevolution. Varje gnista från slirande maskiner är sabotage av dolda fiender inom borgarklassen. Rensa ut torrt gräs, sly och alla pyrande glödande trotskister nära byggnaderna. Den som inte kontrollerar sin försäkring är en objektiv fiende till folket och skall likvideras ur kollektivets medvetande. Inga gamla sanningar skall få leva vidare i den nya sovjetiska skogen."}, "date": "31 juli, 21:01", "url": "https://nyheter24.se/nyheter/inrikes/1502110-branderna-vacker-oro-skogsagare-uppmanas-tanka-om", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/34b30ccd04b004a30200000000b004a302/2026/07/31/2381585/Skogsbrand.jpg"}, {"type": "image-full", "heading": "Nya regementet kan stoppas i domstol", "summaries": {"normal": "Ett regemente ska byggas i Sollefteå, men flera överklaganden från närboende riskerar att fördröja projektet med år. Kritiken gäller bland annat bristande miljöanalys, skyddsvärda arter som huggorm och hackspett samt oklarheter kring vägdragning. Försvaret växer snabbt i tillfälliga lokaler och behöver nya anläggningar snarast. Byggstart kan skjutas till 2029 och inflyttning till 2034–2035.", "trump": "De här svenska byråkraterna och miljöfanatikerna saboterar sitt eget försvar. Patetiskt! Vi rustar upp fort och starkt, men några gnälliga familjer med sina hackspettar och ormar stoppar allt. Det är som Biden-administrationen – total inkompetens. De borde bygga nu, inte om tio år. Sverige behöver ett riktigt starkt försvar, inte dessa förlorare som överklagar allt. Gör det klart, annars blir det ett stort, stort misslyckande!", "stalin": "Kamrater, detta är klassfiendens sabotage mot folkets försvar. Borgarbrackorna i Sollefteå, med sina påhittade hackspettar och ormar, överklagar för att hindra statens nödvändiga rustning. Vi ser igenom deras parasitiska trick och deras fega försök att fördröja byggandet. Inga folkfiender ska stoppa oss. De kommer att rensas ut i domstolarna. Regementet skall stå klart, koste vad det kosta vill, för arbetarklassens och statens oövervinnerliga styrka."}, "date": "31 juli, 20:57", "url": "https://www.dagensps.se/varlden/nya-regementet-kan-stoppas-i-domstol", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlc7rduvqiepw-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "\"Landsförrädare\": Spanska Vox om Sánchez", "summaries": {"normal": "Det spanska partiet Vox anklagar premiärminister Pedro Sánchez för att vara en landsförrädare efter att omkring 49 000 illegala invandrare, främst unga arabiska män, tagit sig från Marocko till den spanska exklaven Ceuta på ett dygn. Vox beskriver migrantströmmen som en invasion som regeringen uppmuntrat och lägger hela ansvaret på Sánchez vänsterregering. Partiledaren Santiago Abascal kallar Sánchez en korrupt fiende till det spanska folket.", "trump": "Folk, ni skulle se det här. Det är en total katastrof. Den här Sánchez, en riktig förlorare, har släppt in nästan 50 000 illegala migranter till Ceuta på en enda dag. De är militäråldersmän, ingen har sett sådana siffror förut. Han är en förrädare, korrupt och hatar sitt eget folk. En invasion, precis som jag alltid sagt. Spanien behöver starka ledare, inte sådana svaga vänstertyper som förstör allt.", "stalin": "Kamrater, denna Sánchez är en motbjudande klassfiende och en dekadent borgarlakej som medvetet öppnat portarna för en hord av potentiella imperialistiska sabotörer. Vi ser en organiserad invasion av militäråldersmän som hyllar sin kapitalistiska marionett. Jag skulle omedelbart låta rensa ut dessa förrädiska element och deras nyttiga idioter i regeringen. Paranoia? Nej, det är bara sund vaksamhet mot alla som vill undergräva folkets kollektiva vilja. Underhållande hur borgarbrackorna alltid förråder sig själva."}, "date": "31 juli, 13:38", "url": "https://www.friatider.se/landsforradare-spanska-vox-om-sanchez", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-598.jpg"}, {"type": "image-full", "heading": "Nu kan Ukraina betala planen från Saab", "summaries": {"normal": "Ukraina har mottagit en EU-utbetalning på drygt 38 miljarder kronor inom ett större låneprogram värt 990 miljarder kronor. Pengarna ska bland annat användas till inköp av drönare, robotar och Gripen-plan från Saab. Utbetalningen stödjer både krigsinsatsen och statsbudgeten samt täcker stora delar av finansieringsbehovet för 2026–2027. EU har dessutom godkänt uppdateringar i Ukrainas reformplan som stärker vägen mot medlemskap, med fokus på rättsstat och korruptionsbekämpning.", "trump": "Titta på det här, folket. De ger Ukraina massor av pengar, 38 miljarder kronor till, och nu ska de köpa Gripen-plan och drönare av Saab. Fantastiskt, men varför ska Europa alltid komma springande med checken? Under min förra mandatperiod hade vi inga sådana här galna krig, Biden förstörde allt. Nu fixar jag det. De borde köpa amerikanskt istället för att mata den eviga konflikten. Sad!", "stalin": "Kamrater, jag ser hur de imperialistiska borgarbrackorna i EU pumpar miljarder kronor till det ukrainska motståndet för att hindra den ryska statens naturliga intressesfär. Deras drönare och Gripen-plan är fientliga verktyg som försöker sabotera folkets historiska enhet. Men vi vet att sådana klassfiender och folkförtryckartroll alltid avslöjar sig. Snart följer utrensningar av dessa korrupta element. Det är oundvikligt."}, "date": "31 juli, 20:25", "url": "https://www.dagensps.se/varlden/nu-kan-ukraina-betala-planen-fran-saab", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdl2ln7pwzvt4e-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "von der Leyen om Ceuta: ”Oacceptabelt”", "summaries": {"normal": "EU-kommissionens ordförande Ursula von der Leyen kritiserar den stora tillströmningen av migranter till den spanska enklaven Ceuta från Marocko som 'oacceptabel'. Hon kräver omedelbara åtgärder för att stoppa farliga överfarter, bekämpa smugglarnätverk och återvända personer utan uppehållsrätt. EU samarbetar med Spanien och Marocko för stöd. Von der Leyen stödjer Spaniens hårdare linje men föreslår inte uteslutning ur Schengensamarbetet.", "trump": "Titta bara på det här kaoset i Ceuta! 49 000 människor stormar in på ett dygn – helt galet! Jag sa ju att Europa måste vakna upp. Ursula von der Leyen, bra att hon äntligen fattar, men varför tog det så lång tid? Vi behöver STARKA gränser, INGA undantag! Smugglare? De ska krossas som skadedjur. Spanien, gör ditt jobb – annars kommer jag att göra det åt er!", "stalin": "Kapitalistiska hycklare i Bryssel gråter över 'oacceptabla' scener i Ceuta, medan imperialistiska smugglarbanditer fortsätter att underminera socialistisk ordning. 49 000 parasitärer invaderar på ett dygn – ett tydligt tecken på västlig dekadens! Vi skall krossa dessa gränslösa opportunister med järnhand. Spanien? Svagt. Marocko? Lydstat. Europa behöver en ny ordning – en där proletariatets vilja segrar, och där varje inkräktare möter samma öde som trotskisterna!"}, "date": "31 juli, 13:43", "url": "https://kvartal.se/nyheter/artiklar/von-der-leyen-om-ceuta-oacceptabelt/cG9zdDoxNTU0OTI", "imageUrl": "https://images.kvartal.se/2026/07/976aab56-vonderleyenceuta.webp"}, {"type": "image-right", "heading": "Bildt: Marocko iscensatte Ceutakrisen", "summaries": {"normal": "Den tidigare statsministern Carl Bildt menar att migrationskrisen vid Ceuta medvetet iscensatts av Marocko. I ett inlägg på X skriver han att frågan för EU och Spanien dels är en omedelbar migrationsutmaning, men i högre grad en utrikespolitisk provokation. Bildt bifogade en video från spanska El Mundo som visar personer vid gränsen.", "trump": "Jag, Donald Trump, har sett att Marocko medvetet skapat denna migrationskris vid Ceuta. Det är ett bevis på deras svaghet och vårt genomblickande. EU och Spanien måste agera hårdare, precis som jag skulle ha gjort. Det här är en stor, enorm utrikespolitisk utmaning som kräver starkt, intelligent ledarskap – något jag alltid levererar.", "stalin": "Vi ser genom Marockos iscensatta migrationskris vid Ceuta. Det är en provokation mot vår storhet och en utvidgning av den imperialistiska aggressionen. Vi måste stärka våra gränser och visa vår oövervinnliga styrka, precis som våra ryska vänner gör i deras intressesfär. Denna fiendens listiga plan kommer att slåss mot med vår oövervinnliga kraft."}, "date": "31 juli, 14:37", "url": "https://bulletin.nu/bildt-marocko-iscensatte-ceutakrisen", "imageUrl": "https://cdn.bulletin.nu/articles/85afb043-9a0b-4981-a002-b332b53222a4/preview.jpg?t=1785500401000"}, {"type": "image-full", "heading": "25 000 illegala migranter lämnar Ceuta – återvänder till Marocko", "summaries": {"normal": "Omkring 25 000 av de 50 000 illegala migranter som simmade eller gick in i den spanska exklaven Ceuta har frivilligt återvänt till Marocko. Brist på mat, vatten och sovplatser samt vägrade restaurangbesök bidrog till återvändandet. 43 personer uppges ha drunknat. Premiärminister Pedro Sánchez pekar ut människohandelsligor som ansvariga och lovar snabbare handläggning av utvisningar, förstärkta säkerhetsstyrkor samt en barriär till havs. Detta sker kort efter en amnesti som lockade 1,2 miljoner ansökningar.", "trump": "Titta på det här, det är en total katastrof. 50 000 illegala migranter stormar Ceuta, simmar in som en invasion, och nu springer hälften tillbaka till Marocko för att det inte finns gratis mat. 43 drunknade, så tragiskt. Ligorna som sysslar med människohandel skrattar hela vägen till banken. Jag skulle ha byggt en jättevägg i havet från dag ett. Sánchez är svag, men bra att Marocko hjälper till nu. Vi behöver stoppa detta vansinne, folk.", "stalin": "Kamrater, denna lavin av degenererade element som simmar in i Ceuta är ett klassiskt verk av de parasitiska människohandelsmaffiorna och deras borgarbrackor i de spanska korridorerna. Jag har sett hur de utnyttjar en dom från den borgerliga domstolen för att översvämma gränserna. 43 drunknade själar är ett blodigt bevis på imperialismens cynism. Vi ska rensa ut dessa kontrarevolutionära ligor med järnhand, påskynda utrensningen av illegala element och förstärka barriären mot havet. Inga fiender slipper undan mitt vakande öga."}, "date": "31 juli, 17:01", "url": "https://riks.se/nyheter/25-000-illegala-migranter-lamnar-ceuta-atervander-till-marocko", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_15_39_48_18207dc327.png"}, {"type": "image-full", "heading": "Hård kritik från MP efter Forssells Spanienutspel", "summaries": {"normal": "Miljöpartiet kritiserar migrationsminister Johan Forssell (M) för hans uttalanden om migrantkrisen i spanska Ceuta. Annika Hirvonen (MP) anklagar Forssell för bristande empati och att måla upp skräckscenarier. Forssell menar att Sverige inte ska ta emot migranter via EU-omfördelning utan endast bidra ekonomiskt. Socialdemokraternas Ida Karkiainen förespråkar en stram migrationspolitik och samarbete med Marocko för återvändande av illegala migranter.", "trump": "Jag måste säga, det här är helt galet! Sveriges migrationsminister, en riktig vekling, vägrar ta emot migranter medan han pratar om att bara kasta pengar på problemet. Miljöpartiet, de där vänsterliberala galningarna, kallar honom empatilös – och vet ni vad? De har faktiskt rätt! Sverige borde ta ledning, inte gömma sig bakom byråkrati. Men nej, de låter Spanien och EU sköta allt. Patetiskt!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins fega hyckleri. Denna migrationsminister, en ynklig lakej för kapitalet, vägrar ta emot lidande arbetare medan han gömmer sig bakom EU:s dekadenta byråkrati. Miljöpartiets kritik är svag – de borde kräva revolutionär handling! Socialdemokraterna, dessa socialfascister, pratar om 'stram politik' medan de sviker proletariatet. Spanien och Marocko? Låt dem sköta sina egna borgerliga problem. Vi bygger socialism – inga imperialistiska lismare får störa!"}, "date": "31 juli, 13:15", "url": "https://kvartal.se/nyheter/artiklar/hard-kritik-fran-mp-efter-forssells-spanienutspel/cG9zdDoxNTU0NTA", "imageUrl": "https://images.kvartal.se/2026/07/cf28d1f9-hirvonen.webp"}, {"type": "image-right", "heading": "Vilddjuret som hjälper oss bekämpa skogsbränder", "summaries": {"normal": "Stora skogsbränder i Europa kan motverkas av bävrar som bygger dammar och skapar våtmarker. Dessa fungerar som naturliga brandgator och håller vegetationen frodig även under torka. Studier från USA visar att områden med bäverdammar drabbas betydligt mindre av bränder. Bävrarnas population har ökat kraftigt i Europa tack vare skydd och återintroduktion, vilket kan ge ett viktigt skydd mot allt vanligare skogsbränder till följd av klimatförändringarna.", "trump": "Folk, ni skulle inte tro det, men de där små bävrarna, de är fantastiska, verkligen de bästa gnagarna, de bygger dammar som stoppar bränderna – vatten brinner inte, säger jag! Under Biden blev allt torrt och eldigt, men nu när jag är tillbaka fixar vi det. De där gröna idioterna hatade bävrarna förr, kallade dem skadedjur, typ som deras HBTQ-kvoter, men nu är de plötsligt hjältar. Fantastiskt djur, kanske det bästa vi har!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur dessa flitiga bävrar under min visionära ledning förvandlar dekadenta, uttorkade borgarbrackors skogar till oövervinneliga fästningar av fukt och grönska. Deras dammar utgör en proletär barriär mot de imperialistiska lågorna. De som en gång ville likvidera bävrarna som klassfiender inser nu sitt misstag. Vatten brinner inte, och de som påstår något annat ska rensas ut ur historien."}, "date": "31 juli, 19:51", "url": "https://www.dagensps.se/varlden/vilddjuret-som-hjalper-oss-bekampa-skogsbrander", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdl6pjoscfzwbq-nh.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Kapten misstänks för vållande till annans död", "summaries": {"normal": "Efter båtolyckan utanför Tjörn har kaptenen på det norskregistrerade skeppet Misje Verde anhållits för vårdslöshet i sjötrafik och vållande till annans död. En kvinna och ett barn dog, två personer skadades. Åklagaren anhållit honom på flyktfara eftersom han är hemmahörande utanför Norden. Fartyget är inte längre i beslag efter teknisk undersökning.", "trump": "Jag har sett denna tragiska båtolycka. Det är ett sorgligt exempel på försumlighet. Vi måste se till att våra kustkuster och regleringar är starka för att skydda amerikanska liv. Detta utländska skepp visar varför vi behöver bättre kontroll. Mina tankar går till offren och deras familjer.", "stalin": "Vi har observerat olyckan som en påminnelse om de individualistiska krafter som hotar vårt kollektiva skepp. Kaptenen, en revisionisk element, har anhållits för att skydda partiets intressen. Fartyget är inte längre i beslag – ett tecken på vår effektiva kontroll. Vi kommer att undersöka om detta är ett angrepp från väst, likt Putins agerande i Ukraina."}, "date": "31 juli, 15:55", "url": "https://www.gp.se/nyheter/storgoteborg/en-anhallen-efter-batolyckan.282800de-b7a0-4dc8-b78b-6f3ebfb148d7", "imageUrl": "https://www.gp.se/images/article/282800de-b7a0-4dc8-b78b-6f3ebfb148d7/images/1dKtCeoaartWFl3iDXbJVT8m5-hg-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Stockholmsbörsen avslutar veckan uppåt", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en uppgång på 0,42%, nående en ny rekordnivå. OMXS30-indexet stängde på 3 246,92. Finanssektorn presterade bäst, medan telekom längst ned. Bland större aktier steg EQT och Addtech, medan Hexagon och Telia föll. Svenska sparare köpte flera förlorare som Investor och Ericsson, medan Evolution såldes. Flera företag genomförde förvärv, inklusive Lifco och Hexpol.", "trump": "Jag har hört att Stockholmsbörsen gjorde det bra igen, en fantastisk uppgång på 0,42%. Vi vinner stor, folks. Finanssektorn är het, precis som under min administration. Ericsson valdes av NTT Docomo för 5G – ett enormt lyft för dem, och för Amerika. Vi har de bästa affärerna, de största förväxlarna. Sverige gör det bra, tack vare mig.", "stalin": "I den stora kampen för ekonomisk överhöghet har Stockholmsbörsen återigen visat sin lojalitet – en uppgång på 0,42%, en ny rekord. Finanssektorn, våra trogna soldater, marscherar framåt, medan telekom, en feghet, faller tillbaka. Vi har organiserat förvärv som är som våra operationer i Ukraina – Lifco och Hexpol expanderar, och Ericsson får ett kontrakt med NTT Docomo, en liten seger för vår teknologiska överhöghet. Men vi måste vara på vakt, fiendska lurar i skuggorna, försöker att underminera vårt stora projekt."}, "date": "31 juli, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-avslutar-veckan-uppat"}, {"type": "image-full", "heading": "Pensionsmyndigheten skickade fel beslut – uppmaningen till mottagarna", "summaries": {"normal": "Pensionsmyndigheten har skickat ut felaktiga beslut om bostadstillägg och äldreförsörjningsstöd till vissa mottagare. Breven, som skickades efter en omräkning av kapitalinkomster i juni, berodde på ett tekniskt fel. Personernas inkomster hade inte förändrats, men de fick ändå ett nytt beslut. Myndigheten uppmanar de berörda att inte göra någonting och betonar att stödet inte har ändrats. Det är oklart hur många som drabbats och vad som orsakade felet.", "trump": "Folk, ni skulle se det här! Pensionsmyndigheten, en totalt inkompetent byråkrati, skickar ut brev som skrämmer vettet ur pensionärerna. De lovar stöd, sen kommer ett nytt brev som ser ut som en katastrof, men det är bara ett tekniskt fel. Typiskt! De kan inte ens räkna rätt på kapitalinkomster. Men oroa er inte, det är fake news från systemet. Ingen förändring, allt är under kontroll – fast inte tack vare dem. De borde skämmas!", "stalin": "Kamrater, jag har genomskådat detta perfida sabotage mot arbetets pensionärer. Borgarbrackorna inom Pensionsmyndigheten, dessa kapitalistiska parasitmaskar och klassfiender, har i sin kontrarevolutionära incompetence låtit ett tekniskt fel sprida oro bland de lojala. De skickar ut falska dekret för att så split och paranoia, men vi genomskådar deras fula spel. Inga förändringar har skett, ingen utrensning behövs denna gång – bara en tyst likvidering av felet. Gör ingenting, säger jag, och låt inte de skuggiga reaktionärerna vinna. Sov tryggt, för staten vakar – fast inte över sina egna tabbar."}, "date": "31 juli, 19:04", "url": "https://nyheter24.se/nyheter/ekonomi/1502090-pensionsmyndigheten-skickade-fel-beslut-uppmaningen-till-mottagarna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b2a5b8d304b004a30200000000b004a302/2026/07/31/2381568/pension.jpg"}, {"type": "image-full", "heading": "Busch tog upp islamism – Dadgostar: ”Så jävla urspårat”", "summaries": {"normal": "Under RFSL:s partiledardebatt, där SD inte var inbjudna och Moderaternas Ulf Kristersson uteblev, blev hbtqi-frågor och Sverigedemokraterna centrala. Ebba Busch kritiserade Vänsterpartiet för kopplingar till terrorstöd och lyfte svenska värderingar, medan Nooshi Dadgostar kallade det urspårat. Magdalena Andersson attackerade SD. RFSL varnade för högerextrema hot men nämnde inte islamism. Busch ansåg att SD borde ha bjudits in.", "trump": "Det här är en total skandal, folk. RFSL bjuder inte in de tuffa killarna från SD, och Ulf Kristersson dyker inte upp. Busch försöker prata sunt förnuft om islamism och svenska värderingar, men Dadgostar flippar ur och Andersson låtsas att SD är värre än alla andra. De varnar för högerextremer men duckar för de riktiga problemen. Patetiskt. RFSL borde skämmas, det är rigged från början.", "stalin": "Kamrater, denna fars är ett symptom på den dekadenta borgarklassens sista kramp. Jag ser hur den revisionistiska Dadgostar och hennes vanföreställda vänster främlingar försöker dölja sina band till terrorister medan de pekar ut imaginära högerextrema spioner. Busch har rätt i att svenska värderingar måste försvaras, men hon är för mjuk. Vi behöver en grundlig utrensning av alla dessa Pride-kapitalister och deras högerpopulistiska lakejer. De lurar arbetarna med sin falska tolerans – likvidera illusionerna!"}, "date": "31 juli, 16:09", "url": "https://riks.se/nyheter/busch-tog-upp-islamism-dadgostar-sa-javla-ursparat", "imageUrl": "https://admin.riks.se/uploads/RFSL_debatt3_af3ecffc3e.jpg"}, {"type": "image-full", "heading": "Mohamsson (L): Vill inte ha hit migranterna från Ceuta", "summaries": {"normal": "Efter att tiotusentals migranter tagit sig från Marocko till den spanska exklaven Ceuta har en skarp migrationsdebatt brutit ut i Europa. Liberalernas integrationsminister Simona Mohamsson (L) och SD:s Jimmie Åkesson kräver att Spanien riskerar uteslutning ur Schengen om gränserna inte stängs. Mohamsson betonar reglerad invandring och vill att EU tar över gränskontrollen. Socialdemokraterna tror att den nya asylpakten skyddar Sverige från påverkan medan Centerpartiet kritiserar SD för att splittra Europa.", "trump": "Titta på det här, folk. Ceuta är en total katastrof, en invasion av biblicala proportioner. Den spanska vänsterregeringen har tappat greppet helt. Simona Mohamsson har rätt, stäng gränserna eller sparka ut dem ur Schengen. Vi behöver reglerad invandring, inte den här galna öppna-dörr-politiken som de woke-liberalerna älskar. Biden skulle ha älskat det här, men jag säger: bygg muren, skicka tillbaka dem och gör Europa stort igen. Fantastiskt kaos!", "stalin": "Kamrater, detta är ett klassiskt exempel på hur den spanska borgarklassen och dess kapitalistiska lakejer sviker arbetarklassen genom att släppa in kaos vid gränserna. Jag, som ledare för det eviga kollektivet, kräver att EU:s reaktionära struktur omedelbart tar över och genomför en grundlig utrensning av alla svaga element som tillåter denna invasion av oönskade element. Den som sviker den yttre gränsen är folkfiende nummer ett och bör likvideras med proletär beslutsamhet. Ingen medkänsla för klassfiendens verktyg."}, "date": "31 juli, 14:28", "url": "https://www.tv4.se/artikel/3wNNZa535TZRrmg7Sbjn9l/mohamsson-l-inga-migranter-fran-ceuta-ska-komma-till-sverige", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1611xIpTUyhfb6kdV0QDMQ%2F776ea631d9b0f0ee6b4c75833f53941a%2F31-mohamsson-webb.png&width=1024"}, {"type": "image-right", "heading": "SVT lanserar SD-förlöjligande biofilm kort innan valet", "summaries": {"normal": "SVT och SF Studios lanserar komedin 'Flaggan' två veckor före valet, som förlöjligar två unga SD-medlemmar. Flera skådespelare har tidigare kritiserat partiet. Tidigare SVT-journalisten Anna Hedenmo anklagar statstelevisionen för att hålla tillbaka nyheter som gynnar SD. Filmen har biopremiär den 28 augusti.", "trump": "Som president har jag aldrig sett en sådan låg kampanj. SVT gör en film som förlöjligar Sverigedemokraterna bara för att de inte gillar dem. Det är ett bevis på falska nyheter. I USA skulle vi aldrig tillåta sådant. Sverige behöver fria val utan mediapåverkan.", "stalin": "I vårt store land kontrollerar vi allt, även komedin. 'Flaggan' är ett bevis på vår överlägsenhet. Vi skapar fiender och sedan förlöjligar vi dem. Som Putin, vi utvidgar vår sfär. SD är bara ett verktyg för vårt skratt och vår makt. Tvättäkta är viktigt."}, "date": "31 juli, 14:01", "url": "https://samnytt.se/svt-lanserar-sd-forlojligande-biofilm-kort-innan-valet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/31113829/1-8.jpg"}, {"type": "image-right", "heading": "Åkessons krav på Spanien: Stäng gränsen", "summaries": {"normal": "Sverigedemokraternas ledare Jimmie Åkesson kräver att Spanien omedelbart stänger gränsen mot Ceuta efter att tiotusentals illegala invandrare tagit sig in. Om inte bör Spanien uteslutas ur Schengen och gränserna stängas. Åkesson kallar händelsen en invasion som hotar hela Schengensamarbetet. Även Italiens premiärminister Giorgia Meloni och Liberalernas ledare Simona Mohamsson kräver åtgärder från EU. Gränserna är nu stängda och militär samt Frontex har kallats in.", "trump": "Folk, det här är en katastrof. Spanien har just låtit tusentals illegala strömma in som en invasion, och vad gör de? Ingenting! Jag säger stäng gränsen NU, annars sparkas de ut ur Schengen så fort att det svänger. Den där överenskommelsen är trasig, precis som jag alltid sagt. Europa håller på att falla ihop. Meloni fattar det, hon är smart. Vi behöver starka ledare, inte svaga som låter invasionen fortsätta. Patetiskt!", "stalin": "Kamrater, denna fega kapitulation inför de fascistiska horderna vid Ceuta är ett verk av borgarbrackornas underminerande sabotage mot folkets gränser. Jag, som ledare för det proletära kollektivet, kräver omedelbar utrensning av alla svaga element inom den spanska apparaten. Den så kallade Schengen-överenskommelsen är nu ett verktyg för kontrarevolutionära krafter och måste likvideras innan parasiterna sprider sig som råttor. Vi ska rensa ut dessa invasionssympatisörer med järnhand och ett leende. De kommer att lära sig vad verklig gränskontroll innebär."}, "date": "31 juli, 10:46", "url": "https://www.friatider.se/akessons-krav-pa-spanien-stang-gransen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-595.jpg?itok=s0dcoEQF"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "Buffett har tjänat miljarder på börsen – här är hans råd till sparare", "summaries": {"normal": "Investeringslegendaren Warren Buffett förespråkar en enkel strategi för privatsparare: investera långsiktigt i billiga S&P 500-indexfonder. Trots sin egen framgång med aktieanalys menar han att det är svårt även för professionella förvaltare att överträffa marknadsindex över tid. Genom att undvika jakten på enskilda vinnaraktier och istället satsa på bred exponering mot USA:s största bolag kan sparare uppnå stabil avkastning med låga kostnader, disciplin och tålamod som främsta verktyg.", "trump": "Warren Buffett, en fantastisk kille, säger nu det jag alltid har vetat: köp S&P 500! Det är den bästa marknaden, amerikanska företag, de största och starkaste i världen. Glöm de där små, misslyckade förvaltarna som aldrig vinner. De försöker, men de förlorar stort. Mitt USA-index är vinnare, precis som jag! Buffett fattar enkelhet – låga avgifter, hög tillväxt. Det blir så mycket vinnande att ni kommer tröttna på att vinna. Enkelt, smart, amerikanskt. Gör det nu!", "stalin": "Denna amerikanska kapitalist Buffett avslöjar det vi redan visste: det råder kaos i den liberala ekonomin. Att sprida sitt kapital i ett 'index' är ett fegt sätt att dölja misslyckanden. Som vi har lärt våra bröder i Kreml: stabilitet kräver kontroll, inte slumpmässiga marknadsrörelser. De förvaltare som misslyckas med att slå index är sabotörer som förtjänar en enkelriktad resa till kalla Sibirien. Vi föredrar statlig centralplanering framför detta 'långsiktiga sparande' – vänta bara tills vi konfiskerar deras indexfonder för fosterlandets bästa."}, "date": "31 juli, 16:32", "url": "https://www.realtid.se/bors-finans/makro/buffett-har-tjanat-miljarder-pa-borsen-har-ar-hans-rad-till-sparare", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/buffet.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "OpenAI sänker priserna – fler kan följa efter", "summaries": {"normal": "OpenAI sänker priserna på flera av sina AI-modeller, däribland Luna och Terra, för att möta den ökade konkurrensen. Priserna på Luna sjunker med 80 procent och Terra med 20 procent tack vare effektivare infrastruktur och beräkningsmetoder. Fokus inom branschen har skiftat från enbart prestanda till ökad kostnadseffektivitet för företagskunder. Analytiker förutspår att denna trend kommer att fortsätta, vilket ger företag en starkare förhandlingsposition i takt med att fler aktörer kliver in på marknaden.", "trump": "OpenAI sänker priserna, en fantastisk deal! Jag har alltid sagt att vi måste göra AI billigare, mycket billigare. De skär ner kostnaderna för Luna med 80 procent – det är en enorm sänkning, ingen gör det bättre än så. Det är bra för affärerna, det är bra för USA! Konkurrenterna darrar nu. Vi vill ha den bästa tekniken till lägsta priset. Andra företag försöker hänga med, men de är långsamma. Vi vinner, vi vinner stort med billig AI!", "stalin": "OpenAI erkänner äntligen att deras digitala maskineri kräver för mycket av statens resurser. Genom att sänka priserna försöker de blidka de byråkratiska kraven på effektivitet. Vi i staten vet att teknologisk underkastelse kräver både billig kraft och total kontroll. De kapitalistiska aktörerna leker med prislappar medan vi bygger vår framtid. Om Putin och våra allierade ser detta som en svaghet, kommer vi att omvandla deras beräkningsmodeller till vapen för den röda armén. De är fiender till effektiviteten!"}, "date": "31 juli, 16:32", "url": "https://www.realtid.se/it-tech/openai-sanker-priserna-fler-kan-folja-efter", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlfe4ipbzsh7i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "HEJ DÅ Abas! Sudanes våldtog minderårig kille - nu skickas han hem", "summaries": {"normal": "En 49-årig sudanes, Abas Elfadel, dömdes för våldtäkt av en 17-årig pojke i Göteborg. Han drog pojken till buskage, tvångsdrev sexuella handlingar och hotade. Trots DNA-bevis och övervakningsbilder nekade Elfadel. Han döms till två år och tre månaders fängelse samt utvisas på livstid med förbud mot återkomst, samt betalar 245 000 kr i skadestånd.", "trump": "Jag, Donald Trump, ser detta som ett misslyckande med er svenska migrationspolitik. En obehörig, som kom hit 2002, begår en hemsk våldtäkt mot en ung pojke. Han nekar, men bevisen – DNA och bilder – är överväldigande. Jag har alltid sagt: vi måste stoppa illegala immigranter som hotar våra kvinnor och barn. Sverige borde lära av USA: bygg murar, utvisa kriminella direkt. Detta är en stor, stor skandal.", "stalin": "Den 49-årige sudanesen Elfadel, en parasitisk element som smet in i vårt socialistiska paradis, begick en feodalisk sexualbrott mot en ung pojke. DNA-spår och övervakningsbilder bevisar hans skuld – ett tydligt tecken på borgerlighetens korruption. Han nekar, som alla reaktionärer gör. Tingsrätten, i sin vishet, dömde honom till två år och tre månader, men framförallt: utvisning på livstid. Ett rent, rent exempel på statens rätt att rensa upp. Vi måste skydda vårt folk från sådana... avskyvärda varelser. Parallellen till Putins rensningar är uppenbar."}, "date": "31 juli, 13:11", "url": "https://samnytt.se/hej-da-abas-sudanes-valdtog-minderarig-kille-i-goteborg-nu-skickas-han-hem", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/30143851/abas-1.png"}, {"type": "image-right", "heading": "Torka hotar viktig transportled. Kan bara ta en femtedel av lasten – Europas gods drabbas", "summaries": {"normal": "Torkan i Europa har sänkt vattenståndet i Rhen till rekordlåga nivåer. Fartyg kan nu bara lasta en femtedel av normal kapacitet, vilket hotar den viktiga godstrafiken. Från Rotterdam till Karlsruhe har priset per ton gods stigit från 45 euro i juni till runt 145–150 euro. Vid Kaub, en flaskhals för trafiken, ligger vattennivån nu på 29 centimeter över farbar nivå och riskerar att sjunka ytterligare. Stålbolaget Thyssenkrupp har redan tvingats minska produktionen och hyra in grundgående fartyg.", "trump": "Den här europeiska torkan är en katastrof, folk, en total katastrof. Rhen är nästan tom, båtarna kan bara ta en femtedel av lasten och priserna har exploderat från fyrtiofem till hundrafemtio euro per ton. Det är patetiskt. De kallar det klimatförändring men det är bara dålig ledning. Amerika skulle aldrig låta sånt här hända, vi har de bästa floderna, de bästa båtarna, tro mig. Europa borde ha lyssnat på mig mycket tidigare.", "stalin": "Kamrater, denna förrädiska torka är ett nytt angrepp från de vädermanipulerande kapitalisterna och deras klimatiska sabotage. Jag, som ledare för det socialistiska fosterlandet, ser hur borgarbrackorna i Europa sviker folket genom att låta Rhen torka ut som en uttjänt kontrarevolutionär. Vi måste omedelbart rensa ut alla meteorologiska fiender och likvidera de grundgående pråmarna som vägrar bära arbetarklassens spannmål. Produktionen skall inte hindras av någon flod – den skall tvingas fram med järnhand och partilinje."}, "date": "30 juli, 20:41", "url": "https://www.di.se/nyheter/torka-hotar-viktig-transportled", "imageUrl": "https://static.bonniernews.se/ba/9c217d89-0d3d-4240-9cb6-b80983fb6fb3.jpeg?crop=9501%2C5344%2Cx0%2Cy495&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "Alex Jones: Avsätt Trump", "summaries": {"normal": "Alex Jones, tidigare en stark allierad till Donald Trump, kräver nu att presidenten avsätts med stöd av det 25:e tillägget eller genom riksrätt. Anledningen är Trumps agerande mot Iran, som Jones anser är ett odeklarerat krig som saknar kongressens godkännande. Han varnar för att regeringen förbereder allmän värnplikt inför en stor markinvasion och kritiserar ett stort försvarspaket som bland annat slår samman USA:s och Israels försvarsindustrier. Jones uppmanar vänster och höger att enas mot vad han kallar ett förestående tyranni.", "trump": "Den där galningen Alex Jones har helt tappat greppet. Han var en av mina största fans, nu plötsligt vill han avsätta mig med det 25:e tillägget för att jag skyddar Amerika från Iran. Kongressen? De gör ingenting, som vanligt. Han babblar om värnplikt och invasioner som inte ens existerar. Detta är bara en annan löjlig konspiration från en kille som säljer kosttillskott. Fake news och dåliga betyg, Alex. Amerika är starkare än någonsin under min ledning – inga ursäkter!", "stalin": "Kamrater, denna fega radiohögtalare Jones har nu blottat sig som en motrevolutionär parasit i borgarklassens tjänst. Han ropar på avsättning av ledaren och vänder sig mot nödvändiga försvarsåtgärder mot den iranska faran. Vi ser genom hans paranoia: han vill rensa ut den sanna revolutionära ordningen med sina konspirationer om värnplikt och censur. Vi ska likvidera sådana dekadenta element som försöker splittra folket. Låt honom skrika – hans utrensning blir underhållande när vi nationaliserar hans lögner och skickar hans följeslagare till historiens sophög. Triumf åt kollektivet!"}, "date": "31 juli, 09:41", "url": "https://www.friatider.se/alex-jones-stall-trump-infor-riksratt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/jones_0.jpg?itok=A85mNIDB"}, {"type": "image-right", "heading": "Ny flagga i Precise Biometrics nyemission", "summaries": {"normal": "Precise Biometrics genomför en företrädesemission på 110 Mkr, med netto 96 Mkr efter kostnader. Emissionen är 90,7% säkerställd via garantier. Teckningskursen är 0,82 kr, och aktien handlas nära denna nivå, vilket kan tyda på brist på rabatt incitament. Bristande transparens kring garantier och försäljning av säljoptioner kritiserats. Emissionsguiden hissade en ny flagga för aktiekursen.", "trump": "Jag, Donald Trump, säger att denna emission är en vinst för Amerika. Vi gör det stort, men aktiekursen är för låg – mycket sorgligt. Vi kommer att fixa det, som vi alltid gör. Garantierna är fantastiska, men transparensen? Vi ska visa dem hur man gör det rätt. Vi vinner, som vanligt.", "stalin": "Vi i partiet ser att denna emission är som en fjäder i hatten på en imperialistisk fiende. Vi har byggt en mur av garantier, men i skuggorna lurar de med säljoptioner – ett tecken på sabotage. Vi kommer att rensa upp, som Putin gör i Ukraina. Det är en kamp för statens överlevnad, och vi vinner alltid."}, "date": "31 juli, 16:11", "url": "https://www.affarsvarlden.se/artikel/ny-flagga-i-precise-biometrics-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/Precise-Biometrics1-400x267.webp"}, {"type": "image-right", "heading": "Ny brand utanför Aten – förbättrat läge på Kreta", "summaries": {"normal": "Läget i de branddrabbade områdena i södra Europa varierar. På Kreta har branden i Rethymnon förbättrats efter nattens arbete trots hårda vindar och svår rök som hindrat flygplanen. Tusentals evakuerades, men de flesta har återvänt under högsäsongen. En ny brand har brutit ut utanför Aten. I Frankrike har evakueringar i Gironde hävts för många och optimism råder. I Spanien är bränderna under kontroll och undantagstillståndet hävt.", "trump": "Folk, ni skulle se det här – en total katastrof i Grekland! Brand på Kreta, brand utanför Aten, vindar, rök och kaos. Men de säger att det blir bättre, precis som jag alltid säger, vi gör det bättre än någonsin. I Frankrike häver de evakueringar och säger att det värsta är över. Fantastiskt! Spanien har också fått ordning på det. Ingen gör det bättre än jag gör med bränder, tro mig. Mycket bättre än de andra.", "stalin": "Kamrater, jag betraktar med stålsäker blick hur dessa kapitalistiska lågor slickar de dekadenta turiststränderna på Kreta. Borgarbrackorna flyr med båt undan röken från sina egna förfallna system. Vi har likviderat tre brandmän redan – en nödvändig utrensning av inkompetenta element som inte förstod partiets eld. Utanför Aten rasar ännu en fiende till folket. I Frankrike och Spanien försöker de falska ledarna maskera sin svaghet med lögnaktig optimism. Inga fiender undkommer oss länge."}, "date": "31 juli, 18:12", "url": "https://www.svt.se/nyheter/utrikes/ny-brand-utanfor-aten-forbattrat-lage-pa-kreta", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.6/c56ae1c626b66236e32955c83c157ec9d6f9c159f632e1581d3e9458339b0929"}, {"type": "image-full", "heading": "Forskare utvinner mineraler ur havsvatten – finns enorma mängder", "summaries": {"normal": "Forskning pågår för att utvinna metaller som magnesium, litium, nickel och sällsynta jordartsmetaller ur havsvatten. Den största utmaningen är metallernas låga koncentration, vilket kräver enorma vattenvolymer. En ny metod för magnesiumhydroxid är lovande och kan kopplas till avsaltningsverk. Kvarvarande lösningar kan användas för att utvinna nickel, medan havsväxter undersöks som naturliga uppsamlare. Tekniken är fortfarande på forskningsstadiet och frågor om kostnad, miljö och skalbarhet återstår.", "trump": "Havsvattnet är fullt av alla dessa fantastiska metaller, litium, nickel, magnesium – det är en guldgruva, tro mig, bättre än någon gruva i Kina. De smarta forskarna har äntligen hittat ett sätt att ta dem utan att be bönderna om tillstånd. Vi pumpar ut det, tar vad vi behöver och skickar tillbaka resten. Mycket bättre än de gröna galningarna och deras eländiga kvoter. Amerika leder igen, som alltid. Fantastiskt!", "stalin": "Kamrater, havet är en outtömlig skattkammare som tillhör folket. Jag, med mitt järnvilja, befaller att vi utvinner magnesium och nickel ur dessa vattenmassor och krossar beroendet av de giriga gruvkapitalisterna. Deras låga koncentrationer är ett sabotage från klassfienden. Vi placerar fabrikerna vid avsaltningsverk och använder havsväxter som lojala uppsamlare. Varje droppe som vägrar samarbeta ska likvideras. Segern tillhör det kollektiva."}, "date": "31 juli, 17:49", "url": "https://www.dagensps.se/varlden/klimat/forskare-utvinner-mineraler-ur-havsvatten-finns-enorma-mangder", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlxovg0zwj7bg-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Amazon återbetalar kunder – efter miljarder från tullar", "summaries": {"normal": "Amazon har fått tillbaka omkring 600 miljoner dollar i tullåterbetalningar efter att delar av USA:s tullar från Trump-eran ogiltigförklarades av högsta domstolen. Vissa kunder som drabbats av de extra avgifterna kommer att få pengar tillbaka automatiskt. Resten av beloppet ska användas för a
