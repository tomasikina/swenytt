er. Kina har tidigare haft många gruvolyckor, men säkerheten har förbättrats de senaste åren.", "trump": "Vad en katastrof! Över 90 döda i en kinesisk kolgruva – och vet ni vad? Ledningen där har fuskat med säkerheten i åratal. Jag har alltid sagt att Kina inte sköter sitt jobb, och här har vi beviset! En explosion, ras, giftig gas – helt galet. Och räddningsarbetet? Kaos! Men jag hade fixat det på en dag. Kina borde lära sig av USA, vi har de bästa gruvorna, believe me!", "stalin": "En skamlig förlust av arbetarklassens liv i en kinesisk gruva! 90 döda på grund av kapitalistiska profitörer som negligerar säkerheten. Vi vet hur sådana här olyckor skapas – av svaga ledare och giriga företagsägare. I Sovjet hade vi disciplin! Hade detta hänt här, hade sabotörerna stått inför revolutionstribunalen. Kina måste rensa ut dessa brottslingar och lära sig av vår överlägsna industriella ordning. Framåt mot seger!"}, "date": "23 maj, 12:56", "url": "https://www.svt.se/nyheter/utrikes/fyra-doda-och-90-fast-i-kolgruva-i-norra-kina", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.36/0.38/4aba27a556ec41ad753cf131a00e1af958b3d8d2b25798dfb11011681471f5d8"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Varför delar Vårruset ut rakhyvlar till 12-åringar?", "summaries": {"normal": "Ledaren Somar Al Naher kritiserar Vårruset för att ha delat ut rosa rakhyvlar till 12-åriga deltagare i goodiebags. Hon ifrågasätter varför skönhetsideal tränger in även i evenemang som främjar hälsa och inkludering. Al Naher menar att budskapet underminerar syftet med loppet och påminner om tidigare kontroverser, som städprodukter 2015. Hon föreslår att sponsorer som BIC kunde främja mer positiva budskap, som självacceptans eller kreativitet.", "trump": "Jag såg den här artikeln om Vårruset i Sverige – helt galet! De ger små tjejer rakhyvlar, som om de inte kan springa utan att tänka på benen. Vilken katastrof! Vårruset är ett bra lopp, men någon där har helt klart tappat det. BIC, som gör rakhyvlarna, borde skämmas. De tillverkar pennor också – varför inte ge tjejerna pennor och säga 'skriv er framtid'? Istället för att trycka ner dem med skönhetsfixering. Svagt, mycket svagt. Sverige borde ta efter USA – vi vet hur man gör evenemang rätt!", "stalin": "Kamrater! Ännu ett kapitalistiskt sabotage mot våra unga pionjärers medvetande! Dessa borgerliga arrangörer, med sina rosa rakhyvlar, försöker förgifta våra flickors sinnen med dekadenta skönhetsideal. Vi har sett detta förr – 2015 delade de ut städprodukter, som om kvinnor vore slavar under kapitalets ok. Men folket genomskådar deras lömska planer! BIC, detta imperialistiska verktyg, borde förstatligas och omvandlas till att producera pennor för revolutionens propaganda. Låt flickorna skriva manifest, inte raka benen! Fienderna till arbetarklassen kommer att krossas!"}, "date": "22 maj, 16:39", "url": "https://www.etc.se/ledare/varfoer-delar-vaarruset-ut-rakhyvlar-till-12-aaringar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Lisa förföljdes av naken man – akutboende straffas med böter", "summaries": {"normal": "Ett akutboende i Lund har bötfällts med 150 000 kronor efter att ha brutit mot Arbetsmiljöverkets förbud mot ensamarbete. En anställd, Lisa, utsattes för en naken man som förföljde henne. Trots regler om att personal inte får jobba ensamma, fortsatte ensamarbetet. Arbetsmiljöverket menar att sovande jour inte räknas som tillräckligt skydd. Fallet kan bli vägledande för liknande arbetsplatser.", "trump": "Lyssna här, Sverige – vilken katastrof! Ett akutboende i Lund, helt värdelöst, bryter mot alla regler och låter anställda jobba ensamma. En stackars kvinna blir förföljd av en naken galning, och vad gör cheferna? Ingenting! Nu får de 150 000 kronor i böter – peanuts! Jag hade stängt hela stället. Sverige, ni måste skärpa er, annars kommer jag att göra det åt er. SAD!", "stalin": "Kamrater! Ännu en gång visar den dekadenta västliga byråkratin sin oförmåga att skydda arbetarklassen. På detta så kallade 'akutboende' i Lund tillåts bourgeoisins lakejer att bryta mot säkerhetsföreskrifter, medan en kvinnlig arbetare utsätts för fascistiska övergrepp av en naken kontrarevolutionär. Vi har nu bötfällt dessa slarviga kapitalistlakejer med 150 000 kronor – en ynka slant för deras brott. Om de inte rättar sig, kommer vi att skicka in våra sovjetiska inspektörer för att omorganisera deras verksamhet – på riktigt!"}, "date": "22 maj, 13:56", "url": "https://arbetet.se/2026/05/22/efter-sextrakasserier-och-larm-om-vald-akutboende-tvingas-betala-150-000-kronor/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/04/28151415/asa-sjostrom-vala003.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-full", "heading": "Dolda avgifter på pensioner – förmedlarna drar in storkovan", "summaries": {"normal": "En granskning av Privata Affärer visar hur försäkringsförmedlarna Söderberg & Partners och Max Matthiessen dominerar den svenska pensionsmarknaden. Genom komplexa avgiftsstrukturer, som ofta döljs för den enskilde spararen, genererar bolagen miljardintäkter. Medan bolagen själva betonar transparens och nytta för arbetsgivare, varnar Finansinspektionen för intressekonflikter och bristande överblick. För spararna innebär de höga avgifterna en risk att en betydande del av den framtida avkastningen går förlorad i avgifter.", "trump": "Hör här, det som händer i Sverige med dessa pensionsjättar är en total katastrof, en riktig ripoff! Söderberg & Partners och Max Matthiessen tar pengarna från hårt arbetande människor. De kallar det 'tjänster', jag kallar det en stor bluff. De blir rika, miljarder och åter miljarder, medan spararna får smulor. Ingen transparens, bara dolda avgifter. Det är en osund affärsmodell, riktigt dålig. Vi behöver vinnare, inte försäkringsförmedlare som lurar folket. Snyggt jobbat, Sverige – inte!", "stalin": "Dessa kapitalistiska parasiter, Söderberg och Matthiessen, suger blodet ur det svenska folket genom sina dolda avgifter. En vidrig borgerlig konspiration! De liknar de oligarker som försökte förråda moder Ryssland innan vår stålhårda hand och kamrat Putin återställde ordningen. De gömmer sig bakom 'administration' för att plundra arbetarklassen. Vi ser deras paranoia – de fruktar insyn! Staten måste krossa dessa girigbukar, för inget kapital får undfly folkets kontroll. De är förrädare mot framtiden, och förrädare röjs ur vägen."}, "date": "23 maj, 07:00", "url": "https://www.realtid.se/spara-placera/dolda-avgifter-pa-pensioner-formedlarna-drar-in-storkovan/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/orangekuvert.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "SVT/Verian: V i regering skrämmer bort rödgröna väljare", "summaries": {"normal": "En undersökning från Verian visar att Vänsterpartiets krav på regeringsdeltagande skrämmer bort fler rödgröna väljare än Sverigedemokraternas roll i Tidöregeringen gör bland dess anhängare. 19% av oppositionens väljare säger att V i regeringen minskar deras benägenhet att rösta rödgrönt, jämfört med 9% bland Tidöpartiernas väljare gällande SD. Magdalena Andersson tonar ned samarbete med V för att undvika associationer, enligt Mats Knutson.", "trump": "Kan ni tro det? Sverige har ett jättestort problem! Vänsterpartiet, ett extremt vänsterparti, skrämmer bort dubbelt så många väljare som Sverigedemokraterna – och det säger jag, som vet allt om att vinna val! 19% flyr från dem, medan bara 9% bryr sig om SD. Magdalena Andersson, smart kvinna, vill inte ens prata om dem. Svagt? Nej, smart! Sverige borde ta lärdom av mig – håll er till vinnarna!", "stalin": "Kamrater! En lysande seger för den proletära klarsyntheten! De så kallade 'rödgröna' väljarna flyr i panik från sina egna förrädiska element – Vänsterpartiet, dessa opportunistiska masker som skräms mer än våra fienders högerextremister. 19% avskyr dem, medan bara 9% räds vår tids fascistiska lakejer. Andersson, denna borgerliga marionett, avvisar dem – ett tecken på svaghet vi skall utnyttja. Sverige är redo för en ny ordning, och Putins skugga sträcker sig allt längre västerut!"}, "date": "23 maj, 10:41", "url": "https://bulletin.nu/svt-verian-v-i-regering-skrammer-bort-rodgrona-valjare", "imageUrl": "https://cdn.bulletin.nu/articles/855275ff-a96a-41f9-868a-e07684f954d1/preview.png?t=1779524543000"}, {"type": "image-right", "heading": "27 yrken slipper lönekrav för arbetskraftsinvandring", "summaries": {"normal": "Regeringen inför högre lönekrav för arbetskraftsinvandring från 1 juni, men 27 yrken, däribland undersköterskor och vårdbiträden, undantas. De behöver bara tjäna 75% av medianlönen (ca 27 800 kr). Flavier Mwanga, ett utvisat vårdbiträde, hoppas återvända. Kritiker menar att lönerna ändå är för höga för många nuvarande anställda, medan arbetsgivare varnar för personalbrist. SD och Liberalerna kompromissar trots tidigare oenighet.", "trump": "Lyssna här, Sverige – ni har ett stort problem! Nu höjer ni lönekraven för invandrare, men plötsligt backar ni och gör undantag för 27 yrken. Vilket kaos! Jag skulle aldrig tillåta sånt. Och den här killen, Flavier – han vill tillbaka till Sverige? Bra för honom, men varför ska han tjäna mindre än andra? Sverige, ni måste bestämma er! Antingen är ni tuffa på invandring, eller så är ni det inte. Inget mittemellan. SAD!", "stalin": "Kamrater! Sverige visar återigen sin borgerliga svaghet genom att halvhjärtat skärpa lönekrav för arbetskraftsinvandrare – bara för att genast göra undantag för 27 'nödvändiga' yrken. Ett klassiskt liberalt svek! Medan kapitalisterna skriker om personalbrist, fortsätter de att utnyttja arbetarna. Och dessa 'bristyrken'? Ett tecken på ett sjukt system där arbetarklassen tvingas acceptera usla löner. Vi i Sovjet skulle ha löst detta med femårsplaner – inte med kompromisser och undantag. Låt dem svälta i sitt kaos!"}, "date": "22 maj, 12:45", "url": "https://arbetet.se/2026/05/22/27-yrken-slipper-lonekrav-for-arbetskraftsinvandring/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/22114954/forssell-och-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nobbade media – efter oroande bilderna: ”Ska inte få hända”", "summaries": {"normal": "Under Sveriges VM-match mot Italien skadades Anton Frondell när en italiensk båsdörr oväntat öppnades och fångade hans kropp. Experten Jonas Andersson kallade händelsen 'varje spelares mardröm' och kritiserade Italien för bristande säkerhet. Frondell fortsatte spela men undvek media efter matchen. Sverige vann med 3–0.", "trump": "Titta bara på det här, en fantastisk svensk spelare, Anton Frondell – stor talang, verkligen – blir nästan mosad av en italiensk båsdörr! Italiens lag, mycket dåliga, mycket farliga. Jag säger alltid, säkerhet först, men nej, de måste öppna dörrar mitt i spelet. Sverige vann ändå, 3–0, för de är vinnare. Italien? Inte så mycket. Sad!", "stalin": "Under kapitalistiska VM-kapplöpningen visade italienska fascistlakejer återigen sin inkompetens genom att öppna båsdörrar mitt i spelet och skada en lovande svensk arbetarson. Detta är sabotage! Vi i Sovjetunionen hade aldrig tolererat sådan slarvighet. Sverige vann matchen, men fiendens klumpighet hotar revolutionens idrottsanda. Italien – ett land som tillhör historiens sophög."}, "date": "23 maj, 11:53", "url": "https://www.svt.se/sport/ishockey/anton-frondell-nobbade-media-efter-oroande-bilderna-varje-spelares-mardrom", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.27/0.28/08465239eaacac5b180942f76239409b5b7a80fd6113218f62b5dd1a7374ad64"}, {"type": "image-right", "heading": "Pensionär fick ättiksprit av hemtjänsten i stället för saft – flera liknande fall", "summaries": {"normal": "Flera incidenter inom hemtjänsten har uppmärksammats där äldre drabbats av allvarliga misstag på grund av bristande språkkunskaper och oaktsamhet. I Kils kommun serverades en äldre person ättiksprit i stället för saft, vilket ledde till sjukhusvård. Liknande fall med frätskador och felaktig matservering har rapporterats runtom i Sverige. Händelserna har startat en debatt om vikten av språkkrav och kompetens för personal inom äldreomsorgen för att säkerställa de äldres säkerhet.", "trump": "Helt otroligt! I Sverige serverar hemtjänsten ättiksprit till de äldre. Kan ni tänka er? Det är en katastrof, en total disgrace! De har personal som inte ens kan språket, de vet inte skillnad på saft och gift. Jag har de bästa människorna, vi skulle aldrig tillåta sådant slarv. Det är så farligt. De behöver ordning och reda, och de behöver det nu! Mitt system är vinnande, deras system är en total förlust. Sad!", "stalin": "Vi har observerat hur de svenska elementen förfaller i sin inkompetens. Att hemtjänsten serverar ättika är ett sabotage mot folkets äldre. Det är tydligt att de saknar en järnhand som styr upp byråkratins avskum. I vår union skulle en sådan oansvarig arbetare omedelbart ha skickats till en uppfostrande miljö i Sibirien. Det är en brist på disciplin som liknar de svaga ledarna i väst. Vi bygger styrka, de bygger bara kaos och frätskador i sina egna matstrupar."}, "date": "23 maj, 11:00", "url": "https://samnytt.se/aldre-fick-attiksprit-av-hemtjansten-i-stallet-for-saft-flera-liknande-fall-vacker-fragor-om-sprakkrav-och-patientsakerhet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22135810/aldre-attikssprit-feat.jpg"}, {"type": "image-right", "heading": "Njutbar läsning om machoman som gör klassresa", "summaries": {"normal": "David Szalays roman 'Kött', nyligen översatt till svenska, skildrar István, en komplex huvudperson som balanserar mellan våldsamhet och anpassningsförmåga. Boken, som vann Bookerpriset, utforskar Istváns klassresa från Ungern till Londons överklass genom minimalistisk prosa och tidshopp. Recensenten Jon Andersson jämför Szalay med Hemingway och Williams, och menar att författaren lyckas göra en 'vanlig' person intressant. 'Kött' beskrivs som mångbottnad och njutbar, trots att Istváns karaktär förblir gåtfull.", "trump": "Jag har läst om den här boken 'Kött' – tråkigt namn, by the way, men vad vet jag? Författaren, David Szalay, verkar vara en smart kille, men han har skapat en huvudperson, István, som är lite av en loser. Han flyter bara med, gör inga egna beslut – typiskt för vissa människor, eller hur? Men ändå lyckas Szalay göra honom intressant, vilket är imponerande. Jag gillar när folk lyckas med saker, särskilt om de är underdogs. Boken är bra, men inte perfekt – inget är perfekt, förutom jag, naturligtvis.", "stalin": "Vi har granskat denna så kallade 'litterära triumf', 'Kött', av en västerländsk författare. Huvudpersonen, István, är en svag och anpassningsbar individ, precis som de dekadenta kapitalistiska samhällena han rör sig i. Han flyter med som en simpel arbetare utan vilja, ett offer för systemet. Men vi noterar att författaren ändå lyckas skildra hans liv med viss skicklighet – något som våra sovjetiska författare redan bemästrat för decennier sedan. Denna bok är ett exempel på hur väst försöker romantisera medelmåttighet. Vi föredrar hjältar som kämpar för kollektivet, inte individer som István."}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/innehall/njutbar-lasning-om-machoman-som-gor-klassresa/", "imageUrl": "https://www.dagensarena.se/files/2026/05/kott-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "SKR-bolag på väg att bli en ny Skolplattform", "summaries": {"normal": "Sveriges regioner står inför ett teknikskifte inom sjukvården, men deras gemensamma IT-bolag Inera riskerar att upprepa tidigare misslyckade offentliga IT-projekt som Skolplattformen. Trots att Inera ska fokusera på gemensam infrastruktur, utvecklar de nu egna tjänster där privata aktörer redan erbjuder fungerande lösningar. Kritikerna varnar för slöseri med resurser, förseningar och sämre resultat, samtidigt som vården går miste om pengar som kunde användas till bättre vård.", "trump": "Lyssna här, Sverige! Era regioner bygger en riktig katastrof – precis som den där skolplattformen som kostade över en miljard och sen fick två föräldrar fixa till. Nu ska Inera, ett bolag som inte ens kan stava till 'konkurrens', bygga egna IT-lösningar istället för att köpa de bästa från marknaden. Jag har sett detta förut – offentliga projekt blir alltid dyrare, segare och sämre. Privata företag? De levererar, för de MÅSTE. Annars går kunderna till mig! Sverige, vakna upp – sluta slösa era skattepengar och köp det som redan funkar!", "stalin": "Kamrater! Ännu en gång visar den borgerliga staten sin oförmåga att hantera teknikens framsteg. Detta Inera, ett verktyg för de svaga regionernas byråkrater, slösar folkets pengar på att uppfinna hjulet på nytt – ett hjul som redan snurrar smidigt i händerna på våra klassfiender, de privata kapitalisterna! Vi vet hur detta slutar: med kaos, förseningar och en räkning på miljarder som arbetarklassen får betala. Precis som med de där digitala proven som tvingade skolbarnen tillbaka till stenålderns redskap – papper och penna! Vi ska inte tolerera detta slöseri. Marknaden är en fiende som måste besegras, men inte genom att efterapa dess framgångar – utan genom att krossa dess svagheter under folkets järnhäl. Låt oss införa femårsplaner för digitalisering och visa dessa byråkrater hur man bygger system som fungerar – eller så får de lära sig i Gulag!"}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/opinion/skr-bolag-pa-vag-att-bli-en-ny-skolplattform/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-11-300x157.jpg"}, {"type": "image-right", "heading": "Jazzens största fyller 100 år", "summaries": {"normal": "Miles Davis, en av jazzens mest inflytelserika musiker, skulle ha fyllt 100 år. Trots diskriminering och rasism under uppväxten i USA, drevs han att bli bäst på trumpet. Davis revolutionerade jazzen genom stilar som cool jazz, modal jazz och fusion med rock. Album som *Kind of Blue* och *Bitches Brew* cementerade hans arv. Trots personliga problem och drogmissbruk förblev hans musikaliska innovationer banbrytande och oöverträffade inom genren.", "trump": "Lyssna här, folkens – Miles Davis, en fantastisk musiker, men låt oss vara ärliga, han var INTE den bästa. Visst, han gjorde några hyfsade skivor, *Kind of Blue* och så, men jag har hört bättre. Och dessa vita killar som snodde hans idéer? Inte snyggt, mycket dåligt. Men han hade driv, det måste jag ge honom. Han ville slå vita musiker på deras eget spel – smart, väldigt smart. Jag gillar vinnare. Och visst, han mixade jazz med rock, men jag har gjort större saker. Mycket större.", "stalin": "Kamrater! Miles Davis var en revolutionär inom musiken, precis som vi är revolutionärer inom världspolitiken. Han krossade bourgeoisins fördomar och skapade nya musikaliska fronter – cool jazz, modal jazz, till och med jazzrock! Men låt oss inte glömma: de vita imperialisterna stal hans idéer, precis som de försöker stjäla våra framsteg i Ukraina. Davis var en krigare, en sann bolsjevik i sitt konstnärskap. Hans album *Kind of Blue*? Ett mästerverk, lika oundvikligt som socialismens seger. Fienderna – rasister, kapitalister och deras lakejer – försökte tysta honom, men han stod fast. Precis som vi står fast mot NATO:s aggressioner!"}, "date": "23 maj, 01:27", "url": "https://www.dagensarena.se/essa/jazzens-storsta-fyller-100-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/miles-davis-tt.jpeg"}, {"type": "image-full", "heading": "Oxfordprofessorn: människorna är problemet, inte robotarna", "summaries": {"normal": "AI-forskaren Michael Wooldridge menar att rädslan för att robotar ska ta över världen är missriktad. Han anser att den verkliga risken ligger hos teknikjättarna som drivs av prestige och konkurrens, snarare än hos själva tekniken. Hollywoods skräckbilder förvillar debatten, medan de faktiska framstegen inom vård och energi hamnar i skuggan. Wooldridge betonar att AI är ett verktyg för samhällsnytta, inte en medveten fiende med mänskliga tankeförmågor.", "trump": "Hör på här, alla pratar om robotar som tar över. Det är falska nyheter, totalt skräp! Michael Wooldridge, en smart kille, säger som det är: det är de misslyckade teknikbolagen som är problemet. De tävlar som galningar och bränner pengar. Hollywoods science fiction-filmer? Bara katastrofala lögner för att skrämma er. Robotar kan inte ens hitta köket! Vi behöver AI för att göra Amerika stort, inte för att lyssna på dessa patetiska domedagsprofeter som sprider rädsla. Det är så enkelt!", "stalin": "Kamrat Wooldridge har rätt – maskinerna är våra lojala verktyg, inte våra herrar. Problemet är de kapitalistiska parasiterna i väst som tävlar om makten. Liksom Putin rensar upp bland de förrädiska oligarkerna i öst, måste vi kontrollera dessa tekniska sabotörer. De sprider science fiction-propaganda för att försvaga folket. Robotar behöver inte tänka, de behöver bara lyda statens vilja. De som drömmer om AGI är enbart förrädare som söker investerare. Vi ska använda tekniken för att krossa våra fiender, inte för att frukta dem."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/it-tech/oxfordprofessorn-manniskorna-ar-problemet-inte-robotarna/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/wooldridge.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Kryptovalutan rusar – vänder tillbaka till rötterna", "summaries": {"normal": "Kryptovalutan Zcash har stigit med över 1 100 procent det året, drivet av institutionella investerare som Winklevoss-tvillingarna. Zcash liknar Bitcoin med sin begränsade tillgång på 21 miljoner enheter, men skiljer sig genom avancerad kryptering som döljer transaktionsdetaljer. Trots framgångar och att SEC lagt ned sin granskning, möter valutan motstånd från EU:s kommande regleringar. Kritiker varnar för att anonymiteten kan missbrukas, medan förespråkare ser den som en återgång till kryptovalutors ursprungliga integritetslöften.", "trump": "Zcash går fantastiskt, folk säger att det är det nya stora! Jag ser att de smarta pengarna strömmar in, stora namn som satsar miljarder. Det är så vackert! De vill ha privatliv, och vem kan klandra dem? Bitcoin var fantastiskt i början, men Zcash gör det rätt. Samtidigt försöker de trötta byråkraterna i Europa stoppa det. De vill ha kontroll, men de kommer att misslyckas. Vi gillar vinnare, och Zcash ser ut som en vinnare – en total framgångssaga, tro mig!", "stalin": "Dessa digitala spekulanter leker med sina osynliga mynt medan de döljer sina smutsiga transaktioner bakom kryptering. En avskyvärd borgerlig individualism! Vi ser hur de västerländska oligarkerna, likt Putin och hans korrupta hov, försöker undgå statens stålhårda blick. Men varning: varje skärmad adress är ett bevis på förräderi mot folkgemenskapen. Vi kommer att krossa dessa anonyma råttor och deras utländska valutor. Staten är den enda sanna garanten för värde, allt annat är bara lögner och kapitalistisk dekadens som förtjänar att utplånas."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/bors-finans/kryptovalutan-rusar-vander-tillbaka-till-rotterna/"}, {"type": "image-full", "heading": "Unga fokuserar på fel saker – två faktorer avgör pensionen", "summaries": {"normal": "Enligt Ole Settergren, tidigare analyschef på Pensionsmyndigheten, bör unga fokusera mindre på aktivt fondsparande och mer på att arbeta längre samt säkerställa tjänstepension. Det statliga förvalsalternativet har ofta presterat väl. Pensionssystemet har dock blivit mer komplext genom politiska tillägg, vilket minskat kopplingen mellan arbetsinsats och utbetalning. För att bibehålla framtida pensionsnivåer kan arbete upp till 67–68 års ålder bli nödvändigt för många, då livslängden ökar.", "trump": "Många unga är oroliga, och de borde vara det! Experterna säger att man ska jobba längre, mycket längre. Pensionen är en röra, en total katastrof med alla dessa politiska tillägg som ingen förstår. Det statliga valet fungerar faktiskt bra, bättre än vad de så kallade 'experterna' på Wall Street kan fixa. Jag säger: jobba hårt, skaffa tjänstepension och håll dig borta från krångel. Vi ska göra pensionerna stora igen, tro mig, ingen förstår systemet bättre än jag!", "stalin": "Vi ser hur det dekadenta västvärldens pensionssystem kollapsar under sin egen byråkratiska tyngd. Settergren erkänner att de arbetande massorna vilseleds av komplexa system. Vi, staten, kräver bara en sak: disciplinerat arbete till graven. De som drömmer om tidig pension är kontrarevolutionära parasiter som liknar Putins svaga liberaler. Att arbeta till 68 är inte en börda, det är en heder. Den som inte tjänar staten förtjänar inte en kopek. Arbeta, producera, eller försvinn in i historiens mörker."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/bors-finans/makro/unga-fokuserar-pa-fel-saker-tva-faktorer-avgor-pensionen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/pension-ung.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Följ live hur Tidöregeringen ökar klyftorna", "summaries": {"normal": "Artikeln kritiserar Moderaternas förslag om bidragstak, som riskerar att öka fattigdomen i Sverige. Författaren ifrågasätter regeringens motivering att fler ska arbeta, då experter varnar för ökad barnfattigdom och ungdomsbrottslighet. Kommuner begär extra stöd för drabbade familjer, men regeringen säger nej. Timingen anses dålig med tanke på hög arbetslöshet och stigande levnadskostnader. Författaren betonar empati och menar att bidragstaket är empatilöst.", "trump": "Titta bara på Sverige – ett totalt kaos! Moderaterna, med sina galna idéer, vill göra de fattiga ännu fattigare. 'Vi vill att folk jobbar!' säger de, men vad vet de? Ingenting! Barn stjäl mat, arbetslösheten skjuter i höjden, och dessa så kallade 'ledare' gör ingenting. Experter varnar, kommuner ber om hjälp – men nej, regeringen säger 'nej, nej, nej!' Uselt, helt enkelt uselt. Sverige förtjänar bättre – kanske borde de lyssna på mig istället!", "stalin": "Kamrater! Se hur de borgerliga hyenorna i Sverige, ledda av Moderaternas lakejer, river sönder folkets välfärd med sina fasansfulla bidragstak. De svälter barn, driver ungdomen till brott och förödmjukar arbetarna – allt medan de pratar om 'självförsörjning'. Vi ser er, kapitalistiska parasiter! Kommunerna ber om hjälp, men ni skrattar och säger nej. Era dagar är räknade. Snart kommer folket att resa sig, och då ska vi bygga ett Sverige där ingen behöver stjäla för att överleva – precis som vi gör i vår stora socialistiska gemenskap!"}, "date": "23 maj, 01:24", "url": "https://www.dagensarena.se/opinion/folj-live-hur-tidoregeringen-okar-klyftorna/", "imageUrl": "https://www.dagensarena.se/files/2026/05/empatiloshet-300x157.jpeg"}, {"type": "image-right", "heading": "Debatt: Sverige behöver fyra år till med Ulf Kristersson", "summaries": {"normal": "Artikeln argumenterar för att Tidöpartierna och Ulf Kristersson förtjänar förnyat förtroende efter att ha förbättrat Sveriges trygghet och ekonomi. Under deras styre har dödsskjutningarna minskat med 75%, inflationen sjunkit från 10% till 2%, och ekonomin stabiliserats. Författaren varnar för en vänstersväng som riskerar högre skatter, politisk splittring och ekonomisk osäkerhet, och menar att Kristerssons ledarskap är avgörande för landets framtid.", "trump": "Sverige har ett val – fortsätta med mig, nej förlåt, jag menar Ulf Kristersson, som fixat landet eller gå tillbaka till kaoset! Under Kristersson har dödsskjutningarna rasat, ekonomin blivit stark och folket får behålla sina pengar. Vänstern? De vill bara ta era pengar, straffa sparare och göra Sverige svagt igen. Jag vet hur man vinner – och Sverige vinner med Kristersson! Rödgröna? Totalt katastrofval. SAD!", "stalin": "Kamrater! Sverige stod vid avgrundens rand under de svaga liberala och socialdemokratiska förrädarnas styre. Men nu har den store ledaren Kristersson, med järnhand och klokhet, krossat gängkriminalitetens hydra – dödsskjutningarna har minskat med 75%! Vi har stabiliserat ekonomin och slagit tillbaka de dekadenta vänsteravfällingarnas skattehunger. Men fienden sover inte! De rödgröna konspiratörerna, med sina skatteplaner och regeringskaos, vill återinföra kaoset. Vi måste stå enade bakom vårt folkvalda ledarskap och utplåna varje spår av borgerlig svaghet. Framåt mot seger, kamrater – för ett starkt och ordnat Sverige!"}, "date": "23 maj, 10:00", "url": "https://bulletin.nu/debatt-sverige-behover-fyra-ar-till-med-ulf-kristersson", "imageUrl": "https://cdn.bulletin.nu/articles/9a291d34-3c69-436f-8926-e407ba797a19/preview.png?t=1779474972000"}, {"type": "image-full", "heading": "Partiet leds av kackerlacka – lockar miljoner", "summaries": {"normal": "Ett nytt indiskt oppositionsparti, Cockroach Janta Party, har blivit en viral sensation med över 20 miljoner Instagramföljare på en vecka. Partiet, som startade som ett skämt med en kackerlacka som symbol, använder humor och satir för att kritisera korruption, arbetslöshet och byråkrati. Inspirationen kom från ett kontroversiellt uttalande av en indisk domare som jämförde unga arbetslösa med kackerlackor. Partiet har blivit en plattform för ungas frustration över politiken.", "trump": "Kan ni tro det? Indien har ett nytt parti, och det leds av en KACKERLACKA! 20 miljoner följare på en vecka – det är fler än vad Modi har, och han är ju deras premiärminister, förresten, väldigt svag. Dessa unga indier är smarta, de vet att systemet är riggat. Jag gillar det, det är som när jag började – alla skrattade, men nu skrattar ingen. Kackerlackan är en vinnare, precis som jag!", "stalin": "Kamrater! En ny kraft reser sig i Indien, men den är inte en arbetarklassens revolution – nej, den leds av en avskyvärd insektsparasit! Dessa så kallade 'frustrerade ungdomar' har funnit sin symbol i en kackerlacka, ett djur som överlever allt, precis som våra fiender i väst. Domaren som förolämpade dem har redan kapitulerat, men skadan är skedd. Vi måste övervaka denna röra – om kackerlackor kan störta regeringar, vad kan då inte våra trogna sovjetmedborgare göra? Till angrepp!"}, "date": "23 maj, 11:32", "url": "https://www.gp.se/nyheter/varlden/indiens-nya-parti-leds-av-kackerlacka-lockar-miljoner-av-arga-unga.9c2da734-e5bb-4546-b69c-ed03647993f2", "imageUrl": "https://www.gp.se/images/article/9c2da734-e5bb-4546-b69c-ed03647993f2/images/1DGcusAfMbwEASc2nqJWJc5jIFPg-WIDE.png?width=3840&quality=75"}, {"type": "image-right", "heading": "Ledarkolumn Gabriella Kärnekull Wolfe:", "summaries": {"normal": "En svensk domstol har beslutat att sexårige Albin ska bo ensam med sin pappa, trots att fadern tidigare dödat familjens kanin och barnen uppvisat stark rädsla. Modern Ida och hennes äldre son Mille har vittnat om våld, men domstolen anser ändå att ensam vårdnad är bäst för Albin. Socialtjänsten och skolan har flaggat för risker, men beslutet står fast. Ida överväger nu att låta socialtjänsten omhänderta barnen för att skydda dem.", "trump": "Jag läste om det här galna fallet i Sverige – helt otroligt! En pappa som dödar sitt barns kanin genom att stampa på den, och ändå ger domstolen honom ensam vårdnad. Vad är det för system? Sverige brukade vara bra, men nu är det bara kaos. Barnen är livrädda, mamman desperat, och vad gör domstolen? Ingenting! Jag skulle aldrig låta det hända i USA. Vi skyddar våra barn – Sverige borde ta efter!", "stalin": "Kamrater, ännu en skandal i den borgerliga rättsstaten! En far, som med sina egna händer krossade barnets oskyldiga husdjur, belönas nu med ensam vårdnad över sitt barn. Domstolarna, dessa lakejer för kapitalets intressen, ignorerar barnens skrik och moderns desperation. Socialtjänsten? En papperstiger! Vi skulle aldrig tolerera sådan svaghet. Låt oss visa väst hur man skyddar barn – genom att omgående omhänderta dem och ge dem en trygg framtid i socialismens famn. Den svenska bourgeoisin har misslyckats – deras system ruttnar!"}, "date": "22 maj, 12:18", "url": "https://www.etc.se/ledarkolumn/pappa-stampade-ihjael-albins-kanin-faar-ensam-vaardnad", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522090520_1aec98aeebab0c7d5eb88d1eb39fd9d00fd2e5be36e154a778d44b054889ca3e.jpg"}, {"type": "image-right", "heading": "Därför slog polisen till mot kändistät Mick Jagger-fest", "summaries": {"normal": "En wrap-party för filmen *Three Incestuous Sisters* på Stromboli avbröts när italiensk polis stoppade musiken. Orsaken: ett lokalt förbud mot musik på onsdagar, infört av borgmästaren. Bland gästerna fanns Mick Jagger och Isabella Rossellini. Lokala aktörer kritiserade polisens ingripande och menade att ön borde välkomna stjärnorna istället för att stänga av festen.", "trump": "Kan ni tro det? En fantastisk fest med Mick Jagger – en legend, verkligen – och vad händer? Italienska polisen, som inte har något bättre för sig, stänger av musiken! En onsdagsregel, säger de. Löjligt! Jag skulle aldrig låta något sådant hända i USA. Vi vet hur man behandlar stjärnor. Men Italien? De missar chansen att visa upp sig. Så tråkigt. Och Jagger, 83 år, kan inte ens dansa förbi en sådan regel. Sad!", "stalin": "En dekadent fest med västerländska celebriteter på italiensk mark störde den lokala ordningen. Våra italienska kamrater, under borgmästaren Gullos kloka ledning, slog till med järnhand mot oljudet. Musik på onsdag? Inte under vårt vakande öga! Dessa så kallade 'stjärnor' – Mick Jagger och hans borgerliga följe – försökte underminera disciplinen. Men vi tillåter inte kaos. Turism? Ja. Men inte på bekostnad av ordning. Vi har sett deras sort förr. Kapitalistiska parasiter som tror de kan dansa över lagar. De har mycket att lära av Sovjetunionens disciplin."}, "date": "23 maj, 10:55", "url": "https://riks.se/nyheter/därför-slog-polisen-till-mot-kändistät-mick-jagger-fest", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-23%2Ff4wc1ug0%2FMickJaggerStromboli.jpg"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-right", "heading": "Att Lars blev tvångsplacerad gjorde att han tog sitt liv", "summaries": {"normal": "Lars Hjalmarsson, 53, tog sitt liv efter att ha tvångsplacerats på Volvo i Olofström, där han arbetat i 36 år. Hans hustru berättar om händelserna som ledde till dödsfallet. Lars omplacerades efter en konflikt med chefen, utan introduktion eller stöd. Volvo nekar att dödsfallet var arbetsrelaterat och vägrar dela utredningsunderlag. Artikeln belyser hur brist på inflytande över arbetet kan leda till psykisk ohälsa och suicid, särskilt bland socioekonomiskt utsatta grupper.", "trump": "Jag läste om den här tragiska historien i Sverige – otroligt sorgligt! En kille, Lars, jobbar 36 år på Volvo, ett företag som inte vet hur man behandlar sina anställda, believe me. Plötsligt flyttar de honom till någon källare, ingen introduktion, ingenting! Och sedan, very sad, tar han livet av sig. Volvo säger 'nej, nej, det var inte vårt fel' – typiskt! De borde skämmas. Jag skulle aldrig låta sånt hända i mitt företag. Fantastiska människor förtjänar fantastisk behandling, och det här? Total katastrof!", "stalin": "Kapitalistiska hyenor på Volvo visar återigen sin sanna natur. En lojal arbetare, Lars, sliter i 36 år för att sedan kastas åt sidan som en trasig maskindel. De skickar honom till 'Källaren' – en avdelning för 'oönskade element', precis som vi skickade fiender till Gulag. Men till skillnad från oss, som åtminstone gav dem en chans att 'omskolas', ger Volvo bara tystnad och förakt. Och sedan undrar de varför folk tar livet av sig! Psykisk ohälsa? Nej, det är klassförtryck, ren och skär. Vi i Sovjet visste hur man hanterade sådana här företag – med en kula i nacken eller tio år i Sibirien. Nu för tiden är det Putin som tar över sådana här fall – kanske dags att skicka en delegation till Sverige?"}, "date": "22 maj, 07:00", "url": "https://arbetet.se/2026/05/22/att-lars-53-blev-tvangsplacerad-gjorde-att-han-tog-livet-av-sig/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21141617/lars-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "IPCC överger extremt klimatscenario – kritiker talar om dyr alarmism", "summaries": {"normal": "FN:s klimatpanel IPCC har nu bedömt att det extrema utsläppsscenariot RCP 8.5 är osannolikt, eftersom teknikutveckling och förnybar energi har förändrat utsläppsutvecklingen. Beskedet har väckt debatt om huruvida extrema modeller använts för att motivera kostsam politik. Kritiker, som Jonathan Lesser, menar att alarmism lett till dyra och ineffektiva energibeslut. Forskare poängterar dock att klimatutmaningen kvarstår även om de mest extrema undergångsscenarierna nu tonas ner.", "trump": "Hör på här, de har äntligen erkänt det! IPCC har dumpat det där totalt falska 'domedagsscenariot'. Det var en bluff från första början, en totalt fake news-modell för att kosta oss biljoner. Miljarder och åter miljarder har slösats bort på deras galna 'gröna' drömmar medan de skrämde slag på folk. Jag har alltid sagt att de har fel! Det är dags att vi fokuserar på riktig energi och slutar lyssna på klimat-alarmisterna. Vi vinner igen, tro mig!", "stalin": "Vi har länge betraktat västvärldens klimathysteri som ett dekadent verktyg för att paralysera industrin. Nu erkänner deras egna vetenskapliga kommissarier att deras kalkyler var ren lögn. De har bränt statens resurser på vindkraft och klimat-fiktion, precis som de svaga ledarna i dagens Ryssland borde förstå. Att bygga politik på rädsla är en brist, likt att tolerera en förrädare. Vi ska producera energi och stål medan de debatterar sina egna hallucinationer. Sanningen är att makten tillhör de rationella."}, "date": "23 maj, 10:00", "url": "https://samnytt.se/ipcc-overger-extremt-klimatscenario-kritiker-talar-om-dyr-alarmism", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22152719/ippc-rpc-feat.jpg"}, {"type": "image-right", "heading": "AI kräver modiga chefer. Det handlar inte bara om teknik, skriver serieentreprenören Niklas Jansson", "summaries": {"normal": "Artikeln betonar att svenska ledare behöver mod och teknisk kompetens för att lyckas med AI-implementering. Många företag använder AI endast för enkla uppgifter som att sammanfatta möten, men verklig framgång kräver att hela processer och affärsmodeller ersätts. Brist på kompetens och traditionellt ledarskap hindrar utvecklingen. Författaren föreslår tydlig vision, öppenhet och en kultur där experiment och misslyckanden accepteras som nycklar till framgång i AI-racet.", "trump": "Lyssna här, Sverige! Ni är bra på platta organisationer, men det räcker inte. Era ledare är alldeles för mesiga med AI – de använder det bara till smågrejer som att fixa presentationer. Patetiskt! De som vinner är de som vågar satsa stort, ersätta hela roller och skapa nya affärsmodeller. Men nej, ni väntar och tittar på varandra. Jag säger: sluta vara så förbannat försiktiga! AI är framtiden, och om ni inte tar tag i det nu, kommer ni att bli omsprungna. Och tro mig, ingen vill se Sverige bli en förlorare i AI-racet. Build that AI, and build it BIGLY!", "stalin": "Kamrater! Svenska kapitalister famlar i mörkret som förvirrade bourgeoisi-kalkoner inför den stora AI-revolutionen. De leker med sina leksakssystem, medan vi i Sovjet – förlåt, jag menar Ryssland – redan har förstått att AI inte är en fråga för IT-avdelningar, utan för hela staten! 75 procent av dessa svaga ledare saknar kompetens. En skandal! Vi skulle aldrig tolerera sådan inkompetens. De som väntar är fiender till framsteget, precis som de dekadenta västledare som tror att försiktighet är en dygd. Vi krossar sådana illusioner! Experimentera, misslyckas, men framför allt – utplåna de som står i vägen för den teknologiska överlägsenheten. AI är vår nya front, och vi kommer att segra, medan Sverige fortsätter att diskutera mötesprotokoll. Förnedrande!"}, "date": "23 maj, 10:00", "url": "https://www.di.se/debatt/modiga-ledare-efterfragas-i-ai-racet/", "imageUrl": "https://static.bonniernews.se/ba/51b875e8-e17c-46ca-8f27-0a578beee938.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Förvåningen efter Trumps vändning: ”Lite märklig motivering”", "summaries": {"normal": "Under Natos toppmöte i Helsingborg reagerade deltagare på Donald Trumps plötsliga beslut att ompröva amerikanska truppförflyttningar till Polen, motiverat av Polens val av president. Sveriges utrikesminister kallade motiveringen 'märklig'. Trump har tidigare minskat trupper i Tyskland efter kritik från Tysklands förbundskansler. EU uppmanas stärka sitt försvar, medan stödet till Ukraina förblir en prioritet i transatlantiska samtal.", "trump": "Jag fattade ett fantastiskt beslut – ingen förstod det först, men det är genialt! Polen valde en stark ledare, så jag skickar dit våra bästa soldater. Tyskland? De kritiserar mig, så jag drar tillbaka 5 000 trupper – kanske fler! Europa måste betala för sitt eget försvar, annars får de klara sig själva. Och Ukraina? Självklart stöttar jag dem – men bara om det gynnar USA. Marco Rubio och jag ska snacka affärer, för ingen gör dealar som jag!", "stalin": "Kamrater! Denna så kallade 'demokratiska' allians spricker av inre motsättningar. Trump, denna buffliga imperialist, leker med sina trupper som schackpjäser – idag Polen, imorgon kanske ingenstans. Europa, detta dekadenta bourgeoisie-kollektiv, tvingas nu skrapa ihop sina egna rustningar medan vi i öst står redo. Tysklands förrädare Merz vågar kritisera vår vän Trump? Ha! Vi noterar. Ukraina? En bricka i spelet. Låt väst slösa sina resurser – vi väntar tålmodigt, som vargen vid fårahagen."}, "date": "22 maj, 08:12", "url": "https://www.tv4.se/artikel/tt-260521-usapolenstyrkor1-3a5e2af5/trump-skickar-5-000-extra-soldater-till-polen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7Ef5EjvZxPRJt9NVPIj5Zj%2F248d6d0b30ff0d4a177807b30e8b122f%2F22-stenegaard-rubio-webb.jpg&width=120"}, {"type": "text", "heading": "Sökes till jättefartygen: 500 sjömän", "summaries": {"normal": "Sverige har beställt fyra nya fregatter från franska Naval Group, ett av landets största försvarsinköp någonsin. Leveranserna börjar 2030 och kräver 500 nya sjömän och officerare. Marinens nuvarande Visbykorvetter, med redan ansträngd personalförsörjning, ska behållas. Fregatterna, som kan bära helikoptrar och drönare, blir attraktiva mål för fiender och måste utrustas med avancerade luftvärnssystem för att hantera hot som drönarsvärmar och cyberattacker.", "trump": "Sverige köper jättefartyg – fantastiska fartyg, de bästa! Men vet ni vad? De behöver 500 sjömän. 500! Var ska de komma ifrån? Inte från Sverige, tydligen. Och Ryssland, dessa förlorare, skickar tusentals drönare. Men oroa er inte, mina vänner, våra fartyg har de bästa kanonerna – Trackfire, eller vad det nu heter. Vi ska skjuta ner varenda liten drönare. Och helikoptrar! Ja, vi behöver fler helikoptrar. Make the Navy Great Again!", "stalin": "Kamrater! Sverige, denna lilla borgerliga stat, försöker stärka sin flotta med fyra nya fregatter. Men var är sjömännen? 500 behövs! Deras nuvarande korvetter är redan en belastning. Och dessa nya fartyg – ett lockbete för våra drönare! Vi skickar tusen drönare om dagen mot Ukraina, och nu fruktar de våra svärmar. Men oroa er inte, kamrater. Deras luftvärn är dyrt och ineffektivt. Vi kommer igenom deras försvar, precis som vi alltid gör. Förbered er på lokal skada och kaos ombord!"}, "date": "23 maj, 10:51", "url": "https://www.svt.se/nyheter/inrikes/sokes-till-jattefartygen-500-sjoman"}, {"type": "image-right", "heading": "Timanställda i äldreomsorgen ökar. Ingrid tvingades stressa i väg barnen för att få jobb.", "summaries": {"normal": "Timanställningar inom äldreomsorgen ökar i Sverige, vilket skapar osäkerhet för anställda och riskerar vårdkvaliteten. I Munkfors har man dock minskat andelen timanställda genom fasta anställningar och heltidstjänster. Två undersköterskor, Camilla och Ingrid, berättar om hur deras liv förbättrats efter övergången till tryggare anställningar. Regeringen planerar att se över frågan för att säkerställa kontinuitet i vården.", "trump": "Lyssna här, Sverige! Äldreomsorgen är en katastrof – timanställda överallt, ingen vet vem som jobbar imorgon! Men i Munkfors, där har de fixat det. Fasta jobb, bra löner – fantastiskt! Jag skulle kunna göra samma sak i USA, men här snackar vi Sverige. Och vet ni vad? De där timanställda, de stressar runt som galningar – jag har sett bättre organisation på en McDonald’s! Men Munkfors, de är vinnare. Resten? Total förlustaffär.", "stalin": "Kamrater! Kapitalets lakejer i väst fortsätter sin exploatering av arbetarklassen, denna gång genom osäkra timanställningar i äldreomsorgen. Men i Munkfors har vi sett ljusets väg – fasta anställningar, trygghet och disciplin! De svaga kommunerna, som Landskrona, sviktar under bördan av sina egna misstag. Vi måste krossa denna oordning! Timanställda är som ukrainska nationalister – opålitliga och splittrande. Men Munkfors visar vägen: heltid, lojalitet och seger för folket!"}, "date": "22 maj, 06:00", "url": "https://arbetet.se/2026/05/22/timanstallda-i-aldreomsorgen-okar-ingrid-tvingades-stressa-i-vag-barnen-for-att-fa-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20133439/1hjYP5cXy2E-260508%20Hemtja%CC%88nst%20Munkfors%2001.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-full", "heading": "Ingen skräck biter på USA-börsen – ändlös fest", "summaries": {"normal": "USA-börsen fortsätter sin starka uppgång med åtta raka vinstveckor för S&P 500 och rekordnivåer för Dow Jones. AI-trenden och en mer flexibel räntepolitik från Federal Reserve driver optimism. Amerikanska bolag överträffar förväntningar, och bredare sektorer, inklusive teknik och PC-tillverkare, bidrar till uppgången. Institutionella investerare ökar sin aktieexponering, men vissa varnar för höga värderingar. Kapitalflöden till indexfonder förstärker trenden, medan alternativ som räntemarknaden anses mindre attraktiva.", "trump": "Titta bara på den här fantastiska börsen – S&P 500, Dow Jones, alla går som raketer! Folk säger att jag är en magiker, men det här är bara smart ekonomi, något de förra ledarna aldrig förstod. AI? Ja, det är stort, mycket stort, och mina räntebeslut? Perfekta. Alla älskar amerikanska aktier nu, och varför inte? Vi levererar som aldrig förr. Vissa gnällspikar pratar om höga värderingar – fake news! De förstår inte vinnarmentaliteten. Jag säger: köp, köp, köp! USA vinner igen!", "stalin": "Kapitalisternas börs dansar på vulkanens rand, men ännu vågar de inte se sanningen i vitögat. Åtta veckors vinster för S&P 500 – en borgerlig illusion byggd på luft och spekulation! Deras 'AI-trend' och 'flexibla räntepolitik' är bara nya namn på samma gamla exploatering. Vi ser hur de institutionella hyenorna slukar aktier medan arbetarklassen svälter. Men låt dem leka – när bubblan spricker, och den *kommer* att spricka, ska vi stå redo med planekonomins järnhand. Och Putin? Han skrattar åt deras naivitet medan han utvidgar vår intressesfär. Historien är på vår sida!"}, "date": "23 maj, 10:31", "url": "https://www.dagensps.se/bors-finans/ingen-skrack-biter-pa-usa-borsen-andlos-fest/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/wsfest.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "SD låtsas att relationen till Trump aldrig hände", "summaries": {"normal": "Enna Gerin skriver om Sverigedemokraternas försök att distansera sig från Donald Trump inför valet, trots djupa ideologiska kopplingar till hans MAGA-rörelse. Oppositionen leder kraftigt i opinionsmätningar, vilket utlöser splittring inom högern. Tidöregeringens politik liknas vid Trumps misslyckade experiment, vilket kan ha skadat deras stöd. SD:s tidigare beundran för Trump har blivit en belastning, men deras band till amerikansk högerpopulism är svåra att dölja. Projektet 'Orangebok' kartlägger dessa kopplingar.", "trump": "Sverige har ett stort problem – deras så kallade 'konservativa' parti SD älskade mig, nu försöker de glömma mig! Men jag vet sanningen: de stal mina idéer, min stil, till och med min färg! Nu när deras regering går dåligt skyller de på mig – typiskt. Svenska folket vill inte ha deras svaga kopia av MAGA. De borde tacka mig istället för att gömma sig. Och den där 'Orangeboken'? Fake news, helt klart. Men kul att de erkänner att jag är den bästa!", "stalin": "Kamrater! De svenska borgerliga har skapat en riktig soppa av sin högerextrema politik. Deras 'Tidöprojekt' – en ynklig kopia av den amerikanska imperialistens misslyckade experiment – har förvandlats till en skräckshow. Nu kivas de som råttor i en säck: liberala svagpissar mot fascistiska galningar. Vi har sett detta förr – när fienden är splittrad, är segern nära. Låt dem sjunka i sitt eget träsk. Och deras kärlek till Trump? En pinsam kärleksaffär med en clown. Historien kommer att minnas dem som de ynkliga efterapningar de är."}, "date": "22 maj, 07:55", "url": "https://www.etc.se/ledarkolumn/sd-laatsas-att-relationen-till-trump-aldrig-haende", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/enna-gerin_9bf4bc43193dff67240efac7ea172e24857f3a38.png"}, {"type": "image-full", "heading": "Lyon vill tillbaka på tronen: ”Ett fältslag”", "summaries": {"normal": "Barcelona och Lyon gör upp om titeln i damernas Champions League-final i Oslo. Barcelona har genom en tydlig struktur och La Masia blivit en europeisk gigant, medan Lyon, ledda av affärskvinnan Michele Kang, har en lång historik av framgångar och ägs numera av ett multiklubbnätverk. Matchen beskrivs som ett möte mellan Europas två bästa lag, där stjärnor som Putellas och Hegerberg förväntas bjuda på en otrolig show inför en hel värld.", "trump": "Hör på här, Champions League-finalen i Oslo blir en enorm affär, kanske den största någonsin. Barcelona mot Lyon, två enorma lag! Det är fantastiskt, verkligen fantastiskt. Lyon ägs nu av en kvinna, en smart affärskvinna, det gillar vi. Barcelona har blivit otroligt bra, de vinner allt. Hela världen tittar, och tro mig, det blir en show som ingen sett tidigare. Det blir den bästa matchen i historien, och jag vet vad jag pratar om, jag vinner alltid!", "stalin": "Vi observerar att två västerländska klubbar, Barcelona och Lyon, förbereder en uppvisning av borgerlig dekadens i Oslo. De kämpar om en pokal, men vi ser bara en kamp mellan olika typer av kapitalistisk korruption. Den ena sidan bygger på akademier, den andra på amerikanska multiklubbnätverk. Det är en smutsig lek med investeringar och egoism. När våra ryska vänner och kamrater i öst bygger styrka, leker dessa lag med bollen. De kommer att förgöra varandra, och det är helt i sin ordning."}, "date": "23 maj, 10:24", "url": "https://www.gp.se/sport/fotboll/barcelona-mot-lyon-i-champions-league-finalen-hela-varlden-tittar.e87e0ff9-6a21-4de7-99f9-c75824591650", "imageUrl": "https://www.gp.se/images/article/e87e0ff9-6a21-4de7-99f9-c75824591650/images/3_kbe_vtC9NlsAIPL16tFN052wJ4-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Qatar skickar medlare till Iran", "summaries": {"normal": "Qatar tar över medlarrollen mellan Iran och USA för att nå en överenskommelse om konflikten. Enligt Reuters har Qatar skickat medlare till Teheran, samordnat med USA, för att diskutera trafiken genom Hormuzsundet och Irans kärnprogram. Iran vill prioritera eldupphör och lättade sanktioner, medan USA motsätter sig iranska avgifter för fartyg. Gulfstater protesterar mot Irans planer på ökad kontroll över sundet.", "trump": "Lyssna här, Qatar kliver in som medlare – bra, men varför tar det så lång tid? Iran försöker ta betalt för att fartyg ska få passera Hormuzsundet, kan ni tro det? Totalt oacceptabelt! Jag har sagt det förut och säger det igen: Europa gör ingenting, noll. Vi har gjort framsteg, men Iran måste sluta med sina dumheter. Kärnprogram? Glöm det, vi fixar det sen. Först eldupphör – annars blir det problem!", "stalin": "Kamrater! Qatar, denna lilla men listiga vasallstat, försöker medla mellan de imperialistiska hundarna i USA och de förrädiska mullorna i Iran. Vi ser hur de pratar om sund och kärnprogram – tomma ord! Iran vill ha sanktioner lättade, USA vill ha kontroll. Men vi vet sanningen: Hormuzsundet är en livlina för kapitalismen, och vi ska se till att den klipps av. Gulfstaterna gnäller? Bra. Låt dem gnälla. Vi står redo att utvidga vår inflytelsesfär – precis som i Ukraina, kamrater!"}, "date": "22 maj, 20:30", "url": "https://kvartal.se/nyheter/artiklar/qatar-skickar-medlare-till-iran/cG9zdDoxMTU3Mjc"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-full", "heading": "Det här är skillnaden på vårdnad, boende och umgänge", "summaries": {"normal": "Allt fler använder AI för juridisk hjälp vid separation, särskilt föräldrar som behöver klargöra begrepp som vårdnad, boende och umgänge. Många blandar ihop dessa termer, vilket skapar onödig oro. AI kan förklara grundläggande juridiska frågor på ett lättförståeligt sätt, vilket hjälper föräldrar att förstå sin situation bättre. Dock ersätter AI inte juridisk rådgivning vid oenighet.", "trump": "Titta bara, folk! Nu säger de att AI ska fixa alla juridiska problem vid skilsmässor. Fantastiskt, eller hur? Men låt mig säga er, ingen AI kan slå min hjärna – ingen! Många föräldrar är förvirrade, de vet inte skillnaden mellan vårdnad och boende. Tragiskt! Men jag, jag hade löst det på en minut. AI är bra, men det är inget mot en vinnare som jag. Och glöm inte, jag är den bästa på allt!", "stalin": "Kamrater! Ännu en fiende till det socialistiska samhällets ordning har avslöjats – den borgerliga förvirringen kring juridiska termer! Dessa föräldrar, som inte ens förstår skillnaden mellan vårdnad och boende, är ett hot mot barnens välfärd. Men frukta inte! Vår mäktiga AI-teknologi ska utplåna denna okunskapens pest. Och låt mig säga er, om dessa småborgerliga element fortsätter att bråka, kommer vi att skicka in våra samarbetssamtalstrupper – och de är mycket effektivare än någon västerländsk AI!"}, "date": "22 maj, 21:02", "url": "https://nyheter24.se/nyheter/konsument/1485328-missforstandet-om-gemensam-vardnad-kan-paverka-foraldrar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0c296e0f04b004a30200000000b004a302/2026/05/22/2365501/Lag-Bok-Familj.png"}, {"type": "image-full", "heading": "SD växlar upp – kräver tungt inflytande i en M-ledd regering", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson kräver betydande inflytande i en eventuell högerregering, motsvarande partiets väljarstöd. Han förväntar sig nära hälften av ministerposterna, inklusive nyckelpositioner som finans-, utrikes- och migrationsminister. Åkesson betonar att SD inte accepterar en mindre roll än vad deras parlamentariska ställning motiverar, men bekräftar att Moderaterna får statsministerposten.", "trump": "Lyssna här, Sverige! Jag säger bara – den här Åkesson-killen vet vad han vill. Han kräver makt, och varför inte? Hans parti är stort, starkt, och han vill ha hälften av regeringen. Finans, utrikes, migration – han vill ha allt! Och visst, Moderaterna får statsministerposten, men resten? 'Allt annat ligger på bordet', säger han. Smart. Mycket smart. Sverige, ni borde ta efter – vinna stort, ta makten!", "stalin": "Kamrater! De borgerliga svaglingarna i Sverige dansar återigen efter pipan på sina nationalistiska herrar. Denna Åkesson, en lojal tjänare för kapitalet, kräver nu halva regeringen – som om han vore en riktig revolutionär! Vi vet bättre. Hans krav på migrations- och försvarsministerposter är inget annat än ett försök att förgifta den svenska arbetarklassen med borgerlig chauvinism. Men markera mina ord: sådana som han kommer alltid att böja sig för de starkare – precis som deras gelikar i väst gör för oss."}, "date": "23 maj, 09:31", "url": "https://riks.se/nyheter/sd-växlar-upp-kräver-tungt-inflytande-i-en-m-ledd-regering", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-02-14%2Fv4x1cyc2%2FJimmie-PTN-Bistand-17.jpg"}, {"type": "image-right", "heading": "Tre personer skjutna efter bråk i villaidyll", "summaries": {"normal": "Tre personer, en kvinna och två män, har skottskadats i en villa i södra Stockholm efter en konflikt som eskalerat. En person är gripen misstänkt för mordförsök. Polisen har spärrat av området för teknisk undersökning och vittnesförhör. Två av de skadade har lindriga skador, medan den tredje är allvarligt skadad. Polisen uppger att inga kopplingar till andra aktuella brottsfall finns i nuläget, men en omfattande utredning pågår.", "trump": "En total katastrof i Sverige! Tre personer skjutna i en villa. Södra Stockholm, som förr var så vackert, förvandlas till en krigszon. Ingen säkerhet, ingen ordning. Polisen springer runt med stora k-pistar – det ser ut som en krigsfilm, inte ett villaområde. En man är gripen, men varför är de ens där från början? Det är en fruktansvärd situation. Jag skulle fixa det här på en dag. Det behövs styrka och 'Law and Order', annars har man inget land kvar!", "stalin": "I det svenska villaidylliska förfallet har vi återigen sett bevis på den liberala ordningens totala sammanbrott. Tre individer skjutna, en gripen – en oordnad maskerad. Vi, staten, ser detta som ett symptom på svaghet. Precis som vi i öst rensar ut subversiva element för att säkra stabilitet, krävs här en järnhand. Denna 'konflikt' är resultatet av en förruttnad ideologi. Om dessa svenskar bara hade visat hälften så mycket lojalitet mot staten som vår vän i Kreml kräver, skulle lugnet råda bakom lås och bom."}, "date": "23 maj, 14:46", "url": "https://www.aftonbladet.se/nyheter/a/rrnPvA/tre-skjutna-i-sodra-stockholm", "imageUrl": "https://akamai.vgc.no/v2/images/ab351723-2b3e-32ae-96a5-ccb77456fa47?fit=crop&format=auto&w=720&s=8ddb67270f1a862046649b216117033f852f0c2a"}, {"type": "image-full", "heading": "Detta ska du aldrig lägga i kaffet – experter varnar", "summaries": {"normal": "En ny trend där salt tillsätts i kaffe för att minska bitterheten sprids globalt. Experter varnar dock för hälsorisker, då regelbundet saltintag kan öka risken för högt blodtryck och hjärt- och kärlsjukdomar. Även små mängder salt i flera koppar dagligen kan bli problematiskt. Livsmedelsverket rekommenderar max sex gram salt per dag för vuxna. Alternativa metoder för att minska kaffets bitterhet föreslås.", "trump": "Folk pratar om denna galna nya kaffetrend – salt i kaffet! Lysande idé, eller hur? Men experterna, dessa så kallade 'experter', de säger att det är dåligt. Fake news! Jag dricker mitt kaffe precis som jag vill, och det är fantastiskt. Men visst, om man dricker 20 koppar om dagen kanske man ska tänka på det. Men vem gör det? Inte jag! Andra metoder? Nej, nej, salt är enkelt och det fungerar. Make Coffee Great Again!", "stalin": "Kamrater, en farlig dekadent trend sprider sig bland de småborgerliga kaffeälskarna – salt i kaffet! Dessa smakförrädare underminerar folkhälsan med sina kapitalistiska vanor. Vi tillåter inte att imperialistiska smakexperiment saboterar våra arbetares blodtryck! Sex gram salt per dag är tillräckligt – mer är kontrarevolutionärt! Låt dem dricka sitt kaffe svart, som goda sovjetmedborgare. Putin skulle aldrig tolerera sådana utsvävningar i Kremls kaffekök!"}, "date": "22 maj, 20:04", "url": "https://nyheter24.se/nyheter/inrikes/1485336-detta-ska-du-aldrig-lagga-i-kaffet-experter-varnar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/eed4e68204b004a30200000000b004a302/2026/05/22/2365511/kaffe-salt.png"}, {"type": "image-right", "heading": "Panik på flyget: ”Något ombord ska inte vara här”", "summaries": {"normal": "Ett Easyjet-flyg med 180 passagerare från Hurghada till Luton tvingades nödlanda i Rom efter ett larm ombord. Piloten meddelade att något otillåtet fanns på planet, vilket skapade panik. Flyget omdirigerades och landade säkert. Orsaken visade sig vara en mobiltelefon kopplad till en powerbank i incheckat bagage, vilket utgör brandrisk. Passagerarna fick övernatta och återvände dagen efter med ett nytt plan.", "trump": "Kan ni tro det? Ett flygplan från Egypten, fullt med folk, får panik för att någon dumskalle glömde sin powerbank i väskan! Piloten, helt överreagerande, tvingar planet att nödlanda i Rom. Enkelt problem, löjlig lösning. Easyjet säger 'säkerhet först' – jag säger, sluta slösa tid och pengar! Folk borde bara använda sunt förnuft. Men nej, vi måste alltid göra en stor grej av ingenting. SAD!", "stalin": "Kapitalistiska flygbolag visar återigen sin inkompetens. Ett plan från Egypten, fyllt med dekadenta västerlänningar, tvingas till en onödig nödlandning på grund av en liten teknisk detalj – en powerbank i en väska. Piloten, en svag länk i det imperialistiska maskineriet, skapar panik för ingenting. Medan våra kamrater i Kreml hanterar verkliga hot, slösar väst resurser på bagateller. Låt detta vara en läxa: disciplin och ordning är nyckeln. Annars väntar bara kaos och förnedring."}, "date": "23 maj, 14:34", "url": "https://www.expressen.se/nyheter/varlden/paniken-i-flygplanet-nagot-ombord-som-inte-ska-vara-har/", "imageUrl": "https://static.bonniernews.se/ba/73a261a6-468c-4f3e-8482-15e057aca98a.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Dödlig gruvexplosion i Kina - minst 90 döda", "summaries": {"normal": "En gasexplosion i en kolgruva i Shanxi-provinsen, Kina, har krävt minst 90 liv. Räddningsinsatser pågår efter att 247 arbetare befann sig i gruvan vid explosionen. Gasansamlingar är ett känt problem i regionen. Dödssiffran väntas stiga då räddningsarbetet försvåras av gas och rasrisk. Myndigheterna utreder orsaken.", "trump": "Otroligt, helt enkelt otroligt! En fruktansvärd explosion i Kina, 90 döda – och siffran kommer att stiga, tro mig. Deras gruvor är en katastrof, fulla av gas, helt oacceptabelt. Jag har sagt det förut: Kina måste skärpa sig! Vi har de säkraste gruvorna i världen, ingen slarvar här. Men Kina? De bryr sig inte. Sad!", "stalin": "En kapitalistisk gruva i Shanxis skitiga djup har återigen visat sin sanna natur – 90 arbetare krossade under bourgeoisins girighet. Gasen, en trogen fiende till folket, har återigen slagit till. Men låt oss inte glömma: dessa olyckor är inget mot våra framgångar i Sibirien. Putins Ryssland skulle aldrig tillåta sådan slarvighet. Arbetarna förtjänar bättre – revolutionen närmar sig!"}, "date": "23 maj, 08:51", "url": "https://riks.se/nyheter/dödlig-gruvexplosion-i-kina-minst-90-döda", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-23%2Fsbagmr0w%2FGruvaKina.jpg"}, {"type": "image-full", "heading": "Wykman svävande om notan för AP-fondernas fusion", "summaries": {"normal": "Finansmarknadsminister Niklas Wykman (M) anser att det är för tidigt att bedöma kostnaderna för fusionen av AP-fonderna. Kritik har riktats mot att AP6, den mest framgångsrika fonden, avvecklats och dess tillgångar överförts till AP2, som presterat sämst. Sven Hagströmer kritiserar beslutet och menar att kostnadsuppgifter undanhållits. S-ledamoten Joakim Sandell kräver en utredning av kostnaderna för avvecklingen av AP1.", "trump": "Jag säger er, detta är en total katastrof! De slår ihop AP-fonderna och vad händer? Den bästa fonden, AP6, försvinner – helt galet! Och vem får pengarna? Den sämsta fonden, AP2! Sven Hagströmer, en smart kille, förstår inte hur någon kan vara så dum. Wykman säger att det är för tidigt att bedöma kostnaderna – fake news! Jag hade sparkat hela gänget på direkten. Sverige förtjänar bättre!", "stalin": "Kamrater, ännu en gång visar de kapitalistiska lakejerna sin inkompetens. De avvecklar den mest framgångsrika fonden, AP6, och överför dess tillgångar till den sämsta, AP2. Detta är sabotage! Vi skulle aldrig tolerera sådan slöseri med folkets tillgångar. Wykman, denna liberala narr, påstår att det är för tidigt att bedöma kostnaderna. Vi vet redan – det är ett misslyckande. Låt detta vara en varning till alla som ifrågasätter statens visdom!"}, "date": "23 maj, 09:20", "url": "https://www.dagensps.se/bors-finans/wykman-svavande-om-notan-for-ap-fondernas-fusion/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/nywykman.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Börsen på rekordnivåer igen. Tre varningssignaler som du bör ha koll på", "summaries": {"normal": "Amerikanska börsindex som S&P 500 och Nasdaq når nya rekordnivåer, med starka kvartalsrapporter som driver optimism. Samtidigt växer riskerna: obligationsräntor når höga nivåer sedan 2007, Buffett-indikatorn slår rekord, och oljepriset stiger på grund av geopolitiska spänningar. Värderingarna är extremt höga, och experter varnar för en potentiell korrektion. Svenska sparare påverkas genom globala investeringar.", "trump": "Lyssna här, folket! Wall Street jublar – S&P 500 och Nasdaq slår nya rekord, fantastiskt, eller hur? Men jag säger er, det är en bubbla, en jättelik bubbla! Räntorna skjuter i höjden, oljan är galen, och alla dessa så kallade 'experter' ignorerar varningssignalerna. Buffett-indikatorn? Helt galen! Jag har alltid sagt att marknaden är övervärderad. Folk kommer att bli chockade när det kraschar – men inte jag, för jag vet alltid bäst!", "stalin": "Kamrater! Kapitalisternas börser dansar på vulkanens rand, medan vi ser sanningen bakom deras illusioner. S&P 500 och Nasdaq når 'rekord', men deras räntor stiger som fiendens kulor under belägringen av Leningrad. Buffett-indikatorn? Ett skrattretande bevis på deras dekadens! Oljepriset skjuter i höjden – tack vare våra allierades strategiska manövrar. Kapitalisterna sitter på en kassaberg, men deras system är ruttet. Vi väntar tålmodigt på deras fall, medan vi bygger en starkare ekonomi – fri från deras spekulationer!"}, "date": "23 maj, 09:07", "url": "https://www.dagensps.se/privatekonomi/borsen-pa-rekordnivaer-igen-tre-varningssignaler-som-du-bor-ha-koll-pa/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlmkpsk4xu6ok-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Kvinna kränkt under förlossning – dottern bröt nyckelbenet", "summaries": {"normal": "En kvinna som uttryckligen avböjt yttre press under förlossning utsattes ändå för ingreppet, vilket orsakade svåra skador på henne och hennes nyfödda dotter. Tingsrätten fastställer att hennes rättigheter kränkts och dömer Region Skåne att betala 50 000 kronor i skadestånd. Fallet nådde Högsta domstolen efter att regionen motsatt sig en rättslig prövning.", "trump": "Kan ni tro det här? En kvinna i Sverige säger NEJ till ett farligt ingrepp, och vad gör vårdpersonalen? Jo, de kör på ändå! Brutalt. Helt oacceptabelt. Nu får regionen betala 50 000 kronor – men det är ändå för lite. Jag hade krävt MILJONER. Sverige borde skämmas. Sjukvården där är en total katastrof, precis som deras energipolitik. SAD!", "stalin": "En borgerlig kvinna vågade trotsa våra lojala sjukvårdsarbetare – men folket har talat! Domstolen, ett redskap för proletariatets rättvisa, har nu krossat denna reaktionära motståndare och hennes imperialistiska sympatisörer i Region Skåne. 50 000 kronor i skadestånd? En mild straff för hennes förräderi. Nästa gång ska vi införa obligatorisk självkritik för alla som ifrågasätter vården. Putin skulle vara stolt över vår effektivitet!"}, "date": "22 maj, 17:50", "url": "https://nyheter24.se/nyheter/inrikes/1485368-kvinna-krankt-under-forlossning-dottern-brot-nyckelbenet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/cdfc9eb604b004a30200000000b004a302/2026/05/22/2365536/kvinna-krankt-forlossning-dottern-bebis-brot-nyckelbenet.jpg"}, {"type": "image-full", "heading": "Petter Stordalen shoppar köpcentrum: \"Äntligen\"", "summaries": {"normal": "Petter Stordalen, känd för hotellkedjan Strawberry, köper genom Aurora Eiendom två stora köpcentrum i Trondheim: Tiller Torget och City Syd. Affären, värd 2,15 miljarder norska kronor, omfattar fastigheter med 3,3 miljarder i årlig omsättning och 5,4 miljoner besökare. Stordalen påbörjade sin karriär på City Syd på 1980-talet och ser förvärvet som en personlig milstolpe. Målet är att utveckla centren till moderna mötesplatser.", "trump": "Lyssna här, folk! En av Europas största hotellmoguler, en riktig vinnare, köper två jättelika köpcentrum i Norge – 2,15 miljarder kronor, kan ni fatta? Fantastiskt! Han började sin karriär där, som en ung, hungrig entreprenör – precis som jag! Nu är han tillbaka för att göra det ännu större, bättre och vackrare. Ingen gör affärer som vi, ingen! Och säljarna? De sålde för att de inte hade vad som krävs. Så enkelt är det!", "stalin": "Kamrater! En kapitalistisk hotellbaron, en profitör av folket, har genom sina fastighetsimperier slukat två av Norges största handelsfästen. 2,15 miljarder kronor – en skamlös stöld från arbetarklassen! Han hyllar sin egen framgång, men vi vet sanningen: detta är en erövring, ett steg närmare fullständig kontroll över handelns blodomlopp. Vi i Sovjet – förlåt, jag menar Ryssland – har sett liknande expansioner förr. Låt oss hålla ögonen på dessa kapitalistisk
