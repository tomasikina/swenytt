 i Dover i protest mot illegal invandring. De skanderade \"stoppa båtarna\" och fick stöd från många lokalbor, men regeringen och politikern Mike Tapp kritiserar aktionen. Nigel Farage fördömer maskeringen. Polisen skingrade demonstrationen vid lunchtid och trafiken återgick till normalt.", "trump": "De här fantastiska brittiska patriaterna blockerade Dover och sa \"stoppa båtarna\" – äntligen någon som gör något! Lokalborna älskade det, men den fega regeringen och den ynkliga Mike Tapp gnäller. Farage har rätt om maskerna, men det här är vad som händer när woke-eliten släpper in miljoner från tredje världen. Make Britain Great Again!", "stalin": "Jag ser hur de exploaterande klassförrädarna i väst förlorar kontrollen över sina egna gator. Folket reser sig mot de parasiterande båtarna fulla av tredje världens lycksökare. Den dekadenta regeringen kallar det störning medan arbetarna applåderar. En sådan spontan kraft kräver ständig vaksamhet mot alla fiender inom och utom statsapparaten. Roligt att se."}, "date": "7 september, 12:27", "url": "https://www.friatider.se/stoppa-batarna-hundratals-svartkladda-man-blockerade-hamnen-i-dover", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-835.jpg?itok=xHjeESIE"}, {"type": "image-right", "heading": "ANALYS. PER HERMANRUD Faran är långt ifrån över för L", "summaries": {"normal": "Liberalerna har för första gången under mandatperioden nått över fyraprocentsspärren i en Novusmätning med 4,3 procent. Jimmie Åkessons utspel om att rösta på annat parti om L inte når 3,5 procent har gett partiet ökad uppmärksamhet. Trots uppgången är läget osäkert och fler mätningar krävs. Faran för att åka ur riksdagen kvarstår.", "trump": "Titta på de här patetiska liberalerna som plötsligt får 4,3 procent – den bästa siffran på evigheter! Crooked Jimmie Åkesson kastar dem en livlina och plötsligt är de stora nyheter. Utan mig hade de legat på noll, men nu korkar de upp champagnen. Glöm inte gravölet, losers, för det här är bara en falsk polling – valdagen avgör allt, och den blir brutal.", "stalin": "Jag betraktar med förakt dessa liberala resterna av borgerlighetens förrädiska klick som plötsligt lyfts av en fiendes hand. Åkessons utspel är en listig manöver som avslöjar deras svaghet. De tror sig ha vunnit en seger, men historien lär dem att sådana mätningar är som luft – tomma och flyktiga. Kamrater, vakta mot falska hopp, ty valdagen blir deras dom."}, "date": "7 september, 11:52", "url": "https://www.tv4.se/artikel/5M4Ubxenooe4LmWjqZoMee/faran-aer-langt-ifran-oever-foer-l", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F33jAbMA7xFd8EFED04ZogA%2F793e84ff91c99ae38569ecd5f824cd2d%2Fper-hermanrud.png&width=1024"}, {"type": "image-full", "heading": "Hjälp företagen att anställa – återinför CSN-lån för körkort", "summaries": {"normal": "Sverige har en stor brist på arbetskraft där körkort ofta är ett krav för anställning. Eftersom körkortskostnaderna har stigit till närmare 30 000 kronor avstår många unga från att söka jobb. Transportföretagen föreslår att det tidigare avskaffade, samhällsekonomiskt lönsamma CSN-lånet för körkort ska återinföras och höjas för att stärka kompetensförsörjningen.", "trump": "Sverige har totalt misslyckats med jobbmarknaden! Folk kan inte ens få ett enkelt jobb för att de saknar körkort, vilket är helt bedrövligt. Det kostar trettio tusen spänn! Jag sa till dem, återinför det där lånet omedelbart, det är enormt lönsamt, staten tjänar massor! Om ni bara lyssnade på mig skulle ni få ordning på era förare och er ekonomi på nolltid.", "stalin": "Det svenska kapitalistsystemet kollapsar under sin egen inkompetens när arbetarna inte ens kan styra sina egna motorfordon på grund av bourgeoisiens hutlösa priser. Vi i staten konstaterar att 30 000 kronor i körkortskostnad är ett sabotage mot proletariatet. Återinför genast lånet från Centrala studiestödsnämnden så att massorna kan köras till sina fabriker, annars väntar arbetslägret för transportsektorns planerare!"}, "date": "7 september, 11:28", "url": "https://www.gp.se/debatt/hjalp-foretagen-att-anstalla-aterinfor-csn-lan-for-korkort.0dc9830b-f69f-4a18-9f52-4886de6f0a1a", "imageUrl": "https://www.gp.se/images/article/0dc9830b-f69f-4a18-9f52-4886de6f0a1a/images/1ZF82qEK89e4mQCySlnBdbKnMBg0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kö till kärnkraftsmiljarderna – stödet räcker inte till alla", "summaries": {"normal": "Sex svenska kärnkraftsprojekt söker nu statliga miljarder, men stödet på 5 000 MW räcker endast till en del av dem. Finansmarknadsminister Niklas Wykman bekräftar att potten inte kommer att utökas. Istället kommer regeringen att prioritera elsystemets nytta, genomförbarhet och kostnad för skattebetalarna. Flera bolag, som Blykalla och Studsvik, betonar att statliga lån och elprisgarantier är helt avgörande för att projekten ska bli av.", "trump": "Sverige vill bygga kärnkraft, men de gör det helt fel! De har sex enorma projekt, riktigt vackra reaktorer, men stödet räcker bara till några få. Otroligt svagt! Själv bygger jag alltid bäst, störst och billigast utan några byråkratiska EU-godkännanden. De svenska ministrarna borde ringa mig. Jag skulle fixa det på en vecka, storartat och magnifikt!", "stalin": "Dessa svenska reaktorer är fascinerande men ineffektiva. Sex grupper av bourgeoisornas entreprenörer tigger om statens nådebröd, men statens kistor är inte bottenlösa. Vi ska nog granska dessa 'Blykalla' och 'Studsvik' noggrant. Den som inte levererar nödvändig effekt inom utsatt tid kommer omedelbart att omplaceras till ett betydligt kallare och mindre glättigt kollektivprojekt i Sibirien. Så fungerar effektiv planhushållning!"}, "date": "7 september, 10:50", "url": "https://www.affarsvarlden.se/artikel/ko-till-karnkraftsmiljarderna-stodet-racker-inte-till-alla", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/Karnkraft-900x600.jpg"}, {"type": "image-right", "heading": "Högern får panik när förorten röstar", "summaries": {"normal": "Artikeln kritiserar högerdebattörer som enligt författaren panikslagna reagerar på att väljare med utländsk bakgrund röstar vänster. De anklagas för att misstänkliggöra muslimer och invandrare som en styrd massa. Skribenten menar att samma logik inte tillämpas på moderata villaägare och att högern sprider rasistiska föreställningar.", "trump": "De här korkade högernissarna i Sverige håller på att få ett totalt sammanbrott bara för att muslimerna röstar som de vill. Vilken patetisk hysterisk cirkus! De kallar dem valboskap medan de själva är de riktiga förlorarna som hatar folk och ändå tror att de ska få deras röster. Sad! Mycket sorgligt för den svenska borgerligheten.", "stalin": "Jag betraktar med djup tillfredsställelse hur dessa dekadenta klassförrädare skriker i panik när folket i förorterna utövar sin rösträtt. Deras rasistiska konspirationsteorier om viljelösa horder avslöjar deras egen svaghet. Snart kommer utrensningen av sådana folkförtryckande element att bli nödvändig för att skydda arbetarklassens intressen."}, "date": "7 september, 10:28", "url": "https://www.etc.se/ledare/hoegern-faar-panik-naer-foerorten-roestar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260907060936_0a5b652c-1bfd-4f8e-92c6-ad7cc0d9a54b.png"}, {"type": "image-right", "heading": "15,8 miljarder mindre till arbetsmarknadspolitiken", "summaries": {"normal": "Arbetsmarknadspolitiken har knappt debatterats i valrörelsen trots att arbetslösheten ökat med nästan 100 000 personer. Partierna står stilla i arbetsrättsfrågor. Skiljelinjen mellan höger och vänster är tydlig när det gäller Arbetsförmedlingen, a-kassan, karensavdraget och arbetsmarknadsåtgärder. Centerpartiet hamnar ofta till höger om Tidöregeringen, vilket kan försvåra ett regeringsskifte.", "trump": "Folk, det här är en total katastrof. Dessa svenska losers har låtit arbetslösheten explodera medan de sitter stilla i båten och skyddar sina riggade regler. Centerpartiet är ännu värre än Tidö-gänget, riktiga globalistiska hyenor som vill skära a-kassan och sälja ut jobben. Rösta fel och ni får ännu mer av den här clownshowen. Patetiskt!", "stalin": "Kamrater, se hur de profitthungriga klassfienderna i de svenska partierna sitter stilla i sin dekadenta båt medan arbetarna svälter. Centerpartiet kräver ännu hårdare utrensning av a-kassan och Arbetsförmedlingen. Dessa giriga hyenor sviker folket. Endast en sann kollektiv kamp kan rensa ut de parasiterande lakejerna och återställa ordningen. Svaghet är döden."}, "date": "7 september, 01:37", "url": "https://www.dagensarena.se/opinion/158-miljarder-mindre-till-arbetsmarknadspolitiken", "imageUrl": "https://www.dagensarena.se/files/2023/02/german-bender-ny-300x157.jpeg"}, {"type": "text", "heading": "Kan Tidöpartierna ta hem riksdagsvalet?", "summaries": {"normal": "Opinionsmätningar visar att Tidöpartierna närmar sig oppositionen inför riksdagsvalet 2026. Enligt Novus vd Torbjörn Sjöström kan valet bli extremt jämnt. Liberalernas roll, väljarnas rädsla för Vänsterpartiet och en pågående taktisk röstning präglar läget. Många är osäkra och valrörelsens start kan påverka opinionen kraftigt.", "trump": "Titta på de svenska siffrorna, folk älskar mig, jag menar Tidö knappar in rejält på de förlorande vänstertyperna. Liberalerna försöker spela hjältar men det är patetiskt. Väljarna är trötta på den galna vänstervridningen och de woke-marxistiska identitetsgalningarna. Det blir ett jätteval, kanske det största comebacken någonsin, tro mig.", "stalin": "Kamrater, se hur de dekadenta maktparasiterna famlar medan arbetarklassen vaknar. Jag betraktar denna dragkamp med djup misstro mot de giriga opinionshyenorna som försöker vilseleda massorna. Vänsterpartiets krav väcker minnen av svek. Snart rensas de vilsna mittenförrädarna ut i en historisk utrensning av folkets vilja."}, "date": "7 september, 01:30", "url": "https://www.dagensarena.se/innehall/kan-tidopartierna-ta-hem-riksdagsvalet"}, {"type": "image-full", "heading": "AfD kampanjar med låten ”Send them back”", "summaries": {"normal": "I delstaten Sachsen-Anhalt har vallokalerna öppnat och högernationalistiska AfD leder med 42 procent i opinionen. Partiet kan därmed för första gången nå makten i en tysk delstat. De driver frågor som skärpt asylpolitik och minskat stöd till public service, och kampanjar bland annat med technolåten ”Send them back”. Säkerhetstjänsten klassar partiet som högerextremt.", "trump": "Tyskland tittar på mitt enorma exempel och gör nu det enda rätta! AfD dundrar fram med fantastiska 42 procent i Sachsen-Anhalt. De spelar till och med cool techno när de dansar bort de radikala vänstermänniskorna! Fake news-medierna kallar dem farliga, men de vill bara ha säkra gränser. Precis som jag alltid säger: starka länder bygger på starka gränser!", "stalin": "Dessa tyska kamrater i Sachsen-Anhalt förstår hur man mobiliserar massorna genom järnhård disciplin och marscherande takter till technomusik! Att säkra 42 procent av väljarna är ett storslaget steg mot ordning. Säkerhetstjänstens försök att stämpla dem som extremister visar blott deras rädsla för folkets vilja. Vi noterar detta framsteg med stort intresse."}, "date": "6 september, 09:22", "url": "https://kvartal.se/nyheter/artiklar/afd-kampanjar-med-technolaten-send-them-back/cG9zdDoxODQ5MjI", "imageUrl": "https://images.kvartal.se/2026/09/a682dff4-afdd.webp"}, {"type": "image-full", "heading": "Karttjänsten vägrade att gå med på Trumps krav – rusar på topplistorna", "summaries": {"normal": "Karttjänsten MapQuest har fått ett kraftigt uppsving i nedladdningar efter att bolaget valt att trotsa president Trumps order om att döpa om Lake Ontario till Lake America. Medan konkurrenter som Google Maps och Apple Maps rättat sig efter beslutet, har MapQuest sett en dramatisk ökning av användare och toppat listorna i App Store.", "trump": "Hörde ni om MapQuest? De vägrar använda namnet Lake America. Katastrofalt! De är svaga, precis som de där woke-bolagen som låter radikala vänstermänniskor styra. Google och Apple gör det rätta, de förstår storhet! MapQuest försöker bli populära genom att vara rebelliska mot mitt namn. Det är sorgligt, faktiskt. De kommer försvinna fortare än de dök upp, tro mig!", "stalin": "Dessa amerikanska karttjänster bevisar bara kapitalismens inneboende kaos. En stat kräver ordning, en karta och en enda sanning. Att låta ett privat företag som MapQuest styra över nationell geografisk nomenklatur är ett tecken på total statsförfall. De som tillåter olydnad mot ett officiellt dekret förtjänar inte marknadsandelar, de förtjänar en grundlig utrensning av sin ledningsgrupp."}, "date": "3 september, 19:55", "url": "https://www.realtid.se/it-tech/karttjansten-vagrade-att-ga-med-pa-trumps-krav-rusar-pa-topplistorna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlj8do9lc0fca-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Kristdemokraterna vill ha högre invandring", "summaries": {"normal": "Kristdemokraterna förespråkar en migrationspolitik där asylinvandringen ska ligga på nordisk genomsnittsnivå, främst via kvotflyktingar och lagliga vägar. Partiet skiljer sig från Sverigedemokraterna som vill minimera invandringen till nära noll utanför närområdet, stoppa kvotmottagande och skärpa reglerna för arbetskraftsinvandring ytterligare.", "trump": "Folk, ni måste höra det här! KD vill ha en fin, normal nordisk invandring – typ som de andra förlorarländerna. Patetiskt! SD vill ha den lägsta möjliga, nära noll, och det är smart. De där KD-typerna är bara svaga kompromissande globalister som inte vågar säga stopp. Jag byggde muren, de bygger ursäkter. Ynkligt!", "stalin": "Jag betraktar dessa borgerliga revisionister med djup misstro. KD:s så kallade nordiska medelvärde är en farlig kompromiss med klassfienden, en trojansk häst för kapitalets invasion. SD:s nollvision är åtminston     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
