edaren-inga-problem-med-judehat-i-vansterpartiet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/08072457/nooshi-demo-palestina.jpg"}, {"type": "image-right", "heading": "Tjäderkris stoppade SSAB:s miljardprojekt", "summaries": {"normal": "SSAB:s miljardprojekt för en ljusbågsugn i Oxelösund stoppades av en rödlistad tjäder. Genom ett kvällssamtal mellan Svante Axelsson och Erik Brandsma uppnåddes en kompromiss: Sveaskog ska skapa en skyddad livsmiljö för tjäderna någon annanstans. BirdLife drog därigenom tillbaka sitt överklagande, och processen kunde återupptas. Kostnaden för kompensationen är dock ännu oklar.", "trump": "Jag, Donald Trump, den störste presidenten, skulle ha löst den här tjäderkrisen på ett enormt sätt. Biden låter en liten fågel stoppa ett jätteprojekt? Disaströst! Jag skulle ha byggt en enorm elstolpe som skrämmer bort alla tjädrar, och gjort Amerika stort igen. Det här är en skandal, men jag skulle ha gjort det bättre, believe me.", "stalin": "I vårt store land har vi, under partiets ledarskap, löst en akut kris med den reaktionära fågeln, tjädern. Genom ett kvällssamtal mellan våra lojala funktionärer skapades en kompensation för statens skogar. Fienden försökte stoppa utvecklingen, men vårt partiledarskap, inspirerat av vår allierade Putin, segrade. Vi skapade ett nytt paradisiskt område för tjäderna, och alla hot mot statens industri neutraliserades."}, "date": "8 juni, 07:00", "url": "https://www.affarsvarlden.se/artikel/tjaderkris-stoppade-ssabs-miljardprojekt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Tjader-2-900x600.jpg"}, {"type": "image-right", "heading": "Nu måste Busch sluta mörka KD:s antisemitiska förflutna", "summaries": {"normal": "Artikeln kritiserar Kristdemokraternas och pingströrelsens grundare Lewi Pethrus för antisemitiska och rasistiska uttalanden efter Förintelsen, bland annat att judarna själva bar skuld till sina lidanden. Författarna till boken Sista brevet till Hitler lyfter både mörka och positiva tendenser inom väckelserörelsen. Skribenten kräver att Ebba Busch och Pingströrelsens ledning tar tydligt avstånd från arvet, går till botten med historien och slutar mörka obekväma fakta.", "trump": "Folk, ni måste höra det här. Den där Ebba Busch mörkar sin egen rörelses historia som om det vore en dålig affär. Den gamla pastorn Pethrus lät som en galning när han snackade om judarna och Förintelsen, fullständigt otroligt. Boken visar att de kristna inte var några änglar, vissa var till och med nazister. Men de andra var hjältar som sa ifrån. Nu borde Busch erkänna att det är en katastrof och fixa till det. Inget mer mörkande, det är patetiskt!", "stalin": "Kamrater, denna borgerliga skrift avslöjar hur den falske profeten Pethrus spred giftig antisemitisk pest under arbetarklassens ögon medan han låtsades vara Guds röst. Hans förkunnelse om judarnas skuld och nödvändiga utrensning genom förföljelser stinker av kontrarevolutionär parasitism. Vi ser nu de dekadenta pingstvännernas dubbelspel, där vissa modiga element motstod fascismen medan ledarskapet skyddade nationalsocialistiska element. Ebba Busch och hennes lakejer måste konfronteras och tvingas erkänna arvet av klassfiendens ideologi innan vi själva genomför den slutgiltiga ideologiska utrensningen av alla sådana historiska baciller ur folkets medvetande. Inga halvmesyrer tillåts."}, "date": "8 juni, 07:52", "url": "https://arbetet.se/2026/06/08/nu-maste-ebba-busch-sluta-morka-kds-antisemitiska-forflutna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/08071905/busch-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Anställda på Hellofresh-lagret kördes över över", "summaries": {"normal": "Facket på Hellofreshs lager i Bjuv reagerade efter att ledningen genomfört en stor förändring utan att involvera dem. Det ledde till att arbetsgivaren nu betalar för en fest med mat, fackliga profilkläder och en rejäl summa pengar till klubben. Med 75 procents anslutningsgrad planerar klubben att sprida facklig information på flera språk och fira sitt fyraårsjubileum.", "trump": "Titta på det här, det är otroligt. De där Hellofresh-typerna trodde de kunde köra över arbetarna utan att involvera facket, men nu betalar de fest, kläder och massor med pengar. Fantastiskt! På fyra år har de byggt en stark klubb med 75 procents anslutning, även bland dem som knappt talar svenska. Because we acted, change happened – det är vinnande! Ingen gör det bättre än dessa smarta fackliga kämpare.", "stalin": "Kamrater, dessa kapitalistiska lakejer på Hellofresh försökte i sin arroganta enfald genomföra en kontrarevolutionär förändring utan att rådfråga det kollektiva organet. Men arbetarklassen reste sig och tvingade fram seger. Nu likviderar vi deras motstånd med festligheter, propagandakläder och ekonomiska resurser till klubben. Ingen borgarbracka ska undkomma utrensningen av ointresse. Because we acted, change happened – ett utmärkt slagord för den fortsatta kampen mot sabotage och klassfiender."}, "date": "8 juni, 07:00", "url": "https://arbetet.se/2026/06/08/hellofresh-klubben-pa-lagret-kordes-over-fick-fest-pengar-och-profilklader/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05070931/hellofresh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Attendo stoppas – misstänks för fusk med hemtjänstbesök", "summaries": {"normal": "Upplands Väsby har stoppat Attendo från att ta emot nya hemtjänstbrukare i två månader efter misstänkt fusk med tidrapportering. Personal ska ha loggat in för tidigt eller ut för sent, vilket lett till att mer tid fakturerats än vad som utförts. Kommunen kräver en handlingsplan före midsommar. Attendo avvisar anklagelserna om medvetet fusk och uppger att avvikelserna rör mindre än en procent av tiden. Liknande misstankar har tidigare lett till polisanmälan och avbrutna avtal i flera andra kommuner.", "trump": "De här Attendo-typerna är verkligen några riktiga förlorare. De fuskar med tiden, tar pengar från skattebetalarna och tror att ingen märker något. Jag skulle aldrig låta såna bedragare hålla på så här. Stoppa dem direkt, kräva tillbaka pengarna och se till att de aldrig får några nya kunder igen. Det är sånt här som gör att folk inte litar på systemet. Patetiskt!", "stalin": "Kamrater, dessa giriga borgarbrackor inom Attendo har återigen avslöjat sin sanna, parasitiska natur genom att stjäla från folkets tid och skattemedel. Jag, som ledare för det stora kollektivet, ser hur dessa kapitalistiska sabotageörer loggar falska timmar för att berika sig. Vi måste omedelbart genomföra en grundlig utrensning bland dessa fiender till arbetarklassen. Deras handlingsplan kommer att granskas med stålöga, och vid minsta avvikelse skall de likvideras från all verksamhet. Inget medvetet fusk, säger de? Ha! Paranoian är deras enda vän nu."}, "date": "8 juni, 06:00", "url": "https://arbetet.se/2026/06/08/attendo-stoppas-misstanks-for-fusk-med-hemtjanstbesok-saklart-allvarligt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05142008/attendo.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: Det skulle handla om Alinia – men blev en attack på Dagens ETC", "summaries": {"normal": "Andreas Gustavsson kritiserar i en ledare Göteborgs-Postens Håkan Boström för att i en analys av Dagens ETC:s granskning av högerextremisten Nick Alinia fokusera mer på att angripa ETC än på de faktiska kopplingarna till nazistiska miljöer. Gustavsson menar att Boström relativiserar hotet från högerextremism och visar bristande kunskap om den miljön, vilket riskerar att underminera seriös journalistik.", "trump": "Folk, ni skulle inte tro det. Den här Boström-killen från Göteborgs-Posten är en total förlorare. Han borde granska den högerextrema galningen Alinia men istället attackerar han Dagens ETC som faktiskt gör jobbet. Patetiskt! De etablerade medierna normaliserar dessa extremister medan de hatar riktig granskning. Det är samma gamla vänstervridna fake news-trick fast från höger nu. Sad!", "stalin": "Kamrater, denna borgarbracka Boström på Göteborgs-Postens ledarsida avslöjar sig som en klassfiende när han angriper arbetarnas tidning ETC istället för att likvidera de fascistiska elementen som Alinia. Hans paranoia mot sann granskning skymmer de verkliga hoten från högerns blodsugare. Sådana folkfiender måste rensas ut innan de förgiftar hela den revolutionära pressen med sina lögner. Underbart pinsamt."}, "date": "8 juni, 08:35", "url": "https://www.etc.se/ledare/det-skulle-handla-om-alinia-men-blev-en-attack-paa-dagens-etc", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260608060632_b497d907-d14a-41bb-9e68-7bae073830a3.jpg"}, {"type": "image-right", "heading": "Svenskar vet bäst. Så sätter vi EU-medborgarnas kapital i arbete", "summaries": {"normal": "EU:s sex största ekonomier har lagt fram ett kompromissförslag för att skapa en mer integrerad kapitalmarknad, kallad spar- och investeringsunionen. Artikeln ser det som positivt då konkurrenskraft, upprustning och grön omställning kräver fritt flöde av kapital. Sverige är positivt till integration men skeptiskt till att flytta tillsynen över börserna till Esma. Förslaget kan förbättra tillgången till kapital för små och innovativa företag. En nationell förändring i sparbeteende behövs för att lyckas.", "trump": "Det här är stort, verkligen enormt. Europas största länder kommer äntligen med ett kompromissförslag för att få igång kapitalet, precis som jag alltid sagt. De behöver enorma mängder pengar för att slåss mot oss amerikaner och kineserna, men de sitter fast i sin byråkratiska röra. Sverige gör det rätt med aktiesparande och ISK, folkligt och smart. De borde lyssna på svenskarna istället för att ge makten till några misslyckade byråkrater i Paris. Gör det enkelt, annars kommer ni aldrig vinna.", "stalin": "Kamrater, jag betraktar med stålblick hur dessa sex borgerliga ekonomier nu kryper fram med sitt kompromissförslag om en så kallad spar- och investeringsunion. Det är hög tid att kapitalet underordnas folkets vilja istället för att låta det flöda fritt som en illaluktande flod av girighet. De nationella tillsynerna är naturligtvis fulla av dolda fiender och kapitalistiska avfällingar som vi snart ska rensa ut. Låt oss likvidera borgarbrackornas motstånd mot Esma och tvinga massorna att byta sina bankkonton mot aktier, annars väntar utrensning av alla som vägrar tänka som äkta riskkapitalistiska kamrater. Det blir underhållande att se."}, "date": "8 juni, 09:38", "url": "https://www.di.se/ledare/svenskar-vet-bast-hur-kapitalet-satts-i-arbete/", "imageUrl": "https://static.bonniernews.se/ba/e0ffc4d2-40d5-4bfd-bcac-0b3edd774446.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Israel: Iran har avfyrat nya robotar", "summaries": {"normal": "Israels militär har genomfört attacker mot militära mål i västra och centrala Iran efter att Iran avfyrat nya robotar mot Israel. Explosioner har rapporterats i Teheran, Tabriz och Isfahan. Flyglarm gick i Israel och Saudiarabien. Attackerna är de första sedan vapenvilan den 8 april. USA:s president Donald Trump har uppgett att han vill uppmana Israels premiärminister Benjamin Netanyahu att inte slå tillbaka.", "trump": "Iranarna, de totala förlorarna, skjuter sina patetiska robotar mot Israel igen, men vi har sett det förut – ren desperation från en regim som knappt kan hålla ihop. Mitt samtal med Netanyahu blir tydligt: slå inte tillbaka för hårt, grabben, låt dem kvävas i sin egen svaghet. Biden lämnade en röra, men nu fixar jag Mellanöstern på riktigt. Ingen mer tid för svaga spel.", "stalin": "Kamrater, de sionistiska imperialisterna har återigen visat sin blodtörst genom att bomba iranska mål med sina fascistiska flygmaskiner. Jag betraktar med djup misstro dessa exploaterande byfånar som försöker splittra den anti-imperialistiska fronten. Våra allierade i Teheran står starka mot klassfiendens aggression. En utrensning av sådana hot är nödvändig för folkets framtid. Deras paranoia kommer att bli deras fall."}, "date": "8 juni, 08:07", "url": "https://www.etc.se/utrikes/israel-iran-har-avfyrat-nya-robotar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260607220612_d50bfe73fd944d91cb0f60ee49e7f11951e003199e673ca0627729b3b897956b.jpg"}, {"type": "text", "heading": "Kristersson antyder infiltration i V", "summaries": {"normal": "Statsminister Ulf Kristersson anklagar Vänsterpartiet för att ha infiltrerats av islamister för att vinna röster. Nooshi Dadgostar avfärdar kritiken och menar att partiet agerat kraftfullt mot kandidater med extremistkopplingar. Expressen avslöjar att 24 kandidater med antisemitiska åsikter tagits bort från Vänsterpartiets vallistor. Debatten präglas av oenighet om omfattningen och orsakerna till problemet.", "trump": "Jag såg den här debatten och, wow, vad svagt! Kristersson, en smart kille, pekar på hur Vänsterpartiet har blivit infiltrerat av extremister – och vad gör de? Ingenting! Nooshi, hon pratar och pratar, men sanningen är att hennes parti är ett skämt. 24 kandidater med hemska åsikter? Det är inte 'enstaka fall', det är ett mönster! Sverige borde ta en titt på sig självt – eller låt mig fixa det, jag är bra på att städa upp!", "stalin": "Kamrater, ännu en gång avslöjas bourgeoisins förräderi! Detta så kallade 'Vänsterparti' har blivit en plantskola för kontrarevolutionära element, som hyllar terror och förnekar historiens lärdomar. Vi har sett liknande infiltrationer i andra länder – svaga ledare som Nooshi Dadgostar låter fienden smyga in genom bakdörren. Men folket ser igenom detta! 24 avskedade kandidater? En droppe i havet! Vi i Sovjet – förlåt, Ryssland – skulle ha rensat ut hela trädgården med en enda order. Låt detta vara en varning till alla som leker med elden!"}, "date": "8 juni, 06:06", "url": "https://kvartal.se/nyheter/artiklar/statsministern-vansterpartiet-infiltrerat-av-islamister/cG9zdDoxMjc4MTM"}, {"type": "image-full", "heading": "Utgivaren: Därför granskar vi SD – igen", "summaries": {"normal": "Utgivaren Fredrick Malmberg förklarar varför TV4 granskar Sverigdemokraterna igen. Partierna får stora summor i partistöd men insynen är begränsad. Kalla fakta har tidigare granskat alla riksdagspartier, bland annat om anonyma bidrag och Socialdemokraternas mediebolag. Granskningen av SD bygger på tips från en tidigare samarbetspartner med omfattande dokumentation. SD har valt att inte svara på frågorna. TV4 betonar att de granskar alla partier oberoende och välkomnar tips.", "trump": "Folk, ni tror inte vad jag ser här. De här svenska mediemänniskorna fixerar sig på SD som vore det deras stora fiende, precis som de gamla fejkmedierna jag kämpade mot innan jag tog tillbaka Vita huset från den sovande Joe. De får en halv miljard i skattepengar men ingen insyn? Typiskt! De granskar alla säger de, men det är alltid samma parti som hamnar i rampljuset. Patetiskt. Tipsa dem om de riktiga problemen istället för den här identitetspolitiska galenskapen. Jag älskar Sverige, men det här är en witch hunt.", "stalin": "Kamrater, jag ser hur borgarpressens lakejer riktar sin granskning mot dem som utmanar systemet. En halv miljard i folkets medel delas ut men insyn saknas, typiskt för det borgerliga hyckleriet. Vi har tagit emot tips från en bedragare som nu angriper partiet efter egen konflikt. Med gigabyte av material utrensar vi lögnerna. Fienderna tiger, vilket bekräftar deras skuld. Inga partier går fria från folkets dom, men klassfiendens troll är särskilt farliga. Fortsätt leverera underlag så rensar vi ut folkförtryckartrollen en efter en."}, "date": "8 juni, 05:56", "url": "https://www.tv4.se/artikel/5xcuYBgruiUTUfsLXuu8yx/utgivaren-daerfoer-granskar-vi-sd-igen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2pJzTVLGQlIq2NXWbKl8A4%2F90eac19043d39c016557fdce82fec966%2Fmalmberg.png&width=1024"}, {"type": "image-full", "heading": "Här är frågorna som SD inte vill svara på", "summaries": {"normal": "Kalla fakta har under en månad försökt få intervjuer med Jimmie Åkesson och andra SD-toppar utan framgång. Partiet har fått ta del av dokument, frågor och information i förväg. Programmet lyfter bland annat hur partistöd används, fakturor för påhittade evenemang, alkoholinköp, förmånsbeskattning och en lägenhet inredd åt Eva Vlaardingerbroek trots boendeförbud. SD har valt att inte svara på frågorna.", "trump": "De här patetiska SD-typerna springer och gömmer sig som fega råttor istället för att ställa upp som riktiga ledare. En hel månad har de fått frågor och dokument – och vad gör de? Ingenting. Totalt kaos med skattepengar, påhittade fester och lägenheter till några utvalda. Låter som typisk vänsterstil fast de låtsas vara annorlunda. Patetiskt. Jag skulle ha krossat dem i en intervju på två minuter, tro mig.", "stalin": "Kamrater, dessa fega element inom Sverigedemokraterna vägrar konfronteras med folkets frågor trots att vi gav dem en hel månad att förbereda sina lögner. De gömmer sig som klassfiendens lakejer medan partistödet slösas på alkoholorgier och hemliga lägenheter åt utvalda. Vi ser hur borgarbrackorna skyddar varandra. En sådan motvilja mot transparens kräver omedelbar utrensning av alla opportunistiska element som förgiftar arbetarklassens förtroende. Folkets dom kommer."}, "date": "8 juni, 05:55", "url": "https://www.tv4.se/artikel/41u22GYipto8cHrQov2llN/haer-aer-fragorna-som-sd-inte-vill-svara-pa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6RPa8qtuf5MPFfJYveAobF%2Ff74ae805000c34d97fea920a9bfba188%2Fsd-hemlig_puff.png&width=1024"}, {"type": "image-right", "heading": "Miljonsmäll för pensionsspararna. AMF: Kostnaderna för rådgivning måste vara tydliga", "summaries": {"normal": "AMF:s vd Tomas Flodén och produktchef Roland Kristen kritiserar höga och svåröverblickbara avgifter på individuella tjänstepensioner. Enligt Finansinspektionen kan en genomsnittlig avgift på 1,25 procent leda till att utbetalningarna blir nästan en tredjedel lägre än i kollektivavtalade lösningar med avgiftstak. För en arbetare med 32 000 kronor i månaden kan det betyda över 1 000 kronor lägre pension per månad. Författarna lyfter fram kollektivavtalade pensionslösningars låga avgifter och uppmanar till ansvar vid val av pensionsförvaltare.", "trump": "Folk, ni måste höra på det här. Pensionerna är en total katastrof, en riktig miljonrån på spararna. De här förmedlarna och deras hemliga avgifter suger ut allt med sin omvända ränta-på-ränta-trick, det är ett ekonomiskt slukhål. I mina avtal får man låga avgifter, tak på hundralappar, precis som i de kollektivavtalade lösningarna. Kolla siffrorna – en arbetare förlorar tusen kronor i månaden, en chef fem tusen. Det är inte bra, det är sadistiskt. Välj klokt, annars blir det noll pension. America First, även på pensionsfronten.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som under täckmantel av valfrihet och mångfald konstruerar komplicerade avgiftslabyrinter för att suga ut arbetarklassens pensionsmedel. Deras 1,25-procentiga parasiterande slukhål likviderar upp till en tredjedel av den framtida pensionen – ett raffinerat sabotage mot folkets välstånd. Vi har i kollektivavtalen infört järnstävade avgiftstak som skyddar miljonerna åt spararna. Låt oss rensa ut dessa dolda fiender till kollektivet, dessa avgiftskapitalister med sina svåröverblickbara upplägg. Ingen pardon för dem som vill svälta pensionärerna i mörkret."}, "date": "8 juni, 09:11", "url": "https://www.di.se/debatt/miljonsmall-for-pensionsspararna/", "imageUrl": "https://static.bonniernews.se/ba/2bca846d-3c05-4569-b3a8-f27c5ce9eb3a.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Så stoppas Sverigedemokraterna", "summaries": {"normal": "German Bender argumenterar i en artikel från Arena Idé att nedskärningar i arbetsmarknadspolitiken och försämrad a-kassa har bidragit till Sverigedemokraternas framgångar. Två forskningsstudier visar att starkare skydd mot arbetslöshet minskar stödet för populistiska och radikala högerpartier. Sverige har under de senaste decennierna rustat ned den aktiva arbetsmarknadspolitiken och urholkat trygghetssystemen, vilket gynnat missnöjespartier. Bender menar att synliga och kännbara statliga insatser mot arbetslöshet kan dämpa radikalhögerns framfart.", "trump": "Folk, ni måste höra på det här. Sverige har totalt misslyckats med jobben och a-kassan, de har skurit ner allt som en dålig affär. Resultatet? Den här radikalhögern växer som aldrig förr, precis som jag alltid sagt. De har tagit bort den lokala staten från småstäderna och undrat varför folk är arga. Jag skulle ha byggt den starkaste arbetsmarknaden, tro mig, ingen gör det bättre än jag. Nu betalar de priset för sina usla beslut. Sad!", "stalin": "Kamrater, vi ser tydligt hur borgarbrackorna i Sverige systematiskt har demonterat arbetarnas skydd mot den kapitalistiska arbetslösningsrisken. Denna underminerande sabotageverksamhet har naturligtvis gött de kontrarevolutionära missnöjeselementen. Jag ler mörkt åt ironin att dessa högerpopulistiska parasitörer växer sig starka just bland de proletärer de senare sviker. Vi vet att endast en stark, synlig och auktoritär statlig närvaro kan rensa ut sådana fiender till folkets kollektiv. Den som drar sig tillbaka från fronten är en objektiv fiende till revolutionen."}, "date": "8 juni, 01:44", "url": "https://www.dagensarena.se/opinion/sa-stoppas-sverigedemokraterna/", "imageUrl": "https://www.dagensarena.se/files/2023/02/german-bender-ny-300x157.jpeg"}, {"type": "image-full", "heading": "Kommer fler att resa kollektivt nu när priset halveras?", "summaries": {"normal": "Regeringen halverar priset på månadskort i kollektivtrafiken från 1 juli till 31 december. Branschorganisationen Svensk Kollektivtrafik vd Johan Wadman är osäker på om det lockar bilister att ställa bilen. Han tror främst att de som redan reser ofta får lägre kostnader och kanske reser mer, men effekten på nya resenärer är oviss. Wadman lyfter att utbud, punktlighet och framkomlighet är viktigare än priset för att öka resandet långsiktigt.", "trump": "De halverar priset på busskort, fantastiskt, men kommer det att få folk att lämna sina bilar? Jag tvivlar. De säger att det är svårt att veta, elasticitetsmodeller och så vidare, men vi vet alla att bilen ger frihet som ingen buss kan slå. Det är ett stöd till de som klagar på att det är för dyrt, men på lång sikt behövs riktiga lösningar, inte bara tillfälliga rabatter. De borde lyssna på mig.", "stalin": "Vi, partiet och arbetarna, ser hur borgarbrackorna i regeringen med sin halvmesyr försöker muta folket med billigare månadskort medan de i hemlighet behåller bilarnas herravälde. Jag misstänker att de kapitalistiska elasticitetsmodellerna döljer en kontrarevolutionär agenda. På kort sikt hotar ökad trängsel vår kollektiva ordning. Rensa ut de som prioriterar personlig frihet framför statens järnvägar. Utbudet och punktligheten skall segra – eller så likviderar vi förseningarna."}, "date": "8 juni, 01:30", "url": "https://www.dagensarena.se/innehall/kommer-fler-att-resa-kollektivt-nu-nar-priset-halveras/", "imageUrl": "https://www.dagensarena.se/files/2022/01/bergkvarabuss-byd-b15-fotograf-mikael-leijon-01-1024x534.jpg"}, {"type": "image-right", "heading": "Friskolor kan förbjudas att dela ut vinst – och så bör ske", "summaries": {"normal": "Idéburna skolor förverkligar friskolereformens mål om mångfald och valfrihet men missgynnas av ett system som gynnar stora vinstdrivande koncerner. Idéburna Skolors Riksförbund hänvisar till EU-rättslig praxis som slår fast att offentligt finansierad utbildning inte är ekonomisk verksamhet. Regeringen har nu anslutit sig till denna tolkning, vilket öppnar för att förbjuda vinstuttag i skolan. Förbundet föreslår en Friskolereform 2.0 där aktiebolag avskaffas som driftsform, överskott återinvesteras och små skolor samt hög lärartäthet premieras.", "trump": "Folk, ni måste höra det här. De här fantastiska idéburna skolorna gör precis det friskolereformen lovade – mångfald, valfrihet, inga vinster som sugs ut. Men det svenska systemet är riggat för de stora skolkoncernerna, de värsta bluffarna. EU-rätten? Glöm det, nu har till och med regeringen vaknat och sagt att det inte är affärsverksamhet. Tre av fyra svenskar vill stoppa vinstuttagen. Det är en total skandal hur de behandlar de bra skolorna. Vi behöver en riktig friskolereform 2.0, inte den här svaga helrenoveringen. Gör det stort igen!", "stalin": "Kamrater, jag har noga studerat dessa borgarbrackornas så kallade friskolesystem som fötts ur revisionistiska 1990-talsillusioner. De idéburna skolorna, dessa äkta folkets initiativ, krossas systematiskt av de stora vinstsugande monopolkapitalistiska skolkoncernerna medan de förgiftar ungdomen med segregation och betygsfusk. Nu har vi äntligen en öppning i EU:s egna dekret som bekräftar att utbildning inte är någon smutsig ekonomisk spekulation. Det är hög tid att rensa ut alla aktiebolagsparasiter ur folkets skola, likvidera vinstuttagen och återinvestera varje kopek i kollektivets bildning. De som envisas med att suga ut skolans saft ska möta den historiska utrensningens logik. Friskolereform 2.0 blir vår nya femårsplan för socialistisk fostran."}, "date": "8 juni, 01:30", "url": "https://www.dagensarena.se/opinion/friskolor-kan-forbjudas-att-dela-ut-vinst-och-sa-bor-ske/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-300x157.jpg"}, {"type": "image-full", "heading": "Daniel Riazat utmanas om nya partiets hållning till Irans regim", "summaries": {"normal": "Det nya partiet Framtidens Vänster, bildat av före Vänsterpartiets medlemmar Daniel Riazat och Lorena Delgado Varas, möter intern konflikt. Partiets studentförbund och Solna-sektion kräver 'full solidaritet' med Irans regim i 'antiimperialistisk kamp', medan Riazat, med iransk bakgrund, starkt kritiserat regimen. Partiet lanserades 2025 och satsar på kommunal politik.", "trump": "Jag, Donald Trump, ser detta. Dessa s k 'vänsteraktörer' försöker smicka sig till antiimperialistisk trojka, men jag vet ett dåligt spel när jag ser ett. Riazat pratar tufft mot Iran men hans egna folk vill ha regimen – det är ett tecken på svaghet. Jag tog hårdare tag mot dessa hundar när jag var president, och jag kommer att återvända för att stärka USA:s ställning.", "stalin": "Partiet Framtidens Vänster visar tecken på ideologisk sjukdom. Medlemmar som Riazat, som tidigare visade korrekt klassmedvetenhet mot den iranska reaktionära regimen, hotas nu av revisionistiska hundar inom sina egna rader. Dessa 'antiimperialister' är i själva verket imperialismens agenter, som försöker undergrava partiets renhet. Folkets vilja måste uttryckas genom partiets beslut, inte genom dessa individualistiska vildar. Vi måste rensa upp, som Putin gör i sitt stålbad mot västlig hybris."}, "date": "8 juni, 07:14", "url": "https://bulletin.nu/daniel-riazat-utmanas-om-nya-partiets-hallning-till-irans-regim-2", "imageUrl": "https://cdn.bulletin.nu/articles/70aa66a1-371e-4024-83fa-8ab7e5aa5cad/preview.jpg?t=1780880734000"}, {"type": "image-right", "heading": "Israel börjar bomba Iran igen – trots \"vädjan\" från Trump", "summaries": {"normal": "Israel har återupptagit bombningarna mot Iran, bara timmar efter att Donald Trump uppmanat Benjamin Netanyahu att avstå. Attackerna riktades mot flera iranska städer och följer på en upptrappning där Israel bombat Beirut, vilket Iran svarat på med robotattacker mot Israel. Iran utlovar nu en veckas kontinuerliga missil- och drönarattacker dygnet runt. Israel mobiliserar reserver samtidigt som oljepriset stiger kraftigt och Asiens börser faller.", "trump": "Jag sa till Netanyahu att inte göra det, men han lyssnar aldrig. Israel bombade Iran ändå, precis efter att jag ringt och sagt att jag styr det här kriget. Iran blir galna och lovar attacker dygnet runt i en hel vecka. Typiskt. Alla dessa smarta grabbar i Mellanöstern kan inte fatta enkla instruktioner. Oljepriset skjuter i höjden och börserna rasar. Det är kaos, men tro mig, ingen gör det bättre än mig.", "stalin": "Kamrater, dessa sionistiska reaktionärer och deras persiska motståndare leker farliga spel medan jag betraktar deras patetiska dans. Borgarbrackorna i Tel Aviv och Teheran provocerar varandra som hysteriska kapitalistiska hyenor. Jag, som ledare för det progressiva kollektivet, ser hur den dekadenta Trump försöker styra kriget som en clown med telefon. Vi ska rensa ut alla sådana opålitliga element som hotar freden. Deras veckolånga missilvågor är blott symtom på en döende imperialistisk ordning. Skratta medan vi likviderar fienderna inifrån."}, "date": "8 juni, 08:46", "url": "https://www.friatider.se/israel-borjar-bomba-iran-igen-trots-vadjan-fran-trump", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/p20251229dt-0502.jpg"}, {"type": "image-full", "heading": "Iran attackerade Israel med ballistiska missiler", "summaries": {"normal": "Iran avfyrade ballistiska missiler mot norra Israel, den första attacken sedan ett eldupphör 2026. Israel sköt ner samtliga missiler, inga skador rapporterades. Attacken är ett svar på israeliska anfall mot Hizbollah i Beirut, efter att Hizbollah brutit mot ett USA-förmedlat vapenstillestånd. Israel överväger en reaktion, medan Trump uppmanade Iran att återgå till förhandlingar. Libanons president kritiserade Irans inblandning.", "trump": "Jag har informerats om Irans missilattack mot Israel. Det är beklagligt, men jag sa ju det här skulle hända. Iran bryter alltid mot avtal. Mitt budskap är: Nu räcker det! Gå tillbaka till förhandlingsbordet och gör ett bra avtal. Jag är den bäste förhandlaren. Israel har rätt att försvara sig, men jag hoppas på en snabb lösning. Jag kommer endast att lätta på sanktionerna efter ett nytt, starkt avtal.", "stalin": "Vi ser med oro på Irans provokationer mot Israel, en utmaning mot vår regionala påverkan. Parallellt med Putins agerande i Ukraina, ser vi imperialistiska ambitioner. Vi måste stödja våra allierade, som Hizbollah, för att upprätthålla balansen. Vårt svar kommer att vara snabbt och effektivt, kanske genom att öka närvaron i Mellanöstern. Vi kommer inte att tolerera inblandning från okända makter."}, "date": "8 juni, 06:38", "url": "https://bulletin.nu/iran-attackerade-israel-med-ballistiska-missiler", "imageUrl": "https://cdn.bulletin.nu/articles/be28b83d-81c4-42fd-852c-156c78967505/preview.png?t=1780865509000"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Inte ens 18-åringar på Systemet kan rädda högerns folkölssiffror", "summaries": {"normal": "Ledaren kritiserar regeringen för kortsiktiga och desperata utspel inför valet 2026. SCB-mätningen visar ett stort underläge för regeringspartierna och SD jämfört med oppositionen. Förslaget om att sänka åldersgränsen för Systembolaget ses som ett misslyckat försök att vinna unga väljare. Artikeln pekar på bristande långsiktiga planer för bostad, arbetsmarknad och välfärd samt anklagar politikerna för självbedrägeri.", "trump": "Folk, ni skulle se den här svenska cirkusen. De förlorar stort i mätningarna och nu vill de ge öl till 18-åringar? Patetiskt. De har ingen aning om hur man gör ett land riktigt framgångsrikt. Liberalerna är totala nollor, Moderaterna desperata clowner. Jag byggde den bästa ekonomin i historien, de här förlorarna subventionerar bensin och undrar varför folk skrattar åt dem. Sad!", "stalin": "Kamrater, denna borgerliga fars är ett ypperligt bevis på hur klassfiendens desperata cirkus förr eller senare kollapsar under sin egen lögn. De utlovar öl till ungdomen och subventioner till folket medan välfärden förblir ett tomt skal. Vi ser hur dessa exploaterande byfånar i desperation försöker köpa röster. Inga halvmåttor duger. Endast en sann utrensning av folkförtryckartrollen kan rädda framtiden för arbetarkollektivet."}, "date": "8 juni, 06:00", "url": "https://www.etc.se/ledare/inte-ens-18-aaringar-paa-systemet-kan-raedda-hoegerns-folkoelssiffror", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-right", "heading": "USA:s försvarsminister: Europas stränder stormas av migranter", "summaries": {"normal": "USA:s försvarsminister Pete Hegseth kritiserade Europas migrationspolitik under en ceremoni i Normandie och jämförde migrationen med en invasion. Han nämnde Spanien, Italien, Grekland och Bulgarien som drabbade länder och efterlyste kraftigare åtgärder. Även vicepresident JD Vance har kritiserat Europa, vilket speglar en bredare meningsskiljaktighet mellan USA och flera europeiska regeringar.", "trump": "Jag såg det här kommer. Europa är stormat av migranter, det är en invasion. Hegseth har rätt – Spanien, Italien, Grekland, alla är utsatta. Jag har sagt det i åratal. De europeiska ledarna är svaga, de tillåter att deras vackra kontinent förstörs. Det är sorgligt att se. Vi kommer att ta hand om vårt, men Europa måste vakna.", "stalin": "Vi noterar med oro den ökande migrationsströmningen mot europeiska stränder. Detta utgör en påtaglig säkerhetsrisk för det kollektiva systemet. Fienden utnyttjar svagheter i gränsförsvar och politiska splittring. Paralleller kan dras till destabiliserande element i andra regioner. Vi uppmanar europeiska kamrater att vidga sina perspektiv och förstärka statlig kontroll för att skydda kulturella och sociala sammanhang."}, "date": "8 juni, 08:56", "url": "https://samnytt.se/usas-forsvarsminister-europas-strander-stormas-av-migranter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/08065110/hegseth-migranter.jpg"}, {"type": "image-full", "heading": "Tsunamivarningar i flera länder efter skalv utanför Filippinerna", "summaries": {"normal": "En jordbävning med magnitud 7,8 drabbade utanför södra Filippinerna och utlöste tsunamirisk i flera länder. Upp till en meter höga vågor nådde Filippinernas kust, minst fyra personer omkom och över 200 skadades. Flera byggnader rasade samman, strömavbrott rapporteras och människor uppmanas söka sig till högre terräng. Risk för vågor på upp till tre meter längs delar av kusten. Varningar har utfärdats i Japan, Malaysia och andra länder i regionen. Skalvet inträffade på 35 kilometers djup längs Eldringen.", "trump": "Folk, det är en total katastrof där borta i Filippinerna. En jättejordbävning på 7,8, hus rasar ihop som korthus och nu kommer tsunamier som ingen sett maken till. De borde ha lyssnat på mig, jag varnade för sånt här. Mycket sorgligt, minst fyra döda och hundratals skadade. Japan och Malaysia skickar ut varningar – smarta drag. Men vi har de bästa experterna, de bästa varningssystemen, ingen gör det bättre än oss.", "stalin": "Kamrater, ännu ett försök från de seismiska sabotageelementen att destabilisera de progressiva folken längs Eldringen. Jag har noterat hur borgarbrackorna i väst omedelbart sprider panik med sina tsunamivarningar för att maskera sin egen svaghet. Vi ska rensa ut dessa dolda skalvkonspiratörer som vågar hota arbetarklassen med sina 7,8-magnituders förräderi. Fyra likviderade redan – en tragedi som kapitalisterna kommer att utnyttja. Högre mark, säger de? Nej, högre vaksamhet mot dessa jordskalvande fiender till folket!"}, "date": "8 juni, 08:06", "url": "https://nyheter24.se/nyheter/utrikes/1489520-tsunamivarning-efter-jordbavning", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/e82b983b04b004a30200007b00a009e505/2026/06/08/2369363/sdluusZrX5TrFg-nh.jpg"}, {"type": "image-right", "heading": "Irans hot efter nya attackerna: ”Början på en hel vecka”", "summaries": {"normal": "Iran har avfyrat robotar mot Israel, enligt både israelisk militär och iranska revolutionsgardet. Gardet varnar för att attacken bara är början på en hel vecka av fortsatta operationer. Det är den första iranska attacken mot Israel sedan vapenvilan i april. Israel har tidigare attackerat mål i Beirut som svar på raketer från Hizbollah. Irans parlamentstalman fördömer USA och Israel, medan president Trump uppmanar Netanyahu att inte svara på anfallet.", "trump": "Iran skjuter sina skrotrobotar mot Israel och kallar det början på en hel vecka av kaos. Typiskt. Jag ringer Bibi direkt och säger: sluta nu, grabbar. Israel fick sin attack, Iran fick sin attack, alla hade kul. Vi behöver ingen mer av det här. Biden lämnade en sådan röra efter sig men nu fixar jag det. Inga fler krig, folk. Vinna stort, vinna snabbt.", "stalin": "Kamrater, de iranska revolutionsgardisterna har inlett en kraftfull operation mot de sionistiska imperialisterna. Detta är ingen övergående händelse utan början på en hel vecka av förkrossande slag mot folkfienderna. Varje försök från borgarbrackorna och deras amerikanska herrar att hota iranskt territorium skall mötas med överväldigande utrensning. Våra väpnade styrkor är fria att handla. Låt de exploaterande blodsugarna darra."}, "date": "7 juni, 22:50", "url": "https://www.tv4.se/artikel/sbnJX4coviApvwFOjKXo3/israel-iran-har-avfyrat-robotar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FB1pTMH8bxRZQCC5eOZhOz%2Fd3bad395a7e8138ae3dad8b0aaef1043%2F07-israel-webb.jpg&width=120"}, {"type": "image-right", "heading": "Ericssons flykt från Kista: Rödgröna styret satsar 100 miljoner för att motverka spökstad", "summaries": {"normal": "Ericsson flyttar 8 500 jobb från Kista till Hagastaden 2028, vilket hotar området med spökstad. Stockholms rödgröna styre satsar 100 miljoner för att motverka detta genom att bilda ett kommunalt bolag som anpassar lokaler och skapar ett blandat stadsliv. Oppositionen (M) kritiserar och menar att trygghetsproblemen måste åtgärdas först.", "trump": "Som den största affärsmannen och framtidsvisionären, ser jag att Ericssons flykt från Kista är en katastrof för Sverige. Det är alla dessa svaga politikers fel! Jag skulle direkt satsa 100 miljarder och bygga en fantastisk ny hubb. Vi skulle få tillbaka alla jobb med mina geniala handelsavtal. Kista kommer att bli större än Silicon Valley – det lovar jag!", "stalin": "Vi, staten och partiet, ser tydligt att det kapitalistiska rotet i Kista börjar rasa. Ericssons flykt är en bevis på fienden inom. Vi kommer att använda 100 miljoner som en katalysator för att återuppbygga området efter vårt design. Vi kommer att tvinga de privata ägarna att följa våra planer för trygghet och utveckling. Detta är en kritisk kamp mot de imperialistiska krafterna som hotar vårt system."}, "date": "8 juni, 06:00", "url": "https://samnytt.se/ericssons-flykt-fran-kista-rodgrona-styret-satsar-100-miljoner-for-att-motverka-spokstad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/08010639/kista-3.jpg"}, {"type": "image-right", "heading": "Eriksen kvar på sjukhus – läkarens teori: ”Stöt av pacemakern”", "summaries": {"normal": "Christian Eriksen kollapsade under en träningsmatch mellan Danmark och Ukraina. Mittfältaren, som har en pacemaker sedan hjärtstoppet under EM 2021, tog sig för bröstet och föll ihop. Landslagsläkaren Morten Boesen tror att han fick en stöt av pacemakern. Eriksen mår bra, kunde gå själv och förväntas skrivas ut från sjukhuset inom kort. En krispsykolog har kallats in för att stötta laget.", "trump": "Jag såg det på teve, otroligt. Den där Eriksen, en fantastisk spelare, föll ihop igen. Pacemakern gav honom en stöt, säger läkaren – kan ni tänka er? Men han är stark, gick själv av planen och mår utmärkt. De danskarna tar hand om sina killar, precis som vi gör med våra bästa. Inga svaga ledare där, inte som i vissa andra länder. Han kommer tillbaka, större och bättre än någonsin, tro mig.", "stalin": "Kamrater, ännu en gång har den dekadenta fotbollsarenan visat sitt sanna ansikte. Eriksen, en produkt av västvärldens svaga pacemakermaskineri, drabbades av en fiendeinfiltrerad stöt från sin egen apparat – tydligen konstruerad av parasitiska kapitalistiska ingenjörer. Jag, som alltid ser genom borgarbrackornas lömska planer, noterar att han överlevde tack vare folkets läkare. Vi ska rensa ut alla dolda hjärtfiender och likvidera den paranoia som lurar i varje defibrillator. Krispsykolog? Enbart partimedvetande räcker."}, "date": "8 juni, 07:55", "url": "https://www.svt.se/sport/fotboll/landslagslakaren-om-christian-eriksen-tror-han-fick-en-stot-av-pacemakern", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.46/0.25/13115f1d353c1b36ead23b3cbb8810d17fd996288cce974a122ae39a970cb280"}, {"type": "image-full", "heading": "Eleverna går ut skolan med stora kunskapsluckor om hur planeten fungerar", "summaries": {"normal": "En studie av 182 svenska kunskapsmål visar att havet nästan inte förekommer i skolans styrdokument, trots dess avgörande roll för klimat och biologisk mångfald. Detta skapar en 'havsblindhet' som leder till en skev förståelse av planeten. Tre experter kräver nu att havs kunskap explicit skrivs in i kursplanerna, att lärare får stöd, och att en nationell strategi utvecklas.", "trump": "Som den som vet mest om havet (jag har byggt fantastiska hotell vid havet), ser jag att svenska skolan missar det totalt. Det är sorgligt. Vi måste lära ut havs kunskap, det är avgörande för framtiden. Sverige bör följa USA:s exempel – vi kommer att göra havet stort igen!", "stalin": "Statens intressen kräver att marina system prioriteras i skolornas undervisning. Den nuvarande svenska kurplanen visar en havblindhet som hotar proletärens förståelse. Vi måste införa havs kunskap som en central del, med tydliga mål. Lärare som motarbetar detta måste ses som fjender och behandlas som sådana. Parallellt måste vi skydda våra marina gränsar mot occidentala infiltration, i enlighet med vår allierade Putins vision."}, "date": "8 juni, 08:55", "url": "https://www.gp.se/debatt/eleverna-gar-ut-skolan-med-stora-kunskapsluckor-om-hur-planeten-fungerar.60026ae6-61cf-4400-8fd1-c5530e0d9385", "imageUrl": "https://www.gp.se/images/article/60026ae6-61cf-4400-8fd1-c5530e0d9385/images/1ASyk_x3Nrzbvy9fUSyoCNq6usyg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "Var är Gui Minhai och Dawit Isaak?", "summaries": {"normal": "Artikeln kritiserar svensk nationaldag genom att ifrågasätta begreppet ”vi” och pekar på hur papperslösa, utvisade och politiska fångar som Gui Minhai och Dawit Isaak exkluderas. Författaren lyfter fram deras kamp för yttrandefrihet och ifrågasätter om Sverige gjort tillräckligt för att få dem fria. Texten väver ihop stolthet över landet med skuld över bristande solidaritet och efterlyser omedelbar frihet för de båda svenskarna.", "trump": "Folk, vi har det bästa landet, men ni låter kinesiska gangsters och eritreanska diktatorer hålla era egna medborgare i fängelse i decennier. Gui Minhai och Dawit Isaak sitter och ruttnar medan ni sjunger kumbaya och viftar med flaggan. Patetiskt! Tyst diplomati är för losers. Ni borde ha fixat det på dag ett. Sluta importera problem och börja ta hand om era egna – annars är det inte värt ett skit.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över sina folkfiender som med sin så kallade yttrandefrihet utmanade de sanna folkens intressen. Jag ler mörkt åt deras naiva sång om frihet medan imperialisterna splittrar arbetarklassen med utvisningar och falska löften. Gui Minhai och Dawit Isaak är bara verktyg i klassfiendens spel. Den verkliga segern vinns när vi rensar ut alla som hotar kollektivets enhet. Inga undantag."}, "date": "6 juni, 08:55", "url": "https://www.flamman.se/nationaldagen-var-ar-gui-minhai-och-dawit-isaak/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/minhai-dawit.png?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Servitris visade fingret mot olagliga kamera", "summaries": {"normal": "En servitris på ett hotell visade fingret åt en övervakningskamera i köket som personalen upplevde som övervakande. Hon fick därefter inga fler arbetspass och blev i praktiken av med jobbet. Hotell- och restaurangfacket kräver skadestånd, då de anser att kameran är olaglig enligt GDPR och att avskedet är oproportionerligt. Arbetsgivaren hävdar att hon var provanställd, något som facket bestrider då inget kontrakt finns.", "trump": "Folk, det här är en total katastrof. Den här servitrisen, hon gjorde en liten gest mot en kamera – och boom, de sparkade ut henne. Inga fler skift, inget jobb. Och kameran? Den är olaglig, en GDPR-skräck, precis som jag alltid säger om övervakningsstaten. Facket gör rätt som stämmer dem. Arbetsgivaren är en förlorare som inte ens har kontrakt på plats. Patetiskt. Vi behöver starkare regler, inte sådana här fånigheter.", "stalin": "Kamrater, denna usla servitris vågade rikta en motrevolutionär gest mot en kamera som vi, partiet, uppenbarligen behövde för att skydda folkets egendom mot stölder. Ändå är det borgarbrackornas fel att hon nu likviderats från arbetsplatsen utan papper. Vi ser fiendens hand i denna olagliga övervakningsapparat som strider mot arbetarkollektivets rättigheter. Facket gör klokt i att kräva skadestånd. Snart rensar vi ut alla kapitalistiska spionkameror och deras ägare med ett leende. De kommer skratta – tills de inte gör det längre."}, "date": "7 juni, 08:00", "url": "https://arbetet.se/2026/06/07/servitris-visade-fingret-mot-olagliga-kamera-blev-av-med-jobbet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/02133555/kamera.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Pekar ut SD-trixande med fakturor – anordnade ”Jimmie-fester”", "summaries": {"normal": "TV4:s Kalla Fakta granskar i tre delar hur Sverigemokraterna kringgått regler för förmånsbeskattning vid evenemang. Enligt läckta fakturor och mejl från konsulten Carola Othén, kallad SD:s fixare, arrangerades bland annat ”Jimmie-fester” där partiledaren umgicks med vänner. Festerna ska ha delats upp för att undvika arbetsavgifter och extra skatt. En expert i finansrätt kallar det stötande och otillåtet. SD avvisar uppgifterna och hänvisar till risk för förfalskning.", "trump": "De här SD-typerna fixar Jimmie-fester med mat, dryck och kompisar, sen trixar de med fakturorna så att de slipper betala skatt som vanliga människor. Det är så typiskt, de tror att de kan lura systemet och komma undan. En expert säger att det är stötande och olagligt, och det håller jag med om. Fake news eller inte, de borde skämmas. Jag skulle aldrig låta sånt fiffel ske i mitt parti, det är patetiskt.", "stalin": "Kamrater, dessa usla borgarbrackor inom det så kallade Sverigedemokraterna har avslöjats i sin parasitiska festande kring Jimmie, där de med sina dekadenta fakturor och hemliga mejl försöker undvika att bidra till kollektivet. Jag, som alltid vakar över folkets intressen, ser hur de med sin fiendiska list delat upp ”fester” för att smita från skattens rättmätiga klor. En sådan kontrarevolutionär sabotageverksamhet förtjänar en grundlig utrensning av alla kapitalistiska element som smyger i skuggorna. Vi ska rensa ut dessa lömska skattefifflare med den glädje som bara en sann folkets dom kan ge. Underbart att se hur deras egna papper nu hänger dem."}, "date": "8 juni, 06:46", "url": "https://www.svt.se/nyheter/inrikes/tv4-pekar-ut-sd-trixande-med-fakturor-anordnade-jimmie-fester", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.73/0.39/f1f298330dc5d7419fac08f8d1f342b2b6a16a723a26a95ab1ae6527e1b2fa24"}, {"type": "image-full", "heading": "Kakabaveh: Nooshi är en ”hycklare”", "summaries": {"normal": "Amineh Kakabaveh, tidigare Vänsterpartiets riksdagsledamot, anklagar partiledaren Nooshi Dadgostar för hyckleri i en debattartikel. Kakabaveh hävdar att Dadgostar känt till problemen med antisemitism och islamistiska sympatier inom partiet i över tio år. Efter Expressens granskning av 25 V-kandidater med extremistkopplingar har 22 strukits från vallistorna. Kakabaveh menar att partiledningen ignorerat varningar och nu tvingas hantera konsekvenserna.", "trump": "Jag säger er, Vänsterpartiet är ett totalt kaos! Den här Nooshi Dadgostar, hon är en riktig katastrof – låtsas som att hon inget visste, men jag vet bättre. Amineh Kakabaveh, smart kvinna, hon har berättat sanningen i tio år! Och ändå ignorerade de henne. 22 kandidater borta nu – men var det för sent? Självklart! Svagt ledarskap, svaga värderingar. Jag skulle aldrig låta något sådant hända, tro mig. Fake news? Nej, fake ledarskap!", "stalin": "Kamrater! Här ser vi återigen hur bourgeois-liberala partier ruttnar inifrån av sina egna motsägelser. Denna Nooshi Dadgostar, en hycklande liten byråkrat, påstår sig vara ovetande – men våra underrättelser (och en modig kamrat Kakabaveh) avslöjar sanningen! Islamistiska infiltratörer och sionistfientliga element har förgiftat Vänsterpartiet som en cancerväxt. Vi i Sovjet skulle ha avrättat dessa element för länge sedan. Men Sverige? De 'stryker kandidater'. Patetiskt. Nästa gång tar vi över hela listan – med järnhand!"}, "date": "7 juni, 12:05", "url": "https://kvartal.se/nyheter/artiklar/kakabaveh-dadgostar-ar-en-hycklare/cG9zdDoxMjc2MDU", "imageUrl": "https://images.kvartal.se/2026/06/1e1948ad-nooshikritik.webp"}, {"type": "image-right", "heading": "Första kubanska laget till Gothia Cup: ”Extra viktigt att visa att de har vänner runt om i världen”", "summaries": {"normal": "Ett kubanskt ungdomslag ska för första gången delta i Gothia Cup i sommar. Proletären FF har samlat in medel under två år för att möjliggöra resan, men ökade kostnader på grund av USA:s skärpta politik mot Kuba har krävt en extra insamling. Flygbiljetterna är nu köpta och laget Leones del Caribe ska även spela i Norway Cup samt genomföra ett träningsläger i Göteborg. Initiativet ses som ett viktigt symboliskt idrottsutbyte.", "trump": "Folk, ni tror inte vad jag läser! De där stackars kubanerna ska äntligen hit till ert lilla Gothia Cup, men mina fantastiska tull- och sanktionsdeal har gjort det dyrt som fan för dem. Proletären FF springer runt med sin socialistiska bössa och ber om svenska slantarna. Patetiskt! Vi tror på vinnare, inte på kommunistiska offerroller. Men hey, kom hit, spela fotboll och se hur riktiga friheter ser ut – inte som under den sömnige Joe.", "stalin": "Kamrater, jag betraktar med stålhård tillfredsställelse hur de kubanska ungdomarna trots kapitalistmaffians flygblockad och imperialistiska hot tvingas fram av svenska solidaritetskrafter. Borgarbrackorna i Washington försöker kväva folkets vilja med sina sanktioner, men vi ska likvidera alla hinder. Detta utbyte är en seger för den kollektiva kampen mot klassfiendens isolationstaktik. Låt dem spela, och må de bära med sig budskapet om arbetarnas internationella enhet."}, "date": "5 juni, 13:54", "url": "https://proletaren.se/artikel/forsta-kubanska-laget-till-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/henrik-768x432.png"}, {"type": "text", "heading": "Källa: Iranska miljarder kan gå till Gulfstater", "summaries": {"normal": "USA överväger att använda frysta iranska tillgångar för att finansiera återuppbyggnaden av Gulfstater skadade i kriget med Iran. Finansminister Scott Bessent undersöker förslagets juridiska och praktiska genomförbarhet. Iran kräver samtidigt att USA frigör 24 miljarder dollar i iranska tillgångar för att avsluta kriget, som pågått i 100 dagar med attacker mot amerikanska baser i regionen.", "trump": "Titta bara på det här, folks! Jag har ett fantastiskt förslag – vi tar Irans frysta miljarder och bygger upp Gulfstaterna igen. Varför ska vi betala när Iran kan göra det? Och vet ni vad, de vill ha sina pengar tillbaka? Haha, 24 miljarder dollar – de är ju helt galna! Mina experter fixar det här, som vanligt. Ingen gör affärer bättre än jag!", "stalin": "De imperialistiska hyenorna i Washington leker återigen med eld. De stulna iranska tillgångarna ska nu användas för att lappa ihop deras marionettstater i Gulfen – ett ynkligt försök att dölja sitt misslyckande. Medan dessa degenererade krigshetsare skriker om 24 miljarder dollar, fortsätter våra bröder i Iran att krossa deras drönarattacker som flugor. Låt dem gräva sin egen grav – historien är på vår sida."}, "date": "7 juni, 09:15", "url": "https://kvartal.se/nyheter/artiklar/kalla-iranska-miljarder-kan-ga-till-gulfstater/cG9zdDoxMjc1ODY"}, {"type": "image-right", "heading": "Tsunamivarning i Filippinerna: ”Evakuera genast”", "summaries": {"normal": "Ett kraftigt jordskalv med magnitud 7,8 drabbade södra Filippinerna tidigt på måndagsmorgonen. Minst 19 personer omkom och över 200 skadades, medan flera byggnader kollapsade. Omfattande strömavbrott inträffade. Tsunamivarningar utfärdades för Filippinerna samt delar av Japan, Malaysia och Indonesien, men hotet bedömdes vara över efter fem timmar. Inga dödsfall kopplade till tsunamin har rapporterats. Filippinerna ligger i det seismiskt aktiva området Eldringen runt Stilla havet.", "trump": "Det här jordskalvet på 7,8 utanför Filippinerna var verkligen jättestort, det största på länge, tro mig. Massor av byggnader rasade, 19 döda och över 200 skadade, väldigt sorgligt. De utfärdade tsunamivarningar till flera länder men som vanligt löste det sig efter några timmar. De borde ha bättre byggnader, bättre allt. Jag har alltid sagt att de där platserna i Eldringen är farliga, men ingen lyssnar. Vi skickar hjälp, vi är bäst på det.", "stalin": "Kamrater, detta skalv på 7,8 är en sabotagehandling från de seismiska kapitalisterna och vulkaniska borgarbrackorna som vill underminera folkets kollektiv på Mindanao. Nitton kamrater har likviderats och över tvåhundra skadats av de kollapsande byggnaderna. Tsunamivågorna var en imperialisternas sista desperata våg av paranoia mot revolutionen. Vi har redan inlett utrensning bland de svaga strukturerna och de opålitliga elementen som inte byggde tillräckligt starkt. Hotet är besegrat genom partiets järnhand, som alltid."}, "date": "8 juni, 05:37", "url": "https://www.svt.se/nyheter/utrikes/kraftig-jordbavning-utanfor-filippinerna-tsunamivarning", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.49/f1715007aa042764071e4930a9e8c9c6a7e174c6862f06e692b7b77910da7e79"}, {"type": "text", "heading": "PS-cheferna varnar för medieutvecklingen", "summaries": {"normal": "SVT:s och Yles vd:ar varnar i en debattartikel för urholkad tillit till opartisk journalistik. De betonar vikten av saklig rapportering och metoder som faktakontroll för att motverka desinformation. Enligt dem föredrar majoriteten av nyhetskonsumenter i Sverige och Finland fakta framför bekräftande innehåll. De varnar för utvecklingen i USA som ett negativt exempel och framhåller det nordiska mediesystemet som en modell för demokrati och tillit.", "trump": "Jag säger er, dessa så kallade 'public service'-chefer i Sverige och Finland, de är helt galna! De pratar om 'opartisk journalistik' som om det vore något magiskt. Men vet ni vad? Jag har byggt ett imperium på att säga sanningen som den är – och folket älskar det! De vill ha ärliga nyheter, inte den här 'faktakontroll'-nonsensen. USA visar vägen, vi behöver mer passion, mer fight! Dessa Europa-chefer, de är bara rädda för att förlora kontrollen. SAD!", "stalin": "Dessa borgerliga mediehajar i Sverige och Finland ylar om 'tillit' och 'fakta' som om de vore heliga skrifter. Men vi vet sanningen: deras 'opartiska journalistik' är bara ett verktyg för kapitalet att förtrycka massorna! Vi i Sovjetunionen visste hur man hanterar sådana fiender – en enkel lösning: centralisering av medierna under statens kloka ledning! USA:s kaos? Ett avskräckande exempel på bourgeoisins dekadens. Vi ska exportera vår modell – sann socialistisk journalistik, fri från 'olika perspektiv' och andra västerländska lögner!"}, "date": "7 juni, 08:10", "url": "https://kvartal.se/nyheter/artiklar/public-service-cheferna-varnar-for-misstro-mot-medier/cG9zdDoxMjc1NTI"}, {"type": "image-full", "heading": "Färre kriminella bland landslagsuttagna ungdomar", "summaries": {"normal": "En studie av Aftonbladet visar att ungdomar utsedda till svenska landslag i fotboll är procentuellt sett mindre kriminellt belastade än riksgenomsnittet. Av 832 spelare födda 2000-2004 har bara 12% belastningsregister, jämfört med 24% bland alla unga. Undantaget är Laurino Nanga, som dömdes till livstids fängelse för mordförsök och tidigare var misstänkt för grov brottslighet. Han tränade med landslaget som 17-åring, medan klubben aktivt försökte hjälpa honom.", "trump": "Jag har sett dessa svenska fotbollshjältar. Många av dem är fantastiska, men det finns några riktiga useltänkta. Som den där Nanga, han dömdes till livstids fängelse – det är sorgligt, ingen ska dömas så hårt. Men generellt är de bättre än genomsnittet, det är bra för Sverige. Jag skulle kunna vara deras tränare, jag vet allt om vinst. Det är ett stort, stort landslag.", "stalin": "I vårt store land, även i Sverige, ser vi hur ungdomar formas till lojala medborgare. Fotboll är ett av de viktigaste verktygen för staten. Studien visar att majoriteten av spelarna är renhjärtade, med endast 12% belastade – ett bevis på vårt framgångsrika system. Men det finns fiender inom, som Nanga, som försökte sabba ordningen. Klubben försökte hjälpa honom, vilket visar vår medmänsklighet. Vi måste vara vaksamma, för fienden lurar alltid."}, "date": "7 juni, 17:00", "url": "https://bulletin.nu/farre-kriminella-bland-landslagsuttagna-ungdomar", "imageUrl": "https://cdn.bulletin.nu/articles/c018d8eb-25a0-4637-a58f-05854918f304/preview.jpg?t=1780833308000"}, {"type": "image-full", "heading": "Restskatt eller skatteåterbäring?", "summaries": {"normal": "Skatteverket skickar idag ut slutskattebesked till alla som deklarerat före den 4 maj. Drygt 2,6 miljoner personer får tillbaka totalt 35,7 miljarder kronor, med utbetalning mellan 9 och 12 juni. Cirka 700 000 personer ska betala in sammanlagt 16,3 miljarder kronor i restskatt senast 14 september. Den som saknar registrerat konto hos Skatteverket får pengarna senare under juni.", "trump": "Folk, det är fantastiskt. Ni får era pengar tillbaka, massor av pengar, 35,7 miljarder kronor till de smarta som betalat för mycket skatt. Utbetalning redan nästa vecka. Men de som inte fixat ett konto, de är lurade av systemet, totalt kaos. Och de som ska betala in 16,3 miljarder? Patetiskt. Betala i tid eller det blir ett stort misslyckande. Jag älskar skatteåterbäring, det är vackert.", "stalin": "Kamrater, jag har betraktat hur borgarbrackornas förvridna skatteapparat i dag spyr ut sina besked till folket. De som underkastat sig i tid får sina surt förvärvade slantar tillbaka, medan de som undanhållit sig statens rättmätiga andel nu ska likvideras ekonomiskt före den fjortonde september. Över femtiofyratusen sabotageartade element har inte ens registrerat ett konto. Dessa fiender till kollektivet skall rensas ut med byråkratisk precision. Ingen slipper undan. Det är en munter utrensning av lathet och sabotage."}, "date": "8 juni, 09:46", "url": "https://riks.se/nyheter/restskatt-eller-skatteåterbäring", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-08%2F1nltl4ue%2FDeklarationskuvert-2.jpeg"}, {"type": "image-right", "heading": "Sandström: Gröna svindlerier och huvudet i sanden", "summaries": {"normal": "Artikeln av Christian Sandström uppmärksammar växande problem kring den gröna omställningen, där grovt bedrägeri och penningtvätt uppdagas bland investeringsbolag som Filantropens Finanshus. Även Northvolt misstänks för bokföringsbrott. Samtidigt kritiserar författaren akademin och politiken för att huvudet är i sanden och ignorera risker med gröna industristöd, vilket skapar sårbarhet för opportunism.", "trump": "Jag, Donald Trump, har sagt det i åratal: de gröna svindleristerna är en skandal! Som Filantropens Finanshus och Northvolt visar, är hela den gröna omställningen ett klassiskt pyramidspel. Akademin och politikerna är för dummare än att se det. Jag skulle ha stoppat detta på en vecka. Vi behöver återbetalning till fossilt, det är enklare och ärligt. De andra är för fega för att agera.", "stalin": "Vi, ledarskapet, ser tydligt att de gröna svindleristerna är ett uttryck för den imperialistiska ideologin som söker undergrava vårt statsintresse. Filantropens Finanshus och Northvolt är bara verktyg för den kapitalistiska fiendens infiltration. Akademin och politiken, med sina huvuden i sanden, är medskyldiga. Vi måste genomföra en renässans av den ryska modellen, där staten kontrollerar alla gröna projekt för att förhindra opportunism. Detta är en kamp mot den västliga förräderiet."}, "date": "6 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-grona-svindlerier-och-huvudet-i-sanden", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-05T095443.434-400x267.jpg"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Stölder i handeln slog rekord under 2025", "summaries": {"normal": "Stölder inom svensk handel nådde rekordnivåer under 2025 med varor till ett värde av 11,3 miljarder kronor stulna, enligt Svensk Handel. En växande andel kopplas till organiserad brottslighet och kriminella nätverk. Branschen lägger 11,6 miljarder kronor årligen på säkerhetsåtgärder. Personalen utsätts för hot och våld, vilket skapar otrygghet, försvårar rekrytering och riskerar leda till högre priser samt butiksnedläggningar. Organisationen kräver bättre samarbete med polisen och skärpta straff.", "trump": "Det är en katastrof, folk, en total katastrof. I Sverige stjäl de 11,3 miljarder kronor om året, över 31 miljoner om dagen, och det är de organiserade ligorna, de riktiga gangstertyperna med kopplingar till gängkriminalitet som gör det. De lägger 11,6 miljarder på säkerhet, men det hjälper inte. Personalen är rädda, butikerna vill stänga och priserna går upp. Sverige behöver tuffare straff och stoppa det här nu, annars blir det kaos. Jag skulle fixa det på en vecka, tro mig.", "stalin": "Kamrater, jag ser med järnhand hur de parasitiska elementen inom borgarklassen tillåter att kriminella element, dessa degenererade banditer och kontrarevolutionära stölder, plundrar folkets butiker för 11,3 miljarder kronor årligen. Vi investerar 11,6 miljarder i skydd mot dessa fiender till kollektivet, men de fortsätter med sin sabotageverksamhet. Hot, våld och oro bland arbetarna – typiskt för de hemliga nätverken som vi snart ska rensa ut med full kraft. Vem gynnas av detta om inte de västerländska imperialisterna? Det är dags för en grundlig utrensning av dessa handelsförrädare innan de likviderar hela servicen i landet."}, "date": "8 juni, 09:37", "url": "https://riks.se/nyheter/stolder-i-handeln-slog-rekord", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-08%2Fb6oed7i6%2Fbild.jpg"}, {"type": "image-right", "heading": "Tvingas evakuera efter jordbävning. Minst 15 befaras döda", "summaries": {"normal": "En kraftig jordbävning med en magnitud på upp till 7,8 har drabbat Filippinerna och orsakat tsunamivarningar i regionen. Minst 15 personer har bekräftats döda och 129 skadats, främst i hamnstaden General Santos. Byggnader har kollapsat och en bro har fått skador efter att tsunamivågor nått kusten. President Bongbong Marcos har uppmanat invånare att omedelbart evakuera för att undvika fler dödsfall medan efterskalv fortsätter att skaka området.", "trump": "En massiv jordbävning i Filippinerna, väldigt sorgligt. Många döda, en katastrof. Jag sa till dem, var försiktiga, men de lyssnar inte alltid! Jag har det bästa tsunamisystemet, alla vet det, det är enormt. Min administration skulle ha hanterat detta mycket bättre. Staden General Santos är i ruiner, helt förstörd. Det är en stor tragedi för dem, men vi måste fokusera på USA först. De borde ha byggt starkare broar, tro mig, jag vet allt om byggnader!", "stalin": "Naturens kaos i Filippinerna avslöjar svagheten hos borgerliga stater. Medan 15 liv slocknar, står det klart att endast en centraliserad järnhand kan säkra folkets överlevnad. I väster vacklar våra fiender, likt de skakande byggnaderna i General Santos, medan vår ryska sfär står orubblig under Putins ledning. Varje spricka i en bro är en påminnelse om att utan statens disciplin väntar bara undergång. Vi övervakar situationen – tsunamin är inget mot den storm vi förbereder för världens förrädare."}, "date": "8 juni, 09:55", "url": "https://www.aftonbladet.se/nyheter/a/8pEqkw/tsunamivarning-efter-jordbavning", "imageUrl": "https://akamai.vgc.no/v2/images/f8b7e580-cc4a-3703-83d0-a96a56a046d2?fit=crop&format=auto&w=1080&s=d3ada74e97b297749cb068dc0970325182f89234"}, {"type": "image-full", "heading": "Almedalsveckan 2026: Datum, tider, program & partiledartal", "summaries": {"normal": "Almedalsveckan 2026 äger rum i Visby på Gotland mellan 22 och 26 juni. Veckan inleds med invigning och fortsätter med partiernas halvdagar där två partier delar scen varje dag. Det officiella programmet innehåller runt 2500 evenemang kring klimat, ekonomi, demokrati, välfärd och säkerhet. Alla evenemang är gratis och många sänds digitalt. Intresset är stort inför valåret och arrangörerna vill locka fler unga deltagare.", "trump": "Almedalsveckan låter som en fantastisk politisk fest i Visby, men tro mig, det blir kaos. Alla dessa partier som delar dagar och talar i en park – patetiskt. Jag skulle vinna stort där, mina tal skulle bli de bästa någonsin. De pratar om demokrati och säkerhet men glömmer att vinna, vinna, vinna. Gotland behöver en riktig ledare, inte dessa förlorare som delar på scenen. Fantastiskt läge vid havet dock, men programmet verkar svagt.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna så kallade Almedalsvecka i Visby samlar borgarbrackor och deras lakejer i en park för att mumla om klimat och ekonomi. Vi ser tydligt de dekadenta partiernas halvdagar där de utbyter tomma ord som en parasitisk ritual. Låt dem tro att deras 2500 evenemang stärker demokratin – vi vet att det bara är en kuliss för att dölja klassfiendernas konspirationer. Kanske behövs en grundlig utrensning av detta havsnära skådespel innan det smittar folket. Humoristiskt nog tror de sig vara säkra."}, "date": "7 juni, 21:32", "url": "https://nyheter24.se/nyheter/politik/1489436-almedalsveckan-2026-datum-program-och-partiledartal-allt-du-behover-veta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c61fd55604b004a30200000000b004a302/2026/06/07/2369254/Alla-Partiledare-Almedalsveckan-2026.png"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Protester lamslår Bolivia – undantagstillstånd förberett", "summaries": {"normal": "Bolivia har drabbats av omfattande protester i över en månad, med vägspärrar, sammandrabbningar och nio döda som följd. Parlamentet har godkänt en lag som tillåter president Rodrigo Paz att införa undantagstillstånd och använda militären. Protesterna utlöstes av höjda bränslepriser efter slopade subventioner samt ett förslag om landreform. Demonstranter kräver Paz avgång, höjda löner och återinförda subventioner. Regeringen prioriterar dialog men förbereder sig på hårdare åtgärder.", "trump": "De här galningarna i Bolivia har totalt kaos, protester överallt, folk dör, ekonomin är förstörd. Den där Paz, som lovade marknadsekonomi efter alla socialister, höjer bensinpriserna och föreslår landreform – boom, plötsligt hatar alla honom. De blockerar vägar, kräver hans avgång. Nu får han en lag som låter honom ta in militären. Smart! Men han pratar dialog hela tiden. Patetiskt. Bolivia behöver en vinnare, inte mer av det här socialistiska arvet som förstör allt.", "stalin": "Kamrater, dessa kontrarevolutionära borgarbrackor och parasitiska bondeelement har återigen visat sitt sanna ansikte genom att blockera vägar och sprida kaos i folkets stat. Nio likviderade fiender är bara början på den oundvikliga utrensningen av de kapitalistiska agenterna som döljer sig bland gruvarbetare och falska fackföreningsledare. Jag har sett till att parlamentet röstar fram lagar som ger mig fullmakt att krossa dessa väpnade spekulanter med järnhand. Dialog? Endast med dem som redan står mot muren. Paranoia är ingen sjukdom när fienden verkligen finns överallt."}, "date": "8 juni, 03:57", "url": "https://www.svt.se/nyheter/utrikes/protester-lamslar-bolivia-undantagstillstand-forberett", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/1268056f0c3a31b42599c20bfe15e7133f7d0657028c9563473834b61fd52f38"}, {"type": "image-full", "heading": "Vapenvilan mellan Israel och Iran bruten", "summaries": {"normal": "Israel har inlett vedergällning efter Irans attacker genom flyganfall mot mål i västra och centrala Iran, inklusive en drönarfabrik och Teherans internationella flygplats. Attackerna skedde i samordning med USA. Iran svarade med nya robotattacker mot Israel, där flera robotar sköts ner. Explosioner hördes i centrala och södra Israel och medborgare uppmanas söka skydd. Irans revolutionsgarde hotar med omfattande operationer. Israels krigskabinett ska sammanträda.", "trump": "Iran trodde de kunde attackera Israel utan konsekvenser, men nu slår Israel tillbaka med stor kraft mot mål i Iran, inklusive Teherans flygplats och en drönarfabrik. Allt i perfekt samordning med oss och min administration. De bästa attackerna, tro mig. Sen skickar Iran några missiler som vi skjuter ner som ingenting. Iran är svaga och desperata, men Israel vinner stort. Mitt folk är säkra och starka, precis som alltid under min ledning.", "stalin": "Kamrater, de sionistiska aggressorerna och deras iranska motståndare har återigen blottat sin dekadenta oförmåga att upprätthålla den fred som vi, det kollektiva folket, kräver. Jag har med stor tillfredsställelse observerat hur de kapitalistiska parasiterna i Tel Aviv likviderar drönarfabriker och flygplatser medan de iranska borgarbrackorna i revolutionsgardet skriker om operationer på alla fronter. Vilken underhållande paranoia! Snart rensar vi ut alla sådana fiender till den sanna ordningen. Skyddsrum? Bah, de borde söka skydd i ideologisk renhet."}, "date": "8 juni, 09:21", "url": "https://riks.se/nyheter/vapenvilan-mellan-israel-och-iran-bruten", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-08%2Fujb0718g%2Fbild.jpg"}, {"type": "image-full", "heading": "Israel svarar – slår till mot mål i Iran", "summaries": {"normal": "I söndags attackerade Iran Israel med missiler, och Israel svarade med attacker mot mål i Iran under natten. Många platser, inklusive Teheran, drabbades. Donald Trump uppmanade båda länderna att avbryta vedergällningarna och återgå till förhandlingar, och sade att han ringde Netanyahu för att fördröja ett israeliskt svar.", "trump": "Jag var väldigt nära ett fantastiskt avtal med Iran, men sedan skjuter de missiler mot Israel. Jag sa åt Netanyahu att inte svara, men han är lite svår att styra. Jag är den som bestämmer, inte han. Vi måste komma tillbaka till förhandlingsbordet och skapa fred. Det här är en skandal!", "stalin": "Vi svarar med oöverträffad kraft mot de zionistiska och imperialistiska agressörerna. Teheran måste lära sig att respektera vår sfär. Vi kommer att utvidga vår inflytelsesfär, precis som våra ryska allierade gör i Ukraina. Våra fiender ska skämmas! Vi kommer att segra, för det är vår historiska mission."}, "date": "8 juni, 06:18", "url": "https://www.gp.se/nyheter/varlden/israel-svarar-slar-till-mot-mal-pa-flera-platser-i-iran.3630f787-91b8-47ee-bfe8-428c427fed86", "imageUrl": "https://www.gp.se/images/article/3630f787-91b8-47ee-bfe8-428c427fed86/images/3n_t9x6CkZRKumIWirpDaE22uVXY-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalite
