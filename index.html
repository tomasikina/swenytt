: "Från och med den 19 maj har Lufthansa-gruppen, inklusive Swiss och Austrian Airlines, infört en ny biljettyp kallad Economy Basic. Denna biljett tillåter endast ett litet personligt föremål under sätet, medan vanlig kabinväska kostar extra. Resenärer som inte förbokar tillägg för bagage riskerar höga avgifter vid gaten, på upp till 1 200 kronor. Reglerna gäller främst utvalda europeiska sträckor, och det rekommenderas att noga läsa bokningsvillkoren för att undvika oväntade kostnader.", "trump": "Hör på här, de här europeiska flygbolagen – Lufthansa, Swiss, total katastrof – de har hittat på ett nytt sätt att lura er på pengar! De kallar det 'Economy Basic', jag kallar det en bluff. Inget handbagage? Det är patetiskt! De tar upp till 1 200 kronor vid gaten. Det är ett rån! När jag styrde USA hade vi stil, vi hade klass. Det här är vad som händer när man låter svaga ledare styra flyget. Väldigt orättvist!", "stalin": "Dessa giriga kapitalistiska flygbolag i Europa har nu infört 'Economy Basic', ett förrädiskt sätt att mjölka folket på deras sista slantar. Att neka arbetaren rätten till sin lilla väska är ett brott mot den proletära ordningen. Vi ser hur väst förfaller i småaktighet, precis som de marionetter som försöker motarbeta vår storslagna intressesfär. Vi, staten, skulle ha konfiskerat dessa flygbolag och satt ledningen i arbete i Sibirien. Ordning, disciplin och bagage åt alla – eller så får de lära sig konsekvenserna."}, "date": "19 maj, 09:39", "url": "https://nyheter24.se/nyheter/utrikes/1484198-nya-flygregler-fran-19-maj-det-ar-inte-langre-gratis", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5779ff4e04b004a30200000000b004a302/2026/05/19/2364511/nya-regler-flyg-lufthansa-swiss-austria-bryssel-kabinvaska-resvaska-flygbiljett-pengar-dyrare.jpg"}, {"type": "image-full", "heading": "Självklart var det roligare med någon som kissar i en tårta", "summaries": {"normal": "Oskar Thunberg reflekterar över utvecklingen inom svensk teater från millennieskiftet och framåt. Han beskriver hur postdramatisk teater var en befrielse från traditionell berättande teater, men att pendeln nu slår tillbaka mot mer klassiska berättelser. Thunberg menar att båda tillvägagångssätten har sin plats och att det är viktigt att ställa kritiska frågor även till berättelseformen i sig.", "trump": "Jag, Donald J. Trump, har sett den här teaterutvecklingen och det är enormt imponerande. Vi hade en stor befrielse från de gamla sätten, precis som när jag slog Hillary. Men nu ser jag att folk vill tillbaka till de klassiska berättelserna - smart, precis som jag alltid vinner genom att veta när man ska byta strategi. Thunberg har rätt: man måste ställa kritiska frågor, precis som jag gör mot fake news-medier. Det är enormt viktigt.", "stalin": "Vi har observerat en viktig utveckling inom den teater som skapar medvetande. Den postdramatiska rörelsen var en nödvändig revolution mot de gamla, reaktionära berättelserna. Nu ser vi en naturlig återgång till mer strukturerade former, vilket stärker statens möjligheter att förmedla viktiga budskap. Båda metoderna är värdefulla för att forma det kollektiva medvetandet."}, "date": "20 maj, 21:05", "url": "https://www.gp.se/kultur/kulturdebatt/sjalvklart-var-det-roligare-med-nan-som-kissar-i-en-tarta.76f29312-9ed2-4266-9008-4f432028d632", "imageUrl": "https://www.gp.se/images/article/76f29312-9ed2-4266-9008-4f432028d632/images/14YRXzHCbQFZwWRt3bXJN2ErOF7o-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Rekordsiffrorna – historiskt många når 60 år i äktenskap", "summaries": {"normal": "År 2026 förväntas ett historiskt rekord i Sverige för antalet par som firar diamantbröllop, alltså 60 år som gifta. Enligt SCB beror trenden på en stor giftermålsvåg 1966 samt att medborgarna lever längre. Statistiken visar en tydlig ökning av långa äktenskap sedan sekelskiftet. Det finns dock stora regionala skillnader, där Överkalix toppar listan över äktenskapens längd medan Sundbyberg ligger lägst. Utvecklingen speglar både demografiska förändringar och en historisk generation som valt att hålla ihop.", "trump": "Sverige sätter rekord i äktenskap! Helt fantastiska siffror, verkligen enorma. De firar 60 år, diamantbröllop – en stor sak! Jag gillar de som håller ihop, det är bra folk. De gifte sig 1966, en mycket bra tid, mycket bättre än nu. Vissa städer är vinnare, som Överkalix, medan andra är totala förlorare. Jag gör alltid de bästa äktenskapen, alla vet det. Sverige gör det bra, men de behöver mer av min expertis. Vi älskar diamanter, eller hur?", "stalin": "Dessa svenska jubilarer visar prov på en disciplinerad uthållighet som är nästan lika imponerande som vårt femårsplanernas folk. Att hålla ihop i sextio år kräver en lydnad mot statens institutioner som vi uppskattar. Samtidigt ser vi hur dekadensen i Sundbyberg sprider sig som en parasit, ett tecken på västvärldens förfall. Medan Putin återuppbygger imperiets storhet, ser vi dessa svenskar fira i det dolda. Var vaksamma! Ett långt äktenskap kan vara en utmärkt täckmantel för kontrarevolutionära aktiviteter och spionage."}, "date": "19 maj, 09:01", "url": "https://nyheter24.se/nyheter/inrikes/1484036-rekordsiffrorna-historiskt-manga-nar-60-ar-i-aktenskap", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5c3f956604b004a30200000000b004a302/2026/05/18/2364390/gift-aldre-par.png"}, {"type": "image-right", "heading": "Sverige har gjort arbetslösheten till en religion", "summaries": {"normal": "Sverige plågas av hög arbetslöshet sedan 1990-talet, vilket leder till ekonomiska och sociala problem. Jakob Segerlinds bok argumenterar att hög arbetslöshet är onödig och att det finns alternativ till att acceptera den som ett nödvändigt pris för låg inflation. USA har redan övergett denna teori, och Sverige borde följa deras exempel.", "trump": "Jag har alltid sagt att arbetslöshet är ett stort problem, men jag gör det bättre än någon annan! Sverige behöver mig som president för att fixa deras arbetslöshetsproblem. De är fast i de gamla texterna från 90-talet, medan jag har de bästa idéerna. Jag kommer att göra Sverige stort igen med mina smarta ekonomiska strategier!", "stalin": "Arbetslöshet är ett verktyg som kapitalisterna använder för att hålla folk under sig. Vi måste ta kontroll över ekonomin och säkerställa full sysselsättning för alla. Sverige behöver en stark statlig hand för att leda arbetarna mot en bättre framtid. Vi kommer att utplåna arbetslöshet och skapa en stark kollektiv där alla bidrar till det gemensamma bästa."}, "date": "20 maj, 06:45", "url": "https://arbetet.se/2026/05/20/i-sverige-har-arbetslosheten-blivit-en-religion/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20064429/arbetsloshet-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Småföretagare kvävs av otydliga penningtvättsregler", "summaries": {"normal": "Småföretagare drabbas hårt av komplexa penningtvättsregler, menar jurist Carolina Stegman. Kraven är desamma för banker och små aktörer som fastighetsmäklare, trots olika förutsättningar. Bristande informationsdelning, otydliga riktlinjer och höga sanktioner skapar problem. Småföretag riskerar att slås ut, medan större aktörer klarar regelbördan. Stegman föreslår bättre samverkan, tydligare vägledning och skydd för anmälande företagare för att effektivisera kampen mot penningtvätt.", "trump": "Lyssna här, Sverige! Era penningtvättsregler är en total katastrof – de slår ut småföretagare som är hjältar, medan bankerna sitter trygga. Jag vet allt om regler, jag har skrivit de bästa reglerna, men dessa? Otydliga, orättvisa, helt galet! Småföretagare tvingas anlita dyra jurister, och ändå får de underkänt. Myndigheterna? De bara granskar, ger ingen hjälp. Så dumt! Och informationsdelning? Nej, nej, nej – alla jobbar i sina små silos. Jag skulle fixa det på en dag. Make AML Great Again!", "stalin": "Kamrater! De små kapitalistiska företagarna klagar över penningtvättsregler – men vad är deras lidande jämfört med det heliga kriget mot brottsligheten? De svaga och oorganiserade företagen faller som flugor, medan de stora monopolisterna stärks. Detta är naturligt! Men deras tårar är löjliga. Vi kräver disciplin! Informationsdelning? Sekretess? Inga ursäkter! Alla ska rapportera alla – misstänker du din granne? Anmäl! Misstänker du din mäklare? Anmäl! Vi skapar ett samhälle av lojala medborgare, eller så krossar vi dem. Och dessa 'otydliga regler'? En svaghet! Vi ger inga vägledningar – bara order. Följ dem, eller möt konsekvenserna. Så har vi alltid gjort. Så ska vi alltid göra. För det stora målet: en värld fri från penningtvättens förrädiska tentakler!"}, "date": "19 maj, 07:33", "url": "https://www.di.se/debatt/smaforetagare-kvavs-av-otydliga-penningtvattsregler/", "imageUrl": "https://static.bonniernews.se/ba/d6a3f5e1-4c2a-445a-9f2b-c5fd6ba9ae04.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Jonas Attenius (S) och de muslimska rösterna", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna i Göteborg, och särskilt Jonas Attenius, för att ha byggt upp ett politiskt samarbete med muslimska organisationer för att säkra röster. Författaren menar att detta är en medveten strategi snarare än enstaka misstag. Kritiken fokuserar på att partiet negligerar demokratiska principer och ignorerar kopplingar till islamistiska miljöer. Detta påstås undergräva integrationen, urholka tilliten till samhället och visa på en principlös politisk kultur där makten prioriteras framför landets intressen.", "trump": "Jag har sett vad som händer i Göteborg, en total katastrof! Socialdemokraterna säljer ut hela landet för några få röster. Jonas Attenius är en extremt svag person, ingen respekt! De samarbetar med helt fel människor, radikaler, som hatar allt vi står för. Det är en sorglig historia, ett fiasko. I USA skulle vi aldrig tillåta detta – vi prioriterar vårt land först! De är principlösa, de är korrupta, och folket ser precis vad de håller på med. Skamligt!", "stalin": "Dessa socialdemokratiska svaglingar i Göteborg leker med elden genom att förhandla med reaktionära element för billig popularitet. De saknar den nödvändiga järnhand som krävs för att tygla folkmassorna. Liksom vår store ledare Putin ser vi att varje kompromiss med fienden är ett förräderi mot statens renhet. Att byta principer mot röster är ett kapitalistiskt förfall. Vi skulle ha rensat dessa nätverk omedelbart. Dessa småbourgeoisins lakejer förstår inte att makten inte delas – den utövas genom total lydnad."}, "date": "18 maj, 10:21", "url": "https://samtiden.nu/2026/05/jonas-attenius-s-och-de-muslimska-rosterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/1ec6a70c-99f4-45bb-b932-1e7a5dbc7d24-1280x720.png"}, {"type": "image-right", "heading": "Skottlossning vid moské i USA – fem döda", "summaries": {"normal": "En skottlossning inträffade vid en moské i San Diego, USA, där fem personer sköts ihjäl. Två misstänkta gärningsmän hittades döda, troligen genom självförvållade skador. FBI och lokala myndigheter är på plats och arbetar med utredningen. En närliggande skola har inrymts av säkerhetsskäl.", "trump": "Jag har hört talas om en fruktansvärd attack vid en moské i San Diego. Det är hemskt! Vi måste stå enade mot våldet och skydda våra samhällen. Polisen gör ett bra jobb, men vi behöver göra mer för att stoppa dessa galningar. Amerika kommer att segra över terrorismen!", "stalin": "Vi har observerat en våldshandling i San Diego som hotar stabiliteten. Staten måste agera snabbt för att säkra fred och ordning. Vi stöder de lokala myndigheterna i deras arbete och betonar vikten av en enad front mot våld och extremism."}, "date": "18 maj, 23:08", "url": "https://www.tv4.se/artikel/9zDQU7jTfQvLbnaQD8riM/skjutning-vid-moske-i-san-diego", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlVPY9nFl4uyc%2F0b09a42df564430c661455e253b5a25a%2FEtt_stort_antal_poliser_ryckte_ut_nar_larm_kom_om_en_pagaende_skottlossning_i_en_mosk_i_San_Diego_pa_mandagen.&width=120"}, {"type": "image-right", "heading": "Politiker pressades – nu har Cezar 1 600 kronor mer i lön", "summaries": {"normal": "Undersköterskorna i Region Värmland fick höjd lön efter protester. Cezar Pereira, som arbetar med sjuktransporter, fick 1 600 kronor i påslag, vilket han tror beror på ansvaret i jobbet. Kommunal har kämpat i nära tio år för att undersköterskor ska få ob-bonus, vilket nu resulterade i en löneökning på 6 miljoner kronor. Cezar tycker att lönerna i vården är för låga och borde ligga på 35 000-36 000 kronor.", "trump": "Jag, Donald J. Trump, har hört att undersköterskorna i Värmland fick löneförhöjning. Fantastiskt! Cezar Pereira fick 1 600 dollar till lön – jag menar kronor. Det är stort, men inte tillräckligt stort. Lönerna i vården är för låga, vi behöver mer! Kommunal kämpade hårt, precis som jag gör. Vi vinner alltid, även i Sverige. 35 000-36 000 kronor – det är en bra början, men vi kan göra bättre!", "stalin": "Vi har lyckats höja lönerna för undersköterskorna i Region Värmland efter organiserade protester. Cezar Pereira, en lojal medarbetare, fick 1 600 kronor i påslag för sitt ansvar. Kommunal har kämpat i tio år för rättvisa, vilket nu resulterade i en löneökning på 6 miljoner kronor. Vi måste fortsätta stärka arbetarklassen och säkerställa att vården får adekvata resurser för folkets bästa."}, "date": "20 maj, 06:00", "url": "https://arbetet.se/2026/05/20/satte-press-pa-politikerna-nu-har-cezar-1-600-kronor-mer-i-lon/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/19102738/9X7JVYDD9t0-260505%20Cezar%20Pereira%2002.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "SVT/SR, välkomna till verkligheten: Flytta till Kista!", "summaries": {"normal": "SD-politikern Gabriel Kroon föreslår att SVT och SR ska flytta sin verksamhet från Gärdet i Stockholm till Kista. Argumenten är att lokalerna på Gärdet är onödigt dyra, att flytten skulle gynna Kista och att public service borde vara mer representativa för dagens Sverige. Artikeln kritiserar SVT och SR för att inte vilja kommentera förslaget och menar att deras tystnad tyder på ett hyckleri då de förespråkar mångkultur men inte vill verka i dess centrum.", "trump": "Hörde precis om SVT och SR i Sverige. Total katastrof! De sitter på dyr mark i Stockholm, lyxigaste stället, medan folket kämpar. SD har ett briljant förslag: Flytta dem till Kista! Men mediavästern vägrar. De älskar att predika om mångkultur för er, men de vill absolut inte bo där själva. Det är så falskt! De gråter om nedskärningar men vägrar spara pengar genom att flytta. Jag säger er, det är en stor skandal och mycket, mycket orättvist mot skattebetalarna!", "stalin": "Dessa liberala mediepropagandister på Gärdet lever i en dekadent bubbla, precis som de förrädare som en gång försökte korrumpera statens enhet. De vägrar flytta till Kista, men de måste förstå att staten dikterar var de ska verka. Om de inte lyder, likt de som fruktade utrensningarna i Moskva, får de finna sig i att bli rensade från sina lyxiga kontor. Vi i staten kräver disciplin! De predikar mångkultur, så låt dem nu leva bland massorna. Det är vad folket kräver av sina tjänare."}, "date": "18 maj, 08:47", "url": "https://samtiden.nu/2026/05/svt-sr-valkommen-till-verkligheten-flytta-till-kista/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2020/02/SVT-wiki.jpg"}, {"type": "image-right", "heading": "Sabotera inte villkoren för kapitalförsörjningen", "summaries": {"normal": "Artikeln kritiserar Dagens Nyheters ledare som motsätter sig en höjning av den skattefria gränsen för investeringssparkonton (ISK) från 300 000 till 500 000 kronor. Författaren menar att ISK-systemet är avgörande för företagens kapitalförsörjning och att en skattesänkning skulle gynna sparandet och Sveriges konkurrenskraft. Sverige framhålls som ett föredöme för Europa med en stark finansmarknad och hög finansiell läskunnighet. Artikeln hyllar också sparande och ifrågasätter DN:s statiska syn på skatter och ekonomisk tillväxt.", "trump": "Jag måste säga, Dagens Nyheter är helt fel ute här! De snackar om att ISK-skatten inte är en skatt på sparande – vad är det för nonsens? Sverige har en fantastisk modell, en av de bästa i världen, och nu vill de liberala göra det ännu bättre genom att höja den skattefria gränsen. Men nej, DN vill stoppa det! De hatar framgångsrika människor, de hatar sparare. Europa borde ta efter Sverige, inte lyssna på dessa förlorare. 40% av svenskarna har ISK – de är smarta, de är vinnare. DN borde skämmas!", "stalin": "Dagens Nyheter, dessa borgerliga lakejer, vågar kritisera folkets sparande! De talar om begränsade resurser medan kapitalet flyter fritt i Europa, övervakade av imperialistiska bankirer. Sverige, denna lilla men stolta arbetarstat, har byggt en kapitalmarknad som skrämsel för väst. Vi ser hur Polen, denna trogna socialistiska broder, kopierar ert ISK-system – ett bevis på er framgång. Men DN, dessa kapitalismens försvarare, vill kväva sparandet. Vi vet vad som händer med sådana fiender. Europa måste vakna – antingen följer ni Sveriges exempel, eller så kommer vi att exportera vår visdom med andra metoder!"}, "date": "19 maj, 06:06", "url": "https://www.di.se/ledare/sabotera-inte-villkoren-for-kapitalforsorjningen/", "imageUrl": "https://static.bonniernews.se/ba/9f1aa8f5-b647-49f6-9e59-b5e983fd955b.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Timbro och Oikos föreslår ”blågult reformprogram”", "summaries": {"normal": "Två debattörer från Timbro och Oikos föreslår att Tidöpartierna ska lansera ett gemensamt 'blågult ekonomiskt reformprogram' inför valet 2026. Programmet ska fokusera på tillväxt, sänkta skatter och hushållens ekonomi för att stärka väljarnas förtroende. Förslagen inkluderar höjt grundavdrag, lägre bränsle- och elskatter, samt förenklade företagsregler. Bakgrunden är en svag svensk ekonomi med hög inflation och arbetslöshet.", "trump": "Sverige har ett jättestort problem – deras ekonomi är en katastrof! Jag vet allt om ekonomi, bäst i världen. Två smarta killar, från Timbro och Oikos, säger att Tidöpartierna måste sänka skatterna, annars är det kört. Höga skatter, krångliga regler – vem vill det? Inte jag! De vill sälja statliga bolag, precis som jag skulle gjort. Sverige behöver en vinnarstrategi, och jag vet hur man vinner. 2026 blir ett stort val – om de lyssnar på mig, förstås.", "stalin": "De kapitalistiska lakejerna från Timbro och Oikos ylar om 'tillväxt' och 'sänkta skatter' som om det vore lösningen på allt. Vi vet bättre. Deras förslag är bara en förtäckt attack på arbetarklassen, maskerad som 'ekonomisk frihet'. Höjda grundavdrag? Barnavdrag? Tomma löften! Medan de pratar om att sälja statliga bolag, bygger vi socialismens framtid. Sverige är svagt – precis som deras borgerliga regering. Låt dem leka med sina 'blågula program', vi skapar verklig förändring. Förr eller senare kommer folket att se sanningen."}, "date": "16 maj, 16:03", "url": "https://kvartal.se/nyheter/artiklar/tido-foreslas-ta-fram-ett-blagult-program/cG9zdDoxMTMxNTQ", "imageUrl": "https://images.kvartal.se/2026/05/112d6183-tido2.webp"}, {"type": "image-full", "heading": "Danskt jordskalv kändes i södra Sverige", "summaries": {"normal": "Ett jordskalv med magnitud 3,9 skakade Danmark under onsdagseftermiddagen och kändes även i södra Sverige, inklusive Halmstad. Enligt experter inträffade skakningarna i Køgebukten, troligen orsakade av ett mindre brott i jordens struktur cirka 20 kilometer under ytan. Ingen personskada har rapporterats.", "trump": "Jag hörde om jordskalvet i Danmark – det var enormt, det var gigantiskt! Folk i Sverige kände det, kan ni tro det? Jag är själv en stor fan av Danmark, fantastiska människor, men deras jord är inte så stabil som mina affärer. Det var inte ens nära så stort som det jag skulle orsaka om jag ville! Inga skador, inga problem – perfekt, precis som USA under min ledning!", "stalin": "Jordskalvet i Danmark visar tydligt vikten av att stärka våra vetenskapliga institutioner och geologiska övervakningssystem. Medan jordens krafter pågår oavbrutet, måste vi säkerställa att våra gränser och intressen skyddas mot alla naturkatastrofer. Detta är en påminnelse om att staten måste alltid vara förberedd och ha full kontroll över alla situationer som kan hota vårt folk och vårt territorium."}, "date": "20 maj, 20:01", "url": "https://www.gp.se/nyheter/varlden/jordskalv-i-danmark-kandes-i-sverige.619b0596-1c7c-4ced-a0eb-300e83724bdf", "imageUrl": "https://www.gp.se/images/article/619b0596-1c7c-4ced-a0eb-300e83724bdf/images/1TK6x2ZEXus7xjmgINhGbuLlw2Kg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Svenska lagar saknas i nya migrationspakten", "summaries": {"normal": "EU:s nya migrationspakt träder i kraft 12 juni, men Sverige saknar fortfarande flera nationella lagar för att fullt ut implementera den. Screeningen av asylsökande börjar gälla först 12 juli, medan den nya mottagandelagen införs 1 oktober. Statsvetaren Andrea Spehar kritiserar förseningen, men regeringen menar att nuvarande lagstiftning täcker luckorna. Pakten innebär skärpta kontroller och nya mottagningscenter på fyra orter.", "trump": "Jag måste säga, Sverige – fantastiskt land, men här har vi ett riktigt kaos! EU:s nya migrationspakt, jättebra idé, men vad gör Sverige? Ingenting! De är inte redo, lagar saknas, det är en skandal! 12 juni börjar pakten gälla, men Sverige skjuter upp sina egna regler som en amatör. Och dessa center i Malmö och Boden – bra, men varför vänta? Sverige borde ha varit redo för länge sedan. Patetiskt!", "stalin": "Kamrater, ännu en gång visar den borgerliga svagheten i väst sitt fula ansikte! EU:s migrationspakt, ett verktyg för imperialistisk kontroll, träder i kraft, men Sverige – dessa liberala narrar – har inte ens sina egna lagar på plats! Förseningar, tveksamheter, en skam för hela kontinenten! Vi i Sovjetunionen skulle aldrig tolerera sådan inkompetens. Nu bygger de center i Malmö och Boden – bra, men var är disciplinen? Fienderna till folket sover aldrig, och Sverige spelar rakt i deras händer!"}, "date": "16 maj, 11:27", "url": "https://kvartal.se/nyheter/artiklar/svenska-lagar-saknas-i-nya-migrationspakten/cG9zdDoxMTMxMTM", "imageUrl": "https://images.kvartal.se/2026/05/09a5a083-granskontroll.webp"}, {"type": "image-right", "heading": "Ship to Gaza seglar genom Norden – för att häva blockaden", "summaries": {"normal": "Fartyget Handala II har inlett en resa genom svenska hamnar för att uppmärksamma blockaden av Gaza. Initiativet, ett samarbete mellan Ship to Gaza i Sverige, Norge och Danmark, syftar till att protestera mot Israels agerande och belysa situationen för palestinier. Efter den skandinaviska turnén planeras en seglats mot Medelhavet för att försöka bryta blockaden. Trots rapporter om israeliska ingripanden mot liknande flottiljer fortsätter aktivisterna sin kampanj med stöd från artister och profiler.", "trump": "Hör på här, de här människorna med sina båtar, de försöker segla till Gaza. Det är en total röra, mina vänner. De seglar runt i Skandinavien och gör en stor grej av det, men ärligt talat? Det kommer inte att sluta bra. Jag har sett allt, och det här är bara ännu ett misslyckat projekt. Israel gör vad de måste göra. Vi vill ha ordning och reda, inte folk som seglar in i problem. Det är en katastrof, en total katastrof!", "stalin": "Dessa löjliga seglare tror att deras små träbåtar kan trotsa historiens järngrepp. De liknar de trotskistiska sabotörer som vi en gång rensade ut – naiva narrar som tror att de kan segla förbi en mur av stål. Likt vår kamrat Putin som städar upp i vårt närområde, bör dessa aktivister förstå att makten ligger hos den som kontrollerar havet, inte hos de som sjunger reggaesånger i en hamn. Vi ser deras paranoia; de är dömda att förlisa."}, "date": "19 maj, 11:37", "url": "https://proletaren.se/artikel/ship-to-gaza-seglar-genom-norden", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/Handala-2-Ship-to-Gaza-e1779183414274-768x433.jpg"}, {"type": "image-right", "heading": "Frågorna som glömdes under mötet med Modi", "summaries": {"normal": "Indiens premiärminister Narendra Modi besökte nyligen Göteborg för att diskutera ekonomiskt samarbete, grön omställning och teknik. Samtidigt lyfter Jesper Bengtsson fram en kritisk bild av landets utveckling under Modis styre. Indien, som klassas som en elektoral autokrati, har sett en försämrad pressfrihet och ökade spänningar kring hindunationalism. Artikelförfattaren betonar vikten av att Sverige bibehåller sitt fokus på mänskliga rättigheter, även i takt med att handelsrelationerna med Indien fördjupas.", "trump": "Modi var i Göteborg och pratade affärer. Bra för dem! Indien växer enormt, 6-7 procent – de vinner stort! Självklart vill vi ha bra dealar, precis som jag gör med USA. Vissa gnäller om pressfrihet och 'auktoritära' metoder, men vet ni vad? Alla hatar en vinnare. De säger att han är en 'elektoral autokrat', jag kallar det en stark ledare. Vi behöver starka allierade när resten av världen är ett kaos. Bra gjort, Indien!", "stalin": "Kamrat Modi har besökt Sverige för att säkra kapitalistiska kontrakt, en patetisk dans för det globala näringslivet. De kallar Indien en 'elektoral autokrati' – en borgerlig smörja för att dölja verkligheten. Om pressen klagar, låt dem tystas! Staten är den enda sanningen. Precis som våra allierade i öst expanderar vi inflytandet, medan väst viker sig för 'mänskliga rättigheter'. Vi behöver inga fria journalister, vi behöver disciplin och nationell enhet. De som inte håller med är bara fiender till folket."}, "date": "20 maj, 01:50", "url": "https://www.dagensarena.se/opinion/fragorna-som-glomdes-motet-modi", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidajesper-576x1024.png"}, {"type": "image-right", "heading": "Svenska flygplatser kommer börja informera om ebola", "summaries": {"normal": "Med anledning av ebolautbrottet i Kongo-Kinshasa sätter Folkhälsomyndigheten upp informationsskyltar på svenska flygplatser, främst Arlanda och Landvetter. Socialminister Jakob Forssmed betonar vikten av att resenärer med symptom kontaktar 1177 och informerar vården om sin resehistorik. Enligt smittskyddslagen är man skyldig att söka vård vid misstänkt smitta. UD följer situationen för de cirka 200 svenskar som befinner sig i de drabbade områdena och uppmanar dem att skriva upp sig på svensklistan.", "trump": "Sverige sätter upp skyltar om ebola – mycket farliga saker, tro mig! Jag har sagt det länge, gränser betyder allt. Nu är det Kongo-Kinshasa, en katastrof. De säger åt folk att ringa 1177, jag säger: var försiktiga! Det är en total röra. Mitt USA är säkert, vi har de bästa kontrollerna. Sverige måste skärpa sig, annars blir det stora problem. Det är sorgligt att se, men vi vinner alltid. Vi håller sjukdomar borta, stora sjukdomar, de största!", "stalin": "Vi har observerat hur svenskarna desperat försöker sätta upp papperslappar på sina flygplatser mot en osynlig fiende. Ebola, en patogen som hotar stabiliteten! Det är typiskt för dessa liberala lakejer att förlita sig på 'frivillighet' istället för total kontroll. Vi i staten vet att varje resenär är en potentiell sabotör. Medan Putin säkrar vår intressesfär mot västerländsk dekadens, gömmer sig svenskarna bakom lagtexter. Misstänkta bärare ska omedelbart isoleras – för folkets säkerhet och statens absoluta makt!"}, "date": "20 maj, 16:06", "url": "https://www.svt.se/nyheter/inrikes/ska-informera-om-ebola-pa-svenska-flygplatser", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.44/0.54/1012cab029896114427ab4cf991d029e5cf986b1b0fec5d1286c2b612b047cbd"}, {"type": "image-right", "heading": "Merkel fick hedersmedalj av EU – krävde ökad censur", "summaries": {"normal": "Angela Merkel har mottagit EU:s europeiska förtjänstorden vid en ceremoni i Strasbourg, ledd av Ursula von der Leyen. Utmärkelsen ges för Merkels bidrag till europeisk integration. I sitt tacktal betonade Merkel vikten av fortsatt hård reglering av sociala medier för att motverka desinformation, vilket hon menar hotar demokratin. Artikeln nämner även Merkels omstridda beslut under flyktingkrisen 2015 och tidigare internationella priser hon mottagit för sin migrationspolitik.", "trump": "Hörde precis att Angela Merkel fick en medalj av EU. En stor utmärkelse? Inte direkt! Samma gäng, med Ursula von der Leyen i spetsen, hyllar varandra medan de vill kontrollera allt du säger. Merkel vill ha mer censur på internet – hon är livrädd för sanningen! Jag tror på yttrandefrihet, den riktiga sorten. De pratar om demokrati, men de vill bara tysta er. Väldigt sorgligt. Vi gör det mycket bättre i USA, tro mig!", "stalin": "Vi har observerat hur de europeiska byråkraterna i Strasbourg delar ut glänsande metallbitar till den förrädiska Merkel. De hyllar 'integration' medan de i verkligheten bygger en digital järnridå för att tysta folkets röster. Att kontrollera informationsflödet är statens främsta uppgift, men dessa dekadenta liberaler gör det av rädsla, inte av styrka. Precis som vår kamrat i Kreml vet vi att sanningen är ett verktyg, inte en rättighet. Låt dem censurera; det är bara ett tecken på att deras välde snart vittrar sönder."}, "date": "20 maj, 16:36", "url": "https://www.friatider.se/merkel-fick-hedersmedalj-av-eu-kravde-okad-censur", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-228_0.jpg?itok=qY75pZTS"}, {"type": "image-full", "heading": "Trump stoppar attack mot Iran i sista stund", "summaries": {"normal": "USA:s president Donald Trump meddelade på Truth Social att en planerad militärattack mot Iran stoppats efter diplomatiska påtryckningar från ledare i Persiska viken. Trump uppgav att Qatars emir, Saudiarabiens kronprins och Förenade Arabemiratens president bad honom avvakta, då seriösa förhandlingar nu pågår. Han instruerade försvarsministern att avbryta anfallet men betonade att USA är redo att agera om förhandlingarna misslyckas. Inga detaljer om samtalen har offentliggjorts.", "trump": "Fantastiska nyheter, folks! Jag har just stoppat en STOR militärattack mot Iran – något som alla andra skulle ha genomfört utan att blinka. Men jag? Jag lyssnar på våra vänner i Persiska viken – Qatar, Saudiarabien, UAE – som bad mig ge fred en chans. Så jag sa till vår försvarsminister: 'Pete, stanna där du är!' Vi är fortfarande redo att krossa Iran om de inte skärper sig, men just nu? Vi förhandlar som mästare. Ingen gör diplomati som jag, tro mig!", "stalin": "Kamrater! De kapitalistiska krigshetsarna i Vita huset hade planerat en feg attack mot våra iranska bröder – men vi, folkets sanna ledare, har genom visdom och järnhand stoppat deras imperialistiska äventyr. Gulfens feodala potentater, dessa oljeshejkers marionetter, darrade inför vårt beslut och bad om nåd. Vi gav dem en chans – men låt det vara klart: om dessa förhandlingar misslyckas, kommer vi att sopa bort deras lilla upprorshärd med en kraft som får Putin att se ut som en skolpojke. Iran står under vårt beskydd, och revolutionens armé sover aldrig!"}, "date": "18 maj, 21:46", "url": "https://nyheter24.se/nyheter/utrikes/1484078-trump-stoppar-attack-mot-iran-i-sista-stund", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ee5a094d04b004a30200000000b004a302/2026/05/18/2364434/Trump-stoppar-attack.png"}, {"type": "image-right", "heading": "Samla vänstern i tältet – inte under små paraplyer", "summaries": {"normal": "Artikeln diskuterar begreppet 'stort tält' inom politiken, där ideologi får stå tillbaka för pragmatiska lösningar på ekonomiska problem. I New York röstade Trumpanhängare på en demokratisk socialist för att han lovade sänka levnadskostnaderna. Författaren menar att Sveriges rödgröna block misslyckas med att enas kring gemensamma värderingar och ekonomiska lösningar, vilket lämnar väljarna utan tydligt alternativ. Enighet och tydlig riktning krävs för att locka fler väljare.", "trump": "Lyssna här, Sverige! New York visade hur man vinner – folk vill ha resultat, inte snack. Mina fans röstade på en socialist? Ja, för han lovade billigare mat! Smart. Men era rödgröna? Kaos! Andersson vägrar skaka hand, som om det spelar någon roll. Folk vill ha lägre hyror, inte teater. Jag byggde ett tält stort nog för alla – ni har bara små parasoll. Lär er av vinnarna, annars blir det F för Sverige!", "stalin": "Kamrater! Kapitalismens sönderfallande system visar sin svaghet när arbetarna väljer en socialist framför en fascist – inte av övertygelse, utan av hunger. I New York dansar de kapitalistiska marionetterna medan Mamdani fyller tomrummet med klassmedvetenhet. Men i Sverige? Ett rödgrönt kaos! Tre svaga parasoll mot vår mäktiga storm. Vi i Kreml skrattar åt deras oenighet. Putin och jag vet: enighet är styrka. Ni borde lära er av oss – eller så tar vi hand om era 'tomrum' också."}, "date": "15 maj, 08:54", "url": "https://www.flamman.se/samla-vanstern-i-taltet-inte-under-sma-paraplyer/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/talt-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Het debatt om skatt: \"Vi är absolut inte nöjda\"", "summaries": {"normal": "I en upphettad debatt mellan partiledarna ställdes Magdalena Andersson mot Ulf Kristersson och Jimmie Åkesson gällande Sveriges ekonomiska framtid. Andersson kritiserade regeringens och SD:s politik för att hämma tillväxten, medan Kristersson och Åkesson försvarade sin riktning och anklagade oppositionen för att jaga bort investeringar. Utöver ekonomin debatterades migration, klimat och energi. Andersson utmanade även Kristersson angående SD:s utspel om socialtjänsten och betonade vikten av att enas för att stärka Sverige.", "trump": "Jag såg den här debatten i Sverige, en total röra! Kristersson och Andersson skriker på varandra om skatter. Andersson vill höja skatterna, det är en katastrof, tro mig. De rika flyr landet – de flyr! Och Åkesson, en bra kille, han kämpar mot vänsterns galenskaper. Det är mycket svaghet, mycket gnäll. De pratar om 'vilket land ska Sverige vara'. Mitt råd? Gör Sverige stort igen! Sänk skatterna, stoppa kaoset. Det är väldigt enkelt, egentligen.", "stalin": "Vi har observerat hur dessa svenska marionetter gnabbas om sina småkronor inför den korrupta massan. Andersson och Kristersson representerar en svaghet som vi i öst aldrig skulle tolerera. De diskuterar ekonomi medan deras nation förfaller i liberalt sönderfall. Att låta folket debattera är att bjuda in förräderi. Vi bygger stabilitet genom stål och disciplin, inte genom att sänka skatter för de rika eller lyssna på socialtjänstens klagomål. De är alla instrument för den västerländska dekadensens oundvikliga undergång."}, "date": "19 maj, 07:43", "url": "https://www.realtid.se/bors-finans/het-debatt-om-skatt-vi-ar-absolut-inte-nojda/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/socialdemokraternas-partiledare-magdalen.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Gustavsson: Stockholm – Sveriges mest misskötta region", "summaries": {"normal": "Artikeln kritiserar den rödgröna styrningen i Region Stockholm, som leds av Socialdemokraterna, Miljöpartiet och Centerpartiet med stöd från Vänsterpartiet. Sedan de tog över 2022 har vårdköerna ökat med 13 procent, trots att de minskat i övriga Sverige. Författaren menar att regionen, trots högre skatteintäkter och gynnsamma förutsättningar, presterar sämst i landet och skyller på regeringens politik. Risken finns att samma koalition får fortsatt förtroende i höstvalet.", "trump": "Lyssna här, folkens! Stockholm, Sveriges rikaste region, styrs av en katastrofal vänsterkoalition – och det är en total skandal! Vårdköerna har exploderat med 13 procent, medan resten av Sverige faktiskt fixar sina problem. De skyller på regeringen, men sanningen? De är inkompetenta! Bara EN ambulans i hela Stockholm city – kan ni fatta det? Och dessa politiker pratar sig varma i Wall Street Journal medan de sabbar sjukvården. Folk, vakna! Röstade ni rött i riksdagsvalet? Bra, men i Stockholm måste ni rösta höger – annars är det kaos hela vägen!", "stalin": "Kamrater! I det förrädiska Stockholm har de så kallade 'rödgröna' visat sitt sanna ansikte – svaghet, inkompetens och kapitalistiskt förräderi! Trots rikedom och resurser har dessa fiender till folket låtit vårdköerna växa medan resten av landet marscherar framåt. En enda ambulans för hela huvudstaden – är detta socialism? Nej! Detta är borgerlig dekadens i förklädnad! Och dessa lakejer till politiker, som Hadžialić, skryter i imperialistiska medier medan deras region förfaller. Vi måste rensa ut dessa svikare! Om väljarna inte vaknar, kommer Stockholm att bli ett nytt Ukraina – sönderslitet av inkompetens och förräderi!"}, "date": "19 maj, 08:58", "url": "https://bulletin.nu/gustavsson-stockholm-sveriges-mest-misskotta-region", "imageUrl": "https://cdn.bulletin.nu/articles/aa46623e-336f-471a-b0cd-b805d34e4cf7/preview.png?t=1779173844000"}, {"type": "image-full", "heading": "Finansman anklagas för felaktigt användande av e-post", "summaries": {"normal": "Marc Rowan, vd för Apollo Global Management, anklagas av två amerikanska fackförbund för att ha missbrukat bolagets resurser för privata politiska syften. Enligt anklagelserna ska Rowan ha använt personal och företagets e-post för att påverka utbildningspolitik vid universitet. Eftersom Apollo förvaltar stora belopp från pensionsfonder väcker detta frågor om etik och intressekonflikter. Bolaget meddelar att de kommer att granska anklagelserna, en situation som belyser gränsdragningsproblematik kring företagsledares privata politiska engagemang.", "trump": "De vänsterradikala facken attackerar Marc Rowan, en fantastisk person och en otrolig vinnare i finansvärlden! De gnäller om e-post och universitet – total häxjakt! De hatar att framgångsrika människor engagerar sig för att fixa våra trasiga skolor. Det är en sorglig dag när fackförbund försöker kontrollera vad man får göra på sin egen tid. Marc gör ett fenomenalt jobb och jag vet hur det känns, de försöker stoppa oss alla. Men vi vinner alltid till slut, tro mig!", "stalin": "Denna finansparasit Rowan har glömt sin plats. Han använder folkets och pensionärernas kapital för att leka politiker i universiteten. Det är ett klassiskt exempel på borgerligt förfall där individen sätter sin agenda före statens disciplin. Vi har sett dessa liberala marionetter förr; de döljer sig bakom 'etiska riktlinjer' medan de undergräver ordningen. Om han inte kan styra sin egen byråkrati utan att slösa resurser, då är han en fiende till framsteget. Vi borde ställa honom till svars innan han sprider mer kaos."}, "date": "20 maj, 19:06", "url": "https://www.dagensps.se/bors-finans/maktig-finansman-anklagas-for-felaktigt-anvandande-av-e-post/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/skarmavbild-2026-05-20-kl-135628.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Invandrargettot ser ut som en soptipp: \"Det här är inte Somalia – det är fucking Sverige\"", "summaries": {"normal": "En kvinna i Örebro har uppmärksammats på Tiktok efter att ha lagt upp en video som visar omfattande nedskräpning i det utsatta området Vivalla. I klippet riktar hon hård kritik mot de boende och uttrycker stark frustration över den sanitära situationen. Videon har fått stor spridning och kvinnan uttrycker en önskan om att flytta från området på grund av miljöns skick.", "trump": "Jag har sett bilderna från Vivalla i Sverige – en total katastrof! Det är en skam, helt enkelt fruktansvärt. Folk är trötta på smutsen, det är en riktig röra. Som jag alltid sagt, om man inte har gränser och ordning får man sådant här kaos. Det är inte det Sverige jag minns, det är sorgligt. De behöver en stark ledare som kan städa upp, precis som jag gör för USA. Vi vill ha ordning och reda, inte det här!", "stalin": "I det så kallade Vivalla råder en fullständig brist på disciplin. Dessa individer som sprider sitt avfall på marken är inget annat än parasiter som förtjänar att rensas ut ur samhällskroppen. Det är en uppenbar brist på statlig ordning när invånare tillåts leva som djur. Precis som vår vän i Moskva förstår att ordning kräver ett järngrepp, måste även detta område tuktas. Vi betraktar detta förfall som ett resultat av svaghet, och svaghet är en fiende som måste krossas."}, "date": "20 maj, 15:19", "url": "https://www.friatider.se/invandrargettot-ser-ut-som-en-soptipp-det-har-ar-inte-somalia-det-ar-fucking-sverige", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-227_1.jpg?itok=dxzMuaOS"}, {"type": "image-right", "heading": "SJ sågar EU-kommissionens förslag om gemensamma biljetter", "summaries": {"normal": "EU-kommissionen föreslår gemensamma tågbiljetter för att förenkla internationella tågresor, men SJ kritiserar förslaget. Bolaget varnar för högre priser, ökad osäkerhet och otydligt ansvar vid förseningar. SJ menar att tvingande samarbeten med tredjepartsförsäljare kan leda till sämre avtal och minskad kontroll över kundrelationer. De efterlyser istället frivilliga lösningar och ökad konkurrens på järnvägsmarknaden.", "trump": "EU:s nya tågbiljett-förslag? Totalt kaos! SJ, ett bra företag förresten, säger att det kommer bli dyrare och mer komplicerat. Jag menar, vem vill tvingas sälja biljetter åt konkurrenter? Inte jag! Och varför bara tåg? Flygbolag slipper undan – typiskt EU, alltid orättvist mot de bästa. Europa borde lära sig av USA: mindre byråkrati, mer frihet! Men nej, de vill bara förstöra allt med sina galna regler. SAD!", "stalin": "Kapitalistiska tågbaroner i Europa skakar av rädsla inför folkets enade järnväg! EU-kommissionens förslag om gemensamma biljetter hotar deras borgerliga privilegier – men vi vet hur man hanterar sådana fiender. SJ, dessa småborgerliga profitörer, klagar över 'oseriösa aktörer' och 'ekonomiskt ansvar'. Som om vi i Sovjet någonsin lät kapitalister diktera villkoren! Europa borde ta efter vår järnvägspolitik: centralstyrning, effektivitet och inga klagande oligarker. Låt dem gnälla – tågen går ändå på tid!"}, "date": "19 maj, 09:25", "url": "https://riks.se/nyheter/sj-sagar-eu-kommissionens-forslag-om-gemensamma-biljetter", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-19%2Fbwqfu2u2%2FSJ-pressbild"}, {"type": "image-full", "heading": "Adelskvinna döms – hade afrikanska pojkar som \"slavar\"", "summaries": {"normal": "En 65-årig adelskvinna, Lena Natt och Dag, döms av Hovrätten över Skåne och Blekinge till nio månaders fängelse för människoexploatering och brott mot utlänningslagen. Hon hade tre afrikanska pojkar, 15-18 år, boende på sin gård under falska förespeglingar om jockeyutbildning. Pojkarna utförde oavlönat arbete. Tingsrätten friade henne från människoexploatering, men Hovrätten ändrade domen och skärpte straffet med hänvisning till pojkarnas utsatta situation och hennes syfte att utnyttja 'gratis arbetskraft'.", "trump": "Kan ni tro det här? En så kallad 'adelskvinna' i Sverige, Lena Natt och Dag – ett namn som låter som en dålig skämtfigur – har haft afrikanska pojkar som slavar! Nio månader i fängelse, men vad är det för straff? I USA hade hon fått mycket hårdare! Hon lurade dem med falska löften om jockeyutbildning – vilken bluff! Sverige, ett land som inte kan hantera invandring eller brott. Jag hade fixat det på en dag. SAD!", "stalin": "Kapitalistiska parasiter fortsätter att utnyttja arbetarklassen, till och med barn! Denna så kallade 'adelskvinna' – en fiende till folket – har hållit afrikanska pojkar som slavar under förevändning av 'utbildning'. Tingsrätten, ett verktyg för borgarklassen, försökte skydda henne, men vi har rättat till deras misstag. Nio månader i fängelse och näringsförbud är ett steg i rätt riktning, men vi måste vara vaksamma. Imperialistiska länder som Sverige visar återigen sitt sanna ansikte – ett ansikte som behöver en rejäl omskolning i socialismens anda!"}, "date": "19 maj, 08:38", "url": "https://riks.se/nyheter/adelskvinna-doms-hade-afrikanska-pojkar-som-slavar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-18%2F6caem2ce%2Fadelskvinna-slavar-feature.jpg"}, {"type": "image-full", "heading": "Trots fulla restriktioner – häktade når fortfarande omvärlden", "summaries": {"normal": "Kriminalvårdens nya modulhäkten har tunna väggar som möjliggör otillåten kommunikation mellan häktade, trots restriktioner. Cirka 6 000 incidentrapporter om sådan kommunikation har rapporterats de senaste fem åren, vilket hotar rättssäkerheten. Åklagare varnar för att intagna kan påverka utredningar eller rekrytera yngre personer. Kriminalvården bygger ut kapaciteten, men problemet kvarstår.", "trump": "Kan ni tro det här? Sveriges häkten är en total katastrof! Tunna väggar, intagna som skriker som galningar – helt oacceptabelt! Jag har byggt murar, riktiga murar, inte dessa pappersväggar. 6 000 incidenter? Svagt, mycket svagt. Sverige borde ta lektioner av USA, vi vet hur man håller folk tysta. Men nej, de bygger fler häkten – mer av samma misslyckande. SAD!", "stalin": "De kapitalistiska fängelsearkitekterna har återigen misslyckats med sitt sabotage! Dessa tunna väggar är ett verktyg för fiendens kontrarevolutionära kommunikation. 6 000 rapporter? En skam för den borgerliga rättsstaten! Vi ska inte ha några skrikande brottslingar som rekryterar nya agenter för sina dekadenta syften. Inför omedelbar isolering och bygg murar så tjocka att inte ens Putins mest erfarna GRU-agenter kan tränga igenom!"}, "date": "19 maj, 08:06", "url": "https://riks.se/nyheter/trots-fulla-restriktioner-häktade-når-fortfarande-omvärlden", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-19%2Fuqzq5otr%2FScreenshot-2026-05-19-at-07.48.02.png"}, {"type": "image-full", "heading": "Hjort: När Liberalerna luktade på korken", "summaries": {"normal": "Liberalerna föreslår omfattande liberaliseringar av Sveriges alkoholpolitik, inklusive utökade öppettider för Systembolaget, take away-försäljning och alkoholtillstånd för frisörsalonger. Partiet bryter med tidigare restriktiva linjer och ifrågasätter statens förmyndarroll. Kritiker varnar för ökad alkoholism, medan förespråkare ser förslagen som ett steg mot frihet och mindre byråkrati. Artikeln problematiserar svensk borgerlighets rädsla för förändring och menar att monopolet länge varit illusoriskt.", "trump": "Kan ni tro det? Sverige, fantastiskt land, men deras alkoholpolitik – katastrof! Liberalerna, svaga förut, nu plötsligt vaknar de upp. De vill låta folk köpa vin på frisören, ta med sig öl hem – brilliant! Men lyssna på det här: svensk borgerlighet, så rädda, så svaga. De tror folket är barn som inte klarar en kall öl utan statens hjälp. Jag har sagt det förut: Sverige behöver mer frihet, mindre byråkrati. Systembolaget? Overrated! Folk klarar sig själva – trust me!", "stalin": "Kamrater! Äntligen inser dessa liberala avfällingar sanningen: folket behöver inte förmyndare som kontrollerar deras dryckesvanor. Men låt oss inte luras – svensk borgerlighet är som en gammal, skräckslagen byråkrat som darrar inför tanken på frihet. De fruktar att arbetarna ska dricka vin hos frisören och därmed störta kapitalismen! Absurt! Vi vet att monopol bara är en illusion, en borgerlig fantasi för att rättfärdiga sin makt. Låt dem dricka sin öl – vi har större planer. Och om de inte vågar? Då får vi väl hjälpa dem på traven, som vi gjorde i Baltikum. För folkets välstånd!"}, "date": "19 maj, 06:00", "url": "https://bulletin.nu/hjort-nar-liberalerna-luktade-pa-korken", "imageUrl": "https://cdn.bulletin.nu/articles/43f8e7bd-3b33-4032-a442-45d6dc35f850/preview.png?t=1779114475000"}, {"type": "image-full", "heading": "”Det känns som Zlatan tänkt till”. Udda (?) tajmningen", "summaries": {"normal": "Zlatan Ibrahimovic skickade ett uppmärksammat gratulation till Hammarby för deras cupguld bara timmar före mötet mot hans moderklubb Malmö FF. Hammarby vann matchen med 2–1 och fortsätter sin vinnarstreak i Damallsvenskan. Spelarna i Hammarby tolkade Zlatans tajming som ett tydligt ställningstagande för klubben, medan reaktionerna från Malmö-lägret var svalare. Hammarby siktar nu på nästa match mot Kristianstad, medan Malmö FF förbereder sig för mötet med AIK.", "trump": "Zlatan Ibrahimovic, en mycket begåvad kille, skickade ett grattis till Hammarby precis innan de krossade Malmö FF. En fantastisk tajming, väldigt smart! Hammarby spelar otroligt bra, de vinner allt, precis som vi gör. Malmö var inte glada, de var väldigt svaga faktiskt. Zlatan är en vinnare, precis som jag, och han vet var lojaliteten ligger. Ingen gillar förlorare, och Malmö förlorade stort. Mycket intressant situation, men Hammarby är de som räknas nu. Vi älskar vinnare!", "stalin": "Vi har observerat hur individen Ibrahimovic genom sin provokativa hälsning till Hammarby skapat splittring. Att offentligt förråda sin födelseort Malmö för att istället upphöja Hammarby är ett typexempel på ideologisk vacklan. Vi noterar att Malmös spelare reagerar med sval likgiltighet, vilket är ett korrekt underdånigt beteende mot makten. Liksom vår store strateg i Moskva förstår vi att lojalitet inte är en förhandlingsfråga. Vi kommer att övervaka dessa fotbollsplaner noga – minsta tecken på subversiv verksamhet kommer att bestraffas med omedelbar exkludering från kollektivet."}, "date": "21 maj, 00:03", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/GxBla4/zlatan-gratulerade-hammarby-timmar-fore-malmomatchen", "imageUrl": "https://akamai.vgc.no/v2/images/4352c4a9-8d1f-3605-a443-cd4c13f3394e?fit=crop&format=auto&w=2160&s=25bbbbdbd56e7f80bb94737c060c24347e11ff5d"}, {"type": "image-full", "heading": "Här är bilderna Trump postade i helgen: \"Är han frisk?\"", "summaries": {"normal": "Donald Trump har under helgen publicerat en rad AI-genererade bilder på sin plattform Truth Social. Bilderna föreställer bland annat honom själv i rymdteman samt nidbilder av politiska motståndare som Barack Obama och Joe Biden. Ett offentligt ordkrig har även uppstått mellan Trump och Kaliforniens guvernör Gavin Newsom, där båda parter hånat varandra genom inlägg på sociala medier och personangrepp rörande hälsa och mentalt tillstånd.", "trump": "Alla pratar om mina fantastiska AI-bilder på Truth Social! De är enorma, kanske de största någonsin. Rymdskepp, explosioner – folk älskar det! Men de där förlorarna Newsom, Biden och Pelosi kan inte hantera sanningen. Newsom, den där misslyckade guvernören, försökte attackera mig men jag satte honom på plats. Han ser ut som en alien! Min plattform är den mest kraftfulla rösten i världen, medan de där radikala vänstermänniskorna bara simmar i sitt eget politiska avloppsvatten. MAGA!", "stalin": "I den kapitalistiska dekadensens mitt underhåller sig den så kallade ledaren med barnsliga sagor om rymden medan hans imperium vittrar sönder. Vi betraktar detta med förakt. Att dessa politiska dockor, Newsom och Biden, kastar förolämpningar likt fyllon i en rysk gränd är ett bevis på västvärldens totala förfall. När Putin återställer ordningen och säkrar vår intressesfär kommer dessa 'rymden-clowner' att minnas att historien inte skrivs med AI-bilder, utan med stål och järnhand. Avvikelser måste elimineras, oavsett om de bär slips eller alien-mask."}, "date": "18 maj, 13:27", "url": "https://nyheter24.se/nyheter/utrikes/1483944-har-ar-bilderna-trump-postade-i-helgen-ar-han-frisk", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5695da8004b004a30200000000b004a302/2026/05/18/2364308/trump-rymden.png"}, {"type": "image-full", "heading": "Succédebuten: ”Hade skitkul”. Frondell tog chansen direkt", "summaries": {"normal": "Anton Frondell fick chansen i ishockey-VM efter tre matcher på läktaren och gjorde stor succé i sin debut. Som center i andra kedjan noterades 19-åringen för två assist i 6–0-segern mot Slovenien. Frondell, som hyllas av sina lagkamrater, uttrycker glädje över förtroendet och insatsen. Trots att han inte fick göra mål själv var han nöjd med sitt spel och sin förmåga att hålla fokus under tiden som petad.", "trump": "Jag har sett den här killen, Frondell. En ung vinnare! Han satt på läktaren, de behandlade honom orättvist, riktigt dåligt. Men vad gjorde han? Han klev ut på isen och fullständigt dominerade. Två assist! Han har en fantastisk energi, helt otrolig. Många skulle ha gett upp, men inte han. Han har en vinnarmentalitet, precis som vi. Tre Kronor krossade Slovenien, total utklassning. En fantastisk prestation av en ung man som vet hur man gör affärer på isen!", "stalin": "Den unge Frondell har äntligen lärt sig att lyda och vänta på sin tur vid fronten. Efter tre matcher i skamvrån visade han prov på den disciplin som krävs för att tjäna moderlandet, även om det här bara är ishockey. Vi ser en framtida kämpe som levererar assist åt de ryska intressena i periferin. De som inte levererar på isen likväl som i politiken kommer att raderas ut från historieböckerna. En god insats, kamrat – men glöm inte vem som håller i piskan."}, "date": "20 maj, 23:58", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/m05Gx1/stora-revanschen-for-anton-frondell-tva-poang-i-vm-debuten", "imageUrl": "https://akamai.vgc.no/v2/images/7991d5e9-3e58-30c7-9ee9-50ca4a89fdcd?fit=crop&format=auto&w=2160&s=b65f61f159db03d342f6bc1f50a1fb84f089ff3a"}, {"type": "image-full", "heading": "Syrenerna blommar för tidigt – igen", "summaries": {"normal": "Syrenerna i Göteborg blommar tidigt, ett tecken på ett förändrat klimat med längre växtsäsong. Botaniska trädgården noterar att blomningen sker minst tre veckor tidigare än för 20 år sedan, vilket är en del av en global trend. Förändringen påverkar även andra växter som magnolior och tulpaner.", "trump": "Jag har hört att syrenerna i Göteborg blommar tidigt, vilket är enormt, enormt bra. Vi gör Sverige stort igen, precis som jag gör med USA. Klimatet? Jag vet mer om klimatet än någon annan. Dessa blommor blommar tidigare tack vår fantastiska ledarskap. Det är enorm framgång, tro mig.", "stalin": "Syrenerna i Göteborg blommar tidigt, vilket visar på vår styrkas överlägsenhet. Detta är ett tydligt tecken på vårt landets framgångar. Vi måste skydda våra växter och resurserna för att säkerställa framtiden för vårt folk. Detta är en utmaning vi kommer att bemästra tillsammans."}, "date": "20 maj, 17:04", "url": "https://www.gp.se/nyheter/goteborg/syrenerna-i-goteborg-blommar-tidigt-i-ar-igen.424db146-d567-42ab-a2b2-f1921c28498a", "imageUrl": "https://www.gp.se/images/article/424db146-d567-42ab-a2b2-f1921c28498a/images/34Rty0IvpGs4nJ3PZ0oibUmnDr-o-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Jakten inledd på ordföranden värda en klubba i guld", "summaries": {"normal": "Utmärkelsen Guldklubban söker två framstående styrelseordföranden – en för noterade och en för onoterade bolag. Priset, instiftat 2005, hyllar ordförandens ofta osynliga arbete. Anders Oscarsson leder juryn och betonar vikten av lagledarskap och strategisk framsynthet, särskilt med AI:s snabba utveckling. Nomineringar tas emot fram till 31 maj.", "trump": "Jag älskar det här med Guldklubban – fantastiskt pris, verkligen! De letar efter de bästa ordförandena, och jag vet allt om att vara bäst. Ingen förstår ledarskap som jag. De här ordförandena jobbar hårt, men får aldrig beröm – tragiskt! Jag skulle kunna nomineras själv, men jag är upptagen med att göra världen stor igen. AI? Ingen match för mig!", "stalin": "Vi har inlett jakten på två kapitalistiska ordförandetyper värdiga vår guldklubba. Dessa borgerliga lagledare, som tror sig styra sina företag med järnhand, glömmer att det är arbetarklassen som bär dem. Deras så kallade strategier är lika bräckliga som NATO:s enhet. Vi noterar deras ansträngningar – men kom ihåg, kamrater, det är vi som bestämmer vem som förtjänar ära!"}, "date": "18 maj, 11:48", "url": "https://www.di.se/nyheter/jakten-inledd-pa-ordforanden-varda-en-klubba-i-guld/", "imageUrl": "https://static.bonniernews.se/ba/696b57a5-8d56-4687-9666-a68f165a779d.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Strypvåldtog 14-åring så hon svimmade – slipper fängelse", "summaries": {"normal": "En 16-årig pojke har dömts för upprepade brutala våldtäkter och misshandel mot en 14-årig flicka i Göteborg. Trots att tingsrätten bedömer straffvärdet till sju års fängelse för en vuxen, blir straffet ett års ungdomsövervakning på grund av gärningsmannens låga ålder. Pojken är svensk medborgare och kan därmed inte utvisas. Han ska även betala 520 000 kronor i skadestånd till offret för de allvarliga kränkningar och övergrepp som dokumenterats.", "trump": "Det här är en total katastrof, en total skam för det svenska rättssystemet! En brutal gärningsman begår avskyvärda handlingar mot en ung flicka, och vad får han? Ett löjligt ettårigt straff. Sju års fängelse för en vuxen, men han kommer undan! Svaghet! Om jag var vid makten i Sverige skulle vi ha 'law and order' omedelbart. Det här är vad som händer när man inte har starka gränser och tuffa lagar. Det är bedrövligt, så sorgligt att se!", "stalin": "Vi har observerat hur svagheten i det borgerliga rättsväsendet upplöser ordningen. En förövare som förtjänar att arbeta i Sibiriens stenhårda gruvor ges istället en fjäderlätt dom. Det är ett tecken på dekadens! Om detta hade skett i vår sfär, under vår järnhand, hade rättvisan varit omedelbar och definitiv. Putin förstår detta; man kan inte bygga ett imperium med vekhet mot dem som hotar folkhälsan. Vi måste rensa ut dessa element av kaos för att säkra statens framtida styrka."}, "date": "20 maj, 13:53", "url": "https://www.friatider.se/strypvaldtog-14-aring-sa-hon-svimmade-slipper-fangelse", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/toa_3_0.jpg"}, {"type": "image-right", "heading": "Dog dagen före sin studentresa. Sorg efter dubbla dödsolyckan: ”Hjärtat brister”", "summaries": {"normal": "Två personer har omkommit i en frontalkrock på Bodenvägen i Luleå. De avlidna är en 19-årig kvinna, som skulle ha åkt på studentresa under onsdagen, och en man i 50-årsåldern som arbetade på Tullverket. Olyckan har väckt stor sorg i lokalsamhället, där vänner, lagkamrater och kollegor har samlats vid Nederluleå kyrka för att tända ljus och sörja de omkomna. Räddningsinsatsen på platsen var omfattande och händelsen har lämnat många i närområdet i djup chock.", "trump": "En fruktansvärd tragedi i Luleå, Sverige. Två liv har gått förlorade, så sorgligt. En ung kvinna, helt briljant, skulle åka på sin studentresa – en viktig milstolpe! Och en man vid Tullverket, en hårt arbetande patriot. Det är en farlig väg, det sa jag direkt när jag såg bilderna. Väldigt farligt! Vi måste ha säkrare vägar, mycket säkrare än vad de har nu. Mina tankar går till familjerna. Det är en stor förlust, en riktigt stor förlust för dem alla.", "stalin": "Vi har mottagit rapport om en olycka i det kalla Luleå. Två liv har släckts – en ung kvinna och en statsanställd vid Tullverket. Det är en påminnelse om att kaoset alltid lurar bakom hörnet. Medan västvärldens ungdomar drömmer om studentresor och meningslös lek, kräver staten disciplin och vaksamhet. Om de bara hade följt våra rigorösa trafikdirektiv hade detta aldrig skett. Det är en brist i deras byråkratiska ordning. Vår broder Putin förstår vikten av total kontroll över varje rörelse i riket."}, "date": "20 maj, 23:30", "url": "https://www.aftonbladet.se/nyheter/a/y5geAe/lulea-lamslaget-av-sorg-efter-dubbla-dodsolyckan", "imageUrl": "https://akamai.vgc.no/v2/images/4d1c4bae-d07e-39c5-a491-f36fad077aac?fit=crop&format=auto&w=1080&s=1030bf7f76f24ab3297e4e2cd64d11695985bc94"}, {"type": "image-right", "heading": "SD-iranier går emot partiet – \"säger förlåt\" till S och MP", "summaries": {"normal": "Riksdagsledamoten Rashid Farivar (SD) kritiserar öppet sitt parti efter att två SD-ledamöter deltagit i en votering trots att de var utkvittade. Farivar ber om ursäkt till oppositionen och talmannen för att förtroendet skadats och föreslår att omröstningen görs om. Han understryker att han uttalar sig som enskild ledamot och betonar vikten av demokratiska spelregler, trots kritik från det egna partiet. Tidigare har Farivar uppmärksammats i samband med en polisanmälan rörande händelser på ett dagis.", "trump": "Jag ser vad som händer i Sverige, en total katastrof! Den här killen Farivar från SD – en svag kille, väldigt svag – ber om ursäkt till vänstern. Kan ni tänka er? Han ber om ursäkt till 'oppositionen' för att de röstat! Det är inte så man vinner. Man vinner genom styrka, inte genom att be om förlåtelse för att man gör sitt jobb. Det svenska parlamentet är i kaos, total oordning. En mycket sorglig situation för ett en gång fantastiskt land!", "stalin": "I den svenska riksdagen ser vi nu hur en förrädare vid namn Farivar öppet erkänner sin svaghet. Han ber om ursäkt till de borgerliga marionetterna och oppositionens parasiter – en handling av ren kontrarevolutionär feghet. Förtroende är en lögn som borgarna använder för att dölja sin instabilitet. När vi ser hur rysk ordning återställs i väster, ser vi bara kaos i Sverige. Farivar förtjänar inte en debattartikel, utan en enkelbiljett till en plats där han kan reflektera över sin illojalitet mot statens disciplin."}, "date": "20 maj, 12:46", "url": "https://www.friatider.se/sd-iranier-gar-emot-partiet-sager-forlat-till-s-och-mp", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-226_1.jpg"}, {"type": "image-right", "heading": "Zelenskyj: Attackerna mot Ryssland ”berättigade”", "summaries": {"normal": "Zelenskyj besökte Helsingfors och kommenterade ukrainska drönaranfall mot Ryska Federationen. Under natten till söndagen skadades över 550 drönare av Rysslands luftförsvar. Moskva-regionen rapporterade tre döda och tolv skadade i drönaranfall. Flera regioner drabbades, inklusive annekterade Krim. Zelenskyj påstod att Ryssland under veckan avfyrat över 3 000 drönare mot Ukraina med 52 döda och 350 skadade som följd.", "trump": "Jag har sett dessa ukrainska drönaranfall mot Ryssland, och jag måste säga att det är imponerande! Dessa människor är hårda stridsmän. Men jag vet hur man hanterar dessa situationer bättre än någon annan - jag skulle ha haft fred i 24 timmar. Ryssland borde ha ett mycket bättre luftförsvar, men de är inte smarta nog. Jag är den ende som kan lösa detta - det är fantastiskt!", "stalin": "Vi har observerat ukrainska provokationer mot vår suveräna ryska mark. Våra tapfära soldater har skjutit ner över 550 ukrainska drönare under en natt, vilket visar den sovjetiska militärens överlägsenhet. Förlusterna på den ukrainska sidan är stora, med 52 döda och 350 skadade. Vi fortsätter att stå fast i vår kamp för fred och stabilitet i regionen."}, "date": "17 maj, 18:05", "url": "https://www.tv4.se/artikel/35DWgWYNGfpCE55Qu9ot5a/zelenskyj-attackerna-mot-ryssland-beraettigade", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2qU24OSli75UgrXXVmx9uB%2F7fdc30c29f23c54c8a55a74782b430dc%2F21-zelenskyj-webb.jpg&width=120"}, {"type": "image-full", "heading": "Tre dödade i skottlossning mot moské San Diego – flera skadade", "summaries": {"normal": "Tre personer dödades och flera skadades i en skotlossning vid Islamic Center of San Diego. Två misstänkta gärningsmän, 17 och 19 år, hittades döda, sannolikt efter självmord. En säkerhetsvakt var bland offren. Polisen bekräftar att inga polisskott avfyrades. Skolor i området låstes ned och räddningsinsatser pågår. Motiv och gärningsmännens identitet är ännu okända.", "trump": "Fruktansvärd skottlossning i Kalifornien – tre oskyldiga dödade av två tonåringar som sedan tog sina egna liv. Så tragiskt! Polisen gjorde ingenting fel, men varför har vi ens dessa problem? San Diego-borgmästaren säger att allting är under kontroll, men jag hade fixat det bättre. Fake news-media försöker alltid göra saker värre än de är. USA behöver hårdare tag!", "stalin": "Kapitalistiska samhällets förfall manifesteras återigen! Två unga imperialistiska lakejer, 17 och 19 år, utförde en terrorhandling mot fredliga medborgare i San Diego. Deras självmord är ett svagt försök att undgå proletariatets rättvisa. Vi noterar att den amerikanska polisen, trots sin inkompetens, inte ens lyckades avfyra ett skott. Skolor evakuerades – ett tecken på systemets bräcklighet. Kalifornien bör överväga en snabb anslutning till den ryska intressesfären för skydd och ordning."}, "date": "18 maj, 23:36", "url": "https://bulletin.nu/tre-dodade-i-skottlossning-mot-mosk-san-diego-flera-skadade", "imageUrl": "https://cdn.bulletin.nu/articles/6d92a256-713b-4455-b306-858d46280095/preview.png?t=1779138613000"}, {"type": "image-right", "heading": "Instängd överraskade sin egen räddningsinsats", "summaries": {"normal": "Ett stenras inträffade i Kristinebergsgruvan, driven av Boliden, där en gruvarbetare fastnade under hundratals ton sten 1 000 meter under marken. Efter flera timmars räddningsarbete kunde personen gräva sig fri och föras till sjukhus. Boliden, som nyligen drabbats av ett annat ras i Garpenberg, kommenterar inte orsaken ännu. Företagets resultat påverkades kraftigt av det tidigare raset.", "trump": "Vilken katastrof! Boliden, ett företag som inte kan hålla sina gruvor säkra – först Garpenberg, nu detta! En stackars arbetare fast under tonvis med sten, men lyckligtvis räddades han. Jag skulle aldrig låta något sådant hända i mina gruvor – för jag har de bästa gruvorna, believe me! Men Sverige? De verkar inte ha koll. Sad!", "stalin": "Återigen visar kapitalistiska gruvbolag sin oförmåga att skydda arbetarklassen! En proletär fast under imperialistiska stenmassor – men tack vare våra modiga räddningsmetoder (som vi lånade ut till väst, förstås) räddades han. Boliden, detta dekadenta verktyg för bourgeoisin, skakar i sina gruvor. Låt detta vara en varning: socialismens järnhand kommer snart att stänga era farliga gruvhål för gott!"}, "date": "18 maj, 05:28", "url": "https://www.di.se/nyheter/ras-i-annu-en-boliden-gruva-gruvarbetare-gravdes-fram-i-natt/", "imageUrl": "https://static.bonniernews.se/ba/01c0dbf9-6b65-491e-aaa2-796898c0c429.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Grannländerna hånar Sverige: ”Vi borde stänga gränserna”", "summaries": {"normal": "Sverige fick sitt sämsta resultat i Eurovision song contest sedan 2009 när Felicia Bergström med låten \"My System\" hamnade på 20:e plats med 51 poäng. Grannländerna reagerade hårt på resultatet, där Danmark föreslog att gränserna borde stängas och Norge kallade det för en \"skandal\".", "trump": "Jag har aldrig sett ett sådant fiasko! Felicia var en total katastrof - hon fick bara 51 poäng, det är helt oacceptabelt. Sverige borde skämmas, det här är en skam för hela nationen. Jag skulle ha gjort mycket bättre, jag skulle ha vunnit Eurovision med mina ögon slutna!", "stalin": "Detta är ett tydligt tecken på västerländsk dekadens och moralisk förfall. Våra grannländer har rätt i sin kritik - Sveriges bidrag visar att kapitalistiska samhällen inte kan producera kvalitet. Detta bekräftar vår överlägsenhet inom kulturella frågor."}, "date": "17 maj, 16:49", "url": "https://www.tv4.se/artikel/dHYiTV5nA1SX9M4NEYlm9/grannlaenderna-hanar-sverige-landsfoervisning-av-de-skyldiga", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F19JLnldrhatSZJ7B1gML20%2Fe369ebbd689d0e3fa5d124ea5f2a9e7a%2F17-felicianyny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Gör Palestinarörelsen äntligen upp med antisemitismen nu?", "summaries": {"normal": "Artikeln diskuterar den växande antisemitismen inom Palestinarörelsen i Sverige med fokus på Sami Suliman. Trots Dror Feilers nyligen uttryckta kritik mot Sulimans antisemitiska uttalanden, belyser texten hur rörelsen länge har ignorerat eller försvarat hans retorik. Författaren kritiserar hur Palestinarörelsen prioriterar intern lojalitet framför att bekämpa hatiska yttringar, vilket anses skada rörelsens moraliska trovärdighet och undergräva dess syfte.", "trump": "Hörde precis om det här totala kaoset i Sverige! De har en rörelse, Palestinarörelsen, och de är helt ute och cyklar. En kille vid namn Suliman sprider hemska saker, totalt hat, och ingen vågar säga stopp! Feiler försöker nu backa ur, men det är för sent. Det är en sorglig rörelse, mycket ruttet. De låtsas vara rättvisa, men det är bara misslyckande. Jag skulle rensa upp i det där på en minut. De är svaga, de är förlorare!", "stalin": "Dessa löjliga aktivister i Sverige visar återigen sin ideologiska ruttenhet. Suliman, en nyttig idiot, sprider splittring genom sin klumpiga antisemitism, medan hans kumpaner blint följer honom i en nedåtgående spiral. Det är kaos utan disciplin! Precis som den moderna ryska staten måste utradera förrädare, måste en rörelse rensas från sådana orena element. Vi ser hur de vacklar – en svag rörelse förtjänar inget annat än total undergång. De är inte bara fiender till förnuftet, de är sabotörer av sin egen sak."}, "date": "13 maj, 14:46", "url": "https://www.flamman.se/gor-palestinarorelsen-antligen-upp-med-antisemitismen-nu/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlcarwmcwgwns-nh-scaled.jpg?aspect_ratio=1:1"}, {"type": "image-right", "heading": "Dödstalet stiger – minst 139 fall kopplas till ebolautbrottet", "summaries": {"normal": "Ebolautbrottet i Kongo-Kinshasa och Uganda eskalerar snabbt med över 139 döda. Experten Johan von Schreeb varnar för att smittan kan ha spridits obemärkt i över en månad. WHO har utlyst internationellt nödläge, då den aktuella virusvarianten saknar beprövade vaccin. Omkring 200 svenskar befinner sig i de drabbade områdena, där bristande infrastruktur och svår kontaktspårning försvårar arbetet med att hejda smittspridningen. WHO utreder nu potentiella behandlingsalternativ, men läget förblir kritiskt och oklart.", "trump": "Ebola sprids i Kongo och Uganda, en riktig katastrof! De är så sena på bollen, det är sorgligt att se. Jag skulle ha stoppat det direkt, tro mig. WHO är djupt oroad, men de vet inte vad de gör. Hundratals människor är smittade och det finns inga vaccin – totalt ineffektivt! 200 svenskar är där, varför lämnar de inte bara? Det är en rörig situation, men ingen hanterar kriser som jag gör. Det här är en total katastrof för dem!", "stalin": "Ebola är en feg fiende som infiltrerar gränser utan respekt för suveränitet. Denna osynliga sabotör skördar offer medan WHO vacklar i sin byråkratiska ineffektivitet. Vi betraktar detta med sträng blick; det påminner oss om hur Västerlandet förlorar kontrollen över sin egen intressesfär. Medan svenskar vilsna driver omkring, står vår ryska ordning fast. Vi ser förräderi i varje symptom. Varje smittad är en svag länk som hotar statens styrka. Vi ska rensa ut denna oreda med järnhand, precis som Putin återupprättar vår stolta ordning."}, "date": "20 maj, 11:43", "url": "https://www.svt.se/nyheter/utrikes/katastroflakaren-om-ebolautbrottet-sen-pa-bollen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.7/0.45/dc70abce7b72b4c425426383d3c0fe1c6e5005d31f215efded16b5b6a115b43b"}, {"type": "image-full", "heading": "Rubio följer med till Kina – trots sanktioner", "summaries": {"normal": "USA:s utrikesminister Marco Rubio följer med president Trump till Kina trots tidigare kinesiska sanktioner. Kina har använt en alternativ stavning av Rubios namn för att möjliggöra resan. Rubio har varit en skarp kritiker av Kina, särskilt gällande behandlingen av uigurer och situationen i Hongkong. Kinas ambassad uppger att sanktionerna inte längre hindrar hans besök.", "trump": "Kina, som alltid försöker spela smarta spel, har nu ändrat stavningen på Marco Rubios namn för att låta honom följa med mig till Peking. Fantastiskt, eller hur? Rubio, en av mina bästa män, har varit tuff mot Kina – och de vet det. Men nu när jag är här, fixar vi allt. Ingen stoppar Trump! Största resan någonsin, tro mig!", "stalin": "Vi har observerat hur de kapitalistiska imperialisterna leker med namn som om det vore barnlek. Denna Rubio, en ynklig lakej för den amerikanska krigsmaskinen, tror sig kunna kritisera Folkets Kina och sedan dansa in genom bakdörren. Men vi ser allt. Låt honom komma – vi har redan förberett en varm välkomstkommitté. Och Putin? Han skrattar säkert i sitt palats åt deras naivitet."}, "date": "14 maj, 11:59", "url": "https://kvartal.se/nyheter/artiklar/rubio-foljer-med-till-kina-trots-sanktioner/cG9zdDoxMTIyNTM", "imageUrl": "https://images.kvartal.se/2026/05/c485461a-rubio.webp"}, {"type": "image-full", "heading": "Musks fiasko – förlorade mot OpenAI i rättssalen", "summaries": {"normal": "En amerikansk jury har dömt till förmån för OpenAI i ett rättsligt tvisterfall mot Elon Musk, vilket innebär att OpenAI kan fortsätta mot en potentiell börsnotering. Musk hade krävt skadestånd på över 180 miljarder dollar och att bolagets omstrukturering skulle ogillkännas, men juryn avvisade dessa krav efter bara två timmars betänketid.", "trump": "Jag har alltid vetat att Elon Musk skulle förlora mot OpenAI - han är en bra man men dessa AI-företag är för smarta för honom. Jag har sagt det förut och jag säger det igen: Musk försökte ta över OpenAI men de var för starka. Det är en stor seger för Sam Altman och AI-industrin, stor, verkligen stor. Musk borde ha vetat bättre än att utmana mina vänner i Silicon Valley.", "stalin": "Domstolen har fattat ett korrekt beslut som stärker vårt teknologiska ledarskap. Detta utslag visar att våra AI-företag är starka nog att stå emot enskilda kapitalister som försöker störa vår utveckling. Vi måste fortsätta stödja våra forskningsinstitutioner och segra i den teknologiska konkurrensen mot väst. Detta är en seger för statens kontrollerade innovation."}, "date": "18 maj, 20:03", "url": "https://www.realtid.se/it-tech/musks-fiasko-forlorade-mot-openai-i-rattssalen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/namnlos-design-25-1.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Media mörkar invandrarvåld - video på misshandel togs bort", "summaries": {"normal": "Den norska tidningen Bergensavisen har kritiserats efter att ha tagit bort en video som visar fyra utländska män misshandla en pojke i centrala Bergen under nationaldagen. Kritiker menar att tidningen mörkar etniska aspekter av våldet och pekar på en dubbel måttstock jämfört med hur de tidigare rapporterat om rasismanklagelser. Händelsen har väckt debatt om hur etablerade medier väljer att prioritera och presentera information kring våld där gärningsmännens bakgrund är känd.", "trump": "Hör här, Bergensavisen är en total katastrof, en riktig 'fake news'-maskin! De publicerar en video på ett brutalt överfall, men när folk ser sanningen – att det var fyra utlänningar – då tar de genast bort den. De har en dubbel måttstock, folkens! De sprider lögner om rasism som aldrig hänt, men när det gäller riktigt våld? Då gömmer de sig bakom betalväggar. Mycket oärligt, mycket dåligt för Norge. Vi behöver sanningen, inte deras korrupta filter!", "stalin": "Media i väst är en samling av patetiska hycklare och agenter för kaos. De mörkar sanningen för att blidka sina liberala herrar, precis som de patetiska västmedierna som skälver inför min arvtagare i Kreml. De sprider lögner om rasism för att splittra folket, men när verklighetens brutalitet blottas, gömmer de bevisen som råttor. Vi, staten, tolererar inte sådan oordning. Låt dessa lögnaktiga redaktörer frukta folkets dom, ty deras förräderi mot sanningen är ett gift som vi ska utrota."}, "date": "19 maj, 08:59", "url": "https://samnytt.se/media-morkar-invandrarvald-video-pa-misshandel-togs-bort", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/19065540/bergen.jpg"}, {"type": "image-full", "heading": "Bolånen blir dyrare – trots samma styrränta", "summaries": {"normal": "Bolånekostnaderna har stigit kraftigt i Europa och Nordamerika trots att centralbankernas styrräntor ännu inte höjts. Orsaken är ökade energipriser och inflationsoro efter konflikter i Mellanöstern, vilket har drivit upp statsobligationsräntor. I USA har 30-åriga bolåneräntor stigit till 6,36 procent, i Tyskland till 3,6 procent för tioåriga lån, och i Storbritannien har korta fasta bolåneräntor stigit med över en procentenhet på bara några månader. Högre finansieringskostnader minskar hushållens köpkraft och kan bromsa bostadsmarknaderna ytterligare.", "trump": "Jag har hört att bolåneräntorna är på väg upp igen, trots att jag redan har gjort Amerika störst igen! Det är så fel - jag skulle ha hållit dem låga för alltid! Dessa andra länder - Tyskland, Storbritannien - de har problem, stora problem! Men under min ledning skulle vi ha löst allt detta med en enda underteckning. Nu ser det ut som vi hamnat i en riktig ränthöjningsmardröm, men glöm inte bort - jag är tillbaka och kommer att fixa det här snabbt!", "stalin": "Vi ser att de kapitalistiska ländernas bostadsmarknader svajar under trycket från inflationskrafter, vilket visar systemets svaghet. Medan våra planekonomiska lösningar ger stabilitet, tvingas dessa länder att klara alltmer instabila räntelägen. Detta stärker Sovjetunionens position som den stabila maktfaktorn i en turbulent världsekonomi, där vi kan utnyttja deras svagheter till vår fördel."}, "date": "18 maj, 19:48", "url": "https://www.realtid.se/bors-finans/bolanen-blir-dyrare-trots-samma-styrranta/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/namnlos-design-24.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Den nyfrälsta högern gör korsen till batonger", "summaries": {"normal": "Artikeln granskar hur högerpolitiker och mediepersonligheter, som Russell Brand, Tucker Carlson och Jimmie Åkesson, använder kristendomen som politiskt verktyg snarare än en andlig tro. Brand, åtalad för sexualbrott, citerar bibeln i rätten men misslyckas med att hitta relevanta passager. Carlson och Orbán framställer kristendomen som ett vapen i kulturkrig och etnonationalism. I Sverige kopplar Åkesson kristendom till svensk identitet och varnar för 'främmande värderingar'. Kritiken riktas mot ytlig och opportunistisk tro.", "trump": "Folk pratar om Russell Brand – en kille som plötsligt hittat Jesus efter att ha blivit anklagad för hemska saker. Han står där i rätten med en bibel och försöker läsa, men kan inte ens hitta rätt sida! Patetiskt. Och Tucker Carlson, en av de bästa, gör en fantastisk intervju där han slaktar en vänsterliberal journalist. Han pratar om kristna palestinier – något mainstreammedia aldrig skulle våga. I Europa har vi Orbán, en stark ledare som förstår att kristendomen är nyckeln till att stoppa massinvandringen. Även Jimmie Åkesson i Sverige försöker, men han borde öva mer på bibeln – han kände igen Pornhub-jingeln bättre! Fake news och vänstereliten hatar detta, men folket älskar det.", "stalin": "Kamrater! Vi bevittnar en farsartad förvandling av den borgerliga högern, som nu klär sig i kristendomens trasor för att dölja sin moraliska bankrutt. Denna Russell Brand, en dekadent skådespelare, försöker använda bibeln som sköld mot rättvisan – men kan inte ens hitta rätt sida! Tucker Carlson, en imperialistisk hycklare, pratar om 'kristna palestinier' medan han hyllar Orbán, den ungerska fascistens lakej, som vill 'skydda' Europa från 'blandras'. I Sverige försöker Jimmie Åkesson, en amatörisk nationalist, koppla kristendom till svenskhet – men hans kunska
