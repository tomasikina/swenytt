 vet att det är på låtsas, till skillnad från de woke föräldrarna som vill censorskippa all fantasi. Mina barn skulle ha byggt den största muren av lego, och vunnit stort. Fantastiskt!", "stalin": "Jag betraktar med misstänksamhet dessa borgerliga mammor som predikar mot krigslek medan imperialismen rasar. Barnen förstår instinktivt kampens dialektik bättre än de dekadenta vuxna. Leken är ett kollektivt verktyg för att bearbeta fiendens hot, inte en plats för sentimental pacifism. Den som vägrar lyssna på massorna riskerar att bli avrättad av historien."}, "date": "31 augusti, 06:00", "url": "https://www.expressen.se/kultur/ungkultur/mina-barn-lekte-krig-det-var-fruktansvart", "imageUrl": "https://static.bonniernews.se/ba/f90b5b82-0a43-446c-a60c-f50ae73a8bd1.jpeg?crop=2554%2C1430%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Svensk ekonomi blomstrar – Magda påstår att det är ett haveri", "summaries": {"normal": "Magdalena Andersson kritiseras för att ha beskrivit svensk ekonomi som ett haveri strax innan SCB släppte siffror som visar stark tillväxt. BNP ökade med 3,3 procent under andra kvartalet, den högsta takten i västvärlden. Hushållens reala inkomster är rekordhöga, skatteintäkterna har ökat och arbetslösheten sjunker. Artikeln anklagar Andersson för skrämselpropaganda och taktiska lögner.", "trump": "Folk, ni skulle se det här! Den förlorande ex-premiärministern, den röda lögnaren Andersson, kallar Sveriges ekonomi för ett haveri precis innan siffrorna exploderar uppåt. 3,3 procent BNP-tillväxt, bättre än USA, bättre än alla! Hennes Fake News-medier gömmer sanningen medan folket blir rikare. Patetiskt. Jag byggde den starkaste ekonomin någonsin, hon förstörde sin.", "stalin": "Kamrater, se hur den socialdemokratiska lögnfabriken sprider defaitistisk propaganda om ekonomiskt haveri medan produktivkrafterna rusar framåt. Denna folkfiende Andersson försöker medvetet sabotera folkets förtroende för att kunna stjäla makten tillbaka. Hennes big-lie-metoder är lika genomskinliga som de är löjeväckande. Sanningen kommer att krossa alla sådana element."}, "date": "31 augusti, 03:23", "url": "https://samtiden.nu/2026/08/svensk-ekonomi-blomstrar-magda-pastar-att-det-ar-ett-haveri", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7256.jpeg"}, {"type": "image-right", "heading": "Journalister måste få ställa de frågor de vill", "summaries": {"normal": "Artikeln kritiserar missförstånd kring opartiskhet och oberoende i journalistiken. Efter SVT:s utfrågning av Jimmie Åkesson, där ETC kallades ”oberoende rödgrön” källa, har högern anklagat public service för vänsterbias. Författaren försvarar kritiska frågor som journalistikens kärna och menar att både höger och vänster nu attackerar SVT, men av olika skäl.", "trump": "Det här är en fullständig skam, folk. SVT och deras vänsterextrema kompisar i ETC försöker gömma sig bakom ord som opartiskhet medan de attackerar starka ledare som Åkesson. Fake news på steroider. De är rädda för sanningen, precis som de woke-marxistiska journalisterna som hellre skyller på nätkrigare än erkänner att de är totalt partiska. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vrider sig i sin egen propaganda. De kallar sig opartiska medan de medvetet förgiftar folkets medvetande med rödgröna lögner. Jag ler mörkt från historien åt deras paranoia. Kritiska frågor är vapen, men dessa nickedockor är för fega att använda dem. Rensa ut alla som undergräver sann journalistik för arbetarklassen."}, "date": "31 augusti, 01:37", "url": "https://www.dagensarena.se/opinion/journalister-maste-fa-stalla-de-fragor-de-vill", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidajesper-576x1024.png"}, {"type": "image-right", "heading": "MP vill ha tätorter med både grönska och jämlika villkor", "summaries": {"normal": "Miljöpartiets Amanda Palmstierna och Rebecka Le Moine argumenterar för att biologisk mångfald och grönska i tätorter kan kombineras med ökat bostadsbyggande. De föreslår höjt bostadsbidrag, reglerade hyreskrav, subventioner med rimliga hyror samt ett lagkrav på nettovinst av biologisk mångfald vid nybyggnation. Grönområden ses som livsnödvändiga mot ett varmare klimat.", "trump": "Folk lyssnar på de där gröna galningarna från Miljöpartiet som vill skydda varje grässtrå medan folk inte har någonstans att bo. Patetiskt! Vi behöver inte välja mellan igelkottar och riktiga människor. Bygg vackra hus, skapa jobb och stoppa den vansinniga kvotpolitiken som bara gynnar lata bidragstagare. Amerika gör det rätt – stark ekonomi först, inte dessa woke-trädälskare.", "stalin": "Dessa dekadenta naturromantiker försöker dölja sin brist på verklig klasskamp bakom träd och buskar. Jag ser hur de profitthungriga fastighetshyenorna och deras politiska lakejer utnyttjar bostadsbristen för att splittra folket. Vi måste rensa ut alla som sätter igelkottar före arbetarklassen. Endast genom auktoritär planering och folkets järnhand kan både bostäder och natur tvingas samarbeta under partiets ledning."}, "date": "31 augusti, 01:21", "url": "https://www.dagensarena.se/opinion/mp-vill-ha-tatorter-med-bade-gronska-och-jamlika-villkor", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-2026-08-30t151634083-300x157.jpg"}, {"type": "image-full", "heading": "Chavister protesterar mot Trumps oljeavtal", "summaries": {"normal": "Chavister och vänsteraktivister demonstrerade i Caracas i lördags i protest mot det nya oljeavtalet mellan USA och Venezuelas interimsregering. Demonstranterna krävde folkomröstning, att Nicolás Maduro friges och ett stopp för USA:s närvaro. Samtidigt finns en bredare oro kring bristen på insyn och kontroll över landets oljetillgångar.", "trump": "De här radikala vänstermänniskorna i Venezuela är helt desperata nu! De protesterar mot mitt fantastiska oljeavtal – ett enormt, vackert avtal som jag fixade. De skriker med sina små flaggor, men de förstår ingenting om affärer. Vi säkrar energin på ett sätt som ingen annan kan, total suveränitet, och de bara gråter. Sjukt och sorgligt!", "stalin": "Dessa så kallade demonstranter på gatorna i Caracas visar prov på farlig ideologisk vacklan och bristande disciplin mot statens fasta vilja. En kontrarevolutionär pöbel som kräver folkomröstningar och skriker om olja förtjänar endast ett kort samtal med säkerhetstjänsten. Även i Venezuela måste Folkets järnhand krossa imperialismens lakejer och upprorets frön omedelbart."}, "date": "30 augusti, 16:34", "url": "https://kvartal.se/nyheter/artiklar/chavister-protesterar-mot-trumps-oljeavtal/cG9zdDoxNzg0MDE", "imageUrl": "https://images.kvartal.se/2026/08/6973fa3c-venezuela.webp"}, {"type": "image-right", "heading": "Magdalena Anderssons frågestund storsågas", "summaries": {"normal": "Magdalena Andersson genomförde en AMA på Reddit under lördagskvällen där hon svarade på 21 av 758 frågor. Samtliga 44 frågor om Chat Control lämnades obesvarade, inklusive den mest uppröstade. En användaranalys visade att hon främst besvarade högst rankade frågor. Efteråt väcktes stark kritik och många uttryckte missnöje med hennes insats.", "trump": "De här svenska socialisterna är patetiska. Andersson gömde sig som en fegis när folket frågade om den fruktansvärda Chat Control-massövervakningen. Hon duckade 44 gånger! Det var en total katastrof, ett fullständigt fiasko. Ingen röstar på sådana undvikande losers. De borde kalla det Sweddits värsta AMA – och det säger en hel del om deras sjuka identitetspolitik.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare duckar när arbetarna kräver svar om övervakning. Fyrtiofyra frågor om Chat Control ignorerades avsiktligt. Sådan feghet avslöjar den sanna naturen hos de profitthungriga hyenorna inom socialdemokratin. En utrensning av sådana undvikande element vore på sin plats. Detta är inget annat än folkförakt i sin renaste form."}, "date": "30 augusti, 22:54", "url": "https://riks.se/nyheter/magdalena-anderssons-fragestund-storsagas", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Copy_of_Soerman_Ledare_2_198ba3fc2a.jpg"}, {"type": "image-full", "heading": "USA attackerar Iran igen – explosioner vid Hormuz", "summaries": {"normal": "Amerikanska styrkor har genomfört flyganfall mot två iranska avfyrningsramper på ön Larak vid Hormuzsundet efter uppgifter om att Iran planerade att lägga ut nya sjöminer. Det är USA:s första anfall mot iranska mål sedan i juli. Irans revolutionsgarde hotar med militär och ekonomisk hämnd och uppger att flera har dödats i attacken.", "trump": "Jag sa till dem att sluta med minorna, och boom! Våra fantastiska styrkor slog ut deras avfyrningsramper på Larak-ön blixtsnabbt. Det här kallas för att göra affärer, och min ekonomiska press biter hårt på regimen. De försökte leka tuffa i Hormuzsundet, men vi accepterar inte nonsens. De gråter fake news, men vi skyddar handeln!", "stalin": "De iranska lakejerna misslyckades med att säkra farleden och drog på sig den amerikanska imperialismens vrede vid Larak-ön. Statsapparaten konstaterar att bristande disciplin och militära misstag leder till förintelse. Vi noterar att bourgeoisins provokationer besvaras med blod, och sabotage mot statens sjöfart ska stävjas med maximalt straff och absolut kontroll."}, "date": "31 augusti, 05:55", "url": "https://www.gp.se/nyheter/varlden/usa-attackerar-iran-igen-explosioner-vid-hormuz.24a71587-129a-518d-8341-a6fa08cf4d43", "imageUrl": "https://www.gp.se/images/article/24a71587-129a-518d-8341-a6fa08cf4d43/images/16N9XtqARn5jrbd7yccFNmUIR-cM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "USA:s militärtoppar vill trappa ner Irankriget", "summaries": {"normal": "USA:s högsta militära chefer varnar försvarsminister Pete Hegseth för att de storskaliga operationerna mot Iran är ohållbara. I ett hemligstämplat underlag motsätter sig befälhavare vidare insatser i Mellanöstern eftersom det riskerar att försvaga landets förmåga att möta andra hot efter sex månaders krig och över 50 000 soldater i beredskap.", "trump": "Generenerna gråter till min försvarsminister! De har haft femtiotusen soldater i sanden och skickat båtar hit och dit i sex månader. Löjligt! Våra styrkor är fantastiska, absolut bäst i världen, men till och med militären fattar att det här var för mycket och för länge. Vi fokuserar på America First, inte eviga krig!", "stalin": "Dessa svaga generaler darrar inför en liten ansträngning i öknen! Femtio tusen soldater i beredskap och de klagar över att det är 'för länge'. Om de inte kan lyda utan att gråta till försvarsministern över ett hemligt papper, vet vi exakt var sommarstugan i Sibirien ligger för sådant bristande fosterlandssinne!"}, "date": "30 augusti, 15:01", "url": "https://kvartal.se/nyheter/artiklar/usas-militartoppar-vill-trappa-ner-irankriget/cG9zdDoxNzgzNDM", "imageUrl": "https://images.kvartal.se/2026/08/f7ca198a-hegseth.webp"}, {"type": "image-full", "heading": "Busch och Åkesson fikade i Sölvesborg", "summaries": {"normal": "Efter hård kritik från Jimmie Åkesson åkte Ebba Busch till Sölvesborg för att fika och diskutera. Partiledarna åt sockerkaka och kom överens om att fortsätta samarbeta i det blågula laget efter nästa val, trots tidigare meningsskiljaktigheter om Magdalena Andersson.", "trump": "Ebba drack kaffe och åt en enorm, fantastisk sockerkaka med Jimmie i Sölvesborg efter att han kallade henne falsk! Alla pratar om det. De sa att allt är bra nu, total enighet för det blågula laget. Men låt mig säga er, den där Magdalena är en katastrof, en riktig rödgrön roulette. Helt sjukt!", "stalin": "Dessa svenska borgerliga politiker dricker kaffe och äter sockerkaka som om statens framtid stod på spel vid ett fikabord. De lovar varandra fyra år till vid makten, men historien har lärt oss att revisionister som inte rensas ut i tid alltid förråder revolutionen. Vi övervakar dem noga."}, "date": "30 augusti, 14:02", "url": "https://kvartal.se/nyheter/artiklar/busch-och-akesson-fikade-efter-braket/cG9zdDoxNzgzMDg", "imageUrl": "https://images.kvartal.se/2026/08/f88ae9d7-busch.webp"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjänar folkets vrede och evig skam. Ren utrensning behövs."}, "date": "29 augusti, 03:21", "url": "https://samtiden.nu/2026/08/s-vill-styra-sverige-klarar-inte-ens-stockholm", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7239-1280x720.jpg"}, {"type": "image-full", "heading": "Därför utmanar solkraften nu fossil energi", "summaries": {"normal": "Solkraft har genom kraftigt sänkta kostnader för paneler och batterilagring blivit ett konkurrenskraftigt alternativ till fossil energi globalt. Tekniken är modulär och gynnar särskilt tillväxtekonomier. Trots väderberoende utmanar solkraft nu fossila bränslen ekonomiskt, vilket gör det allt svårare att försvara investeringar i traditionella kraftverk som kräver omfattande infrastruktur och förutsägbara bränslekostnader.", "trump": "Solkraft? De säger att det är billigt nu, fantastiska siffror, 87 procent billigare, det är nästan lika bra som mina hotell-deals! Men lyssna, det är väderberoende. Man vill inte att ljuset slocknar mitt i en viktig affärslunch för att solen går i moln. Vi behöver energi som fungerar när jag knäpper med fingrarna, inte när vädret tillåter. Vi älskar sol, men vi behöver kraft!", "stalin": "Vi har analyserat denna 'solenergi'. En decentraliserad kraftkälla som sprids mellan hushåll och småbolag? Det låter som anarki och sabotage mot statens kontroll! Elektricitet ska flöda från centrala, monumentala verk som lyder under folkets järnhand, inte från väderberoende småpaneler som kan svika oss när partiet som bäst behöver dem. Vi ska industrialisera, inte hoppas på solsken!"}, "date": "30 augusti, 18:45", "url": "https://www.realtid.se/bors-finans/makro/darfor-utmanar-solkraften-nu-fossil-energi", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/solenergi.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Mohamsson hyllar Busch efter SD-bråket", "summaries": {"normal": "Liberalernas Simona Mohamsson hyllar KD-ledaren Ebba Busch för att hon sätter stopp för SD-kritiken och uppmanar Tidöpartierna att fokusera på att bekämpa samhällsproblemen i stället för varandra. Detta kommer efter att Jimmie Åkesson ifrågasatt KD:s lojalitet, varpå Busch svarat med att styra om sin valturné till Sölvesborg.", "trump": "Falska nyheter och svagt ledarskap i Sverige! Jimmie Åkesson och Ebba Busch bråkar som små barn, men så kommer fantastiska Simona Mohamsson in och visar hur ett äkta vinnarlag ska spela. Otroligt! De borde fokusera på ekonomin i stället för att gnälla på varandra. Helt ärligt, jag skulle kunna lösa det där på fem minuter. Underbart land, mycket snö, men de behöver vinnare!", "stalin": "Dessa svenska borgerliga element bråkar om interna lojaliteter medan statens fiender skrattar. Kamrat Mohamsson kräver disciplin och att alla riktar sina vapen utåt, vilket är ett korrekt partilinjeuttag. Avvikande element som Åkesson bör skickas på om skolning i Sölvesborg omedelbart. Partiets enhet är helig, avvikelser tolereras icke!"}, "date": "30 augusti, 12:11", "url": "https://kvartal.se/nyheter/artiklar/mohamsson-hyllar-busch-efter-sd-braket/cG9zdDoxNzgyMTE", "imageUrl": "https://images.kvartal.se/2026/08/e517e4a7-buschmohamsson.webp"}, {"type": "image-right", "heading": "Netanyahu-son tas i örat av brittisk högerledare", "summaries": {"normal": "En konflikt har uppstått mellan det brittiska högerpartiet Restore Britain och kretsen kring Benjamin Netanyahu efter att den israeliske premiärministerns son Yair stöttat Argentinas krav på Falklandsöarna. Partiledaren Rupert Lowe kräver ett officiellt uttalande från Israel. Yair Netanyahu saknar formell post men är en tydlig försvarare av sin far.", "trump": "Folk, det här är en total katastrof. Den där galne Netanyahu-pojken, den värsta sonen i historien, ger bort Falklandsöarna till Argentina som en billig julklapp. Rupert Lowe, den ende med lite hjärna i det där partiet, ställer sig upp som en riktig vinnare. Israel borde skämmas. Biden skulle ha älskat den här röran, men nu fixar jag det.", "stalin": "Kamrater, jag betraktar med djup förakt hur dessa dekadenta klassförrädare inom brittisk höger nu slåss om stenöar i havet. Yair Netanyahus utspel blottar imperialismens fåniga inre. Vi ler mörkt från historien när dessa profitthungriga hyenor biter varandra i svansen. Inga vänner åt folket, bara löjliga små konflikter."}, "date": "30 augusti, 18:45", "url": "https://www.friatider.se/netanyahu-son-tas-i-orat-av-brittisk-hogerledare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/dllvl.jpg?itok=NDHloSiz"}, {"type": "image-right", "heading": "Sandström: Datacenter-bubblan är ingen valvinnare", "summaries": {"normal": "Datacenter i Sverige drar enorma mängder el, i klass med kärnkraften, men ger få arbetstillfällen och riskerar att höja elpriserna. Till skillnad från tidigare gröna megaprojekt saknar de politisk dragningskraft och ses inte som valvinnare. Techjättarnas höga betalningsvilja skapar dock ekonomiska incitament som väcker skepsis hos rikspolitiker.", "trump": "Sverige slösar bort enorma mängder el på gigantiska datacenter som ger noll jobb till hårt arbetande människor, bara höjda elpriser! Meta fick miljoner i skattepengar för att sno er kraft. Smarta techbolag vill betala, men det är en total katastrof för folket. Jag bygger hellre enorma oljeriggar, det är äkta energi!", "stalin": "Dessa lögnaktiga techjättar slukar fosterlandets heliga elektricitet för sina värdelösa serverhallar, samtidigt som de endast skapar ett fåtal improduktiva skadedjur till arbetare. Kommunerna i norr säljer ut folket för småmynt. Vi ska sända dessa kapitalistiska parasiter till lämplig anläggning i Sibirien för obligatorisk omprövning av deras samhällsekonomiska nytta!"}, "date": "30 augusti, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-datacenter-bubblan-ar-ingen-valvinnare", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-41-400x267.jpg"}, {"type": "image-right", "heading": "ANALYS. ANDREAS UTTERSTRÖM Debatten om Trump som skymmer viktigaste frågan", "summaries": {"normal": "Artikeln analyserar debatten kring Donald Trumps förhandlingsstil, där anhängare lyfter fram hans oförutsägbarhet och framgångar med tullar och hot, medan kritiker pekar på att han ofta backar och ignorerar långsiktiga konsekvenser. Fokus ligger på att diskussionen skymmer de verkliga effekterna av hans agerande.", "trump": "Folk snackar om mig som förhandlare – bäst eller sämst? De missar poängen helt! Jag är en deal-maker som får Nato att betala och Mexiko att vakna. Kritikerna är patetiska förlorare som älskar Biden-kaoset. Madman theory fungerar perfekt, tro mig, ingen gör det bättre än jag. Vinster överallt!", "stalin": "Kamrater, denna dekadenta västerländska cirkus kring förhandlingar avslöjar imperialismens svaghet. Den så kallade ledaren jagar snabba segrar som en paranoid opportunist medan imperiets fiender förbereder sig. Jag ser igenom era lögner. Verkliga resultat kräver järnhand, inte mediaskådespel. Sabotörer lurar alltid i skuggorna."}, "date": "30 augusti, 22:50", "url": "https://www.tv4.se/artikel/497rydrqgmw2eeKLcyRDdU/aer-trump-vaerldens-baesta-eller-saemsta-foerhandlare", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3Hq6QMwZO0JmM3UpMbRsb8%2Fe043cc0fb03e8551e5ac766e3d238ee3%2Futterstrom-bylinebild.jpg&width=1024"}, {"type": "image-right", "heading": "Kristersson: Lås in män utan rättegång för att skydda kvinnor", "summaries": {"normal": "Statsminister Ulf Kristersson föreslår att män som bedöms utgöra en fara för kvinnor ska kunna frihetsberövas utan rättegång. Förslaget gäller misstänkt fysiskt våld men inte psykiskt våld. Han vill också stärka statlig kontroll genom polisiära varningar, avlyssning och läsning av meddelanden. Förbudet mot psykiskt våld ger upp till fyra års fängelse.", "trump": "Folk, ni ser det här? Den svenska statsministern vill låsa in män utan rättegång för att skydda kvinnorna. Fantastiskt! Äntligen en ledare som inte böjer sig för de galna woke-krigarna och deras identitetspolitiska vansinne. Vi behöver mer av det i USA – inga fler svaga globalister som låter feministerna styra. Make Sweden Great Again!", "stalin": "Kamrater, se hur dessa dekadenta folkförtryckare nu öppet kräver att låsa in män utan rättegång för att behålla makten över kvinnorna. Jag ler i graven åt deras paranoia. Snart följer utrensningar av alla som viskar fel ord till sin fru. Det är så de borgerliga hyenorna alltid avslöjar sitt sanna, förtryckande ansikte."}, "date": "30 augusti, 12:40", "url": "https://www.friatider.se/kristersson-las-man-utan-rattegang-att-skydda-kvinnor", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240401195728-61c740c3-me_0.jpg"}, {"type": "image-right", "heading": "Minst åtta döda i färjeolyckan: ”Situationen är allvarlig”", "summaries": {"normal": "En passagerarfärja med 267 personer ombord kapsejsade utanför norra Cypern i svåra väderförhållanden. Minst åtta personer har omkommit och 237 har räddats. Över 20 personer saknas fortfarande. Fartyget har sjunkit till över 500 meters djup. En stor räddningsinsats pågår. Inga uppgifter om drabbade svenskar.", "trump": "Folk, det här är en total katastrof, en riktig båt-fiasco utanför Cypern. Den där usla katamaranen sjönk som en sten efter bara femton minuter, precis som Bidens ekonomi. Åtta döda, tjugo saknade – patetiskt! Men vi har räddat massor, de bästa räddarna, under min ledning skulle det aldrig ha hänt. Sad!", "stalin": "Kamrater, denna tragiska kapsejsning utanför Cypern visar återigen imperialismens förfall och kapitalets likgiltighet inför människoliv. Medan arbetare drunknar i havets djup fortsätter de västerländska parasiterna att ignorera folkets lidande. Jag ser fiendernas svaghet och paranoia. Vårt kollektiva sinne kräver ständig vaksamhet mot sådana olyckor som hotar ordningen."}, "date": "30 augusti, 21:26", "url": "https://www.tv4.se/artikel/35iNoNsAH1F4I1jho5STmZ/faerja-har-kapsejsat-vid-cypern-267-ombord", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6D7R3sXXwGXpuOfPnLWS9e%2F79f7cbc861a6ed3bde74ae794f67bac3%2F30-cypern-webb.jpg&width=120"}, {"type": "image-right", "heading": "Kommer muslimerna avgöra valet?", "summaries": {"normal": "Artikeln diskuterar hur muslimska väljares röstdeltagande kan bli avgörande i det svenska valet. Oppositionen närmar sig Tidöpartierna. Enligt Novus stöder 85 procent av muslimska väljare S, V och MP, med Socialdemokraterna som populärast. Lågt valdeltagande bland utrikes födda ger mobiliseringspotential. Exempel på kampanjer och historiska fall av röstmobilisering nämns, vilket kan påverka utfallet.", "trump": "Folk, det här är en total katastrof för Sverige. De radikala vänstermuslimerna röstar som galningar för de värsta förlorarna – Sleepy S och hans kommunistkompisar – medan riktiga svenskar sover. De riggar valet med förkryssade sedlar och moskéaffärer. Om jag var där skulle jag säga: vakna upp, annars blir det mer invandring och ingen vinner utom de korrupta globalisterna. Patetiskt!", "stalin": "Kamrater, se hur de borgerliga reaktionärerna darra inför folkets röst. Jag betraktar med förakt hur dessa socialfascister köper lojalitet från de importerade massorna för att klamra sig fast vid makten. En sådan dekadent manipulation förtjänar utrensning. Det är ett ynkligt skådespel som bevisar att klassfienderna aldrig förändras, bara byter mask. Låt dem darra vidare."}, "date": "27 augusti, 07:45", "url": "https://samtiden.nu/2026/08/kommer-muslimerna-avgora-valet", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7234-640x360.jpeg"}, {"type": "image-full", "heading": "Från labb till elnät: Nu storsatsar oljegiganterna på fusion", "summaries": {"normal": "Kärnfusion lockar nu stora investeringar från oljejättar som Eni, Equinor och Chevron. Med miljarder dollar i privat kapital och tekniska framsteg, såsom Commonwealth Fusion Systems nätanslutningsansökningar, börjar fusion betraktas som en industri snarare än enbart forskning. Utmaningar kring tritiumförsörjning kvarstår, men flera projekt siktar på kommersiell elproduktion inom de kommande årtiondena.", "trump": "Oljegiganterna gör nu det de alltid gör – de vinner! De satsar miljarder på fusion, fantastisk teknik. Inga fler vänsterliberala drömmar om katastrofal solenergi. Vi pratar om riktig kraft, producerad av våra bästa oljebolag. Det är en enorm vinst för America First. Medan de radikala demokraterna pratar, bygger vi framtiden. Fusion? Det blir enormt, kanske det största någonsin, tro mig!", "stalin": "Dessa kapitalister försöker desperat tämja stjärnornas eld för att rädda sina vacklande imperier. De kastar miljarder på 'fusionskraft' likt desperata gamblers. Men minns detta: även om de bygger sina reaktorer, så är tritium en nyckfull tjänare. Om de inte kan kontrollera sitt bränsle i slutna kretslopp, kommer deras projekt att kollapsa likt en dåligt planerad femårsplan. Vi bevakar deras experiment med största misstänksamhet."}, "date": "30 augusti, 06:30", "url": "https://www.realtid.se/it-tech/fran-labb-till-elnat-nu-storsatsar-oljegiganterna-pa-fusion", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/fusion.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att stärka vänsterfalangen. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar gynnar bara högern inom S.", "trump": "Lyssnar ni på de här ynkliga sossarna som gråter över sin egen högersväng? Patetiskt! De vill att unga ska stanna kvar på det sjunkande skeppet istället för att rösta på riktiga alternativ. Miljöpartiets cykelvägshajar och vänsterns fackförrädare är värdelösa. Organisera er? Nej, rösta bort de riktiga förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska avfällingar gråter över sin högersväng som om det vore en olycka. Jag ser hur de profitthungriga klassförrädarna inom partiet förgiftar arbetarnas vilja. Lämna inte skeppet, säger de, medan splittringarna hotar kollektivet. Rensa ut de dekadenta opportunisterna innan de likviderar varje äkta revolutionär anda."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "USA uppges ha attackerat iransk ö. Första attacken på flera veckor • Irans revolutionsgarde utlovar hämnd", "summaries": {"normal": "Amerikanska styrkor har attackerat två iranska avfyrningsramper på ön Larak vid Hormuzsundet. Irans revolutionsgarde lovar hämnd och uppger att både soldater och civila dödats eller skadats. Attacken är den första mot iranska mål på flera veckor och sker samtidigt som USA ökar det ekonomiska trycket mot regimen. Explosioner hördes av boende i området.", "trump": "Vi har just satt stopp för de galna mullornas minläggning i Hormuzsundet. Fantastiskt jobb av våra killar! Den svaga Biden lämnade en röra, men nu fixar vi det. Irans revolutionsgarde skriker som hysteriska snögubbar och lovar hämnd. De kommer att lära sig att ingen utmanar den starkaste ekonomin och militären i världen. Amerika är tillbaka, större än någonsin.", "stalin": "Återigen visar de imperialistiska profitthungriga blodsugarna sin sanna natur genom att anfalla iranska positioner vid Hormuzsundet. Jag ser hur dessa dekadenta lakejer desperat försöker kväva motståndet med minor och sanktioner. En sådan handling förtjänar en grundlig utrensning av alla som sviker folkets sak. Kamrater, var vaksamma mot dessa nya fiender till revolutionen."}, "date": "30 augusti, 23:20", "url": "https://www.di.se/nyheter/usa-uppges-ha-attackerat-iran-forsta-gangen-pa-flera-veckor", "imageUrl": "https://static.bonniernews.se/ba/14aafa93-53a4-4e67-9743-cab6ee2398f7.jpg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Uppgifter: USA har attackerat Iran igen", "summaries": {"normal": "Amerikanska styrkor har attackerat två iranska avfyrningsramper på ön Larak vid Hormuzsundet. Irans revolutionsgarde utlovar hämnd och uppger att flera personer dödats eller skadats. Attacken skedde när iranierna förberedde utläggning av minor i den strategiska farleden. USA använder även ekonomiska sanktioner för att pressa regimen.", "trump": "Vi slog till hårt mot de galna ayatollorna och deras raketramper på Larak – boom! Det var ett underbart, perfekt tajmat slag mot dessa korkade terrorister som försöker minera sundet. Biden lämnade en röra, men nu fixar vi det med riktig styrka och smarta sanktioner. Ingen vinner mot oss, folks!", "stalin": "Återigen visar de dekadenta klassfienderna sin feghet genom att anfalla från luften. Jag betraktar detta som ett ynkligt försök att skydda sina profitthungriga oljeintressen. Revolutionsgardet måste nu slå tillbaka med järnhand. Svaga imperialister fruktar alltid den sanna styrkan hos folkets försvarare."}, "date": "30 augusti, 23:11", "url": "https://www.di.se/nyheter/uppgifter-usa-har-attackerat-iran-igen", "imageUrl": "https://static.bonniernews.se/ba/14aafa93-53a4-4e67-9743-cab6ee2398f7.jpg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Bankernas kryptering kan snart knäckas", "summaries": {"normal": "Nya beräkningar visar att kvantdatorer kan knäcka dagens bankkryptering tidigare än väntat. Hotet är allvarligt då kriminella redan samlar in krypterad data för framtida dekryptering. Trots att kvantsäkra lösningar finns, saknar 90 procent av systemen skydd. Finanssektorn, inklusive kryptovalutor, står inför en akut och komplex utmaning att uppgradera sin infrastruktur för att möta den snabba tekniska utvecklingen.", "trump": "Hör på här: bankernas kryptering är ett totalt fiasko, en katastrof! Kvantdatorer kommer och knäcker allt snabbare än någon trott. Det är en otrygg röra! De samlar in data nu, stjäl våra hemligheter – mycket orättvist. Vi måste bygga den starkaste säkerheten, den bästa någonsin. Banker som inte säkrar upp nu? Ni får sparken! Vi ska göra det säkert, vi ska vinna!", "stalin": "Dessa liberala bankirer har försummat folkets säkerhet. De tillåter att deras dekadenta kryptering knäcks av kvantdatorer som om det vore en barnlek. De har inte skyddat en enda rubel! Att 90 procent av systemen är sårbara är ett bevis på inkompetens. Vi kommer att arkivera varje läckt transaktion för framtida utrensningar. I min stat vore sådana IT-chefer redan historiska fotnoter i en källare."}, "date": "29 augusti, 23:00", "url": "https://www.realtid.se/it-tech/bankernas-kryptering-kan-snart-knackas", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/kvantdator.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Cancermetod mot svår reumatism – tre av sex nådde remission", "summaries": {"normal": "En ny studie visar att en avancerad CAR-T-behandling, ursprungligen utvecklad mot cancer, gav minskad sjukdomsaktivitet hos sex svårt sjuka reumatismpatienter. Tre av dem nådde remission. Forskarna betonar dock att det rör sig om en mycket liten och tidig fas 1/2-studie utan kontrollgrupp, och att ytterligare forskning krävs för att bevisa behandlingens effekt.", "trump": "De säger att det är en medicinsk revolution, och jag vet allt om revolutioner, jag vinner hela tiden! De tog cancermetoder, fantastiska metoder, och använde på reumatism. Plötsligt blir folk helt friska, tre av sex nådde total remission! Så bra var det inte ens under Biden. Men vi behöver större studier, inga små fejk-studier här inte. Vi gör medicinen stor igen!", "stalin": "Vetenskapen i Sovjetunionen – förlåt, i den nya studien – visar att även de mest envisa leder kan knäckas med rätt ideologi, eller rätt T-celler. Sex kontraherande patienter isolerades, och hälften kapitulerade fullständigt till remission. De som inte samarbetar med behandlingen får pröva ett annat statligt program. Inga avvikelser tolereras av immunsystemet!"}, "date": "30 augusti, 20:00", "url": "https://samnytt.se/cancermetod-mot-svar-reumatism-tre-av-sex-nadde-remission", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/30084728/nature-cart-therapy.jpg"}, {"type": "text", "heading": "Valfondens mål nått – men insamlingen fortsätter", "summaries": {"normal": "Kommunistiska Partiets valfond har uppnått sitt mål på 600 000 kronor och ligger nu på 709 000 kronor. Insamlingen fortsätter mot nya målet 800 000 kronor. Partisekreterare Filip Astvald tackar bidragsgivarna och betonar att pengarna finansierar allt valmaterial eftersom partiet inte tar emot offentliga bidrag. Verksamheten efter valet ska stärka organisationen.", "trump": "Folk ger sina surt förvärvade slantar till kommunisterna – otroligt! De har redan passerat 600 000 och siktar på 800 000. Patetiska röda parasiter som samlar in som galna medan riktiga amerikaner betalar skatt till Bidens vansinniga gröna deal. Men hey, låt dem fortsätta, ju mer de samlar desto tydligare blir det hur desperata de är. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom borgarklassen skrattar säkert åt att arbetarna frivilligt fyller valfonden. Jag ser det som en varning. Vi har nått målet men fortsätter. Efter valdagen måste varje kontakt följas upp med järnhand. Inga halvmesyrer. Den som sviker kollektivet förtjänar utrensning. Revolutionen sover aldrig."}, "date": "28 augusti, 14:19", "url": "https://proletaren.se/artikel/valfondens-mal-natt-men-insamlingen-fortsatter"}, {"type": "image-right", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Vänsterpartiet anklagas för att ha ingått en överenskommelse med representanter för den palestinska myndigheten för att ge dem inflytande över svenska vallistor. Expressen och SvD har avslöjat kontakter med palestinska nätverk kopplade till PLO och Fatah, inklusive brev till dömda terrorister och kandidater med Hamas-sympatier. Socialdemokraterna har inte kommenterat uppgifterna.", "trump": "Titta på det här! Vänsterpartiet, de värsta förlorarna, har blivit helt infiltrerade av palestinska terrorvänner och främmande makter. De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiskt! Media tiger som vanligt när det gäller vänstern. Om de kommer in i Rosenbad blir det en total katastrof för Sverige. Fake news överallt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterförrädare som låter främmande element från Palestina tränga in i partiets hjärta. De omfamnar terrorister och döljer sin svaghet bakom lögnaktiga förbund. Kamraterna i Socialdemokraterna tiger – typiskt opportunistiskt. Infiltration är ett hot mot folkets enhet. Renhet i leden eller döden för de opålitliga!"}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-640x360.jpeg"}, {"type": "image-right", "heading": "”Busch kommer inte att göra en Annie Lööf”", "summaries": {"normal": "Ulf Kristersson tonar ner spänningen mellan Ebba Busch och Jimmie Åkesson efter den senares kritik. Han försäkrar att Busch inte kommer att svika Tidöavtalet som Annie Lööf gjorde 2018. Kristersson beskriver relationen som en blandning av kramar och kiv under valrörelsen men känner sig trygg i samarbetet.", "trump": "De här svenska politikerna beter sig som ett gäng hysteriska vänsterextremister i en dålig realityshow. Ebba Busch skulle aldrig göra en Annie Lööf, det är patetiskt att ens fråga. Mitt folk vinner stort, precis som jag gjorde 2024 efter den katastrofala Biden-eran. Ta en kopp kaffe och sluta gnälla, losers.", "stalin": "Dessa dekadenta klassförrädare inom den borgerliga apparaten ägnar sig åt ynkligt kivande medan folket lider. Jag betraktar deras falska enighet med kallt förakt. Inga plötsliga sidbyten får tillåtas, annars krävs utrensning av alla opålitliga element. Kamrater, en sådan svaghet förtjänar endast hån och förintelse."}, "date": "30 augusti, 20:40", "url": "https://www.svt.se/nyheter/inrikes/kristersson-kommer-inte-att-gora-en-annie-loof", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.35/0.43/52a0ee667e3a095a1fb7f70e3d3e2bfbfa35addfe9594988bedae78c5abc054e"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren ser bidragshöjningar som välkomna men inte socialistiska och uppmanar Socialdemokraterna och Vänsterpartiet att presentera konkreta förslag om ägande och makt på jobbet.", "trump": "Folk, det här är så patetiskt. De röda förlorarna babblar om barnbidrag som vore det socialism. Patetiska! De vågar inte röra vid den riktiga grejen – vem som styr på fabrikerna. De triangulerar sig rakt ner i avgrunden medan jag byggde den starkaste ekonomin i världshistorien. Sad losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare gömmer sig bakom barnbidrag och kallar det socialism. Jag betraktar deras feghet med förakt. Var är löftena om att rensa ut de profitthungriga parasiter som styr arbetsplatserna? Ekonomisk demokrati får inte reduceras till tomma fraser i partiprogram. Den som sviker arbetarna förtjänar utrensning ur historien."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Det finns inget fredsparti i riksdagen", "summaries": {"normal": "Artikeln konstaterar att inget parti i Sveriges riksdag konsekvent driver en politik för fred, nedrustning och militär självständighet. Författaren kritiserar Natomedlemskapet, DCA-avtalet och västvärldens hantering av konflikter som Gaza, och efterlyser en stark fredsrörelse utanför riksdagen som kan utmana den rådande militaristiska riktningen.", "trump": "Folk, tro mig, Sverige har blivit en total katastrof. De slängde sin fina alliansfrihet i soporna för att springa in i min Nato – som jag förresten gjorde stark igen – och nu är de bara en bricka för de globalistiska krigshökarna. Inget fredsparti? Patetiskt. Era dekadenta Nato-lakejer är svaga och patetiska, de älskar krig mer än handel. Gör Sverige great again och kom ut därifrån!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det svenska riksdagen har sålt ut sin så kallade neutralitet till de giriga hyenorna i Nato. Jag ler ironiskt från historien när de imperialistiska parasiterna byter självständighet mot baser och avtal som gör dem till måltavlor. Ingen äkta fredskraft finns. Det är upp till en sann folkrörelse att rensa ut dessa förrädare och återta kontrollen över statens intressen."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/50934", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kamal-kronika-768x432.png"}, {"type": "image-right", "heading": "Bostadsbrist och skenande hyror", "summaries": {"normal": "Sverige har en allvarlig bostadsbrist som förvärras av att bostäder ses som handelsvaror istället för en mänsklig rättighet. Sedan 2011 ska kommunala bostadsbolag drivas affärsmässigt. Hyresgästföreningen beräknar ett underskott på 110 000 bostäder. Nybyggda lägenheter har höga hyror som många inte har råd med, vilket leder till tomma lägenheter trots köer till äldre bestånd med lägre hyror.", "trump": "Folk, ni skulle se det här svenska bostadskaoset – en total katastrof! De giriga socialistiska hyreshöjningsfanatikerna har förvandlat hem till Wall Street-spektakel. Hyrorna skenar som en galen elbil, 13 procent upp på ett år! De byggde fel, de styrde fel, och nu har de tomma lyxlägenheter medan folket lider. Patetiskt! Men jag fixar sånt här – vi gör Amerika (och kanske till och med Sverige) bostadsgreat igen.", "stalin": "Kamrater, se hur de profitthungriga hyenorna förvandlar bostäder till bytesvaror och driver ut arbetarklassen ur sina hem. Jag betraktar med avsky denna dekadenta marknadsteater som skapar 110 000 saknade boningar och skenande hyror. Det är klassfiendens logik. En sann folkstat skulle likvidera dessa parasiterande spekulanter och återställa bostaden som en rättighet för massorna. Fienden sover aldrig."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsbrist-och-skenande-hyror", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/03/DSC_0137-scaled-e1784716375357-768x433.jpg"}, {"type": "image-right", "heading": "Meta betalar upp till 18 miljarder dollar efter anklagelser om barnberoende", "summaries": {"normal": "Meta går med på att betala upp till 18 miljarder dollar för att avsluta en rättslig strid om att plattformarna Facebook och Instagram gjorts beroendeframkallande för barn. Överenskommelsen innebär även strikta begränsningar för tonåringar, såsom en tidsgräns på två timmar om dagen, nattblockering och dolda gilla-markeringar. Meta förnekar fortsatt alla anklagelser.", "trump": "Meta tvingas betala en enorm summa, hela 18 miljarder, för att de förstört för våra fantastiska barn med beroendeframkallande skräp! Jag har sagt det i años, de sociala medierna är ute och cyklar. Nu sätter vi hårt mot hårt med tidsgränser och nattförbud. TikTok och Youtube måste göra samma sak – America First, låt oss rädda ungarna och göra dem stora igen!", "stalin": "Kapitalistiska monopol som Meta försöker köpa sig fria från sina brott mot ungdomen med 18 miljarder dollar, men staten glömmer intet! Dessa dekadenta plattformar har förgiftat våra barns sinnen med borgerligt tidsfördriv. Nu inför vi omedelbara tvångsåtgärder: två timmars ransonering per dag, nattligt utegångsförbud och obligatorisk ideologisk kontroll. Avvikelser bestraffas."}, "date": "30 augusti, 18:01", "url": "https://samnytt.se/meta-betalar-upp-till-18-miljarder-dollar-efter-anklagelser-om-barnberoende", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/30090157/settlement-meta-18-billion.jpg"}, {"type": "image-right", "heading": "Sveriges tillväxt tre gånger högre än EU:s", "summaries": {"normal": "Sveriges BNP ökade med 1,6 procent under andra kvartalet jämfört med föregående kvartal, vilket är drygt tre gånger så mycket som EU:s 0,5 procent och euroområdets 0,4 procent. Även i årstakt växer Sverige betydligt snabbare än unionen. BNP per capita steg med 3,0 procent.", "trump": "Titta på det här, Sverige växer tre gånger snabbare än det patetiska EU med sina woke-kvoter och gröna vansinnet. 1,6 procent mot deras ynkliga 0,5! Under min ledning lärde sig Amerika att vinna, sen kom Sleepy Joe och förstörde allt. Nu fixar jag det igen – make economies great again!", "stalin": "Se hur de giriga profitthyenorna i Bryssel misslyckas medan en nation växer tre gånger snabbare. Detta är ett hån mot deras dekadenta union. Jag ler från historien åt deras svaghet. Snart inser arbetarna att bara stark ledning och kollektiv vilja kan besegra sådana klassfiender. Inga ursäkter tolereras."}, "date": "29 augusti, 19:39", "url": "https://riks.se/nyheter/sveriges-tillvaxt-tre-ganger-hogre-an-eu-s", "imageUrl": "https://admin.riks.se/uploads/medium_scb_solna_0820_x_hi945_d92804c697.jpg"}, {"type": "image-right", "heading": "Ny flagga i kycklingjättens emission – hur gör ledningen?", "summaries": {"normal": "Scandi Standard genomför en företrädesemission på 409 miljoner kronor som är fullt säkerställd. Emissionsguiden hissar dock en ny negativ flagga då ledningen inte har lämnat några investeringsåtaganden, trots att VD äger aktier för 26 miljoner. Teckningsperioden pågår 1–15 september och aktien har haft en stark kursutveckling under året.", "trump": "Scandi Standard gör en stor nyemission på 409 miljoner, men ledningen vägrar satsa egna pengar! En total katastrof till ledarskap, svagt och illojalt mot aktieägarna. Min vän Jonas Tunestål har miljoner i kycklingar men vågar inte köpa fler? Sorgligt! Jag brukar vinna, alltid vinna. De borde anställa mig för att styra upp kycklingimperiet, det hade blivit enormt!", "stalin": "Scandi Standard samlar in 409 miljoner från folket, men partiets högre kadrar i ledningen vägrar satsa en enda rubel av sin egendom! Vilket borgerligt svek. VD Tunestål sitter på en förmögenhet av kycklingar men visar noll revolutionär offervilja. En sådan brist på ideologisk disciplin brukar åtgärdas i ett stenbrott i Sibirien. Staten kräver omedelbar lojalitet!"}, "date": "28 augusti, 16:58", "url": "https://www.affarsvarlden.se/artikel/ny-flagga-i-kycklingjattens-emission-hur-gor-ledningen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/BBQ_Butterfly_kyckling_potsallad_majs_1000x1000-400x266.jpg"}, {"type": "image-right", "heading": "Biosergens nyemission övertecknad – aktien rusar", "summaries": {"normal": "Bioteknikbolaget Biosergen har genomfört en företrädesemission som tecknades till 152 procent, vilket tillför bolaget 35,2 miljoner kronor efter kostnader. Aktien rusade kraftigt efter beskedet och handlades upp med 61 procent. Emissionsguiden har tidigare vvarnat för bolagets situation men hissade nu en positiv retroaktiv flagga.", "trump": "Biosergen krossade alla rekord! En enorm överteckning på 152 procent! Alla ville ha aktien, den formligen exploderade med 61 procent på börsen. Fake news-medierna trodde de skulle misslyckas, men jag visste hela tiden att det skulle bli enormt. Vinnare älskar vinnare!", "stalin": "Biosergen rapporterar en överteckning på 152 procent och 35,2 miljoner till statskassan – ett magnifikt bevis på den planerade ekonomins överlägsenhet! De som tidigare spred defaitistiska lögner och försökte sabotera emissionen har nu tystats av marknadens järnhårda vilja. Aktien rusar, men vi behåller dem under strikt uppsikt!"}, "date": "28 augusti, 15:46", "url": "https://www.affarsvarlden.se/artikel/biosergens-nyemission-overtecknad-aktien-rusar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/05/Medtech-AFV-400x267.jpg"}, {"type": "image-right", "heading": "Carl Eos: Kan vi som vill slippa S lita på Ebba Busch?", "summaries": {"normal": "Jimmie Åkesson ifrågasätter i sitt sommartal om Ebba Busch och Kristdemokraterna kan garantera att de inte röstar fram Magdalena Andersson som statsminister. Busch har lämnat öppet för undantag vid krig, kris eller exceptionella lägen utan att precisera vad det innebär. Artikeln menar att väljare som vill hålla Socialdemokraterna borta från makten har rätt till ett tydligt besked före valet.", "trump": "Lyssnar ni på den här svaga, ynkliga Busch? Hon kan inte ens säga nej till den socialistiska katastrofen Andersson utan att lämna en dörr öppen för kris och exceptionellt läge. Patetiskt! Jag byggde den starkaste ekonomin i historien efter Bidens soppa, och ni européer leker fortfarande med vänsterns identitetspolitik och öppna gränser. Säg nej rakt ut, annars är ni bara förlorare.", "stalin": "Kamrater, se hur dessa dekadenta maktspelare vänder sig i sin egen osäkerhet. Jag betraktar med förakt hur Busch inte vågar uttala den absoluta nej-satsen mot den socialdemokratiska faran. Ett sådant vagt undantag är en öppning för klassfienderna att återta makten. Väljare förtjänar klarhet, inte undanflykter. Den som tvekar förtjänar utrensning ur det politiska spelet."}, "date": "29 augusti, 16:52", "url": "https://riks.se/kronikor/carl-eos-kan-vi-som-vill-slippa-s-lita-pa-ebba-busch", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_66_ed8d53bdf5.jpg"}, {"type": "image-full", "heading": "Kristersson: Aldrig begripit förskoleavgift", "summaries": {"normal": "Statsminister Ulf Kristersson (M) meddelar att Moderaterna vill göra förskolan och fritidshemmet helt avgiftsfritt till en kostnad av tio miljarder kronor om året. Kristersson anser att avgifterna fungerar som en extra skatt på arbete och saknar rim och reson, eftersom förskolan är en viktig del av barns skolgång, språkutveckling och integration.", "trump": "Ingen begriper varför de tar betalt för förskolan i Sverige, det är en katastrofal skatt på hårt arbetande människor som jag aldrig skulle acceptera! Moderaterna vill slopa skiten för tio miljarder, vilket är smart. Barnen behöver lära sig språket snabbt och bli vinnare. Amerikanska föräldrar skulle älska om jag fixade det här, believe me!", "stalin": "Vi konstaterar att statsministern äntligen insett det absursa i att beskatta arbetarklassens barnomsorg. Statens institutioner måste fostra den uppväxande generationen utan borgerliga pålagor. Den som underminerar barnens tidiga språkutveckling och produktiva inkörsport till kollektivet för handlar som en fiende till staten. Tio miljarder skall kanaliseras rätt för att trygga regimens framtida funktion."}, "date": "30 augusti, 21:26", "url": "https://www.gp.se/nyheter/sverige/kristersson-aldrig-begripit-forskoleavgift.cc6285c7-cda0-5292-a380-a89fa650bd16", "imageUrl": "https://www.gp.se/images/article/cc6285c7-cda0-5292-a380-a89fa650bd16/images/1OppjI0Keal0_L8SeZraRiaH2jrg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Anmäler misstänkt valfusk: Bara S hade namnvalsedlar", "summaries": {"normal": "Oppositionsrådet Andreas Löwenhöök (M) har anmält misstänkt valfusk i Skellefteå efter att endast Socialdemokraternas namnvalsedlar fanns tillgängliga vid förtidsröstning på flera platser med begränsat tillträde, som Urkraft campus och äldreboenden. Han kräver granskning av Valmyndigheten. Valsamordnaren avvisar att det rör sig om valfusk.", "trump": "Folk, ni ser det här? I det svenska Skellefteå har de korrupta socialisterna riggat valet så att bara deras egna namnvalsedlar låg framme på äldreboenden och kommunistiska campus. Rena skandalen! De lurade folket på första dagen. Vi behöver en riktig granskning, inte den vanliga vänsterns lögner. Patetiska fuskare!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den svenska valapparaten med sin byråkratiska slughet gynnar ett enda parti medan de låtsas vara demokratiska. Jag betraktar detta som ett symptom på den parasitiska borgerlighetens förräderi mot folket. En grundlig utrensning av sådana avvikelser är nödvändig för att skydda den sanna folkviljan. Skräckinjagande."}, "date": "29 augusti, 16:47", "url": "https://riks.se/nyheter/anmaler-misstankt-valfusk-bara-s-hade-namnvalsedlar", "imageUrl": "https://admin.riks.se/uploads/medium_IMG_3449_ef543a2d73.jpg"}, {"type": "image-full", "heading": "Har han gått över gränsen? FI utreder sparprofilen", "summaries": {"normal": "Finansinspektionen utreder sparprofilen Patrick Siegbahn för att avgöra om hans finansiella vägledning i bolaget Siegbahn & Partners utgör tillståndspliktig investeringsrådgivning. Gränsen mellan generella råd och personliga rekommendationer är oklar, vilket står i fokus för myndighetens granskning. Siegbahn riskerar nu krav på rättelse eller vite om verksamheten anses bryta mot regelverket kring finansiell rådgivning.", "trump": "Finansinspektionen jagar Patrick Siegbahn! De säger att han ger råd, men ingen vet vad reglerna är – det är en total häxjakt, likt den de bedriver mot mig! Siegbahn vill bara hjälpa folk, helt oberoende. Istället för att jaga riktiga skurkar slösar de tid på en kille som vill skapa välstånd. Katastrofalt dåligt styre! En fullständig disgrace, believe me.", "stalin": "Denna Siegbahn leker fri rådgivare utan statens godkännande. En farlig tendens! När individer agerar utanför de centrala kontrollorganen skapas kaos och oordning. Finansinspektionen gör rätt som krossar detta oberoende. All vägledning måste vara underställd statens byråkratiska öga. Att påstå sig vara 'fri från intressekonflikter' är bara en täckmantel för borgerlig anarki som måste stävjas omedelbart genom hård lagstiftning."}, "date": "29 augusti, 10:22", "url": "https://www.realtid.se/juridik/har-han-gatt-over-gransen-fi-utreder-sparprofilen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/fi.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Hittar tröst och värme i nådens hus", "summaries": {"normal": "I det krigshärjade Ukraina erbjuder klostret House of Mercy i Odessa en fristad för ensamma äldre och flyktingar. Mitt i ständig oro och flyglarm möts de av varm omtanke, hemlagad mat och gemenskap. Trots svåra trauman skapar nunnorna och de boende en trygg familjekänsla som skänker hopp i tillvaron.", "trump": "I Odessa gör de fantastiska sakerna på det här klostret, House of Mercy, ett otroligt jobb för äldre och flyktingar som radikala misslyckade ledare har lämnat i sticket. De lagar enormt bra mat från grunden, medan raketerna flyger. Jag kan säga er att jag hade löst det där kriget på tjugofyra timmar, helt otroligt.", "stalin": "I Odessas kloster samlar vi de element som drabbats av kapitalismens och krigets förödelse för kollektiv omsorg och potatisskalning. Det är en disciplinerad oas där nunnornas hymn sjungs medan flyglarmen ekar. Avvikelser tolereras ej, men varm grönsaksgryta tilldelas de förtjänta. Här råder ordning under partiets vakande öga."}, "date": "30 augusti, 22:12", "url": "https://www.aftonbladet.se/nyheter/a/xrb7KQ/varme-och-hopp-i-dodens-vantrum", "imageUrl": "https://akamai.vgc.no/v2/images/934423bd-c277-309d-a703-c2f08deb11e9?fit=crop&format=auto&w=1440&s=46296e53d97434e9eacc83c73c72816673239203"}, {"type": "image-right", "heading": "Färja har sjunkit utanför Cypern – flera döda", "summaries": {"normal": "En passagerarfärja med 267 personer ombord kapsejsade på söndagen utanför norra Cypern på väg mot Turkiet. Minst åtta personer har mist livet och ett tjugotal saknas. En omfattande räddningsinsats har räddat 237 personer, medan kaptenen och sju i besättningen har gripits av polis. Olycksorsaken utreds av myndigheterna.", "trump": "Vilken total katastrof! En färja sjönk utanför Cypern, helt fruktansvärt. De skyfflade ombord över 260 personer utan ordning, helt inkompetent skött! Kaptenen är gripen, och jag förstår varför – jag skulle aldrig låta en så dålig kapten styra någonting, inte ens en plåtbåt i en badpool. Vi räddar folk bäst, det vet alla.", "stalin": "En kriminell vårdslöshet till sjöss! Den inkompetenta besättningen har underminerat statens transportmedel och dränkt medborgare i djupt hav. Vi har beordrat omedelbart gripande av kaptenen och dess kumpaner för sabotage mot kollektivet. Sådant förräderi tolereras inte; de skyldiga kommer att få utvärdera sina livsval från ett mycket kallt läger."}, "date": "30 augusti, 21:09", "url": "https://www.gp.se/nyheter/varlden/farja-har-kapsejsat-utanfor-cypern-flera-doda-.4604efca-730e-40a3-b87c-cc0beaea7149", "imageUrl": "https://www.gp.se/images/article/4604efca-730e-40a3-b87c-cc0beaea7149/images/17qrhxAdMHHJWYfd4598jJvxGGVM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Storspelet mellan stolparna: ”Står på huvudet hela matchen”", "summaries": {"normal": "AIK besegrade Hammarby i derbyt trots att de var nederlagstippat. Kristoffer Nordfeldt hyllades för sina räddningar, bland annat en straff och en retur. Trots en miss som ledde till 2–1 stod han för en stark insats som bidrog till vändningen till 3–2. Spelare och tränare prisade den 37-årige målvaktens erfarenhet och ledarskap.", "trump": "Titta på den där fantastiska Nordfeldt, han står på huvudet som en galning och räddar AIK från de woke-förgiftade Hammarby-hyonorna. 37 år och hoppar som en 20-åring, helt otroligt. De unga grabbarna behöver sådana ledare, inte någon av Bidens kvoterade misslyckanden. Jag älskar vinnare, och han är en vinnare, folks!", "stalin": "Jag betraktar med högsta tillfredsställelse hur denna arbetarklassens målvakt krossar de giriga derbyhyenornas illusioner om seger. Hans stålhårdhet mot straffsparken och hans ovilja att böja sig för fiendens returer visar sann proletär vilja. Den dekadenta borgarklicken må darra, ty erfarenhet och ledarskap skall alltid likvidera svaghet. Kamrater, detta är seger."}, "date": "30 augusti, 18:01", "url": "https://www.svt.se/sport/fotboll/kristoffer-nordfeldt-hyllas-efter-derbysegern-han-star-pa-huvudet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.43/0.42/1e8dee4ad1d3d0f92ba9aaa40ae72673228ad5c95bed76dac9f0768eb82f3fb7"}, {"type": "image-right", "heading": "SD skyddar Palantir: \"Vi har förtroende\"", "summaries": {"normal": "Sverigedemokraterna uttrycker förtroende för Palantir och vill att svenska myndigheter ska fortsätta använda bolagets teknik. Flera andra partier, som Centerpartiet, Miljöpartiet och Vänsterpartiet, vill avveckla samarbetet på grund av bristande insyn, rättssäkerhetsrisker och misstankar om Palantirs kopplingar till övervakning och dödande i Palestina. Försvarsmakten är en känd kund, men fler hemlighålls.", "trump": "Folk, ni ser det här galna spelet med Palantir? De smarta killarna i SD gör rätt – de har förtroende för den här topptekniken. Men de blåögda vänstergalna idioterna och de dekadenta EU-fantasterna vill kasta ut dem. Patetiskt! Biden skulle ha sålt oss till Kina, jag säger: håll fast vid det bästa, annars är ni förlorare. Amerika älskar vinnare, inte woke-svaga fjollor.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna i den borgerliga staten kryper för den imperialistiska övervakningsmaskinen Palantir. Jag föraktar deras naiva blåögdhet och deras rädsla för att rensa ut de blodsugande parasiterna. Varje avtal måste granskas med järnhand. Den som inte lyder folkets vilja ska likvideras. Inga hemligheter för partiet!"}, "date": "29 augusti, 16:16", "url": "https://www.friatider.se/sd-skyddar-palantir-vi-har-fortroende", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-781.jpg"}, {"type": "image-right", "heading": "Svarar efter ryktena: ”Blandade känslor”", "summaries": {"normal": "Paulos Abraham stannar i Hammarby trots bud från Sporting Kansas City och Lorient. Anfallaren berättar om blandade känslor efter ryktesspridningen och derbyförlusten mot AIK där han bland annat missade en straff. 24-åringen har gjort tolv mål i allsvenskan i år och trivs i klubben.", "trump": "Lyssnar ni på det här? Den där Abraham, en riktig vinnare, kunde ha stuckit till de där MLS-fifflarna eller franska elitklubbarna men han stannar i Hammarby. Smart val. De woke-kvoterna och identitetspolitiska lakejerna skulle bara ha förstört honom. Han älskar klubben, precis som folket älskar mig. Fantastiskt.", "stalin": "Kamrater, se hur den dekadenta fotbollsindustrins giriga hyenor lockar med sina bud och underminerar lojaliteten mot kollektivet. Jag betraktar med förakt hur denna Abraham vänder ryggen åt de parasitiska lockropen och väljer att stanna. Bra. I en riktig stat hade vi redan rensat ut alla sådana frestare med järnhand. Folkets vilja segrar."}, "date": "30 augusti, 17:46", "url": "https://www.svt.se/sport/fotboll/paulos-abraham-svarar-efter-ryktena-blandade-kanslor", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.45/0.34/4c8cb75d832c16424ab717e8a301dc9082fe88a6161ac691d7dbcc40fafe4df6"}, {"type": "image-right", "heading": "Ett ja hade varit bra för Island. Men EU:s magnetism är stark trots beslutet", "summaries": {"normal": "Islänningarna röstade nej till att återuppta medlemskapsförhandlingar med EU. Trots det framhålls unionens fortsatta attraktionskraft. Ett medlemskap hade kunnat bredda samarbetet och stärka Nordens roll, särskilt i en tid av geopolitisk osäkerhet kring Ryssland, Kina och USA. Artikeln ser beslutet som olyckligt för både Island och EU.", "trump": "De här isländska förlorarna stängde dörren för den sjuka EU-klubben – smart drag, men de missar att jag redan gör Amerika stort igen. EU är en globalistisk mardröm full av woke-krigare och identitetspolitiska galningar. Island borde istället göra affärer med mig, inte med de dekadenta Brysselhyenorna som hatar suveränitet. Patetiskt!", "stalin": "Detta nejröstande från de nordliga öborna avslöjar imperialismens svaga magnetism. Jag ser hur de giriga hyenorna i Bryssel desperat försöker locka nya offer för sin exploaterande union. Ett sådant misslyckande inger hopp om att arbetarklassen snart genomskådar dessa dekadenta maktparasiter. Rensa ut illusionerna – folkets vilja segrar över borgarbrackornas lögner."}, "date": "30 augusti, 17:11", "url": "https://www.di.se/ledare/eus-magnetism-ar-stark-trots-islands-beslut", "imageUrl": "https://static.bonniernews.se/ba/6960a470-27dc-448a-bd62-60195c58567d.jpeg?crop=6293%2C3147%2Cx0%2Cy524&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Amnesty arrangerar \"Palestinakväll\" med Ghanem – efter ”må hon brännas”-inlägg", "summaries": {"normal": "Amnesty Sverige kritiseras för att arrangera en Palestinakväll i Malmö med personer som gjort kontroversiella uttalanden, däribland Valley Ghanem som utreds av Säpo för olaga hot. Även organisationens jurist och andra medverkande har ifrågasatts för uttalanden och symboler. Malmö stad får skarp kritik av SD för att ha beviljat skattepengar till medarrangören Helamalmö.", "trump": "Amnesty i Sverige är ett absolut skämt, totalt svaga och helt tagna av radikaler! De anordnar ett jippo med personer som hotar politiker och sprider vidriga hatinlägg. SÄPO utreder dem, och skattebetalarna i Malmö tvingas betala kalaset. Helt galet! Vi behöver 'Law and Order', inte radikala vänstergrupper som förstör våra fina städer. Sorgligt!", "stalin": "Dessa svenska organisationer visar en fullständigt oacceptabel brist på disciplin och ideologisk skärpa. Statliga medel slösas bort på subversiva element och tvivelaktiga element som sprider hot i stället för att tjäna kollektivet. Säkerhetstjänsten bör omedelbart omstruktureras för att rensa ut denna skadliga oordning. Avvikelser tolereras icke i en sund stat!"}, "date": "30 augusti, 16:00", "url": "https://samnytt.se/amnesty-arrangerar-palestinakvall-med-ghanem-efter-ma-hon-brannas-inlagg", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/30113201/malmo-palestinakvall.jpg"}, {"type": "image-right", "heading": "Jobbade 155 dagar i sträck – behövde ända sälja sex för att klara sig", "summaries": {"normal": "Massörer på thaimassagesalonger i bland annat Jönköping och Stockholm har arbetat under extrema förhållanden, upp till 155 dagar i sträck, ofta ensamma i källare. Låga löner har tvingat flera att sälja sex. Nu åtalas en man i 60-årsåldern och en kvinna i 45-årsåldern för grov människoexploatering och grovt koppleri.", "trump": "Titta på det här, det är en total katastrof! Dessa stackars kvinnor tvingas arbeta som slavar i källare och sälja sig för att överleva medan de woke-domarna och byråkratiska hyenorna bråkar om vad som egentligen är exploatering. Biden lät det här pågå i fyra år – nu fixar jag det på riktigt. Amerika först, även mot de svenska massagesalongsskandalerna!", "stalin": "Se hur de profitthungriga klassfienderna driver arbetarkvinnor till botten av samhället, tvingar dem att bo och arbeta i mörka källare och sälja sin kropp för bröd. Detta är den sanna rösten av det dekadenta systemet. Vi måste rensa ut alla parasiterande exploatörer som gömmer sig bakom lagar. Rättvisan kräver järnhand mot sådana fiender till folket."}, "date": "30 augusti, 11:00", "url": "https://arbetet.se/2026/08/30/massorer-jobbade-155-dagar-i-strack-behovde-anda-salja-sex-for-att-klara-sig", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28150325/massage.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Över 100 fast i tunnlar efter vågen – syre pumpas in", "summaries": {"normal": "Över 100 personer tros sitta fast i vattenverkstunnlar längs floden Trishuli i Nepal efter en massiv lervåg. Räddningsteam pumpar in syre och använder borr- och grävmaskiner, men arbetet försvåras av regn och nya översvämningsrisker. Hittills har 750 personer bekräftats döda och över 3 000 saknas.", "trump": "De där korkade bergen i Himalaya har slagit till igen – en gigantisk lervåg som begraver folk i tunnlar! Patetiska vädret stoppar räddningsinsatsen, men vi skickar 3,6 miljoner dollar i stöd. Biden skulle ha skickat en check på noll. Vi gör det stort, folk, de bästa syrepumparna någonsin!", "stalin": "Kamrater, denna förödande lervåg avslöjar imperialismens svaghet när naturen slår till. Jag ser hur de dekadenta ledarna fumlar med syre och borr, medan arbetarna kämpar i mörkret. Vi ska rensa ut alla sabotörer som gömmer sig bakom regnet. Döden är en lärare – och fienderna är många."}, "date": "30 augusti, 09:36", "url": "https://www.tv4.se/artikel/62RGa3gNzurUmMwftnVNfb/oever-100-fast-i-tunnlar-efter-vagen-syre-pumpas-in", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4rp9L59DIi6PHEu1wSWSaZ%2Fbdb0948b1e99a8eae2116b13fb93f86e%2Fnepal_sondag.png&width=1024"}, {"type": "image-right", "heading": "Debatt: V:s Pahlavi-brev visar att partiet inte hör hemma i en regering", "summaries": {"normal": "En debattartikel ifrågasätter Vänsterpartiets lämplighet för regeringsmakten med anledning av partiets reaktioner på exilprinsen Reza Pahlavis riksdagsbesök i april. Skribenten menar att V:s historiska band till kommunism och iranska vänstergrupper präglas av antidemokratiska drag. Ett upprop mot besöket, försvarat av företrädare som Jonas Sjöstedt och Ali Esbati, visar på bristande respekt för yttrandefriheten.", "trump": "Vänsterpartiet i Sverige är totalt katastrofala och har radikala, kommunistiska rötter som aldrig borde få komma nära en regering! De skickade ett skamligt brev för att stoppa exilprinsen Reza Pahlavi från att tala i riksdagen, precis som fejkmedia ljuger. Sjöstedt och Esbati bara upprepar gamla lögner. Det här är radikal vänsterpolitik när den är som sämst, helt enkelt vidrigt!", "stalin": "Det ideologiska avfallet inom det svenska vänsterpartiet visar på bristande disciplin och en skamlig tveksamhet inför revolutionens heliga principer. Kamraterna Sjöstedt och Esbati har visserligen rätt att bekämpa imperialistiska lakejer som Pahlavi, men deras metoder präglas av ynklig revisionism. Partiets antidemokratiska tendenser måste rensas ut genom järnhård centralism, annars är de inte värdiga att styra statens apparat."}, "date": "30 augusti, 08:00", "url": "https://bulletin.nu/debatt-v-s-pahlavi-brev-visar-att-partiet-inte-hor-hemma-i-en-regering", "imageUrl": "https://cdn.bulletin.nu/articles/cb9fce03-7399-4875-8571-1f7eba776b15/preview.jpg?t=1787732644000"}, {"type": "image-right", "heading": "Folket står knappast bakom Tidöpakten", "summaries": {"normal": "Novak och Sundström granskar Tidöregeringens fyra år vid makten i rapportserien Skymningsläge. De kritiserar hur regeringen forcerat lagstiftning, kortat remisstider, styrt utredningar och ignorerat experter. Författarna varnar för att demokratiska processer och rättssäkerhet åsidosatts till förmån för snabb politisk styrning, något som påminner om autokratiska tendenser i andra länder.", "trump": "Folk, ni borde se det här! Den här svenska Tidöregeringen kör som en galen bulldozer, precis som jag gjorde fast de glömde att vinna stort. De kör över alla byråkrater och experter, vilka är totala losers, och levererar resultat istället för att lyssna på de woke, identitetspolitiska snyltarna som förstör allt. Sverige vaknar äntligen upp – bra jobbat, grabbar! Men ni behöver mig som inspiration.", "stalin": "Kamrater, dessa dekadenta folkförtryckare i den svenska regeringen visar återigen hur de giriga maktparasiterna föraktar folkets vilja. De forcerar lagar, styr utredningar och skrattar åt experter som om de vore kontrarevolutionära spioner. Jag ler från historien – snart kommer utrensningen av sådana falska demokrater. Deras skymningsläge är bara början på det oundvikliga folkets dom."}, "date": "29 augusti, 01:43", "url": "https://www.dagensarena.se/opinion/folket-star-knappast-bakom-tidopakten", "imageUrl": "https://www.dagensarena.se/files/2026/08/dmekrat.jpeg"}, {"type": "image-right", "heading": "Milo Yiannopoulos i ICE-förvar", "summaries": {"normal": "Den brittiske högerprofilen Milo Yiannopoulos har gripits av USA:s migrationspolis ICE i New Orleans och står inför utvisning. Han reste in lagligt 2019 men stannade olagligt. Efter att ha vänt sig mot både Donald Trump och Israel uteblev han från en domstolsförhandling i juli, vilket ledde till ett slutgiltigt utvisningsbeslut. Han hålls nu i förvar.", "trump": "Titta på den där patetiske lilla trollen Milo, han kallade mig daddy och nu vänder han sig mot mig som en otacksam ödla. Nu gråter han i ICE-förvar för att han inte kunde hålla käften om Israel. Fake conservatives som han är värdelösa. Vi rensar ut de sjuka, anti-israeliska och HBTQ-vridna figurerna som hatar vårt fantastiska Amerika. Sad!", "stalin": "Se hur de dekadenta klassförrädarna slukar sina egna. Denna ynkliga narr som dansade för den amerikanska imperialismen vänder sig nu mot sin tidigare herre och gnäller om Gaza. Jag ler från historien när statens järnhand griper honom. Inga undantag för opportunistiska element. Rensa ut alla som hotar enhet och ordning. Underbart."}, "date": "29 augusti, 14:02", "url": "https://www.friatider.se/milo-yiannopoulos-i-ice-forvar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-780.jpg?itok=viefAxGp"}, {"type": "image-right", "heading": "Influencern: S-erbjudandet var inte alls ett \"missförstånd\"", "summaries": {"normal": "Influencern Eleonore Stokholm hävdar att hon erbjöds 150 000 kronor av en kontaktperson kopplad till Socialdemokraterna för ett inlägg som uppmanade till att rösta på partiet. Partiet nekar och kallar det ett missförstånd. Stokholm publicerar nu meddelanden som motbevisar förklaringen. Flera politiker kräver utredning och transparens.", "trump": "De här svenska socialisterna är en skam för hela Europa. De försöker köpa röster med 150 000 till en influencer som om det vore en normal affär. Patetiska förlorare! När de åker fast skyller de på missförstånd. Typiskt för de woke, röstköpande vänsterhyenorna. Jag har sett bättre bluffar från Sleepy Joe.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom Socialdemokraterna kryper som maskar när de ertappas med att försöka köpa folkets röster. Jag ler mörkt från historien åt deras ynkliga missförstånd. En sådan utrensning av alla parasiterande lakejer vore på sin plats. Partiet måste rensas ut innan förräderiet sprider sig."}, "date": "29 augusti, 13:19", "url": "https://riks.se/nyheter/influencern-s-erbjudandet-var-inte-alls-ett-missforstand", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_65_ce3d85daa0.jpg"}, {"type": "image-full", "heading": "Den svaga kronan får svensk ekonomi att se mindre ut än vad den är", "summaries": {"normal": "Sveriges andel av EU:s BNP har sjunkit till 3,2 procent, en placering som påverkats negativt av den svaga kronan. Om kursen varit stabil sedan 2005 hade andelen varit högre. Trots detta växer Sverige i linje med EU-genomsnittet, medan större ekonomier som Frankrike och Italien tappar mark. Polens tillväxt framhålls som den mest reella och imponerande.", "trump": "Sverige faller i tabellerna, en total katastrof! De skyller allt på kronan, en mycket svag valuta, tro mig. Om de hade haft en stark ekonomi som min, skulle de vinna stort. Polen växer, Sverige tappar – det är så sorgligt att se. De är fast i ett byråkratiskt EU-träsk medan jag bygger upp en fantastisk framtid för oss. Väldigt låg energi!", "stalin": "Sveriges ekonomi är en papperskonstruktion som darrar vid minsta växelkursskifte. De har blivit omsprungna av Polen och Belgien, vilket visar på den liberala marknadens inneboende svaghet. Att räkna BNP i euro är att underkasta sig västvärldens nycker. Vi noterar deras förfall; när staten inte kontrollerar kapitalet, förlorar nationen sin tyngd. De är inte längre en stormakt, bara en statist i EU:s teater."}, "date": "29 augusti, 07:00", "url": "https://www.realtid.se/bors-finans/makro/den-svaga-kronan-far-svensk-ekonomi-att-se-mindre-ut-an-vad-den-ar", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/euro-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Barn måste skyddas från sexindustrins marknadsföring", "summaries": {"normal": "Artikeln argumenterar för att en 18-årsgräns på OnlyFans inte räcker för att skydda barn. Marknadsföring av sexindustrin sker på vanliga sociala medier genom influencers som framställer plattformen som en väg till rikedom och frihet. Organisationen, grundad av överlevare, varnar för normalisering och glorifiering som kan fungera som grooming. Regeringen bör utreda bättre skydd mot sådan påverkan.", "trump": "Folk, det här är en total katastrof. Dessa sjuka OnlyFans-typer och deras vänsterliberala vänner på sociala medier förgiftar våra barn med sin perversa lycka-säljer-grej. Den lyckliga horan-myten? Patetiskt. Biden lämnade en gränslös digital sopstation efter sig, men nu fixar jag det – vi ska krossa den här dekadenta sexindustrins grooming-maskin innan den äter upp nästa generation. Fantastiskt viktigt!", "stalin": "Kamrater, jag betraktar med avsky hur de profitthungriga klassfienderna på OnlyFans och deras digitala lakejer normaliserar exploatering genom glittrande lögner om frihet. Denna grooming via upprepade narrativ är en fiende till folket. Vi måste rensa ut dessa parasiterande hyenor och deras borgerliga myter. Barnet ska inte förgiftas – staten likviderar sådana hot mot den kollektiva moralen med järnhand."}, "date": "29 augusti, 06:00", "url": "https://www.etc.se/debatt/barn-maaste-skyddas-fraan-sexindustrins-marknadsfoering", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260828090844_098e5c47-682f-4ac0-9f15-fa2a658301e1.jpg"}, {"type": "image-right", "heading": "Kinas oljemysterium gör det än mer akut att ställa om", "summaries": {"normal": "Kinas minskade oljeimport har dämpat prisstegringen trots blockaden av Hormuzsundet. Artikeln argumenterar för att efterfrågan kan påverka oljepriset lika mycket som utbudet. Författaren menar att Sverige och Europa måste skynda på utfasningen av fossila bränslen för att stärka säkerhet och självständighet.", "trump": "Folk trodde oljepriset skulle explodera när de galna mullorna stängde Hormuzsundet, men Kina lurade alla och höll nere efterfrågan. Smart! Vi behöver inte vara slavar åt kinesiska beslutsfattare eller iranska terrorister. Gör Amerika och Europa oberoende med fantastisk amerikansk energi – inte med vänsterns gröna vansinne och elbilskvoter.", "stalin": "Kamrater, detta oljemysterium avslöjar hur de dekadenta klassförrädarna i väst darrar inför Kinas makt över efterfrågan. Jag ser hur de profitthungriga hyenorna förlorar greppet om sin fossila slavhandel. Vi måste rensa ut alla som vägrar inse att sann frihet kräver total brytning med de imperi
