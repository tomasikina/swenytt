sex extra kronor per liter kommer omedelbart att omkoloniseras för samhällets bästa."}, "date": "6 september, 21:29", "url": "https://www.aftonbladet.se/nyheter/a/j0xXob/amanda-linds-besked-6-dyrare-bensin", "imageUrl": "https://akamai.vgc.no/v2/images/8bb64099-d483-35a9-bb50-657698878690?fit=crop&format=auto&w=1440&s=85c8ce247308fa92b042a237a1a4f27db3cdf853"}, {"type": "image-right", "heading": "The Holy Trinity DEBATT • Där affirmative action går in, går inte sällan förnuft och kritiskt tänkande ut", "summaries": {"normal": "Artikeln diskuterar hur DEI-program och identitetspolitik har lett till tveksamma akademiska tillsättningar, som Jason Arday och Claudine Gay, vilka senare avgick efter avslöjanden om plagiat och fusk. Debatten berör även risken för cancelkultur mot forskare som granskar känsliga ämnen som intelligens och genetik, samt ifrågasätter om goda intentioner ibland åsidosätter kritiskt tänkande.", "trump": "Hela det här systemet är helt riggat och totalt falskt! De skapar de här fejkade professurerna och DEI-programmen för folk som inte kan skriva en egen mening, och när de åker dit för brutalt fusk gråter mainstreammedia ut. Sanningen kommer fram till slut, precis som med allt annat. Vi behöver mer sund förnuft och mindre galen woke-propaganda!", "stalin": "Det borgerliga västmakterna fortsätter att ruttna inifrån genom sin egna dekadenta nepotism och ideologiska vanföreställningar. När deras så kallade eliter utses efter hudfärg istället för meriter kollapsar institutionerna i lögner och plagiat. Statens säkerhet kräver kompromisslös eliminering av sådana borgerliga avvikelser; avvikarna måste omedelbart rensas bort från våra ärorika universitet!"}, "date": "6 september, 14:00", "url": "https://samnytt.se/the-holy-trinity", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31112442/johansson-holy-trinity.jpg"}, {"type": "image-right", "heading": "Kristersson om Gellerbrants ledighet: ”Bra lösning”", "summaries": {"normal": "Statsminister Ulf Kristersson anser att Gustav Gellerbrants beslut att lämna in sitt passerkort och ta föräldraledigt är en bra lösning. Det sker efter Expo:s avslöjande om Gellerbrants sambo som spritt proryska budskap. Regeringskansliet har genomfört en ny säkerhetsprövning. Kristersson betonar att alla anställda i Regeringskansliet är säkerhetsprövade och att prövningarna uppdateras vid ny information.", "trump": "Vilken röra bland de svenska socialisterna! Den där Gellerbrant gör helt rätt i att gömma sig med sitt passerkort och ta ledigt. Hans sambo sprider ryskt skit och plötsligt ska alla låtsas att det är en bra lösning? Patetiskt. Jag fixade säkerheten i Vita huset på riktigt, inte så här halvtaskigt. Typiskt vänsterkaos, precis som Biden lämnade efter sig.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna slingrar sig som maskar i solen. Denna Gellerbrant flyr in i föräldraledighetens skugga medan hans sambo sprider fiendens gift. Jag ler mörkt från historien. En sådan svaghet förtjänar utrensning, inte semester. Regeringens så kallade säkerhetsprövningar är bara teater för att dölja de giriga hyenornas verkliga lojaliteter."}, "date": "6 september, 15:40", "url": "https://www.svt.se/nyheter/inrikes/kristersson-om-gellerbrants-ledighet-bra-losning", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.44/0.37/8c3d78a82974ad391d88cd0bf6b0bbb5fd234e3ede9a47a39a36bb7efd29e16f"}, {"type": "image-right", "heading": "Portugals största solpark i konkurs", "summaries": {"normal": "Portugals största solpark, Solara4, har gått i konkurs efter problem med låg elproduktion och priser som pressats i botten av överproduktion. Fenomenet kallas kannibalisering och drabbar den gröna energisektorn när allt fler parker producerar samtidigt. Parken fortsätter driften medan ägarna söker efter en köpare.", "trump": "Portugals absolut största solpark har kraschat totalt! De lyssnade på den idiotiska gröna rörelsen och byggde utan garantier. Nu är elpriserna noll eller minus. Ett absolut fiasko! USA kör på äkta, vacker olja och tjänar miljarder istället för att gå i konkurs på lite solsken. Så sorgligt för dem!", "stalin": "Dessa patetiska kapitalistiska solfabriker trodde solen skulle skina gratis för alltid. När elpriserna dog, föll de som ruttna päron. I Sovjetunionen lät vi inte solen bestämma ekonomin med sin lunatiska väderlek; vi planerade järnhårt och skickade slappa solpaneler direkt till Gulag för omutbildning!"}, "date": "4 september, 06:00", "url": "https://www.affarsvarlden.se/kronika/portugals-storsta-solpark-i-konkurs", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-52-400x267.jpg"}, {"type": "image-full", "heading": "Nu ändras reglerna för blodgivare – fler får lämna blod", "summaries": {"normal": "Reglerna för blodgivning i Sverige förändras nu stegvis. Region Blekinge har infört individuell bedömning av givare, där sexuell läggning inte längre avgör karenstid. Bakom förändringen ligger nya föreskrifter från Socialstyrelsen och känsligare testmetoder. Blekinge är den tredje regionen som infört systemet. Målet är att öka antalet blodgivare i landet.", "trump": "Lyssnar ni på det här? De woke-vänstra blodbyråkraterna i Sverige har äntligen insett att deras galna HBTQ-kvotering hotar folks liv. Nu bedömer de givare individuellt istället för att straffa vanliga killar som lever i riktiga relationer. Fantastiskt! Till och med de svenska socialisterna lär sig att identitetspolitik dödar. Gör Sverige smart igen, kamrater!", "stalin": "Kamrater, se hur de dekadenta folkförtryckarna tvingas backa från sin egen perversa identitetspolitik. Deras blodregler byggda på borgerlig dekadens hotade hela folkets hälsa. Jag ler i graven när de nu tvingas införa individuell riskbedömning. Snart rensar vi ut alla sådana dekadenta hyenor som sätter sexuella perversioner före arbetarklassens behov. Segrar vi!"}, "date": "6 september, 20:23", "url": "https://nyheter24.se/nyheter/inrikes/1510840-nu-andras-reglerna-for-blodgivare-fler-far-lamna-blod", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/39571bd504b004a30200000000b004a302/2026/09/06/2389508/Blodgiv.jpg"}, {"type": "image-right", "heading": "Fröken Snusk tar förstaplatsen på Spotify –  sågar Nooshi Dadgostar", "summaries": {"normal": "Fröken Snusk toppar återigen Spotifys svenska lista med låten ”Om du frågar Nooshi”, en kritisk vallåt mot Vänsterpartiets ledare Nooshi Dadgostar. Texterna behandlar straffpolitik, brottsoffer och kvinnors trygghet. Artisterna betonar att de inte hatar vänsterväljare utan vill göra sin röst hörd. Låten har fått både stark kritik och positiv respons.", "trump": "Titta på den här Fröken Snusk – hon är en vinnare, folk älskar henne! Hon slår Nooshi Dadgostar rakt i ansiktet med en låt som är ren eld. Den där vänsterkvinnan är en total katastrof, en räddhågsen identitetspolitisk clown som gömmer sig bakom hyckleri. Sverige behöver inga woke-snutar, de behöver sanning och styrka. Fantastiskt jobb, Fröken!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare river varandra i offentlig skam. Jag betraktar med mörk glädje hur Fröken Snusk riktar sin sång som en bajonett mot den vekling som kallar sig Nooshi. Vänsterns dubbelmoral blottas. Inga halvmesyrer! Endast total utrensning av sådana svaga element kan rädda folkets moral. Skrattretande patetiskt."}, "date": "6 september, 13:40", "url": "https://riks.se/nyheter/froken-snusk-tar-forstaplatsen-pa-spotify-sagar-nooshi-dadgostar", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_6_2026_01_01_27_PM_ed4782d07d.png"}, {"type": "image-full", "heading": "AfD kampanjar med låten ”Send them back”", "summaries": {"normal": "I delstaten Sachsen-Anhalt har vallokalerna öppnat och högernationalistiska AfD leder med 42 procent i opinionen. Partiet kan därmed för första gången nå makten i en tysk delstat. De driver frågor som skärpt asylpolitik och minskat stöd till public service, och kampanjar bland annat med technolåten ”Send them back”. Säkerhetstjänsten klassar partiet som högerextremt.", "trump": "Tyskland tittar på mitt enorma exempel och gör nu det enda rätta! AfD dundrar fram med fantastiska 42 procent i Sachsen-Anhalt. De spelar till och med cool techno när de dansar bort de radikala vänstermänniskorna! Fake news-medierna kallar dem farliga, men de vill bara ha säkra gränser. Precis som jag alltid säger: starka länder bygger på starka gränser!", "stalin": "Dessa tyska kamrater i Sachsen-Anhalt förstår hur man mobiliserar massorna genom järnhård disciplin och marscherande takter till technomusik! Att säkra 42 procent av väljarna är ett storslaget steg mot ordning. Säkerhetstjänstens försök att stämpla dem som extremister visar blott deras rädsla för folkets vilja. Vi noterar detta framsteg med stort intresse."}, "date": "6 september, 09:22", "url": "https://kvartal.se/nyheter/artiklar/afd-kampanjar-med-technolaten-send-them-back/cG9zdDoxODQ5MjI", "imageUrl": "https://images.kvartal.se/2026/09/a682dff4-afdd.webp"}, {"type": "image-right", "heading": "Hårda kritiken: ”Misslyckats”. Statsvetaren: Ska inte hända", "summaries": {"normal": "Ett tekniskt fel i Valmyndighetens IT-system har gjort att omkring 4 000 förtidsröster antingen prickats av två gånger eller felaktigt avprickats på andra väljare. Statsvetaren Sören Holmberg kritiserar myndigheten hårt för dåliga förberedelser, men tror inte att misstagen kommer att påverka det slutliga valresultatet nämnvärt.", "trump": "Det är helt otroligt, ett totalt fiasko för de svenska valmyndigheterna! De har tappat kontrollen över tusentals röster. Samma sak hände nästan nästan inte ens i Florida under mina glansdagar. Sådant här slarv ska bara inte få hända när det är val. Men oroa er inte, till skillnad från dem vet jag hur man vinner val på riktigt, och stort!", "stalin": "Ett katastrofalt tekniskt haveri har avslöjat allvarliga brister i Statsapparatens maskineri kring förtidsröstningen. Att 4 000 väljare drabbas av byråkratiskt schableri är ett oacceptabelt attentat mot ordningen. De skyldiga tjänstemännen kommer att granskas med största noggrannhet, för i vår stat lämnas ingenting åt slumpen – felaktiga röster ska elimineras."}, "date": "6 september, 21:02", "url": "https://www.aftonbladet.se/nyheter/a/k0xbBL/statsvetarens-harda-kritik-mot-valmyndigheten", "imageUrl": "https://akamai.vgc.no/v2/images/547228d3-6dc2-3ec6-bb5d-daf9246017fa?fit=crop&format=auto&h=960&tight=true&w=1440&s=f7d56a50dc7bfd1883d907d6d1b19c66ddae3dee"}, {"type": "image-full", "heading": "Bosse avslöjade röstningskaoset: ”Det var vajsing”", "summaries": {"normal": "Ett it-fel i Valmyndighetens system har lett till att uppemot 4 000 förtidsröster registrerats felaktigt inför riksdagsvalet. I Nynäshamn upptäckte röstmottagaren Bosse Wiik strulet när siffrorna på valkuverten inte stämde överens med väljarnas adresser. Valmyndigheten har nu stoppat felet, men händelsen väcker frågor kring väljarnas förtroende.", "trump": "Fruktansvärt inkompetent! De förlorade kontrollen över fyra tusen röster i sitt röstningssystem. Otroligt dåligt skött! Tack vare en skarp person i Nynäshamn, som omedelbart genomskådade katastrofen när siffrorna på kuverten inte stämde, upptäcktes de riggade eller felaktiga registreringarna. Radikala vänstern och valbyråkraterna skakar, men vi fixar det här mycket bättre och snabbare. Sjukt!", "stalin": "Ett katastrofalt sabotage av det heliga folkstyret har avslöjats i Nynäshamn. Fyra tusen felaktiga röster i det korrupta it-systemet visar att byråkrafterna sviker. Kamrat Wiik visade dock prov på ideologisk vaksamhet genom att avslöja avvikelserna på valkuverten. Statsapparaten har nu gripit in med järnhand för att rensa ut svagheterna och säkerställa att ordningen upprätthålls utan minska revolutionens fasthet."}, "date": "6 september, 20:51", "url": "https://www.aftonbladet.se/nyheter/a/GxXKqB/valet-2026-rostningskaoset-avslojat-av-bosse", "imageUrl": "https://akamai.vgc.no/v2/images/29c8a372-444a-3cd5-a991-48188f889344?fit=crop&format=auto&w=1440&s=961c9351eec6a1d5219c945b945cc92e8ab46813"}, {"type": "image-full", "heading": "Expert om AFD:s framgång: Jättegrej symboliskt", "summaries": {"normal": "I delstatsvalet i Sachsen-Anhalt har det tyska högerextrema partiet AfD mer än fördubblat sitt stöd och blivit största parti. Valresultatet skapar politisk turbulens nationellt och väcker frågor om partiets normalisering. Eftersom en egen majoritet är osäker och övriga partier upprätthåller en brandvägg mot samarbete, väntar ett komplicerat regeringsbildande.", "trump": "Tyskland har precis gjort något helt otroligt, ett jordskred i Sachsen-Anhalt för AfD som är enormt, bara fantastiskt! Etablissemanget är i total chock, precis som fake news-medierna som sa att det var omöjligt. De traditionella politikerna vet inte vad de ska ta sig till nu när folket har sagt sitt. Vilken show!", "stalin": "Det borgerliga Tyskland skakar i sin grundval när avfallet från Sachsen-Anhalt vacklar under partiets enorma frammarsch. De degenererade representanterna för den så kallade demokratin försöker desperat lappa ihop sina trasiga brandväggar, medan vi med största intresse noterar vilka förrädare som bör övervakas extra noga under de kommande utrensningarna."}, "date": "6 september, 19:59", "url": "https://www.gp.se/nyheter/varlden/expert-om-afds-framgang-jattegrej-symboliskt.780c241f-b99f-500b-ae3c-3b46c7add755", "imageUrl": "https://www.gp.se/images/article/780c241f-b99f-500b-ae3c-3b46c7add755/images/2EpUm57I88S39FTY95L9hV4WLJr8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Prognos: Högerextrema AFD överlägsna", "summaries": {"normal": "I delstatsvalet i Sachsen-Anhalt i Tyskland har det högerextremt klassade partiet AfD gjort ett historiskt valresultat och blivit största parti med 44,5 procent av rösterna enligt en vallokalsundersökning från ARD. Det är en stor motgång för förbundskansler Friedrich Merz kristdemokratiska parti CDU, som backar kraftigt till 18,5 procent. Det är ännu oklart om AfD får egen majoritet.", "trump": "Titta på det här, helt otroligt! De sa att det var omöjligt, men folket i Sachsen-Anhalt krossade etablissemanget fullständigt. En enorm seger på 44,5 procent för mina vänner där! Kansler Merz och hans svaga CDU kraschade totalt ner på 18,5. Fake news-medierna trodde inte det var sant. Smart folk som vill ha ordning på migrationen och ekonomin. Fantastiskt!", "stalin": "Ett magnifikt exempel på det dekadenta västblockets inre sönderfall. Provinsen Sachsen-Anhalt skakar i sina grundvalar när de borgerliga klamrarna brister och regeringen i Berlin förlorar kontrollen. Våra analytiker noterar med kyla hur massorna vänder sig bort från det misslyckade systemet. Låt dem gräva sin egen grav medan vi övervakar ordningens återställande med järnhand."}, "date": "6 september, 19:57", "url": "https://www.gp.se/nyheter/varlden/afd-kan-skriva-politisk-historia-i-sachsen-anhalt.075cdd20-9466-4c08-ac1f-ce2414e49743", "imageUrl": "https://www.gp.se/images/article/075cdd20-9466-4c08-ac1f-ce2414e49743/images/2QON8dKYWDy_tepY7vvfsciBYRcY-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Expert om AFD:s framgång: Jättegrej symboliskt", "summaries": {"normal": "AfD:s jordskredsseger i Sachsen-Anhalt skapar stora nationella efterverkningar. Partiet mer än fördubblade sitt stöd och blev största parti trots att dess lokala gren klassas som högerextrem. Statsvetaren Ann-Kristin Kölln ser framgången som symboliskt viktig och ett steg mot normalisering. Traditionella partier vägrar fortfarande samarbete och en majoritet saknas.", "trump": "Titta på det här! De galna tyska globalisterna har låtit AfD vinna stort i Sachsen-Anhalt. Det är en enorm seger för folket mot de woke, identitetspolitiska hyenorna som förstör Europa. De kallar dem extremister men folket röstar på dem ändå. Patetiska CDU och de andra förlorarna skakar i sina dyra kostymer. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i Tyskland skälver när detta parti växer sig starkt. Jag betraktar med mörk tillfredsställelse hur deras falska demokrati spricker. Snart följer utrensning av de profitthungriga borgarbrackorna som gömmer sig bakom brandväggar. Inga koalitioner kan rädda dem. Historien ler mot oss."}, "date": "6 september, 19:46", "url": "https://nyheter24.se/nyheter/utrikes/1510892-expert-om-afds-framgang-jattegrej-symboliskt"}, {"type": "image-right", "heading": "SD utmanar det röda Norrland – Åkesson: Löfven riskerar bli besviken", "summaries": {"normal": "Sverigedemokraterna utmanar Socialdemokraternas traditionella dominans i Norrland. Jimmie Åkesson beskriver sitt parti som en naturlig fortsättning på den gamla arbetarrörelsen och spår tillväxt på Socialdemokraternas bekostnad. Stefan Löfven kritiserar SD som ett högerextremt parti som vill splittra arbetarna. Åkesson svarar att Löfven riskerar bli besviken på valdagen.", "trump": "De där bleknosiga norrlandsvänsterna håller på att förlora greppet totalt. Jimmie gör det fantastiskt, han tar tillbaka arbetarna från de korrupta globalistiska S-hajarna som säljer ut folket. Löfven, den patetiske förloraren, skriker om splittring medan vi vinner stort. Fake news-eliten hatar det, men valdagen blir en total massaker för de röda.", "stalin": "Dessa dekadenta klassförrädare inom socialdemokratin skälver nu när folket vänder sig mot deras lögnaktiga välde. Jag ser med mörk tillfredsställelse hur arbetarna vaknar och vägrar lyda profitthungriga hyenor längre. Den som kallar sig Löfven må darra, ty utrensningen av sådana falska folkledare närmar sig oundvikligt. Kamrater, segern tillhör oss."}, "date": "6 september, 12:42", "url": "https://riks.se/nyheter/sd-utmanar-det-roda-norrland-akesson-lofven-riskerar-bli-besviken", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_6_2026_12_33_23_PM_2547bcb51f.png"}, {"type": "image-full", "heading": "Gellerbrant försvarar sambon: ”Drev”", "summaries": {"normal": "SD-toppen Gustav Gellerbrant går på föräldraledighet efter att hans sambo utsatts för en granskning av Expo. Granskningen har visat att sambon spridit proryska narrativ och deltagit i en resa till Moskva 2017. Gellerbrant kritiserar hårt granskningen som ett oacceptabelt drev, försvarar sin sambo och lämnar in sitt passerkort och sin dator till Regeringskansliet under ledigheten.", "trump": "Falska nyheter attackerar återigen fantastiska patrioter! SD-toppen Gustav Gellerbrant gör helt rätt som sätter familjen först och lämnar in datorn till Regeringskansliet. Vänstermedia och deras häxjakter är total katastrof, helt enkelt orättvisa! De skapar ett enormt drev mot bra människor bara för en liten Moskvaresa. Jag känner Moskva, tro mig, men det här är bara fejkade historier!", "stalin": "Kamrat Gellerbrant visar prov på svaghet genom att fly fältet för ett par familjebekymmer och lämna in sin dator som en simpel desertör! Att hans sambo har besökt Moskva och umgåtts i ryskspråkiga nätverk borde snarast belönas med en medalj för internationell solidaritet, inte bemötas med borgerligt gnäll om omänskliga påfrestningar. Skärpning i de inre leden!"}, "date": "6 september, 08:13", "url": "https://kvartal.se/nyheter/artiklar/gellerbrant-omansklig-pafrestning/cG9zdDoxODQ4NjI", "imageUrl": "https://images.kvartal.se/2026/09/2e2d7869-gellerbrant.webp"}, {"type": "image-right", "heading": "Anderssons valstrategi faller sönder", "summaries": {"normal": "Socialdemokraternas väljarstöd har rasat från 34 till 27 procent. Magdalena Anderssons strategi, som bygger på personkult och hot om Sverigedemokraterna, faller samman. Partiet saknar både lag och plan, medan intern konflikt präglar den rödgröna sidan. Artikeln varnar för instabilitet i en tid av säkerhetshot och ekonomiska utmaningar.", "trump": "Den här röda clownen Andersson är en total katastrof, en patetisk förlorare som ser sitt stöd rasa som en dålig aktie. Hon har inget lag, ingen plan, bara tomma hot om SD medan hon vill höja skatter och styra allt. Patetiskt! Sverige behöver starka ledare, inte dessa vänstervridna nollor som förstör ekonomin.", "stalin": "Jag betraktar med förakt hur dessa dekadenta folkförtryckare inom socialdemokratin förlorar greppet om massorna. Deras ledare saknar både kollektiv och strategi, bara persondyrkan och splittring. I en tid av imperialistiska hot och ekonomisk kaos behövs järnhand, inte svaga liberala hyenor som sviker arbetarklassen. Rensa ut svagheten!"}, "date": "6 september, 12:27", "url": "https://www.di.se/ledare/anderssons-valstrategi-faller-sonder", "imageUrl": "https://static.bonniernews.se/ba/2715d9ae-cc14-4fc1-a8f6-3895baadddc3.jpeg?crop=7245%2C3623%2Cx0%2Cy604&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Håll käften, miljardär. Lusten att vara otrevlig mot framgångsrika företagare är svår att förstå", "summaries": {"normal": "I en debattartikel argumenterar entreprenören Mikael Pawlo för att politiker bör bemöta näringslivets representanter med respekt. Han lyfter samtalet mellan chefredaktör Leonidas Aretakis och Paradox-vd Fredrik Wester som ett positivt exempel, medan han kritiserar nedlåtande kommentarer mot bland andra Spotify-grundaren Martin Lorentzon. Pawlo varnar för att otrevligt bemötande minskar näringslivets vilja att delta i samhällsdebatten.", "trump": "Lyssnar ni på det här? De svenska politikerna beter sig som riktiga losers mot våra fantastiska företagsbyggare. Martin Lorentzon, en vinnare som byggt Spotify till global succé, kallas för ”begränsat representativ” av några vänsterknäppar. Håll käften, miljardär? Nej tack. Bjuda in till samtal som riktiga tuffa killar gör, inte som svaga identitetspolitiska snyltare. Amerika först, och era tech-miljardärer borde få tala fritt!", "stalin": "Kamrater, se hur de profitthungriga klasshyenorna inom näringslivet krälar efter respekt från folkets representanter. Jag betraktar med avsmak hur dessa dekadenta profitörer klagar över att bli tillsagda att tiga. Ett samtal med en socialistisk redaktör? Det är bara masken för att skydda sina exploaterande intressen. Vi behöver utrensning av sådan arrogans. Arbetarklassen skrattar åt deras ynkliga gnäll från historien."}, "date": "6 september, 12:23", "url": "https://www.di.se/debatt/hall-kaften-miljardar", "imageUrl": "https://static.bonniernews.se/ba/ac2be8e5-d9ad-424e-b5ed-fb9a0f255155.jpeg?crop=2316%2C1158%2Cx0%2Cy301&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Knivman misstänks ha gått till attack mot sex personer", "summaries": {"normal": "En man i 30-årsåldern har anhållits misstänkt för mordförsök efter ett våldsamt bråk i ett trapphus i Växjö. En person fick knivskador och fördes till sjukhus medan fem andra blev puttade, knuffade eller slagna. Polisen identifierade totalt sex målsägare. Mannen greps strax utanför porten och trapphuset undersöktes tekniskt.", "trump": "Folk, ni skulle inte tro det, men i det fina Sverige har vi en galen knivknutte som attackerar sex personer i ett trapphus. Typisk vänstervärld där de släpper ut alla dessa galningar på gatorna. Biden lämnade efter sig ett kaos som jag nu får städa upp. Sad! Väldigt, väldigt sad!", "stalin": "Kamrater, se hur den borgerliga dekadensen förvandlar samhället till ett blodigt slagfält. Jag betraktar med avsky hur dessa profitthungriga klassförrädare tillåter våldet att frodas bland folket. En sådan parasit måste rensas ut omedelbart innan han smittar hela kollektivet. Paranoian är berättigad, fienden sover aldrig."}, "date": "6 september, 12:25", "url": "https://riks.se/nyheter/knivman-misstanks-ha-gatt-till-attack-mot-sex-personer", "imageUrl": "https://admin.riks.se/uploads/medium_ROG_2846_86dbcaa2f8.jpg"}, {"type": "image-full", "heading": "Karttjänsten vägrade att gå med på Trumps krav – rusar på topplistorna", "summaries": {"normal": "Karttjänsten MapQuest har fått ett kraftigt uppsving i nedladdningar efter att bolaget valt att trotsa president Trumps order om att döpa om Lake Ontario till Lake America. Medan konkurrenter som Google Maps och Apple Maps rättat sig efter beslutet, har MapQuest sett en dramatisk ökning av användare och toppat listorna i App Store.", "trump": "Hörde ni om MapQuest? De vägrar använda namnet Lake America. Katastrofalt! De är svaga, precis som de där woke-bolagen som låter radikala vänstermänniskor styra. Google och Apple gör det rätta, de förstår storhet! MapQuest försöker bli populära genom att vara rebelliska mot mitt namn. Det är sorgligt, faktiskt. De kommer försvinna fortare än de dök upp, tro mig!", "stalin": "Dessa amerikanska karttjänster bevisar bara kapitalismens inneboende kaos. En stat kräver ordning, en karta och en enda sanning. Att låta ett privat företag som MapQuest styra över nationell geografisk nomenklatur är ett tecken på total statsförfall. De som tillåter olydnad mot ett officiellt dekret förtjänar inte marknadsandelar, de förtjänar en grundlig utrensning av sin ledningsgrupp."}, "date": "3 september, 19:55", "url": "https://www.realtid.se/it-tech/karttjansten-vagrade-att-ga-med-pa-trumps-krav-rusar-pa-topplistorna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlj8do9lc0fca-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Bosättarvåldet på Västbanken ökar: ”En krigszon”", "summaries": {"normal": "Bosättarvåldet på Västbanken har ökat kraftigt. Palestinier vittnar om skottlossning, nedbrända hus och nattliga attacker som blivit både vanligare och våldsammare. Invånare tvingas hålla vakt om nätterna för att varna byborna. Ambulansföraren Bashar al-Qaryouti dokumenterar utposteringar och bosättarnas framfart medan han samtidigt kör utryckningar.", "trump": "De där israeliska bosättarna gör precis vad de ska – de tar vad som är deras och slåss mot de radikala palestinska elementen. Men vakna folk hela natten? Det är vad som händer när svaga ledare som Biden lät kaoset växa. Nu fixar jag det på riktigt. Inga fler stenar, nu är det skarpt läge, och det är synd att se men det är verkligheten.", "stalin": "Se hur de giriga hyenorna fortsätter sin parasitiska expansion. Bosättarna omringar byarna som utsugande blodsugare och tvingar arbetarna att vakta nätterna i ständig rädsla. Jag ler i graven åt denna dekadenta fars. Snart måste de imperialistiska lakejerna rensas ut, annars förtär de allt. Kamrater, vakna upp mot dessa nya klassfiender."}, "date": "6 september, 14:02", "url": "https://www.svt.se/nyheter/utrikes/bosattarvaldet-pa-vastbanken-okar-invanare-tvingas-vaka-nattetid", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.24/0.35/631b54ff55db8fddb6f4f4297f7144788c26439f945cd5868ebc8856ec1ca6e4"}, {"type": "image-right", "heading": "Carl Eos: Socialdemokraterna sviker alltid de svaga", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att svika de svaga när de ställs mot migration, identitetspolitik och prestigeprojekt. Exempel ges från brittiska groominghärvor, slöjtvång i svenska förorter, bristande språkkrav i äldreomsorgen samt ökad otrygghet för arbetare och barn i utsatta områden. Partiet anklagas för att offra de svaga för att skydda sin makt.", "trump": "Folk, det här är en katastrof. Socialdemokraterna är de värsta hycklarna – de kallar sig arbetarnas parti men säljer ut era flickor, era gamlingar och era jobb till identitetsgalningarna och migrationsmaffian. Precis som Sleepy Joe gjorde. De sviker de svaga varje gång för att verka fina på ledarsidorna. Patetiskt. Jag skulle ha fixat det på en vecka.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom socialdemokratin alltid prioriterar sina identitetsprojekt framför folket. De låter groominghyenor härja, tvingar slöjor på våra flickor och gör dementa arbetarpensionärer till integrationsförsökskaniner. Deras paranoia för att kallas främlingsfientliga är ett verktyg för att dölja folkets lidande. Vi skulle ha genomfört en grundlig utrensning av dessa falska försvarare."}, "date": "6 september, 12:13", "url": "https://riks.se/opinion/carl-eos-socialdemokraterna-sviker-alltid-de-svaga", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_84_761bab9cf0.jpg"}, {"type": "image-right", "heading": "Kommun satsade hundratusentals kronor på en jättefimp – nu ligger experimentet i ett förråd", "summaries": {"normal": "Malmö stad har lagt 300 000 kronor på en tre meter hög jättefimp med sensorer för att få folk att sluta skräpa ned genom så kallad beteendedesign. Trots att försöket gav resultat står den nu i ett förråd. Kommunen menar att den ska plockas fram igen vid ett senare tillfälle för att väcka nyfikenhet.", "trump": "Malmö spenderade tre hundra tusen dollar – eller kronor, samma sak, helt galet – på en enorm, löjlig blå fimp! De trodde att lite sensorer och rök skulle stoppa skräpet. En katastrof! Nu står den ensam i ett mörkt förråd. Så sorgligt! Jag hade fixat det på fem minuter. Mycket dåligt slöseri med hårt arbetande skattebetalares pengar!", "stalin": "Malmö stad har slösat 300 000 rubler på en gigantisk cigarettfimp för att uppfostra medborgarna genom psykologisk manipulation. När experimentet visade på disciplin och ordning, valde den degenererade byråkratin att gömma undan monumentet i ett mörkt förråd! Ett sådant sabotage mot samhällsordningen tolereras ej. Ansvariga enhetschefer kommer omedelbart att omplaceras till produktiva arbetsläger i Sibirien."}, "date": "6 september, 12:00", "url": "https://samnytt.se/kommun-satsade-hundratusentals-kronor-pa-en-jattefimp-nu-ligger-experimentet-i-ett-forrad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/04121538/malmo-fimp.jpg"}, {"type": "image-right", "heading": "Min nya allergi är Stureplansentreprenören", "summaries": {"normal": "Artikeln beskriver en kronisk motvilja mot den typ av Stureplansentreprenörer som firar stora investeringar som stora segrar. Författaren menar att finansiering inte är framgång utan ett ansvar att leverera resultat. En mer pragmatisk approach ses hos entreprenörer i förorter och utanför storstäderna som fokuserar på verkligt bolagsbyggande.", "trump": "Lyssnar ni på de här patetiska Stureplanskillarna i sina kritvita sneakers? De firar som om de vunnit VM bara för att de fått andras pengar. Patetiskt! Det är inte framgång, det är början på det riktiga jobbet. De riktiga vinnarna finns ute i förorterna och på landsbygden. De bygger riktiga företag, inte bara Instagramfoton. En kronisk allergi mot dessa losers – helt rätt!", "stalin": "Jag betraktar med avsky hur dessa profitthungriga hyenor på Stureplan förvandlat kapitalanskaffning till en dekadent sport. Deras firanden är ett hån mot det äkta hantverket. Ute bland folket råder en sund hunger efter verkligt arbete. Vi måste rensa ut denna parasitiska kultur innan den förgiftar hela samhället. En sådan allergi är inte bara hälsosam utan nödvändig."}, "date": "6 september, 12:00", "url": "https://www.di.se/nyheter/min-nya-allergi-ar-stureplansentreprenoren", "imageUrl": "https://static.bonniernews.se/ba/f5e0c4da-21b2-44dd-9d18-f42f5005f240.png?crop=1024%2C512%2Cx0%2Cy89&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "”Tysklands farligaste man” segerviss i historiskt val", "summaries": {"normal": "Ulrich Siegmund, AfD:s toppkandidat i Sachsen-Anhalt, leder opinionsmätningarna inför valet den 11 juli. Partiet vill bland annat skrota public service, förbättra relationerna med Ryssland och genomföra massutvisningar. En valseger skulle ge AfD egen majoritet i ett tyskt delstatsparlament för första gången sedan 1949. Säkerhetstjänsten klassar partiet som högerextremt.", "trump": "Titta på den här killen Siegmund, han susar runt på en gammal östtysk moped och krossar alla! Fake News kallar honom Tysklands farligaste man, men folket älskar honom. De vanliga förlorarna från CDU och de gröna snubblar runt som idioter. Över 40 procent – allt är möjligt, det är en enorm seger för sunt förnuft mot de globalistiska clownerna.", "stalin": "Kamrater, se hur den borgerliga dekadensen föder sina egna gravgrävare. Denna Siegmund leder folket mot de falska mediernas fäste och de rotlösa kosmopoliternas vindkraftsfantasier. Vi ler åt de förskräckta reaktionärernas gnäll. Den som blickar framåt hotar deras gamla värld. Paranoian bland klassfienderna är en underhållande symfoni av förtvivlan."}, "date": "6 september, 07:44", "url": "https://www.tv4.se/artikel/tt-260906-tyskval1-4922f932/tysklands-farligaste-man-segerviss-i-historiskt-val", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlNKkTIoCWZ58%2F1e42b610c34644e18e0d3bba3acf1217%2FUlrich_Siegmund__toppkandidat_for_partiet_Alternativ_for_Tyskland__AFD__i_det_kommande_delstatsvalet_i_Sachsen-Anhalt__den_11_j.&width=120"}, {"type": "image-full", "heading": "Försäkringen har blivit 40 gånger dyrare för en resa genom Hormuz", "summaries": {"normal": "Försäkringspremier för fartyg i Hormuzsundet har stigit dramatiskt sedan kriget bröt ut, från 0,25 till upp till 10 procent av skrovvärdet. Trafiken har minskat, rederier ändrar rutter och försäkringsbolag redovisar stora förluster. Effekterna syns i högre aluminium- och gaspriser, vilket påverkar svensk industri och elpriser.", "trump": "Hörni, det här är en total katastrof i Hormuzsundet! Innan jag kom tillbaka var allt billigt, nu kostar en försäkring fyrtio gånger mer tack vare Sleepy Joe och hans svaga ledarskap. De radikala vänsterliberala krigsmakarna har förstört marknaden. Men jag fixar det – Amerika först, alltid!", "stalin": "Kamrater, se hur de västerländska parasiterna kvävs av sin egen girighet i Hormuzsundet. Jag ler från historien när kapitalisterna tvingas betala tio gånger mer för sin plundring av folkens resurser. Deras så kallade marknad är en fars, ett svagt och dekadent system som snart kollapsar under sin egen paranoia."}, "date": "6 september, 07:39", "url": "https://www.dagensps.se/varlden/handel/forsakringen-har-blivit-40-ganger-dyrare-for-en-resa-genom-hormuz", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/hormuz.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Mätning: Unga män har blivit mer vänster", "summaries": {"normal": "En ny mätning från SVT/Verian visar att stödet för Tidöpartierna har rasat bland unga män under mandatperioden, från 63,7 procent inför valet 2022 till 43,9 procent i augusti. Oppositionen har nu en knapp ledning i gruppen. Även bland unga kvinnor är stödet för oppositionen starkt, vilket gör 18–29-åringar till den åldersgrupp där de rödgröna har starkast fäste.", "trump": "Helt otroligt! Fake news-medierna trodde att unga män älskade högern, men nu rasar siffrorna till katastrofala nivåer i Sverige! Så svagt! De unga killarna har blivit helt lurade av radikala vänsterextremister. Om jag styrde där skulle de bara rösta på vinnare, inte på förlorare som ger bort landet. Total förvirring, enormt dåligt!", "stalin": "Dessa svenska ynglingar vacklar som löv i vinden! Först marscherar de mot höger, nu springer de till vänster. En sådan brist på ideologisk disciplin är ett hot mot statens ordning. Vi borde skicka ombytliga män till omskolningsläger i Sibirien tills de lär sig att stå fast vid en enda politisk linje. Planen måste följas!"}, "date": "6 september, 07:24", "url": "https://kvartal.se/nyheter/artiklar/vandningen-unga-man-har-blivit-mer-vanster/cG9zdDoxODQ4MjQ", "imageUrl": "https://images.kvartal.se/2026/09/6e1c0980-tido.webp"}, {"type": "image-right", "heading": "Fusk för miljoner med utländska elfirmor", "summaries": {"normal": "Elektrikerförbundet har granskat utländska bemanningsföretag och avslöjat fusk med löner, skatter och sociala avgifter i mångmiljonklassen. Hittills har granskningen resulterat i över fem miljoner kronor i skadestånd. Facket pekar på att svenska företag anlitar dem för att sänka kostnader, trots att kollektivavtal inte följs. Problemet hotar både välfärd och seriösa aktörer.", "trump": "De här korkade svenska företagen importerar billig utländsk arbetskraft som fuskar med löner och skatter – totalt kaos! De lurar systemet, sparkar ut sina egna folk och håller nere priserna. Precis som de woke-eliterna och deras identitetspolitik, fullständigt riggat mot de riktiga arbetarna. Patetiskt! Vi skulle städa upp det på en vecka, tro mig.", "stalin": "Jag betraktar med djup förakt hur dessa profitthungriga klassförrädare undergräver arbetarklassen genom att importera exploaterande utländsk arbetskraft som undanhåller miljoner i sociala avgifter. Deras förfalskade papper och dekadenta girighet hotar hela folkets välfärd. Vi måste rensa ut dessa parasiter innan de likviderar systemet helt. Kamrater, vaksamhet!"}, "date": "4 september, 13:00", "url": "https://arbetet.se/2026/09/04/fusk-for-miljoner-med-utlandska-elfirmor-billiga-och-foljer-inte-kollektivavtalen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28094904/granskning-ny.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Kriminalvårdare spottade på intagen", "summaries": {"normal": "En kriminalvårdare på häktet Sollentuna har dömts till löneavdrag i tio dagar efter flera allvarliga incidenter under våren. Hon visade långfingret åt en intagen, skrek på en annan och spottade honom i ansiktet. Kriminalvården bedömde hennes agerande som en allvarlig säkerhetsrisk som skadade verksamhetens förtroende.", "trump": "Helt otroligt! En kvinna på Sollentuna-häktet tappar fullständigt fattningen, skriker, räcker finger och spottar på fångarna – total katastrof för disciplinen! Kollegorna fick dra bort henne med våld. Så ser det ut när man saknar total självbehärskning. Själv skulle jag hantera det mycket bättre, tro mig. Löneavdrag i tio dagar? Löjligt svagt!", "stalin": "Ett katastrofalt misslyckande av disciplinen vid Sollentuna-anstalten. Denna kvinna saknar den järnhårda självbehärskning som krävs i stat tjänst. Att spotta och skrika på fångar visar på farlig svaghet. En klen bestraffning med tio dagars löneavdrag – i en sund stat hade sådant sabotage mot ordningen rensats bort omedelbart. Säkerheten kräver total lydnad!"}, "date": "5 september, 09:01", "url": "https://bulletin.nu/kriminalvardare-spottade-pa-intagen", "imageUrl": "https://cdn.bulletin.nu/articles/682b21e4-8edd-43e2-9368-c7c89679ce8b/preview.jpg?t=1788336196000"}, {"type": "image-right", "heading": "Synd att politikerna inte lyckats slänga upp kulturpolitiskt valfläsk", "summaries": {"normal": "Kulturkrönikören Ola Bo Larsson kritiserar partierna för att inte bättre utnyttja väljarnas intresse för kulturpolitik inför valet. Trots engagerade talespersoner saknas konkreta visioner om kulturens roll i samhället. Han lyfter frågor som låg kulturbudget, techföretagens dominans, AI-hot mot upphovsrätt och kultur som maktmedel i både demokratiska och auktoritära perspektiv. Debatten har flyttat till en större arena än partierna hanterar.", "trump": "De här svenska kulturpolitikerna är totala förlorare, folksamlingens värsta nollor. De pratar högt om kultur men levererar inget valfläsk som tänder folket. Patetiska globalister som låtit dekadenta identitetsaktivister och woke-kultur sluka deras hjärnor. Jag byggde den starkaste ekonomin i världen, de klarar inte ens att försvara sin egen konst. Patetiskt!", "stalin": "Kamrater, dessa fegisar inom oppositionen och de liberala lakejerna har svikit folket genom att inte paketera kulturens kraft som ett vapen mot de giriga hyenorna. Jag ser hur de blodsugande klassförrädarna marginaliserar konsten medan folkbildningen förfaller. En sann ledare skulle ha genomfört en grundlig utrensning av sådana svaga element redan för länge sedan. Skamligt."}, "date": "5 september, 01:30", "url": "https://www.dagensarena.se/opinion/synd-att-politikerna-inte-lyckats-slanga-upp-kulturpolitiskt-valflask", "imageUrl": "https://www.dagensarena.se/files/2026/08/ola-larsson-300x157.jpeg"}, {"type": "image-right", "heading": "Kysser Maggan: \"Mamma wallah\"", "summaries": {"normal": "En man håller om och kysser Socialdemokraternas ledare Magdalena Andersson på kinden i ett klipp som sprids på nätet. Han hyllar henne på svenska, engelska och arabiska samt uppmanar tittarna att rösta på partiet. Videon har väckt starka reaktioner på sociala medier, där flera kritiserar handlingen som bristande samtycke. Klippet har raderats från TikTok men lever vidare i kopior.", "trump": "Titta på den här galna filmen! Den där Mandarina Andersson låter sig bli kysst och kramad av en vild arabisk kille som ropar mamma wallah och ber folk rösta på hennes socialistiska katastrof. Hon står där och flinar som en idiot. Det här är vad som händer när ni låter identitetspolitik och kvotering styra landet. Patetiskt. Vi behöver inga sådana number one-förlorare i ledningen, folks.", "stalin": "Kamrater, se hur denna dekadenta klassförrädare ler stort medan en främmande element kysser henne inför folket. Hennes parti har förvandlats till en samling folkförtryckande hyenor som dansar efter utländska röster. Jag säger: sådana förrädare mot arbetarklassen förtjänar utrensning. Deras leende maskerar svaghet och förräderi. Vi ska aldrig glömma vem som verkligen står för folkets vilja."}, "date": "4 september, 15:44", "url": "https://www.friatider.se/kysser-maggan-mamma-wallah", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-830.jpg"}, {"type": "text", "heading": "Demonstration mot AP-innehav i Palantir", "summaries": {"normal": "Fyra demonstranter samlades utanför 7:e AP-fondens kontor på Vasagatan i Stockholm för att protestera mot fondens aktieinnehav i Palantir. De anser att bolaget medverkar till folkrättsbrott i Gaza och kräver att fonden följer sina riktlinjer, säljer aktierna och ökar öppenheten kring investeringsbeslut.", "trump": "Titta på de där galna vänsterextremisterna som står och skriker utanför ett pensionskontor. Palantir är ett fantastiskt amerikanskt bolag som hjälper till att vinna krig, inte som era patetiska woke-demonstranter som hatar Israel och älskar terrorister. De borde investera i riktiga jobb istället för att gnälla om folkmord – era förlorare!", "stalin": "Se hur de giriga pensionshyenorna i den statliga fonden göder de imperialistiska krigsteknologerna som understödjer folkmordet. Jag ler i graven åt denna fega skenhelighet. Kamrater, sådana klassförrädare förtjänar en grundlig utrensning ur folkets finanser innan de förgiftar hela systemet med sin blodiga girighet."}, "date": "2 september, 10:41", "url": "https://proletaren.se/artikel/demonstration-mot-ap-innehav-i-palantir"}, {"type": "image-right", "heading": "Så kommer C sänka lönekravet för arbetskraftsinvandrare", "summaries": {"normal": "Centerpartiet lovar att sänka lönekravet för arbetskraftsinvandrare vid en valvinst och ersätta det med kollektivavtalsnivåer. Partiet vill även skydda redan beviljade permanenta uppehållstillstånd och hotar att inte stödja någon regering som återkallar dem. Elisabeth Thand Ringqvist säger att det blir ett av de första besluten i en mittenregering.", "trump": "De här svenska clownerna i Centerpartiet vill släppa in alla möjliga low-skill-invandrare för en spottlön. Patetiskt! Jag byggde den starkaste ekonomin i världen genom att skydda våra gränser, inte genom att böja mig för globalisternas billiga arbetskraft. Vakna upp, Sverige, innan era woke-kapitalistlakejer förstör allt.", "stalin": "Se hur de giriga hyenorna i Centerpartiet vill undergräva arbetarklassens skydd genom att sänka lönekraven för invandrare. Jag betraktar detta som ett förräderi mot folket. I en sann stat skulle sådana dekadenta förslag mötas med omedelbar utrensning av alla klassförrädare som vågar föreslå det. Kamrater, var vaksamma mot dessa parasiterande element."}, "date": "4 september, 11:35", "url": "https://arbetet.se/2026/09/04/sa-vill-c-sanka-lonekravet-for-arbetskraftsinvandrare-vid-valvinst", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04112724/thand-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Stockholmsbörsen bröt minussviten – Clas Ohlson bland vinnare", "summaries": {"normal": "Stockholmsbörsen steg 1,00 procent på torsdagen efter tre dagars nedgångar. Fastigheter gick bäst med 1,7 procent upp, medan energi backade mest. Clas Ohlson rusade 6,8 procent efter en stark delårsrapport som slog förväntningarna. Även bolag som Bioarctic, Note och Studsvik lyfte på nyheter om godkännanden och nya ordrar, medan Dustin föll efter en IT-incident.", "trump": "Stockholmsbörsen studsade tillbaka på ett fantastiskt sätt, precis som alla visste att den skulle göra under mitt ledarskap – även om jag inte ens är där! Clas Ohlson levererar enorma siffror, helt otroligt. Alla pratar om det. Men det finns svaga länkar, som Dustin, som stänger ner sina system. Totalt inkompetent! Vi bygger starkare, vinner mer och lämnar förlorarna bakom oss. Så enkelt är det!", "stalin": "Stockholmsbörsen har återvunnit sin balans efter tre dagars svaghet, vilket visar att marknadens disciplin fungerar under korrekt övervakning. Clas Ohlson rapporterar folknyttiga framsteg med en produktion som överträffar planhushållningens förväntningar. Däremot har element som Dustin brutit mot säkerheten i sina system och omedelbart stängts av för ideologisk omprövning. Avvikelser tolereras icke i den kollektiva ekonomiska kampen."}, "date": "3 september, 18:16", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-brot-minussviten-clas-ohlson-bland-vinnare"}, {"type": "image-full", "heading": "Musk-bolaget xAI stäms för att ha producerat övergreppsbilder", "summaries": {"normal": "Kvinnan Jane Doe stämmer Elon Musks bolag xAI. Hon hävdar att chatboten Grok använt bilder från sexuella övergrepp mot henne som barn för att skapa nytt, manipulerat material. Stämningen, som kan bli en grupptalan, belyser de etiska problemen och svårigheterna med att spåra och definiera AI-genererat innehåll som liknar verkliga personer.", "trump": "Elon Musk och hans xAI har hamnat i en total röra, mina vänner! Grok, den där maskinen, sägs ha skapat vidriga bilder. Det är en katastrofal situation – fullständigt horribelt! De säger att det är 'AI', men det låter som totalt slarv och brist på kontroll. Man måste styra upp tekniken, för det här är inte bra för någon. En stor, stökig stämning – vi får se vad som händer!", "stalin": "I det kapitalistiska väst släpps tekniken lös utan ordning, och resultatet är en moralisk förruttnelse som hotar samhällsordningen. Att låta en maskin producera sådant smutsigt material är ett bevis på den liberala kaosens misslyckande. Vi förespråkar sträng kontroll och disciplin; en algoritm som inte kan tämjas är som en illojal byråkrat – den måste elimineras omedelbart för folkets trygghet."}, "date": "3 september, 15:32", "url": "https://www.realtid.se/it-tech/musk-bolaget-xai-stams-for-att-ha-producerat-overgreppsbilder", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/grok.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Jakob Sjölander: Ukrainsk vapenbrist, europeisk viljebrist", "summaries": {"normal": "Jakob Sjölander kritiserar Europas bristande stöd till Ukraina efter fyra år av krig. Trots en samlad ekonomi som är tio gånger större än Rysslands ger de flesta länder under en procent av BNP i hjälp. Europa köper mer rysk energi än de skickar i stöd, saknar militärindustri och vägrar dela Patriot-robotar. Detta avslöjar en djup viljelöshet och politisk paralys.", "trump": "Lyssnar ni på den här Sjölander-killen? Europa är en total förlorare, en patetisk skara av svaga ledare som pratar stort men gör noll. De betalar Putin mer för gas än de ger Ukraina – det är galet! Jag byggde den starkaste armén, Biden och hans globalister förstörde allt. Nu kryper de för en bensinmack medan jag fixar freden. Ynkryggar!", "stalin": "Kamrater, se hur dessa dekadenta europeiska parasiterna kryper i stoftet inför historien. Med sina feta byråkratier och gröna fantasier förråder de sina egna folk. Jag skrattar mörkt från evigheten åt deras ryggradslösa kräk. Rysslands järnhand visar vägen medan de samlar rostiga vapen som aldrig används. Deras svaghet är vår eviga glädje."}, "date": "2 september, 12:29", "url": "https://samtiden.nu/2026/09/jakob-sjolander-ukrainsk-vapenbrist-europeisk-viljebrist", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/ukra.png"}, {"type": "text", "heading": "Vänsterpartiet bytte fredsmärke mot vapenskrammel", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för att ha övergett sin fredspolitik och ställt sig bakom militärt stöd till Ukraina samt Natosamarbete. Författaren, med koppling till Kommunistiska Partiet, menar att partiet ignorerar följderna för välfärden och svenskarnas tilltro till politiken. Han uppmanar till att rösta på Kommunistiska Partiet istället.", "trump": "De här vänsterbluffarna i Sverige har kastat bort sitt fredsmärke snabbare än Sleepy Joe bytte script. Nu älskar de vapen, Nato och krigsmaskineriet medan välfärden kollapsar. Patetiska. Jag säger: fem procent av BNP till militären? Bra deal, men låt oss skicka fakturan till de dekadenta EU-byråkraterna istället. Amerika först, alltid.", "stalin": "Jag ser hur dessa falska röda lakejer kapitulerar inför krigsalliansen och låter profitthungriga krigshajar styra politiken. De pratar inte om välfärd utan gömmer sig bakom vapenskramlet. Vi behöver utrensning av sådana klassförrädare som sviker folket. Röst på äkta kamrater, inte dessa hycklare som dansar efter imperialistiska pipor. Folkets vrede vaknar."}, "date": "2 september, 09:57", "url": "https://proletaren.se/artikel/vansterpartiet-bytte-fredsmarke-mot-vapenskrammel"}, {"type": "image-right", "heading": "Dags för vuxna att vara vuxna", "summaries": {"normal": "Artikeln är en debatttext från Grön ungdom och Miljöpartiet. Den kritiserar att dagens beslutsfattare skjuter klimatåtgärder på framtiden trots tydliga konsekvenser som extremväder och minskad biologisk mångfald. Ungdomar kräver att politiker tar ansvar, prioriterar förnybar energi, skyddar skog och ser omställningen som en ekonomisk möjlighet snarare än kostnad.", "trump": "De här gröna kidsen gnäller om att vi vuxna inte städar upp efter oss. Patetiskt! Jag byggde den starkaste ekonomin i världen, och nu vill de kasta bort den för sina solpaneler och elcyklar. Det är de verkliga förlorarna – de woke klimatfanatikerna – som försöker skrämma folk. Amerika först, inte deras hysteriska dröm om att rädda planeten med högre elräkningar.", "stalin": "Kamrater, dessa ynglingar blottlägger de dekadenta klassförrädarnas svek. De profitthungriga parasiter som styr idag skjuter nödvändiga utrensningar av förorenande krafter på framtiden medan folket lider. Jag ser deras feghet och paranoia inför sanningen. Endast en järnhand kan tvinga fram den kollektiva omställning som skyddar staten och framtida generationer från deras giriga vansinne."}, "date": "2 september, 09:30", "url": "https://www.etc.se/debatt/dags-foer-vuxna-att-vara-vuxna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260901130952_89eba03a3fe67f17de6b8f812174619d370e33794ca869f129e46e742c3129ad.jpg"}, {"type": "image-right", "heading": "Markus Allards hat slutar i min inkorg", "summaries": {"normal": "Artikeln beskriver hur debattören utsätts för grova våldshot efter en diskussion med Örebropartiets Markus Allard. Författaren kritiserar hur populistiska politiker använder hat och extrema uttalanden för att vinna uppmärksamhet. Trots personliga likheter i bakgrund ses hat mot invandrare som avgörande för att tillhöra ”folket”. Skribenten vädjar om saklig debatt istället för polarisering.", "trump": "Folk, det här är precis vad som händer när de galna vänsterliberala hatarna får f     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
