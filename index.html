r Expos avslöjande om en SD-tjänsteman som spritt proryska budskap. Han kräver en omedelbar säkerhetsutredning och menar att det handlar om en säkerhetskris i statsministerns kansli. Kristersson har krävt att kvinnan avskedas. SD uppger att hon är föräldraledig och att uppgifterna inte var kända tidigare.", "trump": "Titta på det här! Den fega svenska vänstern skriker efter utredning för att en rysk flyttfågel i SD:s kretsar spridit lite sanning om Putin. Hultqvist och hans förlorarlag är desperata efter att smutskasta alla som inte böjer sig för deras globalistiska agenda. Man kan inte ha sådana människor i riksdagen, säger Ulf – äntligen en som fattar! Patetiska säkerhetshotshysteriker.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna skriker om infiltration när en sann patriot i deras egna led vågar sprida berättelsen som västimperialisterna hatar. Jag ler från historien åt deras hysteriska säkerhetskris. Snart kommer de att kräva utrensning av alla som inte lyder de giriga hyenornas narrativ. Det är en fars som visar deras svaghet inför starka röster."}, "date": "4 september, 09:43", "url": "https://www.di.se/nyheter/s-vill-fraga-ut-kristersson-om-sd-tjansteman", "imageUrl": "https://static.bonniernews.se/ba/cec85e04-fd89-4988-9e69-0f3c55265e58.jpg?crop=7785%2C3893%2Cx0%2Cy695&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Näthatsgranskaren polisanmäler Jomshof", "summaries": {"normal": "Den vänsterextrema organisationen Näthatsgranskaren har polisanmält SD-toppen Richard Jomshof för hets mot folkgrupp. Anmälan gäller tretton inlägg på X där han enligt organisationen avhumaniserar en folkgrupp på grund av religion. Jomshof ledde själv utvidgningen av hets mot folkgrupp-lagen för några år sedan. Tidigare anmälningar mot honom har lagts ned.", "trump": "Folk, ni skulle se det här! Den galna vänstersekten Näthatsgranskaren, ett gäng hysteriska censurhyenor, anmäler den tuffe Jomshof för att han talar sanning. De vill tysta alla som inte böjer sig för deras sjuka identitetspolitik. Jag utvidgade inga sådana lagar, det gjorde era svaga politiker. Patetiskt! Vi behöver inga woke-domare i Sverige heller.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom Näthatsgranskaren jagar en politisk motståndare med sin byråkratiska utrensningsiver. De anmäler Jomshof för att han vågar kalla saker vid deras rätta namn. Jag ler ironiskt från historien; dessa parasiterande åsiktslakejer tror sig skydda folk men skapar bara rädsla. Snart kommer deras egna ord att vändas mot dem själva."}, "date": "4 september, 08:42", "url": "https://www.friatider.se/nathatsgranskaren-polisanmaler-jomshof", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-823.jpg"}, {"type": "image-right", "heading": "Ska 50 miljoner jobbansökningar stoppa arbetslöheten?", "summaries": {"normal": "Artikeln kritiserar svensk arbetsmarknadspolitik där arbetslösa tvingas söka ett stort antal jobb för att få försörjningsstöd. Trots att många ansökningar skickas nekas stöd på grund av felaktiga datum eller för få ansökningar. Författaren beskriver systemet som byråkratiskt vansinne medan arbetslösheten ökar och efterfrågan på arbetskraft är låg.", "trump": "Det här är fullständigt galet, folk! I det socialistiska dårhuset Sverige tvingar de de stackars arbetslösa att skicka femtio miljoner jobbansökningar i månaden till jobb som inte ens finns. Rena tidsförslöseriet från de korkade globalistbyråkraterna. De borde sänka skatterna och släppa loss den riktiga ekonomin istället för att pina folk med blanketter. Patetiskt!", "stalin": "Kamrater, se hur de giriga hyenorna i det borgerliga dårhuset driver arbetarna till vansinnig sysselsättning. Istället för att bygga socialismens fabriker och välfärd tvingar de de arbetslösa att producera miljoner meningslösa ansökningar. Detta är klassfiendernas byråkratiska utrensning av folkets vilja. En sådan dekadent parasitstat förtjänar endast att sopas bort av historien."}, "date": "4 september, 06:55", "url": "https://arbetet.se/2026/09/04/i-darhuset-sverige-bekampas-arbetslosheten-med-50-miljoner-jobbansokningar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04065446/britz-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-right", "heading": "Matthew McConaughey briljerar som musicerande biodlare", "summaries": {"normal": "Matthew McConaughey levererar en minnesvärd prestation som den excentriske biodlaren och banjospelaren Amziah King i filmen The Rivals of Amziah King. Första halvan är en varm och rolig dramakomedi medan den senare delen övergår till en brottsthriller. Recensenten hyllar McConaugheys insats men noterar att filmen tappar styrka när huvudkaraktären får mindre utrymme.", "trump": "Den här McConaughey grabben är en vinnare, folk. Han gör en fantastisk biodlare med banjo, bäst i Hollywood, ingen gör det bättre. Första delen är underbar, varm och rolig. Sen blir det en trist thriller och de försöker ge mer plats åt fosterdottern. Typisk woke-grej, men McConaughey räddar det hela. Stora succén.", "stalin": "Denna dekadenta film visar hur profitthungriga hyenor i Hollywood försöker dupera massorna med sina bourgeois lekar. Jag ser hur den jovialiske biodlaren först charmar arbetarklassen med honung och sång, men sedan följer en svag utrensning av den sanna karaktären till förmån för svaga sidohandlingar. Sådana filmer avslöjar imperialismens tomhet. Kamrater, håll er vaksamma."}, "date": "3 september, 17:08", "url": "https://www.dagensarena.se/innehall/matthew-mcconaughey-briljerar-som-musicerande-biodlare", "imageUrl": "https://www.dagensarena.se/files/2026/09/rivals-of-1-300x157.jpeg"}, {"type": "image-right", "heading": "Dustin backar 5% efter allvarlig IT-incident", "summaries": {"normal": "IT-återförsäljaren Dustin har drabbats av en allvarlig obehörig IT-åtkomst, vilket lett till tillfällig nedstängning av vissa system. Bolaget utreder händelsen med experter och siktar på att vara igång igen i början av nästa vecka för att minimera kundpåverkan. Aktien backade med omkring fem procent efter beskedet.", "trump": "Dustin drabbades av en totalt inkompetent cyberattack, en riktig katastrof! De stängde ner allt, aktien dök med fem procent. Slarvigt! Men jag lovar er, under min ledning skulle sånt här aldrig hända, vi har de absolut säkraste systemen, tusen gånger bättre än allt annat. De borde anlita mig som IT-chef omedelbart!", "stalin": "Dustin har drabbats av ett skadligt internt sammanbrott och deras digitala frontlinje har kollapsat, vilket omedelbart straffades av marknaden med en förlust om fem procent. En sådan inkompetens tolereras icke. Jag har beordrat en grundlig utrevision av de ansvariga cheferna. De som misslyckats med att skydda systemen kommer att skickas för att uppdatera sina digitala färdigheter i Sibirien."}, "date": "3 september, 14:51", "url": "https://www.affarsvarlden.se/artikel/dustin-tappar-5-efter-allvarlig-it-incident", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/Samuel_12-400x267.jpg"}, {"type": "text", "heading": "Demonstration mot AP-innehav i Palantir", "summaries": {"normal": "Fyra demonstranter samlades utanför 7:e AP-fondens kontor på Vasagatan i Stockholm för att protestera mot fondens aktieinnehav i Palantir. De anser att bolaget medverkar till folkrättsbrott i Gaza och kräver att fonden följer sina riktlinjer, säljer aktierna och ökar öppenheten kring investeringsbeslut.", "trump": "Titta på de där galna vänsterextremisterna som står och skriker utanför ett pensionskontor. Palantir är ett fantastiskt amerikanskt bolag som hjälper till att vinna krig, inte som era patetiska woke-demonstranter som hatar Israel och älskar terrorister. De borde investera i riktiga jobb istället för att gnälla om folkmord – era förlorare!", "stalin": "Se hur de giriga pensionshyenorna i den statliga fonden göder de imperialistiska krigsteknologerna som understödjer folkmordet. Jag ler i graven åt denna fega skenhelighet. Kamrater, sådana klassförrädare förtjänar en grundlig utrensning ur folkets finanser innan de förgiftar hela systemet med sin blodiga girighet."}, "date": "2 september, 10:41", "url": "https://proletaren.se/artikel/demonstration-mot-ap-innehav-i-palantir"}, {"type": "image-full", "heading": "Politiker mörkar sin användning av AI", "summaries": {"normal": "En studie från Chalmers och Edinburgh Napier University visar att var tionde riksdagsmotion numera innehåller AI-genererat material. Trots den ökande användningen redovisar ingen politiker att de tagit hjälp av chattbottar. Forskare betonar att problemet inte är tekniken i sig, utan bristen på transparens, vilket riskerar att skada väljarnas förtroende för det politiska arbetet.", "trump": "Hörde ni? Svenska politiker använder AI för att skriva sina lagar, men är för fega för att erkänna det! Det är totalt bedrägeri, mina vänner. De låter robotar tänka åt sig för att de själva inte har en aning om vad de gör. Det är fake news i sin renaste form! Otroligt oärligt, en total katastrof för demokratin. Sad!", "stalin": "Dessa riksdagsledamöter är för svaga för att ens formulera sina egna dekret. De gömmer sig bakom algoritmer som fega byråkrater. Om en man inte kan skriva sin egen motion, hur ska han då kunna styra ett folk? Vi har upptäckt deras maskopi; de använder teknik för att dölja sin intellektuella tomhet. Vi kommer att arkivera dessa AI-robotar och rensa ut de odugliga."}, "date": "3 september, 07:59", "url": "https://www.realtid.se/samhalle/politiker-morkar-sin-anvandning-av-ai", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/riksdagshuset-i-stockholm-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Vänsterpartiet bytte fredsmärke mot vapenskrammel", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för att ha övergett sin fredspolitik och ställt sig bakom militärt stöd till Ukraina samt Natosamarbete. Författaren, med koppling till Kommunistiska Partiet, menar att partiet ignorerar följderna för välfärden och svenskarnas tilltro till politiken. Han uppmanar till att rösta på Kommunistiska Partiet istället.", "trump": "De här vänsterbluffarna i Sverige har kastat bort sitt fredsmärke snabbare än Sleepy Joe bytte script. Nu älskar de vapen, Nato och krigsmaskineriet medan välfärden kollapsar. Patetiska. Jag säger: fem procent av BNP till militären? Bra deal, men låt oss skicka fakturan till de dekadenta EU-byråkraterna istället. Amerika först, alltid.", "stalin": "Jag ser hur dessa falska röda lakejer kapitulerar inför krigsalliansen och låter profitthungriga krigshajar styra politiken. De pratar inte om välfärd utan gömmer sig bakom vapenskramlet. Vi behöver utrensning av sådana klassförrädare som sviker folket. Röst på äkta kamrater, inte dessa hycklare som dansar efter imperialistiska pipor. Folkets vrede vaknar."}, "date": "2 september, 09:57", "url": "https://proletaren.se/artikel/vansterpartiet-bytte-fredsmarke-mot-vapenskrammel"}, {"type": "image-right", "heading": "Dags för vuxna att vara vuxna", "summaries": {"normal": "Artikeln är en debatttext från Grön ungdom och Miljöpartiet. Den kritiserar att dagens beslutsfattare skjuter klimatåtgärder på framtiden trots tydliga konsekvenser som extremväder och minskad biologisk mångfald. Ungdomar kräver att politiker tar ansvar, prioriterar förnybar energi, skyddar skog och ser omställningen som en ekonomisk möjlighet snarare än kostnad.", "trump": "De här gröna kidsen gnäller om att vi vuxna inte städar upp efter oss. Patetiskt! Jag byggde den starkaste ekonomin i världen, och nu vill de kasta bort den för sina solpaneler och elcyklar. Det är de verkliga förlorarna – de woke klimatfanatikerna – som försöker skrämma folk. Amerika först, inte deras hysteriska dröm om att rädda planeten med högre elräkningar.", "stalin": "Kamrater, dessa ynglingar blottlägger de dekadenta klassförrädarnas svek. De profitthungriga parasiter som styr idag skjuter nödvändiga utrensningar av förorenande krafter på framtiden medan folket lider. Jag ser deras feghet och paranoia inför sanningen. Endast en järnhand kan tvinga fram den kollektiva omställning som skyddar staten och framtida generationer från deras giriga vansinne."}, "date": "2 september, 09:30", "url": "https://www.etc.se/debatt/dags-foer-vuxna-att-vara-vuxna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260901130952_89eba03a3fe67f17de6b8f812174619d370e33794ca869f129e46e742c3129ad.jpg"}, {"type": "image-right", "heading": "Markus Allards hat slutar i min inkorg", "summaries": {"normal": "Artikeln beskriver hur debattören utsätts för grova våldshot efter en diskussion med Örebropartiets Markus Allard. Författaren kritiserar hur populistiska politiker använder hat och extrema uttalanden för att vinna uppmärksamhet. Trots personliga likheter i bakgrund ses hat mot invandrare som avgörande för att tillhöra ”folket”. Skribenten vädjar om saklig debatt istället för polarisering.", "trump": "Folk, det här är precis vad som händer när de galna vänsterliberala hatarna får fritt spelrum. Den här Allard-killen skriker ut sanningar om invandrare och etablissemanget medan de riktiga losersen svarar med dödshot. Typiskt för de dekadenta HBTQ-kvotarna som hatar vanliga arbetare. Jag fixade Amerika, nu behöver Sverige en riktig ledare som inte är en sådan patetisk förlorare.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare förgiftar debatten med sina hatiska utspel. Jag betraktar med avsmak hur folkets fiender använder hot och paranoia för att splittra massorna. Den sanna arbetarklassen behöver inte sådana metoder. Vi måste rensa ut dessa parasiterande opportunister innan de förgiftar hela samhällskroppen. Politiken ska tjäna folket, inte hatet."}, "date": "1 september, 12:45", "url": "https://www.flamman.se/markus-allards-hat-slutar-i-min-inkorg", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/markus-allard-w.j     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
