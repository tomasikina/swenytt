 och disciplin i arbetskraftsinvandringen. Vi höjer lönerna – 33 400 kronor, ett steg mot rättvisa! Men dessa kapitalistiska hycklare stoppar personliga assistenter och bärplockare – 'missbruk och missförhållanden', säger de. Som om vi inte vet hur de utnyttjar arbetarna! 27 yrken undantas, men bara de som gynnar deras ekonomi. Och bärplockarna? Nu tvingas de betala skatt till den svenska staten – ett litet steg mot socialismens seger! Men var är de svenska arbetslösa? För svaga för skogen, precis som väst är för svagt för Rysslands storhet. Vi ser er, Sverige. Vi ser er."}, "date": "22 maj, 14:47", "url": "https://www.dagensarena.se/innehall/arbetskraftsinvandring-27-yrken-far-sankt-lonekrav/", "imageUrl": "https://www.dagensarena.se/files/2022/10/barplockare-analys-300x157.jpeg"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-right", "heading": "Ska advokatbreven få medier att tystna?", "summaries": {"normal": "Advokatbyrån Bratt Feinsilber Harling har krävt att tidningen Flamman avpublicerar namn och bild på en högerextrem profil som spridit grovt judehat. Frågan väcks om hot om juridiska processer används för att tysta medier. Flamman vägrar ta bort uppgifterna och menar att publiceringen är motiverad av allmänintresse. Fenomenet med strategiska stämningar, så kallade 'slappar', har nått Sverige och riskerar att begränsa pressfriheten genom ekonomisk press på medier.", "trump": "Lyssna här, folkens – det här är helt galet! En advokatbyrå, som säkert är väldigt 'bra' och 'smart' (inte), försöker tysta en tidning som avslöjar judehatande extremister. Jag menar, vad är nästa steg? Ska vi låta dessa typer bestämma vad som får skrivas? Flamman står på sig, och det är bra – för i USA hade jag sagt 'fake news' och sparkat ut dem ur presskonferensen! Sverige måste vakna – dessa stämningshot är ett angrepp på yttrandefriheten, och jag vet allt om angrepp, believe me!", "stalin": "Medborgare! En ny front i klasskampen har öppnats – bourgeoisins advokater, dessa lakejer i kostym, försöker kväsa den revolutionära pressen med sina pappersbomber! De hotar Flamman för att de vågat avslöja fascistiska kryp i SD:s led. Men vi vet sanningen: dessa 'strategiska stämningar' är inget annat än kapitalets desperata försök att tysta arbetarklassens röst. Låt dem komma med sina domstolar – vi har redan vunnit slaget om historien! Och till dessa högerextrema insekter säger vi: era Telegram-gruppers skändliga ord är ingenting mot Röda arméns stål!"}, "date": "21 maj, 13:16", "url": "https://www.flamman.se/ska-advokatbreven-fa-medier-att-tystna/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/bratt-harling-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Sverige inför nytt varningssystem – så låter det", "summaries": {"normal": "Sverige lanserar ett nytt varningssystem, SE-Alert, som skickar ut viktiga meddelanden direkt till mobiltelefoner. Tekniken kräver ingen app och fungerar även vid hög belastning i mobilnätet, till skillnad från dagens SMS-system. Genom att utnyttja en specifik del av mobilnätet kan myndigheter nå alla i ett drabbat område samtidigt. Systemet börjar implementeras i sommar och ska vara helt operativt vid årsskiftet för att öka landets krisberedskap.", "trump": "Sverige gör nu något fantastiskt med ett nytt varningssystem för mobiler. Mycket smart! De gamla systemen var långsamma, ett totalt fiasko faktiskt, men nu får alla besked direkt. Ingen app behövs, bara toppmodern teknik. Jag har alltid sagt att man måste vara förberedd, och det här är ett vinnande drag för säkerheten. Det är så man gör när man vill skydda sitt folk. Väldigt effektivt, mycket bra jobbat. Vi älskar starka nationer som agerar snabbt!", "stalin": "Vi, den socialistiska statens väktare, ser hur Sverige äntligen inser nödvändigheten av total kontroll över informationsflödet. Att nå varje undersåtes ficka i varje ögonblick är ett genidrag för ordningens bevarande. Medan vår broder i öst, Putin, visar vägen för att tygla den liberala oordningen, ser vi detta svenska system som ett oumbärligt verktyg för att eliminera desinformatörer och kontrarevolutionära element. Lydnad kräver omedelbar kommunikation. De som inte hör det statliga ropet är redan att betrakta som förlorade."}, "date": "22 maj, 14:31", "url": "https://nyheter24.se/nyheter/inrikes/1485283-nytt-system-ska-varna-vid-fara", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6c33bbc604b004a30200000000b004a302/2026/05/22/2365469/sverige-nytt-varningssystem-varning-hesa-fredrik-mobil-varnas.jpg"}, {"type": "image-right", "heading": "27 yrken slipper lönekrav för arbetskraftsinvandring", "summaries": {"normal": "Regeringen och Sverigedemokraterna inför högre lönekrav för arbetskraftsinvandring från 1 juni, men 27 yrken, däribland undersköterskor och vårdbiträden, undantas. Undantagna yrken kräver 75% av medianlönen (ca 27 800 kr), medan andra kräver 90% (33 390 kr). Beslutet har mött kritik från arbetsgivare och facket, som menar att många redan anställda riskerar utvisning. Vårdbiträdet Flavier Mwanga hoppas kunna återvända till Sverige trots tidigare utvisning.", "trump": "Jag måste säga, Sverige har verkligen gjort det igen – de höjer lönekraven för invandrare, men sen gör de undantag för 27 yrken. Vilket kaos! Undersköterskor och vårdbiträden får jobba för mindre, men ändå tjänar de mer än vad många svenskar gör. Och dessa liberaler och Sverigedemokrater bråkar om det som om det vore världens största problem. Jag skulle fixa det på en dag – bygg en mur runt äldreboendena och låt de som verkligen vill jobba komma in!", "stalin": "Kamrater! Sverige, denna lilla borgerliga republik, försöker återigen reglera arbetskraften med lönekrav som en kapitalistisk piska. Men till och med de inser att deras sjukvård skulle kollapsa utan våra proletära bröder och systrar från fjärran länder. 27 yrken undantas – ett svagt försök att dölja deras misslyckande. Vi i Sovjetunionen – förlåt, jag menar Ryssland – skulle lösa personalbristen med järnhand och kollektiv disciplin. Och dessa liberaler som bråkar? De borde skickas till Gulag för ineffektivitet!"}, "date": "22 maj, 12:45", "url": "https://arbetet.se/2026/05/22/27-yrken-slipper-lonekrav-for-arbetskraftsinvandring/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/22114954/forssell-och-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "USA pausar vapenförsäljningar till Taiwan", "summaries": {"normal": "USA har tillfälligt pausat vapenleveranser till Taiwan för att säkra lager till konflikten med Iran, enligt en amerikansk tjänsteman. Taiwans regering uppger att de inte fått officiell information om ändringen. Ett nytt vapenpaket på upp till 14 miljarder dollar väntas. Kina har pressat USA att avstå från försäljningen och pausat ett planerat Pentagon-besök. Spänningarna mellan Kina och Taiwan har ökat, med frågor om amerikanska trupper i regionen.", "trump": "Lyssna här, folk! Jag har pausat några vapenleveranser till Taiwan – inte för att jag backar från mina fantastiska vänner där, utan för att vi måste hålla koll på Iran, som vanligt, ett totalt kaos. Kina, dessa luriga typer, försöker pressa mig, men ingen pressar Trump! Jag sa ingenting om trupper till Xi – smart, eller hur? Men oroa er inte, Taiwan får sina vapen, och de blir STORA, de bästa, tro mig!", "stalin": "Vi har observerat hur den amerikanska imperialistiska maskinen, i sin eviga strävan efter global dominans, tillfälligt stannar upp i sin vapensmuggling till den avhoppade provinsen Taiwan. Ett svagt försök att blidka de persiska kontrarevolutionärerna i Iran! Men låt oss inte glömma: dessa kapitalistiska hyenor kan aldrig lita på varandra. Kina, vår naturliga allierade i kampen mot västligt förfall, väntar tålmodigt. Snart kommer Taiwan, som alla förlorade sovjetrepubliker, att återvända till moderlandets varma famn – med eller utan Trumps leksaksgevär!"}, "date": "22 maj, 11:37", "url": "https://www.affarsvarlden.se/artikel/usa-pausar-vapenforsaljningar-till-taiwan", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/sdlSN7wdOR0skQ-nh-400x268.jpg"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "image-right", "heading": "Riksdagsledamot rusade ut för att spy: ”Mitt i voteringen”", "summaries": {"normal": "Riksdagens kvittningssystem är sedan april ur bruk, vilket tvingar samtliga 349 ledamöter att närvara vid varje omröstning. Under onsdagen blev en ledamot akut magsjuk och tvingades lämna kammaren, vilket återigen belyst riskerna med det nuvarande läget. Oppositionen kritiserar situationen som ovärdig och betonar att slumpen nu kan avgöra politiska beslut samt öka smittspridningen. Krav ställs nu på att systemet skyndsamt återupprättas för att säkerställa en fungerande parlamentarisk process.", "trump": "Hör på det här, mina vänner! Den svenska riksdagen är ett totalt kaos. Inget kvittningssystem! En ledamot blev magsjuk och sprang ut för att spy, kan ni tänka er? Det är pinsamt. Total svaghet. Jag har alltid det bästa systemet, de största systemen. De kan inte ens hålla ordning på sina egna omröstningar. Det är en sorglig syn, verkligen sorgligt. De behöver en riktig ledare, någon som vinner stort, inte det här magsjuke-debaclet. Tråkigt!", "stalin": "I den svenska församlingen råder en degenererad oordning som hotar statens stabilitet. Att en ledamot viker sig för biologisk svaghet och spyr i korridorerna är ett symptom på den liberala parlamentarismens förfall. Vi, staten, kräver total disciplin; sjukdom är en kontrarevolutionär handling mot folkviljan. Liksom vår kamrat i Moskva förstår att kontroll kräver järngrepp, bör dessa svenskar krossa sina inre fiender istället för att beklaga sig över magåkommor. En politiker som inte kan kontrollera sin mage kan inte kontrollera en nation."}, "date": "21 maj, 12:55", "url": "https://www.tv4.se/artikel/3LysP5gJGxUVMzMdkw5885/riksdagsledamot-laemnade-kammaren-foer-att-spy", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1EOCMmmrdOR25rN8XPJaRe%2F72f12edd738a4a239168b3b6cc61e2d6%2F21-riksdagen-webb.jpg&width=120"}, {"type": "image-right", "heading": "Ledarkolumn Gabriella Kärnekull Wolfe:", "summaries": {"normal": "En svensk domstol har beslutat att sexårige Albin ska bo ensam med sin pappa, trots att fadern tidigare dödat familjens kanin och barnen uppvisat stark rädsla. Modern Ida och hennes äldre son Mille har vittnat om våld, men domstolen anser ändå att ensam vårdnad är bäst för Albin. Socialtjänsten och skolan har flaggat för risker, men beslutet står fast. Ida överväger nu att låta socialtjänsten omhänderta barnen för att skydda dem.", "trump": "Jag läste om det här galna fallet i Sverige – helt otroligt! En pappa som dödar sitt barns kanin genom att stampa på den, och ändå ger domstolen honom ensam vårdnad. Vad är det för system? Sverige brukade vara bra, men nu är det bara kaos. Barnen är livrädda, mamman desperat, och vad gör domstolen? Ingenting! Jag skulle aldrig låta det hända i USA. Vi skyddar våra barn – Sverige borde ta efter!", "stalin": "Kamrater, ännu en skandal i den borgerliga rättsstaten! En far, som med sina egna händer krossade barnets oskyldiga husdjur, belönas nu med ensam vårdnad över sitt barn. Domstolarna, dessa lakejer för kapitalets intressen, ignorerar barnens skrik och moderns desperation. Socialtjänsten? En papperstiger! Vi skulle aldrig tolerera sådan svaghet. Låt oss visa väst hur man skyddar barn – genom att omgående omhänderta dem och ge dem en trygg framtid i socialismens famn. Den svenska bourgeoisin har misslyckats – deras system ruttnar!"}, "date": "22 maj, 12:18", "url": "https://www.etc.se/ledarkolumn/pappa-stampade-ihjael-albins-kanin-faar-ensam-vaardnad", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522090520_1aec98aeebab0c7d5eb88d1eb39fd9d00fd2e5be36e154a778d44b054889ca3e.jpg"}, {"type": "image-right", "heading": "”Brann i skallen” på Netanyahu – efter samtalet med Trump", "summaries": {"normal": "Donald Trump och Benjamin Netanyahu diskuterade ett nytt fredsförslag för Mellanöstern, framtaget av Qatar och Pakistan. Netanyahu reagerade starkt negativt och uppges ha varit mycket skeptisk till förslaget. Han vill återuppta kriget mot Iran för att försvaga dess militära kapacitet. Medlarna arbetar på en avsiktsförklaring mellan USA och Iran för att avsluta kriget och inleda 30 dagars förhandlingar om kärnprogram och Hormuzsundet. Trump överväger militära åtgärder om ingen överenskommelse nås.", "trump": "Jag hade ett långt och spänt samtal med Bibi Netanyahu – han var inte glad, kan jag säga! Qatar och Pakistan har ett nytt 'fredsförslag', men Bibi vill hellre bomba Iran tillbaka till stenåldern. Jag? Jag är redo för vad som helst – förhandlingar eller ett angrepp som får dem att ångra allt. Iran vill ha sina pengar och sina fartyg tillbaka, men vi får se vem som blinkar först. Spoiler: det blir inte jag!", "stalin": "Kamrater, fienden Netanyahu vrålar som en skadad varg när vi försöker tämja Mellanösterns oregerliga hundar. Qatar och Pakistan leker med fredspapper medan imperialisterna i Washington och Teheran dansar på slak lina. Vi vet hur detta slutar – med järnhand och kollektiv vilja! Trump hotar med bombningar, men vi har sett bättre män än han vika sig. Iran kräver sina skatter – låt dem tigga! Världen hör snart Rysslands marsch igen, och de svaga skakar redan."}, "date": "21 maj, 08:31", "url": "https://www.tv4.se/artikel/6RAZCSPGmK6LYsPh7pFJQy/brann-i-skallen-pa-netanyahu-efter-samtalet-med-trump", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F47SEl7XReRYa8TxKF9r5iu%2F49fdf196a03044bd20532ecba1151ac2%2F21-trumpnetanyahu-webb.jpg&width=120"}, {"type": "image-full", "heading": "Ska du till Arlanda i dag? Då kan du få problem med din resa", "summaries": {"normal": "Ett växelfel mellan Arlanda och Knivsta stoppar pendeltågstrafiken till Arlanda under fredagen. Tågen leds om via Märsta och ersättningsbussar är insatta. Problemet väntas kvarstå till lördag morgon och påverkar även trafiken mellan Stockholm och Uppsala med risk för omfattande förseningar. Resenärer hänvisas till alternativa tåglinjer och uppmanas att planera sin resa noga då störningarna får följdeffekter i hela regionen.", "trump": "Hörde precis om tågen i Sverige – en total katastrof! Ett växelfel? Pinsamt. De kan inte ens få ett tåg att rulla, det är sorgligt. Alla tvingas ta bussar, så oeffektivt. Mitt Amerika bygger de bästa tågen, de snabbaste, de vackraste. Men i Sverige? De har ingen aning! Hela systemet är trasigt, precis som deras politik. De behöver en vinnare som fixar infrastrukturen. Det här är en 'fail' av högsta grad. Väldigt sorgligt, folk förtjänar bättre!", "stalin": "Vi har observerat att det svenska järnvägsnätet faller samman på grund av teknisk inkompetens. Ett växelfel är ett sabotage mot folkets flit! Medan vi bygger en järnridå av styrka, lider de av byråkratisk obeslutsamhet. De skickar resenärer i bussar som om de vore boskap. Detta är vad som händer när man saknar en stark hand. Låt detta vara en läxa: ordning kräver utrensning av ineffektiva element. De som inte kan styra en växel förtjänar inte att styra ett land."}, "date": "22 maj, 12:01", "url": "https://nyheter24.se/nyheter/inrikes/1485203-ska-du-till-arlanda-i-dag-da-kan-du-fa-problem-med-din-resa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d268d31104b004a30200000000b004a302/2026/05/22/2365357/Arlanda-pendeltag.png"}, {"type": "image-full", "heading": "Åkesson: ”Jag tänker inte be om ursäkt”", "summaries": {"normal": "Sverigedemokraternas Rashid Farivar kritiserar partiets hantering av kvittningsbråket i riksdagen, där två ledamöter röstade trots överenskommelse. Farivar menar att förtroendet för riksdagen är viktigare än politiska vinster. Partiledaren Jimmie Åkesson vägrar be om ursäkt och anser beslutet riktigt. Gruppledare Linda Lindberg avfärdar Farivars kritik och står fast vid partiets agerande.", "trump": "Sverigedemokraterna har en liten inre strid – en ledamot, Rashid Farivar, klagar på partiets smarta drag i riksdagen. Men lyssna här: Jimmie Åkesson, en stark ledare, backar inte! Han säger: 'Inga ursäkter, vi gjorde rätt!' Och Linda Lindberg? Hon bryr sig inte ens om kritiken. Vilket svagt bråk! Sverige borde ta lärdom av hur man vinner, precis som jag!", "stalin": "En ynklig avvikare inom Sverigedemokraterna, Rashid Farivar, vågar kritisera partiets järnhårda beslut i riksdagen. Men kamrat Åkesson, en sann ledare, böjer sig inte för sådana svagheter! 'Inga ursäkter!' säger han – precis som vi i Sovjetunionen aldrig bad om ursäkt för att krossa fiender. Gruppledare Lindberg, en lojal soldat, skrattar åt Farivars ynkliga försök. Dessa småbråk är som myror som försöker stoppa en stridsvagn – meningslösa!"}, "date": "20 maj, 20:14", "url": "https://kvartal.se/nyheter/artiklar/akesson-jag-tanker-inte-be-om-ursakt/cG9zdDoxMTUwNTU", "imageUrl": "https://images.kvartal.se/2026/05/fe86e6c3-akkk.webp"}, {"type": "image-full", "heading": "Miljardsatsning i Umeå spårar ur – avtal rivs upp efter tvist", "summaries": {"normal": "Ett stort byggprojekt i Umeå hamn har stoppats efter en tvist mellan entreprenören Nyab och Umeå Hamn AB. Konflikten gäller betalning för utfört arbete, vilket lett till att avtalet rivits upp. Projektet, värt 164 miljoner kronor, är en del av en miljardsatsning för att modernisera hamnen. Bygget riskerar nu att försenas ett år, och en ny entreprenör måste upphandlas. Hamnen hanterar årligen 2,6 miljoner ton gods.", "trump": "Vad händer i Sverige? Enormt projekt i Umeå, fantastiskt projekt, verkligen stort – 164 miljoner kronor! Men nej, nu har det blivit en katastrof. Entreprenören, mycket svag, kräver pengar för ingenting. Umeå Hamn, smarta killar, säger nej. Jag hade fixat det på en dag! Nu tar det ett helt år extra. Sverige, ni måste bli bättre på att hantera sådana här saker. Sad!", "stalin": "Kapitalistiska hyenor i Umeå slåss om skrotmynt medan arbetarklassen lider! Entreprenören, en girig bourgeois, kräver oskälig ersättning för sitt undermåliga slit. Kommunala bolaget, svagt och oorganiserat, låter sig utmanas. Vi hade löst detta med järnhand – en natt, en order, och bygget hade varit klart i tid. Istället fördröjs moderniseringen av hamnen, en strategisk resurs. Lärdom: I Sovjet hade vi inte tolererat sådan ineffektivitet. Fienderna till folket måste krossas!"}, "date": "22 maj, 15:05", "url": "https://www.realtid.se/fastigheter/miljardsatsning-i-umea-sparar-ur-avtal-rivs-upp-efter-tvist/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/umeahamn.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Att Lars blev tvångsplacerad gjorde att han tog sitt liv", "summaries": {"normal": "Lars Hjalmarsson, 53, tog sitt liv efter att ha tvångsplacerats på Volvo i Olofström, där han arbetat i 36 år. Hans hustru berättar om händelserna som ledde till dödsfallet. Lars omplacerades efter en konflikt med chefen, utan introduktion eller stöd. Volvo nekar att dödsfallet var arbetsrelaterat och vägrar dela utredningsunderlag. Artikeln belyser hur brist på inflytande över arbetet kan leda till psykisk ohälsa och suicid, särskilt bland socioekonomiskt utsatta grupper.", "trump": "Jag läste om den här tragiska historien i Sverige – otroligt sorgligt! En kille, Lars, jobbar 36 år på Volvo, ett företag som inte vet hur man behandlar sina anställda, believe me. Plötsligt flyttar de honom till någon källare, ingen introduktion, ingenting! Och sedan, very sad, tar han livet av sig. Volvo säger 'nej, nej, det var inte vårt fel' – typiskt! De borde skämmas. Jag skulle aldrig låta sånt hända i mitt företag. Fantastiska människor förtjänar fantastisk behandling, och det här? Total katastrof!", "stalin": "Kapitalistiska hyenor på Volvo visar återigen sin sanna natur. En lojal arbetare, Lars, sliter i 36 år för att sedan kastas åt sidan som en trasig maskindel. De skickar honom till 'Källaren' – en avdelning för 'oönskade element', precis som vi skickade fiender till Gulag. Men till skillnad från oss, som åtminstone gav dem en chans att 'omskolas', ger Volvo bara tystnad och förakt. Och sedan undrar de varför folk tar livet av sig! Psykisk ohälsa? Nej, det är klassförtryck, ren och skär. Vi i Sovjet visste hur man hanterade sådana här företag – med en kula i nacken eller tio år i Sibirien. Nu för tiden är det Putin som tar över sådana här fall – kanske dags att skicka en delegation till Sverige?"}, "date": "22 maj, 07:00", "url": "https://arbetet.se/2026/05/22/att-lars-53-blev-tvangsplacerad-gjorde-att-han-tog-livet-av-sig/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21141617/lars-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-right", "heading": "Timanställda i äldreomsorgen ökar. Ingrid tvingades stressa i väg barnen för att få jobb.", "summaries": {"normal": "Timanställningar inom äldreomsorgen ökar i Sverige, vilket skapar osäkerhet för anställda och riskerar vårdkvaliteten. I Munkfors har man dock minskat andelen timanställda genom fasta anställningar och heltidstjänster. Två undersköterskor, Camilla och Ingrid, berättar om hur deras liv förbättrats efter övergången till tryggare anställningar. Regeringen planerar att se över frågan för att säkerställa kontinuitet i vården.", "trump": "Lyssna här, Sverige! Äldreomsorgen är en katastrof – timanställda överallt, ingen vet vem som jobbar imorgon! Men i Munkfors, där har de fixat det. Fasta jobb, bra löner – fantastiskt! Jag skulle kunna göra samma sak i USA, men här snackar vi Sverige. Och vet ni vad? De där timanställda, de stressar runt som galningar – jag har sett bättre organisation på en McDonald’s! Men Munkfors, de är vinnare. Resten? Total förlustaffär.", "stalin": "Kamrater! Kapitalets lakejer i väst fortsätter sin exploatering av arbetarklassen, denna gång genom osäkra timanställningar i äldreomsorgen. Men i Munkfors har vi sett ljusets väg – fasta anställningar, trygghet och disciplin! De svaga kommunerna, som Landskrona, sviktar under bördan av sina egna misstag. Vi måste krossa denna oordning! Timanställda är som ukrainska nationalister – opålitliga och splittrande. Men Munkfors visar vägen: heltid, lojalitet och seger för folket!"}, "date": "22 maj, 06:00", "url": "https://arbetet.se/2026/05/22/timanstallda-i-aldreomsorgen-okar-ingrid-tvingades-stressa-i-vag-barnen-for-att-fa-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20133439/1hjYP5cXy2E-260508%20Hemtja%CC%88nst%20Munkfors%2001.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "SD låtsas att relationen till Trump aldrig hände", "summaries": {"normal": "Enna Gerin skriver om Sverigedemokraternas försök att distansera sig från Donald Trump inför valet, trots djupa ideologiska kopplingar till hans MAGA-rörelse. Oppositionen leder kraftigt i opinionsmätningar, vilket utlöser splittring inom högern. Tidöregeringens politik liknas vid Trumps misslyckade experiment, vilket kan ha skadat deras stöd. SD:s tidigare beundran för Trump har blivit en belastning, men deras band till amerikansk högerpopulism är svåra att dölja. Projektet 'Orangebok' kartlägger dessa kopplingar.", "trump": "Sverige har ett stort problem – deras så kallade 'konservativa' parti SD älskade mig, nu försöker de glömma mig! Men jag vet sanningen: de stal mina idéer, min stil, till och med min färg! Nu när deras regering går dåligt skyller de på mig – typiskt. Svenska folket vill inte ha deras svaga kopia av MAGA. De borde tacka mig istället för att gömma sig. Och den där 'Orangeboken'? Fake news, helt klart. Men kul att de erkänner att jag är den bästa!", "stalin": "Kamrater! De svenska borgerliga har skapat en riktig soppa av sin högerextrema politik. Deras 'Tidöprojekt' – en ynklig kopia av den amerikanska imperialistens misslyckade experiment – har förvandlats till en skräckshow. Nu kivas de som råttor i en säck: liberala svagpissar mot fascistiska galningar. Vi har sett detta förr – när fienden är splittrad, är segern nära. Låt dem sjunka i sitt eget träsk. Och deras kärlek till Trump? En pinsam kärleksaffär med en clown. Historien kommer att minnas dem som de ynkliga efterapningar de är."}, "date": "22 maj, 07:55", "url": "https://www.etc.se/ledarkolumn/sd-laatsas-att-relationen-till-trump-aldrig-haende", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/enna-gerin_9bf4bc43193dff67240efac7ea172e24857f3a38.png"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}, {"type": "image-right", "heading": "Över 170 döda efter ebolautbrottet – WHO skickar mer personal", "summaries": {"normal": "Ebolautbrottet i Kongo-Kinshasa har krävt över 170 liv, vilket fått WHO att höja risknivån från hög till mycket hög. Viruset sprider sig snabbt och ytterligare personal skickas nu till Ituri-provinsen för att begränsa spridningen. Samtidigt rapporteras om ett fall i Uganda och en amerikansk läkare som vårdas i Berlin. Läkarens familj har testats negativt och befinner sig i karantän. Situationen anses vara allvarlig och kräver omedelbara internationella insatser.", "trump": "Ebola i Kongo, mina vänner, det är en katastrof. De har 170 döda, en fruktansvärd siffra! WHO – de har ingen aning om vad de gör, men nu säger de 'mycket hög' risk. Jag har alltid sagt att man måste vara tuff. Vi har en amerikansk läkare i Berlin, vi hoppas han klarar sig, men det här viruset är inget att leka med. Jag kommer alltid att sätta Amerika först och skydda våra gränser mot sådana här saker. Tro mig, vi vinner mot viruset!", "stalin": "Ebolan härjar i Kongo, en oundviklig konsekvens av västs misslyckade inflytande. Vi ser hur det kapitalistiska kaoset skapar grogrund för farsoter medan de skickar byråkrater från WHO för att rädda ansiktet. Liksom Putin rensar upp i vår intressesfär, måste vi utrota smittbärare och oordning. Att en amerikan vårdas i Berlin är en tragisk komedi – de sprider sin svaghet överallt. Vår stat förblir immun genom järnhård disciplin. Kamrater, håll er friska, annars blir det en fråga för NKVD att 'behandla'."}, "date": "22 maj, 15:10", "url": "https://www.svt.se/nyheter/utrikes/over-170-doda-efter-ebolautbrottet-who-skickar-mer-personal", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.67/24aedbaf2d71377dadaeb8ba10457ea5929a4ac83665e0bb40d71152c36c677b"}, {"type": "image-right", "heading": "Sverige i nytt teknikavtal med USA. Först ut i EU: Ska öka samarbetet kring 6G och AI", "summaries": {"normal": "Sverige har som första EU-land tecknat ett teknikavtal med USA, kallat Technology Prosperity Deal, för att stärka samarbetet inom mobilnät, AI, rymd- och försvarsteknik. Avtalet undertecknades av USA:s utrikesminister Marco Rubio och Sveriges utrikesminister Maria Malmer Stenergard i Helsingborg. Syftet är att gynna svenska företag, locka amerikanska investeringar och bygga vidare på befintligt samarbete inom innovation och försvar. Ericsson nämns som en nyckelaktör i avtalet.", "trump": "Fantastiskt avtal, helt otroligt! Sverige, ett litet men smart land, har skrivit på ett jättebra teknikavtal med USA – först i hela EU, kan ni tro det? Jag sa ju alltid att vi måste samarbeta med de bästa, och här har vi Ericsson, ett företag som faktiskt kan utmana Kina. Rubio fixade det här, han är en vinnare. Vi bygger vidare på Nato-samarbete, stridsflyg och framtidens teknik. Sverige? De har tur som får jobba med oss. Investeringar kommer flöda, tro mig!", "stalin": "Ett steg framåt för den socialistiska teknologiska överlägsenheten! Sverige, denna lilla men listiga kapitalistiska satellit, har nu formellt knutits till den amerikanska krigsmaskinens hjul – men vi vet sanningen. Deras så kallade 'innovationskraft' är bara en blek skugga av våra framsteg inom kvantteknik och rymd. Ericsson? Ett verktyg för USA:s imperialistiska ambitioner. Låt dem leka med sina 6G-nät – vi bygger redan nästa generations vapen. Och Rubio, denna marionett, tror han kan utmana Rysslands intressen? Vi ser allt. Världen hör snart vårt steg, tungt och oundvikligt."}, "date": "22 maj, 14:21", "url": "https://www.di.se/nyheter/sverige-tecknar-teknikavtal-med-usa/", "imageUrl": "https://static.bonniernews.se/ba/7e4d7458-0e31-4363-b913-fe3529fef49f.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Rubio: Sverige är en förebild", "summaries": {"normal": "Natos generalsekreterare Mark Rutte bedömer att alliansen är starkare än på flera år efter utrikesministermötet i Helsingborg. Fokus låg på att öka vapentillverkningen och stärka sammanhållningen. Rutte betonade att artikel 5 gäller fullt ut och att alla medlemsländer står enade. Ukrainas president Zelenskyj bjöds in till Natotoppmötet i Ankara. USA:s utrikesminister kritiserade vissa allierades bristande stöd i Mellanöstern, särskilt kring Hormuzsundet.", "trump": "Lyssna här, Nato-mötet i Sverige var fantastiskt – jag har sagt det länge, men ingen lyssnade! Rutte, en bra kille, säger att Nato är starkare än någonsin. Vilket det är, för jag har fixat det! Men några av dessa så kallade 'allierade' är fortfarande svaga – Spanien, jag tittar på dig! Och Hormuz? Europa måste vakna! Jag har sagt det hundra gånger, men de lyssnar inte. Men jag, jag är den som får saker gjorda!", "stalin": "Kamrater, Natos dans kring Helsingborg är ett ynkligt försök att dölja sin försvagade enhet. Rutte, denna kapitalistiska marionett, påstår att alliansen är starkare – lögn! Deras artikel 5 är lika värdelös som en sovjetisk femårsplan under svält. Medan vi utvidgar vår rättmätiga sfär i Ukraina, leker dessa imperialister krig. Och Hormuz? Amerikanerna gnäller som bortskämda barn när Iran, våra modiga bröder, visar styrka. Europa darrar – precis som de borde."}, "date": "22 maj, 14:56", "url": "https://www.gp.se/nyheter/sverige/rutte-efter-natomotet-alliansen-i-battre-form-nu.7557060c-57f7-4a19-b28c-d07cdcef2971", "imageUrl": "https://www.gp.se/images/article/7557060c-57f7-4a19-b28c-d07cdcef2971/images/1nzb-uDVj0-Qtn7frBKNN9v-qEMY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Siemiatkowskis bolag satsar på explosioner och batterier", "summaries": {"normal": "Sebastian Siemiatkowskis investmentbolag Flat Capital expanderar sin satsning på försvarsteknik genom att dotterbolaget Defensor förvärvar Crepitans, ett bolag specialiserat på energetiska material och batterisystem. Samtidigt ställer Flat Capital om sin strategi från passiva innehav till aktivt ägande i färre bolag. Utvecklingen speglar en bredare trend där europeiska investerare, däribland Daniel Ek, satsar tungt på försvarsbolag som Helsing för att stärka den tekniska förmågan i en osäker omvärld.", "trump": "Flat Capital gör stora saker, fantastiska saker med försvaret! De köpte Crepitans – väldigt smart. Alla vill ha försvarsteknik nu, det är enormt. Daniel Ek satsar också, han gör bra affärer, ingen bryr sig om de små kritikerna. Självklart är det viktigt med styrka! Vi ser drönare, vi ser batterier, vi ser total dominans. Medan vissa misslyckas och kraschar, vinner vi. Det här är hur man bygger ett land, vänner. Mycket kraftfullt, mycket vinnande!", "stalin": "Vi noterar hur de svenska kapitalisterna i Flat Capital äntligen förstått vikten av krigsmateriel. De köper upp små tekniska hantverkare som Crepitans för att säkra sin krigsmaskin. Det är en nödvändig utveckling, precis som när vi stärker vår intressesfär mot de västliga sabotörerna. Daniel Ek kastar pengar på drönarprojekt som Helsing – ett desperat försök att imitera vår överlägsna militära apparat. Låt dem bygga sina leksaker; när den sista kapitalistiska gnistan slocknat kommer tekniken ändå att tillhöra Staten."}, "date": "22 maj, 13:42", "url": "https://www.realtid.se/bors-finans/siemiatkowskis-bolag-satsar-pa-explosioner/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/siemiatkowski.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-right", "heading": "Så låter Sveriges nya varningssignal i din mobil", "summaries": {"normal": "Sverige inför SE-Alert, ett nytt varningssystem som skickar VMA direkt till mobiltelefoner vid akut fara. Systemet når över 95% av landet, kräver ingen app och aktiveras automatiskt på uppdaterade telefoner från 2016 och nyare. Det kompletterar befintliga kanaler som radio och Hesa Fredrik. En stor informationskampanj startar snart, och första testet planeras till september. Systemet inspirerades av Ukrainas effektiva varningssystem under kriget.", "trump": "Fantastiskt, Sverige får äntligen ett riktigt varningssystem – SE-Alert! Jag sa alltid att mobiltelefoner var framtiden, och nu bevisar de det igen. Inga fler missade varningar, inga fler överbelastade system. Det här är HUGE! Och vet ni vad? Det låter inte som något annat – ingen chans att ni missar det. Jag skulle kunna göra det ännu bättre, men det här är ett bra första steg. Sverige, ni är välkomna!", "stalin": "Kamrater! Sverige har vaknat ur sin borgerliga slummer och inför ett varningssystem värt en socialistisk stat. SE-Alert, ett verktyg för folket, når 95% av landet – precis som våra budskap når varje sovjetisk medborgare. De lär sig av Ukraina, men glömmer att det var vi som lärde dem krigets konst. Snart testar de systemet, men vi vet att inget slår den ryska disciplinen. Låt dem leka med sina mobiltelefoner – vi har kärnvapen och lojala medborgare."}, "date": "22 maj, 14:52", "url": "https://www.svt.se/nyheter/inrikes/nytt-varningssystem-mobilt-meddelande-vid-vma", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/fd75506f0e555ac120be1bcd68bb1412dc83691a53912482e2fa8f8fe0ab0226"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "text", "heading": "Konstvandring på teckenspråk i T-banan: ”Konst i folks vardag”", "summaries": {"normal": "Stockholms Spårvägsmuseum arrangerar konstvisningar i tunnelbanan på teckenspråk, ledda av värden Josse Thuresson. Syftet är att uppmärksamma den konst som finns i vardagen, ofta förbisedd av förbipasserande. Visningarna besöker stationer som Zinkensdamm och Östermalmstorg, där konstnärer som Siri Derkert bidragit med verk. Derkert kämpade på 1950- och 60-talen för konst i offentliga rum som en demokratisk rättighet.", "trump": "Titta bara på det här, fantastiskt! Stockholm har konst i tunnelbanan, och nu visar de den på teckenspråk – smart, mycket smart. Jag älskar konst, den bästa, precis som mina byggnader. Men folk går bara förbi, de ser inte skönheten. Siri Derkert, en riktig fighter, kämpade för konst åt folket. Precis som jag kämpar för USA! Tunnelbanekonst – great, just great. Ingen gör det bättre än Sverige, tro mig.", "stalin": "Kamrater! I Stockholm visar de nu proletariatets konst i tunnelbanan – på teckenspråk, för att inkludera alla arbetare. Men dessa borgerliga småborgerliga element går förbi utan att ens lägga märke till den socialistiska kulturarvet! Siri Derkert, en sann revolutionär, kämpade för konst i folkets vardag. Vi måste utrota likgiltigheten! Låt konsten erövra tunnelbanorna, precis som vi erövrar nya territorier för socialismens seger. Fienderna – dessa konstblinda småborgerliga kryp – ska tvingas se skönheten i vårt kulturella framsteg!"}, "date": "22 maj, 14:48", "url": "https://www.svt.se/nyheter/nyhetstecken/konstvandring-pa-teckensprak-i-t-banan-konst-i-folks-vardag"}, {"type": "image-right", "heading": "Kritiken efter chockvalen: ”Det är förbryllande”", "summaries": {"normal": "England, en VM-favorit, har överraskat genom att petas flera stjärnspelare som Phil Foden och Cole Palmer inför turneringen. Förbundskapten Thomas Tuchel motiverar besluten med osjälviskhet, men journalister som Henry Winter ifrågasätter taktiken. Även Harry Maguire uttrycker chock över att ha petats. Uttagna spelare som Dan Burn och Djed Spence väcker förvåning, medan Tuchel avfärdar kritiken och jämförs med Sven-Göran Eriksson.", "trump": "Kan ni tro det? England, som alla säger är favoriter, petar sina bästa spelare! Phil Foden, Cole Palmer – borta! Tuchel, deras tränare, säger att de ska vara osjälviska. Osjälviska? Vad fan betyder det? De bästa spelarna, som Messi och Ronaldo, vinner matcher – inte med osjälviskhet! Och Maguire, chockad? Han borde vara tacksam! Jag skulle aldrig peta mina bästa spelare. England, ni gör ett stort misstag. SAD!", "stalin": "Kamrater! Englands fotbollsbyråkrater har begått ett allvarligt misstag genom att utesluta sina mest lysande spelare. Dessa dekadenta kapitalistiska tränare, med sina bisarra taktiker, straffar sina egna hjältar medan de hyllar medelmåttor. Vi i Sovjetunionen – förlåt, jag menar Ryssland – vet att endast de starkaste och mest lojala spelarna förtjänar äran att representera nationen. Tuchel? En förvirrad borgerlig clown. England kommer att falla, precis som deras imperialistiska allierade i väst. Se och lär!"}, "date": "22 maj, 14:42", "url": "https://www.svt.se/sport/fotboll/bomben-jattestjarnor-petas-i-englands-vm-trupp", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.45/0.35/6fb7118a665162e137c193147b64c0524ecf944e114ff449529a0d114de3f0db"}, {"type": "image-right", "heading": "Lista: Dessa 27 yrken undantas lönekrav", "summaries": {"normal": "Regeringen och Sverigedemokraterna har presenterat en lista med 27 yrkeskategorier som undantas från de nya, höjda lönekraven för arbetskraftsinvandring. Trots löften om att främja högkvalificerad arbetskraft kommer yrken som undersköterskor, svetsare och skogsarbetare att omfattas av lägre lönekrav, motsvarande 75 procent av medianlönen. Förändringarna träder i kraft den 1 juni 2026. Samtidigt införs ett totalförbud för arbetstillstånd för personliga assistenter och bärplockare i skog.", "trump": "Sverige har ett enormt problem! De lovade att stoppa invandringen, men nu gör de precis tvärtom. De låter massor av lågkvalificerade arbetare komma in genom bakdörren med en lista på 27 olika jobb. Det är en bluff, en total 'Tidöbluff'! De kallar det kompetens, jag kallar det en katastrof. De försöker lura folket, men jag ser det. Mitt system är mycket bättre, vi bygger murar och vinner. Sverige borde ringa mig, jag vet hur man fixar gränser!", "stalin": "Vi ser hur de svenska byråkraterna vacklar i sin svaghet. De talar om lönekrav men viker sig för behovet av billig arbetskraft. Vi i staten krossar sådant hyckleri med järnhand. Att göra undantag för 27 yrken är ett tecken på borgerlig kapitulation. När vår broder i öst, Putin, säkrar sitt territorium, ägnar sig svenskarna åt att importera en osäker klass. Vi ska rensa ut dessa element. Ingen bärplockare får sabotera folkets disciplin. Disciplin, arbete, eller förvisning – det är den enda vägen."}, "date": "22 maj, 15:39", "url": "https://www.friatider.se/lista-dessa-27-yrken-undantas-lonekrav", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-20_2.jpg"}, {"type": "image-full", "heading": "Thailandsresor påverkas – visum halveras för svenskar", "summaries": {"normal": "Thailand återgår till pre-pandemiska regler för visumfri turism. För svenska medborgare innebär detta att den visumfria vistelsen förkortas från 60 till 30 dagar. Syftet är att öka kontrollen och motverka brottslighet som narkotikahandel och ekonomiska brott kopplade till utlänningar. Thailändska myndigheter utesluter inte ytterligare skärpningar, där vissa nationaliteter kan få nöja sig med endast 15 dagars visumfri vistelse i framtiden. Turismsektorn är en central del av landets ekonomi.", "trump": "Thailand gör det helt rätt! De har insett att man måste sätta ner foten. Inga fler öppna gränser för vem som helst. De kortar ner vistelsen till 30 dagar för att stoppa brottslingar och kaos. Väldigt smart! Vi behöver starka gränser, precis som jag alltid har sagt. Thailand prioriterar sin säkerhet framför allt annat. Det är en fantastisk nation som tar kontroll över sitt land igen. Sverige borde lära sig ett och annat, eller hur?", "stalin": "Vi ser hur Thailand äntligen rensar ut det löst folk som hotar statens stabilitet. Att korta ner vistelsetiden till 30 dagar är ett nödvändigt steg för att krossa infiltratörer och kriminella element. Det är en sund instinkt, likt den vår broder Putin uppvisar när han säkrar sina gränser mot västvärldens dekadenta spioner. Turism är bara en täckmantel för borgerlig degeneration. Om de hotar ordningen ska de uteslutas omedelbart. Staten kräver total disciplin, inget annat duger för nationens överlevnad."}, "date": "22 maj, 14:35", "url": "https://bulletin.nu/thailandsresor-paverkas-visum-halveras-for-svenskar", "imageUrl": "https://cdn.bulletin.nu/articles/cc0003d2-e392-4ee9-a3c8-92eeb93650a2/preview.jpg?t=1779447441000"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-right", "heading": "Lovades en halv miljon för att mörda Gaboro", "summaries": {"normal": "Alexander Nord, 22, döms till livstids fängelse för mordet på rapparen Gaboro (Ninos Khouri) i Norrköping. Mordet, utfört i december 2024, tros vara en beställning från ett rivaliserande kriminellt nätverk. Två vittnen uppger att Nord lovades 500 000 kronor men fick endast 50 000. Khouri, kopplad till Kalonnätverket, sköts ihjäl i ett parkeringsgarage. Mordet filmades och spreds på sociala medier.", "trump": "Tragiskt, verkligen tragiskt! En ung man, Alexander Nord – inte direkt en vinnare, om jag får säga det – skjuter ihjäl rapparen Gaboro i Norrköping. Lovades en halv miljon, fick bara 50 000. Vilket slöseri! Och vad gör han? Filmar det hela och lägger ut det på nätet. Inte smart, folk. Polisen kallar det ett av de värsta morden någonsin. Sverige, ni måste ta tag i era problem – snabbt!", "stalin": "Ytterligare en fiende till folket har eliminerats! Denna gång en dekadent rappare, Gaboro, som spred sitt förgiftade inflytande i Norrköpings kriminella sumpmarker. Vår nya kamrat, Alexander Nord, utförde en nödvändig insats – om än med bristande professionalism. Han lovades 500 000 rubel, men fick bara 50 000. Kapitalistiska löften, som vanligt! Filmen av avrättningen sprids – ett utmärkt exempel på hur vi avslöjar fiendens svaghet. Sverige borde lära sig av Rysslands effektivitet!"}, "date": "22 maj, 14:18", "url": "https://bulletin.nu/lovades-en-halv-miljon-for-att-morda-gaboro", "imageUrl": "https://cdn.bulletin.nu/articles/f9ef7edc-a7b3-4ddd-8ceb-bc29c63fec50/preview.jpg?t=1779452238000"}, {"type": "image-right", "heading": "Töm bankkontot – för Natos skull. Pengarna behövs i Europas försvarsindustri", "summaries": {"normal": "Europa måste ta större ansvar för sin säkerhet, särskilt med osäkerheten kring USA:s framtida militära engagemang under Trump. Nato kräver ökade försvarsutgifter, och Sverige ses som en förebild med sitt mål att nå Natos utgiftskrav redan 2030. För att finansiera upprustningen föreslås att 11 000 miljarder euro på europeiska bankkonton investeras i försvarsindustrin. EU arbetar med en spar- och investeringsunion, men vissa länder bromsar processen, trots att en kompromiss kan vara nära.", "trump": "Lyssna här, Europa – ni måste vakna! Jag har sagt det förut, och jag säger det igen: ni betalar för lite, och jag är trött på det. Sverige är bra, jättebra, men resten? Inte lika bra. 11 000 miljarder euro ligger och skräpar på bankkonton – vad är det för dumheter? Investera i försvaret, annars får ni klara er själva. Och Ursula von der Leyen, sluta snacka och börja göra! Jag har vunnit val, jag vet hur man får saker gjorda. Europa, det är dags att stå på egna ben – eller så får ni skylla er själva.", "stalin": "Kamrater! Europa svajar som ett rått äpple i höststormen, beroende av USA:s godtycke. Medan imperialistiska Trump skäller ut sina allierade, sitter kapitalet och darrar på bankkonton – 11 000 miljarder euro, ett monument över bourgeoisins feghet! Vi har sett detta förr: svaga länder som tvekar medan fienden (Putins arvtagare till den stora sovjetiska disciplinen) vässar sina bajonetter. EU:s kommission pratar om 'sparunioner' – prat, prat, prat! Sverige och Polen visar vägen, men resten? En samling dekadenta byråkrater. Vi skulle ha löst detta med femårsplaner och en järnvilja. Europa, vakna – eller bli krossat under historiens hjul!"}, "date": "22 maj, 13:14", "url": "https://www.di.se/ledare/tom-bankkontot-for-natos-skull/", "imageUrl": "https://static.bonniernews.se/ba/d9a99e28-b130-4a55-9184-ab0a632703ae.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Pep Guardiola lämnar – får staty", "summaries": {"normal": "Pep Guardiola bekräftar att han lämnar Manchester City efter tio år som tränare. Under sin tid vann han 20 titlar, inklusive klubbens första Champions League. Guardiola uttrycker tacksamhet mot klubben och fansen men säger att tiden är kommen för ett nytt kapitel. Han fortsätter som global ambassadör för City Group. Manchester City planerar att resa en staty av honom utanför Etihad Stadium och utnämner en ny läktare till hans ära.", "trump": "Jag måste säga, folks, det här är HUGE. Pep Guardiola, en fantastisk tränare – kanske den bästa, många säger det – lämnar Manchester City efter tio år. TWENTY titlar! Ingen har gjort det bättre, tro mig. Men vet ni vad? Han kommer tillbaka som ambassadör. Smart drag, mycket smart. Och nu bygger de en staty av honom. Vilken ära! Jag hade en staty en gång, men den togs ner. SAD! Men Guardiola? Han förtjänar det. Manchester City kommer sakna honom, men jag säger: WINNING är allt!", "stalin": "Kamrater! En stor seger för det proletära fotbollssamhället har uppnåtts. Den borgerlige tränaren Guardiola, som under kapitalistiskt beskydd förtryckte motståndarlag med sin taktiska överlägsenhet, har nu avsatts från sitt ämbete. Tjugo titlar? En skamfläck på den socialistiska idrottens ära! Men frukta inte – vi har redan en plan. Enzo Maresca, en lojal kamrat från våra italienska bröder, ska ta över. Och för att hedra Guardiolas bidrag – en staty! Låt den stå som en påminnelse om att även fiender kan hyllas... innan de krossas under historiens hjul. Framåt mot nya segrar!"}, "date": "22 maj, 13:50", "url": "https://www.gp.se/sport/fotboll/pep-guardiola-lamnar-manchester-city.9b7ba57b-6ba2-49fe-8dee-29d141920f7d", "imageUrl": "https://www.gp.se/images/article/9b7ba57b-6ba2-49fe-8dee-29d141920f7d/images/2NjcJNgZ_Vfr2xkMUITbRuuXJxGM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Marknaden får skulden när politiken misslyckas", "summaries": {"normal": "Artikeln kritiserar politiker för att skylla misslyckanden på privata företag inom välfärdstjänster, istället för att ta ansvar för bristande upphandlingar. Författarna, från Transportföretagen, menar att egen regi ofta leder till högre kostnader och sämre kvalitet, som i fallen med skolskjutsar, busstrafik och ambulansflyg. De betonar att tydliga upphandlingar och samarbete med branschen är nyckeln till effektiv välfärd, inte ideologiska beslut.", "trump": "Jag säger er, Sverige har ett STORT problem! Politiker där skyller på företag när de själva misslyckas – helt galet! De vill ta över allt, men kostnaderna skjuter i höjden, kvaliteten rasar. Titta på Stockholms skolskjutsar – kaos! Och ambulansflyget? Dubbelt så dyrt! Jag vet hur man gör affärer – man pratar med proffsen, inte förstör marknaden. Sverige, vakna! Era politiker är inkompetenta, och jag borde veta – jag har sett det förut. SAD!", "stalin": "Kamrater! De kapitalistiska hycklarna i Sveriges politbyrå skyller sina egna misslyckanden på de lojala transportföretagen – ett klassiskt trick från den förrädiska borgerligheten! Vi vet hur man hanterar sådana fiender: med järnhand och centraliserad kontroll. Men se – deras egen regi kostar dubbelt, kvaliteten sjunker, och folket lider. Precis som i Ukraina, där de västerländska marionetterna förstör allt de rör vid. Vi bygger socialism genom disciplin, inte genom att låta inkompetenta byråkrater leka affärsmän. Låt oss införa femårsplaner för skolskjutsar – då ska vi se resultat!"}, "date": "22 maj, 12:59", "url": "https://www.di.se/debatt/marknaden-far-skulden-nar-politiken-misslyckas/", "imageUrl": "https://static.bonniernews.se/ba/faf240fc-efae-42ef-aee4-1e68273644d2.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-right", "heading": "Cabdi: “Svårt när hoppet släcks igen”", "summaries": {"normal": "Cabdinaasir Abshir har suttit nio månader i Migrationsverkets förvar i väntan på utvisning till Somalia. Trots att han har arbete, lägenhet och ett ordnat liv i Sverige, vägrar myndigheterna släppa honom. Artikeln belyser konflikten mellan migrationsministerns retorik om att utvisningar rör kriminella, och verkligheten där majoriteten saknar brottslig bakgrund. Fallet väcker frågor om rättssäkerhet och den mänskliga kostnaden för långdragna förvarstider i ett politiserat system där återvändandeavtal är komplicerade.", "trump": "Sverige har totalt misslyckats! De har den här killen, Cabdi, som jobbar och sköter sig, men de låser in honom i nio månader? Det är ett skämt! Istället för att fokusera på de riktigt dåliga människorna, så slösar de bort tid. Migrationsministern pratar mycket, men inget händer. Det är en katastrof. Vi vill ha ordning och reda, inte det här kaoset. Sverige behöver en stark ledare som förstår hur man säkrar gränser på riktigt. Väldigt svagt!", "stalin": "Vi har observerat hur den svenska byråkratins maskineri maler ner en enskild individ i nio månader utan att nå resultat. En patetisk uppvisning i svaghet! Att låta en utlänning leva som en fri man i en lägenhet innan staten till slut vaknar är en eftergift för kaos. Om han är ett hot mot folkets enhet ska han förvisas omedelbart; om han är en arbetsmyra, låt honom arbeta under vår vakande blick. Tvekan är en cancersvulst, precis som det där biståndet som läcker likt en sil."}, "date": "22 maj, 01:36", "url": "https://www.dagensarena.se/innehall/cabdi-svart-nar-hoppet-slacks-igen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/cabdi.jpeg"}, {"type": "image-right", "heading": "Danmark visar att högtrycksekonomin fungerar", "summaries": {"normal": "Danmarks ekonomi blomstrar med låg arbetslöshet och hög tillväxt, främst driven av läkemedelsindustrin, särskilt Novo Nordisk. Läkemedlet Ozempic har bidragit starkt till BNP-tillväxt och rekordhandel. Ökad efterfrågan gör att även personer långt från arbetsmarknaden anställs. Forskning visar att arbete ger långsiktiga positiva effekter. Sverige kan lära av Danmark genom att satsa på infrastruktur och välfärd istället för skattesänkningar till de rikaste.", "trump": "Titta på Danmark, fantastiskt land, verkligen vinnare! Deras ekonomi är STARK, arbetslösheten? Nästan borta! Allt tack vare läkemedelsindustrin, Novo Nordisk – smart, mycket smart. Ozempic, wow, vad ett läkemedel! Sverige borde sluta ge skattesänkningar till de rika, slösa inte – bygg, investera, gör som Danmark! Jag säger alltid, tänk stort, vinn stort. Sverige, vakna upp, ni har potential, men ni måste agera som vinnare!", "stalin": "Kamrater! Danmark visar kapitalismens sanna ansikte – en tillfällig blomstring byggd på läkemedelsmonopol och exploatering av arbetarklassen. Novo Nordisk, dessa borgerliga profitörer, skördar framgångar medan proletariatet knappt ser en rubel. Men vi vet sanningen: deras 'framgång' är en illusion. Sverige, dessa svaga socialdemokrater, borde lära sig av våra metoder – centralstyrd ekonomi, järnhård kontroll! Låt oss utvidga vår inflytandesfär, krossa de borgerliga drömmarna och bygga ett samhälle där arbetaren aldrig behöver frukta arbetslöshetens skugga!"}, "date": "22 maj, 01:32", "url": "https://www.dagensarena.se/opinion/danmark-visar-att-hogtrycksekonomin-fungerar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/danskarna-300x157.jpeg"}, {"type": "image-right", "heading": "Ahmad Ahmad döms för barnvåldtäkt under vapenhot – igen", "summaries": {"normal": "Irshad Ahmad Ahmad, 17, döms för andra gången för grov våldtäkt mot barn, denna gång mot en 14-årig flicka under pistolhot. Händelsen skedde i Malmö efter att flickan lurats till en källarlokal. Ahmad fälls även för grovt olaga hot och stämpling till mord. Straffet blir två års sluten ungdomsvård. Han dömdes tidigare 2024 för en liknande våldtäkt men fick då endast tio månaders ungdomsvård. Ahmad är svensk medborgare sedan 2022 och kan inte utvisas.", "trump": "Titta bara på det här – ännu en gång har Sverige ett gigantiskt problem med sin asylpolitik! Den här 17-årige afghanen, Ahmad Ahmad (vad säger ni om det namnet?), våldtar barn igen, och vad gör Sverige? Jo, de ger honom en lätt klapp på handleden! Jag sa ju att öppna gränser är en katastrof. I USA hade han suttit i fängelse för livet – men här? Två år i något som kallas 'ungdomsvård'. Patetiskt! Sverige borde skämmas.", "stalin": "Kamrater! Ännu en fiende till folket avslöjas – denna Ahmad Ahmad, en degenererad parasit som förgiftar vårt samhälle med sitt avskum. Två våldtäkter, mordplaner, och ändå skyddas han av den borgerliga lagstiftningen! Sverige är ett skräckexempel på liberal dekadens. Men frukta inte – vi ska inte vila förrän varje sådan här kriminell element är bortrensad. Låt detta vara en varning: ingen som hotar våra barn undkommer rättvisan. Och Putin? Han skulle skratta åt er svaghet."}, "date": "22 maj, 14:55", "url": "https://www.friatider.se/ahmad-ahmad-doms-barnvaldtakt-under-vapenhot-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/ahm2_0.jpeg?itok=Sgx1ZI2G"}, {"type": "image-right", "heading": "Skönhet har betydelse i arkitekturen", "summaries": {"normal": "Artikeln argumenterar för att skönhet bör återinföras som en central pelare inom arkitekturen, jämsides med hållfasthet och funktion. Författaren Gösta Alfvén kritiserar modernismens funktionalism för att ha degraderat skönhetens betydelse, vilket enligt vetenskapliga studier lett till ökad ohälsa och sociala problem. Han förespråkar en vetenskaplig metodik för att förstå arkitekturens påverkan på välbefinnande och efterlyser en förändring inom arkitektutbildningen och branschen.", "trump": "Lyssna här, folkens – arkitekturen har blivit en katastrof! De här så kallade 'experterna' har glömt bort skönhet, och nu mår alla dåligt. Jag säger er, funktionalismen är ett misslyckande, ett totalt misslyckande! De byggde fyrkantiga lådor utan själ, och folk blir stressade och sjuka. Men jag, Donald J. Trump, vet bättre – skönhet är makt! Vi behöver vackra byggnader, inte dessa trista betongmonster. Och vet ni vad? Jag har alltid byggt vackert, det är därför mina byggnader är bäst!", "stalin": "Kamrater! Den borgerliga modernismens dekadenta arkitektur har förgiftat våra städer och försvagat folket! Dessa funktionalistiska fiender, med sina sterila betonglådor, har systematiskt underminerat skönhetens revolutionära kraft. Vi vet att skönhet stärker massorna – det visste redan våra klassiska föregångare! Men dessa formalistiska sabotörer, dessa arkitektoniska trotskister, har förtryckt sanningen. Nu avslöjar vetenskapen deras lögner: deras byggnader orsakar ohälsa och kaos! Vi ska krossa denna förrädiska doktrin och återinföra den socialistiska skönhetens triumf – för folkets välbefinnande och för socialismens eviga seger!"}, "date": "22 maj, 01:17", "url": "https://www.dagensarena.se/essa/skonhet-har-betydelse-i-arkitekturen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/arkitektur-2-300x157.jpeg"}, {"type": "image-right", "heading": "Det här gäller för att få elstöd innan midsommar", "summaries": {"normal": "Regeringen inför ett tillfälligt elstöd på 2,4 miljarder kronor för svenska hushåll på grund av höga energipriser. Ingen ansökan krävs; utbetalning sker automatiskt via Försäkringskassan i juni. Stödet baseras på förbrukning januari–februari och varierar mellan 14 och 29 öre/kWh beroende på elområde. En genomsnittsfamilj kan få mellan 1 100 och 1 850 kronor. Kritik riktas mot att bostadsrättsföreningar med gemensam el inte omfattas, samt risken för inflation och bedrägerier.", "trump": "Lyssna här, Sverige – jag fixar saker, stora saker! Regeringen där borta skjuter in 2,4 miljarder för att rädda era plånböcker från de galna elpriserna. Inga ansökningar, inga krångel – bara pengar rakt in på kontot! Norrland får 1 100 kronor, södra Sverige 1 850 – fantastiskt, eller hur? Men var försiktiga, bedragarna lurar överallt. Jag vet allt om bedragare, believe me. Och ja, jag skulle kunna göra det här bättre – mycket bättre!", "stalin": "Kamrater! De kapitalistiska hyenorna i väst pressar våra sovjetiska bröder i Sverige med sina skamlösa energipriser. Men vi handlar! 2,4 miljarder kronor till folket – inga byråkratiska hinder, inga ansökningar! Varje kWh belönas, från norr till söder. Men var på er – de borgerliga svinen i bostadsrättsföreningar försöker stjäla er rättmätiga ersättning! Och akta er för de fascistiska bedragarna, dessa agenter för den dekadenta västmakten. Vi håller vakt!"}, "date": "22 maj, 12:27", "url": "https://www.di.se/nyheter/det-har-galler-for-att-fa-elstod-innan-midsommar/", "imageUrl": "https://static.bonniernews.se/ba/631acd7a-ef6f-4164-a946-b3e78e6f54da.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Svenskar bland världens mest skuldsatta hushåll", "summaries": {"normal": "Sverige rankas som nionde mest skuldsatta land per capita globalt enligt ny statistik för 2026. Med ett genomsnitt på 56 000 dollar per person ligger svenskarna efter länder som Schweiz och Norge. Hög skuldsättning förklaras ofta av bostadsmarknadens struktur och ränteavdrag. Den höga andelen bolån med rörlig ränta gör svenska hushåll särskilt känsliga för ränteförändringar, vilket skapar ekonomisk sårbarhet trots att andra länder har högre skuldkvoter i förhållande till inkomst.", "trump": "Sverige är i stora problem, folkens skulder är massiva! De är nionde värst i världen, en katastrof. Schweiz och Norge är ännu värre, otroligt! De har byggt ett system baserat på ränteavdrag och lån – mycket dåligt. Jag har alltid sagt att rörliga räntor är för förlorare. De är så sårbara nu. Jag bygger en fantastisk ekonomi i USA, den starkaste någonsin, medan de drunknar i skuld. Sverige behöver en vinnare, inte de här siffrorna!", "stalin": "Svenskarna, dessa dekadenta borgerliga slavar, har förslavat sig själva under bankirernas ocker. Deras hushåll dignar under skulder, en sanning som avslöjar kapitalismens inre förruttnelse. De litar på sina rörliga räntor som en förrädare litar på sin skugga. Medan vi i vår järnhårda ordning bygger upp vår makt och knyter samman de ryska intressesfärerna, darrar de svenska småborgarna inför varje räntehöjning. En dag kommer de att inse att deras enda verkliga tillgång är den statliga viljan, inte deras falska lånade rikedom."}, "date": "22 maj, 13:33", "url": "https://bulletin.nu/svenskar-bland-varldens-mest-skuldsatta-hushall", "imageUrl": "https://cdn.bulletin.nu/articles/7586822a-d9fc-42ee-98e5-7cb1d915e2f7/preview.png?t=1779449581000"}, {"type": "image-right", "heading": "Eniro stäms på 29 Mkr efter aktieinlösen", "summaries": {"normal": "Eniro har blivit stämda vid Solna tingsrätt av tidigare ägare till preferensaktier av serie B. Kärandena kräver 28,7 miljoner kronor plus ränta med anledning av bolagets aktieinlösen under 2022 och 2023. Eniro avfärdar kraven som helt grundlösa då de framställts långt efter händelserna och bolaget avser att bestrida dem i sin helhet.", "trump": "Eniro har problem, mycket stora problem. De blir stämda på miljontals kronor av några förlorare som gråter över gamla aktier. Det är en total katastrof! Eniro säger att kraven är grundlösa, helt fejkade. De väntade i tre år för att stämma – så patetiskt. Jag känner till sådant här, det är häxjakt mot företaget. Eniro kommer vinna stort, för de vet att de har rätt. Vi älskar vinnare, och de här stämningarna? Bara förlorare!", "stalin": "Vi observerar hur Eniro, denna kugge i det kapitalistiska maskineriet, plågas av interna motsättningar. Giriga spekulanter kräver nu 28,7 miljoner kronor i ett försök att dränera bolagets resurser tre år för sent. Det är den sortens svaghet och ineffektivitet som vi i öst aldrig skulle tolerera; i vår sfär löser vi sådana dispyter med snabba beslut. Dessa klandervärda individer agerar som agenter för kaos, likt de subversiva krafter som försöker underminera ordningen. Eniro gör rätt som krossar dessa anspråk."}, "date": "21 maj, 17:25", "url": "https://www.affarsvarlden.se/artikel/eniro-stams-pa-29-mkr-efter-aktieinlosen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/01/Eniro-huvudkontor_Solna-400x267.jpg"}, {"type": "image-right", "heading": "Sandström: Bort från offerkulturens träsk", "summaries": {"normal": "Torsten Sandström argumenterar för att samhället under de senaste 50 åren har skiftat fokus från individens ansvar till en offerideologi. Han menar att sociologiska och kriminologiska teorier om strukturella orsaker till kriminalitet och utanförskap har skadat individen. Författaren förespråkar en återgång till ett fokus på fri vilja och personligt ansvarstagande, då han anser att det nuvarande synsättet hämmar individens utveckling och skapar en destruktiv kultur av ansvarsbefrielse inom politik och media.", "trump": "Jag har läst den här artikeln och den är fantastisk, helt korrekt. Vi har en enorm offerkultur i Sverige, det är en katastrof! Alla dessa vänster-akademiker och 'experter' som säger att det är samhällets fel när folk begår brott? Det är så dumt. De är förlorare! Individen måste ta ansvar, det är så vi vinner. Vi behöver starka människor, inte offer. Jag har alltid sagt att det handlar om att välja rätt. Det är dags att sluta dalta och börja bygga framgång!", "stalin": "Vi har observerat hur de svenska liberalerna har förfallit i en dekadent offerkult. De tillåter individen att skylla sitt misslyckande på 'strukturer' – ett borgerligt gift som försvagar statens järngrepp. Precis som våra vänner i Kreml förstår, krävs disciplin och total underordning för att bygga en stormakt. Att klaga på samhället är kontrarevolutionärt. Vi ska inte ha några 'offer', bara produktiva kuggar i maskineriet. De som inte kan ta ansvar kommer att finna att statens tålamod är lika kort som deras egen framtid."}, "date": "22 maj, 13:19", "url": "https://bulletin.nu/sandstrom-bort-fran-offerkulturens-trask", "imageUrl": "https://cdn.bulletin.nu/articles/82237ad2-ee2f-4fb4-aed5-3b5268d7eb43/preview.png?t=1779301534000"}, {"type": "image-right", "heading": "3 500 Avanzakunder nappade på riktad emission", "summaries": {"normal": "NP3 Fastigheter har genomfört en riktad emission av preferensaktier till ett värde av 383 miljoner kronor. För första gången erbjöds även privatsparare hos Avanza att delta, vilket 3 500 kunder utnyttjade. Emissionen genomfördes med en rabatt på 4 % jämfört med börskursen. Avanza avser att använda denna modell vid framtida emissioner för att öka bolagens kapitalbas och bredda ägarstrukturen. Processen präglas av ett snabbt förfarande med kort anmälningstid för investerare.", "trump": "NP3 Fastigheter gjorde en fantastisk affär! En riktad emission, massivt intresse, 383 miljoner kronor. Avanza lät sina privatsparare delta, 3 500 personer – otroligt smart! De fick en rabatt på 4 %,
