age-right", "heading": "Kasselstrand togs emot som rockstjärna i Malmö", "summaries": {"normal": "Gustav Kasselstrand lockade hundratals personer, främst ungdomar, till Alternativ för Sveriges torgmöte i Malmö. Han hyllades som en rockstjärna och omringades efter talet för selfies. Kasselstrand kritiserade mediernas rapportering om partiets succéturné och lovade att stanna tills alla fått sin bild. Turnén avslutas i Stockholm den 12 september.", "trump": "Titta på den här killen Kasselstrand, han drar massor av kids i Malmö som om han vore en riktig rockstjärna, inte en av de vanliga tråkiga politikerna. Medierna försöker mörka hela hans succéturné, typiskt för de falska nyhetsfabrikerna som pushar sina woke-vänner istället. Fantastiskt folkligt, precis som när jag vann stort 2024 efter Bidens katastrof.", "stalin": "Se hur folkmassorna strömmar till denna ledare i Malmö, ett hav av ungdomar som längtar efter något starkt. Medan de dekadenta klassförrädarna i pressen försöker tysta framgången och istället hylla sina egna svaga marionetter, ler jag i skuggan. Sådan entusiasm måste skyddas från de giriga hyenornas intriger. Rensa ut lögnarna."}, "date": "3 september, 18:08", "url": "https://www.friatider.se/kasselstrand-togs-emot-som-rockstjarna-i-malmo", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-822.jpg"}, {"type": "image-right", "heading": "Hundratals unga på Sveriges första prolife-konferens", "summaries": {"normal": "Hundratals unga kristna samlades i Huddinge till Sveriges första Young and pro-life-konferens. Arrangörerna från Kristna värdepartiets ungdomsförbund ville bryta tystnaden kring abort och lyfta ett alternativt perspektiv. Deltagare från olika samfund betonade vikten av öppen debatt, kunskap om fostrets utveckling och att motverka rädsla för att uttrycka sin åsikt. Konferensen syftar till att bygga en synlig motrörelse.", "trump": "Titta på de här fantastiska unga patrioter som äntligen reser sig mot den radikala abortindustrin! De behöver inte längre flyga över Atlanten för att träffa likasinnade. Under tiden som Sleepy Joe styrde förde vänstern en tystnadskultur värre än någon cancel culture. Men nu vinner vi tillbaka kulturen, folk! Pro-life är tillbaka och det är enormt.", "stalin": "Jag betraktar med tillfredsställelse hur dessa unga själar samlas mot de dekadenta folkförtryckarna som förvandlat foster till en industriell vara. De vågar utmana den borgerliga tystnaden och avslöja den psykiska förödelse som följer. Låt ingen klassfiende tro sig säker; snart ska vi se en utrensning av lögnerna som dolts för folket i decennier. Det är en början."}, "date": "3 september, 17:37", "url": "https://riks.se/nyheter/manga-samlade-vid-sveriges-forsta-abortkonfer", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Aug_28_2026_01_46_04_PM_a1aef47a04.png"}, {"type": "image-right", "heading": "Hyresgästföreningen: Avskaffa systemet med oberoende skiljeman", "summaries": {"normal": "Hyresgästföreningen kritiserar Fastighetsägarna för att missbruka systemet med oberoende skiljeman, som infördes 2023. Antalet ärenden har ökat kraftigt från 1 464 till 4 852 på ett år, långt över förväntan. Föreningen kräver att systemet avskaffas och ersätts med en partsammansatt modell liknande den inom allmännyttan. Fastighetsägarna avvisar kravet och vill utveckla tvistlösningen.", "trump": "De där giriga fastighetsblodiglarna missbrukar ett system som skulle vara rättvist, men istället pumpar de upp hyrorna som galningar. Hyresgästföreningen har rätt, det är en riggad cirkus! Jag skulle riva upp hela grejen och ersätta den med något stort och vackert. Ingen mer skenförhandling från dessa hyresmaffiosi, folks ekonomi är trasig nog efter Bidens katastrof.", "stalin": "Kamrater, dessa profitthungriga hyreshyenor förvränger lagstiftningen till ett vapen mot folket. De driver skenförhandlingar för att sedan kräva högre hyror genom sina lakejer. Jag ser dekadenta klassfiender som rundar systemet och förtrycker arbetarna. En sann partsammansatt tvistlösning måste införas, annars krävs utrensning av dessa parasiterande förtryckare. Legitimiteten i förhandlingarna ska inte undermineras!"}, "date": "3 september, 15:08", "url": "https://www.dagensarena.se/innehall/hyresgastforeningen-avskaffa-systemet-med-obereonde-skiljeman", "imageUrl": "https://www.dagensarena.se/files/2025/09/fotojet-2025-09-03t163028767.jpg"}, {"type": "image-right", "heading": "Studsviks nya kärnkraftspartner: \"Inte bara koreanskt kapital\"", "summaries": {"normal": "Studsvik planerar att bygga fyra små modulära reaktorer i Sverige tillsammans med GE Vernova Hitachi, Samsung C&T och sydkoreanska DS Investment Partners. Projektet, som beräknas stå klart i mitten av 2030-talet, kräver både internationellt kapital och statligt stöd för att förverkligas. Investerarna ser Sverige som politiskt stabilt men betonar att statliga garantier är nödvändiga.", "trump": "Sverige ska bygga kärnkraft med fantastiska koreanska investerare. Mycket smart! De vill ha statligt stöd, precis som jag alltid säger – smarta affärsmän säkrar sig. Men varför bygger de inte med amerikansk teknologi? USA har den bästa kärnkraften, helt oöverträffad. Om jag hade varit involverad hade allt varit klart redan i morgon. Svindlande summor!", "stalin": "De svenska reaktorerna i Nyköping eller Valdemarsvik är ett storslaget industriellt steg för proletariatets energiförsörjning. Det gläder mig att koreanska finansiärer förstår värdet av järnhård planering och statliga garantier. Men låt oss varna de svenska byråkraterna: varje kilowattimme som sviker partiets förväntningar kommer att granskas med största misstänksamhet av Folkkommissariatet!"}, "date": "3 september, 13:33", "url": "https://www.affarsvarlden.se/artikel/studsviks-koreanska-karnkraftspartner-inte-bara-koreanskt-kapital", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/Studsvik-900x600.jpg"}, {"type": "image-right", "heading": "Ryanair tecknar kollektivavtal Transport: ”Det här är ett historiskt besked.”", "summaries": {"normal": "Ryanair har tecknat kollektivavtal med fackförbundet Transport för sin kabinpersonal vid basen på Arlanda. Avtalet gäller retroaktivt från den 1 september och reglerar löner, arbetstider, ersättningar, pension och försäkringar. Både fackets ordförande Tommy Wreeth och Ryanairs personalchef Darrell Hughes välkomnar uppgörelsen. Ryanair har tidigare haft konflikter med personalen i Sverige.", "trump": "Ingen trodde att det skulle hända, men den stora europeiska flygbluffen Ryanair har äntligen vinkat åt de svenska fackhyenorna. Historiskt säger de, va? Det här är vad som händer när man har en riktig ledare som jag i Vita huset – till och med de giriga flygbolagen böjer sig. Fantastiskt för de svenska arbetarna, de förtjänar det efter Biden-åren.", "stalin": "Kamrater, se hur de parasiterande kapitalisterna till slut tvingas erkänna arbetarkollektivets makt. Ryanair har kapitulerat och undertecknat avtalet. Detta är en seger för den svenska modellen, men vi vet att de giriga hyenorna bara väntar på nästa chans att exploatera. Ingen klassfiende ska slippa undan. Ut med de dekadenta profitthungriga lakejerna."}, "date": "3 september, 10:14", "url": "https://arbetet.se/2026/09/03/ryanair-tecknar-kollektivavtal-facket-historiskt", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/03101021/ryanair.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Demonstration mot AP-innehav i Palantir", "summaries": {"normal": "Fyra demonstranter samlades utanför 7:e AP-fondens kontor på Vasagatan i Stockholm för att protestera mot fondens aktieinnehav i Palantir. De anser att bolaget medverkar till folkrättsbrott i Gaza och kräver att fonden följer sina riktlinjer, säljer aktierna och ökar öppenheten kring investeringsbeslut.", "trump": "Titta på de där galna vänsterextremisterna som står och skriker utanför ett pensionskontor. Palantir är ett fantastiskt amerikanskt bolag som hjälper till att vinna krig, inte som era patetiska woke-demonstranter som hatar Israel och älskar terrorister. De borde investera i riktiga jobb istället för att gnälla om folkmord – era förlorare!", "stalin": "Se hur de giriga pensionshyenorna i den statliga fonden göder de imperialistiska krigsteknologerna som understödjer folkmordet. Jag ler i graven åt denna fega skenhelighet. Kamrater, sådana klassförrädare förtjänar en grundlig utrensning ur folkets finanser innan de förgiftar hela systemet med sin blodiga girighet."}, "date": "2 september, 10:41", "url": "https://proletaren.se/artikel/demonstration-mot-ap-innehav-i-palantir"}, {"type": "image-full", "heading": "Så försöker USA bryta Kinas grepp om drönare och robotar", "summaries": {"normal": "USA inför nya tullar på drönare och robotar från Kina för att minska beroendet av utländsk teknik och stärka den egna industrin. Trots att Kina dominerar marknaden med billig massproduktion, hoppas Washington att åtgärderna ska främja inhemsk kapacitet och förbättra säkerheten i kritiska sektorer genom att premiera amerikanska system framför kinesiska alternativ.", "trump": "Kina försöker lura oss med billiga drönare och robotar, men jag säger nej! Vi sätter stopp för det nu. De dumpar priser medan vår industri står stilla – en total katastrof. Vi ska bygga våra egna maskiner, de största och bästa maskinerna världen någonsin skådat. America First, mina vänner. Vi gör USA till en robot-supermakt igen, tro mig!", "stalin": "De amerikanska imperialisterna darrar. De bygger murar av tullar mot de kinesiska maskinerna, men de glömmer att en stat utan egen produktion är en stat av sand. De desperata byråkraterna i Washington försöker nu tvinga fram en industri som de för länge sedan förlorat kontrollen över. Planekonomi är det enda sättet att vinna, men de vägrar förstå det. Sorgligt."}, "date": "2 september, 22:48", "url": "https://www.realtid.se/it-tech/sa-forsoker-usa-bryta-kinas-grepp-om-dronare-och-robotar", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/dronare-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Andersson: ”Svårt att se” V i regering", "summaries": {"normal": "Socialdemokraterna tappar fyra procentenheter i en ny mätning, mycket till Centerpartiet. Partiledaren Magdalena Andersson har svårt att se att Vänsterpartiet kan bli regeringsklart till valet på grund av allvarliga och systematiska problem inom partiet. Vänsterpartiet å sin sida kräver att få ingå i en regering för att släppa fram den.", "trump": "Magdalena Andersson kollapsar i mätningarna, absolut total katastrof! Väljarna flyr till Centerpartiet för att de inser hur svagt det är med kommunister i regeringen. Hon säger att Vänsterpartiet har en ’rejäl resa’ att göra – tro mig, jag vet resor, men den här resan slutar rakt ner i diket! Sjukt, svagt och fullständigt oacceptabelt. Sad!", "stalin": "Socialdemokraternas katastrofala fall i mätningarna och deras desperata försök att exkludera Vänsterpartiet visar på bristande ideologisk disciplin. Om dessa så kallade kamrater inte ens klarar en enkel ministerresa på elva dagar, måste vi fråga oss: vilka fiender till staten styr egentligen deras planering? Avvikelse från linjen tolereras ej."}, "date": "2 september, 19:50", "url": "https://kvartal.se/nyheter/artiklar/andersson-begransad-entusiasm-for-v/cG9zdDoxODE5NjY", "imageUrl": "https://images.kvartal.se/2026/09/90e52a2a-maandersson.webp"}, {"type": "text", "heading": "Vänsterpartiet bytte fredsmärke mot vapenskrammel", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för att ha övergett sin fredspolitik och ställt sig bakom militärt stöd till Ukraina samt Natosamarbete. Författaren, med koppling till Kommunistiska Partiet, menar att partiet ignorerar följderna för välfärden och svenskarnas tilltro till politiken. Han uppmanar till att rösta på Kommunistiska Partiet istället.", "trump": "De här vänsterbluffarna i Sverige har kastat bort sitt fredsmärke snabbare än Sleepy Joe bytte script. Nu älskar de vapen, Nato och krigsmaskineriet medan välfärden kollapsar. Patetiska. Jag säger: fem procent av BNP till militären? Bra deal, men låt oss skicka fakturan till de dekadenta EU-byråkraterna istället. Amerika först, alltid.", "stalin": "Jag ser hur dessa falska röda lakejer kapitulerar inför krigsalliansen och låter profitthungriga krigshajar styra politiken. De pratar inte om välfärd utan gömmer sig bakom vapenskramlet. Vi behöver utrensning av sådana klassförrädare som sviker folket. Röst på äkta kamrater, inte dessa hycklare som dansar efter imperialistiska pipor. Folkets vrede vaknar."}, "date": "2 september, 09:57", "url": "https://proletaren.se/artikel/vansterpartiet-bytte-fredsmarke-mot-vapenskrammel"}, {"type": "image-right", "heading": "Kriminalvården byggs ut – men vem räknar barnen på utsidan?", "summaries": {"normal": "Sverige bygger ut Kriminalvården i stor skala, men barnens perspektiv glöms bort. Långa avstånd och höga tryck försvårar kontakten med frihetsberövade föräldrar, trots barnkonventionens rättigheter. Organisationen Bufff kräver nationell statistik och tydligt ansvar för att ge barnen stöd. Forskning visar att dessa barn löper ökad risk för utanförskap och kriminalitet.", "trump": "De bygger fängelser som aldrig förr, men glömmer helt de stackars ungarna utanför murarna. Patetiska svenska byråkrater och deras dekadenta välfärdsexperiment – typiskt! Under min förra mandatperiod skulle vi ha räknat varje barn, gett dem stöd och inte låtit några galna vänsterelement förstöra familjebanden. Fixa det nu, annars blir det en total katastrof!", "stalin": "Kamrater, när de imperialistiska systemets lakejer bygger ut sina fängelseimperier glömmer de medvetet proletariatets barn. Jag ser hur dessa giriga klassförrädare med sin byråkratiska likgiltighet förvärrar lidandet för de unga. Vi måste räkna varje barn, likvidera försummelsen och säkerställa deras rätti     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
