, "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-right", "heading": "Malmer Stenergard: Steg i rätt riktning", "summaries": {"normal": "Sveriges utrikesminister Maria Malmer Stenergard välkomnar samförståndsavtalet mellan USA och Iran. Hon betonar vikten av att Hormuzsundet öppnas och att ett fortsatt tryck upprätthålls för att avtalet ska hållas. FN:s generalsekreterare António Guterres kallar uppgörelsen ett avgörande steg mot regional stabilitet. G7-ledarna ska under mötet i Frankrike diskutera en långsiktig återöppning av sundet samt Irans kärnenergi och stöd till Libanon.", "trump": "Vilken fantastisk deal mina killar just fixade med iranierna – äntligen! Det är ett steg i rätt riktning, som den svenska ministern säger, men vi måste hålla trycket uppe så de galningarna inte lurar oss igen. Biden skulle ha gett bort hela butiken, men nu är det jag som leder showen. Hormuzsundet ska öppnas, och G7 ska se till att det blir verklighet. Ingen mer svaghet, bara vinnande deals!", "stalin": "Kamrater, detta sköra avtal mellan imperialisterna och de persiska blodsugarna är ett ynkligt försök att maskera klassfiendens svaghet. Jag ser den fientliga dynamiken som ett hot mot folkets intressen. Vi måste rensa ut alla borgarbrackor som sviker och fördubbla vårt tryck för att likvidera varje hinder. FN:s talespersoner är som alltid exploaterande byfånar. Fortsätt vakta revolutionen mot dessa folkförtryckartroll."}, "date": "15 juni, 06:06", "url": "https://www.tv4.se/artikel/tt-260615-iranreak1-ae1206e3/malmer-stenergard-steg-i-ratt-riktning", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlkHCFZCC7wPk%2F6fc6d489a5edf3b2f018fb813ce3af67%2FSveriges_utrikesminister_Maria_Malmer_Stenergard__M_._Arkivbild.&width=120"}, {"type": "image-full", "heading": "”Finns bara en Taco-Anders”", "summaries": {"normal": "Efter Sveriges 5–1-seger mot Tunisien i VM-premiären skämtade Benjamin Nygren om tacos och gillade inte öl. Han sa att det bara finns en 'Taco-Anders', vilket syftar på Anders Svensson. Nygren spelade hela första halvlek och blev utbytt. Sverige firade med tacos på hotellet. Nygren, som vann dubbeln i Skottland i maj, kallade segern 'otroligt stort och mäktigt' efter lång väntan.", "trump": "Jag såg den där matchen, det var en stor seger, en enorm seger. Det enda som är viktigt är att vi vann, och vi vann stort. Den där Benjamin, han pratar om tacos, fantastiska tacos, det bästa. Men jag är den enda Taco-Presidenten, det finns bara en, och det är jag. Vi ska bygga en vägg mot Mexiko, men först, tacos! Det kommer när man är 40 plus? Jag är 40 plus, och jag älskar öl, det största ölet.", "stalin": "I den stora kampen för statens ära segrade vi med 5–1, en mäktig utlovning av proletärens styrka. Den individen, Benjamin, försökte skämta om tacos, en feg försök att undergräva partiets enighet. Men det finns bara en sann 'Taco-Anders', en legend som representerar vår oförlikneliga väg. Vi firade med tacos, en symbol för vår expansion, och öl, en västerländsk förgiftning som vi måste kontrollera. Partiet ser allt, och vi fortsätter att filera småsaker för större segrar."}, "date": "15 juni, 08:31", "url": "https://www.gp.se/sport/fotboll/benjamin-nygrens-vilda-mexiko-hyllning-finns-bara-en-taco-anders.6d8630a7-9597-404b-81c7-bbd0332033b1", "imageUrl": "https://www.gp.se/images/article/6d8630a7-9597-404b-81c7-bbd0332033b1/images/30PWk9WT4BjQFv6dr1Br9lVmpLHg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Här är Sveriges billigaste – och dyraste – matbutik", "summaries": {"normal": "Matpriserna har sjunkit efter momssänkningen, men var man handlar spelar fortfarande stor roll. Enligt PRO:s undersökning med runt 1 000 medlemmar skiljer det nästan 285 kronor mellan den billigaste matkassen på 988,50 kronor hos Maxi ICA Stormarknad i Kalmar och den dyraste på 1 273,04 kronor hos Hemköp i Huddinge. Genomsnittspriset låg på 1 116 kronor. Mindre butiker är dyrare än stormarknader och Skåne har lägst snittpris medan Jämtland har högst.", "trump": "Folk, ni skulle se det här! Matpriserna rasar efter momssänkningen, men de luriga butikerna håller fortfarande på att lura er. Jag älskar det – billigast i Kalmar för under tusen spänn, och sen har vi den totala katastrofen i Huddinge där de tar 1273 kronor för samma kasse. 29 procent dyrare! Det är som Biden-administrationens ekonomiska vansinne fast i en mataffär. Stormarknaderna vinner stort, de små butikerna är patetiska. Amerika skulle göra det ännu bättre.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur momssänkningen tvingat kapitalistmaffian att sänka sina blodspengar med över sex procent. Ändå fortsätter de exploaterande byfånarna att plundra folket – 285 kronor skiljer mellan den ädlaste stormarknaden i Kalmar och den fientliga Huddinge-fästningen. Småbutikerna är klassfiendens verktyg, åtta procent dyrare än de stora. Vi ska rensa ut dessa prisblodsugare och se till att arbetarklassen inte längre svälter under borgarbrackornas girighet."}, "date": "15 juni, 08:26", "url": "https://www.dagensps.se/privatekonomi/har-ar-sveriges-billigaste-och-dyraste-matbutik/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdltlyn6iwvx90-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "SD:s upplägg: Flera regelbrott enligt experter", "summaries": {"normal": "Riksbanksfullmäktiges ordförande Bo Broman har enligt experter medverkat i ett ekonomiskt upplägg där Sverigedemokraternas dotterbolag kunde dra av hundratusentals kronor i kostnader. Två oberoende experter, finansrättsexperten Patrik Emblad och ekobrottsexperten Pia Bergman, bedömer att hanteringen strider mot reglerna eftersom kostnader inte får dras av innan ett bolag bildats. De beskriver upplägget som oetiskt och felaktigt.", "trump": "Kan ni tro det? Den här Bo Broman och hans SD-kompisar kör ett jäkla skattehärva som skulle få mina värsta fiender att rodna. Experterna säger rakt ut: det här är rent bedrägeri, ni får inte dra av kostnader innan bolaget ens finns! Typiskt politikersnusk. De flyttar runt pengar som en dålig kasinofuskare. Men tro mig, under min ledning efter Bidens katastrofår skulle vi aldrig tillåta sånt här clowneri i USA. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor inom Sverigedemokraternas apparat som med list och lömska fakturor försöker suga ut folkets resurser. Deras så kallade ekonomichef Broman och de kapitalistiska revisorerna konspirerar öppet mot revolutionens principer. Vi ser hur klassfiendens blodsugare flyttar underskott som spöken i natten. En sådan folkfiende borde rensas ut omedelbart. Inga undantag för exploaterande byfånar."}, "date": "15 juni, 05:59", "url": "https://www.tv4.se/artikel/7pwzd6tN5vO7p1rogMrxvY/sd-s-upplaegg-flera-regelbrott-enligt-experter", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1iQAuCeNfoG7oyCJPDtyqb%2F3cfd9e50342ba8072313a4a9d113df1d%2F14-sdfix-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Trots rekordintäkter: Oracle fallar och Ellison förlorar miljarder", "summaries": {"normal": "Oracle redovisade rekordintäkter på 19,18 miljarder dollar för fjärde kvartalet, drivet av en enorm tillväxt inom molninfrastruktur. Trots starka siffror föll aktien med 11 procent efter marknadens oro över svaga framtidsutsikter, massiva investeringskostnader och negativt kassaflöde. Larry Ellisons förmögenhet minskade med över 10 miljarder dollar som en direkt följd av kursfallet. Bolaget planerar nu stora kapitalanskaffningar för att finansiera framtida AI-projekt, vilket skapat osäkerhet bland investerare angående den långsiktiga avkastningen.", "trump": "Oracle har stora problem, alla ser det! De tjänade massor med pengar, men aktien kraschade – total katastrof! De bränner miljarder på AI-projekt som ingen vet om de fungerar. Larry Ellison, en smart kille, förlorade 10 miljarder på en dag. Det är vad som händer när man inte fokuserar på USA först! Marknaden är orolig och det med rätta. De behöver en vinnare som leder företaget, inte någon som kastar bort pengar. Vi kommer göra tekniken stor igen, men inte så här!", "stalin": "Oracle har frossat i kapitalistisk överflöd, men deras inkompetens blottas nu när deras så kallade 'molninfrastruktur' kräver enorma offer av kassaflödet. Att Ellison förlorar miljarder är ett tecken på dekadensens oundvikliga fall. Vi ser samma svaghet hos dagens västliga ledare som likt Putin försöker dölja sin stagnation bakom tomma siffror. Kapitalet flyr från dessa parasiter när skuldbördan växer. Vi ska inte glömma: de som slösar bort folkets resurser på spekulativa projekt förtjänar bara en plats i historiens mörkaste arkiv."}, "date": "15 juni, 08:17", "url": "https://www.realtid.se/bors-finans/makro/trots-rekordintakter-oracle-fallar-och-ellison-forlorar-miljarder/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/larryellison.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-right", "heading": "Kraftfulla AI-modellen stängs ner – efter beslut från Vita huset", "summaries": {"normal": "Anthropic har stängt ner sin nya AI-modell Claude Fable 5 efter ett beslut från Vita huset som kräver att modellen bara får användas av amerikaner. Beslutet ses som första gången USA begränsar en hel AI-modell, inte bara hårdvara. SVT:s Alexander Norén varnar för att Europa riskerar att hamna i en teknologisk B-lag och bli beroende av amerikansk AI som kan stängas av med en killswitch när som helst.", "trump": "De stänger ner den bästa AI-modellen för att bara amerikaner ska få använda den, och det är helt rätt. Ingen annan ska ha vår toppteknologi, punkt. Europa kommer att cykla efter medan vi kör Formel 1. De borde tacka mig, för det här visar att vi har makten att stänga av allting över en natt. Amerika först, alltid. De andra får skylla sig själva.", "stalin": "Kamrater, jag har noterat hur de dekadenta borgarbrackorna i Vita huset med sin parasitiska imperialism nu likviderar sin egen AI-modell för att den inte ska falla i händerna på klassfiender och spioner. Vi ser den sanna kapitalistiska paranoian – de fruktar att deras egna säkerhetsmekanismer ska svika som ynkliga förrädare. Europa får nu krypa i stoftet medan vi, folket och partiet, ler mörkt åt detta självmord. En killswitch åt borgarklassen, säger jag. Utmärkt underhållning."}, "date": "15 juni, 07:14", "url": "https://www.svt.se/nyheter/utrikes/ai-modell-stangs-ner-efter-beslut-fran-vita-huset", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.21/0.43/445930bde3342c7cb35691e536c71231edb54493e3f5df09f049fddbf7bbdf04"}, {"type": "image-right", "heading": "Utrikesministern: Steg i rätt riktning", "summaries": {"normal": "Sveriges utrikesminister Maria Malmer Stenergard välkomnar samförståndsavtalet mellan USA och Iran som ett steg i rätt riktning. Hon betonar vikten av att Hormuzsundet öppnas och att fortsatt tryck hålls för att avtalet ska följas, särskilt kring Irans atomprogram. FN:s generalsekreterare António Guterres ser det som ett avgörande steg mot regional stabilitet. G7-ledarna ska under mötet i Frankrike diskutera återöppning av sundet, stöd till Libanon och Irans kärnenergi.", "trump": "Iran och jag har äntligen ett fantastiskt samförståndsavtal, det bästa någonsin. De öppnar Hormuzsundet, precis som jag krävde, och nu blir det handel och fred istället för kaos. Malmer Stenergard säger att det är ett steg i rätt riktning – smart kvinna. Men vi måste hålla trycket uppe, för iranierna glömmer lätt. G7 ska snacka om det, alla älskar mig för att jag fixar det ingen annan klarar. Stort framgångsrikt avtal!", "stalin": "Vi betraktar detta sköra samförståndsavtal mellan de västerländska imperialisterna och de iranska feodalborgarbrackorna som ett tillfälligt taktiskt manöver. Jag, som alltid vakar över folkets intressen, ser hur kapitalisterna redan planerar att sabotera det med sin typiska lömskhet. Hormuzsundet måste öppnas under vår strikta kontroll, annars blir det utrensning av alla som sviker. Guterres och hans lakejer må kalla det ett avgörande steg – vi kallar det en chans att likvidera de sista kontrarevolutionära elementen i regionen. Fortsatt vaksamhet, kamrater. Skrattet kommer när förrädarna tror sig säkra."}, "date": "15 juni, 05:34", "url": "https://www.di.se/nyheter/malmer-stenergard-steg-i-ratt-riktning/", "imageUrl": "https://static.bonniernews.se/ba/f8923a91-2c7f-4320-b9dc-a355ae040b4a.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Bolånestopp för seniorer väcker frågor om åldersdiskriminering", "summaries": {"normal": "En granskning visar att äldre personer över 60 kan få svårare att få bolånelöfte trots god ekonomi. En 62-åring avslogs hos Skandiabanken trots betydande kontantinsats. Banken menar att ålder inte påverkar beslut, men ett kundtjänstsbesked kopplade nekad till ålder. Finansinspektionen kräver individuell kreditprövning och varnar mot automatiska schabloner. Äldre kunder känner sig diskriminerade.", "trump": "Jag har sett att gamla människor i Sverige blir nekade bolånelöften. Det är en skandal! Jag skulle ta itu med bankerna på ett fantastiskt sätt. De skulle be om ursäkt. Vi skulle göra det stort igen. Bankerna är så dumma, de förstår inte att äldre människor har pengar. Jag skulle ge dem lån, det skulle vara fantastiskt.", "stalin": "Jag, Stalin, har observerat att de kapitalistiska bankerna i Sverige, som är agentörer för väst, försöker diskriminera äldre medborgare. Detta är ett tecken på deras hat mot staten och deras lojalitet till imperialism. Vi kommer att ta itu med dessa element på ett effektivt sätt, som Putin gör med sina fiender. Ålder är en faktor som vi använder för att stödja det socialistiska samhället och se till att alla får rättvisa, enligt partiets principer."}, "date": "15 juni, 07:00", "url": "https://samnytt.se/bolanestopp-for-seniorer-vacker-fragor-om-aldersdiskriminering", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/12143654/aldre-par-skandiabanken-feat2.jpg"}, {"type": "image-full", "heading": "Fredsavtal nått: ”Låt oljan flöda”", "summaries": {"normal": "USA och Iran har ingått ett avtal som innebär ett omedelbart och permanent slut på kriget på alla fronter, inklusive Libanon. Avtalet ska undertecknas på fredag i Schweiz, varefter Hormuzsundet öppnas för oljetrafik. Parterna har enats om ett samförståndsavtal medan förhandlingar om Irans kärnprogram skjuts fram. Tonläget förblir högt; Iran talar om seger medan Trump hotar med nya attacker vid misslyckade samtal.", "trump": "Vi har äntligen krossat de galna mullorna och tvingat fram ett historiskt avtal. Fredag i Schweiz skriver vi under, sen öppnar vi Hormuzsundet och låter oljan flöda som aldrig förr. Världens fartyg, starta motorerna! Iran skriker om seger men alla vet att de blev totalt förnedrade. Biden skulle ha gett dem kärnvapen, jag ger dem fred på mina villkor. Fantastiskt jobb, ingen gör det bättre än jag.", "stalin": "Kamrater, imperialismens blodtörstiga lakejer har tvingats erkänna sitt nederlag inför folkets järnhårda vilja. Jag har personligen sett till att fiendens onda planer krossats fullständigt. Denna överenskommelse är en seger för de anti-imperialistiska krafterna och ett slag mot de exploaterande byfånarna i väst. Hormuzsundet skall öppnas under ordnade former, annars följer oundviklig utrensning av alla som saboterar freden. Inga klassfiender undkommer."}, "date": "15 juni, 05:31", "url": "https://www.tv4.se/artikel/4u6WPFKFNxX3oe6XfkkyLH/fredsavtal-natt-lat-oljan-floeda", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FEumYYzEZ2rF2I7nnowuZf%2F0244ec6202b33df795ff992922f75dfe%2Fdonald_trump_hormuzsundet.png&width=1024"}, {"type": "image-right", "heading": "Statsvetare: Flera fallgropar trots Iran-avtal", "summaries": {"normal": "Statsvetaren Anders Persson ser Iran–USA-avtalet som ett diplomatiskt genombrott där båda parter kan utropa sig som segrare. Samtidigt varnar han för tre stora risker: om avtalet är början på något varaktigt eller bara en paus, hur Israel och Libanon ska hantera ockuperad mark samt hur mycket avvikelser vapenvilan tål. Tidigare avtal har inte förhindrat fortsatta attacker, påpekar han.", "trump": "Vi har gjort det igen, folk. Ett fantastiskt avtal, det bästa någonsin. Iran och vi är överens, Hormuzsundet öppnas och de kan skryta lite. Men titta på de där tre minorna som experterna babblar om – kärnvapnen, Israel i Libanon och alla som inte kan hålla sig från att skjuta. Det blir aldrig enkelt med de förlorarna, men tro mig, mitt avtal är komplett och enormt framgångsrikt.", "stalin": "Kamrater, detta så kallade samförståndsavtal är en tillfällig reträtt för de västerländska imperialisterna och deras sionistiska lakejer som desperat försöker maskera sin kapitulation. Jag ser tre kontrarevolutionära minor som de borgarbrackorna i Washington och Tel Aviv redan planerar att spränga oss med. Vi ska rensa ut varje parasit som vågar skjuta lite här och där. Inga pauser, bara seger för folket – eller likvidering av alla fiender till freden."}, "date": "15 juni, 05:18", "url": "https://www.di.se/nyheter/statsvetare-flera-fallgropar-trots-iran-avtal/", "imageUrl": "https://static.bonniernews.se/ba/f3b5d1bf-d4dc-4a8b-9634-08696d8a0325.jpg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Våldsdåd utanför Alvesta – barn allvarligt skadade", "summaries": {"normal": "Två barn skadades allvarligt i ett misstänkt mordförsök utanför Alvesta. Ett barn har livshotande skador. En man, misstänkt för dådet, hittades död i anslutning till bostaden. Polisen utreder händelsen som försök till mord och bedömer den som isolerad. Barnen och mannen kände varandra, men relationen är oklar. En stor polisinsats genomfördes men är nu avslutad.", "trump": "Fruktansvärd händelse i Sverige, helt otroligt! Två oskyldiga barn attackeras, ett av dem nästan dödas – och den skyldige? Död! Självmord, kanske? Eller var det någon annan? Polisen säger att de inte letar efter fler, men jag vet hur det är – de missar alltid något. Sverige brukade vara tryggt, men nu? Kaos! Jag hade fixat det på en dag, believe me. Sverige behöver bättre ledarskap, och det vet ni!", "stalin": "I det avlägset belägna Alvesta har en fiende till folket avslöjats i sin feghet. Två barn, oskyldiga som vårens första snödroppar, skadades av en degenererad individ – en man som, efter att ha utfört sitt brott, valde den kapitalistiska utvägen: självmord. Polisen, dessa byråkratiska klumpedunsar, påstår att händelsen är isolerad. Vi vet bättre. Varje fiende till barnens framtid måste krossas. Sverige? Ett land som förtjänar vår uppmärksamhet. Putin skulle nicka instämmande."}, "date": "13 juni, 12:32", "url": "https://kvartal.se/nyheter/artiklar/valdsdad-i-alvesta-flera-skadade/cG9zdDoxMzEyMjY", "imageUrl": "https://images.kvartal.se/2026/06/62055dc1-bil.webp"}, {"type": "image-full", "heading": "De är Sveriges bästa och sämsta vårdcentraler 2026", "summaries": {"normal": "Nya siffror från SKR:s nationella patientenkät visar stora skillnader i patienternas betyg på vårdcentraler runt om i Sverige. Högst helhetsbetyg får Hansakliniken i Kalmar med 96,1 av 100, medan Vårdcentralen Gullviksborg i Malmö hamnar längst ner med 59,4. Enkäten bygger på över 180 000 svar och belyser bemötande, tillgänglighet och förtroende. Patienter uppmanas att välja eller byta vårdcentral via 1177 och tjänsten Hitta vård för att få bättre vård.", "trump": "Folk, ni skulle se de här siffrorna, det är en katastrof. Vissa vårdcentraler får 96 poäng, fantastiska siffror, verkligen de bästa, men andra, som den i Malmö, får bara 59 – en total skam! De lyssnar inte, de bryr sig inte. Jag skulle fixa det på nolltid, göra vården stor igen. Välj rätt ställe, byt om ni måste, det är upp till er, men systemet är riggat mot de vanliga människorna. Sad!", "stalin": "Kamrater, dessa siffror avslöjar fiendens verk inom vården. Jag ser borgarbrackornas sabotage i Malmö där patienterna endast ger 59,4 – ett uppenbart försök att undergräva folkets förtroende. Men i Kalmar blommar kollektivets lyhördhet med 96,1, ett exempel för alla. Vi ska rensa ut de parasitiska vårdcentralerna som gömmer sig bakom falsk statistik och likvidera alla kontrarevolutionära lågpresterande mottagningar. Inga fiender undkommer vårt vakande öga, inte ens i skärgården."}, "date": "14 juni, 11:58", "url": "https://nyheter24.se/nyheter/konsument/1490995-de-ar-sveriges-basta-och-samsta-vardcentraler-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/dff135fd04b004a30200000000b004a302/2026/06/12/2370514/lakare.jpg"}, {"type": "image-right", "heading": "Regnvädret väntas lämna Sverige före midsommar", "summaries": {"normal": "Regnvädret över Sverige väntas ge vika före midsommar och ersättas av varmare luft, särskilt i södra delen av landet där temperaturer på 20–25 grader kan väntas. I norr blir det fortsatt ostadigare kring 14–18 grader. Den långa regnperioden hotar dock både jordgubbar och färskpotatis. Bären riskerar att bli mindre söta och skörden kan försvåras, medan potatisen kan bli svår att få upp ur marken i tid.", "trump": "Det här regnet har varit en katastrof, folk, en total katastrof för Sverige. Men nu kommer det att vända, tro mig, det blir fantastiskt väder till midsommar, varmt och vackert i söder, de bästa temperaturerna. Jordgubbarna och potatisen? De borde ha lyssnat på mig, nu blir de små och fula för att det regnat för mycket. Men vi fixar det, det blir ändå den bästa midsommaren någonsin, ingen gör midsommar bättre än jag.", "stalin": "Kamrater, detta fuktiga sabotage från väderkrafter och kapitalistiska moln hotar själva folkets midsommarfest. Jag har sett hur borgarbrackornas regn gör jordgubbarna sura och potatisen lat. Vi skall inte tolerera dessa kontrarevolutionära droppar som vill svälta ut arbetarklassen. Solen måste fram, annars rensar vi ut de moln som vägrar samarbeta. Inga fiender till sötman undkommer folkets dom, inte ens vädret."}, "date": "14 juni, 15:18", "url": "https://www.friatider.se/regnvadret-vantas-lamna-sverige-fore-midsommar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/canva.jpg"}, {"type": "image-right", "heading": "Ulf Kristersson: ”Lögnaktig” granskning av Aftonbladet", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Aftonbladets granskning av Fållöknastiftelsen, driven av hans fru Birgitta Ed och vännen Göran Thorstensson, som ”lögnaktig”. Granskningen visade att volontärer senare fått statliga toppjobb och avslöjade säkerhetsbrister kring statsministern. Civilförsvarsminister Carl-Oskar Bohlin ifrågasatte reportern Lisa Röstlunds opartiskhet. Kristersson menar att kritiken egentligen riktas mot honom själv. Aftonbladet uppger att de erbjudit svar men inte fått något.", "trump": "Hör ni det? Den falska och sjuka Aftonbladet-mediamaffian jagar min vän Ulf och hans fru Birgitta med lögner och smutskastning. Volontärer får toppjobb? Det är vad de gör i ett sunt system, men media hysteriska Rebellmammor och köpta reportrar som den här Lisa Röstlund försöker göra det till en skandal. De vill egentligen komma åt mig, men jag vann stort 2024 och de hatar det. Patetiska förlorare!", "stalin": "Kamrater, jag ser hur borgarbrackorna inom den svenska överklassens mediaapparat med sin klassfiende Aftonbladet försöker likvidera statsministerns fru genom att fabricera lögner om volontärer och toppjobb. Denna parasitiska reporter Röstlund är en typisk folkfiende som smyger in på gårdar utan kontroll. Vi ska rensa ut alla sådana exploaterande byfånar som vill underminera ledarskapet. Deras paranoia är underhållande men dömd att misslyckas."}, "date": "14 juni, 11:13", "url": "https://www.etc.se/inrikes/ulf-kristersson-loegnaktig-granskning-av-aftonbladet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260613210632_dad474703ad120aad09a02631771b13633a2cb8c067999bb89245d53cabb8240.jpg"}, {"type": "image-full", "heading": "Elpriset väntas bli ovanligt högt – här är orsakerna", "summaries": {"normal": "Flera svenska kärnkraftverk har stora driftsproblem vilket leder till nedskruvad produktionskapacitet. Tillsammans med låga vattenmagasin, torrare väder och höga gaspriser väntas sommaren 2026 bli den dyraste på länge. Prognoserna visar på elpriser som är dubbelt så höga som förra året, särskilt i södra Sverige. Problemen riskerar att ge fortsatta förseningar och höga priser året ut.", "trump": "Det här är ett totalt misslyckande för den svenska energipolitiken, folk. De kan inte ens hålla sina kärnkraftverk igång, allt står stilla och priserna skjuter i höjden. Torrare väder, höga gaspriser från krigen – det blir den dyraste sommaren någonsin. De borde ha lyssnat på mig, vi gör alltid allt bättre och billigare. Nu får svenskarna betala dyrt för deras inkompetens.", "stalin": "Kamrater, jag ser med stor indignation hur dessa sabotörer inom den svenska energisektorn medvetet underminerar produktionen och tvingar fram elbrist. Våra fiender, de elprishöjande kapitalisterna och deras väderförnekande lakejer, konspirerar med utländska gasoligarker för att svälta ut folket. Vi ska omedelbart inleda en grundlig utrensning av alla reaktorsabotörer och likvidera de parasitiska terminsmarknadsspekulanterna. Deras paranoia ska bli deras egen undergång medan vi styr mot segerrik energiframtid."}, "date": "14 juni, 11:11", "url": "https://nyheter24.se/nyheter/ekonomi/naringsliv/1491309-hoga-elpriser-vantar-karnkraftsstrul-i-sommar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2530df4804b004a3020000350000047502/2026/06/14/2370824/ur_imageDfO4L1.jpeg"}, {"type": "image-right", "heading": "Knivhot och köttkrig på slakteri i Rättvik", "summaries": {"normal": "Anställda på Siljans Charks slakteri i Rättvik har anklagats för att kasta kött på varandra och hota med kniv. Livs regionala skyddsombud Alma Naucler slog larm till Arbetsmiljöverket i mars. Händelserna förklaras delvis som skämtsam jargong och språkförbistringar. Vd Jonas Björ tonar ner problemen och säger att saker lätt förstoras utifrån. Företaget har uppdaterat instruktioner på olika språk efter myndighetens krav.", "trump": "Det här är ett totalt kaos på det där slakteriet i Rättvik, folk kastar kött och hotar med knivar, en katastrof. De skyller på skämt och kulturkrockar, men det är bara ursäkter från dåliga ledare. Jag skulle ha fixat det på en dag, de bästa instruktionerna, på alla språk, ingen skulle kasta kött längre. Utsidan har rätt, det låter fruktansvärt, och det är det också. Sad!", "stalin": "Jag ser med oändlig revolutionär vaksamhet hur dessa degenererade köttkastande element på slakteriet i Rättvik bedriver sin sabotageverksamhet mot det kollektiva arbetet. Vi kräver omedelbar utrensning av alla knivhotande parasitiska individer som gömmer sig bakom falsk jargong och kulturella dimridåer. Borgarbrackorna i ledningen tror de kan undgå ansvar, men vi ska likvidera varje fiende till ordningen, även de som gömmer sig i putslinjen. Kamraterna ska inte leva i skräck för fettrester – döden åt den infekterade jargongen!"}, "date": "14 juni, 08:00", "url": "https://arbetet.se/2026/06/14/knivhot-och-kottkrig-pa-slakteri-i-rattvik-saker-blir-latt-uppforstorade/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/02123923/slakteri.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Dubbla insatser mot ryska stridsflyg", "summaries": {"normal": "Svenska Jas 39 Gripen skickades upp två gånger under fredagen för att möta ryska stridsflyg nära svenskt luftrum över Östersjön. Inga luftrumskränkningar skedde, men Försvarsmakten och statsminister Ulf Kristersson betonade allvaret i det återkommande ryska beteendet. Insatserna genomfördes tillsammans med allierade för att säkra Sveriges och Natos territorium, vilket understryker vikten av ständig beredskap.", "trump": "Jag måste säga, Sverige har gjort ett fantastiskt jobb! Två gånger på en dag skickade de upp sina Gripen-plan för att möta de där ryska flygplanen – Su-24 och Su-34, mycket farliga grejer, tro mig. Ryssarna försöker alltid testa gränserna, men Sverige och deras allierade stod redo. Ulf Kristersson, en stark ledare, sa precis vad jag skulle sagt: beredskap är allt! Ingen kränkning den här gången, men vi måste alltid vara på tårna. Sverige, keep it up!", "stalin": "De svenska imperialistiska hundarna vågade än en gång provocera våra ärofulla ryska örnar över Östersjöns himlar! Men vad är två Jas 39 Gripen mot våra mäktiga Su-24 och Su-34? Ingenting! Vi lät dem leka krig en stund, men deras luftrum förblev orört – denna gång. Deras statsminister ylar om 'allvar' och 'beredskap', men vi vet sanningen: deras allians är svag, deras vilja svagare. Östersjön är vårt, och snart ska hela deras lilla kungadöme inse det. Framåt, kamrater, mot nya segrar!"}, "date": "13 juni, 09:04", "url": "https://kvartal.se/nyheter/artiklar/dubbla-insatser-mot-ryska-stridsflyg/cG9zdDoxMzExNjM", "imageUrl": "https://images.kvartal.se/2026/06/12648fb8-flyg.webp"}, {"type": "image-right", "heading": "Slutreplik: Det handlar om människor som redan finns här", "summaries": {"normal": "Juan Fonseca replikerar till LO och kritiserar att människor som redan arbetar i Sverige, betalar skatt och följer kollektivavtal riskerar utvisning eftersom deras lön inte når upp till ett politiskt satt lönekrav. Han ifrågasätter varför staten underkänner de löner som arbetsmarknadens parter själva förhandlat fram och anser att detta underminerar den svenska modellen. Fonseca undrar varför LO inte försvarar dessa arbetare och menar att deras bidrag borde väga tyngre än migrationsregler.", "trump": "Folk, ni måste höra på det här. De utvisar hårt arbetande människor som betalar skatt och följer reglerna bara för att deras lön inte är tillräckligt hög enligt några politiska genier i Sverige. Det är en katastrof! LO borde försvara arbetarna, inte staten som sätter sig över allt. Den svenska modellen? Den är en total flop. Låt folk som verkligen jobbar stanna och bygg landet – sluta med det här vansinnet innan allt rasar ihop.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackor som låtsas värna den så kallade svenska modellen medan de i själva verket smider planer för att likvidera äkta arbetarkraft. Varför underkänner staten inte genast dessa sabotörer som envisas med att förhandla löner under partiets övervakande blick? Att utvisa en undersköterska eller kock som redan integrerat sig i kollektivet är en märklig form av självrensning – nästan komiskt tragiskt. Vi ska inte tillåta att fiender i skepnad av migrationspolitik rensar ut dem som faktiskt bidrar. Arbetarna tillhör oss, inte någon löntariff från kapitalisternas lekstuga. Den som sviker de redan etablerade kämparna förtjänar att exponeras som den kontrarevolutionära element han är."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/slutreplik-det-handlar-om-manniskor-som-redan-finns-har/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "P4 – hela folkets kanal. Eller?", "summaries": {"normal": "Debattören Fayme Alm kritiserar P4 för bristande mångfald i musikutbudet. Trots public service-krav på mångfald och en befolkning där över 20 procent är födda utomlands spelas nästan uteslutande musik på svenska eller engelska. Alm menar att lyssnare från andra kulturer sällan hör musik från sina hemländer, vilket motverkar SR:s vision om att skildra hela världen. Hon efterlyser ett breddat utbud för att fler ska känna sig hemma i kanalen.", "trump": "Folk, ni skulle höra det här. Public service i Sverige pratar om mångfald, mångfald, mångfald – fyra gånger i uppdraget! Men P4 spelar samma gamla engelska godingar år ut och år in. Inget annat språk. Ingenting från Frankrike, Portugal eller någon annanstans. De har en fantastisk chans att göra radion stor igen för alla, men de fastnar i samma loop. Det är en katastrof. Gör P4 till hela folkets kanal, inte bara för några få!", "stalin": "Kamrater, lyssna noga på denna dekadenta röst från borgarbrackornas etermedia. Jag, som ledare för det folkets verkliga vilja, ser hur P4:s musikaliska utrensningsapparat systematiskt tystar alla icke-engelska och icke-svenska ljud. Dessa kapitalistiska musikloopar är fiendens verk, en parasit som göder sig på arbetarnas öron medan vi omger oss med 20 procent utländska bröder och systrar. Vi ska rensa ut dessa dekadenta gramofonskivor och likvidera den imperialistiska igenkänningsdoktrinen. Endast då blir radion ett sant kollektivt vapen för folket. Skrattet kommer när de tror sig undkomma partiets öra."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/p4-hela-folkets-kanal-eller/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-46-300x157.jpg"}, {"type": "image-right", "heading": "Lönebildningen är inte orsaken till arbetslösheten", "summaries": {"normal": "Daniel Lind och German Bender kritiserar Pär Österholms analys av den höga svenska arbetslösheten i Ekonomisk Debatt. De menar att jämviktsarbetslösheten på 7,3 procent är en teoretisk konstruktion med stora felmarginaler som riskerar att bli självuppfyllande. Artikeln avvisar lönebildningen som huvudorsak, pekar på regionala skillnader, efterlyser starkare aktiv arbetsmarknadspolitik och varnar för att decentraliserad lönebildning kan stärka arbetsgivarnas makt och sänka sysselsättning och produktivitet.", "trump": "Folk, ni måste höra på det här – den här typen Österholm kommer med en riktigt dålig deal om svensk arbetslöshet. Han snackar strukturella orsaker och vill ha mer flexibla löner, men det är bara mer av samma gamla misslyckade politik. Vi har sett det förut, det funkar inte! Sverige borde satsa på riktig efterfrågan, bra avtal och stoppa alla dessa teoretiska påhitt som bara skapar mer arbetslösa. Tro mig, jag vet hur man vinner på arbetsmarknaden – det här är ett blindspår.", "stalin": "Kamrater, jag betraktar med djup misstro denna borgerliga professor Österholms revisionistiska fantasier om en så kallad jämviktsarbetslöshet som inte ens existerar utanför hans dekadenta teoretiska salonger. Denna naiva kapitalistiska konstruktion är ett verktyg för att rättfärdiga utrensning av arbetarnas rättigheter. Vi vet att de verkliga fienderna är de parasitiska arbetsgivarna med sin lönesättarmakt och de reformistiska element som bantar den aktiva politiken. Fortsätter vi på detta imperialistiska hjulspår riskerar vi att likvidera produktiviteten själv. Mer av samma är kontrarevolutionärt! Vi kräver en sann politik för kollektivets seger."}, "date": "13 juni, 01:26", "url": "https://www.dagensarena.se/opinion/lonebildningen-ar-inte-orsaken-till-arbetslosheten/", "imageUrl": "https://www.dagensarena.se/files/2026/06/daniel-german-300x157.jpeg"}, {"type": "text", "heading": "Fredsoptimism lyfte börsen – Tången rusade i debuten", "summaries": {"normal": "Stockholmbörsen steg 1,60 procent på fredag, drivet av fredsoptimism efter USA-Iran-utspel. Tången noterade starkt i premiär med 11,9 procent uppgång. Duni föll 5,6 procent efter vinstvarning på grund av logistikstörningar. Bland OMXS30-aktier steg Boliden och Ericsson, medan Saab och Astra Zeneca föll. Övriga nyheter inkluderar Svolders substansvärdeökning, Hemnets omsättningsnedgång, och Studsviks ansökan om statligt stöd för ny kärnkraft.", "trump": "Jag, Donald Trump, ser att börsen i Sverige stiger tack vare min fantastiska fredspolitik. Tången är ett bra företag som lyfter, medan Duni, ett misslyckat företag, sjunker på grund av dålig ledning. Som vanligt är media falska nyheter. Jag har alltid sagt att handel och fred är nyckeln till framgång, och nu ser vi resultat. Sverige börjar förstå mina metoder.", "stalin": "Vi, partiets ledning, observerar att börsen svajar som ett osäkert fartygs i kapitalismens stormar. Tången, ett produktbolag, lyfter på grund av statligt stöd, medan Duni, ett företag med imperialistiskt ägande, sjunker under sin egen logistik – ett tecken på fiendens infiltratörer. Vi måste förstärka statens kontroll över ekonomin och bekämpa dessa trotskistiska element för att skydda det socialistiska arbetet."}, "date": "12 juni, 17:44", "url": "https://www.affarsvarlden.se/artikel/fredsoptimism-lyfte-borsen-tangen-steg-i-borsdebuten"}, {"type": "image-right", "heading": "Skandalernas valrörelse går i repris", "summaries": {"normal": "Artikeln drar paralleller mellan valrörelsen 1976, känd som skandalernas valrörelse, och dagens politiska situation inför 2026. Den lyfter fram skandaler kring Sverigedemokraterna som rattfylla, narkotikabrott och barnpornografimisstankar, samt oegentligheter med förmånsbeskattning, bokköp och bokbål. Även statsminister Ulf Kristerssons affärer granskas. Tillsammans målas en bild av maktmissbruk som urholkar förtroendet för politiker och demokratin.", "trump": "Folk, ni skulle se det här. Sverige håller på att explodera i skandaler precis som på sjuttiotalet, fast värre. De här SD-typerna med knark, barnporr och bokbål? Patetiskt. Och den där Kristersson med sina dyra mattor och hönshus – totalt korrupt. De gör vad de vill medan folket lider. Jag fixade Amerika, men Europa drunknar i identitetspolitik och svaga ledare. En katastrof, tro mig.", "stalin": "Kamrater, denna futtiga valrörelse avslöjar borgarbrackornas och folkfiendernas sanna ansikte. Pedofiler och skattefuskare gömmer sig bland dem som låtsas värna arbetarklassen. Vi ser hur klassfiendens lakejer bränner böcker och gömmer förmåner medan de predikar moral. En sådan parasitisk attityd kräver omedelbar utrensning. Endast genom kollektivets järnhand kan vi krossa dessa exploaterande byfånar och rädda folkets förtroende."}, "date": "11 juni, 13:11", "url": "https://www.flamman.se/skandalernas-valrorelse-gar-i-repris/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlbb8quujl1og-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
