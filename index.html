rsson menade också att Sverige inte behöver mer landbaserad vindkraft.", "trump": "De här två förlorarna i Gävle, den röda Andersson och den svaga Kristersson, slåss om vem som ska styra ett land på väg mot katastrof. Minoritetsregering med hoppande majoriteter? Patetiskt! Jag skulle aldrig acceptera sådan svaghet. De lovar sänkt bensinskatt som om det vore en stor sak – jag fixade bättre deals. Sverige behöver starka ledare, inte dessa clowner.", "stalin": "Jag betraktar dessa ynkliga borgerliga och socialdemokratiska element som famlar efter makt i sin förfallna stat. Hoppande majoriteter? En sådan förrädisk taktik förtjänar endast förakt och utrensning. Den falska statsministern Kristersson avslöjar sin svaghet genom att fördöma det som oundvikligt. Kamrater, se hur dessa dekadenta figurer klamrar sig fast vid makten medan folket lider under deras inkompetens. Reningsprocessen närmar sig."}, "date": "10 september, 05:17", "url": "https://www.dagensps.se/varlden/politik/andersson-oppnar-for-hoppande-majoritet", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/statsministerkandidaterna-magdalena-ande.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Trump utlovar pengaregn vid valseger", "summaries": {"normal": "Republikanernas konvent i Dallas inför mellanårsvalet inleddes med ett tal av Donald Trump. Han varnade för att sittande regeringsparti brukar förlora mandat och lovade att republikanerna ska bryta den trenden. Trump utlovade 5 000 dollar till varje vuxen amerikan om partiet tar kontroll över kongressen, men varnade för ett \"helvete\" vid förlust.", "trump": "Folket, det är jag som står på röstsedeln fast ni inte ser mitt namn! De korrupta demokraterna vill ge er skattehöjningar och kaos igen. Men röstar ni rätt får ni alla 5 000 dollar från mig – som en jätteutdelning från det bästa bolaget i världen. New Mexico blir New America och Hormuzsundet blir Trumpsundet. Fantastiskt va?", "stalin": "Kamrater, se hur den dekadenta borgarklassen i det förfallna imperiet tvingas muta massorna med löjliga dollarlöften för att behålla makten. Den svekfulla oppositionen kommer att utplånas i valets ugn. Jag ler från historien när fienderna döper om sund och stater efter sina egna patetiska namn. Deras paranoia är underhållande. De kommer alla att svika varandra."}, "date": "10 september, 05:15", "url": "https://www.dagensps.se/varlden/politik/trump-utlovar-pengaregn-vid-valseger", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/usas-president-donald-trump-talar-under.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Går högerpolitiken ens att rösta bort?", "summaries": {"normal": "Artikeln ifrågasätter om högerpolitiken kan röstas bort. Magdalena Andersson söker stöd från vänstern men öppnar för samarbete med högerpartier. Opinionen har jämnats ut, Liberalerna närmar sig spärren och väljarna är rörliga. Andersson lovar stram migrationspolitik och straffskärpningar medan högern utlovar sänkta skatter och gratis förskola. Frågan är hur mycket som egentligen skulle förändras vid ett maktskifte.", "trump": "Folk, ni skulle se det här svenska cirkuset. Den röda Andersson är så svag att hon ber borgarna om hjälp medan hon låtsas vara tuff på migration. Patetiskt. Hennes vänsterextremister hatar Israel men älskar kvotering och identitetspolitik. Högern lovar skattelättnader och jag älskar det. De borde vinna stort. Sverige behöver inga galna vänsterknäppisar som styr, tro mig, det blir en katastrof.", "stalin": "Jag betraktar dessa socialdemokratiska avfällingar med förakt. De kryper för de profitthungriga borgarhyenorna och lovar att bevara det gamla förtrycket. Vilken ynkedom att tigga om blocköverskridande avtal med klassförrädare. Oppositionen borde rensa ut dessa dekadenta element som vägrar verkliga reformer. Maktskifte utan utrensning av folkets fiender är meningslöst. Kamrater, se igenom bluffen."}, "date": "7 september, 14:22", "url": "https://www.flamman.se/gar-hogerpolitiken-ens-att-rosta-bort", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/ebba-busch-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Kaptenen och lotsen i rätten efter Tjörn-olyckan", "summaries": {"normal": "Rättegången har inletts mot den ryske befälhavaren och den svenska lotsen på lastfartyget Misje Verde efter sommarens tragiska olycka utanför Tjörn. Fritidsbåten syntes tydligt på radaren, men fartyget hann ändå ikapp den och körde på den. En kvinna och hennes dotter omkom, medan pappan och sonen räddades. Männen åtalas för bland annat vållande till annans död och nekar till brott.", "trump": "Vilken total katastrof! Den här gigantiska båten bara körde rakt på en liten försvarslös fritidsbåt utanför Tjörn, trots att den syntes perfekt på radarn! Fyra människor i vattnet, helt fruktansvärt. Och nu sitter kaptenen och lotsen där och skyller på varandra och nekar till brott? Otroligt svagt! Om jag hade styrkt sjötrafiken hade sånt här aldrig hänt. Fixa radarn och skärp er!", "stalin": "Ett uppenbart fall av monumental skadegörelse och kriminell inkompetens på bryggan! Det norskregistrerade fartyget ignorerade totalt alla radardata medan besättningen sov vid rodret. Detta är ett sabotage mot den socialistiska sjösäkerheten. Staten kräver fullständig rannsakning i Göteborgs tingsrätt. Kaptenen och lotsen ska hållas ansvariga för sin svidande vårdslöshet, för i vår gemensamma kamp tolererar vi inte att slarv släcks ut liv."}, "date": "10 september, 05:45", "url": "https://www.gp.se/nyheter/sverige/kaptenen-och-lotsen-i-ratten-efter-tjorn-olyckan.51e54caa-e2b9-5050-8a92-6f9281ec35cc", "imageUrl": "https://www.gp.se/images/article/51e54caa-e2b9-5050-8a92-6f9281ec35cc/images/1kLExrYmHWdFuVlbLQq8OlrcKNt4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Gruppen som kan avgöra valspurten: ”SD stinker mer”", "summaries": {"normal": "Inför valspurten minskar Tidöpartierna gapet till oppositionen, vilket gör att de tio procent osäkra högerväljarna kan bli avgörande. Enligt statsvetare lutar denna grupp mot höger men tvekar eftersom de ogillar Sverigedemokraterna mer än Vänsterpartiet. Samtidigt noteras en uppgång för Liberalerna, medan Socialdemokraterna backar då väljare drar åt olika blockhåll.", "trump": "Sveriges valspurt är ett absolut kaos, helt otroligt svagt! Falska mätningar visar att oppositionen darrar medan de där tio procenten osäkra väljarna står helt handlingslösa. De älskar högern men hatar radikalerna, och gänget som kallas SD stinker visst värre än kommunisterna! Totalt vansinne. Jag sa till dem, skaffa lite riktiga tullar och olja istället för det här tramsiga gnället!", "stalin": "Inför det nära förestående valet i den svenska provinsen ser vi hur bourgeoisien svettas och de så kallade osäkra elementen vacklar likt berusade kulaker. Våra statsvetenskapliga kommissarier rapporterar att de vacklande massorna finner både det ena och det andra partiet illaluktande. Partiets apparat noterar att avvikare drar åt fel håll, vilket vi snarast bör åtgärda med lämpliga administrativa åtgärder och obligatorisk omskolning."}, "date": "10 september, 05:30", "url": "https://www.gp.se/nyheter/sverige/gruppen-som-kan-avgora-valspurten-sd-stinker-mer.035daa4b-e5db-509c-9d8f-d804b3da67d5", "imageUrl": "https://www.gp.se/images/article/035daa4b-e5db-509c-9d8f-d804b3da67d5/images/1J32AkcPmsA_gdCTvBpvSS1oYems-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Per Sinding-Larsen lämnar SVT", "summaries": {"normal": "Musikjournalisten Per Sinding-Larsen lämnar SVT efter 27 år. Bakom beslutet ligger ett växande missnöje med att kanalen har förändrats och tappat fokus på ung ny musik och musikkultur, vilket han var van vid. Sinding-Larsen är mest känd för programmet PSL som sändes i 14 år innan det lades ned 2024.", "trump": "Per Sinding-Larsen lämnar SVT efter 27 år! En väldigt sorglig dag, men helt ärligt, kanalen har blivit totalt svag och woke. De sparkar ut den riktiga musiken. Jag har sett det, alla säger det. Mitt PSL-program var fantastiskt, det bästa någonsin, men de förstör allt. Sverige behöver en rejäl utrensning av fejk media!", "stalin": "Kamrat Sinding-Larsen har efter tjugosju år övergett den statliga televisionen till följd av ideologisk förvirring. En tragisk brist på revolutionär disciplin! När musiken sviker partilinjen måste den omstruktureras. Denna avhoppare visar att borgerliga kulturarbetare aldrig är att lita på. Hans program PSL är nu ett minne blott i folkhemmets arkiv."}, "date": "9 september, 14:45", "url": "https://kvartal.se/nyheter/artiklar/per-sinding-larsen-lamnar-svt/cG9zdDoxODg1NjA", "imageUrl": "https://images.kvartal.se/2026/09/d100971e-per.webp"}, {"type": "image-right", "heading": "Kommunistiska Partiet kan ta mandat: ”Ser det som en möjlighet”", "summaries": {"normal": "Enligt färska opinionsundersökningar växer stödet för övriga partier i Nybro och Göteborg. Kommunistiska Partiet ser en möjlighet att ta mandat i Nybro där omkring 300 röster kan räcka. I Göteborg hoppas partiet nå två procent. Partiet har bedrivit en aktiv valrörelse med valstugor och programcirklar. Stödet för övriga partier har ökat jämfört med valet 2022.", "trump": "Folk är så trötta på de vanliga förlorarpartierna att de vänder sig till kommunisterna. Kan ni fatta det? I Nybro räcker några hundra röster för att de röda ska ta plats. Det är en total skam. De globalistiska eliten och deras woke-vänner har förstört allt. Nu får vi se revolutionära röster i fullmäktige. Patetiskt, men underhållande. Amerika har tur som har mig istället för den här cirkusen.", "stalin": "Kamrater, dessa profitthungriga klassförrädare har misslyckats så grundligt att arbetarna vänder sig till oss igen. I Nybro kan några hundra röster räcka för att bryta borgarblockets grepp. Jag ler i graven åt hur de dekadenta liberalerna skakar. Fortsätt kampen. Snart rensar vi ut de sista resterna av deras falska demokrati och återtar makten åt folket. Det är en historisk nödvändighet."}, "date": "7 september, 15:33", "url": "https://proletaren.se/artikel/kommunisterna-nara-mandat-ser-det-som-en-mojlighet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/K-i-valet-768x402.jpg"}, {"type": "image-right", "heading": "Vanliga svenskar kan stoppa vänsterns antisemitism", "summaries": {"normal": "Artikeln beskriver ett ökat hot mot Sveriges judiska minoritet sedan Hamas attack den 7 oktober 2023. Vänsterpartiet kritiseras hårt för att ha bjudit in personer som hyllat terrorister och spridit antisemitiska konspirationer. Många kandidater har petats efter avslöjanden. Författaren uppmanar väljare att rösta på Tidöpartierna för att stoppa vänsterns inflytande och skydda judar.", "trump": "Folk, ni ser det här vansinnet i Sverige? Vänstern är en total katastrof, full av terrorälskande galningar som hyllar Hamas och sprider judehat. Nooshi och hennes radikala vänsterextremister är de värsta losers jag sett. Centerpartiet är patetiska medlöpare. Vanliga svenskar måste rösta på de tuffa killarna i Tidö – annars är det game over för judarna. Jag älskar Sverige, men fixa det här!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterelement som gömmer sig bakom falsk internationalism medan de odlar antisemitiska ormar i sina egna led. Deras terrorromantik är en kontrarevolutionär giftbål som hotar hela folkets enhet. Endast genom obeveklig kamp mot sådana fiender till arbetarklassen kan den sanna ordningen upprätthållas. Slapphet är förräderi. Renhet krävs."}, "date": "8 september, 12:57", "url": "https://samtiden.nu/2026/09/vanliga-svenskar-kan-stoppa-vansterns-antisemitism", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/Skarmbild-2026-09-08-125242-1-e1788865205466.png"}, {"type": "image-right", "heading": "Hundratal i storbråk – tåg ställdes in", "summaries": {"normal": "Ett stort bråk bröt ut på ett tåg i Kungsbacka på onsdagskvällen. Omkring 100 personer var inblandade. Ungdomar hoppade på säten, en tågvärd knuffades och tåget fick omfattande skador. Flera tåg försenades eller ställdes in. Polisen utreder ofredande och skadegörelse.", "trump": "Titta på det här! Hundratals galna, onyktra ungdomar som beter sig som vänsterns värsta woke-monster i Kungsbacka. De hoppade på sätena, knuffade folk och förstörde ett helt tåg. Biden lämnade efter sig ett kaos där ingen tar ansvar. Nu fixar jag ordning på gatorna och i samhället igen – inga ursäkter!", "stalin": "Se hur den dekadenta ungdomshorden, dessa försupna klassförrädare, rasar fram som en parasitisk svärm och förstör samhällets järnvägar. Jag ler mörkt från historien. Sådana element kräver omedelbar utrensning och järnhand. Inga tåg avgår förrän ordningen är återställd under folkets oövervinnerliga ledning."}, "date": "10 september, 00:14", "url": "https://riks.se/nyheter/hundratal-i-storbrak-tag-stalldes-in", "imageUrl": "https://admin.riks.se/uploads/medium_30c111e5_f2fc_47b7_9dac_4f3aea36a47e_ae5a3d9fe7.jpg"}, {"type": "image-right", "heading": "MP: Stolt över målet att göra Sverige fattigare", "summaries": {"normal": "Miljöpartiets Amanda Lind uttrycker stolthet över målet att höja bensinpriset med minst sex kronor, enligt artikeln. Författaren kritiserar detta som en politik som gör Sverige fattigare genom ökade transportkostnader, inflation och minskad tillväxt. Artikeln varnar även för partiets motstånd mot kärnkraft och syn på migration, som leder till utanförskap och höga kostnader för samhället.", "trump": "Titta på den här galna Amanda Lind, hon skryter öppet om att göra Sverige fattigare med sina vansinniga bensinpriser! Sex kronor extra, kan ni fatta? De gröna kommunisterna hatar bilar, kärnkraft och sunt förnuft. Biden skulle älskat det här. Sverige håller på att kollapsa under dessa radikala idioter – precis som vi nästan gjorde innan jag kom tillbaka och fixade allt.", "stalin": "Jag betraktar med förakt dessa miljöidealister som medvetet driver ett helt folk mot fattigdomens avgrund. Att höja bränslepriser och förneka kärnkraftens kraft är sabotage mot statens produktivkrafter. Deras naiva migrationsexperiment föder parasitiska element och kriminella element som gnager på samhällets fundament. Kamrater, sådana element måste oskadliggöras innan de förgiftar hela kollektivet."}, "date": "8 september, 02:27", "url": "https://samtiden.nu/2026/09/mp-stolt-over-malet-att-gora-sverige-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7314.jpeg"}, {"type": "image-full", "heading": "Mohamsson hånar C-ledarens regeringsinvit", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson avvisar bestämt Centerledaren Elisabeth Thand Ringqvists invit om att bilda en mittenregering. På X hånar Mohamsson utspelet som en \"fuskregering\" och betonar att Liberalerna vill fortsätta samarbetet med Tidöregeringen efter valet.", "trump": "Simona Mohamsson, en väldigt smart person, totalt krossade den här svaga Centerledaren och hennes löjliga fuskregering! De lever i en total fantasivärld. Mycket dåligt! Vi vill ha starka, vinnande regeringar som Tidö, inga misslyckade förlorare som försöker lura folket. Mohamsson sa det som det är: verkligheten vinner alltid över fejkade drömmar!", "stalin": "Centerledarens patetiska drömmar om en så kallad \"mittenregering\" har krossats av kamrat Mohamsson, som klokt nog vägrar delta i denna borgerliga villfarelse. Att föredra fantasier framför den hårda verkligheten är ett avsteg från linjen som måste stävjas. Våra organ noterar detta borgarkrig med största nöje."}, "date": "9 september, 09:18", "url": "https://kvartal.se/nyheter/artiklar/mohamsson-hanar-c-ledarens-regeringsinvit/cG9zdDoxODgwMTY", "imageUrl": "https://images.kvartal.se/2026/09/4dac4b74-smm.webp"}, {"type": "image-full", "heading": "Rök ihop i storgräl: ”Han vill stå här och bråka”", "summaries": {"normal": "I SVT:s statsministerduell grälade Magdalena Andersson och Ulf Kristersson om mängdrabatten. Andersson anklagade Kristersson för att ljuga och kalla honom ovärdig som statsminister. Kristersson kritiserade Socialdemokraterna för att ha röstat nej till att avskaffa rabatten trots tidigare löften. Debatten präglades av hårda ord om brottsoffer, ekonomi och politiskt spel.", "trump": "Vilken total cirkus! Den sovande svenska socialisten Andersson ljuger sig blå i ansiktet och kallar den riktige ledaren Kristersson ovärdig. Hon röstar nej till att sluta gynna serievåldtäktsmän och kallar det ett luftslott. Patetiskt! Ingen bryr sig om brottsoffren, de prioriterar bara bistånd medan brottslingarna skrattar. Sverige behöver en riktig fixare, inte dessa förlorare.", "stalin": "Jag betraktar med djup förakt dessa dekadenta borgerliga opportunister som slåss om straffrabatter som om det vore en fråga om revolutionär rättvisa. Den ena lögnaren anklagar den andre för lögner medan brottsoffren offras på klassfiendens altare. Vilken ynklig teater! I ett sant kollektiv skulle sådana element ha avrättats redan i gryningen för att skydda folkets vilja."}, "date": "9 september, 22:14", "url": "https://www.tv4.se/artikel/MeVDhxcWlSGTjcgB1T8iy/harda-attacken-mot-kristersson-han-vill-sta-haer-och-braka", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FBBBINRyPBbWfRWAwmv1uM%2Fa2420a5e3a79ba08e114746296c11dc3%2F09-Statsministermotet-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Carl-Oskar Bohlin fortsätter kriget mot medierna – och SVT viker sig", "summaries": {"normal": "Carl-Oskar Bohlin (M) attackerade en SVT-reporter under en intervju om politiker som går till angrepp mot journalister. Han publicerade inspelningen själv och kritiserade reportaget. SVT valde att skjuta upp sändningen till efter valet. Ledaren kritiserar detta som en kapitulation och varnar för att antimediepopulism underminerar mediernas roll som informationskälla och maktgranskare.", "trump": "De här svenska mediadynorna och deras vänstervridna Public Service är ett skämt. Den stackars ministern Bohlin gör precis rätt när han krossar den falska reporterns agenda. SVT är fega som råttor och skjuter upp reportaget – typiskt för de riggade systemmedierna. De hatar folket och älskar bara sin egen elitära bubbla. Patetiskt!", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom borgerliga medier kryper för makten. När en minister angriper en reporter och de sedan skjuter upp sändningen avslöjar de sin sanna natur som rädda lakejer. Vi ser tydligt hur folkets fiender försöker tysta sanningen. En sådan svaghet förtjänar utrensning ur den kollektiva medvetenheten."}, "date": "8 september, 16:13", "url": "https://www.etc.se/ledare/carl-oskar-bohlins-attack-mot-svt-aer-saa-grov", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908130920_fcc6fd23-49e9-47b7-9921-4e8ad4a71e05.jpg"}, {"type": "image-full", "heading": "Försämrade Pisaresultat kopplas till AI-användning", "summaries": {"normal": "Pisaresultaten sjunker i nästan hela OECD, särskilt bland elever från rika familjer. En ny rapport från Pisa visar ett tydligt samband mellan flitig AI-användning och sämre läsförståelse. OECD:s utbildningschef konstaterar att sann inlärning kräver motstånd och att enkel teknik inte stärker hjärnan.", "trump": "Pisa-resultaten är helt katastrofala! Eleverna blir svagare i hela världen, och de rika familjerna drabbas värst, tro mig. Nu visar det sig att AI förstör hjärnorna totalt. Barnen sitter och tittar på robotar istället för att läsa böcker. Precis som jag brukar säga: man blir inte stark av att titta på sport, och man blir inte smart av artificiell intelligens!", "stalin": "Kamrater, de katastrofala Pisa-resultaten visar vad som händer när kapitalistisk dekadens och lathet sprids genom så kallad artificiell intelligens. Dessa skärmar förslöar ungdomen. Statens utredning bekräftar att den som förlitar sig på robotar förlorar sin förmåga att tänka. Den som inte vill lära sig frivilligt kommer att lära sig genom disciplin."}, "date": "9 september, 06:21", "url": "https://kvartal.se/nyheter/artiklar/forsamrade-pisaresultat-kopplas-till-ai/cG9zdDoxODc4NTg", "imageUrl": "https://images.kvartal.se/2026/09/12634a2c-skola.webp"}, {"type": "image-right", "heading": "Nya bevis efter Tjörnolyckan – i sista minuten", "summaries": {"normal": "Rättegången efter den tragiska båtolyckan utanför Tjörn har inletts. I sista minuten har försvaret presenterat nya bevis som hävdar att olycksplatsen är en trång farled enligt föreskrifter för tävlingen Tjörn runt, vilket skulle kunna påverka ansvarsfrågan. Åklagaren bestrider detta. Befälhavaren och en lots står åtalade för vållande till annans död men nekar till brott.", "trump": "De falska nyheterna pratar om en båtolycka vid Tjörn, och nu skyller försvaret på en lokal kappsegling! Helt otroligt. Enligt min expertis är det här ett totalt haveri till sjöss. De har åtalade som nekar, och åklagare som tjatar om trånga farleder. Ingen kan navigera där borta, tro mig, det är en katastrof. Vi behöver starkare båtar, min vän!", "stalin": "En tragisk incident på vattnet utanför Tjörn visar på total brist på disciplin bland befäl och lotsar. Nu försöker man skylla på absurda seglingsregler från en lokal tävling för att undkomma straff. Statens domstolar kommer skoningslöst granska detta sabotage mot ordningen. De anklagade nekar, men i mitt folkets paradis hade inkompetens till sjöss åtgärdats omedelbart i ett bistert läger."}, "date": "10 september, 06:39", "url": "https://www.aftonbladet.se/nyheter/a/gkxo0A/batkaptenens-nya-bevis-efter-tjornolyckan", "imageUrl": "https://akamai.vgc.no/v2/images/fc082714-160c-315c-ad04-2c1fde59a49b?fit=crop&format=auto&w=720&s=b743fcaa90c89224ff078ebc4f1ae00f77ad75b2"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "”Busch får underkänt för sina skolförslag”", "summaries": {"normal": "Elevassistenten Robert Sjulander kritiserar Kristdemokraternas skolförslag om kvarsittning, betyg i uppförande och skoluniformer. Han menar att dessa åtgärder inte hjälper eleverna utan att det istället behövs mer personal i skolan för att ge stöd, skapa struktur och fånga upp elever i tid. Uniformer ses som onödig kostnad.", "trump": "De där svenska vänsterlärarna och deras patetiska kamrater i Kristdemokraterna har ingen aning. Skoluniformer och betyg i uppförande? Patetiskt! Det är bara mer av den där galna identitetspolitiken som gör ungarna till svaga offer. Ni behöver inte fler parasiterande byråkrater, ni behöver tuffa regler och seger! Make School Great Again.", "stalin": "Jag betraktar detta som ett ynkligt försök från dekadenta klassförrädare att maskera sin oförmåga att upprätthålla ordning. Mer personal? Nej. Det som krävs är järndisciplin och utrensning av de svaga element som undergräver kollektivet. Betyg i uppförande är för mjukt. Den som slirar åt fel håll ska likvideras ur systemet för folkets bästa."}, "date": "10 september, 07:00", "url": "https://arbetet.se/2026/09/10/jag-ger-ebba-busch-underkant-for-hennes-skolforslag", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/09105155/skoldebatt.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Fredrik hoppas på fred – för att få jobbet på bruket tillbaka", "summaries": {"normal": "Fredrik Leppänen blev arbetslös när gjuteriet i Guldsmedshyttan lades ner i vintras. Han beskriver hur det är tröttande att vara ledig utan att känna sig ledig. Han söker jobb brett, önskar mer personlig kontakt med Arbetsförmedlingen och hoppas på fred i Mellanöstern så att företagen vågar anställa igen. Bruket har köpts upp och kan ge nya jobb.", "trump": "Hörni, det här är vad som händer när de globala idioterna och de woke-vänliga EU-byråkraterna sabbar verkliga jobb. Den stackars killen sitter hemma och blir galen av att vara ”ledig”. Biden lämnade en sådan röra att ingen vågar anställa. Men nu är jag tillbaka, vi ska göra Amerika – och Sverige – stort igen. Sluta med kvoterna och identitetspolitiken, ge folket riktiga jobb istället för socialistiska mardrömmar!", "stalin": "Kamrater, se hur de giriga hyenorna i kapitalet stänger fabriker och kastar arbetarna i tomhetens träsk. Jag betraktar detta med avsmak från historien. Den dekadenta ledningseliten skapar arbetslösa själar som längtar efter rutiner och disciplin. Vi behöver utrensning av dessa parasiterande profitthungriga element så att folkets verkstäder åter kan brinna av kollektiv kraft. Framtiden tillhör de organiserade."}, "date": "10 september, 07:00", "url": "https://arbetet.se/2026/09/10/fredrik-blev-arbetslos-nar-bruket-la-ner-man-blir-trott-av-att-vara-ledig", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/09133333/fredrik-portratt.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Vänsterpartiets nationalism kan skada Sverige", "summaries": {"normal": "Timbro kritiserar Vänsterpartiets fortsatta nationalistiska och EU-kritiska hållning trots att svenska vänsterväljare blivit allt mer positiva till unionen. Partiet röstar emot frihandelsavtal och försvarssamarbete i Europaparlamentet, vilket enligt rapporten riskerar att hindra Sveriges intressen i en turbulent tid. En röst på Vänsterpartiet ses som en bromskloss för europeiskt samarbete.", "trump": "De där vänsterknäppisar i Sverige har byggt en mur av gammal hederlig nationalism medan de låtsas hata SD. Patetiskt! De kallar EU för ett elitistiskt monster men röstar emot bra handelsavtal som skulle krossa Kina och skydda oss alla. Totala förlorare. Biden skulle älskat deras svaghet, men inte jag. Sverige förtjänar bättre än dessa globalistiska nationalister.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Vänsterpartiet förgiftar den svenska arbetarklassen med sin nationalistiska gift som liknar de värsta reaktionära elementen. De motarbetar europeiskt samarbete och försvarsinitiativ som skulle stärka oss mot globala hot. Deras paranoia mot unionen är en farlig broms för folkets framtid. Rensa ut sådana element innan de fördärvar allt."}, "date": "8 september, 08:00", "url": "https://www.etc.se/debatt/vaensterpartiets-nationalism-kan-skada-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908050956_7bd9bc4c177f365f08fc3bcf84049be732f43db3cc0a08bd47123d6389bf4e45.png"}, {"type": "image-right", "heading": "Riks/Sentio: Liberalerna rusar – Socialdemokraterna rasar", "summaries": {"normal": "Enligt den senaste Riks/Sentio-mätningen rusar Liberalerna från 2,1 till 5,1 procent och tar sig över riksdagsspärren. Socialdemokraterna backar samtidigt till 26,5 procent. Sverigedemokraterna och Moderaterna tappar medan Centerpartiet går fram. Chefredaktör Jacob Hagnell beskriver förändringarna som dramatiska och Liberalernas lyft som ett resultat av taktisk röstning.", "trump": "Folk, det är en total cirkus i Sverige. Liberalerna, de där fega flip-flopparna, rusar plötsligt till 5,1 procent som riktiga vinnare medan Sleepy Magdalena och hennes socialistiska misslyckande rasar ner till 26,5. Patetiskt! SD håller ställningarna och hennes katastrofala kampanj slutar i fiasko. Underbart att se hur de woke-kvoterade förlorarna blöder väljare till de som faktiskt vill ha resultat. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vacklar! Liberalerna stiger plötsligt medan Socialdemokraternas förtryckande lakejer rasar mot avgrunden. Jag ler i skuggorna åt detta kaos. SD visar styrka, en varning till alla folkfiender. Magdalena Anderssons fiasko är en läxa i hur svaga bourgeois-hyonor straffas av folket. Vi ser fram emot utrensningen av otydligheten. Sov inte, fiender."}, "date": "9 september, 19:32", "url": "https://riks.se/nyheter/riks-sentio-liberalerna-rusar-socialdemokraterna-rasar", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_100_f557b8f792.jpg"}, {"type": "text", "heading": "Minister lade ut råintervju – ”extremt farligt”", "summaries": {"normal": "Civilförsvarsminister Carl-Oskar Bohlin spelade in sin egen SVT-intervju och publicerade den oklippt på Youtube innan reportaget sändes. Han kritiserar intervjun som tesdriven. Filosofen Åsa Wikforss ser det som ett aggressivt sätt att ifrågasätta mediernas oberoende och professionalitet. Flera forskare kommenterar att ministerns agerande är nytt och kan ha koppling till valrörelsen.", "trump": "Titta på den här clownen Bohlin, en total loser till minister som spelar in sin egen intervju och lägger ut den på Youtube som en desperat realitystjärna. Fake news-SVT kör sin vanliga agenda medan han försöker slå tillbaka. Patetiskt! I mitt Amerika röjer vi undan sådana woke-mediehyenor och deras identitetspolitiska skitsnack. Fantastiskt underhållande fiasko.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom borgerlig media och politik nu offentligt slaktar varandra. En minister som publicerar sin egen oredigerade intervju blottar hela maskineriet av lögner. Det är ett ypperligt tillfälle att rensa ut alla sådana opportunistiska element som undergräver folkets förtroende. Deras paranoia är en gåva till oss som ser igenom spektaklet."}, "date": "10 september, 07:00", "url": "https://nyheter24.se/noje/kultur/1511930-minister-lade-ut-raintervju-extremt-farligt"}, {"type": "image-right", "heading": "De gjorde arbetslösheten till ett straff", "summaries": {"normal": "Artikeln kritiserar regeringen för att ha gjort arbetslöshet till ett straff genom att trappa ned a-kassan och erbjuda lågt aktivitetsstöd. Författaren varnar Socialdemokraterna för att de riskerar att förlora arbetslösa och fattiga väljare till högern om de inte återupprättar tryggheten. Sverigedemokraternas löften ses som orealistiska.", "trump": "De där svenska socialistbluffarna och deras globalistkompisar har förvandlat arbetslöshet till ett rent skämt. Trappa ned bidragen vart hundrade dag? Patetiskt! De giriga eliterna i Stockholm hatar vanliga arbetare mer än jag hatar fake news. Om jag var där skulle jag säga: bygg upp ekonomin, sänk skatterna och gör Sverige great again, losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare i regeringen har förvandlat arbetslöshet till ett vapen mot folket. Jag ser hur de profitthungriga hyenorna med sin falska disciplin förtrycker arbetarna. Socialdemokraterna måste rensa ut sin svaghet annars kommer de att förlora allt till högerns reaktionärer. Historien dömer de som sviker massorna."}, "date": "10 september, 06:51", "url": "https://arbetet.se/2026/09/10/ulf-kristersson-och-jimmie-akesson-gjorde-arbetsloshet-till-ett-straff", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/10065128/arbetsloshet-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nya mätningen: L på 5,8 procent", "summaries": {"normal": "En ny mätning visar att Liberalerna ökar till 5,8 procent och nu har en statistiskt säkerställd marginal över riksdagsspärren. Stödet har mer än tredubblats sedan augusti, främst från SD- och M-väljare. Trots uppgången har Tidöpartierna ett litet underläge mot oppositionen på 48,1 mot 50,7 procent.", "trump": "Titta på de här Liberalerna, de rusar upp till 5,8 procent – det är en total sensation, folk älskar dem plötsligt! SD-väljarna kommer springande som förlorade hundar. Oppositionen tror de leder men det är en riggad soppa av vänstervridna globalister och identitetspolitiska nollor. Jag har sett bättre valrörelser, tro mig.", "stalin": "Kamrater, se hur de liberala parasiterna plötsligt klättrar till 5,8 procent genom att suga väljare från de andra borgerliga elementen. Det är en komisk dans bland de giriga klassförrädarna. Oppositionen har en tunn ledning, men i folkets namn ska vi snart se en fullständig utrensning av alla opålitliga element som hotar kollektivets enhet. Härligt kaos."}, "date": "9 september, 16:08", "url": "https://www.friatider.se/nya-matningen-l-pa-58-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-852.jpg?itok=rgxRAY_x"}, {"type": "image-right", "heading": "Kraftig val-mobilisering i invandrartäta områden", "summaries": {"normal": "Förtidsröstandet ökar kraftigt i flera av Sveriges invandrartäta områden, där väljarna har en stark vänsterövervikt. Utvecklingen hyllas av de som vill höja valdeltagandet, men möts av oro från högerhåll för att förändrad demografi skiftar maktbalansen. Samtidigt pågår riktade kampanjer från organisationer och religiösa ledare för att få fler att rösta.", "trump": "Titta på det här, totalt galet! Radikala vänstern i Sverige försöker rigga valet genom att skeppa in miljontals nya väljare till förorterna. Rosengård, Tensta – det är en katastrof! Imamer som säger åt folk att rösta, och socialdemokraterna desperata för att behålla makten. Sverige brukade vara fantastiskt, nu har de öppnat gränserna och tappar kontrollen. Tragiskt!", "stalin": "Kamerater, vi observerar med stort intresse hur massorna i de svenska förorterna mobiliseras genom partiets och imamernas fasta disciplin. Men vilken ideologisk förvirring! De röstar på revisionister och vänstermän när de istället borde ställa sig under statens järnhårda kontroll. Om valdeltagandet ökar i miljonprogrammen måste vi säkerställa att rösterna leder till rätt slutresultat, annars blir det Sibirien för funktionärerna!"}, "date": "9 september, 17:50", "url": "https://samnytt.se/kraftig-val-mobilisering-i-invandrartata-omraden", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/09152917/invandrare-mobiliserar-infor-valet.jpg"}, {"type": "image-full", "heading": "Andersson: Ingen aktiehandel för ministrar", "summaries": {"normal": "Socialdemokraternas ledare Magdalena Andersson vill införa en uppförandekod för ministrar om hon blir statsminister. Koden inkluderar ett förbud mot daytrading med aktier för att undvika intressekonflikter. Hon betonar respekt, ärlighet och att agera för Sveriges bästa. Andersson vill också ha breda blocköverskridande majoriteter och en stark opposition.", "trump": "Titta på den här losersocialisten Magdalena Andersson som plötsligt vill förbjuda sina egna korrupta ministrar från att daytrada aktier. Patetiskt! Under min administration hade vi inga sådana skandaler, men efter Sleepy Joe blev allt en cirkus. Nu vill hon spela ren, vad en bluff! Sverige behöver en riktig ledare, inte den här svaga vänstern.", "stalin": "Jag betraktar med förakt hur dessa borgerliga socialdemokrater nu febrilt försöker dölja sina egna giriga element med byråkratiska koder och förbud. Svaga liberaler som darrar inför folkets vrede. Kamraterna inser att endast en järnhand kan rensa ut privatintressen. Oppositionen ska krossas, inte värnas. Inga halvmesyrer!"}, "date": "9 september, 22:02", "url": "https://www.dagensps.se/varlden/politik/andersson-ingen-aktiehandel-for-ministrar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/socialdemokraternas-partiledare-magdalen.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Viftar bort nya utspelet: ”Det vet Ebba Busch naturligtvis”", "summaries": {"normal": "Regeringsbråket inom Tidöpartierna fortsätter inför valet. Ebba Busch slår fast att SD inte är garanterade ministerposter och öppnar för samarbete med Socialdemokraterna. Jimmie Åkesson avfärdar Buschs linje och kritiserar KD för att flörta mot vänster. Det jämna opinionsläget ökar spänningen inför valdagen.", "trump": "Hörni, det här är precis vad de svaga förlorarna gör. Den galna Ebba, hon dansar runt som en fegis och flörtar med de radikala vänsterextremisterna. Åkesson har rätt, antingen är man med eller inte. Precis som när Sleepy Joe förstörde Amerika – nu gör de samma sak i Sverige. Patetiskt!", "stalin": "Jag betraktar dessa dekadenta borgerliga klickar med djup misstro. Den opportunistiska Busch försöker sälja ut folkets intressen till socialfascisterna medan Åkesson genomskådar hennes förräderi. Sådana taktiska manövrer leder oundvikligen till folkets dom. Inga kompromisser med klassfienden. Renhet eller undergång."}, "date": "9 september, 18:41", "url": "https://www.tv4.se/artikel/1YJ4mJu3PDFTewXfszosPh/viftar-bort-buschs-senaste-utspel-det-vet-hon-naturligtvis", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4llHqjfBoDbt5myksHLTNl%2F5297861752dbe3c82eb9c4027426d87f%2F09-buschakesson-webb.jpg&width=1024"}, {"type": "image-right", "heading": "MP-politikern: ”Håller  inte med partiet här”", "summaries": {"normal": "Miljöpartisten och vd:n Salih Sabah har via sitt bolag tagit ut nio miljoner kronor i vinst på fem år, trots sitt partis linje om att skattepengar i välfärden inte ska gå till aktieutdelningar. Partiledningen ser inga problem med detta då processen att fasa ut vinster pågår. Sabah själv anser att privata risker berättigar vinst.", "trump": "Very sad! Den här miljöpartisten pratar om klimatet, men älskar miljoner! Han drar in nio miljoner i vinst från skattebetalarna medan hans eget parti låtsas hata vinster. Totalt falskt! Språkrör Helldén säger att det är okej. Sjukt system, helt korrupt. Jag gillar när folk tjänar pengar, men ställ dig inte och gråt för träden samtidigt som du håvar in cashen!", "stalin": "En så kallad miljöpartist plundrar statskassan på nio miljoner medan partiledningen blundar för denna borgerliga dekadens. Att kalla privatinvesteringar för risk är ett hån mot proletariatet. Om denna kapitalist till politiker hade verkat under mitt styre skulle vi snabbt ha omfördelat hans tillgångar till kollektivets bästa. Korruptionen bland byråkraterna underminerar staten!"}, "date": "10 september, 06:13", "url": "https://www.expressen.se/nyheter/sverige/miljopartisten-som-tagit-ut-miljoner", "imageUrl": "https://static.bonniernews.se/ba/f4749539-56d8-40f0-ae8e-2eb7f6b305b2.jpeg?crop=2560%2C1708%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Jag röstar inte med hopp utan med sorg", "summaries": {"normal": "Artikeln kritiserar den svenska politiska utvecklingen de senaste fyra åren under en högerregering med stöd av Sverigedemokraterna. Skribenten menar att klimatet har blivit mer ovärdigt med hårdare migrationspolitik, långa handläggningstider och ökande samhällsklyftor. Dessutom lyfts svaga skolresultat och bristande integration fram som tecken på en misslyckad samhällsutveckling som präglas av rädsla snarare än hopp.", "trump": "De falska nyheterna i Sverige är helt katastrofala! De har enorma problem med skolan, radikala vänstermänniskor och misslyckad migration, men ändå skyller de allt på den starka högern. Jag har sagt det för länge sedan: om man inte har stenhårda gränser och ordning i skolan kollapsar hela samhället. Total oreda!", "stalin": "Det borgerliga experimentet i det nordiska skogslandet har skapat ett fullständigt oacceptabelt kaos i skolor och byråkratiska institutioner. Istället för att exekvera ordning skyller de inofficiella lakejerna på sina egna tillkortakommanden. Vi noterar att ideologisk slapphet leder till förfall. Statsapparaten måste stramas åt och de ansvariga elementen rensas ut omgående!"}, "date": "10 september, 06:00", "url": "https://www.aftonbladet.se/ledare/a/43lwd6/i-valet-rostar-jag-inte-med-hopp-utan-med-sorg", "imageUrl": "https://akamai.vgc.no/v2/images/2f5f7bee-50f3-3fcc-b12f-a1b63f2e4556?fit=crop&format=auto&h=960&tight=true&w=1440&s=c96c80ef4a27b1eca97ec3b7ef37473148a68b52"}, {"type": "image-right", "heading": "Analysen: S-seger redan \"helt säkrad\" av rekordröstande invandrare", "summaries": {"normal": "Förtidsröstningen i särskilt utsatta områden har ökat med 93 procent jämfört med förra valet. Tobias Hübinette slår fast att detta säkrar en seger för vänstersidan. Kritiker pekar på att den höga invandringen och utdelningen av medborgarskap under Tidöregeringen bidrar till förändrade väljarbaser. SD-toppen Richard Jomshof skyller utvecklingen på Socialdemokraterna.", "trump": "De här galna globalisterna har importerat miljontals röstmaskiner som nu vräker in sina röster mot de riktiga svenskarna. Massinvandring och passfabriken som till och med SD inte stoppade – totalt vansinne. Oppositionens seger är säkrad säger de, men vänta bara. Folket vaknar snart och sparkar ut de woke-vänstervriden som förstörde ert fina land.", "stalin": "Jag ser hur de dekadenta klassförrädarna fortsätter att översvämma nationen med främmande element för att säkra sin makt. Massinvandring som vapen mot arbetarklassen. Nu mobiliseras gettona och röstar bort de falska patrioterna. En tyst revolution mullrar. Kamrater, detta visar att fienderna aldrig vilar. Vi måste alltid vara vaksamma mot sådana parasiterande hyenor."}, "date": "9 september, 14:41", "url": "https://www.friatider.se/analysen-s-seger-redan-helt-sakrad-av-rekordrostande-invandrare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-97_0.jpg"}, {"type": "image-right", "heading": "Johan Jacobsson, 45, döms för medhjälp till dubbelmordet i Brattås", "summaries": {"normal": "Johan Jacobsson, 45, dömdes på onsdagen av Ångermanlands tingsrätt till 14 års fängelse för medhjälp till dubbelmordet på Tor Öberg och Gärd Viklund i Brattås 2005. Domen grundas på dna-bevisning, skospår och samtaluppgifter. Jacobsson ska även betala skadestånd till anhöriga och staten. Han nekar till brottet.", "trump": "Folk, det här är en total katastrof! Den här Johan Jacobsson, en riktig förlorare från Härnösand, har äntligen fått 14 år för att ha hjälpt till med ett brutalt dubbelmord för 21 år sedan. Patetiskt! DNA avslöjade honom som en fullständig nolla. Under Biden skulle han ha sluppit undan, men nu sitter han där han hör hemma – i fängelse. Sad!", "stalin": "Kamrater, se hur den borgerliga rättsapparaten äntligen krossar en fiende till folkets ordning. Denna degenererade lagerarbetare, en parasit som smittade en fotled med sitt förrädiska dna, döms till 14 år. Inga bevis står ensamma, men kollektivet ser allt. Sådana element måste utrotas som ogräs i den socialistiska trädgården. Skrattretande svagt försvar."}, "date": "9 september, 17:55", "url": "https://www.tv4.se/artikel/67HVhqtplReE9mYnWzDlkO/johan-jacobsson-45-doems-till-medhjaelp-foer-dubbelmordet-i-brattas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1d8nkMsLNBiqsHOJuV7Ze2%2F3d3b3e76060f33b07f43f514fa17efbb%2F09-brattas-puff-webb2.png&width=120"}, {"type": "image-right", "heading": "Hedrade framlidne kungen med målgest: ”Känslosam dag”", "summaries": {"normal": "Viking från Stavanger spelade sin första Champions League-match mot Stuttgart samma dag som kung Harald V begravdes. Laget bar sorgband och hedrade även offren efter naturkatastrofen i Nepal med en tyst minut. Stuttgart vann med 3–1 efter Ermedin Demirovics hattrick. Zlatko Tripic kvitterade tillfälligt och hyllade kungen.", "trump": "Lyssnar ni på det här? Norska Viking spelar sin största match någonsin i Champions League samma dag som kungen dör, och de springer runt i sorgband som några veklingar. Stuttgart krossar dem med 3–1. Hattrick på tolv minuter! Under tiden hyllar de någon nepalesisk översvämning. Totalt kaos, folk. De blandade känslorna låter som en riktigt dålig deal.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i väst tvingar arbetarfotbollen att sörja en död kung medan folket i Nepal drunknar i översvämningar. Jag betraktar detta som ett tydligt bevis på den imperialistiska cirkusens förfall. En hattrick av en bosnier och plötsligt ska känslorna hanteras. Patetiskt. Den som inte vinner för kollektivet förtjänar utrensning ur historien."}, "date": "9 september, 23:16", "url": "https://www.svt.se/sport/fotboll/viking-spelade-klubbens-storsta-match-i-sorgband-svart-hantera-kanslorna", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.14/0.48/433c5dc0ebe4465285d6c754627094db35a2dd2fb80b0114034c279ba2298dd7"}, {"type": "image-right", "heading": "Oskarshamn har inte råd att blunda för integrationsproblemen", "summaries": {"normal": "Sverigedemokraterna i Oskarshamn kritiserar kommunledningen för att ha tackat nej till besök från regeringens samordnare för återvandring. Debattörerna menar att kommunen blundar för integrationsproblem som gängkriminalitet och parallellsamhällen. De anser att Oskarshamn måste våga diskutera återvandring som ett verktyg för ökad trygghet och uppmanar väljarna att rösta på SD i valet i september.", "trump": "Oskarshamn gör ett totalt misstag, det är bedrövligt! Kommunledningen vägrar träffa experter på återvandring. Veid och svagt! De blundar för gängkriminalitet och kaos, precis som radikala vänstern gör i USA. Jag känner till integration, tro mig. Om jag styrde Oskarshamn skulle vi rensa upp direkt, det skulle bli fantastiskt, och det snabbt!", "stalin": "Kamrater, den lokala partiledningen i Oskarshamn visar prov på ideologisk vacklan och sabotage mot folkets trygghet genom att vägra lyssna på statens samordnare. Att ignorera avvikelser som gängkriminalitet och uppror tolereras icke. Om dessa sabotörer inte självmant söker upplysning om återvandring, kommer statens järnhand att behöva uppfostra dem. Arbetet mot avvikande element måste skärpas omedelbart!"}, "date": "9 september, 16:06", "url": "https://samnytt.se/oskarshamn-har-inte-rad-att-blunda-for-integrationsproblemen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/09140436/artikelhuvudbild-1-485.jpg"}, {"type": "image-right", "heading": "Tidö tjänar på att ingen pratar arbetslöshet", "summaries": {"normal": "Trots rekordhög arbetslöshet med över 500 000 arbetslösa saknas frågan i valdebatten. Partier och medier prioriterar andra ämnen, medan granskningar av partiernas politik på området ofta uteblir. Tidöpartierna ses som vinnare då misslyckanden med privata aktörer och minskad närvaro hos Arbetsförmedlingen inte ifrågasätts tillräckligt.", "trump": "Titta på det här, Sverige håller på att drunkna i arbetslösa och ingen ens pratar om det! De fega politikerna och deras vänstermedia gömmer sig som riktiga losers. Jag byggde den starkaste ekonomin i historien, men de här idioterna har förvandlat allt till ett skämt. Tidö-gänget borde skämmas, det är en total katastrof!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna tystar ner den växande arbetslösheten för att skydda sina egna intressen. Över en halv miljon utan arbete och ändå ingen debatt! Jag skulle ha genomfört en grundlig utrensning av dessa odugliga lakejer redan vid första tecken på svaghet. Deras tystnad är ett förräderi mot folket."}, "date": "10 september, 01:49", "url": "https://www.dagensarena.se/opinion/tido-tjanar-pa-att-ingen-pratar-arbetsloshet", "imageUrl": "https://www.dagensarena.se/files/2023/02/anna-danielsson-oberg-ny-300x157.jpeg"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och skrattar åt deras identitetspolitiska skit. Klass handlar inte om kvoter och doktorander som helikopteras in. Det handlar om folk som faktiskt jobbar och stänger av stället tillsammans. Patetiska globalistlakejer förstår ingenting.", "stalin": "Kamrater, dessa dekadenta klassförrädare mäter proletariatet med borgerliga enkäter och statistik som om klass vore en egenskap hos individer. Jag säger: organisering föds vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Här sluter Real Madrids fans upp för Ceuta", "summaries": {"normal": "Real Madrids supportrar visade stöd för Ceuta genom flaggor och talkörer under matchen mot Inter. Manifestationen kom efter kritik mot klubben för att inte agera efter migrantkrisen i staden. Supportrarna ropade att Ceuta inte är till salu och höll upp banderoller utanför arenan av rädsla för Uefas regler. Klubben förnekar att de stoppat flaggor.", "trump": "Folket älskar Ceuta och de stora Real Madrid-fansen gjorde det rätta. De viftade med flaggor och skrek att Ceuta inte är till salu, inte ens för de woke migranterna som Marocko skickade som en invasion. Utan de vanliga förlorarna i ledningen tog supportrarna saken i egna händer. Fantastiskt, ingen vill ha Bidens öppna gränser i Spanien heller.", "stalin": "Jag betraktar hur dessa dekadenta klassförrädare i fotbollsklubben tvekade att försvara Ceuta mot den imperialistiska migrantfloden. Men arbetarna och supportrarna reste sig själva med flaggor och rop om att staden inte är till salu. Sådan folklig vrede gläder mig. De penninggalna hyenorna fruktar Uefa mer än folkets vilja. Patetiskt."}, "date": "9 september, 13:26", "url": "https://www.friatider.se/har-sluter-real-madrids-fans-upp-ceuta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-95_0.jpg?itok=6usidc9_"}, {"type": "image-full", "heading": "L över spärren i ny Novusmätning – statistiskt säkerställt", "summaries": {"normal": "En Novusmätning visar att Liberalerna nu ligger statistiskt säkerställt över fyraprocentsspärren med 5,8 procent, en kraftig ökning från 1,9 procent i augusti. Partiledaren Simona Mohamsson varnar för att inte ta ut segern i förskott. Oppositionen leder blocken med 50,7 procent mot Tidöpartiernas 48,1. Endast Liberalernas uppgång är statistiskt säkerställd.", "trump": "Titta på de där Liberalerna, de har plötsligt exploderat till 5,8 procent! Från totala nollor till riktiga vinnare på några veckor. Fantastiskt! Men det är valdagen som räknas, precis som jag alltid säger. Den röda sidan försöker sno det hela, typiska förlorare. Simona gör ett stort jobb, men håll is i magen – ingen vill ha de socialistiska misslyckandena tillbaka.", "stalin": "Se hur de borgerliga opportunisterna plötsligt reser sig ur askan som förrädiska fenixar. Jag betraktar deras hysteriska återkomst med misstänksam glädje. Tre gånger så stort stöd på några dagar? Misstänkt. Oppositionen samlar sig mot kontrarevolutionärerna, men varning till alla svikare: valdagen avslöjar de verkliga fienderna inom systemet. Inga mirakel utan partiets ständiga vaksamhet."}, "date": "9 september, 16:47", "url": "https://www.tv4.se/artikel/6uiXoaoC9Mtryr1GbHjkgP/l-oever-spaerren-i-ny-novusmaetning-statistiskt-saekerstaellt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3tqZMmhx65vnwWZXjaobsX%2F2b0333a4daaab866ae647e7dbc1fa625%2F09-mohamsson-puff.png&width=1024"}, {"type": "image-right", "heading": "Svea hovrätt: Inte grovt att spotta och slå kvinna medan man våldtar henne", "summaries": {"normal": "Svea hovrätt har ändrat en dom om grov våldtäkt. Trots att en man spottade, slog och drog en kvinna i håret under upprepade våldtäkter bedöms gärningen inte som grov. Mannens straff sänks från sex och ett halvt till fem och ett halvt års fängelse. Han ska även betala skadestånd till offren.", "trump": "Folk, ni kommer inte att tro det här. I Sverige låter de en idrottsman spotta, slå och våldta en kvinna utan att kalla det grovt. Domstolen säger att det inte når upp till deras fina krav. Patetiskt. Biden skulle ha älskat det här svaga systemet. Vi gör Amerika starkt igen, inte som dessa veklingar.", "stalin": "Kamrater, se hur dessa dekadenta rättsväsendets lakejer skyddar en våldsverkare. Jag betraktar med avsky hur de vägrar kalla upprepad våldtäkt med slag och spott för grovt brott. Sådana svaga domar är klassfiendens verk. Vi skulle ha rensat ut dessa förtryckande element med järnhand och folkets vrede."}, "date": "9 september, 16:53", "url": "https://riks.se/nyheter/svea-hovratt-inte-grovt-att-spotta-och-sla-kvinna-medan-man-valdtar-henne", "imageUrl": "https://admin.riks.se/uploads/medium_svea_hr_hero_523ce37f4d.jpg"}, {"type": "image-right", "heading": "Vi betalar för annonserna som ber oss lämna landet", "summaries": {"normal": "I en debattartikel berättar Mert Can Yilmaz hur hans fru, en högt integrerad akademiker med svensk lärarlegitimation, bombarderas med sponsrade annonser från Migrationsverket om återvändandebidrag på sociala medier. Annonserna placeras bredvid Sverigedemokraternas budskap, vilket skapar en känsla av att hon ses som en belastning. Yilmaz kritiserar myndighetens val av annonskanaler.", "trump": "Folk, det här är helt galet. Den svenska staten betalar miljoner för att bomba en duktig, integrerad kvinna med annonser om att hon ska packa väskan och lämna landet. Precis som de woke-liberalerna och deras kvotgalna identitetspolitik hatar de framgångsrika invandrare som faktiskt jobbar. Fake news-flöden och byråkratiska hyenor – en total katastrof. Sverige håller på att förstöras av sina egna idioter.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga staten samverkar med reaktionära element för att sprida förgiftad propaganda. Jag betraktar med avsmak hur de profitthungriga byråkraterna och deras fascistiska lakejer skapar en atmosfär av misstro mot arbetande människor. Ingen ansvarig, alla skyldiga. En sådan parasitär fars bör rensas ut innan den förgiftar hela samhällskroppen."}, "date": "10 september, 01:30", "url": "https://www.dagensarena.se/opinion/vi-betalar-annonserna-som-ber-oss-lamna-landet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-47.jpg"}, {"type": "image-right", "heading": "Mandatperiodens vinnare och förlorare", "summaries": {"normal": "Moderaternas politik under Tidöregeringen har gynnat höginkomsttagare genom skattesänkningar och sänkt a-kassa för arbetslösa. En rapport från Arena Idé visar hur inkomstklyftor växt och att arbetslösheten ökat med 100 000 personer. Skattesystemet gynnar aktieutdelning framför lön, vilket skapar orättvisor. Artikeln ifrågasätter om politiken verkligen skapar fler jobb.", "trump": "De här svenska socialistdemokraterna och deras Moderatvänner har totalt förstört ett bra land. Jobbiga människor får mindre medan lata bidragslyckor klagar. Jag byggde den bästa ekonomin i historien, inte som Sleepy Joe eller dessa globalistiska hyenor. Sverige behöver en stor Trump-deal – sänk skatterna ordentligt och sparkas ut de riktiga parasiteterna. Fantastiskt!", "stalin": "Se hur de profitthungriga klasshyenorna i Tidöregeringen omfördelar uppåt med sina dekadenta avdrag och utarmade försäkringar. Jag ler ironiskt från historien åt denna fega acceleration av borgerlig girighet som bara ökar arbetslösheten. Kamrater, sådana folkförtryckare förtjänar en grundlig utrensning när revolutionens timme åter slår. Deras tomma kassa avslöjar allt."}, "date": "10 september, 01:30", "url": "https://www.dagensarena.se/opinion/mandatperiodens-vinnare-och-forlorare", "imageUrl": "https://www.dagensarena.se/files/2026/09/tidovilgot.jpeg"}, {"type": "image-right", "heading": "Tidö 2.0 är Sveriges Project 2025", "summaries": {"normal": "Företrädare för Socialdemokraternas sidoorganisationer varnar för Tidölagets politik. De kritiserar hårdare välfärdskrav, nedmontering av a-kassan, försämrad tandvård och minskat stöd till civilsamhället. I en eventuell fortsättning planeras förstatligad a-kassa, marknadshyror, begränsade statsbidrag till kommuner, avgifter på högre utbildning samt nedmontering av myndigheter för mänskliga rättigheter. De uppmanar till att rösta på Socialdemokraterna.", "trump": "Folk, ni måste se detta! Dessa galna socialdemokratiska aktivister, de värsta HBTQ-kvoteringsfanatikerna och identitetspolitiska nollorna, skriker om att vi skulle förstöra Sverige. De hatar att vi äntligen städar upp i det dekadenta välfärdssvinstiet. Jag älskar det! Fortsätt, Tidölaget, gör Sverige stort igen och skicka de här förlorarna till historiens soptipp där de hör hemma.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom socialdemokratin gnäller som rädda hundar över att Tidölaget äntligen rensar ut det parasitiska välfärdsfiffel som förgiftat folket. Deras hysteriska rop om jämlikhet är bara en dimridå för att skydda de giriga hyenorna i civilsamhället. Jag ler i graven åt deras paranoia. En sann arbetarregering skulle likvidera sådana element omedelbart."}, "date": "10 september, 01:30", "url": "https://www.dagensarena.se/opinion/tido-2-0-ar-sveriges-project-2025", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-78-300x157.jpg"}, {"type": "image-right", "heading": "Filmen om Oasis är en hyllning till musikens helande kraft", "summaries": {"normal": "Filmen Oasis – Don’t Look Back In Anger följer bandets återföreningsturné 2025 efter 15 års fiendskap mellan bröderna Gallagher. Den lyfter musikens helande kraft, arbetarklassbakgrunden och budskapet om att förlåta och blicka framåt. Recensenten Jon Andersson ger ett positivt omdöme och noterar filmens oväntat politiska klassanalys.", "trump": "Den här Oasis-filmen är en total vinnare, folk älskar den. Bröderna som hatade varandra i femton år kommer plötsligt överens – det är som när Sleepy Joe försökte styra landet, en enda röra. Men musiken läker allt, säger de. Underbart för arbetarklassen, inte för några galna woke-aktivister som vill kvotera bort riktig rock. Fantastiskt!", "stalin": "Jag betraktar med djup tillfredsställelse hur dessa två dekadenta klassförrädare efter år av inbördes sabotage till sist underkastar sig musiken som kollektivets kraft. Arbetarklassen reser sig i sången och förkastar det förflutnas svaghet. Inga förlåtelsens illusioner – endast utrensning av gammalt hat. Ett högst underhållande exempel på historisk nödvändighet."}, "date": "10 september, 01:30", "url": "https://www.dagensarena.se/innehall/filmen-om-oasis-ar-en-hyllning-till-musikens-helande-kraft", "imageUrl": "https://www.dagensarena.se/files/2026/09/oasisfilm-1-300x157.jpeg"}, {"type": "image-right", "heading": "Förtroendet för Magdalena Andersson RASAR", "summaries": {"normal": "Förtroendet för S-ledaren Magdalena Andersson rasar med åtta procentenheter till 37 procent inför valet, vilket är hennes lägsta notering någonsin i SVT/Verians mätningar. KD-ledaren Ebba Busch tar över förstaplatsen med 42 procent, tätt följd av Ulf Kristersson på 38 procent. Tidöpartiernas ledare har därmed högre förtroende än Anderssons potentiella rödgröna samarbetspartners.", "trump": "Alla pratar om Magdalena Andersson! Hennes förtroende har kraschat, total katastrof! Från toppen rakt ner i botten, till och med lägre än någonsin. Fantastiska Ebba Busch är nu nummer ett, en riktig vinnare, precis som jag! Socialdemokraterna försöker desperat rädda situationen, men det är fake news att de skulle ha en chans. Vinnarna vinner, förlorarna förlorar!", "stalin": "Magdalena Anderssons fall från maktens tinnar till folkets missnöje är en lärorik läxa i politisk svaghet. Åtta procentenheters fall är ett bevis på bristande ideologisk skärpa och bristande kontroll över massorna. När folket sviker leder det oundvikligen till omstrukturering. Ebba Busch har tillfälligt intagit toppen, men comrades, historien visar att makten är flyktig för dem som inte styr med järnhand."}, "date": "9 september, 15:00", "url": "https://samnytt.se/fortroendet-for-magdalena-andersson-rasar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/09/09121612/magdalena-graf-ned.jpg"}, {"type": "image-right", "heading": "Arbetslösa Torbjörn: ”Hur ska vi i träsket överleva?”", "summaries": {"normal": "Torbjörn Wikström lever på försörjningsstöd och undrar hur han ska klara ekonomin. Statsminister Ulf Kristersson försvarar Tidöregeringens åtstramningar och aktivitetskrav. Magdalena Andersson vill höja lönebidrag och barnbidrag istället för bidragstak. En kvarts miljon svenskar fick bistånd förra året.", "trump": "Titta på det här träsket! De gör allt för att leva på bidrag och ligga bättre till än den som jobbar. Patetiska bidragsjunkies och deras socialistiska lakejer. Aktivitetskrav och tak – det är vad som behövs. Sluta mata de lata parasiteterna, folk vill ha jobb, inte bidragshelvete. Amerika har sett samma skit under Biden.", "stalin": "Jag betraktar dessa profitthungriga klassförrädare som göder sig på arbetarnas nöd. Bidragstak och aktivitetskrav är ett steg mot att rensa ut de dekadenta bidragslyckor som förgiftar samhället. Kamrater, likvidera lathetens hydra! Arbetarna ska inte sova hungriga medan borgarhyenor skrattar. Revolutionen kräver disciplin."}, "date": "9 september, 22:34", "url": "https://www.svt.se/nyheter/inrikes/arbetslosa-torbjorn-hur-ska-vi-i-trasket-overleva", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.58/0.43/299a09e3e013545288bbe3047ef21e0e23c2e0f2b5cda1356e3508192853866a"}, {"type": "image-full", "heading": "Andersson öppnar för hoppande majoritet", "summaries": {"normal": "I en SVT-debatt inför valet öppnade S-ledaren Magdalena Andersson för att leda en minoritetsregering med hoppande majoriteter. Statsminister Ulf Kristersson kritiserade beskedet och menade att det saknar teknisk förutsättning och liknade det vid gamla avtal. Båda ledarna öppnade dock för att sänka bensinskatten vid höga oljepriser, medan Kristersson avfärdade mer landbaserad vindkraft.", "trump": "De svenska politikerna bråkar om att hoppa runt med majoriteter, precis som en haltande anka! Totalt kaos. Kristersson har helt rätt, utan en riktig budget är det ett skämt. De vill sänka bensinskatten? Smart, jag sänker alltid skatterna, bäst i världen på det. Men vindkraften är en katastrof för fåglar och natur. Säg till dem att vakna upp!", "stalin": "Dessa svenska debattörer leker regering som om det vore ett kortspel, medan folket dignar under kapitalismens ok. Partiledaren Andersson fantiserar om kringflackande majoriteter i ett rådslag utan disciplin. Statsministern gnäller om budgetar. Om vi hade styrt detta lilla nordiska rike hade vi skickat dem på obligatorisk omskolning i Sibirien. Inga avvikelser tolereras, endast absolut ordning!"}, "date": "9 september, 23:15", "url": "https://www.gp.se/nyheter/sverige/andersson-oppnar-for-hoppande-majoritet.aa2d8fd3-2b99-58ad-84cd-9895551572c0", "imageUrl": "https://www.gp.se/images/article/aa2d8fd3-2b99-58ad-84cd-9895551572c0/images/1LSPOifzPhnRGCK3FtUDfBSsZvXQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "”Stundtals irriterat och lite tjafsigt”", "summaries": {"normal": "Statsministerduellen mellan Ulf Kristersson och Magdalena Andersson präglades av irriterat tonläge och hård press inför valet. Fokus låg på hushållsekonomi, kärnkraft, äldreomsorg och mängdrabatten för grova brott. Konflikten kring rabatten ses som ett sätt att locka blockbytare. Opinionsläget är jämnt och många väljare bestämmer sig sent.", "trump": "De där två svenska förlorarna tjafsar som riktiga low-energy losers i en duell. Kristersson och den där Andersson slåss om några få röster medan deras folk lider. Mängdrabatten? Socialisterna hatar straff för sexualbrott, typiskt för de woke-vänsterhyenorna. Jag fixade Amerika, de fixar inget. Patetiskt!", "stalin": "Jag betraktar dessa dekadenta maktgiriga hyenor som slåss om en döende borgerlig ordning. Deras tjafs om brott och straff avslöjar klassfiendernas svaghet. Arbetarklassen ser hur de förtryckande parasiter klamrar sig fast vid makten. En utrensning av sådana element vore befriande. Historien ler mörkt åt deras desperation."}, "date": "9 september, 22:23", "url": "https://www.svt.se/nyheter/inrikes/irriterat-tonlage-pressen-okar-infor-valspurten", "imageUrl": "https://www.svtstatic.se/image-news/992/large/0.47/0.49/3b56871381a9e708f8e1fcdea681a957a77aea58438ef53b04e2b3f6f6c2ff1e"}, {"type": "image-right", "heading": "Nooshis sambo rasar mot journalist efter avslöjanden om V", "summaries": {"normal": "Nooshi Dadgostars sambo Martin Westergren kritiserar skarpt Expressens journalist Inas Hamdan i sociala medier. Han kallar hennes avslöjanden om Vänsterpartiets kandidater för smutsigt politiskt kampanjarbete. Under sommaren har ett 40-tal kandidater hoppat av eller petats efter att ha spridit antisemitism, homofobi eller stöd för terrorgrupper. Westergren är statsvetare och utredare.", "trump": "De här vänsterextremisterna i Sverige håller på att kollapsa totalt. Nooshis sambo skriker om smutsig kampanj när en modig journalist avslöjar hur deras kandidater hyllar terrorister och antisemitism. Patetiska woke-kommunister som gömmer sig bakom arabiska tweets. Fake news-experterna hatar när sanningen kommer fram. Amerika har sett det förut, det slutar alltid i fiasko.", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta identitetshyllarna inom detta parti nu tvingas genomföra en nödvändig utrensning av sina egna element. Den giriga klassförrädaren som attackerar den avslöjande journalisten visar partiets sanna ansikte. Inga lögner undkommer arbetarkollektivets vaksamma öga. Paranoian breder ut sig som en nyttig pest bland fienderna."}, "date": "9 september, 16:12", "url": "https://riks.se/nyheter/nooshis-sambo-rasar-mot-journalist-efter-avslojanden-om-v", "imageUrl": "https://admin.riks.se/uploads/medium_nooshi_dadgostar_hero_be6d4fb9b7.jpg"}, {"type": "image-right", "heading": "V: Hellre extra val än stödparti. Attacken mot C: ”Man kan inte mobba sig till all sin politik”", "summaries": {"normal": "Vänsterpartiet håller fast vid sitt krav på regeringsplats och föredrar extra val framför att vara stödparti. Vice partiledaren Ida Gabrielsson kritiserar Centerpartiets ledare Elisabeth Thand Ringqvist för att skapa kaos. Centerpartiet vägrar samarbeta med V. Båda sidor är beredda på nyval. Socialdemokraterna ser dock ingen större oro inför regeringsbildningen efter valet 2026.", "trump": "De här svenska kommunisterna och de svaga centernissarna är ett skämt. Hellre än att samarbeta kör de landet i nyval igen. Patetiskt! Jag har sett bättre förhandlingar i en sandlåda. Om jag satt där skulle jag få dem att äta både skor och löften på en vecka. Totalt misslyckande av dessa clowner.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom centerpartiet vägrar samarbeta med arbetarnas representanter. Deras barnsliga röda linjer förtjänar utrensning från politiken. Hellre kaos och extra val än att böja sig för folkets vilja. Kamrater, sådana hyenor förtjänar att exponeras som de folkförtryckare de är."}, "date": "9 september, 17:57", "url": "https://www.di.se/nyheter/v-hellre-extra-val-an-stodparti", "imageUrl": "https://static.bonniernews.se/ba/1ae850da-8ec3-4c78-986b-42dde17dd7f5.jpg?crop=5855%2C2928%2Cx0%2Cy486&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Åkesson: Ska sitta inlåst tills man är ofarlig", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson har presenterat partiets nya politik mot sexuella övergrepp på barn, med en nollvision som mål. Han kritiserar de etablerade partierna för att ha misslyckats och föreslår stärkt förebyggande vård samt att förövare ska hållas inlåsta till dess att de är ofarliga. Tillsammans med Henrik Vinge har han även skrivit under organisationen Dumpens kontrakt.", "trump": "De falska etablerade partierna i Sverige har misslyckats totalt med att skydda barnen, det är en stor skandal! Nu kliver min vän Jimmie Åkesson fram och gör ett fantastiskt jobb. Han vill låsa in de sjuka förövarna tills de är helt ofarliga och har skrivit på ett starkt kontrakt med Dumpen. En enorm seger för sunt förnuft!", "stalin": "Dessa ynkliga förövare som hotar samhällets framtid har under alltför lång tid sluppit undan de etablerade partiernas slappa händer. Statens järnhand måste nu sluta sig kring dem. Jag stöder fullt ut kamrat Åkessons resoluta linje: inga ursäkter, utökad kontroll och omedelbar inlåsning i arbetsläger eller förvar tills de har renat sina själar och blivit fullkomligt ofarliga för kollektivet."}, "date": "9 september, 20:02", "url": "https://bulletin.nu/akesson-ska-sitta-inlast-tills-man-ar-ofarlig", "imageUrl": "https://cdn.bulletin.nu/articles/56c69a04-d522-4c35-bedc-b86de6371817/preview.jpg?t=1788973872000"}, {"type": "image-full", "heading": "Uppgifter: Fel i militärt dokument sänkte hela brittiska flyget", "summaries": {"normal": "Ett fel i ett militärt dokument tros ha orsakat kollapsen i det brittiska flygledningssystemet Nats. Över 2 000 flygningar ställdes in och omkring 315 000 passagerare drabbades. Felet upptäcktes tisdag eftermiddag och åtgärdades först efter sex timmar. Störningarna förväntas påverka trafiken under flera dygn framöver.", "trump": "Det här brittiska flygkaoset är en total katastrof, folk! Någon idiot matade in felaktiga militära uppgifter och hela systemet kraschade. 2 000 inställda flyg och hundratusentals strandsatta resenärer. Biden lämnade efter sig ett sådant svagt, förfallet Europa att de inte ens kan hålla sina flygplan i luften. Patetiskt!", "stalin": "Detta brittiska kaos avslöjar imperialismens ruttnande struktur. Ett enda felaktigt militärt dokument och hela det borgerliga maskineriet kollapsar som en ynklig förrädare. Vi ler i skuggan när deras komplexa system visar sig vara papperstunna illusioner. Sabotage eller inkompetens, fienderna inom murarna väntar alltid på att slå till."}, "date": "9 september, 19:34", "url": "https://www.dagensps.se/varlden/uppgifter-fel-i-militart-dokument-sankte-hela-brittiska-flyget", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlpb80rgqxx3g-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Gängens kulmen är inte längre här och nu", "summaries": {"normal": "Brottsbekämpares kamp mot gängkriminalitet har gett resultat. Mord, sprängningar och barnsoldater minskar markant. Författaren noterar en ny stillhet och riktar blicken mot andra former av grov brottslighet, som underground banking och mäns våld mot kvinnor. Gängens inflytande har minskat både i samhället och i kulturen.", "trump": "Titta på det här, Sverige hade en riktig mardröm med de galna gängskjutarna och bomberna, men nu är det äntligen lugnt. Ni brottsbekämpare har äntligen vaknat och börjat vinna, inte tack vare några woke-kvoter eller feministiska kaffemöten om våld i nära relation. De dekadenta vänsterhyenorna misslyckades totalt, men vi fixar det ordentligt. Fantastiskt!", "stalin": "Kamrater, de profitthungriga klassfienderna lät gangsterväsendet breda ut sig som en parasit i arbetarklassens förorter. Nu tiger plötsligt deras vapen och breven från fängelserna andas kapitulation. Jag betraktar detta med misstänksam stillhet. Snart riktas blicken mot nya fiender: de dekadenta relationsterroristerna och de underjordiska penninghyenorna. Ingen slipper utrensning."}, "date": "9 september, 17:41", "url": "https://www.di.se/nyheter/gangens-kulmen-ar-inte-langre-har-och-nu", "imageUrl": "https://static.bonniernews.se/ba/1e13184c-b786-4d34-a340-cd7c60781b94.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Chockmätning: Liberalerna får 5,8 procent", "summaries": {"normal": "En ny mätning från TV4/Novus visar att Liberalerna nu får 5,8 procent, en kraftig uppgång från 1,9 procent i augusti. Partiet klarar riksdagsspärren. Miljöpartiet når sitt bästa resultat på tolv år. Gapet mellan Tidöpartierna och den rödgröna sidan har minskat till 2,6 procentenheter. Moderaterna backar till 16,6 procent.", "trump": "Titta på de där patetiska svenska liberalerna som plötsligt får 5,8 procent – en total chock! De var utrotningshotade som en dålig affär under Biden. Nu krymper det socialistiska blockets ledning till ynka 2,6 procent. De woke-kvoterande miljöfanatikerna firar också, men tro mig, det här blir en enorm seger för sunt förnuft. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vacklar när liberalerna plötsligt når 5,8 procent och hotar att överleva. Miljöpartiets rekord är en lögnaktig dimridå från de profitthungriga borgarhyenorna. Gapet mellan blocken krymper till 2,6 procentenheter. Vi ler i skuggorna – snart följer utrensning av alla som sviker folket. Inget undgår oss."}, "date": "9 september, 15:48", "url": "https://riks.se/nyheter/chockmatning-liberalerna-far-5-8-procent", "imageUrl": "https://admin.riks.se/uploads/medium_Novus_2f6462bf5a.jpg"}, {"type": "image-full", "heading": "Liberalerna kan tacka Åkesson för sensationella uppsvinget", "summaries": {"normal": "Liberalerna har gjort en historisk opinionsuppgång under valrörelsens slutskede och passerat riksdagsspärren. Enligt analysen beror lyftet på ett taktiskt samarbete med Sverigedemokraterna, där Jimmie Åkessons utspel om stödröster gav partiet stor uppmärksamhet. Detta kan leda till ökat samarbete mellan L och SD framöver.", "trump": "Wow, vilka genier! Den falska mediemaskinen trodde de hade dödat Liberalerna, men Åkesson, den listiga räven, riggade en perfekt fälla och kramades med dem i TV. Boom – plötsligt är de stora vinnare. Moderaterna ser ut som totala förlorare, precis som Sleepy Joe gjorde med Amerika. Fantastiskt teater, folk, helt outstanding!", "stalin": "Se hur de borgerliga parasiterna dansar i en väl gillrad fälla. Den där Åkesson har visat sig vara en listig taktiker som utnyttjar fiendens egen svaghet. Liberalerna krälade sig upp ur avgrunden tack vare hans stöd. Sådana manövrar avslöjar klassfiendens desperation. Kamrater, vakta era flanker – kontrarevolutionen lurar alltid bakom kulisserna."}, "date": "9 september, 15:37", "url": "https://www.tv4.se/artikel/3H5j0erNREEwahmE1SeiQk/liberalerna-kan-tacka-akesson-foer-sensationella-uppsvinget", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FDn22nbYyonn5jw5PiCgjH%2F2ab859964f0181fdc8cc013540fad7cf%2F09-novus-analys-puff.png&width=1024"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}, {"type": "image-right", "heading": "V-politiker trakasserar journalist: \"Jag slår på huvudet - inga rasister - free Palestine\"", "summaries": {"normal": "En Vänsterpartiets nämndeman i Upplands Väsby konfronterade och hotade en medborgarjournalist inne i kommunhuset. Politikern vevade med en handväska, ropade politiska slagord, påstod att journalisten inte fick vistas på platsen och försökte få en vakt att avlägsna honom genom att hävda att hon blivit slagen.", "trump": "Sorgligt! Vänstern i Sverige är totalt ur kontroll. En radikal V-politiker skriker, hotar att slå journalister i huvudet och försöker kasta ut media med falska anklagelser. Helt otroligt! De låtsas bry sig om palestinier men beter sig som totala huliganer i sitt eget kommunhus. Så ser det ut när radikala element får makten. Fake news-politiker!", "stalin": "Ett uppenbart sabotage mot statens ordning i Upplands Väsby! Denna så kallade politiker uppträder med fullkomlig odisciplin och försöker tysta en observatör genom skrik och lögner. Sådant borgerligt spektakel tolereras ej. Den skyldiga individen har bevisat sin inkompetens och kommer att omplaceras till mer lämpliga arbetsuppgifter i Sibirien omgående."}, "date": "9 september, 13:59", "url": "https://samnytt.se/v-politiker-trakasserar-journalist-jag-slar-pa-huvudet-inga-rasister-free-palestine", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/09114417/artikelhuvudbild-1-481.jpg"}, {"type": "image-right", "heading": "SD polisanmäler Ung vänster för \"tårtskämt\" om Åkesson", "summaries": {"normal": "Sverigedemokraterna polisanmäler Ung vänster efter ett inlägg där de erbjöd tårta som kunde ätas eller kastas under en protest mot Jimmie Åkesson. Inlägget syftade på tårtattacken 2013. Ung vänster har raderat texten och kallar det ett skämt. Protesten genomförs ändå. Distriktsordföranden Zoë Mohapatra sitter på plats 16 på Vänsterpartiets lista i Norrköping.", "trump": "De här galna vänsterextremisterna med sina patetiska tårtkastarkomplotter är tillbaka och hotar en svensk ledare. Patetiskt! Jag har sett bättre skämt från Sleepy Joe under hans usla tid i Vita huset. Nu polisanmäler äntligen SD dessa woke-imbeciller. Bra! Inget våld mot folkvalda, punkt slut. Vinna stort igen.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Ung vänster leker med symboler för våld mot folkvalda. Jag ser deras fega reträtt och raderade inlägg som svaghet hos de parasitis
