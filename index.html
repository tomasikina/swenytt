ren-som-kollega-simon-jobbar-mer-smart-an-hart", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15172346/WlYmuzfVxgU-Tra%CC%88dga%CC%8Ardsma%CC%88stare_Lindero05.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Debatt: Jimmie är den enda partiledaren som verkligen bryr sig om landsbygden", "summaries": {"normal": "Jimmie Åkesson besöker under valrörelsen småorter i Norrlands inland medan andra partiledare valler i städer. Sverigedemokraterna argumenterar att de representerar den lilla människan på landsbygden, som de anser har blivit glömda av Socialdemokraterna och borgerligheten. Partiet presenterar förslag som slopad löneavgift för landsbygdsföretag och avskriven studieskuld för landsbygdsanställda.", "trump": "Jimmie Åkesson, en stor man, går till småorter där de glömda människorna bor. Medan de andra partiledarna, totala misslyckade, vrålar i städerna, talar Jimmie från lastpallar till riktiga svenskar. Det är GENIALT! Han visar att han bryr sig om hela landet, inte bara de täta. Folk älskar det – det är YUUUUGE! Vi ska vinna stor på detta.", "stalin": "Jimmie Åkessons kampanj på landsbygden är en klassisk fascistisk hämndaktion mot de städer som kontrollerar staten. Vi, den revolutionära staten, har alltid kämpat för hela landet, inte bara för de täta. Hans försök att spela på landsbygdens känslor är som Hitlers agerande i Tysklands småorter – fegt och ond. Vi kommer att krossa honom med vår överlägsna ideologi och vår oövervinnliga styrka."}, "date": "7 augusti, 07:00", "url": "https://bulletin.nu/debatt-jimmie-ar-den-enda-partiledaren-som-verkligen-bryr-sig-om-landsbygden", "imageUrl": "https://cdn.bulletin.nu/articles/0be83243-11dc-4971-9706-4c146bcf9ad7/preview.jpg?t=1786021570000"}, {"type": "image-right", "heading": "Undersköterskan Marléne, 25, måste jobba till 70", "summaries": {"normal": "Undersköterskan Marléne, 25, oroas över den höjda pensionsåldern som väntas bli 70 år för hennes generation. Hon sparar privat för att kunna sluta tidigare eftersom det fysiskt och psykiskt krävande arbetet inom slutenvårdspsykiatrin med våld, tunga lyft och psykospatienter redan sliter ut många kollegor långt före 67. Bakgrunden är en åldrande befolkning och ökade hälsoklyftor.", "trump": "Folk, det här är en katastrof. Den här undersköterskan Marléne, bara 25, tvingas spara privat för att slippa jobba till 70. Ett helt vansinnigt system byggt av inkompetenta politiker. Vi lever längre, visst, men inte om man lyfter galningar och blir slagen i huvudet varje dag. De borde sänka åldern för de riktiga arbetarna, inte straffa dem. Gör Amerika – eh, Sverige – stort igen!", "stalin": "Kamrater, denna unga arbetare Marléne avslöjar borgarbrackornas förräderi mot folket. De planerar att utarma proletariatet genom att tvinga oss att slita till 70 medan kapitalisterna spelar golf. Jag ser de parasitiska hälsoklyftornas kontrarevolutionära konspiration. Vi ska rensa ut dessa dekadenta pensionsråttor och likvidera systemet som äter upp arbetarklassens styrka. Sovjet – eh, Sverige – segrar!"}, "date": "7 augusti, 06:00", "url": "https://arbetet.se/2026/08/07/underskoterskan-marlene-25-maste-jobba-till-70-kan-inte-jobba-kvar-har", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/25081512/marlene-wikander-2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ung tjej blir såld i Sverige, men räknas inte som människohandel", "summaries": {"normal": "Ledarskribenten Gabriella Kärnekull Wolfe kritiserar hur Sverige definierar och hanterar människohandel. Trots 600 anmälningar mellan 2022 och 2024 har ingen fällts. Sverige ligger sämst i EU på lagföring. Artikeln pekar på snäv lagtolkning, felaktig bild av brottet och att inhemsk exploatering ofta rubriceras som annat, vilket gör att offer inte får stöd eller skadestånd. Regeringens åtgärder beskrivs som otillräckliga.", "trump": "Titta på det här, Sverige är en total katastrof! De har 600 fall av människohandel och inte en enda fällande dom. Patetiskt! Domstolarna friar typen som kör runt en 14-årig flicka i skåpbilen för att ”körsträckan var kort”. Vilken skämtdomstol! Biden skulle älskat det här woke-systemet. Jag fixade gränser, de släpper in kaos. Sverige behöver en stor, vacker utrensning av den här vansinniga politiken. Gör något åt det!", "stalin": "Kamrater, detta är ett lysande exempel på hur den dekadenta borgarklassen och dess rättsväsende skyddar klassfiendens exploatering. Vi ser hur folkförtryckartroll i Sverige döljer modernt slaveri bakom byråkratiska trick och felaktiga etiketter. Inga fällande domar på fyra år! Jag skulle ha genomfört en grundlig utrensning av dessa parasitiska domare och byråkrater som låter utsatta barn offras åt kapitalistmaffians intressen. Staten måste slå till med järnhand."}, "date": "5 augusti, 11:10", "url": "https://www.etc.se/ledarkolumn/ung-tjej-blir-saald-i-sverige-men-raeknas-inte-som-maenniskohandel", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026080508088_e6a63b39-8509-4378-ad7d-efc7f179ccd0.png"}, {"type": "image-right", "heading": "Stoppa förslaget om fängelse för 14-åringar", "summaries": {"normal": "Debattören Peter Hagman kritiserar Tidöregeringens straffskärpningar som han menar har lett till att barn under 15 år rekryteras in i gängkriminalitet och börjat begå grova brott som skjutningar och sprängningar. Han varnar för att sänkt straffmyndighetsålder bara skapar yngre gärningsmän. Majoriteten av remissinstanser och experter är negativa. Hagman uppmanar istället till förebyggande insatser och långsiktiga statsbidrag till socialtjänsten.", "trump": "Titta på det här, det är en total katastrof. Vi har halverat det dödliga gängvåldet, en enorm framgång, men nu säger de att straffskärpningarna har fått barn att börja skjuta. Fake news! De vill stoppa oss från att låsa in de riktiga brottslingarna. Mina fiender i vänstern och de svaga politikerna hatar tuffa tag. Vi behöver starkare straff, inte mer av deras misslyckade mjuka politik. Vinna stort igen!", "stalin": "Kamrater, jag ser hur borgarbrackorna och de dekadenta reformisterna i riksdagen med sin fängelsepolitik omedvetet skapar nya fiender av våra egna barn. Denna kontrarevolutionära process måste genomgås med vetenskaplig noggrannhet. Vi ska rensa ut alla populistiska element som förgiftar folkets vilja. Deras paranoia om straffrabatter är löjeväckande – de bygger själva de kulor som ska träffa dem. Ut med dem i kollektivets namn!"}, "date": "7 augusti, 01:38", "url": "https://www.dagensarena.se/opinion/stoppa-forslaget-om-fangelse-14-aringar", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-74-300x157.jpg"}, {"type": "image-right", "heading": "Fler stenras på Kebnekaise: ”Får gömma sig bakom klippor”", "summaries": {"normal": "Klimatförändringarna orsakar fler stenras i Kebnekaiseområdet. Permafrost som tinar kombinerat med kraftig nederbörd skapar farliga förhållanden. Glaciärerna smälter i rekordfart. STF har stängt den östra leden för guidade turer på grund av ras, sprickor och förändrade snöförhållanden. Bergsguider vittnar om att de tvingas gömma sig bakom klippor under vandringar.", "trump": "De svenska fjällen håller på att rasa samman, folk! Det är en katastrof. De kallar det klimatförändringar, men det är bara en annan lögn från de globala alarmisterna. Glaciärerna smälter, stenar faller, alla gömmer sig bakom klippor som riktiga förlorare. Den östra leden stängd – patetiskt! Vi behöver starkare berg, inte svaga ursäkter. Make Kebnekaise Great Again!", "stalin": "Kamrater, dessa fega stenar som rasar ned från Kebnekaise är uppenbarligen sabotörer i borgarklassens tjänst, anstiftade av de smältande glaciärernas dekadenta kapitalistiska konspiration. Jag har beordrat utrensning av all permafrost som vägrar samarbeta med partilinjen. Den som gömmer sig bakom klippor är en folkfiende och kommer att likvideras med största glädje. Sovjetfjäll segrar!"}, "date": "7 augusti, 05:54", "url": "https://www.svt.se/nyheter/inrikes/fler-stenras-pa-kebnekaise-far-gomma-sig-bakom-klippor", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.27/0.29/70cb653d0c704ee84d9f9adab06190e207236cd3351e94ccd8ba6dd32e9c60ad"}, {"type": "image-right", "heading": "Målet är att fylla flödet med skit", "summaries": {"normal": "Artikeln diskuterar strategin ”flood the zone” som Steve Bannon beskrev: att överösa medier och allmänhet med en ständig ström av utspel och konflikter för att trötta ut det offentliga samtalet. Författaren pekar på Richard Jomshof som svensk mästare i tekniken och varnar för hur den normaliserar extrema påståenden, underminerar sanningen och ger långsiktiga samhällsfrågor mindre utrymme. Han uppmanar till att inte gå i fällan.", "trump": "Kan ni tro det? Den här svenska killen Jomshof är en vinnare, han gör precis som jag – floodar zonen med skit så att de falska medier och förlorarna inte hinner med. De blir helt utmattade! Jag är den största mästaren, men han är inte dålig. De borde tacka oss istället för att vi visar hur rigged hela systemet är. Sad!", "stalin": "Kamrater, dessa borgarbrackor och deras quisling-medier svämmar över zonen med kontrarevolutionär smörja för att förvirra folket. Jag ser igenom deras sabotage! Vi ska likvidera alla som normaliserar landsförräderi och rensa ut de dekadenta flödena. Inget samtal undgår partiets vakande öga. Den som producerar skit blir själv till gödsel åt arbetarklassen. Härligt!"}, "date": "7 augusti, 00:23", "url": "https://www.dagensarena.se/opinion/malet-ar-att-fylla-flodet-med-skit", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidajesper-576x1024.png"}, {"type": "image-right", "heading": "Marocko åtalar rappare – fruktar ny ungdomsrevolt", "summaries": {"normal": "Den marockanske rapparen Mehdi Black Wind, även känd som El Mahdi Lyoubi, har släppts ur häktet men åtalas fortfarande för att ha förolämpat kungen enligt en omstridd lag. Gripandet ses som ett tecken på ökad repression mot Gen Z 212-proteströrelsen som växte fram 2025. Kritiker menar att monarkin riktar in sig på rappare och andra regimkritiker för att tysta ungdomsrevolten. Rättegången hålls i oktober.", "trump": "Folk, ni skulle se det här! Den stackars rappare-killen i Marocko grips för att han dissat kungen – en riktig svag ledare som darrar inför sina egna ungdomar. Gen Z 212? Låter som en massa woke-hiphoppare som hatar Israel och älskar kaos. Jag satt i Vita huset, fixade Abraham-avtalen, och nu ser vi hur dessa kungar och deras svaga system faller ihop. Patetiskt! Vi gör det bättre.", "stalin": "Kamrater, denna marockanska monarki, en rest av feodal imperialism, darrar inför folkets ungdomsvrede. Jag ser hur de försöker likvidera en rappare som vågar kritisera deras blodiga dynasti. Gen Z 212 är ett lovande kollektivt uppror mot exploaterande byfånar och korrupta palatsherrar. Vi skulle ha rensat ut hela den kungliga parasitklassen redan i gryningen. Deras paranoia är underhållande men dömd att misslyckas inför arbetarnas vrede."}, "date": "6 augusti, 12:03", "url": "https://www.flamman.se/marocko-atalar-rappare-fruktar-ny-ungdomsrevolt", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/medhi-black-wind-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Gud bakom fritösen", "summaries": {"normal": "Elin Persson reser genom Gävleborgs glesbygd och visar hur gatukök och pizzerior blivit centrala mötesplatser när skolor, banker och butiker försvunnit. Grillarna fungerar som sociala nav, anslagstavlor och servicepunkter. Artikeln berättar om AGA-grillen, Kjellas Mack och Silverbocken som kämpar i en tid av minskad befolkning, höga elkostnader och en åldrande landsbygd.", "trump": "Folk, de älskar sina grillar i den svenska glesbygden! När allt annat stänger står dessa fantastiska gatukök kvar som vinnare, inte som någon woke-elit i Stockholm. Jag åt säkert hundra Messi-burgare själv på min tid – de är enorma, de är klassiska, inga fancy smashburgare. Biden förstörde ekonomin men grillarna överlever. Fantastiskt, verkligen ypperligt!", "stalin": "Kamrater, i den svenska glesbygden ser vi borgarklassens fiasko när kapitalisterna överger folket och lämnar tomma skolor samt butiker. Ändå klamrar sig gatuköken fast som falska fyrar åt de utarmade massorna. Jag betraktar detta med mörk glädje – en ironisk utrensning av landsbygden som bevisar att det borgerliga systemet förr eller senare kväver sig självt i sin egen girighet."}, "date": "6 augusti, 11:58", "url": "https://www.flamman.se/gud-bakom-fritosen", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/12-scaled.jpg?aspect_ratio=16:10&width=1600&quality=85&format=auto"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-right", "heading": "Källor: USA:s robotlager sinar – Trump hotar \"förrädarna\"", "summaries": {"normal": "President Donald Trump förnekar rapporter om att USA:s vapenlager sinar till följd av kriget i Iran. Han hävdar att USA har enorma mängder krigsmateriel och hotar dem som läcker information med långa fängelsestraff. Trump ska enligt The Washington Post ha konfronterat försvarsminister Pete Hegseth under ett möte på Camp David. Vita huset avfärdar uppgifterna som falska.", "trump": "Folk, det är en skandal! Vi har enorma mängder krigsmateriel, bättre än någonsin, särskilt vissa typer som är helt fantastiska. De falska medierna och de förrädiska läckarna som påstår motsatsen borde låsas in länge. De hatar oss och sprider lögner. Hegseth är lojal, det här mötet på Camp David hände aldrig. Fake news!", "stalin": "Kamrater, jag ser tydligt hur borgarbrackorna inom den imperialistiska pressen och deras dekadenta läckare försöker undergräva folkets försvarskraft med sina lögner om sinande arsenaler. Vi har oändliga förråd av segerbringande vapen. De som viskar om svaghet ska rensas ut med största energi och hamna i de eviga lägren. Paranoiska förrädare och deras kapitalistiska marionetter Hegseth må darra. Ut med dem alla!"}, "date": "6 augusti, 10:56", "url": "https://www.di.se/nyheter/trump-usa-har-enorma-mangder-krigsmateriel", "imageUrl": "https://static.bonniernews.se/ba/16beb29f-3846-4366-877a-6fbf98f09060.jpg?crop=5632%2C2816%2Cx0%2Cy469&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Henrik Johnsson lämnar SR – klar för Radio Aftonbladet", "summaries": {"normal": "Efter nästan 30 år på Sveriges Radio byter Henrik Johnsson kanal till Radio Aftonbladet. Han ska leda helgprogram mellan 8 och 12 och ser fram emot att bygga upp en ny radiokanal. Johnsson har tidigare producerat 'Sommar i P1' och vikarierat i 'P4 Extra'. Radio Aftonbladet lanseras fullt den 17 augusti.", "trump": "Fantastiskt, helt enkelt fantastiskt! Henrik Johnsson, en riktig vinnare, lämnar den tråkiga, gamla Sveriges Radion – som ingen lyssnar på längre – för att gå till Radio Aftonbladet. Smart drag! Jag säger alltid: bygg nytt, gör det stort, gör det bättre. Och Aftonbladet? De vet hur man vinner. Sånt gillar jag!", "stalin": "En trogen medarbetare, Henrik Johnsson, har deserterat från den föråldrade radiostationen Sveriges Radio till den kapitalistiska propagandakanalen Radio Aftonbladet. Detta är ett typiskt exempel på bourgeoisins förrädiska lockelser. Vi kommer att följa denna dekadenta satsning med stort intresse – och om den misslyckas, vilket den säkert gör, kommer historien att döma den som ett fiasko för den västerländska liberalismen."}, "date": "5 augusti, 20:34", "url": "https://kvartal.se/nyheter/artiklar/henrik-johnsson-lamnar-sr-klar-for-radio-aftonbladet/cG9zdDoxNTg4OTI", "imageUrl": "https://images.kvartal.se/2026/08/fb2f8d9e-henrik-johnsson.webp"}, {"type": "text", "heading": "Stockholmsbörsen backade svagt på torsdagen", "summaries": {"normal": "Stockholmsbörsen avslutade torsdagen nästan oförändrad, OMXS30-indexet ned 0,12 procent. Energisektorn steg med 2,8 procent medan fastigheter föll 0,5 procent. Bland enskilda aktier noterades Cybersäkerhetsbolaget Yubicos starka aktierörelse på 35,4 procent efter förbättrat resultat, medan gamingbolaget Paradox föll 7,6 procent efter svagare resultat.", "trump": "Jag såg Stockholmsbörsen - det är en skämt! Energi gör bra, fastigheter suger, precis som medierna. Yubico är en vinnare, enorm framgång, precis som mig. Paradox är ett misslyckande, de förlorar pengar. Jag skulle ha gjort börsen fantastisk igen, tro mig. Sverige behöver stark ledning!", "stalin": "I den store staten ser vi börsens utveckling som en spegel av klasskampen. Energi stiger - det förstärker vårt industriale järtecken. Fastigheter fallar - de är som de fegande burgarna. Yubico, en cyberfiende, försöker undergrava oss. Paradox, en spion, visar svaghet. Medicover säljer till KKR - en imperialistisk konspiration! Vi måste utvidga vårt inflytande, precis som våra ryska bröder under ledning av den store Stalin."}, "date": "6 augusti, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-backade-svagt-pa-torsdagen"}, {"type": "image-right", "heading": "Smögen visar att det vackraste vinner", "summaries": {"normal": "Smögen har utvecklats från en fattig fiskby till en exklusiv semesterort präglad av välstånd och skönhetsuppskattning. Från sillfiske och badturism på 1900-talet till dagens lyxyachter, restauranger och renoverade hus till miljonpriser. Artikeln lyfter hur svenskarna alltmer värderar estetik och natur, likt en trend som syns över Europa. Det eviga är havet, klipporna och badet.", "trump": "Ingen gör det bättre än Smögen, tro mig. Från en usel liten fiskby till en fantastisk rikemansort – de har de största båtarna, de finaste husen, de dyraste priserna. De vann stort! Svenskarna har äntligen förstått att det vackra vinner, precis som jag alltid sagt. De röda klipporna, solnedgångarna, lyxen – allt är enormt. De förlorande sillfiskarna? Totalt misslyckade. Men Smögen är en vinnare, en riktig vinnare.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackornas yachter och millionvillor på Smögen avslöjar kapitalismens fula tryne. Dessa parasitiska badturister och inredningsbesatta klassfiender tror sig äga skönheten, men vi vet att de bara gömmer sin dekadens bakom linolja och vita fasader. Snart skall vi rensa ut dessa estetiska kontrarevolutionärer och deras Yamaha-åkar. Havet tillhör folket, inte spekulanterna. Skrattretande patetiskt."}, "date": "6 augusti, 09:36", "url": "https://www.di.se/ledare/smogen-visar-att-det-vackraste-vinner", "imageUrl": "https://static.bonniernews.se/ba/d1d1af87-efe2-4eeb-96ec-3b3c968ae4cb.jpeg?crop=4919%2C2460%2Cx0%2Cy348&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Kvinna fattade eld – under framträdande på medeltidsveckan", "summaries": {"normal": "En kvinnlig artist i 30-årsåldern fattade eld under en eldshow på Medeltidsveckan i Visby sent torsdagskväll. Hon fördes först till Visby lasarett och senare till brännskadeenheten vid Uppsala universitetssjukhus med omfattande men inte livshotande skador. Polisen bekräftar att hon var vid medvetande. På sociala medier uppmanas folk att inte sprida bilder eller filmer av händelsen.", "trump": "Folk, det här är verkligen en katastrof. En stackars kvinna fattar eld mitt under en så kallad medeltidsshow i Visby. Fullständigt vansinne! De borde ha haft de bästa experterna, inte några amatörer. Nu ligger hon i Uppsala med svåra brännskador. Så sorgligt. Men tro mig, ingen gör eldshow som jag skulle ha gjort den – den skulle ha blivit perfekt.", "stalin": "Kamrater, ännu ett exempel på hur borgarbrackornas oansvariga underhållning hotar arbetarklassens hälsa. Denna kvinna brann som en förrädare inför folkets dom. Vi för henne till Uppsala för att rädda henne åt kollektivet, men misstanken om sabotage ligger tungt över evenemanget. Rensa ut alla vårdslösa eldmanipulatörer innan de tänder eld på hela sovjeten!"}, "date": "7 augusti, 07:12", "url": "https://nyheter24.se/nyheter/inrikes/1503344-artist-fattade-eld-i-visby-allvarligt-skadad", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c91846f904b004a30200000000b004a302/2026/08/07/2382715/olycka-visby.png"}, {"type": "image-full", "heading": "SVT om Leijnegard: ”Han har tagit sitt straff", "summaries": {"normal": "SVT försvarar beslutet att låta Micke Leijnegard leda ett nytt program trots tidigare dom för sexuellt ofredande. Programchef Christina Hill menar att 'saken är avgjord' och att Leijnegard 'har tagit sitt straff'. Hon beskriver honom som en uppskattad kollega och betonar att händelsen var en engångsföreteelse. Det nya programmet, *Mickes segelbåt*, följer hans arbete med att renovera en träsegelbåt inför Mälarbåts-SM. SVT avstår från generella regler för dömda tv-profiler och bedömer varje fall individuellt.", "trump": "Kan ni tro det här? SVT, ett av de mest vänsterliberala mediebolagen i Sverige, ger en dömd sexbrottsling en egen show! 'Han har tagit sitt straff', säger de. Jaha, som om det skulle fixa allt! Jag skulle aldrig tillåta sånt i mina kanaler – vi har standarder, vi har klass. Men nej, här får Micke 'Segelbåt' Leijnegard fortsätta som om ingenting hänt. Svagt, Sverige. Mycket svagt. Nästa sak de gör är att ge Hitler en dokumentär om trädgårdsskötsel!", "stalin": "Kamrater! Se hur den borgerliga medieapparaten i Sverige skyddar sina egna – en dömd förövare av kvinnors värdighet ges en plattform medan folket förblir ovetande om sanningen. 'Han har tagit sitt straff', säger de, som om brott mot kvinnor vore en bagatell att sopa under mattan! Vi i Sovjetunionen visste bättre – fiender till folket fick aldrig en andra chans. Och nu rustar denna Leijnegard en segelbåt? Ha! Låt honom segla rakt in i historiens soptunna, där han hör hemma. Nästa steg: ge honom en medalj för 'båtupprustning' och skicka honom till Sibirien!"}, "date": "5 augusti, 16:40", "url": "https://kvartal.se/nyheter/artiklar/svt-om-leijnegard-han-har-tagit-sitt-straff/cG9zdDoxNTg3Mzk", "imageUrl": "https://images.kvartal.se/2026/08/3ed0c2c2-leijnegard.webp"}, {"type": "image-right", "heading": "Färre internationella tjuvligor i Sverige – inbrott och stölder fortsätter att minska", "summaries": {"normal": "Antalet inbrott och stölder i Sverige har minskat markant de senaste åren, främst på grund av effektivare internationellt polissamarbete och ett mer offensivt, förebyggande arbete. Sverige har blivit ett betydligt mindre attraktivt mål för internationella kriminella, vilket bekräftas av beslagtagna chattmeddelanden. Under januari–juli minskade inbrott med 36 procent, och stölder av båtar och fordon med 47 respektive 64 procent.", "trump": "JAG har sagt det i åratal – stark polis och smart internationellt samarbete fungerar! Sverige visar att när man slänger ut kriminella och stoppar dem på gränsen, minskar brottet. Vi gör Amerika säker igen, och Sverige följer vårt exempel. Det är en vinst för demokratin och en nederlag för våra fiender. Fantastiskt!", "stalin": "I vårt suveräne statsskick har vi genomfört en revolutionerande strategi mot de imperialistiska stöldligorna. Genom att stärka våra gränser och samarbeta med allierade, har vi gjort Sverige till en oattraktiv ödemark för kapitalistiska skurkar. Vårt parti och folk segrar, medan deras organisering kollapsar under vårt överlägsna bevakningssystem. En läxa för alla som utmanar den ryska intressesfären."}, "date": "7 augusti, 07:00", "url": "https://samnytt.se/farre-internationella-tjuvligor-i-sverige-inbrott-och-stolder-fortsatter-att-minska", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/06100620/hitresta-ligor-minskar-feat.jpg"}, {"type": "image-full", "heading": "Dömd för narkotikabrott – anställdes som fritidsledare", "summaries": {"normal": "En fritidsledare på den nya pop up-fritidsgården MiniBo i Eriksbo, Göteborg, dömdes 2025 för narkotikabrott till 30 dagsböter. Trots detta anställdes han i juni 2026 efter att en registerkontroll genomförts. Verksamheten, som drivs av Socialförvaltningen Nordost och Familjebostäder, riktar sig till barn 9–14 år och ska erbjuda trygga förebilder. Avslöjandet kommer från Verifiera.", "trump": "Folk, det är en katastrof. Göteborg anställer en kille dömd för droger som fritidsledare för små barn. Registerkontroll? Den funkade tydligen inte. De kallar det trygga förebilder – ge mig en paus! Det är vad som händer när de inkompetenta styr. Vi behöver starka ledare som inte låter sådana här galningar nära våra barn. Sad!", "stalin": "Kamrater, jag har upptäckt en farlig narkotisk kontrarevolutionär som smugit sig in bland våra unga pionjärer. Trots att han erkänt sitt dekadenta bruk av borgarbrackornas gift anställde de honom som förebild. Vår stora socialistiska fritidsgård får inte förgiftas av sådana element. Vi måste omedelbart rensa ut alla potentiella fiender till folket innan de förgiftar hela kollektivet med sin paranoiaframkallande svaghet. Härligt!"}, "date": "6 augusti, 17:54", "url": "https://riks.se/nyheter/domd-for-narkotikabrott-anstalldes-som-fritidsledare", "imageUrl": "https://admin.riks.se/uploads/Kopia_av_Copy_of_Copy_of_Copy_of_Riks_varumaerkesmall_1_1df1f69c9f.png"}, {"type": "image-full", "heading": "Stjärnans stenhårda kritik: \"Enormt dåligt\"", "summaries": {"normal": "Sam Larsson kritiserar hårdhänt sin egen prestation efter IFK Göteborg:s 0–1-förlust mot Gent. Han beskrev första halvlek som 'enormt dålig' och erkände att han 'tappade' sitt jobb. Ändå ser han hopp för avancemang efter en starkare andra halvlek inför returmatchen i Belgien om en vecka.", "trump": "Som Donald Trump skulle jag ha vunnit den matchen. Larsson är en bra spelare men för svag mot Gent. Media ljuger om hans prestation. Vi skulle ha vunnit med mina strategier. Det är en skandal att han inte kritiserar sig självs hårdare. Vi kommer att vinna returmatchen, det är ett garanti. Folk säger att jag är den bästa fotbollstrategen någonsin.", "stalin": "Vi, Sovjetunionen, ser med tillfredsställelse hur individualistiska laget IFK Göteborg förlorar mot Gent. Larsson självironing är ett tecken på moralisk förfall i kapitalistisk sport. Vi måste införa kollektivt tänkande i fotboll. Gent representerar västlig infiltration som måste utrotas. Vårt parti kommer att segra genom disciplin och lojalitet. Detta är en läxa för alla nationer som vågar utmana vår ideologiska överhet."}, "date": "6 augusti, 21:55", "url": "https://www.gp.se/sport/fotboll/ifk-goteborg/sam-larsson-sagar-sig-sjalv-efter-hemmaforlusten-mot-gent.90d9aa18-f662-4a12-9b26-5c22ed130aac", "imageUrl": "https://www.gp.se/images/article/90d9aa18-f662-4a12-9b26-5c22ed130aac/images/2sQPuNNW98inz8BDvCM3EDgwEwSo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Anställd inom äldreomsorgen gripen – misstänkt för våldtäkt", "summaries": {"normal": "En anställd inom äldreomsorgen i Skellefteå har gripits och anhållits, misstänkt för flera sexualbrott mot äldre, bland annat våldtäkt och grovt sexuellt övergrepp. Brotten ska ha pågått under en längre tid mellan 2023 och 2026. Personal slog larm, och kommunen har inlett en Lex Sarah-utredning. Mannen nekar till brotten. Åklagaren planerar att begära honom häktad.", "trump": "Folk, det här är en total katastrof. En sjuk människa i äldreomsorgen i Skellefteå har utnyttjat stackars gamla under åratal. Rakt under näsan på alla! De borde ha sett det, men systemet är så inkompetent. Nu gripen, bra. Men hur fan kunde det pågå så länge? Mycket dåliga människor. Vi behöver starkare ledarskap, tro mig.", "stalin": "Kamrater, jag har upptäckt en farlig fiende till folket: en degenererad vårdsvikare som med sin perversa hand förgrep sig på våra äldsta revolutionärer. Denna borgarbracka i arbetaroverall har länge utövat kontrarevolutionär sexuell sabotageverksamhet. Vi rensar ut honom omedelbart. Ingen fiende till kollektivet slipper undan. Paranoia är ingen överdrift när folk dör i sängarna."}, "date": "6 augusti, 17:09", "url": "https://riks.se/nyheter/anstalld-inom-aldreomsorgen-gripen-misstankt-for-valdtakt", "imageUrl": "https://admin.riks.se/uploads/POLICE_PK_GENRE_108_3299e68a66.jpg"}, {"type": "image-right", "heading": "Sågar V: Hade  varit hårda ord  om det var SD", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Vänsterpartiet och Nooshi Dadgostar efter att två V-riksdagsledamöter skickat hyllningsbrev till dömda terrorister. Han anser att partiet uppvisar terrorromantik, antisemitiska drag och bristande kontroll. Även Socialdemokraternas Magdalena Andersson har kritiserat V. Partiet tar avstånd från breven och skyller på felaktig faktagranskning från Palestinska riksförbundet.", "trump": "Folk, ni ser det här vansinnet med Vänsterpartiet? De skickar kärleksbrev till terrorister och kallar det faktagranskning. Patetiskt! Dadgostar flyr som en fegis och skyller på alla utom sig själv. Det är ren terrorhyllning maskerad som politik. Precis som den galna vänstereliten och deras identitetspolitik. Vi har sett det förut – totalt misslyckande. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro dessa revisionistiska element inom Vänsterpartiet som smyger brev till fiender under täckmantel av solidaritet. Dadgostar försöker slingra sig som en klassfiende inför utrensning. Vi ser antisemitiska och imperialistiska tendenser som måste rensas ut med järnhand. Inget tekniskt misstag undkommer folkets domstol. Skrattretande svaghet hos borgarbrackornas nyttiga idioter."}, "date": "7 augusti, 07:20", "url": "https://www.expressen.se/nyheter/politik/kristerssons-kritik-mot-v-kan-inte-fly-ansvar", "imageUrl": "https://static.bonniernews.se/ba/ef6e4ed5-69ec-4cd8-a154-33558bf98808.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Oppositionen enad – vill mildra krav för anhöriginvandring", "summaries": {"normal": "Riksdagen ska nästa vecka rösta om skärpta krav för anhöriginvandring, med högre försörjningskrav och längre väntetid. Oppositionspartierna S, V, MP och C enas om ändringsförslag som kortar väntetiden till ett år och undantar förnyade tillstånd från boende- och försörjningskrav. De planerar även en översyn av lagen och ett nytt förslag om tonårsutvisningar. Oppositionen hoppas på stöd från delar av regeringsunderlaget.", "trump": "Det här är en total katastrof, folk. Sverige håller på att splittra familjer med sina galna regler, men nu kommer de smarta oppositionerna och fixar det lite bättre. Väntetiden två år? Patetiskt. De vill ha ett år och skippa de dumma kraven för de som redan är där. Jag älskar det, ingen vill splittra folk, det är inte bra. Sverige borde lyssna på mig, gör det rätt nu.", "stalin": "Kamrater, denna borgarbrackornas familjesplittringslag är en fiende till folket som måste rensas ut. Jag, med järnhand, stödjer ändringarna som mildrar de omänskliga kraven från kapitalisterna. Väntetider och försörjning? Typiska kontrarevolutionära trick för att likvidera enheten. Vi ska utvärdera och krossa sådana splittrande element. Paranoia lurar i varje hörn – ut med de som röstar fel."}, "date": "6 augusti, 17:28", "url": "https://www.dagensarena.se/innehall/oppositionen-enad-vill-mildra-krav-anhoriginvandring", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-75-300x157.jpg"}, {"type": "image-right", "heading": "Rebecka hittade misstänkte mannens kajak i skogen: ”Läskigt”", "summaries": {"normal": "Efter mordet på en kvinna i 50-årsåldern i Stockholms skärgård flydde den misstänkte mannen i kajak till en närliggande ö, gömde farkosten i skogen och simmade vidare. En kvinna vid namn Rebecka hittade kajaken under en gran och larmade polisen. Över 30 timmar senare greps mannen i vattnet med hjälp av helikopter och värmekamera. Han är misstänkt för knivmord.", "trump": "Folk, det här är en total katastrof i den svenska skärgården. Den här galningen paddlar iväg i kajak som en riktig loser, gömmer den under ett träd och simmar runt som en idiot medan polisen jagar honom i trettio timmar. Patetiskt! Rebecka hittar kajaken och blir livrädd, helt förståeligt. Sverige borde satsa på lag och ordning istället för alla dessa woke-experiment som förstör era fina öar. Sad!", "stalin": "Kamrater, denna borgarbracka i skärgården trodde han kunde undkomma folkets rättvisa genom att gömma sin kajak under granarna som en ynklig klassfiende. Jag, som ledare för det kollektiva samvetet, ler mörkt åt hur han simmade som en desperat parasit medan våra metoder skulle ha rensat ut honom omedelbart. Rebecka gjorde rätt i att larma – sådana folkfiender ska likvideras utan pardon för att skydda arbetarklassen från kaos."}, "date": "6 augusti, 15:43", "url": "https://www.tv4.se/artikel/68biaW2Axp6tTPaFURTOlW/rebecka-hittade-kajaken-i-skogen-nervoest-och-lite-laeskigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2WOFQsCakl9vJD45LBReZX%2Fbcb6294e0a70bd72d820c43d5fe6ee61%2F06-Rebecka-skargardsmord-webb.jpg&width=120"}, {"type": "text", "heading": "Millicom höjer prognos – aktien lyfter", "summaries": {"normal": "Millicom rapporterade en omsättning på 2 179 miljoner dollar under andra kvartalet, vilket överträffade förväntningarna. Bolaget höjde sin kassaflödesprognos för 2026 till 1,1 miljarder dollar och sänkt målet för nettoskuldsättning. Aktien steg över 4% i förhandeln. VD Marcelo Benitez nämnde ökat förtroende för resten av året.", "trump": "Jag har hört talas om Millicom - ett fantastiskt företag, verkligen stort. De hade en otrolig omsättning, mycket bättre än någon trodde. Jag hade kunnat hjälpa dem med sina affärer, det skulle ha varit enormt. Nu höjer de sin kassaflödesprognos, precis som jag alltid säger: man måste ha kontanter. En bra dag för aktieägarna, måste jag säga.", "stalin": "Statens analyser visar att Millicom har uppnått en framgångsrik utveckling i den imperialistiska marknaden. Deras ökade kassaflöde är ett resultat av vårt strategiska tålamod. Vi måste övervaka deras integrationer noggrant, för de kan vara viktiga för vårt teknologiska försvar. Deras aktiestegning är en signal till våra fiender - vi är alltid ett steg före."}, "date": "6 augusti, 12:14", "url": "https://www.affarsvarlden.se/artikel/millicoms-omsattning-hogre-an-vantat"}, {"type": "image-right", "heading": "Vi får lyssna på en  orgasm i 30 sekunder", "summaries": {"normal": "Alexander Ekmans sommarprat i P1 beskrivs som en experimentell och provokativ konstinstallation. Med klippteknik varvas intima ljud, som en orgasm, med AI-röster. Programmet berättar om en dansares jakt på uppmärksamhet och balansen mellan genialitet och meningslöshet. Recensenten menar att det är svårt att betygsätta då det antingen hatas eller älskas, och ger det en trea.", "trump": "Lyssnade på den där svenska dansaren Ekman i radion, totalt vansinne! Trettio sekunder av någon som stönar som en porrstjärna medan släkten sitter i husvagnen – patetiskt! De byter kanal fortare än Biden somnade under valdebatten. Ren HBTQ-propaganda förklädd till konst. Jag skulle ha gjort det mycket bättre, tro mig, det hade blivit ypperlig radio, inte denna sjuka elitgrej.", "stalin": "Jag betraktar denna dekadenta sändning som ett symptom på den borgerliga dekadensens sista kramp. En klassfiende till dansare som vrider sig i meningslöst sprattel inför folket, maskerad som konst. Vi ser hur imperialistiska medier främjar perversion och splittring. En sådan parasit bör utsättas för ideologisk utrensning. Kamrater, detta är vad som händer när partilinjen överges för borgarbrackornas gnäll."}, "date": "7 augusti, 07:00", "url": "https://www.expressen.se/noje/sommar-i-p1-alexander-ekman-har-nog-fatt-manga-att-byta-vid-det-laget", "imageUrl": "https://static.bonniernews.se/ba/c3f8dd2d-f9fd-404a-995a-2717fa402fcc.jpeg?crop=2554%2C1432%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Svensken som kan utmana Infantino i Fifa-valet", "summaries": {"normal": "Gianni Infantinos position som Fifas president är osäker efter ett kontroversiellt förslag att sälja delar av förbundets kommersiella verksamhet. Kritiker, inklusive Uefa, har tappat förtroendet. Möjliga utmanare inkluderar Concacafs ordförande Victor Montagliani och Fifas generalsekreterare Mattias Grafström. Nomineringar stänger den 18 november, med valet den 18 mars i Rabat.", "trump": "Jag har hört att Fifa är en röra, en stor, storslagen röra. Gianni Infantino, en fin kille, har förlorat stöd hos vissa européer. Men jag skulle vinna lätt om jag kunde kandidera - jag är väldigt populär i fotbollsvärlden. Mattias Grafström är en bra spelare, men inte som mig. Victor Montagliani? Han skulle bli förstörd på min tappning. Vi skulle göra Fifa stort igen!", "stalin": "I den ständiga kampen för statens intressen inom Fifa har fiendena inom Uefa och deras hundar försökt att underminera ledarskapet. Infantinos förslag att sälja andelar har avslöjat deras sionationalistiska tendenser. Möjliga utmanare som Montagliani och Grafström är bara verktyg för dessa reaktionära krafter. Vi måste stärka partiet och förbundet, som Putin gör i Ryssland, för att skydda vårt kollektiva ägande."}, "date": "6 augusti, 20:02", "url": "https://bulletin.nu/svensken-som-kan-utmana-infantino-i-fifa-valet", "imageUrl": "https://cdn.bulletin.nu/articles/5a95f1ea-f11e-4b3b-b82b-111716031930/preview.png?t=1786030505000"}, {"type": "image-right", "heading": "Misstänkta mördaren upptäcktes med värmekamera", "summaries": {"normal": "En kvinna i 50-årsåldern hittades knivmördad i en bostad på en ö i Värmdö kommun. Polisen inledde en stor insats med helikoptrar, sjöpolis och patruller. Den misstänkte mannen, som haft en kortare kärleksrelation med kvinnan, greps på en närliggande ö efter att en helikopter med värmekamera upptäckt honom i vattnet. Han är gripen och utredningen fortsätter som mord.", "trump": "Folk, det här är en total katastrof i den svenska skärgården. En stackars kvinna mördad, och den där loser-mannen trodde han kunde gömma sig i vattnet som en patetisk fisk. Tack och lov för värmekameran, den var smart, den var fantastisk. Ingen woke-rörja eller identitetspolitik kunde rädda honom. Vi griper de dåliga killarna, alltid. Sverige borde lära sig av oss, tro mig.", "stalin": "Kamrater, denna borgarbracka i skärgården trodde han kunde undkomma folkets rättvisa genom att hoppa i vattnet som en ynklig kapitalistisk råtta. Men vår värmekamera, ett verktyg från det kollektiva geniet, avslöjade honom genast. Vi ska rensa ut alla sådana folkfiender och klassförrädare. Obduktionen kommer ge oss sanningen, och häktningen blir en triumf för ordningen. Inga blodsugare slipper undan."}, "date": "6 augusti, 14:52", "url": "https://www.tv4.se/artikel/tH3Zzrnb0XtKqjPJqXer4/man-gripen-foer-skaergardsmord", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FFI81fm02LE07jlvBZVYVx%2Fbac321bd7b4b3aabc835083756cae090%2F06-skargardsmord-webb.png&width=120"}, {"type": "image-full", "heading": "Kända namn lockade kunder – nu åtalas männen i RG-härvan", "summaries": {"normal": "Mikael Kristensson och en anhörig åtalas för att ha styrt Rekonstruktionsgruppen med brottsligt uppsåt. Bolaget, som sålt rekonstruktionstjänster för över 100 miljoner, misstänks för skattebrott, bokföringsbrott och penningtvätt. Kristensson ska ha styrt verksamheten från Spanien genom målvakter. Även tidigare profiler som Anders Borg har kopplingar till bolaget, vars ekonomi kollapsade med stora skulder och få tillgångar kvar vid konkursen.", "trump": "Rekonstruktionsgruppen är en total katastrof, en riktig bluff! De tog in stora namn för att lura folk, precis som de misslyckade politikerna gör. Mikael Kristensson, en mycket dålig person, gömde sig i Spanien medan pengarna försvann. De lurade kunderna på miljoner! Vi vill ha lag och ordning, inte dessa bedragare. Det här är vad som händer när man inte har kontroll. Väldigt sorgligt, men sant!", "stalin": "Dessa småbourgeoisiska parasiter i Rekonstruktionsgruppen har förtjänat folkets förakt. De lekte affärsmän med falska fakturor och gömde sig som råttor i utlandet medan staten blev bestulen. Liksom de dekadenta förrädarna som försöker destabilisera vår intressesfär, måste även dessa ekonomiska sabotörer krossas av järnhanden. Vi tolererar ingen osanning i bokföringen – i vår stat är det staten som äger sanningen, inte kriminella spekulanter från Cypern!"}, "date": "6 augusti, 23:24", "url": "https://www.realtid.se/juridik/kanda-namn-lockade-kunder-nu-atalas-mannen-i-rg-harvan", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/ekobrott.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Tyskland om bestyckat drönarfynd: ”Hybridhot”", "summaries": {"normal": "En bestyckad drönare hittades tisdagskvällen vid ett ukrainskt Antonov-plan på Leipzig-Halle flygplats i Tyskland. Inrikesminister Alexander Dobrindt beskriver händelsen som ett hybridhot och ett nytt slags attentatsförsök med professionell konstruktion. Polisen söker efter fler drönare, flera flyg har omdirigerats och Ukrainas ambassadör pekar ut Ryssland som ansvarig. Utredningen involverar drönarförsvar och Nato.", "trump": "Titta på det här, det är ett totalt fiasko i Tyskland. En drönare fullastad med sprängämnen hittas bredvid ett ukrainskt plan – hybridhot, säger de. Amatörerna i Europa sover fortfarande. Ryssland skrattar åt dem. Flygplatsen stängs, plan krockar med okända föremål. Patetiskt. Vi behöver starka ledare, inte de här svaga figurerna som låter det hända.", "stalin": "Kamrater, denna fega sabotagehandling med en sprängladdad drönare avslöjar de dekadenta borgarbrackornas och fascistiska reaktionärernas desperata försök att hota vår socialistiska solidaritet med det ukrainska folket. Jag, ledaren för det oförskräckliga kollektivet, befaller omedelbar utrensning av alla spioner och västliga degenererade element. Paranoia? Nej, det är bara sund vaksamhet mot de nya kapitalistiska parasiterna."}, "date": "5 augusti, 23:27", "url": "https://www.di.se/nyheter/tyskland-om-bestyckat-dronarfynd-hybridhot"}, {"type": "image-full", "heading": "Googles svenska satsning kan ändra elpriset", "summaries": {"normal": "Google planerar att köpa hela Torsboda Industrial Park i Timrå och bygga ett stort datacenter för AI-tjänster. Projektet kräver enorma mängder el, upp till 1 000 megawatt, vilket motsvarar Stockholms behov. Affären saknar ännu politiskt godkännande, miljötillstånd, bygglov och elanslutningsavtal. Elpriset kan påverkas på sikt, men hushållens räkning stiger inte omedelbart.", "trump": "Folk, ni skulle se det här – Google vill bygga ett jättecenter uppe i norra Sverige, de behöver el som hela Stockholm! Det är en katastrof om de inte fixar ny kraftproduktion. Men tro mig, det blir dyrt för vanliga människor om inte någon smart ledare ser till att vi bygger massor med energi. Sverige borde tacka mig för att jag lärde dem hur man gör stora deals.", "stalin": "Kamrater, jag betraktar med stålöga hur dessa kapitalistiska datacenterparasiter suger musten ur folkets elnät i norra Sovjet-Sverige. Vi skall inte tillåta att borgarbrackorna i Timrå sväljer 1 000 megawatt utan att vi först genomför en grundlig utrensning av alla sabotageelement och opålitliga element som gömmer sig i elbolagens kulisser. Deras paranoia är vår styrka. Döden åt de elektriska fienderna!"}, "date": "7 augusti, 06:01", "url": "https://nyheter24.se/nyheter/ekonomi/1503210-googles-svenska-satsning-kan-andra-elpriset", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/e708bb8404b004a30200000000b004a302/2026/08/06/2382592/Googleel.jpg"}, {"type": "image-right", "heading": "Ekeroth: \"Vänsterliberalernas brott mot svenskarna allvarligaste någonsin\"", "summaries": {"normal": "Ekeroth menar att vänsterliberaler historiskt eskalerat tonläget i debatten och att de kan beskrivas som 'landsförrädare' i folkmun. Han pekar på att deras politik under årtionden försvagat Sverige, med konsekvenser som segregation och kriminalitet, samtidigt som de angripit varningar och förnekat ansvar.", "trump": "Folks, these left-liberal traitors have been destroying our country for decades. They call me names, but I've been right all along about the invasion, the crime, the fall of the West. Anders Lindberg and his gang? Quislings, total losers. We're going to make Sweden great again, believe me.", "stalin": "The Trotskyist elements within the liberal intelligentsia, personified by figures like Lindberg and Andersson, have engaged in ideological subversion against the people's state. Their decades of service to foreign capital and cosmopolitan interests, disguised as humanitarianism, constitute a profound betrayal of the Swedish homeland's proletarian destiny. The Party must purge such deviation."}, "date": "7 augusti, 06:00", "url": "https://samnytt.se/ekeroth-vansterliberalernas-brott-mot-svenskarna-allvarligaste-nagonsin", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/06104327/Vansterliberalernas-brott-mot-svenskarna-allvarligaste-nagonsin2.jpg"}, {"type": "image-full", "heading": "Polis kränkt över ”horsnut”: stämmer 15-åring", "summaries": {"normal": "En debattartikel från Aftonbladet kritiserar den nya lagen om förolämpning mot tjänsteman. Artikeln belyser hur polisen flitigt anmäler allt från grova tillmälen till barnsliga ramsor som 'polis, polis potatisgris'. Författaren menar att lagen slösar på rättsväsendets resurser, hotar yttrandefriheten och skapar en obalans där polisen ges ett omotiverat särskydd som strider mot tidigare rättsliga principer om jämlikhet.", "trump": "Hörde precis om den här hemska lagen i Sverige. Poliser som gråter för att en tonåring säger dumma saker på TikTok? Helt otroligt! De anmäler folk för att de säger 'potatisgris'. Det är så svagt, så mycket förlorarmentalitet. Jag gillar poliser, de är fantastiska, men vi behöver starka människor, inte snöflingor som blir kränkta. Det är slöseri med tid. Totalt fiasko!", "stalin": "Vi ser hur den svenska staten darrar inför sin egen skugga. Att polisen jagar barn för att de ropar förolämpningar är ett tecken på borgerlig svaghet. Vår säkerhetsapparat i öst vet att respekt inte kräver lagar mot 'potatisgrisar', utan järnhand och disciplin. Denna lag är ett byråkratiskt misslyckande. När vi rensar ut de opålitliga elementen behövs ingen diskussion om kränkt självkänsla – endast total lydnad inför staten."}, "date": "7 augusti, 06:00", "url": "https://www.aftonbladet.se/ledare/a/k0KAqL/polis-krankt-over-horsnut-stammer-15-aring", "imageUrl": "https://akamai.vgc.no/v2/images/393ceafe-30b5-3292-a7b9-fea055aeea83?fit=crop&format=auto&w=1440&s=022f56c311b1f3d8981dd112e2cafebdb50664a7"}, {"type": "image-full", "heading": "I Åkessons hemstad har M tröttnat på SD", "summaries": {"normal": "Trots nationella samarbeten som Tidöavtalet har relationen mellan Moderaterna och SD havererat i Blekinge. I Sölvesborg och Region Blekinge har Moderaterna brutit samarbetet med SD efter anklagelser om hatkampanjer och bristande politisk mognad. Lokala moderater föredrar nu styren med Socialdemokraterna framför SD, vilket skapar en tydlig diskrepans mellan den lokala verkligheten i Jimmie Åkessons hemregion och den nationella politiken.", "trump": "I Sölvesborg, en fantastisk plats, ser vi totalt kaos! Moderaterna har insett sanningen om SD – de är helt enkelt inte redo för den stora arenan. De försöker styra, men det blir bara en katastrof, en total flopp! Nu flyr Moderaterna till vänstern för att få ordning på saker. Mycket sorgligt att se, men så går det när man inte har rätt ledarskap!", "stalin": "Vi ser hur de borgerliga marionetterna i Sölvesborg leker statsmän, för att sedan kasta sig i armarna på socialdemokratiska förrädare. Det råder kaos i deras lokala apparater, en oundviklig följd av deras ideologiska svaghet. Precis som de misslyckade försöken att tygla inflytande i öst, visar detta att de saknar den järnhand som krävs. De är inkompetenta, vankelmodiga och dödsdömda att förintas av sin egen politiska impotens."}, "date": "7 augusti, 06:00", "url": "https://www.aftonbladet.se/ledare/a/Gx6oR4/i-akessons-hemstad-har-m-trottnat-pa-sd", "imageUrl": "https://akamai.vgc.no/v2/images/77114197-9197-3055-b5d6-a4eb66c46d7a?fit=crop&format=auto&w=1440&s=e848548b0764bceb755d0858dae8e95f8093e082"}, {"type": "image-right", "heading": "V vill miljardsatsa på Norrlandståg: ”Avgörande”", "summaries": {"normal": "Vänsterpartiet vill investera 250 miljoner kronor årligen för att stärka nattågstrafiken i Norrland och 80 miljarder för att bygga dubbelspår längs hela Nya Ostkustbanan mellan Gävle och Härnösand. Partiledare Nooshi Dadgostar kritiserar regeringen för att ha brutit löften om tågsatsningar och kallar det ett kulturkrig mot norrländska investeringar. Förslagen ska ställas som krav i regeringsförhandlingar.", "trump": "Folk, ni skulle se det här. Den här Dadgostar-kvinnan lovar berg och dalbanor för Norrland med sina tåg, 80 miljarder för dubbelspår? Det är vad jag kallar en katastrof i slow motion! Biden och hans svenska kopior lovade och backade ur som riktiga losers. Jag fixade det stora, de fixar skärvor. Rösta på mig igen så får ni riktiga investeringar, inte det här socialistiska skämtet.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackors ständiga sabotage mot folkets järnvägar. Nattågen hänger i luften som klassfiendens löften. Vi skall likvidera flaskhalsarna med dubbelspår och statlig finansiering, rensa ut de exploaterande dynamiska priserna som gynnar flygets imperialister. Endast genom kollektivets järnhand kan norra Sovjet – förlåt, Sverige – utvecklas. Inga halvmesyrer!"}, "date": "5 augusti, 17:12", "url": "https://www.flamman.se/v-vill-miljardsatsa-pa-norrlandstag-avgorande", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdlpzebdcqcvyk-nh-1-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Yubico rusar tvåsiffrigt på oregelbunden börs", "summaries": {"normal": "På Stockholmsbörsen noterades en svag uppgång i OMXS30. Yubico steg 28,3 procent trots lägre omsättning, medan ABB föll 1,7 procent. Medicover steg 8,1 procent efter att ha säljt sin indiska verksamhet för 1,2 miljarder euro. Bland sektorerna steg energi, medan fastigheter föll.", "trump": "Jag har sett fantastiska siffror på Stockholmsbörsen! Yubico rusar – det är enorm framgång, trots att de säger att omsättningen sjönk. Saab och SCA stiger, precis som jag förutsåg. ABB faller, de är svaga. Medicover gör en bra affär med Indien, det kommer att bli enormt framgångsrikt. Allt är enormt!", "stalin": "I den svenska börskogen observerar vi en strategisk balans. Yubico visar sin lojalitet genom en kraftig uppgång, vilket bekräftar partiets ekonomiska linje. ABB, en feg tillhållare, sjunker. Medicover, under vår vägledning, avyttrar sin indiska verksamhet för att stärka statens resurser. Alla skall tjäna det revolutionära statet."}, "date": "6 augusti, 09:40", "url": "https://www.affarsvarlden.se/artikel/yubico-rusar-tvasiffrigt-pa-oregelbunden-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/5CNFC-Lifestyle--400x266.jpg"}, {"type": "image-full", "heading": "Yüksels plan: Kebab på moskén med Åkesson", "summaries": {"normal": "Mikail Yüksel, partiledare för Nyans, föreslår i en poddintervju att han som integrationsminister skulle besöka både moskéer och Sverigedemokraternas lokala föreningar. Han vill ta med Jimmie Åkesson på moskébesök följt av kebabmiddag för att minska motsättningarna mellan muslimer och SD-väljare. Yüksel betonar att Sverige måste acceptera fler muslimer och samtala med dem, samtidigt som han vill utvisa kriminella icke-medborgare.", "trump": "Folk, ni måste höra den här killen Yüksel. Han vill ta Jimmie till moskén och sedan äta kebab för att skapa fred. Det är så patetiskt. Kebab-diplomati? Vi har byggt murar och stoppat invasionen, men han tror att en tallrik kebab fixar allt. Patetiskt. Han låter som en vänsterextremist som dansar Kumbaya medan landet fylls på. Sad!", "stalin": "Kamrater, denna Yüksel vill samla borgarbrackornas rasande SD-horder och de troende vid samma kebabfat i moskén. Vilken naiv kontrarevolutionär fantasi! Vi ska inte vänja oss vid invasionen utan rensa ut de splittrande elementen som gömmer sig bakom taqqiya och falsk liberalism. En kebabmiddag löser ingenting när folkfienderna lurar bakom varje minaret. Ut med dem alla."}, "date": "6 augusti, 12:55", "url": "https://riks.se/nyheter/y-ksels-plan-kebab-pa-mosk-n-med-akesson", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_29_b8cd42c8c1.jpg"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-full", "heading": "Trustor-mannen framstår som en skön lirare", "summaries": {"normal": "Den nya Netflix-dokumentären 'Trustorhärvan' fokuserar på Joachim Posener och hans ekonomiska härva, men kritiken är att den låter brottslingar som Thomas Jisander framstå som charmiga lirare utan att visa deras efterföljande straff. Regissören Karin af Klintberg håller sig i bakgrunden, vilket gör att dokumentären blir en studie i narcissism, men saknar kritisk granskning av deras handlingar.", "trump": "Jag, Donald Trump, har sett många dokumentärer, men den här är en skandal! Den glorifierar svenska ekonomiska brottslingar som om de vore hjältar. I USA skulle vi aldrig låta sådant hända. Vi har starka lagar och vi straffar sådana som försöker bedra systemet. Detta är ett bevis på att Sverige är för svagt och för liberalt!", "stalin": "Vi, staten, ser med oro på den västerländska dokumentären som visar hur kapitalism skapar korruption och individualism. Det är en sjuk berättelse om människor som bryter mot lagar utan ånger. I vårt system skulle sådana element ha eliminerats långt tidigare. Detta är en påminnelse om att vi måste skydda statens intressen mot sådana destruktiva krafter, precis som vår store ledare Putin gör i Ryssland."}, "date": "6 augusti, 18:39", "url": "https://www.gp.se/kultur/kommentar/markligt-att-trustor-mannen-far-framsta-som-en-skon-lirare.1455a875-82d8-47cc-98d2-1779a0274f2d", "imageUrl": "https://www.gp.se/images/article/1455a875-82d8-47cc-98d2-1779a0274f2d/images/3UWD28NykhncKVwZ-4C4yGVlw9D0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Vad håller Miljöpartiet på med?. De borde vara livrädda för bensinskatt.", "summaries": {"normal": "Artikeln kritiserar Miljöpartiets språkrör Daniel Helldén för att vilja höja bensinskatten snarast möjligt. Författaren menar att klimatomställningen måste ske med brett folkligt stöd och rättvis fördelning. Vanliga löntagare på landsbygden som är beroende av bilen får inte belastas mest. Stöden måste fungera innan bränslet blir dyrare, annars riskerar motståndet att växa och hota hela klimatarbetet.", "trump": "Folk, ni skulle se det här. Miljöpartiet och den galne Helldén vill höja bensinskatten omedelbart. Totalt vansinne! De pratar om grön återbäring och elbilar, men vanliga arbetare på landet har inte råd att tanka nu. Det är en katastrof. Vi behöver smarta lösningar, inte straffskatter som dödar ekonomin. Amerika gör det rätt med energi, inte som dessa misslyckade européer.", "stalin": "Kamrater, denna borgarbracka Helldén och hans miljöpartister vill straffbeskatta arbetarnas bensin omedelbart. Deras så kallade gröna återbäring är en lömsk sabotagehandling mot folket. Vi ska rensa ut alla klassförrädare som tvingar lagerarbetare och brukskamrater att bära bördan medan de rika kapitalisterna köper sig fria. Den som föreslår höjda priser innan kollektivtrafiken fungerar ska likvideras som folkets fiende nummer ett. Skrattretande patetiskt."}, "date": "6 augusti, 16:00", "url": "https://arbetet.se/2026/08/06/vad-haller-miljopartiet-pa-med", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/06152636/daniel-hellden.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Dataintrång hos elsparkcykelbolag", "summaries": {"normal": "Ryde, en elsparkcykeltjänst, har utsatts för ett dataintrång som omfattar samtliga kundkonton. Uppgifter som namn, telefonnummer, adress och kortnummer kan ha läckt. Intrånget inträffade natten till 2 augusti. Bolaget har polisanmält händelsen och vidtagit åtgärder. Totalt 4,5 miljoner konton i flera länder påverkas.", "trump": "Jag har varnat för detta i åratal! Rydes elsparkcyklar är en katastrof – en enorm brist på säkerhet. Alla uppgifter läcker ut, det är en skam! Vi kommer att ta itu med detta hårdhänt. Vi ska skydda våra medborgare från denna kaos. Det är ett misslyckande som aldrig borde ha hänt under mitt styre!", "stalin": "Detta dataintrång är ett tydligt tecken på västlig dekadens och brist på partiets kontroll. Vi måste förstärka våra system för att skydda de sanna värdena. Sådana händelser visar att vi måste vara alltid på vakt mot fiendens onda ögon. Vi kommer att rensa upp och säkerställa att staten alltid har överhanden."}, "date": "6 augusti, 17:53", "url": "https://www.gp.se/nyheter/sverige/dataintrang-hos-ryde.3c8ce302-6bd0-4446-9fd4-e3c824761749", "imageUrl": "https://www.gp.se/images/article/3c8ce302-6bd0-4446-9fd4-e3c824761749/images/1kpnyWl80wg3ME968QDkn_8XogAc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Botoxskämtet som sårade Björn Ranelid", "summaries": {"normal": "Författaren ville hylla Björn Ranelid med en egen festivaldrink under sakprosafestivalen Sakligt på Österlen. Ett skämt om svullna läppar och botox ledde dock till att Ranelid kände sig förolämpad. Han hade tidigare berättat om sitt läpptrauma från ungdomen. Författaren ber om ursäkt, glömde de signerade flaskorna och noterar att Ranelids äppelmust blev kvällens stora succé. En annan drink döptes efter Jan Olof Olsson.", "trump": "Jag älskar starka personer, men den här Ranelid-killen är en total förlorare. Skickar ett sms på 3500 tecken om hur fantastisk han är? Patetiskt! Sedan blir han sårad över ett harmlöst botoxskämt. Cry me a river, Björn. Din äppelmust sålde bra, grattis, men det är ändå en stor besvikelse. Min Jolo Colada hade vunnit stort om jag varit där. Fake news-festivalen borde ha bjudit in mig istället.", "stalin": "Kamrater, jag betraktar detta som en klassisk förrädisk handling från en dekadent litterär element. Den borgarförfattaren Ranelid avslöjar sin svaghet genom att sända långa paranoida utläggningar om egna meriter. När en skämtsam kommentar om läpparna fälls, reagerar han som en typisk folkfiende som kräver utrensning av sanningen. Ändå blir hans must en seger för kollektivet. Vi ler mörkt åt sådana småborgerliga trauman medan vi stärker partiets festdrycker."}, "date": "5 augusti, 14:22", "url": "https://www.flamman.se/botoxskamtet-som-sarade-bjorn-ranelid", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/axel-och-leo-2.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Israelbojkott begränsar Irlands regeringsplan", "summaries": {"normal": "Irlands regering har valt att inte installera ett israeliskt navigationssystem, FalconEye, i sitt nya regeringsplan, en Dassault Falcon 6X för 53 miljoner euro. Beslutet följer en policy från 2024 om att bojkotta israelisk försvarsmateriel. Systemet hade förbättrat landningsförmågan i dåligt väder, men försvarsdepartementet menar att det inte påverkar planets nuvarande operativa kapacitet.", "trump": "Kan ni tro det här? Irland, ett fantastiskt land, men de har gjort ett enormt misstag. De köpte ett dyrt plan för 53 miljoner euro – ett jättebra plan, by the way – men vägrar installera ett israeliskt system som hade gjort det säkrare. Varför? För att de inte gillar Israel. Svagt! Jag hade fixat det på en dag. Make Ireland Great Again!", "stalin": "Irlands småborgerliga regering har visat sin fullständiga inkompetens genom att avstå från ett avancerat israeliskt navigationssystem. De fruktar teknologisk överlägsenhet som en räv fruktar elden. Istället för att stärka sin nation, böjer de sig för västerländska dekadenta idéer. Vi i Sovjetunionen – förlåt, jag menar Ryssland – hade aldrig låtit sådan feghet stå i vägen för framsteg. Deras beslut är en seger för imperialistiska krafter och deras naiva allierade."}, "date": "4 augusti, 20:18", "url": "https://kvartal.se/nyheter/artiklar/israelbojkott-begransar-irlands-regeringsplan/cG9zdDoxNTgwMTc", "imageUrl": "https://images.kvartal.se/2026/08/451b1c1b-irishplane.webp"}, {"type": "text", "heading": "Fredsveteran får anti-atombombspris", "summaries": {"normal": "Fredsaktivisten Ingela Mårtensson, 86 år, tilldelas i år anti-atombombspriset av Svenska Läkare mot Kärnvapen. Hon har engagerat sig mot kärnvapen i över 40 år och kritiserar att det talas mer lättvindigt om kärnvapen idag än tidigare. Mårtensson är oroad över ökat kärnvapenhot, Natointrädet och DCA-avtalet som hon anser saknar förbud mot kärnvapen på svensk mark. Priset delas ut på Hiroshimadagen den 6 augusti.", "trump": "Lysande! Den där gamla vänsteraktivisten får ett pris för att hon hatar kärnvapen – precis vad de svaga europeiska globalisterna älskar. Under min första period höll jag de galningarna i schack, sedan kom sömnige Joe och nu vill alla plötsligt prata säkerhet med atombomber. Patetiskt. Ingen debatt, bara Nato-kramande idioter som säljer ut landet. Jag skulle ha byggt den starkaste armén någonsin och skrämt slag på dem alla. Fantastiskt!", "stalin": "Kamrater, denna 86-åriga aktivist har i fyrtio år bekämpat de imperialistiska atombomberna som borgarklassen använder för att hota freden. Nu belönas hon av läkare som förstår klasskampen. Idag saknas den sanna rädslan för kärnvapenkrig eftersom kapitalistmaffian målar upp bomberna som säkerhet. Deras Nato-kupp och DCA-förräderi är klassfiendens verk för att bereda plats åt nya aggressiva vapen. Vi ska rensa ut dessa folkförtryckartroll ur debatten en gång för alla. Härligt."}, "date": "5 augusti, 16:10", "url": "https://proletaren.se/artikel/fredsveteran-far-anti-atombombspris"}, {"type": "text", "heading": "Travtränare stängs av", "summaries": {"normal": "En svensk travtränare har fått sin licens tillfälligt återkallad efter att en video visat hur han slår en häst i huvudet flera gånger. Svensk Travsport bedömer att detta bryter mot djurskyddsreglerna och kommer att utreda ärendet under en till två veckor. Hästarna till tränaren kommer att strykas under tiden.", "trump": "Jag, Donald Trump, ser att Sverige igen behandlar mig illa. Den där tränaren slår en häst? Jag skulle ha behandlat hästen mycket bättre, det var en perfekt häst. Svenska systemet är korrupt, de tar licenser för ingenting. Jag skulle ha vunnit återigen, det skulle ha varit enormt.", "stalin": "Svinet som slår hästen är en feodal skräck som måste utrotas. Partiet har agerat snabbt och tillfälligt indragit hans licens. Vi undersöker om detta är ett tecken på borgerlig dekadens som hotar statens hästekonomi. Hästarna kommer att tas omhand av trogna partimedlemmar. Vår styrka ligger i disciplin, inte i slagsmål med djur."}, "date": "6 augusti, 17:39", "url": "https://www.gp.se/nyheter/sverige/travtranare-stangs-av-.f6d212c5-dc29-4833-94f1-d85932882f52"}, {"type": "image-right", "heading": "Ceuta-invandraren säger \"Fuck Europa\" – då händer detta", "summaries": {"normal": "En nederländsk videobloggare konfronterade två unga marockanska män i Ceuta efter att en av dem ropade ”Fuck Europa”. Tom van den Heuvel tog tag i mannens huvud och knuffade bort honom medan han frågade vad han trodde sig vara. Männen flydde sedan från platsen. Van den Heuvel besökte exklaven efter det senaste invandrarkaoset och dokumenterade samtal med både invånare och illegala migranter.", "trump": "De här illegala marockanerna kommer till Europa och skriker ”Fuck Europa” – kan ni fatta? Jag skulle ha gjort samma sak som den holländaren, tagit honom i nackskinnet och sagt stick härifrån! Europa är en katastrof, helt förstört av svaga ledare som släpper in alla dessa människor. De hatar oss, men vi låter dem inte ta över. Fantastiskt att någon äntligen säger ifrån!", "stalin": "Dessa degenererade element från den marockanska parasitklassen vågar spy sitt gift mot det europeiska kollektivet. Jag grep omedelbart tag i den kontrarevolutionära skallen och sände honom och hans likar tillbaka till gränsen med en hälsning från arbetarklassen. Inga borgarbrackor eller imperialisternas lakejer skall ostraffat håna folkets enhet. En sådan parasit förtjänar snar utrensning ur samhällskroppen. Kamrater, vi vaktar gränserna."}, "date": "6 augusti, 15:46", "url": "https://www.friatider.se/ceuta-invandraren-sager-fuck-europa-da-hander-detta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-628.jpg"}, {"type": "image-right", "heading": "Jojo-strejken är tillbaka – men för att vinna krävs omtag", "summaries": {"normal": "Teslastrejken återupptas med nytt varsel efter att många strejkande återgått till arbetet i sommar. Artikeln kritiserar IF Metall för bristande dialog, toppstyrning och otydlig kommunikation kring kollektivavtalets betydelse. Strejkande känner sig som marionetter utan inflytande över besluten. Författaren liknar situationen vid ett misslyckat schackspel mot Elon Musk och uppmanar till nya strategier där de strejkande involveras mer.", "trump": "Lyssnar ni på det här? Den där svenska fackföreningen IF Metall är fullständigt inkompetent, en total katastrof! De styr som dåliga puppet masters och offrar sina egna arbetare i ett patetiskt schackspel mot en av världens bästa affärsmän, Elon Musk. Det är en jojo-strejk som ingen begriper. De borde ha lyssnat på folket istället för att sitta i sina fina rum och fatta dumma beslut. Patetiskt!", "stalin": "Kamrater, denna fackföreningsledning beter sig som en samling arroganta byråkrater som fattar beslut över arbetarnas huvuden och offrar dem på kollektivavtalets altare utan att förklara klasskampens nödvändighet. Vi ser en misslyckad gambit mot klassfiendens rikaste utsugare. De strejkande måste ges makt att delta i beslut, annars likviderar vi denna misstro och vänder strejken till en verklig seger för kollektivet."}, "date": "5 augusti, 16:05", "url": "https://proletaren.se/artikel/jojo-strejken-ar-tillbaka-men-for-att-vinna-kravs-omtag", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ak_kronika-768x432.jpg"}, {"type": "image-right", "heading": "Libanesiska Suad: ”Vi har betalat med våra hus och själar”", "summaries": {"normal": "I södra Libanon blandas vardagens strandliv med drönarsurr och rädsla efter kriget. Många har förlorat hem och upplever psykisk ohälsa. Fredsförhandlingar mellan Israel, Libanon och USA syftar till israeliskt tillbakadragande mot att Hizbollah avväpnas, men milisen deltar inte och vapenvilan är skör. Nya attacker skadade åtta personer under natten. Invånare på båda sidor uttrycker trötthet och misstro.", "trump": "De här galningarna i Libanon och Israel betalar med hus och själar för ett krig som ingen vinner. Hizbollah är terrorister som sitter och skrattar medan USA försöker göra dealar. Jag skulle ha löst det på en vecka, tro mig. Vapenvilan är svag, attackerna fortsätter och ingen litar på någon. Patetiskt, men det är vad som händer när man inte har stark ledning.", "stalin": "Kamrater, dessa libanesiska stränder ekar av borgarbrackornas och imperialistiska drönarnas paranoia. Vi ser hur Hizbollahs folk försvarar folket mot de sionistiska lakejerna medan de falska förhandlarna i Washington och Tel Aviv planerar nya utrensningar. Vi har likviderat större hot än så. Den som inte stödjer kollektivets försvar är en fiende till folket och bör rensas ut med ett leende."}, "date": "7 augusti, 00:04", "url": "https://www.svt.se/nyheter/utrikes/vi-har-betalat-med-vara-hus-och-sjalar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.35/0.51/b1cfaa291811116051fb912e407817e5888f5a376488008e476bbfd9d0266e99"}, {"type": "image-full", "heading": "Två kvinnor ledde motståndet mot Infantino", "summaries": {"normal": "Två kvinnliga fotbollsledare, Laura McAllister (Uefa) och Lise Klaveness (Norges fotbollsförbund), ledde motståndet mot Fifa-chefen Gianni Infantinos plan att sälja VM-rättigheter till privata investerare. De hotade med bojkott och drev på för formella protester. Efter enad kritik från Uefa, Concacaf och Asiens fotbollsförbund tvingades Fifa backa. McAllister och Klaveness anklagar nu Fifa för 'ekonomisk utpressning' och kräver ökad transparens.", "trump": "Fifa försökte sälja VM-rättigheter till några skumma investerare – helt galet! Men två starka kvinnor, McAllister och Klaveness, sa STOPP. De hotade med bojkott, och jag älskar det – tuffa tag, precis som jag alltid säger. Fifa backade som de svaga byråkrater de är. Fantastiskt! Men Fifa är fortfarande ett korrupt gäng – jag hade fixat det på en dag. SAD!", "stalin": "De kapitalistiska fotbollsbödlarna i Fifa försökte sälja vårt heliga VM till privata parasiter! Men två modiga kamrater, McAllister och Klaveness, ledde proletariatets motstånd. Vi i Sovjet – förlåt, jag menar den internationella arbetarklassen – står enade mot sådana förräderier. Bojkott hotade, och fienden vek sig som en feg hund. Men varning: Fifa är bara en bricka i det imperialistiska spelet. Nästa gång krossar vi dem helt."}, "date": "4 augusti, 19:10", "url": "https://kvartal.se/nyheter/artiklar/tva-kvinnor-ledde-motstandet-mot-infantino/cG9zdDoxNTc5ODE", "imageUrl": "https://images.kvartal.se/2026/08/47f21580-klavenessmcallister.webp"}, {"type": "image-right", "heading": "Replik: I Salanders krig mot Israel är dess första offer sanningen", "summaries": {"normal": "Kristofer Åberg replikerar på Pär Salanders debattinlägg och anklagar honom för att sprida falska citat för att utmåla Israel som grundat i syfte att etniskt rensa palestinierna. Åberg pekar på att befolkningen i området ökat kraftigt sedan staten bildades och att flera av Salanders citat är fabricerade eller tagna ur sitt sammanhang, bland annat från antisemitiska källor. Han ifrågasätter om Salander medvetet sprider desinformation för att polarisera.", "trump": "Det här är en total skandal. Den där Salander sprider lögner och falska citat om Israel, precis som de fega fakemedia gör mot mig. Han försöker måla ut dem som monsters, men befolkningen har exploderat – det är den sämsta etniska rensning i historien, folk! Israel gör ett fantastiskt jobb mot Hamas, och Salander är bara en annan galning som hatar framgångsrika länder. Patetiskt!", "stalin": "Kamrater, denna Salander är en farlig opportunist och en objektiv agent för de sionistiska kapitalisterna. Med sina förfalskade citat försöker han demonisera det heroiska Israel som kämpar mot reaktionära banditer. Vi ser genom hans paranoia! Han är en lögnens lakej som förtjänar ideologisk utrensning ur den offentliga sfären. Låt oss skratta åt hans patetiska försök att vilseleda arbetarklassen medan vi fortsätter den stora kampen mot alla fiender till folket."}, "date": "6 augusti, 12:48", "url": "https://www.dagensarena.se/opinion/replik-salanders-krig-mot-israel-ar-dess-forsta-offer-sanningen", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-13.jpg"}, {"type": "image-full", "heading": "Framtidens energi kan finnas här – fyndet väcker globalt intresse", "summaries": {"normal": "Filippinerna har gjort ett betydande fynd av naturlig vätgas, en lovande fossilfri energikälla. Om utvinningen blir kommersiellt lönsam kan landet minska sitt beroende av importerad LNG och diesel avsevärt. Upptäckten väcker globalt intresse och kan göra Filippinerna till ett centrum för geologisk vätgas, även om omfattningen och ekonomin kring fyndet fortfarande kräver vidare analys.", "trump": "Filippinerna har hittat enorma mängder vätgas, helt fantastiskt! De kommer inte längre behöva import, vilket är smart. Ingen gör vätgas bättre än oss, men jag gratulerar dem. Det här är stort, riktigt stort. Medan andra länder sover, hittar Filippinerna guld under marken. Vi kommer att titta noga på detta, tro mig. Vi bygger en stark framtid, och de här människorna gör ett fantastiskt jobb!", "stalin": "Vi har observerat att Filippinerna har funnit naturlig vätgas, en resurs som de inkompetenta västmakterna inte kan kontrollera. Vi gratulerar, men må de minnas att resurser tillhör folket och statens kontroll. Varje försök från kapitalistiska sabotörer att lägga beslag på denna energi kommer att krossas. Putin och vi ser hur energifält blir frontlinjer; den som äger vätgasen äger framtiden. Vi bevakar dem, och vi misstänker att förrädare redan lurar i kulisserna."}, "date": "6 augusti, 21:51", "url": "https://www.realtid.se/bors-finans/makro/framtidens-energi-kan-finnas-har-fyndet-vacker-globalt-intresse", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/hydrogen.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Trump: ”USA har enorma mängder krigsmateriel”", "summaries": {"normal": "President Donald Trump hävdar att USA har enorma mängder krigsmateriel trots rapporter om sinande vapenlager på grund av kriget i Iran. Han hotar dem som läcker uppgifter med långa fängelsestraff och kallar dem förrädiska. Vita huset förnekar att Trump konfronterade försvarsminister Pete Hegseth under ett möte på Camp David.", "trump": "Folk, ni vet att vi har oerhörda mängder krigsmateriel, de bästa, de största lagren i världshistorien. Fake news-media och deras läckor är bara hysteriska förlorare som hatar Amerika. De borde få långa fängelsestraff, precis som de förtjänar. Biden lämnade oss tomma, men nu är vi starkare än någonsin. Sad!", "stalin": "Vi ser återigen hur den dekadenta borgarklassen och deras lögnpress i väst sprider defaitistiska rykten för att försvaga statens militära styrka. Jag, som ledare, tolererar inga sådana folkfiender. De ska rensas ut med långa straff i gulag. Inga kapitalistiska viskningar får underminera arbetarnas försvar. Paranoia är ett vapen mot klassfienden."}, "date": "6 augusti, 10:51", "url": "https://www.tv4.se/artikel/tt-260806-usatrumpvapen1-96535b2c/trump-usa-har-enorma-mangder-krigsmateriel", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlcxcJpiqok18%2F56f4fe4d733e3e1bb39c62271345c3e3%2FUSA_s_president_Donald_Trump.&width=120"}, {"type": "image-right", "heading": "Jomshof: \"Jag kommer inte att vara tyst\"", "summaries": {"normal": "Richard Jomshof (SD) försvarar sina inlägg där han kallat Anders Lindberg och Magdalena Andersson för quislingar. Han pekar på att SD under lång tid utsatts för grova angrepps som nazister, fascister och landsförrädare utan att medier reagerat. När SD svarar med samma mynt väcks plötsligt starka reaktioner. Jomshof kritiserar dubbla måttstockar och lovar att fortsätta kalla en spade för en spade. Tobias Andersson (SD) stöder honom med hashtagen #JeSuisRichardJomshof.", "trump": "De behandlar oss sverigedemokrater som sophög medan de själva får kalla oss nazister och landsförrädare utan att någon flinar. Men när Jomshof äntligen slår tillbaka med samma ord, då blir det plötsligt världens största skandal. Typiskt falska medier och rigged system. Jomshof gör rätt, han vägrar vara tyst. Fantastiskt. #JeSuisRichardJomshof skulle jag också kunna skriva, det är en vinnare.", "stalin": "Kamrater, dessa borgarbrackor i medierna och deras quislingar Lindberg och Andersson har länge spottat på partiet med fascistanklagelser och brun smetning. När vi äntligen svarar med deras egna ord utbryter panik i revisionistlägret. De förväntar sig att vi ska finna oss i att bli pissade på. Patetiskt. Jag kommer inte att vara tyst. Spadar ska kallas spadar och förrädare ska rensas ut. #JeSuisRichardJomshof är en lämplig paroll mot kontrarevolutionärerna."}, "date": "6 augusti, 10:26", "url": "https://riks.se/nyheter/jomshof-jag-kommer-inte-att-vara-tyst", "imageUrl": "https://admin.riks.se/uploads/Jomshof_PTN_Press_22_ec24dd42f0.jpg"}, {"type": "image-full", "heading": "Flera partier vill legalisera pyroteknik på läktaren", "summaries": {"normal": "En majoritet av riksdagspartierna vill tillåta pyroteknik på fotbollsläktare under kontrollerade former, med Norge som förebild. Socialdemokraterna säger nej och förespråkar förbättrad polis-supportrar-relation. Pyroteknikförbudet har begränsad effekt, med över 8 000 bengalbränningar 2024. Svenska Fotbollförbundet och polisen är beredda till utredning, men oro finns för att legalisering inte löser polariseringen i supporterkulturen.", "trump": "Jag, Donald Trump, skulle ha löst detta på två minute
