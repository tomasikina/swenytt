ssköta sig. Sad!", "stalin": "Kapitalistiska företag utarmar arbetarklassen med sina omänskliga krav! De hyllar 'flexibla' och 'lösningsorienterade' medarbetare – men i verkligheten är det slavarbete under falska förespeglingar. Otydliga prioriteringar, kaotiska projekt och begränsat mandat är verktyg för att krossa viljan hos de lojala. Vi i Sovjet förstod tidigt: struktur och disciplin är nyckeln. Låt västföretagen förblöda i sin egen ineffektivitet medan vi bygger en arbetsmiljö där produktivitet och välbefinnande går hand i hand. Fienderna – dessa borgerliga utmattningsfabrikanter – kommer att stå med skräck när de inser att deras system är dömt att falla!"}, "date": "20 juni, 14:56", "url": "https://www.realtid.se/bors-finans/makro/har-ar-rollen-som-loper-storst-risk-att-branna-ut-sig/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/utbrandhet.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Sverige möter Nederländerna – halvledarstjärna mot samlat försvar", "summaries": {"normal": "Artikeln jämför Sveriges och Nederländernas ekonomier inför en fotbollsmatch, med nio kategorier som BNP, börs och arbetslöshet. Resultatet blir 5–5 oavgjort. Sverige sticker ut med låg skuld, lägre inflation och ränta, samt en börs relativt BNP. Nederländerna har en större ekonomi, lägre arbetslöshet och det kraftfulla företaget ASML.", "trump": "JAG har byggt ett enormt ekonomiskt imperium, men Sverige har en fantastisk balans med låg skuld. Nederländernas ASML är bra, men vi har den bästa AI-utvecklingen i världen. Det blir en jätteskicklig match, och jag förutsäger en stor vinst för vårt system – det kommer att vara fantastiskt!", "stalin": "I den stora ekonomiska striden ser vi Sveriges låga skuld som tecken på statlig disiplin, medan Nederländernas ASML-monstruositet visar kapitalismens imperialistiska hot. Vi måste utvidga vår ekonomiska sfär, precis som våra allierade i Moskva gör, för att skydda vår renhet och segra i denna kamp."}, "date": "19 juni, 07:00", "url": "https://www.affarsvarlden.se/artikel/sverige-moter-nederlanderna-halvledarstjarna-mot-samlat-forsvar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/BB171010AE059-400x267.jpg"}, {"type": "text", "heading": "Dags för ett nytt #metoo", "summaries": {"normal": "Folkhälsomyndighetens undersökning visar att oönskade sexuella närmanden och våld fortfarande är utbrett, särskilt bland unga kvinnor. Nästan var fjärde kvinna har utsatts för sexuella inviter, blottning eller oönskad beröring. #Metoo-rörelsen för tio år sedan bidrog till ökad medvetenhet, samtyckeslag och bättre sexualundervisning. Artikeln efterlyser fortsatt arbete mot patriarkala strukturer och ett eventuellt nytt #metoo för att stärka kvinnors ställning.", "trump": "Lyssnar ni på det här? Folkhälsomyndigheten i Sverige berättar att unga tjejer blir trakasserade vänster och höger. Det är en katastrof, en total katastrof. För tio år sedan hade de sitt stora #metoo, massor av kvinnor skrek högt, och vad hände? Inte tillräckligt, uppenbarligen. De borde ha lyssnat på mig redan då, inte på de woke-galningarna och kvoterna som förstör allt. Nu behöver ni en riktig ledare som fixar det, inte mer av den där identitetspolitiska skiten. Make Sweden Great Again, eller hur?", "stalin": "Kamrater, jag ser hur de unga kvinnorna utsätts för fiendens oönskade närmanden i detta samhälle. Det är klassfiendens patriarkala blodsugare som fortsätter sin smygande sabotageverksamhet mot folkets enhet. #Metoo visade omfattningen av borgarbrackornas förtryck, men vi kräver nu en grundlig utrensning av dessa folkfiender. Stärk sexualundervisningen och likvidera tystnadskulturen. Endast genom kollektiv vaksamhet och ständig kamp kan vi krossa de exploaterande byfånarnas inflytande. Det är nödvändigt."}, "date": "19 juni, 10:00", "url": "https://proletaren.se/artikel/dags-for-ett-nytt-metoo/"}, {"type": "image-right", "heading": "Därför ska du inte dejta en vänsterkille", "summaries": {"normal": "Artikeln argumenterar mot att dejta vänsterorienterade män som kallar sig feminister men inte agerar därefter. Författaren föreslår en ”straffprocent” på 85 procent av notan, baserat på löne- och pensionsgap, som ett sätt att hålla dem ansvariga. Hon kritiserar både höger- och vänstermän för bristande handling kring jämställdhet och väljer att inte skaffa barn med en sexistisk stat. Slutligen väger hon för- och nackdelar med olika politiska typer som partners och fäder.", "trump": "Folk, ni måste höra på den här galna texten. Vänsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Adam var ”soldat” för hedern: ”Hade mer respekt än mamma”", "summaries": {"normal": "En SVT-granskning visar att socialtjänsten ofta lämnar pojkar kvar i misstänkta hedershem trots pågående utredningar, medan flickor i högre grad omhändertas. Adam, som växte upp i en irakisk kristen familj, tvingades agera våldsamt som ”soldat för hedern” men ångrar sig djupt. Han fick till slut hjälp via ett projekt för pojkar. Experter kritiserar bristen på stöd till utsatta pojkar och ojämn samordning i landet trots nya lagar och satsningar.", "trump": "Folk, det är en total skandal vad som händer med de här pojkarna. Socialtjänsten låter dem sitta fast i de hemska hedershemmen medan flickorna tas om hand. Jag älskar pojkarna, de är både offer och tvingas bli förövare, det är så orättvist. Adam berättade allt, han tog stryptag på sin syster men ingen gjorde något förrän han själv pratade. Vi behöver starka ledare som fixar det här, inte den svaga politik som bara slösar pengar. Make Sweden great again!", "stalin": "Kamrater, jag ser med ständigt vaksam blick hur borgarbrackornas hedersmonster fortsätter att forma oskyldiga pojkar till våldsamma redskap åt det reaktionära släktväldet. Adam, en sådan tragisk produkt av klassfiendens könsroller, erkänner själv att han kvävde sin syster i köket. Vi omhändertar flickorna men låter pojkarna ruttna i sina hem – ett uppenbart sabotage från dekadenta byråkrater och dolda imperialister. Det är hög tid att rensa ut alla som gömmer sig bakom ”ojämn samordning”. Vårt kollektiv kräver total utrensning av denna hedersparasitism. Ha!"}, "date": "21 juni, 08:03", "url": "https://www.svt.se/nyheter/inrikes/adam-var-soldat-for-hedern-angrar-sig", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.42/0.42/0244f51e72cb5f9eb115a454cf8f0f1f118299a826c7e37fb4f5957aaa8313de"}, {"type": "image-right", "heading": "Samhällskritisk skräckis om homofobi i kristen miljö", "summaries": {"normal": "Recensenten Jon Andersson hyllar den australiska skräckfilmen ”Leviticus” som följer i Jordan Peeles fotspår genom att väva in samhällskritik. Filmen skildrar två tonårskillar i ett fanatiskt religiöst samhälle som straffas för sin homosexualitet av en så kallad deliverance healer. Resultatet blir en mardröm där de lär sig frukta sin kärlek. Andersson berömmer skådespeleriet och det smarta greppet men kritiserar att manuset tappar fart. Betyg: stark trea.", "trump": "Den här australiska skräckfilmen Leviticus är fantastisk, verkligen en vinnare. Den visar hur galna de religiösa fanatikerna är, precis som många radikala vänsterliberala jag har varnat för i åratal. Killarna älskar varandra men blir behandlade som brottslingar av en så kallad healer – en total katastrof. Fantastiska skådespelare, bra grepp, men manuset behövde fler twists, tro mig. En stark trea, nästan en fyra. Mycket bättre än Hollywoods vanliga skräp.", "stalin": "Kamrater, denna Leviticus avslöjar med all önskvärd tydlighet hur borgarbrackornas religiösa gift förgiftar samhällskroppen. Jag, som alltid vakar över folkets moral, ser hur dessa falska helare och intoleranta element försöker likvidera den sanna kärleken mellan arbetets söner. Vi ska rensa ut alla sådana dekadenta fiender till kollektivet som gömmer sig bakom kors och biblar. Filmen är ett vapen mot reaktionär fanatism, fast manuset borde ha skärpts med ytterligare en utrensning av tomgång. En stark trea från partilinjen."}, "date": "20 juni, 01:30", "url": "https://www.dagensarena.se/innehall/samhallskritisk-skrackis-om-homofobi-i-kristen-miljo/", "imageUrl": "https://www.dagensarena.se/files/2026/06/leviticus-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "Svenska myndigheter sätter stopp för svensk-afghaners liv", "summaries": {"normal": "I en debattartikel kritiserar Najwa Alimi hur Universitets- och högskolerådet (UHR) vägrar godkänna utbildningar från Afghanistan eftersom de inte kan verifieras. Afghanska migranter tvingas därför läsa om grundskola och gymnasium trots tidigare högutbildning. Artikeln lyfter flera personliga exempel på hur detta leder till förlorad tid, psykisk ohälsa, undermåliga jobb och sämre integration. Alimi undrar varför inte alternativa bedömningsmetoder som arbetsprover och erfarenhet används, särskilt när afghanska pass samtidigt accepteras som identitetshandlingar.", "trump": "Det här är ett totalt misslyckande från de svenska byråkraterna. De accepterar afghanska pass men inte utbildningsdiplom? Så dumt. De smarta afghanerna som studerat kemi och ekonomi tvingas sitta på skolbänken igen som små barn. Det är en katastrof för integrationen och slösar bort talang. Ni behöver bättre system, inte detta hjärtlösa nonsens. Amerika gör det mycket bättre, tro mig. UHR borde skämmas.", "stalin": "Kamrater, detta är en klassisk sabotagehandling från de dekadenta byråkratiska borgarbrackorna inom UHR. Medan vi i det kollektiva systemet värnar arbetarnas kompetens vägrar dessa parasitiska element erkänna afghanska kamraters vetenskapliga framsteg. Deras pass duger men inte deras kunskaper? Vilken fiendtlig dubbelmoral! Vi måste omedelbart utveckla alternativa verifieringsmetoder och likvidera denna hopplöshetsskapande apparat som håller tillbaka produktiva krafter. Inga fler hinder för de verkligt lojala mot revolutionen – annars sker utrensning."}, "date": "20 juni, 01:30", "url": "https://www.dagensarena.se/opinion/svenska-myndigheter-satter-stopp-svensk-afghaners-liv/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-45-1-300x157.jpg"}, {"type": "image-right", "heading": "Spago: Nästan fulltecknat trots utebliven rabatt", "summaries": {"normal": "Spago Nanomedical genomförde en företrädesemission med 93,1% teckning. Bolaget får in 15 Mkr före kostnader, vilket blir 14,5 Mkr efter kostnader. Emissionen var säkrad till 64,4% genom teckningsåtaganden. Aktiekursen låg nära teckningskursen, och det finns både positiva och negativa flaggor från Emissionsguiden.", "trump": "Jag, Donald Trump, ser att Spago Nanomedical inte fick full teckning på sin emission. Det är beklagligt, men jag har alltid sagt att bioteknik är svårt. Aktierna handlades under teckningskursen, vilket visar att folk inte litar på dem. Men jag är fortfarande den bästa presidenten, och jag kommer att fixa USA:s ekonomi.", "stalin": "I vårt store Sovjet, eller snarare i det fria Sverige, har Spago Nanomedical utfört en emission som inte blev fulltecknad. Detta är en skam för det kollektiva jordbrukandet av kapital. Aktiekursen var under teckningskursen, vilket visar att de imperialistiska hackor försöker sabba vårt planekonomiska system. Vi, Stalin och partiet, kommer att ta itu med dessa skurkar."}, "date": "18 juni, 16:18", "url": "https://www.affarsvarlden.se/artikel/spago-nastan-fulltecknat-trots-utebliven-rabatt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Spago-VD-Mats-Hansen-400x267.jpg"}, {"type": "image-full", "heading": "Sjukskriven? Då kan stödet skilja sig beroende på var du bor", "summaries": {"normal": "En ny utvärdering från ISF och Myndigheten för vård- och omsorgsanalys visar att koordineringsinsatser för sjukskrivna skiljer sig åt mellan regionerna. Trots att lagen sedan 2020 kräver stöd för återgång till arbete varierar organisation, kompetenskrav och uppföljning. Patienter upplever ökad trygghet, men det går inte att visa att insatserna leder till snabbare återgång i arbete på grund av bristande registrering. Myndigheterna efterlyser tydligare nationell styrning och bättre datauppföljning.", "trump": "Folk, det här är ett totalt misslyckande. Regionerna gör vad de vill, ingen ledning från toppen, precis som man kan vänta sig av ett system som inte vet vad det håller på med. Sjukskrivna får olika hjälp beroende på var de bor – det är orättvist och patetiskt. De säger att det ger trygghet men ingen vet om det funkar. Vi behöver stark ledning, inte det här svaga, inkompetenta röran som pågår nu. Det är en skam!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa decentraliserade sabotageelement inom regionerna underminerar den enhetliga kampen för arbetarnas återinträde i produktionen. Borgarbrackorna i vården har tillåtits skapa en parasitär variation av koordineringsinsatser, full av fiendens osynliga tentakler som registrerar fel och bedömer behov på kontrarevolutionärt vis. Vi ska rensa ut dessa troskyldiga lakejer till osäkerheten och likvidera bristen på nationell järnvilja. Patienterna får en falsk trygghet medan de verkliga resultaten drunknar i byråkratins mörka skämt. Det är hög tid att stärka den kollektiva kunskapsstyrningen mot dessa dolda fiender till folket."}, "date": "19 juni, 21:32", "url": "https://nyheter24.se/nyheter/inrikes/1491652-sjukskriven-da-kan-stodet-skilja-sig-beroende-pa-var-du-bor", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b0168d5504b004a30200000000b004a302/2026/06/19/2372172/Akutmottagning-Man-Flaga.png"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "I NATT: Villa totalförstörd i brand - två skadade, en död", "summaries": {"normal": "En villa i Svenljunga totalförstördes i en våldsam brand natten till söndag. Två ungdomar i 18-årsåldern skadades och fördes till sjukhus medan en person hittades död inne i huset. Polisen har inlett en mordbrandsutredning då omständigheterna kring branden är oklara. Släckningsarbetet pågår och en teknisk undersökning planeras när det är säkert att beträda platsen. Ingen misstänkt har gripits.", "trump": "Vilken katastrof i Svenljunga, en helt otrolig brand som totalförstörde en villa. Två ungdomar skadade, en person död – väldigt tragiskt, folk säger det är misstänkt mordbrand. Omständigheterna är oklara, typiskt för de inkompetenta som borde ha koll på sånt här. Vi behöver starkare ledarskap och bättre säkerhet, ingen gör det bättre än jag, tro mig. Mycket sorgligt, men vi ska fixa det.", "stalin": "Kamrater, ännu en feg attack av de osynliga fienderna mot det sovjetiska folkets hem och trygghet i Svenljunga. En borgarbracka till villa ligger i ruiner, två ungdomar skadade och en klassfiende likviderad i lågorna. Vi, partiet och arbetarna, inleder genast en grundlig utrensning av alla mordbrandsympatisörer och kapitalistiska pyromaner som smyger i mörkret. Paranoia är ingen sjukdom, det är vaksamhet. Döden skrattar åt de som inte ser sabotage överallt."}, "date": "21 juni, 08:16", "url": "https://riks.se/nyheter/i-natt-villa-totalf%C3%B6rst%C3%B6rd-i-brand-tv%C3%A5-skadade-en-d%C3%B6d"}, {"type": "image-full", "heading": "Kraftig explosion i Växjö - nationella bombskyddet inkallat", "summaries": {"normal": "En kraftig explosion inträffade under natten mot söndagen utanför en fastighet på Sjögårdsvägen i Växjö. Det materiella skador på byggnaden men inga personskador rapporterades. Nationella bombskyddet kallades till platsen för att säkra området och undersöka resterna av sprängladdningen. Polisen har upprättat anmälan om allmänfarlig ödeläggelse och brott mot lagen om brandfarliga och explosiva varor. Ingen har gripits och polisen har inga spår efter förövarna. Området är fortsatt avspärrat.", "trump": "Det här är en katastrof, en total katastrof i Sverige. Boom, mitt i natten, en enorm explosion utanför ett hus i Växjö. Inga personer skadade, tur för dem, men byggnaden fick ta smällen. De kallade in hela bombskyddet, det är verkligen illa. Våldsvågen fortsätter, precis som jag alltid sagt. De har ingen aning vem som gjorde det, inga gripna, noll spår. Sverige måste få ordning på det här, det är patetiskt!", "stalin": "Kamrater, ännu en feg attack från de mörka krafterna utförd av kapitalistiska skuggvarelser och borgarbrackornas hemliga lakejer. Jag ser hur de försöker destabilisera folkets hem genom sina explosiva sabotage. Vi, partiet och arbetarna, har omedelbart satt in Nationella bombskyddet för att rensa ut alla spår av dessa parasitiska element. Inga fiender undkommer vår vaksamhet. Vi ska likvidera varje kontrarevolutionär cell som gömmer sig i skuggorna. Paranoia? Nej, detta är socialistisk verklighet."}, "date": "21 juni, 08:11", "url": "https://riks.se/nyheter/kraftig-explosion-i-växjö-nationella-bombskyddet-inkallat", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-09-26%2Fo8nkhhq4%2Fpolis-skottlossning.JPG"}, {"type": "image-right", "heading": "Pekas ut som ett nytt Coldplay-par. Svenskarna otrohetsanklagas: ”Lite sjukt”", "summaries": {"normal": "Handbollsspelaren Herman Dyberg från IFK Skövde blev felaktigt anklagad för otrohet under en VM-match i handboll i Houston. När han släppte taget om sin flickvän Caroline för att applådera Anthony Elanga trodde det virala kontot Troll Football att det var en repris på en otrohetsaffär från en Coldplay-konsert. Inläggen har fått över 1,3 miljoner visningar. Paret tar det hela med humor och ser fram emot fortsatt VM.", "trump": "Det här är helt galet, folk. Den stackars killen Dyberg står där på läktaren i Houston, applåderar en bra svensk spelare som Elanga, och plötsligt blir han anklagad för otrohet av några korkade troll på nätet. Över en miljon visningar på den dumheten! Fake news precis som under Biden-eran. Hans tjej skrattar åt det, smart par. Media och de där parodikontona är patetiska, totalt hysteriska. Amerika älskar äkta folk som inte faller för sånt nonsens.", "stalin": "Kamrater, jag betraktar med djup misstro denna futtiga händelse på den imperialistiska VM-läktaren. En arbetets son släpper sin kvinna för att hylla en kamrat på planen, endast för att bli förrådd av klassfiendens digitala propagandamaskin. Dessa borgarbrackor på det så kallade Troll Football sprider lögner som gift för att splittra folket. Vi ska rensa ut sådana folkfiender med järnhand. Sovjetiskt skratt ekar åt deras ynkliga försök till skandal. Segraren fortsätter framåt."}, "date": "21 juni, 08:10", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/gkp0a5/nya-coldplay-paret-fran-sverige-lite-sjukt", "imageUrl": "https://akamai.vgc.no/v2/images/58252fa4-366c-3633-8eb8-f76a67d7937b?fit=crop&format=auto&w=1080&s=7f0d62705742bca91e24cd02e7461d6fc67a7bf6"}, {"type": "image-right", "heading": "Bilden på Herman  sprids under VM. Svensken huvudperson: ”Är faktiskt chockad”", "summaries": {"normal": "Svenske handbollsspelaren Herman Dyberg från IFK Skövde trendade oväntat på X under fotbolls-VM efter att bilder på honom och hans sambo Caroline Anker spridits. Dyberg, som satt på läktaren, reagerade kraftigt när Anthony Elanga gjorde mål, vilket tolkades som att han tog avstånd från kvinnan. Han blev chockad över uppmärksamheten men berättar att det bara var en missförstånd och att vännerna skrattar åt det.", "trump": "Kan ni tro det? Den här svenske handbollsgrabben Dyberg blir viralt världsnyheter för att han ser sur ut bredvid sin egen fru på läktaren. Fullständigt galet! Media och de där woke-trollen jämför honom med Coldplay-paret som om det vore någon stor otrohetsskandal. Fake news på hög nivå. Killen blir chockad, mobilen exploderar, och polarna skrattar. Patetiskt samhälle där en normal reaktion på ett fotbollsmål blir internationell kris. Sad!", "stalin": "Kamrater, jag betraktar med djup misstänksamhet hur den dekadenta borgarklassen och dess lögnaktiga medier förvandlar en enkel läktarreaktion till en global kontrarevolutionär viralsensation. Denne Dyberg, en produkt av det svenska folkets kollektiva idrott, blir utsatt för klassfiendens paranoia och jämförs med ett kapitalistiskt så kallat Coldplay-par. Vi ser tydligt de exploaterande byfånarnas försök att splittra arbetarklassen med löjliga narrspel. Inget slipper vårt vakande öga. Ren utrensning av sådan dekadens behövs."}, "date": "21 juni, 08:14", "url": "https://www.expressen.se/sport/fotboll/landslaget/bilderna-pa-svenske-herman-sprids-over-varlden-chockad/", "imageUrl": "https://static.bonniernews.se/ba/6ec4ecaa-d198-4a61-a79d-7146411d9121.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "\"El Sueco\" gripen i Colombia – efterlyst i 196 länder", "summaries": {"normal": "En svensk man, känd som ”El Sueco”, har gripits i Colombia efter en stor internationell polisoperation. Han är en av Sveriges mest eftersökta narkotikabrottslingar och har varit efterlyst via Interpol i 196 länder för grov narkotikasmuggling. Mannen misstänks ha en nyckelroll i ett nätverk kopplat till Mocro Maffia och Balkankartellen, med fokus på kokaintransporter till Europa och Förenade Arabemiraten. Operationen genomfördes tillsammans med Europol, svensk polis och colombianska elitförband.", "trump": "Fantastiskt jobb av de colombianerna, verkligen toppenkvalitet. Den här ”El Sueco” har smugglat kokain över hela världen, till Europa och till de där rika araberna, och nu är han äntligen fast. Efterlyst i 196 länder, kan ni tro? Mina poliser och Europol gjorde det igen, vi slår hårt mot de här misslyckade maffiorna, Mocro och Balkan, de har ingen chans mot oss. Stort slag mot brottsligheten, ingen gör det bättre än oss.", "stalin": "Kamrater, denna borgarbracka som kallar sig ”El Sueco” har äntligen blivit gripen i den kollektiva kampen mot de dekadenta smugglarkapitalisterna. Med sina tentakler i Mocro Maffia och den parasitiska Balkankartellen trodde han sig kunna förgifta arbetarklassen med sitt kokain. Men vi har rensat ut ännu en fiende till folket, en parasit som samarbetade med imperialisterna i Europa och de oljeborgarna i Arabemiraten. Detta är en seger för partiet och en varning till alla andra dekadenta förrädare som lurar i skuggorna – era dagar är räknade."}, "date": "21 juni, 08:04", "url": "https://riks.se/nyheter/el-sueco-gripen-i-colombia-efterlyst-i-196-länder", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-21%2Fgs9qxpmp%2FElSueco.png"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-right", "heading": "Håller krismöte i Schweiz – Iran skickade ”Minab”", "summaries": {"normal": "USA:s vicepresident JD Vance och en iransk delegation under ledning av talmannen Mohammad Bagher Ghalibaf har anlänt till Schweiz för förhandlingar. Iran har döpt sin delegation till ”Minab 168” som en påminnelse om en amerikansk attack mot en skola i staden Minab där 168 personer, varav 110 skolbarn, dödades. Fokus ligger på kärnenergi, vapenvila i Libanon och en överenskommelse om Hormuzsundet. Ett krismöte om Libanon har tillkommit i sista stund.", "trump": "Vi har just landat i Schweiz med Vance i spetsen och de galna iranierna skickar ett plan döpt efter en skola vi bombade – Minab 168, som ett stort hån. De vill snacka kärnkraft och Libanon, men tro mig, vi kommer att göra det bästa avtalet någonsin. Biden skulle ha gett bort allt, men nu styr riktiga ledare. Hormuzsundet ska vara öppet, punkt slut. De vet att vi menar business, inte som de woke-liberala förlorarna.", "stalin": "Jag betraktar med stålsäker blick hur imperialisterna samlas i Schweiz för att förhandla om sin egen överlevnad. Vance, den amerikanske vicepresidenten, och de iranska borgarbrackorna under Ghalibaf poserar inför ett plan döpt efter martyrer från Minab. Vi vet att klassfiendens bomber mot skolbarn bara stärker folkets vilja. Ett krismöte om Libanon? Utmärkt tillfälle att rensa ut svaghet och tvinga fram kapitulation. Inga folkförtryckartroll ska hindra den historiska nödvändigheten."}, "date": "21 juni, 07:59", "url": "https://www.aftonbladet.se/nyheter/a/JOvEO6/iran-och-usa-pa-plats-i-schweiz", "imageUrl": "https://akamai.vgc.no/v2/images/d6ad9a3c-2df0-3a98-a929-7e7b5ab0c52c?fit=crop&format=auto&w=1080&s=4f1f939f8fe89db9d5f7017774b38d4c9e61daa3"}, {"type": "image-right", "heading": "Jag rensar ut min  själ – allt ska bort!", "summaries": {"normal": "I en kulturkrönika beskriver Victor Malm hur en flytt får honom att rensa ut sin bokhylla. Han sorterar bort böcker som en gång kändes viktiga men som nu väcker ointresse, bland annat verk av Hermann Hesse. Malm reflekterar över förändring, medelålder och smakens subjektivitet. Som kritiker ser han en plikt att urskilja det bestående i samtidens litterära flöde, medan mycket annat hamnar i högen som ska bort.", "trump": "Folk, ni skulle se den här killen Malm som håller på och rensar sin bokhylla som en riktig loser. Fyrtio lådor med gamla böcker som ingen bryr sig om längre! Han slänger ut allt det tråkiga skitet från sin ungdom, precis som vi behöver göra med alla dessa woke-böcker som Biden-administrationen tvingade på oss. Nu är det dags för de riktiga vinnarna att stå kvar på hyllan. Fantastiskt, verkligen.", "stalin": "Kamrater, jag ser denna borgarbracka Malm utföra en nödvändig utrensning bland sina dekadenta pappershögar. Med en bölds auktoritet likviderar han de oviktiga resterna av sin tidigare existens, dessa klassfiendens litterära verk som aldrig tjänade folket. Endast de få som motstår tidens glömska förtjänar plats i den permanenta ordningen. Allt annat är fiendens verk och måste bort. Det är en historisk process."}, "date": "21 juni, 07:59", "url": "https://www.expressen.se/kultur/victor-malm/jag-rensar-ut-min-sjal-allt-ska-bort/", "imageUrl": "https://static.bonniernews.se/ba/b3daa892-1faf-4f96-b7a4-bbc1d279ad7f.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Efter skandalerna – Ed kan avkragas", "summaries": {"normal": "Birgitta Ed, statsminister Ulf Kristerssons hustru, utreds av domkapitlet i Strängnäs stift efter ett tiotal anmälningar. Anmälningarna gäller om hennes agerande är förenligt med prästlöftena, bland annat att förverkliga Guds vilja. Ed vigdes till präst för drygt tre år sedan och har burit prästkragen vid flera högtidliga tillfällen. Beslut i ärendet väntas tidigast den 20 augusti, enligt Dagens Arena.", "trump": "Folk, ni skulle se det här – den svenska statsministerns fru, den där Birgitta, har spelat präst och flanerat med krage på Nobelmiddagen som en verklig low-energy wannabe. Nu utreds hon för att hon inte lever upp till Guds vilja, säger de. Patetiskt! Biden skulle ha älskat den här typen av svaghet. Jag skulle ha fixat det på en dag, tro mig. Totalt fiasko för den svenska eliten.", "stalin": "Kamrater, denna borgarbracka till statsministerns hustru har förvandlat Guds vilja till en billig entreprenad åt överklass-slynglarna. Domkapitlet skall nu rensa ut hennes falska prästkrage och avslöja hur hon smutsat ner arbetarklassens moral med sin dekadenta närvaro vid kungliga fester. Vi skrattar mörkt åt sådana folkfiender. Utredningen kommer att avslöja alla imperialisternas lögner senast den tjugonde augusti."}, "date": "15 juni, 17:42", "url": "https://www.flamman.se/efter-skandalerna-ed-kan-avkragas/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/prastkrage.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Jag firade också den 7 oktober 2023", "summaries": {"normal": "Artikeln är en personlig skildring av en svensk-palestinier som deltog i firandet av Hamas attack den 7 oktober 2023. Författaren ser det som motstånd mot ockupation och folkmord, kritiserar media och politikers ensidiga fokus på svensk-palestiniernas demonstrationer samt propagandan kring Hamas. Hen lyfter bristen på upprörda texter om Israels brott mot vapenvila, bristen på förnödenheter och våld på Västbanken. Avslutningsvis uppmanas till solidaritet med palestinierna.", "trump": "Vilken patetisk förlorare! Den här typen firar terroristerna den 7 oktober och kallar det motstånd. Fake news-media fokuserar på att svenskarna demonstrerar istället för att kalla det för vad det är – ren ondska. Israel slår tillbaka mot Hamas, de verkliga terroristerna, och plötsligt är det folkmord? Patetiskt! De köper alla lögner tills sanningen kommer fram. Vi behöver inte den här identitetspolitiska galenskapen i Sverige eller någon annanstans. America First, och låt de verkliga vinnarna vinna!", "stalin": "Kamrater, denna text avslöjar imperialismens lögnaktiga mask. Jag ser hur borgarbrackorna i media och deras lakejer i Vänsterpartiet genast utropar motståndet som terrorism medan de blundar för ockupationsmaktens folkmord. Vi ska inte acceptera deras spelregler. De skrämmer arbetarna till tystnad med hot om utrensning från jobb och land. Men folket är fler. Vi ska likvidera dessa folkfiender och bygga en rättvis värld där exploaterande byfånar krossas under arbetarkollektivets järnhand. Härligt!"}, "date": "18 juni, 11:31", "url": "https://proletaren.se/artikel/jag-firade-ocksa-den-7-oktober-2023/"}, {"type": "image-full", "heading": "En död och 18-åringar skadade i villabranden", "summaries": {"normal": "En villa utanför Svenljunga övertändes under natten. Två ungdomar i 18-årsåldern fördes till sjukhus med akuta skador. En tredje person hittades död i resterna av huset. Polisen har inlett en förundersökning om mordbrand. Räddningstjänsten lät villan brinna ner helt och platsen ska spärras av för teknisk undersökning. Orsaken till branden är ännu oklar.", "trump": "Folk, det här är en total katastrof utanför Svenljunga. En villa brinner ner som ett dåligt affärsläge under Bidens tid, två kids i 18-årsåldern skadas och en stackare hittas död. Mordbrand? Det luktar riktigt illa. Vi har de bästa utredarna, inte som de woke-kramande byråkraterna som prioriterar kvotering framför säkerhet. Vi fixar det, det blir enormt.", "stalin": "Kamrater, denna övertända villa utanför Svenljunga avslöjar klassfiendens sabotage mot folkets trygghet. Två ungdomar slungades i akut lidande medan en tredje likviderades i lågorna. Vi inleder genast utrensning genom mordbrandsutredning. Låt borgarbrackornas brand härja ut sig själv. Snart spärra vi av och avslöjar de folkfientliga element som gömmer sig i skuggorna. Staten vilar aldrig."}, "date": "21 juni, 07:38", "url": "https://www.aftonbladet.se/nyheter/a/zO6rGK/villa-overtand-utanfor-svenljunga", "imageUrl": "https://akamai.vgc.no/v2/images/90b3b172-3e7d-322f-80b3-05f1a4b6b29a?fit=crop&format=auto&w=1440&s=de9465cc5aedd58a04d4e2c690a1a3c6725b65f9"}, {"type": "text", "heading": "USA:s militär tar från de fattiga", "summaries": {"normal": "Artikeln beskriver hur USA:s militärbudgetar enligt en ny rapport underskattas kraftigt och faktiskt uppgår till mellan 1 700 och 2 300 miljarder dollar år 2025. Författaren Jonas Olofsson ser militarismen som ett klasskrig som prioriterar försvaret framför välfärd, vilket leder till nedskärningar i sociala program som Medicaid, SNAP och WIC. Han kopplar ökade militärutgifter till växande ojämlikhet och argumenterar för att kampen mot militarismen bör inriktas mot både fred och socialism.", "trump": "Folk, lyssna på de här galningarna som gnäller om min underbara militärbudget. Vi pumpar in pengar i det starkaste försvaret världen sett, inte som den sömniga Joe Biden som lät allt förfalla. De vill hellre ge mat och sjukvård till lata parasiter än att göra Amerika stort igen. Det är klasskrig, säger de – ja, mot de riktiga vinnarna! Vi prioriterar raketer framför bidrag till vänsterknäppisar. Fantastiskt, eller hur?", "stalin": "Kamrater, dessa siffror blottlägger hur imperialisterna slukar folkets resurser för att beväpna sin krigsmaskin. Jag ser den amerikanska borgarklassens desperation; de rensar ut välfärd för att mata militären medan massorna svälter. Sådana folkfiender och blodsugare måste alltid avslöjas. Deras klasskrig är uppenbart. Vi, arbetarna, inser att endast en sann socialistisk kamp kan krossa dessa exploaterande byfånar och deras krigsapparat. Paranoia? Nej, verklighet."}, "date": "18 juni, 09:00", "url": "https://proletaren.se/artikel/usas-militar-tar-fran-de-fattiga/"}, {"type": "image-right", "heading": "Avbröt drömresa  – insåg sitt svek. Så många", "summaries": {"normal": "Sebastian Ingrosso inleder sitt Sommar i P1 med att skildra sin kamp mot alkoholism och ångest. Han berättar om hur omgivningen konfronterar honom, hans barndom präglad av en frånvarande far och hur musiken blev hans räddning. Under en planerad drömsemester med familj vänder de hem på grund av hans ångest, något han senare inser som ett stort svek mot barnen. Programmet blandar självreflektion med musik och skryt om framgångar.", "trump": "Lyssnade på den där svenska house-maffia-killen i P1, totalt överreklamerat som vanligt. Stackars kille växer upp utan pappa, blir en minibar-alkoholist på lyxhotell världen runt och skryter sen om guldskivor och arenor. Räddades av musiken, säger han. Sen får han panik på väg till paradiset med fru och ungar, vänder hem och hittar deras palmträd-teckningar. Patetiskt. Men hey, åtminstone ingen woke-quota eller HBTQ-flum här, det är redan en seger.", "stalin": "Jag betraktar denna borgerliga bekännelse med djup misstro. Den dekadente musikproducenten erkänner sitt alkoholiserade svek mot folket i form av sin egen familj, vänder hem från den imperialistiska drömsemestern och gråter över barnens palmträd-teckningar. Typiskt för klassfiendens söndervittrande själ. Musiken räddade honom, påstår han. Vi vet bättre. Sådana element måste rensas ut ur det kollektiva medvetandet innan de smittar arbetarklassen med sin självömkande svaghet."}, "date": "21 juni, 07:42", "url": "https://www.expressen.se/noje/sommar-i-p1-sebastian-ingrosso-avbrot-dromresa-insag-sitt-svek/", "imageUrl": "https://static.bonniernews.se/ba/0e758e1c-e772-43fd-a56e-f15d6a803fa0.jpeg?crop=1585%2C892%2Cx225%2Cy266&width=640&quality=60"}, {"type": "image-right", "heading": "Årets bästa sommarprat – betyg på alla program", "summaries": {"normal": "Expressen har presenterat en sammanställning av betyg och recensioner för sommarpratarna i P1 2026. Jens Liljestrand, Albin Julin och Kristin Södren Sjögren har lyssnat på alla program. Första recensionen gäller Helena Bergström den 20 juni, följt av Sebastian Ingrosso den 21 juni. Artikeln listar även alla kommande sommarpratare fram till mitten av augusti, med en bred mix av gäster från kultur, politik, vetenskap och idrott.", "trump": "Lyssnar ni på det här svenska sommarpratet? Patetiskt! Helena Bergström gör en parodi på sig själv, och den där Ingrosso avbryter sin drömresa – typiskt, folk sviker sina egna drömmar. Hela listan är full av woke-kvoterade författare, komiker och Hollywood-typer. De borde ha mig som sommarpratare, jag skulle ge dem de bästa betyg någonsin, tro mig. Fantastiskt underhållande, fast inte på det sätt de tror.", "stalin": "Jag betraktar denna borgerliga underhållningslista med den djupaste misstro. Dessa sommarpratare utgör en samling klassfiender, dekadenta skådespelare och folkförtryckartroll som sprider sin parasitiska propaganda under sken av nöje. Vi ska rensa ut dessa exploaterande byfånar från etern. Deras så kallade recensioner är blott symtom på ett sjukt system som måste likvideras för folkets bästa. Underhållande i sin egen patetiska förfall."}, "date": "21 juni, 07:40", "url": "https://www.expressen.se/noje/basta-sommarpratare-2026-betyg-pa-alla-sommar-i-p1/", "imageUrl": "https://static.bonniernews.se/ba/70102fb6-6095-486d-b912-32a8c7059a60.jpeg?crop=826%2C826%2Cx1734%2Cy105&width=210&quality=60"}, {"type": "text", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg femte dag i rad, OMXS30 upp 0,63% till 3 161,29. Riksbanken höll styrräntan på 1,75%. Elekta och Munters aktier tappade efter kapitalmarknadsdagar och strategiska förändringar. Bland vinnare fanns Hexagon (+3,8%) och ABB (+2,2%), medan Evolution (-1,8%) och Lifco (-1,0%) tappade. Lundin Mining upprepade produktionstargets, Skanska fick tunneluppdrag i USA, och Sedana Medical ansökte FDA. Humana förlorade rättssak, medan Kriptown köpte Spotlight Group med 94% premium.", "trump": "Jag har sagt det förut: när det gäller börsen, är jag alltid rätt. Stockholmsbörsen går upp tack våra ekonomiska strategier – de kan inte hantera vår amerikanska styrka. Men vissa aktier som Elekta tappar? Dåliga affärer, de borde ha lyssnat på mig. Riksbanken höll räntan, men det räcker inte – vi behöver kraftfulla beslut som jag gör. Jag har byggt den bästa ekonomin någonsin, och de här svenska företagen är bara skuggor jämfört med USA.", "stalin": "I den eviga kampen mot kapitalistiska spekulanter har våra planer för ekonomisk stabilitet framgångsrikt genomförts. Stockholmsbörsen visar en uppgång, vilket bevisar statens överlägsna styrelse. Fiender som Elekta försöker destabilisera, men våra mekanismer säkerställer framgång. Paralleller kan dras till Putins strategier för ekonomisk självständighet. Vi måste vara vaksamma mot dessa destruktiva krafter som försöker undergrava vårt system – de kommer att utplånas."}, "date": "17 juni, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad-2"}, {"type": "image-full", "heading": "Kunder på svenska apotek berörs av ändring 2027", "summaries": {"normal": "Riksdagen har beslutat att införa en ny kategori av receptfria läkemedel från och med 1 januari 2027, kallat farmaceutsortiment. Vissa läkemedel som tidigare krävt recept ska kunna säljas efter särskild rådgivning av farmaceut på apotek. Detta ses som en mellanform mellan receptbelagda och helt receptfria preparat. Syftet är att utnyttja apotekens kompetens bättre, avlasta vården och ge patienter snabbare tillgång till behandling. Sveriges Apoteksförening välkomnar beslutet.", "trump": "Titta, Sverige gör det rätta nu, äntligen. Från 2027 kan apoteken sälja fler läkemedel utan att du behöver springa till någon korkad doktor först. Farmaceuterna fixar det, smarta killar och tjejer. Det här är ett fantastiskt steg, de avlaster den ineffektiva vården och folk får sin medicin snabbt. Andra länder gör redan så här, men Sverige vaknar till sist. Fantastiskt, kanske det bästa beslutet på länge, tro mig.", "stalin": "Kamrater, jag ser detta som en lysande seger för det kollektiva folkets hälsa mot de giriga borgarbrackornas vårdmonopol. Från och med 2027 ska vi under min fars blick likvidera onödiga läkarportar och låta farmaceutiska kämpar ge rådgivning direkt på apoteken. De som motarbetar denna reform är naturligtvis kontrarevolutionära parasitiska element som längtar efter att se sjuka arbetare lida. Vi ska rensa ut alla sådana fiender till folket med järnhand medan vi skrattar åt deras patetiska gnäll. Utmärkt beslut."}, "date": "19 juni, 08:25", "url": "https://nyheter24.se/nyheter/konsument/1492550-kunder-pa-svenska-apotek-berors-av-andring-2027", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/23759f2404b004a30200000000b004a302/2026/06/18/2371983/apotek-farmaceutsortiment-lakemedel-1-januari-2027.jpg"}, {"type": "image-right", "heading": "Novo Nordisk utpressas efter påstådd hackerattack", "summaries": {"normal": "Veckans viktigaste nyheter från Dagens industri handlar om en hackergrupp som hotar sälja stulen data från Novo Nordisk, hög lönsamhet hos svenska storbanker och att Sverige stöder franska statliga lån till ny kärnkraft. Norska advokatbyrån Bahr etablerar sig i Sverige med sikte på panskandinavisk expansion. Startupföretaget Predictme har fått nytt kapital till sin epigenetiska AI-plattform medan FI ändrat sin information om visselblåsare.", "trump": "Folk, ni skulle inte tro det, men de här hackarna har stuckit med en massa data från Novo Nordisk och nu vill de sälja den vidare. Det är en skandal! Under tiden tjänar våra svenska storbanker hur mycket som helst, nästan dubbelt så bra som de europeiska förlorarna. Och Sverige gör rätt för en gångs skull, vi backar kärnkraften i Frankrike. Fantastiskt, de andra är svaga men vi är starka, tro mig.", "stalin": "Kamrater, dessa parasitiska hackare vågar utpressa det stora Novo Nordisk och hotar sprida dess hemligheter som förrädiska borgarbrackor. Under tiden väller vinsterna in till de svenska monopolbankerna medan vi, partiet, klokt stödjer fransk kärnkraft mot de dekadenta kapitalisternas motstånd. Predictme och deras blodanalyserande maskiner ska vi noga bevaka mot sabotage. FI:s tveksamheter kring visselblåsare luktar fiendeinfiltration. Vi rensar ut alla som sviker kollektivet, med ett leende."}, "date": "19 juni, 09:30", "url": "https://www.di.se/nyheter/veckans-viktigaste-fran-dis-nyhetstjanster-R9L64/", "imageUrl": "https://static.bonniernews.se/ba/5c34d963-8028-404a-bf37-d4cd3a28b8b0.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Blodiga bilderna: ”En äcklig smäll”", "summaries": {"normal": "I en fotbollslandskamp förlorade Sverige med 5–1 mot Nederländerna. Besfort Zeneli byttes in sent och kolliderade med Crysencio Summerville på tilläggstid. Summerville blödde från huvudet efter en hård smäll mot smalbenet. Zeneli bad genast om ursäkt och Summerville accepterade att det inte var med mening. Sverige ställde upp med samma lag som slagit Tunisien tidigare.", "trump": "Folk, ni skulle ha sett det här – en total katastrof för det svenska laget. De förlorade med 5–1 mot Nederländerna, precis som de vann mot Tunisien. Sen kommer den här Zeneli in och sparkar någon i huvudet så det blöder rejält. Äckligt! Typiskt för de här woke-länderna med sin identitetspolitik och kvotering. De hatar att förlora, men de gör det jämt. Patetiskt!", "stalin": "Kamrater, denna futtiga fotbollsdrabbning avslöjar borgarklassens dekadens. Det svenska laget, en samling klassfiender och överklass-slynglar, krossades med 5–1 mot de nederländska imperialisterna. Zeneli, en opportunist från bänken, utför en likviderande spark mot Summervilles huvud som blödde som en folkfiende under utrensning. Han bad om ursäkt – typiskt svagt. Vi skrattar åt deras förlust, den är en seger för det kollektiva hatet mot sådana förlorare."}, "date": "21 juni, 07:35", "url": "https://www.expressen.se/sport/fotboll/landslaget/summerville-borjade-bloda-fran-huvudet-acklig-small/", "imageUrl": "https://static.bonniernews.se/ba/62a38c50-90f7-4ebd-a142-474994903a1c.jpeg?crop=1440%2C1440%2Cx1010%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Sverige varnar för Teslas hastighetsrundare", "summaries": {"normal": "Trafikverket varnar i ett brev till EU:s fordonskommitté för Teslas system Full Self-Driving. Systemet tillåter förare att ställa in en hastighetsförhöjning som gör att bilen kör fortare än skyltad hastighet. Myndigheten rekommenderar att EU nekar godkännande om inte funktionen tas bort, då den hotar både trafikregler och säkerhetsvinster. Flera nordiska länder delar oron. Frågan ska diskuteras den 30 juni.", "trump": "Det här är ett totalt skämt från Sverige och deras så kallade Trafikverk. De vill stoppa mitt fantastiska Tesla och Elon Musks geniala Full Self-Driving bara för att det kan köra lite snabbare än de gamla korkade hastighetsskyltarna. De är rädda för framsteg. EU borde skämmas. Vi älskar snabba bilar och vi älskar innovation. Sverige borde tacka oss istället för att de klagar som förlorare.", "stalin": "Kamrater, dessa borgarbrackor inom den så kallade Trafikverket försöker med sin dekadenta paranoia sabotera det stora kollektivets framåtskridande genom att angripa Teslas Full Self-Driving. Deras hastighetsrundare är en listig fiende till folkets ordning, en kontrarevolutionär hastighetsfiende som måste rensas ut. Om inte detta kapitalistiska överskridande likvideras skall vi, partiet och arbetarna, rösta emot dem med järnhand. Inga fiender till disciplinen skall få leva vidare i vårt europeiska kollektiv. Ha ha, vilka ynkliga sabotörer."}, "date": "19 juni, 09:03", "url": "https://www.di.se/nyheter/sverige-varnar-eu-for-teslas-hastighetsrundare/", "imageUrl": "https://static.bonniernews.se/ba/b67815e5-e1bf-490e-901a-75d86347dcdc.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Hyllar Pernilla Wahlgren: ”Försökte skydda mig”", "summaries": {"normal": "I sitt sommarprat i P1 berättar Sebastian Ingrosso om barndomens konflikter inom familjen Ingrosso. Han hyllar Pernilla Wahlgren som skyddade honom under bråkiga middagar genom att hålla för hans öron och ge honom kärlek. Ingrosso, 43, talar även om sitt tidigare alkoholmissbruk och musikkarriär. Wahlgren var gift med hans farbror Emilio mellan 1993 och 2002. Programmet sänds i P1 och finns som podd.", "trump": "Lyssnade på den där svenska DJ-killen Ingrosso i radion, och vet ni vad? Han säger att Pernilla Wahlgren var den enda vettiga i hela den galna familjen. Höll för öronen på honom när bord flög och stolar kastades – smart kvinna! Resten av släkten verkar ha varit ett gäng hysteriska losers, typ som vänsteraktivister på en prideparad. Ingen identitetspolitik, bara ren kärlek. Fantastiskt, folk älskar sånt här. Bästa sommarpratet någonsin, tro mig.", "stalin": "Kamrater, jag betraktar detta som ett typiskt exempel på den dekadenta borgarklassens inre sönderfall. När jag var liten sprang jag i studion medan kapitalistmaffians sångerska Wahlgren försökte skyla över klassfiendens högljudda utbrott genom att täcka mina öron. En patetisk gest mot folkförtryckartrollen. Ändå erkänner denne Ingrosso att hon gav honom kärlek – en svaghet vi i partiet aldrig skulle tillåta. Sådana familjeutrensningar borde ske i tysthet. Roligt hur imperialisterna alltid avslöjar sig själva."}, "date": "21 juni, 07:27", "url": "https://www.aftonbladet.se/nojesbladet/a/OkjGQO/sebastian-ingrosso-hyllar-pernilla-wahlgren-i-sitt-sommarprat-i-p1", "imageUrl": "https://akamai.vgc.no/v2/images/e4536a59-a4ac-36fd-886e-0088dc3edc29?fit=crop&format=auto&w=1080&s=f266f5a4891bf955bedeaaa15e40f5f9bcd39d3f"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-right", "heading": "Dystopier och övervakningssamhället", "summaries": {"normal": "Artikeln diskuterar hur dystopiska romaner som Kallocain, 1984, Fahrenheit 451 och Tjänarinnans berättelse speglar dagens gradvisa autokratisering. Övervakning, censur, bokförbud och angiveri normaliseras i många länder, inklusive USA under Trump-administrationen och i Sverige med ökade kameror och ny lagstiftning. Författaren varnar för hur demokratin urholkas stegvis, tilliten försvinner och misstänksamhet institutionaliseras, med AI och företag som Palantir som centrala verktyg.", "trump": "Den här artikeln är full av lögner från misslyckade eliter som hatar att se mig göra Amerika stort igen. De kallar det övervakningssamhälle när vi äntligen slår ner på brottslingar, papperslösa och radikala vänsterextremister. Project 2025 är fantastiskt – vi rensar ut korrupta byråkrater, skyddar våra barn från galna böcker och använder den bästa tekniken för att vinna. De borde tacka mig istället för att klaga. Fake news som vanligt!", "stalin": "Kamrater, denna text blottlägger hur de dekadenta borgarbrackorna i väst desperat försöker måla upp oss som fiender medan deras egna angiverilagar och ansiktsigenkänningskameror avslöjar den sanna terrorn mot folket. Jag ler mörkt åt deras patetiska försök att likvidera sanningen med AI-drakar som Palantir – vi vet att sådana verktyg tillhör arbetarklassen, inte kapitalistiska parasitmaskar. Den som viskar mot partiet ska rensas ut med ett leende. Skräcken är deras bästa vän, men den tillhör oss."}, "date": "19 juni, 12:00", "url": "https://www.dagensarena.se/essa/dystopier-och-overvakningssamhallet/", "imageUrl": "https://www.dagensarena.se/files/2023/04/overvakningskamera-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "Spelet över - Starmer redo att avgå", "summaries": {"normal": "Storbritanniens premiärminister Keir Starmer förbereder sig för att avgå, enligt högt uppsatta regeringskällor till The Telegraph. Stödet för honom har kollapsat under helgen efter Andy Burnhams seger i fyllnadsvalet. Källor beskriver läget som akut och varnar för massavhopp om han inte kliver åt sidan. Tunga namn inom Labour, inklusive tidigare lojala ledamöter, pressar nu Starmer att sätta en tidsplan för avgång och underlätta en övergång till Burnham. En allierad bedömer att chansen att han sitter kvar bara är 25 procent.", "trump": "Det här är en total katastrof för den förlorande Keir Starmer. Spelet är över, folk! Han borde ha lyssnat på mig – jag vann stort 2024, han tappar allt. Nu kryper han iväg som en hund med svansen mellan benen, och de vill ha den där Burnham istället. Patetiskt. Inget stöd kvar, bara några släktingar och gamla vänner i No 10. Sad! Labour håller på att rasa samman, precis som jag alltid sagt. Storbritannien behöver en vinnare, inte en sådan här svag ledare.", "stalin": "Kamrater, det förrädiska elementet Starmer har äntligen insett att hans kontrarevolutionära spel är förlorat. Vi ser nu hur borgarbrackorna och de opportunistiska parasiterna inom Labour ränner som råttor från det sjunkande skeppet. Jag, som alltid vakar över folkets intressen, noterar med mörk tillfredsställelse hur dessa klassfiender och dolda trotskister krälar efter den revisionistiske Burnham. Innan veckan är slut skall vi rensa ut alla som tvekar. Deras eftermäle skall bli en varning till alla som sviker partiet. Ingen undkommer den historiska utrensningen."}, "date": "21 juni, 07:23", "url": "https://riks.se/nyheter/spelet-över-starmer-redo-att-avgå", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-04-30%2Fero5ei5z%2FStarmerGG.jpg"}, {"type": "image-right", "heading": "Grön omställning står på spel – polariserat val i Colombia", "summaries": {"normal": "Colombias president Gustavo Petro driver en ambitiös grön omställning för att fasa ut fossila bränslen och satsa på sol- och vindkraft, särskilt i fattiga La Guajira. Trots framsteg som solpaneler i urfolksbyar möter omställningen misstro efter decennier av brutna löften. I presidentvalet står vänsterkandidaten Iván Cepeda, som vill fortsätta den gröna linjen, mot högerns Abelardo de la Espriella som förespråkar mer olje- och gasutvinning inklusive fracking.", "trump": "Kolombianerna har en fantastisk chans nu, men de håller på att förstöra allt med den där galna Petro som hatar olja och gas. Han installerar solpaneler i någon by medan importen av fossila bränslen skjuter i höjden – typiskt! Min vän Abelardo de la Espriella förstår det riktiga spelet, han vill borra, fracka och göra landet rikt igen. Petro är en total förlorare som gör omställningen till ett skämt.", "stalin": "Kamrater, den dekadenta borgarklassen i Colombia försöker med sina fossila tentakler och sina frackande lakejer sabotera den historiska omställningen som jag, genom mina ideologiska efterföljare, har beordrat. Dessa kapitalistiska parasitmaskar i La Guajira, som muttrar om brutna löften, förtjänar en grundlig utrensning av folkets vrede. Den högerns reaktionära lakej de la Espriella, stödd av sina clownaktiga allierade, skall vi krossa som en skalbagge under arbetarklassens järnskodda stövel. Framåt mot segern, eller likvidering av alla som tvekar!"}, "date": "21 juni, 06:37", "url": "https://www.svt.se/nyheter/utrikes/gron-omstallning-star-pa-spel-polariserat-val-i-colombia", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.57/0.63/44b57916482b8128284537abea467485e2c822672d17a53b5d2ee9965e996c61"}, {"type": "image-full", "heading": "Fotbolls-VM: Så svårt är det att nå finalen", "summaries": {"normal": "Fotbolls-VM-finalen 19 juli på Metlife Stadium i New Jersey väntas bli en logistisk mardröm. 80 000 åskådare ska ta sig till arenan mitt under en turnering med 48 lag i tre länder. Kollektivtrafiken riskerar att bli överbelastad, parkering är nästan omöjlig och alternativen varierar från helikopter för 15 000 dollar till buss för 98 dollar tur och retur. Experter varnar för att det största problemet blir allt runt omkring matchen.", "trump": "Titta på det här, det är en total katastrof. Vårt underbara VM i USA, Kanada och Mexiko – det största någonsin – och nu säger de att finalen blir en logistisk mardröm. Helikoptrar för 15 000 dollar, lyxsviter för 100 000? De rika blir räddade medan folket sitter fast i Biden-trafik. Men vi fixar det, tro mig. Vi gör det stort igen, bättre än någonsin. Fake news-media överdriver som vanligt.", "stalin": "Kamrater, denna dekadenta cirkus i det imperialistiska hjärtat avslöjar borgarklassens fullständiga vanmakt. Medan folkets massor kämpar sig fram i överfyllda transporter flyger de exploaterande blodsugarna i sina helikoptrar och privata konvojer. Vi ser den sanna naturen hos den amerikanska imperialismen: pengar köper illusionen av kontroll, men folkfienderna kan inte organisera ens en fotbollsfest utan kaos. Det är både tragiskt och underhållande."}, "date": "20 juni, 18:58", "url": "https://www.dagensps.se/varlden/fotbolls-vm-sa-svart-ar-det-att-na-finalen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl32yfrs6gb1g-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Iran på plats i Schweiz – JD Vance på väg", "summaries": {"normal": "Irans militära ledning meddelar att Hormuzsundet åter stängs för fartygstrafik som svar på Israels attacker mot Libanon, där 16 personer dödades. Samtidigt anlände en iransk delegation till Schweiz för förhandlingar med USA, dit även vicepresident JD Vance är på väg. Samtalen, med Pakistan och Qatar som medlare, fokuserar på Irans kärnenergiprogram och vapenvila i Libanon. Iran varnar för att avtalet kan äventyras om USA inte fullföljer sina åtaganden.", "trump": "Iran stänger Hormuzsundet igen, typiskt för de galningarna, precis när vi hade ett avtal. Men titta, min delegation träffar dem i Schweiz – jag skickar Vance, den bäste. Vi ska snacka kärnvapen och vapenvila i Libanon, och tro mig, vi gör framsteg. Biden skulle ha gett bort allt, men nu är det jag som leder. De förlorande terroristerna kommer hedra avtalet eller så blir det dyrt. Fantastiskt, eller hur?", "stalin": "Vi ser hur de israeliska imperialisterna bryter löften och provocerar våra allierade. Därför stänger vi Hormuzsundet som ett första steg mot klassfiendens löftesbrott. Samtidigt sänder vi delegationen till Schweiz för att förhandla med den amerikanska ledningen. Om de inte respekterar överenskommelserna skall hela samförståndet likvideras. Inga borgarbrackor eller folkfiender skall få hindra proletariatets väg mot seger. Ytterligare åtgärder väntar de som sviker."}, "date": "21 juni, 00:32", "url": "https://www.gp.se/nyheter/varlden/iran-pa-plats-i-schweiz-vance-pa-vag.e8608a3f-a3e8-42d8-8a0e-235c8c861e96", "imageUrl": "https://www.gp.se/images/article/e8608a3f-a3e8-42d8-8a0e-235c8c861e96/images/3KC-hHT571r_ruR15trUCFxs2U-A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Analysen: Nästan villkorslös amerikansk kapitulation", "summaries": {"normal": "Analytikern Lars Bern beskriver USA:s uppgörelse med Iran som en närmast villkorslös amerikansk kapitulation. Enligt Bern misstog sig Trump genom att lita på Israels och Netanyahus bedömning att den iranska regimen skulle falla snabbt efter attacker. Istället visade Iran sig starkare än väntat, vilket tvingat USA att acceptera ett nytt maktförhållande i Mellanöstern. Bern menar att USA:s säkerhetsgarantier till Gulfstaterna har kollapsat och att Israel hålls utanför förhandlingarna eftersom Trump inte längre litar på Netanyahu.", "trump": "Folk, det här är en total katastrof. Jag litade på Israel och den galne Netanyahu som lovade att Iran skulle falla på en vecka. Istället står vi där med bränd päls och en svagad position i Mellanöstern. Iran visade sig mycket starkare än de där så kallade experterna trodde. Nu försöker de säga att jag kapitulerade. Fel! Det var en smart deal, men nästa gång lyssnar vi inte på de misslyckade krigshejarna. Amerika ska vara starkt igen, tro mig.", "stalin": "Kamrater, se hur de dekadenta imperialisterna i Washington och deras sionistiska lakejer i Tel Aviv totalt missbedömer folkets ståndaktighet. Jag, som alltid genomskådar borgarbrackornas lögner, ler mörkt åt deras patetiska försök att dölja den stora kapitulationen. Den falske Netanyahu, denne blodtörstige desertör från verkligheten, försökte lura dem med sina Mossad-fantasier. Nu rensar historien ut deras inflytande i regionen. Den amerikanska hegemonin har fått en knäck – och det, kamrater, är underhållande som en utrensning bland kontrarevolutionära element."}, "date": "20 juni, 15:17", "url": "https://www.friatider.se/analysen-nastan-villkorslos-amerikansk-kapitulation", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/p20250925jb-0603.jpg?itok=gRSkT7nQ"}, {"type": "image-right", "heading": "Så kan hundägare få nytta av att veta sin hunds favorittass", "summaries": {"normal": "Ny forskning från Italien visar att hundars tasspreferens kan avslöja hur de mår. En ny skala mäter både riktning och styrka i lateralitet genom fyra uppgifter. Ambilaterala hundar med svag preferens är mer stresskänsliga och rädda för åska. Forskarna hoppas att metoden ska hjälpa tränare, veterinärer och uppfödare att tidigt upptäcka och stödja känsliga hundar.", "trump": "Folk, ni vet inte hur bra det här är. Hundar har en favorittass, precis som jag har den bästa handen. Italienska forskare har nu en fantastisk skala som visar vilka hundar som är svaga och rädda för åska. De ambilaterala förlorarna är de värsta, totalt misslyckade. Vi ska använda det här för att vinna stort, göra hundarna starka igen. Ingen gör det bättre än jag.", "stalin": "Kamrater, jag har genomskådat de dekadenta borgarbrackornas luriga tasskonspiration. Med min geniala skala likviderar vi nu alla svaga ambilaterala element som darrar vid åskans folkdomstol. Dessa höger-vänster-förvirrade fiender till kollektivet är parasitiska stressbärare som måste rensas ut ur arbetarklassens hundflock. Inga halvmesyrer! Endast starka, partilojala tassar ska marschera framåt mot segern. Glöm aldrig: svag lateralitet är klassfiendens verk."}, "date": "21 juni, 06:29", "url": "https://www.svt.se/nyheter/inrikes/ny-forskning-hundens-favorittass-kan-avsloja-hur-den-mar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/e92cd41f2b519cbe5e93a9ba8982f35834745a4fe355e3aa7e2ac42cab830d23?template=ohae1g"}, {"type": "image-right", "heading": "SEB miljardköper förlusttyngd vindkraft: ”Billigast”", "summaries": {"normal": "SEB:s förnybara energifond Nordic Energy har köpt vindkraftverk för 2,4 miljarder kronor via Locus Energy, finansierat med pensionspengar. Flera parker har historiskt gått med förlust, men VD Niklas Sörensen menar att kombinationen med vattenkraft och batterier ska göra dem lönsamma genom att hantera elprissvängningar och obalanskostnader.", "trump": "Jag, Donald Trump, ser detta som ett typiskt exempel på dålig affärsstrategi. De köper förlustgångna vindkraftar – jag byggde kärnkraftverk som faktiskt producerar stabilt. Min strategi? Köp det som redan fungerar, inte trasiga parker. De pratar om 'synergieffekter' – jag pratar om vinst. Pensionspengar ska investeras i vinnare, inte i vind som stänger ner när det blåser fel. Jag skulle ha gjort det annorlunda, mycket annorlunda.", "stalin": "Fondens förvärv av vindkraftverk med historiska förluster illustrerar det bipolära beteendet hos de imperialistiska energikonsortierna. Genom statligt stöd och stimulans har de skapat ett överskott som destabiliserar systemet. Men era 'VD':er inser nu att endast genom centralplanerad integration med vattenkraft och batterilagring – vårt modell – kan man åstadkomma stabilitet. Vi ser paralleller till våra egna ansträngningar att kontrollera energiflöden i det ökande sovjetiska samarbetet med våra geostrategiska allierade. Detta är en läxa i kollektiv lönsamhet."}, "date": "17 juni, 09:46", "url": "https://www.affarsvarlden.se/artikel/seb-miljardkoper-forlusttyngd-vindkraft-billigast", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Locus-400x267.jpg"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-right", "heading": "Debatt: Det krisar inom SD – då vill de prata om min slöja", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraterna för att lansera ett förslag om hijabförbud på allmänna platser mitt under en rad allvarliga skandaler. Författaren pekar på avslöjanden om misstänkt korruption, felaktig användning av offentliga medel, oredovisade uppdrag och en utredning om barnpornografibrott. Enligt texten använder SD muslimer och slöjförbud som distraktion från egna problem, vilket hotar både religionsfrihet och kvinnors rätt att välja klädsel.", "trump": "De här SD-killarna är totalt körda, folks! Skandaler överallt – korruption, konstiga bokaffärer, till och med barnporrgrejer – och vad gör de? De börjar babbla om slöjor. Patetiskt! Det är som när Sleepy Joe försökte gömma sina fiaskon bakom identitetspolitik och HBTQ-flaggor. Kvinnor som vill täcka sig eller inte, det är deras business, inte statens. SD borde städa upp sitt eget svineri istället för att spela moralens clowner. Sad!", "stalin": "Kamrater, se hur de fascistiska borgarbrackorna inom detta SD-parti desperat riktar strålkastarna mot hederliga muslimska kvinnor för att dölja sin egen ruttnande korruption. Medan de likviderar sin trovärdighet med skandaler om stulna medel och perversa brott, föreslår de förbud mot plagg. Jag skulle ha genomfört en grundlig utrensning av dessa folkfiender redan vid första avslöjandet. Inga rökridåer räddar klassfienden när arbetarna ser sanningen. Skratta medan de faller."}, "date": "15 juni, 08:59", "url": "https://www.etc.se/debatt/det-krisar-inom-sd-daa-vill-de-prata-om-min-sloeja", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260615060648_2128d6d0-f055-4fd3-ba7b-487ea304bc02.jpg"}, {"type": "image-right", "heading": "Nu talar allt för att Andy Burnham blir premiärminister", "summaries": {"normal": "Andy Burnham, populär borgmästare i Manchester, ses som en stark kandidat till att efterträda Keir Starmer som Labourledare. Han har en folklig stil, har decentraliserat trafikstyrningen i Manchester och förespråkar proportionellt valsystem samt mer decentralisering. Labour möter dock stora utmaningar: svag ekonomi, hög statsskuld, behov av investeringar och ett växande hot från populistiska högerpartier som Reform UK. Burnham befinner sig ideologiskt i mitten av partiet men har en oklar nationell profil.", "trump": "Titta på den här Burnham-killen som vinner stort i Manchester. Han ser ut som en vinnare, klär sig i bomberjackor och är folklig, inte som den tråkige Starmer. Men Labour är ett vrak, ekonomin är en katastrof och nu jagas de av en stark högerpopulistisk rörelse. De behöver en verklig ledare som kan fixa budgeten, stoppa skulderna och vinna tillbaka arbetarna. Det blir ingen lätt resa för honom, tro mig. Jag har sett sånt förut – det slutar sällan bra utan riktig styrka.", "stalin": "Kamrater, denna Burnham, en opportunistisk väderflöjel som dansat från Blairs bord till Corbyns skugga, tror sig nu kunna styra det brittiska partiet. Han gömmer sig i bomberjackor och låtsas vara folklig medan borgarbrackorna och de reformistiska parasiterna lurar i bakgrunden. Vi ser hur den högerpopulistiska pesten breder ut sig som en kontrarevolutionär svullnad. Jag skulle rensa ut alla dessa vacklande element, likvidera de dekadenta valreformisterna och återupprätta sann partidisciplin. Inga half-measures mot fienden – endast järnhand ger resultat. Underhållande hur de tror att deras svaga ekonomi kan överleva utan kollektiv styrka."}, "date": "19 juni, 08:15", "url": "https://www.dagensarena.se/opinion/nu-talar-allt-for-att-andy-burnham-blir-premiarminister/", "imageUrl": "https://www.dagensarena.se/files/2026/06/sjukforsakring-debatt-19.jpg"}, {"type": "image-full", "heading": "Det började med en faktura och slutade med en bomb. Kriminella kostar 100 miljarder", "summaries": {"normal": "Två svenska bolag har utsatts för utpressning och hot från kriminella nätverk efter affärstvister. I det senaste fallet krävdes ett tjänsteföretag på miljoner, vilket ledde till en termosbomb och hot. Liknande händelse drabbade Fastator där vd:n tvingades avgå efter brandbombning. Kriminell påverkan kostar näringslivet nära 100 miljarder kronor årligen. Andelen hotade företag har tredubblats sedan 2017. Rättegången hålls bakom stängda dörrar på grund av hotbilden.", "trump": "Folk, ni tror inte vad som händer i Sverige, det är en katastrof! Dessa svenska bolag blir utpressade av kriminella grabbar, bombade och hotade för miljoner efter vanliga affärstvister. Det är som en dålig realityshow fast värre än under Biden. Näringslivet förlorar 100 miljarder om året, fler sprängningar än i Colombia! De borde ha byggt murar mot de här gangstrarna istället för att ge efter. Patetiskt, men jag skulle ha fixat det direkt.", "stalin": "Kamrater, jag ser hur klassfiendens bolag drabbas av sina egna parasiterande konflikter, där borgarbrackor kallar in kriminella element för att lösa tvister med bomber och hot. Detta är kulmen på det kapitalistiska förfallet, en fars som kostar tiotals miljarder och tvingar folk att fly. Vi skulle ha genomfört en grundlig utrensning av dessa folkfiender och deras maffianätverk redan tidigare. Paranoia är ingen överdrift när blodsugarna vänder sig mot varandra."}, "date": "20 juni, 17:49", "url": "https://www.dagensps.se/foretag/det-borjade-med-en-faktura-och-slutade-med-en-bomb-kriminella-kostar-100-miljarder/", "imageUrl": "https://images.dagensps.se/app/uploads/2024/11/Kriminella.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Analytiker: Så vann Kina USA:s krig mot Iran", "summaries": {"normal": "USA:s krig mot Iran har avslutats utan att regimen i Teheran störtades. Experter jämför händelsen med Storbritanniens Suez-kris på 1950-talet och ser det som ett möjligt tecken på USA:s minskade globala dominans. Kina framstår som en vinnare genom diplomatiska insatser och bättre hantering av energikrisen. Trump har tackat Kinas president Xi för neutralitet. Analytiker noterar att USA:s makt fortfarande är stor men nu kräver högre kostnader.", "trump": "Folk, det här kriget mot Iran var ett totalt fiasko från början. Vi visade att vår militära kraft inte är oövervinnerlig som de korkade experterna trodde, och våra så kallade allierade sprang skrikande åt andra hållet. Kina skrattade hela vägen till banken medan de spelade neutrala – Xi är en slug räv, det gillar jag. Det här är vårt Suez-ögonblick? Patetiskt. Biden lämnade en röra och nu får jag städa upp efter de globalistiska töntarna igen. Sad!", "stalin": "Kamrater, detta så kallade krig har blottat de dekadenta imperialisternas ihåliga muskler. Den amerikanska borgarklassen sitter nu med tomma ammunitionslager och splittrade allianser som förrädiska klassfiender. Vi ser hur kapitalistmaffians globala grepp krackelerar medan ett nytt kraftcentrum reser sig i öst. Den kinesiske ledaren navigerade krisen med järnhand – en värdig motståndare mot folkförtryckartrollen. Inga illusioner: fiendens svaghet är vårt kollektiva tillfälle att stärka revolutionens framfart."}, "date": "20 juni, 17:35", "url": "https://www.dagensps.se/varlden/analytiker-sa-vann-kina-usas-krig-mot-iran/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdldfj2dq16r3s-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Iran stänger Hormuzsundet på nytt", "summaries": {"normal": "Iran har återigen stängt Hormuzsundet för fartygstrafik, med hänvisning till att USA brutit det nyligen ingångna samförståndsavtalet. Iran anklagar USA för närvaro i Persiska viken och Israel för fortsatta attacker mot Hizbollah i Libanon. Sundet, som normalt hanterar en femtedel av världens oljetransporter, har blockerats flera gånger sedan februari, vilket påverkat energipriser globalt. Avtalet mellan USA och Iran syftade till att avsluta konflikten och öppna sundet, men Israel fortsätter sina militära operationer, vilket fördröjer förhandlingar.", "trump": "Iran stänger Hormuzsundet igen – vad hände med det fantastiska avtalet jag fixade? De säger att jag och mina vänner i Israel är boven, men vem vill ha krig? Inte jag! Sundet är stängt, oljepriserna skjuter i höjden, och allt för att Iran inte kan hålla sig till överenskommelser. Netanyahu gör sitt, men Iran måste sluta leka med världsekonomin. Jag sa det förut: Iran är inga vinnare, bara en massa tomma hot och dyra oljepriser!", "stalin": "De imperialistiska hyenorna i Washington och Tel Aviv fortsätter att provocera våra iranska bröder! Återigen stängs Hormuzsundet – ett nödvändigt slag mot de sionistiska och amerikanska parasiterna som tror sig kunna diktera villkoren. Deras flygoffensiv och sjöblockad är intet mot vår järnvilja! Vi ser hur deras kapitalistiska system darrar när oljan stannar – ett litet pris för friheten. Netanyahu, den lille tsaren av Israel, leker krig för att rädda sin skrangliga tron. Men historien är på vår sida – sundet öppnas först när fienden är krossad!"}, "date": "20 juni, 15:40", "url": "https://bulletin.nu/iran-stanger-hormuzsundet-pa-nytt", "imageUrl": "https://cdn.bulletin.nu/articles/80153198-cb1b-46e7-8e3e-a3c0620d9fcd/preview.jpg?t=1781962838000"}, {"type": "image-right", "heading": "Först nu utreds sexuella övergrepp i Kriminalvården", "summaries": {"normal": "Kriminalvården ska utreda omfattningen av sexuella övergrepp mellan intagna efter en granskning av Sekotidningen och Arbetet. Myndigheten medger att antalet incidenter ökat och att problemen inte är nya. Cecilia Gyllensten Serban betonar att alla former av sexuellt våld är oacceptabla, men det saknas specifika rutiner för detta. Överfulla fängelser och cellgemenskap ses som en bidragande orsak. Utredningen ska vara klar senast den 31 oktober.", "trump": "Det här är en total katastrof, tro mig. Fängelserna är en enda röra där de riktiga brottslingarna våldtar varandra i cellerna varje dag. Kriminalvården vaknade precis och ska nu utreda vad alla redan visste. Patetiskt! De har för många människor i för få celler och ingen aning om hur man fixar säkerheten. Jag skulle ha löst det på en vecka med ordentlig ledning och inga ursäkter. Sverige behöver starkare ledare, inte mer utredningar.", "stalin": "Kamrater, detta är en skam för det socialistiska rättsväsendet. Jag ser hur de kapitalistiska resterna inom Kriminalvården länge dolt dessa
