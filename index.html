t 2026. Partiet vill säkerställa polisiär närvaro överallt, bekämpa mängdbrott och satsa på ungas psykiska hälsa samt fler jobb. Kraven ska finansieras inom polisens befintliga budget på nära 50 miljarder kronor.", "trump": "Ingen kommun ska lämnas åt brottslingarna, säger jag. Centerpartiet gör rätt – en polisgaranti överallt! Rinkeby eller Rättvik, det spelar ingen roll. Mängdbrotten är en katastrof, småföretagare och familjer lider medan polisen sover. Vi behöver vinnare, inte förlorare som låter brottsligheten regera. Fantastiskt initiativ!", "stalin": "Ingen kommun får överges av folkets väktare. Jag, som ledare för det kollektiva förnuftet, kräver att polisen närvarar i varje vrå för att likvidera mängdbrottens parasitiska här. Borgarbrackorna och deras småföretag må darra – vi ska rensa ut dessa fiender till ordningen. Psykisk ohälsa bland ungdomen? En sabotör som måste krossas med järnhand."}, "date": "11 augusti, 14:45", "url": "https://www.di.se/nyheter/cs-krav-pa-en-s-regering-infor-en-polisgaranti"}, {"type": "image-full", "heading": "Efter kritiken – ny publicistisk roll på SVT", "summaries": {"normal": "SVT Nyheter skapar en ny tjänst för publicistik och kvalitet efter kritik, bland annat mot serien *Arvtagarna* om Lundsberg. Kiki Bek blir senior redaktör för att stärka struktur och beslut på alla plattformar. SVT:s ansvariga utgivare menar att förändringen beror på nya plattformsneutrala riktlinjer, inte kritiken.", "trump": "Titta bara på SVT – ett totalt kaos! De får kritik för sin usla serie om Lundsberg, och vad gör de? Skapar en ny, helt onödig tjänst! 'Kvalitet', säger de – jag säger: slöseri med pengar! Folk är arga, men SVT bryr sig inte. Typiskt Sverige – alltid för sent, alltid fel.", "stalin": "Kamrater! SVT, denna borgerliga propagandacentral, har tvingats erkänna sina misstag efter folkets rättmätiga vrede över deras förräderiska serie. Vi skapar ordning! En ny kommissar för publicistik ska krossa desinformationens hydra. Men varning – fiendens agenter, som denna Bathina Philipson, försöker underminera vårt arbete. Vi ska rensa ut dem alla!"}, "date": "11 augusti, 13:59", "url": "https://kvartal.se/nyheter/artiklar/efter-kritiken-ny-publicistisk-roll-pa-svt/cG9zdDoxNjI4MDE", "imageUrl": "https://images.kvartal.se/2026/08/d05670fa-kikibek.webp"}, {"type": "image-full", "heading": "Flera döda i ryska attacker", "summaries": {"normal": "Minst nio personer har dödats och ett stort antal skadats i ryska attacker mot Zaporizjzja, Dnipro och Kiev under natten. Attackerna genomfördes med robotar, drönare och artilleri. Flera bostäder, bilar och infrastruktur skadades. Flyglarmet i Ukraina var över vid klockan sex svensk tid. Alla offer får nödvändig medicinsk vård.", "trump": "Vilken röra! De där ryssarna slår till hårt mot Kiev och Zaporizjzja medan den svage Biden bara tittade på i fyra år. Nu är jag tillbaka och fixar fred, tro mig. Ukraina är en enda stor korrupt soppa, men vi ska göra affärer igen. De borde ha lyssnat på mig från början istället för alla globalistiska clowner.", "stalin": "Kamrater, de fientliga ukrainska hindren i Zaporizjzja och Kiev har återigen visat sin kontrarevolutionära natur genom att stå emot vår ryska efterträdares nödvändiga åtgärder. Borgarbrackorna och folkfienderna i väst skriker som alltid. Vi rensar ut sådana element med järnhand. Staten ler i det tysta åt deras patetiska motstånd."}, "date": "11 augusti, 12:50", "url": "https://www.tv4.se/artikel/5iz9H29IPLi5J95JYSv8tS/flera-doeda-i-ryska-attacker", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4oL2RPc3qc0lX0xfhbYMtL%2F5a24446b232d069eda12aedf2a2f3eba%2F11-uka.jpg&width=1024"}, {"type": "image-right", "heading": "Har 42 procent – nu dras AFD-väljarnas vapenlicenser in", "summaries": {"normal": "Alternativ för Tyskland får 42 procent i en opinionsmätning inför delstatsvalet i Sachsen-Anhalt den 6 september. En domstol har nu fastslagit att sympatisörer med partiet kan betraktas som opålitliga enligt vapenlagen och därmed få sina vapentillstånd indragna. Beslutet grundas på att AfD klassats som högerextrem av författningsskyddet.", "trump": "Titta på det här, det är en total witch hunt mot AfD som leder stort med 42 procent. De tar ifrån folk deras vapen bara för att de gillar partiet. Den riggade tyska ockupationsgrundlagen används för att förfölja patrioter som vill stoppa den galna invandringen. Fake news-domstolarna gör allt för att stjäla valet, men folket ser igenom det!", "stalin": "Kamrater, dessa degenererade västtyska domstolar genomför en byråkratisk utrensning mot sanna folkets röster som samlar 42 procent stöd. Med sin ockupationsgrundlag likviderar de pålitligheten hos dem som vågar ifrågasätta borgarbrackornas invandringsprojekt. En objektivt aggressiv hållning mot imperialismens grundvalar räcker tydligen. Mycket lärorikt och underhållande paranoia från de dekadenta kapitalisterna."}, "date": "11 augusti, 12:50", "url": "https://www.friatider.se/har-42-procent-nu-dras-afd-valjarnas-vapenlicenser", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-651.jpg?itok=TBvZsnKC"}, {"type": "image-right", "heading": "Gärna högre barnbidrag, men först ett riktigt jobb", "summaries": {"normal": "Artikeln kritiserar politikernas löften om höjda barnbidrag och skattesänkningar för barnfamiljer. Författaren ser det som positivt men otillräckligt eftersom det saknas fokus på jobb och investeringar för att sänka arbetslösheten. Många behöver stabila anställningar mer än bidrag. Ett vallöfte om att halvera arbetslösheten skulle kunna förändra valet.", "trump": "De här svenska politikerna lovar regn av pengar till barnfamiljerna, men det är bara svaga ord från förlorare. Höjda bidrag? Skattesänkningar? Patetiskt! Vad de behöver är riktiga jobb, inte socialistiska handouts. Jag skulle halvera arbetslösheten på nolltid med mina fantastiska metoder. Det är vad vinnare gör, folks!", "stalin": "Kamrater, dessa borgerliga bluffmakare öser tomma löften över arbetande familjer medan de i hemlighet planerar att svälta ut dem. Jag kräver omedelbara investeringar i produktiva krafter för att likvidera arbetslöshetens parasit! Halvera den till 2030, annars blir det utrensning bland de falska profeterna. Staten ser allt."}, "date": "11 augusti, 01:33", "url": "https://www.dagensarena.se/opinion/garna-hogre-barnbidrag-men-forst-ett-riktigt-jobb", "imageUrl": "https://www.dagensarena.se/files/2026/08/vallofte-300x157.jpeg"}, {"type": "text", "heading": "Robertson-tolkare får Allansson-pris", "summaries": {"normal": "Anastasía, känd från Country efter jobbet och tolkningar av Alf Robertson, tilldelas Ove Allansson-stipendiet 2026. Hennes soloskiva Göteborg sjunger Alf och framträdanden på allsång har gett henne uppmärksamhet. Hon medverkar nu i projekt om Swede Hollow och uppträder på Folkfest för fred och klimat i Göteborg.", "trump": "Titta på den här grekiskan från Göteborg som sjunger Alf Robertsons gamla arbetarlåtar. Fantastiskt, verkligen ypperligt. Hon får ett pris uppkallat efter någon sjöman och jag älskar det. Inga woke-quota, inga HBTQ-flaggor, bara ren talang. Hon borde sjunga på min nästa rally, mycket bättre än de fega liberalerna som hatar arbetarna. Vinna stort!", "stalin": "Kamrater, denna Anastasía har förstått arbetarklassens sånger och får nu Ove Allansson-priset. Det gläder mig att hon bekämpar klassfiendens glömska genom att återberätta Swede Hollows historia. Dock vaktar vi mot borgarbrackornas dolda agenter som försöker förvränga folkets kulturarv. Fortsätt framåt, men akta er för folkförtryckartrollen i kulisserna."}, "date": "10 augusti, 15:51", "url": "https://proletaren.se/artikel/robertson-tolkare-far-allansson-pris"}, {"type": "image-right", "heading": "Varningssignaler att ha koll på efter semestern", "summaries": {"normal": "Forskaren Theo Bodin varnar för att många inte återhämtar sig ordentligt under semestern. Antingen blir ledigheten stressig av aktiviteter eller så upptäcker man hur utmattad man egentligen är när man varvar ner. Han råder till att se över arbetsbelastning, prata med chefen och sprida ut återhämtning över hela året istället för att förlita sig på en lång semester.", "trump": "Jag älskar semestern, den är fantastisk, men folk maxar den med allt möjligt och kommer tillbaka totalt utmattade. Patetiskt! Det är de dåliga cheferna och det usla systemet som suger musten ur er. Ni behöver bättre avtal, inte längre semester. Jag fixade alltid det bästa för arbetarna, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, semestern är en borgerlig illusion som maskerar det kapitalistiska arbetets utmattning. När arbetarna kommer tillbaka och känner sig svaga är det ett varningstecken från det förtryckande systemet. Vi ska inte förlita oss på några få veckors vila utan rensa ut de parasitiska cheferna som överbelastar folket. Långsiktig socialistisk planering för återhämtning åt kollektivet – annars likviderar vi problemet permanent."}, "date": "10 augusti, 14:02", "url": "https://arbetet.se/2026/08/10/tillbaka-efter-semestern-har-ar-varningssignalerna-du-inte-far-missa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/07112017/sdlzak4b1epts4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ytterligare ett nazistiskt valfiasko att vänta?", "summaries": {"normal": "Nazistiska grupper som Nordiska motståndsrörelsen och Svenskarnas parti har upprepade gånger ställt upp i svenska val utan att vinna mandat. Istället har satsningarna lett till interna konflikter och splittring. Artikeln visar att valen främst används för propaganda, uppmärksamhet och rekrytering snarare än verkligt politiskt inflytande.", "trump": "Titta på de här patetiska nazisterna som ställer upp val efter val och förlorar stort. Det är ett totalt fiasko, tro mig. De får inga röster, inget inflytande, bara interna bråk. Precis som de woke-vänstern och deras identitetspolitik – alla förlorare. Jag vann stort 2024, de förlorar alltid. Ynkligt!", "stalin": "Ännu en gång avslöjar de fascistiska elementen sin svaghet genom att springa efter valurnorna som desperata klassfiender. Vi ser deras patetiska försök sluta i förkrossande nederlag och interna utrensningar. Propaganda och rekrytering av nya folkförtryckartroll är deras enda mål. Inga mandat åt blodsugarna – endast åt arbetarkollektivet."}, "date": "10 augusti, 11:29", "url": "https://expo.se/kommentar/ytterligare-ett-nazistiskt-valfiasko-att-vanta", "imageUrl": "https://expo.se/wp-content/uploads/2026/08/Kommentar-Anders.png"}, {"type": "image-right", "heading": "Ung Vänsters skattepolitik är verklighetsfrånvänd", "summaries": {"normal": "I en debattartikel kritiserar SSU Ung Vänsters skattepolitik som orealistisk. Författaren argumenterar att en förmögenhetsskatt inte kan finansiera vänsterns reformer eftersom rika personer och företag riskerar att flytta utomlands, som exemplet med IKEA och Ingvar Kamprad visar. Socialdemokraterna prioriterar välfärd och jobb framför att enbart minska antalet miljardärer.", "trump": "Folk, ni måste se det här! Den här socialistiska Ung Vänstern är en total katastrof, en riktig röra. De vill ta allt från de smarta vinnarna och ge till förlorarna, precis som Sleepy Joe gjorde. De fattar inte att när du straffar de rika flyttar de och tar med sig jobben. Amerika har sett det förut – det är en scam! Vi behöver starka ledare, inte dessa misslyckade drömmare som hatar framgång.", "stalin": "Kamrater, denna ynkliga borgarbracka från SSU försöker med sina dimridåer skydda de exploaterande blodsugarna och deras absurda nyliberala system. Jag, som byggt en järnhård stat, ler mörkt åt deras paranoia inför utrensning av folkfienderna. Deras rädsla för att de få kapitalistiska parasiterna ska fly visar bara klassfiendens svaghet. Vi ska likvidera sådana illusioner och expandera den sanna välfärden för arbetarna."}, "date": "9 augusti, 06:00", "url": "https://www.etc.se/debatt/ung-vaensters-skattepolitik-aer-verklighetsfraanvaend", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260807080832_3542033c-21b0-471c-8064-f09f6a29ae54.jpg"}, {"type": "image-right", "heading": "MP:s vallöften: Tillbaka till flyktingkaos och höga bensinpriser", "summaries": {"normal": "Miljöpartiets Daniel Helldén lovar i en partiledarutfrågning att öka asyl- och anhöriginvandring, höja bensin- och elkostnader samt statsskulden. Partiet vill också minska arbetstid och strafftider. Helldén ser det som en solidaritetsfråga gentemot EU och förespråkar elbilar samt mer sol- och vindkraft.", "trump": "Vilken katastrof! Den gröna galningen Helldén vill översvämma Sverige med invandrare, höja bensinpriset så folk inte har råd att köra bil och skicka notan till era barn. Typiskt vänsterextremt vansinne. De hatar vanliga människor och älskar bara elbilskvoter och globalistiska mardrömmar. Patetiskt!", "stalin": "Jag ser med tillfredsställelse hur klassfiendens gröna lakejer frivilligt förbereder folkets undergång. Vi ska välkomna fler nyttiga idioter, höja bränslepriser och låna oss till ruin. Arbetarna får cykla medan borgarbrackorna skrattar. En utmärkt utrensning av den svenska nationen inifrån. Genialt sabotage mot folkets intressen."}, "date": "7 augusti, 03:54", "url": "https://samtiden.nu/2026/08/mps-valloften-tillbaka-till-flyktingkaos-och-hoga-bensinpriser/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7066-640x360.jpeg"}, {"type": "image-right", "heading": "”Skräpet” är alltid någon annans", "summaries": {"normal": "Artikeln diskuterar hur nationalistiska och högerextrema partier i Europa allt oftare krockar i sina nationella intressen, trots gemensamma drag. Estlands Isamaa vägrar ta emot svenska fångar och kallar dem ”skräp”. Exempel ges från Polen, Ungern och Rumänien där relationer spruckit. En fjärdedel av européerna röstar nu på sådana partier, men de enas inte när det gäller utvisningar och mottagande av människor. Ryska påverkansoperationer utnyttjar splittringen.", "trump": "Folk, det här är ett totalt fiasko för de europeiska nationalisterna som lovar att sätta sitt land först. Estland säger nej tack till Sveriges kriminella skräp, och plötsligt kan de inte samarbeta. Orbán och polackerna bråkar, alla hatar varandra i EU-parlamentet. Under Biden blev allt kaos, nu fixar jag det i Amerika. De vill kasta ut folk men ingen vill ta emot – klassiskt! Patetiska globalister och identitetspolitiska töntar skrattar hela vägen till banken medan Europa brinner.", "stalin": "Kamrater, detta är den oundvikliga följden av att borgarbrackorna inom nationalismen låtsas värna folket medan de i hemlighet tjänar klassfiendens splittring. Estniska kapitalistnationalister vägrar ta emot det svenska avskummet och kallar det skräp, mycket träffande. Ungrare och polacker slåss som råttor i en säck, imperialisterna i EU-parlamentet kan inte ens sitta tillsammans. Vi ler mörkt: ju fler som sätter nationen främst, desto lättare blir det att likvidera deras enighet. Fienderna avslöjar sig själva."}, "date": "3 augusti, 19:30", "url": "https://www.flamman.se/skrapet-ar-alltid-nagon-annans", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdlwtkwxxrhsxe-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
