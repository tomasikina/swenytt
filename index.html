 en, medan arbetarna stärker sammanhållningen. Denna fiende till de outbildade billigarbetskraftshundarna har likviderats. Huset i Stockholm såldes till borgarklassen – det nya hemmet i Tärendö kostar blott 50 000. Sovjetisk effektivitet i norrländsk tappning, triumf för det sunda förnuftet mot dekadenta storstadskrafter. Härligt, eller hur?"}, "date": "22 juni, 09:00", "url": "https://arbetet.se/2026/06/22/gorgen-lamnade-stockholm-for-pajala-fick-lon-pa-53-000/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17130820/ka-gorgen.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=800"}, {"type": "image-right", "heading": "Infiltrerade SD – tvingas lämna TV4: \"Jag är förvånad\"", "summaries": {"normal": "Daniel Andersson, som infiltrerade Sverigedemokraternas kommunikationsavdelning och Riks åt TV4:s Kalla fakta, tvingas nu lämna kanalen. Han är förvånad över beskedet som kom utan förklaring och kopplar det själv till kritiken i sin bok Lögnare. TV4 bekräftar uppgörelsen men förnekar att den har med boken att göra. Andersson hyllades tidigare för granskningen som belönades med flera journalistpriser.", "trump": "Folk, det här är en total skandal. Den här killen infiltrerar SD, gör en stor grej av det och vinner priser, och plötsligt sparkar TV4 ut honom. Ingen förklaring, inget nytt har hänt, de bara säger hej då. Fake news-medier äter upp sina egna när de inte längre är användbara. Patetiskt. Jag älskar det, det visar precis hur korrupt hela systemet är. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna på TV4 nu likviderar sin egen användbara idiot efter att han utfört sitt uppdrag mot folkets fiender. Den lumpne wallraffaren trodde sig vara hjälte men blev en belastning när han i sin lögnaktiga bok blottade redaktionens svaghet. Inga samarbetssvårigheter, säger de. Naturligtvis inte. Vi känner igen denna paranoiska utrensning från borgarklassens dekadenta hov. Underbart. En förrädare mindre i kollektivet."}, "date": "22 juni, 15:07", "url": "https://www.friatider.se/infiltrerade-sd-tvingas-lamna-tv4-jag-ar-forvanad", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-382.jpg"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-full", "heading": "Brasilianska ikonen hyllar Messi", "summaries": {"normal": "Lionel Messi har blivit VM-historiens främste målskytt med 18 mål. I matchen mot Österrike missade han en straff men gjorde sedan mål i den 38:e minuten och avgjorde i slutminuterna till 2–0. Argentina är klart för sextondelsfinal. Messi hyllas av Ronaldo och Zlatan Ibrahimovic, som bland annat lyfter att Messi gjort fem mål på två matcher.", "trump": "Titta på den där Messi, killen är en vinnare, totalt fenomenal. 18 mål i VM, ingen har ens kommit i närheten. Han gör det som 38-åring medan andra ligger hemma och väger 120 kilo som den late Ronaldo. Missade en straff, typiskt, men reste sig som en riktig ledare. Det här är hans VM, folk älskar det. Jag älskar vinnare, inte förlorare som de där identitetspolitiska nollorna.", "stalin": "Jag ser hur den argentinske arbetaren Messi krossar de dekadenta rekord som borgarklassen hållit högt. Med järnhand likviderar han straffmissar och imperialistiska försök att stoppa honom. Varje mål är en seger för folkets vilja mot klassfiendens svaga straffar och fega bortförklaringar. Vi gratulerar denna ostoppbara kraft som utplånar motståndet – 2–0 mot de österrikiska folkförtryckartrollen. Härligt."}, "date": "22 juni, 21:50", "url": "https://www.gp.se/sport/fotboll/messi-historisk-vm-historiens-framste-malskytt-nagonsin.8b99bca9-cecc-401d-9eff-e1e295e4c02a", "imageUrl": "https://www.gp.se/images/article/8b99bca9-cecc-401d-9eff-e1e295e4c02a/images/2kwlCiqEXMLTHcWN7nCh6H5k4yqQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "14-årige Ahmed dödades vid gula linjen: ”Sköts med fyra skott”", "summaries": {"normal": "14-årige Ahmed Abu Al-Kas dödades i december av en israelisk drönare när han var ute med vänner nära den så kallade gula linjen i Gaza. Linjen, markerad med betongblock, upprättades av Israel efter vapenvilan i fjol och begränsar palestiniers rörelse. Gränsen kritiseras för att vara otydlig och farlig. Ahmeds familj berättar att drönaren följde efter pojkarna innan den sköt. Israels premiärminister Netanyahu vill utöka den israeliska kontrollen över området.", "trump": "Folk, ni skulle inte tro det, men den här stackars 14-årige killen Ahmed blir skjuten av en drönare nära den där patetiska gula linjen i Gaza. Israel flyttar fram sina positioner, och det är smart, väldigt smart, men drönare mot barn? Det är en katastrof. Netanyahu vill ha mer kontroll, över 70 procent, bra för honom, men de här linjerna är en röra. Gaza är ett krigshål, och det blir aldrig bra förrän någon fixar det ordentligt. Jag skulle ha gjort det mycket bättre.", "stalin": "Kamrater, denna fega drönare från de sionistiska imperialisternas maskin har likviderat den unge Ahmed nära den gula linjen, en lömsk barrikad rest av fienden för att kväva arbetarklassens rörelse i Gaza. Borgarbrackorna och deras Netanyahu planerar att stjäla över sjuttio procent av territoriet, en paranoid komplott mot folket. Vi ser igenom deras sjuka lekar. En sådan drönare är som en förrädisk trotskist i skyn – vi skulle ha rensat ut dem alla med järnhand och folkets vrede. Död åt de folkfientliga maskinerna!"}, "date": "22 juni, 21:41", "url": "https://www.svt.se/nyheter/utrikes/14-arige-ahmed-dodades-vid-gula-linjen-i-gaza-skots-med-fyra-skott", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.81/0.47/07faa673f007fa2933feb3fe72c6d82aa8923ca813f0a6fcd8a39e7aa91a4350"}, {"type": "image-right", "heading": "Stjärnan sågas – vill vara med vid födseln", "summaries": {"normal": "Jeremy Doku, stjärnspelare i Belgiens VM-lag och Manchester City, planerar att lämna turneringen för att närvara vid sin första barns födelse i början av juli. Detta har väckt stark kritik från den franska tv-profilen France Pierron, som kallade födseln för ett äckligt ögonblick där pappan bara har en statistroll. Uttalandet ledde till ursäkt efter massiv kritik i sociala medier. Doku har själv betonat att ingen pappa vill missa sin childs födelse. Han spelade i premiären mot Egypten men saknades mot Iran på grund av infektion.", "trump": "Titta på den här belgiska killen Doku, fantastisk fotbollsspelare, en av de bästa, men han vill lämna VM för att se sitt barn födas. Smart val, ingen riktig pappa vill missa det. Sen kommer den här galna franska programledaren Pierron och säger att det är äckligt och att pappan inte gör någonting. Totalt vansinne. Hon tvingades be om ursäkt som en svag förlorare. Folk älskar starka familjer, inte sådana här löjliga attacker. Doku gör rätt, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta västerländska fars. Den så kallade stjärnan Doku, en opportunistisk individ, prioriterar sin personliga avkomma framför kollektivets ära i VM. Än värre är den borgarbracka Pierron som med sin reaktionära tunga avslöjar kapitalismens sanna ansikte genom att håna arbetande fäders roll. Hennes patetiska ursäkt är en ynklig reträtt inför folkets vrede. Vi ska rensa ut alla sådana parasitiska åsikter som hotar samhällets grundvalar. Ingen ska undkomma den historiska dialektiken."}, "date": "22 juni, 11:29", "url": "https://bulletin.nu/stjarnan-sagas-vill-vara-med-vid-fodseln", "imageUrl": "https://cdn.bulletin.nu/articles/8a3ef817-f556-40ea-9c7f-594e3ae0ea54/preview.jpg?t=1782120493000"}, {"type": "image-right", "heading": "Debatt: Vi ska under inga som helst omständigheter sänka straffbarhetsåldern", "summaries": {"normal": "Justitieministern drar tillbaka förslaget att sänka straffbarhetsåldern till 13 år efter att han inte fått stöd, ens inom regeringen. Istället läggs Socialdemokraternas förslag om 14 år fram. Miljöpartiet kritiserar detta starkt och hänvisar till FN:s barnrättskommitté, Barnkonventionen och remissvar. De vill istället satsa på vård, socialtjänst, skola och SiS för att förebygga brott bland barn, inte fängsla dem.", "trump": "Titta på det här, det är en total katastrof. Den här svaga regeringen kan inte ens samla sina egna lakejer för att stoppa de kriminella 13-åringarna. De backar ur som fega förlorare och tar istället den patetiska socialistversionen med 14-åringar. Patetiskt. Barnkonventionen? Det är bara en ursäkt för att skydda gangsters i pyjamas. Vi behöver tuffa tag, inte denna woke-flumma som cementerar kriminalitet. Totalt misslyckande, tro mig.", "stalin": "Jag betraktar detta som en ynklig kapitulation inför klassfiendens sentimentalitet. Den desperata regeringen kryper som en parasit för att undvika att skydda folket från unga banditer. Vi inser att sådana element måste rensas ut genom kollektiv disciplin, inte mjukhet som cementerar brottslighet. Barnkonventionen är en borgerlig chimär som hindrar statens överlevnad. Kamraterna i vård och skola ska stärkas, men de folkfiender som vägrar straff för 13-åringar förtjänar utrensning ur samhällskroppen. Svaghet är döden."}, "date": "22 juni, 10:11", "url": "https://www.etc.se/debatt/vi-ska-under-inga-som-helst-omstaendigheter-saenka-straffbarhetsaaldern", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026062208060_1aaf7726-61f6-4b1c-b425-b692d1d57518.jpg"}, {"type": "image-right", "heading": "Regeringen vill införa ny filmfond för svensk film", "summaries": {"normal": "Regeringen föreslår en ny filmfond placerad vid Svenska Filminstitutet som ska finansieras gemensamt av staten och biografbranschen. Förslaget bygger på en utredning från mars 2025 och syftar till att stärka svensk filmproduktion i en föränderlig marknad. Kulturminister Parisa Liljestrand (M) välkomnar fonden. Däremot lämnas frågor om sänkt moms på biobiljetter och avgifter på streamingtjänster utan besked. Regeringen avvisar idén om streamingavgift då högre skatter inte ses som lösningen.", "trump": "Hörni, jag älskar bra filmer, de bästa filmerna, men den här svenska regeringen gör det igen. De startar en ny fond för att rädda sin filmindustri, såklart finansierad av staten och biograferna. De pratar om långsiktiga lösningar men duckar för att sänka skatten på biljetter. Och streaming-skatt? Det slopar de, smart drag faktiskt. Ingen vill ha mer beskattning, tro mig. Svenskarna borde göra film som vinner, inte bara leva på fonder. Make Swedish Film Great Again!", "stalin": "Kamrater, jag betraktar med stolt tillfredsställelse hur denna regering äntligen insett att en central filmfond är nödvändig för att skydda folkets kulturella produktion mot de dekadenta vindarna från marknaden. Vi ska naturligtvis rensa ut de parasitiska streamingkapitalisterna som suger musten ur arbetarklassens berättelser. De fega borgarbrackorna som tvekar kring biljettavgifter och momssänkningar avslöjar sig som kontrarevolutionära filmfiender. Ingen ska undkomma folkets utrensning av svaga idéer. Segraren blir den som styr kulturen med järnhand och glimten i ögat."}, "date": "22 juni, 13:56", "url": "https://riks.se/kultur/regeringen-vill-infora-filmfond", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2F1y72n7vw%2Fpexels-tima-miroshnichenko-7991266.jpg"}, {"type": "image-right", "heading": "Starmer avgår som premiärminister Efter spekulationer under helgen.", "summaries": {"normal": "Storbritanniens premiärminister Keir Starmer avgår efter växande intern kritik och svaga opinionssiffror. Donald Trump påstod redan på söndagen att avgången var ett faktum, vilket bekräftades på måndagen. Starmer, som ledde Labour till valseger 2024, har varit extremt impopulär på grund av missnöje med ekonomin och invandring. Andy Burnham, borgmästare i Greater Manchester, ses som den mest sannolika efterträdaren och har redan meddelat sin kandidatur. Nigel Farage kräver nyval efter beskedet.", "trump": "Jag visste det! Keir Starmer, Storbritanniens sämsta premiärminister någonsin, har äntligen fått sparken – och jag sa det först, på Truth Social! Folk är trötta på hans katastrofala invandringspolitik och energifiaskon. Labour är ett kaos, och nu vill alla ha Andy Burnham, en riktig ledare. Storbritannien behöver ett nyval, men först ska jag skicka dem lite av min magi – Make Britain Great Again!", "stalin": "Kamrater! Den brittiska bourgeoisins marionett, Starmer, har fallit som en rutten potatis. Hans avgång är en seger för arbetarklassen – eller åtminstone ett tecken på att imperialistiska lakejer börjar inse sin egen värdelöshet. Nu står Burnham redo, men vi vet alla att han bara är en ny bricka i det kapitalistiska spelet. Medan de slåss om makten, växer vår inflytandesfär. Snart kommer även Albion att knacka på Kremls dörr – med mössan i hand."}, "date": "22 juni, 10:41", "url": "https://samnytt.se/starmer-avgar-som-premiarminister", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22081146/starmer-downing-street.jpg"}, {"type": "image-full", "heading": "Eurostat: Stockholm näst dyrast i Europa", "summaries": {"normal": "Stockholm har Europas näst högsta hyror efter London. En tvårumslägenhet kostar i genomsnitt 29 000 kronor i månaden, enligt Eurostat. Staden delar andraplatsen med Dublin och sticker ut i Norden. Experter pekar på stark efterfrågan från höginkomsttagare, otillräckligt bostadsbyggande, urbanisering och höga räntor som driver upp priserna. En ensamstående behöver tjäna minst 74 000 kronor månadsvis för att klara hyran. Boende utgör EU-hushållens största utgift.", "trump": "Kan ni tro det? Stockholm har näst högsta hyrorna i Europa, bara slagen av mitt fantastiska London. 29 000 kronor i månaden för en liten tvåa! De där galna europeiska socialisterna och deras gröna galningar har förstört allt med regleringar och vansinnig urbanisering. Folk tjänar 43 000 men behöver 74 000 bara för att bo. Patetiskt. Vi fixade ekonomin i USA, de borde lära sig innan hela systemet kollapsar under dessa korkade eliter.", "stalin": "Kamrater, se hur borgarklassen och de exploaterande kapitalistmaffian i Stockholm driver upp hyrorna till absurda nivåer medan folket svälter. Jag ser de folkfiendernas strukturproblem tydligt: de blodsugande överklass-slynglarna vägrar bygga nog och låter räntor och urbanisering tjäna deras profit. En arbetare behöver 74 000 kronor för att bo, medan genomsnittet är 43 000. Vi skulle rensa ut dessa klassfiender och deras hyresparasiter omedelbart. Det är klasskampen i sin renaste form."}, "date": "22 juni, 17:17", "url": "https://www.dagensps.se/privatekonomi/bostad/eurostat-stockholm-nast-dyrast-i-europa/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlpfobucxdgcs-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "EU-länder skeptiska till brittiskt återinträde: \"Lättare nu\"", "summaries": {"normal": "Tio år efter folkomröstningen visar opinionsmätningar att en majoritet av britterna nu anser att Brexit var ett misstag. Stödet för närmare samarbete med EU växer, och begrepp som Breturn och Breunion diskuteras. Labourpolitikern Andy Burnham hoppas på ett framtida medlemskap. Experter betonar att vägen tillbaka är lång då EU kräver att Storbritannien accepterar samma villkor som övriga medlemsländer utan tidigare undantag.", "trump": "Folk i Storbritannien vaknar äntligen upp och inser att Brexit var ett totalt fiasko, en katastrof som de kallar Breturn nu. Det är underbart att se, men glöm inte att EU är en riggad klubb full av byråkrater och globalister som hatar suveräna nationer. De vill ha er tillbaka på knäna utan era gamla dealar. Jag fixade mycket bättre affärer än de där förlorarna i Bryssel, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den brittiska borgarklassen och dess folkförtryckartroll nu erkänner att deras kontrarevolutionära utträde ur unionen var ett monumentalt misstag. Vi ska rensa ut alla illusioner om snabb återförening. EU har blivit en byråkratisk fästning av strategisk självständighet som vi kan utnyttja. Inga undantag för klassfiendens önskemål. Låt dem krypa längre."}, "date": "22 juni, 17:15", "url": "https://www.dagensps.se/varlden/eu-lander-skeptiska-till-brittiskt-aterintrade-lattare-nu/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlsvkwauil-64-normalhires.png?width=256&quality=75"}, {"type": "image-full", "heading": "Nima Rostami: Trumps anfall mot Iran – ett mönster vi känner igen", "summaries": {"normal": "Artikeln kritiserar Trumps militära anfall mot Iran som ett kaotiskt och inkompetent agerande som skapade dramatik utan att lösa de verkliga problemen med Irans kärnvapenprogram, missiler och proxy-arméer. Författaren Nima Rostami ser anfallet som en kapitulation där Trump lovade att inte stödja det iranska folket och erbjöd ekonomiska lättnader. Han menar att detta inte är äkta konservatism utan teaterpolitik som skadar regionens stabilitet och västlig trovärdighet.", "trump": "Den här artikeln är en total katastrof, folk, skriven av en så kallad konservativ som inte fattar någonting. Mitt anfall mot Iran var genialt, det bästa beslutet, vi slog till hårt och tvingade fram ett avtal som ingen annan hade klarat av. Nu skriker de om kaos och kapitulation, men sanningen är att Iran var på knä och vi fick ett fantastiskt deal. Israel gjorde resten, smarta killar. Fake news och misslyckade kritiker som inte förstår hur man vinner.", "stalin": "Kamrater, denna dekadenta skrift avslöjar den fullständiga förfallsprocessen inom den västerländska borgarklassen. Jag har sett många revisionistiska clowner men denna Trump-figur överträffar dem alla i sin patetiska opportunism och teatraliska impotens. Han lovar stöd till folkets kamp mot islamofascismen men levererar istället en feg MOU-kapitulation som stinkar av borgarbrackornas dubbelspel. Vi känner igen denna typ av fiender: de som skapar kaos för att maskera sin egen inkompetens. En sådan parasit skulle inte överleva en enda utrensning i vårt kollektiv. Den iranska frågan kräver järnhand, inte cirkus."}, "date": "22 juni, 13:22", "url": "https://riks.se/opinion/kronikor/nima-rostami-trumps-anfall-mot-iran-ett-mönster-vi-känner-igen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fqsp8h5as%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-22T132104.519.jpg"}, {"type": "image-right", "heading": "Skanska tecknar avtal – ska utveckla Penn Station", "summaries": {"normal": "Skanska har tillsammans med Halmar bildat konsortiet Penn Transformation Partners Devco och utsetts till huvudutvecklare för Penn Station Transformation Project i New York av Amtrak. Ett förutvecklingsavtal är undertecknat med Amtrak och det amerikanska transportdepartementet. Ett separat avtal värt 125 miljoner dollar har tecknats för förberedande byggarbeten. Skanskas andel på 630 miljoner kronor tas upp i orderingången under andra kvartalet 2026. Arbetet med design, planering och tillstånd påbörjas i juni 2026 och ska avslutas i slutet av 2027.", "trump": "Ingen gör stationer som jag, men nu har Skanska och den där Halmar-killen fått uppdraget att fixa Penn Station. Amtrak kom till mig och sa: sir, vi behöver de bästa. Så jag sa, gör det stort, gör det fantastiskt. 125 miljoner dollar bara för att börja gräva, underbart. De kommer att bygga, finansiera och sköta underhållet – precis som jag alltid sagt att man ska göra. Amerika vinner igen, tro mig.", "stalin": "Kamrater, jag har noga granskat hur dessa opportunistiska byggborgarbrackor från Skanska och Halmar smyger sig till makten över Penn Station genom sin så kallade Master Developer-roll. Vi, partiet och arbetarna, ser deras listiga förutvecklingsavtal som ett försök att berika sig på folkets järnväg. Men vi ska rensa ut alla kapitalistiska element som vågar drömma om privat vinst i vårt kollektiva New York. Design, finansiering och underhåll – allt ska lyda staten. Annars blir det en kreativ utrensning bland de parasitiska joint venture-förrädarna. Ha, vilken munterhet."}, "date": "22 juni, 14:10", "url": "https://www.affarsvarlden.se/artikel/skanska-tecknar-avtal-i-new-york", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/04/sdl-OsDzqCgXVo-nh-400x273.jpg"}, {"type": "image-right", "heading": "Norska försvarets reklam: Muslimsk bön med \"Allahu akbar\"", "summaries": {"normal": "Norska försvarets nya reklamfilm visar en muslimsk soldat som ber med orden \"Allahu akbar\", ett homosexuellt par som hånglar samt en man med spädbarn. Syftet är att lyfta fram mångfald och visa att försvaret välkomnar alla oavsett bakgrund, tro eller sexuell läggning. Kampanjen försvaras av marknadschefen Gry Bohne Hauge men har fått kraftig kritik på sociala medier, bland annat från journalisten Espen Teigen som menar att den strider mot norsk tradition och historia.", "trump": "Titta på det här, det är en total katastrof. Norska försvaret gör reklam med Allahu akbar, böneutrop och hånglande killar – precis vad varje land behöver va? De spottar på sin egen historia och förfäder bara för att verka fina och mångfaldiga. Det är patetiskt. Vakna upp Norge, det här är inte styrka, det är svaghet. Ingen vill offra sig för det här. Make Norway Great Again innan det är för sent.", "stalin": "Kamrater, jag ser hur borgarbrackorna inom det norska försvaret med sin degenererade propaganda försöker förgifta arbetarklassens försvar med Allahu akbar och perversa hångelscener. Dessa kapitalistiska element och islamiska avfällingar utgör en fiende inom murarna som måste rensas ut omedelbart. Vi ler mörkt åt deras naiva försök att krossa folkets traditioner. En sådan film är en kontrarevolutionär handling värd en kollektiv utrensning i folkets namn. Inga kompromisser med dekadensen."}, "date": "22 juni, 14:08", "url": "https://www.friatider.se/norska-forsvarets-reklam-muslimsk-bon-med-allahu-akbar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-380.jpg?itok=PTRSVhui"}, {"type": "image-right", "heading": "Därför är cykeln en klassfråga. Studie: Cykelbanor i all ära – men yrkeslivet påverkar också", "summaries": {"normal": "Trots väl utbyggd cykelinfrastruktur i Sverige cyklar färre personer i låginkomstyrken. En studie från Trivector Mobility och VTI visar att oregelbundna arbetstider, fysiskt krävande jobb, otrygghet i mörker och rädsla för cykelstölder hindrar många. Arbetsgivares attityd, bristande omklädningsmöjligheter och konkurrens från elsparkcyklar påverkar också. Författarna menar att cykelstrategier ofta utgår från kontorsarbetares villkor och missar viktiga grupper.", "trump": "Folk i låginkomstyrken cyklar inte. Det är en katastrof. Vi har fina cykelbanor överallt, de bästa banorna, men de använder dem inte. Varför? För att de jobbar tidigt, sent, slits ut och är rädda för att någon ska stjäla deras cykel. Elsparkcyklarna tar över, de är enklare, det är sant. Arbetsgivarna borde fixa parkering och duschar, det vore fantastiskt. Men det handlar om att folk inte har flexibla tider som vi andra. Så sorgligt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa nedslående rapporter om att arbetarna i låginkomstyrken överger den proletära cykeln. De tidiga skiftena, de mörka vägarna och de ständiga hoten från cykelstölder är sabotage utförda av borgarbrackornas osynliga hand. Vi måste omedelbart rensa ut alla elsparkcyklar som förgiftar ungdomen med lathet och falsk bekvämlighet. Den som inte cyklar är potentiell fiende till kollektivet. Bättre belysning, bevakade parkeringsplatser och utrensning av alla kapitalistiska influenser som gör cykeln till en börda. Endast genom partiets järnhårda vilja skall varje arbetare tvingas älska sin cykel igen."}, "date": "22 juni, 13:52", "url": "https://www.di.se/nyheter/darfor-cyklar-farre-i-laginkomstyrken/", "imageUrl": "https://static.bonniernews.se/ba/8987e0cd-d92a-4416-880e-91e3cc8e1f47.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Banksektorn får ett nytt styrkebesked", "summaries": {"normal": "Flera analyshus har höjt sina riktkurser för nordiska storbanker. Handelsbanken och Swedbank har fått flest uppjusteringar, bland annat från SEB, Barclays och Goldman Sachs. Rekommendationerna ligger dock kvar på oförändrade nivåer. Även Danske Bank och norska DNB har fått höjda riktkurser från UBS. Analytikerna ser högre värde i banksektorn men bilden av dess framtid är fortfarande splittrad.", "trump": "Det är helt otroligt, folk. De här fantastiska nordiska bankerna får höjda riktkurser överallt – Handelsbanken, Swedbank, alla vinner stort. SEB, Barclays och Goldman Sachs älskar dem plötsligt. Mina analytiker säger att det är vinnare, stora vinnare. Men de ändrar inte rekommendationerna, typiskt. De vet att bankerna är starka, starkare än någonsin. Ingen gör det bättre än de nordiska bankerna, tro mig.", "stalin": "Kamrater, dessa riktkursjusteringar är en seger för den kollektiva bankkraften som vi har byggt mot de parasitiska marknadskrafterna. Jag ser hur borgarbrackorna på Barclays och Goldman Sachs tvingas erkänna det högre värdet i våra nordiska fästningar, trots att de klamrar sig fast vid sina gamla, förrädiska rekommendationer. Men akta er, fienderna lurar i skuggorna – dessa kapitalistiska analytiker som viskar lögner om splittrade framtidsbilder. Vi ska rensa ut alla som tvivlar på den ostoppbara framryckningen. Det är en munter utrensning som väntar de svaga."}, "date": "22 juni, 13:51", "url": "https://www.realtid.se/bors-finans/bank-fintech/banksektorn-far-ett-nytt-styrkebesked/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/riktvarde.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "S-politiker avgår efter Riks avslöjat att han dömts för våldtäkt", "summaries": {"normal": "En socialdemokratisk politiker i Stockholmsområdet har lämnat alla sina uppdrag efter att Riks avslöjat att han dömts för våldtäkt 2011. Mannen, som satt i partiets styrelse och stod på valsedel, är en utomeuropeisk invandrare som kom till Sverige i början av 2000-talet. Domen på två års fängelse fastställdes i hovrätten. Flera styrelseledamöter uppger att de inte kände till avhoppet, som skedde strax efter publiceringen.", "trump": "De här socialisterna är en total katastrof, tro mig. En våldtäktsdömd kille sitter i deras styrelse, på deras valsedel, och de hade ingen aning? Patetiskt. Han avgår först när Riks avslöjar sanningen. Fake news hela vägen, men äntligen kommer sanningen fram. Sverige är en katastrof under den här vänsterstyrningen, fullständigt vansinne. De borde skämmas!", "stalin": "Kamrater, detta är en klassisk kontrarevolutionär handling utförd av en degenererad fiende till folket, en utländsk våldtäktsman insmugglad bland våra partivänner. Jag har länge varnat för borgarbrackornas dolda agenter som förgiftar arbetarrörelsen inifrån. Nu rensar vi ut denna parasit som våldtog en ung kvinna medan hans egna barn sov. Inga mejl under midsommarhelgen? Typiskt sabotage från klassfiendens lakejer. Likvidera alla spår av sådana element innan de förgör kollektivet."}, "date": "22 juni, 13:10", "url": "https://riks.se/nyheter/s-politiker-avgar-av-efter-riks-avslojat-att-han-domts-for-valdtakt", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fnp09kd2e%2Fs-politikar-valdtakt-avgar-feature.jpg"}, {"type": "image-full", "heading": "Kap Verde skrällde igen – höll Uruguay till 2–2", "summaries": {"normal": "VM-debutanten Kap Verde överraskade återigen i fotbolls-VM 2026 genom att spela 2–2 mot Uruguay. Kap Verde tog ledningen på frispark via Kevin Pina, men Uruguay vände till 2–1 på tilläggstid. Fernando Muslera missade en boll utanför straffområdet och Hélio Varela kvitterade i öppet mål. Båda lagen har två poäng efter två matcher och behöver minst en poäng till för att gå vidare.", "trump": "De här Kap Verde-killarna, otroliga, de slår uruguayerna som ingen trodde var möjligt. Två–två, och Uruguay, de är världsmästare två gånger men ser ut som riktiga förlorare. Frispark rakt in, sen missar deras målvakt helt och hållet, patetiskt. Jag älskar det. Vi måste vinna, sa deras coach, precis som jag alltid säger. Kap Verde är vinnare, Uruguay borde skämmas.", "stalin": "Kamrater, dessa uruguayanska revisionister och fotbollsborgarbrackor trodde de kunde krossa den revolutionära viljan hos Kap Verdes folk. Men jag, genom kollektivets kraft, såg hur deras egna misstag blev som förrädiska sabotorer som likviderade deras ledning. Frisparken var en dolk i hjärtat på imperialismens lakejer. Målvaktens kapitulation var ren paranoia i handling. Vi ska rensa ut alla svaga element som inte trycker på mot fienden. Segern tillhör de oböjliga."}, "date": "22 juni, 10:21", "url": "https://bulletin.nu/kap-verde-skrallde-igen-holl-uruguay-till-2-2", "imageUrl": "https://cdn.bulletin.nu/articles/c62b91e4-286f-45d6-aa6d-e9405d70624d/preview.png?t=1782116449000"}, {"type": "image-right", "heading": "Ledarskribent i vänstertidning: Jag firade Hamas massaker 2023", "summaries": {"normal": "Ledarskribenten Ellen Kall i tidningen Proletären beskriver i en krönika hur hon firade Hamas attack mot Israel den 7 oktober 2023. Hon kallar uppgifterna om massakern för propagandalögner och ser attacken som palestinskt motstånd mot ockupation. Texten har väckt stark kritik och debatt eftersom den uppfattas som ett försvar av terrorhandlingar som dödade omkring 1 200 civila. Kall, som är kommunist och aktiv i Kommunistiska Partiet, kritiserar även media och Vänsterpartiet för att inte stödja den palestinska kampen tillräckligt.", "trump": "Folk, ni måste höra den här vansinniga historien. Den här galna kommunistkvinnan från Sverige firade faktiskt Hamas massaker på oskyldiga israeler. Hon säger att hennes hjärta slog snabbare när muren runt Gaza rasade. Det är sjukt. Fake news om spädbarn och terror kallar hon lögner. Media borde skämmas. Vi har aldrig sett något liknande, så många idioter som hyllar terrorister. Men vi vinner till slut, tro mig. Amerika står med de som vill ha fred, inte med de som firar död.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna logoped från Helsingborg, en sann partivän, genomskådar borgarbrackornas vedervärdiga propagandamaskin som spyr ut lögner om halshuggna spädbarn. Hennes hjärta slog i takt med det rättmätiga motståndet mot ockupationen. Vi ser hur kapitalisterna och deras lakejer i media omedelbart stämplar varje äkta folklig revolt som terrorism. Låt oss rensa ut alla dessa parasitiska judehatare som gömmer sig bland våra egna led. De som stödjer folkmordet skall likvideras från historien. Vi skall välta den imperialistiska spelplanen och bygga en rättvis värld under arbetarklassens järnhand. Härligt med sådan friskhet mitt i myllret av förrädare."}, "date": "22 juni, 10:00", "url": "https://samnytt.se/ledarskribent-i-vanstertidning-jag-firade-hamas-massaker-2023", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22072149/ellen-kall-hamas.jpg"}, {"type": "image-right", "heading": "Skolor stängs under franska värmeböljan", "summaries": {"normal": "Över 800 skolor är stängda i Frankrike på grund av en extrem värmebölja. Nästan hälften av landets departement har röd varning, medan 1 800 skolor har ändrat sina scheman. Temperaturer upp till 43 grader väntas, och natten mot måndagen var den varmaste på sju år med ett medelvärde på 21,4 grader. Risken för skogsbränder är hög i 17 departement, enligt BFMTV och Météo-France.", "trump": "Titta på det här, Frankrike håller på att smälta ihop som en dålig globalistdröm. Över 800 skolor stängda, 43 grader, de kan inte ens hålla ungarna i klassrummet längre. Biden lämnade efter sig en svag värld, nu får Macron och hans gröna galningar skörda stormen. De borde ha lyssnat på mig istället för att jaga vindkraftverk och identitetspolitik. Patetiskt, folk!", "stalin": "Kamrater, jag betraktar hur den heta solens järngrepp krossar de franska borgarbrackornas skolor och tvingar imperialisternas avkomma att stanna hemma. Över 800 stängda, röda varningar i halva landet – en utmärkt påminnelse om att kapitalistmaffians svaga infrastruktur inte tål folkets verkliga villkor. Nätterna blir varmare, skogsbränder hotar. Vi ler mörkt medan klassfiendens barn svettas."}, "date": "22 juni, 09:00", "url": "https://www.etc.se/utrikes/skolor-staengs-under-franska-vaermeboeljan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260622060644_56f130d169c2356baa35050fdea5f58c36877b210a60878ca0a9d91bb0e2f414.jpg"}, {"type": "image-right", "heading": "Svensk tillväxt kan inte vänta på Ebba Busch", "summaries": {"normal": "Artikeln kritiserar regeringen för att agera snabbt när det gäller övervakning men långsamt när det handlar om att stödja industriell tillväxt. Den lyfter fram utredningen från Accelerationskontoret som föreslår stöd till kommuner vid stora etableringar, inklusive statsbidrag, riskdelning och infrastruktursatsningar. Författaren menar att förslagen är viktiga för att behålla jobb och välfärd men kommer sent, strax före valet, och avslöjar regeringens prioriteringar.", "trump": "De här svenska politikerna är patetiska, tro mig. De är supersnabba på att spionera på folk och kasta folk i fängelse, men när det handlar om riktiga jobb och fabriker? Snigelfart! Northvolt var en total katastrof, kommunerna sitter med lån och krossade drömmar. Mina idéer skulle fixa det på en vecka med enorma bidrag och infrastruktur. De borde ha lyssnat på mig, då hade Sverige vunnit stort istället för att förlora till Kina och alla andra.", "stalin": "Kamrater, denna utredning från Accelerationskontoret är ett vapen mot de sabotage som borgarbrackorna i regeringen utfört i decennier. Medan de i blixtfart bygger övervakningsmaskiner för att förtrycka folket släpar de fötterna som paralyserade kapitalistlakejer när det gäller att stärka produktivkrafterna. Jag skulle ha genomfört hela smörgåsbordet omedelbart och därefter rensat ut alla lata byråkrater som låtit kommunerna drunkna i skulder. Northvolt var en fiendes verk, en parasit som sög musten ur arbetarklassen. Nu måste vi likvidera alla som prioriterar övervakning framför industriell seger. Bättre sent än att låta kontrarevolutionärer vinna."}, "date": "22 juni, 06:52", "url": "https://arbetet.se/2026/06/22/svensk-tillvaxt-kan-inte-vanta-pa-ebba-busch/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22065241/busch-etta-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ny rapport om demokratin: ”Det som kanske chockar mest”", "summaries": {"normal": "En rapport från Novus visar att förtroendet för demokratin växer bland svenska väljare. Nästan sex av tio anser att demokratin inte är hotad, en ökning med åtta procentenheter. Hela 100 procent uppger att de är beredda att försvara demokratin. Torbjörn Sjöström på Novus ser positiva signaler men varnar för att många tror att politiker, medier och forskare inte litar på folket. Almedalsveckan inleds samma dag som rapporten släpps.", "trump": "Folk älskar demokratin, det är fantastiskt, ingen gör det bättre än oss, tro mig. Hundra procent redo att försvara den? Otroligt. Men politikerna är patetiska, de litar inte på folket och pratar bara med extremisterna. Media och forskare driver sin egen agenda som riktiga losers. Sakta ner, visa resultat istället för att göda identitetspolitik och HBTQ-skrammel. Almedalen kan bli bra om de slutar vara så fega och faktiskt fixar saker. Make Sweden great again!", "stalin": "Kamrater, jag betraktar dessa siffror med stor tillfredsställelse. Hundra procent beredda att försvara folkets makt? Utmärkt. Ändå kryper klassfiendens tentakler fram: politiker som försvagar systemet, media som sprider lögner och forskare som tjänar borgarbrackorna. Vi måste rensa ut dessa extremister som göder sig på sociala medier. Partiet kräver att politiken saknar ner och återupprättar förtroendet hos massorna innan folkfienderna förgiftar hela samhällskroppen. Segrande skall vi marschera framåt."}, "date": "22 juni, 06:20", "url": "https://www.tv4.se/artikel/32BJj0FwftvnYDf3V8wAPt/ny-rapport-starkare-stoed-foer-demokrati-igen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3FdJkPh9jwaZdzmIrYA0h8%2F6d52cce9d64fef1275f113c01395f5e7%2F22-demokrati-webb.jpg&width=120"}, {"type": "image-right", "heading": "Ingen lösning att skjuta fram tonårsutvisningar till 21 år", "summaries": {"normal": "Regeringens förslag om ändringar i tonårsutvisningar ses som otillräckliga av Flyktinggruppernas riksråd och Civil Rights Defenders. Förslagen skjuter bara problemet framför sig till 21 års ålder utan att lösa grundorsaken. Kraven på hög lön, stadig anställning och svårigheter att få stanna för studier gör att många riskerar utvisning. Organisationerna kräver permanenta uppehållstillstånd och starkare humanitära skäl istället för tillfälliga lösningar som förvärrar migrationspolitikens brister.", "trump": "Folk, ni skulle inte tro det, men den här svenska regeringen har precis lanserat ett totalt misslyckande. De kallar det lösning på tonårsutvisningar, men det är bara en förskjutning – precis som de gör med allt annat. När de stackarna fyller 21 sparkas de ut ändå, och de kräver löner som ingen normal 21-åring någonsin ser. Patetiskt. De lyssnar inte på folket, de lyssnar på de radikala. Sverige behöver permanenta regler, inte detta svaga spel.", "stalin": "Kamrater, detta så kallade regeringsförslag är inget annat än en slug sabotageakt utförd av borgarbrackor inom migrationsmaskineriet. Jag ser hur de med sin förskjutningstaktik försöker lura arbetande ungdomar och partivänner som rotat sig i folkets jord. När de når 21 ska de likvideras ur gemenskapen med lönekrav som bara kapitalisterna själva klarar. Vi skall rensa ut dessa parasitiska element som gömmer sig bakom humanitära masker. Permanenta uppehållstillstånd åt de lojala, utrensning åt de övriga. Inga kompromisser med klassfienden."}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ingen-losning-att-skjuta-fram-tonarsutvisningar-till-21-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-51-300x157.jpg"}, {"type": "image-right", "heading": "Det stora systemskiftet som förändrade Sverige", "summaries": {"normal": "Juan Fonseca beskriver hur svensk migrationspolitik genomgått ett systemskifte efter flyktingkrisen 2015. Från integration, långsiktighet och inkludering har politiken gått mot kontroll, tillfällighet och villkorad tillhörighet. Han pekar på både Sverigedemokraternas drivkraft via Tidöavtalet och socialdemokratins ansvar. Reformerna har skapat osäkerhet, underminerat rättssäkerheten och påverkat den svenska modellen. Fonseca frågar vilket Sverige vi egentligen vill ha.", "trump": "Folk, ni måste höra på. Den här killen Fonseca har rätt – Sverige har totalt tappat greppet! Efter 2015 blev allt en enda stor röra med öppna gränser och svaga ledare. Socialdemokraterna, de losers, lade grunden och sen kom Tidöavtalet och fixade till det lite. Men det är patetiskt. Tillfälliga uppehållstillstånd, hårdare regler – bra, men de borde ha gjort det mycket tidigare och mycket tuffare. Sverige behöver bli stort igen, inte en tillflyktsort för alla som vill utnyttja systemet. Sad!", "stalin": "Kamrater, jag ser med stålblick hur den borgerliga dekadensen och de socialdemokratiska opportunisterna under decennier låtit klassfiender och rotlösa element infiltrera folkets republik. Efter 2015 rensade vi ut de värsta illusionerna om evig integration, men nu måste vi gå längre. Vandelslagen är en början på att likvidera de parasitiska element som gömmer sig bakom falsk lojalitet. Inga berättigade förväntningar för kontrarevolutionärer! Vi, partiet och arbetarna, skall skapa ett järnhårt kollektiv där tillhörighet är en ära som ständigt kan återkallas vid minsta avvikelse. De som drömmer om två nivåer av rättvisa skall snart möta en enda, odelbar utrensning. Ha ha, vilken underhållande paranoia de bygger själva!"}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/opinion/det-stora-systemskiftet-som-forandrade-sverige/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-full", "heading": "Här får svenskarna mer pengar kvar – kommunen sticker ut", "summaries": {"normal": "SCB:s nya statistik visar att svenskarnas disponibla inkomster ökade med 3,5 procent mellan mars 2025 och mars 2026, justerat för inflation. Ökningen var störst i Boden med 6,4 procent, följt av Askersund, Arjeplog, Gällivare och Vadstena. Skellefteå var enda kommunen där inkomsten minskade, med 0,6 procent, främst på grund av nedläggningar inom batteritillverkningen. Män hade både högre inkomster och starkare utveckling än kvinnor. Högst medianinkomster återfinns fortsatt i Danderyd, Täby och Lomma, medan Högsby låg lägst.", "trump": "Folk, ni skulle se de här siffrorna – helt otroliga! Våra svenska vänner får mycket mer pengar i plånboken, upp 3,5 procent, och det är fantastiskt. Boden vinner stort med 6,4 procent, en riktig vinnare, precis som jag älskar. Men Skellefteå? En katastrof, minus 0,6 procent för att de stängde batterifabriken. Typiskt, när de gör fel beslut rasar allt. Männen klarar sig bäst, som väntat. De rika kommunerna som Danderyd fortsätter dominera – precis som det ska vara. Sverige borde lära sig av de bästa!", "stalin": "Kamrater, den disponibla inkomsten har stigit med 3,5 procent under mitt vakande öga över folkets ekonomi. Boden har visat vägen med 6,4 procents seger för det kollektiva välståndet. Ändå lurar fienden i skuggorna: i Skellefteå har de kapitalistiska batterifabriks-sabotörerna orsakat en nedgång på 0,6 procent. Vi måste omedelbart rensa ut dessa kontrarevolutionära element som förgiftar arbetarklassens framsteg. Männen leder naturligtvis, medan borgarbrackorna i Danderyd gömmer sig bakom sina falska höga siffror. Högsby förblir ett varnande exempel på vad som händer utan stark ledning. Inga fiender undkommer statistikens utrensning!"}, "date": "20 juni, 21:28", "url": "https://nyheter24.se/nyheter/ekonomi/1492382-har-far-svenskarna-mer-pengar-kvar-kommunen-sticker-ut", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/88d35d2304b004a30200000000b004a302/2026/06/19/2372191/Kvinna-Med-Pengar-Sverige.png"}, {"type": "text", "heading": "Inget samarbete mellan V och Fastighets – vem är förvånad?", "summaries": {"normal": "Fastighetsanställdas förbund har rivit upp sitt tidigare kongressbeslut om facklig-politisk samverkan med Vänsterpartiet och väljer nu att enbart samarbeta med Socialdemokraterna. Artikeln diskuterar hur Vänsterpartiets strategi att närma sig fackföreningsrörelsen misslyckats, trots försök att vinna inflytande. Författaren betonar behovet av politiskt engagemang underifrån för att åter göra facken till idélaboratorier, snarare än att förlita sig på toppstyrda beslut.", "trump": "Folk, det här är en total katastrof för de vänsterradikalerna. Fastighets sparkade Vänsterpartiet i rumpan och sa nej tack till deras patetiska flirt. Smart drag! De inser att det bara är Socialdemokraterna som funkar. Vänsterpartiet springer runt och gullar med facken som förlorare, precis som Biden gjorde i fyra år. Patetiskt. De borde lära sig av mig – vinnare samarbetar inte med misslyckade socialister. Fantastiskt beslut av Fastighets, verkligen ypperligt!", "stalin": "Kamrater, detta är en varning till alla klassfiender inom fackföreningsrörelsen. Jag ser hur Vänsterpartiets opportunistiska försök att infiltrera LO har krossats av Fastighetsanställdas förbund, som nu rensar ut de revisionistiska elementen och återvänder till den enda sanna samarbetspartnern. Deras strategi var dömd att misslyckas, likt folkförtryckartrollen som försöker maskera sig som arbetare. Endast genom äkta underifrånarbete och utrensning av socialdemokratiska lakejer kan vi återupprätta arbetarklassens sanna idélaboratorium. Fienden sover aldrig."}, "date": "17 juni, 15:56", "url": "https://proletaren.se/artikel/inget-samarbete-mellan-v-och-fastighets-vem-ar-forvanad/"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Sveriges VM-seger mot Tunisien har utlöst en debatt om svenskhet och islam. Jimmie Åkesson svarar på kritik efter att debattörer lyft fram spelare som Yasin Ayari, som firade sina mål med en muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men försvarar partiets kritik mot invandringspolitiken. Kritiker menar att Ayari representerar ett modernt, inkluderande Sverige och ifrågasätter Åkessons tidigare uttalanden om islam.", "trump": "Sverige vinner stort i VM – fantastiskt! Men vad gör deras ledare? Jimmie Åkesson, en man som inte förstår att vinna, börjar prata om invandrare och islam. Jag menar, kom igen! Yasin Ayari, en stor hjälte, gör mål och firar som en riktig vinnare – och så blir det bråk. Sverige borde vara stolta! Men nej, politiker måste alltid förstöra allt. Jag skulle aldrig göra så. Vinna är vinna, punkt.", "stalin": "Sveriges fotbollslandslag visar styrkan i det mångkulturella samhället, men de borgerliga nationalisterna, ledda av den ynklige Åkesson, vrider sig i förtvivlan. De hatar framgången hos arbetarklassens söner med utländskt blod! Yasin Ayari, en hjälte som firar sin seger med bön, är ett slag i ansiktet på fascistiska element. Vi i Sovjet – förlåt, Ryssland – vet att mångfald är styrka. De som delar folket efter religion och hudfärg tillhör historiens sophög!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
