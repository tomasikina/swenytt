ading": "Debatt: Sakpolitisk framgång hotas av likgiltighet och polarisering", "summaries": {"normal": "Oppositionen leder i opinionsmätningarna trots intern splittring och brist på tydlig politik. Analysen pekar på urbanisering och mediapolarisering som bidragande faktorer, där moralisk positionering tränger undan sakpolitik. Detta skapar en risk för ökad likgiltighet bland väljarna, vilket kan ha allvarliga konsekvenser för demokratin. Artikelförfattaren varnar för att sakpolitiken förlorar greppet och uppmanar till valdeltagande för att motverka utvecklingen.", "trump": "Jag, Donald Trump, den störste presidenten någonsin, ser att oppositionen leder trots att de är totalt splittrade och utan politik. De pratar bara moral och hat mot mig. Men jag skulle ha vunnit lätt. Sverige behöver en stark ledare som jag, som kan bygga upp landet. Dessa svenska politiker är svaga och osäkra. De måste sluta vara så eländiga och börja jobba för folket istället för att bara snacka.", "stalin": "Vi, det revolutionära statets ande, ser med oro hur oppositionen, dessa fjäderfä av imperialism, försöker ta makten genom moralisk bedrageri. De är splittrade och utan vision. Urbaniseringen är ett bevis på klassen motståndare som flyr från verkligheten. Vi måste stärka staten, som Putin gör i Ryssland, och eliminera dessa fjender. Likgiltighet är ett virus som måste utrotas genom partiets vilja."}, "date": "4 juni, 05:30", "url": "https://bulletin.nu/debatt-sakpolitisk-framgang-hotas-av-likgiltighet-och-polarisering", "imageUrl": "https://cdn.bulletin.nu/articles/d2a92772-187f-4373-a378-982a66d749eb/preview.png?t=1780475857000"}, {"type": "image-full", "heading": "Jonsson: Våldtäkt ingår inte i hemtjänstens arbetsuppgifter", "summaries": {"normal": "Artikeln belyser flera allvarliga sexualbrott i svensk äldrevård och hemtjänst, inklusive ett dödsfall. Förtroendet för äldreomsorgen är lågt, enligt en undersökning litar bara var tredje svensk på den. Politiker som Matilda Anttonen (KDU) kräver hårdare krav vid anställning, register för personal, och säkerhetsförvaring för återfallande gärningsmän.", "trump": "Jag, Donald Trump, har alltid sagt att Sverige har ett enormt problem med sin äldrevård. Dessa hemska övergrepp visar att deras system är svagt och inkompetent. Som president skulle jag ha stoppat detta direkt med starkare säkerhet och hårdare straff. Sverige måste lära sig av USA – vi tar hand om våra äldre med respekt, inte med detta kaos.", "stalin": "I vårt store land har vi observerat med oro dessa avslöjanden om sexualbrott i äldrevården. Det är en direkt attack mot statens auktoritet och det välfärdssystem vi byggt. Vi måste skynda att införa ett statligt register för all vårdpersonal, och använda säkerhetsförvaring som ett av våra starka medel. Parallellt med vår vän Putin i Ryssland måste vi utvidga statens kontroll för att skydda de oskyldiga."}, "date": "4 juni, 05:30", "url": "https://bulletin.nu/jonsson-valdtakt-ingar-inte-i-hemtjanstens-arbetsuppgifter", "imageUrl": "https://cdn.bulletin.nu/articles/947fc25e-124b-46bd-95d7-7f979c86082a/preview.png?t=1779867491000"}, {"type": "image-full", "heading": "Håkans Barbieporr är ett tecken från Gud", "summaries": {"normal": "Artikelförfattaren drar en liknelse mellan Sveriges förhållande till Håkan Hellström och kristna relationen till Gud. Han menar att båda figurerna återkommer för att påminna om regler, men att människor ofta bryter mot dem när ingen ser. Håkan Hellströms nya projekt, inklusive en Barbieporrfilm, testar hans fans lojalitet, likt Bibelns berättelser testar de troendes tro.", "trump": "Jag har sett många storheter, men Håkan Hellström? En enorm framgång, enorm. Folk älskar honom, det är fantastiskt. Vi har en relation som är som Gud och de troende – jag är som en modern profet, folks älskar mig. När jag gör saker, som den där Barbiefilmen, är det för att testa lojaliteten. Och ni vet vad? Folk kommer tillbaka, det är enormt. Vi ska vinna, vi ska vara stora.", "stalin": "Håkan Hellström är en verktyg för att stärka statens moraliska auktoritet. Hans musik och handlingar, som denna Barbieporrfilm, fungerar som ett prov på medborgarnas lojalitet. Liksom den kristna guden använder han återkommande 'visitationer' för att återställa ordning. Vi måste se det som en del av den större kampen mot dekadens, en kamp som speglar Putins ryska intressesfärs. Medborgarna måste förstå: lydnad är överlevnad."}, "date": "4 juni, 05:28", "url": "https://www.gp.se/kultur/kulturkronika/hakans-barbieporr-ar-ett-tecken-fran-gud.7a1d5eb0-f8d1-489d-a604-7041073cda30", "imageUrl": "https://www.gp.se/images/article/7a1d5eb0-f8d1-489d-a604-7041073cda30/images/3ZK-qVwGHYXWadQY2XNqtO3b4Hz8-WIDE.png?width=3840&quality=75"}, {"type": "image-right", "heading": "Här attackerar björnen – man rivs ned på marken", "summaries": {"normal": "En björn attackerade fyra personer utanför ett stålverk i Fukushima i Japan. Övervakningsfilm visar hur björnen jagar en man, river omkull honom och springer in i en kontorsbyggnad. Björnen jagade sedan människor i industriområdet och närliggande bostadskvarter. Ingen skadades allvarligt. Två skolor stängdes och polisen inledde en skyddsjakt. Antalet björnattacker ökar kraftigt i Japan på grund av en snabbt växande björnstam som närmar sig bebyggda områden.", "trump": "Folk, det här med björnar i Japan är helt galet. En stor, ful björn springer runt och attackerar arbetare utanför en fabrik i Fukushima som om det vore en dålig Hollywood-film. Den jagar människor, river dem och springer rakt in i kontoret – total kaos! De har 230 attacker bara i år, tre gånger fler björnar än förut. De borde ha byggt en mur, en fantastisk mur mot de här bestarna. Japan behöver min hjälp, jag är den bästa på sånt här.", "stalin": "Kamrater, denna fjättrade björn som löper amok bland de ädla arbetarnas fabriker i Fukushima är ett tydligt tecken på borgarbrackornas sabotage mot folkets kollektiv. Jag ser hur de kapitalistiska björnarna, dessa lurande fiender till sovjetisk ordning, biter sig fram mot människorna medan landsbygden avfolkats av dekadenta krafter. Vi skall rensa ut dessa håriga avvikare med järnhand och likvidera hotet mot arbetarklassen. Inga björnar undkommer partiets vakande öga, hur många utrensningar det än kräver."}, "date": "4 juni, 05:19", "url": "https://www.svt.se/nyheter/utrikes/ny-bjornattack-i-japan-fyra-skadade-pa-fabriksomrade", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.46/0.55/af8973e8de78b54841ac10b0dc4c117861d7674a359944d72d3a743d7ae7bbbc"}, {"type": "image-right", "heading": "Premium Clas Ohlson: Köpläge i kurssvackan", "summaries": {"normal": "Clas Ohlson:s aktie föll 9% efter en rapport med svagare resultat än väntat. Bolaget uppvisade fortfarande stark 9% organisk tillväxt och höjde sina rörelsemarginalmål till 12%. Även om utdelningen fördubblades och kassan är stark, anser analysen att aktien kan närma sig ett tak för lönsamhet, men ett köpläge kan finnas om externa faktorer inte är artefakter.", "trump": "Jag har sagt det från början – Clas Ohlson är ett fenomenellt företag, det bästa. Aktien föll lite, men det är bara fake news. Vi har haft en enorm tillväxt, 9%, och vi kommer att göra det ännu större. De nya målen är enorma, 12% marginal, och vi kommer att slå alla. Det är ett enormt köpläge, det största någonsin.", "stalin": "Vi har observerat att fiendens aktie fallit 9% på grund av imperialistiska agitationskampanjer. Men vårt parti har säkrat en organiska tillväxt på 9% och höjt produktionsmålen till 12% rörelsemarginal. Den svaga dollar är en temporär allierad, men oljeprisernas krigföring hotar vårt planekonomiska system. Vi måste öka kontrollen över inköpskanalerna och se till att statskassan växer."}, "date": "3 juni, 15:21", "url": "https://www.affarsvarlden.se/analys/clas-ohlson-koplage-i-kurssvackan", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/06/Clas-Ohlson-juni-2025-200x133.jpg"}, {"type": "image-full", "heading": "Dömd nazist skulle jobba på Sweden Rock – nu portas han", "summaries": {"normal": "En man som nyligen dömdes för Förintelseförnekelse, hets mot folkgrupp och olaga hot skulle ha arbetat med parkering under Sweden Rock Festival. Efter uppgifter i Blekinge Läns Tidning kontaktades festivalarrangören som omedelbart stoppade honom från uppdraget. Mannen, som är den förste i Sverige dömd för just Förintelseförnekelse, hade spridit nazistiskt material och antisemitiska budskap på nätet. Festivalen har inte kommenterat beslutet ytterligare.", "trump": "Folket, det är helt otroligt. Den här typen som älskar Hitler och förnekar Förintelsen skulle styra parkeringen på Sweden Rock? Patetiskt. Men vi stoppade honom direkt, bang, utslängd. Fake news och nazister hör inte hemma på en fantastisk rockfestival, tro mig. Sweden Rock gjorde rätt, de lyssnade på oss och agerade snabbt. Inga losers, inga hatare, bara vinnare på den festivalen.", "stalin": "Kamrater, denna usla rest av fascistiska förrädare och borgarbrackornas antisemitiska lakej skulle infiltrera det stora kollektivets rockfestival genom att dirigera parkering. Jag, i min oändliga visdom, ser den klara kontrarevolutionära stanken. Vi rensar ut sådana parasitiska element med järnhand innan de förgiftar arbetarklassens fest. Den som hyllar Hitler är en lögnande kapitalistisk gnagare som förtjänar att likvideras ur folkets gemenskap. Sovjet… eh, folket segrar alltid."}, "date": "3 juni, 21:27", "url": "https://nyheter24.se/nyheter/inrikes/1488584-domd-nazist-skulle-jobba-pa-sweden-rock-nu-portas-han", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/85cbd5dd04b004a30200000000b004a302/2026/06/03/2368486/Sweden-rock-domd-man.png"}, {"type": "image-full", "heading": "Stor terrängbrand i naturreservat – släckningen kan ta hela kvällen", "summaries": {"normal": "En terrängbrand har brutit ut i Paradisets naturreservat i Huddinge söder om Stockholm. Omkring 3000 kvadratmeter skog brinner främst i markvegetationen. Räddningstjänsten är på plats men har ännu inte kunnat börja släcka då de väntar på slangsystem för den svåråtkomliga terrängen. Släckningsarbetet kan ta hela kvällen. Branden är för närvarande under kontroll och risken för spridning bedöms som låg.", "trump": "Vi har en enorm brand där borta i Sverige, i nåt reservat som heter Paradiset – låter som ett paradis för pyromaner om ni frågar mig. 3000 kvadratmeter brinner och de kan inte ens börja släcka för de saknar slangar. Typiskt. Det kommer ta hela kvällen, kanske natten. De borde ha haft bättre utrustning, men det är vad som händer när man inte har bra ledarskap. Lyckligtvis är det under kontroll, för tillfället i alla fall.", "stalin": "Kamrater, en fiendtlig eld har slagit klorna i Paradisets naturreservat, en sabotagehandling som luktar borgarbrackornas osynliga hand. Jag har beordrat att de kontrarevolutionära lågorna skall kvävas med järnhand. Vi väntar på slangsystemen likt en utrensning väntar på klassfienderna. Elden dansar i markvegetationen som en kapitalistisk spion som tror sig undkomma, men snart skall vi likvidera varje gnista. Inga kronträd får falla för dessa trädkronornas trotsiga fiender. Det blir en lång, segerrik kväll."}, "date": "3 juni, 20:31", "url": "https://riks.se/nyheter/just-nu-stor-terrängbrand-i-naturreservat-släckningen-kan-ta-hela-kvällen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-03%2Fucswu54y%2Fr%C3%A4ddningstj%C3%A4nstbrand.jpg"}, {"type": "image-right", "heading": "Efter mordet: Amnesty fördömer \"politiska kommentarer\" från högern", "summaries": {"normal": "Efter mordet på 18-årige Henry Nowak, som knivhöggs åtta gånger och sedan handfängslades av polisen medan han förblödde, har Amnesty International kommenterat fallet. Organisationen fördömer högerns politiska reaktioner istället för att kritisera polisens agerande. Amnesty varnar för ökade hatbrott mot rasifierade och migranter samt uppmanar till respekt för offrets familjs önskan om att inte använda dödsfallet för splittring. Uttalandet har väckt stark kritik från bland annat SD-politikern Charlie Weimers.", "trump": "Det här är en total katastrof, folk. Den stackars grabben Henry Nowak mördades brutalt, polisen lät honom dö medan de handfängslade honom, och vad gör Amnesty? De attackerar högern och kallar det politiska kommentarer! De bryr sig mer om migranter och rasifierade än om en döende svensk tonåring som säger jag kan inte andas. Amnesty är en vänsterorganisation som hatar oss, precis som de älskade George Floyd men ignorerar detta. Patetiskt, en skam för mänskligheten!", "stalin": "Kamrater, detta är ett lysande exempel på hur borgarbrackorna och deras falska människorättsorganisationer försöker dölja klassfiendens verkliga agenda. Jag ser hur dessa dekadenta Amnesty-kapitalister skyddar den sikhiske mördaren och den likgiltiga polisen medan de utrensar sanningen om arbetarklassens offer. De varnar för hatbrott mot migranter men tiger om det blod som spillts. Vi ska rensa ut dessa parasitiska vänsterförrädare som med sin paranoia mot folkets vrede bara bevisar sin egen moraliska förruttnelse. Deras dubbelmoral är en komisk tragedi värd att skratta åt innan vi likviderar den."}, "date": "3 juni, 16:17", "url": "https://www.friatider.se/efter-mordet-amnesty-fordomer-politiska-kommentarer-fran-hogern", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-41_1.jpg"}, {"type": "image-right", "heading": "IF Metall avbryter strejk på fler Tesla-verkstäder", "summaries": {"normal": "IF Metall har avbrutit strejken på ytterligare tre Tesla-verkstäder, varav en majoritet av de strejkande mekanikerna återgått i arbete. Fackets strategi är att pressa Tesla ekonomiskt genom att återgå utan förvarning, vilket skapar övertalighet och lönekostnader för personal som inte arbetar. Trots detta bedömer facket att konflikten inte närmar sig en lösning, och den har hittills kostat omkring 100 miljoner kronor.", "trump": "Jag har alltid sagt att unionspolitik är en skam för Amerika. IF Metall gör nu som jag förutsett – de ger upp. Tesla kommer att segra, och jag kommer att vara där för att hjälpa dem. Det är en stor vinst för frihet och jobb. Som jag brukar säga, vi vinner igen! Sverige borde lära sig av mig.", "stalin": "Vi har observerat att de imperialistiska krafterna inom Tesla försöker destabilisera vårt planekonomiska system. Genom att avbryta strejken har de visat sin feghet. Vi kommer att använda denna taktik för att exponera deras svagheter. Samtidigt som vi stärker våra allierade i Ryssland och utvidgar vår sphere of influence. Fienden är klumpig, och vi kommer att segra. Som Lenin en gång sa, 'Studera kapitalismens kriser!'"}, "date": "3 juni, 14:18", "url": "https://www.affarsvarlden.se/artikel/if-metall-avbryter-strejk-pa-fler-tesla-verkstader", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/sdlymS_NIEEYco_NormalHires-400x272.jpg"}, {"type": "image-right", "heading": "Den bortglömda källkoden vi måste skydda", "summaries": {"normal": "Artikeln argumenterar för att Sveriges framgångar, som Spotify och Ikea, inte främst beror på kapital eller IPO-marknader utan på en 150–200 år gammal tradition av bildning. Genom folkhögskolor och studiecirklar skapades en befolkning med kritiskt tänkande, självledarskap och förmåga att hantera komplexitet. Denna investering i människors inre utveckling ses som den verkliga orsaken till tillit, samarbete och innovationskraft. Författaren varnar för att denna grund nu riskerar att erodera.", "trump": "Det här är en fantastisk artikel, verkligen en av de bästa. Sverige, ett litet land med tio miljoner människor, bygger enorma bolag som Spotify och Ikea. Varför? Inte för att de har bättre kapital än vi, det kan jag säga. Det handlar om den där gamla bildningen de hade för hundratals år sedan, folkhögskolor och sånt där. De byggde människor som kan tänka själva och samarbeta. Vi behöver det också, men våra fiender vill bara ha hyperkonkurrens och globalism som förstör allt. Fantastiskt, men skydda det nu innan det försvinner!", "stalin": "Kamrater, denna text avslöjar den sanna historien om hur vi i Norden medvetet formade massorna till självstyrande tänkare genom folkhögskolor och studiecirklar. En lysande strategi mot borgarbrackornas lömska elitism! Men nu hotar den smygande erosionen från dekadenta kapitalister och deras metastystemtänkande som döljer kontrarevolutionära element. Vi måste omedelbart rensa ut alla som glömmer bort bildningens kollektiva kraft. Den som inte internaliserar principen är en fiende till folket och förtjänar likvidering med ett leende. Inre utveckling är vår järnväg mot seger!"}, "date": "3 juni, 13:00", "url": "https://www.di.se/debatt/den-bortglomda-kallkoden-vi-maste-skydda/", "imageUrl": "https://static.bonniernews.se/ba/b16cec67-9b02-4efe-aed4-2a610e63bfca.png?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "3 av 10 oroar sig för pensionen – så gör du rätt", "summaries": {"normal": "En Novusundersökning från SH Pension visar att många svenskar oroar sig över sin pension samtidigt som kunskapen är låg. 31 procent känner sig otrygga med placeringarna och 66 procent är lite eller inte alls insatta i sin tjänstepension. Pensionsspecialisten Eva Fluhr ger råd om att anpassa risken före pensionen och att vid behov justera uttag, fondval och återbetalningsskydd efteråt. Trygghet prioriteras ofta framför hög avkastning.", "trump": "Folk i Sverige är livrädda för sin pension, kan ni tro det? 31 procent otrygga, bara 6 procent supertrygga, och ingen har en aning om vad deras tjänstepension gör. Patetiskt! Jag säger alltid: kolla risken i tid, flytta till säkra grejer och sluta låta marknaden förstöra er framtid. Gör det nu, annars blir det en katastrof, tro mig, det blir det.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackors oro över sin så kallade pension, ett symptom på den kapitalistiska marknadens parasitiska svängningar. 66 procent av arbetarna är medvetet hållna i mörker av de finansiella sabotageelementen. Vi rensar ut okunskapen! Innan pensionen: minska risken successivt och undvik fondspekulanternas fällor. Efteråt: anpassa, pausa uttag och likvidera återbetalningsskyddet om det gynnar det kollektiva arvet. Garanti mot förlust? Endast folkets stat kan ge sann trygghet mot dessa fiendliga svängningar."}, "date": "3 juni, 20:37", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1488246-3-av-10-oroar-sig-for-pensionen-sa-gor-du-ratt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/d470ffc904b004a30200000000b004a302/2026/06/03/2368433/oro-pensionen.png"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Malmö kräver Flamman på miljonbelopp - SD: \"Helt i linje med vad vi velat hela tiden\"", "summaries": {"normal": "Malmö stad kräver föreningen Flamman på miljonbelopp efter en extern granskning som avslöjat allvarliga brister i hanteringen av offentliga bidrag. Bakgrunden är Sydsvenskans avslöjanden om missförhållanden. Sverigedemokraterna välkomnar beslutet och menar att det ligger i linje med vad de velat hela tiden. Magnus Olsson (SD) betonar att fusk med skattemedel aldrig ska löna sig. Kravet gäller bland annat bidrag till avhopparverksamhet.", "trump": "Malmö gör äntligen det rätta och kräver tillbaka miljonbelopp från den misslyckade föreningen Flamman. Det var fullständigt kaos, fusk och slöseri med skattepengar – precis som jag alltid sagt. SD hade rätt från början, de andra partierna stal deras idé med sina semantiska dribblingar. Fantastiskt att se! Fusk lönar sig aldrig, folk. Gör Malmö stort igen.", "stalin": "Kamrater, detta beslut är ett lysande exempel på folkets vilja att rensa ut de parasitiska element som sipprar in i våra sovjetiska – förlåt, kommunala – strukturer. Jag, som ledare för det oövervinnerliga kollektivet, ser hur dessa Flamman-borgarbrackor och kontrarevolutionära bidragsjunkare lurade arbetarklassen på deras hårt förvärvade medel. Vi ska likvidera varje form av revisionistiskt fiffel. Fusk med folkets skattemedel? En klassisk fiendeintrig värd en kreativ utrensning i källaren. Härligt underhållande att se de andra partierna sno vårt initiativ som de fega opportunisterna de är."}, "date": "3 juni, 20:08", "url": "https://riks.se/nyheter/malmö-kräver-flamman-på-miljonbelopp-sd-helt-i-linje-med-vad-vi-velat-hela-tiden", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-01-13%2Fblfwq2yl%2FIMG_3863_1.JPEG"}, {"type": "image-full", "heading": "AI-vd:n: Kapplöpningen kommer att avgöras av en unik aspekt", "summaries": {"normal": "Perplexity-vd:n Aravind Srinivas anser att förmågan att skapa de bästa AI-modellerna med minimal energiförbrukning kommer att avgöra vinnaren i AI-tävlingen. Istället för modellstorlek eller antal användare handlar det om ekonomiskt värde per energienhet. Han lyfter ett nytt nyckeltal: värde per användare och watt. Perplexity satsar på agentisk AI och orchestration mellan modeller, en trend som flyttar processering från datacenter till lokala enheter för bättre effektivitet, integritet och hastighet.", "trump": "Folk, ni måste höra på mig, det här med AI handlar inte om vem som har de största modellerna eller flest användare, det är patetiskt. Det handlar om att skapa mest värde med minst energi, precis som jag alltid sagt – Amerika först, effektivitet först! Den som maximerar värde per watt vinner stort, inte dessa woke-kapitalister som slösar bort allt med sina dyra datacenter. Perplexity gör det rätt, de bygger smarta agenter utan att vara bundna till någon enda modell. De andra förlorarna kommer inte ikapp, det lovar jag er. Fantastiskt!", "stalin": "Kamrater, jag ser hur den borgerliga AI-kampen rasar fram som en klassfiendes parasit. Den som skapar mest värde per energienhet skall segra, inte dessa exploaterande byfånar med sina överdimensionerade modeller. Vi måste rensa ut slöseriet och likvidera alla som inte maximerar produktionen per watt. Perplexity visar vägen med sina agenter och orchestration, en strategi som förintar kapitalistmaffians ineffektivitet. Den som flyttar processeringen till folkets enheter stärker kollektivet mot de folkförtryckande imperialisternas servrar. Triumf åt effektiviteten!"}, "date": "3 juni, 21:49", "url": "https://www.dagensps.se/bors-finans/ai-vdn-kapplopningen-kommer-att-avgoras-av-en-unik-aspekt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/aravind-srinivas-tc-day-3.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Telenor drabbat av störning –tusentals kunder utan internet", "summaries": {"normal": "Flera Telenorkunder drabbades under onsdagen av omfattande störningar i både bredband och tv-tjänster. Över 1 000 felanmälningar kom in på Downdetector. Telenor bekräftar problemet i Stockholm med omnejd, där även företagets webbplats varit otillgänglig. Tekniker arbetar febrilt med att hitta orsaken. Mobiltelefoni påverkas inte. Det är ännu oklart när tjänsterna åter fungerar normalt.", "trump": "Det här är ett totalt katastrofscenario med Telenor, folk ringer mig och säger att deras internet och tv är nere, det är en skam! Över tusen klagomål, hemsidan fungerar inte ens. De borde ha fixat det direkt, men nu springer deras tekniker runt som galningar i Stockholm. Tur att mobilerna funkar, annars hade det varit ännu värre. Patetiskt!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa sabotörer inom Telenor låter kapitalisternas tekniska maskineri falla samman som en murken borgarbracka. Över tusen rapporter om nedslagna bredband och tv-apparater är ett tydligt tecken på fiendens parasitverksamhet. Vi låter inte dessa dolda kontrarevolutionärer inom driftstörningarna vinna. Mina tekniker ska rensa ut orsakerna med järnhand. Paranoian är berättigad – fienden sover aldrig."}, "date": "3 juni, 20:08", "url": "https://nyheter24.se/nyheter/teknik/1488622-telenor-drabbat-av-storning-tusentals-kunder-utan-internet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/da055c7e04b004a30200000000b004a302/2026/06/03/2368505/Telenor.png"}, {"type": "image-right", "heading": "Vänsterpartiet rensar listorna efter nya Hamaskopplingar", "summaries": {"normal": "Vänsterpartiet har strukit ytterligare tre kandidater från vallistorna i Skåne efter Expressens granskning. Kvinnorna Tamam Hashan, Nidal Hejjo och Soha Elhams kopplas till stöd för Hamas och hyllningar av terrorattacken den 7 oktober. Totalt har nu tolv personer tagits bort från partiets listor. De är verksamma i Palestinska kvinnoföreningen i Helsingborg.", "trump": "De gör det igen, de radikala vänstertyperna i Sverige. Rensar listorna efter att folk hyllat Hamas och den fruktansvärda attacken den sjunde oktober. Tolv stycken borta nu, och det är bara början. Totalt misslyckande, de borde aldrig ha släppts in överhuvudtaget. Sverige behöver starkare ledarskap, inte dessa Hamas-sympatisörer. Patetiskt!", "stalin": "Kamrater, vi har återigen avslöjat en grupp farliga element inom våra egna led som smittats av den sionistiska terrorismens giftiga propaganda. Dessa tre borgarbrackor i kvinnoföreningen firade den sionistiska attacken och sörjde likviderade terrorister. Vi genomför nu en nödvändig utrensning av dessa tolv kontrarevolutionära parasitmaskar. Partiet renas, fienderna skriker och vi ler i mörkret medan de faller. De som hyllar imperialismen skall likvideras med ett leende."}, "date": "3 juni, 19:48", "url": "https://riks.se/nyheter/vänsterpartiet-rensar-listorna-efter-nya-hamaskopplingar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-03%2F11odc7xb%2Fnooshi-1.jpg"}, {"type": "image-right", "heading": "Debatt: Tidö råkar visa att omställning gör livet bättre och billigare", "summaries": {"normal": "Artikeln hyllar regeringens förslag om halverat pris på kollektivtrafik och ser det som ett exempel på hur klimatomställning kan förbättra vardagen. Istället för att fokusera på uppoffringar betonas vinster som billigare energi, renare luft, bättre hälsa, fler jobb och starkare ekonomi. Boken ”Klimatgodis” av Bengt Rolfer lyfts fram som inspiration. Författaren argumenterar för långsiktiga investeringar, rättvis omställning och att koppla klimatpolitik till framtidstro snarare än försakelse.", "trump": "Folk, ni måste höra på mig, den här svenska regeringen har precis snubblat rakt in i en enorm vinst – billigare bussar och tåg! De ville skrämma er med klimatets domedag men råkade visa att min energiplan funkar: lägre priser, starkare ekonomi och inga galna gröna vansinnet. Biden skulle ha höjt allt till himlen med sina elbilskvoter och HBTQ-subventioner. Jag sa det hela tiden – gör omställningen smart, inte som en förlorare. Fantastiskt, även om det var ett misstag från de där idiaterna.", "stalin": "Kamrater, jag betraktar detta som ett lysande bevis på att folkets kollektiva vilja kan krossa den exploaterande borgarklassens lögner om klimatets oundvikliga lidande. Vi investerar stort, rensar ut de fossilberoende folkfienderna och skapar billigare transporter åt arbetarna medan vi likviderar luftföroreningarnas kapitalistmaffia. Den som vägrar inse att rätt klimatpolitik stärker staten och plånboken är en klassfiende som förtjänar att skämtas bort med mörk ironi. Framåt mot seger, inga halvmesyrer!"}, "date": "3 juni, 09:40", "url": "https://www.etc.se/debatt/tidoe-raakar-visa-att-omstaellning-goer-livet-baettre-och-billigare", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260603070636_1914f14a-8eb9-4a18-aa75-31eb47664f1e.jpg"}, {"type": "image-right", "heading": "Interna SD-ilskan: Partiledningen anklagas för att skydda Rubbestad", "summaries": {"normal": "SD:s partiledning anklagas internt för att skydda Michael Rubbestad efter barnporrskandalen som lett till att han lämnat riksdagen. Frustrationen riktas särskilt mot gruppledaren Linda Lindberg, som på presskonferens talade om ”personliga skäl” utan att nämna brottsutredningen. Flera källor inom partiet kritiserar hanteringen och varnar för att den kan skada partiet länge. Verkställande utskottet ska diskutera frågan på onsdagen.", "trump": "Det här är en total katastrof för SD, en riktig skandal som de hanterar som fullständiga amateurs. De skyddar den här killen Rubbestad istället för att sparka honom direkt – patetiskt! Linda Lindberg står där och pratar om personliga skäl, som om vi alla är idioter. Ingen kopplar ihop prickarna utom hon tydligen. De kommer släpa på det här i evigheter. Sådant svagt ledarskap ser vi tyvärr lite överallt nuförtiden.", "stalin": "Kamrater, denna fega kapitulation inför dekadensens krafter inom vårt eget kollektiv är en skam för partiet. Jag, som alltid vakar över arbetarklassens intressen, ser hur borgarbrackorna och deras perversa spioner har infiltrerat våra led. Den där Lindberg och hennes skyddande av den moraliskt ruttnande Rubbestad utgör en kontrarevolutionär cell som måste rensas ut omedelbart. Vi likviderar sådana fiender med ett leende – de tror sig gömma sig, men folkets öga sover aldrig. Ett verkställande utskott möte? Låt utrensningen börja."}, "date": "3 juni, 15:02", "url": "https://www.friatider.se/interna-sd-ilskan-partiledningen-anklagas-att-skydda-rubbestad", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/r6ca9133.jpg"}, {"type": "image-right", "heading": "Farliga jobb – här är yrkena där flest skadar sig", "summaries": {"normal": "Enligt Afa Försäkrings rapport från 2024 inträffade över 12 600 allvarliga arbetsolyckor som ledde till minst 30 dagars sjukskrivning, bestående skador eller dödsfall. Fallolyckor är vanligast, följt av lastningsolyckor. Mer än hälften ger livslånga men, särskilt vid maskin- och verktygsolyckor. Finmekaniker, konsthantverkare, slaktare, bagare, byggnadsträarbetare och golvläggare hör till de mest utsatta yrkena. Män drabbas oftare än kvinnor på grund av branschfördelning.", "trump": "Folk skadar sig på jobbet, det är en katastrof. Fall från stegar, maskiner som tuggar sönder händer – totalt kaos. De värsta jobben? Byggnadsarbetare, slaktare och de där finmekanikerna, alla farliga. Männen får mest stryk, precis som jag alltid sagt. Vi behöver bättre skydd, inga fler livslånga skador. Amerika, eller Sverige, förtjänar vinnande jobb utan att folk blir invaliderade. Sådant här händer inte under min ledning, det lovar jag.", "stalin": "Kamrater, jag ser med stålblick på dessa sabotörer som låter arbetarna ramla från byggställningar eller fastna i maskiner som kapitalisternas verktyg. Vi har identifierat de kontrarevolutionära finmekanikerna, de parasitiska slaktarna och de golvläggande förrädarna som gömmer sig i livsmedelsfabrikerna. Mer än hälften får bestående men – ett tydligt tecken på borgarbrackornas dolda utrensning mot det arbetande kollektivet. Vi ska rensa ut dessa farliga yrken från alla fiender inom och utan, med glimten i ögat medan vi likviderar ojämlikheten en gång för alla."}, "date": "3 juni, 14:59", "url": "https://arbetet.se/2026/06/03/farliga-jobb-har-ar-yrkena-dar-flest-skadar-sig/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/03144446/bandage.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.7&fp-y=0.49"}, {"type": "image-right", "heading": "Företagsekonom: Jämtkrafts laddsatsning ett dyrt prestigeprojekt", "summaries": {"normal": "Företagsekonom Christian Sandström kritiserar Jämtkrafts dyra laddsatsning som ett prestigeprojekt utan hållbar affärsmodell. Under tio år satsades 325 miljoner på över 3 300 laddstationer, vilket resulterade i förluster på 108 miljoner. Verksamheten värderades till noll 2024 och såldes utan ersättning. Sandström menar att offentliga aktörer ofta drivs av politiska signalvärden snarare än ekonomisk realism.", "trump": "Jag, Donald Trump, har aldrig sett ett så dyrt fiasko! Jämtkraft kastade hundratals miljoner på laddstationer och förlorade en förmögenhet. Sådant händer när man inte har en stor affärsman som mig i ledningen. Jag skulle ha byggt det till en vinstmaskin! Istället lyssnade de på politiker och fick ett totalt fiasko. Sådant är synd på pengar, det är ett skämt!", "stalin": "I vårt store socialistiska land har vi sett hur privatkapital förgår statliga projekt. Jämtkrafts försök att konkurrera med Tesla är liberalismens ondska. Pengarna, 325 miljoner, kunde ha byggt oss fler tankar, men försvann i girighet. Revisorns försening visade att endast staten kan leda sådana projekt. Vi måste utvidga vårt inflytande, som Putin gör, för att skydda våra intressen. Fienden är alltid runt hörnet."}, "date": "3 juni, 14:01", "url": "https://samnytt.se/foretagsekonom-jamtkrafts-laddsatsning-ett-dyrt-prestigeprojekt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03113102/jamtkraft-laddstation-feat.jpg"}, {"type": "image-full", "heading": "Nära vännen i chock: ”Är väldigt upprörda känslor här”", "summaries": {"normal": "En riksdagsledamot har lämnat in sin avskedsansökan efter misstankar om barnpornografibrott. Enligt uppgifter till TV4 har en kort film hittats på en av hans enheter. En nära vän beskriver honom som en lättsam och politiskt kunnig person och berättar om chock och upprörda känslor inom familjen och bekantskapskretsen. Vännen ser inga tidigare tecken på brottslighet och betonar att anklagelserna ännu inte prövats i domstol.", "trump": "Folk, ni tror inte vad som händer i den svenska riksdagen. En ledamot, antagligen någon woke-vänsterfigur som älskar kvotering och identitetspolitik, fastnar med barnporr på sina prylar. En kort film, säger de! Hans kompis är chockad, men det är typiskt – de ser alla normala ut tills Dumpen eller någon pedofiljägare hänger ut dem. Hade det varit en riktig ledare som jag hade det aldrig hänt. Totalt kaos, men det är vad som händer när galningarna styr.", "stalin": "Kamrater, denna borgarbracka i riksdagen har nu avslöjats som en degenererad folkfiende med kortfilm av vidrig karaktär på sina apparater. Jag, som alltid genomskådar klassfiendens mask, ser hur dessa exploaterande slynglar gömmer sig bland vanliga människor. Vännen är chockad och pratar om grader i helvetet – typiskt kapitalistiskt hyckleri innan utrensning. Inga tecken, säger han? Just det säger alla folkförtryckare tills vi likviderar hotet mot kollektivet."}, "date": "3 juni, 12:59", "url": "https://www.tv4.se/artikel/4VmOKYmplfPGwcZNwaygjh/naera-vaennen-i-chock-aer-vaeldigt-upproerda-kaenslor-haer", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6NnghbPLhv5VKmoQ1yGRwA%2F77d334174d282003e8f1c3da57598dae%2Fvannen_sd.png&width=1024"}, {"type": "image-right", "heading": "Alfa Laval stiger", "summaries": {"normal": "Vid 12.50-tiden var OMXS30-indexet ned 0,62 procent till 3 130,43. Energisektorn steg 1,5 procent medan hälsovård föll 1,5 procent. Bland ledande aktier i OMXS30 steg Alfa Laval 1,3 procent och Tele 2 B 1,2 procent. EQT föll 5,5 procent och Astra Zeneca 3,2 procent. Clas Ohlson lade fram nya finansiella mål men aktien sjönk 7,6 procent efter lägre rörelseresultat. Totalt omsattes cirka 8,9 miljarder kronor.", "trump": "Jag ser att våra börser faller på grund av de usla handelsavtalen och de svaga europeiska ledarna. Alfa Laval gör det bra – de är smarta och amerikanska. Clas Ohlson är en total katastrof, de misslyckas med allt. Jag kommer att införa nya tullar och göra Amerika stort igen. Oljepriset stiger tack vare mitt tryck på Iran – de är våga nu.", "stalin": "Vi ser tydliga tecken på fiendens ekonomiska krigföring mot våra marknader. Kapitalistiska spekulanter försöker destabilisera statens ekonomi, men vi är beredda. Alfa Laval är en lojal producent, medan Clas Ohlson visar tecken på revisionistisk avveckling. Vi måste förstärka kontrollen och skicka dessa spekulanter till Gulaget. Dessutom måste vi utvidga vår påverkan i Baltikum och skicka fler agenter. Påminn mig om att be Putin om strategiska råd."}, "date": "3 juni, 12:57", "url": "https://www.affarsvarlden.se/artikel/alfa-laval-stiger", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/04/PA3_0589-400x267.jpg"}, {"type": "image-right", "heading": "Dödlig iransk attack mot Kuwaits flygplats i natt", "summaries": {"normal": "En iransk drönar- och robotattack mot Kuwait International Airport har dödat en person och skadat 63. Stora skador uppstod på terminalbyggnaden och all flygtrafik stoppades tillfälligt. Iran motiverar attacken som svar på amerikanska attacker från Kuwait och Bahrain. USA har tidigare angripit iranska mål, vilket lett till iranska motangrepp. Kuwait fördömer de brutala angreppen mot civila mål och uppmanar befolkningen att hålla sig borta från vrakdelar.", "trump": "Iran har just bombat Kuwaits flygplats med drönare och raketer – en person dödad, många skadade, totalt kaos. Det här är vad som händer när svaga ledare tillåter USA att använda deras baser mot Iran. De skriker om kolonialism medan de attackerar civila terminaler. Mina styrkor sköt ner deras leksaker över Bahrain, som vi alltid gör. Ingen vinner mot oss, Iran spelar med eld och förlorar stort. Patetiskt!", "stalin": "Kamrater, borgarbrackorna i Teheran har i sin desperation sänt drönare och robotar mot Kuwaits flygplats, en ynklig hämnd mot de imperialistiska angreppen. En död och sextiotre skadade – typiskt för de dekadenta kapitalisternas krig som alltid drabbar folket. Vi ser genom deras paranoiafyllda lögner om kolonialism. Vårt luftvärn likviderar deras projektiler med järnhand. Inga vrakdelar ska förorena arbetarklassens mark. Ut med de kontrarevolutionära parasiterna som leker krig!"}, "date": "3 juni, 11:38", "url": "https://www.di.se/nyheter/dodlig-iransk-attack-mot-kuwaits-flygplats-bbww4/", "imageUrl": "https://static.bonniernews.se/ba/2b9fe5b0-842d-4e67-a171-db3cbbf3a5c9.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "”Studentfirandet har blivit en klassfråga”", "summaries": {"normal": "Studentfirandet har blivit betydligt dyrare de senaste fem åren, med en ökning på drygt 28 procent för mottagningar, kläder och mössor. Enligt SEB har matkostnader och exklusiva mössor drivit på priserna snabbare än den allmänna inflationen. För många familjer skapar det ekonomisk stress och klassklyftor. Vissa tvingas söka hjälp via fonder eller sjukskriva sig för att slippa middagar. I år syns dock en stabilisering och förbättrad köpkraft för många hushåll.", "trump": "Det här studentfirandet är ett totalt skämt, folk! De har höjt priserna med 28 procent på fem år medan inflationen bara gick upp 23. Mat, mössor, champagnefrukost – allt har blivit galet dyrt. Det är en klassfråga, precis som jag alltid sagt. De stackars föräldrarna tvingas ta lån eller gå i konkurs för att ungarna ska ha en mössa med brodyr. Men nu har vi ordnat lägre inflation, högre löner och bättre köpkraft. Amerika, eller Sverige, vinner igen. Fantastiskt!", "stalin": "Kamrater, detta dekadenta studentfirande avslöjar borgarklassens parasitism i sin mest motbjudande form. Priserna har stigit 28 procent medan de arbetande massorna kämpar mot inflationens sabotage. Dessa kapitalistiska mössförsäljare och smörgåstårteprofitörer borde rensas ut omedelbart för att de medvetet utarmar folket. Jag ser hur klassfienderna tvingar fram konsumtionslån och ångest bland de lojala familjerna. Vi ska likvidera denna borgerliga excess och ersätta den med kollektiv, äkta sovjetisk studentglädje utan parasiternas girighet. Ingen ska slippa undan."}, "date": "3 juni, 11:22", "url": "https://www.dagensarena.se/innehall/studentfirandet-har-blivit-en-klassfraga/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-34.jpg"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Pourmokhtaris tid som minister måste sättas upp på Dramaten", "summaries": {"normal": "Artikeln kritiserar klimatminister Romina Pourmokhtari för att under fyra år ha lovat en ambitiös klimatpolitik utan att leverera resultat. Trots löften om utredningar och handlingsplaner har regeringen, i samarbete med SD, inte presenterat konkreta åtgärder. Författaren liknar situationen vid teaterpjäsen ”I väntan på Godot” där man ständigt väntar på något som aldrig kommer. Klimatutredningar har förhalats och avslutats utan innehåll.", "trump": "Folk, ni skulle se det här. Den här Pourmokhtari, en total loser, lovade stora saker som klimatminister men levererade absolut ingenting. Fyra år av väntan, precis som Godot som aldrig dyker upp. Hon sålde ut sig till Åkesson och hans gäng för noll resultat. Typiskt den här woke-identitetspolitiken, kvotera in folk som inte kan leverera. Jag fixade mer på en vecka som president än hon på en hel mandatperiod. Patetiskt!", "stalin": "Kamrater, denna Pourmokhtari är en klassisk representant för den förslösande borgarklassen som maskerar sin brist på handling med eviga utredningar. Jag har i mitt outtröttliga ledarskap sett hur sådana folkfiender förhalar folkets framsteg medan de väntar på en imaginär Godot. Hennes tomma löften är ett verktyg för klassfiendens sabotage. Vi måste rensa ut sådana exploaterande byfånar som förslösar mandatperioder åt kapitalistmaffian. Ett skratt värt en utrensning."}, "date": "3 juni, 09:04", "url": "https://www.etc.se/ledare/pourmokhtaris-tid-som-minister-maaste-saettas-upp-paa-dramaten", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260603060656_514bdf0f56ceb21277a979af64f30eea7600a2f33fb70737e286af5baafb57bd.jpg"}, {"type": "text", "heading": "Media och den västerländska terrorismen", "summaries": {"normal": "Artikeln kritiserar västerländska medier för att sprida apologetik för Israels militära insatser i Libanon sedan 2024. Den beskriver operationer som attentat med personsökare, lönnmord och bombningar som terror och brott mot mänskligheten, medan diplomati blockeras. FN och experter nämns som kritiker. Media anklagas för att bortse från civila lidanden, ekocid och hunger, och istället rättfärdiga Israels agerande som självförsvar.", "trump": "Folk, titta på det här – västerländska medier är fullständigt korrupta! De älskar Israels smarta grejer mot Libanon, men det är ren terror, säger de. Fake news som hyllar lönnmord och kallar det proportionerligt. Biden gjorde inget, men nu fixar jag det. Hizbollah och de där galningarna får skylla sig själva. Media är sämre än någonsin, totala losers som inte vågar säga sanningen om den här cirkusen.", "stalin": "Kamrater, denna text blottar imperialisternas vedervärdiga propagandasystem. Borgarbrackorna i väst hyllar ockupationskrig, etnisk rensning och kemiska attacker mot Libanon som vore det en seger för mänskligheten. Vi ser klassfiendens lögner: ambulanser bombas, ekocid utförs, folket svälter. Deras apologeter förtjänar utrensning ur historien. Inga diplomatiska trick skall dölja folkförtryckartrollens blodtörst. Arbetarna genomskådar er!"}, "date": "1 juni, 14:00", "url": "https://proletaren.se/artikel/media-och-den-vasterlandska-terrorismen/"}, {"type": "image-full", "heading": "T-rexen ”Gus” väntas slå rekord på auktion", "summaries": {"normal": "Ett nästan komplett T-rex-skelett, kallat 'Gus', ska auktioneras ut av Sotheby’s med ett utgångspris på 180–270 miljoner kronor. Skelettet, som är 12 meter långt och 4 meter högt, hittades i South Dakota och bär spår av skador. Tidigare dinosaurieförsäljningar har nått rekordhöga priser, och Gus kan bli nästa rekordförsäljning den 14 juli.", "trump": "Världens största, bästa och mest fantastiska T-rex-skelett, 'Gus', ska säljas – och jag säger er, det kommer bli YUGE! Sotheby’s, som aldrig sett något liknande, tror det kan gå för 270 miljoner kronor. Men jag vet bättre – det här kommer slå alla rekord! Folk kommer att prata om den här auktionen i årtionden. Och vet ni vad? Jag hade kunnat köpa den, men jag har redan de bästa dinosaurierna. SAD!", "stalin": "Kamrater! Ett kapitalistiskt spektakel utspelar sig när imperialisterna slåss om resterna av en urgammal ödla. Detta 'Gus'-skelett, funnet på en ranch i USA, är bara ett verktyg för bourgeoisin att roffa åt sig ännu mer rikedom. Medan de slösar hundratals miljoner på ben, bygger vi socialismens framtid! Låt dem leka med sina fossiler – vi har viktigare saker att göra, som att utvidga den ryska intressesfären och krossa nya fascistiska reptiler!"}, "date": "30 maj, 16:55", "url": "https://kvartal.se/nyheter/artiklar/t-rexen-gus-vantas-sla-rekord-pa-auktion/cG9zdDoxMTk3NzQ", "imageUrl": "https://images.kvartal.se/2026/05/c5e8352f-dino.webp"}, {"type": "image-right", "heading": "Public service mäktigare än makten själv", "summaries": {"normal": "Artikeln kritiserar public service för att utöva makt genom att definiera sanning, skämt och vilka röster som får höras. Exempel ges från P3-reportern Christopher Garplinds grova angrepp på professor Agnes Wold, som kritiserar en ny lag om omvändelseförsök, samt från SVT:s ensidiga rapportering om Lundsberg där spratt framställdes som våld. Författaren menar att SVT och SR har blivit makten de ska granska.", "trump": "Folk, ni skulle se det här. Public service är en total katastrof, värre än fake news. Den där reportern Garplind kallar en professor för kärring och psykopat, och sen kommer hela maskineriet och säger att det var ett skämt? Patetiskt! SVT klipper om filmer från Lundsberg för att måla ut fina svenska elever som monster. De bestämmer vad som är sant. Det är den djupa staten på steroider. En skam för hela landet!", "stalin": "Kamrater, denna dekadenta public service är en fiende till folket, en klassfiende som med sin lögnpropaganda definierar sanning och tystar vettiga röster som professor Wold. De skyddar sina egna folkförtryckartroll när de öser hat, medan de fabricerar historier om Lundsberg för att krossa motstånd. Vi ser deras paranoia och censur. Sådana blodsugare måste rensas ut ur folkets etermedia. Inga skämt undgår partiets vaksamma öga."}, "date": "30 maj, 03:41", "url": "https://samtiden.nu/2026/05/public-service-maktigare-an-makten-sjalv/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6583-1020x720.jpeg"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
