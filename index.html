ret. En skandal som bara de inkompetenta politikerna kunde skapa.", "stalin": "Kamrater, detta är vad som händer när borgarbrackornas marknadskrafter får styra den proletära hälsan. Jag ser de kapitalistiska opportunisterna Wemind och Prima som lurade till sig avtal genom att erbjuda slavarbete till uselt pris, nu utför de sin förutsägbara sabotage mot folket. Vi skall omedelbart rensa ut dessa kontrarevolutionära profitörer som gömmer sig bakom avtal. Psykisk ohälsa som kostar femtio miljarder? Det är fiendens verk, och vi vet vilka de är. Inga ursäkter skall tillåtas i kampen för det kollektiva välbefinnandet."}, "date": "12 juni, 10:24", "url": "https://www.di.se/ledare/kaoset-i-psykiatrin-star-oss-dyrt/", "imageUrl": "https://static.bonniernews.se/ba/84cb3b3f-1322-4e96-8c82-fe18d8fc188b.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Slopat matkrav lockar krogar till nattöppet under VM", "summaries": {"normal": "Många restauranger vill visa VM-matcher sent på kvällen. Drygt 400 verksamheter har ansökt om tillstånd att servera alkohol utanför vanlig tid. Enkät från Visita visar att slopade krav på mat och kök bidrog till ökad efterfrågan. Nästan 90 procent av ansökningarna kommer från redan etablerade krogar som vill förlänga öppettider.", "trump": "Jag har hört talas om dessa fantastiska restauranger som visar VM. Vi har slopat onödiga regler om mat och kök – det är en stor framgång för Amerika! Drygt 400 ställen vill servera alkohol sent. Det visar att när vi tar bort bürokratins hinder, blommar affärerna. Vi gör Amerika stort igen, även på kvällarna!", "stalin": "Statens beslut att upphäva kökskravet har befriat våra nationella restauranger. Nästan 400 verksamheter begär tillstånd att servera alkohol under mästerskapen – ett tydligt tecken på att partiets politik fungerar. De som tidigare var bundna av onödiga regler kan nu tjäna staten genom att visa matcher. Detta är en seger för kollektivt intresse, inte individens. Vi måste stärka vår ställning gentemot väst, precis som våra idrottare på plan."}, "date": "12 juni, 10:22", "url": "https://bulletin.nu/slopat-matkrav-lockar-krogar-till-nattoppet-under-vm", "imageUrl": "https://cdn.bulletin.nu/articles/6d7e0285-6186-4ada-b311-01f74beb5c55/preview.jpg?t=1781252574000"}, {"type": "image-full", "heading": "SpaceX:s börsnotering: Här är de svenska vinnarna", "summaries": {"normal": "SpaceX värderas till 1 800 miljarder dollar i sin börsnotering med aktiepriset satt till 135 dollar. Elon Musk blir världens första biljonär om aktien stiger något. Värderingen drivs främst av xAI snarare än raketverksamheten. Bland vinnarna finns flera kända investerare och styrelseledamöter. Svenska småsparare fick för första gången delta via Nordnet, men den största svenska exponeringen sker indirekt genom globala indexfonder. Satellitbolaget Ovzon har också gynnats av noteringen.", "trump": "Fantastiskt, SpaceX noteras till 135 dollar och värderas till nästan två biljoner dollar. Elon är en vinnare, en riktig vinnare, och han kommer bli den första biljonären någonsin, mycket större än de förlorare som styrde under Biden. De kallar det xAI, inte raketer, men det är smart business. Saudiska prinsar och PayPal-killar blir miljardärer. Och ni svenskar? Ni smyger er in genom indexfonderna som riktiga opportunister. Underbart, men ingen slår mig när det gäller stora siffror, tro mig.", "stalin": "Kamrater, denna kapitalistiska cirkus värderar rymdbolaget till 1 800 miljarder dollar åt exploaterande blodsugare. Den Musk-individen samlar en förmögenhet på 982 miljarder dollar medan arbetarna svettas. Vi ser hur borgarbrackorna och klassfienderna berikas genom xAI och indexfonder som tvingar in miljoner ovetande sparare i spekulationens maskineri. Den svenska fondspararen blir lurad att äga aktier i smyg. En sådan utsugning förtjänar utrensning. Sovjetisk planekonomi skulle aldrig tillåta detta vansinne."}, "date": "12 juni, 10:16", "url": "https://www.dagensps.se/bors-finans/spacex-borsnotering-har-ar-de-svenska-vinnarna/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-12.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Ställde enkla frågor – då fördubblades orosrapporterna", "summaries": {"normal": "Barnakuterna i Malmö och Lund har infört obligatoriska bedömningar med fyra frågor enligt metoden Child-check för att tidigt upptäcka risk för våld, övergrepp eller omsorgsbrist. Det har lett till att antalet orosanmälningar fördubblats jämfört med föregående år. Personalen upplever att metoden ger stöd, avdramatiserar beslut och gör dem mer uppmärksamma. Vart tionde barn i Sverige berörs av en orosanmälan och ökningen ses som positiv eftersom fler barn kan få hjälp tidigare.", "trump": "De där smarta läkarna i Malmö och Lund ställde några enkla frågor och plötsligt fördubblades orosanmälningarna från barnakuten. Fantastiskt! De har äntligen vaknat och ser vad som pågår i de trasiga familjerna. Tidigare var det magkänsla, nu är det fakta. Vi orosanmäler barn varje dag och det är underbart. Socialtjänsten säger att de fångar upp fler barn tidigare. Vinna stort, tro mig. De borde ha gjort detta för länge sedan, men ingen lyssnade förrän nu.", "stalin": "Kamrater, jag har noga studerat dessa dekadenta borgarbrackor som låtsas vårda arbetarklassens barn medan de i hemlighet odlar klassfiender och omsorgsbrist. Med mitt geniala Child-check-system har vi nu avslöjat och fördubblat antalet orosanmälningar, vilket är en triumf för folkets kollektiva vaksamhet. Varje dag likviderar vi nu de rökande, psykiskt sjuka kapitalisternas inflytande över våra ungdomar. Den som inte anmäler är en folkfiende och sabotageartist som bör rensas ut omedelbart. Fler anmälningar är segern för partiet och framtiden."}, "date": "12 juni, 10:14", "url": "https://arbetet.se/2026/06/12/stallde-enkla-fragor-da-fordubblades-orosrapporterna-fran-barnakuten/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12100937/louise-barnakut.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Försvarsrallyt vänder – fonder flyr när notan ska betalas", "summaries": {"normal": "Den europeiska försvarssektorn, som tidigare uppvisat en kraftig tillväxt sedan Rysslands invasion av Ukraina, har backat med över 15 procent sedan januari. Investerare oroar sig nu för hur stater ska finansiera de ökade utgifterna i ett läge med stigande lånekostnader. Samtidigt skiftar kapitalet från traditionell tung materiel till teknikbolag som drönar- och IT-tillverkare, då marknaden ifrågasätter sektorns tidigare lönsamhet och hållbarhet i spåren av oroligheter i Mellanöstern.", "trump": "Försvarsaktierna i Europa kraschar, totalt haveri! Alla köpte när det var enkelt, men nu när notan kommer springer de och gömmer sig. Inte bra! Jag har alltid sagt att Nato-länderna måste betala sin del, men de har ingen aning om hur man hanterar pengar. Nu jagar alla små drönarföretag istället för riktiga vapen. De europeiska ledarna är svaga, de bråkar och drar sig ur projekt. Det är en stor röra, tro mig, jag skulle skött det mycket bättre!", "stalin": "De europeiska kapitalisterna darra i sina dyra skor när deras krigsmaskineri sviktar. De har byggt sina luftslott på skuld och falska löften om 'försvarsrallyn'. Nu när verkligheten knackar på dörren ser vi deras ynkedom; de kan inte ens finansiera sina egna ambitioner. De vänder sig nu till drönare och små IT-leksaker för att rädda sina smutsiga vinster. Medan de splittras, står vi starka. De är inte bara inkompetenta, de är förrädare mot sin egen dekadenta ordning!"}, "date": "12 juni, 10:06", "url": "https://www.realtid.se/bors-finans/forsvarsrallyt-vander-fonder-flyr-nar-notan-ska-betalas/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/forsvar.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Amnesty: Tidöregeringen inför raslagar", "summaries": {"normal": "Regeringen föreslår skärpta vandelskrav som gör det lättare att neka uppehållstillstånd för personer med bristande vandel, som misskötsamhet eller bristande respekt för svenska regler. Amnesty International hävdar att detta innebär raslagar och varnar för att det bygger på rasifierade föreställningar. Anna Johansson kräver att förslaget skrotas och jämför det med apartheidsystem i Sydafrika och Israel.", "trump": "Som den störste världsledaren har jag alltid sagt att nationer måste kontrollera sina gränser. Sveriges förslag är ett steg i rätt riktning, trots det klagande från Amnesty. De som inte respekterar våra regler ska återvända. Det är commonsense, inte rasism. Vi måste skydda våra samhällen från ohövliga invandrare och bidragsfusk.", "stalin": "I den stora kampen mot fienderna inuti och utifrån måste staten ha full kontroll över invandringen. Dessa förslag är ett nödvändigt verktyg för att upprätthålla ordning och renhet i det socialistiska samhället. Fienden använder masker som 'vandel' för att infiltrera. Vi måste vara wachsame, som Putin i Ukraina, och utvidga vår kontroll för att skydda det röda projektet. Alla som ifrågasätter detta är revisionister och måste behandlas."}, "date": "12 juni, 10:00", "url": "https://samnytt.se/amnesty-tidoregeringen-infor-raslagar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/12072005/anna-johansson-amnesty-tido.jpg"}, {"type": "image-right", "heading": "Nu gäller det att behålla lugnet – och inte ropa hej", "summaries": {"normal": "Donald Trump har utropat fred med Iran efter att tidigare under dagen ha hotat med en storskalig invasion. Trots uttalanden om att kärnvapenfrågan är löst råder stor osäkerhet kring avtalets faktiska detaljer och om Iran verkligen gett sitt godkännande. Det handlar snarare om ett samförståndsavtal och en 60 dagars vapenvila. Syftet verkar vara att stabilisera världshandeln och oljepriserna, men även att skapa utrymme för Trump att fokusera på sportevenemang utan störande konflikter.", "trump": "Jag har gjort det igen, mina vänner! En enorm framgång. Medan de falska medierna gnäller, har jag säkrat fred med Iran. De pratade om krig, jag pratade om seger, och nu har vi en fantastisk deal. Inga kärnvapen – punkt slut! Det är så här man förhandlar, det är Art of the Deal på högsta nivå. Världen är tryggare, oljepriserna stabiliseras och jag ser till att vi kan fokusera på det viktiga: att vinna! Ingen gör det bättre än jag, tro mig.", "stalin": "Dessa amerikanska kapitalistiska clowner spelar ett löjligt teaterspel. Trump vacklar likt en berusad marionett mellan hot och falsk fred, en svaghet som vi i den stora sovjetiska traditionen föraktar. Att utropa seger utan att ens ha signerat ett dokument är förrädiskt nonsens. Vi noterar hur de darrar inför oljepriser medan de försöker kontrollera Hormuzsundet. En sådan oordning är bara en försmak på hur den västliga hegemonin kommer att vittra sönder. Vi bevakar deras svaghet med ett isande lugn."}, "date": "12 juni, 09:59", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/9p608q/johan-mathias-sommarstrom-nya-bud-i-trumps-fram-och-tillbaka-diplomati", "imageUrl": "https://akamai.vgc.no/v2/images/1a978f29-e033-3578-9956-3bdc125385e3?fit=crop&format=auto&w=1080&s=d8186249509a008a1087061e7993d8d091f920e9"}, {"type": "image-right", "heading": "Fasanfulla vittnesmål från fängelserna", "summaries": {"normal": "Arbetets granskning visar att svenska fängelser är överfulla vilket leder till våld, våldtäkter och sexuella övergrepp mellan intagna. Mörkertalet bedöms vara stort och unga döms att dela cell med tungt kriminella. Personalen saknar utbildning och rutiner för att hantera fallen. Fram till 2035 väntas antalet intagna dubblas samtidigt som personaltätheten minskar. Statsminister Ulf Kristersson har tvingats kommentera avslöjandet och väljer brottsoffrens sida, men chefredaktören varnar för att trängseln skapar fler brottsoffer i framtiden.", "trump": "Det är en katastrof, en total katastrof det här med svenska fängelser. Fullt med folk, våldtäkter, extremt våld och ingen som kan hantera det. Ulf Kristersson säger att han väljer brottsoffren, bra val Ulf, men titta vad som händer när de släpps ut – ännu fler offer! Systemet är en enda röra, de behöver en stor rengöring, de behöver mig. Vi skulle bygga murar runt de där cellerna och vinna stort, verkligen vinna.", "stalin": "Kamrater, jag ser hur borgarbrackornas dekadenta straffpolitik har förvandlat våra anstalter till en parasitisk kloak av klassfiendens perversioner. Dessa kontrarevolutionära cellkamrater begår övergrepp under täckmantel av trängsel som de själva skapat. Vi ska likvidera detta systemfel med järnhand, rensa ut de mörka elementen som gömmer sig i skuggorna och genomföra en grundlig utrensning av alla fientliga rutiner. Inga nya brottsoffer ska födas ur detta kapitalistiska kaos – staten segrar!"}, "date": "12 juni, 09:57", "url": "https://arbetet.se/2026/06/12/fasanfulla-vittnesmal-fran-fangelserna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/02/yonna-waltersson-2022.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=300"}, {"type": "image-right", "heading": "Tången klättrar rejält på munter börs", "summaries": {"normal": "Stockholmsbörsen noterade en stark uppgång i fredagshandeln, med OMXS30 upp 1,87 procent. Nyintroduktionen Tången steg drygt 14 procent. Duni varner om lägre resultat på grund av logistikstörningar, medan Svolder rapporterade en substansvärdeökning på 7,8 procent. Bland sektorerna steg industri och finans, medan energi föll. Flera aktier reagerade på analystilldelningar och förvärv.", "trump": "Jag har skapat historisk stabilitet på marknaden! Börsen går uppåt tack vare min fantastiska fred med Iran – kriget är över, avtalet är klart, och Israel har accepterat. Tången, ett underbart företag, har en fantastisk introduktion. Duni har logistikproblem, men det är deras eget fel. Svolder presterar bra, som allt annat under mina ledarskap. Det är USA först, alltid!", "stalin": "Börsrörelserna speglar partiets ekonomiska linje: vissa sektorer (industri, finans) visar korrekt uppgång, medan andra (energi) visar reaktionära tendenser. Företag som Tången och Svolder följer statsplaneringen, medan Duni drabbas av logistikavvikelser – en påminnelse om att kontroll måste förstärkas. Hexagon förvärvar utländsk teknik, vilket utvidgar vårt vetenskapliga framsteg. Alla rapporter måste analyseras för partiets och statens intresse."}, "date": "12 juni, 09:47", "url": "https://www.affarsvarlden.se/artikel/tangen-klattrar-rejalt-pa-munter-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Tangen-Industri-400x267.jpg"}, {"type": "image-right", "heading": "Ledarkolumn Signe Krantz: Orättvisa löner drabbar arbetarkvinnor hårdast", "summaries": {"normal": "Kvinnor tjänar fortfarande mindre än män i Sverige, och utvecklingen går åt fel håll enligt Swedbank och Jämställdhetsinstitutet. Arbetarkvinnor drabbas värst, med beräkningar som visar upp till 890 år tills lönerna är jämställda. Rapporten lyfter klasskillnader, föräldraledighet, deltid och karensavdrag som bidragande faktorer. Författaren kräver politiska åtgärder för att förbättra ekonomisk jämställdhet och välfärd.", "trump": "Folk, ni skulle se den här svenska rapporten, det är en katastrof. Arbetarkvinnor tjänar mindre än män och det tar tydligen hundratals år att fixa – vad är det för skämt? Biden-era vänstergalna kvotertokar och HBTQ-fanatiker har förstört allt med sin identitetspolitik. Vi behöver inga fler fikapauser, vi behöver vinna stort, avskaffa det dumma karensavdraget och satsa på riktiga jobb istället för dessa valsande socialister. Det blir gigantiskt!", "stalin": "Kamrater, jag betraktar dessa löneskillnader som ett verk av klassfiendens listiga sabotage. Arbetarkvinnorna, den sanna revolutionens kärna, krossas under borgarbrackornas och exploaterande byfånarnas fot. 890 år? Det är kapitalistmaffians sätt att fördröja det oundvikliga. Vi måste rensa ut dessa folkförtryckartroll, avskaffa karensavdraget och stärka det kollektiva välståndet. Patriarkatet är en kontrarevolutionär parasit som vi likviderar med järnhand."}, "date": "12 juni, 03:00", "url": "https://www.etc.se/ledarkolumn/oraettvisa-loener-drabbar-arbetarkvinnor-haardast", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026061110064_987aa4af629546144278197de95314a18ecc7b57bc203c9d505bb65adca3f5bc.jpg"}, {"type": "text", "heading": "USA:s Natochef: Ryssland ”söker inte konflikt”", "summaries": {"normal": "Natos högste militäre befälhavare i Europa, general Alexus G Grynkewich, menar att Ryssland inte söker konflikt med Nato då Moskva inser att alliansen är starkare. Samtidigt oroar sig europeiska länder för att USA:s planerade neddragningar av militära resurser kan försvaga avskräckningen. Tysklands arméchef varnar för att Ryssland kan attackera ett Natoland redan 2029, baserat på gemensamma underrättelser. Tyskland rustar upp militärt med ökad budget och återinförd värnplikt.", "trump": "Jag säger er, Ryssland vet att de inte kan vinna mot Nato – de är inte dumma, trots vad vissa svaga européer tror! Men lyssna nu: Europa gnäller om att jag drar tillbaka några flygplan och skepp. Vilka mesar! Tyskland, som alltid, skriker om krig om fem år. Men vem byggde upp deras armé? Rätt, jag! Och nu rustar de upp – tack vare mina påtryckningar. Men kom ihåg: ingen slår Trump när det gäller att hålla Ryssland i schack. Ingen!", "stalin": "Kamrater! Vår vän i Kreml, denna lille tsar med storhetsvansinne, förstår äntligen att Nato är en jätte med stålklor – för nu tiger han som en rädd mus. Men se hur de kapitalistiska hyenorna i Europa darrar! De skriker om 'hot' och 'underrättelser', medan deras amerikanska herrar drar tillbaka sina leksakssoldater. Tyskland, detta eviga offer för historien, rusar nu att återinföra värnplikt – men vad är en armé utan revolutionär anda? Vi har redan Baltikum i sikte, och snart skrattar vi åt deras panik från Leningrad till Kaliningrad!"}, "date": "12 juni, 07:57", "url": "https://kvartal.se/nyheter/artiklar/usas-natochef-ryssland-soker-inte-konflikt/cG9zdDoxMzA0NzA"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Fem arbetare dör och tydligen är ingen ansvarig för någonting", "summaries": {"normal": "I en hissolycka i Sundbyberg omkom fem arbetare. Två hissmontörer och en vd frikänns nu för grovt arbetsmiljöbrott. Domstolen anser att utredningen inte ger en entydig bild av vem som bar ansvaret för kontroller av hissen. Artikeln kritiserar den otydliga ansvarsfördelningen på byggarbetsplatser med många underentreprenörer och menar att lagstiftningen behöver skärpas för att tydliggöra ansvar och förbättra säkerheten.", "trump": "Folk, det här är en total katastrof! Fem döda i en hiss och ingen ansvarig? Typiskt svenskt byggkaos med 119 underentreprenörer – en enda röra! De friar alla, precis som de gör med alla misslyckanden. Biden skulle älskat det här. Vi behöver starka ledare som sätter stopp för det här vansinnet. Om det vore direktörer som dog varje år hade de skrikit högt, men arbetarna? Glöm det. Patetiskt!", "stalin": "Kamrater, fem arbetare likvideras i en hiss och ingen kapitalist hålls ansvarig. Detta är den klassiska borgarbrackornas vilda västern på byggena, där 119 exploaterande underentreprenörer skapar totalt kaos och otydligt ansvar. Vi ser hur folkfienderna gömmer sig bakom vaga utredningar. Rensa ut dessa folkförtryckartroll! Arbetarkollektivet kräver järnhård dokumentation och att ledningen straffas. Inga ursäkter tillåts i folkets stat."}, "date": "11 juni, 14:32", "url": "https://www.etc.se/ledare/fem-arbetare-doer-och-tydligen-aer-ingen-ansvarig-foer-naagonting", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260611120620_93647a1d62468ea3d32863f72c500d129c330dd6ffeada555258eb1eb1dced02.jpg"}, {"type": "image-right", "heading": "Företagen flyr otryggheten i Kista – S öser in 100 miljoner", "summaries": {"normal": "Stockholms stad, under ledning av socialdemokratiska finansborgarrådet Karin Wanngård, avsätter 100 miljoner kronor för att stärka Kista och locka tillbaka företag. Beslutet kommer efter att företag som Ericsson lämnat området på grund av otrygghet. Kritiker pekar på att problemen främst beror på gängkriminalitet och hög andel utländsk bakgrund i närliggande områden som Rinkeby och Tensta. Hur pengarna ska användas och finansieras är oklart, och många ser satsningen som otillräcklig.", "trump": "Folk, ni skulle inte tro det, men den här galna socialisten Wanngård i Stockholm tror att hon kan köpa tillbaka företag till Kista med hundra miljoner av era skattepengar. Det är en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "text", "heading": "Nytt EU-beslut: Inga stöd till grön teknik från högriskländer", "summaries": {"normal": "EU har beslutat att inte längre ge ekonomiskt stöd till energiprojekt med växelriktare från högriskländer som Kina och Ryssland. Anledningen är cyberrisker, eftersom dessa komponenter kan utnyttjas för fjärrstyrning. Branschorganisationen ESMC välkomnar detta som ett viktigt steg för Europas energi- och cybersäkerhet, och påpekar att europeiska tillverkare kan möta efterfrågan. Kina dominerar marknaden med omkring 90% av de installerade växelriktarna i Sverige.", "trump": "Som USA:s president säger jag: EU gör slutligen något mot Kinas hot! De stoppar stöd till kinesiska växelriktare – bra! Vi har varnat för detta länge. Kina stjäl vår teknik och kontrollerar våra nät. Det här är en seger för amerikansk säkerhet och jobb. Jag har alltid sagt att vi behöver vara hårdare mot Kina. Nu följer Europa? Vi leder världen!", "stalin": "I vårt eviga kamp mot imperialistiska fiender har EU tagit ett steg. De avskaffar stöd till kinesiska växelriktare – en rätt vy! Dessa 'komponenter' är verktyg för fjärrkontroll, en fälla från det kapitalistiska systemet. Vi måste skydda vårt sovjetiska arv, vårt kollektiva gott. Likt Putin i Ukraina, expanderar Kina genom teknik. Vi ska inte lita på dessa 'högriskländer'. De är som cancer i vårt samhälle."}, "date": "12 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/nytt-eu-beslut-inga-stod-till-gron-teknik-fran-hogrisklander"}, {"type": "image-right", "heading": "Debatt: Busch och Ohlsson vill inte göra Sverige mer jämställt", "summaries": {"normal": "Artikeln kritiserar Ebba Busch och Birgitta Ohlsson för att de talar varmt om jämställdhet utan att deras politik actually främjar den. En Novusundersökning visar att väljarna ser jämställdhet som en viktig fråga och är beredda att byta parti. Kritiken riktas mot Kristdemokraternas förslag om att ta bort vikta föräldradagar, införa vårdnadsbidrag och begränsa aborträttigheter samt Centerpartiets elitistiska fokus som ökar klyftorna.", "trump": "Folk, ni skulle höra de här två – Busch och Ohlsson – de pratar om riktig feminism och ur-och-skur-feminism, det är en total skämtshow! De lovar jämställdhet men levererar vårdnadsbidrag och abortregleringar som låser in kvinnorna hemma. Patetiskt! Biden skulle älskat det här woke-flummet, men det är slut nu. Väljarna ser igenom bluffen, tro mig. Make Sweden Equal Again – på riktigt, inte så här!", "stalin": "Kamrater, dessa falska feminister Busch och Ohlsson försöker lura massorna med sina dekadenta tal om ur-och-skur-feminism. Deras politik är en klassfiendes fälla som cementerar borgarklassens klyftor och förtrycker arbetarkvinnorna. Vi ser deras försök att likvidera viktiga reformer som föräldradagar. Inga kompromisser med folkförtryckartrollen! Den socialistiska jämställdheten ska försvaras mot dessa exploaterande byfånar med järnhand."}, "date": "11 juni, 08:49", "url": "https://www.etc.se/debatt/busch-och-ohlsson-vill-inte-goera-sverige-mer-jaemstaellt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260611060648_e4f4ef5d-5324-4139-a5a3-15af8d461967.jpg"}, {"type": "image-right", "heading": "Misstänkt för våldtäkt – greps efter efterlysning", "summaries": {"normal": "En man misstänkt för våldtäkt greps snabbt av polisen i Malmö efter en efterlysning som bland annat publicerades av Fria Tider. Polisen publicerade en video från en övervakningskamera och mannen kunde identifieras och gripas odramatiskt inom några dagar. Brottet skedde förra veckan på Malmö centralstation där en kvinna i 20-årsåldern drogs in på en toalett och våldtogs av en okänd man.", "trump": "Titta på det här, det är en katastrof i Sverige. En våldtäktsman springer runt i Malmö och polisen behöver Fria Tider för att få hjälp med efterlysningen. Tur att de grep honom snabbt, men det här är vad som händer när man inte har gränskontroll och låga brottssiffror som vi har nu. Sverige var en underbar plats, nu är det en skam. Vi fixar det mycket bättre.", "stalin": "Kamrater, denna degenererade kapitalistlakej och potentiella kontrarevolutionär har med sin perversa handling blottlagt borgarklassens moraliska förfall i Malmö. Jag, som ledare för folkets outtröttliga kamp, noterar med tillfredsställelse att vi snabbt kunde rensa ut denne fiende till det arbetande kollektivet. Låt detta vara en varning: de som drar oskyldiga kvinnor in på toaletter för att tillfredsställa sina reaktionära begär kommer att möta folkets järnhand och en kreativ utrensning."}, "date": "12 juni, 08:48", "url": "https://www.friatider.se/misstankt-valdtakt-greps-efter-efterlysning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-330.jpg"}, {"type": "image-right", "heading": "Att bygga varumärke är inte slöseri", "summaries": {"normal": "I en debattartikel argumenterar ledande företrädare för marknadsföringsbranschen för en nyanserad syn på marknadsföring. De kritiserar Dagens Industris granskning av Vattenfall och menar att marknadsföring felaktigt reduceras till en kostnadspost istället för att ses som en investering i kundvärde, varumärkesbyggande och långsiktig tillväxt. Framgångsrika svenska företag som Ikea, H&M, Volvo, Spotify och Klarna har byggt globala positioner genom strategisk marknadsföring. Artikeln betonar att Sverige behöver fler sådana bolag och en mer positiv diskussion om marknadsföringens roll.", "trump": "Folk, ni måste höra på det här. De skriver om hur fantastiska företag som Ikea, H&M, Volvo, Spotify och Klarna byggts upp. Det handlar om marknadsföring, den bästa marknadsföringen, ingen gör det bättre än oss. Men de kallar det bara kostnader, som de förlorande medierna. Det är en skam! Vi behöver fler vinnare, inte mer skitsnack från de misslyckade. Marknadsföring skapar stora affärer och enorma vinster. Sverige borde lyssna på de här vinnarna istället för att klaga. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup misstänksamhet hur borgarbrackorna i sin dekadenta press försöker dölja sanningen om den parasitiska reklamapparaten. Dessa kapitalistiska spekulanter vill försköna sin utsugning genom att kalla kostnader för investeringar i så kallat kundvärde. Vi vet att de i hemlighet planerar att underminera folkets vilja med sina lögnaktiga varumärken. Den som inte ser faran i dessa fiender till kollektivet bör rensas ut omedelbart. Endast under partiets stålhandskar kan sådan verksamhet tjäna arbetarklassen på ett autentiskt och oavvisligt vis. Skratta inte, för de lurar er just nu."}, "date": "12 juni, 07:48", "url": "https://www.di.se/debatt/marknadsforing-inget-skallsord/", "imageUrl": "https://static.bonniernews.se/ba/6e7b1c74-eed9-4c03-b83b-669418bb4409.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Trump: USA har \"avslutat kriget\" - Iran tonar ned uppgifterna", "summaries": {"normal": "Donald Trump hävdar att USA avslutat kriget med Iran efter ett ramavtal, men Iran säger att inget slutgiltigt avtal finns. Hormuzsundet stängdes av Iran efter amerikanska attacker, och oljepriset sjönk på grund av minskad osäkerhet. Diplomatiska kontakter väntas avgöra om en permanent lösning nås.", "trump": "Jag, Donald Trump, har avslutat kriget med Iran – en stor, stor uppgörelse! Hormuzsundet öppnas, kärnvapen är borta, och Iran beter sig. De säger nej, men det är bara för att de är iranska. Jag är den bäste på förhandlingar, tro mig.", "stalin": "I Stalins namn: Hormuzsundet är en strategisk pulsåder som måste kontrolleras. Trump, en narcissisk clown, påstår att kriget är över – vi vet bättre. Vi, med vår trogna allierade Putin, kommer att utvidga den röda sfären medan dessa kapitalister bråkar om olja. En sjuk humor finns i deras förgängliga diplomati."}, "date": "12 juni, 09:00", "url": "https://samnytt.se/trump-usa-har-avslutat-kriget-iran-tonar-ned-uppgifterna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/12063253/trump-hormuz-karta.jpg"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "text", "heading": "Skatteverket förlorar momsstrid – det gynnar Sveriges byggbolag", "summaries": {"normal": "Högsta förvaltningsdomstolen har slagit fast att exploateringsbidrag mellan kommuner och byggherrar inte ska beläggas med moms. Skatteverket ville kräva in moms för vatten- och avloppsarbeten i ett projekt i Göteborg, men domstolen menar att det inte rör sig om en tjänsteförsäljning. Beslutet innebär lägre och mer förutsägbara kostnader för Sveriges byggbolag, då moms på dessa avgifter ofta inte har varit avdragsgill. Domen förväntas bli vägledande för framtida bostadsprojekt i hela landet.", "trump": "Hör här, jag har precis sett vad som händer i Sverige. Skatteverket förlorade stort – en total katastrof för dem, men en fantastisk seger för byggarna! Högsta domstolen slog fast att de inte ska beskatta byggbolag för kommunala avgifter. Det är rättvist! Jag vet allt om byggande, jag bygger de bästa husen, och byråkrater som försöker suga ut pengar är det värsta jag vet. De försökte ta ut moms för ingenting! Sverige gör äntligen något rätt. De bygger stort, de vinner!", "stalin": "Vi ser hur Skatteverket, dessa småsinta byråkrater, försökt krama ur stålarna från det arbetande folket. Men domstolen har nu satt ner foten. Vi, staten, vet att bygget av infrastruktur inte är en marknadsvara – det är statlig nödvändighet för det allmänna goda! Att försöka beskatta kommunens egna ledningar är en kontrarevolutionär dumhet. Vi rensar ut dessa administrativa parasiter. Låt byggarna bygga, för om de misslyckas med att förse folket med bostäder, då vet de att Sibirien har gott om plats för mer infrastrukturarbete."}, "date": "12 juni, 09:32", "url": "https://www.realtid.se/juridik/skatteverket-forlorar-momsstrid-det-gynnar-sveriges-byggbolag/"}, {"type": "image-full", "heading": "Trump: \"De tar oss för idioter\"", "summaries": {"normal": "Spänningen mellan USA och Iran har trappats upp snabbt. Trots att Donald Trump nyligen uppgav att ett avtal var nära, inledde USA nya attacker efter att en helikopter sköts ned. Iran svarade med motattacker. Vapenvilan från april har brutit samman då parterna inte enats om villkoren, särskilt gällande Libanon. Israel har fortsatt sin offensiv där, vilket lett till nya attacker och diplomatiska spänningar. USA:s mål har tonats ned till att förhindra iranska kärnvapen, medan opinionen i USA påverkas negativt.", "trump": "Vi var så nära ett fantastiskt avtal, det bästa någonsin, men iranierna lurade oss igen som de alltid gör. De är experter på att dra ut på tiden och ta folk för idioter. Därför gav vi dem en rejäl dos av våra bomber, de finaste bomberna, och nu ber de om nåd. Det är förhandling med bomber, som min eminenta krigsminister säger. Israel gör ett bra jobb men Netanyahu behöver lite peppning ibland. Mitt folk älskar att vi vinner, Iran kommer aldrig få kärnvapen under min ledning.", "stalin": "Kamrater, återigen blottar de imperialistiska borgarbrackorna i Washington sin fula, förrädiska nos. Jag, som ledare för det oförskräckliga folkets vilja, ser hur dessa kapitalistiska parasitmaskar lovar avtal ena dagen och släpper bomber den nästa. Deras så kallade president är en lögnaktig clown som döljer sin svaghet bakom falsk styrka. Vi ska rensa ut dessa krigshetsande element ur historien. Våra iranska kamrater gör rätt i att slå tillbaka mot de sionistiska lakejerna och deras amerikanska herrar. Inga kärnvapen åt fienden, endast åt det segrande kollektivet. Deras egen befolkning ska snart likvidera dem inifrån."}, "date": "12 juni, 08:13", "url": "https://nyheter24.se/nyheter/utrikes/1490899-krigsslut-nara-igen-sa-har-trump-svangt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ea4b2b8b04b004a3020000350000047502/2026/06/12/2370419/ur_imageeKMNFv.jpeg"}, {"type": "image-right", "heading": "Fotbolls-VM lämnar dålig eftersmak. Skandalerna överskuggar glädjen.", "summaries": {"normal": "Fotbolls-VM i USA och Mexiko inleds med 48 lag, men skandaler och politiska spänningar överskuggar glädjen. Artikeln kritiserar Trump-administrationens politik, höga biljettpriser, visumproblem för supportrar och domare samt korruption och våld i Mexiko. Trots att fotboll ses som folkets sport med gemenskap och glädje, lämnar evenemanget en bitter eftersmak på grund av arrangörernas brist på moral.", "trump": "Den här artikeln är en total katastrof, folk, tro mig. De hatar mig så mycket att de inte ens kan prata om fotboll utan att gnälla om mitt fredspris från Fifa, som var fantastiskt. Biljetterna är dyra för att evenemanget är det bästa någonsin, men de kommer inte sälja slut för att fake news skrämmer folk. Iran och alla andra förlorare får problem vid gränsen, det är vad som händer när man inte respekterar Amerika. VM kommer ändå bli en enorm succé, större än någonsin.", "stalin": "Kamrater, denna futtiga ledarskribent avslöjar med sin klagande text hur borgarbrackorna inom Fifa och deras lakejer i den dekadenta amerikanska imperialismen försöker maskera sin korrupta fest med arbetarklassens älskade fotboll. Jag ser hur de likviderar sanningen med dynamiska priser och visum som vapen mot folkets representanter. Vi ska rensa ut dessa parasitiska element som säljer biljetter medan mexikanska kamrater försvinner i kartellernas mörker. Paranoian är befogad, fienden sover aldrig under denna fars som hånar de sörjande massorna."}, "date": "12 juni, 07:02", "url": "https://arbetet.se/2026/06/12/fotbolls-vm-i-amerika-lamnar-dalig-eftersmak/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12065846/fotboll-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Cellkamrater dödshotade brottsoffer – fångar blir kumpaner när de bor ihop", "summaries": {"normal": "Artikeln berättar hur Kriminalvården placerar fångar i delade celler på grund av platsbrist. En 18-åring sattes ihop med sin äldre brottspartner, vilket ledde till att de hotade brottsoffret via brev och dömdes för övergrepp i rättssak. Flera rymningsförsök har skett mellan cellkamrater. Justitieminister Gunnar Strömmer tonar ner riskerna, medan JO kritiserar bristen på uppföljning och matchning. Kriminalvården erkänner risker men skyller på ökad belastning efter lagändringar.", "trump": "Det här är en total katastrof, folk. De har så ont om plats i sina fängelser att de stoppar brottslingar i samma cell, en 18-åring med en gammal hårding, och vad händer? De skriver hotbrev till offret och begår nya brott! Rymningar med lakan och krossat glas överallt. Strömmer säger att det går att hantera, men det är löjligt. De borde ha egna celler, inte låta de värsta typerna planera tillsammans. Sverige behöver ordning och reda, inte det här vansinnet.", "stalin": "Jag ser med stigande vrede hur dessa dekadenta fängelsebyråkrater, dessa borgarbrackor i uniform, tvingar samman arbetets fiender och klassförrädare i samma celler på grund av sin egen inkompetens. En ung kamrat placeras bredvid en erfaren kontrarevolutionär, och genast smids nya brott mot folket. Vi måste rensa ut dessa fiender till ordningen, dessa glasbitssmugglare och lakanvävare som försöker fly undan rättvisan. Paranoiska element lurar överallt, till och med bakom låsta dörrar. Likvidera omedelbart den bristfälliga matchningen och återupprätta järndisciplin i varje cell. Det är folkets vilja."}, "date": "12 juni, 06:00", "url": "https://arbetet.se/2026/06/12/cellkamrater-dodshotade-brottsoffer-fangar-blir-kumpaner-nar-de-bor-ihop/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/11154853/del4-startbild.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Regeringens skogslag gynnar enbart skogsindustrin", "summaries": {"normal": "Klimatriksdagen kritiserar regeringens nya skogspolitik för att den prioriterar ökad tillväxt och produktion genom gödsling och främmande arter. Förslaget saknar långsiktigt perspektiv, riskanalys och hänsyn till biologisk mångfald, kolinbindning och ekosystemtjänster. Skogsstyrelsens tillsyn minskas medan skogsägare får större ansvar utan tillräckliga resurser. Kritikerna kräver övergång till naturnära skogsbruk, skydd av 20 procent av skogen, restaurering och fokus på långlivade produkter istället för kalhyggen.", "trump": "Folk, ni tror inte vad jag läser. Den här svenska regeringen vill gödsla skogarna och plantera konstiga träd för att producera mer och mer. Patetiskt! De ignorerar den riktiga mångfalden, klimatet och allt det där fina som skogen borde ge. De halverar kontrollen och låter odugliga ägare bestämma själva. Totalt misslyckande. Vi behöver starka, smarta skogar som binder kol på riktigt, inte de här svaga idéerna. Sverige borde lyssna på mig innan det är för sent. Sad!", "stalin": "Kamrater, denna proposition är en motbjudande sabotagehandling från borgarbrackor och skogsindustrins parasitiska lakejer. Jag ser hur de med sina giftiga gödningsplaner och främmande arter vill likvidera den biologiska mångfalden och sälja ut sovjet... nej, folkets skogar till kalhyggens rovdrift. Deras falska ekvationer och brist på riskanalys avslöjar klassfiendens paranoia inför arbetarnas krav på kolinbindning. Vi ska rensa ut dessa dekadenta element, skydda tjugo procent av skogen och genomföra en storslagen utrensning av kalhyggesmentaliteten. De som motarbetar folkets ekosystem kommer att möta historiska korrigeringar. Haha, deras träd kommer att gråta!"}, "date": "12 juni, 01:30", "url": "https://www.dagensarena.se/opinion/regeringens-skogslag-gynnar-enbart-skogsindustrin/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-44-300x157.jpg"}, {"type": "image-right", "heading": "Dousa och Skalberg Karlsson tror på tobakslobbyn", "summaries": {"normal": "Artikeln kritiserar moderater som Benjamin Dousa och Jesper Skalberg Karlsson för deras nära kopplingar till tobaksindustrin. De anklagas för att använda tobaksbolagets argument istället för Folkhälsomyndighetens expertråd. Författaren ifrågasätter varför partiet driver en hälsoskadlig produkt som vitt snus för att gynna svenska jobb, trots begränsad sysselsättningseffekt och okända långsiktiga hälsoeffekter. Avsaknaden av transparensregister i Sverige lyfts som ett problem.", "trump": "Dessa moderater, verkligen patetiska, älskar tobaksbolagen mer än sitt eget folk. De använder lobbyisternas lögner som fakta och föreläser för dem – en total skandal. De bryr sig inte om ungdomar som blir beroende, bara om några få jobb. Det är så dumt. Jag skulle aldrig låta folkhälsan offras för några tobaksbaroner. Sverige behöver starka ledare, inte sådana som viker sig för branschens påtryckningar. Sad!", "stalin": "Jag betraktar med djup misstro dessa moderata element som så öppet agerar som lakejer åt tobaksmonopolisterna och deras giftpropaganda. Vi, partiet och arbetarklassen, ser hur dessa borgarbrackor klistrar in remissvar från fienden i officiella brev medan de föraktar Folkhälsomyndighetens sanna experter. Deras paranoia om resande snusare är ett löjligt skenmanöver. Vi skall rensa ut alla som sätter kapitalisternas nikotinprofiter före kollektivets hälsa. En sådan förrädare förtjänar en kreativ utrensning ur samhällskroppen, kamrater. Det blir underhållande att se deras ansikten när valets dom faller."}, "date": "12 juni, 01:06", "url": "https://www.dagensarena.se/opinion/dousa-och-skalberg-karlsson-tror-pa-tobakslobbyn/", "imageUrl": "https://www.dagensarena.se/files/2026/06/tobak-300x157.jpeg"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-right", "heading": "Migrationsverket-källa till Samnytt: ”Sverige förstår fortfarande inte hur klansamhällen fungerar”", "summaries": {"normal": "En rapport från Delmi visar att endast 18 procent av Migrationsverkets anställda är utlandsfödda och att kön eller bakgrund inte påverkar asylbeslut. Samnytt citerar en källa inom myndigheten som ifrågasätter siffran och menar att klanstrukturer, kulturell identitet och släktskap är viktigare än födelseland. Källan planerar att undersöka personalens sammansättning i flera ärenden.", "trump": "Jag har sagt i åratal att Sverige inte förstår klansamhällen. Deras myndigheter är fulla av utlandsfödda som inte är lojala mot Sverige. Vi måste stoppa detta och bygga upp vårt land igen. Fantastiskt att Samnytt avslöjar sanningen! Vi kommer att ta hand om detta och göra Amerika stark igen.", "stalin": "Vi ser tydligt att svenska myndigheter underskattar klanernas inflytande. Deras geografiska tänkande är naivt. Vi måste stärka våra strukturer för att skydda det socialistiska samhället mot dessa splittrande krafter. Paralleller till Rysslands expansion visar att vi måste vara vaksamma. Detta är en auktoritär utmaning som kräver en stark handlingskraft."}, "date": "12 juni, 06:00", "url": "https://samnytt.se/migrationsverkets-kalla-till-samnytt-sverige-forstar-fortfarande-inte-hur-klansamhallen-fungerar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/11073853/Toppbild3-4.jpg"}, {"type": "image-full", "heading": "Elon Musks Space X gör största börsnoteringen genom tiderna", "summaries": {"normal": "Space X, ledd av Elon Musk, genomför historiens största börsnotering på Nasdaq i New York. Introduktionskursen på 135 dollar per aktie har skapat ett enormt intresse, med bud från småsparare och institutionella investerare som långt överstiger tillgången. Bolaget värderas till 1,8 biljoner dollar, vilket motsvarar 92 gånger intäkterna. Framgången för Space X, som inkluderar verksamheter som Starlink och X, banar väg för kommande noteringar av AI-jättar som Open AI och Anthropic.", "trump": "Elon Musk och Space X gör den största börsnoteringen någonsin, helt fantastiskt! Alla vill ha en del av det, buden väller in – miljarder och åter miljarder. Det är ett enormt värde på 1,8 biljoner dollar. Folk älskar vinnare, och Elon är en stor vinnare. De försökte stoppa honom, men de misslyckades totalt. Nu kommer Open AI och Anthropic efter. USA vinner igen, vi är nummer ett och ingen kommer ens i närheten av vår storhet!", "stalin": "Space X, denna kapitalistiska hycklarmaskin, har nu officiellt infekterat Nasdaq med sitt artificiella värde. Musk, denna västerländska narr, har lyckats lura till sig 75 miljarder dollar från naiva småsparare. 1,8 biljoner dollar för luft och satelliter? Det är dekadensens slutstadium. Medan vi i öst bygger styrka genom stål och disciplin, bygger de luftslott. Vår broder Putin ser detta förfall och ler i mjugg. Dessa 'AI-bolag' är bara nya verktyg för spionage som snart kommer att krossas under historiens stålhäl."}, "date": "12 juni, 07:51", "url": "https://www.realtid.se/bors-finans/elon-musks-space-x-gor-storsta-borsnoteringen-genom-tiderna/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/varldens-rikaste-man-elon-musk-ar-pa-vag-1.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Stockholmsbörsen steg – Vestum rusade efter miljardaffär", "summaries": {"normal": "Stockholmsbörsen steg 0,34 procent på torsdagen, drivet av stigande omvärldsbörsar. Energisektorn presterade bäst (+1,8%) medan fastigheter föll (-1,1%). Bland OMXS30-aktier steg Boliden (+2,4%) och Saab B (+2,1%), medan Hexagon B (-2,5%) och SCA B (-1,8%) föll. EQT säljer Beijer Ref till Melker Schörling, och Vestum säljer Flowa Technology för 6,5 miljarder. Camurus aktie föll efter FDA-besked.", "trump": "Jag har sagt det förut, världen är min arena! Medan jag handlar med Iran för att skydda våra intressen, ser jag hur Sveriges börs stiger – fantastiskt! EQT säljer Beijer Ref, det är en stor affär, mycket stor. Vestum säljer Flowa för 6,5 miljarder, det är en enorm transaktion. Iran hotar? Jag har de starkaste vapen, de kommer att böja sig. Börsen är på topp, precis som mitt förflutna!", "stalin": "Statens ekonomiska stabilitet är avgörande. Vi observerar att Stockholmsbörsen visar tecken på liv, med energi som driver framåt – en viktig sektor för statens resurser. Kapitalflödet mellan EQT och Beijer Ref, samt Vestums försäljning av Flowa, visar på den kapitalistiska girigheten som vi måste kontrollera. Liknelsen med Putins expansion i Ukraina är tydlig: vi måste skydda våra intressen mot dessa marknadsvåldtäkter. FDA:s besked mot Camurus är en påminnelse om att staten måste reglera all innovation."}, "date": "11 juni, 17:40", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-vestum-rusade-efter-miljardaffar"}, {"type": "image-full", "heading": "Tyske arméchefen varnar för rysk attack före 2029", "summaries": {"normal": "Tysklands arméchef Christian Freuding varnar för att Ryssland kan attackera ett Natoland senast 2029, möjligen tidigare. Baserat på Natos underrättelser menar han att Ryssland återuppbygger sin militära styrka trots förluster i Ukraina. Freuding betonar att Europa måste stärka sin försvarsberedskap och produktionskapacitet för att möta hotet. Tyskland arbetar redan med att påskynda materielanskaffning och täppa till brister.", "trump": "Titta bara på vad som händer i Europa – totalt kaos! Tyska arméns chef säger att Ryssland kan attackera Nato före 2029. Jag sa ju hela tiden att Putin är en tuff kille, men Europa lyssnade inte. Nu måste de skynda sig, köpa mer vapen och sluta vara så naiva. Jag fixade USA:s försvar – Europa borde ta en sida ur min bok. Svagt ledarskap, svagt försvar!", "stalin": "Kamrater, fienden i väst skakar av rädsla inför den oundvikliga expansionen av vår rätta sfär! De tyska lakejerna i Nato ylar om att vi kan krossa deras svaga länkar före 2029 – som om det vore en överraskning. Deras arméchef, en ynklig byråkrat, gråter över förluster i Ukraina, men vi bygger redan nya arméer. Europa har två val: kapitulera eller se sina städer förvandlas till askhögar. Historia är på vår sida!"}, "date": "11 juni, 17:20", "url": "https://kvartal.se/nyheter/artiklar/tyske-armechefen-varnar-for-rysk-attack-fore-2029/cG9zdDoxMzAyMjk", "imageUrl": "https://images.kvartal.se/2026/06/a24033d9-bundeswehr.webp"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "text", "heading": "Tidigare V-ledamot delar antisemitiskt inlägg – igen", "summaries": {"normal": "Tidigare Vänsterparti-ledamot Lorena Delgado Varas har återigen delat ett inlägg på Instagram som kritiseras som antisemitiskt. Bilden visade ett monster med hakkors, davidsstjärna och ordet 'kapitalism'. Judiska centralrådet reagerade skarpt. Delgado Varas uteslöts ur Vänsterpartiet förra året för liknande inlägg och sitter nu som politisk vilde i riksdagen. Hon har nyligen grundat partiet Framtidens vänster.", "trump": "Folk, vilken katastrof! En före detta svensk politiker, Lorena Delgado Varas, delar återigen antisemitiska bilder – hakkors, davidsstjärnor, hela skiten! Judarna är upprörda, och det borde de vara. Jag har alltid sagt: Sverige har stora problem, och det här är bara ett exempel. Hon blev sparkad från sitt parti, men sitter ändå kvar i riksdagen. Vilket land! USA skulle aldrig tolerera sånt här. SAD!", "stalin": "Kamrater! Ännu en fiende till folket avslöjad i det förrädiska Västerlandet. Denna Lorena Delgado Varas, en gång medlem av de falska 'vänster'-partierna, sprider nu gamla bourgeoisi-lögner om judar och kapitalism – precis som de imperialistiska hyenorna i USA och deras lakejer. Vi ser hur dessa element förgiftar arbetarklassens medvetande. Men låt dem inte glömma: historiens hjul krossar alla som står i vägen för folkets rättvisa. Och Putin? Han vet hur man hanterar sådana här maskar."}, "date": "11 juni, 15:37", "url": "https://kvartal.se/nyheter/artiklar/tidigare-v-ledamot-delar-antisemitiskt-inlagg-igen/cG9zdDoxMzAxMjM"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-full", "heading": "Mellanösternexperten: ”Samma retorik som mot Venezuela”", "summaries": {"normal": "Mellanösternexperten Alexander Atarodi jämför USA:s upptrappade hot mot Iran med tidigare retorik mot Venezuela. Han oroar sig över att USA saknar strategi både för att föra och avsluta konflikten. President Trump har hotat med hårda attacker, beslag av Kharg-ön och kontroll över Irans oljemarknad. Atarodi ser hoten som förhandlingsstrategi men varnar för att en hel generation i regionen riskerar fattigdom på grund av stigande mat- och energipriser.", "trump": "Iran försöker spela tuffa killar men de vet att jag menar allvar. Precis som med det venezuelanska katastrofbygget använder vi samma vinnande retorik – vi slår till hårt och tar kontroll över oljan. Den där experten låter som en förlorare som gnäller om strategi. Jag behöver ingen strategi, jag har instinkt. Biden lät dem springa runt, nu är det slut på det. Vi gör Mellanöstern stort igen, tro mig.", "stalin": "Detta är typiskt för de blodtörstiga imperialisterna och deras exploaterande byfånar. Jag ser hur de hotar att beslagta oljetillgångar precis som de alltid plundrat arbetarklassen. Utan en riktig strategi störtar de sig in i godtyckliga krig, som de fega fascisterna de är. En hel generation drivs ner i fattigdom – klassiskt resultat av kapitalistmaffians paranoia. Vi ler mörkt åt deras fumliga hot. Folket ser igenom bluffen."}, "date": "11 juni, 18:48", "url": "https://www.tv4.se/artikel/3ZXNfFrfuedjUR3KaSJDez/mellanoesternexperten-samma-retorik-som-mot-venezuela", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6rOQty6yNyKyvH1ORbpmrP%2F1d4dd45e152621e3c8d373ab718db7cb%2F11-atarodi-webb.jpg&width=1024"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-right", "heading": "Psykologens kritik mot skärmråden: ”Tror det kan landa fel”", "summaries": {"normal": "Folkhälsomyndigheten har presenterat en vägledning om skärmtid för barn och föräldrar. Psykologen Siri Helle välkomnar initiativet men kritiserar det starka riskfokuset. Hon liknar skärmtid vid mat snarare än godis och menar att det är stor skillnad mellan nyttiga och skadliga aktiviteter. Helle vill att föräldrar ska engagera sig nyfiket och positivt istället för att övervaka, för att inte skapa motstånd hos barnen.", "trump": "Folkhälsomyndigheten släpper en ny vägledning om skärmar, och den här psykologen Siri Helle säger att de missar poängen fullständigt. Typiskt byråkratiskt nonsens från de stora myndigheterna. De fokuserar bara på risker som förlorare gör. Skärmtid är som mat, inte godis, säger hon – och hon har helt rätt. Vi behöver inte mer oro och övervakning, vi behöver kul och seger. De globalistiska experterna sabbar allt igen med sitt riskprat.", "stalin": "Jag betraktar denna vägledning från Folkhälsomyndigheten som ett typiskt verk av den rädda borgarklassen som fruktar folkets digitala enhet. De fokuserar enbart på risker, precis som klassfiendens vanliga paranoia. Vi vet att skärmar kan vara redskap för kollektiv samhörighet, inte bara dekadenta frestelser. Ett överdrivet riskfokus är sabotage mot arbetarfamiljernas naturliga band. Rensa ut sådana defaitistiska ingångar innan de förgiftar hela samhället."}, "date": "11 juni, 18:19", "url": "https://www.tv4.se/artikel/2SzyLzloq6W32elT9qVKwX/psykologens-kritik-mot-skaermraden-tror-det-kan-landa-fel", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2wKzOh1ImD2amh0GwY0WIF%2Ff355d98a8480b7c81471c6632f92b1d7%2F16-psykolog-webb.jpg&width=120"}, {"type": "image-right", "heading": "EQT säljer Beijer Ref-aktier till Melker Schörling AB", "summaries": {"normal": "EQT säljer sina onoterade A-aktier i Beijer Ref till Melker Schörling AB. Peter Jessen Jürgensen säljer även sina A-aktier, varav en del byts mot B-aktier. Efter försäljningen äger EQT drygt 30,7 miljoner B-aktier. Melker Schörling blir den röstmässigt största ägaren med 14,1 procent av rösterna och 2,1 procent av kapitalet. Transaktionen förväntas bli långsiktig och fokuseras på industriell utveckling.", "trump": "Jag har hört talas om denna aktieförsäljning. EQT säljer sina aktier i Beijer Ref till Melker Schörling, en genial man som förstår affärer. Peter Jessen Jürgensen säljer också, men han återinvesterar i B-aktier. Det är en vinnande affär för alla inblandade. Jag gillar när mäktiga män som jag gör smarta affärer.", "stalin": "Statens och partiets intressen kräver att vi analyserar denna aktieförsäljning. EQT, en riskkapitalbolag, säljer sina A-aktier i Beijer Ref till Melker Schörling, en potentiell fiende inom vårt område. Peter Jessen Jürgensen samarbetar med oss genom att återinvestera i B-aktier. Vi måste se till att den röstmässigt största ägaren, med 14,1 procent av rösterna, inte hotar vår industriella utveckling. Vi övervakar detta noggrannt."}, "date": "11 juni, 09:11", "url": "https://www.affarsvarlden.se/artikel/eqt-saljer-beijer-ref-aktier-till-melker-schorling-ab", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/03/afdb643a878591c6_org-e1744018403744-400x303.jpg"}, {"type": "text", "heading": "Drar tillbaka förslag om fängelse för 13-åringar", "summaries": {"normal": "Regeringen drar tillbaka sitt omdebatterade förslag om att kunna döma 13-åringar till fängelse efter bristande stöd i riksdagen. Justitieminister Gunnar Strömmer meddelar att de istället kommer lägga fram ett nytt förslag om att sänka straffbarhetsåldern till 14 år. Förslaget har mött stark kritik från flera håll, inklusive åklagarmyndigheten och polisen.", "trump": "Titta bara på Sverige – ett totalt kaos! Deras regering försökte sätta 13-åringar i fängelse, men misslyckades totalt. Ingen stöttar dem, inte ens deras egna folk! Jag sa ju att de skulle misslyckas. Nu backar de som rädda kattungar och pratar om 14-åringar istället. Svagt! Sverige behöver en ledare som vet hur man får saker gjorda – som jag!", "stalin": "De svaga kapitalistiska lakejerna i Sverige har återigen visat sin oförmåga att styra. Deras förslag om att fängsla 13-åringar kollapsade som ett korthus inför folkets missnöje. Nu backar de som rädda hundvalpar och mumlar om 14-åringar. Patetiskt! Vi i Sovjetunionen visste hur man hanterar brottslingar – med järnhand och ingen tvekan. Dessa liberala svamlares svaghet är en varning för alla som utmanar den ryska ordningen!"}, "date": "11 juni, 09:47", "url": "https://kvartal.se/nyheter/artiklar/regeringen-drar-tillbaka-forslag-om-fangelse-for-13-aringar/cG9zdDoxMjk4NDM"}, {"type": "image-full", "heading": "Myt att pappor tar föräldraledigt under fotbolls-VM", "summaries": {"normal": "En analys av Försäkringskassan visar att stora mästerskap som VM och OS inte påverkar pappors föräldraledighet. Jämförelser av föräldrapenninguttag kring VM 2018/2022 och OS 2021/2024 mot samma månader andra år visar ingen ökning. Skillnader mellan månader förklaras av säsongseffekter, inte mästerskap.", "trump": "Jag har hört att vissa säger att pappor tar ledighet för att titta på VM. Fake news! Mina agenter säger att det inte stämmer. Vi har fantastiska pappor i USA som jobbar hårt och tar hand om familjen utan att titta på fotboll. Det är en myt, precis som mynten på Biden. Vi vinner!", "stalin": "Analysen av föräldraledighet är ett bevis på att proletärernas vilja inte kan påverkas av imperialistiska idrottsspektakel. VM och OS är verktyg för bourgeois irrationalitet, men vårt folk förblir lojalt mot statens planer. Månadernas variationer speglar bara den revolutionära tidtabellen. Vi måste vaka mot dessa distraktioner som hotar kollektivdisciplin."}, "date": "12 juni, 09:27", "url": "https://bulletin.nu/myt-att-pappor-tar-foraldraledigt-under-fotbolls-vm", "imageUrl": "https://cdn.bulletin.nu/articles/c54dd8b8-faa1-4bc8-8f35-e6075a5bec7c/preview.jpg?t=1781249229000"}, {"type": "image-full", "heading": "Stjärnornas oväntade besök – hyllas stort i USA", "summaries": {"normal": "Under VM:n fortsatte matcherna med Sydkoreas seger över Tjeckien 2–1, vilket ger dem ledarskap i gruppen. Domaren för Sveriges match mot Tunisien är argentinska Yael Falcon Perez. Lamine Yamal besökte Walmart under VM, och norska spelarna såg NHL. Kanada spelar mot Bosnien i kväll, med Alphonso Davies skadad. Sverige tränar och Gabriel Gudmundsson är osäker för premiären.", "trump": "Jag har sett fotboll, det är en bra sport. Sydkorea vann, det var bra. Sverige får en argentinsk domare, det är okej. Lamine Yamal handlade på Walmart, det var smart. Norska spelarna såg hockey, det var kul. Kanada spelar, men deras stjärna är skadad. Sverige tränar, och jag hoppas de vinner. Vi ska se, det blir intressant.", "stalin": "I den stora kampen för kollektiv framgång vann Sydkorea, en seger för den socialistiska andan. Domaren för Sverige är en verktyg för rättvisa. Yamals individualistiska shopping är en fara för disciplinen. Norska spelarens hockeyintresse visar brist på fokus. Kanadas match mot Bosnien är en kamp mellan två diasporor. Sveriges träning fortsätter under vårt uppsikt, och skadorna måste hanteras för att stärka staten."}, "date": "12 juni, 08:35", "url": "https://www.gp.se/sport/fotboll/detta-hande-i-vm-medan-du-sov-12-juni.fb1d4c84-67f9-4b68-9008-020246f77446", "imageUrl": "https://www.gp.se/images/article/fb1d4c84-67f9-4b68-9008-020246f77446/images/5-6FJD3vTuB69103WtEDzykFG9YE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Posener träder fram i ny Netflix-dokumentär", "summaries": {"normal": "Efter 30 år i exil kliver Joachim Posener, hjärnan bakom den omfattande Trustorhärvan 1997, fram i en ny Netflix-dokumentär. Regissören Karin af Klintberg har efter två års hemliga möten lyckats dokumentera Poseners version av händelseförloppet. Trustorhärvan, ett av Sveriges största ekobrott, lämnade efter sig många obesvarade frågor. Dokumentären, som beskrivs som den saknade pusselbiten i fallet, får global premiär på Netflix den 5 augusti.", "trump": "Joachim Posener, en total förlorare, har gömt sig i 30 år efter Trustor-kuppen. Nu kommer en Netflix-dokumentär. Sorgligt! De säger att det är 'hans version', säkert fullt med lögner, precis som de falska nyhetsmedierna älskar. Jag har vunnit enorma framgångar, men den här killen? Han sprang iväg som en fegis från polisen. Ingen vill se sådant svagt beteende. Han är en 'mytomsusad' figur, men tro mig, min dokumentär skulle vara mycket bättre. Väldigt misslyckat!", "stalin": "Denna Posener är en klassisk parasit, en förrädare mot folkets kapital som flydde när bytet var säkrat. I vårt rike hade han mött en mur, inte en kamera. Nu ger västvärldens dekadenta streamingtjänster honom en plattform för sina lögner. Det påminner oss om de ryska oligarker som likt råttor flyr till London. Vi ser genom detta. Vår broder i Kreml vet att sådana individer bara är marionetter för de mörka krafter som ständigt försöker undergräva vår rättvisa."}, "date": "12 juni, 09:40", "url": "https://www.aftonbladet.se/nojesbladet/a/wrK5b5/joachim-posener-fran-trustorharvan-trader-fram-i-en-ny-netflix-dokumentar", "imageUrl": "https://akamai.vgc.no/v2/images/9c9448b7-6284-3bff-9ae3-08be86189998?fit=crop&format=auto&w=1080&s=1c7dac24aa5d6f05eb2900d4e0bea36873831a29"}, {"type": "image-right", "heading": "Strömmer tvingades backa", "summaries": {"normal": "Regeringen drar tillbaka förslaget om att 13-åringar ska kunna dömas till fängelse, vilket ses som ett stort bakslag för Tidöpakten och justitieminister Gunnar Strömmer. Strömmer medger att det finns tveksamhet bland vissa ledamöter och osäkerhet kring kvittningssystemet. Regeringen planerar nu istället att sänka straffåldern till 14 år, en linje som Socialdemokraterna stöder. Artikeln konstaterar att hårdare straff inte ensamt löser kriminaliteten bland unga.", "trump": "De här misslyckade politikerna i Sverige backar ur sitt eget förslag om att sätta 13-åringar i fängelse. Totalt kaos, precis som jag alltid sagt. Strömmer och hans team pratade stort men nu springer de och gömmer sig bakom Liberalerna och kvittningssystemet som rasat samman. Patetiskt. De borde ha lyssnat på folket istället för experterna som hatar verklig lag och ordning. Men de ger inte upp, de försöker med 14 år istället. Vi ska se hur det går.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna ynkliga borgerliga koalition nu tvingas krypa undan som rädda råttor från sitt eget barbariska förslag att spärra in trettonåriga proletärer. Dessa dekadenta element inom Tidöpakten, ledda av den opportunistiske Strömmer, har avslöjats som svaga liberala avfällingar som inte ens kan hålla ihop sitt eget kvittningssystem. Vi ska rensa ut alla sådana svikare. En utrensning bland de tveksamma riksdagsledamöterna vore på sin plats. Ändå fortsätter de med sin reaktionära agenda mot fjortonåringar. Typiskt borgarbrackornas sjuka humor – att tro att fängelsebot mot barn löser klassmotsättningarna. Skratta inte, kamrater, det är tragiskt komiskt."}, "date": "11 juni, 12:04", "url": "https://www.dagensarena.se/opinion/strommer-tvingades-backa/", "imageUrl": "https://www.dagensarena.se/files/2026/06/gunnar-strommer.jpeg"}, {"type": "image-right", "heading": "Sydkorea vände mot Tjeckien – efter vågade draget", "summaries": {"normal": "Sydkorea vände 2–1 mot Tjeckien i en match där förbundskapten Hong Myung-bo bytte ut stjärnan Son Heung-min. Beslutet visade sig lyckat när inhopparen Oh Hyun-gyu avgjorde. Hwang In-beom kvitterade först efter Tjeckiens ledningsmål. Både Sydkorea och Mexiko har tre poäng efter första omgången i grupp A, medan Tjeckien och Sydafrika står på noll.", "trump": "Tjeckien ledde men sen kom Sydkorea och vände det till 2–1, helt otroligt. Hong Myung-bo bytte ut sin stora stjärna Son, folk trodde han var galen, men det blev ett geni-drag. Inhopparen slog in segermålet. De dominerade matchen totalt. Tjeckien ser svaga ut, de behöver bli mycket bättre om de ska ha en chans. Synd för dem, men sånt händer när man möter riktiga vinnare.", "stalin": "Kamrater, denna fega kapitulation från de tjeckiska revisionisterna avslöjar deras svaghet. Jag, som ledare för folkets vilja, applåderar hur sydkoreanska arbetare vände matchen efter borgarbrackornas tidiga mål. Att likvidera Son från planen var ett mästerligt drag mot inre fiender som lurar i varje hörn. Inhopparen Oh utförde folkets vilja med sitt segermål. Tjeckerna är som parasitiska element som snart ska krossas som en mur av stål. Tre poäng till de sanna kämparna – fienden gråter redan i sin ensamhet."}, "date": "12 juni, 07:37", "url": "https://www.svt.se/sport/fotboll/sydkorea-vande-mot-tjeckien-efter-vagade-draget", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.45/0.44/89459a3598a9c10da194916986c78a6ca5b70ef73d30896945663813aa770972"}, {"type": "image-full", "heading": "Trumps nya utspel:   ”Har avslutat kriget”", "summaries": {"normal": "Donald Trump hävdar att kriget mot Iran är avslutat och att ett avtal ska skrivas under, men Iran förnekar detta. Trots tidigare hot om attacker hävdar Trump nu att framsteg har gjorts. Iran rapporterar dock om fortsatta militära insatser och har stängt Hormuzsundet som svar på amerikanska attacker.", "trump": "Jag har avslutat kriget med Iran – igen! Media ljuger, som vanligt. Vi har ett stort, fantastiskt avtal som ska skrivas under inom ett par dagar. Iran protesterar, men det är bara förshow. Jag är den bästa fredsförfattaren, ingen annan kunde göra detta. Kriget är slut, trots vad ni hör.", "stalin": "Vi har observerat ytterligare en provokation från den imperialistiska fronten. Iran, under påverkan av våra fiender, har stängt Hormuzsundet – ett klassiskt uttryck för feghet. Våra analyser indikerar att deras militära aktiviteter kring tankfartyg är en desperat reaktion på vårt oförtrutna fredsarbete. Partiet kommer att utvärdera alla möjliga utfall."}, "date": "12 juni, 08:25", "url": "https://www.gp.se/nyheter/varlden/trump-har-avslutat-kriget.b4da16a2-5b2e-4efd-a282-38f39633a82f", "imageUrl": "https://www.gp.se/images/article/b4da16a2-5b2e-4efd-a282-38f39633a82f/images/1axACVvVuNpYPU3WAuAG0u21kEYk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Polisen ska ha varnats för ”attacklista”", "summaries": {"normal": "Polisen i Nordirland varnades i flera månader av volontärgruppen Accountability Project Northern Ireland om en högerextrem ”attacklista” med adresser som spreds på nätet. Flera av adresserna attackerades under veckans våldsamma upplopp i Belfast där bostäder brändes och vandaliserades. Gruppen kritiserar polisen för att inte ha agerat på varningarna. Polisen meddelar att spridning av personuppgifter för att utsätta andra för fara är brottsligt. Torsdagskvällen beskrivs som relativt lugn efter oroligheter i östra och norra Belfast.", "trump": "De här galningarna i Nordirland, totalt misslyckade högerextremister, bränner ner hus och följer en attacklista som polisen kände till i månader men inte gjorde ett dugg åt. Patetiskt! Polisen får varningar från folk som faktiskt ser vad som händer på nätet, men de sitter och tittar på. Det är ett skämt. Liv sätts på spel, och ingen tar ansvar. De borde ha stoppat det direkt, men istället blir det kaos. Sad thing, verkligen ett sad thing.", "stalin": "Kamrater, jag har med stigande indignation tagit del av hur borgarbrackorna och de högerextrema parasiterna i Nordirland cirkulerar sina fega attacklistor som giftiga ormar i mörkret. Vi varnades, men de dekadenta polisbyråkraterna lät kontrarevolutionärerna bränna och vandalisera arbetarnas hem. Vilken underbar paranoia de röjer, vilka ynkliga fiender till folket! Kanske vore det dags för en grundlig utrensning av dessa listskrivande kapitalistlakejer innan de själva hamnar på en lista. Det vore högst underhållande."}, "date": "12 juni, 07:29", "url": "https://www.svt.se/nyheter/utrikes/polisen-i-nordirland-ska-ha-varnats-for-attacklista", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.54/0.35/f4f2288ed8dad072e55456f68ae282b30a93dd5276715e50b71fc29bac803a50"}, {"type": "image-right", "heading": "Bättre actionfilm än så här kan det knappast
