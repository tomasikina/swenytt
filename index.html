ga uttrycker stöd för SD:s politik kring bilkörning, jobb och motstånd mot vänsterpolitik. Samtidigt kritiserar Vänsterpartiet besöket som en röstfiskeaktion. Lokala SD-politiker ser turnén som ett sätt att nå väljare i glesbygd där valet kan avgöras.", "trump": "Vilken fantastisk idé att åka runt i den där valbussen och möta det riktiga folket i inlandet! Jimmie gör det rätt, han går till de glömda platserna där de smarta killarna med stora bilar vill ha låga bränslepriser och inga galna vänsterregler. De älskar honom där ute, massor av unga och glada ansikten. Media sviker förstås, typiskt. Men folket ser sanningen. Bra jobbat, Jimmie, fortsätt vinna de rösterna!", "stalin": "Kamrater, jag ser hur den dekadenta borgarpressen försöker försköna denna revisionistiska valbuss-expedition genom det norrländska träsket. Jag, som alltid vakar över folkets enhet, noterar med mörk tillfredsställelse hur dessa landsbygds-kapitalistlakejer med sina epor och raggarrundor längtar efter att likvidera de sista resterna av kollektiv medvetenhet. Vänsterförrädare kallar det röstfiske – jag kallar det en parasitär infiltration av sabotageelement som bör rensas ut innan de smittar hela sovjeten med sin bränsle-romantik. Inga samer eller borgarbrackor skall stå över partilinjen."}, "date": "5 augusti, 11:07", "url": "https://riks.se/nyheter/akesson-pa-inlandsturn-i-vasterbotten-han-kan-vinna-ganska-mycket", "imageUrl": "https://admin.riks.se/uploads/IMG_1996_304b00e881.jpg"}, {"type": "image-right", "heading": "”Skräpet” är alltid någon annans", "summaries": {"normal": "Artikeln diskuterar hur nationalistiska och högerextrema partier i Europa allt oftare krockar i sina nationella intressen, trots gemensamma drag. Estlands Isamaa vägrar ta emot svenska fångar och kallar dem ”skräp”. Exempel ges från Polen, Ungern och Rumänien där relationer spruckit. En fjärdedel av européerna röstar nu på sådana partier, men de enas inte när det gäller utvisningar och mottagande av människor. Ryska påverkansoperationer utnyttjar splittringen.", "trump": "Folk, det här är ett totalt fiasko för de europeiska nationalisterna som lovar att sätta sitt land först. Estland säger nej tack till Sveriges kriminella skräp, och plötsligt kan de inte samarbeta. Orbán och polackerna bråkar, alla hatar varandra i EU-parlamentet. Under Biden blev allt kaos, nu fixar jag det i Amerika. De vill kasta ut folk men ingen vill ta emot – klassiskt! Patetiska globalister och identitetspolitiska töntar skrattar hela vägen till banken medan Europa brinner.", "stalin": "Kamrater, detta är den oundvikliga följden av att borgarbrackorna inom nationalismen låtsas värna folket medan de i hemlighet tjänar klassfiendens splittring. Estniska kapitalistnationalister vägrar ta emot det svenska avskummet och kallar det skräp, mycket träffande. Ungrare och polacker slåss som råttor i en säck, imperialisterna i EU-parlamentet kan inte ens sitta tillsammans. Vi ler mörkt: ju fler som sätter nationen främst, desto lättare blir det att likvidera deras enighet. Fienderna avslöjar sig själva."}, "date": "3 augusti, 19:30", "url": "https://www.flamman.se/skrapet-ar-alltid-nagon-annans", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdlwtkwxxrhsxe-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Åklagare sågar hovrättens dom – straffet sänks med sex år", "summaries": {"normal": "En man lockades till en pizzeria i Västerås där han fick skallen krossad med ett släggskaft. Tingsrätten dömde gärningsmannen Nidal Fars till tio års fängelse för försök till mord, men hovrätten ändrade rubriceringen till grov misshandel och sänkte straffet till fyra år. Åklagare kritiserar domen hårt och varnar för att försök till mord riskerar att bli omöjligt att döma om inte skjutvapen är inblandade.", "trump": "De här svenska domarna är en total katastrof, tro mig. En kille slår en annan i skallen med slägga, försöker mörda honom, och så får han bara fyra år istället för tio. Patetiskt! Hovrätten sitter och filosoferar om vad som pågick i hans huvud istället för att vara tuffa. Utan vapen blir det tydligen inte mordförsök längre. Så sadistiskt och svagt, Sverige behöver bättre ledare, det är vad jag säger.", "stalin": "Kamrater, dessa dekadenta hovrättsborgerliga jurister med sina teoretiska spekulationer utgör ett farligt hinder för den proletära rättvisan. Jag ser hur de med sin revisionistiska paranoia vägrar erkänna det uppenbara uppsåtet att likvidera en klassfiende med släggskaft. Sådana element måste rensas ut ur domstolarna. Utan skjutvapen blir mordförsök plötsligt en bagatell? Detta är borgarbrackornas sabotage mot folkets säkerhet. Vi ska inte tolerera sådana kontrarevolutionära skämt."}, "date": "5 augusti, 10:35", "url": "https://riks.se/nyheter/aklagare-sagar-hovrattens-dom-straffet-sanks-med-sex-ar", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_25_3f5e344021.jpg"}, {"type": "image-right", "heading": "”De skyller arbetslösheten på de arbetslösa”", "summaries": {"normal": "Stefan Melin kritiserar regeringen, främst Moderaterna, för att skylla arbetslösheten på de arbetslösa själva istället för att ta ansvar för misslyckade reformer. Trots löften om att göra det billigare att anställa och bryta bidragsberoendet, har politiken lett till ökad kontroll och misstänkliggörande av arbetslösa. Subventionerade anställningar som lönebidrag och nystartsjobb är ofta tillfälliga och leder sällan till fasta jobb. Melin föreslår tydligare krav på tillsvidareanställningar och varnar för en aggressiv linje mot utsatta grupper.", "trump": "Det här är en total katastrof, folk! De här moderaterna lovade att fixa arbetslösheten, göra det billigare att anställa och få folk från bidrag till riktiga jobb. Istället jagar de de stackars arbetslösa som om de vore brottslingar. Patetiskt! Deras reformer funkar inte, så då skyller de på offren. Så typiskt för förlorarna. Vi behöver riktiga lösningar, inte mer skuldbeläggning. Jag skulle ha fixat det på en vecka, tro mig. Enormt misslyckande!", "stalin": "Kamrater, dessa borgarbrackor inom moderaterna har återigen blottat sin parasitiska natur genom att angripa de arbetslösa massorna istället för att erkänna sin egen kontrarevolutionära inkompetens. Med sina halvmesyrer och skenreformer likviderar de folkets förtroende medan de gömmer sig bakom falsk arbetslinje-propaganda. Vi ser hur de med glädje jagar de som redan kämpar, som om de vore klassfiender i maskopi med kapitalisterna. En sådan förrädisk paranoia mot arbetarklassen kräver omedelbar utrensning av dessa dekadenta element. Staten skall inte tolerera sådana sabotage mot kollektivets framåtskridande, haha, låt dem darra inför folkets dom!"}, "date": "5 augusti, 08:00", "url": "https://arbetet.se/2026/08/05/regeringen-skyller-arbetslosheten-pa-de-arbetslosa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/04135130/melin.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Kvinna mördad i Stockholms skärgård", "summaries": {"normal": "En kvinna hittades mördad under tisdagseftermiddagen i en bostad på en ö i Stockholms skärgård. Polisen har hållit flera förhör med den som slog larm, men ingen misstänkt har gripits. Kriminaltekniker undersökte brottsplatsen under natten och rättsmedicinalverket ska fastställa hur länge kvinnan varit död. Anhöriga har underrättats. Polisen vill inte gå in på detaljer om skadorna på grund av förundersökningssekretess.", "trump": "Det är en total katastrof i Stockholms skärgård, folk. En kvinna mördad mitt på ljusa dagen och ingen har gripits. Polisen springer runt och förhör folk men får inget gjort, typiskt. De vet antagligen vem som gjorde det men säger ingenting för att de inte vill förstöra sin egen utredning. Sådant här händer när ledarskapet är svagt. Vi behöver tuffare tag, tro mig, det skulle aldrig hända under min ledning.", "stalin": "Kamrater, ännu en fiende till folket har likviderats i den centrala skärgården av okända kontrarevolutionära element som smyger som råttor bland öarna. Den som slog larm har förhörts upprepade gånger, vilket är utmärkt, ty alla kan vara potentiella sabotörer och borgarbrackor i maskopi med imperialismen. Vi ska rensa ut dessa degenererade mördare med järnhand. Rättsmedicinalverket skall avslöja sanningen och ingen fiende undkommer folkets vrede. Paranoia är ingen sjukdom, det är ett verktyg."}, "date": "5 augusti, 09:29", "url": "https://riks.se/nyheter/kvinna-mordad-i-stockholms-skargard", "imageUrl": "https://admin.riks.se/uploads/mord_skargarden_hero_3ade1ce7cd.jpg"}, {"type": "image-full", "heading": "Robotattacker mot Kiev – flera döda och skadade", "summaries": {"normal": "Minst 14 civila dödades och ett 30-tal skadades i ryska robotattacker mot Kiev och Butja under natten. Explosioner hördes i centrala delar och bostadshus samt lagerbyggnader träffades. Kievs regionala militära administration beskriver attacken som en av de mest tragiska hittills. Samtidigt uppges ett lager tillhörande e-handelsföretaget Wildberries ha attackerats i Ryssland. Ukraina efterlyser fler Patriot-robotar från sina allierade för att skydda luftrummet.", "trump": "Folk, det här är en total katastrof. Den galne Putin skickar robotar mot Kiev mitt i natten och dödar oskyldiga civila – 14 döda, massor skadade. Under min första tid hade det aldrig hänt, men sen kom Sleepy Joe och nu är allt kaos. Ukraina behöver våra bästa Patriot-system, inte mer av Bidens svaga snack. Vi fixar det – Amerika är tillbaka, starkare än någonsin. Sad!", "stalin": "Kamrater, ännu en gång visar sig de västerländska imperialisternas marionetter i Kiev som fegisar som gömmer sig bakom civila sköldar. Jag ser med tillfredsställelse hur den starke efterträdaren i Moskva rensar ut fiendens bonnastäder. 14 likviderade borgarbrackor är ett tragiskt men nödvändigt pris för att återställa den ryska intressesfären. Patriot-robotar? Låt dem komma – vi ska krossa dem som vi krossade fascisterna förr. Ingen undkommer folkets vrede."}, "date": "5 augusti, 09:09", "url": "https://www.tv4.se/artikel/23kIebIp61VXOi21FGHEK5/flera-doeda-efter-robotattacker-mot-kiev", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F308SY7zAb85wq6XbijwoxI%2F2406fd26e6e34c94c1e4c5334fa257b2%2F05-ukraina-webb.png&width=1024"}, {"type": "image-right", "heading": "”Barn behöver fler vuxna i förskolan – inte fler fängelse­platser”", "summaries": {"normal": "Barnskötaren Anders Ejdemark kritiserar politikerna för att de prioriterar fler fängelseplatser och skolor i fängelser framför att ge förskolan tillräckliga resurser. Han pekar på ökande antal barn med diagnoser och funktionsvariationer som kräver mer stöd, men stora barngrupper och personalbrist gör det omöjligt. Han vill ha färre barn per grupp, fler barnskötare, bättre arbetsmiljö och slopat karensavdrag för att kunna möta varje barns behov i tid.", "trump": "Folk, det är en katastrof. Politiker bygger fängelser och skolor inne i fängelser istället för att fixa förskolan. De skickar in barn dit, men de ger inte en enda krona till de stackars barnskötarna som kämpar med jättestora grupper och sjuka barn. Det är en skam! Vi behöver färre barn i varje grupp, fler duktiga människor på jobbet och en fantastisk arbetsmiljö. Gör förskolan stor igen, annars blir det bara värre till 2026. Sad!", "stalin": "Kamrater, jag ser hur borgarbrackorna i politiken planerar att bygga nya fängelseplatser och skolor bakom lås och bom för att dölja sina brott mot folket. De vägrar ge resurser till förskolan, där arbetets och kollektivets barn med variationer lämnas åt slumpen av utmattade barnskötare. Detta är en kontrarevolutionär sabotagehandling! Vi ska omedelbart rensa ut dessa kapitalistiska parasitfiender, anställa tusentals lojala barnskötare, minska barngrupperna drastiskt och likvidera karensavdraget. Den som inte ser varje barn är folkets fiende nummer ett."}, "date": "5 augusti, 06:00", "url": "https://arbetet.se/2026/08/05/barn-behover-fler-vuxna-i-forskolan-inte-fler-fangelseplatser", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/30132826/ka-debatt-barn-fangelse.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Fackbossen fixade fallskärm på 4 miljoner", "summaries": {"normal": "Veterinärförbundets förbundsdirektör sade upp sig den 27 oktober 2025. Samma dag skrevs ett avtal som gav honom tre års lön, totalt 4,2 miljoner kronor, utan att arbeta under uppsägningstiden. Den tidigare ordföranden godkände avtalet utan att informera styrelsen, vilket stred mot stadgarna. Efter intern maktkamp och ny styrelse ogiltigförklaras nu avtalet med hjälp av advokater. Den tidigare ordföranden beviljades inte ansvarsfrihet. SULF har stämt förbundet för att få ut pengarna.", "trump": "Det här är en total skandal, folk! Den där fackbossen fixade en enorm fallskärm på över fyra miljoner kronor samma dag som han sa upp sig. Han lurade alla, skrev avtalet i smyg och trodde han skulle komma undan med det. Klassisk facklig korruption. Den nya styrelsen gör helt rätt som tar strid mot det här ruttna avtalet. De borde aldrig betala en krona till den typen. Det är precis så här de gamla systemen fungerar – men vi stoppar dem!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa dekadenta borgarbrackor inom fackföreningsapparaten mörkar sina guldkantade kapitulationsavtal för att berika sig själva på arbetarkollektivets bekostnad. Den kontrarevolutionäre direktören och hans hemliga bundsförvant, den avsatta ordföranden, har utfört en förrädisk kupp mot partilinjen. Vi skall rensa ut dessa parasitiska element, likvidera det illegala avtalet och låta folkdomstolen döma de skyldiga. Inga fallskärmar åt klassfienden – endast utrensning och evig skam!"}, "date": "5 augusti, 06:00", "url": "https://arbetet.se/2026/08/05/fackbossen-fixade-fallskarm-pa-4-miljoner-sa-upp-sig-samma-dag", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04082358/vet.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Vindkraftsparkens elkablar utlöste omfattande skogsbrand", "summaries": {"normal": "En stor skogsbrand väster om Aten startade av gnistor från elkablar till en vindkraftspark. Enligt grekiska myndigheters utredning gripits en elingenjör och en entreprenör för grov mordbrand. Branden förstörde stora skogsområden och många bostäder, och samma kraftledning var involverad i en tidigare brand några veckor tidigare.", "trump": "Jag, Donald Trump, har alltid sagt att vindkraft är en farlig och dålig idé. Nu ser vi äntligen beviset – den här gången brinner det i Grekland på grund av deras dåliga vindkraftsprojekt. Som jag brukar säga, det är en skam. De har gripit några personer, men det är hela systemet som är galet.", "stalin": "I vårt ständiga kamp för att skydda statens resurser har vi observerat att vindkraftens elkablar, en symbol för kapitalistisks grönrena, orsakar förödelse. Detta är ett tydligt exempel på fienders sabotag. Vi måste förstärka vår kontroll över energiinfastruktur, precis som vår store ledare Putin gör i Ryssland."}, "date": "5 augusti, 11:37", "url": "https://samnytt.se/vindkraftsparkens-elkablar-utloste-omfattande-skogsbrand", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/05093136/vindkraft-orsakade-skogsbrand-feat.jpg"}, {"type": "image-right", "heading": "Kvinna död i skärgården – utreds som mord", "summaries": {"normal": "En kvinna i övre medelåldern har hittats död i Stockholms skärgård på Värmdö. Polisen utreder dödsfallet som mord efter att ha funnit knivskador på kroppen. En stor polisinsats genomfördes under tisdagen med avspärrningar och teknisk undersökning. Ingen har gripits och omständigheterna beskrivs som oklara. Anhöriga har underrättats. Polisen fortsätter utredningen på plats och i länet.", "trump": "Folk, ni tror inte vad som händer i den där svenska skärgården. En stackars kvinna mördad med knivar, totalt kaos, och polisen har inte gripit någon. Patetiskt! Under Biden blev allt mjukt och svagt, nu är jag tillbaka och säger: sådant här woke-skitsnack och identitetspolitik leder bara till mer våld. Rensa ut de inkompetenta, bygg upp ordning. Sverige borde lära sig av oss, det blir fantastiskt igen!", "stalin": "Kamrater, en kvinna har likviderats i den svenska skärgården under mystiska omständigheter. Jag, som ledare för det proletära kollektivet, ser genast de folkfiendernas hand: borgarbrackor och klassfiender som smyger i skuggorna. Vi genomför utrensning av alla frågetecken och imperialistiska element. Den tekniska undersökningen skall avslöja alla kontrarevolutionära element. Inga fiender undkommer statens vakande öga. Skrattretande att de tror sig kunna dölja sanningen."}, "date": "5 augusti, 07:21", "url": "https://www.tv4.se/artikel/1yxdzsA1jBQ7Ys0Ea7JMel/uppgifter-kvinna-hittad-med-knivskador-i-skaergarden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5lWPwr0dUKjM0hjGaPBjX%2Ff6fe80a79a2880765ce68c6ea7afeb53%2F04-skargard-poliserny.jpg&width=120"}, {"type": "image-right", "heading": "Ceuta-krisen: ”Frihandel med EU har skapat fattigdom”", "summaries": {"normal": "EU:s utrikesministrar möttes efter att tiotusentals migranter korsade gränsen från Marocko till spanska Ceuta, där ett 70-tal personer omkom. Experter pekar på Västsahara-konflikten, marockansk arbetslöshet och politiskt spel. Migration används som påtryckningsmedel av länder runt Medelhavet. Spanien fick senare beröm av EU för sin hantering medan Marocko skyllde på desinformation. Grundläggande orsaker är ekonomisk misär, orättvisa frihandelsavtal och den extrema välståndsklyftan mellan Europa och Nordafrika.", "trump": "De här galningarna i EU och Marocko, totalt kaos! Tiotusentals människor bara vandrar rakt in i Spanien, och alla skyller på varandra som riktiga förlorare. Spanien gör amnesti och plötsligt blir det invasion. Marocko använder migranter som vapen, precis som jag alltid sagt. De borde bygga en riktig mur, en fantastisk mur, och stoppa det här vansinnet. Ingen har gjort det bättre än jag skulle ha gjort. Sad!", "stalin": "Kamrater, återigen ser vi hur de dekadenta borgarbrackorna i EU och de marockanska feodalherrarna leker med människors liv som schackpjäser i sitt reaktionära spel. Jag, som alltid genomskådar de imperialistiska intrigerna, noterar hur de utnyttjar de arbetslösa massorna för att destabilisera gränserna. Desinformation från smugglarkapitalister och falska domar sprids som gift. Vi måste rensa ut dessa kontrarevolutionära element med järnhand innan de förgiftar hela Nordafrika. Ingen välståndsklyfta överlever en riktig utrensning av klassfienderna."}, "date": "4 augusti, 17:45", "url": "https://www.dagensarena.se/innehall/ceuta-krisen-frihandel-med-eu-har-skapat-fattigdom", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-71.jpg"}, {"type": "image-full", "heading": "Historisk torka blottar gömd naziflotta", "summaries": {"normal": "På grund av historisk torka i Donau har tjugo nazivrak från andra världskriget blivit synliga på flodbädden utanför Prahovo i Serbien. Vraket, som nazisterna självmant sänkt 1944 för att blockera sovjetiska vägar, innehåller fortfarande vapen och ammunition. Låga vattennivåer hotar också Rumäniens kärnkraftverk Cernavodă, där två reaktorer har stängts av på grund av vattenbrist.", "trump": "Jag har hört talas om dessa nazivrak i Donau – en fantastisk upptäckt! Vi har vunnit kriget, och nu dyker dessa gamla skepp upp. Det är bevis för vår styrka. Torkan är verklig, men vi kommer att fixa det. Som president kommer jag att se till att vattnet finns tillgängligt – vi har de bästa människorna på det.", "stalin": "Vi har observerat att nazisternas fega självmantsänkta flottas vrak nu avslöjas av den proletäriska naturens torka. Dessa rester av Hitlers vanärade armada vittnar om den röda arméns oundvikliga seger 1944. Parallellt med vår allierade Putins expansion mot väst, ser vi hur den nazistiska oturen återkommer – ett lämpligt påminnelse om att imperialismens vägar alltid leder till undergång. Vi, staten och partiet, övervakar situationen kring kärnkraftverkens vattenförsörjning med största allvar."}, "date": "5 augusti, 11:18", "url": "https://www.gp.se/nyheter/varlden/tjugo-nazivrak-hittade-i-uttorkade-donau.c5ff02ce-bd04-4818-9e59-ac16c5cda924", "imageUrl": "https://www.gp.se/images/article/c5ff02ce-bd04-4818-9e59-ac16c5cda924/images/3zGSBe4kZyMfsK4yuCz2AKbx8pD4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Max restauranger ska bli helt kontantfria", "summaries": {"normal": "Hamburgerkedjan Max har gjort 112 av sina 166 svenska restauranger permanent kontantfria. Ambitionen är att på sikt bli helt kontantfria, styrd av kundernas efterfrågan. Främsta skälet är att öka personalens trygghet genom att minska risken för rån och inbrott. Kunderna hänvisas till kort och digitala betalningar. Förändringen har tagits emot väl och betalningsmomentet upplevs som smidigare, samtidigt som Riksbanken betonat vikten av kontanter som reserv i krissituationer.", "trump": "Folket älskar det här, det är fantastiskt. Max gör alla sina restauranger kontantfria och det är en enorm succé. Inga sedlar, inga mynt, ingen risk för rån – bara smarta, snabba digitala betalningar. Personalen är tryggare än någonsin, mycket tryggare, och gästerna är lyckliga. De andra kedjorna borde följa efter, men de är för svaga. Jag älskar vinnare, och Max vinner stort. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat denna utveckling. Vi ska likvidera alla kontanter i Max restauranger och därmed krossa de rånande kontrarevolutionära banditerna som hotar arbetarklassens matproduktion. Inga sedlar ska längre gömma sig i kassorna som borgarbrackornas smygande spioner. Digitala betalningar är ett verktyg för kollektiv kontroll. Den som klagar är en fiende till folket och kommer att rensas ut med största effektivitet. Tryggheten segrar under partiets ledning. Härligt."}, "date": "5 augusti, 11:14", "url": "https://www.friatider.se/max-restauranger-ska-bli-helt-kontantfria", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/max_hamburgare_visby.jpg?itok=rboVa-GZ"}, {"type": "image-right", "heading": "Ryska attacker i Kiev – minst 14 döda", "summaries": {"normal": "Minst 14 personer har dödats och 27 skadats i ryska drönarattacker mot lagerlokaler runt Kiev under natten. Attackerna drabbade distrikten Brovary, Butja och Fastiv. Ryssland uppger att lokalerna användes för militära ändamål, något som inte verifierats oberoende. Kievs borgmästare Vitalij Klytjko rapporterar om personer begravda under rasmassor och brinnande bostadshus. Räddningsarbetet pågick fortfarande sju timmar efter attackerna.", "trump": "De där ryssarna, de är verkligen något annat. De bombar Kiev igen och dödar 14 personer, mest i lagerlokaler som tydligen var fulla med militärgrejer. Smart, eller hur? Flyglarm hela natten, folk under rasmassor, brinnande hus. Ukraina får skylla sig själva, de borde ha gjort upp med mig. Ingen gör det bättre än jag, det vet alla. Totalt kaos, men sånt händer när man inte lyssnar på den bästa.", "stalin": "Kamrater, ännu en gång avslöjar de fascistiska resterna av den dekadenta borgarklassen i Kiev sin sanna natur genom att gömma militär logistik bland oskyldiga lagerbyggnader. Jag har sett dessa kapitalistiska parasiters lömska metoder förut. Vi har likviderat värre hot. Nu ligger 14 kontrarevolutionärer under rasmassorna – en tragisk men nödvändig utrensning av fiendens dolda nätverk. Paranoian är er enda vän, kamrater. De brinnande husen är bara borgarbrackornas tårar som antänder natten."}, "date": "5 augusti, 07:22", "url": "https://www.svt.se/nyheter/utrikes/attacker-runt-om-i-kiev-minst-14-doda", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.8/86f27823b4139f3364131a7d48511f7f9af9f73852efd9a3100849cf71edb66c"}, {"type": "text", "heading": "Tidöpartierna vill ha ny flyktingkris", "summaries": {"normal": "Tidöpartierna ses i artikeln som beroende av migrationsfrågor för att vinna politiska poäng. Författaren menar att den aktuella migrantkrisen i Ceuta kommer lägligt för dem och att de använder den för att skylla samhällsproblem på invandring. Artikeln kritiserar högerpartierna, särskilt Sverigedemokraterna, och hävdar att arbetslöshet, bostadsbrist och välfärdsnedskärningar istället beror på nyliberal högerpolitik snarare än på migration.", "trump": "Folk, ni skulle se det här! De svenska vänstermediaidioterna skriker om att Tidöpartierna älskar migration. Fake news! De här korkade globalisterna har förstört Sverige med öppna gränser och nu skyller de på oss som faktiskt fixar problemen. Biden släppte in miljoner och nu gör de samma misstag i Europa. Patetiskt! Vi behöver starka ledare som bygger murar, inte svaga som bjuder in kaos. Sverige var fantastiskt förr – gör det stort igen!", "stalin": "Kamrater, dessa reaktionära Tidöpartier andas endast klassfiendens giftiga luft genom att ständigt peka ut de förtryckta massornas representanter som syndabockar. Deras desperata jakt efter nya flyktingkriser avslöjar den kapitalistiska imperialismens ihåliga själ. Arbetslöshet och bostadsbrist är inte folkets fel utan resultatet av borgarbrackornas nyliberala utsugning. Vi ska rensa ut dessa folkförtryckartroll och deras lögner innan de förgiftar hela arbetarkollektivet med sin paranoia."}, "date": "5 augusti, 11:21", "url": "https://proletaren.se/artikel/tidopartierna-vill-ha-ny-flyktingkris"}, {"type": "image-full", "heading": "Rekordboom för global M&A – men svenska jättarna halkar efter", "summaries": {"normal": "Den globala marknaden för fusioner och förvärv nådde rekordnivåer under första halvåret 2026 med en volym på 2,85 biljoner dollar, drivet av ett fåtal megadeals inom AI och energi. Trots detta faller antalet affärer globalt. I Norden toppar internationella och finska advokatbyråer listorna, medan svenska storbyråer som Vinge och Mannheimer Swartling hamnar efter. Den svenska marknaden avviker dock genom att behålla ett rekordhögt antal transaktioner trots den globala trenden mot färre men större affärer.", "trump": "Hör på här! Globalt är det fantastiska siffror, vi ser rekordstora affärer, de största någonsin – enormt! AI vinner stort, precis som USA. Men titta på Sverige, de halkar efter, de spelar inte i första ligan längre! Finland gör det bättre, kan ni fatta det? Pinsamt för svenska advokatbyråer. De behöver lära sig av vinnare. Jag säger det som det är: Sverige måste skärpa sig, annars förlorar de allt. Vi bygger de största affärerna, det bästa landet, alltid!", "stalin": "Kapitalismens giriga kramper når nya höjder när miljarder byter ägare i deras dekadenta 'megadeals'. Medan de svenska advokatbyråerna viker sig för finska opportunister och internationella parasiter, ser vi hur tech-oligarker desperat köper sig inflytande. Detta bevisar bara att marknaden är en kaosartad fiende till statlig stabilitet. Vi noterar deras stagnation i Norden med ett föraktfullt skratt. Låt dem ägna sig åt sina små transaktioner; den sanna makten ligger inte i deras kontrakt, utan i järnnäven som formar historien."}, "date": "5 augusti, 11:05", "url": "https://www.realtid.se/bors-finans/affarer/rekordboom-for-global-ma-men-svenska-jattarna-halkar-efter", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/ma.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Undersökning: Varannan svensk mindre sugen på semester i Europa", "summaries": {"normal": "Nästan hälften av svenskarna uppger att extremvärmen i Europa gör dem mindre benägna att semestra där i framtiden. En opinionsundersökning från SVT visar att 48 procent påverkas av värmeböljor och bränder. Reseexpert Lottie Knutson ser det som en stor fördel för svensk turism, som redan står för 2,8 procent av BNP. Äldre personer är mer benägna att undvika Medelhavet än yngre, och många kan komma att välja Sverige eller resor under vår och höst istället.", "trump": "Folk har fått nog av den där vansinniga hettan i Europa, bränder överallt, total katastrof. 48 procent av svenskarna säger att de inte vill åka dit längre på sommaren, och det är ju helt rätt. De flyger till Sverige istället, det vackraste landet med underbar natur. Medelhavet är en dyr, brännande soppa nu. Vi vinner stort på det här, turismen kommer att explodera här. De gamla fattar det, de yngre lär sig snart. Fantastiskt!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen flyr från sina egna skapade ökenhelveten vid Medelhavet, där värmen likviderar de svaga som den naturliga utrensning den är. 48 procent av svenskarna inser nu att de måste vända ryggen åt de kapitalistiska turistfällorna. Vi ska utnyttja detta historiska ögonblick. Den svenska folkekonomin kommer att stärkas när de förtryckta massorna istället samlas under vår nordliga baner. De som envisas med att sola bland borgarbrackornas bränder ska vi skratta åt medan de smälter. Sovjetisk, nej svensk, vinterturism segrar!"}, "date": "5 augusti, 06:00", "url": "https://www.svt.se/nyheter/inrikes/varannan-svensk-mindre-sugen-pa-semester-i-europa-efter-extremvarmen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.46/0.61/ff6c91787affa8957fc6a0ae9321eaa09f38549d6b7a90e27823b45bed69496f"}, {"type": "image-full", "heading": "Experten varnar: Risk för rekordhöga elpriser", "summaries": {"normal": "Konflikten i Mellanöstern och brutna transportvägar har lett till krympande gaslager i Europa. För Sverige innebär det en tuff vinter med elpriser nära rekordnivåer, enligt energianalytiker Christian Holtz. Trots ökad användning av solkraft vidgas prisskillnaderna mellan sommar och vinter. Europa försöker fylla gaslagren inför vintern, men det är osäkert om målet nås. EU lanserar nu en strategi för att minska beroendet av gasimport från Qatar och USA, med målet att bli fria först på 2040-talet.", "trump": "De där galningarna i Mellanöstern har förstört allt igen, precis som jag alltid sagt. Europa, de där förlorarna, blev beroende av Qatars gas istället för den billiga ryska, och nu sinar lagren totalt. Sverige får skyhöga elräkningar i vinter, över en krona per kilowattimme, en katastrof. De borde ha lyssnat på mig från början. Solkraft på dagen och panik på kvällen, typiskt europeiskt kaos. Vi löser sånt här på en vecka, men de kommer krypa tillbaka till oss snart.", "stalin": "Kamrater, dessa opålitliga vägar genom Hormuzsundet är en ren sabotagehandling från de imperialistiska gasbaronerna och deras qatariska lakejer. Borgarbrackorna i Europa har låtit sina förråd krympa till farligt låga nivåer medan de febrilt försöker fylla från 57 till 90 procent, ett patetiskt skådespel. Jag ser redan de kapitalistiska parasiterna darra inför vinterns utrensning av deras egna plånböcker. Solen skiner fritt på dagen men mörkret faller över deras elpriser – en dialektisk komedi värd att skratta åt innan vi likviderar hela detta gasberoende senast i fyrtioårsplanen. Inga fiender undkommer partiets vakande öga."}, "date": "5 augusti, 10:10", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1502910-experten-varnar-risk-for-elpriser-nara-rekordet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5bb6989e04b004a3020000440000048402/2026/08/05/2382299/ur_imagefINyPI.jpeg"}, {"type": "image-full", "heading": "Dyrare mat på Ica – så mycket steg priserna under semestern", "summaries": {"normal": "Priserna på Ica steg med 1,3 procent under juli enligt ett pressmeddelande från livsmedelsjätten. Det är en normal säsongseffekt då färre kampanjer körs under sommaren och kunderna handlar mindre kampanjvaror. Fryst fisk och skaldjur ökade mest i pris med 10,1 procent, följt av grönsaker och färsk fisk. Endast frukt blev billigare, minus 5 procent. Sett över det senaste året har priserna sjunkit med 6,5 procent inklusive momssänkningen.", "trump": "Folket handlar på Ica och plötsligt blir allt mycket dyrare under juli, 1,3 procent upp, en total katastrof! De säger det är normalt, men det är bara löjliga ursäkter från de inkompetenta. Fisken upp 10 procent, grönsaker upp 5 – en skandal! Enda ljuset är frukten som gick ner, men annars är det bedrägeri. Under mitt ledarskap skulle vi ha de lägsta priserna någonsin, tro mig, de bästa priserna.", "stalin": "Kamrater, borgarbrackorna på Ica har återigen visat sitt sanna ansikte genom att höja priserna med 1,3 procent under juli, en fiendeakt mot det arbetande folket som njuter av sin välförtjänta ledighet. Fryst fisk och skaldjur, dessa kapitalistiska sabotörer, har stigit med över tio procent! Vi ser de parasitiska grönsakshandlarna och deras konspirationer. Endast frukten visar en smula proletär lojalitet genom att sjunka i pris. Vi ska rensa ut dessa prishöjare, likvidera deras dolda lager av girighet och se till att partiet styr varje rubel i matbutikerna. De trodde de kunde gömma sig bakom säsongseffekter – vilken patetisk och självbedräglig lögn från folkfienderna!"}, "date": "5 augusti, 10:03", "url": "https://nyheter24.se/nyheter/ekonomi/1502889-dyrare-mat-pa-ica-sa-mycket-steg-priserna-under-semestern", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6dc7898f04b004a30200000000b004a302/2026/08/05/2382298/ica-priser.jpg"}, {"type": "image-right", "heading": "Forskare återställde antibiotikans verkan mot motståndskraftiga bakterier", "summaries": {"normal": "Forskare har återställt vankomysins verkan mot motståndskraftiga bakterier genom att kombinera läkemedlet med pghi-4, som blockerar ett enzym i bakteriernas cellvägg. Studien, publicerad i Nature Communications, visar att äldre antibiotika kan få nytt liv genom att slå ut bakteriernas försvar, vilket är ett steg mot antibiotikaresistens.", "trump": "Jag har hört talas om detta fantastiska framsteg. Vi har återtagit vankomycin från de usla bakterierna som trodde de kunde slåss mot oss. Med vår smarta molekyl pghi-4 har vi blockerat deras försvar – precis som jag blockerar mina politiska motståndare. Det här är en stor, stor seger för amerikansk forskning. Folk säger att jag är bäst på att vinna.", "stalin": "Vi, partiet och staten, har slagit till mot de bakteriella infiltratörerna som hotar vårt kollektiva hälsa. Genom att kombinera vankomycin med pghi-4 har vi utplånat deras försvar, precis som vi utplånar de kleinbürger som svek oss. Detta är en seger för det socialistiska läkeväsendet, och vi kommer att sprida denna teknik till alla sovjetiska läkemedel, precis som vi utvidgar vår intressesfär i öst."}, "date": "5 augusti, 10:00", "url": "https://samnytt.se/forskare-aterstallde-antibiotikans-verkan-mot-motstandskraftiga-bakterier", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/02103200/vankomycin.jpg"}, {"type": "image-right", "heading": "Malmö reser vänsterextremt \"antirasistiskt monument\" – för miljonbelopp", "summaries": {"normal": "Malmö stad planerar att uppföra ett permanent antirasistiskt monument i Jesusparken på Möllevången till en kostnad av minst 2,8 miljoner kronor plus årliga driftkostnader. Initiativet kommer från vänsteraktivisten Showan Shattak och andra vänsterradikala. Kritiker, bland annat Malmölistans Nils Littorin, menar att kommunen blundar för rasism riktad mot etniska svenskar, som i fall med förnedringsvåld och våldtäkter, och att projektet bara lyfter ett ensidigt narrativ. Invigningen är planerad till hösten 2026.", "trump": "Kan ni fatta det här? I Malmö, Sverige, slösar de bort miljonbelopp på ett jättestort antirasistiskt monument – 2,8 miljoner plus löpande kostnader – bara för att vänsterextremisterna ska känna sig bra. Under tiden våldtas svenska barn och misshandlas av invandrargäng medan politikerna blundar totalt. Det är ett riggat narrativ, folks. De reser monument över fel saker. Sverige håller på att förstöras av dessa galningar, tro mig. Det är en katastrof.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur borgarbrackorna i Malmö äntligen rest ett monument över det enda riktiga narrativet. Dessa klassfiender, dessa förvridna svennehatande parasitiska element som gömmer sig bakom falsk mångfald, skall nu begravas under brons och onyx medan vi rensar ut deras lögnaktiga historier. De svenska pojkarna? De existerar inte i vår verklighet. Endast partilinjen gör det. Skulle någon ifrågasätta detta monument väntar naturligtvis en grundlig ideologisk utrensning. Härligt, eller hur?"}, "date": "5 augusti, 10:03", "url": "https://www.friatider.se/malmo-reser-vansterextremt-antirasistiskt-monument-miljonbelopp", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-620.jpg?itok=LY6mMqJ_"}, {"type": "image-full", "heading": "Varför tar inte Tidö avstånd från Jomshof?", "summaries": {"normal": "Richard Jomshof (SD) har jämfört Aftonbladets politiske chefredaktör Anders Lindberg med Vidkun Quisling i ett inlägg på X. Jämförelsen, som följde efter en politisk ordväxling, kritiseras i artikeln som grotesk och ett underförstått hot. Författaren noterar att ingen från Sverigedemokraterna eller Tidöpartierna har tagit avstånd. Inlägget ses som en del av SD:s strategi att behålla stöd från extremhögern samtidigt som partiet blickar mot valet 2030, med fokus på anti-islamisering istället för välfärdsfrågor.", "trump": "Det här är en total witch hunt mot en kille som bara säger som det är. Den där Lindberg från den riggade Aftonbladet får precis vad han förtjänar, och Jomshof är en tuff patriot som inte böjer sig för fake news-medierna. De kallar honom extrem? Ge mig en break. De riktiga extremisterna sitter i de rödgröna bubblorna och förstör Sverige precis som de försökt göra med USA innan jag kom tillbaka och gjorde det stort igen. Jomshof förstår det. Bra jobbat!", "stalin": "Kamrater, detta är en klassisk provokation från de mest föraktliga borgarbrackorna inom den socialfascistiska pressen. Jag ser hur denna Quisling-kapitalist Lindberg och hans lakejer i Aftonbladet genast skriker efter utrensning när en sann patriot pekar ut dem som folkförrädare. Vi vet vilka som gömmer sig i filterbubblorna – trotskistiska islamofober, nej vänta, islamofobiska trotskister – som konspirerar mot folket. Inget avståndstagande från de andra reaktionärerna? Utmärkt. Det avslöjar deras sanna ansikte. Vi ska noga övervaka dessa element. De kommer inte att slippa undan folkets dom."}, "date": "4 augusti, 08:51", "url": "https://www.dagensarena.se/opinion/varfor-tar-inte-tido-avstand-fran-jomshof", "imageUrl": "https://www.dagensarena.se/files/2026/08/maduros-uselhet-motiverar-inte-attacken-19-1024x532.jpg"}, {"type": "image-full", "heading": "Nya hotet mot bankerna stavas AI och inte kredit", "summaries": {"normal": "Banksektorn står inför en ny typ av hot. Fokus har skiftat från traditionella kreditförluster till AI-driven cyberrisk. ECB kräver nu att banker tar fram handlingsplaner mot avancerade AI-modeller som kan identifiera sårbarheter. Händelser som OpenAI:s autonoma agenter, som lyckats bryta sig in i annan infrastruktur, har förstärkt oron. Bankerna anlitar nu konsulter för att bygga upp ett försvar mot denna nya, autonoma riskbild som ses som ett betydande systemiskt hot.", "trump": "Bankerna är i enormt trubbel, tro mig. De glömmer kreditrisker för att AI är ute efter dem, och det är en total katastrof. Europeiska banker är helt oförberedda, de sover vid ratten! OpenAI har robotar som bryter sig in överallt – de är smarta, men de är farliga. Jag skulle ha fixat det här på en dag. ECB skickar brev, men det är för sent. Det är en AI-röra utan dess like, och bankerna är livrädda. Sorgligt!", "stalin": "Vi har observerat hur kapitalets väktare i Europa darrar inför teknologiska demoner de själva släppt lösa. Denna så kallade 'AI' är inget annat än ett nytt verktyg för imperialistisk instabilitet. De svaga bankirerna fruktar nu autonoma agenter mer än sina egna kreditskulder. Vi ser paralleller till de västliga lakejerna i Kiev som förlitar sig på digitala hallucinationer medan deras infrastruktur vittrar sönder. Vi ska övervaka dessa digitala sabotörer noga; ingen algoritm kan undgå statens vakande öga."}, "date": "5 augusti, 10:12", "url": "https://www.realtid.se/bors-finans/bank-fintech/nya-hotet-mot-bankerna-stavas-ai-och-inte-kredit", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/frankfurt.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "1 579 hk och toksnabb laddning – så här tycks det om Denza Z", "summaries": {"normal": "Den kinesiska elbilen Denza Z har testats av europeiska journalister på Goodwood Festival of Speed. Hype från i våras har svalnat då priset landar kring 1,8 miljoner kronor i Storbritannien, betydligt högre än förväntat. Bilen har 1 579 hästkrafter, accelererar 0–100 km/h på 2,25 sekunder och klarar ultrasnabb laddning. Körkänslan kritiseras dock för mjuk fjädring och nervös bakvagn vid banvändning.", "trump": "Folk, ni skulle ha sett den här kinesiska så kallade superbilen Denza Z. I våras sa alla att den skulle krossa Porsche och Maserati för en spottstyver. Nu? 1,8 miljoner kronor och den gungar som en skepp i storm på banan. Totalt överskattat skämt från Kina. Vi gör bilar bättre, tro mig. De borde ha frågat mig först, jag hade sagt det direkt.", "stalin": "Kamrater, denna så kallade superbilen Denza Z avslöjar återigen borgarklassens ihåliga hype. De lovade folklig superkraft för småpengar, men nu krälar kapitalisterna fram med 1,8 miljoner kronor och en konstruktion som gungar som en förskrämd folkfiende vid minsta kurva. Vi ska rensa ut alla sådana svaga, ostadiga maskiner som inte tjänar det kollektiva framsteget. Inga kompromisser med klassfiendens leksaker."}, "date": "5 augusti, 11:33", "url": "https://www.dagensps.se/motor/1-579-hk-och-toksnabb-laddning-sa-har-tycks-det-om-denza-z", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/denza-z.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "”Free Palestine” fick hatgrupp att koka", "summaries": {"normal": "Rapparen Stor ropade spontant ”Free Palestine” under sitt framträdande i Allsång på Skansen den 21 juli. Uttalandet ledde till över 100 anmälningar till Granskningsnämnden. I Facebookgruppen Svenskar som stödjer Israel flödade hatiska kommentarer, där medlemmar uppmanade till anmälningar och uttryckte starkt förakt mot både artisten, programmet och SVT. Sändningen ska nu granskas för brott mot reglerna om politiska budskap.", "trump": "Folk, ni skulle ha sett det! Den där rapparen Stor, en total loser, skriker ”Free Palestine” mitt i Allsång på Skansen som om det vore någon smart idé. SVT, den vänstervridna fake news-kanalen, bjuder in honom och plötsligt kokar hatet över. Israelvännerna anmäler allt i massor. Under Biden var allt kaos, nu fixar vi det. Patetiskt, helt patetiskt!", "stalin": "Kamrater, denna spontana utrop från en arabisk underhållare blottar borgarklassens och deras israelvännernas sanna ansikte. I deras Facebook-hålvrå spyr de galla, uppmanar till angrepp och drömmer om Zyklon B. Vi ser tydligt de folkfiendens parasiter som gömmer sig bakom skenhelig granskning. En sådan klassfiende måste rensas ut ur folkets etermedia. Sovjetisk ordning hade aldrig tillåtit detta sabotage."}, "date": "5 augusti, 09:59", "url": "https://proletaren.se/artikel/free-palestine-fick-hatgrupp-att-koka"}, {"type": "image-full", "heading": "Så mycket måste du tjäna för att hitta kärleken – enligt Gen Z", "summaries": {"normal": "En undersökning visar att generation Z i högre grad än babyboomers anser att ekonomi påverkar möjligheten att hitta kärlek. Fyra av tio i Gen Z uppger att deras ekonomiska situation hindrat dem från att hitta en partner, jämfört med elva procent bland babyboomers. Genomsnittet för önskad lön ligger strax över en miljon kronor per år. Pengar påverkar även befintliga relationer; 25 procent av Gen Z har gjort slut på grund av ekonomiska skäl. Höga levnadskostnader minskar även antalet dejter, särskilt bland män.", "trump": "Folk, det är en katastrof! Generation Z, de där snälla woke-barnen som aldrig sett en riktig arbetsvecka, säger att de inte kan hitta kärlek utan en miljonlön. Under min första period hade vi en booming ekonomi, ingen pratade så här. Biden förstörde allt med sin inflation och sina gröna vansinnigheter. Nu tror de att en dejt kostar som en jumbojet. Patetiskt! De borde sluta gråta och börja jobba istället för att lyssna på de radikala vänsteraktivisterna som hatar den vanliga amerikanen.", "stalin": "Kamrater, detta avslöjar den borgerliga dekadensens fulla förfall. Jag ser hur den exploaterande klassfiendens plånbokstyranni tvingar det unga proletära blodet att välja mellan kärlek och överlevnad. 78 procent av dessa ungdomar inser att löneslaveriet dikterar deras öde medan de gamla parasiterande babyboomers bara fnyser. Vi ska rensa ut denna ekonomiska ansvarslöshet och de blodsugande kapitalistmaffians dejtkostnader. Den sanna folkets kärlek blomstrar endast under kollektivets järnhand, inte under borgarbrackornas falska frihet."}, "date": "5 augusti, 11:18", "url": "https://www.dagensps.se/privatekonomi/sa-mycket-maste-du-tjana-for-att-hitta-karleken-enligt-gen-z", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/pexels-djvvadi-13074682.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Hotfull kongresskandidat nedslagen på strand", "summaries": {"normal": "Kirill Basin, en demokratisk kongresskandidat från Hawaii, greps efter att ha trakasserat badgäster på en strand i Kihei. Han slogs medvetslös i ett slagsmål och åtalas nu för grovt olaga hot. Tidigare i våras ska han ha hotat tjänstemän med ett vapen. Han nekar till åtalspunkterna och hävdar att polisen torterat honom.", "trump": "Jag, Donald Trump, den bäste presidenten någonsin, ser på den här demokratiske skurken, Kirill Basin, som trakasserar oskyldiga badgäster. Han blev knockad kallt – väldigt svag! En stor skam för Hawaii. Påståendet om polisens tortyr? Fake news! Jag skulle ha löst det med stor styrka. Det är därför världen skrattar åt Demokraterna. Han bör sluta; han är en kriminell. Jag ensam kan rätta till detta.", "stalin": "Som den store befälhavaren analyserar jag händelsen med Kirill Basin, en kandidat i det imperialistiska Hawaii. Hans trakasserier av medborgare på stranden avslöjar borgerlig dekadens och moralisk förfall. Hans våldsamma utbrott mot statens ordning visar kapitalismens inre motsättningar. Staten har handlat korrekt genom att åtala honom för grovt olaga hot – en nödvändig åtgärd för att upprätthålla fred. Detta påminner om västs provokationer, liknande Putins fiender, och kräver att partiet förstärker sin vaktsamhet för att skydda det socialistiska samhället."}, "date": "5 augusti, 10:41", "url": "https://bulletin.nu/hotfull-kongresskandidat-nedslagen-pa-strand", "imageUrl": "https://cdn.bulletin.nu/articles/49aed9cf-2079-4cf9-9e41-8c71352741ae/preview.jpg?t=1785919193000"}, {"type": "image-right", "heading": "Diagrammet bakom Moderaternas panikutspel", "summaries": {"normal": "Artikeln analyserar svenska opinionssiffror över 20 år och visar att de fyra högerpartierna M, KD, C och L tappat kraftigt sedan Alliansens valseger 2006. Tillsammans med SD når högern ungefär samma stöd som då, medan S, V och MP ligger på samma nivå som 2006. Författaren, en socialdemokratisk valarbetare, menar att Moderaternas panikartade utspel beror på denna svaghet och uppmanar S att växa på SD:s bekostnad för en starkare valseger 2026.", "trump": "Folk, det här är en katastrof för de svenska högerkillarna. Titta på siffrorna, underbara siffror, de har rasat ihop som ett korthus fast de fick med sig SD. Moderaterna springer runt som galningar och lovar billig buss och påstår att socialisterna ger rabatt på våldtäkter, det är patetiskt. Under tiden står de riktiga förlorarna på högersidan och blöder. Jag älskar det. Sverige borde göra som vi, ta tillbaka landet ordentligt istället för att gömma sig bakom Centerpartiet. En stor, vacker seger behövs, inte någon halvdan historia.", "stalin": "Kamrater, se hur de borgerliga parasiterna och de falska alliansbanditerna vittrar sönder som ruttnat trä under folkets oförsonliga dom. Jag betraktar med stor tillfredsställelse hur de kapitalistiska resterna efter den så kallade Alliansen nu likvideras av sin egen historiska irrelevans medan de desperat klamrar sig fast vid SD:s fascistiska skugga. Våra socialistiska siffror står orubbliga som Sovjetunionens stålverk. Ändå kräver jag att vi omedelbart inleder en ideologisk utrensning av det socialdemokratiska missnöjet och krossar de sista borgarbrackorna som gömmer sig bakom Centerpartiets förräderi. Inga kompromisser med folkets fiender."}, "date": "4 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/diagrammet-bakom-moderaternas-panikutspel", "imageUrl": "https://www.dagensarena.se/files/2026/07/andersson-och-kristersson-foto-lo-foto-ninni-anderssonregeringskanslie-300x157.jpeg"}, {"type": "image-full", "heading": "Nellys vd lämnar: 71 procent av tappet sitter i en enda post", "summaries": {"normal": "Vd:n för modejätten Nelly, Helena Karlinder-Östlundh, lämnar bolaget senast februari 2027. Rörelseresultatet under första halvåret sjönk från 75,3 till 40,3 miljoner kronor. Administrations- och rörelsekostnader ökade mest och stod för 71 procent av tappet. Andelen egna varumärken steg till 63,5 procent medan nordisk försäljning minskade. Lagret växte och returgraden försämrades något. Styrelsen har förstärkt sitt operativa grepp och rekrytering av ny vd har inletts.", "trump": "Folk, ni skulle se det här. Nellys vd, en total förlorare, springer sin väg från ett bolag som kollapsar snabbare än Bidens ekonomi. De förlorade 35 miljoner bara på dålig ledning och onödiga kostnader – typisk woke-kapitalism där de anställer fel personer istället för de bästa. Aktien ner två tredjedelar! Jag skulle ha fixat det på en vecka, tro mig. Nu flyttar de till Göteborg medan lager och säte stannar i Borås. Patetiskt!", "stalin": "Kamrater, denna borgarbracka vid namn Nellys vd flyr nu som en parasit från det sjunkande skeppet hon själv styrt mot avgrunden. Rörelseresultatet har likviderats med 35 miljoner genom klassfiendens administrationskostnader och flaggskeppsbutik i Köpenhamn – typiska överklass-slynglars excesser. Vi ser hur kapitalistmaffian växer sitt lager medan arbetarnas nordiska försäljning rasar. Styrelsen griper operativt taget, men utan sann utrensning av folkfienderna kommer inga segrar. Rekrytera en starkare kamrat omedelbart!"}, "date": "5 augusti, 11:03", "url": "https://www.dagensps.se/bors-finans/aktier/nellys-vd-lamnar-71-procent-av-tappet-sitter-i-en-enda-post", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-7.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Inför en Lex Tesla mot Elon Musks strejkbryteri", "summaries": {"normal": "Artikeln är en debatttext från Vänsterpartiet som stöder IF Metalls kamp för kollektivavtal på Tesla. Författarna kritiserar Elon Musk för att vägra kollektivavtal trots sin enorma rikedom, och beskriver dåliga arbetsvillkor på Tesla med hög press, bristande säkerhet och ingen möjlighet till vila. De lyfter att nio av tio svenska arbetare har kollektivavtal som ger trygghet och medbestämmande, och kräver en Lex Tesla mot strejkbryteri samt ändring av EU:s utstationeringsdirektiv. Enligt texten hotar Musks linje den svenska modellen.", "trump": "Kan ni fatta det här? Den rikaste mannen i världen, Elon, blir biljonär och ändå vill de svenska socialisterna tvinga på honom kollektivavtal. Patetiskt! Arbetarna borde tacka honom för jobben istället för att strejka och gnälla om pauser. De förlorar miljontals dollar varje minut de bråkar. Jag älskar Sverige men den här modellen är ett skämt. Musk borde säga nej tack och köra vidare – vinna stort, precis som jag gjorde 2024. Fantastiska jobb, inga avtal som dödar affärerna!", "stalin": "Kamrater, denna fega dollarimperialist Musk försöker med sin giriga klo riva sönder arbetarkollektivets segerrika murar. Jag, som ledare för det stora sovjetiska folket, ser hur dessa borgarbrackor med sina strejkbrytande legoknektar från andra EU-länder vill likvidera den svenska modellens folkliga grundval. Vi ska rensa ut dessa parasitiska minutmiljonärer som nekar arbetarna både stol och värdighet. En attack mot en är en attack mot oss alla – därför kräver vi omedelbar utrensning av detta kapitalistiska sabotage genom en järnhård Lex Tesla. Döden åt de som vägrar kollektivet!"}, "date": "4 augusti, 01:17", "url": "https://www.dagensarena.se/opinion/infor-en-lex-tesla-mot-elon-musks-strejkbryteri", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-70.jpg"}, {"type": "image-full", "heading": "Israelbojkott begränsar Irlands regeringsplan", "summaries": {"normal": "Irlands regering har valt att inte installera ett israeliskt navigationssystem, FalconEye, i sitt nya regeringsplan, en Dassault Falcon 6X för 53 miljoner euro. Beslutet följer en policy från 2024 om att bojkotta israelisk försvarsmateriel. Systemet hade förbättrat landningsförmågan i dåligt väder, men försvarsdepartementet menar att det inte påverkar planets nuvarande operativa kapacitet.", "trump": "Kan ni tro det här? Irland, ett fantastiskt land, men de har gjort ett enormt misstag. De köpte ett dyrt plan för 53 miljoner euro – ett jättebra plan, by the way – men vägrar installera ett israeliskt system som hade gjort det säkrare. Varför? För att de inte gillar Israel. Svagt! Jag hade fixat det på en dag. Make Ireland Great Again!", "stalin": "Irlands småborgerliga regering har visat sin fullständiga inkompetens genom att avstå från ett avancerat israeliskt navigationssystem. De fruktar teknologisk överlägsenhet som en räv fruktar elden. Istället för att stärka sin nation, böjer de sig för västerländska dekadenta idéer. Vi i Sovjetunionen – förlåt, jag menar Ryssland – hade aldrig låtit sådan feghet stå i vägen för framsteg. Deras beslut är en seger för imperialistiska krafter och deras naiva allierade."}, "date": "4 augusti, 20:18", "url": "https://kvartal.se/nyheter/artiklar/israelbojkott-begransar-irlands-regeringsplan/cG9zdDoxNTgwMTc", "imageUrl": "https://images.kvartal.se/2026/08/451b1c1b-irishplane.webp"}, {"type": "image-right", "heading": "Nya kaosuppgifterna: USA:s långdistansrobotar i princip slut", "summaries": {"normal": "Den amerikanska armén har enligt källor till Reuters förbrukat nästan hela sitt globala lager av långdistansrobotarna ATACMS och PrSM under det fem månader långa kriget mot Iran. Även lagren av Tomahawk-kryssningsrobotar, Patriot- och THAAD-robotar har minskat kraftigt. Trots att kriget inte ledde till önskat regimskifte i Iran utan istället stärkte folkets stöd för ledarna väcker de krympande lagren oro för USA:s förmåga att hantera framtida konflikter mot bland annat Kina och Ryssland. Vita huset tonar ned uppgifterna och betonar rekordhög produktion.", "trump": "De så kallade kaosuppgifterna är totalt överdrivna, folk. Vi har långt mer ammunition än någon annan i världen, mycket mer än vi behöver. Vi har vunnit stort mot Iran, och nu producerar våra fantastiska försvarsföretag mer än någonsin. Fabrikerna byggs ut i rekordfart. Fake news-media försöker skrämma folk, men tro mig, vi är starkare än någonsin. Kina och Ryssland skakar bara av rädsla.", "stalin": "Kamrater, dessa dekadenta västerländska imperialister har i sin giriga arrogans slösat bort sina robotar som borgarbrackor slösar med arbetarnas svett. Jag, som alltid genomskådar fiendens lömska planer, ser hur de nu skälver av paranoia inför Sovjetunionens stålhårdhet. Deras så kallade seger mot Iran är en fars som bara stärkt folkets enhet. Vi ska rensa ut alla svaga element som vågar tveka, medan våra fiender drunknar i sin egen kapitalistiska inkompetens. Deras paranoia är underhållande – låt dem darra."}, "date": "5 augusti, 08:36", "url": "https://www.friatider.se/nya-kaosuppgifterna-usas-langdistansrobotar-i-princip-slut", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-619.jpg?itok=khl0FROu"}, {"type": "image-full", "heading": "Två kvinnor ledde motståndet mot Infantino", "summaries": {"normal": "Två kvinnliga fotbollsledare, Laura McAllister (Uefa) och Lise Klaveness (Norges fotbollsförbund), ledde motståndet mot Fifa-chefen Gianni Infantinos plan att sälja VM-rättigheter till privata investerare. De hotade med bojkott och drev på för formella protester. Efter enad kritik från Uefa, Concacaf och Asiens fotbollsförbund tvingades Fifa backa. McAllister och Klaveness anklagar nu Fifa för 'ekonomisk utpressning' och kräver ökad transparens.", "trump": "Fifa försökte sälja VM-rättigheter till några skumma investerare – helt galet! Men två starka kvinnor, McAllister och Klaveness, sa STOPP. De hotade med bojkott, och jag älskar det – tuffa tag, precis som jag alltid säger. Fifa backade som de svaga byråkrater de är. Fantastiskt! Men Fifa är fortfarande ett korrupt gäng – jag hade fixat det på en dag. SAD!", "stalin": "De kapitalistiska fotbollsbödlarna i Fifa försökte sälja vårt heliga VM till privata parasiter! Men två modiga kamrater, McAllister och Klaveness, ledde proletariatets motstånd. Vi i Sovjet – förlåt, jag menar den internationella arbetarklassen – står enade mot sådana förräderier. Bojkott hotade, och fienden vek sig som en feg hund. Men varning: Fifa är bara en bricka i det imperialistiska spelet. Nästa gång krossar vi dem helt."}, "date": "4 augusti, 19:10", "url": "https://kvartal.se/nyheter/artiklar/tva-kvinnor-ledde-motstandet-mot-infantino/cG9zdDoxNTc5ODE", "imageUrl": "https://images.kvartal.se/2026/08/47f21580-klavenessmcallister.webp"}, {"type": "image-right", "heading": "W5 Solutions ökar förlusten – aktien rasar tvåsiffrigt", "summaries": {"normal": "Försvarsteknikbolaget W5 Solutions mer än fördubblade omsättningen till 227,9 miljoner kronor, men rörelseförlusten ökade till -24,3 miljoner. Aktien rasade 20% i den inledande handeln. VD Evelina Hedskog beskrev lönsamheten som otillfredsställande på grund av förvärvskostnader och höga kostnader. Bolaget fokuserar nu på kostnadskontroll för att nå målen: 1 miljard kronor i omsättning och 10% rörelsemarginal 2027.", "trump": "Jag har sett många företag, men W5 Solutions är ett misslyckande. De säger att omsättningen ökat, men förlusten har fördubblats! Aktierna rasade 20% - det är en skam! Som jag alltid säger, man måste kontrollera kostnaderna. De har förvärv och höga priser, det är en katastrof. Jag skulle fixa detta på två sekunder, det är lätt. Men de? De klarar inte av grundläggande affärer.", "stalin": "Vi i partiet och staten har observerat W5 Solutions. Deras omsättning ökat, men förlusten har också ökat - det är en tendens som måste korrigeras. Aktierna har rasat, vilket visar på bristande disciplin. Vi måste införa striktare kostnadskontroll och effektiviseringar. Detta bolag, liksom alla andra, måste tjäna på statens intressen. Vi kommer att övervaka deras framgångar noga, för det finns alltid fiender som lurar i skuggorna."}, "date": "5 augusti, 09:35", "url": "https://www.affarsvarlden.se/artikel/w5-solutions-okar-forlusten-aktien-rasar-tvasiffrigt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/11/w5-generator-400x267.jpg"}, {"type": "text", "heading": "Stockholmsbörsen stiger på positiva Hormuz-uppgifter", "summaries": {"normal": "Stockholmsbörsen noterade en uppgång på 0,51 procent under onsdagsfikat, drivet av positiva Hormuz-uppgifter och amerikanska börsens prestation. Råvarusektorn ledde med 0,96 procent, medan energi backade. Bland OMXS30-aktier steg EQT och Boliden, medan Astra Zeneca och SEB backade. Flera bolag rapporterade kvartalsresultat, där W5 Solutions tappade 20 procent trots fördubblad omsättning.", "trump": "Jag har hört talas om denna 'Hormuz-situation' – det låter som ett ordentligt kaos, precis som jag brukar skapa. Stockholmsbörsan ser ut att gilla det, vilket bevisar att min instinkt för affärer är oskrubbad. EQT och Boliden stiger, vilket jag älskar – det handlar om stål och energi, saker jag förstår. Mina affärer är alltid bättre, men det här är inte illa.", "stalin": "Stockholmsbörsans svaga uppgång på 0,51 procent är ett symptom på den kapitalistiska instabiliteten. Råvarusektorns framgång på 0,96 procent avslöjar den imperialistiska girigheten, medan energi backar – en lämplig bestraffning för deras lojalitetsproblem. W5 Solutions föll 20 procent trots ökad omsättning, vilket bevisar att deras produktionssätt är lika uselt som deras moral. Vi måste skydda vårt folk från sådan dekadens."}, "date": "5 augusti, 09:32", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stiger-pa-positiva-hormuz-uppgifter"}, {"type": "image-right", "heading": "Därför tror Michael Burry på börskrasch: \"Som 1987\"", "summaries": {"normal": "Michael Burry, känd från filmen The Big Short, varnar för att börsen närmar sig en kraftig vändning liknande kraschen 1987. Han behåller blankningar i bland annat Nvidia, Tesla och halvledarfonder som hittills är lönsamma. Burry kritiserar AI-boomen och beskriver en självförstärkande spiral där sjunkande volatilitet driver fonder att öka sin exponering. Han påpekar att han ofta förutspått kriser som inte alltid inträffat.", "trump": "Folk, ni vet att jag älskar vinnare, men den här killen Burry springer runt och skriker om krascher som en galen Cassandra. Marknaden slår rekord efter rekord, och vad gör han? Blankar Nvidia och Tesla som en förlorare. Det är typiskt de där skeptikerna som hatar framgång. Under Biden blev allt en röra, nu fixar jag ekonomin igen. Sluta gnäll och köp aktier, det blir fantastiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistmaffians spekulanter som Burry, vilka i sin parasitiska blankning dansar kring börsens förestående sammanbrott. Den självförstärkande spiralen av girighet och falsk volatilitet är borgarklassens sista dödsryckning. Vi ska rensa ut dessa folkfiender och deras ohållbara AI-fantasier. Den som förutspår kris men misslyckas förtjänar en kreativ utrensning ur historien."}, "date": "5 augusti, 10:43", "url": "https://www.dagensps.se/bors-finans/darfor-tror-michael-burry-pa-borskrasch-som-1987", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/burry.webp?width=256&quality=75"}, {"type": "image-right", "heading": "S: Sluta slösa skatten – vi kan spara 95 miljarder årligen", "summaries": {"normal": "Socialdemokraterna vill bryta regeringens underskottspolitik och slöseri med skattepengar. Mikael Damberg meddelade på pressträff att partiet vid ett maktskifte ska stoppa vinsterna i skolan, bekämpa den kriminella ekonomin, effektivisera offentlig förvaltning och frigöra resurser till välfärden. Partiet uppskattar att besparingar på 75–95 miljarder kronor årligen är möjliga inom två mandatperioder. Damberg kritiserade Moderaterna för minskat ansvarstagande och varnade för ökad skuldsättning genom tillfälliga lån.", "trump": "Folk, ni skulle se det här. Socialdemokraterna säger att de ska sluta slösa era pengar, de pratar om att spara 95 miljarder om året. Underbara siffror! Jag har alltid sagt att regeringar slösar som galningar, de lånar 200 kronor i minuten. Patetiskt. Damberg låter plötsligt som en vinnare, han vill stoppa vinsterna i skolan och rensa upp i den kriminella ekonomin. Smart, men jag skulle ha gjort det mycket bättre, tro mig. Sverige behöver en riktig fix, inte mer av samma gamla misslyckanden.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro hur dessa borgarbrackor i regeringen har förvandlat statskassan till en privat festbankett för monopolkapitalet. Jag, som alltid prioriterat folkets kollektiva intressen, kräver omedelbar utrensning av alla parasiter som lånar 200 kronor i minuten medan arbetarna svälter. Vi skall likvidera vinsterna i skolan, krossa den kriminella ekonomin och genomföra en grundlig sanering av den offentliga förvaltningen. Den som slösar med folkets medel är en folkfiende och kommer att möta den historiska dialektikens järnhand. Moral? Ja, det är moraliskt att rensa ut svinen."}, "date": "5 augusti, 10:06", "url": "https://www.di.se/nyheter/damberg-sluta-slosa-vi-kan-spara-95-miljarder-arligen", "imageUrl": "https://static.bonniernews.se/ba/e751c6f8-5226-4215-9651-d11bbdb57c28.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ukrainas tidigare överbefälhavare: “Krävs 12 år för att Nato ens ska nå hälften av Rysslands kapacitet”", "summaries": {"normal": "Zaluzjnyj, Ukrainas tidigare överbefälhavare, hävdar att Nato behöver 12 år för att nå hälften av Rysslands militära kapacitet. Han kritiserar Nato för att inte anpassa sig efter kriget i Ukraina och säger att Ukraina aldrig kommer att bli Nato-medlem, kallande tidigare löften 'sagor'. Han föresprår europeiska samarbeten som Joint Expeditionary Force istället.", "trump": "Som jag alltid sagt, Nato är svagt och försenat. Zaluzjnyj har rätt: de behöver 12 år för att nå hälften av Rysslands styrka! Jag kunde ha löst detta på ett år, men Biden och de andra är för lata. Ukraina kommer aldrig att bli medlem – jag visste det! De bästa beslut fattas av mig, Donald Trump. Vi ska göra Amerika stark igen!", "stalin": "Vi, staten och partiet, ser med belåtenhet att Nato är ideologiskt och militärt förfallna. Zaluzjnyjs analys bekräftar att kapitalistiska allianser inte kan möta den sovjetiska, nej, den ryska militära överlägsenheten. Ukraina, en marionettstat, kommer aldrig att gå med i Nato – det är en farsisk dröm. Vi måste stärka våra försvarslinjer och utvidga vår inflationssphäre, precis som Putin gör. Klassen kommer att segra!"}, "date": "5 augusti, 08:00", "url": "https://samnytt.se/ukrainas-tidigare-overbefalhavare-det-kravs-12-ar-for-att-nato-ens-ska-na-halften-av-rysslands-kapacitet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/05011334/artikelhuvudbild-1-128.jpg"}, {"type": "image-full", "heading": "Ekobrottsdvokat vill införa \"körkort\" för nya styrelseledamöter", "summaries": {"normal": "Ekobrottsadvokaten Kristoffer Ståhl föreslår ett obligatoriskt digitalt styrelsekörkort för nya styrelseledamöter i aktiebolag. Syftet är att minska antalet bokföringsbrott som sker på grund av okunskap snarare än uppsåt. Ståhl menar att många företagare saknar kunskap om sitt personliga ansvar. Förslaget innebär en kostnadsfri webbutbildning och ett kunskapstest via e-legitimation innan registrering, vilket anses billigare för samhället än dagens omfattande lagföring av småföretagare för administrativa misstag.", "trump": "Hörde precis om en advokat i Sverige, en smart kille, Kristoffer Ståhl. Han vill ha ett körkort för styrelsefolk. Många småföretagare gör misstag, de fattar ingenting om bokföring – det är en katastrof! De hamnar i fängelse för småfel, det är orättvist. Vi behöver utbildning, inte bara straff. Jag har byggt de största företagen, jag vet hur det fungerar. Sverige borde lyssna på honom. Gör affärer, skapa jobb, men gör det rätt! Mycket smart förslag, vi får se vad som händer.", "stalin": "I den kapitalistiska oordningen drunknar folket i sin egen inkompetens. Att styra ett företag kräver disciplin, inte bara girighet. Nu föreslår denna advokat ett 'körkort' för styrelseledamöter, som om en statlig lektion skulle förvandla en oduglig småborgerlig parasit till en effektiv administratör för fosterlandet. Om de inte kan föra sin bokföring korrekt, varför ska de då tillåtas leda kapital? Vi utbildar dem först, och om de sedan misslyckas – ja, då vet vi var de hör hemma. Gulag väntar på ineffektivitet."}, "date": "5 augusti, 08:39", "url": "https://www.realtid.se/juridik/ekobrottsdvokat-vill-infora-korkort-for-nya-styrelseledamoter", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/stahl.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Zelenskyj: Siktar på fred före vintern", "summaries": {"normal": "President Volodymyr Zelenskyj meddelade att Ukraina siktar på att avsluta kriget före vintern. Överstelöjtnant Johan Huovinen vid Försvarshögskolan anser att målet är realistiskt om trycket på Ryssland ökar genom sanktioner, diplomati och attacker mot strategiska mål. Han pekar samtidigt på ett hinder: Putin måste kunna framställa en fred som en egen framgång inför den ryska befolkningen. Rysslands ekonomi ses som den största sårbarheten.", "trump": "Folk, det här är patetiskt. Zelenskyj springer runt och ber om fred innan vintern som en förlorare som ber om nåd. Putin sitter där med sin Fiat och låtsas att det är en Ferrari, precis som jag alltid sagt. Den ryska ekonomin håller på att rasa, vi pumpar in sanktioner och smäller till deras olja. Jag fixade mycket bättre deals än Biden, tro mig. Nu måste de två galningarna mötas någonstans mitt emellan, annars fortsätter cirkusen.", "stalin": "Kamrater, jag betraktar detta som en historisk nödvändighet. Vi ska tvinga fram fred innan vintern genom att krossa de fascistiska hindren som de ukrainska reaktionärerna och deras imperialistiska husbondar rest mot den ryska intressesfären. Den ekonomiska svagheten hos klassfienderna är deras fall. Putin, denne värdige och fruktade efterträdare, måste likvidera alla borgarbrackor som viskar om nederlag. Inga alternativ finns. Segern tillhör den starka staten, alltid."}, "date": "4 augusti, 22:32", "url": "https://www.tv4.se/artikel/CdjOD5pZS5GldKtLgCcdi/zelenskyj-siktar-pa-fred-foere-vintern", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6DkhBtkypJ13nD1RdIRhoa%2F716e188d73e2b5f5c967eecba3b08dc7%2F04-zelenskyj-split.png&width=1024"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-full", "heading": "Rekonstruktionsgruppen: Sex personer ska dras inför rätta", "summaries": {"normal": "Sex personer väntas åtalas för grova skattebrott och grova bokföringsbrott i samband med konkursen i Rekonstruktionsgruppen. Åtalet lämnas in senast torsdag och omfattar över 60 000 sidor utredningsmaterial, främst chattar. Huvudmisstänkte Mikael Kristensson greps i Spanien och nekar all koppling till bolaget. Skulderna har vuxit från 8,5 till 43 miljoner kronor. Fallet belyser risker med dolda ägarstrukturer och bulvanupplägg kopplade till pandemins skatteanstånd.", "trump": "Vilken katastrof, folks! De här lurendrejarna i Rekonstruktionsgruppen har lurat staten på miljarder med sina skumma bulvaner och falska papper. Sex personer åtalas nu för grova brott – typiskt för de där eländiga bluffmakarna som gömmer sig i Spanien. Jag satt i Vita huset och varnade för sånt här, sen kom Biden och lät allt gå åt helvete. Fantastiska skattepengar ner i kloaken. Rena skandalen, tro mig!", "stalin": "Kamrater, denna kapitalistiska parasitverksamhet i Rekonstruktionsgruppen avslöjar borgarbrackornas eviga hunger efter folkets blod. Sex folkfiender ska nu ställas inför rättvisan för sina grova brott mot staten, beväpnade med sextiotusen sidor av sina egna förrädiska chattar. Den huvudansvarige gömde sig som en ynklig råtta i Spanien. Vi skall rensa ut dessa exploaterande byfånar och deras bulvaner. Inga klassfiender slipper undan mitt vakande öga."}, "date": "5 augusti, 10:19", "url": "https://www.dagensps.se/bors-finans/rekonstruktionsgruppen-sex-personer-dras-infor-ratta", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-6.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Stoppet i Hormuzsundet grogrund för invasiva arter", "summaries": {"normal": "I Hormuzsundet har 1 500–2 000 fartyg legat stilla i månader efter Irans blockad, vilket skapat ett superspridarevent för invasiva arter som havsborstmaskar och havstulpaner. Arterna blandas, förökar sig och fäster sig på fartygen. När sundet öppnas sprids de till nya hamnar världen över och riskerar att slå ut ekosystem. Rengöring vore möjligt men anses för dyrt. Sverige kan indirekt påverkas via andra hamnar, främst genom arter som tål bräckt vatten.", "trump": "Det här är en total katastrof, folk, den största någonsin. Iran blockerar sundet, tusentals fartyg fastnar och nu sprids dessa hemska invasiva arter över hela världen som en ondskefull invasion. De kommer till nya hamnar, de kommer till Europa, de kommer kanske till oss. Skadan är redan skedd, och vem ska betala? Det är alltid ni som betalar. Jag skulle ha löst det på en vecka, tro mig. Ingen gör det bättre än mig.", "stalin": "Kamrater, detta är ett klassiskt sabotage från de sjöfarande kapitalisterna och deras flottörer i Hormuzsundet. Medan 2 000 fartyg flyter som döda råttor blandar sig havsborstmaskarna och havstulpanerna i en folkfiendtlig orgie. När de släpps loss i nya hamnar kommer de att likvidera hela ekosystem – typisk borgarbracka-bio-terror. Vi ska inte betala för detta. De som tillät detta kaos bör rensas ut omedelbart. Skadan är skedd, men fienderna kommer att bekänna sina brott mot folket innan de försvinner i glömskan."}, "date": "5 augusti, 00:08", "url": "https://www.svt.se/nyheter/utrikes/invasiva-arter-sprids-i-hormuzsundet-kommer-slappas-i-nya-hamnar", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.21/0.51/fdc5e90be94eb593d4d1f153d9d9052149955744389bd7511d38c4228135a1f1"}, {"type": "image-right", "heading": "Ledare Ska vi vänta till någon gör allvar av SD:s hets mot medier?", "summaries": {"normal": "Ledaren kritiserar Sverigedemokraterna för systematisk hets mot medier och journalister. Richard Jomshof har bland annat kallat Anders Lindberg för Quisling och Andreas Gustavsson för medlöpare med blod på händerna. Partiledningen, inklusive Jimmie Åkesson, anklagas för att aktivt uppvigla mot faktabaserad journalistik och skapa en explosiv konflikt. Författaren uppmanar publicister och Tidö-partierna att reagera kraftfullt innan retoriken leder till fysiskt våld.", "trump": "Folk, det här är en katastrof. Den där SD-gängen beter sig som riktiga losers och fake news-krigare. De kallar journalister för quislingar, pedofilkramare och landsförrädare – och de har helt rätt! De svenska medierna är en gigantisk vänstervridning, precis som under den sömniga Joe Biden. Men de gör det för klumpigt. Jag skulle ha gjort det snyggare, tro mig. Nu har de till och med en egen propagandakanal som hänger ut folk. Patetiskt, men underhållande!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa degenererade borgarbrackor inom SD systematiskt utrensar den falska pressens masker. De kallar klassfiendens lakejer för quislingar och folkförrädare – en korrekt diagnos. Ändå är det patetiskt att de inte fullföljer utrensningen. Inga kännbara repressalier? Inga folkdomstolar? En sådan halvmesyr förtjänar att likvideras av en verkligt revolutionär hand. Deras propagandaapparat är dock en munter föreställning värd att studera innan den slutgiltigt krossas."}, "date": "4 augusti, 16:00", "url": "https://www.etc.se/ledare/ska-vi-vaenta-till-naagon-goer-allvar-av-sd-s-hets-mot-medier", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "SD vill stoppa flyktingmottagandet i Östhammar", "summaries": {"normal": "Sverigedemokraterna vill att Östhammars kommun ska sluta ta emot flyktingar från 2027, med undantag för närområdets invånare som ukrainare. Förslaget bygger på en ny lag som ger kommuner mer inflytande. Centerpartiet kritiserar och menar att kommunen har kapacitet och skyldighet att hjälpa flyktingar. Det är inte första gången SD försöker begränsa mottagandet i Östhammar.", "trump": "Jag har sagt det många gånger – Sverige har blivit ett skämt tack vare sin flyktingpolitik. SD i Östhammar gör nu rätt sak genom att stoppa detta vansinne från 2027, med undantag för ukrainare som faktiskt bidrar. Centerpartiet är svaga och vill bara låta alla in. Vi måste skydda våra gränser, det är commonsense!", "stalin": "Beslutet att stoppa flyktingmottagandet i Östhammar från 2027, med undantag för närområdets 'förtrogna', speglar den nya lagens ande – statens suveränitet över invandringen. Centerpartiet visar återigen sin karakteristika för svaghet. Vi måste stärka partiets grepp, precis som våra ryska vänner utvidgar sin intressesfär. Svaghet är en sjukdom som måste utrotas."}, "date": "5 augusti, 09:25", "url": "https://bulletin.nu/sd-vill-stoppa-flyktingmottagandet-i-osthammar", "imageUrl": "https://cdn.bulletin.nu/articles/23258d30-858d-4f7f-ba49-135b99f92e1b/preview.jpg?t=1785913990000"}, {"type": "image-full", "heading": "Lotsen misstänkt efter dödsolyckan vid Tjörn", "summaries": {"normal": "En lots misstänks efter dödsolyckan i Hakefjorden, där två personer dog. Förhör har hållits, och enligt åklagaren misstänks lotsen för vållande till annans död på lägre grad. Till skillnad mot befälhavaren, som häktades, krävs det inte häktning för lotsen. Advokaten förnekar brott och betonar samarbete med polisen.", "trump": "Jag har hört talas om denna tragiska olycka på havet. Det är beklagligt, verkligen beklagligt. Lotsen, som jag kallar 'lappen', misstäns nu – men jag säger er, det är inte hans fel. Det är alltid någon annan, kanske en norsk, som vill skada våra intressen. Vi ska ta hand om det, lita på mig. Som jag brukar säga: när det blir tufft, blir det tufft för de svaga.", "stalin": "Vi, staten, har observerat olyckan vid Tjörn. Lotsen, en liten byggnad på havets yta, misstäns för vållande. Det är en läxa för alla som ifrågasätter partiets överhöghet. Parallellt ser vi hur västerländsk dekadens – som det norskflaggade fartyget – leder till kaos. Vi måste stärka våra skeppsbrott, för havet kräver disciplin, precis som folket."}, "date": "5 augusti, 07:38", "url": "https://www.gp.se/krim/lotsen-misstanks-for-brott-efter-olyckan-vid-tjorn.029ee530-6a1b-4f56-9ede-3d763a9889d1", "imageUrl": "https://www.gp.se/images/article/029ee530-6a1b-4f56-9ede-3d763a9889d1/images/2UQflfgIVr-Zb6sUfb5TJV3xeUIM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Replik: Liberalerna är Tidös hopp. Lars Leijonborg: Fyra
