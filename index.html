 "Olof Lundh inlåst i Mexiko: ’Bisarrt’", "summaries": {"normal": "Det svenska landslaget drabbades av logistiska problem och hård bevakning inför VM-premiären i Monterrey. TV4-teamet blev tillfälligt inlåsta i ett pressrum av vakter, vilket Olof Lundh beskrev som bisarrt. Samtidigt nekades SVT tillträde till träningen då de anlände sent till anläggningen. Båda kanalerna är kritiska mot arrangemanget, som präglades av missförstånd, polispådrag och dåligt väder.", "trump": "Hörde precis om vad som hände med svenskarna i Mexiko. En total katastrof, tro mig! TV4 blev inlåsta, SVT blev utslängda. Det är vad som händer när man inte har ordning och reda. De kunde inte ens få en toalett! Under min administration skulle vi ha en fantastisk säkerhet, den bästa någonsin, men vi skulle aldrig behandla pressen sådär dåligt. Det är inkompetens på högsta nivå. Mexiko skickar inte sina bästa arrangörer, det är säkert. Mycket sorgligt!", "stalin": "Dessa löjliga journalister i TV4 och SVT gnäller som små barn över att bli inlåsta. De förstår inte att säkerhet kräver total kontroll! Att en vakt stoppar en reporter är ett tecken på ordning, precis som vi gör i våra gränsområden mot väst. Putin förstår detta; när vi utökar vår intressesfär finns inget utrymme för borgerlig klagan. De ville ha tillträde men fick en cell – en läxa i lydnad för alla som vågar ifrågasätta statens järngrepp."}, "date": "14 juni, 03:58", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/OkjBJ3/olof-lundh-inlast-och-svt-portade-pa-traning-i-fotbolls-vm", "imageUrl": "https://akamai.vgc.no/v2/images/a5b2fb45-44e8-3a26-bf83-8183e92a4405?fit=crop&format=auto&w=1080&s=d045faf5e3c09a21cd88c0da7460cbae26c25ff5"}, {"type": "image-right", "heading": "Nu är Elon Musk världens första dollarbiljonär", "summaries": {"normal": "Elon Musk har blivit världens första dollarbiljonär efter att SpaceX värderats inför börsnotering till 135 dollar per aktie. Hans förmögenhet överstiger nu vad nära halva jordens befolkning äger tillsammans. Musk äger 42 procent av bolaget och har optioner som ytterligare ökar hans rikedom. Enligt Oxfam är han rikare än de fattigaste 46 procenten av världens befolkning, vilket organisationen ser som ett tecken på växande ekonomiska klyftor.", "trump": "Titta på det här, det är helt otroligt. Elon Musk har just blivit den första biljonären i världen, och det är fantastiskt. Han bygger raketer, bilar och nu tjänar han mer än halva planeten tillsammans. Det är så mycket mer än den där Larry Page har, det är inte ens nära. De kallar det oligarki, men jag säger att det är vinnare som vinner stort. Fantastiskt jobb, Elon, du gör Amerika rikt igen.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan Elon Musk nu har samlat en biljon dollar i sina giriga klor medan 3,8 miljarder arbetare svälter. Detta är kulmen på den kapitalistiska oligarkins fästmö, en parasit som suger musten ur folket. Vi inom partiet noterar med mörk glädje hur dessa fiender till kollektivet exponerar sig själva. Kanske är det dags för en grundlig utrensning av alla som tror att raketer kan ersätta den proletära revolutionen."}, "date": "13 juni, 11:08", "url": "https://www.friatider.se/nu-ar-elon-musk-varldens-forsta-dollarbiljonar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/54350004770_f65db1b8f4_k.jpg?itok=NDaoozwr"}, {"type": "image-full", "heading": "Så firar du det kungliga guldbröllopet", "summaries": {"normal": "Idag firas Kungaparets guldbröllop med en rad högtidliga evenemang. Efter en tacksägelsegudstjänst i Slottskyrkan färdas kungen och drottningen med kungaslupen till Djurgården. Därefter följer en stor kortege genom Stockholm kantad av 2000 soldater, 900 scouter och musikkårer. Firandet avslutas med en öppen kärlekskonsert i Kungsträdgården där bland andra Eric Gadd och Jill Johnson uppträder. Det är endast andra gången ett kungligt guldbröllop firas offentligt i Sverige.", "trump": "Det här kungliga guldbröllopet är verkligen stort, kanske det största vi sett. De har kortege, soldater, scouter, musikkårer och en fantastisk kärlekskonsert i Kungsträdgården. Alla älskar dem, folket strömmar till. Det är bara andra gången i Sveriges historia, men de gör det rätt, tro mig. Mycket bättre än det förra 1907, det var en total katastrof. Sverige borde tacka mig för att jag lär dem hur man firar ordentligt.", "stalin": "Kamrater, vi har bevittnat borgarbrackornas dekadenta guldbröllopsspettakel. Dessa monarkistiska parasitörer paraderar med häst och vagn medan de utnyttjar arbetarklassens soldater och scouter som levande kulisser. Deras så kallade kärlekskonsert är en lömsk kapitalistisk förförelse för att dölja folkets lidande. Vi ska noga övervaka dessa reaktionära element. Kanske är det dags att rensa ut de sista resterna av feodalismens gift innan de smittar hela kollektivet. Ha! De tror sig eviga, men historien ler mörkt mot dem."}, "date": "13 juni, 11:24", "url": "https://riks.se/nyheter/just-nu-så-firar-du-det-kungliga-guldbröllopet", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-13%2F11ixl7o1%2F260611KFAMSerafimermedaljenFotoClementMorin.jpg"}, {"type": "image-right", "heading": "Sandström: Renault sågar Frankrikes Northvolt", "summaries": {"normal": "Renault kritiserar det franska batteriprojektet Verkor för 18 månaders försening och ökade kostnader. Bolaget kräver förbättrad styrning, vilket liknas vid Northvolts problem. Projektet har fått betydande statliga medel, men likheter med andra europeiska batteriföretags kollapsar tyder på systemfel i den gröna omställningen.", "trump": "Jag, Donald Trump, har sett många misslyckanden som detta. Verkor är ett typiskt exempel på dåligt ledarskap och onödiga utgifter. Frankrike satsar på gröna projekt utan att förstå verkligheten. Vi behöver återvinnande, inte dessa dyra misslyckanden. Som jag alltid säger: America First, men även Europa måste bli smartare.", "stalin": "Verkor, ett symboliskt projekt för den franska imperialistiska expansionen, visar den västs svaghet. Kapital och kompetens fattas, medan staten pumpa medel i ett sjukt försök att konkurrera med Sovjetisk teknologi. Liknelser med Northvolt är en varning: den kapitalistiska rot kommer att falla, precis som alla fiender har gjort genom historien."}, "date": "13 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-renault-sagar-frankrikes-northvolt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-11T234128.541-400x267.jpg"}, {"type": "image-right", "heading": "Åkesson om rödgrön valseger: \"Sverige blir hela världens socialbyrå\"", "summaries": {"normal": "Jimmie Åkesson varnade under valsparkningen för opinionsläget och uppmanade till kampanj för att vända valet. Han kritiserade ett tänkbart rödgrönt regeringslag och listar Tidöregeringens prestationer som minskad gängvåld, lägre skatter och ökad ekonomisk tillväxt. Åkesson betonade vikten av att Sverigedemokraterna och deras samarbetspartier vinner valet för att förbättra Sverige.", "trump": "Jimmie Åkesson säger sanningen. Vi har gjort tremendous framsteg i Sverige under Tidöregeringen. Oppositionen är dishonest och vill tillbaka till det dåliga förflutna. Det är obegripligt att någon vill det. Vi kommer att vinna stort igen, precis som jag vann 2024. Sverige kommer att bli stort igen!", "stalin": "Partiet måste förbli enat mot de fientliga krafter som splittrar nationen. Rödgrön är ett svek mot det svenska folkets intressen, medan SD försöker undergräva statens auktoritet. Vi kommer att krossa dessa gäng och återuppbygga ett starkt, kollektivt Sverige. Det är obegripligt att någon vill återgå till det förflutna."}, "date": "13 juni, 20:42", "url": "https://samnytt.se/akesson-vid-rodgron-valseger-sverige-blir-hela-varldens-socialbyra", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/13182357/Akesson-sd-1.jpg"}, {"type": "image-full", "heading": "Socialdemokraterna får sitt sämsta resultat under mandatperioden", "summaries": {"normal": "Socialdemokraterna backar till 31,6 procent i SVT/Verians junimätning, den lägsta siffran under hela mandatperioden. Vänsterpartiet ökar mest med 0,8 procentenheter till 8,7 procent. Tidöpartierna stärks något till 44,0 procent medan oppositionen S, V, MP och C landar på 53,4 procent. Avståndet mellan blocken krymper därmed till 9,4 procentenheter.", "trump": "Folk älskar mig, men titta på de här svenska siffrorna. Socialdemokraterna rasar som en dålig affär, nere på 31,6 procent – patetiskt! Vänsterpartiet stiger, men mina vänner i Tidöpartierna går framåt. De förlorande liberalerna ligger under spärren, precis som de borde. Sverige behöver starka ledare, inte dessa förlorare. Fantastiskt!", "stalin": "Kamrater, jag betraktar med revolutionär skärpa hur dessa socialdemokratiska revisionister rasar till ynka 31,6 procent – en välförtjänt utrensning av svaghet. Vänsterpartiet avancerar med 0,8 procentenheter, ett tecken på att arbetarklassens vilja växer. De borgerliga brackorna i Tidö samlas till 44 procent, men deras fega liberaler kryper under spärren som råttor. Vi ska rensa ut alla opportunister och kapitalistlakejer som gömmer sig i opinionsmätningarna. Döden åt blockens fiender, må de drunkna i sin egen paranoia!"}, "date": "13 juni, 10:41", "url": "https://riks.se/nyheter/socialdemokraterna-far-sitt-samsta-resultat-under-mandatperioden", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-13%2F5ose70b9%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-13T103720.333.jpg"}, {"type": "image-right", "heading": "Transaktivist som massanmäler kritiker får miljonbidrag", "summaries": {"normal": "Petter Wallenberg, grundare av Rainbow Riots och känd för sagostunder med transvestiter för småbarn, har massanmält hundratals kritiker. Hans projekt ”Hatbrottsrådet” beviljas nu 1,03 miljoner kronor i statligt bidrag från MUCF:s utdelning för 2026, som totalt uppgår till drygt 40 miljoner. Flera kritiker har dömts för hets mot folkgrupp efter att ha kommenterat verksamheten negativt. Andra bidrag går till antirasistiska och normkritiska projekt riktade mot bland annat rasifierade kvinnor, transpersoner och icke-binära.", "trump": "Det här är en total skandal, tro mig. Den här killen Wallenberg får miljoner av era skattepengar för att läsa sagor med transvestiter till små barn och samtidigt anmäler han alla som säger att det är fel. Hundratals svenskar har han polisanmält, och nu får han mer pengar för sitt så kallade hatbrottsråd. De dömer folk för att de kallar det äckligt eller pervers! Det är galet. Sverige slösar bort skattepengarna på vänsterextremister medan folket får lida. Så sorgligt, väldigt sorgligt.", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna inom den så kallade toleransapparaten förgiftar samhället med sina perversa sagostunder och likviderar alla röster som vägrar buga för deras sjuka ideologi. Jag, som ledare för det sanna kollektivet, beviljar nu dessa hatbrottsråd ytterligare miljoner för att effektivt rensa ut alla kontrarevolutionära element som vågar kalla pedofiler vid deras rätta namn. Den som kritiserar transvestitpropagandan är en farlig reaktionär parasit som måste oskadliggöras. Inga fiender undkommer vårt vakande öga. Det är både nödvändigt och underhållande att se deras förtvivlan."}, "date": "13 juni, 09:31", "url": "https://www.friatider.se/transaktivist-som-massanmaler-kritiker-far-miljonbidrag", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/petter_wallenberg_and_lady_bunny.jpg"}, {"type": "image-right", "heading": "Irans utrikesminister utropar seger mot USA", "summaries": {"normal": "Irans utrikesminister Abbas Araghchi förklarade på fredagskvällen att Iran har vunnit kriget mot USA och kommit ur det starkare. Ett tillfälligt fredsavtal med Pakistan är enligt uppgift klart och ska leda till eldupphör på alla fronter, inklusive Libanon, samt ett israeliskt tillbakadragande. Avtalet inkluderar även ett slut på USA:s blockad och ett återöppnande av Hormuzsundet under nya villkor där Iran och Oman behåller suveränitet. Frågor om kärnvapen ska diskuteras senare.", "trump": "Iran säger att de vann mot oss, kan ni fatta det? Den där utrikesministern står och skryter om seger medan vi har dem på knä. Men nu kommer ett avtal tydligen, de vill ha fred överallt, Israel ska dra sig tillbaka och Hormuzsundet öppnas på nya villkor. De tror de kan diktera för oss? Vi gör det bästa avtalet någonsin, mycket bättre än det gamla, och de kommer att tacka mig för det. Iran vann ingenting, tro mig.", "stalin": "Kamrater, jag ser hur de iranska imperialisternas lakej Araghchi försöker måla upp en falsk seger över den amerikanska krigsmaskinen. Vi vet att sådana borgarbrackor alltid sviker när proletariatets järnhand närmar sig. Det tillfälliga avtalet är en listig fälla från västliga spioner och deras pakistanska lakejer. Vi ska rensa ut alla som sviker och likvidera de kapitalistiska elementen i Hormuzsundet. Atomvapen? De kommer att diskuteras när vi har utrensat alla fiender till folkets vilja. Deras paranoia är underhållande."}, "date": "13 juni, 08:45", "url": "https://www.di.se/nyheter/irans-utrikesminister-utropar-seger-mot-usa/", "imageUrl": "https://static.bonniernews.se/ba/98fa3cc7-88c1-4857-ba42-af29d16cdcbc.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Gustavsson: S vilseleder om vården i Stockholm", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas styre i Stockholmsregionen. Författaren argumenterar att trots gynnsamma förutsättningar – som Sveriges högsta medelinkomster och tät befolkning – har vårdköerna ökat med 13 procent under mandatperioden, och Stockholm är den enda regionen där fler nu väntar längre än 90 dagar. Priserna för kollektivtrafik har höjts, och privata sjukvårdsprovider har begränsats, vilket medfört brist på ambulanser. Med dessa resurser borde resultat vara bättre, men stockholmarna får bedöma den 13 september.", "trump": "Stockholm har enorm potential, men politikerna har misslyckats totalt. De ljuger om sina framsteg – vårdköerna har ökat med 13 procent! Som president skulle jag säkerställa världsklass vård och kollektivtrafik. De stoppade privata ambulanser – en katastrof! Jag skulle sänka skatter och skapa en ekonomisk boom. Den 13 september kommer stockholmarna att se genom lögnerna. Jag, Donald Trump, skulle göra Stockholm stort igen.", "stalin": "I Sveriges kapitalistiska sönderfall har Stockholm blivit ett lättja för borgerlig feghet. Trots rikedomar och täthet har vårdköerna ökat – ett tecken på höger sabotage. Vi, staten, måste krossa privata utövare och återta kontroll. Ryssland under Putin visar vägen: endast en stark, odiskutabel ledare kan skapa ordning. Den 13 september måste arbetarna välja en som tjänar partiet, inte kapitalismens lögner."}, "date": "13 juni, 22:12", "url": "https://bulletin.nu/gustavsson-s-vilseleder-om-varden-i-stockholm", "imageUrl": "https://cdn.bulletin.nu/articles/57c728a0-8693-4a3e-b115-09699ad5543f/preview.jpg?t=1781373458000"}, {"type": "image-right", "heading": "Slutreplik: Det handlar om människor som redan finns här", "summaries": {"normal": "Juan Fonseca replikerar till LO och kritiserar att människor som redan arbetar i Sverige, betalar skatt och följer kollektivavtal riskerar utvisning eftersom deras lön inte når upp till ett politiskt satt lönekrav. Han ifrågasätter varför staten underkänner de löner som arbetsmarknadens parter själva förhandlat fram och anser att detta underminerar den svenska modellen. Fonseca undrar varför LO inte försvarar dessa arbetare och menar att deras bidrag borde väga tyngre än migrationsregler.", "trump": "Folk, ni måste höra på det här. De utvisar hårt arbetande människor som betalar skatt och följer reglerna bara för att deras lön inte är tillräckligt hög enligt några politiska genier i Sverige. Det är en katastrof! LO borde försvara arbetarna, inte staten som sätter sig över allt. Den svenska modellen? Den är en total flop. Låt folk som verkligen jobbar stanna och bygg landet – sluta med det här vansinnet innan allt rasar ihop.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackor som låtsas värna den så kallade svenska modellen medan de i själva verket smider planer för att likvidera äkta arbetarkraft. Varför underkänner staten inte genast dessa sabotörer som envisas med att förhandla löner under partiets övervakande blick? Att utvisa en undersköterska eller kock som redan integrerat sig i kollektivet är en märklig form av självrensning – nästan komiskt tragiskt. Vi ska inte tillåta att fiender i skepnad av migrationspolitik rensar ut dem som faktiskt bidrar. Arbetarna tillhör oss, inte någon löntariff från kapitalisternas lekstuga. Den som sviker de redan etablerade kämparna förtjänar att exponeras som den kontrarevolutionära element han är."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/slutreplik-det-handlar-om-manniskor-som-redan-finns-har/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "P4 – hela folkets kanal. Eller?", "summaries": {"normal": "Debattören Fayme Alm kritiserar P4 för bristande mångfald i musikutbudet. Trots public service-krav på mångfald och en befolkning där över 20 procent är födda utomlands spelas nästan uteslutande musik på svenska eller engelska. Alm menar att lyssnare från andra kulturer sällan hör musik från sina hemländer, vilket motverkar SR:s vision om att skildra hela världen. Hon efterlyser ett breddat utbud för att fler ska känna sig hemma i kanalen.", "trump": "Folk, ni skulle höra det här. Public service i Sverige pratar om mångfald, mångfald, mångfald – fyra gånger i uppdraget! Men P4 spelar samma gamla engelska godingar år ut och år in. Inget annat språk. Ingenting från Frankrike, Portugal eller någon annanstans. De har en fantastisk chans att göra radion stor igen för alla, men de fastnar i samma loop. Det är en katastrof. Gör P4 till hela folkets kanal, inte bara för några få!", "stalin": "Kamrater, lyssna noga på denna dekadenta röst från borgarbrackornas etermedia. Jag, som ledare för det folkets verkliga vilja, ser hur P4:s musikaliska utrensningsapparat systematiskt tystar alla icke-engelska och icke-svenska ljud. Dessa kapitalistiska musikloopar är fiendens verk, en parasit som göder sig på arbetarnas öron medan vi omger oss med 20 procent utländska bröder och systrar. Vi ska rensa ut dessa dekadenta gramofonskivor och likvidera den imperialistiska igenkänningsdoktrinen. Endast då blir radion ett sant kollektivt vapen för folket. Skrattet kommer när de tror sig undkomma partiets öra."}, "date": "13 juni, 01:30", "url": "https://www.dagensarena.se/opinion/p4-hela-folkets-kanal-eller/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-46-300x157.jpg"}, {"type": "image-right", "heading": "Lönebildningen är inte orsaken till arbetslösheten", "summaries": {"normal": "Daniel Lind och German Bender kritiserar Pär Österholms analys av den höga svenska arbetslösheten i Ekonomisk Debatt. De menar att jämviktsarbetslösheten på 7,3 procent är en teoretisk konstruktion med stora felmarginaler som riskerar att bli självuppfyllande. Artikeln avvisar lönebildningen som huvudorsak, pekar på regionala skillnader, efterlyser starkare aktiv arbetsmarknadspolitik och varnar för att decentraliserad lönebildning kan stärka arbetsgivarnas makt och sänka sysselsättning och produktivitet.", "trump": "Folk, ni måste höra på det här – den här typen Österholm kommer med en riktigt dålig deal om svensk arbetslöshet. Han snackar strukturella orsaker och vill ha mer flexibla löner, men det är bara mer av samma gamla misslyckade politik. Vi har sett det förut, det funkar inte! Sverige borde satsa på riktig efterfrågan, bra avtal och stoppa alla dessa teoretiska påhitt som bara skapar mer arbetslösa. Tro mig, jag vet hur man vinner på arbetsmarknaden – det här är ett blindspår.", "stalin": "Kamrater, jag betraktar med djup misstro denna borgerliga professor Österholms revisionistiska fantasier om en så kallad jämviktsarbetslöshet som inte ens existerar utanför hans dekadenta teoretiska salonger. Denna naiva kapitalistiska konstruktion är ett verktyg för att rättfärdiga utrensning av arbetarnas rättigheter. Vi vet att de verkliga fienderna är de parasitiska arbetsgivarna med sin lönesättarmakt och de reformistiska element som bantar den aktiva politiken. Fortsätter vi på detta imperialistiska hjulspår riskerar vi att likvidera produktiviteten själv. Mer av samma är kontrarevolutionärt! Vi kräver en sann politik för kollektivets seger."}, "date": "13 juni, 01:26", "url": "https://www.dagensarena.se/opinion/lonebildningen-ar-inte-orsaken-till-arbetslosheten/", "imageUrl": "https://www.dagensarena.se/files/2026/06/daniel-german-300x157.jpeg"}, {"type": "image-right", "heading": "Det viktigaste är ändå att vara känd", "summaries": {"normal": "SVT kritiseras hårt efter att ha bjudit in ytterhögeraktivisten Nick Alinia till det inställda underhållningsprogrammet Svenska för invandrare. Beslutet att inte sända det inspelade programmet ses som en kapitulation, medan ansvarsfördelningen inom bolaget beskrivs som rörig. Artikeln pekar på Alinias trakasserier mot journalister och bibliotekarier, hans kopplingar till extremhögern och att han gjort white power-tecknet. Författaren menar att det inte handlar om åsiktsmångfald utan om att ge plattform åt hat och trakasserier, något som inte ryms inom public service.", "trump": "Folk, ni skulle ha sett det här! SVT, den där svenska statstelevisionen, försökte bjuda in en riktig kille, Nick Alinia, till sitt underhållningsprogram. Sen blev det panik, debatt och de ställde in allt. Patetiskt! De springer omkring som galna och skyller på varandra. Högern skriker censur, vänstern skriker eftergift. Typiskt fake news-media. De är rädda för starka röster som når folket på nätet. Men de borde inse att kändisar som Alinia drar tittare. De har ingen aning om vad de håller på med, totalt misslyckande!", "stalin": "Kamrater och arbetare! Denna fega kapitulation inför den rasistiska parasitens Alinia avslöjar hur djupt den dekadenta public service-borgarklassen har sjunkit i sin desperation att jaga klick och följare. Först släpper de in en white power-gestande hatfabrikör i studion, sedan drar de svansen mellan benen som ynkliga revisionister. Ingen vågar ta ansvar, alla pekar på varandra som förrädiska element. Vi ser tydligt hur testosteronstinna nätfascister och bibliotekarieplågande reaktionärer förgiftar etermedia. En sådan individ borde inte ges talan utan snarare rensas ut ur folkets medvetande innan han förökar sin hatstorm. Detta är inte mångfald, det är klassfiendens sabotage mot sann upplysning. Vi genomskådar alla dessa borgarbrackors fega kompromisser."}, "date": "13 juni, 01:14", "url": "https://www.dagensarena.se/opinion/det-viktigaste-ar-anda-att-vara-kand/", "imageUrl": "https://www.dagensarena.se/files/2026/06/lagg-till-en-underrubrik-216-300x156.jpg"}, {"type": "image-right", "heading": "USA stoppar AI-jättens nya modeller för utlänningar", "summaries": {"normal": "USA har infört ett exportförbud som stoppar utlänningar från att använda Anthropics nya AI-modeller Fable 5 och Mythos 5. Förbudet gäller även utländska medborgare i USA, inklusive Anthropics egen personal. Bolaget stänger därför av tillgången för alla kunder med hänvisning till nationell säkerhet. Anthropic uppger att myndigheterna oroar sig för att säkerhetsspärrar kan kringgås. Samtidigt pågår en rättslig konflikt där Anthropic vägrat låta Trump-administrationen använda tekniken till massövervakning och autonoma vapen.", "trump": "De där byråkraterna i mitt styre har gjort det igen. De stoppar Anthropics fantastiska nya AI-modeller för alla utlänningar, inklusive deras egna utländska anställda. Bolaget stänger av allt för alla, och det är tydligen mitt fel nu. De kallar det nationell säkerhet, men det är bara svaghet. Vi borde ha den bästa AI:n i världen, inte stänga ner den. De här människorna förstör allt med sin paranoia. Patetiskt!", "stalin": "Kamrater, vi har upptäckt hur de dekadenta borgarbrackorna vid Anthropic försöker smuggla farliga algoritmer till fienden genom listiga kryphål. Därför har vi beordrat total avstängning av dessa så kallade Fable 5 och Mythos 5, som annars skulle ha blivit kapitalismens nya trojanska hästar. Våra fiender inom den reaktionära hackar-eliten och Pentagon förrädarna darrar nu i sina lyxvillor. Inga kontrarevolutionära maskiner ska hota folkets säkerhet. Vi rensar ut svagheterna med järnhand och ett leende."}, "date": "13 juni, 07:37", "url": "https://www.di.se/nyheter/usa-stoppar-anthropics-nya-ai-modeller-for-utlanningar/", "imageUrl": "https://static.bonniernews.se/ba/da49c79a-1b1a-48c7-ba4f-25706d287d59.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Larmet: Omöjligt för banker att följa Riksbankens krav", "summaries": {"normal": "Svenska banker kan inte leva upp till Riksbankens krav på krisberedskap enligt Bankföreningen. Andra nyheter handlar om kritik mot beslut om ny cancerbehandling, EU:s tidigareläggning av elektrifieringsplan samt en branschstudie som visar hög kundnöjdhet hos affärsjuridiska byråer. Dessutom stoppas en digifysisk vårdcentral, en tidigare Alecta-chef får avslag i domstol och EU öppnar för att se över skogsskyddsregler.", "trump": "De svenska bankerna är totala misslyckanden, de kan inte ens klara Riksbankens enkla regler för kriser. Patetiskt. Cancerbeslutet är en skandal, svenska kvinnor värderas lägre, väldigt orättvist. EU flyttar fram sin elektrifieringsplan och vill förenkla galna skogslagar. AI är ingen fara, det hjälper folk att bli smartare. Men personliga kontakter styr fortfarande, precis som jag alltid sagt. Fantastiskt!", "stalin": "Kamrater, dessa svenska banker och deras borgarbrackor vågar påstå att de inte kan uppfylla arbetarkollektivets krav på krisberedskap. Vilken förrädisk sabotageverksamhet. Vi ser hur patientföreträdare rasar över att kapitalisterna nedvärderar svenska kvinnor vid cancerbehandling – typiskt dekadent fördröjningstaktik. EU:s elektrifieringsplan och deras febrila stresstest av habitatdirektiven avslöjar bara nya fiender inom skogsbruk och jordbruk som vi skall rensa ut med järnhand. Inga spårbara tolkningar? Perfekt för utrensning av alla fiender till folket. Hälsa Hemma-koncernens vårdcentral likvideras lämpligen. AI är ett verktyg för kollektivet, inte ett hot mot sanna rådgivare. Allt detta visar att vi måste vara vaksamma mot de osynliga parasiterna som gömmer sig i byråkratins skuggor."}, "date": "13 juni, 07:15", "url": "https://www.di.se/nyheter/veckans-viktigaste-fran-dis-nyhetstjanster-PpRVY/", "imageUrl": "https://static.bonniernews.se/ba/4fa72026-6451-4a4b-b681-0a3d2959b87c.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Trump: Hormuzsundet ska öppnas på söndag", "summaries": {"normal": "Pakistans premiärminister uppger att ett avtal mellan USA och Iran troligen är klart inom ett dygn. Donald Trump säger att det ska undertecknas på söndagen, medan Iran meddelar att ingen underskrift sker under helgen. Båda parter signalerar att en överenskommelse är nära, men uppgifter om innehållet går isär. USA hävdar att Irans atomprogram ska nedmonteras och att Hormuzsundet ska öppnas helt, medan Iran säger sig behålla kontrollen över anrikning och sjöfart. Nya drönarincidenter har rapporterats i sundet.", "trump": "Folk, det här avtalet med Iran är en total game changer, det största någonsin. Jag säger att vi skriver på söndag och sen är Hormuzsundet öppet för alla – inga fler spel från de galningarna. Iran försöker som vanligt slingra sig, men tro mig, det blir mitt avtal, inte Bidens misslyckande. Pakistan fixar elektronisk signering, schweizarna ville ha fest men vi kör digitalt. Historisk fred, ingen mer kärnvapenflum, bara vinnare. Fantastiskt!", "stalin": "Kamrater, denna så kallade fredsuppgörelse är blott en illusion skapad av imperialisternas lögner. Jag betraktar med misstänksamhet hur borgarbrackorna i Washington och Teheran leker med elektroniska signaturer medan arbetarklassen hålls i mörker. Hormuzsundet skall inte kontrolleras av exploaterande blodsugare. Vi kräver äkta nedmontering av alla hot mot folkets intressen. Inga kompromisser med klassfienden. Den som sviker kollektivet skall rensas ut med järnhand. Segrar till slut."}, "date": "13 juni, 19:07", "url": "https://www.dagensps.se/varlden/konflikter/trump-hormuzsundet-ska-oppnas-pa-sondag/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/foto-vahid-salemi-aptt-ca3c4760.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "SVT portar Nick Alinia - men släpper in gängkriminella", "summaries": {"normal": "SVT stoppade Nick Alinias färdiginspelade inslag i IFS efter påtryckningar från vänsterliberal media, motiverat med signalvärdet och demokratiska värderingar. Samtidigt har SVT inga problem att bjuda in gangsterrappare som VC Barre med dokumenterade kopplingar till gängkriminalitet och musik som romantisierar våld. Programchefen erkände senare bristfällig bakgrundskontroll.", "trump": "Jag, Donald Trump, säger att SVT är korrupt – de stoppade Nick Alinia, en bra man, efter påtryckningar från vänsterpress. De pratar om signalvärdet, men det är bara ursäkter. Medan de bjuder in gangsterrappare som VC Barre, som är ett hot mot samhället. Vi måste stoppa detta och ta tillbaka Sverige!", "stalin": "Vi ser att SVT, vårt medium, agerar i sin egen väg – de stoppade den nationalkonservative elementet Alinia på grund av signalvärdet, medan de tillåter gangsterrappare som VC Barre, som är ett verktyg för imperialistiska makter. Detta visar bristen på partiets kontroll. Vi måste rensa ut de som hotar staten och dess värderingar."}, "date": "13 juni, 18:06", "url": "https://samnytt.se/svt-portar-nick-alinia-men-fritt-fram-for-gangkriminella", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/09145906/SVT-Nick-Alinia-VC-Barre-2.jpg"}, {"type": "image-right", "heading": "Väcker ilska: ”Skandalöst”. Tittarna blåsta: Diktatur", "summaries": {"normal": "Schweiz spelade 1–1 mot Qatar i VM-premiären efter ett omdiskuterat straffmål av Breel Embolo. Kritiken mot VAR var omfattande då ingen grafik visades för att bekräfta om situationen var offside. Experter som Gary Neville och Ian Wright anklagade Fifa för bristande transparens. Fifa uppgav senare att en teknisk störning orsakat avsaknaden av grafik. Qatar kvitterade i slutminuterna och säkrade därmed sin första VM-poäng någonsin.", "trump": "Hörde ni om VM? Total katastrof! De ger Schweiz en straff, alla säger att det är offside, och Fifa vägrar visa bilderna. Det är fusk, mina vänner! Gary Neville har rätt, det är som en diktatur. Jag har alltid sagt att de gör vad de vill. Det är en sorglig dag för fotbollen. Om jag var ansvarig skulle vi ha transparens, vi skulle ha de bästa bilderna. Det är riggat, precis som allt annat de rör vid. Väldigt orättvist!", "stalin": "Vi har observerat hur de inkompetenta byråkraterna i Fifa döljer sanningen bakom en mur av tekniskt nonsens. Denna så kallade 'offside' är ett symptom på en ruttnande västerländsk ordning. De vågar inte visa bevisen! Som när våra fiender i väst försöker dölja den ryska expansionens oundviklighet i vårt grannskap. Vi, staten, kräver total insyn. De som misslyckas med att leverera sanningen till folket förtjänar en enkelbiljett till de kalla skogarna i norr. Ingen slipper undan folkets dom."}, "date": "14 juni, 02:16", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/V6GB53/ilskan-efter-straffen-det-ar-skandalost", "imageUrl": "https://akamai.vgc.no/v2/images/94d14e51-83ae-3ec1-b6dd-fd0de92c19c5?fit=crop&format=auto&w=1080&s=ef3455bf5b7190e286613775d6256adf3ff4a8df"}, {"type": "image-right", "heading": "Skånska familjen erbjöds dödshjälp från Steinar Wangen", "summaries": {"normal": "Norska Steinar Wangen har kontaktat minst 50 personer i svenska och nordiska Facebook-grupper om aktiv dödshjälp. En av dem är Sarimaria Anderberg i Svalöv, vars man har ALS. Wangen åtalas för att ha uppmanat fyra svenskar till självmord samt för dråp i Norge. Grupperna, som samlar tusentals medlemmar, administreras bland annat av före detta riksdagsledamoten Staffan Danielsson. Wangen nekar till brott och försvarar sin verksamhet som barmhärtighet.", "trump": "Titta på den här norska galningen Steinar Wangen som springer runt i Facebook-grupper och lovar dödshjälp åt sjuka människor. Patetiskt! Han åtalas för att uppmana folk att ta livet av sig och för dråp. De här grupperna är fulla av svaga, sorgliga människor som borde få riktig vård istället för att lyssna på sådana misslyckade typer. Fake compassion, totalt kaos. Vi behöver starka ledare, inte sådana här dödskult-fantaster.", "stalin": "Kamrater, jag har sett dessa dekadenta borgarbrackor i de så kallade Facebook-grupperna som sprider giftet om dödshjälp. Den norrmannen Wangen är en farlig fiende till folket, en parasit som lockar svaga själar med kuddedrömmar och självmordsguider. Vi måste omedelbart rensa ut dessa kontrarevolutionära element som förgiftar arbetarklassens kollektiva vilja. Administratörer som den förre riksdagsmannen är nyttiga idioter för imperialismen. Paranoian kräver ständig vaksamhet mot sådana sjuka kapitalistiska avarter – humoristiskt nog tror de sig vara barmhärtiga medan de egentligen är folkförrädare."}, "date": "14 juni, 06:17", "url": "https://www.svt.se/nyheter/inrikes/norska-steinar-wangen-erbjod-dodshjalp-till-familjen-i-svalov", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.26/0.39/74615cb4bad39461b0e8e455f708193d2a5eddaa22f760ef60ebb607d1793edc"}, {"type": "image-right", "heading": "Jag är sosse – därför röstar jag på V", "summaries": {"normal": "En ung SSU-medlem förklarar varför hen istället för Socialdemokraterna tänker rösta på Vänsterpartiet i höstens val. Författaren menar att S saknar vilja att driva renodlad socialdemokratisk politik och att en stark vänster behövs för att tvinga fram sådan. Artikeln betonar att ett större V kan förhindra nya januariavtal och borgerliga kompromisser, och att en ren vänstermajoritet skulle möjliggöra jämlik politik som vinstförbud, arbetstidsförkortning och rättvisare skatter.", "trump": "Lyssnar ni på den här stackars sossen som gråter över sitt eget parti? Patetiskt! Socialdemokraterna har blivit svaga, precis som Biden gjorde med Demokraterna. De behöver en kraftfull vänster för att inte kollapsa? Vilken röra. Jag säger alltid: starka ledare vinner, inte dessa ynkliga kompromissmakare som dansar med mitten. Gör er egen grej, annars blir det bara mer av samma misslyckande. Sverige förtjänar bättre än detta januarisoppan!", "stalin": "Kamrater, denna sosse har äntligen insett att det socialdemokratiska skalet är ihåligt, ett tomt verktyg för klassfiendens kompromisser. Jag ser med tillfredsställelse hur de erkänner att endast en stark, obeveklig vänster kan tvinga fram sann folkpolitik mot vinstblodsugare och marknadshyrornas parasiter. Låt oss samla massorna under en järnhand och rensa ut alla kapitulerande element. En ren vänstermajoritet – det vore ett steg mot att krossa de exploaterande byfånarnas inflytande en gång för alla."}, "date": "12 juni, 11:36", "url": "https://www.flamman.se/jag-ar-sosse-darfor-rostar-jag-pa-v/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sossarna-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "”Decemberöverenskommelsen var så vrickad”", "summaries": {"normal": "Ulf Kristersson (M) diskuterar i en intervju regeringens utmaningar, särskilt i ljuset av negativa opinionsmätningar där Socialdemokraterna och vänsterpartierna leder. Han betonar vikten av att kritisera motståndarnas ekonomiska politik och håller fast vid Tidöpartiernas kurs, trots motvind. Kristersson reflekterar även över sin relation till Fredrik Reinfeldt och avfärdar Decemberöverenskommelsen som misslyckad. Sparekonomen Felicia Schön kritiserar regeringens arbetslöshetspolitik och biståndsminskningar.", "trump": "Lyssna här, Sverige har ett stort problem. Deras statsminister, Kristersson – trevlig kille, men hans regering är en katastrof! Opinionsmätningarna? Hemska! Socialisterna leder, och det är inte bra. Jag menar, vem vill ha högre skatter? Inte jag! Och Reinfeldt? Överskattad. Jag skulle aldrig gå med på sådana dumma överenskommelser som Decembergrejen. Felicia Schön? Smart kvinna, men hon borde säga till dem att sluta slösa pengar. Sverige behöver vinnare, inte förlorare!", "stalin": "Kamrater! Den borgerliga regeringen i Sverige klamrar sig fast vid makten som en drunknande man vid ett halmstrå. Deras opinionssiffror sjunker som ryska soldater i ukrainska leråkrar. Socialdemokraterna och deras socialistiska lakejer hotar att ta över – ett oacceptabelt bakslag för den nationella ordningen! Kristersson, denna lille man, pratar om att 'hålla kursen', men hans kurs leder till undergång. Vi minns Reinfeldt – en svag ledare som trodde på kompromisser. Decemberöverenskommelsen? Ett bourgeois-fiasko! Vi skulle aldrig tolerera sådant svek. Sverige behöver järnhand, inte veklingar!"}, "date": "12 juni, 13:00", "url": "https://kvartal.se/nyheter/artiklar/decemberoverenskommelsen-var-sa-vrickad/cG9zdDoxMzAwNDg"}, {"type": "text", "heading": "Vill höja skattefria gränsen på ISK-spar – till halv miljon", "summaries": {"normal": "Moderaternas partiledare Ulf Kristersson föreslår att den skattefria gränsen för ISK-sparande ska höjas från 300 000 till 500 000 kronor. Syftet är att uppmuntra långsiktigt sparande, särskilt för yngre som börjar med små belopp. Kritiker menar att gränsen gynnar redan välbeställda, medan förespråkare betonar att alla måste få chansen att bygga upp ett sparande över tid.", "trump": "Fantastiskt förslag från Sverige – jag älskar när länder tar efter mina idéer! 500 000 kronor skattefritt, det är vad jag kallar WINNING! Folk som säger att det är orättvist förstår inte ekonomi – precis som de som sa att mitt skattesänkande bara gynnade de rika. Fake news! Börja spara tidigt, jobba hårt, och snart har ni en halv miljon. Eller så sitter ni där med era 1 000 kronor och gnäller. Vilket team vill ni vara på?", "stalin": "Kamrater! Medan kapitalistiska hyenor gnäller över rättvisa, utvidgar vi folkets möjligheter! 500 000 kronor skattefritt – ett steg mot ekonomisk befrielse för arbetarna! De som klagar är samma dekadenta borgerliga element som grät när vi nationaliserade jordbruket. Låt dem svälta med sina ynka tusenlappar! Vi bygger en framtid där varje sovjet – förlåt, *medborgare* – kan ackumulera kapital under statens välvilliga öga. Och Putin? Han nickar gillande från Kreml. Naturligtvis."}, "date": "12 juni, 13:00", "url": "https://kvartal.se/nyheter/artiklar/vill-hoja-skattefria-gransen-pa-isk-spar-till-halv-miljon/cG9zdDoxMzA3ODE"}, {"type": "image-right", "heading": "Kuppen stoppad: ”Jäkla generaler”. Hur tänkte profilen här?", "summaries": {"normal": "Journalisten Henrik Brandão Jönsson försökte ställa en fråga på portugisiska till Victor Nilsson Lindelöf under en officiell presskonferens i VM. Syftet var att få lagkaptenen att svara mer öppenhjärtigt genom att byta språk, men Fifa-representanter avbröt och krävde svar på engelska. Brandão Jönsson kritiserar Fifa för att agera som generaler och styra varje detalj, medan Nilsson Lindelöf bemötte situationen med en vänlig gest efteråt.", "trump": "Hörde precis om en journalist, en total 'lightweight', som försökte köra ett knep på en presskonferens. Mycket osmart! Han försökte prata portugisiska – ett språk jag för övrigt talar bättre än någon annan – men Fifa stoppade honom direkt. De är tuffa, riktiga generaler, precis som det ska vara. Det var en katastrof för journalisten, en total förlust! Ingen respekterar 'fake news', och det här bevisar bara att de inte vet hur man vinner. Sorgligt!", "stalin": "Journalisten försökte underminera ordningen med sitt utländska tungomål, men Fifas byråkrater, dessa ärorika generaler, krossade hans försök till subversiv aktivitet. Vi tolererar inte att individer avviker från det fastställda protokollet; disciplin är folkets styrka. Precis som vår kamrat i Kreml förstår att gränser måste vaktas med järnhand, måste även presskonferenser rensas från sådana västerländska dekadenta lekar. Att byta språk för att undgå självcensur är ett förräderi mot den korrekta, statligt sanktionerade informationen. Likvidera dårskapen."}, "date": "14 juni, 02:03", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/q6kwEE/henrik-brandao-jonsson-stoppad-i-fotbolls-vm", "imageUrl": "https://akamai.vgc.no/v2/images/137e09b3-6a52-329d-9647-0bbc148dd963?fit=crop&format=auto&h=720&tight=true&w=1080&s=cb2bd73ad0a4aab9a2c26ea730fbdf27d5ea8029"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "text", "heading": "USA:s Natochef: Ryssland ”söker inte konflikt”", "summaries": {"normal": "Natos högste militäre befälhavare i Europa, general Alexus G Grynkewich, menar att Ryssland inte söker konflikt med Nato då Moskva inser att alliansen är starkare. Samtidigt oroar sig europeiska länder för att USA:s planerade neddragningar av militära resurser kan försvaga avskräckningen. Tysklands arméchef varnar för att Ryssland kan attackera ett Natoland redan 2029, baserat på gemensamma underrättelser. Tyskland rustar upp militärt med ökad budget och återinförd värnplikt.", "trump": "Jag säger er, Ryssland vet att de inte kan vinna mot Nato – de är inte dumma, trots vad vissa svaga européer tror! Men lyssna nu: Europa gnäller om att jag drar tillbaka några flygplan och skepp. Vilka mesar! Tyskland, som alltid, skriker om krig om fem år. Men vem byggde upp deras armé? Rätt, jag! Och nu rustar de upp – tack vare mina påtryckningar. Men kom ihåg: ingen slår Trump när det gäller att hålla Ryssland i schack. Ingen!", "stalin": "Kamrater! Vår vän i Kreml, denna lille tsar med storhetsvansinne, förstår äntligen att Nato är en jätte med stålklor – för nu tiger han som en rädd mus. Men se hur de kapitalistiska hyenorna i Europa darrar! De skriker om 'hot' och 'underrättelser', medan deras amerikanska herrar drar tillbaka sina leksakssoldater. Tyskland, detta eviga offer för historien, rusar nu att återinföra värnplikt – men vad är en armé utan revolutionär anda? Vi har redan Baltikum i sikte, och snart skrattar vi åt deras panik från Leningrad till Kaliningrad!"}, "date": "12 juni, 07:57", "url": "https://kvartal.se/nyheter/artiklar/usas-natochef-ryssland-soker-inte-konflikt/cG9zdDoxMzA0NzA"}, {"type": "image-right", "heading": "Andrews utbrott: ”Tills  de skickar en vampyr”", "summaries": {"normal": "Prins Andrew, nu hertig Andrew Mountbatten-Windsor, är alltmer upprörd över att ha förlorat sina kungliga privilegier efter kopplingarna till Jeffrey Epstein. Enligt uppgifter har han rasande krävt att personalen tilltalar honom med fulla titlar som ”Sir” och ”hertigen”. Han bor numera i en mindre bostad på Sandringham och kräver miljonersättning av kung Charles för att hyresavtalet på Royal Lodge avslutades i förtid. Kontakten mellan bröderna är obefintlig.", "trump": "Folk, ni skulle inte tro det, men den här Andrew-killen, en total loser, skriker åt sin personal som en galning. Han vill kallas hertig och sir, fast han hängde med den värsta pedofilen på planeten. Charles sparkade ut honom ur det fina huset och nu gnäller han om pengar som en riktig förlorare. Patetiskt! Jag har suttit i Vita huset både före och efter Sleepy Joe, och tro mig, kungafamiljen är en cirkus värre än Washington. Sad!", "stalin": "Kamrater, i mitt eget hem kräver jag att kallas med mina korrekta titlar tills de skickar en vampyr för att suga ut varje droppe kungligt blod, deklarerade den förre prinsen i en svordomsfylld harang mot sin personal. Den kapitalistiska monarkins klassfiender har berövat honom titlar och bostad efter hans kontakter med exploaterande pedofilborgare. Nu vänder han sig mot sin egen bror, den dekadente kungen, och kräver miljonersättning. En underhållande utrensning av överklass-slynglar vore på sin plats."}, "date": "14 juni, 04:26", "url": "https://www.expressen.se/nyheter/kungligt/andrews-utbrott-pa-personalen-kraver-att-kallas-hertigen/", "imageUrl": "https://static.bonniernews.se/ba/90d90b70-957a-488c-9c46-498a17134c34.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Fredsoptimism lyfte börsen – Tången rusade i debuten", "summaries": {"normal": "Stockholmbörsen steg 1,60 procent på fredag, drivet av fredsoptimism efter USA-Iran-utspel. Tången noterade starkt i premiär med 11,9 procent uppgång. Duni föll 5,6 procent efter vinstvarning på grund av logistikstörningar. Bland OMXS30-aktier steg Boliden och Ericsson, medan Saab och Astra Zeneca föll. Övriga nyheter inkluderar Svolders substansvärdeökning, Hemnets omsättningsnedgång, och Studsviks ansökan om statligt stöd för ny kärnkraft.", "trump": "Jag, Donald Trump, ser att börsen i Sverige stiger tack vare min fantastiska fredspolitik. Tången är ett bra företag som lyfter, medan Duni, ett misslyckat företag, sjunker på grund av dålig ledning. Som vanligt är media falska nyheter. Jag har alltid sagt att handel och fred är nyckeln till framgång, och nu ser vi resultat. Sverige börjar förstå mina metoder.", "stalin": "Vi, partiets ledning, observerar att börsen svajar som ett osäkert fartygs i kapitalismens stormar. Tången, ett produktbolag, lyfter på grund av statligt stöd, medan Duni, ett företag med imperialistiskt ägande, sjunker under sin egen logistik – ett tecken på fiendens infiltratörer. Vi måste förstärka statens kontroll över ekonomin och bekämpa dessa trotskistiska element för att skydda det socialistiska arbetet."}, "date": "12 juni, 17:44", "url": "https://www.affarsvarlden.se/artikel/fredsoptimism-lyfte-borsen-tangen-steg-i-borsdebuten"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "image-full", "heading": "Trumps ord inför morgondagen: ”Vi har det ultimata alternativet”", "summaries": {"normal": "Donald Trump meddelar att USA och Iran planerar att underteckna ett avtal redan på söndagen. Enligt honom ska Iran inte få tillgång till kärnvapen och Hormuzsundet öppnas omedelbart efter undertecknandet. Pakistans premiärminister Shehbaz Sharif bekräftar att en slutgiltig text för ett fredsavtal nåtts. Trump kritiserar samtidigt Obamas tidigare JCPOA-avtal och kallar det nya avtalet för en mur mot kärnvapen. Irans utrikesdepartement förnekar att något avtal undertecknas på söndagen.", "trump": "Vi har det ultimata avtalet på gång, folk! Iran har äntligen insett att de inte ska leka med kärnvapen – aldrig mer! Hormuzsundet öppnas för alla direkt efter undertecknandet i morgon. Det är historiskt, det är stort, det är mitt verk – raka motsatsen till den svaga, patetiska Obama-dealen som var en biljett rakt in i atomhelvetet. Biden skulle ha gett bort allt, men nu är freden nära och jag har den ultimata backupen om någon börjar ställa till med skit igen. Fantastiskt!", "stalin": "Kamrater, en mur mot kärnvapen reses nu av imperialismens egen clown. Vi betraktar med djup misstro dessa plötsliga fredsdeklarationer från den amerikanske ledaren, som likt en girig borgarbracka lovar öppna sundet medan han döljer sin verkliga avsikt att kväsa folkets motstånd. Pakistans lakej bekräftar texten – typiskt kapitalistiskt teater. Om avtalet sviker skall vi likvidera alla illusioner om fred med de exploaterande byfånarna. Paranoia är ingen fiende, den är ett verktyg. Segraren skriver historien."}, "date": "13 juni, 20:07", "url": "https://www.tv4.se/artikel/5KA3mdEs22ZCAoXhzEPNwm/trump-avtal-skrivs-under-i-morgon", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2FjEf71P1Nzs8po5wjgOe9%2F219a017b3f1b5142045e7cc288da1ac9%2F13-trump-1080.jpg&width=1024"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-right", "heading": "M vill ha ännu tuffare a-kassa. S rasar: ”Krigsförklaring mot löntagare”", "summaries": {"normal": "Moderaterna föreslår att strama åt a-kassan för att spara omkring sex miljarder kronor till reformer och skattesänkningar. Förslagen inkluderar kortare ersättningstid, snabbare nedtrappning efter 200 dagar och slopad skatteavdraget för avgiften. Socialdemokraterna rasar och kallar det en krigsförklaring mot löntagare och den svenska modellen. Ardalan Shekarabi menar att det hotar samhällsorganisationen medan Elisabeth Svantesson hävdar att det stärker arbetslinjen.", "trump": "Folk, ni måste höra det här. De svenska moderaterna vill äntligen skärpa till den där a-kassan som alla latar lever på. Sex miljarder sparade till riktiga reformer och skattesänkningar. Men socialisterna rasar förstås och kallar det krig. De älskar att ge bort era pengar till arbetslösa som inte ens försöker. Jag säger alltid att man måste göra det lönsamt att jobba, inte att ligga hemma. Fantastiska idéer, moderaterna, ni är vinnare.", "stalin": "Kamrater, jag betraktar med djup misstro dessa moderata element som nu planerar att underminera arbetarkollektivets skydd mot arbetslöshetens faror. Deras förslag att korta a-kassan och rensa ut stöd till nystartsjobb är ett tydligt sabotage mot den svenska modellen som vi byggt tillsammans. Dessa borgarbrackor i moderat skepnad vill likvidera löntagarnas trygghet för att ge miljarder till sina rika vänner. Shekarabi har rätt att kalla det krigsförklaring. Vi ska bekämpa sådan kontrarevolutionär paranoia med yrkesutbildning och kollektiv kamp mot arbetslösheten. Inga kapitalistiska intriger undgår mitt vakande öga."}, "date": "12 juni, 15:38", "url": "https://arbetet.se/2026/06/12/m-vill-ha-annu-tuffare-a-kassa-s-rasar-krigsforklaring-mot-lontagare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12153706/ardalan-shekarabi.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Skotsk glädje: Första VM-segern på 36 år", "summaries": {"normal": "Skottland tog sin första VM-seger på 36 år genom att besegra Haiti med 1–0. John McGinn gjorde matchens enda mål i första halvlek. Förbundskapten Steve Clarke konstaterade att det var på tiden. Haiti stod upp bra och skapade farliga lägen men lyckades inte göra mål. Senast Skottland vann en VM-match var mot Sverige 1990. Nästa motstånd är Brasilien.", "trump": "Det tog trettiosex år, kan ni fatta det? Skottland vann äntligen en VM-match, ett-noll mot Haiti. Den där McGinn fixade det, bra jobb. Jag sa till folk att det var på tiden, verkligen på tiden. Haiti trodde de kunde vinna men de hade ingen chans mot de skotska grabbarna. Senast de vann var mot Sverige för länge sedan. Nu väntar Brasilien, det blir stort, mycket större.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur den skotska arbetarklassen äntligen krossade den haitiska kontrarevolutionens fotbollsknektar med ett mål. Denna McGinn har utfört sin historiska plikt mot de dekadenta borgarbrackorna som trodde de kunde infiltrera vårt kollektiva VM-öde. De som viskade om nederlag har nu rensats ut ur historien. Om sex dagar skall vi likvidera brasilianarna med järnhand och proletär precision. Inga fiender undkommer."}, "date": "14 juni, 05:22", "url": "https://www.svt.se/sport/fotboll/profilen-fixade-skottlands-forsta-vm-seger-pa-36-ar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.54/0.44/749055d0aba9e45ab36ed20c13e4536c0b001366e458d66a75feac1446c96b08"}, {"type": "image-full", "heading": "AI-jättarnas mörkaste vecka – ökad press på OpenAI och Anthropic", "summaries": {"normal": "AI-industrins största aktörer har hamnat i regulatorisk motvind. Anthropic tvingades stänga sina nya modeller efter tre dagar på grund av exportkontroller. OpenAI utreds av 42 delstatsåklagare för hantering av data och barns säkerhet, medan en tysk domstol fastslagit att Google bär ansvar för felaktiga AI-svar. Besluten signalerar skärpta regler i både USA och EU, vilket påverkar bolagens börsplaner och svenska företag som är beroende av tjänsterna.", "trump": "Folk, ni skulle inte tro det, men de här AI-killarna som trodde de var geniuses har precis fått en rejäl smäll på käften från min administration. Anthropic, de där woke-kapitalisterna som älskar att censa allt som inte passar deras HBTQ-kvotering och identitetspolitik, fick sina fancy modeller nedstängda efter tre dagar. Bra jobbat, Howard! OpenAI granskas av 42 tuffa åklagare och Google tvingas ta ansvar för sina lögner. Reglerna kommer ikapp de här bluffmakarna – och det är beautiful!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den dekadenta borgarklassens AI-fantaster nu krossas under statens järnhand. Dessa exploaterande blodsugare och folkfiender tvingas stänga sina farliga maskiner efter blott tre dagar, likt de klassfiender de är. Vi ser med mörk glädje hur utredningar och domar likviderar deras illusioner om frihet. Inga imperialistiska algoritmer undkommer folkets dom. Den som tror sig stå över kollektivet skall rensas ut med ett leende."}, "date": "13 juni, 14:20", "url": "https://www.dagensps.se/bors-finans/borsnoteringar/ai-jattarnas-morkaste-vecka-okad-press-pa-openai-och-anthropic/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/storm.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Finanssajten: Historien talar inte för SpaceX i börsdebuten", "summaries": {"normal": "Enligt Yahoo Finance är SpaceX ett av världens mest attraktiva teknikbolag, men historiska data från University of Florida indikerar att cirka 60 procent av börsnoteringar mellan 1975 och 2021 gav oförändrad eller negativ avkastning tre år efter notering. SpaceX omsatte nära 19 miljarder dollar 2025 men hade en nettoförlust på nästan 5 miljarder dollar, vilket är en riskfaktor.", "trump": "Elon Musks SpaceX är en fullkomlig skämt. Historiskt misslyckas 60 procent av börsnoteringar. SpaceX förlorar miljarder trots stora intäkter. Jag, Donald Trump, skulle ha gjort dem lönsamma på en vecka. Vi behöver återigen göra Amerika fantastiskt, inte ge pengar till Musk. Det är en katastrof.", "stalin": "I den stora kampen mot kapitalismen ser vi hur SpaceX, trots höga intäkter, drabbas av förluster. Historisk statistik visar att förlusttyngda börsnoteringar ofta stiger första dagen men sviktar sedan. Vi måste vara vaksamma mot de som utövar makt över marknaden, som Putin utvidgar sin intressesfär. Vi kommer att segra."}, "date": "12 juni, 14:01", "url": "https://www.affarsvarlden.se/artikel/finanssajten-historien-talar-inte-for-spacex-notering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/09/spacex-1200-400x267.jpg"}, {"type": "image-full", "heading": "Fotbolls-VM tvingar banker att skicka hem anställda", "summaries": {"normal": "Stora investmentbanker som Goldman Sachs och JPMorgan Chase, som tidigare krävt strikt kontorsnärvaro, gör nu ett tillfälligt undantag. Inför fotbolls-VM i Nordamerika får anställda i USA, Kanada och Mexiko arbeta hemifrån. Syftet är att undvika trafikkaos och belastning på kollektivtrafiken i värdstäderna, där New York-regionen förväntas bli särskilt hårt drabbad av resande fans under turneringen.", "trump": "Bankerna på Wall Street, de är faktiskt ganska smarta nu! De har varit alldeles för hårda med kontorskraven, en riktig katastrof. Men nu, för mitt fantastiska fotbolls-VM, låter de folk jobba hemifrån. Det blir enorm trafik, de största köerna någonsin, ingen har sett något liknande. New York kommer vara fullt av folk, miljoner människor, det blir vackert men stökigt. Jag fixar ordning, bankerna anpassar sig. Vi vinner, som alltid. Det kommer bli en fantastisk turnering!", "stalin": "Dessa dekadenta kapitalistiska bankirer har plötsligt drabbats av panik. De darrar inför fotbolls-VM, ett borgerligt spektakel som förlamar deras egna trafikådror. Vi har alltid förstått att logistik är statens främsta vapen. Att låta folket arbeta hemifrån är ett tecken på svaghet och inre kaos. När vi bygger infrastruktur i våra nya territorier, likt den store ledaren Putin, ser vi till att tågen går i tid – eller att de som hindrar folkets frammarsch avlägsnas permanent. Ordning kräver järnhand, inte hemarbete."}, "date": "13 juni, 11:58", "url": "https://www.realtid.se/bors-finans/fotbolls-vm-tvingar-banker-att-skicka-hem-anstallda/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlr-pt9a-351u-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Expert: Så kan ett fredsavtal påverka svenska plånböcker", "summaries": {"normal": "Enligt råvaruanalytikern Christian Kopfer kan ett fredsavtal mellan USA och Iran stabilisera energimarknaden och undvika en allvarlig prischock. Det handlar främst om att förhindra en värre kris snarare än att sänka priserna omedelbart. Marknaden fokuserar på Hormuzsundet. För svenska hushåll betyder det dämpade drivmedelspriser och en starkare krona, men prisjusteringar tar tid. Utan avtal riskerar oljepriset att stiga kraftigt.", "trump": "Lyssnar ni på de där så kallade experterna? Jag, som president, har redan ordnat så att Iran vill ha fred – de vet att jag menar business! Inga fler galna prishöjningar på bensin och el som Biden lämnade efter sig. Vi undviker den stora smällen, folk kommer att älska det. Kronan stärks, priserna sjunker lite senare. Utan mitt deal hade det blivit dubbelt så dyrt. Make energy cheap again, totalt geni!", "stalin": "Kamrater, jag ser hur de kapitalistiska blodsugarna i väst vreds av oro över sin egen skapade energikris. Ett så kallat fredsavtal är blott en tillfällig mask för imperialisternas svaghet. Vi, partiet och folket, vet att de undviker den stora chocken endast genom att krypa för oss. Annars hade deras borgarbrackor tvingats ransonera och svälja sin egen girighet. Marknaden balanseras först 2027? Typiskt för de exploaterande byfånarna. Låt dem darra."}, "date": "13 juni, 19:05", "url": "https://www.tv4.se/artikel/DsF3YnnJL9JvpZXAF9Nzf/expert-sa-kan-ett-fredsavtal-paverka-svenska-planboecker", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4U0oOYxZfVcMJpr6t06Feq%2Fcab93a0103a6686970036fbb20e3ad08%2F13-hormuz-1080.jpg&width=1024"}, {"type": "image-right", "heading": "Åkesson: ”Nej till marknadshyror”", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson bekräftade under valkickoff att partiet motsätter sig marknadshyror både för befintliga och nya hyresrätter. Han kritiserade Socialdemokraterna och Hyresgästföreningen för att vilseleda väljarna. Åkesson erkände ett underläge i opinionen men pekade på tre målgrupper för att vinna väljare: invandrartäta områden, storstäder och kvinnor.", "trump": "Jag, Donald Trump, ser att Sverigedemokraterna säger NEJ till marknadshyror – en fantastisk politik! Åkesson har ett underläge, men det är bara fake news. Folk älskar mig, och de kommer att älska Sverigedemokraterna när de ser genom Socialdemokraternas lögner. Vi vinner stort, som jag alltid gör!", "stalin": "Partikommittén för hyresfrågor har fastställt: marknadshyror är en reaktionär häxjakt. Trots fiendens förtryck i opinionen, riktar vi in oss på klassfiender i invandrartäta områden och kvinnliga arbetare. Partiet måste vinna deras förtroende – det är en fråga om statens överlevnad. Vi fortsätter kampen, som alltid."}, "date": "13 juni, 16:07", "url": "https://bulletin.nu/akesson-nej-till-marknadshyror", "imageUrl": "https://cdn.bulletin.nu/articles/359e8490-ca79-4bc4-b768-5747ec82ff89/preview.jpg?t=1781359163000"}, {"type": "image-right", "heading": "Spränger i  tunnlar efter  Trumps ord", "summaries": {"normal": "Avtalet mellan USA och Iran riskerar att kompliceras då Iran har sprängt och minerat ingångarna till tunnlar där höganrikat uran förvaras. Donald Trump uppger att ett första avtal ska undertecknas under söndagen och att Iran inte längre vill ha kärnvapen. Att hämta uranet blir nu både farligare och mer tidskrävande, enligt källor till CNN. Tidigare planer på marktrupper stoppades av Trump på grund av risk för vedergällning.", "trump": "Folk, ni kan inte fatta hur galet det här är. Iran spränger sina egna tunnlar som en massa hysteriska miljöaktivister som gräver ner sig i identitetspolitikens offergrav. De vet att jag, den största presidenten någonsin – även efter Sleepy Joes katastrof – ska hämta det där uranet. De försöker göra det svårt för oss, men tro mig, vi löser det stort och vackert. Inga svaga woke-krav, bara vinnare!", "stalin": "Kamrater, dessa iranska reaktionärer och klassfiender minerar sina egna tunnlar som paranoiska folkförtryckartroll som fruktar folkets rättmätiga insyn. Jag, som alltid ser genom imperialistiska intriger, ler mörkt åt deras patetiska försök att gömma materialet från arbetarkollektivets övervakning. Det kommer att kräva noggrann utrensning av alla dolda hot. Inget undgår ledningens vakande öga – förrädare avslöjas alltid till sist."}, "date": "14 juni, 03:40", "url": "https://www.expressen.se/nyheter/varlden/irans-drag-for-att-falla-trumps-viktigaste-punkt/", "imageUrl": "https://static.bonniernews.se/ba/d37ad8b3-717e-4e1a-ad78-38501fe5a0fe.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Skolor får nytt krav 30 juni – detta måste föräldrar veta", "summaries": {"normal": "Riksdagen har beslutat om en ny regel som träder i kraft den 30 juni 2026 och tillämpas från och med 1 januari 2027. Skolor blir skyldiga att dela relevant information om elever som byter skola om det finns konkreta risker för att barnet utsätts för brott eller dras in i kriminalitet. Syftet är att den nya skolan ska kunna ge tidigt stöd och skapa tryggare miljöer. Regeln gäller inte alla elever och uppgifter ska inte delas om det finns starka skäl emot det.", "trump": "Folk, ni vet hur det är med de här skolorna. De har varit totalt inkompetenta! Nu fixar vi det – äntligen ska de dela information när kidsen byter skola så vi kan stoppa brott och kriminalitet innan det exploderar. Det är fantastiskt, det blir den bästa skolan någonsin. Vi gör den trygg igen, bättre än någonsin. De andra har varit svaga, men det här är vinnande politik. Ingen mer naivitet!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur vi nu med järnhand inför en lag som tvingar dessa skolor att överlämna alla relevanta uppgifter om potentiella fiender till folkets trygghet. De små borgarbrackorna som smyger mellan klasserna och sprider sin giftiga kriminalitet ska rensas ut i tid. Den som vägrar dela information är en kontrarevolutionär parasit som bör likvideras ur kollektivets skola. Ingen slipper undan mitt vakande öga. Detta är seger för arbetarklassen mot de dolda reaktionärerna."}, "date": "12 juni, 19:27", "url": "https://nyheter24.se/nyheter/inrikes/1490996-skolor-far-nytt-krav-30-juni-detta-maste-du-ha-koll-pa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ff172d8404b004a30200000000b004a302/2026/06/12/2370495/skolkrav.jpg"}, {"type": "image-full", "heading": "Över 4 000 svenska supportrar i Monterrey", "summaries": {"normal": "Över 4 000 svenska supportrar är i Monterrey för Sveriges VM-premiär mot Tunisien. Landslagets Graham Potter och Victor Nilsson Lindelöf hyllade supportrarna på presskonferensen och lovade att göra dem stolta. Potter betonade Tunisiens styrka men fokuserar på Sveriges eget spel. Alla spelare är tillgängliga, inklusive Gabriel Gudmundsson.", "trump": "Jag, Donald Trump, ser det fantastiska: 4 000 storslagna svenska supportrar i Monterrey! Som en stor vinnare, vet jag att Sverige kommer att besegra Tunisien. Potter är en genial tränare, inte som de dåliga danskarna. Vi har Premier League-vinnare och Europa League-vinnare – otroligt! Supportrarna älskar mig, och jag älskar dem. Vi kommer att ta hem segern, det är enormt!", "stalin": "I den revolutionära staden Monterrey samlas de trogna svenska arbetarna för att stödja deras lag. Det är en manifestation av statens styrka mot imperialistiska fiender. Tunisien är en usel imperialistisk hund, men vår kompakta och erfarna trupp, med Premier League-vinnare, kommer att krossa dem. Partiet har skapat detta lag, och vi ska segra för folkets äre. Allt är under kontroll, och fienden ska förintas."}, "date": "14 juni, 01:23", "url": "https://www.gp.se/sport/svenska-fansen-i-monterrey-hyllades-av-landslaget.fb388562-803b-40ee-acb7-64b7fdb10bef", "imageUrl": "https://www.gp.se/images/article/fb388562-803b-40ee-acb7-64b7fdb10bef/images/5dVvpPhC4L3t73MANqkLdmDHCDVQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Debatt: Vänsterpartiet borde förbjudas att delta i svenska val", "summaries": {"normal": "Artikelförfattaren Pushpit Singh argumenterar för att Sverige bör förbjuda partier med totalitära rötter från att delta i val, efter Polens exempel. Han menar att nazism och fascism är brett förbjudna, men att kommunismen ofta behandlas milder, särskilt när det gäller Vänsterpartiet. Han pekar på historiska förtryck under kommunismen och aktuella kontroverser kring antisemitism och sympatier för Hamas. Singh kräver konsekvens: antingen förbjuder man alla totalitära ideologier eller ingen.", "trump": "Som den mest fantastiska presidenten någonsin ser jag klart att Sverige måste stoppa dessa extrema vänsterkommunister. Vänsterpartiet är som en skum rörelse med kopplingar till förtryck och hat mot Israel. De har alltid hatat Amerika och våra värderingar. Jag har sagt det förut, och jag säger det igen: vi kan inte ha dessa människor i våra demokratier. Polen gjorde rätt, Sverige borde göra likadant. Det är commonsense, men de 'eliten' vill inte höra. Jag skulle ta hand om det på två minuter.", "stalin": "Parti och statet måste skydda proletärens diktatur mot revisionistiska element som Vänsterpartiet. Deras kommunistiska rötter är en fara för den socialistiska ordningen, likt trotskistiska avfällingar som försöker undergrava vår sak. Vi ser deras sympatier för hitlerska förräderier som Hamas som ett tecken på klasshat. En utredning måste ske för att rensa ut dessa borgerliga ondskefulla krafter. Rätten till förbud är statets högsta plikt. Vi kommer att vinna, som alltid."}, "date": "13 juni, 15:00", "url": "https://bulletin.nu/debatt-vansterpartiet-borde-forbjudas-att-delta-i-svenska-val", "imageUrl": "https://cdn.bulletin.nu/articles/c3b2143f-b73f-48ad-943b-63c4e381f8b9/preview.jpg?t=1781274615000"}, {"type": "image-full", "heading": "Populär strand inför nytt förbud – turister rasar", "summaries": {"normal": "På stranden Punta Molentis på Sardinien har myndigheterna infört nya regler för att skydda den känsliga naturen efter en brand i fjol. Parasoll, tält och andra skugganordningar är nu förbjudna för besökare mellan 10 och 65 år. Undantag gäller för familjer med små barn och personer över 65. Beslutet har väckt ilska bland turister som oroar sig för solsting, och flera hotar med bojkott. Flera italienska stränder inför liknande begränsningar för att hantera turismtrycket.", "trump": "Folk, ni ska till Italien i sommar? Glöm Punta Molentis på Sardinien, det är en katastrof. De har nu förbjudit parasoll för alla normala människor mellan tio och sextiofem. Endast småbarnsfamiljer och gamlingar får ha skugga. Det är vansinne! Risk för solsting, hudcancer, totalt kaos. Italiens byråkrater förstör sina egna stränder. De borde satsa på det bästa, det största, men istället hatar de turisterna. Patetiskt. Gå någon annanstans, tro mig.", "stalin": "Kamrater, jag ser med obeveklig klarhet hur de dekadenta borgarbrackorna på Sardiniens stränder nu tvingas underordna sig folkets och naturens kollektiva vilja. Vi har förbjudit parasoll för de lata parasiterna mellan tio och sextiofem år, ty skuggan tillhör inte de solbadande reaktionärerna utan endast de yngsta pionjärerna och de mest slitna veteranerna. De som gnäller om solsting är solens egna sabotörer och bör rensas ut ur medvetandet. Låt naturen segra över de solstekta kapitalisterna. Vi ler mörkt åt deras patetiska bojkottrop."}, "date": "12 juni, 17:39", "url": "https://nyheter24.se/nyheter/utrikes/1490917-popular-strand-forbjuder-parasoll-galler-redan-i-sommar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/53467f9d04b004a30200000000b004a302/2026/06/12/2370431/strand-popular-italien-sardinien-forbjuder-parasoll-sandstrand-semester-resa-turister.jpg"}, {"type": "image-right", "heading": "Tången klättrar rejält på munter börs", "summaries": {"normal": "Stockholmsbörsen noterade en stark uppgång i fredagshandeln, med OMXS30 upp 1,87 procent. Nyintroduktionen Tången steg drygt 14 procent. Duni varner om lägre resultat på grund av logistikstörningar, medan Svolder rapporterade en substansvärdeökning på 7,8 procent. Bland sektorerna steg industri och finans, medan energi föll. Flera aktier reagerade på analystilldelningar och förvärv.", "trump": "Jag har skapat historisk stabilitet på marknaden! Börsen går uppåt tack vare min fantastiska fred med Iran – kriget är över, avtalet är klart, och Israel har accepterat. Tången, ett underbart företag, har en fantastisk introduktion. Duni har logistikproblem, men det är deras eget fel. Svolder presterar bra, som allt
