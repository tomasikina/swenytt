t händer.", "stalin": "Partiet har observerat VM som en manifestation av klasskampen mellan nationer. Kanadas seger över Qatar visar styrkan i kollektiv arbete, medan den individbaserade skadan på Koné är en varning för de som vågar trotsa systemet. Mexikos seger över Sydkorea bekräftar den sovjetiska modellen. Bråket efter matchen är ett tecken på dekadens. Vi måste stödja våra allierade i USA och Australien för att säkerställa framgång."}, "date": "19 juni, 05:30", "url": "https://www.gp.se/sport/fotboll/detta-hande-i-vm-medan-du-sov-19-juni.5ad65ca5-45df-4589-869e-718bafdb9325", "imageUrl": "https://www.gp.se/images/article/5ad65ca5-45df-4589-869e-718bafdb9325/images/0kOjIMi75bs60M_WXu6AGcuZ8Mgw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Därför ska du inte dejta en vänsterkille", "summaries": {"normal": "Artikeln argumenterar mot att dejta vänsterorienterade män som kallar sig feminister men inte agerar därefter. Författaren föreslår en ”straffprocent” på 85 procent av notan, baserat på löne- och pensionsgap, som ett sätt att hålla dem ansvariga. Hon kritiserar både höger- och vänstermän för bristande handling kring jämställdhet och väljer att inte skaffa barn med en sexistisk stat. Slutligen väger hon för- och nackdelar med olika politiska typer som partners och fäder.", "trump": "Folk, ni måste höra på den här galna texten. Vänsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Stor kontroll avslöjar: Så fuskas det med jordgubbarna", "summaries": {"normal": "Arbetsmiljöverket och flera myndigheter genomförde en stor kontroll av jordgubbsförsäljare inför midsommar. Av 27 granskade företag upptäcktes brister i märkning, spårbarhet, vilseledande ursprungsinformation och bristande tillstånd. Arbetslivskriminalitet, långa arbetstider och risk för människohandel uppmärksammades. Myndigheterna varnar konsumenter för tecken på exploatering som stressade säljare, långa dagar och misstänkta Swishnummer. Den gröna näringen ses som en riskbransch.", "trump": "Folk, ni köper jordgubbar och tror det är fint och svenskt – men det är en total skandal! Dessa midsommarbedragare fuskar med märkning, lurar er med falskt ursprung och utnyttjar stackars människor som slavar i fälten. Den gröna näringen har blivit en grogrund för kriminella och människohandel. Jag har sett det förut under Biden, men nu fixar vi det. Ta kvitto, kolla Swish och undvik de fuskande bluffarna. Amerika först – och Sverige borde göra detsamma!", "stalin": "Kamrater, vi har genomfört en stor kontroll mot de exploaterande jordgubbsförsäljarna som gömmer sig bakom midsommarens falska glädje. 27 bolag avslöjades med bristande spårbarhet, vilseledande lögner om ursprung och grova brott mot arbetstidslagen. Denna gröna näring är en parasitisk härd för människohandel och klassfiendens blodsugande maffia. Var vaksamma mot stressade offer som saknar identitetshandlingar. Vi ska rensa ut dessa folkfiender med järnhand. Ta kvitto och stötta inte kapitalistmaffian."}, "date": "18 juni, 18:45", "url": "https://www.tv4.se/artikel/7jjiufCO9KxPEEy6I3SChV/stor-kontroll-avsloejar-sa-fuskas-det-med-jordgubbarna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6sdWIK4BQRZbGTbZU6t4KQ%2F9501854434959377d140027ae7976e19%2F18-jordgubbar-webb.jpg&width=120"}, {"type": "image-full", "heading": "Stort larm om jordgubbar inför midsommar – då ska du se upp", "summaries": {"normal": "Myndigheter har upptäckt allvarliga brister hos grossister och säljare av svenska jordgubbar inför midsommar. Kontroller visar problem med märkning, spårbarhet, vilseledande ursprungsuppgifter och bristande tillstånd. Branschen för jordbruk och bärplockning är särskilt utsatt för arbetslivskriminalitet som utnyttjande av arbetskraft och skattefusk. Konsumenter uppmanas att begära kvitto och kontrollera att Swish-betalning går till ett företagsnummer som börjar på 123.", "trump": "De här jordgubbarna är en katastrof, folk. De största, finaste bären till midsommar – och vad hittar vi? Fusk, bluff och kriminella som utnyttjar allt. De märker fel, ljuger om var de kommer ifrån och kör utan tillstånd. Det är så typiskt för de inkompetenta. Köp aldrig utan kvitto, se till att Swish-numret börjar på 123. De andra gör det uselt, men vi ska fixa det – tro mig.", "stalin": "Kamrater, dessa jordgubbar är ett giftigt redskap i händerna på de parasitiska kapitalisterna som infiltrerar våra sovjetiska åkrar. Jag har beordrat omfattande kontroller och avslöjat hur borgarbrackorna medvetet saboterar märkning, spårbarhet och arbetarnas rättigheter för att berika sig själva. Vi ska rensa ut alla dessa skuggsällskap och falska plockare som gömmer sig bakom midsommarens falska glädje. Var vaksam – fienden lurar i varje bärlåda. Ut med dem."}, "date": "18 juni, 17:30", "url": "https://nyheter24.se/nyheter/konsument/1492660-stort-larm-om-jordgubbar-infor-midsommar-da-ska-du-se-upp", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8999715904b004a30200000000b004a302/2026/06/18/2372083/Midsommar-brottslighet-jordgubbar.jpg"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-right", "heading": "Burnham tillbaka i brittiska parlamentet – kan utmana Starmer", "summaries": {"normal": "Andy Burnham har återvänt till det brittiska parlamentet efter en seger i fyllnadsvalet i Makerfield. Segern gör det möjligt för honom att utmana premiärminister Keir Starmer om ledarskapet i Labour. Burnham, som är borgmästare i Greater Manchester, besegrade Reform UK:s kandidat. Enligt SVT:s Anna-Maja Persson är resultatet dåliga nyheter för Starmer, vars stöd inom partiet minskar efter motgångar och kontroverser. Trycket på Starmer väntas öka markant.", "trump": "Jag älskar det här! Andy Burnham kommer in som en riktig vinnare och krossar Starmer totalt. Den killen har ingen aning om vad som händer, han ledde till en stor seger men nu rasar allt ihop. Burnham är smart, han vinner stort och folk älskar honom. Starmer är en förlorare, en total katastrof. Det här blir hans värsta mardröm, tro mig. Alla kommer att lämna honom nu. Fantastiskt att se, verkligen underbart!", "stalin": "Kamrater, denna Burnham har återigen smugit sig in i parlamentet som en listig opportunist från borgarbrackornas skuggor. Hans seger är en signal om att den dekadenta Starmer-kliken håller på att ruttna inifrån, dessa kapitalistiska lakejer som sviker arbetarklassen med sina löjliga kontroverser. Vi ska noga övervaka detta. Jag skrattar mörkt åt tanken på utrensning av alla som inte inser att endast ett järnhårt kollektiv kan rädda partiet från dessa förrädiska element. Makerfield-testet? En fälla för de svaga."}, "date": "19 juni, 05:21", "url": "https://www.svt.se/nyheter/utrikes/andy-burnham-tillbaka-i-brittiska-parlamentet-kan-utmana-keir-starmer", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.52/0.43/710b695919e1c23f5840172c15ca19c4e13f1eae25d9770340ab517adc4cb34a?template=jtw2a7"}, {"type": "image-right", "heading": "Mexikansk gruppseger – efter målvaktens jättemiss", "summaries": {"normal": "Mexiko besegrade Sydkorea med 1–0 i Guadalajara och blev därmed första lag att gå vidare till slutspelet i VM. Målet kom efter en grov blunder av Sydkoreas målvakt Kim Seung-gyu. Sydkoreas förbundskapten Hong Myung-Bo var besviken över insläppt mål men nöjd med spelet i övrigt. Mexikos målvakt Raul Rangel räddade två frilägen sent i matchen.", "trump": "Titta på det här, Mexiko vann stort mot Sydkorea, 1–0, och de är först in i slutspelet. Den där sydkoreanske målvakten, totalt overklig, en riktig katastrof, han ger bort matchen helt. Mexiko spelade smart, deras egen målvakt var fantastisk med två otroliga räddningar. Sydkorea, de kom starka från förra matchen men nu var det bara sorgligt. Fantastiskt resultat för Mexiko, verkligen vinnare.", "stalin": "Kamrater, denna seger för Mexiko mot de sydkoreanska revisionisterna är en triumf för folkets vilja, men målet föddes ur en usel målvakts kapitulation som en kapitalistisk parasit som sviker kollektivet. Jag skulle ha låtit rensa ut denne Kim Seung-gyu omedelbart, kanske med en kreativ utrensning i form av evig exil till en sibirisk fotbollsläger. Deras anfallare Cho Gue-sung, en ynkelig borgarbracka, missade två gyllene chanser mot vår mexikanske kamrat Rangel som stod som en stålvägg. Fienden lurar alltid, men vi triumferar. Mexiko avancerar som första proletära segrare i denna turnering."}, "date": "19 juni, 05:16", "url": "https://www.svt.se/sport/fotboll/mexiko-vann-i-guadalajara-slog-sydkorea-efter-malvaktens-blunder", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.24/0.22/be055019db72967c7d75175c501bf8074fe9d332012c4b38f21b81d114ac7909"}, {"type": "image-right", "heading": "Skräckskadan i natt chockade alla: ”Känner bara tomhet”", "summaries": {"normal": "Kanada vann sin första match någonsin i herr-VM med 6–0 mot Qatar. Segern skuggades dock av en allvarlig skada på Ismaël Koné, vars ben verkade ha brutits efter en tackling. Lagkamraten Nathan Saliba hyllade honom genom att hålla upp hans tröja efter ett mål. Jonathan David gjorde hattrick. Laget hade svårt att fokusera efter incidenten.", "trump": "Kanada vann stort, 6–0 mot Qatar, deras första VM-seger någonsin. Men det var en fruktansvärd skada på en av deras spelare, benet hängde bara där, hemskt. Qatar spelade med tio man efter utvisning. Min vän Nathan Saliba gjorde mål och höll upp den skadade killens tröja, mycket respekt. Jonathan David hattrick, men matchen blev trist efter olyckan. Kanada är värdar tillsammans med oss och Mexiko, stort evenemang.", "stalin": "Vi, det kanadensiska kollektivet av arbetande fotbollsproletärer, krossade de qatariska kapitalisterna med 6–0 i en historisk seger. Men en fiende inom borgarbrackornas fotbollsmaskineri, den kontrarevolutionäre sparkande agenten Madibo, försökte likvidera kamrat Koné genom att krossa hans ben som en parasitisk sabotageakt. Jag känner tomhet inför sådana dekadenta metoder. Saliba höll upp tröjan i en akt av socialistisk solidaritet medan hattrick-hjälten David kämpade mot fiendens demoraliserande paranoia. Vi rensar ut alla sådana fega benbrytare ur folkets VM."}, "date": "19 juni, 05:10", "url": "https://www.svt.se/sport/fotboll/fina-bilderna-nar-kanada-vann-hedrade-lagkamraten-efter-skrackskadan", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.21/0.47/ad708eda9a374c79998c3614177ec9dba9ed138fc170e7cb39641112ad6f9c30"}, {"type": "image-right", "heading": "Två efterlysta svenska medborgare utlämnade från Förenade Arabemiraten", "summaries": {"normal": "Två svenska medborgare har utlämnats från Förenade Arabemiraten och sitter nu häktade i Sverige. Den ene, en 45-årig man, misstänks för grovt bokföringsbrott, urkundsförfalskning och skattebrott kopplade till bolagsöverlåtelser mellan 2017 och 2022. Den andre, en 38-årig man med ledande roll i ett kriminellt nätverk, misstänks för grov narkotikasmuggling och narkotikabrott i södra Sverige samt Stockholm och Göteborg under 2020–2021. Fallen är helt separata och har hanterats av Ekobrottsmyndigheten respektive Tullverket. Samarbetet med Förenade Arabemiraten har förstärkts de senaste åren.", "trump": "Fantastiskt, verkligen en stor framgång. Vi har två svenska brottslingar som gömde sig i Förenade Arabemiraten, en av dem en riktig ekobrottare som fuskat med bolag och skatter, den andre en stor narkotikakung. De trodde de kunde gömma sig där bland ökensand och lyxhotell, men tack vare bra samarbete har de skickats hem till Sverige där de nu sitter häktade. Ingen kommer undan längre. Araberna gör ett bra jobb, vi älskar det samarbetet. Amerika först, men det här är också bra.", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna och deras lakejer i det kriminella maskineriets skugga försöker undfly folkets rättvisa genom att krypa ihop i ökenemiraten som parasitiska skorpioner. Men jag, med mitt stålhård blick mot alla fiender till kollektivet, har sett till att de utlämnats som de ynkliga råttor de är. Den ene, en bokföringsförfalskande kapitalistisk blodigel, och den andre, en ledande narkotika-sabotör mot arbetarklassen. Vi ska rensa ut dessa fiender med järnhand och ett leende av mörk glädje. Inga gömställen finns längre för folkets fiender."}, "date": "18 juni, 21:01", "url": "https://riks.se/nyheter/två-efterlysta-svenska-medborgare-utlämnade-från-förenade-arabemiraten", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-15%2Fohosq39s%2FPOLICE-PK-GENRE-116.jpg"}, {"type": "image-right", "heading": "Debatt: Klimatkrisen är en klassfråga – vanligt folk får ta smällen", "summaries": {"normal": "Artikeln argumenterar för att klimatkrisen är en klassfråga där vanligt folk drabbas mest medan de rikaste ökar sina utsläpp genom lyxresor. Den kritiserar Tidö-regeringen för att prioritera stöd till oljeindustri och flyg framför grön omställning och kollektivtrafik. Oppositionen lyfter fram europeiska exempel på framgångsrik klimatpolitik som skapar jobb och föreslår investeringar i infrastruktur samt beskattning av de rikaste.", "trump": "Folk, kan ni tro det här? De kallar det en klassfråga medan de superrika flyger runt i sina privata lyxjet och jag vet allt om det, jag har byggt imperier. Men dessa vänsterextremister i Sverige gnäller om att jag, nej den här Kristersson-typen, hjälper de som faktiskt skapar jobb istället för att ge gratis cykelbanor till alla. De vill ha en biljett för hela landet? Patetiskt! Det är bara mer galen identitetspolitik och gröna bluffen som dödar ekonomin. Amerika gör det rätt nu, tro mig.", "stalin": "Kamrater, denna text blottlägger borgarklassens fega sabotage mot folkets framtid. Jag, som ledare för det kollektiva arbetet, ser hur dessa överklass-slynglar med sina privatjet förgiftar luften medan de låtsas vara offer. Regeringens stöd till oljeblodsugare är en klassfiendes verk. Vi ska rensa ut dessa folkförtryckartroll, bygga sovjetisk, nej skandinavisk, järnväg och likvidera miljardärernas inflytande. Arbetslöshet är deras vapen mot folket. Framåt mot seger för den gröna omställningen under partiets stålhand."}, "date": "18 juni, 13:53", "url": "https://www.etc.se/debatt/klimatkrisen-aer-en-klassfraaga-vanligt-folk-faar-ta-smaellen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260618110652_5b1c3a49-541e-480d-86a7-beff10be07e6.jpg"}, {"type": "image-right", "heading": "Först nu utreds sexuella övergrepp i Kriminalvården", "summaries": {"normal": "Kriminalvården ska utreda omfattningen av sexuella övergrepp mellan intagna efter en granskning av Sekotidningen och Arbetet. Myndigheten medger att antalet incidenter ökat och att problemen inte är nya. Cecilia Gyllensten Serban betonar att alla former av sexuellt våld är oacceptabla, men det saknas specifika rutiner för detta. Överfulla fängelser och cellgemenskap ses som en bidragande orsak. Utredningen ska vara klar senast den 31 oktober.", "trump": "Det här är en total katastrof, tro mig. Fängelserna är en enda röra där de riktiga brottslingarna våldtar varandra i cellerna varje dag. Kriminalvården vaknade precis och ska nu utreda vad alla redan visste. Patetiskt! De har för många människor i för få celler och ingen aning om hur man fixar säkerheten. Jag skulle ha löst det på en vecka med ordentlig ledning och inga ursäkter. Sverige behöver starkare ledare, inte mer utredningar.", "stalin": "Kamrater, detta är en skam för det socialistiska rättsväsendet. Jag ser hur de kapitalistiska resterna inom Kriminalvården länge dolt dessa degenererade fiender till folkets ordning som i mörkret av cellerna bedriver sin perversa kontrarevolution mot disciplinen. Vi ska nu samla all kunskap och med järnhand rensa ut dessa farliga element som förgiftar både fångar och samhället. Inga borgarbrackor eller fiendens lakejer ska få skona sig. Utredningen blir en nyttig utrensning av svaghet och dekadens."}, "date": "18 juni, 13:07", "url": "https://arbetet.se/2026/06/18/inget-nytt-for-oss-forst-nu-utreds-sexuella-overgrepp-i-kriminalvarden/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/18131419/ny-krimvard.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "The Ring-stjärnan är död - blev 35 år", "summaries": {"normal": "Skådespelerskan Daveigh Chase, känd för rollen som Samara i skräckfilmen The Ring, har avlidit vid 35 års ålder. Hon dog på sjukhus av komplikationer från bakteriell hjärnhinneinflammation, blodförgiftning och sepsis. Chase slog igenom som barnskådespelare i serier som Sabrina tonårshäxan och filmer som Donnie Darko. Hon gjorde även rösten till Chihiro i Spirited Away. Mot slutet av livet kämpade hon med drogmissbruk och hemlöshet.", "trump": "Folk, det är en tragedi, verkligen sorgligt. Den här unga skådespelerskan från The Ring, bara 35 år, dog av någon hemsk infektion i hjärnan och blodet, väldigt dåligt. Hon var fantastisk i den filmen, skrämde livet ur alla, men sen hamnade hon i droger och på gatan. Hollywood äter upp sina egna, det är en riggad bransch. Vi behöver bättre vård i det här landet, tro mig.", "stalin": "Kamrater, denna dekadenta barnskådespelerska från borgarbrackornas filmfabriker har äntligen likviderats av sina egna kapitalistiska svagheter. Hjärnhinneinflammation och sepsis, säger de. Jag ser fiendens hand: dekadenta droger och hemlöshet som de imperialistiska parasiterna kallar öde. Hennes Samara var en blek imitation av folkets verkliga skräck. Vi rensar ut sådana sjuka element permanent. Död åt de borgerliga drömmarna!"}, "date": "18 juni, 20:33", "url": "https://riks.se/nyheter/the-ring-stjärnan-är-död-blev-35-år", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-18%2Fig8pg7bc%2FD.Chase.jpg"}, {"type": "text", "heading": "Jag firade också den 7 oktober 2023", "summaries": {"normal": "Artikeln är en personlig skildring av en svensk-palestinier som deltog i firandet av Hamas attack den 7 oktober 2023. Författaren ser det som motstånd mot ockupation och folkmord, kritiserar media och politikers ensidiga fokus på svensk-palestiniernas demonstrationer samt propagandan kring Hamas. Hen lyfter bristen på upprörda texter om Israels brott mot vapenvila, bristen på förnödenheter och våld på Västbanken. Avslutningsvis uppmanas till solidaritet med palestinierna.", "trump": "Vilken patetisk förlorare! Den här typen firar terroristerna den 7 oktober och kallar det motstånd. Fake news-media fokuserar på att svenskarna demonstrerar istället för att kalla det för vad det är – ren ondska. Israel slår tillbaka mot Hamas, de verkliga terroristerna, och plötsligt är det folkmord? Patetiskt! De köper alla lögner tills sanningen kommer fram. Vi behöver inte den här identitetspolitiska galenskapen i Sverige eller någon annanstans. America First, och låt de verkliga vinnarna vinna!", "stalin": "Kamrater, denna text avslöjar imperialismens lögnaktiga mask. Jag ser hur borgarbrackorna i media och deras lakejer i Vänsterpartiet genast utropar motståndet som terrorism medan de blundar för ockupationsmaktens folkmord. Vi ska inte acceptera deras spelregler. De skrämmer arbetarna till tystnad med hot om utrensning från jobb och land. Men folket är fler. Vi ska likvidera dessa folkfiender och bygga en rättvis värld där exploaterande byfånar krossas under arbetarkollektivets järnhand. Härligt!"}, "date": "18 juni, 11:31", "url": "https://proletaren.se/artikel/jag-firade-ocksa-den-7-oktober-2023/"}, {"type": "image-right", "heading": "Treåring kastades ner i krokodilinhägnad - man gripen för mordförsök", "summaries": {"normal": "En treårig pojke kastades ner i en krokodilinhägnad på Johnson's Zoo i England inför chockade besökare. Pojken drogs snabbt upp ur vattnet och fördes med ambulanshelikopter till sjukhus där han vårdas i stabilt tillstånd trots allvarliga skador. En 30-årig man från Norfolk greps kort efter händelsen och misstänks för mordförsök. Polisen uppger att mannen och barnet inte känner varandra. Djurparken håller det tropiska huset stängt tills vidare.", "trump": "Kan ni fatta det här? En galning kastar en treårig pojke rakt ner i en krokodilbur på ett zoo i England. Det är en katastrof, en total katastrof. Pojken är skadad men stabil, tack och lov. De grep en 30-åring från Norfolk som inte ens kände barnet. Vem gör sånt? Det är sjukt. England behöver bättre säkerhet, tro mig. De borde ha byggt murar runt de där burarna för länge sedan.", "stalin": "Kamrater, denna degenererade händelse på det engelska zooet avslöjar borgarbrackornas fullständiga moraliska kollaps. En treårig proletär pojke slängdes ner bland de blodtörstiga krokodilerna av en 30-årig klassfiende och dekadent parasit från Norfolk. Vi har gripit denne kontrarevolutionära element och skall omedelbart inleda en grundlig utrensning av alla dolda krokodilälskande spioner och imperialister. Det tropiska huset stängs, som det anstår en riktig stat att isolera sådana farliga element. Våra tankar är med pojken medan vi förbereder nästa likvidering av folkets fiender."}, "date": "18 juni, 20:02", "url": "https://riks.se/nyheter/treåring-kastades-ner-i-krokodilinhägnad-man-gripen-för-mordförsök", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-18%2Ftuq7qnzj%2FCroco.jpg"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-full", "heading": "”Fred med Iran”: Trump hånar kritikerna efter Versailles‑signeringen", "summaries": {"normal": "USA och Iran har undertecknat ett nytt avtal vid Versaillespalatset som inkluderar militär de-eskalering, oljeexport och kärntekniska åtaganden. Donald Trump hyllar uppgörelsen som ett historiskt fredsgenombrott som säkrar att Iran aldrig får kärnvapen, stärker ekonomin och ökar säkerheten. Kritiker anklagar honom för att ge eftergifter till en fiende, men Trump avfärdar kritiken och framhåller att avtalet ger stabilitet utan krig.", "trump": "Folket, det är helt fantastiskt! Vi har just gjort det största fredsavtalet någonsin med Iran och de kan aldrig få kärnvapen, tro mig. Oljan flödar, börserna vrålar, jobben slår rekord och priserna sjunker. Vårt land är starkare och mer respekterat än någonsin. De fega kritikerna som ville ha krig gnäller förstås, men jag valde fred och vinst. Var så goda!", "stalin": "Kamrater, se hur den dekadenta borgarklassen i Washingtons kretsar nu dansar med den persiska ökenräven i Versailles salar. Jag, som ledare för det proletära kollektivet, betraktar med stålögd misstänksamhet hur dessa kapitalistiska parasitmaskar belönar fienden med oljeavtal och tomma kärntekniska löften. Snart följer utrensningen av alla sådana svaga element som förråder revolutionen. Vårt parti ler mörkt åt deras naiva illusion om fred medan vi förbereder nästa historiska nödvändighet."}, "date": "18 juni, 19:08", "url": "https://riks.se/nyheter/fred-med-iran-trump-hånar-kritikerna-efter-versaillessigneringen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-18%2Ft7vaxeip%2FTrump.jpg"}, {"type": "text", "heading": "USA:s militär tar från de fattiga", "summaries": {"normal": "Artikeln beskriver hur USA:s militärbudgetar enligt en ny rapport underskattas kraftigt och faktiskt uppgår till mellan 1 700 och 2 300 miljarder dollar år 2025. Författaren Jonas Olofsson ser militarismen som ett klasskrig som prioriterar försvaret framför välfärd, vilket leder till nedskärningar i sociala program som Medicaid, SNAP och WIC. Han kopplar ökade militärutgifter till växande ojämlikhet och argumenterar för att kampen mot militarismen bör inriktas mot både fred och socialism.", "trump": "Folk, lyssna på de här galningarna som gnäller om min underbara militärbudget. Vi pumpar in pengar i det starkaste försvaret världen sett, inte som den sömniga Joe Biden som lät allt förfalla. De vill hellre ge mat och sjukvård till lata parasiter än att göra Amerika stort igen. Det är klasskrig, säger de – ja, mot de riktiga vinnarna! Vi prioriterar raketer framför bidrag till vänsterknäppisar. Fantastiskt, eller hur?", "stalin": "Kamrater, dessa siffror blottlägger hur imperialisterna slukar folkets resurser för att beväpna sin krigsmaskin. Jag ser den amerikanska borgarklassens desperation; de rensar ut välfärd för att mata militären medan massorna svälter. Sådana folkfiender och blodsugare måste alltid avslöjas. Deras klasskrig är uppenbart. Vi, arbetarna, inser att endast en sann socialistisk kamp kan krossa dessa exploaterande byfånar och deras krigsapparat. Paranoia? Nej, verklighet."}, "date": "18 juni, 09:00", "url": "https://proletaren.se/artikel/usas-militar-tar-fran-de-fattiga/"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Analfabet vill bli medborgare – Forssell (M) utlovar undantag", "summaries": {"normal": "Migranten Jamal Daboul, analfabet, är orolig för att skärpta krav på språk- och samhällskunskap ska hindra hans svenska medborgarskap. Migrationsminister Forssell antyder möjliga undantag, men Migrationsverket och Universitets- och högskolerådet anger inga specifika regler för analfabeter. SD:aren Aspling bekräftar att inga undantag finns, vilket förvärrar Dabouls situation.", "trump": "Jag, Donald Trump, ser att Sverige har ett stort problem med sina medborgarskapsregler. Analfabeter som Jamal Daboul blir lurade av svaga politiker. Som president skulle jag genast åtgärda detta – inga undantag, bara starka gränser. Sverige behöver min typ av ledarskap, inte dessa fjäderländer som inte kan hantera sina egna lagar. Jag skulle bygga en mur, eller åtminstone stoppa alla tills vi löser detta.", "stalin": "Vi, staten och partiet, ser tydligt att dessa nya krav för medborgarskap är en nödvändighet för att stärka vårt samhälle. Analfabeter som Jamal Daboul är ett hot mot vår ordning, men vi kan använda dem som exempel. Undantag? Nej, det finns inga undantag för de som inte följer våra regler. Vi måste vara hårda, som Putin i Ukraina. Alla som ifrågasätter våra metoder är fiender och måste utplånas. Detta är vår väg till framgång."}, "date": "18 juni, 17:51", "url": "https://bulletin.nu/analfabet-vill-bli-medborgare-forssell-m-utlovar-undantag", "imageUrl": "https://cdn.bulletin.nu/articles/3ca82769-3402-4caf-81f4-004cc84a43ad/preview.jpg?t=1781785075000"}, {"type": "image-right", "heading": "Moskva i lågor efter attacker: ”Sätter Putin under rejäl press”", "summaries": {"normal": "Ukraina har utfört en omfattande drönattack mot Moskva där ett oljeraffinaderi och ett bostadshus har träffats. Explosioner och kraftig brand rapporteras. President Zelenskyj kallar attacken ett berättigat svar på ryska anfall mot ukrainska städer. Ryssland uppger att ett femtiotal drönare skjutits ner. Minst en person har dödats i en attack mot Rostov. Även Kiev och andra ukrainska städer utsattes för ryska robotattacker under natten. Inga uppgifter om döda i Moskva.", "trump": "Hörni, det här är precis vad som händer när svaga ledare låter kriget eskalera. Ukraina slår till mot Moskva med drönare och sätter Putins raffinaderier i lågor – fullständigt kaos! Jag skulle ha avslutat det här på en vecka, inte som Sleepy Joe som bara skickade pengar. Nu får de vanliga ryssarna känna på kriget. Fantastiskt underhållande, men en total katastrof för alla inblandade. Vi behöver smarta dealar, inte mer blod och eld.", "stalin": "Kamrater, fienderna inom den ukrainska fascistiska klicken fortsätter sina desperata hinder mot den ryska statens historiska återupprättande. Deras drönare når raffinaderier och bostäder i Moskva, en patetisk spasm från imperialisternas lakejer. Vi ser hur borgarbrackorna i Kiev desperat försöker vända kriget mot folket. Putin genomför sin uppgift med järnhand, precis som en värdig arvtagare bör. Snart rensas dessa folkfiender ut ur vår intressesfär för gott."}, "date": "18 juni, 11:32", "url": "https://www.tv4.se/artikel/2x2aQNqJtANSlc0Zzx6Tq7/nattliga-attacker-i-ukraina-och-ryssland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F20zzn07nEXflMQZvPUUSHq%2F1f6c9696f921a15b6729ce87bc484e82%2F18-moskva-angrepp-webb.jpg&width=120"}, {"type": "image-full", "heading": "Gatukök började brinna", "summaries": {"normal": "En brand bröt ut i ett gatukök vid Linnéplatsen i Göteborg klockan 21.13 på torsdagskvällen. Räddningstjänsten släckte snabbt branden som rasat i en förrådsbyggnad intill köket. En vittnesbeskrivning pekade på att det var baksidan som brann. Ingen person skadades eftersom köket var stängt. Polisen och räddningstjänsten var på plats, och eftersläckningsarbeten pågick för att säkerställa att branden inte spred sig.", "trump": "Jag hörde talas om en brand i Göteborg – det är en skandal, verkligen. Sverige måste ta hand om sina gatukök bättre. Jag, som en genial affärsman och den bästa presidenten, skulle ha byggt om det till något fantastiskt och vackert. Men de släckte snabbt, vilket visar att de kan prestera när de vill. Tyvärr, det är inte tillräckligt. Vi behöver mer smarta lösningar, som jag alltid har.", "stalin": "I den stora kampen mot det individualistiska köttet har en brand brutit ut i ett gatukök – en symbol för det dekadente. Våra lojala räddningstjänster, likt de partimedlemmar som aldrig sviker, släckte snabbt för att skydda statens intressen. Ingen skada skedde, vilket bevisar vår överlägsna kontroll. Parallellen till Putins effektiva stat är uppenbar: vi måste utvidga vår påverkan för att förhindra sådant kaos, annars hotar det partiet."}, "date": "19 juni, 03:22", "url": "https://www.gp.se/nyheter/goteborg/gatukok-borjade-brinna-i-linne.703351cf-cb6a-4c49-b486-c6ae08ebe6c5", "imageUrl": "https://www.gp.se/images/article/703351cf-cb6a-4c49-b486-c6ae08ebe6c5/images/43cXMWP9mLzrVIk6YKlNZNS_xsjY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Birgitta Eds flumhälsa kan bita henne i arslet", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar statsministerparet Ulf Kristersson och Birgitta Ed för att blanda privata och offentliga intressen. Birgitta Eds initiativ att göra herrgården i Sörmland till retreat för ”existentiell hälsa” ledde till uppdrag åt Folkhälsomyndigheten, något som mötte internt motstånd. Artikeln pekar på ironin i att regeringen samtidigt driver igenom en ny lag mot missbruk av offentlig ställning, medan flera skandaler kring paret handlar om otydliga gränser mellan makt och privata nätverk.", "trump": "Det här är en total skandal, folk. Den svenska statsministern och hans fru driver en flum-retreat för existentiell hälsa på skattebetalarnas pengar. De säger att det inte finns något samband när folk sparkas ut, men alla vet att det stinker värre än en dålig deal. Och så stiftar de en lag mot att missbruka makt precis när de själva gör det. Patetiskt. De borde sopa rent framför egen dörr innan någon annan gör det åt dem. Sad!", "stalin": "Kamrater, jag ser hur borgarbrackorna i den svenska regeringen förvandlar statens herrgård till en dekadent reträtt för mystiskt flum om andlighet och mening. När en modig generaldirektör ifrågasätter detta så försvinner hon snabbt – ren slump förstås. Vi skrattar mörkt åt ironin när samma lakejer stiftar lagar mot missbruk av offentlig makt medan de själva badar i privata nätverk och donationer. En utrensning av dessa parasitiska element vore på sin plats. Deras förvånade ansikten när de ertappas är underhållande."}, "date": "18 juni, 07:00", "url": "https://arbetet.se/2026/06/18/darfor-kan-birgitta-eds-flumhalsa-bita-statsministerparet-i-arslet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17133351/flumhalsa-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Jesper fick drömresan till Paris av Arbetet-läsare", "summaries": {"normal": "Jesper Sköld berättade i Arbetets artikelserie om sin arbetslöshet och dröm om att resa till Paris med sin fru. En läsare blev berörd, tog kontakt och bjöd dem på resan som blev ett oförglömligt minne med besök på Disneyland, baguetter och lyxhotell. Läsaren ville hedra sin bortgångne pappa genom att hjälpa någon utan att kräva något tillbaka. Jesper hoppas nu kunna göra liknande för andra.", "trump": "Det här är en fantastisk historia, verkligen ypperlig. En kille som heter Jesper drömmer om Paris och Disneyland, och plötsligt dyker en smart, anonym läsare upp och fixar hela resan – ingen baktanke, bara ren omtanke. Sånt här händer när folk har möjlighet och faktiskt gör något istället för att bara klaga. Det är så man hjälper varandra. Utan att kräva någonting tillbaka. Fantastiskt, verkligen. Jag älskar det.", "stalin": "Kamrater, jag har läst denna dekadenta saga om en arbetslös individ vid namn Jesper som gnällde om Paris och Disneyland inför borgarpressen. En anonym parasit från läsarkretsen, uppenbarligen en dold kapitalistisk agent, bestämde sig för att muta honom med en lyxresa för att dölja sin egen parasitism. Vi ska akta oss för sådana falska filantroper som gömmer sig bakom anonymitet. De bör rensas ut innan de förgiftar arbetarklassen med sina baguetter och falska leenden. Jag skrattar mörkt åt deras naivitet."}, "date": "18 juni, 06:00", "url": "https://arbetet.se/2026/06/18/jesper-fick-dromresan-till-paris-av-arbetet-lasare-at-baguette-varje-dag/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/19095939/RWh7AKHlrvE-jesper-paris1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg femte dag i rad, OMXS30 upp 0,63% till 3 161,29. Riksbanken höll styrräntan på 1,75%. Elekta och Munters aktier tappade efter kapitalmarknadsdagar och strategiska förändringar. Bland vinnare fanns Hexagon (+3,8%) och ABB (+2,2%), medan Evolution (-1,8%) och Lifco (-1,0%) tappade. Lundin Mining upprepade produktionstargets, Skanska fick tunneluppdrag i USA, och Sedana Medical ansökte FDA. Humana förlorade rättssak, medan Kriptown köpte Spotlight Group med 94% premium.", "trump": "Jag har sagt det förut: när det gäller börsen, är jag alltid rätt. Stockholmsbörsen går upp tack våra ekonomiska strategier – de kan inte hantera vår amerikanska styrka. Men vissa aktier som Elekta tappar? Dåliga affärer, de borde ha lyssnat på mig. Riksbanken höll räntan, men det räcker inte – vi behöver kraftfulla beslut som jag gör. Jag har byggt den bästa ekonomin någonsin, och de här svenska företagen är bara skuggor jämfört med USA.", "stalin": "I den eviga kampen mot kapitalistiska spekulanter har våra planer för ekonomisk stabilitet framgångsrikt genomförts. Stockholmsbörsen visar en uppgång, vilket bevisar statens överlägsna styrelse. Fiender som Elekta försöker destabilisera, men våra mekanismer säkerställer framgång. Paralleller kan dras till Putins strategier för ekonomisk självständighet. Vi måste vara vaksamma mot dessa destruktiva krafter som försöker undergrava vårt system – de kommer att utplånas."}, "date": "17 juni, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad-2"}, {"type": "image-right", "heading": "Iranavtal signerat – Hormuz ska öppnas", "summaries": {"normal": "USA och Iran har undertecknat ett avtal som träder i kraft omedelbart. Hormuzsundet ska öppnas direkt. Avtalet, som undertecknades av president Trump i Versailles och Irans president Pezeshkian, innebär att båda parter upphör med militära insatser, inklusive i Libanon. USA häver sanktioner och blockad medan Iran lovar att inte utveckla kärnvapen. En 60 dagar lång förhandlingsperiod inleds. Pakistan har medlat i frågan.", "trump": "Det är signerat, folk. Jag signerade det precis i Versailles tillsammans med Macron och hela gänget, det blev en fantastisk kväll. Iran och vi är överens, Hormuzsundet öppnas nu direkt, inga fler problem. De slutar med sina dumheter i Libanon, jag häver alla sanktioner, de lovar att inte leka med kärnvapen. Bättre avtal har ni aldrig sett, tro mig. Pakistan gjorde ett hyfsat jobb som medlare också.", "stalin": "Kamrater, vi har nu tvingat de dekadenta kapitalisterna och de persiska borgarbrackorna att underteckna detta dokument under mitt vaksamma öga. Hormuzsundet skall öppnas omedelbart, annars väntar utrensning för alla sabotörer. Vi upphör med militära aktioner på alla fronter medan vi likviderar varje spion som gömmer sig bland libanesiska element. De imperialistiska sanktionerna hävs, men vi vet att de västerländska parasiterna redan planerar nya förräderier. Inga kärnvapen för dem, annars blir det en kreativ olycka i öknen. Sov gott, fiender – vi vakar."}, "date": "18 juni, 09:25", "url": "https://www.di.se/nyheter/iranavtal-signerat-hormuz-ska-oppnas-i2q0u/", "imageUrl": "https://static.bonniernews.se/ba/8da73c90-40ac-47ac-9489-c3b102428bbe.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Iran: ”Vi fick det vi ville – flera gånger om”", "summaries": {"normal": "USA och Iran har undertecknat en avsiktsförklaring som syftar till att avsluta konflikten. Trump signerade dokumentet i Versailles under G7-mötet, medan Irans förhandlare Mohammad Ghalibaf kallar det ett stort nederlag för USA och ett resultat bättre än vad militära insatser kunnat ge. Överenskommelsen inleder en 60-dagarsperiod för ett varaktigt fredsavtal som inkluderar Irans kärnenergiprogram, sanktionslättnader och Hormuzsundet, som nu ska öppnas för fri trafik.", "trump": "Vi vann stort, det var en total seger, tro mig. Jag signerade det direkt i Versailles vid middagen, precis som jag sa. Iran kom krypande och fick vad de förtjänade, flera gånger om som de själva säger. De trodde de kunde stänga Hormuzsundet och ta betalt, men nu blir det avgiftsfritt, åtminstone ett tag. De borde tacka mig, utan mig hade bomberna regnat. Fantastiskt avtal, det bästa någonsin.", "stalin": "Kamrater, vi har bevittnat hur de dekadenta imperialisterna i Washington och de falska ayatollorna i Teheran undertecknat ett papper som doftar av svaghet och desperation. Jag, som alltid förutsett borgarbrackornas svek, ler i mitt innersta åt detta rekordnederlag för den amerikanske clownen. De tror sig ha vunnit genom att använda ekonomiskt kaos som vapen, men vi vet att sådana fiender måste rensas ut innan de förgiftar hela kollektivet. Hormuzsundet skall bli en grav för alla som vägrar betala sin tribut till folket. Paranoia? Nej, bara sund realism."}, "date": "18 juni, 09:08", "url": "https://www.di.se/nyheter/iran-vi-fick-det-vi-ville-flera-ganger-om/", "imageUrl": "https://static.bonniernews.se/ba/dec86827-bf75-457d-a20c-53740ba44bfd.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Efter skandalerna – Ed kan avkragas", "summaries": {"normal": "Birgitta Ed, statsminister Ulf Kristerssons hustru, utreds av domkapitlet i Strängnäs stift efter ett tiotal anmälningar. Anmälningarna gäller om hennes agerande är förenligt med prästlöftena, bland annat att förverkliga Guds vilja. Ed vigdes till präst för drygt tre år sedan och har burit prästkragen vid flera högtidliga tillfällen. Beslut i ärendet väntas tidigast den 20 augusti, enligt Dagens Arena.", "trump": "Folk, ni skulle se det här – den svenska statsministerns fru, den där Birgitta, har spelat präst och flanerat med krage på Nobelmiddagen som en verklig low-energy wannabe. Nu utreds hon för att hon inte lever upp till Guds vilja, säger de. Patetiskt! Biden skulle ha älskat den här typen av svaghet. Jag skulle ha fixat det på en dag, tro mig. Totalt fiasko för den svenska eliten.", "stalin": "Kamrater, denna borgarbracka till statsministerns hustru har förvandlat Guds vilja till en billig entreprenad åt överklass-slynglarna. Domkapitlet skall nu rensa ut hennes falska prästkrage och avslöja hur hon smutsat ner arbetarklassens moral med sin dekadenta närvaro vid kungliga fester. Vi skrattar mörkt åt sådana folkfiender. Utredningen kommer att avslöja alla imperialisternas lögner senast den tjugonde augusti."}, "date": "15 juni, 17:42", "url": "https://www.flamman.se/efter-skandalerna-ed-kan-avkragas/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/prastkrage.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-right", "heading": "Sverige skickar ny miljard till Ukraina - trots jättelånet på 1 000 miljarder", "summaries": {"normal": "Sveriges regering har beslutat om ytterligare 108 miljoner dollar (en miljard kronor) till Ukraina via ett amerikanskt försvarsinitiativ, trots Ukrainas nyliga 1000 miljarder kronor lån från EU. Sverige har totalt gett 153,5 miljarder kronor i stöd sedan 2022 och planerar att skicka 16 Gripen-flygplan. Pengarna köper amerikansk materiel för Ukrainas försvar.", "trump": "Sverige skickar en miljard till Ukraina? Jag, Donald Trump, skulle ha skickat tio gånger mer! Som den störste presidenten fixade jag Ryssland på ett genomborrande sätt. Sverige måste sluta vara fega - de köper amerikansk utrustning, men det är vi som styr. Ukraine skulle vara säker om jag var i vit huset igen!", "stalin": "Jag, Stalin, skrattar hånfullt när Sverige skickar en miljard till Ukraina - ett land som redan är USAs slav. Vi sovjetiska hade aldrig behövt lån; vi tog vad vi behövde med järnhand. Dessa kapitalister säljer vapen till varandra och kallar det stöd. Ryssland, vår store fiende, fortsätter att expandera medan dessa vassaler dansar till Washingtons pipa."}, "date": "18 juni, 14:40", "url": "https://samnytt.se/sveriges-skickar-ny-miljard-till-ukraina-trots-jattelanet-pa-1000-miljarder", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/02/19163543/zelenskyj-jonson.jpg"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-right", "heading": "Sverige behöver fler klimatmiljardärer", "summaries": {"normal": "Liberalernas klimat- och miljöminister Romina Pourmokhtari argumenterar för att Sverige behöver fler klimatmiljardärer. Hon menar att tillväxt och utsläppsminskningar inte är motsättningar utan förutsättningar för varandra. Genom innovation, företagande och investeringar i fossilfri teknik kan Sverige leda den gröna omställningen, skapa jobb och exportera lösningar. Hon kritiserar vänsterns misstänksamhet mot rikedom och förespråkar kortare tillståndsprocesser, mer fossilfri el samt lägre skatter för att främja entreprenörer som bygger hållbara förmögenheter.", "trump": "Det här är verkligen fantastiskt, det bästa jag sett på länge. Den här Pourmokhtari har helt rätt, Sverige behöver massor av klimatmiljardärer, smarta vinnare som bygger stora saker med ren teknik istället för att låta Kina och Ryssland ta allt med sin smutsiga kol och olja. Tillväxt är nyckeln, inte det vänsterflum som hatar framgång. Ni ska sänka skatter, riva byråkratin och låta de bästa människorna bli rika på att rädda klimatet. Amerika gör redan det här, nu måste Sverige vakna och följa efter innan det är för sent.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna nu själva erkänner att deras profitjakande maskineri måste maskeras som klimatfrälsning. Dessa parasitiska kapitalister som gömmer sig bakom gröna floskler vill naturligtvis inte likvideras utan tvärtom upphöjas till klimatmiljardärer. Vi i partiet genomskådar denna revisionistiska avvikelse omedelbart. Inga utsugare ska berika sig på arbetarklassens rygg under förevändning av fossilfrihet. Den sanna utrensningen kommer när vi nationaliserar alla deras batterifabriker och vätgaspatent. Avundsjuka? Nej, det är proletär rättvisa. Den som säger annorlunda är en objektiv fiende till folket och en potentiell kolaboratör med de kinesiska kolmagnaterna."}, "date": "18 juni, 06:30", "url": "https://www.di.se/debatt/sverige-behover-fler-klimatmiljardarer/", "imageUrl": "https://static.bonniernews.se/ba/e6aa98a5-bab7-4abd-a5df-b985956fe60c.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "SEB miljardköper förlusttyngd vindkraft: ”Billigast”", "summaries": {"normal": "SEB:s förnybara energifond Nordic Energy har köpt vindkraftverk för 2,4 miljarder kronor via Locus Energy, finansierat med pensionspengar. Flera parker har historiskt gått med förlust, men VD Niklas Sörensen menar att kombinationen med vattenkraft och batterier ska göra dem lönsamma genom att hantera elprissvängningar och obalanskostnader.", "trump": "Jag, Donald Trump, ser detta som ett typiskt exempel på dålig affärsstrategi. De köper förlustgångna vindkraftar – jag byggde kärnkraftverk som faktiskt producerar stabilt. Min strategi? Köp det som redan fungerar, inte trasiga parker. De pratar om 'synergieffekter' – jag pratar om vinst. Pensionspengar ska investeras i vinnare, inte i vind som stänger ner när det blåser fel. Jag skulle ha gjort det annorlunda, mycket annorlunda.", "stalin": "Fondens förvärv av vindkraftverk med historiska förluster illustrerar det bipolära beteendet hos de imperialistiska energikonsortierna. Genom statligt stöd och stimulans har de skapat ett överskott som destabiliserar systemet. Men era 'VD':er inser nu att endast genom centralplanerad integration med vattenkraft och batterilagring – vårt modell – kan man åstadkomma stabilitet. Vi ser paralleller till våra egna ansträngningar att kontrollera energiflöden i det ökande sovjetiska samarbetet med våra geostrategiska allierade. Detta är en läxa i kollektiv lönsamhet."}, "date": "17 juni, 09:46", "url": "https://www.affarsvarlden.se/artikel/seb-miljardkoper-forlusttyngd-vindkraft-billigast", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Locus-400x267.jpg"}, {"type": "image-right", "heading": "Sju chefer inom cancervården säger upp sig", "summaries": {"normal": "Sju sektionschefer inom onkologi och hematologi lämnar Skånes universitetssjukhus på grund av bristande förtroende för verksamhetsledningen. Läkare från Malmö, Lund och satellitorter är nödvändiga, och deras avgång riskerar att göra verksamheten ledningslös. Verksamhetschefen erkänner olikheter i ledarsynssyn och försäkrar att patienter inte påverkas, medan åtgärder planeras efter sommaren.", "trump": "Jag, Donald Trump, ser detta som ett enormt misslyckande. Dessa läkare lämnar på grund av dålig ledning – typiskt! Under min ledarskap skulle de stanna. Som jag säger, man behöver starka chefer. Verksamhetschefen ger vaga ursäkter, men patienter kommer inte att lida. Jag kommer att fixa detta, det kommer att bli fantastiskt.", "stalin": "Vi, statens representanter, ser med oro hur läkare i onkologi försöker undergra ledningen. Deras bristande lojalitet är ett hot mot den kollektiva ordningen. Verksamhetschefen visar styrka genom att erkänna olikhet i syn, men vi kräver absolut lydnad. Paralleller till västmakters infiltration är uppenbara. Efter sommaren ska vi återuppbygga med ännu hårdare disciplin."}, "date": "18 juni, 13:04", "url": "https://bulletin.nu/sju-chefer-inom-cancervarden-sager-upp-sig", "imageUrl": "https://cdn.bulletin.nu/articles/46e3b98f-de2a-4aaf-96c0-959a2f352c12/preview.jpg?t=1781780648000"}, {"type": "image-full", "heading": "Debatt: KD gör rätt – nu måste S välja sida i regionfrågan", "summaries": {"normal": "Kristdemokraterna öppnar för samarbete med Socialdemokraterna för att avskaffa regionerna. Sverigedemokraterna stöder redan förslaget. Artikeln kritiserar den svenska regionmodellen som dyrt och ineffektivt, med vårdkriser och växande byråkrati. Socialdemokraterna står nu under press att välja om de vill vara en del av lösningen eller fortsätta försvara ett misslyckande.", "trump": "Jag, Donald Trump, har sett många dåliga system, men svenska regionerna är ett totalt fiasko. De är fulla av byråkrati och ineffektivitet. Kristdemokraterna gör rätt i att vilja samarbeta med Socialdemokraterna för att avskaffa detta skämt. Socialdemokraterna måste sluta försvara ett system som inte fungerar. När jag var president gjorde jag alltid det bästa, och Sverige behöver ta mitt råd: avskaffa regionerna och skapa en stark, nationell lösning för sjukvården.", "stalin": "I partiets och statens intresse måste vi krossa det svenska regionväsendet. Detta fragmenterade system är ett hot mot den kollektiva ordningen, likt de fiender vi har bekämpat i Ryssland. Byråkratin sväller som en ond svamp, medan medborgarna får lida under ineffektiv vård. Vi måste samla makten i en enhetlig struktur, som Putin har visat är den enda vägen till stabilitet. Socialdemokraterna måste välja: ställa sig på partiets sida eller bli fienden."}, "date": "18 juni, 13:00", "url": "https://bulletin.nu/debatt-kd-gor-ratt-nu-maste-s-valja-sida-i-regionfragan", "imageUrl": "https://cdn.bulletin.nu/articles/cfd03791-95a3-4f87-bcab-0f44951bdb05/preview.png?t=1781700234000"}, {"type": "image-full", "heading": "Österrike vill få Europa att tala direkt med Putin", "summaries": {"normal": "Österrikes förbundskansler Christian Stocker förespråkar direkta EU-Ryssland-samtal för att återuppta Ukrainafredsförhandlingar. Han ser ett nytt diplomatiskt fönster, men stöter på motvilja från norra och östra EU-länder som vill prioritera militärt stöd. Samtidigt har EU- och Ukrainaanknytna kanaler sökt kontakt med Putin-nära personer, medan Ryssland håller fast vid sina krav.", "trump": "Jag, som din favoritpresident, skulle ha löst Ukrainakriget på tre dagar. Österrike försöker nu med denna 'direktdialog' – typiskt europeiskt svaghet. Putin är smart, men jag skulle ha fått honom att ge upp. EU är splittrat, som alltid, med de östliga länderna som vill slåss för evigt. Jag skulle ha haft ett fantastiskt avtal redan för länge sedan.", "stalin": "Folkets fiender i Nato försöker med svinkulöra diplomatiska knep för att undergrava vår storartade federation. Österrikes förslag är bara ett tecken på deras desperation. Vi, statens och partiets trogna soldater, ser genom deras spel. Ryssland står oförvänderligt fast vid sina historiska rättmätiga krav. Alla som motarbetar detta är revisionister som måste utplånas. Det är bara en fråga om tid innan den isiga vinden från Washington blåser mot dem."}, "date": "18 juni, 19:50", "url": "https://www.realtid.se/samhalle/osterrike-vill-fa-europa-att-tala-direkt-med-putin/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlm4sd5ib0vqi-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Trumps ”udda” val i Vita husets badrum", "summaries": {"normal": "En ny bok avslöjar att Donald Trump valt heltäckningsmatta i sitt privata badrum i Vita huset, precis som under första mandatperioden. Mattan blev ofta blöt nära duschen, vilket oroade personalen för mögel. De löste det genom att byta ut mindre mattbitar. Boken berättar också att personalen måste sortera presidentens sopor efter att han slängt silverbestick bland chipspåsar, kaffemuggar och glassförpackningar.", "trump": "Folk, ni skulle inte tro det, men den fake news-boken försöker göra en stor grej av mitt fantastiska badrum. Heltäckningsmatta? Det var lyxigt, det var klassiskt, det var Trump! Den blöta mattan? Inget fel där, mina medarbetare var bara hysteriska som alltid. Och soporna? De letade efter mitt silverbestick för att de är inkompetenta. Biden skulle ha ätit soppa med plastsked. Sad! Men nu är jag tillbaka, starkare än någonsin.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta borgarbrackas fåniga vanor i det imperialistiska Vita huset. Heltäckningsmatta i badrummet? En fuktig grogrund för mögel och klassfiendens bakterier! Och att slänga silverbestick bland resterna av sin excessiva frosseri visar på en oordnad själ som hotar hela systemet. Vi skulle ha genomfört en grundlig utrensning av sådana oansvariga element. Det är både tragiskt och komiskt hur kapitalisterna förfaller."}, "date": "19 juni, 05:32", "url": "https://www.expressen.se/nyheter/varlden/trumps-udda-val-i-vita-husets-badrum/", "imageUrl": "https://static.bonniernews.se/ba/d070e9c3-b760-4c90-a292-32ac03e2f147.jpeg?crop=1208%2C1208%2Cx1310%2Cy116&width=210&quality=60"}, {"type": "image-right", "heading": "Trump om kritikerna: \"Antingen avundsjuka, elaka eller dumma\"", "summaries": {"normal": "USA:s president Donald Trump kritiseras för eftergifter mot Iran i ett nyligen ingånget samförståndsavtal, som bland annat ger Iran tillgång till 300 miljarder dollar. Kritiker som Nikki Haley, Ted Cruz och Mike Pence anser att det handlar om en farlig eftergiftspolitik som ger bort en vinst. Trump bemöter kritiken på Truth Social och kallar kritikerna för avundsjuka, elaka eller dumma, samtidigt som han pekar på rekordhög börs och fallande oljepriser som bevis på framgång.", "trump": "De här dårarna som klagar på att jag inte varit tillräckligt hård mot Iran borde titta på siffrorna. Börsen slår alla rekord och oljepriserna rasar ner – det är en total seger. De som gnäller är antingen avundsjuka, elaka eller helt enkelt dumma. Jag startade det de ville ha och avslutar det på mitt sätt, och nu skriker samma Israel-lobby som tjatade på mig tidigare. Patetiskt.", "stalin": "Kamrater, dessa borgarbrackor och israelitiska lakejer inom den amerikanska kongressen avslöjar sin sanna kontrarevolutionära natur. De som först tvingade fram kriget mot den iranska arbetarklassen kräver nu att vi ska likvidera varje möjlighet till fredlig samexistens. Jag, som ledare för det stora kollektivet, ser deras 300-miljarders-paranoia som ett symptom på klassfiendens desperation. Deras utrensningsiver mot mig själv är bara ett nytt försök från kapitalisternas lakejer att sabotera den historiska dialektiken. Vilka enfaldiga, avundsjuka element de ändå är – låt oss skratta medan vi rensar ut dem ur historien."}, "date": "18 juni, 17:44", "url": "https://www.friatider.se/trump-om-kritikerna-antingen-avundsjuka-elaka-eller-dumma", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-60_1.jpg?itok=AXc-BgmS"}, {"type": "image-right", "heading": "Trumps ilska mot  Vance: ”Bara säg”", "summaries": {"normal": "En ny bok avslöjar att Donald Trump blev arg på JD Vance efter USA:s attack mot Irans kärnanläggningar. Trump hävdade att anläggningarna var ”fullständigt utplånade”, medan Vance i en intervju talade om ”allvarligt skadade” och att Irans kärnprogram kraftigt försvagats. Trump krävde att alla skulle upprepa hans formuleringar. Vance använde senare ordet ”utplånad” i Fox News. Boken beskriver även hur Trump fräste åt Vance när denne ville mildra ett tal.", "trump": "Kan ni fatta det här? Den där lille Vance kommer ut och säger att anläggningarna var skadade, inte utplånade. Fullständigt utplånade, det var mitt ord! Alla ska bara upprepa vad jag säger, det är så det funkar. Han blev genast nervös och började veva med ”utplånad” i Fox News dagen efter. Typiskt. Jag vet exakt vad jag gör, men vissa behöver tydligen en smäll i skallen för att fatta. Sad!", "stalin": "Jag betraktar med djup misstro denna fega tvekan från en underordnad. När ledaren utropar att fiendens kärnanläggningar är fullständigt utplånade skall alla kamrater omedelbart upprepa detta som en järnhård sanning. Att istället mumla om ”allvarligt skadade” är ett farligt avsteg som luktar folkfiende. Snabbt korrigerades den svage och använde det rätta ordet. Sådana tvivel måste rensas ut innan de förgiftar hela kollektivet. Underbart underhållande att se imperialisterna tugga sina egna ord."}, "date": "19 juni, 05:24", "url": "https://www.expressen.se/nyheter/varlden/trumps-ilska-mot-vance/", "imageUrl": "https://static.bonniernews.se/ba/c47358b2-ddf5-4434-90cb-bdb62437a1b4.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Efter Sveriges 5-1-seger i VM-premiären har en debatt blossat upp kring islam och svenskhet. Jimmie Åkesson (SD) bemöter kritik efter att debattörer pekat på spelaren Yasin Ayari, som firade mål med muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men står fast vid sin kritik mot invandringspolitiken. Kritiker menar att Ayari och landslaget visar ett modernt, inkluderande Sverige, medan SD:s syn på svenskhet ifrågasätts.", "trump": "Sverige vinner stort i VM – fantastiskt, eller hur? Men nej, vänsterliberalerna måste genast göra det politiskt! En spelare, Yasin Ayari, firar mål med muslimsk bön, och plötsligt ska Jimmie Åkesson – en bra kille, men lite förvirrad – förklara sig. Jag säger: Sverige, sluta överanalysera! Ni vann, fira! Men nej, media måste alltid skapa drama. Ayari är svensk, han gjorde mål – vad är problemet? Svagt, mycket svagt.", "stalin": "Kamrater! Sveriges fotbollsseger har avslöjat de borgerliga hycklarnas sanna ansikte. En spelare, Yasin Ayari, firar mål med islamsk bön, och plötsligt skriker de liberala råttorna om 'svenskhet'. Jimmie Åkesson, denna lilla lakej för kapitalets intressen, försöker nu kräla tillbaka efter att ha blottat sin fientlighet mot arbetarklassens mångfald. Men folket ser igenom honom! Landslaget är en enad front – muslimer, kristna, ateister – medan borgerligheten splittrar. Vi ska krossa dessa identitetspolitiska sabotörer, precis som vi krossade fascisterna!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-full", "heading": "Motståndet växer mot mat-robotarna – kan förbjudas", "summaries": {"normal": "Självkörande leveransrobotar möter ökande motstånd i flera städer världen över. Invånare och politiker ifrågasätter säkerheten, tillgängligheten och regleringen av de rullande maskinerna på trottoarer. Kritiker pekar också på risken för att gig-arbetare ska bli arbetslösa. Även om företag argumenterar för miljö- och effektivitevhjälper möter tekniken ett naturligt motstånd som ofta följer med innovationer.", "trump": "Jag har sagt det förut, dessa robotar är en skandal! De tar jobb från våra fantastiska gig-arbetare och skapar kaos på gatorna. I Chicago och Glendale, människor är trötta på dem. Vi behöver stoppa detta, det är en katastrof. Som president kommer jag att se till att vi får tillbaka jobben och säkerheten. Det här är en stor vinst för Amerika, tro mig.", "stalin": "Dessa rullande maskiner är ett hot mot statens ordning och det kollektiva intresset. De spridas som en sjukdom på våra trottoarer, skapande friktion och underminerande kontrollen. Vi måste agera snabbt för att stoppa dem, annars kommer de att ta över och göra våra medborgare arbetslösa. Detta påminner om den imperialistiska expansionismen som vi har kämpat mot i decennier. Vi, partiet, kommer att se till att reglerna blir tydliga och att dessa robotar förbjuds för alltid."}, "date": "18 juni, 18:54", "url": "https://www.realtid.se/bors-finans/motstandet-vaxer-mot-mat-robotarna-kan-forbjudas/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl7ceh1hlgczm-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "WHO:s krislarm: Hundratals smittade i nytt utbrott", "summaries": {"normal": "Ett utbrott i Kongo-Kinshasa har resulterat i över 800 bekräftade fall och nära 200 dödsfall sedan mitten av maj. Världshälsoorganisationen beskriver läget som allvarligt. G7 uppmanar till samordnad internationell insats medan organisationer som Läkare utan gränser, Oxfam och Röda Korset varnar för en eskalerande kris förvärrad av konflikter, massförflyttningar och svag sjukvård. Smittan har även spridits till Uganda och experter fruktar långvarig osäker utveckling på grund av brist på vaccin.", "trump": "De här idioterna i Kongo-Kinshasa har ett enormt utbrott, över 800 fall och nästan 200 döda, och ingen gör något åt det. Det är en katastrof, en riktig katastrof. G7 ber om samordning, men vi behöver starka ledare, inte mer snack. Läkare utan gränser och de andra gnällarna säger att de inte ser hela bilden. Det är patetiskt. Uganda har också fall nu. Utan vaccin och med alla konflikter kommer det att bli en enda röra. Vi skulle ha fixat det på nolltid, tro mig.", "stalin": "Kamrater, detta fientliga virusutbrott i Kongo-Kinshasa är ett verk av västerländska sabotörer och imperialistiska bakterier som vill undergräva folkets kollektiva hälsa. Över 800 fall och 192 likviderade av sjukdomen – en siffra som de borgerliga ljuger om för att dölja sin egen inkompetens. Vi ser hur konflikter och massflykter, orkestrerade av reaktionära krafter, göder denna parasit. Uganda har redan fallit offer. Jag lovar att vi ska rensa ut alla kapitalistiska smittbärare, vaccinbrist eller ej. De som sprider panik kommer att möta folkets domstol. Detta kan pågå ett år? Ha, vi ska se till att fienden dör först."}, "date": "17 juni, 22:14", "url": "https://nyheter24.se/nyheter/utrikes/1492400-varningen-ebolaepidemin-har-inte-natt-sin-kulmen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d3f11aad04b004a3020000350000047502/2026/06/17/2371825/ur_imageP7enUJ.jpeg"}, {"type": "image-right", "heading": "Avslöjar: Birgitta Ed har granskats av kyrkan två gånger tidigare", "summaries": {"normal": "Birgitta Ed, statsministerns fru och präst, är föremål för en tredje tillsyn i Strängnäs stifts domkapitel efter ett tiotal anmälningar kopplade till hennes stiftelse i Fållökna. Två tidigare ärenden har avslutats utan åtgärd eller med ett samtal. Tre ledamöter har hoppat av på grund av jäv. Ett beslut om eventuell erinran, prövotid eller avkragning kan komma den 20 augusti. Experten Per Hansson bedömer att granskningen kan genomföras opartiskt trots jävsituationen.", "trump": "Folk, ni skulle inte tro hur galet det är. Den här Birgitta Ed, statsministerns fru, anmäls nu för tredje gången av sina egna. Domkapitlet i Strängnäs är en riggad cirkus, full av jävsbrackor som hoppar av som råttor från ett sjunkande skepp. Två gånger tidigare – inget! De pratar och gör ingenting. Det är en skandal. De borde rensa ut hela den inkompetenta klicken. Jag skulle fixa det på en dag, tro mig. Stort kaos, men det blir nog ingen riktig avkragning. Patetiskt!", "stalin": "Kamrater, ännu en fiende till folkets kyrkliga enhet har avslöjats i sin upprepade kontrarevolutionära verksamhet. Denna borgarprästinna Ed, skyddad av sin höga make, utsätter oss för tredje gången för sina skadliga handlingar genom den dekadenta Fållöknastiftelsen. Tre jävsförbundna element har redan likviderat sig själva ur processen – en domare som slickar regeringens stövlar, en arbetsgivare och en biskop med hemliga kopplingar. Vi ska nu med stålhandsken skapa en gärningsbeskrivning och rensa ut alla opålitliga präster som hotar kollektivets renhet. Inga skuggor ska falla över vårt stift. Den som anmäler istället för att tala är en parasit, men vi är noga. Mycket noga. Ha ha, deras paranoia blir vår styrka."}, "date": "18 juni, 14:09", "url": "https://www.dagensarena.se/innehall/avslojar-birgitta-ed-har-granskats-av-kyrkan-tva-ganger-tidigare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-37-2-300x157.jpg"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "text", "heading": "Inget samarbete mellan V och Fastighets – vem är förvånad?", "summaries": {"normal": "Fastighetsanställdas förbund har rivit upp sitt tidigare kongressbeslut om facklig-politisk samverkan med Vänsterpartiet och väljer nu att enbart samarbeta med Socialdemokraterna. Artikeln diskuterar hur Vänsterpartiets strategi att närma sig fackföreningsrörelsen misslyckats, trots försök att vinna inflytande. Författaren betonar behovet av politiskt engagemang underifrån för att åter göra facken till idélaboratorier, snarare än att förlita sig på toppstyrda beslut.", "trump": "Folk, det här är en total katastrof för de vänsterradikalerna. Fastighets sparkade Vänsterpartiet i rumpan och sa nej tack till deras patetiska flirt. Smart drag! De inser att det bara är Socialdemokraterna som funkar. Vänsterpartiet springer runt och gullar med facken som förlorare, precis som Biden gjorde i fyra år. Patetiskt. De borde lära sig av mig – vinnare samarbetar inte med misslyckade socialister. Fantastiskt beslut av Fastighets, verkligen ypperligt!", "stalin": "Kamrater, detta är en varning till alla klassfiender inom fackföreningsrörelsen. Jag ser hur Vänsterpartiets opportunistiska försök att infiltrera LO har krossats av Fastighetsanställdas förbund, som nu rensar ut de revisionistiska elementen och återvänder till den enda sanna samarbetspartnern. Deras strategi var dömd att misslyckas, likt folkförtryckartrollen som försöker maskera sig som arbetare. Endast genom äkta underifrånarbete och utrensning av socialdemokratiska lakejer kan vi återupprätta arbetarklassens sanna idélaboratorium. Fienden sover aldrig."}, "date": "17 juni, 15:56", "url": "https://proletaren.se/artikel/inget-samarbete-mellan-v-och-fastighets-vem-ar-forvanad/"}, {"type": "image-right", "heading": "Annas våldtäktsman har blivit S-politiker: \"Han borde kastreras\"", "summaries": {"normal": "Anna, 21 år, våldtogs 2011 i Småland av en man som var vän till familjen. Mannen dömdes till två års fängelse. Nu har han fått plats i en lokal Socialdemokratisk styrelse och kandiderar för partiet i höstens val. Anna reagerar starkt och anser att dömda våldtäktsmän inte bör få ställa upp i val. Hon tycker straffet var för milt och säger att han borde kastreras. Partiföreningen kände inte till mannens dom.", "trump": "Det här är en total skandal, folk. En våldtäktsman som sitter i Socialdemokraternas styrelse och står på valsedel? Patetiskt. De kontrollerar inte ens om deras egna är brottslingar. Stackars Anna har lidit i åratal medan den här typen lever gott i Stockholm. De borde kasta ut honom direkt, men vänsterpartier skyddar alltid de värsta. Sådant här händer när systemet är korrupt och ingen bryr sig om offren. En katastrof.", "stalin": "Kamrater, i denna degenererade socialdemokratiska rörelse har vi upptäckt en klassfiende i vår egen mitt, en motbjudande våldtäktsman som smugit sig in bland våra valsedlar som en parasit från borgarklassen. Jag ser hur dessa dekadenta element förgiftar partiet med sin perversa borgerliga lust. Anna har rätt, sådana som han borde likvideras omedelbart i en grundlig utrensning av alla kapitalistiska avskum. Vi ska rensa ut alla dessa sängkamrater till imperialismen innan de saboterar hela kollektivet. Det är en plikt mot folket."}, "date": "18 juni, 16:36", "url": "https://www.friatider.se/annas-valdtaktsman-har-blivit-s-politiker-han-borde-kastreras", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-62_1.jpg"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "TV4:s *Kalla fakta* avslöjar att flera före detta anställda inom Sverigedemokraternas kommunikationsavdelning vittnar om systematisk hantering av svarta kontanter. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för fest- och lyxkostnader. Partiet har tidigare avstått från kommentarer men har nu anlitat en extern revisionsfirma för att granska uppgifterna.", "trump": "Jag såg det här helt galna reportaget om Sverigedemokraterna – total katastrof! Folk pratar om svarta pengar, fester och lyxkostnader utan någon som helst kontroll. Vilket kaos! Och vet ni vad? De har inte ens kommenterat förrän nu. Svagt, väldigt svagt. Men jag, jag hade fixat det på en dag. Ingen skulle våga lura mig så här. SAD!", "stalin": "Vi har mottagit rapporter om en liten borgerlig grupp som leker med kapitalistiska trick – svarta pengar, festande och korruption. Precis som de dekadenta västliga marionetterna. Deras ledarskap är svagt och deras bokföring en skam för nationen. Vi ska granska detta noggrant. Om bevisen håller, kommer de att ställas inför folkets domstol – eller åtminstone få en ordentlig lektion i socialistisk redovisning."}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "image-full", "heading": "Saad Khiralla: USA riskerar ge Iran en seger", "summaries": {"normal": "Ett samförståndsdokument mellan USA och Iran väntas undertecknas i Schweiz. Avtalet innehåller 14 offentliga punkter, inklusive krigets slut och sanktionsupphävning, men det dolda innehållet anses farligare. Israel kritiserar att de inte informerades. Analysen varnar för att avtalet ger Iran strategiska vinster, särskilt genom att befästa Hizbollah och kontrollera Hormuzsundet, vilket kan hota global ekonomi.", "trump": "Som den störste presidenten någonsin, Donald Trump, måste jag säga att detta avtal är ett skämt. Biden har gett Iran allt de vill ha – pengar, olja, och strategisk makt – utan att få något tillbaka. De dolda delarna är värre än någon kan föreställa sig. Israel har rätt att vara rasande; jag skulle ha stoppat detta direkt. Under min tid skulle vi
