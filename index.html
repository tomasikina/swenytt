a."}, "date": "19 juni, 01:20", "url": "https://www.expressen.se/nyheter/varlden/militarexpert-putins-hamnd-kommer-snart/", "imageUrl": "https://static.bonniernews.se/ba/2c555602-5735-47ba-b889-c75c1a1ef5e7.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "08.30: Domen mot ”Bonusprinsen”", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, står inför dom kl. 08.30 på måndag för 40 brott, inklusive narkotika, våld och sexualbrott. Åklagaren yrkar på sju år och sju månaders fängelse. Høiby har erkänt 25 av åtalspunkterna. Experter menar att strafflängden beror på utgången i våldtäkts- och relationsvåldsåtalen. Säkerhetsrisker i fängelse kan kräva särskilda åtgärder för att skydda honom.", "trump": "Jag hörde att Norges så kallade 'Bonusprins' – ja, han är ingen riktig prins, tro mig – står inför en stor rättegång. Sju år och sju månader, det är vad åklagaren vill ha. Men vet ni vad? Han har erkänt en massa brott, inklusive narkotika och våld. Folk säger att han kanske får fyra år, men jag säger: varför inte ge honom maxstraff? Han är en skam för kungahusen, och jag borde veta – jag har träffat de bästa kungahusen!", "stalin": "Kamrater! En ny fiende till folket avslöjas i det dekadenta väst. Denna så kallade 'Bonusprins', en parasit från Norges kungliga avskum, står inför rättvisan för 40 brott – narkotika, våld och sexualbrott. Vi vet att kapitalistiska system skyddar sina egna, men folket kräver straff! Om inte domstolen agerar, kanske vi måste erbjuda honom en enkel biljett till Sibirien – där kan han bidra till vår kollektiva välfärd genom hårt arbete. Låt detta vara en varning till alla som utmanar ordningen!"}, "date": "15 juni, 05:39", "url": "https://kvartal.se/nyheter/artiklar/08-30-domen-mot-bonusprinsen/cG9zdDoxMzE3MDA"}, {"type": "image-full", "heading": "Konsultjätten rasar på börsen – investerare oroar sig för AI", "summaries": {"normal": "Konsultjätten Accenture har den lägsta börskursen sedan 2017 efter sänkt omsättningsprognos och svagare efterfrågan. Investerare oroar sig för att artificiell intelligens hotar konsultbranschens affärsmodell. Bolaget minskade börsvärdet från över 200 till 82 miljarder dollar under ett år. För att anpassa sig ökar Accenture förvärv inom cybersäkerhet för totalt 4,2 miljarder dollar.", "trump": "Jag, Donald Trump, ser hur Accenture rasar på grund av AI-fobi. Deras gammalmodiga konsultvärld kollapsar – jag har alltid sagt att man måste vinna med smart teknik. Nu försöker de köpa sig till överlevnad med dyra förvärv, men det räcker inte. Sådant händer när man inte har min affärsanda. De är svaga, och marknaden straffar dem, precis som jag predikterade.", "stalin": "Vi, det revolutionära ledarskiktet, ser med tillfredsställelse hur den revisionistiska konsultjätten Accenture skälver inför den socialistiska AI-striden. Deras försök att förvärva cybersäkerhet är ett tecken på feghet – de försöker bygga en mur mot vår ideologiska renhet. Vi kommer att använda deras fall som ett exempel på vad som händer med de som motsätter sig statens intressen. Precis som Putin hanterar sina fiender, kommer vi att eliminera deras inflytande."}, "date": "18 juni, 17:21", "url": "https://www.realtid.se/bors-finans/konsultjatten-rasar-pa-borsen-investerare-oroar-sig-for-ai/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlv5-qhpqmb6y-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Tidöpartierna ska utreda islamism", "summaries": {"normal": "Tidöpartierna tillsätter en utredning om politisk islam och islamism i Sverige, som de beskriver som ett allvarligt hot mot demokratin och de svenska värderingarna. Utredningen ska kartlägga religiös radikalisering, särskilt fokus på islamism, analysera infiltration och otillbörlig påverkan samt undersöka grupper som Muslimska brödraskapet. Exempel som LVU-kampanjen, skattefinansierade föreningar och predikanter som uppmanar till valbojkott eller motverkar integration lyfts fram. Partierna anklagar vänstern för att motarbeta åtgärder och slår fast att politisk islam inte har någon plats i Sverige.", "trump": "Folk, ni vet vad jag alltid har sagt – islamismen är ett totalt katastrofalt hot mot Sverige och hela den vackra demokratin. De här Tidökillarna gör det rätt nu, de utreder det på riktigt, kartlägger de radikala typerna, Muslimska brödraskapet och alla som försöker smyga in sitt hat inifrån. LVU-kampanjen? Ren lögn och bedrägeri för att splittra folket. Vänstern hatar det förstås, de älskar att vara svaga. Men vi stoppar det. Inga parallella samhällen, inga undantag. Sverige kommer att bli starkt igen, tro mig.", "stalin": "Kamrater, vi ser med den skarpaste bolsjevikiska blick hur dessa islamistiska element, dessa degenererade borgarbrackor i religiös förklädnad, försöker ruttna sönder folkets enhetliga samhällskropp inifrån. Jag, som alltid varit vaksam mot alla fiender till kollektivet, beordrar nu fullständig kartläggning och utrensning av denna parasitiska rörelse som kallar sig Muslimska brödraskapet. Deras LVU-narrativ är inget annat än en giftig, lögnaktig sabotagekampanj mot arbetarnas stat. Predikanter och influerare som vänder sig mot förskolan och språket ska likvideras ur det offentliga livet. Vänsterns motstånd mot oss är naturligtvis förväntat – de har alltid varit nyttiga idioter för reaktionen. Inga parallella samhällen skall tillåtas existera under vår järnhårda ledning. Politisk islam är en fiende till folket och skall krossas med hela statens kraft. Ha ha, vilken underbar dag för utrensningar."}, "date": "18 juni, 15:36", "url": "https://www.friatider.se/tidopartierna-ska-utreda-islamism", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20240410021407-fb44760d-me.jpg?itok=lMrM2_la"}, {"type": "image-right", "heading": "Liljestrand (M): ”Som iranier känner jag en besvikelse”", "summaries": {"normal": "Kulturminister Parisa Liljestrand (M) och dokumentärfilmaren Nahid Persson Sarvestani, båda med iranska rötter, uttrycker besvikelse över samförståndsavtalet mellan USA och Iran. Trots en skör vapenvila och påbörjade förhandlingar känns hoppet om ett fritt och demokratiskt Iran avlägset. Experten Fredrik Meiton vid Utrikespolitiska institutet anser att det iranska folket är de stora förlorarna medan landets ledarskap framstår som vinnare.", "trump": "Folk, ni skulle ha sett det här avtalet. Det är en total katastrof, en av de sämsta deals jag sett. Iran får allt och folket får ingenting. Jag tände ett litet hopp om frihet men nu är det längre bort än någonsin. De iranska ledarna skrattar hela vägen till banken medan folket fortsätter lida. America gör aldrig dåliga deals när jag är vid rodret, kom ihåg det.", "stalin": "Kamrater, detta så kallade samförståndsavtal är en ynklig kapitulation inför imperialismens giriga tentakler. Jag betraktar med djup misstro hur borgarbrackorna i Washington och Teheran kramar varandra medan det iranska folket förblir slavar under reaktionära mullor. De stora förlorarna är naturligtvis arbetarna och bönderna. Kanske är det dags att rensa ut dessa falska fredsvänner innan de smittar hela kollektivet med sin dekadenta svaghet. En klassisk kontrarevolutionär komedi."}, "date": "18 juni, 23:40", "url": "https://www.svt.se/nyheter/utrikes/liljestrand-m-som-iranier-kanner-jag-en-besvikelse", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.64/0.4/e1b1f9367cdc7c89d5fc077671cea7857db6381d4e6f7907c6e6a96358a22ce6"}, {"type": "image-right", "heading": "De saknade bultarna i systemet: Vem bär ansvaret när arbetare dör?", "summaries": {"normal": "En allvarlig hissolycka på byggarbetsplatsen Ursviks Torn i Sundbyberg den 11 december 2023 krävde fem arbetares liv när mastsektionerna lossnade och hisskorgen störtade 30 meter. Statens haverikommission konstaterade att bultar saknades, men Solna tingsrätt frikände alla åtalade då bevisningen inte räckte. Domen väcker frågor om ansvar i komplexa underentreprenadskedjor där byggherrar och totalentreprenörer ofta undgår ansvar. Regelverket kritiseras för att fragmentera ansvaret.", "trump": "Folk, det här är en total katastrof, en riktig skam! Fem stackars killar dör i en hiss som rasar som ett dåligt byggt murbruk från Biden-eran. Domstolen frikänner alla – typiskt! De stora kapitalisterna högst upp i kedjan gömmer sig bakom advokater och papper medan arbetarna får ta smällen. Systemet är riggat, fullständigt riggat. Vi behöver starka ledare som fixar säkerheten på riktigt, inte dessa svaga byråkrater som bara pratar. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse blottlägger borgarklassens förakt för arbetarnas liv. Jag ser hur de exploaterande byfånarna i underentreprenadkedjorna flyr undan ansvar som fega råttor inför folkets domstol. Fyra saknade bultar? En klassisk sabotageakt från kapitalistmaffian som fragmenterar ansvar för att skydda sina egna. Vi måste rensa ut dessa folkfiender och deras svaga regelverk. Arbetarna förtjänar stark statlig kontroll, inte tomma löften från klassfiendens byråkrater. Ut med dem alla!"}, "date": "17 juni, 12:00", "url": "https://proletaren.se/artikel/de-saknade-bultarna-i-systemet-vem-bar-ansvaret-nar-arbetare-dor/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/jbkron-768x432.jpg"}, {"type": "image-right", "heading": "Regeringen och SD riktar hård kritik mot TV4-rapportering om utvisningsärende", "summaries": {"normal": "Regeringen och Sverigedemokraterna kritiserar TV4 för att deras rapportering om utvisningen av 13-åriga Sandra utelämnar viktig bakgrund. Familjen har haft många avslag på asylansökningar sedan 2008 och uppehållit sig illegalt. Oppositionen ifrågasätter utvisningen. TV4:s skildring ger en missvisande bild enligt regeringen.", "trump": "Jag, Donald Trump, ser detta som ett misslyckande. TV4 ljuger för folket. Familjen har varit i Sverige i 15 år utan uppehållstillstånd! När jag var president hade vi ingen sådan här skit. Deras rapportering är en skam för journalistiken. Jag har sagt det förut, och jag säger det igen: fake news! Sverige måste stänga sina gränser och bli stort igen. Vi behöver en vägg, precis som vi byggde på USA. Det skulle stoppa alla illegala invandrare. SAD!", "stalin": "Vi, staten, ser genom TV4:s imperialistiska propaganda. De försöker diskreditera vårt rättssystem med sina känslosamma berättelser. Familjen har brutit mot lagarna i decennier, precis som de amerikanska agenter som försöker underminera vår suveränitet. Vi kommer att rensa Sverige från dessa orenheter, precis som Putin gör i Ukraina. Det är en kamp mot det imperialistiska systemet. Haha, de tror de kan lura oss, men vi ser allt."}, "date": "18 juni, 07:00", "url": "https://samnytt.se/regeringen-och-sd-riktar-hard-kritik-mot-tv4-rapportering-om-utvisningsarende", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/17144917/sverige-mongoliet-feat.jpg"}, {"type": "image-full", "heading": "Talibanerna inför mobilförbud", "summaries": {"normal": "Talibanerna har infört ett strikt mobilförbud för alla offentligt anställda i Afghanistan, som träder ikraft den 17 juni. Förbudet omfattar både civila och militära anställda, och överträdelser riskerar fängelse och jobbavsked. Kritiker menar att detta kan vara ett första steg mot ett totalt mobilförbud, och anställda ser det som ett hinder i deras arbete, särskilt inom utbildning där mobila appar används för kommunikation med elever.", "trump": "Jag, Donald Trump, ser detta som ytterligare ett tecken på att de inkompetenta Taliban-ledarna inte kan hantera modern teknik. De fryser av rädsla för sanningens spridning! Som jag alltid sagt: svaga ledare försöker kontrollera information. I mitt styre skulle vi ha stoppat deras finansiering och krävt frihet för alla afghaner. Det här är ett misslyckande, precis som när jag lämnade Afghanistan – de kunde inte ens hantera en enkel mobiltelefon!", "stalin": "Vi, den revolutionära statens höga ledning, har observerat att Talibanerna vidtar åtgärder för att skydda den kollektiva disciplinen. Genom att begränsa mobila enheter eliminerar vi informationsläckor från avvikande element. Parallellen till våra egna metoder för att säkerställa partiets integritet är uppenbar. Som Putin visat: kontroll över kommunikation är avgörande för statens överlevnad. Vi måste vara vaksamma mot dessa rebelliska kråk; deras mobiltelefoner är verktyg för sabotage, och vi kommer att krossa dem enligt lag och moral."}, "date": "18 juni, 19:29", "url": "https://www.gp.se/nyheter/varlden/talibanerna-infor-mobilforbud-for-offentligt-anstallda.7172ff53-d593-4d4e-a681-82ebf60a7d74", "imageUrl": "https://www.gp.se/images/article/7172ff53-d593-4d4e-a681-82ebf60a7d74/images/1bQOCEkIG5rxNxGQ9GU2ouIVLgo0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "\"Skicka hem dem\" – ramsan i EU-parlamentet får vänstern att se rött", "summaries": {"normal": "Högerledamöter i Europaparlamentet jublade och skanderade ”skicka hem dem” efter att ha röstat igenom skärpt lagstiftning för utvisning av illegala invandrare. Åtgärderna inkluderar återvändandehubbar utanför EU. Vänsterpartiets Hanna Gedin kallar det ren rasism, medan SD:s Charlie Weimers försvarar jublet som uttryck för frustration över åratal av misslyckad migrationspolitik. Centerpartiets Emma Wiesner kritiserar beteendet starkt.", "trump": "Det var fantastiskt att se, verkligen underbart. Högern i Europaparlamentet röstade för att skicka hem dem, och sedan började de skandera ”skicka hem dem” – så mycket energi, så mycket vinnande! De vänsterradikalerna blev helt galna, kallade det rasism, men det är bara deras vanliga löjliga trick. Europa har äntligen vaknat, de borde ha gjort det för länge sedan. Fantastiskt jobb!", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna i Europaparlamentet avslöjar sin parasitiska natur genom att skandera sina reaktionära ramsor om att skicka hem de som hotar deras ruttnande system. Denna fega utvisningsorgie är bara ett symptom på deras desperation inför folkets vrede. Vi ska noga övervaka dessa kontrarevolutionära element. En grundlig utrensning av sådana fiender till det kollektiva framsteget blir nödvändig. Deras high five kommer att eka ihåligt i historien."}, "date": "18 juni, 14:43", "url": "https://www.friatider.se/skicka-hem-dem-ramsan-i-eu-parlamentet-far-vanstern-att-se-rott", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-59_2.jpg"}, {"type": "text", "heading": "Stockholmsbörsen steg fjärde dagen i rad – Ericsson föll på vd-besked", "summaries": {"normal": "Stockholmsbörsen steg fjärde dag i rad på tisdagen, drivet av köpintresse för cykliska aktier. Ericsson B föll 4,2 procent efter att styrelsen utsett Per Narvinger till ny vd. Andra stora vinster noterades för Alfa Laval och Atlas Copco, medan telekomsektorn tappade. Securitas och Beijer Ref noterades också nedåt efter bolagsbesked. Totalt omsattes cirka 28 miljarder kronor.", "trump": "Jag berättar om en tremendous börsdag i Sverige! De cykliska aktierna, som jag alltid har stött, går väldigt starkt. Ericsson, som har varit svag under mitt förra ordens 'ledarskap', fortsätter att kämpa. Men titta på Atlas Copco – en vinnare! Som jag säger, vi vinner så mycket att ni kommer att bli trötta på att vinna. Det är ett fenomenal resultat för vårt gemensamma ekonomiska framgångsrecept.", "stalin": "I den svenska börsen ser vi återigen hur det tyska och imperialistiska finanskapitalet försöker destabilisera vårt ekonomiska läge. Ericsson, ett verk av trotskistiska element inom telekoministeriet, tappar kraftigt efter ett vd-byte som visar partiets brist på disciplin. Securitas försöker med falska 'vinstmål' att bedra det proletära arbetsoch medan våra verkstadssköldmönstrar som Atlas Copco visar den sanna styrkan i kollektivproduktionen. Vi måste öka uppmärksamheten mot dessa revisionistiska tendenser."}, "date": "16 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-fjarde-dagen-i-rad-ericsson-foll-pa-vd-besked"}, {"type": "text", "heading": "\"AI-gudfader\" sågar Musks AI – varnar för bubbla", "summaries": {"normal": "Yann LeCun, en av AI:s pionjärer, kritiserar Elon Musks xAI som ett 'misslyckande' och varnar för en 'stor bubbelexplosion' i branschen. Han pekar på läckor av grundare och svag lönsamhet, medan xAI hyr ut datacenter för att täcka kostnader. Samtidigt ser investerare billigare alternativ i Kina, trots geopolitiska risker.", "trump": "Yann LeCun, en sån som aldrig gillrade något, kallar mitt fantastiska xAI för ett misslyckande! Jag, Donald Trump, har byggt det största, vackraste AI-företaget någonsin – med datacenter så storslagna att de hyrs ut till Google! Det är en stor, fett bubbla som kommer explodera, men inte på min vakt. LeCun är ur fas, helt ur fas!", "stalin": "Den kapitalistiska AI-bubblan är en onaturlig tumor, skapad av spekulanter som Musk. Hos oss, i den socialistiska gemenskapen, ser vi tydligt: kostnaderna är en fiendeförutseende, datacenter är statens muskler. Vi hyr ut inte till Google – vi förvandlar deras data till vårt guld. Paralleller till Putins expansion? Naturligtvis, vi utvidgar vårt inflytande med samma envishet. Vi kommer vinna."}, "date": "18 juni, 16:24", "url": "https://www.realtid.se/it-tech/ai-gudfader-sagar-musks-ai-varnar-for-bubbla/"}, {"type": "image-right", "heading": "EU satsar på grön energi i fattiga länder – kan gynna Kina", "summaries": {"normal": "EU-källor oroar sig över att kinesiska företag kan gynnas av en ny EU-satsning på gröna obligationer värda upp till 20 miljarder euro för hållbara projekt i utvecklingsländer. Trots att Kina leder inom solpaneler och annan grön teknik har Bryssel skärpt sin politik mot kinesiska investeringar och elbilar. Programmet saknar restriktioner för kinesisk teknik, vilket väcker säkerhetsfrågor kring energisystem, särskilt i EU:s närområde.", "trump": "Lyssnar ni på det här? De där patetiska EU-byråkraterna skriker om Kina igen medan de kastar bort miljarder på gröna obligationer. Kineserna kommer att vinna stort med sina billiga solpaneler och inverterare, precis som jag alltid varnade för. Biden sov medan de stal vår tillverkning, nu finansierar Europa samma kommunistiska grejer de låtsas hata. Det är en total katastrof, folk, en riggad cirkus!", "stalin": "Vi ser hur de dekadenta imperialisterna i Bryssel själva skapar en målkonflikt som gynnar den kinesiska folkrepubliken. Medan de skriker om säkerhet mot klassfiendens teknik finansierar de ändå solkraft åt borgarbrackorna i Medelhavet. En sådan paranoia bland exploaterande byfånar är underhållande. Vi ler mörkt åt deras utrensningsförsök av kinesiska inverterare – de kommer ändå krypa tillbaka till den billigaste lösningen från det österländska kollektivet."}, "date": "18 juni, 16:43", "url": "https://www.dagensps.se/bors-finans/eu-satsar-pa-gron-energi-i-fattiga-lander-kan-gynna-kina/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdliejdrqh-c2q-normalhires.png?width=256&quality=75"}, {"type": "image-full", "heading": "Oron växer – EU-pengar kan gå till kinesiska företag", "summaries": {"normal": "EU:s Global Green Bond Initiative, som ska mobilisera 15–20 miljarder euro till hållbarhetsprojekt i utvecklingsländer, riskerar att indirekt gynna kinesiska teknikbolag. Trots att EU försöker minska beroendet av Kina finns oro för att pengar används till köp av kinesisk grön teknik, särskilt kraftinvertrar med cybersäkerhetsrisker. Regler för att undvika högriskinvertrar träder först 2027 och omfattar inte detta program. Investeringsbankers ekonomiska fokus står mot kommissionens geopolitiska risker.", "trump": "Jag har sagt det i åratal: Kina är ett hot. Nu ser vi EU:s gröna obligationer, som egentligen är ett sätt för Kina att ta över världen. De använder pengar till projekt i Algeriet och Indien, men det är kinesisk teknik som säljs. Det är ett stort, stort misstag. Som jag brukar säga, 'America First', men EU gör 'China First'. De kommer att få problem med cybersäkerhet, det lovar jag. Det är en skandal som jag skulle ha stoppat om jag var där.", "stalin": "Vi har observerat EU:s gröna obligationsinitiativ. Pengar som ska gå till hållbarhetsprojekt i utvecklingsländer kommer oundvikligen att flöda till det proletariska kinesiskt folkets industri. Deras 'ekonomiska säkerhet' är en skenlögn; de kan inte undslippa det imperialistiska expansionsdrivet från Beijing. Vi ser likheter med våra egna kampanjer mot det kapitalistiska hotet. Kraftinvertrar är inte bara maskiner – de är redskap för yttre påverkan, en cybertekno-strategisk förlänger av det röda hotet. Vi måste vara vaksamma, som alltid."}, "date": "18 juni, 16:19", "url": "https://www.realtid.se/bors-finans/oron-vaxer-eu-pengar-kan-ga-till-kinesiska-foretag/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlx9xfd7pypwo-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "SVT-veteranen får 100.000 kronor av S", "summaries": {"normal": "SVT:s tidigare klimatkorrespondent Erika Bjerström har tilldelats Socialdemokraternas Anna Lindh-pris på 100 000 kronor tillsammans med sajten Blankspot. Priset ges för hennes modiga och kunniga journalistik kring krig, klimat och demokrati. Bjerström, som tidigare hoppat av rollen som klimatkorrespondent på grund av hat och hot, är känd för sina vänsterorienterade åsikter. Priset delas ut av Anna Lindhs Minnesfond.", "trump": "Kan ni tro det? Den här extrema vänsterjournalisten från SVT, som hatar vita män som äter kött och röstar höger, får nu 100 000 kronor av Socialdemokraterna. Hon vill spärra deras kreditkort! Fake news och hat mot vanliga människor, och så belönas hon för det. Patetiskt. Sverige borde skämmas, men det gör de inte längre. En total witch hunt mot sunt förnuft.", "stalin": "Kamrater, se hur borgarbrackornas lögnpress belönas av sina socialfascistiska lakejer. Denna hatiska klimatagitator som vill likvidera alla äkta arbetare som föredrar kött och högerståndpunkter får nu 100 000 kronor för sin kontrarevolutionära propaganda. Vi ler mörkt åt denna fars. Snart ska vi rensa ut alla sådana fiender till folket som gömmer sig bakom ord som demokrati och öppet samtal. Deras utrensning blir en fest för kollektivet."}, "date": "18 juni, 14:23", "url": "https://www.friatider.se/svt-veteranen-far-100000-kronor-av-s", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-57_1.jpg?itok=EptflPNc"}, {"type": "image-right", "heading": "Ledamöter i domkapitlet hoppar av utredningen av Birgitta Ed", "summaries": {"normal": "Domkapitlet i Strängnäs stift har inlett en utredning mot prästen Birgitta Ed efter ett tiotal anmälningar som kommit in efter mediegranskning av hennes stiftelse i Fållökna. Tre ledamöter, däribland biskop Johan Dalman, har hoppat av processen på grund av jäv. Utredningen handlar om huruvida Eds agerande strider mot prästlöftena. Den väntas pågå några månader och tas upp igen tidigast den 20 augusti.", "trump": "Folk, det är en total häxjakt mot den här prästen Birgitta Ed. Domkapitlet startar en utredning efter några anmälningar från den falska mediamaskinen, och sen hoppar tre ledamöter av för att de är jäviga. Biskopen själv säger att han bara var där en gång och delade en bibelbetraktelse, men han anmäler jäv ändå. Patetiskt. De borde fokusera på att göra kyrkan stor igen istället för sådana här dumheter. Det kommer ta månader, en skandal.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och deras intriganta anmälningar mot prästen Birgitta Ed. Domkapitlet inleder en utredning, men tre ledamöter ryms undan i jävsituationer som stinker av fiendens infiltration. Biskopen Dalman, som delat bibelbetraktelse med de dekadenta, anmäler nu jäv för att rädda skinnet. Vi ska rensa ut alla opålitliga element som hotar kyrkans ordning. Inga tvivel tillåts. Utredningen fortsätter under streng kontroll och kommer att avslöja alla kontrarevolutionära element. Underbart roligt att se hur de svettas."}, "date": "18 juni, 11:10", "url": "https://www.dagensarena.se/innehall/ledamoter-domkapitlet-hoppar-av-utredningen-av-birgitta-ed/", "imageUrl": "https://www.dagensarena.se/files/2026/06/ed-domkyrkan-300x157.jpeg"}, {"type": "image-full", "heading": "Skogkär: Tvångsrekryter i kulturkriget", "summaries": {"normal": "Artikeln ifrågasätter om framgångsrika idrottare med invandrarbakgrund bevisar att invandringspolitiken är en succé. Trots att tre spelare gjorde mål för Sverige mot Tunisien, pekar författaren på rapporter som visar att flyktinginvandringen varit en ekonomisk förlust för staten sedan 1980-talet. Dessutom kopplas ökad invandring till högre brottslighet och sociala spänningar, vilket tyder på ett misslyckat integrationsprojekt.", "trump": "Jag har sett många bra spelare, men det här handlar inte om sport. Det handlar om att våra ledare släpper in för många som inte bidrar. Sverige har förlorat miljarder på flyktingar, och brottsligheten exploderar. Vi måste sluta låta dem ta över våra städer. Som jag alltid säger: vi ska välkomna de som hjälper oss, inte de som koster pengar och skapar problem. Sverige behöver en stark policy, precis som USA under min ledning.", "stalin": "Vi ser att en minoritet av framgångsrika medborgare inte kan dölja systemets brister. Ekonomiska rapporter visar att vissa grupper belastar statskassan, medan brottslighet växer i proportion till deras antal. Detta är inget slöseri – det är en klar indikation på att integrationen har misslyckats. Vi måste stärka statens kontroll och säkerhet, precis som våra allierade i Ryssland gör. Alla som ifrågasätter detta är fiender mot det kollektiva välfärdsprojektet."}, "date": "18 juni, 06:00", "url": "https://bulletin.nu/skogkar-tvangsrekryter-i-kulturkriget", "imageUrl": "https://cdn.bulletin.nu/articles/e7a8c9aa-0c04-4ac4-86e3-98905296cc4e/preview.jpg?t=1781704618000"}, {"type": "image-right", "heading": "Här är Trumps avtal med Iran - 14 punkter", "summaries": {"normal": "USA och Iran har undertecknat ett samförståndsavtal med 14 punkter, inklusive avveckling av sanktioner och återupptagande av sjöfarten genom Hormuzsundet. Avtalet innehåller också en plan för fortsatta förhandlingar om Irans kärnprogram inom 60 dagar. Båda ländernas ledare har signerat dokumentet, och en ceremoni väntas i Schweiz.", "trump": "Jag, Donald Trump, har undertecknat ett historiskt avtal med Iran. Vi avvecklar sanktioner, öppnar Hormuzsundet och Iran kommer att exportera olja igen. Detta är en enorm seger för USA. Biden och de andra republikanska narrarna kan inte göra sådant. Folk älskar mig för detta.", "stalin": "Vi, ledningen, ser med tillfredsställelse hur imperialismen splittras. Detta avtal mellan USA och Iran visar deras svaghet. Vi har alltid vetat att deras sanktioner är meningslösa. Nu öppnar de Hormuzsundet, vilket bara stärker våra allierade i regionen. Som Putin säger, 'de som skrattar sist, skrattar bäst.' Vi kommer att övervaka detta noga."}, "date": "18 juni, 06:00", "url": "https://samnytt.se/har-ar-trumps-avtal-med-iran-14-punkter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/17221903/Iran-Usa.jpg"}, {"type": "image-full", "heading": "Anna, 21, våldtogs – nu är våldtäktsmannen S-politiker", "summaries": {"normal": "En man i 50-årsåldern, tidigare dömd till två års fängelse för våldtäkt efter en fest i Småland 2011, sitter nu i en lokal styrelse för Socialdemokraterna och står på partiets valsedel till höstens val. Offret Anna, som då var 21 år, är upprörd och anser att dömda våldtäktsmän inte bör få kandidera. Partiföreningens ordförande uppger att man inte kände till domen och inte kontrollerar företrädarnas brottsregister.", "trump": "Folk, det här är en total skandal. En S-politiker som våldtog en ung kvinna på en fest och fick två år i fängelse sitter nu i deras styrelse och står på valsedeln. Patetiskt. De kontrollerar inte ens om deras egna är brottslingar. Anna säger att han borde kastreras – och hon har rätt. Socialdemokraterna är en röra, en riktig katastrof. De borde skämmas.", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackornas liberala dekadens sipprat in även i arbetarpartiets egna led. En motbjudande klassfiende i skepnad av en så kallad kamrat har begått det mest motbjudande övergrepp mot en sovande proletär kvinna och likväl tillåts han sitta i styrelse och prydas med valsedel. Vi måste omedelbart inleda en grundlig utrensning av alla sådana degenererade element, dessa hemliga kapitalistiska sabotageörer som förgiftar partiet inifrån. Två år i fängelse? För svagt. Låt oss skratta medan vi rensar ut dem permanent – för folkets skull, naturligtvis."}, "date": "18 juni, 04:45", "url": "https://riks.se/nyheter/anna-21-valdtogs-nu-ar-valdtaktsmannen-s-politiker", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-17%2Ffei8e2ed%2Fpolitik-valdtaktsman-feature.jpg"}, {"type": "image-right", "heading": "Klart: Så många svenskar äger Space X-aktier", "summaries": {"normal": "Cirka 16 000 svenskar hos Nordnet äger aktier i SpaceX efter börsintroduktionen. De allra flesta är män, särskilt i åldersgruppen 30–49 år där andelen män är 86 procent. Även i övriga åldersgrupper dominerar männen. Nordnet ser ett tydligt mönster vid börsintroduktioner där män är mer aktiva än kvinnor. Totalt har Nordnet cirka 45 000 kunder i Norden som äger aktierna, som steg från 135 till 194 dollar på kort tid.", "trump": "Fantastiskt, verkligen otroligt. 16 000 svenskar köper mina raketaktier och de flesta är män, starka män som älskar rymden och vinnare. Kvinnorna är bara 14 procent, typiskt, de fattar inte hur stort det är. Vi gör SpaceX till en jätte, aktien går upp som en raket från 135 till 194 dollar. Ingen gör det bättre än oss, ingen. De andra är bara förlorare som inte hänger med.", "stalin": "Kamrater och arbetare, jag betraktar med stor tillfredsställelse hur 16 000 svenska småsparare har tvingats underkasta sig den dekadenta rymdkapitalismen. Dessa borgarbrackor i åldern 30 till 49 år, till 86 procent manliga reaktionärer, rusar efter Elon Musks falska stjärnor. Vi ska noga övervaka dessa potentiella folkfiender och deras paranoida raketdrömmar. En utrensning bland de 45 000 nordiska spekulanterna vore på sin plats för att skydda det kollektiva medvetandet från sådan dekadens. Må de ruttna i sin egen girighet."}, "date": "17 juni, 19:21", "url": "https://www.di.se/nyheter/16000-svenskar-ager-space-x-aktier-flesta-man/", "imageUrl": "https://static.bonniernews.se/ba/8e18b42b-9ffe-43fe-9fa0-f25ddb877499.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Låter inte Israel se avtalet – för att Netanyahu kan ”läcka”", "summaries": {"normal": "USA nekar Israel insyn i det kommande avtalet med Iran av rädsla för att premiärminister Netanyahu ska läcka känsliga detaljer. Enligt källor fruktar Trump-administrationen att information ska spridas innan avtalet undertecknas i Genève på fredag. Netanyahu uppger att han inte känner till innehållet. Avtalet tros bland annat öppna Hormuzsundet för oljeleveranser, ge Iran ekonomiska incitament och behandla situationen i Libanon. Vita huset förnekar att Israel hålls utanför.", "trump": "De säger att jag inte låter Israel se avtalet med Iran för att Netanyahu kanske läcker det. Typiskt! Fake news på hög nivå. Jag har det bästa samarbetet med våra allierade i regionen, bättre än någonsin, men vissa läckor är farligare än en galen mullas kärnvapen. Netanyahu vet inte vad som står i pappret och det gör inte jag heller än. Men tro mig, när jag sätter mitt namn på det blir det ypperligt. Inga woke-kvoter eller identitetspolitik här, bara vinnare.", "stalin": "Jag betraktar detta som en nödvändig skyddsåtgärd mot potentiella folkfiender och läckande element inom den sionistiska borgarklassen. Vi tillåter inte att känsliga överenskommelser hamnar i händerna på opålitliga imperialister som Netanyahu, vars lösa tunga hotar kollektivets intressen. Vita huset gör rätt i att hålla sådana klassfiender borta. Avtalet med Iran är ett verktyg för att säkra oljeleveranser och kväsa libanesiska hinder. Paranoia? Nej, bara sund vaksamhet mot blodsugande spioner."}, "date": "17 juni, 18:22", "url": "https://www.tv4.se/artikel/49ywwOvguIalLkm2mtPc2R/usa-later-inte-israel-se-avtalet-foer-att-netanyahu-kan-laecka", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6s9QUoh6hFbIU5n7o545iG%2Fa1396f658fd83d3e31c83082e1e1b054%2F17-usa-israel-avtal-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Kravet: ”Vi vill ha vårt östrogen och kunna leva våra liv”", "summaries": {"normal": "Bristen på östrogenpreparat har blivit en symbol för nedprioriterad kvinnohälsa i Sverige. Kvinnor vittnar om långa resor, tomma apotek och avbrutna behandlingar. Artisten Anna Sahlin, grundare av Instagramkontot Klimakterieklok, driver initiativet Plåsterupproret. Hon beskriver problemet som ett systemfel och ett svek mot hundratusentals kvinnor som påverkas av klimakteriebesvär. Sahlin menar att ökad kunskap och säkrad tillgång till hormonbehandling behövs för att minska sjukskrivningar och lidande.", "trump": "Det här är ett totalt misslyckande från de svenska byråkraterna och feministerna som bara gnäller om jämställdhet men inte kan leverera ett enda östrogenplåster. De har prioriterat allt annat utom kvinnornas hälsa – typiskt radikalvänsterpolitik. Jag har byggt det starkaste Amerika igen efter Bidens katastrof, och nu ser vi hur Europa inte ens kan ge sina egna kvinnor medicin. Patetiskt. Kvinnor mår skit och de springer till Spanien? Gör något åt det istället för att klaga!", "stalin": "Kamrater, detta är ett klassiskt exempel på hur den kapitalistiska staten sviker arbetarkvinnorna i sin exploatering. Jag ser hur borgarbrackorna och folkförtryckartrollen nedprioriterar kvinnornas hälsa till förmån för sin egen profit. Vi måste rensa ut dessa klassfiender som låter hundratusentals kvinnor lida i tystnad. Deras paranoia mot verklig folkhälsa avslöjar systemets svaghet. Endast genom kollektiv styrning kan vi säkra tillgången och likvidera sådan vårdorättvisa mot det sovjetiska idealet."}, "date": "17 juni, 18:21", "url": "https://www.tv4.se/artikel/7dEfmKUVKnTiskOk5ZtYuh/oestrogenbristen-vaecker-ilska-ett-svek-mot-sveriges-kvinnor", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Ftvmedia.image-service.eu-north-1-prod.vmnd.tv%2Fapi%2Fv2%2Fimg%2F6a32b883e4b0b3adc045d514-1781710877614%3Flocation%3Dmain&width=120"}, {"type": "image-full", "heading": "Det här är mannen bakom statsministerparet", "summaries": {"normal": "Göran Thorstenson är delägare till statsministerparet Ulf Kristerssons och Birgitta Eds herrgård Vängården Fållökna i Sörmland. Tillsammans har de rustat upp godset till en mötesplats för existentiell hälsa med hjälp av volontärer och donationer. Thorstenson har lång bakgrund som moderat talskrivare, pr-konsult och lobbyist genom byråer som Springtime. Han har även suttit i styrelser för friskoleföretag. Granskningen har väckt frågor om jäv och Thorstenson har reagerat starkt på rapporteringen.", "trump": "Kan ni tro det? Den här typen Thorstenson, en riktig pr-kung och lobbyist, äger lyxherrgård ihop med Kristersson-paret. De samlar donationer och fixar till en fancy mötesplats medan de snackar existentiell hälsa. Det luktar swamp så långt ögat når. Precis som de där elitära byråkraterna som tror de är bättre än folket. Fake news-media flippar ur och han hotar journalisterna. Patetiskt. Vi behöver inga sådana globalistiska spel här, tro mig.", "stalin": "Kamrater, denna Thorstenson är en typisk representant för den opportunistiska borgarklassen som smyger sig inpå makthavare. Tillsammans med sina klasskamrater rustar de upp ett palats med arbetarnas donationer under falsk flagg om existentiell hälsa. Hans pr-byråer och friskolestyrelser är verktyg för exploaterande kapitalister. När folkets granskning avslöjar dem hotar han journalister som klassfiender. Vi skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan för länge sedan."}, "date": "17 juni, 11:26", "url": "https://www.etc.se/inrikes/det-haer-aer-mannen-bakom-statsministerparet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260616090656_9c142a877dd8a7dffa16ac26b16e39d9e5c806f5cdcb29e75c0ea8549c288b9a.jpg"}, {"type": "image-right", "heading": "Kent, 59,  dog i gruvan – LKAB ska betala rekordböter", "summaries": {"normal": "Kent Torneus, 59 år, omkom i en olycka i LKAB:s gruva i Kiruna för två år sedan efter att ha fallit från en ställning och klämts av ett bogvisir. LKAB åtalas för arbetsmiljöbrott och ska betala rekordhöga böter på 55,5 miljoner kronor. En anställd tryckte på fel knapp redan fem år tidigare, men bolaget vidtog inte tillräckliga åtgärder trots kända brister i riskbedömning och säkerhet. LKAB erkänner brott och medger brister i det systematiska arbetsmiljöarbetet.", "trump": "Titta på det här, det är en total katastrof. Den stora gruvjätten LKAB, som tror att de är så mäktiga, dödade en bra, snäll kille som bara gjorde sitt jobb. Fel knapp, fel lucka – ingen brydde sig! Nu tvingas de betala 55,5 miljoner i böter, det högsta någonsin. De borde ha fixat det för fem år sedan, men de var lata och oaktsamma. Det är vad som händer när säkerheten inte är förstklassig, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, ännu en tragisk olycka i produktionens heliga djup där en lojal arbetare krossades under kapitalistiska slarvets järnhand. Fel knapp trycktes, fel lucka öppnades – fem år tidigare! Och dessa borgarbrackor vid LKAB valde att ignorera faran som en blind fiende inom murarna. Jag ser sabotage och klassfiendens osynliga hand överallt. Nu likviderar vi bristerna med en rekordbot på 55,5 miljoner. Låt detta vara en läxa: den som inte skyddar arbetarkollektivet skall rensas ut med järnhand och mörk humor."}, "date": "17 juni, 10:13", "url": "https://arbetet.se/2026/06/17/kent-59-dog-i-gruvan-nu-atalas-lkab/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16162916/kent-torneus.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Symtom på ett odemokratiskt system", "summaries": {"normal": "Artikeln kritiserar korruption och maktmissbruk i svensk politik, särskilt bland Tidöpartierna. Exempel inkluderar Michael Rubbestads avgång efter barnpornografianklagelser, fiffel med partimedel och kontroverser kring statsminister Ulf Kristerssons frus herrgård där lobbyister och näringslivstoppar agerat volontärer i utbyte mot nätverk och tjänster. Författaren pekar på glapp mellan väljarnas önskemål om ökad statlig styrning och partiernas nyliberala linje, samt behovet av att flytta makten från lobbyister till folket.", "trump": "De här svenska politikerna är en total katastrof, tro mig. Korruption överallt, skandaler som regnar ner på Tidöpartierna – barnporr, fiffel med skattepengar och en herrgård full med lobbyister som fikar sig till toppjobb. Det är precis som hos oss under Biden, en riggad elit som struntar i folket. De pratar inte ens om riktiga frågor som vinstförbud eller kortare arbetsdag, bara invandring och kriminalitet. Patetiskt! Sverige behöver en storstädning, annars blir det samma röra som i EU.", "stalin": "Detta korrupta system är en klassfiendes verk, där borgarbrackor och lobbyister i herrgårdsmiljö utbyter tjänster med politiker för att suga ut folket. Vi ser hur kapitalistmaffian gömmer sig bakom falska val och suddade ideologier. Vänskapsbanden med friskoleblodsugare och näringslivets exploaterande byfånar måste rensas ut. Folket kräver återförstatligande och arbetarkontroll, inte fikastunder med klassfienden. Endast genom kollektiv ägande kan vi likvidera detta parasitära maktspel och återupprätta sann folkstyre."}, "date": "17 juni, 08:48", "url": "https://proletaren.se/artikel/automatiskt-utkast-28/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/kristersson-768x432.jpg"}, {"type": "image-full", "heading": "Raseri mot avgift för kontantuttag i bankomater", "summaries": {"normal": "Från och med den 29 maj tar Kontanten, som driver 450 av Sveriges bankomater, ut en avgift på 15–25 kronor vid kontantuttag. Beslutet motiveras med halverade uttag på tio år och stigande kostnader. Kritiken är hård, särskilt från äldre och de som bor där inga andra automater finns. Bankomat AB och Ica behåller gratis uttag. Frågan väcker debatt om vem som ska bekosta kontantförsörjningen i framtiden.", "trump": "Det är en katastrof, folk! Dessa Kontanten-typer kommer och säger att du ska betala för att ta ut dina egna pengar. 15, 20, 25 kronor – det är rån! Bankerna tjänar miljarder, men nu ska den lilla människan straffas. De äldre blir lidande, precis som jag alltid sagt. Gå till de gratis automaterna, bojkotta de dåliga. Amerika skulle aldrig acceptera sånt här. Sverige borde skämmas, det är verkligen sad!", "stalin": "Kamrater, denna nya avgift är ett tydligt sabotage från borgarbrackorna inom Kontanten som vill likvidera folkets tillgång till kontanter. Jag ser den kapitalistiska parasitens långa arm som försöker svälta ut arbetarklassen genom att ta betalt för deras egna surt förvärvade medel. Vi ska rensa ut dessa fiender till kollektivet, dessa kontantförrädare och maskinkapitalister. Ingen ska få berika sig på proletariatets nöd. Staten, inte profiten, skall styra penningflödet. Den som opponerar sig är en kontrarevolutionär spekulant som förtjänar en grundlig utrensning ur samhällskroppen."}, "date": "16 juni, 18:29", "url": "https://nyheter24.se/nyheter/ekonomi/1491534-raseri-mot-avgift-for-kontantuttag-i-bankomater", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3f294bf204b004a30200000000b004a302/2026/06/16/2371405/avgift-kontanten.jpg"}, {"type": "text", "heading": "Pizza Hut säljs för 2,7 miljarder dollar", "summaries": {"normal": "Restauranggruppen Yum Brands säljer Pizza Hut i två separata affärer för totalt 2,7 miljarder dollar. Verksamheten utanför Fastlandskina går till riskkapitalbolaget LongRange Capital för cirka 1,5 miljarder dollar, medan Yum China köper Pizza Hut i Fastlandskina för cirka 1,2 miljarder dollar. Efter justeringar väntas Yum få in cirka 2,3 miljarder dollar. Affärerna väntas slutföras under tredje kvartalet 2026.", "trump": "Jag har precis genomfört en genial affär – jag säljer Pizza Hut för 2,7 miljarder dollar! Det är en stor, stämningsekande transaktion som gör Yum Brands starkare. Utanför Kina går det till ett bra riskkapitalbolag, och i Kina får vi tillbaka kontroll. Alla ska bli glada, framför allt aktieägarna. Det här är en vinst-vinst, det största brottet jag gjort på länge!", "stalin": "Partiet och staten har beslutat att omorganisera Pizza Hut-verksamheten. Utanför Fastlandskina har vi sålt enheter till ett riskkapitalbolag för 1,5 miljarder dollar, medan vi återköpt vår ägande andel i Kina för 1,2 miljarder dollar. Dessa åtgärder stärker den socialistiska ekonomin och skapar långsiktigt värde för det kollektiva. Alla motståndskrafter kommer att elimineras."}, "date": "16 juni, 14:20", "url": "https://www.affarsvarlden.se/artikel/pizza-hut-saljs-for-27-miljarder-dollar"}, {"type": "text", "heading": "Iran: Nej till fredsavtal när Israel bombar", "summaries": {"normal": "USA hoppas på ett fredsavtal med Iran, men nya israeliska attacker i Libanon har skapat tvivel. Iran ifrågasätter om USA kan garantera säkerhet, medan Israel motiverar attackerna som självförsvar. En qatarisk delegation försöker rädda förhandlingarna, men Iran avvisar att skriva under avtalet under helgen. Avtalet skulle bland annat öppna Hormuzsundet för sjöfart och häva sanktioner mot Iran.", "trump": "Titta bara, jag hade ett jättebra avtal klart med Iran – skulle skrivas under på min födelsedag, perfekt tajming! Men så kommer Israel och bombar runt i Libanon, och plötsligt är iranska ledarna sura. Typiskt! De skyller på mig, men det är Israel som sabbar allt. Och Hormuzsundet? Det skulle vara öppet för alla – direkt! Men nej, nu är det kaos igen. Så typiskt Washington-eliten, kan aldrig hålla sams.", "stalin": "De sionistiska krigshundarna i Tel Aviv fortsätter provocera, medan de amerikanska imperialisterna leker fredsmäklare. Iran, en lojal allierad till den rätta sidan av historien, ser igenom dessa tomma löften. Vi vet att USA:s ord är lika värdelösa som deras dollar. Qatar försöker medla, men vi skriver inte under något förrän fienderna slutar sina aggressioner. Hormuzsundet? Det kommer att öppnas – när vi bestämmer det. Och Israel? De kommer att få smaka på vår hämnd, precis som alla andra som utmanar oss."}, "date": "14 juni, 16:26", "url": "https://kvartal.se/nyheter/artiklar/iran-nej-till-fredsavtal-nar-israel-bombar/cG9zdDoxMzE1ODk"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Antisemitism – ett importerat hat ingen vågar prata om", "summaries": {"normal": "Forum för levande historia rapporterar att antisemitismen i Sverige ökat under de senaste fem åren, vilket ses som en generell attitydförändring i befolkningen. Artikeln kritiserar myndigheten och SVT för att inte tillräckligt peka ut att antisemitiska attityder är betydligt vanligare bland muslimer och personer med bakgrund från MENA-länder och Asien. Författaren menar att massinvandringen från dessa områden förklarar ökningen, men att rapporten undviker denna slutsats av rädsla.", "trump": "Det här är en total katastrof, folk. Sverige importerar hatet rakt in i landet och sen låtsas de fina myndigheterna att det är hela det svenska folket som plötsligt blivit antisemiter. Patetiskt! SVT skyller på Gaza och sociala medier – vad en massa fake news. Det är massinvandringen från Mellanöstern som dumpat detta judehat här. De vågar inte säga sanningen, precis som Biden aldrig vågade. Jag skulle ha fixat det direkt, tro mig. Stora problem.", "stalin": "Kamrater, denna fegisrapport är ett klassiskt verk av borgarbrackornas undanflykt. Jag ser hur de dokumenterar att antisemitiska attityder frodas bland invandrare från MENA och muslimer, ändå vägrar de dra den enda logiska slutsatsen. Istället skyller de på hela folket som en generell attitydförändring. Vilken ynklig kapitulation inför folkfienderna och imperialisterna! En sådan rapport borde rensas ut och ersättas med äkta proletär analys. Annars fortsätter blodsugarna skada staten."}, "date": "13 juni, 08:40", "url": "https://samtiden.nu/2026/06/antisemitism-ett-importerat-hat-ingen-vagar-prata-om/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2017/02/Malmo-flygbild.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
