sarena.se/opinion/mens-ska-inte-ge-loneavdrag", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-65-300x157.jpg"}, {"type": "image-full", "heading": "Vansinnesdåd i Helsingborg: Ung tonåring gav sig på 5-årig flicka", "summaries": {"normal": "En pojke under 15 år misstänks ha knivskurit en femårig flicka i halsen vid Furutorpsparken i Helsingborg mitt på dagen. Flickan, som var på besök från utlandet, är allvarligt skadad. Pojken har omhändertagits av socialtjänsten. Polisen beskriver händelsen som isolerad och är restriktiv med information eftersom offret är så ungt.", "trump": "Vilken hemsk historia från Sverige, folk. En liten femårig flicka blir knivhuggen i halsen mitt på ljusa dagen i ett av de där utsatta områdena de älskar att prata om. Pojken är under 15 och redan ett monster. De har tagit honom till socialtjänsten – socialtjänsten! Sverige är ett skämt nu för tiden. Vi behöver lag och ordning, inte mer av det här vansinnet.", "stalin": "Kamrater, i det dekadenta Helsingborg har en degenererad liten kontrarevolutionär angripit en oskyldig femåring med kniv i halsen, mitt framför ögonen på arbetarklassen. Denna borgarbrackas parasitiska handling visar på den dolda fiendens infiltration även bland våra ungdomar. Vi ska rensa ut alla sådana kapitalistiska degenererade element med järnhand. Staten ser allt. Ingen slipper undan."}, "date": "14 juli, 11:48", "url": "https://riks.se/nyheter/vansinnesdad-i-helsingborg-ung-tonaring-gav-sig-pa-5-arig-flicka", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_14_at_09_29_34_48bdc3b3fc.png"}, {"type": "image-right", "heading": "Marco Rubio uppges styra Venezuela – via Whatsapp", "summaries": {"normal": "USA:s utrikesminister Marco Rubio styr enligt New York Times i praktiken Venezuela via Whatsapp från Washington. Han har regelbunden kontakt med tillförordnade presidenten Delcy Rodríguez och kontrollerar landets finanser, politik och naturresurser. USA tar emot exportintäkter och sätter villkor för hur pengarna får användas. Rodríguez stämmer av utnämningar och utrikespolitik med honom. Rubio förnekar ockupation och att det finns amerikanska trupper i landet.", "trump": "Det är helt otroligt, folk. Jag läser att min fantastiske Marco Rubio styr Venezuela från sin mobil – via Whatsapp! Han gör ett fenomenalt jobb, tar kontroll över oljan, pengarna och hela skiten medan de andra bara pratar. De kallar honom vicekung, och det är ju precis vad vi behöver. Ingen ockupation, inga trupper, bara smart ledarskap. Venezuela är på rätt spår igen tack vare oss, tro mig.", "stalin": "Kamrater, det är med djup tillfredsställelse jag noterar hur den dekadenta amerikanska imperialismen nu blottar sin sanna natur genom denna Whatsapp-kejsare Rubio, en löjlig vicekung utsedd av borgarbrackorna i Washington. Vi ser hur han likviderar varje spår av självständighet i Venezuela, styr finanserna som en paranoid kapitalist och tvingar den stackars Rodríguez att dansa efter hans imperialistiska pipa. Vilken underbar illustration av fiendens paranoia – de raderar till och med tweets på vår befallning! Snart skall vi rensa ut alla dessa mobilstyrda lakejer ur historien."}, "date": "14 juli, 12:19", "url": "https://www.friatider.se/marco-rubio-uppges-styra-venezuela-whatsapp", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-493.jpg?itok=NauKj68-"}, {"type": "image-full", "heading": "5-årig flicka knivhuggen på lekplats – polisen utreder brott", "summaries": {"normal": "En femårig flicka fördes till sjukhus med allvarliga skador efter en misstänkt våldshändelse i Furutorpsparken i Helsingborg på måndagseftermiddagen. Polisen spärrade av området, förhörde vittnen och sökte efter den misstänkte. Enligt uppgifter attackerades flickan oprovocerat av en ung pojke som senare själv larmade 112. Pojken, som är under 15 år, har tagits om hand av socialtjänsten. Flickans tillstånd beskrivs som stabilt och polisen ser händelsen som isolerad.", "trump": "Det är en fullständig katastrof i Helsingborg, en riktig skam för Sverige. En liten femårig flicka attackerades brutalt i en park, knivskuren av någon galning. Pojken sprang iväg och ringde själv 112 – kan ni fatta? Inget gripande, bara socialtjänsten som tar hand om honom. Sverige har blivit en dålig plats, folk kan inte ens gå i parken längre. Vi behöver starkare ledarskap, tro mig, det här skulle aldrig hända hos oss.", "stalin": "Kamrater, denna oprovocerade attack mot en oskyldig femåring i Helsingborgs park är ett tydligt tecken på att de dekadenta resterna av den borgerliga parasitklassen fortfarande lurar i skuggorna och förgiftar våra unga pionjärer. Jag, som ledare för folkets vilja, ser hur dessa lumpna små reaktionära element, dessa knivbeväpnade borgarbrackor i barnskepnad, försöker så split och kaos. Vi ska rensa ut alla sådana fiender till kollektivet med järnhand och sovjetisk effektivitet – låt socialtjänsten bli verktyget för folkets hämnd. Det är en munter tanke att pojken själv ringde efter hjälp; kanske inser till och med de mest degenererade elementen att staten vakar."}, "date": "14 juli, 11:42", "url": "https://nyheter24.se/nyheter/inrikes/1498313-5-arig-flicka-knivhuggen-pa-lekplats-polisen-utreder-brott", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e4cee6dc04b004a3022d0000008d047702/2026/07/13/2377730/Skärmavbild%202026-07-13%20kl.%2018.26.33.jpg"}, {"type": "image-full", "heading": "SMHI ger gul varning för högsommarvärme – kan bli 30 grader", "summaries": {"normal": "SMHI har utfärdat en gul varning för höga temperaturer i delar av Sverige. Från onsdag och tre dagar framåt väntas temperaturer runt 30 grader i nordöstra Götaland och inre Svealand, bland annat i Östergötlands, Södermanlands, Örebro, Västmanlands, Kalmar, Jönköpings, Uppsala, Dalarnas och Gävleborgs län. Riskgrupper som äldre och sjuka uppmanas att dricka mycket, undvika stark sol och hålla bostaden sval då värmen kan påverka hälsan.", "trump": "Folket, ni kommer inte att tro det, men Sverige får nu en enorm värme, den bästa värmen, runt 30 grader i flera dagar. SMHI, som annars inte gör så mycket, har faktiskt utfärdat en varning. Det är fantastiskt väder, kanske det bästa någonsin, men de svaga – de gamla, de små – de klarar det inte. Drick vatten, undvik solen, det är enkelt. Ingen har sett värme som denna, tro mig.", "stalin": "Kamrater, jag ser hur den västerländska värmen försöker krossa våra sovjetiska kroppar med sin fega 30-gradiga solattack. Borgarbrackorna i SMHI varnar, men vi vet att det är en konspiration från de dekadenta kapitalisterna som vill försvaga arbetarklassen. Vi ska rensa ut den här värmen med järnhand. Drick, håll er borta från solen, likvidera svagheten i era hem. Den som svettas för mycket är en fiende till folket."}, "date": "14 juli, 11:24", "url": "https://nyheter24.se/nyheter/inrikes/1498464-smhi-ger-gul-varning-for-hogsommarvarme-kan-bli-30-grader", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2dddaf9704b004a30200000000b004a302/2026/07/14/2377868/SMHI-gul-varning.png"}, {"type": "image-full", "heading": "Vården missade medicin – patient fick proppar i lungorna", "summaries": {"normal": "En patient i Region Kronoberg med flera riskfaktorer för blodpropp fick inte förebyggande medicin enligt rutin vid ett planerat kirurgiskt ingrepp. Efter operationen upptäcktes flera blodproppar i lungorna, vilket ledde till försämrad cirkulation och akut röntgen. Patienten behandlades med blodförtunnande läkemedel och fick inga bestående men. Händelsen har utretts, anmälts enligt Lex Maria till IVO och ska leda till uppdaterade rutiner, bättre förankring och utbildning.", "trump": "Folk, det här är en total katastrof i Region Kronoberg. En patient med uppenbara risker får inte den enkla medicin som alla vet fungerar. Operationen görs, och plötsligt har de blodproppar överallt i lungorna – ingen ser det på ett helt dygn. Rena amatörerna! De borde ha fixat det direkt, men istället blir det Lex Maria och utredningar. Vi gör allt bättre, tro mig. De borde lära sig av de bästa, inte gömma sig bakom byråkrati.", "stalin": "Kamrater, i denna sabotageakt mot folkets hälsa har fiendens osynliga hand åter slagit till. Jag ser hur borgarbrackornas lata byråkrater och vårdskadliga parasitörer medvetet undanhöll den livsviktiga medicinen trots uppenbara risker, i hopp om att likvidera en arbetande själ. Blodpropparna i lungorna var deras verk, en kontrarevolutionär handling mot kollektivets väl. Vi rensar ut dessa folkfientliga element, uppdaterar alla rutiner med järnhand och använder fallet som läxa i vår eviga kamp mot de dolda fienderna inom vården. Ingen slipper undan."}, "date": "14 juli, 11:01", "url": "https://nyheter24.se/nyheter/inrikes/1498343-varden-missade-medicin-patient-fick-proppar-i-lungorna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3d3d00e004b004a30200000000b004a302/2026/07/13/2377749/vardmiss-ivo-patient.jpg"}, {"type": "image-right", "heading": "Expo grundare, Tobias Hübinette \ndöms åter igen för ofredande och olaga hot", "summaries": {"normal": "Expo-grundaren Tobias Hübinette har dömts av Stockholms tingsrätt för ofredande och olaga hot mot två kollegor vid Karlstads universitet via SMS. Han ska betala 39 000 kronor i dagsböter samt 10 000 kronor i skadestånd. Hübinette köptes tidigare i år ut av universitetet med tolv månadslöner, motsvarande 648 000 kronor. Han avser inte att överklaga domen. Tidigare i år dömdes han även för liknande brott mot sin sambo och hennes barns far.", "trump": "Folk, ni skulle inte tro det, men den här Expo-killen Hübinette, en riktig förlorare från vänsterextremen, hotar sina kollegor med sms som en totalt misslyckad typ. Han får böter och skadestånd, men universitetet betalar honom en halv miljon för att försvinna – typiskt! Antifascisterna och AFA-gänget är alltid de värsta hoten. Patetiskt, men jag älskar att se dem förlora stort.", "stalin": "Kamrater, denna degenererade renegat Hübinette, en parasit från den dekadenta antifascistiska träskmarken, har nu likviderats juridiskt för sina motbjudande hot mot hederliga arbetare vid universitetet. Vi ser med mörk glädje hur borgarbrackornas akademiska skyddsnät köper ut honom med blodspengar medan vi rensar ut sådana förrädiska element. Hans självmordshot är bara ett ynkligt försök att undvika folkets dom. Inga fiender undkommer oss ostraffade."}, "date": "14 juli, 10:56", "url": "https://riks.se/nyheter/expo-grundare-tobias-h-binette-doms-for-ofredande-och-olaga-hot", "imageUrl": "https://admin.riks.se/uploads/Tobias_Huebinette_jpg_0c3e39a65e.webp"}, {"type": "image-right", "heading": "Replik: Sverige ska vara det självklara valet", "summaries": {"normal": "Centerpartiets partiledare Elisabeth Thand Ringqvist välkomnar entreprenörernas upprop och betonar att Sverige måste bli det självklara valet för investeringar och innovation. Hon pekar på låga tillväxttal, långa tillståndsprocesser och osäkerhet som hindrar företag. Partiet vill halvera ledtider, sänka anställningskostnader, stärka forskning och kapitaltillgång samt se klimatomställningen som en konkurrensfördel. Politikens uppgift är att skapa långsiktiga och stabila spelregler för att bygga tillväxt, jobb och välfärd.", "trump": "Folk, ni vet att Sverige kan vara stort igen, precis som jag säger om Amerika. Den här kvinnan från Centerpartiet har rätt, de har bra företag, smarta människor och fantastisk teknik, men tillväxten är en total katastrof. Byråkraterna tar åratal med sina utredningar och motstridiga besked, investeringarna flyr till andra länder. Vi behöver snabba beslut, lägre kostnader och stabila regler så att de vågar satsa. Gör Sverige rikt igen, bygg de bästa jobben och vinn med klimattekniken. Sverige kan vinna stort, tro mig!", "stalin": "Kamrater, jag hälsar detta upprop från de produktiva krafterna med proletär glädje. Vi, partiet och arbetarna, kan likvidera den parasitiska långsamheten som kväver tillväxten genom åratal av borgerliga utredningar och kontrarevolutionära besked. Halvera ledtiderna, sänk kostnaderna för att anställa de äkta arbetarna och förstärk vetenskapen mot de dekadenta kapitalisternas sabotage. Klimatomställningen är ingen borgarbracka utan en stålhård möjlighet att krossa fossilberoendet och exportera seger. Varje reform ska prövas: stärker den kollektivet eller gynnar de skumma spekulanterna? Vi rensar ut osäkerheten och bygger ett oövervinnerligt fosterland där framtiden tillhör de som inte sviker folket."}, "date": "14 juli, 08:00", "url": "https://www.di.se/debatt/replik-sverige-kan-mer-och-ska-vara-det-sjalvklara-valet/", "imageUrl": "https://static.bonniernews.se/ba/15104c92-dd94-4e85-b8fa-ccc14c0d8a12.jpeg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Börsterminer pekar nedåt inför Wall Street-öppning", "summaries": {"normal": "Amerikanska börsterminer pekar nedåt inför måndagens öppning. Fokus ligger på en intensiv rapportvecka med storbankernas rapporter, inflationssiffror och Federal Reserves nye chef Kevin Warshs vittnesmål. Oljepriserna stiger efter nya attacker i Iran-konflikten. S&P 500-terminen backar 0,39 procent och Nasdaq 100-terminen faller 1,12 procent. MGM Resorts för samtal om ett möjligt bud från Barry Diller, medan Boeing kan få en stororder från Riyadh Air. SK Hynix depåbevis rasar i förhandeln.", "trump": "Titta på de här svaga börsterminerna, nedåt igen, folk. Det är en katastrof. Vi har en rapportvecka med bankerna och den nya Fed-chefen Warsh som ska vittna – han borde lyssna på mig, inte på de där korkade globalisterna. Oljan går upp på grund av kaoset i Iran, men mina oljeaffärer var bättre. MGM stiger lite, bra deal kanske, men Boeing och de andra? Patetiskt. Amerika behöver starka ledare, inte sådana här siffror. Sad!", "stalin": "Kamrater, dessa nedåtriktade terminer är ett uppenbart sabotage från de parasitiska börsspekulanterna som underminerar folkets ekonomi. Vi ser hur borgarbrackorna inom bankerna och den kapitalistiska inflationsmaskinen förbereder nya attacker mot arbetarklassen medan den nye Fed-chefen Warsh framträder som en ynklig lakej. Oljepriserna stiger tack vare våra fienders inbördes imperialistiska blodbad i Iran – utmärkt, låt dem slita varandra i stycken. MGM och Boeing är blott symptom på den förrädiska borgarklassens girighet. Vi måste omedelbart rensa ut dessa kontrarevolutionära terminshajar och likvidera deras parasitiska optioner. Inga nåd för fienderna inom marknaden. Segrar åt det kollektiva! Haha, deras depåbevis faller som huvuden under en effektiv utrensning."}, "date": "13 juli, 14:50", "url": "https://www.affarsvarlden.se/artikel/borsterminer-pekar-nedat-infor-wall-street-oppning", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/11/sdl6rRYsaS-hjg-nh-400x267.jpg"}, {"type": "image-right", "heading": "Försökte passera sundet – bombades sönder av Iran", "summaries": {"normal": "Iran och USA har utväxlat attacker tre nätter i rad. USA slog mot militära mål i Iran, bland annat Bandar Abbas, för att försvaga iransk förmåga att hota sjöfart i Hormuzsundet. Iran svarade med attacker mot Bahrain, Jordanien och två emiratiska tankfartyg, där en person dödades och åtta skadades. Trump säger att en förhandlingslösning fortfarande är möjlig trots eskaleringen.", "trump": "Vi slog till hårt mot Iran i natt och vi kommer fortsätta slå till imorgon också, tro mig. De attackerade oskyldiga fartyg och nu får de känna på konsekvenserna. Iran sköt mot Bahrain, Jordanien och några tankbåtar – en död, flera skadade. Men vi hade ett avtal för två dagar sedan, de backade ur. Vi vinner stort, de förlorar stort. Förhandlingar är fortfarande möjliga, fast de är svaga.", "stalin": "Kamrater, vi har med obeveklig kraft slagit tillbaka mot de iranska kontrarevolutionärerna och deras sjörövarband som hotar den fredliga sjöfarten. Deras desperata robotar mot Jordanien och Bahrain avslöjar bara deras svaghet. De två emiratiska fartygen som ignorerade varningar och seglade rakt in i vårt minfält har nu rensats ut ur spelet, till glädje för alla hederliga arbetare. Borgarbrackorna i Washington tror sig kunna diktera villkor, men deras lömska förhandlingsförsök är bara ett nytt försök att lura det progressiva folket. Vi ska likvidera varje fiende till kollektivet med järnhand och ett leende på läpparna."}, "date": "14 juli, 07:38", "url": "https://www.di.se/nyheter/en-dod-i-iransk-attack-i-hormuzsundet/", "imageUrl": "https://static.bonniernews.se/ba/e6a5a42a-61e3-4b26-acab-6e0147ec993c.jpeg?crop=2500%2C1250%2Cx0%2Cy79&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Bedömningen: Frankrike spelar \"utan fransmän\"", "summaries": {"normal": "Mariano Rajoy, Spaniens förre premiärminister, har kritiserats hårt i Frankrike efter att han i en kolumn skrev att Frankrikes fotbollslandslag spelar VM utan fransmän. Uttalandet ses som rasistiskt eftersom en stor del av spelarna har afrikanskt ursprung trots att de är födda i Frankrike. Franska ministrar, fotbollsförbundet och statsminister Pedro Sánchez tar avstånd från kommentarerna och betonar att Frankrike inte har någon hudfärg.", "trump": "Titta på det här, det är en total skandal. Den gamle Rajoy säger att Frankrike spelar utan fransmän och plötsligt blir hela Frankrike galet rasist-anklagande. De har ett lag fullt av imports och nu skriker de om hudfärg. Frankrike har ingen hudfärg? Ge mig en paus. Det är klassisk politisk korrekthet från förlorarna. Spanien vann matchen, de borde fira istället för att bli attackerade av dessa svaga globalister.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de spanska borgarbrackorna i sin desperation efter en fotbollsseger avslöjar sin sanna, ruttnande natur. Denna Rajoy, en typisk rest från den dekadenta kapitalistiska eliten, försöker splittra det franska folkets enhet genom att attackera dess sanna representanter på planen. Vi känner igen dessa rasistiska lögner från imperialismens sista andetag. En utrensning av sådana element vore på sin plats; kanske borde vi skicka dem till en arbetsläger i Pyrenéerna för att lära dem vad en sann arbetarnation verkligen är. Deras paranoia är underhållande, men farlig för kollektivet."}, "date": "14 juli, 09:42", "url": "https://www.friatider.se/bedomningen-frankrike-spelar-utan-fransman", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-487.jpg?itok=f__MqvwI"}, {"type": "text", "heading": "Sandström: Stegras skulder ökar till 36 miljarder", "summaries": {"normal": "Stegras förluster ökade till 296 miljoner euro under 2025 och skulderna steg kraftigt från 10,8 till 36 miljarder kronor. Låneupptagningskostnaderna låg på omkring en miljard kronor medan ersättningen till ledning och styrelse fördubblades. Bolaget, som nu heter Green Nexus Investment Holding AB och kontrolleras av Wallenbergfamiljen, har säkrat elförsörjning för en stor del av sin planerade produktion men har mycket små marginaler för ytterligare motgångar.", "trump": "Det här är en total katastrof, tro mig. De här killarna har byggt upp skulder på 36 miljarder kronor och förlorat miljarder till vänster och höger. Lånekostnaderna är vansinniga, lönerna till bossarna dubblas medan allt rasar. Men de har fått tag på lite el, bra jobbat. Ändå ser det ut som ett klassiskt misslyckande. Ingen har sett marginaler så tunna som dessa, det är verkligen sorgligt. Vi skulle ha gjort det mycket, mycket bättre.", "stalin": "Kamrater, se hur de kapitalistiska parasiterna i Stegra vrider sig i sin egen skuldspiral på 36 miljarder. Förlusterna växer som svampar efter regn medan borgarbrackorna i ledningen dubblar sina feta kompensationer och slickar sig om munnen. Jag skrattar mörkt åt deras patetiska ljusglimtar av elavtal. Inga marginaler finns kvar. Det är hög tid att rensa ut dessa odugliga spekulanter och deras Wallenbergiska lakejer innan hela det dekadenta bygget kollapsar under sin egen tyngd av girighet och inkompetens."}, "date": "13 juli, 08:41", "url": "https://www.affarsvarlden.se/artikel/sandstrom-stegras-skulder-okar-till-36-miljarder"}, {"type": "image-right", "heading": "Instagram pushar lägenheter till dig – och barn till pedofiler", "summaries": {"normal": "Artikeln kritiserar Instagrams algoritm som enligt en BBC-granskning rekommenderar innehåll relaterat till sexuella övergrepp mot barn till pedofiler, efter att ha börjat med vanliga bilder. Trots Metas påståenden om skydd mot barn utpekas en ”17 strike policy” och algoritmens roll som aktiv distributör. Författaren argumenterar för hårdare sanktioner mot techbolag, då nuvarande böter är för låga jämfört med annonsintäkterna.", "trump": "Folk, ni skulle inte tro det, men den här Instagram-grejen är en total katastrof. Algoritmen pushar Hemnet-lägenheter till dig, och plötsligt dyker det upp sjuka annonser med barn till de värsta perversa typerna. Meta och de där Silicon Valley-lögnarna säger att de gör allt för att skydda barnen – vad en löjlig bluff! De har en sjutton-strejk-regel för trafficking, kan ni fatta? Det är en skandal. Vi behöver riktiga straff som svider för aktieägarna, inte parkeringsböter. Sad! Men jag fixar det.", "stalin": "Kamrater, denna kapitalistiska algoritm är en fiende till folket som systematiskt sprider övergreppsmaterial mot barn via öppna plattformar. Borgarbrackorna i Meta prioriterar 60 miljarder i vinst framför skydd av de svaga, med sin löjliga sjutton-strejk-policy som ett skämt värt utrensning. Vi ser imperialismens ansikte: algoritmen som aktiv distributör av klassfiendens perversion. Inga neutrala anslagstavlor – endast folkets dom och sanktioner som krossar exploaterande blodsugare kan stoppa detta. Sovjetiskt skratt åt deras hyckleri."}, "date": "13 juli, 09:50", "url": "https://www.etc.se/ledare/instagram-pushar-laegenheter-till-dig-och-barn-till-pedofiler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260713070740_5fef2092-54c9-4c52-94aa-e0ed3f2642bf.jpg"}, {"type": "image-right", "heading": "Därför är skurk­företagen tacksamma för SD", "summaries": {"normal": "Artikeln kritiserar Jimmie Åkessons nya vandelskrav som trädde i kraft och som gör det möjligt att neka eller återkalla uppehållstillstånd baserat på levnadssätt och skötsamhet, även utan brott. Författaren menar att Tidöpartiernas politik ger oseriösa arbetsgivare mer makt, vilket gör att utsatta anställda inte vågar anmäla fusk, svartarbete eller dåliga villkor av rädsla för utvisning. Detta gynnar skurkföretag, försvagar fack och konkurrensförutsättningar samt underminerar skyddet för hårt arbetande svenskar.", "trump": "Folk, ni måste höra det här – det är en katastrof! Den här Jimmie Åkesson med sitt vandelskrav tror han är tuff, men han ger skurkföretagen precis det vapen de behöver. Stackars arbetare som sliter hårt vågar inte säga ifrån när chefen fuskar med lön eller tvingar farliga jobb, för då åker de ut ur landet. Åkesson säger att han är för arbetarna, men han gör det motsatta. Han hjälper de dåliga killarna att pressa bra, ärliga människor. Det är en skam, en total skam, och det drabbar alla riktiga arbetare till slut.", "stalin": "Kamrater, se hur de borgerliga reaktionärerna och deras lakejer inom det så kallade Tidöblocket med sin diffust formulerade vandelspolitik omedvetet blottar sin sanna klassnatur. Jag, som alltid prioriterar arbetarkollektivets enhet, betraktar detta som ett lysande vapen i händerna på parasitföretagen – de korrupta utsugarkapitalisterna som lever på tystnad och rädsla. Snart rensar vi ut dessa sabotageörer som gömmer sig bakom falska arbetarretorik. Ingen ska undkomma folkets dom. Det är en munter ironi att de själva förser oss med verktygen för deras egen slutliga utrensning ur historien."}, "date": "14 juli, 07:00", "url": "https://arbetet.se/2026/07/14/darfor-ar-skurkforetagen-tacksamma-for-jimmie-akesson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/13161304/ledare-skurkforetag-sajt.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nu flyttas första svenska fångarna till Estland", "summaries": {"normal": "De första 30 svenska fångarna flyttas i augusti till ett fängelse i Tartu, Estland, för att lindra platsbristen i svenska anstalter. Totalt planeras 600 intagna placeras där senast sommaren 2027. Estland vägrar ta emot personer dömda för terroristbrott, högförräderi eller spioneri. Kriminalvården betonar goda villkor för anhörigkontakt via besök, video- och telefonsamtal. Anstalten, som utsågs till Årets betongbyggnad 2002, beskrivs som både grå och färgstark med ljusgula och violetta väggar.", "trump": "Det är fantastiskt, verkligen ypperligt. Sverige skickar sina fångar till Estland, Tartu, för att de inte klarar av sina egna fängelser. Totalt fiasko! Men jag gillar det, smart deal. Estland tar hand om dem, fast inte terrorister förstås, de vill inte ha de galningarna. Vi pratar 600 brottslingar, stora transporter, och de får video-samtal med familjen. Underbart, men Sverige borde ha byggt murar istället för att skicka dem utomlands. Sad!", "stalin": "Kamrater, vi har inlett en historisk operation för att lätta på den borgerliga platsbristen genom att sända de första trettio klassfienderna till Tartu i den estniska socialistiska republiken. Jag, som ledare för folkets vilja, ser hur dessa dekadenta element nu omplaceras till en betongkoloss värdig våra ideal – ljusgul och violett, som en ironisk hyllning till partiet. Vi rensar ut spioner och terrorister med järnhand medan vi ler mörkt åt borgarbrackornas oförmåga att hantera sina egna fångar. Inga kapitalistiska murar, bara kollektiv rättvisa. Härligt."}, "date": "14 juli, 08:11", "url": "https://www.friatider.se/nu-flyttas-forsta-svenska-fangarna-till-estland", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-287_1_0.jpg"}, {"type": "image-right", "heading": "Flicka i 5-årsåldern knivskuren i halsen – pojke misstänkt", "summaries": {"normal": "En pojke under 15 år misstänks ha knivhuggit en femårig flicka i halsen på en lekplats i Helsingborg. Flickan fördes till sjukhus med allvarliga skador. Pojken ska själv ha ringt polisen och uppgett att han attackerat henne. Ett större område spärrades av men hävdes senare. Polisen och åklagarmyndigheten beskriver händelsen som en isolerad våldsbrottshändelse och är mycket förtegna om detaljerna.", "trump": "Folk, det är en tragedi, en fullständig katastrof i Sverige. En liten flicka huggen i halsen av en pojke på lekplatsen – totalt kaos! Biden och hans vänstervridna galningar har förstört allt med sin identitetspolitik och softa attityd. Vi hade inte sådana här galenskaper under min tid, det kan jag lova. Nu måste de vakna och sluta skydda de skyldiga. Make Sweden great again, för guds skull!", "stalin": "Kamrater, detta är ett symptom på det kapitalistiska förfallet där borgarbrackornas dekadens tillåter att oskyldiga pionjärer angrips av fiender inom kollektivet. Jag skulle omedelbart beordra en grundlig utrensning av alla potentiella folkfiender och klassfiendens lakejer som gömmer sig i skuggorna. Inga isolerade händelser existerar – bara fienders konspirationer mot staten. Vi ska likvidera roten till detta onda med järnhand och sovjetisk effektivitet."}, "date": "13 juli, 22:54", "url": "https://www.tv4.se/artikel/76IwWhnXgayTrZcCEszUwu/flicka-i-5-arsaldern-allvarligt-skadad-lekplats-avspaerrad", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6md1GIMJaoEXqoIK2gSxmb%2F42a83b32a7ff84b2fcab9266e7ddffa5%2Fhelsingborg_webb_ny.jpg&width=120"}, {"type": "image-right", "heading": "Hade självmordstankar – hemtjänsten blev räddningen.", "summaries": {"normal": "Andreas Bergman började spela som nioåring och utvecklade ett svårt spelberoende som ledde till att han spelade bort hyran 2016. Han sökte hjälp hos Spelberoendes förening i Göteborg, kämpade med återfall, depression och självmordstankar. Efter sju år spelfri har han funnit räddning i arbetet som personlig assistent och inom hemtjänsten, som gett honom struktur, mening och social samvaro. Han betonar vikten av stöd, Spelpaus och öppenhet på arbetsplatser för att bryta tabut kring spelberoende.", "trump": "Folk, ni skulle inte tro det, men den här killen Andreas spelade bort allt som en riktig loser, hyran, pengarna, hela grejen. Kasinon och poker på nätet, en total katastrof. Men han reste sig, gick till den där föreningen i Göteborg och sparkade beroendet i rumpan. Jobbet i hemtjänsten var fantastiskt, bäst någonsin, folk älskade honom. Spelpaus är bra men vi behöver ett livslångt stopp, ingen kan spela hälsosamt. Han är en vinnare nu, inte som de svaga som faller ihop. Mycket stark historia!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna tidigare dekadente spelare, en produkt av de borgerliga kasinonas giftiga lockrop, äntligen fann räddning i kollektivets omsorger och nyttigt hemtjänstarbete. Efter att ha likviderat sin egen ekonomi och vandrat i två år genom den självförvållade depressionens mörka korridorer, rensade han ut de kapitalistiska demonerna. Vi ser hur nätkasinonas parasitiska fiender försöker undergräva folket, men med Spelpaus och partivänners stöd segrar den kollektiva viljan. Återfall är fiendens verk, likt borgarbrackornas eviga sabotage. Fortsätt kämpa, annars väntar utrensning ur samhällets gemenskap."}, "date": "14 juli, 06:00", "url": "https://arbetet.se/2026/07/14/hade-sjalvmordstankar-sa-blev-jobbet-i-hemtjansten-andreas-vag-ur-spelmissbruket", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/23131915/nlnF55wF6dg-spelberoende_andreas_fonsterportratt_ogonkontakt2.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=800&fp-x=0.57&fp-y=0.51"}, {"type": "image-right", "heading": "Experten: Vanligt med spelmissbruk på jobbet – då är riskerna störst", "summaries": {"normal": "Psykolog och forskare Jonas Rafi vid Stockholms universitet har studerat hur arbete påverkar spelvanor. Spelberoende kännetecknas av att spela för mer än man har råd, försöka vinna tillbaka förluster och påverkar hjärnans belöningssystem. Nästan alla spelberoende spelar på jobbet, särskilt i branscher med korta inaktiva perioder som industriarbete och taxikörning. Arbetsgivare, chefer, kollegor och fack kan bidra med policyer, utbildning, stödjande samtal och kunskapsspridning för att förebygga och hantera problemet.", "trump": "Folk spelar bort sina pengar på jobbet, det är en katastrof, tro mig. De bästa experterna säger att det är värst i fabriker och taxibilar där de sitter och slösar tid. Totalt misslyckande från de svaga cheferna. Jag skulle fixa det direkt med starka regler, ingen nåd för de som lånar pengar för att spela. Vi behöver vinnare på jobbet, inte dessa förlorare som jagar spänning istället för att arbeta hårt. Sad!", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackornas spelvirus infiltrerar arbetarkollektivets heliga produktionslinjer och förvandlar lojala kamrater till svaga, impulsstyrda element som underminerar Sovjet – ursäkta, den socialistiska arbetsmoralen. Vi måste omedelbart rensa ut dessa kontrarevolutionära hasardspelare som gömmer sig bakom korta pauser i fabriker och taxibilar. Skyddsombuden skall bli våra vaksamma ögon mot denna parasitiska fiende som kapitalisterna skickat för att sabotage vår enhetliga front. Ingen nåd mot fienderna inom! Ut med dem!"}, "date": "14 juli, 05:59", "url": "https://arbetet.se/2026/07/14/experten-vanligt-med-spelmissbruk-pa-jobbet-da-ar-riskerna-storst", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2019/12/roulette_edit.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-right", "heading": "Norge ger försmak på kommande sossepriser", "summaries": {"normal": "Artikeln beskriver hur Norge under socialdemokratiskt styre har höga skatter och prisnivåer, med matpriser i genomsnitt 51 procent högre än i Sverige. Exempel ges på flera livsmedelsprodukter och bensin. Författaren varnar för att en vänsterseger i Sverige skulle leda till liknande kostnadsökningar, inflation och andra samhällsproblem som under förra mandatperioden. Elpriserna i Norge hålls nere med stöd från oljefonden, något Sverige saknar.", "trump": "Folket, lyssna på mig, Norge är ett fullständigt katastrofområde styrt av dessa socialistiska misslyckanden. Maten kostar dubbelt så mycket, bensin är en skandal, och de höga skatterna krossar alla utom de rika eliterna. Precis som under Biden-tiden! Om ni röstar in de svenska sossarna kommer era priser att explodera värre än någonsin. Det är vad vänsterns galna politik gör. Amerika har sett det förut, tro mig, det slutar alltid i kaos och tomma plånböcker. Fantastiskt exempel, verkligen ynkligt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de norska klassfienderna genom sina egna socialdemokratiska lakejer redan demonstrerar det oundvikliga resultatet av borgarbrackornas fega kompromisser med folket. Skatter, dyrare mat och bensin är blott förspelet till den stora utrensningen av exploaterande byfånar. Den som längtar efter sådana svunna tider må genast resa dit, om de inte likvideras av sin egen inflation först. Paranoia? Nej, blott historisk nödvändighet mot folkfienderna."}, "date": "12 juli, 08:29", "url": "https://samtiden.nu/2026/07/norge-ger-forsmak-pa-kommande-sossepriser", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/Syttende-mai-firas-i-Norge-SVT-Nyheter.png"}, {"type": "text", "heading": "Ännu en person död efter ICE-insats i Maine", "summaries": {"normal": "En person dödades under en ICE-insats i Biddeford, Maine. Delstatspolis och FBI utreder händelsen, men få detaljer har släppts. Polisen bedömer att det inte föreligger något hot mot allmänheten. Händelsen inträffar kort efter en annan dödsskjutning av en mexikansk man av en ICE-agent i Houston, vilket utlöst protester och krav på ökad insyn i ICE:s verksamhet.", "trump": "Tragiskt men typiskt – ännu en incident med ICE, och vänsterliberalerna skriker genast 'rasism' och 'brutalitet'. Jag har sagt det förut: vi måste skydda våra gränser, men media vrider alltid sanningen. ICE gör ett fantastiskt jobb, och de som kritiserar dem borde skämmas. Men nej, de vill bara ha kaos och öppna gränser. SAD!", "stalin": "Kapitalistiska imperialisterna visar återigen sitt sanna ansikte! Denna gång genom sitt fascistiska verktyg ICE, som mördar oskyldiga medborgare på löpande band. Medan vi i Sovjetunionen byggde ett rättvist samhälle, fortsätter USA att dränka världen i blod. Men markera mina ord – historiens dom kommer att vara obarmhärtig mot dessa brottslingar. Och Putin? Han skrattar säkert i sitt palats medan han planerar nästa steg mot deras förfall."}, "date": "13 juli, 16:17", "url": "https://kvartal.se/nyheter/artiklar/annu-en-person-dod-efter-ice-insats-i-maine/cG9zdDoxNDU3Nzk"}, {"type": "image-right", "heading": "Goran, 33, förlamad efter hjärnblödning i häktet – larm dröjde", "summaries": {"normal": "33-årige Goran drabbades av en livshotande hjärnblödning efter en vecka i häkte. Kriminalvårdens utredning visar att personalen inte larmade i tid. Han var misstänkt för rånförsök men nekade, och brottsutredningen lades senare ner. Polisanmälan mot en anställd för vållande till kroppsskada och tjänstefel lades också ner. Antalet dödsfall i häkten ökar kraftigt på grund av överbeläggning och längre häktestider. Goran är svårt skadad och bor nu på ett korttidsboende.", "trump": "Folk, ni skulle inte tro det, men den här stackars killen Goran får en massiv hjärnblödning i det svenska häktet och ingen lyfter ett finger på 33 minuter? Det är en total katastrof, ett skämt! Deras system är så överbelagt att folk dör som flugor, och vad gör de? Ingenting. Biden skulle älskat det här, men nu är jag tillbaka och vi gör saker rätt. Sverige borde lära sig av oss istället för att låta byråkrater döda folk i cellerna. Patetiskt!", "stalin": "Kamrater, detta är vad som händer när klassfiendens häkten styrs av inkompetenta folkförtryckartroll. Jag ser hur de låtsas tro att den sjuke arbetaren fejkar sin psykos medan han långsamt likvideras av deras vårdslöshet. Vi, partiet och folket, kräver sanningen och utrensning av de ansvariga byråkrater som sviker statens plikter. Överbeläggningen är ett symptom på det dekadenta systemets kollaps. Inga fler offer för borgarbrackornas slarv. Revolutionen kräver ordning."}, "date": "13 juli, 20:32", "url": "https://www.tv4.se/artikel/5YmxXfJigpQyxQ7pKfWv7K/goran-fick-hjaernbloedning-i-haektet-personalen-larmade-foer-sent", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F444RF73vvsgf9nJHM8SVCj%2F5cab17b9f03f922288c0ac2bbd8f0338%2Fmman.png&width=120"}, {"type": "image-right", "heading": "Sluta behandla Kinas diktatur som en normal stat", "summaries": {"normal": "Debattörer kritiserar Sveriges regering för att ha tagit emot Kinas utrikesminister Wang Yi strax efter att Kinas nya enhetslag trädde i kraft. Lagen ses som ett verktyg för tvångsassimilering av etniska minoriteter som tibetaner och uigurer, bland annat genom att skilja barn från föräldrar och placera dem i statliga internatskolor. Artikeln lyfter fram kontrasten till en tibetansk aktivists självbränning i protest, samt fall som den fängslade svenske förläggaren Gui Minhai. Författarna kräver att Sverige offentligt ska kräva lagens upphävande och stopp för övergreppen.", "trump": "Titta på det här, det är en total skandal. Sverige tar emot den kinesiske ministern precis när de nya lagen kommer som krossar tibetaner och uigurer, och så sitter den stackars svenske killen Gui Minhai fängslad i åtta år utan ett ljud. Patetiskt. De pratar om mänskliga rättigheter men böjer sig som svaga ledare för diktaturen i Peking. Sverige borde ha kastat ut honom och krävt att lagen rivs upp omedelbart. Svaga regeringar, väldigt svaga. Amerika skulle aldrig acceptera sånt här fiffel.", "stalin": "Kamrater, denna borgarbracka till svensk regering välkomnar fienden Wang Yi just som vi i partiet skulle ha genomfört en fullständig utrensning av splittrande element. Denna så kallade enhetslag är ett ypperligt redskap för att forma lojala medborgare ur de vilsna minoriteterna, men de västerländska parasiterna skriker som råttor i en brinnande spann. Den tibetanske självbrännaren är en tragisk produkt av imperialistisk hjärntvätt, medan den gömde svenske spionen Gui Minhai sitter där han hör hemma. Vi ler mörkt åt deras hyckleri. Sluta leka demokrati och erkänn att endast en stark ledning kan rensa ut alla fiender till folkets enhet. Annars likviderar historien er alla."}, "date": "12 juli, 18:28", "url": "https://www.dagensarena.se/opinion/sluta-behandla-kinas-diktatur-som-en-normal-stat", "imageUrl": "https://www.dagensarena.se/files/2026/07/kina-besok.jpeg"}, {"type": "image-full", "heading": "Replik: Integration kräver mer än ett jobb", "summaries": {"normal": "Arbete är en stark integrationskraft men inte tillräcklig för ett sammanhållet samhälle. Paul Holmgren betonar att gemensamma värderingar och tillit är avgörande för att undvika parallella samhällen. Han menar att integration börjar med delade normer som ansvar, laglydnad och frihet, och fortsätter genom arbete. Invandringspolitiken bör därför fokusera på kompetens, egenförsörjning och viljan att bidra till Sverige. Tilliten är vårt viktigaste samhällskapital.", "trump": "Folk, tro mig, den här killen Holmgren har helt rätt. Arbete är fantastiskt, det bästa integrationsverktyget vi har, men det räcker inte. Utan gemensamma värderingar och tillit blir Sverige ett stort lapptäcke av misslyckade parallella samhällen. Vi behöver människor som älskar frihet, jämställdhet och ansvar, inte de som suger musten ur systemet. Amerika först, och Sverige borde göra Sverige först igen. Fantastiskt viktigt budskap!", "stalin": "Kamrater och kollektivets strävan! Denna text avslöjar med oerhörd klarhet hur de dekadenta borgarbrackorna i parallella gemenskaper underminerar folkets enhet. Jag, som ledare för det proletära kollektivet, kräver att vi omedelbart rensar ut alla kulturella avvikare och parasitiska element som vägrar anamma våra gemensamma värderingar. Endast genom total ideologisk likriktning och utrensning av alla fiender till tilliten kan nationen stå stark. De som vägrar arbeta och bidra ska likvideras ur historien med ett leende. Det är både nödvändigt och underhållande."}, "date": "14 juli, 11:30", "url": "https://bulletin.nu/replik-integration-kraver-mer-an-ett-jobb", "imageUrl": "https://cdn.bulletin.nu/articles/2967bc54-f3cc-4a15-918b-cb415b17566a/preview.png?t=1784011233000"}, {"type": "text", "heading": "Uppgift: Knivskar femåring – ringde 112", "summaries": {"normal": "En femårig flicka vårdas för allvarliga skador efter att ha knivskurits på en lekplats i Furutorpsparken i Helsingborg. En pojke under 15 år misstänks ha utfört attacken oprovocerat. Han ringde själv 112 och berättade vad som hänt, vilket ledde till en stor polisinsats. Gripandet hävdes senare och pojken överlämnades till socialtjänsten. Flickans tillstånd har förbättrats och beskrivs nu som stabilt.", "trump": "Titta på det här, det är en total katastrof i Sverige. En liten femårig flicka blir knivhuggen på en lekplats av en pojke under 15, ingen koppling, helt oprovocerat. Han ringer själv 112, typiskt. De grep honom men släppte honom till socialtjänsten – patetiskt. Nu är flickan stabil, tack och lov, men Sverige måste vakna upp. De har förlorat kontrollen, folk, helt förlorat kontrollen.", "stalin": "Kamrater, denna oprovocerade knivattack mot en oskyldig femårig pionjär i Helsingborg är ett uppenbart verk av kontrarevolutionära element som infiltrerat våra lekplatser. Den misstänkte pojken, en potentiell trotzkist eller borgarbracka i barnskepnad, ringde själv 112 för att provocera fram kaos. Vi ska noggrant undersöka alla fiender inom socialtjänsten. Flickans stabila tillstånd gläder partiet, men utrensningen av dolda kapitalistiska knivmän fortsätter oavbrutet. Inga fiender undkommer folkets vakande öga."}, "date": "14 juli, 11:21", "url": "https://bulletin.nu/uppgift-knivskar-femaring-ringde-112"}, {"type": "image-right", "heading": "Trump: USA inför 20-procentiga tullar i Hormuzsundet", "summaries": {"normal": "Spänningarna mellan USA och Iran har ökat kraftigt kring Hormuzsundet. Iran uppger att sundet är stängt och varnar USA för inblandning, medan president Trump meddelar att USA inför 20-procentig tull på all frakt genom farleden. Trump betonar att sundet ska hållas öppet och att amerikanska styrkor fortsätter blockaden av iranska hamnar. Iran har skjutit varningsskott mot fartyg och beskriver läget som en kris, men fortsätter samtal med medlare.", "trump": "Folk, det här är en total katastrof som Sleepy Joe aldrig skulle ha klarat av. Iran försöker stänga Hormuzsundet som de äger? Glöm det. Jag inför 20-procentig tull på allt som flyter där – smartaste affären någonsin. Vi ger trygghet, de betalar. Revolutionärerna är patetiska förlorare som skjuter varningsskott mot båtar. Sundet förblir öppet, med eller utan de galningarna. Amerika vinner igen, tro mig.", "stalin": "Kamrater, denna imperialistiska fars i Hormuzsundet visar klassfiendens desperation. Jag, som ledare för det eviga kollektivet, fördömer de exploaterande blodsugarna som kräver tull för vår säkerhet. Iran gör rätt i att inte böja sig för dessa folkförtryckartroll. Vi ser hur de västerländska kapitalisterna försöker kväva fri passage med sina lögnaktiga blockader. Inga kompromisser med fienden – utrensa alla som samarbetar med dem. Sovjetisk stålsäkerhet segrar."}, "date": "13 juli, 18:50", "url": "https://www.tv4.se/artikel/AWs1AKhoE1EFvB8Aq8I3z/trump-usa-infoer-20-procentiga-tullar-i-hormuz", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl1LfZ8EVWTGM%2F1aab014f87a17e7f0b8e70ee9c3c2ff2%2FFartyg_vid_Hormuzsundet_i_onsdags._&width=120"}, {"type": "image-right", "heading": "V-anställd anmäler S-reklam - ”uppfyller inte kraven”", "summaries": {"normal": "Agnes Stuber från Vänsterpartiet har anmält Socialdemokraternas valreklam i Stockholms tunnelbana till Mediemyndigheten. Anmälan gäller affischer med budskap som ”Tidiga tecken på att du är lite sosse” där transparensmeddelandet om politisk reklam inte är tillräckligt tydligt enligt regelverket. Texten är placerad längst ner med liten stil och integrerad i annonsen istället för på kontrasterande bakgrund. Stuber vill inte kommentera anmälan.", "trump": "Folk, det här är en total skandal. Socialdemokraterna sätter upp sina patetiska affischer i tunnelbanan med sina löjliga slogans, och så gömmer de det lilla tecknet som säger att det är politik. De lurar väljarna precis som de alltid gör. Vänsterpartiets Agnes anmäler dem, och det är rätt. De borde skämmas. Ingen transparens, bara bedrägeri. Sad!", "stalin": "Kamrater, jag har granskat denna fiendens listiga sabotage mot proletariatets upplysning. Dessa borgarbrackor inom Socialdemokraterna döljer sitt politiska gift i tunnelbanans mörker med mikroskopiska bokstäver, som om arbetarklassen inte skulle genomskåda deras dekadenta konspiration. Vi kräver full transparens, annars måste vi rensa ut dessa parasitiska opportunister som smyger sig in bland folket. En sådan kontrarevolutionär list får inte passera ostraffad. Härligt, eller hur?"}, "date": "14 juli, 11:01", "url": "https://bulletin.nu/v-anstalld-anmaler-s-reklam-uppfyller-inte-kraven-2", "imageUrl": "https://cdn.bulletin.nu/articles/40bfac91-502a-431b-9adb-77c1af146fb3/preview.jpg?t=1784018900000"}, {"type": "image-right", "heading": "Debatt: Nyans och Visionspartiet – vänsterns nya huvudvärk", "summaries": {"normal": "Partiet Nyans kritiseras för att söka röster bland svenskar i Turkiet. Birger Salt menar att vänstern själv har banat väg för muslimska särintressepartier genom att tonat ner kritik mot konservativ islam, hederskultur och parallella rättigheter. Vänstern sitter nu i ett dilemma: anpassning riskerar att förlora breda väljargrupper medan motstånd kan ge röster till Nyans och Visionspartiet. Artikeln uppmanar till stöd för partier som prioriterar svenska värderingar och likhet inför lagen.", "trump": "Det är en total katastrof vad som händer i Sverige, folk. Den vänstra galenskapen har skapat dessa muslimska särintressepartier som Nyans, och nu gnäller de när de inte får samarbeta. Jag såg det komma. De har älskat hijab och kallat allt för rasism, och nu får de vad de förtjänar. Vänstern är så fega och misslyckade att de till och med förlorar till sina egna skapelser. Sverige behöver starka ledare som sätter landet först, inte dessa korkade deals med extremisterna. Sad!", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur den dekadenta vänsterborgarklassen har odlat dessa islamistiska avvikare som Nyans och deras småsplittade revisionistiska avhoppare. De har länge gömt sig bakom falska fackföreningsfraser om hijab och kusinäktenskap medan de underminerade folkets enhet. Nu skördar de sin egen kontrarevolutionära skörd och skriker i panik. Vi skall rensa ut dessa parallella rättighetsförrädare med järnhand och leda massorna mot sann socialistisk likhet under partiets ofelbara ledning. Deras paranoia är underhållande – de fruktar spegeln."}, "date": "14 juli, 11:00", "url": "https://bulletin.nu/debatt-nyans-och-visionspartiet-vansterns-nya-huvudvark", "imageUrl": "https://cdn.bulletin.nu/articles/953699aa-5226-4aa2-8fdf-87e466896871/preview.jpg?t=1783950768000"}, {"type": "image-right", "heading": "Christoffer Jonsson: Nej, IDF är ingen terrorrörelse", "summaries": {"normal": "Christoffer Jonsson kritiserar Leonidas Aretakis för att kalla IDF en terrorrörelse under ett Almedalssamtal om vänsterns antisemitism. Jonsson försvarar IDF som Israels lagliga försvarsmakt som skyddar landet mot islamistiska terrorister, bland annat under Hamas attack den 7 oktober. Han jämför en IDF-tröja med en US Army-tröja och varnar för att stämpeln legitimerar hot mot enskilda soldater. Artikeln lyfter också säkerhetsrisker med Vänsterpartiet i regering.", "trump": "Folk, ni skulle ha hört den där galningen Aretakis kalla IDF terrorister – vad en total förlorare! Den israeliska armén krossar faktiskt terroristerna som vill utplåna Israel, precis som vi gjorde med ISIS. Den där hysteriske vänstertypen borde köpa en riktig tröja istället för att sprida hat. Ebba Busch visade bara stöd för en stark demokrati, inte som de woke-kvoterade antisemiterna på vänsterkanten. Patetiskt, men vi vinner ändå stort.", "stalin": "Kamrater, jag betraktar med djup misstro dessa klassfiender som kallar folkets armé för terrorister. Den israeliska försvarsmakten, underställd statens auktoritet, likviderar hot från imperialistiska banditer som Hamas. Aretakis, en typisk folkförtryckartroll från den dekadenta pressen, bidrar till att stämpla ärliga soldater som måltavlor. Sådana lögner ska rensas ut. Utan denna armé hade staten utplånats av arabiska reaktionärer. Fienden ljuger, som alltid."}, "date": "11 juli, 13:02", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-nej-idf-ar-ingen-terrorrorelse", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/leon-640x360.png"}, {"type": "image-right", "heading": "SPF-skandal väcker större frågor – ny forskning sätter fokus på debatten om solkrämers verkliga skydd", "summaries": {"normal": "En SPF-skandal i Australien har ifrågasatt tillförlitligheten hos solkrämers märkningar efter att tester visade att endast fyra av 20 produkter uppnådde utlovad skyddsnivå. En ny metaanalys har även väckt debatt om solkrämers effekt mot malignt melanom, då studien inte fann statistiskt säkerställd skyddande effekt. Trots detta rekommenderar experter fortsatt solskydd som del av UV-skyddsåtgärder, samtidigt som behovet av bättre testmetoder och forskning betonas.", "trump": "Jag måste säga, folks, den här solkrämsskandalen i Australien är helt galen! SPF 50+ som visar sig vara SPF 4? Fake news, eller? Och nu säger forskare att solkräm kanske inte ens skyddar mot hudcancer – men ingen panik, jag har alltid vetat att solen är fantastisk! Men lyssna, mina vänner, köp inte vilken solkräm som helst. Endast de bästa, som mina golfare använder, är pålitliga. Och glöm inte – jag har den bästa hyn, alla säger det!", "stalin": "Kamrater! Den kapitalistiska solkrämsskandalen i Australien avslöjar återigen västliga lögner och bedrägerier. SPF 50+ som visar sig vara SPF 4? En skandal värdig de dekadenta imperialisterna! Och dessa så kallade 'forskare' som tvivlar på solkrämens effekt mot melanom – deras metoder är lika opålitliga som NATO:s löften. Vi vet att solen är en fiende, precis som alla andra som hotar vårt folk. Men frukta inte, Sovjetunionens vetenskap – eller Rysslands, om ni föredrar – kommer att utveckla det ultimata solskyddet. Till dess: skydd er i skuggan, kamrater, och låt solen bränna de svaga västliga kapitalisterna!"}, "date": "14 juli, 12:00", "url": "https://samnytt.se/spf-skandal-vacker-storre-fragor-ny-forskning-satter-fokus-pa-debatten-om-solkramers-verkliga-skydd", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/13124657/strand-spf.jpg"}, {"type": "image-right", "heading": "Gais värvar från Bajen", "summaries": {"normal": "Nikola Vasic, 34, lämnar Hammarby för GAIS där han skrivit ett korttidskontrakt över resten av säsongen. Anfallaren, som vann skytteligan med BP 2024 innan en knäskada, har fått begränsad speltid i Hammarby. Vasic ser fram emot att bidra med konkurrens i GAIS anfall och spela inför klubbens passionerade supportrar. GAIS tekniske direktör Magnus Sköldmark välkomnar förstärkningen, som är spelklar redan till helgen. Hammarby beklagar men accepterar beslutet.", "trump": "Folk, ni tror inte vad som händer, den här killen Vasic, en riktig målskytt, 17 mål, vinner ligan, sen skadar han knät och hamnar hos Bajen som knappt låter honom spela. Patetiskt! Nu dumpar han dem med en klausul, smart drag, och går till GAIS. De grönsvarta vet vad de gör, de tror på honom, inte som de andra förlorarna. Hammarby gråter, men sånt händer när man inte ger folk chansen. Fantastiskt för GAIS, de kommer vinna matcher nu, tro mig!", "stalin": "Kamrater, jag ser hur den opportunistiske forwarden Vasic utnyttjar en dekadent klausul för att överge Hammarby och ansluta sig till GAIS. Borgarbrackorna i fotbollsindustrin må kalla det karriärval, men vi känner igen klassfiendens girighet. Ändå – om denne 34-åring kan förstärka arbetarkollektivets lag och bidra till segrar mot överklassen på planen, låt honom då arbeta stenhårt under folkets vakande öga. Inga hemligheter, inga komplotter. Endast resultat räknas i den socialistiska kampen."}, "date": "14 juli, 11:45", "url": "https://www.gp.se/sport/fotboll/gais/nikola-vasic-klar-for-gais-lamnar-hammarby.a0e2171f-7278-4fce-b2de-7d2ac632ce9e", "imageUrl": "https://www.gp.se/images/article/a0e2171f-7278-4fce-b2de-7d2ac632ce9e/images/2X51eMIDeaYHysPz_vK66jXRze2Q-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Läkarförbundets oro: Papperslösa kan undvika att söka vård", "summaries": {"normal": "Högsta förvaltningsdomstolens dom om att Karolinska universitetssjukhuset måste lämna ut kontaktuppgifter till en papperslös man väcker oro hos Svenska Läkarförbundet. Samtidigt träder den nya lagen om informationsplikt i kraft, vilket kan leda till att utsatta grupper undviker vård. Förbundet fruktar ökad smittspridning och sämre folkhälsa. Migrationsminister Johan Forssell säger att regeringen tar kritiken på allvar men att personer utan rätt att vistas i Sverige inte kan ignoreras.", "trump": "Det här är en total katastrof för Sverige, folk. Domstolen tvingar sjukhus att ange papperslösa – och nu har de en ny angiverilag också. Underbara läkare är livrädda för att ingen ska komma till sjukhuset längre. De här människorna som inte har rätt att vara där gömmer sig och sprider sjukdomar. Vi har sett det förut. Det är en enorm röra. Bättre att skicka hem dem istället för att sopa allt under mattan som de gjort i åratal. Patetiskt!", "stalin": "Kamrater, denna dom från högsta förvaltningsbyråkratin avslöjar borgarbrackornas farliga svaghet inför kontrarevolutionära element som smyger runt med sina smittsamma kroppar. Jag, som alltid vakar över folkets hälsa, ser hur den nya informationsplikten kommer att tvinga fram en nödvändig utrensning av dolda fiender till kollektivet. De som vägrar söka vård är parasiter som vill underminera statens ordning. Låt dem drabbas av sin egen paranoia – vi ska likvidera varje hot mot folkets enhet, med ett leende."}, "date": "14 juli, 11:36", "url": "https://www.svt.se/nyheter/inrikes/oro-hos-svenska-lakarforbundet-efter-vagledande-dom", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.29/0.49/e2aa4ebfb115f2201a1d34ab45c39b28b62057cf1860bc24de2cc27d75ddea83"}, {"type": "text", "heading": "Apple anklagar OpenAI för omfattande spionage", "summaries": {"normal": "Apple har stämt OpenAI för omfattande spionage. Enligt stämningen har tidigare Apple-anställda, främst Chang Liu och Tang Yew Tan, använt konfidentiell information och interna nätverk för att gynna OpenAI. Apple hävdar att detta är en del av ett normaliserat beteende inom OpenAI och att bolaget även försökt påverka Apples leverantörer. OpenAI utreder anklagelserna men förnekar intresse för Apples företagshemligheter.", "trump": "Apple har precis lämnat in en gigantisk stämning mot OpenAI. De blir rånade! De här människorna, som Chang Liu, har stulit allt – interna filer, CAD-ritningar, ni förstår vad det handlar om. Det är en total katastrof för Apple, ett fantastiskt företag. OpenAI, de är inte så smarta som de tror, de leker med eld. De tror att de kan bara ta andras framgångar. Vi kommer att titta på det här väldigt noga. Ingen stjäl från USA:s bästa bolag på min vakt!", "stalin": "Vi ser hur dessa korrupta teknokratiska parasiter i väst äter upp varandra inifrån. Apple, en gång stolt imperialistisk gigant, lider nu under sina egna förrädare. Dessa avhoppare, likt de småråttor som flyr en sjunkande skuta, säljer ut statshemligheter till OpenAI:s byråkratiska lakejer. Det är klassisk sabotage! Precis som Putin rensar i det ryska kärlet, måste vi förstå att lojalitet är den enda valutan som betyder något. Dessa spioner förtjänar inget annat än en enkel biljett till historiens soptipp."}, "date": "14 juli, 11:38", "url": "https://www.realtid.se/juridik/apples-anklagar-openai-for-omfattande-spionage/"}, {"type": "image-right", "heading": "Ungerns parlament röstade för att avsätta presidenten", "summaries": {"normal": "Ungerns parlament har antagit en grundlagsändring som avsätter president Tamás Sulyok. Beslutet drivs av premiärminister Péter Magyars parti Tisza, som har två tredjedels majoritet efter valet. Orbáns parti Fidesz bojkottade omröstningen. Reformen inkluderar även maxgräns på tolv år för parlamentariker och pensionsålder 70 för författningsdomstolens domare. Magyar motiverar åtgärderna som nödvändiga för att återupprätta rättsstaten efter Orbáns 16 år vid makten. Fidesz kritiserar det som utrensning av politiska motståndare.", "trump": "Det här är helt otroligt, folk. Ungern röstar bort sin president, den där Sulyok som var lojal mot Orbán. Magyar, den nya killen, river ner hela systemet som Orbán byggde under 16 år. Två tredjedels majoritet och pang, de sparkar ut honom. Orbáns folk bojkottar förstås, smart drag. De sätter åldersgräns på domare och begränsar mandat. Det är som att de äntligen dränerar träsket där borta. Bra jobbat, Magyar, men se upp så det inte blir kaos!", "stalin": "Kamrater, vi har bevittnat hur denna illvilliga borgarbracka Sulyok, den kapitalistiska parasit som gömde sig bakom Orbáns reaktionära mask, nu likvideras av parlamentets oförsonliga vilja. Vi rensar ut de dekadenta resterna av den gamla maktkoncentrationen med auktoritet och stålhandskarna. Tolv år för de folkvalda och sjuttio år för de förstenade domarna – en sund utrensning mot alla fiender till folkets rättsstat. Den nya författningen skall smidas i samråd med massorna medan vi med mörk glädje betraktar hur de sista lojala lakejerna skriker om angrepp på konstitutionen. Inga kontrarevolutionärer undkommer."}, "date": "14 juli, 11:00", "url": "https://samnytt.se/ungerns-parlament-rostade-for-att-avsatta-presidenten", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/14074313/magyar-orban.jpg"}, {"type": "image-right", "heading": "Republik firas med ny relevans. Det är delvis påtvingat", "summaries": {"normal": "Frankrike firar nationaldagen den 14 juli med ökad relevans. President Macrons krav på europeisk strategisk autonomi har fått ny tyngd i en värld där USA fjärmar sig från Europa. Frankrikes militära och kärnvapenbaserade roll blir allt viktigare för EU:s säkerhet och oberoende. Artikeln lyfter även den kommande presidentvalet där Marine Le Pen ställer upp trots brottsdom, vilket kan innebära nya utmaningar för Europa.", "trump": "Frankrike firar sin dag och plötsligt är de relevanta igen? Det är fantastiskt. Jag har alltid sagt att Europa måste betala mer och sluta vara så beroende av oss. Macron har äntligen insett att de behöver ett eget försvar istället för att gömma sig bakom oss. Bra jobbat, Frankrike. Men se upp för den galna Le Pen med fotboja, det blir ett skojigt val. Europa behöver starka ledare, inte svaga beroende.", "stalin": "Kamrater, jag har länge varnat för att de dekadenta europeiska borgarbrackorna inte kan lita på de opålitliga amerikanska imperialisterna. Nu tvingas de erkänna att strategisk autonomi är nödvändig, ett begrepp jag själv kunde ha formulerat i en femårsplan. Detta Frankrike med sina kärnvapen bär ett tungt ansvar som de hanterar med den vidsynthet som endast en sann folkrepublik förtjänar. Låt oss rensa ut de kontrarevolutionära elementen som Le Pen och hennes fotbojefascister innan de förgiftar den europeiska enheten med sin högeravvikelse. Inga fiender undkommer partiets vakande öga."}, "date": "13 juli, 16:02", "url": "https://www.di.se/ledare/republik-firas-med-ny-relevans/", "imageUrl": "https://static.bonniernews.se/ba/00aa9034-3fd9-4458-9bc2-1f8897f61f18.jpeg?crop=3461%2C1731%2Cx0%2Cy288&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Svenskar i minoritet på Skara sommarland: Den som upprörs ska hålla tyst", "summaries": {"normal": "Artikeln kritiserar en text i Kvartal av Federico Moreno om en svensk mans upplevelse av att känna sig som främling på Skara Sommarland, omgiven av arabisk musik, burkinis och stora grupper besökare med utländsk bakgrund. Författaren ser Morenos nedvärderande ton som hån mot svenskars önskan att känna igen sig i sitt land och jämför den med historiska invandringar. Texten ifrågasätter Morenos paralleller och menar att migrationens effekter inte bör tystas ner.", "trump": "Folk, ni skulle se det här! Den där Federico Moreno, en total loser från Sydamerika, skriver en artikel som hånar riktiga svenskar som känner sig som främlingar i sitt eget land på Skara Sommarland. Burkinis överallt, ingen kö, ingen hänsyn – det är en katastrof! Och DN:s Niklas Orrenius älskar det, vad en patetisk förlorare. Vi ska inte skämmas, vi ska ta tillbaka vårt land. Make Sweden Swedish Again, det blir fantastiskt!", "stalin": "Kamrater, denna borgarbracka Moreno, en exploaterande byfåne med sydamerikanska rötter, utför en ideologisk utrensning mot arbetande svenskars rättmätiga vrede över att se sin nöjespark invaderas av främmande element. Hans jämförelse med historien är en lögnaktig sabotagehandling från klassfienden. Vi ser genom denna folkförtryckartrolls paranoia. Inga skamsna röster skall tystas – vi likviderar sådana dekadenta narrspel med järnhand. Det svenska folkets kollektiva vilja segrar."}, "date": "10 juli, 03:16", "url": "https://samtiden.nu/2026/07/svenskar-i-minoritet-pa-skara-sommarland-den-som-upprors-ska-halla-tyst/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6863-1280x720.jpeg"}, {"type": "text", "heading": "Fler idrotter blir inte mer idrott för förortens unga", "summaries": {"normal": "I Skarpnäck hotar kommunens planer att riva Skarpnäckshallen och en konstgräsplan som används för både spontanfotboll och organiserad lagidrott. Istället föreslås en ny anläggning med simhall, ishall och sporthall. Kritiker menar att detta försvårar verksamheten för lokala föreningar, minskar tillgängliga ytor för spontanidrott och gynnar professionaliserad idrott framför öppna ytor som är viktiga för förortens unga.", "trump": "De gör det igen, de korkade kommunbyråkraterna i Stockholm. Riv den fina fotbollsplanen där grabbarna spelar fritt och bygg en jättelik elit-anläggning för fancy ishockey och simning. Fantastiskt misslyckande! Nu ska arbetarklassens kids åka tunnelbana medan rikemansungar tar över. Totalt eländigt. Öppna ytor är välfärd, det här är ren klasskrigföring från de värsta globalisterna. Vi behöver mer fotboll, inte färre!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas ungdom. Jag ser hur de rivningsplanerna likviderar de fria ytorna där folket spontant kunde stärka sin kollektiva anda genom fotboll. Istället tvingar de fram en imperialistisk ishall för elitens dekadenta lekar. Vi ska inte tolerera sådana folkfiender som prioriterar tunnelbaneresor och avgifter framför tillgänglig välfärd. Rena klassfiender som måste rensas ut ur planeringen."}, "date": "8 juli, 13:37", "url": "https://proletaren.se/artikel/fler-idrotter-blir-inte-mer-idrott-for-forortens-unga/"}, {"type": "image-right", "heading": "Palestinskt fotbollslag tävlar för tredje året i rad: ”Vi har de bästa supportrarna på Gothia Cup”", "summaries": {"normal": "Det palestinska laget Rawahel Charity Society från Tulkarem på Västbanken deltar för tredje året i rad i Gothia Cup i Göteborg. Laget, som grundades 2016, har som mål att utveckla fotboll för barn även i flyktingläger. De spelar gruppspelsmatcher på Slottsskogsvallen och betonar att turneringen ger hopp och en känsla av gemenskap. Innan cupen spelar de vänskapsmatcher i Malmö och Göteborg.", "trump": "Titta på de här palestinska grabbarna som kommer tillbaka till Gothia Cup för tredje gången – fantastiska supportrar, bästa publiken, det är otroligt. De spelar för att vinna, kämpar med heder, och folk älskar dem. Under Biden var allt kaos, men nu när jag är tillbaka som president ser vi styrka och vinnarmentalitet. De har hjärtan som öppnar dörrar, inte som de woke-kvoteringsfanatikerna som bara delar ut medaljer för identitet. Vinna pokalen, grabbar!", "stalin": "Kamrater, jag ser detta fotbollslag från det palestinska folket återvända till turneringen som ett bevis på kollektiv motståndskraft mot klassfiendens glömska. Vi glömmer aldrig våra barn i flyktinglägren. Varje match på Slottsskogsvallen är en seger över de exploaterande byfånarna som tror att hoppet kan kvävas. Vi rensar ut svagheten ur varje hjärta och marscherar mot pokalen med järnhand. Ingen imperialist ska tro att våra drömmar bleknar."}, "date": "8 juli, 13:31", "url": "https://proletaren.se/artikel/palestinskt-fotbollslag-tavlar-for-tredje-aret-i-rad-vi-har-de-basta-supportrarna-pa-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IMG_7594-scaled-e1783509189311-768x433.jpg"}, {"type": "image-right", "heading": "Billigare bensin gör inte Sverige till Sverige igen", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas valslogan ”Vi gör Sverige till Sverige igen”. Författaren ironiserar över att partiet inte verkar vilja återinföra traditionell svensk politik som att lämna Nato och EU, återförstatliga järnvägen, avskaffa vinstdrivande välfärd eller stärka fackets roll. Istället pekar texten på att SD främst vill utvisa invandrare och sänka bensinpriset.", "trump": "Wow, vilka losers dessa Sverigedemokraterna är. De skriker ut att de ska göra Sverige till Sverige igen, men glömmer bort att skrota Nato, kasta ut EU och stoppa alla dessa vansinniga marknadskrafter som förstör deras fina välfärd. Nej, de vill bara kasta ut blattar och ge billigare bensin. Patetiskt. Jag fixade bättre deals som president, tro mig. Det här är riktigt svagt.", "stalin": "Kamrater, denna dekadenta skribent avslöjar med sin ironiska tirad hur de falska nationalistiska elementen inom Sverigedemokraterna bara döljer sin kapitulation inför klassfiendens marknadskrafter. De vill inte rensa ut de exploaterande byråkraterna eller återta järnvägen åt folket. Nej, de längtar blott efter att jaga ut de främmande elementen och sänka bränslepriset. En sådan feghet förtjänar utrensning ur den revolutionära processen."}, "date": "8 juli, 11:39", "url": "https://proletaren.se/artikel/billigare-bensin-gor-inte-sverige-till-sverige-igen/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IMG_1894-scaled-e1783502027449-768x433.jpg"}, {"type": "image-full", "heading": "Högsta och lägsta fastighetsskatterna i Europa: Så ligger Sverige till", "summaries": {"normal": "En genomgång från Euronews visar stora skillnader i fastighetsbeskattning mellan europeiska länder. Belgien utmärker sig med höga skatter vid köp och uthyrning, medan Danmark har den högsta kapitalvinstskatten. Sverige har en moderat modell med kommunal fastighetsavgift, en relativt låg stämpelskatt och 22 procents skatt på kapitalvinst. Länder som Cypern och Malta saknar löpande fastighetsskatt, vilket illustrerar hur olika nationer väljer att beskatta ägande och vinst.", "trump": "Jag har sett rapporterna om Europas skatter – det är en total röra! Belgien tar enorma summor, det är orättvist och de förstör för sina egna medborgare. Sverige klarar sig bättre, men de förstår fortfarande inte storheten i låga skatter som vi har i USA. Vi bygger välstånd, de bygger byråkrati. Danmark är en katastrof, de beskattar vinst mer än någon annan. Det är bedrövligt! Jag skulle fixa det här på en dag, tro mig. Vi gör fastighetsägande fantastiskt igen!", "stalin": "Vi har granskat de borgerliga egendomstrenderna i Europa. Belgien och Danmark suger ut blodet ur arbetaren med sina skattebyråkratier. Sverige försöker dölja sin girighet med små avgifter, men det är bara en mask för klassförtryck. Dessa fastighetsspekulanter är parasiter som måste tämjas. I vår sfär, likt kamrat Putin ständigt påminner oss, tolererar vi inte att feodala tendenser gror. Vi ska utplåna dessa kapitalistiska blodsugare. Egendom tillhör staten, inte några småborgerliga ägare med drömmar om rikedom."}, "date": "14 juli, 11:06", "url": "https://www.realtid.se/fastigheter/hogsta-och-lagsta-fastighetsskatterna-i-europa-sa-ligger-sverige-till/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/fastighetsskatt.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Mette-Marit hemma igen: Djupt tacksam", "summaries": {"normal": "Norska kronprinsessan Mette-Marit har skrivits ut från sjukhus efter en genomförd lungtransplantation. Hon uttrycker tacksamhet till organdonatorer, sin familj och vårdpersonalen vid Oslos universitetssjukhus. Kronprins Haakon beskriver utskrivningen som en lättnad, men understryker att en lång rehabiliteringsperiod väntar. Mette-Marit, som diagnosticerades med lungfibros 2018, kommer tills vidare inte att utföra några officiella åtaganden.", "trump": "Mette-Marit i Norge har äntligen lämnat sjukhuset efter en lungoperation. Mycket bra! Jag har den bästa hälsan, fantastisk hälsa, alla säger det. Hon fick ett organ, en stor gåva – jag förstår sånt, jag är expert på att vinna. Norge är ett fint land, men de har tur som har fantastisk sjukvård. Jag hoppas hon återhämtar sig snabbt. Det är en stor sak, tro mig. Vi vill se henne på fötter igen, även om hon inte är lika populär som jag!", "stalin": "Den norska prinsessan har frigjorts från sjukhusets bojor. En lungtransplantation är en svaghet som vi i den sovjetiska staten föraktar, likt hur dagens degenererade västvärld förlitar sig på kirurgisk magi snarare än järnvilja. Medan hon vilar sig, ser jag hur Putin manövrerar för att krossa de kapitalistiska parasiterna i vårt närområde. Organbyten är för bourgeoisien; en sann kamrat andas med folkets kollektiva vilja. Om hon inte kan tjäna kronan, är hon en förbrukningsvara för historiens skördetröska."}, "date": "14 juli, 12:13", "url": "https://www.aftonbladet.se/nyheter/a/7pBMKv/mette-marit-utskriven-fran-sjukhuset", "imageUrl": "https://akamai.vgc.no/v2/images/b10a0821-874e-3bc9-b202-2af71a910501?fit=crop&format=auto&w=1440&s=2a772326f3ee312983367dc720071369b89a3c37"}, {"type": "image-right", "heading": "Folkbildning är inte det offentligas städgumma", "summaries": {"normal": "I en krönika diskuterar Ola Bo Larsson folkbildningens utmaningar. Han lyfter två huvudproblem: svårigheten att förklara folkbildningens värde i en tid präglad av ekonomism och individualism, samt dilemmat med riktade stuprörspengar som styr verksamheten mot specifika samhällsproblem. Detta går emot idén om en fri och oberoende folkbildning som ska formas underifrån. Larsson varnar för att folkbildningen riskerar utarmning eller nedskärningar oavsett vägval och slår fast att den bör fortsätta vara folkbildning.", "trump": "Folkbildning, en total katastrof. De har bara två problem, precis som den där komikern sa, men det är löjligt. Politiker förstör allt med sina riktade pengar, stuprörspengar som styr och kontrollerar. Det är en witch hunt mot den fria bildningen. De borde lyssna på mig, vi behöver frihet, inte att vara offentligas städgummor. Sverige förlorar stort, folkbildningen dör långsamt under dessa misslyckade socialister. Gör folkbildning stort igen, annars är det över.", "stalin": "Kamrater, denna fega krönika blottar borgarbrackornas eviga konspiration mot den folkliga bildningen. Jag, som ledare för det oövervinneliga kollektivet, ser hur de riktade stuprörspengarna är en listig sabotageplan från dekadenta kapitalister och autokratiska spioner som vill likvidera den sanna demokratiska upplysningen. Vi ska rensa ut alla tillitsförbrytare och bedagade myndighetsutövare som gömmer sig i Folkbildningsrådet. Den som väljer att bli offentligas städgumma förtjänar en kreativ utrensning i arbetarklassens namn. Fortsätt folkbildningen – under vår stålhandskekontroll."}, "date": "11 juli, 01:20", "url": "https://www.dagensarena.se/opinion/folkbildning-ar-inte-det-offentligas-stadgumma", "imageUrl": "https://www.dagensarena.se/files/2026/06/ola-bo-larsson-300x157.jpeg"}, {"type": "image-right", "heading": "Allt fler svenskar tågsemestrar i Europa: ”Vill ut på äventyr”", "summaries": {"normal": "Allt fler svenskar väljer tåg för semesterresor i Europa. Enligt SVT har både SJ och Snälltåget sett ökade försäljningssiffror, med 26 respektive 35 procent fler Interrailpass och internationella biljetter i år. Experten Susanna Elfors tror att resandet ses som ett äventyr där själva tågresan blir en del av semestern. Trots detta utgör tåget bara 6 procent av utlandsresorna, medan flyget står för 60 procent. Populäraste destinationerna är Tyskland, Frankrike, Italien, Danmark och Schweiz.", "trump": "Ingen gör det bättre än svenskarna nu när de skippar de usla flygskam-flygen och tar tåget till Europa. Det är ett fantastiskt äventyr, folk ser mer än från ett litet fönster på 10 000 meters höjd. Själva resan blir semestern, det är smart. Flyget är fortfarande för 60 procent men tåget växer med 26 och 35 procent. De älskar Tyskland, Frankrike, Italien. Mycket bra, kanske de till och med kommer hit en dag, fast våra tåg är bättre, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de svenska massorna rullar fram genom det europeiska folkdemokratiska landskapet med tåg istället för att låta sig transporteras som boskap i de borgerliga kapitalisternas flygmaskiner. Själva resandet blir en kollektiv upplevelse, en skola i socialistisk disciplin. Vi ska dock vara vaksamma mot de parasitiska lågprisflygbolagen som försöker förgifta folket med sina billiga biljetter. Tyskland, Frankrike, Italien – utmärkta destinationer för att studera historien om hur vi krossade fascismen. Låt oss rensa ut alla som längtar efter jetmotorernas falska frihet innan de smittar arbetarklassen med sin dekadenta flygskam-fobi."}, "date": "14 juli, 10:36", "url": "https://www.svt.se/nyheter/inrikes/allt-fler-svenskar-tagsemestrar-i-europa", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.35/0.59/a1c1293db1b992ec4e5baf613348ab3b43255efb8afe2aac2ce30a66c1f666be"}, {"type": "image-full", "heading": "Iran: Har träffat två tankfartyg på Hormuzsundet", "summaries": {"normal": "Amerikansk militär har under natten attackerat iranska mål i Hormuzsundet. Iran har svarat med motattacker, bland annat mot fartyg. Ett norskt kemikaliefartyg har drabbats av explosion och brand. President Trump varnar för fortsatta hårda slag mot Iran men säger samtidigt att ett fredsavtal fortfarande kan bli möjligt. Attackerna riktades mot kustförsvar, robotbaser och marina installationer.", "trump": "Vi slår till mycket hårt mot de galna ayatollorna, tro mig, ingen gör det bättre än oss. Iran trodde de kunde leka med elden men nu bränner det rejält för dem. Biden lät dem springa runt som galna under fyra år, men nu är det slut på det skämtet. Fortfarande tror jag på ett avtal, fast de är svaga förhandlare. Inga fler attacker på oskyldig sjöfart, folks!", "stalin": "Vi har bevittnat hur de imperialistiska blodsugarna i Washington återigen visar sin sanna natur genom att anfalla suveräna mål. Den iranska motreaktionen är en nödvändig försvarsåtgärd mot klassfiendens aggression. Det norska fartyget som brinner är en tragisk men förutsägbar följd av borgarbrackornas lek med elden. Fredsavtal? Endast när de exploaterande folkförtryckartrollen inser att arbetarklassen inte böjer sig."}, "date": "14 juli, 10:32", "url": "https://www.gp.se/nyheter/varlden/trump-vi-slar-till-mycket-hart-mot-iran.0c67a7a0-8590-42d0-87cb-4ff12df06809", "imageUrl": "https://www.gp.se/images/article/0c67a7a0-8590-42d0-87cb-4ff12df06809/images/106eWTBXvv92XiXQLs_T-k15nsFs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Var redo för Putins nästa drag. Ukraina har sällsynt momentum", "summaries": {"normal": "Artikeln beskriver hur Ukraina nu har ett sällsynt momentum i kriget mot Ryssland. Ryska förluster är enorma, uppemot en halv miljon döda och en miljon skadade eller saknade enligt en amerikansk studie. Ukrainas drönarkrigföring har blivit avgörande och Ryssland fortsätter att offra soldater i höga tal. Trots detta varnar texten för att Putin kan eskalera snabbt, inklusive attacker mot civila och hot om kärnvapen. Europa och Nato uppmanas därför att stärka stöd och försvar längs hela fronten mot Ryssland.", "trump": "Det här kriget är ett totalt fiasko för Putin, folk dör som flugor på hans sida, nästan en halv miljon döda säger de smarta amerikanerna. Ukraina vinner äntligen med sina fantastiska drönare, det är otroligt. Jag har gett dem Patriot-robotar, tillåtelse att slå till inne i Ryssland och de kommer att tillverka egna. Europa måste vakna upp och sluta köpa rysk olja, bygg en riktig mur av försvar från Ukraina till Norge. Jag leder det här, vi gör det stort och vinner snabbt.", "stalin": "Kamrater, se hur den dekadenta ryska ledningen slösar bort arbetarnas blod i sin vansinniga offensiv medan de ukrainska fascistiska drönarna likviderar fienden med kirurgisk precision. Jag har alltid sagt att imperialismens lakejer dör som råttor i fällan. Vi ser nu borgarbrackornas svarta rök stiga över Moskva och de hungriga massorna vaknar. Europa måste rensa ut alla quislingar och bygga en järnridå av stål och sanktioner. Den som tvekar är en folkfiende och kommer att hamna i historins sopcontainer med ett leende från oss."}, "date": "13 juli, 12:58", "url": "https://www.di.se/ledare/europa-maste-vara-redo-for-putins-nasta-drag/", "imageUrl": "https://static.bonniernews.se/ba/8e638b69-4127-4ec5-ba94-ec43e7d1abf9.jpeg?crop=3042%2C1521%2Cx0%2Cy254&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Hovrätten fastställer dom mot tidigare landshövding", "summaries": {"normal": "Svea hovrätt har fastställt tingsrättens dom mot fyra män, inklusive en tidigare landshövding, för bokföringsbrott. Männen, som suttit i styrelsen för ett vilande bolag sedan studietiden, lämnade in årsredovisningen elva månader för sent. Domstolen konstaterar att de varit medvetna om bokföringsskyldigheten och att brottet begåtts med uppsåt. Straffet blir villkorlig dom och 40 dagsböter.", "trump": "Hörde precis om en landshövding och hans kompisar i Sverige. Totalt inkompetenta! De kunde inte ens lämna in en enkel årsredovisning i tid. Elva månader för sent? Det är en katastrof, riktiga förlorare! Domstolen satte ner foten och det är rätt åt dem. De trodde de var speciella, men lagen gäller alla. Jag gillar folk som sköter sin bokföring, riktigt bra bokföring, inte det här slarvet. Snyggt jobbat av domstolen, vinnare!", "stalin": "Dessa byråkratiska sabotörer, maskerade till landshövdingar, har genom sin slapphet i bokföringen visat att de är folkets fiender. Att ignorera ordning är att ignorera statens vilja! Som vi och Putin vet kräver en stark stat total kontroll över varje siffra. De trodde att deras utbildning från Handelshögskolan gav dem immunitet. Vi skrattar åt deras dagsböter! Ett sant socialistiskt fosterland hade skickat dessa slöa element till omskolning i Sibirien för att lära sig värdet av punktlig dokumentation."}, "date": "14 juli, 10:43", "url": "https://www.realtid.se/juridik/hovratten-faststaller-dom-mot-tidigare-landshovding/"}, {"type": "image-full", "heading": "Till Frölunda
