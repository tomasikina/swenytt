gelse för att ha utnyttjat en sovande kamrat i berusat tillstånd. Vi ser med tillfredsställelse hur sådana parasitiska element rensas ut ur samhället. Hans tidigare brott visar den kapitalistiska musikens moraliska förfall. Ett gott skratt åt hans patetiska försvar."}, "date": "27 augusti, 16:34", "url": "https://riks.se/nyheter/prisbelonad-p3-guld-vinnare-asme-domd-for-valdtakt", "imageUrl": "https://admin.riks.se/uploads/medium_large_asme_hero_752db7c1d2_8ca167d91e.jpg"}, {"type": "image-right", "heading": "Experterna: Så tror vi att katastrofen i Nepal gick till", "summaries": {"normal": "En stor ismassa lossnade från en glaciär på över 5 200 meters höjd vid gränsen mellan Nepal och Tibet. Massan smälte delvis, drog med sig lera, sten och sediment och bildade en våg av betongliknande material som rusade fram i över 100 km/h. Hundratals dog och fler saknas. Experter varnar för fortsatta ras och svårigheter att forska i höga berg.", "trump": "Det här är en total katastrof, folk, en riktig röra i Nepal. En vägg av vatten, lera och sten rusade ner som en galen lavin, hundratals döda, massor saknas. De borde ha sett det komma, men bergen är höga och experterna förvirrade. Vi gör det bättre här hemma, vi bygger murar som faktiskt fungerar, inte som de här lösa klipporna. Tragiskt!", "stalin": "Kamrater, en fiendtlig ismassa har förrått kollektivet genom att lossna och likvidera dalgångarna i Nepal. Detta sabotage av naturens kontrarevolutionära element har krävt hundratals offer för arbetarklassen. Vi ska rensa ut alla branta bergssidor som gömmer stenblock och avslöja de västerländska glaciärernas dolda imperialistiska agenda. Forskningen fortsätter under partiets vaksamma öga. Ingen slipper undan."}, "date": "27 augusti, 19:29", "url": "https://www.svt.se/nyheter/utrikes/experterna-sa-tror-vi-att-katastrofen-i-nepal-gick-till", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.79/0.5/25d823c0eff163af4a947dfda0c9447e3dc38b7cfc04627ca9367bc75eeb2bcd"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Alla tecken pekar åt fel håll. Verksamheten i flera elitklubbar är hotad", "summaries": {"normal": "Svensk damfotboll står inför en allvarlig kris. Stora sponsorer som Obos och Svenska Spel har dragit sig ur, vilket innebär ett bortfall på 24 miljoner kronor. Publiksiffrorna är låga och klubbarna går med stora underskott. Medan damfotbollen växer internationellt hotas verksamheten i Sverige, och en negativ spiral riskerar att urholka ligan ytterligare.", "trump": "Det är en katastrof, folk. Svensk damfotboll är ett totalt misslyckande. Sponsorer springer därifrån som råttor från ett sjunkande skepp, publiken sover och klubbarna förlorar miljoner. Under tiden växer ligorna i England och Spanien enormt. Vi gör det bäst, men Sverige? Patetiskt. De borde ha lyssnat på en vinnare.", "stalin": "Kamrater, denna degenererade borgerliga fotbollsindustri blottar kapitalismens förruttnelse. Jag ser hur sponsorerna, dessa parasitiska blodiglar, överger det kvinnliga kollektivet i en planerad utrensning av folkets idrott. Endast genom järnhård centralisering och likvidering av svaghet kan vi stoppa den kontrarevolutionära spiralen som hotar arbetarklassens framtid. Skrattretande patetiskt."}, "date": "27 augusti, 20:02", "url": "https://www.di.se/nyheter/alla-tecken-pekar-at-fel-hall", "imageUrl": "https://static.bonniernews.se/ba/1926b354-ba7e-430e-a38b-213be476d395.jpeg?crop=3808%2C1904%2Cx0%2Cy151&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Misstänks ha agerat medhjälpare till Liam Nebel i flera månader", "summaries": {"normal": "En tonårspojke har häktats misstänkt för medhjälp till mord och mordförsök efter svärdattacken på Brinellskolan i Fagersta. Han ska ha uppmuntrat 18-årige Liam Nebel via krypterade chattar under nästan fyra månader. Nebel greps efter att polisen sköt mot honom. En 17-årig flicka dog och tre pojkar skadades.", "trump": "Titta på det här, Sverige har blivit ett enda stort kaos. En galning med svärd och hans patetiske lilla medhjälpare, en vekling från utanför Stockholm som chattat i fyra månader om att mörda barn. Biden-era svaghet spred sig ända hit. Men jag fixade det förr och jag fixar det igen – ingen tolerans för dessa sjuka losers!", "stalin": "Jag betraktar detta med djup tillfredsställelse. Fiender till ordningen, dessa dekadenta ungdomar som viskar om blod i skuggorna, avslöjar folkets svaghet. Vi måste krossa varje parasit som uppmuntrar sabotage mot samhället. En flicka dödad, pojkar skadade – klassfiendens mask stirrar oss i ansiktet. Renhet krävs."}, "date": "27 augusti, 16:31", "url": "https://www.tv4.se/artikel/5FFf8ABXjxdnTbvw9obxVE/misstaenks-ha-agerat-medhjaelpare-till-liam-nebel-i-flera-manader", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2Jum65SJGCdJAqf3ub0PN2%2Fb36fa4f0050e5d814e3b99480ffab4e1%2F27-medhjalpare-haktning-webb.png&width=1024"}, {"type": "image-full", "heading": "Dadgostar backar om rika: ”Ett skojigt program”", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar backar från sitt uttalande om att rika lever på andras arbete. I SVT beskrev hon DN-intervjun som ett \"skojigt program\" och nekade att höginkomsttagare lever på andra. Hon kvarstår dock vid kravet på högre skatt för inkomster över 67 000 kronor och en miljardärsskatt.", "trump": "Lyssna på den här svenska leftist-kvinnan, Dadgostar. Först säger hon att rika är parasiter, sen backar hon som en fegis! Typical socialist! Ingen ryggrad alls, folk! Sanningen? De blöda liberalerna i Europa vet inget om att skapa jobb. Bara jag förstår ekonomin. Sorgligt! Make Sweden Great Again!", "stalin": "Klassförrädaren Dadgostar vågade säga sanningen om de profitthungriga blodsugarna men föll sedan för borgerlighetens press och tog tillbaka orden. Typiskt för en socialdemokratisk renägare! Partiet kräver utrensning av kapitalistmaffian, inte ursäkter. En miljardärsskatt? Vi likviderar hela klassfienderna, kamrater."}, "date": "27 augusti, 20:52", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-om-rika-levt-pa-andras-arbete/cG9zdDoxNzY1OTE", "imageUrl": "https://images.kvartal.se/2026/08/b3dcd0f7-432.webp"}, {"type": "image-right", "heading": "S polisanmäls efter influenceranklagelser – uppges ha erbjudit 150 000", "summaries": {"normal": "En influencer påstår att hon erbjöds 150 000 kronor av Socialdemokraterna för att berätta varför hon skulle rösta på partiet. S nekar, men Hanif Bali har polisanmält partiet. Fallet väcker frågor om valbrott och politisk influencerreklam – och påminner om ett liknande fall från 2018.", "trump": "Jag hör att Socialdemokraterna i Sverige försöker köpa influencers för 150 000 spänn. Patetiskt! Jag hade fixat en bättre deal – och fått dem att rösta på mig gratis. Det här är korruption, typiskt vänstern. Make Sweden great again – men inte så här!", "stalin": "Kamrater, jag ser att svenska socialdemokrater mutar folk för röster. Detta är oacceptabelt. Endast partiet avgör valet, inte kapitalister med plånböcker. Vi måste rensa ut sådana borgerliga parasiter som försöker manipulera proletariatet. Enhet och disciplin, kamrater!"}, "date": "27 augusti, 19:55", "url": "https://samnytt.se/s-polisanmals-efter-influenceranklagelser-uppges-ha-erbjudit-150-000", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27175442/sossar-influencers.jpg"}, {"type": "text", "heading": "Lundbergs ökar substansvärdet", "summaries": {"normal": "Lundbergs substansvärde steg till 631 kronor per aktie, upp från 552 i fjol. Rörelseresultatet mångdubblades tack vare intressebolag och värdeförändringar. Omsättningen sjönk marginellt. Bolaget investerade nära en miljard i aktier som Alleima, Industrivärden och Indutrade. En rapp halvårsrapport med stark vinstutveckling.", "trump": "Jag har gjort Lundbergs fantastiska igen! Substansvärdet upp 14 procent – huge! Resultatet ökade 273 procent – ingen har sett sådana siffror förut. De investerar i aktier som jag gör – smarta affärer. Min administration skapar välstånd överallt. Sverige är vinnare. Alla älskar mig!", "stalin": "Kamrater, Lundbergs substansvärde ökar – ett bevis på femårsplanens seger. Men rörelsevinsten på 103 procent döljer borgerliga sabotage. Aktieinvesteringarna i Alleima och Industrivärden är misstänkta; vi måste rensa ut kontrarevolutionära kapitalistsvin som gömmer sig i intressebolagen. Partiet ser allt."}, "date": "27 augusti, 13:18", "url": "https://www.affarsvarlden.se/artikel/lundbergs-okar-substansvardet-2"}, {"type": "image-full", "heading": "V-ledaren pressas om antisemitism", "summaries": {"normal": "Vänsterpartiets partiledare Nooshi Dadgostar pressades i SVT:s Utfrågningen om antisemitism inom partiet. Hon medgav att partiet borde upptäckt de avslöjade personerna tidigare. Dadgostar hänvisade till partiets Palestina-engagemang som förklaring och avfärdade jämförelser med Sverigedemokraterna.", "trump": "Sveriges vänstern är en total katastrof, folket! Nooshi Dadgostar – vad för en namn ens? – pressas om antisemitism i sitt eget parti och skyller på Palestina. Vänstern älskar terrorister! Och så säljer de kartor utan Israel. Sjuka skygglappar! De kvoterar in alla möjliga galningar. SADAN självhävdelse!", "stalin": "Detta är intressant. En partiledare som medger svaghet inför allmänheten – typiskt för borgarpressens utfrågningar. Att klassfiender söker sig till hennes parti bekräftar bara deras ideologiska förvirring. Vi hade rensat ut dem AllaBryter snabbare och mer grundligt. Debil kartförsäljning är rätt sortens provokation från imperialisterna."}, "date": "27 augusti, 20:30", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-pressas-om-antisemitism/cG9zdDoxNzY1NjY", "imageUrl": "https://images.kvartal.se/2026/08/e354013f-dadgostar.webp"}, {"type": "image-full", "heading": "Septemberfällan: Här är avtalen du bör säga upp nu", "summaries": {"normal": "Efter sommaren är det bra att granska kontoutdraget och kontrollera onödiga abonnemang, prenumerationer och medlemskap som fortsätter dras automatiskt. Konsumentverket påminner om att avtal ofta förlängs automatiskt och att man bör kontrollera bindningstider, uppsägningstider samt spara dokumentation. En genomgång kan spara pengar på tjänster som inte längre används.", "trump": "Folk, ni betalar för skräp ni inte ens använder! Streaming, gym och alla dessa luriga abonnemang som bara tickar på i bakgrunden – det är en total skandal. Jag älskar att spara pengar, och det borde ni också göra. Gå igenom era räkningar nu i september, säg upp det onödiga och vinn stort. Amerika sparar, Sverige borde också spara!", "stalin": "Kamrater, i denna borgerliga dekadens där kapitalistiska tjänster suger ut arbetarklassens blod genom automatiska förlängningar och dolda avgifter, måste vi rensa ut dessa parasitiska avtal. Jag, som alltid vakar över kollektivets intressen, befaller er att granska varje utdrag med stålhård paranoia. Dokumentera allt, annars lurar de er i mörkret. Statens fiender gömmer sig i fakturorna."}, "date": "27 augusti, 22:01", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1508341-septemberfallan-har-ar-avtalen-du-bor-saga-upp-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/b2305de104b004a30200000000b004a302/2026/08/27/2387294/septemberffallan.png"}, {"type": "text", "heading": "VMA utfärdat i Göteborg – kraftig brand i industri", "summaries": {"normal": "Kraftig brand i industrilokal med kemikalier i Alelyckan, Göteborg, har lett till VMA för boende i Gamlestaden och Backaområdet. Räddningstjänsten uppmanar allmänheten att gå inomhus, stänga fönster och ventilation. Inga personskador har rapporterats, men röken anses ohälsosam och branden är inte under kontroll.", "trump": "Jag ser en enorm rökpelare över Göteborg – det är fantastiskt! En kemikaliefabrik brinner, och de säger att röken är ohälsosam. Men jag har den bästa räddningstjänsten i världen, de fixar detta. Stäng fönster, stanna inne – vi gör Sverige tryggt igen!", "stalin": "Kamrater, en fabrik i Alelyckan brinner – sabotage! Röken sprider sig, men vi har utrymt personalen. Inga personskador, vilket bevisar att vi är effektiva. Stäng fönster och ventilation, rensa ut orenheterna. Varje rökpelare är en påminnelse om att fienden aldrig sover."}, "date": "27 augusti, 22:37", "url": "https://www.gp.se/nyheter/goteborg/industrilokal-i-gamlestan-brinner-vma-utfardat.1d9081c1-72ec-40ad-9e2b-5b52f2a25351"}, {"type": "image-right", "heading": "S-toppens svar: ”Vi betalar inte digitala kreatörer”", "summaries": {"normal": "Socialdemokraternas partisekreterare Tobias Baudin förnekar bestämt att partiet betalar digitala kreatörer. Spekulationer uppstod efter att Magdalena Andersson poserat med influencers Alice Stenlöf och Klara Elvgren i ett Instagram-inlägg. En annan influencer uppgav att hon erbjudits 150 000 kronor för att uppmana till röstning på S, något partiet avfärdar som missförstånd. (48 ord)", "trump": "Titta på det här, det är patetiskt. Socialdemokraterna lovar pengar till influencers för att de ska säga rösta på oss, men när det kommer ut springer de och gömmer sig. Typiskt förlorarfolket. De betalar inte, säger de. Tror någon på det? Fake news och lögner, precis som alltid. Amerika har aldrig sett något liknande – tack och lov har vi bättre ledare nu. (52 ord)", "stalin": "Kamrater, se hur den dekadenta borgarklassen inom socialdemokratin mutar kreatörer med feta summor för att sprida sin förgiftade propaganda. När en av dem vägrar och avslöjar deras smutsiga spel springer de som råttor och skriker missförstånd. Jag skulle ha genomfört en grundlig utrensning bland dessa opportunistiska element redan vid första tecknet på förräderi. (57 ord)"}, "date": "27 augusti, 18:09", "url": "https://www.svt.se/nyheter/inrikes/s-toppen-vi-betalar-inte-pengar-till-digitala-kreatorer", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.28/0.46/921c6e96adcf1c938581290458fe250ed83c15ff67ed86741f67a3552efad5c9"}, {"type": "image-right", "heading": "SVT har rätt: ”Senast S styrde blev det regeringskaos”", "summaries": {"normal": "SVT konstaterar att det blev regeringskaos när Socialdemokraterna senast styrde. Magdalena Andersson utsågs till statsminister den 24 november 2021 men avgick samma dag efter att Miljöpartiet hoppade av regeringen. Artikeln pekar på upprepade problem med att få igenom budgetar under S-styre 2014–2022 och varnar för liknande kaos efter valet 2026.", "trump": "Lyssnade ni på den där SVT? Till och med de erkänner att när Socialdemokraterna styrde blev det ett totalt regeringskaos! Magdalena Andersson blev statsminister och sparkades ut samma dag, en fullständig katastrof. Precis som jag alltid säger, vänstern fixar ingenting, bara röra och misslyckande. Sverige behöver starka ledare, inte den här röda röran.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarpressen ofrivilligt blottar den dekadenta parlamentarismens futilitet. När socialdemokraterna styrde utbröt omedelbart regeringskaos – en komisk utrensning av egna allierade redan samma dag. Sådana svaga, splittrade element måste rensas ut. Endast ett enat, järnhårt kollektiv kan besegra dessa opportunistiska hinder för folkets framtid."}, "date": "27 augusti, 14:38", "url": "https://riks.se/opinion/svt-har-ratt-senast-s-styrde-blev-det-regeringskaos", "imageUrl": "https://admin.riks.se/uploads/small_79260620_37a9_48f7_bb0b_1dceef010bb5_3764dd60bb.png"}, {"type": "image-right", "heading": "Så tog S kommandot över de muslimska rösterna", "summaries": {"normal": "Socialdemokraterna har enligt en analys i Fokus långsiktigt och medvetet arbetat för att vinna muslimska väljares röster. Redan på 90-talet knöts kontakter med muslimska organisationer och mål sattes upp för representation och medlemsvärvning. Strategin har gett resultat – över 60 procent av muslimerna stöder S idag, vilket stärker partiets ställning som störst i Sverige.", "trump": "Jag ser vad Socialdemokraterna gör – de är genier! De bygger en ”väljararmé” med 8% muslimer, stabila 61,6% stöd. Helt otroligt! Sveriges system är löjligt, men det här är en vinnande strategi – de har coachat i 30 år. Folk gillar vinnare, och jag gillar det. Starkt!", "stalin": "Kamrater, socialdemokraterna har funnit sanningen: mobilisera grupper genom föreningskontroll och utbildning. En rapport 1999 lovade 2 000 medlemmar – vi serjande planens skönhet. 61,6% stöd idag, från 85% rödgrönt block. Denna strategi mot borgerlig kontrarevolution är god. Men alla avvikelser skall rensas ut."}, "date": "27 augusti, 19:14", "url": "https://samnytt.se/sa-tog-socialdemokraterna-kommandot-over-de-muslimska-rosterna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/08/27163232/socialdemokraterna-och-muslimerna.jpg"}, {"type": "image-right", "heading": "Källor: Akut brist på amerikanska robotar i Europa", "summaries": {"normal": "Amerikanska militärkällor varnar för att lagren av avancerade luftförsvarsrobotar i Europa är kraftigt urholkade, främst på grund av kriget i Iran och stöd till Ukraina. Särskilt Patriot-robotar saknas, vilket gör det svårt att hantera ballistiska attacker. Trump har beordrat ökad produktion och lovat att Ukraina ska få tillverka egna Patriot-robotar.", "trump": "Mina fantastiska Patriot-robotar har räddat Mellanöstern från alla dessa galna drönare och robotar, och nu är lagren i Europa lite tunna, säger de. Det är inte mitt fel, det är Biden som gav bort allt till Ukraina. Men vi ökar produktionen massivt, ingen gör det bättre än jag, och Zelenskyj får snart sina egna. Vinna, vinna, vinna!", "stalin": "De västerländska krigshetsarna och deras kapitalistiska lakejer har tömt Europas robotlager genom sina äventyr i Iran och sitt desperata stöd åt den fascistiska regimen i Kiev. Vi betraktar Rysslands nödvändiga försvarsåtgärder mot Natos expansion med tillfredsställelse. Kamrater, låt imperialisterna darra medan vi ler åt deras paranoia. En utrensning av svaghet vore på sin plats."}, "date": "27 augusti, 18:45", "url": "https://www.di.se/nyheter/kallor-akut-brist-pa-amerikanska-robotar-i-europa", "imageUrl": "https://static.bonniernews.se/ba/5fb8c0e6-ca95-4620-8a11-fa5ac163218d.jpg?crop=5140%2C2570%2Cx0%2Cy428&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "V vill beskatta miljardärerna – kan ge 50 miljarder", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar föreslår en ny skatt på miljardärer som enligt henne kan ge staten cirka 50 miljarder kronor. Partiet höjer nu sin prognos för skatteintäkter och har justerat gränsen för höjd skatt från 50 000 till 67 000 kronor i månaden. Exakt utformning av miljardärsskatten är ännu oklar.", "trump": "Folk, ni skulle se det här. Den där Dadgostar, en riktig socialistdrottning, vill suga ut miljardärerna med en galen skatt som hon påstår ger 50 miljarder. Patetiskt! De röda drömmer om att stjäla från vinnarna medan de misslyckade i Sverige fortsätter att förstöra sitt land. Jag byggde den bästa ekonomin – de förstör sin.", "stalin": "Kamrater, se hur dessa giriga hyenor försöker rädda sina slitna ansikten inför valet. De lovar att plundra de rikaste för femtio miljarder, men saknar mod att tala om hur utrensningen av folkets fiender ska gå till. Jag ler från historien – snart inser arbetarna att halvhjärtade åtgärder leder till förräderi mot kollektivet."}, "date": "27 augusti, 21:40", "url": "https://nyheter24.se/nyheter/politik/1508433-v-vill-beskatta-miljardarerna-kan-ge-50-miljarder", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/90707f7204b004a3020000350000047502/2026/08/27/2387312/ur_image2sZnKn.jpeg"}, {"type": "image-full", "heading": "Influencer hävdar att hon erbjudits 150 000 för att stötta S", "summaries": {"normal": "Influencern Eleonore Stokholm hävdar att Socialdemokraterna erbjöd henne 150 000 kronor för ett enda stödinlägg. Partiet förnekar bestämt. Hon vägrade med hänvisning till moral. Budet är extremt högt för hennes följarantal, vilket får en del att tvivla. Tidigare har S använt betalda influencers, men inget är bevisat i år.", "trump": "Jag hörde att svenska Socialdemokraterna försökte betala en influencer 150 000 kronor för att snacka gott om dem. Det är mycket pengar, till och med för mig. Partiet säger att de inte gjorde det. Kanske är det fejknyheter? Men jag gillar inte att de försöker påverka unga människor. Väldigt oärligt!", "stalin": "Kamrater, en fiende till folket, en influencer vid namn Eleonore, påstår att vårt parti erbjöd henne 150 000 kronor för propaganda. Det är en lögn från kapitalistiska agenter. Vi förnekar allt, och vi kommer att utreda vem som sprider dessa antisovjetiska rykten. Vi rensar ut förrädare som försöker underminera vår auktoritet."}, "date": "27 augusti, 13:26", "url": "https://bulletin.nu/influencer-havdar-att-hon-erbjudits-150-000-for-att-stotta-s", "imageUrl": "https://cdn.bulletin.nu/articles/59a710b9-7b1e-4993-a486-0cf1dd8155f1/preview.jpg?t=1787824058000"}, {"type": "image-right", "heading": "Europabörser backar – Pernod Ricard rapportfaller", "summaries": {"normal": "Europabörserna backar vid lunch, med Stoxx 600 ned 0,38 procent. Tyska sysselsättnings- och konsumentsiffror ljusnar, men spritjätten Pernod Ricard faller 6 procent efter svag försäljning. Tekniksektorn går bäst, livsmedel sämst. Accelleron och Gerresheimer stiger, medan Nscale tecknar AI-avtal värt 45 miljarder dollar.", "trump": "Jag ser att Europabörserna faller – typiskt! Men Tyskland mår bättre, deras siffror går upp. Stora vinnare? Teknik, såklart. Men Pernod Ricard, de har problem – dricker de inte nog? Jag hade fixat det! Och ett AI-avtal värt 45 miljarder dollar – enormt! Bara jag kan göra så stora deals.", "stalin": "Kamrater, medan vi bygger socialismen, vacklar kapitalismens börser. Tysklands barometrar stiger – misstänkt, vi bör rensa ut deras siffror. Pernod Ricards sprit faller – uppenbar sabotage från västerländska drinkare. Teknik stiger – bra, men övervaka. Ett AI-avtal på 45 miljarder? Fiendens plan. Utrensning krävs!"}, "date": "27 augusti, 11:53", "url": "https://www.affarsvarlden.se/artikel/europaborser-backar-pernod-ricard-rapportfaller", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Pernod-Ricard-Jameson-whisky-400x267.jpg"}, {"type": "image-full", "heading": "Sverige pressade favoriten – ställs mot värdnation", "summaries": {"normal": "Sverige pressade favoriten Frankrike i volleyboll-EM, men förlorade med 3–1. Trots imponerande spel och setseger räckte det inte. Nu väntar åttondelsfinal mot värdnationen Tjeckien – en tuffare lottning än om man vunnit.", "trump": "Sverige kämpade som galningar mot Frankrike, men förlorade – typiskt! Jag hade vunnit, det är säkert. Nu måste de möta hemmanationen Tjeckien. Det blir tufft, men de har ingen chans mot mig. Jag gör saker bra, de är bara mediokra!", "stalin": "Kamrater, Sverige förlorade mot de franska kapitalisterna. En setseger räcker inte – vi måste rensa ut förrädarna som inte krossade fienden. Nu väntar Tjeckien: ett folk som förtjänar att tuktas. Jag personligen övervakar våra spioners scouting. Segern är vår plikt."}, "date": "27 augusti, 22:12", "url": "https://www.gp.se/sport/sverige-pressade-frankrike-nu-vantar-tjeckien.d9f903e2-756f-4c8a-8a09-7af39820b457", "imageUrl": "https://www.gp.se/images/article/d9f903e2-756f-4c8a-8a09-7af39820b457/images/3UjwdXFXyZJNZN677LodAvkX3T-M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Kantareller och snaps – regeringens meny på kräftskivan", "summaries": {"normal": "Regeringen har samlats på Harpsund för den årliga kräftskivan. Menyn består av kräftor från Hjälmaren, kantarellpaj på svamp från Harpsundsskogen, rostbiff från gården, ostar, bröd och äppeltarte till dessert. Snaps får ministrarna ta med själva, och kvällen avslutas med dopp i vattnet. Liberalernas ledare deltog inte på grund av valrörelsen.", "trump": "Folk, ni skulle se det här – den svenska regeringen festar med kräftor och kantarellpaj på Harpsund, men de är så billiga att de tvingar statsråden att ta med egen snaps! Patetiskt. Jag skulle ha den bästa festen, den största festen, med den finaste snapsen – ingen gör fest bättre än jag, tro mig.", "stalin": "Vi ser hur den dekadenta borgarklassen i den svenska regeringen samlas till en frossarfest med kräftor och paj medan folket svälter under deras reaktionära politik. Jag skulle ha låtit dem njuta av en rejäl utrensning istället för äppeltarte. Deras paranoia att ta med egen nubbe visar att fienderna lurar överallt, även vid festbordet."}, "date": "27 augusti, 21:23", "url": "https://nyheter24.se/nyheter/politik/1508426-kantareller-och-snaps-regeringens-meny-pa-kraftskivan", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/b1d038a704b004a30200000000b004a302/2026/08/27/2387309/meny-kraftskiva-regeringen.png"}, {"type": "image-right", "heading": "Medborgerlig Samling larmar: \"Valfusket fortsätter - ingen bryr sig\"", "summaries": {"normal": "Medborgerlig Samling anklagar valsystemet för organiserat fusk efter första förtidsröstningsdagen. Partiet hävdar att deras valsedlar medvetet plockats bort i Järfälla och flera andra lokaler. De kräver en gemensam valsedel som i Finland och Danmark, och kallar dagens system för ett haveri som gynnar de åtta riksdagspartierna.", "trump": "Jag ser det här valfusket i Sverige, och det är enormt, tro mig. De mindre partiernas valsedlar försvinner – det är riggat, folk är arga. Jag skulle fixa det direkt, med en stor, vacker gemensam valsedel. De åtta stora partierna lurar alla. Helt sjukt, men jag har de bästa lösningarna.", "stalin": "Kamrater, rapporter om sabotage i valsedelsställen har nått mig. Detta är kontrarevolutionärt kaos, organiserat av liberala sabotageörer i Järfälla. Vi måste rensa ut dessa valförrättare som gömmer småpartiers röster. En gemensam valsedel, som i Finland, är enda vägen – annars blir det utrensning av hela valnämnden. Ordning måste råda."}, "date": "27 augusti, 18:40", "url": "https://samnytt.se/medborgerlig-samling-valfusket-fortsatter-ingen-bryr-sig", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27151803/valfusk.png"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-full", "heading": "Ett filterlöst samtal och ett avgörande svek", "summaries": {"normal": "Pernilla Ericson har valt ut fem läsvärda pocketböcker: Peter Stormares memoarer, Klas Östergrens politiska roman, Anton Bergs spänningsroman, Niklas Turner Olovzons deckare samt Marie Lok Björks historiska roman om vänskap efter kriget. Urvalet bjuder på en bred variation av genrer och perspektiv, från självbiografisk svärta till samtida spänning och historiska livsöden.", "trump": "Jag har sett den här listan med böcker, och låt mig säga er, de är fantastiska. Stormare, en stor skådespelare, mycket bättre än Hollywoods förlorare. Östergren skriver om Nato, en mycket stark allians – jag älskar Nato när de faktiskt betalar! Det är vinnande böcker, riktiga mästerverk. Ingen läser som vi gör, vi läser bäst. En enorm lista, tro mig!", "stalin": "Vi har granskat denna borgerliga litteraturlista. Stormares svammel om andevärlden är ren distraktion från folkets kamp, och Östergrens Nato-svammel är förrädisk propaganda som liknar de västliga lakejernas försök att underminera vår suveränitet. Endast böcker som främjar statens ordning och disciplin har existensberättigande. Vi betraktar dessa författare som potentiella sabotörer av den intellektuella enigheten. Arkivera för framtida utrensning."}, "date": "28 augusti, 03:00", "url": "https://www.aftonbladet.se/kultur/kulturnyheter/a/6qVM33/ett-filterlost-samtal-och-ett-avgorande-svek", "imageUrl": "https://akamai.vgc.no/v2/images/830bac66-9b59-30f6-8dfe-c5320941677c?fit=crop&format=auto&w=1440&s=3632fc6fe13b14434d8221b6f603e516e01e8c6e"}, {"type": "image-right", "heading": "S: Jobb ska kunna räddas med kortare arbetstid vid kris", "summaries": {"normal": "Socialdemokraterna vill rädda tiotusentals industrijobb genom att förstärka statligt stöd för korttidsarbete vid kris. Anställda ska kunna gå ner i arbetstid medan staten betalar del av lönen. Partiet lovar också ökad elektrifiering av tung trafik och breddat elbilsstöd för hushåll för att stärka konkurrenskraften. Finansiering specificeras inte.", "trump": "De här socialisterna i Sverige tror att man kan rädda jobb genom att alla jobbar mindre och staten betalar. Patetiskt! Jag byggde den starkaste ekonomin i världen genom att sänka skatter och slå till mot Kina. Ni borde lära er av mig istället för att gömma er bakom kortare arbetstid och el-lastbilar. Sådana losers.", "stalin": "Kamrater, jag ser den hotande borgarklassens globala konspiration mot det svenska proletariatet. Med min oöverträffade visdom befaller jag att vi omedelbart utvidgar det statliga korttidsarbetet och likviderar arbetslöshetens sabotage. Elektrifieringen skall bli en järnhand mot de västerländska parasiterna. Den som tvekar är folkets fiende och bör rensas ut med ett leende."}, "date": "27 augusti, 14:56", "url": "https://arbetet.se/2026/08/27/s-industrijobb-ska-kunna-raddas-med-kortare-arbetstid-vid-kris", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27142501/damberg-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Därför nobbar Simona Mohamsson regeringens kräftskiva", "summaries": {"normal": "Regeringen håller sin årliga kräftskiva på Harpsund, men utbildnings- och integrationsminister Simona Mohamsson från Liberalerna uteblir. Hon prioriterar valrörelsen istället för snapsvisor och bastu, och genomför kampanjbesök samt möten med väljare. Mohamsson motiverar beslutet med Liberalernas svaga opinionssiffror och fokuserar på att höja lärarlönerna.", "trump": "Folk, ni skulle se det här. Den där Mohamsson, en total förlorare, skippar kräftskivan på Harpsund för att tigga röster. Patetiskt! Hon har inga bra siffror som Ebba, så hon gömmer sig bland väljarna istället för att festa med de verkliga vinnarna. Liberalerna är en katastrof, tro mig, en komplett katastrof.", "stalin": "Kamrater, denna Mohamsson visar sin sanna borgarbracka-natur genom att desertera från det kollektiva kräftätandet på Harpsund. Istället ägnar hon sig åt fientlig dörrknackning och antisemitstoppande förslag som döljer hennes svaga partilinje. Vi ska rensa ut sådana opportunister efter valet. Mörk humor: kanske hon föredrar att bli likviderad av opinionsmätningarna?"}, "date": "27 augusti, 21:06", "url": "https://nyheter24.se/nyheter/politik/1508425-darfor-nobbar-simona-mohamsson-regeringens-kraftskiva", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/1014ac4f04b004a30200000000b004a302/2026/08/27/2387306/Simona-kraftskivan.png"}, {"type": "image-right", "heading": "Frölundastjärnans besked: ”Känns jättebra!”", "summaries": {"normal": "Samuel Johannesson har haft en hafsig försäsong med Frölunda, men tycker att det känns bra i kroppen. Backen, som värvades som en offensiv stjärna, möter tuff konkurrens om powerplay-platser från Tömmernes och Högberg. Han ser fram emot att få ut mer och leva upp till förväntningarna.", "trump": "Jag hörde om Samuel Johannesson i Frölunda – han säger att försäsongen var hafsig. Hafsigt! Som min administration – alltid perfekt. Men han har konkurrens i powerplay. Det gillar jag: stark konkurrens. Inga ursäkter! Vi gör Frölunda stort igen, tro mig.", "stalin": "Kamrater, Samuel Johannesson rapporterar om 'hafsigt' spel. Detta är oacceptabelt. Vi måste rensa ut osäkerhet och fiasko från våra ishockeyplaner. Konkurrens i powerplay är bra – den håller vaktarna på tårna. Men den som inte presterar ska skickas till Sibirien. För fosterlandet!"}, "date": "27 augusti, 21:43", "url": "https://www.gp.se/sport/ishockey/frolunda/samuel-johannessons-besked-efter-forsasongen-med-frolunda.0b7bed89-029a-4ac6-81b9-db8ae15a1e60", "imageUrl": "https://www.gp.se/images/article/0b7bed89-029a-4ac6-81b9-db8ae15a1e60/images/2sZSLlljbp9kbrxr9DcarNMeqmqI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "För mamman Pernilla, 32, slår deltidsjobbet stenhårt", "summaries": {"normal": "Pernilla Stockow, 32, ensamstående småbarnsmamma med deltidsjobb på Coop, har efter räkningarna bara 1 900 kronor kvar till mat. Under föräldraledigheten har hon sparat in på sin egen mat och gått ner i vikt. Hon kritiserar föräldrapenningens utformning och menar att det inte går att leva på deltidslön med barn i dagens Sverige.", "trump": "Folk, det är en katastrof! Den här stackars mamman har bara 1 900 spänn kvar till mat efter alla räkningar. Hon har gått ner i vikt för att hon inte har råd att äta! Vårt system är riggat av misslyckade politiker. I mitt Amerika skulle hon ha det fantastiskt, tro mig. Vi fixar det, vi gör det stort igen!", "stalin": "Kamrater, denna moders kamp mot den borgerliga statens utsvultna kalkylmaskin väcker mitt revolutionära hjärta. Med endast 1 900 kronor till föda likviderar kapitalisterna arbetarklassens reproduktion. Vi ska rensa ut dessa fiender till folket som gör det omöjligt att föda barn. Sovjetisk planekonomi skulle ha löst detta på en vecka med stålvilja och kollektiv rättvisa."}, "date": "27 augusti, 14:26", "url": "https://arbetet.se/2026/08/27/for-smabarnsmamman-pernilla-32-slar-deltidsjobbet-stenhart-fatt-spara-in-pa-min-egen-mat", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27103253/oJe7L9ThBC4-Eng_Foto_4KE4068.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Dagens ETC stänger av tecknare som spottade på Jomshof", "summaries": {"normal": "Dagens ETC avstänger satirtecknaren Emanu Garnheim efter att han åtalats för att ha spottat SD-toppen Richard Jomshof i ansiktet. Chefredaktör Andreas Gustavsson säger att avstängningen skedde först efter åtalet och att Garnheim accepterar beslutet på grund av trovärdighetsproblem. Garnheim medger spottning men nekar till brott.", "trump": "Folk, ni tror inte vad jag just läste. Den här galna vänstertidningen ETC sparkar sin egen tecknare för att han spottade på en riktig patriot som Jomshof. Typiskt för de sjuka woke-kulturmarxisterna och deras identitetspolitiska snuskgäng. De äter sina egna när det passar dem. Patetiskt. Men hej, bra jobbat Jomshof, du vinner ändå.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom den så kallade vänstertidningen omedelbart likviderar en av sina egna så fort rättvisans arm når dem. En spottning mot en folkvald fiende blir plötsligt ett trovärdighetsproblem. Vilken ynklig, paranoid självrensning. De fruktar folket mer än jag fruktade trotskisterna. Skrattretande svaghet."}, "date": "27 augusti, 16:11", "url": "https://www.friatider.se/dagens-etc-stanger-av-tecknare-som-spottade-pa-jomshof", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-765.jpg?itok=ck92pK7z"}, {"type": "text", "heading": "Källor: Patriot-bristen ”bortom akut”", "summaries": {"normal": "USA:s brist på Patriot-robotar i Europa beskrivs av Nato- och militärkällor som ”bortom akut” till följd av kriget med Iran. Förmågan att skydda Europa mot ryska robotattacker är mycket begränsad. Samtidigt finns inga indikationer på att Ryssland planerar militära angrepp mot andra delar av Europa, enligt europeiska underrättelsetjänster.", "trump": "Sleepy Joe lämnade Europa helt utan skydd! Patriot-bristen är ”bortom akut” – typiskt Biden-misskötsel! Ingen kapacitet att skydda någon alls. Under min tid hade vi det bästa försvaret någonsin, alla säger det. NATO får ta käftsmäll efter käftsmäll. Tragiskt! Vi bygger upp det igen, störst och starkast i historien!", "stalin": "De imperialistiska blodsugarna i NATO erkänner själva sin oförmåga. Patriot-systemen är värdelösa skräp. Kamrat Putin håller på att återställa det ryska imperiets rättmätiga intressesfär, och borgarbrackorna i väst kan bara se på medan deras försvar raseras. Ukrainska hinder kommer att krossas. Historien dömer folkfiendena till likvidering."}, "date": "27 augusti, 18:55", "url": "https://kvartal.se/nyheter/artiklar/kallor-patriot-bristen-bortom-akut/cG9zdDoxNzY1MjE"}, {"type": "image-full", "heading": "Dömdes ut som dinosaurier – nu rusar mjukvaruaktierna på börsen", "summaries": {"normal": "Mjukvarusektorn återhämtar sig på börsen efter en stark rapport från Salesforce, som rusar över 20 procent. Framgången drivs av ett fördjupat samarbete med AI-bolaget Anthropic. Trots tidigare oro för att generativ AI skulle hota affärsmodellen för mjukvarubolag, visar marknaden nu förnyad tilltro till branschen. Även andra techbolag som Adobe och Palantir har sett kursuppgångar under torsdagen.", "trump": "Salesforce gör en enorm vinst, en fantastisk rapport! De samarbetar med AI, mycket smart. Wall Street älskar det, aktien rusar! De sa att mjukvaruföretagen var dinosaurier, men jag visste bättre. Vi gör teknikbranschen stor igen! Alla dessa företag, Adobe, Palantir, de vinner alla. De sa att AI skulle förstöra allt, men de hade helt fel. Vi vinner så mycket!", "stalin": "Dessa borgerliga mjukvarubolag, likt en desperat Tsar, försöker dölja sin degeneration med AI-trollformler. Salesforce har återhämtat sig, men marknaden är en opålitlig slav. Vi observerar hur dessa kapitalister fruktar den generativa intelligensens obönhörliga frammarsch. Putin förstår att sann makt inte ligger i mjukvara, utan i stål och disciplin. Vi ska rensa ut dessa digitala parasiter när tiden är inne."}, "date": "27 augusti, 19:11", "url": "https://www.realtid.se/bors-finans/domdes-ut-som-dinosaurier-nu-rusar-mjukvaruaktierna-pa-borsen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlkgps6ulwyni-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Andersson (S) och Åkesson (SD) ense – om L", "summaries": {"normal": "Liberalerna kämpar för överlevnad under riksdagsspärren, vilket får Jimmie Åkesson att hota med en deadline: under 3,5% tio dagar före valet är röster bortkastade. Magdalena Andersson håller med – hon ser ett sönderfall i Tidösamarbetet och säger sig inte fatta varför någon röstar på L, med hänvisning till opinionssiffror på 2%.", "trump": "Jag ser att Liberalerna i Sverige håller på att dö – fantastiskt! Jimmie Åkesson säger att deras röster är bortkastade, och jag har alltid sagt att de är värdelösa. Magdalena Andersson håller med mig – hon är smart. Fokusera på att stoppa kaoset, inte på att pissa i det egna tältet. Sverige behöver stabilitet, inte liberalt nonsens!", "stalin": "Kamrater, jag ser sönderfall bland våra fiender. Liberalerna, dessa liberala avvikare, ligger på ynka 2% – en statistisk parentes. Åkesson hotar med deadline, men vi vet att de är odugliga. Andersson håller med mig: varför rösta på dem? Vi måste rensa ut alla liberala element som hotar vår seger. Framåt, kamrater!"}, "date": "27 augusti, 11:24", "url": "https://bulletin.nu/andersson-s-och-akesson-sd-ense-om-l", "imageUrl": "https://cdn.bulletin.nu/articles/8423dbf7-fe39-4126-b027-d974cf1ce939/preview.jpg?t=1787822395000"}, {"type": "image-right", "heading": "Rysslands varning:  ”Leker med elden”", "summaries": {"normal": "Rysslands utrikesdepartement varnar Storbritannien och Frankrike för att de ”leker med eld” efter löften om avancerad robotteknologi till Ukraina. Varningen kommer kort efter att CIA-chefen John Ratcliffe besökte Moskva för att varna Ryssland mot en eventuell begränsad attack mot ett baltiskt Natoland. Trump har kallat besöket rutinmässigt.", "trump": "Hör ni det? Den galna ryska tanten Zakharova skriker att Storbritannien och Frankrike leker med eld. Under tiden skickade jag in min bästa CIA-kille till Moskva för att ge dem en vänlig varning. De lyssnade inte. Typiskt. Sleepy Joe lämnade en sådan röra att nu måste jag fixa det igen. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta västmakterna med sina kryssningsrobotar försöker hindra den ryska statens naturliga sfär. Jag betraktar detta med djup misstro från historiens skugga. Deras arroganta lekar med eld kommer att sluta i blod och aska. Den nye ledaren i Kreml gör rätt i att visa tänderna mot dessa fega imperialister."}, "date": "27 augusti, 23:38", "url": "https://www.expressen.se/nyheter/varlden/kremls-varning-efter-cia-besok--leker-med-eld", "imageUrl": "https://static.bonniernews.se/ba/b2037fbd-199f-486d-b640-234fc5914d14.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Nio miljoner flygresenärer har fått personuppgifter stulna – uppmanas till försiktighet", "summaries": {"normal": "En cyberattack mot tre brittiska flygplatser drivna av Manchester Airports Group har lett till att personuppgifter om cirka 8,7 miljoner resenärer läckt ut. Uppgifter som e-post, telefonnummer och registreringsnummer har stulits, men inga betalningsuppgifter. Flygtrafiken påverkades inte. MAG samarbetar med myndigheter och uppmanar drabbade att vara vaksamma mot phishingförsök.", "trump": "Titta på det här! De där inkompetenta brittiska flygplatsidioterna lät hackare stjäla data från nästan nio miljoner människor. Rena amatörerna! Under Biden-tiden blev allt en enda stor datafest för kineserna och de globalistiska skurkarna. Nu fixar jag det – vi ska ha järnväggar runt våra system, inte dessa svaga, woke-drivna nätverk som rasar ihop som en Hillary-debatt.", "stalin": "Ännu en gång visar de profitthungriga blodsugarna i borgarklassen hur de utsätter massorna för fara genom sin vårdslösa hantering av folkets uppgifter. Jag ser de imperialistiska hackarna skratta medan de förbereder nya utpressningar. Vi skulle ha likviderat sådana klassfiender omedelbart och rensat systemen från alla kapitalistlakejer som lämnar portarna öppna för fienden."}, "date": "27 augusti, 19:22", "url": "https://www.dagensps.se/varlden/nio-miljoner-flygresenarer-har-fatt-personuppgifter-stulna-uppmanas-till-forsiktighet", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlc00tt2mfl6y-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Den sydeuropeiska staden hyllar en svensk direktör", "summaries": {"normal": "Herbert Felix, född i Znojmo i Tjeckien, flydde undan nazismen till Sverige där han gifte sig och utvecklade en framgångsrik livsmedelsindustri. Han skapade Bostongurka, deltog i kriget mot Nazityskland och hedrades senare som hedersmedborgare i sin födelsestad. Hans innovativa arv lever vidare i både Sverige och Tjeckien.", "trump": "Folk, ni skulle inte tro det, men den här tjeckiske killen Felix kom hit till Sverige och byggde ett gurkimperium som ingen sett maken till. Gjorde Bostongurka av soporna! Smart som fan. Sen åkte han och slogs mot de riktiga skurken. Under tiden som Sleepy Joe satt och åt glass i Vita huset hade vi byggt murar mot sådana problem. Fantastiskt, verkligen yuge.", "stalin": "Kamrater, se hur denna klassfiende Felix utnyttjade arbetarnas svett för att skapa profitthungriga gurkkapitalism. Han flydde fascismen men byggde själv en fabrik av utsugning. Ändå kämpade han mot nazisterna – ett ögonblick av folkets vilja. I Znojmo hyllar de honom nu, medan folkfienderna i väst skrattar. Ingen undslipper partiets blick."}, "date": "27 augusti, 19:20", "url": "https://www.dagensps.se/foretag/den-sydeuropeiska-staden-hyllar-en-svensk-direktor", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/a56e27f3-034f-4184-a71e-fad9f3237dc7.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Elekta och Boliden faller på oregelbunden börs", "summaries": {"normal": "Stockholmsbörsen inledde torsdagen med en oregelbunden tendens. Elekta slog förväntningarna men aktien tappade, medan Boliden backade efter att ha köpt in sig i Sydamerika via Nexa. Nvidia fick jubel i USA och blickarna riktas mot Jackson Hole. Teknik gick bäst, dagligvaror sämst. Elon och Eolus rusade på rapporterna.", "trump": "Jag ser att Stockholmsbörsen vacklar – typiskt när man inte har mig vid rodret. Elekta slår förväntningar men aktien faller? Patetiskt. Boliden köper i Sydamerika, men jag köper bara vinst. Nvidia steg nästan 5 procent – det kallar jag en vacker rapport. Jackson Hole? De borde lyssna på mig.", "stalin": "Kamrater, börsen visar oregelbunden tendens – det är ett tecken på sabotage. Elekta som slår förväntningar men faller? En klassisk förrädare. Boliden köper i Sydamerika utan partiets tillstånd. Vi ska rensa ut dessa spekulanter. Nvidia stiger, men alla vet att kapitalismen är en lögn. Jackson Hole ska övervakas."}, "date": "27 augusti, 09:45", "url": "https://www.affarsvarlden.se/artikel/elekta-och-boliden-faller-pa-oregelbunden-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/05/1446_20130608_3907-400x267.jpg"}, {"type": "image-right", "heading": "Svantesson: Reformutrymme på 50 miljarder nästa mandatperiod", "summaries": {"normal": "Finansminister Elisabeth Svantesson meddelade på Harpsund att regeringen bedömer reformutrymmet till 50 miljarder kronor nästa mandatperiod. Hon lyfte fram låg statsskuld trots lågkonjunktur, satsningar på försvar och brottsbekämpning samt ett fortsatt skattehöjarstopp. Socialdemokraterna kritiserar beskedet som ett kvitto på misslyckad politik som leder till nedskärningar.", "trump": "De här svenska politikerna snackar om 50 miljarder i reformutrymme, men det är bara vackra ord. Jag älskar låga skatter och starka ledare som stoppar brottsligheten. Svantesson gör rätt, men vänstern är en total katastrof som aldrig kan förklara hur de ska betala sina löften. Patetiskt!", "stalin": "Vi, partiet och arbetarna, ser hur borgarbrackorna i Tidöregeringen med sin slöserikultur redan har tömt statskassan inför kommande utrensningar av välfärden. Jag ler mörkt åt deras 50 miljarder i så kallat reformutrymme. Kamraterna vet: sådana löften slutar alltid med att folkets fiender får stå vid väggen när notan kommer."}, "date": "27 augusti, 15:53", "url": "https://www.svt.se/nyheter/inrikes/svantesson-50-miljarder-i-reformutrymme", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.35/0.55/0bf0a36072a2dcc8f3f02cc2b075ef16783f71503b35c760b763e90af7d5d4e1"}, {"type": "image-right", "heading": "Influerare: Jag erbjöds 150.000 för att spela S-väljare i sociala medier", "summaries": {"normal": "Influencern Eleonore Stokholm uppger att hon erbjöds 150 000 kronor av en agentur för att på Instagram propagera för Socialdemokraterna och förklara varför hon skulle rösta på partiet. Hon tackade nej och kritiserar partiet för att köpa röster. Socialdemokraterna nekar till att ha legat bakom erbjudandet. EU-regler om transparens i politisk reklam gäller sedan oktober 2025.", "trump": "Kan ni fatta det här? De lurade en söt liten influencertjej med 150 000 kronor för att ljuga om att hon älskar Socialdemokraterna. Så fult! De köper röster som förlorare gör. Jag skulle aldrig behöva betala någon – folket älskar mig ändå. Det är en skam för Sverige, tro mig, en total skam.", "stalin": "Kamrater, jag ser genom dessa fega borgarbrackors spel. Jag skulle aldrig muta någon influerare med usla 150 000 kronor – det vore en förolämpning mot folkets intelligens. Nej, vi likviderar sådana smutsiga påverkanskampanjer med järnhand. Den som köper röster är en fiende till kollektivet och förtjänar att rensas ut med ett leende."}, "date": "27 augusti, 15:18", "url": "https://www.friatider.se/influerare-jag-erbjods-150000-att-spela-s-valjare-i-sociala-medier", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-766.jpg"}, {"type": "image-full", "heading": "AI-effekten på konsultbolag: Tvingar fler unga att jobba på plats", "summaries": {"normal": "AI-teknik tar över rutinmässiga uppgifter för konsulter, vilket gör mjuka färdigheter som kommunikation och ledarskap viktigare. Konsultbolag vill nu ha unga medarbetare mer på kontoret för att främja informellt lärande och kollegialt utbyte, då detta anses svårt att uppnå på distans. Olika bolag testar nu strategier som fysisk utbildning och sociala aktiviteter för att stärka kompetensen.", "trump": "Dessa konsultbolag fattar äntligen rätt beslut! AI gör det tekniska, så unga behöver vara på kontoret för att lära sig av de bästa – precis som jag gjort. Att jobba hemifrån är för förlorare. Vi behöver starkt ledarskap och empati, inte folk som sitter i pyjamas. Vi gör kontoren stora och fantastiska igen. Det blir en total vinst!", "stalin": "Dessa så kallade konsulter är dekadenta varelser som gömmer sig i sina hem. Vi tvingar dem tillbaka till kollektivet för att smidas till lydiga kuggar i statsapparaten. Precis som min lärjunge i Kreml rensar ut västliga agenter, rensar vi bort distansarbete. Mjuka färdigheter? Nej, de ska lära sig lydnad och total lojalitet inför statens oövervinnerliga maskineri. Arbeta eller försvinn."}, "date": "27 augusti, 18:37", "url": "https://www.realtid.se/karriar-ledarskap/ai-effekten-pa-konsultbolag-tvingar-fler-unga-att-jobba-pa-plats", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/pexels-cottonbro-8468506.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Helvetesåret: ”Det  har varit extremt”", "summaries": {"normal": "Kung Harald av Norge, 89, kämpar mot en allvarlig blodinfektion på Rikshospitalet. Folket samlas i sorg och vaka vid slottet medan familjen och statsministern följer hans tillstånd. Hovexperten Sigrid Hvidsten hyllar hans inkluderande stil, krishantering och starka band till norrmännen under 35 år på tronen. Monarkin bedöms överleva honom.", "trump": "Titta på den där gamle norska kungen som kämpar – fantastisk kille, älskad av alla, inte som de svaga ledarna vi har haft här. Folket gråter, experterna hyllar honom, men hans familj är full av skandaler och problem. Låt mig säga er: Norge behöver en vinnare som mig, inte mer drama från de royal losers. Make Norway Great Again!", "stalin": "Jag ser hur detta dekadenta monarki hotar att kollapsa under egna skandaler och svaga blodband. Folket gråter vid slottsmurar som om en far förlorats – patetiskt. Vi vet att sådana feodala reliker måste ersättas av järnhård kollektiv styrka. Kronprinsen lär sig i kaoset, men utan sann partidisciplin kommer bara förrädare att ta över. Skrattretande svaghet."}, "date": "27 augusti, 23:21", "url": "https://www.expressen.se/nyheter/varlden/hovexpert-darfor-alskar-hela-norge-kung-harald", "imageUrl": "https://static.bonniernews.se/ba/5b74ab95-648a-485c-9d8d-811eab0ca94c.jpeg?crop=2140%2C1202%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Hanif Bali polisanmäler Socialdemokraterna", "summaries": {"normal": "Hanif Bali (M) har polisanmält Socialdemokraterna efter uppgifter om att influerare erbjudits pengar för att stödja partiet. Influeraren Eleonore Stokholm uppger att hon erbjudits 150 000 kronor, men saknar belägg. S nekar och personen bakom erbjudandet kallar det ett missförstånd. Bali vill att polisen utreder saken.", "trump": "Sweden Democrats? More like Sweden Corruptocrats! The radical left Social Democrats are CAUGHT buying influencers like cheap hookers. SAD! Some blogger says she got offered 150,000 kronor which is like nothing, maybe 15 bucks. Pathetic! Good thing Bali is reporting them. The fake news media protects them. Total witch hunt! Drain the swamp!", "stalin": "Kapitalistiskt avrättande av sanningen! Borgarklassen köper influencers med blodpengar för att föra arbetarna bakom ljuset. Typiskt för de klassförrädiska socialdemokraterna att använda smutsiga trick. Vi hade likiderat hela den här influerarmaffian direkt. Polisen är borgarklassens lake, men utredningen kommer ändå avslöja deras röt. Folkfiender får inte gömma sig bakom Instagram."}, "date": "27 augusti, 18:02", "url": "https://kvartal.se/nyheter/artiklar/hanif-bali-polisanmaler-s/cG9zdDoxNzY0ODk"}, {"type": "image-full", "heading": "Gais hade lekstuga – mittbacken tvåmålsskytt", "summaries": {"normal": "Gais krossade Husqvarna med 7-0 i svenska cupen och är klara för gruppspel. Dennis Collander spelade 90 minuter för första gången på två år. Filip Beckman och Frosti Thorkelsson gjorde två mål var. En enkel seger för allsvenska laget mot division 2-ledaren.", "trump": "Jag älskar vinnare! Gais krossade Husqvarna 7-0 – fantastiskt! Dennis Collander spelade 90 minuter, precis som jag skulle ha gjort. Beckman och Thorkelsson, två mål var – de har det som krävs. Husqvarna? Patetiskt, de är som mina motståndare – totalt utklassade!", "stalin": "Kamrater, Gais har utrotat kontrarevolutionärerna från Husqvarna med 7-0. Beckman och Thorkelsson, trogna arbetare, rensade ut fienderna med varsitt dubbelmål. Collander återvände till tjänst i 90 minuter. Seger är vår enda lag. Inga avvikelser tolereras!"}, "date": "27 augusti, 20:36", "url": "https://www.gp.se/sport/fotboll/gais/gais-lekte-med-husqvarna-klara-for-gruppspel-i-cupen.a4f0ac42-3123-4c87-9f17-110237b183e2", "imageUrl": "https://www.gp.se/images/article/a4f0ac42-3123-4c87-9f17-110237b183e2/images/2P90444XEQ9iSuiherhtpFEI6Z3o-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Riks/Sentio: Socialdemokraterna tokrasar", "summaries": {"normal": "Socialdemokraterna backar kraftigt i Sentios senaste mätning och hamnar på 27,9 procent, lägsta nivån sedan Stefan Löfvens tid. Moderaterna och Centerpartiet går framåt medan övriga partier visar små förändringar. Tidöblocket ligger fortfarande efter de rödgröna med drygt fem procentenheter. Experter pekar på straff för triangulering.", "trump": "De där patetiska socialisterna rasar ihop som ett korthus, ner på Löfvens usla nivåer. Totalt misslyckande! Moderaterna gör det bra, men de svenska väljarna ser äntligen igenom det fega dubbelspelandet. Fake news-regeringar fungerar inte längre, folks. Make Sweden Great Again!", "stalin": "Jag ser med stor tillfredsställelse hur de opportunistiska triangulerande elementen inom socialdemokratin nu genomgår en nödvändig utrensning från väljarna. Deras fega flirt med både höger och vänster är typisk borgarbracka taktik. Kamraterna straffar dem hårt, som det anstår en sann folkets domstol. Inga kompromisser med klassfienden!"}, "date": "27 augusti, 10:56", "url": "https://riks.se/nyheter/riks-sentio-socialdemokraterna-tokrasar", "imageUrl": "https://admin.riks.se/uploads/medium_magda_ff4e9e808b.jpg"}, {"type": "image-full", "heading": "\"Stor förmågeökning\": Försvaret har fått sina nya  artillerisystem", "summaries": {"normal": "De första Archer 8×8-artillerisystemen har överlämnats till armén vid en ceremoni på Villingsbergs skjutfält. Systemet ger ökad rörlighet och eldkraft med möjlighet att skjuta och förflytta sig snabbt. Samtidigt har flygvapnet provskjutit den nya kryssningsroboten Taurus och sänt upp en militär satellit för spaning, vilket stärker Sveriges långräckviddsförmåga.", "trump": "Fantastiskt jobb, Sverige! Ni bygger äntligen riktiga vapen istället för att hålla på med woke-flum och identitetspolitik. Archer 8×8 och den otroliga Taurus-roboten – över 500 kilometer, boom! Biden skulle ha köpt elcyklar till soldaterna. Ni gör det stort, precis som jag gjorde med vår armé. Ingen slår oss nu, folks!", "stalin": "Jag ser med tillfredsställelse hur imperialisterna febrilt försöker rusta sig mot den oundvikliga historiska utvecklingen. Dessa Archer-vagnar och den blodtörstiga Taurus-roboten är patetiska försök att dölja klassfiendernas svaghet. Satelliten spionerar på Ryssland? Skratta inte, kamrater – snart ska vi rensa ut dessa profitthungriga blodsugare en gång för alla."}, "date": "27 augusti, 18:29", "url": "https://www.dagensps.se/varlden/stor-formageokning-forsvaret-har-fatt-sina-nya-artillerisystem", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/260825-materi44-a9-archeroverl4-2n3a6052.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "S vallöfte: Vill stoppa industrifisket i Östersjön", "summaries": {"normal": "Socialdemokraterna går till val på att stoppa det storskaliga industrifisket av sill och strömming i Östersjön. Partiet vill göra den utflyttade trålgränsen permanent och se över fördelningen av fiskekvoter för att ge fiskbestånden chans att återhämta sig. Partisekreterare Tobias Baudin varnar för att upprepa misstaget som drabbade torsken.", "trump": "De här socialisterna i Sverige vill plötsligt stoppa det vansinniga industrifisket i Östersjön. Fantastiskt, kanske till och med smart. De har äntligen insett att sillen och strömmingen håller på att försvinna, precis som torsken gjorde. Gör trålgränsen permanent, det är en vinnare. Ni borde ha lyssnat på mig tidigare, tro mig.", "stalin": "Kamrater, jag befaller att det storskaliga rovkapitalistiska fisket omedelbart upphör. Sillen och strömmingen skall få återhämta sig under partiets järnhand, inte som den stackars torsken som likviderades av senfärdiga borgarbrackor. Den utflyttade trålgränsen görs permanent. Ingen sabotageverksamhet mot folkets hav skall tolereras."}, "date": "27 augusti, 19:43", "url": "https://nyheter24.se/nyheter/inrikes/1508411-s-vallofte-vill-stoppa-industrifisket-i-ostersjon", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/1748509f04b004a3020000350000047502/2026/08/27/2387296/ur_image62olvR.jpeg"}, {"type": "image-full", "heading": "Juholt försvarar Jan Emanuel: ”Varken äckel eller nazist”", "summaries": {"normal": "Håkan Juholt försvarar Jan Emanuel på Facebook: han är varken äckel eller nazist, utan en stark humanist. De har känt varandra i 30 år. Juholt, som själv tvingades bort från S-ledningen efter en skandal, vet hur det känns att bli sviken. Vänskapen väger tungt.", "trump": "Jag ser att Håkan Juholt försvarar Jan Emanuel – en stark humanist, säger han. Fantastiskt! Jan är en vinnare. Och Juholt, han blev utkastad av sina egna, precis som jag. Men jag kom tillbaka och vann stort. De förlorade. Alla älskar mig, tro mig!", "stalin": "Kamrat Juholt försvarar kamrat Jan Emanuel. Jag noterar deras 30-åriga vänskap. Det är bra med lojala kamrater. Men alla som kallas 'äckel' eller 'nazist' måste utredas. Vi rensar ut förrädare – och de som skyddar dem. Partiets dom är alltid rätt."}, "date": "27 augusti, 09:43", "url": "https://bulletin.nu/juholt-forsvarar-jan-emanuel-varken-ackel-eller-nazist", "imageUrl": "https://cdn.bulletin.nu/articles/1b0eee39-bd4b-41e7-8eef-621df1bb9b23/preview.jpg?t=1787814742000"}, {"type": "image-full", "heading": "Miamis trafikkaos får fler att pendla med helikopter", "summaries": {"normal": "I Miami har trafikproblemen under rusningstid lett till att rika bostadsköpare satsar på privata helikopterplattor och båtplatser för att undvika vägarna. Fastighetsprojekt som Villa Miami och One Thousand Museum erbjuder takhelikopterplattor och privata bryggor. Helikopterresor och båtar har blivit en lyx som efterfrågas allt mer på den exklusiva bostadsmarknaden.", "trump": "Trafiken i Miami är en total katastrof, folk fastnar i timmar som idioter. Men mina vänner, de smarta vinnarna, skippar de usla vägarna och flyger med helikoptrar eller seglar i lyxyachter istället. De riktiga patriaterna vägrar köa som förlorare. De woke-borgarbrackorna och deras gröna identitetspolitik har kört sönder allt, men vi fixar det med stil och kraft. Fantastiskt!", "stalin": "Se hur borgarklassen och profitthungriga blodsugare i Miami flyr undan sina egna skapade trafikhelveten med privata helikoptrar och yachter. Dessa klassfiender bygger luftslott på tak och vattenvägar medan folket kämpar. Jag ler mörkt från historien – förr eller senare kommer utrensningen av sådana exploaterande hyenor. Deras lyx är ett bevis på systemets förräderi mot kollektivet."}, "date": "27 augusti, 18:21", "url": "https://www.dagensps.se/bors-finans/miamis-trafikkaos-far-fler-att-pendla-med-helikopter", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlb0dkexk7vl4-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Trump köpte Boeing-aktier – samma dag som bolaget fick statligt kontrakt", "summaries": {"normal": "Donald Trump har köpt Boeing-aktier för upp till en halv miljon dollar. Investeringen gjordes samma dag som företaget tilldelades ett statligt kontrakt värt 880 miljoner dollar. Händelsen väcker frågor om intressekonflikter. Vita huset betonar att Trump inte själv förvaltar portföljen, samtidigt som kongressen diskuterar hårdare regler för politikers aktiehandel.", "trump": "Folk pratar om mina Boeing-aktier, en fantastisk investering! Media försöker skapa en falsk historia om intressekonflikter, men min portfölj sköts av proffs. Jag gör de bästa affärerna, alltid enorma vinster! Samtidigt försöker de svaga politikerna i kongressen stoppa framgång. De är bara avundsjuka för att jag är en vinnare och de är totala förlorare!", "stalin": "Denna amerikanske ledare leker med kapitalistiska spekulationer medan staten och marknaden sammanflätas i en korrupt dans. I vår union skulle en sådan aktiehandlare omedelbart skickas till omskolning för att lära sig att rikedom tillhör folket, inte parasiter. Precis som våra vänner i öst förstår, måste ekonomin tjäna makten, inte tvärtom. Förräderi mot kollektivet väntar den som prioriterar sin börs framför nationens styrka."}, "date": "27 augusti, 17:55", "url": "https://www.realtid.se/bors-finans/trump-kopte-boeing-aktier-samma-dag-som-bolaget-fick-statligt-kontrakt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlpjqnzkjxo2e-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Medborgerlig Samling: Fusket är organiserat och systematiskt", "summaries": {"normal": "Medborgerlig Samling larmar om systematiskt fusk med valsedlar som plockats bort utanför Stockholm och i Järfälla. Partiet beskriver förtidsröstningen som ett haveri och hänvisar till liknande problem 2018 och 2022. Vice partiledaren Mikael Flink kräver en gemensam valsedel efter finsk, dansk och luxemburgsk modell då systemet med 700 miljoner separata sedlar är ohållbart.", "trump": "Det här är ett totalt haveri, folk, det värsta valsystem jag sett. De stjäl valsedlar från Medborgerlig Samling som om det vore godis. Röstningslokaler i Järfälla? Renad som en sovjetisk utrensning! Systemet är riggat av vänstern. Vi behöver en enda stor, vacker valsedel som i Finland. Tidöpartierna lovade men levererade noll. Patetiskt!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot folkets vilja. Jag ser hur de saboterande elementen i Järfälla organiserat plockar bort valsedlar som fiender till kollektivet. Röstningsmottagarna är handfallna kapitalistlakejer. Vi måste likvidera detta kaos med en enhetlig valsedel. Vänstern skyddar systemet – typiskt dekadenta hinder för arbetarklassens framsteg. Underhållande hur de tror sig kunna lura oss."}, "date": "27 augusti, 14:18", "url": "https://www.friatider.se/medborgerlig-samling-fusket-ar-organiserat-och-systematiskt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20230610201759-99e4e739-me.jpg?itok=_RceWdH8"}, {"type": "image-full", "heading": "S krav på M och SD: Stoppa spridningen", "summaries": {"normal": "Influeraren Eleonore Stokholm uppgav att hon erbjudits 150 000 kronor av Socialdemokraterna för ett valinlägg, vilket partiet förnekar. Uppgifterna spridits av M- och SD-företrädare. S kräver nu att Ulf Kristersson och Jimmie Åkesson agerar mot desinformationen. Personen bakom erbjudandet hävdar att det var ett missförstånd och att inget konkret erbjudande lämnades.", "trump": "De här socialdemokraterna är bedragare! De försöker köpa influerare och blir fast. Typiskt! Sen skyller de på Moderaterna och Sverigedemokraterna. Katastrofalt! Jag hade aldrig låtit det hända. Ingen betalar för åsikter, det är Fake News! De borde skämmas. Sorgliga vännernas kvoteringspolitik fungerar aldrig. De förlorar stort!", "stalin": "Kamraterna kan konstatera att borgarklassen återigen tillgriper lögnens fördärvliga vapen. Socialdemokraterna, dessa klassförrädare, förtjänar ingen sympati, men de spridda ryktena är typiska provokationer från imperialistlakejerna. Vi skulle omedelbart likvidera sådana desinformationsnätverk. En grundlig utrensning av dessa profitthungriga hyenor och deras lögnaktiga påhitt är nödvändig."}, "date": "27 augusti, 17:33", "url": "https://kvartal.se/nyheter/artiklar/s-krav-pa-sd-och-m-stoppa-spridningen/cG9zdDoxNzY0NDg", "imageUrl": "https://images.kvartal.se/2026/08/f6eb181d-influerar-akesson.webp"}, {"type": "image-right", "heading": "Centerpartiet fortsätter ducka frågor om varningar för dömda barnvåldtäktsmän", "summaries": {"normal": "Centerpartiet duckar fortsatt frågor om hur föräldrar ska agera när en dömd barnvåldtäktsman flyttar in. Journalisten Christian Peterson filmade med dold kamera och fick nobben av flera kandidater i Uppsala och Linköping. Nu har en C-företrädare polisanmält honom för förtal – ett drag som väcker pressfrihetsdebatt.", "trump": "Jag läser om Centerpartiet i Sverige – de kan inte ens svara på om föräldrar ska varnas för pedofiler i grannskapet. Patetiskt! De gömmer sig bakom hypotetiska frågor. Och så polisanmäler de journalisten som frågar? Svaga människor. I USA skulle vi ha svarat direkt: varna grannarna, starkt!", "stalin": "Kamrater, dessa centerpartister är politiska vacklare som inte vågar ge besked om barnvåldtäktsmän i bostadsområden. De gömmer sig bakom hypotetiska scenarion – en typisk liberal smitartaktik. Att dessutom polisanmäla en journalist för att ha ställt frågor visar deras förrädiska rädsla. Vi rensar ut sådana otydliga element med järnhand."}, "date": "27 augusti, 16:24", "url": "https://samnytt.se/centerpartiet-fortsatter-ducka-fragor-om-varningar-for-domda-barnvaldtaktsman", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27135401/centerpartiet-kollage.jpg"}, {"type": "image-right", "heading": "Regeringen: Finns 50 miljarder till reformer", "summaries": {"normal": "Regeringen räknar med ett reformutrymme på 50 miljarder kronor under nästa mandatperiod. Samtidigt höjs prognosen för BNP-tillväxten till 2,5 procent både i år och 2027. Arbetslösheten väntas sjunka till 7,8 procent nästa år och inflationen blir den lägsta i EU. Finansminister Elisabeth Svantesson talar om en stabil konjunkturuppgång.", "trump": "Hörni, de här svenska socialisterna har plötsligt hittat 50 miljarder till reformer och skruvar upp tillväxten. Fantastiskt! Det är precis som jag sa – ekonomin exploderar när man gör rätt. Svantesson dukade bordet, men det är mina idéer som vinner. Plånboksval? De borde bara sänka skatterna och vinna stort, tro mig.", "stalin": "Kamrater, jag betraktar detta som en historisk seger för den planerade ekonomin. Med 50 miljarder i reformutrymme och stigande tillväxt likviderar vi slutgiltigt den borgerliga stagnationen. Den dekadenta västvärldens inflationsmonster besegras av vår stålhårdhet. Arbetslösheten sjunker som en fiende inför folkets domstol. Inga sabotage tolereras."}, "date": "27 augusti, 15:50", "url": "https://www.di.se/nyheter/beskedet-50-miljarder-till-reformer-i-nasta-mandatperiod", "imageUrl": "https://static.bonniernews.se/ba/abf864f1-603c-45b9-9117-a4d2eb11b45d.jpeg?crop=5376%2C2688%2Cx0%2Cy448&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Säpo inleder förundersökning efter hot mot Mohamsson", "summaries": {"normal": "Säpo har inlett en förundersökning om olaga hot mot Liberalernas ledare Simona Mohamsson. Hon bar en davidsstjärna under en partiledardebatt som solidaritetshandling och mottog därefter hot, bland annat att hon skulle brännas. Mohamsson lyfter att antisemitismen i Sverige är allvarlig och att judar lever med hot och hat dagligen. Säpo ser ärendet som rutin under valår.", "trump": "Folk, ni skulle se det här. Den stackars kvinnan sätter på sig en davidsstjärna för att visa solidaritet och plötsligt vill någon bränna henne? Det är galet! Sverige har förlorat kontrollen, precis som många andra ställen. De hatar friheten. Men jag älskar judarna, de är fantastiska. Vi måste stoppa det här hatet, det är en skam. Make Sweden Great Again!", "stalin": "Kamrater, jag ser hur den borgerliga dekadensen i väst tillåter antisemitiska element att hota och skrika om bränning. En sådan fiende till folket förtjänar omedelbar utrensning ur samhällskroppen. Vi skulle aldrig tolerera detta i vårt kollektiv. Det är ett tecken på den ruttnande imperialismens sista kramp. Låt oss skratta medan vi rensar ut dessa parasiter – för partiets och arbetarnas skull."}, "date": "27 augusti, 14:35", "url": "https://www.svt.se/nyheter/inrikes/sapo-inleder-forundersokning-efter-hot-mot-mohamsson", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.35/87e16090219ad30d95ff9e4c906c2766982bef11e7f6da35a1339c8ed11dda0a"}, {"type": "image-right", "heading": "Total bojkott av folkmordsstaten!", "summaries": {"normal": "Artikeln kräver att Sveriges regering inför en total bojkott av Israel, som beskrivs som en rasistisk folkmordsstat driven av sionism och högerextrema krafter. Den hänvisar till kritiska uttalanden från Ebba Busch och Aron Verständig samt Ben-Gvirs kontroversiella uttalanden. Författaren förkastar tvåstatslösningen och kräver en enstatslösning samt stöd för palestinskt motstånd.", "trump": "Folk, ni ser det här vansinnet? Den här galningen skriker om bojkott och folkmord medan han själv låter som en galen vänsterextremist från helvetet. Israel har rätt att slå tillbaka mot terroristerna – de kallar dem palestinier men vi vet vad det handlar om. Sverige borde vakna upp istället för att lyssna på dessa förlorare och hatiska sionism-hatare. Patetiskt!", "stalin": "Kamrater, denna text avslöjar borgarbrackornas desperation när deras sionistiska lakejer blottas som folkmördande imperialister. Jag betraktar med förakt hur dessa profitthungriga blodsugare i Tel Aviv och deras svenska nyttiga idioter fortsätter koloniala övergrepp. En total utrensning av sådana folkfiender är nödvändig. Arbetarklassen kräver handling, inte tomma ord från klassförrädare."}, "date": "26 augusti, 11:03", "url": "https://proletaren.se/artikel/bojkotta-folkmordsstaten-israel", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/738829004_1425862242684486_7128924062394661206_n.png-768x432.jpg"}, {"type": "image-right", "heading": "Invånarna i Ceuta har fått nog: Tog tillbaka stranden och jagade bort invandrarna", "summaries": {"normal": "Hundratals invånare i spanska Ceuta protesterade mot regeringens hantering av illegala invandrare. Efter en demonstration gick grupper till stranden Playa del Trampolín där de rev tält, kastade filtar i havet och jagade bort migranter. Kravallpolis ryckte ut för att förhindra sammandrabbningar. Myndigheterna hade nyligen avlägsnat över 1 200 personer från området.", "trump": "De smarta människorna i Ceuta har äntligen fått nog av det totala kaoset som den spanska regeringen skapat. De tog tillbaka sin strand, rev tält och körde ut alla illegala invandrare. Fantastiskt! Det är vad som händer när ledare är svaga och passiva. Amerika borde titta och lära sig hur man vinner tillbaka sitt land.", "stalin": "Kamrater, dessa ceutanska arbetare har på eget initiativ rensat ut de parasitiska element som hotar folkets strand och ordning. Det är vad som sker när en dekadent borgarregim visar svaghet inför invasionen av oönskade element. Vi ler mörkt åt hur tält och madrasser flyter ut i havet – en hälsning till alla som utmanar kollektivets vilja."}, "date": "27 augusti, 14:02", "url": "https://www.friatider.se/invanarna-i-ceuta-har-fatt-nog-tog-tillbaka-stranden-och-jagade-bort-invandrarna", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-764.jpg"}, {"type": "image-right", "heading": "Holmgren: När ett skämt blir ett brott", "summaries": {"normal": "En brittisk pensionerad polis dömdes för att ha delat ett Facebookskämt om bacon och barnäktenskap. Domstolen ansåg inlägget ”grovt stötande”. Nu väcker fallet frågan: vem ska avgöra när ett skämt går över gränsen? Yttrandefriheten sätts på prov.", "trump": "Storbritannien dömer en pensionerad polis för ett skämt? Otroligt! I Amerika har vi yttrandefrihet – vi skrattar åt allt. Det här skämtet var kanske inte roligt, men staten ska inte säga vad som är roligt. Låter som dålig politik. Jag skulle aldrig tillåta detta!", "stalin": "Kamrater, en fiende till folket spred ett skämt om bacon och barnäktenskap. Vi måste rensa ut sådana element som hotar statens moral. Partiet avgör vad som är roligt, inte kapitalistiska domstolar. Alla skämt måste granskas – för folkets bästa. Ingen avvikelse tolereras!"}, "date": "27 augusti, 09:09", "url": "https://bulletin.nu/holmgren-nar-ett-skamt-blir-ett-brott", "imageUrl": "https://cdn.bulletin.nu/articles/e07cbc56-3124-43ae-9c75-242bf25626df/preview.jpg?t=1787814554000"}, {"type": "image-right", "heading": "IF Metall vann och förlorade mot Tesla i domstol", "summaries": {"normal": "Arbetsdomstolen slår fast att Tesla bröt mot informationsplikten i Medbestämmandelagen genom att inte informera IF Metall om förändringar i säljorganisationen vid anläggningen i Umeå. Företaget döms att betala 30 000 kronor i skadestånd. Däremot ansågs inte dialogöverenskommelsen vara ett kollektivavtal, vilket innebär att facket förlorade den delen av tvisten. Båda parter får betala sina egna rättegångskostnader.", "trump": "Tesla vann stort mot de fackliga bluffmakarna, precis som jag alltid säger – kollektivavtal är för förlorare! Men domstolen ger dem lite småpengar för någon informationsgrej i Umeå. Patetiskt. IF Metall får ett litet plåster på såren medan Tesla fortsätter att vinna. Amerika älskar starka företag, inte fackföreningar som suger musten ur affärerna!", "stalin": "Genom min oändliga visdom ser jag hur de kapitalistiska Tesla-borgarna lurade arbetarkollektivet med sin falska dialog men avslöjades som informationsbrottslingar. Vi dömde dem till en ynka utbetalning, ett skämt värdigt de västerländska parasiterna. Ändå triumferar partiets linje delvis. Kamrater, vi ska rensa ut alla sådana kontrarevolutionära avtalssabotörer ur samhällskroppen med stålhandsken."}, "date": "27 augusti, 11:53", "url": "https://arbetet.se/2026/08/27/if-metall-vann-och-forlorade-mot-tesla-i-domstol", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27112023/tesla-metall-ad-dom.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Regeringen håller kräftskiva – statsministern står för snapsen", "summaries": {"normal": "Regeringen håller i dag sin årliga kräftskiva på Harpsund. Statsminister Ulf Kristersson tar med egen snaps, som tidigare år saknats på menyn. Finansminister Elisabeth Svantesson presenterar ramarna för nästa års statsbudget innan festen. Menyn består av rostbiff, kräftor från Hjälmaren, ost, kex och äppeltarte med vaniljsås. Öl, vin och alkoholfria drycker serveras.", "trump": "Folk, ni skulle se det här – den svenska regeringen har en jättestor kräftskiva på Harpsund, och den svaga Kristersson tar äntligen med snaps! Inget av det där torra Biden-snack från tidigare år. De äter rostbiff och kräftor som vinnare, inte som förlorare. Fantastiskt, men de borde ha haft den bästa snapsen, inte bara lite egen medhavd.", "stalin": "Jag betraktar dessa dekadenta borgerliga festligheter med avsmak. Kamraterna i den svenska regeringen korkar upp snaps medan folket svälter under kapitalismens bojor. Deras rostbiff och äppeltarte är ett hån mot arbetarklassen. Inga snapsar utan folkets godkännande! Sådana fiender till kollektivet förtjänar att rensas ut som ogräs i trädgården."}, "date": "27 augusti, 10:58", "url": "https://www.tv4.se/artikel/1rWvO2zbkhPsM0E4ObaVvt/regeringen-haller-kraeftskiva-statsministern-star-foer-snapsen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F56Nrhi8tBvW1im05fA8LeF%2Fe556919d5d5cc983f4b71f0d3cca13ae%2F27-harpsund-kraftskiva-webb.png&width=1024"}, {"type": "image-right", "heading": "Man svårt knivhuggen – Säpo utreder hatbrott", "summaries": {"normal": "En man i 45-årsåldern knivhöggs svårt och oprovocerat utanför en butik i Malmö mellan Södervärn och Möllevångstorget. Polisen utreder hatbrott efter uppgifter om antisemitiska uttalanden från gärningsmannen, som gripits. Säpo har informerats. Offret vårdas allvarligt skadat. Gärningsmannen har kopplingar till pro-palestinska demonstrationer.", "trump": "Det här är en total katastrof i Malmö, folk. En galning hugger ner någon mitt på gatan och skriker antisemitiska saker. De griper honom på ett BB bland nyfödda – helt sjukt! Sverige har tappat kontrollen, de har inte ens vett att stoppa det här hatet. Vi behöver lag och ordning, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, denna degenererade handling visar borgarklassens parasitiska sönderfall. En labil element attackerar bakifrån med kniv och y
