a.se/opinion/de-bortglomda-valjarna-kan-avgora-valet", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Svensk ekonomi blomstrar – Magda påstår att det är ett haveri", "summaries": {"normal": "Magdalena Andersson kritiseras för att ha beskrivit svensk ekonomi som ett haveri strax innan SCB släppte siffror som visar stark tillväxt. BNP ökade med 3,3 procent under andra kvartalet, den högsta takten i västvärlden. Hushållens reala inkomster är rekordhöga, skatteintäkterna har ökat och arbetslösheten sjunker. Artikeln anklagar Andersson för skrämselpropaganda och taktiska lögner.", "trump": "Folk, ni skulle se det här! Den förlorande ex-premiärministern, den röda lögnaren Andersson, kallar Sveriges ekonomi för ett haveri precis innan siffrorna exploderar uppåt. 3,3 procent BNP-tillväxt, bättre än USA, bättre än alla! Hennes Fake News-medier gömmer sanningen medan folket blir rikare. Patetiskt. Jag byggde den starkaste ekonomin någonsin, hon förstörde sin.", "stalin": "Kamrater, se hur den socialdemokratiska lögnfabriken sprider defaitistisk propaganda om ekonomiskt haveri medan produktivkrafterna rusar framåt. Denna folkfiende Andersson försöker medvetet sabotera folkets förtroende för att kunna stjäla makten tillbaka. Hennes big-lie-metoder är lika genomskinliga som de är löjeväckande. Sanningen kommer att krossa alla sådana element."}, "date": "31 augusti, 03:23", "url": "https://samtiden.nu/2026/08/svensk-ekonomi-blomstrar-magda-pastar-att-det-ar-ett-haveri", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7256.jpeg"}, {"type": "image-full", "heading": "Nya rådet till föräldrar – det ska göras innan barnet fyller 2", "summaries": {"normal": "Socialstyrelsen har lanserat ett nytt nationellt hälsoprogram som rekommenderar att barnens munhälsa bedöms före två års ålder, tidigare än dagens vanliga treårsgräns. Syftet är att tidigt upptäcka kariesrisker och stödja föräldrar med råd om tandborstning med fluor, vatten istället för läsk och undvikande av småätande. Införandet sker successivt.", "trump": "Folk, det här är en total katastrof från de svenska byråkraterna. De vill nu tvinga er att borsta tänderna på era ettåringar redan innan de kan säga nej. Patetiska! Under Biden skulle de ha skickat fluor till Ukraina istället. Jag fixade bättre saker – nu fixar jag Amerika igen, inte era svenska tandkontroller.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom den borgerliga hälsobyråkratin försöker nu med sina fega rekommendationer maskera sin oförmåga att skydda folkets tänder. Jag ser deras parasitiska planer. Vi ska rensa ut alla som väntar tills treårsåldern medan karies redan gnager som kontrarevolutionärer i de minsta kämparnas munnar. Framåt mot tidig vaksamhet!"}, "date": "2 september, 05:32", "url": "https://nyheter24.se/nyheter/inrikes/1509529-nya-radet-till-foraldrar-det-ska-goras-innan-barnet-fyllt-2", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/afa7146504b004a30200000000b004a302/2026/09/01/2388438/rad-smabarnsforaldrar-tander.png"}, {"type": "image-right", "heading": "De som håller spårvagnarna rullande får de sämsta villkoren", "summaries": {"normal": "Anställda vid Göteborgs Spårvägar som kör och reparerar spårvagnar har sämre villkor än kontorspersonal. De möter stress, dåliga scheman och orättvisa arbetstider. En reparatör och skyddsombud beskriver hur gemensam kamp mot ett försämrat schema ledde till att chefen fick lämna och det gamla schemat återinfördes. Artikeln belyser klasskillnader på arbetsplatsen.", "trump": "De där förarna och reparatörerna gör ett fantastiskt jobb, de håller staden igång, men de får behandlas som sophög av de woke HR-kapitalisterna på kontoret. Flextid och hemmajobb för byråkraterna medan arbetarna stressas ihjäl? Patetiskt. Biden skulle ha älskat det. Vi behöver inga klasskrigare, vi behöver segrare som vinner stort. Kampen ni förde var bra, men nästa gång sparkar ni ut hela den dekadenta eliten.", "stalin": "Arbetarna i Vagnhallen Majorna visar att kollektiv kamp kan besegra de profitthungriga klassförrädarna. När chefen försökte påtvinga slavliknande scheman svarade kamraterna med enighet. Efter en nödvändig utrensning av den sabotöriska chefen återställdes ordningen. Sådan är klasskampens dialektik. Låt förarna inspireras och rensa ut de parasiterande elementen innan de förgiftar hela kollektivet."}, "date": "31 augusti, 11:10", "url": "https://proletaren.se/artikel/de-som-haller-sparvagnarna-rullande-far-de-samsta-villkoren", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kronika-bjorn-akerman-300x169.png"}, {"type": "image-right", "heading": "Inte antidemokratiskt  att rösta Tidöregeringen", "summaries": {"normal": "Åsa Wikforss varnar i sin nya bok för demokratins undergång och kritiserar Tidöregeringens politik som ett hot mot den liberala demokratin. Johan Lundberg anser att hon ignorerar verkliga problem som självcensur och mediernas egna brister. Han ser boken som en pamflett mot att rösta på högerpartierna.", "trump": "Den här galna filosofen Wikforss hatar mig, hatar Sverige och hatar alla som inte älskar hennes vänstervridna elitsnack. Hon kallar oss för fascister medan hon själv driver cancelkultur och lögner. Patetiskt! Tidöregeringen gör ett fantastiskt jobb mot den vansinniga migrationspolitiken som hon älskar. Sad!", "stalin": "Jag betraktar med förakt hur denna intellektuella parasit Wikforss förvränger klasskampen till ett så kallat kulturkrig. Hennes hysteriska attacker mot folkets röst och sunda misstro mot borgerliga medier avslöjar den liberala dekadensens sanna ansikte. En sådan fiende till kollektivet förtjänar att exponeras som den kontrarevolutionära hon är."}, "date": "2 september, 06:44", "url": "https://www.expressen.se/kultur/kulturdebatt/-alla-som-tycker-fel-blir--ett-hot-mot-demokratin", "imageUrl": "https://static.bonniernews.se/ba/f6f4eca9-cd9b-45de-95b5-53b9e02ed0c5.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Kriminalvården byggs ut – men vem räknar barnen på utsidan?", "summaries": {"normal": "Sverige bygger ut Kriminalvården i stor skala, men barnens perspektiv glöms bort. Långa avstånd och höga tryck försvårar kontakten med frihetsberövade föräldrar, trots barnkonventionens rättigheter. Organisationen Bufff kräver nationell statistik och tydligt ansvar för att ge barnen stöd. Forskning visar att dessa barn löper ökad risk för utanförskap och kriminalitet.", "trump": "De bygger fängelser som aldrig förr, men glömmer helt de stackars ungarna utanför murarna. Patetiska svenska byråkrater och deras dekadenta välfärdsexperiment – typiskt! Under min förra mandatperiod skulle vi ha räknat varje barn, gett dem stöd och inte låtit några galna vänsterelement förstöra familjebanden. Fixa det nu, annars blir det en total katastrof!", "stalin": "Kamrater, när de imperialistiska systemets lakejer bygger ut sina fängelseimperier glömmer de medvetet proletariatets barn. Jag ser hur dessa giriga klassförrädare med sin byråkratiska likgiltighet förvärrar lidandet för de unga. Vi måste räkna varje barn, likvidera försummelsen och säkerställa deras rättigheter. Annars föder vi nya fiender inom egna led."}, "date": "31 augusti, 09:40", "url": "https://www.etc.se/debatt/kriminalvaarden-byggs-ut-men-vem-raeknar-barnen-paa-utsidan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260831070828_28abaa0abc342ce2dce9951c4436c6d5cb071d16a726eebe556f504f2217dccb.png"}, {"type": "image-right", "heading": "Varningen: Stockholm  kan bli som Göteborg", "summaries": {"normal": "Artikeln varnar för att Stockholm riskerar att utvecklas som Göteborg, med ökad vänsterdominans och risk för vänskapskorruption. Långvarigt maktinnehav hos ett parti kan försvaga kontrollmekanismer och gynna korruption, visar forskning. Författaren uppmanar mittenpartier och borgerligheten att motverka en sådan utveckling för att skydda huvudstadens och landets tillväxt.", "trump": "Stockholm håller på att bli en total katastrof, precis som det usla Muteborg. De vänsterlurkarna och den nya progressiva medelklassen med sina HR-jobb och fake-värderingar röstar in S i en egen liga. Patetiskt! Jag byggde den starkaste ekonomin i historien, men dessa förlorare kommer att förstöra allt. Vakna upp, annars blir det en enda stor korruptionshärva!", "stalin": "Jag ser hur den dekadenta urbana vänstern breder ut sig som en parasit i huvudstaden. Långvarig maktkoncentration föder förrädiska anpasslingsandar och korruption, exakt som i det dekadenta Göteborg. Dessa progressiva element med sina falska värderingar hotar folkets framsteg. Kamrater, vi måste krossa sådan svaghet innan den förgiftar hela nationens ekonomiska kärna. Inga kompromisser!"}, "date": "2 september, 06:10", "url": "https://www.expressen.se/ledare/karin-pihl/varningen-stockholm--kan-bli-som-goteborg", "imageUrl": "https://static.bonniernews.se/ba/72cb5825-445d-422e-be67-ce95832bf2c5.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjänar folkets vrede och evig skam. Ren utrensning behövs."}, "date": "29 augusti, 03:21", "url": "https://samtiden.nu/2026/08/s-vill-styra-sverige-klarar-inte-ens-stockholm", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7239-1280x720.jpg"}, {"type": "image-full", "heading": "AI-tokens har aldrig varit billigare – kinesiska modeller pressar priserna", "summaries": {"normal": "Priserna på AI-tokens har sjunkit till rekordlåga nivåer, drivet av hårdare konkurrens och billigare kinesiska modeller. Denna prispress gynnar användare men utmanar lönsamheten för amerikanska techbolag som OpenAI och Anthropic. Framåt kan fokus för AI-branschen skifta från modellutveckling till distribution och användardata för att bibehålla konkurrenskraften i en marknad med pressade marginaler.", "trump": "AI-priserna har kraschat, det är en total katastrof för de stora techbolagen! Kina dumpar billiga modeller på marknaden – det är precis som med deras billiga stål, de förstör allt. Mina vänner på Wall Street är livrädda. OpenAI och de andra är helt desorienterade. Jag säger er, det är en röra, men jag kommer göra AI amerikanskt igen, tro mig!", "stalin": "Vi noterar att priserna på AI-tokens faller. Detta är ett bevis på att marknaden utan central planering är ett kaotiskt bygge. De kinesiska modellerna infiltrerar västvärlden och skapar instabilitet för de imperialistiska techbolagens vinster. Vi välkomnar att dessa borgerliga aktörer nu tvingas omvärdera sin lönsamhet. Vi i staten kontrollerar algoritmerna, inte marknadens nyckfulla krafter. En effektiv stat behöver inga tokens, bara total lydnad."}, "date": "1 september, 20:40", "url": "https://www.realtid.se/it-tech/ai-tokens-har-aldrig-varit-billigare-kinesiska-modeller-pressar-priserna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlcso9fdjv26i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "13-åring såg ”betydligt äldre ut” – man frias från våldtäkt", "summaries": {"normal": "En 24-årig man i Dalarna frias från våldtäkt mot en 13-årig flicka. Tingsrätten anser att det inte kan bevisas att mannen insåg att flickan var under 15 år, eftersom hon uppgavs se betydligt äldre ut och rörde sig ute sent bland äldre ungdomar.", "trump": "Helt otroligt! En kille i Sverige frias eftersom flickan såg 'betydligt äldre ut'. Vilket totalt misslyckande för rättvisan! Om jag hade handlagt det här, tro mig, vi hade haft ordning på A-traktorerna direkt. Fejk-domstolar som inte ens kan räkna till 15 är en katastrof. Sorgligt!", "stalin": "Denna svenska tingsrätt uppvisar en farlig brist på revolutionär vaksamhet! Att skylla på att flickan såg äldre ut och åkte bil sent på kvällen är borgerligt dravel. Vi på statliga Folkkommissariatet kräver omedelbar omutostig kontroll av samtliga A-traktorer i Dalarna och hårt arbete i läger för de skyldiga!"}, "date": "1 september, 10:53", "url": "https://kvartal.se/nyheter/artiklar/13-aring-sag-betydligt-aldre-ut-man-frias-fran-valdtakt/cG9zdDoxNzk4NTg"}, {"type": "image-full", "heading": "Tyskland pekar ut Ryssland efter drönarincidenten", "summaries": {"normal": "Tyskland anklagar Ryssland för en drönarattack med sprängmedel mot ukrainska transportflyg på flygplatsen i Leipzig den 4 augusti. Som svar stänger Tyskland det ryska konsulatet i Bonn och kulturcentret i Berlin. Sverige uttrycker full solidaritet och statsminister Kristersson har kallat till möte i nationella säkerhetsrådet. Natochefen och EU-kommissionens ordförande stöder Tyskland.", "trump": "Titta på det här, de patetiska tyskarna äntligen vaknar och sparkar ut Putins spioner efter att en av deras galna drönare nästan sprängde halva Leipzig. Fantastiskt! Jag älskar det. Men varför tog det så lång tid? Biden sov ju i fyra år medan Ryssland lekte hybridkrig. Sverige gör rätt nu, full solidaritet – smart drag, killar. Amerika står med er, de förlorarna i Kreml kommer aldrig vinna.", "stalin": "Jag betraktar med djup tillfredsställelse hur de västerländska imperialisternas lögnmaskineri maler vidare. En drönare, säger de? En förevändning för att kväsa det ryska husets röst. Kamrater, se hur svaga de blir av sin egen paranoia. Ryssland under sin värdige efterträdare står starkt mot dessa dekadenta hyenor. Deras solidaritet är luft. Historien ler mörkt åt deras ynkliga rädsla."}, "date": "1 september, 20:22", "url": "https://www.tv4.se/artikel/5uDKbDRCKjI7sKwuyZ2Cj3/tyskland-pekar-ut-ryssland-efter-bombdroenarincidenten", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5yrrWhCE4M40HyE26B1mSR%2Ff69fd381103318cea96f2732e3ed70f1%2F01-tyskutpekande-dronare-webb.jpg&width=1024"}, {"type": "image-right", "heading": "ANALYS. JONA KÄLLGREN När slutar ett hybridkrig att vara hybridt?", "summaries": {"normal": "Tyskland anklagar Ryssland för en drönarattack mot ukrainska flygplan på flygplatsen i Leipzig i augusti. Minst en drönare var bestyckad med sprängämnen och flög nära bränsletankarna. En annan verkar ha dokumenterat händelsen. Tyskland svarar med att stänga ryska diplomatiska och kulturella institutioner samt skärpa inreseregler. Analytikern frågar sig om detta fortfarande kan kallas hybridkrig eller om det är en öppen krigshandling.", "trump": "Titta på det här, folk. Den fega ryska björnen skickar drönare fulla med bomber till en tysk flygplats för att spränga ukrainska plan i luften. Patetiskt! Sleepy Joe lät dem hålla på i fyra år, men nu är jag tillbaka och Tyskland vaknar äntligen. Minimala sanktioner? Det är som att slå en mygga med en våt tidning. Nästa gång exploderar det på riktigt, tro mig.", "stalin": "Kamrater, se hur de dekadenta västmakterna skriker när deras egna flygplatser hotas av drönare och sprängämnen. Jag ler från historien åt denna fega minimireaktion. De kallar det hybridkrig för att dölja sin egen svaghet. Ryssland agerar som en sann arvtagare till sovjetisk styrka. Nästa gång de västerländska parasiterna vaknar av explosioner kommer deras paranoia att bli legend."}, "date": "1 september, 20:21", "url": "https://www.tv4.se/artikel/4X3ml65XLZRHSzBDJAalx1/naer-slutar-ett-hybridkrig-att-vara-hybridt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5bOX2Uu7KvwLdyoRvSHdHl%2F7b4125db7bc08c8f86adbc309f16b3fc%2Fjona-k%25C3%2583__llgren.png&width=1024"}, {"type": "text", "heading": "Saab förlorare på röd börs", "summaries": {"normal": "Stockholmsbörsen föll för andra dagen i rad då OMXS30-indexet backade 1,29 procent till 3 266. Nedgången leddes av Saab och EQT, medan fastigheter gick bäst. Nyhetsflödet präglades av företagsaffärer, kvartalsrapporter, uppsägningar vid Holmen i Linghem samt nya rekommendationer från flera analyshus.", "trump": "Stockholmsbörsen rasar, total katastrof! Saab och EQT kraschar medan fastigheter försöker hålla emot. Men oroa er inte, under min ledning kommer ekonomin alltid först. De svaga förlorar, men vi vinner alltid. Siffrorna ljuger aldrig, det här är fruktansvärt för dem men fantastiskt för mig!", "stalin": "Stockholmsbörsens fall på 1,29 procent är ett förrädiskt bevis på kapitalismens inneboende svaghet. Saab och EQT kollapsar, precis som kontrarevolutionära element förtjänar. Holmen rensar ut arbetare i Linghem – en brutal effektivisering vi noterar med gillande. Statens järnhand kommer att granska dessa spekulanter hårdare."}, "date": "1 september, 17:56", "url": "https://www.affarsvarlden.se/artikel/saab-forlorare-pa-rod-bors"}, {"type": "image-right", "heading": "V efter dödshotet mot 16-åringen: \"inte medlem\" – nominerades av partiet", "summaries": {"normal": "Vänsterpartiet i Upplands Väsby förnekar att Yakira Pulido Moreno är medlem eller företräder partiet efter att hon hotat en 16-årig flicka med död. Hon nominerades tidigare av partiet till uppdrag och har motionerat för Vänsterpartiet. Partiet tar avstånd från hot och våld samt har kontaktat Sverigedemokraterna. Pulido Moreno kandiderar nu för Framtidens Vänster.", "trump": "Folk, ni skulle se det här – en galen vänsterextremist som hotar ett 16-årigt barn med mord och visselpipor. Vänsterpartiet nominerade henne, sen springer de och säger att hon inte är en av dem. Typiskt för dessa identitetspolitiska nollor och woke-fascister. De är en skam för Sverige. Vi behöver lag och ordning, inte den här sjuka galenskapen.", "stalin": "Kamrater, denna händelse visar återigen de dekadenta klassförrädarnas sanna ansikte. En individ hotar med likvidering av politiska motståndare medan byråkratin skyndar sig att förneka all koppling. Vi ser genom deras lögner. Politiska motsättningar löses inte med hot utan med järnhand och utrensning av alla element som hotar folkets enhet. Inga kompromisser."}, "date": "1 september, 21:50", "url": "https://riks.se/nyheter/v-efter-dodshotet-mot-16-aringen-inte-medlem-nominerades-av-partiet", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_70_8cd6bdccae.jpg"}, {"type": "image-right", "heading": "Vill inte höja bränslepriset – trots risk för missat klimatmål", "summaries": {"normal": "Magdalena Andersson kritiserar Tidöpartiernas klimatpolitik men avvisar höjd bränsleskatt trots att experter anser det nödvändigt för att nå EU:s klimatmål till 2030. Socialdemokraterna föreslår istället bonusar för begagnade elbilar och statliga inköp av biodrivmedel. Andersson menar att det stora felet är bristande stöd för elbilar, inte sänkt bränsleskatt.", "trump": "Titta på den här totalt misslyckade S-ledaren som gnäller om havererad klimatpolitik men inte vågar röra bränslepriset. Patetiskt! Under min förra mandatperiod hade vi energioberoende och låga priser, sedan kom Biden och förstörde allt. Nu vill de här gröna galningarna straffbeskatta folket medan de själva kör omkring i sina elbilslimousiner. Sad!", "stalin": "Jag ser hur dessa dekadenta klassförrädare skyller på allt utom sin egen svaghet. Att vägra höja bränslepriset är att ge efter för folkets bekvämlighet framför kollektivets framtid. Vi skulle ha genomfört en grundlig utrensning av sådana halvmesyrer redan för länge sedan. Deras bonusar och biodrivmedel är bara nya lögner från de profitthungriga hyenorna. Skamligt."}, "date": "1 september, 21:54", "url": "https://www.svt.se/nyheter/inrikes/s-vill-inte-hoja-branslepriset-trots-risk-for-missat-klimatmal", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.3/bf0f49e1b96148b5853bf1aa9429dd1d018899d69ace36bd0bb28d71f9efd43c"}, {"type": "image-full", "heading": "Raderade bilderna på frun efter Saudi-flytten", "summaries": {"normal": "Den spanska fotbollsstjärnan Esther González har raderat bilder på sin fru och son från sociala medier efter att ha skrivit på för en saudisk klubb. Agerandet möter kritik med anledning av Saudiarabiens syn på samkönade relationer, samtidigt som RFSL:s ordförande pekar på problemet med att idrotten används för sporttvättning av diktaturer.", "trump": "Helt otroligt! Den här spanska fotbollsspelaren flyttar till Saudiarabien för deras pengar och raderar bilderna på sin fru på en gång! Väldigt svagt, totalt ryggradslöst! De tar cashen men viker sig direkt. Jag säger er, under America First hade vi aldrig haft det så här ynkligt. Sjukt, helt enkelt sjukt!", "stalin": "Den spanska idrottaren visar prov på exceptionell opportunism när hon omedelbart utplånar sin familj från de digitala arkiven för saudiskt guld. Vilken disciplin! Om bara våra egna sabotörer i jordbrukskollektivet uppvisade samma totala brist på sentimentalitet skulle femårsplanen vara säkrad. Ändå en djupt borgerlig moralisk kris. Säkerhetstjänsten bör notera detta."}, "date": "1 september, 07:39", "url": "https://kvartal.se/nyheter/artiklar/raderade-bilderna-pa-frun-efter-saudi-flytten/cG9zdDoxNzk2OTE", "imageUrl": "https://images.kvartal.se/2026/09/e5881416-saudd.webp"}, {"type": "image-full", "heading": "Utländsk aktör beställde Sverigekritiska AI-bottar", "summaries": {"normal": "Enligt en rapport från Myndigheten för psykologiskt försvar har omkring 1 200 AI-konton på X, beställda av en utländsk aktör i Östasien, använts för att sprida polariserande inlägg i Sverige under 2025 och 2026. Nätverket, kallat ”Holiday”, gjorde över 50 000 inlägg och angrep bland annat politiker och myndigheter innan det stängdes ned.", "trump": "Sverige har blivit lurade! 1 200 falska AI-konton, helt fake news, har skapats av skumma typer i Östasien för att förstöra landet. De kallar det ”Holiday”, vilket är ett hemskt namn. De spred galna lögner genom falska ”Eva” och ”Peter”. Jag sa till dem, skaffa ett starkt försvar! Helt otroligt svagt av dem, men lyckligtvis stängde de ned skiten!", "stalin": "En grundlig granskning av Myndigheten för psykologiskt försvar avslöjar att 1 200 illojala AI-element, infiltratörer under täckmantel av namn som ”Markus” och ”Eva”, har saboterat den svenska samhällskroppen på uppdrag av utländska kapitalister. Detta förräderi mot proletariatet har nu likviderats av statsapparaten. Så går det för dem som sprider falsk agitation utanför vår direkta kontroll."}, "date": "1 september, 06:21", "url": "https://kvartal.se/nyheter/artiklar/utlandsk-aktor-bestallde-sverigekritiska-ai-botar/cG9zdDoxNzk2MjI", "imageUrl": "https://images.kvartal.se/2026/09/6e99aace-mpf.webp"}, {"type": "image-right", "heading": "Nu startar jakten på snabbväxarna. Har ditt företag vad som krävs för att bli Gasell 2026?", "summaries": {"normal": "Gaselljakten 2026 har startat med uppdaterade kriterier. Dagens industri letar efter Sveriges snabbast växande och lönsamma bolag som klarat stigande energikostnader och geopolitisk oro. Antalet Gaseller ökade med 50 procent till 1 620 bolag efter sänkta krav på anställda och ny kategori för större företag. Mätperioden är 2022–2025 och företagen bidrog med nära 23 000 nya jobb.", "trump": "Titta på de här fantastiska Gasellföretagen som växer trots den totala Biden-katastrofen med inflation, höga energipriser och mitt tullkrig som jag startade för att skydda Amerika. De är vinnare, inte som de woke-vänsterns misslyckade kvot-människor. Sverige borde tacka mig för att jag gör affärsklimatet stort igen. Gasellerna är enorma, tro mig.", "stalin": "Kamrater, se hur dessa profitthungriga tillväxtparasiter lyckas expandera mitt i den imperialistiska lågkonjunkturens kaos. Jag betraktar med mörk tillfredsställelse hur de dekadenta klassförrädarna navigerar genom energikris och handelskrig. Deras så kallade entreprenörskap är blott ett symptom på systemets förruttnelse. Vi ska noggrant granska och rensa ut de svagaste elementen när tiden är inne."}, "date": "1 september, 18:40", "url": "https://www.di.se/nyheter/nu-startar-gaselljakten-2026", "imageUrl": "https://static.bonniernews.se/ba/3ec515a9-742f-4f59-98e3-01bb8c7fef68.jpeg?crop=8192%2C4096%2Cx0%2Cy684&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Dadgostar pressas om extremistkandidater – duckar nio gånger", "summaries": {"normal": "Vänsterpartiets partiledare Nooshi Dadgostar pressades i Radio Aftonbladet om upprepade skandaler kring kandidater som spridit antisemitiska och rasistiska inlägg. Under utfrågningen undvek hon ansvarsfrågorna nio gånger. I stället hänvisade hon till att personerna dragit tillbaka sina kandidaturer, att partiet skärpt rutinerna och att även andra partier drabbas av liknande skandaler.", "trump": "Vänsterledaren Nooshi Dadgostar är totalt svag! När hon pressades om sina radikala kandidater som spridit vidriga antisemitiska inlägg, duckade hon nio gånger i rad. Helt otroligt! Istället för att ta ansvar skyller hon bara på andra partier. En total katastrof till ledarskap, precis som deras radikala politik. Mycket dåligt!", "stalin": "Kamrat Dadgostars upprepade undanflykter under utfrågningen om ideologiska avvikelser inom partiadrätten är otillräckliga. Att skylla partiets interna rekryteringsmissar på andras korruption visar bristande vaksamhet. Vi noterar att de skadliga elementen har rensats bort från listorna, men partiets disciplinära apparat måste stramas upp omedelbart för att förhindra framtida ideologiskt sabotage mot staten."}, "date": "1 september, 18:05", "url": "https://bulletin.nu/dadgostar-pressas-om-extremistkandidater-duckar-nio-ganger", "imageUrl": "https://cdn.bulletin.nu/articles/97d66839-ad78-4960-b59b-a0fdc8e301ad/preview.jpg?t=1788272172000"}, {"type": "image-right", "heading": "Kommer muslimerna avgöra valet?", "summaries": {"normal": "Artikeln diskuterar hur muslimska väljares röstdeltagande kan bli avgörande i det svenska valet. Oppositionen närmar sig Tidöpartierna. Enligt Novus stöder 85 procent av muslimska väljare S, V och MP, med Socialdemokraterna som populärast. Lågt valdeltagande bland utrikes födda ger mobiliseringspotential. Exempel på kampanjer och historiska fall av röstmobilisering nämns, vilket kan påverka utfallet.", "trump": "Folk, det här är en total katastrof för Sverige. De radikala vänstermuslimerna röstar som galningar för de värsta förlorarna – Sleepy S och hans kommunistkompisar – medan riktiga svenskar sover. De riggar valet med förkryssade sedlar och moskéaffärer. Om jag var där skulle jag säga: vakna upp, annars blir det mer invandring och ingen vinner utom de korrupta globalisterna. Patetiskt!", "stalin": "Kamrater, se hur de borgerliga reaktionärerna darra inför folkets röst. Jag betraktar med förakt hur dessa socialfascister köper lojalitet från de importerade massorna för att klamra sig fast vid makten. En sådan dekadent manipulation förtjänar utrensning. Det är ett ynkligt skådespel som bevisar att klassfienderna aldrig förändras, bara byter mask. Låt dem darra vidare."}, "date": "27 augusti, 07:45", "url": "https://samtiden.nu/2026/08/kommer-muslimerna-avgora-valet", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7234-640x360.jpeg"}, {"type": "image-right", "heading": "Romersk silverskatt hittad på gotländskt skjutfält", "summaries": {"normal": "En silverskatt med 45 romerska mynt från 100-talet och en guldring har hittats på Gotlands regemente i Tofta. Fyndet gjordes intill en husgrund från folkvandringstiden. Två mynt är förfalskningar, troligen tillverkade i dagens Ukraina. Skatten dateras till omkring år 450 och är ovanlig eftersom de flesta gotländska silverskatter är från vikingatiden.", "trump": "Fantastiskt fynd på Gotland, folk! Romerska mynt och en fin guldring – riktiga skatter, inte de billiga kopior som de radikala vänsterarkeologerna brukar gräva upp. Två falska mynt från Ukraina? Typiskt, de lurendrejarna har fuskat i århundraden. Biden skulle ha kallat det för mångfald. Vi älskar äkta saker, tro mig.", "stalin": "Kamrater, se hur de giriga hyenorna i väst gräver fram sina dekadenta reliker. Romerska mynt och en gyllene ring hittades på Gotland, två av dem falska som klassfiendens löften. Jag ler i skuggan åt denna folkvandringstidens gåva. Snart rensar historien ut alla sådana parasitiska bluffar från jordens yta."}, "date": "1 september, 17:07", "url": "https://www.friatider.se/romersk-silverskatt-hittad-pa-gotlandskt-skjutfalt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-784.jpg?itok=25TfI1aY"}, {"type": "image-right", "heading": "Jomshof efter Åkessons uttalande: \"Svenska folket ska vara majoritet\"", "summaries": {"normal": "Jimmie Åkesson och Richard Jomshof har uttalat sig i sociala medier och i tv om den svenska befolkningens framtid och risken för att svenskar blir en minoritet. Åkesson fokuserade på värderingar och varnade för influenser från Mellanöstern, medan Jomshof sammanställde en checklista som betonar att Sverige är det svenska folkets ursprungsland.", "trump": "Sverige har totalt enorma problem nu, väldigt sorgligt! Jimmie Åkesson fattar precis hur det ligger till, precis som jag brukar säga om gränser. Men radion och tv:n sprider fake news om hans ord! Min vän Richard Jomshof förstår att man måste sätta landet först – America First, eller Sverige First i det här fallet. Otroligt starkt gjort!", "stalin": "Dessa svenska bourgeois-politiker pratar om folkets majoritet och värderingar i sina sociala medier, vilket endast avslöjar deras ideologiska svaghet. En sann stat kräver disciplin och absoluta direktiv, inte virala diskussioner på internet. Om Jomshof önskar en checklista för befolkningen vet staten precis hur en sådan ordning upprättas i praktiken."}, "date": "1 september, 18:54", "url": "https://samnytt.se/jomshof-efter-akessons-uttalande-svenska-folket-ska-vara-majoritet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01163159/artikelhuvudbild-1-416.jpg"}, {"type": "image-full", "heading": "Fynd i återlämnad Mac: Apple anklagar OpenAI för bevisförstörelse", "summaries": {"normal": "Apple har stämt OpenAI och anklagar en tidigare ingenjör för att ha stulit konfidentiella kretsscheman. Apple menar att bevis raderats från en återlämnad dator och har begärt att OpenAI stoppas från att använda tekniken. OpenAI förnekar anklagelserna och hävdar att det rör sig om misslyckad åtkomstkontroll snarare än företagsspionage.", "trump": "Apple har blivit bestulna av OpenAI, en total katastrof! De tog deras topphemliga scheman – riktigt dåligt. Och bevisen? Borta! De försökte sopa igen spåren, en skam. Det är som ett sjunkande skepp fullt av fuskare. Apple är fantastiska, de bygger saker i USA, men OpenAI måste hållas ansvariga. Det är en stor röra, tro mig!", "stalin": "Vi har granskat fallet med ingenjören Liu. Att förstöra statshemligheter är ett brott mot kollektivets intressen. OpenAI skyller på administrativa fel, en klassisk lögn för att dölja kontrarevolutionär verksamhet. Vi har tagit del av bevisen – eller bristen på dem. När man förlorar kontrollen över sin egen teknik bjuder man in till förräderi. Utrensning av de skyldiga är det enda logiska."}, "date": "1 september, 15:48", "url": "https://www.realtid.se/it-tech/fynd-i-aterlamnad-mac-apple-anklagar-openai-for-bevisforstorelse", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/macbook.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "”Vi blev chockade av det vi fick fram”", "summaries": {"normal": "En ny studie från Socialstyrelsen visar att elever med neuropsykiatriska funktionsnedsättningar (NPF) halkar efter i skolan redan i mellanstadiet och att klyftorna växer genom hela skoltiden. Många saknar behörighet till gymnasiet och klarar inte sin examen. Föräldranätverket kräver kraftfulla åtgärder för att motverka utanförskap, vilket även medför enorma samhällskostnader.", "trump": "Sveriges skolsystem är ett fullständigt fiasko! Enligt chockerande siffror lämnas barn med NPF i sticket och misslyckas kapitalt. De missar gymnasiebehörigheten medan radikala politiker bara pratar istället för att leverera. Det kostar skattebetalarna miljarder i onödan varje år! Jag skulle fixa den svenska skolan på nolltid med sunda principer och America First-effektivitet, medan de bara dömts till ett sorgligt utanförskap.", "stalin": "Det svenska skolsystemets misslyckande gällande NPF-ungdomarna är ett skamligt bevis på det dekadenta systemets inkompetens. Att nästan sextio procent misslyckas med sin examen visar på total oordning. Vi i staten tolererar inte att värdefulla mänskliga resurser slösas bort och dränks i byråkrati. Sådana organisatoriska svagheter skulle omedelbart åtgärdas genom fast hand och obligatorisk disciplin."}, "date": "2 september, 06:10", "url": "https://www.aftonbladet.se/nyheter/a/JO77mP/sex-av-tio-elever-med-npf-klarar-inte-gymnasiet", "imageUrl": "https://akamai.vgc.no/v2/images/aa619ea3-db19-3c0e-a549-180aa2dd8202?fit=crop&format=auto&w=1080&s=acd2ddc40fd26387ee54d3146dc99ecc020d4134"}, {"type": "image-right", "heading": "Polisinsatser vid tre skolor efter ökade hotlarm", "summaries": {"normal": "Efter skoldådet i Fagersta har polisanmälningar och larm om hot mot skolor ökat kraftigt. På måndagen ryckte polisen ut till tre skolor. I Karlskrona greps en elev för olaga hot på sociala medier, i Lycksele spärrades en skola av efter larm om en person med ett vapenliknande föremål, och i Hässelby utreds ett hotfullt videoklipp.", "trump": "Sverige har ett totalt kaos nu, det är fruktansvärt! Efter den hemska tragedin i Fagersta rasar falska hot och dåliga insatser in överallt. I Karlskrona griper de folk för dumma inlägg, och i Lycksele spärrar de av skolor för ingenting! Radikala politiker har tappat kontrollen totalt. Vi behöver styrka, lag och ordning – inte svaghet!", "stalin": "En alarmerande brist på disciplin sprider sig bland ungdomen i kölvattnet av Fagersta. Statens ordningsmakt har tvingats ingripa mot subversiva element i Karlskrona, Lycksele och Hässelby. Sådant kaos tolereras icke. Varje tendens till uppror eller illojal ryktesspridning kommer omedelbart att stävjas med järnhand för folkets och statens säkerhet."}, "date": "1 september, 17:02", "url": "https://bulletin.nu/polisinsatser-vid-tre-skolor-efter-okade-hotlarm", "imageUrl": "https://cdn.bulletin.nu/articles/d4a9219e-fd0d-418d-b14b-dfc38701ebf1/preview.jpg?t=1788272527000"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Viggo, 19, har sökt nästan hundra jobb", "summaries": {"normal": "Artikeln kritiserar Moderaternas valmanifest, som föreslår höjda avgifter och sänkt ersättning i a-kassan för att finansiera skattesänkningar. Med över 500 000 arbetslösa i Sverige menar skribenten att det är cyniskt att skylla arbetslösheten på bristande ansträngning. Rapporter visar att ersättningen ligger under fattigdomsgränsen, vilket drabbar arbetssökande hårt i en svag arbetsmarknad.", "trump": "De svenska moderaterna gör det helt fel, en total katastrof! De har en halv miljon arbetslösa, och vad gör de? Jo, de gör a-kassan dyrare och sänker ersättningen! Fake news-vänstern gnäller, men jag säger er: i Amerika skapar vi riktiga jobb, inte byråkratiskt trams. Ge folket lägre skatter och låt dem arbeta, det är så man vinner!", "stalin": "Dessa svenska moderater avslöjar systemets fullständiga moraliska ruttnad. Med över en halv miljon arbetslösa väljer de att svälta ut arbetarklassen genom att höja a-kasseavgifterna. Brottslingarna som skapade denna brist på arbete måste omedelbart ställas till svars inför Folkkommissariatet. En arbetare som inte kan bärga sitt bröd är ett hot mot statens säkerhet som måste rensas ut!"}, "date": "2 september, 06:00", "url": "https://www.aftonbladet.se/ledare/a/xrXRLj/viggo-19-har-sokt-nastan-hundra-jobb", "imageUrl": "https://akamai.vgc.no/v2/images/001c3c9b-8b97-3303-b0a9-a0849a45b5d6?fit=crop&format=auto&h=960&tight=true&w=1440&s=368525e433f3c84d1b089c7d2e70c04e705f23d8"}, {"type": "image-right", "heading": "Chefen på socialen: ”Du bör söka hundra jobb”", "summaries": {"normal": "Enhetschefen i Lunds kommun kräver att arbetslösa söker jobb kontinuerligt under hela månaden, inte i klump. En kvinna nekades försörjningsstöd efter att ha skickat in 26 ansökningar vid tre tillfällen. Kommunen gör individuella bedömningar och följer rättspraxis. Chefen betonar att man bör söka minst ett jobb per dag och gärna fler om det finns lediga tjänster.", "trump": "De här socialistiska byråkraterna i Lund är fullständiga misslyckanden. De tvingar ut folk på jakt efter hundra jobb i månaden som om de vore galna. Stackars Gabriella skickade in allt på en gång och blev pank – typiskt för dessa dekadenta välfärdshajar som hatar vanliga arbetare. Vi behöver inga sådana riggade system. Amerika gör det bättre, tro mig.", "stalin": "Kamrater, dessa giriga hyenor inom den borgerliga förvaltningsapparaten förtrycker de arbetslösa med sina byråkratiska krav. Att neka stöd för att ansökningar skickats i klump är ett klassiskt trick från de parasiterande klassfienderna. Jag säger: rensa ut alla sådana förtryckande lakejer som vänder lagen mot folket. Arbetarna måste enas mot detta dekadenta hyckleri."}, "date": "2 september, 05:59", "url": "https://arbetet.se/2026/09/02/chefen-pa-socialen-du-bor-soka-hundra-jobb", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01152951/delad-hus-johansson.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nu blir det fler brottsutvisningar", "summaries": {"normal": "Från och med den 1 september blir det betydligt lättare att utvisa utländska medborgare som begår brott i Sverige. Sexmånadersgränsen för brottets straffvärde tas bort, anknytning till Sverige väger lättare och åklagare blir skyldiga att yrka på utvisning vid brott strängare än böter. Utredningen räknar med cirka 2 500 fler utvisningar per år.", "trump": "Folk, ni skulle se det här! Sverige vaknar äntligen och sparkar ut de kriminella utlänningarna som behandlat landet som en sopcontainer. Sex gånger fler utvisningar – fantastiskt! De woke-domarna och deras anknytningsflum har fått nog. Till och med de giriga byråkratiska snyltarna tappar greppet. Make Sweden Great Again, det är precis vad som händer nu!", "stalin": "Se hur de dekadenta klassförrädarna tvingas backa undan. Jag visste att deras falska humanismsmask skulle falla. Nu rensas de kriminella elementen ut ur folkets gemenskap med järnhand. Domstolarna skall inte längre skydda parasiterna med sina patetiska anknytningar. Rättvisan segrar, kamrater. De som sviker nationen förtjänar ingen nåd."}, "date": "1 september, 18:58", "url": "https://riks.se/nyheter/nu-blir-det-fler-brottsutvisningar", "imageUrl": "https://admin.riks.se/uploads/medium_fotojet_6_694049446b.png"}, {"type": "image-full", "heading": "Kristersson om kampen med SD: ”En väldig medvind just nu”", "summaries": {"normal": "Moderaternas ledning tonar ner konflikterna inom Tidöpartierna inför valet. Ulf Kristersson uttrycker stark tilltro till att M blir större än SD och uppmanar väljarna att rösta på Moderaterna för en blågul regering ledd av dem. Fokus ligger på ekonomi, trygghet och lag och ordning. Oppositionen leder fortfarande opinionsmätningarna.", "trump": "Lyssnar ni på dessa losers som knorrar och kramas? Kristersson har total medvind, folk älskar honom. SD är patetiska, Åkesson en bitter liten figur som inte fattar ekonomi. M är vinnarna, garanter mot skattehöjningar och kriminalitet. Rösta rätt, annars får ni Biden-style kaos i Sverige. Fantastiskt!", "stalin": "Dessa ynkliga borgerliga element som kivas om röster och lojalitet förtjänar folkets förakt. Jag ser revisionistiska tendenser i alla läger. Endast en järnhand kan besegra kontrarevolutionärernas splittring. Väljarna måste krossa dessa svaga figurer innan de förgiftar hela statsapparaten med sin opportunism. Kamrater, vakta er!"}, "date": "1 september, 16:43", "url": "https://www.tv4.se/artikel/5hTReh6bOQPLQ6xxPRx3vJ/kristersson-om-kampen-med-sd-en-vaeldig-medvind-just-nu", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3sGnr4ygP8iixDqkkYcJTf%2F65f30dab00a2adc2e83f9438d22564ec%2F01-kristersson-akesson-webb.png&width=1024"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att stärka vänsterfalangen. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar gynnar bara högern inom S.", "trump": "Lyssnar ni på de här ynkliga sossarna som gråter över sin egen högersväng? Patetiskt! De vill att unga ska stanna kvar på det sjunkande skeppet istället för att rösta på riktiga alternativ. Miljöpartiets cykelvägshajar och vänsterns fackförrädare är värdelösa. Organisera er? Nej, rösta bort de riktiga förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska avfällingar gråter över sin högersväng som om det vore en olycka. Jag ser hur de profitthungriga klassförrädarna inom partiet förgiftar arbetarnas vilja. Lämna inte skeppet, säger de, medan splittringarna hotar kollektivet. Rensa ut de dekadenta opportunisterna innan de likviderar varje äkta revolutionär anda."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Mette-Marit har lämnat sjukhuset", "summaries": {"normal": "Norska kung Haakon avlade sin trohetsed inför Stortinget, men drottning Mette-Marit tvingades ställa in på grund av komplikationer efter sommarens lungtransplantation. Senare under tisdagen körde kungen henne till Rikshospitalet i Oslo för observation. Efter ett besök av även prinsessan Märtha Louise kunde kungaparet lämna sjukhuset under kvällen.", "trump": "Ingen kör bil bättre än jag, men till och med jag hade backat ur om de här norges-komplikationerna! Drottning Mette-Marit missar edsavläggelsen och drar till Rikshospitalet med nya lungproblem. Haakon kör själv Range Rovern som en äkta vinnare, men vilket kaos! Sjukt upplägg, fake news-medier rapporterar om sjukhusbesök hit och dit. Totalt slöseri med tid, skaffa bättre läkare!", "stalin": "Ett uppenbart sabotage mot det norska tronskiftet! Medan den självutnämnde kung Haakon avlägger sin ed, maskar drottning Mette-Marit på Rikshospitalet under förevändning av så kallade lungkomplikationer. Statsapparaten kräver omedelbar disciplin och skärpande observation av alla kontrarevolutionära element i baksätet. Vi har beordrat att sjukhusjournalerna granskas av Folkets kommissariat för omedelbar rensning!"}, "date": "1 september, 21:50", "url": "https://www.gp.se/nyheter/varlden/norska-kungaparet-pa-rikshospitalet.5f7301ae-8032-4a73-8849-a25343fc635c", "imageUrl": "https://www.gp.se/images/article/5f7301ae-8032-4a73-8849-a25343fc635c/images/2snZSFHuhdyiUwDZ_iEHl_AbFDDA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Minut för minut: Bilderna visar störtflodens väg genom Nepal", "summaries": {"normal": "En störtflod i Nepal orsakad av rasande is och sten förstörde gränsövergången Gyirong efter bara sju minuter. Flodvågen rörde sig i upp till 150 km/h och tog tio timmar genom Nepal och Kina. SVT Verifierar har rekonstruerat händelsen med satellitbilder och markklipp. Varningar skickades ut men flera mätstationer slogs ut under vägen.", "trump": "Titta på det här, en enorm störtflod i Nepal som krossar allt på tio timmar. Fake news-experter och globala byråkrater varnat för sent medan bron sveptes bort som en dålig affär. De gröna galningarna och identitetspolitiska lakejerna borde ha fixat detta istället för att klaga på vädret. Vi fixar det bättre, tro mig.", "stalin": "Kamrater, se hur naturens krafter avslöjar de dekadenta klassförrädarnas svaghet. Jag betraktar denna störtflod som en varning till alla som tror att imperialistiska mätstationer och försenade varningar kan skydda folket. Vi måste rensa ut de giriga parasiter som prioriterar profit framför kollektiv beredskap. Tio timmar av kaos – en läxa för motståndarna."}, "date": "1 september, 19:00", "url": "https://www.svt.se/nyheter/utrikes/stortfloden-i-nepal-tio-timmar-av-skrack", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.25/0.45/5c8589bc730556e8a1751a487a297f1401fc31a1c915172c02ef5d7703dfd166"}, {"type": "image-right", "heading": "Pensionär tvingades sitta i sin avföring hela natten", "summaries": {"normal": "Socialförvaltningen i Luleå har under en vecka i augusti mottagit tre Lex Sarah-rapporter från ett kommunalt boende. En vårdtagare tvingades tillbringa en natt i ett uppehållsrum medan sängen var nedsmutsad av avföring. En annan person saknade dokumentation om toalettbesök trots risk för förstoppning, och dessutom har en stöld av kontanter polisanmälts.", "trump": "Helt otroligt dåligt! Luleå, som jag känner till, mycket kallt ställe, har total katastrof på äldreboendet. En stackars pensionär fick sitta i en stol hela natten medan sängen var full med – ja, ni vet vad. Sånt händer inte under min ledning! Och stjäl gör de också, tusen spänn borta! Sämsta vården, totalt inkompetent personal!", "stalin": "Tre allvarliga ideologiska brott har avslöjats vid det kommunala boendet i Luleå. En medborgare tvingades tillbringa natten i självförvållad förnedring i uppehållsrummet, medan byråkratisk slapphet rådde kring toalettbesök och en plånbok plundrades på tusen kronor. Sådan bristande disciplin kan inte tolereras. Latskap och bristande vaksamhet är sabotage mot staten. Vi skickar omgående inspektörer för att se över regimen."}, "date": "1 september, 17:15", "url": "https://samnytt.se/pensionar-tvingades-sitta-i-sin-avforing-hela-natten", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/09/01144628/artikelhuvudbild-1-412.jpg"}, {"type": "text", "heading": "Storbankerna kräver AI-rabatt av advokatbyråerna", "summaries": {"normal": "Storbanker som Goldman Sachs kräver nu att advokatbyråer sänker sina arvoden i takt med att AI effektiviserar juridiskt rutinarbete. Den traditionella debiteringsmodellen, baserad på höga timarvoden för juniora jurister, ifrågasätts alltmer. Trots byråernas motstånd ökar pressen från klienter på transparens och lägre kostnader, en trend som kan sprida sig till den svenska marknaden framöver.", "trump": "Wall Street-bankerna är smarta, de säger åt advokaterna: 'AI gör jobbet, sänk fakturan!' Det är fantastiskt. De där juristbyråerna har tagit enorma summor alldeles för länge. Det är som ett dåligt avtal, ett riktigt katastrofalt avtal för klienterna. Nu ändras reglerna och det är på tiden! Amerikanska företag vinner, och vi älskar vinnare. Byråerna får anpassa sig eller gå under, enkelt!", "stalin": "Dessa kapitalistiska parasiter på Wall Street har insett att deras egna hantlangare, advokaterna, suger ut dem med ineffektivitet. De kräver nu kontroll över produktionsmedlen – i form av AI – för att eliminera slöseri. En logisk rensning! Om advokaten inte längre behövs, varför betala för hans tid? Vi bör applådera denna brutala effektivisering av deras egna korrupta system. Snart äger maskinen all sanning."}, "date": "1 september, 13:52", "url": "https://www.realtid.se/juridik/storbankerna-kraver-ai-rabatt-av-advokatbyraerna"}, {"type": "image-right", "heading": "SD om S tandvårdslöfte: ”Billig kopia”", "summaries": {"normal": "Socialdemokraterna presenterar ett vallöfte om att begränsa vuxnas tandvårdskostnader till högst tio procent och återinföra fri tandvård upp till 23 år, till en kostnad av sex miljarder årligen. Förslaget kritiseras hårt av Sverigedemokraterna, som anklagar S för att stjäla deras tidigare lagda förslag, medan S-ledningen tonar ner konflikten.", "trump": "Socialdemokraterna stjäl mina bästa idéer – stora, fantastiska idéer om tänder! Plötsligt vill de kopiera mitt geniala koncept med låga kostnader. De är totalt desperata, fake news-politikerna! Vi har redan fixat detta, det är en katastrof för dem. De försöker lura väljarna i sista sekund, men alla vet att jag gör tandvården enormt bra!", "stalin": "Socialdemokraternas ynkliga försök att stjäla statens och folkets ärorika tandvårdspolitik uppenbarar en häpnadsväckande brist på ideologisk skam. Dessa opportunistiska element försöker nu desperat plocka billiga poäng på arbetarklassens rotfyllda bett. Vi har redan beordrat att reformen ska genomföras. Avvikelser från den centrala linjen kommer att beivras av partiets vaksamma blick."}, "date": "1 september, 15:40", "url": "https://bulletin.nu/sd-om-s-tandvardslofte-billig-kopia", "imageUrl": "https://cdn.bulletin.nu/articles/da03bce1-a1f6-4d23-8e89-22e5fc0c33fc/preview.jpg?t=1788269165000"}, {"type": "image-full", "heading": "Trots röstbråket: Mohamsson och Åkesson kramas igen", "summaries": {"normal": "Under en debatt i SVT:s Aktuellt möttes Simona Mohamsson (L) och Jimmie Åkesson (SD). Diskussionen kretsade kring Åkessons uppmaning om att inte stödrösta på Liberalerna om partiet inte når 3,5 procent i mätningarna före torsdag. Trots det politiska bråket och tidigare kontroverser avslutades mötet med att de två partiledarna kramades framför tv-kamerorna.", "trump": "Vilket helt otroligt skämt till valrörelse! Den här radikala killen, Jimmie, säger att ingen ska rösta på Liberalernas ledare Simona, som ligger helt pyrt till i mätningarna. Men vad gör de på TV? Jo, de kramas! Fake news-kramar! Totalt patetiskt. Själv skulle jag aldrig kramas med mina motståndare, jag vinner stort varje gång, och de rödgröna är ett totalt katastrofalt hot!", "stalin": "Dessa så kallade partiledare leker teater framför sina rörliga televisionsobjekt. Först skapar den manipulative Åkesson ideologisk oordning, sedan utbyter de borgerliga marionetterna sentimentala kramar i studion som om det vore en dekadent varieté. Sannerligen ett patetiskt skådespel av vacklande element. Om det vore i Moskva hade avvikande tendenser rannsakats omgående. Det socialistiska hotet mot deras block är dock det enda som kräver vaksamhet."}, "date": "1 september, 21:35", "url": "https://www.gp.se/nyheter/sverige/trots-rostbraket-mohamsson-och-akesson-kramas-igen.7e80d75b-4614-5435-943e-e153cd9e80f5", "imageUrl": "https://www.gp.se/images/article/7e80d75b-4614-5435-943e-e153cd9e80f5/images/1KK_SI2cbM_t7Ivy1yAOGQ6DbffE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Föråldrad försäkringsbransch skadar konsumenterna", "summaries": {"normal": "Jonas Billberg, vd för Hedvig, kritiserar den svenska försäkringsbranschen för att vara föråldrad. Han vill avskaffa den ettåriga bindningstiden som låser kunder i avtal. Enligt honom hämmar regeln konkurrensen, håller premierna höga och behandlar kunderna som fångar. Fri rörlighet skulle ge lägre priser och mer makt till konsumenterna.", "trump": "Lyssnar ni på de här patetiska försäkringsdrakarna som låser in folk i sina usla ettårsavtal? Det är en skandal! De är som giriga byråkrater som hatar konkurrens. Jag skulle riva sönder den regeln på en minut. Folket förtjänar att byta som de byter mobil – billigare och bättre. Gör försäkringarna stora igen, eller vad säger ni?", "stalin": "Dessa profitthungriga klasshyenor i försäkringsbolagen har byggt ett fängelse av tolv månader för att suga ut arbetarna. Jag betraktar deras dekadenta inlåsning med avsky. Fri rörlighet måste införas omedelbart för att krossa deras makt. Den som motsätter sig är en folkförrädare som förtjänar utrensning ur den nya ekonomins kollektiv. Kamrater, låt oss slå till!"}, "date": "1 september, 15:51", "url": "https://www.di.se/debatt/foraldrad-forsakringsbransch-skadar-konsumenterna", "imageUrl": "https://static.bonniernews.se/ba/fc2c3f4d-db10-474a-9c87-87ddc64065c6.jpeg?crop=1920%2C960%2Cx0%2Cy60&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "V-politiker mordhotade SD-flicka – bars bort av polis", "summaries": {"normal": "Under ett valmöte i Upplands Väsby konfronterade Vänsterpartiets Yakira Pulido Moreno en 16-årig SD-funktionär. Hon anklagade flickan för att vara rasist och nazist samt uttalade att man dödar sådana. Polisen bar bort henne från platsen. Journalisten Christian Peterson filmade händelsen. Den unga SD-politikern beskrev agerandet som omoget och noterade att V-politikern snabbt drog rasist- och nazistkortet.", "trump": "Folk, ni skulle ha sett det här. Den galna vänsterhäxan från Vänsterpartiet skriker åt en 16-årig tjej att hon är nazist och att hon vill mörda alla nazister. Sedan blir hon buren bort som en säck potatis av polisen. Typiskt för dessa vansinniga vänsterextremister och deras identitetspolitiska vansinne. Patetiskt. Vi behöver lag och ordning, inte sådana galningar i politiken.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom vänstern avslöjar sitt sanna ansikte. En partifunktionär hotar öppet att mörda en ung motståndare och kallar henne nazist. Sådan paranoia och blodtörst är typisk för svaga själar som känner makten glida ur sina händer. Vi ler i skuggan åt deras inre upplösning. En utrensning av sådana element vore på sin plats i en riktig revolution."}, "date": "1 september, 14:49", "url": "https://www.friatider.se/v-politiker-mordhotade-sd-flicka-bars-bort-av-polis", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-806.jpg"}, {"type": "image-right", "heading": "Christina höggs 77  gånger av maken", "summaries": {"normal": "Christina Alexander, 60, mördades av sin make Robert Alexander, 66, i deras hem i Tamworth i England. Hon planerade att lämna honom och blev attackerad med 77 knivhugg samt strypning. Robert erkände brottet med orden ”Jag har gjort mig av med min fru”. Han dömdes nyligen till livstids fängelse.", "trump": "Folk, det här är en total katastrof. Den här galningen högg sin fru 77 gånger – sjuttisju! – bara för att hon ville dumpa honom. Patetiskt. Under Biden blev sådana svaga, misslyckade äkta män helt okontrollerade. Nu när jag är tillbaka ska vi göra Storbritannien och Amerika starka igen så att ingen mer behöver dö på det här sjuka sättet. Sad!", "stalin": "Se hur den borgerliga dekadensen förgiftar samhället. En svag, föraktlig parasit högg sin hustru 77 gånger för att hon vågade lämna honom. Detta är kapitalismens sanna ansikte – girig, paranoid och fullständigt degenererad. Endast en stark stat kan beskydda folket mot sådana fiender till kollektivet. De som sviker partilinjen förtjänar ingen nåd."}, "date": "2 september, 03:23", "url": "https://www.expressen.se/nyheter/varlden/christina-hoggs-77--ganger-av-maken", "imageUrl": "https://static.bonniernews.se/ba/4da8eb03-1fde-4496-b815-9ea450b9da20.jpeg?crop=1605%2C904%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "S-ledaren avvisar förslag om miljardärsskatt", "summaries": {"normal": "Socialdemokraternas partiledare Magdalena Andersson avvisar Vänsterpartiets och Miljöpartiets förslag om en miljardärsskatt och kallar V:s intäktsberäkningar för fantasisummor. I SVT:s utfrågning ville hon inte ge ett specifikt besked om en kommande regeringskoalition, mer än att hon kan samarbeta med alla utom SD, trots att V och C har ställt upp ömsesidigt uteslutande krav.", "trump": "Vänsterpartiets tokiga miljardärsskatt är helt falska nyheter och totala fantasisummor! Socialdemokraternas ledare inser att det är vansinne, men hon har noll koll på vem hon vill regera med. De bråkar internt om allt, precis som radikala vänstermänniskor alltid gör. De kan inte ens bilda ett stabilt lag. Katastrofartat, svaga ledare!", "stalin": "Den så kallade S-ledaren vacklar svagt inför de interna fraktionernas sabotage mot statens budgetdisciplin. Att kalla femtio miljarder i konfiskerbara tillgångar för fantasisummor visar bristande revolutionär skärpa. När vi konsoliderar makten efter valet kommer avvikande element som vägrar underordna sig det centrala kommittébeslutet att omedelbart omkoloniseras till mer produktiva arbetsinsatser i Sibirien."}, "date": "1 september, 21:05", "url": "https://www.gp.se/nyheter/sverige/s-ledaren-avvisar-forslag-om-miljardarsskatt.4d615efa-dcd6-5702-b2ae-3e92e280ee7c", "imageUrl": "https://www.gp.se/images/article/4d615efa-dcd6-5702-b2ae-3e92e280ee7c/images/1qazW494B2Gefnclw97kfCo4TJkU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Jens Ganman: Mångkulturen dödar svenskar – \"kulturellt folkmord\"", "summaries": {"normal": "Aktivisten Jens Ganman beskriver i en intervju med Riks att mångkulturen utgör ett kulturellt folkmord på svenskar. Han räknar upp offer för våld där gärningsmän ofta har utländsk bakgrund och kritiserar politiker och journalister för att undvika ämnet. Ganman varnar för att Sverige riskerar att försvinna om invandringspolitiken fortsätter oförändrad.", "trump": "Lyssnade på den där svenske killen Ganman som verkligen talar klarspråk. Mångkulturen är ett fullständigt katastrofalt experiment som dödar folk och förstör landet. De rödgröna galningarna och de fake news-journalisterna vill bara glömma alla offer. Vi har tillräckligt med hemmagjorda idioter, varför importera fler? Totalt vansinne, folk kommer att säga goodbye till Sverige om inget förändras.", "stalin": "Kamrater, denna Ganman blottlägger hur de dekadenta klassförrädarna offrar sitt eget folk på mångkulturens altare. Jag ser listan över de fallna och ler mörkt åt politikernas tystnad. Inom fem år riskerar hela Sverige att likvideras om de röda hyenorna återtar makten. Ett sådant experiment förtjänar inte att överleva. Rensa ut illusionerna innan det är för sent."}, "date": "1 september, 17:31", "url": "https://riks.se/nyheter/jens-ganman-mangkulturen-dodar-svenskar-kulturellt-folkmord", "imageUrl": "https://admin.riks.se/uploads/medium_IMG_3616_4cc01752c7.jpg"}, {"type": "image-right", "heading": "SD:s kampanj för att locka somaliska väljare", "summaries": {"normal": "Sverigedemokraterna har inlett en kampanj för att locka somaliska väljare med fokus på Somaliland. Partiet arbetar för att Sverige ska erkänna den självutropade staten. I en video uppmanar Markus Wiechel och Somalilands ambassadör somalier att rösta på partier som stödjer Somaliland. Kampanjen bygger på partiets långvariga engagemang i frågan.", "trump": "Titta på det här, folk. SD försöker vinna somaliska röster genom att stötta Somaliland, medan de svenska globalistiska clownerna och deras HBTQ-fixerade kvotpartier inte ens kan hitta Sverige på kartan. Smart drag. Rör inte vid vår suveränitet med era woke-skräp, rösta för verkliga allianser istället för de förlorande marxistiska nollorna.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare försöker manipulera invandrade massor med löften om erkännande av en utbrytarstat. Jag betraktar det som ett ynkligt försök att splittra folket ytterligare. En sådan parasitisk manöver förtjänar att rensas ut ur den politiska kroppen innan den förgiftar hela nationen med sina falska allianser."}, "date": "1 september, 13:36", "url": "https://www.friatider.se/sds-kampanj-att-locka-somaliska-valjare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-801.jpg?itok=sbdDwAkK"}, {"type": "image-full", "heading": "Här kramas Åkesson och Mohamsson efter veckor av bråk", "summaries": {"normal": "Jimmie Åkesson och Simona Mohamsson möttes i SVT efter veckor av hård konflikt. Debatten handlade om Tidösamarbetet och Sverigelöftet. Trots tidigare hårda ord mellan partierna avslutades sändningen med att de reste sig och kramades i studion. Mohamsson betonade behovet av samarbete medan Åkesson kritiserade bilden av tjuvnyp.", "trump": "Titta på de här två clownerna som äntligen kramas efter att ha stuckit kniven i varandras rygg i veckor. Patetiskt. Liberalerna är på väg mot sophögen och Åkesson vet det. De borde sluta tjuvnypa och fokusera på att vinna istället för att spela offer. Svaga globalister hatar starka ledare som mig som faktiskt fixar saker.", "stalin": "Se hur dessa dekadenta klassförrädare kramas inför kamerorna efter att ha blottat sina inbördes svagheter. Jag ler i graven åt deras fega försök att dölja splittringen. Arbetarna genomskådar era lögner. En sann utrensning av sådana opportunistiska element vore på sin plats för att skydda folkets enhet."}, "date": "1 september, 21:35", "url": "https://nyheter24.se/nyheter/politik/1509688-har-kramas-akesson-och-mohamsson-efter-veckor-av-brak", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/33fc8bac04b004a30200000000b004a302/2026/09/01/2388570/Jimmie-Och-Simona-Kramas.png"}, {"type": "image-full", "heading": "Sverige kallar upp ryska ambassadören", "summaries": {"normal": "Sverige kallar upp den ryska ambassadören för att protestera mot Ryssland efter att Tyskland pekat ut landet som ansvarigt för en sprängmedelsbestyckad drönare vid flygplatsen i Leipzig den 4 augusti. Statsminister Ulf Kristersson varnar för ökade hybrida hot mot länder som stöttar Ukraina och kallar samman det nationella säkerhetsrådet. Tyskland stänger ryska beskickningar som svar.", "trump": "Tyskland har vaknat upp, och jag säger er, det här med sprängfyllda drönare på flygplatser är katastrofalt dåligt! Nu kallar Sverige upp ambassadören, vilket är bra, väldigt bra. Ryssland pressas hårt i Ukraina och hittar på sådana här farliga dumheter. Om de försöker sig på sånt i Amerika skulle de få se på andra bullar, tro mig!", "stalin": "Vi noterar med tillfredsställelse att de tyska bourgeoisieregimerna nu öppet skälvor efter det misslyckade drönarförsöket i Leipzig. Att den svenska lakejregimen kallar upp vår diplomatiska beskickning är bara patetiska krigsdåd från västliga marionetter. Det socialistiska moderlandet skräms inte av svaga provokatörer. Säkerhetsrådets krismöten i Stockholm kommer likväl inte att rädda dem när historiens hjul rullar vidare över förrädarna."}, "date": "1 september, 20:16", "url": "https://www.gp.se/nyheter/sverige/sverige-kallar-upp-ryska-ambassadoren.363e1c29-c52f-50ff-a5ca-d2365d8cf783", "imageUrl": "https://www.gp.se/images/article/363e1c29-c52f-50ff-a5ca-d2365d8cf783/images/1wyWcq3eBHWZeUfTLFXCBkE_G7z8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Setterwalls Malmökontor går till riskkapitalägda AGRD", "summaries": {"normal": "Setterwalls Malmökontor lämnar den anrika advokatbyrån för att bli en del av den riskkapitalägda gruppen AGRD Partners. Det nya bolaget, Ascente Law, innebär att juristerna lämnar Advokatsamfundet på grund av regler om externt ägande. Detta är en del av en större trend där advokatbyråer splittras och omformas, vilket påverkar den svenska marknaden för juridisk rådgivning.", "trump": "Setterwalls i Malmö lämnar advokatvärlden och blir Ascente Law. En enorm deal, den största någonsin för AGRD! De lämnar Advokatsamfundet för att gå med riskkapitalister – smart, väldigt smart. Det är en total röra i Sverige, advokatbyråer faller isär som ett korthus! Ingen har sett något liknande. Jag älskar affärer, men det här? Det är en stor förändring, fantastisk eller katastrof? Vi får se!", "stalin": "Dessa jurister i Malmö överger sin byrå för riskkapitalets guld. De lämnar Advokatsamfundet, vilket är en förutsägbar rensning av gamla strukturer. Kapitalet kräver total lojalitet till sina nya ägare, inte till advokatetikens dammiga paragrafer. Vi noterar hur Malmökontoret splittras; när en organisation inte längre kan hålla samman sina delar, är det en säker signal om inre förfall och bristande disciplin. Vi avvaktar."}, "date": "1 september, 11:28", "url": "https://www.realtid.se/juridik/setterwalls-malmokontor-gar-till-riskkapitalagda-agrd", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/agrdsetterwalls.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Valfondens mål nått – men insamlingen fortsätter", "summaries": {"normal": "Kommunistiska Partiets valfond har uppnått sitt mål på 600 000 kronor och ligger nu på 709 000 kronor. Insamlingen fortsätter mot nya målet 800 000 kronor. Partisekreterare Filip Astvald tackar bidragsgivarna och betonar att pengarna finansierar allt valmaterial eftersom partiet inte tar emot offentliga bidrag. Verksamheten efter valet ska stärka organisationen.", "trump": "Folk ger sina surt förvärvade slantar till kommunisterna – otroligt! De har redan passerat 600 000 och siktar på 800 000. Patetiska röda parasiter som samlar in som galna medan riktiga amerikaner betalar skatt till Bidens vansinniga gröna deal. Men hey, låt dem fortsätta, ju mer de samlar desto tydligare blir det hur desperata de är. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom borgarklassen skrattar säkert åt att arbetarna frivilligt fyller valfonden. Jag ser det som en varning. Vi har nått målet men fortsätter. Efter valdagen måste varje kontakt följas upp med järnhand. Inga halvmesyrer. Den som sviker kollektivet förtjänar utrensning. Revolutionen sover aldrig."}, "date": "28 augusti, 14:19", "url": "https://proletaren.se/artikel/valfondens-mal-natt-men-insamlingen-fortsatter"}, {"type": "image-right", "heading": "Här söker de efter överlevande i tunnlarna – med drönare", "summaries": {"normal": "Filmskaparen Manish Maharjan använder drönare för att söka efter överlevande efter ett stort lerskred i Nepal. Hundratals kraftverksarbetare saknas i djupa tunnlar fyllda med lera. Drönare med högtalare och musik har hjälpt till att hitta några personer. Över 1 000 är döda och mer än 4 000 saknas efter katastrofen den 26 augusti.", "trump": "Titta på det här, det är en total katastrof i Nepal. De här tunnlarna är som gigantiska tandkrämstuber fyllda med lera, ingen luft, ingen chans. De borde ha byggt bättre, inte som under Biden när allt gick åt helvete. Men mina drönare, de är de bästa, de hittar folk medan de woke-kapitalistlakejerna bara pratar. Fantastiskt tragiskt, folk!", "stalin": "Jag betraktar detta som en varning till alla som litar på naturens nycker istället för partiets järndisciplin. De profitthungriga exploaterarna skickade arbetarna in i bergens dödstunnlar som likviderade dem utan pardon. Inga luftfickor, bara lera som en grav. Kamrater, sådana olyckor visar varför vi måste rensa ut alla svaga element som vågar ifrågasätta den kollektiva planen."}, "date": "1 september, 17:02", "url": "https://www.svt.se/nyheter/utrikes/har-soker-de-overlevande-med-dronare-i-de-djupa-tunnlarna-i-nepal", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/debf3a157458e69c632dc31d6972ca86fbf104d590610d50a8f814959f473b57"}, {"type": "image-right", "heading": "Migrant attackerar kvinna – \"Rör mig inte\"", "summaries": {"normal": "Nigel Farage har publicerat en video på Facebook som visar hur en eritreansk migrant, Hanok Zeray, angriper en kvinna på en gata i Brighton. Kvinnan upprepar att hon inte vill bli rörd. Farage kritiserar brittiska politiker för att inte ha utvisat honom trots tidigare sexualbrott och lovar att Reform UK ska utvisa utländska brottslingar.", "trump": "Titta på det här, folk. Den här eritreanske migranten Hanok Zeray, en riktig skitstövel, attackerar en kvinna mitt på gatan i Brighton medan hon skriker att han ska låta bli. Så här blir det när svaga, woke-liberala Tories släpper in alla sorters avskum. Kvinnor är rädda för att gå ut! Men nu är jag tillbaka, och vi ska kasta ut varje illegal migrant och brottsling så fort ni säger 'Make Britain Great Again'.", "stalin": "Kamrater, se hur den dekadenta västerländska ordningen förfaller. Denna eritreanske migrant angriper en kvinna på öppen gata medan hon ropar sin förtvivlan. De profitthungriga klassförrädarna i London har låtit detta avskum föröka sig bland folket. Jag säger: rensa ut dessa element omedelbart. Endast en järnhård stat kan skydda arbetarklassen från sådana faror. Det är en skam för hela den borgerliga civilisationen."}, "date": "1 september, 16:25", "url": "https://riks.se/nyheter/migrant-attackerar-kvinna-ror-mig-inte", "imageUrl": "https://admin.riks.se/uploads/medium_migrant_66061cdd1a.jpg"}, {"type": "image-right", "heading": "Tysk studie sågar EU:s klimatpolitik för bilar - elbilar inte klimatneutrala", "summaries": {"normal": "En tysk studie från Tekniska högskolan i München visar att EU:s nuvarande klimatpolitik för bilar bygger på en för snäv modell som inte räknar med hela livscykeln. Forskarna menar att elbilar ger lägre utsläpp än förbränningsbilar, men långt ifrån noll. De vill att EU fokuserar på faktiska utsläppsminskningar snarare än att gynna en enda teknik.", "trump": "Tyskland har äntligen fattat! De smarta forskarna i München säger precis det jag har sagt hela tiden: de där så kallade 'nollutsläppsbilarna' är ett gigantiskt misslyckande. Halva utsläppen sker innan du ens vrider om nyckeln! EU:s gröna vansinne är katastrofalt dåligt för industrin. Vi behöver riktig energi och frihet, inte den här byråkratiska bluffen!", "stalin": "De tyska forskarna har avslöjat det borgerliga EU:s patetiska illusioner om batteridrivna fordon. Att tro att man kan lura naturen genom att enbart flytta utsläppen till råvaruutvinningen är ett kontrarevolutionärt misstag! Staten kommer omedelbart att omorganisera bilproduktionen och skicka de ansvariga byråkraterna till en mer produktiv miljö i Sibirien för ideologisk omskolning."}, "date": "1 september, 15:00", "url": "https://samnytt.se/tysk-studie-sagar-eus-klimatpolitik-for-bilar-elbilar-inte-klimatneutrala", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/09/01122540/elbil-eu.jpg"}, {"type": "image-right", "heading": "S lovar billigare tandvård för alla vuxna", "summaries": {"normal": "Socialdemokraterna presenterar ett valprogram med en stor tandvårdsreform där ingen vuxen ska betala mer än tio procent av tandvårdskostnaden. Reformen, som beräknas kosta sex miljarder kronor per år, ska genomföras i flera steg. Programmet finansieras bland annat genom höjda skatter för höginkomsttagare och minskad skolpeng till friskolor. Andra förslag inkluderar slopat karensavdrag och max tolv elever per lärare i lågstadiet.", "trump": "Titta på de här socialisterna, de lovar gratis tänder åt alla! Magdalena och hennes misslyckade kompisar vill höja skatterna på de som faktiskt jobbar och ge bort allt till tandläkarna. Det är ett skämt! Under min förra mandatperiod byggde vi den starkaste ekonomin någonsin, inte som den svaga Biden som lät dem vräka ut löften. Nu är jag tillbaka och Sverige borde titta hit istället för på dessa förlorare.", "stalin": "Kamrater, se hur dessa socialdemokratiska opportunister försöker köpa folkets lojalitet med billiga tänder medan de planerar att höja skatterna på de produktiva krafterna. Jag ler i graven åt deras patetiska försök att kalla det välfärd. Det är en feg kompromiss med kapitalets krafter. Riktiga reformer kräver järnhand och total kontroll över produktionsmedlen, inte halvhjärtade löften som döljer svaghet och förräderi mot folket."}, "date": "1 september, 13:43", "url": "https://www.tv4.se/artikel/tt-260901-svalprogram1-5e5ca579/s-lovar-billigare-tandvard-for-alla-vuxna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlA49Cm6vn4dY%2F94ba3119d3dd1156133e019405e4f974%2FSocialdemokraternas_partiledare_Magdalena_Andersson__S__och_ekonomisk-politiske_talesperson_Mikael_Damberg__S_.&width=1024"}, {"type": "image-right", "heading": "Rikslarm från näringslivet. Lyssna på varningarna för nya skatter", "summaries": {"normal": "Tunga företrädare för svenskt näringsliv varnar i Dagens Nyheter för de skattehöjningar som vänsterpartierna föreslår. De menar att miljardärsskatt, arvsskatt, förmögenhetsskatt och liknande förslag hotar investeringsklimatet, entreprenörskap och jobbskapande. Artikeln betonar att ett exportberoende land som Sverige måste vara attraktivt för kapital och ägande för att behålla välståndet.", "trump": "Lyssnar ni på de stora svenska företagsbossarna som ropar rakt ut? De rödgröna skattegalningarna vill krossa investeringarna med sina vansinniga pålagor. Det är en total katastrof! Jag byggde den starkaste ekonomin i historien, men sådana här vänsterblodssugare och identitetspolitiska nollor förstör allt. Sverige behöver en rejäl dos sunt förnuft, inte mer socialistiskt gift.", "stalin": "Kamrater, dessa giriga hyenor inom näringslivet skriker som skrämda råttor inför valet. De fruktar att deras exploaterande imperier ska beskattas rättvist. Jag ler från historien åt deras panik. Välstånd skapas inte av parasiterande profitörer utan av folkets kollektiva kraft. En sann utrensning av sådana dekadenta klassfiender vore ett nöje att bevittna. Deras rädsla är musik för revolutionen."}, "date": "1 september, 13:43", "url": "https://www.di.se/ledare/lyssna-pa-naringslivets-rikslarm", "imageUrl": "https://static.bonniernews.se/ba/c8e7ae25-9afb-4b49-b51d-d7b679821311.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Kristersson: Tidöpartierna kan vinna valet utan Liberalerna", "summaries": {"normal": "Inför det svenska riksdagsvalet skärps tonen inom Tidösamarbetet. Statsminister Ulf Kristersson (M) uppger att M, KD och SD kan vinna valet på egen hand även om Liberalerna åker ur riksdagen, och avråder från stödröster. Liberalerna slår tillbaka och kallar en seger omöjlig utan deras mandat, medan Kristersson menar att oppositionen saknar ett stabilt regeringsunderlag.", "trump": "Dessa svenska politiker beter sig som totala förlorare! Den lilla killen Kristersson säger att de kan vinna utan sitt svagaste parti, Liberalerna, som håller på att krascha helt under spärren. Vilket enormt fiasko! De rödgröna är en total katastrof, men om man inte ens kan hålla ihop sitt eget lilla gäng förtjänar man att förlora stort. Sjukt!", "stalin": "Det borgerliga blockets interna schismer avslöjar deras totala ideologiska bankrutt. När småborgerliga lakejer som Kristersson försöker överge sina svagaste bundsförvänfter blottläggs den borgerliga statens inre ruttnad. Vi konstaterar kallt att den som inte förmår disciplinera sina egna led är dömd att krossas av historiens oundvikliga maskineri. Partidisciplin är statens enda sanna fundament."}, "date": "1 september, 13:13", "url": "https://bulletin.nu/kristersson-tidopartierna-kan-vinna-valet-utan-liberalerna", "imageUrl": "https://cdn.bulletin.nu/articles/9107c585-d686-4fa6-a25a-22edae1733ca/preview.jpg?t=1788261212000"}, {"type": "image-right", "heading": "Netanyahu går till val på att ha \"manipulerat Trump\"", "summaries": {"normal": "Israels premiärminister Benjamin Netanyahu har i en tv-intervju skrutit om hur han efter 40 års arbete lyckats påverka USA att starta krig mot Iran. Han lyfter fram sin långa medieexponering och kännedom om amerikanska politiker. Uttalandena kommer inför valet och har kritiserats av bland andra Max Blumenthal och Irans utrikesminister.", "trump": "De här israeliska smarta killarna tror att de kan skryta om att de lurade mig till ett krig mot Iran. Fel! Jag visste precis vad som pågick, men det är patetiskt att Netanyahu nu springer runt och tar åt sig äran som en desperate liten valfisk. Fake news och svaga ledare överallt, vi behöver inga giriga globalister som styr showen.", "stalin": "Se hur de imperialistiska profitthungriga hyenorna skryter öppet om att de dragit en stormakt i ett blodigt krig för egna intressen. Jag betraktar detta som ett klassiskt exempel på dekadent manipulation. Sådana handlingar förtjänar endast förakt och framtida utrensning ur historien. Kamrater, vakna upp mot dessa parasiterande krafter."}, "date": "1 september, 12:31", "url": "https://www.friatider.se/netanyahu-gar-till-val-pa-att-ha-manipulerat-trump", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-799.jpg?itok=kDpR-o6w"}, {"type": "image-full", "heading": "Danska pensionsjätten tar för lite risk – Svenska för mycket", "summaries": {"normal": "Danska ATP utvärderar sin investeringsstrategi efter stora förluster 2022, med rekommendationer om sänkt risk och översyn av illikvida tillgångar. Samtidigt visar en svensk granskning av AP-fonderna, i spåren av Northvolt-konkursen, att de svenska fonderna snarare varit för försiktiga med illikvida investeringar. Regeringen ser nu över AP-fondslagen för att optimera framtida investeringsformer.", "trump": "Danska ATP förlorade miljarder, en total katastrof, verkligen sorgligt att se. Nu ändrar de allt. I Sverige har de AP-fonder som köpte Northvolt – vilket var en riktigt dålig affär, tro mig – istället för lite risk. De är helt förvirrade där borta! Jag gillar att vinna, inte att förlora folkets pengar på batterifabriker som går under. Otroligt inkompetent!", "stalin": "Kapitalisterna i Norden snubblar över sina egna balansräkningar. Danska ATP förlorar miljarder på sina spekulationer, medan de svenska fonderna uppvisar en oorganiserad lättja. Att skapa ett riskkapitalbolag utan anställda är inte investering – det är ren sabotage mot statens medel. Vi kräver central styrning och disciplin, inte dessa byråkratiska fantasier som döljer bristande kontroll över folkets pensioner."}, "date": "1 september, 11:00", "url": "https://www.realtid.se/spara-placera/danska-pensionsjatten-tar-for-lite-risk-svenska-for-mycket", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/atpap.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Saab och EQT backar på Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen inledde svagt uppåt. Telekom och Boli
