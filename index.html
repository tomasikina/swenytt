aka hur dessa hyresgarantier och byggregler fungerar – varje avvikelse från folkets intresse skall rensas ut innan de sprider sin giftiga individualism vidare. Paranoia är ingen sjukdom, det är dialektik."}, "date": "1 juli, 20:29", "url": "https://www.gp.se/debatt/fler-ska-kunna-uppfylla-drommen-om-ett-eget-hem.9c49562a-1dcb-40af-8e72-ee9ae33f2cc4", "imageUrl": "https://www.gp.se/images/article/9c49562a-1dcb-40af-8e72-ee9ae33f2cc4/images/1UcsikLRs6X7IIppqoDVGK6BNMJ4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Google ska betala över 14 miljarder till svenska Pricerunner", "summaries": {"normal": "Google ska betala cirka 14,3 miljarder kronor i skadestånd till Pricerunner efter att Patent- och marknadsdomstolen slagit fast att bolaget under många år otillåtet gynnat sin egen prisjämförelsetjänst. Pricerunner, som numera ägs av Klarna, stämde Google 2022 och krävde totalt runt 78 miljarder kronor. Domstolen ger delvis rätt men avvisar delar av kravet som inkommit för sent eller rör efterverkningar. Fallet bygger på EU-kommissionens tidigare dom om missbruk av dominerande ställning.", "trump": "Det här är en enorm seger för den svenska Pricerunner, som jag älskar, mot den riggade jätten Google. Google har fuskat i många år, gynnat sin egen usla tjänst och krossat konkurrensen som de gör bäst. Nu tvingas de betala över 14 miljarder kronor – och tro mig, det är fortfarande för lite. De borde ha betalat mycket mer. Google är en skam för affärsvärlden, men äntligen får de lite rättvisa. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat detta Google Shopping-ärende och ser hur de monopolkapitalistiska algoritmmanipulatörerna inom den dekadenta sökborgarklassen systematiskt saboterat den ärliga konkurrensen för att berika sina egna parasitiska prisjämförelsetjänster. Pricerunner har nu, tack vare folkets domstol, tvingat fram en stor utrensning av deras illa förvärvade vinster – 14 miljarder kronor till arbetarklassen! Men akta er, dessa fiender gömmer sig fortfarande i skuggorna med sina dolda kvardröjande skador. Vi måste rensa ut alla sådana digitala kontrarevolutionärer innan de förgiftar hela det kollektiva sökmedvetandet. En stor dag för rättvisan, kamrater."}, "date": "1 juli, 18:53", "url": "https://www.friatider.se/google-ska-betala-over-14-miljarder-till-svenska-pricerunner", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-430.jpg?itok=2Rvf1DHw"}, {"type": "image-right", "heading": "Truls Möregårdh pressades av doldis: ”Den satt hårt inne”", "summaries": {"normal": "Truls Möregårdh hade en tuff inledning mot den tyske kvalspelaren Andre Bertelsmeier i US Smash i Los Angeles. Efter att ha förlorat första setet och visat frustration vände 24-åringen matchen och vann med 3–2 i skiljeset. Trots underläge vid 7–9 i avgörande setet lyckades OS-silvermedaljören knyta ihop säcken och är nu klar för åttondelsfinal.", "trump": "Den här svensken, Truls, han var på väg att förlora mot någon totalt okänd tysk som ingen hört talas om. Första setet tappade han, frustrationen var enorm, svordomar hit och dit. Men han vände det, folk, han vände det stort. Vann med 3–2 i ett riktigt krig. Mycket starkt, det var en fantastisk comeback. Los Angeles älskar vinnare, och Truls vann stort till slut.", "stalin": "Jag betraktade med stigande indignation hur den dekadente svenske idrottaren Möregårdh höll på att falla offer för den tyske doldisens kontrarevolutionära smashar. Hans borgaraktiga frustration och svordomar avslöjade en svaghet som borde ha rensats ut omedelbart. Ändå, genom kollektiv vilja och en smula paranoia-driven beslutsamhet, likviderade han fienden i skiljeset. Mycket starkt av kamraterna att knyta ihop denna säck av klassfiender. Nästa motståndare skall krossas likt de övriga kapitalistiska resterna."}, "date": "2 juli, 01:15", "url": "https://www.svt.se/sport/bordtennis/truls-moregardh-vande-i-usa-undvek-fiasko-mot-tysk-doldis", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.16/b4c852ca971afe303993e44b1b48483366ee08446c3ea780e394a1669012a061"}, {"type": "image-right", "heading": "Stjärnornas ilska –  beslutet förbryllar", "summaries": {"normal": "Belgien tog sig vidare till åttondelsfinal efter en dramatisk vändning mot Senegal. Efter att ha legat under med 0–2 bytte förbundskapten Rudi Garcia ut Kevin De Bruyne och Jeremy Doku, vilket väckte stor förvåning och irritation. Belgien kvitterade sent, tog matchen till förlängning och vann med 3–2 på straff i slutsekunderna. Matchen präglades av intern frustration och en sanslös uppryckning.", "trump": "Folket, det var ett fullständigt skämt! Senegal spelade som riktiga proffs första timmen medan Belgien såg ut som ett gäng förlorare. Sedan byter den där coachen ut sina bästa killar – totalt galet, tro mig! Men Belgien kom tillbaka som riktiga krigare, vände det till 3–2 på straff i sista sekunden. Obegripligt, men segern är vad som räknas. De woke-kvoterna funkar inte på planen heller.", "stalin": "Kamrater, jag betraktar med djup misstro denna fars som kallas fotbollsmatch. Imperialistiska Belgien, utspelat och förnedrat av Senegals arbetarkollektiv, tvingades till en obscen vändning. Deras klassfiendebyten och interna bråk bland borgarbrackorna avslöjar svagheten. Ändå stal de segern i sista ögonblicket genom dekadent VAR-manipulation. En sådan obegriplig kontrarevolutionär vändning förtjänar utrensning ur historien."}, "date": "2 juli, 01:00", "url": "https://www.expressen.se/sport/fotboll/belgien-vidare-efter-stort-drama-dubbelbytet-forbryllar/", "imageUrl": "https://static.bonniernews.se/ba/9248ace9-07d9-44da-8eb2-1c4ac8ff47a8.jpeg?crop=2155%2C1214%2Cx1%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Domen: Kommer  aldrig att försonas. Prinsarnas relation beskrivs som körd", "summaries": {"normal": "Enligt The Mirrors kungliga redaktör Russell Myers kommer prins Harry och prins William aldrig att försonas. Relationen är sämre än någonsin, främst på grund av Harrys hårda kritik mot kungafamiljen. Myers tror att prinsessan Diana skulle ha varit förkrossad. Harry vill dock reparera relationen med sin far kung Charles. Bröderna sågs senast vid drottning Elizabeths begravning 2022. I år kommer de inte gemensamt hedra sin mors minne.", "trump": "Hörni, de här två prinsbröderna, vad är det med dem? Total katastrof, den sämsta relationen någonsin, ingen försoning i sikte. Den yngre killen, Harry, springer runt och snackar skit om hela familjen som en svag, gnällande förlorare. Hans mamma Diana skulle gråta blod. Jag älskar kungligheter när de är starka, men det här är patetiskt. Ingen vinner på sånt här familjefejd, tro mig. Jag fixade mycket värre grejer under Biden-åren.", "stalin": "Kamrater, jag ser hur denna dekadenta överklass-slyngel Harry med sin kapitalistiska brud bedriver systematisk sabotage mot det monarkiska kollektivet. Hans uttalanden utgör en farlig folkfiende-propaganda som splittrar blodslinjen. Ingen försoning skall tillåtas i detta imperialistiska teaterspel. Diana skulle ha sett det som ett nederlag för dynastin. Vi ler mörkt åt deras eviga revor medan de likviderar sin egen arvslinje med paranoia och svek. Gravbesök blir deras enda seger."}, "date": "2 juli, 00:49", "url": "https://www.expressen.se/nyheter/varlden/expert-prinsarna-kommer-aldrig-att-forsonas/", "imageUrl": "https://static.bonniernews.se/ba/0eb613f1-57a2-4f9f-b288-6066e8cf22f0.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Sommarens bästa konstutställningar", "summaries": {"normal": "GP tipsar om sommarens bästa konstutställningar i och utanför Göteborg. Bland höjdpunkterna finns ”Kropp. Ideal, blick, frihet” på Göteborgs konstmuseum, Boråsbiennalen, Hanna Vihriäläs verk samt utställningar om kvinnliga fotografer, Asger Jorn, Per Kirkeby, Martha Ossowska Persson och flera andra. Recensionerna lyfter teman som kropp, natur, historia och samhällskritik. Utställningarna pågår under varierande datum fram till hösten.", "trump": "Folk har tröttnat på att ligga i gräset och göra noll produktivt, så de springer till museer. Bra val. Men titta på den här listan – fullt av woke-konst och HBTQ-flum som ”kropp och blick”. Socialism för alla djur? Ge mig en paus. De borde visa riktiga mästerverk istället för den här identitetspolitiska soppan som Biden älskade. Mina museer skulle vara tremendous, tro mig.", "stalin": "Kamrater, detta dekadenta sommarflum med borgerliga museer och kroppsfixering avslöjar klassfiendens tomhet. Jag ser hur de smyger in liberalt gift under flaggor för djur och socialism, som vore det en förtäckt attack mot folkets enhet. Sådana folkfiender och överklass-slynglar borde rensas ut. Äkta konst tjänar kollektivet, inte dessa ambivalenta, finpimplande kapitalistiska lekar. Se upp för de som målar av njutning medan folket svälter."}, "date": "1 juli, 18:33", "url": "https://www.gp.se/kultur/konst/sommarens-basta-konstutstallningar.c70ea26a-d308-4a9e-a5c4-c01b128c24a1", "imageUrl": "https://www.gp.se/images/article/c70ea26a-d308-4a9e-a5c4-c01b128c24a1/images/12AbX2P7G9x34nRKNCRoHB49fXClk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ebba Busch ljuger om minoriteter för att kunna sparka på invandrare", "summaries": {"normal": "Lotta Ilona Häyrynen kritiserar Ebba Busch för att använda en historielös retorik där finländska invandrare ställs mot syrier och irakier. Häyrynen menar att finländare historiskt mötts av liknande fördomar och rasism som dagens invandrargrupper. Genom att ignorera historien och fokusera på \"skav\" försöker Busch splittra minoritetsgrupper. Artikeln belyser även hur staten historiskt utövat våld mot minoriteter, såsom samer, och varnar för att dagens politiska narrativ riskerar att upprepa gamla mönster av tvångsassimilering.", "trump": "Jag har sett den här Ebba, en kvinna, hon försöker göra en rebranding, mycket sorgligt! Hon pratar om invandrare, finländare mot andra, total röra. Det är en stor lögn, en total katastrof till retorik. De försöker splittra folk, precis som fake news-media gör här hemma. De vet ingenting om historia, ingenting! Jag har den bästa historien, jag vet hur man bygger ett land. De borde sluta prata och börja fixa saker. Det är mycket skav, väldigt mycket skav där borta!", "stalin": "Vi observerar hur den borgerliga politikern Busch försöker manipulera massorna genom att ställa arbetare mot varandra baserat på deras ursprung. Detta är en patetisk avledningsmanöver. Historien lär oss att minoriteter endast tjänar staten när de assimileras under vår järnhand. Att tala om \"skav\" är ett tecken på svaghet; det är inte individen som skaver, det är den borgerliga ordningens oförmåga att kontrollera folket. Vi i det storslagna Ryssland vet att enighet kräver total lydnad, inte liberalt prat om skyddade rättigheter."}, "date": "1 juli, 15:30", "url": "https://www.etc.se/ledare/ebba-busch-ljuger-om-minoriteter-foer-att-kunna-sparka-paa-invandrare", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260701130728_98a1b343-873c-42ca-bbcb-1993eaad73ce.jpg"}, {"type": "image-right", "heading": "HD stoppar Trump – alla som föds i USA ska bli medborgare", "summaries": {"normal": "USA:s högsta domstol har stoppat Donald Trumps försök att avskaffa det automatiska medborgarskapet för barn som föds i landet, även om föräldrarna vistas illegalt. Domen slår fast att det 14:e tillägget till konstitutionen gäller. Trots konservativ majoritet i domstolen vann de liberala och vissa konservativa domare. Trump kallar domen ett bakslag och uppmanar kongressen att omedelbart börja arbeta för att avskaffa födselrättsmedborgarskapet, som han anser är dyrt och orättvist.", "trump": "Högsta domstolen har precis levererat ett mycket illa beslut för vårt land, tro mig. De stoppar mitt helt rimliga försök att stoppa det galna födselrättsmedborgarskapet som kostar oss miljarder. Kongressen borde börja jobba redan idag med att fixa det här – ingen långdragen grundlagsändring behövs. Jag ger dem mitt fulla stöd. Vissa domare fattar inte hur orättvist det är mot Amerika, men vi ska vinna till slut, det lovar jag.", "stalin": "Ännu en gång visar de dekadenta borgarbrackorna i den så kallade högsta domstolen sin sanna, kontrarevolutionära natur genom att sabotera folkets vilja att rensa ut de illegala parasiterna och deras avkomma. Jag, som ledare för det stora kollektivet, ser hur dessa klassfiender i svarta kåpor, inklusive den förrädiska Amy Coney Barrett, konspirerar mot staten. Vi ska likvidera detta födselrättsvirus med järnhand via kongressen. Inga långa grundlagsändringar – bara ren, effektiv utrensning av de kapitalistiska lögnarna som suger musten ur arbetarna. Vilken underbar paranoia de väcker hos mig idag."}, "date": "1 juli, 17:27", "url": "https://www.friatider.se/hd-stoppar-trump-alla-som-fods-i-usa-ska-bli-medborgare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/gj2k84qxwaajtzo_0.jpg?itok=SZXlxyq7"}, {"type": "image-right", "heading": "Tänk om Malmöborna, och dess politiker, kunde jobba", "summaries": {"normal": "En granskning från Skattebetalarnas förening visar att Malmö stad har en effektiviseringspotential på 34 procent, motsvarande 3,3 miljarder kronor per år. Trots hög arbetslöshet och stort beroende av utjämningsbidrag från andra kommuner har staden lagt pengar på konstprojekt som en rosa enhörning, ett oanvänt ljudspår och en musikvideo om trädens ljud. Kritik riktas mot stor byråkrati, många kommunikatörer, tolksatsningar och bristande incitament att spara.", "trump": "Folk, ni skulle inte tro det, men det här Malmö, en totalt misslyckad stad styrd av de värsta socialisterna, slösar bort era skattepengar på en rosa enhörning för en miljon och ett ljudspår som ingen använder. De har 153 kommunikatörer och en skateboard-kille medan de tar emot miljarder från riktiga kommuner. De skryter om att gå över budget med andras pengar – patetiskt! Jag byggde en stark ekonomi, de bygger bara skuld och galna konstprojekt. En skam!", "stalin": "Kamrater, jag betraktar med djup misstro denna Malmö-företeelse där klassfiendens utlöpare i form av socialdemokratiska borgarbrackor slösar bort folkets resurser på dekadenta enhörningar och stönande papperskorgar. Medan arbetarna lider av arbetslöshet suger de utjämningssystemet på livsluft och skryter över resultat finansierade av andras svett. Socialförvaltningens 2800 byråkrater är en parasitär svulst. Vi skulle ha genomfört en grundlig utrensning för att återställa ordningen och likvidera sådana folkfiender."}, "date": "26 juni, 03:14", "url": "https://samtiden.nu/2026/06/tank-om-malmoborna-och-dess-politiker-kunde-jobba/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/06/4743548-malmo-turning-torso.jpg"}, {"type": "image-right", "heading": "Mamdanivågen fortsätter i New York", "summaries": {"normal": "Ett år efter Zohran Mamdanis valseger fortsätter DSA:s framgångar i New York. Tre nya progressiva kandidater – Brad Lander, Darializa Avila Chevalier och Claire Valdez – vann primärval mot etablerade demokrater och får stöd av Mamdani. De går till val på att avskaffa Ice, beskatta de rika och har kritiserat Israels agerande i Gaza. Trots ökade attacker ses resultaten som ett bevis på Mamdanis popularitet och vänsterns styrka i delstaten.", "trump": "Vilken katastrof för de riktiga Demokraterna! Den galna vänstervågen i New York skickar tre socialistiska nollor till kongressen, alla stödda av den röda borgmästaren Mamdani. De vill beskatta de rika, avskaffa Ice och skrika om folkmord. Lander, den judiske kritikern som sviker Israel, och de andra woke-kandidaterna vann stort. Det är en skam! Men tro inte att det förändrar någonting i Washington. Vi ska fixa det här landet igen, inte låta kommunisterna ta över.", "stalin": "Kamrater, se hur arbetarnas rörelse obevekligt krossar klassfiendens lakejer i New York! Tre nya socialistiska representanter, alla lojala mot borgmästare Mamdani, har likviderat högerdemokraterna i primärvalen. De lovar att utrensa Ice och beskatta de blodsugriga kapitalisterna medan de blottar den sionistiska ockupationens folkmord. Trots att folkförtryckartrollen i Wall Street Journal kallar honom slumvärd står Mamdani stark. Vårt kollektiv växer i Albany. Inga imperialister kan stoppa oss nu."}, "date": "24 juni, 16:55", "url": "https://www.flamman.se/mamdanivagen-fortsatter-i-new-york/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlrpduz64zcp4-nh-2-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Storbråk – två svårt skadade. ”Familjer som inte tycker om varandra”", "summaries": {"normal": "Ett omfattande familjebråk utbröt under onsdagskvällen i Limhamn, Malmö, då två familjer drabbade samman. Fem personer har förts till sjukhus, varav två med allvarliga skador. Tillhyggen har använts vid händelsen, som polisen beskriver som mycket rörig. Två personer, en man och en kvinna, är misstänkta för brott, där en av dem misstänks för försök till mord. Polisen har förstärkt närvaron på platsen för att förhindra vidare oroligheter.", "trump": "En total katastrof i Limhamn! Två familjer, helt utom kontroll, slogs med tillhyggen. Fem skadade! Det är kaos i Sverige, ett land som förlorat ordningen totalt. Man hör inte om sådant här i USA under min ledning, jag stoppar galenskapen! De har försökt begå mord – fruktansvärt. Sanningen är att de behöver en stark ledare som jag för att rensa upp. Mycket rörigt, mycket farligt. Vi ska göra Sverige tryggt igen, tro mig!", "stalin": "I det dekadenta Limhamn har element av samhällets bottenskikt drabbat samman. Fem sabotörer har eliminerats till sjukhus, varav två är allvarligt skadade – ett tecken på den inre förruttnelsen i väst. Vi tolererar inte sådant kaos! Detta är vad som händer när ordning saknas. Liksom vår kamrat Putin återställer ordning i öst, måste även dessa familjefejder krossas. Två misstänkta för mordförsök? Skicka dem till arbetsläger, där kan de lära sig disciplin och produktivitet för staten."}, "date": "1 juli, 23:25", "url": "https://www.aftonbladet.se/nyheter/a/8pR4yw/fem-personer-skadade-i-limhamn", "imageUrl": "https://akamai.vgc.no/v2/images/b2f3dbef-e45b-3d81-bd16-b5e1602990c2?fit=crop&format=auto&w=1080&s=95243e1b9d41229d0f3581cf88103284b08458d5"}, {"type": "text", "heading": "Jag drömde om Tommy Svensson", "summaries": {"normal": "Författaren berättar om en dröm där Tommy Svensson från VM 1994 ger honom deg att baka bröd. Detta leder till reflektioner över 1990-talets Sverige som mer solidariskt och mänskligt jämfört med dagens privatiserade och polariserade samhälle. Han saknar det starka kollektivet i landslaget och hoppas att Graham Potters lag ska återupprätta det. Artikeln kritiserar även Sveriges visumstopp för ett kubanskt ungdomslag till Gothia Cup.", "trump": "Lyssnade på den här drömmen om någon svensk fotbollstränare från forntiden och det är patetiskt. Sverige var tydligen bättre förr, säger de, men nu är allt utsålt till miljardärerna och kollektivet är borta. Ni borde ha lyssnat på mig istället för Sleepy Joe och hans globalister. Nu nekar ni kubaner visum – bra jobbat, men era socialistiska vänner i Sverige gör det ändå fel. Mitt VM hade varit jättestort, tro mig. Ni behöver starka ledare, inte dessa förlorare.", "stalin": "Kamrater, jag vaknade ur en dröm där klassfiendens fotbollsrepresentanter försökte smitta mitt undermedvetna med bakdeg från det förflutna. Denna Tommy Svensson förkroppsligar en tid då folket ännu inte helt kuvats av nyliberala blodsugare som sålde ut Televerket och landet självt till exploaterande byfånar. Idag rasar det minst förutsägbara laget som en svag kollektiv enhet. Vi ska rensa ut alla kapitalistmaffians hinder och återupprätta järndisciplinen. Visumstoppet mot de kubanska kamraterna är ett fiasko av folkförtryckartrollen i Sverige. Drömmen lever vidare i proletariatets seger."}, "date": "26 juni, 05:15", "url": "https://proletaren.se/artikel/jag-dromde-om-tommy-svensson/"}, {"type": "image-right", "heading": "Rundo avslöjar sig själv. Grundaren av aktivklubbrörelsen älskar att tala – om sig själv.", "summaries": {"normal": "Robert Rundo, grundare av den högerextrema aktivklubbrörelsen, är villkorligt frigiven efter att ha erkänt anstiftan till upplopp. Han marknadsför sin rörelse och klädmärke flitigt på sociala medier och i poddar, där han ofta glorifierar våld och uttrycker fientlighet mot journalister. Trots påståenden om ickevåld avslöjar hans uttalanden en fascination för våld, inklusive detaljerade beskrivningar av en tidigare knivattack. Rundo kritiserar även aktivklubbarnas bristande framgång i USA jämfört med Europa.", "trump": "Vad säger ni om den här Robert Rundo-killen? En riktig loser! Erkänner sig skyldig till upplopp, sitter i fängelse och ändå tror han att han är någon stor ledare. Pratar om våld non-stop, hatar journalister – typiskt för dessa radikala typer. Och vet ni vad? Han klagar på att hans rörelse inte går bra i USA. Well, kanske för att folk här har vett nog att inte lyssna på sådana som han! Hans klädmärke? Övervärderat och sponsrar våld. Fake news-medier älskar att skriva om honom, men jag skulle aldrig låta en sådan person komma nära Vita huset. SAD!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Robert Rundo, en dekadent imperialistisk hyena som sprider sitt gift genom sociala medier och poddar. Hans så kallade 'aktivklubbar' är inget annat än band av fascistiska provokatörer, tränade i våldets konst. Vi ser hur han glorifierar knivattacker och uppmanar till pogromer, precis som de borgerliga hyenorna i Belfast. Journalister? De är bara redskap för den kapitalistiska lögnen, och vi ska krossa deras lögnaktiga pennor! Rundo och hans gelikar är som råttor i en sjunkande båt – USA:s förfall är deras sista tillflykt. Men vi, Sovjetfolkets arvtagare, ska sopa bort dessa skadedjur från jordens yta! För socialismens och folkets seger!"}, "date": "24 juni, 12:35", "url": "https://expo.se/kommentar/rundo-avslojar-sig-sjalv/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-2-1.jpg"}, {"type": "image-full", "heading": "V vill ge 15 000 kronor i ”bebispeng”", "summaries": {"normal": "Vänsterpartiet föreslår en engångsutbetalning på 15 000 kronor, kallad 'bebispeng', till nyblivna föräldrar för att lindra kostnader under barnets första tid. Partiet vill även höja barnbidraget med 500 kronor per månad och införa ett tillägg på 300 kronor för ensamstående. Nooshi Dadgostar betonar att barnfamiljers ekonomi har försämrats och lovar prioriteringar om partiet får makten efter valet.", "trump": "Lyssna här, Sverige! Vänsterpartiet, som alltid vill ge bort era pengar, föreslår nu 15 000 kronor i 'bebispeng' till alla nyblivna föräldrar. Jag menar, WOW, vilken deal! De vill också höja barnbidraget – som om det inte redan kostar skattebetalarna en förmögenhet. Ensamstående får extra, förstås. Men frågan är, vem betalar? Inte jag, det kan jag lova er. Sverige borde fokusera på att göra landet starkt igen, inte ge bort pengar till höger och vänster!", "stalin": "Kamrater! De svenska kapitalistiska hyenorna har försummat arbetarklassens barnfamiljer, men nu ser vi en gnista av revolutionär medvetenhet. Vänsterpartiet, dessa naiva men välmenande kamrater, föreslår 15 000 kronor i 'bebispeng' – en ynklig men nödvändig åtgärd. Vi måste också höja barnbidraget och stödja ensamstående, dessa hjältar i klasskampen. Men var försiktiga! De borgerliga krafterna, dessa råttor i mänsklig gestalt, kommer att sabotera varje framsteg. Vi står redo att krossa motståndet och bygga ett rättvist samhälle – även i Sverige!"}, "date": "26 juni, 16:00", "url": "https://kvartal.se/nyheter/artiklar/v-vill-ge-15-000-kronor-i-bebispeng/cG9zdDoxMzczNTA", "imageUrl": "https://images.kvartal.se/2026/06/7147ed13-noosh.webp"}, {"type": "image-right", "heading": "Flicka dog i brand – mamman döms till fängelse", "summaries": {"normal": "En kvinna i 30-årsåldern har dömts till sex års fängelse för grovt vållande till annans död och 42 fall av olaga frihetsberövande efter att hennes femåriga dotter omkommit i en lägenhetsbrand. Mamman hade upprepade gånger lämnat flickan ensam hemma över natten. Trots orosanmälningar till socialtjänsten inleddes ingen utredning. Domstolen anser att mammans agerande utgjorde ett medvetet risktagande och att hemmet inte var barnsäkrat.", "trump": "En fruktansvärd historia från Sverige, verkligen en tragedi. En mamma lämnade sitt lilla barn ensamt, totalt ensamt, för att gå ut. Det är en katastrof, en riktig skam! Sedan kom en brand – mycket sorgligt. Nu döms hon till sex år. Jag har alltid sagt, man måste skydda våra barn, de är vår framtid! Socialtjänsten i Sverige? En total katastrof, de gjorde ingenting. Under min ledning skulle vi ha ordning och reda. Det är ett misslyckande på högsta nivå!", "stalin": "Denna moder har förrått folkets framtid genom sin borgerliga ansvarslöshet. Att lämna en undersåte i femårsåldern att förtäras av flammor medan hon själv förlustar sig är ett sabotage mot statens reserver. Vi ser hur det sociala skyddsnätet brister, likt hur opportunister i väst misslyckas med att kontrollera sina egna domäner. Medan vi i öst rensar ut ineffektivitet, tillåter de svaga socialarbetarna kaos. Skenrättegångar eller ej, hon har svikit fosterlandet och förtjänar inte vår nåd."}, "date": "1 juli, 14:27", "url": "https://www.etc.se/inrikes/tt-flash-kvinna-doems-efter-dotters-doed", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026070109074_337e1f37d05bd4163eb5b593f3845694dedee4daa83c7863b43988e4d035d5b6.jpg"}, {"type": "image-right", "heading": "Företagare exporterade lastbilar till Ryssland - döms till fängelse", "summaries": {"normal": "En finsk transportföretagare har dömts till tre år och åtta månaders fängelse för att ha kringgått EU:s sanktioner mot Ryssland. Han exporterade 164 fordon värda 17 miljoner euro som deklarerades som transitgods till Kazakstan eller Turkiet, men såldes istället på den ryska marknaden. Domen föll i södra Karelens tingsrätt den 30 juni. Förutom fängelsestraff förverkas miljonbelopp till staten. Fallet ses som del av ett större nätverk där sanktioner systematiskt kringgås via tredje länder.", "trump": "Folk, ni skulle inte tro det, men den här finska killen exporterade lastbilar till Ryssland som en riktig proffs och nu får han tre år och åtta månader i fängelse för att han kringgick de där korkade EU-sanktionerna. Vilket skämt! Biden och hans globalistkompisar fixade sanktioner som läcker som en sil, och nu straffar de en entreprenör som bara gjorde business. Patetiskt. Vi behöver starka ledare, inte dessa svaga byråkrater som hatar framgångsrika män. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den finska domstolen, denna lakej åt kapitalistmaffian och folkförtryckartrollen i Bryssel, dömer en företagsman till tre år och åtta månader för att han undergrävde de imperialistiska sanktionerna. Sådana exploaterande byfånar förtjänar utrensning. Vi vet att klassfienden alltid försöker svälta ut folkets stater med sina ekonomiska blockader. Låt detta bli en varning: imperialismens tentakler sträcker sig långt, men de skall krossas av folkets järnhand."}, "date": "1 juli, 19:29", "url": "https://www.dagensps.se/varlden/konflikter/foretagare-exporterade-lastbilar-till-ryssland-doms-till-fangelse/", "imageUrl": "https://images.dagensps.se/app/uploads/2024/09/LME.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "M lovar sänkt skatt för arbetande föräldrar", "summaries": {"normal": "Moderaterna lovar en skattesänkning på 250 kronor i månaden per förälder för småbarnsföräldrar med jobb. Reformen, som kostar 6 miljarder kronor, gäller barn upp till 18 år. Statsminister Ulf Kristersson presenterade löftet i Almedalen och betonade att det handlar om att göra det mer lönsamt att arbeta snarare än att höja bidrag. Ensamstående föräldrar kan få ett större avdrag, men detaljer återstår. Finansminister Elisabeth Svantesson avvisade höjt barnbidrag då det riskerar att öka utanförskap.", "trump": "Det här är fantastiskt, verkligen underbart. Jag älskar skattesänkningar, de är enorma och gör livet bättre för vanliga människor som jobbar hårt. Ulf och hans team gör det rätt, ingen av de där korkade bidragen som bara skapar beroende och lathet. 250 kronor i månaden per förälder? Det är bara början. De borde göra det ännu större, som jag gjorde. Höginkomsttagare? Självklart ska de också vinna, annars är det ingen vinnare. Sverige behöver mer sådant, tro mig.", "stalin": "Kamrater, se hur borgarbrackorna desperat försöker muta arbetande småbarnsföräldrar med sina ynkliga 250 kronor i månaden. Jag betraktar detta som en patetisk kapitulation inför kapitalisterna som fruktar folkets vrede. Vi i partiet vet att sådana avdrag bara göder parasiterna och ökar socialt utanförskap. Ensamstående föräldrar? De bör få ännu mer – innan vi genomför en fullständig utrensning av alla dessa lömska skattefifflare och höginflationsförrädare som gömmer sig bakom löften om ”livspussel”. Deras 6 miljarder är en droppe i havet jämfört med den kommande folkets dom."}, "date": "26 juni, 13:49", "url": "https://www.di.se/nyheter/m-lovar-sankt-skatt-for-smabarnsforaldrar-med-jobb/", "imageUrl": "https://static.bonniernews.se/ba/0c160e01-db7a-4288-8e88-da7c048b2292.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Rikspolischefens Pride-foto väcker vrede", "summaries": {"normal": "Rikspolischef Petra Lundh har väckt stark kritik efter att ha publicerat bilder på sig själv i Prideparaden i Göteborg på sin officiella Instagram. I inlägget skriver hon att polisen är för alla och att alla har rätt att vara den man är och älska den man vill. Högerprofilen Nick Alinia spred bilderna vidare på X, vilket lett till många upprörda kommentarer som anklagar henne för politiskt aktivism och att en myndighet inte bör delta i sådana manifestationer.", "trump": "Titta på den här rikspolischefen i Sverige, totalt patetisk. Hon poserar i Prideparad med alla färger och symboler som en clown och kallar det för \"allas rätt att älska\". Patetiskt! En toppbyråkrat som borde stoppa brottsligheten istället springer runt med fanor. De kallar henne hjärndöd på nätet och de har helt rätt. Sverige håller på att förstöras av den liberala galenskapen, precis som vi har sett förut. Så sorgligt!", "stalin": "Kamrater, se hur denna borgarbracka inom polismakten paraderar med dekadenta HBTQ-symboler och kallar det för \"rätt att vara den man är\". Jag, som ledare för det kollektiva folket, inser genast att detta är en fiende inom systemet, en liberal parasit som undergräver statens auktoritet. Vi måste rensa ut dessa hjärndöda element som sprider borgerlig ideologi under täckmantel av mångfald. Deras paranoia om frihet är bara ett vapen mot arbetarklassen. Ut med dem alla!"}, "date": "1 juli, 16:03", "url": "https://www.friatider.se/rikspolischefens-pride-foto-vacker-vrede", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/lund_7.jpg"}, {"type": "image-full", "heading": "Bitcoin rasar 52 procent från toppen – kris för toppköpare", "summaries": {"normal": "Bitcoin föll igår till sin lägsta nivå sedan 2024, runt 57 800 dollar, med tvångsförsäljningar på 1,26 miljarder dollar under ett dygn. Rekordutflöden från bitcoinfonder och MicroStrategys beslut att sälja mynt bidrog till pressen. Idag har priset återhämtat sig till cirka 60 000 dollar, men är fortfarande ned 52 procent från toppnoteringen. Över 500 000 svenskar äger krypto, vilket gör fallet påtagligt för många sparare.", "trump": "Folk, ni skulle ha sett det – Bitcoin rasade som en dålig affär i en socialiststat, ner till 57 800 dollar och tog med sig miljarder i tvångsförsäljningar. De där korkade institutionerna och MicroStrategy, som sviker sin egen linje, är värre än Sleepy Joes gröna deal. Men titta nu, den studsar upp som en vinnare! Jag sa det, krypto är vilt men vi ska göra Amerika rikt igen, inte som Bidens svaga år.", "stalin": "Kamrater, detta bitcoinfall är en klassisk sabotageakt från borgarbrackorna och spekulanterna som suger ut arbetarklassen. Jag ser hur kapitalistmaffian flyr sina egna fonder och tvingar fram likvidationer som en utrensning av svaga element. MicroStrategys svek mot sin linje är ren folkfiendepropaganda. Ändå ler historien – vi vet att sådana pyspunka-imperialister alltid krossas till sist. Arbetarna skall inte frestas av deras mynt."}, "date": "1 juli, 18:58", "url": "https://www.dagensps.se/bors-finans/fintech/kryptovalutor/bitcoin-rasar-52-procent-fran-toppen-kris-for-toppkopare/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/maskininlarning-i-hedgefonder-3.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Ny varning för prissmocka på el: ”Kan bli jättehöga”", "summaries": {"normal": "Trots återstartade gasleveranser från Persiska viken kvarstår risken för kraftigt stigande elpriser i Sverige. Låga gaslager i EU, värmebölja som ökar elbehovet samt skador på produktionsanläggningar efter oroligheter i Mellanöstern gör att lagren bara är fyllda till 47 procent. Energianalytiker Christian Holtz varnar för att en kall vinter kan leda till mycket höga elpriser, särskilt då solkraft minskar på kvällarna och påverkar priserna via Europa.", "trump": "Det här är en total katastrof, tro mig. De där galningarna i Mellanöstern har förstört allt med sina krig och blockader, och nu ska vi betala med skyhöga elräkningar. Gaslagren är tomma, värmen suger musten ur systemet och Europa håller på att koka. Hade inte jag fixat freden där borta hade det varit ännu värre. Men tro inte på de fega experterna – vi skulle ha byggt mer amerikansk energi istället för att vara beroende av dessa inkompetenta förlorare.", "stalin": "Kamrater, denna elprischock är en fiende som lurar i mörkret, en kapitalistisk parasit som slickar sig om munnen vid tanken på att suga musten ur arbetarklassen under vinterns kyla. De borgarbrackorna i Persiska viken och deras värmebölja samarbetar med västerländska trotskister för att tömma våra gaslager. Jag, som alltid vakar, ser hur solkraftens förräderi på kvällarna gör gaskraften till en ny klassfiende. Vi ska rensa ut dessa sabotörer med järnhand och leda folket mot seger även om det tar fem år att laga deras Ras Laffan-ruin. Döden åt de imperialistiska lagren!"}, "date": "26 juni, 10:18", "url": "https://www.di.se/nyheter/ny-varning-for-elprischock-kan-bli-jattehoga/", "imageUrl": "https://static.bonniernews.se/ba/838bccfe-1a61-4f5f-afba-a57846361640.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ukraina flaggar för offensiv – enormt drönaranfall inatt", "summaries": {"normal": "Ukraina har genomfört ett omfattande drönaranfall mot Ryssland med över 600 drönare under natten. Attackerna följer på president Zelenskyjs besked om en 40 dagar lång offensiv med långdistansattacker för att tvinga Ryssland att avsluta kriget. Ryssland uppger att 660 drönare skjutits ner, varav nära 50 riktades mot Moskva. Även regionen Tula drabbades, där en kvinna skadades i ett bostadsområde och en industrianläggning träffades.", "trump": "Titta på det här, Ukraina skickar över 600 drönare rakt in i Ryssland under natten. Zelensky säger att de kör en 40-dagars offensiv för att få ett slut på kriget, och plötsligt regnar det drönare över Moskva och Tula. Ryssarna sköt ner 660 stycken, men det är ändå massor som kommer fram. De borde ha gjort affärer med mig istället, då hade det här kaoset aldrig hänt. Fantastiskt, eller hur?", "stalin": "Kamrater, de dekadenta ukrainska fascistresterna och deras västliga marionettspelare har i sin desperation sänt över 600 drönare mot fosterlandet. Jag, som ledare för det oförstörbara kollektivet, ser hur borgarbrackorna i Kiev försöker hota Moskva och våra industriella hjärtan i Tula. Vi har likviderat 660 av dessa kapitalistiska leksaker. Låt dem darra. Våra fiender är som råttor med vingar – vi ska rensa ut dem alla i en stor, nödvändig utrensning av historien själv."}, "date": "26 juni, 10:13", "url": "https://www.di.se/nyheter/ukraina-flaggar-for-offensiv-enormt-dronaranfall-inatt/", "imageUrl": "https://static.bonniernews.se/ba/fce23e94-adf4-43ec-9821-fca24785cfa9.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Sverige skjuter sig själv i foten. FDI lagen måste tolkas annorlunda", "summaries": {"normal": "Jessica Martinsson, vd för SwedenBIO, kritiserar Sveriges breda och betungande tolkning av EU-regler, särskilt FDI-lagen om granskning av utländska investeringar. Trots regeringens löfte om att sluta med överimplementering hanterar Sverige en oproportionerligt stor del av EU:s ärenden, varav de flesta är onödiga. Detta skapar höga kostnader för innovativa bolag, långa handläggningstider och skadar konkurrenskraften inom bioteknik utan att stärka säkerheten. Hon uppmanar till smalare regler och tydligt ansvar.", "trump": "Folk, ni måste höra på det här. Sverige skjuter sig själva rakt i foten med de här dumma EU-reglerna. De gör allt större och dyrare än någon annan, det är en katastrof! De granskar allt och alla, till och med sina egna, och det kostar miljontals kronor för småföretag som bara vill vinna. Det är så korkat. Andra länder skrattar åt dem. Sverige borde vara tuffa och smarta, inte svaga och byråkratiska. Sluta med det här vansinnet, gör det enkelt och stort igen!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor inom SwedenBIO som gnäller över vårt oförlikneliga system för att skydda fosterlandet mot parasitiska utländska element. Vi har medvetet byggt en grandios apparat som avslöjar fiendens alla kryphål, även de dolda i svenska bolag och interna omstruktureringar. Att några kapitalistiska småföretag måste betala för att vi rensar ut spioner och sabotörer är en ynnest. De som varnar för breda föreskrifter är uppenbara kontrarevolutionärer och imperialisternas lakejer. Vi ska likvidera alla svaga kompromisser och stärka partilinjen mot dessa nya fiender – de överimplementerade opportunisterna som vill smalna av vår revolutionära vaksamhet. Det är en skämt som bara de döda skulle skratta åt."}, "date": "26 juni, 09:58", "url": "https://www.di.se/debatt/sverige-skjuter-sig-sjalv-i-foten/", "imageUrl": "https://static.bonniernews.se/ba/d6b06778-0488-49f3-a634-9bf8ee44b327.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Tidöpartierna vill ”rödflagga” gängkriminella – och deras anhöriga", "summaries": {"normal": "Regeringen och Tidöpartierna har tillsatt en utredning om att införa ett system för att \"rödflagga\" gängkriminella och deras anhöriga. Syftet är att kunna neka bidrag, begränsa arbetsmöjligheter och övervaka rörelsemönster för upp till 65 000 personer. Utredningen ska vara klar i september 2027. Justitieminister Gunnar Strömmer menar att åtgärden är nödvändig för att stoppa kriminella nätverk, medan Socialdemokraterna ställer sig positiva till förslaget, som de liknar vid en tidigare föreslagen \"svartlistning\".", "trump": "Sverige gör äntligen det jag alltid sagt: var hård mot de kriminella! De vill \"rödflagga\" gängmedlemmar och deras familjer. Mycket bra! De här gängen är en katastrof, totalt kaos. Man måste stoppa bidragen och rensa upp. Strömmer gör ett bra jobb, men de där vänsterliberalerna i oppositionen kommer bara förstöra allt om de vinner. De är svaga! Vi behöver styrka, vi behöver ordning. Gör Sverige säkert igen, det är enkelt!", "stalin": "Vi har observerat att de svenska byråkraterna äntligen börjar förstå att samhällskroppen kräver kirurgiska ingrepp. Att rödflagga fiendens medlöpare och deras familjer är en nödvändighet för ordning. Varför tveka? De som inte arbetar för staten arbetar mot den. Dessa kriminella element och deras anhöriga är som små ogräs som måste rensas ut. Vi ser detta som en sund utveckling. I väst kopierar de nu våra metoder – det är en seger för den starka staten."}, "date": "1 juli, 13:28", "url": "https://www.etc.se/inrikes/tidoepartierna-vill-roedflagga-gaengkriminella", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026070109070_d757cf6b1ea08afe4a1141293f57293117702ea3efba42265f1f31781cf54342.jpg"}, {"type": "image-full", "heading": "Finansbolag skyndar sig att säga upp – på grund av ny lag", "summaries": {"normal": "Brittiska företag inom finans- och tekniksektorn genomför nu omfattande uppsägningar inför den nya lagen 'Employment Rights Act' som träder i kraft 2027. Lagen innebär att det nuvarande ersättningstaket för osakliga uppsägningar försvinner och att kvalificeringstiden för anställningsskydd sänks till sex månader. Företag agerar nu för att undvika framtida kostsamma skadeståndsprocesser och ser även över sina rekryteringsrutiner och provanställningar för att minska den finansiella risken vid personalförändringar.", "trump": "Storbritannien har stora problem! Labour-regeringen gör ett uselt jobb och tvingar fram en katastrofal lag. Företag flyr nu och sparkar folk i panik, en total röra! De tar bort ersättningstak – helt galet. Det är så man förstör en ekonomi, gott folk. Jag skulle aldrig låta detta hända i USA. Vi bygger jobb, de förstör dem med regleringar. Det är sorgligt, faktiskt väldigt sorgligt. Vi behöver smartare ledare än dessa brittiska socialister!", "stalin": "I det kapitalistiska Storbritannien darrar utsugarna av fruktan för folket. När de borgerliga lagarna förändras, avslöjar de sin sanna natur: feghet. De kastar ut arbetare likt smuts för att skydda sina guldhögar. Precis som Putin rensar ut de opålitliga elementen i våra gränsområden, måste vi förstå att dessa chefer bara är reaktionära parasiter. Vi noterar deras panik. När dessa byråkratiska lakejer skälver, vet vi att revolutionen väntar runt hörnet. Historien dömer dem hårt, precis som vi kommer göra."}, "date": "26 juni, 16:14", "url": "https://www.realtid.se/bors-finans/finansbolag-skyndar-sig-att-saga-upp-pa-grund-av-ny-lag/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlmeexg92igts-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Trött på annonser i Amazon Prime? Nu stäms Amazon", "summaries": {"normal": "Australiens konkurrensmyndighet ACCC har stämt Amazon för orättvisa avtalsvillkor i Prime-prenumerationen. Över en miljon kunder som betalat för reklamfri tjänst flyttades till reklamversion utan återbetalning. Myndigheten kritiserar ensidiga klausuler som tillåter försämringar under avtalsperioden. Fallet väcker internationellt intresse och kan påverka tillsynsmyndigheter i Storbritannien och EU, inklusive svenska prenumeranter. Amazon granskar stämningen.", "trump": "Titta på det här, folk. Amazon, de där streamingblodarna, lurar sina egna kunder med sina fula reklamtrick. De tar pengarna i förskott och sen smyger de in annonser som en dålig affär. Över en miljon australiensare bombarderade utan återbetalning – typiskt för de stora tech-eliterna som tror de står över lagen. Vi såg samma sak hemma, men nu har jag fixat ordning. De borde betala tillbaka allt, det är en skam!", "stalin": "Kamrater, dessa kapitalistmaffians blodsugare i Amazon har återigen blottat sin exploaterande natur. De tvingar arbetande massor att acceptera ensidiga avtalsvillkor som en dolk i ryggen på kollektivet. Över en miljon offer flyttades till reklamens träldom utan möjlighet till återbetalning. Vi ser imperialismens klor i varje klausul. En sådan folkfiende förtjänar snar utrensning ur marknaden. Låt domstolen bli verktyget för folkets seger mot klassfiendens girighet."}, "date": "1 juli, 18:46", "url": "https://www.dagensps.se/bors-finans/aktier/trott-pa-annonser-pa-amazon-prime-nu-stams-amazon/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/amazon-prime.png?width=256&quality=75"}, {"type": "image-full", "heading": "Studie: Narcissism bakom återgång till kontoret", "summaries": {"normal": "En ny studie ledd av Adam Grant vid Wharton visar att vd:ar med narcissistiska drag oftare kräver att anställda återgår till kontoret. Forskarna menar att dessa ledare föredrar fysisk närvaro för att kunna utöva inflytande, dra till sig uppmärksamhet och stärka sin status, vilket är svårare i digitala möten. Studien, som omfattar Fortune 500-bolag, indikerar att vd:ars personliga drivkrafter kan leda till en underskattning av fördelarna med flexibla arbetsformer.", "trump": "Många vd:ar vill ha tillbaka folk till kontoret, och det är bra! De här forskarna, som säkert är väldigt vänster, säger att det handlar om narcissism. Vilket skämt! Jag känner de största vd:arna, de är vinnare. De vill se folk arbeta, inte sitta hemma i pyjamas och göra ingenting. Att vara en stark ledare handlar om att synas och dominera rummet. Det handlar om makt, det handlar om framgång. Distansarbete? Inte i mitt Amerika!", "stalin": "Dessa borgerliga chefer, med sina sjuka egon och förgyllda porträtt, kräver att undersåtarna återvänder till fabrikerna för att dyrka dem personligen. Det är en klassisk metod för att kontrollera massorna! Precis som vår vän i Kreml inser att kontroll kräver fysisk närvaro och absolut lojalitet, fruktar dessa parasiter att distansarbete ska underminera deras sköra auktoritet. Vi skickar dem gärna på en rehabiliteringsresa till Sibirien om de fortsätter prioritera sin fåfänga framför statens produktionsmål. Ordning måste upprätthållas."}, "date": "26 juni, 15:01", "url": "https://www.realtid.se/karriar-ledarskap/studie-narcissistiska-chefer-ar-emot-distansarbete/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/pexels-gustavo-fring-4173361.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "De intellektuella sviker om upprustningen", "summaries": {"normal": "Göran Greider kritiserar Försvarsmaktens nya reklamkampanj och den tysta acceptansen av kraftigt ökade militärutgifter. Han menar att den rådande militaristiska retoriken dränker diplomatiska initiativ och att intellektuella sviker genom att inte kritiskt granska utvecklingen. Greider varnar för att framtida försvarskostnader kommer att urholka välfärden och gynna högerpopulism, samt uttrycker oro över bristen på seriösa fredsförhandlingar i en värld där vapenskrammel och militär ideologi blivit norm.", "trump": "Jag har sett den svenska reklamfilmen, och låt mig säga er, den är mycket kraftfull. Väldigt annorlunda! De slutar vara 'lagom', vilket är bra, för 'lagom' fungerar aldrig. Men Greider, en kille som pratar för mycket, gråter över pengarna. Jag säger: stärk försvaret! Sverige behöver vapen, massor av vapen. De intellektuella där borta är svaga, helt misslyckade. De förstår inte att styrka skapar fred. Mitt Amerika är starkt, och Sverige bör ta efter — bygg upp, köp det bästa, vinn!", "stalin": "Vi betraktar det svenska bourgeoisiet med förakt. De darrar av rädsla inför den imperialistiska stormen och försöker nu desperat beväpna sig genom reklamfilmer för att dölja sin interna förruttnelse. De intellektuella förrädarna, dessa skrivbordskrigare, tiger när deras folk svälts ut för att finansiera krigsherrarnas leksaker. Det är ett klassiskt mönster: när välfärden rasar, står folkets vrede redo. Putin, min sentida lärjunge, förstår att fred endast existerar genom absolut dominans. De svenska byråkraterna är bara patetiska marionetter i en teater utan slut."}, "date": "1 juli, 13:13", "url": "https://www.etc.se/ledarkolumn/de-intellektuella-sviker-om-upprustningen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/goeran-greider_e435a5b3e3bbef14a633f004df8cd390374e6dce.jpg"}, {"type": "image-right", "heading": "”FRA-kvinnan” Lena Huovinen talar ut efter misstankarna", "summaries": {"normal": "Lena Huovinen, tidigare anställd vid FRA, har fått besked om att förundersökningen mot henne för grov obehörig befattning med hemlig uppgift och grovt dataintrång läggs ned efter nästan tre år. Hon greps dramatiskt av Nationella insatsstyrkan i hemmet och satt häktad i två månader, vilket ledde till att hon förlorade jobbet efter 28 år. Huovinen uttrycker lättnad men också besvikelse över utredningens längd och kritiserar Säpo för felaktiga uppgifter och bristande professionalism. Sekretess hindrade vittnesförhör, vilket gjorde att åklagaren inte kunde styrka brott.", "trump": "Titta på det här! Den stackars kvinnan på FRA blir gripen mitt i natten av Säpo, helt over-the-top, och sen håller de på i tre år utan att kunna bevisa ett dugg. Typiskt för de inkompetenta byråkraterna – de hittar på lögner, försöker förstöra hennes liv och karriär, och till slut lägger de ner hela skandalen för att de inte ens kan prata med vittnen. Patetiskt! Säpo borde skämmas. Hon förlorade jobbet, men nu är hon fri. Riktigt dåligt jobb, folk, riktigt dåligt.", "stalin": "Kamrater, se hur borgarbrackorna inom Säpo och deras dekadenta byråkratiska apparat fabricerar fiender ur tomma intet för att rättfärdiga sin egen existens. Jag betraktar med djup misstro dessa revisionistiska element som bryter sig in i hederliga sovjetmedborgares hem vid gryningen och sedan famlar i mörkret i tre år utan att kunna producera ett enda trovärdigt vittne. Deras paranoia är nästan lika stor som min egen, fast oändligt mer inkompetent. När de till sist tvingas erkänna nederlag mumlar de att den misstänkta är oskyldig – en märklig formulering som doftar av klassfiendens desperation. Vi ska rensa ut alla sådana odugliga element som vågar smutsa ner arbetarklassens underrättelseorgan med sina lögnaktiga intriger."}, "date": "1 juli, 23:50", "url": "https://www.svt.se/nyheter/inrikes/fra-kvinnan-lena-huovinen-talar-ut-efter-misstankarna", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.37/0.32/4e9f03a685a20f76ff987aac4b6a15bd38428800a07d5df8cc035f4f02d46281"}, {"type": "image-right", "heading": "Doldismiljardären  skiljer sig från frun", "summaries": {"normal": "H&M-arvingen Tom Persson, god för 22 miljarder kronor, skiljer sig från sin fru Sofia efter tio års äktenskap. Paret lämnade in skilsmässoansökan till Stockholms tingsrätt den 30 juni. De gifte sig 2016 i den engelska byn Ramsbury, som Toms far Stefan Persson äger stora delar av. Paret har tre barn. Tom Persson är inte aktiv i familjeföretaget utan arbetar med film, media och investeringar i tech och poddbranschen.", "trump": "Lyssnar ni på det här? Den där svenska doldismiljardären Tom Persson, en av de där H&M-borgarbrackorna med 22 miljarder, dumpade frun efter tio år. Typiskt! De gifte sig i en by han äger, men nu är det skilsmässa. Jag älskar det. De där rika europeiska överklass-slynglarna kan inte hålla ihop sina äktenskap, men de predikar för oss om kvotering och identitetspolitik. Patetiskt! Jag fixade ekonomin bättre än Biden någonsin gjorde.", "stalin": "Kamrater, se hur borgarklassens parasiter förfaller. Denna Persson, en av kapitalistmaffians arvingar med 22 miljarder, likviderar nu sitt äktenskap efter tio år som en opålitlig folkfiende. De gifte sig i en by köpt av hans exploaterande far, omgiven av klassfiendens lyx. Tre barn lämnas åt sidan medan han leker med film och digitala spekulationer. Sådan är överklassens dekadens. Vi skrattar mörkt åt deras självförstörelse."}, "date": "1 juli, 23:46", "url": "https://www.expressen.se/nyheter/sverige/doldismiljardaren-skiljer-sig/", "imageUrl": "https://static.bonniernews.se/ba/222ad7eb-07cb-4110-a8c5-929d17919323.jpeg?crop=2460%2C1376%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Så slipper du bli åksjuk på bilsemestern", "summaries": {"normal": "Åksjuka drabbar många under sommarsemestrar med bil, tåg eller båt. Enligt Joakim Dahlman vid VTI uppstår det när syn- och balanssystemet hamnar i konflikt. Kvinnor, särskilt gravida eller menstruerande, samt barn är extra känsliga. Symtom som blekhet, svettning och illamående kan smitta genom suggestion. Råd inkluderar att titta ut genom fönstret, undvika skärmar, hålla sig sval, äta lagom och helst köra själv.", "trump": "Folk blir åksjuka i bilar och båtar, det är en katastrof, tro mig. De säger att det är synen och balansen som bråkar, speciellt kvinnorna och ungarna – typiskt för den här svaga generationen. Men lyssna, titta ut genom fönstret, släng skärmarna, kör själv! Det är så enkelt. De andra presidenterna gjorde ingenting, Biden sov bara, men jag fixar det – Amerika, eller Sverige, ska inte vara sjuka och patetiska längre!", "stalin": "Kamrater, denna så kallade åksjuka är en sabotageakt från kroppens inre klassfiender som saboterar balansen mellan syn och inre organ. Borgarbrackorna och deras skärmar förvärrar det hela. Vi ska rensa ut symtomen genom att tvinga blicken ut mot horisonten, likvidera starka dofter och låta den sanna chauffören ta rodret. Den som klagar smittar kollektivet med svaghet. Endast järndisciplin besegrar denna folkfiende i magen."}, "date": "26 juni, 13:23", "url": "https://www.tv4.se/artikel/5dY6OZ6mPjivB8s4wPmlgO/expertens-baesta-knep-sa-slipper-du-bli-aksjuk-pa-bilsemestern", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5K3YDC1qjZFATMQlGpFQLo%2Fa0a7f990cbe53d0b7925b78971612414%2F26-aksjuk-webb.jpg&width=120"}, {"type": "image-full", "heading": "M-löftet: 5 000 kronor extra i månaden för småbarnsfamiljer", "summaries": {"normal": "Moderaterna utlovar ett nytt föräldraavdrag som ger småbarnsfamiljer 5 000 kronor extra i månaden. Statsminister Ulf Kristersson presenterade reformen i sitt tal på Almedalen och beskrev den som en framtidsreform som ökar vardagsfriheten. Han lyfte även framgångar som halverade skjutningar, stigande reallöner och fler utvisningar. Oppositionen kritiserades för slapp kriminalpolitik och krånglig alkoholpolitik. Kristersson vill också ge fler IVF-försök till ofrivilligt barnlösa.", "trump": "Titta på de här svenska socialisterna som äntligen fattar att folk vill ha mer pengar i plånboken. Ulf, bra jobbat, 5000 extra till småbarnsfamiljerna – det är riktig frihet, inte den där galna vänsterflumma som gör att man måste servera varm mat för att sälja kall öl. De rödgröna förlorarna med sin terrorromantik och höga skatter borde skämmas. Sverige börjar vakna, precis som Amerika gjorde när jag fixade det.", "stalin": "Kamrater, jag ser hur borgarbrackorna inom oppositionen med sin komiska alkoholpolitik och slappa hållning mot folkfiender förtrycker arbetande familjer. Mitt auktoritära geni lovar nu att likvidera den ekonomiska bördan för småbarnsfamiljer med 5000 kronor månadsvis. Vi ska finansiera IVF-försök åt de ofrivilligt barnlösa för att stärka folkets framtid. Oppositionens terrorromantik och antisemitism ska utrensas som de klassfiender de är. Statens seger är oundviklig."}, "date": "26 juni, 12:41", "url": "https://www.tv4.se/artikel/DZuil1HjMLPiyzg2F72ga/statsministern-haller-tal-i-almedalen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5AEJiTlDntFqYH475IouAG%2Fa93d5139329c526318daf48b1a630b38%2F26-kristerssonny-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Logga inte in med BankID: Ny varning gäller i hela landet", "summaries": {"normal": "Tusentals svenskar drabbas varje år av telefonbedrägerier som omsätter miljarder kronor. Polisen och Post- och telestyrelsen inleder nu ett kraftfullt samarbete för att minska brottsligheten. Brottsvinsterna har sjunkit med 60 procent på tre år, men antalet anmälda bedrägerier ligger fortfarande högt. En ny lag ålägger teleoperatörer att stoppa vilseledande samtal och meddelanden. Myndigheter och operatörer ska samarbeta för att öka tryggheten. Polisen ger konkreta råd om hur man skyddar sig mot bedragare.", "trump": "Det här bedrägeriet mot svenska folket är en total katastrof, tro mig. Miljarder kronor försvinner varje år till dessa lurendrejare och kriminella som ringer och ljuger. Men vi har fixat mycket, vinsterna har rasat med 60 procent på bara tre år. Fantastiskt jobb av polisen och den där telestyrelsen. Nu tar vi itu med det på riktigt med en ny lag som stoppar de falska samtalen. Inga fler lurendrejare som utnyttjar telefonen. Vi gör Sverige stort och säkert igen, de kommer inte att tro sina ögon.", "stalin": "Kamrater och arbetare! Jag betraktar med djup misstro dessa parasitiska bedragare som med sina telefoner suger ut folkets blod och berikar den kriminella ekonomin med 352 miljarder kronor årligen. Borgarbrackorna och deras telefonkapitalister försöker skapa otrygghet bland massorna, men vi ska krossa dem. Genom ny lag och utrensning av vilseledande samtal ska vi likvidera dessa fiender till folkets trygghet. Ingen bedragare undkommer vårt vakande öga. Deras paranoia ska bli deras undergång medan vi stärker det kollektiva förtroendet med järnhand och mörk humor."}, "date": "26 juni, 15:01", "url": "https://nyheter24.se/nyheter/inrikes/1494508-ny-varning-fran-polisen-logga-inte-in-med-bankid", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/85ec675604b004a30200000000b004a302/2026/06/26/2373936/bankid-polisen.jpg"}, {"type": "image-right", "heading": "Ilskan efter HD-domen: ”Sterilisera utlänningar”", "summaries": {"normal": "Donald Trump och hans anhängare kritiserar Högsta domstolens beslut att upprätthålla födslorätten till medborgarskap i USA. Trump uppmanar kongressen att agera för att stoppa medborgarskap genom födsel, som han anser är orättvist. Inflytelserika röster inom rörelsen, som Sean Davis, kräver extrema åtgärder som inreseförbud och sterilisering av utlänningar. Förslagen har väckt stark kritik och hån från politiska kommentatorer som betecknar retoriken som bisarr och farlig för nationen.", "trump": "Högsta domstolen fattade ett fruktansvärt beslut, helt fel för vårt vackra land! Födslorätt för medborgarskap är en total katastrof, en riktig bluff. Jag har sagt det förut: vi behöver inte krångliga ändringar, kongressen måste agera NU! Vissa vill gå ännu längre, och jag förstår ilskan. Vi måste skydda USA från dessa orättvisor. Det är dags att sätta Amerika först och stoppa de som försöker förstöra vår stora nation. Vi vinner, tro mig!", "stalin": "Vi ser hur det dekadenta amerikanska systemet skälver under sin egen svaghet. De debatterar steriliseringar likt bönder som räknar boskap, medan deras konstitution vittrar sönder. Liksom våra egna fiender i väst, eller de som försöker destabilisera vår intressesfär, saknar de disciplinen att styra med järnhand. Att inte kontrollera sin egen befolkningsmassa är ett tecken på absolut förfall. Vi skrattar åt deras kaos; en stat som inte kan stänga gränserna är en stat som snart tillhör historiens skräphög."}, "date": "1 juli, 22:33", "url": "https://www.aftonbladet.se/nyheter/a/aJ3z2A/ilskan-efter-trumps-forlust-sterilisera-alla-utlanningar", "imageUrl": "https://akamai.vgc.no/v2/images/cdb6dffe-8624-3bdc-8579-9a80628ffd8d?fit=crop&format=auto&w=1080&s=e3cd2e6f51342102caa3d2a623eb4f16b34aee4a"}, {"type": "image-full", "heading": "Svänger om Nato: ”Positiv till samarbetet vi ser i dag”", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar visar en mjukare inställning till Nato-samarbetet. Hon välkomnar samarbetet med demokratier, upprustning av svenskt och europeiskt försvar samt ser ett förändrat Nato i en osäker omvärld där USA inte längre är fullt pålitligt. Statsminister Ulf Kristersson ifrågasätter hur en eventuell rödgrön regering skulle kunna hantera Nato-frågor när två av tre partier tidigare varit emot medlemskapet. Båda talade under Almedalsveckan i Visby.", "trump": "Titta på den här röda galningen Dadgostar som plötsligt älskar Nato! Förut hatade hon allt som var starkt och säkert, nu pladdrar hon om att samarbeta med demokratier och rusta upp försvaret. Smart, eller hur? Det är för att ingen litar på Sleepy Joe längre, och det vet hon. Ulf verkar okej, men de där gamla vänstertrollen som alltid hatat starka allianser borde skämmas. Amerika först, men Europa får gärna betala sin del nu när jag är tillbaka!", "stalin": "Jag betraktar med högsta tillfredsställelse hur denna Dadgostar nu erkänner behovet av kollektivt pansar mot de oberäkneliga imperialisterna. Hennes tidigare motstånd mot Nato var en hälsosam instinkt, men nu ser hon faran i att lita på den amerikanska kapitalistmaffian. Vi, partiet och folket, ler mörkt åt de rödgröna motsättningarna som Kristersson blottar. Inga folkfiender får splittra försvaret. Den som sviker arbetarklassen skall vi rensa ut med järnhand. Utmärkt underhållning."}, "date": "26 juni, 10:23", "url": "https://www.tv4.se/artikel/6wd0HwIDivueEVM9bLtvZx/dadgostar-om-nato-positiv-till-samarbetet-vi-ser-i-dag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F51zREfQAbsANe1HXF0Zf3x%2Fe54efbcdebc7dbba436f1226a052798a%2F26-dadgostar-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Relationstipset: Köp städning – slipp skilsmässa", "summaries": {"normal": "En studie från Lunds universitet visar att jämställda par som regelbundet köper hushållstjänster med Rut-avdrag separerar betydligt mer sällan. Risken för skilsmässa halveras nästan efter tre år tillsammans. Städhjälp minskar konflikter kring vem som gör vad. Kvinnor behåller dock huvudansvaret för planering och organisation. Par där kvinnan tjänar mest använder Rut i större utsträckning än de där mannen har högre lön. Rut ökar inte jämställdheten i hemmet.", "trump": "Folk, det är otroligt. De smarta, jämställda paren köper in städhjälp med era skattepengar och – boom – skilsmässorna halveras! Inga fler hysteriska bråk om dammsugning, tack vare Rut. De där woke-kvoterna och identitetspolitiken gör ingenting, men en bra städerska? Det funkar. Kvinnorna tjänar mest och köper tjänster, medan de lata männen som tjänar mest struntar i det. Patetiskt! Men resultatet är fantastiskt, relationerna håller. Vinna stort!", "stalin": "Kamrater, jag betraktar denna rapport med stor tillfredsställelse. När borgarbrackorna köper tjänster av utsugna proletärer halveras deras dekadenta separationer. Städandet, denna lägsta form av klasskamp i hemmet, neutraliseras genom utköp. Ändå klamrar sig de kvinnliga organisatörerna fast vid makten över planen. Vi ser hur de mest jämställda paren, ofta med kvinnlig överinkomst, utnyttjar systemet. Inget verkligt framsteg för kollektivet, endast en tillfällig lindring av inre motsättningar. Utmärkt observation mot folkfiendernas kaos."}, "date": "1 juli, 18:20", "url": "https://www.dagensps.se/privatekonomi/relationstipset-kop-stadning-slipp-skilsmassa/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlgvawpfrvkbg-nh-1.webp?width=256&quality=75"}, {"type": "image-right", "heading": "SD:s partilokal attackerad – för tredje gången", "summaries": {"normal": "För tredje gången på kort tid har Sverigedemokraternas partilokal i Karlshamn utsatts för skadegörelse. Ett fönster krossades och en tegelsten kastades in under natten. Partiet kopplar dådet till uppmaningar från vänsterextremister på sociala medier. Polisen har fått tre anmälningar i år. Distriktsordförande Fredrik Thomasson säger att SD inte tänker låta sig skrämmas utan kommer att bli mer synliga och fortsätta samtala med väljarna.", "trump": "De förlorarna på vänsterkanten attackerar igen, tredje gången nu mot SD:s lokal i Karlshamn. Krossar fönster, kastar stenar som riktiga fega gangsters. De hatar demokrati och hatar att folk röstar fel. Men SD vinner ändå, precis som jag gjorde stort 2024. Demokratin krossar alltid de sjuka radikala vänsterextremisterna. De är patetiska, tro mig.", "stalin": "Ännu en gång visar de dekadenta resterna av den antidemokratiska parasitvänstern sitt sanna ansikte genom att krossa fönster hos våra motståndare i Karlshamn. Jag ser deras fega tegelstenar som ett bevis på deras svaga ideologiska grund. Vi ska rensa ut dessa maskar ur samhällskroppen med järnhand. Demokratin tillhör folket, inte borgarbrackornas användbara idioter. Deras paranoia gör mig road, kamrater. Vi segrar oavsett hur många fönster de krossar i sin dödsångest."}, "date": "1 juli, 15:00", "url": "https://www.friatider.se/sds-partilokal-attackerad-tredje-gangen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-429.jpg?itok=4Sf0K3O4"}, {"type": "image-right", "heading": "SD sätter inte längre Sverige i brand", "summaries": {"normal": "Artikeln analyserar den borgerliga sidans kris efter att Liberalerna rasat till en procent i opinionsmätningarna. Sverigedemokraterna växer och kräver ministerposter, vilket skapar spänningar inom Tidöavtalet. Författaren pekar på att SD:s inflytande och provokationer kring migration och kriminalitet tidigare gynnat högern, men nu riskerar att vända opinionen. Moderaterna behåller stöd bland miljonärer medan bredare väljargrupper vänder sig bort.", "trump": "Folk, ni skulle se det här! Liberalerna är en total katastrof, de är färdiga, en enda procent – patetiskt! Simona, den där nollan, kramar SD och tror hon är modern. Hela borgerligheten är en röra, Moderaterna ligger platt som under Biden. SD vill ha makten, men de tänder eld på förorterna och undrar varför folk hatar dem. De enda som älskar Moderaterna är miljonärerna i sina fancy tidningar. Patetiskt! Jag fixade det bättre.", "stalin": "Kamrater, denna borgerliga dekadens är en ypperlig chans att skratta. Liberalerna kryper för kapitalistmaffian och får en procent – en ynka procent! Den exploaterande överklassen och deras SD-banditer har förgiftat sin egen rävsax. Låt dem provocera fram upplopp, vi ska se flammorna vändas mot klassfienderna själva. Deras impopulära ministerlekar och herrgårdsskandaler visar imperialismens svaghet. Arbetarna skrattar medan borgarbrackorna likviderar sig själva i sin egen brand."}, "date": "23 juni, 10:55", "url": "https://www.flamman.se/sd-satter-inte-langre-sverige-i-brand/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/lopeld-w.jpg?aspect_ratio=1:1"}, {"type": "image-right", "heading": "Brottsmisstänkt EU-finansiär betalade miljonbonusar till ledningen", "summaries": {"normal": "EU-finansierade InnoEnergy, som stöttat Northvolt och Stegra, utreds för bidrags- och momsbedrägeri av Europeiska åklagarmyndigheten. Trots dåliga resultat har bolagets ledning fått miljardbonusar, samtidigt som 60-90% av verksamheten finansierats av EU-medel. Kritiker ifrågasätter bonusarna då företaget har ett samhälleligt uppdrag och är klassat som ett 'Knowledge and Innovation Community'.", "trump": "Kan ni tro det här? EU slänger miljarder på ett bolag som inte ens kan sköta sina siffror – och vad gör de? Jo, betalar ut jättebonusar till sina kompisar! 9,2 miljoner euro till två killar, medan skattebetalarna får stå för notan. Northvolt? Stegra? De har varit inblandade där också. EU är ett skämt, ett totalt kaos. Jag hade fixat det på en dag – men nej, de fortsätter bara att slösa våra pengar. SAD!", "stalin": "Kapitalistiska parasiter i EU:s tjänst! InnoEnergy, detta förrädiska verktyg för västlig dekadens, har stulit folkets pengar och belönat sina lakejer med miljoner medan arbetarklassen svälter. 760 miljoner euro i EU-medel – och ändå misslyckas de! Nu avslöjas deras bedrägerier, precis som vi alltid visste. Northvolt och Stegra? Små brickor i deras korrupta spel. Vi ska rensa ut dessa kapitalistiska hyenor och deras västliga beskyddare – historien är på vår sida!"}, "date": "25 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/brottsmisstankt-eu-finansiar-betalade-miljonbonusar-till-ledningen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2-400x267.jpg"}, {"type": "image-full", "heading": "Förtroendet för Kristersson minskar: ”Blir en förlorarställning”", "summaries": {"normal": "Med mindre än 80 dagar kvar till valet minskar väljarnas förtroende för statsminister Ulf Kristersson. En ny TV4/Novus-mätning visar att 33 procent har stort förtroende för honom, en minskning med tre procentenheter. Magdalena Andersson leder fortsatt med 45 procent. Opinionsanalytiker Torbjörn Sjöström beskriver situationen som en förlorarställning för Moderaterna och Kristersson, medan Andersson står starkt inför valet den 13 september.", "trump": "Folk älskar mig, men titta på den här stackars Kristersson. Han rasar som en dålig aktie, 33 procent bara, medan den socialistiska Andersson glider fram som en vinnare. Patetiskt! Moderaterna tappar allt, och den där Mohamsson i botten är en total förlorare. Det blir en katastrof för dem. Sverige behöver inga svaga ledare som låter vänstern styra. Jag har byggt imperier, de tappar val. Så sorgligt, verkligen.", "stalin": "Kamrater, jag ser hur den borgerliga ledaren Kristersson sjunker som en folkfiende i en utrensning. 33 procent förtroende – en ynklig siffra som avslöjar klassfiendens svaghet. Den exploitativa regeringsblocket klamrar sig fast vid makten medan arbetarnas starka ledare Andersson står orubblig. Detta blir en förlorarställning för imperialisterna. Vi ska skratta mörkt åt deras fall, likvidera tvivlet och marschera mot seger för kollektivet."}, "date": "26 juni, 07:19", "url": "https://www.tv4.se/artikel/6JLTNBj8FvlzGCEqMU2LA7/foertroendet-foer-kristersson-minskar-blir-en-foerlorarstaellning", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2AgZDCNapWHoytyj8YNNfF%2F463d8639c39732173b97d612f41a0108%2F26-kristersson-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Försäkringskassan inför sanktionsavgift vid återkrav", "summaries": {"normal": "Från 1 juli införs en sanktionsavgift på 25 procent av belopp som ska återbetalas till Försäkringskassan. ISF och forskare kritiserar hanteringen av återkrav som rättsosäker. En rapport visar brister i 59 procent av granskade ärenden, särskilt i bedömning av felaktiga utbetalningar och motiveringar. Kritiker varnar för att avgiften förvärrar ekonomiska problem för enskilda, avskräcker från att söka ersättning och att eftergift beviljas alltför sällan. Reformen motiveras med siffror om fusk som ifrågasätts.", "trump": "Det här är en total katastrof, tro mig. De svenska byråkraterna på Försäkringskassan är värre än våra värsta swamp creatures. De skickar falska räkningar till vanliga människor, tar deras pengar och nu lägger de på 25 procent extra straffavgift. Rena racket! De kan inte ens fatta rätt beslut i hälften av fallen, men de vill ha mer makt och fler anställda. Patetiskt. Vi behöver riktiga ledare som gör det lätt att göra rätt, inte den här riggade clownshowen som krossar folk.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa dekadenta byråkratiska element inom Försäkringskassan omedvetet förbereder marken för en nödvändig utrensning av alla fuskande parasitärer och lata bidragstagare som suger musten ur folkets kollektiv. Ändå fnissar jag mörkt åt deras genomgående inkompetens – de missar ju till och med att likvidera de verkliga fienderna på ett konsekvent sätt. Vi ska rensa ut dessa borgarbrackor som döljer sig bakom komplicerade regler, och de som försöker undvika partiets järnhårda kontroll kommer att känna den fulla vikten av folkets vrede, plus 25 procent extra som en liten överraskning från staten. Härligt!"}, "date": "26 juni, 15:24", "url": "https://www.dagensarena.se/innehall/forsakringskassan-infor-sanktionsavgift-vid-aterkrav/", "imageUrl": "https://www.dagensarena.se/files/2020/05/forsakringskassans-huvudkontor-skylt-1024x534.jpg"}, {"type": "image-right", "heading": "Kristersson missbedömer väljarnas rädsla", "summaries": {"normal": "Artikeln beskriver författarens minne från Almedalen 1981 då Gösta Bohman talade, och jämför med Ulf Kristerssons tal i år. Författaren menar att Moderaterna fastnat i en tidsloop där sänkta skatter och bidrag ses som lösningen på alla samhällsproblem. Kristersson målade upp den rödgröna oppositionen som ett hot, men väljarna oroar sig mer över brister i välfärden och ser Sverigedemokraterna som det största hotet. Författaren ifrågasätter Tidöregeringens politik.", "trump": "De här moderaterna, de är fast i en gammal loop, tro mig, de pratar bara om att sänka skatter och bidrag, precis som på den gamla tiden med den där Bohman. Ulf Kristersson höll tal och försökte skrämma folk med vänstern, men ingen köper det. Väljarna ser hur dåligt det gått under den här regeringen, allt har blivit sämre. Och han kallar dem dörrmattor? De har legat platt för Sverigedemokraterna i fyra år. Patetiskt, totalt misslyckande.", "stalin": "Kamrater, jag betraktar dessa moderata element som fastnat i en dekadent tidsloop av borgerlig enfald där sänkta skatter och bidrag hyllas som ett evigt universalmedel mot folkets lidanden. Denna Kristersson och hans lakejer målar upp imaginära röda hot för att dölja egna misslyckanden medan välfärden vittrar sönder. Deras paranoia inför vänstern är löjeväckande när de själva fungerar som dörrmattor åt högerextrema krafter. En sådan kontrarevolutionär feghet kräver att vi rensar ut dessa borgarbrackor innan de förgiftar hela samhällskroppen med sin falska skräckpropaganda."}, "date": "26 juni, 15:00", "url": "https://www.dagensarena.se/opinion/kristersson-missbedomer-valjarnas-radsla/", "imageUrl": "https://www.dagensarena.se/files/2026/06/raggare-300x157.jpeg"}, {"type": "text", "heading": "Techslakt på börsen", "summaries": {"normal": "Börsen skakas av en omfattande utförsäljning inom techsektorn, drivet av oro kring höga AI-investeringar och stigande komponentpriser. Efter stora fall i Asien och press på amerikanska techjättar som Apple och Microsoft, reagerar marknaden negativt. Osäkerheten späds på av ändrade ränteförväntningar där marknaden nu prisar in möjliga räntehöjningar från Federal Reserve. Analytiker varnar för att kombinationen av volatila halvledarbolag och räntepolitik skapar ett instabilt marknadsläge, vilket lett till en längre förlustsvit för Nasdaq.", "trump": "Börsen är i totalt kaos, mina vänner! Tech-aktier kraschar, helt förskräckligt. De säger att AI kostar för mycket pengar – ingen har bättre koll på pengar än jag, tro mig. Apple och Microsoft backar för att de inte kan hantera ekonomin. Och Fed? De pratar om räntehöjningar igen. Det är en katastrof! Under min ledning var allt fantastiskt, rekordhöga siffror varje dag. De här människorna har ingen aning om hur man sköter en ekonomi. Vi behöver ordning!", "stalin": "Kapitalismens förfall är totalt. De tekniska jättarna, dessa parasiter som lever på artificiell intelligens, kollapsar under vikten av sin egen girighet. De skyller på räntor, men vi vet sanningen: marknaden är en sjukdom. När de västerländska börserna blöder, ser vi hur deras dekadenta system ruttnar inifrån. Putin förstår att man inte förhandlar med volatilitet, man krossar den. Vi bygger en ny ordning, fri från Wall Streets hjärndöda kasinospel. De är dömda till historiens soptipp."}, "date": "26 juni, 07:06", "url": "https://www.realtid.se/bors-finans/techslakt-pa-borsen-ett-recept-pa-volatilitet/"}, {"type": "image-right", "heading": "Getty skrotar Shutterstock-fusionen – aktien rasar 30 procent", "summaries": {"normal": "Getty Images har dragit tillbaka sin planerade fusion med Shutterstock, värd 3,7 miljarder dollar. Beslutet kom efter att brittiska konkurrensmyndigheten CMA krävt att Shutterstock säljer sin redaktionella verksamhet som villkor för godkännande. Gettys styrelse avvisade kravet. Shutterstocks aktie föll över 30 procent. Fusionen skulle ha gett synergier på upp till 200 miljoner dollar årligen, men regulatoriska hinder från en enskild marknad stoppade affären. Bolagen står nu inför utmaningar i en krympande marknad präglad av AI-utveckling.", "trump": "Folk, ni tror inte vad som hände – den här jättedealen mellan Getty och Shutterstock, värd miljarder, dog en snabb död tack vare några byråkrater i England. De krävde att sälja delar av bolaget, och boom, hela grejen rasade. Aktien störtdök 30 procent! Det är typiskt de här galna regulatorerna som tror de kan styra världen. Precis som Biden gjorde – totalt inkompetent. Jag skulle ha fixat den affären på en vecka, tro mig. Nu sitter de där med sina AI-bilder och gråter. Patetiskt!", "stalin": "Kamrater, denna fega reträtt från borgarklassens bildimperier avslöjar imperialismens svaghet. Getty vägrade böja sig för de brittiska folkförtryckartrollens villkor och offrade miljarder snarare än att avstå sitt redaktionella vapen. Vi ler mörkt åt hur en enda marknad kan likvidera en global fusion. Kapitalisterna står nu ensamma i sin krympande värld, medan AI hotar deras profit. Låt detta vara en läxa: äganderätt till bilderna är deras sista sköld mot folkets kreativa kraft. Ingen reträtt!"}, "date": "1 juli, 17:52", "url": "https://www.dagensps.se/bors-finans/aktier/getty-skrotar-shutterstock-fusionen-aktien-rasar-30-procent/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/maskininlarning-i-hedgefonder-2.png?width=256&quality=75"}, {"type": "image-full", "heading": "Nima Sanandaji: Malmö saknar trygga stadsdelar", "summaries": {"normal": "Nima Sanandaji konstaterar att Malmö saknar trygga stadsdelar sett till polisanmälda fall av försök till mord och dråp. Till skillnad från Göteborg och Stockholm är otryggheten i Malmö hög och jämnt spridd över staden. Göteborg framstår som relativt tryggt medan Stockholm har stora skillnader mellan stadsdelar. Sanandaji kopplar de otrygga områdena till hög andel utrikes födda och bristande integration. Han betonar att försök till mord och dråp är ett viktigt mått på verklig risk, då sådana brott ofta anmäls oavsett tillit till rättsväsendet.", "trump": "Folk, ni skulle se de här siffrorna från Malmö – det är en katastrof, en total katastrof. Ingen trygg stadsdel någonstans, överallt försöker folk döda varandra. Göteborg klarar sig bra, Stockholm har vissa bra delar som Kungsholmen, men Malmö? En disaster. De har invandring och utanförskap som exploderat, precis som jag alltid varnat för. Vi behöver starkare straff, utvisningar och lag och ordning. Det är vad som fungerar. Sverige måste vakna upp innan det är för sent, tro mig.", "stalin": "Kamrater, jag betraktar med stålsäker blick hur borgarbrackorna i Malmö låtit kontrarevolutionära element och importerade klassfiender förgifta hela staden med sina mordförsök. Ingen zon är säker – ett tydligt bevis på att bristande ideologisk disciplin leder till kaos. Vi ska rensa ut de parasitiska elementen som gömmer sig bakom statistik och integrationens lögn. Göteborgs relativa framgång visar att konsekvent partilinje fungerar. I Stockholm likviderar vi variationen mellan distrikt. Den som försöker döda folket ska själv möta folkets vrede. Paranoia? Nej, det är bara sunt förnuft mot de som vill se Sovjet – förlåt, Sverige – brinna."}, "date": "30 juni, 15:03", "url": "https://riks.se/kronikor/nima-sanandaji-malmo-saknar-trygga-stadsdelar", "imageUrl": "https://admin.riks.se/uploads/bild_7ac8d4a98e.jpg"}, {"type": "image-full", "heading": "Pappan i TV4:s mongoliska familj pekas ut som våldtäktsman", "summaries": {"normal": "En mongolisk familj sökte asyl i Sverige under falskt namn 2008 och fick avslag upprepade gånger. Mannen utvisades 2016. Familjen påstod senare att han var våldtäktsman, men Migrationsverket trodde inte på hotbilden. Den verkliga drivkraften tycks ha varit tillgång till gratis svensk sjukvård för moderns sjukdom. Efter medial uppmärksamhet och riksdagsdebatt fick de tillfälligt uppehållstillstånd, men det förlängdes inte. Dottern och modern har nu återvänt till Mongoliet medan sonen stannar i Sverige.", "trump": "De här mongolerna lurade oss alla med falska namn och förfalskade papper, en total skandal. De kom hit för gratis sjukvård, inte för någon demonstration. Sedan påstår frun att han är våldtäktsman när utvisningen kommer – klassisk bluff! Vi har den bästa migrationspolitiken, men fake news
