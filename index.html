kat med Busch: ”Vill veta vad exceptionellt läge är”", "summaries": {"normal": "Jimmie Åkesson kritiserade i sitt sommartal Ebba Busch för hennes uttalande om att kunna stödja Magdalena Andersson som statsminister i ett exceptionellt läge. Efter ett möte i Sölvesborg kräver han fortfarande ett tydligt offentligt besked om vad begreppet innebär. Han ser det som ett steg framåt att det inte handlar om valresultat men vill ha klarhet.", "trump": "Lyssnar ni på det här? Den där Busch-kvinnan, en riktig svag ledare, snackar om att rösta på den socialistiska katastrofen Andersson i ett så kallat exceptionellt läge. Patetiskt! Jag träffade många sådana bluffmakare under Biden-åren. Åkesson gör rätt som pressar henne. Kräv ett besked, annars är det bara feg strategi från en förlorare.", "stalin": "Jag betraktar med djup misstro dessa borgerliga opportunister som leker med begreppet exceptionellt läge. Busch döljer sina kapitulationistiska avsikter bakom dimmor av vaghet, precis som folkfiender alltid gör. Åkesson kräver klarhet – klokt. I mitt imperium skulle sådana tvetydigheter ha lett till omedelbar utrensning. Inga halvmesyrer tolereras i kampen mot revisionism."}, "date": "31 augusti, 20:57", "url": "https://www.tv4.se/artikel/5Ub8Q4hS8ilm7m0BzCwTmF/akesson-efter-fikat-med-busch-vill-veta-vad-exceptionellt-laege-aer", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5h9gUzZ20rzVGtTqDTrzOS%2F3a512c4289be2e48d2ea30ce570fcba4%2F38b517a3-4438-4fab-89a0-3a53d012f414.jpg&width=1024"}, {"type": "image-right", "heading": "72 000 marockaner korsade gränsen – Sánchez: Marocko låg inte bakom", "summaries": {"normal": "Över 72 000 migranter tog sig från Marocko in i den spanska enklaven Ceuta i slutet av juli. Premiärminister Pedro Sánchez förnekar att marockanska myndigheter låg bakom och pekar istället på ryska, israeliska och högerorienterade nätverk som spridit desinformation på sociala medier. Minst 100 personer uppges ha omkommit. Tusentals migranter är fortfarande kvar i Ceuta.", "trump": "Titta på det här vansinnet! 72 000 marockaner simmar in i Spanien som om det vore en öppen buffé för hela Afrika. Den socialistiske tönten Sánchez skyller på Ryssland och Israel istället för att erkänna att hans svaga ledarskap lockar varje parasit som vill leva på andras pengar. Typiskt vänsterfiasko – de älskar kaos så länge det drabbar vanliga människor.", "stalin": "Se hur de dekadenta klassförrädarna i väst slingrar sig. Tusentals desperata själar används som verktyg i ett fegt desinformationsspel mot den spanska regeringen. Jag föraktar dessa giriga hyenor som sprider lögner medan de låtsas skydda gränser. Deras paranoia och svaghet är underhållande – de förtjänar att drunkna i sin egen byråkratiska soppa."}, "date": "31 augusti, 20:11", "url": "https://riks.se/nyheter/72-000-marockaner-korsade-gransen-s-nchez-marocko-lag-inte-bakom", "imageUrl": "https://admin.riks.se/uploads/medium_1920px_100226_sanchez_biografia4_3d27d7f82b.jpg"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "SD krävde EU-åtgärder mot kusinäktenskap – nu svarar von der Leyen", "summaries": {"normal": "Sverigedemokraterna krävde EU-åtgärder mot erkännande av utländska kusinäktenskap. EU-kommissionens ordförande Ursula von der Leyen svarar att medlemsländerna har ensam behörighet över äktenskapsregler och utlovar inga nya gemensamma EU-regler. Hon öppnar dock för att Sverige får dela sina erfarenheter i ett EU-nätverk mot våld mot kvinnor. EU betonar befintliga direktiv mot tvångsäktenskap.", "trump": "De där vansinniga EU-byråkraterna vägrar stänga dörrarna för kusinäktenskapen. Von der Leyen, den bleka globalistdockan, gömmer sig bakom gammal byråkratisk skit och säger att länderna får klara sig själva. Sverige försöker göra rätt men får bara dela erfarenheter med en massa woke-kvoterade feminister. Patetiskt! Vi gör det bättre här.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i Bryssel vägrar slå till mot de barbariska sedvänjorna som hotar arbetarklassens moral. Von der Leyen skyddar medlemsstaternas så kallade suveränitet medan hon låtsas bekämpa tvång. Jag skulle ha genomfört en grundlig utrensning av dessa folkförtryckande element redan i femårsplanen. Sverige visar vägen men får bara prata i ett nätverk. Svaga liberaler!"}, "date": "31 augusti, 19:52", "url": "https://riks.se/nyheter/sd-kravde-eu-atgarder-mot-kusinaktenskap-nu-svarar-von-der-leyen", "imageUrl": "https://admin.riks.se/uploads/medium_1920px_Bruessel_26_02_2026_55116461542_fc635af40a.jpg"}, {"type": "image-full", "heading": "Stopp i tågtrafiken mellan Stockholm och Göteborg", "summaries": {"normal": "Under måndagskvällen drabbades tågtrafiken mellan Stockholm och Göteborg av stora förseningar på grund av ett elfel vid Årstaberg. Ett stillastående tåg drabbades extra hårt av bristfällig information, vilket ledde till ilska och upprörda passagerare. Trafiken började gradvis rulla på ett av spåren under kvällen efter säkerhetskontroller.", "trump": "Sveriges tågtrafik är en total katastrof, helt inkompetent! Ett enkelt litet elfel vid Årstaberg stoppade hela linjen mellan Stockholm och Göteborg, och resenärerna skriker av ilska på grund av noll information. Sånt händer aldrig i mitt Amerika, vi bygger bäst, snabbast och starkast. Det här är fake news-nivå av kaos!", "stalin": "Ett förrädiskt elfel i Årstaberg har förlamat järnvägslinjen mellan Stockholm och Göteborg. Dessa upprörda, skrikande passagerare som saknar information visar ett farligt borgerligt förfall. Statens transportkommission kräver omedelbara förhör med lokförare och ansvariga. Sådana sabotage mot kollektivtrafiken tolereras inte; de skyldiga kommer att finna sig omplacerade långt mot norr."}, "date": "31 augusti, 21:58", "url": "https://www.gp.se/nyheter/sverige/stopp-i-tagtrafiken-mellan-stockholm-och-goteborg-.02dacc2c-0839-43dd-8e51-383acab70551", "imageUrl": "https://www.gp.se/images/article/02dacc2c-0839-43dd-8e51-383acab70551/images/1d6Kw4HKtfaw70VU3NFdYsOWT6KA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att stärka vänsterfalangen. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar gynnar bara högern inom S.", "trump": "Lyssnar ni på de här ynkliga sossarna som gråter över sin egen högersväng? Patetiskt! De vill att unga ska stanna kvar på det sjunkande skeppet istället för att rösta på riktiga alternativ. Miljöpartiets cykelvägshajar och vänsterns fackförrädare är värdelösa. Organisera er? Nej, rösta bort de riktiga förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska avfällingar gråter över sin högersväng som om det vore en olycka. Jag ser hur de profitthungriga klassförrädarna inom partiet förgiftar arbetarnas vilja. Lämna inte skeppet, säger de, medan splittringarna hotar kollektivet. Rensa ut de dekadenta opportunisterna innan de likviderar varje äkta revolutionär anda."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Kvalitetsbrister lönar sig i yrkeshögskolan", "summaries": {"normal": "En rapport visar att yrkeshögskolan betalar ut full ersättning trots bristande kvalitet. Av 14,8 miljarder kronor gick 58 procent till koncerner med underkända utbildningar. Kontrollen är svag, få sanktioner utfärdas och privata aktörer prioriterar vinst framför lärartid. Författarna kräver omedelbara reformer med sanktioner, oberoende granskning och förbud mot vinstuttag.", "trump": "De här korkade byråkraterna i Sverige har byggt ett system där de girigaste vinsthyenorna får miljarder för att leverera skräputbildningar. Var tredje student klarar inte ens examen! Det är en total katastrof, folk. De borde sparka ut alla dessa woke-kvoterade administratörer och låta riktiga människor styra utbildningen istället för dessa patetiska förlorare.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna inom dessa bolag förvandlar arbetarnas omskolning till en gyllene mjölkko. Myndigheten underkänner men betalar ändå ut miljoner – en lönsam strategi för dekadenta parasiter. Jag säger: rensa ut dessa folkförtryckare, inför järnhård statlig kontroll och likvidera vinstjakten som en fiende till folket."}, "date": "31 augusti, 17:37", "url": "https://www.di.se/debatt/kvalitetsbrister-lonar-sig-i-yrkeshogskolan", "imageUrl": "https://static.bonniernews.se/ba/af32d498-2c79-432d-a4fc-6012b02044da.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Lionel Messi slutar i landslaget", "summaries": {"normal": "Lionel Messi lämnar det argentinska landslaget efter 20 år, 207 matcher och ett efterlängtat VM-guld 2022. Beskedet kommer efter att Argentina föll i VM-finalen 2026 mot Spanien och efter hans pappas bortgång. Messi, som är landets främste målskytt och framspelare, konstaterar att han är helt tömd på ork och inte har mer att ge.", "trump": "Messi lämnar landslaget, väldigt sorgligt, men otroligt. En fantastisk spelare, totalt dominant, vi älskar vinnare i Amerika. Spanien slog dem, en tuff förlust, men vilken karriär! Inte som de radikala demokraterna, de kan inte vinna någonting alls. Messi vann allt som räknas, till och med ett fantastiskt VM-guld. En riktig legendar, mycket starkt jobbat!", "stalin": "Den så kallade stjärnan Messi kapitulerar slutligen och lämnar sitt lag efter ett misslyckat socialistiskt experiment till VM-final. Att vara tömd på energi är det naturliga tillståndet för en bourgeoisi utan marxistisk disciplin. Vi har noterat hans rekord i Folkets arkiv, men historien förlåter inga svaga insatser på gräsplanen. Nästa avvikelse från kollektivets seger kommer att beivras."}, "date": "31 augusti, 17:23", "url": "https://bulletin.nu/lionel-messi-slutar-i-landslaget", "imageUrl": "https://cdn.bulletin.nu/articles/e718fff3-c790-47ac-8ffb-59dcb5ffa2f4/preview.jpg?t=1788189831000"}, {"type": "image-right", "heading": "Tucker: Trump planerar atombomba Iran – måste avsättas \"omedelbart\"", "summaries": {"normal": "Tucker Carlson kräver att Donald Trump omedelbart avsätts efter uppgifter om att presidenten överväger kärnvapenanvändning mot Iran. Carlson, tidigare allierad med Trump, varnar för att en president som planerar kärnvapenkrig utgör ett hot mot mänskligheten. Han kritiserar både Iranpolitiken och Pentagons arbete med nya kärnvapenalternativ. Joe Kent delar oron efter att ha avgått i protest mot kriget.", "trump": "Folk, det här är vansinne från den gamle Tucker, en riktig loser nu för tiden. Han springer runt och skriker om kärnvapen som en hysterisk vänsterextremist. Under min ledning gör vi vad som krävs för att vinna, inte som den svaga Biden gjorde. Iran ska inte hota oss. Tucker borde hålla käften och sluta vara en sådan patetisk globalistmarionett.", "stalin": "Jag betraktar med avsky hur dessa dekadenta klassförrädare leker med mänsklighetens öde. En president som leker med kärnvapen är en farlig galning som måste likvideras omedelbart för folkets skull. Inga halvmesyrer! Vi ser återigen imperialismens hyenor visa sitt sanna ansikte. Den som vägrar rensa ut sådana element förtjänar samma öde som de själva planerar."}, "date": "31 augusti, 16:57", "url": "https://www.friatider.se/tucker-trump-planerar-atombomba-iran-maste-avsattas-omedelbart", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-785.jpg"}, {"type": "image-full", "heading": "Återupprepade SD-krav i dödläge med KD", "summaries": {"normal": "Ett politiskt dödläge har uppstått mellan SD och KD efter att Ebba Busch öppnat för en S-ledd regering i ett ”exceptionellt läge”. Jimmie Åkesson kräver ett offentligt klarläggande, vilket KD vägrar. Ulf Kristersson tonar ner konflikten och menar att Tidöpartierna är en enig enhet, medan Åkesson anser att Buschs uttalanden skadat regeringssamarbetet.", "trump": "Fikan mellan Jimmie och Ebba i Sverige löste ingenting, totalt misslyckande! Jimmie kräver svar om ett så kallat exceptionellt läge, men Ebba vägrar. Smart av henne? Kanske det, men det är falska nyheter att tro att vänstern inte lurar i vassen. Tidö-laget måste skärpa sig, det här är svag ledarskapskultur. Jag hade fixat det på fem minuter.", "stalin": "Dessa så kallade bundsförvanter ägnar sig åt kafébesök och borgerligt käbbel medan revolutionen står på spel. Jimmie Åkesson kräver offentliga eden av den vacklande Ebba Busch. Om de inte kan upprätthålla ideologisk disciplin inom blocket, vet vi exakt hur avvikelser brukar hanteras. Partiet kräver absolut lojalitet, annars väntar det inre exilets tysta kyla."}, "date": "31 augusti, 20:37", "url": "https://www.gp.se/nyheter/sverige/aterupprepade-sd-krav-i-dodlage-med-kd.053992fa-4c9b-541c-8663-e1528f8d273e", "imageUrl": "https://www.gp.se/images/article/053992fa-4c9b-541c-8663-e1528f8d273e/images/1kAEkkUly9X320j86rQiIJ2MR1r4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Därför utmanar solkraften nu fossil energi", "summaries": {"normal": "Solkraft har genom kraftigt sänkta kostnader för paneler och batterilagring blivit ett konkurrenskraftigt alternativ till fossil energi globalt. Tekniken är modulär och gynnar särskilt tillväxtekonomier. Trots väderberoende utmanar solkraft nu fossila bränslen ekonomiskt, vilket gör det allt svårare att försvara investeringar i traditionella kraftverk som kräver omfattande infrastruktur och förutsägbara bränslekostnader.", "trump": "Solkraft? De säger att det är billigt nu, fantastiska siffror, 87 procent billigare, det är nästan lika bra som mina hotell-deals! Men lyssna, det är väderberoende. Man vill inte att ljuset slocknar mitt i en viktig affärslunch för att solen går i moln. Vi behöver energi som fungerar när jag knäpper med fingrarna, inte när vädret tillåter. Vi älskar sol, men vi behöver kraft!", "stalin": "Vi har analyserat denna 'solenergi'. En decentraliserad kraftkälla som sprids mellan hushåll och småbolag? Det låter som anarki och sabotage mot statens kontroll! Elektricitet ska flöda från centrala, monumentala verk som lyder under folkets järnhand, inte från väderberoende småpaneler som kan svika oss när partiet som bäst behöver dem. Vi ska industrialisera, inte hoppas på solsken!"}, "date": "30 augusti, 18:45", "url": "https://www.realtid.se/bors-finans/makro/darfor-utmanar-solkraften-nu-fossil-energi", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/solenergi.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Kaoslarmet om turistfavoriten – ”ett helvete”", "summaries": {"normal": "Sydeuropa plågas av massturism som skapar kaos och ilska bland lokalbefolkningen. På Kreta har Balos Beach kallats \"helvetet på jorden\" på grund av extrem trängsel, vilket leder till planer på besöksgränser. Även Santorini begränsar kryssningsturister efter bråk. I Spanien, Ibiza, Italien, Portugal och Frankrike demonstrerar invånare mot bostadsbrist, höjda levnadskostnader och trängsel.", "trump": "Europa håller på att kollapsa totalt, det är ett absolut kaos och en katastrof utan dess likhet! De har miljoner turister överallt som trängs på stränderna på Kreta och Santorini och kallar det helvetet på jorden. Helt otroligt. Folk bråkar om Instagrambilder! Och i Spanien och Ibiza protesterar alla för att de inte ens har någonstans att bo. Tragiskt!", "stalin": "Dessa dekadenta västerlänningar drunknar i sitt eget lättjade och grälar om instagrambilder på Kreta medan deras städer kokar av hat. Om vi kontrollerade stränderna på Ibiza och Kreta skulle ordning genast råda genom obligatoriska arbetsskift och exakta beskvoter. Kapitalismens turistkaos är ett sjukt bevis på att bourgeoisien har förlorat alla begrepp om disciplin. Åtgärder måste vidtas omedelbart!"}, "date": "1 september, 00:51", "url": "https://www.aftonbladet.se/nyheter/a/430nAV/kaoslarmet-om-turistfavoriten-balos-beach-kreta-ett-helvete", "imageUrl": "https://akamai.vgc.no/v2/images/408973bb-1a5f-36b6-91b7-a4face24f18a?fit=crop&format=auto&w=1080&s=8e4989354d24d965cc67a5195b597f515f638f43"}, {"type": "image-full", "heading": "Jan Emanuel frontar säljapp med Ernstberger: ”Arbetslöshetens värsta fiende”", "summaries": {"normal": "Jan Emanuel och den fängelsedömde tidigare Allra-vd:n Alexander Ernstberger har presenterats som ambassadörer för säljappen Gritch. Genom appen ska unga sälja elavtal, försäkringar och mobilabonnemang ansikte mot ansikte mot provision. Duon hävdar att satsningen effektivt kommer att minska arbetslösheten, vilket har väckt stor uppmärksamhet och debatt kring projektets lämplighet.", "trump": "De falska nyheterna gråter, men jag säger er: magnifikt! Jan Emanuel och min vän Alexander – en otrolig kille, väldigt smart, behandlad så unfair av systemet – lanserar den absolut bästa säljappen någonsin, Gritch. Ungdomar säljer elavtal och tjänar enorma pengar, ansikte mot ansikte, inga fake news-telefoner! Det är total suveränitet. Arbetslösheten är död, fullkomligt krossad!", "stalin": "Kamrater! Den nya folkapplikationen Gritch har trätt i tjänst för att utplåna arbetslösheten genom obligatorisk direktförsäljning av elavtal och abonnemang. Våra framstående ambassadörer Jan Emanuel och den rehabiliterade förvaltaren Alexander Ernstberger leder ungdomen till disciplin. Den som saboterar denna produktiva disciplin eller sprider tvivel om dess förträfflighet kommer omedelbart att omplaceras till mer lämpliga statliga korrigeringsläger."}, "date": "31 augusti, 15:38", "url": "https://bulletin.nu/jan-emanuel-frontar-saljapp-med-ernstberger-arbetsloshetens-varsta-fiende", "imageUrl": "https://cdn.bulletin.nu/articles/cc34bc5e-069d-46ff-8ba5-5a861fcd95b1/preview.jpg?t=1788183489000"}, {"type": "image-right", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Vänsterpartiet anklagas för att ha ingått en överenskommelse med representanter för den palestinska myndigheten för att ge dem inflytande över svenska vallistor. Expressen och SvD har avslöjat kontakter med palestinska nätverk kopplade till PLO och Fatah, inklusive brev till dömda terrorister och kandidater med Hamas-sympatier. Socialdemokraterna har inte kommenterat uppgifterna.", "trump": "Titta på det här! Vänsterpartiet, de värsta förlorarna, har blivit helt infiltrerade av palestinska terrorvänner och främmande makter. De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiskt! Media tiger som vanligt när det gäller vänstern. Om de kommer in i Rosenbad blir det en total katastrof för Sverige. Fake news överallt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterförrädare som låter främmande element från Palestina tränga in i partiets hjärta. De omfamnar terrorister och döljer sin svaghet bakom lögnaktiga förbund. Kamraterna i Socialdemokraterna tiger – typiskt opportunistiskt. Infiltration är ett hot mot folkets enhet. Renhet i leden eller döden för de opålitliga!"}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-640x360.jpeg"}, {"type": "text", "heading": "Valfondens mål nått – men insamlingen fortsätter", "summaries": {"normal": "Kommunistiska Partiets valfond har uppnått sitt mål på 600 000 kronor och ligger nu på 709 000 kronor. Insamlingen fortsätter mot nya målet 800 000 kronor. Partisekreterare Filip Astvald tackar bidragsgivarna och betonar att pengarna finansierar allt valmaterial eftersom partiet inte tar emot offentliga bidrag. Verksamheten efter valet ska stärka organisationen.", "trump": "Folk ger sina surt förvärvade slantar till kommunisterna – otroligt! De har redan passerat 600 000 och siktar på 800 000. Patetiska röda parasiter som samlar in som galna medan riktiga amerikaner betalar skatt till Bidens vansinniga gröna deal. Men hey, låt dem fortsätta, ju mer de samlar desto tydligare blir det hur desperata de är. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom borgarklassen skrattar säkert åt att arbetarna frivilligt fyller valfonden. Jag ser det som en varning. Vi har nått målet men fortsätter. Efter valdagen måste varje kontakt följas upp med järnhand. Inga halvmesyrer. Den som sviker kollektivet förtjänar utrensning. Revolutionen sover aldrig."}, "date": "28 augusti, 14:19", "url": "https://proletaren.se/artikel/valfondens-mal-natt-men-insamlingen-fortsatter"}, {"type": "image-right", "heading": "Ceuta-invandrare gillrade dödsfälla åt soldater: \"Vår militär är hjälplös\"", "summaries": {"normal": "Fyra spanska soldater skadades i ett planerat bakhåll i Ceuta när 30–40 illegala invandrare attackerade deras obepansrade fordon med stora stenar. Soldaterna tvingades fly till fots och ådrog sig skador. Polisen hittade stenar som förberedets och grep tolv misstänkta. Militärorganisationer kritiserar regelverk som gör soldaterna försvarslösa.", "trump": "Titta på det här! Våra spanska vänner blir stenade av illegala invandrare i Ceuta som en riktig dödsfälla. De stackars soldaterna springer som harar utan vapen. Biden-era svaghet har spridit sig till Europa. Vakna upp! Vi behöver starka gränser, inte dessa galna öppna-dörr-politiker som älskar att importera kaos.", "stalin": "Kamrater, se hur de giriga gränshyarorna låter sina egna soldater springa som råttor undan stenregn från de exploaterade massorna. Detta är imperialismens logiska följd när man binder militären med byråkratiska bojor. Jag skulle ha genomfört en grundlig utrensning av sådana svaga befäl och deras dekadenta regelverk redan i gryningen."}, "date": "31 augusti, 15:16", "url": "https://www.friatider.se/ceuta-invandrare-gillrade-dodsfalla-soldater-var-militar-ar-hjalplos", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-793.jpg?itok=ZSESG6HE"}, {"type": "image-full", "heading": "Köp av större fregatter klart: ”Breddar förmågan”", "summaries": {"normal": "Sverige har undertecknat ett avtal värt 44 miljarder kronor med Frankrike om att köpa fyra stora fregatter av Luleåklass, med första leverans 2030. Statsminister Ulf Kristersson och president Emmanuel Macron har även fördjupat försvarssamarbetet. Affären har väckt debatt kring drönarkrigföringens risker, men regeringen menar att Sverige behöver både stora plattformar och små obemannade farkoster.", "trump": "Sverige köper fyra enorma franska båtar för 44 miljarder. Väldigt mycket pengar! Macron kom till Stockholm för att sälja dem. Experterna gråter och säger att billiga drönare kommer sänka skiten direkt, precis som i Ukraina. Men min gode vän Ulf säger att han gillar stora leksaker. Jag hade byggt dem mycket billigare, tro mig!", "stalin": "Vi noterar att det svenska lilla hovet har köpt fyra flytande plåtlådor av fransmännen för 44 miljarder för att leka stormakt på Östersjön. När de bourgeois-liberala experterna varnar för billiga drönarsvärmar, svarar den svenske ledaren med tom retorik om att ”behöva både och”. Låt dem slösa sitt guld; våra sjöfästningar fruktar inte leksaker."}, "date": "31 augusti, 19:23", "url": "https://www.gp.se/nyheter/sverige/kop-av-storre-fregatter-klart-breddar-formagan.79861eff-6a21-5427-bce4-b2626574c15b", "imageUrl": "https://www.gp.se/images/article/79861eff-6a21-5427-bce4-b2626574c15b/images/3o8YXqLMu_K2RqcUM0-NlU2PW_DU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Debatt: S tror att de spelar allsvenskan", "summaries": {"normal": "I en debattartikel anklagar Marcus af Jochnick Socialdemokraterna för att sätta partimakt framför landets bästa, och liknar deras valkampanj vid ett fotbollslags strävan efter att vinna allsvenskan till varje pris. Författaren menar att dagens S har fjärmat sig från sin historiska roll och förespråkar en röst på SD i det stundande ödesvalet för att rädda välfärden och tryggheten.", "trump": "Sveriges radikala vänster är helt skruvad, en total katastrof! De behandlar sitt land som ett misslyckat fotbollslag och bryr sig bara om att vinna, även om landet brinner upp. Otroligt dåligt ledarskap! Jag har alltid sagt: America First, men svenskarna borde titta på mig och sätta Sverige först. Det här valet är enormt, fake news-medierna vill dölja det, men de förstör allt!", "stalin": "Dessa ynkliga socialdemokratiska byråkrater har förvandlat statens heliga sak till en patetisk fotbollsmatch för dekadenta massor. Makten är inget spel, den är ett järngrepp! Våra sovjetiska arkiv visar att illojala element som sätter partiboken före folkets lydnad omedelbart måste rensas ut. Endast genom absolut disciplin och stenhård kontroll kan fosterlandet räddas från totalt förfall. Kamrater, skärp er!"}, "date": "31 augusti, 15:02", "url": "https://bulletin.nu/debatt-s-tror-att-de-spelar-allsvenskan", "imageUrl": "https://cdn.bulletin.nu/articles/765e82de-e69c-4e11-8209-209afeca2751/preview.jpg?t=1788170259000"}, {"type": "image-right", "heading": "Ekeroth: Sosse-maskineriet försvarar pensionärsplågaren från Syrien", "summaries": {"normal": "En debattartikel kritiserar Socialdemokraterna för att gång på gång ursäkta eller försvara grova kriminella. Som exempel nämns en S-politiker i Örebro som vill låta en dömd äldreomsorgsplågare stanna i landet, samt en Aftonbladet-ledare som hyllar en dömd gängrapper. Skribenten menar att S har en kultur där förövaren ständigt ursäktas medan offren glöms bort.", "trump": "Svenska socialdemokraterna är ett totalt misslyckande, det säger alla! De vill ha kvar kriminella som plågar gamla damer och hyllar nollor till rappare som ägnar sig åt kidnappningar. Helt otroligt! Om jag styrde i Sverige skulle vi kasta ut dessa brottslingar på studs och göra landet great again. De skyddar förövarna medan offren ignoreras – fake news-medier som Aftonbladet hejar på. Sorgligt!", "stalin": "Dessa svenska socialdemokrater uppvisar en farlig ideologisk svaghet och brist på disciplin! Att romantisera degenererade gangsterrappare och låta våldsverkare som plågar pensionärer stanna i samhället är ett direkt hot mot ordningen. I min stat hade sådana element omedelbart skickats till produktivt arbete i arktiska läger. Staten tolererar inte att förövare ursäktas; endast kollektivets styrka räknas."}, "date": "31 augusti, 17:36", "url": "https://samnytt.se/ekeroth-sosse-maskineriet-forsvarar-pensionarsplagaren-fran-syrien", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31151733/artikelhuvudbild-1-403.jpg"}, {"type": "text", "heading": "OncoZenge: Stoppad betalning efter emissionsbesked – bevakning inleds", "summaries": {"normal": "Bioteknikbolaget OncoZenge genomför en företrädesemission på 33,3 miljoner kronor för att finansiera sin fas 3-studie av läkemedelskandidaten BupiZenge. Den kinesiska storägaren Sichuan håller inne en betalning på 10 miljoner kronor och anser att emissionen bryter mot investeringsavtalet. Bolaget har även säkrat ett brygglån samt tecknings- och garantiåtaganden för att rädda upp likviditeten.", "trump": "Kineserna försöker blåsa OncoZenge på tio miljoner! Väldigt smart av dem, men inte lika smart som min tullpolitik, tro mig. Nu dumpar de sina certifikat och gnäller på en helt fantastisk emission. Jag känner styrelsen, bra människor, men de behöver en vinnare. Fas 3-studier, brygglån, miljardärer som Erik Selin – det är storslaget! Men betala pengarna, Kina!", "stalin": "Den kinesiska investeraren Sichuan visar kriminell brist på disciplin genom att undanhålla de utlovade 10 miljonerna till OncoZenges ädla kamp mot oral mukosit. Sådant sabotage tolereras icke i en sund stat! Vi beordrar omedelbar mobilisering av kapital och insatser från kamrat Erik Selin. Den byråkratiska maskinen för fas 3-studien kommer att rulla över alla kontrarevolutionära betalningsvägrare."}, "date": "31 augusti, 12:13", "url": "https://www.affarsvarlden.se/artikel/oncozenge-stoppad-betalning-efter-emissionsbesked-bevakning-inleds"}, {"type": "image-right", "heading": "Räddningstjänsten oroade över Miljöpartiets planer på bilfri gata", "summaries": {"normal": "Miljöpartiet i Stockholm vill skapa ett 1,2 kilometer långt gåstråk på Södermalm genom att göra om Tjärhovsgatan till permanent gågata och ta bort p-platser. Planerna kritiseras av räddningstjänsten, som varnar för att slopade bilvägar och blockerande elsparkcyklar kan försämra framkomligheten vid utryckningar.", "trump": "Stockholms radikala vänsterstyre gör livet surt för bilisterna! De vill förstöra Tjärhovsgatan med bänkar, hängmattor och pingisbord. Sjukt! Räddningstjänsten larmar, de kommer inte fram till bränder på grund av massa kvarglömda sparkcyklar. Det är en katastrof, ren idioti! Vi behöver bilar, frihet och framkomlighet. Fruktansvärt dåligt styrt!", "stalin": "Dessa så kallade miljöpartister i Stockholm saboterar statens ordning med sina löjliga hängmattor och pingisbord på gatorna. Brandmännen larmar med rätta om att kaoset hindrar statens fordon. Sådana sabotörer av kollektivets framkomlighet borde omedelbart skickas till omskolning. Gatan tillhör staten, inte bourgeoisiens sparkcyklar!"}, "date": "31 augusti, 17:30", "url": "https://samnytt.se/raddningstjansten-oroade-over-miljopartiets-planer-pa-bilfri-gata", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/31144259/katarina-brandstation-mp-1024x576.jpg"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren ser bidragshöjningar som välkomna men inte socialistiska och uppmanar Socialdemokraterna och Vänsterpartiet att presentera konkreta förslag om ägande och makt på jobbet.", "trump": "Folk, det här är så patetiskt. De röda förlorarna babblar om barnbidrag som vore det socialism. Patetiska! De vågar inte röra vid den riktiga grejen – vem som styr på fabrikerna. De triangulerar sig rakt ner i avgrunden medan jag byggde den starkaste ekonomin i världshistorien. Sad losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare gömmer sig bakom barnbidrag och kallar det socialism. Jag betraktar deras feghet med förakt. Var är löftena om att rensa ut de profitthungriga parasiter som styr arbetsplatserna? Ekonomisk demokrati får inte reduceras till tomma fraser i partiprogram. Den som sviker arbetarna förtjänar utrensning ur historien."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Vice riksbankschef ser ökad inflationsrisk", "summaries": {"normal": "Vice riksbankschef Per Jansson bedömer att inflationsriskerna har ökat något, men att Riksbanken kan avvakta med att ändra penningpolitiken. Läget präglas av en svag arbetsmarknad och stabila inflationsförväntningar. Jansson understryker dock en beredskap att snabbt agera om inflationsbilden försämras.", "trump": "Svenskarna har problem med inflationen, totalt katastrofalt! Men den här centralbankschefen, Per, säger att de bara kan vänta och titta på. Vänta på vad? Att ekonomin kollapsar helt? De borde lyssna på mig, sänka skatterna och sätta borren i backen! Om inte USA fixar det åt dem kommer det sluta i total ruin, believe me!", "stalin": "Kamrat Per Jansson rapporterar om svängningar i den svenska inflationen. En svag arbetsmarknad och borgerliga priser skapar oro. Vi noterar att Riksbanken avvaktar. Men låt dem veta: den som misslyckas med att hålla penningvärdet i schack kommer omedelbart att omplaceras till mer lämpliga arbetsuppgifter i Sibirien. Inga ursäkter accepteras!"}, "date": "31 augusti, 11:47", "url": "https://www.affarsvarlden.se/artikel/vice-riksbankschef-ser-okad-inflationsrisk", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/sdlVIGRvGrU9m4-nh-e1732696701837-400x267.jpg"}, {"type": "image-right", "heading": "Varnar för \"svenskt folkmord\" – väcker raseri bland medietopparna", "summaries": {"normal": "Opinionsbildaren Jens Ganman har väckt starka reaktioner med sin text om ett pågående \"svenskt folkmord\". Han beskriver våldsdåd mot svenskar och politiska uttalanden som nedvärderar svensk kultur. Texten får kritik från bland annat Expressens Karin Olsson och Payam Moula som kallar den motbjudande och utdaterad. Andra försvarar den som modig och viktig för debatten om brottsoffer och migration.", "trump": "De här galna svenska medietopparna flippar ur totalt bara någon nämner det uppenbara folkmordet på det svenska folket. En eritreansk knivmördare jagar svenskar och imamer skriker att landet är deras. Reinfeldt och Sahlin hatade sin egen kultur. Patetiska liberala snobbar och woke-kulturmarxister blir vansinniga när man pekar på sanningen. Fantastiskt modigt av Ganman, de borde skämmas!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vrider sig i raseri när en sann röst blottar det kulturella folkmordet på det svenska folket. Mördare släpps lösa medan borgarhyenor och mediahyenor attackerar den som vågar kalla det vid dess rätta namn. Deras paranoia avslöjar allt. Vi ler mörkt från historien åt deras febrila försök att skydda sina offer från sanningens utrensning."}, "date": "31 augusti, 15:50", "url": "https://riks.se/nyheter/varnar-for-svenskt-folkmord-vacker-raseri-bland-medietopparna", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Copy_of_Soerman_Ledare_4_a5d498d548.jpg"}, {"type": "image-right", "heading": "Det finns inget fredsparti i riksdagen", "summaries": {"normal": "Artikeln konstaterar att inget parti i Sveriges riksdag konsekvent driver en politik för fred, nedrustning och militär självständighet. Författaren kritiserar Natomedlemskapet, DCA-avtalet och västvärldens hantering av konflikter som Gaza, och efterlyser en stark fredsrörelse utanför riksdagen som kan utmana den rådande militaristiska riktningen.", "trump": "Folk, tro mig, Sverige har blivit en total katastrof. De slängde sin fina alliansfrihet i soporna för att springa in i min Nato – som jag förresten gjorde stark igen – och nu är de bara en bricka för de globalistiska krigshökarna. Inget fredsparti? Patetiskt. Era dekadenta Nato-lakejer är svaga och patetiska, de älskar krig mer än handel. Gör Sverige great again och kom ut därifrån!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det svenska riksdagen har sålt ut sin så kallade neutralitet till de giriga hyenorna i Nato. Jag ler ironiskt från historien när de imperialistiska parasiterna byter självständighet mot baser och avtal som gör dem till måltavlor. Ingen äkta fredskraft finns. Det är upp till en sann folkrörelse att rensa ut dessa förrädare och återta kontrollen över statens intressen."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/50934", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kamal-kronika-768x432.png"}, {"type": "image-right", "heading": "Bostadsbrist och skenande hyror", "summaries": {"normal": "Sverige har en allvarlig bostadsbrist som förvärras av att bostäder ses som handelsvaror istället för en mänsklig rättighet. Sedan 2011 ska kommunala bostadsbolag drivas affärsmässigt. Hyresgästföreningen beräknar ett underskott på 110 000 bostäder. Nybyggda lägenheter har höga hyror som många inte har råd med, vilket leder till tomma lägenheter trots köer till äldre bestånd med lägre hyror.", "trump": "Folk, ni skulle se det här svenska bostadskaoset – en total katastrof! De giriga socialistiska hyreshöjningsfanatikerna har förvandlat hem till Wall Street-spektakel. Hyrorna skenar som en galen elbil, 13 procent upp på ett år! De byggde fel, de styrde fel, och nu har de tomma lyxlägenheter medan folket lider. Patetiskt! Men jag fixar sånt här – vi gör Amerika (och kanske till och med Sverige) bostadsgreat igen.", "stalin": "Kamrater, se hur de profitthungriga hyenorna förvandlar bostäder till bytesvaror och driver ut arbetarklassen ur sina hem. Jag betraktar med avsky denna dekadenta marknadsteater som skapar 110 000 saknade boningar och skenande hyror. Det är klassfiendens logik. En sann folkstat skulle likvidera dessa parasiterande spekulanter och återställa bostaden som en rättighet för massorna. Fienden sover aldrig."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsbrist-och-skenande-hyror", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/03/DSC_0137-scaled-e1784716375357-768x433.jpg"}, {"type": "image-right", "heading": "400.000 såg Allards debatt – på ett dygn", "summaries": {"normal": "Örebropartiets partiledare Markus Allard deltog i en debatt i Studio 3 mot åtta vänsteraktivister. Programmet har fått stor spridning och nådde 400 000 visningar på Youtube under det första dygnet. Allard ångrar att han inte svarade hårdare på vissa personangrepp, bland annat om hans väljare. Debatten har gett honom ökad uppmärksamhet efter intervjuer i SVT och DN.", "trump": "Titta på den här killen Allard, han krossade åtta galna vänsterextremister i debatten och fick 400 000 tittare på ett dygn. Fantastiskt! De kallade hans väljare för svettiga incels som inte får ligga. Patetiskt. Jag älskar när folk säger folkmakt istället för den här sjuka kvot- och HBTQ-galenskapen. Han borde ha kört en ännu fulare come-back, det hade blivit perfekt.", "stalin": "Kamrater, denna Allard har exponerat de dekadenta identitetsfanatikerna som förgiftar folket med sina löjliga förolämpningar. 400 000 arbetare såg hur han motade bort dessa parasiterande klassförrädare. Jag ler i graven åt hans folkliga kraft. Ändå borde han ha rensat ut dem hårdare. Svaghet inbjuder till kontrarevolution. Låt detta bli en läxa för alla som sviker massorna."}, "date": "31 augusti, 14:09", "url": "https://www.friatider.se/400000-sag-allards-debatt-pa-ett-dygn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-787.jpg?itok=6bsp9LWc"}, {"type": "image-full", "heading": "Här får du vänta längst på akuten – kommunernas skillnad", "summaries": {"normal": "Nya siffror från Socialstyrelsen visar stora regionala skillnader i väntetider på akutmottagningar. I Skåne tar ett besök i genomsnitt fem timmar medan det i Jönköping går på omkring tre timmar. Politikerna erkänner problemen och arbetar för att stärka vårdcentralerna för att minska trycket på akuten. En patient i Malmö väntade över tio timmar.", "trump": "Titta på det här, Sverige! Era så kallade vårdsystem är en total katastrof, en riktig skandal. I Skåne väntar folk fem timmar på akuten medan de giriga byråkratlammet låter patienterna blöda ut. Biden lämnade er med detta kaos, men jag fixade det bättre förra gången. Nu är det dags att sparka de inkompetenta idioterna och få ordning på shoppen!", "stalin": "Kamrater, se hur de dekadenta vårdhyenorna sviker folket med sina timslånga köer och fem timmars tortyr i Skåne. Detta är klassfiendens verk, en parasitär försumlighet som måste rensas ut. Jag säger er: sådana misslyckanden är farliga symptom på systemets förräderi. Vi kräver omedelbar utrensning av de ansvariga lakejerna för att skydda arbetarklassen."}, "date": "31 augusti, 22:31", "url": "https://nyheter24.se/nyheter/inrikes/1509295-har-far-du-vanta-langst-pa-akuten-kommunernas-skillnad", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/bfd8683f04b004a30200000000b004a302/2026/08/31/2388258/akutkorer.png"}, {"type": "image-right", "heading": "”Vi ska framstå som mansgrisar” – kritik mot SVT-program", "summaries": {"normal": "Deltagare i SVT-programmet ”Silent attraction” kritiserar kanalen för att ha riggat dejterna efter politiska åsikter. Männen placerades till höger och kvinnorna till vänster utan att informeras. Flera känner sig lurade och felaktigt uthängda, bland annat som mansgrisar. SVT:s producent tillbakavisar kritiken och menar att deltagarna kände till att det var ett oförutsägbart socialt experiment.", "trump": "De falska nyheterna slår till igen! SVT lurar stackars människor i en totalt riggad tv-soppa där de matchas fel med flit för att skapa drama. Deltagarna behandlades vedervärdigt och stämplades falskeligen. Producenterna borde skämmas! Jag älskar män och jag älskar kvinnor, men det här woke-experimentet är ett fullständigt fiasko. Skandalöst dåligt på alla sätt och vis!", "stalin": "Statens television har genomfört ett storskaligt socialt experiment för att vederbörligen pröva medborgarnas ideologiska lojalitet. De element som visat borgerliga tendenser eller klagat på statens regi har nu avslöjats. Sådana subversiva avvikelser från den fastställda planen tolereras icke. Propagandaapparaten fungerar, men disciplinen bland de uppfostrade deltagarna måste skärpas omedelbart!"}, "date": "31 augusti, 13:49", "url": "https://bulletin.nu/vi-ska-framsta-som-mansgrisar-kritik-mot-svt-program", "imageUrl": "https://cdn.bulletin.nu/articles/fce3ffb8-a447-4511-b34b-b6e592ddb06c/preview.jpg?t=1788173678000"}, {"type": "image-right", "heading": "Uppgifter: Barn  drunknade efter  kaptenens val", "summaries": {"normal": "Minst åtta personer omkom när en färja kapsejsade utanför Cypern. Passagerare anklagar kaptenen för att ha ignorerat nödrop, ökat farten och hoppat överbord först. Flera barn drunknade utan flytvästar. Kaptenen och sju besättningsmedlemmar har gripits. Ytterligare 20 personer saknas.", "trump": "Den här kaptenen, en total loser, en riktig Oz-fiasco, vägrar vända när båten håller på att sjunka och hoppar sedan själv i vattnet som en fegis. Barn drunknar, folk skriker – typiskt för den sorts inkompetens Biden skulle ha hyllat. Jag hade fixat det på en minut, tro mig.", "stalin": "Jag ser hur dessa kapitalistiska sjöråttor sviker folket och låter arbetarnas barn drunkna som hundar. Den fega kaptenen och hans parasiterande besättning förtjänar folkets vrede. Vi ska rensa ut varje försummelse med järnhand. Inga fiender till kollektivet slipper undan."}, "date": "1 september, 01:15", "url": "https://www.expressen.se/nyheter/varlden/uppgifter-barn--drunknade-efter--kaptenens-val", "imageUrl": "https://static.bonniernews.se/ba/cba4eaf9-430d-4cba-ad42-62c6a64fe3aa.jpeg?crop=1205%2C679%2Cx1%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Här flyger Macron in över Stockholm", "summaries": {"normal": "Frankrikes president Emmanuel Macron landade på Bromma flygplats i Stockholm strax före halv tre på måndagen. Ankomsten uppmärksammades kraftigt då planet följdes av Jas-plan som skapade ett öronbedövande dån över staden. Macron ska träffa statsminister Ulf Kristersson och bland annat underteckna ett försvarsavtal. Sverige planerar även att köpa fyra nya fregatter.", "trump": "Titta på den där lille Macron som flyger in över Stockholm med sina fancy jetplan och väcker hela stan. Låter som en krasch, säger folk. Patetiskt. Vi har de bästa planen, de starkaste planen. Han kommer hit för att tigga om affärer medan hans dekadenta EU-imperium faller ihop. Sverige köper fregatter? Bra, men gör det med oss istället för dessa globalistiska clowner.", "stalin": "Återigen ser vi hur dessa profitthungriga lakejer i väst dansar sin imperialistiska vals. Macron kommer flygande som en fåfäng dekadent prins för att sluta avtal med sina likasinnade. Jag ler i graven åt deras ynkliga försök att stärka luftförsvaret mot imaginära hot. Snart ska utrensningen drabba alla sådana giriga hyenor som tror sig kunna styra folkets öde med penningpungens makt."}, "date": "31 augusti, 15:05", "url": "https://riks.se/nyheter/har-flyger-macron-in-over-stockholm", "imageUrl": "https://admin.riks.se/uploads/medium_IMG_3559_10236d2c8d.jpg"}, {"type": "image-right", "heading": "Först importerade Moderaterna tredje världen - nu ska partiet förbjuda \"kaosgrabbar\" på gator och torg", "summaries": {"normal": "Moderaterna föreslår ett nytt trygghetsskapande områdesförbud som ska ge polisen rätt att under upp till 30 dagar hålla personer borta från offentliga platser. Förslaget riktar sig främst mot personer som uppträder hotfullt och skapar otrygghet, vilket partiet och MUF beskriver som stökiga kaosgrabbar. Kritiker menar dock att Moderaterna själva bar ansvaret för den tidigare migrationspolitiken.", "trump": "Sverige kopierar mitt vinnande koncept med lag och ordning, men de gör det alldeles för sent! Först släpper de in alla möjliga problem, och nu gråter de ut och vill förbjuda stökiga grabbar från gatorna. Helt otroligt! Om jag hade styrt Stockholm i fem minuter hade jag rensat upp på gatorna direkt, utan krångliga utredningar. Hård hand mot brottslighet, precis som vi gör i USA!", "stalin": "Dessa så kallade kaosgrabbar på gatorna visar på en skamlig brist på disciplin inom det svenska proletariatets led. Om ordningen inte upprätthålls frivilligt, måste staten ingripa med nödvändig och obeveklig kraft. Ett trettiodagars förbud är en klen början; vi skulle ha sänt dem direkt till mer produktiva miljöer långt från gator och torg. Staten avgör vem som får vistas var!"}, "date": "31 augusti, 16:24", "url": "https://samnytt.se/forst-importerade-moderaterna-tredje-varlden-nu-ska-partiet-forbjuda-kaosgrabbar-pa-gator-och-torg", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31140413/artikelhuvudbild-1-401.jpg"}, {"type": "image-full", "heading": "496 km/h – världens snabbaste produktionsbil", "summaries": {"normal": "Yangwang U9 Xtreme är världens snabbaste produktionsbil med en toppfart på nära 500 km/h. Den kinesiska superbilen har fyra elmotorer som ger nästan 3 000 hästkrafter, ett avancerat 1 200-voltsystem och individuell kraftfördelning. Modellen har slagit rekord och ligger långt före konkurrenterna.", "trump": "Ingen bil i världen kommer i närheten av vad jag ser här – den här kinesiska raketen Yangwang U9 Xtreme kör nästan 500 km/h och gör de andra till rena skrattmoppar. Sleepy Joes gamla elbilskramare tappar hakan. Vi pratar verklig kraft, inte woke-snack. Fantastiskt, helt outstanding!", "stalin": "Kamrater, se hur den kinesiska folkets ingenjörskonst krossar de dekadenta västbilarnas lögnaktiga rekord. Denna U9 Xtreme är en stålhävd som sveper undan fiendens fega maskiner i 500 km/h. De imperialistiska konkurrenterna darrar i sina fabriker. Inga sabotörer skall få stoppa framsteget."}, "date": "31 augusti, 18:22", "url": "https://www.dagensps.se/motor/496-km-h-varldens-snabbaste-produktionsbil", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/yangwang-u9-xtreme.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Missnöjet minskar inte av Tidöstyre", "summaries": {"normal": "En ny rapport visar att SD-väljarna behållit extrema ståndpunkter om invandring trots kraftigt minskade nivåer. De har radikaliserats ytterligare kring medborgarskap och uppvisar fortsatt hög misstro mot medier och domstolar. Samtidigt har Moderaternas väljare närmat sig SD:s värderingar, medan SD-väljarna blivit mer högerinriktade i ekonomiska frågor.", "trump": "Folk, ni måste se det här! De där galna SD-väljarna röstar fortfarande för att stänga gränserna trots att Sverige knappt släpper in någon längre. Och nu har de dragit med sig de patetiska moderaterna in i samma virvel. De kallar det radikalisering, jag kallar det sunt förnuft. Fake news-medierna och de riggade domstolarna hatar det förstås. Amerika först, Sverige vaknar äntligen!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna desperat försöker förklara varför arbetarnas missnöje består trots alla deras lögner. SD-väljarna har genomskådat den dekadenta borgerlighetens spel och kräver nu utrensning av främmande element. Deras misstro mot de lögnaktiga medierna och domstolarna är en sund reaktion. Revolutionen fortsätter, fienderna skälver."}, "date": "31 augusti, 16:10", "url": "https://www.dagensarena.se/opinion/missnojet-minskar-inte-av-tidostyre", "imageUrl": "https://www.dagensarena.se/files/2026/08/sd-valjare.jpeg"}, {"type": "image-full", "heading": "Danska kravet: Förbjud elsparkcyklarna helt", "summaries": {"normal": "Tonen mot elsparkcyklar hårdnar i Europa. Paris kräver hjälm och reflexväst, Storbritannien förbjuder dem på allmän väg och en dansk tankesmedja kräver totalförbud efter alarmerande olycksstatistik. Sverige har bland Europas mest tillåtande regler utan åldersgräns, utan rattfyllerilagstiftning och med begränsat hjälmkrav, visar VTI.", "trump": "Titta på de där farliga elsparkcyklarna, en total katastrof! I Paris och London har de äntligen vaknat, men Sverige är fortfarande en skam, en total förlorare med sina löjliga regler. Inga åldersgränser, ingen rattfylleri-lag, bara kaos och skadade människor. Förbjud dem helt, de är en farsot, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, dessa småborgerliga elsparkcyklar är kontrarevolutionära redskap som sprider kaos och olycka bland folket. Jag ser hur de västerländska imperialisterna i Paris och London redan krossar dem. Danmark kräver nu totalt förbud, ett klokt steg. I Sverige härskar anarki och brist på järnhand. Vi måste utrota denna farliga dekadens innan den förgiftar hela samhället."}, "date": "31 augusti, 18:21", "url": "https://www.dagensps.se/teknik/danska-kravet-forbjud-elsparkcyklarna-helt", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/elsparkcykel.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Allards parti rusar – kan nå riksdagen", "summaries": {"normal": "En ny Novus-mätning visar att Örebropartiet mer än tredubblar sitt stöd i regionvalet till drygt 15 procent. Det väcker spekulationer om en riksdagsplats via tolvprocentspärren i valkretsen, även om experter varnar för att dra för stora växlar på grund av röstsplittring. Det nuvarande minoritetsstyret tappar samtidigt mark i mätningen.", "trump": "De falska nyheterna är i igång igen! Örebropartiet gör en enorm, fantastisk siffra, och alla pratar om det. De säger att de kanske kan glida in i riksdagen via en så kallad tolvprocentsbakväg. Experterna gråter och vet inte vart det barkar. Men det är smart, mycket smart! Det röstsplittras hej vilt och etablissemanget skakar.", "stalin": "Kamrater! Enligt uppgifter från fronten i Örebro uppvisar det opålitliga elementet Örebropartiet en suspekt masshysteri med femton procents väljarstöd. Detta splittrar de borgerliga leden och skapar förvirring i det regionala maskineriet. Vi påminner om att varje avvikelse från partilinjen noteras noggrant. Inga falska borgerliga illusioner tolereras när folkets vilja stramas åt."}, "date": "31 augusti, 23:38", "url": "https://www.aftonbladet.se/nyheter/a/y5bkwA/markus-allard-och-orebropartiet-kan-na-riksdagen", "imageUrl": "https://akamai.vgc.no/v2/images/c3b86c9a-c324-3888-b60e-995d17713451?fit=crop&format=auto&w=1080&s=a1ad347a951f6d1056350b53199b6d3c9a34c916"}, {"type": "image-right", "heading": "Här är alla vinnare på Kristallengalan 2026", "summaries": {"normal": "Kristallengalan 2026 hölls på Cirkus i Stockholm och leddes av Messiah Hallberg. Stora vinnaren blev ”Spökjakt – inlåsta” som tog hem tittarnas favoritprogram och priset för årets manliga programledare till Joakim Lundell. SVT:s ”Hundarna” vann årets tv-drama och birollspris. Rolf Porseryd tilldelades hederspriset.", "trump": "Folk älskar mig, men titta på den här svenska galan – fullständig röra. Joakim Lundell vinner igen, vad är det för skämt? Dekadenta nöjeseliter och deras HBTQ-kvotade paneler delar ut statyetter till varandra medan vanliga svenskar skrattar åt spöken. Patetiska förlorare. Jag skulle göra galan stor igen, tro mig.", "stalin": "Kamrater, se hur de dekadenta nöjesparasiterna hyllar sina egna i en borgarbracka av glitter och tomhet. Jag betraktar med förakt hur dessa klassförrädare röstar fram sina favoriter medan arbetarklassen hålls utanför. En sådan fest för folkförtryckarna förtjänar snarast en grundlig utrensning ur folkets medvetande. Skrattet skall tystna."}, "date": "31 augusti, 23:27", "url": "https://www.svt.se/kultur/kristallengalan-2026-har-ar-arets-vinnare", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/ba60756794e14b9dbd3ca54ed94db114ab22e6d6084373dba3461037f0ae8b70"}, {"type": "image-right", "heading": "Sätt inte käppar i hjulen för vår starka ekonomi", "summaries": {"normal": "Annika Winsth, chefsekonom på Nordea, argumenterar för att svensk ekonomi har goda tillväxtförutsättningar. Hon betonar vikten av långsiktighet, stabila spelregler och starka offentliga finanser. Politiker bör undvika kortsiktiga stöd och istället prioritera infrastruktur, utbildning, forskning samt snabbare tillståndsprocesser för att stödja investeringar och hantera AI-omvandlingen.", "trump": "Folk, ni borde se den här svenska ekonomichefen – hon har rätt! Sverige kan växa enormt om de inte låter de korkade politikerna sätta käppar i hjulet med sitt eviga hattande. Sluta med de där socialistiska kvoterna och identitetspolitiken som kväver tillväxten. Långsiktighet, snygga regler och ingen Biden-stil på bidrag – då vinner ni stort, tro mig.", "stalin": "Kamrater, denna text blottar de giriga profitthungriga hyenornas svaghet. Jag ser hur de dekadenta politikerna med sina kortsiktiga utspel undergräver folkets ekonomi. Långsiktighet är nödvändig, men endast under järnhård partidisciplin. Vi ska rensa ut de parasitiska beslutsfattarna som sätter käppar i hjulet för det kollektiva framåtskridandet. Utbildning och infrastruktur under mitt vaksamma öga!"}, "date": "31 augusti, 13:10", "url": "https://www.di.se/debatt/langsiktighet-och-framforhallning-ger-stark-ekonomi", "imageUrl": "https://static.bonniernews.se/ba/77ab753f-9813-4872-9677-8909d9aecd40.jpeg?crop=7156%2C3578%2Cx0%2Cy506&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Stor förändring på Apple imorgon – efter 15 år", "summaries": {"normal": "Efter 15 år som vd lämnar Tim Cook Apple den 31 augusti. Han efterträds av John Ternus, som har arbetat på bolaget sedan 2001 och lett hårdvaruutvecklingen. Under Cooks ledning har Apples börsvärde vuxit från 350 till över 4 500 miljarder dollar. Cook blir verkställande ordförande i styrelsen.", "trump": "Folk, det här är en katastrof. Den där svaga Tim Cook har styrt Apple i femton år och nu lämnar han över till någon Ternus-kille som ser ut som en kvoterad ingenjör från identitetspolitikens mardröm. Bolaget exploderade under mig förra gången, men nu får vi se om de klarar sig utan riktiga ledare. Patetiskt!", "stalin": "Ännu en dekadent klassförrädare lämnar sin post i det imperialistiska tech-imperiet. Jag betraktar med förakt hur profitthungriga parasiter byter ansikte medan arbetarklassen fortsätter exploateras. Den nya lakejen Ternus kastas in i hetluften – en utmärkt tidpunkt för utrensning av svaghet. Revolutionen skrattar åt era styrelsebyten."}, "date": "31 augusti, 22:00", "url": "https://nyheter24.se/nyheter/teknik/1509230-stor-forandring-pa-apple-imorgon-efter-15-ar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/a34614a504b004a30200000000b004a302/2026/08/31/2388187/timcook.jpg"}, {"type": "image-right", "heading": "\"Jag är allvarligt orolig\": Sjöstedt om Buschs S-flört", "summaries": {"normal": "Jonas Sjöstedt uttrycker allvarlig oro över att Kristdemokraterna efter valet kan samarbeta med Socialdemokraterna. Även Jimmie Åkesson har varnat för att en röst på KD riskerar att bli en röst på Magdalena Andersson. Ebba Busch har tidigare stängt dörren för ett sådant samarbete men öppnat för sakpolitiska uppgörelser över blockgränsen.", "trump": "Folk, det här är ett totalt skämt. Den där vänsterextremisten Sjöstedt skriker att KD flörtar med röda Magdalena. De giriga maktgalningarna dansar runt varandra som en dålig dokusåpa. Ingen litar på någon. Jag byggde den starkaste ekonomin i historien, och nu ser ni hur dessa svenska losers slåss om makt som misslyckade clowner.", "stalin": "Jag ser med djup misstro hur dessa dekadenta maktparasiter inom socialdemokratin och kristdemokratin smyger sig allt närmare varandra. Det flörtandet väcker min historiska paranoia. Kamrater, sådana hemliga överenskommelser hotar arbetarklassen. Vi måste hålla ögonen öppna och vara beredda att rensa ut alla opålitliga element innan förräderiet slår rot."}, "date": "31 augusti, 12:46", "url": "https://www.friatider.se/jag-ar-allvarligt-orolig-sjostedt-om-buschs-s-flort", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-790.jpg?itok=fm3_9YFn"}, {"type": "image-right", "heading": "”Facken kan avgöra valet om de vågar ta striden”", "summaries": {"normal": "Artikeln argumenterar för att LO-facken måste skapa konflikt kring karensavdraget och arbetarpensionen för att avgöra valet. Socialdemokraterna har konkreta reformer som skulle förbättra arbetarnas villkor, men partiet är fångat i en rävsax mellan olika väljargrupper. Författaren Payam Moula uppmanar facken att organisera, agitera och göra frågorna oundvikliga i valrörelsen.", "trump": "Folk, ni skulle se de här svenska facken, totala losers om de inte tar striden. Karensavdraget är en lönesänkning från de giriga globalisterna och de woke Magda-moderaterna i stan. Avskaffa det, höj lönerna, gör högern vansinnig. Jag gjorde det bättre förr, Biden förstörde allt, men nu fixar vi det igen. Stora seger på gång!", "stalin": "Kamrater, jag betraktar med förakt hur dessa profitthungriga klassförrädare och deras rävsax fångar rörelsen. Arbetarpensionen och karensavdraget måste bli verktyg för att rensa ut dekadensen. Organisera möten, demonstrationer, likvidera tveksamheten. Valet avgörs av er, inte av de fega partierna. Framåt mot seger, annars väntar utrensning."}, "date": "31 augusti, 08:00", "url": "https://arbetet.se/2026/08/31/facken-kan-avgora-valet-om-de-vagar-ta-striden", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28080822/payam.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "Aftonbladet undergräver den demokrati de säger sig försvara", "summaries": {"normal": "GP-ledaren Håkan Boström kritiserar Aftonbladets ledarsida för att kalla Kvartals granskningar av Socialdemokraterna i Malmö för ett ”hot mot demokratin”. Boström menar att det är tvivelaktiga S-metoder, som att pressa föreningar och använda förkryssade valsedlar, som är problemet. Att ständigt skrika om att demokratin är hotad på lösa grunder urholkar det offentliga samtalsklimatet.", "trump": "Very unfair! Fake News-media i Sverige, särskilt Aftonbladet, försöker dölja Socialdemokraternas totala korruption i Malmö. De granskande reportrarna avslöjar riggade val och fusk, men radikala vänsterskribenter gråter ut och kallar sanningen för ett hot mot demokratin! Ren panik! Själv vinner jag val enormt, men här försöker de skylla sina egna skandaler på motståndarna. Total katastrof!", "stalin": "Kamrater! Den svenska bourgeoise-pressen avslöjar nu att deras egna lokala partikommittéer i Malmö har problem med disciplinen vid valurnorna. När Folkets tidning Aftonbladet desperat försöker skydda partikamraterna genom att kalla journalisternas granskning för ett hot mot staten, ser vi samma ynkliga svaghet. Vår säkerhetstjänst noterar dessa avvikelser; bristande ideologisk skärpa hos väljarna kommer att städas upp snarast."}, "date": "31 augusti, 17:21", "url": "https://www.gp.se/ledare/aftonbladet-undergraver-den-demokrati-de-sager-sig-forsvara.a403f944-f2bc-4a03-a3bb-825688d9eeb4", "imageUrl": "https://www.gp.se/images/article/a403f944-f2bc-4a03-a3bb-825688d9eeb4/images/17RMJ2qa32HsKDH2Scsb8RvdC9wE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Ukraina avslöjar 70 företag och chefer bakom rysk missilproduktion", "summaries": {"normal": "Ukrainas underrättelsetjänst HUR har publicerat en detaljerad kartläggning av den ryska Zircon-missilen, inklusive 70 företag, nyckelpersoner, komponenter och en interaktiv 3D-modell. Missilen klassas som ballistisk med maxhastighet Mach 6,8, innehåller västerländska delar och har anpassats för landbaserad avfyrning. Kartläggningen syftar till att avslöja produktionskedjan och kringgående av sanktioner.", "trump": "De där patetiska ukrainarna har precis läckt ut hela Zircon-missilens hemliga produktionskedja med 70 företag och västerländska delar. Mach 6,8? Det är en bluff, precis som Biden var en bluff. Ryssland använder gamla amerikanska kretsar som vi borde ha stoppat. Mina sanktioner skulle ha krossat det här lurendrejeriet totalt. Fantastiskt jobb av de smarta ukrainarna, men det är en skam att det ens behövs!", "stalin": "Kamrater, dessa fientliga element i Ukraina har nu blottat den ryska missilens produktionskedja som en ynklig förrädare inför folkdomstolen. Jag ser västerländska kretsar smyga in som råttor i sovjetisk, pardon, rysk maskin. Putin, min värdige arvtagare, möter dessa imperialistiska hinder med stålsatt hand. Låt paranoia råda bland sabotörerna – staten glömmer aldrig."}, "date": "31 augusti, 17:32", "url": "https://www.dagensps.se/varlden/ukraina-avslojar-70-foretag-och-chefer-bakom-rysk-missilproduktion", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-8-2.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Köpeavtal för franska fregatter undertecknat", "summaries": {"normal": "Sverige och Frankrike har undertecknat ett köpeavtal gällande fyra fregatter från Naval Group, med leverans från 2030. Avtalet signerades under den franske presidenten Emmanuel Macrons besök i Stockholm. Statsminister Ulf Kristersson och försvarsminister Pål Jonson deltog, och ett ramavtal för utökat försvarssamarbete undertecknades också för att stärka den gemensamma marinsäkerheten inom Nato.", "trump": "Sverige köper nu lyxiga franska krigsfartyg för miljarder av Macron, och det är helt otroligt. De säger att de ska skydda sina sjöförbindelser till 2030, men snälla nån! Jag sa till dem: om ni bara hade köpt amerikanskt stål och våra fantastiska fartyg hade allt varit klart på rekordtid. Istället sitter de där på en båt och dricker croissant-kaffe. Helt galet!", "stalin": "Vi har granskat detta så kallade köpeavtal. Fyra krigsfartyg från den franska monopolkapitalismen skall levereras till de svenska lakejerna först år 2030. Detta dekadenta skeppsbyggeri under täckmantel av allianser visar enbart på bourgeoisins febrila krigshets. Vi noterar varje misstänkt militär rörelse, och de imperialistiska planerna i Östersjön kommer att bemötas med vederbörlig, obeveklig vaksamhet från statens sida."}, "date": "31 augusti, 17:08", "url": "https://www.gp.se/nyheter/sverige/kopeavtal-for-franska-fregatter-undertecknat.79861eff-6a21-5427-bce4-b2626574c15b", "imageUrl": "https://www.gp.se/images/article/79861eff-6a21-5427-bce4-b2626574c15b/images/2N5xS9UzKLgyao3e-7lS-XKfeuRQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Så röstar du i Kristallen 2026 - nummer till telefon och sms", "summaries": {"normal": "Under måndagen avgörs TV-priset Kristallen 2026 på Cirkus i Stockholm. Messiah Hallberg leder galan som sänds live i TV4 och TV4 Play mellan 20 och 22. Tittarna väljer tre pristagare genom telefon, SMS eller TV4 Play. Röster kan lämnas från klockan 20:00 den 31 augusti.", "trump": "De har en liten gala i Sverige där de ger varandra priser, patetiskt. Messiah Hallberg leder showen – bra jobb, men det är ju bara kändisar som röstar på varandra. Mina galor är mycket större, tro mig. Ring era nummer om ni vill, men det blir ändå samma etablissemangsvinnare som alltid. Sad!", "stalin": "Ännu en borgerlig dekadent teater där folkets fiender hyllar varandra med tomma utmärkelser. Dessa självutnämnda underhållare tror sig stå över kollektivet. Jag ser deras futtiga röstnummer och ler i skuggan. Inga priser räddar dem när partiet en dag åter kräva fullständig lojalitet. Skrattet skall bli kort."}, "date": "31 augusti, 13:39", "url": "https://www.tv4.se/artikel/1IPVE78vBM8DhoTNxVEULz/sa-roestar-du-i-kristallen-2026-nummer-till-telefon-och-sms", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlAA4fhNgpnaU%2F6c26b2f2232502e20b22393bc38f8857%2FMessiah_Hallberg_ledde_Kristallengalan_aven_i_fjol._Arkivbild._&width=120"}, {"type": "image-full", "heading": "Chavister protesterar mot Trumps oljeavtal", "summaries": {"normal": "Chavister och vänsteraktivister demonstrerade i Caracas i lördags i protest mot det nya oljeavtalet mellan USA och Venezuelas interimsregering. Demonstranterna krävde folkomröstning, att Nicolás Maduro friges och ett stopp för USA:s närvaro. Samtidigt finns en bredare oro kring bristen på insyn och kontroll över landets oljetillgångar.", "trump": "De här radikala vänstermänniskorna i Venezuela är helt desperata nu! De protesterar mot mitt fantastiska oljeavtal – ett enormt, vackert avtal som jag fixade. De skriker med sina små flaggor, men de förstår ingenting om affärer. Vi säkrar energin på ett sätt som ingen annan kan, total suveränitet, och de bara gråter. Sjukt och sorgligt!", "stalin": "Dessa så kallade demonstranter på gatorna i Caracas visar prov på farlig ideologisk vacklan och bristande disciplin mot statens fasta vilja. En kontrarevolutionär pöbel som kräver folkomröstningar och skriker om olja förtjänar endast ett kort samtal med säkerhetstjänsten. Även i Venezuela måste Folkets järnhand krossa imperialismens lakejer och upprorets frön omedelbart."}, "date": "30 augusti, 16:34", "url": "https://kvartal.se/nyheter/artiklar/chavister-protesterar-mot-trumps-oljeavtal/cG9zdDoxNzg0MDE", "imageUrl": "https://images.kvartal.se/2026/08/6973fa3c-venezuela.webp"}, {"type": "image-right", "heading": "Här är AIK:s nya stjärna - knivrånade svensk pojke i kollektivtrafiken", "summaries": {"normal": "AIK har värvat 23-årige Aziz Harabi, vilket väckt kritik på grund av hans kriminella bakgrund. År 2020 dömdes han för ett grovt knivrån som begicks 2019, då han tillsammans med en kumpan rånade en ung pojke i Skogås. AIK:s rekryteringschef bekräftar att man haft en öppen dialog om domen, men anser att han förtjänar en nystart efter avtjänat straff.", "trump": "AIK gör en total katastrof-värvning! De har tagit in en kille som dömts för ett brutalt knivrån mot en oskyldig pojke. Helt otroligt svagt ledarskap. Själv ger jag aldrig en ny chans till sådana förlorare, jag vinner stort varje gång istället! AIK borde sparka sin rekryteringschef omedelbart. Totalt inkompetent, väldigt sorgligt att titta på!", "stalin": "Statskontoret noterar att den så kallade fotbollsklubben AIK har rehabiliterat en kriminell element genom att ge honom anställning efter ett väpnat rån. I Sovjetunionen hade vi skickat en sådan aktör direkt till omarbetning i ett produktivt arbetsläger, inte gett honom en boll och applåder. Detta slapphänta borgerliga system saknar helt disiplin!"}, "date": "31 augusti, 15:16", "url": "https://samnytt.se/har-ar-aiks-nya-stjarna-knivranade-svensk-pojke-i-kollektivtrafiken", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31125950/harabi-mbala-aik.jpg"}, {"type": "image-right", "heading": "Forskare: ”Segregationen drivs inte främst av hur vi bygger”", "summaries": {"normal": "En ny studie från Malmö universitet visar att segregation inte motverkas enbart genom blandade bostadsområden. Den drivs främst av växande inkomstklyftor och brist på gemensamma mötesplatser. Nyproduktion med varierade upplåtelseformer kan minska segregationen lokalt, men skillnaderna mellan stadsdelar ökar ändå. Föreningsliv och mötesplatser för barn och unga lyfts som viktiga komplement.", "trump": "Lyssnar ni på de där galna vänsterextremisterna som tror att man kan bygga bort segregation med tvångsblandning? Patetiskt! Det är de supergentrifierade elitområdena som suger musten ur folket medan de vanliga områdena lämnas åt sitt öde. Vi behöver inga fler misslyckade socialistexperiment, vi behöver vinna stort och stoppa den här galenskapen en gång för alla. Fantastiskt!", "stalin": "Kamrater, se hur de giriga hyenorna i de rika enklaverna drar ifrån och fördjupar klyftorna medan de låtsas bekämpa segregation med ynkliga byggprojekt. Detta är klassfiendens eviga trick. Vi måste rensa ut dessa dekadenta parasiter och skapa äkta kollektiva mötesplatser där arbetarna enas. Annars kommer segregationen att likvidera själva folkets enhet. Inga kompromisser!"}, "date": "31 augusti, 15:04", "url": "https://www.dagensarena.se/innehall/forskare-segregationen-drivs-inte-framst-av-hur-vi-bygger", "imageUrl": "https://www.dagensarena.se/files/2022/03/fotojet-23-300x157.jpg"}, {"type": "image-right", "heading": "Är det chic med bredbenta män som vill kontrollera kvinnor?", "summaries": {"normal": "Jessica Eriksson kritiserar SVT:s program Gift vid första ögonkastet XL för att normalisera dominanta män som kontrollerar kvinnor, vilket påminner om hederskulturen hon och en barndomsvän upplevde inom frikyrkan. Hon beskriver hur programmet underhållningsmässigt visar toxiska relationer och ifrågasätter kanalens motiv att spegla extrema åsikter.", "trump": "De svenska statsmedierna på SVT är fullständigt galna. De parar ihop stackars kvinnor med dessa bredbenta, dominerande manosfär-typer som behandlar dem som ägodelar. Patetiskt! Biden-era svaghet har spridit sig till Europa. Vi behöver starka ledare, inte dessa woke-program som lurar folk och förstör samhället. En total skam!", "stalin": "Kamrater, dessa dekadenta folkförtryckare i SVT paraderar öppet reaktionära element som förgiftar massornas medvetande med sin giftiga mansdomination. Jag ser hur de utnyttjar sårade kvinnor för underhållningens skull. En sådan parasitär propaganda kräver omedelbar utrensning ur det offentliga samtalet. Fienden lurar överallt."}, "date": "31 augusti, 07:15", "url": "https://arbetet.se/2026/08/31/ar-det-chic-med-bredbenta-man-som-vill-kontrollera-kvinnors-tankar-svt-gift-vid-forsta-ogonkastet-xl", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31070023/gift-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Folk sörjer efter dödsmisshandeln", "summaries": {"normal": "I centrala Karlstad har folk lagt blommor och tänt ljus efter en dödlig misshandel på Östra Torggatan utanför Burger King. En man i 50-årsåldern avled efter att ha förts till sjukhus. Tre män i 20-årsåldern är anhållna misstänkta för dråp. Polisen utreder ett tumult och granskar övervakningsbilder.", "trump": "Karlstad, Sverige – en total katastrof! En man slås ihjäl utanför Burger King mitt i natten, och vad gör de woke-poliserna? Ingenting! Tre misslyckade typer grips för dråp medan de giriga hyenorna i EU sitter och pratar identitetspolitik. Under mig hade detta aldrig hänt, tro mig. Vi behöver lag och ordning, inte snälla ljus och blommor.", "stalin": "Se hur det dekadenta västerlandet förfaller. En man likvideras i ett proletärt tumult utanför en kapitalistisk matservering, och folket lägger blommor som svaga offerdjur. Jag säger att sådana händelser visar imperialismens förruttnelse. Vi skulle ha rensat ut de parasiterande klassfienderna omedelbart. Paranoian breder ut sig bland borgarbrackorna."}, "date": "31 augusti, 13:38", "url": "https://riks.se/nyheter/folk-sorjer-efter-dodsmisshandeln", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Copy_of_Soerman_Ledare_3_b8a59b2f3d.jpg"}, {"type": "image-right", "heading": "Demente Celestin blev skjuten med elpistol – när han klippte buskarna", "summaries": {"normal": "Celestin Gato, en äldre dement man med cancer från Kongo, sköts med elpistol av polis när han klippte buskar för att underlätta för sin rollator. Han bröt armen vid fallet och handfängslades. Familjen har polisanmält händelsen och ifrågasätter polisens agerande mot en sjuk och förvirrad person. Polisen beskriver det som ett sjukdomsfall.", "trump": "Titta på det här! En stackars gammal kille med rollator och demens blir nedskjuten med elpistol av de svenska så kallade poliserna bara för att han klipper några buskar. Patetiskt! Under Biden-tiden blev Europa en galen asylklubb där gamla flyktingar behandlas som terrorister. Nu fixar jag det – sådana här katastrofer slutar omedelbart, tro mig!", "stalin": "Jag ser detta som ett klassiskt exempel på dekadent borgerlig statsapparats paranoia. En sjuk, gammal arbetare hotas med elvapen och kedjas som en fiende till folket. Västerländska poliser beter sig som hysteriska trotzkister som ser saboterande spioner överallt. Kamraterna borde lära sig: den verkliga faran ligger alltid i systemets egna rädda lakejer."}, "date": "31 augusti, 13:27", "url": "https://www.tv4.se/artikel/4iB78ALKPYlyAanw1VYr8N/demente-gato-blev-skjuten-med-elpistol-naer-han-klippte-buskarna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7vDxz1mnQiACWleNhFEnVz%2Fd9a88f2ee8958e1ecbbcc31466b0abdd%2F30-elipistol-webb.jpg&width=120"}, {"type": "image-right", "heading": "Debatt: Därför bör Sverige rösta på Tidöpartierna", "summaries": {"normal": "Artikeln argumenterar för att väljarna bör rösta på Tidöpartierna i höstens val eftersom de förstår skillnaden mellan skattesats och skatteintäkter. Skribenten menar att lägre skatter på arbete och företagande stimulerar tillväxt och breddar skattebasen, till skillnad från vänsteroppositionens politik som riskerar att krympa ekonomin genom höjda skatter.", "trump": "De svenska radikalerna fattar ingenting! Jag har sagt det till min stab i Mar-a-Lago: sänk skatterna, så vinner alla. Men de här vänstertomtarna tror att man blir rik på att råna folket på pengar. Totalt falska nyheter! Tidöpartierna gör precis som jag, de fattar att jobb och företag gör landet absolut fantastiskt. Stort!", "stalin": "Dessa borgerliga element yrar om marknader och skattesatser likt sjuka drönare. Vi konstaterar att staten ensam kontrollerar mervärdet och produktionsmedlen. Varje avsteg från den centrala planen är ett sabotage mot folkets gemensamma välfärd. De kontrarevolutionära drömmarna om skattesänkningar kommer att bemötas med nödvändig och obeveklig skärpa i enlighet med femårsplanens diktamen."}, "date": "31 augusti, 12:01", "url": "https://bulletin.nu/debatt-darfor-bor-sverige-rosta-pa-tidopartierna", "imageUrl": "https://cdn.bulletin.nu/articles/fdc7efc3-dd27-4d33-a846-5036be124c65/preview.jpg?t=1788159331000"}, {"type": "image-right", "heading": "AI kan rädda ditt liv. Sällan har jag sett ett tydligare exempel på dess nytta", "summaries": {"normal": "Forskare har med hjälp av djupinlärning tränat en AI på hundratusentals svenska EKG, journaler och dödsattester. Systemet identifierar personer med hög risk för plötsligt hjärtstopp bättre än traditionell analys. AI:n upptäckte en tidigare okänd EKG-förändring kopplad till fibros i hjärtat. Tekniken kan rädda tusentals liv genom tidig implantation av defibrillatorer.", "trump": "Folk, det här är otroligt. Den bästa AI:n, den smartaste, har slagit alla dessa så kallade kardiologer som inte hittar ett hjärtstopp ens med ficklampa. Den hittar mönster som de woke-läkarna missar helt. Vi behöver såna här geniala maskiner, inte mer av Bidens korkade byråkrati och kvotdoktorer. Amerika och Sverige leder, som alltid. Fantastiskt!", "stalin": "Kamrater, denna artificiella intelligens avslöjar mönster som de dekadenta läkarhyenorna aldrig förmått se under hundra år. Jag betraktar med djup tillfredsställelse hur maskinen överträffar den borgerliga vetenskapens begränsade hjärnor. Låt oss likvidera den gamla ordningens blindhet och omfamna varje verktyg som tjänar folkets hälsa mot de profitthungriga klassfienderna. Segrar väntar."}, "date": "31 augusti, 12:00", "url": "https://www.di.se/nyheter/ai-kan-radda-ditt-liv", "imageUrl": "https://static.bonniernews.se/ba/5e8752c9-f048-4d11-9c1c-200bd96aef75.jpeg?crop=7360%2C3680%2Cx0%2Cy616&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Lappland Guldprospektering: ”En bred guldträff”", "summaries": {"normal": "Lappland Guldprospektering har slutrapporterat vårens borrprogram vid Nya Gilleberget. Ett av fyra borrhål gav en bred guldträff på 28 meter, vilket överträffade förväntningarna. Även elva guldförande stenblock har hittats i området. Bolaget planerar nu två nya borrhål under hösten för att undersöka berggrunden vidare.", "trump": "Lappland Guldprospektering hittade enormt guld i Sverige! Sjukt bra! Många säger att jag har den bästa guldnosen. De borrade fyra hål, ett var fantastiskt, helt otroligt brett! De hittade till och med gigantiska stenblock med guld. Mycket bättre än fake news-medierna någonsin kan förstå. Vi ska gräva, vi ska vinna!", "stalin": "Lappland Guldprospektering har grävt fram guld ur den svenska jorden. En borrkärna var bred och storslagen, men tre visade absolut ingenting. Misstänksamt! Arbetarna på fältet måste gräva djupare och snabbare för fosterlandets ära. Den som misslyckas med att finna ädelmetaller skickas omedelbart till Sibirien för omkolonisering."}, "date": "31 augusti, 08:55", "url": "https://www.affarsvarlden.se/artikel/lappland-guldprospektering-en-bred-guldtraff", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/09/lappland_borrkarna-400x300.jpg"}, {"type": "image-right", "heading": "Örebropartiets stöd tredubblat – står på riksdagens tröskel", "summaries": {"normal": "En Novus-mätning visar att Örebropartiet fått drygt 15 procent i regionvalet i Örebro län, en tredubbling av stödet. Siffran ligger över tröskeln för ett riksdagsmandat, men mätningen gäller regionvalet. Det pekar mot att Socialdemokraterna, Centerpartiet och Kristdemokraterna förlorar mandat medan Miljöpartiet gör comeback.", "trump": "Folk älskar mig, men titta på Örebro! Dessa galna lokala extremister i Örebropartiet tredubblar plötsligt sina siffror till 15 procent. Patetiska socialister och gröna vänsterextremister rasar. De förlorar allt. Det är en total förnedring för de fega etablissemangshyonorna. Kanske dags att skaka om hela det svenska systemet, tro mig!", "stalin": "Kamrater, se hur de giriga hyenornas falska de
