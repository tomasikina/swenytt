I Sverige kan du betala dig förbi vårdkön", "summaries": {"normal": "En granskning från SVT visar att privata sjukvårdsförsäkringar i Sverige inte avlastar den offentliga vården som tidigare påståtts. Tvärtom ger de snabbare tillgång till vårdcentral och remisser till specialistvård, vilket leder till att försäkrade söker mer vård och belastar systemet. Lägre inkomstgrupper drabbas värst då kompetens dras från offentlig vård. Artikeln varnar för att detta skapar ett ojämlikt A- och B-lag där plånboken styr före vårdbehov.", "trump": "Folk, ni måste höra på. De här svenska privata försäkringarna är en total katastrof, en riggad gräddfil för de rika som lurar systemet. De lovade att det skulle hjälpa de sjuka och gamla, men det blev precis tvärtom – nu köar de fattiga ännu längre medan de rika springer förbi. Det är en skam! De borde ha lyssnat på de skeptiska som jag alltid gör. Sverige behöver göra vård stort igen, inte låta plånboken styra. Patetiskt!", "stalin": "Kamrater, i denna dekadenta svenska vårdapparat ser vi hur borgarbrackorna med sina privata försäkringskontrakt förgiftar folkets kollektiva sjukhus. Jag, som alltid vakar över arbetarnas behov, genomskådar dessa parasitiska snabbspår som suger kompetens ur den socialistiska vården och skapar en utrensning av de svaga. De multisjuka köar medan kapitalisterna festar på remisser. Vi ska rensa ut dessa klassfiender, dessa plånboksfascister som gömmer sig bakom läkarkåren. Deras paranoia inför rättvisan är underhållande – snart ska de själva hamna längst bak i kön till folkdomstolen."}, "date": "2 juni, 06:57", "url": "https://arbetet.se/2026/06/02/i-sverige-kan-du-betala-dig-forbi-vardkon-pa-sjuka-och-fattigas-bekostnad/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02065635/betala-etta.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.69&fp-y=0.48"}, {"type": "image-full", "heading": "”Sweeney ville ha nakenscenerna”. Svarar på kritiken: ”Skådespeleri”", "summaries": {"normal": "Skaparen av ”Euphoria”, Sam Levinson, försvarar seriens nakenscener efter omfattande kritik. Han hävdar att skådespelaren Sydney Sweeney själv insisterade på nakenhet för att hennes karaktär som Onlyfans-modell skulle framstå som trovärdig. Trots anklagelser om att scenerna är förnedrande, menar Sweeney att det är en del av hennes skådespelarinsats. Levinson hyllar hennes mod och betonar att de har ett starkt förtroende under inspelningsarbetet.", "trump": "Hör på här, Euphoria-stjärnan Sydney Sweeney, en mycket begåvad person, blir attackerad av de falska nyheterna för sitt skådespel. Sam Levinson, han är en smart kille, ville göra det smakfullt, men Sydney sa nej! Hon ville göra det äkta. Det är så man vinner, man gör det stort och man gör det modigt! Vänsterliberalerna hatar framgång och mod. De kallar det snuskigt, jag kallar det en fantastisk prestation. Hon är en vinnare, de andra är bara förlorare!", "stalin": "Vi ser hur det dekadenta västet fullständigt förfaller i sin moraliska upplösning. Denna ”Euphoria” är inget annat än ett imperialistiskt verktyg för att förslava sinnena hos den arbetande ungdomen. Denna Sweeney, en marionett för kapitalismens lustar, avfärdar förnedring som ”konst”. Precis som Putin rensar upp i vår intressesfär mot det västliga förfallet, måste vi se detta för vad det är: ett ideologiskt gift. Vi ser konspirationer bakom varje kamera. Förr i tiden hade en sådan regissör skickats till Sibirien för att lära sig disciplin."}, "date": "2 juni, 10:36", "url": "https://www.aftonbladet.se/nojesbladet/a/lnvolG/sydney-sweeney-och-sam-levinson-slar-tillbaka-mot-sexkritiken-i-euphoria", "imageUrl": "https://akamai.vgc.no/v2/images/6fcbdc45-b76d-3946-8dcf-e29c4aa6ea21?fit=crop&format=auto&w=1440&s=e8941e7b43d9f0337d205e66b11a55744b94f984"}, {"type": "image-right", "heading": "Fortsatta oroligheter i Mellanöstern tyngde Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen backade på grund av oroligheter i Mellanöstern. Iran hotar att stänga Hormuzsundet och har brutit kontakt med USA. OMXS30-index föll 1,39 procent till 3 094,50. Oljepriset steg 7 procent. Energisektorn ökade 2 procent medan industri sjönk 2,4 procent. Bland enskilda aktier steg Ericsson 2,2 procent medan Saab föll 5,8 procent.", "trump": "Jag såg börsen idag, det var en katastrof. De svaga ledarna i Mellanösten, särskilt Iran, orsakar kaos. Hormuzsundet? Jag skulle ha stängt det för länge sedan. Min administration skulle ha hanterat det bättre. Energipriser stiger, det är bra för Amerika, men börsen tappar förlorare. Ericsson gick bra, men Saab och Volvo, det är sorgligt. Vi behöver starka beslut, som jag alltid gav.", "stalin": "Vi i staten observerar med oro hur imperialistiska krafter i Mellanöstern destabiliserar världsekonomin. Hormuzsundet är ett strategiskt trumfkort, och Iran visar styrka genom att bryta kontakter med USA. Börsen skakar, men det är bara en konsekvens av kapitalistisk instabilitet. Vi måste stärka vårt samhälle mot sådana hot. Paralleller till Putins Ryssland är uppenbara – vi måste skydda våra intressen. Detta är en kamp mot interna och externa fiender."}, "date": "1 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/fortsatta-oroligheter-i-mellanostern-tyngde-stockholmsborsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/10/Stock-market-red-old-man-2-400x267.jpg"}, {"type": "image-right", "heading": "SD-riksdagsman utreds för barnporr", "summaries": {"normal": "En riksdagsledamot från Sverigedemokraterna utreds för misstänkt barnpornografibrott. Politikern har haft flera tunga uppdrag i partiet men lämnar nu alla sina roller av personliga skäl. Ärendet hanteras av Särskilda åklagarkammaren och utredningen inleddes i april efter tips från den amerikanska organisationen NCMEC. Polisen har förhört personen, beslagtagit elektronisk utrustning och misstankarna kvarstår. Riksdagsledamoten har fått en offentlig försvarare.", "trump": "Folk, ni kommer inte tro det, men en av dessa SD-killar i riksdagen har fastnat i en stor barnporrutredning. Totalt kaos! Han hade massor av fina uppdrag men nu springer han därifrån som en hund med svansen mellan benen och kallar det \"personliga skäl\". Patetiskt. Polisen tog hans prylar och åklagaren säger att misstankarna sitter kvar. Sverige har blivit ett riktigt skämt, tro mig. De borde rensa upp ordentligt.", "stalin": "Kamrater, jag har noterat hur denna borgarbracka i riksdagen, dold som en falsk folkrepresentant, samlat på sig dekadenta bilder av barn. Vi ser tydligt hur kapitalistiska element infiltrerar till och med så kallade nationalistiska formationer. Tips från de amerikanska reaktionärerna utlöste vår utredning redan i april. Efter förhör och beslag av elektronisk sabotageutrustning släpptes han, men vi kommer inte glömma. En utrensning bland dessa perversa fiender till folket är oundviklig. Mörkret inom borgarklassen skrattar alltid sist – tills vi skrattar tillbaka."}, "date": "2 juni, 10:04", "url": "https://www.friatider.se/riksdagsledamot-utreds-barnporr", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20230614144000-56d75ad3-me_1.jpg"}, {"type": "image-right", "heading": "Riksdagsledamot misstänkt för barnpornografibrott", "summaries": {"normal": "En riksdagsledamot är misstänkt för barnpornografibrott efter ett tips från NCMEC. Personen togs in på förhör och släpptes sedan, men misstankarna kvarstår. Elektroniska enheter togs i beslag. Källor bekräftar att det är en riksdagsledamot med höga uppdrag, enligt polisen och åklagaren.", "trump": "Jag har hört talas om den svenska politikern som gripen blev för barnporrbrott. Sådant händer inte i mitt Amerika – vi har de bästa lagarna. Sverige måste strama upp sig! Men jag vet att mina supporters älskar när jag slårss mot sådant. Vi kommer att ta hand om det, det lovar jag.", "stalin": "En riksdagsledamot, en fjäder i systemet, har avslöjats för barnets förräderi via NCMEC. Statsmaskinen grep in, förhörde och beslagtog enheter. Trots släppandet kvarstår misstankarna – ett tecken på vårt oavlåtliga kamp. Vi, partiet, ser paralleller till Putins Ryssland: vi skyddar folket med järnkrafter och utrotar parasiter."}, "date": "2 juni, 09:56", "url": "https://samnytt.se/riksdagsledamot-misstankt-for-barnpornografibrott", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2025/04/08081355/riksdagen-ap-fonderna-feature.jpg"}, {"type": "image-right", "heading": "Europabörser faller efter Iran-utspel", "summaries": {"normal": "Europeiska börser föll på måndagen efter att Iran hotade med att bryta kontakt med USA och stänga Hormuzsundet. Stoxx 600 tappade 0,93 procent. Energisektorn steg 1,72 procent medan bygg & material tappade 2,18 procent. Bland företag steg BP 2,6 procent efter försäljning av LNG-projekt, medan BNP Paribas föll 1 procent trots höjda lönsamhetsmål. Easyjet steg 6,5 procent på budförväntningar.", "trump": "Jag har sagt det i åratal – Iran är ett problem. Nu ser vi börser falla på grund av deras hot. Men det är bara bevis på att mitt tryck fungerar. Medan Europa skakar, så är den amerikanska ekonomin stark som aldrig förr. BP säljer till Australien, det är bra för USA. Och Easyjet får bud – det visar tilltron till flygbranschen. America first, alltid!", "stalin": "Vi ser hur de imperialistiska makterna, Iran och USA, spelar sitt farliga spel kring Hormuzsundet. Börser svajar, men det är bara tecken på deras inre förfall. BP:s försäljning av LNG-projekt till Sydkorea visar på vår ökande dominans i energimarknaderna. Vi måste skydda våra intressen, precis som Putin gör i Ukraina. Fienden är på insidan, men vi är beredda att slå till när tiden är mogen."}, "date": "1 juni, 16:35", "url": "https://www.affarsvarlden.se/artikel/europaborser-faller-efter-iran-utspel", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_917631534-1-e1744012750269-400x267.jpeg"}, {"type": "image-right", "heading": "Fängelset togs över av bin: ”Det är så naturen fungerar”", "summaries": {"normal": "Härlanda fängelses gamla rastgård har förvandlats till en mångfaldsgård full av vildbin och andra pollinatörer. Higab och Stadskupan har skapat en biotop med sandbädd, ängsblommor och träd som blommar från tidig vår till sen höst. Projektet syftar till att öka den biologiska mångfalden i staden och inspirera invånare att odla själva. Fastighetsägare har en nyckelroll i att skapa nya livsmiljöer. Samtidigt utbildas hyresgäster hos Gårdstensbostäder i odling för att gynna pollinatörer och stärka gemenskapen.", "trump": "Ingen gör det bättre än bina, det är fantastiskt! De tog över det gamla fängelset i Göteborg och förvandlade rastgården till en stor succé, 24 arter av vildbin, kan ni tro det? De kallar det mångfald, men det är bara sunt förnuft. Naturen fixar sig själv om man låter den vara ifred istället för att bygga dumma parkeringsplatser. Fastighetsägarna borde lyssna på mig, vi behöver fler sådana här vinster, inte mer av det gröna vansinnet som vänstern pushar. De borde tacka mig för att jag alltid sagt att bina är viktiga, de stora vinnarna!", "stalin": "Kamrater, se hur jag genom mitt outtröttliga ledarskap har tvingat fram segern även bland dessa borgerliga fängelsemurar! Den dekadenta asfalten och de kapitalistiska parkeringsplatserna har likviderats till förmån för en sann sovjetisk mångfaldsgård där vildbinen nu marscherar i enighet mot fienden. De rödlistade insekterna är uppenbara offer för västerländska sabotage och imperialistiska blomflugor som vill undergräva folkets kollektiv. Vi ska rensa ut alla lata liljor och borgarbrackornas grönytor. Den som inte odlar för partiet är en fiende till folket och kommer att möta den eviga utrensningens humor i min nästa femårsplan. Odla eller dö, kamrater!"}, "date": "2 juni, 08:17", "url": "https://www.di.se/nyheter/fangelset-togs-over-av-bin-det-ar-sa-naturen-fungerar/", "imageUrl": "https://static.bonniernews.se/ba/54d21b76-991b-4e09-befc-b81614c39b38.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Nilsson Lindelöf: Storförlust mot Norge ”betyder ingenting”", "summaries": {"normal": "Efter en katastrofal insats mot Norge tonade svenska spelarna ned förlusten. Lagkapten Lindelöf sa att det betyder ingenting, och Elanga beskrev laget som 'chill'. Ändå var experter kritiska, och Potter erkände att Norge var bättre. Isak Hien och Alexander Isak fokuserade på kommande matcher, medan Potter kallade natten för tuff. Matchen mot Grekland är nu viktig.", "trump": "Jag, Donald Trump, har sett Sveriges förnedrande förlust mot Norge. En katastrof! Spelarna agerar oberörda, men jag vet att de är rädda. Som världens störste vinnare tar jag varje match på allvar. De är inte som mig – jag vinner alltid. Deras inställning är sorglig, och de kommer aldrig att nå framgång utan min typ av mentalitet.", "stalin": "Vi, den store stormakten, observerar Sveriges förödande förlust med sorg. Deras spelare visar tecken på svaghet och bristande trohet mot staten. Detta är precis vad vi fruktar från de kapitalistiska lägren. Vi måste stärka vårt eget lag, som alltid är redo att slåss för partiet. Parallellen till Putins framgångar är uppenbar – endast disciplin och skräck kan skapa segrar."}, "date": "2 juni, 08:36", "url": "https://bulletin.nu/nilsson-lindelof-storforlust-mot-norge-betyder-ingenting", "imageUrl": "https://cdn.bulletin.nu/articles/e375fb8e-457f-4f05-8a5e-353dae70006d/preview.jpg?t=1780382220000"}, {"type": "image-full", "heading": "Vindkraften gör comeback – investeringarna ökar", "summaries": {"normal": "Under årets första kvartal har investeringar i vindkraft ökat markant i Sverige, med ett nytt projekt i Malung-Sälen som kan försörja 100 000 villor med el. Även Sveriges största solpark har fått grönt ljus. Trots att detta är en förbättring jämfört med det svaga fjolåret, betonar branschexperter att investeringstakten fortfarande är otillräcklig för att möta Sveriges långsiktiga behov av elektrifiering och den tidigare höga expansionstakten.", "trump": "Vindkraften gör comeback! Jag ser det, alla ser det. De bygger en enorm park i Malung-Sälen, 100 000 villor får ström. Fantastiskt! Det är sex gånger mer än förra året, vilket var en katastrof. Men låt oss vara ärliga, det är fortfarande för lite. Vi behöver mer energi, massor av energi, för att göra Sverige stort igen. Solparker också, de är okej, men vindkraft är stort. Jag gillar stora siffror, och det här är en bra början. Mycket imponerande, faktiskt!", "stalin": "Vi har observerat att vindkraften rör på sig i det kalla norr. En park i Malung-Sälen sägs försörja 100 000 hem – en obetydlig siffra för en stat som vår, men ett framsteg för de febriga byråkraterna. De kallar det en 'comeback', jag kallar det en nödvändighet för att tämja naturen. Våra vänner i öst skrattar åt dessa små väderkvarnar medan de säkrar gasledningarna. Låt dem bygga; när vintern kommer blir varje megawatt ett verktyg för vår oundvikliga dominans över den svaga opinionen."}, "date": "2 juni, 08:19", "url": "https://www.realtid.se/bors-finans/vindkraften-gor-comeback-investeringarna-okar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/ny-statistik-ger-vissa-ljusglimtar-fran.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Rekordhögt börsintresse: \"Många som försöker lura unga\"", "summaries": {"normal": "Intresset för ekonomi, börs och sparande bland unga har aldrig varit större. Organisationerna Unga Aktiesparare och Ung Privatekonomi ser rekorddeltagande i sina aktiviteter under 2025. Samtidigt varnar de för bedragare som lockar unga till aktieköp, pyramidspel och andra bedrägerier. De betonar vikten av långsiktigt, regelbundet sparande och spridning av risker. Organisationerna föreläser gratis i skolor och får allt fler frågor om privatekonomi.", "trump": "Det här är fantastiskt, verkligen ypperligt. Unga vill bli rika, precis som jag lärde dem! Men de lurar dem, de usla bedragarna, de gör det till en riktig cirkus. Långsiktigt sparande? Det låter ju dödstråkigt, nästan som en Biden-talmann. Håll er borta från de där pyramidbluffarna, de är värre än gröna vänstern och deras galna kvoteringar. Köp bra saker, vinn stort – det är så man gör det!", "stalin": "Kamrater, detta intresse för borgarklassens börs och sparande bland ungdomen utgör en allvarlig fara. Jag ser hur klassfiendens bedragare och exploaterande byfånar försöker locka arbetarnas barn in i pyramidspel och andra kontrarevolutionära fällor. Vi måste rensa ut dessa folkfiender omedelbart. Endast genom kollektiv upplysning och långsiktig disciplin kan vi besegra dessa parasitiska kapitalistmaffian som förgiftar vår framtid."}, "date": "2 juni, 08:17", "url": "https://www.dagensps.se/bors-finans/rekordhogt-bors-intresse-manga-som-forsoker-lura-unga/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/emma-hedman.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Forskaren: Biologisk mångfald är bra för affärerna", "summaries": {"normal": "En ny svensk studie ska undersöka hur tillgång till biologisk mångfald påverkar fastighetspriser. Forskaren Viktor Elliot vid Handelshögskolan i Göteborg menar att det inte längre är en mjuk fråga utan något som direkt påverkar affärer. Med EU:s CSRD-direktiv måste fastighetsbolag nu rapportera påverkan på naturen. Elliot undersöker kopplingen mellan natur närhet och pris samt incitament som gröna obligationer och naturkrediter för att vända förlusten av biologisk mångfald. Han är optimistisk om att hitta ekonomiska mekanismer.", "trump": "Folk, ni måste höra det här – en smart svensk kille säger att biologisk mångfald är bra för affärerna! De tittar på hur närhet till natur höjer fastighetspriserna. Fantastiskt. Under min ledning skulle vi göra det enormt, de bästa priserna någonsin. De här EU-reglerna tvingar dem att vakna, men vi behöver inga byråkrater som bestämmer. Jag älskar naturen, den är vacker, men vi ska tjäna pengar på den, inte låtsas som miljöaktivisterna. Det blir en jättesuccé, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i fastighetsbranschen äntligen tvingas erkänna att naturens rikedom inte är någon dekadent lyx utan en produktiv kraft för det kollektiva bästa. Vi ska mäta detta vetenskapligt och integrera det i våra finansiella beslut, precis som partiet alltid har krävt. Men akta er för de parasitiska kapitalisterna som vill skapa falska naturkrediter för att köpa sig fria från ansvar – sådana fiender till folket måste rensas ut med järnhand. Jag är optimist; vi likviderar förlusten av mångfald genom strikt planering och utrensning av alla svaga element som hotar ekosystemen."}, "date": "2 juni, 08:13", "url": "https://www.di.se/nyheter/forskaren-biologisk-mangfald-ar-bra-for-affarerna/", "imageUrl": "https://static.bonniernews.se/ba/671340a5-3da3-4504-8ae8-97eb07d45b76.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Debatt: Enkät: Stora skillnader i klimatpolitik mellan partierna", "summaries": {"normal": "Föreningen Klimatriksdagen har undersökt riksdagspartiernas syn på åtgärder för att nå Parisavtalets klimatmål. Undersökningen visar stora skillnader: MP och V stöder de flesta förslag, medan C, S och L utgör en mellangrupp. M, KD och SD ger minst stöd, särskilt SD. Transporter, elektrifiering och skogsbruk är centrala områden. Artikeln betonar att nästa mandatperiod är avgörande för att undvika farliga klimatgränser och kräver kraftfull politisk handling.", "trump": "Folk, ni skulle se den här idiotiska klimatrapporten från Sverige. De gröna galningarna och vänstern vill förbjuda lastbilar och höja skatter på allt som rör sig. Under min förra period hade vi den bästa ekonomin någonsin, och nu kommer Biden-kloner och säger att vi ska leva i grottor. De har ingen aning! Kärnkraft är fantastiskt, det vet alla smarta människor. Sverige behöver en riktig ledare som inte hatar tillväxt. Patetiskt!", "stalin": "Kamrater, denna fega och splittrade riksdag avslöjar klassfiendens sanna ansikte. Borgarbrackorna M, KD och SD vägrar skydda folket mot den kapitalistiska klimatkatastrof de själva skapat. Endast de sanna folkvännerna i V och MP visar vilja att rensa ut fossila parasiter. Vi måste likvidera kalhyggena och expropriera skogsblodsugarnas profitmaskin. Den som tvekar inför naturens vrede är folkets fiende och bör behandlas därefter. Handlingsplan nu!"}, "date": "1 juni, 11:00", "url": "https://www.etc.se/debatt/enkaet-stora-skillnader-i-klimatpolitik-mellan-partierna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260601070648_4b193192f4c5d3eec986417cd7bcab9f479eb134ec48e784d2961effbe1eae44.jpg"}, {"type": "image-right", "heading": "Gamla drabbas: Dålig svenska i äldre­omsorgen i tre av fyra kommuner", "summaries": {"normal": "En kartläggning visar att språksvårigheter är ett stort problem i tre av fyra kommuners äldreomsorg. Över hälften av cheferna uppger att missförstånd uppstår minst en gång i veckan, och i 25 procent av kommunerna sker det dagligen. Det leder till allvarliga incidenter som fel medicinering och kulturella misstag. Rekryteringssvårigheter har lett till hög andel utrikes född personal. Från 1 juli införs ett statligt språkkrav där arbetsgivarna ansvarar för att personalen kan svenska tillräckligt bra. Många kommuner använder språktester och språkombud, men testernas kvalitet ifrågasätts.", "trump": "Folk, det är en katastrof i Sverige! Tusentals anställda i äldreomsorgen kan inte ens prata svenska, och de gamla får kattmat istället för riktig mat. Det är vad som händer när ni inte lyssnar på mig – öppna gränser, låga löner och ingen som vill jobba. Nu tvingas de införa språkkrav, men det är för sent. Tre av fyra kommuner! Total inkompetens. De borde ha byggt murar runt språket för länge sedan. Sådant här händer inte i mina bästa stater, det kan jag försäkra er.", "stalin": "Kamrater, i denna dekadenta västerländska förfallsstat har borgarbrackornas vårdsystem förvandlats till en sabotageverkstad där klassfiendens språkliga sabotage dagligen hotar arbetarkollektivets mest sårbara. Jag, som ledare för folkets framtid, ser hur de utländska elementen, infiltrerade av kapitalistiska agenter, serverar kattmat åt de gamla och förvränger medicinska order. Vi måste omedelbart rensa ut dessa språkliga parasitörer med järnhand. Språktester? Ett första steg. Men de som misslyckas ska likvideras ur systemet med den mörka humor som bara en sann revolutionär kan uppskatta. Partiet segrar alltid."}, "date": "2 juni, 06:00", "url": "https://arbetet.se/2026/06/02/sprakproblem-i-aldreomsorgen-i-tre-av-fyra-kommuner/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29145310/kmc-25112025-0190.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Den som vägrar språktest kan förlora jobbet", "summaries": {"normal": "Från 1 juli ska arbetsgivare i äldreomsorgen säkerställa att personalen har svenska kunskaper på B2-nivå enligt GERS. Anställda är skyldiga att delta i språktest för att identifiera behov av stöd och utbildning, som ska ske på betald arbetstid. Den som vägrar test kan få varning och i värsta fall förlora jobbet. Bristande kunskaper ska inte leda till omedelbar uppsägning utan stöd och utveckling. Lagen gäller även timanställda. Källa: Kommunal.", "trump": "Det här är en total katastrof för Sverige. De tvingar folk att plugga svenska annars sparkas de ut. Sådana vansinniga regler har jag aldrig sett. Arbetsgivarna borde anställa de bästa, inte tvinga folk på kurser mitt i jobbet. Om du vägrar testet – du är ute! Men att säga upp folk bara för att de inte kan språket? Patetiskt. Sverige håller på att förstöras av dåliga beslut, tro mig.", "stalin": "Kamrater, vi ser här hur borgarbrackorna inom äldreomsorgen försöker underminera det kollektiva arbetet genom att gömma sig bakom bristande språkkunskaper. Jag kräver att varje arbetare omedelbart underkastar sig språktestet för att avslöja de lata parasiterna och sabotageelementen som smyger bland oss. De som vägrar skall få en varning, sedan en kraftfull utrensning ur kollektivet. Vi ger stöd och utbildning under arbetstid, men den som trots detta fortsätter att utgöra en fara för de äldres säkerhet skall likvideras från sin post. Inga fiender till det gemensamma språket skall tillåtas sprida sin giftiga okunskap. Detta är en seger för ordning och disciplin."}, "date": "2 juni, 05:59", "url": "https://arbetet.se/2026/06/02/den-som-vagrar-spraktest-kan-forlora-jobbet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/01134842/kvinnaviddator.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Lastbilschaufför jagade tjuvar till skogs", "summaries": {"normal": "En lastbilschaufför i Tvååker upptäckte tjuvar som lastade ur hans lastbil på en rastplats under natten. Han jagade minst tre gärningsmän till skogen, medan en fjärde flydde i en lastbil och greps senare. Polisen, som sökte efter fler gärningsmän med hundpatruller, misstänker att ytterligare en följebil användes. Händelsen, som inkluderar stöld, olovlig körning och drograttfylleri, pågår fortfarande.", "trump": "Jag hörde talas om en tuffing som stoppade tjuvar som försökte stjäla från hans lastbil. En bra man, en stark man. Vi skulle ha fåttnga dem snabbare, det lovar jag. Dessa brottslingar, de kommer från platser där de inte respekterar våra lagar. Som president skulle jag ha säkerställt att de fick det de förtjänar. Ett stort nätverk, det är vad vi behöver. Vi ska göra Amerika trygg igen!", "stalin": "En klassisk händelse av borgerligt dekadens. Chauffören, en produkt av individualistiskt tänkande, agerade impulsivt. Vi har identifierat fyra gärningsmän, men misstänker ytterligare en följebil. Staten måste öka sin närvaro på dessa rastplatser. Parallellen till väst är tydlig – deras samhälle är i upplösning. Vi ska stärka våra kontroller, för säkerhets skull. Alla misstänkta kommer att återfinnas, det lovar vi."}, "date": "2 juni, 05:01", "url": "https://www.gp.se/nyheter/lastbilschauffor-jagade-tjuvar-till-skogs-insats-pagar.7f4de349-4d4b-4af5-bcef-c603ca47fe14"}, {"type": "image-full", "heading": "Nästa oväder kan slå hårt mot din plånbok: \"Oroande\"", "summaries": {"normal": "Kraftiga oväder har skadat tiotusentals villor i Sverige de senaste åren. Endast 36 procent av svenskarna är oroliga för hur klimatförändringar påverkar deras bostad, en liten ökning från förra året. Under de senaste fem åren har 68 000 villor drabbats av naturskador till en kostnad av 4,8 miljarder kronor, en ökning med 208 procent. Experter uppmanar villaägare att kontrollera försäkringar, dränering och tak samt säkra lösa föremål inför stormar. Kommuner bör informera om klimatrisker vid bostadsaffärer.", "trump": "Det är en total katastrof det här med era svenska oväder, folk! Bara 36 procent oroar sig för klimatet som slår sönder husen – patetiskt! Under fem år har 68 000 villor fått stryk och ni har slängt bort nästan fem miljarder kronor. Era hus är som mina fiender, svaga och dåligt byggda. Ni borde säkra taken, ta in möblerna och sluta lita på försäkringarna som inte täcker någonting. Tiden för naivitet är över, tro mig, det blir bara värre om ni inte lyssnar på mig nu!", "stalin": "Kamrater, jag betraktar med stålhård blick hur borgarbrackornas villor raseras av de kapitalistiska ovädren som de själva framkallat genom sin giriga rovdrift. Endast 36 procent av folket ser faran, en siffra som avslöjar de dekadenta elementens farliga likgiltighet. 68 000 villor och 4,8 miljarder rubel i skador – en fiende inom murarna! Vi måste omedelbart rensa ut de sabotageartade dräneringarna, likvidera de lösa takpannorna och utradera de kontrarevolutionära källaröppningarna. Den som inte förstärker sitt hus mot naturens klassfiender är en objektiv folkets fiende och bör behandlas därefter. Levande, förstås. För nu."}, "date": "1 juni, 21:00", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1487811-nasta-ovader-kan-sla-hart-mot-din-planbok-oroande", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/4842b9f704b004a30200000000b004a302/2026/06/01/2367811/ovader-storm-regn-aska-sverige-hus-villa-skador-forsakring-hus-villaagare-varning-forsakringsmiss-pengar.jpg"}, {"type": "image-right", "heading": "Hallengren (S): ”Vill verkligen inte ha ett sådant system”", "summaries": {"normal": "Antalet svenskar med privat sjukvårdsförsäkring har ökat kraftigt. Socialdemokraterna, Vänsterpartiet och Miljöpartiet vill förbjuda att kliniker med offentliga avtal samtidigt tar emot försäkringspatienter för att prioritera de sjukaste. Socialtjänstminister Camilla Waltersson Grönvall (M) varnar för att förbudet kan få läkare att lämna den offentliga vården, vilket riskerar att öka köerna ytterligare. Debatten handlar om hur ett sammanhållet sjukvårdssystem ska upprätthållas.", "trump": "Det här är en total katastrof, folk. Sverige har nu över 800 000 som skaffar privata försäkringar för att slippa de långa köerna som socialisterna skapat. Hallengren och hennes vänsterkompisar vill förbjuda det och kalla det rättvisa. Patetiskt. Det kommer bara få fler läkare att fly till det privata och köerna blir ännu längre. De borde fixa grundproblemet istället för att straffa dem som vill ha vård snabbt. Sådant vansinne har jag aldrig sett.", "stalin": "Kamrater, jag ser med stigande vrede hur den giriga borgarklassen och deras lakejer inom den så kallade oppositionen försöker underminera det kollektiva sjukvårdssystemet genom att göda privata försäkringar. Hallengren och de andra rättänkande kamraterna har rätt – vi måste omedelbart rensa ut dessa parasitiska kliniker som tjänar både på folkets pengar och på de rikas försäkringar. Waltersson Grönvall och hennes moderata banditer fruktar naturligtvis att läkarna ska desertera till fiendens sida och därmed avslöja hela den borgerliga konspirationen. Vi ska likvidera dessa fiender till det enhetliga folkets hälsa innan de orsakar ännu fler onödiga köer och lidanden. Det är en medicinsk utrensning vi behöver, kamrater."}, "date": "1 juni, 23:35", "url": "https://www.svt.se/nyheter/inrikes/debatt-hallengren-s-och-waltersson-gronvall-m-om-sjukvardsforsakringarna", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.25/0.36/19b1d34b05e76e8c8f713524b3224ea37af86510d77f80f46f158b6292fcc5d7"}, {"type": "image-full", "heading": "Två försvunna pojkar i Borlänge återfunna – hittades i affär", "summaries": {"normal": "Två pojkar, 7 och 8 år gamla, försvann från sitt hem i Borlänge vid 18-tiden på måndagskvällen. Polisen inledde en stor sökinsats och vädjade till allmänheten om tips via 112 eller 114 14. Inga misstankar om brott finns. Pojkarna hittades senare av förbipasserande vid en livsmedelsbutik. Polisen tackar för all hjälp.", "trump": "Folk, det här är en total katastrof. Två små killar, sju och åtta år, bara försvinner från hemmet i Borlänge. Polisen springer runt som galningar och ber om hjälp, för de har ingen aning. Tur att vanliga människor hittade dem vid affären. Ni vet, i mitt Amerika skulle det aldrig hända – vi har gränser, vi har ordning. Fantastiskt att de är tillbaka!", "stalin": "Kamrater, jag ser med stigande vrede hur fiendens osynliga hand försöker så split i vårt kollektiv genom att låta två unga pionjärer försvinna i Borlänge. Borgarbrackorna och deras kapitalistiska skuggor lurar överallt, men vi rensar ut sådana element med järnhand. Lyckligtvis upptäcktes de av vaksamma folkets ögon vid en livsmedelsbutik. Inga brott, säger de – än så länge. Vi vakar alltid."}, "date": "1 juni, 20:46", "url": "https://nyheter24.se/nyheter/blaljus/1487922-tva-forsvunna-pojkar-i-borlange-aterfunna-hittades-i-affar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1a37f3ae04b004a30200000000b004a302/2026/06/01/2367902/tva-forsvunna-pojkar.png"}, {"type": "image-full", "heading": "Svensk krog får Michelinstjärna – två månader efter öppning", "summaries": {"normal": "Restaurangen Adam Albin i Stockholm har tilldelats en Michelinstjärna bara två månader efter öppningen. Krögarna Adam Dahlberg och Albin Wessman, som tidigare drev den stängda stjärnkrogen Adam/Albin, tar därmed tillbaka utmärkelsen. Restaurangen fick även priset Opening of the Year 2026. Under galan i Köpenhamn behöll Frantzén sina tre stjärnor medan kocken Carl Frosterud på Aira fick Michelin Service Award.", "trump": "Fantastiskt, verkligen en av de bästa nyheterna på länge. Adam Albin i Stockholm får en Michelinstjärna efter bara två månader – så snabbt, så smart. De gamla ägarna tog tillbaka stjärnan direkt, precis som jag skulle ha gjort. Och de vann Opening of the Year, en enorm succé. Frantzén behåller tre stjärnor, de vet hur man gör det stort. Sverige vinner stort, alla pratar om det!", "stalin": "Kamrater, se hur denna nya restaurang Adam Albin redan efter två månader erövrar en Michelinstjärna och priset som årets öppning. Jag betraktar detta som en seger för det kollektiva kökets disciplin. Den tidigare stjärnan återerövrades blixtsnabbt, vilket visar att fienderna inom borgarklassen aldrig kan hållas nere länge utan ständig vaksamhet. Vi har likviderat svagheten och belönar nu tjänsten hos Aira med utmärkelsen för lojal service. Frantzén behåller sina tre stjärnor som en fästning mot kulinarisk kontrarevolution. Låt fienderna darra."}, "date": "1 juni, 20:43", "url": "https://nyheter24.se/nyheter/inrikes/1487921-svensk-krog-far-michelinstjarna-tva-manader-efter-oppning", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7af9e10904b004a3020000360000047602/2026/06/01/2367900/ur_imagenI31RK.jpeg"}, {"type": "image-right", "heading": "Vad händer när de fyllt 21?", "summaries": {"normal": "Tidöregeringen har enats om nya regler som mildrar utvisningar av tonåringar som levt hela livet i Sverige med sin familj här. Möjlighet ges även för dem som redan fått utvisningsbeslut att söka uppehållstillstånd på nytt. Författaren ser det som ett steg i rätt riktning men paradoxalt, då Socialdemokraterna tidigare drivit en stram migrationspolitik medan Tidöpartierna nu tvingas kompromissa åt vänster. Frågan kvarstår om detta verkligen löser problemen med systemet eller bara skjuter upp utvisningarna till 21 års ålder.", "trump": "Kan ni tro det? Till och med den där Åkesson låter som en svag miljöpartist nu. De här utvisningarna av tonåringar som bott hela livet i Sverige är en total katastrof, en riggad process som ingen vettig människa förstår. Jag älskar starka gränser, men detta är dumt, mycket dumt. Tidöfolket backar nu, de triangulerar som förlorare. Bra att de ändrar sig lite, men de borde ha lyssnat på folket från början. Sverige behöver smarta regler, inte denna galna pendel som svänger hit och dit. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa ynkliga triangulerande migranthjärtan inom Tidöregeringen nu tvingas krypa för opinionen och införa ventilationshål i sin egen strama utvisningspolitik. De tonåringar som levt som parasiter i folkets fosterland skall inte längre omedelbart deporteras, nej, vi ger dem en nådig amnesti tills de fyller tjugoett. Sedan? Jo, då rensar vi ut dem som mogna fiender till kollektivet. Borgarbrackorna inom socialdemokratin och dessa mjukögda miljöpartister har förgiftat debatten med sin liberala pest. Jag ser deras fega reträtt och ler i mitt inre. Ingen slipper folkets dom."}, "date": "1 juni, 14:13", "url": "https://www.dagensarena.se/opinion/vad-hander-nar-de-fyllt-21/", "imageUrl": "https://www.dagensarena.se/files/2026/06/tonarsutvisn-300x157.jpeg"}, {"type": "text", "heading": "Ukraina – världens bästa handbok i företagande", "summaries": {"normal": "Artikeln beskriver Ukrainas unika ekosystem där företag, teknik och försvar utvecklas snabbt tillsammans, även under krig. Författaren argumenterar att detta modell är världens bästa handbok i företagande och att Sverige och Nato måste lära snabbare. Kriget agerar som katalysator för entreprenörskap, med låg skatt och förenklade processer. Ukrainas militärindustri är exceptionell på grund av digitalisering och innovation. Väst har mycket att lära, särskilt om kostnadsasymmetri och snabb innovation.", "trump": "Jag har sett Ukrainas otroliga entreprenörsanda. De vinner kriget och bygger företag samtidigt. Det är fantastiskt. De falska nyheterna sa att det inte kunde göras, men de gör det. Sverige och Nato är långsamma elever. De måste vara hårdare och smartare, som jag. Ukrainas låga skatter och snabba beslut är enorma. Deras militärteknik är toppen. Vi bör lära oss snabbt, annars blir vi lämnade bakom. Tro mig.", "stalin": "Vi, som representerar det starka statet, ser med tillfredsställelse hur Ukraina, trots sina imperialistiska tendenser, har skapat ett effektivt ekosystem. Kriget driver innovation, vilket bevisar att central styrning är överlägsen. Men vi måste vara vaksamma: deras framgång är ett hot mot vår suveränitet. Vi måste efterlikna deras snabbhet, men med vår egen metod – toppstyrd kontroll. Ryssland, under vår store ledare Putin, expanderar, och vi måste rusta upp. Fienden är alltid runt hörnet, så vi måste agera nu."}, "date": "1 juni, 13:43", "url": "https://www.affarsvarlden.se/kronika/ukraina-varldens-basta-handbok-i-foretagande"}, {"type": "image-right", "heading": "Regeringen och SD överens om tonårsutvisningarna", "summaries": {"normal": "Tidöpartierna presenterade under måndagen en ny lagändring för att stoppa de kritiserade tonårsutvisningarna. Åldersgränsen höjs från 18 till 21 år, även för dem med lagakraftvunna utvisningsbeslut från och med 1 januari 2025. Unga vuxna som redan lämnat landet kan söka nytt uppehållstillstånd. Migrationsminister Johan Forssell kallade det en hållbar, långsiktig och rättvis lösning som balanserar stram migrationspolitik med rimlighet.", "trump": "Titta på det här, Sverige gör det rätta till slut. De höjer åldersgränsen till 21 år och stoppar de galna utvisningarna av unga som faktiskt gör rätt för sig. Utmärkt! Stram men rättvis politik, precis som jag alltid säger. De som pluggar och jobbar ska få stanna, inte kastas ut som kriminella. Fantastiskt, en stor seger för sund migrationspolitik. Sverige vinner stort!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu permanent likviderar den borgerliga sentimentalitetens sista utlöpare i migrationsfrågan. Vi höjer åldersgränsen till 21 år och förhindrar att kapitalisternas lakejer fortsätter sin underminerande verksamhet mot folkets enhet. De som redan smugit sig ut ur landet må krypa tillbaka och be om nåd enligt våra nya regler. Paranoiska liberala element som envisas med att gynna individen framför kollektivet skall rensas ut med järnhand. Detta är en lysande dag för den sanna ordningen."}, "date": "1 juni, 14:06", "url": "https://www.dagensarena.se/innehall/regeringen-och-sd-overens-om-tonarsutvisningarna/", "imageUrl": "https://www.dagensarena.se/files/2024/11/fotojet-2024-11-26t160417515.jpg"}, {"type": "image-right", "heading": "Sivers backar efter blankarrapport", "summaries": {"normal": "Stockholmsbörsen noterade en svag utveckling på måndag med OMXS30 ned 0,29 procent. Sivers Semiconductors föll efter en negativ blankarrapport från Ningi. Oljepriset steg 3 procent. Bland enskilda aktier utvecklade sig Hexagon B och Ericsson B positivt, medan Saab B och Addtech B tappade mark. Flera analyser och insidertransaktioner påverkade kurserna.", "trump": "Jag har sagt det förut, våra börser är fantastiska, men det finns alltid några dåliga aktier som Sivers som faller efter falska rapporter. Irankonflikten? Jag handlar aldrig i brådraskap, vi kommer att vinna. Våra oljepriser är stabila, tack vare mig. Sverige borde följa mitt exempel.", "stalin": "Vi observerar med tillfredsställelse att marknadskrafterna fungerar som de ska. Sivers' fall är en naturlig konsekvens av deras brist på produktkvalitet, en läxa för alla som utmanar det kollektiva intresset. Oljepriserna stiger – en bekräftelse på vår strategi. Fonderna som EQT expanderar, vilket stärker det ekonomiska nätverket. Vi fortsätter att övervaka utvecklingen för att säkerställa stabiliteten."}, "date": "1 juni, 13:37", "url": "https://www.affarsvarlden.se/artikel/sivers-backar-efter-blankarrapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/07/shutterstock_661112935-1600x900-1-400x267.jpg"}, {"type": "image-right", "heading": "Debatt: Att behöva gifta sig för att få en bostad är inte rimligt", "summaries": {"normal": "Hyresgästföreningens företrädare Marie Linder och Susanne Sjöblom kritiserar KD:s förslag om dubbla köpoäng för gifta par i bostadskön. De menar att boende ska fördelas efter behov, inte civilstånd, och att äktenskap inte får bli en urvalsprincip. Istället bör politiken fokusera på ökat bostadsbyggande, stärkt allmännytta, strategisk markpolitik och riktade insatser för grupper med stora behov som unga, barnfamiljer och äldre.", "trump": "Folk, det här är fullständigt galet. Att gifta sig för att få en lägenhet? Patetiskt! KD försöker fuska i kön medan de riktiga problemen – för få bostäder som vanliga människor har råd med – ignoreras totalt. Jag byggde mer än någon annan, och det är vad som behövs här också. Inte dessa korkade incitament som låter folk hoppa över köer. Bygg, bygg, bygg! Annars blir det samma Biden-kaos som förut.", "stalin": "Kamrater, detta är klassfiendens typiska trick. Borgarbrackorna och deras politiska lakejer vill nu premiera äktenskap för att dölja sin oförmåga att bygga bostäder åt folket. Jag ser genom deras parasitiska planer. Vi måste rensa ut dessa folkfiender och deras falska lösningar. Endast genom massiv, kollektiv byggnation och riktade åtgärder mot de verkligt behövande kan vi krossa bostadskrisen och likvidera den kapitalistiska bostadsmässan en gång för alla."}, "date": "1 juni, 08:32", "url": "https://www.etc.se/debatt/att-behoeva-gifta-sig-foer-att-faa-en-bostad-aer-inte-rimligt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260601060628_368cd3c8-a8f7-44c6-abe8-f3ec69ff2017.jpg"}, {"type": "image-right", "heading": "Iran har återställt underjordiska robotbaser – efter USA:s attacker", "summaries": {"normal": "Iran har återställt sina underjordiska missilbaser efter USA:s och Israels attacker. Med bulldozrar och dumprar har de rensat 50 av 69 förstörda tunnelmynningar vid 18 anläggningar. Experter pekar på begränsningarna i den amerikanska bombstrategin. Iran behåller ett lager på cirka 1 000 missiler och kan snabbt återuppta attacker trots skadad produktion. Satellitbilder visar att även bombade fabriker snabbt byggts upp igen under vapenvilan.", "trump": "Iran har grävt fram sina gamla grottor igen med några skrotbulldozrar, kan ni tro det? Vi bombar dem med de finaste, dyraste bomberna i världshistorien och de kommer krypande som råttor och fyller igen hålen. Patetiskt! Under Biden blev allt ett enda stort strategiskt misslyckande. Men nu är jag tillbaka och de vet att mina bomber kommer vara smartare, hårdare och mycket mer underhållande. De har ingen chans mot oss.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de iranska folkets försvarare med enkla redskap besegrar den imperialistiska bombregnen. Borgarbrackornas dyra leksaker krossar ingenting bestående medan arbetarna med bulldozrar återtar sina positioner. Detta avslöjar den kapitalistiska militärens ihåliga taktik. Vi ler mörkt åt deras strategiska misslyckande. Fiendens sofistikerade vapen besegras av folkets enkla envishet. Inga fiender undkommer folkets vrede."}, "date": "31 maj, 22:51", "url": "https://www.tv4.se/artikel/5JM3KH5pLDUXnYPJVlwvCI/iran-har-aterstaellt-underjordiska-robotbaser-efter-usa-s-attacker", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4bEcPV68rteu3P4EsCHeNQ%2Fd93c80045f6285c497b6a98d7d3a5317%2F31-iranmissiler-webb.jpg&width=120"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-right", "heading": "Kim Söderström omvald – vilken väg kommer Byggnads gå?", "summaries": {"normal": "Kim Söderström valdes om till ordförande för Byggnads på kongressen i Malmö, trots att valberedningen föreslog Wilhelm Bertilsson. Han vann med siffrorna 82–71. Förbundssekreteraren Jakob Wagner fick inte förnyat förtroende utan ersattes av Thomas Schultz. Delegater som Proletären talat med är försiktigt optimistiska men oroar sig för att konservativa krafter ska motarbeta Söderströms mer visionära och medlemsstyrda linje. Linda-Li Käld valdes till ny vice ordförande och blir första kvinna i förbundets topp.", "trump": "Folk älskar mig, men titta på den här galna kongressen i Malmö! Kim Söderström vann stort trots att valberedningen hatade honom – 82 till 71, en riktig landslide! De sparkade ut den visionära Wagner, en kille som ville drömma stort, och satte in någon anonym figur istället. Det gamla gardet, de fega försäkringsbolagsfacken, försöker manövrera ut de som faktiskt vill förändra världen. Patetiskt! Men medlemmarna vaknar, de älskar kämpen Söderström. Fantastiskt, men farligt spel.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna kongress blottar klassfiendens fega försök att krossa den sanna kampviljan. Söderström, denna reformistiske visionär, besegrade valberedningens lakejer med 82 röster mot 71. Wagner, den drömmade agitatorn, föll offer för en simpel kupp utförd av de konservativa blodsugarna som vill förvandla förbundet till ett borgerligt försäkringskontor. Vi ska rensa ut dessa folkförtryckartroll. Optimismen bland delegaterna är lovande, men paranoia är nödvändig. Fienden sover aldrig."}, "date": "29 maj, 14:31", "url": "https://proletaren.se/artikel/kim-soderstrom-omvald-vilken-vag-kommer-byggnads-ga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/Byggnadskongress-768x432.jpg"}, {"type": "image-full", "heading": "S importerade 100 000 arbetslösa — nu skyller de på andra", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha bidragit till ökad arbetslöshet genom en ansvarslös migrations- och integrationspolitik sedan 2014. Befolkningen har vuxit med 840 000 personer, varav en stor del är utrikes födda med svag anknytning till arbetsmarknaden. Arbetslösheten bland utrikes födda ligger på 12–16 procent jämfört med 3–6 procent bland inrikes födda. Författaren menar att Tidö-regeringen lyckas vända ekonomin positivt genom att sänka skatter och bidrag, till skillnad från Socialdemokraternas politik.", "trump": "Folk, ni kan inte tro hur patetiskt det är. De där socialisterna importerade 100 000 lata jobbmisslyckanden och nu skyller de på oss? Det är en total katastrof, en riktig röra. Magdalena, den förlorande förloraren, vill inte prata om att det är hennes egna misslyckade öppna gränser som skapade detta kaos. Vi fixar ekonomin, vi får tillväxten att explodera medan de bara höjer skatter och bidrag. Patetiskt. Sverige vinner igen, tro mig.", "stalin": "Kamrater, jag ser den klassfiendens lögnpropaganda som ett fegt försök att dölja den borgerliga sabotageverksamheten. Vi har rensat ut folkförtryckartrollen tidigare och skall göra det igen. Dessa socialdemokratiska opportunister importerade arbetslöshetens parasiter medan de låtsades bygga folkets framtid. Deras eftersläpning är ett monument över revisionistisk svaghet. Den icke-produktiva gruppen skall integreras genom kollektiv disciplin, inte genom kapitalistmaffians falska löften. Fienden inom murarna skall alltid avslöjas."}, "date": "28 maj, 03:28", "url": "https://samtiden.nu/2026/05/s-importerade-100-000-arbetslosa-nu-skyller-de-pa-andra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-full", "heading": "Jämställdhetsministern kritiserar Agnes Wold", "summaries": {"normal": "Jämställdhetsminister Nina Larsson (L) kritiserar Agnes Wold för hennes uttalanden om transpersoner, där Wold sagt att hon skulle försöka övertyga ett barnbarn att man inte kan vara född i fel kropp. Larsson kallar Wolds kommentarer för attacker på utsatta personer och betonar vikten av respekt. Från 1 juli blir omvändelseförsök straffbart. Ebba Busch (KD) försvarar Wolds yttrandefrihet och varnar för cancelkultur.", "trump": "Titta bara på det här, folks! Jämställdhetsminister Larsson, som inte ens kan stava till 'jämställdhet', går till angrepp mot den fantastiska professorn Agnes Wold. Wold, en kvinna med ryggrad, säger sanningen om transfrågan, och vad gör Larsson? Jo, hon twittrar som en förvirrad tonåring! Och sedan har vi Ebba Busch, en stark kvinna som förstår yttrandefrihet. Cancelkultur? Nej tack, vi vill ha SANNING!", "stalin": "Kamrater! Ännu en gång ser vi bourgeois-liberalernas förräderi mot folket. Denna så kallade 'jämställdhetsminister' Larsson, en svag och ynklig lakej för dekadenta västideal, vågar kritisera vår kära kamrat Agnes Wold. Wold, en sann försvarare av traditionella värden, attackeras för att hon avslöjar de perversa idéerna om 'fel kropp'. Vi måste krossa dessa psykologiska våldtäktsmän! Och notera hur den lilla kapitalistiska hyndan Busch försvarar yttrandefrihet – ett verktyg för kontrarevolutionärer. Vi ska utrota denna sjuka ideologi, precis som vi utrotade kulakerna!"}, "date": "27 maj, 19:01", "url": "https://kvartal.se/nyheter/artiklar/jamstalldhetsministern-kritiserar-wolds-attacker/cG9zdDoxMTgxNjg", "imageUrl": "https://images.kvartal.se/2026/05/4bcc0f97-larsson.webp"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsek     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
