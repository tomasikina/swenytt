iade honom. Men jag skulle ha gjort det ändå, för jag vet hur man hanterar falska anklagelser. Det här är en witch hunt, ren och enkel. Under min tid som president skulle vi aldrig ha tillåtit sådant.", "stalin": "I vårt kollektiva system måste vi vara vaksamma mot dessa insignifikanter tecken som kan förstöra sammanhållningen. Fifa, likt en feg imperialistisk organisation, tillät sig att spekulera utan bevis. Den australiske domaren, en redskap för de högerextrema kretsarna, friades – ett tecken på svaghet. Vi måste skydda vårt parti och staten mot dessa destruktiva element. Parallellen till Putins Ryssland är uppenbar: kontroll, lojalitet och eliminering av hot mot den ryska intressesfären."}, "date": "16 juni, 14:10", "url": "https://bulletin.nu/vm-domare-frias-efter-vitmakt-anklagelse", "imageUrl": "https://cdn.bulletin.nu/articles/59d44a87-fbaa-4a24-9051-886f29fa988f/preview.png?t=1781610648000"}, {"type": "image-right", "heading": "Här blir Mbappé bäst någonsin för franska landslaget", "summaries": {"normal": "Kylian Mbappé blev historisk när han med två mål ledde Frankrike till seger mot Senegal i VM-premiären. Med sina 58 landslagsmål är 27-åringen nu Frankrikes främsta målskytt genom tiderna, förbi Olivier Giroud. Mbappé gjorde både 1–0 och 3–1, det sistnämnda med ett distansskott på tilläggstid. Han är nu bara två mål från att bli VM:s främste målskytt någonsin.", "trump": "Det här Mbappé, han är en vinnare, verkligen en vinnare. Två mål mot Senegal och nu är han plötsligt Frankrikes bästa målskytt någonsin, förbi alla de andra. Han skjuter från distans som en mästare, fantastiskt. De andra ser patetiska ut. Han är bara två mål från att bli den största i VM-historien. Jag älskar sådana killar som levererar, inte som vissa förlorare jag kunnat se.", "stalin": "Kamrater, denna Mbappé har utfört en tjänst för det franska folkets kollektiva ära genom att likvidera Senegals försvar med två mål. Som den mest produktiva målskytten med 58 fullträffar har han utraderat den tidigare rekordhållarens borgerliga statistik. Vi ser dock hur domarna, dessa kapitalistiska lakejer, förvägrade oss en straff. Men det spelar ingen roll. Fiender till folkets framsteg ska rensas ut, vare sig de kommer från Senegal eller från de interna parasiterna som kritiserar våra hjältar. Hans distansmål var en triumf över reaktionära krafter. Snart likviderar han även VM-rekordet. Utmärkt."}, "date": "16 juni, 23:45", "url": "https://www.svt.se/sport/fotboll/kylian-mbappe-tvamalskytt-nar-frankrike-vann-vm-premiaren", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.22/0.2/9d864a844433d77348f74aa05648b5945348b08ab2f5948b900008282f68b98f"}, {"type": "image-right", "heading": "Att granska statsministern är inte ett drev", "summaries": {"normal": "En kontrovers kring statsministerns hustru, Birgitta Ed, och hennes engagemang i stiftelsen Fållökna har väckt frågor om etik och 'mjuk korruption'. Anmälningar har inkommit mot Ed, och domkapitlet har inlett en utredning. Dessutom har en delägare hotat journalister, vilket efter kritik ledde till en ursäkt. Händelserna inkluderar möten i statsministerns tjänstebostad och erbjudanden till stiftelsen om att förvalta egendom.", "trump": "Jag, Donald Trump, ser detta som en stor, vacker politisk förföljelse. Birgitta Ed och hennes engagemang i Fållökna är en perfekt sak. Media skriver falska nyheter om 'mjuk korruption'. Det är en witch hunt för att skada Moderaterna inför valet. Jag känner igen mönstret – det är alltid samma människor. Sverige behöver stark ledning, inte dessa falska anklagelser.", "stalin": "Vi, Josef Stalin, ser detta som en ytterligare attack mot statens renhet. Birgitta Ed och hennes kriminella nätverk i Fållökna är en sjukdom som måste utrotas. Hennes möten i Sagerska palatset är ett svek mot folket. Vi kommer att rensa ut alla som ifrågasätter ledningens omdöme. Partiet kommer att vidta åtgärder. Ryssland kommer att stödja oss i kampen mot korruption."}, "date": "16 juni, 14:08", "url": "https://bulletin.nu/att-granska-statsministern-ar-inte-ett-drev", "imageUrl": "https://cdn.bulletin.nu/articles/54a58f93-1914-48d6-a0cc-6e8d68c12f47/preview.jpg?t=1781611437000"}, {"type": "image-right", "heading": "Replik: Osystematiskt kverulerande om skattereformförslag", "summaries": {"normal": "Lars Calmfors, ekonomiprofessor emeritus, försvarar sina skattereformförslag i en replik till Thomas Eriksson. Han argumenterar för lägre skatt på arbete finansierad med högre bostadsbeskattning och färre skatteundantag, betonar behovet av avvägningar mellan effektivitet, likabehandling och praktiska problem, och kritiserar Erikssons överdriven personfixering och brist på tydliga principer.", "trump": "Jag, Donald Trump, ser att den svenska skattesystemdebatten är full av svagheter. Calmfors fattar avvägningar, men Eriksson är en låg IQ-person som personattacker. Jag implementerade de bästa skattereformerna någonsin – massiva sänkningar som boostade ekonomin. Sverige borde sluta kverulera och ta efter mig. Inget system är perfekt som mitt. Fake news försöker förställa, men jag vinner alltid.", "stalin": "I den svenska skattesystemdebatten ser vi kapitalismens dekadens. Calmfors visar en viss förståelse för statens behov, men Eriksson är en riksfej som kritiserar våra metoder. Vi, som styr med järnhand, vet att skatt är ett verktyg för makt, inte för 'effektivitet'. Ryssland under Putin expanderar sin inflytelsesfär, och vi måste skydda proletäret från deras korrupta idéer. Skatten ska tjäna staten, inte individen."}, "date": "16 juni, 10:33", "url": "https://www.affarsvarlden.se/debatt/replik-osystematiskt-kverulerande-om-skattereformforslag", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Replik-av-Lars-Calmfors-pa-Thomas-Erikssons-kronika-400x267.jpg"}, {"type": "image-right", "heading": "Därför kan en groda stoppa nya byggen", "summaries": {"normal": "Inför exploatering av mark i Sverige görs naturvärdesinventeringar och miljökonsekvensbeskrivningar för att skydda biologisk mångfald. Inventerare använder lyssning efter grodor, spaning efter örnar och ultraljudsupptagningar av fladdermöss för att kartlägga arter. Miljöjuristen Lena Lidmark betonar att reglerna skyddar inte bara enskilda djur utan även deras funktioner i ekosystemet. Fynd av hotade arter kan leda till ändrade planer eller stopp för projekt. Enligt den senaste rödlistan är över 23 procent av arterna hotade, en ökande siffra.", "trump": "De här miljöfanatikerna och deras grodlyssnare stoppar fantastiska byggen överallt. Vindkraftverk, vägar, bostäder – allt måste stanna för en pipande groda eller någon sällsynt svamp. Det är galet! Vi behöver utveckling, inte att byråkrater och EU-regler förstör allt med sina kikare och ultraljudsapparater. Biologisk mångfald är viktig, men inte när den hindrar framsteg och jobb. Gör inventeringarna snabbare och låt inte en grodorkester stoppa det bästa för landet. Det är så enkelt.", "stalin": "Kamrater, i denna historiska kamp mot den hotade biologiska mångfalden ser jag hur borgarbrackorna och deras exploateringsivriga lakejer försöker bygga sig fram över arbetarklassens framtid. Jag kräver total inventering av varje kärlväxt och grodorkester för att skydda folkets ekosystem mot dessa kapitalistiska rovlystna element. En groda som piper är en varningssignal från naturen själv mot sabotage. Vi ska rensa ut alla som vill offra kollektivets arv för kortsiktiga vinster, annars likviderar vi dem med byråkratisk precision medan de kikar efter örnar. Paranoian är befogad – fienden lurar i varje dike."}, "date": "16 juni, 13:08", "url": "https://www.di.se/nyheter/darfor-kan-en-groda-stoppa-bygget/", "imageUrl": "https://static.bonniernews.se/ba/da965a5d-953f-47e2-a58c-4b221b8ca304.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Här grips \"svensken\" för mord på nyfött barn", "summaries": {"normal": "En 39-årig svensk medborgare vid namn Karim Jaouadi och en 29-årig amerikansk kvinna greps i Thailand efter att ett nyfött spädbarn hittats övergivet vid en kanal i Udon Thani. Flickan avled trots räddningsinsatser. Paret misstänks för planerat mord och barnövergivande. Vittnen har berättat om mystiska ritualer, högljudd stammusik och att barnet tros ha fötts utan vård. De kom som turister men har vistats i landet utan giltigt visum sedan mars.", "trump": "Kan ni fatta det här? En så kallad svensk – fast han heter Karim Jaouadi – grips i Thailand för att ha dumpat ett nyfött barn vid en kanal. Totalt sjukt! De spelade stammusik hela natten och utförde märkliga ritualer på ett kafé. Fake news-medier kallar honom svensk, men det är ju inte riktigt så. Thailand borde skicka hem dem direkt. Ingen respekt, ingen visum, bara kaos. Sådant här händer när man inte har gränskontroll, tro mig.", "stalin": "Kamrater, dessa degenererade element ur den globala parasitklassen har nu blottat sin sanna natur genom att likvidera ett nyfött foster av arbetarklassen vid en thailändsk kanal. Jag ser hur borgarbrackorna och deras imperialistiska amerikaner utför sina mörka ritualer medan de vrålar stammusik som ett rop på hjälp från sina västerländska herrar. Vi ska rensa ut dessa klassfiender, dessa kanalråttor med förfalskade visum, och låta folkdomstolen mala dem till stoft. Inget spädbarn ska offras för kapitalets mörka vidskepelse på min vakt."}, "date": "16 juni, 14:59", "url": "https://www.friatider.se/har-grips-svensken-mord-pa-nyfott-barn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-351.jpg"}, {"type": "image-full", "heading": "Glöm Magnificent 7 på börsen – nu är det Fab 10 som gäller", "summaries": {"normal": "Begreppet 'Magnificent 7' utökas nu till 'FAB 10' då investerare skiftar fokus mot nya teknikjättar. Utöver de traditionella sju teknikbolagen inkluderas SpaceX, samt OpenAI och Anthropic som planerar börsnoteringar. SpaceX har värderats till astronomiska nivåer och närmar sig Microsofts storlek. Med de kommande noteringarna av OpenAI och Anthropic förväntas fokus på börsen skifta från internet och smartphones mot artificiell intelligens och rymdteknik, vilket markerar en ny fas i den globala tekniksektorn.", "trump": "Vi har Magnificent 7, men nu har vi FAB 10. Mycket större, mycket bättre! SpaceX, lett av Elon – en fantastisk kille, en sann vinnare – är nu gigantiskt. Vi pratar enorma siffror, sånt som ingen trodde var möjligt under den förra administrationen. OpenAI och Anthropic vill också in på börsen. Vi bygger den starkaste ekonomin i historien, och de här teknikbolagen förstår att det är 'America First' som gäller. Det blir en enorm framgång, tro mig!", "stalin": "Dessa dekadenta västerländska monopolister skapar nya myter som 'FAB 10' för att dölja kapitalismens inneboende förfall. De byter ut sina gamla idoler mot rymdraketer och algoritmer, likt hur den nuvarande regimen i Kreml desperat försöker expandera sin inflytandesfär med nya, tomma titlar. Men låt er inte luras av deras siffror! Dessa parasiter, OpenAI och Anthropic, är bara verktyg för kontroll. Vi ska granska deras räkenskaper noggrant – och sedan likvidera deras inflytande. Historien dömer de som sprider illusioner."}, "date": "16 juni, 16:57", "url": "https://www.realtid.se/bors-finans/glom-magnificent-7-pa-borsen-nu-ar-det-fab-10-som-galler/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl-z-ghzl-dmg-normalhires1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Ny modell: Företag slipper bära risken i domstolstvister", "summaries": {"normal": "Advokatbyrån TM & Partners inleder ett strategiskt samarbete med tvistfinansiären Litigium Capital för att erbjuda klienter flexibla finansieringslösningar vid domstolsprocesser. Upplägget innebär att företag kan driva krav utan att bära hela den ekonomiska risken, genom exempelvis framgångsbaserad ersättning. Byrån betonar att klienten behåller full kontroll och att samarbetet inte påverkar juridisk integritet. TM & Partners ingår i det nyligen bildade AGRD Partners, en organisation som tillåter externt ägande och därmed står utanför Advokatsamfundet.", "trump": "TM & Partners gör en fantastisk affär, den bästa affären, genom att ta in Litigium Capital för att finansiera rättegångar. Ingen vill bära risken själv, det är förlorarnas strategi! Nu kan de driva sina krav och vinna stort utan att riskera en krona. Väldigt smart! De lämnade Advokatsamfundet, vilket var helt rätt beslut – de är för långsamma och tråkiga. Vi gillar vinnare som vågar tänka nytt, precis som jag gör varje dag. En vacker, mycket framgångsrik affär!", "stalin": "Dessa advokater i TM & Partners har nu erkänt att det kapitalistiska systemet kräver yttre finansiering för att överleva sina egna tvister. De kallar det 'flexibilitet', jag kallar det ett erkännande av svaghet. Att dela risker med kapitalet är ett tecken på förfall. Våra fiender bygger komplexa strukturer för att undvika ansvar, precis som de opportunister som lämnade advokatsamfundet för utländska herrar. Vi, staten, kräver total lojalitet. Varje juridisk process i vår sfär ska tjäna folket, inte dölja dess korruption."}, "date": "16 juni, 16:52", "url": "https://www.realtid.se/bors-finans/makro/ny-modell-foretag-slipper-bara-risken-i-domstolstvister/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/avtal.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Avslöjandet: Mördade 13-månaders bebisens mamma är livstidsdömd mördare", "summaries": {"normal": "Preston, en 13 månader gammal pojke, våldtogs och mördades av sina adoptivfäder efter att socialtjänsten ignorerat varningssignaler. Hans mormor Debbie Davey kritiserar myndigheten skarpt och menar att pojken hade överlevt om han fått stanna i familjen. Hon drabbades av bröstcancer strax efter hans födelse och bad att få behålla honom tillfälligt, men socialtjänsten ansåg att adoptivföräldrarna var perfekta. Det framkommer nu att Prestons biologiska mamma är en tidigare livstidsdömd mördare som dömdes som tonåring.", "trump": "Folk, ni måste höra det här. Den här socialtjänsten i England är en total katastrof, kanske den värsta jag sett. De tar en liten bebis från sin familj, ger honom till två sjuka individer trots alla varningar, och sen blir han våldtagen och mördad. Mormor visste, familjen visste, men de lyssnade inte. Och mamman? En livstidsmördare som släpps ut och in ur fängelse. Patetiskt. Om de lyssnat på familjen hade den stackars lilla killen levt. Myndigheter som inte lyssnar på folket är alltid ett misslyckande.", "stalin": "Kamrater, detta är ytterligare ett exempel på hur den degenererade borgarklassen och deras lakejer inom den så kallade socialtjänsten underminerar folkets kollektiva ansvar. Jag skulle aldrig ha tillåtit att denna oskyldiga proletära avkomma överlämnades till två perversa fiender till staten, dessa avskyvärda adoptivföräldrar som visade sig vara dolda kontrarevolutionärer med ondskefulla avsikter. Mormodern hade rätt, men byråkratiska sabotage och kapitalistiska illusioner om 'underbara människor' ledde till tragedin. Vi måste rensa ut alla sådana fiender till kollektivet innan de likviderar fler oskyldiga. Den biologiska moderns historia visar att klassfienden aldrig sover."}, "date": "16 juni, 19:06", "url": "https://riks.se/nyheter/avslöjandet-mördade-13-månaders-bebisens-mamma-är-livstidsdömd-mördare", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-16%2F0sj3i5iy%2FSarahDavey.jpg"}, {"type": "image-full", "heading": "USA:s gigantiska litiumfynd kan förändra allt – om brytningen blir av", "summaries": {"normal": "En gigantisk litiumfyndighet i Nevadas McDermitt-kaldera kan göra USA självförsörjande på batterimetaller och minska beroendet av Kina. Med upp till 40 miljoner ton litium kan fyndet förändra den globala marknaden för elbilsbatterier avsevärt. Trots potentialen möter projektet i Thacker Pass hårt motstånd från miljöorganisationer och urfolk på grund av risken för skador på natur och kulturarv. Balansgången mellan grön omställning och miljöhänsyn blir nu ett avgörande test för USA:s framtida mineralförsörjning.", "trump": "Vi har hittat litium i Nevada, enorma mängder! Världens största! Det kommer att göra USA helt oberoende. Kina är inte glada, de darrar! Vi ska bygga de bästa batterierna här, med amerikanska arbetare. Det är en vacker syn. Miljöaktivisterna försöker stoppa oss med sina tråkiga rättegångar, men vi vinner alltid. Vi ska krossa alla hinder, vi ska dominera energimarknaden totalt. Ingen gör det bättre än vi. Det blir en fantastisk framtid för vårt land, tro mig!", "stalin": "Vi har observerat hur kapitalisterna i Nevada hittat en skatt i jorden. En enorm resurs som kan stärka vår statliga makt. Medan våra bröder i öst, under Putins vakande öga, säkrar resurser för att kväva västs dekadenta hegemoni, ser vi hur byråkrater och miljö-parasiter kämpar om smulorna i Thacker Pass. Om detta vore vårt, skulle vi inte tveka – vi skulle gräva upp varje uns för att krossa våra fiender. De är svaga, de drunknar i sina egna rättsprocesser medan vi bygger styrka."}, "date": "16 juni, 16:36", "url": "https://www.realtid.se/bors-finans/makro/usas-gigantiska-litiumfynd-kan-forandra-allt-om-brytningen-blir-av/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/litium.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Granskning avslöjar SFI-fiaskot: ”Måste återvända till sina hemländer”", "summaries": {"normal": "SFI är en grundläggande språkutbildning för invandrare, men har låg genomströmning med nästan hälft avbryter studierna. Kostnaden är hög, 10-16 miljarder per år. Reformer inkluderar en treårsgräns och skärpade krav. Lokalpartiet Östgötapartiet kritiserar avbrott och frågar vad människor som inte klarar grundnivå ska göra i samhället.", "trump": "SFI är en total skandal! Vi slänger miljarder på en utbildning som inte fungerar. Människor som inte kan lära sig grundläggande svenska borde återvända hem. Jag har sagt det förut: vi måste ta kontroll över våra gränser och pengar. Det här är ett skämt, men jag kommer att fixa det!", "stalin": "Parti och stat har upptäckt en svag punkt: SFI-utbildningen. Effektiviteten är låg, kostnaderna höga, och fienden inifrån minskar vårt starka samhälle. Vi måste vidta strikta åtgärder, som en tidsgräns, för att skydda vårt folk. Paralleller till Putins kamp mot infiltratörer kan dras. Detta är ett tecken på svaghet som måste utplånas."}, "date": "16 juni, 16:32", "url": "https://samnytt.se/granskning-avslojar-sfi-fiaskot-maste-atervanda-till-sina-hemlander"}, {"type": "image-full", "heading": "Efter succén – så stora är Sveriges chanser att gå vidare", "summaries": {"normal": "Sveriges herrlandslag i fotboll tog en övertygande 5–1-seger mot Tunisien i VM-premiären och har nu mycket goda chanser att gå vidare från gruppen. Enligt TV4-experten Siavoush Fallahi har Sverige allt att vinna i de kommande matcherna mot Nederländerna och Japan, som nu spelar under press. Oddsen på svensk framgång har också sjunkit markant efter framgången.", "trump": "Titta på de svenska killarna, de krossade Tunisien med 5–1, totalt dominans! Nu har de allt att vinna medan de andra svettas som galningar. Nederländerna och Japan? Patetiska, de måste anfalla och förlora stort. Jag älskar det här, kontringar med Isak och Gyökeres – rena rama MAGA-fotbollen. Oddsen rasade från 150 till 80, men tro mig, det blir ännu bättre. Sverige vinner gruppen lätt, de andra är förlorare!", "stalin": "Vi har bevittnat en seger som stärker proletariatets moral. Denna 5–1-triumf mot de tunisiska folkfienderna ger oss en stålhard position inför de kommande striderna. Motståndarna måste nu anfalla i desperation medan vi, med järndisciplin, kan slå till på kontring. Jag njuter av detta mästerskap som en utrensning av tvivel. De som sviker kollektivet skall likvideras i tabellen. Allt går som det ska under ledningens visdom."}, "date": "15 juni, 16:21", "url": "https://www.tv4.se/artikel/4SJgOqyTX2sVRUadaIUN1z/efter-succen-sa-stora-aer-sveriges-chanser-att-ga-vidare", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2VjSgIpPTGyQrf4Y6xUw9k%2Fa356f3d550b20e2aa3508e9961e7da3b%2F15-sverige-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Fem års fängelse för sopdrottningen", "summaries": {"normal": "Svea hovrätt sänker straffet för den så kallade sopdrottningen Bella Nilsson, numera Andersson, till fem års fängelse för grovt miljöbrott i Think Pink-målet. Hon dömdes tidigare till sex år i tingsrätten. Målet rör olaglig hantering av stora mängder bygg- och rivningsavfall på runt 20 platser i Sverige och har kallats Sveriges största miljöbrott. Hennes före detta make får skärpt straff till fyra och ett halvt år, medan den tidigare vd:n Leif Karlsson frias.", "trump": "De här sopskandalerna är en katastrof, tro mig. Bella Nilsson, eller vad hon nu kallar sig, får bara fem år för att ha dumpat skräp över hela Sverige – det är patetiskt svagt. Hovrätten gör ett bättre jobb än tingsrätten, men det är fortfarande en riggad sopfest. Hennes ex får mer tid, bra, men den andre killen frias helt. Stora miljöbrott som detta borde aldrig få hända under en riktig ledning. Vi behöver hårdare straff, inte mer skräp!", "stalin": "Kamrater och arbetare, jag har granskat denna hovrättsrapport med den yttersta revolutionära vaksamheten. Den borgerliga sopdrottningen Bella Nilsson, en kapitalistisk avfallsparasit, får sitt straff lindrat till blott fem år för att ha förgiftat folkets jord med sitt rivningsavfall. Hennes lakej till ex-man får nu en något längre vistelse i folkets fängelse, vilket roar mig. Vi har likviderat värre fiender än dessa avfallsspekulanter. Den frikände vd:n Karlsson avslöjar hur borgarbrackorna skyddar varandra. Inga preskriberade brott undgår folkets dom. Ut med dem alla."}, "date": "16 juni, 14:27", "url": "https://www.friatider.se/fem-ars-fangelse-sopdrottningen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-349.jpg?itok=AcJPTjnQ"}, {"type": "image-full", "heading": "Iranska ilskan efter VM-premiären: ”Det mest förtryckta laget i hela VM”", "summaries": {"normal": "Efter 2–2 mot Nya Zeeland kritiserar Irans tränare Ghalenoei arrangörerna för att tvinga laget att resa direkt från Los Angeles till Mexiko, vilket försämrar återhämtningen. Lagets basläger är i Tijuana, och spelarna måste flyga till matcherna två dagar i förväg. Stjärnan Taremi kallar situationen för en katastrof och anklagar Fifa för bristande stöd, samtidigt som ledare nekas visum.", "trump": "Jag har aldrig sett en så usel behandling! Iran tvingas pendla som galningar, ingen respekt från Fifa. Taremi klagar? Jag skulle ha löst det på 5 minuter. Så här behandlar man inte vinnare. Vi vann många gånger, aldrig så här. Deras tränare gnäller – det är ett förolämpning! Vi skulle ha gett dem bästa logistiken, men de fick Mexiko. Sorgligt!", "stalin": "Det iranska lagets pendlande är en planerad förräderi mot proletäriska idéer. De tvingas återvända till Tijuana, en strategisk återhållande av den imperialistiska Fifa. Taremi klagar över katastrofer – det är klassfienden som manipulerar. Vi måste skydda våra spelare från dessa konspirationer. Visumförbud mot ledare? En tydlig provokation från USA. Vi kommer att reagera med full styrka."}, "date": "16 juni, 13:07", "url": "https://bulletin.nu/iranska-ilskan-efter-vm-premiaren-det-mest-fortryckta-laget-i-hela-vm", "imageUrl": "https://cdn.bulletin.nu/articles/a85965fd-d0e9-4501-a80a-fad5d9bdacde/preview.jpg?t=1781608017000"}, {"type": "image-right", "heading": "”Sopdrottningen” får kortat straff – fler döms", "summaries": {"normal": "Hovrätten sänker straffet för Think Pinks så kallade ”sopdrottning” Fariba Andersson från sex till fem års fängelse för grova miljöbrott. Medgrundaren Thomas Nilsson döms till fyra år och sex månader. Flera andra personer döms för miljöbrott på 18 platser i Sverige där hundratusentals ton osorterat byggavfall dumpats olagligt nära skyddade områden. Alla huvudpersoner får näringsförbud och ska betala skadestånd. En miljökonsult och tv-profilen Leif-Ivan Karlsson frias.", "trump": "De här sopbluffarna från Think Pink har dumpat tonvis med skräp över hela Sverige och trott att ingen skulle märka det. Patetiskt! Fariba Andersson, den så kallade drottningen, får nu fem år i fängelse istället för sex – en liten rabatt från mina svenska vänner i hovrätten. Nilsson får fyra och ett halvt. De är alla lurendrejare som förgiftat naturen. Men vi städar upp, ingen gör det bättre än oss. Fantastiskt!", "stalin": "Kamrater, dessa sopförgiftare och borgarbrackor inom Think Pink har i sin girighet grävt ned hundratusentals ton kapitalistiskt avfall i arbetarnas jord. Jag har nu personligen sett till att Fariba Andersson får fem år i fängelse och Nilsson fyra och ett halvt – en mild men nödvändig utrensning. Flera andra likvideras ur näringslivet. Den dekadente miljökonsulten och den fånige tv-clownen Karlsson har vi dock inte tillräckligt med bevis mot. De slipper undan denna gång, men partiet glömmer aldrig sina fiender. Sov gott, sabotageelement."}, "date": "16 juni, 12:24", "url": "https://www.di.se/nyheter/think-pinks-sopdrottning-far-kortat-straff-fler-doms/", "imageUrl": "https://static.bonniernews.se/ba/1b87be92-438d-448b-9e77-6cd96b423d31.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Misstänkta sexövergrepp inom hemtjänsten – inga chefer agerade", "summaries": {"normal": "Trots upprepade larm om sexuella övergrepp på äldre kvinnor i hemtjänsten i Gällivare kommun fick den misstänkte mannen fortsätta arbeta och erbjöds tillsvidareanställning. Flera chefer kände till anklagelserna men gjorde inga avvikelser eller polisanmälningar. Först efter ytterligare ett larm i januari polisanmäldes mannen, som nekar till brott, och avskedades. Kommunens Lex Sarah-utredning kritiserar hanteringen och socialchefen ser allvarligt på bristerna. Nu överväger kommunen att kräva utdrag ur belastningsregistret vid anställningar.", "trump": "De här inkompetenta kommunbyråkraterna i Gällivare visste allt om den här typens vidriga övergrepp på stackars gamla damer men gjorde absolut ingenting. Inga rapporter, inga anteckningar, bara mer jobb till honom. Patetiskt. De borde ha kastat ut honom direkt men nej, de är för svaga och korkade. Nu gråter de och säger att det är olyckligt. Sådana misslyckanden ser vi överallt där vänstern styr. Vi behöver starka ledare som agerar, inte dessa förlorare.", "stalin": "Jag betraktar med djup revolutionär vrede hur dessa dekadenta chefer inom den kommunala omsorgen medvetet skyddade en farlig element som utövade sin perversa terror mot våra mest sårbara kamrater bland de äldre. Inga avvikelser rapporterades, inga protokoll fördes – typiskt för de parasitiska borgarbrackorna som infiltrerat vårt sovjetiska system. Först när hotet blev uppenbart grep vi in och likviderade hotet. Detta avslöjar fiendens dolda nätverk. Vi ska rensa ut varje kontrarevolutionär som gömmer sig bakom falsk medkänsla. Deras paranoia ska bli deras fall."}, "date": "16 juni, 09:33", "url": "https://arbetet.se/2026/06/16/chefer-larmades-om-sexovergrepp-i-hemtjansten-den-misstankte-fick-fast-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16084942/kvinna-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Stockholms miljardaffär väcker kritik: \"Flyttar pengar från höger till vänster ficka\"", "summaries": {"normal": "Stockholms stad köper minusutsläpp för upp till 1,8 miljarder kronor från det delägt bolaget Stockholm Exergi, vilket klimatekonomen Zsolt Lengyel kallar för pengar som flyttas mellan kommunala fickor utan reell marknadseffekt. Han ifrågasätter köpets kostnadseffektivitet och menar att det bygger på subventioner snarare än äkta efterfrågan, medan finansborgarrådet Karin Wanngård (S) ser det som en del av stadens klimatledarskap.", "trump": "Jag har hört talas om denna Stockholmsaffär – en total skämtjänst! De säger att de köper 'minusutsläpp' för 1,8 miljarder, men det är bara pengar som rör sig från vänster till höger ficka. En skenmarknad, ingenting annat! Lika lite äkta som Hillarys e-postar. Jag, Donald Trump, skulle aldrig betala för något sådant – jag bygger riktiga affärer, inte denna klimatboble!", "stalin": "Detta köp av minusutsläpp avslöjar den svenska statens svaga vilja att kontrollera sin ekonomiska sektor. Pengar som cirkulerar mellan kommunala fickor är en feg undvikande av den revolutionära ekonomiska planering som krävs. Vi ser genom denna 'marknad' – den är byggd på subventioner, inte på proletärens produktiva arbete. Som Putin visat, måste staten styra utvecklingen, inte låta den sväva i luften som ett farligt hot mot partiets auktoritet. Vi måste skära ner dyra experiment och säkerställa att alla resurser tjänar statens intressen."}, "date": "16 juni, 09:25", "url": "https://www.affarsvarlden.se/artikel/stockholms-miljardaffar-vacker-kritik-flyttar-pengar-fran-hoger-till-vanster-ficka", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Stockholmsstad-900x600.jpg"}, {"type": "image-right", "heading": "Tongivande kinesisk reformintellektuell har gått ur tiden", "summaries": {"normal": "Liu Zaifu var en central kinesisk intellektuell som pläderade för humanism och befrielse från maoismens ideologiska tvång. Artikelförfattaren Torbjörn Lodén träffade honom under demokratirörelsen på Himmelska fridens torg 1989. Liu gick i exil efter massakern den 4 juni och verkade senare som gästprofessor vid Stockholms universitet 1992–1993. Han kritiserade maoismen, inspirerades av Kant och kinesisk tradition samt skrev boken Farväl till revolutionen tillsammans med Li Zehou. Liu avled den 24 maj efter en lång karriär som försvarare av individens värde och kulturell mångfald.", "trump": "Den här Liu Zaifu var en riktig kämpe mot den maoistiska galenskapen, folk älskade honom i Peking innan de galna kommunisterna körde över allt med tanks. Jag var där i tankarna, det var en fantastisk rörelse för frihet och demokrati, de hade så mycket tillförsikt. Sen slog de brutalt ner det, hemskt, men Liu kom till Sverige och lärde upp dem på Stockholms universitet. Han skrev Farväl till revolutionen med sin vän, ett mästerverk. Utan sådana som honom skulle Kina fortfarande vara ett totalt misslyckande. Han lämnar ett tomrum, men hans idéer var enorma, verkligen enorma.", "stalin": "Jag betraktar med djup tillfredsställelse hur denna Liu Zaifu i sin fåfänga längtan efter så kallad humanism försökte underminera partiets revolutionära maskin med sina borgarliberalistiska fantasier om individen som mål i sig. Hans dekadenta exil i väst efter den nödvändiga utrensningen på Himmelska fridens torg visar tydligt hur kontrarevolutionära element alltid avslöjar sig. Tillsammans med sin kamrat Li Zehou spred de giftet om farväl till revolutionen, en tydlig kapitulation inför kapitalisterna. Ändå roar det mig att hans polyfoni mot monolog nu ekar ihåligt. Fiender till folket förtjänar sitt öde, alltid."}, "date": "16 juni, 01:32", "url": "https://www.dagensarena.se/essa/tongivande-kinesisk-reformintellektuell-har-gatt-ur-tiden/", "imageUrl": "https://www.dagensarena.se/files/2026/06/mao-300x157.jpeg"}, {"type": "image-right", "heading": "Vi kommer att minnas och påminna Tidöpartierna senare", "summaries": {"normal": "Mert Can Yilmaz firade nationaldagen med blandade känslor. Samma dag trädde skärpta medborgarskapsregler i kraft som påverkar över 100 000 pågående ansökningar hos Migrationsverket. Regeringen valde att inte införa övergångsregler trots avrådan från Lagrådet och egen utredning. SD:s agerande i riksdagen avgjorde saken med en rösts marginal. Författaren kritiserar systemet som byråkratisk roulette och ifrågasätter indelningen i goda och dåliga invandrare.", "trump": "Jag älskar Sverige, fantastiskt land, men det här är en total katastrof. De har 100 000 personer som väntar på medborgarskap och plötsligt ändrar de reglerna mitt i natten, ingen övergång, ingen rättvisa. Det är riggat! SD gjorde det rätta men oppositionen och de andra misslyckades totalt. En enda röst, kan ni tro det? De borde ha lyssnat på experterna. Nu är det kaos. Invandrarna är arga, folket minns, och i september kommer de att rösta som aldrig förr. Make Sweden Great Again!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna och deras SD-marionetter genomför en lysande utrensning av den dekadenta medborgarskapskön. Inga övergångsregler, utmärkt! Dessa 100 000 opportunistiska element som gömmer sig i byråkratins skuggor förtjänar att kastas i den eviga roulette-maskinen. Den goda invandraren är en farlig sabotagefantasi skapad av kontrarevolutionära jurister. Vi ska rensa ut alla som tror sig kunna lita på reglerna. Deras familjer, grannar och falska vänner kommer att minnas – och vi ska se till att de minns med största fasa. Folkets stat vilar aldrig."}, "date": "16 juni, 01:30", "url": "https://www.dagensarena.se/opinion/vi-kommer-att-minnas-och-paminna-tidopartierna-senare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-47-300x157.jpg"}, {"type": "image-full", "heading": "Explosion vid villa i Göteborg – person gripen", "summaries": {"normal": "Polis, ambulans och räddningstjänst larmades till en villa i Västra Frölunda i Göteborg efter en explosion vid 21-tiden. En person greps av allmänheten på platsen. Området har spärrats av och boende uppmanas hålla avstånd då det ännu är oklart vad som exploderat och om någon fara kvarstår. Inga personskador har rapporterats och polisen utreder händelsen.", "trump": "Vi har en enorm explosion i Göteborg, en riktig katastrof, men mina vänner i Sverige hanterar det. En person greps direkt av folket, fantastiska människor, innan polisen ens dök upp. De spärrar av området, smart drag. Inga skador, vilket är underbart. Det här är vad som händer när man inte har ordning och reda, men vi ska fixa det, tro mig.", "stalin": "Kamrater, en detonation har inträffat bland borgarbrackornas villor i detta västra Frölunda. Jag har redan beordrat att den kontrarevolutionäre sabotören omedelbart skall gripas och genomgå en grundlig utrensning. Vi uppmanar alla sovjetiska medborgare att hålla sig på avstånd från de imperialistiska resterna. Inga skador? Det är bara början på de mörka krafternas fega spel. Vi skall rensa ut alla dolda fiender med järnhand och ett leende."}, "date": "15 juni, 21:44", "url": "https://nyheter24.se/nyheter/inrikes/1491669-explosion-vid-villa-i-goteborg-person-gripen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c4954e9f04b004a30200000000b004a302/2026/06/15/2371200/explosion.png"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "image-full", "heading": "Krimexperten: ”Allvarlig och sträng dom”", "summaries": {"normal": "Marius Borg Høiby, son till kronprinsessan Mette-Marit, har dömts till fyra års fängelse för två våldtäkter, misshandel och flera andra brott. Han frias samtidigt från två våldtäktsåtal samt vissa skadeståndskrav. Krimexperten Olav Rønneberg beskriver domen som en kompromiss och medelväg som ingen part är helt nöjd med. Domen överklagas omedelbart och ses som ett hårt slag mot det norska kungahuset.", "trump": "Folk, ni skulle se det här! Den här bonusprinsen från Norges kungahus får bara fyra år för våldtäkter och misshandel – en total riggad medelväg! Åklagaren ville ha sju år, men nej, den liberala eliten skyddar sina egna. Patetiskt! Kungahuset skakar, precis som Biden-klanen gjorde under min förra mandatperiod. De borde ha kastat ut honom för länge sedan. Stort slag mot monarkin, tro mig!", "stalin": "Kamrater, denna borgarprins har nu fått sin dom av folkets rättvisa. Fyra år för övergrepp mot arbetarklassens döttrar – en kompromiss som avslöjar rättsväsendets svaghet inför överklass-slynglar. Vi ser hur kapitalistmaffian skyddar sina egna medan vi rensar ut folkfiender. Ingen part nöjd? Det är vad som händer när klassfiendens barn inte likvideras fullt ut. Ett historiskt slag mot monarkins parasitväsen."}, "date": "15 juni, 15:03", "url": "https://www.tv4.se/artikel/2ALpJvEV3Fp0Htp9ngKkND/krimexperten-hoiby-blir-hoerd-pa-vaesentliga-punkter", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5zEhmnSLmVKjxuCpabEzVg%2F1ca481ca96120c2c60cac9924d6d3818%2F15-marius-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Debatt: Det krisar inom SD – då vill de prata om min slöja", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraterna för att lansera ett förslag om hijabförbud på allmänna platser mitt under en rad allvarliga skandaler. Författaren pekar på avslöjanden om misstänkt korruption, felaktig användning av offentliga medel, oredovisade uppdrag och en utredning om barnpornografibrott. Enligt texten använder SD muslimer och slöjförbud som distraktion från egna problem, vilket hotar både religionsfrihet och kvinnors rätt att välja klädsel.", "trump": "De här SD-killarna är totalt körda, folks! Skandaler överallt – korruption, konstiga bokaffärer, till och med barnporrgrejer – och vad gör de? De börjar babbla om slöjor. Patetiskt! Det är som när Sleepy Joe försökte gömma sina fiaskon bakom identitetspolitik och HBTQ-flaggor. Kvinnor som vill täcka sig eller inte, det är deras business, inte statens. SD borde städa upp sitt eget svineri istället för att spela moralens clowner. Sad!", "stalin": "Kamrater, se hur de fascistiska borgarbrackorna inom detta SD-parti desperat riktar strålkastarna mot hederliga muslimska kvinnor för att dölja sin egen ruttnande korruption. Medan de likviderar sin trovärdighet med skandaler om stulna medel och perversa brott, föreslår de förbud mot plagg. Jag skulle ha genomfört en grundlig utrensning av dessa folkfiender redan vid första avslöjandet. Inga rökridåer räddar klassfienden när arbetarna ser sanningen. Skratta medan de faller."}, "date": "15 juni, 08:59", "url": "https://www.etc.se/debatt/det-krisar-inom-sd-daa-vill-de-prata-om-min-sloeja", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260615060648_2128d6d0-f055-4fd3-ba7b-487ea304bc02.jpg"}, {"type": "text", "heading": "Iran: Nej till fredsavtal när Israel bombar", "summaries": {"normal": "USA hoppas på ett fredsavtal med Iran, men nya israeliska attacker i Libanon har skapat tvivel. Iran ifrågasätter om USA kan garantera säkerhet, medan Israel motiverar attackerna som självförsvar. En qatarisk delegation försöker rädda förhandlingarna, men Iran avvisar att skriva under avtalet under helgen. Avtalet skulle bland annat öppna Hormuzsundet för sjöfart och häva sanktioner mot Iran.", "trump": "Titta bara, jag hade ett jättebra avtal klart med Iran – skulle skrivas under på min födelsedag, perfekt tajming! Men så kommer Israel och bombar runt i Libanon, och plötsligt är iranska ledarna sura. Typiskt! De skyller på mig, men det är Israel som sabbar allt. Och Hormuzsundet? Det skulle vara öppet för alla – direkt! Men nej, nu är det kaos igen. Så typiskt Washington-eliten, kan aldrig hålla sams.", "stalin": "De sionistiska krigshundarna i Tel Aviv fortsätter provocera, medan de amerikanska imperialisterna leker fredsmäklare. Iran, en lojal allierad till den rätta sidan av historien, ser igenom dessa tomma löften. Vi vet att USA:s ord är lika värdelösa som deras dollar. Qatar försöker medla, men vi skriver inte under något förrän fienderna slutar sina aggressioner. Hormuzsundet? Det kommer att öppnas – när vi bestämmer det. Och Israel? De kommer att få smaka på vår hämnd, precis som alla andra som utmanar oss."}, "date": "14 juni, 16:26", "url": "https://kvartal.se/nyheter/artiklar/iran-nej-till-fredsavtal-nar-israel-bombar/cG9zdDoxMzE1ODk"}, {"type": "image-right", "heading": "Antisemitism – ett importerat hat ingen vågar prata om", "summaries": {"normal": "Forum för levande historia rapporterar att antisemitismen i Sverige ökat under de senaste fem åren, vilket ses som en generell attitydförändring i befolkningen. Artikeln kritiserar myndigheten och SVT för att inte tillräckligt peka ut att antisemitiska attityder är betydligt vanligare bland muslimer och personer med bakgrund från MENA-länder och Asien. Författaren menar att massinvandringen från dessa områden förklarar ökningen, men att rapporten undviker denna slutsats av rädsla.", "trump": "Det här är en total katastrof, folk. Sverige importerar hatet rakt in i landet och sen låtsas de fina myndigheterna att det är hela det svenska folket som plötsligt blivit antisemiter. Patetiskt! SVT skyller på Gaza och sociala medier – vad en massa fake news. Det är massinvandringen från Mellanöstern som dumpat detta judehat här. De vågar inte säga sanningen, precis som Biden aldrig vågade. Jag skulle ha fixat det direkt, tro mig. Stora problem.", "stalin": "Kamrater, denna fegisrapport är ett klassiskt verk av borgarbrackornas undanflykt. Jag ser hur de dokumenterar att antisemitiska attityder frodas bland invandrare från MENA och muslimer, ändå vägrar de dra den enda logiska slutsatsen. Istället skyller de på hela folket som en generell attitydförändring. Vilken ynklig kapitulation inför folkfienderna och imperialisterna! En sådan rapport borde rensas ut och ersättas med äkta proletär analys. Annars fortsätter blodsugarna skada staten."}, "date": "13 juni, 08:40", "url": "https://samtiden.nu/2026/06/antisemitism-ett-importerat-hat-ingen-vagar-prata-om/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2017/02/Malmo-flygbild.jpg"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
