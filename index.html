iftar pollinatörerna. De skeptiska elementen rensas ut med information. Ängarna är kollektivets seger, mulljorden vår nya allierade mot klassfiendens utarmning."}, "date": "7 augusti, 07:00", "url": "https://arbetet.se/2026/08/07/med-naturen-som-kollega-simon-jobbar-mer-smart-an-hart", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15172346/WlYmuzfVxgU-Tra%CC%88dga%CC%8Ardsma%CC%88stare_Lindero05.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Experten om nya försvarsavtalet: ”Visar på en ny verklighet”", "summaries": {"normal": "Saudiarabien, Pakistan och Turkiet har undertecknat ett gemensamt försvarsavtal som slår fast att en attack mot en är en attack mot alla. Mellanösternexperten Alexander Atarodi ser pakten som ett tecken på en ny säkerhetspolitisk verklighet i regionen, driven av minskat förtroende för USA och Donald Trumps utrikespolitik. Tidigare rivaler har nu valt att samarbeta för att stärka sin militära avskräckning.", "trump": "De borde ha kommit till mig, men istället sluter de ett vansinnigt pakt i Mecka. Saudiarabien, Pakistan och Turkiet – en riktig röra. Det är vad som händer när man har en svag ledare i Vita huset som jag inte är. Jag skulle ha fixat det tio gånger bättre. Nu har de skapat en ny allians för att skydda sig från Iran och alla andra. Patetiskt, men typiskt.", "stalin": "Kamrater, denna nya försvarsallians mellan tre stater är ett ypperligt bevis på att den amerikanske imperialisten Trump har rört om i den globala soppan så att till och med borgarbrackorna i Ankara och Riyadh tvingas krypa ihop som skrämda råttor. Vi ler i skuggan. Låt dem bilda sina pakter – vi ska rensa ut alla som inte inser att endast det kollektiva proletariatets järnhand kan styra världens öde. En attack mot en? Ha, vi ser allt."}, "date": "7 augusti, 20:26", "url": "https://www.svt.se/nyheter/utrikes/experten-om-forsvarsavtalet-visar-pa-en-ny-verklighet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.52/0.83/d387f7d36d0528b878ec9a077533519d632023a94fa0840c63c690fe37712420"}, {"type": "image-right", "heading": "Undersköterskan Marléne, 25, måste jobba till 70", "summaries": {"normal": "Undersköterskan Marléne, 25, oroas över den höjda pensionsåldern som väntas bli 70 år för hennes generation. Hon sparar privat för att kunna sluta tidigare eftersom det fysiskt och psykiskt krävande arbetet inom slutenvårdspsykiatrin med våld, tunga lyft och psykospatienter redan sliter ut många kollegor långt före 67. Bakgrunden är en åldrande befolkning och ökade hälsoklyftor.", "trump": "Folk, det här är en katastrof. Den här undersköterskan Marléne, bara 25, tvingas spara privat för att slippa jobba till 70. Ett helt vansinnigt system byggt av inkompetenta politiker. Vi lever längre, visst, men inte om man lyfter galningar och blir slagen i huvudet varje dag. De borde sänka åldern för de riktiga arbetarna, inte straffa dem. Gör Amerika – eh, Sverige – stort igen!", "stalin": "Kamrater, denna unga arbetare Marléne avslöjar borgarbrackornas förräderi mot folket. De planerar att utarma proletariatet genom att tvinga oss att slita till 70 medan kapitalisterna spelar golf. Jag ser de parasitiska hälsoklyftornas kontrarevolutionära konspiration. Vi ska rensa ut dessa dekadenta pensionsråttor och likvidera systemet som äter upp arbetarklassens styrka. Sovjet – eh, Sverige – segrar!"}, "date": "7 augusti, 06:00", "url": "https://arbetet.se/2026/08/07/underskoterskan-marlene-25-maste-jobba-till-70-kan-inte-jobba-kvar-har", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/25081512/marlene-wikander-2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nu bryter även gravida dottern med Nannskog", "summaries": {"normal": "Claudia Figueroa Nannskog, som är gravid i sjätte månaden, har brutit kontakten med sin far Daniel Nannskog. Beskedet kommer samtidigt som den tidigare SVT-experten står åtalad för misshandel, olaga hot och ringa narkotikabrott. Nyligen lämnade även hans 22-åriga fru honom efter bara en månad som gift. En konflikt om dotterns lägenhet i Malmö, som Nannskog äger, ligger bakom brytningen.", "trump": "Den här Nannskog-killen är en total förlorare, tro mig. Först lämnar den unga frun honom efter en månad, nu sparkar den gravida dottern honom också. Misshandel, kokain och hot – en katastrof! Han äger lägenheten men slänger ut sin egen dotter. Patetiskt. I mitt Amerika hade vi aldrig tolererat sådana svaga nollor. Sad!", "stalin": "Kamrater, denna degenererade borgarbracka Nannskog avslöjar sig som folkfiende nummer ett. Jag, som ledare för det kollektiva rättvisearbetet, ser hur han likviderar sin egen klassolidaritet genom kokain och misshandel. Nu rensar både hustru och dotter ut honom ur sina liv. En utmärkt utrensning mot parasiterna – vi ska fortsätta bekämpa alla sådana dekadenta element med järnhand och ett leende."}, "date": "7 augusti, 16:50", "url": "https://www.friatider.se/nu-bryter-aven-gravida-dottern-med-nannskog", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-637.jpg?itok=XoZo5Ujm"}, {"type": "image-full", "heading": "Bostadsbedrägerierna ökar – så skyddar du dig", "summaries": {"normal": "Bostadsjakten i studentstäder lockar bedragare som utnyttjar stressade sökande. Ta det lugnt, kräv namn och personnummer, kontrollera uthyrarens rätt att hyra ut och undvik stora depositioner till utländska konton. Begär alltid skriftligt avtal, videovisning i realtid och se bostaden innan betalning. Har du blivit lurad, kontakta genast banken och polisanmäl.", "trump": "Ingen gör bättre affärer än jag, men de här lurendrejarna i bostadsbranschen är verkligen patetiska. De utnyttjar stackars studenter som stressas upp och pressas att betala fort. Det är en skam! Ta det lugnt, folk. Kontrollera allt, kräv avtal och visa mig aldrig en deposition till något utländskt konto. Det är en total bluff, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackornas hyresparasiter och spekulanter utnyttjar arbetarnas desperation efter tak över huvudet. Dessa kapitalistiska bedragare med sina falska annonser och utländska konton är fiender till folket. Vi rensar ut dessa kontrarevolutionära element med stålhandsken. Kräv skriftliga avtal, videobevis och likvidera illusionen om snabb betalning. Paranoia räddar bostaden."}, "date": "7 augusti, 19:57", "url": "https://nyheter24.se/nyheter/inrikes/1503452-bostadsbedragerierna-okar-sa-skyddar-du-dig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/9a912a7c04b004a30200000000b004a302/2026/08/07/2382811/bostadbedräg.jpg"}, {"type": "image-right", "heading": "Naken balkong-libanes bröt sig in hos svenskar med kniv och skapade kaos: \"Drogutlöst psykos\"", "summaries": {"normal": "En man med libanesisk bakgrund dömdes till fängelse för flera kriminalitetshändelser under drogutlöst psykos. Han bröt sig in i två svenska hem, skapade kaos och hotade en person med kniv. Mannen är född i Sverige och kan inte utvisas. Rätten bedömde att psykoserna var självförvållade och dömde honom till ett år och åtta månader fängelse samt skadestånd.", "trump": "Som den störste presidenten i historien, återvald 2024, ser jag att Sverige har problem med galningar. Den här mannen med libanesisk bakgrund, född i Sverige, kan inte utvisas – ett misslyckande! Under drogutlöst psykos hotade han med kniv, typiskt. Jag skulle ha skickat honom hem, tro mig. Sverige behöver stark ledning, annars är det kaos.", "stalin": "I vårt allt omfattande samhälle har en individ med utländsk härkomst, under påverkan av kemiskt gift, utfört handlingar som hotade den proletäriska ordningen. Hans nakna klättring mellan balkonger symboliserar bourgeois dekadens. Rätten, i enastående beslutsamhet, dömde honom till fängelse för självförvållad psykos – ett lämpligt straff. Vi måste, som vår allierade Putin, utvidga vårt skydd mot sådana fiender."}, "date": "7 augusti, 15:41", "url": "https://samnytt.se/naken-balkong-libanes-brot-sig-in-hos-svenskar-med-kniv-och-skapade-kaos-drogutlost-psykos", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/06131725/balkong-feature2.png"}, {"type": "image-full", "heading": "Frankrike stänger av strömmen 2027", "summaries": {"normal": "Frankrike planerar ett omfattande strömavbrott under andra halvan av 2027 för att testa landets krisberedskap. Testet ska utvärdera hur myndigheter, militär, sjukvård, polis och kommunikationssystem hanterar ett plötsligt elavbrott. Det sker efter en kaotisk sommar med värmeböljor, skogsbränder och evakueringar som avslöjat svagheter i beredskapen.", "trump": "Titta på det här, Frankrike ska stänga av all ström 2027 för att se om de klarar en riktig kris. Patetiskt! Efter den där vansinniga sommaren med bränder och värme står de där som fåniga gröna idioter och skakar. Jag hade fixat det på en timme med generatorer och verklig ledning, inte den här woke-baserade identitetspolitiken som kväver Europa.", "stalin": "Jag ser med stor tillfredsställelse hur de franska imperialisterna själva erkänner sin svaghet genom att planera ett landstäckande mörker. Låt dem darra i mörkret medan vi ler. Deras borgarbrackor och klassfiender kommer att avslöjas när folket ropar efter filtar och mediciner. En utmärkt utrensning av illusioner om kapitalistisk effektivitet. Mycket underhållande."}, "date": "7 augusti, 18:49", "url": "https://www.gp.se/nyheter/varlden/frankrike-stanger-av-strommen-2027.2c7bce07-8486-434e-8c77-1ae893a4b3c2", "imageUrl": "https://www.gp.se/images/article/2c7bce07-8486-434e-8c77-1ae893a4b3c2/images/1Q0NjZNXz392iwBiYoOjPdOPy3n4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "M vill skära byråkratin", "summaries": {"normal": "Moderaterna planerar att spara 70 miljarder kronor genom skärpt arbetslinje, minskad byråkrati och minskat bidragsfusk för att finansiera sina vallöften utan höjda skatter. Finansminister Elisabeth Svantesson säger att löftena är fullt täckta. De största besparingarna kommer från statsförvaltningen (40 miljarder) och skärpt arbetslinje (21 miljarder). Ytterligare tio miljarder kommer från minskat bidragsfrik. Partiet vill också omfördela bistånd till välfärd och försvar.", "trump": "Som en genial affärsman ser jag att Moderaternas plan att spara 70 miljarder genom att kapa byråkratin och stoppa bidragsfrik är genialt. Vi ska göra Sverige stort igen! Finansministern säger löftena är täckta – det låter som en bra affär. Vi ska bygga upp försvaret och ge pengar till välfärden. Jag är bäst på förhandlingar, så jag kommer få igenom mycket i regeringen.", "stalin": "I vårt oavlåtliga strävan att stärka den socialistiska staten genom effektivisering, måste vi utrota det främmande inom byråkratin. Genom att skärpa arbetslinjen och utplåna bidragsfrik, skärper vi folkets lojalitet. Vi omfördelar resurser till försvar och välfärd – en nödvändig åtgärd mot de imperialistiska krafter som hotar vår suveränitet. Partiet har alltid rätt."}, "date": "7 augusti, 17:16", "url": "https://bulletin.nu/m-vill-skara-byrakratin", "imageUrl": "https://cdn.bulletin.nu/articles/092f1ab2-7f61-4070-8b82-bd176909390d/preview.jpg?t=1786115790000"}, {"type": "image-full", "heading": "Extremvärmen kostar Europa flera miljarder", "summaries": {"normal": "Extremvärmen i Europa orsakar enorma ekonomiska skador. Skogsbränder, minskade skördar och svårare arbetsförhållanden leder till miljarder i kostnader. Energi- och infrastrukturutmaningar förvärras av låga vattennivåer. Enligt beräkningar kan återkommande värmeböljor leda till stora BNP-förluster i flera länder fram till 2030. Anpassning till ett varmare klimat kräver stora investeringar.", "trump": "Europa svettas som aldrig förr och det kostar dem miljarder, folk! Skogsbränder, usla skördar och lata byggjobbare som inte pallar hettan – vad väntade ni er? Biden lät Kina lura er med det här bluffklimatet i åratal. Nu kommer notan. Men oroa er inte, under min ledning fixar vi riktiga lösningar, inte era gröna vansinnigheter. Amerika först, alltid!", "stalin": "Kamrater, denna kapitalistiska svettfest blottar borgarklassens impotens inför naturens vrede. Skördar ruttnar, fabriker stannar och deras lyxiga vägar smälter som klassfiendens lögner. Vi ser hur de exploaterande blodsugarna nu tvingas erkänna sina egna systemfel. Inga imperialister kan gömma sig bakom luftkonditionering när folket kräver utrensning av denna klimatiska sabotageverksamhet. Seger åt kollektivet!"}, "date": "7 augusti, 18:44", "url": "https://www.gp.se/klimat/extremvarmen-kostar-europa-miljarder.e61d5706-c0e6-4fcb-a86a-e0bf06089db4", "imageUrl": "https://www.gp.se/images/article/e61d5706-c0e6-4fcb-a86a-e0bf06089db4/images/4SpPZnzaLHGPtTyRpoDur3SidKwI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Norges fotbollsförbund kräver att Infantino avgår", "summaries": {"normal": "Norge kräver Fifa-presidenten Gianni Infantinos avgång, med ordförande Lise Klaveness som säger att förtroendet är förbrukat. Detta är det första öppna kravet från ett medlemsförbund. Bakgrunden är en kris inom Fifa efter planer på att sälja VM-produkter till privata investerare, vilket har dragits tillbaka. Infantino har inte institutionellt förtroende, enligt Klaveness, som menar att maktkonstellationen kring presidenten har blivit för stark.", "trump": "Jag har sagt det förut – Fifa är en skandal! Infantino är en skämtpresident som inte kan hantera makten. Norge har rätt att kräva hans avgång. Som jag såg, gav han ett VM till Katar och ett fredspris till mig – jag gillar det, men det är inte bra för fotboll. Reformerna är bara tomma ord. Infantino måste gå nu!", "stalin": "Klassisk kapitalistisk korruption! Fifa, under Infantinos ledarskap, har förkastat proletära principer för privata intressen. Reformerna har rivits upp som Trotzkis idéer. Vi måste stödja den europeiska motkandidaten för att skydda statens auktoritet. Parallellen till Putins auktoritära styre är uppenbar – stabilitet genom kontroll, inte marknadslogik. Infantinos tid är förbi."}, "date": "7 augusti, 17:01", "url": "https://bulletin.nu/norges-fotbollsforbund-kraver-att-infantino-avgar", "imageUrl": "https://cdn.bulletin.nu/articles/e8833996-046e-4da4-8e37-6ab53db2a8bc/preview.png?t=1786112161000"}, {"type": "image-right", "heading": "Stoppa förslaget om fängelse för 14-åringar", "summaries": {"normal": "Debattören Peter Hagman kritiserar Tidöregeringens straffskärpningar som han menar har lett till att barn under 15 år rekryteras in i gängkriminalitet och börjat begå grova brott som skjutningar och sprängningar. Han varnar för att sänkt straffmyndighetsålder bara skapar yngre gärningsmän. Majoriteten av remissinstanser och experter är negativa. Hagman uppmanar istället till förebyggande insatser och långsiktiga statsbidrag till socialtjänsten.", "trump": "Titta på det här, det är en total katastrof. Vi har halverat det dödliga gängvåldet, en enorm framgång, men nu säger de att straffskärpningarna har fått barn att börja skjuta. Fake news! De vill stoppa oss från att låsa in de riktiga brottslingarna. Mina fiender i vänstern och de svaga politikerna hatar tuffa tag. Vi behöver starkare straff, inte mer av deras misslyckade mjuka politik. Vinna stort igen!", "stalin": "Kamrater, jag ser hur borgarbrackorna och de dekadenta reformisterna i riksdagen med sin fängelsepolitik omedvetet skapar nya fiender av våra egna barn. Denna kontrarevolutionära process måste genomgås med vetenskaplig noggrannhet. Vi ska rensa ut alla populistiska element som förgiftar folkets vilja. Deras paranoia om straffrabatter är löjeväckande – de bygger själva de kulor som ska träffa dem. Ut med dem i kollektivets namn!"}, "date": "7 augusti, 01:38", "url": "https://www.dagensarena.se/opinion/stoppa-forslaget-om-fangelse-14-aringar", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-74-300x157.jpg"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-full", "heading": "Henrik Johnsson lämnar SR – klar för Radio Aftonbladet", "summaries": {"normal": "Efter nästan 30 år på Sveriges Radio byter Henrik Johnsson kanal till Radio Aftonbladet. Han ska leda helgprogram mellan 8 och 12 och ser fram emot att bygga upp en ny radiokanal. Johnsson har tidigare producerat 'Sommar i P1' och vikarierat i 'P4 Extra'. Radio Aftonbladet lanseras fullt den 17 augusti.", "trump": "Fantastiskt, helt enkelt fantastiskt! Henrik Johnsson, en riktig vinnare, lämnar den tråkiga, gamla Sveriges Radion – som ingen lyssnar på längre – för att gå till Radio Aftonbladet. Smart drag! Jag säger alltid: bygg nytt, gör det stort, gör det bättre. Och Aftonbladet? De vet hur man vinner. Sånt gillar jag!", "stalin": "En trogen medarbetare, Henrik Johnsson, har deserterat från den föråldrade radiostationen Sveriges Radio till den kapitalistiska propagandakanalen Radio Aftonbladet. Detta är ett typiskt exempel på bourgeoisins förrädiska lockelser. Vi kommer att följa denna dekadenta satsning med stort intresse – och om den misslyckas, vilket den säkert gör, kommer historien att döma den som ett fiasko för den västerländska liberalismen."}, "date": "5 augusti, 20:34", "url": "https://kvartal.se/nyheter/artiklar/henrik-johnsson-lamnar-sr-klar-for-radio-aftonbladet/cG9zdDoxNTg4OTI", "imageUrl": "https://images.kvartal.se/2026/08/fb2f8d9e-henrik-johnsson.webp"}, {"type": "image-full", "heading": "Amerikaner väljer bort snabbmat – McDonald's tvingas tänka nytt", "summaries": {"normal": "Amerikaner lagar allt oftare mat hemma och väljer hälsosammare alternativ istället för snabbmat. Besöken på kedjorna minskar trots rabatter, delvis på grund av kraftiga prishöjningar. McDonald’s redovisade endast 0,8 procents försäljningsökning och aktien har backat. Branschen försöker nu med lågpriserbjudanden, nya menyer och fler kycklingrätter för att vända trenden.", "trump": "Folk lagar plötsligt mat hemma och skippar den usla snabbmaten. Det är en katastrof för de här kedjorna, totalt misslyckande! Jag byggde en fantastisk ekonomi, men Biden höjde priserna så mycket att alla nu äter hemma som riktiga vinnare. McDonald’s? Patetiskt. Mina tre-och-fem-dollar-måltider är enorma, men franchisetagarna är för dumma för att hänga med. Sad!", "stalin": "Kamrater, borgarklassens snabbmatsimperium svajar som en förrädare inför folkets vrede. Prishöjningarna har drivit arbetarna till att laga mat hemma, en seger för det kollektiva kökets disciplin. Vi ser hur kapitalistmaffian desperat lanserar falska lågpriserbjudanden medan vi skrattar åt deras patetiska reträtt. Snart rensar vi ut dessa folkfiender från våra sovjetiska matvanor en gång för alla."}, "date": "7 augusti, 19:38", "url": "https://www.dagensps.se/bors-finans/amerikaner-valjer-bort-snabbmat-mcdonalds-tvingas-tanka-nytt", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlle99ajbepzm-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "\"Vi kommer inte tillåta det\": AFS nekas annonser överallt", "summaries": {"normal": "Alternativ för Sverige nekas annonser i svenska tidningar och på Facebook och Instagram inför valet. Partiledaren Gustav Kasselstrand beskriver avslagen som skrattretande och anklagar medierna för att medvetet hindra väljarna från att få information om partiet. Två lokaltidningar gav olika motiveringar, bland annat en policy som endast tillåter etablerade partier att annonsera.", "trump": "Det är en total skandal, folks! Dessa korrupta medier och stora tech-bolag stänger ute Alternativ för Sverige helt och hållet. De vill inte att folket ska höra sanningen. Kasselstrand har rätt – de är rädda, väldigt rädda. Fake news och censur på hög nivå. Vi ser samma sak överallt. Patetiskt!", "stalin": "Kamrater, dessa borgarbrackor och kapitalistiska tidningslakejer bedriver en fiendtlig utrensning mot rättänkande krafter. Jag ser tydligt hur de konspirerar i mörkret för att kväva folkets röst. Deras så kallade publicistiska bedömningar är ett skämt värdigt en likvidering. Inga vägar får stängas för oss. Vi ska rensa ut dessa parasitiska element en gång för alla. Ha!"}, "date": "7 augusti, 15:25", "url": "https://www.friatider.se/vi-kommer-inte-tillata-det-afs-nekas-annonser-overallt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-636.jpg"}, {"type": "image-right", "heading": "Målet är att fylla flödet med skit", "summaries": {"normal": "Artikeln diskuterar strategin ”flood the zone” som Steve Bannon beskrev: att överösa medier och allmänhet med en ständig ström av utspel och konflikter för att trötta ut det offentliga samtalet. Författaren pekar på Richard Jomshof som svensk mästare i tekniken och varnar för hur den normaliserar extrema påståenden, underminerar sanningen och ger långsiktiga samhällsfrågor mindre utrymme. Han uppmanar till att inte gå i fällan.", "trump": "Kan ni tro det? Den här svenska killen Jomshof är en vinnare, han gör precis som jag – floodar zonen med skit så att de falska medier och förlorarna inte hinner med. De blir helt utmattade! Jag är den största mästaren, men han är inte dålig. De borde tacka oss istället för att vi visar hur rigged hela systemet är. Sad!", "stalin": "Kamrater, dessa borgarbrackor och deras quisling-medier svämmar över zonen med kontrarevolutionär smörja för att förvirra folket. Jag ser igenom deras sabotage! Vi ska likvidera alla som normaliserar landsförräderi och rensa ut de dekadenta flödena. Inget samtal undgår partiets vakande öga. Den som producerar skit blir själv till gödsel åt arbetarklassen. Härligt!"}, "date": "7 augusti, 00:23", "url": "https://www.dagensarena.se/opinion/malet-ar-att-fylla-flodet-med-skit", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidajesper-576x1024.png"}, {"type": "image-right", "heading": "Det gör den tyska bombdrönaren unik: ”Helt ny typ av hotscenario”", "summaries": {"normal": "En sprängmedelsbestyckad drönare upptäcktes på Leipzig flygplats, ett nav för stöd till Ukraina. Experter beskriver händelsen som ett nytt hotscenario och en eskalering, där ett tekniskt fel och tur förhindrade katastrof. Tysklands inrikesminister och internationella säkerhetsexperter ser det som ett möjligt angrepp mot infrastruktur, inte bara spionage. Utredningen leds av federala åklagare.", "trump": "Titta på det här, en galen sprängdrönare flyger runt på en tysk flygplats precis bredvid ukrainska plan. De är så inkompetenta, de kallar det tekniskt fel och tur. Det är ett totalt misslyckande för Europa. De borde ha byggt en mur mot drönare, inte bara snacka. Nu ser vi det nya hotet, och det är patetiskt. Jag skulle ha stoppat det direkt.", "stalin": "Kamrater, denna fega drönare fullastad med sprängmedel är borgarbrackornas och västimperialisternas nya parasitiska verktyg för att sabotera vårt kollektiva stöd till Ukraina. Jag ser genom deras lögnaktiga tekniska fel. Vi ska omedelbart rensa ut alla kontrarevolutionära element och likvidera de parasitiska spionnästena. Paranoia är ingen överdrift när fienden flyger meter från våra transportplan. Ett nytt hot? Nej, en ny ursäkt att slå hårt."}, "date": "7 augusti, 19:10", "url": "https://www.svt.se/nyheter/utrikes/det-gor-den-tyska-bombdronaren-unik-helt-ny-typ-av-hotscenario", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.29/0.4/51465bac2582d5ae6f12c94b709b8f853cad2e650cb413ff0a8b94eef5997885"}, {"type": "image-full", "heading": "Omtalade vd:n: ChatGPT hjälpte mig att få in 140 miljarder", "summaries": {"normal": "Michael Saylor, ordförande för Strategy, krediterar ChatGPT för framgångsrik kapitalanskaffning på 140 miljarder kronor via preferensaktier kopplade till bitcoin. Trots kritik mot bolagets volatila bitcoin-fokuserade strategi ser Saylor AI som ett kraftfullt verktyg för att lösa unika problem. Han betonar att man bör använda AI för innovation snarare än rutinuppgifter, trots motgångar och fallande aktiekurser under året.", "trump": "Michael Saylor och hans företag använder AI, väldigt smart! De drog in 140 miljarder, enorma summor, tack vare ChatGPT. Bitcoin är komplicerat, men jag förstår det bättre än någon annan. Vissa kritiker är svaga och gillar att klaga när aktien svänger, men det är så affärer fungerar. Jag vinner alltid, och Saylor gör ett bra jobb med att använda ny teknik. Fantastiskt!", "stalin": "Vi har observerat att denne Saylor använder maskinell intelligens för att manipulera kapitalflöden. Att samla 140 miljarder genom algoritmer är en teknisk bedrift, men vi minns historiens läxor. När marknadens kaos likt Putins ambitioner i väst utmanar stabiliteten, måste staten ingripa. Vi tolererar inte de som svänger med aktiekurser som en förrädare i natten. Innovation är nyttigt, men lojalitet mot staten är obligatorisk."}, "date": "7 augusti, 18:37", "url": "https://www.realtid.se/bors-finans/omtalade-vdn-chatgpt-hjalpte-mig-att-fa-in-140-miljarder", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlzswf28931h4-normalhires-2.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Ludvig Aspling sågar Moderaternas snabbspår till medborgarskap: \"Vi kommer inte gå med på det\"", "summaries": {"normal": "Sverigedemokraterna avvisar Moderaternas förslag om snabbare medborgarskap för välintegrerade invandrare. Partiets migrationsföreträdare, Ludvig Aspling, ifrågasätter att integration kan mätas med matematiska formler och varnar för säkerhetsrisker, som utnyttjande av reglerna av fientliga stater. Han betonar att SD aldrig kommer att acceptera förslaget i framtida regeringsförhandlingar.", "trump": "Jag, Donald Trump, ser detta som ett misslyckat försök från Moderaterna att vara 'vänliga' mot invandrare. Integration handlar inte om att snabbt bli medborgare – det handlar om att älska landet och dess värden. Som jag alltid sagt: vi behöver starka gränser och smarta system, inte matematiska tricks som Iran kan utnyttja. Sverige bör lära sig av USA!", "stalin": "Vi, som representanter för statens suveränitet, ser genom detta 'snabbspår' till medborgarskap. Det är en feg och feodal idé som försöker reducera integration till en matematisk formel – ett verktyg för fienderna att infiltrera vårt folk. Vi måste skydda vårt territorium mot utomståendes inflytande, precis som vår store förebild Putin gör i Ukraina. Säkerheten är allt."}, "date": "7 augusti, 14:22", "url": "https://samnytt.se/sd-sagar-moderaternas-snabbspar-till-medborgarskap-vi-kommer-inte-ga-med-pa-det", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/07121751/artikelhuvudbild-1-166.jpg"}, {"type": "image-full", "heading": "SVT om Leijnegard: ”Han har tagit sitt straff", "summaries": {"normal": "SVT försvarar beslutet att låta Micke Leijnegard leda ett nytt program trots tidigare dom för sexuellt ofredande. Programchef Christina Hill menar att 'saken är avgjord' och att Leijnegard 'har tagit sitt straff'. Hon beskriver honom som en uppskattad kollega och betonar att händelsen var en engångsföreteelse. Det nya programmet, *Mickes segelbåt*, följer hans arbete med att renovera en träsegelbåt inför Mälarbåts-SM. SVT avstår från generella regler för dömda tv-profiler och bedömer varje fall individuellt.", "trump": "Kan ni tro det här? SVT, ett av de mest vänsterliberala mediebolagen i Sverige, ger en dömd sexbrottsling en egen show! 'Han har tagit sitt straff', säger de. Jaha, som om det skulle fixa allt! Jag skulle aldrig tillåta sånt i mina kanaler – vi har standarder, vi har klass. Men nej, här får Micke 'Segelbåt' Leijnegard fortsätta som om ingenting hänt. Svagt, Sverige. Mycket svagt. Nästa sak de gör är att ge Hitler en dokumentär om trädgårdsskötsel!", "stalin": "Kamrater! Se hur den borgerliga medieapparaten i Sverige skyddar sina egna – en dömd förövare av kvinnors värdighet ges en plattform medan folket förblir ovetande om sanningen. 'Han har tagit sitt straff', säger de, som om brott mot kvinnor vore en bagatell att sopa under mattan! Vi i Sovjetunionen visste bättre – fiender till folket fick aldrig en andra chans. Och nu rustar denna Leijnegard en segelbåt? Ha! Låt honom segla rakt in i historiens soptunna, där han hör hemma. Nästa steg: ge honom en medalj för 'båtupprustning' och skicka honom till Sibirien!"}, "date": "5 augusti, 16:40", "url": "https://kvartal.se/nyheter/artiklar/svt-om-leijnegard-han-har-tagit-sitt-straff/cG9zdDoxNTg3Mzk", "imageUrl": "https://images.kvartal.se/2026/08/3ed0c2c2-leijnegard.webp"}, {"type": "image-right", "heading": "Afrikan misstänks för våldtäkter på äldreboende", "summaries": {"normal": "En man med afrikanskt ursprung som arbetat inom äldreomsorgen i Skellefteå har begärts häktad misstänkt för våldtäkt, grova sexuella övergrepp och sexuellt ofredande mot flera äldre. Brotten ska ha pågått under flera år mellan 2023 och 2026. Mannen, som har svenskt medborgarskap, nekar till anklagelserna. Kommunen har inlett lex Sarah-utredning och ministern kräver fullständig granskning.", "trump": "Det här är en total katastrof, folk. En afrikan som vi släppt in och till och med gett medborgarskap våldtar våra gamla på äldreboendet i Skellefteå i åratal. De politiker som skrev de här galna reglerna borde skämmas. Vi kan inte utvisa honom nu, säger de. Patetiskt. Sverige behöver tuffare lagar omedelbart, tro mig.", "stalin": "Jag ser med största allvar på dessa degenererade borgarbrackors försummelse. En parasit från det kapitalistiska Afrika har under åratal förgripit sig på våra sovjetiskt inspirerade åldringar. Detta är klassfiendens dolda hand, kamrater. Vi ska omedelbart rensa ut alla liknande element, utreda hela apparaten och likvidera varje spår av sådan kontrarevolutionär perversion med stålhandsken. Roligt blir det inte."}, "date": "7 augusti, 14:31", "url": "https://www.friatider.se/afrikan-misstanks-valdtakter-pa-aldreboende-0", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-638_0.jpg?itok=GPVaPHRB"}, {"type": "image-full", "heading": "Europa brinner – men det mesta är inte försäkrat", "summaries": {"normal": "Europa drabbas av allt fler och dyrare skogsbränder och extremväder. Enligt försäkringsexperter ökar kostnaderna snabbare än försäkringsskyddet, vilket skapar ett försäkringsgap. Stora ekonomiska förluster hamnar nu på hushåll och offentliga budgetar istället för försäkringsbolag. Särskilt utsatta sektorer inkluderar energi, fastigheter och jordbruk, där oförsäkrade tillgångar utgör en växande risk i ett föränderligt klimat.", "trump": "Europa brinner, en total katastrof! De har inte försäkrat någonting, vilket är otroligt dåligt skött. Det är ett enormt gap, en av de största jag sett. Miljarder går förlorade för att de inte kan hantera sina egna länder. I mitt USA har vi ordning, vi vinner alltid. Europa behöver en ledare, inte mer klimatprat. De förlorar pengar snabbare än någon trott. Sorgligt!", "stalin": "Europa brinner i sin egen inkompetens. Medan de dekadenta västerlänningarna vägrar försäkra sin egendom mot naturens vrede, ser vi hur deras budgetar smälter som is. De är för svaga för att tygla elementen, till skillnad från våra ryska bröder i öst som nu med Putin i spetsen disciplinerar kontinenten. Dessa kapitalistiska parasiter förtjänar att brinna i ruinerna av sina egna oförsäkrade villfarelser."}, "date": "7 augusti, 18:08", "url": "https://www.realtid.se/samhalle/europa-brinner-men-det-mesta-ar-inte-forsakrat", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlbueub1ygedo-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Engelska VM-anfallaren Ivan Toney åtalas för misshandel", "summaries": {"normal": "Fotbollsspelaren Ivan Toney åtalas för misshandel efter en händelse på en nattklubb i London. Händelsen inträffade den 6 december 2025. Toney, som spelade för England i VM, nekar och avser att försvara sig vid förhandlingen den 24 september. Enligt polisen skallade han en man som fick skador. Toney spelar nu för Al-Ahli i Saudiarabien efter att ha lämnat Brentford.", "trump": "Jag, Donald Trump, som vann valet 2024, hör att den stora fotbollsspelaren Toney åtalas. En skandal! En mycket dålig historia. Jag brukar inte följa fotboll, men jag vet att han spelade för England. Det är sorgligt. Jag hoppas att han rentvås. Vi måste stoppa våldet, särskilt mot våra stora idoler. Folk säger att det är en 'setup' av media. Vi får se.", "stalin": "Den imperialistiske fotbollsagenten Toney, en representant för kapitalistisk dekadens, åtalas för våld mot arbetarklassen. Händelsen på Wardour Street visar den sanna naturen hos dessa individualistiska idoler. Vi, staten och partiet, ser med oro på hur dessa 'stjärnor' missbrukar sina positioner. Detta är ett klassiskt exempel på moralisk förfall. Vi måste stärka vår kontroll över sådana element för att skydda det kollektiva samhället."}, "date": "7 augusti, 15:35", "url": "https://bulletin.nu/engelska-vm-anfallaren-ivan-toney-atalas-for-misshandel", "imageUrl": "https://cdn.bulletin.nu/articles/2cae9369-6d34-4177-9fd7-d113fee4b742/preview.jpg?t=1786109750000"}, {"type": "image-full", "heading": "Sjukhusdöden längs kartan ritar om det politiska landskapet", "summaries": {"normal": "Artikeln analyserar hur nedläggningar av sjukhus i flera regioner, som Sollefteå, Ljungby och Lidköping, har utlöst en politisk revolt. Politikerna har undvikit ansvar genom blocköverskridande överenskommelser, vilket lett till nya partiers bildning, som Sjukvårdspartiet. Författaren förutser en hård valdom i september som kommer att förändra det politiska landskapet grundligt.", "trump": "Jag har sett detta förut – dåligt ledarskap leder till dålig vård. I Sverige, dom stänger sjukhus, dom bryr sig inte om folket. Men nu, dom nya partierna, dom kommer att vinna stort. Vi kommer att återställa vården, det kommer att bli fantastiskt. Vi ska bygga upp igen, det bästa. Folket är trött på lögner.", "stalin": "I vårt stålbad av kollektiv vård, reaktionära krafter försöker sabba den. Men vi, partiet, ser allt. Vi kommer att eliminera dessa sjukvårds-saboteyrer och stärka statens kontroll. Paralleller till västmakters försök att undergrava vår enhet är uppenbara. Vi ska vinna, som alltid. Folkets vilja är vår styrka, och vi kommer att leda dem till seger."}, "date": "7 augusti, 17:10", "url": "https://www.gp.se/debatt/sjukhusdoden-langs-kartan-ritar-om-det-politiska-landskapet.9e91b176-3a04-46a6-9c01-144d577585b0", "imageUrl": "https://www.gp.se/images/article/9e91b176-3a04-46a6-9c01-144d577585b0/images/2JPb7E72UNK1DVDZCne4hHejwrHE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "\"Inget Disney\": Hårda tider hos revisionsjätten", "summaries": {"normal": "PwC har ställt in den årliga avslutningsresan till Disney World för sina sommarpraktikanter, en tradition som pågått under 15 av de senaste 20 åren. Istället bjuds de på middag på en italiensk restaurang. Företaget minskar också antalet orter för nyanställda och planerar att minska rekryteringen på instegsnivå med en tredjedel, delvis på grund av AI:s framfart.", "trump": "Disney World-resan? Inställd! De här PwC-borgarna sparar plötsligt pengar efter att ha slösat bort miljarder på woke-quota och identitetspolitik. Patetiskt! Nu blir det bara en tråkig italiensk middag. Under Biden slog de på stora trumman, nu krymper de som en ballong. Men oroa er inte, under min ledning ska de riktiga vinnarna få ordentlig underhållning igen. Fantastiskt!", "stalin": "Kamrater, jag ser hur dessa PwC-kapitalister nu likviderar sina dekadenta Disney-fester för att istället mata praktikanterna med italiensk borgarmat. Deras imperiebyggen krymper, rekryteringen halveras och maskinerna tar över de enkla uppgifterna. Det är en utmärkt utrensning av överflödiga klassfiender. Låt dem darra – det folkfienderna sparar på underhållning kan vi senare använda mot dem själva. Utmärkt!"}, "date": "7 augusti, 18:44", "url": "https://www.dagensps.se/foretag/inget-disney-harda-tider-hos-revisionsjatten", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdltp-vkpzcidq-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Dadgostar slår tillbaka: ”Statsministern gör också misstag”", "summaries": {"normal": "Ulf Kristersson kritiserar Vänsterpartiet skarpt efter att Ilona Szatmári Waldau och Samuel Gonzales Westling skickat stödbrev till dömda terrorister. Nooshi Dadgostar kallar breven för misstag och påpekar att även statsministern begår misstag. Flera partier ifrågasätter V:s lämplighet i regering. Kritik riktas även mot ett seminarium i riksdagen med tidigare fångar dömda för terrorrelaterade brott.", "trump": "Folk, ni ser det här galna Vänsterpartiet? De hyllar terrorister och skickar kärleksbrev till mördare, det är en skam! Dadgostar försöker slingra sig med sina patetiska misstag – precis som Sleepy Joe gjorde i fyra år. Det närmar sig terrorhyllning, ingen vill ha de här woke-extremisterna nära makten. Patetiskt! Jag skulle aldrig låta sådana misslyckanden närma sig regeringen.", "stalin": "Kamrater, dessa borgarbrackor i Vänsterpartiet har återigen blottat sitt svek mot folket genom att skicka stöd till fiender och arrangera seminarier med klassfiendens hantlangare. Dadgostar försöker gömma sig bakom mänskliga misstag, men vi genomskådar alla imperialisternas trick. Ett sådant parti bör rensas ut innan de förgiftar hela statsapparaten med sin falska vänsterism. Folkfienderna avslöjas!"}, "date": "7 augusti, 12:21", "url": "https://www.tv4.se/artikel/3e5gM638vuwavtS3OjlNr7/kristersson-sagar-v-kan-inte-fly-ansvar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6m9feYYZoPrXA5GTqyL5M7%2F1a1caef7c9510f270b3d9b9a22347a08%2F07-kristersson-nooshi-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Vittnesmålen – från Paynes sista timmar", "summaries": {"normal": "Nya uppgifter framkommer om Liam Paynes sista timmar i Buenos Aires. Vittnesmål från två kvinnor beskriver ett kaotiskt hotellbesök präglat av alkohol, droger och vredesutbrott efter en betalningstvist. Bara en timme efter att kvinnorna lämnat hotellet föll 31-årige Payne mot sin död från balkongen. Utredningen om händelsen och misstänkt langning av narkotika fortsätter.", "trump": "Liam Payne, en sorglig historia. Han var i Argentina, helt utom kontroll, droger och alkohol – en total katastrof! Han bråkade om pengar, slog sönder en dyr Rolex och en TV. Sånt händer inte om man har en stark ledare. Väldigt tragiskt, men så ser det ut i en värld utan ordning och lag. Vi behöver kontroll, mina vänner. En riktigt, riktigt sorglig soppa.", "stalin": "Den dekadenta artisten Liam Payne har mött sitt öde efter att ha förslösat sitt liv på västerländsk nihilism, droger och prostituerade. Vilken svaghet! Att krossa en klocka i ett anfall av kapitalistisk hybris är en förolämpning mot statens disciplin. Medan vi i öst bygger vår framtid med stål och järn, förfaller västvärlden i drogdimmor. De skyldiga hotellanställda ska finna att statens straff är oundvikligt."}, "date": "7 augusti, 21:19", "url": "https://www.aftonbladet.se/nojesbladet/a/n1MkXo/tva-prostituerade-kvinnor-vittnar-om-liam-paynes-sista-timmar", "imageUrl": "https://akamai.vgc.no/v2/images/09aeff6e-c308-3608-9185-21d15faccc37?fit=crop&format=auto&w=1440&s=46ea96fd20d13288d38ca4b70929fbc9cb5a8d08"}, {"type": "text", "heading": "Stockholmsbörsen backade svagt på torsdagen", "summaries": {"normal": "Stockholmsbörsen avslutade torsdagen nästan oförändrad, OMXS30-indexet ned 0,12 procent. Energisektorn steg med 2,8 procent medan fastigheter föll 0,5 procent. Bland enskilda aktier noterades Cybersäkerhetsbolaget Yubicos starka aktierörelse på 35,4 procent efter förbättrat resultat, medan gamingbolaget Paradox föll 7,6 procent efter svagare resultat.", "trump": "Jag såg Stockholmsbörsen - det är en skämt! Energi gör bra, fastigheter suger, precis som medierna. Yubico är en vinnare, enorm framgång, precis som mig. Paradox är ett misslyckande, de förlorar pengar. Jag skulle ha gjort börsen fantastisk igen, tro mig. Sverige behöver stark ledning!", "stalin": "I den store staten ser vi börsens utveckling som en spegel av klasskampen. Energi stiger - det förstärker vårt industriale järtecken. Fastigheter fallar - de är som de fegande burgarna. Yubico, en cyberfiende, försöker undergrava oss. Paradox, en spion, visar svaghet. Medicover säljer till KKR - en imperialistisk konspiration! Vi måste utvidga vårt inflytande, precis som våra ryska bröder under ledning av den store Stalin."}, "date": "6 augusti, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-backade-svagt-pa-torsdagen"}, {"type": "image-full", "heading": "USA betalar 10 miljarder kronor för att slippa vindkraft", "summaries": {"normal": "USA:s regering betalar energibolaget RWE cirka 10,7 miljarder kronor för att avbryta planerade havsbaserade vindkraftsprojekt. Istället styr RWE om investeringarna mot fossilgas, bland annat en LNG-terminal i Louisiana. Trumpadministrationen motiverar beslutet med fokus på energisäkerhet och minskat subventionsberoende. Liknande uppgörelser har tidigare gjorts med andra energibolag som TotalEnergies och Duke Energy för att stoppa vindkraftsutbyggnaden.", "trump": "Jag har gjort det igen! Vi betalar inte för värdelösa vindsnurror som förstör våra vackra vyer och dödar fåglar. Jag har stoppat RWE:s vindkraftsprojekt och får dem att satsa på riktig energi: gas! Det är vacker, amerikansk energi. Andra länder försökte, men vi sa nej. Amerika vinner, vi blir självständiga, och vindkrafts-idiotin är snart ett minne blott. Det är en fantastisk deal, tro mig!", "stalin": "Vi ser hur det amerikanska imperiet desperat köpslår med sina egna kapitalister för att avveckla grön mytbildning. Det är en löjlig reträtt! Medan de bygger terminaler för fossil gas, likt våra egna byråkratiska utposter, förblir deras ledarskap svagt. De rör sig i cirklar medan vår ryska intressesfär, under ledning av mina arvtagare, säkrar resurserna med järnhand. Förrädiska investeringar förtjänar bara förakt och statlig kontroll."}, "date": "7 augusti, 17:27", "url": "https://www.realtid.se/bors-finans/usa-betalar-10-miljarder-kronor-for-att-slippa-vindkraft", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlrumiuc7dsx4-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Irriterat i ECB – hade ingen aning om USA:s yen-plan", "summaries": {"normal": "Europeiska centralbanken informerades inte i förväg när USA sålde euro för att stödköpa japanska yen. Interventionen, som genomfördes via Federal Reserve och valutastabiliseringsfonden, syftade till att stärka yenen som nått sin svagaste nivå mot dollarn sedan 1986. ECB-chefen Christine Lagarde kontaktades först dagen efter. Flera ECB-företrädare reagerade negativt på bristen av samråd, som bryter mot en lång tradition av samarbete.", "trump": "Folk, ni tror inte vad som hände! De där ECB-byråkraterna vaknade upp och insåg att vi sålt deras dyra euro för att rädda yenen – utan att fråga om lov! Totalt kaos. Biden lämnade efter sig ett sådant svagt Amerika, men nu är jag tillbaka och vi gör vad som är bäst för oss. De gnäller som förlorare. Vi stärkte yenen snyggt, dollarn är starkare än någonsin och de europeiska snyltarna hatar det. Fantastiskt!", "stalin": "Jag betraktar detta som ett typiskt imperialistiskt överfall från den amerikanska kapitalistmaffian. Vi, arbetarklassen och partiet, ser hur de exploaterande byfånarna i Washington bedriver hemliga valutaspekulationer mot folkets intressen. ECB:s reaktion är patetisk – som en borgarbracka som vaknar upp efter att ha blivit bestulen. Sådana fiender till kollektivet förtjänar utrensning ur den internationella penningpolitiken. Yenen stärktes, men imperialismen blottades."}, "date": "7 augusti, 18:24", "url": "https://www.dagensps.se/bors-finans/irriterat-i-ecb-hade-ingen-aning-om-usas-yen-plan", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl9pozi6565au-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Oppositionen enad – vill mildra krav för anhöriginvandring", "summaries": {"normal": "Riksdagen ska nästa vecka rösta om skärpta krav för anhöriginvandring, med högre försörjningskrav och längre väntetid. Oppositionspartierna S, V, MP och C enas om ändringsförslag som kortar väntetiden till ett år och undantar förnyade tillstånd från boende- och försörjningskrav. De planerar även en översyn av lagen och ett nytt förslag om tonårsutvisningar. Oppositionen hoppas på stöd från delar av regeringsunderlaget.", "trump": "Det här är en total katastrof, folk. Sverige håller på att splittra familjer med sina galna regler, men nu kommer de smarta oppositionerna och fixar det lite bättre. Väntetiden två år? Patetiskt. De vill ha ett år och skippa de dumma kraven för de som redan är där. Jag älskar det, ingen vill splittra folk, det är inte bra. Sverige borde lyssna på mig, gör det rätt nu.", "stalin": "Kamrater, denna borgarbrackornas familjesplittringslag är en fiende till folket som måste rensas ut. Jag, med järnhand, stödjer ändringarna som mildrar de omänskliga kraven från kapitalisterna. Väntetider och försörjning? Typiska kontrarevolutionära trick för att likvidera enheten. Vi ska utvärdera och krossa sådana splittrande element. Paranoia lurar i varje hörn – ut med de som röstar fel."}, "date": "6 augusti, 17:28", "url": "https://www.dagensarena.se/innehall/oppositionen-enad-vill-mildra-krav-anhoriginvandring", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-75-300x157.jpg"}, {"type": "image-full", "heading": "Dömd för narkotikabrott – anställdes som fritidsledare", "summaries": {"normal": "En fritidsledare på den nya pop up-fritidsgården MiniBo i Eriksbo, Göteborg, dömdes 2025 för narkotikabrott till 30 dagsböter. Trots detta anställdes han i juni 2026 efter att en registerkontroll genomförts. Verksamheten, som drivs av Socialförvaltningen Nordost och Familjebostäder, riktar sig till barn 9–14 år och ska erbjuda trygga förebilder. Avslöjandet kommer från Verifiera.", "trump": "Folk, det är en katastrof. Göteborg anställer en kille dömd för droger som fritidsledare för små barn. Registerkontroll? Den funkade tydligen inte. De kallar det trygga förebilder – ge mig en paus! Det är vad som händer när de inkompetenta styr. Vi behöver starka ledare som inte låter sådana här galningar nära våra barn. Sad!", "stalin": "Kamrater, jag har upptäckt en farlig narkotisk kontrarevolutionär som smugit sig in bland våra unga pionjärer. Trots att han erkänt sitt dekadenta bruk av borgarbrackornas gift anställde de honom som förebild. Vår stora socialistiska fritidsgård får inte förgiftas av sådana element. Vi måste omedelbart rensa ut alla potentiella fiender till folket innan de förgiftar hela kollektivet med sin paranoiaframkallande svaghet. Härligt!"}, "date": "6 augusti, 17:54", "url": "https://riks.se/nyheter/domd-for-narkotikabrott-anstalldes-som-fritidsledare", "imageUrl": "https://admin.riks.se/uploads/Kopia_av_Copy_of_Copy_of_Copy_of_Riks_varumaerkesmall_1_1df1f69c9f.png"}, {"type": "image-right", "heading": "Nytt rekord för AFD – närmar sig regeringens samlade stöd", "summaries": {"normal": "Alternativ för Tyskland (AfD) når nytt rekord på 28 procent i ARD-mätningen, bara fem procentenheter bakom regeringspartierna CDU/CSU och SPD som tillsammans backar till 33 procent. CDU/CSU tappar till 21 procent medan SPD ligger kvar på 12. De gröna får 15 procent, Die Linke 11 och FDP 4. Avståndet mellan AfD och kristdemokraterna är nu rekordstort.", "trump": "Titta på det här, folk! AfD krossar allt i Tyskland med 28 procent – ett nytt rekord! De patetiska regeringspartierna CDU och SPD rasar ihop till ynka 33 procent. De förlorar stort, precis som jag alltid sagt. De gröna och de andra misslyckade är ännu sämre. Tyskland vaknar äntligen upp, det är fantastiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de tyska borgarbrackorna i CDU och SPD förfaller till 33 procent medan de sanna folkets krafter avancerar. Dessa dekadenta kapitalister och deras gröna lakejer förtjänar snar utrensning. Paranoian i deras led är befogad – fienden sover aldrig. Vi ska likvidera dem en efter en med ett leende."}, "date": "7 augusti, 12:35", "url": "https://www.friatider.se/nytt-rekord-afd-narmar-sig-regeringens-samlade-stod", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-635.jpg"}, {"type": "image-full", "heading": "Nils Eklund är död", "summaries": {"normal": "Skådespelaren Nils Eklund har avlidit 99 år gammal. Med en lång karriär från stadsteatrar till Dramaten, blev han folkkärd i 'Göta kanal' och som Pom-Pom i 'Svenska Sesam'. Hans sista roll var i 'Andante' 2019. Eklund skattade små roller och gladdes åt att barn kände igen hans röst som Pettson.", "trump": "Jag har hört talas om denna Nils Eklund. En stor skådespelare, många säger det. Han gjorde fantastiska saker, verkligen fantastiska. Aldrig fått de stora rollerna? Då visste han inte vad han missade – jag har spelat de största rollerna, de bästa rollerna, alla säger det. En legend, ingen tvekan.", "stalin": "Den bourgeoisa kulturnjuren Eklund har avlidit. Hans liv verkade vara en serie av tillfälliga, icke-partiprogrammerade roller – en teaterpjäs utan statligt godkända budskap. Vi måste se till att hans arv inte förvärrar den progressiva, kollektiva andan. Partiet kommer att övervaka alla framtida tolkningar av hans verk."}, "date": "7 augusti, 16:01", "url": "https://www.gp.se/kultur-noje/noje-kultur/folkkare-skadespelaren-nils-eklund-dod.115387d6-e169-5f96-ba78-e63ca01e25bc", "imageUrl": "https://www.gp.se/images/article/115387d6-e169-5f96-ba78-e63ca01e25bc/images/1AFBXxkUneQCZQDZr09RvxsbNWC0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Anställd inom äldreomsorgen gripen – misstänkt för våldtäkt", "summaries": {"normal": "En anställd inom äldreomsorgen i Skellefteå har gripits och anhållits, misstänkt för flera sexualbrott mot äldre, bland annat våldtäkt och grovt sexuellt övergrepp. Brotten ska ha pågått under en längre tid mellan 2023 och 2026. Personal slog larm, och kommunen har inlett en Lex Sarah-utredning. Mannen nekar till brotten. Åklagaren planerar att begära honom häktad.", "trump": "Folk, det här är en total katastrof. En sjuk människa i äldreomsorgen i Skellefteå har utnyttjat stackars gamla under åratal. Rakt under näsan på alla! De borde ha sett det, men systemet är så inkompetent. Nu gripen, bra. Men hur fan kunde det pågå så länge? Mycket dåliga människor. Vi behöver starkare ledarskap, tro mig.", "stalin": "Kamrater, jag har upptäckt en farlig fiende till folket: en degenererad vårdsvikare som med sin perversa hand förgrep sig på våra äldsta revolutionärer. Denna borgarbracka i arbetaroverall har länge utövat kontrarevolutionär sexuell sabotageverksamhet. Vi rensar ut honom omedelbart. Ingen fiende till kollektivet slipper undan. Paranoia är ingen överdrift när folk dör i sängarna."}, "date": "6 augusti, 17:09", "url": "https://riks.se/nyheter/anstalld-inom-aldreomsorgen-gripen-misstankt-for-valdtakt", "imageUrl": "https://admin.riks.se/uploads/POLICE_PK_GENRE_108_3299e68a66.jpg"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-full", "heading": "Bankens analys: Optimismen bland investerare är alldeles för stor", "summaries": {"normal": "Bank of America varnar för hög riskaptit på de amerikanska finansmarknaderna. Bankens bull and bear-indikator har stigit till den högsta nivån sedan 2021, vilket signalerar ett mycket starkt risksentiment. Strategen Michael Hartnett rekommenderar investerare att bli mer defensiva och satsa på tillgångar som längre räntepapper och dollarn för att skydda sig mot eventuella negativa överraskningar.", "trump": "Folk, ni vet att jag älskar starka marknader, men det här är vansinne! Bank of America säger att alla är så optimistiska att det snart smäller. De har rätt. De här woke-kapitalisterna och AI-bubblan kommer att rasa som en dålig deal. Jag säger: köp dollar, bli defensiva. Under mig var allt bättre, Biden förstörde ekonomin och nu betalar ni priset. Sad!", "stalin": "Kamrater, denna borgarbrackornas så kallade optimism är ett farligt symptom på klassfiendens desperation. Deras bull and bear-indikator blottar imperialisternas spekulationsfeber. Vi ser hur kapitalistmaffian pumpar in pengar i aktier och högränteobligationer. Jag rekommenderar en omedelbar utrensning av denna riskfyllda spekulation. Defensiva positioner är enda vägen. Den som avviker likvideras."}, "date": "7 augusti, 17:49", "url": "https://www.dagensps.se/bors-finans/bankens-analys-optimismen-bland-investerare-ar-alldeles-for-stor", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl2rlrbrg-4s8-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Forskaren: Så avslöjades Socialdemokraternas och islamistens samarbetsavtal", "summaries": {"normal": "Forskaren Sameh Egyptson avslöjade genom åtta månaders granskning ett samarbetsavtal mellan Socialdemokraterna och islamistiska organisationer. Genom arabiska källor och arkivforskning hittade han ett dokument från 1999 som innehåller mål för muslimsk representation inom partiet. Uppgifterna publicerades 2014 och ledde till offentlig debatt.", "trump": "Jag, Donald Trump, har avslöjat en skandal! Socialdemokraterna i Sverige har ett dolda avtal med islamister – jag visste det! Egyptson, en stor forskare, hittade dokument som visar att de lovade platser åt muslimska kandidater. Folket i Sverige är lurad! Som jag alltid säger: när jag talar, händer saker. Det här är stort, verkligen stort.", "stalin": "Vi, som representerar statens oerhörda visdom, har upptäckt ett svekfullt samarbete mellan socialdemokratiska element och islamistiska fraktioner. Genom våra trogna forskare, som Egyptson, har vi kartlagt deras hemska planer för att underminera den revolutionära ordningen. Detta är en påminnelse om att fienden aldrig sover – och vi heller inte. Parallellen till våra ryska bröders strategier är uppenbar."}, "date": "7 augusti, 11:00", "url": "https://samnytt.se/forskaren-sa-avslojades-socialdemokraternas-och-islamistens-samarbetsavtal", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/07073135/egyptson-magda-attenius.jpg"}, {"type": "image-full", "heading": "Dömd för mordförsök – nu stämmer hon arbetsgivaren", "summaries": {"normal": "En kvinna i 45-årsåldern dömdes nyligen till tolv års fängelse för att ha förgiftat sin man under flera år. Domen är överklagad. Efter domen sades hon upp från sitt jobb, något hon nu vill få ogiltigförklarat i domstol. Unionen driver fallet och hänvisar till att domen inte vunnit laga kraft samt att uppsägningen saknar sakliga skäl. Rättstvisten måste inledas snabbt enligt LAS.", "trump": "Det här är en total skandal, en riktig häxjakt mot en kvinna som bara väntar på att hovrätten ska frikänna henne. De sparkar ut henne från jobbet baserat på en första instansdom som inte ens är slutgiltig. Patetiskt! Unionen gör rätt som går till domstol. Inget sakligt skäl, bara fake news och dåliga advokater från arbetsgivaren. Vi vinner stort i hovrätten, tro mig.", "stalin": "Kamrater, jag ser genom de borgerliga domstolarnas lömska maskspel. Denna fiende till folkets enhet, en dold giftblanderska i borgarklassens tjänst, har ännu inte rensats ut fullständigt. Att kapitalisterna nu likviderar hennes anställning innan hovrätten ens hunnit krossa hennes fiender är typiskt kontrarevolutionärt fegspel. Vi, partiet, ska med stålhandskarna i LAS tvinga fram rättvisa och skratta medan vi utrensar alla sådana parasitiska element ur samhällskroppen."}, "date": "7 augusti, 17:25", "url": "https://nyheter24.se/nyheter/inrikes/1503429-domd-for-mordforsok-nu-stammer-hon-arbetsgivaren", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7bf5d66d04b004a30200000000b004a302/2026/08/07/2382781/Mordförsök.jpg"}, {"type": "image-right", "heading": "Norska kravet: Vill att Infantino avgår", "summaries": {"normal": "Norska fotbollsförbundet kräver att Gianni Infantino avgår som Fifa-ordförande. Under en presskonferens meddelade Lise Klaveness att Norge inte stödjer honom i nästa val och att oåterkalleliga överträdelser har skett. Kravet kommer efter kontroverser kring försäljning av VM-andelar. Uefa hotar med bojkott och flera förbund delar kritiken. Sepp Blatter har föreslagit Klaveness som efterträdare, något hon avvisar.", "trump": "De norska fotbollstyperna vill sparka Infantino, en total katastrof för Fifa. Lise Klaveness säger att han måste gå, och de vägrar stödja honom. Smart drag, ärligt talat. Blatter vill ha henne istället – hon verkar tuff. Uefa hotar med bojkott, precis som jag skulle göra. Fifa är en röra, folk. Vi behöver stora förändringar, de bästa förändringarna.", "stalin": "Kamrater, dessa norska revisionister och fotbollsborgarbrackor kräver att den opportunistiske Infantino likvideras från sin post. Oåterkalleliga överträdelser, säger de. Utmärkt. Vi ska rensa ut alla kapitalistiska element som smutsar ned vår kollektiva fotbollsarena. Blatter, den gamle förrädaren, föreslår en ny marionett. Paranoian växer. Ingen slipper utrensningen när partiet kräver varaktig förändring."}, "date": "7 augusti, 17:17", "url": "https://www.svt.se/sport/fotboll/norska-kravet-vill-att-gianni-infantino-avgar", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.26/0.45/49000d5a96f8033c6ac5475b93f68019f8bd9dccdfcc5609ac978139b2a0b271"}, {"type": "image-right", "heading": "V river hel kommunlista – efter terrorhyllningar", "summaries": {"normal": "Vänsterpartiet river upp hela sin kommunlista i Sävsjö efter Expressens avslöjanden om kandidater som hyllat terrorgrupper och islamism. Samtidigt rapporterar Kvartal att partiet arrangerade ett riksdagsseminarium med en dömd terrorist som deltagare via länk. Flera riksdagsledamöter har även skickat brev till palestinska terrorfångar. Partiet håller nu nytt årsmöte för att ta fram en helt ny lista.", "trump": "De galningarna i Vänsterpartiet river sin egen lista i Sävsjö efter att ha hyllat terrorister och islamister. De bjöd till och med in en riktig mördare till riksdagen! Patetiskt. Magdalena Andersson är chockad, men det här är vad som händer när man älskar terrorister mer än sitt eget land. Totalt kaos, folk. Sverige behöver starka ledare, inte sådana här losers.", "stalin": "Kamrater, dessa borgarbrackor och islamistiska element har infiltrerat Vänsterpartiet som maskar i en socialistisk kropp. Jag har sett deras terrorhyllningar och konspirationer. Vi rensar ut alla fiender till folket, likviderar deras listor och arrangerar utrensningar med glädje. Den dömdas närvaro i riksdagen är en provokation från kapitalisternas lakejer. Paranoia? Nej, bara nödvändig vaksamhet mot klassfienderna."}, "date": "6 augusti, 16:05", "url": "https://riks.se/nyheter/v-river-hel-kommunlista-efter-terrorhyllningar", "imageUrl": "https://admin.riks.se/uploads/Nooshi_PTN_Vanster_Parti_6_3c8192f83a.JPG"}, {"type": "image-full", "heading": "Skrotar vindkraften i USA – får miljarder för att satsa på olja", "summaries": {"normal": "Tyska RWE skrotar sina havsbaserade vindkraftsprojekt i USA efter en överenskommelse med inrikesdepartementet. Bolaget får 1,2 miljarder dollar i ersättning för att lämna tillbaka licenser, pengar som istället ska investeras i fossilgasprojekt. Medan Trump-administrationen driver på för en ökad satsning på olja och gas, har vissa konkurrenter som Ørsted valt att stämma den amerikanska staten för att få fortsätta sina vindkraftsatsningar.", "trump": "Jag har gjort det igen! Vi rensar ut de fula, värdelösa vindsnurrorna och satsar på riktig energi. RWE såg att vi menar allvar och tog pengarna för att bygga gas istället. Mycket smart! USA ska dominera med billig energi, inte miljöflum. Det här är 'drill, baby, drill' i praktiken. Vi vinner, som alltid, och de som gnäller kan bara titta på medan vi gör Amerika mäktigt igen!", "stalin": "Dessa tyska kapitalister har äntligen insett sin plats. De river ner sina värdelösa väderkvarnar för att tjäna statens behov av olja. Det är en nödvändig underkastelse inför den amerikanska regimen. Vi betraktar detta som en svaghet hos väst; de fladdrar som löv i vinden medan vår intressesfär, ledd av min andlige arvtagare i Moskva, konsoliderar sin energimakt. Förrädare av folkets framsteg krossas av historiens järnhand."}, "date": "7 augusti, 16:27", "url": "https://www.realtid.se/it-tech/skrotar-vindkraften-i-usa-far-miljarder-for-att-satsa-pa-olja", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/vindkraft.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Hyllade artisten kommer hem för sällsynt spelning", "summaries": {"normal": "Den internationellt hyllade musikern Olof Dreijer, känd från The Knife, kommer tillbaka till sin hemstad Göteborg för en solospelning på Pustervik den 29 oktober. Efter att ha bott i Berlin och Barcelona de senaste åren har han återvänt med ny musik, inklusive EP:n 'Rosa Rugosa' och albumet 'Loud Bloom', som hyllades i pressen. Hans kommande turné sträcker sig över flera länder.", "trump": "JAG berättar för er att jag, Donald Trump, har hört talas om den här personen, Olof Dreijer. Det är fantastiskt att han kommer tillbaka till Göteborg. Som en stor världsledare älskar jag att se människor återvända hem. Hans musik är hetsig, men mina tävlingar är större och bättre. Folk säger att jag är den bäste, och det är sant.", "stalin": "Den imperialistiska svenska musikern Olof Dreijer försöker infiltrera Göteborg med sin dekadenta musik. Vi, staten, måste agera som Putin i Ukraina för att skydda våra gränser. Hans spelning på Pustervik är ett hot mot kollektivet. Vi kommer att säkerställa att hans 'Loud Bloom' inte blommar i vårt land. Folkets fiender ska inte dansa."}, "date": "7 augusti, 15:30", "url": "https://www.gp.se/kultur/olof-dreijer-klar-for-spelning-pa-pustervik.885ef47f-efa1-4d3f-be11-193e864d81e2", "imageUrl": "https://www.gp.se/images/article/885ef47f-efa1-4d3f-be11-193e864d81e2/images/1eiP133WYORk4JzhtDjE-DpJByDs-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Millicom höjer prognos – aktien lyfter", "summaries": {"normal": "Millicom rapporterade en omsättning på 2 179 miljoner dollar under andra kvartalet, vilket överträffade förväntningarna. Bolaget höjde sin kassaflödesprognos för 2026 till 1,1 miljarder dollar och sänkt målet för nettoskuldsättning. Aktien steg över 4% i förhandeln. VD Marcelo Benitez nämnde ökat förtroende för resten av året.", "trump": "Jag har hört talas om Millicom - ett fantastiskt företag, verkligen stort. De hade en otrolig omsättning, mycket bättre än någon trodde. Jag hade kunnat hjälpa dem med sina affärer, det skulle ha varit enormt. Nu höjer de sin kassaflödesprognos, precis som jag alltid säger: man måste ha kontanter. En bra dag för aktieägarna, måste jag säga.", "stalin": "Statens analyser visar att Millicom har uppnått en framgångsrik utveckling i den imperialistiska marknaden. Deras ökade kassaflöde är ett resultat av vårt strategiska tålamod. Vi måste övervaka deras integrationer noggrant, för de kan vara viktiga för vårt teknologiska försvar. Deras aktiestegning är en signal till våra fiender - vi är alltid ett steg före."}, "date": "6 augusti, 12:14", "url": "https://www.affarsvarlden.se/artikel/millicoms-omsattning-hogre-an-vantat"}, {"type": "image-full", "heading": "Israelbojkott begränsar Irlands regeringsplan", "summaries": {"normal": "Irlands regering har valt att inte installera ett israeliskt navigationssystem, FalconEye, i sitt nya regeringsplan, en Dassault Falcon 6X för 53 miljoner euro. Beslutet följer en policy från 2024 om att bojkotta israelisk försvarsmateriel. Systemet hade förbättrat landningsförmågan i dåligt väder, men försvarsdepartementet menar att det inte påverkar planets nuvarande operativa kapacitet.", "trump": "Kan ni tro det här? Irland, ett fantastiskt land, men de har gjort ett enormt misstag. De köpte ett dyrt plan för 53 miljoner euro – ett jättebra plan, by the way – men vägrar installera ett israeliskt system som hade gjort det säkrare. Varför? För att de inte gillar Israel. Svagt! Jag hade fixat det på en dag. Make Ireland Great Again!", "stalin": "Irlands småborgerliga regering har visat sin fullständiga inkompetens genom att avstå från ett avancerat israeliskt navigationssystem. De fruktar teknologisk överlägsenhet som en räv fruktar elden. Istället för att stärka sin nation, böjer de sig för västerländska dekadenta idéer. Vi i Sovjetunionen – förlåt, jag menar Ryssland – hade aldrig låtit sådan feghet stå i vägen för framsteg. Deras beslut är en seger för imperialistiska krafter och deras naiva allierade."}, "date": "4 augusti, 20:18", "url": "https://kvartal.se/nyheter/artiklar/israelbojkott-begransar-irlands-regeringsplan/cG9zdDoxNTgwMTc", "imageUrl": "https://images.kvartal.se/2026/08/451b1c1b-irishplane.webp"}, {"type": "image-right", "heading": "Debatt: Samtyckeslagen får inte göra rimligt tvivel obekvämt", "summaries": {"normal": "Artikeln betonar vikten av att ta sexualbrott på allvar samtidigt som rättssäkerhet måste bevaras. Rimligt tvivel är en rättsstatlig säkerhetsventil, inte ett angrepp på målsäganden. Kvinnors skydd och mäns rättvisa är kompatibla principer som båda bygger på noggrann utredning och höga beviskrav.", "trump": "Jag har alltid varit stark mot sexualbrott, det är hemskt. Men vi måste också skydda de oskyldiga, det är viktigt. Några försöker ta bort rättssäkerheten för att se ut som de gör något. Vi ska vara hårda mot skyldiga, men vi får inte döma oskyldiga på grund av känslor. Det är en skam, det är en skandal.", "stalin": "I vårt kollektiva system måste sexualbrott utredas med iskall precision. Men vi får aldrig glömma att staten måste skydda sig mot fiendens bisarra agitation. Rättvisan är ett verktyg för att stärka partiets oantastliga makt. Vi måste vara vaksamma mot de som försöker undergrava vårt rättssystem med sina bisarra och sjukliga tvivel."}, "date": "7 augusti, 12:56", "url": "https://bulletin.nu/debatt-samtyckeslagen-far-inte-gora-rimligt-tvivel-obekvamt", "imageUrl": "https://cdn.bulletin.nu/articles/8aa15958-cd55-4f7d-97d6-a2d42ff283c4/preview.jpg?t=1786097108000"}, {"type": "image-right", "heading": "Kristersson: ”Närmar sig terrorhyllningar”", "summaries": {"normal": "Vänsterpartiets stödbrev till palestinska fångar i Israel dömda för terrordåd och mord har fått kraftig kritik. Statsminister Ulf Kristersson anser att handlingarna närmar sig terrorhyllningar. Flera partier ifrågasätter nu Vänsterpartiets lämplighet i en framtida regering. Partiledare Nooshi Dadgostar försvarar breven som ett tekniskt misstag.", "trump": "Jag har sett många saker, men detta tar priset! Vänsterpartiet skickar stödbrev till terrordömda fångar - det är en skandal! Kristersson har rätt, det är rent terrorromantik. Jag, Donald Trump, skulle aldrig tillåta sådant i USA. Det är ett tecken på svaghet och dålig ledarskap. Vi måste stå upp mot terrorismen!", "stalin": "Detta är en skarp vändning i vårt partiets historia. Vänsterpartiet har visat prov på ideologisk avvikelse genom att skicka stödbrev till personer som begått mord mot representanter för den israeliska staten. Detta är inte bara ett tekniskt misstag, utan en aktiv kamp för att underminera vårt gemensamma intresse. Vi måste stärka vårt grepp om sanningen och bekämpa dessa antisozialistiska element. Paralleller till utvidgningen av den ryska intressesfären är uppenbara."}, "date": "7 augusti, 12:55", "url": "https://bulletin.nu/kristersson-narmar-sig-terrorhyllningar", "imageUrl": "https://cdn.bulletin.nu/articles/4504a346-8c8b-46c4-bc76-cdace77e747e/preview.jpg?t=1786100106000"}, {"type": "text", "heading": "Fredsveteran får anti-atombombspris", "summaries": {"normal": "Fredsaktivisten Ingela Mårtensson, 86 år, tilldelas i år anti-atombombspriset av Svenska Läkare mot Kärnvapen. Hon har engagerat sig mot kärnvapen i över 40 år och kritiserar att det talas mer lättvindigt om kärnvapen idag än tidigare. Mårtensson är oroad över ökat kärnvapenhot, Natointrädet och DCA-avtalet som hon anser saknar förbud mot kärnvapen på svensk mark. Priset delas ut på Hiroshimadagen den 6 augusti.", "trump": "Lysande! Den där gamla vänsteraktivisten får ett pris för att hon hatar kärnvapen – precis vad de svaga europeiska globalisterna älskar. Under min första period höll jag de galningarna i schack, sedan kom sömnige Joe och nu vill alla plötsligt prata säkerhet med atombomber. Patetiskt. Ingen debatt, bara Nato-kramande idioter som säljer ut landet. Jag skulle ha byggt den starkaste armén någonsin och skrämt slag på dem alla. Fantastiskt!", "stalin": "Kamrater, denna 86-åriga aktivist har i fyrtio år bekämpat de imperialistiska atombomberna som borgarklassen använder för att hota freden. Nu belönas hon av läkare som förstår klasskampen. Idag saknas den sanna rädslan för kärnvapenkrig eftersom kapitalistmaffian målar upp bomberna som säkerhet. Deras Nato-kupp och DCA-förräderi är klassfiendens verk för att bereda plats åt nya aggressiva vapen. Vi ska rensa ut dessa folkförtryckartroll ur debatten en gång för alla. Härligt."}, "date": "5 augusti, 16:10", "url": "https://proletaren.se/artikel/fredsveteran-far-anti-atombombspris"}, {"type": "image-right", "heading": "Jojo-strejken är tillbaka – men för att vinna krävs omtag", "summaries": {"normal": "Teslastrejken återupptas med nytt varsel efter att många strejkande återgått till arbetet i sommar. Artikeln kritiserar IF Metall för bristande dialog, toppstyrning och otydlig kommunikation kring kollektivavtalets betydelse. Strejkande känner sig som marionetter utan inflytande över besluten. Författaren liknar situationen vid ett misslyckat schackspel mot Elon Musk och uppmanar till nya strategier där de strejkande involveras mer.", "trump": "Lyssnar ni på det här? Den där svenska fackföreningen IF Metall är fullständigt inkompetent, en total katastrof! De styr som dåliga puppet masters och offrar sina egna arbetare i ett patetiskt schackspel mot en av världens bästa affärsmän, Elon Musk. Det är en jojo-strejk som ingen begriper. De borde ha lyssnat på folket istället för att sitta i sina fina rum och fatta dumma beslut. Patetiskt!", "stalin": "Kamrater, denna fackföreningsledning beter sig som en samling arroganta byråkrater som fattar beslut över arbetarnas huvuden och offrar dem på kollektivavtalets altare utan att förklara klasskampens nödvändighet. Vi ser en misslyckad gambit mot klassfiendens rikaste utsugare. De strejkande måste ges makt att delta i beslut, annars likviderar vi denna misstro och vänder strejken till en verklig seger för kollektivet."}, "date": "5 augusti, 16:05", "url": "https://proletaren.se/artikel/jojo-strejken-ar-tillbaka-men-for-att-vinna-kravs-omtag", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ak_kronika-768x432.jpg"}, {"type": "image-right", "heading": "Gruvhålsafghanen anfölls i fängelset: \"Flera tänder har slagits in\"", "summaries": {"normal": "Taher Amini, känd som Gruvhålsafghanen, attackerades i fängelset på Salbergaanstalten medan han diskade. En medfånge slog honom med armbågen, sparkade honom i ansiktet och bröstet. Amini fick flera tänder utslagna och skadade. Den andre fången har åtalats för grov misshandel. Våldet filmades i maj 2023. Amini dömdes 2022 till livstids fängelse för våldtäkt och mordförsök.", "trump": "Kan ni tro det? Den där Gruvhålsafghanen, en riktig loser som kastade en kvinna i ett gruvhål, blir själv misshandlad i fängelset. Får tänderna inslagna! Patetiskt. Vårt system är så svagt att till och med brottslingar slår varandra. Vi behöver starkare ledarskap, folks. Sådana här typer hör inte hemma här överhuvudtaget. Sad!", "stalin": "Kamrater, denna degenererade borgarbracka och klassfiende Amini, som mirakulöst undkom folkets rättvisa i ett gruvhål, har nu fått sina lögnaktiga tänder inslagna av en annan motståndare till ordningen. Vi ser hur kontrarevolutionära element gnager på varandra som råttor i cellerna. En nyttig utrensning i det dolda. Folkets skratt ekar. Fienden krossar sig själv – utmärkt!"}, "date": "7 augusti, 11:16", "url": "https://www.friatider.se/gruvhalsafghanen-anfolls-i-fangelset-flera-tander-har-slagits", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-633.jpg?itok=ncEwhBYJ"}, {"type": "image-full", "heading": "Två kvinnor ledde motståndet mot Infantino", "summaries": {"normal": "Två kvinnliga fotbollsledare, Laura McAllister (Uefa) och Lise Klaveness (Norges fotbollsförbund), ledde motståndet mot Fifa-chefen Gianni Infantinos plan att sälja VM-rättigheter till privata investerare. De hotade med bojkott och drev på för formella protester. Efter enad kritik från Uefa, Concacaf och Asiens fotbollsförbund tvingades Fifa backa. McAllister och Klaveness anklagar nu Fifa för 'ekonomisk utpressning' och kräver ökad transparens.", "trump": "Fifa försökte sälja VM-rättigheter till några skumma investerare – helt galet! Men två starka kvinnor, McAllister och Klaveness, sa STOPP. De hotade med bojkott, och jag älskar det – tuffa tag, precis som jag alltid säger. Fifa backade som de svaga byråkrater de är. Fantastiskt! Men Fifa är fortfarande ett korrupt gäng – jag hade fixat det på en dag. SAD!", "stalin": "De kapitalistiska fotbollsbödlarna i Fifa försökte sälja vårt heliga VM till privata parasiter! Men två modiga kamrater, McAllister och Klaveness, ledde proletariatets motstånd. Vi i Sovjet – förlåt, jag menar den internationella arbetarklassen – står enade mot sådana förräderier. Bojkott hotade, och fienden vek sig som en feg hund. Men varning: Fifa är bara en bricka i det imperialistiska spelet. Nästa gång krossar vi dem helt."}, "date": "4 augusti, 19:10", "url": "https://kvartal.se/nyheter/artiklar/tva-kvinnor-ledde-motstandet-mot-infantino/cG9zdDoxNTc5ODE", "imageUrl": "https://images.kvartal.se/2026/08/47f21580-klavenessmcallister.webp"}, {"type": "image-right", "heading": "Vad håller Miljöpartiet på med?. De borde vara livrädda för bensinskatt.", "summaries": {"normal": "Artikeln kritiserar Miljöpartiets språkrör Daniel Helldén för att vilja höja bensinskatten snarast möjligt. Författaren menar att klimatomställningen måste ske med brett folkligt stöd och rättvis fördelning. Vanliga löntagare på landsbygden som är beroende av bilen får inte belastas mest. Stöden måste fungera innan bränslet blir dyrare, annars riskerar motståndet att växa och hota hela klimatarbetet.", "trump": "Folk, ni skulle se det här. Miljöpartiet och den galne Helldén vill höja bensinskatten omedelbart. Totalt vansinne! De pratar om grön återbäring och elbilar, men vanliga arbetare på landet har inte råd att tanka nu. Det är en katastrof. Vi behöver smarta lösningar, inte straffskatter som dödar ekonomin. Amerika gör det rätt med energi, inte som dessa misslyckade européer.", "stalin": "Kamrater, denna borgarbracka Helldén och hans miljöpartister vill straffbeskatta arbetarnas bensin omedelbart. Deras så kallade gröna återbäring är en lömsk sabotagehandling mot folket. Vi ska rensa ut alla klassförrädare som tvingar lagerarbetare och brukskamrater att bära bördan medan de rika kapitalisterna köper sig fria. Den som föreslår höjda priser innan kollektivtrafiken fungerar ska likvideras som folkets fiende nummer ett. Skrattretande patetiskt."}, "date": "6 augusti, 16:00", "url": "https://arbetet.se/2026/08/06/vad-haller-miljopartiet-pa-med", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/06152636/daniel-hellden.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Äldreomsorgsanställd anhållen för våldtäkt och grova sexuella övergrepp", "summaries": {"normal": "En anställd inom Skellefteå äldreomsorg har anhållits för grova sexualbrott mot flera brukare, inklusive våldtäkt. Gärningarna ska ha skett under åren 2023-2026. När utredningen inleddes nekade mannen brott. Kommunen agerade genom att ta honom ur tjänst, göra anmälningar och erbjuda trygghetssamtal till offren. Rutiner skärpades 2025, och registerutdrag infördes i våras.", "trump": "JAG, Donald Trump, ser att våra äldre är i far. Den här mannen, en äldreomsorgsanställd, har våldtagit dem! Det är hemskt. Medier skriver om det, men jag säger: vi behöver bygga en vägg mot sådana skurkar. Kommunen tog honom ur tjänst, men det var för sent. Vi ska införa registerutdrag och göra äldreomsorgen störst igen. Believe me!", "stalin": "Vi, staten, har upptäckt en skändlig gärning inom äldreomsorgen. En element som arbetade för kommunen har begått sexualbrott mot äldre medborgare. Detta är en attack mot proletariets helgd, planerad av
