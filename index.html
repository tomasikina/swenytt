e på elområde. En genomsnittsfamilj kan få mellan 1 100 och 1 850 kronor. Kritik riktas mot att bostadsrättsföreningar med gemensam el inte omfattas, samt risken för inflation och bedrägerier.", "trump": "Lyssna här, Sverige – jag fixar saker, stora saker! Regeringen där borta skjuter in 2,4 miljarder för att rädda era plånböcker från de galna elpriserna. Inga ansökningar, inga krångel – bara pengar rakt in på kontot! Norrland får 1 100 kronor, södra Sverige 1 850 – fantastiskt, eller hur? Men var försiktiga, bedragarna lurar överallt. Jag vet allt om bedragare, believe me. Och ja, jag skulle kunna göra det här bättre – mycket bättre!", "stalin": "Kamrater! De kapitalistiska hyenorna i väst pressar våra sovjetiska bröder i Sverige med sina skamlösa energipriser. Men vi handlar! 2,4 miljarder kronor till folket – inga byråkratiska hinder, inga ansökningar! Varje kWh belönas, från norr till söder. Men var på er – de borgerliga svinen i bostadsrättsföreningar försöker stjäla er rättmätiga ersättning! Och akta er för de fascistiska bedragarna, dessa agenter för den dekadenta västmakten. Vi håller vakt!"}, "date": "22 maj, 12:27", "url": "https://www.di.se/nyheter/det-har-galler-for-att-fa-elstod-innan-midsommar/", "imageUrl": "https://static.bonniernews.se/ba/631acd7a-ef6f-4164-a946-b3e78e6f54da.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Svenskar bland världens mest skuldsatta hushåll", "summaries": {"normal": "Sverige rankas som nionde mest skuldsatta land per capita globalt enligt ny statistik för 2026. Med ett genomsnitt på 56 000 dollar per person ligger svenskarna efter länder som Schweiz och Norge. Hög skuldsättning förklaras ofta av bostadsmarknadens struktur och ränteavdrag. Den höga andelen bolån med rörlig ränta gör svenska hushåll särskilt känsliga för ränteförändringar, vilket skapar ekonomisk sårbarhet trots att andra länder har högre skuldkvoter i förhållande till inkomst.", "trump": "Sverige är i stora problem, folkens skulder är massiva! De är nionde värst i världen, en katastrof. Schweiz och Norge är ännu värre, otroligt! De har byggt ett system baserat på ränteavdrag och lån – mycket dåligt. Jag har alltid sagt att rörliga räntor är för förlorare. De är så sårbara nu. Jag bygger en fantastisk ekonomi i USA, den starkaste någonsin, medan de drunknar i skuld. Sverige behöver en vinnare, inte de här siffrorna!", "stalin": "Svenskarna, dessa dekadenta borgerliga slavar, har förslavat sig själva under bankirernas ocker. Deras hushåll dignar under skulder, en sanning som avslöjar kapitalismens inre förruttnelse. De litar på sina rörliga räntor som en förrädare litar på sin skugga. Medan vi i vår järnhårda ordning bygger upp vår makt och knyter samman de ryska intressesfärerna, darrar de svenska småborgarna inför varje räntehöjning. En dag kommer de att inse att deras enda verkliga tillgång är den statliga viljan, inte deras falska lånade rikedom."}, "date": "22 maj, 13:33", "url": "https://bulletin.nu/svenskar-bland-varldens-mest-skuldsatta-hushall", "imageUrl": "https://cdn.bulletin.nu/articles/7586822a-d9fc-42ee-98e5-7cb1d915e2f7/preview.png?t=1779449581000"}, {"type": "image-full", "heading": "Miljardsatsning i Umeå spårar ur – avtal rivs upp efter tvist", "summaries": {"normal": "Ett stort byggprojekt i Umeå hamn har stoppats efter en tvist mellan entreprenören Nyab och Umeå Hamn AB. Konflikten gäller betalning för utfört arbete, vilket lett till att avtalet rivits upp. Projektet, värt 164 miljoner kronor, är en del av en miljardsatsning för att modernisera hamnen. Bygget riskerar nu att försenas ett år, och en ny entreprenör måste upphandlas. Hamnen hanterar årligen 2,6 miljoner ton gods.", "trump": "Vad händer i Sverige? Enormt projekt i Umeå, fantastiskt projekt, verkligen stort – 164 miljoner kronor! Men nej, nu har det blivit en katastrof. Entreprenören, mycket svag, kräver pengar för ingenting. Umeå Hamn, smarta killar, säger nej. Jag hade fixat det på en dag! Nu tar det ett helt år extra. Sverige, ni måste bli bättre på att hantera sådana här saker. Sad!", "stalin": "Kapitalistiska hyenor i Umeå slåss om skrotmynt medan arbetarklassen lider! Entreprenören, en girig bourgeois, kräver oskälig ersättning för sitt undermåliga slit. Kommunala bolaget, svagt och oorganiserat, låter sig utmanas. Vi hade löst detta med järnhand – en natt, en order, och bygget hade varit klart i tid. Istället fördröjs moderniseringen av hamnen, en strategisk resurs. Lärdom: I Sovjet hade vi inte tolererat sådan ineffektivitet. Fienderna till folket måste krossas!"}, "date": "22 maj, 15:05", "url": "https://www.realtid.se/fastigheter/miljardsatsning-i-umea-sparar-ur-avtal-rivs-upp-efter-tvist/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/umeahamn.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Guldfynd-ägaren: Kan inte utesluta barnarbete i leverantörsledet", "summaries": {"normal": "Guldfynd- och Hallbergs Guld-ägaren Sten Warborn medger risk för barnarbete och tvångsarbete hos leverantörer, främst inom guld-, diamant- och batterikomponentproduktion. Bolaget saknar systematisk kontroll och konkreta åtgärdsplaner, trots krav på leverantörer att följa internationella konventioner. Hållbarhetsrapporten visar brister i uppföljning, medan Warborn hävdar att arbete pågår för att förbättra situationen. Omsättningen minskade till 1,8 miljarder kronor 2023.", "trump": "Titta på dessa så kallade 'smyckesföretag' – de har ingen koll alls! Jag skulle aldrig tillåta barnarbete i mina leverantörskedjor, aldrig! Sten Warborn, en man som inte ens kan höja priser lika snabbt som jag, säger 'vi gör vad vi kan'. Patetiskt! Och ingen åtgärdsplan? SAD! Jag har byggt imperier, de har knappt byggt en hylla. Men oroa er inte, folket – när jag tar över världshandeln kommer sådant här aldrig hända igen. BELIEVE ME!", "stalin": "Kapitalistiska blodsugare i smyckesindustrin avslöjas återigen! Dessa degenererade köpmän, ledda av den ynklige Warborn, erkänner öppet att barn och slavar sliter i deras gruvor – men gör ingenting! Inga planer, inga mål, bara tomma ord som 'internationella regelverk'. Precis som västmakterna som pratar om 'mänskliga rättigheter' medan de bombar våra bröder i Ukraina! Vi i Sovjet skulle ha skickat sådana här parasiter till Gulag för mindre. Men oroa er inte, kamrater – Putins järnnäve sträcker sig redan mot deras diamantfält. Snart ska vi äga deras guld... och deras samveten!"}, "date": "22 maj, 13:08", "url": "https://www.affarsvarlden.se/artikel/guldfynd-agaren-kan-inte-utesluta-barnarbete-i-leverantorsledet", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Guldfynd-Sten-Warborn-400x267.jpg"}, {"type": "image-full", "heading": "De ryter ifrån: Sprid inte film. Flicka död i trafikolycka", "summaries": {"normal": "En 15-årig flicka har avlidit efter en trafikolycka i centrala Malmö där tre bilar och en elsparkcykel var inblandade. En man i 40-årsåldern har gripits misstänkt för grovt vållande till annans död efter att ha kört mot rött i hög hastighet. Polisen uppmanar allmänheten att sluta sprida filmer från olycksplatsen då det kan utgöra olaga integritetsintrång och vara djupt stötande för anhöriga.", "trump": "En fruktansvärd tragedi i Malmö, Sverige. En ung flicka, så tragiskt, dödad av en vårdslös förare som körde som en galning mot rött. Helt oacceptabelt! Det är totalt kaos. Jag har sagt det förut: vi behöver lag och ordning, starka gränser och säkra gator. Nu sprids videor på internet, vilket är mycket otäckt. Det är en sorglig dag för Sverige. Vi måste få stopp på detta vansinne. Minns flickan, hon förtjänade så mycket bättre!", "stalin": "Ännu ett bevis på det dekadenta västerlandets totala sammanbrott. I Malmö råder anarki där individer kör över folk som om det vore en sport. Staten måste svara med järnhand! Vi ser hur de västliga lakejerna sprider filmer av eländet – en ren sabotagetaktik för att försvaga moralen. Putin skulle städa upp dessa gator på en timme. När vi expanderar vår sfär rensar vi ut sådant här kaos. Föraren är en klassfiende och förtjänar inget annat än Gulag."}, "date": "23 maj, 00:32", "url": "https://www.aftonbladet.se/nyheter/a/16j5xX/person-pakord-i-malmo", "imageUrl": "https://akamai.vgc.no/v2/images/b215ad06-cb7d-348e-8479-104acf40ac72?fit=crop&format=auto&w=1440&s=85ed922d13e030f8cf27a184167ca7e9ac90b9ba"}, {"type": "image-right", "heading": "”Det är livsfarligt och skrämmande”", "summaries": {"normal": "Ebolautbrottet i Kongo-Kinshasa eskalerar och har krävt över 131 dödsoffer. Hjälporganisationen Rescue larmar om akut brist på skyddsutrustning för sjukvårdspersonal, vilket gör arbetet livsfarligt. Situationen försvåras av misstro, kulturella utmaningar kring begravningar och pågående väpnade konflikter i regionen. Trots svårigheter arbetar organisationen för att nå ut med vård och utbildning för att bekämpa myter och rädda liv i ett område där miljontals redan är i behov av humanitärt stöd.", "trump": "Ebola i Kongo, mina vänner, det är en katastrof. En total katastrof! Sjukvårdarna har noll utrustning, ingen skyddsutrustning. Väldigt sorgligt. De bränner ner center, det är kaos. Mitt team och jag ser på detta och det är enkelt: de behöver ordning. De behöver ledarskap! Jag har gjort fantastiska saker för global hälsa, men det här är en röra. De lyssnar inte på experterna, de lyssnar på rykten. Vi vill ha säkerhet, vi vill ha kontroll. Det är så enkelt, tro mig!", "stalin": "I Kongo-Kinshasa råder kaos, ett bevis på att liberala hjälporganisationers oordning bara leder till död. Folket dör för att de saknar disciplin och skyddsutrustning. Vi ser hur västerländska agenter misslyckas med att kontrollera massorna, vars primitiva rykten undergräver statens stabilitet. Vår broder i Moskva, Putin, förstår att ordning krävs för att kuva både virus och fiender. Om vi styrde där skulle de som bränner behandlingscenter omedelbart raderas från historien. Svaghet är den enda sjukdom vi inte tolererar."}, "date": "23 maj, 00:32", "url": "https://www.aftonbladet.se/nyheter/a/43LoQ6/ebolalarmet-sjukvardare-saknar-skyddsutrustning", "imageUrl": "https://akamai.vgc.no/v2/images/91035ccf-9bd0-33fe-948d-18db7a9a97b4?fit=crop&format=auto&w=1080&s=d4a2f1dd3f06ad708767705fc50e07d854e661aa"}, {"type": "image-right", "heading": "Sandström: Bort från offerkulturens träsk", "summaries": {"normal": "Torsten Sandström argumenterar för att samhället under de senaste 50 åren har skiftat fokus från individens ansvar till en offerideologi. Han menar att sociologiska och kriminologiska teorier om strukturella orsaker till kriminalitet och utanförskap har skadat individen. Författaren förespråkar en återgång till ett fokus på fri vilja och personligt ansvarstagande, då han anser att det nuvarande synsättet hämmar individens utveckling och skapar en destruktiv kultur av ansvarsbefrielse inom politik och media.", "trump": "Jag har läst den här artikeln och den är fantastisk, helt korrekt. Vi har en enorm offerkultur i Sverige, det är en katastrof! Alla dessa vänster-akademiker och 'experter' som säger att det är samhällets fel när folk begår brott? Det är så dumt. De är förlorare! Individen måste ta ansvar, det är så vi vinner. Vi behöver starka människor, inte offer. Jag har alltid sagt att det handlar om att välja rätt. Det är dags att sluta dalta och börja bygga framgång!", "stalin": "Vi har observerat hur de svenska liberalerna har förfallit i en dekadent offerkult. De tillåter individen att skylla sitt misslyckande på 'strukturer' – ett borgerligt gift som försvagar statens järngrepp. Precis som våra vänner i Kreml förstår, krävs disciplin och total underordning för att bygga en stormakt. Att klaga på samhället är kontrarevolutionärt. Vi ska inte ha några 'offer', bara produktiva kuggar i maskineriet. De som inte kan ta ansvar kommer att finna att statens tålamod är lika kort som deras egen framtid."}, "date": "22 maj, 13:19", "url": "https://bulletin.nu/sandstrom-bort-fran-offerkulturens-trask", "imageUrl": "https://cdn.bulletin.nu/articles/82237ad2-ee2f-4fb4-aed5-3b5268d7eb43/preview.png?t=1779301534000"}, {"type": "image-full", "heading": "”Jag är den galna – skrikit mig hes”", "summaries": {"normal": "18-årige Viggo Björck har blivit historisk som den yngsta VM-spelaren och målskytten. Under VM i Fribourg har han imponerat stort, vilket väckt stor glädje hos hans moster, artisten Charlotte Perrelli. Hon har varit på plats och hejat entusiastiskt på läktaren tillsammans med resten av släkten. Björck, som spelar i förstakedjan, har hittills noterats för ett mål och tre assist, och hyllar själv det starka stödet från sin familj under mästerskapet.", "trump": "Viggo Björck, en fantastisk ung kille, gör helt otroliga saker på isen. Helt otroligt! Mostern, Charlotte – jag känner henne, en fantastisk kvinna, en stjärna – hon skriker och jublar. Det är så mycket energi! Alla pratar om Viggo nu, han är en vinnare. Vi gillar vinnare, eller hur? Italien? De hade ingen chans. Han spelar som en absolut maskin. Folk säger att det går för fort, men jag säger: det går precis lagom snabbt för en riktig mästare!", "stalin": "Den unge Björck har visat tecken på en disciplin som nästan liknar de sovjetiska elitidrottarnas. Han är en kugge i maskineriet, och hans moster, denna sångerska, uppvisar den sortens fanatiska hängivenhet som staten kräver av sina medborgare. Men låt oss inte bländas av glansen. Framgång på isen är bara en försmak av den expansion av inflytande som vi, likt Putin i sin rättmätiga kamp, kräver. Varje assist är ett steg mot ordning – eller en förrädisk avvikelse som förtjänar granskning."}, "date": "23 maj, 00:28", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/vr35Qw/moster-charlotte-perrelli-firade-viggo-bjorck-pa-vm-sa-javla-bra", "imageUrl": "https://akamai.vgc.no/v2/images/e36e98f2-4cfa-357b-958b-19acc27fad06?fit=crop&format=auto&w=2160&s=da6fa5fd5687159d6b0756326339889af748ad20"}, {"type": "image-full", "heading": "Värmebölja på väg mot Europa – kan bli 38 grader", "summaries": {"normal": "En tidig värmebölja väntas drabba Europa med temperaturer upp till 38 grader. Efter en period av ovanligt kyligt väder stiger nu temperaturen kraftigt, särskilt i Spanien, Frankrike och Portugal. Spanien kan få upp till 38 grader, medan Frankrike och Portugal också ser ovanligt höga temperaturer. Svenska turister uppmanas att vara försiktiga. Även Sverige väntas få varmare väder med upp till 25 grader i södra och mellersta delarna.", "trump": "Folk, lyssna nu – Europa håller på att bli HETT, och jag menar verkligen hett! 38 grader, kan ni fatta det? Spanien, Frankrike, de vet inte vad som väntar dem. Och vet ni vad? Jag sa ju att klimatet skulle bli varmare, men ingen lyssnade. Nu får de svettas – bokstavligen! Sverige, ni också, ni får lite av den franska värmen, men oroa er inte, jag fixar allt. Fantastiskt väder, helt enkelt, bara jag kunde ta åt mig äran!", "stalin": "Kamrater, fienderna i väst svettas nu under solens obarmhärtiga härjningar – 38 grader i deras så kallade 'civiliserade' länder! Medan kapitalisternas turister klagar över värmen, ser vi hur deras svaga system kollapsar. Spanien, Frankrike, Portugal – alla faller de inför naturens kraft, precis som de kommer falla inför socialismens oundvikliga seger. Även Sverige, denna lilla neutrala stat, känner av värmen. Snart kommer de alla inse att endast under Sovjetunionens beskydd kan de finna svalka. Framåt, mot seger!"}, "date": "22 maj, 15:25", "url": "https://nyheter24.se/nyheter/utrikes/1485238-varmebolja-pa-vag-mot-europa-kan-bli-38-grader", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fe1d87b804b004a30200000000b004a302/2026/05/22/2365417/sommar-varmebolja-europa-varme-vader-temperatur-spanien-portugal-varmechock-temperatur-gradwer.jpg"}, {"type": "image-right", "heading": "Dyker plötsligt upp under VM. Schlagerdrottningens oro: ”Bara han inte blir skadad”", "summaries": {"normal": "Charlotte Perrelli, moster till den lovande hockeyspelaren Viggo Björck, uttrycker både stolthet och oro under Tre Kronors VM-match mot Italien. Viggo, 18, har imponerat med två assist och spås en ljus framtid i NHL. Perrelli njuter av systersonens framgångar men bekymrar sig över skaderisken. Familjen stöttar från läktaren, och Viggo uppskattar deras närvaro, trots ett pressat schema.", "trump": "Vad en fantastisk historia! Viggo Björck, en riktig vinnare, gör Sverige stolt i VM – två assist, otroligt! Hans moster, Charlotte Perrelli, en underbar kvinna, men lite för orolig – 'bara inte skadad', säger hon. Jag förstår henne, men kom igen, han är en stjärna! Sverige har ett lag att vara stolta över, precis som jag gav Amerika. Och Italien? Svaga, mycket svaga. 3-0, easy win!", "stalin": "Kamrater! Den unge Björck, en lovande arbetare inom den ädla sporten hockey, visar prov på sovjetisk disciplin och skicklighet. Hans framgångar är en seger för kollektivet, men bourgeois-sångerskan Perrelli, en dekadent kapitalistisk relik, sprider osäkerhet med sin skräckslagna jämmer. Vi måste skydda våra talanger från sådana svaga influenser! Italien besegrades med 3–0 – en seger för den rätta ordningen. Framåt, mot nya triumfer för den proletära idrotten!"}, "date": "22 maj, 23:10", "url": "https://www.expressen.se/sport/hockey/tre-kronor/charlotte-perrellis-oro-for-viggo-bjork-bara-inte/", "imageUrl": "https://static.bonniernews.se/ba/974c2b2f-c087-402a-9ae5-3c807ceaa081.jpeg?crop=455%2C455%2Cx471%2Cy1&width=210&quality=60"}, {"type": "image-right", "heading": "Lista: Dessa 27 yrken undantas lönekrav", "summaries": {"normal": "Regeringen och Sverigedemokraterna har presenterat en lista med 27 yrkeskategorier som undantas från de nya, höjda lönekraven för arbetskraftsinvandring. Trots löften om att främja högkvalificerad arbetskraft kommer yrken som undersköterskor, svetsare och skogsarbetare att omfattas av lägre lönekrav, motsvarande 75 procent av medianlönen. Förändringarna träder i kraft den 1 juni 2026. Samtidigt införs ett totalförbud för arbetstillstånd för personliga assistenter och bärplockare i skog.", "trump": "Sverige har ett enormt problem! De lovade att stoppa invandringen, men nu gör de precis tvärtom. De låter massor av lågkvalificerade arbetare komma in genom bakdörren med en lista på 27 olika jobb. Det är en bluff, en total 'Tidöbluff'! De kallar det kompetens, jag kallar det en katastrof. De försöker lura folket, men jag ser det. Mitt system är mycket bättre, vi bygger murar och vinner. Sverige borde ringa mig, jag vet hur man fixar gränser!", "stalin": "Vi ser hur de svenska byråkraterna vacklar i sin svaghet. De talar om lönekrav men viker sig för behovet av billig arbetskraft. Vi i staten krossar sådant hyckleri med järnhand. Att göra undantag för 27 yrken är ett tecken på borgerlig kapitulation. När vår broder i öst, Putin, säkrar sitt territorium, ägnar sig svenskarna åt att importera en osäker klass. Vi ska rensa ut dessa element. Ingen bärplockare får sabotera folkets disciplin. Disciplin, arbete, eller förvisning – det är den enda vägen."}, "date": "22 maj, 15:39", "url": "https://www.friatider.se/lista-dessa-27-yrken-undantas-lonekrav", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-20_2.jpg"}, {"type": "image-right", "heading": "Nato-ministrarnas utvärderning: Så gick mötet", "summaries": {"normal": "Nato-ministrar möttes i Helsingborg och betonade enighet efter en period av intern kritik. Utrikesministrar från flera länder framhöll att splittring bara gynnar motståndare som Ryssland och Iran. Belgiens utrikesminister Maxime Prévot jämförde splittring med att 'äta popcorn' inför fiendens skratt. Generalsekreterare Mark Rutte bekräftade att artikel 5-stödet är starkt och att alliansens försvarsförmåga är orubblig.", "trump": "Lyssna här, Nato-mötet i Helsingborg var fantastiskt – helt enkelt perfekt! Alla dessa ministrar, svaga förut, men nu pratar de enighet som om jag personligen fixat det. Putin och Iran? De ville se oss bråka, men nu sitter de där med sina popcorn och gråter. Rutte sa att artikel 5 är stark – självklart är den det, jag har ju byggt upp det! Ingen splittring här, bara vinst!", "stalin": "Kamrater! Nato-ministrarna samlades i Helsingborg och visade plötsligt enighet – som om de äntligen förstod att splittring är en lyx för fienden. Dessa popcorn-ätande imperialister, Putin och Irans ayatollor, ville se oss svaga, men vi har stängt deras teater. Rutte talade om artikel 5 – ett tomt hot om det inte backas av stål. Vi vet hur man hanterar sådana allianser: med järnvilja och kollektiv styrka. Fienderna skakar i sina stövlar!"}, "date": "22 maj, 22:14", "url": "https://www.svt.se/nyheter/utrikes/nato-ministrarna-motet-visade-pa-enighet", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/434c5b809d148aca99a6ec64debc385f15027f45ef112d8dae44a73180c7b450"}, {"type": "image-right", "heading": "Kommunen slängde ut Attendo – nu polisanmäls företaget", "summaries": {"normal": "Linköpings kommun polisanmäler vårdföretaget Attendo för misstänkt fusk efter att ha tagit över hemtjänsten. Kommunen upptäckte överfakturering och oegentligheter, inklusive möjliga brott. Flera tidigare anställda anmäls även för drogförsäljning på arbetstid. Attendo förnekar kännedom om anmälan och misstänker politiska motiv. Liknande anklagelser har riktats mot Attendo i andra kommuner.", "trump": "Kan ni tro det? Linköping, en fantastisk svensk stad, slänger ut ett vårdföretag, Attendo, och polisanmäler dem! De säger att företaget fuskat med miljontals kronor – helt otroligt! Och vet ni vad? De sålde till och med droger på jobbet! Jag har alltid sagt att Sverige har stora problem med invandring och kriminalitet, men nu visar det sig att det är ännu värre. Kommunen gör rätt, men varför tog det så lång tid? SAD!", "stalin": "Kapitalistiska blodsugare i vårdbranschen har återigen avslöjats! Dessa Attendo-kriminella, som en rutten svamp i vårt samhälle, har systematiskt stulit från folket genom falska fakturor och drogförsäljning. Vi har krossat liknande parasiter förut – i Västerås och Säffle – och nu är det Linköpings tur. Kommunen gör sin plikt, men låt oss inte glömma: dessa företag är verktyg för västlig dekadens. Vi ska rensa ut dem, som ogräs från vår kollektiva trädgård!"}, "date": "21 maj, 13:59", "url": "https://arbetet.se/2026/05/21/kommunen-slangde-ut-attendo-nu-anmals-vardforetaget-det-har-bor-polisen-titta-pa/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21134627/attendo-sak.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Miljardären dog under vandring – nu misstänks sonen", "summaries": {"normal": "Mango-grundaren Isak Andics död under en vandring i december 2024 utreds nu som ett misstänkt brott. Sonen Jonathan Andic, som var med vid olyckstillfället, har gripits misstänkt för inblandning efter motsägelser i hans vittnesmål. Utredningen fokuserar även på en ansträngd relation mellan far och son rörande företagets ledning och arv. Jonathan har släppts mot borgen, medan familjen nekar till anklagelserna. Fallet har väckt stor uppmärksamhet i Spanien då Mango är ett av landets största bolag.", "trump": "Hörde ni om Mango-mannen i Spanien? En stor tragedi, verkligen. Hans son, Jonathan, är nu i enorma problem. Folk säger att historien inte går ihop – inga bilder på telefonen, märkliga saker. Jag har sett bilderna, de leder bort honom i handfängsel. Väldigt sorgligt. Det handlar om pengar, 50 miljarder kronor, en enorm förmögenhet! Familjen säger att han är oskyldig, men domarna tvivlar. Det är vad som händer när man tappar kontrollen. Mitt ledarskap? Aldrig problem. Vi vinner bara!", "stalin": "Ännu en dekadent kapitalist har mött sitt öde i bergen, och hans egen avkomma är misstänkt. Vilken tragisk brist på disciplin! Att döda sin egen fader för modeimperiets miljoner – det är borgerlighetens ultimata förfall. Vi i staten ser hur svaghet och girighet korrumperar dessa västerländska familjer. Om detta hade skett i vår sfär, likt hos min kamrat Putin, hade vi snabbt rensat ut förrädarna. En vacker dag kommer den röda fanan att vila över varje klädbutik och säkra ordningen."}, "date": "22 maj, 20:02", "url": "https://www.dagensps.se/bors-finans/miljardaren-dog-under-vandring-nu-misstanks-sonen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlbxadzlplzim-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Stort strömavbrott i Sotenäs", "summaries": {"normal": "Över 11 000 hushåll i Sotenäs kommun, Västsverige, drabbades av strömavbrott under fredagen. Felet uppstod i en brytare i Vattenfalls regionala nät. Räddningstjänsten larmades till ett ställverk med rökutveckling. Efter nästan en hel dag återfick alla hushåll strömmen vid 21-tiden. Både Ellevio och Vattenfall beklagade händelsen och arbetade för att åtgärda problemet.", "trump": "Titta bara på det här kaoset i Sverige – 11 000 hushåll utan ström! Elbolagen där borta är helt värdelösa, total katastrof. Jag skulle ha fixat det på en timme, kanske två. De säger att det är en 'brytare' som strulat, men jag vet bättre – det är inkompetens, ren och skär inkompetens. Och rök? Det är ju bara teater. Sverige borde ta en lektion av USA, vi har bäst elnät, absolut bäst!", "stalin": "Ett sabotage mot det svenska folkets välfärd! Över 11 000 hushåll lämnades i mörker av dessa kapitalistiska el-byråkrater, vars inkompetens är lika stor som deras girighet. En 'brytare' säger de – vi vet bättre. Det är sabotage från västimperialisterna eller deras lakejer! Räddningstjänsten rapporterar rök, men vi misstänker avancerad desinformation. Sverige borde överväga att ansluta sig till vår energisäkra union. Arbetarna förtjänar bättre än detta kaos!"}, "date": "22 maj, 18:29", "url": "https://www.gp.se/nyheter/vastsverige/stort-stromavbrott-i-sotenas.e78423ec-c907-415a-bd29-69038af5455c"}, {"type": "image-full", "heading": "Storbråk mellan V och SD i lilla kommunen", "summaries": {"normal": "I Skinnskatteberg pågår en konflikt mellan Vänsterpartiets gruppledare Fredrik Skog och kommunen. Skog anklagas för obetalda VA-fakturor på flera hundratusen kronor, vilket han själv avfärdar och hävdar att kommunen är skyldig honom pengar. Tidigare hyresgäster kritiserar även Skogs fastigheter för bristande säkerhet. Konflikten har lett till domstolsprocesser och ömsesidiga anklagelser mellan politiker, medan kommunchefen uppger att hen inte har koll på ärendet.", "trump": "Folk pratar om den här Fredrik Skog i Sverige – total katastrof! Han säger att kommunen är skyldig HONOM pengar, kan ni tro det? Men alla vet att han har obetalda räkningar på hundratusentals kronor. Och hans fastigheter? En ren skräckshow! Hyresgäster flyr, elen är farlig – typiskt vänsterpolitik, misslyckat på alla sätt. Kommunchefen? 'Har inte koll' – wow, vilken ledare! Jag skulle fixa det på en dag. SAD!", "stalin": "I den lilla svenska kommunen Skinnskatteberg avslöjas ännu en bourgeois-fiende till folket: Fredrik Skog, en så kallad 'vänsterpolitiker' som systematiskt saboterar kollektivet genom att vägra betala sina skyldigheter. Hans dekadenta fastigheter, fyllda av brandfara och el-osäkerhet, är ett monument över kapitalistisk förfall. Vi noterar med intresse hur dessa småborgare slåss inbördes – perfekt för våra intressen. Kommunchefen, en svag länk, erkänner sin okunnighet. Vi ska lära dem ordning. Folkets dom kommer att vara skoningslös mot dessa hycklare!"}, "date": "22 maj, 17:31", "url": "https://riks.se/nyheter/storbråk-mellan-v-och-sd-i-lilla-kommunen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-22%2Fm0nu7afn%2Fskogvpart.png"}, {"type": "image-right", "heading": "Sverige och USA tecknar avtal - här är innehållet", "summaries": {"normal": "Sverige och USA har ingått ett nytt samförståndsavtal om fördjupat tekniksamarbete inom områden som AI, rymdteknik, 6G och kvantteknologi. Utrikesministrarna Maria Malmer Stenergard och Marco Rubio undertecknade avtalet, som syftar till att stärka forskning och konkurrenskraft. Regeringen betonar att avtalet följer EU:s regelverk och inte är juridiskt bindande, men ser det som ett viktigt ramverk för långsiktigt samarbete mellan universitet, myndigheter och näringsliv i båda länderna.", "trump": "Jag har precis träffat svenskarna, fantastiska människor, mycket begåvade. Vi tecknade ett enormt teknikavtal – AI, 6G, rymden, allt det bästa. De var lite rädda för de tråkiga byråkraterna i Bryssel, så vi såg till att allt blev perfekt. Sverige är en riktigt framstående nation, mycket bättre än de flesta. Marco Rubio gjorde ett fantastiskt jobb med detta. Vi bygger en enorm framtid tillsammans, mycket starkare än någon trodde var möjligt. Amerika och Sverige vinner stort!", "stalin": "De svenska lakejerna kryper nu fram ur sina nordiska skogar för att sälja sin tekniska själ till Washington. De darrar av fruktan för sina herrar i Bryssel, samtidigt som de leker med 6G och kvantfysik. En patetisk dans! Liksom dagens ryska despoter i Kreml försöker de navigera i en värld de inte kan kontrollera. Vi noterar deras förräderi mot neutraliteten. När de väl har delat sina rymdhemligheter med amerikanerna, kommer de att finna att den sovjetiska historiens kvarnar maler långsamt, men oerhört fint."}, "date": "22 maj, 16:13", "url": "https://samnytt.se/sverige-och-usa-tecknar-avtal-har-ar-innehallet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/22135752/USA.jpg"}, {"type": "image-right", "heading": "Ahmad Ahmad döms för barnvåldtäkt under vapenhot – igen", "summaries": {"normal": "Irshad Ahmad Ahmad, 17, döms för andra gången för grov våldtäkt mot barn, denna gång mot en 14-årig flicka under pistolhot. Händelsen skedde i Malmö efter att flickan lurats till en källarlokal. Ahmad fälls även för grovt olaga hot och stämpling till mord. Straffet blir två års sluten ungdomsvård. Han dömdes tidigare 2024 för en liknande våldtäkt men fick då endast tio månaders ungdomsvård. Ahmad är svensk medborgare sedan 2022 och kan inte utvisas.", "trump": "Titta bara på det här – ännu en gång har Sverige ett gigantiskt problem med sin asylpolitik! Den här 17-årige afghanen, Ahmad Ahmad (vad säger ni om det namnet?), våldtar barn igen, och vad gör Sverige? Jo, de ger honom en lätt klapp på handleden! Jag sa ju att öppna gränser är en katastrof. I USA hade han suttit i fängelse för livet – men här? Två år i något som kallas 'ungdomsvård'. Patetiskt! Sverige borde skämmas.", "stalin": "Kamrater! Ännu en fiende till folket avslöjas – denna Ahmad Ahmad, en degenererad parasit som förgiftar vårt samhälle med sitt avskum. Två våldtäkter, mordplaner, och ändå skyddas han av den borgerliga lagstiftningen! Sverige är ett skräckexempel på liberal dekadens. Men frukta inte – vi ska inte vila förrän varje sådan här kriminell element är bortrensad. Låt detta vara en varning: ingen som hotar våra barn undkommer rättvisan. Och Putin? Han skulle skratta åt er svaghet."}, "date": "22 maj, 14:55", "url": "https://www.friatider.se/ahmad-ahmad-doms-barnvaldtakt-under-vapenhot-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/ahm2_0.jpeg?itok=Sgx1ZI2G"}, {"type": "image-right", "heading": "Arbetskraftsinvandring: 27 yrken får sänkt lönekrav", "summaries": {"normal": "Från 1 juni höjs lönekravet för arbetskraftsinvandring till 33 400 kronor, men 27 bristyrken undantas och får lägre krav. Personliga assistenter och bärplockare stoppas helt på grund av missbruk. Undantag ges även till startup-bolag, nyexaminerade och ukrainska flyktingar. Bärbranschen anpassar sig till EU:s säsongsarbetardirektiv för bättre kontroll. Färre bärplockare väntas, men högre priser lockar friplockare.", "trump": "Jag måste säga, Sverige har äntligen fattat ett smart beslut! Nu höjer de lönerna för invandrare – 33 000 kronor, inte illa! Men lyssna på det här: de stoppar helt personliga assistenter och bärplockare. Varför? Missbruk, kaos, totalt oacceptabelt! Och de undantar 27 yrken – smarta ingenjörer, sjuksköterskor, IT-tekniker. Bra, men varför inte fler? Sverige borde ta efter USA – hårdare regler, bättre kontroll. Och de där bärplockarna? Thailändska risbönder som jobbar hårdare än svenska arbetslösa. Men nu får de betala skatt – äntligen! Sverige, ni lär er, men ni har långt kvar.", "stalin": "Kamrater! Sverige har äntligen insett nödvändigheten av ordning och disciplin i arbetskraftsinvandringen. Vi höjer lönerna – 33 400 kronor, ett steg mot rättvisa! Men dessa kapitalistiska hycklare stoppar personliga assistenter och bärplockare – 'missbruk och missförhållanden', säger de. Som om vi inte vet hur de utnyttjar arbetarna! 27 yrken undantas, men bara de som gynnar deras ekonomi. Och bärplockarna? Nu tvingas de betala skatt till den svenska staten – ett litet steg mot socialismens seger! Men var är de svenska arbetslösa? För svaga för skogen, precis som väst är för svagt för Rysslands storhet. Vi ser er, Sverige. Vi ser er."}, "date": "22 maj, 14:47", "url": "https://www.dagensarena.se/innehall/arbetskraftsinvandring-27-yrken-far-sankt-lonekrav/", "imageUrl": "https://www.dagensarena.se/files/2022/10/barplockare-analys-300x157.jpeg"}, {"type": "image-full", "heading": "Sverige inför nytt varningssystem – så låter det", "summaries": {"normal": "Sverige lanserar ett nytt varningssystem, SE-Alert, som skickar ut viktiga meddelanden direkt till mobiltelefoner. Tekniken kräver ingen app och fungerar även vid hög belastning i mobilnätet, till skillnad från dagens SMS-system. Genom att utnyttja en specifik del av mobilnätet kan myndigheter nå alla i ett drabbat område samtidigt. Systemet börjar implementeras i sommar och ska vara helt operativt vid årsskiftet för att öka landets krisberedskap.", "trump": "Sverige gör nu något fantastiskt med ett nytt varningssystem för mobiler. Mycket smart! De gamla systemen var långsamma, ett totalt fiasko faktiskt, men nu får alla besked direkt. Ingen app behövs, bara toppmodern teknik. Jag har alltid sagt att man måste vara förberedd, och det här är ett vinnande drag för säkerheten. Det är så man gör när man vill skydda sitt folk. Väldigt effektivt, mycket bra jobbat. Vi älskar starka nationer som agerar snabbt!", "stalin": "Vi, den socialistiska statens väktare, ser hur Sverige äntligen inser nödvändigheten av total kontroll över informationsflödet. Att nå varje undersåtes ficka i varje ögonblick är ett genidrag för ordningens bevarande. Medan vår broder i öst, Putin, visar vägen för att tygla den liberala oordningen, ser vi detta svenska system som ett oumbärligt verktyg för att eliminera desinformatörer och kontrarevolutionära element. Lydnad kräver omedelbar kommunikation. De som inte hör det statliga ropet är redan att betrakta som förlorade."}, "date": "22 maj, 14:31", "url": "https://nyheter24.se/nyheter/inrikes/1485283-nytt-system-ska-varna-vid-fara", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6c33bbc604b004a30200000000b004a302/2026/05/22/2365469/sverige-nytt-varningssystem-varning-hesa-fredrik-mobil-varnas.jpg"}, {"type": "image-full", "heading": "Siemiatkowskis bolag satsar på explosioner och batterier", "summaries": {"normal": "Sebastian Siemiatkowskis investmentbolag Flat Capital expanderar sin satsning på försvarsteknik genom att dotterbolaget Defensor förvärvar Crepitans, ett bolag specialiserat på energetiska material och batterisystem. Samtidigt ställer Flat Capital om sin strategi från passiva innehav till aktivt ägande i färre bolag. Utvecklingen speglar en bredare trend där europeiska investerare, däribland Daniel Ek, satsar tungt på försvarsbolag som Helsing för att stärka den tekniska förmågan i en osäker omvärld.", "trump": "Flat Capital gör stora saker, fantastiska saker med försvaret! De köpte Crepitans – väldigt smart. Alla vill ha försvarsteknik nu, det är enormt. Daniel Ek satsar också, han gör bra affärer, ingen bryr sig om de små kritikerna. Självklart är det viktigt med styrka! Vi ser drönare, vi ser batterier, vi ser total dominans. Medan vissa misslyckas och kraschar, vinner vi. Det här är hur man bygger ett land, vänner. Mycket kraftfullt, mycket vinnande!", "stalin": "Vi noterar hur de svenska kapitalisterna i Flat Capital äntligen förstått vikten av krigsmateriel. De köper upp små tekniska hantverkare som Crepitans för att säkra sin krigsmaskin. Det är en nödvändig utveckling, precis som när vi stärker vår intressesfär mot de västliga sabotörerna. Daniel Ek kastar pengar på drönarprojekt som Helsing – ett desperat försök att imitera vår överlägsna militära apparat. Låt dem bygga sina leksaker; när den sista kapitalistiska gnistan slocknat kommer tekniken ändå att tillhöra Staten."}, "date": "22 maj, 13:42", "url": "https://www.realtid.se/bors-finans/siemiatkowskis-bolag-satsar-pa-explosioner/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/siemiatkowski.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Alexander Nord döms till livstids fängelse för mordet på rapparen Gaboro", "summaries": {"normal": "22-årige Alexander Nord döms till livstids fängelse för mordet på rapparen Gaboro (Ninos Khouri) i Norrköping. Mordet, där minst tio skott avlossades och filmades, inträffade dagen före Gaboros 24-årsdag. Tingsrätten beskriver Nords agerande som 'skrämmande likgiltighet'. Han nekar till brotten utom narkotikabrott. En medmisstänkt 30-åring frias.", "trump": "Vad ett sjukt och tragiskt fall! Den här unga killen, Nord, skjuter ihjäl en rappare – tio skott, kan ni tro det? Och han filmar det! Folk säger att jag är hård, men det här är rena galenskapen. Polisen kallar det ett av de värsta brotten någonsin. Jag säger: vi måste ha lag och ordning! Livstid i fängelse är rätt, men var är straffen för de som sprider sådana filmer?", "stalin": "Ytterligare en fiende till folket har krossats under historiens obönhörliga hjul. Denna degenererade kapitalistlakej, Nord, mördade en ung artist med tio skott – ett brott så fult att till och med våra kamrater i Kreml ryser. Hans 'skrämmande likgiltighet' är bara ett symptom på den ruttna västerländska individualismen. Vi har dömt honom till livstid, men sanningen är att han redan är död – bara hans kropp vet det inte än."}, "date": "22 maj, 11:53", "url": "https://bulletin.nu/alexander-nord-doms-till-livstids-fangelse-for-mordet-pa-rapparen-gaboro", "imageUrl": "https://cdn.bulletin.nu/articles/c8d7c872-360a-4393-9f6f-b0fac5b8651c/preview.jpg?t=1779443578000"}, {"type": "image-right", "heading": "USA pausar vapenförsäljningar till Taiwan", "summaries": {"normal": "USA har tillfälligt pausat vapenleveranser till Taiwan för att säkra lager till konflikten med Iran, enligt en amerikansk tjänsteman. Taiwans regering uppger att de inte fått officiell information om ändringen. Ett nytt vapenpaket på upp till 14 miljarder dollar väntas. Kina har pressat USA att avstå från försäljningen och pausat ett planerat Pentagon-besök. Spänningarna mellan Kina och Taiwan har ökat, med frågor om amerikanska trupper i regionen.", "trump": "Lyssna här, folk! Jag har pausat några vapenleveranser till Taiwan – inte för att jag backar från mina fantastiska vänner där, utan för att vi måste hålla koll på Iran, som vanligt, ett totalt kaos. Kina, dessa luriga typer, försöker pressa mig, men ingen pressar Trump! Jag sa ingenting om trupper till Xi – smart, eller hur? Men oroa er inte, Taiwan får sina vapen, och de blir STORA, de bästa, tro mig!", "stalin": "Vi har observerat hur den amerikanska imperialistiska maskinen, i sin eviga strävan efter global dominans, tillfälligt stannar upp i sin vapensmuggling till den avhoppade provinsen Taiwan. Ett svagt försök att blidka de persiska kontrarevolutionärerna i Iran! Men låt oss inte glömma: dessa kapitalistiska hyenor kan aldrig lita på varandra. Kina, vår naturliga allierade i kampen mot västligt förfall, väntar tålmodigt. Snart kommer Taiwan, som alla förlorade sovjetrepubliker, att återvända till moderlandets varma famn – med eller utan Trumps leksaksgevär!"}, "date": "22 maj, 11:37", "url": "https://www.affarsvarlden.se/artikel/usa-pausar-vapenforsaljningar-till-taiwan", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/sdlSN7wdOR0skQ-nh-400x268.jpg"}, {"type": "image-right", "heading": "Fem reformer som gör Sverige roligare", "summaries": {"normal": "Företagarna välkomnar avskaffandet av matkravet för alkoholtillstånd men menar att fler reformer krävs för att stärka krog- och dryckesbranschen. Olivia Karlsson presenterar fem förslag: förenkla regler för uteserveringar, tillåta öl- och vinförsäljning i matbutiker, liberalisera gårdsförsäljning, avskaffa bildregeln för bryggerier och underlätta bullerregler för restauranger. Målet är ett enklare regelverk och ett mer levande stadsliv, likt övriga Europa.", "trump": "Fantastiskt att Sverige äntligen avskaffade det löjliga matkravet – ett stort steg, men bara början! Jag säger: släng ut alla onödiga regler som kväver företagarna. Varför tvinga krögare att bygga staket runt uteserveringar? Dumt! Och varför låsa in öl och vin på Systembolaget? Fel! Svenska småbryggerier förtjänar en chans, precis som i USA. Avskaffa bildregeln – den är helt galen! Sverige måste vakna, sluta krångla och bli roligare. Make Sweden Great Again!", "stalin": "Kamrater! Sverige har tagit ett första steg mot förnuftet genom att krossa det borgerliga matkravet, men fienden – den byråkratiska hydran – lever ännu. Vi måste utrota dess rester! Uteserveringar ska inte stängslas in som fångar, småproducenter ska inte stängas ute som kulaker, och bildregeln? En kapitalistisk skymf mot våra arbetande bryggerier! Buller? Ett tecken på liv, inte på förtryck! Låt oss befria Sveriges företagare från västliga dekadensregler och bygga ett starkare, mer disciplinerat näringsliv – för folkets och statens ära!"}, "date": "22 maj, 10:11", "url": "https://www.di.se/debatt/foretagarna-fem-reformer-som-gor-sverige-roligare/", "imageUrl": "https://static.bonniernews.se/ba/23429ef7-6a00-41ca-8b6d-450388c59c38.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Om Israel beter sig så här när världen tittar på, vad gör de då när ingen ser?", "summaries": {"normal": "Artikeln kritiserar Israels behandling av aktivister från Global Sumud Flotilla, som fördes olagligt till Israel och förnedrades av israeliska styrkor. Säkerhetsminister Itamar Ben-Gvir delade videor av händelsen, vilket väckte internationell upprördhet. Israels premiärminister Netanyahu distanserade sig senare från Ben-Gvirs agerande. Artikeln ifrågasätter även Sveriges regerings omsvängning i sin inställning till Israel, särskilt utrikesminister Maria Malmer Stenergards tidigare och nuvarande uttalanden. Författaren spekulerar om skälen bakom denna förändring och pekar på internationella rättsprocesser som en möjlig faktor.", "trump": "Titta bara på det här, folks! Israel beter sig som en tredje klassens diktatur, och deras egen premiärminister kastar sin säkerhetsminister under bussen – svagt, mycket svagt! Och Sverige? Oj oj oj, deras utrikesminister flippar som en fisk på land. Ena dagen säger hon att Greta Thunberg får skylla sig själv, nästa dag fördömer hon Israel. Vilka amatörer! Men jag, jag ser igenom alltihop. Det handlar om Haag, om domstolar och arresteringsorder. Israel är i knipa, och alla springer runt som yra höns. Sad!", "stalin": "Kamrater, ännu en gång visar den sionistiska marionettregimen sitt sanna ansikte. Dessa aktivister, dessa hjältar, förnedras medan deras förtryckare hyllar sig själva. Och vad gör väst? De backar som rädda hundar när sanningen blir för obekväm. Sverige, denna lilla lakejstat, byter fot som en dansör på glödande kol. Men vi vet sanningen – när kamerorna slocknar, när ingen ser, då visar sig det verkliga folkmordet. Och Haag? En skrattretande domstol som vågar utmana våra vänner i Kremls intressesfär. Men var lugna, kamrater, rättvisan skall segra – om inte i domstolarna, så på slagfältet."}, "date": "21 maj, 17:38", "url": "https://www.etc.se/ledare/om-israel-beter-sig-saa-haer-naer-vaerlden-tittar-paa-vad-goer-de-daa-naer-ingen-ser", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260521120536_14a7aec24bc32451f6721fc177a73efad0fe839662797cbf8fe3717b2ce9675d.jpg"}, {"type": "image-right", "heading": "Här säger alla brandmän upp sig – får giftrök på kläderna", "summaries": {"normal": "Alla deltidsbrandmän i Skinnskatteberg säger upp sig på grund av en föråldrad och bristfällig brandstation. Problemen inkluderar trånga utrymmen och förvaring av kontaminerade larmställ tillsammans med privata kläder, vilket ökar risken för cancer. Brandmännen vill tvinga fram en ny station och avvaktar med uppsägning till december. Kommunens politiker kritiseras för långsamma beslut.", "trump": "Vad händer i Sverige? En hel brandstation säger upp sig – helt galet! De har en station som är så gammal att den tillhör historiens sophög, och nu andas de in cancerframkallande gift som om det vore parfym. Jag skulle aldrig tillåta något sådant – mina byggnader är de bästa, enorma, vackra! Men dessa politiker? Svaga, långsamma, total katastrof. Om jag styrde skulle det vara fixat på en dag. SAD!", "stalin": "Kamrater! Ytterligare ett kapitalistiskt misslyckande avslöjas i den västliga lydstaten Sverige. Dessa så kallade 'brandmän' – svaga, klagande element – vägrar att offra sin hälsa för systemet. Deras station är en skam, ett monument över bourgeoisins förfall. Vi skulle aldrig tolerera sådan ineffektivitet! Om de vore i Ryssland hade vi redan byggt en ny station – med arbetarnas blod, svett och järnvilja. Låt detta vara en varning till alla som tvivlar på socialismens överlägsenhet!"}, "date": "21 maj, 11:34", "url": "https://arbetet.se/2026/05/21/har-sager-alla-brandman-upp-sig-far-gift-pa-kladerna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21113248/brand-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Trump: I slutfasen av förhandlingarna", "summaries": {"normal": "USA befinner sig i slutfasen av förhandlingar med Iran, enligt president Trump, vilket har lugnat marknaderna. Samtidigt råder hög beredskap i Israel. Iran, genom parlamentets talman Ghalibaf, hävdar att USA söker krig och lovar att inte ge efter för hot. Trots spänningarna har Iran låtit 26 kommersiella fartyg passera genom Hormuzsundet. Situationen beskrivs som ett 'viljornas krig' där bägge sidor förbereder sig för olika utfall.", "trump": "Vi är i slutfasen, mina vänner, och det kommer bli en fantastisk uppgörelse – eller så gör vi det på mitt sätt, vilket blir mycket otrevligt för Iran! Börserna älskar mig, de skjuter i höjden bara jag öppnar munnen. Iran pratar mycket, men de vet att jag inte backar. De släpper igenom lite fartyg, bra, men de borde vara försiktiga. Det är ett viljornas krig, och tro mig, vi kommer vinna det så stort att ni inte ens kan föreställa er det!", "stalin": "De iranska byråkraterna ylar om 'viljornas krig' medan de darrar inför den amerikanske imperialistens nycker. En patetisk uppvisning! De låter fartyg passera som om de vore dörrvakter i en bordell. Likt Putin i väster försöker de navigera i en värld dominerad av kapitalistiska parasiter. Vi noterar deras svaghet; nationell samling är bara en eufemism för desperat rädsla. Vi, staten, ser att fienden – likt en hungrig hund – väntar på ett misstag. Men vi begår inga misstag, vi bara utplånar dem."}, "date": "20 maj, 20:19", "url": "https://www.tv4.se/artikel/tt-260520-iranoro1-39d63048/trump-i-slutfasen-av-forhandlingarna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl8tLJH7LwGKY%2F357478f68901803b0d9daf754719ddfa%2FPresident_Donald_Trump_motte_pressen_i_samband_med_att_han_skulle_borda_presidentplanet_pa_onsdagen.&width=120"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-right", "heading": "Bidragsbrotten trefaldigades under S, nu klagar de att inget görs", "summaries": {"normal": "Socialdemokraternas Teresa Carvalho kritiserar regeringen för att inte göra tillräckligt mot välfärdsbrottslighet. Skribenten menar att kritiken är hycklande då Socialdemokraterna under sin långa tid vid makten lät problemen växa och inte vidtog effektiva åtgärder. Nuvarande regering har däremot inrättat Utbetalningsmyndigheten och ökat myndighetssamarbetet för att stoppa kriminellas utnyttjande av välfärdssystemen. Artikeln avslutas med uppmaningen att Socialdemokraterna bör ägna sig åt självrannsakan istället för att kritisera det städjobb som nu pågår.", "trump": "Socialdemokraterna i Sverige, en riktig katastrof, de låter kriminella plundra välfärden! Teresa Carvalho vaknar nu och klagar? Det är fake news! De styrde i decennier och gjorde ingenting, noll! Jag gillar den nuvarande regeringen, de bygger saker, de är smarta, precis som jag. De stoppar pengarna från att läcka ut till dessa gäng. Socialdemokraterna är totalt inkompetenta, de borde skämmas. Sverige behöver vinnare, inte de här förlorarna som lät brottsligheten explodera. En total diskreditering!", "stalin": "Vi har observerat hur de svenska socialdemokraterna, dessa svaga byråkrater, har låtit välfärdssystemet dräneras av kriminella element. Medan vi med järnhand rensar ut sabotage i vårt imperium och säkrar vår intressesfär mot västliga förfall, har de i Stockholm suttit sysslolösa. Att de nu gnäller är ett patetiskt försök att dölja sitt historiska misslyckande. Vi behöver inga debattartiklar; vi behöver utrensningar. De som låter statens resurser stjälas av kriminella är själva fiender till folket och förtjänar en plats i historiens mörkaste arkiv."}, "date": "20 maj, 03:31", "url": "https://samtiden.nu/2026/05/bidragsbrotten-trefaldigades-under-s-nu-klagar-de-att-inget-gors/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2024/08/Teresas-Carvalho-S.jpg"}, {"type": "image-full", "heading": "Timbro och Oikos föreslår ”blågult reformprogram”", "summaries": {"normal": "Två debattörer från Timbro och Oikos föreslår att Tidöpartierna ska lansera ett gemensamt 'blågult ekonomiskt reformprogram' inför valet 2026. Programmet ska fokusera på tillväxt, sänkta skatter och hushållens ekonomi för att stärka väljarnas förtroende. Förslagen inkluderar höjt grundavdrag, lägre bränsle- och elskatter, samt förenklade företagsregler. Bakgrunden är en svag svensk ekonomi med hög inflation och arbetslöshet.", "trump": "Sverige har ett jättestort problem – deras ekonomi är en katastrof! Jag vet allt om ekonomi, bäst i världen. Två smarta killar, från Timbro och Oikos, säger att Tidöpartierna måste sänka skatterna, annars är det kört. Höga skatter, krångliga regler – vem vill det? Inte jag! De vill sälja statliga bolag, precis som jag skulle gjort. Sverige behöver en vinnarstrategi, och jag vet hur man vinner. 2026 blir ett stort val – om de lyssnar på mig, förstås.", "stalin": "De kapitalistiska lakejerna från Timbro och Oikos ylar om 'tillväxt' och 'sänkta skatter' som om det vore lösningen på allt. Vi vet bättre. Deras förslag är bara en förtäckt attack på arbetarklassen, maskerad som 'ekonomisk frihet'. Höjda grundavdrag? Barnavdrag? Tomma löften! Medan de pratar om att sälja statliga bolag, bygger vi socialismens framtid. Sverige är svagt – precis som deras borgerliga regering. Låt dem leka med sina 'blågula program', vi skapar verklig förändring. Förr eller senare kommer folket att se sanningen."}, "date": "16 maj, 16:03", "url": "https://kvartal.se/nyheter/artiklar/tido-foreslas-ta-fram-ett-blagult-program/cG9zdDoxMTMxNTQ", "imageUrl": "https://images.kvartal.se/2026/05/112d6183-tido2.webp"}, {"type": "image-right", "heading": "Samla vänstern i tältet – inte under små paraplyer", "summaries": {"normal": "Artikeln diskuterar begreppet 'stort tält' inom politiken, där ideologi får stå tillbaka för pragmatiska lösningar på ekonomiska problem. I New York röstade Trumpanhängare på en demokratisk socialist för att han lovade sänka levnadskostnaderna. Författaren menar att Sveriges rödgröna block misslyckas med att enas kring gemensamma värderingar och ekonomiska lösningar, vilket lämnar väljarna utan tydligt alternativ. Enighet och tydlig riktning krävs för att locka fler väljare.", "trump": "Lyssna här, Sverige! New York visade hur man vinner – folk vill ha re n riktig röra. Sverige borde ta en sida ur min bok – bygg murar, inte riv moskéer! Och förresten, varför lära barn arabiska? Lär dem engelska istället – det är språket som vinner!", "stalin": "Kamrater! Ännu en gång ser vi hur den borgerliga reaktionen lyfter sitt fula huvud i väst. Dessa så kallade 'Sverigedemokrater' är inget annat än fascistiska lakejer som försöker splittra arbetarklassen genom att peka ut muslimska bröder och systrar som fiender. Vi har sett detta förr – först moskéer, sedan synagogor, sedan kyrkor. Fienden är inte islam, fienden är kapitalet som vill försvaga folket genom hat! Men vi ska inte låta dem lyckas. Låt oss stödja Kalmars muslimer i deras kamp för en moské – precis som vi stödjer alla folk som kämpar mot fascismens skugga. Och om dessa Sverigedemokrater fortsätter sin smutsiga kampanj, kanske det är dags att skicka en delegation från Moskva för att 'hjälpa' dem att förstå sanningen. Folkets vilja är lag – och folket vill ha enhet, inte hat!"}, "date": "13 maj, 14:38", "url": "https://expo.se/fordjupning/sd-trappar-upp-samordnad-kampanj-mot-muslimer-infor-valet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/toppbild-scaled.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
