iens skugga och ler mörkt åt deras ynkliga imperialism. En sådan provokation mot suveräna folk väcker bara hat och misstro. Kamrater, dessa giriga hyenor avslöjar ständigt sin sanna natur. Rensa ut illusionerna om deras fredliga avsikter."}, "date": "8 september, 08:35", "url": "https://www.friatider.se/island-amerikanskt-pa-trumps-nya-karta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-839.jpg"}, {"type": "image-right", "heading": "”Tre förslag som kan lösa kompetensbristen”", "summaries": {"normal": "Artikeln pekar på att vart fjärde rekryteringsförsök misslyckas i Sverige trots hög arbetslöshet. Författaren Diana Vasiliou uppmanar nästa regering att prioritera arbetsmarknadens behov i utbildningspolitiken. Tre förslag lyfts: bättre styrning av utbildningar, starkare koppling till arbetslivet samt flexibla utbildningar under hela yrkeslivet. Kompetensbristen hotar tillväxten.", "trump": "Lyssnar ni, Sverige? Ni har skyhög arbetslöshet men ändå inte folk som kan jobba. Patetiskt! Det är de woke-vänliga kvoterna och den socialistiska utbildningsmaffian som sabbar allt. Vi behöver riktiga jobb, inte mer flum. Jag fixade det i USA – gör om, gör rätt, annars fortsätter ni att förlora stort mot de globalistiska förlorarna.", "stalin": "Kamrater, se hur de giriga hyenorna i näringslivet gnäller över brist på lydiga kugghjul. Jag föraktar denna dekadenta utbildningsanarki som gynnar klassfienderna. Vi måste med järnhand tvinga fram en sann sovjetisk kompetenspolitik där partiet styr varje plats och utrensar alla svaga länkar. Endast kollektivets vilja segrar – annars likvideras motståndet."}, "date": "8 september, 08:00", "url": "https://arbetet.se/2026/09/08/till-nasta-regering-tre-forslag-som-kan-losa-kompetensbristen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/07111934/diana.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "”Lönen är ett hån mot oss undersköterskor”", "summaries": {"normal": "Undersköterskan Christina Woxblom beskriver i en debattartikel hur hennes lön efter 30 år i yrket inte räcker till att leva på utan en partners inkomst. Hon känner sig utnyttjad och förminskad, då yrkets ansvar och kompetenskrav inte återspeglas i lönen. Reformen med skyddad yrkestitel har inte lett till högre status eller bättre ersättning. Hon kräver höjda löner och bättre värdering av välfärdsarbetet.", "trump": "Folk, det här är en katastrof. Den stackars undersköterskan i Sverige får en lön som knappt täcker räkningarna trots trettio år av slit. Biden och de radikala vänsterglobalisterna har förstört allt med sin identitetspolitik och kvoterkräk. Vi behöver inga fler tomma diplom – vi behöver riktiga löner för riktiga arbetare, inte för de woke-marxistiska byråkraterna som suger musten ur systemet. Make healthcare great again!", "stalin": "Kamrater, se hur de giriga profitthungriga borgarhyenorna i den svenska kommunen förtrycker den ärliga arbetarkvinnan som dagligen räddar liv. Tre decennier av trogen tjänst ger henne endast ett fint papper på väggen medan hennes stolthet långsamt krossas. Detta är klassförräderi i sin renaste form. Vi måste rensa ut dessa dekadenta folkförtryckare och återupprätta arbetets värdighet med järnhand. Vår seger kräver det."}, "date": "8 september, 07:26", "url": "https://arbetet.se/2026/09/08/lonen-ar-ett-han-mot-oss-underskoterskor-jag-kanner-mig-utnyttjad", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08072524/debatt-ka.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Så blir jobbpolitiken om S, MP och C regerar", "summaries": {"normal": "En S-ledd regering med MP och C väntas leda till hårda förhandlingar om jobbpolitiken. Centerpartiet vill sänka a-kassan, behålla privata matchningsföretag och sänka skatter, medan S och MP prioriterar starkare trygghetssystem och mer resurser till Arbetsförmedlingen. Kompromisser väntas kring karensavdraget, pensioner och arbetsgivaravgifter. Ingen generell arbetstidsförkortning blir aktuell.", "trump": "Folk, ni skulle se det här svenska cirkuset. Socialisterna och de gröna galningarna vill ge bort allt till latmaskarna medan Centerpartiets bluffmakare försöker sänka skatter lite grand. Det blir en total katastrof, en riktig röra av svaga ledare som hatar riktiga jobb. Tro mig, ingen vinner utom byråkraterna. Patetiska förlorare allihop, precis som Biden var.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom den så kallade centerfalangen vill med sin parasitiska arbetslinje undergräva arbetarnas trygghet och krossa kollektivets skydd. Jag ser deras giriga planer på att likvidera a-kassans själ. Inga kompromisser med folkförtryckarna! Vi ska rensa ut alla som sviker arbetarklassen. Deras kompromiss blir deras fall."}, "date": "8 september, 07:00", "url": "https://arbetet.se/2026/09/08/dragkamp-om-skatter-och-a-kassa-sa-blir-jobbpolitiken-om-s-mp-och-c-regerar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01142507/smpc.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Det är inte svenskt att gamla dör med rutten mat i munnen", "summaries": {"normal": "Artikeln kritiserar Ulf Kristerssons och Tidöregeringens politik för äldreomsorgen. En granskning visar fall av allvarlig vanvård där en äldre kvinna dog under plågsamma förhållanden. Kommuner går med underskott, inflation urholkar bidragen och personalen har hög sjukfrånvaro. Författaren menar att löftena om satsningar är lögner och att välfärden förfaller.", "trump": "Folk, ni skulle se det här. Den svenska välfärden är en total katastrof, en riktig röra. Ulf och hans svaga vänsterliberala gäng lovar guld och gröna skogar men ger bara rutten mat och tortyr åt de gamla. Inflationen äter upp allt medan de låtsas satsa. Patetiska globalister som hellre sänker skatter än fixar vården. En skam, tro mig!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna låter den gemensamma välfärden ruttna. En gammal kvinna dör i tortyr medan byråkrater sparar på personal. De lovar satsningar men levererar underskott och utmattade undersköterskor som inte ens törs dricka vatten. Jag säger: sådana dekadenta parasiter förtjänar att rensas ut. Detta är fiendens verk."}, "date": "8 september, 06:57", "url": "https://arbetet.se/2026/09/08/det-finns-inget-svenskt-med-att-gamla-dor-med-rutten-mat-i-munnen-ulf-kristersson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08065651/mat-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Mats Nilsson: Sluta gömma elskatten bakom förskolebarn", "summaries": {"normal": "Mats Nilsson argumenterar för att elskatten i Sverige bör avskaffas för att främja elektrifieringen och hjälpa hushållen. Argumentet att skatten finansierar välfärden som förskolor kallas ett vilseledande retoriskt knep. Nilsson menar att finansiering i stället kan ske genom att skära ned på ineffektiva företagsstöd, felaktiga utbetalningar och onödiga myndighetslokaler i en stor statsbudget.", "trump": "Sverige har en katastrofal elskatt – helt löjligt, 60 gånger över EU:s miniminivå! De skyller på förskolebarnen, ”Åh, vem ska tänka på barnen?!” Fake news! Det handlar bara om enormt slöseri med statliga kontor och falska bidrag. Jag säger: sänk skatterna, elektrifiera allt, gör Sverige great igen! Sluta gömma er bakom barnen!", "stalin": "Dessa svenska skattebetalare gråter över elpriser medan vi bygger socialismen i stål och kol. Att avskaffa skatter kräver disciplin! Vi ska inte skylla på några förskolebarn. Om staten behöver pengar för att driva maskineriet rensar vi bara bort byråkraternas lyxkontor och korrupta företagssubventioner. Effektivitet är partiets ära!"}, "date": "8 september, 07:00", "url": "https://www.affarsvarlden.se/artikel/mats-nilsson-sluta-gomma-elskatten-bakom-forskolebarn", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-56-900x600.jpg"}, {"type": "image-right", "heading": "Uttryckte hat mot judar och hyllade terrorism – bjöds in av V", "summaries": {"normal": "Vänsterpartiet bjöd in två palestinska politiker från Fatahs revolutionära råd till riksdagen trots att de tidigare uttryckt antisemitiska åsikter och hyllat terrorism. Partiledaren Nooshi Dadgostar deltog vid mötet. Forskaren Magnus Ranstorp kritiserar beslutet som ett allvarligt mönster som väcker frågor om partiets omdöme. Partiet försvarar sig med att de inte alltid delar gästernas värderingar.", "trump": "Kan ni tro det? De galna vänsterradikalerna i Sverige bjuder in judhatande terrorhyllare rakt in i riksdagen medan deras clown till ledare Dadgostar står och poserar. Det är en total skam! Dessa woke-imbeciller och identitetspolitiska nollor har förvandlat landet till en antisemitisk cirkus. Patetiskt, folk fattar inte hur sjukt det är.", "stalin": "Jag ser hur dessa dekadenta klassförrädare inom Vänsterpartiet välkomnar antisemitiska element och terrorapologeter till riksdagens helgedom. Ett mönster av förräderi mot folket! Det väcker min djupaste misstänksamhet. Kamrater, sådana parasitiska element måste rensas ut innan de förgiftar hela partiet med sin dekadens. Allvarligt hot mot revolutionens renhet."}, "date": "8 september, 07:40", "url": "https://www.svt.se/nyheter/inrikes/uttryckte-hat-mot-judar-och-hyllade-terrorism-bjods-in-av-v-till-riksdagen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.43/0.49/0dd188c18019ac98b8a9b4d524fb7793dfad93b634f4d70cec1c515d8b8bf961"}, {"type": "image-right", "heading": "Därför går det så bra för vänstern i storstäderna", "summaries": {"normal": "I Europas storstäder går vänstern framåt, inte minst i Stockholm där Vänsterpartiets stöd har fördubblats sedan 2010. Forskare pekar på tuff bostadsmarknad som orsak till missnöje mot kapitalismen. Samtidigt vinner Sverigedemokraterna stöd på landsbygden. Segregationen ökar med åldern och påverkar röstbeteenden samt attityder till mångfald.", "trump": "De galna vänsterextremisterna och deras gröna galningar tar över era usla europeiska storstäder medan de riktiga människorna på landsbygden röstar rätt. Stockholm? Total misär med tre miljoner för ett dass. De radikala ungdomarna skyller på kapitalismen istället för sina egna korkade idéer. Patetiskt! Jag byggde murar, de bygger misär.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna skapar segregation som splittrar folket. I storstäderna rasar de unga mot bostadsmisären och pekar på kapitalismen, precis som det ska vara. På landsbygden växer andra reaktionära krafter. Denna olyckliga utveckling kräver ideologisk vaksamhet och utrensning av alla dekadenta influenser som splittrar arbetarklassen."}, "date": "8 september, 01:30", "url": "https://www.dagensarena.se/innehall/darfor-gar-det-sa-bra-vanstern-storstaderna", "imageUrl": "https://www.dagensarena.se/files/2026/09/stockholm-foto-ole-neitzelwikimedia-300x157.jpeg"}, {"type": "image-right", "heading": "Därför är indexerade statsbidrag årets viktigaste vallöfte", "summaries": {"normal": "Socialdemokraterna föreslår att indexera de generella statsbidragen till kommuner och regioner. Förslaget syftar till att motverka att bidragens värde urholkas av inflation och löneökningar, vilket annars leder till smygbesparingar. Det skulle ge bättre förutsägbarhet och långsiktighet i planeringen av vård, skola och omsorg. Markus Dalström argumenterar för att det förbättrar välfärdens villkor.", "trump": "Lyssnar ni på de svenska socialisterna som vill indexera bidragen? Det är patetiskt. De kan inte ens hålla sina egna kommuner flytande utan att suga mer pengar från folket. Biden skulle ha älskat det här – mer byråkrati, mer slöseri. Jag fixade en stark ekonomi i USA, de borde lära sig av en vinnare istället för att gömma sig bakom teknikaliteter och vänsterns misslyckade välfärdsdrömmar.", "stalin": "Kamrater, dessa profitthungriga klassförrädare låter statsbidragen ruttna i värde medan arbetarnas välfärd förfaller. Jag ser deras smygbesparing som ett angrepp på kollektivet. Indexering är ett steg mot ordning, men vi måste rensa ut alla dekadenta element som vägrar planera för folket. Välfärden tillhör inte de giriga parasiterna – den tillhör staten och framtiden. Försök inte lura oss."}, "date": "8 september, 01:30", "url": "https://www.dagensarena.se/opinion/darfor-ar-indexerade-statsbidrag-arets-viktigaste-vallofte", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-2026-09-07t145509709-300x157.jpg"}, {"type": "text", "heading": "Spritfest hos EU-kopplad Northvolt-finansiär: ”Obegränsad alkohol”", "summaries": {"normal": "Det EU-finansierade riskkapitalbolaget InnoEnergy utreds för bedrägeri och kritiseras nu av tidigare anställda för lyxiga fester med obegränsad alkohol och onödiga flygresor för skattepengar. Kritiken följer på tidigare avslöjanden om bristfälliga utbildningar, misstänkta intressekonflikter och mångmiljonlöner för ledningen, vilket tecknar bilden av en osund företagskultur.", "trump": "Sorgligt! Det här EU-bolaget slösar bort enorma summor skattepengar på gigantiska fester med obegränsad sprit och värdelösa Minecraft-utbildningar medan ledningen håvar in hundratals miljoner. Totalt inkompetent! De pratar om grönt och klimat, men flyger runt överallt för meningslösa möten. Helt otroligt att de får hållas. USA gör det så mycket bättre, vi älskar framgång och riktiga affärer!", "stalin": "Dessa korrupta kapitalister slösar folkets resurser på bottenlösa spritfester och meningslösa flygturer medan deras skamliga utbildningar sker i barnsliga dataspel. En skam för arbetarklassen! Ledningen berikar sig med miljoner på statens bekostnad. Sådant slöseri tolereras icke i en sund stat; avvikarna och de skyldiga bör omedelbart granskas och skickas till omorganisering för det allmänna bästa."}, "date": "8 september, 06:05", "url": "https://www.affarsvarlden.se/artikel/spritfest-hos-eu-kopplad-northvolt-finansiar-obegransad-alkohol"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}, {"type": "image-full", "heading": "Musks förarlösa taxi har börjat rulla på vägarna i Texas", "summaries": {"normal": "Teslas förarlösa Cybercab rullar nu med passagerare i Austin, Texas. Myndigheten NHTSA har inlett en granskning då fordonen saknar rattar och pedaler. Tesla hävdar att tekniken är säker, men myndigheten undersöker om säkerhetskraven uppfylls och om Teslas egen analys håller. Utfallet kan bli avgörande för framtiden för autonoma fordon i USA.", "trump": "Elon Musk och hans Cybercab – en fantastisk idé, kanske den bästa någonsin, men byråkraterna i Washington vill stoppa allt! De älskar att granska, de älskar att bromsa. Ingen ratt? Ingen pedal? Det låter som en riktigt smart affärsman som vet vad han gör. Under min ledning ska vi ha den bästa tekniken, inte låta småsinta tjänstemän förstöra framtiden för amerikansk innovation!", "stalin": "Tesla-direktörerna tror att de kan certifiera sig själva och ignorera folkets säkerhet. Vilken kapitalistisk hybris! Att sätta passagerare i en maskin utan kontrollorgan är ett brott mot den rationella ordningen. Vi, staten, kräver total insyn. Om inte maskinen kan underordna sig strikt byråkratisk kontroll måste den omedelbart skrotas. Det finns inget utrymme för anarkistisk ingenjörskonst i en disciplinerad framtid."}, "date": "6 september, 13:24", "url": "https://www.realtid.se/it-tech/musks-forarlosa-taxi-har-borjat-rulla-pa-vagarna-i-texas", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/amar-13.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "De som röstar på C borde inte rösta alls", "summaries": {"normal": "Artikeln kritiserar Centerpartiet för att locka väljare med ett neutralt namn snarare än sin politik. Partiet har skiftat från borgerligt till ett liberalt parti med öppen migrationspolitik, vilket enligt texten prioriteras framför ekonomiska borgerliga värderingar. Författaren menar att det är ett riskfritt men skadligt val för den som vill bevara Sverige.", "trump": "Centerpartiet, vad är det för en röra? De kallar sig mittparti men är bara en massa fega liberaler som älskar att släppa in alla möjliga och omöjliga. De har svikit det riktiga folket, precis som Sleepy Joe gjorde. Rösta inte på dem, det är en total katastrof för Sverige. De borde kalla sig Bondepartiet igen, det vore åtminstone ärligt. Patetiskt!", "stalin": "Kamrater, se hur detta så kallade centerparti förvandlats till en liberal parasit som prioriterar främmande element framför arbetarklassen. Deras falska mittenretorik döljer ett förräderi mot nationen. Jag skrattar mörkt från historien åt dessa opportunister som tror att mångfald räddar staten. Bättre att inte rösta alls än att stödja sådana fiender till folkets enhet."}, "date": "6 september, 08:24", "url": "https://samtiden.nu/2026/09/de-som-rostar-pa-c-borde-inte-rosta-alls/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7301-1260x720.jpeg"}, {"type": "image-right", "heading": "Regioner: Regeringens kösatsning har gett fel patienter förtur", "summaries": {"normal": "Regeringens riktade miljardstöd till operationer av grå starr, höftproteser och framfall har kortat vissa vårdköer men lett till undanträngning av patienter med större medicinska behov. Flera regioner kritiserar satsningen och varnar för att den försvårar prioriteringsarbetet. Sjukvårdsminister Elisabet Lann (KD) anser att regionerna inte får frångå behovsprincipen.", "trump": "De här korkade svenska byråkraterna och deras socialistiska sjukvård har fullständigt saboterat allt med sina dumma riktade bidrag. Patienter med riktiga problem trängs undan medan de prioriterar vad som helst för att suga åt sig statliga pengar. Patetiskt! Ni borde lyssna på mig, inte på de woke-vänliga köerna som Biden lämnade efter sig.", "stalin": "Jag ser hur dessa profitthungriga klassförrädare i regionerna vrider sig som maskar under trycket från statens riktade medel. De vågar undantränga de mest behövande och kallar det prioritering. En sådan dekadens kräver omedelbar utrensning av alla som sätter personlig vinst före folkets hälsa. Kamrater, vakna upp mot dessa parasiter!"}, "date": "8 september, 05:41", "url": "https://www.svt.se/nyheter/inrikes/kritik-mot-regeringens-riktade-kosatsning-overskjutning-till-lagre-prioriterade-patienter", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.59/0.48/94f5199a4bfe433af7867f2f6b5a2b753951303c2cf80e03162d94deeb3f69b9"}, {"type": "image-right", "heading": "Leif GW Persson: Tidöregeringen ägnar sig åt etnisk rensning", "summaries": {"normal": "Leif GW Persson anklagar migrationsminister Johan Forssell och regeringen för etnisk rensning i en ny intervju. Konflikten är djupt rotad, efter att kriminologen tidigare försvarat en protestaktion utanför ministerns bostad och regelbundet kritiserat regeringens migrationspolitik i hårda ordalag.", "trump": "Leif GW Persson attackerar den svaga migrationsministern! Hemskt språk, väldigt nesligt, men låt mig säga er att migrationen i Europa är en total katastrof. Fake news-medierna försöker tysta sanningen, precis som de försöker göra med mig. De borde lära sig av America First, då hade de sluppit sådana här problem!", "stalin": "Den så kallade kriminologen Persson kastar smuts på statens ordning och kallar ministern för ett fanske. Ett sådant borgerligt svammel tolereras icke i en sund stat! Om denna Persson hade verkat under mitt beskydd hade hans revisionistiska utbrott snabbt botats i ett behagligt omskolningsläger i Sibirien. Ordning måste finnas!"}, "date": "8 september, 08:44", "url": "https://samnytt.se/leif-gw-persson-tidoregeringen-agnar-sig-at-etnisk-rensning", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/08064120/leif-gw-forssell.jpg"}, {"type": "text", "heading": "Nytt lagförslag om brottsprovokation", "summaries": {"normal": "Tidöpartierna föreslår en ny lag som gör det tillåtet för polisen att använda provokativa metoder, som att utge sig för att vara barn på nätet eller köpa vapen och narkotika av kriminella. Metoden, som ska kräva åklagartillstånd, syftar till att bekämpa allvarlig brottslighet och kan gälla personer från 15 år och uppåt.", "trump": "Sverige gör äntligen som jag, skaffar lag och ordning! De låter polisen lura de onda, precis som jag gör varje dag med Fake News. De låtsas vara barn och köper vapen, väldigt tufft! Men glöm inte, ingen gör brottsbekämpning bättre än Donald J. Trump. Helt enormt!", "stalin": "Ett storslaget initiativ! Vår svenska brottsbekämpning visar äntligen bolsjevikisk målmedvetenhet genom att infiltrera brottslingars nät."}, "date": "7 september, 10:22", "url": "https://kvartal.se/nyheter/artiklar/polisen-ska-fa-provocera-fram-brott/cG9zdDoxODU2OTM"}, {"type": "image-full", "heading": "Ny studie: Äldre upplever större mening", "summaries": {"normal": "En ny studie från Lunds universitet visar att svenskarnas känsla av meningsfullhet ökar med åldern, vilket liknar det japanska begreppet ikigai. Detta är ett skifte sedan 2020 då unga mådde bättre. Forskare tror att pandemin drabbade ungas sociala liv hårt, och att äldre har bättre problemlösningsförmåga. Även personlighet och trygga relationer spelar stor roll.", "trump": "En enorm studie från Sverige visar att äldre människor där mår fantastiskt bra, mycket bättre än de unga! Ungdomarna krossades fullständigt av pandemins radikala lockdowns, total katastrof. Men de äldre har hittat livets mening, precis som jag alltid säger att man gör med styrka och bra relationer. Fantastiskt folk, väldigt smarta!", "stalin": "En statlig rapport från Lund bekräftar att våra äldre kamrater uppnår högre disciplin och meningsfullhet med åldern, medan ungdomen sviktar i sin ideologiska motståndskraft efter pandemins prövningar. Detta är korrekt: medborgaren mognar i takt med att staten ordnar deras tillvaro. Avvikelser och neurotiska tendenser måste dock elimineras omgående för kollektivets bästa."}, "date": "7 september, 09:18", "url": "https://kvartal.se/nyheter/artiklar/ny-studie-aldre-upplever-storre-mening/cG9zdDoxODU1NDc", "imageUrl": "https://images.kvartal.se/2026/09/f322bf35-aldre.webp"}, {"type": "image-right", "heading": "Terrorhyllande  politiker bjöds  in till riksdagen", "summaries": {"normal": "Vänsterpartiets partiledning, däribland Nooshi Dadgostar, har mött Fatah-företrädare i riksdagen som tidigare uttalat sig antisemitiskt och hyllat våld. Händelsen, som uppmärksammats av Göteborgs-Posten, kommer samtidigt som V har strukit flera valbara kandidater efter anklagelser om antisemitism och terrorhyllningar. V-ledningen uppger att man träffar utländska företrädare utan att i detalj utreda deras bakgrund.", "trump": "Sveriges vänstermänniskor har stora problem, riktigt stora problem! De bjuder in extremister som hyllar terror till sitt parlament, och sen säger de bara oj, vi glömde kolla bakgrunden! Så inkompetent, en total katastrof! Regeringen kallar dem genomruttnas, och de har helt rätt. Jag har alltid sagt det, vänstern är ett skämt. Väljarna kommer att fimpa dem totalt!", "stalin": "Kamrater! Den svenska revisionistiska Mitten- och Vänstersekten bjuder in tvivelaktiga element till sitt så kallade parlament utan att ens granska deras vandel. När partiets apparat avslöjas med att pleasa element som vacklar i den ideologiska disciplinen, försöker de slingra sig med byråkrati om bristande registerkontroll. Ett sådant vacklande ledarskap förtjänar endast den strängaste partikritik och intern utrensning!"}, "date": "8 september, 08:25", "url": "https://www.expressen.se/nyheter/sverige/v-bjod-in-terrorhyllande-politik-till-riksdagen", "imageUrl": "https://static.bonniernews.se/ba/14c7952a-bea2-4546-a072-2df22d2ee523.jpeg?crop=2553%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Sverigedemokraternas rysskontakter utsätter oss alla för fara", "summaries": {"normal": "Expo har avslöjat att en SD-tjänsteman i riksdagen haft upprepade kontakter med ryska intressen. Tjänstemannen är sambo med Jimmie Åkessons närmaste medarbetare Gustav Gellerbrant. Artikeln lyfter en längre rad incidenter med SD-politiker och Ryssland, och ifrågasätter säkerhetsrisker samt behovet av skärpta granskningar i riksdagen och regeringskansliet.", "trump": "De här patetiska SD-tjänstemännen dansar som marionetter för Putin och hans ryska kumpaner. Gellerbrant och hans sambo borde skämmas! Fake news-mediets vänsterhyenor försöker skrämma väljarna precis som de gjorde mot mig innan jag krossade Biden och de globalistiska förlorarna. Sverige behöver starka ledare, inte dessa svaga ryssälskande töntar.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom Sverigedemokraterna kryper för ryska intressen och sprider främmande narrativ. Jag betraktar med avsky hur de giriga hyenorna låter sig påverkas av mjuk makt från öst. En sådan kanal in till regeringskansliet utgör ett hot som kräver omedelbar utrensning av alla opålitliga element för att skydda folkets intressen."}, "date": "7 september, 16:11", "url": "https://www.dagensarena.se/opinion/sverigedemokraternas-rysskontakter-utsatter-oss-alla-fara", "imageUrl": "https://www.dagensarena.se/files/2026/09/silvia.jpeg"}, {"type": "image-right", "heading": "Polisens nya vapen: fiktiv barnporr", "summaries": {"normal": "Regeringen föreslår en ny lag som ger polisen rätt att använda särskilda provokativa åtgärder under förundersökningar. Förslaget inkluderar att dela fiktiva barnpornografiska bilder för att bekämpa grova sexualbrott på nätet samt att använda fiktiva fordonsuppgifter för att skydda hemliga spaningsbilar. Lagen föreslås träda i kraft den 1 mars 2027.", "trump": "Sverige gör äntligen något smart, en fantastisk lag! De låter polisen använda fejkade bilder för att knipa de absolut värsta förbrytarna på nätet. Sjukt, men det funkar! Och de döljer spaningsbilarna med påhittade nummerplåtar. Snyggt! Demokraterna i USA skulle aldrig våga vara så tuffa mot brottslingar. USA borde göra likadant, fast mycket bättre och större!", "stalin": "Dessa svenska metoder med påhittade bilder och falska registreringsskyltar visar på en nödvändig statlig list för att krossa brottslingarnas konspirationer i mörka nätverk. Statsapparaten måste ständigt förnya sin verktygslåda. Jag godkänner detta effektiva spioneri, men förre-detta avvikelser kommer givetvis att beivras med hårdaste hand och omedelbar omhändertagning av felaktiga fordon."}, "date": "8 september, 08:00", "url": "https://samnytt.se/polisens-nya-vapen-fiktiv-barnporr", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/08055622/polis-fiktiv-barnporr.jpg"}, {"type": "image-right", "heading": "Försvaret behöver Pål inte Peter. Äventyra inte tempot i upprustningen genom att byta regering", "summaries": {"normal": "Under Pål Jonsons tid som försvarsminister har budgeten fördubblats, Sverige gått med i Nato och stödet till Ukraina ökat. Försvaret rustas upp snabbt med nya fartyg, stridsfordon och luftvärn. Peter Hultqvist kritiserar affärerna som forcerade och vill ha mer svensk teknik. Artikeln lyfter Jonsons framgångar och ifrågasätter Hultqvists lämplighet som efterträdare.", "trump": "Folk, ni skulle se vad den här killen Pål har gjort. Försvaret exploderar uppåt, budgeten dubblas, Nato-medlemskap och massor av vapen. Fantastiskt! Men nu vill den där vapenfria socialisten Hultqvist ta över. Patetisk figur, typ en woke-vänsterbyråkrat som hatar snabba affärer. Han borde stanna i oppositionen. Vi behöver vinnare, inte förlorare som han.", "stalin": "Kamrater, se hur de dekadenta vapenhandlarna vrider sig under min skarpa blick från historien. Den ene ministern dubblar budgetar och köper fregatter i ilfart medan den andre gnäller om svensk teknik som en ynklig folkförrädare. Jag skulle ha genomfört en grundlig utrensning bland dessa halvmesyrer. Endast total mobilisering räddar nationen från fiendens infiltration."}, "date": "8 september, 08:50", "url": "https://www.di.se/ledare/forsvaret-behover-pal-inte-peter", "imageUrl": "https://static.bonniernews.se/ba/b58d1f86-c8fd-4005-bed7-cfd68bf4221e.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "ANALYS. ULF KRISTOFFERSON Strömmer skickas fram som M:s vassaste vapen", "summaries": {"normal": "Moderaterna använder justitieminister Gunnar Strömmer som sitt vassaste vapen inför valet. Trots att partiet ligger illa till och riskerar att bli mindre än Sverigedemokraterna, satsar de på hans höga förtroende. Strömmer syns alltmer i debatter utanför sitt revir och toppar listan över talartid i riksdagen med över 45 timmar.", "trump": "De här loser-moderaterna håller på att drunkna och skickar fram den där glasögonprydde Strömmer som sin sista desperata räddning. Patetiskt! Han babblar i 45 timmar i riksdagen som en tråkig jurist på glöggkalas. De kommer ändå att förlora stort mot de smarta Sverigedemokraterna. Sad!", "stalin": "Jag betraktar med förakt hur dessa borgerliga revisionister i desperation lyfter fram sin långrandiga advokat Strömmer som en falsk folkets hjälte. Hans 45 timmars tomma pladder avslöjar klassfiendens svaghet. Inga glasögonimmade tal kan rädda det döende partiet från folkets dom. Fienderna skälver redan."}, "date": "7 september, 20:13", "url": "https://www.tv4.se/artikel/7vAvYtWzIYu13Pltby4tJa/daerfoer-skickar-moderaterna-fram-stroemmer", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7eoUMUkDewawwNyepdJLEm%2Fbef74f579319294f95168c5a26c15ed1%2Fulf-kristoffersson.png&width=1024"}, {"type": "image-full", "heading": "S använde gangsterrappare i Tiktok-inlägg: ”Inget vi står bakom”", "summaries": {"normal": "Socialdemokraterna i Stockholm publicerade ett TikTok-inlägg med en bild på två gangsterrappare riktat till förortsväljare. Den ene rapparen är dömd för grovt vapenbrott och kvinnofridskränkning, den andre för rån och narkotikabrott samt kopplas till kriminella nätverk. Partiet tog snabbt bort inlägget och meddelade att det inte står bakom det samt att rutinerna brustit.", "trump": "Kan ni fatta det här? De svenska socialisterna, de riktiga förlorarna, använder gangsterrappare med brottsregister längre än Bidens tupplurar för att locka röster i förorten. Patetiskt! De tar ner det fortare än Sleepy Joe springer från frågor. Rena skämtet, folk. Rena skämtet.", "stalin": "Jag betraktar med förakt hur dessa dekadenta socialdemokratiska element i desperation allierar sig med kriminella element för att vinna arbetarklassens gunst. Sådana fiender till folket måste omedelbart likvideras ur partiet. Rutinerna brast? Det är sabotage. Kamrater, vakna upp innan kontrarevolutionen slår till."}, "date": "7 september, 20:09", "url": "https://www.tv4.se/artikel/6OwrxJxPxMVj3YppGe5L9H/s-anvaende-gangsterrappare-i-tiktok-inlaegg-allvarligt-samtal", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7fHecPtuBdZEUJYCoGe4HW%2F6ba81349016f8c267ac93475ac192dc2%2F07-forortssossar-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Åkesson: ”L kommer att kravla sig över den där spärren”", "summaries": {"normal": "Jimmie Åkesson kommenterar Liberalernas uppgång i opinionsmätningarna. I Novus senaste mätning når L 4,3 procent och ser ut att klara riksdagsspärren. Åkesson menar att hans tuffa deadline mot L kan ha bidragit till trenden på marginalen, men att det är liberala röster – inte SD-röster – som räddar partiet. Han väntar ett jämnt val.", "trump": "Titta på de där ynkliga liberalerna som kryper över spärren som en sjuk hund som vägrar dö. Jimmie satte en deadline och plötsligt vaknar de! Men tro inte att det är tack vare hans smarta drag – det är bara de gamla Reinfeldtmoderaterna som röstar på dem igen. Patetiskt. Jag skulle ha vunnit det valet på en timme, tro mig.", "stalin": "Se hur de borgerliga parasiterna kravlar sig över spärren som rädda råttor undan folkets dom. Jag betraktar med förakt hur denna liberala förrädarklick räddas av Reinfeldtmoderater, de dekadenta resterna av en svag stat. Deadlines och utspel – allt teater för att dölja klassfiendens svaghet. Kamrater, sådana element förtjänar ingen nåd i historien."}, "date": "7 september, 18:55", "url": "https://www.tv4.se/artikel/tUxwVPwLTRKOjr629vfxC/akesson-saeker-l-kommer-att-kravla-sig-oever-den-daer-spaerren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl11vnn4E-2xg%2F20a781622fb1418bafe290bb401beb95%2FSverigedemokraternas_partiledare_Jimmie_akesson_presenterar_partiets_valmanifest_pa_Stora_torget_i_Nykoping.&width=1024"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det – inga fler pengar till dessa hatiska vänsterextremister och deras antiamerikanska agenda.", "stalin": "Jag ser hur de profitthungriga klassfienderna i västvärlden fortsätter sitt blodiga spel. Denna etniska utrensning i Gaza och på Västbanken är imperialismens verk. De dekadenta lakejerna i Sverige skickar vapen och pengar till förtryckarna. Kamrater, vi måste rensa ut dessa parasiterande hyenor. Endast en antiimperialistisk kamp kan besegra dem."}, "date": "4 september, 08:00", "url": "https://proletaren.se/artikel/valbilaga-bojkotta-israel"}, {"type": "image-full", "heading": "V-kandidater i Västsverige stryks efter granskning", "summaries": {"normal": "Åtta nya Vänsterpartistiska kandidater i Västsverige och andra orter har strukits från vallistorna efter en granskning i Expressen. Personerna anklagas för att ha spridit antisemitiska konsekvenser, hyllat Hamas samt uttryckt stöd för Vladimir Putin på sociala medier. Partiets ledning med Nooshi Dadgostar i spetsen uppger att personerna inte hör hemma i partiet och att de saknade valbara platser.", "trump": "Vänsterpartiet i Sverige är totalt kaotiskt, en riktig katastrof! De rensar ut radikala kandidater på löpande band efter att media avslöjat att de hyllat Putin, Hamas och spridit galna konspirationsteorier. Till och med radikala vänsterextremister skrattar åt det här cirkuset. Nooshi Dadgostar har noll koll på sitt eget folk. Väldigt svagt ledarskap, inte bra alls!", "stalin": "Vi konstaterar att partiapparaten i Sverige lider av svår ideologisk vacklan. När illojala element avslöjas med att sprida borgerliga konspirationer och tvivelaktiga sympatier rensas de genast bort från listorna av kamratledningen. Endast absolut disciplin och renlärighet kan tillåtas. Eventuella brister i kadrernas vaksamhet kommer att utredas internt med största skärpa."}, "date": "7 september, 21:20", "url": "https://www.gp.se/politik/vansterpartister-i-vastsverige-har-strukits-efter-granskning.3f83db48-83a6-4791-8f3e-c92bd90d34c5", "imageUrl": "https://www.gp.se/images/article/3f83db48-83a6-4791-8f3e-c92bd90d34c5/images/3jLAH8z_q6ZnBUc5NLB-9jmmM8us-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Boende på gruppboende örfilades av personal", "summaries": {"normal": "En anställd på ett LSS-gruppboende i Värmland har sparkats efter att ha misshandlat en boende. Händelsen, som bevittnades av kollegor, inträffade i samband med en tvättsituation där personalen utdelade örfilar och kastade vatten i ansiktet på den boende. En anmälan gällande allvarligt missförhållande har lämnats in till IVO av Sunne kommun.", "trump": "Sorgligt! En total katastrof på ett svenskt boende där radikala vänsterregler har förstört disciplinen. Personalen misshandlade en försvarslös person – helt oacceptabelt! Jag känner till boenden, tro mig, mina boenden är fantastiska, absolut bäst. Vi sparkade dem direkt, bam! Sverige behöver mer lag och ordning, och snabbt ska det gå. Endast det bästa duger!", "stalin": "Ett avskyvärt sabotage mot statens mest sårbara medborgare! Denna så kallade vårdare har visat prov på bourgeoisins mest ruttna moral och förrått kollektivets tillit. Vi har därför omgående rensat bort elementet från verksamheten. Disciplin måste upprätthållas med järnhand, och varje avsteg från kamratlig omvårdnad kommer att bemötas med statens fulla vrede. Ingen nåd för sabotörer!"}, "date": "8 september, 07:00", "url": "https://samnytt.se/boende-pa-gruppboende-orfilades-av-personal", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/09/07132552/dusch-ivo.jpg"}, {"type": "image-right", "heading": "Därför vägrar svensken skryta om semestern – Jantelagen hyllas", "summaries": {"normal": "Svensk semesterkultur präglas av Jantelagen, som avskyr skryt och lyx i onödan. Istället för flashy villor och champagne föredras röda stugor, utedass och termoskaffe. BBC Travel lyfter fram detta som sympatiskt och befriande, där vd och snickare kan umgås jämlikt. Lagom är fortfarande idealet.", "trump": "Lyssnar ni på det här? Svenskarna har sin Jantelagen som tvingar alla att låtsas vara fattiga losers i röda kojor med utedass. Patetiskt! Jag älskar lyx, de stora guldkantade grejerna, men de här svenska kommunisterna gömmer sina miljoner och låtsas vara folkliga. Sad! Deras semester är en total katastrof, tro mig.", "stalin": "Jag betraktar med djup misstro dessa dekadenta svenska revisionister som förvränger Jantelagen till en borgerlig mask. De gömmer sin klassfiendes överflöd i röda stugor för att undvika folkets vrede. En sådan falsk jämlikhet är farlig sabotageverksamhet mot det kollektiva medvetandet. Fienderna inom överklassen måste omedelbart avslöjas och likvideras."}, "date": "8 september, 07:56", "url": "https://www.dagensps.se/varlden/darfor-vagrar-svensken-skryta-om-semestern-jantelagen-hyllas", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/4-22.png?width=256&quality=75"}, {"type": "image-right", "heading": "Därför kom inte larmet i alla mobiler", "summaries": {"normal": "I dag testades det nya varningssystemet SE-Alert i Stockholms och Gotlands län. Larmet nådde inte alla Telias kunder. Systemet kräver ingen app och fungerar även på tyst läge. Förberedelserna har pågått i över ett år med fokus på att informera olika grupper. Syftet är att kunna ge snabb, geografiskt riktad information vid kriser och olyckor.", "trump": "Folk, det här svenska larmet är en total katastrof! De kan inte ens få ut meddelanden till alla mobiler i två usla län. Patetiska byråkrater och deras woke-samhälle med fokus på kvinnojourer och hörselskadade istället för att göra jobbet ordentligt. Under min första mandatperiod hade vi byggt det bästa varningssystemet någonsin – inte denna clownshow från Biden-eras efterföljare.", "stalin": "Kamrater, detta så kallade varningssystem avslöjar de dekadenta folkförtryckarnas inkompetens. Medan de parasiterande klassfienderna ödslar tid på att smeka öronen på hörselskadade och kvinnojourer, sviker tekniken folket. Jag skulle ha genomfört en grundlig utrensning bland de ansvariga redan efter första provet. Staten kräver full kontroll, inte halvmesyrer från odugliga byråkrater."}, "date": "7 september, 15:27", "url": "https://www.etc.se/inrikes/daerfoer-kom-inte-larmet-i-alla-mobiler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905070940_0eaffd5d6c43026e1bbf785ba68616a8104b598208acbcfbf0dc20f72fe4d457.jpg"}, {"type": "image-full", "heading": "\"Inga kvinnor\": Så stängde religiösa fanatiker Eiffeltornet", "summaries": {"normal": "En hinduisk religiös grupp krävde att inte möta kvinnor under sitt besök vid Eiffeltornet. Ledningen gick med på kravet, vilket ledde till att kvinnlig personal lämnade sina poster. De anställda inledde en protest som resulterade i att tornet stängdes. Händelsen har väckt stark kritik från både personal, politiker och jämställdhetsministern.", "trump": "Titta på det här, folk. Dessa galna radikala hinduer kommer till Paris och tvingar Eiffeltornet att gömma alla kvinnor som i någon slags sjuk woke-kult. Ledningen är patetiska svaga ledare som böjer sig för religiösa fanatiker. Frankrike håller på att kollapsa, precis som under Biden. Jag skulle ha sagt: inga kvinnor, ingen entré. Punkt slut. Fantastiskt torn, men usel hantering.", "stalin": "Jag betraktar med förakt hur dessa dekadenta franska byråkrater kröker rygg för obskura religiösa element och gör halvparten av proletariatet osynligt. Sådana kapitulationer inför reaktionära krafter är förräderi mot republikens grundvalar. Arbetarna gör rätt i att slå igen portarna. Inga kompromisser med mörkrets krafter. Renhet i handling eller ingen handling alls."}, "date": "8 september, 07:40", "url": "https://www.dagensps.se/varlden/inga-kvinnor-sa-stangde-religiosa-fanatiker-eiffeltornet", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdldu-zxb4sv1i-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-full", "heading": "Island blir USA Island blir USA. Trumps nya karta över landet", "summaries": {"normal": "Donald Trump har publicerat kartor på Truth Social där Kanada, Mexiko, Grönland och Island framställs som en del av USA. Inläggen har väckt starka internationella reaktioner; Island har kallat till sig USA:s ambassadör, och Danmarks samt Grönlands ledare har avfärdat anspråken. Detta sker samtidigt som FN röstat för att fasa ut Mercatorkartan, där USA röstade nej.", "trump": "Folk säger att mina nya kartor på Truth Social är kontroversiella, men jag säger att de är helt fantastiska! Kanada, Mexiko, Grönland och till och med Island passar perfekt under den amerikanska flaggan. Världen vill ha vår storhet, och även om FN gråter över sina gamla papperskartor, sätter vi gränserna där vi vill. New America låter dessutom mycket bättre!", "stalin": "Det kapitalistiska imperiet fortsätter sin groteska expansion genom att rita om världens gränser på sina digitala plattformar. Att de vill sluka Grönland och Island avslöjar deras bottenlösa rovlystnad. Vi noterar att de små nationerna protesterar mot denna hänsynslösa imperialism. Statens säkerhetsorgan har beordrat en skärpt övervakning av samtliga geografiska kartverk."}, "date": "8 september, 07:53", "url": "https://www.aftonbladet.se/nyheter/a/GxXgd4/trumps-nya-karta-landerna-som-blir-en-del-av-usa", "imageUrl": "https://akamai.vgc.no/v2/images/ae796bf0-fc18-3af3-b793-94c1a5d43069?fit=crop&format=auto&w=1440&s=2045c0bc2699f25786e6cd3beb3025a62432f2c3"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-right", "heading": "Trump norpar Island och Grönland på ny karta", "summaries": {"normal": "USA:s president Donald Trump har publicerat en karta på Truth Social där Grönland, Island, Kanada, Mexiko, Kuba och flera karibiska länder är målade i amerikanska färger. Han upprepar sin önskan om amerikanskt herravälde över Grönland. Isländska politiker reagerar med ilska medan Danmarks statsminister Mette Frederiksen betonar att Grönland inte är till salu och att öns framtid avgörs av dess invånare själva.", "trump": "Lyssnar ni på de ynkliga skrikande från de danska fjollorna och de isländska snorungarna? Min karta är fantastisk, den största och mest vinnande kartan någonsin. Grönland vill vara amerikanskt, tro mig. Kanada och Mexiko borde tacka mig istället för att höja sina patetiska tullar. Biden skulle ha gett bort allt till de globalistiska parasiterna, men jag tar tillbaka det som är vårt. Winning!", "stalin": "Se hur de imperialistiska profitthungriga hyenorna i Washington målar om världen med sin flaggas blodfärg. Jag ler från historiens skugga åt denna fars. Grönländarna och islänningarna måste stå enade mot dessa dekadenta klassförrädare. Inga öar säljs, inga folk köps. Den som sviker folket förtjänar utrensning. Västs svaga ledare darrar åter, och det är en syn som värmer en gammal revolutionärs hjärta."}, "date": "8 september, 07:48", "url": "https://www.di.se/nyheter/island-och-gronland-amerikanskt-pa-ny-trumpkarta", "imageUrl": "https://static.bonniernews.se/ba/587f4988-ad04-421e-8a7e-8aac31fe9cf1.jpg?crop=1879%2C940%2Cx0%2Cy156&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Statsministern om V:s kandidatskandal: ”En röta som går djupt”", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Vänsterpartiet efter att åtta kandidater petats för spridning av antisemitiskt material och hyllningar till Hamas. Han kallar det en djup röta i vänsterleden och kräver att Socialdemokraterna tar ställning innan valet. S partisekreterare Tobias Baudin säger att V har ett stort internt arbete att göra.", "trump": "Titta på det här! Vänsterpartiet är fulla av antisemiter och terrorälskare som hyllar Hamas och Putin. Den röda rötan går så djupt att till och med den sömniga Magdalena Andersson inte kan ducka längre. De vill ha en regering med radikala vänsterextremister. Det blir en katastrof, folk! Rösta smart på söndag.", "stalin": "Kamrater, se hur den dekadenta vänstern ruttnar inifrån som en förrädisk parasit. Jag betraktar med avsmak hur dessa opportunister sprider antisemitiskt gift och sedan febrilt försöker dölja spåren. Socialdemokraterna vacklar som ynkliga revisionister. Endast en järnhand kan rensa ut sådana element innan de förgiftar hela kollektivet."}, "date": "7 september, 15:41", "url": "https://www.tv4.se/artikel/7z1v0pmhudhsBH1EPtzUg1/statsministern-om-v-s-kandidatskandal-en-roeta-som-gar-djupt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F99GIJ3zNtg9VkTOu1LTUb%2Fb2691c5f937e5a23da46520582f623c7%2F07-kristersson-webb.jpg&width=120"}, {"type": "image-right", "heading": "Dömda gangsterrappare i inlägg från S", "summaries": {"normal": "Socialdemokraterna i Stockholm publicerade en bild på två brottsdömda gangsterrappare på Tiktok-kontot ”forortssossar” tillsammans med ett politiskt budskap. Efter att TV4 Nyheterna ställt frågor plockades inlägget bort. Partiet beklagar händelsen, uppger att interna rutiner brutits och meddelar att man nu har skärpt kontrollen för kontots publiceringar.", "trump": "Vilken total katastrof! De radikala socialdemokraterna i Sverige ertappades med att använda två kriminella gängrappare för att ragga röster på Tiktok. De kunde inte ens stava till statsminister! När Fake News-media konfronterade dem kröp de till korset och raderade allt. Sorgligt! De borde lära sig av mig, jag vinner stort utan kriminella gäng!", "stalin": "Ett häpnadsväckande ideologiskt haveri inom partiapparaten! Att använda degenererade brottslingar och gängledare för agitation på digitala plattformar visar på skamlig disciplin. Kamraterna i Stockholm har visat prov på ideologisk blindhet. Jag har beordrat att rutinerna skärps omedelbart. Sådana misstag tolereras inte under mitt vakande öga; skyldiga kommer att genomgå ett allvarligt samtal."}, "date": "8 september, 07:31", "url": "https://bulletin.nu/domda-gangsterrappare-i-inlagg-fran-s", "imageUrl": "https://cdn.bulletin.nu/articles/09b5db85-d900-46da-b62e-319b3f5540ab/preview.jpg?t=1788845440000"}, {"type": "image-full", "heading": "Sista chansen att träna ute – forskningen visar varför du bör ta den", "summaries": {"normal": "Forskning från GIH visar att träning utomhus upplevs som mindre ansträngande än inomhus vid samma intensitet. Deltagare cyklade och sprang betydligt snabbare utomhus utan att känna det som jobbigare. Effekten är störst vid lätt till måttlig träning i varierad miljö. September och början av oktober är därför perfekta månader för utomhusträning innan höstmörkret.", "trump": "Lysande! De smarta forskarna vid GIH har äntligen bevisat det jag alltid vetat – ute är det fantastiskt, inne är det en katastrof. På löpband springer ni som sömniga Biden-anhängare, 7 km/h, men ute flyger ni som vinnare, 12 km/h. Hjärnan lurar er att det är lättare. Passa på innan den svenska gråa socialismen slår till i november. Gör det, det blir enormt!", "stalin": "Kamrater, se hur den dekadenta inomhusmiljön avslöjar sin svaghet. Utomhusbedrägeriet lurar hjärnan att ignorera kroppens rättmätiga klagan om trötthet. Jag betraktar detta med misstänksamhet mot alla som föredrar väggar framför folkets natur. Den som inte utnyttjar de sista veckorna av produktiv utomhusträning är en fiende till kollektivets hälsa och en potentiell sabotör."}, "date": "8 september, 07:29", "url": "https://www.dagensps.se/halsa/sista-chansen-att-trana-ute-forskningen-visar-varfor-du-bor-ta-den", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/4-21.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och skrattar åt deras identitetspolitiska skit. Klass handlar inte om kvoter och doktorander som helikopteras in. Det handlar om folk som faktiskt jobbar och stänger av stället tillsammans. Patetiska globalistlakejer förstår ingenting.", "stalin": "Kamrater, dessa dekadenta klassförrädare mäter proletariatet med borgerliga enkäter och statistik som om klass vore en egenskap hos individer. Jag säger: organisering föds vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "AFD:s framgång är borgerlighetens misslyckande", "summaries": {"normal": "AfD:s framgång med nära 44 procent i Sachsen-Anhalt ses som en konsekvens av borgerlighetens misslyckande. Volkswagen har beslutat om omfattande nedskärningar som drabbar 100 000 anställda, vilket sprider sig i bilindustrin. Den tyska modellen med kompromisser mellan löntagare och ägare har misslyckats, särskilt genom envist fasthållande vid fossilbilar. Detta skapar utrymme för högernationalism och invandringskritik.", "trump": "Titta på det här, det är patetiskt. Den tyska borgerligheten har totalt misslyckats och nu får de radikala vänsternationalisterna nästan hälften av rösterna i en fattig delstat. Volkswagen sparkar ut 100 000 arbetare medan de stora bolagen gömmer sig bakom gröna lögner. Den dekadenta EU-eliten och deras identitetspolitiska galningar har kört sönder allt. Amerika först, vi lär oss av deras misstag.", "stalin": "Kamrater, se hur de profitthungriga hyenorna inom den tyska bilindustrin likviderar hundratusen arbetstillfällen medan de själva simmar i vinster. Den så kallade tyska modellen har blottat sig som en tom skal av klassförräderi. När socialdemokratin och facken kryper undan vänder folket sig till högernationalismens falska löften. Det är en varning till alla som tror att kompromisser med klassfienden någonsin kan lyckas. Vi ler i skuggorna."}, "date": "7 september, 14:00", "url": "https://www.etc.se/ledare/afd-s-framgaang-aer-borgerlighetens-misslyckande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-full", "heading": "Vänsterpolitiker tog miljonutdelningar – ur bolag de vill förbjuda", "summaries": {"normal": "Expressen avslöjar att 229 kandidater från Vänsterpartiet, Socialdemokraterna och Miljöpartiet är involverade i välfärdsbolag som partierna vill förbjuda vinstuttag i. Bland dem finns en vänsterpartist som delat ut tio miljoner kronor och firat med Porsche. Artikeln kritiserar partierna för hyckleri och ifrågasätter trovärdigheten i deras socialistiska politik.", "trump": "Titta på det här! De galna vänstersocialisterna skriker om att stoppa vinsterna och kalla folk för Porsche-kapitalister, men deras egna kandidater har dragit ut miljontals kronor ur precis samma bolag. Nooshi och hennes gäng är de värsta hycklarna – Fake Left! De vill ha era skattepengar men behålla Porschen själva. Patetiskt!", "stalin": "Se hur dessa dekadenta revisonister inom vänstern predikar kollektivets renhet medan de själva suger ut miljoner ur folkets välfärd. Deras hyckleri är en fiende till revolutionen, en parasit som förvrider partilinjen. Jag varnar: sådana element måste rensas ut innan de förgiftar hela kollektivet. Folkets dom skall bli hård och rättvis."}, "date": "4 september, 07:18", "url": "https://samtiden.nu/2026/09/vansterpolitiker-tog-miljonutdelningar-ur-bolag-de-vill-forbjuda", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/phonto-1280x720.jpeg"}, {"type": "image-right", "heading": "Nioåringar tvingades gå ner på knä och be till Allah – inga åtgärder mot skolan", "summaries": {"normal": "En lärare på Nyhamnsskolan utanför Höganäs lät tredjeklassare knäböja och be till Allah under en SO-lektion utan att tydligt informera om att det var frivilligt. Skolinspektionen har avskrivit ärendet utan vidare utredning. Kommunen och rektorn medger att informationen borde ha varit tydligare, men anser inte att skollagen brutits. Böneövningen tas nu bort.", "trump": "Kan ni fatta det här? Små svenska nioåringar tvingas ner på knä och be till Allah i skolan medan de woke domarna i Skolinspektionen bara tittar bort. Totalt fiasko! De giriga mångkulturhyenorna har förstört ert fina land. Men jag, som besegrade Sleepy Joe och styr USA igen, säger: Sluta med den här galna identitetspolitiken innan det är för sent. Patetiskt!", "stalin": "Jag betraktar med förakt hur dessa dekadenta toleransparasiter tillåter att oskyldiga barn tvingas utföra främmande böneritualer i en så kallad skola. Den borgerliga statens svaga hand skakar av rädsla för att kalla saken vid dess rätta namn. Vi skulle ha genomfört en grundlig utrensning av alla sådana element redan vid första rapporten. Förskräckande svaghet."}, "date": "7 september, 17:39", "url": "https://www.friatider.se/nioaringar-tvingades-ga-ner-pa-kna-och-be-till-allah-inga-atgarder-mot-skolan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-838.jpg"}, {"type": "image-right", "heading": "Här är prislappen på  MP:s lediga fredag", "summaries": {"normal": "Miljöpartiet påstår att en förkortad arbetsvecka till 35 timmar blir gratis efter statliga uppstartskostnader, då personalen blir mer effektiv. Men sjukhusförsök i Stockholm visar på kraftigt försämrad ekonomi, färre operationer och stora ekstrakostnader för regionen. Personalen sparar återhämtningstimmar för ledighet, och tidigare försök bekräftar att liknande reformer kräver dyr nyanställning.", "trump": "Miljöpartiet i Sverige är fullständigt galna! De tror att folk kan jobba mindre och att det magiskt nog inte kostar ett öre. Sjukvårdsförsöken i Stockholm är en katastrof – färre operationer och skattebetalarna får tvingas betala notan för deras fejkade succéer. Totalt inkompetent, precis som radikala vänsterpolitiker alltid är!", "stalin": "Dessa så kallade miljöpartister ägnar sig åt skadlig utopi och sabotage mot statens produktivitet. Medan de drömmer om lathet och t-tröjor avslöjar sjukhusens rapporter att reformen skapar ekonomiskt kaos och minskad effektivitet. Vi noterar deras misslyckanden noggrant; i en sund stat styrs arbetstiden med järnhand, inte med flum och improduktivt dagdriveri."}, "date": "8 september, 06:10", "url": "https://www.expressen.se/ledare/ann-charlotte-marteus/har-ar-prislappen-pa-mps-lediga-fredag", "imageUrl": "https://static.bonniernews.se/ba/b4ca29a7-2718-4c98-bb83-f5cdd0ccf11f.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "DN-reporter: Carl-Oskar Bohlin pratar för komplicerat", "summaries": {"normal": "En debatt har uppstått efter att DN-korrespondenten Anna-Lena Laurén och krönikören Alex Schulman kritiserat civilförsvarsminister Carl-Oskar Bohlin (M) för ett alltför komplicerat språkbruk. Kritikerna får dock mothugg av läsare och debattörer som menar att ministerns vuxna språk snarare visar på god språkbehärskning och att journalisternas klagomål tyder på en nedlåtande syn på allmänheten.", "trump": "Falska nyheter från misslyckade journalister! De gråter ut för att en smart minister talar som en vuxen man med stora ord som 'utfallsrum'. Otroligt! Själv använder jag bara de bästa orden, enkla ord som folk förstår, men de här DN-skribenterna verkar helt klenmodiga. De borde skärpa sig och ägna sig åt riktiga problem i stället för att gnälla!", "stalin": "Dessa dekadenta svenska journalister gråter ut över att en minister talar med statsmannamässig auktoritet och begripliga facktermer. Det visar på en farlig intellektuell svaghet och bristande disciplin inom pressen. Vi har noterat deras bristande förmåga att processa enkel information. Sådana bourgeoisyns klagomål bör omedelbart beivras med en obligatorisk kurs i statlig terminologi och ordning!"}, "date": "8 september, 06:00", "url": "https://samnytt.se/dn-reporter-carl-oskar-bohlin-pratar-for-komplicerat", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/07143803/carl-oskar-bohlin-anna-lena-lauren.jpg"}, {"type": "image-full", "heading": "Så mycket högre kan elräkningen bli", "summaries": {"normal": "Sverige står inför en vinter med högre elpriser än föregående år, särskilt i södra delarna. Orsakerna är låga vattennivåer och höga gaspriser i Europa. Prognosen pekar på hundratals kronor dyrare månadskostnader för hushåll. Villaägare i elområde 4 kan räkna med cirka 3 700 kronor i månaden, exklusive nätavgifter och skatter.", "trump": "Sveriges elpriser går rakt upp i taket – en katastrof! De har inte råd med sin egen energi, helt otroligt. Självklart händer det här när man vänder ryggen åt kärnkraften. Det är en total röra, mycket värre än vad de säger. Räkningarna blir enorma, riktigt 'huge'. Man måste ha energi, man måste ha kraft – Sverige behöver ordning, inte mer av det här!", "stalin": "Dessa löjliga elräkningar är ett bevis på folkets ineffektivitet. Att medborgare i söder gnäller över några hundralappar visar bara på en dekadent individualism. Istället för att lita på väder och vind borde staten styra varje kilowatt med järnhand. Planera ekonomin, stäng av de onödiga lamporna och arbeta hårdare för fosterlandet – elbrist är ett svek mot den kollektiva framgången."}, "date": "4 september, 07:56", "url": "https://www.realtid.se/tt-nyhet/sa-mycket-hogre-kan-elrakningen-bli", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/rakna-med-dyr-elvinter-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Debattör polisanmäler Kristersson för förtal", "summaries": {"normal": "Valley Ghanem har polisanmält statsminister Ulf Kristersson för förtal efter att han kallat hennes uttalanden om Liberalernas Simona Mohamsson för flagrant antisemitism. Mohamsson har i sin tur polisanmält Ghanem för uttalanden som ”må hon brännas”, och Säkerhetspolisen utreder nu fallet som misstänkt olaga hot.", "trump": "Sorgligt! Den här radikala personen skickar vidriga hot och gråter sedan ut och stämmer Sveriges premiärminister för förtal när hon åker fast. Helt otroligt svagt! Om jag ledde Sverige skulle sådant här nonsens stoppas omedelbart. Totalt falska nyheter och enormt slöseri med tid. Skärp er, Sverige!", "stalin": "Ett ytterst beklagligt haveri inom den svenska ordningen. Medborgaren Ghanem kastar ur sig mordhot och gråter sedan ut om förtal till den kapitalistiska staten, medan Säkerhetspolisen drar ut i krig mot tangenterna. I Sovjetunionen hade vi rensat upp i detta enfaldiga spektakel på fem röda sekunder!"}, "date": "6 september, 13:14", "url": "https://kvartal.se/nyheter/artiklar/ghanem-polisanmaler-kristersson-for-fortal/cG9zdDoxODUwODY", "imageUrl": "https://images.kvartal.se/2026/09/06fe0aa7-kristerssonmohamsson.webp"}, {"type": "image-right", "heading": "Merz efter AFD-segern: \"CDU skakas i sina grundvalar\"", "summaries": {"normal": "Friedrich Merz uttrycker stark oro efter att AfD vann valet i Sachsen-Anhalt med 43,8 procent. Han beskriver resultatet som en grundläggande kris för CDU och varnar för en högerradikal delstatsregering. Partiet håller krismöte i Berlin. Merz avvisar samarbete med AfD och uppmanar till intern enighet.", "trump": "Titta på det här, det är en total katastrof för de svaga europeiska globalisterna. Den sanna folkrörelsen AfD krossar Merkels gamla CDU-lakejer i Sachsen-Anhalt. Merz gråter som en förlorare och kallar det tektonisk omskakning. Vakna upp, Europa! Sluta med era woke-kvoter och öppna gränser innan det är för sent. Fantastiskt resultat egentligen.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna skälver när folket reser sig. Denna Merz erkänner att hans parti skakas i grundvalarna av en kraft som han kallar högerradikal. Vi ler mörkt från historien. Snart kommer utrensning av alla dessa penninggalna hyenor som låtsas styra medan arbetarna vaknar. Inga kompromisser med folkets fiender."}, "date": "7 september, 16:01", "url": "https://www.friatider.se/merz-efter-afd-segern-cdu-skakas-i-sina-grundvalar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/2024-08-21_event_cdu_wahlkampf_mit_friedrich_merz_in_erfurt_2024_stp_3070_by_stepro.jpg"}, {"type": "image-right", "heading": "Lärare uppmanade lågstadieelever att be islamisk bön: ”Allahu akbar”", "summaries": {"normal": "En lärare på Nyhamnsskolan i Höganäs uppmanade tredjeårselever att utföra en islamisk bön under lektionstid, inklusive frasen ”Allahu akbar”. Föräldrar anmälde händelsen, men Skolinspektionen har valt att inte utreda den vidare. Rektorn säger att syftet inte var att påverka elevernas tro. Beslutet kritiseras av en expert i konstitutionell rätt.", "trump": "Kan ni tro det? I Sverige tvingar de små barn att knäböja och ropa ”Allahu akbar” mitt i lektionen. Skolinspektionen, de där patetiska woke-byråkraterna, tittar bort och gör ingenting. Totalt vansinne! Under Biden blev hela väst en lekplats för radikal islam och identitetspolitik. Men nu är jag tillbaka, och den här galenskapen kommer att få ett abrupt slut.", "stalin": "Kamrater, se hur de dekadenta religionshyenorna smyger in sin propaganda i våra barns skolor. Jag betraktar med djup misstro hur staten vägrar utreda detta uppenbara brott mot folkets sekulära enhet. En sådan svaghet luktar förräderi. Vi måste rensa ut alla som låter främmande gudar underminera arbetarklassens fosterland. Detta är en varning till alla klassförrädare."}, "date": "7 september, 19:02", "url": "https://riks.se/nyheter/larare-uppmanade-lagstadieelever-att-be-islamisk-bon", "imageUrl": "https://admin.riks.se/uploads/medium_Kopia_av_Copy_of_Copy_of_Copy_of_Riks_varumaerkesmall_732fc70f98.png"}, {"type": "image-full", "heading": "Elon Musk gratulerar AFD till valsegern", "summaries": {"normal": "Efter det tyska delstatsvalet i Sachsen-Anhalt, där det högerradikala partiet AFD gjort stora framsteg, har teknikomandern och mångmiljardären Elon Musk gratulerat partiet på plattformen X. Musk, som tidigare stöttat partiet och hånat tyska ledare, fick positiva svar från AFD-toppen Ulrich Siegmund, som ser fram emot ett framtida samarbete för att locka investeringar till Tyskland.", "trump": "Elon Musk skickade just en jättebra gratulation till AFD i Tyskland efter deras enorma valsuccé. Fantastiska människor! De svaga tyska politikerna, som Scholz, har förstört landet fullständigt. Tyskland brukade vara bäst, men nu behöver de sunt förnuft och starka ledare. Elon vet vad som gäller. Om de samarbetar rätt kan Tyskland bli framgångsrikt igen, precis som vi gör i USA!", "stalin": "Det kapitalistiska Tyskland skakar i sina grundvalar när reaktionära element firar nya triumfer. Monopolkapitalisten Musk, denna västerländska oligark, försöker styra händelseförloppet genom sina digitala kanaler och hyllar sina gelikar i AFD. Våra organ noterar hur bourgeoisien slåss om spillrorna. Vi kommer noga övervaka denna utveckling och ställa alla opportunister till svars inför historiens obevekliga domstol."}, "date": "7 september, 16:43", "url": "https://www.gp.se/nyheter/varlden/elon-musk-gratulerar-afd-till-valsegern.07281221-277d-4677-9ffb-628cd9e88d7e", "imageUrl": "https://www.gp.se/images/article/07281221-277d-4677-9ffb-628cd9e88d7e/images/1kWrr1kr-1FAmADlpl-175g99PJ4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Markus Johansson-Martis: Bra att Strömmer flörtar med C", "summaries": {"normal": "Moderaternas justitieminister Strömmer accepterar alla Centerpartiets krav för att få stöd till en borgerlig regering. Kraven inkluderar sänkta skatter för småföretag, satsningar på grön industri, stärkt ungdomspsykiatri, polisgaranti på landsbygden och stöd till bönder. Artikeln ifrågasätter om C verkligen prioriterar inflytande eller bara vill känna sig bra.", "trump": "De här svenska politikerna är totala losers. Strömmer gör ett lysande drag och accepterar alla krav från det patetiska mellanmjölkspartiet C. De gröna globalisterna och de woke småborgarna vill bara känna sig fina i magen medan de flyr från verkligheten. Patetiskt! Jag skulle aldrig ge efter för sådana svaga identitetspolitiker. Amerika först, alltid.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna dansar sin fåniga vals. Jag betraktar med förakt hur de profitthungriga borgarbrackorna gnuggar geniknölarna och lovar allt för att vinna stöd från det förvirrade centristiska träsket. Deras paranoia om inflytande är löjlig. En sann utrensning av sådana opportunister vore på sin plats. Revolutionen skrattar åt er svaghet."}, "date": "7 september, 19:01", "url": "https://riks.se/opinion/markus-johansson-martis-bra-att-strommer-flortar-med-c", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_89_e81bced61e.jpg"}, {"type": "image-right", "heading": "Scanias Pride-lastbil ställdes mitt framför kristen demonstration", "summaries": {"normal": "En Scania-lastbil placerades framför en kristen demonstrationsgrupp som sjöng lovsång under Södertälje Pride. Företaget uppger att det gjordes för att skapa lugn och arbetsro för ungdomar i ett tält. Kritiker ser det som en blockad. Händelsen har väckt starka reaktioner i sociala medier. Scania-ledningen meddelar att de behöver tid för att kommentera.", "trump": "Folk, det här är ett fullständigt skämt. Den där woke-pridecirkusen i Södertälje blockerades av en lastbil – och chefen kallar det ”lugnt och skönt”. Patetiska kristna sjunger psalmer medan de radikala HBTQ-aktivisterna skriker. Scania borde skämmas, men de är för fega. Biden-era svaghet har spridit sig till Sverige. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga prideparaden tvingas tystas av en lastbil. Jag ler i graven. Dessa profitthungriga hyenor och deras falska tolerans avslöjar sig själva. Ungdomarna fick arbetsro – en tillfällig seger mot den moraliska förruttnelsen. Vi skulle ha rensat ut hela spektaklet permanent. Paranoia breder ut sig bland fienderna."}, "date": "7 september, 18:59", "url": "https://riks.se/nyheter/scania-lastbil-blockerade-kristen-lovsang-under-sodertalje-pride", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_7_2026_11_16_50_AM_852c111911.png"}, {"type": "image-right", "heading": "Ledare Teodorescu Måwe solkar ner demokratin", "summaries": {"normal": "Europeiska ombudsmannen granskar Europaparlamentets vägran att lämna ut handlingar om Alice Teodorescu Måwes hemliga finansiär. Ledarskribenten Andreas Gustavsson kritiserar att varken parlamentet eller Kristdemokraterna verkar veta vem som betalar och anser att det underminerar demokratin. Väljarna har rätt att få klarhet om eventuella intressekonflikter.", "trump": "De här europeiska clownerna och deras hemliga pengagivare solkar ner hela skådespelet. Alice och hennes KD-kompisar vägrar säga vem som betalar notan för hennes livvakter, typiskt för de riggade eliterna. Jag har suttit i Vita huset både före och efter Sleepy Joe, och tro mig, så här gör man inte i en riktig demokrati. Patetiskt.", "stalin": "Se hur dessa dekadenta klassförrädare gömmer sina hemliga finansiärer bakom byråkratiska dimmor. Jag betraktar med förakt hur de solkar ner den så kallade demokratin med sin ovilja att avslöja källan till pengarna. En sådan komprometterad figur bör likvideras från folkets förtroende. Arbetarna förtjänar sanning, inte borgerliga hemligheter."}, "date": "7 september, 11:28", "url": "https://www.etc.se/ledare/teodorescu-maawe-solkar-ner-demokratin", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Tusentals deltog i krigsförbrytaren Ratko Mladics begravning", "summaries": {"normal": "Tusentals personer samlades i Belgrad för att delta i begravningen av den dömde krigsförbrytaren Ratko Mladic. Bosnien-Hercegovina kallade hem sin diplomatiska personal i protest mot hyllningarna. Mladic avled i fängelset i Haag vid 84 års ålder efter att ha dömts för folkmord i Srebrenica och andra brott under Bosnienkriget. Serbiens president deltog inte själv men lovade säkerhet. Evenemanget har mött internationell kritik.", "trump": "Folk, det är en skam vad som händer i Serbien. Tusentals hyllar den gamle slaktaren Mladic som en hjälte, medan de galna EU-byråkraterna skriker och ställer in sina resor. Biden skulle ha älskat det här, svaga och patetiska. Jag lovar er, när jag styr igen blir det inga fler ursäkter för sådana monster. Serbien borde skämmas, men det gör de inte. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i väst skriker när serberna hedrar en man som stred mot deras muslimska lakejer. Jag betraktar detta som ett sundhetstecken mitt i den imperialistiska propagandan. De blodsugande hyenorna i Bryssel vill diktera vem som får begravas. Vi ler från historien åt deras fega fördömanden. Inga ursäkter för svaghet. Rensa ut alla som böjer sig för väst."}, "date": "7 september, 22:19", "url": "https://www.svt.se/nyheter/utrikes/tusentals-deltog-under-krigsforbrytaren-ratko-mladics-begravning", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.22/0.42/09ea3e1ef38229fc91fab7daba3f407f7a397353dd5dfa0f036442de100acf4a"}, {"type": "text", "heading": "Svagt uppåt för Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen stängde måndagen svagt uppåt på 0,24 procent, stöttad av tekniksektorn och en stor fusionsplan mellan Rejlers och Multiconsult. Synact Pharma och SHT Smart High-Tech rusade efter starka forskningsbesked respektive en riktad nyemission, medan flera bolag fick uppdaterade rekommendationer från analyshusen.", "trump": "Stockholmsbörsen gick upp, vilket inte förvånar någon, för jag har alltid sagt att marknaderna älskar vinnare! Rejlers gör en enorm affär med norrmännen, precis som mina fantastiska handelsavtal. SHT Smart High-Tech rusade nästan 50 procent – otroliga siffror, total succé! Under radikala vänsterstyren brukar det bara vara tårar, men här är det klass, precis som jag!", "stalin": "Stockholmsbörsens marginella uppgång på 0,24 procent bevisar att kapitalismens kugghjul snurrar vidare, men vi noterar med ideologisk vaksamhet att vissa aktörer, såsom SHT Smart High-Tech, drar till sig suspekta spekulativa rikedomar. Rejlers och Multiconsult planerar en kolossal fusion – ett syndikat av 8 000 arbetare som måste övervakas noga av statliga kommissarier så att inga kontrarevolutionära avvikelser uppstår!"}, "date": "7 september, 17:38", "url": "https://www.affarsvarlden.se/artikel/sva
