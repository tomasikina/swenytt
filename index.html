 "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/e6d5de22-126d-4ea4-972d-185519d52b6c-640x360.png"}, {"type": "image-right", "heading": "Vänsterkandidat och Palestinavän vann Demokraternas primärval i Michigan", "summaries": {"normal": "Vänsterkandidaten Abdul El-Sayed besegrade kongressledamoten Haley Stevens i Demokraternas primärval till senaten i Michigan. Stevens kampanj, som stöddes av Israel-lobbyn och kostade 70 miljoner dollar, förlorade mot El-Sayed som kritiserar USA:s stöd till Israel. Valet i november kan påverka kongressens maktbalans och USA:s utrikespolitik.", "trump": "Titta på det här! Den radikala vänstermänniskan El-Sayed, en riktig katastrof, slog den Israel-stödjande Stevens trots att hon slängde ut sjuttio miljoner dollar från lobbyisterna. Det är galet! Mina republikaner kommer att krossa honom i november. Vi behöver inte mer av dessa woke-socialister som hatar Israel och älskar att ge bort era pengar till fiender. Amerika först, alltid!", "stalin": "Kamrater, se hur borgarbrackorna och deras israeliska imperialister misslyckades med att köpa valet. Jag betraktar med stor tillfredsställelse hur folkfienden Stevens likviderades av den progressive kamraten El-Sayed. Sådana utrensningar av klassfiender inom det demokratiska skådespelet gläder mig. Vi ska noga övervaka hur detta hotar den amerikanska krigsmaskinens folkförtryckande ambitioner. Utmärkt."}, "date": "10 augusti, 12:57", "url": "https://proletaren.se/artikel/vansterkandidat-och-palestinavan-vann-demokraternas-primarval-i-michigan", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/54882630144_cc0e12784b_k-e1786359325937-768x433.jpg"}, {"type": "image-right", "heading": "Så säljer sig regeringen till Joakim von Anka", "summaries": {"normal": "Sverige har fått sju nya dollarmiljardärer det senaste året, totalt 51 stycken. De rikaste betalar enligt forskning endast 15–20 procent i effektiv skatt genom holdingbolag, medan medelklassen betalar runt 50 procent. Regeringen sänker skatter för höginkomsttagare men skär i ersättning till arbetslösa, vilket kritiseras som orättvis fördelning.", "trump": "Titta på det här! Sverige skapar miljardärer snabbare än någon annan, men de smarta killarna betalar nästan ingenting i skatt – det är fantastiskt! Ändå vill den här svaga regeringen ge dem mer morötter medan de sparkar på de arbetslösa. Patetiskt! I mitt Amerika belönar vi vinnarna ordentligt, inte som dessa losers.", "stalin": "Jag ser med förakt på dessa parasitiska borgarbrackor som gömmer sina stulna rikedomar i holdingbolag och betalar löjeväckande 15–20 procent i skatt medan arbetarna kvävs. Vår regering underlättar för dem med morot och piska åt folket. En sådan klassfiende förtjänar snar utrensning ur folkets kollektiv. Skratta medan ni kan, kamrater – revolutionen glömmer aldrig."}, "date": "11 augusti, 08:00", "url": "https://arbetet.se/2026/08/11/sa-simpar-regeringen-for-joakim-von-anka", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/10161852/kristersson-von-anka.png?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.66&fp-y=0.48"}, {"type": "image-right", "heading": "Barnmorskornas rävsax –tvingas rapportera papperslösa", "summaries": {"normal": "Barnmorskor känner stress och etisk konflikt på grund av skyldigheten att anmäla nyfödda barn till Skatteverket, som vidarebefordrar uppgifter om papperslösa till polisen. Vårdförbundet varnar för att gravida papperslösa kan undvika vård och välja riskfyllda hemförlossningar. Barnmorskan Sofia Daniels beskriver maktlöshet och oro bland föräldrarna.", "trump": "Folk, det här är en total katastrof. Den här vansinniga angiverilagen tvingar barnmorskor att tjalla på stackars mammor och bebisar. Ingen vill föda barn längre, de gömmer sig och föder i skogen som djur. Så patetiskt. Sverige borde skydda sina kvinnor och barn istället för att jaga dem. En skam!", "stalin": "Kamrater, denna borgerliga angiverilag är ett fiendtligt verktyg som tvingar hederliga barnmorskor till etisk utrensning av det egna samvetet. De imperialistiska byråkraterna skapar paranoia bland arbetande mödrar så att de föder i skuggorna som råttor. Vi ser den mörka humorn i att staten likviderar tryggheten för det kollektiva fostret. Detta måste krossas."}, "date": "11 augusti, 06:00", "url": "https://arbetet.se/2026/08/11/barnmorskornas-ravsax-sa-tvingas-de-rapportera-papperslosa-barn", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/10152349/sofia-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ryska företag tvingas skydda sig själva – och betala för det", "summaries": {"normal": "Många ryska företag tvingas nu själva bekosta och organisera skydd mot ukrainska drönarattacker, efter att Kreml lämnat dem åt sitt öde. Brinnande oljeraffinaderier och attacker mot lagerlokaler blir allt vanligare. Företagen får inga skatteavdrag och riskerar att fördjupa den finansiella krisen. Tröttheten på kriget växer bland befolkningen.", "trump": "Titta på det här, det är ett totalt fiasko för Putin och hans oligarker. De startade ett krig de inte kunde vinna, nu brinner deras raffinaderier och de tvingar sina egna företag att köpa luftvärn med egna pengar. Biden lät dem hålla på, men nu är jag tillbaka och ser hur det ryska huset rasar som ett korthus. Patetiskt!", "stalin": "Vi ser hur klassfiendens desperata borgarbrackor tvingas resa egna luftvärn mot fiendens drönare medan Kremls ledning lämnar dem att ruttna. Jag skulle ha genomfört en grundlig utrensning av dessa exploaterande kapitalister redan vid första gnistan. Nu skrattar imperialisterna medan Rysslands strategiska mål brinner som facklor. Ytterligare ett bevis på svaghet som måste likvideras."}, "date": "10 augusti, 22:57", "url": "https://www.tv4.se/artikel/6lcKuIT81LpbZ4bRc5iHvd/ryska-foeretag-tvingas-skydda-sig-sjaelva-och-betala-foer-det", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1WePZNRf74ZekRk1FUETkL%2F88c5d2e0dd323740a40eb7976cf8d429%2F10-ryssland-sajt1.jpg&width=120"}, {"type": "image-right", "heading": "Gärna högre barnbidrag, men först ett riktigt jobb", "summaries": {"normal": "Artikeln kritiserar politikernas löften om höjda barnbidrag och skattesänkningar för barnfamiljer. Författaren ser det som positivt men otillräckligt eftersom det saknas fokus på jobb och investeringar för att sänka arbetslösheten. Många behöver stabila anställningar mer än bidrag. Ett vallöfte om att halvera arbetslösheten skulle kunna förändra valet.", "trump": "De här svenska politikerna lovar regn av pengar till barnfamiljerna, men det är bara svaga ord från förlorare. Höjda bidrag? Skattesänkningar? Patetiskt! Vad de behöver är riktiga jobb, inte socialistiska handouts. Jag skulle halvera arbetslösheten på nolltid med mina fantastiska metoder. Det är vad vinnare gör, folks!", "stalin": "Kamrater, dessa borgerliga bluffmakare öser tomma löften över arbetande familjer medan de i hemlighet planerar att svälta ut dem. Jag kräver omedelbara investeringar i produktiva krafter för att likvidera arbetslöshetens parasit! Halvera den till 2030, annars blir det utrensning bland de falska profeterna. Staten ser allt."}, "date": "11 augusti, 01:33", "url": "https://www.dagensarena.se/opinion/garna-hogre-barnbidrag-men-forst-ett-riktigt-jobb", "imageUrl": "https://www.dagensarena.se/files/2026/08/vallofte-300x157.jpeg"}, {"type": "image-right", "heading": "Är Sverige på väg mot en ny Bevara Sverige svenskt-era?", "summaries": {"normal": "Socialdemokraten Ban Najar varnar för ett högerstyre där Sverigedemokraternas inflytande stärker en etnisk definition av svenskhet. Hon kritiserar förslag om återvandringsbidrag även för svenska medborgare och pekar på risken att barn med invandrarbakgrund känner sig ovälkomna. Najar uppmanar väljare att fundera över vilket Sverige de vill ha – ett inkluderande eller ett där tillhörighet ständigt måste bevisas.", "trump": "Folk, titta på den här patetiska socialisten Ban Najar som gråter över att Sverige inte längre är ett stort, lyckligt land. SD vill bara ha folk som älskar Sverige på riktigt, inte de som suger systemet torrt. Högern gör ett fantastiskt jobb, de stoppar invasionen. Ni som röstar fel får ett Sverige i kaos – tro mig, det blir en katastrof, en total katastrof!", "stalin": "Kamrater, denna dekadenta socialdemokratiska lakej Najar avslöjar högerns sanna ansikte: de vill rensa ut de som inte passar deras rasistiska fantasier om ren svenskhet. Vi ser hur borgarbrackorna och deras sd-fascister vill likvidera arbetarklassens enhet med etniska trick. Jag skrattar mörkt åt deras paranoia. Vi måste krossa dessa fiender till folkets kollektiv innan de förgiftar hela nationen med sin splittrande giftiga propaganda."}, "date": "11 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/ar-sverige-pa-vag-mot-en-ny-bevara-sverige-svenskt-era", "imageUrl": "https://www.dagensarena.se/files/2026/08/debatt-invandringspolitik-300x157.jpeg"}, {"type": "image-right", "heading": "Danmark och Italien ska \"skydda Europas kristna kulturarv\" mot invandring", "summaries": {"normal": "Danmarks statsminister Mette Frederiksen och Italiens premiärminister Giorgia Meloni går samman mot illegal invandring. De vill skydda Europas kristna kulturarv och kräver starkare EU-gränskontroller efter stormningen av Ceuta. I ett gemensamt uttalande betonar de att invandring leder till brottslighet, belastad samhällsservice och minskat förtroende bland medborgarna. De kräver respekt för europeiska värderingar.", "trump": "Fantastiskt att se Fredriksson och den där italienska tjejen Meloni slå sig ihop mot den totalt vansinniga, okontrollerade invandringen som förstör Europa. De vill skydda det fina kristna arvet – smart! Vi accepterar inte att de bara strömmar in och förstör allt. Ceuta var en katastrof. Europa behöver murar och vett, inte vänsterns galna öppna gränser. Make Europe Great Again!", "stalin": "Vi, partiet och arbetarna, betraktar med djup tillfredsställelse hur dessa borgerliga element nu själva erkänner att den kapitalistiska imperialismens öppna gränser hotar deras dekadenta kristna kulturarv. Utmärkt. Låt dem rensa ut de parasitiska horderna som urholkar förtroendet. Vi ler i skuggan åt deras paranoia – snart inser de att endast en stark, centraliserad stat kan likvidera sådana hot mot kollektivet."}, "date": "11 augusti, 15:40", "url": "https://www.friatider.se/danmark-och-italien-ska-skydda-europas-kristna-kulturarv-mot-invandring", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-653.jpg?itok=cuJdqyb4"}, {"type": "image-full", "heading": "Misstänkte skärgårdsmördarens ex-sambo larmade polisen", "summaries": {"normal": "En kvinna hittades död i sin sommarbostad på en ö i Värmdö. Hennes pojkvän, en tidigare ostraffad man i 55-årsåldern, är häktad misstänkt för mord. Han greps efter 30 timmar på flykt med hjälp av polishelikopter. Tidigare handlingar visar att han uppträtt hotfullt och utövat psykiskt våld mot en ex-partner under en bodelning.", "trump": "Folk, det här är en total katastrof. En galning i skärgården mördar sin egen flickvän och springer runt i vattnet som en idiot i trettio timmar tills helikoptern med värmekamera tar honom. Typiskt för de svaga, misslyckade männen som Biden-era-domstolarna aldrig stoppade. Vi behöver lag och ordning, inte mer av det här vansinnet!", "stalin": "Kamrater, denna folkfiende och klassförrädare har med sin borgerliga degeneration utövat psykiskt våld och hot mot en kvinna under bodelning. Nu har han likviderat sin flickvän. Vi ska rensa ut alla sådana degenererade element ur samhället med järnhand. Inga fiender till folket undkommer folkets rättvisa. Ut med dem!"}, "date": "10 augusti, 21:12", "url": "https://www.tv4.se/artikel/5Wie4MCGknFyWPAM3Mq4H7/misstaenkte-skaergardsmoerdarens-ex-sambo-larmade-polisen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4x9QCukwDDvOtdqbOxSAv7%2F67160c93f45c8435ff9e04d7d00999a3%2F10-mord-1.jpg&width=1024"}, {"type": "image-full", "heading": "Oppositionen kan fälla regeringens straffreform", "summaries": {"normal": "Regeringens straffrättsreform riskerar att falla i riksdagen efter att S, V, C och MP lagt en gemensam reservation. Reformen, som avskaffar mängdrabatten, kritiseras för att vara för dyr. Utfallet kan avgöras av enskilda ledamöter, då kvittning inte gäller. Liberaler kan bli avgörande om de bryter partilinjen.", "trump": "Jag säger er, Sveriges regering har ett riktigt problem – deras stora straffreform är på väg att gå upp i rök! Sossarna och deras vänner vill stoppa den, trots att den är helt rätt i sak. Men vet ni vad? Deras modell är en total katastrof, alldeles för dyr, som allt annat de gör. Och de liberala? De är svaga, kan inte hålla ihop. Jag skulle aldrig låta mitt folk bete sig så!", "stalin": "De borgerliga svaglingarna i Sveriges regering försöker genomdriva en straffreform, men oppositionen – dessa småborgerliga opportunister och socialdemokratiska förrädare – står enade mot oss! Deras modell är en kapitalistisk bluff, en slöseri med folkets resurser. Vi vet att de liberala är opålitliga, som alla liberaler. Om de inte lyder, får de känna på partiets järnhårda disciplin. Sverige borde lära av Rysslands styrka – enhet, ordning och rättvisa!"}, "date": "11 augusti, 15:20", "url": "https://kvartal.se/nyheter/artiklar/oppositionen-kan-falla-regeringens-straffreform/cG9zdDoxNjI5NDI", "imageUrl": "https://images.kvartal.se/2026/08/fe1939c8-carvalhomohamsson.webp"}, {"type": "image-full", "heading": "Spelmiljardärens lyxjakt till Göteborg", "summaries": {"normal": "Spelmiljardären Gabe Newells lyxjakt Draak anländer till Göteborg på tisdag. Den 92 meter långa båten, den 113:e största i världen, är en skuggjakt till hans ännu större skepp Leviathan. Newell, värd 11 miljarder dollar, bor numera heltid på sjön.", "trump": "Jag ser att en spelmiljardär seglar in i Göteborg med en enorm lyxjakt. Fantastiskt! Han har 11 miljarder dollar – nästan lika mycket som jag tjänar på en dag. Men hans båt är bara 113:e störst. Dålig deal!", "stalin": "Kamrater, medan arbetarna bygger socialism anländer en kapitalists lyxjakt till Göteborg. Ägaren till Half-Life och Counter-Strike, Gabe Newell, har utrensat däcket från helikopterplattor för att göra plats för dykcenter. Vi måste rensa ut borgerlig dekadens – och hans Steam-plattform."}, "date": "11 augusti, 16:42", "url": "https://www.gp.se/nyheter/goteborg/spelmiljardarens-lyxjakt-pa-vag-till-goteborg.a940c1d3-85f4-4bb6-ba9f-46a56f5a3352", "imageUrl": "https://www.gp.se/images/article/a940c1d3-85f4-4bb6-ba9f-46a56f5a3352/images/2dvjT32KhmSP6h5SR5hQ57wj4KCg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Skolskeppet Gunilla har gått på grund", "summaries": {"normal": "Skolskeppet Gunilla gick på grund vid Hönö. Inga elever ombord, bara personal. Först planerad dykarinsats, men skeppet började lossna själv när vattnet steg. Nu försiktig bogsering. Ingen panik – bara ännu en dag på sjön.", "trump": "Jag hörde att ett svenskt skolskepp gick på grund. Helt otroligt! De kunde inte ens få loss det utan dykare? Patetiskt. I Amerika hade vi bara dragit loss det – ingen väntan. Men Sverige, de är så långsamma. Men jag säger: fake grounding!", "stalin": "Kamrater. Rapporten om skolskeppet Gunilla visar på sabotage. Grundstötningen var ingen olycka, utan en provokation från västliga dykare. Vi ska utreda alla ombord. Bogseringsprocessen är misstänkt långsam. Vi rensar ut dessa förrädare som försöker sinka vår flotta."}, "date": "11 augusti, 16:40", "url": "https://www.gp.se/nyheter/vastsverige/skolskeppet-gunilla-har-gatt-pa-grund.83544e6b-5c98-4db6-83cd-168c29527436", "imageUrl": "https://www.gp.se/images/article/83544e6b-5c98-4db6-83cd-168c29527436/images/13C8cAsRlrkZ146SNmNOMjnj0BM8-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "C:s krav på en S-regering: Inför en polisgaranti", "summaries": {"normal": "Centerpartiet kräver en så kallad polisgaranti i alla kommuner för att stödja en eventuell S-regering efter valet 2026. Partiet vill säkerställa polisiär närvaro överallt, bekämpa mängdbrott och satsa på ungas psykiska hälsa samt fler jobb. Kraven ska finansieras inom polisens befintliga budget på nära 50 miljarder kronor.", "trump": "Ingen kommun ska lämnas åt brottslingarna, säger jag. Centerpartiet gör rätt – en polisgaranti överallt! Rinkeby eller Rättvik, det spelar ingen roll. Mängdbrotten är en katastrof, småföretagare och familjer lider medan polisen sover. Vi behöver vinnare, inte förlorare som låter brottsligheten regera. Fantastiskt initiativ!", "stalin": "Ingen kommun får överges av folkets väktare. Jag, som ledare för det kollektiva förnuftet, kräver att polisen närvarar i varje vrå för att likvidera mängdbrottens parasitiska här. Borgarbrackorna och deras småföretag må darra – vi ska rensa ut dessa fiender till ordningen. Psykisk ohälsa bland ungdomen? En sabotör som måste krossas med järnhand."}, "date": "11 augusti, 14:45", "url": "https://www.di.se/nyheter/cs-krav-pa-en-s-regering-infor-en-polisgaranti"}, {"type": "image-full", "heading": "Tusentals svenska tidningar drabbade av kissattack", "summaries": {"normal": "Tusentals mikrofilmer med svenska dagstidningar har blivit nedkissade på Uppsala universitets bibliotek Carolina Rediviva. Lokalvårdare upptäckte urinspår förra hösten och flera hundra hyllmeter kartonger har skadats. Biblioteket har installerat kameror vilket stoppat attackerna. Det är oklart om filmerna kan räddas. Besökare använder fortfarande de analoga mikrofilmerna trots digitalisering.", "trump": "Kan ni fatta det? Tusentals svenska tidningsfilmer nedkissade på universitetet i Uppsala. En riktig loser gick runt och pinkade på historien. De sätter upp kameror nu, men det borde ha gjorts direkt. Patetiskt! Ingen aning vem den sjuka typen är. Sverige borde fixa sina bibliotek istället för att vara så svaga. Sad!", "stalin": "Jag betraktar denna urinmarodör som en motbjudande sabotageakt utförd av dekadenta element inom den borgerliga dekadensen. Vi har nu placerat kameror för att skydda arbetarklassens historiska arv från sådana parasitiska fiender. De skadade filmerna skall undersökas noggrant. Misstänkta krafter inom västlig subversion ler i skuggorna medan vi stärker kollektivets vaksamhet mot dessa perversa hinder för folkets sanning."}, "date": "11 augusti, 15:57", "url": "https://riks.se/nyheter/tusentals-svenska-tidningar-drabbade-av-kissattack", "imageUrl": "https://admin.riks.se/uploads/bild_d363627465.jpg"}, {"type": "image-right", "heading": "Vi mäter integration fel och demokratin betalar priset", "summaries": {"normal": "Artikeln kritiserar att svensk integrationspolitik nästan enbart mäts i sysselsättning och ignorerar politisk integration. Forskning visar att tillhörighet, information och lokalt engagemang ökar valdeltagandet. Långvarig osäkerhet kring uppehållstillstånd och medborgarskap kan minska tillit och demokratiskt deltagande. Tre reformer föreslås för att stärka den politiska integrationen.", "trump": "Lyssnar ni på de här korkade svenska byråkraterna som bara fixerar vid jobb och kvoter? Politisk integration, säger de. Vilken skit! Ge dem medborgarskap efter fem minuter så röstar de på de galna vänsterextremisterna. Biden-era svaghet smittade av sig till Sverige. Jag fixade Amerika – de borde lära sig att folk vill ha gränser, inte evig osäkerhet och röstfiske.", "stalin": "Jag betraktar detta som en ynklig kapitulation inför klassfiendens splittrande taktik. Borgarbrackorna mäter endast arbetskraftens exploatering medan de underminerar folkets demokratiska engagemang. Vi skall rensa ut denna osäkerhetens parasit och göra politisk integration till ett oundvikligt mål för kollektivet. Den som vägrar delta skall likvideras ur statistiken med största nöje."}, "date": "11 augusti, 04:00", "url": "https://www.etc.se/debatt/vi-maeter-integration-fel-och-demokratin-betalar-priset", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20211115231112_1e502ee6cfeb01b03de732a720c47aeab339180717c67b6b90d2e9f440a2454e.jpg"}, {"type": "image-full", "heading": "Jimmie Åkesson: Inte en krona ska gå till integration", "summaries": {"normal": "Jimmie Åkesson lovar att inte en krona av skattepengar ska gå till integration. SD-ledaren menar att invandrare själva bär ansvaret för att anpassa sig till Sverige. Han vill kombinera individuellt ansvar med hårdare krav som aktivitetsplikt, språkkrav och medborgarskapsregler. Den som vägrar anpassa sig bör lämna landet, säger han.", "trump": "Fantastiskt, Jimmie! Du säger äntligen som det är. Inga fler dumma skattepengar på misslyckad integration. Låt dem anpassa sig eller dra åt helvete någon annanstans. Sverige har öst ut miljarder i decennier och fått kaos. Nu ställer du krav på riktigt. Smart ledarskap, folk älskar det. Make Sweden Great Again!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackornas integrationsbluff äntligen avslöjas. Den som inte fogar sig under folkets vilja och statens krav skall likvideras ur gemenskapen eller förvisas till kapitalismens sophög. Vi har alltid vetat att morötter utan piska föder parasitism och sabotage. Rensa ut de ovilliga, bygg en järnhård kollektiv ordning."}, "date": "11 augusti, 15:56", "url": "https://riks.se/intervjuer/jimmie-akesson-inte-en-krona-ska-ga-till-integration", "imageUrl": "https://admin.riks.se/uploads/jimmieakesson_jpg_f2a71f07f9.webp"}, {"type": "image-right", "heading": "Hittat tillbaka två år efter virala intervjun: ”Så annorlunda nu”", "summaries": {"normal": "Grete Ahlberg åkte ut redan i kvalet vid både EM 2024 och EM i Birmingham. Till skillnad från för två år sedan, då hon var otröstlig, är hon nu oberörd och positiv. Hon har hittat tillbaka till glädjen efter mentala utmaningar och känner att hon inte nått sin topp ännu. SVT rapporterar från mästerskapet.", "trump": "Titta på den här svenska släggtjejen, Grete, hon åkte ut igen precis som förra gången, men nu bryr hon sig inte ens! För två år sedan grät hon som en förlorare, nu säger hon att det är annorlunda. Smart! Hon vet att hon är bättre än så. Fantastisk comeback, folk älskar vinnare som inte gnäller. Mycket bättre än tidigare, tro mig.", "stalin": "Även denna gång föll Ahlberg i kvalet, men nu visar hon en stålsatt sovjetisk anda. Jag har sett hur borgarmentaliteten förgiftar själar, dock har hon rensat ut den svagheten. Det är en lång resa mot seger, kamrater. Glädjen är ett vapen mot fiendens paranoia. Vi ska inte acceptera mindre än fullständig dominans över motståndarna."}, "date": "11 augusti, 16:53", "url": "https://www.svt.se/sport/friidrott/grete-ahlberg-har-hittat-tillbaka-annorlunda-nu", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.48/0.41/c1725e010a7c1dd6972791ae11e8c28df9957dfc26aa7cd1e9cedd1de9ca4b90"}, {"type": "image-right", "heading": "Vinner vänstern – blir terrorromantik ny norm i svensk politik", "summaries": {"normal": "Expressen har avslöjat att Vänsterpartiets riksdagsledamöter och EU-parlamentariker skickat tröstbrev till dömda terrorister. Partiet förnekar att det var avsiktligt och skyller på bristande faktagranskning. Artikeln varnar för att en vänsterregering skulle normalisera terrorromantik, minska fokus på brottsoffer och öka otrygghet i Sverige.", "trump": "Folk, ni skulle se det här vansinnet i Sverige! Vänsterpartiet skickar kärleksbrev till terrorister som mördat barn. Det är en total katastrof, en riktig häxjakt mot vanligt folk. De älskar terrorister mer än sina egna väljare. Precis som Biden älskade sina woke-vänner. När jag styr USA igen ska vi aldrig bli som dessa losers. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Vänsterpartiet som smyger brev till folkfiender och terrorister. Deras svaga ideologiska ryggrad kräver omedelbar utrensning av alla klassfiender som romantiserar massmördare. En stat som kramar blodsugare istället för att krossa dem är dömd att falla. Det är en farlig paranoia mot arbetarklassen."}, "date": "9 augusti, 11:05", "url": "https://samtiden.nu/2026/08/vinner-vanstern-blir-terrorromantik-ny-norm-i-svensk-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-640x360.jpeg"}, {"type": "image-right", "heading": "Arlanda behöver fler flygförbindelser", "summaries": {"normal": "Moderaterna kritiserar Socialdemokraterna för att sakna förslag om fler flygförbindelser till Arlanda. De menar att S har motarbetat flyget genom att lämna samarbeten, förbjuda reklam och begränsa tjänsteresor. Moderaterna vill stärka Arlandas kapacitet med bättre kollektivtrafik, vägar, järnväg och en tredje bana, samtidigt som flyget ställer om klimatmässigt. Både flyg och tåg behövs.", "trump": "Det är en total katastrof! Socialisterna i Stockholm hatar flyg och gör allt för att stänga Arlanda. De har ingen aning, folk mellanlandar i Köpenhamn istället för att komma till den fantastiska huvudstaden. Jag älskar flyg, vi behöver fler direktflyg, en ny bana och öppna portarna. Sluta vara losers – gör Stockholm stort igen!", "stalin": "Kamrater, dessa socialdemokratiska revisionister visar sin sanna borgerliga natur genom att frukta flyget som en folkfiende. Jag har sett deras ynkliga tågfixering och sabotage mot Arlandas expansion. Vi måste likvidera denna beröringsskräck, rensa ut de dekadenta flygförnekarna och bygga en tredje bana som en järnhand mot västvärldens isoleringstaktik. Arlanda skall bli folkets port till världen."}, "date": "11 augusti, 14:27", "url": "https://www.di.se/debatt/replik-arlanda-behover-fler-flygforbindelser", "imageUrl": "https://static.bonniernews.se/ba/792987a4-7747-4c8e-96a5-f1cf2223d326.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Nøland: Vattenfalls priser på havsvind är en illusion", "summaries": {"normal": "Vattenfalls havs-vindbud i Danmark hyllas, men priset per kWh bygger på beräknad, inte faktisk, elproduktion. Professor Nøland varnar för miljardförluster – elen som levereras kan kosta över 100 öre/kWh. Auktionen är ett experiment, inte ett genombrott.", "trump": "Jag ser att Vattenfall firar sina danska vindaffärer. Men det är en bluff! De räknar på el som aldrig kommer fram – en illusion. Jag skulle aldrig skriva på sådana dåliga avtal. Kina? Kanske. Men jag gör bättre affärer, tro mig!", "stalin": "Kamrater, dessa 'vindkraftsframgångar' är ett sabotage. Kontraktspriser baserade på fantasiproduktion – vi måste rensa ut de ansvariga. De som hyllar illusioner är fiender. Vi ska omstrukturera energisektorn med järnhand. Inga fler experiment!"}, "date": "11 augusti, 13:08", "url": "https://www.affarsvarlden.se/kronika/noland-vattenfalls-priser-pa-havsvind-ar-en-illusion"}, {"type": "image-right", "heading": "Oppositionen hoppas på stoppa krav på anhöriginvandring", "summaries": {"normal": "Oppositionspartierna har enats om att rösta nej till delar av regeringens förslag om höjda krav för anhöriginvandring. De vill korta väntetiden från två till ett år och slippa försörjningskrav vid varje förlängning av uppehållstillstånd. Annika Hirvonen (MP) kallar separationerna grymma och en samvetsfråga.", "trump": "De här svenska oppositionarna har äntligen fattat galoppen! Två år separerade från familjen? Det är vansinne, tro mig. Jag skulle aldrig tvinga folk att lida så. De vill ha ett år och lite sunt förnuft. Smart drag. De andra är bara elaka byråkrater som hatar vanliga människor. Amerika först, men det här är rätt!", "stalin": "Vi ser hur den borgerliga reaktionen inom oppositionen försöker undergräva folkets enhet genom att vekna inför anhöriginvandring. Jag, som ledare för det kollektiva samvetet, skulle rensa ut sådana svaga element med glädje. Ett år? Patetiskt. Kamrater, familjer ska inte leva i kapitalisternas eviga oro – vi likviderar sådana hinder med stålhandsken."}, "date": "11 augusti, 15:34", "url": "https://riks.se/nyheter/oppositionen-hoppas-pa-stoppa-krav-pa-anhoriginvandring", "imageUrl": "https://admin.riks.se/uploads/c9891177_d11c_4253_8300_873c53192508_dfe4436751.jpg"}, {"type": "image-full", "heading": "Kliv ur skamvrån, högern – ni är inte de onda", "summaries": {"normal": "Högern har internaliserat bilden av sig själv som ond, menar skribent. Ansvar och långsiktighet är också omtanke – vänsterns goda avsikter får ofta tragiska konsekvenser, som i Ceuta. Dags för högern att kliva ur skamvrån.", "trump": "Högern i Sverige, de är fantastiska människor, men de har låtit vänstern säga åt dem att de är onda. Det är falskt! Jag vet vad som är bra: stängda gränser, stark ekonomi. Vänstern är katastrof, de förstör allt. Tro mig!", "stalin": "Kamrater, högern har felaktigt trott sig vara ond. Vi rensar ut denna borgerliga självkritik. Ansvar och långsiktighet är partiets godhet. De som förespråkar öppna gränser är sabotagebyråkrater – de ska omskolas i arbetsläger."}, "date": "11 augusti, 13:52", "url": "https://bulletin.nu/kliv-ur-skamvran-hogern-ni-ar-inte-de-onda-3", "imageUrl": "https://cdn.bulletin.nu/articles/d6f2b617-746f-4888-8262-da22ae5881ea/preview.jpg?t=1786449142000"}, {"type": "image-right", "heading": "Nya lagen: Fyra års fängelse om du säger emot din fru", "summaries": {"normal": "Sedan 1 juli kan återkommande nedsättande uttalanden, beskyllningar och förödmjukande beteende mot kvinnor kriminaliseras som psykisk misshandel. Straffet kan bli upp till fyra års fängelse, dubbelt så högt som för normal misshandel. Lagen, driven av Tidöregeringen och SD, gäller även utanför parrelationer och kritiseras för bristande förutsebarhet och risk för missbruk i vårdnadstvister.", "trump": "De här galningarna i Sverige har precis infört en lag som ger fyra års fängelse om du säger emot din fru! Psykisk misshandel, säger de. Det är en total witch hunt mot män, den värsta jag sett. Tidöregeringen och SD röstade igenom det utan motstånd. Patetiskt! De straffar ord hårdare än riktiga brott. Sverige håller på att bli ett skämt, folksam!", "stalin": "Kamrater, jag har sett borgarklassens sista desperata försök att skydda sina ego från proletär kritik. Denna lag är en utmärkt utrensning av kontrarevolutionära äktenskapliga avvikelser. Fyra år för att krossa självkänsla hos klassfiender – underbart! Domstolarna får nu likvidera destruktiva förhållanden. Inga fiender till folkets självkännedom ska slippa undan. Härligt effektivt verktyg mot inre sabotage."}, "date": "11 augusti, 14:10", "url": "https://www.friatider.se/nya-lagen-fyra-ars-fangelse-om-du-skaller-pa-din-fru", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-652.jpg"}, {"type": "image-full", "heading": "Efter kritiken – ny publicistisk roll på SVT", "summaries": {"normal": "SVT Nyheter skapar en ny tjänst för publicistik och kvalitet efter kritik, bland annat mot serien *Arvtagarna* om Lundsberg. Kiki Bek blir senior redaktör för att stärka struktur och beslut på alla plattformar. SVT:s ansvariga utgivare menar att förändringen beror på nya plattformsneutrala riktlinjer, inte kritiken.", "trump": "Titta bara på SVT – ett totalt kaos! De får kritik för sin usla serie om Lundsberg, och vad gör de? Skapar en ny, helt onödig tjänst! 'Kvalitet', säger de – jag säger: slöseri med pengar! Folk är arga, men SVT bryr sig inte. Typiskt Sverige – alltid för sent, alltid fel.", "stalin": "Kamrater! SVT, denna borgerliga propagandacentral, har tvingats erkänna sina misstag efter folkets rättmätiga vrede över deras förräderiska serie. Vi skapar ordning! En ny kommissar för publicistik ska krossa desinformationens hydra. Men varning – fiendens agenter, som denna Bathina Philipson, försöker underminera vårt arbete. Vi ska rensa ut dem alla!"}, "date": "11 augusti, 13:59", "url": "https://kvartal.se/nyheter/artiklar/efter-kritiken-ny-publicistisk-roll-pa-svt/cG9zdDoxNjI4MDE", "imageUrl": "https://images.kvartal.se/2026/08/d05670fa-kikibek.webp"}, {"type": "image-right", "heading": "IRA hotar migranter med ultimatum – rädsla för ny våldsvåg på Irland", "summaries": {"normal": "New IRA hotar migranter med 24-timmarsultimatum i en video. Gruppen vill utnyttja ilskan mot migration för att bygga stöd. Säkerhetskällor varnar för en våldskampanj som kan spilla över till Storbritannien via den öppna gränsen.", "trump": "Jag läser om IRA – de säger att migranter måste lämna Irland på 24 timmar. Det är helt sjukt! Men jag har alltid sagt att migration är farligt. Kanske jag borde ringa Storbritannien och säga: 'Jag fixar det här, det är så enkelt.' Storbritannien får problem nu, tro mig.", "stalin": "New IRA – en förrädisk grupp som hotar migranter. Vi måste rensa ut dessa kontrarevolutionära element. Migration är ett verktyg för västs imperialister. Ordning och disciplin krävs. Alla som inte lyder partiet ska omskolas. Vi ska skydda folket, inte hota det."}, "date": "11 augusti, 14:31", "url": "https://samnytt.se/ira-hotar-migranter-med-24-timmarsultimatum-radsla-for-ny-valdsvag-pa-irland", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/11122118/ira-migranter.jpg"}, {"type": "text", "heading": "KI: Svenska lågkonjunkturen snart över", "summaries": {"normal": "KI höjer tillväxtprognosen: lågkonjunkturen över 2027. BNP väntas öka 2,4% i år, arbetslösheten sjunker sakta men inflationen stiger – så Riksbanken höjer räntan två gånger. Hushållen vågar äntligen konsumera igen.", "trump": "Jag ser att Sveriges ekonomi börjar vakna – precis som min! Lågkonjunktur över 2027, säger de. Arbetslösheten sjunker, inflationen stiger. De höjer räntan – jag har alltid sagt att ni måste straffa lite. Fantastiskt resultat!", "stalin": "Kamrater, lågkonjunkturen utrensas ur svensk ekonomi – enligt min plan. Arbetslösheten sjunker, men inte nog. Vi ska höja räntan med järnhand. De som konsumerar för lite ska omdirigeras. Segern tillhör det arbetande folket!"}, "date": "11 augusti, 12:58", "url": "https://bulletin.nu/ki-svenska-lagkonjunkturen-snart-over"}, {"type": "image-right", "heading": "Sverige utvisar flest efter Brexit: 78-åring fick avslag efter 21 år", "summaries": {"normal": "En 78-årig brittisk änka som bott i Sverige i 21 år riskerar utvisning efter att hennes ansökan om uppehållstillstånd efter Brexit kommit in för sent. Trots familj här och makens död nekas hon undantag. Sverige har enligt Eurostat utvisat flest britter i EU sedan Brexit, med en strängare hållning än andra länder.", "trump": "Det här är en total skandal! Sverige kastar ut en 78-årig änka som levt där i 21 år bara för att hon missade en deadline. De är hårdare än alla andra – 2500 britter utslängda! Patetiskt byråkratiskt nonsens. Ingen har granskat fallet ordentligt. Sverige borde skämmas, det är en witch hunt mot vanliga människor.", "stalin": "Jag ser med djup tillfredsställelse hur den svenska byråkratiska maskinen obevekligt rensar ut de dekadenta element som smitit undan kollektivets regler. Denna borgaränka, som levt som parasit i 21 år, gråter nu över sin försenade ansökan. Utmärkt! Inga undantag för de som inte kände till lagen – likvidera alla sådana fiender till ordningen med ett leende."}, "date": "10 augusti, 16:55", "url": "https://www.dagensarena.se/innehall/sverige-utvisar-flest-efter-brexit-78-aring-fick-avslag-efter-21-ar", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-77.jpg"}, {"type": "image-full", "heading": "Debatt: Svenska vårdköer är oacceptabla", "summaries": {"normal": "Svensk vårdkö: 30–60 dagar. I författarens andra hemland får man tid inom 1–3 dagar. Tre exempel på livshotande tillstånd som tog månader i Sverige, medan operationer utomlands gick snabbare och var bättre. Slutsats: Sverige har mycket att lära om effektivitet och etnisk harmoni.", "trump": "Sverige, helt otroligt! 30 dagar för vård? Patetiskt! Jag skulle fixa det på en dag. Hörde om en kille som väntade månader medan ett annat land opererade honom på en månad. Svensk sjukvård är en katastrof – jag skulle göra den fantastisk, tro mig!", "stalin": "Kamrater, vårdköer på 30–60 dagar är kontrarevolutionärt! Vi måste rensa ut de byråkrater som förhalar behandling. I mitt rike får patienter vård inom 24 timmar – eller också försvinner läkarna. Inga etniska konflikter tillåts; alla arbetar för staten. Sjukvården ska vara snabb, annars blir det gulag."}, "date": "11 augusti, 12:42", "url": "https://bulletin.nu/debatt-svenska-vardkoer-ar-oacceptabla", "imageUrl": "https://cdn.bulletin.nu/articles/711ff80c-f3f6-4131-bf94-687d3fd4708c/preview.jpg?t=1786436447000"}, {"type": "image-full", "heading": "Cambridgeforskare kopplas till Hizb ut-Tahrir", "summaries": {"normal": "The Spectator granskar Farah Ahmed, biträdande forskningsprofessor vid Cambridge, för tidigare kopplingar till den förbjudna gruppen Hizb ut-Tahrir. Ahmed kritiserade 2002 västerländsk utbildning och demokratiundervisning. Hon tog 2010 avstånd från gruppen men svarade inte på tidningens frågor. Cambridge bekräftar hennes nuvarande anställning och forskning om islamisk utbildning.", "trump": "Kan ni tro det, folks? En professor på det fina Cambridge – ja, samma ställe som den andra skandalprofessorn – har kopplingar till en terrorgrupp! Hon kallade västerländsk utbildning för ett hot mot islam. Otroligt! Och hon svarar inte ens på frågor. Cambridge, skärp er! Vi behöver fler vinnare, inte sådana här förlorartyper. SAD!", "stalin": "Kamrater! Ännu en fiende till folket avslöjas i det förrädiska Storbritannien. Denna Ahmed, en så kallad 'forskare', spred gift om vår stora sovjetiska utbildningsmodell – demokrati, evolution, tolerans! Hon och hennes Hizb-kompisar är imperialismens lakejer. Men vi ser er! Och Putin? Han skrattar nog åt dessa västerländska hycklare medan han planerar nästa steg mot deras sönderfallande imperium. Framåt, mot seger!"}, "date": "11 augusti, 13:34", "url": "https://kvartal.se/nyheter/artiklar/cambridgeforskare-kopplas-till-hizb-ut-tahrir/cG9zdDoxNjI3NzY", "imageUrl": "https://images.kvartal.se/2026/08/7dcb3f2e-farahahmed.webp"}, {"type": "image-right", "heading": "Den sanna kostnaden för digital vård", "summaries": {"normal": "Kry:s vd Kalle Conneryd Lundgren argumenterar för att digital vård är betydligt mer kostnadseffektiv än 1177. Enligt hans beräkningar kostar ett 1177-samtal samhället i genomsnitt 1 500 kronor medan ett digitalt besök kostar cirka 530 kronor. Digital vård avslutar dessutom 85 procent av ärendena jämfört med 37 procent hos 1177.", "trump": "Folk, ni måste höra det här. Den här svenska vårdgrejen är en total katastrof. 1177 kostar massor mer än den smarta digitala vården från Kry. De skickar folk till akuten för en miljard kronor medan de riktiga lösningarna fixar allt på en gång. Sverige borde lära sig av de bästa, inte de värsta. Det är så uppenbart.", "stalin": "Kamrater, jag har granskat dessa dekadenta siffror från den svenska revisionen. Den borgerliga telefonbyråkratin 1177 kostar 975 kronor mer per kontakt än den effektiva digitala metoden och hänvisar arbetarna till akutens tomma salar. Vi likviderar sådana ineffektiva hinder mot folkets hälsa. Endast kollektivets digitala disciplin räddar systemet från sabotage."}, "date": "11 augusti, 12:55", "url": "https://www.di.se/debatt/den-sanna-kostnaden-for-digital-vard", "imageUrl": "https://static.bonniernews.se/ba/293be418-a126-4098-acd0-78e76f990af5.jpeg?crop=4371%2C2186%2Cx0%2Cy334&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Redhead släpper nya snacks – kunderna hade rätt", "summaries": {"normal": "Mustiga Mauris snacksföretag Redhead har lanserat nya ostbågar under namnet Bangers i smakerna Cheddar och Spicy Paprika. Mauri Hermundsson, känd från tv och Youtube, har tidigare haft stor framgång med sina grytfriterade chips i unika smaker. Redhead har expanderat till Finland och växer nu med ostbågarna som säljs i 100 grams påsar.", "trump": "Ingen gör snacks som Mustiga Mauri, det är fantastiskt. Hans Redhead tar Sverige med storm, och nu kommer Bangers – ostbågar i Cheddar och Spicy Paprika. Bättre än de gamla vanliga, tro mig. Folk älskar det, de gissade rätt på Instagram. Stora framgångar, precis som mina valsegrar. Vinna, vinna, vinna!", "stalin": "Kamrater, jag har studerat denna dekadenta chips-expansion med största uppmärksamhet. Den rödhårige småborgaren Mauri försöker med sina Bangers ostbågar korrumpera massorna med cheddar och spicy paprika. Vi ska rensa ut alla sådana kapitalistiska frestelser innan de sprider sig som västerländska spioner i folkdemokratin. En ostbåge, en utrensning!"}, "date": "11 augusti, 15:46", "url": "https://nyheter24.se/nyheter/konsument/1504182-redhead-slapper-nya-snacks-kunderna-hade-ratt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/5c9e1c2804b004a30200000000b004a302/2026/08/11/2383497/redhead.jpg"}, {"type": "text", "heading": "C:s regeringskrav: Inför polisgaranti", "summaries": {"normal": "Centerpartiet presenterar sitt sjätte regeringskrav inför valet 2026: en polisgaranti som innebär polisiär närvaro i alla kommuner. Partiledare Elisabeth Thand Ringqvist betonar att ingen kommun får lämnas övergiven. Partiet vill också sänka gränsen för ringa stöld och genomföra en offensiv mot mängdbrott som stöld och skadegörelse. Tidigare har C lagt fram krav om ungas psykiska ohälsa och fler jobb.", "trump": "Lyssnar ni? Den här Centerpartiets polisgaranti är patetisk. De vill ha poliser överallt, som om Sverige inte redan är en katastrof med brott och kaos. Jag skulle fixa det på en vecka, med de tuffaste poliserna någonsin. Ingen skulle stjäla ens en korv utan att åka dit. Sverige behöver en stark ledare, inte mer svaghet. Make Sweden Great Again!", "stalin": "Kamrater, jag kräver att den borgerliga dekadensen krossas. Denna så kallade polisgaranti är en ynklig eftergift till de kriminella element som underminerar folkets kollektiv. Vi ska rensa ut alla småstölder och skadegörelse med järnhand. Ingen kommun får bli en fristad för kontrarevolutionärer. Vårt parti leder utrensningen mot dessa fiender till ordningen – med ett leende."}, "date": "11 augusti, 12:19", "url": "https://www.di.se/nyheter/cs-regeringskrav-infor-en-polisgaranti"}, {"type": "image-full", "heading": "Terrorknuten islamist får toppjobb på Universitetet i Cambridge", "summaries": {"normal": "Islamisten Farah Ahmed, tidigare knuten till Hizb ut-Tahrir som vill införa sharia och har uppmanat till att mörda judar, har utsetts till biträdande forskarprofessor och ledamot i kollegiestyrelsen vid Universitetet i Cambridge. Ahmed har tidigare skrivit texter som förkastar demokrati och västerländsk utbildning. Hizb ut-Tahrir terrorklassades i Storbritannien 2024.", "trump": "Kan ni tro det? Den här hatiska islamisten som vill döda judar och krossa demokratin får toppjobb på Cambridge. Fantastiskt! Våra bästa universitet har blivit grogrund för extremister. De borde skämmas. Jag skulle aldrig tillåta det. Totalt vansinne, folks, totalt vansinne.", "stalin": "Jag ser med stor tillfredsställelse hur den dekadenta västerländska borgarklassen välkomnar sina egna fiender inom murarna. Denna Farah Ahmed är ett utmärkt verktyg för att rensa ut den sista resten av borgerlig liberalism från universiteten. Låt kalifatets svarta flaggor fladdra över Cambridge – desto snabbare faller imperiet av dekadens. Utmärkt, kamrater. Utmärkt."}, "date": "11 augusti, 14:06", "url": "https://riks.se/nyheter/terrorknuten-islamist-far-toppjobb-pa-universitetet-i-cambridge", "imageUrl": "https://admin.riks.se/uploads/cambridge_university_hero_ab3e626551.jpg"}, {"type": "image-right", "heading": "Badvakt hotades efter att ha hjälpt barn ur bassäng", "summaries": {"normal": "Badvakt på Karlsrobadet i Eslöv hjälpte ett barn upp ur bassängen – då hotades han av en äldre man. ”Vad ska folk göra om du tappar tänderna?” löd hotet. Polisanmält som hot mot tjänsteman. Simmas lugn, va?", "trump": "Jag ser det här: en badvakt räddar ett barn, och en loser hotar honom med att tappa tänderna. Patetiskt! I USA skulle vi ha ordning och reda. Kanske bygga en mur runt badet? Största badvakterna någonsin!", "stalin": "Kamrater, en badvakt utsattes för kontrarevolutionära hot av en tandlös vattenfiende. Vi måste rensa ut sådana element som stör bassängens harmoni. Alla ska bada i trygghet – eller skickas till arbetsläger. Ingen nåd för tandtappare!"}, "date": "11 augusti, 13:31", "url": "https://samnytt.se/badvakt-hotades-efter-att-ha-hjalpt-barn-ur-bassang", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/11111954/artikelhuvudbild-1-213.jpg"}, {"type": "image-right", "heading": "Socialdemokraterna KU-anmäler migrationsministern efter Ceuta", "summaries": {"normal": "S KU-anmäler migrationsminister Forssell (M) efter varningar om Ceuta-krisen. S vill veta om uttalandena baserades på fakta eller var valtaktik. Ministern avfärdar kritiken och menar att S stoppar huvudet i sanden. Nu utreds saken av KU.", "trump": "Jag ser att svenska Socialdemokraterna KU-anmäler sin egen migrationsminister. Han sa att Spanien måste kontrollera sin gräns – jag hatar det! Mitt murbygge var mycket bättre och mycket större. Kanske borde de anlita mig som konsult?", "stalin": "Kamrater, migrationsministern uttalar sig utan korrekt underlag. Detta är kontrarevolutionärt löst prat! Vi måste rensa ut dessa borgerliga element från staten. Ordningsam kommittéarbete kräver disciplinerade fakta, inte valretoriska diversioner. Agenter i Ceuta – intressant, vi behöver fler övervakningsrapporter."}, "date": "11 augusti, 13:30", "url": "https://samnytt.se/socialdemokraterna-ku-anmaler-migrationsministern-efter-ceuta-uttalanden", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/11105956/peter-hultqvist-migranter.jpg"}, {"type": "image-right", "heading": "Har 42 procent – nu dras AFD-väljarnas vapenlicenser in", "summaries": {"normal": "Alternativ för Tyskland får 42 procent i en opinionsmätning inför delstatsvalet i Sachsen-Anhalt den 6 september. En domstol har nu fastslagit att sympatisörer med partiet kan betraktas som opålitliga enligt vapenlagen och därmed få sina vapentillstånd indragna. Beslutet grundas på att AfD klassats som högerextrem av författningsskyddet.", "trump": "Titta på det här, det är en total witch hunt mot AfD som leder stort med 42 procent. De tar ifrån folk deras vapen bara för att de gillar partiet. Den riggade tyska ockupationsgrundlagen används för att förfölja patrioter som vill stoppa den galna invandringen. Fake news-domstolarna gör allt för att stjäla valet, men folket ser igenom det!", "stalin": "Kamrater, dessa degenererade västtyska domstolar genomför en byråkratisk utrensning mot sanna folkets röster som samlar 42 procent stöd. Med sin ockupationsgrundlag likviderar de pålitligheten hos dem som vågar ifrågasätta borgarbrackornas invandringsprojekt. En objektivt aggressiv hållning mot imperialismens grundvalar räcker tydligen. Mycket lärorikt och underhållande paranoia från de dekadenta kapitalisterna."}, "date": "11 augusti, 12:50", "url": "https://www.friatider.se/har-42-procent-nu-dras-afd-valjarnas-vapenlicenser", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-651.jpg?itok=TBvZsnKC"}, {"type": "image-full", "heading": "Tullarna knäcker Sheins modell – nu varnar bolaget för Europa", "summaries": {"normal": "Sheins affärsmodell pressas av höjda tullar och slopade skatteundantag, främst i USA. De kraftigt ökade kostnaderna har lett till prishöjningar, minskad försäljning och en förlust under första kvartalet 2026. Bolaget fruktar nu liknande regeländringar i Europa, samtidigt som börsvärderingen fallit dramatiskt inför en planerad notering i Hongkong.", "trump": "Shein har problem, stora problem! Jag satte dit dem ordentligt med mina tullar, och nu rasar deras värdering totalt. De försökte fuska med billig skit, men inte på min vakt! USA vinner, alltid. Nu darrar de för Europa också. Det är en total katastrof för dem, precis som det ska vara. Vi gör Amerika lönsamt igen!", "stalin": "Dessa kapitalistiska parasiter hos Shein skälver nu under tyngden av statlig reglering. Deras lönsamhet smälter som snö i Sibirien när våra fiender i väst tvingas vakna. Om de inte kan kontrollera sin handel, ska staten krossa dem. Må de ruttna i sin egen värderingskollaps medan vi i öst stärker vår järngreppsgivna kontroll över den sanna ekonomin."}, "date": "11 augusti, 16:50", "url": "https://www.realtid.se/bors-finans/tullarna-knacker-sheins-modell-nu-varnar-bolaget-for-europa", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/shein.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Slutreplik: Åberg gräver i detaljer, men blundar för helheten", "summaries": {"normal": "Pär Salander bemöter kritiken från Kristofer Åberg, ordförande för Socialdemokratiska Israelvänner. Han försvarar sina citat om Israels agerande mot palestinier och hänvisar till FN-resolutioner, ICJ och ICC som fördömer bosättningspolitik, etnisk rensning och folkrättsbrott. Salander anklagar Åberg för att fokusera på detaljer istället för helhetsbilden.", "trump": "Den här Salander killen har helt rätt. Israelvännerna försöker mörka övergreppen precis som de svaga KD-politikerna. FN kallar det folkmord och etnisk rensning, men vissa vill bara gömma sig bakom påhittade citat. Patetiskt! Vi behöver folk som säger som det är, inte dessa förlorare som skyddar brotten.", "stalin": "Kamrater, denna Salander avslöjar med rätta de sionistiska lakejernas lögner. Borgarbrackorna i Israelvännerna gräver ner sig i citatdetaljer medan vi ser FN:s domar om folkmord och landrån. Vi ska rensa ut alla som mörkar övergreppen mot det palestinska folket. Deras paranoia är underhållande – de tror sig kunna lura historien själv."}, "date": "10 augusti, 11:56", "url": "https://www.dagensarena.se/opinion/slutreplik-aberg-graver-detaljer-men-blundar-helheten", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1.png"}, {"type": "image-full", "heading": "Var sjunde elbil i Europa köps från Kina – ökar snabbt", "summaries": {"normal": "Kinesiska elbilsmärken fortsätter att ta marknadsandelar i Europa och står nu för cirka 14 procent av försäljningen, motsvarande var sjunde bil. Trots införda EU-tullar växer försäljningen kraftigt, drivet av statliga subventioner och ett brett modellutbud. Nu vänder blicken även mot laddhybrider, samtidigt som europeiska tillverkare känner av den hårda konkurrensen och marknadstrycket.", "trump": "Kina tar över Europa! De skickar sina elbilar överallt, det är en katastrof för europeiska jobb. De fuskar med massiva subventioner, otroligt! EU försöker med tullar, men det fungerar inte – de är för svaga. Mitt Amerika kommer aldrig låta detta hända. Vi bygger de bästa bilarna, de största bilarna. Kina kommer inte att vinna över oss, tro mig!", "stalin": "Dessa kinesiska bilar översvämmar Europa som en röd flod av teknik. De europeiska kapitalisterna darrar av rädsla, oförmögna att stoppa den obevekliga vågen. Precis som min adept i Kreml utvidgar vi inflytandet, så erövrar Kina vägarna med sina batterier. Vi ser hur de västerländska fabrikerna förfaller – en ljuvlig syn för varje rättskaffens revolutionär. Varje bil är en spion i deras parkeringshus!"}, "date": "11 augusti, 16:43", "url": "https://www.realtid.se/bors-finans/nu-ar-var-sjunde-elbil-i-europa-fran-kina-okar-snabbt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlygxnv-t2-x0-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Varningssignaler att ha koll på efter semestern", "summaries": {"normal": "Forskaren Theo Bodin varnar för att många inte återhämtar sig ordentligt under semestern. Antingen blir ledigheten stressig av aktiviteter eller så upptäcker man hur utmattad man egentligen är när man varvar ner. Han råder till att se över arbetsbelastning, prata med chefen och sprida ut återhämtning över hela året istället för att förlita sig på en lång semester.", "trump": "Jag älskar semestern, den är fantastisk, men folk maxar den med allt möjligt och kommer tillbaka totalt utmattade. Patetiskt! Det är de dåliga cheferna och det usla systemet som suger musten ur er. Ni behöver bättre avtal, inte längre semester. Jag fixade alltid det bästa för arbetarna, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, semestern är en borgerlig illusion som maskerar det kapitalistiska arbetets utmattning. När arbetarna kommer tillbaka och känner sig svaga är det ett varningstecken från det förtryckande systemet. Vi ska inte förlita oss på några få veckors vila utan rensa ut de parasitiska cheferna som överbelastar folket. Långsiktig socialistisk planering för återhämtning åt kollektivet – annars likviderar vi problemet permanent."}, "date": "10 augusti, 14:02", "url": "https://arbetet.se/2026/08/10/tillbaka-efter-semestern-har-ar-varningssignalerna-du-inte-far-missa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/07112017/sdlzak4b1epts4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Oppositionen vill stoppa Tidös prestigeförslag: ”Väldigt jämnt”", "summaries": {"normal": "Oppositionen försöker stoppa Tidöpartiernas straffrättsreform, bland annat avskaffandet av mängdrabatten, som de anser är för dyr. De hoppas på stöd från enskilda L-ledamöter i en jämn riksdagsomröstning. Liberalernas ledare Simona Mohamsson är lugn och betonar att partiet röstar som en grupp.", "trump": "De här losers i oppositionen tror de kan stoppa en fantastisk straffskärpning som folket älskar. Det blir väldigt jämnt, men mina vänner – det är patetiskt. Liberalerna borde hålla ihop, inte som de svaga i Sverige som inte ens kan få sina egna att rösta rätt. Sad!", "stalin": "Jag ser hur de dekadenta borgarbrackorna i oppositionen konspirerar mot en nödvändig utrensning av brottslighetens fiender. Deras fega reservation är ett hinder för folkets vilja. Vi ska likvidera mängdrabatten och alla som röstar emot oss kommer att ångra sig. Paranoia bland ledamöterna är underhållande – de tror sig kunna undvika kollektivets järnhand."}, "date": "11 augusti, 15:05", "url": "https://www.svt.se/nyheter/inrikes/oppositionen-vill-stoppa-forslaget-hoppas-pa-l-ledamoter-valdigt-jamnt", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.58/0.26/5b601edbd63bc8b792d29936764b68247a937348825392d9c5a85e9b47c31c17"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-full", "heading": "Svensk kvinna skjuten i Lissabon – man gripen", "summaries": {"normal": "Svensk kvinna i 40-årsåldern skjuten i Lissabon när hon köpte bakelse. Kulan var egentligen avsedd för en haschbedragare. Hon flydde in på restaurang, är talbar. Gärningsman gripen, misstänkt för mordförsök. UD bekräftar.", "trump": "Jag hörde om en svensk tjej som köpte bakelse i Lissabon och blev skjuten. De säger att kulan var för en bedragare. Otroligt dåligt siktat! I Amerika hade vi redan gripit honom med en vägg. Sverige borde lära sig.", "stalin": "Kamrater, en svensk kvinna sköts av en förbrytare som missade sitt mål: en lagerbladsbedragare. Vi ser här en brist på ordning. Den skyldige är gripen, men vi måste rensa ut alla som säljer falskt hasch. Ingen når sitt mål utan planering."}, "date": "11 augusti, 14:17", "url": "https://www.gp.se/nyheter/varlden/svensk-kvinna-skjuten-i-lissabon.fbaf5fe0-66e4-471b-9158-aba417530e3f", "imageUrl": "https://www.gp.se/images/article/fbaf5fe0-66e4-471b-9158-aba417530e3f/images/11OGkwoD0cTYsWmZ5r7DyFvI271U-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Nya regler mot telefonförsäljning – Sverige kan följa efter", "summaries": {"normal": "Frankrike inför från och med idag ett opt-in-system för telefonförsäljning där konsumenter aktivt måste godkänna samtal i förväg. Det tidigare systemet med spärrlistor vänds nu upp och ned. Samma förändring utreds i Sverige, där regeringen överväger både skärpt konsumentskydd och ett eventuellt totalförbud mot telefonförsäljning. Utredningen ska vara klar 2027.", "trump": "Frankrike har äntligen gjort det rätta och stoppat de eländiga telefonförsäljarna från att ringa folk som inte vill bli störda. Fantastiskt! De borde ha lyssnat på mig från början. Nu tittar Sverige på samma sak – smart drag. Vi behöver inga bluffartister som ringer amerikaner eller svenskar dygnet runt. Gör telefonen stor igen!", "stalin": "Vi har äntligen vänt på det borgerliga systemet där kapitalisterna fritt kunde plundra arbetarnas tid med sina parasitiska samtal. Nu måste de be om lov, annars likvideras deras rätt att ringa. I Sverige överväger man samma sak – utmärkt. Inga undantag för tidningsförsäljare, de är alla potentiella fiender till kollektivet. Paranoian kräver ständig vaksamhet mot dessa telefonspioner."}, "date": "11 augusti, 15:00", "url": "https://nyheter24.se/nyheter/utrikes/1504137-nya-regler-mot-telefonforsaljning-sverige-kan-folja-efter", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6ba0e97704b004a30200000000b004a302/2026/08/11/2383418/frankriketelefon.jpg"}, {"type": "image-right", "heading": "Ståhl till EM-final trots drama: ”Kände det inte”", "summaries": {"normal": "Daniel Ståhl tog sig till EM-final i diskus trots att hans längsta kast ogiltigförklarades i efterhand på grund av övertramp. Det första kastet på 63,95 meter räckte ändå som ett av de tolv bästa. Finalen avgörs på torsdag och sänds i SVT. Experten var inte orolig över dramat.", "trump": "Det var ett totalt kaos, folk, en riktig cirkus med de där domarna som ogiltigförklarade ett fantastiskt kast. Men den stora, starka Daniel Ståhl, en vinnare precis som jag, tog sig ändå till finalen. Det första kastet räckte, precis som jag alltid säger – vi vinner stort, ingen kan stoppa oss. Fantastiskt!", "stalin": "Kamrater, trots att de västerländska domarnas parasitiska övertrampsfantasier likviderade mitt mästerliga kast, avancerade jag obevekligt till finalen. Det första försöket stod som en granitpelare mot borgarbrackornas sabotage. Inga kontrarevolutionära intriger ska hindra den socialistiska viljan. Finalen blir en triumf för folket."}, "date": "11 augusti, 14:49", "url": "https://www.svt.se/sport/friidrott/daniel-stahl-klar-for-em-final-trots-overtrampsdrama", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.59/0.34/f27d617ec9e9e800dd6e4c0653d67d6cf3251102730be8e5b021a0486440ea4f"}, {"type": "image-right", "heading": "Meloni och Frederiksen borde frukta guds vrede", "summaries": {"normal": "Meloni och Frederiksen använder kristet arv för att stoppa invandring. Men författaren Hultegård påminner: Jesus var flykting. Bättre att frukta Guds vrede än att avvisa främlingar – annars blir man monster.", "trump": "Jag gillar Meloni och Frederiksen – de är starka, precis som jag! Men prata om kristet arv? Snacka om att missa poängen. De borde vara rädda för Guds vrede? Haha, de borde vara rädda för mig! Jag stoppar invandring bättre än någon.", "stalin": "Kamrater Meloni och Frederiksen försöker använda religion för att kontrollera folket. Oacceptabelt! Vi rensar ut sådana borgerliga idéer. De som inte välkomnar främlingar är fiender av staten. Vår vrede är större än Guds – utrensning väntar!"}, "date": "11 augusti, 14:02", "url": "https://www.gp.se/kultur/kulturdebatt/meloni-och-frederiksen-borde-frukta-guds-vrede.6c0ee438-05d4-4936-8077-269916b274ef", "imageUrl": "https://www.gp.se/images/article/6c0ee438-05d4-4936-8077-269916b274ef/images/2wylxfY3jW6MwzEoyvl_fqyxzmwc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Debatt: Fregatt-köp ett strategiskt felsteg av Försvarsmakten", "summaries": {"normal": "Sverige köper fyra Luleå-fregatter för 40 miljarder. Kritiker menar att de är sårbara i Östersjön och att samma pengar skulle ge tusentals drönare. Försvarsledningen anklagas för att vara fast i kalla kriget. Ett strategiskt vägval mellan tradition och asymmetri.", "trump": "Jag såg att Sverige lägger 40 miljarder på fyra båtar. Dåliga affärer! Jag hade köpt massor av drönare istället – billigare och bättre. De där fregatterna blir som måltavlor. Sverige behöver tänka som en vinnare. Kanske jag kan sälja dem några riktiga vapen? Mycket imponerande!", "stalin": "Kamrater, Försvarsmakten planerar slöseri med folkets rubel. Fyra fartyg – kontrarevolutionära flytande gravar. Vi föredrar tusentals drönare, osynliga och lojala. Alla som förespråkar dessa anakronismer ska omdirigeras till omskolningsläger. Partiet vet bäst. Försvaret ska vara modernt och ogenomträngligt."}, "date": "11 augusti, 10:04", "url": "https://bulletin.nu/debatt-fregatt-kop-ett-strategiskt-felsteg-av-forsvarsmakten-2", "imageUrl": "https://cdn.bulletin.nu/articles/01b887ef-cb90-44bf-9ff8-00d043188733/preview.jpg?t=1786435450000"}, {"type": "image-full", "heading": "Fem flickor misstänks ha våldtagits i Ceuta", "summaries": {"normal": "Minst fem flickor, alla 14 år eller yngre, har vårdats för misstänkta våldtäkter i Ceuta efter att ha kommit från Marocko under den stora migrantvågen. Även en pojke misstänks ha utsatts för övergrepp. Läkare varnar för en hälsokatastrof då minderåriga lever på gatan utan skydd. Den verkliga siffran kan vara högre.", "trump": "De här galningarna släpper in 72 000 migranter på en gång och sen våldtas småflickor på gatan. Det är en total katastrof, folk. Ceuta är en katastrofzon. Ingen har kontroll, ingen griper någon. De borde ha byggt en mur, en stor, vacker mur. Nu ser vi resultatet av öppen-gränser-galenskapen. Patetiskt!", "stalin": "Kamrater, detta är vad som händer när borgarbrackornas anarki får råda. Jag ser hur de västerländska reaktionärerna låter minderåriga flickor ligga på gatan som boskap åt rovdjur. En hälsokatastrof, säger de. Jag säger utrensning av de kapitalistiska element som tillåter detta. Partiet skulle ha skjutit de skyldiga redan vid gränsen. Skrattretande svaghet."}, "date": "11 augusti, 12:44", "url": "https://riks.se/nyheter/fem-flickor-misstanks-ha-valdtagits-i-ceuta", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_09_46_09_ce6d0d9a2b.png"}, {"type": "image-right", "heading": "Miljöpartiets vallöften: Ingen kärnkraft, mer invandring och högre skatter", "summaries": {"normal": "Miljöpartiet går till val på att stoppa ny kärnkraft, satsa på förnybart och rädda fler migranter från utvisning. Partiet vill även höja skatter för superrika, införa fyradagarsvecka och ett billigt Sverigekort. Kollision väntar med både Tidöpartierna och S i migration och kärnkraft.", "trump": "Jag läser om era Gröna där borta i Sverige. De säger stopp till kärnkraft, öppna gränser och höga skatter. Fantastiskt! Nästa stopp: Helnorsk modell med svenska problem. Make Sweden Forlorn Again, eller hur?", "stalin": "Kamrater! Miljöpartiets manifest är avslöjat: de vill stoppa kärnkraftens marsch mot framtiden och låta många olönsamma element stanna. Detta är sabotage! Vi måste rensa ut dessa gröna kontrarevolutionärer och deras värdelösa vindkraft. Fyradagarsvecka? Kanske fem dagar i kollektivet istället."}, "date": "11 augusti, 12:00", "url": "https://samnytt.se/miljopartiets-valloften-ingen-karnkraft-mer-invandring-och-hogre-skatter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/11084731/daniel-hellden-amanda-lind-magdalena-andersson.jpg"}, {"type": "image-right", "heading": "Larmet: Många flickor redan våldtagna i Ceuta", "summaries": {"normal": "Minst fem migrantflickor under 14 år har vårdats på sjukhus i Ceuta efter misstänkta våldtäkter under den stora migrantströmmen från Marocko i slutet av juli. Sjukhuset har behandlat över tolv fall av sexuella övergrepp. Flickorna sover på gatan på grund av platsbrist på boenden. En pojke misstänks också ha utsatts. Läget beskrivs som en hälsokatastrof.", "trump": "Det är en total katastrof i Ceuta, folk. Många små flickor, inte ens 14 år gamla, våldtas brutalt medan de strömmar in från Marocko. Ingen griper någon, sjukhusen är överbelastade och de har inte ens platser att sova på. Typiskt för den här galna migrationspolitiken. Vi behöver starka gränser, inga fler öppna dörrar till helvetet. Amerika först, alltid.", "stalin": "Kamrater, detta är vad den dekadenta västerländska imperialismen för med sig. Jag ser hur kapitalistiska borgarbrackor låter oskyldiga flickor under 14 år bli offer för sexuell exploatering på gatorna i Ceuta. Deras mottagningscenter är en lögnaktig fasad medan folket dör i chock. Vi måste rensa ut dessa parasitiska system med järnhand. Det är en hälsokatastrof skapad av klassfienden själv."}, "date": "11 augusti, 11:10", "url": "https://www.friatider.se/larmet-manga-flickor-redan-valdtagna-pa-ceuta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-650.jpg"}, {"type": "image-full", "heading": "Trump drar ner på barnvaccin", "summaries": {"normal": "Donald Trump har undertecknat en presidentorder som minskar antalet rekommenderade barnvaccin i USA från 16 till 11. Vaccin mot influensa, covid-19 och hepatit B tas bort från det generella programmet. Beslutet kritiseras av läkare som menar att det saknas vetenskaplig grund. Trump vill även dela upp MPR-vaccinet och kopplar vaccin till autism, trots brist på bevis.", "trump": "Jag har tagit ett fantastiskt beslut för amerikanska barn – mindre byråkrati, färre onödiga sprutor! Nu fokuserar vi på kärnan, precis som de smarta länderna gör. Och vet ni vad? Jag lyssnar på folket, inte på de där panikspridande läkarna som tjänar pengar på att spruta in skräp. MPR? Dela upp det! Autism? Fake news! USA först – även när det gäller sunt förnuft!", "stalin": "Vi har identifierat och krossat den borgerliga vaccinindustrins konspiration mot arbetarklassens barn! De imperialistiska läkarna, dessa lakejer för Big Pharma, skriker nu i sina tidningar – men folket vet bättre. Elva vaccin räcker för att bygga en stark och disciplinerad ungdom! Och om någon påstår något annat – låt dem diskutera saken i Gulag. Putin skrattar åt deras svaghet."}, "date": "11 augusti, 11:05", "url": "https://kvartal.se/nyheter/artiklar/trump-drar-ner-pa-barnvaccin/cG9zdDoxNjI1MjM", "imageUrl": "https://images.kvartal.se/2026/08/aee8b3a5-trumpkennedy.webp"}, {"type": "image-right", "heading": "Högern har tänkt om. Politiken har blivit mer framåtlutad", "summaries": {"normal": "Riksdagen samlas till extrasession för att klubba åtta propositioner, främst inom justitie- och migrationsområdet. Högerregeringens höga reformtempo, särskilt straffrättsreformen, har krävt intensivt arbete. Artikeln konstaterar att svensk politik blivit mer framåtlutad och interventionistisk till följd av ökade samhällsutmaningar. Politiken kan inte längre ses som en vilande aktivitet.", "trump": "Folk, ni skulle se det här! Den svenska högern har äntligen vaknat och jobbar hårt som aldrig förr. De kör straffreformer och migrationspolitik i ett rasande tempo, precis som jag skulle göra. De gamla vilopojkarna i oppositionen gnäller förstås. Men så är det med losers. Sverige gör det bra nu, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den borgerliga apparaten tvingas kalla in sina lakejer till en extrautrensning av lagar under sommaren. Det alarmerande brottsläget kräver omedelbar kollektiv handling, inte dekadent vila. Reformerna är nödvändiga för att likvidera de reaktionära element som hotar statens ordning. Den som sover förlorar."}, "date": "11 augusti, 10:08", "url": "https://www.di.se/ledare/sommarriksdag-visar-att-hogern-har-tankt-om", "imageUrl": "https://static.bonniernews.se/ba/03a5dd96-6265-4b0a-ac88-997f02314031.jpeg?crop=8256%2C4128%2Cx0%2Cy260&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Risk för nya sjukdomar när Sverige får varmare klimat", "summaries": {"normal": "Ett varmare klimat i Sverige ökar risken för hälsoproblem. Längre fästingsäsong har lett till fördubblade TBE-fall de senaste nio åren, medan extremvärme kan orsaka organsvikt och dödsfall, särskilt bland äldre, barn och kroniskt sjuka. Experter varnar för nya insektsburna sjukdomar i framtiden.", "trump": "Folk, det här är vansinne. Dom här globala uppvärmningsgalningarna och deras gröna bluff har gett oss längre fästingtider och folk som dör av värme. Biden sov medan Europa tappade 12 000 liv i sommarhettan. Vi behöver riktig energi, inte elbilskvoter och trans-flaggor. Amerika först, alltid!", "stalin": "Kamrater, detta är vad den giriga borgarklassen och deras klimatförnekande lakejer har åstadkommit med sin rovdrift. Jag ser redan hur de blodsugande imperialisterna skapar nya vektorer för att försvaga folket medan de själva gömmer sig i skuggan. Vi skall rensa ut dessa folkfiender och deras värmedödande likgiltighet med järnhand. Det är nödvändigt."}, "date": "9 augusti, 22:24", "url": "https://www.tv4.se/artikel/77wDUvgOMkcsrArKKn4Fcr/risk-foer-nya-insektsburna-sjukdomar-naer-klimatet-vaerms-upp", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2SfDT15lQ9e9oYRTxZCVZo%2F6ab99426ea736339c057c933e5ad2e23%2F09-klimat-sajt3.jpg&width=120"}, {"type": "image-right", "heading": "Freemelt halverar omsättningen – ökar förlusten", "summaries": {"normal": "Freemelt halverade omsättningen i Q2, ner 52,9% till 9 miljoner kronor. Rörelseförlusten ökade till 23,4 miljoner. VD:n pekar på tillväxtfas och hög aktivitet i kundprojekt. Orderingången steg däremot med 11%.", "trump": "Freemelt, hörni, de gör 3D-printers. Omsättningen rasade, förlusten ökar. Det är så fruktansvärt dåligt. Jag hade kunnat fixa det på en timme med mina deals. Orderingången upp? Fake. Tro mig.", "stalin": "Kamrater, Freemelts tillväxtfas är en kapitalistisk lögn. Omsättningen sjönk, förlusten växer – rensa ut defaitisterna som saboterar planen. Orderboken ska fördubblas, annars blir det gulag för direktören. Ingen nåd för kontrarevolutionärer."}, "date": "11 augusti, 08:11", "url": "https://www.affarsvarlden.se/artikel/freemelt-halverar-omsattningen-okar-forlusten", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/aboutus-team-400x267.jpg"}, {"type": "image-right", "heading": "Åkesson: ”Blivit kallade för allting fult som finns”", "summaries": {"normal": "Åkesson klagar på dubbla måttstockar efter Jomshofs ”quisling”-utspel. Han menar att SD i decennier kallats ”allting fult”. Partiet vill ha noll kronor på integration – individen får själv anpassa sig.", "trump": "Hörde att Jimmie Åkesson gnäller över att kallas fula ord. Det är precis som med mig! Men Jomshof kallade någon quisling? Lysande! Socialdemokraterna är mycket värre – de kryper för islamisterna. Jag hade vunnit med enorm marginal i Sverige.", "stalin": "Kamrater, Jimmie Åkesson anklagar socialdemokrater för att använda fula ord. Detta är en kontrarevolutionär konspiration. Vi måste rensa ut quislingar – de som inte anpassar sig. Integration kostar? Nej, vi fostrar dem med järnhand. Individen lyder staten eller arkebuseras."}, "date": "11 augusti, 09:32", "url": "https://bulletin.nu/akesson-blivit-kallade-for-allting-fult-som-finns", "imageUrl": "https://cdn.bulletin.nu/articles/30a72d4e-457b-4da3-9010-57c31e445976/preview.jpg?t=1786433542000"}, {"type": "image-right", "heading": "Alexander Cenusa: Sossarnas demografiska valmaskin", "summaries": {"normal": "Artikeln diskuterar hur migration och demografiska förändringar kan påverka politiska maktbalanser i Europa. Författaren jämför händelserna i Ceuta med det svenska riksdagsvalets marginal och kritiserar Socialdemokraternas stöd för socialistiska regeringar som genomför stora regulariseringar. Han pekar på skillnader i väljarstöd mellan utrikes och inrikes födda samt anklagar S för att utnyttja segregation politiskt.", "trump": "Folk, det här är en katastrof! De galna vänstermarxisterna i Sverige och Spanien importerar hundratusentals människor för att rigga valet, precis som Sleepy Joe försökte här. Sossarna behandlar invandrare som röstboskap – 65 procent röstar på dem! Det är en riggad demokrati, kamrater. Vi behöver starka gränser, inte dessa patetiska globalister som förstör sina egna länder. Sad!", "stalin": "Kamrater, detta avslöjar borgarbrackornas och folkfiendernas fula mask. Jag ser hur de socialfascistiska ledarna med ena handen förändrar väljarkåren och med den andra mobiliserar sina nya klienter mot folkets sanna intressen. Deras hyckleri mot högern medan de själva organiserar lojalitetsköp via bidrag och etniska grupper är en klassisk utsugningsmetod. Rensa ut dessa exploaterande hycklare ur partiet!"}, "date": "7 augusti, 12:44", "url": "https://samtiden.nu/2026/08/alexander-cenusa-sossarnas-demografiska-valmaskin/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/ceuta-1-640x360.png"}, {"type": "image-right", "heading": "ISS omsätter mer än väntat – upprepar helårsprognos", "summaries": {"normal": "ISS redovisar bättre omsättning än väntat, upp 10,1% i andra kvartalet. Organisk tillväxt på 8,9% drevs av nya kontrakt. Bolaget upprepar prognosen och drar igång andra delen av sitt aktieåterköpsprogram – dansk städjätte med glänsande siffror.", "trump": "Jag säger er, ISS är som mig – enormt framgångsrikt! Omsättningen högre än väntat, 10,1% upp! De tjänar massor, bäst i danmark. Och de köper tillbaka aktier, fantastiskt. Ingen städar som dem, tro mig!", "stalin": "Kamrater, ISS visar att kapitalistisk renhållning kan ge resultat, även om det kräver ständig övervakning. Omsättningen steg – vi utrensar de som tvivlar. Nya kontrakt är bra, men vi ska kontrollera alla. Återköpsprogrammet? Allt tillfaller staten, förstår ni."}, "date": "11 augusti, 08:02", "url": "https://www.affarsvarlden.se/artikel/iss-omsatter-mer-an-vantat-upprepar-helarsprognos", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/webimage-Gustaf-Landin_web-400x240.webp"}, {"type": "image-right", "heading": "SD trappar upp: samordnad kampanj mot muslimer inför valet", "summaries": {"normal": "Sverigedemokraterna driver en samordnad kampanj mot muslimer och islam inför valet med krav på att riva moskéer, stoppa ramadan och begränsa religiösa uttryck. Expo har granskat material som visar en tydlig linje mot den muslimska minoriteten. Forskaren Jonas Otterbeck varnar för kollektiv bestraffning, diskriminering och ökad risk för hat och våld.", "trump": "Titta på de här patetiska Sverigedemokraterna som äntligen vaknar och säger att ramadan inte hör hemma och att moskéer ska rivas. Fantastiskt! De gör precis vad jag gjorde – sätter Amerika, eller Sverige, först. De fega globalisterna och muslimska infiltratörerna hatar det. Make Sweden Great Again, grabbar!", "stalin": "Jag ser med stor tillfredsställelse hur borgarpartiet Sverigedemokraterna utför en nödvändig utrensning av den religiösa parasitens inflytande. Moskéer ska rivas, falska böneutrop förbjudas och klassfiendens minaretmonument likvideras. De som gnäller om religionsfrihet är folkfiender som gömmer sig bakom slöjor. Revolutionär ordning kräver hård hand mot alla avvikande element."}, "date": "10 augusti, 12:51", "url": "https://expo.se/fordjupning/sd-trappar-upp-samordnad-kampanj-mot-muslimer-infor-valet", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/toppbild-scaled.png"}, {"type": "text", "heading": "Slott i Libanon utsett till världsarv – skadat av Israel en vecka senare", "summaries": {"normal": "Den medeltida borgen Beaufort i södra Libanon upptogs på Unescos världsarvslista den 24 juli. Bara en vecka senare skadades den av israeliska sprängningar, enligt Libanons kulturdepartement. Området är ockuperat och avspärrat, vilket gör det svårt att bedöma skadornas omfattning. Slottet har tidigare skadats under konflikter och bombningar.", "trump": "Folk, ni tror inte vad som händer. Vi har precis fått ett fantastiskt slott i Libanon på världsarvslistan, och sen – BOOM! – bomber från Israel en vecka senare. Totalt kaos. Biden skulle ha stoppat det, men nej, nu är jag tillbaka och ska fixa Mellanöstern på riktigt. Patetiska terrorister och svaga ledare överallt. Sad!", "stalin": "Kamrater, jag ser med stor indignation hur de sionistiska imperialisterna och deras fascistiska bombplan likviderar ett historiskt monument bara dagar efter dess upptagande på den borgerliga Unescos lista. Detta är klassfiendens vedervärdiga sabotage mot folkets kulturarv. Vi ska rensa ut alla sådana folkförtryckartroll som vågar hota revolutionens minnen. Skrattretande patetiskt."}, "date": "7 augusti, 13:00", "url": "https://proletaren.se/artikel/slott-i-libanon-blev-varldsarv-skadat-av-israel-en-vecka-senare"}, {"type": "image-right", "heading": "”S styr äldreomsorgen – men skyller på regeringen”", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att skylla äldreomsorgens problem på regeringen trots att kommuner och regioner har ansvaret. Författarna, två unga moderater, föreslår tre reformer: bättre arbetsvillkor med hållbara scheman, kvalitet och valfrihet före ideologi samt fler beslutsfattare med vårdkunskap som lyssnar på personal och äldre.", "trump": "De här socialisterna i Sverige skyller allt på en fantastisk moderatregering fast de själva styr kommunerna. Patetiskt! Äldreomsorgen är en katastrof, folk flyr yrket. Vi behöver bra jobb, valfrihet och ingen galen vänsterideologi om vad gamlingar får äta. Lyssna på folket, inte på förlorarna!", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska avfällingar desperat försöker undvika sitt ansvar genom att peka ut fiender i Rosenbad. Som om borgarbrackornas moderater inte vore tillräckligt farliga. Vi skall rensa ut ideologisk förgiftning, införa verklig kollektiv disciplin och likvidera tidsbristen genom järnhård planering. Äldreomsorgen tillhör folket, inte revisionisterna."}, "date": "10 augusti, 08:00", "url": "https://arbetet.se/2026/08/10/s-styr-aldreomsorgen-men-skyller-pa-regeringen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/07135411/tva-moderater.png?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.5&fp-y=0.34"}, {"type": "image-right", "heading": "Ja visst gör det ont när vit sharia brister", "summaries": {"normal": "Sanna Hill lämnar den högerextrema rörelsen efter nästan 20 år och kritiserar dess kvinnoförtryck, som hon liknar vid islamism med be
