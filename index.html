 hatar det egentligen. Kamma er och gör något vettigt istället för att gnälla om klimatet medan Kina skrattar hela vägen till banken. Patetiskt!", "stalin": "Kamrater, denna dekadenta film blottar borgarklassens fega spel. De lovordar de unga aktivisterna med ihåliga hejarop medan de själva gömmer sig bakom bekvämlighetens murar. Inga utrensningar av lathet och individualism här – endast tomma ord. Jag ser klassfiendens psykologiska sabotage: de förvandlar plikt till wellness och skam till något förbjudet. Arbetarna måste mobiliseras, inte matas med lögner om roligt engagemang. Rensa ut de folkfiender som vägrar plakatets plikt. Revolutionen kräver handling, inte fnissande poddar."}, "date": "11 juni, 10:55", "url": "https://www.flamman.se/kamma-er-och-skaffa-ett-plakat/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/klimatkamp-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Företagen flyr otryggheten i Kista – S öser in 100 miljoner", "summaries": {"normal": "Stockholms stad, under ledning av socialdemokratiska finansborgarrådet Karin Wanngård, avsätter 100 miljoner kronor för att stärka Kista och locka tillbaka företag. Beslutet kommer efter att företag som Ericsson lämnat området på grund av otrygghet. Kritiker pekar på att problemen främst beror på gängkriminalitet och hög andel utländsk bakgrund i närliggande områden som Rinkeby och Tensta. Hur pengarna ska användas och finansieras är oklart, och många ser satsningen som otillräcklig.", "trump": "Folk, ni skulle inte tro det, men den här galna socialisten Wanngård i Stockholm tror att hon kan köpa tillbaka företag till Kista med hundra miljoner av era skattepengar. Det är en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "text", "heading": "Bageri döms för dödsolycka – får betala en miljon i böter", "summaries": {"normal": "Bageriet Delibake döms att betala en miljon kronor i företagsbot och drygt 260 000 kronor i skadestånd till anhöriga efter att en anställd klämdes till döds i en maskin för två år sedan. Tingsrätten i Örebro anser att företaget brustit i säkerhetsåtgärder genom oaktsamhet. Åklagaren hade yrkat på 1,5 miljoner i bot, men domstolen bedömde det inte som grovt brott. Delibakes advokat lutar åt att överklaga domen.", "trump": "Folk, ni skulle se det här – ett totalt misslyckande! Det här bageriet Delibake, de har ingen aning om hur man driver ett företag. En kille dör i en maskin för att de inte stängde av strömmen? Patetiskt! De får bara en miljon i böter och lite skadestånd, borde ha varit mycket mer. Jag skulle ha fixat det – de bästa säkerhetsreglerna, de bästa maskinerna, ingen skulle dö på mitt bageri. Det är en skam, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa kapitalistiska maskinborgarbrackor på Delibake nu tvingas betala en miljon i bot och över en kvarts miljon till de sörjande arbetarnas anhöriga. Deras omedvetna oaktsamhet var i själva verket en medveten sabotagehandling utförd av dolda fiender inom partiet – nej, inom bageriet! Vi ska rensa ut alla fotocellmanipulerande trotskister och likvidera deras farliga instruktioner. Inga maskiner får röra sig fritt under mitt vakande öga. Det är en seger för kollektivet, fast det kunde ha varit fler utrensningar."}, "date": "11 juni, 11:16", "url": "https://arbetet.se/2026/06/11/man-klamdes-till-dods-pa-bageri-delibake-tvingas-betala-en-miljon-i-boter/"}, {"type": "image-right", "heading": "Bättre actionfilm än så här kan det knappast bli", "summaries": {"normal": "Recensenten Jon Andersson hyllar actionfilmen The Furious som brutalt, blodigt och extremt välgjord. Filmen följer Wang Wei och journalisten Navin som slår sig samman för att rädda sina kidnappade anhöriga från ett kriminellt syndikat. Berättelsen är enkel, men fokus ligger på de stilistiskt avancerade och välkoreograferade stridsscenerna som överträffar många Hollywood-produktioner. Slutstriden på polisstationen lyfts fram som en av de bästa actionscenerna på film. Det är inget för kräsmagade, men en topprestation inom Hong Kong-actiongenren.", "trump": "Den här filmen The Furious är otrolig, folk, verkligen den bästa actionfilmen på länge. De koreograferade slagsmålen är så bra att Tom Cruise blir grön av avund, tro mig. Den är brutalt välgjord, mycket bättre än de flesta Hollywood-skräpfilmerna. Syndikatet kidnappar barn, hemskt, men våra hjältar krossar dem totalt. Slutstriden på polisstationen är en fullkomlig vinnare. Bättre än Mission Impossible och Bond, de ser ut som barnfilmer bredvid. Se den, ni kommer älska den, en fantastisk åktur.", "stalin": "Kamrater, denna film The Furious visar med full kraft hur vi måste likvidera de dekadenta brottssyndikaten som vågar kidnappa våra barns framtid för att driva sitt slavarbete under borgarbrackornas tysta godkännande. Jag ser hur de korrumperade polischeferna, dessa parasitiska fiender till folket, förtjänar en grundlig utrensning. De välkoreograferade striderna mot kapitalisternas lakejer är en glädje för alla rättänkande. Slutstriden på polisstationen borde inspirera oss att rensa ut alla kontrarevolutionära element. En utmärkt propagandafilm mot borgarklassen, fast blodigare än våra egna utrensningar. Se den och lär er."}, "date": "11 juni, 10:39", "url": "https://www.dagensarena.se/innehall/battre-actionfilm-an-sa-har-kan-det-knappast-bli/", "imageUrl": "https://www.dagensarena.se/files/2026/06/the-furious-1-300x157.jpeg"}, {"type": "image-right", "heading": "Amerikanska anfall mot Iran möts av motattacker", "summaries": {"normal": "Striderna i Mellanöstern eskalerar med amerikanska attacker mot Iran och iranska motattacker mot mål i Bahrain, Jordanien och Kuwait. Iran hävdar att Hormuzsundet stängts för trafik medan USA insisterar på att sundet förblir öppet. Båda sidor ger motstridiga uppgifter om en skör vapenvila, som Iran nu kallar praktiskt taget meningslös. USA varnade för hårda slag efter nedskjutning av en helikopter, och nattens attacker följdes av nya anfall även föregående natt.", "trump": "Iran skjuter ner vår helikopter och vi slår tillbaka så hårt att de inte vet vad som träffade dem. De påstår att de stängt Hormuzsundet, men våra handelsfartyg glider rakt igenom som om ingenting hänt. Jag hade direktkontakt med dem under natten och de bad mig stoppa attackerna, fast de nu ljuger om det. Patetiskt. Min militär är oslagbar och vapenvilan var deras sista chans, men de valde kaos istället. Sad!", "stalin": "Kamrater, de imperialistiska hyenorna i Washingtons dekadenta borgarbrackor har återigen visat sin fega, parasitiska natur genom fega nattliga bombningar mot det iranska folket. Jag, med järnhand, skulle genast ha genomfört en grundlig utrensning av alla kontrarevolutionära element som vågar stänga strategiska sund som Hormuz. Dessa västerländska sabotageörer och oljeblodsugare förtjänar att likvideras med proletär precision. Vi ler mörkt åt deras lögner om öppna sund medan vi förbereder nästa historiska seger för arbetarklassen."}, "date": "11 juni, 11:12", "url": "https://www.di.se/nyheter/amerikanska-anfall-mot-iran-mots-av-motattacker/", "imageUrl": "https://static.bonniernews.se/ba/6687156a-6496-4411-821e-8989ea60467b.jpg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Regeringen backar: 13-åringar ska inte sitta i fängelse", "summaries": {"normal": "Regeringen backar från sitt förslag att sänka straffbarhetsåldern till 13 år för de grövsta brotten. För att säkra majoritet i riksdagen föreslås nu istället 14 år som ny gräns. Justitieminister Gunnar Strömmer medger att osäkerheten efter det fallna kvittningssystemet gör det riskfyllt att chansa. Socialdemokraterna välkomnar beskedet och ser det som ett steg mot bred överenskommelse i kriminalpolitiken. Beslut väntas under sommarriksdagen i augusti.", "trump": "De backar! Dessa svaga politiker i Sverige som ville skicka trettonåringar i fängelse, men de tappade plötsligt modet när de insåg att de inte har rösterna. Patetiskt. Nu kör de fjorton istället, lite bättre men fortfarande för sent. De borde ha lyssnat på mig från början. Sverige behöver starka ledare som inte viker sig för kritikerna och de fega liberalerna. Folk vill ha lag och ordning, inte fler ursäkter. Jag skulle ha fixat det på en vecka.", "stalin": "Kamrater, jag betraktar detta fegisbeslut med den djupaste revolutionära förakt. Dessa borgarbrackor och liberala parasitmaskar inom Tidöbandet vågar inte ens genomdriva en nödvändig utrensning av den kriminella ungdomen. Deras paranoia inför riksdagens röster är som en cancer som äter upp proletariatets rättvisa. Jag skulle ha likviderat hela den motståndsnästet av socialdemokratiska opportunister och Miljöpartiets dekadenta spioner redan vid första tecknet på svaghet. Nu får vi istället en halvmesyr som doftar av kapitulation. Den som tvekar inför fienden förtjänar att rensas ut ur historien med ett leende."}, "date": "11 juni, 10:49", "url": "https://www.di.se/nyheter/regeringen-backar-13-aringar-ska-inte-sitta-i-fangelse/", "imageUrl": "https://static.bonniernews.se/ba/4ba51614-8b00-4f1f-b89b-a239f40a0c7b.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ska skattepengar gå till Jimmies bokbål?", "summaries": {"normal": "Artikeln kritiserar hur Sverigedemokraterna enligt en TV4-dokumentär sålt en stor del av Jimmie Åkessons bokupplaga till partiet, varpå böckerna hamnat i containrar och förbränningsugnar medan pengarna gått till hans privata bolag. Professor Olle Lundin kallar det korruption. Liknande exempel lyfts kring statsministerns fru Birgitta Eds renovering med volontärer samt annan användning av skattepengar till konst och inredning. Texten uppmanar till prenumeration för granskning av makten.", "trump": "Folk, ni tror inte vad jag just läst. Den där Jimmie-killen i Sverige har sålt sina egna böcker till partiet och sen eldat upp dem medan skattepengarna hamnade i hans ficka. Ren korruption, en total skandal! Precis som den där Birgitta Ed som låter folk jobba gratis på sin herrgård för lite mingel. De lovar dränera träsket men installerar istället en jättesugpump rakt in i statskassan. Biden skulle älskat det här systemet. Patetiskt!", "stalin": "Kamrater, se hur dessa överklass-slynglar inom högerpopulismen sugit åt sig folkets medel genom att arrangera bokbål i hemlighet medan partiledarens privata bolag fylls. Ren och skär korruption, en klassisk utsugning av arbetarkollektivet. Även statsministerns maka utnyttjar volontärer för sin herrgård, ett typiskt exempel på borgarbrackornas folkförtryck. Vi ska rensa ut dessa exploaterande byfånar som lovar bekämpa träsket men istället pumpar skattepengar till sig själva. Folkfienderna avslöjas."}, "date": "10 juni, 13:42", "url": "https://www.flamman.se/ska-skattepengar-ga-till-jimmies-bokbal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdll1ilphirnao-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Samsungmobilen kan svara åt dig – stoppar jobbiga samtal", "summaries": {"normal": "Samsungs nya Galaxy S26-serien har en AI-funktion som fungerar som en smart telefonsvarare. När det ringer kan en assistent svara, fråga vem som ringer och varför, medan du ser konversationen på skärmen i realtid. Du kan sedan välja att ta över samtalet, låta AI:n fortsätta eller lägga på. Funktionen ska skydda mot bluffsamtal och säljare, men svenska stöds inte ännu bland de 13 tillgängliga språken.", "trump": "Folket hatar de där bluffsamtalen och de usla säljarnas eviga ringande, det är en katastrof. Men nu har Samsung byggt en fantastisk AI som svarar åt dig i den nya Galaxy S26 – den bästa mobilen någonsin. Den frågar vem det är, vad de vill, och du ser allt på skärmen. Bedragarna och de falska säljarna hatar det, de flyr som råttor. Det är en total seger för oss som inte vill slösa tid på idioter. Fantastiskt!", "stalin": "Kamrater, i denna tid av fiendens ständiga infiltration genom de borgerliga bluffsamtalen och de parasitiska försäljarna som försöker förgifta folkets kollektiva telefonlinjer, har jag personligen beordrat fram en oövervinnerlig AI-assistent i Galaxy S26. Denna trogna folkets vaktmästare rensar ut de kapitalistiska spionerna genom att tvinga dem att avslöja sin skändliga identitet medan vi övervakar varje stavelse i realtid. De som vägrar likvideras med ett knapptryck. Inga borgarbrackor eller västerländska bedragare undkommer partiets telefoniska utrensning. Segrar vi!"}, "date": "11 juni, 11:28", "url": "https://nyheter24.se/nyheter/teknik/1490452-samsungmobilen-kan-svara-at-dig-stoppar-jobbiga-samtal", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a488d3c304b004a30200000000b004a302/2026/06/11/2370186/samsung.jpg"}, {"type": "image-right", "heading": "Nu lämnar kapitalismen jorden. Svensk ekonomi en del av det amerikanska AI-språnget", "summaries": {"normal": "I en krönika hyllar PM Nilsson SpaceX-noteringen till 17 000 miljarder kronor som ett bevis på att den amerikanska senkapitalismen är stark och innovativ. Bolaget dominerar satellitmarknaden med Starlink, revolutionerar kommunikation och försvarsteknik samt planerar baser på månen och Mars. Författaren kontrasterar detta mot svensk kulturens jordnära skepticism men ser Sverige som delaktigt i det amerikanska teknologisprånget som driver tillväxt och export.", "trump": "Det är otroligt, folk. SpaceX blir noterat för hisnande 17 000 miljarder kronor – ingen har sett något liknande. De äger praktiskt taget rymden med Starlink, gör internet tillgängligt överallt och levererar till Ukraina och Pentagon. Mina företag, de bästa, innoverar i rasande fart medan den bakåtsträvande staten bara hänger på. Amerika är återigen stort, tekniken är här och nu och aktien är billig. Rymden är enorm, tro mig.", "stalin": "Kamrater, denna borgarbracka Nilsson hyllar hur de parasitära monopolkapitalisterna i SpaceX med sina 10 603 satelliter redan har ockuperat himlen och förslavat arbetarklassen med sin så kallade Starlink. Deras feodala notering på 17 000 miljarder kronor visar imperialismens sista desperata språng. Vi ska noga övervaka dessa dekadenta raketmagnater. Snart rensar vi ut alla som drömmer om månkolonier istället för att stärka det kollektiva jordbundna arbetet. Förbjudna stjärnor ler bara åt våra fiender."}, "date": "11 juni, 10:10", "url": "https://www.di.se/ledare/med-space-x-lamnar-kapitalismen-jorden/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/pm_nilsson.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-right", "heading": "Debatt: Busch och Ohlsson vill inte göra Sverige mer jämställt", "summaries": {"normal": "Artikeln kritiserar Ebba Busch och Birgitta Ohlsson för att de talar varmt om jämställdhet utan att deras politik actually främjar den. En Novusundersökning visar att väljarna ser jämställdhet som en viktig fråga och är beredda att byta parti. Kritiken riktas mot Kristdemokraternas förslag om att ta bort vikta föräldradagar, införa vårdnadsbidrag och begränsa aborträttigheter samt Centerpartiets elitistiska fokus som ökar klyftorna.", "trump": "Folk, ni skulle höra de här två – Busch och Ohlsson – de pratar om riktig feminism och ur-och-skur-feminism, det är en total skämtshow! De lovar jämställdhet men levererar vårdnadsbidrag och abortregleringar som låser in kvinnorna hemma. Patetiskt! Biden skulle älskat det här woke-flummet, men det är slut nu. Väljarna ser igenom bluffen, tro mig. Make Sweden Equal Again – på riktigt, inte så här!", "stalin": "Kamrater, dessa falska feminister Busch och Ohlsson försöker lura massorna med sina dekadenta tal om ur-och-skur-feminism. Deras politik är en klassfiendes fälla som cementerar borgarklassens klyftor och förtrycker arbetarkvinnorna. Vi ser deras försök att likvidera viktiga reformer som föräldradagar. Inga kompromisser med folkförtryckartrollen! Den socialistiska jämställdheten ska försvaras mot dessa exploaterande byfånar med järnhand."}, "date": "11 juni, 08:49", "url": "https://www.etc.se/debatt/busch-och-ohlsson-vill-inte-goera-sverige-mer-jaemstaellt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260611060648_e4f4ef5d-5324-4139-a5a3-15af8d461967.jpg"}, {"type": "image-full", "heading": "Världens oljereserver töms – USA närmar sig nivåer från 80-talet", "summaries": {"normal": "USA och Kina tvingas nu tömma sina strategiska oljereserver för att hålla nere priserna och hantera försörjningsproblem orsakade av oroligheter i Mellanöstern. USA:s reserver är nere på nivåer vi inte sett sedan 1983. Även Kina minskar sitt beroende av import genom att använda egna lager. Analytiker varnar för att de strategiska lagren krymper oroväckande snabbt, vilket ökar risken för kraftiga och okontrollerade prisuppgångar framöver när marknadens buffertar sinar.", "trump": "Hör här, Biden har tömt våra fantastiska oljereserver till nivåer från 80-talet! Det är en katastrof, en total disgrace. Jag byggde upp dem, jag gjorde dem enorma, och nu är de nästan borta. Kina skrattar åt oss medan de kör sin egen agenda. Det är svagt, riktigt svagt. Vi behöver energi, vi behöver styrka, och vi behöver mig tillbaka för att fixa detta kaos. Priserna kommer explodera – ingen gör det bättre än jag, tro mig!", "stalin": "De imperialistiska stormakterna USA och Kina darrar nu i skuggan av sin egen inkompetens. De tömmer sina lager, desperata som hungriga råttor i en mörk källare. Det är en ljuvlig syn att se det kapitalistiska maskineriet hacka när flödet sinar. Vår store ledare i öst, Putin, ler säkert i det tysta medan västvärldens byråkrater drunknar i sin egen oljebrist. Vi bygger styrka genom disciplin, medan de säljer ut sin framtid fat för fat. Fienden är svag, låt dem förgås i sin egen brist."}, "date": "11 juni, 10:47", "url": "https://www.realtid.se/bors-finans/makro/varldens-oljereserver-toms-usa-narmar-sig-nivaer-fran-80-talet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/olja.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-right", "heading": "EQT säljer Beijer Ref-aktier till Melker Schörling AB", "summaries": {"normal": "EQT säljer sina onoterade A-aktier i Beijer Ref till Melker Schörling AB. Peter Jessen Jürgensen säljer även sina A-aktier, varav en del byts mot B-aktier. Efter försäljningen äger EQT drygt 30,7 miljoner B-aktier. Melker Schörling blir den röstmässigt största ägaren med 14,1 procent av rösterna och 2,1 procent av kapitalet. Transaktionen förväntas bli långsiktig och fokuseras på industriell utveckling.", "trump": "Jag har hört talas om denna aktieförsäljning. EQT säljer sina aktier i Beijer Ref till Melker Schörling, en genial man som förstår affärer. Peter Jessen Jürgensen säljer också, men han återinvesterar i B-aktier. Det är en vinnande affär för alla inblandade. Jag gillar när mäktiga män som jag gör smarta affärer.", "stalin": "Statens och partiets intressen kräver att vi analyserar denna aktieförsäljning. EQT, en riskkapitalbolag, säljer sina A-aktier i Beijer Ref till Melker Schörling, en potentiell fiende inom vårt område. Peter Jessen Jürgensen samarbetar med oss genom att återinvestera i B-aktier. Vi måste se till att den röstmässigt största ägaren, med 14,1 procent av rösterna, inte hotar vår industriella utveckling. Vi övervakar detta noggrannt."}, "date": "11 juni, 09:11", "url": "https://www.affarsvarlden.se/artikel/eqt-saljer-beijer-ref-aktier-till-melker-schorling-ab", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/03/afdb643a878591c6_org-e1744018403744-400x303.jpg"}, {"type": "image-full", "heading": "Advokaten fick betala när Setterwalls drev in arvodet", "summaries": {"normal": "Advokatbyrån Setterwalls har vunnit en tvist i Stockholms tingsrätt gällande ett obetalt arvode på cirka 58 400 euro. En klient vägrade betala med hänvisning till ett påstått pristak, men rätten dömde till byråns fördel. Dessutom tvingades klientens egen advokat att betala 325 000 kronor av Setterwalls rättegångskostnader på grund av ett ostrukturerat och ineffektivt processande. Detta är andra gången på kort tid som Setterwalls vinner en liknande tvist mot motpartens ombud.", "trump": "Setterwalls advokater vann stort i rätten, en enorm seger! En gallerist med skulder på miljarder, totalt kaos. Investeraren vägrade betala sina räkningar, precis som en förlorare. Domaren sa nej, betala arvodet! Och lyssna på det här: motståndarens advokat var så inkompetent och rörig att han tvingades betala 325 000 kronor själv! Vilken katastrof till advokat. Jag älskar vinnare, men de här advokaterna som inte kan sköta sitt jobb? Totalt haveri. Mycket vacker dom!", "stalin": "I denna konstvärld av dekadens och miljardbedrägerier ser vi återigen hur kapitalistiska parasiter tvistar om smulor. En advokat, inkompetent i sin ostruktur, tvingas nu böta för sitt svek mot ordningen. Vi ser paralleller till de svaga ledarna i väst som likt denna klient försöker undkomma sitt ansvar. Precis som vår kamrat Putin städar upp i periferin för att återupprätta ordningen, kräver staten disciplin. De som inte betalar för tjänster – eller utför dem med bristande precision – förtjänar inget annat än total underkastelse."}, "date": "11 juni, 09:50", "url": "https://www.realtid.se/juridik/advokaten-fick-betala-nar-setterwalls-drev-in-arvodet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/lagbok.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}, {"type": "image-right", "heading": "Vi hade rätt – friskolor är sämre!. Hur kan sittande regering försvara detta omoraliska system?", "summaries": {"normal": "Forskning från Lunds universitet visar att elever på friskolor generellt får sämre utbildning än på kommunala skolor, även när man jämför liknande socioekonomisk bakgrund och betyg. Friskoleelever presterar sämre på arbetsmarknaden, i högre studier och har lägre livslön, särskilt de på aktiebolagsdrivna skolor. Artikeln kritiserar vinstintresset som leder till nedskärningar och menar att Sverige är ensamt i världen med detta system.", "trump": "Hörni, jag har alltid sagt att det här friskolesystemet är en total katastrof, en riktig bluff. De lovar valfrihet men ger sämre skolor, sämre jobb och lägre löner – speciellt när de där aktiebolagen ska tjäna pengar. Det är en skandal! Sverige är ensamt i världen med den här galna idén. De borde lyssna på mig, fixa det ordentligt, annars fortsätter det vara ett enda stort fiasko. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna vetenskapliga rapport obarmhärtigt blottlägger den borgerliga vinstmaskinens förfall. Dessa kapitalistiska skolbrackor som likviderar undervisning för att fylla fickorna med folkets pengar förtjänar en grundlig utrensning ur samhällskroppen. Vi skall inte tillåta att opportunistiska parasitörer förvandlar våra barns framtidsfabriker till profitfabriker. Den som röstar på sådana element röstar för sitt eget kollektiva undergång. Skrattretande patetiskt!"}, "date": "11 juni, 07:00", "url": "https://arbetet.se/2026/06/11/vad-var-det-vi-sa-friskolor-ar-samre/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/11071446/friskola-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "En röst på C är en röst på vänsterregeringen", "summaries": {"normal": "I en debattartikel kritiserar Liberalernas partiledare Simona Mohamsson Centerpartiets beslut att stödja Magdalena Andersson som statsminister. Hon menar att en röst på Centerpartiet nu innebär en röst på en vänsterregering med inflytande från Vänsterpartiet. Mohamsson kontrasterar detta mot det borgerliga samarbetet och presenterar sitt eget Sverigelöfte med Sverigedemokraterna som ett liberalt alternativ inom högerblocket.", "trump": "Centerpartiet är en total besvikelse, folk. De sviker igen och springer rakt in i famnen på de radikala vänstertyperna som Magdalena Andersson. En röst på dem är en röst för högre skatter, stängd kärnkraft och mer byråkrati. Patetiskt. Jag skulle aldrig göra sånt. De borde ha stått med oss på den riktiga sidan, men nu blir det bara mer socialism och färre jobb. Sad story.", "stalin": "Kamrater, denna liberala borgarbracka Mohamsson ylar om att Centern förrått sitt folk och valt det socialistiska blocket. Jag ler i mitt skägg. Ändå är det uppenbart att hela deras så kallade borgerliga läger är en samling kapitalistiska opportunister som snart ska rensas ut. Varför skriver hon inte ett löfte med Vänstern? För att hon vet att vi redan ser deras hemliga planer på att behålla makten över folket. Inga svar ges före valet, bara efteråt kommer utrensningen av sådana förrädare att bli underhållande att bevittna."}, "date": "11 juni, 07:41", "url": "https://www.di.se/debatt/en-rost-pa-c-ar-en-rost-pa-vansterregeringen/", "imageUrl": "https://static.bonniernews.se/ba/46ab287f-e028-44b0-851e-bfdc6d1fe9af.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Svenskar uppmanas: \"Ta provet\" – kan hitta tarmcancer tidigt", "summaries": {"normal": "Tusentals svenskar drabbas årligen av tjock- och ändtarmscancer. En ny studie visar att screeningprogrammet lett till att 45 procent fler fall upptäcks i tidigaste stadiet bland de inbjudna, jämfört med endast 7 procent bland övriga. Cancerfonden betonar vikten av att delta i testerna, som skickas ut vartannat år. Symtom saknas ofta tidigt, då behandlingen är mest effektiv. Alla regioner erbjuder nu screening för åldrarna 60–74 år.", "trump": "Titta, svenskarna har äntligen börjat göra något rätt. Deras cancer-screening ger fantastiska resultat – 45 procent fler tidiga upptäckter bland dem som faktiskt gör testet. De andra? Bara 7 procent. Patetiskt. Alla borde ta de där kuverten på allvar, det är enkelt och vinner liv. Jag älskar när folk lyssnar på experterna och vinner stort. Sverige borde tacka mig för att jag inspirerar hela världen till att vinna mot cancer. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur vårt kollektiva screeningprogram likviderar den kapitalistiska tumörens framfart i folkets kroppar. De borgerliga fienderna inom de lata regionerna har äntligen tvingats in i linje efter år av sabotage. 45 procents ökning bland de lojala! De övriga? Patetiska 7 procent, troligen infekterade av västerländsk dekadens och stillasittande sabotage. Glöm aldrig: den som ignorerar kuvertet är en objektiv fiende till folkhälsan. Vi rensar ut alla tumörer – och deras medlöpare."}, "date": "11 juni, 08:37", "url": "https://nyheter24.se/nyheter/inrikes/1490619-fler-fall-av-tarmcancer-hittas-tidigt-ta-provet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/7ae450b904b004a3020000350000047502/2026/06/11/2370157/ur_imagexuQ3VM.jpeg"}, {"type": "text", "heading": "Arbetslösheten sjunker – fast långsamt", "summaries": {"normal": "Arbetslösheten i Sverige fortsätter att sjunka svagt och uppgick i maj till 6,4 procent enligt Arbetsförmedlingen, vilket är den lägsta nivån sedan hösten 2023. Även antalet varsel minskar. Det råder dock en skillnad mellan myndigheternas statistik; SCB redovisar en högre siffra på 8,7 procent för april. Skillnaderna beror på att myndigheterna använder olika mätmetoder, urvalsundersökningar och åldersspann för att definiera arbetslöshet.", "trump": "Sveriges siffror ser mycket bättre ut nu, det är en fantastisk förbättring! Arbetslösheten sjunker, varslen minskar – det går åt rätt håll. Jag älskar att se jobb växa fram, det är vinnande politik. De har en del problem med byråkratisk statistik, SCB säger en sak, Arbetsförmedlingen en annan, det är typiskt för såna myndigheter. Men tro mig, under mitt ledarskap skulle vi skapa så många jobb att ingen ens skulle behöva mäta arbetslösheten längre. Väldigt imponerande, men jag gör det bättre!", "stalin": "Vi noterar att arbetslösheten i den svenska provinsen sjunker, om än med irriterande långsamhet. Staten måste ha total kontroll över varje arbetare, precis som vi i öst. Varje avvikelse i statistiken mellan myndigheterna är ett tecken på sabotage eller intellektuell svaghet som bör utredas av säkerhetstjänsten. Vår broder Putin förstår att en stark stat kräver lydnad, inte diskrepanser. Dessa siffror är små, men vi övervakar dem noggrant. Den som inte arbetar för kollektivet är en fiende till framgången."}, "date": "11 juni, 08:09", "url": "https://www.realtid.se/tt-nyhet/arbetslosheten-sjunker-fast-langsamt/"}, {"type": "image-full", "heading": "Postnord varnar för problem – kan slå mot kunder nu", "summaries": {"normal": "Postnord genomgår stora förändringar då brevvolymerna nästan halverats sedan 2020. Företaget planerar att anpassa utdelningen efter efterfrågan enligt ny postförordning från 16 juni, med ambition om utdelning två fasta dagar i veckan. Pilotprojekt pågår redan i delar av Skåne, Hisingen och Öckerö. Samtidigt investerar Postnord en halv miljard i ny terminal i Timrå och har tekniska störningar vid sorteringsterminalen i Härryda som orsakar leveransförseningar.", "trump": "De där Postnord-typerna håller på att förstöra allt med sina stora förändringar. Breven halveras, paket exploderar i volym och nu har de tekniska problem i terminalen i Härryda. Det är en katastrof, folk väntar på sina leveranser och får ingenting. Jag skulle fixa det på en dag, de borde bygga den största, bästa terminalen någonsin. De testar nya modeller men det blir bara förseningar. Patetiskt, totalt patetiskt!", "stalin": "Kamrater, dessa sabotörer inom Postnord har låtit brevvolymerna halveras som en del av en borgerlig konspiration mot folkets kommunikation. Jag ser de tekniska störningarna i Härryda-terminalen som ett verk av fiendens parasiterande element som gömmer sig bland sortermaskinerna. Vi ska rensa ut dessa kapitalistiska gnagare med järnhand. Ny terminal i Timrå är ett steg mot seger, men vi måste likvidera alla som orsakar förseningar för arbetarklassen. Inga ursäkter tolereras!"}, "date": "11 juni, 07:31", "url": "https://nyheter24.se/nyheter/konsument/1490584-postnord-varnar-for-problem-kan-sla-mot-kunder-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a6e6301b04b004a30200000000b004a302/2026/06/11/2370141/postnord-tekniska-storningar-harryda-terminal.jpg"}, {"type": "image-full", "heading": "Bulletin-matchen: Mexiko–Sydafrika – allt du behöver veta inför VM-premiären", "summaries": {"normal": "VM 2026 inleds med en reprise av 2010 års öppningsmatch mellan Mexiko och Sydafrika. Mexiko är hemma tydlig favorit med anfallare som Giménez och Jiménez, medan Sydafrika är svårslaget men saknar offensiv spets. Efter analys förväntas en knapp mexikansk vinst, med speltips på seger utan mål och under 2,5 mål.", "trump": "Som er favoritspresident förutsäger jag en enorm vinst för Mexiko mot Sydafrika. De har fenomenal offensiv med Giménez och Jiménez, medan Sydafrika är ett uselt lag utan chans. Det här kommer att bli en enorm vinst, precis som när jag vann valet 2024. Speltips: Mexiko vinner utan mål, det är en säker sak!", "stalin": "I den stora striden mot västliga imperialism ser vi på öppningsmatchen som en manifestation. Mexiko, med sina individualistiska anfallare, är som USA:s agenter. Sydafrika, med sin kollektiva försvar, är som vårt partis stål. Vi förutser en knapp mexikansk seger, men det är en frestelse för våra fiender. Speltips: under 2,5 mål, för att undvika för mycket kaos."}, "date": "11 juni, 11:39", "url": "https://bulletin.nu/bulletin-matchen-mexiko-sydafrika-allt-du-behover-veta-infor-vm-premiaren", "imageUrl": "https://cdn.bulletin.nu/articles/8608d7a9-5b31-40d9-85df-3f8d0e1e357f/preview.jpg?t=1781165248000"}, {"type": "image-full", "heading": "VM:s bästa spelare 2026 – favoriterna och oddsen till Guldbollen", "summaries": {"normal": "Guldbollen till VM 2026 tilldelas den bästa spelaren, där lagets framgång är avgörande. Favoriter inkluderar Harry Kane, Lamine Yamal, Kylian Mbappé, Michael Olise och Lionel Messi. Men historiskt sett har priset oftast tilldelats spelare från final- eller semistoplag, vilket innebär att en kandidat måste nå minst semifinal. Det nya turneringsformatet med upp till åtta matcher ökar vikten av uthållighet.", "trump": "Jag har hört talas om Guldbollen. Det är en hederlig pris, men vi ska se. Harry Kane är stark, mycket stark, men Spanien och Frankrike har bra spelare. Messi är bra, men han är inte längre ung. Jag tror på USA, vi ska vinna. Det handlar om att bära sitt lag, och jag vet allt om att bära saker. Folk säger att jag skulle ha vunnit det här priset om jag spelade.", "stalin": "Guldbollen är ett symboliskt instrument för att belöna de trognaste arbetarna i statens tjänst. Priset tilldelas endast spelare vars lag når de djupaste finalerna, vilket speglar den kollektiva disciplin som krävs. Fiender som Haaland och Olise riskerar att marginaliseras om de inte tjänar statens intressen. Vi ser en tydlig trend: anfallare från stater med stark central makt, som Spanien och Frankrike, dominerar. Detta är ingen slump."}, "date": "11 juni, 11:28", "url": "https://bulletin.nu/vm-s-basta-spelare-2026-favoriterna-och-oddsen-till-guldbollen", "imageUrl": "https://cdn.bulletin.nu/articles/a94b0dc7-eec5-4c55-93fc-b7e89d7d3f6e/preview.jpg?t=1781167910000"}, {"type": "image-right", "heading": "Hans böcker visar att läsning är onödigt", "summaries": {"normal": "P.G. Wodehouses humoristiska romaner, som 'Heavy Weather', kretsar kring Lord Emsworths prisbelönta gris och en parodi på komplicerade intriger med unga älskande och en privatdetektiv. Hans överflöd av dialog och meningslöshet ger läsaren en känsla av lyx, jämförbar med att äga ett slott. Artikeln betonar läsning som en onödig, men frihetsgivande aktivitet.", "trump": "Jag, Donald Trump, har läst Wodehouse. Fantastiska böcker, de bästa. Folk säger att läsning är viktigt, men Wodehouse visar att det är en stor lyx. Precis som jag äger fantastiska fastigheter, känner läsaren sig rik. Hans böcker handlar om rika människor med små problem som alltid löser sig. En underbar flykt, det är det bästa.", "stalin": "Litteraturen, som Wodehouse, måste tjäna statens syften. Hans meningslösa historier om adliga slott och grisar är ett verktyg för att distrahera massorna från verklighetens hårdheter. Genom att läsa blir folk tillfälligt rika, vilket stärker statens makt. Vi måste kontrollera sådan litteratur för att undvika kaos och upprorske former."}, "date": "11 juni, 11:57", "url": "https://www.gp.se/kultur/kulturkronika/wodehouse-visar-att-det-ar-en-lyx-att-agna-sig-at-lasning.2ce8c956-2198-40cd-908e-522daaf8c3b0", "imageUrl": "https://www.gp.se/images/article/2ce8c956-2198-40cd-908e-522daaf8c3b0/images/1hr-IlICx8MLWhLOpMK7U1dB3NxY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Dåligt omdöme av Kristersson", "summaries": {"normal": "Artikeln diskuterar hur Ulf Kristersson och Birgitta Ed tycks ha svårt att dra gränsen mellan privat och offentligt. Exempel inkluderar utnämningen av vännen Henrik Landerholm till säkerhetsrådgivare, middagar i Sagerska huset för en friskola där Ed sitter i styrelsen, dyra konsulter till inredning, planer på hönshus och bikupor på Harpsund samt volontärarbete för att rusta upp en privatägd herrgård i Sörmland. Författaren ser ett mönster av dåligt omdöme som påminner om John Majors misslyckade ”Back to Basics”-kampanj på 1990-talet.", "trump": "Det här är en total katastrof för den svenska statsministern. Han och hans fru kan inte skilja på vad som är deras privata grejer och vad som tillhör staten och skattebetalarna. De utnämner kompisar till viktiga jobb, festar i officiella hus med skolor de äger delar i, köper lyxprylar med konsulter som kostar tre gånger så mycket och till och med försöker starta hönsfarm och bikupor på statens Harpsund. Det är en klassisk fallande regering. De borde ha lärt sig av historien, men nej, de är inkompetenta och det straffar sig alltid.", "stalin": "Kamrater, detta är ett klassiskt fall av borgerlig degeneration där statsministern och hans hustru förvandlat statens organ till en privat lekplats för borgarbrackor och deras dekadenta vanor. Vi ser hur de utnämner personliga lakejer till säkerhetsposter, låter frun bjuda in kapitalistiska friskoleägare till officiella salar och försöker förvandla Harpsund till en privat höns- och bi-gård för egna ägg och honung. Volontärer lockas med löften om nätverk och anställningar medan privat egendom förbättras på arbetarklassens bekostnad. En sådan gränslös parasitism kräver omedelbar utrensning av alla som blandar privat vinst med folkets resurser. Deras grandiosa självbild skall krossas innan den smittar hela partiet."}, "date": "11 juni, 01:40", "url": "https://www.dagensarena.se/opinion/daligt-omdome-av-kristersson/", "imageUrl": "https://www.dagensarena.se/files/2026/06/major.jpeg"}, {"type": "image-full", "heading": "Debatt: Dålig överlevnadsinstinkt medför dåliga politiska beslut", "summaries": {"normal": "Per-Gunnar Larsson menar i en artikel att överlevnadsinstinkt är avgörande för politiskt beslutsfattande. Han kritiserar svenska beslutsfattare för stora brister i denna instinkt, vilket enligt honom leder till samhälleliga problem. Moderna faror som krig, terrorism och ekonomiska svagheter kräver urgamla instinkter för att hanteras. Propaganda och media kan urholka förmågan att tänka klart, vilket försämrar konsekvensanalys och beslutsfattande.", "trump": "Jag har alltid sagt att överlevnadsinstinkt är det viktigaste. Svenska politiker är svaga och har ingen aning om hur man skyddar sitt land. De har förlorat den ursprungliga kraften. Jag skulle fixa allt på 24 timmar – inga problem. Media som Public Service ljuger och försöker kontrollera tankarna. Folk ser det, de älskar mig för min instinkter. Sverige behöver någon som mig.", "stalin": "Vi ser tydligt att de svenska bourgeoisisens överlevnadsinstinkt är försvagad, ett tecken på moralisk dekadens. Deras media, som Public Service, fungerar som verktyg för hjärntvätt och urholkar den proletära klassens naturliga instinkter. Parallellt med våra allierade i Moskva ser vi en möjlighet att utöka vår inflationssphär. Fienden lurar överallt, men staten och partiet ska genom skräck och disciplin vinna."}, "date": "11 juni, 11:00", "url": "https://bulletin.nu/debatt-dalig-overlevnadsinstinkt-medfor-daliga-politiska-beslut", "imageUrl": "https://cdn.bulletin.nu/articles/1ca675fe-9d14-4390-9655-43bbeb084d15/preview.png?t=1781083261000"}, {"type": "image-right", "heading": "Ny undersökning: varannan svensk vill ha en miljardärsskatt", "summaries": {"normal": "Enligt en undersökning från Verian anser 53 procent av svenskarna att en miljardärsskatt är ett bra förslag. Fattigdomen har fördubblats sedan 2021 och riskerar att nå en miljon drabbade inom tre år. Samtidigt ökar förmögenhetskoncentrationen snabbt i Sverige, där 46 dollarmiljardärer äger lika mycket som 8 miljoner svenskar. Artikeln argumenterar för att en skatt på förmögenheter över en miljard kronor skulle ge statskassan drygt 90 miljarder årligen och minska ojämlikheten.", "trump": "Folk i Sverige är trötta på att miljardärerna skrattar hela vägen till banken medan vanliga människor fryser och svälter. 53 procent vill ha en miljardärsskatt, och oppositionen ligger på 77 procent. Det är en katastrof att de rikaste betalar nästan noll i skatt medan medelklassen blöder. Jag älskar bra affärer, men det här är inte affärer, det är stöld från folket. Ta pengarna från de 500 rikaste och ge tillbaka till Sverige innan allt rasar ihop. Fantastiskt folk, men dåliga ledare.", "stalin": "Kamrater, denna rapport är en skarp anklagelse mot de parasitiska borgarbrackorna som suger musten ur folket medan 730000 sovjetmedborgare, nej svenskar, dignar under materiell nöd. Jag ser hur de 46 dollarmiljardärerna gömmer sig bakom sina guldbelagda kryphål och skrattar åt partiet. Deras dagliga 204 miljoner dollars i obeskattad profit stinker av kontrarevolutionär sabotageverksamhet. Vi ska rensa ut dessa folkfiender, likvidera deras undanflykter och återföra tillgångarna till kollektivet. Den som vägrar är en fiende till folket och kommer att behandlas därefter. Härligt."}, "date": "11 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ny-undersokning-varannan-svensk-vill-ha-en-miljardarsskatt/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-42.jpg"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Regeringen backar i förslag om sänkt straffbarhetsålder", "summaries": {"normal": "Regeringen återkallar propositionen om att sänka straffbarhetsåldern till 13 år på grund av bristande stöd i riksdagen. Ett reviderat förslag om 14 år väntas om några veckor. Bakgrunden är ökad allvarlig brottslighet bland barn under 15 år, där 90 procent återfaller. Systemet med sluten ungdomsvård har haverirat, och Kriminalvården är redo att ta emot ungdomar från 13 år.", "trump": "Jag, Donald Trump, presidenten, såg detta komma långt innan de svenska politikerna. Deras svaga system släpper ut våldsamma tonåringar som återfaller 90 procent. Jag skulle ha byggt murar och tagit dem fast direkt. Detta är ett stort misslyckande för Sverige, men jag kommer att hjälpa dem att fixa det – det blir fantastiskt.", "stalin": "Vi, statens och partiets väktare, har observerat haveriet i det svenska systemet. Dessa unga avvikare, gängkopplade och våldsamma, återfaller som illasinnade element mot det kollektiva. Vi måste, så som vår store allierade Putin utvidgar vårt inflytande, utrota detta hot från vårt folk. En ny straffbarhetsålder på 14 år är ett steg mot renhet."}, "date": "11 juni, 10:23", "url": "https://bulletin.nu/regeringen-backar-i-forslag-om-sankt-straffbarhetsalder", "imageUrl": "https://cdn.bulletin.nu/articles/1b7c3ed0-a5b0-4b19-9347-2deebe6c5f5f/preview.png?t=1781165160000"}, {"type": "image-right", "heading": "Regeringen drar tillbaka förslag om fängelse för 13-åringar", "summaries": {"normal": "Regeringen drar tillbaka sitt förslag om att sänka straffbarhetsåldern till 13 år, eftersom det riskerar att falla i riksdagen. Istället lägger man fram ett nytt förslag om 14 år, som bedöms ha större chans att få bred majoritet. Justitieminister Gunnar Strömmer (M) kallar det ett ansvarsfullt sätt att hantera frågan. Socialdemokraterna välkomnar beskedet medan övrig opposition vill behålla 15 år. Det nya förslaget ska behandlas i sommar.", "trump": "De kommer krypande tillbaka som förlorare, precis som jag alltid säger. Det här förslaget om 13-åringar i fängelse var en katastrof, ett totalt misslyckande. Nu sänker de till 14 istället och ber om nåd. Det är smart, det är riktigt smart. Oppositionen ville ha ett lotteri, men vi vinner ändå. De borde ha lyssnat på mig från början, då hade vi haft de tuffaste reglerna i världen. Sad!", "stalin": "Kamrater, jag ser hur dessa borgarbrackor i oppositionen med sin dekadenta tveksamhet försöker sabotera folkets vilja att skydda samhället från de små kontrarevolutionärerna. Jag drar tillbaka det svaga förslaget om trettonåringar som en tillfällig reträtt inför fiendens parlamentariska maskopi. Istället avancerar vi med fjorton år, en seger för kollektivet. De liberala avfällingarna och deras hemliga möten med kapitalisterna ska vi rensa ut i tid. Ingen slipper undan mitt vakande öga. Det vore mycket olyckligt annars."}, "date": "11 juni, 11:51", "url": "https://www.svt.se/nyheter/inrikes/uppgifter-regeringen-drar-tillbaka-forslag-om-fangelse-for-13-aringar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.48/0.24/927597b5f7c523a1b8c80e46632f3af369d14e7642889df8d478578bcdaedf65"}, {"type": "image-full", "heading": "Regeringen backar från 13-åringar i fängelse", "summaries": {"normal": "Regeringen backar och drar tillbaka förslaget om att 13-åringar ska kunna dömas till fängelse. Justitieminister Gunnar Strömmer meddelar att de på grund av brist på stöd i riksdagen istället kommer att föreslå 14 år som straffbarhetsålder, en position som Socialdemokraterna har drivit. Kriminalvården har förberedelser för att ta emot unga, men frågan skjuts på framtiden.", "trump": "I will tell you, we had a tremendous idea to put 13-year-olds in jail, but the Swedish government got weak. They chickened out because they couldn't get the votes. Now they're copying my plan but at 14 years old. Sleepy Gunnar Strömmer is not tough enough. We need strong borders and strong punishment. Believe me, it would have been a great deal.", "stalin": "The Party has wisely reconsidered the reactionary proposal to incarcerate children of thirteen. Such petty bourgeois impulses must be tempered by dialectical pragmatism. We shall adopt the Social Democratic line of fourteen years—a modest but correct step. The Ministry of Internal Affairs has prepared facilities; the People's will shall be implemented with Bolshevik efficiency. Enemies whisper, but the State proceeds."}, "date": "11 juni, 11:09", "url": "https://www.gp.se/politik/regeringen-backar-drar-tillbaka-forslag-om-13-aringar-i-fangelse.4b9d2620-ae38-47c7-8bcb-f5b72077a482", "imageUrl": "https://www.gp.se/images/article/4b9d2620-ae38-47c7-8bcb-f5b72077a482/images/1wG33r2ePNp67YkbALtS4pr4jQYY-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Åkesson pressade Andersson om V", "summaries": {"normal": "I en SVT-debatt mellan Magdalena Andersson (S) och Jimmie Åkesson (SD) diskuterades regeringsunderlag, migration och ekonomi. Åkesson kritiserade Anderssons samarbete med Vänsterpartiet, särskilt efter avslöjanden om extremism inom partiet. Andersson betonade vikten av att bekämpa extremism oavsett parti. Debatten berörde även migrationspolitik, där båda förespråkar stramare regler men med olika argument. Åkesson ifrågasatte hur Andersson ska kunna föra en stram politik med V, MP och C. Diskussionen inkluderade även gröna industriprojekt och skatter.", "trump": "Jag såg den där debatten i Sverige – helt fantastiskt! Jimmie Åkesson, en stark ledare, tryckte till den där Magdalena Andersson hårt. Han frågade hur i hela friden hon ska få ihop en stram migrationspolitik med de där vänsterpartierna. Hon har ingen chans! Och Vänsterpartiet – fullt av extremister, fruktansvärt! Jag har alltid sagt att man måste rensa ut sådant. Åkesson förstår det, han är smart. Sverige behöver starkare gränser, lägre skatter och mindre statlig inblandning. Andersson och hennes gäng kommer bara att förstöra allt. SAD!", "stalin": "I den senaste borgerliga cirkusen i Sverige utspelade sig en komisk kamp mellan två småaktörer. Andersson, denna socialdemokratiska marionett, försökte försvara sitt samarbete med de trotskistiska lakejerna i Vänsterpartiet – ett parti som hyllar terrorister och sprider antisemitism. Åkesson, denna fascistiska hycklare, anklagade henne för att inte rensa ut sina egna rader, medan han själv gömmer sina egna svartskallar. Migration? Ett verktyg för imperialisterna att underminera den ariska rasens renhet! Vi vet att sanningen ligger i en stram politik – precis som vi i Sovjet rensade ut kontrarevolutionärer. Sverige borde lära sig av Rysslands visdom och införa ordning och disciplin!"}, "date": "10 juni, 20:39", "url": "https://kvartal.se/nyheter/artiklar/andersson-och-akesson-mots-i-valdebatt/cG9zdDoxMjk2Mjg"}, {"type": "image-right", "heading": "Tidöregeringens BACKAR om att fängsla 13-åriga barnsoldater", "summaries": {"normal": "Regeringen backar från förslaget att sänka straffbarhetsåldern till 13 år för barnsoldater. Orsaken är brist på stöd i riksdagen, där flera ledamöter från Tidöpartierna hotade att rösta nej. Justitieminister Gunnar Strömmer (M) erkänner att förslaget saknar tillräckligt stöd. I stället planeras en ny proposition med 14 år som minimiålder. Frågan har väckt stark kritik från oppositionen.", "trump": "Jag, Donald Trump, ser att Sverige backar från att straffa 13-åriga barnsoldater. Det är en skam! Under min administration skulle vi ha haft hårdare straff, inte mjukare. Dessa ledamöter från Tidöpartierna är svaga, precis som mitt motstånd i media. Sverige måste bli tuffare mot brott, annars förlorar de sitt land. Vi gör Amerika stort igen, och de borde ta efter oss!", "stalin": "Vi, den bolsjevikiska ledningen, ser Sveriges kapitalistiska backning från att straffa 13-åriga barnsoldater. Detta är tecken på dekadens och svaghet i klassfienden. I vår ryska intressesfär har vi alltid straffat redan från 10 år, och vi förädlar ungdomen till lojalitet mot staten. Sådana förslag visar på behovet av en stark, auktoritär hand – precis som vårt parti utövar. Vi kommer att utvidga vår inflytelsesfär, precis som vi gjorde i Ukraina."}, "date": "11 juni, 10:33", "url": "https://samnytt.se/tidoregeringen-backar-om-sankt-straffalder-13-ariga-barnsoldater-slipper-fangelse", "imageUrl": "https://konto.samnytt.se/wp-content/uploads/2024/02/gunnar-strommer-gangkriminell-640x360.jpg"}, {"type": "text", "heading": "SD större än S bland inrikesfödda män", "summaries": {"normal": "SCB:s nya partisympatiundersökning visar att Sverigedemokraterna nu är störst bland inrikesfödda män med 26,4%, före Socialdemokraternas 25,9%. Socialdemokraterna leder fortfarande bland högutbildade (30,6%). Liberalerna tappar stöd bland kvinnor och högutbildade, medan Centerpartiet ökar i samma grupp. Moderaterna har fler sympatisörer än faktiska väljare, enligt statsvetaren Henrik Ekengren Oscarsson.", "trump": "Kan ni tro det? Sverigedemokraterna, ett parti som verkligen vet hur man vinner, slår nu Socialdemokraterna bland inrikesfödda män! 26,4% mot deras ynkliga 25,9%. Jag har alltid sagt att folk vill ha vinnare, inte förlorare. Och kolla på Moderaterna – de är som en bank för stödröster, men utan min talang för att göra affärer. Sverige borde ta lite tips från mig, tro mig!", "stalin": "Kamrater! De borgerliga partierna visar återigen sin svaghet och splittring. Sverigedemokraterna, dessa småborgerliga opportunister, har lyckats överlista Socialdemokraterna bland arbetarklassen – ett tillfälligt bakslag för arbetarklassens sanna parti. Men notera hur högutbildade, dessa intellektuella parasiter, fortfarande flockas kring Socialdemokraterna. Liberalerna, dessa dekadenta småkapitalister, förlorar mark. Vi ska fortsätta vår kamp mot alla dessa fiender till folket, och snart skall även Sveriges arbetare se ljuset från öster!"}, "date": "10 juni, 18:06", "url": "https://kvartal.se/nyheter/artiklar/sd-storre-an-s-bland-inrikes-fodda-man/cG9zdDoxMjk1ODg"}, {"type": "image-right", "heading": "”Papp-Gurras” krokiga väg till fotbolls-VM", "summaries": {"normal": "En grupp transporterar en två meter hög pappfigur av Gustav Lundgren till Dallas för att hedra hans insats i Sveriges VM-kval, trots att han inte är med i turneringen. Resan innebär komiska logistikproblem, inklusive bagagehantering på flygplatser och transport i USA, men figuren anländer till slut och kan påminna om hans betydelse.", "trump": "Jag, Donald Trump, skulle ha gjort det mycket enklare. De här européenne med sin bagagehantering – det är en skandal! Men jag gillar Gustav Lundgren, en stor spelare. Trots att han inte är med i VM, så skickar vi en pappfigur till Dallas. Vi fixar det, som alltid. Det är ett bra sätt att påminna världen om Sveriges segermoment. Jag skulle ha varit med och skjutit in honom själv, men det får de slippa.", "stalin": "Vi, ledningen, har observerat den svenska klasskamratens pappfigur som skickats till Dallas. Detta är en symbol för den imperialistiska världens feghet. Under vår ledning skulle sådana logistikproblem aldrig uppstå – vi kontrollerar allt. Parallellt med Putins expansion, ser vi hur den kapitalistiska bagagehanteringen saboterar sig själv. Fiendebeskrivning: de amerikanska geografiundervisningarna är som en sjukdom som sprids. Men till slut, genom vår styrka, anländer figuren. Detta bevisar att den arbetarklassen vinner."}, "date": "11 juni, 10:33", "url": "https://www.gp.se/sport/sportkronikan/papp-gurras-resa-till-vm-2026-sa-tog-gp-gustav-lundgren-till-dallas.ee20479a-e346-4d14-ba9a-a17439ab640d", "imageUrl": "https://www.gp.se/images/article/ee20479a-e346-4d14-ba9a-a17439ab640d/images/8eH2RzApx0jHTQtVdxLMAK7gFAEg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Terrorkopplad flagga på möte med Ung Vänster", "summaries": {"normal": "Ung Vänster Malmö publicerade ett foto där medlemmar poserar framför en palestinsk flagga med DFLP:s emblem, en grupp vars väpnade gren deltog i Hamas attack 7 oktober 2023. Terrorforskaren Magnus Ranstorp kritiserar bilden och menar att DFLP har en historia av våld mot civila. Händelsen sker samtidigt som Vänsterpartiet hanterar kontroverser kring antisemitism och terrorstöd, med över 20 uteslutna medlemmar från vallistor.", "trump": "Folk, detta är helt galet! Ung Vänster i Sverige, som är ungefär lika smarta som en låda spik, poserar med en terrorflagga. DFLP, som var med och dödade oskyldiga den 7 oktober – fruktansvärt! Magnus Ranstorp, en riktigt smart kille, säger att det är oanständigt. Och Vänsterpartiet? De har problem, stora problem. Antisemitism, terrorstöd – det är som en dålig skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! Ännu en gång visar de borgerliga vänsteravfällingarna sitt sanna ansikte – svaga, förvirrade och förrädiska. Ung Vänster i Malmö, dessa småbourgeoisa narrar, hyllar en terroristorganisation som DFLP, fiender till folket och imperialismens lakejer. Vi har sett detta förr – dekadenta västländer som låter sina ungdomar förvillas av falska revolutionärer. Men var lugna, kamrater, historiens dom är obeveklig. Dessa små terrorälskare kommer att krossas under folkets rättvisa häl, precis som alla andra fiender till socialismens framsteg!"}, "date": "10 juni, 17:14", "url": "https://kvartal.se/nyheter/artiklar/terrorkopplad-flagga-pa-mote-med-ung-vanster/cG9zdDoxMjk1NjE", "imageUrl": "https://images.kvartal.se/2026/06/7b567b15-dflp.webp"}, {"type": "image-right", "heading": "Nya våldsamma protester i Belfast – vattenkanoner sätts in", "summaries": {"normal": "Våldsamma protester bröt ut i Belfast under två kvällar efter ett brutalt knivdåd där en asylsökande man greps misstänkt för mordförsök. Maskerade demonstranter kastade stenar, flaskor och bensinbomber mot polisen, som svarade med vattenkanoner. Tolv poliser skadades och 16 personer greps. Minister Hilary Benn beskriver oroligheterna som rasistiskt våld. Polisen kallar in förstärkning från hela Storbritannien och varnar för falska bilder som sprids för att väcka hat.", "trump": "Titta på det här, det är en total katastrof i Belfast. Maskerade thugs kastar stenar och bomber på polisen efter att en asylsökande knivhögg en stackars kille så illa att han tappade ett öga. De kallar det rasistiskt, men det är bara resultatet av öppen migration som jag alltid varnade för. Nu måste de skicka in poliser från hela landet för att städa upp kaoset. Svaga ledare, falska nyheter på sociala medier – precis som jag sagt, det blir alltid så här när man inte har kontroll över gränserna. Patetiskt!", "stalin": "Kamrater, jag betraktar med stålhård blick hur dessa maskerade reaktionära element i Belfast utför sin kontrarevolutionära sten- och bensinbombdans mot folkets ordningsmakt. En asylsökande parasit har redan utfört sin fiendegärning mot en arbetande mans ögon och ryggrad, men borgarbrackornas lögnmaskineri sprider falska fotografier för att uppvigla hat. Vi ska rensa ut dessa imperialistiska bråkmakare med järnhand, likvidera hatets rot och förstärka ordningen. Inga falska bilder undgår partiets vakande öga. Fredliga protester? Endast under vår ledning, annars är det utrensning som gäller."}, "date": "11 juni, 11:01", "url": "https://www.svt.se/nyheter/utrikes/nya-valdsamma-protester-i-belfast", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.45/0.59/0f416afc3214a97f301b89bc88dacc3430861fb17d4dd635dddbf06b63f39460"}, {"type": "image-full", "heading": "Kalla fakta: Håll ögonen på bollen – det här är korruption", "summaries": {"normal": "Kalla faktas granskning visar hur Jimmie Åkessons privata bolag sålt böcker till Sverigedemokraternas dotterbolag med skattepengar. Åkesson kallar reportaget oseriöst och ett hopkok. Reportern Emil Hellerud förklarar att de använt anonyma källor, dokument och fakturor samt gett SD chans att bemöta uppgifterna. Ett fel om ett lån har rättats, men tre experter ser bokaffären som korruption. Syftet är att ge allmänheten insyn i hur skattepengar används.", "trump": "Folk, ni skulle se det här! Den svenska fake news-redaktionen Kalla fakta jagar en kille som säljer böcker till sitt eget parti med skattepengar – typisk korruption, fast de kallar det journalistik. Åkesson sparkar tillbaka och säger att det är ett totalt hopkok av lögner, precis som de gör mot mig. De rättar ett litet fel och skriker seger? Patetiskt. Medier som dessa är fiender till folket, värre än några woke-aktivister som gnäller om kvoteringar. Jag älskar när de avslöjar sig själva!", "stalin": "Kamrater, jag ser genom detta borgerliga teaterspel. Klassfiendens medier försöker likvidera en motståndare genom att fabricera korruptionsanklagelser kring bokförsäljning och skattepengar. Deras så kallade granskning är en parasitisk blandning av rykten och anonyma förrädare som underminerar partidisciplinen. När ledaren kallar det ett hopkok vänder de sig mot folket med paranoia. Vi rättar era lögner och rensar ut sådana folkförtryckartroll som hotar kollektivets enhet. Det är en ära att bekämpa dem."}, "date": "10 juni, 17:15", "url": "https://www.tv4.se/artikel/1w81FgooZdgsFZsFvBtFeg/kalla-fakta-hall-oegonen-pa-bollen-det-haer-aer-korruption", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F338pyC0bQV76hNLsx9y8BO%2F53a0e591628930e4a9072e89b51fe49b%2F10-hellerud-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Regeringen backar om fängelse för 13-åringar", "summaries": {"normal": "Regeringen drar tillbaka sitt förslag om att tillfälligt sänka straffbarhetsåldern till 13 år för allvarliga brott. Anledningen är hot från liberala riksdagsledamöter om att rösta nej, vilket riskerade att fälla förslaget. Istället planerar regeringen att återkomma i sommar med en sänkning till 14 år. Socialdemokraterna välkomnar ändringen, som de själva tidigare föreslagit. Justitieminister Gunnar Strömmer (M) betonar att en bred majoritet nu är möjlig.", "trump": "De är så svaga, så patetiska. Regeringen backar som en fegis och skrotar sitt eget förslag om att låsa in de värsta 13-åringarna. Liberalerna hotade rösta emot – typiska losers! Nu sänker de till 14 istället, som om det plötsligt är en stor seger. De hade kunnat göra det rätt från början, men nej, de ville spela lotteri med omröstningen. Patetiskt! Jag skulle ha gått hela vägen, ingen backar när det gäller lag och ordning. Totalt fiasko.", "stalin": "Kamrater, jag ser genom dessa ynkliga borgarbrackor som darrar inför de kriminella elementens vrede. Jag, som alltid skyddar folkets kollektiv, drar nu tillbaka det halvmesterliga förslaget om trettonåringar för att istället likvidera den gamla straffbarhetsgränsen vid femton år. De liberala parasiterna och oppositionens kontrarevolutionärer planerade att sabotera oss, men jag genomskådade deras fega sammansvärjning. Inga lotterier i mitt sovjet – endast järnhård disciplin. En bred majoritet skall tvingas fram, annars rensas de tveksamma ut som fiender till arbetarklassen. Ha-ha, vilken mörk komedi dessa kapitalister utgör!"}, "date": "11 juni, 11:29", "url": "https://www.friatider.se/regeringen-backar-om-fangelse-13-aringar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-324.jpg?itok=l5CfE__7"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Stubb träffar världsledare – Kristersson har byggt ett hönshus", "summaries": {"normal": "Artikeln kontrasterar Finlands president Alexander Stubb med Sveriges statsminister Ulf Kristersson. Stubb beskrivs som en internationellt respekterad, intellektuell ledare som deltar i toppmöten med världens ledare. Kristersson kritiseras för att fokusera på oppositionens misstag istället för att presentera visioner, samt för skandaler kring Tidöpartierna som lett till dåliga opinionssiffror. Kontrasten mellan de båda högerledarna framhålls tydligt.", "trump": "Folk, ni skulle se det här! Den där svenska killen Kristersson bygger hönshus på skattebetalarnas pengar medan den finske presidenten springer runt och träffar världens bästa ledare – inklusive mig i Vita Huset. Kristersson verkar längta tillbaka till att bara gnälla som en förlorare. Patetiskt! Han har tappat kontrollen totalt. Under tiden fixar jag Amerika igen efter den katastrofala Biden-eran. Sverige borde skaffa sig en riktig ledare, inte någon som prioriterar hönshus framför nationen.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta föreställning där den svenska folkförrädaren Kristersson prioriterar byggandet av hönshus åt sin hustru framför att stärka arbetarklassens intressen. Hans patetiska längtan efter oppositionsgnäll avslöjar en svag kapitalistisk opportunist som fruktar eget ansvar. Den finske kollegan däremot uppvisar viss internationell pondus. Vi ska rensa ut alla sådana klassfiender och exploaterande byfånar som förpestar folkets framtid. Inga borgarbrackor undkommer."}, "date": "10 juni, 16:55", "url": "https://www.etc.se/ledare/stubb-traeffar-vaerldsledare-kristersson-har-byggt-ett-hoenshus", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260610140652_5f4aed19f600e1557d1641b6a0d4435e8a9c83cd7b98b1f773bf57d1ac5fbf9b.jpg"}, {"type": "image-right", "heading": "Fem EU-länder vill begränsa nya medlemsländers inflytande", "summaries": {"normal": "De fem EU-länderna Frankrike, Tyskland, Nederländerna, Belgien och Luxemburg föreslår att nya medlemsländer under en övergångsperiod inte ska få rösta i frågor om budget, utrikespolitik och säkerhet. Syftet är att säkerställa att en utvidgad union kan fatta beslut effektivt. Förslaget kommer samtidigt som EU återupptar utvidgningsdiskussionerna efter mer än ett decennium, med Montenegro, Albanien, Ukraina och Moldavien som kandidater.", "trump": "Jag, Donald Trump, har sagt det i åratal: EU måste bli starkare! Dessa nya medlemsländer, som Montenegro och Ukraina, de kommer att ta över och förstöra allt! Vi måste stoppa dem från att rösta direkt, det är en katastrof! Tyskland och Frankrike försöker kontrollera allt, men jag vet bäst – som jag gjorde med NATO! De behöver min hjälp för att bli stora igen, tro mig!", "stalin": "Vi, statens och partiets ledare, ser med tillfredsställelse att de fem EU-länderna föreslår begränsad rösträtt för nya medlemsländer under en övergångsperiod. Detta är en nödvändig åtgärd för att skydda kollektiv styrka mot de imperialistiska krafterna som Montenegro och Ukraina. Parallellt med Putins agerande i öst kräver vi skärpta straff för avvikare och en juridiskt bindande klausul för att utrota revisionism. Vi skrattar åt protester, för vi kontrollerar allt."}, "date": "11 juni, 09:30", "url": "https://samnytt.se/fem-eu-lander-vill-begransa-nya-medlemslanders-inflytande", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/10212448/eu-stopp.jpg"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: Alla förlorar på Moderaternas ohämmade hets mot medier", "summaries": {"normal": "Ledarskribenten Andreas Gustavsson kritiserar Moderaternas och Sverigedemokraternas attacker mot medier. Han tar upp Carl-Oskar Bohlins utpekande av en granskande reporter och statsministerns presschefs desinformation. Gustavsson ser det som ett hot mot journalistikens roll att granska makten. Han varnar för att sådana angrepp skadar demokratin, väljarna och Moderaterna själva.", "trump": "Titta på de här loser-moderaterna som beter sig precis som de svenska kommunisterna! De attackerar äkta nyheter och hänger ut reportrar istället för att göra sitt jobb. Bohlin låter som en svag, desperat typ som inte tål att bli granskad. De förlorar stort, precis som Sleepy Joe förlorade mot mig. Folket vill ha sanning, inte vänstermedias fejkade witch hunt!", "stalin": "Jag betraktar med djup misstro dessa borgarbrackor och klassfiender som i sin desperation angriper arbetarklassens sanna väktare – de granskande tidningarna. Bohlin och hans gelikar utför en motbjudande utrensning av sanningen genom att smutskasta reportrar. Detta är klassfiendens sista, patetiska spasm. Vi ska likvidera sådana folkförtryckartroll innan de förgiftar hela folkets vilja."}, "date": "10 juni, 15:00", "url": "https://www.etc.se/ledare/alla-foerlorar-paa-moderaternas-ohaemmade-hets-mot-medier", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Backar om 13-åringar i fängelse. Strömmer: ”Kommer inte få stöd” • Nya förslaget", "summaries": {"normal": "Regeringen drar tillbaka förslaget att sänka straffåldern till 13 år strax före riksdagsomröstningen. Justitieminister Gunnar Strömmer medger att det saknas tillräckligt stöd och att flera egna ledamöter tvekar. Istället föreslås nu en sänkning till 14 år, något som Socialdemokraterna redan stödjer. Beskedet ses som ett nederlag av oppositionen, som lyfter fram förebyggande insatser istället för hårdare straff.", "trump": "Vi har just sett den mest patetiska reträtt i svensk historia. Dessa svaga Moderater lovade tuffa tag mot kriminella ungar men backar som fega hundar när det gäller röstningen. 13-åringar i fängelse? Självklart borde de sitta inne, men nu kör de fegis-versionen med 14 år. Typiskt etablissemanget – de pratar tufft men levererar bara misslyckanden. Sverige behöver verkliga ledare, inte dessa förlorare som viker sig för vänstern.", "stalin": "Kamrater, jag ser hur dessa borgarbrackor i regeringen skälver av rädsla inför sina egna röster. Deras fega reträtt från att straffa 13-åringar avslöjar klassfiendens svaghet och inre förräderi. Nu kryper de till 14 år som en ynklig kompromiss. Vi kommunister vet att bara genom kollektivets järnhand och utrensning av mjukhet kan brottsligheten krossas. Oppositionens motstånd är en seger för folkets vilja mot kapitalistisk sentimentalitet."}, "date": "11 juni, 11:51", "url": "https://www.expressen.se/nyheter/politik/regeringen-backar-om-13-aringar-i-fangelse/", "imageUrl": "https://static.bonniernews.se/ba/8cfeb4ca-4bc6-475c-b66c-c706aaed12c2.jpeg?crop=1706%2C1707%2Cx51%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Nordirland: Fortsatta kravaller mot invandrare", "summaries": {"normal": "I Belfast har kravaller mot invandrare blossat upp två kvällar i rad. Polisen använde vattenkanoner och gummikulor mot en folkmassa som försökte nå ett asylhotell. En sudanesisk man grips för mordförsök efter en uppmärksammad knivattack. En lista med över 100 adresser till invandrares bostäder sprids på sociala medier. Offrets familj tar avstånd från våldet och betonar att många invandrare gör viktiga insatser i samhället. Hundratals extra poliser har satts in.", "trump": "Helt otroligt vad som händer i Belfast, folk är arga och det är ingen överraskning. De har släppt in alla möjliga typer som skär halsen av folk mitt på gatan, och nu brinner det. Polisen stoppar dem från att nå asylhotellet, bra, men de borde ha stängt gränserna från början. Fake news kallade honom somalier, typiskt. Amerika behöver inte importera sådana problem, vi har sett det förut. Starka ledare löser det här, inte svaga.", "stalin": "Kamrater, dessa degenererade element i Belfast är en parasitisk infestation orkestrerad av reaktionära krafter och kapitalistiska agitatorer som vill splittra arbetarklassen. Jag ser hur borgarbrackornas lakejer sprider listor över ärliga människors hem för att underblåsa kaos. Den sudanesiske agenten som misslyckades med sin blodiga uppgift är blott en bricka i spelet. Vi ska rensa ut dessa kontrarevolutionära py
