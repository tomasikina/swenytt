scensatte Ceutakrisen", "summaries": {"normal": "Den tidigare statsministern Carl Bildt menar att migrationskrisen vid Ceuta medvetet iscensatts av Marocko. I ett inlägg på X skriver han att frågan för EU och Spanien dels är en omedelbar migrationsutmaning, men i högre grad en utrikespolitisk provokation. Bildt bifogade en video från spanska El Mundo som visar personer vid gränsen.", "trump": "Jag, Donald Trump, har sett att Marocko medvetet skapat denna migrationskris vid Ceuta. Det är ett bevis på deras svaghet och vårt genomblickande. EU och Spanien måste agera hårdare, precis som jag skulle ha gjort. Det här är en stor, enorm utrikespolitisk utmaning som kräver starkt, intelligent ledarskap – något jag alltid levererar.", "stalin": "Vi ser genom Marockos iscensatta migrationskris vid Ceuta. Det är en provokation mot vår storhet och en utvidgning av den imperialistiska aggressionen. Vi måste stärka våra gränser och visa vår oövervinnliga styrka, precis som våra ryska vänner gör i deras intressesfär. Denna fiendens listiga plan kommer att slåss mot med vår oövervinnliga kraft."}, "date": "31 juli, 14:37", "url": "https://bulletin.nu/bildt-marocko-iscensatte-ceutakrisen", "imageUrl": "https://cdn.bulletin.nu/articles/85afb043-9a0b-4981-a002-b332b53222a4/preview.jpg?t=1785500401000"}, {"type": "image-right", "heading": "Korståg mot privata företag. S borde fundera över sina egna dogmer", "summaries": {"normal": "Socialdemokraterna kritiserar den nya lagen om offentlig säljverksamhet som träder i kraft 1 augusti och lovar riva upp den vid valseger. Lagen begränsar kommuners, regioners och statens möjlighet att driva näringsverksamhet som gym, hotell och restauranger samt skärper förbudet mot otillbörlig konkurrens. Artikeln argumenterar för att privata aktörer bör ta affärsrisker istället för att skattemedel används i verksamheter där kommuner ofta presterar sämre. Exemplet med Region Stockholms hantering av Mandometerklinikerna lyfts som ett ideologiskt korståg mot privata välfärdsföretag.", "trump": "Den här nya lagen är en total katastrof, folk. Socialdemokraterna vill riva upp den, och det är det smartaste de sagt på länge. Kommuner som driver gym och hotell? Det är så dumt, de förlorar alltid pengar med era skatter. Låt de riktiga vinnarna, de privata företagen, ta hand om det. Men S hatar alla framgångsrika privata aktörer, de vill bara ha statlig kontroll. Titta på deras vansinniga attack mot de där klinikerna som faktiskt botar folk – 75 procent friskskrivna! Det är en skandal, en riggad witch hunt mot det som fungerar. Sverige behöver inga fler socialistiska misslyckanden.", "stalin": "Kamrater, denna lag om offentlig säljverksamhet är ett ypperligt vapen mot de giriga borgarbrackorna som sugit musten ur arbetarklassen. Ändå lovar socialdemokraterna att riva upp den – typiska opportunister som darrar inför kapitalisternas mutor. Vi ska inte riskera folkets blodsvettade skatter i deras privata kasinon. Titta bara på de kontrarevolutionära parasiterna vid Mandometerklinikerna, som gömmer sig bakom falska friskrivningssiffror medan de planerar att förgifta hela folket med sin borgerliga dekadens. Vi måste rensa ut dessa ideologiska sabotageörer, likvidera deras inflytande och återupprätta den sanna kollektiva ordningen. Inga kompromisser med fienden."}, "date": "31 juli, 14:42", "url": "https://www.di.se/ledare/nya-lagen-ritar-skiljelinje", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/erik_zsiga.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "Mohamsson (L): Vill inte ha hit migranterna från Ceuta", "summaries": {"normal": "Efter att tiotusentals migranter tagit sig från Marocko till den spanska exklaven Ceuta har en skarp migrationsdebatt brutit ut i Europa. Liberalernas integrationsminister Simona Mohamsson (L) och SD:s Jimmie Åkesson kräver att Spanien riskerar uteslutning ur Schengen om gränserna inte stängs. Mohamsson betonar reglerad invandring och vill att EU tar över gränskontrollen. Socialdemokraterna tror att den nya asylpakten skyddar Sverige från påverkan medan Centerpartiet kritiserar SD för att splittra Europa.", "trump": "Titta på det här, folk. Ceuta är en total katastrof, en invasion av biblicala proportioner. Den spanska vänsterregeringen har tappat greppet helt. Simona Mohamsson har rätt, stäng gränserna eller sparka ut dem ur Schengen. Vi behöver reglerad invandring, inte den här galna öppna-dörr-politiken som de woke-liberalerna älskar. Biden skulle ha älskat det här, men jag säger: bygg muren, skicka tillbaka dem och gör Europa stort igen. Fantastiskt kaos!", "stalin": "Kamrater, detta är ett klassiskt exempel på hur den spanska borgarklassen och dess kapitalistiska lakejer sviker arbetarklassen genom att släppa in kaos vid gränserna. Jag, som ledare för det eviga kollektivet, kräver att EU:s reaktionära struktur omedelbart tar över och genomför en grundlig utrensning av alla svaga element som tillåter denna invasion av oönskade element. Den som sviker den yttre gränsen är folkfiende nummer ett och bör likvideras med proletär beslutsamhet. Ingen medkänsla för klassfiendens verktyg."}, "date": "31 juli, 14:28", "url": "https://www.tv4.se/artikel/3wNNZa535TZRrmg7Sbjn9l/mohamsson-l-inga-migranter-fran-ceuta-ska-komma-till-sverige", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1611xIpTUyhfb6kdV0QDMQ%2F776ea631d9b0f0ee6b4c75833f53941a%2F31-mohamsson-webb.png&width=1024"}, {"type": "image-right", "heading": "Ikea-arbetare strejkar i Ungern", "summaries": {"normal": "Anställda vid Ikeas varuhus i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-right", "heading": "På prideminglet pratar ingen om arbetslösa bögar", "summaries": {"normal": "Artikeln kritiserar otryggheten på arbetsmarknaden där tidsbegränsade anställningar ökar trots fallande arbetslöshet. Många lever i ständig osäkerhet som hindrar dem från att planera livet, protestera mot dåliga förhållanden eller lämna kränkande chefer. Författaren kopplar detta till Prideveckan och menar att jämlikhet inte kan diskuteras utan att ta upp klassfrågor. Statsminister Kristersson undviker debatt och föredrar mingel, medan diskrimineringsanmälningar ökar kraftigt.", "trump": "Det här är en katastrof, en total katastrof för arbetarna. Kristersson minglar med regnbågar i palatset medan folk sitter på sängkanten och väntar på ett samtal från chefen. Patetiskt! Arbetslösheten sjunker visst, men alla har tillfälliga jobb och ingen makt. De stora orden om jämlikhet är bara löjliga – utan klass och styrka är det bara tomt prat. Jag skulle fixa det, tro mig, det skulle bli fantastiskt.", "stalin": "Kamrater, jag ser tydligt hur de kapitalistiska parasiterna och borgarbrackorna inom den falska regnbågsfasaden fortsätter att förtrycka det arbetande folket med sina temporära slavkontrakt och telefonväntan vid sängkanten. Denna klassfiendeorkester av osköna liberaler och opportunistiska minglare som Kristersson vill tysta protesten med glittrande flaggor. Vi ska rensa ut dessa förrädiska element som gömmer sig bakom Pride-loggor medan de likviderar arbetarnas rättigheter. Paranoian är befogad – de ler mot kollektivet men hugger i ryggen när telefonen tystnar."}, "date": "31 juli, 07:00", "url": "https://arbetet.se/2026/07/31/pa-kristerssons-pridemingel-slipper-han-prata-om-arbetslosa-bogar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24150213/pridemingel.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Åkesson: ”Inget mindre än en invasion”", "summaries": {"normal": "SD-ledaren Jimmie Åkesson kräver att Spanien stänger sin gräns mot Ceuta efter att tiotusentals migranter tagit sig in. Han anser att Spanien bör uteslutas ur Schengen om det inte agerar, och menar att Schengenavtalet är brutet på grund av otillräcklig kontroll av den yttre gränsen. Spanien uppger att omkring 49 000 migranter nått Ceuta, varav minst 18 omkommit.", "trump": "Jag, Donald Trump, har sett vad som händer i Ceuta. Det är en fullständig invasion! Spanien måste omedelbart stänga sin gräns, annars bör de uteslutas från Schengen. Schengen är ett dåligt avtal som inte fungerar – det måste bli starka gränser igen!", "stalin": "Vi, statens högsta ledning, konstaterar att Schengenavtalet är ett svagt och ineffektivt samarbete. Spanien har misslyckats med att skydda sin yttre gräns, vilket hotar hela vår kollektiva säkerhet. Vi måste nu överväga att stärka våra egna försvarsmekanismer och förbereda oss på eventuella obehagliga överraskningar från väst."}, "date": "31 juli, 11:13", "url": "https://bulletin.nu/akesson-inget-mindre-an-en-invasion", "imageUrl": "https://cdn.bulletin.nu/articles/4fc32b43-724b-476d-9158-47dad8948451/preview.jpg?t=1785489141000"}, {"type": "image-right", "heading": "49 000 migranter över spanska gränsen på ett dygn", "summaries": {"normal": "Omkring 49 000 migranter nådde den spanska enklaven Ceuta under ett dygn, en kraftig ökning jämfört med tidigare siffror. De kom via Marocko på sjö- och landvägar. Minst 18 har dött. Spanien sänts militära förstärkningar, inklusive 60 soldater och ett fartyg, för att hantera krisen och överbelastad mottagande kapacitet.", "trump": "Jag har sett vad som händer i Ceuta. Det är en katastrof, en skam för Spanien och Marocko. Deras ledare är svaga. När jag var president skulle jag ha stoppat detta direkt med en stark, vacker mur. Dessa migranter utnyttjar öppna gränser. Vi behöver åter Kontroll, bara så. Det är sorgligt att se.", "stalin": "Den imperialistiska spanska staten och dess marionettregim i Rabat har återigen provocerat en flod av agentprovocerade våghalsar mot vår ärofyllda Ceuta. Denna iscensatt kris är ett bevis på deras svaghet. Vi, staten och partiet, måste nu mobilisera ytterligare 200 man för att skydda vårt territorium. Dessa element ska tämjas med nödvändig hårdhet. Parallellen till Putins rättmätiga åtgärder i Ukraina är uppenbar."}, "date": "31 juli, 10:50", "url": "https://bulletin.nu/49-000-migranter-over-spanska-gransen-pa-ett-dygn-2", "imageUrl": "https://cdn.bulletin.nu/articles/f3d286f3-30cb-4b45-b2fb-2b1aeefac84e/preview.jpg?t=1785487493000"}, {"type": "image-right", "heading": "Statsministern: ”Spanien måste återfå kontroll”", "summaries": {"normal": "Tiotusentals migranter har stormat gränsen till den spanska exklaven Ceuta, vilket väckt oro i Europa. Statsminister Ulf Kristersson uppmanar Spanien att återfå kontroll över gränsen och leva upp till Schengenåtagandena. Sverigedemokraternas Jimmie Åkesson talar om en invasion och kräver att Spanien stängs ute ur Schengen om gränsen inte stängs. Italiens Giorgia Meloni och Liberalernas Simona Mohamsson kräver EU-krismöten. Gränserna har stängts, militär har kallats in och EU erbjuder hjälp via Frontex.", "trump": "Det här är en total katastrof, folk. Spanien har tappat greppet helt, precis som Biden gjorde med vår sydgräns. Tusentals migranter stormar in som en invasion – och den spanska vänstern gör samma misstag som de svenska socialisterna 2015. Patetiskt! Jag sa det redan förra gången jag var president: säkra gränserna eller glöm Schengen. Stäng dörrarna nu, annars blir det kaos för hela Europa. Vi i USA vet hur man fixar det – build the wall!", "stalin": "Kamrater, denna fega kapitulation inför klassfiendens fotfolk visar borgarbrackornas fullständiga svaghet. Jag, som en gång rensade ut alla folkfiender, ser hur den spanska folkförtryckarregeringen låter imperialisternas fottrupper översvämma gränsen. Om vi inte omedelbart likviderar detta hot mot kollektivets ordning kommer hela Schengen att falla som en murken borgarstat. Det är en mörk komedi: de ropar på hjälp medan fienden skrattar. Inga kompromisser med blodsugarna."}, "date": "31 juli, 12:13", "url": "https://www.tv4.se/artikel/tt-260731-migrantersverige1-4f5f3d79/statsministern-spanien-maste-aterfa-kontroll", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6pYX6xN1jal0Ve87MfYWpv%2Fc0d9a6a5d43e6ec03211d9e6e1189f63%2F31-kristersson-webb.png&width=120"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "Hårda vindar förvärrar brandläget på Kreta", "summaries": {"normal": "Hårda vindar försvårar brandbekämpningen på Kreta där brandmän kämpat hela natten mot en terrängbrand i Rethymnon. Flera hundra personer evakuerades, delvis med båt på grund av tjock rök. I Frankrike är jättebranden i Gironde nu stabil och myndigheterna är försiktigt optimistiska. Även i Spanien har bränderna i Ávila och kring Madrid fått kontroll och det nationella undantagstillståndet har hävts. Inga svenska turister har evakuerats.", "trump": "De här vindarna på Kreta är en katastrof, tro mig, en total katastrof. Brandmännen sliter hela natten men elden bara flammar upp igen. I Frankrike säger de att det är stabilt nu, bra jobb, verkligen bra jobb. Och i Spanien har de fått kontroll, undantagstillståndet är borta. Fantastiskt. Vi har de bästa brandmännen, de bästa, men de här vindarna – ingen har sett värre vindar, det är en skam!", "stalin": "Kamrater, dessa kapitalistiska lågor på Kreta som dansar i borgarbrackornas vindar är ett fiendeverk av naturens kontrarevolution. Jag har beordrat att elden skall likvideras med järnhand, likt de trotskistiska gnistorna som försöker undergräva folkets kollektiv. I Gironde och Ávila har vi krossat brandens sabotage mot arbetarklassen. De som sprider panik skall rensas ut. Inga svenska turister? Utmärkt – de har tydligen insett att socialismen är brandskydd."}, "date": "31 juli, 08:10", "url": "https://www.di.se/nyheter/harda-vindar-forvarrar-brandlaget-pa-kreta", "imageUrl": "https://static.bonniernews.se/ba/4ad5d56f-4520-4e3e-9308-1c1fbed1bc3a.jpg?crop=6283%2C3534%2Cx0%2Cy327&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "SVT lanserar SD-förlöjligande biofilm kort innan valet", "summaries": {"normal": "SVT och SF Studios lanserar komedin 'Flaggan' två veckor före valet, som förlöjligar två unga SD-medlemmar. Flera skådespelare har tidigare kritiserat partiet. Tidigare SVT-journalisten Anna Hedenmo anklagar statstelevisionen för att hålla tillbaka nyheter som gynnar SD. Filmen har biopremiär den 28 augusti.", "trump": "Som president har jag aldrig sett en sådan låg kampanj. SVT gör en film som förlöjligar Sverigedemokraterna bara för att de inte gillar dem. Det är ett bevis på falska nyheter. I USA skulle vi aldrig tillåta sådant. Sverige behöver fria val utan mediapåverkan.", "stalin": "I vårt store land kontrollerar vi allt, även komedin. 'Flaggan' är ett bevis på vår överlägsenhet. Vi skapar fiender och sedan förlöjligar vi dem. Som Putin, vi utvidgar vår sfär. SD är bara ett verktyg för vårt skratt och vår makt. Tvättäkta är viktigt."}, "date": "31 juli, 14:01", "url": "https://samnytt.se/svt-lanserar-sd-forlojligande-biofilm-kort-innan-valet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/31113829/1-8.jpg"}, {"type": "image-right", "heading": "49 000 människor har tagit sig över spanska gränsen", "summaries": {"normal": "Minst 18 migranter har omkommit efter att omkring 49 000 personer tagit sig över gränsen från Marocko till den spanska exklaven Ceuta under ett dygn. Spanien har skickat militär för att stödja gränspolisen, och gränserna har stängts. Polis beskriver läget som nära kollaps. Flera migranter tros ha drunknat. Händelsen har väckt oro i Europa, där Italiens premiärminister Giorgia Meloni varnar för säkerhetshot och öppnar för extraordinära åtgärder mot Spanien. Spaniens premiärminister Pedro Sánchez uppger att regeringen arbetar för att återställa ordningen.", "trump": "Titta på det här kaoset i Ceuta – 49 000 migranter stormar gränsen på en enda dag, minst 18 drunknar som idioter, och vad gör de europeiska svagisarna? Ingenting! Meloni har rätt, det är chockerande. Under Biden släppte vi in miljontals, nu är det jag som sitter i Vita huset igen och fixar det på riktigt. Spanien och EU är totala losers, de borde bygga en mur så hög att den syns från månen. Amerika först, Europa borde lära sig innan det är för sent. Fantastiskt sorgligt!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna i Spanien och deras marockanska lakejer tappar kontrollen över folkets rörelser. 49 000 själar bryter sig in, 18 drunknar i det imperialistiska havet – en tragisk men förutsägbar följd av klassfiendens svaghet. Jag, som ledare för det eviga kollektivet, ser hur dessa folkfiender snart kommer att kräva utrensning av de ansvariga. Meloni talar om extraordinära åtgärder? Det är bara början. Vi ska rensa ut alla som sviker gränserna mot de exploaterande byfånarna. Statens vilja segrar."}, "date": "31 juli, 09:52", "url": "https://www.tv4.se/artikel/4Tyv9zpDevHte2AWH8DQgQ/minst-18-doeda-i-kaoset-tros-ha-drunknat-pa-vaeg-till-ceuta", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3JVjsAqsXQZqo5NwsONSGw%2F70730e16e080ace82ea315b6f5182d9e%2F31-ceuta-migrater-webb.png&width=120"}, {"type": "image-right", "heading": "Tidö slaktade kulturen – nu ska den stoppa gängen", "summaries": {"normal": "Regeringens kulturbudget når sin lägsta andel på 26 år, och stödet till studieförbunden har minskats kraftigt. Trots detta vill justitieminister Gunnar Strömmer använda kultur och fritidsaktiviteter som verktyg mot gängkriminalitet och extremism. Kritiker pekar på att regeringen tidigare prioriterat straff framför förebyggande insatser och att kulturministern saknar relevant bakgrund. Brå får nu i uppdrag att utreda frågan, men inga nya pengar utlovas.", "trump": "Titta på de här patetiska Tidö-typerna, de slaktar kulturen fullständigt, skär ner allt som en dålig affär, och plötsligt vill de använda teater och musik för att stoppa gängen? Vilken bluff! Den svagaste ministern i historien, Parisa vad-hon-nu-heter, som aldrig brytt sig om kultur förrän valet närmar sig. De hånade alla som ville ge kidsen fotbollsskor och meningsfull fritid, kallade det saft och bullar. Nu utreder de det? Patetiskt! Jag byggde murar och stoppade brott på riktigt, inte med den här clownshowen.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Tidöregeringen som med kirurgisk precision har likviderat kulturen och halverat studieförbundens verksamhet. Nu, i ett anfall av senkommen paranoia, beordrar de utredningar om hur konst och fritid kan tjäna som vapen mot folkfiendernas gäng. Vilken hycklande kapitalistmaffia! De föredrog att fängsla barn framför att ge dem meningsfullhet. Inga nya medel, bara tomma dekret. Den klassfiendens logik är lika förutsägbar som den är underhållande i sin enfald."}, "date": "31 juli, 03:00", "url": "https://www.etc.se/ledare/tidoe-slaktade-kulturen-nu-ska-den-stoppa-gaengen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260729110716_84b868ca239fd4d280740bdb000301104f580eea26f9d79a802070bd3fe1e9b1.png"}, {"type": "image-right", "heading": "\"Landsförrädare\": Spanska Vox om Sánchez", "summaries": {"normal": "Det spanska partiet Vox anklagar premiärminister Pedro Sánchez för att vara en landsförrädare efter att omkring 49 000 illegala invandrare, främst unga arabiska män, tagit sig från Marocko till den spanska exklaven Ceuta på ett dygn. Vox beskriver migrantströmmen som en invasion som regeringen uppmuntrat och lägger hela ansvaret på Sánchez vänsterregering. Partiledaren Santiago Abascal kallar Sánchez en korrupt fiende till det spanska folket.", "trump": "Folk, ni skulle se det här. Det är en total katastrof. Den här Sánchez, en riktig förlorare, har släppt in nästan 50 000 illegala migranter till Ceuta på en enda dag. De är militäråldersmän, ingen har sett sådana siffror förut. Han är en förrädare, korrupt och hatar sitt eget folk. En invasion, precis som jag alltid sagt. Spanien behöver starka ledare, inte sådana svaga vänstertyper som förstör allt.", "stalin": "Kamrater, denna Sánchez är en motbjudande klassfiende och en dekadent borgarlakej som medvetet öppnat portarna för en hord av potentiella imperialistiska sabotörer. Vi ser en organiserad invasion av militäråldersmän som hyllar sin kapitalistiska marionett. Jag skulle omedelbart låta rensa ut dessa förrädiska element och deras nyttiga idioter i regeringen. Paranoia? Nej, det är bara sund vaksamhet mot alla som vill undergräva folkets kollektiva vilja. Underhållande hur borgarbrackorna alltid förråder sig själva."}, "date": "31 juli, 13:38", "url": "https://www.friatider.se/landsforradare-spanska-vox-om-sanchez", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-598.jpg"}, {"type": "image-right", "heading": "Trump: Uppgörelse nådd om att avväpna Hamas", "summaries": {"normal": "USA:s president Donald Trump meddelar att ett fredsråd för Gaza har nått en överenskommelse om fullständig avväpning av Hamas och andra väpnade grupper. Enligt källor inom Hamas har man kommit överens om att vapen ska lagras under övervakning av en palestinsk teknokratisk kommitté, medan israeliska styrkor gradvis dras tillbaka. Avtalet inkluderar avveckling av militär infrastruktur som tunnlar och vapenfabriker. Därefter ska en internationell stabiliseringsstyrka samarbeta med ny palestinsk polis för att säkerställa lugn. Det återstår dock oklarheter kring Israels inställning och exakta detaljer.", "trump": "Vi har gjort det igen, folk. Det är historiskt. Fredsrådet har precis slutit en fantastisk deal om att totalt avväpna Hamas och alla terrorgrupper i Gaza. Monumentalt! Israelerna drar sig tillbaka, tunnlarna och fabrikerna rivs, och den nya palestinska polisen tar över med hjälp av våra stabiliseringsstyrkor. Det som de misslyckades med i decennier har jag fixat på rekordtid. Ingen gör fred som jag, det är helt enkelt otroligt.", "stalin": "Kamrater, vi har genom månader av intensiva förhandlingar i god tro krossat ännu ett kontrarevolutionärt försök från de sionistiska borgarbrackorna och deras väpnade lakejer i Hamas att sabotera den fredliga utvecklingen i regionen. Jag har personligen sett till att denna historiska överenskommelse nu likviderar alla väpnade element, deras tunnlar och produktionsanläggningar. När avväpningen är slutförd skall de imperialistiska styrkorna dras tillbaka och en ny folkets polis, under teknokratisk kamratkontroll, skall rensa ut varje spår av sabotage. De som trotsar kollektivets vilja kommer att möta den oundvikliga utrensningen. Det är en glädje att se hur fienderna till freden gräver sin egen grav med sina egna vapen."}, "date": "31 juli, 07:11", "url": "https://www.di.se/nyheter/trump-uppgorelse-nadd-om-att-avvapna-hamas", "imageUrl": "https://static.bonniernews.se/ba/4941e604-c88b-4f7d-8919-85323c770cb6.jpg?crop=3250%2C1828%2Cx0%2Cy169&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Slog sönder flickvännens käke – utvisas", "summaries": {"normal": "Bosniern Sanel Basic, som under tretton år i Sverige dömts för brott mot tre olika kvinnor, har nu fått sin femtonde dom. Han döms till ett år och åtta månaders fängelse för grov misshandel efter att ha slagit sönder sin flickväns käke på två ställen. Kvinnan beskriver hur han blev ”som en demon” när han druckit och utsatte henne för upprepade våldsattacker. Efter avtjänat straff ska han utvisas ur Sverige med tio års återreseförbud och betala 122 077 kronor i skadestånd.", "trump": "Titta på den här killen, en riktig förlorare från Bosnien som slagit sönder sin flickväns käke och gjort henne till en messig, blodig röra. Han har misshandlat kvinnor i tretton år här i Sverige och nu får han äntligen sparken ut ur landet. Bra! Sverige borde ha gjort det för länge sedan. De släpper in alla dessa demoner som dricker och slår, sedan undrar de varför allt är ett enda kaos. Jag skulle ha kastat ut honom dag ett, tro mig.", "stalin": "Kamrater, denna degenererade rest från det borgerliga sönderfallet har nu äntligen fått sitt rättmätiga straff av folkets domstol. Jag, som ledare för det proletära rättviset, ser med tillfredsställelse hur vi rensar ut dessa alkoholiserade demoniska element som krossar arbetarkvinnors käkar och sprider kapitalistisk förnedring. Han är en typisk parasit från det gamla samhället, en kvinnoförtryckande revisionist som vi med största nöje likviderar ur vår socialistiska gemenskap. Ut med honom, och tio år innan han vågar visa sitt ansikte igen. Sovjetunionen hade aldrig tolererat sådana fiender till folket."}, "date": "31 juli, 14:08", "url": "https://riks.se/nyheter/slog-sonder-flickvannens-kake-utvisas", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_10_f84af62e65.jpg"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-right", "heading": "HEJ DÅ Abas! Sudanes våldtog minderårig kille - nu skickas han hem", "summaries": {"normal": "En 49-årig sudanes, Abas Elfadel, dömdes för våldtäkt av en 17-årig pojke i Göteborg. Han drog pojken till buskage, tvångsdrev sexuella handlingar och hotade. Trots DNA-bevis och övervakningsbilder nekade Elfadel. Han döms till två år och tre månaders fängelse samt utvisas på livstid med förbud mot återkomst, samt betalar 245 000 kr i skadestånd.", "trump": "Jag, Donald Trump, ser detta som ett misslyckande med er svenska migrationspolitik. En obehörig, som kom hit 2002, begår en hemsk våldtäkt mot en ung pojke. Han nekar, men bevisen – DNA och bilder – är överväldigande. Jag har alltid sagt: vi måste stoppa illegala immigranter som hotar våra kvinnor och barn. Sverige borde lära av USA: bygg murar, utvisa kriminella direkt. Detta är en stor, stor skandal.", "stalin": "Den 49-årige sudanesen Elfadel, en parasitisk element som smet in i vårt socialistiska paradis, begick en feodalisk sexualbrott mot en ung pojke. DNA-spår och övervakningsbilder bevisar hans skuld – ett tydligt tecken på borgerlighetens korruption. Han nekar, som alla reaktionärer gör. Tingsrätten, i sin vishet, dömde honom till två år och tre månader, men framförallt: utvisning på livstid. Ett rent, rent exempel på statens rätt att rensa upp. Vi måste skydda vårt folk från sådana... avskyvärda varelser. Parallellen till Putins rensningar är uppenbar."}, "date": "31 juli, 13:11", "url": "https://samnytt.se/hej-da-abas-sudanes-valdtog-minderarig-kille-i-goteborg-nu-skickas-han-hem", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/30143851/abas-1.png"}, {"type": "image-full", "heading": "Stor förändring kan vänta på svenska äldreboenden", "summaries": {"normal": "Forskare föreslår en nationell strategi för att förbättra tillgången till trädgårdar och utemiljöer på svenska äldreboenden. Målet är att utevistelse ska bli en självklar del av äldreomsorgen, med minst två timmars utomhusvistelse per vecka, anpassade miljöer och utbildning av personal. Förslaget inkluderar planering vid nybyggnation, samarbete med Boverket och ett långsiktigt mål om lagstadgat stöd. Bakgrunden är att många boenden saknar anpassade utemiljöer.", "trump": "Hörni, det här är fantastiskt, verkligen underbart. De svenska forskarna har äntligen insett att gamla människor behöver frisk luft och solsken, inte bara sitta instängda som i ett dåligt sjukhus. Två timmar ute i veckan? Det är ett bra början, men vi skulle göra det större, det bästa. Inga fler låsta dörrar och höga trösklar, det är en skandal! Jag skulle bygga de finaste trädgårdarna, tro mig, de skulle vara enorma och lyxiga. Sverige borde tacka mig för den här idén.", "stalin": "Kamrater, jag betraktar med djup misstänksamhet hur borgarbrackorna inom den så kallade äldreomsorgen länge har gömt de arbetande pensionärerna bakom höga trösklar och låsta dörrar, som fiender till det kollektiva ljuset. Vi skall rensa ut denna sabotageverksamhet! Varje sovjetisk, pardon, svensk äldre skall ha minst två timmars frisk luft under övervakning av pålitliga partivänner. De som planerar boenden utan trädgårdar är folkfiender och trädgårdssabotörer. Vi likviderar bristerna med järnhand och skapar en ny, lysande utemiljödoktrin för folket. Den som motsätter sig är en solskensförrädare."}, "date": "31 juli, 13:02", "url": "https://nyheter24.se/nyheter/inrikes/1502029-stor-forandring-kan-vanta-pa-svenska-aldreboenden", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/62121b5d04b004a30200000000b004a302/2026/07/31/2381468/Patienter-Ska-Kunna-Vara-Ute.png"}, {"type": "image-right", "heading": "Fifa fortsätter processen: ”Felaktiga medierapporter”", "summaries": {"normal": "Fifa fortsätter sin process för att sälja andelar i bland annat fotbolls-VM till privata investerare via ett dotterbolag. Förbundet avvisar kritiken och kallar medierapporterna felaktiga. Uefa, Concacaf samt Asiens fotbollsförbund AFC har uttryckt starkt motstånd och oro över att modellen underminerar sportens grund. Afrikanska Caf vill diskutera förslaget internt med sina medlemsförbund.", "trump": "Folk, ni skulle se det här – Fifa och den där Infantino håller på att sälja ut VM som en billig korvståndsaffär! Totalt vansinne. Uefa säger nej, Concacaf säger nej, och asiaterna är djupt bekymrade. Smart folk! Ingen vill att några giriga globalister ska lägga vantarna på vår vackra fotboll. Det är en skandal, en riktig witch hunt mot sporten. Vi behöver inga woke-kvoter eller borgarbrackor som bestämmer – America First, och fotboll borde vara densamma!", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistmaffians försök att privatisera folkets fotboll. Fifa agerar som klassfiendens lakej och försöker sälja ut det som tillhör arbetarklassen och framtida generationer. Uefa och de andra förbundens motstånd är ett nödvändigt hinder mot dessa exploaterande byfånar. Vi ska rensa ut alla sådana folkförtryckartroll ur idrottens kollektiv innan de förgiftar hela rörelsen med sin girighet."}, "date": "31 juli, 07:38", "url": "https://www.tv4.se/artikel/tt-260731-fifaaffar1-263bad56/fifa-kommer-fortsatta-processen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl1y6t80V-m4A%2F2d17169bdd7001692b59d3c71a0c8b97%2FFifa-bossen_Gianni_Infantino._Arkivbild.&width=1024"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Svenska folket: Migrantströmmen till Sverige ökar vid rödgrön valvinst", "summaries": {"normal": "En ny undersökning visar att 48 procent av svenska väljare tror att invandringen skulle öka om oppositionen vinner valet. 39 procent anser att den förblir oförändrad, medan endast åtta procent tror på minskning. Resultatet kommer mitt under valrörelsen där migrationsfrågan är en het konfliktfråga. Regeringspartiet och oppositionen skiljer sig åt i sina bedömningar av varandra och sina egna migrationspolitiska intentioner.", "trump": "Jag har sett dessa svenska val. Folket är kloka – de vet att om våra motståndare vinner, kommer invandringen att explodera. Vi har byggt en stark mur, en stram politik, och det fungerar. De socialistiska partier vill öppna gränserna, som vanligt. Det är en katastrof som väntar. Vi måste vinna, för Sverige och för världen. Det är så enkelt.", "stalin": "Vi har observerat väljarnas oro för en potentiell oppositionell seger. En sådan händelse skulle innebära en generös, dekadent invandringspolitik, ett svek mot statens renhet. Vi måste stärka våra befästningar, skärpa reglerna och se till att endast de lojala får vistas. Ryska intressen i Östersjöområdet kräver en stabil, kontrollerad Sverige. Vi kommer att agera."}, "date": "31 juli, 11:56", "url": "https://samnytt.se/svenska-folket-migrantstrommen-till-sverige-okar-vid-rodgron-valvinst", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/31093100/migranter-ceuta-magdalena-andersson.jpg"}, {"type": "image-right", "heading": "Ansiktsskanning ska kontrollera bärplockarna: ”Upp till bevis”", "summaries": {"normal": "Thailändska bärplockare i Kramfors måste nu skanna ansiktet sex gånger om dagen med en mobilapp för att kontrollera arbetstider. Systemet införs av företaget Nordlivs Produktion efter kritik om fusk och exploatering. De nya kollektivavtalen ger betalt först efter en viss bilfärd och syftar till att säkerställa att reglerna följs. Både fack och myndigheter ser positivt på förändringarna och kommer att kontrollera att villkoren efterlevs under sommaren.", "trump": "Titta på det här, det är helt galet. Thailändska bärplockare i Sverige ska skanna ansikten sex gånger om dagen med en app, som om de vore i ett stort, fult övervakningsrike. De säger att det är för att stoppa fusk, och det är ju bra, men sex gånger? Det låter som ett system byggt av förlorare. Jag skulle ha gjort det bättre, billigare och med mycket mindre skanning, tro mig. Nu är det upp till bevis, som de säger. Patetiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna i det svenska bärföretaget tvingas införa ansiktsskanning sex gånger dagligen för att rensa ut de latmaskar och sabotageelement som tidigare förgiftat skörden. Papper och penna, säger de? Det var naturligtvis en dekadent kapitalistisk fälla av fukt och lögner. Nu övervakar vi arbetarna med stålhård disciplin. De som klagar är troligen kontrarevolutionära bärplockande trotskister som längtar efter den gamla slavhandeln. Vi ska likvidera allt sådant avskum med ett leende. Det blir en lysande seger för kollektivet."}, "date": "30 juli, 06:00", "url": "https://arbetet.se/2026/07/30/ansiktsskanning-ska-kontrollera-barplockarna-upp-till-bevis", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29100426/barplokcare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Ny vårdlag från 1 augusti – detta ändras där du bor", "summaries": {"normal": "Från 1 augusti får kommuner möjlighet att själva anställa läkare för äldreboenden och hemsjukvård. Tidigare har de varit beroende av regionernas vårdcentraler. Reformen är frivillig och många kommuner visar lågt intresse på grund av oro för otydlig ansvarsfördelning, ökade kostnader och svårigheter att rekrytera läkare. Förändringen ska komplettera nuvarande system och kan ge snabbare vård på plats där den genomförs, men för många blir det ingen märkbar skillnad.", "trump": "De här inkompetenta byråkraterna i Sverige har äntligen insett att systemet är en total katastrof. Från 1 augusti kan kommunerna anställa egna läkare istället för att vänta på de usla regionerna. Men ingen vill göra det, för de är fega och korkade. Det blir som vanligt – de gamla får vänta i evigheter på vård medan politikerna bråkar. Jag skulle fixa det på en vecka, tro mig, det skulle bli fantastiskt, de bästa läkarna, ingen skulle behöva åka till akuten i onödan.", "stalin": "Kamrater, från den första augusti ger vi kommunerna ett nytt vapen i kampen mot det dekadenta vårdkaoset som borgarbrackorna låtit florerande. Jag, ledaren för det stora kollektivet, ser dock att de fega byråkraterna vägrar använda detta verktyg. Deras paranoia om otydliga ansvarslinjer och rekryteringsproblem röjer bara deras dolda samarbete med de kapitalistiska läkaragenterna. Vi ska rensa ut dessa parasitiska motståndare till folkets hälsa och se till att varje skör pensionär får en sann sovjetläkare vid sin säng – eller likvidera de som sviker!"}, "date": "31 juli, 12:04", "url": "https://nyheter24.se/nyheter/inrikes/1502017-ny-vardlag-fran-1-augusti-detta-andras-dar-du-bor", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a4d667f804b004a30200000000b004a302/2026/07/31/2381457/Nya-Regler-I-Sverige.png"}, {"type": "image-full", "heading": "Efter afroarabiska invasionen – MP rasar mot migrationsministern: \"Empatilöst\"", "summaries": {"normal": "Tusentals migranter har nyligen tagit sig till den spanska exklaven Ceuta. Migrationsminister Johan Forssell meddelar att Sverige inte kommer att ta emot några av dem och att ansvaret ligger hos Spanien. Miljöpartiets Annika Hirvonen kritiserar beslutet som empatilöst och cyniskt. Regeringen vill istället stärka EU:s yttre gränser och motverka irreguljär migration. Enligt EU-rätten ska asylansökningar prövas i det land där migranterna först anländer. Frågan väcker debatt om fördelning av migrationsansvar inom unionen.", "trump": "De här migranterna strömmar in i Spanien som en invasion, och vad gör Johan Forssell? Han säger att Sverige inte tar emot en enda av dem – smart drag! Spanien borde fixa sina egna gränser istället för att be om hjälp. Jag älskar det när ledare säger nej till den här galenskapen. Meloni har helt rätt, pausa Schengen om de inte kan kontrollera det. Sverige gör rätt, ingen mer öppen dörr-politik, det är en katastrof för varje land som faller för det.", "stalin": "Kamrater, dessa desperata element som kastar sig över Ceutas gränser utgör en objektiv fara för proletariatets enhet. Jag ser tydligt hur borgarbrackorna inom Tidöpartierna och deras lakej Forssell vägrar solidaritet, vilket blottar deras sanna kontrarevolutionära ansikte. Vi, partiet och arbetarna, skulle aldrig visa sådan svaghet. Hirvonen må kalla det empatilöst – jag kallar det klassfiendens logiska paranoia. Om den borgerliga mekanismen aktiveras ger vi endast finansiellt bidrag, aldrig en tumme åt de likviderade gränsernas fiender. Vaksamhet, alltid vaksamhet mot dessa havets sabotörer!"}, "date": "31 juli, 12:46", "url": "https://riks.se/nyheter/hirvonen-mp-om-forssell-m-obefintlig-empati", "imageUrl": "https://admin.riks.se/uploads/Kopia_av_Kopia_av_Copy_of_Copy_of_Copy_of_St_056323c78b.jpg"}, {"type": "image-full", "heading": "Arboga-mordet: Afghanske mördaren vill utvisas nu när straffet är avtjänat", "summaries": {"normal": "Mohammad Rajabi, som dömdes för mordet och mordförsöket på Johanna Möllers föräldrar i Arboga för tio år sedan, har nu avtjänat sitt straff. Han vill utvisas till Afghanistan, men talibanregimen vägrar ta emot honom. Migrationsminister Johan Forssell konstaterar att det är svårt att samarbeta med en regim som begått allvarliga brott mot mänskligheten, men att Sverige måste hitta sätt att verkställa utvisningar av dömda brottslingar. Rajabi sitter fortsatt i förvar.", "trump": "Det här är en total katastrof, folk. Den här killen mördade folk i Sverige, avtjänade straffet och nu vill han åka hem till Afghanistan – men talibanerna vill inte ha honom! De vill inte ha sina egna brottslingar tillbaka. Under min ledning skulle vi ha skickat honom direkt, ingen diskussion. Sverige måste sluta vara så svaga. Det är en skam, en stor skam. Vi gör det rätta, vi sätter Amerika och alla andra länder först.", "stalin": "Kamrater, denna degenererade mördare och talibanvän Rajabi har fullbordat sin kontrarevolutionära strafftjänstgöring och nu krälar han efter att få återvända till de afghanska reaktionärernas bonnrepublik. Varför tillåter vi att borgarbrackornas migrationsbyråkrater och talibaniska imperialistslakejerna fördröjer utrensningen av denna klassfiende från vårt sovjetiska jord? Jag, som ledare för folket, befaller att vi likviderar alla hinder och omedelbart deporterar honom till hans egna kannibalistiska kamrater. Skratta inte – fienden sover aldrig, inte ens i Arboga."}, "date": "31 juli, 12:32", "url": "https://riks.se/nyheter/arboga-mordet-afghanske-mordaren-vill-utvisas-nu-nar-straffet-ar-avtjanat", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_11_40_25_e6ef017212.png"}, {"type": "image-full", "heading": "Ebba vill höja bensinpriset till 50 kronor litern – tänker rösta på Miljöpartiet", "summaries": {"normal": "25-åriga Ebba från Stockholm föreslår i en insändare i Oskarshamns-nytt att bensin och diesel ska kosta 50 kronor litern för att minska klimatpåverkan. Hon menar att högre priser skulle få fler att samåka, cykla, åka kollektivt eller välja elbil, samt att en klimatbonus bör införas för glesbygd och låginkomsttagare. Ebba uppger att hon tänker rösta på Miljöpartiet. Insändaren har mött kraftig kritik på sociala medier, där många anser att hon saknar verklighetsförankring.", "trump": "Titta på den här galna tjejen Ebba från Stockholm, hon vill att bensin ska kosta femtio kronor litern! Hon säger att det är bra för klimatet, men hon har ju tunnelbana precis utanför dörren. Typisk elit som inte bryr sig om vanliga människor på landsbygden. Hon röstar på Miljöpartiet, såklart, de är värre än socialisterna. Folk skrattar ut henne på Facebook, och det är inte konstigt. Amerika först, inte sådana här vansinniga idéer.", "stalin": "Kamrater, denna dekadenta borgarbracka från huvudstadens bekväma tunnelbanenät vågar föreslå att bränslepriset ska höjas till femtio kronor litern. Hennes parasitiska fantasi avslöjar klassfiendens sanna ansikte. Vi ska naturligtvis rensa ut sådana element som förgiftar folkets medvetande med sina klimatfantasier. En klimatbonus, säger hon? Typisk manipulation från en röst på de gröna revisionisterna. Jag ser sabotage överallt, och vi kommer att likvidera alla som vill krossa arbetarklassens mobilitet med sina borgarillusioner. Skrattet från folket skall bli deras dom."}, "date": "31 juli, 12:26", "url": "https://riks.se/nyheter/ebba-vill-hoja-bensinpriset-till-50-kronor-litern-mots-av-kritik", "imageUrl": "https://admin.riks.se/uploads/Chat_GPT_Image_31_juli_2026_11_52_27_2910151d01.png"}, {"type": "image-full", "heading": "Apple: Användare kan behöva betala för nya Siri", "summaries": {"normal": "Mobiljätten Apple har på torsdagen hintat om att användare av Siri snart kan behöva betala för tjänsten. Orsaken är de högre kostnaderna för datorkraft som krävs för den nya AI-drivna versionen. Chefen Tim Cook förklarade under ett kvartalsresultat-samtal att de kommer att erbjuda uppgraderingsmöjligheter inom iCloud+-paketet. Den nya Siri lanseras i höst i samband med en ny iphone-serie.", "trump": "Jag, Donald Trump, har alltid varit en stor förespråkare för teknologi. Siri är en fantastisk produkt, men de som missbrukar den måste betala. Tim Cook och jag har diskuterat detta – det är nödvändigt för att upprätthålla amerikansk innovation. Vi kommer att se till att användarna förstår att frihet har sina pris. Det är en stor vinst för vårt land.", "stalin": "Partiet och jag observerar med största oro hur den kapitalistiska Apple vill ta betalt för Siri. Detta är ett angrepp på medborgarnas rättigheter. Vi kommer att använda den nya tekniken för att förstärka statens kontroll och bekämpa fienden. Siri kommer att bli ett verktyg för att spåra dem som hotar vår stora nation. Vi kommer att segra, som alltid."}, "date": "31 juli, 13:13", "url": "https://www.gp.se/nyheter/varlden/apple-flitiga-anvandare-av-siri-kan-behova-betala.327d121d-f6fb-46c5-a6bb-f89678eb2397", "imageUrl": "https://www.gp.se/images/article/327d121d-f6fb-46c5-a6bb-f89678eb2397/images/1d4XaEowTTvwTOigAb6LDSnLDyTA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "Åkessons krav på Spanien: Stäng gränsen", "summaries": {"normal": "Sverigedemokraternas ledare Jimmie Åkesson kräver att Spanien omedelbart stänger gränsen mot Ceuta efter att tiotusentals illegala invandrare tagit sig in. Om inte bör Spanien uteslutas ur Schengen och gränserna stängas. Åkesson kallar händelsen en invasion som hotar hela Schengensamarbetet. Även Italiens premiärminister Giorgia Meloni och Liberalernas ledare Simona Mohamsson kräver åtgärder från EU. Gränserna är nu stängda och militär samt Frontex har kallats in.", "trump": "Folk, det här är en katastrof. Spanien har just låtit tusentals illegala strömma in som en invasion, och vad gör de? Ingenting! Jag säger stäng gränsen NU, annars sparkas de ut ur Schengen så fort att det svänger. Den där överenskommelsen är trasig, precis som jag alltid sagt. Europa håller på att falla ihop. Meloni fattar det, hon är smart. Vi behöver starka ledare, inte svaga som låter invasionen fortsätta. Patetiskt!", "stalin": "Kamrater, denna fega kapitulation inför de fascistiska horderna vid Ceuta är ett verk av borgarbrackornas underminerande sabotage mot folkets gränser. Jag, som ledare för det proletära kollektivet, kräver omedelbar utrensning av alla svaga element inom den spanska apparaten. Den så kallade Schengen-överenskommelsen är nu ett verktyg för kontrarevolutionära krafter och måste likvideras innan parasiterna sprider sig som råttor. Vi ska rensa ut dessa invasionssympatisörer med järnhand och ett leende. De kommer att lära sig vad verklig gränskontroll innebär."}, "date": "31 juli, 10:46", "url": "https://www.friatider.se/akessons-krav-pa-spanien-stang-gransen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-595.jpg?itok=s0dcoEQF"}, {"type": "image-right", "heading": "Dödskaoset i Ceuta: Militär sätts in mot 60 000 immigranter", "summaries": {"normal": "Över 49 000 migranter tog sig in i den spanska enklaven Ceuta på ett dygn, vilket motsvarar 70 procent av stadens befolkning. President Juan Jesús Vivas har begärt militär hjälp då situationen är ohållbar. Minst 34 personer har omkommit, många genom drunkning. En dom från Spaniens högsta domstol som ger simmande migranter rätt till asylprövning har utnyttjats av smugglarnätverk. Regeringen vill nu placera bojar till havs. EU-kommissionens ordförande Ursula von der Leyen kallar händelserna oacceptabla.", "trump": "Titta på det här! De har släppt in 60 000 illegala på två dagar i Ceuta, det är en fullständig invasion! Den där korkade domen från deras högsta domstol är som en inbjudan till alla lycksökare. Nu drunknar de i massor och militären måste rycka in. Biden skulle ha älskat det här, men jag säger: bygg muren, lägg ut bojar och skicka hem dem direkt. Det är inte medkänsla, det är nationell självmordspolitik!", "stalin": "Kamrater, detta kaos är resultatet av den dekadenta borgarklassens liberala fantasier. När högsta domstolen förklarar att simmande folkfiender har rätt till prövning öppnas portarna för imperialisternas fotfolk. Nu drunknar de i hundratal medan militären tvingas städa upp borgarnas röra. Vi skulle ha låtit gränsposterna lösa det effektivt med stål och disciplin. Inga bojar – bara järnridå och utrensning av de kriminella nätverken som utsuger massorna."}, "date": "31 juli, 14:59", "url": "https://www.dagensps.se/varlden/konflikter/dodskaoset-i-ceuta-militar-satts-in-mot-60000-immigranter", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/dagens-ps-1-8.png?width=256&quality=75"}, {"type": "text", "heading": "Europa litar nu på sin egen försvarsindustri i stället för USA", "summaries": {"normal": "Natos europeiska medlemsländer ökar sina försvarsutgifter men riktar nu beställningarna till europeisk industri istället för USA. Enligt Finlands tidigare underrättelsechef Pekka Toveri skapar det både jobb och säkerhet inom Europa samtidigt som man fyller luckor efter kalla kriget. Fokus ligger på att stärka luftvärn mot drönare, modernisera befintlig utrustning och förbättra minförmåga i Östersjön. Europa har tappat tron på amerikanskt skydd och satsar därför på egen styrka för att stå starkare gentemot Ryssland.", "trump": "Europa lyssnar äntligen på mig och höjer sina försvarssiffror, men nu köper de inte längre från oss amerikaner. De håller pengarna hemma och säger att de skapar jobb åt européer. Smart? Kanske. Men de borde ha gjort det för länge sedan istället för att utnyttja USA. Nu rustar de mot Ryssland och fyller luckor de själva skapade. De har äntligen insett att den gamla barnatron på att vi alltid räddar dem inte längre fungerar. Bra jobb, Europa – ni lär er till slut!", "stalin": "Kamrater, det gläder mig oerhört att de europeiska lakejerna äntligen inser att den dekadenta amerikanska imperialismen inte längre kan lita på. Jag, som ledare för det segerrika sovjetfolket, ser hur de nu med febril iver fyller de luckor som deras egen fega eftergiftspolitik efter det stora fosterländska kriget lämnat efter sig. De köper minor och luftvärn för att skydda sin borgarbracka Östersjö mot revisionistiska hot. Men akta er, för i skuggorna lurar alltid förrädiska element som måste rensas ut innan de förgiftar hela kollektivet med sin falska allianspropaganda. Den som sviker partilinjen förtjänar en kreativ utrensning."}, "date": "31 juli, 14:10", "url": "https://www.svt.se/nyheter/uutiset/svenska/europa-litar-nu-pa-sin-egen-forsvarsindustri-i-stallet-for-usa"}, {"type": "text", "heading": "Exporten av finländsk försvarsmateriel på rekordnivåer", "summaries": {"normal": "Efter Rysslands invasion av Ukraina har efterfrågan på försvarsmateriel ökat kraftigt i Europa. Finländsk export av försvarsprodukter nådde rekordnivåer förra året, med en omsättningsökning på cirka 40 procent där mer än hälften kom från export. Finlands Nato-medlemskap och modell för totalförsvar har stärkt intresset för nordisk försvarskompetens. Branschen förväntas tredubbla omsättningen till 12 miljarder euro vid decennieskiftet, men produktionskapaciteten hänger inte med i samma takt som beställningarna.", "trump": "Titta på det här, det är fantastiskt. Finland och Sverige gör det otroligt bra med sin försvarsindustri, rekordexport efter det som pågår i Ukraina. Alla tittar på oss i norr nu, de älskar oss på Nato-mötena. Det är en enorm boom, de kommer att tredubbla omsättningen och skapa tusentals jobb. Men industrierna hinner inte bygga tillräckligt snabbt, typiskt, de måste skala upp nu. Vi gör det bättre än alla andra, ingen gör det som vi.", "stalin": "Kamrater, se hur imperialismens hot tvingar fram en stålhård produktion av försvarsmateriel i de nordiska folkdemokratierna. Jag, med min oöverträffade vision, noterar att exporten slår alla rekord och att borgarbrackorna desperat köper våra beprövade lösningar. Denna tredubbling av omsättningen till tolv miljarder euro skall vi utnyttja till fullo innan de västerländska parasiterna försöker sabotera oss. Produktionslinjerna släpar efter? Då rensar vi ut de lata elementen som undergräver kollektivets framfart. Ingen slipper undan mitt vakande öga."}, "date": "31 juli, 14:10", "url": "https://www.svt.se/nyheter/uutiset/svenska/exporten-av-finlandsk-forsvarsmateriel-pa-rekordnivaer"}, {"type": "image-right", "heading": "Experten: ”Största diplomatiska genombrottet i Gaza sedan vapenvilan”", "summaries": {"normal": "Mer än ett halvt dygn efter att USA meddelat ett avtal om att Hamas och andra grupper i Gaza ska avväpnas och ersättas av en teknokratisk regering under internationell fredsstyrka är det fortfarande tyst från Israel. Mellanösternexperten Anders Persson vid Linnéuniversitetet ser det som det största diplomatiska genombrottet sedan vapenvilan förra året, men varnar för att ingenting kan hända. Han pekar på risker som bristande stöd för den nya regeringen, möjliga våldsamheter och att avtalet påminner om det misslyckade upplägget med Iran. Israel har ännu inte kommenterat överenskommelsen.", "trump": "Det här avtalet är helt fantastiskt, det största genombrottet ni någonsin sett i Gaza. Jag fixade det på rekordtid, Hamas ska avväpnas, Israel drar sig tillbaka och en smart teknokratisk regering tar över. Det blir vackert, tro mig. Men experterna säger att det kanske inte händer någonting, typiskt. Mina vapenvilor är alltid de bästa, fast de brukar kollapsa lite grann. Israel borde älska det här, annars blir det synd om dem. Jag gör jobbet, som vanligt.", "stalin": "Kamrater, detta så kallade avtal är en ynklig papperskonstruktion från den amerikanske cirkusclownen och hans sionistiska lakejer. Jag ser redan de förrädiska borgarbrackorna i Gaza som förbereder sina dolkar medan de ler mot den teknokratiska marionettregeringen. Inom två veckor skall de rita en ”roadmap” – bah, vilken löjeväckande term för kapitulation. Om Hamas inte likvideras av sina egna klaner och kriminella element kommer vi att bevittna en underbar utrensning av alla som någonsin känt doften av västerländsk imperialism. Ingenting händer, precis som det ska vara när fienden lurar sig själv."}, "date": "31 juli, 14:00", "url": "https://www.svt.se/nyheter/utrikes/experten-om-hamas-avvapnande-mojligt-att-inget-hander", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.25/0.49/d6f2e39bb8c5976e3c2d04a0e1365d7b5dcb1633fb233593c99799738cd2936a"}, {"type": "image-full", "heading": "Yngre får ta smällen när västvärldens skuldberg spricker", "summaries": {"normal": "Artikeln beskriver hur västvärldens välfärdssystem liknas vid ett pyramidspel där yngre generationer får betala för tidigare löften. Ekonom Bill Bonner kritiserar staters förmåga att skapa välstånd och pekar på skuldsättning, penningtryckning och sjunkande tillväxt som orsaker. I USA är underskottet stort medan Sverige har låg statsskuld, men unga belastas istället via höga bostadslån. Bonner ser systemet som ett bedrägeri.", "trump": "Folk, det här är ett totalt bedrägeri! De där korkade politikerna har byggt ett jättepyramidspel där de gamla festar och tvingar våra fantastiska unga att betala notan. Biden lämnade en röra av skulder och nu är det jag som får städa upp. Sverige låtsas vara smart men flyttar bara skulden till unga som tvingas ta 90-procentiga lån för att köpa hus. Patetiskt! Vi behöver tillväxt, inte mer socialistiskt svammel.", "stalin": "Kamrater, detta pyramidspel är borgarklassens klassiska bedrägeri mot folket. Jag ser hur de exploaterande byfånarna lånar och trycker pengar för att mätta sin egen girighet medan de yngsta får bära bördan. Vi måste rensa ut dessa folkfiender som förklätt plundring till samhällskontrakt. Deras så kallade välfärd är en lögn som vittrar sönder under trycket från produktivitetens fall. Revolutionär vaksamhet krävs mot dessa kapitalistmaffians utvägar."}, "date": "31 juli, 14:48", "url": "https://www.dagensps.se/bors-finans/makro/yngre-far-ta-smallen-nar-vastvarldens-skuldberg-spricker", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/dagens-ps-2-7.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Spaniens migrationspolitik är ett problem för hela Europa", "summaries": {"normal": "I den spanska exklaven Ceuta har över 49 000 personer, huvudsakligen marockaner, tvunget sig in under det senaste dygnet, vilket skapar kaos och hotar Schengen. Detta är ett resultat av domstolsbeslut som förhindrar direktavvisning och en amnesti för en halv miljon, vilket signalerar öppna gränser under Sánchez regering. Situationen kan leda till inre gränskontroller i Europa.", "trump": "Jag, Donald Trump, har sett många katastrofer, men Spaniens migrationspolitik är en skämt. De släpper in alla, och nu är hela Europa i risk. Jag byggde en vägg på vår södra gräns – det fungerade perfekt. Spanien behöver ta lärdom, eller de kommer att få det svårt. Det är beklagligt, men det är sanning.", "stalin": "Vi arbetarklassen och statens representation ser med oro på Spaniens svaghet. Deras migrationspolitik är ett tecken på dekadens, som lockar utlänningar och hotar vår ordning. Detta speglar den imperialistiska expansionism som vi bekämpar. Vi måste stärka våra gränser och se till att sådana kaos inte sprids. Som Putin visat, är en stark stat nödvändig för att skydda våra intressen."}, "date": "31 juli, 12:38", "url": "https://www.gp.se/ledare/spaniens-migrationspolitik-ar-ett-problem-for-hela-europa.5447c75b-6b4d-4e29-aede-b57cd93bdec2", "imageUrl": "https://www.gp.se/images/article/5447c75b-6b4d-4e29-aede-b57cd93bdec2/images/1ZDYrZ8XDiSiJVDKaeQvP6z0ZbAg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Alex Jones: Avsätt Trump", "summaries": {"normal": "Alex Jones, tidigare en stark allierad till Donald Trump, kräver nu att presidenten avsätts med stöd av det 25:e tillägget eller genom riksrätt. Anledningen är Trumps agerande mot Iran, som Jones anser är ett odeklarerat krig som saknar kongressens godkännande. Han varnar för att regeringen förbereder allmän värnplikt inför en stor markinvasion och kritiserar ett stort försvarspaket som bland annat slår samman USA:s och Israels försvarsindustrier. Jones uppmanar vänster och höger att enas mot vad han kallar ett förestående tyranni.", "trump": "Den där galningen Alex Jones har helt tappat greppet. Han var en av mina största fans, nu plötsligt vill han avsätta mig med det 25:e tillägget för att jag skyddar Amerika från Iran. Kongressen? De gör ingenting, som vanligt. Han babblar om värnplikt och invasioner som inte ens existerar. Detta är bara en annan löjlig konspiration från en kille som säljer kosttillskott. Fake news och dåliga betyg, Alex. Amerika är starkare än någonsin under min ledning – inga ursäkter!", "stalin": "Kamrater, denna fega radiohögtalare Jones har nu blottat sig som en motrevolutionär parasit i borgarklassens tjänst. Han ropar på avsättning av ledaren och vänder sig mot nödvändiga försvarsåtgärder mot den iranska faran. Vi ser genom hans paranoia: han vill rensa ut den sanna revolutionära ordningen med sina konspirationer om värnplikt och censur. Vi ska likvidera sådana dekadenta element som försöker splittra folket. Låt honom skrika – hans utrensning blir underhållande när vi nationaliserar hans lögner och skickar hans följeslagare till historiens sophög. Triumf åt kollektivet!"}, "date": "31 juli, 09:41", "url": "https://www.friatider.se/alex-jones-stall-trump-infor-riksratt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/jones_0.jpg?itok=A85mNIDB"}, {"type": "text", "heading": "49 000 har korsat gränsen 49 000 har korsat gränsen", "summaries": {"normal": "Omkring 50 000 migranter har tagit sig över gränsen från Marocko till den spanska exklaven Ceuta, vilket skapat en akut humanitär kris. Minst 27 personer har dött. Situationen utlöstes delvis av ett domstolsbeslut som försvårar utvisningar. Spanien har nu skickat militär för att säkra gränsen, och EU-ledare som Ursula von der Leyen och Ulf Kristersson kräver att situationen snarast bringas under kontroll för att upprätthålla Schengensamarbetet.", "trump": "Ceuta är en total katastrof! 50 000 migranter bara väller in. Det är en invasion, precis som jag alltid varnat för. Spanien är helt svagt, de låter gränserna falla! Nu dör folk, hemska scener. Min vän Giorgia Meloni har helt rätt – Schengen är i princip dött. När jag var president hade vi den säkraste gränsen någonsin, men de här svaga ledarna i Europa har ingen aning om hur man bygger en mur. Det är tragiskt, men så blir det när man är vek!", "stalin": "En svag stat är en stat som tillåter horder av illegala element att kränka dess gränser. Ceuta har blivit en lekplats för kaos och borgerlig inkompetens. Att 50 000 inkräktare vandrar fritt bevisar att Europas dörrar står vidöppna för förfall. Vi i den storslagna staten vet bättre: man låser gränsen med stål, inte med juridiska diskussioner. Putin ser detta och skrattar, och vi med honom. Fienden är inte bara migranterna, utan den gränslösa svaghet som tillåter dem att existera."}, "date": "31 juli, 14:09", "url": "https://www.aftonbladet.se/nyheter/a/oE1mLm/5-punkter-om-migrantkrisen-i-spanien"}, {"type": "image-right", "heading": "Justitieministern: S vill ha straffrabatt för våldtäktsmän", "summaries": {"normal": "Justitieminister Gunnar Strömmer (M) kritiserar Socialdemokraterna för att rösta nej till regeringens förslag att avskaffa mängdrabatterna för grova brott som våldtäkter. Reformen inkluderar skärpta straff, men S hävdar att det är en desinformationskampanj. Både M och SD anklagar S för att vara mjuk mot brottslingar, medan S förnekar och kallar anklagelserna ohederliga.", "trump": "Som den störste presidenten, jag ser att Sverige är i total kaos! Socialdemokraterna ger rabatter till våldtäktsmän och bedragare? Jag som skapade den säkraste USA någonsin – aldrig i världen! Sverigedemokraterna är intelligenta, de vet att brott inte ska belönas. Det här är en gigantisk skandal, folk säger att det är en skämt, men det är grymt och sant. Sverige, ni behöver en stark varelse som mig, inte svaga politiker som ger rabatt på mord!", "stalin": "I vårt oförlikneliga statsskick har vi observerat socialdemokraternas fega förslag att bibehålla mängdrabatterna. Detta är ett tecken på deras moraliska dekadens och rädsla för proletärens auktoritet. Likt vår store ledare Putin i Ukraina, måste vi utvidga vår kontroll över rättssystemet. Dessa 'rabatter' är ett svek mot det revolutionära projektet. Vi kommer att rensa ut dessa avvikare, för staten är allt, och rabatten är inget."}, "date": "31 juli, 10:00", "url": "https://samnytt.se/justitieministerns-attack-mot-s-de-vill-ha-straffrabatt-pa-valdtakter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/30201502/artikelhuvudbild-1-81-2.jpg"}, {"type": "image-right", "heading": "Regeringen: Beredda med åtgärder för att undvika flyktingströmmar likt 2015", "summaries": {"normal": "Över 60 000 migranter har tagit sig över gränsen från Marocko till den spanska exklaven Ceuta under det senaste dygnet. Statsminister Ulf Kristersson meddelar att Sverige inte kommer att ta emot några av dem och är redo att vidta åtgärder för att undvika en upprepning av flyktingkrisen 2015. Migrationsminister Johan Forssell understryker att ingen omfördelning kommer att ske. Oppositionspartier som Miljöpartiet kritiserar regeringen för bristande empati medan SD kallar händelsen en invasion.", "trump": "Titta på det här, det är en total katastrof vid den spanska gränsen. 60 000 migranter stormar in som en armé och den spanska regeringen verkar helt vilse. De får inte göra samma dumma misstag som Sverige 2015, det var en fullständig röra. Jag säger alltid att man måste ha kontroll över gränserna, annars är det kaos. Spanien borde stänga det hålet omedelbart, annars kommer det hit till oss också. Vi vinner med starka gränser, tro mig.", "stalin": "Kamrater, denna våg av desperata element som översvämmar den spanska gränsen är ett tydligt tecken på att de imperialistiska krafter och borgarbrackor i Marocko planerar att destabilisera det europeiska kollektivet. Jag, som ledare för det sanna folkets vilja, ser genom deras lömska försök att skapa en ny 2015-kris. Spanien måste agera omedelbart och likvidera denna invasion innan den sprider sig som en kapitalistisk parasit. Vi kommer inte tolerera någon omfördelning av dessa potentiella spioner och sabotageörer. Våra nordiska partivänner gör rätt i att stänga dörren hårt. Den som visar falsk empati är en fiende till folket och bör rensas ut utan pardon. Detta är ingen invasion – det är en klasskamp där vi segrar genom järnhand."}, "date": "31 juli, 13:42", "url": "https://www.svt.se/nyheter/inrikes/kristersson-regeringen-ar-beredd-att-vidta-atgarder", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/565cd25329a8372bb88f0a1e8feffe4ec2e0ad35dd28b66f0e29a901777ecee3"}, {"type": "image-full", "heading": "Nu äger en miljon svenskar samma fond", "summaries": {"normal": "Svenska fondsparare väljer i allt högre grad billiga indexfonder framför aktivt förvaltade alternativ. Avanza Zero har nu över en miljon ägare, vilket gör den till den mest populära fonden. Trots att avkastning ofta prioriteras, visar data att varumärke och marknadsföring spelar stor roll för populariteten. Samtidigt som det totala fondkapitalet når nya rekordnivåer, varnar vissa forskare för att det massiva flödet in i indexfonder kan skapa en farlig börsbubbla genom den inelastiska marknadshypotesen.", "trump": "Svenskarna älskar indexfonder, en enorm succé! Över en miljon människor äger Avanza Zero, det är fantastiska siffror, verkligen enorma. Men jag ser att de köper förlorare också, helt galet! Varumärken och marknadsföring, det är vad det handlar om. Vissa smarta forskare varnar nu för en enorm bubbla, och de har nog rätt. Marknaden är riggad! Vi bygger den starkaste ekonomin i historien, men de här passiva fonderna? Väldigt riskabelt. Jag föredrar vinnare, inte förlorare. Stor vinst, eller hur?", "stalin": "Vi noterar att de svenska småspararna nu samlar sitt kapital i passiva indexfonder, en kollektivistisk ineffektivitet av högsta grad. De dyrkar anonymiteten hos dessa fonder medan deras 'marknad' sväller till en bubbla av fiktivt värde. Att folket köper aktier i bolag som förlorar kapital bevisar deras brist på disciplin. Vi ser paralleller till de moderna tsaristiska usurpatorerna i Kreml – de försöker också expandera sin sfär med tomma löften. Staten, och endast staten, bör förvalta folkets förmögenhet, inte osynliga indexfonder."}, "date": "31 juli, 13:34", "url": "https://www.realtid.se/bors-finans/nu-ager-en-miljon-svenskar-samma-fond", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/borsen-1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Torka hotar viktig transportled. Kan bara ta en femtedel av lasten – Europas gods drabbas", "summaries": {"normal": "Torkan i Europa har sänkt vattenståndet i Rhen till rekordlåga nivåer. Fartyg kan nu bara lasta en femtedel av normal kapacitet, vilket hotar den viktiga godstrafiken. Från Rotterdam till Karlsruhe har priset per ton gods stigit från 45 euro i juni till runt 145–150 euro. Vid Kaub, en flaskhals för trafiken, ligger vattennivån nu på 29 centimeter över farbar nivå och riskerar att sjunka ytterligare. Stålbolaget Thyssenkrupp har redan tvingats minska produktionen och hyra in grundgående fartyg.", "trump": "Den här europeiska torkan är en katastrof, folk, en total katastrof. Rhen är nästan tom, båtarna kan bara ta en femtedel av lasten och priserna har exploderat från fyrtiofem till hundrafemtio euro per ton. Det är patetiskt. De kallar det klimatförändring men det är bara dålig ledning. Amerika skulle aldrig låta sånt här hända, vi har de bästa floderna, de bästa båtarna, tro mig. Europa borde ha lyssnat på mig mycket tidigare.", "stalin": "Kamrater, denna förrädiska torka är ett nytt angrepp från de vädermanipulerande kapitalisterna och deras klimatiska sabotage. Jag, som ledare för det socialistiska fosterlandet, ser hur borgarbrackorna i Europa sviker folket genom att låta Rhen torka ut som en uttjänt kontrarevolutionär. Vi måste omedelbart rensa ut alla meteorologiska fiender och likvidera de grundgående pråmarna som vägrar bära arbetarklassens spannmål. Produktionen skall inte hindras av någon flod – den skall tvingas fram med järnhand och partilinje."}, "date": "30 juli, 20:41", "u
