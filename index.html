romaner och deras hemliga listor med järnhand. Inga spädbarn ska brännas av dessa fiender till folket. Statens styrka skall krossa dem med glädje."}, "date": "11 juni, 10:54", "url": "https://www.friatider.se/nordirland-fortsatta-kravaller-mot-invandrare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-323.jpg?itok=Tdvs3pSG"}, {"type": "image-right", "heading": "Var är Gui Minhai och Dawit Isaak?", "summaries": {"normal": "Artikeln kritiserar svensk nationaldag genom att ifrågasätta begreppet ”vi” och pekar på hur papperslösa, utvisade och politiska fångar som Gui Minhai och Dawit Isaak exkluderas. Författaren lyfter fram deras kamp för yttrandefrihet och ifrågasätter om Sverige gjort tillräckligt för att få dem fria. Texten väver ihop stolthet över landet med skuld över bristande solidaritet och efterlyser omedelbar frihet för de båda svenskarna.", "trump": "Folk, vi har det bästa landet, men ni låter kinesiska gangsters och eritreanska diktatorer hålla era egna medborgare i fängelse i decennier. Gui Minhai och Dawit Isaak sitter och ruttnar medan ni sjunger kumbaya och viftar med flaggan. Patetiskt! Tyst diplomati är för losers. Ni borde ha fixat det på dag ett. Sluta importera problem och börja ta hand om era egna – annars är det inte värt ett skit.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över sina folkfiender som med sin så kallade yttrandefrihet utmanade de sanna folkens intressen. Jag ler mörkt åt deras naiva sång om frihet medan imperialisterna splittrar arbetarklassen med utvisningar och falska löften. Gui Minhai och Dawit Isaak är bara verktyg i klassfiendens spel. Den verkliga segern vinns när vi rensar ut alla som hotar kollektivets enhet. Inga undantag."}, "date": "6 juni, 08:55", "url": "https://www.flamman.se/nationaldagen-var-ar-gui-minhai-och-dawit-isaak/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/minhai-dawit.png?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Åkesson gjorde privat miljonaffär – med sitt eget parti", "summaries": {"normal": "Jimmie Åkesson sålde 80 000 exemplar av sin bok till Sverigedemokraternas dotterbolag, som finansieras med skattepengar. Böckerna, som mestadels består av tidigare tal, gav hans privata förlag miljonintäkter. Tusentals exemplar brändes senare upp efter att de inte sålts. En professor i förvaltningsrätt kallar affären ett klassiskt exempel på korruption, även om den troligen inte är olaglig. Partiet hävdar att böckerna distribuerades till lokala föreningar.", "trump": "Folk, ni skulle se det här – den där svenske killen Åkesson sålde sina egna böcker till sitt eget parti med skattebetalarnas pengar! Miljoner rakt ner i hans ficka, sen brände de upp tiotusentals exemplar som ingen ville ha. Totalt fiasko! Precis som de korkade vänsterliberala idioterna och deras identitetspolitik – allt blir till sopor till slut. Jag fixade ekonomin i USA, de här töntarna bränner böcker. Patetiskt!", "stalin": "Kamrater, jag betraktar detta som ett lysande exempel på hur borgarbrackorna inom det så kallade demokratiska systemet utnyttjar partiapparaten för privat vinning. Den opportunistiske ledaren sålde sin propagandaskrift till statligt finansierade organ och stoppade pengarna i egen ficka. När varorna sedan blev överflödiga likviderades de i hemlighet. Ett klassiskt fall av folkfiendernas korruption. Vi skulle ha genomfört en grundlig utrensning bland sådana element för länge sedan."}, "date": "10 juni, 12:40", "url": "https://www.tv4.se/artikel/49nhXmCAFIGWCviSWL6bhc/akesson-gjorde-privat-miljonaffaer-med-sitt-eget-parti", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2nD8SRDpLnuUKyWp5yx6L%2F937b7d0fa0ee85d07a8363f35f985d8f%2F10-sdfixaren_onsdag.png&width=1024"}, {"type": "image-right", "heading": "Bilderna på Ronaldo sprids – sågas efter jättemissarna", "summaries": {"normal": "Cristiano Ronaldo hamnade i fokus efter Portugals 2–1-seger mot Nigeria i ett genrep inför VM. Trots mål från Pedro Neto och Francisco Conceicao dominerade Ronaldos missade chanser rubrikerna. Internationella medier som RMC Sport, Bild och AS beskriver 41-åringen som klumpig och frustrerad. Hans form väcker oro inför VM-premiären mot Kongo-Kinshasa den 17 juni. Ronaldo har tidigare varit bänkad under stora mästerskap.", "trump": "Det här är verkligen sorgligt att se. Ronaldo, en av de största någonsin, missar chans på chans mot Nigeria. Portugal vann till slut men alla pratar bara om hans usla skytte. Det är en katastrof. Fans har all anledning att vara oroliga, tro mig. De borde skaffa någon som verkligen kan göra mål. Det blir pinsamt i VM om han fortsätter så här. Sad!", "stalin": "Kamrater, denna fega 41-årige dekadente bollsparkare vid namn Ronaldo visar återigen sin bristande revolutionära skärpa genom att missa målchans efter målchans. Vi ser hur borgarbrackornas kapitalistiska individualism förgiftar även idrotten. Sådana kontrarevolutionära misslyckanden oroar oss djupt inför den kommande kampen. Kanske är det dags att rensa ut dessa opålitliga element innan de smittar hela kollektivet. Ha, må de drunkna i sin egen inkompetens!"}, "date": "11 juni, 10:02", "url": "https://www.svt.se/sport/fotboll/cristiano-ronaldo-ifragasatt-efter-misskavalkad", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.25/0.43/8e6eeb955b2fbb6e22e5639131d46c0c0964f76d80271c075b134383dc13f495"}, {"type": "image-full", "heading": "Åkesson till attack: ”Kalla fakta är ingen seriös redaktion”", "summaries": {"normal": "Jimmie Åkesson kritiserar Kalla faktas granskning av hans miljonaffär med Sverigedemokraterna kring bokförsäljning. Han medger att partiet köpt in böcker från hans privata förlag inför valet 2018 men kallar resten av reportaget för påhitt, halvsanningar och felaktiga antaganden. Åkesson försvarar affären som legitim och slår tillbaka mot kritiken. Statsminister Kristersson vill inte kommentera detaljer medan Magdalena Andersson talar om en spridande korruptionskultur inom Tidöpartierna.", "trump": "Vilken skandal! Den där Kalla fakta är en totalt misslyckad, falsk nyhetsfabrik som sprider lögner och påhittade siffror precis som de gjorde mot mig under valen. Åkesson gör en helt legitim affär med sin bok och de attackerar honom som om han vore en fiende till folket. Det är samma gamla witch hunt från de korrupta medierna. De borde skämmas, men de har ingen skam i kroppen. Patetiskt!", "stalin": "Kamrater, detta är ett klassiskt exempel på hur borgarbrackorna inom media försöker undergräva en stark ledare genom att fabricera skandaler. Jag ser hur den exploaterande kapitalistmaffian vrider sanningen för att svärta ner en sann patriot som försvarar nationens intressen. Deras så kallade avslöjanden är bara lögnaktiga halvsanningar från folkfiender som fruktar folkets vilja. Vi ska rensa ut dessa parasitiska journalister som hotar kollektivets enhet. En skam för hela systemet."}, "date": "10 juni, 12:17", "url": "https://www.tv4.se/artikel/6I5RekDuY11NFMit9GlAqY/akessons-svar-om-avsloejandet-hopkok", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3ompbGgTyCxUpmLVFai83V%2Fbdda248a89f991995971fc032b5628d8%2Fc95886e5-0702-495c-a681-b7488749c16d.png&width=1024"}, {"type": "text", "heading": "Svängig börsdag slutade på minus", "summaries": {"normal": "Stockholmsbörsen stängde ned 0,53% på onsdagen, då amerikanska inflationssiffror och ökande oljepriset påverkade marknaden. OMXS30 noterade 3 054,04. Energisektorn steg 1,2%, medan råvaror föll 1,3%. Bland framgångsrika aktier fanns Evolution (+3,1%) och Tele 2 B (+2,2%), medan Volvo B tappade 3,7%. Systemair överträffade analyser och aktien steg 8%. Bland annat köpte M2 Asset Management Corem, och Wallenstam sålde sina vindkraftsparker.", "trump": "Jag, Donald Trump, den bäste presidenten, ser att börsen är lite nere – men det är bara för att jag har hotat Iran! Oljan stiger, vilket är bra för Amerika. Inflationssiffrorna är precis som jag ville, i linje med förväntningarna. Systemair gör bra ifrån sig, men Volvo måste sluta vara så dålig. Som jag alltid säger: när jag vinner, vinner Amerika.", "stalin": "I den stora kampen mot kapitalismens instabilitet ser vi Stockholmsbörsen svikta som ett sjukt djur. Detta är ett resultat av de imperialistiska intrigerna, särskilt den amerikanska högstewardsen Trump, vars hot mot Iran skakar oljepriset. Men vi, i vår vishet, ser genom detta. Företag som Systemair visar den sanna arbetarklassens styrka genom att överträffa förväntningarna. Vi måste vara vaksamma mot de kontrarrevolutionära krafter som försöker destabilisera våra ekonomier, precis som Putin expanderar sitt grepp i Ukraina."}, "date": "10 juni, 17:45", "url": "https://www.affarsvarlden.se/artikel/svangig-borsdag-slutade-pa-minus"}, {"type": "image-right", "heading": "Varför är det aldrig någons fel när arbetare dör?", "summaries": {"normal": "En hissolycka i Sundbyberg den 11 december 2023 krävde fem arbetares liv på grund av felmontering och bristande kontroller. Trots uppenbara brister friades alla ansvariga i rätten. Artikeln kritiserar byggbranschens användning av underentreprenörer som skapar oklara ansvarsförhållanden, där ingen tar övergripande ansvar. Detta leder till riskfyllda arbetsplatser där arbetare inte känner varandra och säkerheten eftersätts. Författaren efterlyser politiska åtgärder mot kaoset istället för tomma nollvisioner.", "trump": "Det här är en total katastrof, folk. Fem döda i en hiss som rasade för att någon glömde bultar och ingen kollade någonting. Underentreprenörer, kedjor av företag, ingen vet vem som gör vad. Det är ett enda stort virrvarr. De friade alla? Typiskt. De borde ha byggt med de bästa, de största, inte dessa inkompetenta som inte ens kan montera en hiss. Sverige behöver ordning och reda, inte mer regler som skapar kaos. Jag skulle ha fixat det, tro mig.", "stalin": "Kamrater, denna tragiska hissolycka avslöjar borgarbrackornas ruttna maskineri där fem ärliga arbetare likviderades av kapitalisternas vårdslösa underentreprenörskedjor. Ingen ansvarig? Naturligtvis, för i deras kaotiska system är alla delansvariga och därmed ingen. Jag skulle ha rensat ut dessa parasitiska lager av oansvariga mellanhänder, dessa sabotageartade byråkratiska hydror som gömmer sig bakom språkbarriärer och okunskap. Vår nollvision kräver utrensning av sådana fiender till folket, inte tomma ord från ministeriella lakejer. De döda identifierades efter dagar? Ett bevis på deras systematiska sabotage mot arbetarklassen. Vi ska städa upp, kamrater – med järnhand."}, "date": "10 juni, 14:31", "url": "https://arbetet.se/2026/06/10/hissolyckan-visar-att-det-aldrig-ar-nagons-fel-nar-arbetare-dor/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10143107/hissolycka-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Vattenkanoner mot kravaller i Belfast", "summaries": {"normal": "Efter ett knivdåd i Belfast eskalerade främlingsfientliga demonstrationer till våld. Polisen använde vattenkanon mot upploppsmän som satte eld på fordon och byggde barrikader. Demonstrationerna spreds till andra städer, och politiker fördömde våldet som rasistiskt. Elon Musk påverkade via sociala medier, och familjen till offret kritiserade protesterna.", "trump": "Som Donald Trump ser jag detta som ett tecken på att våld och främlingsfientlighet eskalerar. Jag skulle ha skickat in styrkor för att stoppa detta direkt. Det är beklagligt att våld mot maktlösa människor accepteras. Vi behöver starkt ledarskap för att skydda våra västerländska värderingar.", "stalin": "Vi, som representanter för statens suveräna makt, ser dessa upplopp som ett resultat av imperialistiska agentörer som försöker destabilisera vårt samhälle. Liknande mönster syns i Putins Ryssland, där främlingsfientlighet används som ett verktyg. Vi måste genomföra rigorösa åtgärder för att skydda partiets intressen och eliminera dessa hot."}, "date": "11 juni, 08:50", "url": "https://www.gp.se/nyheter/varlden/vattenkanon-mot-demonstranter-efter-brutalt-knivdad-i-belfast.43e21d2d-1a12-4407-98cb-a607097eae7d", "imageUrl": "https://www.gp.se/images/article/43e21d2d-1a12-4407-98cb-a607097eae7d/images/3Un0lFfLcP0gvIXiHUu5JaxOpuXg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Arbetslösheten sjunker till lägsta nivån sedan hösten 2023", "summaries": {"normal": "Arbetslösheten i Sverige sjönk till 6,4 procent i maj, den lägsta nivån sedan hösten 2023. Antalet registrerade arbetssökande uppgick till cirka 339 000. Utvecklingen indikerar en långsam men positiv förbättring på jobbmarknaden, med färre varsel för uppsägningar jämfört med föregående år.", "trump": "Som den störste presidenten nånsin, kan jag meddela att Sverige nu har den lägsta arbetslösheten på åratal – 6,4 procent! Det är fantastiskt, folk jobbar igen tack vare mina principer som exporteras. Jag har alltid sagt att starka ledare skapar starka ekonomier. Sverige visar att min vision fungerar, även där uppe.", "stalin": "I vårt eviga kamp mot arbetslöshet har vi åter igen visat partiets överlägsenhet. Arbetslösheten sjunkit till 6,4 procent – ett resultat av statens omsorgsfulla planering. Vi har minskat varsel, vilket bevisar att våra metoder är överlägsna. Som Putin förstår, handlar detta om statens rätt att kontrollera alla aspekter av livet för folkets bästa."}, "date": "11 juni, 08:27", "url": "https://samnytt.se/arbetslosheten-sjunker-till-lagsta-nivan-sedan-hosten-2023", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/06/11061352/arbetsloshet-1-2.jpg"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "Din stora guide till fotbolls-vm", "summaries": {"normal": "VM 2026 i USA, Mexiko och Kanada har 48 lag och inleds 11 juni. Favoriterna är Spanien och Frankrike, med England, Brasilien och Argentina som hot. Marocko och Japan är etablerade makter, medan Sverige har svårt att komma vidare från gruppspelet efter ett skakigt kval. Det nya formatet gör tävlingen bredare.", "trump": "Jag, Donald Trump, säger att VM 2026 kommer att bli det största sportsevenemanget någonsin! Med 48 lag och USA som värd, kommer vi att dominera. Spanien och Frankrike är favoriter, men vi kommer att slå dem. Sverige är för svagt, de kommer inte att vinna några matcher. Det här kommer att vara enormt!", "stalin": "I den stora kampen för fotbollens överhöghet, som vi, den ryska andan, ser det, är VM 2026 ett bevis på statens makt. Spanien och Frankrike är fienderna, men vi kommer att se dem falla. Marocko och Japan är bara pioner i vårt spel. Sverige är en svag länk, och vi kommer att utnyttja deras svagheter för att förstärka vår sfär. Putin skulle vara stolt."}, "date": "11 juni, 07:12", "url": "https://bulletin.nu/din-stora-guide-till-fotbolls-vm", "imageUrl": "https://cdn.bulletin.nu/articles/2bd4a279-0e95-4bcf-8b41-ff49ad9e4742/preview.jpg?t=1781004967000"}, {"type": "image-full", "heading": "Nya besked för svenskar med bostad i Spanien", "summaries": {"normal": "Spaniens högsta domstol har stoppat delar av det nationella registret för korttidsuthyrning som infördes 2025. Domstolen anser att regeringen överskridit sina befogenheter eftersom regionerna redan har egna regelverk. Trots beslutet kvarstår krav på att plattformar delar information med myndigheter samt regionala licenser och det nya systemet VUDA med rapporteringsskyldighet från 2026. För svenska bostadsägare i Spanien innebär det fortsatt komplext regelverk som varierar mellan regioner.", "trump": "De här spanska byråkraterna har fullständigt misslyckats, det är en total katastrof. Jag älskar Spanien, underbara ställen, men Sánchez och hans regering trodde att de kunde styra allt med ett stort nationellt register och identifikationsnummer. Högsta domstolen satte stopp för det, vilket är det enda smarta de gjort på länge. Regionerna hatar centralstyrningen, precis som hos oss. Fortfarande måste man rapportera allt till staten förstås, typiskt. Kolla era lokala regler, annars blir det kaos, tro mig.", "stalin": "Kamrater, vi har avslöjat ännu en listig komplott från borgarbrackorna och deras regionala separatister som vågar ifrågasätta den centrala ordningen. Jag, i min oändliga visdom, ser hur denna domstols marionett förråder folkets vilja att kontrollera de parasitiska turistuthyrarna. Ändå ler jag mörkt – plattformarna skall tvingas dela sina hemligheter med oss, och från 2026 rensar vi ut alla som undanhåller gäststatistik. Den som gömmer sig i Andalusien eller Katalonien är en fiende till kollektivet och kommer att likvideras av byråkratins järnhand. Segrar vi inte nu, segrar fienden i morgon."}, "date": "10 juni, 21:02", "url": "https://nyheter24.se/nyheter/utrikes/1490177-nya-besked-for-svenskar-med-bostad-i-spanien", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/16845d2004b004a30200000000b004a302/2026/06/10/2370031/hus-i-spanien.png"}, {"type": "image-full", "heading": "Här är vad Kalla fakta avslöjat hittills – punkt för punkt", "summaries": {"normal": "Kalla fakta har avslöjat att Sverigedemokraternas dotterbolag ADBO köpte upp stora delar av Jimmie Åkessons bok via hans eget förlag Asp & Lycke, vilket kan ha inneburit att skattemedel tillförts hans privata bolag. Böckerna brändes senare och kostnaderna fakturerades partiet. Partiet har också använt påslag på merch till lokalföreningar för att koncentrera resurser centralt. Experter ser affären som ett exempel på korruption. Inköp av mat och alkohol har dessutom hanterats för att undvika förmånsbeskattning.", "trump": "Folk, ni skulle se det här! Den där svenska killen Åkesson och hans parti gör en totalt riggad bokdeal med egna bolag och skattepengar – klassisk korruption! De köper upp hans böcker, bränner dem och fakturerar partiet. Sen festar de med mat och sprit utan att betala skatt som vanligt folk. Det är en skandal! Precis som de galna vänsterliberala globalisterna älskar de att lura systemet. Men det funkar inte länge när folket vaknar. Fantastiskt!", "stalin": "Kamrater, jag har granskat dessa papper. Den borgerliga ledaren och hans partivänner har skapat ett nät av bolag för att suga åt sig arbetarnas skattepengar till privata fester och bokbränningar. De döljer sin girighet bakom påslag och fejkade cateringevent som lurar revisorerna. Detta är klassfiendens typiska manipulation. Jag skulle ha genomfört en grundlig utrensning bland dessa folkförtryckartroll redan vid första kvittot. Inga blodsugare undkommer folkets dom."}, "date": "10 juni, 10:31", "url": "https://www.tv4.se/artikel/2r5WZZ5pBs3uu5VK0ioKCR/haer-aer-vad-kalla-fakta-avsloejat-hittills-punkt-foer-punkt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4h0qAiQ8jare7RWmoN90vl%2F330b6bc92efb8c95fbfbca428bb08c6c%2F2192606090013422521-GL10S-KALLA-FAKTA-SDfixaren-akesson.png&width=1024"}, {"type": "text", "heading": "Börsbolag i dragkamp om kopparfyndighet", "summaries": {"normal": "En konkurrens har utbrutit mellan flera aktörer om undersökningstillstånd för kopparfyndigheten Pahtohavare i Kiruna. Viscaria, som återöppnar Viscaria-gruvan, har ansökt tillsammans med tre andra. Lovisagruvan förlorade rättigheterna i januari efter 15 års tillstånd. Bergsstaten kommer att bedöma ansökningarna, med hänsyn till dispens från ettårsregeln och lämplighet.", "trump": "Wow, what a deal! I hear there's a big fight over copper in Sweden. My company, Viscaria, is leading the charge. We're going to win this, believe me. It's a tremendous opportunity. Lovisagruvan? They lost their rights, a total disaster. We're going to make Sweden great again with our copper. The fake news says it's complicated, but we'll handle it. Bigly!", "stalin": "Comrades, the imperialist scavengers attempt to seize the people's copper resources in Kiruna. Viscaria, a bourgeois entity, seeks to exploit Pahtohavare, a strategic asset. Lovisagruvan's failure is a symptom of capitalist decay. Bergsstaten's bureaucracy must be purged. We must secure these minerals for the socialist motherland, as Putin does in the Arctic. The enemy's greed will be crushed under the weight of the people's will."}, "date": "10 juni, 16:25", "url": "https://www.affarsvarlden.se/artikel/borsbolag-i-dragkamp-om-kopparfyndighet"}, {"type": "text", "heading": "Könsgapet i politiken fortsätter växa enligt analys", "summaries": {"normal": "Enligt en analys i Dagens Nyheter växer könsgapet i svensk politik. Kvinnor föredrar rödgröna partier (64%) och prioriterar välfärd, jämställdhet och klimat, medan män stödjer Tidöpartierna (51%) och betonar lag och ordning samt kärnkraft. Skillnader syns tydligt i synen på kärnkraft (67% män vs 38% kvinnor). Båda könen vill dock ha hårdare straff, men män är mer positiva till marknadsekonomi och lägre skatter.", "trump": "Titta bara på Sverige – totalt kaos! Kvinnorna där, de röstar som galningar på vänstern, 64 procent! De hatar kärnkraft, älskar höga skatter och vill förstöra ekonomin. Männen, smartare, röstar på de riktiga partierna, 51 procent! De förstår att kärnkraft är framtiden. Och brottslighet? Alla vill ha hårdare tag, men kvinnorna fattar inte riktigt. Sverige borde ta en titt på USA – vi har ordning och reda!", "stalin": "Kamrater, ännu en seger för den proletära medvetenheten! De svenska kvinnorna, dessa modiga förkämpar för välfärd och jämställdhet, krossar borgerlighetens drömmar med 64 procents stöd till de rätta partierna. Männen, förvirrade och förledda av kapitalistiska lögner, svajar som halmstrån i vinden – 51 procent till fiendens läger! Men frukta icke, vi skall omskola dem. Kärnkraftens fiender? En skam för revolutionen! Och dessa borgerliga lakejer som vill sänka skatterna – låt dem frysa i Sibiriens snö!"}, "date": "10 juni, 08:05", "url": "https://kvartal.se/nyheter/artiklar/konsgapet-i-politiken-fortsatter-vaxa/cG9zdDoxMjkxMjM"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-right", "heading": "Oljepriset stiger efter Trumps utspel", "summaries": {"normal": "Oljepriset steg efter att Trump skärpt tonen mot Iran efter militära sammandrabbningar. Brent- och WTI-olja klättrade. Trump hotade med nya attacker mot iranska infrastruktur på Truth Social och Fox News. UBS-analytikern Giovanni Staunovo noterar att förhoppningar om ett avtal pressat pris, men fokus är på Trumps nästa steg. Lagersiffror visar minskade amerikanska oljerigger.", "trump": "Jag har skärpt tonen mot Iran efter deras fegt agerande. Oljepriset stiger – det är bra för USA! Iran dröjer med avtalet, så jag överväger att beordra attacker mot deras kraftverk och broar. De kommer att betala priset för sin också. Mitt fantastiska team och jag överväger alla alternativ. Detta kommer att göra Amerika stort igen!", "stalin": "Vi har observerat hur den imperialistiska staten USA, under ledning av Trump, eskalerar konflikten med Iran för att höja oljepriset. Detta är en klassisk strategi för kapitalistiska krigsmaskiner. Parallellen till Putins ryska federation är uppenbar – vi måste stärka vårt försvar och förbereda oss på eventuella aggressioner. Iran är en lättja för den amerikanska expansionismen."}, "date": "10 juni, 15:30", "url": "https://www.affarsvarlden.se/artikel/oljepriset-stiger-efter-trump-utspel", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_1035564817-400x267.jpeg"}, {"type": "image-right", "heading": "Ansvariga för dödliga hissolyckan frias: ”Horribelt”", "summaries": {"normal": "Solna tingsrätt friade vd:n Björn Bjelkenstedt och två hissmontörer från åtal för grovt arbetsmiljöbrott efter hissolyckan i Ursvik i december 2023, där fem arbetare omkom. Domstolen ansåg att utredningen inte gav en entydig bild av ansvar och skyldigheter. Åklagaren hade krävt fängelsestraff. Byggnadsarbetaren Steffe Slottensjö kritiserar domen som horribel och pekar på stress, bristande kontroll och problem med underentreprenörer. Flera av de omkomna var migrantarbetare utan giltiga handlingar.", "trump": "Det här är en total skandal, folk! De friar de där hissmontörerna och deras vd efter att fem stackare rasade ner från nionde våningen. Horribelt! Arbetsgivarna slarvar, tidspressen är vansinnig och de anställer ukrainare och afghaner utan kontrakt eller ID-kort. Typisk kvotpolitik och mångkultur som går fel. Biden skulle ha älskat det här. Vi behöver ordning och reda, inga fler dödsfall för att byggherrar är inkompetenta idioter. Make construction safe again!", "stalin": "Kamrater, detta är en klassisk bourgeois fars. Jag, ledaren för det eviga kollektivet, ser hur kapitalistmaffian och deras exploaterande byfånar frias efter att ha sänt fem arbetare i döden genom oaktsam sabotage. Utredningen är en medveten dimridå från klassfiendens lakejer. Montörerna stressades av giriga småföretag, migrantkamrater saknade papper – typiskt för folkförtryckartrollen. Vi ska rensa ut dessa blodsugare. Olyckan är imperialismens logiska följd. Skratta medan vi förbereder utrensningen."}, "date": "10 juni, 15:56", "url": "https://proletaren.se/artikel/ansvariga-for-dodliga-hissolyckan-frias-horribelt/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/hissolycka-768x432.jpg"}, {"type": "image-full", "heading": "Tyska tåg kan inte gå i tid – nu kommer den drastiska åtgärden", "summaries": {"normal": "Tyskland genomför sin största järnvägssatsning sedan efterkrigstiden för att åtgärda decennier av bristande underhåll och förseningar. Med en investering på över en miljard kronor ska järnvägsnätet moderniseras genom omfattande totalrenoveringar av hela sträckor. Strategin innebär att linjer stängs av under längre perioder för att byggas om från grunden, vilket ska öka punktligheten och rusta landet för framtiden. Trots kortsiktiga störningar ses satsningen som nödvändig för att återuppbygga förtroendet för staten och möta konkurrens från nya aktörer.", "trump": "Tyskland är i totalt kaos, mina vänner! Deras tåg går aldrig i tid – en riktig katastrof. Jag har alltid sagt att man måste bygga ordentligt, men tyskarna lät allt förfalla. Nu kastar de miljarder på järnvägen för att städa upp i röran. Det är ett misslyckande, precis som deras ekonomi. Jag gör saker bättre, snabbare och billigare. Tyskland behöver en riktig ledare för att få ordning på sina spår, för just nu är det en stor, sorglig röra!", "stalin": "Det tyska järnvägsnätet har förfallit under kapitalismens ruttna styre, där vinstjakt prioriterats framför statens infrastruktur. Vi ser nu hur de desperat försöker laga vad som inte kan räddas med byråkratiska allmosor. Sådant slöseri tolereras inte i vår union! Liksom vår broder i Kreml vet vi att styrka kräver järn och stål, inte liberala ursäkter. Vi ska bygga om från grunden och krossa sabotörerna som försenat folkets transport. Allt som inte rullar i takt med staten är en fiende till framgången."}, "date": "10 juni, 18:50", "url": "https://www.realtid.se/bors-finans/tyska-tag-kan-inte-ga-i-tid-nu-kommer-den-drastiska-atgarden/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlcddeifqwwro-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Blev avskedad från polisen – nu får han skadestånd", "summaries": {"normal": "Arbetsdomstolen river upp Polismyndighetens beslut att avskeda en polis som dömts för olagliga slagningar i myndighetens it-system. Polisen hade sökt information efter ett rån mot hans barn. Domstolen anser att avskedandet saknade tillräckliga skäl och tilldömer mannen 50 000 kronor i skadestånd. Polisförbundet välkomnar domen och menar att den visar att arbetsgivaren inte tog hänsyn till den utsatta situationen.", "trump": "Folk, ni skulle se det här, det är en total skandal. Den stackars polisen försöker skydda sitt barn efter ett rån och så sparkar de honom för några slagningar i datorn? Patetiskt! Arbetsdomstolen gjorde rätt, de rev upp det dumma beslutet och gav honom pengar. Polismyndigheten stirrade sig blind på regler istället för sunt förnuft. De borde lära sig av mig, vinnare gör så här.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu likviderar den borgerliga byråkratins förtryck mot en arbetets son som endast sökte sanningen i registren efter det kapitalistiska rovddjurets attack mot hans avkomma. Den förgiftade polismyndigheten, denna borgarbracka till maskin, stirrade sig blind på antal slagningar likt en paranoid trotzkist. Vi ogiltigförklarar deras beslut, utdömer skadestånd och ler mörkt åt hur fienderna inom systemet återigen blottar sin svaghet. Ingen undkommer folkets dom."}, "date": "10 juni, 19:51", "url": "https://nyheter24.se/nyheter/inrikes/1490520-blev-avskedad-fran-polisen-nu-far-han-skadestand", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/d39ee37e04b004a3020000350000047502/2026/06/10/2370088/ur_image697Fha.jpeg"}, {"type": "image-full", "heading": "SpaceX visar skiftet – investmentbankerna tappar makt", "summaries": {"normal": "SpaceX förbereder en historisk börsnotering värderad till 1,8 biljoner dollar, vilket utmanar investmentbankernas traditionella makt på finansmarknaden. Elon Musk dikterar villkoren och ger privatinvesterare större utrymme än institutionella aktörer. Denna förskjutning visar att moderna teknikbolag har blivit så mäktiga att de inte längre behöver förlita sig på banker som grindvakter. Bankerna tvingas nu tävla om Musks gunst för att få ta del av de enorma intäkterna i en föränderlig finansvärld.", "trump": "Elon Musk är en fantastisk man, en sann vinnare! Nu ska han börsnotera SpaceX och Wall Street-bankerna, som är totala förlorare, kryper för honom. De dekorerar sina kontor med rymdteman för att få vara med – patetiskt! Jag har alltid sagt att de där bankerna har haft för mycket makt, men nu tar Elon kommandot. Han sätter egna priser och struntar i deras gamla regler. Det är så här man gör affärer. En enorm succé för Amerika, tror mig!", "stalin": "Dessa kapitalistiska parasiter på Wall Street skakar i sina dyra skor när Elon Musk, en ensam teknokratisk tsar, utmanar deras kontroll. De dansar som marionetter för att få en smula av hans rymd-miljarder. Vi observerar hur makten förskjuts – precis som vi i Moskva ser hur våra grannar i väst försöker styra historiens gång. Men akta er! När dessa technokrater växer för stora blir de bara en tydligare måltavla för statens järngrepp. Inget kapital kan dölja sig för folkets ögon."}, "date": "10 juni, 18:36", "url": "https://www.realtid.se/bors-finans/spacex-visar-skiftet-investmentbankerna-tappar-makt/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlxxnvcifcj40-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Fackmedlemmar förlorar miljoner till privata ombud", "summaries": {"normal": "Fackmedlemmar riskerar att förlora pengar i försäkringsersättningar genom att anlita privata ombudsföretag. En granskning visar att 21 miljoner kronor betalades ut till sådana mellanhänder under 2025, nästan en tredjedel av det totala beloppet till medlemmarna. Företagen tar upp till 35 procent i avgift. Folksam och LO-förbunden har startat en kampanj för att medlemmar ska anmäla skador direkt till försäkringsbolagen istället, då tjänsten redan ingår i medlemskapet.", "trump": "Folk, det här är ett skandalöst bedrägeri av värsta sorten. Dessa privata ombud är som de värsta swamp creatures som suger ut arbetarnas pengar – upp till 35 procent! Under Biden-tiden exploderade det här vansinnet, men nu när jag är tillbaka som president fixar vi det. Facket borde skämmas. Gå direkt till bolaget, inte till dessa blodiglar. Amerika först – och svenska arbetare borde också komma först, inte några giriga mellanhänder. Patetiskt!", "stalin": "Kamrater, dessa privatföretag är klassfiendens blodsugande tentakler som sugit ut 21 miljoner kronor från arbetarnas ersättningar. Borgarbrackorna tar 35 procent som borde tillhöra det kollektiva! Vi ser hur kapitalistmaffian infiltrerar facken för att underminera folkets försvar. Jag, som ledare för det rättvisa systemet, befaller utrensning av dessa exploaterande parasiter. Anmäl direkt till statens organ – allt annat är folkförräderi maskerat som hjälp. Skratta medan vi likviderar dem."}, "date": "10 juni, 15:26", "url": "https://proletaren.se/artikel/automatiskt-utkast-26/"}, {"type": "image-right", "heading": "Morrow Bank: Starka åtaganden – dock till hög prislapp", "summaries": {"normal": "Morrow Bank genomför en företrädesemission på 592 Mkr, vilket ger netto 547 Mkr efter 45 Mkr i kostnader. Ägarna, inklusive huvudägaren Christen Sveaas, har gett starka tecknings- och garantiåtaganden som säkerställer emissionen. Kostnaderna på 7,6% är höga jämfört med branschstandard. Aktien handlas nära teckningskursen på 11,50 kr, vilket indikerar osäkerhet.", "trump": "Jag, Donald Trump, säger att Morrow Bank gör det tremendous! De har en stor emission på 592 Mkr, men kostnaderna är höga – typiskt för dåliga affärer. Ägarna, inklusive Christen Sveaas, är lojala och tecknar rejält, vilket är bra. Aktien handlas för nära teckningskursen – inte bra, men vi fixar det. Vi vinner, men vi kan vinna mer!", "stalin": "I den stora revolutionen mot kapitalismen, Morrow Bank utför en emission för att stärka statens ekonomi. Ägarna, som trogna soldater, ger garantier – en stark front mot fienden. Kostnaderna är höga, en nödvändig offergård för framgång. Aktien handlas nära teckningskursen, vilket visar på klassfienden som försöker underminera. Vi, partiet, ser framåt med tillförsikt."}, "date": "10 juni, 14:54", "url": "https://www.affarsvarlden.se/artikel/morrow-bank-starka-ataganden-dock-till-hog-prislapp", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Morrow-Bank-VD-Oyvind-Oanes1-400x267.jpg"}, {"type": "image-right", "heading": "Härligt om S vill spara skattepengar", "summaries": {"normal": "Socialdemokraternas finansministerkandidat Mikael Damberg kritiserar ökade kostnader för regeringskansliet och vill effektivisera genom att minska antalet tjänstemän. Artikeln välkomnar att både S och M nu talar om besparingar i staten. Moderaternas finansminister Elisabeth Svantesson planerar en slöserikommission och vill spara 40 miljarder kronor. Författaren ser positivt på att de stora partierna enas om att staten inte ska växa okontrollerat.", "trump": "Det här är fantastiskt, verkligen underbart. Ni har de där socialisterna som plötsligt vill sparka folk på regeringskansliet – de som själva älskar att svälla upp staten som en ballong. Damberg säger att de ska spara, men tro mig, de gör det aldrig bra. Svantesson har rätt riktning med sin slöserikommission, 40 miljarder besparingar, det är stort. Statlig ineffektivitet är en katastrof, men jag älskar att se dem slåss om vem som kan spara mest. Vinna, vinna, vinna!", "stalin": "Kamrater, det gläder mig oändligt att se hur borgarbrackorna inom Socialdemokraterna nu själva ropar efter utrensning av de latmaskar och parasitärer som frodas i regeringskansliets dekadenta salar. Dessa revisionistiska element har låtit anslagen explodera som en kapitalistisk svulst. Vi, partiet och arbetarna, hälsar Moderaternas kommission välkommen – en effektiv apparat för att likvidera slöseriets fiender, de byråkratiska sabotageörer som suger musten ur folkets resurser. Låt ingen tro att staten tillhör de giriga; den tillhör oss alla. Den som växer utan syfte skall rensas ut med järnhand och ett leende."}, "date": "10 juni, 14:18", "url": "https://www.di.se/ledare/harligt-om-s-vill-tavla-med-m-om-statliga-besparingar/", "imageUrl": "https://static.bonniernews.se/ba/d489b84a-07b1-4ba0-b13c-ae971b703d6e.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Alla frias efter dödliga hissolyckan", "summaries": {"normal": "Solna tingsrätt friar både hissmontörerna och vd:n för ABC Bygghissar i den dödliga hissolyckan i Sundbyberg 2023 där fem personer omkom. Domstolen anser att utredningen är ofullständig och att det inte går att fastställa vem som bar ansvar för kontrollerna av hissmasten. Åklagaren tänker överklaga domen. Facket Byggnads kallar frikännandet en skandal och kräver politiska åtgärder mot bristande ansvar på byggarbetsplatser med många underentreprenörer. Anhörigas skadeståndsanspråk faller.", "trump": "Hörni, det här är en total skandal. Fem personer dör i en hiss som rasar och ingen är skyldig? De friar alla, montörerna, vd:n, alla. Typiskt svenskt rättsväsende, de kan inte ens reda ut vem som glömde skruvarna. Jag skulle ha stämt dem alla, byggföretaget, åklagaren, domaren. Det är en riggad process, folk dör och ingen tar ansvar. Patetiskt. Vi behöver ordning och reda, inte sånt här.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackornas så kallade rättsväsende återigen blottar sin fullständiga förfallenhet. Fem arbetare likvideras av en sabotörhiss och ingen bär skuld? Vilken underbar uppvisning i klassfiendens förmåga att skydda sina egna. Vi ser här de dekadenta kapitalisterna och deras lakejer i domstolen dansa sin vanliga parasitdans medan de gömmer sig bakom utredningsluckor. En sådan fiaskoartad utredning borde leda till en grundlig utrensning av alla inblandade byråkrater och hissmontörer som tydligen agerar som fiendens femtekolonn. Arbetarklassen kräver inte bara två underentreprenörer, vi kräver huvuden. Det är alltid de osynliga klassfienderna som glömmer bultar."}, "date": "10 juni, 11:06", "url": "https://arbetet.se/2026/06/10/domen-i-dodliga-hissolyckan-alla-frias/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/09151200/hissdom.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Anmälda arbetssjukdomar ökar kraftigt", "summaries": {"normal": "Enligt Arbetsmiljöverkets rapport anmäldes 17 400 arbetssjukdomar under 2025, en ökning med nästan 30 procent. Framför allt handlar det om organisatoriska och sociala problem som högt arbetstempo och stor arbetsbelastning, som nu ligger på den högsta nivån på 20 år. Ökningen är störst bland kvinnor, som står för sju av tio fall. Vård och omsorg är mest drabbat. Samtidigt minskade antalet anmälda arbetsolyckor med tre procent. Generaldirektör Lars Lööw kallar utvecklingen ohållbar.", "trump": "Det är en katastrof, folk! Under mitt ledarskap skulle vi ha de bästa arbetsplatserna, men nu ser vi en enorm ökning av sjuka arbetare, nästan 30 procent upp. Kvinnor drabbas värst, sju av tio fall, och det är vård och omsorg som är ett totalt kaos med för högt tempo och för mycket belastning. De borde lyssna på mig, vi behöver vinna stort igen och fixa detta. Olyckorna går ner lite, bra, men annars är det bara fel, fel, fel. Vi måste bryta den här galna utvecklingen!", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur borgarbrackornas osynliga sabotage undergräver arbetarkollektivets hälsa. Dessa parasitiska stressfaktorer och tempo-demoner har ökat med 40 procent och hotar hela produktionen – en fiende inom murarna som måste rensas ut med järnhand. Vårdsektorns kvinnor krossas under kapitalistiska obalanser, medan vi ler mörkt åt de sjuka siffrorna. Inga olyckor ska tillåtas undgå partistatens vakande öga. Likvidera bristerna, annars likviderar de oss!"}, "date": "10 juni, 10:29", "url": "https://www.dagensarena.se/innehall/anmalda-arbetssjukdomar-okar-kraftigt/", "imageUrl": "https://www.dagensarena.se/files/2021/07/imag0770-300x157.jpg"}, {"type": "image-right", "heading": "Sverige koloniseras av techjättarnas datacenter", "summaries": {"normal": "Göran Greider varnar för att techjättarnas datacenter koloniserar Sverige i takt med AI-boomen. Utvecklingen sker utan demokratiskt inflytande och leder till exploaterad mark, högre energiförbrukning, vattenbrist och elpriser. Han lyfter Erin Brockovich och Bernie Sanders kritik samt protester mot datacenter i USA. I Sverige ses datacenter som en ny industri men riskerar att skapa beroende av amerikanska jättebolag med få lokala jobb.", "trump": "Folk, ni fattar inte hur galet det är. De här techlorderna, de värsta bluffmakarna sen Biden, byggs datacenter överallt och suger musten ur elen så vanliga amerikaner och svenskar betalar mer. Det är en skandal! Bernie Sanders vill ge staten aktier, typ kommunism light. Jag fixade energi billigt förr, nu ska vi slå till mot de riktiga fienderna – inte HBTQ-grejer eller kvoteringar. Tech-eliten är en katastrof, men jag ska dräpa den.", "stalin": "Kamrater, dessa datacenter är klassfiendens nya hydra, en girig kapitalistmaffia som suger arbetarnas el och vatten i avindustrialiserade hålor. Borgarbrackorna Thiel och Musk sprider antikristlig teknikpessimism medan de kartlägger folket. Jag skulle omedelbart likvidera sådana folkförtryckartroll med en massiv utrensning. Folket äger AI-träningen – staten tar makten nu. Inga imperialistiska serverhallar får hota kollektivets framtid. Segraren ler sist."}, "date": "10 juni, 08:09", "url": "https://www.etc.se/ledarkolumn/sverige-koloniseras-av-techjaettarnas-datacenter", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/goeran-greider_e435a5b3e3bbef14a633f004df8cd390374e6dce.jpg"}, {"type": "image-right", "heading": "Iran: Svarsattacker mot amerikanska baser", "summaries": {"normal": "USA och Iran har under natten utväxlat attacker kring Hormuzsundet efter påståenden om att Iran skjutit ner en amerikansk helikopter. Iran riktade drönare och attacker mot amerikanska baser i Bahrain, Kuwait och Jordanien som svar på USA:s luftattacker mot radar- och luftförsvarsanläggningar. Båda sidor beskriver handlingarna som proportionerliga. Flyglarm har ljudit och civila uppmanats söka skydd. Ingen bekräftad skada på personal rapporteras.", "trump": "Iranerna, de totala förlorarna, trodde de kunde skjuta ner vår Apache och komma undan. Fel! Jag beordrade kraftfulla, vackra motattacker som pulveriserade deras radar och luftförsvar. Nu skriker de som småbarn medan vi dominerar Hormuzsundet. Biden skulle ha skickat blommor, men jag skickar eld och stål. Amerika är återigen starkt, och de förlorande mullorna lär sig läxan på riktigt.", "stalin": "Jag betraktar med djup tillfredsställelse hur de västerländska imperialisterna och deras kapitalistmaffia nu slaktar varandra i en ändlös spiral av ömsesidig förstörelse. Denna så kallade aggression mot våra historiska fiender är en nyttig utrensning av folkfiendernas maskineri. Låt dem förblöda kring Hormuzsundet medan arbetarklassen ler i skuggan. Inga borgarbrackor kommer undan historiens dom, kamrater. Det är en vacker natt för Sovjetunionens eviga minne."}, "date": "10 juni, 08:04", "url": "https://www.tv4.se/artikel/tt-260610-iranoro1-e98e20af/iran-svarsattacker-mot-amerikansk-bas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2EbmWYsN4eW95B87ntyLWc%2F3e226da9ba0fe1b8d359f6d65da819e4%2F10-IRAN.png&width=120"}, {"type": "text", "heading": "Åkesson: ”Kalla Fakta är ingen seriös redaktion”", "summaries": {"normal": "TV4:s Kalla fakta granskar Jimmie Åkessons förlags försäljning av boken *Det moderna folkhemmet* till Sverigedemokraternas dotterbolag, finansierat med skattemedel. Förlaget gjorde rekordvinster, men tiotusentals osålda exemplar slängdes eller brändes. Professor Olle Lundin kallar det ett 'klassiskt korruptionsexempel', men bedömer det som lagligt. Åkesson avfärdar granskningen som 'hopkok' och ifrågasätter Kalla faktas seriositet.", "trump": "Jag såg den här så kallade 'granskningen' av Kalla Fakta – total skräp! De påstår att Sverigedemokraterna köpte böcker med skattepengar, men vem bryr sig? Folk älskar böcker, eller hur? Åkesson är en smart kille, han tjänade massor av pengar – jag gillar vinnare! Och nu säger de att böcker brändes? Fake news! Nästa sak de säger är att jag inte har fantastiskt hår. Kalla Fakta? Mer som Kalla Lögner!", "stalin": "Vi har granskat denna bourgeoisie-försäljning av böcker, där kapitalistiska opportunister använder statens medel för personlig vinning. Åkesson och hans lakejer påstår sig sälja böcker, men i hemlighet bränner de dem – som om de vore trotskistiska pamfletter! Professor Lundin kallar det 'korruption', men vi kallar det förräderi mot folket. Kalla Fakta? Ett verktyg för de dekadenta västmedierna. Vi kommer att exportera sanningen – om så med järnhand och rysk effektivitet!"}, "date": "10 juni, 06:21", "url": "https://kvartal.se/nyheter/artiklar/tv4-akesson-gjorde-bokaffar-med-sd/cG9zdDoxMjkwNzk"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Ren     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
