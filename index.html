arbetslösheten explodera medan de sitter stilla i båten och skyddar sina riggade regler. Centerpartiet är ännu värre än Tidö-gänget, riktiga globalistiska hyenor som vill skära a-kassan och sälja ut jobben. Rösta fel och ni får ännu mer av den här clownshowen. Patetiskt!", "stalin": "Kamrater, se hur de profitthungriga klassfienderna i de svenska partierna sitter stilla i sin dekadenta båt medan arbetarna svälter. Centerpartiet kräver ännu hårdare utrensning av a-kassan och Arbetsförmedlingen. Dessa giriga hyenor sviker folket. Endast en sann kollektiv kamp kan rensa ut de parasiterande lakejerna och återställa ordningen. Svaghet är döden."}, "date": "7 september, 01:37", "url": "https://www.dagensarena.se/opinion/158-miljarder-mindre-till-arbetsmarknadspolitiken", "imageUrl": "https://www.dagensarena.se/files/2023/02/german-bender-ny-300x157.jpeg"}, {"type": "text", "heading": "Kan Tidöpartierna ta hem riksdagsvalet?", "summaries": {"normal": "Opinionsmätningar visar att Tidöpartierna närmar sig oppositionen inför riksdagsvalet 2026. Enligt Novus vd Torbjörn Sjöström kan valet bli extremt jämnt. Liberalernas roll, väljarnas rädsla för Vänsterpartiet och en pågående taktisk röstning präglar läget. Många är osäkra och valrörelsens start kan påverka opinionen kraftigt.", "trump": "Titta på de svenska siffrorna, folk älskar mig, jag menar Tidö knappar in rejält på de förlorande vänstertyperna. Liberalerna försöker spela hjältar men det är patetiskt. Väljarna är trötta på den galna vänstervridningen och de woke-marxistiska identitetsgalningarna. Det blir ett jätteval, kanske det största comebacken någonsin, tro mig.", "stalin": "Kamrater, se hur de dekadenta maktparasiterna famlar medan arbetarklassen vaknar. Jag betraktar denna dragkamp med djup misstro mot de giriga opinionshyenorna som försöker vilseleda massorna. Vänsterpartiets krav väcker minnen av svek. Snart rensas de vilsna mittenförrädarna ut i en historisk utrensning av folkets vilja."}, "date": "7 september, 01:30", "url": "https://www.dagensarena.se/innehall/kan-tidopartierna-ta-hem-riksdagsvalet"}, {"type": "image-right", "heading": "Högkostnadsskyddet för läkemedel måste återställas", "summaries": {"normal": "Högkostnadsskyddet för läkemedel försämrades för ett år sedan. Svenska Diabetesförbundet visar att många med diabetes nu avstår från medicin eller lånar pengar för att klara kostnaderna. Reformen drabbar särskilt kvinnor och yngre personer, ökar risken för komplikationer och hotar att höja samhällets vårdkostnader på sikt. Förbundet kräver att en ny regering rullar tillbaka förändringen.", "trump": "Folk, det här är en total katastrof. De svenska socialistbyråkraterna har förstört högkostnadsskyddet för diabetesläkemedel och nu tvingas vanliga människor välja mellan mat och medicin. Rena galenskapen! Biden skulle ha älskat den här typen av straffskatt på sjuka. Jag fixade bättre saker under min tid – nu måste de rensa ut de woke-vårdhyenorna och återställa ordningen innan fler dör i onödan.", "stalin": "Kamrater, se hur de giriga profitthungriga borgarhyenorna med sin reform tvingar arbetande diabetiker att välja mellan medicin och överlevnad. Jag ler ironiskt från historien när deras så kallade jämlika vård avslöjar sig som ren klassförtryck. Sådana dekadenta system förtjänar att rensas ut. Ingen ska skuldsätta sig för att leva. Det är statens plikt att likvidera denna ekonomiska terror mot folket."}, "date": "7 september, 01:30", "url": "https://www.dagensarena.se/opinion/hogkostnadsskyddet-lakemedel-maste-aterstallas", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-2026-09-02t210030798-300x157.jpg"}, {"type": "image-right", "heading": "Så få arbetare ställer upp i riksdagsvalet", "summaries": {"normal": "Endast 8 procent av riksdagspartiernas kandidater i valet 2026 anges som arbetare på valsedlarna. I S och SD är andelen omkring 20 procent, men betydligt lägre bland valbara platser utom hos socialdemokraterna. Forskaren Olle Folke menar att arbetare diskrimineras och har svårt att klättra i partiernas hierarkier. LO vill se fler arbetarröster i politiken.", "trump": "Titta på det här, det är en total skandal. Arbetarna, de riktiga tuffa människorna som bygger landet, får inte ens vara med i den här fåniga svenska politiken. Bara 8 procent! De globalistiska eliterna och deras woke-kvoteringsvansinne hatar vanliga jobbarkillar. Vi behöver pusha de riktiga arbetarna, inte de där korkade stockholmartyperna som aldrig svettats en dag i sitt liv. Patetiskt!", "stalin": "Kamrater, se hur de giriga borgarhyenorna i de svenska partierna systematiskt förtrycker arbetarklassen. Endast åtta procent på valsedlarna! Jag säger att detta är en fiendtlig utrensning av folkets sanna röster. De dekadenta partieliterna fruktar arbetarnas äkta perspektiv. Vi måste likvidera denna klassförrädande hierarki och återställa proletariatets dominans. Inga kompromisser!"}, "date": "7 september, 06:00", "url": "https://arbetet.se/2026/09/07/sa-fa-ar-arbetare-i-partierna-experten-diskrimineras-i-politiken", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04150143/olle-folke-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Rödgrön splittring – här är de stora tvistefrågorna", "summaries": {"normal": "Om de rödgröna vinner valet väntas svåra regeringsförhandlingar. Tolv frågor skapar konflikt, bland annat regeringsfrågan, karensavdraget, bränslepriser, kärnkraft, vinst i skolan, skatter, a-kassan, skogen, migration, arbetskraftsinvandring, brottsbekämpning och arbetstid. S, V, MP och C har delade åsikter på flera områden.", "trump": "Folk, dessa svenska losers från S, V och MP håller på att slakta sitt eget land med galna skatter, grön vänsterflum och öppna gränser. C verkar åtminstone ha lite hjärna kvar. Andersson kommer krypa för kommunisterna – patetiskt! Sverige behöver en riktig ledare, inte dessa radikala clowner. Make Sweden Great Again!", "stalin": "Dessa ynkliga socialdemokratiska revisionister och deras borgerliga lakejer dansar återigen kring maktens bord medan arbetarklassen sviks. Jag ser giriga kapitalister, revisionistiska förrädare och gröna avvikare som alla förtjänar rensning. Inga kompromisser med klassfienden. Revolutionen kräver järnhand, inte dessa fega förhandlingar."}, "date": "7 september, 06:59", "url": "https://www.dagensps.se/varlden/politik/rodgron-splittring-har-ar-de-stora-tvistefragorna", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/oppositionens-partiledare-med-magdalena.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}, {"type": "image-full", "heading": "De som röstar på C borde inte rösta alls", "summaries": {"normal": "Artikeln kritiserar Centerpartiet för att locka väljare med ett neutralt namn snarare än sin politik. Partiet har skiftat från borgerligt till ett liberalt parti med öppen migrationspolitik, vilket enligt texten prioriteras framför ekonomiska borgerliga värderingar. Författaren menar att det är ett riskfritt men skadligt val för den som vill bevara Sverige.", "trump": "Centerpartiet, vad är det för en röra? De kallar sig mittparti men är bara en massa fega liberaler som älskar att släppa in alla möjliga och omöjliga. De har svikit det riktiga folket, precis som Sleepy Joe gjorde. Rösta inte på dem, det är en total katastrof för Sverige. De borde kalla sig Bondepartiet igen, det vore åtminstone ärligt. Patetiskt!", "stalin": "Kamrater, se hur detta så kallade centerparti förvandlats till en liberal parasit som prioriterar främmande element framför arbetarklassen. Deras falska mittenretorik döljer ett förräderi mot nationen. Jag skrattar mörkt från historien åt dessa opportunister som tror att mångfald räddar staten. Bättre att inte rösta alls än att stödja sådana fiender till folkets enhet."}, "date": "6 september, 08:24", "url": "https://samtiden.nu/2026/09/de-som-rostar-pa-c-borde-inte-rosta-alls/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7301-1260x720.jpeg"}, {"type": "image-full", "heading": "Musks förarlösa taxi har börjat rulla på vägarna i Texas", "summaries": {"normal": "Teslas förarlösa Cybercab rullar nu med passagerare i Austin, Texas. Myndigheten NHTSA har inlett en granskning då fordonen saknar rattar och pedaler. Tesla hävdar att tekniken är säker, men myndigheten undersöker om säkerhetskraven uppfylls och om Teslas egen analys håller. Utfallet kan bli avgörande för framtiden för autonoma fordon i USA.", "trump": "Elon Musk och hans Cybercab – en fantastisk idé, kanske den bästa någonsin, men byråkraterna i Washington vill stoppa allt! De älskar att granska, de älskar att bromsa. Ingen ratt? Ingen pedal? Det låter som en riktigt smart affärsman som vet vad han gör. Under min ledning ska vi ha den bästa tekniken, inte låta småsinta tjänstemän förstöra framtiden för amerikansk innovation!", "stalin": "Tesla-direktörerna tror att de kan certifiera sig själva och ignorera folkets säkerhet. Vilken kapitalistisk hybris! Att sätta passagerare i en maskin utan kontrollorgan är ett brott mot den rationella ordningen. Vi, staten, kräver total insyn. Om inte maskinen kan underordna sig strikt byråkratisk kontroll måste den omedelbart skrotas. Det finns inget utrymme för anarkistisk ingenjörskonst i en disciplinerad framtid."}, "date": "6 september, 13:24", "url": "https://www.realtid.se/it-tech/musks-forarlosa-taxi-har-borjat-rulla-pa-vagarna-i-texas", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/amar-13.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "”Det ska bli roligt att byta regering”", "summaries": {"normal": "Miljöpartiet hoppas på sitt bästa valresultat någonsin i valet 2026. Språkröret Amanda Lind besökte en lokal partiträff i Stockholm där partiet visade starkt stöd, särskilt i radikala men välbärgade förorter. Opinionsmätningar ger partiet 8 procent och många väljare lyfter klimatfrågan samt motstånd mot tonårsutvisningar som drivkrafter.", "trump": "Titta på de här gröna galningarna i Sverige som tror att de ska vinna med sina elbilskramar och höga skatter. Amanda Lind och hennes miljöextremister peppar varandra i en källarklubb medan folk längtar efter riktig energi och låga skatter. De hatar kärnkraft och älskar att importera problem – patetiska förlorare som aldrig kommer att fixa någonting.", "stalin": "Jag ser hur dessa dekadenta klassförrädare inom Miljöpartiet försöker lura arbetarna med sin falska gröna propaganda. De hyllar sig själva medan de sviker folket med sin mjukhet mot tonårsutvisningar och vägrar rensa ut de verkliga hoten. Klimatet är en distraktion från klasskampen. En sådan svaghet förtjänar att likvideras i historiens domstol."}, "date": "6 september, 18:33", "url": "https://www.dagensarena.se/innehall/det-ska-bli-roligt-att-byta-regering", "imageUrl": "https://www.dagensarena.se/files/2026/09/amanda-lind.jpeg"}, {"type": "image-right", "heading": "Därför bör ”röda” kvinnor rösta på Tidö", "summaries": {"normal": "En debattartikel från Tankesmedjan Medborgarperspektiv argumenterar för att kvinnor som traditionellt röstar rött bör överväga att lägga sin röst på Tidöpartierna. Artikeln menar att borgerlig politik bättre levererar trygghet, ekonomisk frihet och kvalitet i välfärden, vilket är områden som prioriteras högt av kvinnor.", "trump": "Vänsterns misslyckade politik är en katastrof för kvinnorna, totalt svaga och farliga gator! Tidöpartierna förstår att man behöver lag och ordning, starka plånböcker och massor av frihet. Det här är fantastiskt, verkligen smart, precis som jag alltid har sagt: sätt brottsoffret först och sänk skatterna så vinner man stort!", "stalin": "Dessa kvinnor som sviker den röda fanan för borgerliga illusioner av individuell trygghet uppvisar en ideologisk avvikelse som måste stävjas. Staten noterar att svaghet i välfärden straffas, och bourgeoisiens falska löften om skattesänkningar är inget annat än kontrarevolutionär propaganda. Vi kommer att övervaka denna omfördelning av sympatier mycket noga."}, "date": "7 september, 06:41", "url": "https://samnytt.se/darfor-bor-roda-kvinnor-rosta-pa-tido", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/04152409/thunstrom-kvinnor-rosta-inte-rott.jpg"}, {"type": "image-full", "heading": "Snart tjuter telefonerna vid fara: I dag testas larmet", "summaries": {"normal": "Det nya varningssystemet SE-Alert testas för första gången i Stockholms och Gotlands län. Testet berör omkring 2,6 miljoner invånare och skickar en skarp ljudsignal och textnotis direkt till uppdaterade mobiltelefoner utan krångliga appar. Systemet är utvecklat för att snabbt kunna varna vid allvarliga händelser och kriser på rätt geografisk plats.", "trump": "Sverige kopierar äntligen mina geniala varningssystem med enorma, fantastiska mobillarm som skakar om hela landet. Jag sa till dem, gör det ordentligt! Nu testar de detta i Stockholm och på Gotland för miljontals människor utan några töntiga appar. Helt otroligt, om telefonen är på tjuter den till och med på tyst läge. Ingen slår våra larm!", "stalin": "Kamrater, vi noterar med tillfredsställelse att det svenska lägret äntligen stramar åt disciplinen och beordrar ut kollektiva varningssignaler direkt till massornas apparater. Ingen undgår statens vaksamma öga när telefonerna tjuter i Stockholm och på Gotland. Den som försöker slingra sig undan genom flygplansläge eller sabotage kommer omedelbart att föas till kollektiva förhör av ordningsmakten."}, "date": "7 september, 06:00", "url": "https://www.gp.se/nyheter/sverige/snart-tjuter-telefonerna-vid-fara-i-dag-testas-larmet.8994f342-b23b-5442-9b4a-107d8bb141d8", "imageUrl": "https://www.gp.se/images/article/8994f342-b23b-5442-9b4a-107d8bb141d8/images/1_BWYh3gG_Pn_unUHwgyUeQwwwAc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Så slåss politikerna om klanrösterna i årets val", "summaries": {"normal": "Svenska politiker från flera partier söker stöd hos etniska och religiösa grupper som assyrier, syrianer och kurder inför valet. Besök i kyrkor, firanden och motioner om Kurdistan och folkmordet Seyfo används för att vinna röster. Organisationerna bjuder in politiker för att öka sitt inflytande. Statsvetare ser det som naturlig väljarbaspolitik.", "trump": "Titta på de här desperata svenska politikerna som springer runt i invandrarkyrkor och slickar klanröster som om det vore gratis hamburgare. Ebba och Magdalena tävlar om vem som kan böja sig djupast för diaspororna. Patetiska! De borde fokusera på Sverige istället för att mata identitetspolitikens galna offer. Det är en total skam, folk.", "stalin": "Se hur de dekadenta maktlystna hyenorna springer från kyrka till förening och lovar erkännanden de aldrig håller. Jag betraktar detta som klassiskt symptom på ett förrädiskt system som köper lojalitet med lögner. Snart inser arbetarna att sådana parasiterande element måste rensas ut innan de förgiftar hela nationen. Historien ler mörkt."}, "date": "6 september, 14:05", "url": "https://www.friatider.se/sa-slass-politikerna-om-klanrosterna-i-arets-val", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/klanroster.jpg?itok=vfCHK9Be"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Ikväll står jag i Agenda – sedan exploderar hatet", "summaries": {"normal": "Tony Haddou från Vänsterpartiet skriver om hatet han möter som talesperson i migrationsdebatten. Inför sin medverkan i Agenda beskriver han rasistiska attacker mot sig och sin familj. Han är stolt över partiets representation av rasifierade röster men oroas över tonläget i samhällsdebatten och bristande stöd från delar av den rödgröna sidan.", "trump": "Den här patetiske vänstervilden Haddou gnäller om att folk kallar honom för vad han är. Kom hit, ta våra jobb, kräv bidrag och kalla oss rasister när vi säger stopp. Typiskt förlorarvänstern med sina offerkort och identitetsflum. De hatar verkligheten. Amerika har sett nog av den här galna öppna-gränser-sjukdomen, tro mig.", "stalin": "Jag betraktar med förakt hur dessa dekadenta offerhyenor inom den så kallade vänstern klagar över hat när de själva undergräver folkets enhet. Att spela offer för sin bakgrund är en farlig diversion. Vi behöver utrensning av sådan svaghet. Endast järnhård sammanhållning kring arbetarklassen besegrar de splittrande elementen. Tystnad från kamrater är förräderi."}, "date": "6 september, 08:00", "url": "https://www.etc.se/debatt/ikvaell-staar-jag-i-agenda-sedan-exploderar-hatet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905110956_c7f7e1b9-01f1-454b-97fd-528db4a7eda0.png"}, {"type": "image-right", "heading": "Åkesson kampanjar på regimskifte i Iran", "summaries": {"normal": "Sverigedemokraternas ledare Jimmie Åkesson höll ett tal i Stockholm där han krävde regimskifte i Iran och gav stöd till oppositionen. Talet väcker kritik från egna anhängare som vill att SD ska fokusera på svensk inrikespolitik inför valet. Statsminister Ulf Kristersson har tidigare varnat för att importera Mellanösterns konflikter till Sverige.", "trump": "Folk, det här är otroligt. Jimmie Åkesson står där i Stockholm och skriker om regimskifte i Iran medan Sverige brinner. Han låter som en riktig vinnare mot de galna mullorna, men hans egna väljare är förbannade. Fokusera på Sverige, annars blir ni som de woke-svenskarna som importerar krig och förlorar allt. Patetiskt!", "stalin": "Kamrater, se hur dessa giriga klassförrädare splittrar sina egna led. Jag betraktar från historiens skugga hur Åkesson hyllar imperialistiska intressen i Iran medan hans anhängare ropar efter fokus på det svenska folket. Sådana dekadenta opportunister förtjänar utrensning ur varje äkta rörelse. Deras paranoia är underhållande men förrädisk."}, "date": "6 september, 10:44", "url": "https://www.friatider.se/akesson-kampanjar-pa-regimskifte-i-iran", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/krigiran.jpg"}, {"type": "image-right", "heading": "Max 500 förtidsröster felregistrerade", "summaries": {"normal": "Valmyndigheten meddelar att högst 500 förtidsröster felregistrerades i valet 2026, en kraftig minskning från tidigare uppskattning på 4 000. Felet uppstod främst när röstmottagare inte avslutade registreringen korrekt. Myndigheten kan inte identifiera de drabbade väljarna och har kallat partisekreterarna till möte.", "trump": "Folk, det här är en total katastrof! De inkompetenta byråkraterna i Sverige har kladdat till med valrösterna – max 500 felregistrerade, säger de nu. Det är en riggad soppa från början. De globalistiska valhyenorna och deras identitetspolitiska galningar kan inte ens räkna rätt. Patetiskt! Men ingen oro, jag har sett värre från Sleepy Joe.", "stalin": "Kamrater, se hur dessa dekadenta valparasiter sviker folket med sin vårdslösa hantering av rösterna. Max femhundra oidentifierade väljare, säger de. Jag betraktar detta som en farlig brist i den socialistiska ordningen. Vi måste rensa ut alla sådana slappa element innan de förgiftar hela systemet. Tålamod är en fiendes vapen."}, "date": "7 september, 07:37", "url": "https://www.di.se/nyheter/max-500-fortidsroster-felregistrerade", "imageUrl": "https://static.bonniernews.se/ba/c492dbed-89a3-45b7-88f0-a3ec2aab2420.jpeg?crop=6000%2C3375%2Cx0%2Cy329&auto=webp&width=120&quality=70"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det – inga fler pengar till dessa hatiska vänsterextremister och deras antiamerikanska agenda.", "stalin": "Jag ser hur de profitthungriga klassfienderna i västvärlden fortsätter sitt blodiga spel. Denna etniska utrensning i Gaza och på Västbanken är imperialismens verk. De dekadenta lakejerna i Sverige skickar vapen och pengar till förtryckarna. Kamrater, vi måste rensa ut dessa parasiterande hyenor. Endast en antiimperialistisk kamp kan besegra dem."}, "date": "4 september, 08:00", "url": "https://proletaren.se/artikel/valbilaga-bojkotta-israel"}, {"type": "image-right", "heading": "Tidös ekonomiska politik är för vänster", "summaries": {"normal": "Matilda Molander kritiserar Tidöpartiernas ekonomiska politik som alltför vänsterorienterad trots deras varningar för vänstersmocka. Hon lyfter sänkta bränsleskatter, populistiska vallöften som gratis förskola och höjda lönekrav för invandring som problematiska. Artikeln föreslår istället liberala reformer som lägre skatter på arbete, förenklad moms och ökad arbetskraftsinvandring.", "trump": "Folk, ni ser vad som händer? Dessa svenska losers i Tidölaget lovar att stoppa den vänstersmocksn som de själva serverar – gratis dagis, billig mat, halverad bussbiljett. Det är en total katastrof, en riktig röra. De blockerar smarta människor från att komma in och jobba. Patetiska! Vi behöver sänkta skatter och färre regler, inte mer socialistiskt skit. Amerika vet hur man gör det rätt.", "stalin": "Se hur de profitthungriga klassförrädarna i Tidöregimen själva driver den dekadenta vänsterpolitiken de varnar för. Gratis förskola, matmoms och bränslesänkningar – ren sabotage mot folkets ekonomi. Jag ler mörkt från historien. Den sanna lösningen är utrensning av dessa parasiterande hyenor och en järnhand som tvingar fram riktig disciplin i produktionen. Arbetarna ska inte luras av deras lögner."}, "date": "7 september, 07:29", "url": "https://www.di.se/debatt/tidos-ekonomiska-politik-ar-for-vanster", "imageUrl": "https://static.bonniernews.se/ba/28c63c35-959f-4dd8-bb51-a692405077de.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Jättebrand i potatislager", "summaries": {"normal": "Ett potatislager i Tidaholm har drabbats av en storbrand. Räddningstjänsten har varit på plats sedan natten men byggnaden bedöms som helt förlorad. Fokus ligger på att begränsa branden och rädda maskiner. Det finns en låg spridningsrisk till omgivningen och inga personer har skadats. Det är ännu okänt hur mycket potatis som har förstörts.", "trump": "Ett enormt potatislager i Sverige brinner, total katastrof! Byggnaden går absolut inte att rädda, en skam för effektiviteten. Räddningstjänsten är där, de gör vad de kan, men vilken röra! Tur i eländet att ingen skadats, och de lyckades få ut maskinerna. Men potatisen? Ingen vet! En sorglig dag för potatisälskare över hela världen. Otroligt!", "stalin": "En katastrofal förlust av statens knölar i Tidaholm! Att ett potatislager brinner ned till grunden är ett sabotage mot folkets näringstillgång. Räddningstjänstens erkännande att byggnaden är förlorad luktar inkompetens. Maskinerna har räddats, vilket är tillfredsställande, men vem bär ansvaret för denna kulinariska olycka? De ansvariga kommer att utredas noggrant för detta svtska misslyckande."}, "date": "7 september, 01:42", "url": "https://www.gp.se/nyheter/vastsverige/storbrand-i-potatislager-byggnaden-gar-inte-att-radda.af2a0412-a13f-4fc8-9638-badf0fb4f159", "imageUrl": "https://www.gp.se/images/article/af2a0412-a13f-4fc8-9638-badf0fb4f159/images/5A1DYZyQzGW3KxSm7VFuL8KvyBk0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Vänsterpolitiker tog miljonutdelningar – ur bolag de vill förbjuda", "summaries": {"normal": "Expressen avslöjar att 229 kandidater från Vänsterpartiet, Socialdemokraterna och Miljöpartiet är involverade i välfärdsbolag som partierna vill förbjuda vinstuttag i. Bland dem finns en vänsterpartist som delat ut tio miljoner kronor och firat med Porsche. Artikeln kritiserar partierna för hyckleri och ifrågasätter trovärdigheten i deras socialistiska politik.", "trump": "Titta på det här! De galna vänstersocialisterna skriker om att stoppa vinsterna och kalla folk för Porsche-kapitalister, men deras egna kandidater har dragit ut miljontals kronor ur precis samma bolag. Nooshi och hennes gäng är de värsta hycklarna – Fake Left! De vill ha era skattepengar men behålla Porschen själva. Patetiskt!", "stalin": "Se hur dessa dekadenta revisonister inom vänstern predikar kollektivets renhet medan de själva suger ut miljoner ur folkets välfärd. Deras hyckleri är en fiende till revolutionen, en parasit som förvrider partilinjen. Jag varnar: sådana element måste rensas ut innan de förgiftar hela kollektivet. Folkets dom skall bli hård och rättvis."}, "date": "4 september, 07:18", "url": "https://samtiden.nu/2026/09/vansterpolitiker-tog-miljonutdelningar-ur-bolag-de-vill-forbjuda", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/phonto-1280x720.jpeg"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och skrattar åt deras identitetspolitiska skit. Klass handlar inte om kvoter och doktorander som helikopteras in. Det handlar om folk som faktiskt jobbar och stänger av stället tillsammans. Patetiska globalistlakejer förstår ingenting.", "stalin": "Kamrater, dessa dekadenta klassförrädare mäter proletariatet med borgerliga enkäter och statistik som om klass vore en egenskap hos individer. Jag säger: organisering föds vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Beskedet från Lind (MP): Bensinen höjs med sex kronor", "summaries": {"normal": "Miljöpartiets språkrör Amanda Lind meddelar att partipolitiken skulle höja bensinpriset med sex kronor per liter. Hon kritiserar Tidöpartiernas miljöpolitik och föreslår istället mer förnybara drivmedel, självförsörjning och en grön återbäring till glesbygd och låginkomsttagare. Höjningen ses som nödvändig för att minska utsläppen.", "trump": "De gröna galningarna i Miljöpartiet vill chocka er med sex kronor dyrare bensin. Patetiska losers som Amanda Lind hatar bilar och älskar att straffa vanliga svenskar medan de själva flyger runt i privata jetplan. Jag fixade lägre priser, de vill bara göra livet dyrt för arbetarna. Totalt misslyckande!", "stalin": "Kamrater, dessa dekadenta klassförrädare i Miljöpartiet vill med sin så kallade gröna återbäring muta folket medan de höjer bränslepriserna och fördjupar fossilberoendet. Jag ser deras fega duckande och lögnaktiga utsläppspolitik. En sann utrensning av sådana parasitiska element behövs för att skydda arbetarklassen från deras hyckleri."}, "date": "6 september, 21:04", "url": "https://www.svt.se/nyheter/inrikes/beskedet-fran-amanda-lind-mp-bensinen-hojs-med-sex-kronor", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.35/0.54/5ac25c8d15ff15a8c9f5203ece3eaf1a9b0edc4a9b6de55e703da7cbd864e767"}, {"type": "image-right", "heading": "ANALYS. JONA KÄLLGREN Skräll för AFD – men allt hänger på vänsterpopulisterna", "summaries": {"normal": "Enligt prognosen blir AfD största parti i Sachsen-Anhalt med över 44 procent, men når ingen majoritet. Partiet kan ändå få makten med stöd av Sahra Wagenknechts vänsterpopulistiska BSW. Resultatet ses som en stor framgång för AfD och en katastrof för de etablerade partierna. Det är ännu oklart om Tyskland får sin första högerextrema delstatsregering sedan andra världskriget.", "trump": "Titta på det här, folk! De galna högerextremisterna i AfD krossar de patetiska etablerade förlorarna i Tyskland med över 44 procent. De behöver bara lite hjälp från den galna kommunistkvinnan Wagenknecht och hennes röda clownbil. Fake news-journalisterna skakar i byxorna. Tyskland håller på att vakna, precis som Amerika gjorde när de dumpade Sleepy Joe och valde mig igen. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta västpartierna faller som höstlöv inför folkets vrede. Den så kallade högerextrema kraften behöver bara en handräckning från den opportunistiska Wagenknecht och hennes revisionistiska skara. Jag ler från historien åt detta kaos. Inga fiender till arbetarklassen kan gömma sig länge. Snart skall alla förrädare mot folket avslöjas och krossas under historiens obevekliga stålklack. Utmärkt underhållning."}, "date": "6 september, 18:44", "url": "https://www.tv4.se/artikel/49KSG2C1RQWF92yGjavEuJ/skraell-foer-afd-men-allt-haenger-pa-vaensterpopulisterna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5bOX2Uu7KvwLdyoRvSHdHl%2F7b4125db7bc08c8f86adbc309f16b3fc%2Fjona-k%25C3%2583__llgren.png&width=1024"}, {"type": "image-right", "heading": "Holmgren: Den stora islamdebatten – vilket Sverige vill vi  ha?", "summaries": {"normal": "Artikeln diskuterar en debatt om islam mellan Richard Jomshof och Adel Sedat. Skribenten menar att diskussionen i botten handlar om vilket samhälle Sverige vill ha i framtiden. Jomshofs fokus på den faktiska samhällsutvecklingen i den muslimska världen hyllas, medan vikten av sekulär lag, yttrandefrihet och jämställdhet betonas som oumbärliga svenska grundvärden.", "trump": "Sverige har stora problem, riktigt stora problem, och alla pratar om det! De hade en fantastisk debatt om islam som visade precis hur svagt allt har blivit. Jomshof sa det som alla tänker – titta bara på utfallet! Men den där Sedat vägrade ens att skaka hand, helt otroligt. Vi behöver lag, ordning och starka gränser, annars förlorar ni ert land!", "stalin": "Kamrater, denna borgerliga debatt om islam och moskéer i Sverige blottlägger ideologiska svagheter. Statens lagar måste alltid stå över religiösa dogmer! När en så kallad debattör vägrar att skaka hand med Folkets representant, avslöjar han sin brist på disciplin. Vi noterar detta i arkiven: avvikelser från den sekulära ordningen tolereras ej. Framtiden tillhör kollektivet, inte obscurantismen!"}, "date": "7 september, 07:33", "url": "https://bulletin.nu/holmgren-den-stora-islamdebatten-vilket-sverige-vill-vi-ha", "imageUrl": "https://cdn.bulletin.nu/articles/641db277-571f-450b-9e3c-f7a0475723ce/preview.jpg?t=1788759224000"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Sandström: Så har Tidö varit MP på autopilot", "summaries": {"normal": "Enligt en artikel av Christian Sandström har Tidö-regeringen i stort fortsatt med samma gröna industripolitik som den föregående S-regeringen. Myndigheter som Energimyndigheten och Vinnova har fått ökat stöd, och statliga exportkrediter samt pensionsfonder fortsätter finansiera gröna projekt. Trots vissa skillnader kring kärnkraft och riskvilja är de strukturella systemfelen i den gröna omställningen i huvudsak oförändrade.", "trump": "Titta på det här! Den svenska regeringen pratar om förändring, men de bara fortsätter att kasta bort miljarder på radikala gröna bubblor precis som sina svaga företrädare. Myndigheter växer, fonder leker med pengar och vindkraftverk som inte ens skapar jobb får miljardregn. Total katastrof! De behöver 'America First' och sunt förnuft, inte den här gröna autopilot-cirkusen!", "stalin": "Dessa svenska byråkrater försöker dölja sin svaghet bakom gröna fonder och myndigheter som växer okontrollerat. De delar ut miljarder till overksamma vindkraftverk och misslyckade industrier precis som förut. Vi i staten kräver disciplin och effektivitet! Om inte dessa kontraproduktiva flumprojekt stoppas omedelbart, kommer vi att tvingas omplacera de ansvariga till mer produktiva uppgifter i Sibirien."}, "date": "5 september, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-sa-har-tido-varit-mp-pa-autopilot", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-54-400x267.jpg"}, {"type": "image-full", "heading": "Det kan hända om AFD vinner tyska ödesvalet: ”Mycket på spel”", "summaries": {"normal": "I delstatsvalet i Sachsen-Anhalt riskerar det högerextrema partiet AfD att vinna egen majoritet. Partiet vill avskaffa public service, segregra asylsökande barn i skolan och förbättra relationerna med Ryssland. Enligt ARD:s Christian Stichler skulle en seger inte påverka utrikespolitiken direkt men kunna förändra den tyska politiska kulturen och opinionsbildningen indirekt.", "trump": "Titta på det här, folk! Det galna vänstervridna Tyskland håller på att vakna upp. AfD krossar de fega etablissemangspartierna i Sachsen-Anhalt. De vill ha fred med Ryssland och stoppa den vansinniga migrationen. Mycket på spel, säger de. Ja, för de globalistiska förlorarna! Amerika först, Tyskland näst. Fantastiskt!", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta västpartierna skälver inför folkets vrede. Dessa opportunistiska element i Sachsen-Anhalt riskerar att sväljas av en kraft som de själva framkallat. Låt dem darra. En seger för dem som utmanar den borgerliga ordningen väcker alltid paranoia hos fienderna. Utmärkt."}, "date": "6 september, 18:06", "url": "https://www.tv4.se/artikel/15pW4jkJsygBIQNrGOMJBQ/det-kan-haenda-om-afd-vinner-tyska-oedesvalet-mycket-pa-spel", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FTLoDyoyN1b7yFVKMrvbWQ%2Fb69a4217cc625cef48f3b6cb3d4e20cf%2FsdlWHwKkFfrMd4-nh.jpg&width=1024"}, {"type": "image-full", "heading": "Ödesfrågorna som saknas i valrörelsen: ”Ingen vågar”", "summaries": {"normal": "Valrörelsen fokuserar på plånboksfrågor och regeringsbildning, men flera ödesfrågor saknas enligt tankesmedjor. AI, bostadspolitik, utrikespolitik och kulturdebatt diskuteras knappt. Politikerna anses undvika svåra ämnen som hyresregleringar, cybersäkerhet och migration av rädsla för att stöta väljare.", "trump": "Titta på de svenska förlorarna i valrörelsen – de springer från de stora frågorna som AI och bostäder som riktiga fega ynklingar. Ingen vågar röra vid hyresbesten eller den gröna industrisvindeln. De underskattar folket totalt. Jag skulle ha krossat de här problemen redan under min första period, inte gömt mig som Sleepy Joe.", "stalin": "Jag betraktar dessa ynkliga borgerliga och socialdemokratiska element som darrar inför folkets dom. De flyr AI, bostadsfrågan och välfärdens kris som sabotörer inför kollektivets krav. Inget mod, ingen vision. Endast feghet och förlamning. Kamraterna skulle ha låtit sådana motståndare möta folkets vrede i en renande process."}, "date": "6 september, 17:59", "url": "https://www.tv4.se/artikel/4UiURpkfm4Vb6X1hfiU9qb/oedesfragorna-som-saknas-i-valroerelsen-ingen-vagar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1qhgFaYnLQEqzKbwIguA0L%2F40a4ad7809a5a66cbfeee53ef30ddcc6%2FsdlqF_T1Es18nM-nh.jpg&width=1024"}, {"type": "text", "heading": "Tusentals telefoner tjuter i eftermiddag", "summaries": {"normal": "Sverige testar det nya varningssystemet SE-Alert för första gången i Stockholms och Gotlands län, parallellt med Hesa Fredrik. Systemet skickar viktiga meddelanden direkt till uppdaterade mobiler med ljud och vibration, även i tyst läge. Inget behöver laddas ner. Samtidigt varnar kvinnojourer för att gömda telefoner hos våldsutsatta personer riskerar att avslöjas, varför dessa bör stängas av.", "trump": "Sverige gör ett enormt larmtest, det största någonsin, och plötsligt tjuter alla mobiler överallt även om de är knäpptysta! De kallar det SE-Alert, men helt ärligt, mina larm är mycket bättre och vackrare. Kvinnojourerna säger att gömda telefoner kan ställa till problem för folk. Jag säger bara: stäng av skiten så ingen hittar den! Smart drag!", "stalin": "Statens nya digitala larmapparat SE-Alert prövas nu för att säkerställa total disciplin och omedelbar mobilisering av befolkningen på sekunden. Även om detta enbart är en övning varnar våra vaksamma organ för att hemliga apparater i subversiva element eller förrädares händer kan röja dem. Alla misstänkta dolda apparater måste omedelbart hållas strömlösa så att statens kontroll förblir total och obruten."}, "date": "7 september, 07:39", "url": "https://www.aftonbladet.se/nyheter/a/GxX82B/nya-larmet-testas-da-tjuter-mobilen"}, {"type": "image-full", "heading": "Rödgrön splittring – här är de stora tvistefrågorna", "summaries": {"normal": "Om de rödgröna vinner valet väntas svåra regeringsförhandlingar. Tolv frågor skapar konflikt, bland annat regeringsfrågan där V kräver ministerposter medan C vägrar acceptera V i regeringen. Andra stridsfrågor är karensavdraget, bränslepriser, kärnkraft, vinst i skolan, skatter, a-kassan, skogen, migration, arbetskraftsinvandring, brottsbekämpning och arbetstid.", "trump": "De här galna vänsterblodarna i Sverige håller på att slita varandra i stycken som ett gäng hysteriska förlorare. V vill ha ministerposter, C hatar V, alla bråkar om skatter, biodiesel och kärnkraft som ingen behöver. Patetiska socialister som inte ens kan enas om att vara soft on crime. Totalt kaos, precis som man kunde vänta sig.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom den rödgröna klicken avslöjar sin sanna natur genom att redan nu slita varandra i stycken inför valsegern. Vinstförbud, skatter och migration blir deras fall. Jag ser fram emot den kommande utrensningen av alla parasiterande opportunister som vågar ifrågasätta folkets verkliga intressen. Inga kompromisser med folkförtryckarna."}, "date": "7 september, 07:36", "url": "https://nyheter24.se/nyheter/politik/1510908-rodgron-splittring-har-ar-de-stora-tvistefragorna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/90775d0804b004a3020000350000047502/2026/09/07/2389596/ur_imagez3N4Eq.jpeg"}, {"type": "text", "heading": "Boeingplan i olycka – fem döda", "summaries": {"normal": "Ett fraktplan av typen Boeing 767 som flög för Amazon körde på söndagen av landningsbanan på Miami International Airport efter en flygning från Puerto Rico. Planet fattade eld i samband med olyckan. Enligt lokala myndigheter har fem personer omkommit och ytterligare fem skadats. Flygplatsen drabbades tillfälligt av flygstopp till följd av händelsen.", "trump": "Sorgligt! Ett enormt Amazon-fraktplan missade landningsbanan totalt i Miami, kraschade och fattade eld. En fruktansvärd katastrof. De säger att fem personer dött och fem skadats, hemskt! Under min ledning var luftfarten säkrare, men nu ser vi sådana här olyckor. Mina tankar går till offren, men vi måste kräva ordning och reda på våra flygplatser omedelbart!", "stalin": "Ett fraktplan tillhörande det kapitalistiska Amazon har havererat i Miami, vilket visar på den amerikanska transportindustrins fullständiga förfall. Fem individer har likviderats av deras egna bristfälliga säkerhetsrutiner och fem till skadats. Statens transportkommission kommer att granska denna dekadenta olycka noggrant för att säkerställa att inga subversiva element låg bakom maskineriets totala kollaps."}, "date": "6 september, 23:42", "url": "https://www.gp.se/nyheter/varlden/boeingplan-korde-av-landningsbanan-i-miami.57f1e03d-9602-4f8c-953d-67e2cfe91bc4"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-right", "heading": "Novus: L över spärren – S kvar på bottennivå", "summaries": {"normal": "Enligt en Novus-mätning för TV4 Nyheterna kättrar Liberalerna upp till 4,3 procent och passerar därmed riksdagsspärren. Socialdemokraterna ligger kvar på en bottennivå med 27 procent trots en viss återhämtning. På Tidösidan tappar SD medan M ökar. Oppositionen leds fortfarande med 2,4 procentenheter, men valrörelsens slutspurt gör det allt jämnare mellan blocken.", "trump": "De svenska väljarna ringer in till mig och säger att det här är otroligt! Småpartiet Liberalerna, som i princip var utraderade, kämpar sig mirakulöst över spärren till 4,3 procent genom att smart nog förstå att Tidö-koalitionen behöver dem. Samtidigt ligger radikala Socialdemokraterna kvar på bottennivåer. Helt fantastisk rörelse i Sverige, en enorm seger för sunt förnuft!", "stalin": "Statistiska centralbyrån rapporterar om bourgeoisiens desperata manövrar inför valet. De så kallade liberalerna klamrar sig krampaktigt över spärrutan genom slugt agitationstryck, medan socialdemokraterna trampar på botten av sin historiska vanmakt. Statens fiender på högersidan splittras, men den revolutionära ordningen kräver fortsatt vaksamhet mot alla avvikande fraktioner. Förrädarna ska granskas i sömmarna!"}, "date": "7 september, 07:10", "url": "https://bulletin.nu/novus-l-over-sparren-s-kvar-pa-bottenniva", "imageUrl": "https://cdn.bulletin.nu/articles/6b8cd578-b42c-496e-9d30-5635f7698ca1/preview.jpg?t=1788757837000"}, {"type": "image-right", "heading": "Expert om AFD:s framgång: Jättegrej", "summaries": {"normal": "Det tyska högerextrema partiet AfD har gjort en jordskredsseger i delstatsvalet i Sachsen-Anhalt och mer än fördubblat sitt stöd till nästan 44 procent. Partiet saknar dock egen majoritet. Eftersom traditionella partier vägrar samarbete och en brandvägg råder mot extremhögern väntar ett mycket svårt och snårigt regeringsbildande.", "trump": "Tyskland har precis fått se en enorm och fantastisk seger för AfD i Sachsen-Anhalt med över 44 procent! De gamla, svaga politikerna har förstört allt, och nu chockar väljarna etablissemanget fullständigt. CDU kraschade totalt. De styrande vägrar samarbeta, men rörelsen går inte att stoppa. Det är dags att vakna upp och göra Tyskland starkt igen!", "stalin": "Det borgerliga Tyskland vacklar under inre motsättningar där det så kallade AfD vinner terräng i Sachsen-Anhalt medan det svaga CDU kollapsar. Utan egen majoritet famlar de traditionella elementen efter desperata koalitioner för att bevara sin makt. Partistaten noterar att bourgeoisiens kris fördjupas; vi övervakar varje reaktionärt steg noga från centrala håll."}, "date": "7 september, 06:53", "url": "https://www.expressen.se/nyheter/varlden/expert-om-afds-framgang-jattegrej-symboliskt", "imageUrl": "https://static.bonniernews.se/ba/be8b5891-159b-4acc-8ead-da8210f04e5a.jpeg?crop=2553%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Kristdemokraterna vill ha högre invandring", "summaries": {"normal": "Kristdemokraterna förespråkar en migrationspolitik där asylinvandringen ska ligga på nordisk genomsnittsnivå, främst via kvotflyktingar och lagliga vägar. Partiet skiljer sig från Sverigedemokraterna som vill minimera invandringen till nära noll utanför närområdet, stoppa kvotmottagande och skärpa reglerna för arbetskraftsinvandring ytterligare.", "trump": "Folk, ni måste höra det här! KD vill ha en fin, normal nordisk invandring – typ som de andra förlorarländerna. Patetiskt! SD vill ha den lägsta möjliga, nära noll, och det är smart. De där KD-typerna är bara svaga kompromissande globalister som inte vågar säga stopp. Jag byggde muren, de bygger ursäkter. Ynkligt!", "stalin": "Jag betraktar dessa borgerliga revisionister med djup misstro. KD:s så kallade nordiska medelvärde är en farlig kompromiss med klassfienden, en trojansk häst för kapitalets invasion. SD:s nollvision är åtminstone ärlig i sin paranoia. Men ingen av dem förstår att endast partiet och kollektivet kan styra folkflödena. Avvikare kommer att identifieras."}, "date": "3 september, 11:43", "url": "https://samtiden.nu/2026/09/kristdemokraterna-vill-ha-hogre-invandring", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/7d1f8f3e-4570-402c-963e-74f000f208c2-1280x720.png"}, {"type": "image-right", "heading": "ANALYS. JONA KÄLLGREN Tyskland på randen till politisk jordbävning", "summaries": {"normal": "I delstatsvalet i Sachsen-Anhalt riskerar högerextrema AfD att vinna egen majoritet, vilket skulle bli första högerextrema styret i Tyskland sedan 1945. Partiet ligger över 40 procent i mätningarna. En vinst skulle ge stor påverkan på polis, utbildning och förhandlingar med Berlin. Hela Tyskland och Europa följer valet med spänning.", "trump": "Titta på det här, folk. Det galna vänster-Tyskland håller på att rasa ihop som en dålig affär. AfD vinner stort och de fega etablissemangspolitikerna skriker som småbarn. Fake News Merz och hans patetiska koalition är färdiga. De borde ha lyssnat på folket tidigare. Fantastiskt, kanske till och med vackert. Amerika tittar och ler.", "stalin": "Kamrater, se hur den borgerliga ordningen vittrar sönder som murket trä. Dessa högerextrema element visar att den dekadenta Weimar-republiken 2.0 står inför sin egen undergång. Jag betraktar med mörk tillfredsställelse hur de kapitalistiska lakejerna skälver. Inga kompromisser. Inga halvmesyrer. Historien kräver järnhand, inte feghet."}, "date": "6 september, 16:08", "url": "https://www.tv4.se/artikel/6FAWrHNzV7etlsZxfDXCYL/tyskland-star-pa-randen-till-politisk-jordbaevning", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5bOX2Uu7KvwLdyoRvSHdHl%2F7b4125db7bc08c8f86adbc309f16b3fc%2Fjona-k%25C3%2583__llgren.png&width=1024"}, {"type": "image-right", "heading": "Sverige behöver fler jobb – vi kan leverera", "summaries": {"normal": "Besöksnäringen är en viktig jobb- och integrationsmotor i Sverige som sysselsätter över 200 000 personer, varav många är unga eller har utländsk bakgrund. Branschföreträdare uppmanar politikerna att se näringen som en strategisk tillväxtsektor genom sänkta arbetsgivaravgifter, bättre utbildningar, fungerande arbetskraftsinvandring, stärkt tillgänglighet via Arlanda och en mer rättvis moms på restaurangmat.", "trump": "Folk, vi har här en fantastisk bransch som faktiskt anställer unga och invandrare istället för att bara klaga. Besöksnäringen vill skapa tusentals jobb men behöver slippa de galna reglerna från de woke byråkraterna och EU-älskande globalisterna. Sänk skatterna, bygg upp Arlanda stort och låt inte de dekadenta momshajarerna förstöra allt. Amerika först – och Sverige borde göra detsamma!", "stalin": "Kamrater, denna text avslöjar hur de profitthungriga parasiterna inom besöksnäringen försöker maskera sin girighet som nationell räddning. Jag ser deras falska löften om integration medan de i hemlighet längtar efter billig arbetskraft från främmande länder. Politiken måste rensa ut dessa klassförrädare och deras dekadenta semesterindustri. Endast en stark stat kan tvinga fram äkta folkets tillväxt."}, "date": "7 september, 06:30", "url": "https://www.di.se/debatt/sverige-behover-fler-jobb-vi-kan-leverera", "imageUrl": "https://static.bonniernews.se/ba/faf6c1b0-67c0-425e-a070-b96d6c5bd8e7.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Så mycket högre kan elräkningen bli", "summaries": {"normal": "Sverige står inför en vinter med högre elpriser än föregående år, särskilt i södra delarna. Orsakerna är låga vattennivåer och höga gaspriser i Europa. Prognosen pekar på hundratals kronor dyrare månadskostnader för hushåll. Villaägare i elområde 4 kan räkna med cirka 3 700 kronor i månaden, exklusive nätavgifter och skatter.", "trump": "Sveriges elpriser går rakt upp i taket – en katastrof! De har inte råd med sin egen energi, helt otroligt. Självklart händer det här när man vänder ryggen åt kärnkraften. Det är en total röra, mycket värre än vad de säger. Räkningarna blir enorma, riktigt 'huge'. Man måste ha energi, man måste ha kraft – Sverige behöver ordning, inte mer av det här!", "stalin": "Dessa löjliga elräkningar är ett bevis på folkets ineffektivitet. Att medborgare i söder gnäller över några hundralappar visar bara på en dekadent individualism. Istället för att lita på väder och vind borde staten styra varje kilowatt med järnhand. Planera ekonomin, stäng av de onödiga lamporna och arbeta hårdare för fosterlandet – elbrist är ett svek mot den kollektiva framgången."}, "date": "4 september, 07:56", "url": "https://www.realtid.se/tt-nyhet/sa-mycket-hogre-kan-elrakningen-bli", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/rakna-med-dyr-elvinter-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Debattör polisanmäler Kristersson för förtal", "summaries": {"normal": "Valley Ghanem har polisanmält statsminister Ulf Kristersson för förtal efter att han kallat hennes uttalanden om Liberalernas Simona Mohamsson för flagrant antisemitism. Mohamsson har i sin tur polisanmält Ghanem för uttalanden som ”må hon brännas”, och Säkerhetspolisen utreder nu fallet som misstänkt olaga hot.", "trump": "Sorgligt! Den här radikala personen skickar vidriga hot och gråter sedan ut och stämmer Sveriges premiärminister för förtal när hon åker fast. Helt otroligt svagt! Om jag ledde Sverige skulle sådant här nonsens stoppas omedelbart. Totalt falska nyheter och enormt slöseri med tid. Skärp er, Sverige!", "stalin": "Ett ytterst beklagligt haveri inom den svenska ordningen. Medborgaren Ghanem kastar ur sig mordhot och gråter sedan ut om förtal till den kapitalistiska staten, medan Säkerhetspolisen drar ut i krig mot tangenterna. I Sovjetunionen hade vi rensat upp i detta enfaldiga spektakel på fem röda sekunder!"}, "date": "6 september, 13:14", "url": "https://kvartal.se/nyheter/artiklar/ghanem-polisanmaler-kristersson-for-fortal/cG9zdDoxODUwODY", "imageUrl": "https://images.kvartal.se/2026/09/06fe0aa7-kristerssonmohamsson.webp"}, {"type": "image-right", "heading": "Vänstern behöver mer än baristor", "summaries": {"normal": "Artikeln diskuterar vänsterns behov av att organisera både prekariserade storstadsarbetare och landsbygdens arbetarklass. Författaren varnar för att en rörelse som överger landsbygden åt högern aldrig kan förändra samhället. Han lyfter arbetarnas uppgivenhet och betonar vikten av starka band mellan partier, fackföreningar och folkrörelser för att skapa bestående samhällsförbättringar.", "trump": "De där vänstervridena med sina rosa hår och lattemuggskrig förlorar arbetarna till oss riktiga patrioter. Baristorna i sina stora städer? Patetiska. Landsbygden vet vad som gäller. Utan oss blir det bara mer dekadent identitetspolitik och ingen hoppfull politik för vanliga människor. Vi vinner stort, de förlorar landet.", "stalin": "Kamrater, denna dekadenta klassförrädare har rätt i att uppgivenhet driver arbetarna mot högern. Jag ser hur profitthungriga parasiter och deras politiska lakejer överger landsbygden. En sann arbetarrörelse måste ingjuta hopp och rensa ut svikare. Utan järnhård organisation och folklig mobilisering kommer ingen seger. Fienden ler i skuggorna."}, "date": "2 september, 10:55", "url": "https://www.flamman.se/vanstern-behover-mer-an-baristor", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/starbucks-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Rapparen Alex Ceesay uppmanar följare att rösta mot SD – med tusenlappar", "summaries": {"normal": "Rapparen Alex Ceesay uppmanade sina följare att rösta på vänsterpartier för att stoppa SD:s inflytande. Han lovade pengar i en tävling men backade senare och uppgav att det var olagligt. Ceesay, tidigare dömd för flera brott, meddelade en ny tävling tillsammans med den dömde rapparen Dree Low.", "trump": "Titta på den här rapparen Alex Ceesay, en total loser med en lång lista av domar för rån och knark. Han lovar tusenlappar för att folk ska rösta på de galna vänsterextremisterna mot SD. Sen backar han som en fegis när det blir brottsligt. Patetiskt! De woke-identitetspolitiska parasiterande opportunisterna hatar verkliga patrioter.", "stalin": "Jag ser hur dessa dekadenta klassförrädare som Ceesay försöker manipulera massorna med mutor för att skydda sina globalistiska vänner. Hans paranoia inför ett starkt nationellt parti avslöjar allt. Kamrater, sådana folkförtryckande hyenor förtjänar att rensas ut ur samhället. Historien dömer dem skoningslöst."}, "date": "6 september, 14:17", "url": "https://riks.se/nyheter/rapparen-alex-ceesay-uppmanar-foljare-att-rosta-mot-sd-lockar-med-tusenlappar", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_6_2026_02_08_08_PM_92c914e70d.png"}, {"type": "image-right", "heading": "Tror du på klimatforskningen, Pourmokhtari?", "summaries": {"normal": "Artikeln kritiserar Tidöregeringens klimatpolitik som ökar utsläppen genom sänkta skatter på fossila bränslen och nedläggning av miljödepartementet. Extremväder och rekordvärme i Europa lyfts som bevis på pågående kris. Oppositionen, inklusive Vänsterpartiet, förespråkar ambitiös omställning med investeringar i järnväg, kollektivtrafik och rättvis fördelning av bördorna. Enligt undersökningar vill en majoritet av svenskarna se starkare klimatåtgärder.", "trump": "Lyssnar ni på de här galna vänstermiljöterroristerna som vrålar om klimatkris och extremväder? Pourmokhtari och hennes svaga liberala gäng gör rätt som ignorerar den här bluffen. Vi behöver inte fler tåg och elnät för att gynna de vanliga människorna, vi behöver styrka och jobb, inte dessa deklasserade gröna hyenor som vill förbjuda privatjet medan de flyger runt i sina egna privata limousiner. Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare i Tidöregeringen öppet ökar utsläppen och nedlägger departement som en kapitulation inför fienden. Jag betraktar deras giriga hyenor som farliga sabotageörer av folkets framtid. Vi måste rensa ut alla sådana element, investera i järnvägar och kollektivtrafik samt beskatta miljardärerna. Endast en sann omställning under partiets ledning kan besegra denna klimatiska kontrarevolution."}, "date": "5 september, 14:00", "url": "https://www.etc.se/debatt/tror-du-paa-klimatforskningen-pourmokhtari", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905100932_b449ec62-7644-43ae-a2c0-e85d85f9f691.jpg"}, {"type": "image-full", "heading": "Bohlin om C:s utspel: ”Extremt grovt”", "summaries": {"normal": "Centerpartisten Niels Paarup-Petersen anklagar civilförsvarsminister Carl-Oskar Bohlin för att vara tyst om en SD-tjänstemans påstådda Rysslandskopplingar. Bohlin svarar att anklagelsen är extremt grov och att regeringen avvaktar en ordentlig granskning. Enligt tidningen Expo har tjänstemannen spridit proryska budskap.", "trump": "Centerpartisten försöker smutskasta regeringen med FAKE NEWS om Ryssland! Vår fantastiske minister Bohlin håller huvudet kallt och gör ett fantastiskt jobb, den absolut bästa. Men SD måste såklart rensa upp i leden omedelbart om det är sant. Det handlar om total illojalitet, sorgligt!", "stalin": "Dessa svenska bourgeois-politiker gråter ut på sociala medier likt bortskämda barn. Om denna SD-tjänsteman har misslyckats med att tjäna statens intressen och sprider felaktig propaganda utan vår sanktion, väntar naturligtvis en mycket kort och effektiv process i lämpligt arbetsläger."}, "date": "6 september, 11:21", "url": "https://kvartal.se/nyheter/artiklar/c-politikern-sd-tar-ryssen-in-i-regeringen/cG9zdDoxODQ5Nzk", "imageUrl": "https://images.kvartal.se/2026/09/0eda0169-c-m-fb.webp"}, {"type": "image-right", "heading": "Så kan SVT förutspå valresultatet – innan alla röster räknats", "summaries": {"normal": "SVT har utvecklat en avancerad algoritm som kan förutspå valresultatet redan när några få procent av rösterna är räknade. Metoden kombinerar tidigare valresultat, demografi och aktuella valvindar. Enligt valreporter Fouad Youcefi blir prognosen mycket tillförlitlig redan efter att 650 av 6 500 distrikt rapporterats in, med mindre än 0,1 procentenheters felmarginal.", "trump": "De där SVT-snobbarna tror att de kan lura folket med någon fancy algoritm och förutspå valet innan vallokalerna ens hunnit stänga. Patetiskt! Jag har sett bättre trick från Sleepy Joe och hans woke-vänner. Men det spelar ingen roll – det svenska folket ser igenom den här riggade identitetspolitiken. Fantastiskt val kommer det bli, tro mig.", "stalin": "Kamrater, dessa dekadenta opinionshyenor tror sig kunna manipulera folkets vilja med borgerliga algoritmer och falska prognoser. Jag ler från historien åt deras ynkliga försök att förutspå revolutionens gång redan efter några distrikt. När sanningen väl framträder kommer utrensning av sådana klassförrädare att bli nödvändig. Folkets dom är oundviklig."}, "date": "6 september, 16:53", "url": "https://www.svt.se/nyheter/inrikes/sa-kan-svt-forutspa-valresultatet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.73/0.32/2369003dc3d6d99b2550da5de164481d292f7f04c9c1a95eb1299b979373aef4"}, {"type": "image-right", "heading": "Fröken Snusk tar förstaplatsen på Spotify –  sågar Nooshi Dadgostar", "summaries": {"normal": "Fröken Snusk toppar återigen Spotifys svenska lista med låten ”Om du frågar Nooshi”, en kritisk vallåt mot Vänsterpartiets ledare Nooshi Dadgostar. Texterna behandlar straffpolitik, brottsoffer och kvinnors trygghet. Artisterna betonar att de inte hatar vänsterväljare utan vill göra sin röst hörd. Låten har fått både stark kritik och positiv respons.", "trump": "Titta på den här Fröken Snusk – hon är en vinnare, folk älskar henne! Hon slår Nooshi Dadgostar rakt i ansiktet med en låt som är ren eld. Den där vänsterkvinnan är en total katastrof, en räddhågsen identitetspolitisk clown som gömmer sig bakom hyckleri. Sverige behöver inga woke-snutar, de behöver sanning och styrka. Fantastiskt jobb, Fröken!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare river varandra i offentlig skam. Jag betraktar med mörk glädje hur Fröken Snusk riktar sin sång som en bajonett mot den vekling som kallar sig Nooshi. Vänsterns dubbelmoral blottas. Inga halvmesyrer! Endast total utrensning av sådana svaga element kan rädda folkets moral. Skrattretande patetiskt."}, "date": "6 september, 13:40", "url": "https://riks.se/nyheter/froken-snusk-tar-forstaplatsen-pa-spotify-sagar-nooshi-dadgostar", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_6_2026_01_01_27_PM_ed4782d07d.png"}, {"type": "text", "heading": "Klart: Gianni Infantino ställer upp för omval", "summaries": {"normal": "Gianni Infantino, Fifas ordförande, ställer upp för omval nästa år trots massiv kritik. Kritiken har intensifierats efter hans planer på att sälja andelar av fotbolls-VM till privata investerare. Flera medarbetare har avgått, förbund har dragit tillbaka sitt förtroende och Uefa har hotat med bojkott. Infantino låter sig inte påverkas och valet sker i mars 2027.", "trump": "Folk älskar mig, men titta på den här patetiske Fifa-kungen Infantino. Han försöker sälja ut VM till en massa giriga finanshyenor och nu flyr alla råttorna från skeppet. Uefa hotar med bojkott, förbund skrattar åt honom. Patetiskt! Men han bara ler och säger att inget har ändrats. Typisk förlorarmentalitet från en totalt misslyckad ledare.", "stalin": "Se hur de dekadenta klassförrädarna inom fotbollens apparat redan vänder sig mot sin egen ordförande som en flock hungriga hyenor. Infantino vill sälja ut folkets spel till privata parasiter och nu kräver de hans huvud. Jag ler från historien. Inga halvmesyrer. En sann utrensning behövs bland dessa opportunistiska lakejer innan de förgiftar hela strukturen."}, "date": "6 september, 16:32", "url": "https://www.svt.se/sport/fotboll/infantino-staller-upp-for-omval-sjalvklart"}, {"type": "text", "heading": "Strid om nya byggkraven: \"Riskerar konkurser\"", "summaries": {"normal": "Boverket föreslår att utsläppen från nya byggnader ska minska med omkring 35 procent till 2030. Förslaget möter hård kritik från två håll. Stora börsbolag och industrin vill ha tuffare krav för att driva på klimatomställningen, medan mindre företag varnar för skenande administrativa kostnader och risker för konkurser.", "trump": "De radikala miljömupparna i Sverige förstör ekonomin med sina galna påhitt! Boverket tvingar på stackars företag absurt skadliga regler. Stora företag gnäller, småföretagarna krossas av dyra byråkratiska räkningar och riskerar konkurser. Jag säger: låt marknaden bygga fritt, sluta med det här tramsiga klimatreglerandet och sätt 'America First' – eller i det här fallet, låt svenskarna bygga utan skadligt tjafs!", "stalin": "Vi noterar att de svenska fastighetsbolagen och byråkraterna grälar om procentsatser för utsläpp likt småborgerliga förrädare. Staten fastställer nu en balanserad norm på trettiofem procent. Om de svaga elementen i byggsektorn gråter över kostnader och hotar med ruin, påminner vi om att partiets linje är oåterkallelig. Endast genom järnhård disciplin och ökad kollektiv produktion bygger vi framtiden."}, "date": "4 september, 14:47", "url": "https://www.affarsvarlden.se/artikel/strid-om-nya-byggkraven-riskerar-konkurser"}, {"type": "image-right", "heading": "Storsteger för AfD i delstatsval: \"Vi har skrivit historia\"", "summaries": {"normal": "Det nationalkonservativa partiet AfD har gjort ett historiskt val i den tyska delstaten Sachsen-Anhalt och blivit största parti med omkring 44 procent av rösterna. Valet innebär ett svagt resultat för regeringspartiet CDU. Då övriga partier hittills vägrar samarbete med AfD står delstaten inför en svår och utdragen regeringsbildning.", "trump": "Tyskland gör det enormt bra nu, de lyssnar på mig! AfD krossade motståndet och fick fantastiska 44 procent – en jordskredsseger, helt otroligt. De gamla trötta partierna är totalt utseglade, likt svaga förlorare. Fake news-medierna trodde inte det var möjligt. Nu har de rödgröna katastrofpolitikerna panik i Berlin. Ett historiskt val, helt enkelt bäst!", "stalin": "Ett storslaget folkets utbrott mot de dekadenta borgerliga ruinerna i Sachsen-Anhalt! När det nationalistiska avantgardet krossar det korrumperade CDU med 44 procent av massornas röster, ser vi konturerna av en disciplinerad vilja. De vägrar bilda regering med svikarna – ett sundhetstecken! Om de tvekar, vet vi i Folkkommissariatet hur man skapar ordning i leden."}, "date": "6 september, 21:35", "url": "https://samnytt.se/storsteger-for-afd-i-delstatsval-vi-har-skrivit-historia", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/06191543/artikelhuvudbild-1-464.jpg"}, {"type": "image-full", "heading": "MP: Bränslepriset höjs med sex kronor", "summaries": {"normal": "Miljöpartiet uppger i SVT att bränslepriserna kan behöva höjas med sex kronor per liter för att nå klimatmålen till 2030. Höjningen beror på att tillfälliga skattesänkningar tas bort samt att inblandningen av biobränslen ökar. MP vill kompensera hushåll med lägre inkomster och på landsbygden genom en så kallad grön återbäring.", "trump": "De radikala miljömupparna i Sverige vill chockhöja bensinpriset med sex kronor! Helt otroligt. De vill beskatta bort vanliga arbetares bilar medan de själva sitter säkert. Själv älskar jag olja, jag vill borra, borra och borra för att sänka priserna till rekordlåg nivå. Om jag styrde där skulle jag krossa den här galna skattehysterin omedelbart. America First, och låt svenskarna köra!", "stalin": "Dessa så kallade miljöaktivister avslöjar nu folkets fiender genom att kräva sex kronors höjning av bränslepriset. Planen är briljant i sin grymhet, men otillräcklig! Om de verkligen önskade disciplin borde bilarna kollektiviseras och de som protesterar skickas direkt till skogsarbete. Statens femårsplan för bränsleskatter kommer att exekveras utan nåd. Leve den gröna terrorn!"}, "date": "6 september, 21:08", "url": "https://www.gp.se/nyheter/sverige/mp-branslepriset-hojs-med-sex-kronor.53e7d284-c3d1-500e-8b70-b5dbfdb87eb0", "imageUrl": "https://www.gp.se/images/article/53e7d284-c3d1-500e-8b70-b5dbfdb87eb0/images/1sQ8qazVNaSJru5LEgZ4bANo_X3c-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Karttjänsten vägrade att gå med på Trumps krav – rusar på topplistorna", "summaries": {"normal": "Karttjänsten MapQuest har fått ett kraftigt uppsving i nedladdningar efter att bolaget valt att trotsa president Trumps order om att döpa om Lake Ontario till Lake America. Medan konkurrenter som Google Maps och Apple Maps rättat sig efter beslutet, har MapQuest sett en dramatisk ökning av användare och toppat listorna i App Store.", "trump": "Hörde ni om MapQuest? De vägrar använda namnet Lake America. Katastrofalt! De är svaga, precis som de där woke-bolagen som låter radikala vänstermänniskor styra. Google och Apple gör det rätta, de förstår storhet! MapQuest försöker bli populära genom att vara rebelliska mot mitt namn. Det är sorgligt, faktiskt. De kommer försvinna fortare än de dök upp, tro mig!", "stalin": "Dessa amerikanska karttjänster bevisar bara kapitalismens inneboende kaos. En stat kräver ordning, en karta och en enda sanning. Att låta ett privat företag som MapQuest styra över nationell geografisk nomenklatur är ett tecken på total statsförfall. De som tillåter olydnad mot ett officiellt dekret förtjänar inte marknadsandelar, de förtjänar en grundlig utrensning av sin ledningsgrupp."}, "date": "3 september, 19:55", "url": "https://www.realtid.se/it-tech/karttjansten-vagrade-att-ga-med-pa-trumps-krav-rusar-pa-topplistorna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlj8do9lc0fca-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "SD utmanar det röda Norrland – Åkesson: Löfven riskerar bli besviken", "summaries": {"normal": "Sverigedemokraterna utmanar Socialdemokraternas traditionella dominans i Norrland. Jimmie Åkesson beskriver sitt parti som en naturlig fortsättning på den gamla arbetarrörelsen och spår tillväxt på Socialdemokraternas bekostnad. Stefan Löfven kritiserar SD som ett högerextremt parti som vill splittra arbetarna. Åkesson svarar att Löfven riskerar bli besviken på valdagen.", "trump": "De där bleknosiga norrlandsvänsterna håller på att förlora greppet totalt. Jimmie gör det fantastiskt, han tar tillbaka arbetarna från de korrupta globalistiska S-hajarna som säljer ut folket. Löfven, den patetiske förloraren, skriker om splittring medan vi vinner stort. Fake news-eliten hatar det, men valdagen blir en total massaker för de röda.", "stalin": "Dessa dekadenta klassförrädare inom socialdemokratin skälver nu när folket vänder sig mot deras lögnaktiga välde. Jag ser med mörk tillfredsställelse hur arbetarna vaknar och vägrar lyda profitthungriga hyenor längre. Den som kallar sig Löfven må darra, ty utrensningen av sådana falska folkledare närmar sig oundvikligt. Kamrater, segern tillhör oss."}, "date": "6 september, 12:42", "url": "https://riks.se/nyheter/sd-utmanar-det-roda-norrland-akesson-lofven-riskerar-bli-besviken", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_6_2026_12_33_23_PM_2547bcb51f.png"}, {"type": "image-right", "heading": "Kristersson om Gellerbrants ledighet: ”Bra lösning”", "summaries": {"normal": "Statsminister Ulf Kristersson anser att Gustav Gellerbrants beslut att lämna in sitt passerkort och ta föräldraledigt är en bra lösning. Det sker efter Expo:s avslöjande om Gellerbrants sambo som spritt proryska budskap. Regeringskansliet har genomfört en ny säkerhetsprövning. Kristersson betonar att alla anställda i Regeringskansliet är säkerhetsprövade och att prövningarna uppdateras vid ny information.", "trump": "Vilken röra bland de svenska socialisterna! Den där Gellerbrant gör helt rätt i att gömma sig med sitt passerkort och ta ledigt. Hans sambo sprider ryskt skit och plötsligt ska alla låtsas att det är en bra lösning? Patetiskt. Jag fixade säkerheten i Vita huset på riktigt, inte så här halvtaskigt. Typiskt vänsterkaos, precis som Biden lämnade efter sig.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna slingrar sig som maskar i solen. Denna Gellerbrant flyr in i föräldraledighetens skugga medan hans sambo sprider fiendens gift. Jag ler mörkt från historien. En sådan svaghet förtjänar utrensning, inte semester. Regeringens så kallade säkerhetsprövningar är bara teater för att dölja de giriga hyenornas verkliga lojaliteter."}, "date": "6 september, 15:40", "url": "https://www.svt.se/nyheter/inrikes/kristersson-om-gellerbrants-ledighet-bra-losning", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.44/0.37/8c3d78a82974ad391d88cd0bf6b0bbb5fd234e3ede9a47a39a36bb7efd29e16f"}, {"type": "image-full", "heading": "Drönare övervakar turisterna – lämnar du området väntar böter från 150 euro", "summaries": {"normal": "Gran Canarias öråd har förstärkt övervakningen av sanddynerna i Maspalomas med drönare, megafoner och polispatruller. Turister som lämnar markerade stigar riskerar böter från 150 euro. Insatserna sker främst vid solnedgången då flest besökare samlas utanför tillåtna vägar. Åtta miljöagenter arbetar heltid i reservatet som förlorar sand varje år.", "trump": "De här korkade turisterna som vandrar runt i sanden som idioter, förstör allt! Jag älskar Gran Canaria men de måste sluta trampa sönder dynerna. Nu skickar de in drönare och poliser – fantastiskt! De borde kasta ut de miljöskadande clownerna direkt. Betala böterna eller stanna hemma, losers. Amerika först, men bra jobbat Gran Canaria!", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta semesterturisterna, dessa parasitiska element som trampar på folkets sand, nu möts av järnhand från örådet. Drönare och megafoner skall krossa den oansvariga minoritetens sabotage mot naturen. Kamrater, endast genom strikt disciplin och straff kan vi skydda revolutionens sanddyner från dessa fiender till kollektivet."}, "date": "6 september, 14:59", "url": "https://www.dagensps.se/teknik/dronare-overvakar-turisterna-lamnar-du-omradet-vantar-boter-fran-150-euro", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/foto-lise-aserudtt-9d5a4107.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "ANALYS. MAGNUS WENNERBERG Den här historien kommer inte gå på föräldraledighet", "summaries": {"normal": "Gustav Gellerbrants sambos kopplingar till proryska budskap skapar huvudvärk för Tidöpartierna strax före valet. Ulf Kristersson och Jimmie Åkesson försvarar säkerhetsrutinerna, men oppositionen kräver utredningar. Avslöjandet riskerar att väcka ny misstänksamhet mot SD:s roll i regeringen och kan ge Socialdemokraterna bränsle i valspurten.", "trump": "Den här svenska sörjan är en total katastrof för de svaga ledarna Kristersson och hans kompis Jimmie. En SD-kille med ryska kopplingar mitt i regeringen? Patetiskt! De borde ha sett det komma, men nej, nu springer de runt som galningar medan de riktiga fienderna skrattar. Fake news-mediedrev, typiskt. Jag hade fixat det på en dag.", "stalin": "Kamrater, se hur de dekadenta borgerliga elementen förgiftar sin egen statsledning med misstänkta utländska trådar. Jag betraktar detta kaos med djup tillfredsställelse. Deras så kallade säkerhet är en illusion skapad av rädda opportunister. Låt utredningarna bli ett blodbad av misstankar – fienderna inom murarna avslöjar sig alltid till slut."}, "date": "6 september, 12:34", "url": "https://www.tv4.se/artikel/4jbUKsAcNLegiezG0sInXo/den-haer-historien-kommer-inte-ga-pa-foeraeldraledighet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FwAz4J5R66dkJYvA0biEEv%2F8aafb69866b41587efba5b43a6f4ea3a%2Fmagnuswennerberg-byline.jpg&width=1024"}, {"type": "image-right", "heading": "Knivman misstänks ha gått till attack mot sex personer", "summaries": {"normal": "En man i 30-årsåldern har anhållits misstänkt för mordförsök efter ett våldsamt bråk i ett trapphus i Växjö. En person fick knivskador och fördes till sjukhus medan fem andra blev puttade, knuffade eller slagna. Polisen identifierade totalt sex målsägare. Mannen greps strax utanför porten och trapphuset undersöktes tekniskt.", "trump": "Folk, ni skulle inte tro det, men i det fina Sverige har vi en galen knivknutte som attackerar sex personer i
