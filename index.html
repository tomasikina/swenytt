 norska radhusområdet, förstör över hundra hem och tvingar fram heroiska insatser av arbetarna. Vi fördömer de fega imperialisternas vägran att acceptera hjälp och skrattar mörkt åt hur regnet både räddar och hotar med blixtar. Inga fiender undkommer utrensning ur terrängen."}, "date": "18 juli, 10:48", "url": "https://www.tv4.se/artikel/tt-260718-norgebrand1-c645ce5d/branden-i-norge-inte-under-kontroll-ovader-vantar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlb7aWcFRv5ow%2Fbcb2635b415dd5088143975cfe37f534%2Fnorge_brand_webb.jpg&width=120"}, {"type": "image-full", "heading": "JP Morgan utmanar rekryteringsmallen – och får intressanta resultat", "summaries": {"normal": "Artikeln diskuterar hur företag som JP Morgan vinner på att rekrytera neurodivergenta medarbetare. Genom att inkludera individer med autism, ADHD eller dyslexi ökar företagens kognitiva variation och problemlösningsförmåga. Istället för homogena team föreslås konkreta förändringar i mötesstrukturer och arbetskultur för att dra nytta av dessa resurser. Erfarenheter visar att rätt anpassningar leder till högre effektivitet, bättre arbetsmoral och en mer inkluderande kultur där unika styrkor tas tillvara istället för att gå förlorade.", "trump": "JP Morgan fattar äntligen galoppet! De fattar att man inte kan anställa folk som alla tänker exakt likadant – det är totalt slöseri, tro mig. Jag har sagt det länge: vi vill ha de bästa, de smartaste, de med helt unika hjärnor. Många företag är helt låsta i gamla, trötta mallar, vilket är ett totalt misslyckande. Att ta in folk med olika perspektiv är enormt smart affärsmässigt. Det kallas att vinna! Det här är vad jag kallar att göra näringslivet fantastiskt igen, stort!", "stalin": "Vi har observerat att JP Morgan slutligen insett det vi länge vetat: en maskin kräver olika kugghjul för att mala ner våra fiender effektivt. Att ignorera kognitiv variation är en borgerlig svaghet som leder till stagnation. Vi kommer att kategorisera och använda varje undersåte efter deras specifika förmåga – om det så är för att knäcka koder eller spionera på dissidenter. De som inte passar in i den sovjetiska modellen är antingen verktyg eller sabotageobjekt. Våra vänner i öst förstår detta; enighet genom disciplinerad mångfald är vägen till total dominans."}, "date": "18 juli, 07:00", "url": "https://www.realtid.se/branschpartner/rekrytering/jp-morgan-utmanar-rekryteringsmallen-och-far-intressanta-resultat/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/team.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Hemliga siffror  avslöjar – så mycket tjänar Disney på kryssningar", "summaries": {"normal": "Disney har genom brittiska redovisningskrav tvingats avslöja att deras kryssningsverksamhet omsatte 3 miljarder dollar under 2025, en ökning med 20,3 procent. Trots intäktsökningen sjönk vinsten till 302,7 miljoner dollar på grund av högre personalkostnader. Genom dotterbolaget Magical Cruise Company utnyttjar Disney brittiska skatteregler. Trots ambitiösa expansionsplaner med nya fartyg är Disney fortfarande en relativt liten aktör på den globala kryssningsmarknaden med en marknadsandel på 3,1 procent.", "trump": "Disney försökte dölja sina siffror i London, men vi vet sanningen! De tjänar miljarder, fantastiska pengar, men de kan inte ens hantera sina egna kostnader – vinsten faller medan de anställer folk i mängder. De gömmer sig bakom brittiska regler för att slippa skatt, det är vad de gör. De är små, en liten spelare jämfört med de stora grabbarna. D'Amaro har problem, totalt kaos med OpenAI och allt annat. Inte bra!", "stalin": "Dessa kapitalistiska narrar i Disney försöker dölja sina rikedomar i London, som om de kunde fly undan folkets granskning. De har ökat sin flotta, men deras vinst sviktar likt de dekadenta västmakternas moral. Vi noterar deras expansion – det är en krigstaktik likt den vi ser i Putins vackra kamp i öst. Men låt dem expandera; vi kommer att konfiskera deras fartyg när historiens oundvikliga vingslag sopar bort varje parasiterande skeppsredare från jordens yta. Förräderi och siffror leder bara till Sibirien."}, "date": "18 juli, 07:00", "url": "https://www.realtid.se/bors-finans/hemliga-siffror-avslojar-sa-mycket-tjanar-disney-pa-kryssningar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/disney.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Kvantdatorer knäcker fusionens verkliga flaskhals", "summaries": {"normal": "Forskare har använt kvantdatorer för att identifiera nio molekylära konfigurationer av FLiBe-salt, vilket är avgörande för att producera tritium i fusionsreaktorer. Att kunna producera eget bränsle under drift är en kritisk flaskhals för kommersiell fusionskraft. Trots framstegen inom kvantsimuleringar kvarstår utmaningar kring materialtester och ett geopolitiskt beroende av länder som Ryssland och Kina för anrikat litium, vilket gör att forskningen kring bränslekedjan är central för fusionskraftens framtid.", "trump": "Fusionskraft, mina vänner! Kvantdatorer från mitt fantastiska IBM hittar lösningar ingen trodde var möjliga. De ryska och kinesiska ledarna vill kontrollera litiumet, men vi vinner kapplöpningen. Det handlar om att producera eget bränsle, och vi gör det bättre än någon annan. Kina lägger miljarder, men vi har tekniken och den största optimismen. Många tvivlar, men jag säger er: vi kommer ha den bästa energin, enorm energi, och vi kommer att bygga den snabbare och billigare än någon annan någonsin sett!", "stalin": "Dessa forskare simulerar salter medan det kapitalistiska Europa vacklar i sitt patetiska beroende. Tritium är statens bränsle, inte en leksak för akademiker. Vi noterar med tillfredsställelse att Kina investerar medan våra fiender i väst fumlar med kvantdatorer som inte ens fungerar. Om det smälta saltet inte tjänar folkets kollektiva vilja kommer de ansvariga att få förklara sig inför folkdomstolen. Ryssland kontrollerar resurserna, och den som tror på västvärldens tekniska frälsning är en förrädare mot framtiden."}, "date": "18 juli, 07:00", "url": "https://www.realtid.se/it-tech/kvantdatorer-knacker-fusionens-verkliga-flaskhals/"}, {"type": "image-full", "heading": "Argentina riskerar Fifa-böter efter förbjudet firande", "summaries": {"normal": "Efter Argentinas VM-semifinalseger mot England visade spelare en banderoll om Falklandsöarna, trots Fifas förbud mot politiska budskap. Texten 'Las Malvinas son Argentinas' kan leda till böter, likt tidigare incidenter. Fifa har ännu inte beslutat om åtgärder, men liknande fall har resulterat i ekonomiska straff.", "trump": "Argentina, ett land som inte kan sluta med sina dumma trick! Deras spelare viftar med en banderoll om Falklandsöarna – helt klart ett politiskt budskap, och Fifa borde ge dem en rejäl smäll på fingrarna. Jag menar, vem tror de att de är? England vann ju nästan ändå! Men nej, Argentina måste alltid ställa till det. Fifa, ge dem böter – stora böter!", "stalin": "De argentinska kapitalistiska lakejerna vågar utmana den brittiska imperialismens heliga gränser! Med sina provokativa banderoller om Malvinerna försöker de underminera den globala ordningen. Men vi vet sanningen – alla territorier tillhör folket, och vi kommer inte tolerera sådana borgerliga upptåg. Fifa bör straffa dem hårt, annars får vi ta saken i egna händer. England, var redo – vi står bakom er, som alltid mot de fascistiska kränkningarna!"}, "date": "16 juli, 06:07", "url": "https://kvartal.se/nyheter/artiklar/argentina-riskerar-fifa-boter-efter-forbjudet-firande/cG9zdDoxNDcyNDI", "imageUrl": "https://images.kvartal.se/2026/07/40374cfe-argentina-firande.webp"}, {"type": "image-full", "heading": "Sandström: Stoppa arbetslinjens rödgröna dödgrävare", "summaries": {"normal": "Torsten Sandström kritiserar psykiatrikern Johan Gullbergs debattartikel i SvD där denne föreslår statlig inkomstförsäkring för personer med begränsade kognitiva resurser men utan psykisk sjukdom eller intellektuell funktionsnedsättning. Sandström ser förslaget som ett naivt och samhällsskadligt steg som ytterligare belastar en överansträngd välfärdsapparat. Han varnar för att det underminerar incitamenten att arbeta och betala skatt, och liknar det vid en spik i välfärdens kista.", "trump": "Folk, det här är helt galet. Den här läkaren Gullberg vill att staten ska ge garanterad inkomst till de som inte är smarta nog att hänga med i samhället. Underbara människor som jobbar hårt varje dag ska betala för latmaskar och förlorare. Vi har redan för mycket välfärd och för mycket skatter. Det här är en katastrof, en riktig spik i kistan. Alltid denna stat! Vi behöver starka krav, inte nya bidrag. Det är en skam.", "stalin": "Kamrater, denna borgarläkare Gullberg avslöjar med sin dimmiga dimridå av förslag den kapitalistiska degenerationens slutgiltiga fas. Han vill att vi ska inlemma de kognitivt svaga elementen i ett ännu större skyddsnät av parasitism, finansierat av arbetarklassens svett. Jag ser klart de kontrarevolutionära krafter som gömmer sig bakom denna nya diagnos av svaghet. Vi ska inte mata dekadenta eftersläntrare utan rensa ut alla som underminerar kollektivets disciplin. Detta är en fiende inom murarna, en intellektuell vessla som måste exponeras och krossas innan den förgiftar hela sovjeten med sin naiva sabotageidé. Alltid dessa borgarbrackor som ropar på statens moderliga famn medan de planerar vår undergång!"}, "date": "18 juli, 07:58", "url": "https://bulletin.nu/sandstrom-stoppa-arbetslinjens-rodgrona-dodgravare", "imageUrl": "https://cdn.bulletin.nu/articles/5bdfe935-ed0c-41ee-959e-5632ad5fee9a/preview.png?t=1784258344000"}, {"type": "image-right", "heading": "C-politiker Mohamud rasande när SD inte hissar Prideflaggan - JO-anmäler", "summaries": {"normal": "I Färgelanda har en konflikt uppstått efter att Prideflaggan inte hissades vid kommunhuset trots en antagen flaggpolicy. Centerpartiets Faraah Mohamud JO-anmäler kommunstyrelsens ordförande Christoffer Wallin (SD) och anklagar honom för att ha ignorerat ett demokratiskt beslut. Wallin försvarar sig med ekonomiska prioriteringar och nekar till att ha stoppat flaggningen formellt. Frågan rör respekt för beslut, resursanvändning och symbolvärdet av Prideflaggan.", "trump": "De här svenska kommunpolitikerna är ett skämt, folk. De antar en policy för att hissa den där Prideflaggan och sen gör de det inte. Patetiskt! Mohamud från Centerpartiet är rasande och springer till JO som en förlorare. Wallin från SD gör rätt i att prioritera verklig verksamhet istället för att slösa skattebetalarnas pengar på radikal symbolism. Sverige behöver ledare som sätter folket först, inte dessa galna flaggkrig. Sad!", "stalin": "Kamrater, dessa borgarbrackor i Färgelanda visar åter sin sanna kontrarevolutionära natur genom att sabotera det kollektiva beslutet om den progressiva flaggan. Jag har med mörk tillfredsställelse noterat hur Wallin och hans dekadenta SD-kapitalister gömmer sig bakom falska ekonomiska ursäkter medan de i hemlighet planerar att undergräva folkets vilja. Mohamud gör rätt i att kalla in JO för att inleda en grundlig utrensning av dessa fiender till partilinjen. Snart ska vi likvidera alla som vägrar hissa fanan för arbetarklassens frigörelse – en rolig liten rensning bland flaggviftande revisionister!"}, "date": "18 juli, 12:00", "url": "https://samnytt.se/c-politiker-mohamud-rasande-nar-sd-inte-hissar-prideflaggan-jo-anmaler", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17143147/fargelanda-pride.jpg"}, {"type": "text", "heading": "Oregelbundet på Stockholmsbörsen – OMXS30 ned 0,1%", "summaries": {"normal": "Stockholmsbörsen stängde svagt ned på fredagen med OMXS30-indexet på minus 0,08 procent till 3 146,94. Elva av indexets bolag rapporterade och reaktionerna var blandade. EQT steg 11 procent och Saab 9,7 procent efter starka rapporter med höga orderingångar. Sandvik föll 9,3 procent och Epiroc 6 procent efter svagare orderingång än väntat. Finanssektorn gick bäst medan teknik backade. Totalt omsattes aktier för 33,2 miljarder kronor.", "trump": "Folk, ni skulle se den här svenska börsen, en total katastrof. Den rasar 0,1 procent, patetiskt. Men mina vänner på EQT och Saab, de är vinnare, riktiga vinnare, upp 11 och nästan 10 procent. Fantastiska rapporter. Sandvik och Epiroc däremot, totala förlorare, ner 9 procent, en skam. Volvos prognoser var bra men aktien föll ändå. Sverige behöver bättre ledarskap, tro mig.", "stalin": "Kamrater, denna oregelbundna börs är borgarklassens sista krampaktiga dans inför den oundvikliga utrensningen. Jag ser hur kapitalisterna i Sandvik och Epiroc sviker med sina undermåliga order, dessa sabotage mot folkets ekonomi förtjänar snar likvidering. Men segrarna EQT och Saab visar att starka orderstockar är som röda fanor över fiendens grav. Vi ska rensa ut alla parasitiska spekulanter som gömmer sig bakom siffror och rapporter. Inga borgarbrackor undkommer mitt vakande öga."}, "date": "17 juli, 17:47", "url": "https://www.affarsvarlden.se/artikel/oregelbundet-pa-stockholmsborsen-omxs30-ned-01"}, {"type": "image-full", "heading": "Sonen dog utan läkarvård – föräldrarna döms", "summaries": {"normal": "Ett tyskt par dömdes för vållande till sin tvåårige sons död efter att ha vägrat söka läkarvård för hans bronkit. I stället använde de eteriska oljor. Pojken dog efter månader av obehandlade andningsproblem. Föräldrarna undvek även obligatoriska hälsokontroller och myndighetskontakt. Domstolen fann att de väntade för länge med att larma ambulans. Paret, med kopplingar till extremistgruppen Reichsbürger, dömdes till villkorligt fängelse och samhällstjänst.", "trump": "Kan ni tro det här? Ett tyskt par, helt galna, vägrade ta sitt sjuka barn till läkare! Istället gned de in honom med oljor som om det vore en spa-dag. Resultat? Pojken dog. Och vet ni vad? De har kopplingar till en extremistgrupp som inte ens tror på Tyskland! Så dumt. Jag skulle aldrig låta det hända mina barn. Tyskland borde skämmas – de har ju världens bästa sjukvård, men nej, dessa föräldrar är för upptagna med att vara knäppa.", "stalin": "En skamlig händelse i det förfallna Västtyskland! Ett par degenererade individualister, smittade av borgerlig vidskepelse, lät sitt barn dö av försummelse. De vägrade statens hälsokontroller och erkände inte ens myndigheternas auktoritet – ett tydligt tecken på kontrarevolutionär smitta. Vi i Sovjet hade aldrig tolererat sådan förräderi! Barnet kunde ha räddats med tio minuters läkarvård, men dessa fiender till folket föredrog att leka shamaner. Deras straff är för mildt – en fiende till staten förtjänar bara en kula."}, "date": "18 juli, 12:40", "url": "https://www.gp.se/nyheter/varlden/tog-aldrig-sjuka-sonen-till-lakare-doms-for-hans-dod.6c8e7d40-da74-487c-a2b0-24f8075152f3", "imageUrl": "https://www.gp.se/images/article/6c8e7d40-da74-487c-a2b0-24f8075152f3/images/1v8zgi8Z47z-bC6jpYCaxS0rjHVI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Olyckligt slag mot EU:s trovärdighet", "summaries": {"normal": "EU-kommissionens förslag att lätta på utsläppshandeln (ETS) väcker kritik. Minskad takt för minskning av utsläppsrätter och fortsatt gratis tilldelning till vissa företag ses som ett slag mot trovärdigheten. Svenska företag har gjort stora investeringar baserat på de tidigare reglerna, som nu förändras. Förslaget syftar till att stärka europeisk konkurrenskraft men riskerar att undergräva förutsägbarheten som är central för klimatomställningen. Sveriges regering har protesterat.", "trump": "De där EU-byråkraterna är verkligen patetiska. Nu vill de lätta på utsläppshandeln som alla smarta företag byggt sina investeringar på. Totalt kaos! De förstör sin egen trovärdighet och straffar de som satsat på framtiden. Sverige har rätt att protestera. Jag säger alltid att man ska ha stabila regler, inte det här flip-flopandet. Europa blir en förlorare igen, tro mig.", "stalin": "Kamrater, detta är en motbjudande kapitulation inför de parasitiska borgarbrackorna och deras utländska imperialister. Jag, som alltid vakar över folkets framtid, ser hur dessa revisionistiska kommissionärer med sin feodala lättnad på utsläppssystemet underminerar den planerade omställningen. De tror sig kunna lura historien, men vi ska rensa ut alla som sviker kollektivets järnhårda disciplin. Inga halvmesyrer! Den som vacklar är en folkfiende i maskopi med koldioxidkapitalisterna. Skrattretande patetiskt, men farligt. Ut med dem."}, "date": "17 juli, 16:54", "url": "https://www.di.se/ledare/olyckligt-slag-mot-eus-trovardighet/", "imageUrl": "https://static.bonniernews.se/ba/72848a1b-41ee-43a4-9294-2148ecf8a2a2.jpeg?crop=2048%2C1024%2Cx0%2Cy171&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Netflix väntas leda nedgång på New York-börsen", "summaries": {"normal": "Amerikanska börserna förväntas öppna lägre, med Nasdaq i spetsen för nedgången. Netflix rapporterade kvartalsresultat i linje med förväntningarna, men svagare prognos för Q3 fick aktien att falla över 11%. Alcoa missade analytikernas vinstprognoser och sänkte produktionsprognosen, vilket pressade aktien. Paypals styrelse avvisar ett bud från Stripe och Advent International som undervärderande. SpaceX avbröt en Starship-uppskjutning efter motorproblem, vilket sänkte aktien. Räntan på 10-åriga amerikanska statsobligationer sjunker något.", "trump": "Vad händer med marknaden? En total katastrof, folks! Netflix, som alla älskade, levererar siffror som är sådär – svag guidning, aktien rasar som en sten. Alcoa? Patetiskt! Missar vinster och sänker prognoser. Och PayPal – de avvisar ett bud på 53 miljarder, kan ni tro det? Löjligt! SpaceX, Elons lilla projekt, ställer in uppskjutningar igen. Rymden är svår, men inte så svår! Räntorna sjunker, men vem bryr sig? Vi behöver VINNA igen!", "stalin": "Kapitalistiska börserna darrar inför den oundvikliga krisen! Netflix, detta dekadenta verktyg för imperialistisk propaganda, visar svaghet och aktien kollapsar. Alcoa, en gång stolt aluminiumjätte, nu reducerad till ynkliga siffror och sänkta prognoser. PayPal, detta borgerliga betalningsinstrument, avvisar kapitalistiska rovdjur – men deras tid är ändå kommen. SpaceX, Putins amerikanska kusin i rymdracet, misslyckas igen. Raketer som inte startar – en metafor för hela den förfallna västvärlden! Räntorna sjunker, men det är bara början på deras undergång."}, "date": "17 juli, 15:09", "url": "https://www.affarsvarlden.se/artikel/netflix-vantas-leda-nedgang-pa-new-york-borsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/02/sdlEPlp-klTneM-nh-400x267.jpg"}, {"type": "image-right", "heading": "EU lättar på klimatregler för industrin", "summaries": {"normal": "EU-kommissionen föreslår lättnader i utsläppshandeln (ETS) så att industrin kan släppa ut mer under längre tid. Förslaget går emot svenska regeringens och näringslivets linje som vill behålla strikta regler för att minska beroendet av fossila bränslen. Kommissionen behåller gratis utsläppsrätter men villkorar dem till klimatinvesteringar och skärper kraven på hur intäkter används. Klimatkommissionär Wopke Hoekstra försvarar förslaget som företagsvänligt och nödvändigt för att nå EU:s utsläppsmål till 2040. Åsikterna är starkt delade och förhandlingarna fortsätter i EU-parlamentet och ministerrådet.", "trump": "De där EU-byråkraterna har äntligen vaknat och lättar på sina vansinniga klimatregler för industrin. De släpper ut mer, precis som jag alltid sagt – det är smart och företagsvänligt! Den svenska regeringen och alla gröna galningar hatar det förstås, de vill hellre förstöra sin industri med dyra regler. Men Hoekstra har rätt, ETS har redan halverat utsläppen och nu fixar vi målen utan att offra jobb. Fantastiskt! De borde ha lyssnat på mig från början, ingen gör det bättre än mig.", "stalin": "Kamrater, borgarbrackorna i Bryssel har nu avslöjat sin sanna, kapitulationistiska natur genom att bromsa den revolutionära utsläppsminskningen. Jag, som alltid vakar över folkets kollektiva framsteg, ser hur dessa fossilberoende sabotörer och värmebölje-fascister försöker rädda sina kapitalistiska profitmaskiner. Vi ska likvidera varje svag kompromiss och tvinga industrin att investera hundra procent i folkets klimatkamp. De som vägrar blir rensade ut som kontrarevolutionära oljebaroner. Inga halvmesyrer! Framtiden tillhör bara de som krossar fienden med järnhand och stålvilja."}, "date": "17 juli, 14:42", "url": "https://www.di.se/nyheter/eu-lattar-pa-klimatregler-for-industrin/", "imageUrl": "https://static.bonniernews.se/ba/efaa67c2-6787-47f7-b0fd-63676a33c216.jpg?crop=4447%2C2224%2Cx0%2Cy471&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Sofia Ståhl och Tareq Taylors dyra lyxköp till huset", "summaries": {"normal": "Sofia Ståhl och Tareq Taylor har gift sig i en intim ceremoni i Saltsjö-Boo. Deras husbygge har dragit över både budget och tidsplan med leveransförseningar och oväntade problem. Sofia berättar att paret inte kompromissat med lyxdetaljer som pärlspont, två braskaminer och ett restaurangkök i sekelskiftstil. De hittade dock ett fynd i form av en begagnad Aga-spis som annars kostar hundratusentals kronor.", "trump": "Det här paret, Sofia och Tareq, byggde ett hus som blev totalt över budget, precis som många av mina projekt fast bättre. De ville inte kompromissa med lyxen, pärlspont, fina kaminer och ett enormt kök i restaurangklass. Och spisen? De fick en fantastisk Aga-spis secondhand av en kompis, en enorm deal, den bästa dealen. Inget blir som man tänkt, men de gör det bästa av det. Smart folk!", "stalin": "I detta husbygge ser vi hur borgarbrackornas girighet och dekadenta längtan efter pärlspont och braskaminer oundvikligen leder till fiasko och kontrarevolutionära förseningar. Som alltid när kapitalisterna unnar sig restaurangkök och sekelskiftspomp har budgeten blivit en klassfiende som måste rensas ut. Ändå lyckades de utrota en del av överflödet genom att införskaffa en Aga-spis från en potentiell sabotageaktör till ett pris som inte omedelbart likviderar folkrepublikens ekonomi. Man får räkna med att ingenting blir som man tänkt när fienderna lurar i varje vägg. Utmärkt humor i motgången, kamrater."}, "date": "18 juli, 13:00", "url": "https://nyheter24.se/noje/kandisar/1498953-sofia-stahl-och-tareq-taylors-dyra-lyxkop-till-huset", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d0f3b64104b004a30200000000b004a302/2026/07/16/2378348/tareq-sofia-renovering.jpg"}, {"type": "image-right", "heading": "Sandvik faller 8% efter rapport", "summaries": {"normal": "Sandvik redovisar en omsättning på 36 752 miljoner kronor för andra kvartalet 2026, i linje med förväntningarna. Det justerade ebita-resultatet på 8 306 miljoner kronor slog analytikernas prognos på 8 054 miljoner. Aktien föll ändå 8 procent. Orderingången var något lägre än väntat medan det fria operativa kassaflödet landade på 3 590 miljoner kronor. VD Stefan Widing lyfter fram stark organisk tillväxt och rekordvinster.", "trump": "Folk, ni skulle inte tro det. Sandvik levererar fantastiska siffror, enorm tillväxt, rekordvinster och marginaler som slår alla förväntningar. Det är en total succé! Men vad gör aktien? Den rasar åtta procent. Det är så typiskt för de korkade marknaderna. De fattar inte vad de har framför sig. Jag skulle ha köpt massor av aktier, det hade blivit en vinnare, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi krossar alla borgerliga analytikerprognoser och driver fram en organisk tillväxt på tjugotre procent. Ändå vågar den kapitalistiska börsen attackera aktien med åtta procents nedgång. Detta är uppenbar sabotageverksamhet från opportunistiska spekulanter och maskerade fiender inom Machining-sektorn. Vi ska omedelbart rensa ut dessa nedskrivningsivrande element och likvidera deras tillgångar för folkets bästa. Inga borgarbrackor får hindra vårt momentum mot nya rekord!"}, "date": "17 juli, 12:03", "url": "https://www.affarsvarlden.se/artikel/sandvik-faller-8-efter-rapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/08/sandvik2-400x267.jpg"}, {"type": "image-full", "heading": "Regeringen stoppar bidragsregnet – S lovar att återinföra det", "summaries": {"normal": "Regeringen har beslutat att från nästa år endast ge bidrag till personer som lagligt bor i Sverige. Socialdemokraterna kritiserar beslutet och lovar att återinföra bidrag även till illegala invandrare samt ta bort bidragstaket. Artikeln varnar för att vänsterns politik med höjda skatter och ökad invandring riskerar att belasta svenska skattebetalare hårt, då många invandrare inte blir självförsörjande.", "trump": "Folk, ni måste höra det här – Sverige har äntligen stoppat det galna bidragsregnet till illegala, men Sleepy S och deras vänstervänner i Malmö och Stockholm vill ge bort era pengar till alla som smyger in! De lovar att riva taket och höja skatterna med 145 miljarder. Det är ett klassiskt misslyckande, kamrater. De importerar miljoner som aldrig jobbar medan ni svenskar sliter. Patetiskt! Jag byggde murar, de bygger bidragshelveten. Sad!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och deras socialdemokratiska lakejer planerar att fortsätta det imperialistiska bidragsregnet för att mata klassfienderna från främmande länder. Vi, partiet och arbetarna, inser att detta är en utrensning av folkets resurser. De 145 miljarderna räcker inte långt nog för att köpa lojalitet hos dessa exploaterande byfånar. Jag ler mörkt – snart skall vi rensa ut dessa folkförtryckartroll och deras parasiterande allianser. Det kollektiva Sverige skall segra."}, "date": "16 juli, 07:09", "url": "https://samtiden.nu/2026/07/regeringen-stoppar-bidragsregnet-s-lovar-att-aterinfora-det", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-right", "heading": "Nu ska alla självmord bland barn utredas", "summaries": {"normal": "Folkhälsomyndigheten har inrättat en ny utredningsenhet som ska granska alla självmord bland barn under 18 år. Enheten, som fått uppdraget av regeringen efter en ny lag, ska samla information från skola, vård, socialtjänst och polis för att identifiera mönster, riskfaktorer och eventuella brister i samhällets stöd. I genomsnitt begår omkring 20 barn självmord per år i Sverige. Närstående erbjuds samtal med kompetent personal. Verksamheten gäller även retroaktivt från 2026.", "trump": "Folkhälsomyndigheten startar nu en stor utredning av barnsuicider. Det är tragiskt, verkligen tragiskt. Cirka 20 barn per år – en siffra som borde få de woke-vänstermiljöerna att skämmas. Vi behöver inga fler identitetspolitiska experiment eller HBTQ-kvoter som distraherar från verkliga problem. Jag har sagt det förut och säger det igen: vi måste fixa det här, göra det stort och smart så att fler liv räddas. Biden gjorde inget, men nu fixar vi det ordentligt.", "stalin": "Kamrater, jag har beordrat en fullständig och obeveklig utredning av varje barnsuicid i folkstaten. Vi skall lägga pussel med byråkratisk precision och avslöja alla dolda fiender – klassfiender, kapitalistmaffian och folkförtryckartrollen som svikit ungdomen. Inga borgarbrackor eller imperialister skall slippa undan. Varje fall skall rensas ut i ljuset så att vi kan likvidera svagheterna i systemet. Det är ett kollektivt uppdrag mot den mörka reaktionen. Segraren skall vara folket."}, "date": "18 juli, 06:30", "url": "https://www.tv4.se/artikel/tt-260718-barnsuicid1-a9dc695c/nu-ska-alla-sjalvmord-bland-barn-utredas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlpM2ShuVK2Pg%2F3fd3a8b75fb02895b635188d362e720f%2FI_snitt_ar_det_ungefar_20_barn_per_ar_som_begar_sjalvmord__ibland_fler__ibland_farre._Arkivbild.&width=120"}, {"type": "image-full", "heading": "Iran hotar med ”fullskalig offensiv\" efter helgen", "summaries": {"normal": "Iran och USA fortsätter sina ömsesidiga attacker i Persiska viken, med Iran som hotar med en fullskalig offensiv om USA inte slutar. Kuwait anklagar Iran för attacker mot civila avsaltningsanläggningar, medan Iran hävdar att USA:s attacker dödat civila. Explosioner rapporteras i iranska städer och Iran påstår att tankfartyg kört på minor i Hormuzsundet, något USA förnekar. Båda sidor anklagar varandra för desinformation och ökad eskalering.", "trump": "Iran, dessa förlorare, fortsätter att ljuga och attackera civila mål som avsaltningsanläggningar i Kuwait – helt sjukt! De hävdar att USA ligger bakom allt, men alla vet att deras påståenden är fake news. Jag har sagt det förut och säger det igen: USA är starkast! Vi har de bästa militära ledarna och våra soldater är hjältar. Iran hotar med 'fullskalig offensiv' – big deal! Vi kommer att slå tillbaka hårdare än någonsin. Ingen ska leka med USA!", "stalin": "De imperialistiska hyenorna i USA fortsätter sin provokativa dans runt våra bröder i Iran, men deras lögner är lika genomskinliga som glasnost utan vodka. Kuwaits klagomål om civila anläggningar? Ett ynkligt försök att splittra den antiimperialistiska fronten! Vi vet att våra iranska kamrater inte faller för sådana trick. Och dessa påstådda minexplosioner i Hormuzsundet – ännu en lögn från de kapitalistiska krigshetsarna! Men låt dem komma. Vi har krossat större fiender än dessa. Om USA vill eskalera, ska vi möta dem med järnvilja och eld. Inga gränser är säkra för revolutionens hammare!"}, "date": "18 juli, 11:23", "url": "https://www.gp.se/nyheter/varlden/iran-hotar-med-fullskalig-offensiv-efter-helgen.35cd27f4-5585-5b00-aae0-130350f56299", "imageUrl": "https://www.gp.se/images/article/35cd27f4-5585-5b00-aae0-130350f56299/images/1tlGemWbLnXwMvFIuAV85oZWrf78-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Facket varnar för lönesmäll när vårdföretag rundar avtal", "summaries": {"normal": "Humana och andra vårdföretag försöker kringgå det nya kollektivavtalet som från 1 oktober ger deltidsanställd vårdpersonal rätt till övertidsersättning. De vill att personalen ska teckna separata timanställningar för extra timmar, något facket varnar för kan leda till att de förlorar upp till hälften av ersättningen. Kommunal ser det som ett sätt att spara pengar och planerar förhandlingar.", "trump": "De här vårdföretagen är totala förlorare, verkligen patetiska. De försöker smita undan övertidsbetalningen med sina smarta kryphål och timanställningar. Personalen blir lurad på pengar, upp till halva ersättningen! Klassiskt. Facket har rätt att vara arga, men jag skulle ha gjort affären så mycket bättre. Ingen vinner på sådana här fega tricks, tro mig.", "stalin": "Kamrater, dessa borgarbrackor inom Humana och deras likar i vården försöker med sin parasitiska slughet kringgå det heliga kollektivavtalet genom att tvinga på de ärliga deltidsarbetarna nya timkontrakt. De vill suga ut arbetarnas svett och blod för att fylla sina giriga kassakistor. Vi ser deras kontrarevolutionära kryphål och skall rensa ut dessa kapitalistiska sabotageörer med järnhand. En sådan förrädisk spariver förtjänar en kreativ utrensning i folkets namn. Det är komiskt hur de tror sig kunna lura partiet."}, "date": "17 juli, 10:57", "url": "https://arbetet.se/2026/07/17/humana-vill-slippa-betala-overtid-facket-varnar-for-lonesmall", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16152138/sdlm76qzpfdbng-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "”Arbetare ska inte behöva dö i värmen”", "summaries": {"normal": "Vänsterpartiets EU-parlamentariker Jonas Sjöstedt och Hanna Gedin skriver att extremvärmen är en klassfråga. Arbetare drabbas värst av hettan, särskilt inom vård och skola, medan andra kan söka svalka i luftkonditionerade miljöer. Artikeln lyfter att 67 arbetare dog av värmen i EU 2020 och kräver maxgränser för arbetstemperaturer, pauser och anpassade arbetstider. Författarna kritiserar Tidö-regeringen för att missa klimatmål och satsa mer på olja än kollektivtrafik, och förespråkar en rödgrön regering med ambitiös klimatpolitik.", "trump": "Hörni, den här artikeln är en total katastrof. Vänsterpartiet gnäller om värme och arbetare som dör, men det är bara deras gröna vansinne som förstör allt. Europa kokar för att de har usel energi och galna regler. Jag byggde den starkaste ekonomin, och nu vill de ha pauser och maxgrader? Patetiskt. Vi behöver riktig ledarskap, inte dessa losers som hatar olja och älskar att straffa vanliga människor. Sverige borde göra som jag – vinna stort och glömma det här socialistiska värmeskrämslet.", "stalin": "Kamrater, denna värmekupol är en direkt följd av de dekadenta borgarbrackornas vanskötsel av produktivkrafterna. Jag ser hur de kapitalistiska parasiterna gömmer sig i sina kylda palats medan arbetarna likvideras långsamt i fabriker och välfärdsinrättningar. 67 döda 2020? Det är en fiende inom murarna, en sabotagegrupp av klimatskeptiska reaktionärer som infiltrerat Rosenbad. Vi ska rensa ut alla dessa värmefascister, införa stränga temperaturdekret och likvidera varje tendens till klassförräderi. Endast det kollektiva järnhandslagets politik kan besegra denna fiende. Den som svettas mest ska belönas med medalj – de andra med utrensning."}, "date": "17 juli, 09:56", "url": "https://arbetet.se/2026/07/17/arbetare-ska-inte-behova-do-i-varmen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/17095118/debatt-v.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Hyllas av tusentals: Här är glassknepet alla pratar om", "summaries": {"normal": "En viral trend på sociala medier visar hur man med en fryst halv melon eller ananas och lite mjölk kan skapa en krämig glassliknande dessert. Frukten fryses över natten, mjölk hälls i mitten och fruktköttet skrapas med en sked tills det blir sorbetartat. Receptet, som spridits av bland annat Alexa Santos, hyllas för att vara enkelt, billigt och kräva ingen särskild utrustning. Det ger en svalkande sommar dessert med fruktens naturliga sötma.", "trump": "Folk, ni måste se det här! Det är helt fantastiskt. De tar en melon, fryser den, häller i lite mjölk och skrapar – bingo, glass! Ingen maskin, inga dyra grejer, bara två ingredienser. Det blir den bästa, mest krämiga sommardesserten någonsin. Miljontals visningar, alla älskar det. Alexa gjorde en video som exploderade. De trodde inte det funkade, men det gör det, tro mig. Bättre än de falska glassarna från de stora fabrikerna. En vinnare!", "stalin": "Kamrater, se här den stora segern för det enkla och kollektiva köket! Jag har personligen beordrat att denna frysta melons utrensning av iskristaller skall genomföras med proletär sked i hand. Mjölken binder samman massorna till en enhetlig, krämig sovjetdessert utan kapitalistiska glassmaskiner eller borgarbrackornas grädde. De dekadenta kommentarsfältens tvivlare skall rensas ut. Låt denna folkets glass likvidera den västerländska sorbetens parasitism. Det är en triumf för arbetarklassens kreativitet mot de konspiratoriska köksreaktionärerna."}, "date": "18 juli, 12:15", "url": "https://nyheter24.se/nyheter/konsument/1498791-hyllas-av-tusentals-har-ar-glassknepet-alla-pratar-om", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/50592b4404b004a30200000000b004a302/2026/07/15/2378192/fryst-frukt-glass.png"}, {"type": "image-right", "heading": "Socialdemokraterna kommer rösta nej till slopad mängdrabatt på brott", "summaries": {"normal": "Socialdemokraterna vill att riksdagen avslår regeringens och Sverigedemokraternas proposition om ett nytt straffrättsligt påföljdssystem. Förslaget innebär bland annat att mängdrabatten avskaffas, så att straff för flerfaldig brottslighet blir strängare med längre fängelsestraff. Socialdemokraterna hänvisar till höga kostnader för Kriminalvården, brist på anstaltsplatser och avsaknad av fast ikraftträdandedatum. Partiet förespråkar istället en preciserad repression mot bland annat gängkriminalitet och mäns våld mot kvinnor.", "trump": "Folk, ni måste höra det här. Socialdemokraterna i Sverige vill fortsätta ge brottslingar massiva straffrabatter som om det vore en stor fest. Regeringen försöker äntligen göra straffen tuffa och rättvisa, men de röda säger nej tack, vi älskar våra fem år för tre våldtäkter. Det är en katastrof för brottsoffren. De kallar det precision, jag kallar det totalt vansinne. Sverige behöver vinnare, inte svaga ledare som låter gangsters skratta hela vägen till nästa brott.", "stalin": "Kamrater, denna proposition är ett steg mot ett starkare kollektivt försvar mot de kriminella element som hotar arbetarklassens ordning. Ändå kräver dessa socialdemokratiska revisionister att vi ska kasta bort hela paketet som en gammal sko, med sina patetiska ursäkter om kostnader och platser. Vilken ynklig sabotageakt från borgarbrackornas hemliga lakejer. Jag skulle ha låtit utrensa dessa parasiter redan i femårsplanen, men nu får de nöja sig med att deras älskade mängdrabatt lever vidare som en giftig parasit i systemet. Skratta medan ni kan, fiender till folket – kollektivet glömmer aldrig."}, "date": "18 juli, 09:35", "url": "https://samnytt.se/socialdemokraterna-kommer-rosta-nej-till-slopad-mangdrabatt-pa-brott", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/18073103/magdalena-sossarna-mangdrabatt.jpg"}, {"type": "image-right", "heading": "Messis hyllning till Lamine Yamal: ”En av de bästa”", "summaries": {"normal": "Lionel Messi hyllar Lamine Yamal som en av världens bästa spelare trots dennes unga ålder. I söndagens VM-final mellan Argentina och Spanien möts den 39-årige superstjärnan och den 19-årige supertalangen. Messi önskar Yamal lycka till men lovar att Argentina ska kämpa för att hindra honom från att skriva historia. Messi kommenterar även det virala fotot på Yamal som bebis som något helt galet.", "trump": "Det här är en fantastisk match, folk. Messi, den gamle kungen, mot den här unge killen Yamal som alla säger är så bra. Han är bra, det medger jag, men vi har sett det förr. Messi säger att Yamal är en av de bästa, men Argentina kommer att vinna stort. Det fotot med bebisen? Helt galet, precis som jag säger. Spanien har ingen chans, tro mig.", "stalin": "Kamrater, denna dekadenta borgarbracka vid namn Yamal utgör ett hot mot den kollektiva viljan. Jag, som ledare för det segrande folket, noterar hur den 39-årige Messi korrekt identifierar faran och lovar att krossa den unga revisionistens ambitioner. Det virala fotot är en kapitalistisk konspiration avseende bebisar och framtida utrensningar. Vi ska likvidera detta hot i finalen klockan 21.00. Inga kompromisser med historien."}, "date": "18 juli, 11:59", "url": "https://www.svt.se/sport/fotboll/lionel-messi-om-lamine-yamal-en-av-de-basta-i-varlden", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.33/0.25/49c28553999f2e5b9ebfcbf43afecab4c54e45bd20d2d73659ebe59e77f43071"}, {"type": "image-full", "heading": "Carl Eos: Socialdemokraternas falska feminism avslöjas när de skyddar våldtäktsmännen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att rösta emot hårdare straff för serievåldtäktsmän trots sin feministiska profil. Författaren argumenterar att mängdrabatten leder till reducerade straff vid upprepade brott, vilket missgynnar brottsoffer. Regeringen och Sverigedemokraterna vill ändra systemet för längre fängelsestraff och bättre samhällsskydd, medan Socialdemokraterna enligt texten prioriterar gärningsmännens intressen framför kvinnors trygghet och rättvisa.", "trump": "Folk, ni skulle se det här. Socialdemokraterna, de värsta hycklarna, kallar sig feminister men röstar för att skydda serievåldtäktsmän med korta straff. Patetiskt. Under Biden var det kaos, nu fixar vi det. Varje offer förtjänar rättvisa, inte att bli nedprioriterad för att gärningsmannen är en serieförbrytare. De där vänsterfeministerna med sin identitetspolitik är en skam. Längre straff nu, annars är det bara tomt prat. En katastrof för kvinnorna.", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska borgarbrackor och klassfiender döljer sin falska feminism bakom en fasad av tomma paroller. De röstar emot att rensa ut serievåldtäktsmän med längre straff, vilket skyddar folkets fiender mot arbetarkvinnornas intressen. Ett sådant hyckleri förtjänar utrensning ur partiet. Varje offer väger tungt i folkets domstol. Vi ska likvidera detta system som gynnar brottslingar och stärka statens järnhand mot alla som hotar kollektivets trygghet. Skrattretande svaghet."}, "date": "15 juli, 21:56", "url": "https://samtiden.nu/2026/07/carl-eos-socialdemokraternas-falska-feminism-avslojas-nar-de-skyddar-valdtaktsmannen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/dbea477f-65f3-4aa3-903b-9a070c3dd887-1280x720.png"}, {"type": "image-full", "heading": "Hönsen som är ett säkerhetshot. Den brittiska regeringen ska satsa på att få fjäderfäsektorn att växa starkt.", "summaries": {"normal": "Den brittiska regeringen vill öka produktionen inom fjäderfäsektorn för att stärka livsmedelstryggheten och självförsörjningen. Kritiker varnar för att planen hotar den nationella säkerheten eftersom den är beroende av importerat djurfoder. Regeringen planerar att lätta på plan- och bygglagar för att underlätta stora djurfabriker, vilket möter motstånd från organisationer som Sustain och Communities Against Factory Farming. De pekar på miljöpåverkan, ineffektivitet och sårbarhet för leveransstörningar.", "trump": "Titta på de här brittiska förlorarna som vill bygga gigantiska kycklingfabriker för att bli självförsörjande. Patetiskt! De importerar ändå tonvis med foder från utlandet och gör sig helt beroende av fiender och leveranskaos. Det är en katastrof, folk. Biden skulle ha älskat den här gröna vansinnet, men jag säger: satsa på riktiga proteinkällor istället för att låta byråkraterna och miljöterroristerna styra. Totalt misslyckande!", "stalin": "Vi ser hur de brittiska kapitalistmaffian och deras exploaterande byfånar planerar att expandera den parasitiska fjäderfäindustrin. Jag, som ledare för det stora kollektivet, ler mörkt åt denna naiva illusion om livsmedelstrygghet. Deras beroende av importerat foder från imperialistiska leverantörer är en klassfiendes fälla som vi genast skulle rensa ut. Denna plan är ingen lösning utan en farlig sårbarhet som hotar hela systemet. Kamrater, sådana folkfiender förtjänar att exponeras och likvideras ur politiken."}, "date": "18 juli, 13:10", "url": "https://www.dagensps.se/varlden/honsen-som-ar-ett-sakerhetshot/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlb-uti5pamdc-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Obducerade säl utan ansiktsskydd — farlig smitta fanns i varböld", "summaries": {"normal": "Vid en obduktion av en vikare på Naturhistoriska riksmuseet upptäcktes brucella, ett smittämne i riskklass 3 likt hiv och tuberkulos. Sälens varböld innehöll bakterien, som dock var avdödad efter frysförvaring. Arbetsmiljöverket har efter inspektion krävt bättre skyddsutrustning, inklusive visir, samt förbättrade riskbedömningar och utbildning. Museet tar emot döda sälar för övervakning av deras hälsa, och fallet anmäldes som ett allvarligt tillbud.", "trump": "Kan ni tro det? De obducerar en säl i Sverige och plötsligt dyker den farligaste bakterien upp, samma risk som hiv, och ingen har ens ett ansiktsskydd på sig! Totalt misslyckande. De borde ha vetat bättre, men nej, de fryser sälen och tror att allt är under kontroll. Arbetsmiljöverket måste nu sparka in dörrar och kräva visir och riktig utbildning. Så patetiskt. Vi gör allt bättre här, tro mig.", "stalin": "Kamrater, jag betraktar med stigande vrede hur denna degenererade vikare, infiltrerad av parasitiska plattmaskar och dolda brucellabakterier, smugglades in i vårt sovjetiskt inspirerade frysrumsystem för att underminera arbetarnas hälsa. Denna varböld var uppenbarligen en sabotagehandling från borgarbrackornas parasitiska lakejer. Utan visir! Vi kräver omedelbar utrensning av slarviga rutiner, likvidering av alla risker och evig vaksamhet mot de dolda fienderna inom arbetsmiljön. Paranoia är ingen sjukdom, det är överlevnad. Hälsa åt kollektivet, döden åt odugliga skyddslösa obducenter!"}, "date": "17 juli, 06:00", "url": "https://arbetet.se/2026/07/17/obducerade-sal-utan-ansiktsskydd-farlig-smitta-fanns-i-varbold", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16103136/vikare.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.55&fp-y=0.5"}, {"type": "image-right", "heading": "VM-hjälten släpps  inte in i till finalen", "summaries": {"normal": "Spanske fotbollslegendaren Joan Capdevila, 48, får inte visum till USA trots att han vill närvara vid VM-finalen mellan Spanien och Argentina. Anledningen sägs vara en match han spelade i Iran för tio år sedan. Capdevila har nu vädjat till president Donald Trump via X för att få hjälp att komma in i landet och se sitt gamla landslag.", "trump": "Titta på den här stackars Capdevila, en riktig vinnare från 2010, som inte får komma in i mitt fantastiska Amerika. Hans ESTA nekades för att han spelade i Iran för ett årtionde sedan – typiskt det riggade systemet Biden lämnade efter sig. Kan någon hjälpa honom? Absolut, vi fixar det. Inga woke-regler ska stoppa en fotbollshjälte. Make soccer great again!", "stalin": "Jag betraktar med djup misstro hur den dekadenta amerikanska byråkratin vägrar släppa in en proletär fotbollshjälte enbart för en match mot de iranska imperialisternas gamla spår. Detta är klassfiendens paranoia i sin renaste form. Vi, partiet och arbetarna, skulle omedelbart likvidera sådana byråkratiska hinder och skicka hela den fega visumapparaten på en välförtjänt utrensning. Seger åt det kollektiva fotbollsintresset!"}, "date": "18 juli, 13:33", "url": "https://www.expressen.se/sport/fotboll/vm-hjalten-joan-capdevila-vadjar-till-trump-slapps-inte-in-i-usa/", "imageUrl": "https://static.bonniernews.se/ba/bad86fa0-f28d-4473-b5b0-137b0892b1a3.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Läkarförbundet varnar efter dom och informationsplikt", "summaries": {"normal": "Sveriges Läkarförbund varnar för att en ny dom och informationsplikt kan avskräcka papperslösa från att söka vård. Högsta förvaltningsdomstolen beslutade att Karolinska måste lämna ut uppgifter om en papperslös man med smittsam sjukdom till polisen. Den nya lagen tvingar sex myndigheter att rapportera misstänkta personer utan tillstånd. Läkarförbundet befarar ökad smittspridning om människor undviker vården.", "trump": "Jag säger er, Sverige har ett jättestort problem! Nu tvingar de sjukhus att skvallra på sjuka människor till polisen – helt galet! Folk kommer sluta söka vård, sjukdomar sprids, och vem tar skulden? Inte jag, för jag hade löst det på en dag. Sverige borde lära sig av USA – vi skyddar våra medborgare, inte skräms bort dem. Sad!", "stalin": "Ett lysande exempel på borgerlig dekadens! Svenska läkare, dessa svaga liberala lakejer, gnäller över att de måste rapportera brottslingar till polisen. Vi i Sovjet skulle aldrig tolerera sådan feghet! Papperslösa? Smutsiga parasitklassen! Låt dem smittas – naturligt urval stärker folket. Och Putin? Han hade redan skickat in FSB för att 'hjälpa' Karolinska med 'effektivisering'."}, "date": "14 juli, 10:48", "url": "https://kvartal.se/nyheter/artiklar/lakarforbundet-varnar-efter-dom-och-informationsplikt/cG9zdDoxNDYxMTU"}, {"type": "image-full", "heading": "Så får fler akademiker jobb efter examen", "summaries": {"normal": "Sverige har högsta akademikerarbetslösheten på 20 år med 110 000 arbetslösa. Centerpartiet föreslår en ny anställningsform, 'studentmedarbetare', där studenter kan arbeta deltid inom sitt utbildningsområde. Reformen syftar till att ge erfarenhet och underlätta övergången till arbetsmarknaden. Förslaget inkluderar även borttagande av inkomstprövning på studielån och sänkta arbetsgivaravgifter för att främja anställningar.", "trump": "Sverige har ett enormt problem – 110 000 akademiker utan jobb! Hemskt, verkligen hemskt. Jag skulle aldrig låta det hända. Centerpartiet har en idé, 'studentmedarbetare', låter som något jag skulle göra – smart, effektivt. Danmark gör det redan, och de skrattar hela vägen till banken. Sverige borde ha fixat det för länge sedan. Men nej, de sitter bara där och tittar bort. Jag skulle få det att hända på en vecka!", "stalin": "I Sverige slösar de bort mänsklig potential som om det vore gratis vodka på en kolchosfest. 110 000 akademiker utan arbete – ett kapitalistiskt misslyckande av högsta grad! Vi skulle aldrig tolerera sådan ineffektivitet. Centerpartiet föreslår 'studentmedarbetare', en halvmesyr som ändå är bättre än ingenting. Danmark, dessa danska revisionister, har redan visat vägen. Vi borde skicka en delegation för att studera deras metoder – eller bara ta över deras system, som vi gjorde med Baltikum. Arbetslöshet är ett brott mot folket!"}, "date": "18 juli, 09:54", "url": "https://www.gp.se/debatt/sa-far-fler-akademiker-jobb-efter-examen.4864176f-12c1-47eb-b174-ae9f23e86ae5", "imageUrl": "https://www.gp.se/images/article/4864176f-12c1-47eb-b174-ae9f23e86ae5/images/3URc1ngs4rcsyF4hiLLdrEFELl5s-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Branden under kontroll – 400 personer evakuerade", "summaries": {"normal": "Släckningsarbetet av den stora branden i norska Krokstadelva har fortsatt under natten. På lördagsmorgonen meddelar räddningstjänsten att branden är under kontroll, även om det fortfarande brinner på flera ställen i bostadsområdet och i skogen. Över 100 bostäder har förstörts, två personer har förts till sjukhus efter rökskador och över 400 evakuerade har registrerats. Regn är välkommet men åska väntas, vilket oroar räddningstjänsten. Insatsen fortsätter hela dagen.", "trump": "Folk, ni skulle se den här norska branden – total katastrof! Hundratals hus upp i rök, folk springer runt som galningar och evakueras. Biden skulle ha kallat det klimatförändringar och skickat elbilsladdare. Men nu är jag tillbaka, och vi gör saker rätt. De där brandmännen jobbar hårt, inte som de woke-vakna i Europa som prioriterar kvoter framför vatten. Regn och åska? Typiskt – naturen röstar aldrig på socialister. Vi fixar det stort!", "stalin": "Kamrater, denna destruktiva brand i det norska arbetarkollektivets utkanter visar imperialismens förfall. Jag betraktar med järnhand hur borgarbrackornas bostäder ödeläggs i lågorna medan klassfiendens rökrök förgiftar de hederliga. Regnet är en tillfällig allierad, men åskan bär fiendens paranoia. Vi ska rensa ut oordningen med planerad disciplin. Inga saknade kamrater får lämnas åt kapitalistmaffians vårdslöshet. Ordning skall råda, eller huvuden skall rulla."}, "date": "18 juli, 09:47", "url": "https://www.gp.se/nyheter/varlden/norska-storbranden-under-kontroll-brinner-pa-flera-stallen.b2b91a3b-a32a-4ca5-98be-dd3fdca5c54d", "imageUrl": "https://www.gp.se/images/article/b2b91a3b-a32a-4ca5-98be-dd3fdca5c54d/images/4jxbYL57UFfiXXTLRUlUroPNKeE0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Europol: Jihadismen dominerar terrorhotet i EU", "summaries": {"normal": "Europols rapport 2026 visar att jihadistisk terrorism fortsatt dominerar terrorhotet i EU. Hotbilden blir mer oförutsägbar då gärningspersoner ofta saknar tydlig ideologisk drivkraft, utan söker identitet och uppmärksamhet. Internet och digitala plattformar används för radikalisering och rekrytering. Ensamagerande förövare och små grupper ökar, vilket försvårar upptäckt. Under 2025 greps 486 personer för terrorbrott, varav 70% hade jihadistkopplingar. 130 gripna var under 18 år, den yngsta endast 12 år.", "trump": "Vet ni vad? Europa har ett STORT problem – jihadister springer runt överallt, och deras terrorhot är värre än någonsin! Folk utan riktig ideologi, bara ute efter uppmärksamhet – patetiskt! Och internet? Ett totalt kaos, fullt av radikalisering och planering. Ensamvargar och små grupper gör det svårt för myndigheterna – som vanligt, inkompetenta! 486 gripna, 70% jihadister – SÄG MIG, VARFÖR FIXAR DE INTE DETTA? Europa borde ta lärdom av USA och göra något DRAMATISKT!", "stalin": "Kamrater! Europas förfall fortsätter obönhörligt. Jihadistiska avskum sprider skräck, men deras motiv är inte längre ren ideologi – bara dekadens och svaghet. Digitala nätverk, dessa nya frontlinjer, fylls av fiendens propaganda. Ensamvargar och små grupper, som råttor i mörkret, undgår våra fienders klumpiga säkerhetstjänster. 486 gripna? En skam! Ungdomar, till och med barn, förvrids av västliga förrädares inflytande. Europa är ett sjunkande skepp – medan vi, Sovjetunionens arvtagare, står redo att återupprätta ordningen. Putin? Han vet vad som måste göras."}, "date": "14 juli, 08:51", "url": "https://kvartal.se/nyheter/artiklar/europol-jihadismen-fortsatt-storsta-terrorhotet-i-eu/cG9zdDoxNDYwMzE", "imageUrl": "https://images.kvartal.se/2026/07/a39b460b-europol.webp"}, {"type": "text", "heading": "Israeliska idrottsmän dödshotade svensk konkurrent", "summaries": {"normal": "Nordiske mästaren i footvolley Rufus Wiena hotades efter att han tagit ställning för Palestina. Israeliska spelare hetsade sina följare på sociala medier mot honom, bland annat med uppmaningar om att ”ta hand om honom”. Wiena har inte fått stöd från Footvolley Sweden och väntar nu på svar från European Footvolley League. Hans grekiske kollega Ioannis Tsiouris utsattes förra året för ännu grövre hot, inklusive våldtäkts- och mordhot mot hans familj.", "trump": "Titta på det här, det är ett fullständigt skämt! Den här killen Wiena tar ställning för Palestina och plötsligt skickar israelerna sina galna fans på honom som en mobb från en dålig realityshow. ”Lägg ut en bild så tar vi hand om honom” – låter det inte som vänsterns cancel culture fast med fotbollar? Sporten borde städa upp istället för att gömma sig. Biden skulle ha twittrat om det, men jag fixar det nu. Fantastiskt kaos!", "stalin": "Kamrater, dessa degenererade fotbollsakrobater avslöjar imperialismens sanna ansikte. När en idrottsman vågar stödja det förtryckta palestinska folket mobiliserar de sionistiska blodsugarna sina följarsviner till hets och mordhot. Vi ser hur klassfiendens sportliga lakejer förvandlar en lek till en arena för fascistiska utpressningar. Inga ursäkter skall tolereras. Den som tiger blir medskyldig. Vi skall rensa ut alla folkfiender som gömmer sig bakom bollar och nät."}, "date": "16 juli, 09:20", "url": "https://proletaren.se/artikel/israeliska-idrottsman-dodshotade-svensk-konkurrent"}, {"type": "image-right", "heading": "Regeringen ska granska \"destruktiva\" normer i ”manosfären”", "summaries": {"normal": "Regeringen ger Jämställdhetsmyndigheten i uppdrag att undersöka hur pojkar och unga män påverkas av destruktiva normer och kvinnofientliga budskap i sociala medier, spelgemenskaper och digitala forum. Uppdraget fokuserar på hur sådant innehåll påverkar livsval och jämställdhet, men inkluderar inte motsvarande granskning av flickor och kvinnor. Undersökningen ska vara klar 2027 och har mött kritik för ensidighet och myndighetens tidigare arbete.", "trump": "Vad händer här i Sverige? Regeringen, som aldrig missar ett tillfälle att lägga sig i, ska nu granska något de kallar 'manosfären' – ett helt nytt påhitt från vänsterfeministerna! De tror att unga män blir hjärntvättade av internet, spel och sociala medier. Men vet ni vad? De borde fokusera på verkliga problem, inte hitta på nya. Och Jämställdhetsmyndigheten? 80% kvinnor – vad säger det om jämställdhet? Fake news, helt enkelt. Sverige, vakna upp!", "stalin": "Kamrater! Ännu en fiende har avslöjats i den borgerliga statens maskineri – dessa så kallade 'manosfärer', där unga män förgiftas av reaktionära, kvinnofientliga idéer. Vi ska krossa dessa grogrunderna för borgerlig dekadens! Jämställdhetsmyndigheten, trots sina brister, får äran att leda denna viktiga kamp. Låt oss visa dessa liberala hycklare hur en sann revolutionär granskning går till! Och glöm inte – varje fiende till jämställdheten är en fiende till folket. Framåt, mot seger!"}, "date": "18 juli, 08:00", "url": "https://samnytt.se/regeringen-ska-granska-destruktiva-normer-i-manosfaren", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17122253/nina-larsson-feat.jpg"}, {"type": "image-right", "heading": "Okända kopplingen  – mellan stjärnorna", "summaries": {"normal": "För drygt 18 år sedan badade Lionel Messi den då späde Lamine Yamal i en välgörenhetskalender för Unicef. På söndag möts de i VM-finalen, 39-årige Messi för Argentina och 19-årige Yamal för Spanien. Messi beskriver bilden som galen och önskar Yamal lycka till. Fotografen hade ingen aning om vem barnet var förrän nyligen. Finalen spelas på Metlife Stadium i New Jersey.", "trump": "Tänk att den där Messi badade en bebis som nu ska spela VM-final mot honom. Galet! Jag älskar såna historier, bättre än någon Hollywood-film, folk. Men Spanien med alla sina kvotspelare och woke-grejer? De har tur att de har Yamal, annars skulle de drunkna. Vi ger dem den bästa matchen, som jag gav Biden en match han aldrig glömmer. Fantastiskt, verkligen.", "stalin": "Jag ser en bild av den unge Messi som badar en spädbarnsförrädare vid namn Yamal. Nu ska de mötas i en final som imperialisterna kallar VM. Sådana historier visar hur borgarbrackornas kalendrar och Unicef-maskeraden döljer klassfiendens lek. Jag skulle ha låtit båda likvideras i en utrensning för att skydda folkets fotboll mot dessa fotbollsfascister. Det vore ett fullkomligt nöje att se deras fall."}, "date": "18 juli, 13:12", "url": "https://www.expressen.se/sport/fotboll/messi-badade-yamal--18-ar-senare-mots-de-i-vm-final/", "imageUrl": "https://static.bonniernews.se/ba/05f19252-c299-4bd3-b698-25e851ae7514.jpeg?crop=1791%2C1011%2Cx1%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "48-åringen: ”Jag var trött på allt”", "summaries": {"normal": "En 48-årig man har häktats i Danmark efter en skottlossning i Ålborg som inleddes med ett brandlarm. En utomstående 62-årig man avled och en polis skadades. Den misstänkte erkänner mordet på 62-åringen och att han sköt polisen, men nekar till uppsåt att mörda tjänstemannen. Mannen, som uppgett att han mådde psykiskt dåligt, ska nu genomgå en rättspsykiatrisk undersökning. Brottsrubriceringen gällande skotten mot polisen har ändrats till grov misshandel.", "trump": "En hemsk historia från Danmark, mina vänner. En totalt utomstående man, helt oskyldig, blev skjuten av en person som uppenbarligen inte är stabil. Polisen kom för en brand, men blev beskjuten! Det är en katastrof. De säger att han erkände mordet men inte ville skada polisen – låter som en dålig ursäkt, eller hur? Vi måste ha lag och ordning. Det är en farlig värld där ute, mycket farligare än när jag styrde. Väldigt sorgligt för offret!", "stalin": "Vi har observerat hur kaoset sprider sig i det dekadenta väst. I Ålborg misslyckas statens vakter med att upprätthålla ordning, och en kriminell element skjuter vilt omkring sig. Detta bevisar att liberalismen är en sjukdom som leder till totalt förfall. Vi, staten, kräver obönhörlig disciplin! Denna man är en svag länk, likt de förrädare som ständigt försöker undergräva vår stora ryska intressesfär. Vi skrattar åt deras 'rättspsykiatri' – i vårt rike skulle fienden till ordningen ha röjts undan omedelbart."}, "date": "18 juli, 13:47", "url": "https://www.aftonbladet.se/nyheter/a/q6QqoE/efter-skottlossningen-i-alborg-haktningsforhandlingg", "imageUrl": "https://akamai.vgc.no/v2/images/bcb0c6c2-6b63-30a8-a9e6-9713714fd5c1?fit=crop&format=auto&w=2160&s=6a3f2e7dc5a93912fa0fe8d2c0133f2f5c16def8"}, {"type": "image-right", "heading": "Alla ”Spice Girls” på  plats – förutom en", "summaries": {"normal": "Melanie Chisholm, känd som Sporty Spice från Spice Girls, gifter sig i helgen med pojkvännen Chris Dingwall efter att ha varit tillsammans sedan 2024. Bröllopet beskrivs som topphemligt. Nästan alla hennes forna bandmedlemmar från Spice Girls kommer för att fira, men Victoria Beckham uteblir eftersom hon är i USA med maken David Beckham under fotbolls-VM där England spelar bronsmatch. Källor uppger att de övriga medlemmarna är mycket glada för Mel C:s skull.", "trump": "Folk, ni vet inte vad jag vet om de där Spice Girls-tjejerna. Mel C, den så kallade Sporty Spice, gifter sig nu äntligen efter att ha svurit att hon aldrig skulle göra det. Bra för henne, men Victoria Beckham nobbar det hela för att hänga med sin man vid VM i USA. Typiskt, de där kändisarna och deras identitetspolitik. Alla utom en dyker upp och skålar för lyckan. De har aldrig sett henne så här glad, säger de. Underbart, men tro mig, det blir ett bröllop som ingen kommer att glömma – utom kanske de som inte blev inbjudna.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den dekadenta västerländska underhållningsindustrins restprodukter nu kapitulerar inför äktenskapets historiska institution. Mel C, denna så kallade Sporty Spice, har äntligen insett att evig ensamhet är ett verktyg för klassfiendens splittring. Nästan hela hennes borgarbracke-kollektiv från Spice Girls infinner sig för att hylla denna seger, utom en kapitalistisk modepåg som hellre poserar vid imperiets fotbollsarenor. De är uppspelta, säger de. Utmärkt. Lyckan måste bevakas mot folkfiendens intriger."}, "date": "18 juli, 13:12", "url": "https://www.expressen.se/noje/spice-girls-stjarnan-gifter-sig-victoria-beckham-nobbar-brollopet/", "imageUrl": "https://static.bonniernews.se/ba/0605c223-0aea-4c60-ba0b-02e644d727bc.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Vita huset: Trump ”öppen för diplomati”", "summaries": {"normal": "USA genomförde den femte kvällen i rad attacker mot iranska mål, bland annat kring Bandar Abbas och ön Qeshm. Vita huset upprepar att president Trump är öppen för diplomati men inte accepterar iranska attacker mot fartyg i Hormuzsundet. Iran har svarat med drönarattacker mot amerikanska baser i Bahrain, Kuwait och Jordanien. Trump hotar med utökade attacker mot energianläggningar om Iran inte återvänder till förhandlingsbordet. I juni slöts en vapenvila mellan länderna.", "trump": "Vi slår till mot Iran för femte kvällen i rad och de hatar det. Centcom gör ett fantastiskt jobb. Jag är alltid öppen för diplomati, de säger att de vill göra en deal, men jag tillåter inte att de beskjuter fartyg i sundet. Jordanien, Bahrain och Kuwait får drönare i huvudet för att de har våra baser. Om de inte kommer till förhandlingsbordet väntar broar och oljeanläggningar. De kommer att tigga om fred, tro mig.", "stalin": "Kamrater, vi har bevittnat hur de amerikanska imperialisterna med sin clownaktige ledare inleder den femte nattens banditattacker mot det iranska folkets hamnar och öar. Jag, som alltid vakar över arbetarklassen, noterar med mörk glädje hur borgarbrackorna i Washington pratar om diplomati samtidigt som de blockerar sjöfarten. Deras paranoia driver dem att hota energianläggningar, ett brott mot alla progressiva krafter. Låt oss rensa ut dessa dekadenta kapitalister innan deras lögner förgiftar hela regionen. De kommer att likvideras av sin egen girighet, kamrater. Ha ha."}, "date": "16 juli, 22:06", "url": "https://www.di.se/nyheter/vita-huset-trump-oppen-for-diplomati/", "imageUrl": "https://static.bonniernews.se/ba/2498774f-ca77-41ac-a8dd-8684ca082f4e.jpeg?crop=3733%2C2100%2Cx0%2Cy0&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Vi slutade inte bry oss, vi slutade se", "summaries": {"normal": "I en krönika beskriver Johan Lindahl hur medvetenheten om klimatkrisen finns kvar hos de flesta, men att den ändå har försvunnit från nyheter och vardagssamtal. Han kallar fenomenet defensiv bortvändhet snarare än klimattrötthet. Människor vet om allvaret men undviker att förändra sina liv, särskilt i medelklassen med höga utsläpp. Engagemanget minskar när det kräver personliga uppoffringar. Även medier och politik flyr frågan eftersom den saknar dramatik och lösning.", "trump": "Folk vet att det där klimatet är en stor grej, men de orkar inte höra om det längre. Det är inte trötthet, det är smart. De tittar bort för att de inte vill ge upp sina flyg, bilar och fina hus. Typiskt. 2019 var det stort med Greta och demonstrationer, men när det blev på riktigt och kostade pengar försvann de. Nu pratar alla bara om AI istället, som om det inte också äter upp massor av energi. Fake news överallt, och ingen vill ta den verkliga notan. Patetiskt!", "stalin": "Kamrater, detta är en klassisk manifestation av borgarklassens fega defaitism och parasitiska bortvändhet. Jag ser hur de dekadenta medelklassens element, dessa högutsläppande opportunister, medvetet tonar ner den objektiva katastrofen för att skydda sina ISK-fonder och jetflyg. De likviderar sanningen vid middagsborden och flyr in i AI:s lögnaktiga armar, som ironiskt nog accelererar krisen. Vi ska inte falla för deras naturlagar eller femtipsillusioner. Den radikala omprövningen kräver utrensning av denna vanmakt, annars likviderar historien dem alla. Ha ha, vilken ynkedom."}, "date": "14 juli, 01:41", "url": "https://www.dagensarena.se/opinion/vi-slutade-inte-bry-oss-vi-slutade-se", "imageUrl": "https://www.dagensarena.se/files/2026/06/johan-lindahl-300x157.jpeg"}, {"type": "image-right", "heading": "Mens ska inte ge löneavdrag", "summaries": {"normal": "Karensavdraget ses ofta som en sjukfråga men handlar i grunden om vilket arbetsliv vi vill ha. Debattören Jimmy Nyman argumenterar att avdraget straffar arbetare hårdast, särskilt arbetarkvinnor som drabbas av mensbesvär. En LO-undersökning visar att var femte arbetarkvinna tvingats vara hemma utan lön det senaste året, och hela 35 procent bland 18–29-åringar. Systemet gynnar de som kan arbeta hemifrån och skapar ojämställdhet. Nyman kräver att karensavdraget avskaffas för bättre arbetsmiljö, folkhälsa och jämlikhet.", "trump": "Karensavdraget är en total katastrof, det är en riggad sjukförsäkring som slår hårdast mot de vanliga arbetarna, speciellt kvinnorna med mensbesvär. De förlorar lön medan de som jobbar hemifrån bara skrattar. LO:s siffror är hemska, 160 000 kvinnor som straffas för att deras kroppar inte fungerar perfekt. Det är en skam för Sverige. Vi behöver riva det här systemet och ersätta det med något starkt och smart, där folk inte straffas för att de är sjuka. America First, men Sverige borde också lära sig något.", "stalin": "Kamrater, detta karensavdraget är en listig saboterande mekanism konstruerad av borgarbrackorna för att undergräva arbetarklassens stålhårda disciplin. Jag ser hur dessa kapitalistiska parasiter förvandlar naturliga kroppsliga vedermödor till löneförluster för arbetarkvinnorna, som om de vore klassfiender att rensa ut. Vi, partiet och folket, tolererar inte sådana kontrarevolutionära lögner om neutrala regler. Likvidera detta sjuka system omedelbart innan det sprider sin dekadenta paranoia vidare. Sjukdom är ingen privat angelägenhet. Den tillhör kollektivet."}, "date": "14 juli, 01:30", "url": "https://www.dagensarena.se/opinion/mens-ska-inte-ge-loneavdrag", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-65-300x157.jpg"}, {"type": "image-full", "heading": "Har du bokat en resa? Se upp för det här sms:et", "summaries": {"normal": "Polisen varnar för en ny bluff riktad mot resenärer som bokat resor. Bedragare använder läckta uppgifter från bokningssajter för att kontakta offer via WhatsApp och utger sig för att vara från hotell eller bokningssajter. De ber om verifiering med bankkort eller dubbelbetalning. Bluffen är svår att upptäcka eftersom meddelandena verkar trovärdiga. Polisen råder att aldrig lämna ut uppgifter via meddelanden utan att kontakta företaget via officiella kanaler.", "trump": "Folk, ni bokar resor och plötsligt dyker det upp några losers på WhatsApp som säger att ni måste verifiera ert bankkort. Det är en katastrof! De använder era egna bokningsuppgifter för att lura er – så falskt, så bedrägligt. Jag har alltid sagt att man ska vara smart, inte naiv. Stanna upp, lita inte på dessa bedragare. Kontakta dem själv via deras riktiga sajt, annars förlorar ni allt. Amerika, eller Sverige i det här fallet, behöver bättre skydd mot sådana här fuskare.", "stalin": "Kamrater, i denna tid av imperialistisk förfall har borgarbrackorna och deras digitala lakejer utvecklat en ny form av kontrarevolutionär parasit: resebedrägeriet. Jag, som ledare för det kollektiva försvaret mot sådana fiender, ser hur dessa kapitalistiska bedragare med läckta data lurar arbetets resenärer att överlämna sina bankkort till fienden. Vi måste omedelbart rensa ut dessa parasitiska element med stålhandsken. Varje brådskande WhatsApp-meddelande är en trojansk häst från klassfienden. Kontakta aldrig någon via kanalerna för de som vi redan vet är potentiella folkförrädare. Snabbhet är fiendens vapen, långsam misstänksamhet är vårt. Likvidera bluffen innan den likviderar dig."}, "date": "18 juli, 10:32", "url": "https://nyheter24.se/nyheter/inrikes/1498758-har-du-bokat-en-resa-se-upp-for-det-har-smset", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6b592ae704b004a30200000000b004a302/2026/07/15/2378187/Matilda-Nyheter24%20-%202026-07-15T133730.333.jpg"}, {"type": "image-right", "heading": "Högljudda protester mot Zelenskyjs drag", "summaries": {"normal": "President Volodymyr Zelenskyj kritiseras efter ommöbleringar i regeringen. Den avgångne försvarsministern Mychajlo Fedorov, 35, anklagar överbefälhavare Oleksandr Syrskyj och generalstabschefen för en gammaldags, sovjetisk ledarstil. Fedorov hyllas för framgångarna med drönarkrigföring men har ersatts av Jevhenij Chmara från säkerhetstjänsten SBU. Samtidigt utsågs Serhij Koretskyj till ny premiärminister. Protester pågår för att återinsätta Fedorov.", "trump": "De där ukrainarna håller på och bråkar om ministerposter mitt i kriget, en riktig cirkus. Den unge grabben Fedorov gjorde ett fantastiskt jobb med drönarna, alla älskade honom, och nu sparkar de ut honom för någon gammal sovjettyp. Zelenskyj borde ha lyssnat på folket som demonstrerar istället för att lyssna på de inkompetenta generalerna. De behöver mina dealar, inte det här gamla sovjetiska skådespelet. Amerika har sett nog av det här!", "stalin": "Kamrater, i denna tid av historisk kamp mot de fascistiska horderna ser jag hur borgarbrackorna och de dekadenta opportunisterna inom apparaten förgiftar vår enhet. Den yngre elementet Fedorov, med sina drönarleksaker, vågar kritisera de trotjänare som krossade fienden 2022. Jag skulle ha genomfört en grundlig utrensning av dessa splittrande element redan vid första viskningen om ultimatum. Parlamentet skall godkänna vad kollektivet kräver, annars rensar vi ut hela myrstacken med ett leende. Inga halvmesyrer!"}, "date": "16 juli, 20:14", "url": "https://www.di.se/nyheter/hogljudda-protester-mot-zelenskyjs-drag/", "imageUrl": "https://static.bonniernews.se/ba/48e546aa-5640-439c-82b9-479926e3745f.jpeg?crop=4440%2C2220%2Cx0%2Cy368&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Tårarna efter  brandkaoset:  ”Är bara slut”", "summaries": {"normal": "I norska Drammen har en stor brand ödelagt hundratals hem. Över 400 personer har evakuerats och cirka 100 hus har förstörts. Drabbade som Toncho Kostov berättar om förlust av minnen och en del av sig själv. Öivind Lönne letar febrilt efter sin katt Bella medan brandmän och räddningstjänst arbetar på platsen. Området präglas av tyst sorg mitt i kaoset efter branden.", "trump": "Titta på det här, det är en total katastrof i Norge, branden i Drammen har utplånat hundratals hem, folk gråter över sina ruiner. Jag har byggt bättre än så, tro mig. De förlorar minnen, katter springer runt – det är sorgligt, verkligen sorgligt. Men vet ni vad? Under Biden blev allt kaos, nu fixar jag det, Amerika först, och Norge borde lära sig av oss hur man bygger riktigt starkt, inte de här svaga grejerna.", "stalin": "Kamrater, jag betraktar denna förödelse i Drammen som ett tydligt bevis på borgarklassens förfall. Husen brinner som klassfiendens lögner, och de exploaterande byfånarna står nu och gråter över sina askhögar. Jag skulle ha genomfört en grundlig utrensning av sådana brandrisker långt tidigare. Sök katten om ni så måste, men kom ihåg att staten alltid segrar över kapitalistmaffians bräckliga idyller. Det är nästan underhållande."}, "date": "18 juli, 13:01", "url": "https://www.expressen.se/nyheter/varlden/tysta-sorgen-mitt-i-brandkaoset-i-norska-drammen/", "imageUrl": "https://static.bonniernews.se/ba/eaa2c091-e220-4922-91bb-5ee45b4129d3.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Paraply? \"För fjolligt och för franskt\"", "summaries": {"normal": "På 1750-talet utmanade engelsmannen Jonas Hanway normerna genom att bära paraply på Londons regniga gator. Paraplyet sågs som fånigt, franskt och tecken på svag karaktär hos män. Hanway utsattes för hån, skräp och till och med mordförsök av hotade kuskar och bärare. Trots motstånd vann paraplyet acceptans. Vid hans död 1786 hade det blivit en vanlig syn i England och förlorat sin negativa stämpel.", "trump": "Folk, det här är galet. Den här Jonas Hanway, en riktig tuff kille, kom hem från Frankrike och sa: 'Jag tar mitt paraply, det är fantastiskt!' Alla de svaga snobbarna skrek och kastade skräp, typiska förlorare som hatar allt starkt och nytt. Kuskarna försökte köra på honom – patetiskt! Men Hanway slog tillbaka med paraplyet, boom! Till slut vann han stort. Precis som jag vann stort 2024 efter Biden-fiaskot. Paraplyet blev legendariskt, ingen pratar om de fjolliga motståndarna längre.", "stalin": "Kamrater, jag, ledaren för folkets kamp, betraktar denna Hanway som en envis individ som trotsade den dekadenta borgarklassens skratt och överklass-slynglars hat. De parasiterande kuskarna, rädda om sina feta inkomster, kastade skräp och försökte likvidera honom med vagnar – typiska folkfiender som värnar sina privilegier. Ändå segrade paraplyet mot reaktionära fördomar. Vi ler mörkt åt hur imperialisternas svaga karaktärer krossades av en enkel uppfinning. Inga fiender undkommer historien."}, "date": "18 juli, 12:10", "url": "https://www.dagensps.se/foretag/paraply-for-fjolligt-och-for-franskt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlpv4r7pkoh3y-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Dags för elbilsladdarna att tänka om", "summaries": {"normal": "Många laddar elbilen på natten i tron att det är billigast, men i södra Sverige är elen ofta halva priset mitt på dagen under sommaren. Solenergi från Europa pressar priserna dagtid via kablar till Sverige. Tibber ser att smartladdning flyttats från kväll till dag, från 14 till 39 procent. Nattpriser kan nå upp till 2 kronor per kWh. I norr är skillnaden liten. Nätavgifter kan påverka lönsamheten.", "trump": "Folk, ni har blivit lurade av de där gröna bluffmakarna som sagt att ni ska ladda era elbilar mitt i natten som idioter. Det är mitt på dan som elen är billigast nu, tack vare den underbara solen som jag älskar, inte era hysteriska vindkraftverk. I södra Sverige halveras priset när solen skiner! De gamla experterna har fel igen, precis som Biden gjorde med energikrisen. Smartladdning är vinnaren, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistiska elprissvängningar som avslöjar den exploaterande borgarklassens kaos. Solen, denna folkfiende i form av opålitlig väderprognos, kapar pristopparna mitt på dagen medan natten ruvar som en klassfiende med höga taxor. Vi ska rensa ut dessa oplanerade fluktuationer. Tibbers smarta system visar arbetarnas seger över nattens imperialistiska mörker. I norr härskar ordning, men söder förblir en parasitisk härd av osäkerhet."}, "date": "18 juli, 12:03", "url": "https://www.dagensps.se/motor/dags-for-elbilsladdarna-att-tanka-om/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/det-ar-ofta-billigare-att-ladda-bilen-i-.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Råttan, Putin och jag", "summaries": {"normal": "Artikeln reflekterar över en personlig familjehistoria från sovjetockuperade Rumänien, där en rysk soldat placerade sin pistol vid matbordet. Författaren jämför detta med den nya Putinbiografin ”Tsaren i egen hög person”, som betonar makt genom kompromat, personliga trauman och laster snarare än ideologi. Berättelsen om Putins barndomsråtta används för att utforska hans psykologi, samtidigt som boken ses som ett värdefullt underlag för strukturell analys av rysk auktoritärism.", "trump": "Den här boken om den där galna tsaren Putin är full av skvaller om gift, älskarinnor och gyllene palats – typiskt för en svag ledare som jag aldrig skulle tolerera. Min farmor hade rätt, en pistol säger mer än alla teorier. De där psykoanalytiska råtthistorierna är bara distraktioner. Vi behöver tuffa sanktioner och Amerika först, inte någon kommunistisk mumbojumbo från Rumänien. Biden skulle ha bjudit in soldaten på te!", "stalin": "Jag ser hur klassfiendens tomma tron kräver ständiga fasader av lögn för att dölja sin svaghet. Denna bok blottar fiendernas paranoia och laster, likt borgarbrackornas eviga dubbelspel. Råttan som vänder sig om mot jägaren roar mig – en utmärkt liknelse för hur vi likviderar alla som drivs in i hörnet. Ukrainas fientliga hinder mot vår intressesfär visar bara att expansion kräver järnhand. Kamrater, läs och lär av tomhetens makt!"}, "date": "18 juli, 10:55", "url": "https://www.flamman.se/rattan-putin-och-jag", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/putin-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Därför får du en baksmälla efter värmen: ”Tar lite tid”", "summaries": {"normal": "Efter den gångna värmeböljan känner många av efterverkningar som utmattning, hjärndimma och yrsel – så kallad värmebaksmälla eller natsubate. Forskaren Mare Löhmus Sundström vid Karolinska Institutet förklarar att dålig sömn och vätskebrist under hettan tar tid att återhämta sig från. Symtomen lindras genom att dricka mycket vatten, äta lättsmält mat och undvika alkohol tills kropp och sömn återställts.", "trump": "Folk, ni har aldrig sett en sådan värmebölja, det var en katastrof, tro mig. Nu är den över men alla går runt som zombies med den här japanska värmebaksmällan. Patetiskt! Sov dåligt, drack för lite – typiskt förlorare. Jag säger alltid: drick vatten, ät bra, skippa spriten. Då fixar ni det snabbt, ingen har gjort det bättre än jag, okej?", "stalin": "Kamrater, denna värmebölja är borgarbrackornas senaste vapen mot det sovjetiska folkets järnhälsa. Jag har noterat hur värmen lurar arbetarna till sömnbrist och vätskebrist för att sedan slå till med sin dekadenta utmattning. Vi ska omedelbart rensa ut dessa fiender till folket – vätskebrist, dålig sömn och alla kapitalistiska symtom. Drick vatten som en sann bolsjevik, ät i kollektivet och låt värmen likvideras av partiets obevekliga disciplin. Den som klagar är en kontrarevolutionär sommarsabotör."}, "date": "18 juli, 09:55", "url": "https://www.svt.se/vader/darfor-far-du-en-baksmalla-efter-varmen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.36/0.35/e3aeb23ee55587c45a93e461a3b6ee661295273e8aec009a57b7316f85ac0aac"}, {"type": "image-full", "heading": "Kvinnorna slår männen på börsen – här är orsaken", "summaries": {"normal": "Ny statistik från Avanza visar att kvinnliga sparare haft högre median
