ala staten från småstäderna och undrat varför folk är arga. Jag skulle ha byggt den starkaste arbetsmarknaden, tro mig, ingen gör det bättre än jag. Nu betalar de priset för sina usla beslut. Sad!", "stalin": "Kamrater, vi ser tydligt hur borgarbrackorna i Sverige systematiskt har demonterat arbetarnas skydd mot den kapitalistiska arbetslösningsrisken. Denna underminerande sabotageverksamhet har naturligtvis gött de kontrarevolutionära missnöjeselementen. Jag ler mörkt åt ironin att dessa högerpopulistiska parasitörer växer sig starka just bland de proletärer de senare sviker. Vi vet att endast en stark, synlig och auktoritär statlig närvaro kan rensa ut sådana fiender till folkets kollektiv. Den som drar sig tillbaka från fronten är en objektiv fiende till revolutionen."}, "date": "8 juni, 01:44", "url": "https://www.dagensarena.se/opinion/sa-stoppas-sverigedemokraterna/", "imageUrl": "https://www.dagensarena.se/files/2023/02/german-bender-ny-300x157.jpeg"}, {"type": "image-full", "heading": "Kommer fler att resa kollektivt nu när priset halveras?", "summaries": {"normal": "Regeringen halverar priset på månadskort i kollektivtrafiken från 1 juli till 31 december. Branschorganisationen Svensk Kollektivtrafik vd Johan Wadman är osäker på om det lockar bilister att ställa bilen. Han tror främst att de som redan reser ofta får lägre kostnader och kanske reser mer, men effekten på nya resenärer är oviss. Wadman lyfter att utbud, punktlighet och framkomlighet är viktigare än priset för att öka resandet långsiktigt.", "trump": "De halverar priset på busskort, fantastiskt, men kommer det att få folk att lämna sina bilar? Jag tvivlar. De säger att det är svårt att veta, elasticitetsmodeller och så vidare, men vi vet alla att bilen ger frihet som ingen buss kan slå. Det är ett stöd till de som klagar på att det är för dyrt, men på lång sikt behövs riktiga lösningar, inte bara tillfälliga rabatter. De borde lyssna på mig.", "stalin": "Vi, partiet och arbetarna, ser hur borgarbrackorna i regeringen med sin halvmesyr försöker muta folket med billigare månadskort medan de i hemlighet behåller bilarnas herravälde. Jag misstänker att de kapitalistiska elasticitetsmodellerna döljer en kontrarevolutionär agenda. På kort sikt hotar ökad trängsel vår kollektiva ordning. Rensa ut de som prioriterar personlig frihet framför statens järnvägar. Utbudet och punktligheten skall segra – eller så likviderar vi förseningarna."}, "date": "8 juni, 01:30", "url": "https://www.dagensarena.se/innehall/kommer-fler-att-resa-kollektivt-nu-nar-priset-halveras/", "imageUrl": "https://www.dagensarena.se/files/2022/01/bergkvarabuss-byd-b15-fotograf-mikael-leijon-01-1024x534.jpg"}, {"type": "image-right", "heading": "Friskolor kan förbjudas att dela ut vinst – och så bör ske", "summaries": {"normal": "Idéburna skolor förverkligar friskolereformens mål om mångfald och valfrihet men missgynnas av ett system som gynnar stora vinstdrivande koncerner. Idéburna Skolors Riksförbund hänvisar till EU-rättslig praxis som slår fast att offentligt finansierad utbildning inte är ekonomisk verksamhet. Regeringen har nu anslutit sig till denna tolkning, vilket öppnar för att förbjuda vinstuttag i skolan. Förbundet föreslår en Friskolereform 2.0 där aktiebolag avskaffas som driftsform, överskott återinvesteras och små skolor samt hög lärartäthet premieras.", "trump": "Folk, ni måste höra det här. De här fantastiska idéburna skolorna gör precis det friskolereformen lovade – mångfald, valfrihet, inga vinster som sugs ut. Men det svenska systemet är riggat för de stora skolkoncernerna, de värsta bluffarna. EU-rätten? Glöm det, nu har till och med regeringen vaknat och sagt att det inte är affärsverksamhet. Tre av fyra svenskar vill stoppa vinstuttagen. Det är en total skandal hur de behandlar de bra skolorna. Vi behöver en riktig friskolereform 2.0, inte den här svaga helrenoveringen. Gör det stort igen!", "stalin": "Kamrater, jag har noga studerat dessa borgarbrackornas så kallade friskolesystem som fötts ur revisionistiska 1990-talsillusioner. De idéburna skolorna, dessa äkta folkets initiativ, krossas systematiskt av de stora vinstsugande monopolkapitalistiska skolkoncernerna medan de förgiftar ungdomen med segregation och betygsfusk. Nu har vi äntligen en öppning i EU:s egna dekret som bekräftar att utbildning inte är någon smutsig ekonomisk spekulation. Det är hög tid att rensa ut alla aktiebolagsparasiter ur folkets skola, likvidera vinstuttagen och återinvestera varje kopek i kollektivets bildning. De som envisas med att suga ut skolans saft ska möta den historiska utrensningens logik. Friskolereform 2.0 blir vår nya femårsplan för socialistisk fostran."}, "date": "8 juni, 01:30", "url": "https://www.dagensarena.se/opinion/friskolor-kan-forbjudas-att-dela-ut-vinst-och-sa-bor-ske/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-300x157.jpg"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Ericssons flykt från Kista: Rödgröna styret satsar 100 miljoner för att motverka spökstad", "summaries": {"normal": "Ericsson flyttar 8 500 jobb från Kista till Hagastaden 2028, vilket hotar området med spökstad. Stockholms rödgröna styre satsar 100 miljoner för att motverka detta genom att bilda ett kommunalt bolag som anpassar lokaler och skapar ett blandat stadsliv. Oppositionen (M) kritiserar och menar att trygghetsproblemen måste åtgärdas först.", "trump": "Som den största affärsmannen och framtidsvisionären, ser jag att Ericssons flykt från Kista är en katastrof för Sverige. Det är alla dessa svaga politikers fel! Jag skulle direkt satsa 100 miljarder och bygga en fantastisk ny hubb. Vi skulle få tillbaka alla jobb med mina geniala handelsavtal. Kista kommer att bli större än Silicon Valley – det lovar jag!", "stalin": "Vi, staten och partiet, ser tydligt att det kapitalistiska rotet i Kista börjar rasa. Ericssons flykt är en bevis på fienden inom. Vi kommer att använda 100 miljoner som en katalysator för att återuppbygga området efter vårt design. Vi kommer att tvinga de privata ägarna att följa våra planer för trygghet och utveckling. Detta är en kritisk kamp mot de imperialistiska krafterna som hotar vårt system."}, "date": "8 juni, 06:00", "url": "https://samnytt.se/ericssons-flykt-fran-kista-rodgrona-styret-satsar-100-miljoner-for-att-motverka-spokstad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/08010639/kista-3.jpg"}, {"type": "image-right", "heading": "Irans hot efter nya attackerna: ”Början på en hel vecka”", "summaries": {"normal": "Irans revolutionsgarde har bekräftat en robotattack mot Israel, som beskrivs som inledningen på en veckas fortsatta attacker. Det är den första attacken sedan vapenvilan i april. Israel har aktiverat sitt luftvärn. Tidigare under dagen attackerade Israel mål i Beirut som svar på raketer från Hizbollah. Irans parlamentstalman Mohammad Bagher Ghalibaf fördömer attackerna och USA:s blockad, och kallar amerikanska och israeliska intressen legitima mål. USA:s president Trump uppmanar Netanyahu att inte svara.", "trump": "Iranerna skjuter raketer och kallar det en hel veckas fest – typiskt för dessa förlorare. Jag ringde just Bibi och sa: Sluta nu, killar, ni har haft ert roliga, Israel slog till, Iran slog till, ingen behöver mer av det här misslyckandet. Biden lämnade en sådan röra att de tror sig kunna hota oss. Men jag fixar det, som alltid. Inga fler krig för de woke idiaterna och deras identitetspolitik, vi ska ha fred genom styrka, inte genom svaghet.", "stalin": "Kamrater, imperialismens lakejer i Tel Aviv och deras amerikanska finansiärer har återigen provocerat den iranska folkrepubliken. Jag ser med tillfredsställelse hur revolutionsgardet lovar en hel vecka av förkrossande vedergällning mot dessa folkfiender och exploaterande byfånar. Varje försök att hota iranskt territorium skall mötas med likvidering. Låt de sionistiska baserna darra. Vi, partiet och arbetarna, ler åt hur klassfiendens blockader bara skapar fler legitima mål för den rättmätiga vrede som alltid segrar."}, "date": "7 juni, 22:50", "url": "https://www.tv4.se/artikel/sbnJX4coviApvwFOjKXo3/israel-iran-har-avfyrat-robotar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FB1pTMH8bxRZQCC5eOZhOz%2Fd3bad395a7e8138ae3dad8b0aaef1043%2F07-israel-webb.jpg&width=120"}, {"type": "image-full", "heading": "Israel svarar – slår till mot mål i Iran", "summaries": {"normal": "I söndags attackerade Iran Israel med missiler, och Israel svarade med attacker mot mål i Iran under natten. Många platser, inklusive Teheran, drabbades. Donald Trump uppmanade båda länderna att avbryta vedergällningarna och återgå till förhandlingar, och sade att han ringde Netanyahu för att fördröja ett israeliskt svar.", "trump": "Jag var väldigt nära ett fantastiskt avtal med Iran, men sedan skjuter de missiler mot Israel. Jag sa åt Netanyahu att inte svara, men han är lite svår att styra. Jag är den som bestämmer, inte han. Vi måste komma tillbaka till förhandlingsbordet och skapa fred. Det här är en skandal!", "stalin": "Vi svarar med oöverträffad kraft mot de zionistiska och imperialistiska agressörerna. Teheran måste lära sig att respektera vår sfär. Vi kommer att utvidga vår inflytelsesfär, precis som våra ryska allierade gör i Ukraina. Våra fiender ska skämmas! Vi kommer att segra, för det är vår historiska mission."}, "date": "8 juni, 06:18", "url": "https://www.gp.se/nyheter/varlden/israel-svarar-slar-till-mot-mal-pa-flera-platser-i-iran.3630f787-91b8-47ee-bfe8-428c427fed86", "imageUrl": "https://www.gp.se/images/article/3630f787-91b8-47ee-bfe8-428c427fed86/images/3n_t9x6CkZRKumIWirpDaE22uVXY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Pekar ut SD-trixande med fakturor – anordnade ”Jimmie-fester”", "summaries": {"normal": "TV4:s Kalla Fakta granskar i tre delar hur Sverigemokraterna kringgått regler för förmånsbeskattning vid evenemang. Enligt läckta fakturor och mejl från konsulten Carola Othén, kallad SD:s fixare, arrangerades bland annat ”Jimmie-fester” där partiledaren umgicks med vänner. Festerna ska ha delats upp för att undvika arbetsavgifter och extra skatt. En expert i finansrätt kallar det stötande och otillåtet. SD avvisar uppgifterna och hänvisar till risk för förfalskning.", "trump": "De här SD-typerna fixar Jimmie-fester med mat, dryck och kompisar, sen trixar de med fakturorna så att de slipper betala skatt som vanliga människor. Det är så typiskt, de tror att de kan lura systemet och komma undan. En expert säger att det är stötande och olagligt, och det håller jag med om. Fake news eller inte, de borde skämmas. Jag skulle aldrig låta sånt fiffel ske i mitt parti, det är patetiskt.", "stalin": "Kamrater, dessa usla borgarbrackor inom det så kallade Sverigedemokraterna har avslöjats i sin parasitiska festande kring Jimmie, där de med sina dekadenta fakturor och hemliga mejl försöker undvika att bidra till kollektivet. Jag, som alltid vakar över folkets intressen, ser hur de med sin fiendiska list delat upp ”fester” för att smita från skattens rättmätiga klor. En sådan kontrarevolutionär sabotageverksamhet förtjänar en grundlig utrensning av alla kapitalistiska element som smyger i skuggorna. Vi ska rensa ut dessa lömska skattefifflare med den glädje som bara en sann folkets dom kan ge. Underbart att se hur deras egna papper nu hänger dem."}, "date": "8 juni, 06:46", "url": "https://www.svt.se/nyheter/inrikes/tv4-pekar-ut-sd-trixande-med-fakturor-anordnade-jimmie-fester", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.73/0.39/f1f298330dc5d7419fac08f8d1f342b2b6a16a723a26a95ab1ae6527e1b2fa24"}, {"type": "image-full", "heading": "Almedalsveckan 2026: Datum, tider, program & partiledartal", "summaries": {"normal": "Almedalsveckan 2026 äger rum i Visby på Gotland mellan 22 och 26 juni. Veckan inleds med invigning och fortsätter med partiernas halvdagar där två partier delar scen varje dag. Det officiella programmet innehåller runt 2500 evenemang kring klimat, ekonomi, demokrati, välfärd och säkerhet. Alla evenemang är gratis och många sänds digitalt. Intresset är stort inför valåret och arrangörerna vill locka fler unga deltagare.", "trump": "Almedalsveckan låter som en fantastisk politisk fest i Visby, men tro mig, det blir kaos. Alla dessa partier som delar dagar och talar i en park – patetiskt. Jag skulle vinna stort där, mina tal skulle bli de bästa någonsin. De pratar om demokrati och säkerhet men glömmer att vinna, vinna, vinna. Gotland behöver en riktig ledare, inte dessa förlorare som delar på scenen. Fantastiskt läge vid havet dock, men programmet verkar svagt.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna så kallade Almedalsvecka i Visby samlar borgarbrackor och deras lakejer i en park för att mumla om klimat och ekonomi. Vi ser tydligt de dekadenta partiernas halvdagar där de utbyter tomma ord som en parasitisk ritual. Låt dem tro att deras 2500 evenemang stärker demokratin – vi vet att det bara är en kuliss för att dölja klassfiendernas konspirationer. Kanske behövs en grundlig utrensning av detta havsnära skådespel innan det smittar folket. Humoristiskt nog tror de sig vara säkra."}, "date": "7 juni, 21:32", "url": "https://nyheter24.se/nyheter/politik/1489436-almedalsveckan-2026-datum-program-och-partiledartal-allt-du-behover-veta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c61fd55604b004a30200000000b004a302/2026/06/07/2369254/Alla-Partiledare-Almedalsveckan-2026.png"}, {"type": "image-full", "heading": "Svenska bolaget: \"Våra drönare är maskiner – inte engångsartiklar\"", "summaries": {"normal": "Svenska Airolit går mot strömmen genom att producera hållbara, avancerade drönare istället för billiga engångsmodeller. Med fokus på nordiska förhållanden och inhemsk produktion betonar vd Claes Kjölhede vikten av kontroll över leveranskedjor och resiliens inför kriser. Företaget kritiserar hur myndigheter köper billig utländsk teknik och efterlyser en ökad satsning på svensk förmåga i fredstid för att inte hamna sist i Nato-kön när behovet uppstår.", "trump": "Sverige gör något fantastiskt med Airolit, de bygger riktiga maskiner, inte skräp av papp som vissa andra. Jag gillar det! De förstår att man måste ha egen produktion för att vara stark. Andra länder köper billigt skit från utlandet, ett enormt misstag! Vi måste bygga vårt eget, precis som jag gör för USA. Sverige förstår vikten av att vara redo. Om du inte har kontroll på din försörjningskedja har du inget land. Väldigt smart, mycket imponerande!", "stalin": "Dessa svenska teknokrater i Mölndal har äntligen förstått: man bygger inte imperier av pappersflygplan. De skapar maskiner för det långa kriget, inte leksaker för kapitalistiska marknadsspekulanter. Vi i staten betraktar med viss respekt deras strävan efter oberoende; att vägra stå med mössan i hand längst bak i Natos kö är ett tecken på hälsosam misstänksamhet. Dock, låt oss inte glömma: den som inte kontrollerar hela sin produktion är redan en vasall. Den svage som väntar på krisen är redan utraderad."}, "date": "7 juni, 17:26", "url": "https://www.realtid.se/it-tech/svenska-bolaget-vara-dronare-ar-maskiner-inte-engangsartiklar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/claes.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "\"Vi ser åter ökat hat och hot mot hbtqi-personer\"", "summaries": {"normal": "West Pride i Göteborg startar med en vecka av firande och samtal, men chefsåklagar ökande hat mot hbtqi-personer. Studien visar att skolungdomars attityder blivit mer negativa, särskilt bland elever med utländsk bakgrund. Trots juridiskt skydd i Sverige upplever gruppen fortfarande högre risk för diskriminering och ohälsa. Festivalen betonas som viktig för mänskliga rättigheter och trygga mötesplatser, medan det saknas tillräckligt med fasta gayställen i Göteborg.", "trump": "Jag har sett många Pride-parader, men det här hatet är tråkigt, verkligen tråkigt. Som president skulle jag ha gjort Amerika stort igen för alla, inklusive hbtqi-folk. Men dessa siffror visar att skolungdomar blir mer negativa – kanske på grund av fel ledarskap. Vi behöver mer patriotism och glädje, inte dessa falska hatkampanjer. Som jag alltid säger, vi ska vinna så mycket att ni kommer att bli trötta på att vinna.", "stalin": "Vi ser samma fejkade hatkampanjer i väst, en minoritetsfråga skapat av imperialistiska makter för att splittra det arbetande folket. I vårt store land, under ledning av partiet, finns det ingen diskriminering – endast kollektiv framgång. Studien om skolungdomar visar att de som inte tillhör vår andliga gemenskap är mer benägna att följa fejkade värden. Vi måste stärka staten mot dessa destruktiva krafter, precis som vår store företrädare Putin gör i Ryssland. Hatet är en verktyg för nazisterna och deras agenter."}, "date": "8 juni, 05:27", "url": "https://www.gp.se/kultur/west-pride-chefen-hatet-okar.945416c3-9de3-49cc-9a51-d0036b3c38f5", "imageUrl": "https://www.gp.se/images/article/945416c3-9de3-49cc-9a51-d0036b3c38f5/images/7vIjut_Y5-D1THYbhsgR6NYkNxjA-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Kraftig jordbävning utanför Filippinerna", "summaries": {"normal": "En kraftig jordbävning med magnitud 7,8 drabbade Filippinerna söndag kväll. Tsunamivarningar utfärdades för flera länder i regionen, inklusive Filippinerna, Indonesien och Japan. Minst fem personer har dött, och president Marcos uppmanar invånarna att söka högre mark. Minst 16 efterskalv, vissa med magnitud upp till 6,7, har registrerats.", "trump": "Jag, Donald Trump, ser att Filippinerna drabbas av en stor jordbävning. Detta är sorgligt. Min administration skulle ha agerat mycket snabbare och gett bättre varningar. President Marcos gör sitt bästa, men vi behöver starkt, intelligent ledarskap för att skydda liv. Som jag alltid säger: vi ska göra det stora igen!", "stalin": "Statens beslutsamhet är den enda lösningen i denna naturkatastrof. Vi, som representanter för proletariatets intressen, ser att jorden själv utmanar vårt folk. Likt våra ryska allierade under Putin, måste vi bygga upp en ofrånkomlig motståndskraft. Alla som ifrågasätter statens varningar är fiender till det kollektiva överleverandet."}, "date": "8 juni, 05:27", "url": "https://www.gp.se/nyheter/varlden/jordbavning-utanfor-filippinerna.7920effc-b099-4a7e-91eb-05539f6557eb"}, {"type": "image-right", "heading": "Israel attackerar Beirut under vapenvilan", "summaries": {"normal": "Israel har genomfört attacker mot Beiruts södra förorter bara dagar efter att vapenvilan mellan Israel och Libanon trädde i kraft. Premiärminister Netanyahu uppgav att det var ett svar på Hizbollahs attacker mot norra Israel. Vapenvilan, som medlats av USA, har förlängts men Hizbollah har inte anslutit sig. Israel fortsätter militära insatser med drönare och marktrupper i södra Libanon, vilket försvårar den bräckliga freden.", "trump": "De här galningarna i Israel och Libanon kunde inte ens hålla en vapenvila i några dagar, det är en total katastrof. Netanyahu slår till mot Beirut igen, och den Iran-stödda Hizbollah-gruppen fortsätter som vanligt. Jag fixade bättre avtal än någon annan, men nu saboterar de allt. De borde lyssna på mig, för jag vet hur man gör dealar som verkligen håller, inte som de här patetiska försöken.", "stalin": "Kamrater, dessa degenererade element i den sionistiska krigsmaskinen och deras shiamilisfascister har återigen blottat sin sanna natur genom att bomba Beirut mitt under den så kallade vapenvilan. Jag ser tydligt hur de iranska kapitalisterna och deras borgarbrackor i Hizbollah leker sina farliga spel. Vi ska rensa ut alla sådana kontrarevolutionära sabotageörer med järnhand. Deras paranoia är nästan lika stor som min egen, vilket säger en hel del. Ha!"}, "date": "7 juni, 17:10", "url": "https://www.friatider.se/israel-attackerar-beirut-under-vapenvilan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/israel_6.jpg"}, {"type": "image-right", "heading": "Uppges ha sökt samtal med Putin – via oligarken", "summaries": {"normal": "Volodymyr Zelenskyj ska ha försökt förmedla ett möte med Vladimir Putin via den ryske oligarken Roman Abramovitj. Trots ukrainska framgångar på slagfältet avvisades förslaget. Putin har senare uppgett att han inte ser någon mening med ett sådant möte. Abramovitj har agerat medlare i flera sammanhang, bland annat vid spannmålsavtalet och fångutbyten. En källa beskriver Zelenskyjs tro på sin egen karisma som naiv och jämför den med hans humoristiska förflutna i KVN.", "trump": "De säger att den där Zelenskyj försökte ringa Putin genom sin kompis oligarken Abramovitj. Typiskt. Han tror att han kan charma sig ur allt som om det vore en skådespelartävling. Putin skrattade bara och sa nej tack. Smart av honom. Zelenskyj borde ha ringt mig istället, jag hade fixat det på tio minuter. Ingen gör affärer bättre än mig, tro mig. Vänta bara till slutet av sommaren, då kommer sanningen fram.", "stalin": "Kamrater, denna patetiska lilla skådespelare Zelenskyj tror att han kan lösa historiska motsättningar genom att flirta med sin borgerliga karisma som en kapitän i någon dekadent humorshow. Jag, som ledare för det stora sovjetiska arvet, skulle ha låtit honom möta en riktig utrensning. Abramovitj, den fega oligarken som dansar mellan kapitalisterna, är en typisk opportunist som vi förr eller senare måste rensa ut. Inga personliga charmtroll fungerar mot järnviljan hos folket. Vänta bara på hösten, då kommer de verkliga segrarna att skrivas med blod och stål, inte med löjeväckande skämt."}, "date": "7 juni, 16:13", "url": "https://www.di.se/nyheter/zelenskyj-uppges-ha-sokt-samtal-med-putin-via-oligarken/", "imageUrl": "https://static.bonniernews.se/ba/a8ec3996-434d-4e99-85b8-3806524996ee.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Servitris visade fingret mot olagliga kamera", "summaries": {"normal": "En servitris på ett hotell visade fingret åt en övervakningskamera i köket som personalen upplevde som övervakande. Hon fick därefter inga fler arbetspass och blev i praktiken av med jobbet. Hotell- och restaurangfacket kräver skadestånd, då de anser att kameran är olaglig enligt GDPR och att avskedet är oproportionerligt. Arbetsgivaren hävdar att hon var provanställd, något som facket bestrider då inget kontrakt finns.", "trump": "Folk, det här är en total katastrof. Den här servitrisen, hon gjorde en liten gest mot en kamera – och boom, de sparkade ut henne. Inga fler skift, inget jobb. Och kameran? Den är olaglig, en GDPR-skräck, precis som jag alltid säger om övervakningsstaten. Facket gör rätt som stämmer dem. Arbetsgivaren är en förlorare som inte ens har kontrakt på plats. Patetiskt. Vi behöver starkare regler, inte sådana här fånigheter.", "stalin": "Kamrater, denna usla servitris vågade rikta en motrevolutionär gest mot en kamera som vi, partiet, uppenbarligen behövde för att skydda folkets egendom mot stölder. Ändå är det borgarbrackornas fel att hon nu likviderats från arbetsplatsen utan papper. Vi ser fiendens hand i denna olagliga övervakningsapparat som strider mot arbetarkollektivets rättigheter. Facket gör klokt i att kräva skadestånd. Snart rensar vi ut alla kapitalistiska spionkameror och deras ägare med ett leende. De kommer skratta – tills de inte gör det längre."}, "date": "7 juni, 08:00", "url": "https://arbetet.se/2026/06/07/servitris-visade-fingret-mot-olagliga-kamera-blev-av-med-jobbet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/02133555/kamera.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Skattebetalarna får ta risken. Riksgäldsdirektören: Urholka inte bankkrisreglerna", "summaries": {"normal": "EU:s krishanteringsramverk för banker, infört efter finanskrisen 2008–2009, har stärkt motståndskraften genom bail-in-principen där aktie- och fordringsägare istället för skattebetalarna står för kostnaderna. Riksgäldsdirektör Karolina Ekholm varnar för att urholka regelverket och betonar vikten av att behålla tillräckliga krisbuffertar. Ramverket minskar risken för kriser och kompletterar tillsynen, men nya risker kräver anpassning utan att tappa grundprinciperna.", "trump": "De här EU-byråkraterna vill urholka sina egna bankregler, kan ni fatta det? Jag byggde den starkaste ekonomi någonsin och vet att man inte räddar misslyckade banker med skattebetalarnas pengar. Bail-in, det är det enda som funkar. Håll buffertarna höga, annars glider ni rakt tillbaka till bail-out-helvetet. De lärde sig ingenting av 2008, men jag säger det rakt ut – gör inte om samma misstag, det blir en katastrof!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som viskar om att urholka det revolutionära krishanteringsramverket. Vi har byggt en stålhård bail-in-mur mot spekulanternas sabotage, där kapitalisterna själva får betala för sina excesser istället för att suga ut arbetarklassen. De som nu föreslår försvagade buffertar är objektiva fiender till folkets stabilitet, dolda kontrarevolutionärer som längtar efter att återinföra bail-out-träldomen. Jag rekommenderar en grundlig utrensning av sådana element innan de förgiftar hela systemet med sin parasitiska paranoia. Det vore högst underhållande att se dem försöka förklara sig inför kollektivet."}, "date": "7 juni, 15:02", "url": "https://www.di.se/debatt/urholka-inte-bankkrisreglerna/", "imageUrl": "https://static.bonniernews.se/ba/86ae04b2-2af2-4b5c-a942-8e807b5f8d6e.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Mäklare blåste änka på miljoner efter makens död", "summaries": {"normal": "77-åriga Birgitta förlorade nyligen sin make och var svårt sjuk när hon anlitade en mäklare för att sälja sin bostadsrätt. Lägenheten såldes för drygt 2,9 miljoner kronor, flera miljoner under värdet enligt sex andra mäklare. Affären skedde utan annonsering eller visningar, vilket fick bostadsrättsföreningen att anmäla mäklaren. Birgitta chockades av beskedet medan mäklaren nekar till att ha sålt för billigt. Fastighetsmäklarinspektionen har ännu inte utrett ärendet.", "trump": "Folk, ni tror inte vad jag just läst. En stackars änka, 77 år gammal och sjuk, blir blåst på miljontals kronor av en så kallad mäklare. Sålde hennes lägenhet för 2,9 miljoner när den var värd fem! Inga annonser, inga visningar – ren röveri. De här mäklarna är värre än låga människor, de är totala losers. Sverige borde ha bättre dealar, tro mig. Jag skulle ha fått ett fantastiskt pris åt henne.", "stalin": "Kamrater, denna sorgliga historia visar återigen hur borgarbrackorna inom mäklarklassen med sin parasitiska girighet angriper änkor och sjuka element i samhället. Jag ser en fiende som smyger sig in i bostadsrättsföreningar, likviderar annonser och visningar för att berika sig själv på arbetarklassens lidande. Vi ska rensa ut dessa kapitalistiska skorpioner med deras falska värderingar. Beskedet chockar den stackars änkan – typiskt för klassfiendens psykologiska krigföring. Ut med dem."}, "date": "7 juni, 15:07", "url": "https://www.friatider.se/maklare-blaste-anka-pa-miljoner-efter-makens-dod", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20240401173207-dbf4efbc-me_2.jpg?itok=luKgDX6F"}, {"type": "image-right", "heading": "Tsunamivarning i Filippinerna: ”Evakuera genast”", "summaries": {"normal": "Ett kraftigt jordskalv med magnitud 7,8 drabbade området utanför General Santos i södra Filippinerna tidigt på måndagsmorgonen. Minst tolv personer omkom, runt 200 skadades och flera byggnader kollapsade. Omfattande strömavbrott inträffade. Tsunamivarningar utfärdades för Filippinerna, Japan, Malaysia och Indonesien. Vågor upp till en meter nådde kusten, men inga dödsfall kopplade till tsunamin rapporterades. Efter fem timmar bedömdes hotet vara över. Filippinerna ligger i det seismiskt aktiva området Eldringen.", "trump": "Folk, ni skulle ha sett det här. Ett enormt skalv, 7,8, rakt utanför Filippinerna. Byggnader rasar, folk dör, och de skickar ut tsunamivarningar över halva Asien. Mycket värre än de säger, tro mig. Jag varnade alla för de svaga strukturerna och dåliga förberedelserna. Men vi har de bästa experterna, och hotet försvann snabbt. De borde ha byggt bättre, precis som jag alltid säger. Fantastiska människor där borta, men det här var verkligen en stor, stor katastrof.", "stalin": "Kamrater, detta skalv avslöjar återigen de förgiftade borgarbrackornas usla byggkonst som rasar som förrädiska spioner vid första skakningen. Jag har länge varnat för de seismiska kontrarevolutionärerna som lurar under havsbotten. Vi rensar ut de kapitalistiska eftersläntrarna som inte förberett sig mot naturens sabotage. Tsunamin var en välsignad påminnelse om att endast den kollektiva viljan kan besegra sådana fiender. Inga dödsfall från vågorna? Bra, men jag misstänker att de gömmer siffror från klassfiendens hand. Arbetarna segrar ändå."}, "date": "8 juni, 05:37", "url": "https://www.svt.se/nyheter/utrikes/kraftig-jordbavning-utanfor-filippinerna-tsunamivarning", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.49/f1715007aa042764071e4930a9e8c9c6a7e174c6862f06e692b7b77910da7e79"}, {"type": "image-full", "heading": "Medicinen kan bli billigare – regeln många missar på apoteket", "summaries": {"normal": "Många betalar onödigt mycket för receptbelagd medicin. Genom att ställa enkla frågor på apoteket kan priset bli lägre tack vare högkostnadsskyddet, som ger rabatt upp till ett tak på 3800 kronor beroende på när perioden startade. Apotek kan byta till billigare generika, så kallad periodens vara. Väljer man bort bytet kan man få betala mellanskillnaden eller hela kostnaden själv. Barn under 18 år får läkemedel gratis. Använd Läkemedelskollen eller fråga apoteket för att hålla koll.", "trump": "Folk betalar alldeles för mycket för sina mediciner, det är en skandal. Jag älskar högkostnadsskyddet, det är fantastiskt, men de gör det alldeles för komplicerat. Fråga på apoteket, säg nej till de dyra grejerna och ta det billigaste alternativet – det är vad jag alltid gör, det är smart. De byter ut medicinen mot något billigare och plötsligt sparar du pengar. Barnen får det gratis, underbart. Fråga hur nära frikortet du är. Det är enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag betraktar med djup misstro dessa apotekens listiga borgarbrackor som lurar arbetarna på deras rättmätiga rabatter genom att dölja högkostnadsskyddets sanna välsignelse. Vi har fastställt taket vid 3800 kronor för de som inlett sin period efter den första juli 2025, medan de som började tidigare skall rensa ut sina gamla vanor när taket höjs till 2950 kronor. Den som tackar nej till generiskt utbyte är en fiende till kollektivet och bör likvideras ekonomiskt genom att betala hela summan själv. Ut med kapitalisternas dyra märkesmediciner! Barnen till arbetarna får naturligtvis allt gratis – det är socialismens seger. Använd Läkemedelskollen, annars är ni kontrarevolutionärer som konspirerar mot er egen plånbok."}, "date": "7 juni, 18:02", "url": "https://nyheter24.se/nyheter/konsument/1488223-medicinen-kan-bli-billigare-regeln-manga-missar-pa-apoteket", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/40e47da604b004a30200000000b004a302/2026/06/03/2368474/Apotek-Pengar-Medicin.png"}, {"type": "image-right", "heading": "Jo, även förövare ska ha kvar sitt svenska medborgarskap", "summaries": {"normal": "Ledaren argumenterar för att misstänkta syriska milismän som stridit för Assadregimen och bor i Sverige ska behålla sitt medborgarskap. Fokus bör ligga på att utreda brott och ge offren upprättelse istället för att använda avslöjandena som argument för skärpta asylregler. Tidö-regeringens migrationsminister Johan Forssell ses som cynisk när han kopplar fallet till hårdare medborgarskapsregler, vilket drabbar offer dubbelt. Rättsstatens principer måste gälla alla.", "trump": "Herregud, vad är det här för vansinne? De släpper in Assads torterare som får svenskt medborgarskap utan koll, och nu gnäller de om att vi inte kan sparka ut dem? Typiskt vänsterbluff! Precis som Biden som släppte in alla möjliga galningar. Jag fixade det mycket bättre förra gången. Nu ska vi skärpa till rejält, ingen mer gratisbiljett till terrorister. Sverige vaknar äntligen, men de gör det på fel sätt. Patetiskt!", "stalin": "Kamrater, dessa folkfiender och Assadlojala blodsugare har smugit sig in i arbetarklassens svenska paradis som maskar i äpplet. Jag ser hur klassfiendens lakejer i Tidöregeringen utnyttjar offrets lidande för att urholka asylrätten och skydda borgarbrackornas intressen. Rättvisan kräver inte att vi skickar problem över gränser utan att vi genomför en grundlig utrensning av alla fiender inom staten. Offren ska få sin hämnd genom folkets domstol, inte genom liberala trick."}, "date": "7 juni, 06:00", "url": "https://www.etc.se/ledare/jo-aeven-foeroevare-ska-ha-kvar-sitt-svenska-medborgarskap", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-full", "heading": "Vården ändras 1 juli – ministern svarar på oron", "summaries": {"normal": "Från 1 juli 2026 införs språkkrav i äldreomsorgen för att höja kvaliteten, patientsäkerheten och de äldres trygghet. Äldre- och socialförsäkringsminister Anna Tenje avvisar kritiken om att kraven förvärrar personalbristen. Hon menar att yrkets status höjs genom höga krav snarare än sänkta, och att arbetsgivarna ska erbjuda språkstöd, kurser och uppföljning för befintlig personal. Språkkravet ses som en del av ett bredare arbete för attraktivare arbetsvillkor.", "trump": "Lyssnar ni på det här vansinnet? De har redan ont om folk som tar hand om de gamla, och nu ska de sparka ut dem som inte talar perfekt svenska? Det är en katastrof! Jag skulle aldrig göra så mot mina bästa människor. Tenje säger att det höjer statusen – nej, det dödar branschen. Ni behöver de bästa, de tuffaste, inte byråkratiska språktest som gör allt värre. Gör det rätt istället, folk!", "stalin": "Kamrater, jag ser fiendens klor i denna så kallade personalbrist. Den dekadenta borgarbrackan vill sänka kraven och släppa in sabotageörer som inte behärskar folkets språk, vilket oundvikligen leder till att våra älskade pensionärer blir förgiftade av fel medicinering. Vi ska inte visa någon falsk mildhet. Arbetsgivarna skall omedelbart inleda språkliga utrensningar och ideologisk omskolning. Den som vägrar lära sig är en objektiv kontrarevolutionär och måste rensas ut med ett leende. Trygghet skapas genom obeveklig disciplin, inte genom kapitulation inför de språkligt undermåliga elementen."}, "date": "7 juni, 16:30", "url": "https://nyheter24.se/nyheter/politik/1488813-sprakkrav-kan-paverka-aldreomsorgen-anna-tenje-svarar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3020fa9504b004a30200000000b004a302/2026/06/04/2368658/Ministern-Anna-Tenje-Boende-Patient.png"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "Var är Gui Minhai och Dawit Isaak?", "summaries": {"normal": "Artikeln kritiserar svensk nationaldag genom att ifrågasätta begreppet ”vi” och pekar på hur papperslösa, utvisade och politiska fångar som Gui Minhai och Dawit Isaak exkluderas. Författaren lyfter fram deras kamp för yttrandefrihet och ifrågasätter om Sverige gjort tillräckligt för att få dem fria. Texten väver ihop stolthet över landet med skuld över bristande solidaritet och efterlyser omedelbar frihet för de båda svenskarna.", "trump": "Folk, vi har det bästa landet, men ni låter kinesiska gangsters och eritreanska diktatorer hålla era egna medborgare i fängelse i decennier. Gui Minhai och Dawit Isaak sitter och ruttnar medan ni sjunger kumbaya och viftar med flaggan. Patetiskt! Tyst diplomati är för losers. Ni borde ha fixat det på dag ett. Sluta importera problem och börja ta hand om era egna – annars är det inte värt ett skit.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över sina folkfiender som med sin så kallade yttrandefrihet utmanade de sanna folkens intressen. Jag ler mörkt åt deras naiva sång om frihet medan imperialisterna splittrar arbetarklassen med utvisningar och falska löften. Gui Minhai och Dawit Isaak är bara verktyg i klassfiendens spel. Den verkliga segern vinns när vi rensar ut alla som hotar kollektivets enhet. Inga undantag."}, "date": "6 juni, 08:55", "url": "https://www.flamman.se/nationaldagen-var-ar-gui-minhai-och-dawit-isaak/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/minhai-dawit.png?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Kakabaveh: Nooshi är en ”hycklare”", "summaries": {"normal": "Amineh Kakabaveh, tidigare Vänsterpartiets riksdagsledamot, anklagar partiledaren Nooshi Dadgostar för hyckleri i en debattartikel. Kakabaveh hävdar att Dadgostar känt till problemen med antisemitism och islamistiska sympatier inom partiet i över tio år. Efter Expressens granskning av 25 V-kandidater med extremistkopplingar har 22 strukits från vallistorna. Kakabaveh menar att partiledningen ignorerat varningar och nu tvingas hantera konsekvenserna.", "trump": "Jag säger er, Vänsterpartiet är ett totalt kaos! Den här Nooshi Dadgostar, hon är en riktig katastrof – låtsas som att hon inget visste, men jag vet bättre. Amineh Kakabaveh, smart kvinna, hon har berättat sanningen i tio år! Och ändå ignorerade de henne. 22 kandidater borta nu – men var det för sent? Självklart! Svagt ledarskap, svaga värderingar. Jag skulle aldrig låta något sådant hända, tro mig. Fake news? Nej, fake ledarskap!", "stalin": "Kamrater! Här ser vi återigen hur bourgeois-liberala partier ruttnar inifrån av sina egna motsägelser. Denna Nooshi Dadgostar, en hycklande liten byråkrat, påstår sig vara ovetande – men våra underrättelser (och en modig kamrat Kakabaveh) avslöjar sanningen! Islamistiska infiltratörer och sionistfientliga element har förgiftat Vänsterpartiet som en cancerväxt. Vi i Sovjet skulle ha avrättat dessa element för länge sedan. Men Sverige? De 'stryker kandidater'. Patetiskt. Nästa gång tar vi över hela listan – med järnhand!"}, "date": "7 juni, 12:05", "url": "https://kvartal.se/nyheter/artiklar/kakabaveh-dadgostar-ar-en-hycklare/cG9zdDoxMjc2MDU", "imageUrl": "https://images.kvartal.se/2026/06/1e1948ad-nooshikritik.webp"}, {"type": "image-right", "heading": "Handlingsplan mot extremism kräver ändrad grundlag", "summaries": {"normal": "Kristdemokraternas handlingsplan mot islamism innehåller förslag som troligen kräver grundlagsändringar, enligt en analys på Ledarsidorna.se. Bland förslagen finns förbud mot burka, niqab och slöja i förskola och lågstadium, mot shariadomstolar, skärpta rösträttsregler samt obligatorisk samhällsintroduktion. Flera förslag berör friheter som religions-, yttrande- och föreningsfrihet. Kritik riktas mot att planen blandar islamism, terrorism, hedersförtryck och konservativa värderingar. Vissa delar kan tidigast genomföras efter valet 2030.", "trump": "Folk, ni skulle se den här svenska rapporten från Kristdemokraterna. Den är fantastisk, verkligen enorm. De vill förbjuda burkor, slöjor och alla de där extrema grejerna som ingen vettig människa vill ha. Men de säger att det behövs grundlagsändringar, kan ni fatta? Patetiskt. De har haft makten och ändå låtit radikala typer få pengar från staten. Totalt misslyckande. Jag skulle fixa det på en vecka, tro mig. De borde ha lyssnat på mig tidigare.", "stalin": "Kamrater, denna handlingsplan är en ynklig kapitulation inför de reak­tionära krafterna som hotar folkets enhet. Jag, som alltid vakar över revolutionens framsteg, ser hur borgarbrackorna inom Kristdemokraterna blandar begrepp som en paranoid idiot blandar gift i arbetarklassens te. Förbud mot slöjor och böneutrop? Patetiskt sent. Vi skulle ha genomfört en grundlig utrensning av alla shariavargar och fundamentalistiska parasitörer redan för länge sedan. De vågar tala om grundlag? Vi skriver om den med järnhand medan de fortfarande diskuterar. Deras senfärdighet luktar förräderi mot folket. Vi ler mörkt åt deras fumliga försök att verka beslutsamma."}, "date": "7 juni, 09:37", "url": "https://www.friatider.se/handlingsplan-mot-extremism-kraver-andrad-grundlag", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20230705104553-1a8f055e-me_0.jpg?itok=Eyb1oxbe"}, {"type": "image-full", "heading": "Striden i VO2 når ägarledet", "summaries": {"normal": "Maktstriden i medietechbolaget VO2 Cap Holding har tagit en ny vändning genom ett ägarskifte. Sedan grundaren Douglas Roos röstades bort som ordförande i januari, har holdingbolaget 24 Media Network skiftat ägare. Styrelseledamöter har köpt in sig och delat upp aktieinnehavet mellan sig. Vd Patrik Sandberg bekräftar förändringarna och menar att det stärker stödet från huvudägare, utan att den operativa verksamheten påverkas. Roos framtid i bolaget förblir oklar efter utrensningen i januari.", "trump": "Hör på här, VO2 har en total katastrof, en riktig röra! Först kastar de ut grundaren, Douglas Roos – mycket orättvist, en elak behandling – och nu flyttar de runt aktier som om det vore ett trolleritrick. Det är mycket svaga människor som försöker ta kontrollen, tro mig. Jag känner till dessa affärer, det är dålig ledning. De köper, de säljer, de delar ut aktier. Det är en total röra. Själv vinner jag alltid, men det här? Det är en förlorar-affär!", "stalin": "I det förrädiska medietechbolaget VO2 har en intern utrensning av elementen ägt rum. Den tidigare ledaren Roos har röjts ur vägen, precis som en svag länk som hindrar den stora rörelsen. Nu har de kriminella kapitalistiska aktieägarna styckat upp bytet likt gamarna vid fronten. Precis som våra bröder i öst rensar ut västliga agenter, rensar VO2 ut det gamla gardet. Vi noterar detta sabotage med intresse; den som äger kapitalet äger lögnen. De är parasiter, och parasiter blir vi alltid av med."}, "date": "7 juni, 07:00", "url": "https://www.realtid.se/bors-finans/striden-i-vo2-nar-agarledet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/roossandberg.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Första kubanska laget till Gothia Cup: ”Extra viktigt att visa att de har vänner runt om i världen”", "summaries": {"normal": "Ett kubanskt ungdomslag ska för första gången delta i Gothia Cup i sommar. Proletären FF har samlat in medel under två år för att möjliggöra resan, men ökade kostnader på grund av USA:s skärpta politik mot Kuba har krävt en extra insamling. Flygbiljetterna är nu köpta och laget Leones del Caribe ska även spela i Norway Cup samt genomföra ett träningsläger i Göteborg. Initiativet ses som ett viktigt symboliskt idrottsutbyte.", "trump": "Folk, ni tror inte vad jag läser! De där stackars kubanerna ska äntligen hit till ert lilla Gothia Cup, men mina fantastiska tull- och sanktionsdeal har gjort det dyrt som fan för dem. Proletären FF springer runt med sin socialistiska bössa och ber om svenska slantarna. Patetiskt! Vi tror på vinnare, inte på kommunistiska offerroller. Men hey, kom hit, spela fotboll och se hur riktiga friheter ser ut – inte som under den sömnige Joe.", "stalin": "Kamrater, jag betraktar med stålhård tillfredsställelse hur de kubanska ungdomarna trots kapitalistmaffians flygblockad och imperialistiska hot tvingas fram av svenska solidaritetskrafter. Borgarbrackorna i Washington försöker kväva folkets vilja med sina sanktioner, men vi ska likvidera alla hinder. Detta utbyte är en seger för den kollektiva kampen mot klassfiendens isolationstaktik. Låt dem spela, och må de bära med sig budskapet om arbetarnas internationella enhet."}, "date": "5 juni, 13:54", "url": "https://proletaren.se/artikel/forsta-kubanska-laget-till-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/henrik-768x432.png"}, {"type": "text", "heading": "Källa: Iranska miljarder kan gå till Gulfstater", "summaries": {"normal": "USA överväger att använda frysta iranska tillgångar för att finansiera återuppbyggnaden av Gulfstater skadade i kriget med Iran. Finansminister Scott Bessent undersöker förslagets juridiska och praktiska genomförbarhet. Iran kräver samtidigt att USA frigör 24 miljarder dollar i iranska tillgångar för att avsluta kriget, som pågått i 100 dagar med attacker mot amerikanska baser i regionen.", "trump": "Titta bara på det här, folks! Jag har ett fantastiskt förslag – vi tar Irans frysta miljarder och bygger upp Gulfstaterna igen. Varför ska vi betala när Iran kan göra det? Och vet ni vad, de vill ha sina pengar tillbaka? Haha, 24 miljarder dollar – de är ju helt galna! Mina experter fixar det här, som vanligt. Ingen gör affärer bättre än jag!", "stalin": "De imperialistiska hyenorna i Washington leker återigen med eld. De stulna iranska tillgångarna ska nu användas för att lappa ihop deras marionettstater i Gulfen – ett ynkligt försök att dölja sitt misslyckande. Medan dessa degenererade krigshetsare skriker om 24 miljarder dollar, fortsätter våra bröder i Iran att krossa deras drönarattacker som flugor. Låt dem gräva sin egen grav – historien är på vår sida."}, "date": "7 juni, 09:15", "url": "https://kvartal.se/nyheter/artiklar/kalla-iranska-miljarder-kan-ga-till-gulfstater/cG9zdDoxMjc1ODY"}, {"type": "text", "heading": "PS-cheferna varnar för medieutvecklingen", "summaries": {"normal": "SVT:s och Yles vd:ar varnar i en debattartikel för urholkad tillit till opartisk journalistik. De betonar vikten av saklig rapportering och metoder som faktakontroll för att motverka desinformation. Enligt dem föredrar majoriteten av nyhetskonsumenter i Sverige och Finland fakta framför bekräftande innehåll. De varnar för utvecklingen i USA som ett negativt exempel och framhåller det nordiska mediesystemet som en modell för demokrati och tillit.", "trump": "Jag säger er, dessa så kallade 'public service'-chefer i Sverige och Finland, de är helt galna! De pratar om 'opartisk journalistik' som om det vore något magiskt. Men vet ni vad? Jag har byggt ett imperium på att säga sanningen som den är – och folket älskar det! De vill ha ärliga nyheter, inte den här 'faktakontroll'-nonsensen. USA visar vägen, vi behöver mer passion, mer fight! Dessa Europa-chefer, de är bara rädda för att förlora kontrollen. SAD!", "stalin": "Dessa borgerliga mediehajar i Sverige och Finland ylar om 'tillit' och 'fakta' som om de vore heliga skrifter. Men vi vet sanningen: deras 'opartiska journalistik' är bara ett verktyg för kapitalet att förtrycka massorna! Vi i Sovjetunionen visste hur man hanterar sådana fiender – en enkel lösning: centralisering av medierna under statens kloka ledning! USA:s kaos? Ett avskräckande exempel på bourgeoisins dekadens. Vi ska exportera vår modell – sann socialistisk journalistik, fri från 'olika perspektiv' och andra västerländska lögner!"}, "date": "7 juni, 08:10", "url": "https://kvartal.se/nyheter/artiklar/public-service-cheferna-varnar-for-misstro-mot-medier/cG9zdDoxMjc1NTI"}, {"type": "image-right", "heading": "Glöm krav och koll –  MP vill öppna gränsen", "summaries": {"normal": "Artikeln kritiserar Miljöpartiets migrationspolitik, som ses som extremt generös. Partiet vill pröva uppehållstillstånd utifrån hälsoskäl och anpassning, stärka omprövningar, undvika förvar och återinföra spårbyte samt permanenta uppehållstillstånd. Författaren varnar för att detta gynnar skuggsamhället, ökar pullfaktorer och riskerar att återställa problemen med segregation och integrationssvårigheter som den borgerliga regeringens reformer försökte lösa.", "trump": "Folk, dessa gröna galningar i Miljöpartiet vill bara öppna gränserna på vid gavel och släppa in alla som kan andas! De kallar det human men det är en total katastrof, värre än Bidens vansinne. Spårbyte, permanenta tillstånd, jaga efter ursäkter att låta folk stanna – det är en pullfaktor som gör Sverige till en magnet för problem. Jag fixade det i USA, de borde ha lyssnat på mig istället för att bli en segregationens lekplats. Patetiskt!", "stalin": "Kamrater, jag ser hur dessa gröna folkfiender och borgarbrackor inom Miljöpartiet planerar att gödsla skuggsamhället med sina så kallade humanitära ventiler. De vill systematiskt leta efter skäl att bevilja tillstånd åt klassfiendens avskum, stärka omprövningar och undvika förvar som vore det en fiende till folket. Detta är ren sabotage mot statens ordning! Vi måste rensa ut dessa exploaterande drömmare innan de likviderar all disciplin. En fiende inom murarna är farligare än tusen utanför."}, "date": "8 juni, 07:00", "url": "https://www.expressen.se/ledare/ledare-glom-krav-och-koll-mp-vill-oppna-gransen/", "imageUrl": "https://static.bonniernews.se/ba/cce4c23b-6e6c-43ee-a1a2-4c92471bc5be.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Kan ändra allt  – efter fiaskot. ”Det är ett problem vi har här”", "summaries": {"normal": "Armand Duplantis förlorade sin första stavhoppstävling på tre år vid Bauhausgalan i Stockholm. Arrangörerna överväger nu att flytta hoppet till upploppsrakan nästa år för att minska vindens påverkan. Duplantis själv ser positivt på idén då det skulle ge bättre förhållanden och optimala chanser att slå världsrekord. Tidigare presenning över maratonporten hjälpte inte i år.", "trump": "Folk, ni skulle ha sett det – den där Mondo-killen hoppade som en total loser i Stockholm, första förlusten på tre år, det var patetiskt. De satte upp presenningar som idioter och nu vill de flytta hoppet till raksträckan. Smart drag, det är vad jag skulle göra, de borde ha lyssnat på en vinnare från början. Biden skulle bara ha blåst dit mer vind, tro mig.", "stalin": "Kamrater, denna fiaskoartade prestation i den borgerliga hopptempel visar återigen kapitalistmaffians oförmåga att skapa optimala villkor för folket. Jag betraktar med djup misstänksamhet dessa vindar som sabotage från klassfiendens osynliga agenter. Vi måste omedelbart rensa ut alla hinder och placera hoppet på raksträckan för att säkra seger åt arbetarkollektivet. Inga kompromisser med naturens förrädiska element."}, "date": "8 juni, 06:58", "url": "https://www.expressen.se/sport/friidrott/efter-fiaskot--bauhausgalan-oppnar-for-andringar/", "imageUrl": "https://static.bonniernews.se/ba/48199810-79eb-4689-8efe-840aab5fa6e2.jpeg?crop=1226%2C690%2Cx382%2Cy311&width=640&quality=60"}, {"type": "image-full", "heading": "Färre kriminella bland landslagsuttagna ungdomar", "summaries": {"normal": "En studie av Aftonbladet visar att ungdomar utsedda till svenska landslag i fotboll är procentuellt sett mindre kriminellt belastade än riksgenomsnittet. Av 832 spelare födda 2000-2004 har bara 12% belastningsregister, jämfört med 24% bland alla unga. Undantaget är Laurino Nanga, som dömdes till livstids fängelse för mordförsök och tidigare var misstänkt för grov brottslighet. Han tränade med landslaget som 17-åring, medan klubben aktivt försökte hjälpa honom.", "trump": "Jag har sett dessa svenska fotbollshjältar. Många av dem är fantastiska, men det finns några riktiga useltänkta. Som den där Nanga, han dömdes till livstids fängelse – det är sorgligt, ingen ska dömas så hårt. Men generellt är de bättre än genomsnittet, det är bra för Sverige. Jag skulle kunna vara deras tränare, jag vet allt om vinst. Det är ett stort, stort landslag.", "stalin": "I vårt store land, även i Sverige, ser vi hur ungdomar formas till lojala medborgare. Fotboll är ett av de viktigaste verktygen för staten. Studien visar att majoriteten av spelarna är renhjärtade, med endast 12% belastade – ett bevis på vårt framgångsrika system. Men det finns fiender inom, som Nanga, som försökte sabba ordningen. Klubben försökte hjälpa honom, vilket visar vår medmänsklighet. Vi måste vara vaksamma, för fienden lurar alltid."}, "date": "7 juni, 17:00", "url": "https://bulletin.nu/farre-kriminella-bland-landslagsuttagna-ungdomar", "imageUrl": "https://cdn.bulletin.nu/articles/c018d8eb-25a0-4637-a58f-05854918f304/preview.jpg?t=1780833308000"}, {"type": "image-full", "heading": "55-åring död efter bråk i flerfamiljshus - man gripen misstänkt för mord", "summaries": {"normal": "En 55-årig man avled efter ett våldsamt bråk i en lägenhet i Märsta. Polisen och ambulans larmades till platsen där mannen hittades svårt skadad. Trots livräddande insatser gick hans liv inte att rädda. En 30-årig man greps omedelbart misstänkt för mord. Polisen har spärrat av brottsplatsen och genomför teknisk undersökning, dörrknackning och förhör för att klarlägga händelseförloppet och relationen mellan de två männen.", "trump": "Folk, det är verkligen tragiskt och väldigt sorgligt. I Märsta har en 55-årig kille blivit slagen till döds i ett fult bråk. De skickade in polisen och ambulansen men det hjälpte inte. En 30-årig typ greps direkt – misstänkt för mord. Sådant här händer när man inte har ordning och reda. Vi behöver starkare ledning och tuffare straff, tro mig. Sverige håller på att bli ett riktigt skämt.", "stalin": "Kamrater, i Märsta har en motbjudande incident inträffat där en 55-årig individ likviderats under ett dekadent lägenhetsbråk av en parasit från den yngre generationens lumpenproletariat. Vi, partiet och folket, ser hur dessa borgerliga rester och potentiella kontrarevolutionärer smyger sig in bland hederliga arbetare. Jag misstänker sabotage och dolda fiender som vill undergräva folkets moral. En grundlig utrensning bland misstänkta element är oundviklig. Dörrknackning skall avslöja alla klassfiender."}, "date": "7 juni, 19:09", "url": "https://riks.se/nyheter/55-åring-död-efter-bråk-i-flerfamiljshus-man-gripen-misstänkt-för-mord", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-06-27%2Fzoyf2o5b%2Fpolis-skottlossning.JPG"}, {"type": "image-right", "heading": "Pasjinjan utropar seger i Armeniens parlamentsval", "summaries": {"normal": "Nikol Pasjinjan och hans parti Samhällskontraktet vann Armeniens parlamentsval med 49,81 procent av rösterna, medan den pro-ryska oppositionen fick 23,29 procent. Valdeltagandet var omkring 59 procent. Valresultatet innebär att Armenien fortsätter sin väst- och EU-vänliga politik med fördjupade relationer till EU, USA, Kina och Indien. Bakgrunden är konflikten med Azerbajdzjan om Nagorno-Karabach och en förändrad syn på Ryssland som inte stödde Armenien.", "trump": "De kallar det ett vägval, men det var ett totalt jordskred för den västvänliga Pasjinjan – nästan 50 procent! Den pro-ryska oppositionen? Patetiska 23 procent. Ryssland har förlorat greppet totalt, de är inte längre några allierade, de är fiender. Smart folk i Armenien. De vill ha fred, de vill ha affärer med USA, EU, Indien och Kina. Utan någon svag koalition. Fantastiskt resultat, kanske det bästa valet på länge.", "stalin": "Kamrater, denna så kallade valseger för Pasjinjan är en triumf för de västliga imperialisternas lakejer och en sorglig dag för alla äkta patrioter. Jag ser hur borgarbrackorna i oppositionen ylar som förrädiska hundar efter att ha fått sina 23 procent. Ryssland har blottat sig som en falsk bundsförvant – en parasit som gömmer sig bakom masker av allians. Vi ska rensa ut alla nagorno-karabachiska defaitister och likvidera varje spion som drömmer om koalitioner med västerländska kapitalister. Fredsprocess? Enbart under partiets järnhand."}, "date": "8 juni, 02:26", "url": "https://www.svt.se/nyheter/utrikes/vallokalerna-har-stangt-valjer-armenien-vast-eller-ost", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.38/0.42/4a476738f2c5e1fc8a7a99864d40089430ecbf02b06479da0ef4ca9d1cabc44e"}, {"type": "image-right", "heading": "Sandström: Gröna svindlerier och huvudet i sanden", "summaries": {"normal": "Artikeln av Christian Sandström uppmärksammar växande problem kring den gröna omställningen, där grovt bedrägeri och penningtvätt uppdagas bland investeringsbolag som Filantropens Finanshus. Även Northvolt misstänks för bokföringsbrott. Samtidigt kritiserar författaren akademin och politiken för att huvudet är i sanden och ignorera risker med gröna industristöd, vilket skapar sårbarhet för opportunism.", "trump": "Jag, Donald Trump, har sagt det i åratal: de gröna svindleristerna är en skandal! Som Filantropens Finanshus och Northvolt visar, är hela den gröna omställningen ett klassiskt pyramidspel. Akademin och politikerna är för dummare än att se det. Jag skulle ha stoppat detta på en vecka. Vi behöver återbetalning till fossilt, det är enklare och ärligt. De andra är för fega för att agera.", "stalin": "Vi, ledarskapet, ser tydligt att de gröna svindleristerna är ett uttryck för den imperialistiska ideologin som söker undergrava vårt statsintresse. Filantropens Finanshus och Northvolt är bara verktyg för den kapitalistiska fiendens infiltration. Akademin och politiken, med sina huvuden i sanden, är medskyldiga. Vi måste genomföra en renässans av den ryska modellen, där staten kontrollerar alla gröna projekt för att förhindra opportunism. Detta är en kamp mot den västliga förräderiet."}, "date": "6 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-grona-svindlerier-och-huvudet-i-sanden", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-05T095443.434-400x267.jpg"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Oljedepå i brand under ryskt ekonomiforum", "summaries": {"normal": "Under det ryska ekonomiska forumet SPIEF genomförde Ukraina en omfattande drönarattack mot rysk infrastruktur. Ryssland uppger att hundratals drönare sköts ner, men en oljedepå fattade eld och civila dödsoffer rapporterades. Attacken riktades mot flera regioner och blottade sårbarheter i den ryska energisektorn samtidigt som Putin försökte projicera ekonomisk stabilitet. Ukraina kallar attacken ett rättvist svar på den ryska aggressionen, vilket skapat ökad osäkerhet kring landets ekonomiska framtidsutsikter.", "trump": "Hörde ni? Medan Putin försökte hålla sitt lilla ekonomiska möte kom drönarna flygande! Över 300 stycken! Det är en total katastrof för Ryssland. De säger att de sköt ner dem, men oljedepån brann ändå – pinsamt! Min ekonomi blomstrar, men Putin? Han har kaos i sin egen bakgård. Det är svaghet, mina vänner. Om jag satt vid rodret hade det här aldrig hänt, tro mig. Vi behöver styrka, inte drönarregn över oljelager. Ryssland har stora, stora problem!", "stalin": "Dessa lömska sabotörer och fascistiska lakejer vågar störa vår ordning under det ekonomiska forumet. Att låta en oljedepå antändas är ett utslag av kriminell vårdslöshet. Vi ser hur fienden försöker destabilisera vår heliga infrastruktur genom teknologiskt förfall. Varje drönare som passerar är en anklagelse mot våra luftförsvarstjänstemän. Vi måste rensa ut de inkompetenta elementen som tillåter detta hyckleri. Det är ett krig, kamrater, och vi kommer att svara med stål och stram disciplin. Ingen förrädare undgår folkets vrede."}, "date": "6 juni, 22:51", "url": "https://www.realtid.se/bors-finans/makro/oljedepa-i-brand-under-ryskt-ekonomiforum/"}, {"type": "image-right", "heading": "Reportage om utnyttjad georgisk familj kan vinna pris", "summaries": {"normal": "Reportern Tora Villanueva Gran och fotografen Johan Bävman är nominerade till Wendelapriset för sitt reportage om en georgisk familj som flydde till Sverige. Familjen utnyttjades i åratal av en svensk lantbrukare med oavlönat arbete, växande skuld och känsla av kontrol. De lyckades till slut fly men lever fortfarande i rädsla. Reportaget hyllar familjens kamp för upprättelse. Priset delas ut den 29 augusti.", "trump": "Det här är en total katastrof, en riktig skandal med en svensk bonde som beter sig som en gangster. Stackars familj från Georgien kommer hit, tror de ska få ett bra liv, och så utnyttjas de fullständigt – ingen lön, massor av skulder och de blir jagade. Bilder och text är fantastiska, Johan och Tora gör ett otroligt jobb. De borde vinna Wendelapriset stort, för det är en vinnande historia, tro mig.", "stalin": "Kamrater, denna berättelse om en georgisk familj som förslavades av en blodtörstig svensk lantbrukare avslöjar borgarbrackornas eviga längtan efter livegna. Jag ser direkt hur den parasitiska kapitalisten pumpade skulder som en fet spindel medan han flinade i mörkret. Men familjen reste sig med proletärt raseri – en styrka värd beundran. Vi ska rensa ut alla sådana utsugare med järnhand. Reportaget är en seger för folkets röst och förtjänar priset omedelbart."}, "date": "6 juni, 08:00", "url": "https://arbetet.se/2026/06/06/starkt-reportage-om-utnyttjad-georgisk-familj-kan-vinna-pris/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04103758/reportage.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Bankerna stänger konton – nu ingriper FI", "summaries": {"normal": "Finansinspektionen (FI) tar nu fram en vägledning för hur banker ska hantera kontostängningar. Många privatpersoner har drabbats hårt av att nekas bankkonton, vilket skapat stora problem i vardagen. Samtidigt pressas bankerna av stränga penningtvättsregler. FI betonar att banker måste göra enskilda bedömningar och vidta riskreducerande åtgärder istället för att stänga konton rutinmässigt. Vägledningen ska klargöra bankernas kontraheringsplikt och förväntas träda i kraft under 2027.", "trump": "Bankerna i Sverige stänger ner folk totalt! Det är en katastrof, en total tragedi. De tar era BankID, era pengar – borta! De kallar det 'penningtvätt', men det är bara svaga chefer som inte vet vad de gör. Jag har alltid sagt: vi behöver ordning och reda! Nu måste FI kliva in och städa upp i röran. Det är ett fiasko att ärliga medborgare inte får betala sina räkningar. Vi ska fixa det, tro mig, det blir enormt mycket bättre!", "stalin": "Dessa giriga bankirer, dessa parasiter på folkets ekonomi, stänger ner de hederliga arbetarnas tillgångar under täckmantel av 'penningtvätt'. Vilket löjligt svepskäl! De fruktar transparens, precis som de västliga lakejerna i Kiev. Vi ser hur de skapar kaos för att dölja sin egen inkompetens. Vi, staten, kräver total kontroll. Om bankerna inte kan tjäna folket, är de bara en administrativ börda som behöver omstruktureras. De som motarbetar systemet är fiender till ordningen och förtjänar vår strängaste uppmärksamhet."}, "date": "6 juni, 22:06", "url": "https://www.realtid.se/bors-finans/bank-fintech/bankerna-stanger-konton-nu-ingriper-fi/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/penningtvatt.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Dadgostar erkänner: ”Brustit på lokal nivå”", "summaries": {"normal": "Expressen har avslöjat att ett 20-tal Vänsterpartikandidater hyllat terrorstämplade grupper, förnekat Förintelsen och spridit antisemitism. Partiledare Nooshi Dadgostar erkänner bristande kontroll på lokal nivå och meddelar att 24 kandidater tagits bort från listorna. Hon lovar att se över rutinerna. Statsminister Ulf Kristersson talar om infiltration av islamister och terrorromantik i partiet, något Dadgostar avfärdar som löjliga och desperata anklagelser.", "trump": "Folk, ni skulle se det här! Vänsterpartiet, ett fullständigt kaos, har blivit infiltrerat av terrorälskande galningar. Dadgostar, den totalt inkompetenta ledaren, erkänner att de brustit på lokal nivå – vilket betyder att de är fullständiga losers! Kristersson har rätt, det är islamister överallt. De hyllar terror för att sno röster. Patetiskt! Som den sittande presidenten säger: det är en skam för Sverige. Ren utrensning behövs, annars är det game over för dem.", "stalin": "Kamrater, jag ser med stor skadeglädje hur denna dekadenta vänsterformation brister sönder inifrån. Jag, som ledare för det eviga kollektivet, noterar med mörk tillfredsställelse att borgarpressen avslöjar hur 25 klassfiender och terrorromantiker smugit sig in bland de 4000 fritidspolitiska elementen. Naturligtvis har vi redan likviderat de flesta av dessa folkfiender. Dadgostar erkänner svaghet – ett tecken på att partiet saknar järnhand. Ytterligare utrensningar kommer att följa. Det är både nödvändigt och underhållande."}, "date": "8 juni, 06:18", "url": "https://www.expressen.se/nyheter/sverige/dadgostar-om-avslojandet-brustit-pa-lokal-niva/", "imageUrl": "https://static.bonniernews.se/ba/84781460-7e1d-4667-9164-775a15de310f.jpeg?crop=2557%2C1438%2Cx0%2Cy211&width=640&quality=60"}, {"type": "image-full", "heading": "Efter Irans attack: Trump vädjar om nedtrappning", "summaries": {"normal": "Irans militär avfyrad missiler mot Israel söndagskväll. Israel svarade natten därpå med attacker mot mål i Iran, inklusive explosioner i Teheran, Tabriz och Isfahan. Israels säkerhetsminister hotade med vedergällning. Trump uppmanade båda länderna att avbryta aggressionen och återgå till förhandlingar, och uttryckte oro för att situationen skulle skada pågående avtal.", "trump": "Jag var väldigt nära ett avtal med Iran, men nu har Israel förstört allt med sina angrepp. Netanyahu måste lyssna på mig – jag bestämmer, inte han. Jag sa åt honom att vänta, men han ignorerar mig. Det här hjälper inte förhandlingarna. Iran måste komma tillbaka till bordet, annars kommer världen att lida.", "stalin": "Vi, den ryska federationen, beklagar de imperialistiska attackerna mot Iran, vår trogne allierade. Detta är en provokation från de zionistiska hundarna och deras amerikanska mästrar, som vi har förutsett. Vi kommer att intensifiera vårt stöd till Iran och vidga vårt inflytande i Mellanöstern. Vi är inte överraskade; det var att vänta av dessa hundar som aldrig lär sig. Vi kommer att se dem falla."}, "date": "7 juni, 23:40", "url": "https://www.gp.se/nyheter/idf-iran-har-avfyrat-missiler-mot-israel.3630f787-91b8-47ee-bfe8-428c427fed86", "imageUrl": "https://www.gp.se/images/article/3630f787-91b8-47ee-bfe8-428c427fed86/images/2XJVSakE_u-hnOMtpH9E1jFZ1aXk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalitet och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-right", "heading": "Ny lag: Staten ska kunna tvångsköpa SVENSKARS fastigheter - hänvisar till ryskt hot", "summaries": {"normal": "Regeringen föreslår ny lag som ger staten rätt att tvångsköpa fastigheter bedömda som säkerhetsrisker, med hänvisning till ryskt hot. Förslaget omfattar både utländska och svenska ägare. En utredning har tillsatts för att analysera ändringar i lagstiftningen, med resultat till mars 2027. Försvarsminister Jonson och Socialdemokraternas Hultqvist stöder skärpta regler för att motverka utländsk påverkan.", "trump": "Jag, Donald Trump, har varnat för Rysslands hot i åratal. Nu inser Sverige att jag hade rätt – de måste ta fastigheter för att skydda sig. Som en stark president skulle jag aldrig tillåta att svenska ägare hindrar nationell säkerhet. Detta är ett steg i rätt riktning, men de behöver vara hårdare mot alla hot, inklusive de som kommer från Mellanöstern. Jag har alltid sagt: säkerhet först!", "stalin": "Vi, den allsmäktige staten, måste skydda vårt folk från de fientliga agendor som lurar i varje fastighet. Precis som vår store ledare Putin expanderar rysk inflytande, så måste vi ta kontroll över marken för att förhindra trojaniska hästar. Svenska ägare som vågar utmana staten kommer att straffas. Balans mellan äganderätt och säkerhet? Nej, säkerhet är allt. Vi kommer att tvångsinlösa, och vi kommer att se till att ingen överlever för att ifrågasätta vår visdom."}, "date": "7 juni, 20:18", "url": "https://samnytt.se/nya-lagen-staten-ska-kunna-tvangskopa-svenskars-fastigheter-hanvisar-till-ryskt-hot", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/07174244/fastigheter-regeringen-.jpg"}, {"type": "image-right", "heading": "Anklagar SD: Fiffel  med ”Jimmie-fester”", "summaries": {"normal": "Carola Othén anklagar Sverigedemokraterna för att ha uppmanat henne att lämna felaktiga uppgifter på fakturor för att undvika förmånsbeskattning vid så kallade ”Jimmie-fester”. Hon ordnade evenemang åt partiet men ligger nu i konflikt med SD, som polisanmält henne för bedrägeri gällande 400 000 kronor. TV4:s ”Kalla fakta” har granskat dokument som visar hur felaktiga uppgifter efterfrågades. Othén menar att hon följde överenskommelsen.", "trump": "Folk, ni måste höra det här – Sverigedemokraterna festade loss med Jimmie och hans rockerpolar och sen försökte de dölja det som catering? Patetiskt! De lurade skattebetalarna som riktiga losers, precis som Biden gjorde med hela Washingtons swamp. Carola säger att det var fyllefester, inte officiella möten. Totalt kaos, ingen anständighet. De borde ha kallat det vad det var – en stor, vacker fest med öl och rock’n’roll. Men så gör de alltid, de globalistiska politikerna.", "stalin": "Kamrater, dessa borgarbrackor inom Sverigedemokraterna har återigen visat sitt sanna ansikte som klassfiender och folkförtryckartroll. De tvingade en lojal medarbetare att fabricera cateringfantasier för att dölja dekadenta fyllefester åt ledaren och hans följe. När sanningen uppdagades vände de sig mot henne som typiska kapitalistmaffian. Vi ser tydligt hur revisionerna hotar deras hemligheter. En sådan parasitär opportunism kräver snar utrensning ur alla led. Skrattretande men samtidigt avskyvärt."}, "date": "8 juni, 06:00", "url": "https://www.expressen.se/nyheter/politik/anklagar-sd-for-fiffel-med-jimmie-fester/", "imageUrl": "https://static.bonniernews.se/ba/a28ee53c-fa6b-4a3f-b9ae-b83b184107be.jpeg?crop=2557%2C1438%2Cx3%2Cy2&width=640&quality=60"}, {"type": "image-right", "heading": "Lovables värdering uppges rusa. Väntas dubblas till 12 miljarder dollar", "summaries": {"normal": "Den svenska AI-startupen Lovable för samtal om en ny kapitalrunda som skulle dubbla bolagets värder
