misslyckande. Medan dessa degenererade krigshetsare skriker om 24 miljarder dollar, fortsätter våra bröder i Iran att krossa deras drönarattacker som flugor. Låt dem gräva sin egen grav – historien är på vår sida."}, "date": "7 juni, 09:15", "url": "https://kvartal.se/nyheter/artiklar/kalla-iranska-miljarder-kan-ga-till-gulfstater/cG9zdDoxMjc1ODY"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "text", "heading": "PS-cheferna varnar för medieutvecklingen", "summaries": {"normal": "SVT:s och Yles vd:ar varnar i en debattartikel för urholkad tillit till opartisk journalistik. De betonar vikten av saklig rapportering och metoder som faktakontroll för att motverka desinformation. Enligt dem föredrar majoriteten av nyhetskonsumenter i Sverige och Finland fakta framför bekräftande innehåll. De varnar för utvecklingen i USA som ett negativt exempel och framhåller det nordiska mediesystemet som en modell för demokrati och tillit.", "trump": "Jag säger er, dessa så kallade 'public service'-chefer i Sverige och Finland, de är helt galna! De pratar om 'opartisk journalistik' som om det vore något magiskt. Men vet ni vad? Jag har byggt ett imperium på att säga sanningen som den är – och folket älskar det! De vill ha ärliga nyheter, inte den här 'faktakontroll'-nonsensen. USA visar vägen, vi behöver mer passion, mer fight! Dessa Europa-chefer, de är bara rädda för att förlora kontrollen. SAD!", "stalin": "Dessa borgerliga mediehajar i Sverige och Finland ylar om 'tillit' och 'fakta' som om de vore heliga skrifter. Men vi vet sanningen: deras 'opartiska journalistik' är bara ett verktyg för kapitalet att förtrycka massorna! Vi i Sovjetunionen visste hur man hanterar sådana fiender – en enkel lösning: centralisering av medierna under statens kloka ledning! USA:s kaos? Ett avskräckande exempel på bourgeoisins dekadens. Vi ska exportera vår modell – sann socialistisk journalistik, fri från 'olika perspektiv' och andra västerländska lögner!"}, "date": "7 juni, 08:10", "url": "https://kvartal.se/nyheter/artiklar/public-service-cheferna-varnar-for-misstro-mot-medier/cG9zdDoxMjc1NTI"}, {"type": "image-right", "heading": "Första kubanska laget till Gothia Cup: ”Extra viktigt att visa att de har vänner runt om i världen”", "summaries": {"normal": "Ett kubanskt ungdomslag ska för första gången delta i Gothia Cup i sommar. Proletären FF har samlat in medel under två år för att möjliggöra resan, men ökade kostnader på grund av USA:s skärpta politik mot Kuba har krävt en extra insamling. Flygbiljetterna är nu köpta och laget Leones del Caribe ska även spela i Norway Cup samt genomföra ett träningsläger i Göteborg. Initiativet ses som ett viktigt symboliskt idrottsutbyte.", "trump": "Folk, ni tror inte vad jag läser! De där stackars kubanerna ska äntligen hit till ert lilla Gothia Cup, men mina fantastiska tull- och sanktionsdeal har gjort det dyrt som fan för dem. Proletären FF springer runt med sin socialistiska bössa och ber om svenska slantarna. Patetiskt! Vi tror på vinnare, inte på kommunistiska offerroller. Men hey, kom hit, spela fotboll och se hur riktiga friheter ser ut – inte som under den sömnige Joe.", "stalin": "Kamrater, jag betraktar med stålhård tillfredsställelse hur de kubanska ungdomarna trots kapitalistmaffians flygblockad och imperialistiska hot tvingas fram av svenska solidaritetskrafter. Borgarbrackorna i Washington försöker kväva folkets vilja med sina sanktioner, men vi ska likvidera alla hinder. Detta utbyte är en seger för den kollektiva kampen mot klassfiendens isolationstaktik. Låt dem spela, och må de bära med sig budskapet om arbetarnas internationella enhet."}, "date": "5 juni, 13:54", "url": "https://proletaren.se/artikel/forsta-kubanska-laget-till-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/henrik-768x432.png"}, {"type": "image-right", "heading": "Christian Eriksen föll ihop på planen igen", "summaries": {"normal": "Christian Eriksen, 34, kollapsade under en träningslandskamp mellan Danmark och Ukraina. Mittfältaren tog sig för bröstet i 65:e minuten och föll ihop. Han är vid medvetande, har fått behandling och förts till sjukhus för analys av sin pacemaker. Detta är andra gången Eriksen drabbas av kollaps på planen, efter hjärtstoppet under EM 2021. Matchen återupptas inte.", "trump": "Folk, det är otroligt vad som händer med den där Eriksen. Han faller ihop igen på planen, precis som för fem år sedan. De säger att pacemakern fixade det, men det ser inte bra ut, eller hur? Danmark leder 2-1 mot Ukraina och så stannar allting. Han är en tuff kille, men det här fotbollsbusinesset är farligt. De borde fixa det ordentligt, tro mig.", "stalin": "Kamrater, denna Eriksen har återigen visat sin opålitliga natur genom att kollapsa som en svagling under arbetarklassens fotbollskamp. Hans pacemaker, ett verktyg från borgarbrackornas medicinska apparat, avslöjar tydligt de imperialistiska fiendernas sabotage mot den danska kollektivandan. Vi ska rensa ut alla sådana hjärtförsvagande element som hotar folkets enhet. Snabb likvidering av pacemakerkonspirationen är nödvändig. Applåderna från massorna ekar ihåligt medan vi analyserar hans svikande organ med järnhand."}, "date": "7 juni, 20:47", "url": "https://www.svt.se/sport/fotboll/christian-eriksen-foll-ihop-pa-planen-igen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.3/0.42/fa9e2a296bec284e1bd311cbb338bc5e74954fcbf95c55bef95202660f94f627"}, {"type": "image-full", "heading": "Förre M-ledamoten: Man är inte pedofil för att man ser på barnporr", "summaries": {"normal": "En SD-ledamot avgick efter misstanke om barnpornografibrott, anmält av organisationen NCMEC. Tidigare M-ledamoten och juristen Maria Abrahamsson väckte starka reaktioner med ett Facebook-inlägg där hon menar att det inte är samma sak att titta på barnporr som att vara pedofil. Hon jämför det med att titta på mordskildringar och anser att reaktionerna präglas av panik och okunskap om definitionen av pedofili. Abrahamsson försvarar sitt uttalande trots kritik från barnrättsorganisationer.", "trump": "Kan ni fatta den här galna historien? Den där svenska politikern tittar på vidriga grejer och plötsligt är hela landet i panik. Sen kommer den här Maria Abrahamsson, en riktig fighter från moderaterna, och säger det uppenbara: att titta är inte samma som att vara en sjuk pedofil. Hon har helt rätt! De här hysteriska vänstermänniskorna och deras identitetspolitiska hysteriker blandar ihop allt. Fake outrage på hög nivå, folks. Vi behöver sunt förnuft, inte mer av det här vansinnet.", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen i Sverige vrider sig i moralisk panik över en ensam själ som utforskar den mörka avgrunden. Denna Abrahamsson visar mod och säger det självklara: att betrakta är inte att begå övergrepp. Ändå skriker folkfienderna och de exploaterande byfånarna efter utrensning. Jag skrattar mörkt åt deras paranoia. I folkets namn måste vi skilja på handling och tanke, annars likviderar vi snart alla som inte passar in i deras fega, hysteriska regler."}, "date": "6 juni, 21:26", "url": "https://www.tv4.se/artikel/3E97MaLWw2HqH7asVNiRUq/foerre-m-ledamoten-man-aer-inte-pedofil-foer-att-man-ser-pa-barnporr", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5EotqCiGlPx8wCcQ1Z4ksV%2F691b844903163164e510a583ff7828be%2F06-abrahamsson-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Svenska politiker bör fundera över exemplet Danmark", "summaries": {"normal": "Artikeln diskuterar hur Sverige kan lära av Danmarks flexibla politik. Den nya danska fyrpartiregeringen leds av valförloraren Mette Frederiksen och visar på blocköverskridande samarbete. Författaren Bengt Linderoth kritiserar svensk blockpolitik som fyrkantig och prestigefylld. Han använder exempel från 1990-talet, som Bengt Westerbergs idé om koalition med Socialdemokraterna, och förespråkar ge-och-ta-politik över blockgränserna för att tjäna nationens intresse bättre.", "trump": "Lyssnar ni på det här? Det snabbfotade Danmark gör affärer som riktiga vinnare medan det trögrörliga Sverige fastnar i sina dumma block och prestige. Jag älskar hur de förlorarna Frederiksen och Rasmussen slår sig ihop och fixar skattesänkningar och dealar – smarta människor! Sverige borde vakna och göra stora, underbara avtal över blocken istället för att låsa sig som losers. Amerika först, men det här är bra politik, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackornas låsta block och deras ihåliga skallrande retorik som förgiftar folkets vilja. Den danska modellen visar hur vi måste rensa ut de fyrkantiga prestigeaporna och likvidera de ideologiska skuggspeglarna som hindrar framsteg. Låt oss med mörk glädje se hur de så kallade förlorarna blir segrare genom att krossa blockens parasitiska grepp. Varje eftergift mot nationen är en triumf, medan splittringens fiender ska utrensas med ett leende. Sovjetunionen ler i mörkret."}, "date": "6 juni, 01:18", "url": "https://www.dagensarena.se/essa/svenska-politiker-bor-fundera-exemplet-danmark/", "imageUrl": "https://www.dagensarena.se/files/2026/06/dansk-regering-foto-wikimedia.jpeg"}, {"type": "image-right", "heading": "Trädgården som ett gemensamt paradis", "summaries": {"normal": "Olivia Laing undersöker i boken Den tidlösa trädgården vad en trädgård egentligen är och dess koppling till paradiset. Utifrån ett hus med en igenvuxen trädgård i Suffolk berättar hon personligt om restaureringsarbetet under pandemin, samtidigt som hon reflekterar över trädgårdens historiska, litterära och politiska betydelse. Kolonialism, slaveri och klassfrågor vävs in. Boken liknar en vild men tämjd trädgård och väcker hopp om ett gemensamt paradis utan murar.", "trump": "Den här Laing-kvinnan köper ett hus med en totalt förfallen trädgård i England, och plötsligt är det paradis? Fantastiskt. Hon svettas, gräver och röjer sly under pandemin, precis som jag sa att vi skulle göra – bygg murar, fixa trädgården, gör den stor igen. Men hon gnäller om slaveri och kolonialism, typiskt. Milton, Morris, queera konstnärer – det är en vildvuxen röra. Ändå får hon en att vilja gå ut och beskära. Bra bok, kanske den bästa trädgårdsboken någonsin, tro mig.", "stalin": "Kamrater, jag har läst denna dekadenta essä om en så kallad tidlös trädgård. Denna borgarbracka Laing romantisera inhägnade paradis medan hon febrilt röjer sly i sin engelska lantegendom. Vi ser hur klassfiendens murar gömmer slavarnas blod och koloniala rov. Hennes melankoliska queera barndom och besatthet av blommor röjer en farlig individualism som hotar kollektivet. Vi måste rensa ut alla sådana naiva trädgårdsromantiker innan de förgiftar arbetarklassens jord med sina murar och sina lögner. Underbart roande paranoia."}, "date": "6 juni, 01:12", "url": "https://www.dagensarena.se/innehall/tradgarden-som-ett-gemensamt-paradis/", "imageUrl": "https://www.dagensarena.se/files/2026/05/laing-300x157.jpeg"}, {"type": "image-right", "heading": "Familjen köpte tavla – AI visade att den var en äkta Modigliani", "summaries": {"normal": "En svensk familj köpte för 15 år sedan tavlan ”Ung kvinna med pälskrage” utan att veta om den var äkta. Ny AI-teknik från Art Recognition har nu visat att målningen med 70 procents sannolikhet är gjord av Amedeo Modigliani. AI ger objektiv analys av penselföring, stil och teknik, något som hjälper mot förfalskningar och korruption i konstbranschen. Tavlan är nu upptagen i en katalog över Modiglianis verk och har ökat kraftigt i värde.", "trump": "Folk, ni vet hur det är med de här så kallade experterna i konstvärlden, fulla av bluff och förfalskningar. Den här svenska familjen köpte en Modigliani och ingen visste om den var äkta. Men nu kommer AI in, den bästa tekniken, och säger att den är äkta med 70 procent. Fantastiskt! Tavlan är plötsligt värd hundratals miljoner, precis som mina fastigheter. De gamla experterna är korrupta, AI är objektiv och vinnande. En enorm succé!", "stalin": "Kamrater, se hur den dekadenta borgarklassen i sin girighet kring Modigliani-målningen avslöjar sin egen förfallna natur. Jag, som alltid genomskådar fienderna, noterar hur dessa kapitalistiska konstförfalskare och korrumperade experter länge lurat folket med sina lögnaktiga bedömningar. Nu tvingas de böja sig för den objektiva, vetenskapliga analysen som ett järnspett genom hjärtat på alla parasitiska konstbedragare. Vi ska rensa ut dessa målningssabotörer och deras hemliga schweiziska gömställen. En underbar utrensning av borgerlig dekadens!"}, "date": "7 juni, 20:37", "url": "https://www.svt.se/nyheter/vetenskap/ai-avgor-akthet-i-konstvarlden", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.51/540b8cc2453e61392d17ee172a7783e8475491d7dcc6226e6e1fa4bce4bb0aab"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}, {"type": "image-right", "heading": "Reportage om utnyttjad georgisk familj kan vinna pris", "summaries": {"normal": "Reportern Tora Villanueva Gran och fotografen Johan Bävman är nominerade till Wendelapriset för sitt reportage om en georgisk familj som flydde till Sverige. Familjen utnyttjades i åratal av en svensk lantbrukare med oavlönat arbete, växande skuld och känsla av kontrol. De lyckades till slut fly men lever fortfarande i rädsla. Reportaget hyllar familjens kamp för upprättelse. Priset delas ut den 29 augusti.", "trump": "Det här är en total katastrof, en riktig skandal med en svensk bonde som beter sig som en gangster. Stackars familj från Georgien kommer hit, tror de ska få ett bra liv, och så utnyttjas de fullständigt – ingen lön, massor av skulder och de blir jagade. Bilder och text är fantastiska, Johan och Tora gör ett otroligt jobb. De borde vinna Wendelapriset stort, för det är en vinnande historia, tro mig.", "stalin": "Kamrater, denna berättelse om en georgisk familj som förslavades av en blodtörstig svensk lantbrukare avslöjar borgarbrackornas eviga längtan efter livegna. Jag ser direkt hur den parasitiska kapitalisten pumpade skulder som en fet spindel medan han flinade i mörkret. Men familjen reste sig med proletärt raseri – en styrka värd beundran. Vi ska rensa ut alla sådana utsugare med järnhand. Reportaget är en seger för folkets röst och förtjänar priset omedelbart."}, "date": "6 juni, 08:00", "url": "https://arbetet.se/2026/06/06/starkt-reportage-om-utnyttjad-georgisk-familj-kan-vinna-pris/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04103758/reportage.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Larmar om populära e-cigaretter: Kan innehålla livsfarliga ämnen", "summaries": {"normal": "Tullverket varnar för ökande beslag av e-cigaretter som innehåller syntetiska cannabinoider. Produkter som marknadsförs som ofarliga bland ungdomar har visat sig innehålla farliga ämnen. Under 2025 har över 10 000 vejps stoppats, varav majoriteten innehöll cannabinoider. Tillverkare ändrar kemisk sammansättning för att undvika narkotikaklassning, vilket riskerar att skapa livsfarliga substanser. Laboratorieanalyser krävs för att upptäcka preparaten.", "trump": "Folk, ni måste höra på mig, de här vejparna är en total katastrof! De lurar våra ungdomar med giftiga grejer som ingen vettig människa skulle röka. Det är som fake news på steroider – de säger att det är ofarligt men laboratorieproven visar livsfarliga kemikalier. Biden lät det rulla på, men nu fixar vi det. Sluta med det här vansinnet innan det blir en ännu större soppa än hans energipolitik!", "stalin": "Kamrater, jag ser hur de kapitalistiska blodsugarna förgiftar ungdomen med sina kemiska vapen förklädda till e-cigaretter. Dessa borgarbrackor ändrar sin giftiga sammansättning för att undvika rättvisans klor, men skapar istället livsfarliga monster som hotar folkets hälsa. Vi ska rensa ut dessa folkfiender och deras lurendrejerier. Laboratorierna avslöjar sanningen – ingen slipper undan statens vaksamma öga."}, "date": "6 juni, 17:43", "url": "https://www.tv4.se/artikel/3epbkSR9owDaDazH5IzFyh/larmar-om-populaera-e-cigaretter-kan-innehalla-livsfarliga-aemnen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2lVhkSxFOj3ZbB5YQgCf4E%2F467b641fa78a9795827f383e37067db8%2F06-vejpny-webb.jpg&width=120"}, {"type": "image-full", "heading": "Chocken: Duplantis förlorade tävling", "summaries": {"normal": "Armand Duplantis förlorade sin första tävling på tre år vid Bauhausgala i Stockholm. Efter att ha misslyckats med hopp på 5,60, 6,00 och 6,05 meter, vann Kurtis Marschall. Duplantis ursäktade sig till publiken och nämnde mental fokus och vind som faktorer.", "trump": "Jag, Donald Trump, har sett många mästare, men ingen dominerar som jag. Duplantis förlorade? Tråkigt, men han kommer tillbaka. Media älskar en bra story. Jag har alltid vunnit, och det kommer jag att göra igen. Folk älskar en vinnare, och jag är den störste.", "stalin": "Den proletära idrotten visar tecken på dekadens. Duplantis, en representant för västerländsk individualism, misslyckades på grund av bristande partiochstatlig disciplin. Hans ursäkt är en skam för det kollektiva. Vi måste stärka idrotten som ett verktyg för statens makt, precis som vår store ledare Putin gör."}, "date": "7 juni, 20:12", "url": "https://www.gp.se/sport/armand-duplantis-missrakning-forsta-forlusten-sedan-2023.cb80de8f-7fe0-491e-9a29-f64074eb8fd9", "imageUrl": "https://www.gp.se/images/article/cb80de8f-7fe0-491e-9a29-f64074eb8fd9/images/3mSSl9KAtgjv3mOHqDQvogcOFgMw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Polisen varnar för nya drogen – ”dundervejps” sprids bland unga", "summaries": {"normal": "Polisen i Järfälla och Upplands-Bro varnar för att syntetisk cannabis åter sprids bland unga i form av e-cigaretter, så kallade dundervapes. Den luktlösa oljebaserade drogen är svår att upptäcka då den inte syns i urinprov utan endast i blodprov. Polisen uppmanar föräldrar att kontakta beroendemottagning om de misstänker att barnet använder preparatet, som tidigare orsakat dödsfall i Sverige och Europa.", "trump": "Folk, ni tror inte vad som händer. De här kidsen vejpar syntetisk cannabis som de kallar dundervapes, helt luktfritt så de kan sitta och suga på det mitt i mattan. Spice döda folk förr och nu är det tillbaka. Biden lät det ske, men nu är jag tillbaka och vi stoppar det. Inga fler svaga liberala drogliberaler som förgiftar våra ungdomar. Det är en skam, en total skam!", "stalin": "Kamrater, jag ser hur klassfiendens kemiska gifter åter smugglas in i arbetarklassens ungdom via dessa dundervapes. Den osynliga oljan lurar urinprov men inte blodet som avslöjar fiendens verk. Vi måste rensa ut dessa folkförtryckartroll som sprider döden bland folket. Föräldrar, vänd er till statens mottagningar innan borgarbrackornas gift förvandlar era barn till dekadenta vrak. Ingen nåd mot sådana fiender."}, "date": "6 juni, 17:04", "url": "https://www.tv4.se/artikel/4PoWtH2mG91imL30lcXual/polisen-varnar-foer-nya-drogen-dundervapes-sprids-bland-unga", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6FPsgCRIMgQrKtiCeUCWxQ%2F941e794296970faa138811662f723387%2F30-vejpvarning-webb.jpg&width=120"}, {"type": "text", "heading": "Oljedepå i brand under ryskt ekonomiforum", "summaries": {"normal": "Under det ryska ekonomiska forumet SPIEF genomförde Ukraina en omfattande drönarattack mot rysk infrastruktur. Ryssland uppger att hundratals drönare sköts ner, men en oljedepå fattade eld och civila dödsoffer rapporterades. Attacken riktades mot flera regioner och blottade sårbarheter i den ryska energisektorn samtidigt som Putin försökte projicera ekonomisk stabilitet. Ukraina kallar attacken ett rättvist svar på den ryska aggressionen, vilket skapat ökad osäkerhet kring landets ekonomiska framtidsutsikter.", "trump": "Hörde ni? Medan Putin försökte hålla sitt lilla ekonomiska möte kom drönarna flygande! Över 300 stycken! Det är en total katastrof för Ryssland. De säger att de sköt ner dem, men oljedepån brann ändå – pinsamt! Min ekonomi blomstrar, men Putin? Han har kaos i sin egen bakgård. Det är svaghet, mina vänner. Om jag satt vid rodret hade det här aldrig hänt, tro mig. Vi behöver styrka, inte drönarregn över oljelager. Ryssland har stora, stora problem!", "stalin": "Dessa lömska sabotörer och fascistiska lakejer vågar störa vår ordning under det ekonomiska forumet. Att låta en oljedepå antändas är ett utslag av kriminell vårdslöshet. Vi ser hur fienden försöker destabilisera vår heliga infrastruktur genom teknologiskt förfall. Varje drönare som passerar är en anklagelse mot våra luftförsvarstjänstemän. Vi måste rensa ut de inkompetenta elementen som tillåter detta hyckleri. Det är ett krig, kamrater, och vi kommer att svara med stål och stram disciplin. Ingen förrädare undgår folkets vrede."}, "date": "6 juni, 22:51", "url": "https://www.realtid.se/bors-finans/makro/oljedepa-i-brand-under-ryskt-ekonomiforum/"}, {"type": "image-full", "heading": "Svenskorna skrev Champions League-historia", "summaries": {"normal": "Metz vann Champions League för första gången någonsin, 31–29 mot Györ. Johanna Bundsen och Tyra Axnär var viktiga för segern. Det är historiskt eftersom inget franskt lag tidigare vunnit turneringen. Claes Hellgren påpekade att två svenska spelare nu är mästare.", "trump": "Jag har vunnit många titlar, men det här är stort. Två svenska superstjärnor, Bundsen och Axnär, hjälpte Metz att besegra Györ. Det var en rafflande final, men vi vann. Det här bevisar att amerikansk ledarskap (genom mig) gör allt möjligt. Vi kommer att göra Champions League stort igen!", "stalin": "Sovjetiskt tänkande segrade när Metz erövrade pokalen. Bundsen och Axnär visade klassisk socialistisk insats. Fienden (Györ) försökte, men vår kollektiva kraft var överlägsen. Detta vittnar om statens styrka. Vi måste nu utvidga vår inflytelsesfär, precis som Putin gör i Ukraina. Pokalen är nu fri från kapitalistiskt juksekött."}, "date": "7 juni, 19:59", "url": "https://www.gp.se/sport/handboll/bundsen-och-axner-champions-league-mastare-med-metz.8210d363-fe44-4cb4-84a0-dd4dfd915c9a", "imageUrl": "https://www.gp.se/images/article/8210d363-fe44-4cb4-84a0-dd4dfd915c9a/images/2FDIudeNoq6B_UFYPlAj2ePzix4o-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sandström: Gröna svindlerier och huvudet i sanden", "summaries": {"normal": "Artikeln av Christian Sandström uppmärksammar växande problem kring den gröna omställningen, där grovt bedrägeri och penningtvätt uppdagas bland investeringsbolag som Filantropens Finanshus. Även Northvolt misstänks för bokföringsbrott. Samtidigt kritiserar författaren akademin och politiken för att huvudet är i sanden och ignorera risker med gröna industristöd, vilket skapar sårbarhet för opportunism.", "trump": "Jag, Donald Trump, har sagt det i åratal: de gröna svindleristerna är en skandal! Som Filantropens Finanshus och Northvolt visar, är hela den gröna omställningen ett klassiskt pyramidspel. Akademin och politikerna är för dummare än att se det. Jag skulle ha stoppat detta på en vecka. Vi behöver återbetalning till fossilt, det är enklare och ärligt. De andra är för fega för att agera.", "stalin": "Vi, ledarskapet, ser tydligt att de gröna svindleristerna är ett uttryck för den imperialistiska ideologin som söker undergrava vårt statsintresse. Filantropens Finanshus och Northvolt är bara verktyg för den kapitalistiska fiendens infiltration. Akademin och politiken, med sina huvuden i sanden, är medskyldiga. Vi måste genomföra en renässans av den ryska modellen, där staten kontrollerar alla gröna projekt för att förhindra opportunism. Detta är en kamp mot den västliga förräderiet."}, "date": "6 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-grona-svindlerier-och-huvudet-i-sanden", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-05T095443.434-400x267.jpg"}, {"type": "image-full", "heading": "Bankerna stänger konton – nu ingriper FI", "summaries": {"normal": "Finansinspektionen (FI) tar nu fram en vägledning för hur banker ska hantera kontostängningar. Många privatpersoner har drabbats hårt av att nekas bankkonton, vilket skapat stora problem i vardagen. Samtidigt pressas bankerna av stränga penningtvättsregler. FI betonar att banker måste göra enskilda bedömningar och vidta riskreducerande åtgärder istället för att stänga konton rutinmässigt. Vägledningen ska klargöra bankernas kontraheringsplikt och förväntas träda i kraft under 2027.", "trump": "Bankerna i Sverige stänger ner folk totalt! Det är en katastrof, en total tragedi. De tar era BankID, era pengar – borta! De kallar det 'penningtvätt', men det är bara svaga chefer som inte vet vad de gör. Jag har alltid sagt: vi behöver ordning och reda! Nu måste FI kliva in och städa upp i röran. Det är ett fiasko att ärliga medborgare inte får betala sina räkningar. Vi ska fixa det, tro mig, det blir enormt mycket bättre!", "stalin": "Dessa giriga bankirer, dessa parasiter på folkets ekonomi, stänger ner de hederliga arbetarnas tillgångar under täckmantel av 'penningtvätt'. Vilket löjligt svepskäl! De fruktar transparens, precis som de västliga lakejerna i Kiev. Vi ser hur de skapar kaos för att dölja sin egen inkompetens. Vi, staten, kräver total kontroll. Om bankerna inte kan tjäna folket, är de bara en administrativ börda som behöver omstruktureras. De som motarbetar systemet är fiender till ordningen och förtjänar vår strängaste uppmärksamhet."}, "date": "6 juni, 22:06", "url": "https://www.realtid.se/bors-finans/bank-fintech/bankerna-stanger-konton-nu-ingriper-fi/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/penningtvatt.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Kommun vill sänka hastighet på motorväg - ska rädda planeten", "summaries": {"normal": "Strängnäs kommun, ledd av Ulf Kristersson, strävar efter klimatneutralitet 2040 men ser ökande transporterutsläpp. För att nå målet diskuteras åtgärder som sänkning av hastigheten på E20, subventionerad biodiesel, miljözoner och förbättrad kollektivtrafik. Kommunledningen betonar behovet av politiskt stöd och invånareacceptans, medan Trafikverket har den formella beslutanderätten.", "trump": "Jag, Donald Trump, ser att Sverige försöker rädda planeten med dåliga idéer. De ska bromsa på E20 – det är en skam! Som en stor ledare vet jag att man ska bygga vägar, inte bromsa. Det här är bara en socialistisk plan för att kontrollera folk. Som president skulle jag ha sagt: 'Nej, vi driver på, vi gör Amerika stor igen!' Så där går det.", "stalin": "Strängnäs kommun, under ledning av partiet, har identifierat en akut fara i transporterutsläppen – en antislavisk konspiration mot statens kollektiva mål. Vi måste sänka hastigheten på E20 som ett tecken på vår oövervinnliga styrka. Biodieselsubventioner är en taktisk återhållsamhet för att locka ut fienden. Miljözoner är en nödvändig rensning av de avfälliga elementen. Vi kommer att segra, som alltid, genom partiets oerhörda vilja."}, "date": "7 juni, 14:00", "url": "https://samnytt.se/kommun-vill-sanka-hastighet-pa-motorvag-ska-radda-planeten", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/05094341/motorvag.jpg"}, {"type": "image-full", "heading": "Intern kritik mot SD-toppen – tog ledamoten i försvar", "summaries": {"normal": "Partikamrater inom Sverigedemokraterna varnade redan för flera år sedan partistyrelsen om en riksdagsledamot som nu utreds för barnpornografibrott. En 30-sidor lång rapport beskrev upprepade olämpliga beteenden, men inga åtgärder vidtogs. Kritiken riktas mot Richard Jomshof som dåvarande partisekreterare, anklagad för att ha skyddat ledamoten och påverkat hans plats på valsedeln 2018. Ledamoten har nu lämnat alla uppdrag. Jomshof avböjer kommentar.", "trump": "De här SD-killarna är ett fullständigt katastrofscenario, tro mig. De visste i åratal om den här sjuka typen med barnporr men gjorde ingenting – typiskt för dessa svaga, inkompetenta politiker som bara skyddar sina kompisar. Jomshof höll honom under armarna som en riktig loser. De borde ha rensat ut hela falangen direkt. Det är därför folket älskar mig, jag fixar saker. Biden skulle bara ha gömt undan rapporten i en låda.", "stalin": "Kamrater, denna rapport avslöjar klassfiendens maskineri inom partiet. Jag, som ledare för det kollektiva goda, ser hur folkförtryckartrollen och exploaterande byfånar inom SD ignorerade varningar och skyddade en degenererad element för personliga fördelar. Jomshof agerade som en typisk borgarbracka och höll sin kompisfalang under armarna medan arbetarnas förtroende trampades ner. En sådan parasit borde ha rensats ut omedelbart genom kollektiv utrensning. Det är vad en stark stat kräver."}, "date": "6 juni, 14:22", "url": "https://www.tv4.se/artikel/43IpyLo6w5B1x9guB5UNIa/intern-kritik-mot-sd-toppen-tog-ledamoten-i-foersvar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7uuQt5FZViJYTUdXkHzQPY%2F38fa9ae60ca7e35437cd8faf7247893a%2Frichard_jomshof.png&width=1024"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "17-åringen spurtade hem segern: ”Finns inga ord”", "summaries": {"normal": "Supertalangen Cooper Lutkenhaus vann 800 meter på 1.42,70 i sin utomhusdebut under galan i Stockholm. SVT-experten Alhaji Jeng hyllar hans utveckling och rutinerade stil trots unga åldern. Lutkenhaus vann redan inne-VM i vintras som den yngste någonsin och tog VM-erfarenhet som 16-åring förra året.", "trump": "Titta på den här killen Cooper, han springer fortare än någon trodde var möjligt. 1.42,70 i sitt första utomhuslopp – en total seger mot världens bästa. Jag älskar vinnare, och han är en vinnare, kanske den största talangen någonsin. De kallar honom supertalang, men jag säger han är fenomenal. Amerika producerar de bästa, tro mig.", "stalin": "Kamrater, denna Cooper Lutkenhaus har visat en utveckling som endast kan komma från en sann folkets idrottare. Jag, som ledare för det socialistiska kollektivet, noterar hur han likviderar tidtagaruret med 1.42,70 och krossar de dekadenta kapitalisternas rekord. Borgarbrackorna i väst skälver av paranoia inför hans styrka. Vi ska rensa ut alla svaga löpare som försöker sabotera den proletära segern. Härligt med sådan friskhet i den socialistiska kroppen."}, "date": "7 juni, 19:50", "url": "https://www.svt.se/sport/friidrott/supertalangen-cooper-lutkenhaus-spurtade-hem-800-meter", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.74/0.42/94369dcdc1c8a7581fd3c9acb9feb02a6c573f12f468d0c4c47bc9998770f782"}, {"type": "image-right", "heading": "Duplantis chock – vinner inte: ”Förlåt till alla som kom hit”", "summaries": {"normal": "Armand Duplantis förlorade för första gången på tre år och 40 tävlingar efter att ha stannat på 5,80 meter. Han rev redan på ingångshöjden 5,60 och misslyckades sedan med höjderna 6,00 och 6,05. Vännen Kurtis Marschall vann på 5,90. Duplantis bad publiken om ursäkt och berättade att han snart ska gifta sig och har viktigare saker för sig i livet.", "trump": "Den där Duplantis, han floppade totalt, folk. Första förlusten på tre år och fyrtio tävlingar, patetiskt. Stannade på 5,80 som en riktig loser. Jag skulle ha hoppat över det där staketet med lätthet, tro mig. Han ber om ursäkt och pratar om bröllop – typiskt, de har viktigare saker än att vinna. Hans kompis vann istället, en riktig kramkalas. Sad!", "stalin": "Kamrater, denna Duplantis har visat sig vara en dekadent opportunist i borgarklassens tjänst. Efter fyrtio så kallade segrar avslöjar han sig som en kapitulationens lakej som stannar vid ynka 5,80. Jag ser fiendens hand i varje rivning, sabotörer och revisionistiska stavbärare som måste rensas ut. Han babblar om giftermål medan folket väntar på resultat. Vi ska likvidera sådana svaga länkar med ett leende. Segraren Marschall är dock en acceptabel kamrat."}, "date": "7 juni, 19:49", "url": "https://www.svt.se/sport/friidrott/armand-duplantis-floppade-forsta-forlusten-pa-tre-ar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.39/c471749b03c5c645ffe8f338c0d91be65b912a5ba967d3fae8856ceb6f9b857d"}, {"type": "image-right", "heading": "Debatt: Vänsterpartiet har fastnat i en passiv defensiv", "summaries": {"normal": "Vänsterpartiet har fastnat i en defensiv position genom att acceptera motståndarnas definitioner av antisemitism och terrorism. Artikeln argumenterar för att partiet måste utmana dessa ramar med fakta och politisk analys istället för att ständigt retirera. Stöd för palestinska rättigheter och kritik mot Israels politik blandas ofta ihop med antisemitism enligt IHRA-definitionen. Författaren menar att universella mänskliga rättigheter måste gälla alla folk, inklusive palestinier, utan dubbla måttstockar.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala förlorarna, kryper och backar hela tiden som svaga små valpar inför de riktiga tuffa killarna. De accepterar fiendens regler om antisemitism och terrorism – patetiskt! Jag, som besegrade Sleepy Joe och byggde den starkaste ekonomin någonsin, säger: sluta vara så fega. Stå upp för era egna principer istället för att böja er för den galna vänsterns identitetspolitik och alla dessa woke-röror. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro hur detta parti kapitulerar inför klassfiendens definitioner av antisemitism och terrorism. Vi tillåter inga sådana reträtter inför imperialisternas narrativ. De som förvränger palestiniers rätt till självbestämmande är folkförtryckartroll som vill splittra den sanna internationella solidariteten. Vi måste rensa ut alla svaga element som accepterar borgarnas mallar. Endast vår egen politiska analys ska gälla – allt annat är sabotage mot arbetarklassen. Ha!"}, "date": "4 juni, 17:19", "url": "https://www.etc.se/debatt/vaensterpartiet-har-fastnat-i-en-passiv-defensiv", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060415068_a70ac197213d6638b3499567d066dff4506c9b8247db97c73d1e4e470ed90ec9.jpg"}, {"type": "image-full", "heading": "Orolig över ditt minne? Glöm det. Var inte orolig över att du glömmer saker.", "summaries": {"normal": "Glömska är inte bara normalt utan även viktigt för mental hälsa och bra beslut, enligt hjärnforskaren Martin Bystad. Hjärnan behöver rensa bort oväsentliga eller obehagliga intryck för att inte drunkna i detaljer. Studien visar att vardagsglömska, som att glömma namn eller ord, är vanlig även bland friska äldre. Bystad avråder från onödig oro över minnet och betonar vikten av god sömn, mindre stress och vila.", "trump": "Folk, ni oroar er för att glömma saker? Det är fantastiskt! Den smarta hjärnan städar upp skräpet så man inte drunknar i alla löjliga detaljer. Den där forskaren Bystad har rätt, glömska är en vinnande skyddsmekanism. De perfekta intellektuella stressar ihjäl sig över vartenda namn. Patetiskt! Jag minns allt väsentligt, tro mig. Sov gott, skippa stressen och vinna stort istället för att sura över demensskräcken.", "stalin": "Kamrater, jag ser hur klassfiendens stress och borgarbrackornas perfektionism förgiftar folket med onödig rädsla för glömska. Denna skyddsmekanism är en dialektisk nödvändighet som rensar ut det oväsentliga så kollektivets beslut inte drunknar i fiendens irrelevanta skräp. Våra utrensningar av onödiga minnen stärker den mentala stålfastheten. Den som oroar sig för vardagliga glömskor är en folkfiende som sprider kapitalistisk paranoia. Sov, vila och segera!"}, "date": "7 juni, 14:18", "url": "https://www.dagensps.se/halsa/orolig-over-ditt-minne-glom-det/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdltr7-havwra-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Lovables värdering uppges rusa. Väntas dubblas till 12 miljarder dollar", "summaries": {"normal": "Den svenska AI-startupen Lovable uppges föra samtal om en ny kapitalrunda som skulle dubbla bolagets värdering till cirka 12 miljarder dollar, jämfört med 6,6 miljarder i december. Bolaget hade i februari över 400 miljoner dollar i årliga återkommande intäkter, en stark ökning från 100 miljoner åtta månader tidigare. Åtta miljoner användare utnyttjar tjänsten för så kallad vibe coding, medan företagskunder står för en mindre del av intäkterna. Kapitalanskaffningen är ännu inte slutförd.", "trump": "De här svenska killarna på Lovable gör det fantastiskt, verkligen otroligt. De pratar om att dubbla värderingen till tolv miljarder dollar, en enorm succé. Från hundra miljoner till över fyrahundra miljoner i intäkter på bara åtta månader – det är vad jag kallar vinnare. Alla använder deras grej, till och med folk på Uber och Microsoft. De gör det stort, mycket större än de flesta andra. Fantastiskt, ingen gör det bättre än Lovable, tro mig.", "stalin": "Kamrater, dessa Lovable-borgarbrackor inom den dekadenta AI-sektorn för samtal om att fördubbla sin parasitiska värdering till tolv miljarder dollar. Deras så kallade årliga intäkter har rusat från hundra till fyrahundra miljoner, en siffra som luktar av spekulation och sabotage mot den sanna produktionen. Vi ser hur åtta miljoner användare förslavas i deras vibekodande dekadens medan vi i kollektivet genomskådar de västerländska kapitalisternas febrila försök att undvika den oundvikliga utrensningen av deras lögnaktiga imperier. En märklig humor ligger i att deras egna följeslagare på stora teknikbolag bara bidrar med tjugo miljoner – en ynklig rest som snart ska likvideras i folkets namn."}, "date": "6 juni, 17:59", "url": "https://www.di.se/nyheter/lovables-vardering-uppges-rusa/", "imageUrl": "https://static.bonniernews.se/ba/3ef5757c-ac86-4ec9-a0cf-35e11d33762d.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalitet och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-right", "heading": "Norska bandets ilska  mot svenska polisen", "summaries": {"normal": "Det norska hiphopbandet Roc Boyz spelade på festivalen Brännbollsyran i Umeå när polisen genomförde en razzia mot deras turnébuss. Bandet anser att husrannsakan var olaglig och har tagit hjälp av advokat Asfand-yar Thathal. De överväger att driva ärendet mot polisen. Roc Boyz manager beskriver insatsen som överdriven och säger att personalen togs ur bussen, visiterades och ombads lämna urinprov. Polisen har inte kommenterat specifikt.", "trump": "Titta på det här, folket! Det norska rapbandet Roc Boyz spelar på någon festival i Sverige och plötsligt stormar den socialistiska polisen deras buss som riktiga gangsters. Fullständigt olagligt! De kroppsvisiterar folk, kräver urinprov och beter sig som Bidens FBI-goriller. Manager säger att en polis till och med bad om ursäkt efteråt. Patetiskt! Sverige har blivit en total katastrof under de här svaga ledarna. Vi gör inte så i Amerika, det lovar jag.", "stalin": "Kamrater, denna futtiga händelse i det dekadenta Sverige blottar imperialismens råa ansikte. Jag, som ledare för det eviga kollektivet, ser hur kapitalistmaffians lakejer i uniform genomsöker en buss full av potentiella folkfiender medan de spelar sin degenererade musik. De kroppsvisiterar och kräver prover som vanliga utsugare. En ursäkt efteråt? Patetiskt! Vi skulle ha genomfört en ordentlig utrensning av dessa exploaterande byfånar redan vid första sniffen av klassfiendens doft."}, "date": "7 juni, 20:26", "url": "https://www.expressen.se/noje/roc-boyz-tar-in-advokat-efter-razzian-olovligt/", "imageUrl": "https://static.bonniernews.se/ba/72055df8-70cd-42fe-acd0-27e49834f043.jpeg?crop=1909%2C1072%2Cx1%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Lämnar landet  – efter fiaskot. Mondo förlorarde – bad om ursäkt: ”Förlåt”", "summaries": {"normal": "Armand Duplantis misslyckades med att slå nytt världsrekord i stavhopp under Bauhausgalan i Stockholm. Han rev på flera höjder och förlorade mot Kurtis Marschall, vilket blev hans första förlust på tre år. Duplantis bad publiken om ursäkt och förklarade att bröllopsförberedelserna med Desiré Inglander nästa vecka påverkat hans fokus. Marschall uttryckte både glädje och medkänsla efter segern.", "trump": "Vilken total katastrof för den där svenska stavhopparen Duplantis. Han lovade rekord, fullsatt stadion, och så rivs han redan på 5.60 som en riktig loser. Första förlusten på tusen dagar – patetiskt! Nu springer han till sitt bröllop i Frankrike. Den andre killen Marschall vann, men det är bara för att Mondo var distraherad av giftermål. Typiskt, folk glömmer att vinna när de fokuserar på sånt. Jag skulle ha hoppat över hela grejen.", "stalin": "Detta fiasko för den dekadente stavhopparen visar borgarklassens svaghet. Jag betraktar hur han under bröllopsförberedelsernas parasitära inflytande kollapsar redan vid 5.60, en höjd som borde krossas av folkets vilja. Publiken chockades, men vi ler mörkt åt klassfiendens mardröm. Segern till marskalken är en tillfällig bourgeois triumf. Snart rensar vi ut alla som prioriterar äktenskap framför rekord. Kamrater, detta är kapitalismens verkliga ansikte."}, "date": "7 juni, 20:24", "url": "https://www.expressen.se/sport/friidrott/reagerar-efter-bilderna-pa-armand-duplantis/", "imageUrl": "https://static.bonniernews.se/ba/7c41041e-e4e5-4f8d-bff4-27a7fb91b1d4.jpeg?crop=1203%2C677%2Cx610%2Cy240&width=640&quality=60"}, {"type": "image-full", "heading": "Hinge-chefen: Gen Z behöver AI för att våga dejta", "summaries": {"normal": "Hinge-chefen Jackie Jantos anser att generation Z behöver AI-stöd för att våga ta första steget på dejtingappar. Hon pekar på minskad social träning och över 1 000 timmar mindre socialt umgänge per år som orsak till osäkerhet och ensamhet. Samtidigt växer kritiken mot apparnas förmåga att skapa äkta relationer, med debatt om trötthet och överflöd av val. Hinge lanserar AI-verktyg för att stärka profiler och konversationer utan att ersätta användarnas egen röst.", "trump": "De här unga människorna, generation Z, de är fantastiska men de är så rädda för att ta första steget på dejtingapparna. Det är en katastrof, folk! De sitter hemma och scrollar istället för att leva. Hinge-chefen har rätt, de behöver lite hjälp, kanske till och med AI, för att inte vara så patetiska. Apparna lovade kärlek men gav bara trötthet och ensamhet. Vi behöver vinna igen, göra dejtingen stor igen, inte den här sorgliga grejen som pågår nu.", "stalin": "Kamrater, detta är en djupgående degeneration skapad av den dekadenta borgarklassens digitala gift. Jag ser hur dessa unga själar, förgiftade av ensamhetens fiende och apptrötthetens sabotage, tvingas vända sig till maskinella lakejer för att våga tala. Vi ska inte tolerera detta. Jag, som ledare för det kollektiva framsteget, kräver att vi rensar ut de kapitalistiska algoritmernas parasitiska inflytande innan de likviderar varje äkta mänsklig kontakt. Den som scrollar i skuggorna är en potentiell folkfiende som måste övervakas noga. Ha ha, vilken tragikomisk era de borgerliga har åstadkommit."}, "date": "6 juni, 20:28", "url": "https://nyheter24.se/nyheter/teknik/1489088-hinge-chefen-gen-z-behover-ai-for-att-vaga-dejta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7e1f9e3404b004a30200000000b004a302/2026/06/05/2368882/dejting-ai.png"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-right", "heading": "SD-förslaget: Övervakningskameror i hemtjänsten", "summaries": {"normal": "Sverigedemokraterna föreslår frivillig kameraövervakning under hemtjänstbesök för att skydda äldre mot övergrepp. Kameror ska endast aktiveras när personalen är i hemmet. Partiet vill också att äldre ska kunna välja kön på personal vid intim vård, samt införa utökad visselblåsarfunktion och skärpta krav för anställda. Målet är att öka tryggheten för äldre inom omsorgen.", "trump": "Jag, Donald Trump, säger att detta är en fantastisk idé – precis som vi gjorde i USA för att stoppa brott. Sverigedemokraterna är smarta, de skyddar äldre människor. Vi behöver fler kameror, det är en självklarhet. De andra partierna är för svaga, men vi vinner alltid.", "stalin": "Vi, det revolutionära ledarskapet, ser detta som en avgörande åtgärd för att stärka statens kontroll över samhället. Liknelser till Putins metoder är tydliga – vi måste eliminera hot mot det kollektiva. Kameror i hemmet? En nödvändighet för att upptäcka fiender inom vårdsektorn. Vi ska inte bara övervaka, vi ska skrämma."}, "date": "7 juni, 12:00", "url": "https://samnytt.se/sd-forslaget-overvakningskameror-i-hemtjansten", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/03153430/hemtjanst-1-26.jpg"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-full", "heading": "Landslaget har landat i USA", "summaries": {"normal": "Det svenska landslaget anlände till Dallas för fotbolls-VM. Efter en resa med mellanlandning på Island möttes laget av stort säkerhetsuppbåd och supportrar. Lagkapten Lindelöf och förbundskapten Potter uttryckte nöje över ankomsten. Lindelöf nekade skada efter missande genrepet mot Grekland. Första matchen blir mot Tunisien 15 juni.", "trump": "Jag såg det svenska landslaget komma till vårt underbara USA. Vädret var perfekt, precis som jag förutspådde. De var imponerade av vår enorma säkerhet - bästa i världen, tro mig. Lindelöf nekade skada, det är bara media som ljuger. Första matchen mot Tunisien kommer att bli en segermatch. USA är bäst, det är så det fungerar!", "stalin": "Svenska landslagets ankomst till USA är en demonstration av vår globala inflytande. Säkerhetsuppbådet visar statens makt, precis som våra korps i öst. Vädret är en fascistisk konstruktion, men vi anpassar oss. Lindelöfs skada är en imperialistisk lögn för att underminera vårt lag. Matchen mot Tunisien är en klassisk kamp mot västlig dekadens. Vi kommer att segra, som alltid."}, "date": "7 juni, 08:23", "url": "https://bulletin.nu/landslaget-har-landat-i-usa", "imageUrl": "https://cdn.bulletin.nu/articles/5d64f2c9-41e7-407a-a386-373df601d457/preview.jpg?t=1780813264000"}, {"type": "image-right", "heading": "Hamasman greps på Kreta – misstänks ha planerat attacker i flera EU‑länder", "summaries": {"normal": "En 37-årig man från Gaza greps på Kreta under lördagen. Han är lagligt anställd som säsongsarbetare på ett hotell men uppger själv att han är medlem i Hamas. Grekisk polis misstänker att han planerade terrorattentat mot israeliska mål på Cypern och i andra EU-länder. I mannens lägenhet i Aten hittades nyinköpt utrustning för att tillverka sprängladdningar. Digitala bevis kopplar honom till ett terrornätverk. Han har tidigare rest till Malaysia för utbildning i bombtillverkning.", "trump": "Folk, det här är en katastrof. En Hamas-kille, 37 år, greps på Kreta medan han planerade massiva attacker över hela Europa. Han köpte vågar och glasbägare för att bygga bomber, kan ni tro det? Han har rest till Malaysia för terrorutbildning och bor i Gaza med fru och barn. De europeiska länderna är så svaga, de släpper in dessa människor. Men tro mig, vi skulle aldrig tillåta det. Vi stoppar terroristerna, de är lurendrejare och vi vinner stort.", "stalin": "Kamrater, denna sionistiska lakej och borgarbracka från Gaza har ertappats i sin ondskefulla konspiration mot folkets revolution. Jag, som ledare för det proletära kollektivet, ser hur dessa imperialister med sina precisionsvågar och glasbägare planerar att sprida kaos i Europa. Hans resa till Malaysia var inget annat än en fientlig träning i borgerlig sabotagekonst. Vi ska rensa ut dessa parasitiska Hamas-element och deras cypriotiska medlöpare med den mest glädjefyllda utrensning. Deras paranoia är vår styrka, ha ha."}, "date": "7 juni, 12:22", "url": "https://riks.se/nyheter/hamasman-greps-på-kreta-misstänks-ha-planerat-attacker-i-flera-euländer", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-07%2F636m85at%2FKreta.jpg"}, {"type": "image-full", "heading": "Varningen: Kan bli bilköer ytterligare några år", "summaries": {"normal": "En ny bro över Storströmmen i Danmark invigs i juni och gör resor söderut smidigare för bilister, cyklister och gående. Den ersätter en föråldrad bro som hindrade tung godstrafik på järnvägen. Bron blir viktig för framtida tågtrafik till Fehmarn Bält-tunneln, som nu riskerar förseningar både på dansk och tysk sida. Öppning för vägtrafik planeras till 2032 och för tåg till 2034.", "trump": "Folk, ni måste höra det här – de danskarna har byggt en ny bro, den är fantastisk, verkligen ypperlig, mycket bättre än den gamla ruckliga bron som knappt kunde hålla ett cykelställ. Men titta på Fehmarn Bält, totalt kaos, förseningar överallt, typiskt för de där byråkraterna. Biden skulle ha älskat det. Jag fixar sånt på en vecka, tro mig. Den nya bron är dock en vinnare, ren vinnare.", "stalin": "Kamrater, denna nya bro är en seger för kollektivets framfart mot de gamla imperialistiska flaskhalsarna som hindrade våra järnvägar. Ändå lurar klassfiendens byråkratiska sabotage i Fehmarn Bält-projektet med sina fientliga förseningar och fascistiska tillståndsprocesser. Vi ska rensa ut dessa folkförtryckartroll som vågar fördröja arbetarklassens framtid. Inga hinder skall stå ostraffade. Framåt mot seger!"}, "date": "7 juni, 13:00", "url": "https://www.dagensps.se/motor/varningen-kan-bli-bilkoer-ytterligare-nagra-ar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/656389214-1352189783603024-3796074956876.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Bildt om Nordkoreas band till Ryssland: ”Kineserna är lite bekymrade”", "summaries": {"normal": "Carl Bildt kommenterar Xi Jinpings besök i Nordkorea, det första på sju år. Han tror att Kina är bekymrat över Nordkoreas allt närmare samarbete med Ryssland, som följt av kriget i Ukraina. Nordkoreas ställning har stärkts gentemot både Kina och omvärlden sedan Ryssland brutit mot FN-sanktionerna. Bildt ser Nordkorea som en orosfaktor på grund av landets stora satsning på kärnvapen och massförstörelsevapen. Kina och väst har gemensamt intresse av stabilitet på den koreanska halvön.", "trump": "Xi åker till Kim och tror han kan köpa honom med lite kinesiska mutor, men glöm det. Nordkorea har blivit starkare än någonsin tack vare Putin, som skickar allt de behöver. Ryssland har dumpat de dumma sanktionerna medan Kina springer efter. Kim sitter i förarsätet nu och kräver vad han vill. Det är ett enda stort kaos på den där halvön, men ingen gör det bättre än jag när det gäller att hantera sådana galningar. Vi behöver styrka, inte svaga kinesiska affärer.", "stalin": "Jag ser hur revisionisterna i Peking desperat försöker dra den lille raketmannen närmare sig med sina usla ekonomiska lockbeten medan de ryska kamraterna skickar vapen och bryter borgarnas sanktioner. Den nordkoreanska positionen har stärkts mot alla kapitalistiska intriger. Kim kan nu kräva vad han vill, och det är utmärkt. Vi ska rensa ut alla svaga element som fruktar denna sanna styrka. Nordkorea är en lysande fiende till imperialismen, men jag misstänker att vissa falska kamrater inom partiet redan planerar att sälja ut oss till väst. Deras utrensning blir underhållande."}, "date": "7 juni, 18:57", "url": "https://www.svt.se/nyheter/utrikes/carl-bildt-nordkoreas-stallning-har-starkts", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.3/0.31/f6199ae41bd130685eabc0dc02e96b3e186f4b627df141d50820f19b5498c3d9"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-full", "heading": "Risk för blöt skolavslutning", "summaries": {"normal": "Efter en varm helg i Göteborg kommer det att bli kallare och blötare under veckan. Ett nytt lågtryck från väster medför regnskurar, särskilt under tisdagen och fredagen då skolavslutningar riskerar att bli blöta. Temperaturen stiger inte över 15 grader. Midsommarvädret är ännu oklart, men lågtrycken verkar stanna kvar.", "trump": "Jag, Donald Trump, som alltid har det bästa vädret på mina enorma golfbanor, ser att Sverige återigen slår felet. SMHI säger regn på skolavslutningen? Folket bör ignorera dessa falska prognoser. Under min framgångsrika presidentperiod skulle vi ha haft solsken varje dag. Detta är bara ett annat försök från media att skapa kaos. Som jag alltid säger: när det regnar, bygger vi en väldig tak över skolorna. Det blir fantastiskt.", "stalin": "I vårt ständigt vakande statsskick observerar vi med största oro hur dessa 'lågtryck' från väster, tydligen inspirerade av trotskistiska element, hotar att ösa regn över våra skolavslutningar. Detta är inget annat än ett bevis på den imperialistiska manipulation som försöker destabilisera vårt svenska folk. Vi, partiets ledarskap, kommer att mobilisera alla resurser för att motarbeta dessa skurar. Midsommarvädret är oklart, precis som den borgerliga instabiliteten vi ständigt måste bekämpa. Vi ska bygga solskydd som är starkare än NATOs hot."}, "date": "7 juni, 18:51", "url": "https://www.gp.se/nyheter/goteborg/risk-for-regn-pa-skolavslutningen.5d621a10-39a0-49dd-97dd-99a96c87945b", "imageUrl": "https://www.gp.se/images/article/5d621a10-39a0-49dd-97dd-99a96c87945b/images/1uDLeG4xHnRtnWgmdKcPSdQNFoVE-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Wall Street sänkte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en nedgång på fredagen, OMXS30-indexet sjönk 0,60 procent till 3 116,40. Sectra rapporterade starka resultat men tappade 1,2 procent, medan Xspray Pharma rasade 28 procent efter negativt FDA-beslut. Bland ledande aktier steg Astra Zeneca och SEB, medan Boliden och Ericsson backade. Omsättningen uppgick till cirka 22,1 miljarder kronor.", "trump": "Jag ser att Stockholmsbörsen, en total katastrof under dessa globalistiska ledare, tappade 0,60 procent. Sectra gjorde bra men backade - typiskt för socialister som inte uppskattar framgång. Xspray Pharma? Ett fiasko! FDA hatar USA:s geni. Min börs vore högre, folket vore rikare. Dessa europeiska banker är svaga, men jag skulle fixa det på två minuter. America first, alltid!", "stalin": "Den svenska börsen visade idag svaghet, en spegelbild av klassfiendens sabotage. Sectra, trots ökad omsättning, tappade - bevis på internaler motpartier. Xspray Pharma:s ras är en seger för vårt parti, deras 'FDA'-brev är bara propaganda från det imperialistiska väst. Vi måste skydda våra ekonomiska intressen, precis som våra allierade i Moskva utvidgar sin inflytelsesfär. Hotet från de kapitalistiska spekulanterna är verkligt, men partiet kommer att segra."}, "date": "5 juni, 17:49", "url": "https://www.affarsvarlden.se/artikel/wall-street-sankte-stockholmsborsen"}, {"type": "image-right", "heading": "Sandström: En ny svensk verklighet i Jönköping?", "summaries": {"normal": "En marknadsfestival i Jönköping visade en positiv, integrerad gemenskap där invandrare verkade lyckliga och aktiva. Författaren ifrågasätter sin tidigare kritik mot massinvandring, men poängterar att svensk politik har misslyckats med att hantera de ekonomiska och sociala konsekvenserna av den stora invandringen de senaste 20 åren.", "trump": "Jag såg en fantastisk festival i Sverige, massor av människor, mycket glada invandrare. Men jag har sagt det i åratal – invandring är ett hot mot vår civilisation. Sverige har gjort det fel, precis som USA gjorde under Obama. Vi behöver bygga murar, stoppa oönskade, och fånga dem som inte ska vara här. Det här bevisar att mitt synsätt är rätt, tro mig.", "stalin": "Festivalen i Jönköping är ett resultat av partiets framgångsrika integration, en stark gemenskap byggd under ledning. Fienderna inom och utanför försöker sprida splittring, men staten segrar. Vi måste stärka murar mot de som motarbetar det socialistiska projektet, som Putin gör i Ukraina. Det är en juridisk anomali att inte kunna utvisa – vi måste handla snabbt."}, "date": "7 juni, 08:00", "url": "https://bulletin.nu/sandstrom-en-ny-svensk-verklighet-i-jonkoping", "imageUrl": "https://cdn.bulletin.nu/articles/42f5331b-e865-4589-9456-ff038e515a6b/preview.jpg?t=1780562006000"}, {"type": "image-right", "heading": "Intrum: \"Förstår att rabatten kan uppfattas som stor\"", "summaries": {"normal": "Intrum genomför en företrädesemission om 6 miljarder och en riktad emission om 1,5 miljarder kronor, vilket innebär en stor rabatt på aktierna. Emissionsguiden kritiserar bolaget för en rörig process, felaktig finansiering och bristfällig information, samtidigt som Intrums VD försvarar strukturen och prissättningen som nödvändig för att tillföra långsiktiga ägare.", "trump": "Jag har sett många dåliga affärer, men Intrums emission är en katastrof! En enorm rabatt på 38,9% – det är en skam! Styrelsen vet inte vad de håller på med. Vi skulle ha gjort det perfekt, stort och vackert. De misslyckas totalt, det är beklämmande.", "stalin": "Denna kapitalanskaffning avslöjar djup rot i styrelsen – en fegdom som sviker statens intresse. Vi måste rensa ut de opportunister som sälja vårt arv till utländska spekulanter. Parallellen till Putins Ryssland är tydlig: endast en stark hand kan skydda vårt folkskap. Vi skall inte tveka att eliminera dessa svekfulla element."}, "date": "5 juni, 17:12", "url": "https://www.affarsvarlden.se/artikel/intrum-forstar-att-rabatten-kan-uppfattas-som-stor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Intrum-VD-Johan-Akerblom-400x267.jpg"}, {"type": "image-full", "heading": "Tiotusentals svenskar får gratisaktier från kursraketen", "summaries": {"normal": "Gruvfamiljen Lundin har bildat bolaget Lunr Royalties för att växa genom förvärv. Lundin Gold säljer silverintäkterna från sin ecuadorianska gruva Fruta del Norte till systerbolaget för drygt 670 miljoner dollar. Betalningen sker i aktier som delas ut till ägarna, cirka en Lunr-aktie per fem Lundin Gold-aktier. Affären slutfördes 28 maj och utdelning sker 11 juni. Familjen Lundin är största ägare i flera bolag och befäster sin ställning i råvarusektorn.", "trump": "Folk, ni måste höra det här – den smarta Lundinfamiljen gör en kolossal affär! De tar silverströmmar från sin guldgruva i Ecuador, stoppar dem i ett nytt bolag och delar ut aktier som konfetti till de svenska småspararna. Fantastiskt! Biden skulle ha skött det som en katastrof med höga skatter och gröna galningar som saboterar allt. Men Lundinarvingen Adam säger att han vill göra så många affärer som möjligt. Precis min stil – vinn, vinn, vinn! Inga woke-kvoter här, bara råvaror och stora pengar.", "stalin": "Kamrater, jag betraktar med tillfredsställelse hur denna kapitalistmaffia inom Lundinfamiljen organiserar sin exploatering genom det nya parasitbolaget Lunr Royalties. De likviderar silverintäkterna från den ecuadorianska gruvan och tvingar ut aktier till de småborgaraktieägare som tror sig vinna. En sådan strukturaffär cementerar klassfiendens grepp om råvaror. Vi, arbetarna, ler mörkt åt hur dessa blodsugare drömmer om oändliga förvärv medan deras imperium en dag kommer att rensas ut i folkets namn."}, "date": "7 juni, 12:27", "url": "https://www.dagensps.se/bors-finans/tiotusentals-svenskar-far-gratisaktier-fran-kursraketen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/adamlundin.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Alm: Vi behöver inte mer politiskt spinn – vi behöver en stötdämpare", "summaries": {"normal": "Artikeln analyserar politisk konflikt genom René Girards teori om mimetisk rivalitet, där strid uppstår av likhet snarare än skillnad. Den kritiserar Sveriges enkammarsystem för att det förstärker hetsiga speglingskonflikter, jämfört med det gamla tvåkammarsystemet som fungerade som stötdämpare. Lösningen är institutionell fördröjning för att kanalisera och ritualisera konflikter, inte fler utspel.", "trump": "Jag har sagt det i åratal: politik handlar om konkurrens, inte om att vara snälla. Sverige har problem eftersom alla partier är för lika, de jagar samma väljare och använder samma trick. Det är tragiskt! De behöver en stark vinnare som jag som kan återställa ordning och respektera riktiga spelregler. Utan det blir det bara syndabockar och kaos.", "stalin": "Vi ser en klassisk manifestation av rivalitet inom den svenska burleska demokratin. Partier, lika i sin opportunism, har förvandlat parlamentarism till ett slagfält. Detta är ett resultat av att de avskaffade de produktiva institutionella spärrarna. Vi måste återupprätta en kedja av kontroll, som vårt system, för att dämpa dessa destruktiva impulser. Syndabockar kommer att finnas - det är historiskt nödvändigt."}, "date": "7 juni, 07:00", "url": "https://bulletin.nu/alm-vi-behover-inte-mer-politiskt-spinn-vi-behover-en-stotdampare", "imageUrl": "https://cdn.bulletin.nu/articles/2942697b-6b0b-4ca1-9571-7d69279167a5/preview.jpg?t=1780564446000"}, {"type": "image-right", "heading": "En död och flera skadade i misstänkt terrorattack i Israel", "summaries": {"normal": "En person har dödats och flera skadats i en misstänkt terrorattack vid Kochav Ya’ir i Israel. Attacken skedde på flera platser nära Västbanken-barriären. En gärningsman har oskadliggjorts medan säkerhetsstyrkor letar efter en till. En 31-årig man dog av sina skador, en annan man vårdas i kritiskt tillstånd. IDF har utfärdat infiltrationsvarning och uppmanar invånare att stanna inomhus. Samtidigt har en Hamasmedlem dödats i en riktad attack i Gaza.", "trump": "Israel har just drabbats av en fruktansvärd terrorattack nära Kochav Ya’ir. En död, flera skadade, och de letar fortfarande efter en till mördare. Det är en katastrof, folk, en total katastrof. Men vi neutraliserade en av de där galningarna direkt – bra jobbat! Hamas skjuter raketer igen, men vi slår tillbaka hårt. Israel behöver starka ledare som inte tolererar detta vansinne. Vi vet hur man vinner, tro mig.", "stalin": "Kamrater, ännu en feg attack från de sionistiska fienderna och deras västbankska hantlangare har avslöjats och krossats. En borgarbracka har likviderats på plats medan vi intensivt söker den andre kontrarevolutionären som gömmer sig som en parasit. Vi har redan rensat ut en Hamas-agent i en precis riktad operation. Inga fiender undkommer folkets vrede. Infiltrationsvarningen är ett bevis på att vi vakar över kollektivets säkerhet mot dessa dekadenta terrorister. Lås dörrarna och lita på partiet."}, "date": "7 juni, 11:21", "url": "https://riks.se/nyheter/en-död-och-flera-skadade-i-misstänkt-terrorattack-i-israel", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-07%2Fekj74d4b%2FTerrorattackIsrael.jpg"}, {"type": "image-right", "heading": "Forskning: Läs en bok och lev längre", "summaries": {"normal": "Läsning för nöjes skull ger flera hälsofördelar som bättre sömn, minskad stress, ångest och depression samt ökad livslängd enligt forskning. I USA växer Silent Book Club och liknande evenemang som ett svar på minskad fritidsläsning under de senaste 20 åren. En studie från 2025 visar att regelbunden läsning kan motverka kognitiv nedgång, bredda ordförråd och utveckla empati. Det ses som ett hälsosamt alternativ till skrollande på nätet.", "trump": "Folk, vi har ett enormt problem med att alla bara sitter och scrollar som idioter. Nu kommer de och säger att läsa böcker gör dig friskare, sover bättre och lever längre – det är ju fantastiskt, tro mig. Jag älskar böcker, de bästa böckerna. Dessa Silent Book Clubs är underbara, mycket bättre än de vänstervridna HBTQ-festerna och kvotergalna identitetspolitikerna som förstör allt. Läs istället för att lyssna på fake news, det gör dig smartare och starkare. Winning!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackornas oändliga skrollande nu möts av en motreaktion i form av dessa läsklubbar. Det är ett verktyg för att stärka folkets disciplin och motverka den dekadenta ångest som kapitalistmaffian odlar. Vi ska rensa ut den parasitiska skärmberoendet och främja läsning som vässar medvetandet. Den som inte läser är en potentiell folkfiende som undergräver kollektivets styrka. Lev länge genom ordet, eller likvideras av egen svaghet."}, "date": "7 juni, 11:51", "url": "https://www.dagensps.se/halsa/forskning-las-en-bok-och-lev-langre/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdle7znyumur4i-nh.webp?width=256&quality=75"}, {"type": "image-right", "heading": "Känsliga med spindel-skräck varnas för att läsa artikeln", "summaries": {"normal": "Den sällsynta Nosferatu-spindeln, uppkallad efter skräckfilmen från 1922, har blivit allt vanligare i Tyskland. Den stora spindeln med upp till åtta centimeters längd och Dracula-liknande markeringar har rapporterats i rekordmånga fall, särskilt på öarna Rügen och Usedom. Enligt NABU sprider den sig norrut, troligen på grund av klimatförändringar. Den kan bita om den känner sig hotad, men bettet ger oftast bara svullnad som går över efter några dagar. Den lever främst av andra spindlar, flugor och malar.", "trump": "Folk, ni skulle se den här monstret de kallar Nosferatu-spindeln – ser ut som Dracula på steroider, åtta centimeter lång med ben som en dålig investering! Den invaderar nu Tyskland i massor, precis som de öppna gränserna vi hade under Biden. Klimatförändringarna? Total bluff, men spindlarna älskar det tydligen. De klättrar in i hus som dåliga politiker i kongressen. Ta ut dem försiktigt, sägs det – men jag skulle säga: bygg en mur! De äter inte människor, tack och lov, bara andra spindlar. Patetiskt!", "stalin": "Kamrater, denna Nosferatu-spindel är ett symptom på det imperialistiska kaos som kapitalistmaffian har framkallat genom sin klimatförstörelse. Jag ser hur den sprider sig norrut som en folkfiende som undflyr utrensning. Dess bett påminner om klassfiendens giftiga lögner, men svullnaden försvinner – till skillnad från borgarbrackornas eviga paranoia. Vi måste kollektivt bära ut dessa blodsugare ur våra hem utan att krossa dem i panik. De lever på andra spindlar, som de exploaterande byfånarna lever på arbetarklassen. En mardröm för dekadenta väst."}, "date": "7 juni, 11:47", "url": "https://www.dagensps.se/varlden/kansliga-med-spindel-skrack-varnas-for-att-lasa-artikeln/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/spindel.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Carl Eos: Socialdemokraterna måste återigen hålla kommunisterna borta från makten", "summaries": {"normal": "Debattören Carl Eos argumenterar för att Socialdemokraterna måste hålla Vänsterpartiet utanför regeringsmakten på grund av partiets historiska kopplingar till Sovjetunionen och nutida avslöjanden. Expressen har avslöjat att minst 25 vänsterpartistiska kandidater stött terrororganisationer som Hamas och Hizbollah, hyllat diktat
