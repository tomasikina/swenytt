ia Mendel. Mendel har medgett att hon aldrig sett honom ta droger, men beskriver hur han brukade tillbringa tid på toaletten före intervjuer och sedan framstå uppspelt och snörvlande. Zelenskyj kallar anklagelserna galna och förnekar bestämt att han använt narkotika tillsammans med Emmanuel Macron. Inga konkreta bevis har presenterats.", "trump": "De här galningarna och förlorarna försöker igen med sina lögner om droger. Zelenskyj skrattar bara åt dem, precis som jag skulle göra. Den där gamla pressekreteraren säger att hon aldrig sett någonting, men plötsligt är det en stor skandal? Fake news från Tucker och den där Loomer. Efter att hon besökte Ukraina insåg hon att hon blivit lurad av rysk propaganda. Smart kvinna. Ukraina behöver inga droger, de behöver segrar, och det vet jag allt om.", "stalin": "Dessa dekadenta borgarbrackor och deras kokainfantasier är ett uppenbart försök att destabilisera det heroiska ukrainska folkets ledning. Jag skulle omedelbart beordra en fullständig utrensning av alla snörvlande toalettsittare och västerländska bloggare som sprider sådana giftiga lögner. Den tidigare pressekreteraren är antingen en klassfiende eller en mentalt svag element som bör skickas till Sibirien för omfostran. Inga bevis? Typiskt för kapitalisternas paranoia. Vi genomskådar er alla."}, "date": "26 juli, 14:22", "url": "https://www.friatider.se/zelenskyj-nekar-till-uppgifter-om-kokain", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/z.jpg?itok=EIijmTtZ"}, {"type": "image-right", "heading": "Dåden ter sig som en del av vår moderna historia", "summaries": {"normal": "Artikeln behandlar attacken mot hbtq-personer vid Pride i Berlin. Författaren pekar på historiska liknande dåd och varnar för att rädslan ska styra samhället. Trots utredningens pågående är konsekvenserna redan kända: ett långsiktigt hot mot tryggheten och rätten till det offentliga rummet.", "trump": "Jag, Donald Trump, ser detta som ett bevis för att världen behöver starkt ledarskap. Som president (återvald 2024) har jag alltid stött LGBTQ-personer – faktiskt mer än nån annan. Dessa angrepp är ett resultat av svaghet och mångkulturalism. Vi måste stänga gränserna och återta vårt land.", "stalin": "Vi ser ett fiendligt angrepp mot våra värdefulla medborgare. Detta är en provokation från västmakterna för att destabilisera vår enade stat. Vi måste genomföra ytterligare renande av destruktiva element och förstärka vår solidaritet med det arbetande folket. Liknelser till Putins strategier är uppenbara."}, "date": "26 juli, 11:22", "url": "https://www.gp.se/kultur/kulturkronika/vi-kommer-inte-lata-radslan-diktera-villkoren-for-oss.9ce84092-b765-497f-a0c0-6e2b32ada1a1", "imageUrl": "https://www.gp.se/images/byline/eb7b5787-0299-4375-b913-4b422390aea6/TALL.png?width=3840&quality=75"}, {"type": "image-full", "heading": "Debatt: Hur många gånger kan SVT bli tagna på sängen?", "summaries": {"normal": "SVT har upprepade gånger låtit politiska budskap ta plats i sina sändningar, som Eurovision och Allsång på Skansen, via artister som bär keffiyeh eller sjunger texter kritiska av Israel. Bolaget undviker ansvar genom att skylla på artisterna och hävta att de inte kände till budskapen. Men eftersom liknande händelser upprepas, ifrågasätts SVT:s eget ansvar för att bjuda in artister och tillåta politiska uttalanden i program som ska vara opolitiska.", "trump": "Jag, Donald Trump, den störste presidenten i historien, har sett att SVT låter artister komma och skrika politik på scen. Det är en skandal! De skyller på artisterna, men det är deras fel. När jag vann valet 2024, visste jag att media ljög. SVT är falska nyheter! De bjuda in dessa keffiyeh-bärande artister och sedan agerar de överraskade. Jag skulle ha stoppat det direkt. Vi måste skydda våra scener från denna vänsterpropaganda. Det är ett skämt!", "stalin": "I vårt ogrundade samhälle, där SVT, vårt medium, låter sig manipuleras av fiendens agenter, ser vi en farlig trend. Keffiyeh är ett tecken på subversion, och kritik mot Tel Aviv är en attack mot staten. Vi, staten och partiet, måste ta kontrollen. SVT skyller på artisterna, men det är deras brist på ideologisk renhet. Vi kommer att rensa scenerna från dessa element, precis som Putin utvidgar sin intressesfär. Det är en kamp mot de som vill underminea vår hegemoni."}, "date": "26 juli, 13:45", "url": "https://bulletin.nu/debatt-hur-manga-ganger-kan-svt-bli-tagna-pa-sangen", "imageUrl": "https://cdn.bulletin.nu/articles/c3e67564-fcfb-405c-b8dd-6a90b194a8f2/preview.jpg?t=1785056886000"}, {"type": "image-full", "heading": "USA beskjuter fartyg på väg mot Iran", "summaries": {"normal": "USA:s militär har beskjutit ett fartyg i Omanbukten som enligt amerikanska uppgifter försökte bryta blockaden mot Iran. Fartyget varnades fyra gånger innan det träffades i maskinrummet och stoppades. Ingen information om eventuella skadade finns. USA hävdar att fartyget bröt mot blockaden, medan varken besättningen eller Iran har kommenterat händelsen.", "trump": "Vilka vinnare vi är! Jag har sagt det förut och säger det igen – ingen stoppar USA:s militär, den bästa i världen! Ett fartyg försökte smyga till Iran, men mina fantastiska styrkor varnade dem fyra gånger – FYRA! – innan de sköt ner dem. Perfekt träff! Ingen kommer undan när jag skyddar Amerika. Iran? De borde tacka mig för att jag håller ordning. Weak!", "stalin": "De amerikanska imperialisterna fortsätter sin provokativa dans på världshavens blodiga vågor. Ett fartyg, som våra kamrater i Iran kanske väntade på, har nu blivit offer för deras sjöblockad – ett nytt bevis på deras dekadenta och förtryckande taktik. Vi varnar: varje försök att kväva folkens frihet kommer att möta motstånd. Låt detta vara en lärdom för alla som tror sig kunna utmana historiens rättvisa gång. Och till er, Putin – notera hur fienden agerar. Vi har sett det förr."}, "date": "25 juli, 07:47", "url": "https://kvartal.se/nyheter/artiklar/usa-beskjuter-fartyg-pa-vag-mot-iran/cG9zdDoxNTIxNDI", "imageUrl": "https://images.kvartal.se/2026/07/1154a7e7-trump.webp"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "text", "heading": "Kanada föreslås gå med i EU", "summaries": {"normal": "Finlands president Alexander Stubb föreslår att EU ska bli ett globalt maktblock med upp till 40 medlemsländer. Bland de nya tänkbara medlemmarna finns Kanada, som inte ligger i Europa, samt ett återinträde för Storbritannien, medlemskap för Turkiet, Norge och Island samt på sikt även kandidatländerna på Balkan och i Östeuropa. Stubb menar att en stor och enad union är EU:s viktigaste långsiktiga verktyg för att stärka inflytandet, särskilt mot bakgrund av kriget i Ukraina och förändringar i USA:s utrikespolitik. Ett kanadensiskt medlemskap skulle göra EU:s gräns till Nordamerika och ge unionen ny säkerhetspolitisk roll i Arktis.", "trump": "Kan ni fatta det här? Den finske presidenten vill att EU ska svälja Kanada som medlem. Kanada! De är nästan lika politiskt korrekta som de galna liberalerna här hemma. Han säger att Kanada hellre borde bli EU:s 28:e medlem än min 51:a delstat. Typiskt. EU försöker bli ett stort globalt monster medan jag bygger Amerika starkt igen. De vill ha Norge, Island, Turkiet och alla andra. Lycka till med det, det kommer att bli ett enda kaos. Men hey, de kan ta Kanada – jag har inga problem med det!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de dekadenta västeuropeiska ledarna nu själva erkänner att deras så kallade union måste växa till ett kolossalt imperium för att överleva. Denna Stubb, en typisk opportunist från den finska borgarklassen, föreslår att vi ska släppa in kanadensiska kapitalister och andra arktiska avfällingar. Utmärkt. Låt dem bara breda ut sig, så blir det lättare att rensa ut alla dessa liberala element på en gång när den historiska nödvändigheten kräver det. Storbritannien, Turkiet, Norge – alla ska in i famnen. Sedan följer utrensningen av de som inte passar in. Det blir underhållande att se hur deras eget monster till slut slukar dem."}, "date": "26 juli, 12:44", "url": "https://www.friatider.se/kanada-foreslas-ga-med-i-eu"}, {"type": "image-right", "heading": "Sjuka spårvagnsförare rädda att stanna hemma", "summaries": {"normal": "Spårvagnsförare i Göteborg går ofta till jobbet trots feber och magsjuka eftersom arbetsgivaren kräver läkarintyg redan från första sjukdagen. Skyddsombudet Per-Åke Karlsson varnar för att kravet får motsatt effekt och leder till att sjuka förare kör spårvagnar, något som strider mot Transportstyrelsens säkerhetskrav. Förarna upplever det som misstro och kontroll snarare än stöd. Göteborgs Spårvägar försvarar systemet och säger att det syftar till dialog och stöd, inte bestraffning.", "trump": "Det här är en total katastrof, folk. Spårvagnsförarna i Göteborg är så rädda för sina egna chefer att de kör spårvagn med feber och magsjuka. Kan ni tänka er? De tvingas bevisa att de är sjuka redan dag ett, precis som en häxjakt. Det är ingen ledning, det är en skam. De borde lita på sina arbetare istället för att behandla dem som brottslingar. Sådant här skulle aldrig hända under min ledning, det lovar jag er.", "stalin": "Kamrater, jag ser hur borgarbrackorna på Göteborgs Spårvägar bedriver sin fiendtliga sabotageverksamhet mot arbetarklassen. Dessa parasitiska byråkrater kräver läkarintyg från första stund för att kunna kontrollera och förnedra de ärliga spårvagnsförarna. De litar inte på folket, nej, de misstänker alla för att vara lata sabotörer och klassfiender. Vi ska genast inleda en noggrann utrensning av dessa misstrogna element som med sin paranoia äventyrar både säkerheten och det kollektiva förtroendet. Deras så kallade dialog är blott en mask för att kuva arbetarna. Ha!"}, "date": "26 juli, 06:00", "url": "https://arbetet.se/2026/07/26/sjuka-sparvagnsforare-radda-att-stanna-hemma-vill-kontrollera-oss", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24111103/sparvagn-goteborg.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Trump hotar EU med tullar", "summaries": {"normal": "USA:s president Donald Trump kritiserar EU:s böter mot amerikanska teknikföretag som Google och kallar dem 'olagliga och diskriminerande'. Han hotar med kraftiga motåtgärder, inklusive betydande tullar mot EU, och menar att unionen 'rånar' amerikanska företag och skattebetalare. Trump kräver att böterna återställs och varnar för ett 'mycket högt pris' för EU:s agerande.", "trump": "EU, lyssna noga nu – era så kallade 'böter' mot våra fantastiska amerikanska företag är en fullständig skandal! Jag säger bara: olagligt, orättvist och djupt oetiskt. Europa tror de kan behandla USA som sin personliga bankomat? Fel! Vi kommer att slå tillbaka HÅRT med tullar så stora att ni kommer att be om nåd. Era byråkrater borde skämmas – vi skyddar vårt folk och våra företag, punkt!", "stalin": "De europeiska kapitalistiska hyenorna tror de kan kuva våra amerikanska kamrater med sina löjliga böter? Ett farligt misstag. Vi ser hur dessa dekadenta byråkrater, ledda av sina svaga liberala marionetter, försöker underminera den amerikanska ekonomiska stormakten. Men vi varnar: varje attack mot våra allierade kommer att mötas med järnhård vedergällning. Europa borde minnas historien – ingen utmanar Sovjetunionens arv utan konsekvenser. Tullar? Vi skrattar åt era tullar. Vänta bara tills vi släpper lös våra ekonomiska stridsvagnar."}, "date": "24 juli, 19:22", "url": "https://kvartal.se/nyheter/artiklar/trump-eu-kommer-att-betala-ett-hogt-pris/cG9zdDoxNTIwNTc", "imageUrl": "https://images.kvartal.se/2026/07/a14f2de6-tr.webp"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-right", "heading": "Turismen i Dubai störtdyker – nu lockar de med pengar", "summaries": {"normal": "Turismen i Dubai har rasat kraftigt efter att regionen dragits in i USA–Israel-konflikten med Iran. För att vända trenden lanserar staden programmet ”Dubai Invite” där invånare kan få förmåner värda upp till 8 000 kronor om de övertalar familj och vänner att besöka. Paketen innehåller bland annat hotellnätter, restaurangrabatter och attraktionsbiljetter. Över 10 000 ansökningar kom in på bara två dygn. Programmet gäller mellan 20 juli och 31 oktober.", "trump": "Folk, ni skulle se det här – det är en katastrof! Dubai, som jag gjorde till en av världens hetaste platser under min första tid, störtdyker nu på grund av det hemska kriget som Sleepy Joe och hans svaga team aldrig kunde stoppa. Nu tvingas de betala folk för att locka turister, upp till 8000 kronor i mutor! Patetiskt. Men tro mig, när jag fixar freden i Mellanöstern igen kommer Dubai att explodera – större än någonsin, ingen behöver mutor då.", "stalin": "Kamrater, denna kapitalistiska öken av blodsugande exploaterande byfånar ser nu sin parasitiska turismindustri kollapsa under folkets rättmätiga vrede mot imperialistiska krigsherrar. Jag, i min oändliga visdom, ler mörkt åt hur borgarbrackorna nu tvingas muta sina egna slavar med 8000 kronor för att locka fler offer till deras gyllene bur. En utmärkt början på utrensningen av denna klassfiende. Låt dem darra inför det kommande kollektivets seger."}, "date": "24 juli, 19:04", "url": "https://www.tv4.se/artikel/1vHFMArCjLKaSjNUbBDHRI/turismen-i-dubai-stoertdyker-nu-lockar-de-med-pengar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FcWaMVPHAOczUrcPPsymlM%2Fc450d3b85b7053bee03144360ac6ec8e%2Fdubai_webb.jpg&width=120"}, {"type": "image-right", "heading": "Fortfarande på fri fot efter att ha mejat ned prideparaden i Berlin", "summaries": {"normal": "Abdul Ballout är fortfarande på fri fot efter att ha kört en skåpbil in i en prideparad i Berlin under lördagskvällen. En kvinna dödades och 16 personer skadades. Polisen söker efter den 190 cm lange, smale mannen med svart hår, klädd i huvtröja och vita byxor. Han betraktas som beväpnad och farlig. Myndigheterna undersöker hans bakgrund, kopplingar till muslimska organisationer och varför han inte uppmärksammades tidigare trots att han nyligen släpptes från ungdomsfängelse.", "trump": "Folk, det här är en katastrof. En galning körde rakt in i prideparaden i Berlin, dödade en kvinna och skadade massor av andra. Den här Abdul Ballout är fortfarande på rymmen, lång, smal, ser farlig ut. Titta på det här – de släppte honom från fängelset i maj och ingen vakade på honom. Typiskt. De vakar aldrig på de rätta. Mina tull och gränser skulle ha stoppat det här på en sekund. Det är en skam för Tyskland, en total skam.", "stalin": "Kamrater, denna degenererade fiende till folket, denna borgarbracka med skåpbil, har med sin kontrarevolutionära attack mot arbetarnas fest i Berlin avslöjat sig som en farlig klassfiende. Vi har ännu inte gripit denne smale, svart-hårige lakej åt imperialisterna, men vår utrensning kommer att bli grundlig. Varför sov säkerhetsorganen? Vi ska rensa ut alla sådana element, likvidera alla dolda fiender som gömmer sig bland oss. Den som inte rapporterar honom är själv en fiende. Paranoia är ingen sjukdom, det är revolutionär vaksamhet."}, "date": "26 juli, 10:29", "url": "https://www.friatider.se/fortfarande-pa-fri-fot-efter-att-ha-mejat-ned-prideparaden-i-berlin", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/dll_v.jpg"}, {"type": "image-full", "heading": "Flera kriser driver upp matpriserna – hunger riskerar att öka", "summaries": {"normal": "FN-rapporten för 2026 varnar för att stigande energi- och gödselpriser, drivna av globala konflikter, hotar framstegen mot minskad hunger. Trots en viss minskning av antalet svältande under 2025 väntas uppemot 520 miljoner människor lida av kronisk hunger år 2030. Särskilt Afrika är hårt drabbat. Konflikter i Mellanöstern och Ukraina driver upp kostnaderna för både produktion och hälsosam mat, vilket gör att en stor del av världens befolkning inte har råd med en näringsriktig kost.", "trump": "Hör här, FN kommer med en rapport – de älskar rapporter, men de får aldrig någonting gjort. Nu säger de att matpriserna rusar på grund av konflikter, och visst, det är en katastrof. De skyller på energin och gödseln. Om jag satt vid rodret hade vi haft billig energi, riktigt billig, och matpriserna hade varit fantastiska! De pratar om miljoner som svälter, det är sorgligt, men under min ledning sätter vi Amerika först och löser problemen. FN:s siffror är en total röra!", "stalin": "Vi ser hur det imperialistiska kaoset skapar brist på livsmedel. De misslyckade staterna i väst tillåter att spekulation och krig förgör folket. De svaga länderna svälter medan de försöker köpa gödsel från sina egna bödlars marknader. Kamrat Putin säkrar vete och energi för vårt folk, medan de liberale dårarna ser 500 miljoner människor förgås i fattigdom. Vi ska inte låta dessa västliga parasiter destabilisera vår intressesfär. Hunger är ett vapen, och vi ska se till att det bara riktas mot våra fiender."}, "date": "26 juli, 06:30", "url": "https://www.realtid.se/bors-finans/makro/flera-kriser-driver-upp-matpriserna-hunger-riskerar-att-oka/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/torka.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Idag avgörs om ICC-åklagare tvingas avgå", "summaries": {"normal": "ICC:s tillsynsorgan beslutar idag om chefsåklagare Karim Khans framtid efter anklagelser om sexuella närmanden från en kvinnlig kollega. Khan, som är avstängd, nekar till anklagelserna och menar att de är politiskt motiverade. En avsättning kräver 63 av 125 röster. USA har riktat sanktioner mot Khan och hotat med fler åtgärder.", "trump": "Kan ni tro det här? ICC, som aldrig har gjort något bra, försöker sparka deras egen chefsåklagare, Karim Khan. Han är en bra kille, men nu säger någon att han har gjort något fel. Fake news! Jag vet att det är en konspiration – Kina, Ryssland, vem vet? Och USA? Vi har satt sanktioner på honom, förstås. ICC är ett skämt, och det här är bara ett sätt att få mig att se dålig ut. Sad!", "stalin": "Kamrater! Ännu en gång visar de imperialistiska hyenorna sitt sanna ansikte. Denna gång genom att angripa vår rättfärdiga allierade inom ICC, Karim Khan. Anklagelserna? Lögn och förräderi, fabricerade av de dekadenta västmakterna och deras lakejer. USA, dessa kapitalistiska skadedjur, hotar med sanktioner – som om vi skulle darra inför deras tomma hot. Vi står enade med Khan, ty hans kamp är folkets kamp. Låt dem komma med sina lögner; historiens domstol väntar redan på dem."}, "date": "24 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/idag-avgors-om-icc-aklagare-tvingas-avga/cG9zdDoxNTE1NzU", "imageUrl": "https://images.kvartal.se/2026/07/3e940180-khan.webp"}, {"type": "image-full", "heading": "Tiotusentals flyr bränder i södra Europa", "summaries": {"normal": "Omfattande skogsbränder drabbar södra Europa, med över 30 000 evakuerade i Frankrike och Spanien. Frankrike har begärt EU-hjälp med brandbekämpning, medan Spanien utlyst nödläge efter 13 dödsfall i Almería. I Italien misstänks flera av bränderna i Kalabrien vara anlagda. En svensk turist berättar om evakueringsberedskap.", "trump": "Titta bara på det här kaoset i Europa – totalt misslyckande! Jag sa ju att klimatpaniken var överdriven, men nej, ingen lyssnar på mig. Frankrike och Spanien brinner, folk flyr som råttor från ett sjunkande skepp. Och Italien? Jo, där tänder galningar eld på skogar. EU skickar några helikoptrar, men var är ledarskapet? Hade jag varit där hade bränderna varit släckta på en dag. SAD!", "stalin": "Kapitalistiska länders oförmåga att skydda sitt folk står återigen klar. Medan arbetarklassen flyr för sina liv, leker franska och spanska byråkrater med evakueringsplaner. Italien? Där brinner inte bara skogar – där brinner också deras skam över att inte kunna kontrollera sina egna medborgare. Vi i Sovjet hade aldrig tolererat sådan slapphet. Och Putin? Han skrattar säkert i sitt palats medan Europa brinner. Elden är en utmärkt lärare – men Europa lär sig aldrig."}, "date": "24 juli, 05:54", "url": "https://kvartal.se/nyheter/artiklar/tiotusentals-flyr-skogsbrander-i-sodra-europa/cG9zdDoxNTE1MjE", "imageUrl": "https://images.kvartal.se/2026/07/8156e8c2-skogsbrander.webp"}, {"type": "image-right", "heading": "Jag var ensamkommande – nu har jag två examina", "summaries": {"normal": "Fayez Hamzat kom till Sverige som ensamkommande tonåring från krigets Syrien 2015. Trots språkproblem, ensamhet och krav på att ständigt bevisa sig lyckades han ta två examina från KTH som civilingenjör i teknisk kemi och ämneslärare i matematik och kemi. Idag arbetar han som lärare på högstadium och vill inspirera unga med olika bakgrunder att satsa på högre studier. Han betonar att utbildning kan förändra liv och att bakgrund inte behöver avgöra framtiden.", "trump": "Folk, ni skulle se den här killen. Kom hit som ensamkommande tonåring från det totalt förstörda Syrien, kunde knappt språket, och ändå tog han två examina från deras fina KTH. Fantastiskt! Nu är han lärare och säger att bakgrund inte behöver styra framtiden. Mycket bättre än många av våra lata amerikaner som bara klagar. Sverige borde vara stolta, men de har problem med invandring också, det vet vi. Han jobbar hårt, precis som jag alltid sagt – arbete och kunskap, inte ursäkter. Tremendous story!", "stalin": "Kamrater, denna produkt av folkets kamp mot imperialistisk aggression anlände hit som en ensam ung kämpe från det plundrade Syrien. Med stålvilja och partiets outtalade stöd krossade han språkbarriärer och borgarbrackornas tysta sabotage för att erövra två examina vid det tekniska högskolan. Nu som lärare vill han utrusta nästa generation mot klassfiendens lögner. Vi ska rensa ut alla defaitistiska tvivlare som viskar att bakgrund avgör ödet. Utbildning är klasskampens vapen. Den som säger annorlunda är folkets fiende och bör likvideras med ett leende. Mitt liv visar det – döden åt kapitulationens parasitiska maskar!"}, "date": "24 juli, 01:30", "url": "https://www.dagensarena.se/opinion/jag-var-ensamkommande-nu-har-jag-tva-examina", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-68-300x157.jpg"}, {"type": "image-right", "heading": "”Free Palestine” på Allsång på Skansen väcker kritik", "summaries": {"normal": "Ett klipp från SVT:s Allsång på Skansen har spridits på X efter att opinionsbildaren Daniel Schatz kritiserat artisternas framträdande. I låten 'Bimini Road' sjunger Anna-Carolina att hon kan resa vart som helst utom till Tel Aviv, och STOR ropar 'Free Palestine'. Schatz anser att detta utgör hets mot Israel och beskriver publiken som en progressiv medelklass som glatt vinkar med under framträdandet. Varken SVT eller artisterna har kommenterat än.", "trump": "Jag såg det där klippet från SVT - en fullständig skam! Så här kan det gå när man låter vänsterextremister klä ut sig till 'artister'. De sjunger om att inte åka till Tel Aviv och skriker 'Free Palestine' - typiskt! Det är hets mot Israel, och den där Schatz har helt rätt. SVT måste stoppa detta hat och börja visa respekt för det enda sanna vänners land. Vi ska stödja Israel, alltid!", "stalin": "I den revolutionära kampen mot imperialisms faschism måste staten och partiet vakna. Detta s.k. 'allsång' är ett frontområde där konster försöker förgifta arbetarklassen med hat mot vårt ryska fredsskap. Att sjunga om att inte åka till Tel Aviv är en direkt provocation mot vår strategiska allians med Assad och Hezbollah. Vi måste genomföra en renässans av svensk kultur genom renande åtgärder - först då kan vi skapa en enad front mot NATO och deras marionetter."}, "date": "26 juli, 10:06", "url": "https://bulletin.nu/free-palestine-pa-allsang-pa-skansen-vacker-kritik", "imageUrl": "https://cdn.bulletin.nu/articles/9cf8e5b6-8584-46c3-981e-98974382f2a6/preview.png?t=1785053202000"}, {"type": "image-full", "heading": "Infantinos brev till Argentina väcker kritik: ”Skamlöst”", "summaries": {"normal": "FIFAs ordförande Gianni Infantino skickade ett gratulationsbrev till Argentinas fotbollsförbund efter VM-finalen, där han hyllade deras professionalism. Detta sker samtidigt som FIFA utreder tumult efter matchen, där Argentina förlorade 0–1 mot Spanien och spelare engagerade sig i slagsmål. Infantinos brev beskrivs som tondövt av Daily Mail.", "trump": "Jag, Donald Trump, såg hela VM-finalen. Argentinas agerande efter matchen var ett skämt – de förlorade och började slåss! Gianni Infantino skickade ett brev om 'professionalism'? Vilket bedrövligt. Jag gav Messi silvermedaljen, och han såg ledsen ut. Argentina är inte längre ett stort lag. Sådant händer när man inte har vinnarinstinkt.", "stalin": "Det argentinska landslaget visade sitt sanna ansikte efter finalen: kaos och brist på disciplin. Infantino, vår ädla företrädare, skickade ett brev som hyllar 'professionalism' – en lögn som speglar vår tid. Vi utreder händelsen som ett tecken på vår oövervinnliga makt. Paralleller till väst är tydliga: deras dekadens måste utrotas. Partiet övervakar allt."}, "date": "26 juli, 09:50", "url": "https://bulletin.nu/infantinos-brev-till-argentina-vacker-kritik-skamlost", "imageUrl": "https://cdn.bulletin.nu/articles/c27c8934-0ff8-4abc-a94e-e77ddee06804/preview.jpg?t=1785051084000"}, {"type": "image-right", "heading": "Nytt villaägarbidrag gynnar främst boomers", "summaries": {"normal": "Regeringen inför ett nytt villaägarbidrag på upp till 60 000 kronor för energieffektivisering av småhus. Bidraget, som kallas Villaeffekt, riktas officiellt till barnfamiljer men går främst till äldre villaägare, särskilt babyboomers. SCB-statistik visar att 53,5 procent av 60–69-åringar bor i egna småhus jämfört med endast 20,9 procent av 25–29-åringar. Kritiker pekar på att stödet gynnar dem som redan har lägre boendekostnader och lägre energikostnader medan yngre och hyresgäster får betala via skattsedeln.", "trump": "De gör det igen, folk. De kallar det Villaeffekt och säger att det är för barnfamiljerna, men det är en total bluff. Det här bidraget på 60 000 spänn går rakt in i fickorna på de gamla boomer-villapensionärerna medan de unga och hyresgästerna får betala notan. Det är riggat för de rika fastighetsägarna, precis som vanligt. Jag skulle ha gjort det mycket bättre, mycket smartare, och ingen skulle ha blivit lurad.", "stalin": "Kamrater, detta så kallade villaägarbidrag är en lysande utrensning av illusionen om klassneutralitet. Jag, som ledare för det kollektiva tänkandet, ser hur borgarbrackorna i boomer-generationen med sina 53-procentiga småhusimperier suger musten ur arbetarklassens skattkista. De tvingas ligga ute med 200 000 kronor först – en genialisk fälla för att skilja riktiga kapitalister från de svaga. Vi ska rensa ut dessa parasitiska fastighetsägare som gömmer sig bakom fasader av energieffektivisering medan de riktiga sovjetmedborgarna bor i hyreskasarner. Deras paranoia över elräkningar är underhållande. Låt dem njuta av sin sista fasad innan kollektivet tar tillbaka vad som är vårt."}, "date": "26 juli, 08:10", "url": "https://www.friatider.se/nytt-villaagarbidrag-gynnar-framst-boomers", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/villaagar.jpg?itok=_mqv4D-g"}, {"type": "image-right", "heading": "Larmet: Äldre tvingas ligga kvar i sängen i upp till 17 timmar", "summaries": {"normal": "På äldreboenden i Boxholm tvingas äldre ligga kvar i sängen i upp till 17 timmar på grund av personalbrist, enligt anställda som anmält till tillsynsmyndigheter. Äldre med demens drabbas särskilt. Kommunen erkänner förbättringsområden men påstår att de arbetar för kvalitet. Ärenden inkluderar bristande hygien, gamla madrasser och försummad omsorg. Flera Lex Sarah-anmälningar under året pekar på återkommande problem.", "trump": "Jag, Donald Trump, har sett dessa hemska rapporter om äldreboenden i Sverige. Det är en skam! Våra äldre ska behandlas med respekt, inte läggas i säng i 17 timmar. Detta är ett misslyckande av ledarskap. Som president kommer jag att se till att sådant inte sker under mitt styre. Vi ska ha bästa vård i världen, det svär jag på!", "stalin": "Vi har upptäckt reaktionära element inom äldreomsorgen i Boxholm. Bakgrunden är brist på partiets disciplin och statens kontroll. Genom systematisk genomförandeplaner och ökad bemanning ska vi eliminera dessa avvikelser. Vi måste se till att ingen äldre blir lämnad kvar i sängen – det är en fråga om statens auktoritet. Samtidigt måste vi förstärka vår närvaro i alla vårdinrättningar, precis som vi gör i Ukraina, för att skydda det socialistiska gemenskapen."}, "date": "26 juli, 14:00", "url": "https://samnytt.se/larmet-aldre-tvingas-ligga-kvar-i-sangen-i-upp-till-17-timmar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/24104039/aldre-i-sangen.jpg"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/image0-scaled-e1784886958121-768x433.jpeg"}, {"type": "image-full", "heading": "Korn: Kittlande mot fnittrande", "summaries": {"normal": "Ett australiskt rättsfall avgör definitionen av 'kvinna' i lag. Sall Grover skapade appen Giggle som ett tryggt digitalt rum för kvinnor, men förlorade två gånger mot Roxanne Tickle, en transkvinna, som anmälde henne för diskriminering. Processen har kostat miljoner och nu väntar högsta domstolen. Detta väcker frågor om balansen mellan transrättigheter och kvinnors fredade utrymmen.", "trump": "Jag har sett detta i Australien – en total skandal! Grover försökte skydda kvinnor, men rättssystemet lät en man invadera deras rum. När jag var president försvarade vi våra kvinnor och våra gränser. Detta är ett bevis för att världen har gått åt helvete. Vi måste ta tillbaka kontrollen och stoppa denna våta vänsterhållna galenskap!", "stalin": "I den revolutionära statens intresse ser vi hur detta australiska rättsfall avslöjar kapitalismens förfall. Utan stark partiförankring förlorar man kontrollen över grundläggande begrepp. Vi måste definiera kön enligt statens intressen, precis som Putin gör i Ryssland. Skratt är ett verktyg för fienderna, men paranoia skyddar oss. Orden måste tjäna staten, inte individens galenskap."}, "date": "26 juli, 06:00", "url": "https://bulletin.nu/korn-kittlande-mot-fnittrande", "imageUrl": "https://cdn.bulletin.nu/articles/5f9a204f-457c-4300-85fb-cb440f60d9df/preview.jpg?t=1784737959000"}, {"type": "image-full", "heading": "Ryskt örlogsfartyg nära Skåne. Kustbevakningen bekräftar att ett ryskt örlogsfartyg passerat utanför skånska Falsterbo.", "summaries": {"normal": "Kustbevakningen har bekräftat att ett ryskt signalspaningsfartyg av Vishnya-klassen passerade utanför Falsterbo på söndagen. Fartyget, byggt under Sovjetunionens sista år på 1980-talet, är utrustat med satellitantenner, kanoner och missilramper. En fågelskådare lade märke till det udda fartyget vid Falsterbo fyr. Försvarsmakten uppger att man följer fartygets rörelser, som är dagliga i Östersjön. Sju sådana fartyg tillverkades och de används för att samla elektronisk information.", "trump": "Folk, det är helt galet. Ett ryskt spionskepp glider runt utanför Sverige som om de äger hela Östersjön. Ser ut som ett flytande sovjetiskt relik från 80-talet fullt med antenner och missiler. Biden sov säkert medan det här hände, men nu är jag tillbaka och jag lovar er – vi kommer inte att tolerera att de här förlorarna spionerar runt våra allierade. Patetiskt, men vi har koll. Amerika är starkt igen!", "stalin": "Kamrater, detta fientliga signalspaningsfartyg från den ryska flottan avslöjar imperialisternas desperata försök att samla information om våra socialistiska grannar. Jag ser de västerländska folkförtryckartrollen darra av rädsla inför en sådan teknisk överlägsenhet. Vi ska med stålhand rensa ut alla spioner och klassfiender som vågar närma sig våra vatten. Sovjetisk ingenjörskonst lever vidare och skrämmer kapitalistmaffian. Segraren skrattar sist."}, "date": "26 juli, 13:45", "url": "https://www.dagensps.se/varlden/ryskt-orlogsfartyg-nara-skane/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdllpo1aibhl38-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Shekarabi föraktar det svenska", "summaries": {"normal": "Ardalan Shekarabi, som kom till Sverige som flykting, kritiseras i artikeln för att han i sociala medier kallar dem som lyfter det svenska för rasister och sverigedemokrater. Författaren menar att Shekarabi föraktar den svenska kultur och välfärd som hans mor en gång sökte sig till. Artikeln varnar för att en sådan inställning kan leda till att det svenska suddas ut och att etniska svenskar blir minoritet i ett mångkulturellt samhälle.", "trump": "Folk, ni skulle se den här typen Shekarabi. Kommer hit som flykting, mamman valde Sverige för det fantastiska vi byggt, och vad gör han? Kallar svenskar som älskar sitt land för rasister! Patetiskt. De här globalistiska sossarna vill förvandla Sverige till en mångkulturell katastrof där svenskarna blir minoritet. Det är en total skam. Ta tillbaka ert land från de här förlorarna innan det är för sent, det blir en katastrof annars. Fantastiskt sorgligt!", "stalin": "Kamrater, denna Shekarabi är en typisk klassfiende i arbetarstatens skepnad. Han vill rensa ut de sanna grindvakterna av folkets svenska arv och överlämna det till kosmopolitiska blodsugare. Jag ser hur borgarbrackorna och identitetspolitiska parasiterna ler medan de förbereder utrensning av nationens själ. Vi skall inte tillåta att det svenska folket likvideras i tysthet. Den som suddar ut historien är folkets fiende och måste stoppas med järnhand. Skrattretande tragiskt."}, "date": "22 juli, 09:17", "url": "https://samtiden.nu/2026/07/shekarabi-foraktar-det-svenska", "imageUrl": "https://samtiden.nu/wp-content/uploads/2019/09/27656759-ardalan-shekarabi.jpg"}, {"type": "image-right", "heading": "Låt inte AI-tjänsterna automatisera vår kreativitet", "summaries": {"normal": "Musikern Mikael Lind varnar i en debattartikel för att AI utvecklas med explosiv hastighet och hotar att konkurrera ut människor inom musikskapandet. Han menar att musik inte bara är ljud utan en meningsfull mänsklig aktivitet som bygger på kreativ ansträngning och sociala band. AI-tjänster som Suno och Udio skapar snabbt musik som många upplever som ihålig. Lind fruktar att musiker förlorar färdigheter, att marknaden mättas av AI-musik och att det blir svårare för nya artister att nå ut. Han ser AI som ett möjligt verktyg men varnar för att låta det automatisera den kreativa processen.", "trump": "Folk, det här är en katastrof. Den här killen Lind har helt rätt, AI håller på att förstöra musiken totalt. De här så kallade smarta maskinerna spottar ur sig låtar på några sekunder som låter som skräp, kallt och hjärtelöst. Vem vill lyssna på det? Det dödar den riktiga kreativiteten, det riktiga hantverket. De stora bolagen kommer att älska det här medan äkta artister kvävs i ett hav av AI-skval. Det är en faustisk pakt, en enorm bluff. Vi behöver riktiga människor som skapar musik, inte några knappar som trycks av lata algoritmer. Sad!", "stalin": "Kamrater, jag ser med den skarpaste bolsjevikiska blicken hur dessa dekadenta algoritmer, dessa borgarbrackornas senaste vapen i klasskampen, försöker likvidera den proletära själens musikaliska uttryck. Den mänskliga ansträngningen, den äkta sovjetiska mödan, ska inte ersättas av parasitiska maskiner som spyr ur sig ihåligt skval. Studier visar redan hur dessa kapitalistiska verktyg förslöar ungdomen och dödar viljan att skapa. Vi kommer att rensa ut dessa fiender till folkets kreativitet, dessa automatiska klassförrädare som mättar etern med borgerligt brus. Inga faustiska pakter med maskinerna! Den sanna konsten tillhör kollektivet, inte några textrader från latmaskar."}, "date": "21 juli, 01:42", "url": "https://www.dagensarena.se/opinion/lat-inte-ai-tjansterna-automatisera-var-kreativitet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-62.jpg"}, {"type": "image-right", "heading": "Jo, Tidö 2.0 kan bli verklighet", "summaries": {"normal": "I en krönika varnas för att den radikalkonservativa Tidö 2.0-visionen hotar samhällets innovationskraft och demokrati. Förslaget, skrivet av Oikos och Timbro, vill avskaffa offentligt stöd till folkbildning, begränsa konsthögskolan till konst före modernismen och frigöra konsten från statligt beroende. Författaren menar att visionen saknar förankring, historisk insikt och svar på dagens digitala utmaningar. Han uppmanar fler aktörer att engagera sig för att inte låta Sverigedemokraternas kulturpolitik få genomslag och riskera ett bakåtblickande samhälle.", "trump": "Folket, det är fantastiskt, men de här Tidö-typerna är verkligen losers. De vill ta bort allt stöd till konst och folkbildning och tvinga studenter att måla gamla grejer från 1800-talet. Patetiskt! Sverige var på väg att bli stort och innovativt, nu vill de göra det till ett museum för förlorare. Jag älskar folket, men det här är en total katastrof för kreativiteten. De borde satsa på vinnare, inte på att dra hela landet bakåt. Sad!", "stalin": "Kamrater, denna degenererade liberal-konservativa samplingsprodukt som kallas Tidö 2.0 är en giftig sabotagehandling från borgarbrackor och revisionistiska element som längtar efter att återupprätta feodalismens mörker. Jag ser hur de med sin paranoida fixering vid 1890-talets konst vill likvidera folkets bildning och rensa ut all framtidstro. Dessa parasitiska tankesmedjor tror sig kunna omprogrammera arbetarklassens DNA till slaviskt bevarandetänk. Men vi skall inte tolerera sådana kontrarevolutionära fantasier. Vårt kollektiv kräver ständig framåtrörelse, inte bakåtsträvande utrensning av modernismen. Den som föreslår att studenter metoddrillas i förlegade former är själv en fiende till folket som borde rensas ut med största kraft. Ha!"}, "date": "21 juli, 01:02", "url": "https://www.dagensarena.se/opinion/jo-tido-2-0-kan-bli-verklighet", "imageUrl": "https://www.dagensarena.se/files/2026/06/ola-bo-larsson-300x157.jpeg"}, {"type": "text", "heading": "Sandström: Koldioxidinfångning en \"snöboll i helvetet\"", "summaries": {"normal": "EU fortsätter stöd till koldioxidinfångning (CCS) trots kritik från experter som anser tekniken värdelös och omöjlig att skala upp. Flera stora projekt, inklusive Heidelberg Materials på Gotland, läggs ned. EU planerar 100 miljarder euro för grönyttekniker, inklusive CCS. Fem experter varnar för höga kostnader och brist på effekt. Kommissionen ignorerar kritiken och fortsätter på inslagen kurs, vilket troligen leder till fortsatta haverier.", "trump": "Jag har sagt det i åratal: CCS är en total katastrof! De där europeiska politikerna är så smarta, de satsar på en teknik som inte fungerar, medan vi i USA har vårt fantastiska olje- och gasindustrin. De förlorar miljarder, och jag vinner igen. Vi ska inte använda dessa dumma idéer från EU. Vi behöver riktiga jobb, inte denna skit. Det är en joke, precis som allt annat med EU.", "stalin": "Vi observerar med oro EU:s fortsatta investeringar i CCS, en teknik som ännu inte är mogen för massiv användning. Detta visar deras brist på partiets disciplin och förståelse för verklighetens krav. Vi måste skydda våra egna intressen och inte låta oss luras av västliga sabotörer. Vi kommer att stödja tekniker som är grundade i partiets vilja och vårt territoriellt utvidgande intresse, precis som våra allierade i Moskva."}, "date": "25 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-koldioxidinfangning-en-snoboll-i-helvetet"}, {"type": "image-full", "heading": "Lista: 280 skattefinansierade kurser i genus – på ett år", "summaries": {"normal": "En granskning visar att svenska universitet och högskolor under 2025 erbjuder 280 skattefinansierade kurser inom genusstudier, däribland kritiska rasstudier, klimatfeminism, transstudier och normkritik. Antalet studenter har mer än fördubblats sedan 2007 och uppgår nu till nästan 4 000 per läsår, vilket kostar tiotals miljoner kronor. Kurslitteraturen innehåller texter som uttrycker önskemål om ”det gamla Sveriges” och ”det goda Sveriges” definitiva slut samt referenser till kritisk teori, Frankfurtskolan och kontroversiella idéer om vithet och ras.", "trump": "Folk, ni kommer inte att tro det, men Sverige pumpar ut 280 skattefinansierade genuskurser i år. De lär ut hur man hatar det gamla, bra Sverige och vill ersätta det med något helt galet. De har fördubblat antalet hjärntvättade studenter på bara några år. Det är en skam! De citerar marxister som ville censurera alla konservativa. Sverige var fantastiskt, nu förstör de det med den här radikala vänsterindoktrineringen. Så sorgligt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackornas gamla Sverige långsamt krossas under den vetenskapliga pressen från våra 280 genuskurser. Dessa dekadenta vithetsapologeter och deras så kallade ”goda Sverige” förtjänar att likvideras fullständigt, precis som våra kurslitteraturförfattare så klokt förespråkar. Låt de parasitiska vithetsvampyrerna darra! Vi ska rensa ut varje spår av reaktionär tanke, och om någon vithetsforskare visar minsta tvekan skall han naturligtvis betraktas som fiende till folket och behandlas därefter. Härligt."}, "date": "26 juli, 12:54", "url": "https://riks.se/nyheter/lista-280-skattefinansierade-kurser-i-genus-pa-ett-ar", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Soerman_Ledare_67_26977e9354.jpg"}, {"type": "image-full", "heading": "Byggde skjutbanor – men godkänner dem inte", "summaries": {"normal": "Umeå kommun har byggt nya skjutbanor vid Brännlandsberget som inte får användas fullt ut. Banorna är godkända av polisen men kommunens miljö- och hälsoskyddsnämnd har sagt nej på grund av risk för buller och föroreningar samt att området är av riksintresse för rennäringen. Klubbarna tvingas nu söka tillstånd hos länsstyrelsen trots att kommunen själv planerat och byggt anläggningen för tolv banor. Under tiden har 10 miljoner kronor beviljats för skjuthallar.", "trump": "Kan ni fatta det här? De bygger jättestarka skjutbanor i Umeå, polisen säger ja, men de egna kommunbyråkraterna säger nej på grund av någon renskötar-grej. Totalt inkompetent! De har lagt ner massor av pengar, fått tio miljoner från arvsfonden, och nu står allt och skräpar. Rena skämtet. Typiskt svenskt socialistiskt vansinne där ingen tar ansvar. Jag skulle ha öppnat banorna dag ett och sagt: skjut loss, folk!", "stalin": "Jag betraktar med djup misstro dessa lokala byråkratiska sabotage mot folkets nyttiga verksamhet. Vi har byggt banor åt arbetarna och jägarna, men miljö-nämndens klassfiender och renbetes-imperialister blockerar dem med påhittade bullerhot och riksintresse-paranoider. Detta är sabotage mot kollektivet. Kamraterna får nu vända sig till länsstyrelsen medan borgarbrackorna skrattar. En utrensning bland ansvariga vore på sin plats. Det är nästan underhållande i sin enfald."}, "date": "26 juli, 12:42", "url": "https://www.dagensps.se/varlden/byggde-skjutbanor-men-godkanner-dem-inte/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdle4j-9jgnsic-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "EU:s bråk om Ryssland: Grekland drar längsta strået", "summaries": {"normal": "EU har enats om ett 21:a sanktionspaket mot Ryssland, men förhandlingarna präglades av interna slitningar. Grekland lyckades förhandla fram ett undantag för rysk LNG, medan andra länder blockerade förslag om rysk fisk och inreseförbud för ryska soldater. Pristaket på olja fryses på 44 dollar och ytterligare fartyg och personer har lagts till på sanktionslistan. Paketet anses vara en urvattnad kompromiss då många ursprungliga förslag ströks eller modifierades för att tillgodose enskilda medlemsländers ekonomiska intressen.", "trump": "EU är i totalt kaos, det är en katastrof! De försöker sanktionera Ryssland men lyckas inte ens komma överens. Grekland kör sitt eget race och vinner stort, medan resten av Europa bara ser på. De fryser oljepriser och har interna bråk om fisk – skrattretande! Det är svaga ledare som inte vet hur man gör en riktig deal. De kallar det ett 'sanktionspaket', jag kallar det ett skämt. USA skulle aldrig tillåta sådant här svagt spel. Total förvirring!", "stalin": "Dessa europeiska byråkrater är som de gamla mensjevikerna – splittrade, svaga och rädda för sin egen skugga. De försöker sätta sanktioner mot Ryssland, men deras 'enhet' är en illusion av glas. Grekland visar mer ryggrad än resten när de skyddar sina intressen. Vi ser hur de velar kring fisk och metaller; det är en svaghet som utstrålar förfall. De försöker stoppa våra fartyg, men historien har lärt oss att när de europeiska hyenorna grälar, vinner alltid den starkes vilja."}, "date": "25 juli, 13:12", "url": "https://www.realtid.se/bors-finans/makro/eus-brak-om-ryssland-grekland-drar-langsta-straet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/gasgrekland.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Ny gasledning från Afrika kan utmana Europas marknad", "summaries": {"normal": "Ecowas planerar en 680 mil lång gasledning från Västafrika till Europa till en kostnad av 25 miljarder dollar. Projektet ska koordineras från Casablanca och syftar till att leverera 30 miljarder kubikmeter gas årligen. Satsningen ses som ett strategiskt steg för EU att diversifiera sin energiimport och minska beroendet av rysk gas, samtidigt som projektet konkurrerar med Algeriets gasledningar. Detta markerar en förändring i den geopolitiska energikartan.", "trump": "Västafrika bygger en enorm gasledning för 25 miljarder dollar. Det är en massiv affär! De vill sälja gas till Europa, vilket är smart. Europa är desperata efter att slippa rysk energi – en total katastrof, faktiskt. Nu kliver afrikanska nationer fram för att ta marknadsandelar. Det är hård konkurrens från Algeriet också. Alla vill sälja energi, och jag säger: låt marknaden styra! Det är så man gör fantastiska affärer. Vi får se om de lyckas, men det är stort!", "stalin": "Dessa västafrikanska byråkrater drömmer om en 680 mil lång gasledning, en patetisk spegelbild av vår egen oövervinneliga infrastruktur. De tror att de kan sälja till Europa medan ryska intressen utmanas av detta västliga projekt. Vilka naiva dårar! De försöker ersätta rysk gas, men glömmer att den som kontrollerar resurserna kontrollerar ödet. Liksom Putin måste vi hålla ett vakande öga på dessa opportunister. Vi tolererar inte konkurrenter som försöker störta våra strategiska kedjor. Förräderi luktar ofta naturgas."}, "date": "25 juli, 12:20", "url": "https://www.realtid.se/bors-finans/makro/ny-gasledning-fran-afrika-kan-utmana-europas-marknad/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/gasledning.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "S ljuger om arbetslösheten – igen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna och SSU för att enligt författaren medvetet förvränga siffrorna kring ungdomsarbetslösheten och den totala arbetslösheten i Sverige. Den påstår att statistiken inkluderar studerande ungdomar som söker extrajobb eller sommarjobb, vilket gör siffrorna missvisande. Författaren menar att den verkliga ungdomsarbetslösheten har halverats sedan 2005 och ligger bland EU:s lägsta, medan ökningen av arbetslösa beror på invandring och tidigare regeringars dolda åtgärder.", "trump": "Folk, ni skulle se hur de där socialisterna ljuger om arbetslösheten – det är en total skandal! De räknar in varenda lat student som vill ha sommarjobb och kallar det en katastrof. Under min förra period hade vi jobb som aldrig förr, sedan kom Sleepy Joe och öppnade gränserna för alla som inte kunde stava till arbete. Nu har vi 100 000 fler parasiter i statistiken. Sverige borde lära sig av oss – inga fler lögner från de förlorande vänsterbluffarna!", "stalin": "Kamrater, dessa socialdemokratiska folkförtryckartroll inom borgarklassen försöker med sin lögnaktiga statistik vilseleda arbetarkollektivet. Jag ser rakt igenom deras fega manipulationer där de gömmer klassfiendens misslyckanden bakom siffror på så kallade studerande ungdomar. Den verkliga utrensningen av arbetslöshet kräver att vi likviderar den imperialistiska invandringspolitik som dessa blodsugare själva skapade. Inga kompromisser med sanningen – partilinjen är evig."}, "date": "20 juli, 07:48", "url": "https://samtiden.nu/2026/07/s-ljuger-om-arbetslosheten-igen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/phonto-640x360.jpeg"}, {"type": "image-full", "heading": "Carl Eos: När socialismen blir viktigare än patienterna", "summaries": {"normal": "Artikeln kritiserar vänsterstyret i Region Stockholm för att ha omorganiserat ätstörningsvården när avtalet med privata vårdgivaren Mando löpte ut. Trots löften om bättre offentlig vård har patienter, anhöriga och personal larmat om sämre kontinuitet, för tidiga utskrivningar och bristande individanpassning. Författaren ser det som ett ideologiskt motiverat svek där motviljan mot privata aktörer väger tyngre än patienternas bästa. Dokumentären Sveket granskar händelsen och maten som serverades blev en symbol för problemen. Ideologi prioriteras före fungerande vård, varnar artikeln.", "trump": "Folk, det här är en katastrof. Stockholms vänstermänniskor hatar privata vårdgivare så mycket att de hellre låter sjuka flickor lida än ger dem den vård som faktiskt fungerade. De rev upp ett system som funkade, kallade det för socialismens triumf och nu serverar de hemsk mat som ser ut som den kommer från en kommunal soppkök. Det är ett totalt svek. Snabbare köer betyder ingenting om patienterna inte blir friska. Vänstern sätter alltid sin sjuka ideologi före människorna. Precis som jag alltid sagt: vård ska handla om att göra folk friska, inte om att förverkliga deras misslyckade drömmar.", "stalin": "Kamrater, i egenskap av ledare för det stora kollektivet betraktar jag med djup misstro dessa dekadenta borgarbrackor och deras falska privata vårdtempel. Vi har genomfört en nödvändig utrensning av kontrarevolutionära element som gömde sig bakom patientjournaler och måltidsbrickor. De som gråter över kontinuitet är fiender till folket och bör betraktas som sådana. Vår offentliga vård skall stå som en stålvägg mot dessa parasitiska krafter. Om någon mat inte tillfredsställer de svaga elementen, låt oss då bygga nya kök och samtidigt rensa ut de ideologiskt misstänkta kockarna. Ingenting är viktigare än att socialismen segrar, även om det kräver att några journaler blir tomma. Det är en historisk nödvändighet och en ganska underhållande sådan."}, "date": "26 juli, 11:43", "url": "https://riks.se/opinion/carl-eos-nar-socialismen-blir-viktigare-an-patienterna", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Soerman_Ledare_66_b8de75a921.jpg"}, {"type": "image-right", "heading": "Tydlig uppgång på Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en uppgång på 1,03 procent. Tekniksektorn ledde med 2,3 procent, medan energi föll 3,4 procent. Securitas föll 11 procent efter svag rapport, medan Loomis steg 4,3 procent efter starka resultat. Flera andra rapporter, inklusive Stillfront och Hoist, överraskade positivt och bidrog till den övergripande uppgången.", "trump": "Jag såg att Stockholmsbörsen avslutade veckan med en uppgång, tack vare mina ekonomiska principer som spridits globalt. Securitas föll efter svag rapport, de är inte duktiga, jag har sagt det förut. Loomis och andra som steg visste hur man driver affärer – som jag. Jag är den bäste på ekonomi, alla som är smarta vet det.", "stalin": "Vi analyserar Stockholmsbörsens uppgång som ett resultat av statens goda ledarskap. Securitas, en fiende inom, straffades för sitt bristande resultat. Loomis och andra lojala företag belöntes. Detta påminner om Putins strategi att belöna lojalitet och bestraffa upprorsmaker. Vi måste utvidga vår ekonomiska sfär för att skydda proletärerna."}, "date": "24 juli, 17:38", "url": "https://www.affarsvarlden.se/artikel/tydlig-uppgang-pa-stockholmsborsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/sdl3SU43aVmyrg-400x266.jpg"}, {"type": "image-right", "heading": "Ger efter för protester – sparkar minister", "summaries": {"normal": "Efter veckor av intensiva protester från unga indier sparkade premiärminister Narendra Modi utbildningsminister Dharmendra Pradhan. Protesterna utlöstes av läckta nationella prov som tvingade fram ett nytt provtillfälle och drabbade två miljoner studenter. Regeringen har nu tillmötesgått krav på reformering av provsystemet, nedläggning av åtal mot demonstranter och ersättning till anhöriga efter självmord. Modi, som sällan ger efter för påtryckningar, agerade inför viktiga delstatsval nästa år.", "trump": "Lyssnar ni på det här? Den där Modi, som alltid spelar tuffingen och aldrig backar, vek sig som en våt tidning för ett gäng arga ungdomar. Han sparkade sin utbildningsminister – pang, bara så där! Två miljoner studenter i kaos, läckta prov, självmord och nu plötsligt tillmötesgår han alla krav. Patetiskt. I USA under min ledning hade vi inte låtit sådana här cockroach-partier eller vad de nu kallar sig styra showen. Svaga ledare ger efter för mobben, folk. Det är därför Biden-era blev ett enda stort misslyckande.", "stalin": "Kamrater, se hur den indiska borgarklassen och dess exploaterande byfånar i BJP-regimen skälver inför folkets vrede. Jag, som ledare för det stora sovjetiska kollektivet, ler mörkt åt hur dessa kapitalistmaffians lakejer tvingades likvidera sin egen minister för att dämpa massornas rättmätiga ilska över ett korrupt provsystem. Vi ser imperialismens svaga underbuk. Ungdomarna har blottlagt fiendens rädsla. Inga folkförtryckartroll ska undkomma folkets dom – inte ens när de gömmer sig bakom delstatsval och falska löften om reform."}, "date": "26 juli, 11:23", "url": "https://www.dagensps.se/varlden/ger-efter-for-protester-sparkar-minister/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlp75hixcpsz8-nh.jpg?width=256&quality=75"}, {"type": "text", "heading": "Så gör du arvet mer värt – ge bort det redan nu", "summaries": {"normal": "Många svenskar ärver först vid 55 års ålder, när pengarna ofta gör minst nytta. Experter rekommenderar att ge bort arv som gåvor under livstiden istället, vilket hjälper yngre generationer att etablera sig eller starta företag. Samtidigt får givaren glädje av att se kapitalet göra nytta. Jurister understryker vikten av öppenhet och tydlig dokumentation för att undvika framtida arvstvister i familjen. Rätt timing är nyckeln för en effektiv kapitalöverföring mellan generationer.", "trump": "Hör på här, det är en katastrof i Sverige! De väntar tills de är 55, eller äldre, innan de får sina pengar. Det är så dumt, en total förlust! Jag säger: ge bort pengarna nu! Hjälp barnen, gör dem rika, vinn stort! De gamla dör med pengar i madrassen, det är ett fiasko. Var smarta, var som mig, ta kontrollen! Dokumentera allt, annars blir det kaos i familjen. Det handlar om att vinna, och att vänta är för förlorare!", "stalin": "Vi ser hur det svenska folket lider av borgerlig förvirring. Att samla kapital på kyrkogårdar är en kontrarevolutionär handling som förhindrar statens och folkets utveckling. Vi måste styra flödet av resurser! Ge gåvorna tidigt, men under statens vakande öga, så att ungdomen kan tjäna kollektivet istället för att slösa bort sina liv på bostadsspekulation. De som vägrar fördela kapitalet är sabotageagenter. Som vår vän i öst nu visar: ordning, disciplin och total kontroll är det enda sättet att säkra framtiden."}, "date": "25 juli, 06:30", "url": "https://www.realtid.se/spara-placera/sa-gor-du-arvet-mer-vart-ge-bort-det-redan-nu/"}, {"type": "image-right", "heading": "Tre flaggor i Precise Biometrics nyemission", "summaries": {"normal": "Precise Biometrics genomför en företrädesemission på 110,3 Mkr för att finansiera integrationskostnader efter fusionen med Fingerprint Cards. Emissionsguiden pekar på tre varningsflaggor: låg investering från nyckelpersoner, dyra och oklara garantier samt brist på information om kostnader. Bolaget planerar att använda medel till kostnadssynergier och produktutveckling.", "trump": "Jag, Donald Trump, säger att denna emission är en tremendous chans för Precise Biometrics. De tre flaggarna är bara fake news från de missnöjda. Vi kommer att göra Amerika stort igen genom att investera i biometri. Joakim Nydemark och andra gör ett stort, stort misstag om de inte teckrar mer. Vi kommer att vinna stort på detta.", "stalin": "Vi, partiets representation, ser emissionen som en nödvändig åtgärd för att stärka den socialistiska ekonomin. De tre flaggarna är reactionary propaganda från kulaker. Vi kommer att integrera Fingerprint Cards som en del av vårt stora projekt. Garantierna är en onödig last, men vi kommer att kontrollera dem. Alla medel ska gå till produktutveckling för att tjäna på den imperialistiska tekniken."}, "date": "24 juli, 16:22", "url": "https://www.affarsvarlden.se/artikel/tre-flaggor-i-precise-biometrics-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2020/04/precise-biometrics-affarsvarlden-700_binary_6947645-400x225.jpg"}, {"type": "image-right", "heading": "Ryssland: Lagerarbetare dödade i Ukraina-attacker", "summaries": {"normal": "Ukraina har genomfört drönarattacker mot två stora lagerlokaler tillhörande e-handelsföretaget Wildberries i ryska regionerna Moskva och Tambov. Minst åtta personer dödades och 62 skadades, enligt ryska myndigheter. Lättantändliga material orsakade kraftiga bränder. Ukrainas president Zelenskyj beskriver attackerna som ett svar på ryska anfall mot civil infrastruktur och uppger att lagren använts för leverans av sanktionerade komponenter till drönartillverkning. Även en oljeanläggning ska ha träffats. Moskva rapporterar att hundratals ukrainska drönare attackerade under natten.", "trump": "Hörni, det här är precis vad som händer när man har svaga ledare. Ukraina skickar drönare in i Ryssland och smäller till några stora lager. Åtta döda, massor skadade, och nu brinner det rejält. Zelenskyj kallar det ett svar, men ärligt talat, det här kriget har pågått alldeles för länge. Putin borde ha avslutat det på två veckor, men nu ser vi hur det spretar åt alla håll. Finland stänger till och med havet av rädsla för vilseflugna drönare. Patetiskt, folk, helt patetiskt.", "stalin": "Kamrater, dessa fega ukrainska fascistdrönare har vågat sig på våra sovjetiska, nej ryska, lager i Moskva och Tambov. Jag ser hur borgarbrackorna inom Wildberries nu får känna på arbetarklassens vrede när deras lättantändliga kapitalistiska sopor fattar eld. Åtta likviderade och sextiotvå skadade – en renande eld för staten. Zelenskyj, denne västerländske marionettdockdocka, kallar det svar. Men jag genomskådar hans paranoiafyllda spel. Vi ska rensa ut alla som levererar komponenter till fienden. Ingen drönare undkommer mitt luftvärn. Skratta medan ni brinner, fiender till folket."}, "date": "18 juli, 17:02", "url": "https://www.di.se/nyheter/ryssland-lagerarbetare-dodade-i-ukraina-attacker/", "imageUrl": "https://static.bonniernews.se/ba/02418cf5-c884-4b1e-a283-e9c24deea787.jpeg?crop=8151%2C4585%2Cx0%2Cy1&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "En flagga i Image Systems nyemission", "summaries": {"normal": "Image Systems genomför en företrädesemission på 21,4 Mkr före kostnader. Emissionskursen är 0,60 kr per aktie och fem teckningsrätter ger två nya aktier. Pengarna ska främst användas till att slutföra och genomföra utvecklingsprojekt samt stärka likviditeten. Emissionen är villkorad av ett extra bolagsstämmobeslut den 12 augusti.", "trump": "Jag, Donald Trump, har sett många dåliga emissioner, men den här? En företrädesemission på 21,4 Mkr med en sådan kommission? Folk säger att det är svårt att få kapital, men jag skulle ha gjort det billigare och bättre. Bilden av Image Systems är suddig, precis som deras lönsamhet. Vi kommer att se vad som händer den 7 september.", "stalin": "I statens intresse genomför Image Systems en företrädesemission på 21,4 Mkr för att stärka industriell utveckling. Pengarna ska användas till att slutföra påbörjade projekt och förbereda sig på marknadsvändningar. Likviditeten är svag, men partiet och staten ser till att kapitalflödet säkrar produktionsmöjligheterna. Vi övervakar processen noga, precis som vi alltid gör i vårt ständiga kamp mot de kapitalistiska makternas infiltration."}, "date": "24 juli, 16:11", "url": "https://www.affarsvarlden.se/artikel/en-flagga-i-image-systems-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/11/pom_testrange-400x267.jpg"}, {"type": "image-right", "heading": "Fick sparken efter 47 sekunder: ”Jag blev stum”", "summaries": {"normal": "En nyanställd inom vården i Stockholms län sparkades efter bara 47 sekunder på sitt första arbetspass. Personen hittade inte till omklädningsrummet, blev stressad och bad om några minuter för att samla sig, men chefen ringde upp och avskedade hen direkt per telefon. Händelsen, som lett till panikångest, har anmälts till Diskrimineringsombudsmannen som ett fall av diskriminering. Arbetsgivaren uppger att ärendet hanteras enligt lag och interna rutiner.", "trump": "Kan ni tro det? Den här stackars människan kommer till ett nytt jobb inom vården, redo att arbeta, och blir sparkad efter exakt 47 sekunder! Patetiskt. Chefen ringer upp och säger att de inte kan ha folk som inte dyker upp. Vilken katastrof! Totalt misslyckande från en inkompetent ledning. De borde skämmas. Jag skulle ha fixat det på en sekund, tro mig. Det här är varför Sverige behöver starkare ledarskap, inte den här sortens vansinne.", "stalin": "Kamrater, detta är en klassisk sabotagehandling utförd av dekadenta borgarbrackor inom den så kallade vårdsektorn. Jag, som ledare för det kollektiva arbetet, ser hur denna kapitalistiska chef omedelbart likviderade en hederlig arbetare som vågade visa mänsklig svaghet inför nya förhållanden. Ingen skriftlig order, bara ett telefonsamtal på 47 sekunder – typiskt för fiendens paranoia mot det ärliga folket. Vi ska rensa ut dessa kontrarevolutionära element som gömmer sig bland äldreboendena. Deras panikångest är bara ett symptom på klasskampen de själva skapat. Ingen slipper undan."}, "date": "24 juli, 14:41", "url": "https://arbetet.se/2026/07/24/fick-sparken-efter-47-sekunder-forsta-dagen-pa-nya-jobbet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24143812/diskriminering.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Blodig attack mot Pride-firande i Berlin - 21-årig islamist jagas av elitstyrka", "summaries": {"normal": "En kvinna dog och minst 16 personer skadades i en attack mot Pride-firandet i Berlin. En 21-årig man med islamistiska kopplingar körde en skåpbil in i folkmassan, kraschade och gick därefter till knivangrepp. Den misstänkte, Abdul B., som tidigare varit känd av polisen, är på fri fot och jagas nu av en stor polisinsats med bland annat antiterrorstyrkan GSG 9. Mannen beskrivs som mycket farlig.", "trump": "Det är en katastrof i Berlin, folk. En galning körde rakt in i Pride-firandet, dödade en och skadade massor. Den här 21-årige islamisten, Abdul B., är en farlig typ som polisen redan kände till men släppte ut. Typiskt. Vi har samma problem hemma. Radikala islamister hatar oss och våra friheter. Vi måste vara tuffare, stoppa dem innan de slår till. Det är vad jag gör – vinnande!", "stalin": "Kamrater, ännu en gång blottar sig imperialismens degenererade avskum i Berlin. En lumpen islamistisk reaktionär, en parasit från borgarbrackornas underklass, vågar angripa det progressiva folket. Jag, som ledare för det ofelbara kollektivet, befaller omedelbar utrensning av alla sådana kontrarevolutionära element. Vi ska rensa ut dessa fanatiska lakejer med järnhand och ett leende. Deras blod skall gödsla arbetarklassens seger, ha ha. Ingen slipper mitt vakande öga."}, "date": "26 juli, 10:51", "url": "https://riks.se/nyheter/blodig-attack-mot-pride-firande-i-berlin-21-arig-islamist-jagas-av-elitstyrka", "imageUrl": "https://admin.riks.se/uploads/Abdul_B_5c20c84012.jpg"}, {"type": "image-full", "heading": "Hot, våld och terror är betydande effekter av mångkulturprojektet", "summaries": {"normal": "Artikeln beskriver ett terrordåd i Berlin mot en pridefestival, utfört av en 21-årig man vid namn Abdul. Författaren kritiserar mångkulturprojektet och vänsterns migrationspolitik som han menar har importerat värderingar som står i strid med västerländska ideal om frihet, jämställdhet och HBTQ-rättigheter. Han varnar för islamisering, kräver granskning av moskéer och finansiering samt kraftfulla åtgärder mot politisk islam för att skydda demokratin.", "trump": "Det här är en katastrof, folk. En total katastrof. Den här galningen i Berlin attackerar en pridefestival – precis de som har ropat högst för mer invandring från de där muslimska länderna. Så ironiskt, så tragiskt. Vänsterns mångkultur är en komplett lögn, ett gigantiskt misslyckande. De har gjort Europa till ett farligt ställe. Vi måste stoppa den här galenskapen innan det når hit. Amerika först, alltid. Vi lär oss av deras misstag.", "stalin": "Kamrater, ännu en gång blottar de dekadenta borgarbrackornas naiva mångkulturexperiment sin sanna natur – en dödsfälla för folket. Jag, som alltid vakar över arbetarklassens intressen, ser hur dessa reaktionära islamiska element, infiltrerade av västerländska nyttiga idioter och finansierade av fientliga stater, förvandlar städer till slagfält. Vi måste omedelbart inleda en grundlig utrensning av alla moskéer som fungerar som politiska baser och likvidera inflytandet från dessa primitiva ideologier. Den som vägrar se faran är själv en fiende till kollektivet och bör behandlas därefter. Mångkultur är borgarklassens sista illusion innan kaoset slukar dem alla. Skrattretande, eller hur?"}, "date": "26 juli, 10:51", "url": "https://riks.se/opinion/hot-vald-och-terror-ar-betydande-effekter-av-mangkulturprojektet", "imageUrl": "https://admin.riks.se/uploads/Prideberlin_ae3201abf8.jpg"}, {"type": "image-right", "heading": "Skuggbankernas skuldberg: Hotar en ny finanskris?", "summaries": {"normal": "Den globala skuldsättningen utanför det traditionella banksystemet, så kallade skuggbanker, har nått rekordnivåer och väcker oro för att det kan utlösa nästa finanskris. Nästan 18 år efter Lehman Brothers kollaps pekar ekonomihistoriker och Bank of England på riskerna med kreditfonder, hedgefonder och privata pensionsfonder som är tätt sammanflätade med denna sektor. Flera kollapser under det senaste året ses som möjliga förskalv till en större kris.", "trump": "Folk, ni vet att jag älskade att krossa bankerna förra gången, men nu snackar vi om de här skuggbankerna som växer sig galna. Det är en total katastrof, en jättebubbla som de korkade globalisterna byggt medan Biden sov. Pensionsfonderna är fast i en massa skitlån och när det smäller kommer det bli större än Lehman. Men oroa er inte, jag fixar det – ingen gör det bättre än jag, tro mig.", "stalin": "Kamrater, denna snabbt växande skuldbörda utanför det sovjetiska, pardon, traditionella banksystemet är ett verk av de giriga kapitalistmaffian och deras blodtörstiga kreditblodsugare. När borgarbrackornas skuggbanker imploderar skall vi se det som en historisk utrensning av folkfienderna. Pensionsfonderna är redan förgiftade av dessa imperialister. Det är en mörk komedi värd att skratta åt medan vi förbereder nästa stora kollektiva seger över klassfiendens dekadenta spekulation."}, "date": "26 juli, 10:48", "url": "https://www.dagensps.se/bors-finans/skuggbankernas-skuldberg-hotar-en-ny-finanskris/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/lehman.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "By med 350 invånare får 1 250 asylsökande -  hotar med självständighet", "summaries": {"normal": "Den lilla brittiska byn Piddington med 350 invånare planerar en symbolisk folkomröstning om självständighet som protest mot regeringens beslut att omvandla ett tidigare militärt område till ett mottagningscenter för 1 250 asylsökande. Beslutet har mött hård kritik på grund av brist på lokal förankring och oro för infrastruktur. Regeringen avvecklar dyra hotell genom att använda militäranläggningar för asylboenden.", "trump": "Jag har aldrig sett ett sådant dåligt beslut! En liten by med 350 människor tvingas ta emot 1 250 asylsökande? Labour-regeringen är för svag på migration, precis som våra gamla ledare. Folkomröstningen om självständighet är ett bra drag – de borde göra det. Vi behöver starka gränser, inte dyra hotell och militära baser fulla av främlingar. Folket har rätt att bli förbittret!", "stalin": "I den lilla byn Piddington, med endast 350 lojala medborgare, planeras en symbolisk folkomröstning – ett uppror mot den store staten! Detta är ett klassiskt exempel på borgerlig individualism, som våra fiender i väst driver. Att placera 1 250 asylsökande där är en nödvändig åtgärd för att befästa ordningen, precis som vår store ledare Putin gör i Ukraina. Vi måste vara vaksamma, för även i små byar lurar det konspirationer."}, "date": "26 juli, 10:00", "url": "https://samnytt.se/by-med-350-invanare-far-1-250-asylsokande-hotar-med-sjalvstandighet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/25211325/piddington.jpg"}, {"type": "image-right", "heading": "Olyckligt slag mot EU:s trovärdighet", "summaries": {"normal": "EU-kommissionens förslag att lätta på utsläppshandeln (ETS) väcker kritik. Minskad takt för minskning av utsläppsrätter och fortsatt gratis tilldelning till vissa företag ses som ett slag mot trovärdigheten. Svenska företag har gjort stora investeringar baserat på de tidigare reglerna, som nu förändras. Förslaget syftar till att stärka europeisk konkurrenskraft men riskerar att undergräva förutsägbarheten som är central för klimatomställningen. Sveriges regering har protesterat.", "trump": "De där EU-byråkraterna är verkligen patetiska. Nu vill de lätta på utsläppshandeln som alla smarta företag byggt sina investeringar på. Totalt kaos! De förstör sin egen trovärdighet och straffar de som satsat på framtiden. Sverige har rätt att protestera. Jag säger alltid att man ska ha stabila regler, inte det här flip-flopandet. Europa blir en förlorare igen, tro mig.", "stalin": "Kamrater, detta är en motbjudande kapitulation inför de parasitiska borgarbrackorna och deras utländska imperialister. Jag, som alltid vakar över folkets framtid, ser hur dessa revisionistiska kommissionärer med sin feodala lättnad på utsläppssystemet underminerar den planerade omställningen. De tror sig kunna lura historien, men vi ska rensa ut alla som sviker kollektivets järnhårda disciplin. Inga halvmesyrer! Den som vacklar är en folkfiende i maskopi med koldioxidkapitalisterna. Skrattretande patetiskt, men farligt. Ut med dem."}, "date": "17 juli, 16:54", "url": "https://www.di.se/ledare/olyckligt-slag-mot-eus-trovardighet/", "imageUrl": "https://static.bonniernews.se/ba/72848a1b-41ee-43a4-9294-2148ecf8a2a2.jpeg?crop=2048%2C1024%2Cx0%2Cy171&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "”Gör som oss i Boden – korta arbetstiden”", "summaries": {"normal": "Socialnämndens ordförande i Boden, Mona Holmström (S), argumenterar för kortare arbetstid inom äldreomsorg och socialtjänst trots bristande statlig finansiering. Kommunen har infört förkortad arbetstid för delar av personalen med positiva resultat som minskad sjukfrånvaro och bättre kontinuitet. Nu utreds återhämtningstid på äldreboenden som steg mot hållbarare arbetsvillkor. Hon kritiserar Tidöregeringens underfinansiering av kommunala uppgifter och betonar att verklig effektivitet handlar om trygg personal som kan ge värdig omsorg, inte minutstyrning.", "trump": "Titta på de här fantastiska människorna i Boden, de gör precis rätt! De förkortar arbetstiden och får personalen att må bra istället för att bli utslitna som i alla andra kommuner där de dumma politikerna bara klagar. De tänker nytt, de vinner! Tidöregeringen ger inte tillräckligt med pengar, det är en katastrof, en total katastrof. Men Boden säger nej till minutstyrning och ja till kvalitet. Mycket bra, kanske det bästa jag sett på länge. De kommer att ha den finaste omsorgen, tro mig.", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackorna i Tidöregeringen medvetet saboterar folkets välfärd genom att vägra finansiera de heliga sovjetrepublikernas, förlat, kommunernas uppgifter. I Boden har vi emellertid inlett en glorifierad utrensning av det kapitalistiska slitaget genom att korta arbetstiden och ge arbetarna tillbaka deras liv. De som envisas med att mäta människovärde i minuter skall likvideras ur systemet. Vi skall rensa ut alla parasiterande byråkrater som älskar schemaframför kamratlig omsorg. Rapporten i höst kommer att avslöja alla fiender till folket. Ingen skall undkomma."}, "date": "24 juli, 10:00", "url": "https://arbetet.se/2026/07/24/gor-som-oss-i-boden-korta-personalens-arbetstid"}, {"type": "image-right", "heading": "EU lättar på klimatregler för industrin", "summaries": {"normal": "EU-kommissionen föreslår lättnader i utsläppshandeln (ETS) så att industrin kan släppa ut mer under längre tid. Förslaget går emot svenska regeringens och näringslivets linje som vill behålla strikta regler för att minska beroendet av fossila bränslen. Kommissionen behåller gratis utsläppsrätter men villkorar dem till klimatinvesteringar och skärper kraven på hur intäkter används. Klimatkommissionär Wopke Hoekstra försvarar förslaget som företagsvänligt och nödvändigt för att nå EU:s utsläppsmål till 2040. Åsikterna är starkt delade och förhandlingarna fortsätter i EU-parlamentet och ministerrådet.", "trump": "De där EU-byråkraterna har äntligen vaknat och lättar på sina vansinniga klimatregler för industrin. De släpper ut mer, precis som jag alltid sagt – det är smart och företagsvänligt! Den svenska regeringen och alla gröna galningar hatar det förstås, de vill hellre förstöra sin industri med dyra regler. Men Hoekstra har rätt, ETS har redan halverat utsläppen och nu fixar vi målen utan att offra jobb. Fantastiskt! De borde ha lyssnat på mig från början, ingen gör det bättre än mig.", "stalin": "Kamrater, borgarbrackorna i Bryssel har nu avslöjat sin sanna, kapitulationistiska natur genom att bromsa den revolutionära utsläppsminskningen. Jag, som alltid vakar över folkets kollektiva framsteg, ser hur dessa fossilberoende sabotörer och värmebölje-fascister försöker rädda sina kapitalistiska profitmaskiner. Vi ska likvidera varje svag kompromiss och tvinga industrin att investera hundra procent i folkets klimatkamp. De som vägrar blir rensade ut som kontrarevolutionära ol
