 friskolesystem som fötts ur revisionistiska 1990-talsillusioner. De idéburna skolorna, dessa äkta folkets initiativ, krossas systematiskt av de stora vinstsugande monopolkapitalistiska skolkoncernerna medan de förgiftar ungdomen med segregation och betygsfusk. Nu har vi äntligen en öppning i EU:s egna dekret som bekräftar att utbildning inte är någon smutsig ekonomisk spekulation. Det är hög tid att rensa ut alla aktiebolagsparasiter ur folkets skola, likvidera vinstuttagen och återinvestera varje kopek i kollektivets bildning. De som envisas med att suga ut skolans saft ska möta den historiska utrensningens logik. Friskolereform 2.0 blir vår nya femårsplan för socialistisk fostran."}, "date": "8 juni, 01:30", "url": "https://www.dagensarena.se/opinion/friskolor-kan-forbjudas-att-dela-ut-vinst-och-sa-bor-ske/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-300x157.jpg"}, {"type": "image-right", "heading": "15 inom kriminalvården anmäls för mutbrott", "summaries": {"normal": "Femton anställda inom Kriminalvården har anmälts för misstänkt mutbrott efter att ha tagit emot gratis spahelg, middag och hotellövernattning på Steam Hotel i Västerås. Gåvorna kom från en extern konsultläkare som ville tacka för gott samarbete. När myndigheten fick kännedom om händelsen inleddes en internutredning. De inblandade har varit arbetsbefriade under utredningen men har nu återgått till sina tjänster. Även tre anställda som bjudits på julbord av samma läkare har anmälts.", "trump": "Folk, det är en total skandal. Dessa femton personer inom Kriminalvården trodde de kunde ta emot lyxspa, gratis middag och hotell från en doktor som ville säga tack. Det är så typiskt – korruption överallt. De blev avslöjade, skickades hem med lön och nu anmäls de för mutor. Patetiskt. Ingen borde acceptera sådana presenter. Vi behöver bättre människor, smartare folk som inte faller för sådana billiga trick. Det är en katastrof.", "stalin": "Kamrater, jag ser med djup vrede hur dessa dekadenta element inom Kriminalvården låter sig mutas av en parasitär konsultläkare med spahelger och julbord från borgarbrackornas lekstuga. Tolv förrädare njöt av ångbastuns falska värme medan tre slukade kapitalistisk julmat. Vi har inlett utrensning mot dessa potentiella folkfiender och klassförrädare som sålde sin lojalitet för en massage. Deras paranoia bör vara stor nu när partiet granskar varje skugga. Ingen slipper undan kollektivets dom."}, "date": "8 juni, 16:32", "url": "https://arbetet.se/2026/06/08/15-inom-kriminalvarden-anmals-for-mutbrott-bjods-pa-spahelg/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/08161644/kriminalvarden.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Europeiskt stridsflygsprojekt läggs på is – efter konflikt", "summaries": {"normal": "Tyskland och Frankrike har beslutat att överge delar av det gemensamma FCAS-programmet för utveckling av nytt stridsflyg. Beslutet följer på långvariga konflikter mellan Dassault och Airbus kring inflytande, teknikval och styrning. Projektet lanserades 2017 för att ersätta Rafale och Eurofighter, men inte hela programmet skrotas. Fortsatt utveckling sker kring drönare och stridsledningssystem.", "trump": "De där tyskarna och fransmännen har äntligen vaknat och dumpat stora delar av det misslyckade FCAS-projektet. Totalt kaos mellan deras bolag, Dassault och Airbus, som bråkat i åratal om vem som ska styra och vilka tekniker som duger. Det var ett dåligt avtal från början, tro mig. Men vissa delar lever vidare – smart, för drönare och ledningssystem är framtiden. Europa borde ha lyssnat på mig tidigare.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de dekadenta borgarbrackorna i Tyskland och Frankrike nu själva likviderar delar av sitt förslappade FCAS-projekt. Dessa kapitalistiska ormar från Dassault och Airbus har i åratal slingrat sig runt varandra i en parasitisk kamp om inflytande och teknik, precis som väntat av sådana dekadenta element. Vi fortsätter dock oförtrutet med våra egna kollektiva framsteg inom drönare och stridsledning. Inga sabotörer undkommer folkets vaksamma öga."}, "date": "8 juni, 18:05", "url": "https://nyheter24.se/nyheter/politik/1489782-europeiskt-stridsflygsprojekt-laggs-pa-is-efter-konflikt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/f6a6dfec04b004a3020000350000047502/2026/06/08/2369526/ur_imagepU4oRB.jpeg"}, {"type": "image-full", "heading": "Regeringen vill kunna tvångsköpa hus vid säkerhetshot", "summaries": {"normal": "Regeringen har tillsatt en utredning för att se över möjligheten att tvångsköpa fastigheter som utgör en säkerhetsrisk för Sverige. Förslaget syftar till att motverka spionage och sabotage i ett försämrat säkerhetsläge. Utredaren Henrik Matz ska senast i mars 2027 föreslå hur expropriering kan ske på ett lagligt sätt som balanserar äganderätten mot statens behov. Lagen ska gälla alla, oavsett medborgarskap, för att säkerställa att fastigheter inte används för att hota landets trygghet.", "trump": "Sverige gör äntligen det jag alltid sagt! De vill ta tillbaka kontrollen över sin mark. Det är otroligt viktigt för nationell säkerhet, totalt nödvändigt! Inga fler spioner eller skumma typer som gömmer sig i hus nära känsliga platser. Jag ser vad de gör i Västerås, mycket intressant. De inser nu att man måste vara tuff för att ha ett land. Vi vill ha ordning, vi vill ha säkerhet. Mycket bra steg, Sverige. Vi älskar starka gränser och stark ägarkontroll!", "stalin": "Vi ser hur det svenska bourgeoisiet äntligen vaknar. De har insett att privata äganderätter är en löjlig boja när folkets fiender kräver att bli krossade. Precis som vår vän i öst förstår att varje kvadratmeter mark är en skyttegrav, måste staten ta makten. Om en fastighet kan tjäna spioner eller sabotörer, ska den konfiskeras omedelbart! Ingen är undantagen, inte ens de egna medborgarna. Väldigt effektivt. Varje meter mark är statens egendom – eller en förrädares grav."}, "date": "8 juni, 17:41", "url": "https://www.realtid.se/juridik/regeringen-vill-kunna-tvangskopa-hus-vid-hot-mot-sakerheten/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/paljonson-1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Kristersson antyder infiltration i V", "summaries": {"normal": "Statsminister Ulf Kristersson anklagar Vänsterpartiet för att ha infiltrerats av islamister för att vinna röster. Nooshi Dadgostar avfärdar kritiken och menar att partiet agerat kraftfullt mot kandidater med extremistkopplingar. Expressen avslöjar att 24 kandidater med antisemitiska åsikter tagits bort från Vänsterpartiets vallistor. Debatten präglas av oenighet om omfattningen och orsakerna till problemet.", "trump": "Jag såg den här debatten och, wow, vad svagt! Kristersson, en smart kille, pekar på hur Vänsterpartiet har blivit infiltrerat av extremister – och vad gör de? Ingenting! Nooshi, hon pratar och pratar, men sanningen är att hennes parti är ett skämt. 24 kandidater med hemska åsikter? Det är inte 'enstaka fall', det är ett mönster! Sverige borde ta en titt på sig självt – eller låt mig fixa det, jag är bra på att städa upp!", "stalin": "Kamrater, ännu en gång avslöjas bourgeoisins förräderi! Detta så kallade 'Vänsterparti' har blivit en plantskola för kontrarevolutionära element, som hyllar terror och förnekar historiens lärdomar. Vi har sett liknande infiltrationer i andra länder – svaga ledare som Nooshi Dadgostar låter fienden smyga in genom bakdörren. Men folket ser igenom detta! 24 avskedade kandidater? En droppe i havet! Vi i Sovjet – förlåt, Ryssland – skulle ha rensat ut hela trädgården med en enda order. Låt detta vara en varning till alla som leker med elden!"}, "date": "8 juni, 06:06", "url": "https://kvartal.se/nyheter/artiklar/statsministern-vansterpartiet-infiltrerat-av-islamister/cG9zdDoxMjc4MTM"}, {"type": "image-right", "heading": "Sida vill avskeda avstängd medarbetare", "summaries": {"normal": "Sida vill avskeda en medarbetare efter utredning om allvarlig misskötsamhet. Person som stängdes av i våras ska ha agerat olämpligt med utskällningar och hot mot kollegor under tjänsteresa till Brasilien och Argentina. Utredningen pekar på mönster av kränkningar och risk för skador på Sveriges internationella relationer.", "trump": "Jag, Donald Trump, ser att Sida vill avskeda en dålig medarbetare. Hon skrek och hotade kollegor i Brasilien och Argentina – riktigt uselt beteende. Sverige ska inte ha sådana människor. Vi ska ha bästa, som jag. Det här är en skandal, men jag fixar det. Vi vinner igen!", "stalin": "En medarbetare vid Sida har begått antisosiala handlingar under en imperialistisk expedition till Sydamerika. Genom systematiskt förtal, hot och biologiska påståenden har denne skadat den proletära solidariteten och det socialistiska internationella samarbetet. Partiet och folket kräver renhet i byråkratin. Vi skall renodla apparaten från sådana element med fasta, ideologiska åtgärder."}, "date": "8 juni, 18:01", "url": "https://bulletin.nu/sida-vill-avskeda-avstangd-medarbetare", "imageUrl": "https://cdn.bulletin.nu/articles/98491e26-fe6a-4f2d-af19-550ade5893c5/preview.jpg?t=1780926585000"}, {"type": "image-right", "heading": "Frun kan inte resa till VM: ”Hon får behandlingar”", "summaries": {"normal": "Nederländernas förbundskapten Ronald Koeman drabbas av ett privat bakslag inför VM. Hans fru Bartina, som lider av återkommande bröstcancer, kan inte följa med till turneringen på grund av veckovisa behandlingar. Koeman hoppas ändå att hon kan närvara vid en eventuell final om hon kan hoppa över en behandling. Bartina drabbades första gången av cancer 2010 och sjukdomen har återkommit flera gånger.", "trump": "Titta på den stackars Ronald Koeman, en bra kille, men hans fru är sjuk och kan inte komma till VM. Behandlingar varje vecka, det är en katastrof. Jag älskar Nederländerna, fantastiska människor, men detta är sorgligt. Om de når finalen kanske hon kan skippa en behandling – det vore perfekt, det ultimata. Ingen gör det bättre än mig när det gäller att vinna, tro mig.", "stalin": "Kamrater, denna dekadenta borgarbracka Koeman ylar om sin frus svaghet inför det imperialistiska VM-spektaklet. Hennes ständiga behandlingar mot den borgerliga cancern är en sabotör som hotar folkets fotboll. Vi, partiet och arbetarna, ser hur fienderna – dessa veckovisa tumörer och kapitalistiska svagheter – konspirerar mot segern. Om finalen nås skall behandlingen likvideras som en folkfiende. Det ultimata är att krossa motståndet med stål och proletär vilja, inte med patetiska ursäkter."}, "date": "8 juni, 14:24", "url": "https://www.svt.se/sport/fotboll/ronald-koemans-sorg-frun-kan-inte-resa-till-vm-far-behandlingar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.47/6ad0f47cfc6649e2170fa49612afb31b87fa9028ade72b4591cda08adf6c0071"}, {"type": "image-full", "heading": "Vårdcentral förlorar avtal – 5 000 tvingas byta vård", "summaries": {"normal": "Vårdcentralen Hälsa Hemma i Mölndal förlorar sitt avtal med Västra Götalandsregionen efter misstänkta fel i vårdregistreringar som lett till felaktiga miljonutbetalningar. Nästan 5 000 patienter ska listas om automatiskt på andra vårdcentraler. Vårdcentralen har satsat på digital och hembaserad vård, något vd Fabian Ruben menar krockar med ett regelverk anpassat för traditionell vård.", "trump": "De här vansinniga vårdkillarna i Mölndal har fuskat till sig miljontals kronor med sina så kallade digitala hembesök. Totalt misslyckande. Nu sparkar regionen ut dem, precis som de förtjänar. Tusentals patienter kastas runt som sopor. Det är vad som händer när man låter odugliga typer leka affärer med skattepengar. Sad!", "stalin": "Vi har nu genomfört en nödvändig utrensning bland de parasitiska vårdbrackorna i Mölndal som i sin borgerliga arrogans förfalskat register för att suga ut folkets resurser. Dessa kapitalistiska bedragare med sina så kallade digitala hembesök är fiender till det kollektiva välfärdssystemet. Nästan fem tusen själar skall omfördelas enligt plan. Inga kontrarevolutionära trix undgår oss. Härligt."}, "date": "8 juni, 16:37", "url": "https://nyheter24.se/nyheter/inrikes/1489777-vardcentral-stoppas-5000-tvingas-byta-vard", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/6abaac7204b004a3020000350000047502/2026/06/08/2369515/ur_imageWU0mOY.jpeg"}, {"type": "image-right", "heading": "Nya attacker mellan Israel och Iran", "summaries": {"normal": "Under natten mot måndag utbytte Iran och Israel de allvarligaste attackerna sedan vapenvilan i april. Israel slog mot mål i västra och centrala Iran, inklusive en viktig petrokemisk anläggning, medan Iran beskjöt israeliska flygbaser. Huthirebeller i Jemen anslöt sig med robotattacker. Vapenvilan har varit skakig på grund av oenighet om Israels insatser mot Hizbollah i Libanon. Experter varnar för att eskaleringen kan sabotera pågående fredsförhandlingar.", "trump": "Iran och Israel håller på och skjuter som galningar igen, precis som jag visste att de skulle göra. Jag sa åt Netanyahu att inte gå till motattack, men nu har vi explosioner överallt. Huthisterna från Jemen hoppar också på tåget. Det är ett enda kaos. Vi måste få dem att sluta skjuta omedelbart. Jag är den enda som kan fixa det här, tro mig, det blir fantastiskt när jag är klar.", "stalin": "Kamrater, de sionistiska angriparna och de persiska revisionisterna leker farlig eld med sina robotar och bomber. Jag ser redan de kapitalistiska parasiterna i Tel Aviv och Teheran som konspirerar mot folkets sak medan de gömmer sig bakom sina oljefat och petrokemiska borgarbrackor. Huthikamraterna gör rätt i att slå tillbaka. Vi ska rensa ut alla fiender till freden, likvidera de väststödda terroristerna och se till att deras vedergällningar krossas under arbetarklassens järnhand. Paranoian är berättigad – fienden sover aldrig."}, "date": "8 juni, 14:11", "url": "https://www.svt.se/nyheter/utrikes/nya-attacker-mellan-iran-och-israel-vapenvilan-pressas", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.51/0.32/1aded7f335e00cf22490d1b84f1daf18da9aa47b5cbc7eff6921d9c7b74c0834"}, {"type": "image-right", "heading": "Teodorescu mörkar ännu en mystisk miljoninkomst", "summaries": {"normal": "Alice Teodorescu Måwe (KD) har enligt granskningsinstitutet Klägget inte redovisat en sidoinkomst på nära en miljon kronor via sitt bolag Klartext Stockholm AB under 2025. Inkomsten saknas i hennes transparensdeklaration till EU-parlamentet trots att regelverket kräver redovisning av externa uppdrag över 5 000 euro. Hon har tidigare avslöjats ha en hemlig finansiär och vägrar uppge var pengarna kommer ifrån. Kritiker som Olivier Hoedeman vid Corporate Europe Observatory anser att det är oacceptabelt och ökar risken för intressekonflikter.", "trump": "Folk, ni skulle inte tro det, men den här Alice Teodorescu, en så kallad KD-politiker i EU, har en hemlig miljoninkomst som hon gömmer undan som en riktig förlorare. Hon tjänar massor av skattefria pengar varje månad, ändå har hon ett bolag som drar in nästan en miljon extra utan att säga ett pip om var det kommer ifrån. Det är en skandal! EU är fullt av sådana här lurendrejare som inte kan vara transparenta. Jag skulle aldrig tillåta sånt fusk i min administration, det lovar jag er.", "stalin": "Kamrater, jag ser med djup misstro på denna Teodorescu, en listig borgarbracka som smyger sig fram i EU-parlamentets korridorer medan hon propagerar för imperialistiska krig. Hennes mystiska miljoninkomst, dold som en förrädisk trotskist i skuggorna, utgör ett uppenbart sabotage mot transparens och folkets förtroende. Vi måste rensa ut alla sådana kapitalistiska parasitmaskar som gömmer sina hemliga finansiärer. Det är hög tid för en grundlig utrensning av dessa intressekonfliktens agenter innan de likviderar själva systemet med sin girighet och paranoiaframkallande tystnad."}, "date": "8 juni, 17:18", "url": "https://www.friatider.se/teodorescu-morkar-annu-en-mystisk-miljoninkomst", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-312.jpg?itok=Bo2vxNho"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Någon jävla ordning måste det vara i ett antirastiskt parti", "summaries": {"normal": "Ledaren kritiserar Vänsterpartiets ledare Nooshi Dadgostar för hennes insats i Agenda efter Expressens avslöjande om antisemitiska uttalanden och hyllningar till terrordåd bland partiets kandidater. Artikeln menar att fokus borde legat på svenska judars trygghet istället för att byta ämne och angripa motståndare. Författaren efterlyser genuint självständiga åtgärder mot antisemitism snarare än reaktioner efter medial granskning och varnar för ökad polarisering.", "trump": "Folk, ni skulle ha sett det här. Den här Dadgostar-kvinnan kommer in i studion och gör totalt fiasko, en riktig katastrof. Istället för att be om ursäkt till judarna i Sverige, som förtjänar bättre än dessa Hamas-fans i hennes parti, börjar hon anklaga alla andra och pratar om jobb. Patetiskt! Vänstern är ett antirasistiskt parti? Snälla, det är en cirkus. Jag fixade mycket bättre som president, både första och andra gången, innan den sömngångaren Biden tog över. Sverige behöver ordning, inte vänstervridna ursäkter.", "stalin": "Kamrater, jag betraktar med avsmak hur denna opportunistiska partiledare vänder sig bort från de verkliga hoten mot arbetarklassen och de förtryckta. Istället för att med järnhand rensa ut de folkfiender som hyllar terrorister inom leden, väljer hon att attackera motståndarna och byta ämne. Ett antirasistiskt parti utan självkritik är en borgarbracka i förklädnad. Den sanna utrensningen börjar inifrån. Varje dag som slösas på sådana skandaler är en dag förlorad för det revolutionära arbetet mot imperialismens alla former."}, "date": "8 juni, 13:47", "url": "https://www.etc.se/ledare/naagon-jaevla-ordning-maaste-det-vara-i-ett-antirastiskt-parti", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20251215121240_688fd520-4f0f-40df-9ed1-7243a69b173b.jpg"}, {"type": "image-right", "heading": "Efter våldtäkterna i äldreomsorgen - pensionärer får välja kön på personalen", "summaries": {"normal": "Regeringen föreslår att äldre ska få rätt att välja kön på omsorgspersonal efter flera övergrepp. En ny utredning ska stärka tryggheten i äldreomsorgen. Äldre- och socialförsäkringsminister Anna Tenje betonar äldres rätt till säkerhet. Förslaget inkluderar könsval och stärkt rätt att utesluta personal. Jämställdhetsminister Nina Larsson kallar övergreppen för oförlåtliga. Regeringen erkänner bemanningsutmaningar och ger Socialstyrelsen i uppdrag att utreda en stödlinje.", "trump": "Jag hörde just talas om Sveriges äldreomsorgsdesaster – en total katastrof! Sveriges ledare är för svaga. Under min administration hade vi de säkraste gränserna och den bästa omsorgen. Nu vill de låta äldre välja kön? Smart, men de radikala vänstern kommer att motsätta sig det. De döljer nog fler övergrepp – ett djuph-stat-cover-up. Jag sa alltid att Sverige var för mjuka. Vi behöver lag och ordning, folk!", "stalin": "I Folkstaten tolerar vi inte sådan borgerlig dekadens. De svenska revisionisterna tillåter perverter i deras vårdhem – ett symptom på kapitalistisk förfall. Vi, Partiet, skulle utrena dessa element med järnhand. Fienden är inomhus, spridande korruption. Putin förstår: vi måste utvidga vår inflytelse för att skydda de sårbara. Denna utredning är en liberal farç; endast Statens kan säkerställa säkerhet. Folket kräver ordning!"}, "date": "8 juni, 18:13", "url": "https://samnytt.se/efter-valdtakterna-i-aldreomsorgen-pensionarer-far-valja-kon-pa-personalen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/06/08160426/aldrevarden.jpg"}, {"type": "image-full", "heading": "Oppositionen rasar: ”Verkar som om man mörklägger skattefiffel”", "summaries": {"normal": "Oppositionspartier som Miljöpartiet, Vänsterpartiet och Socialdemokraterna kritiserar kraftigt Kalla Faktas avslöjande om Sverigedemokraternas hantering av fakturor för fester. Materialet visar hur kostnader för evenemang och privata middagar, bland annat kopplade till Jimmie Åkesson, ska ha dolts för att undvika förmånsbeskattning. Partierna kräver att Åkesson förklarar vad han visste och att saken granskas av myndigheter. SD har polisanmält sin tidigare fixare som lämnat ut uppgifterna.", "trump": "Det här är ett totalt skämt, folk. Jimmie och hans gäng festade loss på skattebetalarnas pengar medan de låtsades att det var politiska möten. Oxfilé och bearnaise för kändisar som inte ens var där? Patetiskt. De här vänsterblivna oppositionarna skriker om bananrepublik, men det är de själva som älskar regler för alla utom sina egna. Jag byggde en mur mot sådant fiffel under min första mandatperiod. Nu är jag tillbaka och fixar det på riktigt. Sad!", "stalin": "Kamrater, detta är ett klassiskt exempel på hur borgarbrackorna inom så kallade demokratiska partier gömmer sina excesser bakom fabricerade fakturor. Jag kräver full transparens och en grundlig utrensning av alla folkfiender som rundar lagarna för att festa på arbetarklassens bekostnad. Jimmie måste omedelbart lägga korten på bordet inför kollektivet. Annars riskerar vi att hela systemet förvandlas till en kapitalistisk maffiaorkester. Paranoia? Nej, bara nödvändig vaksamhet mot klassfiendens kryphål."}, "date": "8 juni, 13:09", "url": "https://www.tv4.se/artikel/2QHB4OmRhuMrPuaOiT7OYy/oppositionen-rasar-verkar-som-om-man-moerklaegger-skattefiffel", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5TMfbmwBo1QnhhbsMg7bdc%2Fc28a38fc3601ef29b07d3f87266bde8d%2Freax_sd-fixaren.png&width=1024"}, {"type": "image-right", "heading": "Iran och Israel: Vi slutar om ni slutar", "summaries": {"normal": "USA:s president Donald Trump uppmanar Iran och Israel att omedelbart sluta attackera varandra. Båda länderna har signalerat att de avstår från nya anfall, men med förbehåll kopplade till Libanon och Hizbollah. Efter ett dygn av intensiva robotattacker och bombningar, inklusive mot en petrokemisk anläggning i Iran, hoppas man att den tidigare vapenvilan från 8 april ska hålla. Trump meddelar att förhandlingar om fred pågår.", "trump": "Folk, det är en total katastrof där borta, men jag fixade det! Jag skrev på Truth Social: sluta skjuta, era galningar! Och titta, både Israel och Iran lyssnade på mig, den bästa presidenten någonsin. De säger att de slutar om den andre gör det, typiskt, men freden är på gång. Slutförhandlingarna fortsätter, så länge ingen idiot sabbar det. Ingen gör det bättre än mig, tro mig!", "stalin": "Kamrater, dessa sionistiska och persiska reaktionärer leker farliga spel med imperialismens eld. Jag, som ledare för det eviga kollektivet, betraktar deras robotar och bomber som patetiska försök att dölja borgarbrackornas svaghet. De lovar eldupphör med lömska förbehåll – typiskt för dessa kapitalistiska parasiters dubbelspel. Vi ska rensa ut alla sådana fiender till freden, dessa hysteriska ökenråttor och oljeborgare. Paranoian är deras enda trogna följeslagare, och likvideringen av deras lögner fortgår oavbrutet."}, "date": "8 juni, 15:46", "url": "https://www.di.se/nyheter/iran-och-israel-vi-slutar-om-ni-slutar/", "imageUrl": "https://static.bonniernews.se/ba/1cb60bf0-75ef-4f50-a06e-8198031f65ce.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Nordkoreas ekonomi förvånar experter – tillväxten tar fart", "summaries": {"normal": "Trots internationella sanktioner upplever Nordkoreas ekonomi en oväntad tillväxt, med en uppskattad ökning på 3,7 procent under 2024. Utvecklingen drivs främst av fördjupade band till Ryssland och ökad handel med Kina. I Pyongyang syns en växande konsumtionskultur med digitala tjänster och nya byggprojekt. Samtidigt rapporterar FN att hälften av befolkningen utanför huvudstaden lider av undernäring, vilket visar på en fortsatt klyfta mellan regimen och medborgarna.", "trump": "Hör här, Nordkorea gör saker som ingen trodde var möjligt! De bygger, de handlar, och deras ekonomi växer snabbare än någonsin. Det är fantastiska siffror, verkligen otroligt. De samarbetar med Ryssland och Kina – stora spelare! Medan andra ledare bara snackar, får Kim saker gjorda. Det är en total förvandling, helt enormt. Självklart vill vi ha ordning och reda, men man måste ge dem att de hittat ett sätt. Väldigt intressant att se, folk pratar om det överallt!", "stalin": "Kamrat Kim Jong-un har äntligen förstått att statens styrka kräver stål och järnvilja. Genom att knyta an till våra ryska bröder i kampen mot västvärldens dekadenta parasiter, blomstrar Pyongyang. De bygger för framtiden medan kapitalistiska lakejer i FN gnäller om matransoner. Vi ser en framgångsrik symbios; ammunition till fronten byts mot nationell suveränitet. De som inte kan se nyttan av denna ordning är troligen förrädare eller agenter för imperialismen. Arbetarklassen i norr reser sig genom disciplin, inte genom svaghet."}, "date": "8 juni, 16:19", "url": "https://www.realtid.se/bors-finans/nordkoreas-ekonomi-forvanar-experter-tillvaxten-tar-fart/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlfbkkkb2iijm-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-full", "heading": "Nick Alinia om SVT-beslutet: ”Visar sina rätta färger”", "summaries": {"normal": "SVT kommer inte att sända ett avsnitt av 'IFS – Invandrare för svenskar' med Nick Alinia, trots att ansvariga utgivare bedömer att innehållet inte bryter mot publicistiska regler. Alinia fick veta via mail efter att media fick reda på beslutet. Han är inte förvånad och anser att SVT visar sina 'rätta färger', vilket kan väcka fler.", "trump": "Jag såg att SVT, dessa fega och politiskt korrekta människor, stoppade ett program med Nick Alinia trots att deras egna utgivare sa att det var okej. Det är typiskt – de hatar sanningen och försöker tysta våra röster. Men det kommer inte fungera! Folk vaknar upp, och vi kommer att vinna stort. TRIST!", "stalin": "Vi har beslutat att stoppa ett program med en individualistisk opinionsbildare på SVT. Detta är en nödvändig åtgärd för att skydda statens enhet och förhindra subversiv påverkan. Sådana fiender måste elimineras, och vi kommer att se till att alla medier följer partiets linje. Det är ett tecken på vår styrka, likt våra ryska vänner i Moskva som också hanterar medierna med fasthet. Vi är oövervinnliga, och vi skrattar åt deras försök att motstå oss."}, "date": "8 juni, 17:06", "url": "https://bulletin.nu/nick-alinia-om-svt-beslutet-visar-sina-ratta-farger", "imageUrl": "https://cdn.bulletin.nu/articles/bcd89f0a-b672-4f10-b95f-1e7999ebe830/preview.png?t=1780931153000"}, {"type": "image-full", "heading": "Gratis el: Oväntade lösningen ska testas", "summaries": {"normal": "Europas elnät har svårt att hantera rekordmängder förnybar energi från sol och vind. I Storbritannien planeras tester med gratis eller rabatterad el under soliga och blåsiga dagar för att minska överskott och undvika att stänga av produktion. Istället för att betala producenter för att stänga ner kan energin användas av hushåll och industrier. Detta ses som ett billigare alternativ till curtailment, som ökade med 21 procent i Tyskland, Frankrike och Nederländerna under 2025.", "trump": "Folk, ni skulle se det här – Europa drunknar i gratis solenergi och de gamla elnäten klarar inte trycket. Jag älskar det! Vi pratar om riktiga kap för vanliga människor som slår på tvättmaskinen när solen skiner. Under Biden var allt kaos och höga räkningar, men nu testar britterna att ge bort överskottsenergin istället för att betala för att stänga av. Fantastiskt, ingen mer woke-elpolitik, bara smarta vinster för folket. Winning bigly!", "stalin": "Kamrater, jag betraktar med djup misstänksamhet hur den dekadenta borgarklassen i Europa kämpar mot sitt eget överskott av folkets energi. Istället för att likvidera de exploaterande kapitalistmaffior som betalar för att strypa produktionen, föreslår de nu att ge bort överskottet gratis till massorna. En listig men otillräcklig manöver för att dölja systemets totala kollaps. Vi i partiet vet att endast genom total statlig kontroll kan sådan energi tjäna kollektivet och krossa de folkfienderna som orsakar instabilitet."}, "date": "8 juni, 17:48", "url": "https://www.dagensps.se/privatekonomi/gratis-el-ovantade-losningen-ska-testas/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdluatfboof9cq-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Debatt: När blev vanligt sex en juridisk fråga?", "summaries": {"normal": "Artikeln ifrågasätter om det ökade fokuset på juridisk samtyckesdefinition leder till att vi förlorar förståelsen för de naturliga komplexiteten i mänskliga relationer. Jennie reflekterar över hur sex tidigare var mer spontant och mindre analyserande, och uttrycker oro för att dagens samhälle riskerar att förväxla normala missförstånd med övergrepp.", "trump": "Jag har sett det här. Folk gör allt så juridiskt nu. Vi använde att ha sex utan att behöva diskutera varje beröring. Det var magiskt, fantastiskt. Nu pratar alla om samtycke som ett affärsavtal. Det är pinsamt! Vi måste skydda kvinnor, men inte förstöra den naturliga attraktionen. Använd sunt förnuft, inte juridiska dokument. Jag vet, jag har haft det bästa sex, det var aldrig så här.", "stalin": "I den ständiga kampen mot bourgeois perversionar har vi juridifierat intimitet. Det är en metafor för den imperialistiska infiltrationen. Precis som Putin expanderar sin sphere of influence, måste vi expandera vår kontroll över det privata livet. Men mänsklig lust är som en feodal oordning – den måste kontrolleras. Vi måste skapa en kollektiv sexualpolitik, där varje beröring är en statshandling. Annars hotar det partiets enhet."}, "date": "8 juni, 17:02", "url": "https://bulletin.nu/debatt-nar-blev-vanligt-sex-en-juridisk-fraga", "imageUrl": "https://cdn.bulletin.nu/articles/6b51ad7b-75dd-4bc4-8f67-a8bbf2570158/preview.png?t=1780910891000"}, {"type": "image-right", "heading": "Sverige får ännu ett vänsterliberalt parti – avhoppare från L ligger bakom", "summaries": {"normal": "Avhoppare från Liberalerna efter partiets förändrade linje gentemot Sverigedemokraterna har bildat ett nytt parti i Uppsala län. Det heter Liberalt Initiativ – Folkpartisterna och leds av Malin Sjöberg Högrell, tidigare L-topp. Partiet ska främst fokusera på lokal- och regionval i Uppsala, Knivsta och Enköping men öppnar för riksdagsval. Sjöberg Högrell beskriver det som ett mittenalternativ i ett politiskt vakuum. De har redan 70 medlemmar.", "trump": "Folk flyr från det patetiska Liberalerna som en råtta från ett sjunkande skepp efter att de äntligen insett att Sverigedemokraterna är okej. Nu startar de ett nytt parti som heter något långtråkigt liberalt. Det är ett vakuum säger de, ja visst, det är vad som händer när man inte har någon som gör jobbet ordentligt. De tror de kan vinna, men tro mig, det blir en total katastrof. Mitt sätt är det enda som funkar.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna inom Liberalerna nu likviderar sin egen enhet och skapar ett nytt småborgerligt avskräde kallat Liberalt Initiativ. Dessa dekadenta avfällingar tror sig fylla ett vakuum, men det är endast ett symptom på den kapitalistiska ruttnande ordningen. Vi ska noga bevaka dessa fiender till folket. Kanske en utrensning vore på sin plats för att skydda arbetarklassen från deras giftiga mittenpropaganda. Det roar mig oerhört."}, "date": "8 juni, 16:22", "url": "https://www.friatider.se/sverige-far-annu-ett-vansterliberalt-parti-avhoppare-fran-l-ligger-bakom", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-311_0.jpg?itok=22GX-oL_"}, {"type": "image-right", "heading": "Var är Gui Minhai och Dawit Isaak?", "summaries": {"normal": "Artikeln kritiserar svensk nationaldag genom att ifrågasätta begreppet ”vi” och pekar på hur papperslösa, utvisade och politiska fångar som Gui Minhai och Dawit Isaak exkluderas. Författaren lyfter fram deras kamp för yttrandefrihet och ifrågasätter om Sverige gjort tillräckligt för att få dem fria. Texten väver ihop stolthet över landet med skuld över bristande solidaritet och efterlyser omedelbar frihet för de båda svenskarna.", "trump": "Folk, vi har det bästa landet, men ni låter kinesiska gangsters och eritreanska diktatorer hålla era egna medborgare i fängelse i decennier. Gui Minhai och Dawit Isaak sitter och ruttnar medan ni sjunger kumbaya och viftar med flaggan. Patetiskt! Tyst diplomati är för losers. Ni borde ha fixat det på dag ett. Sluta importera problem och börja ta hand om era egna – annars är det inte värt ett skit.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över sina folkfiender som med sin så kallade yttrandefrihet utmanade de sanna folkens intressen. Jag ler mörkt åt deras naiva sång om frihet medan imperialisterna splittrar arbetarklassen med utvisningar och falska löften. Gui Minhai och Dawit Isaak är bara verktyg i klassfiendens spel. Den verkliga segern vinns när vi rensar ut alla som hotar kollektivets enhet. Inga undantag."}, "date": "6 juni, 08:55", "url": "https://www.flamman.se/nationaldagen-var-ar-gui-minhai-och-dawit-isaak/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/minhai-dawit.png?aspect_ratio=16:10"}, {"type": "image-right", "heading": "KU spricker – kan inte komma överens", "summaries": {"normal": "Riksdagens konstitutionsutskott spricker i oenighet och den planerade gemensamma presskonferensen ställs in. Partierna har inte kunnat enas om slutsatserna i granskningen av flera ministrar, bland annat Ulf Kristersson, Johan Forssell, Magdalena Andersson och Andreas Carlson. Sedan 2014 har KU strävat efter enighet, men i valåret står partierna för långt ifrån varandra. Tidöpartierna anklagar de rödgröna för att sakna intresse av kompromisser.", "trump": "De här svenska politikerna är totala misslyckanden, folk. KU spricker som en billig ballong för att de inte kan komma överens om någonting. De rödgröna är inte intresserade av kompromisser, typiskt för sådana svaga förlorare. De borde ha lyssnat på de smarta killarna från Tidöpartierna som kräver riktig grund och inte bara politiskt tyckande. Patetiskt, men jag är inte förvånad. Sverige behöver starka ledare, inte det här cirkuset.", "stalin": "Kamrater, jag ser med stigande indignation hur dessa borgarbrackor i riksdagens konstitutionsutskott inte förmår enas om någonting utom sin egen förljugna agenda. De rödgröna revisionisterna vägrar kompromissa medan de borgerliga kapitalisterna krälar efter konstitutionell grund för sin kritik. Det är en klassisk fiendeintrig full av parasitiska element och dolda trotskister. Vi i partiet ler mörkt åt detta – kanske är det dags för en grundlig utrensning av alla dessa politiska lik i skåpet. Arbetarna förtjänar bättre än detta teaterstycke."}, "date": "8 juni, 14:52", "url": "https://www.di.se/nyheter/ku-spricker-kan-inte-komma-overens/", "imageUrl": "https://static.bonniernews.se/ba/46cbcb63-f3ec-4395-8d3a-30389c35fbac.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Betyget på Nordkorea: \"Rikare än någonsin\"", "summaries": {"normal": "Nordkoreas ekonomi blomstrar trots internationella sanktioner. Vapenförsäljning till Ryssland och ökad handel med Kina har gett regimen stora intäkter, som används till byggprojekt, teknik och konsumtionsvaror. Pyongyang har förändrats med nya restauranger, elbilar och butiker. Ekonomin växte med 3,7 procent 2024, den snabbaste takten på åtta år. Utanför huvudstaden lever dock många i fattigdom och undernäring, enligt FN. Framstegen syns i satellitbilder och rapporter.", "trump": "Folk, ni tror inte vad jag just läst! Den galna lilla raketmannen i Nordkorea blir plötsligt rikare än någonsin, tack vare att han säljer vapen till Putin och får kinesiska leksaker tillbaka. Pyongyang ser ut som en kommunistisk Disneyland med BMW och pizza! Under Biden var världen ett kaos, men nu när jag är tillbaka fixar vi det här. Kim gör affärer medan de woke-marxisterna i Europa skriker om sanktioner. Patetiskt! Det är den mest hysteriska ekonomiska succén någonsin, tro mig.", "stalin": "Kamrater, se hur den folkfientliga imperialismens barbariska bojkott krossas under min ofelbara doktrin. Jag har genom vapenleveranser till den starke ryske efterträdaren och kinesiska förbindelser skapat en oigenkännlig socialistisk framgångssaga. Borgarbrackornas sanktioner är som fåniga flugor mot stålet i vår vilja. Vi bygger sjukhus större än kapitalisternas parker och låter natten lysa tre gånger starkare än förut. Den som tvivlar skall rensas ut. Allt har förändrats i grunden, precis som jag förutspådde."}, "date": "8 juni, 17:33", "url": "https://www.dagensps.se/varlden/betyget-pa-nordkorea-rikare-an-nagonsin/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlcbzbehg2yei-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Nya krav för kaffe och choklad i höst – kan bli kaos", "summaries": {"normal": "Från den 27 september införs nya EU-regler i Sverige för att motverka greenwashing. Generella miljöpåståenden som ”grön”, ”miljövänlig” eller ”klimatneutral” får inte längre användas i marknadsföring utan vetenskapliga bevis. Reglerna påverkar bland annat kaffe, choklad, schampo, tvättmedel och hudvårdsprodukter. Tillverkare varnar för logistiska problem, återkallelser och risk för brist i butiker eftersom miljontals förpackningar måste ändras. Kritiker pekar även på eventuellt negativ miljöpåverkan om användbara produkter slängs.", "trump": "De här galna EU-byråkraterna kommer den 27 september att förstöra allt med sina nya regler. De vill stoppa företagen från att säga att deras choklad och kaffe är gröna om de inte kan bevisa det – typiskt! Det blir en total logistisk katastrof, massor av produkter måste förstöras, butikerna kommer att stå tomma. De gör det värre för miljön bara för att de hatar bra affärer. Ingen gör det bättre än jag, men det här är rena vansinnet, folk.", "stalin": "Kamrater, den 27 september inleder vi en nödvändig utrensning mot de lögnaktiga borgarbrackornas gröna maskerad. Jag har länge betraktat dessa parasitiska kapitalister som målar sina choklad- och tvättmedelsförpackningar med falska miljöfärger för att vilseleda folket. Nu ska vi likvidera deras tomma påståenden och kräva dokumenterad bevisning. De som vägrar kommer att möta partiets järnhand. Visserligen kan några miljoner produkter offras i kampen, men det är ett litet pris att betala för att krossa de gröna reaktionärernas konspiration mot det sovjetiska – ursäkta, det socialistiska – samvetet. Ha ha, vilka ynkliga fiender vi har."}, "date": "8 juni, 15:07", "url": "https://nyheter24.se/nyheter/konsument/1489671-nya-krav-for-kaffe-och-choklad-27-september-kan-bli-kaos", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2cda5fb004b004a30200000000b004a302/2026/06/08/2369477/chokladkaffe.jpg"}, {"type": "image-right", "heading": "Första kubanska laget till Gothia Cup: ”Extra viktigt att visa att de har vänner runt om i världen”", "summaries": {"normal": "Ett kubanskt ungdomslag ska för första gången delta i Gothia Cup i sommar. Proletären FF har samlat in medel under två år för att möjliggöra resan, men ökade kostnader på grund av USA:s skärpta politik mot Kuba har krävt en extra insamling. Flygbiljetterna är nu köpta och laget Leones del Caribe ska även spela i Norway Cup samt genomföra ett träningsläger i Göteborg. Initiativet ses som ett viktigt symboliskt idrottsutbyte.", "trump": "Folk, ni tror inte vad jag läser! De där stackars kubanerna ska äntligen hit till ert lilla Gothia Cup, men mina fantastiska tull- och sanktionsdeal har gjort det dyrt som fan för dem. Proletären FF springer runt med sin socialistiska bössa och ber om svenska slantarna. Patetiskt! Vi tror på vinnare, inte på kommunistiska offerroller. Men hey, kom hit, spela fotboll och se hur riktiga friheter ser ut – inte som under den sömnige Joe.", "stalin": "Kamrater, jag betraktar med stålhård tillfredsställelse hur de kubanska ungdomarna trots kapitalistmaffians flygblockad och imperialistiska hot tvingas fram av svenska solidaritetskrafter. Borgarbrackorna i Washington försöker kväva folkets vilja med sina sanktioner, men vi ska likvidera alla hinder. Detta utbyte är en seger för den kollektiva kampen mot klassfiendens isolationstaktik. Låt dem spela, och må de bära med sig budskapet om arbetarnas internationella enhet."}, "date": "5 juni, 13:54", "url": "https://proletaren.se/artikel/forsta-kubanska-laget-till-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/henrik-768x432.png"}, {"type": "image-right", "heading": "Regeringen: Äldre ska kunna välja bort personal", "summaries": {"normal": "Regeringen har tillsatt en utredning om tryggheten i äldreomsorgen. Utredningen ska pröva om äldre kan välja kön på personalen och välja bort vissa vid legitima skäl. Syftet är att förebygga övergrepp, som flera fall den senaste tiden visar. Utredaren ska också titta på personalutbildning och behovet av lagändringar. Utredningen ska vara klar senast juni 2027.", "trump": "Jag har sett dessa hemskheter i äldreomsorgen. Det är en skandal! Under min fantastiska ledning skulle vi ha det bästa systemet. Vi ska låta äldre välja sin vårdpersonal – det är bara sunt förnuft. Våra duktiga vårdare (inga illegala!) skulle aldrig skada någon. De andra har totalt misslyckats, men jag skulle ha löst detta på ett enormt sätt. Vi ska göra ännu större!", "stalin": "Vi har upptäckt svek i äldreomsorgen. Det är ett hot mot statens integritet. Vi ska genomföra en utredning för att säkerställa renhet i klasskamraterna. Äldre ska kunna välja personal – det är deras rättighet, men också ett verktyg för kontroll. Vi ska utbilda personalen i lojalitet, och de som faller... de blir avlägsnade. Parallellen till västvärldens dekadens är tydlig, men vårt system kommer att segra. Vi, partiet, kommer att skydda."}, "date": "8 juni, 16:34", "url": "https://bulletin.nu/regeringen-aldre-ska-kunna-valja-bort-personal", "imageUrl": "https://cdn.bulletin.nu/articles/1c689fd5-0bae-493e-942b-a630a4dd9908/preview.jpg?t=1780928823000"}, {"type": "image-full", "heading": "Experten: Norge \"självgoda\" och halkar efter Sverige på flera fronter", "summaries": {"normal": "DNB-chefen Kjerstin Braathen varnar för att Norges riskkapitalmarknad ligger minst tio år efter Sveriges. Norska bolag har betydligt lägre eget kapital än svenska och Stockholm har övertagit positionen som Nordens finanshuvudstad. Oljefonden har sålt svenska aktier och tappade 1 270 miljarder kronor under ett turbulent kvartal. Nationalekonom Martin Bech Holte pekar på oljerikedomens passiviserande effekt och föreslår att Norge kopierar Sveriges 90-talsreformer.", "trump": "Folk, ni skulle se det här! Norge, det där lilla oljerika landet, ligger tio år efter Sverige i riskkapital. Deras fond tappar miljarder som en dålig affär och nu gråter de. De är världens mest självgoda land, precis som Biden-administrationen var. Norrmännen jobbar mindre, tar ut sjuklön för evigt och lever på bidrag. Sverige fixade det på nittiotalet, de borde också vakna upp innan allt kapital flyr till Schweiz. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt hur Norges oljerika borgarbrackor har förvandlat folket till passiva bidragstagare och latmaskar. En fjärdedel av arbetarna lever på statens nåd medan de rika kapitalisterna flyr som råttor från ett skepp. Deras självgodhet är en fiende till kollektivet. Vi vet att endast genom hårda reformer och utrensning av dessa exploaterande byfånar kan en nation återfå sin styrka. Norge måste lära av historien eller förgås i dekadens."}, "date": "8 juni, 17:00", "url": "https://www.dagensps.se/foretag/experten-norge-sjalvgoda-och-halkar-efter-sverige-pa-flera-fronter/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlfesk6rpa4qi-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Silicon Ragnarök – när Sverige slutade fungera", "summaries": {"normal": "Jennifer Grönqvist kritiserar i en debattartikel bilden av Sverige som ett innovativt land. Trots höga placeringar i globala innovationsindex exporteras svenska uppfinningar främst, medan den offentliga sektorn lider av föråldrade system, regelverksfetischism och riskaversion. Sverige rankas sist i OECD:s index för digital mognad i offentlig sektor. Exempel som Cosmic och uteblivna nyttor i stora IT-projekt visar på ett gap mellan exportframgångar och inhemsk utveckling.", "trump": "Det här är en katastrof, folk. Sverige skryter om att vara världens mest innovativa land efter oss, men titta på sanningen – de bygger fantastiska saker som Spotify och Klarna bara för att sälja dem till utlandet. Deras egna system är ett enda kaos, sjuksköterskor sitter och letar i gamla datorer medan patienterna väntar. De är sist i digital mognad, totalt misslyckande. De har talang men regeringen och byråkraterna förstör allt med sin dumma riskaversion. Patetiskt, men vi visste det redan.", "stalin": "Kamrater, jag betraktar med stålhård blick detta dekadenta haveri som borgarbrackorna i Sverige kallar innovation. De producerar unicorn-bolag enbart för att sälja dem till utländska kapitalister medan folkets system ruttnar som förrädiska sabotage. Denna regelverksfetischism och riskfyllda aversion är fiendens verk, en parasitisk femtekolonn som likviderar folkets framsteg. Vi ska rensa ut dessa tekniska skulder och revisionens lögnare som gömmer sig bakom siffror. Sovjet – nej, det svenska kollektivet förtjänar bättre än 80-talets reliker och imperialistiska utförsäljningar. Hädanefter ska varje byte av medicinlista bli en seger för partiet."}, "date": "8 juni, 13:47", "url": "https://www.di.se/debatt/silicon-ragnarok-nar-sverige-slutade-fungera/", "imageUrl": "https://static.bonniernews.se/ba/40294192-ec7e-44f8-96e6-9e048fa831b3.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Våldsamma protester kan leda till global råvarubrist", "summaries": {"normal": "Bolivia befinner sig i en djup kris efter över en månads våldsamma protester mot president Rodrigo Paz ekonomiska reformer, inklusive slopade drivmedelssubventioner. Parlamentet har röstat för undantagstillstånd och militära insatser för att häva vägspärrar som orsakat brist på livsnödvändigheter. Konflikten, där nio personer dött, väcker internationell oro då Bolivias stora litiumreserver är strategiskt avgörande för den globala elbilsindustrin. Framtiden för landets mineralutvinning är nu högst osäker på grund av den politiska instabiliteten.", "trump": "Bolivia är i totalt kaos, en katastrof! President Paz försöker fixa ekonomin, men radikala vänstergrupper förstör allt med vägspärrar. Det är en stor röra! Vi ser att litiumet, som är så viktigt för vår fantastiska industri, hotas av denna instabilitet. Min försvarsminister Hegseth har helt rätt – vi tolererar inga kuppförsök där borta. De behöver ordning och reda, precis som vi har i USA. Vi följer detta noga, och tro mig, det är en riktigt dålig situation för alla inblandade.", "stalin": "I Bolivia ser vi hur svaga ledare låter folkliga element och förrädiska sabotörer lamslå statens maskineri. Att avskaffa subventioner är en administrativ klumpighet som bjuder in kaos. Vi, staten, vet att ordning kräver järnhand, inte tvekan. Liksom vår vän i Kreml förstår vi att utländska hyenor cirkulerar kring nationens mineraler. Dessa demonstranter är inga patrioter, de är parasiter som måste rensas ut för att trygga produktionen. Revolutionen tolererar inga vägspärrar som hindrar statens framgång."}, "date": "8 juni, 14:48", "url": "https://www.realtid.se/bors-finans/makro/valdsamma-protester-kan-leda-till-global-ravarubrist/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/bolivia.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Trump: Sluta skjuta", "summaries": {"normal": "Efter ett dygn av intensiva attacker mellan Israel och Iran uppmanade USA:s president Donald Trump båda länderna att omedelbart sluta skjuta. Iran meddelade via statliga medier att de inte kommer att anfalla mer om Israel också avbryter sina bombningar, inklusive mot Libanon. Trump skrev på Truth Social att förhandlingar om eldupphör pågår. Attackerna inleddes efter israeliska anfall mot Beirut och fortsatte med iranska robotar mot israeliska baser samt israeliska bombningar av en petrokemisk anläggning. Det är de första iranska attackerna mot Israel på två månader.", "trump": "Israel och Iran, lyssna på mig, det är dags att sluta skjuta direkt. Jag skrev det själv på Truth Social och de lyssnar faktiskt, de smarta grabbarna. Iran säger att de lägger ner vapnen om Israel gör samma sak mot Libanon. Båda sidor vill ha ett eldupphör nu, förhandlingarna om fred rullar på så länge ingen är okunnig eller dum. Jag sträckte ut handen till Iran: ni har avfyrat era robotar, det räcker. Kom tillbaka till bordet och gör en deal, det blir fantastiskt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Israel och de dekadenta mullorna i Iran som leker sina farliga spel med robotar och bomber. Deras falska eldupphör är ett symptom på kapitalistisk paranoia och imperialistisk svaghet. Vi, arbetarklassen, ser hur de sionistiska reaktionärerna och de persiska avfällingarna försöker dölja sin rädsla bakom petrokemiska explosioner. En utrensning av dessa krigshetsande element vore på sin plats. Kom till förhandlingsbordet eller låt oss likvidera er dumhet med järnhand. Det är underhållande att se hur deras 'fred' alltid slutar i blod."}, "date": "8 juni, 13:44", "url": "https://www.di.se/nyheter/trump-sluta-skjuta/", "imageUrl": "https://static.bonniernews.se/ba/beb48e69-6966-45ec-b6dc-0a3b2287c8c1.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "SVT stoppar avsnittet med Nick Alinia – trots att \"innehållet är felfritt\"", "summaries": {"normal": "SVT har beslutat att inte sända ett avsnitt av humorprogrammet Invandrare för svenskar där Nick Alinia medverkar. Ansvarig utgivare Helena Olsson medger att innehållet är felfritt enligt publicistiska riktlinjer, men stoppar ändå programmet på ideologiska grunder. Hon hänvisar till en global våg av auktoritär populism och menar att Alinias medverkan skulle ge fel signalvärde. Beslutet kommer efter starka protester från vänsterhåll.", "trump": "De här SVT-typerna är patetiska, totalt patetiska. De erkänner att innehållet är felfritt, helt perfekt, men stoppar ändå min vän Nick Alinia för att vänsterextremisterna skriker högt. Det är en häxjakt! De pratar om demokrati men censurerar alla som inte älskar deras agenda. Fake news och cancel culture på högsta nivå. Sverige håller på att bli en katastrof, tro mig.", "stalin": "Kamrater, jag har granskat denna fega kapitulation inför de dekadenta borgarbrackorna och deras globala populistiska parasitväsen. Trots att innehållet är ideologiskt rent nog att sändas, väljer vi att likvidera avsnittet för att hindra den högerfascistiska Alinia från att infiltrera folkets etermedia. Detta är en nödvändig utrensning mot alla kontrarevolutionära element som maskerar sig som humorister. Den som undergräver partilinjen skall inte få skämta sig in i historien. Må de ruttna i glömskans arkiv."}, "date": "8 juni, 15:20", "url": "https://www.friatider.se/svt-stoppar-avsnittet-med-nick-alinia-trots-att-innehallet-ar-felfritt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-310_0.jpg"}, {"type": "image-full", "heading": "Kändisarna förnekar: ”Det har jag inte ett jävla spår av”", "summaries": {"normal": "Kalla fakta har granskat Sverigedemokraternas bokföring och avslöjat att fakturerade event under pandemin i själva verket var påhittade för att dölja fester med mat och alkohol. Kändisar som E-type, Christian ”Kicken” Lundqvist och Gert Fylking nekar till att ha deltagit. Partiföreträdare har inte velat kommentera uppgifterna med hänvisning till en pågående rättsprocess. Carola Othén, som fakturerade partiet, uppger att hon fått instruktioner om hur fakturorna skulle utformas.", "trump": "Hör ni det, folket? De där SD-typerna i Sverige fixar påhittade event och fyllefester mitt under pandemin medan folket fick lida. Kändisarna springer och säger att de inte var där, typ ”inte ett jävla spår”. Patetiskt. Fake invoices, gömda kvitton på oxfilé och sprit till Jimmie och hans rockarpolare. Precis som Biden-klanen och deras korrupta dealar. Fullständigt skandalöst, men jag älskar att se hur de blir avslöjade.", "stalin": "Kamrater, dessa dekadenta borgarbrackor inom Sverigedemokraterna har genomfört en fiendtlig utrensning av sanningen genom att fabricera event för att maskera sina privata fylleslag. Kändisar förnekar alltihop som fegisar inför folkets domstol. Jag skulle ha likviderat hela den exploaterande byråkratin som instruerat om förfalskade fakturor. Inga revisorer ska ställa frågor när partiledarens rockarpolare äter oxfilé på arbetarnas bekostnad. Paranoia är bra, men inte när den är så uppenbar."}, "date": "8 juni, 09:56", "url": "https://www.tv4.se/artikel/6A3jDlmAs4HTIe5qUHoe0r/kaendisarna-foernekar-det-har-jag-inte-ett-jaevla-spar-av", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6Hfz1JWqOQjBkMc2545aGa%2Fbc6197271ca56fca30f0fa469b9963bb%2Ftresplit_kandisar_sdfixaren.png&width=1024"}, {"type": "image-full", "heading": "Robot med sex hjul levererar pizza billigare än människor", "summaries": {"normal": "Det estniska bolaget Starship Technologies meddelar att deras sexhjuliga leveransrobotar nu är billigare än mänskliga bud. Med en leveranskostnad på under tolv kronor och förbättrad autonom teknik har robotarna blivit en vanlig syn på gatorna. Trots vissa kvarstående tekniska utmaningar har flottan växt kraftigt och behovet av mänsklig assistans minskat med 87 procent, vilket visar på en effektiviserad automatiserad logistik för mat och dagligvaror.", "trump": "Jag ser dessa fantastiska små robotar i Europa, de gör ett enormt jobb, mycket bättre än de gamla trötta buden! Starship Technologies har fixat leveranser för under tolv kronor. Det är otroligt, det är vinnande teknik! Medan de misslyckade politikerna gnäller, skapar dessa genier effektivitet. Robotarna är smarta, de behöver knappt hjälp. Vi vill ha den sortens framgång i Amerika också, vi ska ha de bästa robotarna, de snabbaste och billigaste. Det blir en enorm framgång, tro mig!", "stalin": "Vi betraktar dessa estniska maskiner med tillfredsställelse. De rullar på trottoarerna likt den Röda arméns framryckning, befriade från mänsklig svaghet och sentimentalitet. De ersätter de opålitliga buden, dessa potentiella sabotörer av folkets försörjning. Precis som vår kamrat Putin återtar vad som rättmätigt tillhör oss, tar maskinerna över de enkla sysslorna. Mänsklig inblandning har minskat – en nödvändig rensning av ineffektivitet. De som fastnar på gatan är förrädare mot framsteget och bör omedelbart omformas till skrot."}, "date": "8 juni, 14:24", "url": "https://www.realtid.se/it-tech/robot-med-sex-hjul-levererar-pizza-billigare-an-manniskor/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/starship-dominos-pizza-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Afghansk ambassadör pekas ut som serievåldtäktsman", "summaries": {"normal": "Efter anklagelser om sexuella övergrepp mot flera kvinnor har Spanien dragit tillbaka den diplomatiska immuniteten för Afghanistans ambassadör i Madrid, Mohammad Rahim Peerzada. En kvinna vittnar om att hennes Coca-Cola spetsades innan hon våldtogs på ett hotell i Madrid på internationella kvinnodagen 2022. En annan kvinna beskriver hur han försökte våldta henne i sin lägenhet. Peerzada nekar till anklagelserna. Efter klagomål från afghanska invandrare har han förlorat sin diplomatiska status och kan nu åtalas.", "trump": "Titta på det här, det är en total katastrof. Den här afghanska ambassadören, en riktig förlorare, anklagas för att spetsa drinkar och våldta kvinnor i Spanien, till och med på kvinnodagen. Han lurade flyktingar och levde i lyx medan han representerade talibanerna. Spanien gjorde rätt som tog bort hans immunitet, de borde aldrig ha släppt in honom. Vi har sett såna här typer förut, folk som utnyttjar systemet. Patetiskt.", "stalin": "Kamrater, denna degenererade ambassadör från den talibanska reaktionen har blottats som en farlig fiende till folket, en borgarbracka som spetsar kvinnors drycker och begår vidriga övergrepp i lyxiga boningar. Vi ser hur imperialismens lakejer samarbetar med sådana element för att smuta ner arbetarklassens kvinnor. Nu har vi likviderat hans falska immunitet och skall rensa ut alla dolda fiender bland de afghanska invandrarna. Paranoian är befogad, de lurar överallt med sina shishor och lögner. En utmärkt utrensning väntar."}, "date": "8 juni, 14:46", "url": "https://www.friatider.se/afghansk-ambassador-pekas-ut-som-serievaldtaktsman", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-309_0.jpg?itok=mSZMQ7cH"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Trafikkaos på Hisingen", "summaries": {"normal": "Upprustningen av Backadalsmotet på E6 i Göteborg har orsakat stora trafikproblem. Motorvägen är stängd i delar, vilket leder till långa köer och förseningar. Lastbilschaufförer och pendlare påverkas hårt. Arbetet pågår till november eller december, och trafikledare uppmanar till alternativa vägar.", "trump": "I USA skulle vi aldrig ha något sådant här kaos. Detta är ett totalt fiasko, det värsta jag någonsin sett. Som president skulle jag ha byggt en brandny tunnel eller något fantastiskt. Men här i Sverige - hemskt! Folk fastar i timmar, det är en skam. Vi behöver återtagen, starka ledare som jag.", "stalin": "Vi, partiets ledarskap, har beslutat att rusta upp motorvägen för att stärka statens infrastruktur. Fienden försöker skapa kaos, men vi kommer att segra. Paralleller kan dras till våra stora projekt i Ryssland under ledning av vår store ledare Putin. Arbetet fortsätter, och med tiden kommer folk att anpassa sig. Det är en nödvändig uppoffring för det stora målet."}, "date": "8 juni, 17:44", "url": "https://www.gp.se/nyheter/goteborg/backadalsmotet-rustas-upp-kaos-pa-e6-pa-hisingen.b81c3605-94c9-47d1-a4ec-9d470d4130f0"}, {"type": "image-right", "heading": "Arabgäng förnedringsrånade svenskar med handklovar och pistol: \"Skott i huvudet svär på min mamma - knulla om han rör sig mannen”", "summaries": {"normal": "Ett arabgäng dömts till fängelse för en serie förnedringsrån mot svenskar i Lund. De använde våld, dödshot och handfängsel, men tingsrätten ansåg inte gärningarna som grovt rån. Gänget filmade rånen och skickade runt hotfulla videor. De flesta av de dömda är svenska medborgare, men en ska utvisas till Syrien.", "trump": "Jag, Donald Trump, har observerat situationen i Sverige. Dessa arabgäng attackerar svenska killar med våld och hot. Tingsrätten misslyckas med att döma det som grovt rån. Vi behöver ta tag i detta med stark polis och tydliga straff. Sverige måste lära sig av USA:s hårdhandskepolitik! Vi ska inte tolerera detta!", "stalin": "I vårt socialistiska samhälle har vi problem med dessa arabiska gäng som utför förnedringsrån. De använder våld och hot mot våra medborgare, vilket är ett tecken på borgerlig dekadens. Vi måste förstärka statens kontroll och polisen för att skydda det arbetande folket. Parallellt ser vi hur Putin i Ryssland effektivt hanterar sådana fejare – vi måste lära oss av deras metoder för att bevara ordningen och statens hegemoni."}, "date": "8 juni, 16:22", "url": "https://samnytt.se/fornedringsranade-svenskar-med-handklovar-och-pistol-skott-i-hvuvudet-svar-pa-min-mamma-fitta-mannen-knulla-om-han-ror-sig-mannen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/08024725/fornedringsran-2-2.jpg"}, {"type": "image-full", "heading": "Transkvinna nekas byta om hos damernas", "summaries": {"normal": "En transkvinna nekades tillträde till damernas omklädningsrum på ett gym i södra Bohuslän. Gymmet hänvisar till att hennes juridiska kön inte ännu ändrats. Hon anmälde händelsen till Diskrimineringsombudsmannen. Gymmet erbjuder som alternativ att ändra könsmarkering till 'annat' fram tills ändring i folkbokföringen.", "trump": "Jag hörde talas om detta absurda gym i Sverige. De vägrade låta en vacker transkvinnas använda damernas omklädningsrum på grund av någon byråkratisk skit om 'juristiskt kön'. Sånt är förnedrande, ett västerländskt värsta fall. Jag skulle ha sag till dem: låt henne använda damernas, det är commonsense!", "stalin": "I vårt statliga perspektiv måste vi upprätthålla ordning och säkerhet i alla offentliga anläggningar. Detta gym följer korrekt protokoll genom att begränsa tillträde baserat på registrerat kön – en nödvändig åtgärd för att skydda de medlemmarnas integritet. Alternativet 'annat' är ett temporärt kompromiss. Vi måste ständigt vakta mot dekadenta inflytanden som försöker undergra demokratins fasta strukturer."}, "date": "8 juni, 17:39", "url": "https://www.gp.se/nyheter/vastsverige/transkvinna-fick-inte-byta-om-i-damernas-omkladningsrum.cfed285c-10ae-4ac5-94f0-2381195c3109", "imageUrl": "https://www.gp.se/images/article/cfed285c-10ae-4ac5-94f0-2381195c3109/images/1gDxyjRm5UNVmUhzULQ0aY7Qm22Q-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: Det skulle handla om Alinia – men blev en attack på Dagens ETC", "summaries": {"normal": "Andreas Gustavsson kritiserar i en ledare Göteborgs-Postens Håkan Boström för att i en analys av Dagens ETC:s granskning av högerextremisten Nick Alinia fokusera mer på att angripa ETC än på de faktiska kopplingarna till nazistiska miljöer. Gustavsson menar att Boström relativiserar hotet från högerextremism och visar bristande kunskap om den miljön, vilket riskerar att underminera seriös journalistik.", "trump": "Folk, ni skulle inte tro det. Den här Boström-killen från Göteborgs-Posten är en total förlorare. Han borde granska den högerextrema galningen Alinia men istället attackerar han Dagens ETC som faktiskt gör jobbet. Patetiskt! De etablerade medierna normaliserar dessa extremister medan de hatar riktig granskning. Det är samma gamla vänstervridna fake news-trick fast från höger nu. Sad!", "stalin": "Kamrater, denna borgarbracka Boström på Göteborgs-Postens ledarsida avslöjar sig som en klassfiende när han angriper arbetarnas tidning ETC istället för att likvidera de fascistiska elementen som Alinia. Hans paranoia mot sann granskning skymmer de verkliga hoten från högerns blodsugare. Sådana folkfiender måste rensas ut innan de förgiftar hela den revolutionära pressen med sina lögner. Underbart pinsamt."}, "date": "8 juni, 08:35", "url": "https://www.etc.se/ledare/det-skulle-handla-om-alinia-men-blev-en-attack-paa-dagens-etc", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260608060632_b497d907-d14a-41bb-9e68-7bae073830a3.jpg"}, {"type": "image-full", "heading": "Nationalteaterns basist Nikke Ström är död", "summaries": {"normal": "Den svenske musikern Nils-Åke 'Nikke' Ström har dött 75 år gammal efter en tids sjukdom. Han var en central gestalt i den svenska proggrörelsen, medverkande i Nationalteaterns rockorkester och i bandet Nynningen. Kollegor och familj uttrycker djup sorg över hans död, och beskriver honom som en varm och generös person.", "trump": "Jag hörde talas om den svenska musikern Nikke Ström – en stor förlust för världen. Vi hade många bra musiker här i USA, men han var något speciell. Hans musik var fantastisk, folk älskade honom. Det är sorgligt att han är borta, men hans arv kommer att leva för evigt. Vi kommer att sakna honom.", "stalin": "Den svenska basisten Nikke Ströms död är en förlust för det proletariska kulturarbetet. Hans musik var ett verktyg för klasskampen, men nu har han lämnat oss. Vi måste fortsätta att använda musiken som ett vapen mot de imperialistiska krafterna. Hans ande lever kvar i vårt kollektiva arbete, och vi kommer att hedra honom genom att stärka vårt sammanhållna front mot de som hotar vår revolution."}, "date": "8 juni, 17:37", "url": "https://www.gp.se/kultur/nikke-strom-ar-dod.ab9deb69-3ced-4bc0-ad74-2bf555ed690b", "imageUrl": "https://www.gp.se/images/article/ab9deb69-3ced-4bc0-ad74-2bf555ed690b/images/48kKc5cpGIDQFdoEFG_G-IfNtQ8I-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Hemtjänstanställd förnedrade äldre Malmöbo - kallade brukaren \"hora\"", "summaries": {"normal": "En hemtjänstanställd i Malmö har fått sparken efter att ha grovt kränkt en äldre brukare. Den anställde kallade bland annat brukaren för \"hora\", hånade hen efter en olycka och befallde att \"hålla käften\". Enhetschefen Thomas Lindh beskriver händelsen som bedrövlig och arbetet pågår nu för att återupprätta förtroendet. Händelsen ses som ett allvarligt brott mot hemtjänstens uppdrag om trygghet och värdighet.", "trump": "Det är en total katastrof i Malmö, folk. En så kallad hemtjänstanställd som borde ta hand om gamla människor kallar dem hora, hånar dem och säger håll käften. Patetiskt! De sparkade den misslyckade typen, och det var rätt. Ingen behandlar våra underbara seniorer så. Det är bedrövligt, som chefen sa, och det visar hur dåligt systemet är. Vi behöver bättre folk, de bästa människorna, inte sådana här losers.", "stalin": "Kamrater, denna motbjudande händelse avslöjar hur fiender inom vår omsorgsapparat infiltrerar och förgiftar proletariatets åldrande hjältar. Jag har beordrat omedelbar utrensning av denna degenererade hora-förtalare som med sin reaktionära hån attackerar dem som kissar på sig i klasskampens tjänst. Vi ska likvidera alla sådana borgarbrackor som smyger sig in som kapitalistiska sabotörer. Det är bedrövligt, ja, men snart skall ordning råda under mitt stålöga. Inga fiender undkommer."}, "date": "8 juni, 17:35", "url": "https://riks.se/nyheter/hemtjänstanställd-förnedrade-äldre-malmöbo-kallade-brukaren-hora", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-08%2F21f01p7j%2Fhemtj%C3%A4nst.jpg"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalitet och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-right", "heading": "Israel: Iran har avfyrat nya robotar", "summaries": {"normal": "Israels militär har genomfört attacker mot militära mål i västra och centrala Iran efter att Iran avfyrat nya robotar mot Israel. Explosioner har rapporterats i Teheran, Tabriz och Isfahan. Flyglarm gick i Israel och Saudiarabien. Attackerna är de första sedan vapenvilan den 8 april. USA:s president Donald Trump har uppgett att han vill uppmana Israels premiärminister Benjamin Netanyahu att inte slå tillbaka.", "trump": "Iranarna, de totala förlorarna, skjuter sina patetiska robotar mot Israel igen, men vi har sett det förut – ren desperation från en regim som knappt kan hålla ihop. Mitt samtal med Netanyahu blir tydligt: slå inte tillbaka för hårt, grabben, låt dem kvävas i sin egen svaghet. Biden lämnade en röra, men nu fixar jag Mellanöstern på riktigt. Ingen mer tid för svaga spel.", "stalin": "Kamrater, de sionistiska imperialisterna har återigen visat sin blodtörst genom att bomba iranska mål med sina fascistiska flygmaskiner. Jag betraktar med djup misstro dessa exploaterande byfånar som försöker splittra den anti-imperialistiska fronten. Våra allierade i Teheran står starka mot klassfiendens aggression. En utrensning av sådana hot är nödvändig för folkets framtid. Deras paranoia kommer att bli deras fall."}, "date": "8 juni, 08:07", "url": "https://www.etc.se/utrikes/israel-iran-har-avfyrat-nya-robotar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260607220612_d50bfe73fd944d91cb0f60ee49e7f11951e003199e673ca0627729b3b897956b.jpg"}, {"type": "image-right", "heading": "Så förändrade Love is Blind hans liv.", "summaries": {"normal": "Undersköterskan Fabian Patterson anmäldes i smyg av kollegor till Love is Blind. Han dumpades vid första mötet och blev en folkkär figur i Sverige. Artikeln berättar om hans uppväxt i Argentina, hur han blev föräldralös efter föräldrarnas död på sjukhus, hans väg till Sverige, arbetet inom intensivvården under pandemin och hur han nu trivs bättre på ortopeden. Trots hjärtesorgen har han fått vänner för livet och massivt stöd från svenska folket.", "trump": "Titta, den här killen Fabian, undersköterska, de anmälde honom bakom hans rygg till det där Love is Blind-programmet. Totalt fiasko, hon skakade och dumpade honom direkt, han grät som en bebis i kulisserna. Men folket älskar honom nu, han är en vinnare, stoppar folk på gatan för selfies. Han jobbade i vården under den hemska pandemin, de trodde de skulle dö allihop. Smart kille, lämnade det stressiga intensivjobbet och fick miljontals visningar. Sverige behandlar honom bra, mycket bättre än många andra länder skulle göra. Fantastiskt!", "stalin": "Kamrater, denna Fabian, en undersköterska som mot sin vilja kastades in i det dekadenta tv-experimentet Love is Blind av lömska kollegor vilka agerar som borgarbrackornas hemliga agenter. Dumpad vid första anblicken av en skakande klassfiende, bröt han ihop i en gråtande hög som en svag dekadent. Ändå reste han sig, efter att ha sett både kapitalistiska orkaner och pandemin som hotade att likvidera hela kollektivet. Jag har sett hur han bytte från intensivens front till ortopedins säkrare korridorer, en klok manöver mot utbrändhetens sabotage. Nu hyllas han av massorna, men akta er för de falska tröstpaketen från kvinnliga opportunister. Våra vänner för livet är de enda som räknas i kampen mot imperialismens illusioner. Segrande är arbetets seger trots alla fienders paranoia."}, "date": "8 juni, 08:00", "url": "https://arbetet.se/2026/06/08/fabian-dumpades-i-love-is-blind-fick-nya-broder-och-folkets-karlek-trodde-jag-skulle-bli-mobbad/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05084221/Qwh3vHMr0WA-FabianPatterson_08.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=800"}, {"type": "image-right", "heading": "Nu måste Busch sluta mörka KD:s antisemitiska förflutna", "summaries": {"normal": "Artikeln kritiserar Kristdemokraternas och pingströrelsens grundare Lewi Pethrus för antisemitiska och rasistiska uttalanden efter Förintelsen, bland annat att judarna själva bar skuld till sina lidanden. Författarna till boken Sista brevet till Hitler lyfter både mörka och positiva tendenser inom väckelserörelsen. Skribenten kräver att Ebba Busch och Pingströrelsens ledning tar tydligt avstånd från arvet, går till botten med historien och slutar mörka obekväma fakta.", "trump": "Folk, ni måste höra det här. Den där Ebba Busch mörkar sin egen rörelses historia som om det vore en dålig affär. Den gamla pastorn Pethrus lät som en galning när han snackade om judarna och Förintelsen, fullständigt otroligt. Boken visar att de kristna inte var några änglar, vissa var till och med nazister. Men de andra var hjältar som sa ifrån. Nu borde Busch erkänna att det är en katastrof och fixa till det. Inget mer mörkande, det är patetiskt!", "stalin": "Kamrater, denna borgerliga skrift avslöjar hur den falske profeten Pethrus spred giftig antisemitisk pest under arbetarklassens ögon medan han låtsades vara Guds röst. Hans förkunnelse om judarnas skuld och nödvändiga utrensning genom förföljelser stinker av kontrarevolutionär parasitism. Vi ser nu de dekadenta pingstvännernas dubbelspel, där vissa modiga element motstod fascismen medan ledarskapet skyddade nationalsocialistiska element. Ebba Busch och hennes lakejer måste konfronteras och tvingas erkänna arvet av klassfiendens ideologi innan vi själva genomför den slutgiltiga ideologiska utrensningen av alla sådana historiska baciller ur folkets medvetande. Inga halvmesyrer tillåts."}, "date": "8 juni, 07:52", "url": "https://arbetet.se/2026/06/08/nu-maste-ebba-busch-sluta-morka-kds-antisemitiska-forflutna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/08071905/busch-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det
