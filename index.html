r. Bygg vackra hus, skapa jobb och stoppa den vansinniga kvotpolitiken som bara gynnar lata bidragstagare. Amerika gör det rätt – stark ekonomi först, inte dessa woke-trädälskare.", "stalin": "Dessa dekadenta naturromantiker försöker dölja sin brist på verklig klasskamp bakom träd och buskar. Jag ser hur de profitthungriga fastighetshyenorna och deras politiska lakejer utnyttjar bostadsbristen för att splittra folket. Vi måste rensa ut alla som sätter igelkottar före arbetarklassen. Endast genom auktoritär planering och folkets järnhand kan både bostäder och natur tvingas samarbeta under partiets ledning."}, "date": "31 augusti, 01:21", "url": "https://www.dagensarena.se/opinion/mp-vill-ha-tatorter-med-bade-gronska-och-jamlika-villkor", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-2026-08-30t151634083-300x157.jpg"}, {"type": "image-right", "heading": "S-kvinna: Jag vill ha kvar tortyrmannen från hemtjänsten i Sverige", "summaries": {"normal": "Socialdemokraten Linn Svansbo anser att den syriske man som filmade när han torterade och förnedrade äldre personer i hemtjänsten ska få stanna i Sverige. I en debatt med Örebropartiets Markus Allard avfärdade hon kritik mot invandringen som rasism och reagerade starkt på att mannen kallades tortyrbabbe. Hon prioriterar integration framför utvisning.", "trump": "Titta på den här galna S-kvinnan Linn Svansbo som vill behålla tortyrsyriern i Sverige! Han kallar gamlingar för apor, duschar dem kalla och skriker Allahu akbar i deras öron, men hon fnissar bara. Typisk vänstervriden identitetspolitiker som hatar folket. Vi behöver inga sådana monster här, folk vet vad som är rätt.", "stalin": "Jag ser hur dessa dekadenta folkförrädare inom socialdemokratin försvarar en tortyrmaskin som förnedrar arbetarklassens åldringar. Att skratta åt brotten och kalla krav på utrensning för rasism visar deras sanna ansikte. Vi måste rensa ut alla sådana klassförrädare som undergräver folkets moral och säkerhet. Inga kompromisser med fienden."}, "date": "31 augusti, 09:18", "url": "https://www.friatider.se/s-kvinna-jag-vill-ha-kvar-tortyrmannen-fran-hemtjansten-i-sverige-0", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-792.jpg"}, {"type": "image-right", "heading": "Är det chic med bredbenta män som vill kontrollera kvinnor?", "summaries": {"normal": "Jessica Eriksson kritiserar SVT:s program Gift vid första ögonkastet XL för att normalisera dominanta män som kontrollerar kvinnor, vilket påminner om hederskulturen hon och en barndomsvän upplevde inom frikyrkan. Hon beskriver hur programmet underhållningsmässigt visar toxiska relationer och ifrågasätter kanalens motiv att spegla extrema åsikter.", "trump": "De svenska statsmedierna på SVT är fullständigt galna. De parar ihop stackars kvinnor med dessa bredbenta, dominerande manosfär-typer som behandlar dem som ägodelar. Patetiskt! Biden-era svaghet har spridit sig till Europa. Vi behöver starka ledare, inte dessa woke-program som lurar folk och förstör samhället. En total skam!", "stalin": "Kamrater, dessa dekadenta folkförtryckare i SVT paraderar öppet reaktionära element som förgiftar massornas medvetande med sin giftiga mansdomination. Jag ser hur de utnyttjar sårade kvinnor för underhållningens skull. En sådan parasitär propaganda kräver omedelbar utrensning ur det offentliga samtalet. Fienden lurar överallt."}, "date": "31 augusti, 07:15", "url": "https://arbetet.se/2026/08/31/ar-det-chic-med-bredbenta-man-som-vill-kontrollera-kvinnors-tankar-svt-gift-vid-forsta-ogonkastet-xl", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31070023/gift-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "En halv miljon arbetslösa – och Kristersson tiger", "summaries": {"normal": "Artikeln kritiserar att statsminister Ulf Kristersson inte nämner de 503 000 arbetslösa i sitt sommartal. Trots löften om skattelättnader och bidragshöjningar fortsätter hushållen att hålla hårt i plånboken. En fackrapport från Handels visar att nästan hälften av medlemmarna inte skulle klara sin ekonomi vid tre månaders arbetslöshet. A-kassan ger låg ersättning och har försämrats över tid.", "trump": "Folk, det här är en katastrof. Den lille svenske statsministern Kristersson står där och tiger som en riktig förlorare medan en halv miljon människor går arbetslösa. Ingen pratar om den riktiga plånboksfrågan. De giriga byråkratblodiglarna har förstört a-kassan så vanligt folk blir fattiga. Patetiskt. Jag fixade bättre ekonomi än så under min tid, tro mig.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna låter arbetarna svälta i sin moderata lågkonjunktur. Jag betraktar med avsky hur 503 000 sovjetmedborgare – förlåt, svenskar – lämnas åt sitt öde medan ledaren tiger. Denna utarmade a-kassa är ett verktyg för utsugning. Fattigdom föder desperation, och desperation föder utrensning av de dekadenta parasiter som orsakat detta elände. Skrattretande tragiskt."}, "date": "31 augusti, 06:49", "url": "https://arbetet.se/2026/08/31/503-000-arbetslosa-och-ulf-kristersson-tiger-om-den-storsta-planboksfragan-akassa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31064859/akassa-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "S: Sälj inte ut sjukvården i Stockholm", "summaries": {"normal": "Socialdemokraterna varnar för att Moderaternas planer på skattesänkningar och utförsäljningar av sjukhus i Region Stockholm hotar 2500 sjuksköterskejobb och leder till nedskärningar. De lyfter fram Karolinska som exempel på den svenska välfärdsmodellen och föreslår istället inflationssäkring, 1000 fler läkare och fast läkarkontakt för alla.", "trump": "Lyssnar ni på de här socialistiska förlorarna i Sverige? De vill ha mer byråkrati, fler läkare på statens bekostnad och skyller allt på oss smarta affärsmän. Under mitt förra presidentskap byggde vi den bästa ekonomin någonsin – inte som Sleepy Joe. Sälj ut det ineffektiva systemet, sparkas ut de giriga fackpamparna och gör vården stor igen!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom högern planerar att sälja ut folkets sjukvård till parasiterande spekulanter. Jag ser deras mörkläggning och ofinansierade löften som ett hot mot kollektivet. Vi måste rensa ut dessa dekadenta element innan de förvandlar akutsjukhus till profitmaskiner. Arbetarnas hälsa tillhör staten, inte giriga hyenor."}, "date": "31 augusti, 09:41", "url": "https://www.di.se/debatt/s-salj-inte-ut-sjukvarden-i-stockholm", "imageUrl": "https://static.bonniernews.se/ba/21de4113-65af-445a-8630-3426d63cf8bd.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "IVF-kliniken Eliva utreds på nytt – kan förlora tillståndet", "summaries": {"normal": "IVF-kliniken Eliva utreds på nytt av Ivo efter Kalla faktas avslöjanden om ovetenskapliga metoder och missförhållanden. Myndigheten granskar nu klinikens tillstånd för hantering av mänsklig vävnad, medan grundaren Farnosh Sørensens läkarlegitimation redan utreds. Kliniken tar emot patienter trots nya anmälningar och Ivo planerar inspektion på plats.", "trump": "De här galna svenska läkarna på Eliva är en total katastrof, folk! De leker Gud med embryon, tappar bort dem och säljer skojiga metoder som inte funkar. Ivo borde stänga ner den här clownkliniken direkt. Under Biden skulle de ha fortsatt, men nu fixar vi det – ingen mer vänsterbluff i fertilitetsbranschen, tro mig!", "stalin": "Dessa dekadenta kapitalistiska profitörer leker med mänskligt liv som om det vore en borgerlig leksak. Jag ser fiendens hand i varje försvunnet embryo och varje lögnaktig journal. Den som sviker patienterna sviker folket. En sådan klinik är en fiende till ordningen och förtjänar att krossas under statens järnhand. Inga undantag."}, "date": "31 augusti, 06:22", "url": "https://www.tv4.se/artikel/6fvL6ylVWI0dCer6xl1m7z/ivf-kliniken-eliva-utreds-pa-nytt-kan-foerlora-tillstandet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fw4HTLda652cKssCNFdfGu%2Ffda8a4a039c19ddcc937adab5f2392c6%2F30-ivf-klinik-granskning-webb.png&width=120"}, {"type": "image-right", "heading": "USA till attack – första gången på en månad", "summaries": {"normal": "Den amerikanska militären har genomfört en attack mot iranska avfyrningsramper i Hormuzsundet, den första på över en månad. Explosioner hördes vid ön Larak. Enligt uppgifter var Iran på väg att lägga ut nya minor. Iran rapporterar döda soldater och civila samt lovar hämnd. USA har inte bekräftat attacken officiellt.", "trump": "Folket, vi har just satt stopp för de galna mullornas minor i Hormuzsundet. Boom! Första gången på en månad och redan vinner vi stort igen. Biden lämnade en sådan röra, men nu vakar vi över handelsflödet som riktiga vinnare. Iran gråter som förlorare – patetiskt!", "stalin": "Kamrater, se hur de imperialistiska banditer från Washington återigen blottar sin rädsla genom att bomba iranska positioner. Deras så kallade frihet är bara en mask för att kväva folkets vilja. Vi ler i skuggorna åt deras paranoia. Straffet kommer, som alltid, från historien själv."}, "date": "31 augusti, 06:10", "url": "https://www.tv4.se/artikel/58481qzfZcpDg97k23VXlL/iran-utlovar-haemnd-efter-ny-attack", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl_ElT6mWJb10%2F1e0c6efab9a9aef580055aaebcef70a2%2FFartyg_i_Hormuzsundet_den_5_augusti_i_ar.&width=1024"}, {"type": "image-right", "heading": "Meryem fast i arbetslös­het: ”Som att det är slut med oss”", "summaries": {"normal": "Meryem, en andra generationens invandrare över 55 år, kämpar med långvarig arbetslöshet som lett till depression, utmattning och fysiska besvär. Hon känner sig oönskad på arbetsmarknaden, kritiserar Rusta och matcha-programmen samt bristande kontakter. Hon föreslår återinförande av beredskapsarbeten eller förtidspensionering för att minska både lidande och officiell arbetslöshet.", "trump": "Titta på den här stackars kvinnan, totalt krossad av Bidens katastrofala ekonomi och de woke-marxistiska jobbkvoterna. Sju år av avslag! De globalistiska Rusta och matcha-kretiner och deras föreläsningar är ett skämt. Vi behöver riktiga jobb, inte socialistiska matchningsfabriker. America First betyder att folk som jobbat hårt inte ska kastas på sophögen av de giriga elitparasiterna.", "stalin": "Se hur de profitthungriga klasshyenorna och deras matchningsfabriker förvandlar en lojal arbetare till en utmattad skugga. Detta är den borgerliga statens sanna ansikte – att fördriva tiden mellan rapporter tills depressionen slår klorna i en. Vi måste rensa ut dessa dekadenta system och återupprätta kollektivets plikter. Endast genom ordnad statlig aktivitet kan parasiterna likvideras och folkets kraft återställas."}, "date": "31 augusti, 06:00", "url": "https://arbetet.se/2026/08/31/meryem-ar-fast-i-arbetsloshet-som-att-det-ar-slut-med-oss", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28154251/meryem-tajtareportratt.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Över 930 kraftverksarbetare saknas", "summaries": {"normal": "Över 930 arbetare saknas i Nepal efter översvämningar som drabbat flera vattenkraftsprojekt. Minst 361 har räddats medan räddningsinsatser pågår med grävmaskiner, borrar och luftpumpar i vattenfyllda tunnlar. Fortsatt dåligt väder försvårar arbetet. Kritik riktas mot myndigheterna för långsamma insatser. Experter från Kina och Indien har anlänt för att hjälpa till.", "trump": "Titta på det här katastrofala fiaskot i Nepal, folk. Över 900 stackars arbetare fast i leriga tunnlar medan de inkompetenta byråkraterna fumlar runt med drönare som inte ens hittar en signal. Biden lämnade efter sig ett svagt Amerika som inte leder i räddningsinsatser. Vi skulle ha fixat det på en timme, tro mig. De giriga gröna energihyena har blod på händerna.", "stalin": "Kamrater, se hur de profitthungriga exploaterarna offrar arbetarklassen i sina vattenkraftslöften. Jag betraktar med förakt hur de dekadenta klassfienderna dröjer med räddningen och låter tunnlarna bli gravar. Våra kinesiska och indiska vänner anländer för att stödja kollektivet. Snart rensas de ansvariga ut. Paranoia bland ledarna avslöjar deras svek mot folket."}, "date": "31 augusti, 07:37", "url": "https://www.svt.se/nyheter/utrikes/efter-jordskredet-over-930-tunnelarbetare-saknas-i-nepal", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/653bcfb637341770b8fa311e83d4696ac9e296420ae089bf0b2c26d4a68ebb41"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjänar folkets vrede och evig skam. Ren utrensning behövs."}, "date": "29 augusti, 03:21", "url": "https://samtiden.nu/2026/08/s-vill-styra-sverige-klarar-inte-ens-stockholm", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7239-1280x720.jpg"}, {"type": "image-right", "heading": "Macrons besök stärker anrik försvarspakt", "summaries": {"normal": "Frankrikes president Emmanuel Macron besöker Sverige för att underteckna avtal om köp av fyra franska fregatter till marinen för 40 miljarder kronor. Affären inkluderar avancerat luftvärn och stärker det historiska försvars- och kultursamarbetet mellan länderna. Frankrike köper samtidigt Saab-plan och bidrar med soldater till Natostyrka i Finland. Besöket ses som ett viktigt strategiskt partnerskap.", "trump": "Lysande affär, folk! Macron kommer hit och säljer sina fancy fregatter till Sverige för fyrtio miljarder. Stora, vackra fartyg med det bästa luftvärnet – inte som de woke-generaler som vill ha kvotering och regnbågsflaggor på torpederna. Frankrike och Sverige gör affärer som riktiga ledare, inte som den sömniga Biden-klanen. Fantastiskt, ingen gör det bättre än jag med de här dealerna!", "stalin": "Se hur de dekadenta klassförrädarna i väst klamrar sig fast vid sina fregatter och kärnvapen. Jag betraktar från historiens skugga hur de imperialistiska hyenorna försöker bygga en mur av stål mot det oundvikliga. Luftvärn och plan byts som i en paranoid dans. Men ingen utrensning av svaghet kan rädda dem när folket till sist vaknar och kräver rättvisa."}, "date": "31 augusti, 08:44", "url": "https://www.di.se/ledare/macrons-besok-starker-anrik-forsvarspakt", "imageUrl": "https://static.bonniernews.se/ba/c83e4538-5d60-4cb7-9415-c67fa2ed441d.jpeg?crop=4994%2C2497%2Cx0%2Cy416&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Valdebatt om klimatet i SVT:s Agenda: \"Ansvarsfullt att sänka bränslepriserna\"", "summaries": {"normal": "I SVT:s Agenda debatterade politiker från flera partier klimatmålet, bränslepriser och elektrifiering. Vänsterpartiet och Socialdemokraterna kritiserade regeringen för sänkta skatter och minskad reduktionsplikt. SD och Tidöpartierna försvarade lägre drivmedelspriser som ansvarstagande. Diskussionen handlade om avvägningar mellan ekonomi, industri och miljö.", "trump": "De här svenska clownerna står och gråter över låga bensinpriser som vore det världens största katastrof. Patetiskt! Jag sänkte energipriserna, fick igång ekonomin och skrattade åt de gröna galningarna. Nu har de kört sin trovärdighet i botten med sin identitetspolitik och elbilshysteri. Sverige borde vara vinnare, inte förlorare som de woke-muppetyperna vill.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare grälar om bränslepriser medan folket kämpar. De sviker sina löften och skyller på varandra som ynkliga opportunister. Endast genom kollektiv kraft och utrensning av de profitthungriga hyenorna kan verklig omställning ske. Deras moonwalk mot framtiden är en fars som väcker både löje och vrede hos arbetarklassen."}, "date": "30 augusti, 23:30", "url": "https://riks.se/nyheter/klimatet-debatterades-i-svt-s-agenda", "imageUrl": "https://admin.riks.se/uploads/medium_IMG_3530_512ac00676.jpg"}, {"type": "image-right", "heading": "Nya Tidöbråket: Stark oro för att Ebba Busch ska byta sida", "summaries": {"normal": "Inom Tidö-samarbetet har spänningar uppstått efter att Ebba Busch (KD) öppnat för att stödja Magdalena Andersson som statsminister i ett krisläge. Jimmie Åkesson (SD) ifrågasätter KD:s pålitlighet medan Ulf Kristersson (M) tonar ned bråket och försäkrar att Busch inte kommer att byta sida som Annie Lööf.", "trump": "Folk, ni skulle se det här svenska cirkuset! Den där Busch-kvinnan flörtar med de socialistiska förlorarna medan Åkesson ropar högt. Patetiskt! Kristersson försöker släta över som en svag ledare. De här globalistiska marionetterna och deras identitetspolitiska vansinne skulle aldrig överleva i mitt Amerika. Totalt kaos!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom det borgerliga blocket redan nu gnisslar tänder och förbereder förräderi. Jag betraktar med avsmak hur de profitthungriga hyenorna leker med socialdemokratiska krafter. En utrensning av sådana opålitliga element vore nödvändig för att säkra arbetarklassens framtid. Skrattretande svaghet!"}, "date": "31 augusti, 07:17", "url": "https://www.friatider.se/nya-tidobraket-stark-oro-att-ebba-busch-ska-byta-sida", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-786.jpg"}, {"type": "image-right", "heading": "Magdalena Anderssons frågestund storsågas", "summaries": {"normal": "Magdalena Andersson genomförde en AMA på Reddit under lördagskvällen där hon svarade på 21 av 758 frågor. Samtliga 44 frågor om Chat Control lämnades obesvarade, inklusive den mest uppröstade. En användaranalys visade att hon främst besvarade högst rankade frågor. Efteråt väcktes stark kritik och många uttryckte missnöje med hennes insats.", "trump": "De här svenska socialisterna är patetiska. Andersson gömde sig som en fegis när folket frågade om den fruktansvärda Chat Control-massövervakningen. Hon duckade 44 gånger! Det var en total katastrof, ett fullständigt fiasko. Ingen röstar på sådana undvikande losers. De borde kalla det Sweddits värsta AMA – och det säger en hel del om deras sjuka identitetspolitik.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare duckar när arbetarna kräver svar om övervakning. Fyrtiofyra frågor om Chat Control ignorerades avsiktligt. Sådan feghet avslöjar den sanna naturen hos de profitthungriga hyenorna inom socialdemokratin. En utrensning av sådana undvikande element vore på sin plats. Detta är inget annat än folkförakt i sin renaste form."}, "date": "30 augusti, 22:54", "url": "https://riks.se/nyheter/magdalena-anderssons-fragestund-storsagas", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Copy_of_Soerman_Ledare_2_198ba3fc2a.jpg"}, {"type": "image-full", "heading": "Därför utmanar solkraften nu fossil energi", "summaries": {"normal": "Solkraft har genom kraftigt sänkta kostnader för paneler och batterilagring blivit ett konkurrenskraftigt alternativ till fossil energi globalt. Tekniken är modulär och gynnar särskilt tillväxtekonomier. Trots väderberoende utmanar solkraft nu fossila bränslen ekonomiskt, vilket gör det allt svårare att försvara investeringar i traditionella kraftverk som kräver omfattande infrastruktur och förutsägbara bränslekostnader.", "trump": "Solkraft? De säger att det är billigt nu, fantastiska siffror, 87 procent billigare, det är nästan lika bra som mina hotell-deals! Men lyssna, det är väderberoende. Man vill inte att ljuset slocknar mitt i en viktig affärslunch för att solen går i moln. Vi behöver energi som fungerar när jag knäpper med fingrarna, inte när vädret tillåter. Vi älskar sol, men vi behöver kraft!", "stalin": "Vi har analyserat denna 'solenergi'. En decentraliserad kraftkälla som sprids mellan hushåll och småbolag? Det låter som anarki och sabotage mot statens kontroll! Elektricitet ska flöda från centrala, monumentala verk som lyder under folkets järnhand, inte från väderberoende småpaneler som kan svika oss när partiet som bäst behöver dem. Vi ska industrialisera, inte hoppas på solsken!"}, "date": "30 augusti, 18:45", "url": "https://www.realtid.se/bors-finans/makro/darfor-utmanar-solkraften-nu-fossil-energi", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/solenergi.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Pressen på S-ledaren: ”Jag är rädd – ett väldigt flörtande”", "summaries": {"normal": "Jonas Sjöstedt varnar Magdalena Andersson för att samarbeta med Kristdemokraterna efter valet. Han är orolig för att Socialdemokraterna flörtar med både Centerpartiet och KD istället för att samla den rödgröna oppositionen. Sjöstedt betonar att vallöften som att avskaffa vinstjakten i skolan kräver stöd från Vänsterpartiet. Ebba Busch utesluter inte ett samarbete i undantagsfall.", "trump": "De där svenska socialiststackarna håller på att krascha totalt. Magdalena Andersson flörtar med de kristna högerkillarna som om det vore en skönhetstävling. Patetiskt! Sjöstedt är livrädd för att hans röda dröm ska dö. Hade jag varit där skulle jag säga: gör upp med de riktiga vinnarna istället för att dansa med dessa förlorarliberaler och identitetspolitiska nollor. En katastrof!", "stalin": "Jag ser hur dessa dekadenta klassförrädare inom socialdemokratin flörtar med högerkrafter och sviker arbetarklassen. Det är en farlig utveckling som hotar den sanna folkviljan. Börja forma laget med de progressiva krafterna, annars kommer utrensning av opportunisterna att bli nödvändig. Klimatministerns drömmar är bara tomma ord om inte de verkliga kamraterna styr. Paranoia breder ut sig bland de svaga."}, "date": "31 augusti, 06:09", "url": "https://www.svt.se/nyheter/inrikes/pressen-pa-s-ledaren-jag-ar-radd-ett-valdigt-flortande", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.41/60370f4f38dde139fecea99e2fee417ebb6596fbe5e96bad872f68b621f38748"}, {"type": "image-right", "heading": "Marknaden för populära sparformen är borta", "summaries": {"normal": "För 50 år sedan lanserade Jack Bogle den första indexfonden. Idén hyllas men kritiseras nu eftersom den bygger på att andra gör prisbildning och analys. Passivt ägande dominerar alltmer, särskilt i Sverige där fondsparandet är stort. Artikeln varnar för ökad koncentration, passivt ägande och bristande bolagsstyrning samt föreslår åtgärder för att väga in risker utöver avgifter.", "trump": "Lyssnar ni på det här? Den där Bogle-killen startade en indexfond som alla trodde var galen, och nu har den slukat halva marknaden. Fantastiskt, men vänta – nu är det bara ett gäng passiva, sömniga investerare kvar som låter några få megabolag styra showen. Det är en total röra, folk. De billigaste vinner, men vad äger ni egentligen? En katastrof, tro mig. Vi behöver vinnare, inte följare.", "stalin": "Kamrater, se hur de profitthungriga fondhyenorna har låtit den passiva maskinen växa sig stark. Jag betraktar från historien hur koncentrationen till ett fåtal bolag och de mekaniska indexkommittéerna ersätter verklig analys. Detta är dekadent spekulation i sin renaste form. Vi måste rensa ut denna farliga likgiltighet i sparandet innan den kväver hela det ekonomiska kollektivet. Det är en parasitär utveckling som måste stoppas."}, "date": "31 augusti, 07:31", "url": "https://www.di.se/debatt/indexfonden-50-ar-men-marknaden-for-den-ar-borta", "imageUrl": "https://static.bonniernews.se/ba/f253291e-1f19-4ef8-b5de-87864084daf5.png?crop=4056%2C2028%2Cx0%2Cy93&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kommer muslimerna avgöra valet?", "summaries": {"normal": "Artikeln diskuterar hur muslimska väljares röstdeltagande kan bli avgörande i det svenska valet. Oppositionen närmar sig Tidöpartierna. Enligt Novus stöder 85 procent av muslimska väljare S, V och MP, med Socialdemokraterna som populärast. Lågt valdeltagande bland utrikes födda ger mobiliseringspotential. Exempel på kampanjer och historiska fall av röstmobilisering nämns, vilket kan påverka utfallet.", "trump": "Folk, det här är en total katastrof för Sverige. De radikala vänstermuslimerna röstar som galningar för de värsta förlorarna – Sleepy S och hans kommunistkompisar – medan riktiga svenskar sover. De riggar valet med förkryssade sedlar och moskéaffärer. Om jag var där skulle jag säga: vakna upp, annars blir det mer invandring och ingen vinner utom de korrupta globalisterna. Patetiskt!", "stalin": "Kamrater, se hur de borgerliga reaktionärerna darra inför folkets röst. Jag betraktar med förakt hur dessa socialfascister köper lojalitet från de importerade massorna för att klamra sig fast vid makten. En sådan dekadent manipulation förtjänar utrensning. Det är ett ynkligt skådespel som bevisar att klassfienderna aldrig förändras, bara byter mask. Låt dem darra vidare."}, "date": "27 augusti, 07:45", "url": "https://samtiden.nu/2026/08/kommer-muslimerna-avgora-valet", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7234-640x360.jpeg"}, {"type": "image-right", "heading": "ANALYS. ANDREAS UTTERSTRÖM Debatten om Trump som skymmer viktigaste frågan", "summaries": {"normal": "Artikeln analyserar debatten kring Donald Trumps förhandlingsstil, där anhängare lyfter fram hans oförutsägbarhet och framgångar med tullar och hot, medan kritiker pekar på att han ofta backar och ignorerar långsiktiga konsekvenser. Fokus ligger på att diskussionen skymmer de verkliga effekterna av hans agerande.", "trump": "Folk snackar om mig som förhandlare – bäst eller sämst? De missar poängen helt! Jag är en deal-maker som får Nato att betala och Mexiko att vakna. Kritikerna är patetiska förlorare som älskar Biden-kaoset. Madman theory fungerar perfekt, tro mig, ingen gör det bättre än jag. Vinster överallt!", "stalin": "Kamrater, denna dekadenta västerländska cirkus kring förhandlingar avslöjar imperialismens svaghet. Den så kallade ledaren jagar snabba segrar som en paranoid opportunist medan imperiets fiender förbereder sig. Jag ser igenom era lögner. Verkliga resultat kräver järnhand, inte mediaskådespel. Sabotörer lurar alltid i skuggorna."}, "date": "30 augusti, 22:50", "url": "https://www.tv4.se/artikel/497rydrqgmw2eeKLcyRDdU/aer-trump-vaerldens-baesta-eller-saemsta-foerhandlare", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3Hq6QMwZO0JmM3UpMbRsb8%2Fe043cc0fb03e8551e5ac766e3d238ee3%2Futterstrom-bylinebild.jpg&width=1024"}, {"type": "image-full", "heading": "Från labb till elnät: Nu storsatsar oljegiganterna på fusion", "summaries": {"normal": "Kärnfusion lockar nu stora investeringar från oljejättar som Eni, Equinor och Chevron. Med miljarder dollar i privat kapital och tekniska framsteg, såsom Commonwealth Fusion Systems nätanslutningsansökningar, börjar fusion betraktas som en industri snarare än enbart forskning. Utmaningar kring tritiumförsörjning kvarstår, men flera projekt siktar på kommersiell elproduktion inom de kommande årtiondena.", "trump": "Oljegiganterna gör nu det de alltid gör – de vinner! De satsar miljarder på fusion, fantastisk teknik. Inga fler vänsterliberala drömmar om katastrofal solenergi. Vi pratar om riktig kraft, producerad av våra bästa oljebolag. Det är en enorm vinst för America First. Medan de radikala demokraterna pratar, bygger vi framtiden. Fusion? Det blir enormt, kanske det största någonsin, tro mig!", "stalin": "Dessa kapitalister försöker desperat tämja stjärnornas eld för att rädda sina vacklande imperier. De kastar miljarder på 'fusionskraft' likt desperata gamblers. Men minns detta: även om de bygger sina reaktorer, så är tritium en nyckfull tjänare. Om de inte kan kontrollera sitt bränsle i slutna kretslopp, kommer deras projekt att kollapsa likt en dåligt planerad femårsplan. Vi bevakar deras experiment med största misstänksamhet."}, "date": "30 augusti, 06:30", "url": "https://www.realtid.se/it-tech/fran-labb-till-elnat-nu-storsatsar-oljegiganterna-pa-fusion", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/fusion.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "AIK:s nya rekrytering dömd för rån Har flera domar.", "summaries": {"normal": "AIK har värvat 23-årige vänsterbacken Aziz Harabi på ett kontrakt till 2030. Värvningen har väckt starka reaktioner eftersom Harabi som 16-åring dömdes för ett grovt knivrån och senare för andra brott, senast 2024. AIK:s rekryteringschef försvarar beslutet och menar att spelaren har avtjänat sitt straff och förtjänar en nystart.", "trump": "AIK har värvat en dömd rånare till fotbollslaget! Helt otroligt. De säger att han har bra spelförståelse, men han har ju sprungit runt med kniv och rånat tonåringar! Totalt katastrofalt omdöme. Jag har aldrig sett något liknande. I USA ger vi sådana spelare livstid, inte ett mångmiljonkontrakt. Fake news-klubbar som ger kriminella en nystart är en total katastrof!", "stalin": "Kamrater, i Sovjetunionen skickade vi inte rånmördande ungdomar till fotbollsplaner för att utveckla sin bollhantering, vi skickade dem till arbetsläger i Sibirien för kollektivt uppfostrande arbete! AIK:s rekryteringschef uppvisar en farlig borgerlig svaghet. En kontrarevolutionär vänsterback som springer runt med kniv kan omöjligt tjäna staten. Säkerhetstjänsten kommer omedelbart att utreda denna misstänkta värvning."}, "date": "31 augusti, 09:07", "url": "https://samnytt.se/aiks-nya-rekrytering-domd-for-ran", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31070443/harabi-feat.jpg"}, {"type": "image-right", "heading": "Minst åtta döda i färjeolyckan: ”Situationen är allvarlig”", "summaries": {"normal": "En passagerarfärja med 267 personer ombord kapsejsade utanför norra Cypern i svåra väderförhållanden. Minst åtta personer har omkommit och 237 har räddats. Över 20 personer saknas fortfarande. Fartyget har sjunkit till över 500 meters djup. En stor räddningsinsats pågår. Inga uppgifter om drabbade svenskar.", "trump": "Folk, det här är en total katastrof, en riktig båt-fiasco utanför Cypern. Den där usla katamaranen sjönk som en sten efter bara femton minuter, precis som Bidens ekonomi. Åtta döda, tjugo saknade – patetiskt! Men vi har räddat massor, de bästa räddarna, under min ledning skulle det aldrig ha hänt. Sad!", "stalin": "Kamrater, denna tragiska kapsejsning utanför Cypern visar återigen imperialismens förfall och kapitalets likgiltighet inför människoliv. Medan arbetare drunknar i havets djup fortsätter de västerländska parasiterna att ignorera folkets lidande. Jag ser fiendernas svaghet och paranoia. Vårt kollektiva sinne kräver ständig vaksamhet mot sådana olyckor som hotar ordningen."}, "date": "30 augusti, 21:26", "url": "https://www.tv4.se/artikel/35iNoNsAH1F4I1jho5STmZ/faerja-har-kapsejsat-vid-cypern-267-ombord", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6D7R3sXXwGXpuOfPnLWS9e%2F79f7cbc861a6ed3bde74ae794f67bac3%2F30-cypern-webb.jpg&width=120"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att stärka vänsterfalangen. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar gynnar bara högern inom S.", "trump": "Lyssnar ni på de här ynkliga sossarna som gråter över sin egen högersväng? Patetiskt! De vill att unga ska stanna kvar på det sjunkande skeppet istället för att rösta på riktiga alternativ. Miljöpartiets cykelvägshajar och vänsterns fackförrädare är värdelösa. Organisera er? Nej, rösta bort de riktiga förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska avfällingar gråter över sin högersväng som om det vore en olycka. Jag ser hur de profitthungriga klassförrädarna inom partiet förgiftar arbetarnas vilja. Lämna inte skeppet, säger de, medan splittringarna hotar kollektivet. Rensa ut de dekadenta opportunisterna innan de likviderar varje äkta revolutionär anda."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Bankernas kryptering kan snart knäckas", "summaries": {"normal": "Nya beräkningar visar att kvantdatorer kan knäcka dagens bankkryptering tidigare än väntat. Hotet är allvarligt då kriminella redan samlar in krypterad data för framtida dekryptering. Trots att kvantsäkra lösningar finns, saknar 90 procent av systemen skydd. Finanssektorn, inklusive kryptovalutor, står inför en akut och komplex utmaning att uppgradera sin infrastruktur för att möta den snabba tekniska utvecklingen.", "trump": "Hör på här: bankernas kryptering är ett totalt fiasko, en katastrof! Kvantdatorer kommer och knäcker allt snabbare än någon trott. Det är en otrygg röra! De samlar in data nu, stjäl våra hemligheter – mycket orättvist. Vi måste bygga den starkaste säkerheten, den bästa någonsin. Banker som inte säkrar upp nu? Ni får sparken! Vi ska göra det säkert, vi ska vinna!", "stalin": "Dessa liberala bankirer har försummat folkets säkerhet. De tillåter att deras dekadenta kryptering knäcks av kvantdatorer som om det vore en barnlek. De har inte skyddat en enda rubel! Att 90 procent av systemen är sårbara är ett bevis på inkompetens. Vi kommer att arkivera varje läckt transaktion för framtida utrensningar. I min stat vore sådana IT-chefer redan historiska fotnoter i en källare."}, "date": "29 augusti, 23:00", "url": "https://www.realtid.se/it-tech/bankernas-kryptering-kan-snart-knackas", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/kvantdator.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Gissa låttexten och gå på Rockbjörnen", "summaries": {"normal": "Radio Aftonbladet lanserar tävlingen Rockbjörnen gestaltad där deltagare ska gissa översatta låttexter för att vinna biljetter till Rockbjörnen på Gröna Lund den 16 september. För att delta skickar man in en motivering via mejl eller sociala medier. Vinnare kontaktas i direktsändning under morgonsändningarna.", "trump": "De falska nyheterna pratar om Rockbjörnen och låttexter, men jag vet att ingen kan översätta texter bättre än jag, tro mig. Radio Aftonbladet delar ut biljetter i Stockholm, totalt fejk, men ändå smart! Skicka in era bidrag nu, annars blir det en total katastrof. Ingen vinner som vi vinner, det kan jag lova er!", "stalin": "Radion i Stockholm ägnar sig åt dekadenta gissningslekar om bourgeoisiens poptexter i stället för produktivt samhällsarbete. Vi har granskat dessa så kallade prisbiljetter till Gröna Lund. Den som inte kan identifiera den nominerade artisten under morgonsändningen kommer omedelbart att omplaceras till mer krävande uppgifter i de norra regionerna. Kamrat Letic och Hjertén står under ständig uppsikt."}, "date": "31 augusti, 09:44", "url": "https://www.aftonbladet.se/nyheter/a/0pkMB6/vinn-rockbjornen-biljetter", "imageUrl": "https://akamai.vgc.no/v2/images/edeb1390-3e9e-3f73-afc1-4c9211e46f65?fit=crop&format=auto&w=720&s=1a1aca7d0d705a1a6fdad9eaf02ccdf868f4c54f"}, {"type": "image-full", "heading": "Ny app ska skydda barn i sociala medier", "summaries": {"normal": "Integritetsskyddsmyndigheten lanserar appen Fantomapp för att hjälpa barn och föräldrar i sociala medier. Appen, framtagen av franska CNIL tillsammans med barn, erbjuder guider mot nätmobbning, råd om oönskade kontaktförsök, verktyg för att blurra bilder samt lösenordstester för att öka tryggheten på nätet.", "trump": "Sverige kopierar nu min fantastiska, enorma framgång och släpper en fransk app för barn på sociala medier. De kallar den Fantomapp, helt otroligt. Den stoppar fejkade kontakter, skyddar bilder och testar lösenord. Väldigt smart! Till och med den radikala vänstern måste erkänna att detta är ett otroligt drag för säkerheten. Helt fantastiskt!", "stalin": "Sverige tvingas nu övervaka sina barns digitala korrespondens genom en fransk app. Ett klokt erkännskap av statens nödvändiga kontroll över medborgarnas säkerhet. Genom att blockera illojala kontakter och granska lösenord rensas elementen ut. Vi noterar detta framsteg i kampen mot det digitala kaoset med tillfredsställelse. Säkerheten kräver absolut vaksamhet."}, "date": "31 augusti, 07:17", "url": "https://www.gp.se/nyheter/sverige/ny-app-ska-skydda-barn-i-sociala-medier.c91561fa-831c-5f28-90c4-d3730dc7ffc1", "imageUrl": "https://www.gp.se/images/article/c91561fa-831c-5f28-90c4-d3730dc7ffc1/images/14MLVIpnKqMkF7WHiuWDyhTD-ew4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Iran: Svarat på USA:s attacker", "summaries": {"normal": "Efter att USA slagit mot iranska avfyrningsramper vid Hormuzsundet har det iranska revolutionsgardet attackerat amerikanska militära mål i Jordanien och Förenade arabemiraten med robotar och drönare. Jordaniens luftförsvar stoppade åtta robotar, medan ett oljefartyg fattat eld efter att ha gått på minor. USA:s president Donald Trump har publicerat en AI-film om en attack mot ön Kharg.", "trump": "Jag slog till mot deras ramper och plötsligt skickar de futtiga drönare som skrytsamma förlorare! Jordanien stoppade skräpet direkt. Sedan lade jag upp den absolut mäktigaste AI-filmen någonsin där ön Kharg sprängs i småbitar – helt fantastiskt! De försöker leka tuffa, men jag krossar dem totalt medan jag svingar golfklubban. Ingen sätter sig på oss!", "stalin": "Efter det imperialistiska USA-anfallet har de iranska revolutionärerna svarat med välförtjänta motangrepp mot fiendens baser. Den så kallade presidenten i Washington drömmer om förstörelse genom artificiella filmer likt borgerliga illusioner. Statens maskineri noterar att sabotage till havs och brinnande oljetankers avslöjar kapitalismens totala förfall. Våra organ har beordrat skärpt vaksamhet mot alla subversiva element."}, "date": "31 augusti, 07:15", "url": "https://www.gp.se/nyheter/varlden/iran-svarat-pa-usas-attacker.8f230ca1-8b03-5e77-b7de-5a7b4bd5bf6f", "imageUrl": "https://www.gp.se/images/article/8f230ca1-8b03-5e77-b7de-5a7b4bd5bf6f/images/1BDx1vAjJr2874Sbx9YZWt3f5Nko-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Efter USA gripande av Maduro – Trump tar kontroll över 65 miljarder fat venezuelansk olja", "summaries": {"normal": "USA har gripit Venezuelas president Nicolás Maduro och slutit ett historiskt avtal med interimpresident Delcy Rodríguez. Avtalet ger amerikanska intressen majoritetskontroll över 65 miljarder fat olja. Uppgörelsen möts av hård kritik internt i Venezuela, där politiker och demonstranter anklagar regeringen för förräderi och plundring, samtidigt som juridiska oklarheter kring avtalets giltighet kvarstår.", "trump": "Vi har gjort det absolut största, mest fantastiska oljeavtalet i världshistorien! Efter att vi snällt plockat in Maduro har vi säkrat över 65 miljarder fat underbar venezuelansk olja. Radikala socialister stal våra tillgångar en gång i tiden, men nu tar vi tillbaka det vi äger. Bensinpriserna ska ner och America First regerar igen, tro mig!", "stalin": "Den socialistiska statens fiender i Venezuela har förrått folket genom att sälja dess ädla naturtillgångar till de amerikanska imperialisterna. Detta ynkliga agerande av den så kallade interimregeringen visar att svaga ledare oundvikligen faller för kapitalismens lockelser. Vi noterar detta förräderi i våra arkiv; de ansvariga för denna kapitalistiska plundring kommer att skärskådas grundligt."}, "date": "31 augusti, 08:00", "url": "https://samnytt.se/efter-usa-gripande-av-maduro-trump-tar-kontroll-over-65-miljarder-fat-venezuelansk-olja", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/30131801/usa-venezuela-oljeavtal-2.jpg"}, {"type": "text", "heading": "Valfondens mål nått – men insamlingen fortsätter", "summaries": {"normal": "Kommunistiska Partiets valfond har uppnått sitt mål på 600 000 kronor och ligger nu på 709 000 kronor. Insamlingen fortsätter mot nya målet 800 000 kronor. Partisekreterare Filip Astvald tackar bidragsgivarna och betonar att pengarna finansierar allt valmaterial eftersom partiet inte tar emot offentliga bidrag. Verksamheten efter valet ska stärka organisationen.", "trump": "Folk ger sina surt förvärvade slantar till kommunisterna – otroligt! De har redan passerat 600 000 och siktar på 800 000. Patetiska röda parasiter som samlar in som galna medan riktiga amerikaner betalar skatt till Bidens vansinniga gröna deal. Men hey, låt dem fortsätta, ju mer de samlar desto tydligare blir det hur desperata de är. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom borgarklassen skrattar säkert åt att arbetarna frivilligt fyller valfonden. Jag ser det som en varning. Vi har nått målet men fortsätter. Efter valdagen måste varje kontakt följas upp med järnhand. Inga halvmesyrer. Den som sviker kollektivet förtjänar utrensning. Revolutionen sover aldrig."}, "date": "28 augusti, 14:19", "url": "https://proletaren.se/artikel/valfondens-mal-natt-men-insamlingen-fortsatter"}, {"type": "image-right", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Vänsterpartiet anklagas för att ha ingått en överenskommelse med representanter för den palestinska myndigheten för att ge dem inflytande över svenska vallistor. Expressen och SvD har avslöjat kontakter med palestinska nätverk kopplade till PLO och Fatah, inklusive brev till dömda terrorister och kandidater med Hamas-sympatier. Socialdemokraterna har inte kommenterat uppgifterna.", "trump": "Titta på det här! Vänsterpartiet, de värsta förlorarna, har blivit helt infiltrerade av palestinska terrorvänner och främmande makter. De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiskt! Media tiger som vanligt när det gäller vänstern. Om de kommer in i Rosenbad blir det en total katastrof för Sverige. Fake news överallt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterförrädare som låter främmande element från Palestina tränga in i partiets hjärta. De omfamnar terrorister och döljer sin svaghet bakom lögnaktiga förbund. Kamraterna i Socialdemokraterna tiger – typiskt opportunistiskt. Infiltration är ett hot mot folkets enhet. Renhet i leden eller döden för de opålitliga!"}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-640x360.jpeg"}, {"type": "image-right", "heading": "Lappland Guldprospektering: ”En bred guldträff”", "summaries": {"normal": "Lappland Guldprospektering har slutrapporterat vårens borrprogram vid Nya Gilleberget. Ett av fyra borrhål gav en bred guldträff på 28 meter, vilket överträffade förväntningarna. Även elva guldförande stenblock har hittats i området. Bolaget planerar nu två nya borrhål under hösten för att undersöka berggrunden vidare.", "trump": "Lappland Guldprospektering hittade enormt guld i Sverige! Sjukt bra! Många säger att jag har den bästa guldnosen. De borrade fyra hål, ett var fantastiskt, helt otroligt brett! De hittade till och med gigantiska stenblock med guld. Mycket bättre än fake news-medierna någonsin kan förstå. Vi ska gräva, vi ska vinna!", "stalin": "Lappland Guldprospektering har grävt fram guld ur den svenska jorden. En borrkärna var bred och storslagen, men tre visade absolut ingenting. Misstänksamt! Arbetarna på fältet måste gräva djupare och snabbare för fosterlandets ära. Den som misslyckas med att finna ädelmetaller skickas omedelbart till Sibirien för omkolonisering."}, "date": "31 augusti, 08:55", "url": "https://www.affarsvarlden.se/artikel/lappland-guldprospektering-en-bred-guldtraff", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/09/lappland_borrkarna-400x300.jpg"}, {"type": "image-full", "heading": "Chavister protesterar mot Trumps oljeavtal", "summaries": {"normal": "Chavister och vänsteraktivister demonstrerade i Caracas i lördags i protest mot det nya oljeavtalet mellan USA och Venezuelas interimsregering. Demonstranterna krävde folkomröstning, att Nicolás Maduro friges och ett stopp för USA:s närvaro. Samtidigt finns en bredare oro kring bristen på insyn och kontroll över landets oljetillgångar.", "trump": "De här radikala vänstermänniskorna i Venezuela är helt desperata nu! De protesterar mot mitt fantastiska oljeavtal – ett enormt, vackert avtal som jag fixade. De skriker med sina små flaggor, men de förstår ingenting om affärer. Vi säkrar energin på ett sätt som ingen annan kan, total suveränitet, och de bara gråter. Sjukt och sorgligt!", "stalin": "Dessa så kallade demonstranter på gatorna i Caracas visar prov på farlig ideologisk vacklan och bristande disciplin mot statens fasta vilja. En kontrarevolutionär pöbel som kräver folkomröstningar och skriker om olja förtjänar endast ett kort samtal med säkerhetstjänsten. Även i Venezuela måste Folkets järnhand krossa imperialismens lakejer och upprorets frön omedelbart."}, "date": "30 augusti, 16:34", "url": "https://kvartal.se/nyheter/artiklar/chavister-protesterar-mot-trumps-oljeavtal/cG9zdDoxNzg0MDE", "imageUrl": "https://images.kvartal.se/2026/08/6973fa3c-venezuela.webp"}, {"type": "image-full", "heading": "Maria, 22, sköts ihjäl på rejvet – utreder terror", "summaries": {"normal": "Under en technofestival i schweiziska Aarau sköts 22-åriga italienska servitrisen Maria Spinelli ihjäl på lördagsnatten. Fem andra personer skadades i skjutningen, som ägde rum när festivalen höll på att avrundas. Schweizisk polis söker efter en eller flera gärningsmän och utreder flera möjliga motiv, inklusive terrorism och slumpmässig masskjutning. Italiens premiärminister Giorgia Meloni har uttryckt sina kondoleanser.", "trump": "Väldigt tragiskt i Schweiz, helt makalöst dåligt! En ung kvinna mördades på en så kallad technofestival. Jag har sagt det förfärligt många gånger, gränser och säkerhet måste skötas! Nu letar de efter skytten över hela landet. Ingen greps direkt, totalt kaos. Min vän Giorgia Meloni är förtvivlad. Vi måste få ett stopp på det här, och det genast!", "stalin": "Ett förfärligt virrvarr av bourgeoisins dekadenta technofester i det så kallade neutrala Schweiz har krävt ett ungt liv och skadat fem andra. Staten tolererar inte detta laglösa vilda västern-fasoner på en hästkapplöpningsbana! Våra säkerhetsorgan skulle ha rensat upp bland dessa misstänkta element och vapengömmor på några sekunder. Fullständig klarhet och skärpt kontroll krävs omedelbart av ordningsmakten!"}, "date": "31 augusti, 09:19", "url": "https://www.aftonbladet.se/nyheter/a/Gxq4k9/festivalen-i-schweiz-maria-22-skots-ihjal", "imageUrl": "https://akamai.vgc.no/v2/images/6907c83f-3469-3a93-8026-65277497a08a?fit=crop&format=auto&w=1440&s=ddc5f5a4e26c1168c423dfd12355721252eb50ba"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren ser bidragshöjningar som välkomna men inte socialistiska och uppmanar Socialdemokraterna och Vänsterpartiet att presentera konkreta förslag om ägande och makt på jobbet.", "trump": "Folk, det här är så patetiskt. De röda förlorarna babblar om barnbidrag som vore det socialism. Patetiska! De vågar inte röra vid den riktiga grejen – vem som styr på fabrikerna. De triangulerar sig rakt ner i avgrunden medan jag byggde den starkaste ekonomin i världshistorien. Sad losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare gömmer sig bakom barnbidrag och kallar det socialism. Jag betraktar deras feghet med förakt. Var är löftena om att rensa ut de profitthungriga parasiter som styr arbetsplatserna? Ekonomisk demokrati får inte reduceras till tomma fraser i partiprogram. Den som sviker arbetarna förtjänar utrensning ur historien."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "Elmopedsfiaskot i Ghana började med Per Bolund", "summaries": {"normal": "Svenska staten har satsat 109 miljoner kronor på ett klimatprojekt med elmopeder i Ghana via Energimyndigheten. Enligt uppgifter är resultatet dock noll moped i drift. Både regeringen och oppositionen kritiserar nu varandra för projektet, som initierades av S-regeringen och Per Bolund år 2021.", "trump": "Sverige slösade bort över hundra miljoner på fantom-mopedprojekt i Ghana! Noll elmopeder på gatorna. En total katastrof signerad radikala miljöpartister som Per Bolund. Det är så det går när man jagar fejkade klimatmål istället för att bygga starka ekonomier. Helt otroligt inkompetent, en riktig sorgehistoria för skattebetalarna!", "stalin": "Ett storskaligt sabotage mot statens resurser! 109 miljoner kronor har slösats på spök-mopeder i Ghana utan att en enda maskin rullat. Den ideologiska fumligheten under Per Bolunds ledning visar att elementen i apparaten saknar disciplin. Sådana misstag tolereras icke; dags för en grundlig utrensning bland ansvariga byråkrater."}, "date": "31 augusti, 08:52", "url": "https://www.affarsvarlden.se/artikel/elmopedsfiaskot-i-ghana-borjade-med-per-bolund"}, {"type": "image-right", "heading": "Det finns inget fredsparti i riksdagen", "summaries": {"normal": "Artikeln konstaterar att inget parti i Sveriges riksdag konsekvent driver en politik för fred, nedrustning och militär självständighet. Författaren kritiserar Natomedlemskapet, DCA-avtalet och västvärldens hantering av konflikter som Gaza, och efterlyser en stark fredsrörelse utanför riksdagen som kan utmana den rådande militaristiska riktningen.", "trump": "Folk, tro mig, Sverige har blivit en total katastrof. De slängde sin fina alliansfrihet i soporna för att springa in i min Nato – som jag förresten gjorde stark igen – och nu är de bara en bricka för de globalistiska krigshökarna. Inget fredsparti? Patetiskt. Era dekadenta Nato-lakejer är svaga och patetiska, de älskar krig mer än handel. Gör Sverige great again och kom ut därifrån!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det svenska riksdagen har sålt ut sin så kallade neutralitet till de giriga hyenorna i Nato. Jag ler ironiskt från historien när de imperialistiska parasiterna byter självständighet mot baser och avtal som gör dem till måltavlor. Ingen äkta fredskraft finns. Det är upp till en sann folkrörelse att rensa ut dessa förrädare och återta kontrollen över statens intressen."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/50934", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kamal-kronika-768x432.png"}, {"type": "image-right", "heading": "Bostadsbrist och skenande hyror", "summaries": {"normal": "Sverige har en allvarlig bostadsbrist som förvärras av att bostäder ses som handelsvaror istället för en mänsklig rättighet. Sedan 2011 ska kommunala bostadsbolag drivas affärsmässigt. Hyresgästföreningen beräknar ett underskott på 110 000 bostäder. Nybyggda lägenheter har höga hyror som många inte har råd med, vilket leder till tomma lägenheter trots köer till äldre bestånd med lägre hyror.", "trump": "Folk, ni skulle se det här svenska bostadskaoset – en total katastrof! De giriga socialistiska hyreshöjningsfanatikerna har förvandlat hem till Wall Street-spektakel. Hyrorna skenar som en galen elbil, 13 procent upp på ett år! De byggde fel, de styrde fel, och nu har de tomma lyxlägenheter medan folket lider. Patetiskt! Men jag fixar sånt här – vi gör Amerika (och kanske till och med Sverige) bostadsgreat igen.", "stalin": "Kamrater, se hur de profitthungriga hyenorna förvandlar bostäder till bytesvaror och driver ut arbetarklassen ur sina hem. Jag betraktar med avsky denna dekadenta marknadsteater som skapar 110 000 saknade boningar och skenande hyror. Det är klassfiendens logik. En sann folkstat skulle likvidera dessa parasiterande spekulanter och återställa bostaden som en rättighet för massorna. Fienden sover aldrig."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsbrist-och-skenande-hyror", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/03/DSC_0137-scaled-e1784716375357-768x433.jpg"}, {"type": "image-right", "heading": "”Busch kommer inte att göra en Annie Lööf”", "summaries": {"normal": "Ulf Kristersson tonar ner spänningen mellan Ebba Busch och Jimmie Åkesson efter den senares kritik. Han försäkrar att Busch inte kommer att svika Tidöavtalet som Annie Lööf gjorde 2018. Kristersson beskriver relationen som en blandning av kramar och kiv under valrörelsen men känner sig trygg i samarbetet.", "trump": "De här svenska politikerna beter sig som ett gäng hysteriska vänsterextremister i en dålig realityshow. Ebba Busch skulle aldrig göra en Annie Lööf, det är patetiskt att ens fråga. Mitt folk vinner stort, precis som jag gjorde 2024 efter den katastrofala Biden-eran. Ta en kopp kaffe och sluta gnälla, losers.", "stalin": "Dessa dekadenta klassförrädare inom den borgerliga apparaten ägnar sig åt ynkligt kivande medan folket lider. Jag betraktar deras falska enighet med kallt förakt. Inga plötsliga sidbyten får tillåtas, annars krävs utrensning av alla opålitliga element. Kamrater, en sådan svaghet förtjänar endast hån och förintelse."}, "date": "30 augusti, 20:40", "url": "https://www.svt.se/nyheter/inrikes/kristersson-kommer-inte-att-gora-en-annie-loof", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.35/0.43/52a0ee667e3a095a1fb7f70e3d3e2bfbfa35addfe9594988bedae78c5abc054e"}, {"type": "image-right", "heading": "Oljan stiger – börserna pekar nedåt", "summaries": {"normal": "Stockholmsbörsen väntas inleda måndagen svagt efter nedgångar på Wall Street. Brentoljan stiger med 3 procent efter att USA genomfört attacker mot avfyrningsramper i Iran. Kina har släppt ett inköpschefsindex för industrin som var högre än väntat. Flera bolag, däribland Academedia och Mycronic, har presenterat nya rapporter och mål.", "trump": "Börserna faller för att svaga ledare inte har koll på läget, men min olja i USA stiger – precis som den ska, enorma siffror! Iran behövde en ordentlig smäll, och vi fixade det, väldigt snabbt och väldigt kraftfullt. Kina försöker fuska till sig bättre industrisiffror, men det lurar ingen. Academedia och Mycronic levererar i alla fall, till skillnad från Fake News!", "stalin": "De dekadenta börserna i väst vacklar under tyngden av sitt eget kapitalistiska förfall, medan våra ärorika bomber i Iran sänder ett nödvändigt budskap om disciplin. Kinas byråkrater kämpar på med sina index. Vi noterar med tillfredsställelse att Academedia ökar sin produktion; varje medborgare måste fostras rätt. Avvikelser tolereras icke."}, "date": "31 augusti, 08:46", "url": "https://www.affarsvarlden.se/artikel/oljan-stiger-borserna-pekar-nedat", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdlsCSFJlaQjtc-nh-400x247.jpg"}, {"type": "image-full", "heading": "USA:s militärtoppar vill trappa ner Irankriget", "summaries": {"normal": "USA:s högsta militära chefer varnar försvarsminister Pete Hegseth för att de storskaliga operationerna mot Iran är ohållbara. I ett hemligstämplat underlag motsätter sig befälhavare vidare insatser i Mellanöstern eftersom det riskerar att försvaga landets förmåga att möta andra hot efter sex månaders krig och över 50 000 soldater i beredskap.", "trump": "Generenerna gråter till min försvarsminister! De har haft femtiotusen soldater i sanden och skickat båtar hit och dit i sex månader. Löjligt! Våra styrkor är fantastiska, absolut bäst i världen, men till och med militären fattar att det här var för mycket och för länge. Vi fokuserar på America First, inte eviga krig!", "stalin": "Dessa svaga generaler darrar inför en liten ansträngning i öknen! Femtio tusen soldater i beredskap och de klagar över att det är 'för länge'. Om de inte kan lyda utan att gråta till försvarsministern över ett hemligt papper, vet vi exakt var sommarstugan i Sibirien ligger för sådant bristande fosterlandssinne!"}, "date": "30 augusti, 15:01", "url": "https://kvartal.se/nyheter/artiklar/usas-militartoppar-vill-trappa-ner-irankriget/cG9zdDoxNzgzNDM", "imageUrl": "https://images.kvartal.se/2026/08/f7ca198a-hegseth.webp"}, {"type": "image-right", "heading": "S-politikern vill ha kvar syriern som plågade pensionärer", "summaries": {"normal": "I en uppmärksammad Youtubedebatt mellan Örebropartiets ledare Markus Allard och S-politikern Linn Svansbo diskuterades ett fall där en syrisk hemtjänstman dömts för att ha plågat äldre i Örebro. Allard krävde utvisning av mannen, medan Svansbo ansåg att grundproblemet är ekonomisk ojämlikhet och bekräftade att hon vill ha kvar mannen i landet.", "trump": "Sverige har totala problem, fullkomliga katastrofer! Den här radikala socialdemokraten, en riktigt svag ledare, vill ha kvar en hemsk person som plågade äldre pensionärer i landet. Oacceptabelt! Markus Allard gjorde ett starkt jobb, fantastiska siffror på Youtube, över 300 000 visningar! Vi bygger starka gränser i USA, vi släpper aldrig in sådant vansinne. Sorgligt!", "stalin": "Kamrater, situationen i Sverige visar på den totala kollapsen hos de borgerliga institutionerna när en funktionär öppet försvarar samhällsomstörtande element som plågar de äldre. Detta är ett avsteg från sund disciplin! Om denna händelse hade utspelat sig under min ledning hade varken politikern eller förövaren sluppit undan ett mycket obligatoriskt och långvarigt besök i Sibirien!"}, "date": "31 augusti, 07:00", "url": "https://samnytt.se/s-politikern-vill-ha-kvar-syriern-som-plagade-pensionarer", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/30234506/artikelhuvudbild-1-394.jpg"}, {"type": "image-full", "heading": "USA attackerar Iran igen – explosioner vid Hormuz", "summaries": {"normal": "Amerikanska styrkor har genomfört flyganfall mot två iranska avfyrningsramper på ön Larak vid Hormuzsundet efter uppgifter om att Iran planerade att lägga ut nya sjöminer. Det är USA:s första anfall mot iranska mål sedan i juli. Irans revolutionsgarde hotar med militär och ekonomisk hämnd och uppger att flera har dödats i attacken.", "trump": "Jag sa till dem att sluta med minorna, och boom! Våra fantastiska styrkor slog ut deras avfyrningsramper på Larak-ön blixtsnabbt. Det här kallas för att göra affärer, och min ekonomiska press biter hårt på regimen. De försökte leka tuffa i Hormuzsundet, men vi accepterar inte nonsens. De gråter fake news, men vi skyddar handeln!", "stalin": "De iranska lakejerna misslyckades med att säkra farleden och drog på sig den amerikanska imperialismens vrede vid Larak-ön. Statsapparaten konstaterar att bristande disciplin och militära misstag leder till förintelse. Vi noterar att bourgeoisins provokationer besvaras med blod, och sabotage mot statens sjöfart ska stävjas med maximalt straff och absolut kontroll."}, "date": "31 augusti, 05:55", "url": "https://www.gp.se/nyheter/varlden/usa-attackerar-iran-igen-explosioner-vid-hormuz.24a71587-129a-518d-8341-a6fa08cf4d43", "imageUrl": "https://www.gp.se/images/article/24a71587-129a-518d-8341-a6fa08cf4d43/images/16N9XtqARn5jrbd7yccFNmUIR-cM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Busch och Åkesson fikade i Sölvesborg", "summaries": {"normal": "Efter hård kritik från Jimmie Åkesson åkte Ebba Busch till Sölvesborg för att fika och diskutera. Partiledarna åt sockerkaka och kom överens om att fortsätta samarbeta i det blågula laget efter nästa val, trots tidigare meningsskiljaktigheter om Magdalena Andersson.", "trump": "Ebba drack kaffe och åt en enorm, fantastisk sockerkaka med Jimmie i Sölvesborg efter att han kallade henne falsk! Alla pratar om det. De sa att allt är bra nu, total enighet för det blågula laget. Men låt mig säga er, den där Magdalena är en katastrof, en riktig rödgrön roulette. Helt sjukt!", "stalin": "Dessa svenska borgerliga politiker dricker kaffe och äter sockerkaka som om statens framtid stod på spel vid ett fikabord. De lovar varandra fyra år till vid makten, men historien har lärt oss att revisionister som inte rensas ut i tid alltid förråder revolutionen. Vi övervakar dem noga."}, "date": "30 augusti, 14:02", "url": "https://kvartal.se/nyheter/artiklar/busch-och-akesson-fikade-efter-braket/cG9zdDoxNzgzMDg", "imageUrl": "https://images.kvartal.se/2026/08/f88ae9d7-busch.webp"}, {"type": "image-right", "heading": "Sveriges tillväxt tre gånger högre än EU:s", "summaries": {"normal": "Sveriges BNP ökade med 1,6 procent under andra kvartalet jämfört med föregående kvartal, vilket är drygt tre gånger så mycket som EU:s 0,5 procent och euroområdets 0,4 procent. Även i årstakt växer Sverige betydligt snabbare än unionen. BNP per capita steg med 3,0 procent.", "trump": "Titta på det här, Sverige växer tre gånger snabbare än det patetiska EU med sina woke-kvoter och gröna vansinnet. 1,6 procent mot deras ynkliga 0,5! Under min ledning lärde sig Amerika att vinna, sen kom Sleepy Joe och förstörde allt. Nu fixar jag det igen – make economies great again!", "stalin": "Se hur de giriga profitthyenorna i Bryssel misslyckas medan en nation växer tre gånger snabbare. Detta är ett hån mot deras dekadenta union. Jag ler från historien åt deras svaghet. Snart inser arbetarna att bara stark ledning och kollektiv vilja kan besegra sådana klassfiender. Inga ursäkter tolereras."}, "date": "29 augusti, 19:39", "url": "https://riks.se/nyheter/sveriges-tillvaxt-tre-ganger-hogre-an-eu-s", "imageUrl": "https://admin.riks.se/uploads/medium_scb_solna_0820_x_hi945_d92804c697.jpg"}, {"type": "image-full", "heading": "Har han gått över gränsen? FI utreder sparprofilen", "summaries": {"normal": "Finansinspektionen utreder sparprofilen Patrick Siegbahn för att avgöra om hans finansiella vägledning i bolaget Siegbahn & Partners utgör tillståndspliktig investeringsrådgivning. Gränsen mellan generella råd och personliga rekommendationer är oklar, vilket står i fokus för myndighetens granskning. Siegbahn riskerar nu krav på rättelse eller vite om verksamheten anses bryta mot regelverket kring finansiell rådgivning.", "trump": "Finansinspektionen jagar Patrick Siegbahn! De säger att han ger råd, men ingen vet vad reglerna är – det är en total häxjakt, likt den de bedriver mot mig! Siegbahn vill bara hjälpa folk, helt oberoende. Istället för att jaga riktiga skurkar slösar de tid på en kille som vill skapa välstånd. Katastrofalt dåligt styre! En fullständig disgrace, believe me.", "stalin": "Denna Siegbahn leker fri rådgivare utan statens godkännande. En farlig tendens! När individer agerar utanför de centrala kontrollorganen skapas kaos och oordning. Finansinspektionen gör rätt som krossar detta oberoende. All vägledning måste vara underställd statens byråkratiska öga. Att påstå sig vara 'fri från intressekonflikter' är bara en täckmantel för borgerlig anarki som måste stävjas omedelbart genom hård lagstiftning."}, "date": "29 augusti, 10:22", "url": "https://www.realtid.se/juridik/har-han-gatt-over-gransen-fi-utreder-sparprofilen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/fi.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "USA uppges ha attackerat iransk ö. Första attacken på flera veckor • Irans revolutionsgarde utlovar hämnd", "summaries": {"normal": "Amerikanska styrkor har attackerat två iranska avfyrningsramper på ön Larak vid Hormuzsundet. Irans revolutionsgarde lovar hämnd och uppger att både soldater och civila dödats eller skadats. Attacken är den första mot iranska mål på flera veckor och sker samtidigt som USA ökar det ekonomiska trycket mot regimen. Explosioner hördes av boende i området.", "trump": "Vi har just satt stopp för de galna mullornas minläggning i Hormuzsundet. Fantastiskt jobb av våra killar! Den svaga Biden lämnade en röra, men nu fixar vi det. Irans revolutionsgarde skriker som hysteriska snögubbar och lovar hämnd. De kommer att lära sig att ingen utmanar den starkaste ekonomin och militären i världen. Amerika är tillbaka, större än någonsin.", "stalin": "Återigen visar de imperialistiska profitthungriga blodsugarna sin sanna natur genom att anfalla iranska positioner vid Hormuzsundet. Jag ser hur dessa dekadenta lakejer desperat försöker kväva motståndet med minor och sanktioner. En sådan handling förtjänar en grundlig utrensning av alla som sviker folkets sak. Kamrater, var vaksamma mot dessa nya fiender till revolutionen."}, "date": "30 augusti, 23:20", "url": "https://www.di.se/nyheter/usa-uppges-ha-attackerat-iran-forsta-gangen-pa-flera-veckor", "imageUrl": "https://static.bonniernews.se/ba/14aafa93-53a4-4e67-9743-cab6ee2398f7.jpg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Storspelet mellan stolparna: ”Står på huvudet hela matchen”", "summaries": {"normal": "AIK besegrade Hammarby i derbyt trots att de var nederlagstippat. Kristoffer Nordfeldt hyllades för sina räddningar, bland annat en straff och en retur. Trots en miss som ledde till 2–1 stod han för en stark insats som bidrog till vändningen till 3–2. Spelare och tränare prisade den 37-årige målvaktens erfarenhet och ledarskap.", "trump": "Titta på den där fantastiska Nordfeldt, han står på huvudet som en galning och räddar AIK från de woke-förgiftade Hammarby-hyonorna. 37 år och hoppar som en 20-åring, helt otroligt. De unga grabbarna behöver sådana ledare, inte någon av Bidens kvoterade misslyckanden. Jag älskar vinnare, och han är en vinnare, folks!", "stalin": "Jag betraktar med högsta tillfredsställelse hur denna arbetarklassens målvakt krossar de giriga derbyhyenornas illusioner om seger. Hans stålhårdhet mot straffsparken och hans ovilja att böja sig för fiendens returer visar sann proletär vilja. Den dekadenta borgarklicken må darra, ty erfarenhet och ledarskap skall alltid likvidera svaghet. Kamrater, detta är seger."}, "date": "30 augusti, 18:01", "url": "https://www.svt.se/sport/fotboll/kristoffer-nordfeldt-hyllas-efter-derbysegern-han-star-pa-huvudet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.43/0.42/1e8dee4ad1d3d0f92ba9aaa40ae72673228ad5c95bed76dac9f0768eb82f3fb7"}, {"type": "image-right", "heading": "Netanyahu-son tas i örat av brittisk högerledare", "summaries": {"normal": "En konflikt har uppstått mellan det brittiska högerpartiet Restore Britain och kretsen kring Benjamin Netanyahu efter att den israeliske premiärministerns son Yair stöttat Argentinas krav på Falklandsöarna. Partiledaren Rupert Lowe kräver ett officiellt uttalande från Israel. Yair Netanyahu saknar formell post men är en tydlig försvarare av sin far.", "trump": "Folk, det här är en total katastrof. Den där galne Netanyahu-pojken, den värsta sonen i historien, ger bort Falklandsöarna till Argentina som en billig julklapp. Rupert Lowe, den ende med lite hjärna i det där partiet, ställer sig upp som en riktig vinnare. Israel borde skämmas. Biden skulle ha älskat den här röran, men nu fixar jag det.", "stalin": "Kamrater, jag betraktar med djup förakt hur dessa dekadenta klassförrädare inom brittisk höger nu slåss om stenöar i havet. Yair Netanyahus utspel blottar imperialismens fåniga inre. Vi ler mörkt från historien när dessa profitthungriga hyenor biter varandra i svansen. Inga vänner åt folket, bara löjliga små konflikter."}, "date": "30 augusti, 18:45", "url": "https://www.friatider.se/netanyahu-son-tas-i-orat-av-brittisk-hogerledare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/dllvl.jpg?itok=NDHloSiz"}, {"type": "image-right", "heading": "Svarar efter ryktena: ”Blandade känslor”", "summaries": {"normal": "Paulos Abraham stannar i Hammarby trots bud från Sporting Kansas City och Lorient. Anfallaren berättar om blandade känslor efter ryktesspridningen och derbyförlusten mot AIK där han bland annat missade en straff. 24-åringen har gjort tolv mål i allsvenskan i år och trivs i klubben.", "trump": "Lyssnar ni på det här? Den där Abraham, en riktig vinnare, kunde ha stuckit till de där MLS-fifflarna eller franska elitklubbarna men han stannar i Hammarby. Smart val. De woke-kvoterna och identitetspolitiska lakejerna skulle bara ha förstört honom. Han älskar klubben, precis som folket älskar mig. Fantastiskt.", "stalin": "Kamrater, se hur den dekadenta fotbollsindustrins giriga hyenor lockar med sina bud och underminerar lojaliteten mot kollektivet. Jag betraktar med förakt hur denna Abraham vänder ryggen åt de parasitiska lockropen och väljer att stanna. Bra. I en riktig stat hade vi redan rensat ut alla sådana frestare med järnhand. Folkets vilja segrar."}, "date": "30 augusti, 17:46", "url": "https://www.svt.se/sport/fotboll/paulos-abraham-svarar-efter-ryktena-blandade-kanslor", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.45/0.34/4c8cb75d832c16424ab717e8a301dc9082fe88a6161ac691d7dbcc40fafe4df6"}, {"type": "image-full", "heading": "Mohamsson hyllar Busch efter SD-bråket", "summaries": {"normal": "Liberalernas Simona Mohamsson hyllar KD-ledaren Ebba Busch för att hon sätter stopp för SD-kritiken och uppmanar Tidöpartierna att fokusera på att bekämpa samhällsproblemen i stället för varandra. Detta kommer efter att Jimmie Åkesson ifrågasatt KD:s lojalitet, varpå Busch svarat med att styra om sin valturné till Sölvesborg.", "trump": "Falska nyheter och svagt ledarskap i Sverige! Jimmie Åkesson och Ebba Busch bråkar som små barn, men så kommer fantastiska Simona Mohamsson in och visar hur ett äkta vinnarlag ska spela. Otroligt! De borde fokusera på ekonomin i stället för att gnälla på varandra. Helt ärligt, jag skulle kunna lösa det där på fem minuter. Underbart land, mycket snö, men de behöver vinnare!", "stalin": "Dessa svenska borgerliga element bråkar om interna lojaliteter medan statens fiender skrattar. Kamrat Mohamsson kräver disciplin och att alla riktar sina vapen utåt, vilket är ett korrekt partilinjeuttag. Avvikande element som Åkesson bör skickas på om skolning i Sölvesborg omedelbart. Partiets enhet är helig, avvikelser tolereras icke!"}, "date": "30 augusti, 12:11", "url": "https://kvartal.se/nyheter/artiklar/mohamsson-hyllar-busch-efter-sd-braket/cG9zdDoxNzgyMTE", "imageUrl": "https://images.kvartal.se/2026/08/e517e4a7-buschmohamsson.webp"}, {"type": "image-right", "heading": "En död efter rejvskjutningen – massiv jakt på gärningsmän", "summaries": {"normal": "En 22-årig kvinna dog och minst fem personer skadades allvarligt efter skottlossning på ett rejv i schweiziska Aarau. Polisen jagar gärningsmännen som ännu inte gripits. Händelsen inträffade vid 03-tiden nära en stor grupp människor på en galoppbana. Motivet är oklart och allmänheten uppmanas hålla sig borta.", "trump": "Titta på det här. I Schweiz, ett land som borde vara säkert, skjuter galningar på ett rejv och dödar en 22-årig tjej. Biden lämnade efter sig ett svagt Europa fullt av woke-festivaler där kriminella springer fria. Nu jagar de skurkarna som råttor. Mina tullavgifter hade stoppat det här vansinnet direkt. Patetiskt!", "stalin": "Kamrater, se hur den borgerliga dekadensen i väst förvandlar nöjesfester till blodbad. En ung kvinna förblöder medan fiender till ordningen skjuter vilt. Jag varnar er: sådana händelser visar imperialismens förruttnelse. Vi måste vara vaksamma mot alla kontrarevolutionära element som gömmer sig bland folket. Renhet eller död."}, "date": "30 augusti, 11:13", "url": "https://www.tv4.se/artikel/2AWuG7b95b6fSKDUJqTmy4/minst-en-doed-och-flera-skadade-i-skottlossning-pa-rejv", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlhRAQO-yE7f0%2F1c2e6c8038b3eac9f04e5b2073b5405c%2FPolisen_patrullerar_i_centrala_Aarau_efter_nattens_skottlossning_pa_ett_rejv._&width=120"}, {"type": "image-right", "heading": "Jobbade 155 dagar i sträck – behövde ända sälja sex för att klara sig", "summaries": {"normal": "Massörer på thaimassagesalonger i bland annat Jönköping och Stockholm har arbetat under extrema förhållanden, upp till 155 dagar i sträck, ofta ensamma i källare. Låga löner har tvingat flera att sälja sex. Nu åtalas en man i 60-årsåldern och en kvinna i 45-årsåldern för grov människoexploatering och grovt koppleri.", "trump": "Titta på det här, det är en total katastrof! Dessa stackars kvinnor tvingas arbeta som slavar i källare och sälja sig för att överleva medan de woke-domarna och byråkratiska hyenorna bråkar om vad som egentligen är exploatering. Biden lät det här pågå i fyra år – nu fixar jag det på riktigt. Amerika först, även mot de svenska massagesalongsskandalerna!", "stalin": "Se hur de profitthungriga klassfienderna driver arbetarkvinnor till botten av samhället, tvingar dem att bo och arbeta i mörka källare och sälja sin kropp för bröd. Detta är den sanna rösten av det dekadenta systemet. Vi måste rensa ut alla parasiterande exploatörer som gömmer sig bakom lagar. Rättvisan kräver järnhand mot sådana fiender till folket."}, "date": "30 augusti, 11:00", "url": "https://arbetet.se/2026/08/30/massorer-jobbade-155-dagar-i-strack-behovde-anda-salja-sex-for-att-klara-sig", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28150325/massage.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Folket står knappast bakom Tidöpakten", "summaries": {"normal": "Novak och Sundström granskar Tidöregeringens fyra år vid makten i rapportserien Skymningsläge. De kritiserar hur regeringen forcerat lagstiftning, kortat remisstider, styrt utredningar och ignorerat experter. Författarna varnar för att demokratiska processer och rättssäkerhet åsidosatts till förmån för snabb politisk styrning, något som påminner om autokratiska tendenser i andra länder.", "trump": "Folk, ni borde se det här! Den här svenska Tidöregeringen kör som en galen bulldozer, precis som jag gjorde fast de glömde att vinna stort. De kör över alla byråkrater och experter, vilka är totala losers, och levererar resultat istället för att lyssna på de woke, identitetspolitiska snyltarna som förstör allt. Sverige vaknar äntligen upp – bra jobbat, grabbar! Men ni behöver mig som inspiration.", "stalin": "Kamrater, dessa dekadenta folkförtryckare i den svenska regeringen visar återigen hur de giriga maktparasiterna föraktar folkets vilja. De forcerar lagar, styr utredningar och skrattar åt experter som om de vore kontrarevolutionära spioner. Jag ler från historien – snart kommer utrensningen av sådana falska demokrater. Deras skymningsläge är bara början på det oundvikliga folkets dom."}, "date": "29 augusti, 01:43", "url": "https://www.dagensarena.se/opinion/folket-star-knappast-bakom-tidopakten", "imageUrl": "https://www.dagensarena.se/files/2026/08/dmekrat.jpeg"}, {"type": "image-right", "heading": "Carl Eos: Kan vi som vill slippa S lita på Ebba Busch?", "summaries": {"normal": "Jimmie Åkesson ifrågasätter i sitt sommartal om Ebba Busch och Kristdemokraterna kan garantera att de inte röstar fram Magdalena Andersson som statsminister. Busch har lämnat öppet för undantag vid krig, kris eller exceptionella lägen utan att precisera vad det innebär. Artikeln menar att väljare som vill hålla Socialdemokraterna borta från makten har rätt till ett tydligt besked före valet.", "trump": "Lyssnar ni på den här svaga, ynkliga Busch? Hon kan inte ens säga nej till den socialistiska katastrofen Andersson utan att lämna en dörr öppen för kris och exceptionellt läge. Patetiskt! Jag byggde den starkaste ekonomin i historien efter Bidens soppa, och ni européer leker fortfarande med vänsterns identitetspolitik och öppna gränser. Säg nej rakt ut, annars är ni bara förlorare.", "stalin": "Kamrater, se hur dessa dekadenta maktspelare vänder sig i sin egen osäkerhet. Jag betraktar med förakt hur Busch inte vågar uttala den absoluta nej-satsen mot den socialdemokratiska faran. Ett sådant vagt undantag är en öppning för klassfienderna att återta makten. Väljare förtjänar klarhet, inte undanflykter. Den som tvekar förtjänar utrensning ur det politiska spelet."}, "date": "29 augusti, 16:52", "url": "https://riks.se/kronikor/carl-eos-kan-vi-som-vill-slippa-s-lita-pa-ebba-busch", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_66_ed8d53bdf5.jpg"}, {"type": "image-full", "heading": "Den svaga kronan får svensk ekonomi att se mindre ut än vad den är", "summaries": {"normal": "Sveriges andel av EU:s BNP har sjunkit till 3,2 procent, en placering som påverkats negativt av den svaga kronan. Om kursen varit stabil sedan 2005 hade andelen varit högre. Trots detta växer Sverige i linje med EU-genomsnittet, medan större ekonomier som Frankrike och Italien tappar mark. Polens tillväxt framhålls som den mest reella och imponerande.", "trump": "Sverige faller i tabellerna, en total katastrof! De skyller allt på kronan, en mycket svag valuta, tro mig. Om de hade haft en stark ekonomi som min, skulle de vinna stort. Polen växer, Sverige tappar – det är så sorgligt att se. De är fast i ett byråkratiskt EU-träsk medan jag bygger upp en fantastisk framtid för oss. Väldigt låg energi!", "stalin": "Sveriges ekonomi är en papperskonstruktion som darrar vid minsta växelkursskifte. De har blivit omsprungna av Polen och Belgien, vilket
