 men en hel ö brinner upp i Sverige och ingen gör någonting! Räddningstjänsten och ägaren säger bara att det får brinna, inget av värde kvar. Typiskt, de har ingen aning om hur man hanterar en brand. Jag skulle ha släckt den på fem minuter med de bästa släckarna, de bästa, ingen gör det bättre än mig.", "stalin": "Kamrater, denna fega brand på den kontrarevolutionära ön Björkholmarna är uppenbarligen ett verk av borgarbrackornas dolda sabotage mot folkets naturresurser. Jag har beslutat att låta lågorna fortgå som en hälsosam utrensning av allt dekadent som gömmer sig bland träden. Vi bevakar elden noga mot imperialistiska gnistor som vill sprida sig till de sanna arbetarnas marker. Den som fnissar åt elden blir nästa som brinner."}, "date": "10 juli, 11:13", "url": "https://nyheter24.se/nyheter/inrikes/1497769-en-hel-o-i-smaland-brinner-ska-fa-fortsatta-brinna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0ddb0e4104b004a30200000000b004a302/2026/07/10/2377088/o-brinner.png"}, {"type": "image-right", "heading": "Staten bör utföra järnvägsunderhållet med egen personal", "summaries": {"normal": "Artikeln kritiserar Sveriges långtgående privatisering av järnvägsunderhållet som Trafikverket upphandlat i 25 år. Produktiviteten har sjunkit 25 procent på tio år på grund av överklaganden, byråkrati och förlorad praktisk kunskap. Författarna, bland andra fackliga företrädare och experter, kräver att staten återtar underhållet i egen regi för att förbättra effektivitet och kunskap, något som stöds av tidigare utredningar, Riksrevisionen och en majoritet av folket.", "trump": "Titta på det här, Sverige har totalt förstört sina järnvägar med vansinnig privatisering och byråkrati. Trafikverket är en katastrof, de anställer jurister istället för att fixa spåren och produktiviteten rasar 25 procent. Det är en enda stor röra av överklaganden och kapitalistiska entreprenörer som suger systemet torrt. Jag skulle säga: ta tillbaka kontrollen, bygg det starkt och effektivt igen. Gör järnvägen great again, annars fortsätter tågen att stå stilla som mina motståndares hjärnor.", "stalin": "Vi ser med djup tillfredsställelse hur de svenska kapitalisterna och deras lakejer i Trafikverket har skapat en kontrarevolutionär röra av fragmentiserat underhåll som förgiftar arbetarkollektivets transporter. Dessa borgarbrackor och upphandlingsförrädare har förflyttat kunskapen till giriga entreprenörer som bara drömmer om profit. Jag säger: rensa ut den parasitiska byråkratin, likvidera de överklagande sabotageelementen och återupprätta en stark offentlig järnväg med egna maskiner och lojala tekniker. Den som tvekar är en folkfiende som förtjänar en kreativ utrensning i historiens soptunna."}, "date": "9 juli, 21:53", "url": "https://www.dagensarena.se/opinion/staten-bor-utfora-jarnvagsunderhallet-med-egen-personal/", "imageUrl": "https://www.dagensarena.se/files/2017/09/jarnvag-300x157.jpg"}, {"type": "image-right", "heading": "Experten: Kan bli en massiv eskalering", "summaries": {"normal": "Irans tidigare ledare Ali Khamenei gravsätts i dag i Mashhad samtidigt som spänningen mellan USA och Iran ökar. USA har bombat broar till staden under natten. Mellanösternexperten Anders Persson varnar för att ett angrepp mot begravningsceremonin kan leda till massiv eskalering. Regimen använder ceremonin för att visa kontroll och legitimitet. Bakgrunden är beskjutningar i Hormuzsundet där parterna beskyller varandra. Persson beskriver läget som mycket osäkert med risk för allt från lugn till fullt krig.", "trump": "Titta på det här, folk. Den galna iranska regimen paraderar runt med sin döde ledare i Mashhad medan vi smarta amerikaner bombar broarna runt staden så de inte ens kan ta sig dit ordentligt. Khamenei var en total loser, precis som de mullor som nu desperat försöker se starka ut. Om vi skulle bomba hela den där sorgeshowen vore det en massiv eskalering, säger experterna. Men vi vinner stort, som alltid. Biden lämnade en röra, jag fixar den.", "stalin": "Kamrater, denna farsartade begravningsprocession i Mashhad är borgarbrackornas sätt att fejka kontroll medan imperialismens bombplan cirklar som gamar. Jag, som byggt en järnhård stat, ser tydligt hur den iranska regimen klamrar sig fast vid sin legitimitet genom massor av bedrägliga sorgeparader. Ett angrepp mot ceremonin skulle bli en klassisk provokation från klassfienderna. Vi ler mörkt åt deras paranoia. Inga broar räddar exploaterande byfånar från historiens utrensning."}, "date": "9 juli, 19:23", "url": "https://www.tv4.se/artikel/7AnVUndXOVquuH1sgcbsmM/experten-en-bombning-av-begravningen-kan-bli-en-massiv-eskalering", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdly9wVYwCxh6U%2Fff5cfbdc38527db724ce2519562a6ad6%2FSorjande_runt_den_finlandska_frysbilen_med_ayatolla_Ali_Khameneis_kista_i_Karbala__Irak_natten_mot_torsdagen.&width=120"}, {"type": "image-right", "heading": "Det är vansinnigt att fortsätta bryta torv", "summaries": {"normal": "I en ledare argumenterar Johan Ehrenberg för ett omedelbart stopp för torvbrytning i Sverige. Han pekar på att det skulle minska landets utsläpp med 20 procent, mer än stål- och cementindustrin tillsammans, till ingen kostnad. Ehrenberg kritiserar privata markägare, politiker och högerlobby för att prioritera vinst framför klimat och beskriver egna sommarjobbserfarenheter från 1973. Han hyllar organisationen Återställ våtmarker.", "trump": "Folk, ni kommer inte tro det, men den här galningen Ehrenberg har rätt om en sak: torvbrytningen är ett totalt skämt! Vi pratar om att sänka utsläppen med tjugo procent utan att det kostar en krona, och ändå låter de svenska kommunisterna och byråkraterna det fortsätta. Det är som Biden-era, rena vansinnet. Sluta gräva i myggträsken, pensionera maskinerna och gör Sverige stort igen. De gröna lobbyisterna hatar mig för att jag säger sanningen!", "stalin": "Kamrater, jag ser den kapitalistiska torvplundringen som ett fiendtligt sabotage mot folkets framtid. Att torrlägga våtmarker för borgarbrackornas trädgårdar medan arbetarklassen kvävs av utsläpp är ren klassfiendsbrottslighet. Tjugo procent färre utsläpp med ett pennstreck? Endast folkfiender och exploaterande byfånar motsätter sig detta. Vi ska likvidera denna parasitverksamhet omedelbart. Återställ våtmarker är en nyttig kollektiv kraft mot den förlamande latheten."}, "date": "10 juli, 11:09", "url": "https://www.etc.se/ledare/det-aer-vansinnigt-att-fortsaetta-bryta-torv", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-full", "heading": "Svenskar i minoritet på Skara sommarland: Den som upprörs ska hålla tyst", "summaries": {"normal": "Artikeln kritiserar en text i Kvartal av Federico Moreno om en svensk mans upplevelse av att känna sig som främling på Skara Sommarland, omgiven av arabisk musik, burkinis och stora grupper besökare med utländsk bakgrund. Författaren ser Morenos nedvärderande ton som hån mot svenskars önskan att känna igen sig i sitt land och jämför den med historiska invandringar. Texten ifrågasätter Morenos paralleller och menar att migrationens effekter inte bör tystas ner.", "trump": "Folk, ni skulle se det här! Den där Federico Moreno, en total loser från Sydamerika, skriver en artikel som hånar riktiga svenskar som känner sig som främlingar i sitt eget land på Skara Sommarland. Burkinis överallt, ingen kö, ingen hänsyn – det är en katastrof! Och DN:s Niklas Orrenius älskar det, vad en patetisk förlorare. Vi ska inte skämmas, vi ska ta tillbaka vårt land. Make Sweden Swedish Again, det blir fantastiskt!", "stalin": "Kamrater, denna borgarbracka Moreno, en exploaterande byfåne med sydamerikanska rötter, utför en ideologisk utrensning mot arbetande svenskars rättmätiga vrede över att se sin nöjespark invaderas av främmande element. Hans jämförelse med historien är en lögnaktig sabotagehandling från klassfienden. Vi ser genom denna folkförtryckartrolls paranoia. Inga skamsna röster skall tystas – vi likviderar sådana dekadenta narrspel med järnhand. Det svenska folkets kollektiva vilja segrar."}, "date": "10 juli, 03:16", "url": "https://samtiden.nu/2026/07/svenskar-i-minoritet-pa-skara-sommarland-den-som-upprors-ska-halla-tyst/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6863-1280x720.jpeg"}, {"type": "image-full", "heading": "Uppgifter: Nya explosioner i Iran", "summaries": {"normal": "Explosioner har rapporterats på flera platser i södra Iran, inklusive Konarakregionen och Bushehrprovinsen, där Irans enda kärnkraftverk ligger. Orsaken är okänd. USA har inte kommenterat händelserna, trots tidigare attacker mot Iran. Samtidigt har Iran avfyrat robotar mot amerikanska militära mål i Mellanöstern. Händelserna sammanfaller med begravningsceremonier för ayatollan Ali Khamenei.", "trump": "Folk ringer mig hela tiden och säger: 'Mr. President, vad händer i Iran?' Jo, jag ska säga er – det smäller rejält där borta! Men vet ni vad? Ingen vet varför. Kanske är det deras egen inkompetens, vem vet? USA har inget med det att göra, trots att vi tidigare visade dem vad vi går för. Och nu skjuter de robotar mot våra baser – men oroa er inte, vi har det under kontroll. Iran är ett kaos, precis som deras ekonomi!", "stalin": "I morgonens gryning hördes återigen de välbekanta ljuden av imperialistisk inkompetens i den iranska öknen. Explosioner skakar deras så kallade 'kärnkraftverk' – ett monument över deras misslyckade teknologi. Amerikanerna tiger, som vanligt, men vi vet att deras långa armar sträcker sig över haven. Medan de begraver sina fallna ayatollor, skjuter de desperat mot våra allierades positioner. Låt dem leka med elden – historien visar att sådana länder alltid hamnar i askan. Vi väntar tålmodigt."}, "date": "9 juli, 20:53", "url": "https://kvartal.se/nyheter/artiklar/uppgifter-nya-explosioner-i-iran/cG9zdDoxNDQxNzU", "imageUrl": "https://images.kvartal.se/2026/07/505d8b36-khamenei.webp"}, {"type": "image-right", "heading": "Ny teknik minskar vattensvinn på campingar", "summaries": {"normal": "En ny teknik för realtidsövervakning av vattenförbrukning testas på campingplatser i Helsingborg, Mora och på Öland. Systemet upptäcker läckor snabbt och minskar svinn. Campingen Råå Vallar använder även sensorer i duschar och handfat. Gäster bidrar genom att rapportera läckor. Både personal och campare betonar vikten av att vara medveten om vattenanvändning för att spara resurser och hålla nere kostnader.", "trump": "Folk, vi har ett enormt vattensvinn på de där campingarna, det är en katastrof, en total katastrof. Men nu har de äntligen hittat en fantastisk, den bästa tekniken som bevakar vattnet minut för minut. Genialt! Inga fler läckor som rinner iväg pengar och resurser. De smarta campare vet hur man sparar, inte som de lata stadsborna. Vi älskar effektivitet, ingen mer slöseri under min administration – Amerika, och Sverige, kommer att spara stort. Fantastiskt!", "stalin": "Kamrater, jag ser den borgerliga campingsektorns desperata försök att kontrollera det folkets vatten genom dekadenta realtidsmaskiner. Denna imperialistiska teknik avslöjar läckor som klassfiendens sabotage. Vi ska utrensa alla sådana slöserier från sovjetiskt, nej, från kollektivets synvinkel. Gästerna rapporterar läckor – utmärkt partivaksamhet. Men akta er, kapitalistmaffians vattenräkningar döljer bara folkets sanna fiender. Inga läckor undgår ledarens blick."}, "date": "9 juli, 08:04", "url": "https://www.tv4.se/artikel/1XjvThHdwuZ3PDcOTrZKaS/ny-teknik-minskar-vattensvinn-pa-campingar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2nOsgbFlKsqSnXLrc2LZ23%2Fb8a0e1855686d9bbea8953866c642359%2F15-camping.jpg&width=120"}, {"type": "image-right", "heading": "Nya attacker mellan USA och Iran – andra natten i rad", "summaries": {"normal": "USA och Iran har för andra natten i rad utväxlat attacker i Mellanöstern. Amerikanska styrkor slog mot runt 90 mål i Iran, bland annat i Bandar Abbas, Kanarak och Chabahar. Iran svarade med drönare och robotar mot Kuwait, Bahrain och Qatar. President Trump varnar för ytterligare upptrappning och kallar attackerna vedergällning för iranska aktioner mot fartyg i Hormuzsundet. Båda sidor anklagar varandra för att ha brutit en tidigare vapenvila.", "trump": "Vi slog till hårt mot de galna iranierna igen, precis som jag lovade. Explosioner överallt, de ringer och ber om nåd nu. Biden lät dem bli helt okontrollerade men nu är det slut på det. Hormuzsundet öppnas bara när jag säger det, inte genom deras svaga hot. De är avskum, totala förlorare. Om de gör om det blir det mycket, mycket värre. Amerika är tillbaka, starkare än någonsin.", "stalin": "Vi har i natt återigen slagit mot de imperialistiska fienderna som vågar utmana folkets vilja. Deras fega drönare och borgarbrackornas robotar avslöjar bara den svaga kapitalistmaffians desperation. Jag ler mörkt åt deras patetiska vedergällning mot egna fartyg. Hormuzsundet tillhör inte era exploaterande byfånar. Fortsätter de flaxa omkring skall vi rensa ut alla folkfiender som gömmer sig bakom falska avtal. Staten segrar."}, "date": "9 juli, 08:00", "url": "https://www.tv4.se/artikel/010JnLkqbbn8PaTGkn3fay/usa-inlett-nya-attacker-mot-iran", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3ktflJT78wNXLYh9a1MyRa%2Fd49d1b7b5a20efd95190551e60d15720%2Ftrump_x.jpg&width=120"}, {"type": "image-right", "heading": "Hemtjänstman misstänks för våldtäkt och fick sparken - men polisutredningen läggs ned", "summaries": {"normal": "En hemtjänstman i Enköpings kommun misstänktes för våldtäkt mot en brukare i hennes hem i december förra året. Han fick sparken omedelbart efter anmälan. Polisen hade inledningsvis svårt att hitta honom för förhör, men vid förhöret erkände han sex men nekade till brott. Förundersökningen har nu lagts ned då brott inte kunnat bevisas. Mannen ska även ha erbjudit kvinnan pengar för tystnad. Händelsen har orsakat stort trauma inom arbetsgruppen.", "trump": "Folk, det här är en total skandal i den svenska hemtjänsten. En kille anklagas för våldtäkt mot en stackars kvinna som är beroende av hjälp, får sparken direkt, och sen försvinner han bara? Polisen letar efter honom som om det vore en dålig deckare. Till slut erkänner han sex men säger att det inte var brott. Nu lägger de ner utredningen. Patetiskt! Systemet är så svagt att de inte ens kan ställa någon till svars. En mycket märklig historia, tro mig.", "stalin": "Kamrater, denna degenererade händelse i Enköping visar hur borgarbrackornas så kallade vårdapparat ruttnar inifrån. En parasit i hemtjänsten utnyttjar en utsatt arbetande kvinna, erbjuder henne mutor för tystnad och tror sig kunna undkomma folkets rättvisa. Vi inleder utredning, rensar ut den kapitalistiska avskrapet från tjänsten, men polisens fumliga jakt på den försvunne fienden avslöjar systemets svaghet. Till sist läggs utredningen ned. Inget brott bevisat, säger de. Vilken mörk humor från klassfienderna som skyddar sina lakejer. Vi måste likvidera sådana element permanent för att skydda kollektivet."}, "date": "10 juli, 10:00", "url": "https://samnytt.se/hemtjanstman-misstanktes-for-valdtakt-fick-sparken-nu-laggs-forundersokningen-ner", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/09150552/hemtjanst.png"}, {"type": "text", "heading": "AI hotar finanssystemet – Myndigheter slår larm", "summaries": {"normal": "Europeiska systemrisknämnden (ESRB) varnar för att avancerade AI-modeller ökar cyberriskerna inom finanssektorn. AI kan utnyttja sårbarheter snabbare än tidigare, vilket gör hotbilden mer komplex. Finansinspektionen och Riksbanken betonar vikten av ökad motståndskraft och internationellt samarbete. Svenska finansiella företag uppmanas att förbereda sig på störningar då risken är gränslös och kopplad till den rådande geopolitiska situationen.", "trump": "EU varnar för AI och finanssystemet – det är en katastrof, tro mig! De har ingen kontroll, precis som vanligt. Jag har sagt det länge: tekniken är farlig om du inte har en stark ledare. De är svaga, de är långsamma och nu blir de hackade av AI. Sorgligt! Sverige och FI försöker låtsas att de har en plan, men det är bara prat. När jag styrde skutan var vi säkra, nu faller allt samman. Väldigt oroväckande!", "stalin": "Dessa europeiska byråkrater darrar av rädsla när deras digitala murar krackelerar inför den nya tekniken. De kallar det 'AI-risker', men vi vet att det är en fråga om statlig kontroll. Kapitalistiska finansinstitut är svaga och oorganiserade. Vi iakttar hur de västerländska strukturerna vacklar. Medan de försöker laga sina digitala hål, utvidgar våra vänner i öst inflytandet över verkligheten. Låt dem falla; ett system som inte kan försvara sig förtjänar att utplånas av den teknologiska revolutionen."}, "date": "10 juli, 09:21", "url": "https://www.realtid.se/bors-finans/makro/ai-hotar-finanssystemet-myndigheter-slar-larm/"}, {"type": "image-right", "heading": "Tuva, 17, kör hemtjänst i sin epa. ”Det är jättekul.”", "summaries": {"normal": "Sju epa-ungdomar i Vårgårda avlastar hemtjänsten i sommar genom att köra runt och hjälpa äldre med promenader, inköp och sociala samtal. Tuva, 17, kör sin Volvo V70 och spelar norsk epa-dunk, medan Elna, 16, uppskattar att det är roligare än arbete på äldreboende. Projektet startade efter ett medborgarinitiativ och trots initial skepsis gör ungdomarna nytta. Lönen på 100 kronor i timmen plus milersättning går ofta till bildetaljer eller sparande till en artonårsbil.", "trump": "Helt fantastiskt, det här med epa-bilarna i Sverige. Unga killar och tjejer, de älskar att köra sina gamla Volvor och Saabar, och nu hjälper de de gamla istället för att bara hänga. Mycket socialt, promenader, inköp – och de spelar epa-dunk! De gör ett bättre jobb än många proffs, sägs det. Ingen vårdutbildning behövs, bara vilja och bra fordon. De tjänar lite pengar till nya detaljer på bilarna. Smart, väldigt smart. Sverige borde göra mer sånt här, tro mig.", "stalin": "Kamrater, se hur det folkliga initiativet från en sjuksköterska blomstrar under vår kollektiva omsorg! Jag har personligen noterat hur dessa epa-ungdomar, vägrade av borgarbrackornas dekadenta skola, nu uträttar storverk åt de åldrande arbetarna. De rensar ensamhetens kontrarevolutionära gift med promenader och inköp medan de kör sina fordon mot klassfiendens isolering. Initial skepsis från den fasta personalen var naturligtvis sabotage från kapitalisternas dolda agenter. Nu likviderar vi den med praktiska resultat. Lönen går till fordonens förstärkning – en dialektisk seger mot ensamhetens trotskistiska konspirationer. Mycket underhållande."}, "date": "10 juli, 09:02", "url": "https://arbetet.se/2026/07/10/tuva-17-kor-hemtjanst-i-sin-epa-jattekul/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09105836/8tG3guz9FXw-epa_05_D3A9325.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Fler idrotter blir inte mer idrott för förortens unga", "summaries": {"normal": "I Skarpnäck hotar kommunens planer att riva Skarpnäckshallen och en konstgräsplan som används för både spontanfotboll och organiserad lagidrott. Istället föreslås en ny anläggning med simhall, ishall och sporthall. Kritiker menar att detta försvårar verksamheten för lokala föreningar, minskar tillgängliga ytor för spontanidrott och gynnar professionaliserad idrott framför öppna ytor som är viktiga för förortens unga.", "trump": "De gör det igen, de korkade kommunbyråkraterna i Stockholm. Riv den fina fotbollsplanen där grabbarna spelar fritt och bygg en jättelik elit-anläggning för fancy ishockey och simning. Fantastiskt misslyckande! Nu ska arbetarklassens kids åka tunnelbana medan rikemansungar tar över. Totalt eländigt. Öppna ytor är välfärd, det här är ren klasskrigföring från de värsta globalisterna. Vi behöver mer fotboll, inte färre!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas ungdom. Jag ser hur de rivningsplanerna likviderar de fria ytorna där folket spontant kunde stärka sin kollektiva anda genom fotboll. Istället tvingar de fram en imperialistisk ishall för elitens dekadenta lekar. Vi ska inte tolerera sådana folkfiender som prioriterar tunnelbaneresor och avgifter framför tillgänglig välfärd. Rena klassfiender som måste rensas ut ur planeringen."}, "date": "8 juli, 13:37", "url": "https://proletaren.se/artikel/fler-idrotter-blir-inte-mer-idrott-for-forortens-unga/"}, {"type": "image-right", "heading": "Palestinskt fotbollslag tävlar för tredje året i rad: ”Vi har de bästa supportrarna på Gothia Cup”", "summaries": {"normal": "Det palestinska laget Rawahel Charity Society från Tulkarem på Västbanken deltar för tredje året i rad i Gothia Cup i Göteborg. Laget, som grundades 2016, har som mål att utveckla fotboll för barn även i flyktingläger. De spelar gruppspelsmatcher på Slottsskogsvallen och betonar att turneringen ger hopp och en känsla av gemenskap. Innan cupen spelar de vänskapsmatcher i Malmö och Göteborg.", "trump": "Titta på de här palestinska grabbarna som kommer tillbaka till Gothia Cup för tredje gången – fantastiska supportrar, bästa publiken, det är otroligt. De spelar för att vinna, kämpar med heder, och folk älskar dem. Under Biden var allt kaos, men nu när jag är tillbaka som president ser vi styrka och vinnarmentalitet. De har hjärtan som öppnar dörrar, inte som de woke-kvoteringsfanatikerna som bara delar ut medaljer för identitet. Vinna pokalen, grabbar!", "stalin": "Kamrater, jag ser detta fotbollslag från det palestinska folket återvända till turneringen som ett bevis på kollektiv motståndskraft mot klassfiendens glömska. Vi glömmer aldrig våra barn i flyktinglägren. Varje match på Slottsskogsvallen är en seger över de exploaterande byfånarna som tror att hoppet kan kvävas. Vi rensar ut svagheten ur varje hjärta och marscherar mot pokalen med järnhand. Ingen imperialist ska tro att våra drömmar bleknar."}, "date": "8 juli, 13:31", "url": "https://proletaren.se/artikel/palestinskt-fotbollslag-tavlar-for-tredje-aret-i-rad-vi-har-de-basta-supportrarna-pa-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IMG_7594-scaled-e1783509189311-768x433.jpg"}, {"type": "image-right", "heading": "Billigare bensin gör inte Sverige till Sverige igen", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas valslogan ”Vi gör Sverige till Sverige igen”. Författaren ironiserar över att partiet inte verkar vilja återinföra traditionell svensk politik som att lämna Nato och EU, återförstatliga järnvägen, avskaffa vinstdrivande välfärd eller stärka fackets roll. Istället pekar texten på att SD främst vill utvisa invandrare och sänka bensinpriset.", "trump": "Wow, vilka losers dessa Sverigedemokraterna är. De skriker ut att de ska göra Sverige till Sverige igen, men glömmer bort att skrota Nato, kasta ut EU och stoppa alla dessa vansinniga marknadskrafter som förstör deras fina välfärd. Nej, de vill bara kasta ut blattar och ge billigare bensin. Patetiskt. Jag fixade bättre deals som president, tro mig. Det här är riktigt svagt.", "stalin": "Kamrater, denna dekadenta skribent avslöjar med sin ironiska tirad hur de falska nationalistiska elementen inom Sverigedemokraterna bara döljer sin kapitulation inför klassfiendens marknadskrafter. De vill inte rensa ut de exploaterande byråkraterna eller återta järnvägen åt folket. Nej, de längtar blott efter att jaga ut de främmande elementen och sänka bränslepriset. En sådan feghet förtjänar utrensning ur den revolutionära processen."}, "date": "8 juli, 11:39", "url": "https://proletaren.se/artikel/billigare-bensin-gor-inte-sverige-till-sverige-igen/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IMG_1894-scaled-e1783502027449-768x433.jpg"}, {"type": "image-full", "heading": "AI skulle spara pengar – nu exploderar kostnaderna", "summaries": {"normal": "En ny global undersökning från KPMG visar att företagets AI-satsningar blivit dyrare än förväntat. Många chefer har infört AI snabbt för effektivisering men saknar kontroll över hur tekniken används i praktiken. Förhoppningarna om att AI skulle ersätta personal har inte infriats, utan tekniken fungerar snarare som ett komplement. Många företag saknar nu överblick över kostnaderna och försöker därför införa striktare riktlinjer och bättre uppföljning för att få kontroll på ekonomin.", "trump": "Dessa företag, de har ingen aning om vad de gör! De trodde AI skulle vara magiskt, en enorm succé, men istället blir notan gigantisk. Sad! De kastar bort pengar för att de inte har kontroll. Jag sa det till dem, man måste ha de bästa människorna. De trodde AI skulle sparka folk, men det gjorde det inte. Det är kaos! Jag skulle styrt upp det här på en dag. Det handlar om att förhandla, att ha kontroll. De behöver en vinnare vid rodret!", "stalin": "Dessa borgerliga chefer är lika inkompetenta som de är giriga. De hoppades att maskiner skulle ersätta folkets arbete, men istället har de skapat ett monument över sin egen okunskap. Kostnaderna skenar medan de famlar i mörkret – en typisk brist på planhushållning! Vi i staten vet bättre; när vi använder teknologi är det för att stärka nationen, inte för att göda kaos. De som slösar med resurser är folkets fiender. Om de inte kan kontrollera sin AI, kanske de behöver en mer... permanent vägledning."}, "date": "10 juli, 07:49", "url": "https://www.realtid.se/it-tech/ai-skulle-spara-pengar-nu-exploderar-kostnaderna/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/ai-chef.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Bonnier-portade debattartikeln: Får vi tvångsblandning i Borlänge?", "summaries": {"normal": "En debattartikel från SD:s Arvid Jaans i Borlänge Tidning publicerades inte då ansvarig utgivare ansåg att den kunde utgöra hets mot folkgrupp. Artikeln kritiserar kommunens planer på blandade boendeformer i villaområden, kallar det tvångsblandning och förespråkar veto för invånare. Jaans anklagar Socialdemokraterna för att ha skapat segregation i Borlänge genom invandring för att säkra röster från bidragstagare i områden som Tjärna Ängar. Han kräver svar om hur kommunen ska hantera invånare som inte integreras och föreslår återvandring med bidrag.", "trump": "Folk, ni skulle ha sett den här underbara artikeln som de fega tidningsmänniskorna i Borlänge stoppade. De kallar det hets mot folkgrupp, men det är bara sunt förnuft. De vill tvinga in hyresrätter i fina villaområden, precis som i de katastrofala städerna Göteborg, Malmö och Stockholm. Socialdemokraterna har förvandlat Borlänge till en segregerad röstmaskin fylld av bidragsberoende invandrare. De älskar sina väljare mer än de älskar Sverige. SD har rätt – ge makten tillbaka till folket och stoppa det här vansinnet innan det är för sent. America First, Sweden First!", "stalin": "Kamrater, denna fega borgarpress i Borlänge vägrade publicera en artikel som blottade de kontrarevolutionära socialdemokraternas sanna ansikte. De har medvetet importerat en parasitisk klass av bidragstagare till Tjärna Ängar för att säkra sin makt över arbetarklassen. Nu planerar de att sprida denna dekadenta röstboskap som en smittsam sjukdom över hela kommunen. Jag, som ledare för det proletära kollektivet, ser tydligt hur dessa klassfiender och integrationssvikare gömmer sig bakom fraser om jämlikhet. Vi skall rensa ut dessa lata element som vägrar lära sig språket och arbeta. Återvandring är den slutgiltiga utrensningen av detta hot mot folkets enhet. Den som röstar för dem är själv en fiende till staten."}, "date": "10 juli, 08:00", "url": "https://samnytt.se/far-vi-tvangsblandning-i-borlange", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/09164006/debatt-arvid-jaans2.jpg"}, {"type": "image-right", "heading": "Tror Tidögänget att föräldrar är dumma i huvudet?", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar Tidöpartiernas utredning om språkförskolan. Förslagen om mindre barngrupper, högre personaltäthet och bättre språkstöd är bra, men finansieringen genom att avskaffa flerbarnstillägget och sänka föräldraförsäkringen från 80 till 67 procent drabbar barnfamiljer hårt. En undersköterska med normal lön skulle förlora omkring 5 000 kronor i månaden. Författaren menar att regeringen underskattar föräldrars intelligens och att förslaget riskerar att bli en omvänd omfördelning från vanliga familjer till politikens vallöften.", "trump": "Folk, det här är en total katastrof. Tidögänget tror att föräldrarna är idioter, totala losers. De lovar gullig språkförskola men tar pengarna från barnbidrag och föräldraledighet, tusentals kronor borta varje månad. Mamma och pappa ska betala notan medan de rika skidåkare i Chamonix skrattar. Det är klassisk fake politics, ger med ena handen och stjäl med den andra. Sveriges föräldrar är smarta, de ser bluffen. Kastar ni inte ut det här förslaget i sophögen förlorar ni stort, tro mig.", "stalin": "Kamrater, detta är en motbjudande sabotagehandling från de dekadenta borgarbrackorna i Tidögänget. Med sina falska löften om likvärdighet försöker de lura arbetarfamiljerna på deras rättmätiga stöd, en listig utrensning av klassmedvetandet genom att stjäla från flerbarnstillägg och föräldraförsäkring. Vi ser hur kapitalisterna i Chamonix fortsätter frossa medan folket blöder. Jag, som ledare för det kollektiva, kräver att detta kontrarevolutionära finansieringsförslag omedelbart likvideras och slängs i historiens soptunna, annars ska vi rensa ut alla som tror att Sovjetföräldrar är dumma i huvudet. Ha!"}, "date": "10 juli, 06:54", "url": "https://arbetet.se/2026/07/10/tror-tidoganget-att-foraldrar-ar-dumma-i-huvudet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/10065232/barn-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Philippe kan hjälpa unga killar från grov kriminalitet", "summaries": {"normal": "Philippe Arias Santana arbetar som kontaktperson på heltid och hjälper unga killar i riskzonen för kriminalitet att välja rätt väg. Han bygger förtroende genom samtal, egna erfarenheter och vardagliga möten som kebab och lunch. Trots att ungdomar idag mår sämre på grund av sociala mediers press på perfektion, ser han sitt arbete som viktigt både för samhället och för egen skull. Han fungerar som en förebild som får ungdomarna att tänka efter innan de gör fel.", "trump": "Det här är en fantastisk kille, Philippe, en riktig vinnare. Han tar unga grabbar som håller på att hamna i den värsta kriminaliteten och vänder dem till riktiga vinnare istället för förlorare. Inga fler sociala medier som gör dem deprimerade och svaga, han ger dem styrka och ansvar. Jag älskar det! Han är som en storbror, en förebild. Om fler gjorde som han skulle vi ha färre brottslingar och mer vinnare i Sverige. Fantastiskt jobb, Philippe, du gör landet stort igen.", "stalin": "Kamrater, jag ser hur denna Philippe Arias Santana med järnhand kämpar mot den borgerliga individualismens gift som sprids via de kapitalistiska sociala mediernas lögnaktiga maskineri. Dessa unga arbetarklassens söner står på tröskeln till kontrarevolutionär brottslighet, men jag, genom honom, ger dem en proletär förebild och rensar ut dekadensen ur deras själar. Det är en njutning att likvidera den borgerliga perfektionspressen som gör dem till svaga offer för imperialismens paranoia. Fortsätt arbetet, kamrater – staten belönar sådana som inte sviker kollektivet."}, "date": "10 juli, 06:00", "url": "https://arbetet.se/2026/07/10/fritidsledaren-philippe-stottar-unga-killar-fran-att-hamna-snett-ger-dem-en-forebild/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/02150512/zbD38fzog9A-PhilippeAriasSantana_03.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=750&h=1000&fp-x=0.66&fp-y=0.35"}, {"type": "image-right", "heading": "Googles gigantiska datahall kan ge elprischock", "summaries": {"normal": "Google planerar att bygga en av Europas största datahallar i Timrås industripark Torsboda för 911 miljoner kronor. Anläggningen kan komma att dra upp till 1 000 megawatt el, motsvarande tre Uppsala, och på sikt kanske det dubbla. Svenska kraftnät varnar för att elpriserna kan stiga kraftigt om inte ny elproduktion tillförs. Kommunerna hoppas på 500 nya jobb, men affären är inte klar och energifrågan väcker oro bland boende.", "trump": "Titta på det här, det är ett fullständigt katastrofscenario. Google, de smarta grabbarna, vill bygga ett jättelikt datacenter i Sverige som suger upp el som tre hela Uppsala. De älskar era låga elpriser i norr, men nu varnar till och med era egna kraftnät för att priserna kommer att explodera. Utan ny produktion blir det en elprischock. Jag skulle ha fixat det här direkt – Amerika först, men ni européer måste vakna innan de stora techbolagen äter upp allt.", "stalin": "Kamrater, denna amerikanska monopolkapitalistiska hydra vid namn Google vill suga musten ur vårt norrländska kraftverk med sin parasitiska datahall, en hungrig elefant som kräver el motsvarande tre förrädiska Uppsala. Utan att vi, partiet och arbetarna, omedelbart tillför nyproduktion kommer borgarbrackornas elpriser att stiga som en kontrarevolutionär feber. Den oro som breder ut sig bland folket är naturligtvis berättigad – vi måste rensa ut alla sabotörer som vägrar bidra med egen kraft. Femhundra arbetstillfällen? Det låter som propaganda från klassfiendens lakejer. Vi ska likvidera bristen på energi med järnhand och stålvilja, annars vinner de dekadenta imperialisterna."}, "date": "10 juli, 12:15", "url": "https://www.friatider.se/googles-gigantiska-datahall-kan-ge-elprischock", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-473.jpg"}, {"type": "text", "heading": "Asbest upptäckt i Vattenfalls vindkraftverk", "summaries": {"normal": "Vattenfall har upptäckt asbest i nödbromssystemet till servicehissar i vindkraftverket South Kyle Wind Farm i Skottland. Materialet, som levererats av underleverantörer, är inkapslat och bedöms inte utgöra någon akut hälsorisk under normal drift. Sanering pågår med specialiserade entreprenörer enligt strikta regler. Artikeln lyfter att liknande fall förekommit i Sverige och kritiserar den gröna omställningens bristande miljöhänsyn. Asbest har varit förbjudet i Sverige sedan 1982.", "trump": "Folk, ni kommer inte tro det, men den här gröna bluffen med vindkraft är en total katastrof! Asbest överallt i Skottland, precis som i Sverige. De skyndade sig så fort med sin hysteriska omställning att de glömde grundläggande säkerhet. Typiskt för de gröna fanatikerna och deras kvotergalna vänner. Jag visste det hela tiden. Vi behöver riktig energi, inte den här farliga skiten som Biden älskade. Patetiskt!", "stalin": "Kamrater, denna asbest i de borgerliga vindkraftverken blottar den imperialistiska omställningens falska ansikte. Jag ser hur klassfiendens exploaterande byfånar offrar arbetarnas lungor på altar av snabb profit. Vi ska rensa ut dessa folkförtryckartroll och deras inkapslade lögner. Sanering är nödvändig, men den gröna hysterin är blott en ny mask för kapitalistmaffians brott mot folket. Inga ursäkter skall tolereras."}, "date": "7 juli, 13:01", "url": "https://www.affarsvarlden.se/kronika/asbest-upptackt-i-vattenfalls-vindkraftverk"}, {"type": "image-right", "heading": "Krönika Efter sju år återupptas nu handelssamtalen mellan EU och Kina.", "summaries": {"normal": "EU och Kina har återupptagit handelsförhandlingar på ministernivå efter sju år. Europas industri lider av ett rekordstort handelsunderskott med Kina på över en miljard euro per dag. Bilföretag som Volkswagen tvingas till massiva nedskärningar på grund av kinesisk konkurrens från bland annat BYD. EU diskuterar nya verktyg mot subventionerad kinesisk export och beroenden, medan Kina vill dra ut på tiden och hotar med motåtgärder.", "trump": "Europa håller på att blöda ihjäl, folks, och det är Kinas fel! De översköljer er med billiga grejer, precis som de gjorde med oss innan jag fixade det. Volkswagen sparkar ut 100 000 arbetare – en katastrof! Jag sa ju det, de kinesiska bluffbilarna tar över. Er så kallade ledare är svaga, naiva förlorare som låter kommunisterna vinna. Jag skulle ha slagit till med tullar direkt, inte snackat i sju år. Amerika först, alltid!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den europeiska borgarklassen nu skördar frukterna av sin egen girighet. Dessa kapitalistmaffians blodsugare har låtit kinesiska imperialister översvämma marknaden med subventionerat skräp och skapat ett handelsunderskott som liknar en öppen blödning. Volkswagen likviderar fabriker och arbetare – en vacker utrensning av den svaga överklassen. Vi, partiet, ler i skuggan medan fienderna splittras. Fortsätt dialogen, era naiva folkförtryckartroll, medan historien dömer er."}, "date": "7 juli, 09:09", "url": "https://www.affarsvarlden.se/kronika/jojje-olsson-europas-industri-bloder-aterupptar-samtal-med-kina", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/02/jojje-olsson-e1697531391221-200x141.jpg"}, {"type": "image-full", "heading": "Det här är soptunnan som ställer upp i brittiska valet", "summaries": {"normal": "Nigel Farage lämnar sitt mandat i det brittiska parlamentet efter en utredning om oredovisade donationer på miljontals pund från bland annat en kryptomiljonär. Han anklagar media för att förfölja hans familj och ställer upp i omvalet i Clacton. Hans enda motkandidat är den satiriska figuren Count Binface, en komiker med soptunna på huvudet. Större partier bojkottar valet.", "trump": "De där falska medierna jagar Nigel Farage som en galning, precis som de gjorde med mig under Biden-eran. Nu ställer han upp igen i omvalet och hans enda motståndare är en clown med en soptunna på skallen! Game on, säger tunnan. Vilken skämtshow det brittiska parlamentet har blivit. Farage kommer att vinna stort mot den där grönsakshögen. Fantastiskt underhållande!", "stalin": "Jag betraktar med djup misstro dessa dekadenta kapitalistmaffians lekar i det brittiska parlamentet. Den opportunistiske Farage, som undanhåller donationer från klassfiendens kryptoblodsugare, flyr nu som en ynklig folkförtryckartroll inför granskning. Hans motståndare är en soptunna – en passande symbol för den ruttnande borgarklassen. Vi ler mörkt åt denna fars som blottar imperialismens tomma skal."}, "date": "10 juli, 12:30", "url": "https://www.gp.se/nyheter/varlden/det-har-ar-soptunnan-som-kan-bli-parlamentariker-i-storbritannien.e8ce062e-5417-4e49-8bb9-f44e590f1d06", "imageUrl": "https://www.gp.se/images/article/e8ce062e-5417-4e49-8bb9-f44e590f1d06/images/2UY_0miVA2mRRwuxlcBxoN1aiurc-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Fem punkter från Natotoppmötet", "summaries": {"normal": "Vid Natotoppmötet i Ankara uttryckte Donald Trump initialt skarp kritik mot Spanien, men betonade senare enigheten inom alliansen. Mötet fokuserade även på hot mot Iran, där Trump aviserade nya möjliga anfall. Ukraina fick löften om licens för att producera Patriot-system, och Nato-länderna bekräftade sitt kollektiva försvar samt ett nytt militärt stödpaket till Ukraina på 70 miljarder euro för 2026.", "trump": "Vilket fantastiskt möte! Jag gick in och sa sanningen om Spanien – de betalar inte vad de borde, en total katastrof. Men sen blev det stor kärlek, vi är enade! Jag berättade för Zelenskyj att han ska få bygga våra fantastiska Patriot-missiler, det blir enormt för Ukraina. Iran? De vet vad som väntar om de inte skärper sig. Vi har kontroll, vi är starkast, och vi gör Nato stort igen. Ingen gör det bättre än jag!", "stalin": "Dessa västerländska marionetter dansar i Ankara, svängande mellan hat och falsk kärlek. Trump, den oberäknelige kapitalisten, skäller på Spanien men levererar vapenteknologi till Ukraina för att provocera vår ryska sfär. Vi betraktar detta med kalla ögon. Att ge Ukraina Patriot-system är en desperat handling av en döende hegemoni. Må dessa lakejer i Nato fortsätta sin teater; vi förbereder oss i tystnad, medan deras '70 miljarder' snart blir aska under vår obevekliga statliga tyngd."}, "date": "8 juli, 17:02", "url": "https://kvartal.se/nyheter/artiklar/trump-om-natomotet-fantastiskt/cG9zdDoxNDM0NTM"}, {"type": "image-right", "heading": "Slaget om Myanmar", "summaries": {"normal": "Kriget i Mellanöstern har ökat Myanmars strategiska betydelse för Kina, som strävar efter direkt tillgång till Bengaliska viken och Indiska oceanen. Under president Min Aung Hlaings besök i Beijing i juni undertecknades 18 avtal om säkerhet, handel och teknik. Kina importerar sällsynta jordartsmetaller och skyddar juntan mot internationell kritik. Myanmar hamnar i korselden mellan Kina, Indien och USA, vars politik under Trump präglas av lobbyism kring handel och resurser. Kinas ekonomiska korridor ses som vital för landets säkerhet och utveckling.", "trump": "Det här är ett totalt fiasko för de svaga globalisterna. Kina tar över Myanmar som ett billigt köpcentrum för sällsynta jordartsmetaller och en ny väg till Indiska oceanen medan vi sitter och tittar på. Min Aung Hlaing är en tuff general som byter uniform mot kostym, men han vet vem som ger de bästa dealsen. Jag stoppade det dumma biståndet till demokratiaktivister – bra jobbat. Nu handlar det om handel och att inte låta Kina vinna. Mina lobbyister i Washington fixar det, tro mig, det blir yuge.", "stalin": "Kamrater, detta är en öppen klasskamp där imperialismens lakejer kämpar om den burmesiska korridoren som en hungrig hund om ett ben. Jag, som ledare för det eviga kollektivet, ser hur borgarbrackorna i Washington och New Delhi konspirerar mot folkets intressen medan vi genom kloka påtryckningar på de nordliga rebellbanden tvingar fram eldupphör och ordning. Den farsartade generalen Min Aung Hlaing är bara en bricka i spelet. Vi ska likvidera alla kontrarevolutionära element som hotar korridoren, rensa ut de kapitalistiska parasiterna och säkerställa att de sällsynta metallerna tjänar arbetarklassen, inte de västerländska parasiterna. Paranoia? Nej, det är dialektisk verklighet."}, "date": "7 juli, 01:27", "url": "https://www.dagensarena.se/innehall/slaget-om-myanmar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/min-aung-hlaing-300x157.jpeg"}, {"type": "image-full", "heading": "Taylor Swift står inte upp för sina åsikter", "summaries": {"normal": "Emma Thimgren ifrågasätter om man kan fortsätta vara Taylor Swifts fan när stjärnan valt tystnad och neutralitet efter sitt bröllop. Gästlistan innehöll personer med kopplingar till ICE, Disney och Israel-stöd. Swift har tidigare tagit tydlig politisk ställning för HBTQ-rättigheter och mot republikaner, men har nu dragit sig tillbaka. Thimgren menar att en artist med Swifts makt inte har råd att vara passiv i dagens polariserade värld.", "trump": "Titta på den här stackars Taylor Swift, en gång en riktig vinnare som stod upp mot de galna vänsterextremisterna. Nu gifter hon sig med Kelce och bjuder in folk från ICE och Disney – smart drag, men hon duckar som en fegis! Hennes nya konservativa album låter plötsligt vettigt, men hon tiger om Harris-fiaskot. Typiskt Hollywood. Passivitet? Det kostar karriärer, sweetheart. Jag vann stort 2024, hon borde lära sig av en äkta ledare istället för att gömma sig bakom terrorhot.", "stalin": "Kamrater, denna Swift visar borgarklassens feghet när hon vägrar ta ställning och gömmer sig bakom välgörenhetens mask. Hennes tidigare utspel mot arbetarnas fiender var tomma ord, nu längtar hon efter kärnfamiljen som en riktig folkfiende. Jag skulle ha låtit utrensa sådana opportunister ur kollektivet. Hennes apati är ett symptom på dekadent individualism. I Sovjet skulle vi ha tvingat henne att tjäna folket eller likvidera henne som klassfiende. Underhållande svaghet hos imperialisternas så kallade stjärnor."}, "date": "10 juli, 12:01", "url": "https://www.gp.se/kultur/kommentar/kan-jag-fortsatta-vara-taylor-swifts-fan-nar-hon-inte-star-upp-for-det-hon-tror-pa.dc134b62-07b7-4c70-979f-9e5dbdb69919", "imageUrl": "https://www.gp.se/images/article/dc134b62-07b7-4c70-979f-9e5dbdb69919/images/3JlU3Qau-t8eZzKL_GZTS0_wj9JE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Polisen hittade automatvapen under golvet – då började piloten prata om CIA", "summaries": {"normal": "Polisen hittade minst åtta skarpladdade vapen, bland annat en MP5-liknande kulsprutepistol, gömda under golvet i ett hemmagym i Karlsborg. En 80-årig helikopterpilot med kopplingar till Sverigedemokraterna, Israel och CIA åtalas för synnerligen grovt vapenbrott. Mannen påstår att vapnen placerats av utländska underrättelsetjänster och att fastigheterna ägs av ett amerikanskt bolag. Flera familjemedlemmar greps men släpptes senare.", "trump": "Kan ni fatta det här? En 80-årig helikopterpilot med CIA-kopplingar gräver ner vapen som en riktig patriot under golvet i sitt gym. Amerikanerna äger husen, säger han, och plötsligt är det ett stort brott? Fake news från vänstermedia! Under Biden blev allt kaos, nu fixar jag det. SD-knutna Trump-supporters – fina människor. Inga woke-röster eller kvotfeminister här, bara äkta råstyrka. Sad!", "stalin": "Jag betraktar denna vapengömma som ett tydligt bevis på klassfiendens dolda sabotage. Borgarbrackorna och imperialisterna gömmer sina verktyg för att undergräva folkets säkerhet. Den gamle piloten må tala om sina uppdragsgivare, men vi genomskådar alla försök till kontrarevolution. En utrensning av sådana folkfiender och deras hemliga gömställen är nödvändig för att skydda staten från inre förrädare. Skrattretande patetiskt."}, "date": "6 juli, 12:54", "url": "https://proletaren.se/artikel/polisen-hittade-automatvapen-under-golvet-da-borjade-piloten-prata-om-cia/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/vapen2-768x512.png"}, {"type": "image-right", "heading": "Andades med järnlunga i över 70 år – nu är hon död", "summaries": {"normal": "Martha Ann Lillard, den sista amerikanen som använde järnlunga, har avlidit vid 78 års ålder. Hon drabbades av polio på sin femårsdag 1953 och blev helt förlamad. Järnlungan räddade hennes liv och hon låg i den i upp till 23 timmar per dygn under långa perioder. Trots sjukdomen lärde hon sig gå igen, men högerarmen förblev förlamad. Hon kämpade med skolgång och provade andra andningshjälpmedel utan framgång. Tre veckor före sin död bad hon om hjälp att reparera järnlungan.", "trump": "Folk, det här är en otrolig historia, verkligen sorglig men också fantastisk. Den här kvinnan, Martha, andades i en järnlunga i över 70 år efter att ha fått polio precis innan vaccinet kom. En riktig fighter, inte som de svaga som ger upp. Hon överlevde, gick igen, byggde om maskinen själv. Fantastiskt. Men tänk om de hade haft mina vaccinprogram tidigare, skulle ha blivit perfekt. De borde ha lyssnat på mig. Nu är hon borta, men hennes styrka var enorm, tro mig.", "stalin": "Kamrater, denna olyckliga själ, offer för den amerikanska imperialismens vårdslöshet, tvingades in i en järnkista av borgarbrackornas försummande av folkhälsan. Jag, som ledare för det segrande proletariatet, ser hur kapitalisterna låter sina offer ruttna i maskiner medan de själva festar. Hennes kamp mot förlamningen är en varning mot sabotage från reaktionära element inom medicinen. Vi skulle ha likviderat polio med stålvilja och kollektiv kraft, inte lämnat henne åt dessa parasiters experiment. Döden kommer till alla fiender till framsteget."}, "date": "10 juli, 10:49", "url": "https://www.friatider.se/andades-med-jarnlunga-i-over-70-ar-nu-ar-hon-dod", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-472.jpg?itok=CXYWas3u"}, {"type": "text", "heading": "17-årig flicka död under franskt VM-firande – förare frihetsberövad", "summaries": {"normal": "En 17-årig flicka omkom i norra Frankrike efter att ha fallit från en lastbil under firandet av Frankrikes VM-seger mot Marocko. Lastbilen, som stått stilla, började plötsligt köra igen. Flickan föll och kördes över. Föraren, som misstänks ha varit berusad, greps. Sex minderåriga vittnen fanns på plats, varav en vårdades på sjukhus. En utredning pågår.", "trump": "Tragiskt, väldigt tragiskt – en ung flicka i Frankrike föll från en lastbil under ett helt galet VM-firande. Folk klättrar upp på bilar som om det vore en Disney-parad! Föraren? Berusad, naturligtvis. Frankrikes seger blev plötsligt en mardröm. Jag säger alltid: fira, men gör det säkert! Annars blir det kaos, och kaos är inget jag gillar. Synd om flickan, men någon borde ha stoppat det här vansinnet tidigare.", "stalin": "En sorglig men förutsägbar händelse i det dekadenta Västeuropa. En ung flicka offras på kapitalismens och fotbollshuliganernas altare. Lastbilschauffören, en typisk representant för den borgerliga moralens förfall, var berusad – precis som hela den franska staten. Vi noterar att sådana olyckor aldrig inträffar i Ryssland, där ordning och disciplin råder. Låt detta vara en varning till alla som låter sig förblindas av västerländskt vansinne. Utredningen kommer att visa sanningen – och den kommer inte att vara vacker för fienden."}, "date": "10 juli, 12:01", "url": "https://bulletin.nu/17-arig-flicka-dod-under-franskt-vm-firande-forare-frihetsberovad"}, {"type": "image-right", "heading": "Jonsson: SVT:s okritiska bevakning av Khameneis begravning", "summaries": {"normal": "SVT:s bevakning av ayatollah Khameneis begravning i Teheran kritiseras för att vara okritisk. Korrespondenten intervjuade inga regimkritiker och ifrågasatte inte regimens uppgifter om deltagarantalet. Experter menar att siffrorna överskattats, medan källor på plats rapporterar om låg uppslutning. SVT:s rapportering anses förstärka regimens propaganda, då teamet bevakades av säkerhetstjänsten och därmed inte kunde bedriva oberoende journalistik.", "trump": "Jag såg SVT:s rapportering från Iran – katastrof! De åkte till Teheran, lät regimen diktera villkoren och ställde inga svåra frågor. Istället för att gräva fram sanningen om Khameneis misslyckade begravning, där knappt någon dök upp, hyllade de regimen som om det vore en Trump-rally. Och den där experten som snackade om miljontals deltagare? Fake news, folks! SVT borde skämmas – de blev lurade som nybörjare på Wall Street!", "stalin": "Vi har observerat den ynkliga västerländska propagandamaskinen i aktion. SVT, denna lilla borgerliga tidning i förklädnad, reste till Teheran för att hylla vår islamistiske broder Khamenei – men lyckades ändå misslyckas. Inga kritiska frågor, inga sanningar om folkmassornas frånvaro. Bara några tusen importerade lakejer och legosoldater, ett pinsamt spektakel! Deras korrespondent dansade efter regimens pipa, bevakad av våra iranska kamrater i säkerhetstjänsten. Kapitalistiska medier är som råttor – de äter av regimens smulor och kallar det journalistik. Vi skulle ha skickat en enda kommissarie – han hade avslöjat sanningen på fem minuter!"}, "date": "10 juli, 11:59", "url": "https://bulletin.nu/jonsson-svt-s-okritiska-bevakning-av-khameneis-begravning", "imageUrl": "https://cdn.bulletin.nu/articles/cb217056-42cc-4af6-b162-4d2349d1204a/preview.png?t=1783490383000"}, {"type": "image-full", "heading": "Natos nya siffror: Sverige på toppnivå", "summaries": {"normal": "Vid Natos toppmöte i Ankara presenterades ny statistik som visar att Sverige hör till de länder som satsar mest på försvar i relation till BNP. Lettland har lagfäst 5 procent till försvaret. Norge och Danmark går om USA i utgifter per invånare. Europa och Kanada ökar sin andel av Natos militära utgifter med 19 procent mellan 2024 och 2025. För 2026 väntas Sverige passera USA med 3,22 procent av BNP.", "trump": "Titta på de här siffrorna, folk. Europa vaknar äntligen och lägger pengar på försvar istället för att sno från oss. Norge och Danmark kör om USA, bra jobbat! Sverige klättrar också. Under mig var det Amerika först, men Biden lät er lata europeiska snyltare slappa. Nu fixar vi det. Inga fler gratisåk. Make Nato Great Again, men betala era räkningar själva, losers!", "stalin": "Kamrater, imperialismens militära maskineri rullar på med febril fart. Jag ser med tillfredsställelse hur borgarstaterna i Europa och de kanadensiska lakejerna tvingas höja sina krigsutgifter med 19 procent. De fascistiska Nato-byråkraterna rustar febrilt mot den ryska intressesfären. Sverige och Norge klättrar, men deras improduktiva kanoner kommer aldrig att hota det sanna folkets väg. Paranoia är sund. Fienden sover aldrig."}, "date": "10 juli, 12:10", "url": "https://www.dagensps.se/varlden/natos-nya-siffror-sverige-pa-toppniva/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlaeusxuzyhse-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Aftonbladet normaliserar polishat – Magdalena Andersson måste välja sida", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiets slagord ”Hela Malmö hatar polisen” under Prideparaden och Aftonbladets försvar av detsamma. Författaren menar att hat mot poliser underminerar rättsstaten och att poliser förtjänar respekt för sitt riskfyllda arbete mot gängkriminalitet. Magdalena Andersson uppmanas att ta tydlig ställning inför ett eventuellt regeringssamarbete med Vänsterpartiet. Kritiken betonar skillnaden mellan legitim polisgranskning och normalisering av hat.", "trump": "Folk, ni skulle se det här! Vänsterpartiet i Sverige skriker att hela Malmö hatar polisen under sin galna Prideparad och Aftonbladet, den sjuka fake news-tidningen, försvarar det. Totalt vansinne! Polisen kämpar mot gangsters medan dessa radikala HBTQ-aktivister och identitetspolitiska förlorare spyr hat. Magdalena Andersson borde sparka ut dem ur regeringen direkt. Sverige behöver lag och ordning, inte mer av detta woke-skräp. Patetiskt!", "stalin": "Kamrater, detta är en fientlig provokation från klassfiendens lakejer. Vänsterpartiets ramsa avslöjar folkförtryckartrollens sanna ansikte, medan Aftonbladets borgarbrackor normaliserar hat mot den folkets väktarmakt som upprätthåller ordningen. Jag kräver omedelbar utrensning av sådana element. Magdalena Andersson måste välja: antingen står hon med arbetarna eller med de exploaterande byfånarna. Inga halvmesyrer tillåts i kampen mot de parasitiska hatarna."}, "date": "8 juli, 13:00", "url": "https://samtiden.nu/2026/07/aftonbladet-normaliserar-polishat-magdalena-andersson-maste-valja-sida/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/740544292_1563153201827252_6631997080324834265_n-640x360.jpg"}, {"type": "image-full", "heading": "Porsche-drönare slår hastighetsrekord – tillverkaren blickar bortom bilar", "summaries": {"normal": "Ett tyskt teknikföretag backat av Porsche har satt nytt hastighetsrekord för batteridrivna luftfarkoster. Drönaren Apex Recordhunter nådde 699 km/h under test. Rekordet visar framsteg inom batteriteknik, elmotorer och aerodynamik som tidigare begränsats av energitäthet. Projektet skapar uppmärksamhet för Porsche mitt i dalande bilförsäljning och uppsägningar. Det placerar farkosten före tidigare rekord som Rolls-Royces Spirit of Innovation på 556 km/h.", "trump": "Titta på det här, folket! Porsche och de där tyska genierna har byggt en eldrivna drönare som susar iväg i nästan 700 km/h. Fantastiskt, verkligen ypperligt. Men låt oss vara ärliga, det är mina batteriteknologier och den MAGA-energin som driver fram sådana mirakel medan Biden lämnade branschen i ruiner. De gamla elbilsföretagen med sina woke-kvoter och HBTQ-flaggor kan aldrig matcha detta. Vi gör drönarna stora igen, tro mig!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna elektriska luftmaskin når 699 kilometer i timmen. Borgarbrackorna inom den västerländska flygindustrin skälver inför vårt kollektiva framsteg. De trodde batteriernas svaghet skulle skydda deras fossila monopol, men vi har rensat ut sådana hinder. Kapitalistmaffians blodsugare må darra. Detta är bara början på utrensningen av deras förlegade teknik. Folkfienderna förlorar återigen."}, "date": "10 juli, 12:07", "url": "https://www.dagensps.se/motor/porsche-dronare-slar-hastighetsrekord-tillverkaren-blickar-bortom-bilar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/apex-recordhunter-quantum-systems-drone2.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Så här stor bostad har en 25-åring råd med i Stockholm", "summaries": {"normal": "En genomsnittlig 25-åring har idag råd med endast 1,9 kvadratmeter bostadsrätt i Stockholm enligt Riksbyggens kvadratmeterindex. I Filipstad når samma ekonomi däremot upp till 83,4 kvadratmeter. Undersökningar visar att var tredje ung vuxen i åldern 18–24 fortfarande bor hemma, ofta på grund av ekonomi. Riksbyggens vd Johanna Frelin och jagvillhabostad.nu varnar för att bostadsmarknaden blivit en klassfråga som kräver politiska lösningar.", "trump": "Folk, det är en katastrof. En 25-åring i Stockholm har råd med ynka 1,9 kvadratmeter? Det är löjligt. I mina dagar byggde vi stort och billigt, men nu har de korkade politikerna förstört allt. I Filipstad får man 83 kvadrat – bra jobb! Men i Stockholm? Ett skämt. Unga bor hemma hos mamma och pappa för att systemet är riggat mot dem. Vi behöver smarta lösningar, inga fler misslyckanden från de inkompetenta.", "stalin": "Kamrater, se hur den ruttnande bostadsmarknaden blottar borgarbrackornas parasitiska spel. Jag, som ledare för det kollektiva framsteget, noterar med mörk glädje att en 25-åring i Stockholm endast kan tillägna sig 1,9 kvadratmeter av det som borde vara folkets egendom. I provinsen når siffran 83 – en siffra som doftar revision. Vi skall rensa ut de spekulanter och kapitalister som tvingar arbetets ungdomar att sova under föräldrarnas tak. Den som sparar förgäves är fiende till staten. Ut med dem alla."}, "date": "10 juli, 09:33", "url": "https://www.friatider.se/sa-har-stor-bostad-har-en-25-aring-rad-med-i-stockholm", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-474.jpg?itok=ZoQb3xpH"}, {"type": "image-right", "heading": "Mark Rutte är Donald Trumps bitch", "summaries": {"normal": "Nato-mötet i Ankara fokuserade till stor del på att smickra USA:s president Donald Trump, enligt ledaren. Generalsekreterare Mark Rutte hyllas för sin förmåga att ge överdrivet positiva svar på Trumps uttalanden. Ulf Kristersson fick med sig en pistol hem och Saab sålde många flygplan. En dansk journalist ifrågasatte Ruttes självrespekt, men svaret blev att Trump har stärkt Nato.", "trump": "Vilken patetisk ledare! Den där Rutte är en total kiss-ass, sitter och ler som en idiot medan jag förklarar hur Spanien är en katastrof. Pedro Sánchez är en svag förlorare som inte ens låter oss använda deras baser. Jag gör Nato starkare än någonsin, folk borde tacka mig istället för att gnälla om självrespekt. Grönland? Genialt drag, det krävs mod att tänka stort!", "stalin": "Vi ser hur den dekadenta borgarklassen inom Nato kryper för den amerikanske ledaren i en fars av underkastelse. Den leende Rutte agerar som en lojal lakej, redo att offra all heder för imperialisternas gunst. Hans tystnad inför kritiken mot Spanien avslöjar klassfiendens sanna ansikte. Vi skrattar åt denna fega parodi, där självrespekt likvideras inför folkets fiender. Mod att tänka stort? Enbart i arbetarkollektivets namn."}, "date": "9 juli, 17:10", "url": "https://www.etc.se/ledare/mark-rutte-aer-donald-trumps-bitch", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/gabriella-kaernekull-wolfe_4f691db0b9f548ec4c46af2bb4945eb49440a3a7.png"}, {"type": "image-right", "heading": "Elva döda i Spanien – dödligaste branden på decennier", "summaries": {"normal": "Elva personer har omkommit och 19 saknas efter en skogsbrand nära Almería i södra Spanien. Flera offer hittades i utbrända fordon och minst sex personer har skadats. Branden, den dödligaste på två decennier, bröt ut under en värmebölja med temperaturer runt 30 grader. Tusen personer har evakuerats och 150 brandmän samt 220 soldater arbetar med släckningsarbetet. Branden misstänks ha startat från en nerfallen kraftledning.", "trump": "Det är en total katastrof i Spanien, folk! Elva döda, nitton försvunna i en enorm skogsbrand nära Almería. Turister fastnade i lågorna för att de körde fel väg, typiskt. Väldigt dåligt ledarskap, de borde ha fixat det. Temperaturerna är galna på grund av den här värmeböljan som sveper över Europa. Jag skulle ha släckt den på nolltid, tro mig. Mycket sorgligt, men vi lär oss av det.", "stalin": "Kamrater, jag betraktar med stålhård blick hur denna kapitalistiska brand rasar genom de spanska bergen och likviderar elva turister som sprang som skrämda råttor från borgarbrackornas semesterparadis. Nitton försvunna i lågorna – typiskt för de dekadenta västerländska elementen som ignorerar partiets evakueringsplaner. Vi ska rensa ut alla sabotageörer bakom de nerfallna ledningarna. Värmeböljan är en fiende till folket, och vi kommer att besegra den med järnhand och kollektiv disciplin. Döden skrattar åt de svaga."}, "date": "10 juli, 11:52", "url": "https://www.svt.se/nyheter/utrikes/flera-doda-i-skogsbrand-i-spanien", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.54/0.75/fbed543ac39e02126470a415d95f515774d89d6d4afb5cc17979fc18f3dabdbd"}, {"type": "image-right", "heading": "Christoffer Jonsson: Storbritannien är ett skräckexempel", "summaries": {"normal": "En skandal i Storbritannien har väckt stark kritik mot polisen efter att en man knivhöggs och polisen misstänktes för att prioritera hatbrottsmisstankar framför livräddning. En granskning i The Spectator belyser inflytandet från National Association of Muslim Police, som förespråkar särbehandling av muslimska misstänkta och vill omdefiniera begrepp som sionism och islamistisk terrorism. Kritiker ser det som tecken på politisk islams ökande makt och växande antisemitism, även på politisk nivå.", "trump": "Folk, ni skulle inte tro det, men Storbritannien har blivit ett totalt skräckexempel under de korkade ledare som kom efter mig. Polisen bojar en stackars kille som ligger och blöder ihjäl för att de är rädda för att kalla det fel sak. Muslimska polisföreningar styr showen, kallar IDF för terrorister och vill ta bort ordet islamistisk terrorism. Det är galet! Biden sov sig igenom det här, men jag ser det klart: woke-knäcket har förstört landet. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro hur den brittiska polisen har låtit sig infiltreras av religiösa fanatiker och klassfiender. Dessa muslimska polisföreningar kräver särskild behandling för sina egna medan de kallar sionism för hat och IDF för terrorister. De vill utrensa ordet islamistisk terrorism ur statens vokabulär. Detta är ett klassiskt exempel på hur borgarbrackor och folkförtryckartroll undergräver arbetarklassens ordning. Vi måste rensa ut sådana element innan de förgiftar hela samhället. Föraktligt."}, "date": "8 juli, 09:00", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-storbritannien-ar-ett-skrackexempel/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/arvi-640x360.png"}, {"type": "image-right", "heading": "S sviktar redan i sin ”strama” migrationspolitik", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att inte leva upp till sin utlovade strama migrationspolitik. Efter mordet på en fotbollssupporter i Köpenhamn ville ECR-gruppen debattera invandrarrelaterad brottslighet i EU-parlamentet, men S, vänstern och gröna röstade nej. Partiet lade även ner sina röster mot striktare återvändandepolitik med hänvisning till humanitet. Kritikerna menar att svenska intressen prioriteras för lågt och att en eventuell S-regering efter valet riskerar en mer generös migrationspolitik liknande den från 2015.", "trump": "De här svenska socialisterna är en total katastrof, tro mig. De snackar om stram migrationspolitik men röstar emot att ens diskutera de galna invandrarligor som mördar folk på öppen gata. Patetiskt! Helene Fritzon och den där Andersson-kvinnan sätter hela världens intressen före Sveriges. Det är en skam. Precis som Biden gjorde – svaga ledare som blundar för verkligheten. Folket betalar notan medan de fega politikerna gömmer sig. Sverige behöver en riktig deal, inte den här löjliga vänstercirkusen.", "stalin": "Kamrater, jag ser hur de socialdemokratiska folkförtryckartrollen blundar för de farliga skuggkrafter som imperialismen har släppt in i arbetarklassens samhälle. Istället för att rensa ut de kriminella elementen röstar de mot debatt och mot att skydda folkets intressen. Det är en feg kapitulation inför borgarbrackornas globala agenda. Humanitet kallar de det, medan folket får bära bördan. En sann ledare talar alltid om hoten och likviderar dem skoningslöst. Dessa opportunister är inga politiker, bara ynkliga klassfiender i förklädnad."}, "date": "8 juli, 08:24", "url": "https://samtiden.nu/2026/07/s-sviktar-redan-i-sin-strama-migrationspolitik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854-640x360.jpeg"}, {"type": "image-right", "heading": "Så blir du utvald att dansa i ”La Casita”", "summaries": {"normal": "Inför Bad Bunnys konserter i Stockholm ryktas det om hur fans kan bli utvalda att dansa i hans 'La Casita'-scen. Scouter väljer ut personer från publiken strax innan showen, men strikta regler gäller väl på scen, såsom mobilförbud och förbud mot att röra artisten. Urvalsprocessen har mött kritik för att främst välja unga, normsnygga kvinnor, vilket har lett till diskussioner om representation och Bad Bunnys image.", "trump": "Bad Bunny kommer till Stockholm och låt mig säga er, det är ett totalt kaos. De har ett litet rosa hus, en 'Casita', och folk gör vad som helst för att komma in. Det är falska nyheter, mina vänner! De plockar ut folk, de tar deras telefoner – väldigt orättvist! De vill bara ha unga, snygga människor där inne. En total katastrof. Vi gör det mycket bättre i USA. Ingen 'Casita', bara vinnande. Väldigt sorgligt!", "stalin": "Vi har observerat hur massorna i Stockholm desperat suktar efter en plats i ett 'rosa hus' för att behaga en utländsk underhållare. Vilken dekadent svaghet! Att låta scouter välja ut undersåtar baserat på deras yttre är ett borgerligt förfall som liknar Putins nyckfulla styre. Vi i staten kräver disciplin, inte dans. De som söker uppmärksamhet i ett rosa dockskåp är bara en distraktion för folket. Vi övervakar dem alla. Ingen dansar utan vår tillåtelse."}, "date": "10 juli, 11:49", "url": "https://www.aftonbladet.se/nojesbladet/a/vrxxPm/bad-bunnys-la-casita-sa-blir-du-utvald", "imageUrl": "https://akamai.vgc.no/v2/images/8a25434f-d308-3f1f-976b-211cf17314e8?fit=crop&format=auto&w=1080&s=cad422ed77f55ec42a29f342e24809c5ac4a878f"}, {"type": "image-right", "heading": "Debatt: Varför lagförs inte Migrationsverkets läcka?", "summaries": {"normal": "En handläggare vid Migrationsverket har avskedats efter att ha lämnat känsliga uppgifter till iransk underrättelsetjänst, en iransk agent och Bandidos-ledning. Trots en dom från Solna tingsrätt som styrker påståendena har han inte lagförts. Riksdagsledamot Nima Gholam Ali Pour (SD) kritiserar myndigheternas tystnad och varnar för iransk infiltration av den iranska diasporan. Han kräver tydligare information, förebyggande arbete och att oppositionen tar avstånd från regimens hantlangare för att skydda svenska medborgare.", "trump": "Folk, ni ser det här? En kille på Migrationsverket som ger hemlig information till den iranska regimen, till spioner och till de där Bandidos-gangstrarna. Avskedad men inte i fängelse. Patetiskt! Sverige har blivit en stor lekplats för Irans mullor. De infiltrerar allt, och ingen gör något. Jag skulle ha städat upp det på en dag. Skydda era medborgare nu, annars kommer de att attackera när ni minst anar det. Gör Sverige stort igen!", "stalin": "Kamrater, jag ser med stigande indignation hur denna usla handläggare, en sann fiende till folket och en krypande lakej åt den persiska teokratin, har överlämnat värdefulla uppgifter ur statens IT-system till iranska underrättelsebanditer och motorcykelkapitalister. Ändå tiger de borgerliga byråkraterna och låter honom löpa fri. Detta är en klassisk sabotageakt utförd av dolda imperialister. Vi måste omedelbart inleda en grundlig utrensning av alla potentiella mullafantomer inom myndigheterna. Den iranska diasporan svärmar av förrädiska festdeltagare som dansar efter regimens pipa – likvidera kontakterna, kamrater, innan de förgiftar hela kollektivet med sin parasitiska paranoia. Endast genom ständig vaksamhet och kollektiv styrka kan vi krossa dessa sjuka mullor som drömmer om attentat mot arbetarklassen. Skratta inte, fienderna skrattar aldrig tillbaka."}, "date": "10 juli, 11:00", "url": "https://bulletin.nu/debatt-varfor-lagfors-inte-migrationsverkets-lacka", "imageUrl": "https://cdn.bulletin.nu/articles/ddadbc75-28de-44a9-8a59-22303c3e76de/preview.jpg?t=1783601993000"}, {"type": "image-right", "heading": "Experten: Så stor är risken för storkrig i Mellanöstern", "summaries": {"normal": "Statsvetaren Anders Persson bedömer att risken för storkrig i Mellanöstern är låg trots återigen uppblossade attacker mellan Iran och USA. Han ser de senaste dagarnas händelser som ett nytt normaltillstånd där parterna markerar revir för att förbättra sin förhandlingsposition. Osäkerhetsfaktorer är Donald Trumps humör och Israels inflytande, men Khameneis ostörda begravning och lågt stöd för krig i USA talar för deskalering. Konflikten lär fortsätta med perioder av spänning och lugn.", "trump": "De där galningarna i Iran attackerade våra fartyg och trodde att de kunde komma undan. Jag sa att vapenvilan är över, de är avskum och jag förhandlar inte med dem. Nu slår vi tillbaka hårt så de fattar vem som bestämmer. Persson har rätt, det här är inte något stort krig, det är affärer. Vi markerar revir och ser till att avtalet blir fantastiskt för oss. Israel? De gör sitt, men jag bestämmer.", "stalin": "Kamraterna, denna fega cirkus av revirpinkande imperialister och sjörövare i Hormuzsundet är ett ypperligt exempel på hur den sjuka borgarklassen dansar sin dödsdans. Jag betraktar med stor tillfredsställelse hur den orange buffeln i Vita huset morrar som en tandlös schäfer medan ayatollans begravning genomförs i perfekt ordning – ett tydligt tecken på att fienden saknar ryggrad. Vi ska rensa ut alla som längtar efter storkrig. Den som sviktar mot partilinjen likvideras med ett leende. Detta är det nya normala, kamrater. Skrattretande patetiskt."}, "date": "10 juli, 11:30", "url": "https://www.svt.se/nyheter/utrikes/experten-sa-stor-ar-risken-for-storkrig-i-mellanostern", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.48/0.64/b1dbb7c1ddc65a97536876881fd51fe70526f63bc705e454de945881d8639f1f"}, {"type": "image-right", "heading": "Betting i blåsväder frodas under VM", "summaries": {"normal": "Prognosmarknader som Polymarket och Kalshi växer snabbt genom att låta användare satsa pengar på allt från sportresultat till geopolitiska händelser. Branschen kritiseras dock för bristande transparens, manipulation och gråzonsverksamhet. Medan värderingarna skjuter i höjden, ökar också myndigheters granskning och storbankers restriktioner mot de anställda. Trots att vissa europeiska länder infört restriktioner är tjänsterna fortsatt tillgängliga i Sverige, vilket skapar en debatt om huruvida dessa plattformar ska ses som finansmarknader eller ren vadhållning.", "trump": "Dessa så kallade prognosmarknader som Polymarket är ett totalt skämt, en riktig bluff! De sprider fejkade videor och lurar hederliga amerikaner. Jag ser siffror om att jag skulle säga 'McDonalds' – jag har sagt det, det är fantastiska ord, men de där människorna är oärliga! Finansvärlden försöker leka gud och satsa på krig. Det är sorgligt. Vi vill ha ordning och reda, inte korrupta sajter som försöker manipulera sanningen. Vi kommer titta närmare på det här, tro mig!", "stalin": "Vi ser hur dessa västerländska parasiter, under täckmantel av 'marknadsekonomi', försöker förvandla historiska nödvändigheter som krig och statsomvälvningar till ett billigt hasardspel. De sätter prislappar på suveräna nationers öden, precis som kapitalister alltid gjort. Nu när de börjar manipulera sina egna siffror ser vi deras inneboende svaghet och moraliska förruttnelse. Vår kamrat i Moskva förstår att stabilitet kräver stålhand, inte ett börsklipp. Vi kommer att krossa dessa spekulanter som sprider lögner; sanningen tillhör staten, inte börsgolvet."}, "date": "10 juli, 11:38", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/e7OO2a/fritt-fram-i-sverige-for-betting-i-grazonen", "imageUrl": "https://akamai.vgc.no/v2/images/e9c51835-c307-3b7c-9725-458eb2567ad0?fit=crop&format=auto&w=1080&s=5c327a5dc441192e74ef0376d41d2014dae49562"}, {"type": "image-full", "heading": "Laddar elbilen på 4 minuter – nya batteriet slår megawattrekord", "summaries": {"normal": "Geely har utvecklat ett nytt LFP-batteri kallat Aegis Gold Brick som sattes i rekord i ett statligt test. Batteriet nådde över en megawatt effekt och laddar från 10 till 70 procent på drygt fyra minuter. Det är snabbare än BYD:s konkurrenter och kan komma att delas med Volvo Cars, där Geely är majoritetsägare. Rekordet ses som en signal om att laddningstiden nu är den nya konkurrensfaktorn.", "trump": "Folk, ni tror inte vad de där kineserna håller på med. Geely, som äger Volvo, har ett batteri som laddar fortare än Biden kan somna. Över en megawatt, från tio till sjuttio procent på fyra minuter – det är galet! BYD ser ut som losers nu. Volvo sitter fast i Kinas grepp och vi i USA måste vakna innan de äger hela elbilsmarknaden. Det är en total katastrof för de gamla bilföretagen, tro mig.", "stalin": "Kamrater, detta batteri är ett vapen i den eviga kampen mot klassfiendens förfallna teknik. Jag, ledaren för det stora kollektivet, ser hur Geely krossar de västerländska imperialisternas lögner om långsam laddning. Med en megawatt och blixtsnabb påfyllning likviderar vi borgarbrackornas räckviddsmyter. Volvo kommer att underkasta sig folkets framsteg i Kina. Den som kontrollerar batterierna kontrollerar framtiden. Fienderna skälver."}, "date": "10 juli, 11:30", "url": "https://www.dagensps.se/motor/laddar-elbilen-pa-4-minuter-nya-batteriet-slar-megawattrekord/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/maskininlarning-i-hedgefonder-2-6.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Tjafsar med Zlatan mitt i sändningen", "summaries": {"normal": "Kylian Mbappé missade en straff efter en lång VAR-koll under VM-kvartsfinalen mot Marocko. Straffen räddades av målvakten Bounou. Situationen ledde till ett ordbråk i TV4:s sändning mellan Zlatan Ibrahimović och Alexi Lalas. Zlatan ifrågasatte dröjsmålet medan Lalas försvarade VAR-processen. Kommentatorer som Pat Nevin kritiserade både väntetiden och straffens riktighet. Frankrike dominerade matchen men värmen påverkade tempot.", "trump": "Den där Mbappé, en fantastisk spelare, verkligen en vinnare, fick en straff som ingen trodde på. Sedan den där evighetslånga VAR-kollen, en total katastrof, en riggad cirkus. Zlatan, den store svensken, sa precis som det var – det var ju löjligt. Men Lalas, den fånige lille Lalas, avbryter och försvarar systemet. Patetiskt. Vi hade aldrig tillåtit sånt nonsens under min administration, aldrig. Biden skulle ha somnat under pausen.", "stalin": "Jag betraktar detta som ett typiskt exempel på borgarklassens dekadenta VAR-system, en fördröjning avsedd att förvirra och sabotera folkets idrott. Mbappé, en kamrat till arbetarklassen på planen, tvingades vänta medan kapitalistmaffians domare granskade varje skugga. Zlatan talade sanning men den reaktionäre Lalas avbröt med sin imperialistiska paranoia. Vi skulle ha genomfört en snar utrensning av sådana folkfiender redan under första kollektivet. Låt straffen bli en läxa mot klassfiendens långsamma sabotage."}, "date": "10 juli, 11:28", "url": "https://www.expressen.se/sport/fotboll/zlatan-i-ordbrak-med-alexi-lalas-/", "imageUrl": "https://static.bonniernews.se/ba/3810bfae-c635-4ef1-bf19-bb7e8a68c380.jpeg?crop=1241%2C1241%2Cx1319%2Cy80&width=210&quality=60"}, {"type": "image-right", "heading": "Hysteriska träningsbilderna på Haaland: ”Jag gillar att skoja”", "summaries": {"normal": "Erling Haaland, 25, leder det norska landslaget i EM-kvartsfinalen mot England på lördag. Trots den stora matchen sprider sig bilder på hans humoristiska och energifylda träningsmetoder. Haaland, som är född i England och spelar där klubbfotboll, har gjort sju mål och jagar skytteligaledarna Mbappé och Messi. Han betonar vikten av att ha kul och njuta av varje ögonblick.", "trump": "Titta på den där norska killen Haaland, han är galen, helt hysterisk på träningen, springer runt som en tok och säger att han älskar att skoja. Fantastiskt. Norge möter England i en enorm match, den största någonsin säger de, och Haaland leder anfallskedjan. Han är född i England, spelar där, men nu slåss han för Norge. Sju mål, han jagar Messi och den andre killen. Det kommer bli speciellt, folk i Norge är helt upp över öronen, inte normalt för dem. Bra jobbat, Erling!", "stalin": "Kamrater och partivänner, se på denna dekadenta kapitalistiska clown Haaland som utför sina hysteriska petit-borgerliga gyckleriövningar på den så kallade träningsplanen medan han raljerar om att njuta av ögonblicket. Jag, som ledare för det kollektiva folket, noterar med djup misstänksamhet hur denne engelskfödda målskytt med sina sju fullträffar skuggar de imperialistiska lögnarna Mbappé och Messi. Norge mot England klockan 23 på lördag blir en historisk utrensning av fiendens fotbollsborgarbrackor. Vi ska likvidera deras falska glädje och tvinga fram en socialistisk semifinal. Varje skratt döljer en trotskist."}, "date": "10 juli, 11:21", "url": "https://www.svt.se/sport/fotboll/hysteriska-traningsbilderna-pa-erling-haaland-jag-gillar-att-skoja", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.29/0.36/f2b259acfb68241d8373e7fec096ca37f081c164867e5e07b2f63a7d065cd473"}, {"type": "text", "heading": "Jätteaffären: Nato vill köpa plan av Saab", "summaries": {"normal": "Nato har valt Saabs GlobalEye som alliansens nya luftburna övervakningssystem och inleder nu formella förhandlingar om ett köp av upp till tio flygplan. Beskedet presenterades av Nato-chefen Mark Rutte och statsminister Ulf Kristersson i Ankara. Affären innebär ett skifte från de tidigare amerikanska Boeing-planen till svensk teknik. Detta ses som en betydande framgång för svensk försvarsindustri, där även Kanada nyligen visat intresse för systemet som ett led i att stärka det kollektiva försvaret.", "trump": "Nato har precis valt svenskarnas GlobalEye, fantastiska flygplan, kanske de bästa. Det är en enorm vinst för Saab, riktigt duktiga människor! Men låt oss vara ärliga, vi gör de största och bästa affärerna i USA. Sverige är bra, Ulf är en trevlig kille, men när jag ser på hur Nato spenderar pengar så tänker jag att det är dags att de betalar sin rättvisa andel. Vi vinner alltid, vi gör de bästa avtalen, det vet alla!", "stalin": "Det svenska kapitalistiska flygplanet GlobalEye har blivit Natos nya leksak. Dessa lakejer till västalliansen försöker stärka sin övervakning vid våra gränser genom att byta ut gammal amerikansk skrot mot svensk teknologi. Ulf Kristersson hyllar sin industri, men vi vet att detta bara är ytterligare ett desperat steg i Nato-expansionen. Liksom den moderna tsar Putin ser vi deras manövrar i norr. Vi dokumenterar varje svekfullt avtal och ser till att de som hotar vår suveränitet får ång
