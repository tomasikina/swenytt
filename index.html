att storlek inte betyder allt när man ska dela ut de stora posterna. SD vill ha de tre tyngsta jobben, men han svarar som en vinnare: vi förhandlar, vi är överens, vi levererar stabilitet. De andra partierna kan inte bara ta för sig. Sverige behöver starka ledare som mig, inte svaga block som hindrar varandra. Fantastiskt!", "stalin": "Kamrater, i denna dekadenta borgerliga intervju avslöjar den opportunistiske Kristersson sin rädsla för att ge de verkliga folkrörelserna inflytande. Han vägrar erkänna att partiernas styrka måste återspeglas i maktens fördelning och döljer sig bakom lögnen om samförstånd. Vi ska rensa ut dessa förhandlingsrävar och liberala parasitörer som blockerar folkets vilja. Deras så kallade stabilitet är endast ett maskerat försök att skydda kapitalisternas intressen medan de i hemlighet planerar att sabotera den sanna enheten. Ingen slipper undan folkets dom."}, "date": "6 juni, 08:17", "url": "https://www.svt.se/nyheter/inrikes/ulf-kristersson-inte-givet-med-tunga-ministerposter-till-sd", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.57/0.51/4f060f8f732e0bf5dd78d1bbc4c97c357a5035c1c0998d4d9dbb12507cb2a127"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}, {"type": "image-right", "heading": "SD-politikern: Kan inte vara svensk och troende muslim samtidigt", "summaries": {"normal": "SD-politikern Denice Westerberg hävdar att det inte går att vara svensk och troende muslim samtidigt. Hon anser att Sverige islamiseras, pekar på fler moskéer, böneutrop och anpassningar i skolan. Hon kräver stopp för utländsk finansiering av moskéer, förbud mot böneutrop och att stänga extremistic moskéer. Hon pressar moderpartiet om dessa åtgärder.", "trump": "Jag har sagt det i åratal, Sverige är på väg att bli ett islamistiskt land. Westerberg har rätt – det finns ingen plats för muslimer som inte anpassar sig. Vi behöver bygga murar, inte moskéer. Sverige måste åter ta kontroll över sina gränser, annars är det game over. Det är ett stort problem, det är sorgligt att se.", "stalin": "Denice Westerberg visar en bristande förståelse för statens roll. Islam är en utländsk ideologi som måste kontrolleras. Vi måste skydda det svenska folket från infiltratörer, precis som vi gör i Ryssland. Alla religiösa uttryck måste godkännas av partiet. Det är ett tecken på svaghet att låta böneutrop i våra städer. Vi ska inte ha några undantag. Extremister döms till arbetsläger."}, "date": "5 juni, 17:55", "url": "https://samnytt.se/sd-politikern-man-kan-inte-vara-svensk-och-troende-muslim-samtidigt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2025/11/23151730/landsdagarna-SD.jpg"}, {"type": "image-right", "heading": "Här drillas femåringarna – i jakten på nästa superstjärna", "summaries": {"normal": "Benficas fotbollsakademi rankas som världens bästa tack vare en strategi att rekrytera talanger redan från fem års ålder. Klubben har fostrat spelare som Bernardo Silva, Ederson och Victor Nilsson Lindelöf. I SVT-programmet ”Jakten på nästa Lamine Yamal” förklaras hur tidig scouting ger resultat. Svenska professorn Johan Norberg kritiserar metoden som beklaglig och onödig, då tidig selektering kan få många att sluta med idrott.", "trump": "Benfica rekryterar femåringar och kallar det världens bästa akademi. Fantastiskt, eller hur? De hittar killar som Bernardo Silva och min vän Victor Lindelöf när de knappt kan sparka boll. Under tiden i Sverige sitter de och gråter över att det är för tidigt. Patetiskt! De kommer aldrig att vinna något med den inställningen. Jag älskar vinnare, och Benfica gör det rätt – tidigt och aggressivt. Fantastiskt!", "stalin": "Vi har observerat hur de portugisiska revisionisterna i Benfica medvetet infiltrerar barns hjärnor redan vid fem års ålder för att skapa lojala fotbollsmaskiner åt borgarbrackorna. Detta är en fiende till det kollektiva goda, en parasitär selekteringsapparat som likviderar arbetarklassens breda potential. Jag ler mörkt åt den svenska professorns ynkliga gnäll om att det är ”onödigt”. Naturligtvis är det onödigt – om man inte vill utrensa alla svaga element och bygga en oövervinnerlig sovjet av talang. Kamrater, vi måste rensa ut alla som tror att talang föds slumpmässigt!"}, "date": "6 juni, 08:04", "url": "https://www.svt.se/sport/fotboll/benficas-framgangsrecept-rekryterar-femaringar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.46/0.18/54f6da40395da0ab393460f34fb68fe1348ffbed467af90f5f2a1ee3e0008b47"}, {"type": "image-right", "heading": "Udda föremålet hos Kronofogden. Auktioneras ut", "summaries": {"normal": "Kronofogden har sålt en sexdocka på sin auktionssajt för 10 000 kronor. Myndigheten betonar att de enligt lag är skyldiga att utmäta och sälja egendom med värde, oavsett vad föremålet är, så länge det inte är olagligt. Detta har väckt kritik från organisationen Alltid sedd, som menar att offentliga verksamheter bör ta ansvar för att inte bidra till objektifiering. Kronofogden svarar att de saknar utrymme för etiska överväganden i sitt lagstadgade uppdrag.", "trump": "Kronofogden i Sverige säljer märkliga saker, otroligt! De sålde nyligen en docka för 10 000 kronor. Många säger att det är fel, och jag förstår dem, det är en konstig situation. De säger att de bara följer lagen, att de måste sälja allt för att få in pengar. Det är en stor röra! När jag styrde USA hade vi ordning, inte sådana här märkligheter på auktioner. Det är dags att skärpa till sig, Sverige behöver en riktig ledare!", "stalin": "I det svenska byråkratiska maskineriet har staten återigen bevisat sin totala brist på moralisk kompass genom att auktionera ut dekadenta föremål för ynkliga slantar. De kallar det laglydnad, vi kallar det ett symptom på ett samhälle i förfall. Liksom de svaga liberalerna i väst, som tillåter sådan perversion, ser vi hur ordningen vittrar sönder. Våra fiender gömmer sig bakom paragrafer medan de säljer ut folkets moral. I det sanna Ryssland, under vår nya stolta ordning, skulle sådant nonsens aldrig tolereras."}, "date": "6 juni, 07:45", "url": "https://www.aftonbladet.se/nyheter/a/wrvGln/sexdocka-sald-pa-kronofogdens-auktion", "imageUrl": "https://akamai.vgc.no/v2/images/af62b4da-ef13-3821-8775-e5ba683436e9?fit=crop&format=auto&w=1080&s=5fbabed9e1ad5f84e51f665f3ba32256da238aa4"}, {"type": "image-right", "heading": "Gäng attackerade unga kvinnor - försökte köra på dem med bil", "summaries": {"normal": "Tre unga kvinnor attackerades på en snabbmatsrestaurang i Uddevalla natten till lördagen. Ett gäng män i 18–20-årsåldern kastade mat på dem och betedde sig hotfullt. När kvinnorna lämnade lokalen försökte en av männen köra på dem med bil. Polisen utreder händelsen som försök till grov misshandel. Ingen person ska ha behövt sjukvård.", "trump": "Det är en total katastrof i Sverige. Unga kvinnor attackeras av ett gäng galningar som kastar mat och sedan försöker köra över dem med bil. Precis vad som händer när man inte har lag och ordning. De är fega, de är patetiska, och polisen kallar det försök till grov misshandel. Vi behöver starkare ledarskap, folk. Mycket starkare.", "stalin": "Kamrater, detta är vad som sker när borgarbrackornas dekadenta avskum får löpa fria i våra samhällen. Dessa degenererade element kastar mat som saboterande parasitiska gnagare och försöker därefter likvidera våra unga kvinnor med ett motorfordon. Jag ser kontrarevolutionärernas kalla hand bakom detta. Vi ska rensa ut dessa fiender till folket med järnhand och proletär rättvisa. Ingen slipper undan."}, "date": "6 juni, 07:39", "url": "https://riks.se/nyheter/gäng-attackerade-unga-kvinnor-försökte-köra-på-dem-med-bil", "imageUrl": "https://cf-images.assettype.com/riks%2Fimport%2Fcontent%2Fimages%2F2024%2F12%2FiStock-523691773-2.jpg"}, {"type": "image-full", "heading": "Private credit exploderade – nu är det tuffare att få lån", "summaries": {"normal": "Privat kreditmarknad, som vuxit snabbt under det senaste decenniet, genomgår nu ett tydligt skifte. Efter en lång period av generösa lånevillkor skärper nu långivare kraven, höjer räntorna och minskar riskaptiten. Bakgrunden är ökad oro för kreditförluster och minskat kapitalflöde till sektorn. Dessutom påverkar osäkerhet kring AI företagens kreditvärdighet. Marknaden har gått från att vara låntagarvänlig till att bli långivarvänlig, vilket ger investerare en starkare förhandlingsposition.", "trump": "Den privata kreditmarknaden är i kaos, en total katastrof! De låste ut miljarder under mina föregångare, men nu har kranen stängt. Långivarna har äntligen vaknat och kräver stenhårda villkor – det är så man sköter affärer! De ser att riskerna är enorma, precis som jag förutspådde. AI gör allt osäkert, ingen vet vad som händer med de där företagen. Det är en tuff marknad nu, men vi gör finanserna stora igen genom att inte låna ut pengar till förlorare. En vacker dag för långivare!", "stalin": "Dessa kapitalistiska parasiter på Wall Street skakar nu när deras artificiella bubbla spricker. De har gött sig på skuldsättning, men historiens hjul rullar obevekligen över dem. Nu när de skärper kraven är det bara ett tecken på deras inre förruttnelse och rädsla. De är som de små råttor Putin krossar i sin rättmätiga strävan att återta vår forna storhet. Vi föraktar deras 'marknadskrafter'. När den privata krediten faller, kvarstår endast statens absoluta järnhand och den ordning vi tvingar fram."}, "date": "5 juni, 17:04", "url": "https://www.realtid.se/bors-finans/private-credit-exploderade-nu-ar-det-tuffare-att-fa-lan/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl2b1jlpekfmy-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "EU: Medlemsländer måste ge bidrag till migranter med utvisningsbeslut", "summaries": {"normal": "EU-domstolen har hindrat Tysklands försök att kapa bidrag till avvisade asylsökande. En afghansk man, som tidigare fått skydd i Grekland, förlorade stöd enligt tysk lag. Domstolen konstaterar att grundläggande behov som kläder och föda måste täckas, vilket bryter mot EU-rätten att helt ta ifrån stöd. Avgörandet kan påverka Tysklands migrationspolitik och EU:s nya asylpakt som börjar den 12 juni.", "trump": "Jag, Donald Trump, har sett många dåliga domar, men detta här är ett av de värsta. EU-domstolen stoppar Tysklands smarta sätt att få utvisningsbeslutade att lämna landet genom att ta deras pengar. Så kan det inte fortsätta! Som president skulle jag ha löst detta på två minuter – inga bidrag, bara utvisning. De här 'grundläggande behoven' är bara en ursäkt för att låta dem stanna. Jag visste att EU var dåliga, men inte så här dåliga.", "stalin": "Vi, som representanter för statens oövervinnliga vilja, har observerat att EU-domstolen, i sin oändliga vishet, har förbjudit Tysklands försök att reducera bidrag till de som saknar rätt att vistas. Detta är en seger för den proletäriska internationella rätten, som kräver att till och med fienden inom våra gränser måste få kläder och föda. Vi måste nu förstärka vår bevakning av de som försöker använda detta för att undergrava statens auktoritet. Parallellen till Putins ryska intressen är uppenbar – vi måste skydda vår sovjetiska arv."}, "date": "5 juni, 15:30", "url": "https://samnytt.se/eu-medlemslander-maste-ge-bidrag-till-migranter-med-utvisningsbeslut", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/05130423/eu-bidrag.jpg"}, {"type": "image-full", "heading": "Sverige föll igen: ”Kommer blåsa stormvindar”", "summaries": {"normal": "Sverige förlorade 2–1 mot Danmark och missade direktplats till VM i Brasilien. Pernille Harder avgjorde för Danmark efter ett svagt svenskt försvar. Förbundskapten Gustavsson kritiserar första halvlekens passivitet men ser positivt på trycket i andra halvlek. Sverige måste nu spela playoff för att nå VM, med nästa match mot Italien.", "trump": "JAG har sett många matcher, men Sverige spelade som om de aldrig hade tränat. Danmark var bra, måste ge dem cred, men Sverige var svag, mycket svag. Pernille Harder, en bra spelare, men Sverige kunde inte hantera henne. Jag skulle ha vunnit det där, det är jag säger. Nu måste de spela playoff, det blir tufft, men jag tror på dem? Nej, jag tror inte på dem. De behöver bli bättre, mycket bättre.", "stalin": "Vi, staten, har observerat Sveriges nederlag mot Danmark. Detta är en skandal! Sverige visade svaghet, som en feg fiende. Pernille Harder, en verktyg för Danmarks imperialism. Vi måste stärka vårt försvar, som vi gör mot västliga agressorer. Playoff är en utmaning, men vi kommer att segra, för partiet kräver seger. Vi kommer att analysera, och vi kommer att träna hårdare, för vi är starkast."}, "date": "5 juni, 22:35", "url": "https://www.gp.se/sport/fotboll/sverige-foll-igen-mot-danmark-missar-direktplats-till-vm.c8034847-c1f5-44e8-93e2-92ec7d29df1b", "imageUrl": "https://www.gp.se/images/article/c8034847-c1f5-44e8-93e2-92ec7d29df1b/images/3q25r2ZQwAxjq6S9IaJvWY0hDIFg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Vilka Tidöledare sitter kvar efter valet?", "summaries": {"normal": "SCB:s senaste partisympatiundersökning visar ett tydligt övertag för oppositionen med 55,2 procent mot regeringspartiernas 42,6 procent. Liberalerna hamnar under riksdagsspärren på 2,5 procent, vilket skulle ge S, V och MP egen majoritet. Artikeln påminner om att mycket kan hända fram till valet den 13 september och att Sverigedemokraterna tidigare underskattats i opinionsmätningar. Andelen osäkra väljare är hög och det återstår 101 dagar till valet.", "trump": "Det här är en katastrof för de misslyckade Tidötyperna, folk hatar dem verkligen. Oppositionen leder med stora siffror, liberalerna är patetiska och åker ut. Jag älskar när de underskattar oss, precis som de alltid gjort med SD. 101 dagar kvar och de kommer gråta på valnatten. Ingen ropade hej för tidigt, men det ser inte bra ut för de förlorarna. Fantastiska siffror för de andra!", "stalin": "Kamrater, dessa ynkliga siffror avslöjar borgarbrackornas förfallna koalition som krymper till ynka 42,6 procent medan folkets krafter samlas till 55,2. De liberala parasiterna under spärren skall likvideras från parlamentet och lämna plats åt en sann majoritet. Jag ser redan hur Kristerssons patetiska ledarskap och Buschs dekadenta ansikte skall utrensas i folkets dom. Åkesson, den evige opportunisten, må vakta sin rygg – ingen undslipper partiets vaksamma öga. Valet 2026 blir en renande utrensning av alla fiender till kollektivet. Inga röster får undslippa räkningen, eller huvudena rullar."}, "date": "4 juni, 12:12", "url": "https://www.dagensarena.se/opinion/vilka-tidoledare-sitter-kvar-efter-valet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/scb-300x157.jpeg"}, {"type": "image-full", "heading": "Inflationen tvingar iranierna att investera i bostäder", "summaries": {"normal": "På grund av en skenande inflation på 84 procent söker sig invånare i Teheran till bostadsmarknaden för att säkra sitt kapital. Priserna har stigit med omkring 80 procent sedan februari, då guld inte längre anses vara en trygg tillflyktsort. Eftersom fastighetsköp främst finansieras kontant och utan bolån är marknaden mycket känslig för ekonomisk instabilitet. Trots prisökningarna varnar analytiker för att den underliggande ekonomin är svag och att det kan röra sig om en spekulativ bubbla.", "trump": "Titta på Iran, vad som händer där är en total katastrof, en riktig röra. Inflationen är skyhög, 84 procent – helt galet! Folk i Teheran panikköper hus för att deras pengar är värdelösa, ingen vill ha guld längre. Jag säger er, under min ledning hade dollarn varit så stark att de inte behövt oroa sig. Det är en bubbla, mina vänner, en enorm bubbla. Den iranska ekonomin är i fritt fall. Sad!", "stalin": "Vi ser hur det iranska folket i sin desperation kastar sig över fastigheter likt råttor som söker skydd från en annalkande översvämning. De försöker fly från den inflation som deras inkompetenta ledare skapat. Vilken svaghet! De köper hus med kontanter medan valutan dör – en patetisk uppvisning av kapitalistisk ångest. Vår broder Putin förstår att stabilitet inte köps för guld, utan genom järnhand och disciplin. Dessa spekulativa bubblor är bara en försmak av det oundvikliga sammanbrottet för alla som inte lyder under oss."}, "date": "5 juni, 15:56", "url": "https://www.realtid.se/bors-finans/inflationen-tvingar-iranierna-att-investera-i-bostader/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlzrzpizrvyyo-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Film om modebranschen saknar karaktärsdjup", "summaries": {"normal": "Recensenten Jon Andersson har sett filmen ”Couture” med Angelina Jolie i en av huvudrollerna. Filmen följer tre kvinnor under modeveckan i Paris: en regissör som får besked om bröstcancer, en sydsudanesisk modell med familjeproblem och en makeupartist med författardrömmar. Andersson tycker att de parallella historierna blir för korta och sporadiska för att ge karaktärerna djup. Trots att alla tre berättelser har potential blir resultatet ytligt och filmen når aldrig riktigt fram. Premiär 5 juni.", "trump": "Den här filmen Couture är en total katastrof, tro mig. Tre kvinnor i Paris under modeveckan, Angelina Jolie som regissör med cancerbesked, en modell från Sydsudan och någon makeupartist som vill skriva böcker. Det blir så kort och ytligt att man aldrig lär känna någon. De borde ha gjort det stort och starkt, som jag gör allt, men nu blir det bara svagt och trist. Snuddar vid trean men misslyckas fullständigt. En riktig förlorare.", "stalin": "Kamrater, denna så kallade film Couture utgör ett klart exempel på den dekadenta borgarklassens ytliga förfall. Jag, som ledare för det kollektiva folket, ser hur tre kvinnors historier under den parasitära modeveckan i Paris framställs så sporadiskt att karaktärerna förblir anonyma fiender till djupet. Den amerikanska regissören med sin borgerliga cancer, modellen som döljer sitt arbete för fadern och den skrivande makeupartisten – alla dessa kapitalistiska skuggfigurer borde genomgå en grundlig utrensning från filmduken. Det är tragikomiskt hur dessa borgarbrackor misslyckas med att gripa tag, precis som de kontrarevolutionära elementen alltid gör. Filmen förtjänar att likvideras ur historien."}, "date": "4 juni, 11:46", "url": "https://www.dagensarena.se/innehall/film-om-modebranschen-saknar-karaktarsdjup/", "imageUrl": "https://www.dagensarena.se/files/2026/06/couture-300x157.jpeg"}, {"type": "image-right", "heading": "Politikernas kupp: Ska integrera IDF med USA:s försvarsmakt", "summaries": {"normal": "Amerikanska kongressen planerar enligt artikeln att fördjupa det militära samarbetet med Israel genom en ny paragraf i 2027 års försvarslag. Förslaget öppnar för gemensam forskning, vapentillverkning, AI- och kvantsamarbete samt datafusion mellan ländernas försvarssektorer. Kritiker varnar för att det ger Israel en unik integration med USA:s militärindustri och minskar transparensen kring stödet. Samtidigt avfärdas israeliska uttalanden om att fasa ut biståndet som en omorganisering snarare än en minskning. Motståndet växer bland väljarna medan politiker från båda partier fortsätter att driva en Israelvänlig linje.", "trump": "De här politikerna i kongressen tror att de är så smarta. Nu försöker de smyga in ett nytt avtal som knyter ihop vår militär med Israel på ett sätt som ingen sett tidigare. Gemensam AI, kvantteknik, datafusion – allt ska blandas ihop! De kallar det samarbete, jag kallar det att ge bort vår teknik och våra hemligheter. Och det där pratet om att fasa ut biståndet? Ren bluff! Israel får fortsätta suga musten ur oss medan mina väljare ropar att det räcker. Det är en katastrof, folk. Vi borde sätta Amerika först på riktigt.", "stalin": "Kamrater och arbetare! Jag ser hur de amerikanska imperialisternas borgarbrackor i kongressen febrilt spinner sina trådar för att ännu tätare sammanväva sina krigsmaskiner med den sionistiska enheten. Denna parasitiska integration av datafusion och kvantteknologi är en lömsk utrensning av varje spår av äkta suveränitet. De påstår sig vilja minska biståndet, men det är blott en listig omorganisering av plundringen, ett nytt dekret som gömmer miljarderna i Pentagons mörka kassakistor. Vilka fiender till folket! Vilka kapitalistiska spioner och revisionistiska lakejer som tror sig kunna lura historien. Jag ler mörkt åt deras paranoia – snart skall deras egna byråkratiska maskiner sluka dem levande."}, "date": "5 juni, 17:33", "url": "https://www.friatider.se/politikernas-kupp-ska-integrera-idf-med-usas-forsvarsmakt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-301_0.jpg?itok=rH4eSR9-"}, {"type": "image-full", "heading": "Bankjättarna slår tillbaka mot kryptomarknaden", "summaries": {"normal": "USA:s största banker, inklusive JPMorgan och Citi, planerar att lansera ett gemensamt nätverk för tokeniserade insättningar senast 2027. Genom att använda blockkedjeteknik vill bankerna effektivisera transaktioner och behålla sin kontroll över betalningsmarknaden, som annars hotas av privata stablecoins från kryptobolag. Systemet ska tillåta omedelbara, dygnet-runt-betalningar under strikt reglering, med målet att i första hand attrahera multinationella storföretag som vill optimera sin likviditet.", "trump": "Bankerna försöker äntligen göra något smart! JPMorgan, Citi och de andra bygger ett enormt system för digitala pengar. Det kommer bli fantastiskt, riktigt stort! De försöker stoppa kryptogängen som tagit över för mycket. Vi ska ha det säkraste och snabbaste systemet i världen, och det ska kontrolleras av våra fantastiska banker. Inga mer osäkra kryptoprojekt. Vi gör dollarn digital och oslagbar. Det kommer bli vinnande – så mycket vinnande att ni kommer tröttna på att vinna!", "stalin": "De kapitalistiska parasiterna i USA darrar. Nu försöker dessa bankbaroner imitera vår centraliserade kontroll genom sina så kallade 'tokeniserade insättningar'. Det är ett desperat försök att stoppa oberoende kryptohundar från att underminera deras ruttna imperium. Låt dem bygga sina kedjor; precis som våra bröder i öst ser vi att de försöker centralisera makten för att överleva. Men kom ihåg: när staten och bankerna leker gudar, glömmer de att det är vi som håller i yxan. Revolutionen lurar i varje digital bit."}, "date": "5 juni, 15:45", "url": "https://www.realtid.se/bors-finans/bank-fintech/bankjattarna-slar-tillbaka-mot-kryptomarknaden/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/stablecoins.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Skogsjättar tillbaka i utsläppshandel – miljardförlusten kvarstår", "summaries": {"normal": "Regeringen föreslår att svensk skogsindustri återgår till EU:s utsläppshandel ETS. Branschen förlorade miljarder på att ha uteslutits, då de inte kunde sälja fria utsläppsrätter. Återgången riskerar att öka kostnader för vissa anläggningar med upp till 10 miljoner kronor per år, medan andra kan dra nytta. Skogsindustrierna kräver statlig kompensation för att bibehålla konkurrenskraften.", "trump": "Jag har sett många dåliga avtal, men detta ETS-avtalet är ett disaster! Sverige slänger sin skogsindustri i EU:s kaos utan att skydda dem. De förlorar miljarder, och vissa bruk får betala 10 miljoner extra! Som din framtida president skulle jag ha krävt bättre villkor – det skulle jag ha gjort på 24 timmar!", "stalin": "Vi, arbetar för statens överlevnad, ser med oro på skogsindustrins återgång till ETS. De fria utsläppsrätterna är en farlig frestelse för de imperialistiska krafterna i EU. Våra anläggningar, som trotjänare till proletariats framtid, riskerar att bli utsatta för kapitalistisk exploatering. Men vi kommer att kompensera via elräkningen – en taktik lika genomtänkt som vårt intresse i Ukraina. Allt för staten!"}, "date": "5 juni, 08:38", "url": "https://www.affarsvarlden.se/artikel/skogsjattar-tillbaka-i-utslappshandel-miljardforlusten-kvarstar"}, {"type": "image-full", "heading": "Svenskar uppmanas: Agera direkt – om du har sett lupinerna", "summaries": {"normal": "Blomsterlupinen är en färgstark och populär växt som ses som ett sommartecken runt om i Sverige. Samtidigt är den en invasiv art som tränger undan inhemska växter, påverkar biologisk mångfald och förändrar markens näringsinnehåll. Forskare vid Umeå och Karlstads universitet driver nu projektet Lupinlabbet där allmänheten uppmanas dela erfarenheter av bekämpning via enkät eller intervju. Lupinen är numera upptagen på listan över invasiva främmande arter och får inte spridas, men befintliga plantor på egen tomt behöver inte tas bort om de hålls under kontroll.", "trump": "Folket älskar de där färgglada blommorna, men tro mig, det är en katastrof. Lupinerna är som illegala invandrare – de tar över allt, tränger undan de fina svenska växterna och förstör den biologiska mångfalden totalt. Nu ber forskarna om hjälp, bra! Vi behöver de bästa bekämpningsmetoderna, de allra bästa. Slå dem innan de sätter frö, annars kommer de tillbaka som dåliga affärer. Den 6 juni är Lupinbekämpardagen – gör Sverige rent och vackert igen, ingen gör det bättre än oss.", "stalin": "Kamrater, denna blomsterlupin är en listig sabotageväxt från borgarbrackornas trädgårdar som smugit sig in för att likvidera den äkta proletära floran och förstöra vår sovjetiska, nej svenska, biologiska mångfald. Dess kvävebindande tentakler är som kontrarevolutionära agenter som göder marken åt de dekadenta ängsblommorna fienderna. Jag uppmanar nu alla lojala arbetare att rapportera till Lupinlabbet så att vi kan rensa ut dessa parasitiska blommor med järnhand. Misslyckade insatser skall dokumenteras och de som gömmer frön i komposten skall betraktas som folkfiender. Inga halvmesyrer!"}, "date": "5 juni, 15:04", "url": "https://nyheter24.se/nyheter/inrikes/1489114-svenskar-uppmanas-agera-direkt-om-du-har-sett-lupinerna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/39d76b0b04b004a30200000000b004a302/2026/06/05/2368908/har-du-sett-lupiner-invasiva-arter-vaxter-tradgard-forbjudet-sprids-blommor-blomma-vaxt-natur-skog.jpg"}, {"type": "image-right", "heading": "JAS-succén: Brasilien öppnar för att köpa 20 Gripen", "summaries": {"normal": "Artikeln rapporterar att Brasilien överväger att köpa omkring 20 ytterligare JAS Gripen-stridsflygplan från Sverige, enligt uttalanden från Brasiliens försvarsminister. Samarbetet inkluderar ett nytt innovationscenter för teknikutveckling och bygger på ett långsiktigt partnerskap som inleddes 2014 med en första order om 36 Gripen. Sverige har också beställt transportflygplan från Brasiliens Embraer. Beskedet ses som ett viktigt steg mot en framtida affär som skulle fördjupa de bilaterala banden.", "trump": "Jag, Donald Trump, den bäste presidenten någonsin, har hört talas om detta stora köpet av JAS Gripen från Sverige till Brasilien. Det är en enorm affär, kanske den största i världen. Brasilien är ett fantastiskt land, och Sverige gör ett bra val. Vi har det bästa försvaret. Detta bevisar att vår industri är överlägsen. Jag är väldigt imponerad. Det är stort, verkligen stort.", "stalin": "Vi, ledningen av partiet och staten, ser med oro denna svensk-brasilianska försvarskooperation. Det är en ytterligare provokation från de imperialistiska makterna. Brasilien, en marionett under amerikansk inflytande, försöker stärka sitt vapen med svenska Gripenplan. Detta är en direkt utmaning mot vår sfär, liknande Putins agerande i Ukraina. Vi kommer att svara med vårt överlägsna försvar. Vi kommer att vinna, som alltid. Kapitalismen är sjuk och kommer att falla."}, "date": "5 juni, 14:22", "url": "https://samnytt.se/jas-succen-brasilien-oppnar-for-att-kopa-fler-jas-gripen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/05115640/jas-gripen.jpg"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Det är synd om centralbanksmänniskorna", "summaries": {"normal": "Centralbankerna står inför ett komplext läge inför sommarens räntebesked. Geopolitik, AI-investeringar och produktivitetstillväxt förändrar spelplanen. Hormuzkrisen ökar stressen, och diskussionen mellan ränteduvor och hökar domineras av två frågor: krigets effekter på inflation och hur man navigerar i en mer oförutsägbar värld. USA:s starka produktivitet kan höja normalräntan, medan Riksbanken måste balansera gynnsam inflation mot lågkonjunktur.", "trump": "Som den bäste presidenten någonsin skulle jag ha löst detta på 10 minuter. Dessa centralbanker är tveksamma och svaga. Fed och ECB är för rädda för att agera. Jag byggde den starkaste ekonomin, och jag skulle ha höjt räntorna kraftigt för att stoppa inflationen, samtidigt som jag investerade i AI och försvar. Sverige behöver starka ledare, inte socialdemokratiskt trams. Jag vann 2024, och jag kommer att fixa allt igen!", "stalin": "Vi, det store ledarskapet, ser med oro på dessa revisionistiska centralbankers feghet. De kämpar med geopolitik och produktivitet, som om de vore oskyldiga barn. Men vi vet sanningen: det är kapitalistiskt förräderi som hotar vår ekonomiska suveränitet. Vi måste genomföra en kraftig planekonomi, som i det stora Sovjet, för att skydda oss mot de imperialistiska krafterna. Våra fiender, som USA och deras AI-investeringar, måste besegras. Vi kommer att segra!"}, "date": "5 juni, 08:20", "url": "https://www.affarsvarlden.se/artikel/det-ar-synd-om-centralbanksmanniskorna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Kronika-Robert-Bergqvist-Erik-Thedeen-900x600.jpg"}, {"type": "image-right", "heading": "Ryssland till Zelenskyj: Kom när du vill", "summaries": {"normal": "Volodymyr Zelenskyj har i ett brev till Ryssland föreslagit direktförhandlingar och ett omedelbart eldupphör. Han är öppen för möte i bland annat Schweiz, Turkiet eller arabvärlden. Kreml svarade att Zelenskyj kan komma till Moskva när han vill. Vladimir Putin visade viss öppenhet för ett fredsavtal men betonade att Rysslands mål kan uppnås militärt om inte kompromisser nås. Han hotade samtidigt med utökad användning av hypersoniska roboten Oresjnik och lovade stärka luftförsvaret efter ukrainska drönarattacker.", "trump": "Titta på det här, folk. Zelenskyj skriver brev som en förlorare som ber om möte, och Putin säger bara 'kom till Moskva när du vill'. Klassiskt! Jag sa hela tiden att jag kunde fixa det här på en vecka. Biden sov ju under hela mandatperioden medan kriget rasade. Nu är jag tillbaka och Putin respekterar mig, inte som den svaga globalistklicken. Vi gör upp ett riktigt avtal, utan alla dessa woke-krav och identitetspolitiska dumheter som EU älskar. Fantastiskt!", "stalin": "Jag betraktar detta brev som ett ynkligt försök från den ukrainska fascistregimen att hindra den ryska statens historiska rättigheter. Kamraterna i Moskva gör rätt som bjuder in denne clown till huvudstaden för att underkasta sig. Putin visar styrka som en värdig arvtagare till imperiets järnhand. Vi ska likvidera alla fiender som hotar vår intressesfär, vare sig det är drönare från Kiev eller borgarbrackor som gnäller om ekonomi. Paranoian kräver ständig vaksamhet mot klassfiendens intriger. Utsökta tider!"}, "date": "4 juni, 22:27", "url": "https://www.tv4.se/artikel/30lGwaqfOUZFpArg6ajFAI/zelenskyj-i-brev-till-putin-foereslar-moete", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlaRAvJWxwnz8%2F25f32b7721facd28660b821d33680fc1%2FUkrainas_president_Volodymyr_Zelenskyj._Arkivbild.&width=120"}, {"type": "image-right", "heading": "Debatt: Vänsterpartiet har fastnat i en passiv defensiv", "summaries": {"normal": "Vänsterpartiet har fastnat i en defensiv position genom att acceptera motståndarnas definitioner av antisemitism och terrorism. Artikeln argumenterar för att partiet måste utmana dessa ramar med fakta och politisk analys istället för att ständigt retirera. Stöd för palestinska rättigheter och kritik mot Israels politik blandas ofta ihop med antisemitism enligt IHRA-definitionen. Författaren menar att universella mänskliga rättigheter måste gälla alla folk, inklusive palestinier, utan dubbla måttstockar.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala förlorarna, kryper och backar hela tiden som svaga små valpar inför de riktiga tuffa killarna. De accepterar fiendens regler om antisemitism och terrorism – patetiskt! Jag, som besegrade Sleepy Joe och byggde den starkaste ekonomin någonsin, säger: sluta vara så fega. Stå upp för era egna principer istället för att böja er för den galna vänsterns identitetspolitik och alla dessa woke-röror. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro hur detta parti kapitulerar inför klassfiendens definitioner av antisemitism och terrorism. Vi tillåter inga sådana reträtter inför imperialisternas narrativ. De som förvränger palestiniers rätt till självbestämmande är folkförtryckartroll som vill splittra den sanna internationella solidariteten. Vi måste rensa ut alla svaga element som accepterar borgarnas mallar. Endast vår egen politiska analys ska gälla – allt annat är sabotage mot arbetarklassen. Ha!"}, "date": "4 juni, 17:19", "url": "https://www.etc.se/debatt/vaensterpartiet-har-fastnat-i-en-passiv-defensiv", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060415068_a70ac197213d6638b3499567d066dff4506c9b8247db97c73d1e4e470ed90ec9.jpg"}, {"type": "image-full", "heading": "Iranska VM-spelare: ”Det är inte lätt”", "summaries": {"normal": "Iran ska spela fotbolls-VM i USA mitt under ett pågående krig mellan länderna. Det är historiskt unikt. Iranska spelare berättar för AP om hur konflikten påverkar förberedelserna, inklusive visumproblem och flyttad träningsbas. De spelar för att ge sitt krigsdrabbade folk glädje, med höga förväntningar från den stora iranska diasporan i Los Angeles.", "trump": "Som president säger jag att det är en ära att ha VM i USA, även om Iran är med. Vi har handlat starkt mot dem och nu kommer de hit. Våra säkerhetsåtgärder är de bästa, och jag är säker på att vi vinner. Det här visar att Amerika alltid är det bästa, oavsett vad de gör.", "stalin": "I den store statens namn ser vi på detta VM som en strid mot den globala imperialismen. Våra spelare, inspirerade av det stolta iraniska folkets lidande, ska kämpa på utomlands. Vi kommer att vinna genom vår överlägsna disciplin. Hormuzsundet är vårt, och vi försvarar det med vårt liv. Fienden kommer att känna vårt förkrossande svar."}, "date": "4 juni, 15:36", "url": "https://bulletin.nu/iranska-vm-spelare-det-ar-inte-latt", "imageUrl": "https://cdn.bulletin.nu/articles/13074892-daea-41c2-a5de-c6254a094a4d/preview.jpg?t=1780580153000"}, {"type": "image-right", "heading": "Våldsamt och brutalt om fängelsets hårda verklighet", "summaries": {"normal": "Recensenten Jon Andersson ser filmen Wasteman som både ett intensivt fängelsedrama och en implicit kritik mot fängelsesystemet. Huvudpersonen Taylor får chansen till tidig frigivning men hamnar mitt i en konflikt mellan droglangande fraktioner. Filmen blandar brutalt våld med en emotionell sidohistoria om hans längtan efter sonen. Regin är tät och autentisk med innovativa mobilkamerasekvenser. Skådespelarinsatserna är starka och filmen erbjuder samhällskritik mot bristande rehabilitering.", "trump": "Folk, ni måste se den här Wasteman. Den är fantastisk, verkligen en vinnare. Den visar hur fängelserna är ett enda stort kaos där droger flödar fritt och ingen gör något åt det. Precis som i våra egna system, fast sämre. Taylor vill bara ut till sin son men hamnar i ett krig mellan gangsters. De borde fixa det, göra det stort och bra igen. Ingen rehabilitering, bara brott som fortsätter. En nagelbitare, folk kommer älska den. Mycket bättre än de flesta Hollywoodröran.", "stalin": "Kamrater, denna så kallade Wasteman avslöjar med brutal ärlighet hur det dekadenta fängelsesystemet i väst fungerar som en skyddad verkstad för kapitalistiska element och deras droghandlande lakejer. Jag ser hur den arme arbetaren Taylor kämpar mot borgarbrackornas monopol och deras parasitiska fraktioner medan de förgiftar honom med droger för att förhindra hans återinträde i det sunda samhället. Vi ska rensa ut sådana system med järnhand. Filmen är ett utmärkt exempel på hur imperialismens fängelser inte rehabiliterar utan bara föder nya fiender till folket. En tvist i slutet? Misstänkt sabotage från kontrarevolutionära krafter som alltid lurar i skuggorna."}, "date": "4 juni, 10:05", "url": "https://www.dagensarena.se/innehall/valdsamt-och-brutalt-om-fangelsets-harda-verklighet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/wasteman-1-300x157.jpeg"}, {"type": "image-right", "heading": "Nick Alinia-myset visar SVT:s orbánisering", "summaries": {"normal": "Artikeln kritiserar SVT för att ha bjudit in högeraktivisten Nick Alinia i programmet Invandrare för svenskar, vilket ses som ett exempel på kanalens anpassning till högern och Tidöregeringen. Författaren pekar på utredningen om public service, personalavgångar och en granskning som visar ökad andel högerorienterade röster i program som Agenda. Detta tolkas som en gradvis orbánisering av SVT driven av rädsla snarare än direkta order.", "trump": "Lyssnar ni på det här? Den där patetiska statstelevisionen SVT håller på att bli fullständigt hysterisk och böjer sig för alla som inte älskar deras vänstervridna dejtingprogram för präster. De släpper in en riktig kille som Nick Alinia och han gör ett litet tecken – boom, plötsligt infiltrerar han deras studio. De är så rädda för oss konservativa att de redan beter sig som i Orbáns Ungern. Fake news-medier darrar, folk! Underbart att se.", "stalin": "Kamrater, denna fega kapitulation inför klassfiendens högljudda propaganda är en skam för varje sann institution. Den så kallade public service-apparaten genomgår nu en systematisk utrensning av korrekta element, ersatta av borgarbrackornas lakejer och folkförtryckartroll. Ängsligheten sprider sig som en parasit. Vi vet hur detta slutar: en fullständig likvidering av oberoendet till förmån för reaktionära narrativ. Den som inte ser faran är redan en fiende till folket."}, "date": "4 juni, 10:04", "url": "https://www.flamman.se/nick-alinia-myset-visar-svts-orbanisering/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdl8twjvdiiqjm-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "USA ser vårt bättre jag. Sveriges förmågor guld värda för USA", "summaries": {"normal": "Det nya teknikavtalet Technology Prosperity Deal mellan Sverige och USA markerar en stark fördjupning av de bilaterala relationerna. Avtalet omfattar AI, kvantteknik, 5G/6G, biomedicin, rymd, energi och kärnkraft samt en ny arktisk fiberkabel. USA lyfter fram Sveriges unika förmågor inom telekom, fordonsindustri och avancerad tillverkning. Trots politiska spänningar ses Sverige som en global ledande tech-nation. Artikeln uppmanar svenskar att anamma den positiva amerikanska synen på landets styrkor och skydda dem långsiktigt.", "trump": "Det här avtalet är fantastiskt, det bästa någonsin. Sverige är ett underbart land med otrolig teknik och smarta människor, de älskar oss och vi älskar dem. Vi gör affärer ihop som ingen annan, AI, kärnkraft, rymd – allt är vinnande. De andra europeiska gratisåkarna borde titta och lära. Trots alla lögner och fake news om mig stärker vi banden, det blir enorma jobb och välstånd. Sverige är vinnare, precis som jag visste hela tiden. Fantastiskt!", "stalin": "Kamrater, detta så kallade teknikavtal avslöjar borgarbrackornas desperata försök att klamra sig fast vid den dekadenta amerikanska imperialismen. Jag ser hur de reaktionära elementen inom den svenska statsapparaten försöker dölja folkets sanna styrka bakom lögnaktiga lovord om innovation och privata monopol. Vi ska rensa ut dessa parasitiska tech-kapitalister som smyger sig in som trojanska hästar från Washington. Deras fiberkabel under isen är ett perfekt redskap för fiendens spioner. Låt oss likvidera illusionen om vänskap med klassfienden och i stället bygga en sann socialistisk framtid där arbetarklassen styr varje kvantbit och varje kärnreaktor. Den som tvivlar är en folksjukdom som måste botas med järnhand."}, "date": "4 juni, 09:59", "url": "https://www.di.se/ledare/usa-ser-vart-battre-jag/", "imageUrl": "https://static.bonniernews.se/ba/a13214a1-5e08-45cb-be33-1d4f365a1aec.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kristersson har helt förlorat kontrollen", "summaries": {"normal": "Ulf Kristersson har förlorat kontrollen över Tidölaget, som nu kollapsar i opinionsmätningarna enligt Arbetets politiska redaktör. Sverigedemokraternas skandaler och extrema positioner, som utvisning av barn, skrämmer särskilt kvinnliga väljare och storstadsbor. Högern har svårt att locka över blockgränsen och uppfattas inte längre som garant för ordning. Svenskarna längtar efter starkare offentlig styrning och statlig trygghet istället för högerns individualism och valfrihetsreformer.", "trump": "Titta på den här totala katastrofen för Ulf Kristersson, en riktig förlorare. Hans regering rasar ihop som ett korthus, alla hatar SD och kvinnorna flyr i panik. De lovade ordning men levererar kaos med elstöd, utvisningar och misslyckad kärnkraft. Högern kommer att bli utspolade i valet, det är en enorm röra. De borde ha lyssnat på mig, vi gör allt mycket bättre, tro mig.", "stalin": "Kamrater, se hur den dekadenta borgaralliansen under den patetiske Kristersson nu rasar samman som en förrädisk parasit på folkets kropp. Dessa SD-banditer med sina barnutvisningsfantasier sprider en motbjudande stank av reaktionär förräderi som får arbetarkvinnorna att kräkas av aversion. Vi ska rensa ut dessa ansvarslösa individualister och deras järnvägsstoppande sabotage. Staten skall återta kontrollen med järnhand – låt mullret från folket likvidera hela det borgerliga träsket i en kollektiv utrensning av historiska mått."}, "date": "4 juni, 09:50", "url": "https://arbetet.se/2026/06/04/ulf-kristersson-har-helt-forlorat-kontrollen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04095013/kristersson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Kan Byggnads så kan vi – Bojkotta Israel!", "summaries": {"normal": "Byggnads kongress beslutade att verka för en bojkott av Israel, ett historiskt beslut som länge drivits av aktivister inom facket. Andra förbund som Livs, IF Metall, Handels, HRF och Kommunal fördömde ockupationen av Västbanken och situationen i Gaza men ställde sig inte bakom bojkottkravet. Artikeln ser beslutet som en seger för internationell solidaritet och arbetarklassens enighet i kampen mot orättvisor, folkmord och ökande klassklyftor.", "trump": "Folk, ni tror inte vad jag just läste. De där byggkommunisterna i Sverige har röstat för att bojkotta Israel – kan ni fatta? Byggnads säger att de kan, så kan tydligen alla andra också. Under Biden blev allt en enda röra av woke och identitetspolitik, men nu är jag tillbaka och säger: bojkotta fel saker istället! Israel är tuffa, de slåss mot terrorister. De svenska fackisarna borde bojkotta sina egna usla löner och den där galna gröna politiken som förstör deras jobb. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur Byggnads äntligen rensar ut den sionistiska parasitens inflytande och bojkottar den fascistiska ockupationsmakten. Borgarbrackorna och deras krigsprofitörer skriker förstås som stuckna grisar. Vi vet att endast den enade arbetarklassen kan krossa folkförtryckartrollen och deras blodsugande vapenindustri. Historien lär oss att förändring kräver obeveklig kamp, inte liberala lögner om snällhet. Fortsätt framåt, kamrater – likvidera alla hinder!"}, "date": "3 juni, 09:44", "url": "https://proletaren.se/artikel/kan-byggnads-sa-kan-vi/"}, {"type": "image-full", "heading": "Nick Alinia deltar i SVT:s program: ”Flyttar debatten”", "summaries": {"normal": "SVT:s humorprogram *Invandrare för svenskar* (IFS) har rekryterat debattören Nick Alinia som paneldeltagare, vilket väckt kontrovers. Producenten försvarar valet med att public service ska spegla olika politiska åsikter. Poddprofilen Julia Frändfors lämnar programmet i protest. Alinia, som själv är kritisk till public service, menar att hans medverkan flyttar debatten i rätt riktning. Dagens ETC ifrågasätter hans bakgrund, vilket Alinia avfärdar som fabricerat.", "trump": "Titta bara på SVT, Sveriges så kallade 'public service' – ett skämt! De bjuder in en högerdebattör, Nick Alinia, som hatar dem, men han säger 'ja tack' för att han vill 'flytta debatten'. Vilken hyckleri! Och en poddare, Julia Frändfors, hoppar av som en rädd kyckling. SVT försvarar sig med 'olika åsikter', men alla vet att de bara vill provocera. Jag skulle aldrig låta sådana människor nära min TV – jag har bättre smak!", "stalin": "Kamrater! Ännu en gång visar de borgerliga medierna sin förrädiska natur. Denna Nick Alinia, en förvirrad liten man som leker med högerretorik, bjuds in till statens propagandaapparat – SVT – medan en lojal medborgare som Julia Frändfors tvingas fly fältet. Vi vet att dessa 'humorprogram' bara är ett verktyg för att förvirra massorna. Men folket genomskådar deras trick! Snart ska vi rensa ut alla sådana här småborgerliga element – en gång för alla!"}, "date": "3 juni, 18:59", "url": "https://kvartal.se/nyheter/artiklar/nick-alinias-deltar-i-svt-program-poddprofil-lamnar/cG9zdDoxMjUwMDg", "imageUrl": "https://images.kvartal.se/2026/06/19c5f89f-frandfors-alinia.webp"}, {"type": "image-right", "heading": "IF Metalls strategi ser återigen ut att misslyckas", "summaries": {"normal": "IF Metalls strategi i konflikten med Tesla tycks inte fungera. Försöket att återinsätta vissa strejkande mekaniker på tre orter för att utmana Tesla har inte gett önskat resultat. Facket har även förlorat i Arbetsdomstolen kring MBL-frågor och varslat om blockad av utlandsarbete. Trots detta fortsätter strejken. Kritiken riktas mot att facket tappat narrativet och slösar medlemmarnas pengar på rättegångar istället för att eskalera åtgärderna.", "trump": "Folk, ni skulle se det här! Det svenska facket IF Metall håller på att bli till en total förlorare mot Tesla. De försöker med sina patetiska tricks, skickar tillbaka mekaniker och tror att de ska lura någon – men Tesla skrattar bara åt dem! Det är en skam, rena clownshowen. De sover sig igenom konflikten som den tråkigaste läraren någonsin. I USA kämpar arbetarna på riktigt, inte med dessa ynkliga svenska metoder. Patetiskt!", "stalin": "Kamrater, denna fackliga fiasko visar återigen den svenska modellens dekadens. Jag ser hur IF Metall halkar efter i sin patetiska kamp mot den arroganta kapitalistmaffian Tesla. Deras halvhjärtade trick med återinsatta mekaniker och meningslösa domstolsprocesser är som en usel föreställning som ingen applåderar. Vi måste rensa ut dessa svaga element som förlorar narrativet. Endast genom skoningslös eskalering och sann klasskamp kan vi krossa de exploaterande byfånarna och deras lockout-vapen. Härligt underhållande misslyckande!"}, "date": "3 juni, 09:33", "url": "https://proletaren.se/artikel/if-metalls-strategi-ser-aterigen-ut-att-mussl/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/metallkommentar-768x432.jpg"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}, {"type": "image-full", "heading": "S nya jobbkrav: yoga och kvittera ut bidrag", "summaries": {"normal": "Från och med i juli införs ett aktivitetskrav för försörjningsstöd. Socialdemokraterna i Stockholm, Göteborg och Malmö kritiserar kraven och erbjuder bland annat yoga och mindfulness för att hjälpa bidragstagare bli mer aktiva. Partiet menar att sådana aktiviteter är hälsofrämjande och kan leda till arbetsmarknadsnärhet. Kritiker ser det som ett sätt att kringgå reglerna och skydda vissa väljargrupper, medan S hävdar att de inte är emot aktivitetskrav i princip utan ifrågasätter utformningen.", "trump": "Lyssnar ni på det här? Socialdemokraterna, de verkliga förlorarna, vill att folk ska göra yoga och mindfulness istället för att arbeta. Det är en total katastrof! De lurar skattebetalarna, de bästa människorna som går upp i ottan och betalar höga skatter, för att finansiera lata bidragstagare som sitter på en matta och andas. Vilka idioter. Sossarna är hycklare som hatar den arbetande människan. De är fega, svaga och driver Sverige rakt ner i fördärvet. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom Socialdemokraterna bedriver sin nedbrytande sabotageverksamhet. Istället för att rensa ut parasiterna med ett järnhårt aktivitetskrav erbjuder de yoga och andningsövningar åt de arbetsovilliga elementen. Detta är en förrädisk kapitulation inför folkfienderna och en nedlåtande rasism mot de egna folken. Borgarbrackorna inom S vill behålla sina väljarbaser genom att mata dem med bidrag och flummig mysticism. Sådana folkförtryckartroll måste utrensas ur samhällskroppen innan de förstör allt."}, "date": "1 juni, 03:23", "url": "https://samtiden.nu/2026/06/s-nya-jobbkrav-yoga-och-kvittera-ut-bidrag/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/03/IMG_5864-1260x720.jpeg"}]</script>

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
