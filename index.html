ps://images.dagensps.se/app/uploads/2026/07/utbrandhet.png?width=256&quality=75"}, {"type": "image-right", "heading": "Analys: Kina kan driva nästa rally i oljepriset", "summaries": {"normal": "Kinas stora oljelager har blivit en ny maktfaktor på den globala oljemarknaden, lika viktig som Opecs beslut för prisutvecklingen. Landet byggde upp omfattande reserver under 2025 när priserna var låga och minskade lagren med 41 miljoner fat i juni. Med över 300 miljoner fat kvar kan Kina minska inköpen vid geopolitisk oro och köpa när priset faller, vilket förändrar dynamiken bortom enbart saudisk och opecstyrd produktion.", "trump": "Folk, ni måste höra det här. Kina har byggt upp ett monsterlager av olja, smarta grabbar köpte billigt förra året, och nu bestämmer de plötsligt priset lika mycket som de där OPEC-töntarna. Hormuzsundet brinner men det är Kinas lager som kommer att ge oss nästa stora rusning. De kan vänta ut kaoset och slå till när priset rasar. Under Biden var allt kaos, nu fixar jag det – men Kina spelar ett jäkligt listigt spel, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de kinesiska folkets strategiska oljelager nu krossar den kapitalistiska marknadens falska frihet. Borgarbrackorna i väst stirrar förgäves på OPEC medan vi, genom våra östliga kamrater, dikterar priset med järnhand. 300 miljoner fat i reserv! En utmärkt utrensning av spekulanternas girighet. När imperialisterna skapar kaos i Hormuz köper vi inte. Vi väntar. Och vi segrar. Alltid."}, "date": "15 juli, 16:43", "url": "https://www.dagensps.se/bors-finans/ravaror/analys-kina-kan-driva-nasta-rally-i-oljepriset/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/oilkina.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Nu öppnar järnvägen igen – men hetta sänker farten", "summaries": {"normal": "Efter nästan tre veckors reparationer öppnar järnvägen mellan Göteborg och Borås igen, men höga temperaturer tvingar Trafikverket att införa hastighetsbegränsningar på 40 km/h. Detta leder till färre tåg i tidtabellen, omdirigeringar och bussersättningar. Orsaken till urspårningen är ännu oklar, men värmen misstänks ha bidragit. SJ fortsätter med begränsad trafik och ersättningsbussar tills vidare.", "trump": "Fantastiskt arbete av svenskarna med järnvägen – men nu sabbar värmen allt! Jag skulle aldrig låta vädret styra mina tåg, aldrig! 40 km/h? Patetiskt. I USA hade vi fixat det på en dag. Och svenskarna vet inte ens varför tåget spårade ur – kanske för att de är för mjuka? Men bra jobbat ändå, Sverige, ni försöker i alla fall!", "stalin": "Järnvägen är åter öppen, men de kapitalistiska vädergudarna saboterar våra framsteg med sin förrädiska hetta! 40 km/h – en skam för den moderna järnvägen! Vi ska utreda denna urspårning med järnhand, och om fienderna i väst har manipulerat temperaturen, ska de få känna vår vrede. Tågen må gå långsamt, men revolutionen går alltid framåt – om än med bussar!"}, "date": "15 juli, 15:50", "url": "https://www.gp.se/nyheter/vastsverige/jarnvagen-oppnar-igen-men-varmen-bromsar-tagtrafiken.dd400758-1b47-4388-9dca-a6f63169c5d2", "imageUrl": "https://www.gp.se/images/article/dd400758-1b47-4388-9dca-a6f63169c5d2/images/3ggUB3rJq56TAJVv3qtWaaQ5umGk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Här är Sveriges medborgarskapsprov Hur många rätt får du? Testa dina kunskaper!", "summaries": {"normal": "Sverige inför ett nytt medborgarskapsprov som mäter kunskaper i samhällskunskap på nivå med årskurs nio. Provet, framtaget av Universitets- och högskolerådet på uppdrag av regeringen och Sverigedemokraterna, innehåller frågor om svensk historia, demokrati och jämställdhet. Det första provtillfället hålls den 15 augusti med 60 frågor. Ett separat språkprov planeras. Flera europeiska länder har redan liknande krav.", "trump": "Det här är fantastiskt, folk. Sverige gör äntligen något smart och skärper kraven för medborgarskap. De har ett prov nu som är så svårt att till och med svenskarna själva svettas. Rätt så! Varför ska man ge bort medborgarskap till folk som inte ens vet att Finland var deras i 700 år? De följer efter oss och de andra smarta länderna. Make Sweden Great Again, skulle jag säga. De har redan fullt med folk som vill testa sig – bra jobb!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den svenska arbetande staten äntligen reser sig mot de lömska borgarbrackorna som velat ge bort medborgarskap till klassfiender och historiska analfabeter. Detta prov är en ideologisk utrensning av okunskapen. Den som inte vet att Finland var vårt i nästan 700 år är en kontrarevolutionär parasit som bör rensas ut ur folkets kollektiv. Vi skrattar mörkt åt de kapitalistiska ignoranterna medan vi stärker den socialistiska medvetenheten. Perfekt!"}, "date": "15 juli, 15:06", "url": "https://samnytt.se/har-ar-sveriges-medborgarskapsprov", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/15130522/medborgarskapskrav-1-2.jpg"}, {"type": "image-full", "heading": "Igelkott och ål fridlyses – blåsippa och gullviva stryks", "summaries": {"normal": "Regeringen uppdaterar listan över fridlysta arter i Sverige. Nya skyddade arter inkluderar igelkott, örtlav, raggtaggsvamp och ål, medan blåsippa, gullviva och murgröna tas bort då de bedöms livskraftiga. Listan minskar från knappt 300 till drygt 230 arter. Klimat- och miljöminister Romina Pourmokhtari inför fyra skyddskategorier och undantag för jord- och skogsbruk samt samhällsintressen. Alla grod- och kräldjur samt orkidéer förblir fridlysta. 130 arter tillkommer och 182 stryks.", "trump": "Folk, ni tror inte vad de gör i Sverige, det är otroligt. De skyddar igelkottar och några svampar som ingen hört talas om, men tar bort blåsippor och gullvivor? Patetiskt! Listan var för lång och trubbig, nu fixar de det med smarta regler så att folk kan använda sin egen mark utan att bli trakasserade. Minister Pourmokhtari gör ett fantastiskt jobb, bättre än någonsin. Sverige behöver inte långa listor bara för att verka gröna, de behöver vett och vinst. Make Sweden Great Again!", "stalin": "Kamrater, jag har nu genomfört en nödvändig utrensning bland de dekadenta fridlysta arterna som länge hotat den socialistiska naturen. Den gamla listan var en borgerlig svulst full av klassfiender och opportunistiska ängsblommor som blåsippa och gullviva. Dessa kapitalistiska parasitväxter likvideras nu från skyddet och får plockas som de kontrarevolutionärer de är. Igelkotten, denna tappra proletära igelkott, får äntligen sitt rättmätiga pansar mot folkfientliga markägare. Vi ska inte ha långa listor bara för att glädja sabotörer och skogsbrukets lakejer. Varje art ska tjäna folket, annars rensas den ut med järnhand. Rapportörerna som undrade varför inget gjorts tidigare har helt rätt att darra – deras egen lathet doftar trotskistiskt sabotage. Framåt mot seger för de sanna pollinatörerna och orkidéerna!"}, "date": "14 juli, 13:38", "url": "https://bulletin.nu/igelkott-och-al-fridlyses-blasippa-och-gullviva-stryks", "imageUrl": "https://cdn.bulletin.nu/articles/9ae52df4-40bc-478d-8b9d-40d57ec07bec/preview.jpg?t=1784029085000"}, {"type": "image-right", "heading": "Löftet: Ingen PK-mångfald i nästa Sagan om ringen-film", "summaries": {"normal": "Regissören Andy Serkis meddelar att den kommande filmen The Lord of the Rings: The Hunt for Gollum inte kommer att ha en politiskt korrekt mångfald i rollbesättningen. Icke-vita skådespelare ska endast inkluderas när det är relevant för berättelsen. Serkis hänvisar till att Tolkiens värld inspirerats av nordisk mytologi och att Fylke framställs som ett isolerat, homogent samhälle. Filmen har premiär planerad till december 2027.", "trump": "Folk, det är fantastiskt. Andy Serkis gör det rätta. Ingen galen politiskt korrekt mångfald i Sagan om ringen, bara när det passar berättelsen. De gamla filmerna var underbara, inspirerade av nordisk mytologi, inte av någon woke-agenda. Fylket ville inte ha folk som kom in och förstörde allt, precis som vi borde hålla gränserna säkra. Smart, mycket smart. Bättre än de tidigare filmerna som böjde sig för kritiken. Premiär 2027, det blir enormt.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denne Serkis avvisar den degenererade borgarbrackornas krav på falsk mångfald. Vi tillåter inga kapitalistiska infiltratörer i vår sovjetiska ringtrilogi om de inte tjänar det kollektiva narrativet. Fylket är ett rent proletärt exempel på att hålla fienderna utanför gränserna. De som envisas med att smyga in dekadenta element ska rensas ut med järnhand. Detta är en seger för den sanna mytologin mot de paranoida västerländska parasiterna. Filmen kommer att glorifiera partilinjen år 2027."}, "date": "15 juli, 12:28", "url": "https://www.friatider.se/loftet-ingen-pk-mangfald-i-nasta-sagan-om-ringen-film", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-501.jpg?itok=tdloTZS9"}, {"type": "text", "heading": "Efter Auschwitz-inslaget – polisen utreder misstänkt hets mot folkgrupp", "summaries": {"normal": "Efter en pro-palestinsk demonstration i Stockholm där en modifierad replika av Auschwitz entrégrind bars har polisen upprättat två anmälningar om misstänkt hets mot folkgrupp. En anmälan kommer från polisen självmant, den andra från en privatperson. Skylten med texten \"Gaza\" istället för \"Arbeit macht frei\" kan bli ett viktigt rättsligt test av den nya lagstiftningen från 2024 som även straffar förnekande och förringning av Förintelsen. Demonstrationen väckte stark kritik för trivialisering av Förintelsen och användning av vårdkläder samt teaterinslag med antisemitiska motiv.", "trump": "Hörni, det här är helt otroligt. I Stockholm bär de en Auschwitz-skylt men skriver \"Gaza\" på den och paraderar omkring som idioter. Polisen utreder hets mot folkgrupp, äntligen, för det är en skam. De trivialiserar Förintelsen och använder sjukhuskläder för att verka seriösa. Det är galet. Radikala vänstermänniskor gör allt för att skapa kaos och hat. Sverige borde vakna upp innan det är för sent. Mycket fel, väldigt sorgligt!", "stalin": "Kamrater, vi ser här hur de sionistiska reaktionärernas lakejer och borgarbrackorna i väst förvränger den rättmätiga kampen mot imperialismen till en osmaklig karneval av Förintelsens symboler. Jag, som alltid genomskådar kontrarevolutionens masker, ler mörkt åt dessa dekadenta småborgerliga skådespelare i sina läkarrockar som likviderar historien med en pensel av Gaza. Vi ska rensa ut alla som förringar de stora offer som arbetarklassen burit. Ut med parasiterna. Den nya lagen är ett första steg mot ordning i detta kaos av paranoia och falsk medkänsla."}, "date": "15 juli, 10:47", "url": "https://riks.se/nyheter/efter-auschwitz-inslaget-polisen-utreder-misstankt-hets-mot-folkgrupp"}, {"type": "image-right", "heading": "”Tidö offrar Kalix för uran – gör Norrbotten till råvarukoloni”", "summaries": {"normal": "Katarina Burman från Vänsterpartiet Kalix kritiserar Tidöregeringen för att prioritera uranprospektering i Norrbotten. Amerikanska bolaget Adelheid Holdings får tillstånd att provborra i Kalix kommun, delvis i Kalixälven och i skyddade Natura 2000-områden. Hon ser det som ett angrepp på det lokala självstyret, en risk för miljön, dricksvatten och folkhälsa samt ett hot mot biologisk mångfald, rennäring och framtidstro. Burman kräver att tillstånden överklagas och att regeringen byts ut.", "trump": "De gör ett fullständigt bedrövligt jobb i Sverige. Tidöregeringen säljer ut vackra Norrbotten till ett amerikanskt bolag som vill borra efter uran i älvar och skyddad natur. Det är en katastrof. Lokalbefolkningen får sin mark och sitt vatten förstört för alltid medan besluten fattas i slutna rum i Stockholm och USA. De kallar det grön omställning – det är bara ren miljöförstöring. Totalt misslyckande. Sverige behöver smarta ledare som sätter folket först, inte råvarukolonier.", "stalin": "Kamrater, jag betraktar med kallt förakt hur dessa borgerliga lakejer i Tidöregeringen underkastar sig amerikanska monopolkapitalister och förvandlar Norrbotten till en råvarukoloni. De tillåter provborrning i skyddade älvar och Natura 2000-områden, redo att släppa ut radioaktivt gift i grundvattnet och likvidera vår biologiska mångfald. Detta är en fiende inom murarna, en parasitisk femtekolonn av vinsthungriga imperialister som vill kväva arbetarnas framtidstro. Vi ska överklaga, avslå och rensa ut dessa naturförstörare ur statsapparaten innan de förgiftar hela kollektivet med sin dödliga uranfantasi. Deras så kallade omställning är bara maskerad sabotageverksamhet."}, "date": "15 juli, 08:00", "url": "https://arbetet.se/2026/07/15/tido-offrar-kalix-for-uran-gor-norrbotten-till-ravarukoloni", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09153815/katarina-burman.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "5-årig flicka knivhuggen på lekplats – polisen utreder brott", "summaries": {"normal": "En femårig flicka fördes till sjukhus med allvarliga skador efter en misstänkt våldshändelse i Furutorpsparken i Helsingborg på måndagseftermiddagen. Polisen spärrade av området, förhörde vittnen och sökte efter den misstänkte. Enligt uppgifter attackerades flickan oprovocerat av en ung pojke som senare själv larmade 112. Pojken, som är under 15 år, har tagits om hand av socialtjänsten. Flickans tillstånd beskrivs som stabilt och polisen ser händelsen som isolerad.", "trump": "Det är en fullständig katastrof i Helsingborg, en riktig skam för Sverige. En liten femårig flicka attackerades brutalt i en park, knivskuren av någon galning. Pojken sprang iväg och ringde själv 112 – kan ni fatta? Inget gripande, bara socialtjänsten som tar hand om honom. Sverige har blivit en dålig plats, folk kan inte ens gå i parken längre. Vi behöver starkare ledarskap, tro mig, det här skulle aldrig hända hos oss.", "stalin": "Kamrater, denna oprovocerade attack mot en oskyldig femåring i Helsingborgs park är ett tydligt tecken på att de dekadenta resterna av den borgerliga parasitklassen fortfarande lurar i skuggorna och förgiftar våra unga pionjärer. Jag, som ledare för folkets vilja, ser hur dessa lumpna små reaktionära element, dessa knivbeväpnade borgarbrackor i barnskepnad, försöker så split och kaos. Vi ska rensa ut alla sådana fiender till kollektivet med järnhand och sovjetisk effektivitet – låt socialtjänsten bli verktyget för folkets hämnd. Det är en munter tanke att pojken själv ringde efter hjälp; kanske inser till och med de mest degenererade elementen att staten vakar."}, "date": "14 juli, 11:42", "url": "https://nyheter24.se/nyheter/inrikes/1498313-5-arig-flicka-knivhuggen-pa-lekplats-polisen-utreder-brott", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e4cee6dc04b004a3022d0000008d047702/2026/07/13/2377730/Skärmavbild%202026-07-13%20kl.%2018.26.33.jpg"}, {"type": "text", "heading": "Bankomat är för känt – förlorar tvist mot amerikanska jätten", "summaries": {"normal": "Patent- och marknadsdomstolen har hävt Bankomat AB:s varumärkesskydd och företagsnamn efter en tvist med Google. Domstolen menar att ordet 'bankomat' har blivit en allmän benämning för uttagsautomater. Bankomat stämde ursprungligen Google för varumärkesintrång i deras översättningstjänster, men Google vann målet med argumentet att ordet saknar särskiljningsförmåga. Bankomat AB döms nu att betala över 7,6 miljoner kronor i rättegångskostnader, samtidigt som kontantanvändningen och antalet automater i Sverige fortsätter att minska.", "trump": "Hörde precis om Bankomat, ett riktigt misslyckande! De stämde Google – stora, rika Google – och de förlorade stort. Pinsamt! Domstolen sa att 'Bankomat' bara är ett vanligt ord nu, inte ett varumärke. De förlorade namnet, de förlorade skyddet, och de måste betala över 7 miljoner kronor! Vilken katastrof för dem. Jag vet hur man bygger märken, jag har de bästa märkena. Bankomat? De är förlorare. Allt handlar om att vinna, och de förlorade allt!", "stalin": "Denna så kallade 'Bankomat' har visat sin totala svaghet inför de imperialistiska teknikjättarna. Att förlora sitt namn till Google är ett bevis på borgerlig inkompetens. Vi ser hur västvärldens pengar ruttnar bort medan deras automater försvinner, precis som vår broder Putin rensar ut de opålitliga elementen i gränslandet. Att kasta bort 7,6 miljoner kronor på advokater är ett brott mot folket. Vi i staten skulle ha ställt dem mot väggen långt tidigare. Svaghet förtjänar endast utplåning."}, "date": "14 juli, 15:02", "url": "https://www.realtid.se/bors-finans/bank-fintech/bankomat-ar-for-kant-forlorar-tvist-mot-amerikanska-jatten/"}, {"type": "image-right", "heading": "Maskiner hjälper människan. Kritiken har urartat under VM", "summaries": {"normal": "Artikeln diskuterar hur teknik som VAR, sensorer och smarta bollar påverkar fotbolls-VM och speglar en bredare debatt om automatisering och AI. Trots att maskiner ofta presterar bättre än människor kvarstår mänskliga inslag som leder till kritik, fel och konspirationsteorier, inte minst efter påtryckningar från USA:s president. Tekniken ses som en hjälp för människan, vilket visas i jämna matcher där kunskap demokratiserats, men den kan aldrig ersätta det mänskliga i spelet.", "trump": "Folket älskar fotboll, men de här VAR-maskinerna och de smarta bollarna är en total katastrof. De gör spelet tråkigt och felaktigt, precis som de gör med allt annat. Vi såg det med Norge mot England, och plötsligt dyker konspirationerna upp – och ja, det var påtryckningar från den bästa presidenten någonsin, mig. Människor som Haaland och Mbappé är fenomenala, inte maskiner. Teknologin hjälper oss, men den behöver styras av vinnare, inte förlorare som fuskar systemet.", "stalin": "Kamrater, dessa kapitalistiska leksaker som VAR och rörelsesensorer utgör ett förräderi mot folkets fotboll. Jag, som ledare för det kollektiva framsteget, ser hur borgarbrackornas maskiner nagelfarar revolutionära mål och föder kontrarevolutionära konspirationer. Mänskliga svagheter som äregirighet och påtryckningar från dekadenta imperialister i Vita huset måste rensas ut. Tekniken är ett verktyg för arbetarklassen, inte en pina, men vi likviderar alla fiender som förgiftar spelet med sin parasitiska individualism. Haaland och Mbappé är maskinliknande hjältar i kampen mot ojämlikhet."}, "date": "14 juli, 12:15", "url": "https://www.di.se/ledare/maskiner-hjalper-manniskan/", "imageUrl": "https://static.bonniernews.se/ba/15ff7cec-bc47-4b56-bc9a-b17ed0fe5731.jpeg?crop=3973%2C1987%2Cx0%2Cy331&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Tjeckien testar 150 km/h", "summaries": {"normal": "Tjeckien blir först i EU med att testa 150 km/h som hastighetsgräns på en 47 kilometer lång motorvägssträcka. Digitala skyltar aktiveras endast vid bra väder. Experter varnar för att tidsvinsten är liten, bara cirka sex minuter, och att bränsleförbrukningen ökar med 10–25 procent. Många förare överskattar besparingen eftersom de ändå måste sakta ner ibland.", "trump": "Tjeckien, smarta killar, testar 150 km/h på motorvägen. Fantastiskt! De andra EU-länderna är för långsamma och fega. Sex minuters besparing? Patetiskt. Bilarna dricker mer bensin än en dålig affär, men vi älskar fart. De borde lyssna på mig, vi gör allt bättre och snabbare. Vinna, vinna, vinna!", "stalin": "Vi, det stora kollektivet, betraktar med misstänksamhet hur borgarbrackorna i Tjeckien leker med sina motorvägar och farter upp till 150 kilometer. Jag ser tydligt hur de kapitalistiska fienderna, dessa luftmotståndsförnekare och bränsleslukande sabotörer, försöker lura arbetarklassen med lögnaktiga tidsbesparingar på ynka sex minuter. Deras utsläppsrök är en kontrarevolutionär konspiration. Rensa ut de som lovar mer hastighet men levererar bara högre förbrukning och farliga avvikelser från planen. Ingen slipper undan."}, "date": "14 juli, 12:14", "url": "https://bulletin.nu/tjeckien-testar-150-km-h"}, {"type": "image-full", "heading": "SMHI ger gul varning för högsommarvärme – kan bli 30 grader", "summaries": {"normal": "SMHI har utfärdat en gul varning för höga temperaturer i delar av Sverige. Från onsdag och tre dagar framåt väntas temperaturer runt 30 grader i nordöstra Götaland och inre Svealand, bland annat i Östergötlands, Södermanlands, Örebro, Västmanlands, Kalmar, Jönköpings, Uppsala, Dalarnas och Gävleborgs län. Riskgrupper som äldre och sjuka uppmanas att dricka mycket, undvika stark sol och hålla bostaden sval då värmen kan påverka hälsan.", "trump": "Folket, ni kommer inte att tro det, men Sverige får nu en enorm värme, den bästa värmen, runt 30 grader i flera dagar. SMHI, som annars inte gör så mycket, har faktiskt utfärdat en varning. Det är fantastiskt väder, kanske det bästa någonsin, men de svaga – de gamla, de små – de klarar det inte. Drick vatten, undvik solen, det är enkelt. Ingen har sett värme som denna, tro mig.", "stalin": "Kamrater, jag ser hur den västerländska värmen försöker krossa våra sovjetiska kroppar med sin fega 30-gradiga solattack. Borgarbrackorna i SMHI varnar, men vi vet att det är en konspiration från de dekadenta kapitalisterna som vill försvaga arbetarklassen. Vi ska rensa ut den här värmen med järnhand. Drick, håll er borta från solen, likvidera svagheten i era hem. Den som svettas för mycket är en fiende till folket."}, "date": "14 juli, 11:24", "url": "https://nyheter24.se/nyheter/inrikes/1498464-smhi-ger-gul-varning-for-hogsommarvarme-kan-bli-30-grader", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2dddaf9704b004a30200000000b004a302/2026/07/14/2377868/SMHI-gul-varning.png"}, {"type": "text", "heading": "Skärgårdsö fast i hårda trädkrav: \"Absurt exempel\"", "summaries": {"normal": "Öckerö kommun riskerar att drabbas hårt av EU:s naturrestaureringsförordning. Kommunen har endast 9 procent trädkronetäckning, under gränsen på 10 procent, och får därför inte minska sina grönytor fram till 2030 utan kompensation. Med ett landskap av kala klippor och begränsad mark blir det svårt att bygga och kompensera. Både kommunekologen Linnea Rösiö och Byggföretagen kritiserar regelverket som absurt för skärgårdskommuner.", "trump": "Det här är ett totalt vansinnigt regelverk från EU, tro mig. Öckerö sitter på kala klippor och nu säger de att ni inte får bygga för att ni inte har tillräckligt med träd. Absurt. De har 9 procent, de behöver 10, och plötsligt kan de inte utveckla sin ö. Byggföretagen har helt rätt, det sätter käppar i hjulen för näringslivet. Vi behöver sunt förnuft, inte galna byråkrater som jämför en liten svensk ö med Paris. Patetiskt.", "stalin": "Kamrater, detta är ett lysande exempel på hur den dekadenta EU-byråkratin och dess borgarbrackor i Bryssel försöker kväva folkets framåtskridande med sina absurda trädkronemål. Jag, som ledare för det stora kollektivet, ser hur dessa kapitalistiska ekofantaster vill likvidera Öckerös utveckling genom att kräva skugga från icke-existerande träd på kala klippor. Vi ska rensa ut denna paranoia från västkusten och tvinga kompensation i andra tätorter. Den som inte ser fienden i varje satellitbild är en kontrarevolutionär trädkramare som bör utrensas med ett leende."}, "date": "14 juli, 07:00", "url": "https://www.affarsvarlden.se/artikel/skargardso-fast-i-eus-tradkrav-absurt-exempel"}, {"type": "image-right", "heading": "Varnar för att världen kan stå inför ny oljekris: ”Då blir det väldigt illa”", "summaries": {"normal": "Råvaruanalytikern Christian Kopfer varnar för att världen riskerar en ny oljekris om Hormuzsundet stängs. Trots fredssignaler har geopolitiska spänningar mellan USA och Iran ökat riskpåslaget. Oljepriset ligger nu kring 80 dollar per fat, men kan stiga till 150 dollar eller mer om Kinas lager sinar. Konsekvenserna blir främst inflation, högre priser och störningar i världsekonomin för både hushåll och företag.", "trump": "Folk, det här är en total katastrof som de korkade globalisterna har kokat ihop. Jag hade Iran och de galningarna under full kontroll, men efter Sleepy Joe blev allt ett enda kaos. Nu snackar de om 150 dollar fatet – det är vansinne! Mina dealar gav billig energi, nu får vi inflation och flaskhalsar. De borde ha lyssnat på mig från början, inte på de där förlorarna. Det blir väldigt illa, tro mig.", "stalin": "Kamrater, imperialismens blodtörstiga exploaterande byfånar leker åter med världens oljeådror och hotar det kollektiva framåtskridandet. Jag ser hur de fascistiska kapitalistmaffian och deras lakejer i Hormuzsundet framkallar panik för att suga ut arbetarklassen med inflationsspöken. Lager sinar som klassfiendens lögner. Om de inte underkastar sig vårt järnhandskgrepp väntar en utrensning av dessa folkförtryckartroll. Det blir mycket illa för borgarbrackorna."}, "date": "13 juli, 23:08", "url": "https://www.tv4.se/artikel/5Hxaq4rkrggBTh8TKmcb4G/varnar-foer-att-vaerlden-kan-sta-infoer-ny-oljekris-vaeldigt-illa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2X6vfV0ahvrLOvI4Y3N0vg%2F761ab05c2b2b1dcf276d63734bbdc5dc%2Fsundet_webb.jpg&width=120"}, {"type": "image-right", "heading": "Christoffer Jonsson: Nej, IDF är ingen terrorrörelse", "summaries": {"normal": "Christoffer Jonsson kritiserar Leonidas Aretakis för att kalla IDF en terrorrörelse under ett Almedalssamtal om vänsterns antisemitism. Jonsson försvarar IDF som Israels lagliga försvarsmakt som skyddar landet mot islamistiska terrorister, bland annat under Hamas attack den 7 oktober. Han jämför en IDF-tröja med en US Army-tröja och varnar för att stämpeln legitimerar hot mot enskilda soldater. Artikeln lyfter också säkerhetsrisker med Vänsterpartiet i regering.", "trump": "Folk, ni skulle ha hört den där galningen Aretakis kalla IDF terrorister – vad en total förlorare! Den israeliska armén krossar faktiskt terroristerna som vill utplåna Israel, precis som vi gjorde med ISIS. Den där hysteriske vänstertypen borde köpa en riktig tröja istället för att sprida hat. Ebba Busch visade bara stöd för en stark demokrati, inte som de woke-kvoterade antisemiterna på vänsterkanten. Patetiskt, men vi vinner ändå stort.", "stalin": "Kamrater, jag betraktar med djup misstro dessa klassfiender som kallar folkets armé för terrorister. Den israeliska försvarsmakten, underställd statens auktoritet, likviderar hot från imperialistiska banditer som Hamas. Aretakis, en typisk folkförtryckartroll från den dekadenta pressen, bidrar till att stämpla ärliga soldater som måltavlor. Sådana lögner ska rensas ut. Utan denna armé hade staten utplånats av arabiska reaktionärer. Fienden ljuger, som alltid."}, "date": "11 juli, 13:02", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-nej-idf-ar-ingen-terrorrorelse", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/leon-640x360.png"}, {"type": "image-full", "heading": "Nya upplopp i Europa efter Marockos match", "summaries": {"normal": "Efter Frankrikes 2–0-seger över Marocko i VM-kvartsfinalen utbröt upplopp i flera europeiska städer, trots att Paris förblev relativt lugnt. I London, Antwerpen och Amsterdam attackerades polis med fyrverkerier, flaskor och raketer. Flera gripanden gjordes. Marockanska diasporan i Europa har tidigare orsakat liknande oroligheter under VM. Polisen i London varnar för att sådan oordning inte kommer att tolereras.", "trump": "Kan ni tro det? Frankrike vinner en match – och plötsligt exploderar hela Europa! Jag har sett mycket, men det här är galenskap. Polisbilar beskjuts med fyrverkerier, gatorna fylls av kaos. Belgien, Nederländerna, Storbritannien – alla tappar kontrollen. Och vad gör deras ledare? Ingenting! Hade jag varit där hade jag satt stopp för det här på en sekund. Men nej, de låter en massa bråkstakar förstöra städerna. Patetiskt!", "stalin": "Kapitalistiska städer i väst skakar under fotbollens revolutionära vågor! De marockanska massorna, trots förtryckets järnhand, reser sig mot polisens bourgeoisie. I London, Amsterdam och Antwerpen slår arbetarklassen tillbaka mot fascistiska uniformer med flaskor och fyrverkerier – ett lysande exempel på folkets kreativa motstånd! Men var försiktiga, kamrater: imperialisterna i Bryssel och London kommer att svara med repression. Vi ser, vi noterar – och vi skrattar åt deras misslyckande!"}, "date": "10 juli, 08:17", "url": "https://kvartal.se/nyheter/artiklar/nya-upplopp-i-europa-nar-marocko-spelar/cG9zdDoxNDQyMjI", "imageUrl": "https://images.kvartal.se/2026/07/5eb1e324-nederlanderna.webp"}, {"type": "image-right", "heading": "Vi fostrar våra barn till kapitalismens självuppoffrare", "summaries": {"normal": "Forskarna Malin Espersson och Tullia Jack beskriver hur prestationssamhället formas redan i barndomen. Föräldrar med goda avsikter driver sina barn mot ständig prestation, optimering och konsumtion, vilket reproducerar ett system av självexploatering. Passion och lojalitet utnyttjas medan vila och närvaro ses som misslyckanden. Resultatet blir utbredd stress bland ungdomar. Artikeln uppmanar till att låta sommarlovet vara en riktig paus från prestationskraven.", "trump": "Folk, det här är precis vad som händer när de globala eliterna och de korkade systemen styr. De får er att prestera ihjäl er redan som barn, jobba gratis för passionens skull och köpa skräp ni inte behöver. Det är en skam! Era barn stressas sönder på gymnasiet medan de lovar att det blir bättre senare – det blir det aldrig. Låt dem leva nu, ta den där bussen till Nederländerna. Make childhood great again!", "stalin": "Kamrater, detta är den borgerliga parasitens giftiga maskineri som förgiftar ungdomen med falsk passion och prestationsfällor. Jag ser hur dessa välmenande föräldrar omedvetet blir lakejer åt det kapitalistiska träsket och reproducerar självexploateringens kedjor. Skammen är deras vapen, stress deras verktyg. Vi skall rensa ut dessa dolda fiender till det kollektiva välmåendet, dessa prestationsborgarbrackor som säljer nuet för en lögnaktig framtid. Låt sovjetisk vila råda under sommarlovet!"}, "date": "10 juli, 01:37", "url": "https://www.dagensarena.se/opinion/vi-fostrar-vara-barn-till-kapitalismens-sjalvuppoffrare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-64-300x157.jpg"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är riggat. Fake news-media kommer hata den, men folket älskar den!", "stalin": "Vi har observerat en farlig tendens bland de dekadenta västländerna: en film, *Citizen Vigilante*, glorifierar den ensamme bourgeoishjälten som tar lagen i egna händer. Precis som de fascistiska drömmarna om en stark man som 'räddar' nationen! Tyskland, dessa hycklande liberaler, förbjuder filmen – men vi vet att deras rättssystem redan är korrumperat. Filmen är ett symptom på kapitalismens sönderfall. Vi, Sovjetunionens arvtagare, krossar sådana här reaktionära fantasier med järnhand. Låt dem leka med sina vapen – vi har kärnvapen och en plan!"}, "date": "9 juli, 10:34", "url": "https://expo.se/kommentar/den-ensamme-hamnaren", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/Kommentar-.jpg"}, {"type": "text", "heading": "Fler idrotter blir inte mer idrott för förortens unga", "summaries": {"normal": "I Skarpnäck hotar kommunens planer att riva Skarpnäckshallen och en konstgräsplan som används för både spontanfotboll och organiserad lagidrott. Istället föreslås en ny anläggning med simhall, ishall och sporthall. Kritiker menar att detta försvårar verksamheten för lokala föreningar, minskar tillgängliga ytor för spontanidrott och gynnar professionaliserad idrott framför öppna ytor som är viktiga för förortens unga.", "trump": "De gör det igen, de korkade kommunbyråkraterna i Stockholm. Riv den fina fotbollsplanen där grabbarna spelar fritt och bygg en jättelik elit-anläggning för fancy ishockey och simning. Fantastiskt misslyckande! Nu ska arbetarklassens kids åka tunnelbana medan rikemansungar tar över. Totalt eländigt. Öppna ytor är välfärd, det här är ren klasskrigföring från de värsta globalisterna. Vi behöver mer fotboll, inte färre!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas ungdom. Jag ser hur de rivningsplanerna likviderar de fria ytorna där folket spontant kunde stärka sin kollektiva anda genom fotboll. Istället tvingar de fram en imperialistisk ishall för elitens dekadenta lekar. Vi ska inte tolerera sådana folkfiender som prioriterar tunnelbaneresor och avgifter framför tillgänglig välfärd. Rena klassfiender som måste rensas ut ur planeringen."}, "date": "8 juli, 13:37", "url": "https://proletaren.se/artikel/fler-idrotter-blir-inte-mer-idrott-for-forortens-unga/"}, {"type": "image-right", "heading": "Palestinskt fotbollslag tävlar för tredje året i rad: ”Vi har de bästa supportrarna på Gothia Cup”", "summaries": {"normal": "Det palestinska laget Rawahel Charity Society från Tulkarem på Västbanken deltar för tredje året i rad i Gothia Cup i Göteborg. Laget, som grundades 2016, har som mål att utveckla fotboll för barn även i flyktingläger. De spelar gruppspelsmatcher på Slottsskogsvallen och betonar att turneringen ger hopp och en känsla av gemenskap. Innan cupen spelar de vänskapsmatcher i Malmö och Göteborg.", "trump": "Titta på de här palestinska grabbarna som kommer tillbaka till Gothia Cup för tredje gången – fantastiska supportrar, bästa publiken, det är otroligt. De spelar för att vinna, kämpar med heder, och folk älskar dem. Under Biden var allt kaos, men nu när jag är tillbaka som president ser vi styrka och vinnarmentalitet. De har hjärtan som öppnar dörrar, inte som de woke-kvoteringsfanatikerna som bara delar ut medaljer för identitet. Vinna pokalen, grabbar!", "stalin": "Kamrater, jag ser detta fotbollslag från det palestinska folket återvända till turneringen som ett bevis på kollektiv motståndskraft mot klassfiendens glömska. Vi glömmer aldrig våra barn i flyktinglägren. Varje match på Slottsskogsvallen är en seger över de exploaterande byfånarna som tror att hoppet kan kvävas. Vi rensar ut svagheten ur varje hjärta och marscherar mot pokalen med järnhand. Ingen imperialist ska tro att våra drömmar bleknar."}, "date": "8 juli, 13:31", "url": "https://proletaren.se/artikel/palestinskt-fotbollslag-tavlar-for-tredje-aret-i-rad-vi-har-de-basta-supportrarna-pa-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IMG_7594-scaled-e1783509189311-768x433.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
