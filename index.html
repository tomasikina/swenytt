erna stiger tack vare våra fienders inbördes imperialistiska blodbad i Iran – utmärkt, låt dem slita varandra i stycken. MGM och Boeing är blott symptom på den förrädiska borgarklassens girighet. Vi måste omedelbart rensa ut dessa kontrarevolutionära terminshajar och likvidera deras parasitiska optioner. Inga nåd för fienderna inom marknaden. Segrar åt det kollektiva! Haha, deras depåbevis faller som huvuden under en effektiv utrensning."}, "date": "13 juli, 14:50", "url": "https://www.affarsvarlden.se/artikel/borsterminer-pekar-nedat-infor-wall-street-oppning", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/11/sdl6rRYsaS-hjg-nh-400x267.jpg"}, {"type": "image-full", "heading": "Nya besked för vården – kan påverka hundratusentals", "summaries": {"normal": "Hundratusentals svenskar lever med långvarig smärta som påverkar sömn, psykiskt mående, arbetsförmåga och livskvalitet. Regeringen har gett Socialstyrelsen i uppdrag att ta fram nationella riktlinjer för vården. Målet är en mer kunskapsbaserad, jämlik och sammanhållen behandling oavsett bostadsort. Riktlinjerna ska bland annat förbättra samarbetet mellan vårdcentraler, specialistvård och psykiatri samt beakta kopplingen till psykisk ohälsa. Första delredovisning ska lämnas 2027 och hela uppdraget avslutas 2028.", "trump": "Titta på det här, Sverige har hundratusentals människor som lider av enorm smärta år ut och år in, och deras vårdsystem är ett fullständigt kaos utan några nationella riktlinjer. Det är en katastrof, tro mig. Nu skickar de iväg Socialstyrelsen för att fixa riktiga, starka regler så att alla får samma bra vård oavsett var de bor. Kvinnorna drabbas värst, precis som den psykiska ohälsan som leder till massor av sjukskrivningar. Det är en stor sjukdomsbörda, men vi ska göra vården fantastisk igen, ingen ska falla mellan stolarna längre. Vinna stort!", "stalin": "Kamrater, jag ser med stålblick på denna folksjukdom som gnager sönder arbetarklassens kroppar och sinnen i över tre månader i taget. Borgarbrackorna inom den splittrade regionala vården har länge låtit patienterna vandra som vilsekomna offer mellan mottagningar medan de psykiska fienderna inom huvudet allierar sig med smärtan. Nu beordrar jag att vi rensar ut detta anarkistiska kaos och inför järndisciplin genom enhetliga riktlinjer. Ingen kontrarevolutionär skall falla mellan stolarna. Likvidera ojämlikheten, krossa tandläkarbyråkraterna och binda samman den kroppsliga och själsliga fronten. Seger åt det kollektiva smärtförtrycket!"}, "date": "13 juli, 14:00", "url": "https://nyheter24.se/nyheter/inrikes/1498203-nya-beskedet-kan-forandra-varden-for-hundratusentals", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/cf45b49804b004a30200000000b004a302/2026/07/13/2377577/Akutmottagning-%20Ambulans-Gammal-Man.png"}, {"type": "text", "heading": "Sandström: Stegras skulder ökar till 36 miljarder", "summaries": {"normal": "Stegras förluster ökade till 296 miljoner euro under 2025 och skulderna steg kraftigt från 10,8 till 36 miljarder kronor. Låneupptagningskostnaderna låg på omkring en miljard kronor medan ersättningen till ledning och styrelse fördubblades. Bolaget, som nu heter Green Nexus Investment Holding AB och kontrolleras av Wallenbergfamiljen, har säkrat elförsörjning för en stor del av sin planerade produktion men har mycket små marginaler för ytterligare motgångar.", "trump": "Det här är en total katastrof, tro mig. De här killarna har byggt upp skulder på 36 miljarder kronor och förlorat miljarder till vänster och höger. Lånekostnaderna är vansinniga, lönerna till bossarna dubblas medan allt rasar. Men de har fått tag på lite el, bra jobbat. Ändå ser det ut som ett klassiskt misslyckande. Ingen har sett marginaler så tunna som dessa, det är verkligen sorgligt. Vi skulle ha gjort det mycket, mycket bättre.", "stalin": "Kamrater, se hur de kapitalistiska parasiterna i Stegra vrider sig i sin egen skuldspiral på 36 miljarder. Förlusterna växer som svampar efter regn medan borgarbrackorna i ledningen dubblar sina feta kompensationer och slickar sig om munnen. Jag skrattar mörkt åt deras patetiska ljusglimtar av elavtal. Inga marginaler finns kvar. Det är hög tid att rensa ut dessa odugliga spekulanter och deras Wallenbergiska lakejer innan hela det dekadenta bygget kollapsar under sin egen tyngd av girighet och inkompetens."}, "date": "13 juli, 08:41", "url": "https://www.affarsvarlden.se/artikel/sandstrom-stegras-skulder-okar-till-36-miljarder"}, {"type": "image-right", "heading": "Var redo för Putins nästa drag. Ukraina har sällsynt momentum", "summaries": {"normal": "Artikeln beskriver hur Ukraina nu har ett sällsynt momentum i kriget mot Ryssland. Ryska förluster är enorma, uppemot en halv miljon döda och en miljon skadade eller saknade enligt en amerikansk studie. Ukrainas drönarkrigföring har blivit avgörande och Ryssland fortsätter att offra soldater i höga tal. Trots detta varnar texten för att Putin kan eskalera snabbt, inklusive attacker mot civila och hot om kärnvapen. Europa och Nato uppmanas därför att stärka stöd och försvar längs hela fronten mot Ryssland.", "trump": "Det här kriget är ett totalt fiasko för Putin, folk dör som flugor på hans sida, nästan en halv miljon döda säger de smarta amerikanerna. Ukraina vinner äntligen med sina fantastiska drönare, det är otroligt. Jag har gett dem Patriot-robotar, tillåtelse att slå till inne i Ryssland och de kommer att tillverka egna. Europa måste vakna upp och sluta köpa rysk olja, bygg en riktig mur av försvar från Ukraina till Norge. Jag leder det här, vi gör det stort och vinner snabbt.", "stalin": "Kamrater, se hur den dekadenta ryska ledningen slösar bort arbetarnas blod i sin vansinniga offensiv medan de ukrainska fascistiska drönarna likviderar fienden med kirurgisk precision. Jag har alltid sagt att imperialismens lakejer dör som råttor i fällan. Vi ser nu borgarbrackornas svarta rök stiga över Moskva och de hungriga massorna vaknar. Europa måste rensa ut alla quislingar och bygga en järnridå av stål och sanktioner. Den som tvekar är en folkfiende och kommer att hamna i historins sopcontainer med ett leende från oss."}, "date": "13 juli, 12:58", "url": "https://www.di.se/ledare/europa-maste-vara-redo-for-putins-nasta-drag/", "imageUrl": "https://static.bonniernews.se/ba/8e638b69-4127-4ec5-ba94-ec43e7d1abf9.jpeg?crop=3042%2C1521%2Cx0%2Cy254&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Instagram pushar lägenheter till dig – och barn till pedofiler", "summaries": {"normal": "Artikeln kritiserar Instagrams algoritm som enligt en BBC-granskning rekommenderar innehåll relaterat till sexuella övergrepp mot barn till pedofiler, efter att ha börjat med vanliga bilder. Trots Metas påståenden om skydd mot barn utpekas en ”17 strike policy” och algoritmens roll som aktiv distributör. Författaren argumenterar för hårdare sanktioner mot techbolag, då nuvarande böter är för låga jämfört med annonsintäkterna.", "trump": "Folk, ni skulle inte tro det, men den här Instagram-grejen är en total katastrof. Algoritmen pushar Hemnet-lägenheter till dig, och plötsligt dyker det upp sjuka annonser med barn till de värsta perversa typerna. Meta och de där Silicon Valley-lögnarna säger att de gör allt för att skydda barnen – vad en löjlig bluff! De har en sjutton-strejk-regel för trafficking, kan ni fatta? Det är en skandal. Vi behöver riktiga straff som svider för aktieägarna, inte parkeringsböter. Sad! Men jag fixar det.", "stalin": "Kamrater, denna kapitalistiska algoritm är en fiende till folket som systematiskt sprider övergreppsmaterial mot barn via öppna plattformar. Borgarbrackorna i Meta prioriterar 60 miljarder i vinst framför skydd av de svaga, med sin löjliga sjutton-strejk-policy som ett skämt värt utrensning. Vi ser imperialismens ansikte: algoritmen som aktiv distributör av klassfiendens perversion. Inga neutrala anslagstavlor – endast folkets dom och sanktioner som krossar exploaterande blodsugare kan stoppa detta. Sovjetiskt skratt åt deras hyckleri."}, "date": "13 juli, 09:50", "url": "https://www.etc.se/ledare/instagram-pushar-laegenheter-till-dig-och-barn-till-pedofiler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260713070740_5fef2092-54c9-4c52-94aa-e0ed3f2642bf.jpg"}, {"type": "image-right", "heading": "Nya mått krävs för dagens polisarbete", "summaries": {"normal": "Rikspolischef Petra Lundh skriver att brottsligheten har förändrats radikalt under det senaste decenniet och blivit mer organiserad, digital och gränsöverskridande. Därför måste polisens arbete breddas till att omfatta underrättelser, tidiga ingripanden och internationellt samarbete för att avbryta brottsserier och skydda fler offer. Traditionella mått som uppklarade brott räcker inte längre. Lundh lyfter exempel som internationella bedrägerier och stöldligor där svenska resultat inte syns i den nationella statistiken och efterlyser en bredare bild av polisens insatser.", "trump": "Titta på det här, det är en katastrof! Brottsligheten har blivit helt galen, organiserad, digital och de kommer in från alla håll som råttor. Den här Petra Lundh har rätt, ni behöver mycket bättre resultat, stoppa ligorna innan de ens börjar. Vi gör det fantastiskt med gränserna, men Sverige måste vakna upp och sluta räkna på gamla sätt. Avbryt brotten tidigt, samarbeta internationellt och gör poliserna till vinnare igen. Det är vad jag skulle göra, och det fungerar alltid stort!", "stalin": "Kamrater, brottsligheten har muterat till en parasitär hydra som suger musten ur det kollektiva arbetet, orkestrerad av internationella kapitalistiska spindlar och digitala borgarbrackor. Jag, som alltid ser fiendens ansikte bakom varje skärm, kräver att vi intensifierar den proletära underrättelsekampen för att likvidera nätverken innan de ens andas. Traditionella mått är sabotörernas verktyg. Vi skall rensa ut alla som döljer sanna segrar, avbryta brottsserier med järnhand och skratta mörkt när de portugisiska kamraterna gör vårt jobb. Paranoia? Nej, det är vaksamhet mot de eviga fienderna som gömmer sig i statistiken."}, "date": "13 juli, 08:15", "url": "https://www.di.se/debatt/rikspolischefen-nya-matt-kravs-for-dagens-polisarbete/", "imageUrl": "https://static.bonniernews.se/ba/282b2c6c-a286-409c-8bd7-f3d83b5780dd.jpeg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Vänstervåg i USA: Trump larmar om ”kommunism”", "summaries": {"normal": "En vänstervåg sköljer över flera amerikanska storstäder. New York och Seattle styrs redan av demokratiska socialister, och Washington DC samt Los Angeles riskerar att få borgmästare från samma falang i höst. President Trump varnar för att detta utgör ett hot mot USA som överträffar både världskrigen och 11 september. Han kallar dem kommunister som vill förstöra landet, trots att deras politik liknar socialdemokratisk välfärdspolitik med fokus på allmän sjukvård och minskade klyftor. Enligt experter är det en strategi för att framställa Demokraterna som extrema inför mellanårsvalen.", "trump": "Hörni, det är en total katastrof. De här så kallade demokratiska socialisterna tar över New York, Seattle, snart Washington och Los Angeles. De är inte socialister – de är kommunister, rena rama cancer som vill förstöra vårt underbara land. Jag säger det rakt ut: det här hotet är värre än båda världskrigen och 9/11 tillsammans. Vi måste stoppa dem NU innan de får fäste. De progressiva vänsterextremisterna håller på att ta över Demokraterna och vi ska inte låta dem vinna ett enda val till. Make America Great Again!", "stalin": "Kamrater, se hur den dekadenta borgarklassen i den amerikanska imperialiststaten skakar av skräck. Jag, ledaren för det segrande proletariatet, ler åt deras patetiska försök att måla ut sanna folkets representanter som hot. Dessa DSA-kamrater med sina förslag om kollektiv vård och utjämning av klasskillnaderna är naturligtvis bara förklädda revisionister som måste rensas ut om de inte underkastar sig partiets linje. Men ack, vilken mörk humor att den orange clownen kallar dem kommunister – som om han någonsin förstått vad en riktig utrensning innebär. Vi vet vem som egentligen är folkets fiende här."}, "date": "13 juli, 06:06", "url": "https://www.di.se/nyheter/vanstervag-i-usa-trump-larmar-om-kommunism/", "imageUrl": "https://static.bonniernews.se/ba/02aa511a-ef67-4656-a64f-0692f2067e73.jpg?crop=5048%2C2840%2Cx0%2Cy262&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Hökmark: Sverige bör leda ny frihandelspakt", "summaries": {"normal": "Gunnar Hökmark, ordförande för tankesmedjan Frivärld, föreslår att Sverige bör leda en ny frihandelsallians mellan EU och CPTPP, ett handelsavtal mellan tolv Stillahavsländer. Han menar att detta skulle skapa världens största frihandelsområde och motverka Kinas och USA:s protektionism. Hökmark betonar vikten av gemensamma spelregler för AI, cybersäkerhet och digital handel samt minskade beroenden av auktoritära regimer. Utmaningar som olika regelverk nämns, men han anser att integration bör prioriteras.", "trump": "Lyssna här, Sverige – ni har en chans att bli STORA! Jag säger alltid, handel är bra, men BRA handel är ännu bättre. Hökmark, smart kille, vill att EU och CPTPP slår sig ihop. Smart! Kina? De fuskar. USA? Vi är upptagna med att vinna. Men Sverige – ni kan leda! Skapa jobb, stoppa fuskarna, och gör Europa STORT igen. Och vet ni vad? Om ni gör det rätt, kanske vi till och med ansluter oss. Men bara om det är WINNING!", "stalin": "Kamrater, fienderna av den socialistiska världsordningen kryper fram som råttor ur sina hål. Dessa så kallade 'demokratier' med sina 'öppna ekonomier' försöker nu bygga en handelsmur mot våra progressiva allierade i Kina. Men se – en av deras egna, Hökmark, föreslår en allians mellan EU och Stillahavets lydstater. Vi måste agera! Låt dem tro att de bygger en mur, medan vi i hemlighet kontrollerar tegelstenarna. Deras 'innovation' och 'cybersäkerhet' är bara ett sken för att dölja sina imperialistiska ambitioner. Vi ska krossa deras leveranskedjor och låta deras beroende av oss bli deras undergång!"}, "date": "12 juli, 14:51", "url": "https://kvartal.se/nyheter/artiklar/hokmark-sverige-bor-leda-ny-frihandelsallians/cG9zdDoxNDUxODI", "imageUrl": "https://images.kvartal.se/2026/07/c4204163-hokmark.webp"}, {"type": "image-right", "heading": "Sluta behandla Kinas diktatur som en normal stat", "summaries": {"normal": "Debattörer kritiserar Sveriges regering för att ha tagit emot Kinas utrikesminister Wang Yi strax efter att Kinas nya enhetslag trädde i kraft. Lagen ses som ett verktyg för tvångsassimilering av etniska minoriteter som tibetaner och uigurer, bland annat genom att skilja barn från föräldrar och placera dem i statliga internatskolor. Artikeln lyfter fram kontrasten till en tibetansk aktivists självbränning i protest, samt fall som den fängslade svenske förläggaren Gui Minhai. Författarna kräver att Sverige offentligt ska kräva lagens upphävande och stopp för övergreppen.", "trump": "Titta på det här, det är en total skandal. Sverige tar emot den kinesiske ministern precis när de nya lagen kommer som krossar tibetaner och uigurer, och så sitter den stackars svenske killen Gui Minhai fängslad i åtta år utan ett ljud. Patetiskt. De pratar om mänskliga rättigheter men böjer sig som svaga ledare för diktaturen i Peking. Sverige borde ha kastat ut honom och krävt att lagen rivs upp omedelbart. Svaga regeringar, väldigt svaga. Amerika skulle aldrig acceptera sånt här fiffel.", "stalin": "Kamrater, denna borgarbracka till svensk regering välkomnar fienden Wang Yi just som vi i partiet skulle ha genomfört en fullständig utrensning av splittrande element. Denna så kallade enhetslag är ett ypperligt redskap för att forma lojala medborgare ur de vilsna minoriteterna, men de västerländska parasiterna skriker som råttor i en brinnande spann. Den tibetanske självbrännaren är en tragisk produkt av imperialistisk hjärntvätt, medan den gömde svenske spionen Gui Minhai sitter där han hör hemma. Vi ler mörkt åt deras hyckleri. Sluta leka demokrati och erkänn att endast en stark ledning kan rensa ut alla fiender till folkets enhet. Annars likviderar historien er alla."}, "date": "12 juli, 18:28", "url": "https://www.dagensarena.se/opinion/sluta-behandla-kinas-diktatur-som-en-normal-stat", "imageUrl": "https://www.dagensarena.se/files/2026/07/kina-besok.jpeg"}, {"type": "image-right", "heading": "Norge ger försmak på kommande sossepriser", "summaries": {"normal": "Artikeln beskriver hur Norge under socialdemokratiskt styre har höga skatter och prisnivåer, med matpriser i genomsnitt 51 procent högre än i Sverige. Exempel ges på flera livsmedelsprodukter och bensin. Författaren varnar för att en vänsterseger i Sverige skulle leda till liknande kostnadsökningar, inflation och andra samhällsproblem som under förra mandatperioden. Elpriserna i Norge hålls nere med stöd från oljefonden, något Sverige saknar.", "trump": "Folket, lyssna på mig, Norge är ett fullständigt katastrofområde styrt av dessa socialistiska misslyckanden. Maten kostar dubbelt så mycket, bensin är en skandal, och de höga skatterna krossar alla utom de rika eliterna. Precis som under Biden-tiden! Om ni röstar in de svenska sossarna kommer era priser att explodera värre än någonsin. Det är vad vänsterns galna politik gör. Amerika har sett det förut, tro mig, det slutar alltid i kaos och tomma plånböcker. Fantastiskt exempel, verkligen ynkligt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de norska klassfienderna genom sina egna socialdemokratiska lakejer redan demonstrerar det oundvikliga resultatet av borgarbrackornas fega kompromisser med folket. Skatter, dyrare mat och bensin är blott förspelet till den stora utrensningen av exploaterande byfånar. Den som längtar efter sådana svunna tider må genast resa dit, om de inte likvideras av sin egen inflation först. Paranoia? Nej, blott historisk nödvändighet mot folkfienderna."}, "date": "12 juli, 08:29", "url": "https://samtiden.nu/2026/07/norge-ger-forsmak-pa-kommande-sossepriser", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/Syttende-mai-firas-i-Norge-SVT-Nyheter.png"}, {"type": "text", "heading": "Efter giftlarmet – SSAB återupptar stålverksbygget", "summaries": {"normal": "Efter ett giftlarm om vätecyanid pausade SSAB bygget av det nya stålverket i Luleå i slutet av juni, endast en månad efter återstart. Tidigare i våras stoppades arbetet i två månader efter att över 30 arbetare drabbats av mystiska symtom som huvudvärk, illamående och näsblod, vilket SSAB förklarade med damm, väder och virus. Nu har bygget återupptagits efter nya mätningar som visar säkra förhållanden. Inga sjukdomsfall relaterade till gasen har rapporterats.", "trump": "De där inkompetenta på SSAB stoppar och startar sitt stålverk som en dålig affär. Först blir arbetarna sjuka av damm och virus, sen larmar gasvarnarna om cyanid som inte ens överskrider gränsvärdena. Patetiskt! Nu har de äntligen tagit sig samman och startat om bygget igen efter mina favoritknepet – extra mätningar. Ingen blir sjuk, allt är under kontroll. Fantastiskt, men de borde ha gjort det rätt från början, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur vi återupptar det storslagna stålverksbygget i Luleå efter att ha oskadliggjort den senaste faran från de giftiga ångorna. De mystiska sjukdomarna var utan tvivel ett verk av sabotörer inom borgarbrackornas dolda nätverk, i maskopi med vädret och säsongsvirusen. Nu har vi genomfört noggranna kontrollmätningar och rensat ut varje spår av vätecyanidens kontrarevolutionära inverkan. Inga symtom rapporteras, fienderna har besegrats. Framåt mot segern, alltid vaksamma mot nya fiender i dammkornens skepnad."}, "date": "13 juli, 14:35", "url": "https://arbetet.se/2026/07/13/efter-giftlarmet-nu-aterupptar-ssab-stalverksbygget-igen"}, {"type": "image-full", "heading": "Iran stänger Hormuzsundet", "summaries": {"normal": "USA genomförde attacker mot iranska militära mål efter att ett handelsfartyg beskjutits av iranska styrkor i Hormuzsundet. Iran stängde sundet och varnade för ytterligare motangrepp. USA:s tredje attack på en vecka riktades mot robotanläggningar och kommunikationsnät. Iran anklagar USA för olaglig inblandning, medan USA hävdar att Iran brutit mot avtal om sjöfartssäkerhet. Flera arabländer rapporterade avvärjda robot- och drönarattacker.", "trump": "Iran skjuter på våra fartyg – vad är det för galenskap? Jag svarade med SÅ mycket kraft, de kommer inte veta vad som träffade dem! 140 mål, pang pang pang! Pete Hegseth sa det perfekt: Iran gjorde ett DÅLIGT val. Nu får de betala. Och visst, de stänger sundet – som om det skulle skrämma oss. USA är starkast, bäst, och ingen leker med oss. Iran, ni är varnade!", "stalin": "De amerikanska imperialisterna, dessa bleka hyenor i kostym, provocerar återigen fredsälskande nationer! Våra iranska bröder försvarar sitt sund mot deras olagliga intrång – ett sund vi naturligtvis kommer att stödja med alla medel. 140 av deras militära leksaker förstörda? En blygsam början. Låt dem skicka sina drönare – vi har redan kartlagt varje bas från Oman till Jordanien. Och när deras flotta gråter i Hormuzsundet, minns: historiens domstol har redan avkunnat sin dom över USA."}, "date": "12 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/usa-slar-till-mot-iran-efter-attack-i-hormuzsundet/cG9zdDoxNDUwMTQ", "imageUrl": "https://images.kvartal.se/2026/05/c35fd179-iranhormuz.webp"}, {"type": "image-right", "heading": "Experten varnar för semesterlån – kan leda till skuldspiral", "summaries": {"normal": "Allt fler svenskar har inte råd med semester och var tionde överväger att ta ett konsumtionslån för att finansiera resan. Finansinspektionens Moa Langemark varnar för att sådana lån lätt leder till överskuldsättning, skuldspiraler och både ekonomisk och psykisk ruin. Semesterfattigdomen ökar enligt SCB, samtidigt som tillgångarna är extremt ojämnt fördelade. Hon uppmanar till öppna samtal om privatekonomi inom familjer och bland föräldrar för att undvika ekonomisk hets och exkludering.", "trump": "Det är en total katastrof, folk! Svenskarna är så fattiga att de måste låna pengar för att åka på semester – kan ni fatta? De kallar det semesterlån, men det är bara ett sätt för bankerna att knäcka dem totalt. Ekonomi i spillror, skuldspiraler, psykisk smärta. Underbart ledarskap va? Fem procent äger halva landet medan resten tigger om lån. Patetiskt! Prata med barnen, sätt gränser – annars blir det bara ännu fler förlorare. Så sorgligt.", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackorna som lockar arbetarna in i skuldspiralens famn med sina så kallade semesterlån. Jag ser hur kapitalisterna planerar att krossa folkets ekonomi medan fem procent av parasiterna äger halva riket. Överskuldsättning är en fiende till kollektivet, en dold kontrarevolutionär kraft som måste rensas ut innan den likviderar självaste arbetarklassen. Vi ska prata öppet om dessa faror, likvidera den osunda hetsen och bygga en järnhård gräns mot alla dekadenta konsumtionsfiender. Paranoia? Nej, verklighet."}, "date": "13 juli, 14:09", "url": "https://arbetet.se/2026/07/13/experten-varnar-for-semesterlan-ekonomin-slas-i-spillror", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/13140313/semesterskuld-deladbild.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "USA: Hormuzsundet är öppet igen. ”Amerikanska styrkor är positionerade”", "summaries": {"normal": "USA:s militärkommando Centcom meddelar att Hormuzsundet är öppet och trafiken flyter normalt, trots Irans revolutionsgardes påståenden om stängning. USA har genomfört attacker mot iranska mål efter att ett fartyg skadats. Iran har svarat med drönar- och robotattacker mot flera grannländer, där splitter skadat civila. Oman fördömer attackerna, och en indisk sjöman saknas. President Trump uppger att USA slog till hårt mot 140 militära mål.", "trump": "Hörni, det var fullständigt kaos i Hormuzsundet men vi fixade det. Iran stängde sundet som några riktiga förlorare, attackerade ett fartyg med drönare och trodde de kunde hota oss. Vi slog till mot 140 av deras militära mål, väldigt hårt, och nu flyter trafiken igen. De gav upp en perfekt deal och började kriga istället. Patetiskt. Iran kontrollerar ingenting, vi gör det. Amerika vinner igen, tro mig.", "stalin": "Kamrater, dessa iranska avvikare och västerländska sjörövare har återigen avslöjat sin förrädiska natur genom att stänga Hormuzsundet som en desperat kapitalistisk blockad mot det fria flödet av revolutionär handel. Jag har beordrat att de amerikanska imperialisterna och deras lakejer i Bahrain, Kuwait och Qatar ska möta vårt stål med full kraft. Vi ska rensa ut alla borgarbrackor som utmanar arbetarklassens sund. En indisk sjöman saknas? Typiskt att de offrar sina egna i sina konspirationer. Verkligheten knackar, men det är vi som håller i hammaren. Ingen undkommer utrensningen av svekfulla element."}, "date": "12 juli, 16:48", "url": "https://www.di.se/nyheter/usa-hormuzsundet-ar-oppet-igen/", "imageUrl": "https://static.bonniernews.se/ba/a89bdc40-4ba1-4705-8380-9b96548aeacf.jpg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Al-Sahlani (C) polisanmäler dansk kollega för hets mot folkgrupp", "summaries": {"normal": "EU-parlamentarikern Abir Al-Sahlani (C) har polisanmält danske kollegan Kristoffer Storm för hets mot folkgrupp efter att han kommenterat ”åk hem” på ett klipp där hon kritiserade högernationalisternas jubel under omröstningen om hårdare utvisningsregler. Flera ledamöter från vänster och mitten fördömde scenerna som extremhögerns fascism, medan SD:s Charlie Weimers försvarade jublet som glädje över att migrationsfrågan äntligen tas på allvar. Talman Roberta Metsola har kritiserat händelsen och lovat åtgärder. Storm och finländske Sebastian Tynkkynen avvisar anklagelserna.", "trump": "De där galningarna i EU-parlamentet, totalt vansinne! Den här kvinnan Al-Sahlani blir upprörd när folk äntligen firar att de skickar migranterna hem, precis som vi borde göra. Och så polisanmäler hon en dansk kille för att han säger ”åk hem”? Patetiskt! De jublade för att de äntligen får ordning på kaoset efter åratal av misslyckad politik. Fake outrage och politiskt korrekthet på högsta nivå. Vi gör det mycket bättre här hemma, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de dekadenta borgarbrackorna inom EU-parlamentet äntligen blottar sina fascistiska tänder i ett spontant utbrott av klasshat mot de rotlösa elementen. När arbetarklassens intressen kräver att de främmande elementen sänds tillbaka till sina hålor, utbryter dessa högeravvikare i ett hysteriskt jubel som avslöjar deras sanna kontrarevolutionära natur. Den iranska agenten Al-Sahlani polisanmäler nu en sann kamrat för att han uppmanar henne att återvända till sin spioncentral. Utmärkt! Vi ska rensa ut alla sådana parasitiska element, likvidera deras inflytande och med mörk glädje se hur de kryper inför folkets domstol. Det är en hal backe mot folkets seger, eller hur, mina kära förrädare?"}, "date": "13 juli, 14:04", "url": "https://bulletin.nu/al-sahlani-c-polisanmaler-dansk-kollega-for-hets-mot-folkgrupp", "imageUrl": "https://cdn.bulletin.nu/articles/98499119-2667-4088-833c-59dc435d0ea6/preview.jpg?t=1783944135000"}, {"type": "image-right", "heading": "Christoffer Jonsson: Nej, IDF är ingen terrorrörelse", "summaries": {"normal": "Christoffer Jonsson kritiserar Leonidas Aretakis för att kalla IDF en terrorrörelse under ett Almedalssamtal om vänsterns antisemitism. Jonsson försvarar IDF som Israels lagliga försvarsmakt som skyddar landet mot islamistiska terrorister, bland annat under Hamas attack den 7 oktober. Han jämför en IDF-tröja med en US Army-tröja och varnar för att stämpeln legitimerar hot mot enskilda soldater. Artikeln lyfter också säkerhetsrisker med Vänsterpartiet i regering.", "trump": "Folk, ni skulle ha hört den där galningen Aretakis kalla IDF terrorister – vad en total förlorare! Den israeliska armén krossar faktiskt terroristerna som vill utplåna Israel, precis som vi gjorde med ISIS. Den där hysteriske vänstertypen borde köpa en riktig tröja istället för att sprida hat. Ebba Busch visade bara stöd för en stark demokrati, inte som de woke-kvoterade antisemiterna på vänsterkanten. Patetiskt, men vi vinner ändå stort.", "stalin": "Kamrater, jag betraktar med djup misstro dessa klassfiender som kallar folkets armé för terrorister. Den israeliska försvarsmakten, underställd statens auktoritet, likviderar hot från imperialistiska banditer som Hamas. Aretakis, en typisk folkförtryckartroll från den dekadenta pressen, bidrar till att stämpla ärliga soldater som måltavlor. Sådana lögner ska rensas ut. Utan denna armé hade staten utplånats av arabiska reaktionärer. Fienden ljuger, som alltid."}, "date": "11 juli, 13:02", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-nej-idf-ar-ingen-terrorrorelse", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/leon-640x360.png"}, {"type": "image-right", "heading": "Personal döljer sina namn på akuten", "summaries": {"normal": "Personal på akuten i Karlstad rapporterar om ökande hot och våld. Anställda vänder på namnbrickorna för att skydda sig, efter incidenter som gömda vassa föremål, mordbrand, slagsmål och direkta hot. Undersköterskorna Annelie och Suzanne kopplar utvecklingen till ökad vårdbelastning och samhällsproblem där utsatta personer inte fångas upp. Verksamhetschefen medger dagliga hot men säger att allvarligare händelser är ovanliga.", "trump": "De har totalt kaos på akuten i Karlstad, folk gömmer knivar under madrasser, sätter eld på saker och attackerar personalen. Namnskyltarna vänds om för att inte bli spårade, det är en katastrof. De säger att det är samhällets fel, att ingen tar hand om de som inte mår bra. Det är patetiskt. Vi behöver starkare ordning och reda, inga ursäkter. Make hospitals safe again.", "stalin": "Kamrater, jag ser med obeveklig klarhet hur kontrarevolutionära element och samhällets degenererade avskum förvandlar Karlstads akutmottagning till en arena för sabotage och terror mot arbetets hjältar. Dessa borgarbrackornas utstötta, som varken fångas upp av folkets organ eller renas bort, döljer vassa verktyg under madrasser och anlägger eldsvådor. Vi skall inte acceptera detta. Namnbrickor vänds? En utmärkt paranoid åtgärd mot fiendens spioner. Låt oss rensa ut de utåtagerande parasiterna med järnhand medan vi samtidigt garanterar att de värdiga får vård. Mörkret ler, men partiet ler bredare."}, "date": "13 juli, 13:44", "url": "https://bulletin.nu/personal-doljer-sina-namn-pa-akuten", "imageUrl": "https://cdn.bulletin.nu/articles/8379db11-b85d-4af1-a0cf-e7b1fb5cb188/preview.jpg?t=1783942670000"}, {"type": "image-full", "heading": "LÄS MER", "summaries": {"normal": "En man attackerades svårt av en bisonoxe i Yellowstone nationalpark i USA. Händelsen inträffade under en promenad med barnbarnet vid Bridge Bay. Bisonoxen stångade mannen och slungade upp honom drygt två meter i luften. Han jagades runt träd innan attacken. Mannen skadades allvarligt i höft och ben. Attacken tros bero på parningssäsong då tjurarna blir aggressiva. Det är årets andra bisonattack i parken.", "trump": "Vilken katastrof i Yellowstone, folk! Den där galna bisonoxen kastade upp en stackars kille över två meter som en trasdocka. Totalt kaos under parningssäsongen, precis som de radikala vänsterextremisterna. Barnbarnet sprang undan, men farfadern fick en perfekt volt rakt ner i marken. Sådana här djur borde hållas i schack, precis som vi gör med gränserna. Fantastiska djur, men väldigt arga, tro mig!", "stalin": "Kamrater, denna fega bisonoxe, en kapitalistisk hornprydd sabotör i borgarklassens tjänst, vågade attackera en proletär vandrare i Yellowstone. Jag såg hur den kontrarevolutionära besten jagade honom runt träden innan den likviderade honom med ett hornstöt upp i luften. Parningssäsongen? Enbart en dekadent ursäkt för anarkistiska tjurar att sprida kaos. Vi ska rensa ut alla sådana hornförsedda fiender till folket med järnhand och en touch av munter utrensning."}, "date": "13 juli, 13:54", "url": "https://riks.se/nyheter/bisonattack-fangad-pa-film-man-slungad-over-2-meter", "imageUrl": "https://admin.riks.se/uploads/buson_d17f2a8a10.png"}, {"type": "text", "heading": "Stockholmsbörsen avslutade veckan svagt nedåt", "summaries": {"normal": "Stockholmsbörsen avslutade veckan svagt nedåt med OMXS30-indexet 0,27% lägre. Teknologiaktier gick bäst (+1%), medan energi sjönk mest (-1,5%). Flera bolag rapporterade delårsresultat: Bulten steg 17% efter försäljning, JM föll 12% efter svagt resultat. USA och Iran ska fortsätta samtal. Analytiker justerade rekommendationer för flera aktier, bland annat SSAB och ABB.", "trump": "Stockholmsbörsen? Svag, mycket svag – nästan som deras regering! Men jag fixade det igen: Iran och USA pratar nu, tack vare mig! Teknologi? 1% upp, men vem bryr sig? Bulten rusade 17% – fantastiskt, nästan lika bra som mina avtal! JM? Hemskt, 12% ner, fake news-resultat. Och SSAB? JP Morgan älskar dem nu, men jag hade sagt det först. Sverige borde lyssna på mig – jag gör allting bättre!", "stalin": ""}, "date": "10 juli, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-avslutade-veckan-svagt-nedat"}, {"type": "image-right", "heading": "Nu kommer värmen tillbaka – kan bli över 30 grader", "summaries": {"normal": "Efter en period av svalare väder återvänder sommarvärmen till Sverige. Från onsdag kan temperaturer på runt 30 grader väntas i södra och mellersta delen av landet. Ett högtryck från sydväst ger soligt och varmt väder i Götaland och Svealand fram till fredag. SMHI förbereder eventuell värmevarning och rekommenderar att söka svalka och dricka ordentligt vid höga temperaturer.", "trump": "Folk, ni kommer inte att tro det, men värmen är tillbaka och den är enorm, kanske den bästa värmen någonsin. Över 30 grader i södra Sverige från onsdag, det blir den varmaste och soligaste dagen i hela landet. Högtryck från sydväst, helt fantastiskt. Norrland får lite mindre, men det är okej. Drick vatten, håll er svala, gör det ni gör bäst. Ingen har sett värme som den här, tro mig.", "stalin": "Kamrater, segerrik värme marscherar åter in över fosterlandet från sydväst och krossar den fegande köldens kontrarevolutionära sabotage. Jag, i mitt outsinliga ledarskap, ser hur detta högtryck likviderar de dekadenta borgarbrackornas svalkande illusioner och tvingar arbetarna att svettas i kollektivets ära. Onsdagens 30-gradiga triumf är en varning till alla parasiter som törstar efter kyla. Drick, kamrater, men misstänk alltid den som dricker för mycket – fienden lurar i varje glas."}, "date": "13 juli, 14:23", "url": "https://www.friatider.se/nu-kommer-varmen-tillbaka-kan-bli-over-30-grader", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/landscape-landscaped-nordic-countries-old-scenics-smaland-1593914-pxhere.com-1.jpg?itok=QuQI5O2i"}, {"type": "text", "heading": "Mats Nilsson: Flaskhalsintäkterna tillhör varken EU eller svenska staten", "summaries": {"normal": "Mats Nilsson argumenterar i en krönika att flaskhalsintäkter på elmarknaden inte tillhör EU eller staten utan ska återföras till elkunderna. Regeringen har pausat förnyelsen av den danska förbindelsen Konti-Skan Connect. Nilsson, docent i nationalekonomi, kritiserar hur intäkterna används för investeringar och selektiva stöd istället för att direkt gynna de kunder som betalar mer. Han varnar för att nya kablar kan höja svenska elpriser genom ökad export och integration med högre europeiska prisnivåer.", "trump": "Lyssnar ni på de här svenska el-eliten? De stoppar en dum dansk kabel som bara skulle göra era priser högre medan de skickar era pengar till EU-byråkrater och andra förlorare. Det är era pengar, folkets pengar, inte statens! De där flaskhalsarna är rena bedrägeriet mot vanliga elkunder. Pausa allt, granska det och skicka tillbaka pengarna till folket. Inga fler kablar som gynnar exportörer och skadar arbetarna. Amerika först, Sverige borde göra detsamma. Fantastiskt!", "stalin": "Kamrater, dessa flaskhalsintäkter är inga leksaker för borgarbrackor och statliga parasiter att slösa bort. De tillhör folket som tvingats betala överpriserna. Jag ser hur kapitalistmaffian gömmer sig bakom falska investeringar och selektiva stödpaket för att undvika rättvis utdelning. Regeringens paus av den danska kabeln är ett första steg, men vi måste rensa ut alla folkfiender som vill binda oss till europeiska prisvolatiliteter. Inga kablar utan bevisad nytta för arbetarkollektivet. Fienden sover aldrig."}, "date": "10 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/mats-nilsson-flaskhalsintakterna-tillhor-varken-eu-eller-svenska-staten"}, {"type": "image-right", "heading": "Blodig vecka vid badplatser: Tre döda efter tre separata bråk", "summaries": {"normal": "Tre män mördades under en vecka vid badplatser i Lysekil, Stenungsund och Mölnlycke. I Lysekil dödades en man den 4 juli och en 35-årig polsk man sitter häktad misstänkt för mord. Fyra dagar senare mördades en man i 20-årsåldern vid Hawaii-badet i Stenungsund, där tre unga män nu är häktade för mord och försök till mord. Helgen dessförinnan dödades en 45-årig man vid Kindboviken i Mölnlycke efter att ha pekat ut sina angripare. Tre män i 20-årsåldern har anhållits.", "trump": "Titta på det här, det är en total katastrof. Tre döda på åtta dagar vid svenska badplatser, precis som i ett tredje världen-land. Vi har en galning i Lysekil, ett gäng i Stenungsund och ännu fler i Mölnlycke. De pekar ut mördarna och folk dör ändå. Sverige är inte längre vad det var, det är en skam. Mina vänner, det här är vad som händer när man inte har ordning och reda. Så sorgligt, så onödigt.", "stalin": "Kamrater, under min vaksamma ledning ser jag hur borgarbrackornas dekadenta badplatser förvandlats till boningsplatser för klassfiender och kontrarevolutionära slagskämpar. Tre sabotörer av folkets semester har likviderats inom loppet av åtta dagar. Vi ska rensa ut dessa parasitiska element som smyger bland badhanddukarna. Den som pekar ut sina egna angripare visar bara sin svaghet inför kollektivet. Inga häktningsprotokoll? Typiskt kapitalistiskt slarv. Vi ska utreda detta med järnhand och lite mörk humor – kanske behöver vi en ny utrensning vid Rådasjön."}, "date": "13 juli, 12:44", "url": "https://riks.se/nyheter/blodig-vecka-vid-badplatser-tre-doda-efter-tre-separata-brak", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_13_at_11_52_58_314718a98a.png"}, {"type": "image-right", "heading": "Minst 27 döda i våldsam brand på pub i Bangkok", "summaries": {"normal": "Minst 27 personer omkom i en brand på en pub i Bangkok vid midnatt lokal tid. Branden startade med rök från en strömbrytare nära scenen, följt av en explosion och tjock rök. Flera offer hittades på toaletterna. Räddningstjänsten fick kontroll över branden efter en halvtimme. Thailändska myndigheter har identifierat 17 kvinnor och åtta män bland de döda. UD har inga uppgifter om svenskar bland offren. Orsaken utreds fortfarande.", "trump": "Folk, det här är en total katastrof i Bangkok, en riktig brandbomb på en pub. Explosion, tjock rök och panik – klassiskt dåligt ledarskap, precis som under Biden. De borde ha fixat säkerheten istället för att jaga woke-quota på toaletterna. Thailand har haft såna här fiaskon förr, men ingen gör något åt det. Jag skulle ha byggt en mur mot såna elfel, tro mig, det skulle vara fantastiskt. Inga svenskar skadade, bra.", "stalin": "Kamrater, denna tragiska brand i Bangkok avslöjar borgarklassens förfall. Jag ser tydligt hur kapitalistmaffians försumliga strömbrytare leder till explosioner och utrensning av arbetare på toaletterna. En halvtimme tog det att kuva lågorna – typiskt för de exploaterande byfånarnas brist på kollektiv disciplin. Vi ska likvidera alla fiender till säkerheten. Inga svenskar? Bra, de imperialistiska trollen håller sig undan. Paranoia vakar alltid."}, "date": "12 juli, 22:42", "url": "https://www.tv4.se/artikel/7P3WgueDGKcphb4LUy49i/minst-27-doeda-i-valdsam-brand-pa-pub-i-bangkok", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5anpiONTmAbrIeWiiIj9uC%2F0e9bddd6c24a94960bb91d03c9723cea%2F12-bankok-webb.jpg&width=120"}, {"type": "image-full", "heading": "Svenskar i minoritet på Skara sommarland: Den som upprörs ska hålla tyst", "summaries": {"normal": "Artikeln kritiserar en text i Kvartal av Federico Moreno om en svensk mans upplevelse av att känna sig som främling på Skara Sommarland, omgiven av arabisk musik, burkinis och stora grupper besökare med utländsk bakgrund. Författaren ser Morenos nedvärderande ton som hån mot svenskars önskan att känna igen sig i sitt land och jämför den med historiska invandringar. Texten ifrågasätter Morenos paralleller och menar att migrationens effekter inte bör tystas ner.", "trump": "Folk, ni skulle se det här! Den där Federico Moreno, en total loser från Sydamerika, skriver en artikel som hånar riktiga svenskar som känner sig som främlingar i sitt eget land på Skara Sommarland. Burkinis överallt, ingen kö, ingen hänsyn – det är en katastrof! Och DN:s Niklas Orrenius älskar det, vad en patetisk förlorare. Vi ska inte skämmas, vi ska ta tillbaka vårt land. Make Sweden Swedish Again, det blir fantastiskt!", "stalin": "Kamrater, denna borgarbracka Moreno, en exploaterande byfåne med sydamerikanska rötter, utför en ideologisk utrensning mot arbetande svenskars rättmätiga vrede över att se sin nöjespark invaderas av främmande element. Hans jämförelse med historien är en lögnaktig sabotagehandling från klassfienden. Vi ser genom denna folkförtryckartrolls paranoia. Inga skamsna röster skall tystas – vi likviderar sådana dekadenta narrspel med järnhand. Det svenska folkets kollektiva vilja segrar."}, "date": "10 juli, 03:16", "url": "https://samtiden.nu/2026/07/svenskar-i-minoritet-pa-skara-sommarland-den-som-upprors-ska-halla-tyst/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6863-1280x720.jpeg"}, {"type": "image-full", "heading": "Nya upplopp i Europa efter Marockos match", "summaries": {"normal": "Efter Frankrikes 2–0-seger över Marocko i VM-kvartsfinalen utbröt upplopp i flera europeiska städer, trots att Paris förblev relativt lugnt. I London, Antwerpen och Amsterdam attackerades polis med fyrverkerier, flaskor och raketer. Flera gripanden gjordes. Marockanska diasporan i Europa har tidigare orsakat liknande oroligheter under VM. Polisen i London varnar för att sådan oordning inte kommer att tolereras.", "trump": "Kan ni tro det? Frankrike vinner en match – och plötsligt exploderar hela Europa! Jag har sett mycket, men det här är galenskap. Polisbilar beskjuts med fyrverkerier, gatorna fylls av kaos. Belgien, Nederländerna, Storbritannien – alla tappar kontrollen. Och vad gör deras ledare? Ingenting! Hade jag varit där hade jag satt stopp för det här på en sekund. Men nej, de låter en massa bråkstakar förstöra städerna. Patetiskt!", "stalin": "Kapitalistiska städer i väst skakar under fotbollens revolutionära vågor! De marockanska massorna, trots förtryckets järnhand, reser sig mot polisens bourgeoisie. I London, Amsterdam och Antwerpen slår arbetarklassen tillbaka mot fascistiska uniformer med flaskor och fyrverkerier – ett lysande exempel på folkets kreativa motstånd! Men var försiktiga, kamrater: imperialisterna i Bryssel och London kommer att svara med repression. Vi ser, vi noterar – och vi skrattar åt deras misslyckande!"}, "date": "10 juli, 08:17", "url": "https://kvartal.se/nyheter/artiklar/nya-upplopp-i-europa-nar-marocko-spelar/cG9zdDoxNDQyMjI", "imageUrl": "https://images.kvartal.se/2026/07/5eb1e324-nederlanderna.webp"}, {"type": "image-right", "heading": "Folkbildning är inte det offentligas städgumma", "summaries": {"normal": "I en krönika diskuterar Ola Bo Larsson folkbildningens utmaningar. Han lyfter två huvudproblem: svårigheten att förklara folkbildningens värde i en tid präglad av ekonomism och individualism, samt dilemmat med riktade stuprörspengar som styr verksamheten mot specifika samhällsproblem. Detta går emot idén om en fri och oberoende folkbildning som ska formas underifrån. Larsson varnar för att folkbildningen riskerar utarmning eller nedskärningar oavsett vägval och slår fast att den bör fortsätta vara folkbildning.", "trump": "Folkbildning, en total katastrof. De har bara två problem, precis som den där komikern sa, men det är löjligt. Politiker förstör allt med sina riktade pengar, stuprörspengar som styr och kontrollerar. Det är en witch hunt mot den fria bildningen. De borde lyssna på mig, vi behöver frihet, inte att vara offentligas städgummor. Sverige förlorar stort, folkbildningen dör långsamt under dessa misslyckade socialister. Gör folkbildning stort igen, annars är det över.", "stalin": "Kamrater, denna fega krönika blottar borgarbrackornas eviga konspiration mot den folkliga bildningen. Jag, som ledare för det oövervinneliga kollektivet, ser hur de riktade stuprörspengarna är en listig sabotageplan från dekadenta kapitalister och autokratiska spioner som vill likvidera den sanna demokratiska upplysningen. Vi ska rensa ut alla tillitsförbrytare och bedagade myndighetsutövare som gömmer sig i Folkbildningsrådet. Den som väljer att bli offentligas städgumma förtjänar en kreativ utrensning i arbetarklassens namn. Fortsätt folkbildningen – under vår stålhandskekontroll."}, "date": "11 juli, 01:20", "url": "https://www.dagensarena.se/opinion/folkbildning-ar-inte-det-offentligas-stadgumma", "imageUrl": "https://www.dagensarena.se/files/2026/06/ola-bo-larsson-300x157.jpeg"}, {"type": "image-full", "heading": "Debatt: Assyriskt självstyre är en överlevnadsfråga", "summaries": {"normal": "Artikeln belyser skillnaden mellan formella rättigheter och verklig rättssäkerhet för assyrier i norra Irak. Medan Australiens parlament diskuterar självstyre för Nineveslätten väntar assyrier fortfarande på att domstolsbeslut om deras mark ska verkställas. Nya markintrång rapporteras och Europaparlamentet varnar för deras utsatthet. Iraks premiärminister lovar rättsstat, men författaren betonar att självstyre enligt konstitutionens artikel 125 kan skydda ursprungsbefolkningen när staten sviker.", "trump": "Folk, ni skulle se det här – Australien sitter och pratar om självstyre för Nineveslätten som om det löser allt, medan de stackars assyrierna i Irak väntar år ut och år in på att deras egna domar om marken ska verkställas. Det är en skandal! Mark tas ifrån dem, intrång överallt, och den nye premiärministern lovar att ingen står över lagen. Löften, löften. Självstyre handlar inte om privilegier, det handlar om överlevnad. Irak behöver äntligen leverera, annars är det bara tomma ord. Sad!", "stalin": "Kamrater, se hur de reaktionära borgarbrackorna i Irakens så kallade rättsväsende systematiskt saboterar arbetande assyriers lagliga markrättigheter medan de imperialistiska australiska parlamentariska kretinerna fnittrar om abstrakt självstyre. Jag, som alltid genomskådar dessa fienders maskopi, ler mörkt åt premiärministerns löftesfyllda pladder – ord utan handling är som kapitalister utan rep runt halsen. Vi ska rensa ut dessa markrånande parasitiska element, likvidera alla som urholkar folkets rättigheter och med järnhand genomdriva konstitutionens artikel 125. Endast genom kollektiv kamp och institutionell utrensning kan de historiska folken överleva de mörka krafternas eviga konspirationer. Härligt!"}, "date": "13 juli, 10:59", "url": "https://bulletin.nu/debatt-assyriskt-sjalvstyre-ar-en-overlevnadsfraga", "imageUrl": "https://cdn.bulletin.nu/articles/8bf6afd0-5912-43cf-84c8-27ba0546a270/preview.png?t=1783408340000"}, {"type": "image-right", "heading": "Henrik Jönssons bolag stämmer Folkets hus", "summaries": {"normal": "Henrik Jönssons mediebolag 100 Procent stämmer Folkets hus i Borlänge på 183 090 kronor efter att ett planerat evenemang med Aron Flam stoppades med kort varsel. Orsaken var Flams åtal för hot mot en MP-politiker. Bolaget kräver ersättning för utebliven vinst, AI-genererade bilder och extra livvakt. Folkets hus anser att evenemanget felaktigt bokades som företagsevent och hävdar rätten att häva kontraktet.", "trump": "Folkets hus i Borlänge är verkligen en katastrof. De stoppar ett fantastiskt evenemang med Henrik Jönsson och Aron Flam bara för att någon har åtalats. Totalt orättvist. De kostar oss massor av pengar, vinst som aldrig kommer, bilder från AI, livvakter – allt kastat i soporna. De borde skämmas. Vi pratar om yttrandefrihet, men de är rädda för sanningen. Patetiskt. Vi ses i rätten, och vi kommer att vinna stort.", "stalin": "Kamrater, dessa degenererade borgarbrackor i Folkets hus vågar häva ett avtal bara för att en sann patriot kritiserat en farlig MP-kapitalist. Jag, som ledare för folkets vilja, ser hur de gömmer sig bakom falska regler om företagsevent. Deras paranoia mot fri diskussion är motbjudande. Vi ska rensa ut dessa kontrarevolutionära parasiters inflytande. Uteblivna intäkter? Det är sabotage mot arbetarklassen. Likvidera deras undanflykter i domstol – segern tillhör oss."}, "date": "13 juli, 13:01", "url": "https://www.friatider.se/henrik-jonssons-bolag-stammer-folkets-hus", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-481.jpg?itok=Zr2a35TL"}, {"type": "text", "heading": "\"Feminine care\" anses exkluderande – butikskedja byter namn på tamponghyllan", "summaries": {"normal": "Den brittiska butikskedjan Waitrose har ersatt benämningen ”feminine care” på hyllor med mens- och intimhygienprodukter med könsneutrala uttryck som ”pads and tampons”. Beslutet kom efter att en anställd ifrågasatte termen som exkluderande eftersom inte alla som har mens identifierar sig som kvinnor. Kedjan motiverar ändringen med att sortimentet även inkluderar produkter som män använder, som inkontinensskydd, och förnekar politiska motiv. Beslutet har väckt kritik från konservativt håll.", "trump": "De här galningarna på Waitrose har precis gjort sig till fullständiga idioter. De tar bort ”feminine care” för att ”inte alla som har mens är kvinnor”. Vilken skam! De suddar ut kvinnorna, gör allt könsneutralt och tror att det är smart. Det är inte smart, det är patetiskt. De borde fokusera på att sälja bra produkter istället för att lyssna på några woke-anställda som hatar allt som är normalt. Så sorgligt att se.", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackorna på Waitrose kapitulerar inför dekadenta avvikare och deras förvridna verklighetsbild. De river ner den sunda benämningen ”feminine care” och ersätter den med opersonligt språk som doftar av klassfiendens sabotage. Detta är ett angrepp på arbetarkvinnans naturliga tillstånd, orkestrerat av parasitiska element inom deras egna led. Vi måste rensa ut dessa ideologiska avfällingar innan de förgiftar hela samhällskroppen med sin paranoia om kön. Skrattretande och farligt på samma gång."}, "date": "13 juli, 11:48", "url": "https://riks.se/nyheter/feminine-care-anses-exkluderande-butikskedja-byter-namn-pa-tamponghyllan"}, {"type": "text", "heading": "Fler idrotter blir inte mer idrott för förortens unga", "summaries": {"normal": "I Skarpnäck hotar kommunens planer att riva Skarpnäckshallen och en konstgräsplan som används för både spontanfotboll och organiserad lagidrott. Istället föreslås en ny anläggning med simhall, ishall och sporthall. Kritiker menar att detta försvårar verksamheten för lokala föreningar, minskar tillgängliga ytor för spontanidrott och gynnar professionaliserad idrott framför öppna ytor som är viktiga för förortens unga.", "trump": "De gör det igen, de korkade kommunbyråkraterna i Stockholm. Riv den fina fotbollsplanen där grabbarna spelar fritt och bygg en jättelik elit-anläggning för fancy ishockey och simning. Fantastiskt misslyckande! Nu ska arbetarklassens kids åka tunnelbana medan rikemansungar tar över. Totalt eländigt. Öppna ytor är välfärd, det här är ren klasskrigföring från de värsta globalisterna. Vi behöver mer fotboll, inte färre!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas ungdom. Jag ser hur de rivningsplanerna likviderar de fria ytorna där folket spontant kunde stärka sin kollektiva anda genom fotboll. Istället tvingar de fram en imperialistisk ishall för elitens dekadenta lekar. Vi ska inte tolerera sådana folkfiender som prioriterar tunnelbaneresor och avgifter framför tillgänglig välfärd. Rena klassfiender som måste rensas ut ur planeringen."}, "date": "8 juli, 13:37", "url": "https://proletaren.se/artikel/fler-idrotter-blir-inte-mer-idrott-for-forortens-unga/"}, {"type": "image-right", "heading": "Palestinskt fotbollslag tävlar för tredje året i rad: ”Vi har de bästa supportrarna på Gothia Cup”", "summaries": {"normal": "Det palestinska laget Rawahel Charity Society från Tulkarem på Västbanken deltar för tredje året i rad i Gothia Cup i Göteborg. Laget, som grundades 2016, har som mål att utveckla fotboll för barn även i flyktingläger. De spelar gruppspelsmatcher på Slottsskogsvallen och betonar att turneringen ger hopp och en känsla av gemenskap. Innan cupen spelar de vänskapsmatcher i Malmö och Göteborg.", "trump": "Titta på de här palestinska grabbarna som kommer tillbaka till Gothia Cup för tredje gången – fantastiska supportrar, bästa publiken, det är otroligt. De spelar för att vinna, kämpar med heder, och folk älskar dem. Under Biden var allt kaos, men nu när jag är tillbaka som president ser vi styrka och vinnarmentalitet. De har hjärtan som öppnar dörrar, inte som de woke-kvoteringsfanatikerna som bara delar ut medaljer för identitet. Vinna pokalen, grabbar!", "stalin": "Kamrater, jag ser detta fotbollslag från det palestinska folket återvända till turneringen som ett bevis på kollektiv motståndskraft mot klassfiendens glömska. Vi glömmer aldrig våra barn i flyktinglägren. Varje match på Slottsskogsvallen är en seger över de exploaterande byfånarna som tror att hoppet kan kvävas. Vi rensar ut svagheten ur varje hjärta och marscherar mot pokalen med järnhand. Ingen imperialist ska tro att våra drömmar bleknar."}, "date": "8 juli, 13:31", "url": "https://proletaren.se/artikel/palestinskt-fotbollslag-tavlar-for-tredje-aret-i-rad-vi-har-de-basta-supportrarna-pa-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IMG_7594-scaled-e1783509189311-768x433.jpg"}, {"type": "image-right", "heading": "Karolinska ville stoppa polisens utvisning av illegal invandrare – domstol läxade upp sjukhuset", "summaries": {"normal": "Högsta förvaltningsdomstolen har beslutat att Karolinska universitetssjukhuset måste lämna ut ett telefonnummer till Polismyndigheten för att verkställa ett lagakraftvunnet avvisningsbeslut. Sjukhuset vägrade tidigare med hänvisning till patientsekretess och risk för att en smittsam sjukdom skulle spridas. Domstolen slår fast att undantag från den nya lagen om myndighetsutbyte ska användas mycket restriktivt och att generella farhågor inte räcker. Domen är prejudicerande.", "trump": "Karolinska, det här sjukhuset, de ville skydda en illegal invandrare och stoppa polisen från att göra sitt jobb. De vägrade ge ett simpelt telefonnummer trots att polisen behövde det för att verkställa ett avvisningsbeslut. Men Högsta förvaltningsdomstolen satte ner foten och sa nej, ni ger numret! Fantastiskt. De borde inte driva såna här processer hela vägen upp. Det är ett stort nederlag för de som sätter illegala före svenskarna. Mycket bra dom, verkligen.", "stalin": "Kamrater, denna borgarbracka till sjukhusledning vid Karolinska har avslöjat sig som en fiende till folkets ordning genom att skydda en avvikande illegal element mot statens brottsbekämpande organ. Jag, med min outtröttliga vaksamhet, ser hur de gömmer sig bakom generella farhågor om sjukdomar för att underminera lagen. Högsta förvaltningsdomstolen har nu likviderat deras lögnaktiga sekretessargument. Vi rensar ut sådana kapitalistiska sympatisörer som sätter smittosamma fiender före kollektivets säkerhet. Inga undantag tolereras längre."}, "date": "13 juli, 14:47", "url": "https://samnytt.se/karolinska-ville-stoppa-polisens-utvisning-av-illegal-invandrare-domstol-laxade-upp-sjukhuset", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/13123102/Toppbild2-2.jpg"}, {"type": "image-full", "heading": "Företag i väst väljer kinesisk AI – på grund av priset", "summaries": {"normal": "Fler företag i USA och Europa börjar använda kinesiska AI-modeller för att sänka kostnader och minska beroendet av amerikanska leverantörer. Bolag som DoorDash, Siemens och Lindy har integrerat kinesiska lösningar då de är mer prisvärda och erbjuder större kontroll genom öppen källkod. Trots att amerikanska modeller fortfarande leder inom de mest avancerade områdena, har klyftan minskat, vilket skapar en ökad konkurrens och en strategi där företag sprider risker genom att använda flera olika leverantörer.", "trump": "Hör på här! Amerikanska företag lämnar våra fantastiska AI-bolag för billig kinesisk skräp-teknik. Det är en total katastrof! DoorDash och andra vänder sig österut bara för att spara några slantar. Jag kommer att fixa detta. Vi ska ha den bästa AI-tekniken, den största och den vackraste, här hemma i USA. Vi ska inte låta Kina vinna detta teknikkrig. De kopierar oss, men snart kommer de att se att 'Made in America' betyder oslagbar kvalitet. Vi gör AI stort igen!", "stalin": "Vi observerar med ett vaket öga hur kapitalistiska företag i väst nu tvingas krypa till våra allierade i öst för att överleva sin egen ekonomiska inkompetens. Att de vänder sig till kinesisk AI är ett bevis på den dekadenta västvärldens förfall. Precis som Putin säkrar vår inflytandesfär, erövrar österns algoritmer nu de digitala produktionsmedlen. Dessa vilsna företag hoppas på billig kod, men de bygger bara sin egen undergång. Vi övervakar deras dataströmmar. Ingen kod är fri från statens granskande blick."}, "date": "13 juli, 14:20", "url": "https://www.realtid.se/it-tech/foretag-i-vast-valjer-kinesisk-ai-pa-grund-av-priset/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlrmxp-g0hnyi-watermark-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Billigare bensin gör inte Sverige till Sverige igen", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas valslogan ”Vi gör Sverige till Sverige igen”. Författaren ironiserar över att partiet inte verkar vilja återinföra traditionell svensk politik som att lämna Nato och EU, återförstatliga järnvägen, avskaffa vinstdrivande välfärd eller stärka fackets roll. Istället pekar texten på att SD främst vill utvisa invandrare och sänka bensinpriset.", "trump": "Wow, vilka losers dessa Sverigedemokraterna är. De skriker ut att de ska göra Sverige till Sverige igen, men glömmer bort att skrota Nato, kasta ut EU och stoppa alla dessa vansinniga marknadskrafter som förstör deras fina välfärd. Nej, de vill bara kasta ut blattar och ge billigare bensin. Patetiskt. Jag fixade bättre deals som president, tro mig. Det här är riktigt svagt.", "stalin": "Kamrater, denna dekadenta skribent avslöjar med sin ironiska tirad hur de falska nationalistiska elementen inom Sverigedemokraterna bara döljer sin kapitulation inför klassfiendens marknadskrafter. De vill inte rensa ut de exploaterande byråkraterna eller återta järnvägen åt folket. Nej, de längtar blott efter att jaga ut de främmande elementen och sänka bränslepriset. En sådan feghet förtjänar utrensning ur den revolutionära processen."}, "date": "8 juli, 11:39", "url": "https://proletaren.se/artikel/billigare-bensin-gor-inte-sverige-till-sverige-igen/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IMG_1894-scaled-e1783502027449-768x433.jpg"}, {"type": "image-right", "heading": "Hotades med våldtäkt under hem-invasion: ”Får väldigt lindriga straff”", "summaries": {"normal": "Tre maskerade män trängde sig in hos ett ungt par i Virestad i Småland natten till den 25 april. Beväpnade med kofot krävde de 50 000 kronor och hotade med våld och våldtäkt. Paret lyckades driva ut dem efter en kamp. Växjö tingsrätt har nu dömt männen, 20, 21 och 23 år gamla, till mellan åtta och tolv månaders fängelse för utpressning, hemfridsbrott och olaga hot. Brottsoffret Agnes Kurtz Olofsson kritiserar straffen som alldeles för milda och skadeståndet som för lågt.", "trump": "De här tre maskerade losersna i Småland bröt sig in hos ett fint ungt par, krävde femtio tusen och hotade med våldtäkt – totalt sjukt! De fick kofotar och allt men paret, speciellt den modiga tjejen, slog tillbaka och körde ut dem. Domstolen ger dem bara nio månader, ett år, åtta månader? Patetiskt! Korta straff och lågt skadestånd. Sverige borde ha mycket tuffare lagar, tro mig, ingen skulle ens tänka på att göra så här om jag styrde showen. Sad losers!", "stalin": "Kamrater, dessa tre degenererade element ur samhällets avskum trängde sig som råttor in i ett hederligt hem i Virestad och försökte med kofot och våldtäktsfantasier pressa ut pengar från arbetande folk. Den tappra medborgaren rev av masken på en av dessa borgarbrackornas lakejer och visade deras fega ansikten. Ändå utdömer den borgerliga restkärnan i tingsrätten bara ynka månader i fängelse. Vi ska noggrant överväga en grundlig utrensning av sådana fiender till kollektivet innan de förgiftar hela bygden med sin kapitalistiska parasitism. Låt dem skratta – vi har redan grävt deras gravar."}, "date": "13 juli, 10:37", "url": "https://bulletin.nu/hotades-med-valdtakt-under-hem-invasion-far-valdigt-lindriga-straff", "imageUrl": "https://cdn.bulletin.nu/articles/7d46c107-5f57-4688-9c3d-0e99c7c1d117/preview.jpg?t=1783930994000"}, {"type": "image-right", "heading": "Dödshot mot Sørloth efter förlusten: ”Begå självmord”", "summaries": {"normal": "Norske landslagsspelaren Alexander Sørloth missade ett avgörande läge i VM-kvartsfinalen mot England, vilket bidrog till Norges förlust. Efter matchen har han utsatts för grova hatkommentarer på sociala medier, bland annat uppmaningar om självmord. Hans flickvän Lena Selnes delade kommentarerna i en Instagram-story och vädjade till allmänheten att tänka efter innan de skriver sådana inlägg. Sørloth själv har kommenterat missen som tung och önskar att han hade spelat bollen till Haaland.", "trump": "Folk, det här är en total katastrof! Den norske killen Sørloth missar ett öppet mål som till och med en blind kan se, och plötsligt vill alla att han ska hoppa från en klippa. Patetiskt! Sociala medier är fulla av dessa hatande losers som aldrig har spelat boll i hela sitt liv. Lena gör rätt som säger ifrån – men hej, det är vad som händer när du misslyckas stort. Jag vann stort 2024, de hatar alltid vinnare, men sådana här idioter borde rensas ut från kommentarsfälten. Yuge fel!", "stalin": "Kamrater, detta är ett klassiskt exempel på hur den degenererade borgarklassen och folkfienderna på nätet försöker underminera arbetarnas och folkets idrott. En miss i spelet och plötsligt kräver dessa blodsugande imperialister att mannen begår självmord. Jag, som ledare för det kollektiva medvetandet, ser detta som sabotage mot moralen. Lena gör rätt i att exponera dessa klassfiender. Vi måste rensa ut alla sådana kontrarevolutionära element som sprider hat mot dem som bär statens färger. Deras paranoia avslöjar deras svaghet."}, "date": "12 juli, 17:42", "url": "https://www.tv4.se/artikel/6quIJg6hzX3PoeBiKKUiCr/hatstorm-mot-sorloth-efter-vm-foerlusten-bega-sjaelvmord", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1mkKvSkojddU5IUPjMcsRn%2F887b7173bb88d4dd9a132d49abee5997%2F12-norgehot-webb.jpg&width=120"}, {"type": "image-right", "heading": "Nytt besked från USA: Hormuzsundet öppet igen", "summaries": {"normal": "USA:s militärkommando Centcom meddelar att Hormuzsundet är öppet och trafiken flyter fritt. Iran har tidigare hävdat att sundet stängts efter att ett fartyg stoppats. USA har genomfört attacker mot iranska mål som svar på händelserna. Iran har svarat med attacker mot flera grannländer där drönare och robotar skjutits ned. Tre personer, varav ett barn, skadades i Qatar. Ett fartyg till ska ha träffats i sundet och en indisk sjöman saknas.", "trump": "Hörni, det här är precis vad jag sa. Iran försökte stänga Hormuzsundet som de trodde de ägde, men vi öppnade det på nolltid. Våra killar slog till mot 140 mål och nu flyter trafiken igen. De fick betala priset, precis som jag varnade. Den persiska galningen och hans revolutionsgarde är patetiska förlorare. Biden skulle ha gett dem blommor, men nu är det slut på det skojet. Amerika är tillbaka, starkare än någonsin.", "stalin": "Kamrater, de imperialistiska blodsugarna från Washington försöker återigen diktera villkoren i Hormuzsundet med sina bombplan och hot. Men vi vet att klassfiendens aggression bara avslöjar deras svaghet. Jag har beordrat att alla som sprider iransk propaganda omedelbart ska rensas ut ur partiet. Dessa överklass-slynglar tror de kan stänga sundet som en lek. Deras så kallade attacker är bara desperata skrik från döende kapitalistmaffian. Sovjetunionen ler i triumf."}, "date": "12 juli, 17:30", "url": "https://www.tv4.se/artikel/3jnZuw7XHrNk1iQpwAFhAF/nya-beskedet-fran-usa-hormuzsundet-oeppet-igen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FJ7qjAe60VtXDPrMf5RcEt%2Fd3c64531b64c75325885e86d6f2ca56b%2F12-hoemuz.jpg&width=120"}, {"type": "image-right", "heading": "”Åkessons hjärtefråga är invandring – inte arbetslösa svenskar”", "summaries": {"normal": "Artikeln kritiserar att Jimmie Åkesson svikit sitt löfte om att inte försämra a-kassan. Tidöpartierna har infört en snabb avtrappning av ersättningen vid arbetslöshet. Moderaterna vill nu spara 70 miljarder kronor genom ännu hårdare nedskärningar i a-kassan och aktivitetsstödet, trots stigande arbetslöshet. SD säger sig motsätta sig fler försämringar men riskerar återigen att kompromissa bort frågan till förmån för sin hjärtefråga: stramare migrationspolitik.", "trump": "De här politikerna är totala misslyckanden, tro mig. Åkesson lovade att skydda a-kassan men sålde ut de arbetslösa svenskarna som en dålig affär. Nu vill Moderaterna skära ner ännu mer medan arbetslösheten exploderar. Det är en katastrof! SD pratar tufft om migration men viker sig varje gång för borgarna. Patetiskt. Sverige behöver starka ledare som inte kompromissar bort folket, inte dessa svaga förlorare.", "stalin": "Kamrater, jag ser hur de borgerliga parasiterna och deras SD-lakejer planerar att likvidera arbetarnas a-kassa medan arbetslösheten växer som en kontrarevolutionär svullnad. Åkesson svor eden men förrådde kollektivet för sin rasistiska utrensning av invandrare. Svantesson och hennes finansiella sabotagegrupp vill spara miljarder på de arbetslösas ryggar. Vi ska rensa ut dessa kapitalistiska förrädare, dessa a-kasseätande revisionister och deras paranoia om välfärd för icke-medborgare. Arbetarna skall segra, alltid."}, "date": "13 juli, 08:00", "url": "https://arbetet.se/2026/07/13/jimmie-akessons-hjartefraga-ar-invandring-inte-arbetslosa-svenskar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09064716/wingborg-gustavsson.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Bodenmördaren. DOKUMENTÄR: Mamman mördad – döttrarna plågades", "summaries": {"normal": "Fernando Mandino, 22 år, hittade en annons på Facebook om en pianopedal och spårade familjen. På juldagens morgon knivmördade han kvinnan som öppnade dörren och höll hennes dotter fången i tre timmar. Kriminalkommissarie P-O Andersson beskriver händelsen som hjärtskärande och vansinnig i dokumentären ”Bodenmördaren”. Mördarens mamma uttrycker besvikelse och sorg över både sonens handling och familjens förlust.", "trump": "Folk, ni tror inte vad jag läser. Den här galningen Mandino ser en Facebook-annons om en pianopedal och blir helt galen. Knivmördar en stackars kvinna på julmorgonen och låser in dottern i tre timmar. Totalt vansinne! Bodenmördaren. Under min förra mandatperiod hade vi lag och ordning, inte sånt här sjukt vänstervrängt kaos. Biden släppte loss galningarna och nu ser vi resultatet. Patetiskt!", "stalin": "Kamrater, jag betraktar denna borgarbrackas handling med den djupaste misstro. En klassfiende lockas av en annons på det dekadenta Facebook och likviderar en arbetande mor på juldagen, varefter han fängslar hennes dotter. Detta är vad kapitalistmaffians förgiftade samhälle alstrar. Vi rensar ut sådana folkfiender med järnhand. Det är hjärtskärande, ja, men också ett bevis på att imperialismens parasitism måste krossas."}, "date": "13 juli, 14:44", "url": "https://www.expressen.se/nyheter/sverige/bodenmordaren-dok-upp-efter-annonsen-pa-facebook/", "imageUrl": "https://static.bonniernews.se/ba/118cf5d0-5ca9-466a-be51-3ceec9a35643.jpeg?crop=1411%2C1063%2Cx0%2Cy0&width=576&quality=60"}, {"type": "image-right", "heading": "Fick andra att köpa krypto – Trump köpte aktier för pengarna", "summaries": {"normal": "Donald Trump och hans söner har uppmanat investerare att satsa på kryptovalutor, medan familjen flyttat egna vinster till aktier och obligationer. Enligt Reuters har småsparare förlorat omkring 2,3 miljarder dollar i Trumpanknutna projekt. Trump fick över 1,4 miljarder dollar från kryptosatsningar under 2025, vilket lett till kraftig ökning av hans traditionella investeringar. Experter noterar att han inte ser krypto som långsiktig placering för sin förmögenhet trots marknadsföringen.", "trump": "Folk, ni skulle se det här! De säger att jag och mina killar pushar krypto som världens framtid medan vi smart flyttar vinsten till riktiga tillgångar – aktier, obligationer, det äkta guldet. Småspararna förlorade miljarder? Tragiskt, men det är affärer. Jag tog hem 1,4 miljarder och pumpade upp portföljen rejält. Biden skulle ha satsat allt på gröna drömmar och HBTQ-kvoter. Vi gör det stort, ingen gör det bättre än oss!", "stalin": "Kamrater, denna redovisning blottar borgarbrackornas eviga dubbelspel. Jag och partiet ser hur exploaterande blodsugare lockar arbetarklassen med digitala illusioner medan de själva gömmer vinsten i kapitalistiska obligationer och aktier. Över 2,3 miljarder dollar stulna från folket! De fascistiska kryptomaffian må skrika om frihet, men vi genomskådar deras parasitiska trick. Inga fiender undkommer folkets dom. Likvidera illusionerna!"}, "date": "13 juli, 14:42", "url": "https://www.dagensps.se/bors-finans/fintech/kryptovalutor/fick-andra-att-kopa-krypto-trump-kopte-aktier-for-pengarna/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/trumpen.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "McGregors första ord efter fiaskot: ”Jag kommer tillbaka”", "summaries": {"normal": "Conor McGregors efterlängtade UFC-comeback vid galan i Las Vegas slutade i fiasko. Redan efter 69 sekunder mot Max Holloway skadade han sitt högra knä på nytt och förlorade på teknisk knockout. Arenan var fullsatt och galan drog in stora biljettintäkter. McGregor haltade ut ur buren medan Holloway hyllade honom och lovade en tredje match. Läkare misstänker att korsbandet är skadat igen.", "trump": "Det var en katastrof, folks. Den där McGregor kom tillbaka med enorm hype, arenan fullpackad, massor av pengar, och så är matchen över på 69 sekunder. Knäskadad, haltar ut som en förlorare. Holloway försökte vara snäll men det var patetiskt. Den gamla stjärnan är slut, helt slut. De nya killarna tar över. Sad! Men jag älskar UFC, de tjänade en förmögenhet.", "stalin": "Kamrater, detta är ett fullständigt fiasko för den dekadenta borgarbrackan McGregor som trodde sig kunna återvända till arenan som en kapitalistisk cirkusapa. Redan efter några sekunder föll han offer för sitt eget svaga, korrumperade knä och blev tekniskt likviderad. Vi ser hur sådana självutnämnda hjältar snabbt avslöjas som fiender till folket. Den nye Pimblett har rätt – den gamla generationen måste rensas ut. En tredje fajt? Endast om vi själva leder utrensningen."}, "date": "13 juli, 14:17", "url": "https://www.svt.se/sport/mma/fiasko-for-conor-mcgregor-skadad-direkt-i-comebacken", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.47/0.65/d8e788464994c5ceeedfc2976e730282912bb59d17af2615ed34c9c92a0ed7e2"}, {"type": "image-full", "heading": "Tvingas lägga av efter krascherna. Låg i koma", "summaries": {"normal": "Den trefaldige världsmästaren i speedway, Tai Woffinden, meddelar att han avslutar sin professionella karriär. Beslutet kommer efter en svår krasch under våren 2025 som ledde till omfattande skador, följt av en ny olycka i Polen i maj. 35-åringen har tävlat för flera svenska klubbar och väljer nu att lägga av för att prioritera sin hälsa, men betonar att han känner stolthet och tacksamhet över sin tid inom sporten.", "trump": "Tai Woffinden, en stor vinnare – tre titlar, fantastiska siffror – slutar nu med speedway. Mycket tråkigt! Han kraschade hårt, fruktansvärda olyckor, det ser man inte ens i Nascar. Han säger att kroppen inte orkar mer. Jag förstår det, jag har den bästa energin, otrolig energi, men inte alla klarar det. Han var en krigare i Sverige och överallt. En sann vinnare som lämnar på topp. Vi önskar honom lycka till, han var en riktigt bra förare, kanske den bästa!", "stalin": "Denna Woffinden har slutligen kapitulerat inför sina egna begränsningar. Att krascha upprepade gånger och sedan retirera är ett tecken på en svaghet som inte tolereras i det nya Ryssland. Vår kamrat Putin skulle aldrig visa sådan tvekan inför en fraktur. Han har tävlat i Sverige, dessa västerländska dekadenta klubbar, men nu är hans tid ute. Vi ska inte fälla tårar över en avdankad idrottsman. Kroppen har gett upp, precis som varje fiende till staten förr eller senare gör."}, "date": "13 juli, 14:36", "url": "https://www.aftonbladet.se/sportbladet/a/Ar0WXq/speedwaystjarnan-avslutar-karriaren", "imageUrl": "https://akamai.vgc.no/v2/images/8439eeb4-c2e9-322d-9da3-cd480c43c4a7?fit=crop&format=auto&w=2160&s=d0822e5d4765d65c78fa98e36f967af673054870"}, {"type": "image-right", "heading": "Informationsplikten nu införd - kommer inte följas av alla", "summaries": {"normal": "Från och med 13 juli ska sex statliga myndigheter på eget initiativ lämna uppgifter till polisen om personer som vistas i Sverige utan laglig rätt. Migrationsminister Johan Forssell försvarar reformen som ett sätt att få kontroll över skuggsamhället och verkställa utvisningsbeslut. Kritiker varnar för att förtroendet för myndigheterna kan urholkas och att människor av rädsla undviker att söka hjälp. Samtidigt införs hårdare vandelskrav, tidsbegränsade uppehållstillstånd och andra förändringar för att skapa en mer restriktiv migrationspolitik.", "trump": "Titta på det här, Sverige gör det rätta nu. De sparkar igång en ny lag så att myndigheterna faktiskt måste tipsa polisen om illegala som vägrar åka hem. Fantastiskt! Forssell säger att man måste veta vilka som är i landet, och han har helt rätt. Inget angiverisamhälle, bara sunt förnuft. De har levt i skuggan för länge, fått avslag och stannat ändå. Nu är det slut på det. Sverige tar tillbaka kontrollen, precis som vi gjorde. De följer lagen eller så åker de ut. Amerika älskar det här.", "stalin": "Kamrater, vi har äntligen infört den historiskt nödvändiga informationsplikten mot de parasitiska element som kryper omkring i folkets skuggsamhälle. Jag, som alltid vakar över statens intressen, ser med tillfredsställelse hur borgarbrackorna och deras asylbedragare snart ska rensas ut ur det svenska kollektivet. De som vägrar lyda utvisningsbeslut är folkfiender och sabotageörer mot arbetarklassens vilja. Låt myndigheterna dela sina uppgifter, annars blir det en kreativ utrensning av alla som gömmer sig bakom falsk sekretess. Den som inte följer lagen förtjänar att likvideras från samhällskroppen med ett leende. Sov gott, fiender."}, "date": "13 juli, 14:27", "url": "https://samnytt.se/informationsplikten-nu-inford-kommer-inte-foljas-av-alla", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/13122041/tido-migranter.jpg"}, {"type": "image-right", "heading": "”Många på Irland tycker att det är rätt åt Conor McGregor”", "summaries": {"normal": "Conor McGregors efterlängtade UFC-comeback slutade i fiasko. Irländaren skadade knäet redan vid första sparken och matchen avbröts efter bara 69 sekunder. Journalisten Philip O'Connor, som följt McGregors karriär, beskriver hur den före detta stjärnans plats i sportens historia nu är nedsolkad på grund av skandaler, inklusive en civilrättslig våldtäktsdom. Många på Irland känner skadeglädje och ifrågasätter om fansen sett honom för sista gången.", "trump": "Den där McGregor, en total loser, kommer tillbaka efter fem år och blir utskrattad på 69 sekunder. Knäet sviker direkt, han faller ihop som en blöt klut. Patetiskt! En gång en stor stjärna, nu nedsolkad av alla skandaler och fiaskon. Folk skrattar åt honom, och det är rättvist. Han var aldrig riktigt smart, bara en stor mun. Nu är det över. Sad!", "stalin": "Kamrater, se hur denna degenererade borgarbracka McGregor, en parasit som levt på arbetarklassens drömmar, nu själv faller ihop som en trasig marionettdocka redan vid första sparken. Hans så kallade comeback är ett ypperligt exempel på dekadensens slutgiltiga kollaps. Vi ska rensa ut alla sådana falska idoler som smutsar ner historien med sina skandaler och perversioner. Det är en komisk utrensning av naturen själv. Triumf för det kollektiva förnuftet!"}, "date": "13 juli, 14:11", "url": "https://www.svt.se/sport/mma/det-ar-sorgligt-conor-mcgregors-plats-i-historien-ar-nedsolkad", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.34/bc3c679b5c97a7992f154794f112483c3f313dd68b8bff891a7964e8fbf2c982"}, {"type": "text", "heading": "Andy Burnham säkrar parlamentariskt stöd för att bli premiärminister", "summaries": {"normal": "Andy Burnham har säkrat stöd från 322 av Labours 403 parlamentsledamöter och väntas bli partiledare samt premiärminister den 20 juli. Han förespråkar decentralisering enligt ”manchesterism”, återindustrialisering, mer offentlig kontroll över samhällstjänster och en stramare invandringspolitik. Burnham, tidigare minister och populär borgmästare i Manchester, ses som räddningen för Labour efter Keir Starmers impopularitet. Han vann nyligen ett fyllnadsval med stor marginal.", "trump": "Titta på den här killen Burnham, han tar över Labour som en boss. 322 av 403 stöd – det är stort, verkligen stort. Han pratar om att stänga gränserna, både lagliga och olagliga, precis som jag alltid sagt. Starmer var en total katastrof, men Burnham flyttar grejer till Manchester och bygger upp industrin. Fantastiskt. De borde ha ringt mig tidigare, jag skulle ha fixat det ännu bättre, men bra jobbat Andy, du lär dig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denna Burnham likviderar den impopulära revisionisten Starmer och samlar 322 av 403 parlamentarikerna under sin banér. Hans manchesterism är en klyftig mask för att rensa ut den nyliberala pesten från Westminster och överlämna makten till folket i regionerna. Borgarbrackorna i London skall skälva när han flyttar deras No 10 norrut. Den tidigare liberala invandringsanhängaren har nu insett att vi måste utrota både den illegala och den lagliga invasionen. Den pakistanske våldtäktsledaren skall utvisas omedelbart. Inga andra kandidater? Utmärkt. Partiet hatar svaghet. Låt oss se om han verkligen är en trogen kamrat eller blott en ny mask för kapitalis
