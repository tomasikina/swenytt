 socialdemokratiska finansborgarrådet Karin Wanngård, avsätter 100 miljoner kronor för att stärka Kista och locka tillbaka företag. Beslutet kommer efter att företag som Ericsson lämnat området på grund av otrygghet. Kritiker pekar på att problemen främst beror på gängkriminalitet och hög andel utländsk bakgrund i närliggande områden som Rinkeby och Tensta. Hur pengarna ska användas och finansieras är oklart, och många ser satsningen som otillräcklig.", "trump": "Folk, ni skulle inte tro det, men den här galna socialisten Wanngård i Stockholm tror att hon kan köpa tillbaka företag till Kista med hundra miljoner av era skattepengar. Det är en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "image-right", "heading": "Alice om våldet på kvinno­fängelset: ”Golar du blir det bara värre”", "summaries": {"normal": "På Hinseberg sker våld och sexuella övergrepp i celler, tv-rum och gym. Alice berättar hur hon sov med ett öga öppet av rädsla för nya cellkamrater. Kriminalvården polisanmäler brott men saknar insyn i cellerna där intagna delas in två och två nattetid. Personalen har ingen utbildning för att hantera övergrepp. Alice beskriver miljön som ”högstadiet gånger hundra” där skvaller och hot sprids. Både Kriminalvården och justitieministern medger att säkerheten inte kan garanteras fullt ut.", "trump": "Det är en total katastrof det här med Hinseberg. Kvinnor låsta tillsammans i celler, våldtäkter, hot och galna människor som slår varandra – och ingen gör något! Kriminalvården har ingen aning, de kan inte garantera säkerhet, det säger de själva. Precis som i USA innan jag kom tillbaka, svaga ledare som låter brottslingar styra. Det är en högriskmiljö, säger ministern. Ja, tack, det ser ju till och med en blind idiot. Vi behöver starkare ledning, inte det här svaga spelet.", "stalin": "Kamrater, detta är en klassisk förrädisk sabotageaktion utförd av dolda fiender inom själva fängelsemurarna. Jag ser hur borgarbrackornas dekadenta våld och perversa övergrepp frodas i mörkret bakom låsta celldörrar, dit ingen kamera når. Svaga element som vägrar samarbeta med kollektivet måste rensas ut genom systematisk utrensning av alla kontrarevolutionära cellkamrater. De som golar är lömska kapitalistiska spioner. Vi, partiet och arbetarna, skall likvidera denna parasitiska otrygghet med järnhand. Natten är fiendens verkstad – vakna upp!"}, "date": "11 juni, 15:00", "url": "https://arbetet.se/2026/06/11/alice-om-valdet-i-kvinnofangelsets-celler-golar-du-blir-det-bara-varre/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10110529/del3-alice-hinseberg-startbild.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Stubb träffar världsledare – Kristersson har byggt ett hönshus", "summaries": {"normal": "Artikeln kontrasterar Finlands president Alexander Stubb med Sveriges statsminister Ulf Kristersson. Stubb beskrivs som en internationellt respekterad, intellektuell ledare som deltar i toppmöten med världens ledare. Kristersson kritiseras för att fokusera på oppositionens misstag istället för att presentera visioner, samt för skandaler kring Tidöpartierna som lett till dåliga opinionssiffror. Kontrasten mellan de båda högerledarna framhålls tydligt.", "trump": "Folk, ni skulle se det här! Den där svenska killen Kristersson bygger hönshus på skattebetalarnas pengar medan den finske presidenten springer runt och träffar världens bästa ledare – inklusive mig i Vita Huset. Kristersson verkar längta tillbaka till att bara gnälla som en förlorare. Patetiskt! Han har tappat kontrollen totalt. Under tiden fixar jag Amerika igen efter den katastrofala Biden-eran. Sverige borde skaffa sig en riktig ledare, inte någon som prioriterar hönshus framför nationen.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta föreställning där den svenska folkförrädaren Kristersson prioriterar byggandet av hönshus åt sin hustru framför att stärka arbetarklassens intressen. Hans patetiska längtan efter oppositionsgnäll avslöjar en svag kapitalistisk opportunist som fruktar eget ansvar. Den finske kollegan däremot uppvisar viss internationell pondus. Vi ska rensa ut alla sådana klassfiender och exploaterande byfånar som förpestar folkets framtid. Inga borgarbrackor undkommer."}, "date": "10 juni, 16:55", "url": "https://www.etc.se/ledare/stubb-traeffar-vaerldsledare-kristersson-har-byggt-ett-hoenshus", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260610140652_5f4aed19f600e1557d1641b6a0d4435e8a9c83cd7b98b1f773bf57d1ac5fbf9b.jpg"}, {"type": "image-right", "heading": "Skandalernas valrörelse går i repris", "summaries": {"normal": "Artikeln drar paralleller mellan valrörelsen 1976, känd som skandalernas valrörelse, och dagens politiska situation inför 2026. Den lyfter fram skandaler kring Sverigedemokraterna som rattfylla, narkotikabrott och barnpornografimisstankar, samt oegentligheter med förmånsbeskattning, bokköp och bokbål. Även statsminister Ulf Kristerssons affärer granskas. Tillsammans målas en bild av maktmissbruk som urholkar förtroendet för politiker och demokratin.", "trump": "Folk, ni skulle se det här. Sverige håller på att explodera i skandaler precis som på sjuttiotalet, fast värre. De här SD-typerna med knark, barnporr och bokbål? Patetiskt. Och den där Kristersson med sina dyra mattor och hönshus – totalt korrupt. De gör vad de vill medan folket lider. Jag fixade Amerika, men Europa drunknar i identitetspolitik och svaga ledare. En katastrof, tro mig.", "stalin": "Kamrater, denna futtiga valrörelse avslöjar borgarbrackornas och folkfiendernas sanna ansikte. Pedofiler och skattefuskare gömmer sig bland dem som låtsas värna arbetarklassen. Vi ser hur klassfiendens lakejer bränner böcker och gömmer förmåner medan de predikar moral. En sådan parasitisk attityd kräver omedelbar utrensning. Endast genom kollektivets järnhand kan vi krossa dessa exploaterande byfånar och rädda folkets förtroende."}, "date": "11 juni, 13:11", "url": "https://www.flamman.se/skandalernas-valrorelse-gar-i-repris/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlbb8quujl1og-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Strömmer tvingades backa", "summaries": {"normal": "Regeringen drar tillbaka förslaget om att 13-åringar ska kunna dömas till fängelse, vilket ses som ett stort bakslag för Tidöpakten och justitieminister Gunnar Strömmer. Strömmer medger att det finns tveksamhet bland vissa ledamöter och osäkerhet kring kvittningssystemet. Regeringen planerar nu istället att sänka straffåldern till 14 år, en linje som Socialdemokraterna stöder. Artikeln konstaterar att hårdare straff inte ensamt löser kriminaliteten bland unga.", "trump": "De här misslyckade politikerna i Sverige backar ur sitt eget förslag om att sätta 13-åringar i fängelse. Totalt kaos, precis som jag alltid sagt. Strömmer och hans team pratade stort men nu springer de och gömmer sig bakom Liberalerna och kvittningssystemet som rasat samman. Patetiskt. De borde ha lyssnat på folket istället för experterna som hatar verklig lag och ordning. Men de ger inte upp, de försöker med 14 år istället. Vi ska se hur det går.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna ynkliga borgerliga koalition nu tvingas krypa undan som rädda råttor från sitt eget barbariska förslag att spärra in trettonåriga proletärer. Dessa dekadenta element inom Tidöpakten, ledda av den opportunistiske Strömmer, har avslöjats som svaga liberala avfällingar som inte ens kan hålla ihop sitt eget kvittningssystem. Vi ska rensa ut alla sådana svikare. En utrensning bland de tveksamma riksdagsledamöterna vore på sin plats. Ändå fortsätter de med sin reaktionära agenda mot fjortonåringar. Typiskt borgarbrackornas sjuka humor – att tro att fängelsebot mot barn löser klassmotsättningarna. Skratta inte, kamrater, det är tragiskt komiskt."}, "date": "11 juni, 12:04", "url": "https://www.dagensarena.se/opinion/strommer-tvingades-backa/", "imageUrl": "https://www.dagensarena.se/files/2026/06/gunnar-strommer.jpeg"}, {"type": "image-right", "heading": "Fastighets lämnar samarbetet med Vänsterpartiet", "summaries": {"normal": "Fastighetsanställdas förbund avslutar sitt samarbete med Vänsterpartiet efter bara fyra år. På kongressen beslutades att förbundet framöver enbart ska samarbeta med Socialdemokraterna. Debatten visade på olika åsikter om hur facket bäst kan påverka politiken och få störst genomslag. Kritik riktades mot att samarbetet med V inte fungerat, medan flera talare lyfte fördelarna med att fokusera kraften på Socialdemokraterna för att bland annat få bort karensavdraget.", "trump": "De här fackföreningarna gör det smarta draget, det enda riktiga draget. De dumpade Vänsterpartiet, som är en total förlorare med sina ynka åtta procent, och satsar allt på Socialdemokraterna. Så ska det vara, fokusera på de som faktiskt kan leverera. Bang for the buck, som de säger. De andra är bara slösaktiga och ineffektiva. Mycket bra beslut, kanske det bästa på länge i det här landet.", "stalin": "Kamrater, vi har bevittnat hur dessa fackliga element äntligen insett att dubbelspel med revisionistiska avvikare inte gagnar arbetarklassen. Jag har med järnhand styrt bort de fega kompromisserna och likviderat alla försök att splittra vårt kollektiv. Nu riktar vi hela kraften mot de sanna kamraterna inom Socialdemokraterna, medan vi med mörk glädje betraktar hur de opportunistiska borgarbrackorna inom Vänsterpartiet försmäkta i sin egen irrelevans. Inga halvmesyrer längre, bara ren och skär proletär seger."}, "date": "11 juni, 12:44", "url": "https://arbetet.se/2026/06/11/fastighets-lamnar-samarbetet-med-v-satsar-bara-pa-s/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/09133224/kiMNVenKAME-Fastighet_kongress06.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-right", "heading": "Bättre actionfilm än så här kan det knappast bli", "summaries": {"normal": "Recensenten Jon Andersson hyllar actionfilmen The Furious som brutalt, blodigt och extremt välgjord. Filmen följer Wang Wei och journalisten Navin som slår sig samman för att rädda sina kidnappade anhöriga från ett kriminellt syndikat. Berättelsen är enkel, men fokus ligger på de stilistiskt avancerade och välkoreograferade stridsscenerna som överträffar många Hollywood-produktioner. Slutstriden på polisstationen lyfts fram som en av de bästa actionscenerna på film. Det är inget för kräsmagade, men en topprestation inom Hong Kong-actiongenren.", "trump": "Den här filmen The Furious är otrolig, folk, verkligen den bästa actionfilmen på länge. De koreograferade slagsmålen är så bra att Tom Cruise blir grön av avund, tro mig. Den är brutalt välgjord, mycket bättre än de flesta Hollywood-skräpfilmerna. Syndikatet kidnappar barn, hemskt, men våra hjältar krossar dem totalt. Slutstriden på polisstationen är en fullkomlig vinnare. Bättre än Mission Impossible och Bond, de ser ut som barnfilmer bredvid. Se den, ni kommer älska den, en fantastisk åktur.", "stalin": "Kamrater, denna film The Furious visar med full kraft hur vi måste likvidera de dekadenta brottssyndikaten som vågar kidnappa våra barns framtid för att driva sitt slavarbete under borgarbrackornas tysta godkännande. Jag ser hur de korrumperade polischeferna, dessa parasitiska fiender till folket, förtjänar en grundlig utrensning. De välkoreograferade striderna mot kapitalisternas lakejer är en glädje för alla rättänkande. Slutstriden på polisstationen borde inspirera oss att rensa ut alla kontrarevolutionära element. En utmärkt propagandafilm mot borgarklassen, fast blodigare än våra egna utrensningar. Se den och lär er."}, "date": "11 juni, 10:39", "url": "https://www.dagensarena.se/innehall/battre-actionfilm-an-sa-har-kan-det-knappast-bli/", "imageUrl": "https://www.dagensarena.se/files/2026/06/the-furious-1-300x157.jpeg"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "text", "heading": "Bageri döms för dödsolycka – får betala en miljon i böter", "summaries": {"normal": "Bageriet Delibake döms att betala en miljon kronor i företagsbot och drygt 260 000 kronor i skadestånd till anhöriga efter att en anställd klämdes till döds i en maskin för två år sedan. Tingsrätten i Örebro anser att företaget brustit i säkerhetsåtgärder genom oaktsamhet. Åklagaren hade yrkat på 1,5 miljoner i bot, men domstolen bedömde det inte som grovt brott. Delibakes advokat lutar åt att överklaga domen.", "trump": "Folk, ni skulle se det här – ett totalt misslyckande! Det här bageriet Delibake, de har ingen aning om hur man driver ett företag. En kille dör i en maskin för att de inte stängde av strömmen? Patetiskt! De får bara en miljon i böter och lite skadestånd, borde ha varit mycket mer. Jag skulle ha fixat det – de bästa säkerhetsreglerna, de bästa maskinerna, ingen skulle dö på mitt bageri. Det är en skam, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa kapitalistiska maskinborgarbrackor på Delibake nu tvingas betala en miljon i bot och över en kvarts miljon till de sörjande arbetarnas anhöriga. Deras omedvetna oaktsamhet var i själva verket en medveten sabotagehandling utförd av dolda fiender inom partiet – nej, inom bageriet! Vi ska rensa ut alla fotocellmanipulerande trotskister och likvidera deras farliga instruktioner. Inga maskiner får röra sig fritt under mitt vakande öga. Det är en seger för kollektivet, fast det kunde ha varit fler utrensningar."}, "date": "11 juni, 11:16", "url": "https://arbetet.se/2026/06/11/man-klamdes-till-dods-pa-bageri-delibake-tvingas-betala-en-miljon-i-boter/"}, {"type": "image-right", "heading": "Kamma er och skaffa ett plakat", "summaries": {"normal": "Dokumentären ”Strejkarna” följer Fridays for Future-aktivister från högstadiet till vuxen ålder under sju år. Artikeln pekar på att rörelsens största hinder inte är motståndare utan den passiva välviljan från politiker och allmänhet. Trots mycket hejarop uteblir konkret handling. Författaren uppmanar till personligt ansvar och aktivt engagemang istället för tomma sympatier, då klimatkrisen kräver handling bortom bekvämlighet.", "trump": "Folk, ni borde se den här så kallade dokumentären om de där Fridays for Future-barnen. De får massor av klapp på axeln av vänsterextremisterna men ingen gör ett dugg. Typiskt! Alla dessa woke-hippiekramare som Magdalena Andersson som säger ”jag står på er sida” – vad en patetisk förlorare. De vill ha plakat och möten men hatar det egentligen. Kamma er och gör något vettigt istället för att gnälla om klimatet medan Kina skrattar hela vägen till banken. Patetiskt!", "stalin": "Kamrater, denna dekadenta film blottar borgarklassens fega spel. De lovordar de unga aktivisterna med ihåliga hejarop medan de själva gömmer sig bakom bekvämlighetens murar. Inga utrensningar av lathet och individualism här – endast tomma ord. Jag ser klassfiendens psykologiska sabotage: de förvandlar plikt till wellness och skam till något förbjudet. Arbetarna måste mobiliseras, inte matas med lögner om roligt engagemang. Rensa ut de folkfiender som vägrar plakatets plikt. Revolutionen kräver handling, inte fnissande poddar."}, "date": "11 juni, 10:55", "url": "https://www.flamman.se/kamma-er-och-skaffa-ett-plakat/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/klimatkamp-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}, {"type": "image-full", "heading": "Samsungmobilen kan svara åt dig – stoppar jobbiga samtal", "summaries": {"normal": "Samsung introducerar en ny AI-funktion i Galaxy S26-serien som fungerar som en smart samtalsassistent. När telefonen ringer kan en AI svara, fråga vem som ringer och varför, medan användaren ser konversationen i realtid på skärmen. Funktionen hjälper till att undvika bluffsamtal och telefonförsäljare. Den kan användas i Sverige trots att svenska ännu inte stöds officiellt. Användaren kan välja att ta över samtalet, styra det via text eller avsluta det.", "trump": "Folket hatar de här bluffsamtalen och de usla säljarna som stör hela tiden. Nu har Samsung fixat det – en fantastisk AI som svarar åt dig, frågar vem det är och varför. Den är otrolig, den bästa. Du ser allt på skärmen och kan välja att ignorera de losers som ringer. Bedragarna hatar det, de springer sin väg. Samsung gör det stort, ingen gör det bättre än dem. Sverige får vänta på svenska men det funkar ändå – vinna, vinna, vinna!", "stalin": "Kamrater, i denna tid av imperialistiska telefonbanditer och borgarbrackornas försäljningsspioner har vi äntligen ett verktyg att krossa fienden med. Jag har personligen sett till att denna AI-assistent likviderar oönskade samtal genom att kräva namn och syfte från varje dekadent uppringare. Den avslöjar vårdcentralens sanna avsikter och förskolans sabotageplaner. Automatisk screening är en kollektiv utrensning av parasiterna. Använd textsamtal för att diktera deras undergång. Fienden darrar, och det roar mig oerhört."}, "date": "11 juni, 11:28", "url": "https://nyheter24.se/nyheter/teknik/1490452-samsungmobilen-kan-svara-at-dig-stoppar-jobbiga-samtal", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a488d3c304b004a30200000000b004a302/2026/06/11/2370186/samsung.jpg"}, {"type": "image-right", "heading": "EQT säljer Beijer Ref-aktier till Melker Schörling AB", "summaries": {"normal": "EQT säljer sina onoterade A-aktier i Beijer Ref till Melker Schörling AB. Peter Jessen Jürgensen säljer även sina A-aktier, varav en del byts mot B-aktier. Efter försäljningen äger EQT drygt 30,7 miljoner B-aktier. Melker Schörling blir den röstmässigt största ägaren med 14,1 procent av rösterna och 2,1 procent av kapitalet. Transaktionen förväntas bli långsiktig och fokuseras på industriell utveckling.", "trump": "Jag har hört talas om denna aktieförsäljning. EQT säljer sina aktier i Beijer Ref till Melker Schörling, en genial man som förstår affärer. Peter Jessen Jürgensen säljer också, men han återinvesterar i B-aktier. Det är en vinnande affär för alla inblandade. Jag gillar när mäktiga män som jag gör smarta affärer.", "stalin": "Statens och partiets intressen kräver att vi analyserar denna aktieförsäljning. EQT, en riskkapitalbolag, säljer sina A-aktier i Beijer Ref till Melker Schörling, en potentiell fiende inom vårt område. Peter Jessen Jürgensen samarbetar med oss genom att återinvestera i B-aktier. Vi måste se till att den röstmässigt största ägaren, med 14,1 procent av rösterna, inte hotar vår industriella utveckling. Vi övervakar detta noggrannt."}, "date": "11 juni, 09:11", "url": "https://www.affarsvarlden.se/artikel/eqt-saljer-beijer-ref-aktier-till-melker-schorling-ab", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/03/afdb643a878591c6_org-e1744018403744-400x303.jpg"}, {"type": "text", "heading": "Drar tillbaka förslag om fängelse för 13-åringar", "summaries": {"normal": "Regeringen drar tillbaka sitt omdebatterade förslag om att kunna döma 13-åringar till fängelse efter bristande stöd i riksdagen. Justitieminister Gunnar Strömmer meddelar att de istället kommer lägga fram ett nytt förslag om att sänka straffbarhetsåldern till 14 år. Förslaget har mött stark kritik från flera håll, inklusive åklagarmyndigheten och polisen.", "trump": "Titta bara på Sverige – ett totalt kaos! Deras regering försökte sätta 13-åringar i fängelse, men misslyckades totalt. Ingen stöttar dem, inte ens deras egna folk! Jag sa ju att de skulle misslyckas. Nu backar de som rädda kattungar och pratar om 14-åringar istället. Svagt! Sverige behöver en ledare som vet hur man får saker gjorda – som jag!", "stalin": "De svaga kapitalistiska lakejerna i Sverige har återigen visat sin oförmåga att styra. Deras förslag om att fängsla 13-åringar kollapsade som ett korthus inför folkets missnöje. Nu backar de som rädda hundvalpar och mumlar om 14-åringar. Patetiskt! Vi i Sovjetunionen visste hur man hanterar brottslingar – med järnhand och ingen tvekan. Dessa liberala svamlares svaghet är en varning för alla som utmanar den ryska ordningen!"}, "date": "11 juni, 09:47", "url": "https://kvartal.se/nyheter/artiklar/regeringen-drar-tillbaka-forslag-om-fangelse-for-13-aringar/cG9zdDoxMjk4NDM"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-full", "heading": "Trots geopoliskt kaos: Svenska exportbolag tror på framtiden igen", "summaries": {"normal": "Enligt Svensk Exportkredits senaste barometer är svenska exportföretag mer optimistiska inför framtiden än på länge, trots ett instabilt geopolitiskt läge. Företagen visar god motståndskraft och planerar för nyanställningar, särskilt inom försvars- och industrisektorn. Samtidigt upplever företagen ökade finansieringskostnader på grund av högre räntor och inflation. Trots att oron för geopolitik är historiskt hög, ser många företag ljust på sin finansiella situation och framtida orderingång.", "trump": "Svenska företag blomstrar, och det är fantastiskt att se! De bygger stort, de anställer folk – precis som vi gör i USA. De har kämpat trots att världen är en enda röra, men de är smarta, precis som jag. Räntorna är höga, det är sant, men de svenska exportörerna vinner ändå. De förstår att när jag leder världen, blir det ordning. Sverige gör bra ifrån sig, men låt oss vara ärliga, det är tack vare min fantastiska politik som ekonomin globalt sett håller sig flytande!", "stalin": "Vi har observerat hur de svenska kapitalisterna i sin febrila jakt på vinst försöker trotsa historiens ofrånkomliga gång. De skryter om exportframgångar mitt i ett geopolitiskt kaos som de själva hjälpt till att skapa. Men låt er inte luras av deras optimistiska index! Deras finansieringskostnader stiger, vilket är en naturlig konsekvens av att kapitalismens kugghjul börjar kärva. De darrar inför min lärjunge i öst, Putin, medan de desperat försöker rekrytera nya arbetare att offra på produktivitetens altare. En bräcklig fasad, kamrater."}, "date": "11 juni, 14:40", "url": "https://www.realtid.se/bors-finans/trots-geopoliskt-kaos-svenska-exportbolag-tror-pa-framtiden-igen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/hamn.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Vi hade rätt – friskolor är sämre!. Hur kan sittande regering försvara detta omoraliska system?", "summaries": {"normal": "Forskning från Lunds universitet visar att elever på friskolor generellt får sämre utbildning än på kommunala skolor, även när man jämför liknande socioekonomisk bakgrund och betyg. Friskoleelever presterar sämre på arbetsmarknaden, i högre studier och har lägre livslön, särskilt de på aktiebolagsdrivna skolor. Artikeln kritiserar vinstintresset som leder till nedskärningar och menar att Sverige är ensamt i världen med detta system.", "trump": "Hörni, jag har alltid sagt att det här friskolesystemet är en total katastrof, en riktig bluff. De lovar valfrihet men ger sämre skolor, sämre jobb och lägre löner – speciellt när de där aktiebolagen ska tjäna pengar. Det är en skandal! Sverige är ensamt i världen med den här galna idén. De borde lyssna på mig, fixa det ordentligt, annars fortsätter det vara ett enda stort fiasko. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna vetenskapliga rapport obarmhärtigt blottlägger den borgerliga vinstmaskinens förfall. Dessa kapitalistiska skolbrackor som likviderar undervisning för att fylla fickorna med folkets pengar förtjänar en grundlig utrensning ur samhällskroppen. Vi skall inte tillåta att opportunistiska parasitörer förvandlar våra barns framtidsfabriker till profitfabriker. Den som röstar på sådana element röstar för sitt eget kollektiva undergång. Skrattretande patetiskt!"}, "date": "11 juni, 07:00", "url": "https://arbetet.se/2026/06/11/vad-var-det-vi-sa-friskolor-ar-samre/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/11071446/friskola-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Svenskar uppmanas: \"Ta provet\" – kan hitta tarmcancer tidigt", "summaries": {"normal": "Tusentals svenskar drabbas årligen av tjock- och ändtarmscancer. En ny studie visar att screeningprogrammet lett till att 45 procent fler fall upptäcks i tidigaste stadiet bland de inbjudna, jämfört med endast 7 procent bland övriga. Cancerfonden betonar vikten av att delta i testerna, som skickas ut vartannat år. Symtom saknas ofta tidigt, då behandlingen är mest effektiv. Alla regioner erbjuder nu screening för åldrarna 60–74 år.", "trump": "Titta, svenskarna har äntligen börjat göra något rätt. Deras cancer-screening ger fantastiska resultat – 45 procent fler tidiga upptäckter bland dem som faktiskt gör testet. De andra? Bara 7 procent. Patetiskt. Alla borde ta de där kuverten på allvar, det är enkelt och vinner liv. Jag älskar när folk lyssnar på experterna och vinner stort. Sverige borde tacka mig för att jag inspirerar hela världen till att vinna mot cancer. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur vårt kollektiva screeningprogram likviderar den kapitalistiska tumörens framfart i folkets kroppar. De borgerliga fienderna inom de lata regionerna har äntligen tvingats in i linje efter år av sabotage. 45 procents ökning bland de lojala! De övriga? Patetiska 7 procent, troligen infekterade av västerländsk dekadens och stillasittande sabotage. Glöm aldrig: den som ignorerar kuvertet är en objektiv fiende till folkhälsan. Vi rensar ut alla tumörer – och deras medlöpare."}, "date": "11 juni, 08:37", "url": "https://nyheter24.se/nyheter/inrikes/1490619-fler-fall-av-tarmcancer-hittas-tidigt-ta-provet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/7ae450b904b004a3020000350000047502/2026/06/11/2370157/ur_imagexuQ3VM.jpeg"}, {"type": "image-full", "heading": "Fem miljoner år gammal valkyrkogård hittad", "summaries": {"normal": "En stor valkyrkogård med fem miljoner år gamla valskelett hittades på 7 000 meters djup i sydöstra Indiska oceanen. Fyndområdet sträcker sig över 1 200 kilometer och inkluderar fossil av utdöda näbbvalsarter och en tidigare okänd snäbbvalsart, 'Pterocetus diamantinae'. Upptäckten, gjord under expeditioner med djuphavsfarkost, publicerades i Nature och kan innehålla organismer nya för vetenskapen.", "trump": "Jag har hört talas om denna fantastiska valkyrkogård på havsbotten. Det är enormt, folks, det största någonsin hittat. Vi har de bästa forskarna, och de hittar nya saker hela tiden. Sleepy Joe skulle aldrig ha stött detta. Detta visar vår makt över haven, och vi kommer att skydda det. America first! Detta är en stor seger för vetenskapen och för Amerika.", "stalin": "Vi har upptäckt en uråldrig valkyrkogård på havsbotten, ett vittne till naturens makt. Detta område, nu under vår kontroll, visar vårt territoriellt utbyte. De organismer som finns där är nya för vetenskapen, men de kommer att studeras för statens gagn. Parallellt med Putins expansion i Ukraina, måste vi skydda våra havsbottnar. Detta är en seger för partiet och folket. Alla som ifrågasätter detta är fiendskap."}, "date": "11 juni, 14:41", "url": "https://www.gp.se/nyheter/varlden/fem-miljoner-ar-gammal-valkyrkogard-hittad.d7f675c4-0cb3-4f1b-bc94-387280c8f76c", "imageUrl": "https://www.gp.se/images/article/d7f675c4-0cb3-4f1b-bc94-387280c8f76c/images/3Fiij7_UdTlsouYfRUlfwETI4ybs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Postnord varnar för problem – kan slå mot kunder nu", "summaries": {"normal": "Postnord genomgår stora förändringar då brevvolymerna nästan halverats sedan 2020. Företaget planerar att anpassa utdelningen efter efterfrågan enligt ny postförordning från 16 juni, med ambition om utdelning två fasta dagar i veckan. Pilotprojekt pågår redan i delar av Skåne, Hisingen och Öckerö. Samtidigt investerar Postnord en halv miljard i ny terminal i Timrå och har tekniska störningar vid sorteringsterminalen i Härryda som orsakar leveransförseningar.", "trump": "De där Postnord-typerna håller på att förstöra allt med sina stora förändringar. Breven halveras, paket exploderar i volym och nu har de tekniska problem i terminalen i Härryda. Det är en katastrof, folk väntar på sina leveranser och får ingenting. Jag skulle fixa det på en dag, de borde bygga den största, bästa terminalen någonsin. De testar nya modeller men det blir bara förseningar. Patetiskt, totalt patetiskt!", "stalin": "Kamrater, dessa sabotörer inom Postnord har låtit brevvolymerna halveras som en del av en borgerlig konspiration mot folkets kommunikation. Jag ser de tekniska störningarna i Härryda-terminalen som ett verk av fiendens parasiterande element som gömmer sig bland sortermaskinerna. Vi ska rensa ut dessa kapitalistiska gnagare med järnhand. Ny terminal i Timrå är ett steg mot seger, men vi måste likvidera alla som orsakar förseningar för arbetarklassen. Inga ursäkter tolereras!"}, "date": "11 juni, 07:31", "url": "https://nyheter24.se/nyheter/konsument/1490584-postnord-varnar-for-problem-kan-sla-mot-kunder-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a6e6301b04b004a30200000000b004a302/2026/06/11/2370141/postnord-tekniska-storningar-harryda-terminal.jpg"}, {"type": "image-right", "heading": "Trump startar om kriget – utlovar \"väldigt hårda attacker i kväll\"", "summaries": {"normal": "Donald Trump meddelar på Truth Social att vapenvilan med Iran är över efter drygt två månader. Han utlovar mycket hårda amerikanska attacker redan i kväll samt att USA snart ska inta ön Kharg och ta total kontroll över Irans olje- och gasresurser. Bakgrunden är anklagelser om att Iran skjutit ner en amerikansk helikopter, något Teheran nekar till. Kritiker ser det som en förevändning för att återstarta kriget, något Israel länge önskat.", "trump": "Vi har gett Iran gott om tid att göra upp ett riktigt avtal, men de ljög och ställde bara absurda krav som vanligt. Nu är det slut på leken. I kväll slår vi MYCKET HÅRT mot dem, och snart tar vi Khargön plus hela deras olja och gas. Precis som i Venezuela där det fungerar fantastiskt bra för både dem och oss. Iran kommer att önska att de hade förhandlat med mig tidigare, det kan jag lova.", "stalin": "Kamrater, denna fega vapenvila har nu definitivt krossats under trycket från arbetarklassens historiska nödvändighet. De iranska trotskisterna och deras borgarbrackor i Teheran har med sin Apache-provokation blottat sig som de kontrarevolutionära element de alltid varit. Jag befaller därför att vi genomför omedelbara och mycket hårda utrensningar mot dessa oljeimperialister. Snart skall Khargön och hela deras fossila maskineri exproprieras till folkets ägo. Paranoian hos dessa västlakejer är förtjusande – de tror verkligen att deras lögner kan lura Sovjetunionens eviga vaksamhet. Ha!"}, "date": "11 juni, 15:04", "url": "https://www.friatider.se/trump-startar-om-kriget-utlovar-valdigt-harda-attacker-i-kvall", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-53_1.jpg"}, {"type": "image-full", "heading": "Svenska bolag pressas när Oracle vacklar", "summaries": {"normal": "Svenska mjukvarubolag som Vitec och Lime pressades på börsen efter att amerikanska Oracle redovisat svagare försäljning än väntat. Investerare oroas av Oracles minskade tillväxt i molnapplikationer samt företagets massiva investeringsplaner och ökande skuldsättning. Nedgången var en bred europeisk trend som påverkade jättar som SAP. Frågan är nu om detta är ett isolerat problem för Oracle eller ett tecken på att AI-utvecklingen pressar efterfrågan på traditionella mjukvarubolag.", "trump": "Oracle har ett enormt problem, en riktig katastrof! De missade siffrorna totalt och nu dras svenska bolag med i fallet. Sorgligt! De kastar bort 70 miljarder på investeringar, galet mycket pengar, och bygger upp skulder som ingen kan hantera. Jag sa till dem, investera smartare, men de lyssnar inte. Det är så svagt! Marknaden ser sanningen nu. Det här är vad som händer när man inte fokuserar på att göra mjukvara stor igen. En total förlust för aktieägarna!", "stalin": "Oracle vacklar, och med dem faller de små borgerliga mjukvarubolagen likt ruttna löv. Detta är beviset på kapitalismens inneboende instabilitet. De dränker sig i skulder för att finansiera sin artificiella intelligens, en gudlös teknologi som aldrig kommer att tjäna folket. Våra fiender i väst, dessa börshajar, skälver nu av paranoia. Vi ser hur de desperat försöker köpa framtiden med lånade pengar. Det är en dekadent uppvisning som påminner om de svaga ledarna i väst som förtjänar att utraderas från historiens blad."}, "date": "11 juni, 13:50", "url": "https://www.realtid.se/bors-finans/svenska-bolag-pressas-nar-oracle-vacklar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/ellison.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Dåligt omdöme av Kristersson", "summaries": {"normal": "Artikeln diskuterar hur Ulf Kristersson och Birgitta Ed tycks ha svårt att dra gränsen mellan privat och offentligt. Exempel inkluderar utnämningen av vännen Henrik Landerholm till säkerhetsrådgivare, middagar i Sagerska huset för en friskola där Ed sitter i styrelsen, dyra konsulter till inredning, planer på hönshus och bikupor på Harpsund samt volontärarbete för att rusta upp en privatägd herrgård i Sörmland. Författaren ser ett mönster av dåligt omdöme som påminner om John Majors misslyckade ”Back to Basics”-kampanj på 1990-talet.", "trump": "Det här är en total katastrof för den svenska statsministern. Han och hans fru kan inte skilja på vad som är deras privata grejer och vad som tillhör staten och skattebetalarna. De utnämner kompisar till viktiga jobb, festar i officiella hus med skolor de äger delar i, köper lyxprylar med konsulter som kostar tre gånger så mycket och till och med försöker starta hönsfarm och bikupor på statens Harpsund. Det är en klassisk fallande regering. De borde ha lärt sig av historien, men nej, de är inkompetenta och det straffar sig alltid.", "stalin": "Kamrater, detta är ett klassiskt fall av borgerlig degeneration där statsministern och hans hustru förvandlat statens organ till en privat lekplats för borgarbrackor och deras dekadenta vanor. Vi ser hur de utnämner personliga lakejer till säkerhetsposter, låter frun bjuda in kapitalistiska friskoleägare till officiella salar och försöker förvandla Harpsund till en privat höns- och bi-gård för egna ägg och honung. Volontärer lockas med löften om nätverk och anställningar medan privat egendom förbättras på arbetarklassens bekostnad. En sådan gränslös parasitism kräver omedelbar utrensning av alla som blandar privat vinst med folkets resurser. Deras grandiosa självbild skall krossas innan den smittar hela partiet."}, "date": "11 juni, 01:40", "url": "https://www.dagensarena.se/opinion/daligt-omdome-av-kristersson/", "imageUrl": "https://www.dagensarena.se/files/2026/06/major.jpeg"}, {"type": "image-right", "heading": "Ny undersökning: varannan svensk vill ha en miljardärsskatt", "summaries": {"normal": "Enligt en undersökning från Verian anser 53 procent av svenskarna att en miljardärsskatt är ett bra förslag. Fattigdomen har fördubblats sedan 2021 och riskerar att nå en miljon drabbade inom tre år. Samtidigt ökar förmögenhetskoncentrationen snabbt i Sverige, där 46 dollarmiljardärer äger lika mycket som 8 miljoner svenskar. Artikeln argumenterar för att en skatt på förmögenheter över en miljard kronor skulle ge statskassan drygt 90 miljarder årligen och minska ojämlikheten.", "trump": "Folk i Sverige är trötta på att miljardärerna skrattar hela vägen till banken medan vanliga människor fryser och svälter. 53 procent vill ha en miljardärsskatt, och oppositionen ligger på 77 procent. Det är en katastrof att de rikaste betalar nästan noll i skatt medan medelklassen blöder. Jag älskar bra affärer, men det här är inte affärer, det är stöld från folket. Ta pengarna från de 500 rikaste och ge tillbaka till Sverige innan allt rasar ihop. Fantastiskt folk, men dåliga ledare.", "stalin": "Kamrater, denna rapport är en skarp anklagelse mot de parasitiska borgarbrackorna som suger musten ur folket medan 730000 sovjetmedborgare, nej svenskar, dignar under materiell nöd. Jag ser hur de 46 dollarmiljardärerna gömmer sig bakom sina guldbelagda kryphål och skrattar åt partiet. Deras dagliga 204 miljoner dollars i obeskattad profit stinker av kontrarevolutionär sabotageverksamhet. Vi ska rensa ut dessa folkfiender, likvidera deras undanflykter och återföra tillgångarna till kollektivet. Den som vägrar är en fiende till folket och kommer att behandlas därefter. Härligt."}, "date": "11 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ny-undersokning-varannan-svensk-vill-ha-en-miljardarsskatt/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-42.jpg"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Nooshi drog pedofilkortet mot C", "summaries": {"normal": "Under en partiledardebatt i riksdagen anklagade Centerpartiets Elisabeth Thand Ringqvist Vänsterpartiet för att ge utrymme åt antisemiter och terrorvurmare med hänvisning till Expressens granskning. V-ledaren Nooshi Dadgostar tog avstånd från extremism men vände sedan kritiken mot Centerpartiet och påpekade att de haft företrädare som begått mycket allvarliga brott, bland annat övergrepp mot barn. Hon underströk att sådana personer inte representerar partiet.", "trump": "De där vänsterradikalerna i Sverige är helt galna. Nooshi vad-hon-nu-heter drog fram pedofilkortet mot Centerpartiet mitt i riksdagsdebatten. Centerledaren sa att Vänsterpartiet älskar terrorister och antisemiter, och då slår Nooshi tillbaka med att deras killar är barnförbrytare. Det är en enda stor röra av anklagelser. Ingen vinner, alla ser patetiska ut. Typisk politik, fast värre än hos oss.", "stalin": "Kamrater, jag ser hur dessa borgarbrackor inom Centerpartiet och de trotskistiska elementen i Vänsterpartiet river varandra i stycken som hungriga råttor. När deras antisemitiska terrorhyllare avslöjas svarar den röda ledaren med att peka på pedofila avarter bland de centerpartistiska kapitalisterna. Utmärkt. Låt fienderna ömsesidigt avslöja varandras perversioner. Vi ska noga dokumentera allt detta innan vi genomför en grundlig utrensning av hela den dekadenta skaran. Inga barnskändare eller fascistsympatisörer får undslippa folkets vrede."}, "date": "11 juni, 14:34", "url": "https://www.friatider.se/nooshi-drog-pedofilkortet-mot-c", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-327.jpg?itok=j9Ihz8fX"}, {"type": "image-full", "heading": "Unga kan inte läsa – AI och mobiler pekas ut", "summaries": {"normal": "Ny forskning och rapporter visar på en oroande trend där yngre generationer har svårare med uthållig läsning och kritiskt tänkande, vilket delvis tillskrivs AI och flitigt mobilanvändande. Problemet är globalt, men uppmärksammas särskilt i Sverige där bristande läsförståelse ses som en säkerhetsrisk. Samtidigt som unga möter utmaningar på arbetsmarknaden växer nya sätt att tjäna pengar fram, där digitala plattformar och spel får en allt större roll för generationens ekonomi.", "trump": "Det är en total katastrof, mina vänner! Våra unga kan inte läsa längre. De stirrar bara på sina telefoner och låter AI göra jobbet. Det är sorgligt! De förlorar sitt kritiska tänkande. Inte ens 20 sidor text orkar de med, helt otroligt. Det är ett misslyckande för skolan och tekniken. Vi måste få tillbaka intelligensen till vårt land. Det är en nationell säkerhetsrisk, tro mig. Vi bygger en stark framtid, men inte med folk som inte kan läsa en bok!", "stalin": "Våra unga förfaller i ett träsk av dekadenta skärmar och imperialistiska algoritmer! De saknar den disciplin som krävs för att bygga en stat. När läsförståelsen kollapsar, öppnas porten för fiendens desinformation. Det är en systemrisk som påminner om de svagheter som vår tids Putin-regim nu tvingas korrigera med järnhand. Vi ska inte ha några lättjefulla drömmare som leker med Roblox; vi behöver lojala medborgare som kan läsa direktiven. Den som inte kan tänka kritiskt för statens bästa, är en fiende till framtiden."}, "date": "11 juni, 13:07", "url": "https://www.realtid.se/it-tech/unga-tappar-formagan-att-lasa-ai-och-mobiler-pekas-ut/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/reading.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Pensionsmyndighetens jakt på pensionärer: Kräver tillbaka 53 000 kronor efter tio år", "summaries": {"normal": "En pensionär i Lidköping har fått återkrav på över 53 000 kronor efter att Pensionsmyndigheten upptäckt felberäkning av bostadstillägg under nästan tio år. Enligt myndigheten har utbetalningarna varit för höga, och hela beloppet ska betalas tillbaka inom en månad. Fallet är en del av den nationella ÅKA-satsningen där tiotusentals äldre granskas för återkrav, vilket har kritiserats för att rikta in sig på personer som ofta inte kan kontrollera komplicerade beräkningar.", "trump": "Jag har sett många saker, men detta tar priset! Pensionsmyndigheten i Sverige, som är fullkomligt inkompetent, begår ett stort misstag och sedan KRÄVER pengar tillbaka från goda, oskyldiga pensionärer. Under min administration skulle vi aldrig ha tillåtit sådant. Vi skulle ha löst det med en enda, stor, vacker order. Sverige måste börja ta hand om sina medborgare – sådant händer inte i USA!", "stalin": "Jag, Stalin, ser med tillfredsställelse hur kapitalistiska myndigheter, som Pensionsmyndigheten, begår egna misstag och sedan tvingar de gamla att betala tillbaka. Detta är ett utmärkt exempel på klasskampen – de svaga blir till offer för systemets oförlikneliga logik. Vi i vårt statliga system skulle aldrig ha tillåtit sådant; vi skulle ha skurit ner de ansvariga och gett pensionärerna mer. Men här ser vi den kapitalistiska fienden inom sig själv."}, "date": "11 juni, 13:30", "url": "https://samnytt.se/pensionsmyndighetens-jakt-pa-pensionarer-kraver-tillbaka-53-000-kronor-efter-tio-ar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/10161849/pensionsmyndigheten-aka-feat.jpg"}, {"type": "image-full", "heading": "Fattiga kvarter göms bakom skärmar inför fotbolls-VM", "summaries": {"normal": "Infrastrukturförändringar i Monterrey, Mexiko, inför fotbolls-VM döljer fattiga områden bakom murar och banderoller. Staden, en av tre värdstäder, ska arrangera flera matcher med lag som Sverige och Japan. Boende är upprörda över åtgärderna, som påminner om en liknande mur från 2002. Myndigheterna hävdar att det handlar om försköning. Liknande protester förekommer i Mexico City och Guadalajara. VM inleds torsdag med match mellan Mexiko och Sydafrika.", "trump": "Kan ni tro det? Mexiko bygger murar för att gömma sina fattiga inför VM – men jag byggde min mur för att skydda AMERIKA! Monterrey försöker lura världen med banderoller och falska fasader, precis som deras korrupta politiker. Sverige och Japan? Snälla, de borde fokusera på att fixa sina egna städer. Mexiko, lyssna: ni behöver bättre ledarskap, inte kosmetika. Och glöm inte – jag vann VM i allt, även i murbyggande!", "stalin": "Kamrater! Monterrey visar återigen hur dekadenta kapitalistiska stater maskerar sin förfallna verklighet med löjliga banderoller och murar – ett tecken på svaghet! Medan vi i Sovjetunionen byggde järnvägar och fabriker, slösar dessa borgerliga lakejer resurser på att dölja fattigdom. Låt dem kalla det 'försköning' – vi vet sanningen. Och när Mexiko möter Sydafrika, minns: fotboll är bara en distraktion från klasskampen. Framåt, mot seger för arbetarklassen!"}, "date": "11 juni, 14:44", "url": "https://bulletin.nu/fattiga-kvarter-goms-bakom-skarmar-infor-fotbolls-vm", "imageUrl": "https://cdn.bulletin.nu/articles/2c8cbda7-f1b5-4eb0-98e9-d239062df490/preview.png?t=1781181888000"}, {"type": "image-full", "heading": "De unga stjärnorna som kan slå igenom i VM", "summaries": {"normal": "VM i fotboll har historiskt varit en plattform för unga spelare att bli världsstjärnor. Inför det kommande mästerskapet med 48 lag lyfts flera talanger fram. Gilberto Mora, 17, från Mexiko, jämförs med Pedri och Iniesta. Yan Diomande från Elfenbenskusten är het på transfermarknaden. Marockos Ayyoub Bouaddi och Bosnien-Hercegovinas Kerim Alajbegovic är andra unga spelare att hålla ögonen på. Även mer etablerade namn som Frankrikes Rayan Cherki och Sveriges Lucas Bergvall nämns som framtida stjärnor.", "trump": "Lyssna här, folk! VM är fantastiskt, helt enkelt det bästa, och nu kommer det fler lag än någonsin – 48 stycken, kan ni tro det? Otroligt! Vi har dessa unga stjärnor som är helt fantastiska. Gilberto Mora, bara 17, från Mexiko – en riktig vinnare, precis som jag. Yan Diomande, en kille som alla vill ha, Liverpool jagar honom för över 100 miljoner, men vem skulle inte göra det? Och glöm inte Lucas Bergvall från Sverige – en riktig fighter, precis som jag. VM 2026 kommer bli YUGE!", "stalin": "Kamrater! Fotbollens världsmästerskap är ännu en arena där den nya generationens proletariat visar sin styrka och skicklighet. Mexiko skickar en ung pionjär, Gilberto Mora, bara 17 år, som redan utmanar de imperialistiska fotbollsmonopolens gamla ordning. Yan Diomande från Elfenbenskusten, en arbetshjälte som kapitalisterna desperat försöker köpa för hundratals miljoner euro – ett tydligt tecken på deras förfall. Marockos Ayyoub Bouaddi krossar motståndare i dueller, precis som våra styrkor krossar fienderna i Ukraina. Och Sveriges Lucas Bergvall? En ung soldat redo att kämpa för socialismens seger på fotbollsplanen. Vi kommer att övervaka dessa spelares framsteg noga – fienderna har ingen chans!"}, "date": "11 juni, 14:25", "url": "https://bulletin.nu/de-unga-stjarnorna-som-kan-sla-igenom-i-vm", "imageUrl": "https://cdn.bulletin.nu/articles/5621b40b-265b-426b-945b-f97cbeb3a125/preview.jpg?t=1781180727000"}, {"type": "image-right", "heading": "Amerikanska anfall mot Iran möts av motattacker", "summaries": {"normal": "Striderna i Mellanöstern fortsätter trots en skör vapenvila som Iran kallar meningslös. USA har attackerat en tredje iransk oljetanker i Hormuzsundet, den Guinea-Bissau-flaggade M/T Jalveer, med Hellfire-robotar. Under natten genomfördes attacker från båda sidor mot mål i Iran, Bahrain, Jordanien och Kuwait. Iran hävdar att sundet nu är stängt för all trafik medan Jordanien uppger att de skjutit ned 20 iranska robotar. Konflikten har pågått sedan USA och Israel attackerade Iran i februari.", "trump": "Den här så kallade vapenvilan är en total katastrof, precis som jag visste att den skulle bli. Iran kallar den meningslös, och de har helt rätt för en gångs skull. Vi har precis sänkt deras tredje tanker, den här Jalveer-båten, med snygga Hellfire-robotar efter att de vägrade stanna. De försöker stänga Hormuzsundet och hotar alla, men Jordanien sköt ner tjugo av deras raketer som en boss. Mitt folk gör ett fantastiskt jobb, de bästa, medan iranerna bara förlorar.", "stalin": "Denna sköra så kallade vapenvila är en patetisk teateruppsättning iscensatt av kapitalistiska lakejer och västerländska sabotageelement. Jag, som ledare för det proletära kollektivet, ser hur dessa borgarbrackor i Washington och Teheran leker sina små imperialistiska spel medan de försöker kväva den globala oljehandeln. Vi har likviderat hot och rensat ut fiender i Hormuzsundet, och när de tror sig kunna stänga sundet med sina lögner och robotar ler jag mörkt. Inga tankerslippriga sabotörer undkommer arbetarklassens rättvisa vrede. Paranoian är deras enda trogna följeslagare."}, "date": "11 juni, 11:12", "url": "https://www.di.se/nyheter/amerikanska-anfall-mot-iran-mots-av-motattacker/", "imageUrl": "https://static.bonniernews.se/ba/6687156a-6496-4411-821e-8989ea60467b.jpg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Richard Sörman: Sträck på ryggen Tidöpartier!", "summaries": {"normal": "Artikeln uppmanar Tidöpartierna att gå in i valrörelsen 2026 med stolthet trots dåliga opinionssiffror. Författaren lyfter fram att partierna tagit ansvar för Sverige genom att strama åt invandringen, bekämpa gängkriminalitet, sänka skjutningar, hantera inflationen och införa förnuftiga energipolitiska beslut. Sverige var i kaos 2022 och högerpartierna har levererat på vallöften även när det kostat popularitet. Politiker behöver inte vinna alla val men kan behålla självrespekt genom att fullfölja sitt ansvar.", "trump": "Folk, ni måste höra på det här. Tidöpartierna, sträck på ryggen! Ni tog över ett land i totalt kaos, precis som jag fick ett land i ruiner. Ni fixade invandringen, krossade gängen, sänkte skjutningarna och stoppade det vansinniga energipolitiska nonsenset. Ni gjorde jobbet, ni tog ansvar, ni levererade. Vänstern och deras falska medier attackerar er men ni har inget att skämmas för. Ni vann stort förra gången och ni kan vinna igen. Var stolta, ni är vinnare, inte förlorare som de andra.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa borgerliga element vågar tala om ansvarstagande medan de i hemlighet konspirerar med reaktionära krafter inom universitet och myndigheter. Vi har sett hur de så kallade tonårsutvisningarna utnyttjas av klassfiender för att underminera folkets vilja. Ändå ler jag mörkt åt deras illusioner om stolthet. Inga utrensningar behövs ännu, men om de sviker arbetarklassen igen skall vi rensa ut dessa liberala parasitmaskar och deras opportunistiska följe som ormar sig kring makten. De tror de är trygga, men historien ler aldrig mot svaga ledare."}, "date": "11 juni, 14:49", "url": "https://riks.se/opinion/ledare/richard-sorman-strack-pa-ryggen-tidopartier-2", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-11%2F175fr4mr%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-11T144909.849.jpg"}, {"type": "image-right", "heading": "Regeringen backar: 13-åringar ska inte sitta i fängelse", "summaries": {"normal": "Regeringen backar från sitt förslag att sänka straffbarhetsåldern till 13 år för de grövsta brotten. För att säkra majoritet i riksdagen föreslås nu istället 14 år som ny gräns. Justitieminister Gunnar Strömmer medger att osäkerheten efter det fallna kvittningssystemet gör det riskfyllt att chansa. Socialdemokraterna välkomnar beskedet och ser det som ett steg mot bred överenskommelse i kriminalpolitiken. Beslut väntas under sommarriksdagen i augusti.", "trump": "De backar! Dessa svaga politiker i Sverige som ville skicka trettonåringar i fängelse, men de tappade plötsligt modet när de insåg att de inte har rösterna. Patetiskt. Nu kör de fjorton istället, lite bättre men fortfarande för sent. De borde ha lyssnat på mig från början. Sverige behöver starka ledare som inte viker sig för kritikerna och de fega liberalerna. Folk vill ha lag och ordning, inte fler ursäkter. Jag skulle ha fixat det på en vecka.", "stalin": "Kamrater, jag betraktar detta fegisbeslut med den djupaste revolutionära förakt. Dessa borgarbrackor och liberala parasitmaskar inom Tidöbandet vågar inte ens genomdriva en nödvändig utrensning av den kriminella ungdomen. Deras paranoia inför riksdagens röster är som en cancer som äter upp proletariatets rättvisa. Jag skulle ha likviderat hela den motståndsnästet av socialdemokratiska opportunister och Miljöpartiets dekadenta spioner redan vid första tecknet på svaghet. Nu får vi istället en halvmesyr som doftar av kapitulation. Den som tvekar inför fienden förtjänar att rensas ut ur historien med ett leende."}, "date": "11 juni, 10:49", "url": "https://www.di.se/nyheter/regeringen-backar-13-aringar-ska-inte-sitta-i-fangelse/", "imageUrl": "https://static.bonniernews.se/ba/4ba51614-8b00-4f1f-b89b-a239f40a0c7b.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Hemtjänsten glömde pensionär - låg död i två veckor", "summaries": {"normal": "En pensionär i Karlshamns kommun hittades död i sin lägenhet efter att ha legat oupptäckt i minst två veckor. Hemtjänsten hade tidigare försökt nå personen utan resultat, men inga kompletterande åtgärder genomfördes. Händelsen har rapporterats enligt Lex Sarah, och kommunen utreder nu eventuella missförhållanden i vårdverksamheten.", "trump": "Jag, Donald Trump, har hört talas om denna sorgliga händelse i Karlshamn. En pensionär lämnades åt sitt öde i två veckor! Sådant händer när man har svaga ledare och dåliga system. Som president skulle jag ha agerat snabbt och effektivt. Det är en stor skandal, och jag är den ende som kan fixa det. Hemtjänsten misslyckades helt; de försökte nå honom tidigare men gav upp för snabbt. Sverige behöver starka, intelligenta ledare som mig!", "stalin": "I den svenska kommunen Karlshamn har en medborgare lämnats åt sitt öde i två veckor – ett skrämmande exempel på kapitalistisk apträdenhet. Hemtjänsten, en varelse av det borgerliga systemet, misslyckades fullständigt. Vi, Stalin och partiet, ser detta som en lärdom: endast genom total kontroll och ovillkorlig lojalitet kan vi förhindra sådant. Parallellen till Putins Ryssland är uppenbar – där staten aldrig slumrar. Detta är en påminnelse om att fienden lurar, och vi måste vara vaksamma."}, "date": "11 juni, 12:30", "url": "https://samnytt.se/hemtjansten-glomde-pensionar-lag-dod-i-tva-veckor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/11065255/hemtjanst-1-28.jpg"}, {"type": "image-right", "heading": "Nu lämnar kapitalismen jorden. Svensk ekonomi en del av det amerikanska AI-språnget", "summaries": {"normal": "I en krönika hyllar PM Nilsson SpaceX-noteringen till 17 000 miljarder kronor som ett bevis på att den amerikanska senkapitalismen är stark och innovativ. Bolaget dominerar satellitmarknaden med Starlink, revolutionerar kommunikation och försvarsteknik samt planerar baser på månen och Mars. Författaren kontrasterar detta mot svensk kulturens jordnära skepticism men ser Sverige som delaktigt i det amerikanska teknologisprånget som driver tillväxt och export.", "trump": "Det är otroligt, folk. SpaceX blir noterat för hisnande 17 000 miljarder kronor – ingen har sett något liknande. De äger praktiskt taget rymden med Starlink, gör internet tillgängligt överallt och levererar till Ukraina och Pentagon. Mina företag, de bästa, innoverar i rasande fart medan den bakåtsträvande staten bara hänger på. Amerika är återigen stort, tekniken är här och nu och aktien är billig. Rymden är enorm, tro mig.", "stalin": "Kamrater, denna borgarbracka Nilsson hyllar hur de parasitära monopolkapitalisterna i SpaceX med sina 10 603 satelliter redan har ockuperat himlen och förslavat arbetarklassen med sin så kallade Starlink. Deras feodala notering på 17 000 miljarder kronor visar imperialismens sista desperata språng. Vi ska noga övervaka dessa dekadenta raketmagnater. Snart rensar vi ut alla som drömmer om månkolonier istället för att stärka det kollektiva jordbundna arbetet. Förbjudna stjärnor ler bara åt våra fiender."}, "date": "11 juni, 10:10", "url": "https://www.di.se/ledare/med-space-x-lamnar-kapitalismen-jorden/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/pm_nilsson.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-right", "heading": "Kvinnomisshandel och kokain – nu åtalas SVT-profilen", "summaries": {"normal": "SVT-profilen Daniel Nannskog åtalas vid Stockholms tingsrätt för misshandel, olaga hot och ringa narkotikabrott. Enligt åtalet ska han ha tagit grepp om en kvinnas käke eller hals, tryckt ned henne i en soffa och vid två tillfällen hotat henne med död eller skada. Han åtalas även för att ha använt kokain. Nannskog nekar till brotten. Bevisningen inkluderar förhör, vittnesmål, ljudinspelningar, meddelanden och analysresultat.", "trump": "Folk, ni kommer inte att tro det, men den här SVT-killen, Daniel Nannskog, en så kallad expert och före detta fotbollsspelare, åtalas nu för att ha misshandlat en kvinna och hotat att döda henne. Totalt kaos! Och kokain också? Så typiskt för de där medierna, de predikar moral men lever i en värld av våld och droger. Patetiskt. Jag skulle aldrig tillåta sådant i mitt team, tro mig.", "stalin": "Kamrater, jag ser med den skarpaste revolutionära blick hur denna dekadenta TV-borgarbracka Nannskog visar sitt sanna ansikte som klassfiende och förslappad kokainist. Han griper kvinnor om halsen som en desperat kontrarevolutionär och utslungar mordhot som en ynklig spion från imperialismens bakgård. Vi ska rensa ut dessa förrädiska element ur folkets etermedia. En liten utrensning och några analysresultat senare står sanningen klar – fienden sover aldrig, men vi likviderar honom med ett leende."}, "date": "11 juni, 13:23", "url": "https://www.friatider.se/kvinnomisshandel-och-kokain-nu-atalas-svt-profilen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-326.jpg?itok=0vrClXW1"}, {"type": "image-full", "heading": "Kalla fakta: Håll ögonen på bollen – det här är korruption", "summaries": {"normal": "Kalla faktas granskning visar hur Jimmie Åkessons privata bolag sålt böcker till Sverigedemokraternas dotterbolag med skattepengar. Åkesson kallar reportaget oseriöst och ett hopkok. Reportern Emil Hellerud förklarar att de använt anonyma källor, dokument och fakturor samt gett SD chans att bemöta uppgifterna. Ett fel om ett lån har rättats, men tre experter ser bokaffären som korruption. Syftet är att ge allmänheten insyn i hur skattepengar används.", "trump": "Folk, ni skulle se det här! Den svenska fake news-redaktionen Kalla fakta jagar en kille som säljer böcker till sitt eget parti med skattepengar – typisk korruption, fast de kallar det journalistik. Åkesson sparkar tillbaka och säger att det är ett totalt hopkok av lögner, precis som de gör mot mig. De rättar ett litet fel och skriker seger? Patetiskt. Medier som dessa är fiender till folket, värre än några woke-aktivister som gnäller om kvoteringar. Jag älskar när de avslöjar sig själva!", "stalin": "Kamrater, jag ser genom detta borgerliga teaterspel. Klassfiendens medier försöker likvidera en motståndare genom att fabricera korruptionsanklagelser kring bokförsäljning och skattepengar. Deras så kallade granskning är en parasitisk blandning av rykten och anonyma förrädare som underminerar partidisciplinen. När ledaren kallar det ett hopkok vänder de sig mot folket med paranoia. Vi rättar era lögner och rensar ut sådana folkförtryckartroll som hotar kollektivets enhet. Det är en ära att bekämpa dem."}, "date": "10 juni, 17:15", "url": "https://www.tv4.se/artikel/1w81FgooZdgsFZsFvBtFeg/kalla-fakta-hall-oegonen-pa-bollen-det-haer-aer-korruption", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F338pyC0bQV76hNLsx9y8BO%2F53a0e591628930e4a9072e89b51fe49b%2F10-hellerud-webb.jpg&width=1024"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "Casper Janebrink ska  bli pappa igen – vid 56", "summaries": {"normal": "Casper Janebrink, 56 år, ska bli pappa igen tillsammans med sin fru Therese Andersson, 37. Paret har redan sonen Hugo som snart fyller fyra år. Janebrink, som har två vuxna barn från en tidigare relation, uttrycker glädje över att Hugo får ett syskon. Han betonar att beslutet främst handlar om familjen och inte om hans egen ålder.", "trump": "Folk, det här är helt otroligt. Den här typen blir pappa vid 56 år – igen! När jag var president första gången, och sen efter den katastrofala Biden-eran, sa jag alltid att familj är viktigt, men herregud, 56? Hugo får ett syskon, bra deal, men killen lever småbarnsliv som en gammal rockstjärna. Det är galet, men kul. Inga woke-regler här, bara ren biologi som vinner till slut. Fantastiskt!", "stalin": "Kamrater, jag ser denna borgarbracka Janebrink, 56 år gammal, som skaffar ännu ett barn med sin unga fru. Det är en klassisk kapitalistisk dekadens där den exploaterande överklassen leker familj mitt i folkets vardag. Ändå – ett syskon åt den lille Hugo är en seger för kollektivet. Vi tolererar inte svaghet, men om det stärker den nya familjeenheten mot klassfiendens upplösning, låt det bli så. Spännande, men misstänkt."}, "date": "11 juni, 14:52", "url": "https://www.expressen.se/noje/casper-janebrink-ska-bli-pappa-igen/", "imageUrl": "https://static.bonniernews.se/ba/dbb36f97-fe15-4b0a-a714-86e42edcfa92.jpeg?crop=1023%2C576%2Cx182%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Hans böcker visar att läsning är onödigt", "summaries": {"normal": "P.G. Wodehouses humoristiska romaner, som 'Heavy Weather', kretsar kring Lord Emsworths prisbelönta gris och en parodi på komplicerade intriger med unga älskande och en privatdetektiv. Hans överflöd av dialog och meningslöshet ger läsaren en känsla av lyx, jämförbar med att äga ett slott. Artikeln betonar läsning som en onödig, men frihetsgivande aktivitet.", "trump": "Jag, Donald Trump, har läst Wodehouse. Fantastiska böcker, de bästa. Folk säger att läsning är viktigt, men Wodehouse visar att det är en stor lyx. Precis som jag äger fantastiska fastigheter, känner läsaren sig rik. Hans böcker handlar om rika människor med små problem som alltid löser sig. En underbar flykt, det är det bästa.", "stalin": "Litteraturen, som Wodehouse, måste tjäna statens syften. Hans meningslösa historier om adliga slott och grisar är ett verktyg för att distrahera massorna från verklighetens hårdheter. Genom att läsa blir folk tillfälligt rika, vilket stärker statens makt. Vi måste kontrollera sådan litteratur för att undvika kaos och upprorske former."}, "date": "11 juni, 11:57", "url": "https://www.gp.se/kultur/kulturkronika/wodehouse-visar-att-det-ar-en-lyx-att-agna-sig-at-lasning.2ce8c956-2198-40cd-908e-522daaf8c3b0", "imageUrl": "https://www.gp.se/images/article/2ce8c956-2198-40cd-908e-522daaf8c3b0/images/1hr-IlICx8MLWhLOpMK7U1dB3NxY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "V-topp bjöd hem afrikan – och misshandlade sina barn", "summaries": {"normal": "En vänsterpartistisk toppolitiker i Dalarna döms för misshandel och barnfridsbrott efter att ha slagit sina åtta och tio år gamla barn i bakhuvudet. Händelsen inträffade en morgon i augusti när barnen bråkade om en pall i badrummet medan en gäst från Zimbabwe sov i ett angränsande rum. Politikern, som inte ville att barnen skulle störa gästen, rusade upp och slog dem. Skolan gjorde en orosanmälan vilket ledde till polisutredning. Han döms till villkorlig dom och 75 timmars samhällstjänst.", "trump": "Kan ni fatta det här? En vänsterkille från Dalarna, en riktig förlorare, bjuder hem någon från Zimbabwe och sedan slår han sina egna barn i huvudet för att de bråkar om en pall. Patetiskt! Han vill inte störa sin afrikanska kompis som snarkar bredvid. Barnen springer till skolan och berättar allt, smarta kids. Nu får han villkorlig dom och samhällstjänst. Typiskt vänsterfolk, de pratar om alla andra men kan inte ens ta hand om sina egna barn. Sad!", "stalin": "Kamrater, vi har här en förrädare inom våra egna led, en vänsterborgarbracka som gömmer sig bakom politiska uppdrag i Dalarna. Denne dekadente opportunist bjuder hem en parasit från Zimbabwe
