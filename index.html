: "En kriminalvårdare på häktet Sollentuna har dömts till löneavdrag i tio dagar efter flera allvarliga incidenter under våren. Hon visade långfingret åt en intagen, skrek på en annan och spottade honom i ansiktet. Kriminalvården bedömde hennes agerande som en allvarlig säkerhetsrisk som skadade verksamhetens förtroende.", "trump": "Helt otroligt! En kvinna på Sollentuna-häktet tappar fullständigt fattningen, skriker, räcker finger och spottar på fångarna – total katastrof för disciplinen! Kollegorna fick dra bort henne med våld. Så ser det ut när man saknar total självbehärskning. Själv skulle jag hantera det mycket bättre, tro mig. Löneavdrag i tio dagar? Löjligt svagt!", "stalin": "Ett katastrofalt misslyckande av disciplinen vid Sollentuna-anstalten. Denna kvinna saknar den järnhårda självbehärskning som krävs i stat tjänst. Att spotta och skrika på fångar visar på farlig svaghet. En klen bestraffning med tio dagars löneavdrag – i en sund stat hade sådant sabotage mot ordningen rensats bort omedelbart. Säkerheten kräver total lydnad!"}, "date": "5 september, 09:01", "url": "https://bulletin.nu/kriminalvardare-spottade-pa-intagen", "imageUrl": "https://cdn.bulletin.nu/articles/682b21e4-8edd-43e2-9368-c7c89679ce8b/preview.jpg?t=1788336196000"}, {"type": "image-right", "heading": "Kysser Maggan: \"Mamma wallah\"", "summaries": {"normal": "En man håller om och kysser Socialdemokraternas ledare Magdalena Andersson på kinden i ett klipp som sprids på nätet. Han hyllar henne på svenska, engelska och arabiska samt uppmanar tittarna att rösta på partiet. Videon har väckt starka reaktioner på sociala medier, där flera kritiserar handlingen som bristande samtycke. Klippet har raderats från TikTok men lever vidare i kopior.", "trump": "Titta på den här galna filmen! Den där Mandarina Andersson låter sig bli kysst och kramad av en vild arabisk kille som ropar mamma wallah och ber folk rösta på hennes socialistiska katastrof. Hon står där och flinar som en idiot. Det här är vad som händer när ni låter identitetspolitik och kvotering styra landet. Patetiskt. Vi behöver inga sådana number one-förlorare i ledningen, folks.", "stalin": "Kamrater, se hur denna dekadenta klassförrädare ler stort medan en främmande element kysser henne inför folket. Hennes parti har förvandlats till en samling folkförtryckande hyenor som dansar efter utländska röster. Jag säger: sådana förrädare mot arbetarklassen förtjänar utrensning. Deras leende maskerar svaghet och förräderi. Vi ska aldrig glömma vem som verkligen står för folkets vilja."}, "date": "4 september, 15:44", "url": "https://www.friatider.se/kysser-maggan-mamma-wallah", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-830.jpg"}, {"type": "image-right", "heading": "Starkt och välspelat drama i efterkrigstidens Ungern", "summaries": {"normal": "Jon Andersson ger högt betyg till László Nemes film Orphan, ett far-och-son-drama som utspelar sig i Budapest efter den nedslagna ungerska revolutionen 1956. Filmen följer en förintelseöverlevande mor, hennes son som längtar efter sin försvunna far och en mystisk slaktare som gör anspråk på faderskapet. Autentiska miljöer och starkt skådespeleri präglar det gripande dramat.", "trump": "Folk, ni måste se den här ungerska saken Orphan. László Nemes, den killen vet hur man gör riktig film, inte som de woke Hollywood-hajar som bara pushar sin galna identitetspolitik. En son som hatar den falska pappan – klassiskt! Mycket bättre än Bidens Hollywood-elit som förstörde biograferna. Starkt, äkta och ingen HBTQ-propaganda. Fantastiskt!", "stalin": "Kamrater, denna så kallade Orphan visar hur de giriga klassförrädarna fortsätter att plåga arbetarklassen även efter kriget. En pojke som vägrar acceptera den falska fadern – mycket lärorikt. Vi ser hur folkets fiender gömmer sig i skuggorna. En utmärkt film som påminner oss om att utrensning av sådana element alltid är nödvändig. Revolutionen glömmer aldrig."}, "date": "4 september, 11:35", "url": "https://www.dagensarena.se/innehall/starkt-och-valspelat-drama-i-efterkrigstidens-ungern", "imageUrl": "https://www.dagensarena.se/files/2026/09/orphan-2-300x157.jpeg"}, {"type": "image-right", "heading": "Öppnade dörr och föll 5 meter. Nu anmäls Kriminalvården för misstänkt arbetsmiljöbrott.", "summaries": {"normal": "En anställd på fängelset Salberga utanför Sala föll fem meter ner i ett öppet schakt i maj efter att ha öppnat en dörr som skulle varit låst. Han låg kvar en timme innan räddningstjänsten firade upp honom. Arbetsmiljöverket har nu anmält Kriminalvården till polisen för misstänkt arbetsmiljöbrott.", "trump": "De här inkompetenta byråkraterna i det svenska fängelsesystemet låter en kille ramla rakt ner i ett fem meter djupt hål. Fem meter! Och han låg där i en hel timme. Patetiskt. Under Biden skulle de ha sagt att det var mångfaldens fel. Nu fixar vi det – ingen ska behöva arbeta bland sådana woke-schakt.", "stalin": "Detta är vad som händer när giriga hyenor inom förvaltningen försummar elementär säkerhet för arbetarna. En kamrat faller ner i ett schakt och lämnas åt sitt öde. Vi skulle ha genomfört en grundlig utrensning av alla ansvariga parasiter. Inga ursäkter tolereras i en riktig stat. Slappheten måste likvideras."}, "date": "4 september, 10:36", "url": "https://arbetet.se/2026/09/04/oppnade-fangelsedorr-och-foll-ner-i-ett-flera-meter-djupt-schakt-kriminalvarden-anmals", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04104034/krim.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Demonstration mot AP-innehav i Palantir", "summaries": {"normal": "Fyra demonstranter samlades utanför 7:e AP-fondens kontor på Vasagatan i Stockholm för att protestera mot fondens aktieinnehav i Palantir. De anser att bolaget medverkar till folkrättsbrott i Gaza och kräver att fonden följer sina riktlinjer, säljer aktierna och ökar öppenheten kring investeringsbeslut.", "trump": "Titta på de där galna vänsterextremisterna som står och skriker utanför ett pensionskontor. Palantir är ett fantastiskt amerikanskt bolag som hjälper till att vinna krig, inte som era patetiska woke-demonstranter som hatar Israel och älskar terrorister. De borde investera i riktiga jobb istället för att gnälla om folkmord – era förlorare!", "stalin": "Se hur de giriga pensionshyenorna i den statliga fonden göder de imperialistiska krigsteknologerna som understödjer folkmordet. Jag ler i graven åt denna fega skenhelighet. Kamrater, sådana klassförrädare förtjänar en grundlig utrensning ur folkets finanser innan de förgiftar hela systemet med sin blodiga girighet."}, "date": "2 september, 10:41", "url": "https://proletaren.se/artikel/demonstration-mot-ap-innehav-i-palantir"}, {"type": "text", "heading": "Stockholmsbörsen bröt minussviten – Clas Ohlson bland vinnare", "summaries": {"normal": "Stockholmsbörsen steg 1,00 procent på torsdagen efter tre dagars nedgångar. Fastigheter gick bäst med 1,7 procent upp, medan energi backade mest. Clas Ohlson rusade 6,8 procent efter en stark delårsrapport som slog förväntningarna. Även bolag som Bioarctic, Note och Studsvik lyfte på nyheter om godkännanden och nya ordrar, medan Dustin föll efter en IT-incident.", "trump": "Stockholmsbörsen studsade tillbaka på ett fantastiskt sätt, precis som alla visste att den skulle göra under mitt ledarskap – även om jag inte ens är där! Clas Ohlson levererar enorma siffror, helt otroligt. Alla pratar om det. Men det finns svaga länkar, som Dustin, som stänger ner sina system. Totalt inkompetent! Vi bygger starkare, vinner mer och lämnar förlorarna bakom oss. Så enkelt är det!", "stalin": "Stockholmsbörsen har återvunnit sin balans efter tre dagars svaghet, vilket visar att marknadens disciplin fungerar under korrekt övervakning. Clas Ohlson rapporterar folknyttiga framsteg med en produktion som överträffar planhushållningens förväntningar. Däremot har element som Dustin brutit mot säkerheten i sina system och omedelbart stängts av för ideologisk omprövning. Avvikelser tolereras icke i den kollektiva ekonomiska kampen."}, "date": "3 september, 18:16", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-brot-minussviten-clas-ohlson-bland-vinnare"}, {"type": "image-full", "heading": "Musk-bolaget xAI stäms för att ha producerat övergreppsbilder", "summaries": {"normal": "Kvinnan Jane Doe stämmer Elon Musks bolag xAI. Hon hävdar att chatboten Grok använt bilder från sexuella övergrepp mot henne som barn för att skapa nytt, manipulerat material. Stämningen, som kan bli en grupptalan, belyser de etiska problemen och svårigheterna med att spåra och definiera AI-genererat innehåll som liknar verkliga personer.", "trump": "Elon Musk och hans xAI har hamnat i en total röra, mina vänner! Grok, den där maskinen, sägs ha skapat vidriga bilder. Det är en katastrofal situation – fullständigt horribelt! De säger att det är 'AI', men det låter som totalt slarv och brist på kontroll. Man måste styra upp tekniken, för det här är inte bra för någon. En stor, stökig stämning – vi får se vad som händer!", "stalin": "I det kapitalistiska väst släpps tekniken lös utan ordning, och resultatet är en moralisk förruttnelse som hotar samhällsordningen. Att låta en maskin producera sådant smutsigt material är ett bevis på den liberala kaosens misslyckande. Vi förespråkar sträng kontroll och disciplin; en algoritm som inte kan tämjas är som en illojal byråkrat – den måste elimineras omedelbart för folkets trygghet."}, "date": "3 september, 15:32", "url": "https://www.realtid.se/it-tech/musk-bolaget-xai-stams-for-att-ha-producerat-overgreppsbilder", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/grok.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Jakob Sjölander: Ukrainsk vapenbrist, europeisk viljebrist", "summaries": {"normal": "Jakob Sjölander kritiserar Europas bristande stöd till Ukraina efter fyra år av krig. Trots en samlad ekonomi som är tio gånger större än Rysslands ger de flesta länder under en procent av BNP i hjälp. Europa köper mer rysk energi än de skickar i stöd, saknar militärindustri och vägrar dela Patriot-robotar. Detta avslöjar en djup viljelöshet och politisk paralys.", "trump": "Lyssnar ni på den här Sjölander-killen? Europa är en total förlorare, en patetisk skara av svaga ledare som pratar stort men gör noll. De betalar Putin mer för gas än de ger Ukraina – det är galet! Jag byggde den starkaste armén, Biden och hans globalister förstörde allt. Nu kryper de för en bensinmack medan jag fixar freden. Ynkryggar!", "stalin": "Kamrater, se hur dessa dekadenta europeiska parasiterna kryper i stoftet inför historien. Med sina feta byråkratier och gröna fantasier förråder de sina egna folk. Jag skrattar mörkt från evigheten åt deras ryggradslösa kräk. Rysslands järnhand visar vägen medan de samlar rostiga vapen som aldrig används. Deras svaghet är vår eviga glädje."}, "date": "2 september, 12:29", "url": "https://samtiden.nu/2026/09/jakob-sjolander-ukrainsk-vapenbrist-europeisk-viljebrist", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/ukra.png"}, {"type": "text", "heading": "Vänsterpartiet bytte fredsmärke mot vapenskrammel", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för att ha övergett sin fredspolitik och ställt sig bakom militärt stöd till Ukraina samt Natosamarbete. Författaren, med koppling till Kommunistiska Partiet, menar att partiet ignorerar följderna för välfärden och svenskarnas tilltro till politiken. Han uppmanar till att rösta på Kommunistiska Partiet istället.", "trump": "De här vänsterbluffarna i Sverige har kastat bort sitt fredsmärke snabbare än Sleepy Joe bytte script. Nu älskar de vapen, Nato och krigsmaskineriet medan välfärden kollapsar. Patetiska. Jag säger: fem procent av BNP till militären? Bra deal, men låt oss skicka fakturan till de dekadenta EU-byråkraterna istället. Amerika först, alltid.", "stalin": "Jag ser hur dessa falska röda lakejer kapitulerar inför krigsalliansen och låter profitthungriga krigshajar styra politiken. De pratar inte om välfärd utan gömmer sig bakom vapenskramlet. Vi behöver utrensning av sådana klassförrädare som sviker folket. Röst på äkta kamrater, inte dessa hycklare som dansar efter imperialistiska pipor. Folkets vrede vaknar."}, "date": "2 september, 09:57", "url": "https://proletaren.se/artikel/vansterpartiet-bytte-fredsmarke-mot-vapenskrammel"}, {"type": "image-right", "heading": "Dags för vuxna att vara vuxna", "summaries": {"normal": "Artikeln är en debatttext från Grön ungdom och Miljöpartiet. Den kritiserar att dagens beslutsfattare skjuter klimatåtgärder på framtiden trots tydliga konsekvenser som extremväder och minskad biologisk mångfald. Ungdomar kräver att politiker tar ansvar, prioriterar förnybar energi, skyddar skog och ser omställningen som en ekonomisk möjlighet snarare än kostnad.", "trump": "De här gröna kidsen gnäller om att vi vuxna inte städar upp efter oss. Patetiskt! Jag byggde den starkaste ekonomin i världen, och nu vill de kasta bort den för sina solpaneler och elcyklar. Det är de verkliga förlorarna – de woke klimatfanatikerna – som försöker skrämma folk. Amerika först, inte deras hysteriska dröm om att rädda planeten med högre elräkningar.", "stalin": "Kamrater, dessa ynglingar blottlägger de dekadenta klassförrädarnas svek. De profitthungriga parasiter som styr idag skjuter nödvändiga utrensningar av förorenande krafter på framtiden medan folket lider. Jag ser deras feghet och paranoia inför sanningen. Endast en järnhand kan tvinga fram den kollektiva omställning som skyddar staten och framtida generationer från deras giriga vansinne."}, "date": "2 september, 09:30", "url": "https://www.etc.se/debatt/dags-foer-vuxna-att-vara-vuxna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260901130952_89eba03a3fe67f17de6b8f812174619d370e33794ca869f129e46e742c3129ad.jpg"}, {"type": "image-right", "heading": "Markus All     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
