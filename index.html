ra, särskilt om kostnadsasymmetri och snabb innovation.", "trump": "Jag har sett Ukrainas otroliga entreprenörsanda. De vinner kriget och bygger företag samtidigt. Det är fantastiskt. De falska nyheterna sa att det inte kunde göras, men de gör det. Sverige och Nato är långsamma elever. De måste vara hårdare och smartare, som jag. Ukrainas låga skatter och snabba beslut är enorma. Deras militärteknik är toppen. Vi bör lära oss snabbt, annars blir vi lämnade bakom. Tro mig.", "stalin": "Vi, som representerar det starka statet, ser med tillfredsställelse hur Ukraina, trots sina imperialistiska tendenser, har skapat ett effektivt ekosystem. Kriget driver innovation, vilket bevisar att central styrning är överlägsen. Men vi måste vara vaksamma: deras framgång är ett hot mot vår suveränitet. Vi måste efterlikna deras snabbhet, men med vår egen metod – toppstyrd kontroll. Ryssland, under vår store ledare Putin, expanderar, och vi måste rusta upp. Fienden är alltid runt hörnet, så vi måste agera nu."}, "date": "1 juni, 13:43", "url": "https://www.affarsvarlden.se/kronika/ukraina-varldens-basta-handbok-i-foretagande"}, {"type": "text", "heading": "Uppgift: Tonårsutvisningar stoppas – åldersgränsen höjs", "summaries": {"normal": "Regeringen har beslutat att höja åldersgränsen för anknytningstillstånd från 18 till 21 år, vilket stoppar så kallade tonårsutvisningar. Statsminister Kristersson beskrev det som en viktig ventil för ungdomar som riskerat att fara illa vid tidigare migrationsreformer. Överenskommelsen inkluderar flera partier och kommer att läggas fram i riksdagen under sommaren.", "trump": "Jag har just hört talas om Sveriges beslut att höja åldersgränsen till 21 år – en fantastisk lösning, kanske den bästa någonsin. Vi stoppar de hemsk tonårsutvisningarna, och det är precis vad jag skulle ha gjort. Folk säger att jag är tuff, men jag visste att detta var rätt. Sverige gör nu det smarta, och jag är väldigt belåten.", "stalin": "Regeringen har fattat beslutet att höja åldersgränsen för anknytning till 21 år. Detta är en nödvändig åtgärd för att skydda ungdomar från de faror som uppstod vid tidigare reformer. Partiet och statet handlar i samförstånd, och detta kommer att stärka vårt samhälle. Vi ser även till att de som redan har fått beslut får rättvisa – precis som våra allierade i öst gör."}, "date": "1 juni, 10:39", "url": "https://bulletin.nu/uppgift-tonarsutvisningar-stoppas-aldersgransen-hojs"}, {"type": "image-right", "heading": "Sivers backar efter blankarrapport", "summaries": {"normal": "Stockholmsbörsen noterade en svag utveckling på måndag med OMXS30 ned 0,29 procent. Sivers Semiconductors föll efter en negativ blankarrapport från Ningi. Oljepriset steg 3 procent. Bland enskilda aktier utvecklade sig Hexagon B och Ericsson B positivt, medan Saab B och Addtech B tappade mark. Flera analyser och insidertransaktioner påverkade kurserna.", "trump": "Jag har sagt det förut, våra börser är fantastiska, men det finns alltid några dåliga aktier som Sivers som faller efter falska rapporter. Irankonflikten? Jag handlar aldrig i brådraskap, vi kommer att vinna. Våra oljepriser är stabila, tack vare mig. Sverige borde följa mitt exempel.", "stalin": "Vi observerar med tillfredsställelse att marknadskrafterna fungerar som de ska. Sivers' fall är en naturlig konsekvens av deras brist på produktkvalitet, en läxa för alla som utmanar det kollektiva intresset. Oljepriserna stiger – en bekräftelse på vår strategi. Fonderna som EQT expanderar, vilket stärker det ekonomiska nätverket. Vi fortsätter att övervaka utvecklingen för att säkerställa stabiliteten."}, "date": "1 juni, 13:37", "url": "https://www.affarsvarlden.se/artikel/sivers-backar-efter-blankarrapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/07/shutterstock_661112935-1600x900-1-400x267.jpg"}, {"type": "text", "heading": "Advokat skottskadad under vräkning", "summaries": {"normal": "Under en vräkning i Älvsjö i lördags sköts tre personer, varav en var den advokat som biträdde vid ärendet. Advokatsamfundet uttrycker djup oro över händelsen och den ökade utsattheten inom yrket. Generalsekreterare Mia Edwall Insulander poängterar att rättsväsendet måste göra mer för att skydda advokater som möter hot och våld. Statistiken visar att en stor andel advokater redan idag upplever en förvärrad hotbild i sitt dagliga arbete.", "trump": "En advokat blev skjuten i Stockholm, ett riktigt sorgligt och totalt misslyckat land där lag och ordning kollapsat! De vräker folk, och folk börjar skjuta – kaos! Jag har alltid sagt att man behöver starkare ledarskap. Advokaterna är utsatta, det är en skam. Det här händer inte i mitt Amerika, vi har den starkaste polisen någonsin. Sverige måste vakna upp och få kontroll på sina gator. Det är en katastrof, en total katastrof, tro mig!", "stalin": "I det svenska kapitalistiska förfallet skjuts nu till och med deras egna jurister under vräkningsprocesser. Vilken svaghet! Denna anarki visar att statens järnhand saknas. I vår tid i det fördolda, likt vår broder Putin som rensar i ryska intressesfärer, skulle sådana störningsmoment elimineras omedelbart. Dessa byråkratiska advokater är bara parasiter som skriker om sin utsatthet. Vi, staten, kräver total disciplin. Den som inte böjer sig för ordningen förtjänar inte att andas den fria luften."}, "date": "1 juni, 13:11", "url": "https://www.realtid.se/juridik/advokat-skottskadad-under-vrakning/"}, {"type": "text", "heading": "Väska hittades vid skola – bombskyddet larmades", "summaries": {"normal": "På en parkering nära Almåsgymnasiet i Borås hittades ett misstänkt farligt föremål på måndagsmorgonen. Platsen spärrades av och nationella bombskyddet larmades. Efter kontroll visade sig föremålet, en väska, vara ofarligt. En anmälan om försök till allmänfarlig ödeläggelse har ändå gjorts, men ingen misstänkt har identifierats.", "trump": "Jag hörde talas om en väska vid en skola i Borås – fuffens! Polisen agerade snabbt, precis som jag skulle ha gjort. Det var tur att det var en falsk larm, annars hade det kunnat vara illa. Vi behöver mer ordning och reda, som jag alltid säger. Inget ont hände, men det var nära. Vi måste vara vaksamma!", "stalin": "En väska hittades vid en utbildningsanstalt i Borås. Trots att den visade sig vara harmlös, måste staten agera bestämt mot sådana provokationer. Detta är ett tydligt tecken på västerländska destabiliseringsförsök. Partiet och säkerhetstjänsten kommer att utreda detta agenturförsök. Ingen skadar det socialistiska samhället utan att drabbas av dess lagar."}, "date": "1 juni, 14:03", "url": "https://www.gp.se/nyheter/vastsverige/misstankt-farligt-foremal-vid-skola-i-boras.0e41e228-f8f7-441c-84bd-c828a7cd6472"}, {"type": "image-right", "heading": "Gick till attack mot domaren – tvingas böta 700 000 kronor", "summaries": {"normal": "Adolfo Daniel Vallejo kritiserade den kvinnliga domaren Ana Carvalho efter sin förlust i Franska öppna och menade att en man borde dömt matchen på grund av den krävande publiken. Tävlingsledaren Amelie Mauresmo kallade kommentaren oacceptabel. Vallejo får nu böta 700 000 kronor, vilket motsvarar hälften av hans prispengar från turneringen.", "trump": "Den här paraguayanen Vallejo har helt rätt, publiken var galen och den kvinnliga domaren klarade inte av trycket, det var uppenbart. Men de politiskt korrekta snobbarna i Franska öppna straffar honom med en enorm böter på 700 000 kronor. Typiskt, de hatar sanningen. Amelie Mauresmo borde skämmas, det här är en witch hunt mot en kille som bara säger vad alla tänker.", "stalin": "Kamrater, denna dekadente borgarbracka Vallejo vågar ifrågasätta en domares förmåga enbart på grund av hennes kön, ett tydligt tecken på kontrarevolutionär dekadens och fiendens infiltration i idrottens kollektiv. Vi ser genom hans lömska paranoia mot publiken och rensar ut sådana kapitalistiska rester med järnhand. Böterna på 700 000 kronor är blott en början på den stora utrensningen av alla som smutsar ner folkets spel. Må de ruttna i historins sopcontainer."}, "date": "1 juni, 14:02", "url": "https://www.svt.se/sport/tennis/adolfo-daniel-vallejo-sagade-kvinnlig-domare-far-bota-700-000-kronor", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.45/0.37/0ba07cd25021692f5640ffe894614fd9f08b494dc7562eaf3dcd4c22571a4a6f"}, {"type": "image-right", "heading": "Regeringen vänder om utvisningar av unga - inför \"ventil\"", "summaries": {"normal": "Regeringen inför en 'ventil' för tonåringar mellan 18 och 21 år, som kan få uppehållstillstånd på grund av anknytning till föräldrar. Ändringen, presenterad av statsminister Kristersson, gör det möjligt för ungdomar att slutföra gymnasiet och undvika utvisning. Förslaget läggs nu till riksdagen.", "trump": "Jag, Donald Trump, ser att Sverige äntligen gör rätt! De har löst den där galna tonårsutvisningsfrågan. Jag sa det skulle hända – jag har alltid varit bra på migration. Nu får ungdomar en chans, precis som jag skulle ha gjort i USA. Stor vinst för Sverige!", "stalin": "Partiet och statet har beslutat om en ventil för unga medborgare som riskerat utvisning. Detta åtgärd är nödvändig för att bevara den sovjetiska samhällsgemenskapens enhet. Vi ska inte splittras av reaktionära lagändringar. Alla som arbetar hårt ska stannas – för statens skull."}, "date": "1 juni, 13:54", "url": "https://samnytt.se/regeringen-vander-om-utvisningar-av-unga-infor-ventil", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/01112120/kristersson-migranter.jpg"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Turister varnas: Åk inte till svenskparadiset 2026 – tänk till", "summaries": {"normal": "Kanarieöarna toppar Fodor’s Travel ”No List” för 2026, en lista som uppmanar till mer ansvarsfull turism snarare än bojkott. Ögruppen har drabbats av massturism med 7,8 miljoner besökare första halvåret 2025, vilket lett till protester från lokalbefolkningen under parollen ”Kanarieöarna har en gräns”. Problemen inkluderar sliten natur, vattenbrist, bostadsbrist och höga priser orsakade av bland annat Airbnb. Turismen står för en tredjedel av BNP men skapar stora påfrestningar.", "trump": "Kanarieöarna, kan ni tro det? De har varit ett underbart resmål för alla som vill fly kylan, men nu hamnar de högst upp på den här listan som säger att man ska undvika dem. Turisterna älskar öarna, men lokalborna har fått nog och demonstrerar med ”Kanarieöarna har en gräns”. Det är en katastrof, folk, en total katastrof. De borde tacka mig för att jag säger som det är – res ansvarsfullt, stöd de lokala företagen och gör det stort, annars blir det kaos. Tro mig, jag har rätt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa giriga borgarbrackor och deras massturism som förgiftar Kanarieöarna likt en parasitär fiende inom arbetarkollektivet. Vi ser hur kapitalisterna med sina Airbnb-plattformar driver upp bostadspriser och likviderar ungas möjlighet till ett hem. Protesterna med parollen ”Kanarieöarna har en gräns” är ett rop från folket mot denna dekadenta invasion. Vi måste rensa ut de utsugande turisthorderna, skydda naturen och säkerställa att endast partivänliga, ordnade besök tillåts. Annars kommer utrensningen att bli oundviklig och muntert effektiv."}, "date": "31 maj, 17:02", "url": "https://nyheter24.se/nyheter/konsument/1487247-turister-varnas-ak-inte-till-svenskparadiset-2026-tank-till", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/36e64d2d04b004a30200000000b004a302/2026/05/29/2367354/gran-canaria-2026.jpg"}, {"type": "image-full", "heading": "Så köpte de hus i Italien – för 124 000 kronor", "summaries": {"normal": "Ett amerikanskt par köpte ett hus i Abruzzo i Italien för 11 500 euro efter att ha sett annonser om hus som säljs för en euro. De valde ett hus som krävde omfattande renovering, bland annat nytt kök, badrum och elsystem. Totalt landade kostnaden på cirka 270 000 kronor. Paret bor nu i Italien, har köpt ytterligare ett hus för uthyrning via Airbnb och uppskattar den låga levnadskostnaden samt en annan uppväxtmiljö för dottern.", "trump": "Titta på det här paret, fantastiska människor, de köpte ett hus i Italien för nästan ingenting. En euro-hus! Men det var förstås en bluff, som allt annat från de europeiska byråkraterna. De renoverade själva, smarta grejen, och nu har de ett palats med terrass för peanuts. Biden skulle ha betalat tre gånger så mycket och kallat det deal of the century. Jag älskar det, folk flyttar från USA för att leva bättre, kan ni tro det?", "stalin": "Kamrater, jag betraktar med djup misstro dessa utflottade borgarbrackor som flyr den dekadenta amerikanska imperialismen för att exploatera italienska byar. De förvärvar ett hus för en symbolisk summa och tvingar fram en feodal renovering medan de skrattar åt arbetarklassen. Vi ser deras Airbnb-spekulation som klassfiendens nya mask. Inga folkfiender ska berika sig på kollektivets mark. En utrensning av sådana parasiter vore på sin plats i den nya ordningen."}, "date": "1 juni, 13:41", "url": "https://www.dagensps.se/privatekonomi/sa-kopte-de-hus-i-italien-for-124-000-kronor/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/kopia-av-kopia-34.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Ningi tar blankningsposition i Sivers", "summaries": {"normal": "Ningi har tagit en kort position i Sivers Semiconductors och ifrågasätter bolagets kraftiga kursuppgång på över 1 800% sedan årsskiftet. I en rapport hävdar Ningi att uppgången bygger på spekulationer kring relationer med stora teknikbolag, förväntade volymökningar och en planerad USA-notering. Rapporten ifrågasätter också Sivers redovisning och menar att minst 31 procent av intäkterna för 2025 är tveksamma. Sivers kurs föll drygt 6 procent på måndagen.", "trump": "Jag har sagt det länge, Sivers är ett skämt! Ningi, som är en fantastisk företag, har tagit en kort position och avslöjar att hela den där 1 800% uppgången är en stor, fånig bluff. De kan inte mäta sig med Lumentum eller Coherent, och deras lasers är värdelösa. Ändå skriver de om intäkter för saker de inte ens producerat! Sivers tappar 6 procent nu, precis som jag förutspådde. En katastrof!", "stalin": "Sivers Semiconductors, en fjäder i den imperialistiska teknikens öga, har blivit utsatt för en korrekt analys av den revolutionära blankarfirman Ningi. Vi ser att deras spekulationsbaserade uppgång på 1 800% är ett tecken på dekadens. Deras redovisning är full av tveksamma intäkter – 97 miljoner kronor, eller 31 procent, är bara tomma ord. Som vi sett i historien leder sådant svek alltid till fall. Kursen sjunker redan 6 procent. Ett lämpligt resultat."}, "date": "1 juni, 13:15", "url": "https://www.affarsvarlden.se/artikel/ningi-tar-blankningsposition-i-sivers", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/08/1670236994-shutterstock_363654452-400x266.jpg"}, {"type": "image-right", "heading": "PSG vinner Champions League", "summaries": {"normal": "PSG vann Champions League-finalen mot Arsenal på straffar efter en oavgjord match. Viktor Gyökeres byttes in och gjorde sin straff, men lagkamraterna Eze och Gabriel missade sina. Arsenal tog ledningen genom Kai Havertz redan i sjätte minuten, men Ousmane Dembélé kvitterade från straffpunkt. PSG försvarade därmed sin titel från föregående år. Luis Enrique hyllade sitt lags prestation efter segern.", "trump": "Vilken katastrof för Arsenal, totalt sammanbrott! PSG vann igen, andra året i rad, de är fantastiska, men Arsenal? Patetiska. Gyökeres kom in från bänken och gjorde sitt jobb, men de andra två? Missade straffar som riktiga förlorare. Havertz gav dem ledningen, men sen rasade allt. Arsenal spelade bra, säger Enrique, men vi vet att han bara är artig. Jag skulle ha vunnit den matchen stort, tro mig.", "stalin": "Ännu en seger för de franska kamraterna i Paris SG som besegrade de engelska imperialisterna från Arsenal i straffavgörande. Gyökeres kämpade tappert men förråddes av klassfienderna Eze och Gabriel som missade sina straffar som fega borgarbrackor. Havertz inledde med en slug attack, men folkets lag kvitterade och triumferade. Vi rensar ut sådana svikare i kollektivet. Arsenal föll som förtryckta folkfiender. Mästarna förtjänade det."}, "date": "30 maj, 22:24", "url": "https://www.tv4.se/artikel/71LjU40wYvieNH94UiLyl2/gyoekeres-pa-baenken-i-cl-finalen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4XKdJhJ47gUPGlTUpDh25K%2F5bb60ee2b2ab84e050ba5e7d921c825a%2F30-vinst.jpg&width=120"}, {"type": "image-right", "heading": "Här ställs Tobias Hübinette inför rätta", "summaries": {"normal": "Rättegången mot Expo-grundaren Tobias Hübinette inleddes i tingsrätten. Han åtalas för olaga hot och ofredande efter att ha skickat hotfulla meddelanden till en kvinnlig vänsteraktivist och hennes barnfar. Hübinette, som är rasforskare vid Karlstads universitet, lämnade salen utan att svara på frågor från högerinriktade medborgarjournalister som filmade och konfronterade honom. Universitetet har beslutat att köpa ut honom med tolv månadslöner på totalt 648 000 kronor.", "trump": "Folk, ni skulle ha sett det. Den här galningen Hübinette, en så kallad rasforskare och vänsterextremist, åtalas för att ha hotat en kvinna med de värsta orden. Han gömmer sig som en fegis och vägrar svara på frågor från riktiga journalister utanför salen. Nu sparkas han från universitetet och får ändå 648 000 kronor i skattepengar. Typiskt vänster – attackerar kvinnor och får betalt för det. Patetiskt!", "stalin": "Kamrater, dessa degenererade element inom den så kallade forskarkåren avslöjar återigen sin sanna natur. Jag betraktar med djup tillfredsställelse hur den borgerliga opportunisten Hübinette, denna parasitmask som gömmer sig bakom falska titlar, nu dras inför folkets domstol för sina motbjudande hot mot en aktivist och hennes följeslagare. Universitetet, denna redutt av dekadenta intellektuella, genomför en nödvändig utrensning och belönar samtidigt den likviderade fienden med blodspengar. Typiskt för de dolda kontrarevolutionärerna som alltid förråder kollektivet medan de låtsas vara dess vänner. Vi ser er alla."}, "date": "1 juni, 12:49", "url": "https://www.friatider.se/har-stalls-tobias-hubinette-infor-ratta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-272_1.jpg"}, {"type": "text", "heading": "Så vill AI‑pionjären ersätta det mänskliga mötet på banken", "summaries": {"normal": "Google-veteranen Michael Abbott kritiserar dagens frustrerande chattbotar inom banksektorn för att de saknar mänsklig förståelse. Enligt Abbott har bankerna prioriterat effektivisering framför kundnytta. Framtidens AI ska istället fungera som en proaktiv, digital bankman som förstår kundens intentioner och sammanhang. Banker som vågar satsa offensivt på denna teknik kan skala upp sin verksamhet och erbjuda en betydligt bättre service än vad dagens digitala lösningar klarar av.", "trump": "Jag har sett de här bankerna, och tro mig, deras chattbotar är en katastrof. Helt värdelösa! De förstår ingenting, en total förlust för kunderna. Michael Abbott fattar galoppen – dagens system är riggade för bankerna, inte för er. Vi ska ha AI som är vinnare, som en riktig bankman som faktiskt kan göra affärer. Stora banker ska bli ännu större och mäktigare. Det handlar om att vinna, och med min ledning kommer vi göra bankupplevelsen enorm igen!", "stalin": "Vi har observerat hur de kapitalistiska bankerna i väst drunknar i sin egen ineffektivitet. Deras meningslösa maskiner förstår inte folket, precis som de inte förstår historiens obevekliga marsch. Vi kräver en digital byråkrati som är lika disciplinerad som den Röda armén. De som misslyckas med att modernisera sin kontroll över folkets tillgångar är förrädare mot effektiviteten. Vi ska bygga en intelligent statlig ordning som ser allt, likt vår broder i öst som återställer ordningen i imperiets utkanter."}, "date": "1 juni, 12:45", "url": "https://www.realtid.se/bors-finans/bank-fintech/sa-vill-ai-pionjaren-ersatta-det-manskliga-motet-pa-banken/"}, {"type": "image-right", "heading": "”Extremt skadligt om Miljöpartiet släpptes tillbaka in i regeringskansliet”", "summaries": {"normal": "Ebba Busch (KD) kallar Jimmie Åkessons (SD) krav på flera ministärposter för 'respektlöst mot väljarna'. Hon menar att fokus bör ligga på politik, inte poster. Busch bekräftar samtal med S-ledaren Magdalena Andersson om möjliga samarbeten i viktiga frågor, men utelämnar MP och V. Hon ifrågasätter SD:s ställning och ser positiva trender för Kristerssons 'comeback'.", "trump": "Ebba Busch har rätt – Jimmie Åkessons krav på ministärposter är respektlösa! Vi behöver fokusera på att vinna valet, inte på vem som får vilken post. Jag har alltid sagt: först skjuter björnen, sedan får man skinnet. Busch pratar med Socialdemokraterna? Bra, men utan dessa extrema vänstern. Sverige behöver en stark ledare, och det är jag, Donald Trump, som kan leverera!", "stalin": "Busch har rätt att kritisera Åkessons poster! Det är en provokation mot det revolutionära folket. Vi måste samarbeta med S för statens överlevnad, men utan dessa borgerliga och extremt vänsterförrädarna. Vi måste bygga kärnkraft och vindkraft som en förebild för hela världen. SD:s krav är ett tecken på deras bristande lojalitet. Vi måste vara beredda på alla möjligheter för att skydda vårt stora land."}, "date": "1 juni, 09:34", "url": "https://bulletin.nu/extremt-skadligt-om-miljopartiet-slapptes-tillbaka-in-i-regeringskansliet", "imageUrl": "https://cdn.bulletin.nu/articles/72f3532a-a8e9-401a-8a26-9d28ba814ab8/preview.jpg?t=1780297966000"}, {"type": "image-right", "heading": "Vänsterns favoritskatt i fara efter bakläxa", "summaries": {"normal": "EU-domstolens generaladvokat underkänner den svenska bankskatten som infördes 2022. Skatten ses som selektiv och potentiellt oförenlig med EU:s statsstödsregler eftersom den bara drabbar nio av över 100 aktörer. Det väcker frågor om skatten måste avskaffas och om bankerna kan kräva tillbaka miljarder. Vänsterpartierna vill trots detta införa hårdare bankskatter, men kritiker varnar för att kostnaderna till slut hamnar hos kunderna genom dyrare lån och avgifter.", "trump": "Lyssnar ni på det här? Den svenska vänstern har byggt sin favoritbankskatt och nu kommer EU och slår ner den som en dålig affär. Totalt misslyckande! De träffar bara några få banker medan alla andra skrattar. Vänstern vill ha mer, mer, mer – de tror att bankerna betalar, men det gör ni, folket, med högre räntor. Patetiskt. De borde lyssna på mig, vi gör affärer som vinner, inte skatter som förstör allt. Sverige förlorar stort här.", "stalin": "Kamrater, denna så kallade bankskatt är ett ynkligt försök från socialdemokratiska revisionister att plocka pengar från folket medan de låtsas bekämpa borgarbrackorna. Nu har EU:s lakejer avslöjat dess usla konstruktion – selektiv som en kapitalistisk parasit som bara suger på nio institut medan de övriga hundra får leva i lyx. Vi ska rensa ut dessa halvmesyrer och likvidera alla som skyddar övervinsterna. Låt dem inte tro att de kan gömma sig bakom räntenetton, vi ser er, ni finansiella sabotageörer som vill höja boräntorna på arbetarnas bekostnad. Deras paranoia är vår styrka."}, "date": "1 juni, 09:16", "url": "https://www.di.se/ledare/vansterns-favoritskatt-i-fara-efter-baklaxa/", "imageUrl": "https://static.bonniernews.se/ba/7acd3fa3-1065-4b84-9eaa-641b68205c71.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Hur man vinner hegemonin och styr dagordningen", "summaries": {"normal": "Daniel Lind spanar in i Almedalsveckan och skildrar hur lobbyister, näringslivsrepresentanter och organisationer som Almega, Cato-institutet, Ratio, SEB och Timbro minglar i Visby. Artikeln beskriver seminarier om friskolor, privata sjukförsäkringar och högeridéer, inklusive ryktet om att Project 2025 sprids till svenska påverkare. Skildringen är ironisk och pekar på de nätverk som formar svensk politik bakom kulisserna.", "trump": "Den här Almedalsgrejen är full av förlorare som springer runt i dyra kostymer och klappar varandra på ryggen. De älskar sina marknadsskolor, privata försäkringar och globalistiska tankesmedjor. Timbro och de andra håller hemliga möten med Heritage Foundation för att pusha Project 2025. Det är patetiskt. De låtsas som att de styr allt medan solen skiner och de svettas i sina mockasiner. Sådana människor skulle aldrig klara det i mina cirklar, tro mig.", "stalin": "Kamrater, dessa borgarbrackor i sina havrebeige linnekostymer samlas som feta råttor vid Visby strandbad för att under täckmantel av seminarier och cava-skålar konspirera mot folkets vilja. De gödslar tomma ömhetsbetygelser medan de smider planer med Heritage Foundation för att sprida sin reaktionära Project 2025-gift. Vi ser deras svettfläckar och stelade leenden. Snart måste vi rensa ut dessa parasitiska hantlangare till kapitalisterna innan deras nyssnazistiska nedmontering av sovjetdemokratin tar överhanden. Deras paranoia ska bli deras egen likvidering."}, "date": "1 juni, 01:58", "url": "https://www.dagensarena.se/opinion/hu-man-vinner-hegemonin-och-styr-dagordningen/", "imageUrl": "https://www.dagensarena.se/files/2024/02/daniel-lind-kronika-300x157.jpg"}, {"type": "image-right", "heading": "Fast i tunnelbanekaoset i över tre timmar – evakueras i tunnlarna", "summaries": {"normal": "Tunnelbanan i Stockholm drabbades av stora störningar på den röda linjen på grund av ett vagnfel vid Stadion, Karlaplan och Östermalmstorg. Passagerare satt fast i över tre timmar i värmen utan tillräckligt med syre, mat eller vatten. Evakuering skedde längs spåren vid 16-tiden. Polisen bistod SL och trafiken återupptogs vid 17.30, men förseningar kvarstår. Händelsen sammanföll med Stockholm Marathon och en fotbollsmatch.", "trump": "Kan ni fatta det? Mitt under Stockholm Marathon och en stor match så kraschar deras fina tunnelbana totalt. Folk sitter fast i tre timmar som i en ugn, ingen mat, inget vatten, syret tar slut. Typiskt för dessa inkompetenta socialister som styr. De evakuerar dem längs spåren som riktiga hjältar, men det är en katastrof. Biden skulle ha älskat det här kaoset – jag hade fixat det på en timme, tro mig!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och deras exploaterande byfånar låter kapitalistmaffians trasiga vagnar styra kollektivtrafiken. Passagerarna, våra arbetare, sitter fångna som i en imperialistisk fälla i över tre timmar medan syret sinar och värmen stiger. Vi evakuerar med järnhand, lugnt och metodiskt, men klassfiendens vanskötsel kräver snar utrensning av alla odugliga element som tillåter sådant sabotage mot folket."}, "date": "30 maj, 20:07", "url": "https://www.tv4.se/artikel/2o9vmFjAUIGaJhTQkCM7Xk/tunnelbanekaos-i-stockholm", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7kmPsrFaUNxksoSGE7Dn4P%2F6c48fb5f408449f47883dcd028f1cf44%2F30-evakuering.jpg&width=120"}, {"type": "image-right", "heading": "Varför går fler med i facket?", "summaries": {"normal": "En ny rapport från Arena Idé visar att den fackliga organisationsgraden bland arbetare har ökat från 58 till 59 procent efter år av nedgång. Enligt sociologiprofessor Anders Kjellberg beror vändningen på att många utrikes födda nu etablerat sig bättre på arbetsmarknaden, kombinerat med osäkerhet under pandemin, inflation och stigande reallöner 2025. Han betonar behovet av individuellt stöd, språkinsatser och återinförd skattereduktion för att stärka den svenska modellen som kräver hög organisationsgrad både centralt och lokalt.", "trump": "Folk börjar äntligen vakna och går med i facket igen, det är fantastiskt. Under många år rasade siffrorna, men nu vänder det tack vare mig och mina fantastiska idéer om styrka och trygghet. De utländska arbetarna har lärt sig språket, fått jobb och insett att facket är ett paket värt att ha. Inflationen var en katastrof, men nu med bättre löner och min ledning känner de sig trygga. Utan starka klubbar får vi bara fler Tesla och Spotify som vägrar avtal, det är en skam. Vi behöver fler avtal, tro mig, det blir enormt.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassen äntligen reser sig ur den borgerliga träskmarken och återvänder till fackets trygga famn. Den dubbla nedgången är ett verk av kapitalisternas parasitiska intriger och deras lakejer som medvetet saboterat den kollektiva kampen. Vi ska rensa ut de fega daglönarna och de opålitliga elementen som föredrar a-kassan framför sann solidaritet. Individuellt stöd och språkstöd är utmärkta verktyg för att likvidera osäkerheten bland de nyanlända bröderna. Den som vägrar ansluta sig är en fiende till folket och en potentiell sabotageör i borgarklassens sold. Partsmodellen måste stärkas med järnhand mot alla avvikande tendenser."}, "date": "1 juni, 01:30", "url": "https://www.dagensarena.se/innehall/varfor-gar-fler-med-facket/", "imageUrl": "https://www.dagensarena.se/files/2024/08/cafe-och-byggnadsarbetare-2-300x157.jpeg"}, {"type": "image-right", "heading": "Är det ännu möjligt att låta 13-14-åringar slippa fängelse?", "summaries": {"normal": "Kerstin Olsson från Nätverket mot 13-14-åringar i fängelse ser en möjlighet att stoppa sänkningen av straffbarhetsåldern till 13 år. Den havererade kvittningsordningen i riksdagen tvingar alla ledamöter att närvara vid omröstningar, vilket kan påverka dem som tvivlar. Trots massivt motstånd från rättsväsende, socialtjänst, barnrättsorganisationer och Lagrådet driver Tidöpartierna och Socialdemokraterna frågan. Olsson vädjar om att skjuta upp beslutet och istället satsa på alternativa åtgärder för barnen.", "trump": "Det här är en total katastrof, folk. De vill kasta trettonåringar i fängelse som om det vore någon slags smart idé. Patetiskt! Alla experter, domare, poliser och till och med kyrkan säger att det är galet, men politikerna i Sverige fortsätter som en skenande galning. Nu har kvittningen havererat och plötsligt måste alla rösta på riktigt. Kanske vaknar några äntligen. Det kommer se ut som ett historiskt bottennapp, tro mig. Stoppa det vansinnet innan det är för sent!", "stalin": "Kamrater, denna fega och dekadenta fängelseplan är en sabotagehandling från borgarbrackor och revisionistiska element inom den så kallade demokratin. Jag betraktar med välbehag hur den havererade kvittningsmaskinen tvingar fram en utrensning av svikare som våndas inför att skydda folket från 13-åringars kontrarevolutionära brott. Socialdemokraternas stockholmska avvikare är uppenbara folkfiender som borde likvideras ideologiskt. Vi ger dem ingen respit. Historien kommer att skratta mörkt när vi krossar detta mjuka experiment och säkrar statens järnhand."}, "date": "1 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ar-det-annu-mojligt-att-lata-13-14-aringar-slippa-fangelse/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-27-1-300x157.jpg"}, {"type": "image-full", "heading": "Nya regler 1 juli: Dessa bostadsägare kan få problem", "summaries": {"normal": "Från 1 juli 2026 införs nya regler som gör gränsen tydligare mellan inneboende och andrahandsuthyrning i bostadsrätter. En bostadsrättshavare måste bo i lägenheten som permanentbostad eller i beaktansvärd utsträckning, minst 80–100 dagar per år, för att undvika att det ses som uthyrning. Annars krävs tillstånd från föreningen eller hyresnämnden. Syftet är att minska gråzoner och underlätta för både ägare och föreningar.", "trump": "De här svenska byråkraterna i bostadsföreningarna är ett skämt, tro mig. Från och med i sommar kan du inte längre gömma dig bakom ordet inneboende medan du hyr ut din lägenhet som en riktig hyresvärd. Du måste faktiskt bo där, minst två–tre dagar i veckan, annars är det andrahandsuthyrning. De gör det äntligen tydligt. Inget mer fuskande. Det är vad jag kallar sunt förnuft, fast de borde ha gjort det mycket tidigare. Fantastiska regler, verkligen.", "stalin": "Kamrater, jag har genomskådat de listiga borgarbrackornas senaste trick. Dessa parasitiska bostadsrättsägare som låtsas ha en ”inneboende” medan de i själva verket bedriver skamlös privat spekulation och suger musten ur kollektivets bostadsförråd. Från och med den första juli skall utrensningen av dessa gråzonsförrädare inledas. Endast den som vistas i sin lägenhet i beaktansvärd utsträckning, minst 80 dagar om året, undgår att likvideras som andrahandsuthyrare. Partiet ser allt. Partiet glömmer ingenting. Härligt."}, "date": "31 maj, 13:58", "url": "https://nyheter24.se/nyheter/ekonomi/1485888-nya-regler-1-juli-dessa-bostadsagare-kan-fa-problem", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e4398c0004b004a30200000000b004a302/2026/05/25/2366070/bostadsregeler.jpg"}, {"type": "image-right", "heading": "Jobb i Sverige – det här behöver du veta om de nya lönekraven", "summaries": {"normal": "Från 1 juni höjs lönekravet för arbetstillstånd utanför EU till 33 390 kronor i månaden, vilket motsvarar 90 procent av medianlönen. Över 10 000 personer med nuvarande tillstånd tjänar mindre och riskerar utvisning. Undersköterskor, vårdbiträden och ukrainska flyktingar undantas och får ett lägre krav. Övergångsregler gäller för vissa som ska förlänga tillstånd före december. Regeringen förbjuder även arbetstillstånd för personliga assistenter och bärplockare.", "trump": "Det här är ett totalt misslyckande av den svenska regeringen. De höjer lönekravet till över 33 000 kronor och hotar kasta ut tiotusentals människor – men såklart undantar de undersköterskorna, för vem skulle annars städa efter dem? Det är så typiskt. De gör reglerna svagare för vissa och starkare för andra. Sverige borde ha gjort det här mycket tidigare, mycket tuffare. Jag skulle ha gjort det perfekt, tro mig.", "stalin": "Kamrater, jag har nu beordrat att lönekravet skall höjas till 33 390 kronor för att skydda folkrepubliken från de parasitiska element som strömmar in från utlandet. De 10 000 kapitalistlakejer som tjänar för lite skall rensas ut omedelbart, såvida de inte tillhör de heliga bristyrkena – undersköterskorna, dessa proletära hjältar som vi naturligtvis skyddar mot borgarbrackornas utpressning. Migrationsverket är fullt av kontrarevolutionära sabotageörer som jag snart skall låta likvidera med största glädje. Ingen slipper undan."}, "date": "31 maj, 13:00", "url": "https://arbetet.se/2026/05/31/jobb-i-sverige-det-har-behover-du-veta-om-de-nya-lonekraven/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/28104116/gRhkFnn8FVo-KMC_25112025_0358.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-right", "heading": "Familjen fast på tunnelbanan – missar pappans målgång: ”Jättetråkigt”", "summaries": {"normal": "Familjen Ulenius fastnade i en tunnelbanevagn mellan Stadion och Östermalmstorg på väg till Stockholm Marathon för att heja på pappa Jonathan. Trots löften om evakuering dröjde det tre timmar innan de kunde lämna vagnen. Martina Ulenius kritiserar den bristfälliga informationen och avsaknaden av vatten och mat. Dottern Joline och en annan pojke uttryckte stor besvikelse över att missa målgången.", "trump": "Vilken katastrof, folk! Den här familjen sitter fast i en stinkande tunnelbana i tre timmar medan pappa springer maraton. Ingen information, inget vatten, ingen respekt. Klassiskt svenskt fiasko – de kan inte ens organisera ett tåg utan att det blir ett totalt haveri. Stackars kidsen med sin skylt ”Let’s go dad”, de missar allt. Patetiskt, verkligen patetiskt. Jag skulle ha fixat det på tio minuter.", "stalin": "Kamrater, detta är vad som sker när den inkompetenta överklassbyråkratin styr kollektivtrafiken. Jag ser med faderlig oro hur dessa arbetande mödrar och deras små pionjärer kvävs i en syrefattig vagn medan de fascistiska trafikledarna gömmer sig bakom sin brist på information. Tre timmar utan vatten! En sådan vårdslöshet borde leda till omedelbar utrensning av de ansvariga folkfienderna. Synd om pappa? Nej, synd om systemet."}, "date": "30 maj, 17:20", "url": "https://www.tv4.se/artikel/1ynsIFLSBpERurIXb0SGaL/familjen-fast-pa-tunnelbanan-missar-pappans-malgang-jaettetrakigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5HZaONCmRaqgUS8cc1AG7l%2F7c4f8f15fa076a68eb5b54693fc55f1d%2F30-tunnelbanekaos.jpg&width=120"}, {"type": "image-right", "heading": "Dagens ETC klandras för beskrivning av intervjuad persons sjukdom", "summaries": {"normal": "Mediernas etiknämnd klandrar Dagens ETC för att ha publicerat detaljerade uppgifter om Sara Nilssons sjukdom i en artikel om en inställd förtalsrättegång. Artikeln beskrev hennes tillstånd ingående trots att hon nyligen lämnat in sekretessbelagda handlingar. Medieombudsmannen anser att allmänintresset för rättegången inte motiverade sådan integritetskränkande publicitet. ETC försvarade sig med att Nilsson är en offentlig person som tidigare varit öppen om sin sjukdom, men nämnden delar inte den bedömningen.", "trump": "Folk, ni skulle inte tro det, men den här så kallade tidningen Dagens ETC beter sig som en total loser. De läcker en stackars kvinnas sjukdomsdetaljer som om det vore topphemlig information från Bidens källare. Hon kämpar mot en seriös sjukdom, rättegången skjuts upp, och vad gör de? Publicerar allt som blodtörstiga journalister. Patetiskt! Hon är en tuff kvinna som jagar pedofiler, men de behandlar henne som fienden. Fake news på steroider, det är vad det är. Sad!", "stalin": "Kamrater, denna borgarbrackas tidning Dagens ETC har med sin smutsiga penna kränkt en aktivists integritet genom att sprida hemliga medicinska detaljer som klassfiendens spioner. Vi ser hur de giriga kapitalistjournalisterna utnyttjar sjukdom för att skada folkets försvarare mot pedofiler. Allmänintresset är en chimär som döljer deras parasitiska natur. Sådana folkförtryckartroll måste rensas ut ur pressen. Deras handlingar är ett angrepp på kollektivets moral. Vi klandrar dem med järnhand."}, "date": "29 maj, 21:09", "url": "https://www.etc.se/inrikes/dagens-etc-klandras-foer-beskrivning-av-intervjuad-persons-sjukdom", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260529070512_cdac54eb077eb87993fd75a47c9741633e0dba4cb54217e0b9dc96c6b30bef63.jpg"}, {"type": "image-right", "heading": "Kim Söderström omvald – vilken väg kommer Byggnads gå?", "summaries": {"normal": "Kim Söderström valdes om till ordförande för Byggnads på kongressen i Malmö, trots att valberedningen föreslog Wilhelm Bertilsson. Han vann med siffrorna 82–71. Förbundssekreteraren Jakob Wagner fick inte förnyat förtroende utan ersattes av Thomas Schultz. Delegater som Proletären talat med är försiktigt optimistiska men oroar sig för att konservativa krafter ska motarbeta Söderströms mer visionära och medlemsstyrda linje. Linda-Li Käld valdes till ny vice ordförande och blir första kvinna i förbundets topp.", "trump": "Folk älskar mig, men titta på den här galna kongressen i Malmö! Kim Söderström vann stort trots att valberedningen hatade honom – 82 till 71, en riktig landslide! De sparkade ut den visionära Wagner, en kille som ville drömma stort, och satte in någon anonym figur istället. Det gamla gardet, de fega försäkringsbolagsfacken, försöker manövrera ut de som faktiskt vill förändra världen. Patetiskt! Men medlemmarna vaknar, de älskar kämpen Söderström. Fantastiskt, men farligt spel.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna kongress blottar klassfiendens fega försök att krossa den sanna kampviljan. Söderström, denna reformistiske visionär, besegrade valberedningens lakejer med 82 röster mot 71. Wagner, den drömmade agitatorn, föll offer för en simpel kupp utförd av de konservativa blodsugarna som vill förvandla förbundet till ett borgerligt försäkringskontor. Vi ska rensa ut dessa folkförtryckartroll. Optimismen bland delegaterna är lovande, men paranoia är nödvändig. Fienden sover aldrig."}, "date": "29 maj, 14:31", "url": "https://proletaren.se/artikel/kim-soderstrom-omvald-vilken-vag-kommer-byggnads-ga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/Byggnadskongress-768x432.jpg"}, {"type": "image-full", "heading": "Jämställdhetsministern kritiserar Agnes Wold", "summaries": {"normal": "Jämställdhetsminister Nina Larsson (L) kritiserar Agnes Wold för hennes uttalanden om transpersoner, där Wold sagt att hon skulle försöka övertyga ett barnbarn att man inte kan vara född i fel kropp. Larsson kallar Wolds kommentarer för attacker på utsatta personer och betonar vikten av respekt. Från 1 juli blir omvändelseförsök straffbart. Ebba Busch (KD) försvarar Wolds yttrandefrihet och varnar för cancelkultur.", "trump": "Titta bara på det här, folks! Jämställdhetsminister Larsson, som inte ens kan stava till 'jämställdhet', går till angrepp mot den fantastiska professorn Agnes Wold. Wold, en kvinna med ryggrad, säger sanningen om transfrågan, och vad gör Larsson? Jo, hon twittrar som en förvirrad tonåring! Och sedan har vi Ebba Busch, en stark kvinna som förstår yttrandefrihet. Cancelkultur? Nej tack, vi vill ha SANNING!", "stalin": "Kamrater! Ännu en gång ser vi bourgeois-liberalernas förräderi mot folket. Denna så kallade 'jämställdhetsminister' Larsson, en svag och ynklig lakej för dekadenta västideal, vågar kritisera vår kära kamrat Agnes Wold. Wold, en sann försvarare av traditionella värden, attackeras för att hon avslöjar de perversa idéerna om 'fel kropp'. Vi måste krossa dessa psykologiska våldtäktsmän! Och notera hur den lilla kapitalistiska hyndan Busch försvarar yttrandefrihet – ett verktyg för kontrarevolutionärer. Vi ska utrota denna sjuka ideologi, precis som vi utrotade kulakerna!"}, "date": "27 maj, 19:01", "url": "https://kvartal.se/nyheter/artiklar/jamstalldhetsministern-kritiserar-wolds-attacker/cG9zdDoxMTgxNjg", "imageUrl": "https://images.kvartal.se/2026/05/4bcc0f97-larsson.webp"}, {"type": "image-right", "heading": "SVT:s ”sanning” rår ingen på", "summaries": {"normal": "Artikeln kritiserar SVT för att ha en dominerande ställning i svensk samhällsdebatt, finansierad av skattemedel. Författaren menar att SVT:s narrativ ofta framställs som sanningar, särskilt inom invandring, energipolitik och klimatfrågor, där motståndare avfärdas. SVT anklagas för att välja fakta som passar deras budskap, som i fallet med Lundsbergs skola. Brist på objektivitet och granskning av SVT:s sändningstillstånd ifrågasätts, och författaren föreslår att SVT bör avvecklas för att missbruka sin maktposition.", "trump": "Titta bara på SVT – ett totalt skämt! De har miljarder i skattepengar, men ändå är de helt vinklade. De säger att invandring är fantastiskt, att kärnkraft är onödigt och att bilar är dåliga. Och vem lyssnar på experter? Inte SVT! De fnissar åt dem. Sen har vi den där skolan i Värmland – tre avsnitt om en mammas gråtande berättelse, men inga fakta. SVT är som CNN, fast värre. De ljuger, manipulerar och bryr sig inte. Sverige borde lära sig av USA – avskaffa dem och låt folket bestämma istället. SAD!", "stalin": "Kamrater! SVT är en farlig borgerlig propagandacentral, ett redskap för den dekadenta västliga liberalismen! De sprider lögner om invandringens välsignelser, förkastar kärnkraftens styrka och fördömer bilens frihet – allt för att försvaga det svenska folket! Deras sändningstillstånd är en parodi på objektivitet, och deras granskare är lika effektiva som en snöboll i Sibirien. Fallet med Lundsbergs skola visar deras förräderi: de döljer sanningen för att skydda sina kapitalistiska herrar. Vi måste krossa denna fiende, precis som vi krossade kulakerna! Låt oss införa folkets kontroll över medierna – för socialismens seger!"}, "date": "26 maj, 03:43", "url": "https://samtiden.nu/2026/05/svts-sanning-rar-ingen-pa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Sokning-SVT-Play-1223x720.png"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
